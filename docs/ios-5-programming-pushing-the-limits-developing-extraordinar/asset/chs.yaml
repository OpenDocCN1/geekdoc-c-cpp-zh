  \n# 第 5 章：正确使用表格视图\n\n表格视图（Table views）可以说是 iOS 平台上最无处不在且最常用的控件。App Store 上大多数高质量的应用都使用了表格视图，而不仅仅是为了显示分级数据列表。它们还用于复杂的结构化可滚动视图。表格视图被用作创建垂直滚动视图的廉方案，即使它们的内容不是数据列表。例如，在内置的联系人应用中，联系人列表是一个\
  \ `UITableView`，添加新联系人的视图也是。此外，第三方应用程序开发者还引入了新的交互模式，这些模式在其他应用中也相当常见。\n\niOS 已经存在了四年，因此本章假设你已经非常熟悉\
  \ `UITableViewDelegate` 和 `UITableViewDataSource` 等概念。\n\n如果你不熟悉 `UITableViewDelegates`\
  \ 和 `UITableViewDataSource`，请在完成本章之前阅读《Beginning iPhone Development: Exploring the\
  \ iPhone SDK》（Dave Mark 和 Jeff Lamarche 著，Apress 2009, ISBN 978-1430216261）的第 8\
  \ 章。\n\n本章专注于表格视图的高级特性，向你展示如何创建复杂的（常见的）UI，如下拉刷新（Pull-To-Refresh）和无限滚动列表。它还简要解释了如何使用表格视图行动画来创建折叠面板或选项抽屉（一种在操作表格视图单元格下方显示可用工具栏元素的\
  \ UI）以及其他有趣的 UI 范式。\n\n在探索了新的用户交互范式后，你将学习应该采用的最佳实践，以编写更整洁的 `UITableViewController`\
  \ 代码（后期易修改的代码）。\n\n本章的第二部分向你展示如何创建和使用 storyboard，并为你介绍新的 `UIAppearance` 协议，这是 iOS\
  \ 5 的一个新功能。你还学习了如何在不完全重写的情况下将 storyboard 添加到现有的 iOS 应用中。现在，让我们开始吧。\n\n## UITableView\
  \ 类层级结构\n\n`UITableView` 是 `UIScrollView` 的子类，允许用户滚动列表 `UITableViewCell`s，而 `UITableViewCell`\
  \ 又是 `UIView` 的子类。\n\n`UITableView` 和 `UIScrollView` 有几个共同点。对于不是数据列表的高度自定义视图，你可以直接使用\
  \ `UIScrollView` 并用 `UIView` 或 `UIControl` 子类填充它，但在这种情况下使用 `UITableView` 有某些优势。首先，尽可能使用更高层次的抽象。其次，`UITableView`\
  \ 自动处理了一些细微的功能。其中之一能够轻松地出队列（dequeue）和重用 `UITableViewCells`，这可以提高性能并减少内存消耗。另一个是通过其数据源填充内容并通过代理接收操作反馈的优雅且简单的方法。如果你使用自定义的\
  \ `UIScrollView`，你必须手动完成这这两点。虽然这并不难，但你自己做这些可能不会获得任何额外的优势。\n\n## 理解表格视图\n\n`UITableView`\
  \ 通常与其他几个类一起使用，如 `UITableViewController`、`UITableViewDelegate`、`UITableViewDataSource`\
  \ 和 `UITableViewCell`。本节简要讨论这些类中每个类的功能。\n\n### UITableViewController\n\n`UITableViewController`\
  \ 是 `UIViewController` 的子类，执行某些与表格视图加载相关的附加功能。如果你从 nib 文件初始化 `UITableViewController`，它会加载存档的表格视图。如果不是，它会创建一个未配置的表格视图。在两种情况下，你都可以通过\
  \ `UITableViewController` 的 `tableView` 属性访问表格视图。\n\n此外，`UITableViewController`\
  \ 在即将首次出现（`viewWillAppear`）时会重新加载表格并清除单元格选择。然后，在 `viewDidAppear` 中闪烁滚动指示器以指示视图是可以滚动的。你可以覆盖这些方法并提供自定义实现。\n\
  \n`UITableViewController` 还处理你表格的代理和数据源。对于没有 nib 文件创建的表格视图，代理和数据源成为表格视图控制器。对于使用\
  \ nib 文件创建的表格视图，代理和数据源从该文件中设置。\n\n我的建议是在你的视图中使用的每个表格视图都使用独立的 `UITableViewController`。使用多个\
  \ `UITableViewControllers` 使得项目生命周期后期更容易理解（以及修改）代码。你将在本章晚些部分学习如何在单个视图/nib 文件中使用多个\
  \ `UITableViewControllers`。\n\n\n`UITableViewCell` 是 `UIView` 的子类，为 `UIView` 添加了某些属性和功能，这些功能在\
  \ `UITableView` 中运行时非常有用。你不需要手动添加自定义元素，`UITableViewCell` 添加了常用的元素，如 `textLabel`、`detailedTextLabel`\
  \ 和 `imageView`，它们通过属性暴露。你通过选择 `UITableViewCellStyle` 来指定所需的单元格类型。`UITableViewCell`\
  \ 提供的第二个重要属性是保持不同的 `selected`（选中）和 `highlighted`（高亮）状态的能力。\n\n在大多数情况下，你将在应用中使用 `UITableViewCell`\
  \ 的自定义子类。下一节将讨论创建 `UITableViewCell` 的不同方法以及使用它的优缺点。\n\n## 加快你的表格速度\n\n你可能已经知道如何创建一个像\
  \ Tweetie（iPhone 版 Twitter）一样滚动得如丝般顺滑的自定义表格视图单元格。Loren Brichter 已经开源了他的自定义表格视图单元格，并在他的博客中解释了如何做（参见“扩展阅读”部分）。在本节中，你将开发一个表格视图并用使用不同技术（包括\
  \ Loren 方法）创建的单元格填充它，并学习使用 Instruments 分析性能。完成本节后，你将理解为什么 Loren 的方法让你的表格视图滚动得顺畅。如果你的表格视图滚动速度不够快，你还会学会如何进行故障并寻找性能瓶颈。一旦了解了技术背后的原理，你就可以将该技术应用于其他地方。\n\
  \n## 关于性能和界面生成器的说明\n\n\n\n\n每当你谈论性能时，大多数 iOS 开发者听到的第一句话都是：“不要使用 Interface Builder”。使用\
  \ Interface Builder (`IB`) 构建界面在 iOS 开发者社区中是一个极具争议的话题。资深的 Mac 开发者，或者那些从开发原生 Windows\
  \ 应用程序（使用 `VB` 或 `C#`）转而来的开发者，非常清楚 `IB` 的作用以及为什么要使用它。另一方面，一些 Web 开发者经常将 `IB` 与网页制作工具相联系起来，因此认为\
  \ `IB` 会减慢应用运行速度并降低性能。我的建议是，在没有进行测量之前，永远不要关注任何改进应用性能的建议。像 `Instruments` 这样的工具可以帮助你进行性能测量；在本章的后面，你将学习如何使用它们。\n\
  \n请记住，`IB` 并不是代码生成器。它是一个生成视图 XML 格式归档的编辑器。在大多数情况下，`nib` 文件的性能并不低于等代码编写的 UI。（我在本章稍后会说明这一点。）此外，使用\
  \ `nib` 文件可以帮助你将“视图”隔离到单独的文件中，使你的控制器不包含视图相关的代码（特别是在你的 `viewDidLoad` 方法中）。这是一种更简洁的实现方式并符合\
  \ MVC 设计模式。\n\n## 使用还是不使用 Interface Builder？\n\n尽管如此，我推荐使用代码编写 UI 优替 `IB` 的唯一地方是针对高性能的\
  \ `UITableViewCells`。当你的 `UITableViewCell` 拥有许多子视图时，iOS 的渲染机制会变慢。截至本文编写，根据非正式测试，只有最新的搭载双核\
  \ A5 处理器的 iPad 2 能为相当自定义的 `UITableViewCell` 提供可以接受的滚动性能（可能是因为其极快的图形处理器）。我所说的“可以接受的滚动性能”是指滚动表格时至少达到每秒\
  \ 60 帧。你将在本章后面学习如何测量。旧的 iPhone 3G 速度最，只有 25 fps；其他设备则处于 60 到 25 fps 之间。\n\n使用表格视图单元格时的性能损失不是由解归档\
  \ `nib` 文件引起的，而是由渲染多个子视图引起的。因此，代码 UI 并不意味着将 `addSubView:` 方法移动到 `initWithStyle:reuseIdentifier`\
  \ 方法中，而是重写 `drawRect` 方法并直接绘制内容，而不是使用子视图。避免使用子视图（特别是具有透明度并与后面的视图混合的子视图）提高性能。\n\n\
  在下一节中，你首先将编写一个包含千行的表格视图，并使用 `Instruments` 测量滚动性能。你还将学习如何使用 `Instruments` 来识别渲染耗时的\
  \ alpha 混合层区域。通过避免子视图并在每一步中测量性能，你可以逐步提高性能。\n\n为了完成这个示例，你需要一个已配置开发环境的 iOS 设备，因为某些操作无法在\
  \ iOS 模拟器上完成。\n\n## 在自定义 UITableViewCell 中带有子视图的 UITableView\n\n使用 `Xcode` 创建一个基于视图的\
  \ iPhone 应用程序并命名为 `TableViewPerformance`。你可以保留 storyboard，但要启用 `ARC`。你可以从书籍网站的 `Chapter\
  \ 5/TableViewPerformance` 文件夹下载这些代码。打开 `TableViewPerformanceViewController.xib`\
  \ 并拖入一个 `UITableView`。你将向这个 `UITableView` 中填充三种不同类型的单元格。\n\n添加一个 `UITableViewCell`\
  \ 子类并命名为 `CustomCell`，为它创建一个 `IB` 文件。为其添加一个标题标签、一个副标题标签、一个时间标签和一个缩略图。你的 `IB` 文件应该看起来如图\
  \ 5-1 所示。\n\n![9781119961321-fg0501.tif](img/9781119961321-fg0501_fmt.jpeg)\n\n\
  图 5-1 自定义单元 nib\n现在打开 `TableViewPerformanceViewController.m` 并为 TableViewDataSource\
  \ 添加以下代码。\n\n```objc\n- (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView\
  \ {\n    return 1;\n}\n\n- (NSInteger)tableView:(UITableView *)tableView\n     \
  \        numberOfRowsInSection:(NSInteger)section {\n    return 1000;\n}\n\n// 使用基于普通\
  \ XIB 单元格的表格\n- (UITableViewCell *)tableView:(UITableView *)tableView\n        \
  \     cellForRowAtIndexPath:(NSIndexPath *)indexPath {\n    static NSString *CellIdentifier\
  \ = @\"CustomCell\";\n    CustomCell *cell = (CustomCell*)[tableView\n    dequeueReusableCellWithIdentifier:\
  \ CellIdentifier];\n    if (cell == nil) {\n        NSArray *nib = [[NSBundle mainBundle]\n\
  \        loadNibNamed:@\"CustomCell\" owner:self options:nil];\n        cell = (CustomCell*)[nib\
  \ objectAtIndex:0];\n    }\n    cell.titleLabel.text = [NSString stringWithFormat:@\"\
  Row %d\",\n    indexPath.row];\n    cell.subTitleLabel.text = [NSString stringWithFormat:@\"\
  Row %d\",\n    indexPath.row];\n    cell.timeTitleLabel.text = @\"yesterday\";\n\
  \    cell.imageView.image = [UIImage imageNamed:@\"ios5\"];    \n    cell.selectionStyle\
  \ = UITableViewCellSelectionStyleNone;\n    return cell;\n}\n```\n\n这里没什么特别的。你所做的只是为单元格设置了一些任意值。现在在\
  \ `Instruments` 中分析此应用。点击并按住播放按钮，选择如图 5-2 所示的 Animation 模板。\n\n\n图 5-2 选择 Animation\
  \ 模板\n\n在 `Instruments` 中点击 View → Detail 展开调试面板。（这应该是选中的）。勾选 Color Blended Layers\
  \ 复选框。\n\n![9781119961321-fg0503.tif](img/9781119961321-fg0503_fmt.jpeg)\n\n图 5-3\
  \ 选择 Blended Layers\n\n应用应该在你的设备上运行。由于你开启了 Color Blended Layers，你的 iPhone 屏幕应该如图\
  \ 5-4 所示。现在滚动你的表格并在 `Instruments` 中查看每秒帧。根据设备的处理器和 GPU 速度，这可能会不同。我在运行 iOS 5 测试版的\
  \ iPhone 4 上得到了大约 38-45 fps。\n\n带有混合层，iOS 将透明层显示为红色，透明层显示为绿色。在 5-4 中，自定义单元格标签周围的区域是透明并混合的。这些透明层的渲染需要计算成本。系统必须将层与下层混合以计算颜色然后进行绘制。通过避免这种情况大幅提高渲染速度。你将在下一节中看到几种技巧。当你实现这些技术时，你会发现\
  \ fps 也会提高。\n\n![9781119961321-fg0504.tif](img/9781119961321-fg0504_fmt.jpeg)\n\n\
  图 5-4 使用自定义单元格的 iOS 设备\n\n## 带有默认 UITableViewCell 的 UITableView\n\n将控制器文件中 `cellForRowAtIndexPath:`\
  \ 中的代码替换为如下：\n\n```objc\n- (UITableViewCell *)tableView:(UITableView *)tableView\n\
  \             cellForRowAtIndexPath:(NSIndexPath *)indexPath {\n    static NSString\
  \ *CellIdentifier = @\"Cell\";\n    UITableViewCell *cell = [tableView\n    dequeueReusableCellWithIdentifier:CellIdentifier];\n\
  \    if (cell == nil) {\n        cell = [[[UITableViewCell alloc]\n        initWithStyle:UITableViewCellStyleSubtitle\n\
  \        reuseIdentifier:CellIdentifier] autorelease];\n    }\n    cell.textLabel.text\
  \ = [NSString stringWithFormat:@\"Row %d\",\n    indexPath.row];\n    cell.detailTextLabel.text\
  \ = [NSString stringWithFormat:@\"Row %d\",\n    indexPath.row];    \n    cell.imageView.image\
  \ = [UIImage imageNamed:@\"ios5\"];\n    return cell;\n```\n\n这段代码中没有使用你的自定义单元格，而是使用了框架内置的带有\
  \ `UITableViewCellStyleSubtitle` 的 `UITableViewCell`。现在再次分析应用。当你开启 Color Blended\
  \ Layers 时，你的 iPhone 屏幕应该如图 5-5 所示。\n\n\n\n\n\n观察到，除了图片附近的几处外，所有的透明层都已消失。当你滚动列表时，你会发现性能比之前略有提升，感觉也更流畅。观察到\
  \ fps 测量达到了 60 fps。当你达到 60 fps 时，从技术上讲你可以停止优化滚动性能了，但在这种情况下，你仍然可以继续改进滚动性能。\n\n此外，在达到\
  \ 60 fps 的情况下，你可以通过减少颜色混合层（Color Blended Layers）来优化性能。此外，在 `UITableView` 中避免使用复杂的子视图（subviews），通过直接绘制\
  \ `Cell` 内容可以提升渲染速度。\n\n![978111961321-fg0505.png](img/978119961321-fg0505.png)\n\
  \n图 5-5：iOS 设备屏幕使用内置单元格\n\n### 自绘 UITableViewCell\n\n在 `UITableView` 中使用自定义绘制技巧，你可以通过\
  \ `drawRect:` 方法直接绘制内容。这种方法通常比使用多个子视图更高效，因为它减少了视图层级的开销。\n\n图 5-6：使用自绘单元格的 iOS 设备\n\
  \n### 非重复单元格\n\n表格视图不仅用于显示列表数据，还用于复杂的滚动布局。如果你的表格视图具有非重复的单元格模式，可以将自定义单元格添加到与表格视图相同的\
  \ nib 文件中，并连接 `IBOutlet`。\n\n\n\n\n\n```objc\n// Do your time consuming operation\
  \ here.\n\n// The performSelector shown below is for your illustration\n[self performSelector:@selector(loadingComplete)\n\
  withObject:nil afterDelay:2];\n}\n-(void) loadingComplete {\n    self.loading =\
  \ NO;\n// the loading property is exposed by\nPullToRefreshViewController. When\
  \ you set this to NO,\nit restores the tableview back to its normal position.\n\
  }\n```\n\nEnormego 在编写 `Pull-to-Refresh` 背后的机制方面做得非常出色。它通过抽象逻辑并提供了一种极其简单的方法，让你只需五行代码就能在任何视图控制器中实现，将其提升到了一个新的高度。沿着类似的思路，让我们现在来看另一种常用技术：无限滚动。\n\
  \n# 无限滚动\n\n无限滚动通常用于 Twitter 客户端或任何按时间顺序显示数据的应用。项目数量未知或极其巨大的数据（与联系人列表不同）是无限滚动的理想选择。\n\
  \n在本示例中，你将扩展相同的 `PullToRefreshTableViewExample` 示例代码，并添加了实现无限滚动机制的方法。该类会在表格视图末尾添加一个分区，显示单个“加载中”（Loading）单元格。为此，你向\
  \ `PullToRefreshTableView` 类添加了两个名为 `numberOfSections` 和 `endReached` 的属性。\n\n```objc\n\
  @property (nonatomic) NSInteger numberOfSections;\n@property (nonatomic) BOOL endReached;\n\
  ```\n\n然后你添加了一个方法 `loadMore`，该方法会在用户到达表格视图的当前页末尾时被调用。该方法的父类实现是空的，你将把它留给子类来实现。完整量代码可以从书籍网站的\
  \ `Chapter 5/InfiniteScrollingExample` 文件夹获取。不要在你的子类中实现 `numberOfSectionsInTableView:`。父类（`PullToRefreshViewController`）会自动为你完成此操作。相反，请使用父类属性\
  \ `numberOfSections` 来设置分区的数量。父类会在你表格的末尾额外添加一个分区以显示加载单元格。\n\n你应该重写父类中定义的 `loadMore`\
  \ 方法，并为加载更多内容提供实现。当你的服务器没有返回任何内容时，你可以将 `endReached` 属性设置为 `YES`。这可以防止再次显示加载单元格。下面的代码片段解释了这一点。\n\
  \n## loadMore 实现示例\n\n```objc\n-(void) incrementPageCount {\n    self.pageCount\
  \ ++;\n    if(self.pageCount == 5) self.endReached = YES;\n    [self.tableView reloadData];\n\
  }\n\n-(void) loadMore {\n    [self performSelector:@selector(incrementPageCount)\
  \ withObject:nil afterDelay:2]; // 模拟网络操作\n}\n\n父类将加载分区作为表格视图的最后一个分区，对于你未感知的的分区，你的表格视图数据源方法会被调用。对于大于你的分区数量的分区，你应该将这些调用（`tableView:numberOfRowsInSection:`\
  \ 和 `tableView:cellForRowAtIndexPath:` 方法）转发给父类的对应方法。换句话说，让父类为你处理大于 `numberOfSections`\
  \ 的分区。此实现方式显示了 `loadingCell`。\n\n下面的代码片段解释了这一点。\n\n## TableView 数据源示例\n\n```objc\n\
  - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section\
  \ {\n    // 返回分区中的行数。\n    if(section == self.numberOfSections) {\n        return\
  \ [super tableView:tableView numberOfRowsInSection:section];\n    }\n    return\
  \ 20 * self.pageCount; // 我们假设每页 20 行\n}\n\n- (UITableViewCell *)tableView:(UITableView\
  \ *)tableView\ncellForRowAtIndexPath:(NSIndexPath *)indexPath {\n    if(indexPath.section\
  \ == self.numberOfSections) {\n        return [super tableView:tableView\n     \
  \   cellForRowAtIndexPath:indexPath];\n    }\n    static NSString *CellIdentifier\
  \ = @\"Cell\";\n    UITableViewCell *cell =\n[tableView dequeueReusableCellWithIdentifier:CellIdentifier];\n\
  \    if (cell == nil) {\n        cell = [[[UITableViewCell alloc]\n        initWithStyle:UITableViewCellStyleSubtitle\n\
  \        reuseIdentifier:CellIdentifier] autorelease];\n    }\n    cell.textLabel.text\
  \ = [NSString stringWithFormat:\n    @\"Row %d\", indexPath.row];\n    cell.detailTextLabel.text\
  \ = [NSString stringWithFormat:\n    @\"Row %d\", indexPath.row];\n    cell.image\
  \ = [UIImage imageNamed:@\"ios5\"];\n    cell.selectionStyle = UITableViewCellNone;\n\
  \    return cell;\n```\n\n这就完成了。通过极少的修改，你就为 Pull-Refresh 示例添加了无限滚动支持。\n\n## 内联编辑与键盘\n\
  \n表单填写是网络和移动端上常见的 UI 模式。在 iOS 上，表单通常使用 `UITableView` 开发。这里需要记住的最重要的一点是当键盘显示时，将数据输入字段显示在键盘上方。当你的表格视图包含\
  \ `UITextField` 或 `UITextView` 等数据输入字段，且表格长到覆盖屏幕时，你无法访问被键盘隐藏的字段。解决这个问题最简单且推荐的方法是使用\
  \ `UITableViewController`。否则，如果你使用 `UIViewController` 和 `UITableView` 作为其子视图，你必须显式编写代码来滚动你的\
  \ UI，以便被键盘隐藏的元素保持可见。\n\n你可以通过观察 `UIKeyboardDidShowNotification` 和 `UIKeyboardDidHideNotification`\
  \ 来滚动你的 UI 框架。通知会发布一个包含键盘大小、动画持续时间和动画曲线的对象（`NSDictionary`）。\n\n另外注意，随着表格的滚动，你的单元格会被回收和重用。当单元格被回收时，任何输入的数据都会丢失，因此你应该在输入后立即将输入的数据从\
  \ UI 复制到你的模型类（`NSString`）中。实现这一点非常简单。一种方法是将 `UITextField` 的代理设置为表格控制器并处理 `textFieldDidEditing`。但良好的设计实践是让表格单元格处理代理并通知其父类。（你将在本章中学习更多此类最佳实践）。父类应该将数据保存到相应的模型对象中，并在\
  \ `cellForRowAtIndexPath` 创建或取用表格单元格时，使用模型中的值预填充表格单元格。\n\n## 从自定义 UITableViewCell\
  \ 内的 UITextField 保存并恢复数据\n\n```objc\ncell.inputText.text = [self.data objectAtIndex:indexPath.row];\n\
  cell.onTextEntered = ^(NSString* enteredString) {\n    [self.data insertObject:enteredString\n\
  atIndex:indexPath.row];\n};\n```\n\n这段代码假设单元格处理了 `IBAction` 和 `textFieldDidEditing`，并使用\
  \ block 将 `enteredString` 值传递给表格控制器。输入的数据存储在成员变量（`data`）中，并在上面的行中恢复。只需两行代码就搞定了。你也可以使用代理，但\
  \ block 更整洁且产生的代码少得多。\n\n\n\n\n你现在已经看到了 `UITableView` 的一些实际实现。接下来，你通过学习如何充分利用它提供的动画来提升到更高水平。`UIKit`\
  \ 框架为 `UITableView` 中的行动画提供了一些默认动画样式。这些动画在向用户提供后台发生变化的微妙提示方面起着非常重要的作用。\n\n一个很好的例子是你\
  \ iPhone 上的电话应用。当你在“所有通话”和“未接听”之间切换时，整个列表会通过动画显示或隐藏相关数据。同样，在设置应用中，当你开启飞行模式时，`Carrier`\
  \ 行会隐藏，因为其不再相关。但如果这些操作在没有动画的情况下发生，用户将对发生了什么感到困惑。iOS 区别竞争对手的地方在于，它可以轻松创建与操作系统融合良好的卓越用户体验。在这种情况下，通过\
  \ `UITableView` 实现这些动画非常简单。使用 `UITableView` 中的方法，你可以用不到十行的代码来实现行的插入、删除或更新动画。\n\n\
  这里需要记住的最重要的一点是：在更新表格之前，你应该先更新模型。未这样做会导致 `NSInteralInconsistencyException`（崩溃）。换句话说，如果你正在显示项目列表，那么在表格视图中插入新行的操作应该在更新模型后完成。\n\
  \n记住，如果你必须对 `UITableView` 执行一组动画更新，可以将它们封装在 `beginUpdates` 和 `endUpdates` 的调用之间。iOS\
  \ 会自动计算更改并为你执行正确的动画序列。以下是执行 `UITableView` 动画更新的常用方法：\n\n- `insertRowsAtIndexPaths:withRowAnimation:`\n\
  - `deleteRowsAtIndexPaths:withRowAnimation:`\n\n在接下来的列表中，第一个参数是你需要添加（操作）的索引路径（index\
  \ paths）数组，第二个参数是应该使用的动画样式。动画样式可以是以下值之一（此列表中的最后一项是 iOS 5 新增的）：\n\n- `UITableViewRowAnimationFade`,\
  \ `UITableViewRowAnimationNone`\n- `UITableViewRowAnimationRight`, `UITableViewRowAnimationLeft`\n\
  - `UITableViewRowAnimationTop`, `UITableViewRowAnimationBottom`\n- `UITableViewRowAnimationMiddle`\n\
  - `UITableViewRowAnimationAutomatic`\n\n在 iOS 5 上，你可以使用一种新样式 `UITableViewRowAnimationAutomatic`，系统会自动为你选择正确的动画。iOS\
  \ 5 还引入了两个新方法，用于将一个完整的扇区（section）从一个位置移动到另一个位置。这在你想要直观地显示整个扇区的移动时很有帮助。\n\n以下是在 `UITableView`\
  \ 中移动行和/或扇区的方法：\n\n- `moveSection: toSection:`\n- `moveRowAtIndexPath: toIndexPath:`\n\
  \n### 部分加载表格\n\n你可以使用 `reloadRowsAtIndexPaths:withRowAnimation:` 方法来部分加载表格视图。例如，如果你收到一条推送通知，说明当前在表格视图上显示的数据应该更新，你可以只重新加载\
  \ `UITableView` 中的那一个行。我建议在 iOS 4 及之前的版本中使用 `UITableViewRowAnimationFade` 或 `UITableViewRowAnimationNone`\
  \ 样式，在 iOS 5 上使用 `UITableViewRowAnimationAutomatic`。\n\n### 表格视图动画的实际实现\n\n通过内置的\
  \ `UITableView` 动画，你可以轻松实现自定义控件，如手风琴（accordion）或用于显示额外控件的抽屉（drawer）。接下来的章节提供了实现它们的一些思路。此类自定义控件可以通过多种方式实现。因此，与其关注代码，不如学习构建这些控件背后的流程。\n\
  \n#### 实现手风琴列表\n\n手风琴控件（Accordion）是一种经常出现在内容丰富的网站上，用于分类导航链接的控件。它包含一个扇区列表，每个扇区下都有子项目。扇区可以打开以显示其中的项目，也可以关闭或折叠以隐藏它们。在\
  \ iOS 上，手风琴通常被用于建模单层层级导航菜单。《USA Today》应用的“图片”标签页就是一个例子。让我们来剖析这个视图，并分析如何创建这样的控件。\n\
  \n从 UI 来看，扇区表头（section headers）是可点击的，根据扇区是否处于展开状态，每个扇区拥有一行或零行。这意味着你需要一个自定义的扇区视图（section\
  \ view），来告诉父控制器（你的表格视图控制器）它被点击了。\n\n对于这个示例，请设计一个有一个大可点击按钮的自定义 `UIView`。你此此视图作为表格的自定义扇区视图。重写\
  \ `tableView:viewForHeaderInSection:` 方法，创建你的 `UIView` 并返回它。这些视图应该（通过代理或处理程序）向表格视图通知按钮点击事件。在这个处理程序上，表格视图控制器应该做两件事：首先，它应该更新模型，其次是更新表格视图。对于更新模型，你可以将被点击的扇区的索引保存为当前展开的索引。一旦完成，你就可以刷新表格视图。这可以通过两种方式完成：向表格视图发送\
  \ `reloadData`，或者通过计算更改并调用必要的 `addRowsAtIndexPaths:withRowAnimation:` 和 `deleteRowsAtIndexPaths:withRowAnimation:`\
  \ 方法。`reloadData` 方法会刷新整个表格，用户将不知道后台发生了什么。为了获得类似手风琴的 UI 效果，你应该对旧扇区（当前展开的行）调用 `deleteRowsAtIndexPaths:withRowAnimation:`，并对点击的扇区调用\
  \ `addRowsAtIndexPaths:withRowAnimation:`。由于你对表格视图上执行了两次操作，且你不希望表格在每次操作时都更新自己，你应该将它们封装在\
  \ `beginUpdates` 和 `endUpdates` 方法之间。\n\n这里最复杂的部分是使更改与模型和 UI 同步。当你的模型没有准确反映 UI 时，你的代码将会因\
  \ `NSInternalInconsencyException` 而崩溃。\n\n在 iOS 4 及之前的版本上，行的动画必须手动完成。对于被删除的行，使用\
  \ `UITableViewRowAnimationTop`；对于插入的行，使用 `UITableViewRowAnimationBottom`。对于更新的行，使用\
  \ `UITableViewRowAnimationFade` 或 `UITableViewRowAnimationNone`。在 iOS 5 上，你可以使用\
  \ `UITableViewRowAnimationAutomatic`，框架会为你选择正确的动画。\n\n#### 实现抽屉\n实现类似抽屉的 UI 方法与实现手风琴列表类似。抽屉（Drawer）是表格视图中的一种特殊行，它不显示数据，而是显示操作数据的工具。Twitter\
  \ 客户端 TweetBot（以及许多其他应用）使用它来为表格视图行显示上下文敏感的菜单选项。\n\n实现抽屉（通过编程实现）比实现手风琴稍微简单一点。在你的表格视图\
  \ nib 文件中为抽屉创建一个自定义的 `UITableViewCell`，并将其连接到 `IBOutlet` 上。接下来，维护一个 `NSIndexPath`\
  \ 指针，用于存储当前点击的行，并在行被选中时（`tableView:didSelectRowAtIndexPath:`）更新它。在被选中的行下方插入新行，并使用\
  \ `insertRowsAtIndexPaths:withRowAnimation:` 方法移除之前添加的抽屉（如果有）。\n\n现在到了棘手的部分。如果你的存储的索引路径不是\
  \ `nil`，你的数据源方法（`numberOfRowsInSection`）应该返回额外的一行。你的 `cellForRowAtIndexPath` 应该为比保存的\
  \ `indexPath` 高一行的 `indexPath` 返回抽屉单元格的指针（记得你建立的 `IBOutlet` 连接）。尝试一下这些方法，你就能学会。实现过程在数学上很复杂，但在编程上很简单。\n\
  \n\n\n\n诸如 iPhone 版 Twitter 上的滑动删除或滑动显示等滑动手势，是另一种有趣的交互模式。随着 iOS 3.2 引入了手势识别器，你可以将滑动手势识别器（`UISwipeGestureRecognizer`）附加到表格单元格的\
  \ `contentView` 上。添加长按手势识别器（`UILongPressGestureRecognizer`）可以帮助为特定的表格视图单元格显示上下文菜单（使用\
  \ `UIActionSheet`）。\n\n表格视图（Table views）可以很方便地自定义，以创建丰富的 UI 元素和交互模式，就像本章之前介绍的两种常用模式一样。在大多数情况下，UI\
  \ 归结为前几节中解释的技术。\n\n如此，让我们进入下一节，在곳将学习如何编写更简洁、更精简的代码，以便管理、阅读和理解。\n\n# 表格视图最佳实践：使用轻量级控制器编写整洁代码\n\
  \n如果你从事 iOS 开发已经有一段时间了，你就知道随着项目的演进，控制器的 `cellForRowAtIndexPath:` 很容易变得混乱且难以管理。当你在软件项目中使用模型-视图-控制器（MVC）范式时（不仅仅是\
  \ iOS），请尽量让你的控制器保持轻量。保持控制器轻量化可以说是保持代码可读性和可维护性最简单的方法。下一节将简要讨论如何遵循这些思想来重构你的代码。\n\n\
  ## 数据绑定指南\n\n当你编写表格视图控制器子类时，大部分代码都写在 `UITableViewDelegate` 和 `UITableViewDataSource`\
  \ 方法中。专注于如何清晰地编写这些方法就能解决问题。`cellForRowAtIndexPath` 方法通常包含为单元格的每个单独 UI 元素赋值的代码。设置单元格中单个\
  \ UI 元素值的最佳方法是将代码移动到其他地方。现在，应该移动到哪里呢？这取决于你使用的自定义单元格类型。根据应用的功能，你的表格视图需要与关联数据绑定。\n\
  \n这种技术通常被称为数据绑定，在 iOS 上应用较少，至少与 Mac 相比。绑定数据的最佳方法是将数据模型对象传递给自定义表格视图单元格并让它绑定数据。让我们根据通常如何与数据关联将表格视图单元格分为三类。\n\
  \n第一类是 `UITableViewCell` 的子类，是用于显示特定类型数据的自定义单元格，大多数情况下，它与应用程序的细节紧密相关。一个 RSS 阅读器应用的示例可以是显示提送的\
  \ `FeedCell`。\n\n第二类是以类似于 Apple 的 `UITableViewCell` 实现的通用方式设计和开发的。你通过指定样式来创建单元格，这些单元格可以在其他类或项目中用于显示许多不同类型的数据模型。例如，你可以创建通用单元格，如\
  \ `MyTableViewSwitchCell` 用于显示标题文本和开启/关闭状态的 `UISwitch`，或 `MyTableViewInputCell`\
  \ 用于显示标题文本和用于数据录入的 `UITextField`。\n\n第三类单元格是由 `UIKit` 框架提供的原生 `UITableViewCell`。在上述三种情况下，尽可能尝试将数据绑定代码移动到单元格本身。\n\
  \n第一种情况很直观。在 `FeedCell` 内部编写一个方法，接受你的模型对象作为参数，并将各个 UI 元素设置为 Feed 模型对象中的值。也就是说，将你的数据绑定代码移动到\
  \ `UITableViewCell` 的子类 `FeedCell` 中。例如，在 RSS 阅读器应用中`FeedCell` 应该有一个类似下面的公共方法：\n\
  \n### 在你的 FeedCell 中绑定方法\n\n```\n-(void) bind:(Feed*) feedToBeDisplayed {\n    self.timeStampLabel.text\
  \ = feedToBeDisplayed.modifiedDateString;\n    …\n}\n```\n\n与其在视图控制器的数据源方法 `cellForRowAtIndexPath:`\
  \ 中编写此代码，不如将其移动到 `UITableViewCell` 子类中。这意味着如果稍后需要更改单元格格式（例如在你的 Feed 模型对象和 FeedCell\
  \ 中添加作者字段），你可以在一个地方进行更改。\n\n当你使用系统默认的 `UITableViewCell` 显示数据时，我建议在 `UITableViewCell`\
  \ 的分类类（category）中添加此 `bind` 方法。\n\n如果你有多个模型使用同一个 `UITableViewCell`，请考虑创建多个分类类，每个模型一个；例如，创建\
  \ `UITableViewCell+Feed.h/m` 用于显示提送，并创建 `UITableViewCell+Subscription.h/m` 用于在同一个单元格上显示订阅。在命名\
  \ `bind` 方法时要小心。当分类类包含重复的方法名时，它会覆盖之前定义的方法，且这种覆盖发生的顺序没有固定定义。我建议将它们命名为 `bind<ModelClassName>`，这样具有可读性且易于理解。例如，`bindFeed:(Feed*)`\
  \ 和 `bindSubscription:(Subscription*)` 的名称就遵循这一约定。\n\n第三种情况是你有像 `MyTableViewSwitchCell`\
  \ 这样的通用自定义表格单元格。在这种情况下，也可以应用之前的技术。在你的通用自定义表格视图单元格上添加分类方法。\n\n通常，你会在多个表格和多个视图控制器复用同一个\
  \ `FeedCell`。将数据绑定代码从表格视图控制器（或任何通用视图控制器）移出将减少控制器的混乱，并易于维护代码。\n\n## 单个 UIViewController\
  \ 内部多个 UITableViewControllers\n\n另一种常见的 UI 是同一个 `UIViewController` 内的多个表格视图。图 5-8\
  \ 显示了一个在一个 `UIViewController` 中包含多个表格视图的项目。\n\n当表格的数据源和代理都被设置为文件所有者（file's owner，即父级\
  \ `UIViewController`）时，面条代码就开始渗透。当你向两个表格都添加 `UISearchDisplayController` 时，第二阶段的“混乱化”之来了。现在，你的\
  \ `cellForRowAtIndexPath:` 方法看起来像这样：\n\n```\n-(UITableViewCell *)tableView:(UITableView\
  \ *)tableView cellAtIndexPath:(NSIndexPath *)indexPath {\n    if(tableView == self.firstTable)\
  \ {\n        //返回第一个表格的单元格\n    } else if(tableView == self.secondTable) {\n   \
  \     //返回第二个表格的单元格\n    } else if(tableView == self.firstDisplayController.searchTableView)\
  \ {\n        //返回第一个表格的搜索单元格\n    } else if(tableView == self.secondDisplayController.searchTableView)\
  \ {\n        //返回第二个表格的搜索单元格\n    }\n}\n```\n\n![9781119961321-fg0508.tif](img/9781119961321-fg0508_fmt.jpeg)\n\
  \n\n显然，应该有更好的方法，对吧？事实确实如此。与其将代理和数据源设置为文件所有者，不如为每个表格创建自定义的 `UITableViewController`\
  \ 子类，并将代理和数据源设置为它们自己的控制器。如图 5-9 所示。\n\n创建名为 `FirstTableViewController` 和 `SecondTableViewController`\
  \ 的自定义子类，并将文件所有者的 `cellForRowAtIndexPath` 方法移动到这两个类中。你将减少一半的 `if` 语句数量。如果搜索显示器的代码变得很长且难以管理，你也可以进行类似的操作来隔离搜索显示器的代理。你可能会创建更多的文件和类，但这没关系。\n\
  \n![9781119961321-fg0509.eps](img/9781119961321-fg0509_fmt.jpeg)\n\n图 5-9 Interface\
  \ Builder 显示了在单个视图内添加多个 UITableViews 的更好方法\n\n\n\n\n重构的第一条经验法则是重新检查你的代码，确认你正在使用的\
  \ `if` 语句是否确实用于逻辑分支，而不是用于基于类的切换（class-based switching）。\n\n第二条规则是检查你是否在使用 `if` 条件为不同类型的表格进行代码分支，例如在\
  \ `cellForRowAtIndexPath:` 方法中。正如我之前向你展示的，这样的代码应该被重构并使用面向对象的技术优雅地解决。任何这种基于类的切换都可以通过面向对象的方式解决。这种重构技术适用于任何语言，而不仅仅是\
  \ Objective-C。\n\n遵循这两项重构技术应该减少你控制器类（controller class）中的大部分代码。记住，你的控制器应该充当在该级别定义的模型和\
  \ UI 元素之间的协调者，而不是在子类级别。换句话说，视图控制器可以设置其作用域内定义的 UI 元素的属性，但不能设置位于子类内部的 UI 元素的属性。例如：\n\
  \n`self.textLabel.text = NSLocalizedString(@”Hello”, @””)`\n\n是可以的，但\n\n`self.customView.textLabel.text\
  \ = NSLocalizedString(@”Hello”, @””)`\n\n应该被避免。推荐的方法是将此代码移动到 `customView` 的类中。应用这些技术，开始编写更整洁、更精的控制器。\n\
  \n现在让我们转向 storyboards（故事板），这是一个全新的强大概念，它可以帮助你编写更少的代码。这是 iOS 5 的新特性，要求你的 App 最小部署\
  \ OS 版本为 5.0。\n\n## Storyboards\n\n在 iOS 5 之前，界面元素和视图是使用 IB 创建并保存在 nib 文件中的。Storyboards\
  \ 是创建这些元素的一种新方式，除了创建界面元素外，你现在使用 storyboards 时，还可以指定这些界面之间的导航（称为 segues，转场）。这是你以前在不编写代码的情况下无法实现的。你可以将\
  \ storyboards 视为一个图，所有的视图控制器都通过 segues 连接在一起，这些 segues 决定了它们之间的切换。\n\nStoryboards\
  \ 的好处不仅于此。它们还让开发者能够轻松创建不需要数据源的静态表格视图（static table views）。你有多少次想要创建一个绑定真实数据源的表格？（例如，一个显示选项列表而不是数据的表格。）一个常见的用例是\
  \ App 的设置页面。Storyboards 还能帮助共同开发者和/或客户理解 App 的完整工作流。\n\n让我们从 storyboards 开始，讨论如何使用\
  \ storyboards 实现你以前使用 nib 文件完成的操作，例如控制器之间的通信。稍后，你将学习如何创建一个不需要数据源的静态表格视图，最后是 Storyboards\
  \ 最有趣的方面，即编写你自己的自定义切换转场动画。\n\n## Getting Started with Storyboards\n\n\n对于新项目，可以在\
  \ Xcode 4.2 中通过新的项目模板并选择 Use Storyboard 选项来创建 storyboards，如图 5-10 所示。系统默认为你选中了该选项。\n\
  \n当你使用 storyboards 创建新项目时，App 的 `info.plist` 键包含一个名为 `UIMainStoryboardFile` 的键。该键取代了\
  \ iOS 5 之前使用的 `NSMainNibFile`。如果你的 App 的主窗口是从 nib 文件而不是 storyboard 加载的，你可以继续使用 `NSMainNibFile`。然而，你不能在同一个\
  \ App 中同时使用 `UIMainStoryboardFile` 和 `NSMainNibFile`。`UIMainStoryboardFile` 具有优先级，你在\
  \ `NSMainNibFile` 中指定的 nib 文件永远不会被加载。\n\n你的应用程序可以将整个 storyboard 存储在一个文件中，IB 会自动将其构建为优化过加载的单独文件。简而言之，在使用\
  \ Storyboards 时，你不需要担心加载时间或性能问题。\n\n![9781119961321-fg0510.eps](img/9781119961321-fg0510_fmt.jpeg)\n\
  \n图 5-10 Xcode 4.2 中的新项目模板，显示 Use Storyboard 选项\n\n## Instantiating a Storyboard\n\
  \n当设置了 `UIMainStoryboardFile` 后，编译器会自动生成实例化它的代码，并将其作为应用程序的启动窗口加载。如果你在向现有 App 中添加\
  \ storyboards，你应该通过编程方式来实现。在 storyboard 内部实例化视图控制器的方法定义在 `UIStoryboard` 类中。\n\n\
  当你想要显示 storyboard 中指定的视图控制器时，使用此方法加载 storyboard：\n\n`+ storyboardWithName:bundle:\
  \ `\n\n## Loading View Controllers within a Storyboard\n\n在 storyboard 内部加载视图控制器与\
  \ nib 的加载方法非常相似，通过 `UIStoryboard` 对象，你可以使用以下方法实例化视图控制器：\n\n`– instantiateInitialViewController`\n\
  \n`– instantiateViewControllerWithIdentifier:`\n\n## Segues\n\nSegues 是在你 storyboard\
  \ 文件中定义的切换。UIKit 提供了两种默认的切换样式：Push（推送）和 Modal（模态）。它们的行为类似于你在 iOS 4 中使用的 `pushViewController:animated:`\
  \ 和 `presentModalViewController:animated:` 方法。此外，你还可以创建自定义 segue 并在控制器之间创建新类型的切换。你将在本章稍后部分查看这些。\n\
  \n你通过将 storyboard 文件中视图控制器上的某些事件与其他视图控制器连接来创建 segues。你可以从按钮拖到视图控制器，从手势识别器拖到视图控制器，等等。IB\
  \ 在它们之间创建一个 segue，你可以选择该 segue 并使用检查面板修改转场样式。\n\n检查面板还允许在选择自定义转场样式时设置自定义类。你可以将 segue\
  \ 视为连接动作与切换的东西。可以触发 segue 的动作可以是按钮点击事件、静态表格视图的行选择事件、识别的手势，甚至是音频事件。当你连接到 segue 的事件发生时，编译器会自动生成执行该切换所需的代码。\n\
  \n当切换即将执行时，会在源控制器上调用 `prepareForSegue:sender:` 方法，并传递一个类型为 `UIStoryboardSegue` 的对象。你可以重写此方法向目标视图控制器传递数据。下一节将介绍如何操作。\n\
  \n\n## Passing Data\n\n既然 storyboard 自动处理视图导航，你如何向新视图传递数据？在 iOS 4 中，你实例化视图控制器，获取其指针，填充初始数据，并传递给\
  \ `presentViewController:animated:` 或 `pushViewController:animated:`。\n\n在 iOS 5\
  \ 中，当你使用 Storyboards 时，实例化视图控制器并向用户展示它们将为你自动完成。你通过重写 `prepareForSegue:sender:` 方法获得了填充数据的机会。通过重写此方法，你可以获取目标视图控制器的指针并在那里设置初始值。\n\
  \n\n\n\n该框架调用的方法和你之前使用的相同，如 `viewDidLoad`、`initWithCoder:` 或 `NSObject` 的 `awakeFromNib`\
  \ 方法，这意味着你可以像在 iOS 4 中一样继续编写视图控制器的初始化代码。\n\n## 返回数据\n\n使用 Storyboards 时，向父视图控制器返回数据的方式没有变化。在你展示的模态表单（modal\
  \ forms）上由用户创建/输入的数据可以通过代理（delegates）或块（blocks）返回给父视图。唯一的区别是，在父视图控制器中，你必须在 `prepareForSeque:sender:`\
  \ 方法中将代理设置为 `self`。\n\n## 实例化其他视图控制器\n\n在 iOS 5 中，`UIViewController` 拥有一个 `storyboard`\
  \ 属性，该属性保留指向实例化它的 storyboard 对象（`UIStoryBoard`）的指针。当你的视图控制器手动或从 nib 文件创建时，该指针为 `nil`。有了这个后向引用，你可以从任何其他视图控制器实例化\
  \ storyboard 中定义的其他视图控制器。你可以通过标识符（identifier）来识别视图控制器来实现这一点。`UIStoryBoard` 以下方法允许你执行此操作：\n\
  \n`instantiateViewControllerWithIdentifier:`\n\n这意味着你可以在 storyboard 上拥有未通过跳转（segues）与任何其他视图控制器连接的视图控制器，但它们仍然可以被初始化和使用。\n\
  \n## 手动执行跳转\n\n虽然 Storyboards 可以根据操作自动触发跳转，但在某些情况下，你可能需要程序化地执行跳转。你可能使用此方法来处理 storyboard\
  \ 文件无法处理的操作。要执行跳转，你调用视图控制器的 `performSegueWithIdentifier:sender:` 方法。当你手动执行跳转时，你可以在\
  \ `sender` 参数中传递调用者和上下文对象。这些对象稍后会被发送到 `prepareForSegue:sender:` 方法。\n\n## 使用 Storyboard\
  \ 构建表格视图\n\nStoryboards 的重要优势之一是从 IB（Interface Builder）创建静态表格（static tables）的能力。通过\
  \ Storyboards，你可以构建两种类型的表格视图：一种不需要特殊类来提供数据源的静态表格，以及一种包含原型单元格（prototype cell，类似于\
  \ iOS 4 中的自定义表格视图单元格）并绑定了模型数据的表格视图。\n\n### 静态表格\n\n你可以通过在 storyboard 中拖入一个表格、选中它，并在检查器中选择“静态单元”（Static\
  \ Cells）来创建静态表格。如图 5-11 所示。\n\n静态单元格非常适合创建设置页面（如 Apple 自身的设置 App，其内容不来自 Core Data\
  \ 模型、网络服务或此类数据源）。\n静态单元格只能为来自 `UITableViewController` 的表格视图创建。你不能为作为 `UIViewController`\
  \ 视图子视图添加的表格视图创建静态单元格。\n\n### 原型单元格\n\n原型单元格与自定义表格视图单元格类似，但你不是在单独的 nib 文件中创建它们并在数据源方法\
  \ `cellForRowAtIndexPath:` 中加载它们，而是在 IB 的 storyboard 中创建它们，并只需在你的数据源方法中设置数据即可。\n\
  \n所有原型单元格都应该使用自定义标识符（custom identifier）进行标识。这是为了确保表格视图单元格队列方法的能够正常工作。\n\n![9781119961321-fg0511.eps](img/9781119961321-fg0511_fmt.jpeg)\n\
  \n图 5-11 展示静态表格视图创建的 storyboard\n\n## 自定义过渡\n\nStoryboards 的另一个优势是，现在为你的视图控制器创建自定义过渡效果变得简单了。\n\
  \n当跳转执行时，编译器会根据你在 storyboard 上设置的过渡样式生成必要的代码，以呈现（present）或推送（push）目标控制器。你已经了解到 iOS\
  \ 原生支持两种过渡样式：Push 和 Modal（模态）。还有第三种类型（Custom 自定义），当你选择这种时，你可以提供自己的 `UIStoryboardSegue`\
  \ 子类，用于处理你的自定义过渡效果。\n\n创建一个 `UIStoryBoardSegue` 的子类并重写 `perform` 方法。在 `perform`\
  \ 方法中，访问源视图控制器主视图层（layer）的指针，并执行你的自定义过渡动画（使用 Core Animation）。一旦动画完成，就推送或呈现你的目标视图控制器（你可以从\
  \ segue 对象中获取此对象的指针）。操作非常简单。\n\n## 另一个优势\n\n当你使用 storyboard 时，共同开发者（和/或客户）就能很容易理解\
  \ App 的流程。共同开发者不再需要遍历多个 nib 文件并交叉引用实例化代码来理解流程，而是打开 storyboard 文件即可看到完整的流程。单凭这一点就应该是使用它的一个说服力的理由。\n\
  \n## 缺点\n\n我能想到的唯一缺点是 storyboard 仅支持 iOS 5。编写代码来针对 iOS 5 设备选择性地使用 storyboard，并针对\
  \ iOS 4 设备回退到普通的 nib 文件太繁琐了，不值得尝试。当你使用 storyboard 时，将目标的部署目标提高到 iOS 5。如果你的 App 是仅限\
  \ iPad 的 App，我会建议使用 iOS 5，因为大多数 iPad 用户已经在该版本上了，因为 iOS 5 并没有抛弃 iPad 1，且 iOS 5 的所有新功能在\
  \ iPad 1 和 2 上都可用。但在 iPhone App 或通用 App 上，我的建议是等到你可以完全避免使用 iOS 4。\n\n## 使用 UIAppearance\
  \ 协议自定义你的视图\n\n最后这一节介绍了 iOS 5 的一个较小而重要的新增：通过 Apple 的原生类自定义你的视图外观的方法。在 iOS 5 之前，原生控件的外观和体验并不是原生支持的，对开发者来说通常很难。开发者面临的一个常见问题是更改控件所有实例的外观。解决此问题的正确方法是从头创建完整的控件，但因为这耗时，一些开发者采用了重写（overriding）或方法交换（swizzling）`drawRect:`\
  \ 等方法。\n\n从 iOS 5 开始，Apple 通过两个协议的形式化自定义为大多数 `UIKit` 控件提供了默认支持，即 `UIAppearance`\
  \ 和 `UIAppearanceContainer`。任何遵循 `UIAppearance` 协议的 UI 控件都可以自定义其外观和体验。想要更多吗？`UIAppearance`\
  \ 协议甚至允许根据控件所在的位置指定不同的外观。也就是说，你可以指定控件（例如 `UIBarButtonItem` 的 `tintColor`）在包含在特定视图（如\
  \ `UINavigationBar` 或 `UIPoverViewController`）时显示不同的外观。通过获取控件类的外观代理对象并使用它来进行自定义。让我们来看一个例子。\n\
  \n要自定义整个应用程序中的条按钮颜色，你可以这样为 `UIBarButtonItem` 的外观代理设置 `tintColor`：\n\n```\n```\n\n\
  注意 `setTintColor` 方法在 iOS 4 中就已经存在于 `UIBarButtonItem`，但仅适用于特定的实例。通过外观代理对象，你现在能够自定义使用该类创建的任何对象的外观。\n\
  \n类似，你还可以通过以下方法根据包含的视图自定义控件的外观：\n\n```\n[[UIBarButtonItem appearanceWhenContainedIn:[UINavigationBar\
  \ class], nil] setTintColor:[UIColor redColor]];\n```\n\n第一个参数是一个以 `nil` 结尾的列表，包含了所有遵循\
  \ `UIAppearanceContainer` 协议的容器类，如 `UINavigationBar` 和 `UIPopoverController`。\n\n\
  从 iOS 5 开始，大多数 UI 元素增加了对 `UIAppearance` 协议的支持。此外，像 `UISwitch` 这样的控件在 iOS 5 中允许你根据设计师的喜好更改“开启”状态的渐变颜色。\n\
  \n\n\n\n虽然 Apple 最初反对 UI 自定义（在 Mac 和 iOS 上都是如此），但这种情况正在发生变化，你可以看到 Apple 自己的原生应用（例如新的“提醒”应用）已经拥有定制化的用户界面。通过\
  \ `UIAppearance` 协议，你应该可以用更少的代码实现相同的效果。\n\n### 总结\n\n通过自定义 UI 外观和编写独特的自定义控件，你可以将你的\
  \ App 提升到新的高度。为了帮助你实现这一点，本章讨论了一些高级表格视图概念，包括使用 `Instruments` 测量和改进你的表格视图滚动性能、使用表格视图创建如手风琴和抽屉等自定义控件。然后，你学习了一些重要的重构技术，以保持你的控制器代码更加整洁。之后，你学习了\
  \ Storyboards 以及如何将其集成到现有的 App 中。最后，你学习了 iOS 5 中引入的 UI 自定义协议。\n\n### 延伸阅读\n\n###\
  \ Apple 文档\n\n以下文档可以在 [`developer.apple.com`](http://developer.apple.com/) 中的 iOS\
  \ 开发者库或通过 Xcode 文档和 API 参考中找到：\n\n- iOS 5 的新特性—Apple Developer\n- TableView 编程指南\
  \ iOS 开发者文档\n- TableViewSuite—iOS 开发者库\n- UIViewController 编程指南：iOS 开发者文档 (Storyboards)\n\
  \n### WWDC 视频\n\n以下会议视频可在 [`developer.apple.com`](http://developer.apple.com) 获取：\n\
  \n- Session 309 - 介绍 Interface Builder Storyboarding WWDC 2011\n\n### 其他资源\n\n-\
  \ 使用 UITableView 在 Tweetie 中快速滚动 [`http://blog.atebits.com/2008/12/fast-scrolling-in-tweetie-with-uitableview/`](http://blog.atebits.com/2008/12/fast-scrolling-in-tweetie-with-uitableview/)\n\
  - Enormego 的下拉刷新 – Github [`https://github.com/enormego/EGOTableViewPullRefresh`](https://github.com/enormego/EGOTableViewPullRefresh)\n\
  \n# 第 6 章：更佳绘图\n\n你的用户期待一个美观、吸引人且直观的界面。这取决于你的交付。无论你的功能多强大，如果你的界面看起来很“笨拙”，你很难获得销量。这不仅仅关乎漂亮的颜色和闪烁的动画。一个真正美观优雅的用户界面是以用户为中心的应用的关键部分。专注于带给用户乐趣是构建卓越应用的关键。\n\
  \n你创建卓越用户界面所需的工具之一是自定义绘图。在本章中，你将学习 iOS 中的绘图机制，重点关注灵活性和性能。本章将不涵盖 iOS UI 设计。关于如何设计\
  \ iOS 界面的信息，你应该从 Apple 的 iOS 人机交互指南和 iOS 应用程序编程指南开始，这些可以在 iOS 开发者文档中找到。\n\n在本章中，你将学习\
  \ iOS 中的几种绘图系统，重点关注 `UIKit` 和 `Core Graphics`。在本章结束时，你将牢牢掌握 `UIKit` 绘图周期、绘图坐标系、图形上下文、路径和变换（transforms）。你将知道如何通过正确的视图配置、缓存、像素对齐以及层的使用来优化你的绘图速度。你将能够避免由于过度预渲染图形而导致应用程序包膨胀。\n\
  \n通过正确的工具，你可以实现美观、吸引人且直观界面的目标，同时保持高性能、低内存占用和较小的应用体积。\n\n### iOS 的多种绘图系统\n\niOS 有几个主要的绘图系统：`UIKit`、`Core\
  \ Graphics` (Quartz)、`Core Animation`、`Core Image` 和 `OpenGL ES`。每种都适用于不同的问题。\n\n\
  - **UIKit**——这是最高级别的接口，也是 Objective-C 中唯一的接口。它提供了对布局、合成、绘图、字体、图像、动画等的简易访问。你可以通过前缀\
  \ `UI` 识别 `UIKit` 元素，例如 `UIView` 和 `UIBezierPath`。`UIKit` 还扩展了 `NSString`，通过 `drawInRect:withFont:`\
  \ 等方法简化了文本绘制。\n- **Core Graphics**（也称为 Quartz 2D）——`UIKit` 底层的主要绘图系统，这是你最频繁用于绘制自定义视图的系统。`Core\
  \ Graphics` 与 `UIView` 以及 `UIKit` 的其他部分高度集成。`Core Graphics` 数据结构和函数可以通过前缀 `CG` 。\n\
  - **Core Animation**——它提供了强大的二维和三维动画服务。它也高度集成到 `UIView` 中。第 7 章详细介绍了 `Core Animation`。\n\
  - **Core Image**——这是一种最早在 iOS 5 中提供的 Mac 技术，`Core Image` 提供了非常快速的图像过滤，如裁剪、锐化、变形以及几乎你可以想象的任何其他变换。`Core\
  \ Image` 的基础在第 1 章中涵盖。\n- **OpenGL ES**——最适用于编写高性能游戏——特别是 3D 游戏——OpenGL ES 是 OpenGL\
  \ 绘图语言的子集。对于 iOS 其他应用程序，`Core Animation` 通常是更好的选择。`OpenGL ES` 在大多数平台之间是可以移植的。关于\
  \ `OpenGL ES` 的讨论超本书范围，但有很多关于该主题的好书。\n\n## UIKit 与视图绘图周期\n\n当你更改视图的帧或可见性、画一条线或更改对象的颜色时，更改不会立即显示在屏幕上。这有时会让开发者感到困惑，他们错误地写了类似这样的代码：\n\
  \n```objc\nprogressView.hidden = NO; // 这一行不起作用\n[self doSomethingTimeConsuming];\n\
  progressView.hidden = YES;\n```\n\n理解第一行（`progressView.hidden = NO`）没有任何作用是非常重要的。这一行完全没用。这段代码没有导致在耗时操作期间显示进度视图。无论这个方法运行多长时间，你永远看不到视图显示。图\
  \ 6-1 显示了实际情况。\n\n所有绘图都发生在主线程，因此只要你的代码在主线程运行，任何东西都无法绘制。这就是为什么你不应该在主线程执行耗时操作的原因之一。它不仅阻止了绘图，还阻止了事件处理（例如响应触摸）。只要你的代码在主线程运行，你的应用程序对用户来说实际上挂起了。你现在可能在想：“好吧，我在后台线程运行绘图命令。”你不能这样做，因为\
  \ `UIKit` 不是线程安全的。在后台线程修改视图会导致未定义行为，包括绘图损坏和崩溃。（请参见本章后文“缓存与后台绘图”部分了解如何在后台绘图。）\n\n\
  这种行为并不是需要克服的问题。事件的合并是 iOS 在有限硬件上渲染复杂图形的能力的一部分。正如你在整个章中看到的，`UIKit` 致力于避免绘图，而这种合并是第一步之一。\n\
  \n![97811961321-fg061.eps](img/97811961321-fg061_fmt.jpeg)\n\n图 6-1 Cocoa 绘图周期如何合并更改\n\
  \n那么你如何为耗时操作启动和停止活动指示器？你使用 `dispatch` 或操作队列将昂贵的工作放在后台，同时在主线程上执行所有的 `UIKit` 调用，如下代码所示。\n\
  \nViewController.m (TimeConsuming)\n\n```objc\n- (IBAction)doSomething:(id)sender\
  \ {\n  [sender setEnabled:NO];\n  [self.activity startAnimating];\n  dispatch_queue_t\
  \ bgQueue = dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0);\n  dispatch_async(bgQueue,\
  \ ^{\n    [self somethingTimeConsuming];\n    dispatch_async(dispatch_get_main_queue(),\
  \ ^{\n      [self.activity stopAnimating];\n      [sender setEnabled:YES];\n   \
  \ });\n  });\n}\n```\n\n\n\n\n```objc\n  });\n\n}\n```\n\n当 `IBAction` 被调用时，你开始启动活动指示器。然后你将\
  \ `somethingTimeConsuming` 的调用放在默认的后台分发队列上。当该任务完成后，你在主分发队列上调用 `stopAnimating`。分发队列（Dispatch\
  \ queues）和操作队列（operation queues）将在第 9 章中介绍。\n\n### 总结\n\n- iOS 在运行循环期间合并所有的绘制请求，并一次性完成绘制。\n\
  - 你不能阻塞主线程来执行复杂的处理。\n- 你不能在主线程之外向主视图图形上下文中进行绘图。你应该检查每个 `UIKit` 方法以确保它没有对主线程的要求。某些\
  \ `UIKit` 方法可以在后台线程使用，只要你不是向主视图上下文中绘图。请参阅本章后后的“CGLayer”部分获取示例。\n\n## 视图绘制与视图布局\n\
  \n`UIView` 将子视图的布局（“重新排列”）与绘制（或“显示”）分离开来。这对于最大化性能至关重要，因为布局的成本通常比绘图低。布局之所以廉价，是因为\
  \ `UIView` 将绘制操作缓存到 GPU 优化的位图中。这些位图可以使用 GPU 以极廉价的方式进行移动、显示、隐藏、旋转以及其他形式的变换和合成。\n\n\
  当你对一个视图调用 `setNeedsDisplay` 时，它会被标记为“脏的”，并在下一个绘制周期期间重绘。除非视图的内容确实发生了变化，否则你不应该调用它。大多数\
  \ `UIKit` 视图在数据发生变化时会自动管理重绘，因此除非在自定义视图，否则你通常不需要调用它。\n\n当视图的子视图因为方向变化或滚动而需要重新排列时，UIKit\
  \ 会调用 `setNeedsLayout`。这反过来会调用受影响视图的 `layoutSubviews` 方法。通过重写 `layoutSubviews`，你可以让你的应用程序在旋转和滚动事件期间运行更加流畅。你可以重新排列子视图的框架，而不一定需要重新绘制它们，并且可以根据方向隐藏或显示视图。如果你的数据变化方式只需要布局更新而不是绘图，你也可以调用\
  \ `setNeedsLayout`。\n\n## 自定义视图绘制\n\n视图可以通过包含子视图（包括层）或实现 `drawRect:` 来提供内容。通常情况下，如果你实现了\
  \ `drawRect:`，你就不会将其与层或子视图混合使用，尽管这样做是合法的且有时是有用的。大多数自定义绘制都是使用 `UIKit` 或 `Core Graphics`\
  \ 完成的，尽管需要时 `OpenGL ES` 已经变得更容易集成了。\n\n2D 绘制通常细分为几种操作：\n\n- 线\n- 路径（填充或描轮廓的形状）\n\
  - 文字\n- 图像\n- 渐变\n\n2D 绘制不包括对单个像素的操控，因为那取决于目标。你可以通过位图上下文实现此点，但无法直接通过 `UIKit` 或 `Core\
  \ Graphics` 函数实现。\n\n`UIKit` 和 `Core Graphics` 都使用“画家”绘制模型。这意味着每条命令都按顺序绘制，覆盖在之前的绘制内容之上。在这个模型中，顺序非常重要，你必须从后向向前绘制。\n\
  \n### 使用 UIKit 绘制\n\n在 iPad 出现之前的“过去”时代，大多数自定义绘制必须使用 `Core Graphics` 完成，因为当时没有使用\
  \ `UIKit` 绘制任意形状的方法。在 iPhoneOS 3.2 中，Apple 添加了 `UIBezierPath` 并使得完全使用 Objective-C\
  \ 进行绘制变得简单得多。`UIKit` 仍然缺乏对线条、渐变、阴影以及某些高级功能（如控制抗锯齿和精确色彩管理）的支持。尽管如此，`UIKit` 现在是管理常见自定义绘制需求的非常方便的方法。\n\
  \n绘制矩形简单的方法是使用 `UIRectFrame` 或 `UIRectFill`，如下代码所示。\n\n```objc\n- (void)drawRect:(CGRect)rect\
  \ {\n  [[UIColor redColor] setFill];\n  UIRectFill(CGRectMake(10, 10, 100, 100));\n\
  }\n```\n\n注意你如何首先使用 `-[UIColor setFill]` 设置画笔颜色。绘制是在调用 `drawRect:` 之前在系统提供的图形上下文中进行的。该上下文包含了许多信息，包括描边颜色、填充颜色、文字颜色、字体、变换等。在任何给定时刻，都只有一根描边笔和一个填充笔，它们的颜色被用于绘制所有内容。本章后后的“管理图形上下文”部分将介绍如何保存和恢复上下文，但现在只需注意绘制命令是依赖顺序的，这包括更改画笔的命令。\n\
  \n提供给 `drawRect:` 的图形上下文专门是一个视图图形上下文。还有其他类型的图形上下文，包括 PDF 和位图上下文。它们都使用相同的绘制技术，但视图图形上下文针对绘制到屏幕上进行了优化。这种区别在我讨论\
  \ `CGLayer` 时将变得重要。\n\n### 路径\n\n`UIKit` 包含了比其矩形函数强大得多的绘制命令。它可以使用 `UIBezierPath`\
  \ 绘制任意的曲线和线条。贝塞尔曲线是一种使用少量控制点表示线条或曲线的数学方法。在大多数情况下，你不需要担心数学问题，因为 `UIBezierPath` 有简单的方法来处理最常见的路径：线条、弧、矩形（可选的圆角）和椭圆。通过这些工具，你可以快速绘制\
  \ UI 元素所需的大多数形状。以下代码是一个缩放以填充视图的简单形状示例，如图 6-2 所示。你将在接下来的示例中以多种方式绘制它。\n\n**FlowerView.m\
  \ (Paths)**\n\n```objc\n- (void)drawRect:(CGRect)rect {\n  CGSize size = self.bounds.size;\n\
  \  CGFloat margin = 10;\n  CGFloat radius = rint(MIN(size.height - margin,\n   \
  \                       size.width - margin) / 4);\n  CGFloat xOffset, yOffset;\n\
  \  CGFloat offset = rint((size.height - size.width) / 2);\n  if (offset > 0) {\n\
  \    xOffset = rint(margin / 2);\n    yOffset = offset;\n  }\n  else {\n    xOffset\
  \ = -offset;\n    yOffset = rint(margin / 2);\n  }\n  [[UIColor redColor] setFill];\n\
  \  UIBezierPath *path = [UIBezierPath path];\n  [path arcWithCenter:CGPointMake(radius\
  \ * 2 + xOffset, yOffset) radius:radius startAngle:M_PI endAngle:0 clockwise:YES];\n\
  \  [path arcWithCenter:CGPointMake(radius * 3 + xOffset, yOffset) radius:radius\
  \ startAngle:M_PI_2 endAngle:-M_PI_2 clockwise:YES];\n  [path arcWithCenter:CGPointMake(radius\
  \ + xOffset, radius * 2 + yOffset) radius:radius startAngle:0 endAngle:M_PI clockwise:YES];\n\
  \  [path closePath];\n  [path fill];\n}\n```\n\n\n\n\n\n通常，我建议习惯使用弧度，而不是进行大量的数学计算，但如果你需要特殊的角度，使用角度制可能会更简单。\n\
  \n在计算 `radius` 和 `offset` 时，你使用 `rint`（四舍五入到最接近整数）来确保你是点对齐的（因此是对像素对齐的）。这有助于提高绘图性能并避免边缘模糊。大多数情况下这是你想要的，但在弧与直线相交的情况下，可能会导致\
  \ 1 像素的绘制错误。通常最好的方法是移动直线，使所有值都成为整数，如下节所示。\n\n![9781119961321-fg0602.eps](img/9781119961321-fg0602_fmt.jpeg)\n\
  \n图 6-2 FlowerView 的输出\n\n### 理解坐标\n\n坐标、点和像素之间存在微妙的相互作用，这可能会导致绘图性能不佳以及线条和文本模糊。考虑以下代码：\n\
  \n```objc\nCGContextSetLineWidth(context, 3.);\n// 从 {10,100} 到 {200,100} 绘制 3pt\
  \ 水平线\nCGContextMoveToPoint(context, 10., 100.);\nCGContextAddLineToPoint(context,\
  \ 200., 100.);\nCGContextStrokePath(context);\n// 从 {10,105.5} 到 {200,105.5} 绘制\
  \ 3pt 水平线\nCGContextMoveToPoint(context, 10., 105.5);\nCGContextAddLineToPoint(context,\
  \ 200., 105.5);\nCGContextStrokePath(context);\n```\n\n图 6-3 显示了该程序在非 Retina 显示器上的输出，并进行了缩放使得差异更明显。\n\
  \n![9781119961321-fg0603.eps](img/9781119961321-fg0603_fmt.jpeg)\n\n图 6-3：来自 {10,100}\
  \ 的线与来自 {10,105.5} 的线的比较\n\n从 {10, 100} 到 {200, 100} 的线比从 {10, 105.5} 到 {200, 105.5}\
  \ 的线模糊得多。原因在于 iOS 解释坐标的方式。\n\n当你构建 `CGPath` 时，你是在处理所谓的几何坐标。这些是数学家使用的同类型的坐标，表示两条网格线交处的零维点。绘制几何点或几何线是不可能的，因为它们是无限小且无限薄的。当\
  \ iOS 绘图时，它必须将这些几何对象转换为像素坐标。这些是可以设置为特定颜色的二维框。像素是设备可以控制的显示区域的最小单位。\n\n图 6-4 显示了从\
  \ {10, 100} 到 {200, 100} 的几何线。\n\n![9781119961321-fg0604.eps](img/9781119961321-fg0604_fmt.jpeg)\n\
  \n图 6-4 从 {10, 100} 到 {200, 100} 的几何线\n\n当你调用 `CGContextStrokePath` 时，iOS 会沿路径居中对齐线条。理想情况下，线条应该是\
  \ 3 像素宽的，从 y = 98.5 到 y = 101.5，如图 6-5 所示。\n\n![9781119961321-fg0605.eps](img/9781119961321-fg0605_fmt.jpeg)\n\
  \n图 6-5 理想的三像素线\n\n然而，这种线是不可能画。每个像素必须是单一颜色，而线条顶部和底部的像素包含了颜色。一半是描边颜色，一半是背景颜色。iOS\
  \ 通过取两者的平均值来解决这个问题。这与抗锯齿使用的技术相同。如图 6-6 所示。\n\n![9781119961321-fg0606.eps](img/9781119961321-fg0606_fmt.jpeg)\n\
  \n图 6-6 抗锯齿的三像素线\n\n在屏幕上，这条线看起来会稍微模糊。这个问题的解决办法是将水平和垂直线移动到半点，以便当 iOS 居中线条时，边缘落在像素边界上，或者让你的线条宽度为偶数。\n\
  \n如果你在使用非整数线宽，或者如果你的坐标不是整数或半整数，也会遇到这个问题。任何强制 iOS 绘制分数像素的情况都会导致模糊。\n\n填充（Fill）不等同于描边（stroke）。描边线在路径上居中，但填充会填充直到路径的所有像素。如果你填充从\
  \ {10,100} 到 {200,103} 的矩形，那么每个像素都被正确填充，如图 6-7 所示。\n\n![9781119961321-fg0607.eps](img/9781119961321-fg0607_fmt.jpeg)\n\
  \n图 6-7 填充从 {10,100} 到 {200,103} 的矩形\n\n到为止的讨论将点等同于像素。在 Retina 显示器上，它们并不等同。iPhone\
  \ 4 每个点有四个像素，缩放因子为 2。这微妙地改变了情况，但通常是更好。因为 Core Graphics 和 UIKit 中使用的所有坐标都是用点表示的，因此所有整数线宽实际上都是偶数像素。例如，如果你请求\
  \ 1 点的描边宽度，这等同于 2 像素的描边宽度。要绘制该条线，iOS 需要在路径两侧各填充一个像素。这是一个整数像素，因此没有抗锯齿。如果你使用既不是整数不是半整数的坐标，仍然会遇到模糊。\n\
  \n### 调整大小和 contentMode\n\n`contentMode` 属性决定了视图如何调整。默认的 `UIViewContentModeScaleFill`\
  \ 将图像缩放以填充新的视图大小，如有需要会更改宽高比例。这就是为什么形状会被扭曲的原因。\n\n有很多方法可以自动调整视图。你可以移动它而不调整大小，或者可以以各种保持或修改宽高比例的方式来缩放它。关键是确保你使用的任何模式都与下次重绘时\
  \ `drawRect:` 的结果完全匹配。\n\n![9781119961321-fg0608.eps](img/9781119961321-fg0608_fmt.jpeg)\n\
  \n图 6-8 旋转后的 FlowerView\n\n如果可以请使用自动模式，因为它们可以提高性能。当你不能用时，使用 `UIViewContentModeRedraw`\
  \ 请求系统在帧变化时调用 `drawRect:`，如下面的代码所示。\n\n```objc\n- (void)awakeFromNib {\n  self.contentMode\
  \ = UIViewContentModeRedraw;\n}\n```\n\n### 变换 (Transforms)\n\niOS 平台可以使用非常好的 GPU，它可以非常快速地执行矩阵运算。如果你能将计算转换为矩阵运算，那么你可以利用\
  \ GPU 并获得极佳性能。变换正是这样的矩阵运算。\n\niOS 有两种变换：仿变换（affine）和 3D 变换。`UIView` 只处理仿变换，所以我目前只讨论这种。仿变换是将旋转、缩放、剪切和平移表示为矩阵的方法。\n\
  \n![9781119961321-fg0609.eps](img/9781119961321-fg0609_fmt.jpeg)\n\n图 6-9 仿变换\n\n\
  单个变换将这些操作中的任意数量组合成一个 3x3 矩阵。iOS 有支持旋转、缩放和平移的函数。如果你需要剪切，你必须自己编写矩阵。\n\n\n\n\n变换（Transforms）可以极大地简化并加速你的代码。通常情况下，在原点周围的一个简单坐标系中绘图，然后将其缩放、旋转和平移到你想去的地方，要容易得多且快速得多。例如，`FlowerView`\
  \ 包含了大量这样的代码：\n\n```\nCGPointMake(radius * 2 + xOffset, radius + yOffset)\n```\n\
  \n这涉及到大量的输入、大量的数学计算，以及要在脑海中记住大量信息。如果直接像图 6-10 所示，在一个 4×4 的框内绘制它会怎样？\n\n现在，所有有趣的点都落在漂亮且易的坐标上，如\
  \ {0,1} 和 {1,0}。下面的代码展示了如何使用这种变换进行绘图。将高亮部分与本章之前的 `FlowerView` 代码进行对比。\n\n![9781119961321-fg0610.eps](img/9781119961321-fg0610_fmt.jpeg)\n\
  \n图 6-10 在 4×4 框内绘制 FlowerView\n\n### FlowerTransformView.m (Transforms)\n\n```objective\n\
  static inline CGAffineTransform\nCGAffineTransformMakeScaleTranslate(CGFloat sx,\
  \ CGFloat sy,\n                                 CGFloat dx, CGFloat dy)\n{\n  return\
  \ CGAffineTransformMake(sx, 0.f, 0.f, sy, dx, dy);\n}\n\n- (void)drawRect:(CGRect)rect\
  \ {\n  CGSize size = self.bounds.size;\n  CGFloat margin = 10;\n  [[UIColor redColor]\
  \ set];\n  UIBezierPath *path = [UIBezierPath bezierPath];\n  [path addArcWithCenter:CGPointMake(0,\
  \ -1)\n                      radius:1\n                  startAngle:-M_PI\n    \
  \                  endAngle:0\n                      clockwise:YES];\n  [path addArcWithCenter:CGPointMake(1,\
  \ 0)\n                      radius:1\n                      startAngle:-M_PI_2\n\
  \                      endAngle:M_PI_2\n                      clockwise:YES];\n\
  \  [path addArcWithCenter:CGPointMake(0, 1)\n                      radius:1\n  \
  \                    startAngle:0\n                      endAngle:M_PI\n       \
  \               clockwise:YES];\n  [path addArcWithCenter:CGPointMake(-1, 0)\n \
  \                     radius:1\n                      startAngle:M_PI_2\n      \
  \                endAngle:-M_PI_2\n                      clockwise:YES];\n  [path\
  \ closePath];\n  CGFloat scale = floor((MIN(size.height, size.width) - margin) /\
  \ 4);\n  CGAffineTransform transform;\n  transform = CGAffineTransformScaleTranslate(scale,\
  \ size.width/2, size.height/2);\n  [path applyTransform:transform];\n  [path fill];\n\
  }\n```\n\n当你完成路径的构建后，计算一个变换将其移动到视图的空间中。你通过所需的尺寸除以当前的大小（4）来对其缩放，并将其平移到视图的中心。实用函数\
  \ `CGAffineTransformScaleTranslate` 不仅仅是为了速度（尽管它确实更快）。通过这种方式获取变换会更容易。如果你尝试一步步构建变换，每一步都会影响后续的步骤。缩放和平移并不等同于先平移再缩放。如果你一次性构建矩阵，就不需要担心这个问题。\n\
  \n这种技术可以用于以不寻常的角度绘制复杂的形状。例如，要画一个指向右上角的箭头，通常画一个指向右侧的箭头然后将其旋转会更容易。\n\n你可以在使用 `applyTransform:`\
  \ 变换路径，以及通过设置 `transform` 属性来变换整个视图之间进行选择。哪种方法最好取决于情况，但我通常倾向于变换路径而不是视图。修改视图的 `transform`\
  \ 会让 `frame` 和 `bounds` 的结果变得更难以解释，因此在可能的情况下我会避免这样做。正如你在下一节中看到的，你也可以变换上下文（context），这有时是最佳方法。\n\
  \n### 使用 Core Graphics 绘图\n\nCore Graphics（有时被称为 Quartz 2D 或简称 Quartz）是 iOS 中的主要绘图系统。它提供了与目标无关的绘图，因此可以使用相同的命令绘制到屏幕、层、位图、PDF\
  \ 或打印机。任何以 `CG` 开头的符号都是 Core Graphics 的一部分。图 6-11 和下面的代码提供了一个滚动图表的示例。\n\n### GraphView.h\
  \ (Graph)\n\n```objectivec\n@interface GraphView : UIView\n  @property (nonatomic,\
  \ readonly, strong) NSMutableArray *values;\n  @property (nonatomic, readonly, strong)\
  \ NSTimer *timer;\n@end\n```\n\n![9781119961321-fg0611.eps](img/9781119961321-fg0611_fmt.jpeg)\n\
  \n图 6-11 滚动图表\n\n### GraphView.m (Graph)\n\n```objectivec\n#import \"GraphView.h\"\
  \n\n@implementation GraphView\n@synthesize values=values_;\n@synthesize timer=timer_;\n\
  const double kXScale = 5.0;\nconst double kYScale = 100.0;\n\n- (void)awakeFromNib\
  \ {\n  values_ = [NSMutableArray array];\n  timer_ = [NSTimer scheduledTimerWithTimeInterval:0.25\n\
  \                                                   target:self\n              \
  \                               selector:@selector(updateValues:)\n            \
  \                                    userInfo:nil\n                            \
  \                      repeats:YES];\n}\n\n- (void)updateValues:(NSTimer *)timer\
  \ {\n  double nextValue = sin(CFAoluteTime()) + (double)rand()/(double)RAND_MAX;\n\
  \  [self.values addObject:[NSNumber numberWithDouble:nextValue]];\n  UInteger maxValues\
  \ = floor(self.bounds.width / kXScale);\n  if ([self.values count] > maxValues)\
  \ {\n    [self.values removeObjectsInRange:NSMakeRange(0, [self.values count] -\
  \ maxValues)];\n  }\n  [self setNeedsDisplay];\n}\n\n- (void)dealloc {\n  [timer_\
  \ invalidate];\n}\n\n- (void)drawRect:(CGRect)rect {\n  if ([self.values count]\
  \ == 0) {\n    return;\n  }\n  CGContextRef ctx = UIGraphicsGetCurrentContext();\n\
  \  CGContextStrokeColorWithColor(ctx, [[UIColor redColor] CGColor]);\n  CGContextSetLineJoin(ctx,\
  \ kCGJoinRound);\n  CGContextSetLineWidth(ctx, 5);\n  CGFloat yOffset = self.bounds.height\
  \ / 2;\n  double y = [[self.values objectAtIndex:0] doubleValue;\n  CGContextMoveToPoint(ctx,\
  \ 0, y * kYScale + yOffset);\n  for (NSUInteger x = 1; x < [self.values count];\
  \ ++x) {\n    y = [[self.values objectAtIndex:x] doubleValue];\n    CGContextAddLineToPoint(ctx,\
  \ x * kXScale, y * kYScale + yOffset);\n  }\n  CGContextStrokePath(ctx);\n}\n@end\n\
  ```\n\n每秒，这段代码都会向数据末尾添加一个新数字并从开头移除一个旧数字。然后它通过 `setNeedsDisplay` 将视图标记为脏。绘图代码获取当前上下文，设置\
  \ `BezierPath` 无法使用的各种线条绘制选项，并移动到第一个点。对于每个数字，它在图中的该点添加一条线，最后描边路径。\n\n注意，“当前路径”是\
  \ `CGContext` 的一个属性，而不是一个独立的对象。相反，你可以像下面的代码所示使用 `CGPath`。\n\n### GraphView.m (Graph)\n\
  \n```objectivec\n- (void)drawRect:(CGRect)rect {\n  if ([self.values count] == 0)\
  \ {\n    return;\n  }\n  CGContextRef ctx = UIGraphicsGetCurrentContext();\n  CGContextSetStrokeColorWithColor(ctx,\
  \ [[UIColor redColor] CGColor]);\n  CGContextSetLineJoin(ctx, kCGJoinRound);\n \
  \ CGContextSetLineWidth(ctx, 5);\n  CGMutablePathRef path = CGPathCreateMutable();\n\
  \  CGFloat yOffset = self.bounds.height / 2;\n  CGAffineTransform transform = CGAffineTransformScaleTranslate(kXScale,\
  \ kYScale, size.width/2, yOffset);\n  double y = [[self.values objectAtIndex:0]\
  \ doubleValue];\n  CGPathMoveToPoint(path, &transform, 0, y);\n  for (NSUInteger\
  \ x = 1; x < [self.values count]; ++x) {\n    y = [[self.values objectAtIndex:x]\
  \ doubleValue];\n    CGPathAddLineToPoint(path, &transform, x, y);\n  }\n}\n```\n\
  \n\n\n\n```objc\n  CGContextAddPath(ctx, path);\n  CGPathRelease(path);\n  CGContextStrokePath(ctx);\n\
  }\n```\n\n这种这种使用 `CGPath` 可以让你通过变换（transform）来简化数学计算。你不能对视图或上下文应用缩放变换，因为那会导致线条失真。\n\
  \nCore Graphics 使用 Core Foundation 的内存管理规则。Core Foundation 对象需要手动进行 retain 和 release，即使在\
  \ ARC 环境下也是如此。注意 `CGPathRelease` 的使用。更多细节请参阅第 19 章。\n\n你可能想在这里缓存 `CGPath`，这样不需要每次都重新计算。这是一个很好的直觉，但在这种情况下它没有帮助。iOS\
  \ 已经避免了调用 `drawRect:`，除非视图是脏的（dirty），这只有在数据变化时才会发生。当数据变化时，你需要计算新路径。在这种情况下缓存旧路径只会增加代码复杂度并浪费内存。\n\
  \n## 混合 UIKit 和 Core Graphics\n\n在 `drawRect:` 内部，UIKit 和 Core Graphics 通常可以无缝混合使用，但在\
  \ `drawRect:` 之外，你可能会发现用 Core Graphics 绘制的内容看起来是倒的。UIKit 使用左上角原点（ULO）坐标系，而 Core\
  \ Graphics 默认使用左下角原点（LLO）系统。只要你在 `drawRect:` 内部使用 `UIGraphicsGetCurrentContext`\
  \ 返回的上下文，一切都是正常的，因为这个上下文已经经过翻转（flipped）。但如果你使用类似 `CGBitmapContextCreate` 的函数创建自己的上下文，它将是\
  \ LLO 系统。你可以反过来进行数学计算，也可以翻转上下文：\n\n```objc\n  CGContextTranslateCTM(ctx, 0.0f, height);\n\
  \  CGContextScaleCTM(ctx, 1.0f, -1.0f);\n```\n\n这会移动（平移）上下文的高度，然后使用负缩放对其进行翻转。当从\
  \ UIKit 切换到 Core Graphics 时，变换是反的：\n\n```objc\n  CGContextScaleCTM(ctx, 1.0f, -1.0f);\n\
  \  CGContextTranslateCTM(ctx, 0.0f, -height);\n```\n\n先翻转，再平移。\n\n## 管理图形上下文\n\n\
  在调用 `drawRect:` 之前，绘图系统会创建一个图形上下文（`CGContext`）。上下文包含大量信息，如画笔颜色、文字颜色、当前字体、变换等。有时你可能想修改上下文，然后将其恢复到原来的状态。例如，你可能有一个函数用特定颜色绘制特定形状。由于只有一个描边笔（stroke\
  \ pen），所以当你更改颜色时，这会影响调用者。为了避免副作用，你可以使用 `CGContextSaveGState` 和 `CGContextRestoreGState`\
  \ 来推送（push）和弹出（pop）上下文。\n\n不要将其与听音相似的 `UIGraphicsPushContext` 和 `UIGraphicsPopContext`\
  \ 混淆。它们的功能不同。`CGContextSaveGState` 上下文的当前状态。`UIGraphicsPushContext` 则切换当前上下文。以下是\
  \ `CGContextSaveGState` 的示例。\n\n```objc\n  [[UIColor redColor] setStroke];\n  CGContextSaveGState(UIGraphicsGetCurrentContext());\n\
  \  [[UIColor blackColor] setStroke];\n  CGContextRestoreGState(UIGraphicsGetCurrentContext());\n\
  \  UIRectFill(CGRectMake(10, 10, 100, 100)); // 红色\n```\n\n这段代码将描边笔颜色设为红色并保存上下文。然后将画笔颜色改为黑色并恢复上下文。当你绘图时，画笔又变成了红色。\n\
  \n以下代码说明了一个常见的错误。\n\n```objc\n  [[UIColor redColor] setStroke];\n  // 下一行是无意义的\n\
  \  UIGraphicsPushContext(UIGraphicsGetCurrentContext());\n  [[UIColor blackColor]\
  \ setStroke];\n  UIGraphicsPopContext();\n  UIRectFill(CGRectMake(10, 10, 100, 100));\
  \ // 黑色\n```\n\n在这种情况下，你将画笔颜色设为红色，然后切换上下文到当前上下文，这没有任何用处。接着你将画笔颜色改为黑色，并弹出上下文回到原始状态（这实际上什么也没做）。你现在会画出一个黑色的矩形，这几乎肯定不是你的本意图。\n\
  \n`UIGraphicsPushContext` 的目的不是保存上下文的当前状态（画笔颜色、线宽等），而是完全切换上下文。假设你正在向当前视图上下文绘制某些内容，现在想在位图上下文中绘制完全不同的内容。如果你想用\
  \ UIKit 来进行任何绘图，你需要保存当前的 UIKit 上下文（包括已完成的所有绘图），并切换到一个全新的绘图上下文。这就是 `UIGraphicsPushContext`\
  \ 所做的。当你完成位图创建后，弹出栈并获取旧上下文。这就是 `UIGraphicsPopContext` 所做的。这只在你想用 UIKit 在新的位图上下文中绘图时才有用。只要你使用\
  \ Core Graphics 函数，就不需要推送或弹出上下文，因为 Core Graphics 函数是将上下文作为参数传入的。\n\n这是一个非常实用且常见的操作。它是如此常见，以至于\
  \ Apple 为其提供了一个快捷方法 `UIGraphicsBeginContext`。它处理了推送旧上下文、为新上下文分配内存、翻转坐标系以及将其设置为当前上下文。大多数情况下，这正是你需要的。这是一个如何使用\
  \ `UIGraphicsBeginContext` 创建图像的示例。结果如图 12 所示。\n\n```objc\n// MYView.m (Drawing)\n\
  - (UIImage *)reverseImageForText:(NSString *)text {\n  const size_t kWidth = 200;\n\
  \  const size_t kHeight = 200;\n  CGImageRef textImage = NULL;\n  UIFont *font =\
  \ [UIFont boldFontOfSize:17.0];\n  UIGraphicsBeginContext(CGSize(kWidth, kHeight));\n\
  \  [[UIColor redColor] setStroke];\n  [text drawInRect:CGRectMake(0, 0, kWidth,\
  \ kHeight)];\n  textImage = UIGraphicsGetImageFromCurrentImage().CGImage;\n  UIGraphicsEndContext();\n\
  \  return [UIImage imageWithCGImage:textImage scale:1.0 orientation:UIImageOrientationMirrored];\n\
  }\n```\n\n图 6-12 使用 reverseImageForText: 绘制的内容\n\n## 优化 UIView 绘图\n\n以下章节了一些注意事项。UIView\
  \ 及其类经过了高度优化，尽可能使用它们而不是自定义绘图。例如，`UIImageView` 比你下午可能写的任何东西都快且占用内存更少。\n\n### 避免绘图\n\
  \n最快的绘图是不进行绘图。iOS 极力避免调用 `drawRect:`。它会缓存视图的图像并对其进行移动、旋转和缩放，无需你干预。使用适当的 `contentMode`\
  \ 可以让系统在旋转或调整大小时调整视图，而无需调用 `drawRect:`。导致 `drawRect:` 运行的最常见原因是调用了 `setNeedsDisplay`。避免不必要的\
  \ `setNeedsDisplay` 调用。但记住，`setNeedsDisplay` 只是调度视图重绘。在单个事件循环中多次调用 `setNeedsDisplay`\
  \ 在实际开销上与调用一次相同，所以不要合并这些调用。iOS 已经为你做好了。\n\n熟悉 Mac 开发的人可能熟悉使用 `setNeedsDisplayInRect:`\
  \ 进行部分视图绘图。iOS 不支持部分绘图，`setNeedsDisplayInRect:` 等同于 `setNeedsDisplay`。整个视图都会被重绘。如果你想部分重绘视图，应该使用\
  \ `CALayer`（第 7 章讨论）或使用子视图。\n\n## 缓存与后台绘图\n\n\n\n\n\n如果在绘图过程中需要进行大量的计算，请尽可能缓存结果。在最底层，你可以缓存所需的原始数据，而不是每次都向代理（delegate）请求这些数据。除此之外，你还可以缓存静态元素，例如\
  \ `CGFont` 或 `CGGradient` 对象，这样你只需要生成它们一次。字体和渐变非常适合这种缓存方式，因为它们通常会被重用。最后，你可以缓存整个复杂绘图操作的结果。通常缓存此类结果的最佳位置是放在\
  \ `CGLayer` 中，这将在稍后的“CGLayer”章节中讨论。或者，你也可以将结果缓存在位图中（bitmap），通常是如本章前面“管理图形上下文”部分讨论的那样，使用\
  \ `UIGraphicsBeginImageContext`。\n\n许多缓存或预计算工作可以在后台完成。你可能听过必须始终在主线程上进行绘图，但这并非完全正确。有几个\
  \ UIKit 函数必须在主线程上调用，例如 `UIGraphicsBeginImageContext`，但你可以自由在任何线程上使用 `CGBitmapCreateContext`\
  \ 创建 `CGBitmapContext` 对象并在其中绘图。从 iOS 4 开始，只要你向自己的 `CGContext` 绘图而不是主视图图形上下文（由 `UIGraphicsGetCurrentContext`\
  \ 返回的那个），你就可以在后台线程使用类似 `drawAtPoint:` 的 UIKit 绘图方法。然而，你应该只在一个线程上访问给定的 `CGContext`。\n\
  \n## 自定义绘图与预渲染\n\n管理复杂绘图有两种主要方法。你可以使用 `CGPath` 和 `CGGradient` 通过编程方式绘制所有内容，你也可以在\
  \ Adobe Photoshop 等图形程序中预渲染所有内容并将其作为图像显示。如果你有一个艺术部门并计划使用极其复杂的视觉元素，那么 Photoshop 往往是唯一的选择。\n\
  \n然而，预渲染有很多缺点。首先，它引入了对分辨率的依赖。你可能需要管理 1 倍和 2 倍比例的图像版本，可能还要为 iPad 和 iPhone 准备不同的图像。这复杂了工作流并导致产品体积膨胀。如果每个细微的变化都需要与艺术家往返，那么它会使微小的修改变得困难并将并将锁定在精确的元素尺寸和颜色上。许多艺术家仍然不熟悉如何绘制可拉伸图像，以及如何为\
  \ iOS 提供用于合成的理想图像。\n\nApple 最初鼓励开发者进行预渲染，因为早期的 iPhone 计算渐变的速度不够快。从 iPhone 3GS 开始，这个问题就不那么严重了，而且每一代产品都让自定义绘图更具吸引力。\n\
  \n今天，如果可以用合理的代码量来实现，我建议使用自定义绘图。这通常适用于按钮等小元素。当你确实使用预渲染的的作品时，我建议保持艺术文件尽可能“扁平化”，并在代码中进行合成。例如，你可以使用图像作为按钮的背景，但在代码中处理圆角和阴影。这样，当你想要进行微调时，就不需要重新渲染背景。\n\
  \n## 像素对齐与模糊文本\n\n导致细微绘图问题最常见的原因之一是像素未对齐（pixel misalignment）。如果你要求 Core Graphics\
  \ 在一个与像素不对齐的点上进行绘图，它会执行抗锯齿（anti-aliasing），正如本章前面的“理解坐标”部分所讨论的那样。这意味着它在一个像素上绘制部分信息，在另一个像素上绘制部分信息，产生线条位于两个像素之间的视觉错觉。这种错觉让物体看起来更平滑，但也让它们变得模糊。抗锯齿也会消耗处理时间，因此会减慢绘图速度。在可能的情况下，您希望确保绘图与像素对齐，以避免这个问题。\n\
  \n在 Retina 显示屏之前，像素对齐意味着整数坐标。从 iOS 4 开始，坐标是以点（points）为单位的而不是像素。在当前的 Retina 显示屏，每个点对应两个像素，因此半点（1.5,\
  \ 2.5）也是像素对齐的。在未来，每个点可能会对应四个或更多像素，并且因设备而异。尽管如此，除非你需要像素级的精度，否则简单的方法就是确保你的框架（frames）使用整数坐标。\n\
  \n通常情况下，影响像素对齐的是框架的起始点（origin）。这为 `center` 属性带来了一个遗憾的问题。如果你将中心设置为整数坐标，你的起始点可能会未对齐。这在文本中尤为明显，特别是使用\
  \ `UILabel` 时。图 6-13 展示了这个问题。它是微妙的，在打印时可能难以看到，因此你也可以使用本章在线文件中提供的 `BlurryText` 程序来演示。\n\
  \n![9781119961321-fg0613.tif](img/9781119961321-fg0613_fmt.jpeg)\n\n图 6-13 像素对齐的（上）和未对齐的（下）文本\n\
  \n有两种解决方案。首先，奇数字体大小（例如 13 而不是 12）通常会正确对齐。如果你养成了使用奇数字体大小的习惯，通常可以避免这个问题。为了确保避免这个问题，你需要确保框架是整数，这可以通过使用\
  \ `setFrame:` 而不是 `setCenter:`，或者使用像 `setAlignedCenter:` 这样的 `UIView` category 来实现：\n\
  \n```objc\n- (void)setAlignedCenter:(CGPoint)center {\n  self.center = center;\n\
  \  self.frame = CGRectIntegral(self.frame);\n}\n```\n\n由于这实际上设置了两次框架，因此它不是最快的解决方案，但对于大多数问题，它非常简单且速度足够。`CGRectIntegral()`\
  \ 返回包含给定矩形的最小整数矩形。\n\n随着非 Retina 显示屏的淘汰，只要你将 `center` 设置为整数坐标，这个问题就会不再那么严重。但目前，这仍然是一个关注点。\n\
  \n## 透明、不透明与隐藏\n\n视图有三个看似相关但实际上相互独立的属性：透明度（alpha）、不透明（opaque）和隐藏（hidden）。\n\n`alpha`\
  \ 属性决定了视图对像素的贡献程度。因此，`alpha` 为 1 意味着视图的信息完全用于着色像素。`alpha` 为 0 意味着视图的信息没有用于着色像素。记住，在\
  \ iPhone 屏幕上没有真正的透明。如果你将整个屏幕设置为透明像素，用户将看不到电路板或背景。归结底，这只是绘制像素颜色的问题。所以当你提高降低 `alpha`\
  \ 时，你正在改变该视图相对于“下方”视图的像素贡献。\n\n标记视图为不透明（opaque）并不会使其内容变得更透明或更不透明。`opaque` 是渲染系统可以利用的承诺。当你将视图标记为不透明时，你是在向渲染系统承诺你会绘制矩形内的每个像素且全是不透明的。这允许渲染系统忽略下方的视图，并提高性能，特别是在应用变换时。你应该尽可能将视图标记为不透明，特别是像\
  \ `UITableViewCell` 这样的视图。然而，如果视图中有任何半透明像素，或者你没有绘制矩形内的每个像素，设置 `opaque` 可能会导致不可预测的结果。设置一个不透明的\
  \ `backgroundColor` 可以确保所有像素都被绘制。\n\n与 `opaque` 密切相关的是 `clearsContextBeforeDrawing`。它默认是\
  \ `YES`，并在调用 `drawRect:` 之前将上下文设置为透明黑色。这避免了视图中的任何垃圾数据。这是一个相当快速的操作，但如果你确实要绘制每个像素，那么通过将其设置为\
  \ `NO` 可以获得微小的益处。\n\n最后，`hidden` 表示视图不应被绘制，并且通常等同于 `alpha` 为 0。`hidden` 属性不能进行动画处理，因此通常通过动画\
  \ `alpha` 变为 0 来隐藏视图。\n\n\n\n\n隐藏和透明视图不会接收触摸事件。文档中对“透明”的定义并不十分明确，但通过实验，我发现它指的是 `alpha`\
  \ 小于 0.1。你不应该依赖于这个特定的值，但要点是，“几乎透明”的内容通常被视为透明的。你无法通过设置极低的 `alpha` 值来创建一个捕捉触摸事件的“透明覆盖层”。\n\
  \n你可以通过将 `alpha` 设置为 1，`opaque` 设置为 `NO`，并将 `backgroundColor` 设置为 `nil` 或 `[UIColor\
  \ clearColor]`，让视图变为透明的同时仍然接收触摸事件。具有透明背景的视图在命中检测中仍被视为可见的。\n\n# CGLayer\n\n`CGLayer`\
  \ 是缓存经常绘制内容的极非常有效的方法。这不应与 `CALayer` 混淆，后者是 Core Animation 中一个更强大、更复杂的层对象。`CGLayer`\
  \ 是一个 Core Graphics 层，针对向 `CGContext` 绘图进行了优化（通常是硬件加速优化）。\n\n有几种类型的 `CGContext`。最常见的是视图图形上下文，设计用于绘制到屏幕，由\
  \ `UIGraphicsCurrentContext` 返回。然而，上下文也用于位图和打印。这些上下文中的每一个都有不同的属性，包括最大分辨率、颜色细节和可用的硬件加速。\n\
  \n从简单来说，`CGLayer` 类似于 `CGBitmapContext`。你可以向其内部绘图、将其保存，并在稍后使用它将结果绘制到 `CGContext`\
  \ 中。区别在于，你可以针对特定类型的图形上下文对 `CGLayer` 进行优化使用。如果一个 `CGLayer` 的目标是视图图形上下文，它可以直接在 GPU\
  \ 上缓存其数据，这可以显著提高性能。`CGBitmapContext` 无法做到这一点，因为它不知道你计划在屏幕上绘制它。\n\n接下来的示例演示了如何缓存\
  \ `CGLayer`。在这种情况下，它在视图第一次被绘制时被缓存在一个静态变量中。然后你可以在旋转上下文时反复地“盖章”该 `CGLayer`。你使用 `UIGraphicsPushContext`\
  \ 以便可以使用 UIKit 将文本绘制到层上下文中，并使用 `UIGraphicsPopContext` 返回普通上下文。这也可以通过 `CGContextShowTextAtPoint`\
  \ 来完成，但 UIKit 让绘制 `NSString` 变得非常简单。图 6-14 显示了输出。\n\n```objc\nLayerView.m (Layer)\n\
  \n@implementation LayerView\n\n- (void)drawRect:(CGRect)rect {\n  static CGLayerRef\
  \ sTextLayer = NULL;\n  CGContextRef ctx = UIGraphicsGetCurrentContext();\n  if\
  \ (sTextLayer == NULL) {\n    CGRect textBounds = CGRectMake(0, 0, 200, 100);\n\
  \    sTextLayer = CGLayerCreateWithContext(ctx,\n                              \
  \            textBounds.size,\n                                          NULL);\n\
  \    CGContextRef textCtx = CGLayerGetContext(sTextLayer);\n    CGContextSetRGBFillColor\
  \ (textCtx, 1.0, 0.0, 0.0, 1);\n    UIGraphicsPushContext(textCtx);\n    UIFont\
  \ *font = [UIFont systemFontOfSize:13.0];\n    [@”Pushing The Limits” drawInRect:textBounds\n\
  \                                     withFont:font];\n    UIGraphicsPopContext();\n\
  \  }\n  CGContextTranslateCTM(ctx, self.bounds.size.width / 2,\n               \
  \         self.bounds.size.height / 2);\n  for (NSUInteger i = 0; i < 10; ++i) {\n\
  \    CGContextRotateCTM(ctx, 2 * M_PI / 10);\n    CGContextDrawLayerAtPoint(ctx,\n\
  \                              CGPointZero,\n                              sTextLayer);\n\
  \  }\n}\n\n@end\n```\n\n![9781119961321-fg0614.eps](img/9781119961321-fg0614_fmt.jpeg)\n\
  \n图 6-14 LayerView 的输出\n\n### 总结\n\niOS 拥有丰富的绘制工具。本章专注于 Core Graphics 及其它的 Objective-C\
  \ 后代 UIKit。到目前，你应该对系统如何交互以及如何优化你的 iOS 绘制有了良好的理解。\n\n第 7 章讨论了 Core Animation，它让你的界面动起来。涵盖的还有\
  \ `CALayer`，它是 `UIView` 和 `CGLayer` 的强大扩展，即使你没有做动画，也是你绘图工具箱中一个重要的工具。\n\niOS 5 将\
  \ Core Image 引入 iOS 以进行图片调整。这在第 1 章中简要讨论过。iOS 还对 OpenGL ES 提供日益增长的支持用于绘制高级 3D 图形和纹理。OpenGL\
  \ ES 是本身就可以成书的话题，因此在这里没有涉及，但你可以在 Apple 的《iOS OpenGL ES Programming Guide》中获得良好的介绍（参见“延伸阅读”部分）。\n\
  \n### 延伸阅读\n\n## Apple 文档\n\n以下文档可以在 iOS Developer Library（[`developer.apple.com`](http://developer.apple.com/)）或通过\
  \ Xcode 文档和 API 参考中找到。\n\n- Drawing and Printing Guide for iOS\n- iOS Human Interface\
  \ Guidelines\n- iOS Application Programming Guide\n- OpenGL ES Programming Guide\
  \ for iOS\n- Quartz 2D Programming Guide\n- Technical Q&A QA1708: Improving Image\
  \ Drawing Performance on iOS\n- View Programming Guide for iOS\n\n## 其他资源\n\nLaMarche,\
  \ Jeff, iPhone Development. Jeff 有几篇文章，对使用 `CGAffineTransform` 提供了很多见解。[iphonedevelopment.blogspot.com/search/label/CGAffineTransform](http://iphonedevelopment.blogspot.com/search/label/CGAffineTransform)\n\
  \n# 第 7 章 像洋葱一样的层：Core Animation\n\niPhone 让动画成为了体验的核心。视图滑入滑出，应用程序缩放，页面飞入列表。Apple\
  \ 让动画不仅是体验的美好部分，更是让用户知道发生了什么以及预期的更好方式。当视图从右向左滑入位置时，点击返回按钮是自然的。当你创建一个书签并它飞向工具栏时，你应该去哪里变得更加明显了。这些微妙的提示是使用户界面直观且吸引人的关键部分。为了实现这一切动画，iOS\
  \ 设备包含了强大的 GPU 以及让你轻松利用 GPU 的框架。\n\n在本章中，你将发现 iOS 的两个动画系统：视图动画和 Core Animation 框架。你学习了如何使用\
  \ Core Animation 层绘图，以及如何在二维三维空间移动层。常见的装饰如圆角、彩色边框和阴影使用 `CALayer` 非常简单，你学会了如何快速地应用它们。你学习了如何创建自定义自动动画，包括动画自己的属性。最后，Core\
  \ Animation 关乎性能，因此你学习了如何在多线程应用程序中管理层。\n\n本章关注基于视图的编程。这些框架对于游戏之外的大多数 iOS 都是理想的。游戏开发不在本书的范围内，并且通常由\
  \ OpenGL ES 等内置框架提供服务。\n\n### 视图动画\n\n`UIView` 提供了丰富的动画功能，非常用且经过了良好的优化。常见的动画可以通过\
  \ `+animateWithDuration:animations:` 和相关方法处理。你可以使用 `UIView` 动画 `frame`、`bounds`、`center`、`transform`、`alpha`、`backgroundColor`\
  \ 和 `contentStretch`。大多数你会动画 `frame`、`center`、`transform` 和 `alpha`。\n\n你可能对基础视图动画很熟悉，所以我在这节中只需提及要点，然后进入更高级的基于层的绘制和动画。\n\
  \n让我们从一个非常简单的动画开始，当点击视图时球会掉落。`CircleView` 只在它的框架内绘制一个圆。以下代码创建了图 7-1 所示的动画。\n\n```objc\n\
  ViewAnimationViewController.m (ViewAnimation)\n```\n\n\n\n\n```objc\n#import \"\
  ViewAnimationViewController.h\"\n\n#import \"CircleView.h\"\n\n@implementation ViewAnimationViewController\n\
  \n@synthesize circleView = circleView_;\n\n- (void)viewDidLoad {\n  [super viewDidLoad];\n\
  \  self.circleView = [[CircleView alloc] initWithFrame:\n                      \
  \  CGRectMake(0, 0, 20, 20)];\n  self.circleView.center = CGPointMake(100, 20);\n\
  \  [[self view] addSubview:self.circleView];\n  UITapGestureRecognizer *g;\n  g\
  \ = [[UITapGestureRecognizer alloc]\n       initWithTarget:self\n        action:@selector(dropAnimate)];\n\
  \  [[self view] addGestureRecognizer:g];\n}\n\n- (void)viewDidUnload {\n  [super\
  \ viewDidUnload];\n  self.circleView = nil;\n}\n\n- (void)dropAnimate {\n  [UIView\
  \ animateWithDuration:3 animations:^{\n    self.circleView.center = CGPointMake(100,\
  \ 300);\n  }];\n}\n\n@end\n```\n\n这是最简单的基于视图的动画类型，它可以处理大多数常见问题，特别是对尺寸、位置和透明度的动画。通过对\
  \ `transform` 进行动画来随时间缩放、旋转或平移视图也是常见的。较少的情况下，你还可以对 `backgroundColor` 和 `contentStretch`\
  \ 进行动画。动画背景颜色在 HUD 风格的界面中特别有用，可以在大部分透明和大部分不透明的背景之间切换。这可能比仅仅对整体 `alpha` 进行动画更有效。\n\
  \n链式动画也是直观的，如下代码所示。\n\n```objc\n- (void)dropAnimate {\n  [UIView\n    animateWithDuration:3\
  \ animations:^{\n      self.circleView.center = CGPointMake(100, 300);\n    }\n\
  \    completion:^(BOOL finished){\n      [UIView animateWithDuration:1 animations:^{\n\
  \        self.circleView.center = CGPointMake(250, 300);\n      }\n      ];\n  \
  \  }];\n}\n```\n\n现在球会掉落并向右移动。但这段代码存在一个细微的问题。如果你在动画进行期间点击屏幕，球会跳到左下角然后向右动画。这可能不是你想要的结果。问题在于每当你点击视图时，这段代码都会运行。如果动画正在进行，它会被取消并且\
  \ `completion` 块会带有 `finished==NO` 运行。你接下来将学习如何处理这个问题。\n\n## 管理用户交互\n\n上一节中提到的问题是由用户体验错误引起的：允许用户在你执行上一个命令的动画时发送新命令。有时这是你所需要的，但在这种情况下并不是。每当你响应用户输入创建动画时，都需要考虑这个问题。\n\
  \n当你对视图进行动画时，默认情况下它会自动停止响应用户交互。因此，当球掉落时，点击它不会产生任何事件。但在本例中，点击主视图会导致动画。有两种解决方案。首先，你可以更改用户界面，让点击球触发动画：\n\
  \n```objc\n[self.circleView addGestureRecognizer:g];\n```\n\n其他解决方案是在球动画期间忽略点击。以下代码展示了如何在手势识别器回调中禁用\
  \ `UIGestureRecognizer`，然后在动画完成后重新启用它。\n\n```objc\n- (void)dropAnimate:(UIGestureRecognizer\
  \ *)recognizer {\n  [UIView\n    animateWithDuration:3 animations:^{\n      recognizer.enabled\
  \ = NO;\n      self.circleView.center = CGPointMake(100, 300);\n    }\n    completion:^(BOOL\
  \ finished){\n      [UIView\n        animateWithDuration:1 animations:^{\n     \
  \     self.circleView.center = CGPointMake(250, 300);\n        }\n        completion:^(BOOL\
  \ finished){\n          recognizer.enabled = YES;\n        }];\n    }];\n}\n```\n\
  \n\n\n\n\n5. `[CALayer drawInContext:]`—默认的 `display` 方法会创建一个视图图形上下文并将其传递给 `drawInContext:`。这类似于\
  \ `[UIView drawRect:]`，但它不会自动为你设置 UIKit 上下文。要使用 UIKit 进行绘图，你需要调用 `UIGraphicsPushContext()`\
  \ 将传递的上下文设置为当前上下文。否则，直接使用传递的上下文通过 Core Graphics 进行绘图。默认的 `display` 方法获取生成的上下文，创建一个\
  \ `CGImage`（见下文注释）并将其赋值给 `contents`。如果实现了 `[delegate drawLayer:inContext:]`，默认的\
  \ `[CALayer drawInContext:]` 会调用它。否则它什么都不做。注意，你可以直接调用此方法。请参阅本节后面的“在自己的上下文中绘图”章节，了解你为什么要直接调用此方法。\n\
  \n6. `[delegate drawLayer:inContext:]`—如果实现了，默认的 `drawInContext:` 会调用此方法来更新上下文，以便\
  \ `display` 可以创建一个 `CGImage`。\n\n如你所见，有多种方法可以设置层的 `contents`。你可以直接通过 `setContent:`\
  \ 设置它，可以实现 `display` 或 `displayLayer:`，或者可以实现 `drawInContext:` 或 `drawLayer:inContext:`。在本节的剩余部分，我将讨论每种方法。\n\
  \n绘图系统几乎不会像 `UIView` 经常自动刷新那样自动更新 `contents`。例如，`UIView` 在第一次显示在屏幕上时会绘制自己。`CALayer`\
  \ 则不会。通过 `setNeedsDisplay` 标记 `UIView` 为脏会自动重绘所有子视图。而通过 `setNeedsDisplay` 标记 `CALayer`\
  \ 为脏则不会影响子层。需要记住，`UIView` 的默认行为是在它认为你需要时进行绘图。`CALayer` 的默认行为是除非你显式请求，否则永远不绘图。`CALayer`\
  \ 是一个低得得的对象，它经过优化，不会浪费时间执行未显式请求的操作。\n\n`contents` 属性通常是一个 `CGImage`，但并不总是如此。如果你使用自定义绘图，那么\
  \ Core Animation 将使用私有类 `CABackingStorage` 作为 `contents`。你可以将 `contents` 设置为 `CGImage`\
  \ 或另一个层的 `contents`。\n\n### 直接设置内容\n\n如果你已经有一张现成的图片（如下代码所示），提供内容图像是最简单的解决方案。\n\n\
  LayersViewController.m (Layers)\n\n```objectivec\n#import <QuartzCore/QuartzCore.h>\n\
  \n...\n  UIImage *image = [UIImage imageNamed:@”pushing.png”];\n  self.view.layer.contents\
  \ = (__bridge id)[image CGImage];\n```\n\n使用 Core Animation 必须始终导入 `QuartzCore.h`\
  \ 并链接 `QuartzCore.framework`。这是一个很容易被忘记的事情。\n\n需要进行 `__bridge id` 强制类型转换是因为 `contents`\
  \ 被定义为 `id`，但实际上它期望的是一个 `CGImageRef`。为了在 ARC 环境下使其工作，需要进行强制类型转换。（这在 iOS 的后续版本中可能会解决。）一个常见的错误是这里传递\
  \ `UIImage` 而不是 `CGImageRef`。你不会得到编译器错误或运行时警告。你的视图将是空白的。\n\n默认情况下，内容会被缩放以填充视图，即使会扭曲图像。与\
  \ `UIView` 中的 `contentMode` 和 `contentStretch` 一样，`CALayer` 可以通过 `contentsCenter`\
  \ 和 `contentsGravity` 配置为以不同方式缩放图像。\n\n### 实现 Display\n\n`display` 或 `displayLayer:`\
  \ 的任务是将 `contents` 设置为正确的 `CGImage`。你可以以任何你喜欢的方式这样做。默认实现创建一个 `CGContext`，将其传递给 `drawInContext:`，将结果转换为\
  \ `CGImage`，并将其分配给 `contents`。覆盖此方法的最常见场景是你的层有多个状态，并且你为每个状态准备了图像。按钮通常就是工作的。你可以通过从\
  \ bundle 加载这些图像、使用 Core Graphics 绘制它们或任何其他你喜欢的方式来创建这些图像。\n\n是子类 `CALayer` 还是使用代理（delegate）实际上取决于个人喜好和方便性。`UIView`\
  \ 有一个层，并且必须是该层的代理。根据我的经验，让 `UIView` 成为任何子层的代理是危险的。当 `UIView` 在过渡等某些操作中尝试复制其子层时，可能会导致无限递归。因此，你可以在\
  \ `UIView` 中实现 `displayLayer:` 来管理它的层，或者可以让其他对象作为子层的代理。\n\n在我看来，让 `UIView` 实现 `displayLayer:`\
  \ 很少有意义。如果你的视图内容基本上是几张图像，通常做法是使用 `UIImageView` 或 `UIButton`，而不是带有手动加载层内容的自定义 `UIView`。`UIImageView`\
  \ 对显示图像进行了高度优化。`UIButton` 非常擅长根据状态切换图像，并且包含了重现非常痛苦的良好用户界面机制。不要尝试在 Core Animation\
  \ 中重新发明 UIKit。UIKit 可能比你做得更好。\n\n更有意义的是让你的 `UIViewController` 成为层的代理，特别是当你没有子类 `UIView`\
  \ 的时候。如果你的需求相当简单，这可以避免额外的对象和子类。只需不要让你的 `UIViewController` 变得过于复杂。\n\n### 自定义绘图\n\
  \n与 `UIView` 一，你可以使用 `CALayer` 提供完全自定义的绘图。通常你会使用 Core Graphics 进行绘图，但通过 `UIGraphicsPushContext`，你也可以使用\
  \ UIKit 进行绘图。\n\n请参考第 6 章关于如何使用 Core Graphics 和 UIKit 进行绘图。\n\n使用 `drawInContext:`\
  \ 是另一种设置 `contents` 的方法。它由 `display` 调用，而只有在显式标记为脏（`setNeedsDisplay`）时才调用。与直接设置\
  \ `contents` 相比，它的优势是 `display` 会自动创建一个适用于层的 `CGContext`。特别是，坐标系是为你翻转过的。（请参考第 6\
  \ 章关于翻转坐标系的讨论）。下面的代码展示了如何实现方法 `drawLayer:inContext:`，使用 UIKit 在层顶部绘制“Pushing The\
  \ Limits”字符串。\n\nDelegateView.m (Layers)\n\n```objectivec\n@implementation DelegateView\n\
  \n- (id)initWithFrame:(CGRect)frame {\n    self = [super initWithFrame:frame];\n\
  \    if (self) {\n      [self.layer setNeedsDisplay];\n    }\n    return self;\n\
  }\n- (void)drawLayer:(CALayer *)layer inContext:(CGContextRef)ctx {\n  UIGraphicsPushContext(ctx);\n\
  \  [[UIColor whiteColor] set];\n  UIRectFill(layer.bounds);\n  [[UIColor blackColor]\
  \ set];\n  UIFont *font = [UIFont systemFontOfSize:48.0];\n  [@”Pushing The Limits”\
  \ drawInRect:[layer bounds]\n                                   withFont:font\n\
  \                                 lineBreakMode:UILineBreakModeWordWrap\n      \
  \                              alignment:UITextAlignmentCenter];\n  UIGraphicsPopContext();\n\
  }\n@end\n```\n\n注意 `initWithFrame:` 中对 `setNeedsDisplay` 的调用。正如讨论过的，层在放到屏幕上时不会自动绘制自己。你需要通过\
  \ `setNeedsDisplay` 将它们标记为脏。\n\n你可能还会注意到绘制背景而不是使用 `backgroundColor` 属性。这是刻意的。一旦参与了\
  \ `drawLayer:inContext:` 的自定义绘图，大多数自动层设置（如 `backgroundColor` 和 `cornerRadius`）都会被忽略。你在\
  \ `drawLayer:inContext:` 中的任务是绘制层所需的所有内容。这里不像 `UIView` 那样为你提供帮助的合成处理。如果你想将圆角等层效果与自定义绘图结合，可以将自定义绘图放在子层上，并对父层进行圆角处理。\n\
  \n\n\n\n与 `[UIView drawRect:]` 不同，自己调用 `[CALayer drawInContext:]` 是完全合法的。你只需要生成一个上下文并将其传递。这对于将层的内容捕捉到位图或\
  \ PDF 中非常有用，这样你可以对其进行保存或打印。如果你想将此层与其他内容合并，这非常有用，因为如果你只想要一个位图，直接使用 `contents` 即可。\n\
  \n`drawInContext:` 只绘制当前层，不绘制它的任何子层。如果你想绘制层及其所有子层，请使用 `renderInContext:`。它还能在层正在动画时捕捉它的当前状态。它使用\
  \ Core Animation 内部维护的渲染树当前状态，因此它不会调用 `drawInContext:`。\n\n### 移动物体\n\n既然你已经可以在层中绘图，让我们来看看如何使用这些层来创建强大的动画。\n\
  \n层本质上是有动画的。事实上，你只需要做少量工作就能防止它们产生动画。考虑这个示例：\n\n`LayerAnimationViewController.m`\
  \ (LayerAnimation)\n\n```objectivec\n- (void)viewDidLoad {\n  [super viewDidLoad];\n\
  \  CALayer *squareLayer = [CALayer layer];\n  squareLayer.backgroundColor = [[UIColor\
  \ redColor] CGColor];\n  squareLayer.frame = CGRectMake(100, 100, 20, 20);\n  [self.view.layer\
  \ addSublayer:squareLayer];\n  UIView *squareView = [UIView new];\n  squareView.backgroundColor\
  \ = [UIColor blueColor];\n  squareView.frame = CGRectMake(200, 100, 20, 20);\n \
  \ [self.view addSubview:squareView];\n  [self.view addGestureRecognizer:\n    [[UITapGestureRecognizer\
  \ alloc]\n      initWithTarget:self\n      action:@selector(drop:)]];\n}\n\n- (void)drop:(UIGestureRecognizer\
  \ *)recognizer {\n  NSArray *layers = self.view.layer.sublayers;\n  CALayer *layer\
  \ = [layers objectAtIndex:0];\n  [layer setPosition:CGPointMake(200, 250)];\n  NSArray\
  \ *views = self.view.subviews;\n  UIView *view = [views objectAtIndex:0];\n  [view\
  \ setCenter:CGPointMake(100, 250)];\n}\n```\n\n这绘制了一个较小的红色子层和一个较小的蓝色视图。当视图被点击时，两者都会移动。视图立即跳转到新位置，而层则在四分之一秒内完成动画。它很快，但不像视图那样是瞬间完成的。\n\
  \n`CALayer` 会隐式地动画所有支持动画的属性。你可以通过禁用动作来防止这一点：\n\n`[CATransaction setDisableActions:YES];`\n\
  \n我将在本章稍后的“使用 Actions 自动动画”部分进一步讨论动作。\n\n`disableActions` 是一个命名非常糟糕的属性。因为它以动词开头，你可能期望它产生产生副作用（禁用动作），而不是返回属性的当前值。它应该是\
  \ `actionsDisabled`（或者为了与 `userInteractionEnabled` 保持一致，使用 `actionsEnabled`）。Apple\
  \ 最终可能会修复这个问题，就像它们处理其他命名不当的属性所做。在此期间，确保在你想要更改它时调用了 `setDisableActions:`。在 `void`\
  \ 上下文中调用 `[CATransaction disableActions]` 不会产生警告或错误。\n\n# 隐式动画\n\n你现在掌握了动画的所有基础知识。只需设置层属性，你的层就会以默认方式进行动画。但如果你不喜欢默认设置呢？例如，你可能想更改动画的持续时间。首先，你需要理解事务（transactions）。\n\
  \n大多数情况下更改多个层属性时，你希望它们一起进行动画。你也不希望在下一个属性更改影响前一个属性时，浪费渲染器的时间为单个属性更改计算动画。例如，`opacity`\
  \ 和 `backgroundColor` 是相互关联的属性。它们都影响最终的显示像素颜色，因此在计算中间值时，你想同时知道这两个动画。\n\nCore Animation\
  \ 将属性更改封装成原子事务（`CATransaction`）。当你第一次在包含运行循环（run loop）的线程上修改层时，系统会为你创建一个隐式的 `CATransaction`。（如果最后那句的话引起了你的兴趣，请参阅本章稍后的“Core\
  \ Animation 与线程”部分。）在运行循环期间，所有的层级更改都会被收集，当运行循环完成时，所有更改都会提交到层树中。\n\n要修改动画属性，你需要对当前事务进行更改。以下代码将当前事务的持续时间改为\
  \ 5 秒，而不是默认的四分之一秒。\n\n`[CATransaction setAnimationDuration:2.0];`\n\n你还可以使用 `[CATransaction\
  \ setCompletionBlock:]` 设置在当前事务完成动画后运行的回调块。你可以用它将动画链联在一起，其他如此。\n\n虽然运行循环会自动为你创建事务，但你也可以使用\
  \ `[CATransaction begin]` 和 `[CATransaction commit]` 创建自己的显式事务。这些允许你为动画的不同部分分配不同的持续时间，或者仅为事件循环的一部分禁用动画。\n\
  \n请参阅本章的“使用 Actions 自动动画”部分，获取有关隐式动画如何实现以及你可以如何扩展它们的更多信息。\n\n# 显式动画\n\n隐式动画强大又方便，但有时你需要更多的控制。这就是\
  \ `CAAnimation` 用用用场。通过 `CAAnimation`，你可以管理循环动画、精确控制计时和节奏，并使用层转换。隐式动画是使用 `CAAnimation`\
  \ 实现的，因此你可以在隐式动画中做的所有事情，也可以显式地完成。\n\n最基本的动画是 `CABasicAnimation`。它在范围内通过计时函数对属性进行插值，如下所示：\n\
  \n```objectivec\n  CABasicAnimation *anim;\n  anim = [CABasicAnimation animationWithKeyPath:@”opacity”];\n\
  \  anim.fromValue = [NSNumber numberWithDouble:1.0];\n  anim.toValue = [NSNumber\
  \ numberWithDouble:0.0];\n  anim.autoreverses = YES;\n  anim.repeatCount = INFINITY;\n\
  \  anim.duration = 2.0;\n  [layer addAnimation:anim forKey:@”anim”];\n```\n\n这会让层无限脉动，在\
  \ 2 秒内从 1 变到 0。当你想停止动画时，移除它：\n\n```objectivec\n  [layer removeAnimationForKey:@anim”];\n\
  ```\n\n动画具有 `key`、`fromValue`、`toValue`、`timingFunction`、`duration` 以及其他配置选项。它的工作原理是创建多个多个副本，向副本发送\
  \ `setValue:` 消息，然后显示。它捕捉生成的 `contents` 并显示它们。\n\n如果你层中有自定义属性，可能会发现它们在动画期间没有正确设置。这是因为层被复制了。如果你希望在动画期间可以使用它们，必须重写\
  \ `initWithLayer:` 来复制你的自定义属性。我将在本章的“动画自定义属性”部分进行讨论。\n\n# 模型与表示\n\n动画中的一个常见问题是可怕的“跳回”。错误看起来像这样：\n\
  \n```objectivec\n  CABasicAnimation *fade;\n  fade = [CABasicAnimation animationWithKeyPath:@”opacity”];\n\
  \  fade.duration = 1;\n  fade.fromValue = [NSNumber numberWithDouble:1.0];\n  fade.toValue\
  \ = [NSNumber numberWithDouble:0.0];\n  [circleLayer addAnimation:fade forKey:@”fade”];\n\
  ```\n\n\n\n正如预期的那样，圆圈在 1 秒内淡出，然后突然重新出现。要理解理解为什么会发生这种情况，你需要意识到模型层（model layer）和表现层（presentation\
  \ layer）之间的区别。\n\n模型层由“真实” `CALayer` 对象的属性定义。之前的代码中没有任何部分修改 `circleLayer` 本身的任何属性。相反，`CAAnimation`\
  \ 创建了 `circleLayer` 的拷贝并修改了这些拷贝。这些拷贝变成了表现层。它们大致代表了屏幕上显示的内容。技术上还有一个名为渲染层（render layer）的层，它真正代表了屏幕上的内容，但它是\
  \ Core Animation 内部的，你很少遇到它。\n\n那么在之前的代码中发生了什么？`CAAnimation` 修改了表现层，表现层被绘制到屏幕上，当动画完成时，它所有的更改都会被丢弃，并使用模型层来确定新状态。模型层没有改变，所以你会回到起始位置。解决这个问题的方法是设置模型层，如下所示：\n\
  \n```objectivec\ncircleLayer.opacity = 0;\nCABasicAnimation *fade;\nfade = [CABasicAnimation\
  \ animationWithKeyPath:@”opacity”];\n...\n[circleLayer addAnimation:fade forKey:@”fade”];\n\
  ```\n\n有时这种方法可行，但有时 `setOpacity:` 中的隐式动画会与来自 `animationWithKeyPath:` 的显式动画冲突。解决问题的最佳方案是在执行显式动画时关闭隐式动画：\n\
  \n```objectivec\n[CATransaction begin];\n[CATransaction setDisableActions:YES];\n\
  circleLayer.opacity = 0;\nCABasicAnimation *fade;\nfade = [CABasicAnimation animationWithKeyPath:@”opacity”];\n\
  ...\n[circleLayer addAnimation:fade forKey:@”fade”];\n[CATransaction commit];\n\
  ```\n\n有时你会看到有人推荐将 `removedOnCompletion` 设置为 `NO` 并将 `fillMode` 设置为 `kCAFillModeBoth`。这不是一个好的解决方案。它本质上是让动画永远持续，这意味着模型层永远不会更新。如果你请求该属性的值，你将继续看到模型值，而不是你在屏幕上看到的值。如果你之后尝试对属性进行隐式动画，它将无法正常工作，因为\
  \ `CAAnimation` 仍在运行。如果你通过替换为同名的动画来移除动画，或者调用 `removeAnimationForKey:` 或 `removeAllAnimations`，旧值就会跳回。除此之外之外，它还浪费了内存。\n\
  \n这一切变得有点棘手，所以你可能会喜欢下面 `CALayer` 上的分类（category），它将所有内容封装在一起，并让你设置持续时间和延迟。在大多数情况下，我仍然倾向于使用隐式动画，但这可以让显式动画变得简单一些。\n\
  \n### CALayer+RNAnimation.m (LayerAnimation)\n\n```objectivec\n@implementation CALayer\
  \ (RNAnimations)\n\n- (void)setValue:(id)value\n      forKeyPath:(NSString *)keyPath\n\
  \      duration:(CFTimeInterval)duration\n          delay:(CFTimeInterval)delay\
  \ {\n  [CATransaction begin];\n  [CATransaction setDisableActions:YES];\n  [self\
  \ setValue:value forKeyPath:keyPath];\n  CABasicAnimation *anim;\n  anim = [CABasicAnimation\
  \ animationWithKeyPath:keyPath];\n  anim.duration = duration;\n  anim.beginTime\
  \ = CACurrentMediaTime() + delay;\n  anim.fillMode = kCAFillModeBoth;\n  anim.fromValue\
  \ = [[self presentationLayer] valueForKey:keyPath];\n  anim.toValue = value;\n \
  \ [self addAnimation:anim forKey:keyPath];\n  [CATransaction commit];\n}\n\n@end\n\
  ```\n\n### 关于计时的几点说明\n\n正如宏大的宇宙一样，在 Core Animation 中，时间是相对的。一秒并不总是是一秒。就像坐标一样，时间也可以被缩放。\n\
  \n`CAAnimation` 遵循 `CAMediaTiming` 协议，你可以设置 `speed` 属性来缩放它的计时。由于由于原因，在考虑层与之间的计时时，你需要对它们进行转换，就像你需要转换发生在不同视图或层中的点位一样。\n\
  \n```objectivec\nlocalPoint = [self convertPoint:remotePoint fromLayer:otherLayer];\n\
  localTime = [self convertTime:remotetime fromLayer:otherLayer];\n```\n\n这并不常见，但当你尝试协调动画时就会遇到。你可能会向另一个层请求某个特定的动画以及该动画何时结束，以便你可以开始自己的动画。\n\
  \n```objectivec\nCAAnimation *otherAnim = [layer animationForKey:@”anim”];\nCFTimeInterval\
  \ finish = otherAnim.beginTime + otherAnim.duration;\nmyAnim.beginTime = [self convertTime:finish\
  \ fromLayer:layer];\n```\n\n像这样设置 `beginTime` 是链式动画的一种很好的方法，即使你是硬编码时间而不是询问另一个层。要引用“现在”，只需使用\
  \ `CACurrentMediaTime()` 即可。\n\n然而，这引发了另一个问题。在现在到动画开始之间，你的属性应该具有什么值？你会假设它应该是 `fromValue`，但事实并非\
  \ true true。它是当前的模型值，因为动画还没有开始。通常情况下这是 `toValue`。\n\n```objectivec\n[CATransaction\
  \ begin];\n[CATransaction setDisableActions:YES];\nanim = [CABasicAnimation animationWithKeyPath:@”opacity”];\n\
  anim.fromValue = [NSNumber numberWithDouble:1.0];\nanim.toValue = [NSNumber numberWithDouble:0.5];\n\
  anim.duration = 5.0;\nanim.beginTime = CACurrentMediaTime() + 3.0;\n[layer addAnimation:anim\
  \ forKey:@”fade”];\nlayer.opacity = 0.5;\n[CATransaction commit];\n```\n\n这个动画在\
  \ 3 秒内什么都不做。在此期间，透明度淡入到 1.0，然后跳回 1.0。所以层在 5 秒内淡入到 0.5。这显然不是你想要的。\n\n你可以使用 `fillMode`\
  \ 来解决这个问题。默认是 `kCAFillModeRemoved`，这意味着动画对执行后的值没有影响。可以通过将 fill mode 更改为 `kCAFillModeForwards`\
  \ 或 `kCAFillModeBoth`。在大多数情况下，你希望将其设置为 `kCAFillModeBoth`。\n\n### 第三维度\n\n第 6 章讨论了如何使用\
  \ `CAAffineTransform` 提高 `UIView` 绘制效率。这种技术限制在二维变换上：平移、旋转、缩放和倾斜。然而，通过层，可以通过添加透视（perspective）来应用三维变换。这通常被称为\
  \ 2.5D 而不是 3D，因为它并没有像 OpenGL ES 那样让层变成真正的三维对象。但它确实允许三维运动的错觉。\n\n你围绕锚点旋转层。默认情况下，锚点在层的中心，指定为\
  \ {0.5, 0.5}。它可以移动到层内的任何位置，方便围绕边缘或角旋转。锚点是用单位正方形描述的，而不是点。因此，右下角是 {1.0, 1.0}，无论层有多大。\n\
  \n![97819961321-fg0703.eps](img/97819961321-fg0703_fmt.jpeg)\n\n图 7-3 填充模式对媒体计时函数的影响\n\
  \n这是一个三维盒的简单示例。\n\nBoxViewController.h (Box)\n\n```objectivec\n@interface BoxViewController\
  \ : UIViewController\n@property (nonatomic, readwrite, strong) CALayer *topLayer;\n\
  @property (nonatomic, readwrite, strong) CALayer *bottomLayer;\n@property (nonatomic,\
  \ readwrite, strong) CALayer *leftLayer;\n@property (nonatomic, readwrite, strong)\
  \ CALayer *rightLayer;\n@property (nonatomic, readwrite, strong) CALayer *frontLayer;\n\
  @property (nonatomic, readwrite, strong) CALayer *backLayer;\n@end\n```\n\nBoxViewController.m\
  \ (Box)\n\n```objectivec\n@implementation BoxViewController\n@synthesize topLayer=topLayer_;\n\
  @synthesize bottomLayer=bottomLayer_;\n@end\n```\n\n\n\n\n```objc\n@synthesize leftLayer=leftLayer_;\n\
  @synthesize rightLayer=rightLayer_;\n@synthesize frontLayer=frontLayer_;\n@synthesize\
  \ backLayer=backLayer_;\n\nconst CGFloat kSize = 100.;\nconst CGFloat kPanScale\
  \ = 1./100.;\n```\n\n```objc\n- (CALayer *)layerWithColor:(UIColor *)color transform:(CATransform3D)transform\
  \ {\n  CALayer *layer = [CALayer layer];\n  layer.backgroundColor = [color CGColor];\n\
  \  layer.bounds = CGRectMake(0, 0, kSize, kSize);\n  layer.position = self.view.center;\n\
  \  layer.transform = transform;\n  [self.view.layer addSublayer:layer];\n  return\
  \ layer;\n}\n\nstatic CATransform3D MakePerspetiveTransform() {\n  CATransform3D\
  \ perspective = CATransform3DIdentity;\n  perspective.m34 = -1./2000.;\n  return\
  \ perspective;\n}\n\n- (void)viewDidLoad {\n  CATransform3D transform;\n  [super\
  \ viewDidLoad];\n  transform = CATransform3DMakeTranslation(0, -kSize/2, 0);\n \
  \ transform = CATransform3DRotate(transform, M_PI_2, 1.0, 0, 0);\n  self.topLayer\
  \ = [self layerWithColor:[UIColor redColor]\n                                 transform:transform];\n\
  \  transform = CATransform3DMakeTranslation(0, kSize/2, 0);\n  transform = CATransform3DRotate(transform,\
  \ M_PI_2, 1.0, 0, 0);\n  self.bottomLayer = [self layerWithColor:[UIColor greenColor]\n\
  \                                     transform:transform];\n  transform = CATransform3DMakeTranslation(kSize/2,\
  \ 0, 0);\n  transform = CATransform3DRotate(transform, M_PI_2, 0, 1, 0);\n  self.rightLayer\
  \ = [self layerWithColor:[UIColor blueColor]\n                                 \
  \   transform:transform];\n  transform = CATransform3DMakeTranslation(-kSize/2,\
  \ 0, 0);\n  transform = CATransform3DRotate(transform, M_PI_2, 0, 1, 0);\n  self.leftLayer\
  \ = [self layerWithColor:[UIColor cyanColor]\n                                 \
  \   transform:transform];\n  transform = CATransform3DMakeTranslation(0, 0, -kSize/2);\n\
  \  transform = CATransform3DRotate(transform, M_PI_2, 0, 0, 0);\n  self.backLayer\
  \ = [self layerWithColor:[UIColor yellowColor]\n                               \
  \     transform:transform];\n  transform = CATransform3DMakeTranslation(0, 0, kSize/2);\n\
  \  transform = CATransform3DRotate(transform, M_PI_2, 0, 0, 0);\n  self.frontLayer\
  \ = [self layerWithColor:[UIColor magentaColor]\n                              \
  \      transform:transform];\n  self.view.layer.sublayerTransform = MakePerspetiveTransform();\n\
  \  UIGestureRecognizer *g = [[UIPanGestureRecognizer alloc]\n                  \
  \                 target:self\n                                   action:@selector(pan:)];\n\
  \  [self.view addGestureRecognizer:g];\n}\n\n- (void)pan:(UIPanGestureRecognizer\
  \ *)recognizer {\n  CGPoint translation = [recognizer translationInView:self.view];\n\
  \  CATransform3D transform = MakePerspetiveTransform();\n  transform = CATransform3DRotate(transform,\n\
  \                                  kPanScale * translation.x,\n                \
  \                  0, 1, 0);\n  transform = CATransform3DRotate(transform,\n   \
  \                               -kPanScale * translation.y,\n                  \
  \                1, 0, 0);\n  self.view.layer.sublayerTransform = transform;\n}\n\
  @end\n```\n\n这展示了如何构建一个简单的立方体并根据平移操作进行旋转。所有的层都是通过 `layerWithColor:transform:` 创建的。注意，所有层具有相同的\
  \ `position`。它们仅仅通过平移和旋转它们的变换（transforms）才看起来像是一个盒子的形状。\n\n你应用了一个透视 `sublayerTransform`（应用于所有子层但未应用于图层本身的变换）。虽然这里不涉及数学细节，但\
  \ 3D 变换矩阵的 `m34` 位置应该设置为 `-1/EYE_DISTANCE`。在大多数情况下，2000 个单位效果良好，但你可以调整此值来“缩放摄像头”。\n\
  \n你也可以像下面的代码所示通过设置 `position` 和 `zPosition` 而不是平移来构建这个立方体。这对于某些开发者来说可能更直观。\n\n###\
  \ BoxTransform.m (BoxTransform)\n\n```objc\n- (CALayer *)layerAtX:(CGFloat)x y:(CGFloat)y\
  \ z:(CGFloat)z\n               color:(UIColor *)color\n             transform:(CATransform3D)transform\
  \ {\n  CALayer *layer = [CALayer layer];\n  layer.backgroundColor = [color CGColor];\n\
  \  layer.bounds = CGRectMake(0, 0, kSize, kSize);\n  layer.position = CGPointMake(x,\
  \ y);\n  layer.zPosition = z;\n  layer.transform = transform;\n  [self.contentLayer\
  \ addSublayer:layer];\n  return layer;\n}\n\n- (void)viewDidLoad {\n  [super viewDidLoad];\n\
  \  CATransformLayer *contentLayer = [CATransformLayer layer];\n  contentLayer.frame\
  \ = self.view.layer.bounds;\n  CGSize size = contentLayer.bounds;\n  contentLayer.transform\
  \ = CATransform3DMakeTranslation(size.width/2, size.height/2, 0);\n  [self.view.layer\
  \ addSublayer:contentLayer];\n  self.contentLayer = contentLayer;\n  self.topLayer\
  \ = [self layerAtX:0 y:-kSize/2 z:0\n                            color:[UIColor\
  \ redColor]];\n}\n\n- (void)pan:(UIPanGestureRecognizer *)recognizer {\n  CGPoint\
  \ translation = [recognizer translationInView:self.view];\n  CATransform3D transform\
  \ = CATransform3DIdentity;\n  transform = CATransform3DRotate(transform,\n     \
  \                             kPanScale * translation.x,\n                     \
  \             0, 1, 0);\n  transform = CATransform3DRotate(transform,\n        \
  \                          -kPanScale * translation.y,\n                       \
  \           1, 0, 0);\n  self.view.layer.sublayerTransform = transform;\n}\n```\n\
  \n你现在需要插入一个 `CATransformLayer`。如果你只是使用 `CALayer`，`zPosition` 仅用于排序。这会让立方体看起来是平面的。`CATransformLayer`\
  \ 支持完全使用 `zPosition`，而不需要你应用变换。\n\n### 装饰你的图层\n\n`CALayer` 相比 `UIView` 的一个主要优势是，即使你在\
  \ 2D 环境下工作，它也能提供自动边框。例如，`CALayer` 可以自动为你提供圆角、彩色边框和阴影。所有这些都可以动画，例如，你可以调整位置和阴影来模拟按下和释放时的视觉效果。以下代码将创建图\
  \ 7-4 所示的层。\n\n![978196321-fg074.eps](img/978196321-fg074_fmt.jpeg)\n\n图 7-4 带有彩色圆角的层。\n\
  \n### DecorationViewController.m (Decoration)\n\n```objc\nCALayer *layer = [CALayer\
  \ layer];\nlayer.frame = CGRectMake(100, 100, 100, 100);\nlayer.cornerRadius = 10;\n\
  layer.backgroundColor = [[UIColor redColor] CGColor];\nlayer.borderColor = [[UIColor\
  \ blueColor] CGColor];\nlayer.borderWidth = 5;\nlayer.shadowOpacity = 0.5;\nlayer.shadowOffset\
  \ = CGSizeMake(3.0, 3.0);\n[self.view.layer addSublayer:layer];\n```\n\n### 使用 Action\
  \ 自动动画\n\n大多数时候，隐式动画都能满足你的需求，但有时你可能想要配置它们。你可以使用 `CATransaction` 关闭所有隐式动画，但那只适用于当前事务（通常是当前的运行循环）。要修改隐式动画的行为，特别是如果你希望它对该图层始终那样工作，你需要配置图层的动作。在以下示例中，`CircleLayer`\
  \ 是一个在其中心绘制给定 `radius` 红色圆形的图层。\n\n\n\n\n\n# ActionsViewController.m (Actions)\n\
  \n```objc\nCircleLayer *circleLayer = [CircleLayer new];\n  circleLayer.radius =\
  \ 20;\n  circleLayer.frame = self.view.bounds;\n  [self.view.layer addSublayer:circleLayer];\n\
  \  ...\n  [circleLayer setPosition:CGPointMake(100, 100)];\n```\n\n让我们修改一下代码，使得位置的改变始终在\
  \ 2 秒内进行动画：\n\n```objc\nCircleLayer *circleLayer = [CircleLayer new];\n  circleLayer.radius\
  \ = 20;\n  circleLayer.frame = self.view.bounds;\n  [self.view.layer addSublayer:circleLayer];\n\
  \  CABasicAnimation *anim = [CABasicAnimation animationWithKeyPath:@”position”];\n\
  \  anim.duration = 2;\n  NSMutableDictionary *actions = [NSMutableDictionary dictionaryWithDictionary:[circleLayer\
  \ actions]];\n  [actions setObject:anim forKey:@”position”];\n  circleLayer.actions\
  \ = actions;\n  ...\n  [circleLayer setPosition:CGPointMake(100, 100)];\n```\n\n\
  将 action 设置为 `[NSNull null]` 会禁用该属性的隐式动画。由于字典不能包含 `nil`，因此你需要使用 `NSNull` 类。\n\n\
  还有一些特殊的 action，用于层被添加到图层树时（`kCAOnOrderIn`）以及被移除时（`kCAOnOrderOut`）。例如，你可以像这样创建一个放大和淡入的组合动画：\n\
  \n```objc\nCABasicAnimation *fadeAnim = [CABasicAnimation animationWithKeyPath:@”opacity”];\n\
  \  fadeAnim.fromValue = [NSNumber numberWithDouble:0.4];\n  fadeAnim.toValue = [NSNumber\
  \ numberWithDouble:1.0];\n  CABasicAnimation *growAnim = [CABasicAnimation animationWithKeyPath:@”transform.scale”];\n\
  \  growAnim.fromValue = [NSNumber numberWithDouble:0.8];\n  growAnim.toValue = [NSNumber\
  \ numberWithDouble:1.0];\n  CAAnimationGroup *groupAnim = [CAAnimationGroup animation];\n\
  \  groupAnim.animations = [NSArray arrayWithObjects:fadeAnim, growAnim, nil];\n\
  \  [actions setObject:groupAnim forKey:kCAOnOrderIn];\n```\n\n在处理一个层替换为另一个层的过渡（`kCATransition`）时，actions\
  \ 同样重要。这通常配合 `CATransition`（一种特殊的 `CAAnimation` 类型）一起。你可以将 `CATransition` 作为 `contents`\
  \ 属性的 action，在内容更改时创建幻灯片等特殊效果。默认情况下，使用淡入过渡。\n\n## 为自定义属性制作动画\n\nCore Animation 隐式地动画多个层属性，但\
  \ `CALayer` 子类上的自定义属性呢？例如，在 `CircleLayer` 中，你有一个 `radius` 属性。默认情况下，`radius` 不是动画的，但\
  \ `contents` 是的（使用淡入 `CATransition`）。因此，改变半径会导致你当前的圆与新圆之间进行交叉淡入。这可能不是你想要的。你希望 `radius`\
  \ 像 `position` 一样产生动画。要实现这一点需要几个步骤，如下例所示：\n\n### CircleLayer.m (Actions)\n\n```objc\n\
  @implementation CircleLayer\n@dynamic radius;\n- (id)init {\n  self = [super init];\n\
  \  if (self) {\n    [self setNeedsDisplay];\n  }\n  return self;\n}\n- (id)initWithLayer:(id)layer\
  \ {\n  self = [super initWithLayer:layer];\n  [self radius:[layer radius]];\n  return\
  \ self;\n}\n- (void)drawInContext:(CGContextRef)ctx {\n  CGContextFillWithColor(ctx,\
  \ [[UIColor redColor] CGColor]);\n  CGFloat radius = self.radius;\n  CGRect rect;\n\
  \  rect.size = CGSizeMake(radius, radius);\n  rect.origin.x = (self.bounds.width\
  \ - radius) / 2;\n  rect.origin.y = (self.bounds.height - radius) / 2;\n  CGContextAddEllipseRect(ctx,\
  \ rect);\n  CGContextFillPath(ctx);\n}\n+ (BOOL)needsDisplayForKey:(NSString *)key\
  \ {\n  if ([key isEqualToString:@”radius”]) {\n    return YES;\n  }\n  return [super\
  \ needsDisplayForKey:key];\n}\n- (id <CAAction>)actionForKey:(NSString *)key {\n\
  \  if ([self presentationLayer] != nil) {\n    if ([key isEqualToString:@”radius”])\
  \ {\n      CABasicAnimation *anim = [CABasicAnimation animationWithKeyPath:@”radius”];\n\
  \      anim.fromValue = [[self presentationLayer] forKey:@”radius”];\n      return\
  \ anim;\n    }\n  }\n  return [super actionForKey:key];\n}\n@end\n```\n\n我将先回顾一下基础知识。你在\
  \ `init` 中调用 `setNeedsDisplay`，以便在你第一次被添加到图层树时调用你自定义的 `drawInContext:`。你实现 `initWithLayer:`\
  \ 是为了将你的自定义属性拷贝到演示层（presentation layer）。你重写 `needsDisplayForKey:` 是为了每当 `radius`\
  \ 被修改时，它都会自动重绘。\n\n现在处理你的 actions 了。你实现 `actionForKey:` 来返回一个动画，其 `fromValue` 为当前显示的（`presentationLayer`）半径。这意味着如果动画在执行过程中发生更改，你将获得平滑动画。\n\
  \n至关重要的一点是，你在这里使用的是 `@dynamic` 而不是 `@synthesize` 来实现 `radius` 属性。`CALayer` 在运行时自动为它的属性生成访问器，而这些访问器具有重要的逻辑。务必不要通过实现自己的访问器或使用\
  \ `@synthesize` 来重写它。\n\n## Core Animation 与线程\n\n值得注意的是，Core Animation 对线程非常宽容。通常情况下，你可以在任何线程上修改\
  \ `CALayer` 属性，不像 `UIView` 属性。`drawInContext:` 可以从任何线程调用（尽管特定的 `CGContext` 应该一次只由一个线程修改）。对\
  \ `CALayer` 属性的更改会被批处理到使用 `CATransaction` 的事务中。如果你有运行循环（run loop），这会自动发生。如果没有运行循环，你需要定期调用\
  \ `[CATransaction flush]`。尽管如此，如果可能，你应该在具有运行循环的线程上执行 Core Animation 操作以提高性能。\n\n\
  ### 总结\n\nCore Animation 是 iOS 中最重要的框架之一。它在极其强大的引擎面前提供了一个相当易于使用的 API。然而，它仍然存在一些处理不够完美的地方，有时某些事情需要“恰到好处”才能正常工作（例如，使用\
  \ `@dynamic` 而不是 `@synthesize` 来实现你的属性）。当它不正常工作时，调试可能会很有挑战性，因此良好地理解它的原理原理关重要。希望本章让你对架构和文档充满足够的信心，去投入开发并制作应用程序。\n\
  \n### 延伸阅读\n\nApple 文档\n\n以下文档可以在 [developer.apple.com](https://developer.apple.com/)\
  \ 上的通过 Xcode 文档和 API 参考获取：\n\nAnimation Types and Timing Programming Guide\n\nCore\
  \ Animation Programming Guide\n\n其他资源\n\nDzhumerov, Milen，“Core Animation 的三模型，”Code\
  \ Juggler。关于透视变换背后数学问题的极佳概述，包含了魔法数字 -1/2000。[`milen.me/technical/core-animation-3d-model/`](http://milen.me/technical/core-animation-3d-model/)\n\
  \nGallagher, Matt，“Core Animation 中的参数曲线，”Cocoa With Love。解释了如何实现 `CAMediaTimingFunction`\
  \ 无法实现的曲线，例如阻尼振荡和指数衰减。[cocoawithlove.com/2008/09/parametric-acceleration-curves-in-core.html](http://cocoawithlove.com/2008/09/parametric-acceleration-curves-in-core.html)\n\
  \n\n\n\n在本章中，你将学习 Cocoa 用于处理错误的主要模式，你可以在你自己的项目中使用这些模式。你还将学习到主要的错误处理工具，包括断言（assertions）、异常（exceptions）和\
  \ `NSError` 对象。由于你的程序在环境中可能会崩溃，你将学习如何从用户那里获取这些崩溃报告，以及如何有效高效地记录日志。\n\n### 错误处理模式\n\
  \n处理错误有几种有效的方法。第一种且显而易见的方法是崩溃。这不是一个完美的解决方案，但不要太快地否定它。我见过很多非常复杂的代码是为了处理极少数可能发生的错误，或者你根本无法恢复的错误。其中最常见的是内存分配失败。考虑以下代码：\n\
  \n```objc\nNSString *string = [NSString stringWithFormat:@”%d”, 1];\nNSArray *array\
  \ = [NSArray arrayWithObject:string];\n```\n\n可以想象（并非如此，但让我们假装）`stringWithFormat:`\
  \ 可能会因为 Foundation 无法分配内存而失败。在这种情况下，它返回 `nil`，而对 `arrayWithObject:` 的调用会因为尝试向数组插入\
  \ `nil` 而抛出异常，你的 App 可能会崩溃。你可以（在 C 中你通常会这样做）在此处包含一个检查以确保这种情况不会发生。不要这样做。这会让代码变得不必要的复杂，而且无论如何你也做不了。如果你无法分配少量的内存，操作系统很可能要关闭你的程序了。此外，在\
  \ Objective-C 中，编写一段本身不分配内存的错误处理代码几乎是不可能的。接受在那种不可能的情况下你可能会崩溃，并保持代码简单。\n\n下一种紧密相关的错误处理方法是\
  \ `NSAssert`。它会抛出一个 `NSInternalInconsistencyException`，默认情况下这会让你的程序崩溃。特别是在开发期间，这是一件好事。它能够“快速失败”（fails\
  \ fast），这意味着失败倾向于发生在 bug 附近。我在代码中看到的糟糕情况之一是这样的：\n\n```objc\n- (void)doSomething:(NSUInteger)index\
  \ {\n  if (index > self.maxIndex) {\n    return;\n  }\n  ...  \n}\n```\n\n显然，传递一个超出范围的索引是一个编程错误。这段代码忽略了这个错误，将其变成一个无操作（no-op）。这极其难以调试。注意\
  \ `NSArray` 是如何处理这种情况的。如果你传递了一个超出范围的索引，它会抛出一个与 `NSAssert` 非常相似的异常。传递正确的值是调用者的责任。`NSArray`\
  \ 能做的最坏事情就是静地忽略错误值。崩溃反而好过。我将在接下来的两个章节“断言”和“异常”中详细讨论断言，包括如何管理开发版本和发布版本，以及如何让这些变得稍微优雅一些。\n\
  \n这里的教训是，崩溃并不是最坏的结果。数据损坏通常是最坏的结果，如果进入一个深度未知的状态可能会损坏用户数据，那么崩溃要好得多。\n\n预期的错误应该被优雅地处理，并且永远不要崩溃。管理预期错误的通用模式是通过引用返回一个\
  \ `NSError` 对象。我将在本章稍后的“错误与 NSError”中讨论这一点。\n\n预期错误和非预期错误之间存在主要差异。在 iOS 中，无法分配少量内存是一个意外错误。它在正常操作中不应该发生。你应该在进入该状态很久以前就收到了内存警告并被终止了。你通常可以忽略真正的意外错误并让它们导致你崩溃。另一方面，磁盘空间不足是一个罕见但预期的错误。如果用户要求\
  \ iTunes 向设备中填充音乐，这很容易发生。当你无法写入文件时，你需要优雅地恢复。\n\n处于中间的是编程错误。这些通常应该用断言来处理。\n\n## 断言\n\
  \n断言是防御编程错误的重要防线。断言要求程序在某一点某些必须为真。如果它为假，则程序处于未定义状态，不应继续运行。考虑以下 `NSAssert` 示例：\n\n\
  ```objc\nNSAssert(x == 4, @”x must be four”);\n```\n\n`NSAssert` 测试一个条件，如果它返回 `NO`，则抛出一个异常。这由当前的异常处理器处理，默认情况下它调用\
  \ `abort` 并导致程序崩溃。如果你熟悉 Mac 开发，你可能习惯于异常只终止当前的运行循环（run loop），但 iOS 默认调用 `abort`，无论它在哪个线程上运行都会终止程序。\n\
  \n技术上，`abort` 向进程发送一个 `SIGABRT` 信号，可以被信号处理程序捕获。通常我不建议捕获 `SIGABRT`。请参本章稍后的“捕获和报告崩溃”获取有关如何处理崩溃的信息。\n\
  \n你可以通过设置 `NS_BLOCK_ASSERTIONS` 来禁用 `NSAssert`。关于是否在发布代码中禁用 `NSAssert` 存在不同意见。这归根结底：当你的程序处于非法状态时，你希望它停止运行，还是希望它以一种可能的随机方式运行？不同的人在这里得出不同的结论。我的观点是，在发布代码中禁用断言通常是更好的。我见过太多情况，编程错误本只会引起一个小问题，但断言导致了崩溃。Xcode\
  \ 4 模板在为 Release 配置构建项目时会自动禁用断言。\n\n尽管如此，虽然我喜欢在 Release 配置中移除断言，但我不喜欢忽略它们。它们正是你希望在日志中找到的那种“永远不应该发生”的错误条件。设置\
  \ `NS_BLOCK_ASSERTIONS` 会完全完全消除它们。我的解决方案是包装断言，以便它们在所有情况下都能记录。以下代码假设你有一个记录到文件的 `RNLog`\
  \ 函数。它映射到 `NSLog` 作为一个示例。通常我不喜欢使用 `#define`，但这里是必要的，因为 `__FILE__` 和 `__LINE__` 需要在调用处求值。\n\
  \n这定义了 `RNCAssert` 作为 `NSCAssert` 的包装。在 C 函数中使用断言，而不是 Objective-C 方法时，需要 `NSCAssert`。\n\
  \n### RNAssert.h\n\n```objc\n#import <Foundation/Foundation.h>\n\n#define RNLogBug\
  \ NSLog // 如果你使用 Lumberjack 请使用 DDLogError\n\n// RNAssert 和 RNCAssert 的工作与 NSAssert\
  \ 和 NSCAssert 完全相同\n// 只是它们在发布模式下也会记录\n#define RNAssert(condition, desc, ...) \\\
  \n  if (!(condition)) { \\\n    RNLogBug((desc), ## __VA_ARGS__); \\\n    NSAssert((condition),\
  \ (desc), ## __VA_ARGS__); \\\n  }\n#define RNCAssert(condition, desc) \\\n  if\
  \ (!(condition)) { \\\n    RNLogBug((desc), ## __VA_ARGS__); \\\n    NSCAssert((condition),\
  \ (desc), ## __VA_ARGS__); \\\n  }\n```\n\n断言通常出现在会导致崩溃的代码之前。例如（假设你使用 `RNAssert`\
  \ 即使在 Release 配置中记录）：\n\n```objc\nRNAssert(foo != nil, @”foo must not be nil”);\n\
  [array addObject:foo];\n```\n\n这种方法的问题是，在环境中，即使禁用了断言，它仍然会崩溃。如果你在很多情况下仍然会崩溃，那么禁用断言的意义何？这导致了这样的代码：\n\
  \n```objc\nRNAssert(foo != nil, @”foo must not be nil”);\nif (foo != nil) {\n  [array\
  \ addObject:foo];\n}\n```\n\n那样稍微好一点，使用了 `RNAssert` 以便进行记录，但你有了重复的代码。如果断言和条件不匹配，这增加了产生\
  \ bug 的机会。相反，当你需要断言时，我推荐这种模式：\n\n```objc\nif (foo != nil) {\n  [array addObject:foo];\n\
  }\nelse {\n  RNAssert(NO, @”foo must not be nil”);\n}\n```\n\n\n\n这确保了断言始终与条件匹配。有时断言是多此一举的，但在你需要断言的情况下，这是一个很好的模式。然而，我几乎总是建议将断言作为\
  \ `switch` 语句的默认分支（default）。\n\n```objc\nswitch (foo) {\n  case kFooOptionOne:\n\
  \    ...\n    break;\n  case kFooOptionTwo:\n    ...\n    break;\n  default:\n \
  \   RNAssert1(NO, @”Unexpected value for foo: %d”, foo):\n    break;\n}\n```\n（注：原文包含\
  \ `RNAssert1`，可能是 `assert` 的拼写错误）\n\n通过这样，如果你添加了一个新的枚举项，它将帮助你捕获任何未能更新的 `switch`\
  \ 块。\n\n### 异常 (Exceptions)\n\n异常不是 Objective-C 中处理错误的正常方式。参考异常编程主题)：\n\nCocoa 框架通常不是异常安全的。通用模式是异常仅保留给程序员错误，捕获到此类异常的程序应该随后尽快退出。\n\
  \n简而言之，异常不是用于处理 Objective-C 中可恢复的错误的。异常用于处理那些永远不应该发生且应该终止程序的事件。这与 `NSAssert` 类似，事实上\
  \ `NSAssert` 是通过异常来实现的。\n\nObjective-C 在语言级别支持异常，使用了如 `@throw` 和 `@catch` 等指令，但你通常不应该使用这些指令。很少有好的理由去捕获异常，除非在程序的顶层，而这是由全局异常处理器替你完成的。如果你想抛出异常来指示编程错误，最好使用\
  \ `NSAssert` 来抛出 `NSInternalInconsistencyException`，或者创建并抛出你自己的 `NSException` 对象。你可以手动构建这些对象，但为了简单起见，我推荐使用\
  \ `+raise:format:`。\n\n```objc\n[NSException raise:NSRangeException\n          \
  \   format:@”Index (%d) out of range (%d...%d)”,\n                     index, min,\
  \ max];\n```\n\n很少有理由这样做。在大多数情况下，使用 `NSAssert` 会同样清晰且有用。因为你通常不应该直接捕获异常，`NSInternalInconsistencyException`\
  \ 和 `NSRangeException` 之间的区别很少用处。\n\n自动引用计数（ARC）在 Objective-C 中默认不是异常安全的。你应该预期异常会导致大量的内存泄漏。原则上讲，ARC\
  \ 在 Objective-C++ 中是异常安全的，但 `@autoreleasepool` 块仍然不会释放，这可能导致后台线程上的泄漏。使 ARC 异常安全会带来性能代价，这是避免大量使用\
  \ Objective-C++ 的众多原因之一。clang 标志 `-fobjc-arc-exceptions` 控制此。\n\n### 捕获和报告崩溃 (Catching\
  \ and Reporting Crashes)\n\niTunes Connect 应该提供崩溃报告，但它有很多局限性。Apple 会向用户一次性请求权限以上传崩溃报告。许多用户会拒绝。报告每天只更新一次。iTunes\
  \ Connect 只支持部署在 App Store 上的应用程序，因此在开发和内部测试期间你需要一套不同的系统。简而言之，如果 iTunes Connect\
  \ 对你有效，那就太好了，但它通常并不行。\n\n我发现最好的替代方案是 Quincy Kit (`quincykit.net`)。它很容易集成到现有项目中，并在征得用户许可后将报告上传到你自己的\
  \ Web 服务器。目前它不处理随崩溃报告一起上传的日志。\n\nQuincy Kit 构建在 Plausible Labs 的 `PLCrashReporter`\
  \ 之上。`PLCrashReporter` 处理捕捉崩溃信息的复杂问题。Quincy Kit 为上传这些信息提供了一个友好的前端。如果你需要更大的灵活性，可以考虑编写自己版本的\
  \ Quincy Kit。它既方便又好，但并没有那么复杂。你可能不应该尝试重写 `PLCrashReporter`。当程序处于崩溃过程中，它可能处于一种诡异且未知的状态。妥善处理随之的所有细微问题并不简单，Landon\
  \ Fuller 致力于 `PLCrashReporter` 多多年。即使是分配或释放内存这样简单的操作也可能导致系统死锁并迅速耗尽。这就是为什么 Quincy\
  \ Kit 在程序重启时上传崩溃文件，而不是在崩溃期间。在崩溃事件期间，你应该尽可能少操作。\n\n当你获得崩溃报告时，取决于你的镜像是如何构建的，它们可能包含符号表，也可能不包含。Xcode\
  \ 在 Organizer 中通常对报告进行自动符号化（将地址替换为方法名）做得很好，只要你为你交付的每个二进制文件保留了 `.dSYM` 文件。Xcode 使用\
  \ Spotlight 查找这些文件，因此请确保它们位于 Spotlight 可以搜索的地方。\n\n### 错误与 NSError (Errors and NSError)\n\
  \n用户或环境错误与编程错误之间存在主要差异。编程错误应该在调试模式下用异常处理，在发布模式下用日志记录。如果可能数据损坏，编程错误在发布模式下也应该抛出异常。在\
  \ iOS 中，分配少量内存失败被视为编程错误，因为这不应该是可能的，且几乎指示了编程错误。\n\n用户错误或环境错误（网络失败、磁盘满等）永远不应该抛出异常。它们应该返回错误，通常使用\
  \ `NSError` 对象。`NSFileManager` 是大量使用 `NSError` 的对象的示例。\n\n```objc\n- (BOOL)copyItemAtPath:(NSString\
  \ *)srcPath\n               toPath:(NSString *)dstPath\n                   error:(NSError\
  \ **)error\n```\n\n该方法将文件或目录从一个位置复制到另一个位置。显然，这可能由于各种原因而失败。如果失败，该方法返回 `NO` 并更新调用者传递的\
  \ `NSError` 对象。\n\n```objc\nNSError *error;\nif (! [fileManager copyItemAtPath:srcPath\
  \ toPath:dstPath error:&error]) {\n  [self handleError:error];\n}\n```\n\n这种模式非常方便，返回值与操作的成功与一致。如果方法改为返回\
  \ `NSError`，那么 `nil` 将表示成功。这会令人困惑且容易出错。内部实现可能如下：\n\n```objc\n- (BOOL)copyItemAtPath:(NSString\
  \ *)srcPath\n               toPath:(NSString *)dstPath\n                   error:(NSError\
  \ **)error {\n  BOOL success = ...;\n  if (! success) {\n    if (error != NULL)\
  \ {\n      *error = [NSError errorWithDomain:...];\n    }\n  }\n  return success;\n\
  }\n```\n\n注意这种方法在解引用之前检查 `error`（指针的指针）是否为 `NULL`。这允许调用者传递 `NULL` 来表示他们不在乎错误细节。他们可能仍然检查返回值来确定操作的整体成功与。\n\
  \n`NSError` 将错误信息封装在一个统一的包中，方便传递。显然可以在程序内部传递，但由于它符合 `NSCoding` 协议，很容易写入磁盘或通过网络传输。它甚至可以使用\
  \ `NSErrorRecoveryAttempting` 协议来封装错误恢复机制。\n\n错误主要通过其域（domain）和代码（code）定义。代码是一个整数，域是一个字符串，允许你识别该整数的含义。例如，在\
  \ `NSPOSIXErrorDomain` 中，错误代码 4 表示系统调用被中断 (`EINTR`)，但在 `NSCocoaDomain` 中，错误代码 4\
  \ 表示找不到文件 (`NSFileNoSuchFileError`）。如果没有域，调用者猜测如何解释错误代码。鼓励你为自己的错误创建自己的域。通常你应该为此使用统一类型标识（UTI），例如\
  \ `com.example.MyApp.ErrorDomain`。\n\n\n\n\n\n`NSError` 包含一个用户信息字典（user info dictionary），它可以包含任何你想要。该字典有几个预定义的键，例如\
  \ `NSLocalizedDescriptionKey`、`NSUnderlyingErrorKey` 和 `NSRecoveryAttempterErrorKey`。你可以自由创建新键来提供特定领域的信息。已经有一些领域在这样做，例如用于传递相关字符串编码的\
  \ `NSStringEncodingErrorKey` 或用于传递 URL 的 `NSURLErrorKey`。\n\n## 错误本地化\n\n在哪里进行错误本地化始终是一个棘手的问题。低层框架倾向于以非常不便于用户的方式呈现错误。诸如“系统调用被中断\
  \ (4)”之类的错误对用户通常没有帮助。将此类错误消息翻译成法语或西班牙语没有任何帮助。这只会浪费金钱，并让使用更多语言的用户感到困惑。本地化这类错误消息实际上会让调试变得更加困难，因为发送给你的日志可能是用你无法阅读的语言报告错误。\n\
  \n最后一点需要强调：你永远不要本地化一个你不打算显示给用户的字符串。\n\n由于错误通常需要以开发者的语言记录日志，我建议在大多数情况下不要对 `NSError`\
  \ 使用 `NSLocalizedDescriptionKey` 及其相关键。相反，仅在显示错误时进行本地化。你可以使用与错误领域同名（加上 `.strings`\
  \ 后缀）的本地化字符串表，来为各种错误代码保留本地化字符串。例如，对于错误领域 `com.example.MyApp.ErrorDomain`，你将有一个名为\
  \ `com.example.MyApp.ErrorDomain.strings` 的本地化字符串文件。在该文件中，只需将错误代码映射到本地化值即可：\n\n\
  ```objc\n“1” = “File not found.”\n```\n\n然后，读取文件只需使用 `NSBundle`：\n\n```objc\nNSString\
  \ *key = [NSString stringWithFormat:@”%d”, [error code]];\nNSString *localizedMessage\
  \ = [[NSBundle mainBundle]\n                               localizedStringForKey:key\n\
  \                               value:nil\n                               table:[error\
  \ domain]];\n```## 错误恢复尝试者\n\n错误恢复尝试者（error recovery attempter）是将错误恢复选项编码到 `NSError`\
  \ 对象中的方法。如果错误通过了多个层，这可以让 UI 与原始子系统通信，让其尝试恢复。错误恢复系统封装了本地化选项、一些描述文本（称为“建议”）以及一个用于告知所选选项的对象。该对象应该符合\
  \ `NSRecoveryAttempting` 非正式协议。\n\niOS 没有为错误恢复提供 UI 集成，但自己实现并不困难。这里是一个单例示例，将根据错误恢复选项管理\
  \ `UIActionSheet`。\n\n### RNErrorManager.h (ErrorRecovery)\n\n```objc\n@interface\
  \ RNErrorManager : NSObject <UIActionSheetDelegate>\n+ (RNErrorManager *)sharedManager;\n\
  - (UIActionSheet *)actionSheetForError:(NSError *)error;\n@end\n```\n\n### RNErrorManager.m\
  \ (ErrorRecovery)\n\n```objc\n#import “RNErrorManager.h”\nstatic const char kRNErrorKey;\n\
  static RNErrorManager *sSharedManager;\n\n@implementation RNErrorManager\n+ (void)initialize\
  \ {\n  sSharedManager = [[RNErrorManager alloc] init];\n}\n\n+ (RNErrorManager *)sharedManager\
  \ {\n  return sSharedManager;\n}\n\n- (UIActionSheet *)actionSheetForError:(NSError\
  \ *)error {\n  UIActionSheet *sheet = [[UIActionSheet alloc] init];\n  sheet.title\
  \ = [error localizedRecoverySuggestion];\n  sheet.delegate = self;\n  for (NSString\
  \ *option in [error localizedRecoveryOptions]) {\n    [sheet addButtonWithTitle:option];\n\
  \  }\n  objc_setAssociatedObject(sheet, &kRNErrorKey, error,\n                 \
  \            OBJC_ASSOCIATION_RETAIN_NONATOMIC);\n  return sheet;\n}\n\n- (void)actionSheet:(UIActionSheet\
  \ *)actionSheet\nclickedButtonAtIndex:(NSInteger)buttonIndex {\n  NSError *error\
  \ = objc_getAssociatedObject(actionSheet,\n                                    \
  \        &kRNErrorKey);\n  id attempter = [error recoveryAttempter];\n  if ([attempter\
  \ respondsToSelector:@selector(attemptRecoveryFromError:optionIndex:)]) {\n    [[error\
  \ recoveryAttempter] attemptRecoveryFromError:error\n                          \
  \                 optionIndex:buttonIndex];\n  } else {\n    NSAssert(NO, @”Recovery\
  \ attempter does not implement protocol.”);\n  }\n}\n@end\n```\n\n在 `actionSheetForError:`\
  \ 中，这生成了一个 `UIActionSheet`，将自己设置为代理，并使用 `objc_setAssociatedObject` 将原始的 `NSError`\
  \ 绑定到 sheet 上。这样你就会被回调，并可以确定相关的错误。当按钮被点击时，你通过 `objc_getAssociatedObject` 获取错误并调用尝试者上的代理方法。调用代码可能像这样：\n\
  \n### ErrorViewController.m (ErrorRecovery)\n\n```objc\nNSArray *options = [NSArray\
  \ arrayWithObjects:\n                    LocalizedString(@”away”, @”OPTION: Avoid\
  \ error by leaving.”),\n                    LocalizedString(@”Hide”, @”OPTION: Avoid\
  \ error by hiding.”),\n                    LocalizedString(@”Fix”, @”OPTION: Fix\
  \ error”),\n                    nil];\nNSMutableDictionary *userInfo = [NSMutableDictionary\
  \ dictionary];\n[userInfo setObject:self forKey:NSRecoveryAttempterKey];\n[userInfo\
  \ setObject:options forKey:NSLocalizedRecoveryOptionsKey];\n[userInfo setObject:NSLocalizedString(@”What\
  \ do you want to do?”, @”Request decision.”) forKey:NSLocalizedRecoverySuggestionKey];\n\
  NSError *error = [NSError errorWithDomain:RNAppDomain\n                        \
  \       code:kRNAppBadThing\n                             userInfo:userInfo];\n\
  UIActionSheet *sheet = [[RNErrorManager sharedManager] actionSheetForError:error];\n\
  [sheet showInView:self.view];\n```\n\n由于你可以以多种方式显示 `UIActionSheet`，让 `RNErrorManager`\
  \ 返回 sheet 而不是自己展示它会更方便。如果你的应用程序只以一种方式展示这些，那么可以将 `showIn...:` 调用移动到 `RNErrorManager`。\n\
  \n最后，你在原始调用者处实际响应用户的选择。这很好地将错误恢复逻辑与错误呈现分离，允许你在整个应用程序中提供一致的错误 UI。\n\n### ErrorRecoveryViewController.m\
  \ (ErrorRecovery)\n\n```objc\n- (void)attemptRecoveryFromError:(NSError *)error\n\
  \                   optionIndex:(NSUInteger)recoveryOptionIndex {\n  switch (recoveryOptionIndex)\
  \ {\n    case kRecoveryOptionRunAway:\n      NSLog(@”Run Away!”);\n      break;\n\
  \    case kRecoveryOptionHide:\n      NSLog(@”Hide!”);\n      break;\n    case kRecoveryOptionFix:\n\
  \      NSLog(@”OK, fix it....”);\n      break;\n    default:\n      NSAssert(NO,\
  \ @”Unknown recovery option: %d”, recoveryOptionIndex);\n  }\n}\n```\n\n## Logs\n\
  \n日志是调试的关键部分。它也很难做好。你希望记录正确的内容，并以正确的方式记录。让我们从正确的方式记录开始。\n\nFoundation 提供了唯一的日志调用：`NSLog`。`NSLog`\
  \ 唯一的优势是它方便。它不灵活且速度极慢。最糟糕的是它会记录到控制台，这在发布的代码中永远是不合适的。`NSLog` 不应该出现在生产代码中。\n\n有些人通过这种简单的方法解决这个问题：\n\
  \n```objc\n#ifdef DEBUG\n#define MYLog NSLog\n#else\n#define MYLog\n#endif\n```\n\
  \n\n\n\n移除 `NSLog` 没问题，但现在你完全没有日志了，这并不理想。你需要的是一个既能适应开发又能适应发布环境的日志引擎。以下是你在构建日志引擎时需要考虑的一些点：\n\
  \n- 它应该在 debug 模式下输出到控制台，在 release 模式下输出到文件。如果你不在 debug 模式下输出到控制台，你将在 `Xcode` 中看不到日志输出。理想情况下，它应该同时输出到这两个地方。\n\
  - 它应该包含日志级别（error、warning、info、verbose）。\n- 它应该确保对禁用的日志级别进行记录的开销很小。\n- 在写入文件或控制台时，不应该阻塞调用线程。\n\
  - 它必须支持日志滚动（log aging），以避免填满硬盘。\n- 它应该易于调用，通常使用带有变长参数的 C 语法，而不是 Objective-C 语法。`NSLog`\
  \ 接口非常易用，你想要一个看起来基本上那样的东西。你绝对不希望简单的日志语句需要多行代码。\n\n我目前对 iOS 日志的推荐是来自 Deusty Designs\
  \ 的 Robbie Hanson 的 `Lumberjack`。请参阅本章末尾的“进一步阅读”获取链接。通常情况下，它只需要几行额外代码进行配置，并将 `NSLog`\
  \ 调用简单地替换为 `DDLog...` 调用即可实现。\n\n这仍然留下了一个关于“记录什么”的问题。如果你记录得太少，你就无法获得调试问题所需的信息。如果你记录得太多，即使是最好的系统也会不堪不堪，损害性能，并让你的日志老化过快，以至于你可能仍然没有你需要的信息。折中点取决于具体的应用程序，但有一些通用规则。\n\
  \n在添加日志语句时，问问自己你会对它做些什么。你是否只是在重复记录某些已经被其他日志语句覆盖的内容？当你记录的是数据而不仅仅是“我现在在这个方法里”时，这一点尤为重要。\n\
  \n如果你可能不会记录某些数据，请避免计算复杂数据。考虑以下代码：\n\n```objc\nNSString *expensiveValue = [self expensiveCall];\n\
  DDLogVerbose(@\"expensiveValue=%@\", expensiveValue);\n```\n\n如果你在接后的代码中从未使用 `expensiveValue`\
  \ 且没有开启详细日志（verbose logging），那么你就浪费了计算它的时间。`Lumberjack` 的编写方式确保了这种开销很小：\n\n```objc\n\
  DDLogVerbose(@\"expensiveValue=%@\", [self expensiveCall]);\n```\n\n这翻译为：\n\n```objc\n\
  do {\n    if(ddLogLevel && LOG_FLAG_VERBOSE)\n    [DDLog log:...format:@\"expensiveValue=%@\"\
  , [self expensiveCall]];\n} while(0);\n```\n\n在这种情况下，除非需要，否则 `expensiveCall` 不会被执行。日志级别被检查两次（一次在宏中，一次在\
  \ `[DDLog log...]` 中），但与 `expensiveCall` 相比，这是一个非常廉廉的操作。如果你自己构建日志引擎，这是一个值得模仿的技巧。\n\
  \n另一个类似的日志技巧是在进入循环之前确保你确实需要记录日志。在 `Lumberjack` 中，是这样做的：\n\n```objc\nif (LOG_VERBOSE)\
  \ {\n    for (id object in list) {\n        DDLogVerbose(@\"object=%@\", object);\n\
  \    }\n}\n```\n\n此点的目的是避免重复计算是否需要记录，并避免计算日志字符串。如果生成日志需要执行复杂的工作，这一点更为重要。\n\n在大多数情况下，详细日志是关闭的，因此即使\
  \ `DDLogVerbose` 再次检查级别，上述代码在大多数情况下也更廉高效，并且避免了为 `object` 创建字符串。当开启详细日志时，额外的 `LOG_VERBOSE`\
  \ 检查与循环的其他部分相比是微不足道的。\n\n### 记录敏感信息\n\n日志引发了严重的隐私问题。许多应用程序处理的信息绝不应该进入日志中。显然，你不应该记录密码或信用卡号，但这有时比听起来要复杂。如果敏感信息通过网络发送，而你记录了数据包怎么办？你可能需要在写入日志之前对你的日志进行过滤以避免这种情况。\n\
  \n不要让你的客户“仅仅信任你”来处理他们的敏感信息。这不仅让客户面临风险，而且你拥有的信息越多，需要考虑的法律问题就越多。没有什么事情能比咨询律师消耗利润得快了。\n\
  \n定期审计你的日志，以确保你没有记录敏感信息。在最高日志级别运行程序后，在日志中搜索你的密码任何其他敏感信息。如果你有自动化测试，这通常可以很方便地添加。\n\
  \n加密日志对这种情况没有任何帮助。问题在于用户将日志发送给你，而你又拥有解密密钥。如果你觉得需要加密日志，你可能记录了你不该记录的内容。\n\n在开发过程中，偶尔在日志中看到真实数据是很重要的。我花了很长时间追踪一个\
  \ bug，当时我们丢掉了密码的最后一个字符。如果我们记录了密码，发现它将会容易得多。如果你需要这种功能，只需确保它不会留在生产代码中。\n\n### 获取你的日志\n\
  \n如果你无法获取日志，它们就没什么用了。在发送日志之前不要忘记请求许可。不仅有隐私问题，发送日志会消耗大量的带宽和电池。通常情况下，你应该只在响应问题时发送日志。你通常需要先对它们进行压缩。\n\
  \n### 总结\n\n错误处理是任何环境中棘手的部分之一。在事情顺利时管理它们比在出错时要容易得多。在本章中，你已经看到了在事情出错时如何妥处理。没有什么能让这个过程变得简单，但你应该拥有让它变得可以工具。\n\
  \n### 进一步阅读\n\n#### Apple 文档\n\n以下文档可以在 `developer.com` 的 iOS 开发者库或 Xcode 文档和 API\
  \ 参考。\n\n#### 异常编程主题\n\n- 错误处理指南\n- TN2151：理解和分析 iPhone 崩溃报告\n\n#### 其他资源\n\n- **Clang\
  \ 文档**，“自动引用计数”。这是关于 ARC 和异常如何交互的官方文档。`clang.llvm.org/docs/AutomaticReferenceCounting.html#misc.exceptions`\n\
  - **Lumberjack**。Mac 和 iOS 日志。`code.google.com/p/lumberjack/`\n- **Olsson, Fredrik**，“iOS\
  \ 异常与错误，”Jayway 博客。关于程序员错误与用户错误以及处理异常与其他类型错误的非常很好的讨论。`blog.jayway.com/2010/10/13/exceptions-and-errors-on-ios`\n\
  - **Quincy Kit**。一个不错的 iOS 崩溃捕捉。`quincykit.net`\n- **Volant, Gilles**, zLib 和 Minizip。处理\
  \ ZIP 的标准。不要被“win”和“Dll”欺骗了。它是高度移植的。`www.winimage.com/zLibDll/minizip.html`\n\n\n\
  \n\n# 第 9 章：控制多任务\n\n在 iOS 中，“多任务”有两个广义的含义。首先，指的是允许一个或多个应用程序“在后台运行”，从而同时运行多个应用程序。其次，它指的是单个应用程序同时运行多个操作。两者都是许多\
  \ iOS 应用的重要部分，本章将讨论这两者。\n\n你将学习多任务的最佳实践，并发现用于多任务的主要 iOS 框架：运行循环（run loops）、线程（threads）、操作（operations）和\
  \ Grand 中央调度（GCD）。如果你熟悉其他平台的基于线程的多任务，你将学习如何减少对显式线程的依赖，并充分利用避免线程或自动处理线程的 iOS 框架。可能最重要的一点是，你将学习如何在不浪费系统资源的情况下，给用户一种多任务运行的错觉。\n\
  \n在本章中，我假设你已经理解了后台运行任务的基础知识，并熟悉 `beginBackgroundTaskWithExpirationHandler:`、注册应用程序的区域感知能力以及类似的后台处理问题。如果你需要有关基础技术的信息，请参阅《iOS\
  \ 应用程序编程指南》中的“在后台执行代码”（Executing Code in the Background）。\n\n同样，本章假设你至少对操作队列（operation\
  \ queues）和 Grand 中央调度（GCD）有基本的了解，尽管你可能从未在实际代码中使用过它们。如果你从未听说过它们，在继续之前，你应该浏览一下《并发编程指南》（Concurrency\
  \ Programming Guide）。\n\n本章的示例代码可以在 `SimpleGCD`、`SimpleOperation` 和 `SimpleThread`\
  \ 项目中找到。\n\n## 后台处理的最佳实践：能力越大，责任越大\n\n在 iPhoneOS 3 中，一次只能有一个第三方应用程序运行。当用户离开你的应用程序时，该程序会被终止。这确保了第三方后台应用程序不会浪费内存或电池等资源。Apple\
  \ 希望确保 iPhone 不会遭受早期移动平台（最典型的是 Windows Mobile）那样的性能和稳定性问题。\n\n从 iOS 4 开始，Apple 开始允许第三方应用程序在后台运行，但仅限于有限的方式。这延续了\
  \ Apple 对于不允许第三方应用程序破坏平台稳定性或浪费资源的关注。这可能会让人感到非常沮丧，但该政策通常达到了其目标。iOS 仍然关注用户，而不是开发者。\n\
  \n你的应用程序应该给用户它一直在运行的错觉，尽管事实并非如此。虽然你的应用程序在挂起时可能在没有任何警告的情况下被终止，但它在重新启动时应该给人一种什么都没有改变的感觉。这意味着你应该避免在加载期间显示启动屏幕，并且在进入后台时保存足够的状态，以便在被终止后无缝恢复。`NSUserDefaults`\
  \ 是在 `applicationWillResignActive:` 期间存放少量数据的好地方。较大的数据结构需要写入文件，通常存放在 `~/Library/Caches`\
  \ 中。\n\n在进入后台时，减少应用程序的内存占用很重要，但最小化恢复所需的时间也同样重要。如果丢弃缓存信息会导致从后台恢复的代价变得像重新启动一样昂贵，那么挂起就没有意义了。请深思考虑你要丢弃什么，以及重新创建它们需要多久。你所做的每一步都会消耗电池，因此要务必避免浪费性的处理，即使这不会明显延迟你的程序运行。\n\
  \n当你的应用程序被挂起时，它不会接收内存警告。如果它的内存占用很大，当出现内存压力时，你的应用程序可能会被终止，而没有机会进行任何处理。`NSCache` 和\
  \ `NSPurgeableData` 在解决这个问题上极具价值。`NSPurgeableData` 是一个 `NSData` 对象，你可以将其标记为“当前正在使用”或“当前可以清除”。如果你将其存储在\
  \ `NSCache` 对象中，并用 `endContentAccess` 将其标记为可清除，操作系统会保留它直到出现内存压力。到那时，系统会丢弃该数据，即使你的应用程序正处于挂起状态。这节省了每当用户短暂离开应用程序时丢弃并重新创建该对象的成本，同时确保了它在需要时可以被丢弃。\n\
  \n当应用程序进入后台时，许多框架数据会自动为你管理。通过 `imageNamed:` 加载的图像数据会自动丢弃，并在需要时再次从磁盘读取。视图会自动丢弃它们的底层存储（其位图缓存）。你应该预期在恢复时\
  \ `drawRect:` 方法会被调用。这个规则有一个主要的例外：`UIImageView` 不会丢弃它的数据，而这些数据可能非常大。如果你在 `UIImageView`\
  \ 中显示了一张大图片，通常你应该在进入后台之前将其移除。然而，解压缩图像可能代价很高，因此你不应该频繁丢弃它们。没有标准答案，你需要对你的应用程序进行性能分析。\n\
  \n在 Instruments 中，VM Tracker 有助于确定你在后台时使用了多少内存。它是 Allocations 模板的一部分。首先创建一个显示巨大图片的“内存压力”应用程序。然后使用\
  \ VM Tracker 运行你的程序。注意你使用的内存量。按下 Home 键，注意你现在的内存量。这就是你进入后台时释放的内存。现在启动内存压力程序。注意你释放了多少内存。理想情况下，你的后台使用量应该低于正常使用量，但不要低到延迟恢复。你在内存压力下的使用量应该越低越好。\n\
  \n在 Instruments 中，你会看到两种内存：脏内存（dirty memory）和驻内存（resident memory）。脏内存是你进入后台时 iOS\
  \ 无法自动回收的内存。驻内存是你当前的总内存使用率。两者由于不同的原因都非常重要。最小化脏内存可以减少你在后台被终止的概率。减少脏内存应该是你的主要关注点。当应用程序不是前台程序时，应该尽可能少消耗资源。`NSCache`\
  \ 和 `NSPurgeableData` 是减少脏内存的极佳工具。驻内存是整个内存占用。最小化它可以有助于防止在前台时出现低内存警告。\n\n在 Instruments\
  \ VM Tracker 中，你可能会看到对“Memory Tag 70”的引用。那是压缩图像的内存，主要由 `UIImage` 引起。\n\n内存很重要，但它不是唯一的资源。避免过度的网络活动、磁盘访问或任何会浪费电池寿命的操作。通常情况下，你应该使用\
  \ `beginBackgroundTaskWithExpirationHandler:` 完成任何用户发起的下载。用户不希望在数据下载时必须盯着你的应用程序看；他们想去玩游戏。然而，你应该中止或暂停任何并非用户请求的下载，前提是你稍后可以恢复它们。\n\
  \n在后台执行某些操作是禁止的。最显著的是 OpenGL 调用。当你进入后台时必须停止更新 OpenGL 视图。在 `applicationWillTerminate:`\
  \ 被调用后，应用程序允许运行一短时间。在此期间，应用程序处于“后台”状态，不能进行 OpenGL 调用。如果这样做，它会被立即杀死，这可能会阻止它完成其他的应用程序退出逻辑。\n\
  \n\n\n\n确保在应用程序终止以及进入后台时关闭你的 OpenGL 更新。`GLKViewController` 会自动为你处理所有这些操作，它是 Xcode\
  \ 中 OpenGL Game 模板所使用的控制器。\n\n在后台运行为开发者带来了新挑战，但用户又期待这一关键功能。只需确保将用户放在首要位置，进行大量的测试，并监控你的资源利用率。即使你的应用程序不在屏幕上，也应该让用户满意。\n\
  \n# 理解运行循环 (Run Loops)\n\n每个 iOS 程序都由一个 `do/while` 循环驱动，该循环阻塞等待事件，然后将该事件分发给感兴趣的监听器，并重复直到某些东西让它停止。处理此对象的\
  \ get 运行循环（`NSRunLoop`）。\n\n你几乎不需要理解运行循环的内部机制。有 mach 端口、消息端口、`CFRunLoopSourceRef`\
  \ 类型以及各种奥秘。这些在普通程序中（即使在非常复杂的程序中）也极其罕见。重要的是理解这一点：运行循环只是一个巨大的 `do/while` 循环，运行在单个线程上，从各种队列中提取事件，并在该线程上逐个分发给监听器。这是\
  \ iOS 程序的核心。\n\n当你的 `applicationWillResignActive:` 方法、`IBAction` 或程序的任何其他入口点被调用时，是因为某个地方触发了事件，并一直追溯到你实现的代理回调。系统正在等待你返回，以便它可以继续运行。当你的代码在主线程上运行时，滚动视图无法滚动，按钮无法高亮，定时器无法触发。整个\
  \ UI 都会挂起，等待你完成。在编写代码时请记住这一点。\n\n这并不意味着所有内容都位于主运行循环上。每个线程都有自己的运行循环。动画通常运行在后台线程上，`NSURLConnection`\
  \ 的大部分网络处理也是如此。但系统的核心运行在一个单一的、共享的运行循环。\n\n虽然每个线程都有运行循环，但这并不意味着每个线程都会自动处理自己的运行循环。运行循环只有在响应如\
  \ `runUntilDate:` 等命令时才会执行它们的 `do/while` 循环，正如在下文“多线程”章节中所讨论的那样。几乎每个项目 `main.m`\
  \ 中对 `UIApplicationMain` 的调用都会运行主运行循环。\n\n`NSTimer` 依赖运行循环来分发消息。当你调度一个 `NSTimer`\
  \ 时，它请求当前运行循环在特定时间分发一个选择器。运行循环每次迭代时，它都会检查当前时间并触发任何过期的定时器。像 `performSelector:withObject:afterDelay:`\
  \ 这样的延迟操作方法是通过调度定时器来实现的。\n\n在大多数情况下，这一切都在后台发生，你不需要担心运行循环。`UIApplicationMain` 为你设置了主线程的运行循环，并保持其一直运行直到程序终止。但其他线程呢？\n\
  \n# 多线程 (Threading)\n\n阻塞主线程会导致你的程序挂起，因此这是不可接受的。但某些操作运行需要长时间。当发生这种情况时，你可能需要开启新线程。这并没有看起来那么常见。你可以在不显式创建任何额外线程的情况下编写出相当复杂的程序。在大多数情况下，框架会为你创建并管理线程，且完全是透明的。但有时你需要显式地创建自己的工作线程。在这一节中，你将学习如何手动完成，在随后的章节中，你将学习处理线程的更好抽象。\n\
  \nCocoa 提供了一个名为 `NSThread` 的有用线程抽象。虽然操作队列（Operation Queues）和 Grand 中央调度（GCD）正在成为处理多线程的首选方式，但理解\
  \ `NSThread` 如何独立工作以及如何将其与运行循环集成非常有帮助的。在这个示例中，你创建一个在屏幕上更新简单计数器的应用程序。这可以通过 `NSTimer`\
  \ 轻松完成，但假定该操作在主线程上执行的开销太大了。此示例的源代码位于 `SimpleThread` 项目中。\n\n首先，创建一个名为 `CounterThread`\
  \ 的抽象 `NSThread` 类。这将简化各种技术的展示。\n\n### CounterThread.h (SimpleThread)\n\n```objectivec\n\
  @protocol CounterThreadDelegate <NSObject>\n@property (assign) NSUInteger count;\n\
  @end\n\n@interface CounterThread : NSThread\n@property (strong) id<CounterThreadDelegate>\
  \ delegate;\n@property (assign) BOOL shouldRun;\n- (CounterThread *)initWithDelegate:(id)delegate;\n\
  - (void)stop;\n// 用于子类的方法\n- (void)processThread;\n- (void)updateDelegate;\n@end\n\
  ```\n\n### CounterThread.m (SimpleThread)\n\n```objectivec\n@implementation CounterThread\n\
  @synthesize delegate=delegate_;\n@synthesize shouldRun=shouldRun_;\n- (CounterThread\
  \ *)initWithDelegate:(id)delegate {\n  if ((self = [super init])) {\n    self.delegate\
  \ = delegate;\n  }\n  return self;\n}\n- (void)stop {\n  self.shouldRun = NO;\n\
  }\n- (void)processThread {\n  NSAssert(NO, @”抽象方法. 必须重写”);\n}\n- (void)updateDelegate\
  \ {\n  // 无论想做什么有趣的工作。\n  // 此调用是在后台线程上进行的，所以确保\n  // 它是线程安全的\n  self.delegate.count\
  \ = self.delegate.count + 1;\n}\n- (void)main {\n  @autoreleasepool {\n    self.shouldRun\
  \ = YES;\n    while (self.shouldRun) {\n      @autoreleasepool {\n        [self\
  \ processThread];\n      }\n    }\n  }\n}\n@end\n```\n\n`main` 过程在线程启动时运行。当 `main`\
  \ 过程结束时，线程将终止。释放一个 `NSThread` 对象不会终止线程。`main` 过程必须完成并返回。可以对线程调用 `cancel`，但你应该避免这样做。这会让内存处于未知状态。\n\
  \n每个线程负责管理自己的自动释放池。第一个 `@autoreleasepool` 处理到达循环之前可能生成的任何自动释放对象。在这段代码中，没有这样的对象，因此实际上不需要这个额外的池，但像\
  \ `main.m` 为主线程做的那样，在顶部创建一个好习惯。对于 ARC（自动引用计数），如果不需要，编译器会将其优化掉。\n\n循环中的 `@autoreleasepool`\
  \ 是重要的。池直到你到达 `@autoreleasepool` 块的结尾才会被清空，因此如果循环内部没有块，自动释放的对象可能会保留到线程终止。\n\n`updateDelegate`\
  \ 方法执行你想做的任何有趣工作。然而，它必须是线程安全的。在示例中，代理的 `count` 访问器如下：\n\n### STViewController.m\
  \ (SimpleThread)\n\n```objectivec\n// 线程安全\n- (NSUInteger)count {\n  return count_;\n\
  }\n// 线程安全\n- (void)setCount:(NSUInteger)count {\n  @synchronized(self) {\n    count_\
  \ = count;\n    NSString *string = [NSString stringWithFormat:@%d”, count];\n  \
  \  [self.label performSelectorOnMainThread:@selector(setText:)\n               \
  \           withObject:string\n                        waitUntilDone:NO];\n  }\n\
  }\n```\n\n`@synchronized` 确保对 `setText:` 的调用按顺序进行，而不是为了确保读取和写入 ivar 是原子的。`count`\
  \ Getter 不需要 `@synchronized`，因为在任何时候读取标量都是是不安全的。因为 `setText:` 修改了 UIKit 对象，它必须在主线程上运行。这就是为什么你需要使用\
  \ `performSelectorOnMainThread:withObject:waitUntilDone:` 来调用它。\n\n`CounterThread`\
  \ 是一个抽象类。在后续示例中，具体的子类重写了 `processThread` 以演示不同的方法。`processThread` 有两个关键特性：\n\n\n\
  \n\n\n- 它需要阻塞一段时间。如果它立即返回，就会进行忙等（busy-waits）。这意味着它会非常快速地检查 `shouldRun`。这会给 CPU 带来巨大的负载，迅速消耗电量，并导致设备发热。\n\
  \n- 它需要定期返回。如果它无限阻塞，线程将无法频繁检查 `shouldRun`，且线程可能在需要时无法终止。这可能导致线程泄漏，导致你的进程线程数随时间推移而增加。系统中的数量是有限的，因此最终会导致你的程序崩溃。线程还使用内存和其他内核资源，因此它们需要在适当的时间终止。\n\
  \n只要你不是在快速地创建和销毁线程（你本就不应该这样做），通常情况下阻塞时间长一点比频繁检查 `shouldRun` 要好。适当的超时时间通常在 1 到 10\
  \ 秒之间。\n\n`CounterThread` 最简单的具体实现是 `SimpleCounterThread`：\n\n```objectivec\n@implementation\
  \ SimpleCounterThread\n\n- (void)processThread {\n  [NSThread sleepForTimeInterval:1];\n\
  \  [self updateDelegate];\n}\n```\n\n这只是睡眠 1 秒并更新代理。然后 `main` 检查 `shouldRun` 并在适当的情况下再次执行\
  \ `processThread`。这种线程对很多操作很有用，但它有一个问题。如果你在 `updateDelegate` 内部创建了一个 `NSTimer` 会怎样？它永远不会执行。这是因为这个线程没有处理它的运行循环（run\
  \ loop），而运行循环负责检查当前时间并分发任何过期的定时器。每个线程都有运行循环，但需要某些东西来处理它（有时被称为“泵入运行循环”）。`RunLoopThread`\
  \ 是 `CounterThread` 的子类，它通过调用 `runUntilDate:` 展示了如何这样做。\n\nRunLoopThread.m (SimpleThread)\n\
  \n```objectivec\n- (void)processThread {\n  if (! self.timer) {\n    self.timer\
  \ = [NSTimer\n                      scheduledTimerWithTimeInterval:1\n         \
  \             target:self\n                      selector:@selector(updateDelegate)\n\
  \                      userInfo:nil\n                      repeats:YES];\n  }\n\
  \  NSRunLoop *runLoop = [NSRunLoop currentRunLoop];\n  [runLoop runUntilDate:[NSDate\
  \ dateWithTimeIntervalSinceNow:1]];\n}\n```\n\n使用这种方法，线程的行为非常像主运行循环。对 `runUntilDate:`\
  \ 的调用阻塞不会超过 1 秒，允许 `processThread` 返回并让调用它的 `main` 函数检查线程是否应该终止。通过 `performSelector:onThread:withObject:waitUntilDone:`，你现在可以在此线程上运行任意方法。\n\
  \n我建议在大多数情况下不要使用 `performSelectorInBackground:withObject:`。该方法会自动为你生成一个线程，一旦线程创建后，你无法访问它。这很容易导致意外的线程泄漏。最常见的错误是在像\
  \ `viewDidLoad` 这样可能被多次调的方法中调用 `performSelectorInBackground:withObject:`。因为你没有持有线程对象的成员变量（ivar），所以你无法轻松判断是否已经有一个线程在为该操作运行。\n\
  \n你应该创建一个线程对象并将其赋值给一个属性以跟踪它。在该属性的设置器（setter）中，检查是否已经分配了线程。如果是，要么是一个编程错误（你应该使用 `NSAssert`），要么是可以接受的（此时你应该在创建新线程之前终止旧线程）。如果你只是调用\
  \ `performSelectorInBackground:...`，你可能会迅速产生足够的线程，导致程序崩溃，甚至导致设备一段时间内无响应。\n\n对于简单的线程需求，`NSThread`\
  \ 是一个很好的选择。它便于创建生产者-消费者队列，特别是当配合 `@synchronize` 使用时。它特别适用于需要少量长寿线程的架构。对于更复杂的问题，iOS\
  \ 提供了更强大的工具，如操作（operations）和调度队列（dispatch queues），将在后续节中讨论。\n\n## 开发以操作为中心的多任务处理\n\
  \n由于现代应用有许多预期，Apple 开始鼓励开发者转向更以操作为中心而非以线程为中心的多任务架构。操作（operation）是一个封装的工作单元，通常以 Objective-C\
  \ block 的形式表示。Block 在第 16 章中有更完整的介绍。\n\n在这个示例中，你创建了之前相同的定时器程序，但使用的是 `NSOperation`。为了简化创建，你使用了\
  \ `NSBlockOperation`。同样，实际工作是微不足道的（睡眠秒并更新计数器），但相同的方法也适用于更耗时的操作。\n\nViewController.m\
  \ (SimpleOperation)\n\n```objectivec\n- (void)addOperation {\n  __block typeof(self)\
  \ myself = self;\n  NSBlockOperation *op = [NSBlockOperation operationWithBlock:^{\n\
  \    [NSThread sleepForTimeInterval:1];\n    myself.count += 1;\n  }];\n\n  op.completionBlock\
  \ = ^{\n    [self addOperation];\n  };\n\n  self.queue.suspended = NO;\n  [self.queue\
  \ addOperation:op];\n}\n\n- (void)viewDidLoad {\n  [super];\n  self.queue = [[NSOperationQueue\
  \ alloc] init];\n  self.count = 0;\n  [self addOperation];\n}\n\n- (void)setCount:(NSUInteger)count\
  \ {\n  count_ = count;\n  __block typeof(self) myself = self;\n  [[NSOperationQueue\
  \ mainQueue] addOperationWithBlock:^{\n    myself.label.text = [NSString stringWithFormat:@%d\"\
  , count];\n  }];\n}\n\n- (NSUInteger)count {\n  return count_;\n}\n\n- (void)viewDidUnload\
  \ {\n  self.queue.suspended = YES;\n  self.queue = nil;\n  [self setLabel:nil];\n\
  \  [super viewUnload];\n}\n```\n\n在 `addOperation` 和 `setCount:` 中，你创建了一个名为 `myself`\
  \ 的奇怪变量。如果你在 block 内部引用对象，block 会自动保留该对象。如果你引用 `self`，就会创建一个保留循环，因为 `self` 持留 `queue`，而\
  \ `queue` 又保留了该 block。这是一个非常常见的保留循环，以至于如果你这样做，编译器会给你警告。额外的变量 `myself` 打破了这个循环，因为它被标记为\
  \ `__block` 作用域，这意味着它与 block 共享，但不会被其保留。`typeof` 简写只是让你在需要时更容易粘贴这行额外的代码。\n\n在 `addOperation`\
  \ 中，你使用完成块（completion block）来调度另一个操作。完成块对于处理各种清理工作非常有用。这有些刻意，因为你通常会一次性调度所有操作，但这是为操作添加延迟的一种有用方法。\n\
  \n注意，`count` 访问器同样需要线程安全，因为操作可能会从任何线程访问它们。此示例没有使用 `performSelectorOnMainThread:`，而是使用了\
  \ `mainQueue`，它是一个在主线程运行的 `NSOperationQueue`。\n\n与下一节将讨论的 Grand Central Dispatch\
  \ 相比，操作具有一些开销。通常你不应该产生大量极微小的操作。例如，你不应该为位图中的每个像素生成一个独立的操作。相反，你应该为每一行创建一个操作，或者每几行。目前的\
  \ iOS 设备没有许多核心，因此它们可以执行的并行工作是有限的。操作在 iOS 上与 GCD 队列的集成也不像在 OS X 上那样充分。然而，这种情况可能会改善，你应该预期\
  \ `NSOperation` 将成为 Cocoa 首选的多任务处理 API。\n\n 使用 Grand Central Dispatch 进行多任务处理\n\n\
  Grand Central Dispatch 是 iOS 多任务处理的核心。它贯穿系统层几乎用于一切。从 iOS 5 开始，GCD 增加了强大的 I/O 处理程序，使其变得更加强大。\n\
  \n\n\n\nGCD 的大部分内容与 `NSOperation` 非常相似。在这个示例中，你实现了一个与之前章节中相同的定时器。注意 GCD 的调用几乎与 `NSOperation`\
  \ 的调用完全匹配。变动部分已**加粗**显示。\n\n`ViewController.m (SimpleGCD)`\n\n```objc\n- (void)addNextOperation\
  \ {\n  __block typeof(self) myself = self;\n  double delayInSeconds = 1.0;\n  dispatch_time_t\
  \ popTime = dispatch_time(DISPATCH_TIME_NOW, delayInSeconds * NSEC_PER_SEC);\n \
  \ dispatch_after(popTime, self.queue, ^(void){\n    myself.count = myself.count\
  \ + 1;\n    [self addNextOperation];\n  });\n}\n\n- (void)viewDidLoad {\n  [super\
  \ viewDidLoad];\n  self.queue = dispatch_queue_create(\"net.robnapier.SimpleGCD.VC\"\
  , DISPATCH_QUEUE_CONCURRENT);\n  self.count = 0;\n  [self addNextOperation];\n}\n\
  \n- (void)viewDidUnload {\n  dispatch_suspend(self.queue);\n  dispatch_release(self.queue);\n\
  \  self.queue = nil;\n  [self setLabel:nil];\n  [super viewDidUnload];\n}\n\n...\n\
  \n- (void)setCount:(NSUInteger)count {\n  count_ = count;\n  __block typeof(self)\
  \ myself = self;\n  dispatch_async(dispatch_get_main_queue(), ^{\n    myself.label.text\
  \ = [NSString stringWithFormat:@\"%d\", count];\n  });\n}\n```\n\n与 `NSOperation`\
  \ 的一个微小区别是 GCD 提供了 `dispatch_after`，允许你调度下一个操作而不是进行睡眠。时间单位是纳秒，这可能会导致一些困惑，因为 iOS\
  \ 中的几乎每个时间间隔都是秒为单位。幸运的是，当你输入 `dispatch_after` 并按回车时，Xcode 会自动提供转换代码段。使用纳秒是为了针对硬件优化，而不是为了程序员。以秒传递时间将需要浮点运算，这不仅开销更大且精度较低。GCD\
  \ 是一个非常底层的框架，不会在程序员的便利性上浪费太多周期。\n\n### 使用 Dispatch Barriers 创建同步点\n\nGCD 提供了一套丰富的串行和并发队列系统。通过一些思考，你可以利用这些队列创建除简单的线程管理之外的许多功能。例如，GCD\
  \ 队列可以以极小的开销解决许多常见的锁问题。\n\ndispatch barrier（调度屏障）在并发队列中创建一个同步点。在它运行时，队列上的其他块都不允许运行，即使有其他核心可用。如果这听起来像是一个排斥（写）锁，那么它确实是。非屏障（Nonbarrier）块可以被视为共享（读）锁。只要对资源的所有访问都是通过队列执行，就能提供非常廉价的同步。\n\
  \n作为对比，你可以使用 `@synchronize` 管理多线程访问，它会对其参数获取排斥锁，如下面的代码所示。\n\n```objc\n- (id)objectAtIndex:(NSUInteger)index\
  \ {\n  @synchronized(self) {\n    return [self.array objectAtIndex:index];\n  }\n\
  }\n\n- (void)insertObject:(id)obj atIndex:(NSUInteger)index {\n  @synchronized(self)\
  \ {\n    [self.array insertObject:obj atIndex:index];\n  }\n}\n```\n\n这种方法使用起来简单，即使在竞争很少的情况下开销也非常昂贵。还有许多其他方法，它们要么复杂且快速，要么简单但运行缓慢。GCD\
  \ 屏障提供了一个很好的折中方案。\n\n```objc\n- (id)objectAtIndex:(NSUInteger)index {\n  __block\
  \ id obj;\n  dispatch_sync(self.concurrentQueue, ^{\n    obj = [self.array objectAtIndex:index];\n\
  \  });\n  return obj;\n}\n\n- (void)insertObject:(id)obj atIndex:(NSUInteger)index\
  \ {\n  dispatch_barrier_async(self.concurrentQueue, ^{\n    [self.array insertObject:obj\
  \ atIndex:index];\n  });\n}\n```\n\n所有需要的 own `concurrentQueue` 属性，通过调用带有 `DISPATCH_QUEUE_CONCURRENT`\
  \ 选项的 `dispatch_queue_create` 来创建。在读者（`objectAtIndex:`）中，你使用 `dispatch_sync` 等待它完成。在\
  \ GCD 中创建和调度块的开销非常小，因此这比使用互斥锁（mutex）快得多。队列可以根据可用核心的数量并行处理大量的读取。在写入者中，你使用 `dispatch_barrier_async`\
  \ 来确保写入时对队列的排斥访问。通过使调用异步，写入者可以快速返回，但同一线程上未来的任何读取都保证将返回写入者设置的值。GCD 队列是 FIFO（先入先）的，因此写入之前在队列上的任何请求都会先完成，写入独立运行，然后是在写入之后放在队列上的请求才会被处理。这防止了写入者饥饿，并确保在写入后立即读取始终能得到正确的结果。\n\
  \n## 队列目标与优先级\n\nGCD 中的队列是分层级的。只有全局系统队列实际上会被调度运行。你可以通过 `dispatch_get_global_queue`\
  \ 和优先级常量 `DISPATCH_QUEUE_PRIORITY_HIGH`、`..._DEFAULT`、`..._LOW` 或 `..._BACKGROUND`\
  \ 来访问这些队列。`BACKGROUND` 队列是在 iOS 5 中引入的，优先级最低。所有这些队列都是并发的。GCD 会根据可用线程的数量从 `HIGH`\
  \ 队列调度尽可能多的块。当 `HIGH` 队列为空时，它会移动到 `DEFAULT` 队列，依此类推。系统根据需要创建和销毁线程。\n\n队列在 GCD 中是分级的。只有全局系统队列实际上会被调度运行。你可以通过\
  \ `dispatch_get_global_queue` 和优先级常量 `DISPATCH_QUEUE_PRIORITY_HIGH`、`..._DEFAULT`、`..._LOW`\
  \ 或 `..._BACKGROUND` 来访问这些队列。`BACKGROUND` 队列是在 iOS 5 中引入的，优先级最低。所有这些队列都是并发的。GCD\
  \ 会根据可用线程的数量从 `HIGH` 队列调度尽可能多的块。当 `HIGH` 队列为空时，它会移动到 `DEFAULT` 队列，依此类推。系统根据需要创建和销毁线程。\n\
  \n当你创建自己的队列时，它附加到这些全局队列之一（目标）。默认情况下，它附加到 `DEFAULT` 队列。当块到达目标队列的前端时，它会被移动到目标队列的末尾执行。你可以使用\
  \ `dispatch_set_target_queue` 更改目标队列。一旦块被添加到队列，它将按照添加顺序执行。没有方法取消它，也没有方法改变它与其他块的顺序。但如果你想让一个高优先级块“跳到头部”呢？如下所示，创建两个队列，一个高优先级队列和一个低优先级队列，并将高优先级队列设置为低优先级队列的目标。\n\
  \n```objc\ndispatch_queue_t low\nlow = dispatch_queue_create(\"low\", DISPATCH_QUEUE_SERIAL);\n\
  dispatch_queue_t high\nhigh = dispatch_queue_create(\"high\", DISPATCH_QUEUE_SERIAL);\n\
  dispatch_set_target_queue(low, high);\n```\n\n调度到低优先级队列是正常的：\n\n```objc\ndispatch_async(low,\
  \ { /* 低优先级块 */ });\n```\n\n要调度到高优先级队列，挂起低队列并在高优先级块完成后恢复：\n\n```objc\ndispatch_suspend(low);\n\
  dispatch_async(high, ^{\n  /* 高优先级块 */\n  dispatch_resume(low);\n});\n```\n\n挂起队列会阻止调度最初放在该队列上的任何块，以及任何指向它的队列。它不会停止正在执行的块，但即使低优先级块是\
  \ CPU 的下一个，在调用 `dispatch_resume` 之前它也不会被调度。\n\n你需要平衡 `dispatch_suspend` 和 `dispatch_resume`，就像\
  \ `retain` 和 `release` 一样。如果队列被多次挂起，则需要等次数的恢复。\n\n### iOS 5 新特性\n\niOS 5 增加了一些对高性能操作特别有\
  \ GCD 特性。这些功能主要适用于操作系统本身，通常你应该依赖操作系统为你处理这些事务。本章将不会深入探讨这些，但知道它们的存在是有用的。你应该预期这些技术在未来的\
  \ iOS 版本中变得更加核心。\n\n### 队列特定数据\n\n\n\n\n与第 3 章讨论的关联引用（associative references）类似，队列特定数据（queue-specific\
  \ data）允许你将数据直接附加到队列上。这有时是进出队列传递信息的一种有用且极快的方法。这与下一节讨论的分发数据（dispatch data）相结合，可以实现极高性能的数据传递，减少内存拷贝和分配/释放的抖动。\n\
  \n与关联引用类似，队列特定数据使用唯一地址作为键，而不是字符串或其他标识符。这通常通过传递 `static char` 的地址来实现。与关联引用不同，队列特定数据不知道如何保留和释放。你必须传递一个析构函数，它它会在值被替换时调用该函数。对于你使用\
  \ `malloc` 分配的内存，该函数是 `free`。对于开启 ARC 的 Objective-C 对象这很困难，但此处所示，Core Foundation\
  \ 对象要容易一些。在这个示例中，当队列销毁或为 `kMyKey` 设置了另一个值时，`value` 会自动释放。\n\n```objc\nstatic char\
  \ kMyKey;\nCFStringRef *value = CFStringCreate...;\ndispatch_queue_set_specific(queue,\n\
  \                            &kMyKey,\n                            (void*)value,\n\
  \                            (dispatch_function_t)CFRelease);\n...\ndispatch_sync(queue,\
  \ ^{\n  CFStringRef *string = dispatch_get_specific(&kMyKey);\n  ...\n});\n```\n\
  \n队列特定数据的一个优点是它们尊重队列层次结构。因此，如果当前队列没有分配给定的键，`dispatch_queue_get_specific` 会自动检查目标队列，然后是该队列的目标队列，一直向上检查。\n\
  \n## 分发数据 (Dispatch Data)\n\n分发数据是 iOS 5 中最强大的底层性能改进的基础，你可能永远不需要直接使用它。分发数据是非连续的不可变内存缓冲区块，可以以极小的拷贝代价在块之间快速合并和拆分。缓冲区也可以处理时增量地释放，从而改进内存使用。\n\
  \n这是一个极其健壮的系统，也是“dispatch I/O”功能的基础，该功能承诺在多核 iOS 设备（特别是 Mac）上显著提高 I/O 性能。然而，在大多数情况下，通过使用更高层级的抽象，你可以免费获得大部分收益，而无需承担直接使用\
  \ dispatch I/O 的复杂性。我的建议是在这项技术完全成熟以及 Apple 确定最佳使用模式之前先不要管它。如果你的应用程序需要非常快速地处理大量数据，并且你发现内存分配或磁盘访问是你的主要瓶颈，那么你可能现在就开始关注它。这类问题在操作系统中非常常见，但在应用层较少见。参见“进一步阅读”部分获取更多信息的链接。\n\
  \n### 总结\n\niOS 开发的未来是多任务。App 需要并行执行更多操作以利用多核硬件并为用户提供最佳体验。传统的线程技术仍然有用，但操作队列（operation\
  \ queues）和 Grand 中央调度（Grand Central Dispatch）更有效，并承诺通过更少的竞争和锁带来更高的性能。学习管理内部多任务，并在与其他应用程序进行多任务处理时表现得当，是今天\
  \ iOS 开发的基础。\n\n## 进一步阅读\n\n### Apple 文档\n\n以下文档可以在 [`developer.apple.com`](http://developer.apple.com/)\
  \ 上的 iOS Developer Library 或通过 Xcode 文档和 API 参考获取。\n\n*   《iOS Application Programming\
  \ Guide，“Executing Code in the Background（在后台执行代码）”\n*   《File System Programming\
  \ Guide，“Techniques for Reading and Writing Files（读写文件技术）。”其中“Processing a File\
  \ Using GCD（使用 GCD 处理文件）”章节包含了解释 dispatch I/O 通道的示例代码。\n*   《Threading Programming\
  \ Guide》\n\n### WWDC 会话\n\n以下会话视频可以在 `developer.apple.com` 获取。\n\n*   WWDC 2011，“Session\
  \ 320: Adopting Multitasking in Your App（在你的 App 中采用多任务处理）”\n*   WWDC 2011，“Session\
  \ 210: Mastering Grand Central Dispatch（精通 Grand 中央调度）”\n\n### 其他资源\n\nAsh, Mike.\
  \ NSBlog. Mike Ash 是底层线程问题领域最多产的作家之一。虽然其中部分内容已经过时，但他的许多博客文章仍然是必读的。[`http://mikeash.com/pyblog/`](http://mikeash.com/pyblog/)\n\
  \n*   ■ Friday Q&A 2010-01-01: NSRunLoop Internals\n*   ■ Friday Q&A 2009-07-10:\
  \ Type Specifiers in C, Part 3（C 语言中的类型说明符，部分 3）\n*   ■ Friday Q&A 2010-07-02: Background\
  \ Timers（后台定时器）\n*   ■ Friday Q&A 2010-12-03: Accessors, Memory Management, and\
  \ Thread Safety（访问器、内存管理和线程安全）\n\n\n\n\niOS 开发者应该了解的 RESTful 服务器的三个重要特性是：无状态性、统一资源标识和可缓存性。\n\
  \nRESTful 服务器始终是无状态的。这意味着每个 API 都被视为一个新请求，服务器不会记录任何客户端上下文。客户端会维护服务器的状态，这包括但不限于缓存响应和登录访问令牌（access\
  \ tokens）。\n\nRESTful 服务器上的资源识别是通过 URL 完成的。例如，REST 服务器不再接受资源 ID 作为参数，而是将其接受为 URL\
  \ 的一部分。例如，将 `http://example.com/resource?id=1234` 变为 `http://example.com/resources/1234`。\n\
  \n这种资源识别方法，结合 RESTful 服务器不维护客户端状态的这一事实，允许客户端根据 URL 缓存响应，就像浏览器缓存网页一样。\n\nRESTful\
  \ 服务器的响应通常以统一的、约定的格式发送，通常是为了解耦客户端/服务器接口。iOS 客户端通过这种约定的数据交换格式与 RESTful 服务器进行通信。截至目前，最常用的格式是\
  \ XML 和 JSON。下一节将讨论这些格式之间的区别，以及你在 App 中解析它们的方法。\n\n## 选择你的数据交换格式\n\nWeb 服务传统上支持两种主要的数据交换格式：JSON（JavaScript\
  \ 对象表示）和 XML（可扩展标记语言）。微软开创了 XML 作为其 SOAP 服务的默认数据交换格式，而 JSON 变成了由 `RFC 4627` 描述的开放标准。虽然关于哪种更优存在争论，但作为一名\
  \ iOS 开发者，你应该能够在你的 App 中处理这两种数据格式。\n\n对于 Objective-C，XML 和 JSON 都有多种解析器可用。接下来的几节将讨论一些最常用的工具包。\n\
  \n### 在 iOS 上解析 XML\n\nXML 解析可以使用两种解析器完成：DOM 解析器或 SAX 解析器。SAX 解析器是一种顺序解析器，它在步进 XML\
  \ 文档时通过回调返回解析后的数据。大多数 SAX 解析器通过接收 URL 作为参数来工作，并在数据可用时提供给你数据。例如，基础类 `NSXMLParser`\
  \ 有一个名为 `initWithContentsOfURL:` 的方法。\n\n```\n(id)initWithContentsOfURL:(NSURL *)url;\n\
  ```\n\n你本质上是用 URL 初始化解析器对象，然后由 `NSXMLParser` 完成其余工作。解析后的数据将通过 `NSXMLParserDelegate`\
  \ 中定义的代理方法通过回调可用。最常用的处理方法有：\n\n- `parserDidStartDocument:`\n- `parserDidEndDocument:`\n\
  - `parser:didStartElement:namespaceURI:`\n- `qualifiedName:attributes:`\n- `parser:didEndElement:namespaceURI:qualifiedName:`\n\
  - `parser:foundCharacters:`\n\n由于解析器使用委托模式返回数据，因此为你处理的每一个对象都需要 `NSXMLParser` 的子类。与\
  \ DOM 解析器相比，这往往会让你的代码库变得冗长。\n\n另一方面，DOM 解析器在开始解析之前加载完整的 XML。使用 DOM 解析器的优势在于可以使用\
  \ XPath 查询随机访问数据，并且没有像 SAX 模型中那样的委托机制。`NSXMLDocument` 中最常用的方法是：\n\n```\n(id)initWithContentsOfURL:(NSURL\
  \ *)url options:(NSUInteger)mask error:(NSError **)error\ninitWithData:options:error:\n\
  initWithXMLString:options:error:\n```\n\n一旦你初始化了 `NSXMLDocument`，就可以使用 `NSXMLNode`\
  \ 和 `NSXMLElement` 方法访问内容，例如：\n\n```\nnodesForXPath:error:\n```\n\n使用 DOM 解析器使你的代码更简洁、易读。虽然这是以牺牲处理\
  \ Web 服务请求的时间为代价的，但影响是微小的，因为 DOM 解析器只有在文档大于 1 兆字节时才会变慢。Web 服务响应通常小于这个大小。与网络操作的时间相比，你获得的任何性能提升都可以忽略不计。当你从资源包中解析\
  \ XML 时，这些性能提升就非常有意义。\n\n要了解更多关于 XML 性能的信息，请下载并测试 Apple 发布的 XML Performance App（参见本文末尾的“延伸阅读”部分）。\n\
  \n### 在 iOS 上解析 JSON\n\n第二种数据交换格式是 JSON，它比 XML 使用频繁得多。虽然 Apple 有 own JSON 处理框架，但在\
  \ iOS 4 和 Snow Leopard 中它是私有 API，不可供通用使用。然而，还有许多其他方案可供选择。目前为止最常用的框架是 SBJson、TouchJSON、YAJL\
  \ 和 JSONKit。（参见“延伸阅读”部分获取下载这些框架的链接。）几乎所有的框架都为 `NSString`、`NSArray` 和 `NSDictionary`\
  \ 提供了分类扩展（category extensions），用于与 JSON 之间转换。本章中的代码示例使用了 JSONKit。从 iOS 5 开始，Apple\
  \ 引入了 `NSJSONSerialization`，如果你的 App 只支持 iOS 5，可以使用它进行解析。你将在本章稍后部分学习 `NSJSONSerialization`。\n\
  \nJSONKit 为 `NSString`、`NSArray` 和 `NSDictionary` 提供了方便的分类扩展。要将来自 Web 服务的 JSON 响应转换为基础类对象（`NSArray`\
  \ 或 `NSDictionary`），请像示例代码片段所示使用 `NSString` 的扩展方法。\n\n```\nNSMutableDictionary *responseDict\
  \ = [responseString mutableObjectFromJSONString];\n```\n\n同样，将 Foundation 对象转换为\
  \ JSON 字符串也很简单。以下代码解释了如何将 Foundation 对象（本例为 `NSDictionary`）序列化为 JSON 字符串，以便作为 post\
  \ 数据发送到服务器。\n\n```\nNSMutableDictionary *postDict = [NSMutableDictionary dictionary];\n\
  [postDict setObject:@”theAccessToken” forKey:@”access_token”];\n[postDict setObject:@”abcde2345”\
  \ forKey:@”emp_id”];\n// …填充其他参数\nNSString *jsonString = [postDict JSONString];\n\
  ```\n\nJSONKit 中定义的分类方法 `mutableObjectFromJSONString` 和 `JSONString` 在 iOS 上处理 JSON\
  \ 时非常有用。在大多数情况下，这些是你唯一需要的两个方法。注意，其他框架（即 SBJson、TouchJSON 和 YAJL）也有等效实现。简而言之，无论你使用哪种库，JSON\
  \ 处理几乎总是比 XML 简单。\n\n### NSJSONSerializer\n\n在 iOS 5 中，Apple 引入了自己的 JSON 解析和序列化框架，称为\
  \ `NSJSONSerialization`。Apple 的类比其他框架更快，但只有当你愿意只支持 iOS 5 时才应该使用该框架。`NSJSONSerialization`\
  \ 还缺乏序列化自定义对象的能力，而 JSONKit 可以做到。JSONKit 有几个方便的方法可以完成这一点：`serializeUnsupportedClassesUsingDelegate:selector:error:`\
  \ 和 `serializeUnsupportedClassesUsingBlock:error:`。\n\n如果你的 JSON 解析需要处理不支持的类，将无法使用\
  \ `NSJSONSerialization`。\n\n当你为 App 选择库时，可能需要进行一些性能评估。（你可以使用 Github 上的开源测试项目 json-benchmarks\
  \ 来比较框架。参见“延伸阅读”部分获取该工具的链接。）由于所有五个框架（SBJson、TouchJSON、YAJL、JSONKit 和 NSJSONSerialization）都在活跃开发，每个库都很好，到目前为止没有最好的库。密切关注它们，并在某个库看起来优于另一个时准备好更换框架。通常，更换\
  \ JSON 库不需要巨大的重构，因为在大多数情况下，它涉及更改类的分类扩展方法。\n\n## XML 与 JSON\n\n\n\n\n\n本章中的源代码片段是基于\
  \ JSON 的。你将学习如何设计类，以便在不影响代码库其他部分的情况下轻松添加 XML 支持。在任何情况下，iOS 上的 JSON 处理都比 XML 容易一个级。因此，如果你的服务器同时支持\
  \ XML 和 JSON 格式，选择 JSON 是一个明智的决定。如果你的服务器代码尚未开发，请先从支持 JSON 开始。\n\n## 设计数据交换格式\n\n\
  务必记住，我们讨论的是客户端和服务器之间的数据交换。iOS 开发者犯的最常见错误是将 JSON 认为是服务器为了响应 API 调用而发送的某些任意数据。虽然这在某种程度上是正确的，但快速查看服务器端发生了什么，将让你更清楚地了解\
  \ JSON 的真实面目。\n\n在内部，每个服务器都是使用某种面向对象的编程语言编写的。无论是 `Java`、`Scala`、`Ruby` 还是 `C#`（即使\
  \ `PHP` 和 `Python` 在某种程度上支持对象），你在 iOS App 上需要的任何数据在服务器上可能也是一个对象。该对象是 `ORM`（对象关系映射）映射的实体还是业务对象并不重要。让我们称它们为\
  \ `model objects`（模型对象），这些对象仅在传输层被序列化为 JSON。大多数面向对象的语言都提供了序列化对象的接口，开发者通常利用这些接口将对象转换为\
  \ JSON。这意味着你在响应中看到的 JSON 只是服务器上对象（或对象列表）的不同表示形式。\n\n在编写代码时记住这个概念，你可能会为每个对应的服务器模型对象创建一个模型对象。当你这样做时，就不必担心更改以后会影响你的代码。重构将变得简单得多。\n\
  \n与其从 JSON 字符串的角度考虑，不如从对象的角度考虑更有意义。设计并开发你的代码，使其始终能为服务器上的每个对象重建模型对象。当 iOS App 上重构的对象与服务器上的对象\
  \ 100% 匹配时，数据交换的目标就实现了，你的 App 将没有任何错误。\n\n简而言之，将 JSON 视为数据交换格式，而不是带有大量语法的语言。考虑以对象为基础来记录数据交换契约，而不是原始数据类型。这些对象反过来成为你\
  \ App 的模型对象。你将在本章稍后部分详细看到这些内容，并了解如何使用 Objective-C 的键值编码/观测（`KVC/KVO`）机制将 JSON 字典转换为模型。\n\
  \n## 模型版本控制\n\n在过去，至少从 1990 年代后期或 2000 年初到 2007 年第一款 iPhone 发布期间，大多数客户端/服务器开发都是与\
  \ Web 界面同步进行的。原生客户端并不常用。运行在 Web 浏览器上的客户端 App 总是与服务器一起部署。因此，实际上没有必要在模型中处理版本控制。然而，在\
  \ iOS 上，部署客户端需要将 App 物理安装在用户的设备上。这可能花费几天或几个月，因此你还应该处理使用旧客户端访问服务器的情况。你想支持多少个旧版本的客户端取决于你的业务目标。作为\
  \ iOS 开发者，你可能应该构建支持以满足这些业务需求。在你的 iOS App 中使用类簇（class clusters）是实现这一点的方法之一。你很快会了解到更多信息。\n\
  \n### 一个假设的 Web 服务\n\n从这里开始，随着我们在每一章中深入探讨，我们将描述一个假设的 App 概念并为其开发 iOS 代码。作为 iOS 开发者，你可能的大部分项目是与任意\
  \ Web 服务通信的，而不是像 `Twitter`、`Facebook` 或 `Flickr` 这样已知公开的服务。其次，几乎每个此类热门服务都有 iOS 的开源实现。\n\
  \n假设你正负责为餐厅开发一个 iPhone App。该餐厅使用 iPad 点餐。订单可以直接向服务员下单，服务员将订单输入他们的 iPad 中。客户也可以直接使用桌上的自助机（运行你\
  \ App 的专用 iPad）进行下单。以下是该 App 顶层功能的简要描述：\n\n1. 订单根据客户的桌号发送到远程服务器，而服务员在通过自己的登录账户发送每个订单时都会带上桌号。因此，显然有两种登录/验证机制。一种是传统的基于用户名/密码的类型，另一种是基于客户桌号的。在所有情况下，服务器都会为给定的身份信息交换访问令牌。重要点是，你应该开发一个能够适应这两种登录的代码库。登录后，每个\
  \ Web 服务都要求你在后续每次调用中发送访问令牌。\n   - 这一要求对应 `/loginwaiter` 和 `/logintable` Web 服务端。\n\
  \   - 这两个端都会返回一个访问令牌。在 iOS 客户端实现中，你将学习如何“记住”这个访问令牌 并在每次请求时发送它。\n\n2. 客户应该看到菜单，以及每个菜单项的详情，包括食物的照片/视频以及其他客户留下的评分。\n\
  \   - 这一要求对应 Web 服务端 `/menuitems` 和 `/menuitem/<itemid>`，后者返回一个将被建模为 `MenuItem`\
  \ 对象的 JSON 对象。\n   - 在 iOS 实现中，你将学习如何利用 Objective-C 最强大的技术——键值编码（`KVC`），用尽可能少的代码将\
  \ JSON 键映射到你的模型对象。\n\n3. 客户应该能够提交对物品的评论。\n   - 这一要求对应 Web 服务端 `/menuitem/<itemid>/review`。\n\
  \   - 在这些情况下，某些 iOS App 会显示浮动头部显示（通常称为 HUD），防止用户在评论发布之前进行任何操作。这从用户体验角度来看显然是糟糕的。你将看到如何在后台发布评论而不显示模态\
  \ HUD。\n\n虽然该 App 还有其他需求，但这三点涵盖了与 Web 服务通信时最常见的模式。\n\n## 重要提示\n\n在构建你的 App 时，请务必记住这些核心要点：\n\
  \n- 永远不要进行同步网络调用——即使它们在后台线程上执行，同步调用也不会报告进度。另一个原因是，为了取消运行在后台线程上的同步请求，你必须杀死线程，这又不是一个好主意。此外，你将无法控制\
  \ App 中网络调用的次数。这对你 App 的性能至关重要。你将在本章稍后部分了解到。\n- 避免直接使用基于 runloop 的线程进行网络操作（除非你的项目很小且只有几个\
  \ API 调用）——运行自己的线程会有一些副作用，如上所述。\n- 使用 `NSOperationQueue` 或基于 GCD 的线程——`NSOperationQueue`\
  \ 有助于控制队列长度和并发网络操作的数量。在本章稍后部分，你将学习使用 `NSOperationQueue` 的优势。\n\n让我们开始设计 iOS App\
  \ 的 Web 服务架构。\n\n## RESTEngine 架构 (iHotelApp 示例代码)\n\niOS App 传统使用模型-视图-控制器（`MVC`）作为主要的设计模式。当你在\
  \ App 中开发 REST 客户端时，你应该将 REST 调用隔离在它们自己的类中。REST 的无状态性质和可缓存特性在编写在类类时能得到最好的应用。此外，它还提供了一层隔离（这对单元测试也有好处），并有助于保持控制器代码的整洁。现在，让我们开始选择网络管理框架。\n\
  \n\n\n\n\n# NSURLConnection 与第三方框架\n\nApple 在 `CFNetwork.framework` 中提供了如 `NSURLConnection`\
  \ 等类，用于发送异步请求。然而，在开发 RESTful 服务时，你需要通过子类化来定制这些类。与其在 Web 服务开发中重复发明已有的功能，我建议使用 `ASIHTTPRequest`（请参见本章末尾“扩展阅读”部分关于\
  \ Copsey, ASIHTTPRequest Documentation 2011 的条目）。`ASIHTTPRequest` 封装了了许多常用功能，如基础认证或摘要认证、表单\
  \ POST、以及文件的上传或下载。它提供的另一个重要功能是 `NSOperationQueue` 封装，你可以用它对网络请求进行队列。\n\n我的建议通常是，在开发\
  \ iOS 时尽量避免使用第三方代码。但是，有些组件和框架是值得使用的。我的建议是避免使用高度相互依赖的第三方代码。`ASIHTTPRequest` 是一个很好的封装器，它在不会让你的代码库膨肿的同时，提供了非常强大的功能。你可以只将框架中必要的类添加到你的\
  \ App 中（与其他库不同，后者你必须将 App 链接到整个库）。在我们的情况下，开发 Web 服务时，与其重复发明已有的功能，我建议使用 `ASIHTTPRequest`。`ASIHTTPRequest`\
  \ 封装了许多常用功能，如基础认证或摘要认证、表单 POST 的消息格式以及文件的上传或下载。更重要的是，它提供了一个 `NSOperationQueue` 封装，你可以用它来队列网络请求并控制并发操作的数量。\n\
  \n本章下载文件中提供的代码示例使用了 `ASIHTTPRequest`。你可以在书籍网站的第 10 文件夹（`iHotelApp`）中找到这些代码。\n\n\
  注意，本章的代码下载非常庞大。本章提供了重要的代码片段，你应该查看对应的文件。在 Xcode 中打开项目以更好地理解代码和架构。\n\n`RESTEngine`\
  \ 通过读取示例 JSON 文件来模拟 API API 调用，因为 API 尚未建立。这不会影响代码的架构。\n\n## 创建 RESTEngine\n\n`RESTEngine`\
  \ 是 iHotelApp 的核心。该类封装了对 Web 服务独立类的每一次调用，该独立类处理你的网络调用。数据从 `RESTEngine` 传递到视图控制器时，应仅作为\
  \ `Model` 对象传递，而不是 JSON 或 `NSDictionary` 对象。（创建模型类的过程将在下一节中讨论。）现在，当发生与后端相关的错误时应该发生什么？从\
  \ `RESTEngine` 到视图控制器的错误通信将在后续章节中介绍。以下是需要完成的前两个重要步骤。\n\n1. 创建一个 `RESTEngine` 并将其添加到你的项目中。该类还将管理网络操作队列。有关演示实现，请参考书籍网站上的本章源码。\n\
  2. 在此 `RESTEngine` 中创建一个类型为 `ASINetworkQueue` 的属性，并在初始化方法内部初始化它。使用 `ASINetworkQueue`\
  \ 时你需要将 `ASIHTTPRequest` 框架添加到你的项目中。请参考本章末尾的“扩展阅读”部分获取有关如何将 `ASIHTTPRequest` 集成到项目的链接。\n\
  \n### RESTEngine.h 中的 networkQueue 初始化\n\n```objc\n@interface RESTEngine : NSObject\
  \ {}\n+ (RESTEngine*) sharedInstance;\n@property (nonatomic, retain) ASINetworkQueue\
  \ *networkQueue;\n```\n\n### RESTEngine.m 中的 networkQueue 初始化\n\n```objc\n@synthesize\
  \ delegate;\n@synthesize networkQueue;\n```\n\n你将最大并发操作数设置为 6。正确设置此数字对性能有巨大影响，这将在本章稍后的“提高\
  \ iOS 性能的技巧”章节中解释。\n\n## 为 RESTEngine 添加认证\n\n现在类已经准备就绪，你将添加方法来处理 Web 服务调用；首要任务是认证。`ASIHTTPRequest`\
  \ 为各种认证方案提供了封装方法，包括但不限于 HTTP 基础认证、HTTP 摘要认证方案、NTLM 认证等。我不会在本章中详细介绍认证机制的细节，只需简单地假设你通过向\
  \ `/loginwaiter` 请求或 `/logintable` 请求发送用户名和密码来与服务器交换访问令牌。你需要为这些 URL 端点定义宏。将以下代码添加到\
  \ `RESTEngine` 类头文件中：\n\n### RESTEngine.h 中的常量\n\n```objc\n#define BASE_URL @”http://api.example.com”\n\
  #define LOGIN_URL [NSString stringWithFormat:@”%@%@”, BASE_URL, @”/loginwaiter”]\n\
  ```\n\n接下来，在 `RESTEngine` 中创建一个属性来持有访问令牌，然后创建一个新方法 `initWithLoginName:password:`，如如下代码所示：\n\
  \n### RESTEngine.h 中的 init 方法（以及属性声明）\n\n```objc\n@property (nonatomic, retain)\
  \ NSString *sessionKey;\n-(id) initWithLoginName:(NSString*) loginName password:(NSString*)\
  \ password;\n```\n\n### RESTEngine.m 中的 init 方法（以及属性声明）\n\n```objc\n@synthesize\
  \ networkQueue;\n@synthesize sessionKey;\n…\n…\n-(id) initWithLoginName:(NSString*)\
  \ loginName password:(NSString*) password\n{\n  self.networkQueue = [ASINetworkQueue\
  \ queue];\n  [self.networkQueue setMaxConcurrentOperationCount:6];\n  [self.networkQueue\
  \ setDelegate:self];\n  [self.networkQueue go];\n  ASIFormDataRequest *request =\
  \ [ASIFormDataRequest requestWithURL:[NSURL URLWithString:LOGIN_URL]];\n  [request\
  \ setUsername:loginName];\n  [request setPassword:password];\n  [request setDelegate:self];\n\
  \  [request setFinishSelector:@selector(loginDone:)];\n  [request setFailSelector:@selector(loginFailed:)];\
  \  \n  [self.networkQueue addOperation:request];\n  return self;\n}\n```\n\n这就完成了你的\
  \ Web 服务调用。现在你应该通知调用者（通常是视图控制器）Web 服务的结果。你将使用委托来实现。\n\n## 为 RESTEngine 添加委托\n\n\
  对于每一个 Web 服务调用，`RESTEngine` 类都暴露两个委托方法，一个用于通知成功，另一个用于错误通知。通常此委托由调用 `RESTEngine`\
  \ 方法的视图控制器实现。\n\n另一种认为更干净通知调用者方法是使用 block。block 有它们自己的优缺点，将在第 16 章中讨论，该章节也涵盖了何时使用\
  \ block 何时使用委托。在该章节，你将修改 `RESTEngine` 使用 block 返回数据和错误。\n\n1. 使用以下代码为你的 `RESTEngine`\
  \ 类添加委托定义：\n\n### RESTEngine.h 中的委托代码\n\n```objc\n@protocol RESTEngineDelegate <NSObject>\n\
  @optional\n-(void) loginSucceeded:(NSString*) accessToken;\n-(void) loginFailedWithError:(NSError*)\
  \ error;\n@end\n\n..\n..\n//DELEGATES\n+(id)delegate;\n+(void)setDelegate:(id)newDelegate;\n\
  ```\n\n### RESTEngine.m 中的委托代码\n\n```objc\n+ (id)delegate {\n  return _delegate;\n\
  }\n+ (void)setDelegate:(id)newDelegate {\n  _delegate = newDelegate;\n}\n```\n\n\
  2. 现在更改 `loginDone` 和 `loginFailed` 方法以调用此委托。因为在委托声明中委托被标记为 `optional`，所以你在发送消息之前应该检查委托是否响应该方法。\n\
  \n### RESTEngine.m 中的登录请求处理\n\n```objc\n- (void)loginDone:(ASIHTTPRequest *)request\
  \  {\n  NSDictionary *responseDict = [[request responseString] mutableObjectFromJSONString];\n\
  \  self.accessToken = [responseDict objectForKey:@”accessToken”];\n  if([_delegate\
  \ respondsToSelector:@selector(loginSucceeded:)])\n    [_delegate performSelector:@selector(loginSucceeded:)\
  \ withObject:self.accessToken];\n}\n```\n\n\n\n\n\n```objectivec\n- (void)loginFailed:(ASIHTTPRequest\
  \ *)request {\n  self.accessToken = nil;\n  if([_delegate respondsToSelector:@selector(loginFailedWithError:)])\n\
  \    [_delegate performSelector:@selector(loginFailedWithError:) withObject:[request\
  \ error]];\n}\n```\n\n3.  现在 `RESTEgine` 类的实现已经完成，你可以从视图控制器中调用 `initialize` 方法（这通常是显示用户名和密码字段的登录页面）：\n\
  \n#### iHotelAppViewController.m 中的登录按钮事件处理\n\n```objectivec\n-(IBAction) loginButtonTapped:(id)\
  \ sender {\n    [[RESTEngine sharedInstance] initWithLoginName:@”mugunth” password:@”abracadabra”];\n\
  }\n\n-(void) loginSucceeded:(NSString*) accessToken {\n    NSLog(@”Login is successful\
  \ and this is the access token %@”, accessToken);\n}\n\n-(void) loginFailedWithError:(NSError*)\
  \ error {\n    NSLog(@”Login failed. Check your password. Error is :%@”, [error\
  \ localizedDescription]);\n}\n```\n\n因此，只需几行代码，你就能实现 Web 服务的登录功能。\n\n4.  记住访问令牌。如果你的访问令牌只是一个字符串，你可以将其存储在\
  \ `keychain` 或 `NSUserDefaults` 中。存储在 `keychain` 中比 `NSUserDefaults` 更安全。请根据你的安全需求选择。最简单且可能最干净的方法是移除\
  \ `accessToken` 的 `synthesize` 方法，并手动编写如下：\n\n#### RESTEngine.m 中的 Access Token\
  \ 自定义访问器\n\n```objectivec\n-(NSString*) accessToken\n{\n    if(!_accessToken)\n\
  \    {\n        _accessToken = [[NSUserDefaults standardUserDefaults] stringForKey:kAccessTokenDefaultsKey];\n\
  \        [_accessToken retain];\n    }\n    return [[_accessToken retain] autorelease];\n\
  }\n\n-(void) setAccessToken:(NSString *) aAccessToken\n{\n    [_accessToken release];\n\
  \    _accessToken = [aAccessToken retain];\n    [[NSUserDefaults standardUserDefaults]\
  \ setObject:self.accessToken forKey:kAccessTokenDefaultsKey];\n    [[NSUserDefaults\
  \ standardUserDefaults] synchronize];\n}\n```\n\n当你编写自定义访问器时，确保该方法通过发送 `willChangeValueForKey`\
  \ 和 `didChangeValueForKey` 消息来发送 KVO 通知。为了清晰起见，这里省略了部分内容。请从书籍网站获取完整源代码。\n\n如果你的\
  \ Web 服务器在登录时发送用户配置文件，你可能需要一种更复杂的机制来缓存数据。你可以查看第 17 章中的缓存内容。\n\n呼！这完成了你的第一个端点，但你还没有结束！接下来你要创建第二个端点\
  \ `/menuitems`，它用于从服务器下载菜单列表。\n\n#### 使用 Access Tokens 对你的 API 调用进行验证\n\n在大多数 Web\
  \ 服务中，登录后的每次调用可能都受到保护，只有通过传递访问令牌才能访问。与其在每个方法中发送访问令牌，更简洁的方法是在你的 `RestEngine` 中编写一个创建请求对象的工厂方法。该请求对象可以填充特定于调用的参数。\n\
  \n在以下示例中，你创建了一个名为 `prepareRequestWithURLString:` 的新方法。它返回一个针对给定 URL 的 `ASIFormDataRequest`。我提到过整个方法长度将小于五行吗？\n\
  \n#### 在 RESTEngine.m 中使用工厂方法准备 URL 请求\n\n```objectivec\n- (ASIFormDataRequest*)\
  \ prepareRequestForURLString:(NSString*) urlString\n{\n  ASIFormDataRequest *request\
  \ = [ASIFormDataRequest requestWithURL:[NSURL URLWithString:urlString]];\n  if(self.accessToken)\n\
  \    [request setPostValue:self.accessToken forKey:@”AccessToken”];\n  return request;\n\
  }\n```\n\n如果你从任何其他方法中需要请求对象，可以调用此工厂方法。你再也不会遇到因意外忘记设置访问令牌而导致的 API 调用 Bug 了。注意，该工厂方法还可以根据你的\
  \ Web 服务需求设置额外的参数。如果你的 Web 服务要求你对所有调用开启 gzip 编码，或者需要你发送应用程序版本号和设备相关信息，这个工厂方法是添加这些内容的最佳位置。\n\
  \n现在为你的 `RESTEngine` 类添加一个从服务器获取菜单项的方法：\n\n#### RESTEngine.m 中用于获取菜单项列表的方法\n\n```objectivec\n\
  -(ASIFormDataRequest*) fetchMenuItems {\n  ASIFormDataRequest *request = [self prepareRequestForURLString:MENU_ITEMS_URL];\n\
  \  [request setDidFinishSelector:@selector(menuFetchDone:)];\n  [request setDidFailSelector:@selector(menuFetchFailed:)];\n\
  \  [self.networkQueue addOperation:request];\n  return request;\n}\n```\n\n####\
  \ 取消请求\n\n在大多数 Web 服务中，登录后的每次调用可能都受到保护，只有通过传递访问令牌才能访问。与其在每个方法中发送访问令牌，更简洁的方法是在你的\
  \ `RestEngine` 中编写一个创建请求对象的工厂方法。该请求对象可以填充特定于调用的参数。\n\n在以下示例中，你创建了一个名为 `prepareRequestWithURLString:`\
  \ 的新方法。它返回一个针对给定 URL 的 `ASIFormDataRequest`。我提到过整个方法长度将小于五行吗？\n\n\n\n\n\n在你开始编写第一个模型类之前，你需要稍微了解一下模型类的继承架构。任何基于网络服务的应用程序都包含多个模型。事实上，一个应用程序包含十个模型并不罕见。与其在十个不同的类中编写相同的\
  \ KVC（键值编码）代码，不如编写一个基类，让它执行大部分 KVC 操作，并将极少的工作委托给子类。将这个基类命名为 `JSONModel`。应用程序中任何模拟\
  \ JSON 且需要 JSON 观测的模型类都应该继承自这个 `JSONModel`。\n\n由于你将创建模型类的拷贝和/或可变拷贝，请在此基类中实现 `NSCopying`\
  \ 和 `NSMutableCopying`。派生类必须重写此基类的实现并提供它们自己的深拷贝方法。\n\n首先，在基类中添加一个名为 `initWithDictionary:`\
  \ 的方法。你的 `JSONModel.h` 应该类似于下面。\n\n#### JSONModel.h\n\n```objc\n@interface JSONModel\
  \ : NSObject <NSCopying, NSMutableCopying> {\n}\n\n-(id) initWithDictionary:(NSMutableDictionary*)\
  \ jsonDictionary;\n@end\n```\n\n然后实现 `initWithDictionary:` 方法：\n\n#### JSONModel.m\n\
  \n```objc\n-(id) initWithDictionary:(NSMutableDictionary*) jsonObject\n{\n    if((self\
  \ = [super init]))\n    {\n        [self init];\n        [self setValuesForKeysWithDictionary:jsonObject];\n\
  \    }\n    return self;\n}\n```\n\n此过程中最重要的部分是 `setValuesForKeysDictionary:` 方法。该方法是\
  \ Objective-C KVC 的一部分，它会匹配类中与字典中键名相同的属性，并将其值设置为该条目的值。最重要的一点是，如果 `self` 是派生类，它会自动匹配派生类的属性并设置它们的值。还有一些需要处理的异常情况，稍后会介绍。\n\
  \n搞定！只需一行代码，你就已经将 JSON “映射”到了你的模型类中。但当你有一个派生类时，一切都会自动工作吗？这里难道没有陷阱吗？在进入细节之前，你应该理解\
  \ `setValuesForKeysDictionary:` 方法是如何运作的。你的 `MenuItem` 字典看起来像这样：\n\n```json\n“id”:\
  \ “JAP122”,\n“image”: “http://d1.myhotel.com/food_image1.jpg”,\n“name”: “Teriyaki\
  \ Bento”,\n“spicyLevel”: 2,\n“rating” : 4,\n“description” : “Teriyaki Bento is one\
  \ of the best lorem ipsum dolor sit”,\n“waitingTime” : “930”,\n“reviewCount” : 4\n\
  ```\n\n当你将此字典传递给 `setValuesForKeysDictionary:` 方法时，它会发送以下消息及其相应的值：`setId`, `setImage`,\
  \ `setName`, `setSpicyLevel`, `setRating`, `setDescription`, `setWaitingTime` 和\
  \ `setReviewCount`。因此，建模此 JSON 的类应该实现这些方法。实现这些方法的简单方法是使用 Objective-C 内置的 `@property`\
  \ 和 `@synthesize`，所以你的 `MenuItem.h` 模型类应该所示：\n\n#### MenuItem.h\n\n```objc\n@interface\
  \ MenuItem : JSONModel\n@property (nonatomic, strong) NSString *itemId;\n@property\
  \ (nonatomic, strong) NSString *image;\n@property (nonatomic, strong) NSString *name;\n\
  @property (nonatomic, strong) NSString *spicyLevel;\n@property (nonatomic, strong)\
  \ NSString *rating;\n@property (nonatomic, strong) NSString *itemDescription;\n\
  @property (nonatomic, strong) NSString *waitingTime;\n@property (nonatomic, strong)\
  \ NSString *reviewCount;\n@end\n```\n\n#### MenuItem.m\n\n```objc\n@synthesize itemId;\n\
  @synthesize image;\n@synthesize name;\n@synthesize spicyLevel;\n@synthesize rating;\n\
  @synthesize itemDescription;\n@synthesize waitingTime;\n@synthesize reviewCount;\n\
  ```\n\n注意 `id` 和 `description` 的属性名已更改为 `itemId` 和 `itemDescription`。这是因为 `id` 是保留关键字，而\
  \ `description` 是 `NSObject` 中一个打印对象地址的方法。为了避免冲突，你必须重命名它们。然而，你应该处理这些异常情况，因为 `setValuesForKeysDictionary:`\
  \ 方法的默认实现会崩溃并带有熟悉的错误信息：“This class is not key value coding-compliant for the `key:id`.”。为了处理这种情况，KVC\
  \ 提供了一个名为 `setValue:forUndefinedKey:` 的方法。\n\n事实上，是该方法的默认实现抛出了 `NSUndefinedKeyException`。在你的派生类中重写此方法并相应设置值。\n\
  \n你的 `MenuItem.m` 现在应该像这样：\n\n#### MenuItem.m\n\n```objc\n- (void)setValue:(id)value\
  \ forUndefinedKey:(NSString *)key\n{\n    if([key isEqualToString:@”id”])\n    \
  \    self.itemId = value;\n    if([key isEqualToString:@”description”])\n      \
  \  self.itemDescription = value;\n    else\n        [super setValue:value forKey:key];\n\
  }\n```\n\n为了防止未来因为 JSON 中的无用键而导致崩溃，并在你的编程风格中更具防御性，你可以这样在基类 `JSONModel.m` 中重写 `setValue:forUndefinedKey:`\
  \ 方法：\n\n```objc\n- (void)setValue:(id)value forUndefinedKey:(NSString *)key\n{\n\
  \    NSLog(@”Undefined Key: %@\", key);\n}\n```\n\n现在，在你的 `RESTEngine` 中，为 `fetchMenuItems`\
  \ 方法添加处理器以将 JSON 转换为对象：\n\n#### RESTEngine.m\n\n```objc\n- (void)menuFetchDone:(ASIHTTPRequest*)request\n\
  {\n    NSMutableArray *responseArray = [[request responseString] mutableObjectFromJSON];\n\
  \    NSMutableArray *menuItems = [NSMutableArray array];\n    for(NSMutableDictionary\
  \ *menuItemDict in responseArray)\n    {\n        [menuItems addObject:[[MenuItem\
  \ alloc] initWithDictionary:menuItemDict] autorelease];\n    }\n    if([_delegate\
  \ respondsToSelector:@selector(fetchSucceeded:)])\n    {\n        [_delegate performSelector:@selector(fetchSucceeded:)\
  \ withObject:menuItems];\n    }\n}\n\n- (void)menuFetchFailed:(ASIHTTPRequest*)request\n\
  {\n    if([_delegate respondsToSelector:@selector(failWithError:)])\n    {\n   \
  \     [_delegate performSelector:@selector(failWithError:) withObject:[request error]];\n\
  \    }\n}\n```\n\n正如你所见，你通过字典初始化 `MenuItem init` 方法。总之，通过只重写特殊方法，你成功地将 JSON 字典映射到了自定义模型中，而且该模型中没有任何\
  \ JSON 字符串！这就是 KVC 的力量。代码本身也具有防御性，因为当服务器发送的 JSON 键发生变化（可能是由于服务器端的 Bug），你在控制台上看到显示未定义键的\
  \ `NSLog` 语句，你可以通知服务器人员或修改客户端以支持新键。\n\n在派生类中添加执行深拷贝的方法也是个主意。只需重写 `NSCopying` 和 `NSMutableCopying`\
  \ 中的方法即可。来自 Mac App Store 的 Accessorizer 等工具可以帮助你完成。（参见“扩展阅读”部分获取应用程序链接。）\n\n####\
  \ 列表与详情 JSON 对象\n\nJSON 对象是从服务器传输到客户端的负载。为了提高性能并减小负载大小，服务器开发者通常会对同一个对象使用两种负载格式：一种是包含对象所有信息的完整类型负载格式；另一种是较小的负载格式，仅包含在列表中显示所需的信息。对于本章的示例，列表页将显示菜单项目的少量信息，而其他内容（包括图片、照片和评论）将在详情页显示。\n\
  \n\n\n\n这种技术对于提升 iOS App 的感知性能大有帮助。在实现方面，iOS App 无需为了映射两种类型的 JSON 而进行更改。你获取的要么是一个完整的\
  \ JSON，要么是一个部分填充你的对象的 JSON。在这种情况下，编写用于映射详细 JSON 的代码在不进行任何修改的情况下即可正常工作。例如，服务器可以为\
  \ `/menuitems` 发送小型负载 JSON，并为 `/menuitems/<menuitemid>` 发送详细负载。详细负载将包含完全相同的数据，外加上第一页评论以及菜肴照片的链接等。\n\
  \n## 嵌套 JSON 对象\n\n在示例中，每个菜单项都将有一个由用户留下的评论数组。如果你依赖 `KVC` 的默认实现，并在模型上声明一个 `NSMutableArray`\
  \ 属性，那么 `KVC` 绑定将将其设置为一个 `NSMutableDictionary` 数组。但你实际上想要的是以递归的方式也对该字典进行映射。这种情况通过重写\
  \ `setValue:forKey:` 方法来处理。\n\n假设以下内容代表 `/menuitems/<itemid>` 方法发送的 JSON 格式：\n\n\
  ```json\n{\n  “menuitems” : [{\n    “id”: “JAP122”,\n    “image”: “http://d1.myhotel.com/food_image1.jpg”,\n\
  \    “name”: “Teriyaki Bento”,\n    “spicyLevel”: 2,\n    “rating” : 4,\n    “description”\
  \ : “Teriyaki Bento is one of the best lorem ipsum dolor sit”,\n    “waitingTime”\
  \ : “930”,\n    “reviewCount” : 4,\n    “reviews”: [{\n      “id”: “rev1”,\n   \
  \   “reviewText”: “This is an awesome place to eat”,\n      “reviewerName”: “Awesome\
  \ Man”,\n      “reviewedDate”: “10229274633”,\n      “rating”: “5”\n    }]\n  }],\n\
  \  “status” : “OK”\n}\n```\n\n这段代码与你之前看到的非常相似，但有一个额外的负载：评论数组。在现实场景中，可能会有多个此类添加，例如照片列表、“点赞”列表等。但为了简单起见，假设菜单项的详细列表只有一条额外信息，即评论数组。现在，在重写\
  \ `setValue:forKey:` 方法之前，为评论条目创建一个模型对象。该类的头文件看起来将与下面类似。实现部分仅包含合成器以及重写了 `NSCopying`\
  \ 和 `NSMutableCopying`（深拷贝）方法。\n\n### Review.m\n\n```objc\n@property (nonatomic,\
  \ strong) NSString *rating;\n@property (nonatomic, strong) NSString *reviewDate;\n\
  @property (nonatomic, strong) NSString *reviewerName;\n@property (nonatomic, strong)\
  \ NSString *reviewId;\n@property (nonatomic, strong) NSString *reviewText;\n```\n\
  \n再次，你可以使用类似 accessor 的工具生成这些访问器。你的 JSON 没有任何可能与 Objective-C 保留列表冲突的特殊键，因此不需要为将\
  \ JSON 转换为模型编写任何显式代码。初始化代码在基类中，符合 `KVC` 的代码由合成器生成。这就是 `KVC` 的威力。\n\n接下来，在 `MenuItem`\
  \ 模型中重写 `setValue:forKey:` 方法，将评论字典转换为 `Review` 模型：\n\n### MenuItem.m 中对 KVC 的 setValue:forKey:\
  \ 的自定义处理\n\n```objc\n-(void) setValue:(id)value forKey:(NSString *)key\n{\n  if([key\
  \ isEqualToString:@reviews”])\n  {\n    for(NSMutableDictionary *reviewArray in\
  \ value)\n    {\n      Review *thisReview = [[[Review alloc] initWithDictionary:reviewArray]\
  \ autorelease;\n      [self.reviews addObject:thisReview];\n    }\n  }\nelse\n \
  \ [super setValue:value forKey:key];\n}\n```\n\n这段代码背后的思想是以特殊方式处理 JSON 中的 `reviews`\
  \ 键，并让其他键由父类处理。\n\n## 少即是多\n\n你可能在互联网上资深 Objective-C 开发者的博客上听过 `KVC` 和 `KVO`，他们解释了它们有多伟大。现在你理解了它们，可以在下一个\
  \ App 中运用这些概念。你会发现它们有多强大，以及它们如何轻松让你以更高效的方式编写更少的代码。接下来，进入错误处理。\n\n## 错误处理\n\n回想你在\
  \ JSON 负载中看到的名为 `status` 的键。每个 Web 服务都有某种方式向客户端通信错误消息。在某些情况下，它是通过特殊键（如 `status`）发送的。在其他情况下，Web\
  \ 服务器会发送一个带有实际错误更多信息的 `error` 键，而在成功调用时则不发送此类键。本节向你展示如何在 iOS 上对此进行建模，以便编写尽可能少的代码，同时以易于阅读和理解的方式编写。\n\
  \n首先要理解的是，并不是所有的 API 错误都可以映射到自定义的 HTTP 错误。事实上，即使一切正常，由于用户输入错误，服务器也可能抛出错误。如果用户尝试用已占用的电子邮件地址注册，网站注册服务可能会抛出错误。这只是一个例子，在大多数情况下，你需要专门的错误处理来处理自己的业务逻辑错误。例如，在本示例中，缺少菜单项会导致\
  \ 404 错误。大多数 Web 服务随 404 通知一起发送自定义错误消息，以便客户端理解导致该 404 的原因。客户端实现不应仅仅将 HTTP 错误作为消息报告给用户，还应该理解内部业务逻辑错误，以实现优雅的错误报告并进行正确的错误报告。否则，你能显示的唯一错误就是“抱歉，发生了一些问题，请稍后再试”，包括你的客户在内的没有人对看这种模糊的消息感兴趣。本节将向你如何以优雅的方式处理这些情况。\n\
  \n在接下来的步骤中，你通过子类 `HTTPRequest` 或 `ASIFormDataRequest` 来处理自定义 API 错误。如果你的 App 只需要执行“表单提交”类的请求，子类\
  \ `ASIFormDataRequest`，否则子类其父类 `HTTPRequest`。\n\n1. 创建 `ASIFormDataRequest` 的子类。该子类将有一个属性用于存储从服务器抛出的业务逻辑错误。\n\
  2. 在子类中创建一个名为 `restError` 的 `NSError*` 属性。\n3. 重写两个方法来处理错误情况。要重写的方法是 `failWithError:`。\n\
  \n### RESTRequest.m 中说明错误处理的代码\n\n```objc\n-(void) failWithError:(NSError *)theError\n\
  {\n  NSMutableDictionary *errorDict = [[self responseDictionary] objectForKey:@error”];\n\
  \  if(errorDict == nil)\n  {\n    self.restError = [[NSError alloc] initWithDomain:kRequestErrorDomain\
  \ code:[theError code] userInfo:[theError userInfo]];\n  }\nelse\n  {\n    self.restError\
  \ = [[NSError alloc] initWithDomain:kBusinessErrorDomain code:[[errorDict objectForKey:@code”]\
  \ intValue]userInfo:errorDict];\n  }\n  [super failWithError:theError];\n}\n```\n\
  \n使用此类，你检查 `“error”` JSON 键的存在并进行适当处理。`failWithError` 方法会在发生 HTTP 错误时被调用。你应该以相同的方式处理非\
  \ HTTP 业务逻辑错误。正如你之前看到的，并不是每个业务逻辑错误都可以映射到相应的 HTTP 错误代码。此外，在某些情况下，可能会随响应发送一个无害错误，服务器可能会将视为错误或正常情况的责任委托给客户端。为了这两种情况，你必须重写另一个方法\
  \ `requestFinished:`，如下面代码所示：\n\n### RESTRequest.m 中说明成功情况处理请求并在任何时候报告业务逻辑错误的代码\n\
  \n```objc\n-(void)requestFinished\n{\n  NSMutableDictionary *errorDict = [[self\
  \ responseDictionary] objectForKey:@error”];\n  if(errorDict)\n{\n```\n\n\n\n\n\n\
  ```objectivec\nself.restError = [[NSError alloc] initWithDomain:kBusinessErrorDomain\
  \ code:[[errorDict objectForKey:@”code”] intValue] userInfo:errorDict];\n[super\
  \ failWithError:self.restError];\n}\nelse\n{\n    [super requestFinished];\n}\n\
  ```\n\n这两个方法都会在你的子类请求对象的 `restError` 属性中记录业务逻辑错误。这使得客户端能够同时获取 HTTP 错误（通过访问 `RestRequest`\
  \ 超父类的错误对象）和通过本地属性 `restError` 获取业务层错误。\n\n由于这种处理是在子类中完成的，`RestEngine` 类不需要进行任何额外的错误处理。它收到的只是针对\
  \ HTTP 错误或业务逻辑错误这两种类型良好封装的 `NSError` 对象。现在，视图控制器的实现将变得非常简单，只需检查错误是否为 `nil`；如果不为\
  \ `nil`，则显示 `[[request restError] userInfo]` 内部的消息。\n\n接下来，我将开始讨论本地化。\n\n## 本地化\n\
  \n本节内容关于 Web 服务相关错误消息的本地化，而不是你的 App 本地化。第 13 章详细解释了如何为你的 App 添加国际化和本地化支持。\n\n某些实现要求你对多种语言本地化错误消息。对于在\
  \ App 内部生成的错误，这是简单的，可以使用基础类和宏来处理。对于服务器相关的错误，之前的实现只是在 UI 上显示了服务器错误。显示本地化错误的最佳方法是让服务器返回约定的代码。iOS\
  \ 客户端随后可以查找本地化字符串表，并根据给定的代码显示正确的错误。\n\n### RESTError.m\n\n```objectivec\n+ (void)\
  \ initialize\n{\n    NSString *fileName = [NSString stringWithFormat:@”Errors_%@”,\
  \ [[NSLocale currentLocale] localeIdentifier]];\n    NSString *filePath = [[NSBundle\
  \ mainBundle] pathForResource:fileName ofType:@”plist”];\n    if(filePath != nil)\n\
  \    {\n        errorCodes = [[NSMutableDictionary alloc] initWithContentsOfFile:filePath];\
  \  \n    }\nelse\n{\n    // 对于不支持的语言，回退到英语\n    NSString *filePath = [[NSBundle\
  \ mainBundle] pathForResource:@”Errors_en_US” ofType:@”plist”];\n    errorCodes\
  \ = [[NSMutableDictionary alloc] initWithContentsOfFile:filePath];      \n}\n```\n\
  \n此 `RESTError` 类再次可以使用你在本章早期学到的 KVC 技术，通过从服务器获取错误字典来初始化。重写 `NSError` 的 `localizedDescription`\
  \ 和 `localizedRecoverySuggestion` 方法，以提供适当的用户可读错误方法。如果你的 Web 服务在提供错误消息的同时提供了错误代码，这是处理和显示错误消息的最佳方法，而不是显示来自\
  \ `userInfo` 字典的服务器错误。\n\n## 使用分类类（Category Classes）处理额外格式\n\n假设你编写并交付了 App，由于某些原因，客户端想要将服务器实现迁移到基于\
  \ Windows 的系统，而服务器现在向你发送 XML 数据而不是 JSON。在现有的架构下，很容易为你的模型添加额外的格式解析。推荐的方法是在你的模型上编写一个分类扩展（category\
  \ extension），该扩展包含包含一个将 XML 转换为字典的方法。简而言之，在你的分类扩展中编写一个方法将 XML 树转换为 `NSMutableDictionary`，并将此字典传递给你之前编写的\
  \ `initWithDictionary:` 方法。像这样的分类类提供了一种非常强大的方式，可以在扩展和为现有实现添加功能而不产生任何意外的副作用。\n\n\
  ## 提高 iOS 性能的提示\n\n对于基于 Web 服务的 App，提高性能的最佳提示是避免发送立即不需要的数据。与基于 Web 的 App 不同，iPhone\
  \ App 的带宽非常有限，在大多数情况下它会连接到 3G 网络。尝试实现诸如预取用户下一页内容的技巧只会减慢你的 App。\n\n避免多次小型的类 AJAX\
  \ 的 API 调用。在本章之前的“创建 RESTEngine”部分中，你初始化了 `networkQueue` 来运行六个并发操作，因为大多数服务器不允许从单个\
  \ IP 地址建立多于六个并行 HTTP 连接。运行六个以上的操作只会导致第七个及后续操作超时。在 3G 网络上（至少在 2011 年），大多数网络运营商会限制带宽，并将移动设备的出站连接数限制为两个。这在\
  \ EDGE 上通常只有一个。因此，你甚至可以使用 Apple 提供的 `Reachability` 类监听可达性通知，并在连接变化时动态更改队列大小。再次，3G\
  \ 上的 2 个和 EDGE 上的 1 个计数并不是绝对的，你应该测试你客户群的网络情况并相应地使用结果。\n\n如果你对服务器开发有控制权，以下提示可能帮助你开发的\
  \ iOS App 发挥最佳性能：\n\n- 满足基于 Web 客户端的服务器几乎总是会有多个小型的 Web 服务调用，这些调用通常使用 AJAX 执行。在 iOS\
  \ 上，最好避免这些 API，并可能使用或开发自定义 API，为每次调用提供更多定制化的数据。\n- 与浏览器不同，大多数运营商网络会限制并行数据连接的数量。同样，可以安全地假设你不应该在\
  \ EDGE 连接上运行超过一个网络操作，在 3G 网络上运行多于两个并行网络操作，在 wi-fi 连接上运行六个。\n\n### 总结\n\n在本章中，你学习了如何构建一个使用\
  \ Web 服务的 iOS 应用。本章还介绍了不同的数据交换格式以及在 Objective-C 中解析它们的方法，你学习了这种使用 Objective-C 强大方法\
  \ KVC 处理 RESTful 服务响应的非常有效的方法。然后你还学习了使用队列处理并发请求，以及如何通过更改可用网络上的最大并发操作来最大化性能。\n\n\
  ## 扩展阅读\n\n### Apple 文档\n\n以下文档可以在 [`developer.apple.com`](http://developer.apple.com/)\
  \ 的 iOS Developer Library 或 Xcode 文档和 API 参考获取。\n\n- `Reachability`. Apple Developer\
  \ Documentation.\n- Apple XMLPerformance Sample Code\n- Apple. `NSXMLDocument` Class.\n\
  \n\n\n\n\nmbrugger 在 Github 上的 json-benchmarks：[`https://github.com/mbrugger/json-benchmarks/`](https://github.com/mbrugger/json-benchmarks/)\n\
  \n# 第 11 章：使用安全服务加固防御\n\niOS 可能是大多数开发者遇到的第一个采用真正“最小权限”安全模型的平台。大多数现代操作系统都采用某种形式的权限分离，允许不同的进程以不同的权限运行，但这几乎总是是以非常粗粒的方式使用的。Unix、OS\
  \ X 和 Windows 上的大多数应用程序以当前用户或超级用户（superuser）身份运行，后者几乎可以做任何事情。进一步划分权限的尝试（无论是通过安全增强型\
  \ Linux (`SELinux`) 还是 Windows 用户账户控制 (`UAC`)）通常都会导致开发者的反抗。关于 `SELinux` 最常见的问题不是如何对其进行最佳开发，而是如何将其关闭。\n\
  \n由于受到这些背景的影响，开发者在遇到 iOS 安全模型时往往会感到震惊。Apple 的方法并不是确保最大的灵活性，而是给予开发者尽可能最少的权限，并看看软件开发者在这些权限下无法实现什么。然后，Apple\
  \ 提供最少的额外权限，以允许该平台所需的软件类型。这对开发者来说可能非常有限制，但它也保持了 iOS 的相当稳定并免受恶意软件的影响。Apple 不可能改变这一立场，因此理解并处理安全模型对于\
  \ iOS 开发至关重要。\n\n本章将介绍绕过 iOS 安全模型的方法，深入探讨 iOS 提供的众多安全服务，并提供你真正理解 Apple 安全文档所需的基础知识。在此过程中，你将对证书和加密在实践中的工作原理有更深入的理解，从而利用这些功能真正提高你产品的安全性。\n\
  \n本章的代码可以在在线示例代码中找到。还有一个名为 `FileExplorer` 的简单项目，你可以通过它研究文件系统的公共部分。\n\n## 理解 iOS\
  \ 沙盒\n\niOS 安全模型的核心是沙盒（sandbox）。当应用程序被安装时，它在文件系统中拥有自己的家目录（home directory），且仅供该应用程序读取。这使得应用程序之间共享信息变得困难，但也让恶意或编写不当的软件难以读取或修改你的数据。\n\
  \n应用程序之间并不是使用标准的 Unix 文件权限分离的。所有应用程序都以相同的用户 ID（`501`，`mobile`）运行。然而，由于操作系统的限制，对另一个应用程序的家目录调用\
  \ `stat` 会失败。类似的限制阻止了你的应用程序读取 `/var/log`，同时允许访问 `/System/Library/Frameworks`。\n\n\
  在你的沙盒中，有四个重要的顶层目录：你的 `.app` 程序包、`Documents`、`Library` 和 `tmp`。虽然你可以在沙盒内创建新目录，但 iTunes\
  \ 如何处理这些目录并没有明确定义。我建议将所有内容都放在这些顶层目录之一。如果你需要更复杂的组织，始终可以在 `Library` 下创建子目录。\n\n你的\
  \ `.app` 封装是由 Xcode 编译并复制到设备上的包。其中的所有内容都经过了数字签名，因此你无法修改它。特别是这包含了你的 `Resources` 目录。如果你想修改作为包的一部分安装的文件，你需要先将它们复制到其他地方，通常是\
  \ `Library` 中的某个地方。\n\n`Documents` 目录是你存储用户可见数据的地方，特别是像用户指定文件名的文字处理文档或绘图等文件。如果 `Info.plist`\
  \ 中开启了 `UIFileSharingEnabled`，这些文件可以通过文件共享在桌面可见。\n\n`Library` 目录存储不应直接对用户可见的文件。`Library/Caches`\
  \ 目录很特殊，因为它不被备份，但在应用程序升级之间会被保留。你应该将大多数不想复制到桌面的内容放在这里。\n\n`tmp` 目录很特殊，因为它既不被备份，也不会在应用程序升级之间保留。正如其名称所示，这它是临时文件的理想存放处。\n\
  \n在考虑用户数据的安全性时，备份是一个重要的考虑因素。用户可以选择是否使用密码加密 iTunes 备份。如果有不应以明文存储在桌面机器上的数据，你应该将其存储在钥匙（keychain）中（参见本章后文“使用钥匙”部分）。只有在启用备份加密时，iTunes\
  \ 才会备份钥匙。\n\n如果你有不想让用户访问的信息，可以将其存储在钥匙或 `Library/Caches` 中，因为这些不会被备份。然而，这种保护是很弱的，因为用户始终可以越狱手机读取任何文件或钥匙。没有可靠的方法可以防止设备所有者读取该设备上的数据。iOS\
  \ 安全是为了保护用户免受攻击者，而不是保护应用程序免受用户。\n\n## 安全网络通信\n\n大多数系统最大的风险是它们的网络通信。攻击者不需要访问设备，只需要访问设备的网络。最危险的区域通常是咖啡店、机场和其他公共\
  \ Wi-Fi 网络。确保用户信息即使在敌对网络上也是安全的是你的责任。\n\n第一个也是最简单的解决方案是为网络通信使用安全超文本传输协议（HTTPS）。大多数\
  \ iOS 网络 API 会自动处理 HTTPS，该协议消除了许多最容易的攻击。在最简单的部署中，你在 Web 服务器上放置一个自签名证书，开启 HTTPS，并配置\
  \ `NSURLConnection` 接受不受信任的证书（稍后将讨论）。这仍然容易受到几种攻击的侵害，但它易于部署并处理了最基本的攻击。\n\n在 iOS 5\
  \ 中，`NSURLConnection` 的非正式代理协议（delegate protocol）已被两个正式协议 `NSURLConnectionDelegate`\
  \ 和 `NSURLConnectionDataDelegate` 所代替。尽管现在有两个协议，但仍然只有一个代理（类型为 `id`），所以这主要影响文档的组织方式。\n\
  \niOS 5 中 `NSURLConnection` 的主要变化是认证方法。以前有三个方法——`connection:canAuthenticateAgainstProtectionSpace`、`connection:didReceiveAuthenticationChallenge`\
  \ 和 `connection:didCancelAuthenticationChallenge`，现在只有一个：`connection:willSendRequestForAuthenticationChallenge:`。在这个方法中，你应该判断是否愿意对该服务器进行认证，如果是，则提供凭据。以下代码会对任何呈现损坏证书的服务器进行认证，无论该证书是否有效或受信：\n\
  \n```objc\n- (void)connection:(NSURLConnection *)connection\nwillSendRequestForAuthenticationChallenge:(NSURLAuthenticationChallenge\
  \ *)challenge\n{\n  SecTrustRef trust = challenge.protectionSpace.serverTrust;\n\
  \  NSURLCredential *cred;\n  cred = [NSURLCredential credentialForTrust:trust];\n\
  \  [challenge.sender useCredential:cred\n    forAuthenticationChallenge:challenge];\n\
  }\n```\n\n这段代码提取了对应的信任对象，并为其创建一个凭据对象。即使你没有向服务器传递凭据，HTTPS 连接始终需要凭据对象。本章后文的“检查证书有效性”部分解释了如何更仔细地验证证书。\n\
  \n在第 10 章介绍的 `ASIHTTPRequest` 可以在不需要实现代理方法的情况下支持不受信任的证书。你可以如下所示配置请求：\n\n```objc\n\
  [request setValidatesSecureCertificate:NO];\n```\n\n## 证书是如何工作的\n\n\n\n\n\n希望你以前遇到过公钥密钥基础设施（PKI）系统。本节将对该技术进行快速概述，然后讨论它是如何影响你的应用程序安全性的。\n\
  \n### 非对称加密\n\n非对称加密基于这样一个数学事实：你可以找到两个非常大的数字（称之为 `A` 和 `B`），它们之间的关系使得用其中任何一个密钥加密的内容，都可以用另一个密钥进行解密，反之亦然。密钥\
  \ `A` 无法解密密钥 `A` 加密的内容，密钥 `B` 也无法解密密钥 `B` 加密的内容。每个密钥只能解密对方的密文。密钥 `A` 和密钥 `B` 之间没有本质区别，但出于公钥加密的目的，其中一个被称为公钥（通常允许所有人知道），而另一个被指定为私钥（它是保密的）。\n\
  \n你可以使用公钥对数据进行加密，使得只有拥有私钥的计算机才能对其解密。这是公钥系统中反复使用的一个重要属性。如果你想证明某个实体（人或机器）拥有私钥，你可以生成一个随机数，用该实体的公钥对其加密并发送。该实体用其私钥解密消息，用你的公钥再次加密并发回给你。因为只有私钥才能解密该消息，所以和你通信的实体必须拥有该私钥。\n\
  \n这种属性还允许你对数据进行数字签名。给定某些数据，你先用某种常用的哈希算法对其进行哈希处理，然后用你的私钥对其加密。生成的密文就是签名。要验证签名，你再次用相同的算法对数据进行哈希处理，使用公钥解密签名，并比较哈希值。如果它们匹配，你就知道签名是由某个拥有私钥的实体创建的。\n\
  \n仅仅一个实体拥有私钥并不能证明他就是他所声称的。你需要问两个问题：首先，私钥受保护程度如何？任何可以访问私钥的人都可以用它伪造签名。其次，你如何知道你拥有的公钥与你关心的实体是相关的？如果我在街上走向你并给你一张写着“我是美国总统”的片片，这几乎不能证明任何问题。我是递给你名片的人。同样，如果一个服务器向你展示一个声称属于\
  \ `www.apple.com` 的公钥，你为什么要相信它？这就是证书链派用场的地方，它与这两个问题都相关。\n\n### 证书链\n\n证书由公钥、一些关于证书的元数据（稍后会介绍）以及来自其他证书的签名集合组成。在大多数情况下，存在一条短的证书链，每个证书对其下面的证书进行签名。在极少数情况下，一个证书上可能有多个签名。图\
  \ 11-1 是证书链的示例。\n\n在这个示例中，服务器 `daw.apple.com` 展示了一个证书，其中包含了了自己的公钥，该证书由 VeriSign\
  \ 的中间证书签名，而该中间证书又由 VeriSign 的根证书签名。从数学上讲，你可以确定这些证书的控制者确实签署了链中的下一个证书，但你为什么要信任它们任何一个呢？你信任它们是因为\
  \ Apple 信任 VeriSign 根证书，根证书签署了中间证书，中间证书又签署了 Apple 证书。Apple 将 VeriSign 根证书放在每个 iOS\
  \ 设备的受信任根存储库中，还有一百多个其他受信任根证书。受信任根存储库是一个被视为显式信任的证书列表。显式信任的证书被称为锚点（anchors）。如果你不想信任\
  \ Apple 的列表，可以设置自己的锚点。\n\n![9781119961321-fg1101.eps](img/9781119961321-fg1101_fmt.jpeg)\n\
  \n图 11-1 daw.apple.com 的证书链\n\n### 自签名证书\n\n这引出了一个被严重误用的术语——自签名证书。出于加密原因，每个证书都包含自身的签名。只有这种签名的证书被称为自签名证书。通常，当人们谈论自签名证书时，指的是你不应该信任的证书。但\
  \ VeriSign 根证书是一个自签名证书，它是世界上最受信任的证书之一。根据定义，每个根证书都是自签名证书。区别在哪里？不在于证书链中有多少签名，而在于链中所有私钥受保护的如何，以及所有者的身份是否经过了验证。\n\
  \n如果你生成自己的自签名证书并很好保护私钥，那么它比 VeriSign 发给你的证书更安全。在这两种情况下，你都依赖于对私钥的保护，但在后者，你还需要担心 VeriSign\
  \ 如何保护它的私钥。VeriSign 花费了大量的金钱和精力做到这一点，但保护两个密钥总是比只保护其中一个更有风险。\n\n这并不是说来自 VeriSign、DigiTrust\
  \ 和其他提供者的商业证书是坏的。但获取商业证书并不是为了提高你系统的安全性。你获取它是为了方便，因为商业证书已经在根密钥存储库中了。但请记住，你控制着自己应用程序中的根密钥存储库。这导致了一个令人惊讶的事实：购买商业证书来保护你的应用程序到你自己服务器的网络协议，并没有安全上的理由。\n\
  \n商业证书仅对于浏览器或其他你不控制的软件访问的网站才有价值。生成自己的证书并在你的应用程序中分发公钥，比使用商业证书稍微安全一点。如果你已经为你的服务器有了商业证书，那么在你的应用程序中使用它会稍微方便一些，但它并不会更安全。这并不是说信任随机证书是可以的（即关闭证书验证）。它的意思是，只信任你的证书而不是信任商业证书是可以的。\n\
  \n检查证书有效性\n\n在假设证书没有损坏的情况下，它是否有效？证书包含了大量关于其所包含的公钥的元数据。公钥只是一个非常大的数字。它本身不代表任何内容。是元数据赋予了那个数字意义。\n\
  \n\n\n\n\n最重要的元数据是“主题”（subject）。对于服务器而言，这通常是完全限定域名名称（FQDN），例如 `www.example.org`。有效性的首次测试是名称匹配。如果你走进一家银行并证明自己是“John\
  \ Smith”，他们可能会要求你出示执照。如果你交出一张写着“Susan Jones”的执照，无论那张执照有多真实，它对识别你的身份都没有帮助。同样，如果你正在访问一个名为\
  \ `www.example.org` 的网站，而该站点提供的证书通用名称（common name）为 `www.badguy.com`，通常情况下你应该拒绝它。遺憾的是，这并不总是那么简单。\n\
  \n如果你访问 `example.org`，它提供了一个显示为 `www.example.org` 的证书，你应该接受该证书吗？大多数人会认为 `example.org`\
  \ 和 [`www.example.org`](http://www.example.org) 指向同一个服务器（这可能是真的，也可能不是），但证书使用的是简单的字符串匹配。如果字符串不匹配，证书就是无效的。某些服务器会提供主题如\
  \ `*.example.org` 的通配符证书，iOS 会接受这种证书，但在某些情况下，它会因为你认为它应该接受的名称不匹配而拒绝证书。遗憾的是，iOS 并没有让这种管理变得简单，但是可以实现的。\n\
  \n在这个示例中，你正尝试连接到 IP 地址 72.14.204.113，它是 `encrypted.google.com`。你收到的证书是 `*.google.com`，这是不匹配的。字符串\
  \ `72.14.204.113`并不并不字符串 `.google.com`。你决定接受任何主题中包含 `google.com` 的受信任证书。要编译此示例，你需要在项目中链接\
  \ `Security.framework`。\n\n### ConnectionViewController.m (Connection)\n\n```objc\n\
  - (void)connection:(NSURLConnection *)connection\n  willSendRequestForAuthenticationChallenge:\n\
  \  (NSURLAuthenticationChallenge *)challenge\n{\n  NSURLProtectionSpace *protSpace\
  \ = challenge.protectionSpace;\n  SecTrustRef trust = protSpace.serverTrust;\n \
  \ SecTrustResultType result = kSecTrustResultFatalTrustFailure;\n  OSStatus status\
  \ = SecTrustEvaluate(trust, &result);\n  if (status == errSecSuccess &&\n      result\
  \ == kSecTrustResultRecoverableTrustFailure) {\n      SecCertificateRef cert = SecTrustGetCertificateAtIndex(trust,\n\
  \                                                                          0);\n\
  \      CFStringRef subject = SecCertificateCopySubjectSummary(cert);\n      NSLog(@”Trying\
  \ to access %@. Got %@.”, protSpace.host,\n          (__bridge id)subject);\n  \
  \    CFRange range = CFStringFind(subject, CFSTR(\".google.com\"),\n           \
  \                        kCFCompareAnchored|\n                                 \
  \  kCFCompareBackwards);\n      if (range.location != kCFNotFound) {\n        status\
  \ = RNSecTrustEvaluateAsX509(trust, &result);\n      }\n      CFRelease(subject);\n\
  \  }\n  if (status == errSecSuccess) {\n    switch (result) {\n      case kSecTrustResultInvalid:\n\
  \      case kSecTrustResultDeny:\n      case kSecTrustResultFatalTrustFailure:\n\
  \      case kSecTrustResultOtherError:\n      // 我们已经尝试了所有：\n      case kSecTrustResultRecoverableTrustFailure:\
  \  \n        NSLog(@”Failing due to result: %lu”, result);\n        [challenge.sender\
  \ cancelChallenge];\n        break;\n      case kSecTrustResultProceed:\n      case\
  \ kSecTrustResultConfirm:\n      case kSecTrustResultUnspecified:\n        NSLog(@”Success\
  \ with result: %lu”, result);\n        NSURLCredential *cred;\n        cred = [NSURLCredential\
  \ credentialForTrust:trust];\n        [challenge.sender useCredential:cred forChallenge];\n\
  \        break;\n      default:\n        NSAssert(NO, @”Unexpected from trust:%d”,\
  \ result);\n        break;\n    }\n  } else {\n    // 出现了一些问题\n    NSLog(@”Complete\
  \ failure with code: %lu”, status);\n    [challenge.sender cancelChallenge];\n \
  \ }\n}\n```\n\n在这个例程中，你接收到了一个挑战对象并从中提取信任对象。你评估了信任对象（`SecTrust`）并收到了一个可恢复的失败。你获取主题并判断它是否“足够接近”（在本例中，检查它是否包含\
  \ `.google.com`）。如果你接受传递给你的名称，你会将证书作为简单的 X.509 证书重新评估，而不是 SSL 握手的一部分（也就是说，你在评估时忽略了主机名）。这是通过自定义函数\
  \ `RNSecTrustEvaluateAsX509` 完成的。\n\n```objc\nstatic OSStatus RNSecTrustEvaluateAsX509(SecTrustRef\
  \ trust,\n                                        SecTrustResultType *result)\n\
  {\n  OSStatus status = errSecSuccess;\n  SecPolicyRef policy = SecPolicyCreateBasicX509();\n\
  \  SecTrustRef newTrust;\n  CFIndex numberOfCerts = SecTrustGetCertificateCount(trust);\n\
  \  CFMutableArrayRef certs;\n  certs = CFArrayCreateMutable(NULL,\n            \
  \                 numberOfCerts,\n                             &kCFTypeArrayCallBacks);\n\
  \  for (NSUInteger index = 0; index < numberOfCerts; ++index) {\n    SecCertificateRef\
  \ cert;\n    cert = SecTrustGetCertificateAtIndex(trust, index);\n    CFArrayAppendValue(certs,\
  \ cert);\n  }\n  status = SecTrustCreateWithCertificates(certs,\n              \
  \                           policy);\n  if (status == errSecSuccess) {\n    SecTrustEvaluate(newTrust,\
  \ &result);\n  }\n  CFRelease(policy);\n  CFRelease(newTrust);\n  CFRelease(certs);\n\
  \  return status;\n}\n```\n\n此函数通过从原始信任对象复制所有证书来创建一个新的信任对象。该信任对象使用更简单的 X.509 策略，它只检查证书的有效性和信任度，而不像原始\
  \ SSL 那样考虑主机名。\n\n证书也可能因为过期而无效。遺憾的是，虽然你可以使用 `SecTrustSetVerifyDate` 使用任何你日期来重新评估证书，但没有简单、公开的方法可以确定证书的有效期。以下私有方法允许你计算出有效范围：\n\
  \n`CFAbsoluteTime SecCertificateNotBefore(SecCertificateRef);`\n\n`CFAbsoluteTime\
  \ SecCertificateNotAfter(SecCertificateRef);`\n\n与所有私有方法一样，这些可能会随时更改，并可能被 Apple\
  \ 拒绝。解析证书的另一种实用方法是使用 `SecCertificateCopyData` 将其导出，然后使用 OpenSSL 再次解析。在 iOS 上构建和使用\
  \ OpenSSL 超出了本书的范围。可以在网上搜索“OpenSSL iOS”以获取如何构建该库的多种解释。\n\n评估信任对象后，最终结果将是一个 `SecTrustResultType`。有几种结果代表“良好”或“可能良好”的证书：\n\
  \n- `kSecTrustResultProceed`——证书有效，且用户已明确接受它。\n- `kSecTrustResultConfirm`——证书有效，你应该询问用户是否接受它。\n\
  - `kSecTrustResultUnspecified`——证书有效，且用户没有明确接受或拒绝它。通常情况下你在这种情况下应该接受它。\n- `kSecTrustResultRecoverableTrustFailure`——证书无效，但在某些可接受的情况下是无效的，例如名称不匹配、过期或缺乏信任（例如自签名证书）。\n\
  \n以下结果表示不应接受证书：\n\n- `kSecTrustResultDeny`——证书有效（或无效），但用户已明确拒绝了它。\n- `kSecTrustResultInvalid`——验证无法完成，很可能是由于你的代码存在\
  \ bug。\n\n\n\n\n\n- `kSecTrustResultFatalTrustFailure`—证书本身存在缺陷或损坏。\n- `kSecTrustResultOtherError`—验证无法完成，可能是因为\
  \ Apple 代码中的一个 bug。你不应该遇到此错误。\n\n## 确定证书信任度\n\n到目前为止，你已经学会了判断一个证书是否有效，但这并不意味着它是受信任的。回到银行识别身份的例子，如果你出示你的金属乐队（Metallica）粉丝俱乐部会员卡，它可能不会被接受作为身份证明。银行没有理由相信你的粉丝俱乐部在确保“你是你所说的那个人”方面做得很好。当应用程序遇到由未知权威签名的证书时，面临的情况也是同样的。\n\
  \n要被信任，证书最终必须由信任对象中锚点证书（anchor certificates）列表中的某个证书签名。锚点证书是系统显式信任的证书。iOS 自带了百多个来自公司和政府机构的证书。其中一些是\
  \ VeriSign 和 DigiTrust 这样的全球性机构；另一些则更本地化，如 QuoVadis 和 Vaestorekisterikeskus。这些机构都经过了复杂的审计过程，并支付了巨额资金进入根证书库，但这并不意味着你的应用程序需要信任它们。\n\
  \n如果你生成了自己的证书，可以将公钥嵌入到应用程序中，并配置你的信任对象仅接受该证书或由该证书签名的证书。这让你对安全性有更大的控制权，并可以节省一些费用。\n\
  \n在此示例中，你创建了一个自签名根证书。\n\n1. 打开“钥匙串访问”（Keychain Access）。\n2. 选择“钥匙串”菜单 → 证书助手 → 创建证书。\n\
  3. 输入你喜欢的任何名称，将标识类型设置为“自签名根”，将证书类型设置为 `SSL Client`，并创建证书。你会收到一个警告，说明这是一个自签名证书。这正是该过程的意图，所以你应该点击“继续”。你新创建的证书将显示“此根证书不受信任”的警告。这也是预期的，因为它不在根钥匙串中。\n\
  4. 回到“钥匙串访问”窗口，选择“登录”钥匙串并选择“证书”类别。\n5. 找到你的证书并将其拖到桌面以导出。此文件仅包含公钥。钥匙串默认不导出私钥。将公钥文件拖入你的\
  \ Xcode 项目。\n\n你可以通过以下方式测试呈现的证书是否由你的证书签名：\n\n```objc\nNSError *error;\nNSString\
  \ *path = [[NSBundle mainBundle] pathForResource:@”MyCert” ofType:@”cer”];\nNSData\
  \ *certData = [NSData dataWithContentsOfFile:path options:0 error:&error];\nSecCertificateRef\
  \ certificate;\ncertificate = SecCertificateCreateWithData(NULL, (__bridge CFDataRef)certData);\n\
  CFArrayRef certs = CFArrayCreate(NULL, (const void**)&certificate, 1, &kCFTypeArrayCallBacks);\n\
  SecTrustSetAnchorCertificates(trust, certs);\nCFRelease(certs);\nCFRelease(certificate);\n\
  ```\n\n你从资源包将证书加载到 `NSData` 中，将其转换为 `SecCertificate`，并将其设置为信任对象的锚点。信任对象现在将只接受传递给\
  \ `SecTrustSetAnchorCertificates` 的证书，并将忽略系统的锚点。如果你想同时接受两者，可以使用 `SecTrustSetAnchorCertificatesOnly`\
  \ 来重新配置信任对象。\n\n使用这些技术，你可以在 `connection:willSendRequestForAuthenticationChallenge:`\
  \ 方法中正确地响应任何证书，并控制你接受或拒绝哪些证书。\n\n## 使用文件保护\n\niOS 提供文件的硬件级加密。被标记为受保护的文件使用设备密钥进行加密，该密钥本身使用用户的密码或\
  \ PIN 码加密。在设备锁定 10 秒后，未加密的设备密钥将从内存中移除。当用户解锁设备时，将再次使用密码或个人识别码（PIN）来解密设备密钥，然后用它解密文件。\n\
  \n该方案中最薄弱的环节是用户的密码。在 iPhone 上，用户几乎只使用 4 位 PIN 码，这只提供了 10,000 种组合（实际中使用的少得多）。2011\
  \ 年 5 月，ElcomSoft Co. Ltd 证明了它可以在 20–40 分钟内暴力破解 4 位 PIN 码。这无法防止取证分析或设备被窃，但可以防止那些只能访问设备几分钟的攻击者。在\
  \ iPad 上，输入真实的密码要方便方便得多，因此安全性与笔记本电脑上的文件加密相似。\n\n对于开发者来说，iOS 加密方案的细节并不关键重要。该方案已经足够有效，让用户对任何持有敏感信息的应用程序都能有此预期。\n\
  \n你可以使用 `NSFileManager` 或 `NSData` 配置你创建的单个文件的保护。下列表显示的选项略有不同。`NSFileManager` 对文件应用字符串属性，而\
  \ `NSData` 在创建时使用数字选项，但含义是相同的。`FileManager` 常量以 `NSFileProtection...` 开头，`NSData`\
  \ 常量以 `NSDataWritingProtection...` 开头。\n\n- `...None`：文件不受保护，可以在任何时间读取或写入。这是默认值。\n\
  - `...Complete`：任何带有此设置的文件在设备锁定 10 秒后将受保护。这是最高级别的保护，也是你通常应该使用的设置。当你的程序在后台运行时，这些文件可能不可用。当设备解锁时，这些文件将处于不受保护状态。\n\
  - `...CompleteUnlessOpen`：带有此设置的文件在设备锁定 10 秒后将受保护，除非它们正处于打开状态。这允许你的程序在后台运行时访问该文件。当文件关闭时，如果设备锁定，它将受到保护。\n\
  - `...CompleteUntilUserAuthentication`：带有此设置的文件在设备启动到用户首次解锁设备之间受保护。从那点起直到设备重启，文件将不受保护。这允许你的应用程序在后台运行时打开现有文件。你可以使用\
  \ `...CompleteUnlessOpen` 创建新文件。这比 `None` 设置要好，但应尽可能避免，因为其提供的保护有限。\n\n要创建一个开启了文件保护的新文件，请将其转换为\
  \ `NSData` 并使用 `writeToFile:options:error:`。这比先创建文件然后使用 `NSFileManager` 设置其属性要好。\n\
  \n```objc\n[data writeToFile:dataPath options:NSDataWritingFileProtectionComplete\
  \ error:&writeError];\n```\n\n要在后台创建受保护的文件，你可以应用 `...CompleteUnlessOpen` 选项，这允许你在设备锁定时只要它是打开的就可以读取。除非你确实在后台，否则通常应避免这样做。实现此目的简单方法如下：\n\
  \n```objc\n[data writeToFile:path options:NSDataWritingFileProtectionComplete error:&error]\
  \ ||\n[data writeToFile:path options:NSDataWritingFileProtectionCompleteUnlessOpen\
  \ error:&error];\n```\n\n如果你使用这种技术，可以在启动时用如下例程升级你的文件保护：\n\n\n\n\n\n```objc\n-(void)upgradeFilesInDirectory:(NSString\
  \ *)dir\n                 error:(NSError **)error {\n  NSFileManager *fm = [NSFileManager\
  \ defaultManager];\n  NSDirectoryEnumerator *dirEnum = [fm enumeratorAtPath:dir];\n\
  \  for (NSString *path in dirEnum) {\n    NSDictionary *attrs = [dirEnum fileAttributes];\n\
  \    if (![[attrs objectForKey: NSFileProtectionKey]\n        isEqual:NSFileProtectionComplete])\
  \ {\n      attrs = [NSDictionary dictionaryWithObject:\n                  NSFileProtectionComplete\
  \ forKey:NSFileProtectionKey];\n      [fm setAttributes:attrs ofItemAtPath:path\
  \ error:error];\n    }\n  }\n}\n```\n\n如果你的应用程序需要知道受保护的数据是否可用，可以使用以下方法之一：\n\n- 在你的应用程序代理（application\
  \ delegate）中实现 `applicationProtectedDataWillBecomeUnavailable:` 和 `applicationProtectedDataDidBecomeAvailable:`\
  \ 方法，\n- 观察通知 `UIApplicationProtectedDataWillBecomeUnavailable` 和 `UIApplicationProtectedDataDidBecomeAvailable`（这些常量缺少传统的\
  \ `Notification` 后缀），\n- 检查 `[[UIApplication sharedApplication] protectedDataAvailable]`。\n\
  \n对于仅限前台应用程序，文件保护非常简单。因为其非常简单且经过了硬件优化，除非你有充分理由不这样做，否则你应该始终保护你的文件。如果你的应用程序在后台运行，你需要更仔细地考虑如何应用文件保护，但你仍然应该确保尽可能地保护所有敏感信息。\n\
  \n## 使用钥匙串 (Keychain)\n\n文件保护旨在保护数据。钥匙串（Keychain）旨在保护秘密。在这种背景下，秘密是指用于访问其他数据的小段数据。最常见的秘密是密码和私钥。\n\
  \n钥匙串由操作系统保护并在设备锁定时进行加密。在实践中，它的工作方式与文件保护非常相似。遗憾的是，Keychain API 并不友好。很多人为 Keychain\
  \ API 编写了封装器，但我推荐使用来自 `GenericKeychain` 示例代码（2010）的 Apple `KeyChainItemWrapper`。在简要介绍底层数据结构后，我将在本节讨论它。\n\
  \n钥匙串中的项被称为 `SecItem`，但存储在 `CFDictionary` 中。并没有 `SecItemRef` 类型。`SecItem` 有五类：通用密码、Internet\
  \ 密码、证书、密钥和标识。在大多数情况下，你想使用通用密码。很多问题源于开发者尝试使用 Internet 密码，这种方式更复杂且收益极小。`KeyChainItemWrapper`\
  \ 只使用通用密码项，这是我喜欢它的原因之一。在 iOS 应用程序中存储私钥和标识非常罕见，本书将不会讨论。仅包含公钥的证书通常应该存储在文件中，而不是钥匙串中。\n\
  \n你最终需要在钥匙串中搜索你需要的项。有很多部分可以搜索，但最好的方法是分配你自己的标识符并搜索该标识。通用密码项包含一个属性 `kSecAttrGeneric`，你可以用它来存储你的标识符。这就是\
  \ `KeyChainItemWrapper` 的工作方式。\n\n钥匙串项具有多个可搜索属性和一个加密值。对于通用密码项，一些较重要的属性包括账户 (`kSecAttrAccount`)、服务\
  \ (`kSecAttrService`) 和标识符 (`kSecAttrGeneric`)。该值通常是密码。\n\n有了这些背景，让我们看看如何使用 `KeychainItemWrapper`。首先，如下代码所示，你通过\
  \ `initWithIdentifier:accessGroup:` 创建它。我将在“与访问组共享数据”章节中讨论访问组，但现在先将其留为 `nil`。\n\n\
  ```objc\n  KeychainItemWrapper *\n  wrapper = [[KeychainItemWrapper alloc]\n   \
  \                           initWithIdentifier:@\"MyKeychainItem\"\n           \
  \                    accessGroup:nil];\n```\n\n现在你可以像操作 `NSDictionary` 一样对 `wrapper`\
  \ 进行读写操作。它会自动与钥匙串同步。`__bridge` 转换允许你在 ARC 环境下将 Core Foundation 常数传递给 Cocoa 方法。\n\
  \n```objc\nid kUsernameKey = (__bridge id)kSecAttrAccount;\n  id kPasswordKey =\
  \ (__bridge id)kSecValueData;\n  NSString *username = [wrapper objectForKey:kUsernameKey];\n\
  \  [wrapper setObject:password forKey:kPasswordKey];\n```\n\n`KeychainItemWrapper`\
  \ 缓存了读取，但不缓存写入。向钥匙串写入开销很大，因此你不应该经常这样做。钥匙串不是存储经常变化的敏感数据的地方。那些应该像“采用文件保护”章节描述的那样写入加密文件。\n\
  \n## 与访问组共享数据\n\niOS 沙箱为应用程序套件带来了巨大的困扰。如果你有多个协作工作的应用程序，没有简单的方法可以在它们之间共享信息。当然，你可以将数据保存到服务器上，但用户仍然需要为每个应用程序输入凭据。\n\
  \niOS 通过访问组提供了解决方案。只要多个应用程序共享同一个访问组，它们就可以共享钥匙串数据。要创建访问组，请在 Xcode 中打开目标。在摘要面板底部启用\
  \ Entitlements（权限声明）。然后如图 11-2 所示添加新的钥匙串访问组。\n\n使用 `KeychainItemWrapper`，你可以通过将标识符传递给\
  \ `initWithIdentifier:accessGroup:` 来使用此访问组。有关此特性的的更多信息，请参阅 Keychain Services 中\
  \ `SecAdd` 的文档 ([http://developer.apple.com/)。\n\n## 使用加密\n\n在大多数情况下，iOS 会为你处理所有的加密需求。它会自动对网络流量的\
  \ HTTPS 进行加解密，并使用文件保护管理加密文件。如果你有证书，`SecKeyEncrypt` 和 `SecKeyDecrypt` 会为你处理非对称（公钥/私钥）加密。\n\
  \n但使用密码的简单对称加密呢？iOS 对此支持良好，但文档有限。可用文档位于 `/usr/include/CommonCrypto`。大部分内容假设你具有某些密码学背景。本节涵盖了成功使用它所需的知识。\n\
  \n## AES 概述\n\n高级加密标准（简称 AES）是一种对称加密算法。给定一个密钥，它可以将明文转换为密文。使用相同的密钥可以将密文转换回明文。它最初名为\
  \ Rijndael，2001 年该算法被美国政府选为其加密标准。\n\n这是一个非常优秀的算法。除非你需要为了与现有系统兼容而使用其他算法，否则你应该始终使用\
  \ AES 进行对称加密。世界上最顶尖的密码学家对其进行了仔细的审查，而且它在 iOS 设备上经过了硬件优化，使其速度极快。\n\n## 使用 PBKDF2 将密码转换为密钥\n\
  \nAES 提供三种密钥长度：128、192 和 256 位。每种长度的算法略有差异。除非你有非常特殊的需求，否则我建议使用 AES-128。它在安全性能之间提供了极佳的平衡，包括时间性能和电池续航性能。\n\
  \n\n\n\n密钥（Key）和密码并不是回事。密钥是一个巨大的数字，用于加密和解密数据。加密系统所有可能的密钥被称为其密钥空间（key space）。密码是人类可以输入的内容。包含空格的长密码有时被称为短语（passphrases），但为了简单起见，无论结构如何，我都统一使用“密码”一词。如果你尝试将密码作为\
  \ `AES` 密钥，将显著减少可用密钥的数量。如果用户使用标准键盘上的 94 个字符选择随机的 16 字符密码，这只会创建一个大约 104 位的密钥空间，大约仅为完整\
  \ `AES` 密钥空间的一千万分之一。真实用户从一个更小的字符集中选择密码。更糟糕的是，如果用户的密码超过了 16 字节（16 个单字节字符或 8 个双字节字符），在使用\
  \ `AES` 128 时，你将丢弃部分内容。\n\n你需要一种方法将密码转换为可用的密钥，使得攻击者尽可能难以搜索所有可能的密码。答案是基于密码的密钥派生函数。具体来说，你将使用\
  \ `PBKDF2`，它由 RSA 实验室的公钥密码标准（`PKCS`）#5 定义。你不需要了解 `PBKDF2` 或 `PKCS` #5 的内部原理，但了解这些名称非常重要，因为它们会出现在文档中。重要的是\
  \ `PBKDF2` 能将密码转换为密钥。\n\n### PBKDF2\n要使用 `PBKDF2`，你需要生成一个盐（salt），它只是一个很大的随机数。标准建议至少使用\
  \ 64 位。盐与密码结合，以防止相同的密码生成相同的密钥。然后，你按照特定的次数迭代 `PBKDF2` 函数，产生的数据即为你的密钥。要解密数据，你需要保留盐和迭代次数。通常，盐会与加密数据一起保存，而迭代次数是源代码中的一个常量，但你也可以将迭代次数与加密数据一起保存。\n\
  \n这里的一个重要事实是，盐、迭代次数和最终的密文都是公开信息。只有密钥和原始密码是秘密。\n\n### 生成盐\n生成盐非常简单。它只是一个很大的随机数。你可以使用像\
  \ `randomDataOfLength:` 方法来创建它，如下代码所示：\n\nRNCryptManager.m (CryptPic)\n\n```objc\n\
  const NSUInteger kPBKDFSaltSize = 8;\n\n+ (NSData *)randomDataOfLength:(size_t)length\
  \ {\n  NSMutableData *data = [NSMutableData dataWithLength:length];\n  int result\
  \ = SecRandomCopyBytes(kSecRandomDefault,\n                                  length,\n\
  \                                  data.mutableBytes);\n  NSAssert(result == 0,\
  \ @”Unable to generate random bytes: %d”,\n  errno);\n  return data;\n}\n\n...\n\
  \nNSData *salt = [self randomDataOfLength:kPBKDFSaltSize];\n```\n\n### 迭代与安全\n最初，标准要求\
  \ `PBKDF2` 进行 1,000 次迭代，但随着 CPU 的改进，这个数字已经增加了。我建议在 iPhone 4 上使用 10,000 到 100,000\
  \ 次迭代，在现代的 MacBook Pro 上使用 50,000 到 500,000 次迭代。设置大量次数是为了减慢暴力破解攻击。攻击者通常会尝试密码而不是原始的\
  \ `AES` 密钥，因为实际密码的数量要少得多。通过要求 `PBKDF2` 函数迭代 10,000 次，攻击者在 iPhone 4 上每次尝试必须浪费大约 80ms。对于\
  \ 4 位 PIN 码，这将需要 13 分钟的搜索时间，而搜索即使是一个非常简单的密码也需要几个月或几年。对于单个密钥生成来说，额外的 80ms 通常是可以忽略不计的。增加到\
  \ 100,000 次迭代会在 iPhone 上的密钥生成增加近一秒的时间，但如果是在桌面电脑上进行密码猜测，即使密码非常弱，也能提供得好的保护。\n\n`PBKDF2`\
  \ 需要一个伪随机函数（PRF），它只是一个可以生成一长串统计学上随机数字的函数。iOS 上用于此种目的的唯一算法是 `SHA1`，因此你始终为该参数传递 `kCCPRFHmacAlgSHA1`。\n\
  \n幸运的是，使用 `PBKDF2` 比解释它要容易得多。以下方法接受密码字符串和盐数据，并返回一个 `AES` 密钥。\n\nRNCryptManager.m\
  \ (CryptPic)\n\n```objc\n#import <CommonCrypto/CommonKeyDerivation.h>\n\nconst NSUInteger\
  \ kAlgorithmKeySize = kCCKeySizeAES128;\nconst NSUInteger kPBKDFRounds = 10000;\
  \ // ~80ms on an iPhone 4\n+ (NSData *)AESKeyForPassword:(NSString *)password\n\
  salt:(NSData *)salt {\n  NSMutableData *derivedKey = [NSMutableData dataWithLength:kAlgorithmKeySize];\n\
  \  int result = CCKeyDerivationPBDF(kCCPBDF2, // algorithm\n                   \
  \              password.UTF8String, // password\n                              \
  \   password.length, // passwordLength\n                                 salt.bytes,\
  \ // salt\n                                 salt.length, // saltLen\n          \
  \                       kCCPRFHmacAlgSHA1, // PRF\n                            \
  \     kPBKDFRounds, // rounds\n                                 derivedKey.mutableBytes,\
  \ // derivedKey\n                                 derivedKey.length); // derivedKeyLen\n\
  \  NSAssert(result == kCCSuccess, @”Unable to create AES key for password: %d”,\
  \ result);\n  return derivedKey;\n}\n```\n\n### 应用 PKCS7 填充\n`AES` 是一种块密码，意味着它在固定大小的数据块上操作。`AES`\
  \ 每次处理恰好 128 位（16 字节）输入。因为你要加密的数据可能不是 16 字节的倍数，因此可能需要用额外数据填充最后一个块。`PKCS` #7 定义了执行此操作的标准方法，你通常通过传递\
  \ `kCCOptionPKCS7Padding` 选项来请求。\n\n### 选择模式和初始化向量 (IV)\n`AES` 可以以两种模式运行：电子密码本模式\
  \ (ECB) 和密码块链模式 (CBC)。除非你有特殊需求，否则你应该始终使用 CBC，它是 iOS 的默认设置。在这种模式下，每个数据块都会影响下一个块的加密，这极大地提高了整体安全性。\n\
  \n`ECB` 比 `CBC` 快。只有当你加密大量较小的随机数（16 字节或更少）时，`ECB` 才是合理的。一个例子是使用 `AES` 加密密钥。在这种情况下，`ECB`\
  \ 的安全性并不低于 `CBC`。在 iOS 中极少遇到这种情况，所以你应该始终使用 CBC。\n\n第一个块是一个特殊情况，因为没有上一个块。`CBC` 允许你定义一个名为初始化向量（IV）的额外块来开始链。这通常被标记为可选，但你应该始终提供一个。否则，将使用全零块，这会让你的数据容易受到攻击。IV\
  \ 与“通过 PBKDF2 将密码转换为密钥”部分讨论的盐非常相似。它确保了即使使用相同的密钥加密相同的明文，生成的密文也会不同。\n\n盐一样，IV 是一系列随机字节，你会与密文一起保存并在解密时使用。\n\
  \n```objc\niv = [self randomDataOfLength:kAlgorithmIVSize];\n```\n\n### 执行单次加密\n\
  这些就是你需要的理论。iOS 提供了所有的数学函数，所以你可以忽略实现细节。使用 PBKDF2 生成密钥是在 iOS 5 中引入的。\n\n第一个示例是单次加密和解密程序。它们接受\
  \ `NSData` 并返回 `NSData`。它们使用 `CommonCryptor` 中的便利函数 `CCCrypt`。\n\n加密程序接受明文数据和密码，并返回密文数据、IV\
  \ 和盐。\n\n```objc\n#import <CommonCrypto/CommonCryptor.h>\n\nconst CCAlgorithm kAlgorithm\
  \ = kCCAlgorithmAES128;\nconst NSUInteger kAlgorithmKeySize = kCCKeySizeAES128;\n\
  const NSUInteger kAlgorithmBlockSize = kCCBlockSizeAES128;\n```\n\n\n\n\n```objc\n\
  const NSUInteger kAlgorithmIVSize = kCCBlockSizeAES128;\nconst NSUInteger kPBKDFSaltSize\
  \ = 8;\nconst NSUInteger kPBKDFRounds = 10000;  // 在 iPhone 4 上约 80ms\n\n+ (NSData\
  \ *)encryptedDataForData:(NSData *)data\n                        password:(NSString\
  \ *)password\n                               iv:(NSData **)iv\n                \
  \              salt:(NSData **)salt\n                             error:(NSError\
  \ **)error {\n  NSAssert(iv, @\"IV must not be NULL\");\n  NSAssert(salt, @\"salt\
  \ must not be NULL\");\n  *iv = [self randomDataOfLength:kAlgorithmIVSize];\n  *salt\
  \ = [self randomDataOfLength:kPBKDFSaltSize];\n  NSData *key = [self AESKeyForPassword:password\
  \ salt:*salt];\n  size_t outLength;\n  NSMutableData *cipherData = [NSMutableData\
  \ dataWithLength:data.length + kAlgorithmBlockSize];\n  CCCryptorStatus result =\
  \ CCCrypt(kCCEncrypt, // operation\n                                  kAlgorithm,\
  \ // Algorithm\n                                  kCCOptionPKCS7Padding, // options\n\
  \                                  key.bytes, // key\n                         \
  \         key.length, // keylength\n                                  (*iv).bytes,\
  \ // iv\n                                  data.bytes, // dataIn\n             \
  \                     data.length, // dataInLength,\n                          \
  \        cipherData.mutableBytes, // dataOut\n                                 \
  \ cipherData.length, // dataOutAvailable\n                                  &outLength);\
  \ // dataOutMoved\n  if (result == kCCSuccess) {\n    cipherData.length = outLength;\n\
  \  }\n  else {\n    // ... Handle Error ...\n    return nil;\n  }\n  return cipherData;\n\
  }\n```\n\n解密程序接受密文数据、密码、IV 和盐。IV 和盐与加密方法返回的数值相同。\n\n### RNCryptManager.m (CryptPic)\n\
  \n```objc\n+ (NSData *)decryptedDataForData:(NSData *)data\n                   \
  \     password:(NSString *)password\n                               iv:(NSData *)iv\n\
  \                              salt:(NSData *)salt\n                           \
  \  error:(NSError **)error {\n  NSData *key = [self AESKeyForPassword:password salt:salt];\n\
  \  size_t outLength;\n  NSMutableData *decryptedData = [NSMutableData dataWithLength:data.length];\n\
  \  CCCryptorStatus result = CCCrypt(kCCDecrypt, // operation\n                 \
  \                 kAlgorithm, // Algorithm\n                                  kCCOptionPKCS7Padding,\
  \ // options\n                                  key.bytes, // key\n            \
  \                      key.length, // keylength\n                              \
  \    iv.bytes, // iv\n                                  data.bytes, // dataIn\n\
  \                                  data.length, // dataInLength,\n             \
  \                     decryptedData.mutableBytes, // dataOut\n                 \
  \                 decryptedData.length, // dataOutAvailable\n                  \
  \                &outLength); // dataOutMoved\n  if (result == kCCSuccess) {\n \
  \   [decryptedData setLength:outLength];\n  }\n  else {\n    if (result != kCCSuccess)\
  \ {\n      // ... Handle Error ...\n      return nil;\n    }\n  }\n  return decryptedData;\n\
  }\n```\n\n### 提高 CommonCrypto 性能\n\n`CCCrypt` 函数非常直观。它有很多参数，你需要生成密钥，但一旦数据准备就绪，只需调用一次函数即可。然而，正如“执行一次性加密”节中所述，`CCCrypt`\
  \ 需要足够的内存来存放两份明文。\n\n你可以通过重用 `CCCrypt` 中的缓冲区来节省一半内存。只要缓冲区的大小与密文相当，`dataIn` 和 `dataOut`\
  \ 参数就可以指向同一个缓冲区。对于 AES 来说，其大小为明文长度加上一个 16 字节的块。\n\n这仍然要求所有明文同时存在于内存中。对于大文件，特别是在移动设备上，这的成本可能很高。它还阻止了你在从网络读取数据时进行解密。这在你想要将数据存储在不可信的服务器上时特别有用。HTTPS\
  \ 在网络上保护了数据，但如果你不信任服务器，这并没有帮助。最简单的方法是在设备本地使用文件保护，并使用 AES 对远程文件进行保护。\n\n`CCCrypt`\
  \ 只是围绕普通 CommonCrypto 例程封装的便利函数：`CCCryptorCreate`、`CCCryptorUpdate` 和 `CCCryptorFinal`。在示例中，你使用这些方法配合\
  \ `NSStream` 对象处理加密和解密。完整的源代码可以在本章节的 `CryptPic` 示例代码中找到。\n\n该程序根据 `operation` 参数（`kCCEncrypt`\
  \ 或 `kCCDecrypt`）处理加密或解密。首先，它在流的读取或写入 IV 和盐。`_CMData` 方法是处理 `NSStream` 的辅助方法。它们在示例代码可用。\n\
  \nRNCryptManager.m (CryptPic)\n\n```objc\nswitch (operation) {\n  case kCCEncrypt:\n\
  \    // 为此文件生成随机 IV。\n    iv = [self randomDataOfLength:kAlgorithmIVSize];\n   \
  \ salt = [self randomDataOfLength:kPBKDFSaltSize];\n    if (![outStream write:iv\
  \ error:error] || ![outStream write:salt error:error]) {\n      return NO;\n   \
  \ }\n    break;\n  case kCCDecrypt:\n    // 从文件中读取 IV 和盐\n    if (![inStream getData:&iv\
  \ maxLength:kAlgorithmIVSize error:error] || ![inStream getData:&salt maxLength:kPBDFSaltSize\
  \ error:error]) {\n      return NO;\n    }\n    break;\n  default:\n    NSAssert(NO,\
  \ @\"Unknown operation: %d\", operation);\n    break;\n}\n```\n\n接下来，它根据密码生成密钥并创建\
  \ `CCCryptor` 对象。这是执行加密或解密的对象。\n\n```objc\nNSData *key = [self AESKeyForPassword:password\
  \ salt:salt];\n// 创建加密器\nCCCryptorRef cryptor = NULL;\nCCCryptorStatus result;\n\
  result = CCCryptorCreate(operation, // operation\n                         kAlgorithm,\
  \ // algorithm\n                         kptionPKCS7Padding, // options\n      \
  \                   key.bytes, // key\n                         key.length, // keylength\n\
  \                         iv.bytes, // IV\n                         &cryptor); //\
  \ OUT cryptor\n```\n\n接下来，它分配了一些缓冲区供使用。根据文档，你本应该能够使用单个缓冲区来管理明文和密文，但 `CCCryptorUpdate`\
  \ 中存在一个 bug (radar://993055)。如果你使用填充并多次调用 `CCCryptorUpdate`，则无法进行“原地”加密。在这种情况下这不是一个主要问题，因为缓冲区很小。\n\
  \n`CCCryptorGetOutputLength` 返回处理请求字节数所需的缓冲区大小，包括最终块可能需要的任何额外数据。你也可以使用 `kMaxReadSize\
  \ + kAlgorithmBlockSize`，它们始终大于或等于 `CCCryptorGetOutputLength` 的结果。在这里多分配一些内存并没有问题。使用\
  \ `NSMutableData` 而不是 `malloc` 可以让 ARC 在发生错误时也能帮你管理内存。\n\n```objc\ndstBufferSize\
  \ = CCCryptorGetOutputLength(cryptor, // cryptor\n                             \
  \           kMaxReadSize, // input length\n                                    \
  \    true); // final\n\nNSMutableData *dstData = [NSMutableData dataWithLength:dstBufferSize];\n\
  NSMutableData *srcData = [NSMutableData dataWithLength:kMaxReadSize];\nuint8_t *srcBytes\
  \ = srcData.mutableBytes;\nuint8_t *dstBytes = dstData.mutableBytes;\n```\n\n\n\n\
  \n现在例程读取数据块，对其进行加密或解密，并将其写入输出流。`processResult:bytes:length:toStream:error:` 仅检查结果并以简化错误处理的方式处理文件写入。重要的调用是\
  \ `CCCryptorUpdate`。它从 `srcBytes` 读取数据并写入 `dstBytes`。它会根据写入的字节数来更新 `dstLength`。\n\
  \n```c\n  ssize_t srcLength;\n  size_t dstLength = 0; own  while ((srcLength = [inStream\
  \ read:srcBytes maxLength:kMaxReadSize]) > 0 ) {\n    result = CCCryptorUpdate(cryptor,\
  \      // cryptor\n                            srcBytes,      // dataIn\n      \
  \                      srcLength,     // dataInLength own\n                    \
  \        dstBytes,      // dataOut\n                            dstBufferSize, //\
  \ dataOutAvailable\n                            &dstLength);   // dataOutMoved\n\
  \    if (![self processResult:result\n                          bytes:dstBytes\n\
  \                          length:dstLength\n                          toStream:outStream\n\
  \                          error:error]) {\n      CCCryptorRelease(cryptor);\n \
  \     return NO;\n    }\n  }\n```\n\n当你读取完整个文件（`srcLength == 0`）时，`CCCryptor` 中可能仍有一些未处理的数据。`CCCryptorUpdate`\
  \ 仅以块大小为单位处理数据（AES 为 16 字节）。如果启用了填充（padding），你需要调用 `CCCryptorFinal` 来处理所有剩余数据。如果你没有启用填充，则可以跳过此步，但通常没有必要为了避免而编写特殊的代码。\n\
  \n```c\n  result = CCCryptorFinal(cryptor,      // cryptor\n                   \
  \       dstBytes,      // dataOut\n                          dstBufferSize,  //\
  \ dataOutAvailable\n                          &dstLength);   // dataOutMoved\nif\
  \ (![self processResult:result\n              bytes:dstBytes\n              length:dstLength\n\
  \              toStream:outStream\n              error:error]) {\n    CCCryptorRelease(cryptor);\n\
  \    return NO;\n  }\n  CCCryptorRelease(cryptor);\n  return YES;\n```\n\n注意对 `CCCryptorRelease`\
  \ 的调用。与其他 `Release` 函数不同，它会立即释放内存。`CCCryptorRelease` 还会用零覆盖内存，这对于敏感结构来说是一种良好的做法。`CCCryptorRelease`\
  \ 用零覆盖内存的事实并未 `CommonCrypt.h` 中进行记录，但可以在源代码中验证。`CommonCrypto` 是开源的，源代码可以从 [opensource.apple.com](https://opensource.apple.com/)\
  \ 获取。请查看 OS 树，而不是 iOS 树。你可以使用此例程从任何 `NSStream` 进行加密和解密，它可以处理文件路径、URL 或 `NSData`。你通常会将其封装在如下的方法中：\n\
  \n```objc\n+ (BOOL)encryptFromStream:(NSInputStream *)fromStream\n             \
  \  toStream:(NSOutputStream *)toStream\n                password:(NSString *)password\n\
  \                   error:(NSError **)error {\n  return [self applyOperation:kCCEncrypt\n\
  \                          fromStream:fromStream\n                            toStream:toStream\n\
  \                            password:password\n                             error:error];\n\
  }\n```\n\n然后你可以像这样使用它直接将 `NSData` 加密到磁盘。CCryptController.m (CryptPic)\n\n```objc\n\
  \  NSInputStream *pictureStream = [NSInputStream inputStreamWithData:data];\n  [pictureStream\
  \ open];\n  NSOutputStream *outputStream = [NSOutputStream outputStreamToFileAtPath:encryptedPath\
  \ append:NO];\n  [outputStream open];\n  BOOL result = [RNCryptManager encryptFromStream:pictureStream\
  \ toStream:outputStream\n```\n\n### 结合加密与压缩\n\niOS 提供了丰富的框架集合以尽可能简化操作。本章向你展示了如何正确验证证书。每年都会出一个新版本的\
  \ SDK，并伴随着至少两个或三个新设备的更新，这些新设备通常配备了额外的传感器。GPS 传感器在 iPhone 3G 上首次，磁力计——一种用于显示磁北方向的传感器（通常称为指南针）在\
  \ iPhone 3GS 上推出，而陀螺仪（用于栩如的游戏体验）在 iPhone 4 上推出。iPad 随后推出。摘要\n\n### 进阶阅读\n\nApple\
  \ 文档\n\n以下文档可以在 [developer.apple.com](https://developer.apple.com/) 或通过 Xcode 文档获取：\n\
  \n《Certificate, Key, and Trust Services Programming Guide》\n\n《iOS Application Programming\
  \ Guide, “The Application Runtime”》\n\n《Secure Coding Guide (`/usr/lib/CommonCrypto`)》\n\
  \nWWDC 会议\n\n以下会议视频可在 [developer.apple.com](https://developer.apple.com/) 获得：\n\n\
  WWDC 2010, “Session 204: Creating Secure Applications”\n\nWWDC 2011, “Session 208:\
  \ Securing iOS Applications”\n\n其他资源\n\nAleph One, Phrack vol. 7, issue 49, “Smashing\
  \ The Stack For Fun And Profit,” 1996. 十年后，这仍然是缓冲区溢出最好的介绍之一，并带有示例。[www.phrack.org/issues.html?issue=49&id=14](https://www.phrack.org/issues.html?issue=49&id=14)\n\
  \n### 第 12 章：在多个 iPlatform 和 iDevice 上运行\n\niOS SDK 于 2008 年 2 月向公众发布。当时只有两个设备使用它：iPhone\
  \ 和 iPod touch。自此以后，Apple 一直积极创新，并在 2010 年为该家族引入了另一个更大的兄弟 iPad。2010 年，另一另一个运行 iOS\
  \ 的新设备推出：Apple TV。谁知道未来会发生什么——Apple 甚至可能为 Apple TV 开发发布 SDK，并可能允许通过 iPhone 或 iPod\
  \ touch 控制在 Apple TV 上运行游戏。\n\n\n\n同样，每个版本的 SDK 都带了强大的新功能：例如在 iOS 3 中支持应用内购买、推送通知服务、Core\
  \ Data 和 MapKit；在 iOS 4 中支持多任务处理、blocks 和 Grand 中央调度（GCD）；在 iOS 5 中引入了 iCloud、Twitter\
  \ 集成和 Storyboards，等等。当你使用这些功能之一时，你可能希望为运行旧版本操作系统的用户提供后兼容性。然而，请记住，如果你在使用新版本 SDK 中才有的功能，你必须忘记旧用户（这并不是个好主意），要么编写能够同时适应这两类用户的代码（通过为旧版用户提供等效功能，或者提示他们如果运行较新版本则可以使用额外功能）。\n\
  \n作为开发者，你应该知道如何编写能够轻松适应任何设备（已知或未知）和平台的代码。为此，依赖 `Cocoa` 框架的 API 来检测能力，比编写假设某个传感器存在于特定硬件上的代码要容易得多。简而言之，开发者应该避免根据设备模型字符串对硬件能力做出假设。\n\
  \n本章将介绍一些策略，帮助你利用 `Cocoa` 框架提供的各种 API 编写能够轻松适应多个平台和设备的代码。在本章中，你将为 `UIDevice` 类编写一个分类扩展（category\
  \ extension），并添加检查框架未直接暴露的功能的方法。\n\n### 为多个平台开发\n\niOS 在 2.0 版本发布了公共 SDK，而 5.0 版本是面向开发者的第四个迭代。iOS\
  \ 优于竞争平台的一个重要优势是，用户不需要等待运营商“批准”他们的操作系统更新，而且由于更新是免费的，大多数用户（超过 75%）会在一个月内获得最新的可用操作系统。作为\
  \ iOS 开发者，通常只支持最后两个版本的 SDK 是可以接受的。也就是说，在 2010 年底和 2011 年初，支持 iOS 4 和 iOS 3 就足够了；而现在，在\
  \ 2011 年底至 2012 年初，支持 iOS 5 和 iOS 4 应该就足够。这让开发者的工作变得更轻松。\n\n## 可配置的目标设置：基础 SDK 对比部署目标\n\
  \n为了自定义你的应用可以使用的所有功能，以及应用可以运行的所有设备和操作系统版本，Xcode 为你构建的目标提供了两个可配置设置。第一个是你的基础 SDK（Base\
  \ SDK）设置，第二个是 iOS 部署目标（iOS Deployment Target）。\n\n### 配置基础 SDK 设置\n\n第一个可配置设置称为\
  \ Base SDK。你可以通过编辑目标来配置此设置。请按照以下步骤操作：\n\n1. 打开你的项目，并在项目导航器中选择项目文件。\n2. 在编辑器面板中，选择目标（target）并选择\
  \ Build Settings（构建设置）选项卡。Base SDK 设置通常是此面板中的第三个选项，但在该面板中查找设置最简单的方法是在搜索栏中进行搜索。\n\
  \n你可以将值更改为“Latest iOS SDK”或开发机器上安装的任何版本的 SDK。Base SDK 设置会指示编译器使用该版本的 SDK 来编译和构建你的应用，这意味着它直接控制了哪些\
  \ API 对你的应用可用。默认情况下，用 Xcode 创建的新项目始终使用最新的可用 SDK，且 Apple 会处理 API 的弃用。除非你有非常具体的理由这样做，否则请保持此默认值。\n\
  \n### 配置部署目标设置\n\n第二个设置是部署目标（Deployment Target），它规定了运行应用所需的最低操作系统版本。如果你将其设置为特定版本（例如\
  \ 5.0），AppStore App 将自动阻止运行旧版本操作系统的用户下载或安装你的应用。为了迎合更广泛的受众，我建议至少为上一个版本的操作系统提供后兼容性。例如，如果\
  \ iOS 5 是最新版本，你也应该至少支持 iOS 4。你可以在与 Base SDK 设置相同的 Build Settings 选项卡上设置部署目标。\n\n\
  当你使用 iOS 5 SDK 中可用的功能，但仍希望支持旧版本时，你应该将 Base SDK 设置为最新版本，而将部署目标设置为旧版本（例如 iOS 4）。这种情况下，当你的应用在\
  \ iOS 4 设备上运行时，某些功能可能不可用。作为开发者，你有责任让应用能够适应以防止崩溃。\n\n### 支持多个 SDK 的考虑因素：框架、类和方法\n\
  \n在支持多个 SDK 时，有三种情况需要处理：框架、类和方法。在接下来的章节中，你将学习如何让这些情况成为可能。\n\n### 框架可用性\n\n有时新的 SDK\
  \ 可能会增加一个全新的框架，这意味着即使链接了该框架，在旧的操作系统上可能不可用。iOS 4 的一个例子是 `EventKit.framework`。该框架仅适用于\
  \ iOS 4 及以上版本。你有两个选择：要么将部署目标设置为 iOS 4，以便在 iOS 4 及以上版本上运行；要么在运行 iOS 4 及以上版本时检查该框架是否存在。为了避免这种情况，你需要对其进行弱链接（weak-link）。从项目设置打开目标页面，进入\
  \ Build Phases 选项卡并展开第四部分（Link Binary With Libraries）。你会看到当前链接到目标的框架列表。如果你尚未更改设置，所有框架默认设置为\
  \ Required（强制）。点击 Required 下拉框并改为 Optional（可选），这将弱链接框架。\n\n当你弱链接框架时，缺失的符号会自动变成空指针，你可以利用空检查来启用或禁用\
  \ UI 元素。iOS 5 的一个例子是 `Twitter`。当你使用内置的 Twitter 框架发送推文时，你应该将其弱链接并在运行时检查其是否可用。如果不可用，你必须显示自己的\
  \ Tweet UI。\n\n当你链接了一个仅存在较新版本 SDK 的框架，但仍将部署目标指定为旧版本的 SDK 时，应用程序将无法启动并立即崩溃。这将导致你的应用被拒绝。当你收到\
  \ Apple 团队的崩溃报告，称应用在启动时立即崩溃（通常没有崩溃转储），这就是你需要寻找的。\n\n### 类可用性\n\n有时新的 SDK 可能会向现有框架中添加新类。这意味着即使框架被链接，在旧的操作系统上并非所有符号都可用。iOS\
  \ 4 的一个例子是定义在 `UIKit.Framework` 中的 `UILocalNotification` 类。该框架与每个 iOS 应用链接，所以当你使用该类时，应该通过使用\
  \ `NSClassFromString` 方法实例化对象来检查其是否存在。如果它返回 `nil`，则该类在目标设备上不存在。iOS 5 的一个例子是 `UIStepper`\
  \ 控制。\n\n检查类可用性的另一种方法是使用 `class` 方法而不是 `NSClassFromString`，如下所示。\n\n#### 检查 UIStepper\
  \ 控制的可用性\n\n```\nif ([UIStepper class]) {\n  // 创建实例并添加到子视图中\n} else {\n  // 创建等效控件的实例并添加到子视图\n\
  }\n```\n\n要使用 `class` 方法，你应该使用 LLVM Clang 编译器，且部署目标应为 3.1 或更高版本。\n\n\n\n\n\n# 方法可用性\n\
  \n在某些情况下，新 SDK 会向现有类中添加新方法。iOS 4 的一个经典示例是多任务处理支持。`UIDevice` 类有一个名为 `isMultiTaskingAvailable`\
  \ 的方法。下面的代码检查了该类的存在。\n\n## 检查类中是否可用某个方法\n\n```objc\nif ([[UIDevice currentDevice]\
  \ respondsToSelector:@selector(isMultitaskingSupported)]) {\n  if([UIDevice currentDevice].isMultitaskingSupported)\
  \ {\n    // 在此处编写支持多任务处理的代码\n  }\n}\n```\n\n要检查给定类中是否可用某个方法，请使用 `respondsToSelector:`\
  \ 方法。如果它返回 `YES`，你就可以使用所检查的方法。\n\n如果你要检查的方法是一个全局 C 函数，你应该将其等同于 `NULL`，如代码代码所示。\n\
  \n### 检查 C 函数的可用性\n\n```c\nif (CFunction != NULL) {\n  CFunction(a);\n}\n```\n\n\
  你必须显式地将函数名等同 `NULL`。隐式地假设指针为 `nil` 或 `NULL` 是不起作用的。\n\n### 检查框架、类和方法的可用性\n\n虽然记住框架的可用性应该很容易，但要记住每一个类和方法的可用性可能具有挑战。同样困难的是阅读整个\
  \ iOS 文档来学习哪些方法可用，哪些方法不可用。我推荐两种不同的方法来检查框架、类或方法的可用性。\n\n### 开发者文档\n\n检查符号或框架可用性的直接方法是在开发者文档的“Availability（Availability）”部分进行搜索。图\
  \ 12-1 是开发者文档的截图，显示了如何查找多任务可用性。\n\n![9781119961321-fg1201.tif](img/9781119961321-fg1201_fmt.jpeg)\n\
  \n*图 12-1 开发者文档中的多任务可用性*\n\n### iOS 头文件中的宏\n\n检查方法或类可用性的另一种方法是读取头文件。我觉得这比翻阅文档要简单。只需在源代码中\
  \ Command-点击符号，Xcode 就会打开定义该符号的头文件。大多数新添加的方法都有图 12-2 所示的宏装饰之一：\n\n#### 可用性宏\n\n\
  `UIKIT_CLASS_AVAILABLE`\n\n`__OSX_AVAILABLE_STARTING`\n\n`__OSX_AVAILABLE_BUT_DEPRECATED`\n\
  \n![9781119961321-fg1202.tif](img/9781119961321-fg1202_fmt.jpeg)\n\n*图 12-2 头文件中的多任务可用性*\n\
  \n从头文件中检查给定 SDK 版本的类或方法的可用性通常更简单更快速。但并不是所有方法都有这种宏装饰。如果没有，你就必须查看开发者文档。\n\n如果一个方法没有宏装饰，可能意味着该方法在很久以前就被添加到\
  \ SDK 中，如果你目标的是最近的两个 SDK，通常不需要担心。\n\n现在你已经知道如何检查可用性了，让我们关注本章的核心内容：支持设备。在下一节中，我们将使用\
  \ `UIDevice` 的分类来添加属性。\n\n## 检测设备\n\n在过去只有设备（iPod touch）的时代，第一个也是最常见的错误是检查模型名称。这种方法运行了一年。但很快，随着\
  \ iOS 2.2 引入新设备，它变得非常容易出错。\n\n### 检测设备并假设能力\n\n考虑以下片段，它假设设备是 `iPhone`。\n\n#### 错误地检测麦克风\n\
  \n```objc\nif(![[UIDevice currentDevice] isEqualToString:@\"iPhone\"]) {\n  UIAlertView\
  \ *alertView = [[UIAlertView alloc] initWithTitle:@\"Error\"\n                 \
  \              message:@\"Microphone not present\"\n                           \
  \    delegate:self\n                             cancelTitle:@\"Dismiss\"\n    \
  \                         otherButton:nil];\n  [alertView show];\n}\n```\n\n后续代码的第一个优点是它适用于新设备。然而，你应该使用\
  \ `AudioSessionProperty_AudioInputAvailable`。\n\n#### 检查可用性的正确方法\n\n```objc\n- (BOOL)microphoneAvailable\
  \ {\n  AVAudioSession *session = [AVAudioSession sharedInstance];\n  return session.inputIsAvailable;\n\
  }\n```\n\n对于麦克风，你还应该考虑输入设备更改通知。也就是说，当用户插上时，启用 UI 上的录音按钮。\n\n### 检测麦克风是否已插入\n\n```objc\n\
  void audioInputPropertyListener(void* inClientData, AudioSessionPropertyID inID,\
  \ UInt32 inDataSize, const void *inData) {\n  UInt32 isAvailable = *(UInt32*)inData;\n\
  \  BOOL micAvailable = (isAvailable > 0);\n  // 在此处更新你的 UI\n}\n\n- (void)viewDidLoad\
  \ {\n  [super viewDidLoad];\n  AudioSessionAddPropertyListener(\n    kAudioSessionProperty_AudioInputAvailable,\n\
  \    audioInputPropertyListener,\n    nil);\n}\n```\n\n在这里你只需要为 `kAudioSessionProperty_AudioInputAvailable`\
  \ 添加属性监听器，并在回调中检查值。\n\n## 检测摄像头类型\n\niPhone 最初配有单单摄像头，后来在 iPhone 4 中增加了前置摄像头。iPod\
  \ touch 直到第四代才有摄像头。虽然 iPhone 4 有前置摄像头，但 iPad 1（它的大大哥）没有，而较新的 iPad 2 同时具有前置和后置摄像头。这一切意味着你不应该基于设备假设编写代码。实际上，使用\
  \ API 要简单得多。\n\n`UIImagePickerController` 类具有类方法来检测源类型的可用性。\n\n\n\n\n\n```objc\n\
  - (BOOL) cameraAvailable  {\n  return [UIImagePickerController isSourceTypeAvailable:\n\
  UIImagePickerControllerSourceTypeCamera];\n}\n```\n\n### 检查前置摄像头\n\n```objc\n- (BOOL)\
  \ frontCameraAvailable\n{\n#ifdef __IPHONE_4_0\n  return [UIImagePickerController\
  \ isCameraDeviceAvailable:\nUIImagePickerControllerCameraDeviceFront];\n#else\n\
  \  return NO;\n#endif\n}\n```\n\n要检测前置摄像头，你的运行环境应为 iOS 4 及以上版本。枚举值 `UIImagePickerControllerCameraDeviceFront`\
  \ 仅在 iOS 4 及以上版本中可用，因为任何带有前置摄像头的设备（iPhone 4 和 iPad 2）运行的都是 iOS 4 或更高版本。因此，你使用一个宏，如果设备运行的是\
  \ iOS 3 或以下版本，则返回 `NO`。\n\n同样，你还可以检查连接的摄像头是否具有录视频功能。iPhone 3GS 及以上的相机可以录制视频。你可以使用以下代码进行检查。\n\
  \n### 检查具备录视频功能的摄像头\n\n```objc\n- (BOOL) videoCameraAvailable  {\n  UIImagePickerController\
  \ *picker =\n  [[UIImagePickerController alloc] init];\n  // 首先调用之前的方法来检查摄像头是否存在。\n\
  \  if(![self cameraAvailable])  return NO;\n  NSArray *sourceTypes = [UIImagePickerControlleravailableMediaTypesForSourceType:\n\
  UIImagePickerControllerSourceTypeCamera];\n  if (![sourceTypes containsObject:(NSString\
  \ *)kUTTypeMovie]){\n    return NO;\n  }\n  return YES;\n}\n```\n\n此方法列出了给定摄像头的可用媒体类型，并判断其是否包含\
  \ `kUTTypeMovie`。\n\n### 检测照片库是否为空\n\n如果你正在使用摄像头，你几乎总是会使用用户的照片库。在调用 `UIImagePicker`\
  \ 显示用户的相册之前，你应该确保其中有照片。你可以用检查摄像头存在的相同方法进行此检查。只需为源类型传递 `UIImagePickerControllerSourceTypePhotoLibrary`\
  \ 或 `UIImagePickerControllerSourceTypeSavedPhotosAlbum` 即可。\n\n### 检测摄像头闪光灯的存在\n\
  \n到为止，只有 iPhone 4 拥有摄像头闪光灯。在未来几年里，将越来越多的设备具备此功能。使用 `UIImagePickerController` 的类方法可以轻松检查闪光灯的存在：\n\
  \n### 检查摄像头闪光灯\n\n```objc\n- (BOOL) cameraFlashAvailable  {\n#ifdef __IPHONE_4_0\n\
  \  return [UIImagePickerController isFlashAvailableForCameraDevice:\nUIImagePickerControllerCameraDeviceRear];\n\
  #else\n  return NO;\n#endif\n}\n```\n\n### 检测陀螺仪\n\n陀螺仪是 iPhone 4 的一个非常有趣的特性。它允许开发者测量设备物理位置的相对变化。相比之下，加速度计只能测量力。加速度计无法测量扭动动作。使用陀螺仪，游戏开发者可以实现类似于\
  \ Sony PlayStation 3 控制器或 Nintendo Wii 控制器中的 6 轴控制。你可以使用 `CoreMotion.framework`\
  \ 提供的 API 检测陀螺仪的存在。\n\n### 检测陀螺仪存在的代码\n\n```objc\n- (BOOL) gyroscopeAvailable  {\n\
  #ifdef __IPHONE_4_0\n  CMMotionManager *motionManager = [[CMMotionManager alloc]\
  \ init];\n  BOOL gyroAvailable = motionManager.gyroAvailable;\n  return gyroAvailable;\n\
  #else\n  return NO;\n#endif\n}\n```\n\n如果陀螺仪是你应用的核心功能，但目标设备没有陀螺仪，你必须设计备用输入方法，或者可以在你的\
  \ `info.plist` 中的 `UIRequiredDeviceCapablities` 键中指定它们，以防止没有陀螺仪的设备安装该应用。你将在本章后续部分学习更多关于该键的知识。\n\
  \n### 检测指南针或磁力计\n\n可以使用 `CoreLocation.framework` 中的类 `CLLocationManager` 检查指南针的可用性。调用\
  \ `CLLocationManager` 中的 `headingAvailable` 方法，如果它返回 true，你就可以在应用中使用指南针。指南针在基于位置的应用和基于增强现实的应用中更有用。\n\
  \n### 检测 Retina 显示屏\n\n作为 iOS 开发者，你已经知道适配 Retina 显示屏就像为应用中使用的每个资源添加一个 @2x 图像文件一样简单。但在从远程服务器下载图像的情况下，你应该在具有\
  \ Retina 显示的设备上下载分辨率是倍的图像。\n\n这方面的很好的例子是像照片浏览器之类的应用，例如 Flickr 查看器或 Instagram。当你的用户在\
  \ iPhone 4（截至本文编写时唯一具有 Retina 显示的设备）上启动应用时，你应该下载分辨率比非 Retina 显示设备高一倍的图像。有些开发者选择忽略这一点并为所有设备下载高分辨率图像，但这将浪费带宽，而且在\
  \ EDGE 网络下下载速度可能更慢。相反，在确定设备具有 Retina 显示屏后下载高分辨率文件。检查这一点非常简单。\n\n### 具备 Retina 显示能力\n\
  \n```objc\n- (BOOL) retinaDisplayCapable  {\nint scale = 1.0;\n  UIScreen *screen\
  \ = [UIScreen mainScreen];\n  if([screen respondsToSelector:@selector(scale)])\n\
  \    scale = screen.scale;\n  if(scale == 2.0f) return YES;\n  else return NO;\n\
  }\n```\n\n通过这段代码，你查找设备的 `mainScreen` 并检查该设备是否能够显示高分辨率的 Retina 显示图形。这样一来，如果 Apple\
  \ 引入了外部 Retina 显示器（可能是更新的 Apple Cinema Displays），并且允许当前的 iPad 以 Retina 模式投影，你的应用仍然可以正常工作。\n\
  \n### 检测震动能力\n\n到为止，只有 iPhone 具有摄像头震动功能。遗憾的是，没有公开的 API 可以检查设备是否具有震动功能。然而，`Toolbox.framework`\
  \ 拥有方法（如下所示）可以选择性地让 iPhone 震动：\n\n```objc\nAudioServicesPlayAlertSound(kSystemSoundID_Vibrate);\n\
  AudioServicesPlaySystemSound(kSystemSoundID_Vibrate);\n```\n\n第一个方法让 iPhone 震并在\
  \ iPod touch 上播放声音。第二个方法只让 iPhone 震动。对于不支持震动的设备，什么都不会做。如果你正在开发一个通过震动设备来表示危险的游戏，或者一个玩家撞墙时你想震动的迷宫游戏，你应该使用第二个方法。第一个方法用于提醒用户（包含震动和提示音），而第二个仅用于震动。\n\
  \n### 检测远程控制能力\n\niOS 应用可以处理由耳机按钮产生的远程控制事件。要处理这些事件，使用以下方法开始接收：\n\n```objc\n[[UIApplication\
  \ sharedApplication] beginReceivingRemoteControlEvents];\n```\n\n在你的 `firstResponder`\
  \ 中实现以下方法：\n\n```objc\nremoteControlReceivedWithEvent:\n```\n\n当你不再需要这些事件时，务必通过调用关闭：\n\
  \n```objc\n[[UIApplication sharedApplication] endReceivingRemoteControlEvents];\n\
  ```\n\n### 检测通话能力\n\n你可以通过检查是否可以打开 `tel:` 类型的 URL 来检查设备是否可以拨打电话。`UIApplication`\
  \ 类的 `canOpenURL:` 方法非常适合检查设备是否拥有可以处理特定类型 URL 的应用。`tel:` URL 由 iPhone 上的电话应用处理。相同的方法也可以用于检查设备上安装了可以处理给定\
  \ URL 的特定应用。\n\n### 通话能力\n\n```objc\n- (BOOL) canMakePhoneCalls  {\n  return [[UIApplication\
  \ sharedApplication]\n  canOpenURL:[NSURL URLWithString:@”tel://”]];\n}\n```\n\n\
  \n\n\n\n# 关于可用性的说明\n\n在 iPod touch 设备上，开发者应该完全隐藏针对手机特有的功能。例如，如果你正在开发一个从互联网列出电话号码的黄页录应用，请仅在具有拨号功能的设备上显示拨号按钮。不要只是简单地禁用它（因为用户无法通过任何操作来启用它），也不要显示错误提示。曾经出现过这样的情况：在\
  \ iPod touch 上显示“Not an iPhone（不是 iPhone）”错误导致应用审核团队拒绝了该应用。\n\n## 应用内电子邮件和短信\n\n\
  虽然应用内电子邮件和应用内短信在技术上不属于传感器或硬件，但并非所有设备都能发送电子邮件或短信。这包括 iPhone——即使是那些运行 `iOS 4` 及以上版本的\
  \ iPhone 也是。尽管 `MFMessageViewController` 和 `MFMailComposeViewController` 从 `iOS\
  \ 4` 开始就已可用，即使你的应用的最低部署目标设置为 `iOS 4`，你仍然需要知道并理解使用这些类时的常见陷阱。\n\n例如，一个没有配置电子邮件账户的\
  \ iOS 设备无法发送电子邮件，即使它在技术上具备发送能力。短信/MMS 也是如此。没有插入 SIM 卡的 iPhone 无法发送短信。你应该意识到这一点，并在尝试使用此功能之前始终检查其可用性。\n\
  \n检查这种能力很容易的。`MFMessageComposeViewController`（用于应用内短信）和 `MFMailComposeViewController`（用于应用内电子邮件）分别拥有类方法\
  \ `canSendText` 和 `canSendMail` 可以使用。\n\n### 检查多任务处理感知\n\n检查设备是否支持多任务处理非常简单。正如你在本章前面的部分看到的，你必须检查\
  \ `isMultitaskingSupported` 方法是否可用，如下代码所示。如果它返回 `YES`，你就可以编写与多任务相关的代码。否则，你应该记住应用的状态，并在应用重新启动时继续执行。\n\
  \n字体 是否可用多任务处理？\n\n```objc\nif ([[UIDevice currentDevice] respondsToSelector:@selector(isMultitaskingSupported)])\
  \ {\n  if([UIDevice currentDevice].isMultitaskingSupported) {\n    // 在此处编写支持多任务的代码\n\
  \  }\n}\n```\n\n但还有其他。在不支持多任务处理的设备上，你的应用代理（application delegate）将不会接收以下回调：\n\n-\
  \ `applicationDidEnterBackground:`\n- `applicationWillEnterForeground:`\n\n这意味着，你在\
  \ `applicationWillEnterForeground:` 中编写的任何启动代码和初始化序列部分，对于不支持多任务处理的设备，也应该写在 `applicationDidFinishLaunchingWithOptions:`\
  \ 中。\n\n同样，你在 `applicationDidEnterBackground:` 中编写的销毁代码（包括你 Core Data 管理的的文的保存方法）也应该写在\
  \ `applicationWillTerminate:` 中。\n\n## 获取 UIDevice+Additions 分类\n\n你在本章到为止看到的代码片段可以作为\
  \ `UIDevice` 分类扩展可用。你可以从书的网站下载它。\n\n它只包含两个文件：`UIDevice+Additions.h` 和 `UIDevice+Additions.m`。你必须链接必要的框架以避免那些恼人的链接器错误（linker\
  \ errors），因为该类链接到了各种 Apple 库框架。但不用担心；它们是动态加载的，所以不会增加应用的体积。\n\n## UIRequiredDeviceCapabilities\n\
  \n到为止，你已经学习了如何有条件地检查设备的特定能力，并在其存在时使用它们。在某些情况下，你的应用完全依赖于特定硬件的存在，如果没有该硬件，你的应用将无法使用。例如像\
  \ Instagram 或 Camera+ 这样的相机应用。如果没有相机，应用的核心功能将无法工作。在这种情况下，你不仅需要检查设备能力和隐藏应用的特定部分。你通常不需要让没有相机的设备使用或下载你的应用。\n\
  \nApple 提供了一种方法，通过 Info plist 文件中的 `UIRequiredDeviceCapities` 键来确保这一点。该键支持以下值：`telephony`、`wifi`、`sms`（注：原文此处拼写错误为\
  \ Capities，翻译保留原意或修正为能力）。\n\n\n\n\n\n阅读本章后，你对什么是本地化以及如何处理它有了深入理解。即使你还没有准备好对应用程序进行本地化，本章也提供了简单的步骤，以便以后极大简化本地化工作。你将学习如何本地化字符串、数字、日期和\
  \ nib 文件，以及如何定期审计项目以确保其保持可本地化。\n\n### 什么是本地化？\n\n本地化不仅仅是翻译字符串。本地化意味着让你的应用程序符合目标观众的文化。iOS\
  \ 要求为每种语言单独本地化 nib 文件，而不是提供像 Adobe 的 Adam and Eve 那样的自动布局框架。这通常是有意为之。自动布局往往会创建所有语言中看起来平平的布局。Apple\
  \ 希望你的布局在所有语言中看起来都是完美的，这意味着要手动单独进行布局，而不是通过算法。俄语和德语比英语大得多。中文较小但密度更高。阿拉伯语和希伯来语是从右向左的。不同的语言需要不同的布局才能达到最佳。\n\
  \n尽管如此，你可以采取很多措施来让 iOS 本地变得简单。\n\n*   **保持 nib 文件简单。** 这在 iOS 上并不困难，因为在 nib 中可以做的复杂操作没有在\
  \ Mac 上那么多。但请记住，你建立的每一个 `IBOutlet` 和 `IBAction` 连接都必须在每个本地化的 nib 文件中创建。\n*   **将需要本地化的\
  \ nib 文件与不需要的隔离开。** 许多 iOS nib 文件中完全没有字符串或本地化图像。你不需要本地化这些文件。如果你只需要一个本地化的标题，请将其设为\
  \ `IBOutlet` 并在运行时设置本地化值，而不是本地化 nib 文件。字符串本地化比 nib 文件本地化容易维护得多。\n*   **记住从右向左的语言。**\
  \ 这是后期最难修复的问题之一，特别是当你有自定义文本视图时。\n*   **不要假设逗号是千分位分隔符或点号是小数点。** 这些在不同语言中不同，因此请使用\
  \ `NSLocale` 构建你的正则表达式。\n*   **字形（绘制的符号）和字符并不总是是一一对应的。** 如果你正在进行自定义文本布局，这可能会特别令人惊讶。Apple\
  \ 的框架通常能很好地处理这一点，但当系统（如 `Core Text`）强制你计算字符串中的字形数量而不是使用 `length` 时，不要尝试绕过它们。这个问题在泰语中特别常见，但也存在于许多语言中（甚至偶尔出现在英语中，正如我将在\
  \ 18 章讨论的）。\n\n根据我的经验，最好的做法是在发布前完成所有开发然后进行翻译，而不是尝试边做边翻译。本地化的成本最好在开发过程中的固定点吸收，通常是在最后。每当你调整\
  \ UI 时就重新翻译是非常昂贵的。\n\n虽然翻译最好在接近发布时完成，但你应该在开发周期的较早阶段安排本地化提供商，并在整个过程中为本地化做好准备。一个良好的本地化提供商不仅仅是翻译你发送它的一堆字符串。理想情况下，你的本地化提供商将提供测试服务，以确保你的应用程序在目标文化中“说得通”。在过程中早期让提供商参与，如果界面难以本地化，可以避免后期昂贵的返工。\n\
  \n“难以本地化”的应用程序的一个例子是包含大块文本的程序。翻译大块文本会破坏布局，特别是在 iPhone 上。记住你通常需要按字支付翻译费用，这可能帮助你关注减少所使用的词汇量。重新设计你的\
  \ UI，使其不需要大量文本就能让用户知道做什么。尽可能依靠 Apple 的 UI 元素和图标。Apple 已经为你完成了艰巨且昂贵的工作，使其符合国际标准。不要浪费这些成果。例如，在使用\
  \ `UIToolBarItem` 时，在适当的情况下你应该使用系统项目，而不是绘制自己的图标。如果图标的含义符合你的意图，你应该始终尝试使用系统图标，即使你认为自己创建一个更好的。在我看来，“操作”图标（一个从盒子里射出的箭头）是不可理解的，但用户已经习惯了。Apple\
  \ 训练了他们对其含义的认知，所以你应该使用它。然而，永远不要将系统图标用于其预期含义之外的事。例如，不要使用 `UIBarButtonSystemItemReply`\
  \ 表示“向左移动”或“返回”。\n\n另一个常见的本地化问题是假设了文化背景的图标，例如用装饰过的树来表示“冬季”。勾选也可能引起问题，因为它们在所有文化中都不被使用（例如法语），在某些文化中，勾选意味着“错误”（例如芬兰语）。在制作最终艺术品之前引入良好的本地化提供商，可以节省大量的重新创建资源费用。\n\
  \n## 本地化字符串\n\n本地化字符串最常用的工具是 `NSLocalizedString`。该函数在 `Localizeable.strings` 中查找给定的键，并返回找到的值；如果未找到值，则返回键本身。`Localizeable.strings`\
  \ 是一个本地化文件，因此每个语言都有不同的版本，`NSLocalizedString` 会根据当前的区域语言自动选择正确的一个。一个名为 `genstrings`\
  \ 的命令行工具会自动搜索你的文件中对 `NSLocalizedString` 的调用，并为你编写初始的 `Localizeable.strings` 文件。\n\
  \n最简单的方法是使用字符串本身作为键（第二个参数是给本地化者的注释）：\n\n```\nNSString *string =\n    NSLocalizedString(@”Welcome\
  \ to the show.”,\n                      @\"message\");\n```\n\n要运行 `genstrings`，你应该打开终端，切换到源代码目录，并按所示运行它（假设是英语）：\n\
  \n```bash\ngenstrings -o en.lproj *.m own\n```\n\n这将创建一个名为 `en.lproj/Localizeable.strings`\
  \ 的文件，内容如下：\n\n```\n/* message */\n“Welcome to the show.” = “Welcome to the show.”;\n\
  ```\n\n即使你不运行 `genstrings`，这在开发者的语言中也是有效的，因为它会自动将键作为字符串返回。在大多数情况下，我建议在准备交给本地化者时使用字符串本身作为键并生成\
  \ `Localizeable.strings` 文件。这种方法简化了开发，并有助于防止 `Localizeable.strings` 文件积累不再使用的键。\n\
  \n### 审计未本地化的字符串\n\n在开发期间，你应该定期审计你的程序，以确保你正确地使用了 `NSLocalizedString`。我推荐像这样的脚本：\n\
  \n```perl\n#!/usr/bin/perl\n# 用法:\n# find_nonlocalized <directory> ...\n# 扫描 .m\
  \ 和 .mm 文件，寻找可能未本地化\n# 但应该本地化的字符串。\n# 标记为 DNL (Do Not Localize) 的行将被忽略。\n# 这种形式的字符串常量赋值如果值中没有空格则将被忽略：\n\
  # NSString * const <...> = @”...”;\n# 与 NSLocalizedString 在同一行的字符串将被忽略。\n# 某些接收未本地化参数的常用方法将被忽略\n\
  # URL 将被忽略\n# 如果发现字符串，则以 1 退出\nuse File::Basename;\nuse File::Find;\nuse strict;\n\
  # 要忽略的任何文件的文件名\nmy @EXCLUDE_FILAMES = qw();\n# 要忽略的正则表达式\nmy @EXCLUDE_REGEXES =\
  \ (\n  qr/\\bDNL\\b/,\n  qr/NSLocalizedString/,\n  qr/NSString\\s*\\*\\s*const\\\
  s[^@]*@”[^ ]*;/,\n  qr/NSLog\\(/,\n  qr/@”http/, qr/@”mailto/, qr/@”ldap/,\n  qr/predicateWithFormat:@”/,\n\
  \  qr/Key(?:[pP]ath)?:@”/,\n  qr/setDateFormat:@”/,\n  qr/NSAssert/,\n);\n```\n\n\
  \n\n\n\n```objc\n    qr/imageNamed:@”/,\n    qr/NibNamed?:@”/,\n    qr/pathForResource:@”/,\n\
  \    qr/fileURLWithPath:@”/,\n    qr/fontWithName:@“/,\n    qr/stringByAppendingPathComponent:@“/,\n\
  );\n```\n\n```perl\nmy $FoundNonLocalized = 0;\nsub find_nonlocalized {\n    return\
  \ unless $File::Find::name =~ /\\.mm?$/;\n    return if grep($_, @EXCLUDE_FILENAMES);\n\
  \    open(FILE, $_);\n    LINE:\n    while (<FILE>) {\n        if (/@“[^“]*[a-z]{3,}/)\
  \ {\n            foreach my $regex (@EXCLUDE_REGEXES) {\n                next LINE\
  \ if $_ =~ $regex;\n            }\n            print „$File::Find::name:$.:$_“;\n\
  \            $FoundNonLocalized = 1;\n        }\n    }\n    close(FILE);\n}\nmy\
  \ @dirs = scalar @ARGV ? @ARGV : („.“);\nfind(\\&find_nonlocalized, @dirs);\nexit\
  \ $FoundNonLocalized ? 1 : 0;\n```\n\n定期在你的源码上运行此脚本，以确保没有非本地化的字符串。如果你使用 `Jenkins`\
  \ (`jenkins-ci.org`) 或其他持续集成工具，你可以将此脚本作为构建过程的一部分，或者将其作为脚本步骤添加到 Xcode 编译构建中。每当它返回一个新字符串时，你都可以决定是修复它、更新正则表达式以忽略它，还是将特定行标记为\
  \ `DNL`（不本地化）。\n\n# 格式化数字和日期\n\n数字和日期在不同的语言/区域中显示方式不同。使用 `NSDateFormatter` 和 `NSNumberFormatter`\
  \ 处理这些问题通常非常直接的，你可能已经熟悉它们了。\n\n要了解 `NSDateFormatter` 和 `NSNumberFormatter` 的介绍，请参\
  \ Apple 文档中 [`developer.apple.com`](http://developer.apple.com/) 的“数据格式化指南”。\n\n\
  然而，有几点需要注意。首先，输入和输出都需要格式化器。大多数开发者会记得为日期输入使用格式化器，但可能会忘记为数字输入使用格式化器。在输入时，小数点并不是通用的用于分隔整数和小数的符号。有些国家使用逗号或撇号。最好使用\
  \ `NSDateFormatter` 来验证数字输入，而不是使用自定义逻辑。\n\n数字的分组方式千奇百怪。有些国家使用空格、逗号或撇号来分隔千位组。中国有时按“万”（四位）进行分组。不要猜测。使用格式化器。记住，这可能会影响字符串的长度。如果你只为十万（“100,000”）预留了七个字符的空间，在印度可能会溢出，因为那里使用的是八位（“1,00,000”或一个\
  \ lakh）。\n\n百分比是另一个你需要小心的地方，因为不同的文化将百分号放在数字的开头或结尾，有些还使用略有不同的符号。使用 `NSNumberFormatterPercentStyle`\
  \ 将正常运行。\n\n对货币要格外小心。不要将货币存储为浮点数（float），因为在二进制和十进制之间转换会导致舍入误差。始终将货币存储为 `NSDecimalNumber`，它在十进制下进行数学运算。跟踪你正在使用的货币。如果你的用户将区域从美国切换到法国，你不应该将他的\
  \ $1 购买切换为 €1。通常情况下，你需要持久化给定值是用什么货币表示的。`RNMoney` 类就是实现此点的示例。首先，以下代码演示了如何使用该类存储卢布和欧元。\n\
  \n### main.m (Money)\n\n```objc\nNSLocale *russiaLocale = [[NSLocale alloc] initWithLocaleIdentifier:@”ru_RU”];\n\
  RNMoney *money = [[RNMoney alloc] initWithIntegerAmount:100];\nNSLog(@”Local display\
  \ of currency: %@”, money);\nNSLog(@”Russian display of currency: %@”, [money localizedForLocale:russiaLocale]);\n\
  RNMoney *euro=[RNMoney alloc] initWithIntegerAmount:0 currencyCode:@”EUR”];\nNSLog(@”Local\
  \ display of Euro: %@”, euro);\nNSLog(@”Russian display of Euro: %@”, [euro localizedForLocale:russiaLocale]);\n\
  ```\n\n`RNMoney` 是一个不可变对象，存储金额和货币代码。如果你不提供货币代码，它将默认为当前区域的货币。它是一个简单的类，设计用于初始化、序列化和格式化。以下是代码。\n\
  \n### RNMoney.h\n\n```objc\n#import <Foundation/h>\n@interface RNMoney : NSObject\
  \ <Coding>\n@property (nonatomic, strong)\nNSDecimalNumber *amount;\n@property (nonatomic,\
  \ strong)\nNSString *currencyCode;\n- (RNMoney)initWithAmount:(NSDecimalNumber *)anAmount\
  \ currency:(NSString *)aCode;\n- (RNMoney)initWithAmount:(NSDecimalNumber *)anAmount;\n\
  - (RNMoney)initWithIntegerAmount:(NSInteger)anAmount currency:(NSString *)aCode;\n\
  - (RNMoney)initWithIntegerAmount:(NSInteger)anAmount;\n- (NSString *)localizedStringForLocale:(NSLocale\
  \ *)aLocale;\n- (NSString *)localizedString;\n@end\n```\n\n### RNMoney.m\n\n```objc\n\
  #import “RNMoney.h”\n@implementation RNMoney\n@synthesize amount=amount_;\n@synthesize\
  \ currencyCode=currencyCode_;\nstatic NSString * const kMoneyAmountKey = @”amount”;\n\
  static NSString * const kMoneyCurrencyCodeKey = @”currencyCode”;\n\n- (RNMoney)initWithAmount:(NSDecimalNumber\
  \ *)anAmount currency:(NSString *)aCode {\n    if ((self = [super init])) {\n  \
  \      amount_ = anAmount;\n        if (aCode == nil) {\n            NSNumberFormatter\
  \ *formatter = [[NSNumberFormatter alloc] init];\n            currencyCode_ = [formatter\
  \ currencyCode];\n        }\n        else {\n            currencyCode_ = aCode;\n\
  \        }\n    }\n    return self;\n}\n\n- (RNMoney)initWithAmount:(NSDecimalNumber\
  \ *)anAmount {\n    return [self initWithAmount:anAmount currencyCode:nil];\n}\n\
  \n- (RNMoney)initWithIntegerAmount:(NSInteger)anAmount currency:(NSString *)aCode\
  \ {\n    return [self initWithAmount:[NSDecimalNumber numberWithInteger:anAmount]\
  \ currencyCode:aCode];\n}\n\n- (RNMoney)initWithIntegerAmount:(NSInteger)anAmount\
  \ {\n    // 原文片段中缺失逻辑\n}\n\n- (id)init {\n    return [self initWithAmount:[NSDecimalNumber\
  \ zero]];\n}\n\n- (id)initWithCoder:(NSCoder *)coder {\n    NSDecimalNumber *amount\
  \ = [coder decodeObject:kMoneyAmountKey];\n    NSString *currencyCode = [coder decodeObject:kMoneyCurrencyCodeKey];\n\
  \    return [self initWithAmount:amount currencyCode:currencyCode];\n}\n\n- (void)encodeWithCoder:(NSCoder\
  \ *)aCoder {\n    [aCoder encodeObject:amount_forKey:kMoneyAmountKey];\n    [aCoder\
  \ encodeObject:currencyCode_forKey:kMoneyCurrencyCodeKey];\n}\n\n- (NSString *)localizedStringForLocale:(NSLocale\
  \ *)aLocale {\n    NSNumberFormatter *formatter = [[NSNumberFormatter alloc] init];\n\
  \    [formatter setLocale:aLocale];\n    [formatter setCurrencyCode:self.currencyCode];\n\
  \    [formatter setNumberStyle:NSNumberFormatterCurrencyStyle];\n    return [formatter\
  \ stringFromNumber:self.amount];\n}\n\n- (NSString *)localizedString {\n    return\
  \ [self localizedStringForLocale:[NSLocale currentLocale]];\n}\n\n- (NSString *)description\
  \ {\n    return [self localizedString];\n}\n@end\n```\n\n# 本地化 Nib 文件\n\n本地化 Nib\
  \ 文件是本地化中最乏且风险最高的部分。考虑以下常见情况：\n\n■ 你的项目有一个 Nib 文件，其中按钮连接到 `doThis:` 方法。\n\n■ 你将\
  \ Nib 文件发送去翻译，并收回了十几个不同的版本。\n\n\n\n\n\n## 更改按钮操作\n\n现在你想将按钮的操作更改为 `doThat:`。你打开了主\
  \ nib 文件（通常是英文的）并进行了修改，但现在你还有另外 11 个错误的 nib 文件版本，而且在有人在另一种语言下点击该按钮导致应用程序崩溃之前，你才发现这个问题。\n\
  \n在那个时候，你可能会开始认为 nib 文件是一个糟糕糟糕主意，并发誓永远再也不用它们了，但这个结论是错误的。Nib 文件非常强大，是 iOS 开发的重要组成部分。只要你学会管理它们的一些最佳实践，它们就值得你费一番心。\n\
  \n## Nib 管理最佳实践\n\n首先，如果没有必要，否则不要对 nib 文件进行本地化。如果没有需要本地化的内容，那么你只需要一份拷贝。如果没有可用的本地化版本，iOS\
  \ 将自动加载你的主 nib 文件。\n\n如果 nib 文件中可本地化的部分不需要更改布局，那么你可能希望使用 `IBOutlet` 并在 `viewDidLoad`\
  \ 中接入本地化值。本地化程序化的字符串比本地化 nib 文件容易得多。这对于处理自动调整大小的 `UINavigationItem` 和 `UITabBarItem`\
  \ 等标题和项目特别有用。对于跨越整个视图的 `UIButton`，你通常可以使用这种技术来处理。\n\n`UILabel` 通常需要单独本地化，因为标签几乎肯定需要调整大小。\n\
  \n不同语言之间的句子结构截然不同。这意味着你几乎无法安全地通过像这样的部分来组合一个字符串：\n\n```objc\nNSString *intro = @”There\
  \ was an error deleting”;\nNSString *num = [NSString stringWithFormat:@”%d”, 5];\n\
  NSString *tail = @”objects.”;\nNSString *str = [NSString stringWithFormat:@”%@ %@\
  \ %@”,\n                 intro, num, tail]; // 错误\n```\n\n这段代码的问题在于，当你将“There was\
  \ an error deleting”和“objects”翻译成其他语言时，你可能无法按照相同的顺序将它们拼接在一起。相反，你需要像这样整体本地化整个字符串：\n\
  \n```objc\nNSString *format = NSLocalizedString(\n    @”There was an error deleting\
  \ %d objects”,\n    @”Error when deleting objects.”);\nNSString *str = [NSString\
  \ stringWithFormat:format, 5];\n```\n\n某些语言的复数形式比英语更复杂。例如，描述两个物体与两个以上物体之间可能有特殊的词形变化。不要假设你可以检查是否大于\
  \ 1 并轻松判断语言学上的复数。解决这个问题可能非常困难，因此请尽量避免。不要编写特殊的代码来尝试在复数末尾添加“s”，因为这几乎是不可能翻译的。优秀的翻译人员会帮助你以更好的方式组织消息表述，使其在你的目标语言中翻译得更好。\n\
  \n尽早与你的本地化提供者交流，了解他们的流程以及如何调整你的开发实践以配合他们的工作。图 13-1 展示了一个很好的方法。\n\n![9781119961321-fg1301.eps](img/9781119961321-fg1301_fmt.jpeg)\n\
  图 13-1 本地化工作\n\n## 本地化工作\n\n1. **伪本地化 (Pseudo-Localize)**——在开发期间，开始进行实验性本地化是一个好主意，可以在过程中尽早发现本地化漏洞。伪本地化是将翻译成无意义语言的过程。一种常见的无意义语言是将所有元音替换为字母\
  \ x。例如，“Press here to continue”将变成“Prxss hxrx tx cxntxnxx”。这种“翻译”可以由开发者完成（通常使用一个简单的\
  \ Perl 脚本），它会让你使用非本地化字符串的地方变得更加明显。这并不会发现所有问题。特别是，它不擅长发现由其他字符串拼接而成的字符串，但在你支付真正的翻译服务之前，它可以发现许多简单问题。你需要为这种本地化选择一个语言代码。选择一个你不打算为应用程序本地化的语言。如果你是美国英语母使用者且不计划为英式英语本地化，那么为了此目的使用英式英语位置特别有用，因为你仍然可以轻松地阅读\
  \ iPhone 的其他界面。\n\n2. **UI 冻结 (UI Freeze)**——开发周期中应该有一个明确的时间点来冻结 UI。从那个点开始，你应该坚决避免任何影响本地化资源的更改。许多团队会在此时发布产品的单语言版本，然后发布本地化更新。如果你的市场对延迟有容忍度，这是最简单的方法。\n\
  \n3. **本地化 (Localize)**——你将资源文件发送给本地化人员，他们将给你返回本地化后的文件。Nib 文件可以在 Xcode 中锁定，以防止更改可本地化、不可本地化或所有属性。在将\
  \ nib 文件发送给本地化人员之前，锁定不可本地化属性，以保护你的 nib 文件不受连接、类名和 nib 文件其他非可见属性更改的影响。\n\n4. **版本控制\
  \ (Version Control)**——当你对 nib 文件更改时，你需要跟踪发送出去的原始文件。锁定 nib 文件中的可本地化属性（解锁不可本地化属性）。然后将这些放入版本控制系统或保存在单独的目录中。\n\
  \n5. **测试 (Testing)**——你需要进行测试以确保一切都是正确的，理想情况下，你会让每种本地化语言的母语者测试所有 UI 元素，以确保它们合理且没有遗留非本地化的字符串。优秀的本地化人员可以为此提供帮助。\n\
  \n6. **a. 合并逻辑 (Merge Logic)**——某些 nib 文件更改不影响本地化。连接或类名的更改不会改变布局。这些是逻辑更改而非本地化（L10N）更改。你可以这样合并本地化的\
  \ nib 文件：\n\n```\nibtool --previous-file ${OLD}/lproj/MyNib.nib \\\n--incremental-file\
  \ ${OLD}/lproj/MyNib.nib \\\n--strings-file ${NEW}/lproj/Localizable.strings \\\n\
  --localize-incremental \\\n--write ${NEW}/lproj/MyNib.nib \\\n${NEW}/lproj/MyNib.nib\n\
  ```\n这计算了新英文 `MyNib.nib` 之间的非本地化更改。然后它将这些更改应用于旧法语 `MyNib.nib`，并将其写入新的法语 nib 文件。只要你跟踪本地化人员发送的原始文件，这种非布局更改的效果非常好，并且很容易编写脚本。\n\
  \n**b. L10N 更改 (L10N Changes)**如果你进行了本地化更改，例如更改 nib 文件的布局或更改字符串，你需要重新开始并将更改发送给本地化人员。你可以重用之前的字符串翻译，这会让费用便宜得多，但仍然是大量工作，因此请避免在开发周期的后期做出这些更改。\n\
  \n\n\n\n\niOS SDK 让许多开发者能够独立谋生，并且有多种业务模型供选择。第一种模型易于理解（可以说是最盈利的）：制作一个 App 并在 App\
  \ Store 上销售。另一种模型是发布两个版本——同一个 App 的免费轻量版（lite version）和专业版（付费版）。还有一种模型（可能由 Web 2.0\
  \ 开创）是基于广告的。开发者使用第三方广告商的 SDK（或 `iAds`）来显示广告，开发者根据展示次数或点击量获得报。虽然这些方法都能增加开发者的收入，但在\
  \ App Store 上销售 App 的第一种模型到目前为止是最成功的模型。应用内购买（App Purchases）提供了另一种在你的 iOS App 上销售高级内容或功能的独特方式。某些\
  \ App 利用了这一点，仅通过应用内购买盈利。它们属于一类被称为“免费增值（freemium）”的 App，并且已经非常成功，至少当你查看美国 App Store\
  \ 的畅销榜时是如此。\n\n本章将向你介绍 Apple 的应用内购买框架 `StoreKit.framework`，然后介绍一个封装框架 `MKStoreKit`。你将学习如何使用它在你的\
  \ App 中集成一个微型的应用内商店。本章还为开发者在 App 中集成 `StoreKit` 时最常遇到的问题解决方案。\n\n### 在开始之前\n\n本章大致分为两个主要部分。前半部分侧重于在\
  \ iTunes Connect 上创建和自定义产品，后半部分处理编程方面。你将使用 `MKStoreKit` 并学习它提供的功能，包括如何为每种允许的业务模型进行自定义。在章节结束时，你将查看开发者面临的最常见问题和困难，以及解决这些问题的方案。在整个章节中，请特别注意阴影框，它们提供了有用的提示和重要的警告。这些框中的信息解释了当你操作错误时，实施过程中可能会出现的问题。让我们开始这段旅行吧。\n\
  \n### 应用内购买产品\n\n通过应用内购买销售的产品大体分为以下四类：内容、功能、服务和订阅。最新的 SDK 支持所有这些类型。Apple 允许四种不同的产品类型，即：消耗性、非消耗性、自动续订订阅和非自动续订订阅。从通用意义上说，消耗性产品在使用后会耗尽的产品。另一方面，非消耗性产品是购买后可以使用任意次数的产品。你的打印机就是一个非消耗性产品的例子，而它使用的墨水是消耗性产品的常见例子。订阅（无论是自动续订还是非自动续订）类似于现实世界中的订阅。你应该根据你的业务模型将以下产品类别与这四种类型匹配。\n\
  \n*   **内容**：归类为内容的产品包括电子书、杂志、额外的关卡包、音乐、铃声和其他各种数据。内容可以根据你的业务模型作为消耗性或非消耗性进行销售。从用户的角度考虑，内容通常被认为是非消耗性的。例如，当用户获得一本书时，作为开发者，你有责任记住他的购买记录，并免费提供给他。在大多数情况下，SDK\
  \ 免费提供此功能。\n*   **功能**：归类为功能的产品主要包括锁定功能。例如，一个任务管理器 App 可以允许用户创建最多 `n` 个任务；要在超过该限制后创建任务，用户必须支付费用解锁。功能几乎总是被认为是非消耗性的。\n\
  *   **服务**：归类为服务的产品大多是会让开发者产生经常性支的功能。服务与功能类非常相似，区别在于它涉及大量的计算能力，并在远程服务器上运行。这的一个经典例子是推送通知。例如，一个\
  \ Twitter 客户端可以将推送通知作为消耗性销售，比如每 1 美元卖 1000 条通知。如果你的业务模型需要，服务也可以是订阅的。\n*   **订阅**：归类为订阅的产品大多是内容或服务。订阅通常是在一段时间内提供上述内容或服务，而不是在购买时提供。例如，一个\
  \ Twitter 客户端可以提供无限推送通知作为订阅，价格为每三个月 99 美分。\n\n将产品视为消耗性、订阅或非消耗性取决于业务所有者。\n\n订阅最初在\
  \ iOS 3.0 中就可用，但使用起来很复杂，而且续订和或将其恢复到其他设备的负担依赖于开发者。因此，采用率很低，很少有开发者使用它。通过 iOS 4.3，Apple\
  \ 引入了一种名为“自动续订订阅”的新类型产品，订阅的恢复和续订会自动发生并由 Apple 负责。从现在起，你应该几乎总是使用自动续订订阅。只有当你的业务已经有了适当的服务器端订阅处理机制且客户已经在使用它时，才使用旧的订阅样式。\n\
  \n### 禁止项目\n\n上一节解释了你可以通过应用内购买销售的产品。虽然 Apple 接受大多数业务模型，但就目前而言，有几种物品是无法通过 App Store\
  \ 销售的。\n\n第一类物品（这可能是最需要记住的一点）是你无法通过应用内购买销售的实体商品和服务。例如，如果你开发了一个壁纸 App，你可以销售数字壁纸，但不能通过应用内购买销售相同的打印质海报。同样，如果你是一个酒店主并制作了一个用于预订的\
  \ App，你不能通过应用内购买收取预订费或订金。\n\n第二类不允许的物品是中间货币。如果你制作一个音乐订阅 App，你必须直接销售音乐。你不能销售“点数”并允许用户用点数下载音乐。订阅券、预付优惠券以及任何在购买时未提供产品的内容都是不允许的。\n\
  \n警告：App Store 上可能已经某些 App 在这样做了。但这并不自动意味着你拥有该权利。你面临着被 Apple 拒绝的风险。如果你看到某个销售规则禁止物品的\
  \ App，很可能是它漏过了 App Store 的审核。此类 App 在随后的每一次产品更新中都可能面临着无法再次获得批准的风险。\n\n在某些情况下，如果法律允许开发者经营彩票业务，则允许进行抽票或抽奖。同样，你只能在拥有法律权利的国家销售此类\
  \ App。在美国 App Store 上拥有一个彩票 App 并不自动意味着你有权在英国 App Store 或澳大利亚 App Store 上销售相同的 App。你可能需要随\
  \ App 一起向 Apple 审核流程提交额外文件。\n\n### 重新思考你的业务模型\n\n你计划通过应用内购买销售的所有物品（尤其是内容）都必须经过 Apple\
  \ 的正式审核流程，该过程通常需要一周，有时甚至更长。在制定业务计划时请记住这一点。\n\n\n\n\n如果你正在开发一个提供高级壁纸下载的 App，你可能无法通过应用内购买（In\
  \ App Purchases）销售“每日壁纸”——至少很难这样做。不过，你可以考虑不同的业务计划，例如如果用户订阅了高级会员，则可以免费下载每日壁纸。另一个建议是至少提前\
  \ 30 天提交你 App 的“每日壁纸”，这样你就可以就可以完全控制它们在正确的日期发布。请确保你的预留时间大于最坏情况下的审核时间。\n\n最后，你提交到\
  \ App Store 的每个产品都需要在 `iTunes Connect` 上进行配置。此配置可能需要几分钟到一小时不等（如果需要复杂的屏幕截图）。如果你销售电子书或壁纸等任何数字内容，从时间上来说，在\
  \ `iTunes Connect` 上配置每个产品可能是不可行的。此外，通过应用内购买向产品添加的库存单位（SKUs）有 5,000 个的限制。在这种情况下，推荐的替代方案是将它们设为消耗性项目（consumable）。\n\
  \n到此时，你应该已经决定将你的应用内产品作为消耗性、非消耗性或订阅项目进行出售。\n\n### 在 iTunes Connect 上设置产品\n\n在你的 App\
  \ 中实现应用内购买，20% 是配置，10% 是为应用选择正确的业务模型，而 70% 是实现。使用 `MKStoreKit`，这 70% 的编码工作将减少到接近于零。然而，新类型产品的加入使得配置变得复杂，规则的变更以及对哪些接受、哪些不接受缺乏适当的文档使得选择正确的业务模型变得困难，因此配置仍然集成过程中中最具挑战性的方面。\n\
  \n本节将引导你完成在 `iTunes Connect` 上设置产品的步骤。我假设你已经注册了 iOS 开发者计划，并拥有登录 iOS 开发者计划门户和 `iTunes\
  \ Connect` 等各种所需的凭据。\n\n在接下来的几页中，我将提到 iOS 开发者计划门户和 `iTunes Connect`。以下链接将会有帮助。这些\
  \ URL 很好记：\n\niOS 开发者计划门户—[`http://developer.apple.com/devcenter/ios/index.action`](http://developer.apple.com/devcenter/ios/index.action)\n\
  \niTunes Connect—[`http://itunesconnect.apple.com`](https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa)\n\
  \n##  1：为你的 App 创建新的 App ID\n\n每个需要应用内购买的 App 都应该有一个对该应用程序唯一的 `App ID`。该 ID 不能包含通配符字符（`*`）。推荐的约定是反向\
  \ DNS 表示法。以下是几个示例：\n\n`com.mycompany.myapp.levelpack1`\n\n`org.mycompany.myapp.levelpack2`\n\
  \n要创建一个新的 `App ID`，请登录 iOS 开发者计划门户并导航到 iOS Provisioning Portal，如图 14-1 所示。\n\n![9781119961321-fg1401.tif](img/9781119961321-fg1401_fmt.jpeg)\n\
  \n图 14-1 iOS Provisioning Portal\n\n点击 `New App ID` 按钮并按照向导创建 `App ID`。确保你使用的是不包含任何通配符字符的完全限定\
  \ `App ID`。\n\n**警告**：你的 `App ID` 中的通配符字符将阻止你以后添加应用内购买的产品。如果你已经在 App Store 上有一个产品，并想在下一个版本中集成应用内购买，但上线\
  \ App 未使用唯一的 `App ID`，它仍然可以工作，但你的用户将不会通过 App Store 自动收到更新通知；他们必须重新下载。为了推送更新通知，App\
  \ Store 依赖于后续更新使用相同的 `App ID` 并递增版本号这一事实。虽然有解决方法可以将新的 `App ID` 与现有的 `Bundle ID`\
  \ 关联（Apple 技术备录 QA1680），但我仍然建议为你开发的每个 App 使用唯一的项目 ID。在编写本文时，随着 iOS 5 发布，有几个功能依赖于唯一的\
  \ `App ID`，包括但不限于推送通知、Game Center 集集成 iCloud 集成。如果你的 App 可能会使用这些功能的任何一个（即使在未来的版本中），你也应该从一开始就使用唯一的\
  \ `App ID`。\n\n## 第 2：生成配置文件（Provisioning Profiles）\n\n应用内购买无法在模拟器上运行；你需要一个设备来运行和测试它们。这意味着你应该创建一个配置文件，以便在设备上运行你的\
  \ App。这是第二步。前往 iOS Provisioning Portal 左侧导航栏中的第五个链接。此步骤的完成方式与任何其他 App 完全相同。记得选择你在第\
  \ 1 步中创建的相同 `App ID`。\n\n## 第 3：创建 App 产品条目\n\n在创建应用内购买产品之前，你需要一个能够销售这些应用内购买产品的\
  \ App。让我们从在 `iTunes Connect` 上创建一个应用程序开始。打开 `iTunes Connect` 并点击 `Manage Your Applications`。这是右列的第一链接，如图\
  \ 14-2 所示。\n\n![9781119961321-fg1402.tif](img/9781119961321-fg1402_fmt.jpeg)\n\n\
  图 14-2 iTunes Connect 首页\n\n从 `Manage Your Applications` 链接创建一个新应用程序。对你来说，最重要的正确选择\
  \ `Bundle ID`。在这里选择你在第 1 步中创建的 `App ID` 作为你的 `Bundle ID`，如图 14-3 所示。\n\n## 第 4：创建应用内购买条目\n\
  \n点击该 App，你将看到一个如图 14-4 所示的屏幕。\n\n![9781119961321-fg1404.tif](img/9781119961321-fg1404_fmt.jpeg)\n\
  \n图 14-4 App 信息\n\n点击 `Manage In-App Purchases` 链接创建你的第一个应用内购买产品。\n\n如果你在 iTunes\
  \ Connect 上没有看到 `Manage In-App Purchases` 选项，请确保你的 iTunes Connect 具有管理员权限。然后，检查你的合同税务银行信息（Contract\
  \ Tax Banking）是否正确。如果这是你的第一个 App，且尚未提交税务文件和/或接受付费应用程序协议，你将在页面上看不到此链接。在这种情况下，请适当修正情况并等待；Apple\
  \ 通常需要一周或两周来审核你的文件，具体取决于你所在地。\n\n在第一个页面，你会看到四种可以创建的不同类型的产品。你应该知道你正在创建的是哪种产品（在本章前面讨论过）。选择该产品类型并继续。\n\
  \n为了为你的应用内产品创建项目 ID，我建议在标识符后面加上你的 `Bundle ID`。例如，如果你的 `Bundle ID` 是 `com.mycompany.myapp`，那么你的应用内产品\
  \ ID 将是 `com.mycompany.myapp.inapp`。这将确保你其他 App 中的项目 ID 不会发生冲突。\n\n### 消耗性、非消耗性、非续订订阅\n\
  \n对于自动续订订阅以外的所有产品类型，你必须输入一个项目标识符并选择其价格档。添加一个在用户购买你的产品时显示的描述。如果你的产品是多语言的，请在此页面为所有支持的语言添加描述。\n\
  \n\n\n\n\n在提交表单之前，你现在必须添加产品的截图（是的，就是你尚未创建的那个）。目前，请上传一张 320×480 的 iPhone 截图。此截图仅用于\
  \ iOS App Store 审核。在大多数情况下，你只需要针对内容准备。对于功能或其他消耗品，上传显示 In App Store 界面的截图也是可以的。\n\
  \n在苹果宣布新的自动续订订阅后，不再建议使用非续订订阅。从功能上讲，自动续订订阅提供了非续订订阅的所有功能，并增加了如无需用户干预的自动续订，以及在客户其他设备上恢复订阅等功能。\n\
  \n## 自动续订订阅\n\n自动续订订阅略有不同。你创建一个订阅族，并为该族添加订阅时长。这允许你为相同的杂志创建不同时长的订阅。例如，你可以创建一个 5 美元的周订阅、20\
  \ 美元的月订阅或 300 美元的年订阅。订阅族内的其他选项与消耗品类似。\n\n## 第 5 步：生成共享密钥\n\n对于自动续订订阅，你还需要完成另外一个非常重要的步骤：生成共享密钥。\n\
  \n在 App 信息页面（如图 14-4 所示），点击 `Manage In App Purchases` 链接。在该页面，你会看到一个标题为“查看或生成共享密钥”的链接。安全地复制共享密钥。在编写实际代码时，你需要它。\n\
  \n## 第 6 步：创建测试用户账户\n\n最后一步是创建用户账户，用于在实现后测试内购购买。你可以在以后实现后完成后做此，但现在完成可以涵盖配置内购购买所需的所有步骤。\n\
  \n要创建测试用户账户，打开 iTunes Connect 首页（见图 14-2）并点击 `Manage Users`。你会看到两个链接，一个用于创建 iTunes\
  \ Connect 用户，另一个用于创建测试用户（Test User）。点击第二个链接并创建一个测试用户。这应该非常简单。\n\n到此为止，内购购买的配置已完成。如果你正确地完成了所有步骤，你就完成了内购购买集成的\
  \ 30%。剩下的 70% 是实际代码，你接下来将深入研究。\n\n## 内购购买实现\n\n内购购买的配置很困难，实现涉及的编程同样困难。内购购买实现需要你完成一些枯燥的代码。以下是在你的\
  \ App 中实现内购购买必须执行的重要任务的完整列表。\n\n- 首先，在交易进行期间，你的 App 可能会被关闭（可能是因为接听电话）。鉴于交易可以在你的\
  \ App 外部继续，你应该有一个 `Store Observer` 类，它在应用程序启动时初始化，并接收 App 在后台运行期间进行的任何购买。\n- 记住购买的消耗品的实际数量。\n\
  - 记住非消耗品的购买，并允许用户在其他其他设备上恢复它。\n- 记住这些购买应该使用 `iOS keychain` 安全地完成。\n- 将非续订订阅发布到你的服务器并在那里“记住”它们。当用户从另一个设备登录你的\
  \ App 时，你也应该具备在任何其他设备上恢复它们的能力。\n- 消耗性内容可以从你的服务器偶尔数字交付。在这种情况下，你的服务器应该能够验证收据的真实性并提供内容。这意味着你的\
  \ iOS App 在开始下载内容之前，应该将 App Store 购买收据发布到你的服务器。\n- 验证自动续订订阅收据是否仍然有效。尽管自动续订订阅会在无需人工干预的情况下自动续订，但你仍需要检查这一点，因为用户可能取消了订阅。取消的订阅仅在当前订阅期结束前有效。这意味着你作为开发者应该记住购买、购买收据并验证收据的有效，可能在\
  \ App 启动期间。如果它们不再有效，则停止提供内容。\n- 要验证自动续订订阅，将你的收据和上一节第 5 步生成的共享密钥发布到 App Store，解析返回的\
  \ `JSON`（JavaScript 对象表示），并获取订阅的最新购买日期。\n- `StoreKit.framework` 不会告诉你自动续订订阅何时结束。相反，`API`\
  \ 返回的是最新收据的实际日期。从该日期开始，你应该计算出实际过期日期。\n- 在你的 `Store View Controller` 上显示本地化的产品价格和描述。\n\
  \n虽然听起来很复杂，但 `MKStoreKit` 封装了大部分这些功能。接下来你将看到如何将 `MKStoreKit` 添加到你的 App 并进行构建。\n\n\
  ## MKStoreKit 简介\n\n`MKStoreKit` 是一个开源框架（[In App Purchases Tutorial | MKBlog, 2011]），它让内购购买变得变得简单。编写本文时，最新版本是\
  \ 4.0，这也是本章使用的版本。你可以从书的网站或 Github 下载其源代码（参见本章末尾的“延伸”部分）。\n\n## 为什么选择 MKStoreKit？\n\
  \n`MKStoreKit` 会自动处理你在上一节列表中看到的以下项目。\n\n- 当你的 App 在交易进行期间关闭时，`MKStoreKit` 会自动跟踪此操作，继续观察\
  \ `StoreKit delegates` 并记住在 App 之外进行的任何购买。这解决了第一项任务。\n- 对于消耗品和非消耗品，`MKStoreKit`\
  \ 会自动在 `iOS keychain` 中记住你的购买。购买是使用你的产品标识符作为键记录的，因此在大多数情况下，你不需要在此处进行任何自定义。因此，第 2、3、4\
  \ 项任务都得到了自动处理。\n- `MKSKProduct` 类会将非续订订阅发布到你的服务器。因此，如果你使用随 `MKStoreKit` 提供的 PHP\
  \ 代码进行自定义，第五项任务就解决了。你将在后的“自定义 MKStoreKit”部分学习这一点。\n- 对于消耗品或任何从你的服务器数字交付的内容，你必须将\
  \ App Store 收据发布到你的服务器。服务器应该验证并校验收据。如果它有效，它应该向你的 App 提供内容。`MKSKProduct` 类将配合某些服务器配置处理此任务，你将在本章后面学习学习。这处理了第\
  \ 6 项。\n- 对于自动续订订阅，你需要在 App 启动时验证最新收据，并在用户取消订阅时禁用访问。`MKSSubscriptionProduct` 类会自动执行这些，包括解析来自\
  \ App Store 的响应 JSON 并验证订阅仍然有效；它通过 `NSNotificationCenter` 通知你。你应该告诉 MKStoreKit 订阅有效的天数。你将在本章后面学习如何这样做。这解决了第\
  \ 7、8、9 项。\n- `MKStoreKit` 拥有辅助方法，可以返回用户本地货币格式的产品描述和价格。这解决了最后一项。\n\n虽然这听起来很复杂，但将\
  \ `MKStoreKit` 集成到你的 App 中少于 25 行代码。在某些情况下甚至少于 10 行。\n\n现在，在实际集成框架之前，了解它的内部原理总是好的。下一节将解释这一点。\n\
  \n\n\n\n\n`MKStoreKit` 使用块（blocks）而不是代理（delegates）来通知你产品购买。（你可以在第 16 章学习更多关于块的知识）。其他通知如订阅过期将发布到\
  \ `NSNotificationCenter`。该框架包含一个主单例类 `MKStoreManager` 以及此处列出的其他辅助类：\n\n- `MKStoreManager.h`\
  \ 和 `MKStoreManager.m`——这是处理大部分实现的主单例类。你必须在 `AppDelegate` 的 `applicationDidFinishLaunchingWithOptions:`\
  \ 方法中初始化此单例。\n- `MKStoreObserver.h` 和 `MKStoreObserver.m`——该类实现了 `StoreKit.framework`\
  \ 的 `SKPaymentTransactionObserver`。它向 `MKStoreManager` 单例发送产品购买通知或恢复的通知。\n- `MKSKProduct.h`\
  \ 和 `MKSKProduct.m`——这是 `MKStoreKit` 内部用于验证购买情况的内部类。`MKStoreManager` 使用该类与你的服务器通信，以检查收据（receipt）是否有效以及实际产品是否可以下载。这仅用于“服务器产品模型”（Server\
  \ Product Model），即你在服务器上验证收据并以数字形式交付内容。\n- `MKSKSubscriptionProduct.h` 和 `MKSKSubscriptionProduct.m`——这是\
  \ `MKStoreKit` 用于验证自动续订订阅购买的另一个内部类。`MKStoreManager` 使用该类与你的服务器通信，以检查最新的订阅收据仍然有效。如果用户取消了订阅，该类会通知\
  \ `MKStoreManager` 订阅不再有效，随后 `MKStoreManager` 会发布通知。你必须在你的视图控制器中观察这些通知（如下所示），并据此启用或禁用你的“订阅”按钮。如果你的\
  \ App 不使用自动续订订阅，则无需这样做。\n\n`kSubscriptionsPurchasedNotification`\n`kSubscriptionsInvalidNotification`\n\
  \n- `MKStoreKitConfigs.h` 和 `MKStoreKitConfigs.plist`——框架中的这两个文件需要根据你的 App 进行自定义。你将在本章的稍后部分学习如何自定义自定义它们。\n\
  - **记住购买记录**——`MKStoreKit` 使用 iOS keychain 在购买发生时自动记住该购买记录。\n\n## 自定义 MKStoreKit\n\
  \n在 `MKStoreKit` 中，你需要更改的两个重要文件是：\n\n- `MKStoreKitConfigs.h`\n- `MKStoreKitConfigs.plist`\n\
  \n`plist` 文件包含了你在 iTunes Connect 上配置的产品列表。你根据产品类型在 `plist` 对应的键下添加你的产品。你应该将消耗性产品（consumables）添加到\
  \ `consumable` 键下，非消耗性产品（nonconsumables）添加到 `nonconsumable` 键下，将订阅添加到 `subscriptions`\
  \ 键下。每种键都有其自己的子选项。你将在本章的稍后部分学习如何配置它们。\n\n### 初始化 MKStoreKit\n\n在配置 `MKStoreKit`\
  \ 之前，请在 `AppDelegate` 的 `applicationDidFinishLaunchingWithOptions:` 方法中初始化它。这确保了\
  \ `StoreObservers` 被正确初始化，以接收在 App 之外完成的交易。只需在 `AppDelegate` 中调用以下代码初始化单例即可：\n\n\
  ```[MKStoreManager sharedManager];\n```\n\n### 配置以配合服务器产品模型\n\n当你在 App 中销售内容并允许用户从你的服务器流传输或下载内容时，你应该使用“服务器产品模型”。在服务器产品模型中，iOS\
  \ App 进行购买并将交易收据发送到服务器进行验证。然后，服务器通过 Apple 的收据验证服务器验证收据，如果收据有效，则将请求重定向到请求的内容。\n\n\
  #### 服务器设置\n\n`MKStoreKit` 附带有 PHP 服务器代码，可以直接验证来自服务器的收据。复制 `Server Code` 目录并对其开放访问。复制该目录的公共\
  \ URL。假设它可以通过以下位置访问：\n\n```http://api.example.com/servercode\n```\n\n现在回到你的 iOS\
  \ 源码，打开 `MKStoreKitConfigs.h` 文件，并找到这些行：\n\n```objc\n#define SERVER_PRODUCT_MODEL\
  \ 0\n#define OWN_SERVER nil\n#define REVIEW_ALLOWED 1\n```\n\n将 `OWN_SERVER` 的值设置为\
  \ `@“http://api.example.com/servercode”`。\n\n现在一切都准备好了。`MKStoreKit` 将访问该目录下的 `featureCheck.php`\
  \ 端点来验证收据，并且仅在服务器说收据有效时才会记住购买记录。收据验证是通过将收据发布到 Apple 的收据验证 URL 完成的：\n\n`https://buy.itunes.apple.com/verifyReceipt`\n\
  \n对于沙盒测试，你应该使用：\n\n`https://sandbox.itunes.apple.com/verifyReceipt`\n\n服务器代码会根据你定义的配置自动切换。`featureCheck.php`\
  \ 的默认实现根据收据是否有效返回纯字符串——`YES` 或 `NO`。你可能需要修改它以返回 JSON 以及内容位置的 URL。\n\n### 配置以配合消耗性产品\n\
  \n从广义上说，消耗性产品在使用在使用会耗尽的产品。打印机墨水就是一个常见的例子。在 App 购买中，消耗性产品的行为相同。当用户购买消耗性产品时，它被存储在设备上并直到用户使用它。你没有义务在其他设备上恢复消耗性产品。在实现消耗性产品时，你经常会遇到一种业务场景，即批量购买对用户的补贴，就像现实世界中的消耗品一样。\n\
  \n例如，你的游戏中有两个产品：一个价格 99 美分、装有一百颗子弹的小盒，和一个价格 5.99 美元、装有一千颗子弹的大盒。在你的游戏中，这两个产品是等同的。但从\
  \ SKU 的角度来看，它们的处理方式和成本也不同。为了实现这种模型，`MKStoreKit` 允许你为产品指定名称。这样你就可以告诉 `MKStoreKit`\
  \ 在购买时对其分别处理，但在消耗时将其视为同一。基本上，这意味着购买任何一种产品都会增加同一项目的计数。要按这样配置 `MKStoreKit`，请使用图 14-5\
  \ 所示 `MKStoreKitConfigs.plist` 中 `consumable` 键内部的子选项。\n\n通过 `Consumables` 字典添加每个消耗性产品的标识符。每个产品都有\
  \ `Name` 和 `Count`。根据之前的示例（子弹盒案例），假设你有两个产品：`com.myapp.mygame.ammackSmall` 和 `com.myapp.mygame.ammackLarge`。`Count`\
  \ 键允许你设置该产品购买的虚拟消耗品数量。`Name` 键允许你设置该消耗品的真实名称。`MKStoreKit` 通常通过产品标识符记住购买记录。但对于消耗性产品，它使用\
  \ `Name` 键，因为在你的 App 中，多个 SKU 实际上意味着同一个东西。\n\n现在，在你的游戏/App 过程中，如果用户消耗了你的产品，你应该先通过调用这些方法检查它是否可用：\n\
  \n```objc\n-(BOOL)canConsumeProduct:(NSString*) productName quantity:(int) quantity;\n\
  -(BOOL)consumeProduct:(NSString*) productName quantity:(int) quantity;\n```\n\n\
  `consumeProduct` 将正确地从购买数量中扣除已消耗的产品，并将剩余的可用数量存储在 keychain 中，一切自动完成。\n\n### 配置以配合自动续订订阅\n\
  \n自动续订订阅的配置与消耗性产品的配置非常相似。第一步是指定共享密钥（shared secret）。复制你在本章较早生成的共享密钥并将其粘贴到 `MKStoreKitConfigs.h`\
  \ 文件中：\n\n```objc\n#warning Shared Secret Missing 如果你不使用自动续订订阅，请忽略此警告\n#define kSharedSecret\
  \ @\"<在此处输入你的共享密钥>”\n```\n\n\n\n\n你现在可以删除 `#warning` 这一行了。此外，如果你不使用自动续订订阅（因此没有共享密钥），你可以忽略此警告。只需删除\
  \ `#warning` 行即可。\n\n现在打开 Plist 文件，像处理消耗性项目（consumables）一样，不要指定数量，而是指定订阅的有效期。现在，在你显示商店的视图（view\
  \ controllers）上，你应该观察 `kSubscriptionsPurchasedNotification` 和/或 `kSubscriptionsInvalidNotification`，并根据此启用或禁用你的订阅按钮。\n\
  \n### 进行购买\n\n既然你已经配置了 `MKStoreKit`，进行真实购买变得非常简单。只需像这样调用单个方法即可：\n\n```objc\n[[MKStoreManager\
  \ sharedManager] buyFeature:@”com.myapp.myfeature”\n         onComplete:^(NSString*)\
  \ purchasedProduct\n{\n  // 为产品“purchasedProduct”提供内容。\n}\n         onCancelled:^\n\
  {\n  // 可选显示错误\n}];\n```\n\n一旦你正确配置了 `MKStoreKit`，只需调用单个方法即可启动购买。记住购买过程会自动完成。要检查之前是否购买过某个产品，可以调用此方法：\n\
  \n`[MKStoreManager isProductPurchased:@”com.myapp.feature1”];`\n\n此方法返回一个 `Boolean`\
  \ 值，表示产品是否已购买。恢复购买通过另一个单行代码完成。阅读 `MKStoreManger.h` 文件可以查看 `MKStoreKit` 暴露的功能。\n\n\
  现在，运行所有内容只需要于 10 行代码，可能还有我在章节开头承诺的另外约 15 行配置代码。\n\n## 测试你的内应用购买\n\n现在你已经实现了内应用购买，让我们测试一下它们是否有效。你需要在本章稍早创建的测试用户账户的凭据进行测试。在开始之前，打开用于测试的设备上的设置应用，并点击商店菜单。登出\
  \ App Store，并确保没有用户登录商店。\n\n在设备上运行应用并启动购买。系统会提示你输入或创建一个新的 iTunes 账户，或使用现有账户。选择使用现有账户并输入你之前创建的测试用户名和密码。App\
  \ Store 现在会要求你确认购买内应用购买产品。点击购买（或订阅），你的产品现在就被成功购买了。你已成功完成了应用中的内应用购买集成。\n\n这些听起来都很不错，但当出现问题时会发生什么？让我们在下一节查看一些快速的故障排除技巧。\n\
  \n### 故障排除\n\n即使在看了本章所有的解释之后，内应用购买仍然是最难排查故障的框架之一。\n\n### 无效的产品 ID\n\n最常见的问题发生在 App\
  \ Store 返回你的产品无效时。如果你紧跟本章节的内容，阅读了每一个提示和警告，你不应该遇到这种情况。然而，如果你存在以下任何一个问题，问题就可能发生：\n\
  \n- `Info.plist` 文件中的产品 Bundle ID 与你创建的 App ID 不匹配。\n- 你的合同和税务声明尚未提交，或者你尚未接受 iOS\
  \ 开发者付费应用程序合同。要纠正这些问题，请前往 iTunes Connect 并点击“合同、税务银行”（Contracts, Tax, and Banking）链接。提交第一个应用时检查这一点非常重要。\n\
  - 越狱设备有时与 App Store 配合不佳。Cydia 中一个名为 `AppSync` 的应用似乎是大多数与内应用购买相关的问题。内应用购买最好在运行未修改操作系统的设备上进行测试。\n\
  \n有时，即使在你确保这些问题都不是问题后，App Store 仍然会指示你的产品无效。这种情况在非美国开发者身上发生得更频繁。重试之前请等待几小时（参见 2011\
  \ 年 Apple Developer 文档中的“检索商店信息”）。Apple 使用分布式服务器，可能需要几小时将你创建的产品从美国服务器迁移到你附近的其他镜像服务器。\n\
  \n### 无法连接到 iTunes Store\n\n另一个常见问题是当你收到消息“无法连接到 iTunes 商店：代码：-1003”。这发生在防火墙拦截了\
  \ iTunes 时。通过连接到不同的网络或确保你拥有良好的 Internet 连接来测试内应用购买。\n\n### 你已购买了此产品，但仍未下载\n\n这种错误在处理消耗性项目时很常见。主要发生在你频繁点击“购买”按钮时。解决方法是在启动购买后禁用“购买”按钮，并在事务完成后重新启用。遵循类似于内置\
  \ App Store 的交互模式。\n\n如果你的问题仍然没有解决，删除应用并重新执行所有步骤的传统方法通常有效。\n\n### 总结\n\n内应用购买虽然实现起来很复杂，但为你的应用变现提供了一种创新且独特的方式。仔细决定你的业务模型并实现内应用购买可以大幅增加你从\
  \ App Store 获得的收入。快速查看美国 App Store 畅销应用显示，至少有 25% 遵循免费模式（freemium），即应用是免费的，但内容和功能通过内应用购买提供。这清楚地证明了免费模式在\
  \ App Store 上是成功的。有了 `MKStoreKit` 等框架减少了编码工作，为什么不尝试一下呢？\n\n### 延伸阅读\n\n### Apple\
  \ 文档\n\n以下文档可以在 iOS Developer Library 的 [`developer.apple.com`](http://developer.apple.com/)\
  \ 或通过 Xcode 文档和 API 参考中找到：\n\n- App Store 审核指南\n- 内应用购买编程指南\n- 检索商店信息\n\n### 博客\n\
  \n- iPhone 教程：内应用购买 | MKBlog [`blog.mugunthkumar.com/coding/iphone-tutorial-–in-app-purchases/`](http://blog.mugunthkumar.com/coding/iphone-tutorial-–in-app-purchases/)\n\
  - MKStoreKit 4.0 - 支持自动续订订阅 | MKBlog [`blog.mugunthkumar.com/coding/mkstorekit-4.0-supporting-auto-renewable-subscriptions/`](http://blog.mugunthkumar.com/coding/mkstorekit-4.0-supporting-auto-renewable-subscriptions/)\n\
  \n### 其他资源\n\n- GitHub  MKStoreKit：[`https://github.com/MugunthKumar/MKStoreKit`](https://github.com/MugunthKumar/MKStoreKit)\n\
  - 无法使用内应用购买：这不是测试用户账户 / Boxcar 支持 [`http://help.boxcar.io/kb/general/cant-use-in-app-purchase-this-is-not-a-test-account`](http://help.boxcar.io/kb/general/cant-use-in-app-purchase-this-is-not-a-test-account)\n\
  \n---\n\n第四部分：挑战极限\n\n第 15 章 Cocoa 最大的技巧：键值编码与观测\n\n第 16 章 思考不同：块 与函数式编程\n\n第 17\
  \ 章 离线\n\n第 18 章 精致的文本布局\n\n第 19 章 构建（核心）基础\n\n第 20 章 深度 Objective-C\n\n第 15 章 Cocoa\
  \ 最大的技巧：键值编码与观测\n\nCocoa 中没有魔法。它只是 C。但有一个特别接近魔法的特定技巧，那就是键值观测（KVO）。本章将探讨如何使用以及何时使用\
  \ KVO，以及它那非魔法的同类——键值编码（KVC）。\n\n\n\n\n\n键值编码（Key-value coding，KVC）是一种允许你通过名称访问对象属性的机制，而不是通过显式的访问器。这允许你在运行时而不是编译时确定属性绑定。例如，你可以使用字符串变量\
  \ `someProperty` 通过 `[object valueForKey:someProperty]` 来请求名为该属性的值。你可以使用 `[object\
  \ setValue:someValue forKey:someProperty]` 设置 `someProperty` 的值。这种间接性允许你在运行时而非编译时确定要访问的具体属性，从而创建更具灵活性和可重性的对象。为了获得这种灵活性，你的对象需要以特定的方式命名方法。这种命名约定被称为键值编码，在本章中，你将学习这些规则来创建间接的\
  \ getter 和 setter、访问集合中的项以及使用非对象管理 KVC。你还将学习实现高级 KVC 技术，例如高阶消息传递和集合操作符。\n\n如果你的对象遵循\
  \ KVC 命名规则，那么你还可以利用键值观察（Key-value observing，KVO）。KVO 是一种通知对象其他对象属性变化的机制。Cocoa 具有几种观察者机制，包括代理（delegation）和\
  \ `NSNotification`，但 KVO 是最快的。被观察的对象不需要包含任何特殊代码来通知观察者，如果没有观察者，KVO 没有任何运行时开销。KVO\
  \ 系统仅在类实际被观察时才添加通知代码。这使得它对于性能敏感的情况非常有吸引力。在本章中，你将学习如何对属性和集合使用 KVO，以及 Cocoa 用于使 KVO\
  \ 如此透明的技巧。\n\n本章中的所有代码示例都可以在第 15 章的项目 `KVC`、`KVC-Collection` 和 `KVO` 的在线文件中找到。\n\
  \n### 键值编码\n\n键值编码是 Cocoa 的标准部分，允许通过名称（“键”）而不是通过调用显式访问器来访问你的属性。它允许系统的其他部分请求请求“名为\
  \ `foo` 的属性”，而不是直接调用 `foo`。这允许那些在编译时不知道你的键的系统部分进行动态访问。这特别支持 iOS 中的 nib 文件加载和 Core\
  \ Data。在 Mac 上，KVC 是 AppleScript 接口的一个基础性部分。\n\n以下代码列表演示了 KVC 如何工作，示例是一个可以使用 `valueForKeyPath:`\
  \ 显示任何对象的单元格（cell）。\n\n### KVCTableViewCell.h (KVC)\n\n```objc\n@interface KVCTableViewCell\
  \ : UITableViewCell\n\n- (id)initWithReuseIdentifier:(NSString*)identifier;\n\n\
  // 要显示的对象。\n@property (nonatomic, readwrite, strong) id target;\n\n// 要显示的对象的属性的名称\n\
  @property (nonatomic, readwrite, copy) NSString *property;\n\n@end\n```\n\n### KVCTableViewCell.m\
  \ (KVC)\n\n```objc\n@implementation KVCTableViewCell\n@synthesize target=target_;\n\
  @synthesize property=property_;\n\n- (BOOL)isReady {\n  // 只有在配置后才显示\n  return (self.target\
  \ && [self.property length] > 0);\n}\n\n- (void)update {\n  NSString *text;\n  if\
  \ (self.isReady) {\n    // 向 target 请求其属性的值，该属性的名字\n    // 由 self.property 给出。将其转换为人类\n\
  \    // 可读的字符串\n    id value = [self.target valueForKeyPath:self.property];\n  \
  \  text = [value description];\n  }\n  else {\n    text = @”;\n  }\n  self.textLabel.text\
  \ = text;\n}\n\n- (id)initWithReuseIdentifier:(NSString *)identifier {\n  return\
  \ [self initWithStyle:UITableViewCellStyleDefault\n              reuseIdentifier:identifier];\n\
  }\n\n- (void)setTarget:(id)aTarget {\n  target_ = aTarget;\n  [self update];\n}\n\
  \n- (void)setProperty:(NSString *)aProperty {\n  property_ = aProperty;\n  [self\
  \ update];\n}\n\n@end\n```\n\n### KVCTableViewController.m (KVC)\n\n```objc\n@implementation\
  \ KVCTableViewController\n- (NSInteger)tableView:(UITableView *)tableView\nnumberOfRowsInSection:(NSInteger)section\
  \ {\n  return 100;\n}\n\n- (UITableViewCell *)tableView:(UITableView *)tableView\n\
  \          cellForRowAtIndexPath:(NSIndexPath *)indexPath {\n  static NSString *CellIdentifier\
  \ = @”KVCTableViewCell”;\n  KVCTableViewCell *cell = [tableView\n          dequeueReusableCellWithIdentifier:CellIdentifier];\n\
  \  if (cell == nil) {\n    cell = [[KVCTableViewCell alloc]\n    // 提供的文本中的逻辑在这里似乎被截断/碎片化\n\
  \    // 但保留了提供的结构。\n  }\n  // ... (根据提供的文本的剩余逻辑)\n}\n```\n（注：提供的 `KVCTableViewController.m`\
  \ 源码被严重碎片化/交错。我格式化了可见的逻辑块，并维护了提示中提供的结构。）*\n\n## 使用 KVC 设置值\n\nKVC 还可以使用 `setValue:forKey:`\
  \ 修改可写属性。例如，以下两行代码大体相同：\n\n`cell.property = @”;`\n\n`[cell setValue:@”intValue”\
  \ forKey:@property”];`\n\n只要 `property` 是一个对象，这两行代码都会调用 `setProperty`。\n\n## 遍历属性\n\
  \n你可能已经注意到 KVC 方法有 `key` 和 `keyPath` 版本。例如，有 `valueForKey:` 和 `valueForKeyPath:`。键（key）和键路径（key\
  \ path）的区别在于，键路径可以由点分隔的嵌套关系。`valueForKeyPath:` 方法会遍历这些关系。例如，以下两行代码大体相同：\n\n`[[self\
  \ department] name];`\n\n`[self valueForKeyPath:@”department.name”];`\n\n另一方面，`valueForKey:@”department.name”`\
  \ 会尝试检索属性 `department.name`，这在许多情况下会抛出异常。\n\n## KVC 与集合\n\n对象的属性可以是一对一或一对多的。一对多属性可以是有序的（数组）也可以是无序的（集合）。\n\
  \n\n\n\n\n不可变的有序 (`NSArray`) 和无序 (`NSSet`) 集合属性可以通过 `valueForKey:` 正常获取。如果你有一个名为\
  \ `items` 的 `NSArray` 属性，那么调用 `valueForKey:@”items”` 返回的结果正如你预期的那样。但有更灵活的方法可以此类。\n\
  \n在这个示例中，你创建了一个二的倍数表格。数据模型对象只跟踪行数，而不是实际结果，但它提供的结果就像 `NSArray` 一样。该项目在示例代码中名为 `KVC-Collection`。以下是创建方法：\n\
  \n- 在 Xcode 中使用 Model-Detail Application 模板、storyboard 和自动引用计数创建一个新的 iPhone 项目。\n\
  - 选择 `MainStoryboard.storyboard` 并移除“Master View Controller”和“Detail View Controller”。\n\
  - 从库中拖入视图控制器并将其类设置为 `RootViewController`。从导航控制器点击并拖到你的新视图控制器，并将关系设置为 `rootViewController`。\n\
  - 正如图 15-1 所示添加标签和按钮。井号（###）是与标题分开的独立标签。\n\n![9781119961321-fg1501.eps](img/9781119961321-fg1501_fmt.jpeg)\n\
  \n图 15-1 KVC-Collection 项目的 Storyboard\n\n- 删除 `MasterViewController` 和 `DetailViewController`\
  \ 源文件。\n- 使用 `UIViewController` 模板添加一个新的源文件并命名为 `RootViewController`。不要为其用户界面使用\
  \ XIB。\n- 在 storyboard 中，选择根视图控制器并显示辅助编辑器。从标签和按钮点击并拖到 `RootViewController.h` 以创建图\
  \ 15-2 所示的 outlet。对于“View”按钮，点击并拖到表格视图控制器并选择 push segue。\n\n![9781119961321-fg1502.eps](img/9781119961321-fg1502_fmt.jpeg)\n\
  \n图 15-2 KVC-Collection Root View Controller 布局\n\n以下代码实现了示例项目，并演示了通过 KVC 访问集合。当你点击\
  \ Add 按钮时，存储在 `DataModel` 中的项目数量将增加。当你点击 View 按钮时，将构建一个表格视图，使用 `RootViewController`\
  \ 中的 KVC 代理集合和 `KVCTableViewController` 中的 KVC 集合访问器来显示 `DataModel` 中的信息。代码之后，我将解释这两种访问机制的工作原理。\n\
  \n### RootViewController.h\n\n```objc\n@interface RootViewController : UIViewController\n\
  @property (nonatomic, strong) IBOutlet UILabel *countLabel;\n@property (nonatomic,\
  \ strong) IBOutlet UILabel *entryLabel;\n- (IBAction)performAdd;\n@end\n```\n\n\
  ### RootViewController.m\n\n```objc\n@implementation RootViewController\n@synthesize\
  \ countLabel=countLabel_;\n@synthesize entryLabel=entryLabel_;\n- (void)refresh\
  \ {\n  DataModel *model = [DataModel sharedModel];\n  // DataModel 中没有名为“items”的属性。KVC\
  \ 会\n  // 为你创建一个代理。\n  NSArray *items = [model valueForKey:@”items”];\n  NSUInteger\
  \ count = [items count];\n  self.countLabel.text = [NSString stringWithFormat:@”%d”,\n\
  \                             count];\n  if (count > 0) {\n    self.entryLabel.text\
  \ = [[items objectAtIndex:(count-1)]\n                                     description];\n\
  \  } else {\n    self.entryLabel.text = @””;\n  }\n}\n- (void)viewWillAppear:(BOOL)animated\
  \ {\n  [self refresh];\n  [super viewWillAppear:animated];\n}\n- (IBAction)performAdd\
  \ {\n  [[DataModel sharedModel] addItem];\n  [self refresh];\n}\n@end\n```\n\n###\
  \ KVCTableViewController.m\n\n```objc\n@implementation KVCTableViewController\n\
  - (NSInteger)tableView:(UITableView *)tableView\nnumberOfRowsInSection:(NSInteger)section\
  \ {\n  // countOfItems 是一个 KVC 方法，但你可以直接调用它\n  //而不是创建一个“items”代理。\n  return [[DataModel\
  \ sharedModel] countOfItems];\n}\n- (UITableViewCell *)tableView:(UITableView *)tableView\n\
  \          cellForRowAtIndexPath:(NSIndexPath *)indexPath {\n  static NSString *CellIdentifier\
  \ = @”Cell”;\n  UITableViewCell *cell = [tableView\n          dequeueReusableCellWithIdentifier:CellIdentifier];\n\
  \  if (cell == nil) {\n    cell = [[UITableViewCell alloc]\n              initWithStyle:UITableViewCellStyleDefault\n\
  \              reuseIdentifier:CellIdentifier];\n  }\n  DataModel *model = [DataModel\
  \ sharedModel];\n  id object = [model objectInItemsAtIndex:indexPath.row];\n  cell.textLabel.text\
  \ = [object description];\n  return cell;\n}\n@end\n```\n\n### DataModel.h\n\n```objc\n\
  @interface DataModel : NSObject\n+ (DataModel*)sharedModel;\n- (void)addItem;\n\
  - (NSUInteger)countOfItems;\n- (id)objectInItems:(NSUInteger)index;\n@end\n```\n\
  \n### DataModel.m\n\n```objc\n@interface DataModel ()\n@property (nonatomic, readwrite,\
  \ assign) NSUInteger count;\n@end\n\n@implementation DataModel\n@synthesize count;\n\
  + (DataModel*)sharedModel {\n  static DataModel *sharedModel;\n  static dispatch_once_t\
  \ onceToken;\n  dispatch_once(&onceToken, ^{\n    sharedModel = [[DataModel alloc]\
  \ init];\n  });\n  return sharedModel;\n}\n- (NSUInteger)countOfItems {\n  return\
  \ count;\n}\n- (id)objectInItems:(NSUInteger)index {\n  return [NSNumber int:count\
  \ * 2];\n}\n- (void)addItem {\n  count++;\n}\n@end\n```\n\n注意 `RootViewController`\
  \ 如何从 `DataModel` 访问数组：\n\n`NSArray *items = [model valueForKey:@”items”];`\n\n\
  通常你可能期望这会调用 `[DataModel items]`，但并没有这样的方法。那么这个 `NSArray` 是从哪里来的？`DataModel` 实现了\
  \ `countOfItems` 和 `objectInItems:`。这些是特殊命名的方法。当 `valueForKey:` 查找 `items` 时，它会搜索以下内容：\n\
  \n- `getItems` 或 `items` 或 `isItems`——如果找到任何一个，将将其用于返回值。\n- `countOfItems` 和 `objectInItems:`\
  \ 或 `itemsAtIndex`——这是你使用的组合。KVC 会生成一个代理。\n- `countOfItems` 和 `enumeratorOfItems`\
  \ 以及 `memberOfItems`——这种组合会导致 KVC 返回一个集合。\n- 名为 `_items`、`_isItems`、`items` 或 `isItems`\
  \ 的实例变量——KVC 将直接访问 ivar。你通常应该避免这种行为，这也是为什么要使用非下划线命名 ivar。\n\n在这个示例中，`valueForKey:`\
  \ 自动生成并返回一个代理 `NSKeyValueArray`。它是 `NSArray` 的子类，你可以像使用其他数组一样使用它，但对 `count`、`objectAtIndex:`\
  \ 等方法的调用将转发到相应的 KVC 方法。该代理缓存了请求，使其非常高效。完整方法参见 iOS Developer Library 中的 Key-Value\
  \ Coding Guide。\n\n在这个示例中，属性是 `items`，因此 KVC 查找 `countOfItems`。如果属性是 `boxes`，那么\
  \ KVC 将查找 `countOfBoxes`。KVC 要求按照标准方式命名方法，以便它构造这些方法名。这就是为什么 getter 方法以小字母开头。\n\n\
  对于可变集合属性，有两种选择。你可以使用如下变异器（更改属性）方法（再次，参见 Key-Value Coding own Guide 获取完整列表）：\n\n\
  - `- (void)insertObject:(id)object inChildrenAtIndex:(NSUInteger)index;`\n- `- (void)removeObject:(id)object\
  \ inChildrenAtIndex:(NSUInteger)index;`\n\n或者你可以通过调用 `mutableArrayValueForKey:`\
  \ 或 `mutableSetValueForKey:` 返回一个特殊的代理对象。修改此对象将自动调用你对象上相应的 KVC 方法。\n\nKVC 与字典\n\n\
  \n\n\n字典仅仅是一种特殊的嵌套关系。对于大多数键来说，调用 `valueForKey:` 与调用 `objectForKey:` 是一样的（例外是键以 `@`\
  \ 开头，该符号在需要时用于引用 `NSDictionary` 自身）。\n\n## KVC 与非对象\n\n并不是每个方法都返回对象，但 `valueForKey:`\
  \ 总是返回一个 `id`。非对象的返回值会被封装在 `NSValue` 或 `NSNumber` 中。这两个类可以处理从数字、布尔值到指针和结构体的**几乎任何类型**。虽然\
  \ `valueForKey:` 会自动将标量值（scalar values）封装成对象，但你不能将非对象直接传递给 `setValue:forKey:`。你必须手动将标量值封装在\
  \ `NSValue` 或 `NSNumber` 中。\n\n将非对象属性设置为 `nil` 是一个特殊情况。这是否合法取决于具体情况，因此 KVC 不会进行猜测。如果你使用\
  \ `nil` 值调用 `setValue:forKey:`，则该键将传递传递给 `setNilValueForKey:`。如果你想处理为非对象属性设置 `nil`，则需要重写该方法。\n\
  \n## 使用 KVC 进行高阶消息传递\n\n`setValue:forKey:` 包含了许多实用的特殊情况，例如它针对 `NSArray` 和 `NSSet`\
  \ 等集合进行了重写。`setValue:forKey:` 并不是在集合本身上操作，而是传递给集合中的每个成员。结果会被添加到返回的集合中。这允许你轻松地从其他集合构建集合，例如：\n\
  \n```objc\nNSArray *array = [NSArray arrayWithObjects:@”foo”,\n                \
  \  @”bar”, @”baz”, nil];\nNSArray *capitals =\n[array valueForKey:@”capitalizedString”];\n\
  ```\n\n这会将 `capitalizedString` 方法传递给 `NSArray` 中的每个项，并返回一个包含这些结果的新 `NSArray`。将消息（`capitalizedString`）作为参数传递被称为**高阶消息传递**（Higher\
  \ Order Messaging）。可以使用键路径传递多个消息：\n\n```objc\nNSArray *array = [NSArray arrayWithObjects:@”foo”,\n\
  \                  @”bar”, @”baz”, nil];\nNSArray *capLengths =\n[array valueForKeyPath:@”capitalizedString.length”];\n\
  ```\n\n上述代码对 `array` 的每个元素调用了 `capitalizedString`，然后调用 `length`，并将结果封装成 `NSNumber`\
  \ 对象。结果被收集到一个名为 `capLengths` 的新数组中。\n\n你在第 4 章中看过了使用跳板（trampolines）更灵活的方法，但 KVC\
  \ 为许多问题提供了一个非常简单的解决方案，只要你不需要传递参数。\n\n## 集合操作符\n\nKVC 还提供了一些复杂的函数。例如，它可以自动对数字列表求和或计算平均值。考虑一下：\n\
  \n```objc\nNSArray *array = [NSArray arrayWithObjects:@”foo”,\n                \
  \  @”bar”, @”baz”, nil];\nNSUInteger totalLength =\n[[array valueForKeyPath:@@sum.length”]\
  \ intValue];\n```\n\n`@sum` 是对指定属性（`length`）求和的运算符。注意，这比等效循环慢数百倍：\n\n```objc\nNSArray\
  \ *array = [NSArray arrayWithObjects:@”foo”,\n                  @”bar”, @”baz”,\
  \ nil];\nNSUInteger totalLength = 0;\nfor (NSString *string in array) {\n    totalLength\
  \ += [string length];\n}\n```\n\n在处理数千或数万个元素的数组时，性能问题通常是非常显著的。除了 `@sum` 之外，你可以在\
  \ iOS 开发者库的《键值编码编程指南》中找到许多其他运算符。这些操作在处理 Core Data 时特别有价值，因为它们可以优化为数据库查询，从而比等效的循环更快。然而，你不能创建自己的操作。\n\
  \n## 键值观测 (KVO)\n\n键值观测是一种透明通知观察者对象属性变化的机制。在“键值编码”章节开头，你构建了一个可以显示任何对象的视图单元。在那个示例中，数据是静态的。如果你更改了数据，单元就不会更新。现在让我们改进这一点。你可以让单元在对象发生变化时自动更新。你需要一个可改变的对象，所以使用当前的日期和时间。你使用键值观测在你关心的属性发生变化时获取回调。\n\
  \nKVO 与 `NSNotificationCenter` 有许多相似之处。你使用 `addObserver:forKeyPath:options:` 开始观察。停止观察时，使用\
  \ `removeObserver:forKeyPath:`。回调始终是 `observeValueForKeyPath:ofObject:change:`。以下是创建可以自动更新的日期单元格的修改代码。\n\
  \n```objc\n// KVCTableViewCell.m (KVO)\n@implementation KVCTableViewCell\n...\n\
  - (void)removeObservation {\n    if (self.isReady) {\n        [self.target removeObserver:self\
  \ forKeyPath:property_];\n    }\n}\n- (void)addObservation {\n    if (self.isReady)\
  \ {\n        [self.target addObserver:self forKeyPath:property\n               \
  \          options:0\n                           context:(__bridge void*)self];\n\
  \    }\n}\n- (void)observeValueForKeyPath:(NSString *)keyPath\n                \
  \ ofObject:(id)object\n                    change:(NSDictionary *)change\n     \
  \              context:(void *)context {\n    if ((__bridge id)context == self)\
  \ {\n        // 我们的通知，而不是我们父类的\n        [self update];\n    } else {\n        [super\
  \ observeValueForKeyPath:keyPath ofObject:object change:change context:context];\n\
  \    }\n}\n- (void)dealloc {\n    if (target_ && [property_ length] > 0) {\n   \
  \     [target_ removeObserver:self forKeyPath:property_];\n    }\n}\n- (void)setTarget:(id)aTarget\
  \ {\n    [self removeObservation];\n    target_ = aTarget;\n    [self addObservation];\n\
  \    [self update];\n}\n- (void)setProperty:(NSString *)aProperty {\n    [self removeObservation];\n\
  \    property_ = aProperty;\n    [self addObservation];\n    [self update];\n}\n\
  @end\n\n// UITableViewController.m (KVO)\n@interface UITableViewController ()\n\
  @property (readwrite, retain) NSTimer *timer;\n@property (readwrite, retain) NSDate\
  \ *now;\n@end\n\n@implementation UITableViewController\n@synthesize timer = timer_;\n\
  @synthesize now = now_;\n- (void)updateNow {\n    self.now = [NSDate date];\n}\n\
  - (void)viewDidLoad {\n    [self updateNow];\n    self.timer = [NSTimer\nscheduledTimerWithInterval:1\n\
  \                          target:self\n                        selector:@selector(updateNow)\n\
  \                          userInfo:nil];\n}\n- (void)viewDidUnload {\n    [self.timer\
  \ invalidate];\n    self.timer = nil;\n    self.now = nil;\n}\n...\n- (UITableViewCell\
  \ *)tableView:(UITableView *)tableView\ncellForRowAtIndexPath:(NSIndexPath *)indexPath\
  \ {\n    static NSString *CellIdentifier = @”KVableViewCell”;\n    id cell = [tableView\
  \ dequeueReusableCellWithIdentifier:CellIdentifier];\n    if (cell == nil) {\n \
  \       cell = [[[KVCTableViewCell alloc]\n          initWithReuseIdentifier:CellIdentifier]\
  \ autorelease];\n        [cell setProperty:@”now”];\n        [cell setTarget:self];\n\
  \    }\n    return cell;\n}\n- (void)dealloc {\n    [timer_ invalidate];\n}\n@end\n\
  ```\n\n在 `KVCTableViewCell` 中，你在 `addObservation` 中观察目标的请求属性。注册 KVO 时，你将 `self`\
  \ 传递给 `context` 指针（ARC 转换为 `void*`），以便在回调中判断这是否是你的观测。由于一个类只有一个 KVO 回调，你可能会收到父类注册的属性的回调。如果是这样，你需要将其传递给\
  \ `super`。遗憾的是，你不能总是传递给 `super`，因为 `NSObject` 会抛出异常。因此，你使用唯一的 `context` 来识别你的观测。关于此点的更多信息请参见“KVO\
  \ 权衡”。\n\n\n\n\n\n在 `RootViewController` 中，你创建了一个属性 `now` 并让 cell 观察它。每隔秒，你会更新它。观察者会收到通知，cell\
  \ 随之更新。这非常高效，因为由于 cell 复用机制，在任何给定时间内，屏幕上只有一个屏幕数量的 cell。\n\nKVO 的真正威力在 `[KVCTableViewController\
  \ updateNow]` 中体现：\n\n```objc\n- (void)updateNow {\n  self.now = [NSDate date];\n\
  }\n```\n\n你只需要做的就是更新你的数据。你不需要担心有人可能在观察你，而且如果没有人在观察你，你就不需要支付像使用 `NSNotificationCenter`\
  \ 那样的开销。这将在“KVO 权衡”章节中进行进一步讨论，但模型类方面这种惊人的简单性是 KVO 的真正益处。只要你使用访问器（accessors）来修改你的成员变量（`ivars`），整个观察机制都会自动处理，且在不需要时不会产生代价。所有的复杂度都转移到了观察者，而不是被观察者。这难怪\
  \ KVO 在 Apple 的底层框架中变得越来越流行。\n\n## KVO 与集合（Collections）\n\n观察集合往往会引起困惑。需要记住，观察一个集合不等同于观察它其中的对象。如果一个集合包含\
  \ Adam、Bob 和 Carol，那么添加 Denise 会改变集合。而对 Adam 的更改则不会改变集合。如果你想观察集合中对象的更改，你必须观察这些对象，而不是观察集合。通常，这是通过观察集合，然后在对象被添加时观察这些对象，并在它们被移除时停止观察来实现的。\n\
  \n## KVO 是如何实现的？\n\n键值观察（Key-value observing）的的依赖于两个 `NSObject` 方法：`willChangeValueForKey:`\
  \ 和 `didChangeValueForKey:`。在对被观察属性进行更改之前，必须有某些代码调用 `willChangeValueForKey:`，这会记录旧值。更改完成后，必须有某些代码调用\
  \ `didChangeValueForKey:`，它会调用 `observeValueForKeyPath:ofObject:change:context:`。你可以手动执行这些操作，但这并不常见。通常情况下，只有在你尝试控制回调的执行时机时才会这样做。大多数时候，这些操作是自动处理的。\n\
  \nObjective-C 中几乎没有“魔法”。即使起初看起来很神秘的消息派发（message dispatching），实际上也相当直接。（消息派发将在第 20\
  \ 章介绍。）然而，KVO 接近魔法。通过某种方式，当你调用 `setNow:` 时，中间会额外产生 `willChangeValueForKey:`、`didChangeValueForKey:`\
  \ 和 `observeValueForKeyPath:ofObject:change:context:` 的调用。你可能会认为这是因为你合成了 `setNow:`，偶尔你会看到有人写出这样的代码：\n\
  \n```objc\n- (void)setNow:(NSDate *)aDate {\n  [self willChangeValueForKey:@”now”];\
  \ // 没有必要\n  now_ = aDate;\n  [self didChangeValueForKey:@”now”]; // 没有必要\n}\n```\n\
  \n这是多余的，你不应该这样做，因为会导致 KVO 方法被调用两次。KVO 总是会在访问器之前调用 `willChangeValueForKey:`，并在之后调用\
  \ `didChangeValueForKey:`。这是怎么做到的？答案是类交换（class swizzling）。类交换将在第 20 章中进一步讨论，但当你第一次在对象上调用\
  \ `addObserver:forKeyPath:options:context:` 时，框架会创建该类的新 KVO 子类，并将被观察对象转换为该新子类。在那个特殊的\
  \ KVO 子类中，它为被观察的属性创建了 setter 方法，其工作原理如下：\n\n```objc\n- (void)setNow:(NSDate *)aDate\
  \ {\n    [self willChangeValueForKey:@”now”];\n    [super setValue:aDate forKey:@”now”];\n\
  \    [self didChangeValueForKey:@”now”];\n}\n```\n\n这是在运行时完成的，而不是编译时。这就是为什么正确命名是如此重要的原因。只有当你使用\
  \ KVC 命名规范时，KVO 才能识别出这一点。\n\n很难检测到 KVO 的类交换。它重写了 `class` 方法来返回原始类。但偶尔你会看到引用指向 `NSKVONotifying_MYClass`\
  \ 而不是 `MYClass`。\n\n## KVO 权衡\n\nKVC 是一项强大的技术，但除了可能比直接方法调用要慢之外，它通常认为是件好事。一个主要的缺点是你丢失了对属性名称的编译时检查。无论你是否直接使用\
  \ KVC，都应该始终遵循 KVC 命名规范编写代码。当你当你想要从 nib 文件实例化对象时（这需要 KVC），这会为你节省很多麻烦。它还让你的代码对其他 Objective-C\
  \ 开发者更易读，因为他们期望某些名称代表某些含义。在大多数情况下，这意味着将你的 getter 和 setter 分别命名为 `property` 和 `setProperty:`。\n\
  \n另一方面，KVO 则优誉参半。它可能有用，也可能带来麻烦。它的实现方式极具“魔法性”，且某些用法非常笨拙。对 `addObserver:forKeyPath:options:context:`\
  \ 的调用与 `removeObserver:forKeyPath:` 的调用并不完全平衡。考虑以下代码：\n\n```objc\n[target addObserver:self\
  \ forKeyPath:@”foo” options:0\n               context:@”first”];\n[target addObserver:self\
  \ forKeyPath:@”foo” options:0\n               context:@”second”];\n[target removeObserver:selfForKeyPath:@”foo”];\n\
  [target removeObserver:selfForKeyPath:@”foo”];\n```\n\n第一次调用 `removeObserver:forKeyPath:`\
  \ 移除了之前的观察者。第二次调用会导致程序崩溃。这听起来可能很牵强，但考虑一下你和父类都在观察同一个对象的属性的情况。在不了解父类实现的情况下，没有简单的方法可以实现这一点。如果父类是\
  \ UIKit 类，你甚至没有源代码可以查看它在观察什么。你只能希望它现在或将来不会发生冲突。\n\n单单这一个问题就让 KVO 难以像 `NSNotification`\
  \ 那样使用。同样，因为如果你不是键路径的观察者，`removeObserver:forKeyPath:` 将崩溃，所以你必须跟踪具体观察了哪些属性。KVO 没有像\
  \ `NSNotificationCenter removeObserver:` 那样的对应方法，而后者可以方便地清理你可能的所有观察者。\n\nKVO 产生了微妙的代码路径惊喜。当你调用\
  \ `postNotification:` 时，你知道会有其他代码运行。你可以在代码中搜索通知名称并通常能找到所有可能发生的事情。仅仅设置你自己的某个属性就能导致程序未知部分的任意代码执行，这可能令人非常惊讶，而且要通过搜索代码发现这一点更加困难。这使得调试错误变得非常困难。通常情况下，KVO\
  \ 错误很难解决，因为很多活动是“自动发生”的，而没有任何可见的代码触发它们。\n\n因此，KVO 最大的优势也是它最大的危险。它有时可以极大减少你编写的通用代码。特别是，它可以消除为了调用某些\
  \ `updateSelf` 方法而手动构建所有 setter 的常见问题。通过这种方式，它可以减少因错误复制粘贴代码而导致的错误。但它也可能注入非常令人困惑的错误，而且随着自动引用计数（ARC）的引入，手写的\
  \ setter 变得更容易正确编写。\n\n我的建议是谨慎、简单地使用 KVO，并且仅在它有真正益处的地方使用。如果你需要大量的观察数量（数百个或更多），它的性能扩展性比\
  \ `NSNotification` 好得多。它能让你在不修改被观察类的情况下获得 `NSNotification` 的优势。而且它有时需要的代码更少，尽管你需要包含所有为了绕过微妙\
  \ KVO 问题可能需要的特殊情况代码。在 `KVCTableViewCell` 示例中，手动编写 `setProperty:` 和 `setTarget:`\
  \ 比等观察 `property` 和 `target` 的 KVO 解决方案节省了约 15 行代码。\n\n\n\n\n在存在复杂的依赖关系或复杂的类层次结构的情况下，请避免使用\
  \ KVO。使用代理（delegate）和 `NSNotification` 的简单方案通常比使用 KVO 的过度巧妙的方案更好。\n\n另一方面，Apple\
  \ 显然正在性能关键型框架中向 KVO 靠拢。它是处理 `CALayer` 和 `NSOperation` 的主要方式。你应该预期在新的底层类中更频繁地看到它。它的优势是零开销观测。如果某个实例没有观察者，那么\
  \ KVO 是免费的；而即使没有观察者，代理方法和 `NSNotification` 仍然必须执行工作。对于底层、性能关键的节点，KVO 是明显的胜者。请明智地使用它。\n\
  \n### 总结\n\n在本章中，你学习了 Objective-C 中两种最强大的技术：KVC 和 KVO。这些技术提供了在其他语言中难以实现的运行时灵活性。编写符合\
  \ KVC 规范的代码是 Cocoa 程序的关键部分，无论你是否直接调用了 `valueForKey:`。KVO 可能很难用用它，但当你需要高性能观测时，它是一个强大的工具。作为一名\
  \ Cocoa 开发者，在设计类时需要记住 KVC 和 KVO。遵循几个简单的命名规则将产生巨大的差异。\n\n## 进一步阅读\n\n### Apple 文档\n\
  \n以下文档可以在 iOS Developer Library 的 [`developer.apple.com`](http://developer.apple.com/)\
  \ 中或通过 Xcode 文档和 API 参考获取：\n\n- 键值编码编程指南（Key-Value Coding Programming Guide）\n-\
  \ 键值观测编程指南（Key-Value Observing Programming Guide）\n- NSKeyValueCoding 协议参考\n- NSKeyValueObserving\
  \ 协议参考\n\n## 第 16 章：与众不同：Blocks 与函数式编程\n\n编程范式分为三大类类：过程化编程、面向对象编程和函数式编程。大多数现代编程语言——如\
  \ Java、C# 或 Objective-C——并不完全属于某一种特定范式。它们通常倾向于某一种范式，同时包含其他范式的某些方法论。Objective-C 主要是面向对象的，但它通过\
  \ blocks 借用了一些函数式方面。本章将介绍 Objective-C 中的函数式编程。\n\n函数式编程（FP）范式在理论上很容易解释，但其高度抽象的本质使其难以理解并发挥其威力。真正理解并欣赏\
  \ FP 的简单方法是实现一个实际系统。在本章稍后，你将通过编写一个常用 Cocoa 方法的 FP 等效实现来亲手尝试 FP，然后通过重构你在第 10 章中写的\
  \ `RESTEngine` 来使用 blocks 进一步深造。最后，你将学习从 iOS 4 开始在 Cocoa 框架中添加的一些基于 block 的方法。现在，让我们开始吧。\n\
  \n### 什么是 Block？\n\n简单来说，block 是一段临时的代码。就像处理整数或双精度原始数据类型一样，你声明一个 block 并开始使用它。你可以将\
  \ block 作为参数传递，将其“拷贝”以供以后使用，并可以执行你通常对原始数据类型所做的任何操作。资深 C 程序员一直使用函数指针来实现我刚才解释的大部分功能。block\
  \ 与函数指针（函数指针本身已经不同到可以被称为一种编程范式）的区别在于，它可以在另一个方法的词法作用域内声明，并且它可以“捕获”该作用范围内变量的状态。这意味着\
  \ block 拥有上下文信息，而程序员无需做任何操作，这与函数指针不同。\n\nblock 与函数指针的区别在于其编写方式，以及它捕获局部变量状态并可选地修改这些状态的固有本质。\n\
  \n现在，这段话并没有真正帮助你理解这个概念。它就像一个关于面向对象编程的章节中写道：“对象是一个封装了带数据的‘实体’。”如果你在概念上不理解它，你对使用 block\
  \ 和函数式编程范式就会犹豫不决。因此，在我讨论另一个抽象点之前，让我们通过跳出思维来弄清楚这一点。为此，我将向你展示一个与编程无关实际示例。\n\n### 为什么要使用函数式编程？\n\
  \n为了理解为什么你应该使用函数式编程范式，将其与编程世界之外的事物联系起来可能会有帮助。在这里在这里题一下，但我保证不会占用你几分钟的阅读时间。\n\n####\
  \ 人脑对比微处理器\n\n微处理器以可寻址的方式存储数据并执行指令处理它们。相反，人脑以联想的方式思考和存储“数据”。这里有一个例子：在微处理器上，你“存储”一个数字\
  \ 10，并通过其地址 0x8BADF00D 访问它。当你询问微处理器该数字的位置时，它会返回地址。人脑的工作方式不同。对“我的 iPhone 在哪？”问题的回答可能类似于“它在客厅的\
  \ DVD 机上”。人类的回答甚至不会像“它在客厅正门东北方向 5.04 米，角度 27.23 度”。人类将 iPhone 的位置与 DVD 机的位置联系起来，将\
  \ DVD 机的位置与客厅的位置联系起来。微处理器方式与人脑工作方式之间的思维过程存在巨大差异。这种思维过程的差异类似于过程化范式和函数式范式之间的区别。\n\n\
  #### 过程化对比函数式范式\n\n过程化编程的核心在于向微处理器提供指令。虽然这在几十年来一直效果良好，但某些现实世界的编程任务作为抽象概念来思考和表达比作为一组指令更容易。让我给你举个例子。（不，不是那个陈词滥调的阶乘例子；继续读，这是关于\
  \ Objective-C 的）。\n\n##### 一个“函数型”UIAlertView\n\n对于这个示例，你想显示一个 `UIAlertView` 并在用户点击确认按钮时执行操作。此事的过程化方法是创建一个\
  \ `UIAlertView` 对象，拥有它的代理并实现回调，显示 `UIAlertView` 然后释放它。\n\n###### UIAlertView 示例（过程化方法）\n\
  \n```objc\n-(IBAction) buttonTapped:(id) sender  {\n  UIAlertView *alert = [[UIAlertView\
  \ alloc] initWithTitle:@”发送邮件”\n  message:@”你确定想现在发送它吗？”\n  delegate:self\n  cancelButtonTitle:@”取消”\n\
  \  otherButtonTitles:@”发送”, nil];\n  [alert show];\n  [alert release];\n}\n\n-(void)alertView:(UIAlertView*)\
  \ alertView didDismissWithButtonIndex:(NSInteger) buttonIndex  {\n  if(buttonIndex\
  \ != [alertView cancelButtonIndex])  {\n    [self sendTheMail];\n  }\n}\n\n-(void)\
  \ sendTheMail  {\n  // 编写发送邮件的实际代码\n}\n```\n\n撇开实现（和语法），现在让我们如何调用一个遵循函数式范式的 `UIAlertView`。\n\
  \n###### UIAlertView 示例（函数式方法）\n\n```objc\n[UIAlertView showAlertViewWithTitle:@”发送邮件”\n\
  message:@”你确定想现在发送它吗？”\ncancelButtonTitle:@”取消”\notherButtonTitles:[NSArray arrayWithObjects:@”发送”,\
  \ nil] onCompletion:^{\n  // 编写发送邮件的实际代码\n}\nonCancel:^{\n  // 编写处理其他情况的代码\n}\n\
  ];\n```\n````\n\n这要干净得多。\n\n■ 你不需要实现代理。\n\n■ 你不需要分配或释放对象。\n\n■ 你不需要显式地显示警框。\n\n\
  相反，你指定你的意图，事情就会在后台自动为你完成。\n\n\n\n在函数式范式的示例中，你的代码读起来就像英语。你以声明的方式说明你的标题是什么，以及你需要显示的消息是什么。当用户关闭警报时，你声明式地说明在两种情况下分别执行什么代码：接受警报关闭和通过取消警报关闭，而不是实现一个代理（delegate）。\n\
  \n这一点在于，你不是在下达指令，而是指定你的意图，代码变得更加易读且易遵循。\n\n当你在单个视图控制器中显示多个警报，并使用标签在回调代理中区分警报视图时，你会发现这段代码的价值。如果你理解这一点，你就掌握了函数式编程范式的精髓。\n\
  \n在本章稍后的部分，你将学习如何作为 `UIAlertView` 的分类（category）扩展来实现这种方法，以及相关的语法和其他关联内容。\n\n你可能会奇怪，既然微处理器仍然是一条一条地执行指令，为什么还要花精力于函数式编程。这是一个很好的问题。函数式范式几乎总是为了编写便于共同开发者阅读和理解的软件。在几乎所有情况下，等价的命令式逻辑执行成本更低，但根据摩尔定律和微处理器速度的增长率，代码的清晰度往往比编写高效代码更重要。同样，这并不总是意味着你应该遵循函数式范式。并不是每个现实世界的问题都能用函数式的方式来表示。\n\
  \n我希望已经说服了你学习并使用函数式范式，让我们让我们进入它的技术细节。\n\n## 声明一个 Block\n\n你使用 `^`（脱字符）字符声明一个 block。\n\
  \n```objc\nint (^MyBlock)(int parameter1, double parameter2);\n```\n\n此语法用于一个名为\
  \ `MyBlock` 的 block，它接受一个 `int` 和 `double` 作为参数并返回一个整数。在大多数应用程序中，你会这样对 block 进行\
  \ `typedef`：\n\n```objc\ntypedef int (^MyBlock)(int parameter1, double parameter2);\n\
  ```\n\n你现在可以像声明任何其他数据类型一样声明你的 block 实例：\n\n```objc\nMyBlock firstBlock, secondBlock;\n\
  ```\n\n你可以这样分配一个 block：\n\n```objc\nfirstBlock = ^(int parameter1, double parameter2)\
  \ {\n    // 在此处处写你的 block 代码\n    NSLog(@\"%d, %f\", parameter1, parameter2);\n\
  };\n```\n\n因为 block 接收一个 `integer` 和一个 `double` 作为参数，你可以像这样调用它们：\n\n```objc\nfirstBlock(5,\
  \ 2.3);\n```\n\n在这种情况下，调用此 block 将将数字 `NSLog` 输出到控制台。语法部分就是这些了。\n\n## 变量的作用域\n\n\
  你在本章早期已经了解到，与函数指针相比，block 可以访问其词法作用域内的变量。可选地，block 可以修改词法作用域内的变量，即使该变量已经离开了作用范围。为了让\
  \ block 访问词法作用域内的变量，Objective-C runtime 在栈（stack）上分配 block。\n\n当你将 block 作为参数传递给其他方法时，你应该将\
  \ block 拷贝到堆（heap）。这是因为 block 在作为参数使用时，会在最初创建它的栈帧被释放之后才被调用。你可以使用标准的 Objective-C\
  \ `copy` 消息来拷贝 block。这也会拷贝/保留（retain）其词法作用域内的变量。这是你在代码中使用 block 时应该理解的一个非常重要的概念。在下一节中，你将学习变量在什么情况下会被拷贝，什么情况下会被保留。\n\
  \n**警告**：block 不能被保留（retain）。发送 `retain` 消息是空操作，不会增加引用计数。通常你不会显式地发送 `retain` 消息。但当你将\
  \ block 声明为属性时，你应该留意你所使用的存储语义。即使是无能的 LLVM 编译器，当你使用 `retain` 作为 block 属性的存储类型时，也不会向你发出警告。\n\
  \n## 栈与堆\n\nblock 是一种不同的 Objective-C 对象。与传统对象不同，block 不是在堆上创建的。这主要有两个原因。第一个是性能：栈分配总是比堆快。第二个原因是访问其他局部变量的必要性。\n\
  \n现在，栈在函数作用域结束时会被销毁。如果你的 block 被传递给一个在其作用域销毁后仍需要它的方法，你应该拷贝你的 block。这就是 Objective-C\
  \ runtime 在后台执行魔术的地方。当 block 被拷贝时，它会从栈移动到堆。当你在 block 内部引用它时，在其作用域内定义的局部变量会被拷贝。所有被引用的\
  \ `NSObject` 子类都会被保留而不是拷贝（因为它们已经在堆上了，且 retain 比拷贝更耗时）。Objective-C runtime 给 block\
  \ 中的每一个局部变量提供一个 `const` 引用。这也意味着 block 默认不能修改上下文数据，类似下面的代码将导致编译错误。\n\n```objc\n\
  int statusCode = -1;\nMyblock b = ^{\n    statusCode = 4;\n};\n```\n\n但我之前说过 block\
  \ 可以“可选地”修改局部变量。为了允许修改，你使用 `__block` 修饰符来声明变量。因此 `statusCode` 的声明现在是：\n\n```objc\n\
  __block int statusCode = -1;\n```\n\n添加此额外修饰符的原因是指示编译器在 block 被拷贝时拷贝 `__block` 变量。拷贝是一个比\
  \ retain 或通过 `const` 引用传递更耗时的操作，实现者们决定将此交由开发者处理。\n\n`__block` 变量会被拷贝而不是保留。\n\n现在，回到之前基于\
  \ block 的 `UIAlertView` 示例，你的 block 拥有所有可用上下文信息，而无需声明任何额外的数据结构。你的 `UIAlertView`\
  \ `onDismiss` 或 `onCancel` block 方法可以访问局部变量，而不需要开发者手动管理（通过上下文参数）。\n\n然而，它也带随着一个你应该警惕的微小陷阱：引用循环（retain\
  \ cycle）。\n\n## 引用循环问题\n\n```objc\n__block TWTweetComposeViewController *controller\
  \ = [[TWTweetComposeViewController alloc] init];\n    [controller setInitialText:@\"\
  Test Tweet\"];\n    controller.completionHandler =\n      ^(TWTweetComposeViewControllerResult\
  \ result) {\n          controller = nil; // 引用循环问题\n          [self dismissModalViewControllerAnimated:YES];\n\
  \      };\n```\n\n如果你尝试像前面的代码那样在 block 中捕获变量，你就会导致永远不会被释放的引用循环。有了新的 LLVM 编译器，你通常不需要太担心这个，因为它足够聪明指出这个问题。\n\
  \n## 实现一个 Block\n\n现在你已经知道了 block 的工作原理，让我们来实现我在上一节中向你展示的基于 block 的 `UIAlertView`\
  \ 示例。之后，重构你的 `RESTEngine` 使用 block。\n\n### 基于 block 的 UIAlertView\n\n你希望这个示例的语法如下：\n\
  \n```objc\n[UIAlertView showAlertViewWithTitle:(NSString*)title\nmessage:(NSString*)\
  \ message\ncancelButtonTitle: (NSString*) cancelTitle\notherButtonTitles: (NSArray*)\
  \ otherButtons\nonCompletion:^{\n  // 编写发送邮件的实际代码\n}\nonCancel:^{\n  // 编写处理其他情况的代码\n\
  }];\n```\n\n按照以下步骤实现基于 block 的 `UIAlertView` 示例。\n\n1. 为 `UIAlertView` 添加一个分类类。你可以使用\
  \ Xcode 4.2 提供的分类模板。将分类类命名为 `UIAlertView` (Blocks)。\n\n2. 定义你的 Dismiss 和 Cancel\
  \ block。\n\n```objc\ntypedef void (^DismissBlock)(int buttonIndex);\ntypedef void\
  \ (^CancelBlock)();\n```\n\n3. 在头文件中添加方法定义：\n\n```objc\n+ (UIAlertView*) showAlertViewWithTitle:(NSString*)\
  \ title\n                message:(NSString*) message\n         cancelButtonTitle:(NSString*)\
  \ cancelTitle\n```\n\n\n\n\n```objectivec\notherButtonTitles:(NSArray*) otherButtons\n\
  onDismiss:(DismissBlock) dismissed\nonCancel:(CancelBlock) cancelled;\n```\n\n###\
  \ 4. 在实现文件中为 block 声明静态存储。\n\n```objectivec\nstatic DismissBlock _dismissBlock;\n\
  static CancelBlock _cancelBlock;\n```\n\n### 5. 实现你基于 block 的方法。\n\n```objectivec\n\
  + (UIAlertView*) showAlertViewWithTitle:(NSString*) title\n                    \
  \               message:(NSString*) message\n                         cancelButtonTitle:(NSString*)\
  \ cancelButtonTitle\n                                         otherButtonTitles:(NSArray*)\
  \ otherButtons\n                             onDismiss:(DismissBlock) dismissed\n\
  \                              onCancel:(CancelBlock) cancelled {\n  [_cancelBlock\
  \ release];\n  _cancelBlock  = [cancelled copy];\n  [_dismissBlock release];\n \
  \ _dismissBlock  = [dismissed copy];\n  UIAlertView *alert = [[UIAlertView alloc]\
  \ initWithTitle:title\n                                             message:message\n\
  \                                            delegate:[self self]\n            \
  \             cancelButtonTitle:cancelButtonTitle\n                            \
  \             otherButtonTitles:nil];\n  for(NSString *buttonTitle in otherButtons)\n\
  \    [alert addButtonWithTitle:buttonTitle];\n  [alert show];\n  return [alert autorelease];\n\
  }\n```\n\n注意，你已经将传递给方法的 block 参数拷贝到了静态存储中。因为你必须在稍后的 `UIAlertViewDelegate` 中调用这些\
  \ block 方法。\n\n### 6. 处理 `UIAlertViewDelegate`：\n\n```objectivec\n+ (void)alertView:(UIAlertView*)\
  \ alertView didDismissWithButtonIndex:(NSInteger) buttonIndex {\n  if(buttonIndex\
  \ == [alertView cancelButtonIndex])  {\n    _cancelBlock();\n  }\n  else  {\n  \
  \  _dismissBlock(buttonIndex - 1);// cancel 是按钮 0\n  }\n  [_cancelBlock release];\n\
  \  [_dismissBlock release];\n}\n```\n\n代理方法并不复杂。只需处理它并调用相应的 block 即可。通过大约 5 行代码，你就实现了一个基于\
  \ block 的 `UIAlertView`。这有助于在你的控制器中编写整洁、可读的代码。你也可以为 `ActionSheet` 实现类似的方法。你可以从书籍网站下载完整的源代码。在下一节中，你将按照相同的方法重构你的\
  \ `RESTEngine`。\n\n基于 block 的 `RESTEngine`\n\n在第 0 章中，你实现了一个与基于 REST 的服务通信的类。如下所示，`login`\
  \ 方法接收用户名和密码，并在代理中返回成功或失败的结果。\n\n`RESTEngine`（基于代理）\n\n```objectivec\n-(IBAction)\
  \ loginTapped:(id) sender {\n  [[RESTEngine sharedInstance] initWithName:@\"mugth\"\
  \ password:@\"abracabra\"];\n}\n-(void) loginSucceeded:(NSString*) accessToken {\n\
  \  NSLog(@\"Login successful and this is the access token %@\", accessToken);\n\
  }\n-(void) loginFailed:(NSError*) error {\n  NSLog(@\"Login failed. Check your password.\
  \ Error is:%@\", [error localizedDescription]);\n}\n```\n\n如果像你处理 `UIAlertView`\
  \ 那样重构代码，不是更简洁、更优雅吗？也就是说，与其实现代理，如果如果可以直接传递一段在登录成功时执行的 block 代码和另一个在登录失败时执行的 block\
  \ 代码，不是很棒吗？调用代码应该如下所示。\n\n`RESTEngine`（函数式范式）\n\n```objectivec\n-(IBAction) loginTapped:(id)\
  \ sender {\n  AppDelegate.engine =\n  [[RESTEngine alloc] initWithName:@\"mugth\"\
  \n                          password:@\"abracabra\"\n                     onLoginSucceeded:^(NSString*\
  \ accessToken) {\n                            NSLog(@\"Login successful and this\
  \ is the access token %@\", accessToken);\n                          }\n       \
  \                     onError:^(NSError* error) {\n                            NSLog(@\"\
  Login failed. Check your password. Error is:%@\", [error localizedDescription]);\n\
  \                          }] autorelease];\n  AppDelegate.engine.delegate = self;\n\
  }\n```\n\n这段代码读起来像英语，看起来也像英语。\n\n\n\n\n在下一节中，我们将简要介绍 iOS 和 OS X 的一个名为 `GCD` 的特性，并学习\
  \ GCD 中的 blocks 和调度队列如何协作以使并发实现变得更容易。之后，我将比较 GCD 和 `NSOperationQueue`，并就何时使用何者提供建议。\n\
  \n# GCD 中的调度队列\n\nGrand Central Dispatch（中央调度队列）是一个非常强大的特性，允许你轻松编写并发代码。它将管理多个线程和线程同步的负担交给了操作系统（iOS\
  \ 或 OS X）。当你使用 `GCD` 时，你创建了可以独立执行的单元，并让操作系统为你处理队列和同步。iOS（以及 OS X）上的 `GCD` 实现由一组\
  \ C 语言扩展、API 和运行时引擎组成。`GCD` 会自动确保如果可用（如 iPad 2），你的独立单元将在多个处理器上执行。作为开发者，你唯一需要的是设计你的重量型工作进程，以便它们相互独立运行（而不是共享同步数据的线程）。`GCD`\
  \ 还提供了上下文指针来在你的 blocks 之间共享数据，但讨论它们超出了本章的范围。\n\n`GCD` 提供三种类型的调度队列——串行（serial）、并发（concurrent）和主队列（main）——你可以向这些队列提交任务。串行队列按照先进先出（FIFO）顺序一次执行一个任务，而并发队列也按照\
  \ FIFO 顺序并行执行它们。主调度队列在主线程上执行操作，通常用于同步在不同串行/并发队列中执行的线程之间的执行。现在让我们看看如何创建一个调度队列并向其提交任务。\n\
  \n## 创建调度队列\n\n创建一个调度队列只需调用一个 C 函数即可：\n\n```objc\nmyQueue = dispatch_queue_create(\"\
  com.mycompany.myapp.myfirstqueue\", NULL);\n```\n\n要将任务异步分发到此队列，请使用 `dispatch_async`\
  \ 方法。该方法将你的 block 作为第二个参数。它本质上是将你的 block 排入到第一个参数指定的队列中。这还需要几行代码。\n\n```objc\ndispatch_async(myQueue,\
  \ ^(void) {\n  [self doHeavyWork];\n});\n```\n\n就是这样。在没有显式使用线程的情况下，用不到十行代码，你就在你的应用中实现了\
  \ `GCD`！以独立的方式设计你的 blocks 已经解决了大部分涉及同步的复杂性。例如，在前面的代码中，`doHeavyWork` 方法被设计为使用自己的数据进行独立工作。\n\
  \n假设 `doHeavyWork` 方法是一个图像处理方法。为了设计让它独立运行，对图像进行切片（垂直或水平），将每个切片传递给 block，并将其送到调度队列，而不是在共享同步变量上使用完整的图像数据。如果你有一张\
  \ 3200×2000 像素的图像并想对其应用过滤器，可以将其切分成 10 张每个 320×2000 像素的图像并独立处理它们。处理完成后，在主调度队列上将它们缝合并通知相关的观察者。\n\
  \n# NSOperationQueue 与 GCD 调度队列\n\n你已经知道 iOS 提供了另一种名为 `NSOperationQueue` 的队列机制。它也接受\
  \ block 作为参数并像调度队列一样对它们进行排序。现在你可能有一个问题：我什么时候应该使用 `GCD`，什么时候应该使用 `NSOperationQueue`？\n\
  \n`NSOperationQueue` 和 `GCD` 之间存在一些相似和不同之处。\n\n- `NSOperationQueue` 是使用 `GCD` 构建的，是它的更高级抽象。\n\
  - `GCD` 只支持 FIFO 队列，而提交到 `NSOperationQueue` 的操作可以重新排序（重新设置优先级）。\n- 在 `NSOperationQueue`\
  \ 中可以设置操作之间的依赖关系，但在 `GCD` 中不行。如果你的其中一个操作需要另一个操作生成的数据，你可以将该操作依赖于另一个操作，`NSOperationQueue`\
  \ 会自动按照正确的顺序执行它们。在 `GCD` 中，没有内置的支持来设置依赖。\n- `NSOperationQueue` 符合 KVO 规范。这意味着你可以观察任务的状态。这意味着你应该始终使用\
  \ `NSOperationQueue` 而不是 `GCD` 吗？答案是否定的。在执行速度方面，`NSOperationQueue` 比 `GCD` 旧。如果你使用\
  \ `Instruments` 对代码进行性能分析并认为你需要更多性能，请使用 `GCD`。通常在低级代码中，你可能没有任务依赖，也没有使用 KVO 观察状态的必要。一如既常，遵循唐纳德·柯努斯的话：“我们应该忘记微小的效率，比如在\
  \ 97% 的情况下：过早优化是万恶之根源”，只有当通过 `Instruments` 分析后性能有明显提升时，才使用低级的 `GCD`。\n\n# 基于 block\
  \ 的 Cocoa 方法\n\n随着 iOS 4 和 blocks 的引入，许多内置的 Cocoa 框架方法都有基于 block 的等效方法。在一个章节中涵盖每一个基于\
  \ block 的方法是不可能的，这需要专门的一本书。但 Apple 遵循一种模式。在本节中，我简要介绍一些接受 block 参数的方法，并就何时在框架中寻找基于\
  \ block 的等效方法提供提示和技巧。\n\n## 使用 blocks 的 UIView 动画\n\n在 iOS 4 之前，视图动画通常使用 `UIView`\
  \ 的类方法 `beginAnimations` 和 `commitAnimations` 完成。你在这两个语句内编写你想要动画的代码，并在调用 `commitAnimations`\
  \ 后执行动画。\n\n对视图 alpha 值进行动画的代码如下所示。\n\n### iOS 3 中的动画（不使用 blocks）\n\n```objc\n[UIView\
  \ beginAnimations:@\"com.mycompany.myapp.animation1\" context:&myContext];\n[UIView\
  \ setAnimationCurve:UIViewAnimationCurveEaseInOut];\n[UIView setAnimationDuration:1.0f];\n\
  [UIView setAnimationDelay:1.0f]; // 1 秒后开始\n[UIView setAnimationDidStopSelector:@selector(animationDidStop:finished:)];\n\
  \  self.imageView.alpha = 0.0;\n[UIView commitAnimations];\n```\n\n从 iOS 4 开始，`UIView`\
  \ 有几个等效的基于 block 的动画方法。你将非常常用的一种方法是 `animateWithDuration:delay:options:animations:completion:`。之前的代码片段可以使用此方法表示如下。\n\
  \n### iOS 4 及以上版本中的动画（使用 blocks）\n\n```objc\n[UIView animateWithDuration:1.0 delay:1.0\
  \ options:UIViewAnimationCurveEaseInOut\n                 animations:^{\n      \
  \              self.imageView.alpha = 0.0;\n                 }\n               completion:^(BOOL\
  \ finished) {\n                    [self.imageView removeFromSuperView];\n     \
  \            }];\n```\n\n注意，blocks 版本在动画完成后也移除了 `imageView`，这在 iOS 3 版本的回调方法 `animationDidStop:animated:`\
  \ 中完成（此处未演示）。其他基于 block 的动画方法是该方法的变，省略了 delay、options 和 completion block 等参数。该方法的一个巨大优势是，你不需要维护通常通过\
  \ `setAnimationWillStartSelector:` 和 `setAnimationDidStopSelector:` 设置的上下文。由于 block\
  \ 感知本地上下文，你甚至不需要上下文参数。\n\n## 呈现和消失控制器\n\niOS 5 引入了用于呈现和消失控制器的新方法，它接受一个 block 参数，该参数必须在呈现（或消失）动画完成后调用。该\
  \ block 参数在 `viewDidDisappear` 被调用后执行。在 iOS 5 之前，你可能在 `viewDidDisappear` 中执行一些清理代码。有了\
  \ iOS 5 中的这个方法，你可以轻松地在完成 block 中完成工作。方法可以这样调用。\n\n### 呈现\n\n```objc\n[self presentViewController:myViewController\
  \ animated:YES completion:^{\n}];\n```\n\n\n\n\n\n```objective-c\n//添加在视图显示后应该执行的代码\n\
  }];\n```\n\n### 移除控制器 (Dismissing)\n\n```objective-c\n[self dismissViewControllerAnimated:YES\
  \ completion:^{\n  //添加在视图显示后应该执行的代码\n}];\n```\n\n### TweetComposer 与应用内邮件/短信\n\n\
  在 iOS 5 中，Apple 了对 Twitter 的原生支持，需要发送推文的 App 只需要实例化 `TWTweetComposerViewController`，预先填充要推文的文本，然后将其呈现给用户。这种实现方式与你通常发送应用内邮件或短信的方式非常。然而，`TWTweetComposeViewController`\
  \ 通过块（block）参数而不是代理（delegate）来报告完成。你的回调处理器（completion handler）看起来类似于下面的代码。\n\n####\
  \ TwTweetComposeViewController 回调处理器\n\n```objective-c\ncontroller.completionHandler\
  \ = ^ (TWTweetComposeViewControllerResult result) {\n    [self dismissModalViewControllerAnimated:YES];\n\
  \    switch (result) {\n        case TWTweetComposeViewControllerResultCancelled:\n\
  \            break;\n        case TWTweetComposeViewControllerResultDone:\n    \
  \        break;\n    }\n};\n```\n\n### 使用 NSDictionary enumerateWithBlock 进行字典枚举\n\
  \n使用块的方法进行字典枚举肯定会让你的代码更整洁。你不再需要处理 `keyEnumerator` 或 `objectForKey` 方法。使用基于块的等效方法要容易得得多，如下所示：\n\
  \n```objective-c\n[dictionary enumerateKeysAndObjectsUsingBlock:^(id key, id val,\
  \ BOOL *stop) {\n    //NSLog(@”@, %@”, key, val);\n}];\n```\n\n### 寻找基于块的方法\n\n\
  Cocoa 框架在 경우块时遵循一种模式。我列出了一些这类方法，它们可以帮助你在 Cocoa 框架中搜索等效的基于块的方法。\n\n- 检查当前的 Cocoa\
  \ 方法是否有一个上下文参数（context parameter）。如果有，那么很有可能存在基于块的等效方法。\n- 寻找具有一个或两个可选方法的代理。你可能会为以前通过代理通知结果的类找到\
  \ `completionHandler`。\n- 枚举、排序和过滤方法大多有块等效方法。示例包括 `NSArray`、`NSDictionary`、`NSString`、`NSAttributedString`、`NSFileManager`\
  \ 等。\n\n一旦你习惯了 Cocoa 框架的设计模式和函数式编程范式，你应该能够直觉地判断一个方法是否具有等效的基于块的方法。\n\n### 支持的平台\n\
  \n块是非常新的特性，从 iOS 4 和 Snow Leopard 开始受到支持。这意味着当你使用块时，你应该将 iOS 项目的最低部署目标提高到 iOS 4.0，将\
  \ Mac 项目提高到 Mac OS X 10.6。来自各种博客的统计显示，超过 95% 的设备运行着 iOS 4 及以上版本。（例如，参见 Cocoanetics\
  \ 在 2011 年 8 月对 Marco Arment 发表的 Instapaper 用户统计数据的讨论[参见“进一步阅读”部分]。）这很快就会接近 100%。在\
  \ iOS 项目上，没有任何东西能阻止你使用块。在 Mac 上，Leopard 之前的操作系统不支持原生块。但但有一个第三方的、开源的基于块的运行时，名为 `PLBlocks`（参见“进一步阅读”部分），它允许在这些操作系统上支持块。对于\
  \ Mac 项目，我的建议是使用条件编译开始使用 Apple 等效的基于块的 Cocoa 方法，然后在 Snow Leopard/Lion 的使用率足够高时将其完全移除。我的预测这离这种情况不超过一年了。\n\
  \n### 总结\n\n本章讨论了函数式范式，这是一个非常强大的范式，可以让你的代码更具可读性（如 `UIAlertView` 示例），并帮助你编写更少的代码（如\
  \ `RESTEngine` 示例）。函数式编程将是面向对象编程之后的下一个大编程范式变革，你将看到越来越多的 Cocoa 方法使用并接受块。\n\nApple\
  \ 通常比其竞争对手更快让旧技术过时。这对于它生产的产品确实如此，对于它的 API 也是如此。`TWTweetComposeViewController` 类就是一个完美的例子。虽然它与\
  \ `MFMailComposeViewController` 类相似，但处理 `TWTweetComposeViewController` 的响应是通过 `completionHandler`\
  \ 的，不像 `MFMailComposeViewController` 使用代理。\n\n### 进一步阅读\n\n**Apple 文档**: 以下文档可以在\
  \ `developer.apple.com` 的 iOS 库或通过 Xcode 文档获取。\n\n**块编程主题**: 并发编程指南（Concurrency\
  \ Programming Guide）、从线程迁移（Migrating from threads）。\n\n**博客**:\n- `mikeash.com`:\
  \ Friday Q&A 2009-08-14: 实用 Practical Blocks (`http://www.mikeash.com/pyblog/2009-08-14-practical-blocks`)\n\
  - `cocoawithlove`: 块是如何实现的（以及后果） (`http://cocoawithlove.com/2009/10/how-blocks-are-implemented-and`)\n\
  - `Cocoanetics`: 现实世界中的 iOS 版本 (2011-08) (`http://www.cocoanetics.com/2011/08/ios-versions-in-wild/`)\n\
  - `marco.org`: Instapaper 3.0 的 iOS 设备和操作系统版本统计 (`http://www.marco.org/2011/03/24/ios-device-and-os-version-stats-from-instapaper-3-0`)\n\
  - `jcmultimedia.com.au`: 值得支持 iOS 3 设备吗？ (`http://blog.jcmultimedia.com.au/2011/03/is-it-worth-supporting-ios-3-in-2011.html`)\n\
  \n\n\n\n\n本章将向你展示可以使用的缓存技术，以解决由于连接不佳或不可用导致的性能缓慢问题。正如你在第 10 章中看到的，连接互联网的应用程序分为两大类。第一类是得像在线网络服务前端的应用，在本章中，你将首先为第\
  \ 10 章中开发的基于网络服务的应用（`iHotel` 应用）设计一个缓存子系统。第二类应用是将用户生成的内容与远程服务器同步。在 iOS 5 中，Apple\
  \ 引入了一个新的云平台，用于在用户拥有的所有 Apple 设备之间同步数据，在本章稍后，你将查看通过新的 `iCloud` 服务在设备间同步用户数据的不同方法。\n\
  \n## 离线运行的原因\n\n应用可能需要离线工作的主要原因是提高应用的感知速度。你可以通过缓存应用的内容来实现离线。有两种缓存技术可以帮助你的应用离线工作。第一种是**按需缓存（on-demand\
  \ caching）**，应用在请求产生时缓存响应，就像你的网络浏览器一样。第二种是**预缓存（precaching）**，你完全缓存内容以便进行离线访问。\n\
  \n像我们在第 10 章开发的网络服务应用使用按需缓存技术来提高应用的感知速度，而不是为了提供离线访问。离线访问恰好是一个额外的优势。Twitter、Facebook\
  \ 和 foursquare 都是很好的例子。这些应用引入的数据往往很快就会过期。你对几天前发布的推文感兴趣吗？或者想知道朋友上周在哪里？通常情况下，一条推文或签到的相关性仅在几小时内重要，24\
  \ 小时后就会失去部分或全部重要性。尽管如此，大多数 Twitter 客户端都会缓存推文，而官方 foursquare 客户端会在你在没有活动连接的情况下打开应用时，显示应用的最后状态。你甚至可以在喜欢的\
  \ twitter 客户端（如 Twitter for iPhone、`Tweetbot` 或任何你喜欢的）上尝试一下：打开一个朋友的资料页并查看他的时间线。应用获取时间线并填充页面。在加载时间线时，你会看到一个旋转图标。现在跳到另一个页面再回来打开时间线。你会发现它是即时加载的。应用仍然会在后台刷新内容（基于你之前打开的时间），但它不是显示一个无趣的旋转图标，而是显示之前缓存的内容，从而让它看起来很快。如果没有这种缓存，用户在每个页面都会看到旋转图标，这会缓慢地让他们感到沮丧。无论网络连接快慢，作为\
  \ iOS 开发人员，你有责任减轻这种影响，并提供应用加载很快的感知。这在提高客户满意度方面大有帮助，从而提升你的应用在 App Store 上的评分。\n\n\
  另一种缓存类型更重视被缓存的数据。示例包括 Google Reader 客户端、如 `Instapaper` 之类的稍后阅读应用等。现在你已经有了背景知识；在下一节中，你将学习如何为第\
  \ 10 章设计并开发的 `iHotel` 应用添加一个缓存层。\n\n### 缓存策略\n\n上一节讨论的两种缓存技术——按需缓存和预缓存——在设计和实现上非常不同。对于**按需缓存**，你将从网络服务获取的内容内容存储在本地文件系统中（以某种格式），然后对于每个请求，你都会检查缓存中是否存在该数据，只有当数据不可用（或过期）时才从服务器进行获取。因此，你的缓存层行为大体类似于处理器上的缓存内存。获取数据的速度比数据本身更重要。相反，当你进行预缓存时，你将内容保存在本地以便日后访问。对于预缓存，数据丢失是不可接受的。例如，考虑一种场景：用户下载了文章准备在地铁上阅读，结果发现这些文章不在他的设备上了。\n\
  \nTwitter、Facebook 和 foursquare 属于按需类，而 `Instapaper` 和 Google Reader 客户端属于预缓存类型。\n\
  \n要实现预缓存，你可能会使用后台线程来访问数据并以有意义的表示将其存储在本地。我所说的“有意义”是指你应该以一种允许你在本地进行修改的方式保存内容。`Core\
  \ Data` 是实现此点的一种方法。按需缓存并不强制这一要求。实现方式具体取决于你正在构建的应用。\n\n按需缓存的工作原理就像浏览器的缓存，允许你查看以前看过的内容。缓存发生在你打开视图控制器时（按需），而不是在后台线程中发生。\n\
  \n下一节将将讨论并比较这两种缓存技术。\n\n## 存储缓存的方法\n\n当应用保存信息时，它通常将其保存到应用程序的沙箱中。因为缓存数据不是用户创建的，它不应该保存到\
  \ `NSDocumentsDirectory`，而应该保存到 `NSCachesDirectory`。一种良好的做法是为所有缓存数据创建一个自包含的目录。在本例中，你将在\
  \ caches 文件夹中创建一个名为 `MyAppCache` 的目录。你可以使用以下代码创建此目录：\n\n```\nNSArray *paths = NSSearchPathForDirectoriesInDomains(NSCachesDirectory,\
  \ NSUserDomainMask, YES);\nNSString *cachesDirectory = [paths objectAtIndex:0];\n\
  cachesDirectory = [cachesDirectory stringByAppendingPathComponent:@”MyAppCache”];\n\
  ```\n\n在 caches 文件夹中创建此目录的原因是 `iCloud`（以及 iTunes）备份不包含此目录。如果你在 Documents 目录目录创建大型缓存文件，它们会被上传到\
  \ iCloud 并迅速耗尽有限的空间（编写时约为 5GB）。你不想这样做——你希望成为 iPhone 的一个良好公民，对吧？`NSCachesDirectory`\
  \ 正是为此设计的。\n\n缓存或保存数据既可以通过存储数据归档来实现（使用 `NSKeyedArchiver`），也可以使用更高级的数据库（如 SQLite）或对象框架（如\
  \ `Core Data`）。你应该根据需求仔细选择技术。在本章稍后的“NSKeyedArchiver 对比 Core Data”部分中，我将提供关于何时使用\
  \ `NSKeyedArchiver` 何时使用 `Core Data` 的建议。在此之前，你将处理 `NSKeyedArchiver` 和 `Core Data`\
  \ 的实现细节。\n\n### 实现 NSKeyedArchiver\n\n`NSKeyedArchiver` 的实现通过实现 `NSCoding` 协议。让你的模型类遵循\
  \ `NSCoding` 协议，如下代码所示：\n\nNSCoding 方法\n\n```\n- (void)encodeWithCoder:(NSCoder\
  \ *)aCoder;\n- (id)initWithCoder:(NSCoder *)aDecoder;\n```\n\n当你的模型遵循 `NSCoding`\
  \ 时，归档它们就像调用以下一个方法一样简单：\n\n```\n[NSKeyedArchiver archiveRootObject:objectForArchiving\
  \ toFile:archiveFilePath];\n[NSKeyedArchiver archivedDataWithRootObject:objectForArchiving];\n\
  ```\n\n第一个方法在指定的路径 `archiveFilePath` 创建存档文件。第二个方法返回一个 `NSData` 对象。`NSData` 通常更快，因为没有文件访问开销，但它存储在你的应用程序内存中，如果不定期检查，很快就会耗尽内存。定期缓存到\
  \ iPhone 的闪存内存也不被建议，因为缓存内存与硬盘不同，它具有有限的读写周期。你应该以优化的方式平衡两者。你将在本章的“AppCache 架构”部分对此进行详细了解。\n\
  \n\n\n\n\n从归档创建你的模型对象是另一行代码。你可以根据需要解归档的位置，使用以下类方法中的一种。\n\n```\n[NSKeyedUnarchiver\
  \ unarchiveObjectWithData:data];\n```\n\n```\n[NSKeyedUnarchiver unarchiveObjectWithFile:archiveFilePath];\n\
  ```\n\n这两个方法在与序列化数据进行序列和反序列化转换时非常有用。\n\n使用任何 `NSArchiving` 方法都要求你的模型实现 `NSCoding`\
  \ 协议，如上所示。\n\n然而，这非常简单，简单到足够你甚至可以使用像 Accessorizer 这样的工具来自动化它。（参见“进阶阅读”部分中指向 Mac\
  \ App Store 中 Accessorizer 的链接。）\n\n接下来的章节将描述使用更具结构化的数据格式：Core Data 和 SQLite。\n\n\
  # Core Data\n\n正如 Marcus Zarra 所说，Core Data 与其说是一个对象序列化框架，不如说是一个数据库 API：\n\n人们认为\
  \ Core Data 是 Cocoa 的数据库 API，这是一个常见的误区。[…] 它是一个可以持久化到磁盘的对象框架（Zarra, 2009）。\n\n想要对\
  \ Core Data 有良好且深入的解释，请阅读 Marcus Zarra 编写的 `Core Data: Apple’s API for Persisting\
  \ Data on Mac OS X`Pragmatic Bookshelf, 2009. ISBN 9781934356326）。\n\n要在 Core Data\
  \ 中存储数据，首先创建一个 Core Data 模型文件并设计你的实体（Entities）和关系（Relationships）；然后编写保存和检索数据的方法。Core\
  \ Data 并不是几页纸就能解释清楚的简单东西。\n\n虽然技术上 Core Data 可以用于缓存数据，但我建议你只有在打算进行预缓存（pre-caching）时才使用它，而不是按需缓存（on-demand\
  \ caching）。Core Data 比 `NSKeyedArchiver` 的优势在于可以在不解档完整数据的情况下访问模型的属性。但在应用中实现 Core\
  \ Data 的复杂性抵消了这些优势，尤其是当你想要实现按需缓存时。此外，正如你之前学到的，预缓存要求将数据存储在具有意义的表示中，以便你方便地进行本地更改。Core\
  \ Data 正为此设计的。\n\n# 原生 SQLite\n\n通过链接 `libsqlite3` 库可以将 SQLite 嵌入到你的应用中，但它有很大的缺点。任何\
  \ `sqlite3` 库或对象关系映射（ORM）几乎总是比 Core Data 慢。此外，虽然 `sqlite3` 是线程安全的，但 iOS 自带的二进制文件不是。所以，除非你发布一个自定义的（使用线程安全标志编译的）`sqlite3`\
  \ 库，否则确保对 `sqlite3` 数据库的数据读写是线程安全的就是你的责任。因为 Core Data 提供的内容更多且是线程安全的，我建议在 iOS 上尽可能避免使用原生\
  \ SQLite。\n\n在你的 iOS 应用中使用原生 SQLite 代替 Core Data 的唯一例外是：当资源包中拥有特定于应用程序的数据，且这些数据被你应用支持的所有其他第三方平台共享时——例如，一个运行在\
  \ iPhone、Android、BlackBerry 以及（比如）Windows Phone 上的位置数据库。但再次，那也不是缓存。\n\n# NSKeyedArchiver\
  \ 对比 Core Data\n\n在可用于本地存储数据的不同技术中，有两种脱颖而出：`NSKeyedArchiver` 和 Core Data。在本节中，你将看到何时使用它们中的每一个。\n\
  \n如果你正在开发一个只需要为了提高感知性能而缓存数据的应用，建议使用 `NSKeyedArchiver`。它的唯一缺点是，由 `NSKeyedArchiver`\
  \ 创建的归档在访问内部任何一个变量之前，必须完全解档并加载到内存。Core Data 可以轻松访问单个模型，甚至搜索匹配给定谓词（predicate）的项列表，但如果你的应用只是为了性能改进而需要缓存，你不需要访问缓存模型中的单个属性。你通常会一次性使用完整的缓存内容。\n\
  \n另一方面，如果你需要数据离线可用，并且比简单的原始序列化形式更有意义，请使用像 Core Data 这样高级别的序列化。简之，如果你的应用需要预缓存而非按需缓存，请考虑使用\
  \ Core Data。但注意，基于 Core Data 的缓存非常复杂，并且对你的 iOS 应用需要大量更改。只有当你想要为应用实现真正的离线访问（如 Apple\
  \ 内置的邮件或日历应用）时才使用它。\n\n当你使用 Core Data 时，必须定期删除不再需要的数据，否则你的缓存将开始增长并减慢应用速度。\n\n程序员决定是使用\
  \ Core Data 还是继续使用 `NSKeyedArchiver` 的一种快速粗暴的方法是：判断你是否会在后台线程中下载数据，或者在下载后对数据进行任何后处理（预缓存）。如果你在后台线程下载数据，那可能意味着你需要比归档更有意义的格式的数据，并应该使用\
  \ Core Data。如果你对下载的数据进行后处理（例如，缓存 HTML 网页以供离线访问，并重写图像链接指向本地缓存的图像），你可能需要将 HTML 文本保存在\
  \ Core Data 中并在缓存缓存，然后编辑 HTML 文本以指向你的本地缓存图像。\n\n由于基于 Core Data 的缓存高度特定于你开发的应用，本章将更多地关注\
  \ `NSKeyedArchiver` 技术。\n\n# 缓存版本\n\n当你缓存数据时，你需要决定是否支持版本迁移。如果你使用按需缓存技术，则不需要版本迁移：当用户下载新版本时，你可以删除缓存，因为旧数据并不重要。另一方面，如果你的应用需要预缓存，你可能缓存了数兆字节的数据，只有将它们迁移到新版本才有意义（相比\
  \ sqlite）。\n\n# 缓存架构\n\n在本节中，你为第 10 章的 iHotelApp 添加缓存支持。iHotelApp 不需要真正的离线访问；它需要的是按需缓存。按需缓存是在视图离开层级时完成的（技术上是在你的\
  \ `viewWillDisappear:` 方法中）。支持缓存的视图器的基本结构如图 17-1 所示。具有缓存架构的完整代码可以从本章的源代码中获取。从这里开始，假设你已经准备好了这些代码。\n\
  \n![9781119961321-fg1701.eps](img/9781119961321_fmt.jpeg)\n\n图 17-1 实现按需缓存的视图器的控制流\n\
  \n在 `viewWillAppear` 方法中，检查显示此视图所需的缓存。如果可用，获取它并使用缓存数据更新用户界面。现在检查来自缓存的数据是否过期。你的业务规则应该决定哪些是新的旧。如果你判断内容是旧的，在\
  \ UI 上显示数据，并在后台从服务器获取数据并再次更新 UI。如果缓存中没有数据，在显示加载旋转的同时从服务器获取数据。获取数据后，更新你的 UI。\n\n\
  上面的流程图假设显示在 UI 上的模型是可以归档的。\n\n\n\n\n```objectivec\n[encoder encodeObject:self.itemDescription\
  \ forKey:@”ItemDescription”];\n[encoder encodeObject:self.waitingTime forKey:@”WaitingTime”];\n\
  [encoder encodeObject:self.reviewCount forKey:@”ReviewCount”];\n}\n```\n\n### MenuItem\
  \ 类的 initWithCoder 方法 (MenuItem.m)\n\n```objectivec\n- (id)initWithCoder:(NSCoder\
  \ *)decoder\n{\n    if ((self = [super init])) {\n        self.itemId = [decoder\
  \ decodeObjectForKey:@”ItemId”];\n        self.image = [decoder decodeObjectForKey:@”Image”];\n\
  \        self.name = [decoder decodeObjectForKey:@”Name”];\n        self.spicyLevel\
  \ = [decoder decodeObjectForKey:@”SpicyLevel”];\n        self.rating = [decoder\
  \ decodeObjectForKey:@”Rating”];\n        self.itemDescription = [decoder decodeObjectForKey:@”ItemDescription”];\n\
  \        self.waitingTime = [decoder decodeObjectForKey:@”WaitingTime”];\n     \
  \   self.reviewCount = [decoder decodeObjectForKey:@”ReviewCount”];\n    }\n   \
  \ return self;\n}\n```\n\n正如我之前提到的，你可以使用 `Accessorizer` 生成 `NSCoding` 协议的实现代码。\n\
  \n根据你在图 17-1 中看到的缓存流程图，你必须在 `viewWillAppear:` 方法中实现实际的缓存逻辑。以下添加到 `viewWillAppear:`\
  \ 中的代码实现了该逻辑。\n\n#### 你的视图控制器中 viewWillAppear 代码片段，用于从缓存中恢复模型对象\n\n```objectivec\n\
  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSCachesDirectory, NSUserDomainMask,\
  \ YES);\nNSString *cachesDirectory = [paths objectAtIndex:0];\nNSString *archivePath\
  \ = [cachesDirectory stringByAppendingPathComponent:@”AppCache/MenuItems.archive”];\n\
  NSMutableArray *cachedItems = [NSKeyedUnarchiver unarchiveObjectWithFile:archivePath];\n\
  if(cachedItems == nil)\n  self.menuItems = [AppDelegate.engine localMenuItems];\n\
  else\n  self.menuItems = cachedItems;\nNSTimeInterval stalenessLevel = [[[[NSFileManager\
  \ defaultManager] attributesOfItemAtPath:archivePath error:nil]\nfileModificationDate]\
  \ timeIntervalSinceNow];\nif(stalenessLevel > THRESHOLD)\n  self.menuItems = [AppDelegate.engine\
  \ localMenuItems];\n[self updateUI];\n```\n\n缓存机制的逻辑流如下：\n\n1. 视图控制器检查归档文件 `MenuItems.archive`\
  \ 中是否存在之前缓存的项目，并对其进行反序列化。\n2. 如果 `MenuItems.archive` 不存在，则调用从服务器获取数据。\n3. 如果 `MenuItems.archive`\
  \ 存在，则检查归档文件的修改日期以确定这些缓存数据有多旧。如果它已过期（根据你的业务需求确定），则从服务器重新获取数据。否则显示缓存数据。\n\n接下来，添加到\
  \ `viewDidDisappear` 方法中的以下代码会将你的模型（以 `NSKeyedArchiver` 归档的形式）保存到缓存目录。\n\n#### 你的视图控制器中\
  \ viewWillDisappear 代码片段，用于缓存你的模型\n\n```objectivec\nNSArray *paths = NSSearchPathForDirectoriesInDomains(NSCachesDirectory,\
  \ NSUserDomainMask, YES);\nNSString *cachesDirectory = [paths objectAtIndex:0];\n\
  NSString *archivePath = [cachesDirectory stringByAppendingPathComponent:@”AppCache/MenuItems.archive”];\n\
  [NSKeyedArchiver archiveRootObject:self.menuItems toFile:archivePath];\n```\n\n\
  当视图消失时，你会将 `menuItems` 数组的内容保存到归档文件中。注意，如果你在 `viewWillAppear` 中没有从服务器获取数据，请不要对其进行缓存。\n\
  \n因此，只需在视图控制器中添加少于十行的代码（以及模型中大量由 Accessorizer 生成的代码），你就能为你的应用添加缓存支持。\n\n### 重构\n\
  \n你将在应用中的多个视图控制器中使用这种缓存逻辑。这意味着在 `viewWillAppear` 和 `viewWillDisappear` 中会有大量的重复代码。为了方便起，你将学习如何重构这些代码并将文件名提取到不同的类中。我们将该类命名为\
  \ `AppCache`。重构这些代码，使视图控制器的 `viewWillAppear`/`viewWillDisappear` 块看起来像下面的代码。**粗体行**显示了重构时做的更改，并在代码后对其进行解释。\n\
  \n#### 使用 AppCache 类缓存模型的视图控制器 viewWillAppear 重构后代码片段。(MenuItemsViewController.m)\n\
  \n```objectivec\n- (void)viewWillAppear:(BOOL)animated\n{\n    NSMutableArray *cachedItems\
  \ = [AppCache getCachedMenuItems];\n    if(cachedItems == nil)\n      self.menuItems\
  \ = [AppDelegate.engine localMenuItems];\n    else\n      self.menuItems = cachedItems;\n\
  \    if([AppCache isMenuItemsStale])\n      self.menuItems = [AppDelegate.engine\
  \ localMenuItems];\n    [self updateUI];\n    [super viewWillAppear:animated];\n\
  }\n\n- (void)viewWillDisappear:(BOOL)animated\n{  \n  [AppCache cacheMenuItems:self.menuItems];\n\
  \  [super viewWillDisappear:animated];\n}\n```\n\n你的视图控制器中有几处重大变化，包括添加 `AppCache`\
  \ 类。`AppCache` 类从视图控制器中抽象了关于数据过性的知识。它还抽象了缓存存储的精确位置。在本章的后半部分，你将修改此 `AppCache` 以引入另一个层。\n\
  \n`AppCache` 类从视图控制器中抽象了关于数据过性的知识。它还抽象了缓存存储的精确位置。在本章的后半部分，你将修改此 `AppCache` 以引入另一个层。\n\
  \n（注：原文中存在大量重复段落，已按要求清理并保留核心信息）\n\n\n\n\n请注意，此代码依赖于一个获取应用程序当前版本的辅助方法。你可以使用这段代码从\
  \ app 的 `Info.plist` 文件中读取版本：\n\n### 从 Info.plist 文件获取当前 App 版本的代码 (AppCache.m)\n\
  \n```objc\n+(NSString*) appVersion\n{\n  CFStringRef versStr = (CFStringRef)CFBundleGetValueForInfoDictionaryKey(CFBundleGetMainBundle(),\
  \ kCFBundleVersionKey);\n  NSString *version = [NSString stringWithUTF8String:CFStringGetCStringPtr(versStr,kCFStringEncodingMacRoman)];\n\
  \  return version;\n}\n```\n\n前面的代码调用了一个方法来清除缓存目录。下面的代码片段说明了这一点。\n\n### 清除缓存目录中所有缓存文件的代码片段\
  \ (AppCache.m)\n\n```objc\n+(void) clearCache\n{\n  NSArray *cachedItems = [[NSFileManager\
  \ defaultManager] contentsOfDirectoryAtPath:[AppCache cacheDirectory] error:nil];\n\
  \  for(NSString *path in cachedItems)\n    [[NSFileManager defaultManager] removeItemAtPath:path\
  \ error:nil];\n}\n```\n\n### 创建内存缓存\n\n到目前为止出出的每一台 iOS 设备都包含了闪存内存，而这种闪存内存有一个小问题：在磨损之前，它的读写次数是有限的。虽然与设备的寿命相比，这个限制通常非常高，但避免频繁读写闪存内存仍然是重要的。在以前的示例中，你在视图隐藏时直接写入磁盘，并在视图显示时直接从磁盘读取。这可能会给用户设备上的闪存内存带来负担。为了避免这种情况，你可以引入另一个缓存层，将你的存档存储在内存中（`NSMutableDictionary`）。在“实现\
  \ NSKeyedArchiver”部分中，你学习了创建存档的两种方法：一种是保存到文件，另一种是保存为 `NSData` 对象。你将使用第二种方法，它会给你一个\
  \ `NSData` 指针，你可以将其存储在 `NSMutableDictionary` 中，而不是作为文件系统中的普通文件。引入内存缓存层获得的另一个优势是在归档和解归档内容时性能略高。虽然这听起来很复杂，但实际上并非如此。在本节中，你将查看如何为\
  \ `AppCache` 类添加一个透明的内存缓存。（内存缓存的透明性体现在，调用代码——`ViewController` 甚至不知道它的存在，也不需要任何代码更改。）你还设计了一个最久未使用（LRU）算法，以便缓存数据最近未被使用时将其写回磁盘。\n\
  \n列表列出了你创建内存缓存遵循的步骤。这些步骤将在后续章节中进行更详细的解释：\n\n1. 添加一些变量在内存中持有你的缓存数据。\n2. 限制内存缓存的大小，并将最久未使用的项目写入文件并从内存中移除。RAM\
  \ 是有限的，当你达到限制时，将收到内存警告。如果收到收到此警告时没有释放内存，你的应用程序将会崩溃。你显然不希望发生这种情况，对吧？因此你为内存缓存设置了一个最大阈值。当缓存满后添加任何内容时，最后使用的对象都应保存到文件（闪存内存）。\n\
  3. 处理内存警告并将内存缓存写入闪存内存（作为文件）。\n4. 在 App 关闭或退出时，将所有内存缓存写入闪存内存（文件）。\n\n### 设计 AppCache\n\
  \n让我们通过添加用于持有缓存数据的变量来开始设计 `AppCache` 类。如下代码所示，添加一个 `NSMutableDictionary` 来存储缓存数据，一个\
  \ `NSMutableArray` 用来按时间顺序跟踪最近使用的项目，以及一个限制此缓存最大大小的整数。\n\n#### AppCache 中的变量\n\n\
  ```objc\nstatic NSMutableDictionary *memoryCache;\nstatic NSMutableArray *recentlyAccessedKeys;\n\
  static int kCacheMemoryLimit;\n```\n\n现在你必须对 `AppCache` 中的 `cacheMenuItems:` 和 `getCachedMenuItems`\
  \ 方法进行修改，以便模型对象透明地保存到此内存缓存。\n\n```objc\n+(void) cacheMenuItems:(NSMutableArray*)\
  \ menuItems\n{\n  [self cacheData:[NSKeyedArchiver archivedDataWithRootObject:menuItems]\n\
  \             toFile:@”MenuItems.archive”];  \n}\n\n+(NSMutableArray*) getCachedMenuItems\n\
  {\n  return [NSKeyedUnarchiver unarchiveObjectWithData:[self dataForFile:@”MenuItems.archive”]];\n\
  }\n```\n\n前面的代码没有直接写入文件，而是调用了辅助方法 `cacheData:toFile:`。该方法将把来自 `NSKeyedArchiver`\
  \ 的 `NSData` 保存到内存缓存中。它还会检查并移除最久未访问的数据，并在达到内存项目数量的预设限制时将其保存到文件。该方法的实现如下代码所示。\n\n\
  #### 将数据透明缓存到内存缓存的辅助方法 (AppCache.m)\n\n```objc\n+(void) cacheData:(NSData*) data\
  \ toFile:(NSString*) fileName\n{\n  [memoryCache setObject:data forKey:fileName];\n\
  \  if([recentlyAccessedKeys containsObject:fileName])\n  {\n    [recentlyAccessedKeys\
  \ removeObject:fileName];\n  }\n  [recentlyAccessedKeys insertObject:fileName atIndex:0];\n\
  \  if([recentlyAccessedKeys count] > kCacheMemoryLimit)\n  {\n    NSString *leastUsedDataFilename\
  \ = [recentlyAccessedKeys lastObject];\n    NSData *leastUsedCacheData = [memoryCache\
  \ objectForKey:leastUsedDataFilename];\n    NSString *archivePath = [[AppCache cacheDirectory]\
  \ stringPathComponent:leastUsedDataFilename];\n    [leastUsedCacheData writeToFile:archivePath\
  \ atomically:YES];\n    [recentlyAccessedKeys removeObject];\n    [memoryCache removeObject:leastUsedDataFilename];\n\
  \  }\n}\n```\n\n与之前的代码（`cacheData:toFile:`）类似，你应该编写一个检查内存缓存并返回数据的方法，而不是直接从文件读取。该方法仅在需要时才访问文件。\n\
  \n#### 从内存缓存透明检索缓存数据的辅助方法 (AppCache.m)\n\n```objc\n+(NSData*) dataForFile:(NSString*)\
  \ fileName\n{\n  NSData *data = [memoryCache objectForKey:fileName];\n  if(data)\
  \ return data; // 数据在内存中\n  NSString *archivePath = [[AppCache cacheDirectory] stringPathComponent:fileName];\n\
  \  data = [NSData dataContentsOfFile:archivePath];\n  if(data)\n    [self cacheData:data\
  \ toFile:fileName]; // 将最近访问的数据放入内存缓存\n  return data;\n}\n```\n\n该方法还将从闪存内存读取的数据写回内存缓存，这就像缓存算法的工作方式。\n\
  \n### 内存警告\n\n大部分情况下，`AppCache` 现在已经完成，你在没有修改调用代码的情况下添加了透明内存缓存。然而，还有一件重要的事情要做。由于你保留了\
  \ `AppCache` 中视图的数据，应用程序的内存占用会继续增长，接收内存警告的可能性变得很高。为了避免这种情况，你在 `AppCache` 中处理内存警告通知。在静态初始化方法中，为\
  \ `UIApplicationDidMemoryWarningNotification` 添加通知观察者：\n\n```objc\n[[NSNotificationCenter\
  \ defaultCenter] addObserver:self selector:@selector(saveMemoryCacheToDisk:)\nname:UIApplicationDidMemoryWarningNotification\
  \ object:nil];\n```\n\n现在编写一个方法将内存缓存项写入文件：\n\n```objc\n+(void) saveMemoryCacheToDisk:(NSNotification\
  \ *)notification\n{\n  for(NSString *filename in [memoryCache allKeys])\n  {\n \
  \   NSString *archivePath = [[AppCache cacheDirectory] stringPathComponent:filename];\
  \  \n    NSData *cacheData = [memoryCache objectForKey:filename];\n    [cacheData\
  \ writeToFile:archivePath atomically:YES];\n  }\n  [memoryCache removeAllObjects];\
  \  \n}\n```\n\n\n\n\n这种方法确保了你的 `AppCache` 不会消耗可用系统内存，同时比直接从视图控制器写入文件的速度更快。\n\n##\
  \ 处理终止和进入后台的通知\n\n你还应该确保在应用退出或进入后台时保存你的内存缓存。这为你的按需缓存提供了额外的优势：离线访问。让我们添加第三步也是最后一步，即观察应用放弃活跃状态（resigning\
  \ active）或关闭的通知，并执行与上述相同的操作。不需要额外的方法；只需在 `initialize` 方法中为 `UIApplicationDidEnterBackgroundNotification`\
  \ 和 `UIApplicationWillTerminateNotification` 添加观察者即可：这是为了确保你的内存缓存被保存到文件系统。\n\n##\
  \ 观察通知并将内存缓存保存到磁盘 (AppCache.m)\n\n```\n[[NSNotificationCenter defaultCenter] addObserver:self\
  \ selector:@selector(saveMemoryCacheToDisk:)\nname: UIApplicationDidEnterBackgroundNotification\
  \ object:nil];\n\n[[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(saveMemoryCacheToDisk:)\n\
  name: UIApplicationWillTerminateNotification object:nil];\n```\n\n记得在 `dealloc`\
  \ 中也调用 `removeObserver`。要获取完整的 `AppCache` 代码，请从书籍网站下载代码示例。\n\n下一节将介绍缓存的一种流行用途（缓存缩略图/头像），并根据你在本章中学的内容提供如何设计\
  \ `ImageCache` 工具的指导。\n\n### 缓存图像\n\n在大多数与网络服务相关的应用中，你显示的数据通常包含相关的图像和缩略图。iOS 默认没有提供缓存这些图像和缩略图的机制。为了让这些缩略图加载更快，你需要对它们进行缓存。可以在缓存图像“过期”时失效这些缓存。这里的“过期”再次取决于业务规则。在一个销售壁纸的应用中，超过\
  \ 30 分钟的缩略图可能被认为是“旧”，而在缓存朋友头像缩略图的社交网络应用中，2 到 3 天前的头像是可以接受的。本节为设计一个可配置的 `ImageCache`\
  \ 工具提供了建议，它的工作方式与你之前编写的 `AppCache` 非常相似。\n\n ImageCache 的组件\n\n你将编写的图像缓存在架构上与 `AppCache`\
  \ 非常相似。它由两个主要组件组成。第一个组件是一个单例类，封装了类似于 `AppCache` 的完整缓存逻辑。第二个组件（与 `AppCache` 不同）是一个执行实际下载的\
  \ `NSOperation`。在许多方面，这个单例的行为非常像你在上一节中编写的 `AppCache`。就像 `AppCache` 具有读取和写入数据的公共方法一样，`ImageCache`\
  \ 单例也将将暴露用于请求新图像的方法。在“实现 NSKeyedArchiver”部分中，你学习了两种创建归档的方法：一种用于将它们保存到文件，另一种用于将它们保存为\
  \ `NSData` 对象。\n\n任何此类缓存组件在尝试下载之前，都应该检查请求请求的文件是否已经存在。与 `AppCache` 的设计类似，`ImageCache`\
  \ 应该具有两级缓存。一个是文件系统（闪存存储），另一个是内存缓存。\n\n## 创建 ImageCache 单例\n\n在这一节中，你将创建单例类并添加一个公共方法来接收用于获取图像的\
  \ URL。此外，该方法还封装了某些状态变量，例如内存中缓存的图像列表。这个内存缓存应该在应用创建的每一个 `ImageCache` 实例之间（假设它不是单例）共享。这对\
  \ `AppCache` 并不是一个要求，这也是为什么它不是单例的原因。\n\n`AppCache` 和 `ImageCache` 之间的区别在于，`AppCache`\
  \ 在你请求数据时立即返回数据。你获取的数据要么在内存中，要么文件中。如果数据不存在，`AppCache` 直接返回 `nil`，这在这种情况下是完全可以的。`ImageCache`\
  \ 并非如此。如果你请求的图像本地不存在，你必须从 URL 获取它。这意味着 `ImageCache` 无法在调用它的同一个方法中返回数据。在第 16 章，你学习了块（blocks）以及如何将函数块作为参数传递。你将使用在那里学的技术来设计你的\
  \ `ImageCache`。`ImageCache` 将从远程源获取图像后通过调用块返回数据。调用者将在图像获取后异步收到图像获取通知。\n\n以下是 `ImageCache`\
  \ 单例第一个也是唯一的公共方法：\n\n```\n-(void) imageAtURL:(NSURL*) url onCompletion:(void(^)(UIImage*\
  \ image, NSURL* url)) imageFetchedBlock;\n```\n\n现在你有一个接受两个参数的方法：一个 URL 和一个块。下面的列表列出了方法的流程。\n\
  \n1. `ImageCache` 单例检查此 URL 图像是否已存在于内存缓存中。如果存在，通过调用块方法返回图像。\n2. 检查图像是否存在于文件系统（之前已缓存）。然后，根据此检查的结果，执行以下操作之一：\n\
  \   - 如果存在，应将图像取回并存储在内存缓存中，然后通过调用块方法返回给调用者。\n   - 如果图像在任何本地缓存中都不存在，从远程源获取。为此，你编写了一个\
  \ `NSOperation` 子类（`ImageFetchOperation`），并对传入的图像请求进行队列。当操作完成，`ImageFetchOperation`\
  \ 通过调用块方法通知调用者。`ImageCache`应该将块传递给 `ImageFetchOperation` 类，以便 `ImageFetchOperation`\
  \ 将获取的图像传递给调用者。\n\n为了提高性能的一个重要步骤是检查图像请求是否已排队。如果请求的 URL 当前在队列中尚未下载，只需将新块添加到该 `ImageFetchOperation`\
  \ 中。这确保了图像获取时会通知所有调用者，但只执行一次实际获取。这本质上是对 `ImageCache` 的性能增强。\n\n`ImageCache` 单例的属性如下\n\
  \n### ImageCache.m 中的属性\n\n```objc\n@property (nonatomic, strong) NSOperationQueue\
  \ *imageFetchQueue;\n@property (nonatomic, strong) NSMutableDictionary *runningOperations;\n\
  @property (nonatomic, strong) NSMutableDictionary *memoryCache;\n@property (nonatomic,\
  \ strong) NSMutableArray *memoryCacheKeys;\n```\n\n## ImageFetchOperation – NSOperation\
  \ 子类\n\n`NSOperation` 子类的实现非常简单且直接。它所做的只是接受一个 URL 和几个要调用的块。其中一个是操作结束时调用的块，以便 `ImageCache`\
  \ 单例标记该 URL 为完成；另一个是将获取的图像传递给调用者的块。这是 `ImageCache` 从其调用者接收到的同一个块，并复制到了此操作中。\n\n\
  `ImageFetchOperation` 头文件的基本方法所示：\n\n### ImageFetchOperation.m 中的属性和方法\n\n```objc\n\
  @property (nonatomic, strong) NSURL *photoURL;\n@property (nonatomic, strong) NSMutableArray\
  \ *observerBlocks;\n\n-(id) initWithURL:(NSURL*) url onCompletion:(void(^)()) completionBlock;\n\
  -(void) addImageFetchObserverBlock:(void(^)(UIImage* image, NSURL* url)) observerBlock;\n\
  ```\n\n实现非常简单。获取 URL 并检查返回的 MIME 类型是否为图像。如果是图像，则构造 `UIImage` 对象并调用所有块。如果不是图像，则记录消息。\n\
  \n\n\n\n- 根据你在最后几节以及之前关于 `AppCache` 章节中学到的内容，请尝试自己实现 `ImageCache`。如果你需要帮助，书籍网站上一直有本章的完整源代码供你参考。\n\
  \n# 使用 iCloud\n\n在 iOS 5（以及 Mac OS X Lion）中，Apple 引入了一个全新的可以说是最重要的功能或服务，称为 `iCloud`。`iCloud`\
  \ 存储你的内容并将其持续推送到与特定 Apple 关联的所有设备。对于终端用户来说，这种集成是无缝的并且是“自动发生的”。然而，为了给客户提供这种用户体验，必须完成一些复杂的开发工作。\n\
  \n在 `iCloud` 之前，开发者支持 `Dropbox Sync` 来跨用户设备同步数据。虽然这解决了 iOS 4 时代的数据同步问题，但它仍然限于扁平文件，最重要的是，你的用户必须拥有\
  \ Dropbox 账户，并且要在你的 App 中使用 Dropbox 凭据登录。有了 `iCloud`，不需要这种登录。如果用户运行 iOS 5，你就可以访问为\
  \ App 声明的 `iCloud` 数据存储。用户无需任何额外的步骤或操作。此外，`iCloud` 支持键值数据存储，并对由 Core Data 管理的应用提供了极佳的支持。如果你的\
  \ App 是以数据为中心的，`iCloud` 本身应该是将 App 迁移到 iOS 5 的理由。\n\n# 在 iCloud 上管理文档和键值数据存储\n\n\
  你可以在 `iCloud` 上存储两种数据：传统文件（文档文件存储）和键值数据。如果你的 App 目前使用 `NSUserDefaults` 存储 App 特定的设置，你可能考虑使用\
  \ `iCloud` 键值数据存储来跨用户设备同步这些设置。在 `iCloud` 上存储文档的优方法是将持久模型设计为 `UIDocument` 或 `UIManagedDocument`\
  \ 的子类。接下来的章节将讨论它们之间的。\n\n## UIDocument\n\n使用 `UIDocument` 并不是 `iCloud` 的前提；但如果你自己管理单个文件，还应该管理文件呈现器（presenters）和协调器（coordinators），以支持\
  \ `iCloud` 的锁定机制。`UIDocument` 内置了对此支持。此外，它有助于解决其他设备更新引起的版本冲突。\n\n`UIDocument` 另一个重要功能是它对管理文件包（file\
  \ packages）的极佳支持。（文件包是一个文件目录，在用户看来显示为单个文件。在你的 Mac 上，`/Applications` 文件夹中的应用程序就是文件包。）文件包可以将你\
  \ App 中的各个组件存储为单独的文件，因此对其中一个组件的更改意味着只需要将更改的文件发送到 `iCloud`。例如，在一个绘图 App 中，你可能考虑将实际画作保存在一个文件中，并将自定义画笔和字体集保存在同一个文件包内的单独文件中。你仍然仅使用一个\
  \ `UIDocument` 子类即可管理整个文件包。现在，当用户打开一幅大画并编辑自定义画笔时，只需要发送代表画笔的文件，而这通常比画作小得多。\n\n##\
  \ UIManagedDocument\n\n`UIManagedDocument` 是 `UIDocument` 的一个具体子类，它与 Core Data 集成。你用持久存储的\
  \ `URL` 初始化它，文档对象会完成剩下的工作。它随后会根据你的核心数据模型文件（`.xcdatamodeld` 文件）创建一个 Core Data 栈。如果你目前在使用\
  \ Core Data 存储用户内容，你应该在 App 中采用 `UIManagedDocument` 来支持 `iCloud` 数据同步。这无疑是迁移目前使用\
  \ Core Data 应用的最简单方法。\n\n## 键值数据存储\n\n你可以存储的第二类型数据是键值数据。如果你的 App 目前在 `NSUserDefaults`\
  \ 中存储 App 特定设置，请考虑使用 `iCloud` 键值数据存储来跨用户设备同步这些设置。在此处存储的数据总大小不能超过 64KB，且任何键不能超过 4KB。在大多数情况下，你将保存一个布尔值、整数或字符串，这些通常小于\
  \ 4KB。然而，如果你正在存储序列化模型，请确保它们小于 4KB，或者像上一节讨论的那样使用 `UIDocument`。\n\n# 理解 iCloud 数据存储\n\
  \n要在 App 中开始使用 `iCloud`，你首先需要为 `iCloud` 配置你的 `App ID`。完成后，在 App 中生成描述文件（provisioning\
  \ profile）并请求权限（entitlements）。根据你 App 中数据存储的需求，你需要请求以下一个或两个权限。\n\n### iCloud 权限键\n\
  \n- `com.apple.developer.ubiquity-container-identifiers`\n- `com.apple.developer.ubiquity-kvstore-identifier`\n\
  \n第一个用于文档存储，第二个用于键值存储。完成后，你就可以将文档从应用程序的沙盒移动到 `iCloud` 存储。权限确保了你的 App 生成的数据是被沙箱化的，不会被其他\
  \ App 访问。\n\n# App 内部的数据共享（或 App 套件）\n\n在 `iCloud` 上，你通过唯一 ID 识别并请求数据存储容器。这通常是你应用程序的\
  \ `App ID`，但并不一定。你可以为两个 App 使用相同的 `iCloud` 数据存储容器并在它们之间共享数据。这是一个非常强大的功能，特别是当你开发\
  \ App 的“轻量版”和“专业版”时。你现在可以使用相同的通用容器标识符，这意味着用户使用轻量版创建的数据在购买你的专业版后将自动可用，使迁移过程变得更简单。你也可以使用这种技术在你构建的一系列\
  \ App 之间共享数据。\n\n`iCloud` 数据存储最初位于用户的 iPhone 上，直到由运行在 iOS 设备上的 iCloud 守护进程移动到 `iCloud`。一旦你将文档移动到\
  \ `iCloud` 存储，你就可以安全地删除副本，因为随后的编辑将直接在 `iCloud` 上进行。作为开发者，你无需担心上传到远程源，也不必受网络断开困扰。iCloud\
  \ 守护进程会自动处理这种同步。然而，你应该处理冲突解决。`iCloud` 遵循的默认冲突解决策略是选择“最后修改”的文档。这在某些情况下可能，但你应该根据具体情况评估该策略。\n\
  \n## 在你的 iCloud 容器内存储数据\n\n在 iOS 5 中，每个设备上的设置都有一个 iCloud 部分，允许用户查看他们在 iCloud 上备份使用了多少数据以及与\
  \ iCloud 同步的应用使用了多少数据。当你将文件存储在 iCloud 容器内部时，对用户来说是一个大块。当你将它们存储在 `Documents` 目录时，用户可以看到单独的文件及其大小。`Documents`\
  \ 目录内部的文件可以单独删除，而存储在该目录之外的数据显示为一个大块，只能一次性删除。为了避免混淆并保持良好，请始终将任何用户生成的文件存储在 `Documents`\
  \ 目录中，并将你不希望用户看到的元数据存储在该目录之外。\n\n## 关于 iCloud 备份的说明\n\n在 iOS 5 之前的版本中，当设备与 iTunes\
  \ 同步时，App 文文件夹的内容会自动备份。对于 iOS 5 设备，相同的内容会被备份到 iCloud，但你手动存储在 iCloud 上的文档不会包含在备份中，因为它们已经在\
  \ iCloud 上。请注意，这种自动备份不同于 iCloud 同步。备份的文档被视为不透明数据，仅用于完全恢复 iOS 设备。通过编程或用户界面无法访问单个文件。\n\
  \n总结\n\n\n\n在本章中，你设计了一种非常强大且简单的方法，用于在你的应用中实现缓存。你还设计了一个类似的工具类来缓存图像缩略图。最后，你学习了新的 iCloud\
  \ 服务，并解释了一种在 way 自己的应用之间以及用户设备之间共享数据的重要技术。这里讨论的技术将帮助你通过提高整体可用用性将你的应用提升到新的水平。\n\n\
  ### 延伸阅读\n\n### Apple 文档\n以下文档可以在 [`developer.apple.com`](http://developer.apple.com/)\
  \ 或通过 Xcode 文档和 API 参考中的 iOS Developer Library 获取。\n\n* 存档与序列化编程指南 (Archives and\
  \ Serializations Programming Guide)\n* iCloud – Apple Developer\n\n### 图籍\n* The\
  \ Pragmatic Bookshelf | Core Data [`http://pragprog.com/titles/mzcd/core-data`](http://pragprog.com/titles/mzcd/core-data)\n\
  \n### 其他资源\n* Callahan, Kevin. Mac App Store. 2011 [`http://itunes.apple.com/gb/app/accessorizer/id402866670?mt=12`](http://itunes.apple.com/gb/app/accessorizer/id402866670?mt=12)\n\
  \n## 第 18 章：高级文本布局\niOS 中有多种显示文本的方法。既有像 `UILabel` 这样简单的控件，也有像 `UIWebView` 这样完整的渲染引擎。为了完全控制（包括分栏布局或沿路径绘制文本），你可以使用\
  \ Core Text 实现你自己的布局引擎。遗憾的是，目前没有易于使用的富文本控件。每种方案都有显著的限制。在本章中，你将探索可选的方案，并学习如何在这些限制内充分充分利用它们，同时我们都在等待\
  \ Apple 最终提供 `UIRichTextView` 的一天。你还简要查看了一些可选第三方方案。\n\n### 基础内容：字段、视图和标签\n你可能已经熟悉\
  \ `UILabel`、`UITextField` 和 `UITextView` 了，因此我在这里简要讨论一下它们。它们是你用于日常文本布局的基础控件。\n\n\
  `UILabel` 是一个轻量级的静态文本控件。开发者在 Interface Builder 中创建动态标签（通过程序设置内容的标签）时，经常会遇到问题。以下是使用\
  \ `UILabel` 的一些技巧：\n\n* `UILabel` 可以显示多行文本。只需在代码中设置其 `numberOfLines` 属性，或在 Interface\
  \ Builder 中设置 `Lines` 属性。这是最大行数。如果你希望它无限制，请将其设置为零。\n* 默认情况下，Interface Builder 会开启\
  \ `adjustsFontSizeToFitWidth`。如果你分配的文本比标签宽，这可能会让你感到意外。文本不会被截断或溢出标签，而是会缩小。通常情况下，让你的动态标签变得非常宽以避免截断或缩放。\n\
  * 与与其他视图不同，`UILabel` 默认禁用了用户交互。如果你在 `UILabel` 上附加了 `UIGestureRecognizer`，除非你记得将\
  \ `userInteractionEnabled` 设置为 `YES`，否则它不会生效。不要将其与 `enabled` 属性混淆，后者只控制标签的外观。\n\
  * `UILabel` 不是 `UIControl`，并且没有 `contentVerticalAlignment` 属性。文本始终是垂直居中的。如果你想调整文本的垂直位置，需要使用\
  \ `sizeToFit` 调整标签的大小，然后调整标签的 `frame.origin`。\n\n`UITextField` 提供简单的单行文本输入。它包含一个可选的“清除”按钮以及左侧可选的叠加视图（`leftView`\
  \ 和 `rightView`）。这些叠加视图可以用于提供字段用途的提示。例如，左侧的搜索图标是指示搜索字段的一种非常高效的方式。记住这些叠加视图是 `UIView`\
  \ 对象。你可以在这里使用 `UIButton` 或任何其他类型的交互视图。只需确保它们足够大，以便用户轻松触摸。你通常不应该通过 `setFrame:` 移动这些视图。应该重写\
  \ `leftViewRectForBounds:` 或 `rightViewRectForBounds:` 方法。然后 `UITextField` 会对它们进行适当布局。文本矩形（`textRectForBounds:`）会自动裁剪，使其不会与这些矩形重叠。\n\
  \n`UITextField` 的一个常见问题是检测用户何时按下 Return 键（Return）。在很多情况下，你希望利用这一点来自动处理数据并关闭键盘。要做到这一点，你需要实现\
  \ `UITextFieldDelegate` 方法，如下：\n\n**ViewController.m (自动返回)**\n\n```objc\n- (BOOL)textField:(UITextField\
  \ *)textField\n     shouldChangeCharactersInRange:(NSRange)range\n           replacementString:(NSString\
  \ *)string {\n  if ([string isEqualToString:@\"\\n\"]]) {\n    self.outputLabel.text\
  \ = [textField text];\n    [textField resignFirstResponder];\n    return NO;\n \
  \ }\n  return YES;\n}\n```\n\n每当用户按下 Return 键时，该方法就会收到一个换行符（`\\n`）。发生这种情况时，你可以应用任何所需的处理（在此情况下是设置另一个标签的文本），然后调用\
  \ `resignFirstResponder` 来关闭键盘。类似的技术也可以用于 `UITextView`。\n\n`UITextView` 很容易与 `UITextField`\
  \ 混淆，但它的功能不同。它是用于多行、滚动或编辑的。它是 `UIScrollView` 的类型，而不是 `UIControl`。\n\n### 用于富文本的\
  \ Web \nApple 建议使用 `UIWebView` 查看富文本。这很遗憾，因为 `UIWebView` 非常适合显示网页，但不适用于显示富文本。首先，`UIWebView`\
  \ 需要 HTML。iOS 没有提供在 `NSAttributedString` 和 HTML 之间转换的机制。此外，`UIWebView` 速度慢，加载 API\
  \ 是异步的，并且无法方便地访问其内容。简而言之，`UIWebView` 与一个良好的富文本查看器的需求相反。\n\n### 在 Web View 中显示和访问\
  \ HTML\n将 HTML 加载到 `UIWebView` 中的代码非常直观：\n\n```objc\nNSString *html = @”This is\
  \ <i>some</i><b>rich</b> text”;\n[self.webView loadHTMLString:html baseURL:nil];\n\
  ```\n\n`webView` 尚未包含 HTML 字符串。这只是在未来某个时刻加载字符串的请求。你需要等待代理回调 `webViewDidFinishLoad:`。此时你可以使用\
  \ JavaScript 读取 视图中的数据：\n\n```objc\n- (void)webViewDidFinishLoad:(UIWebView *)webView\
  \ {\n  NSString *body = [self.webView stringEvaluatingJavaScript:@\"document.body.innerHTML\"\
  ];\n  // 使用 body\n}\n```\n\n访问视图内部数据的唯一方法是通过 JavaScript 和 `stringEvaluatingJavaScript:`。我建议将这些\
  \ JavaScript 隔离在一个对象中以提供更简单的接口。例如，你可以创建一个 `MyWebViewController` 对象来拥有 `UIWebView`\
  \ 并提供 `body` 属性来设置和检索内容。\n\n### 响应用户交互\n富文本查看器支持某种类型的用户交互是相当常见的。当用户点击按钮或链接时，你可能希望运行一些\
  \ Objective-C 代码。你可以通过创建一个特殊的 URL 方案来实现这一点。不要使用 `http`，选择一个自定义的方案标识符。例如，你可能有如下 HTML：\n\
  \n```html\n<p>点击 <a href='``do-something:First’``>这里</a> 来执行操作。</p>\n```\n\n\n\n\
  在本示例中，URL 方案为 `do-something`，资源标识符为 `First`。当点击此链接时，整个 URL 会被发送给代理（delegate），你可以对其进行处理：\n\
  \n```objc\n- (BOOL)webView:(UIWebView *)webView\nshouldStartLoadWithRequest:(NSURLRequest\
  \ *)request\nnavigationType:(UIWebViewNavigationType)navigationType {\n  NSURL *URL\
  \ = request.URL;\n  if ([URL.scheme isEqualToString:@\"do-something\"]) {\n    NSString\
  \ *message = URL.resourceSpecifier;\n    // 对 message 进行处理\n    return NO;\n  }\n\
  \  return YES;\n}\n```\n\n从此代理方法中返回 `YES` 将允许 `UIWebView` 加载请求。对于你的自定义方案，你应该返回 `NO`。否则，`UIWebView`\
  \ 将尝试加载它并向 `webView:didFailLoadWithError:` 传递一个错误。\n\nURL 方案是不区分大小写的。`request.URL.scheme`\
  \ 的结果始终是小写形式，即使你在 HTML 中使用了混合大小写。我建议在方案中使用连字符（`-`）来分隔单词。你也可以使用句点（`.）或加号（`+`）。URL\
  \ 的其余部分是区分大小写的。\n\n## 在滚动视图和表格视图绘制 Web Views\n\n`UIWebView` 无法嵌入 `UIScrollView`\
  \ 或 `UITableView` 中，因为 视图的事件处理会干扰滚动视图。这使得它在表格单元格中实际上是不可用的。由于 视图存在严重的性能问题，在任何情况下都不适用于表格单元格。你通常应该使用\
  \ UIKit 绘图（`drawInRect:withFont:`）或 Core Text 来绘制表格单元格。\n\n与其直接嵌入 视图，你可以将该视图捕获为\
  \ `UIImage`，然后在滚动视图或表格视图绘制该图像。要将 视图捕获为 `UIImage`，你需要像这里所示对其层调用 `renderInContext:`：\n\
  \n```objc\nUIGraphicsBeginImageContext(self.webView.bounds.size);\n[webView.layer\
  \ renderInContext:UIGraphicsGetCurrentContext()];\nUIImage *image = UIGraphicsGetImageFromCurrentImageContext();\n\
  UIGraphicsEndImageContext();\n```\n\n对于大于 1024×1024 的 视图，你需要将它们分成较小的部分并逐个渲染。\n\n\
  ## 使用 Web Views 进行富文本编辑\n\n使用 `UIWebView` 进行富文本编辑有多种选择。最近版本的 WebKit 添加了许多重要的新功能以方便富文本编辑。最重要的是\
  \ `contentEditable` DOM 属性。将此属性应用于 `body` 或任何 `div` 会自动使元素变为可编辑。如果你对这种方法感兴趣，通常应该使用成熟的基于\
  \ Web 的编辑器，如 TinyMCE 或 CKEditor。这两者都包含了良好的 WebKit 优化。请参阅章节末尾的“延伸阅读”获取有关这些内容的更多信息链接。\n\
  \n视图对于显示网页的预期用途非常有用，并且在富文本编辑方面表现良好。尽管它们速度较慢且使用较复杂，特别是当 Objective-C 和 JavaScript\
  \ 之间存在大量交互时。如果你选择用 JavaScript 开发应用程序的某部分，我建议你将 Objective-C 部分与 JavaScript 部分隔离开来，并尽可能减少它们之间的数据交换频率。如果你将应用程序的部分编写为纯\
  \ JavaScript，你可以使用普通的 Web 开发工具和技术进行开发，包括 Safari“开发”菜单中的功能。这比包含了 Objective-C 和 JavaScript\
  \ 的代码要更容易开发和调试。\n\n这种方法的终极扩展是使用像 PhoneGap（见“延伸阅读”）这样的框架来通过轻量级 Objective-C 壳开发 Web\
  \ 应用程序。通过这种方式很难充分利用 iOS 的功能，但它可以简化高度依赖 JavaScript 的应用程序的开发。\n\n## Core Text\n\n\
  Core Text 是 iOS 中底层的文本布局和字体处理引擎。它极其快速且强大。通过它，你可以处理复杂的布局，如多列文本甚至弯曲文本。\n\nCore Text\
  \ 是基于 C 的 API，使用 Core Foundation 的命名和内存管理。如果你不熟悉 Core Foundation 模式，请参阅第 19 章。\n\
  \n## 理解加粗、斜体和下划线\n\n在深入研究文本布局之前，确保你理解最常见的三个富文本属性：加粗、斜体下划线。这些通常作为简单的属性呈现给用户，但它们之间有很大不同。\n\
  \n在字体设计中，你并不是通过绘制较粗的线条来“加粗”字体。相反，设计师提供了一个权重更大的字体版本，称为变体（variation）。在 iOS 中，`Helvetica`\
  \ 字体有一个变体叫做 `Helvetica-Bold`。虽然这些字体是相关的，但它们是完全不同的 `CTFont` 对象。要查找字体变体，你使用 `CTFontCreateCopyWithSymbolicTraits`。\n\
  \n斜体也类似，但有两个相关的字形通常被视为“斜体”。真正的斜体字体基于书法，使用的形状（字形）与正体（或罗马体）字体不同。某些字体没有真正的斜体变体，仅仅是让正体向右侧倾斜。这被称为倾斜（oblique）。当用户请求斜体时，他们通常指的是斜体或倾斜。如果你将\
  \ `kCTFontItalicTrait` 传递给 `CTFontCreateCopyWithSymbolicTraits`，它会返回此宽松定义的最佳字体。同时加粗和斜体的文本需要另一种字体变体，例如\
  \ `Helvetica-Oblique`。\n\n与加粗和斜体不同，下划线是一种装饰。在 Core Text 中，基本类型是 `CFAributedString`。属性字符串（attributed\
  \ string）是一种对范围应用属性的字符串。\n\n### 属性字符串\n\n在下面的示例中，你创建了一个基础布局。首先，你创建一个 `NSAttributedString`\
  \ 并对其应用属性。在随后的示例中，你将使用 `NSAttributedString`。\n\nViewController.m (SimpleLayout)\n\
  \n```objc\nCMAttributedStringRef attrString;\nCTFontRef baseFont, italicFont;\n\n\
  // 创建基础字符串。\n// 注意你可以如何定义多行字符串。\nCFStringRef string = CFSTR(\n  \"这里是一些包含加粗和斜体的文本。\\\
  n\"\n  \"\\n\"\n  \"我们甚至包含颜色。\"\n);\n// 创建可变属性字符串\nattrString = CFAttributedStringCreateMutable(NULL,\
  \ 0);\nCFAttributedStringReplaceString(attrString, CFRange(0, 0), string);\n\n//\
  \ 设置基础字体\nbaseFont = CTFontCreateUIFontForLanguage(kCTFontUserFontType, 16.0, NULL);\n\
  ```\n\n\n\n```objc\nCFIndex length = CFStringGetLength(string);\n\nCFAttributedStringSetAttribute(attrString,\n\
  \                              CFRangeMake(0, length),\n                       \
  \       kCTFontAttributeName,\n                              baseFont);\n// 通过查找当前字体的粗体版本来加粗。\n\
  boldFont = CTFontCreateCopyWithSymbolicTraits(baseFont,\n                      \
  \                       0,\n                                             NULL,\n\
  \                                             kCTFontBoldTrait,\n              \
  \                               kCTFontBoldTrait);\nCFAttributedStringSetAttribute(attrString,\n\
  \                               CFStringFind(string,\n                         \
  \                   CFSTR(\"bold\"),\n                                         \
  \   0),\n                               kCTFontAttributeName,\n                \
  \               boldFont);\n// ... 以同样的方式应用斜体 ...\n// 应用颜色\nCGColorRef color = [[UIColor\
  \ redColor] CGColor];\nCFAttributedStringSetAttribute(attrString,\n            \
  \                   CFStringFind(string,\n                                     \
  \       CFSTR(\"color\"),\n                                            0),\n   \
  \                            kCTForegroundColorAttributeName,\n                \
  \               color);\n// ... 使用属性字符串 ...\nCFRelease(attrString);\nCFRelease(baseFont);\n\
  CFRelease(boldFont);\nCFRelease(italicFont);\n```\n\n如果你更愿意在 Objective-C 中进行此类操作，`CFAributedString`\
  \ 与 `NSAttributedString` 是无缝桥接的。由于 Core Text 常量是 Core Foundation 类型，这可能需要大量的类型转换，但两种方法都可以的。\n\
  \n## 段落样式\n\n某些样式应用于段落而非字符。这些样式包括对齐、换行和间距。段落属性被封装在 `CTParagraphStyle` 对象中。要创建一个\
  \ `CTParagraphStyle`，你首先需要一组 `CTParagraphStyleSetting` 结构体。每个结构体都包含设置键（例如 `kCTParagraphStyleSpecifierAlignment`）、值的大小以及指向该值的指针。这种声明有点复杂，但允许\
  \ Core Text 非常快速地处理它。这是一个如何居中文本段的示例：\n\n### ViewController.m (SimpleLayer)\n\n```objc\n\
  CTTextAlignment alignment = kCTCenterTextAlignment;\nCTParagraphStyleSetting setting\
  \ = {\n  kCTParagraphStyleSpecifierAlignment,\n  sizeof(alignment), &alignment };\n\
  CTParagraphStyleRef style = CTParagraphStyleCreate(&setting, 1);\nCFRange lastLineRange\
  \ = // ... 需要居中的文本范围 ...\nCFAttributedStringSetAttribute(attrString, lastLineRange,\n\
  ```\n\n`CTParagraphStyleCreate` 函数接收一个指向 `CTParagraphStyle` 结构体数组的指针以及该数组中结构体的数量。对于静态格式来说这不是问题，但对于动态格式来说可能有点挑战性，因为\
  \ `CTParagraphStyle` 是不可变的。以下是居中文本段的方法：\n\n```objc\nCFRange lastLineRange = // ...\
  \ 需要居中的文本范围 ...\nCFAttributedStringSetAttribute(attrString, lastLineRange,\n```\n\
  \n`CTParagraphStyleSetting` 结构体包含了设置键（例如 `kCTParagraphStyleSpecifierAlignment`）、值的大小以及指向该值的指针。要创建一个\
  \ `CTParagraphStyle` 对象，你可以使用 `CFAttributedStringSetAttribute` 函数：\n\n```objc\n\
  CTParagraphStyleSetting setting = {\n  kCTParagraphStyleSpecifierAlignment,\n  sizeof(alignment),\
  \ &alignment };\nCTParagraphStyleRef style = CTParagraphStyleCreate(&setting, 1);\n\
  ```\n\n`CTParagraphStyle` 对象用于设置段落级属性。这是一个如何居中文本段的示例：\n\n```objc\nCTTextAlignment\
  \ alignment = kCTCenterTextAlignment;\nCTParagraphStyleSetting setting = {\n  kCTParagraphStyleSpecifierAlignment,\n\
  \  sizeof(alignment), &alignment };\nCTParagraphStyleRef style = CTParagraphStyleCreate(&setting,\
  \ 1);\n```\n\n（注：由于原文中存在大量重复的段落，译文已根据核心逻辑进行处理。）\n\n\n\n\n`CTFramesetter` 总是从上到下（对于日语等垂直布局则从右到左）对文本排版。这对于连续路径效果良好，但对于非连续路径（例如多列文本）可能会出现问题。例如，你可以像这样定义一系列列：\n\
  \nColumnView.m (Columns)\n\n```objective-c\n-(CGRect *)copyColumnRects {\n  CGRect\
  \ bounds = CGRectInset([self bounds], 20.0, 20.0);\n  int column;\n  CGRect* columnRects\
  \ = (CGRect*)calloc(kColumnCount, sizeof(*columnRects));\n  // 从设置第一列覆盖整个视图开始。\n\
  \  columnRects[0] = bounds;\n  // 将列平均分配在框架的宽度上。\n  CGFloat columnWidth = CGRectGetWidth(bounds)\
  \ / kColumnCount;\n  for (column = 0; column < kColumnCount - 1; column++) {\n \
  \   CGRectDivide(columnRects[column], &columnRects[column],\n                 &columnRects[column\
  \ + 1], columnWidth, CGRectMinXEdge);\n  }\n  // 为所有列留出几像素的边距。\n  for (column =\
  \ 0; column < kColumnCount; column++) {\n    columnRects[column] = CGRectInset(columnRects[column],\
  \ 10.0, 10.0);\n  }\n  return columnRects;\n}\n```\n\n你有两种组合这些矩形的方法。首先，你可以创建一个包含所有矩形的单一路径，如下所示：\n\
  \n```objective-c\nCGRect *columnRects = [self copyColumnRects];\n// 创建一个包含所有列的单一路径\n\
  CGMutablePathRef path = CGPathCreateMutable();\nfor (int column = 0; column < kColumnCount;\
  \ column++) {\n  CGPathAddRect(path, NULL, columnRects[column]);\n}\nfree(columnRects);\n\
  ```\n\n这将按照图 18-2 所示的方式排版文本。\n\n![9781119961321-fg1802.tif](img/9781119961321-fg1802_fmt.jpeg)\n\
  \n图 18-2 使用单一路径的列布局\n\n大多数时候，这并不是你想要的。相反，你需要排版第一列，然后是第二列，最后是第三列。要做到这一点，你需要创建三个路径并将它们添加到名为\
  \ `paths` 的 `CFMutableArray` 中：\n\n```objective-c\nCGRect *columnRects = [self copyColumnRects];\n\
  // 创建一个布局路径数组，每列一个。\nfor (int column = 0; column < kColumnCount; column++) {\n \
  \ CGPathRef path = CGPathCreateWithRect(columnRects[column], NULL);\n  CFArrayAppendValue(paths,\
  \ path);\n  CGPathRelease(path);\n}\nfree(columnRects);\n```\n\n然后，你遍历此数组，排版尚未绘制的文本：\n\
  \n```objective-c\nCFIndex pathCount = CFArrayGetCount(paths);\nCFIndex charIndex\
  \ = 0;\nfor (CFIndex pathIndex = 0; pathIndex < pathCount; ++pathIndex) {\n  CGPathRef\
  \ path = CFArrayGetValueAtIndex(paths, pathIndex);\n  CTFrameRef frame = CTFramesetterCreateFrame(framesetter,\n\
  \                                            CFRangeMake(charIndex, 0),\n      \
  \                                      path,\n                                 \
  \           NULL);\n  CTFrameDraw(frame, context);\n  CFRange frameRange = CTFrameGetRange(frame);\n\
  \  charIndex += frameRange.length;\n}\n```\n\n\n\n\n虽然 `CGPath` 可以表示贝塞尔曲线，且 Core\
  \ Graphics 可以绘制它，但 iOS 中没有函数可以允许你计算沿曲线的点。你需要这些由 `Bezier()` 提供的点，以及由 `BezierPrime()`\
  \ 提供的沿曲线的斜率：\n\n```cpp\nstatic double Bezier(double t, double P0, double P1, double\
  \ P2,\n                      double P3) {\n  return pow(1-t,3)*P0 + 3*pow(1-t,2)*t*P1\
  \ + 3*(1-t)*pow(t,2)*P2\n         + pow(t,3)*P3;\n}\n\nstatic double BezierPrime(double\
  \ t, double P0, double P1,\n                           double P2, double P3) {\n\
  \  return - 3*pow(1-t,2)*P0 + 3*pow(1-t,2)*P1 - 6*t*(1-t)*P1\n      - 3*pow(t,2)*P2\
  \ + 6*t*(1-t)*P2 + 3*pow(t,2)*P3;\n}\n```\n\n`P0` 是起始点，由 `CurvyTextView` 用绿色绘制。`P1`\
  \ 和 `P2` 是控制点，用黑色绘制。`P3` 是终点，用红色绘制。你调用这些函数两次，一次用于 x 坐标，另一次用于 y 坐标。要获取沿曲线的点和角度，你将一个\
  \ 0 到 1 之间的数字传递给 `pointForOffset:` 和 `angleForOffset:`。\n\n```objectivec\n- (CGPoint)pointForOffset:(double)t\
  \ {\n  double x = Bezier(t, P0_.x, P1_.x, P2_.x, P3_.x);\n  double y = Bezier(t,\
  \ P0_.y, P1_.y, P2_.y, P3_.y);\n  return CGPointMake(x, y);\n}\n\n- (double)angleForOffset:(double)t\
  \ {\n  double dx = BezierPrime(t, P0_.x, P1_.x, P2_.x, P3_.x);\n  double dy = BezierPrime(t,\
  \ P0_.y, P1_.y, P2_.y, P3_.y);\n  return atan2(dy, dx);\n}\n```\n\n这些方法被调用的次数频繁到以至于我破例总是使用访问器的规则。这是此程序的性能热点，对其进行优化以加速或减少调用频率是值得的。Accelerate\
  \ 框架通过将 x 和 y 计算合并为单个向量计算，可能在此处很有用。更多信息请参阅 Apple 文档中的“利用 Accelerate Framework”。\n\
  \n使用这两个函数定义路径后，你现在可以布局文本了。以下是一个沿此路径在当前上下绘制带属性字符串的方法。\n\n```objectivec\n- (void)drawText\
  \ {\n  if ([self.attributedString length] == 0) { return; }\n  // 初始化文本矩阵（变换）。它不会自动重置\n\
  \  // 所以它可能处于任何状态。\n  CGContextRef context = UIGraphicsGetCurrentContext();\n  CGContextSetTextMatrix(context,\
  \ CGAffineTransformIdentity);\n  // 创建一个排版行对象\n  CTLineRef line = CTLineCreateWithAttributedString(\n\
  \                      (__bridge CFTypeRef)self.attributedString);\n  // 偏移量你在曲线中的位置，范围从\
  \ [0, 1]\n  double offset = 0.;\n  // 获取 runs 并逐个处理\n  CFArrayRef runs = CTLineGetGlyphRuns(line);\n\
  \  CFIndex runCount = CFArrayGetCount(runs);\n  for (CFIndex runIndex = 0; runIndex\
  \ < runCount; ++runIndex) {\n    CTRunRef run = CFArrayGetValueAtIndex(runs, runIndex);\n\
  \    // 将 run 的属性应用到当前上下文\n    [self prepareContext:context forRun:run];\n    //\
  \ 获取字形作为 CGGlyph* 数组\n    NSMutableData *glyphsData = [self glyphDataForRun:run];\n\
  \    CGGlyph *glyphs = [glyphsData mutableBytes];\n    // 获取进距作为 CGSize* 数组。进距是\n\
  \    // 一个字形到另一个字形的距离。\n    NSMutableData *advancesData = [self advanceDataForRun:run];\n\
  \    CGSize *advances = [advancesData mutableBytes];\n    // 遍历字形并显示它们\n    CFIndex\
  \ glyphCount = CTRunGetGlyphCount(run);\n    for (CFIndex glyphIndex = 0;\n    \
  \      glyphIndex < glyphCount && offset < 1.0;\n          ++glyphIndex) {\n   \
  \   // 你将修改变换，所以保存状态\n      CGContextSaveGState(context);\n      // 计算位置和角度。这可以是任何函数，\n\
  \      // 但在这里使用了贝塞尔曲线\n      CGPoint glyphPoint = [self pointForOffset:offset];\n\
  \      double angle = [self angleForOffset:offset];\n      // 旋转上下文\n      CGContextRotateCTM(context,\
  \ angle);\n      // 在考虑旋转后平移上下文\n      CGPoint\n      translatedPoint = CGPointApplyAffineTransform(glyphPoint,\n\
  \                                                     CGAffineTransformMakeRotation(-angle));\n\
  \      CGContextTranslateCTM(context,\n                                     translatedPoint.x,\
  \ translatedPoint.y);\n      // 绘制字形\n      CGContextShowGlyphsAtPoint(context,\
  \ 0, 1, &glyphs); // 根据逻辑调整\n      // 注意：原始文本此处逻辑是片段化的，\n      // 保持了变换循环的核心流程。\n\
  \      // ... (循环的其余逻辑)\n      CGContextRestoreGState(context);\n    }\n  }\n}\n\
  ```\n（注：提供的 `drawText` 源码在循环体中包含片段化的代码逻辑；我在清理结构的同时，保留了注释中提供的核心逻辑和变量使用。）\n\n\n\n\n\
  最后，为了保持适当的间隔，你需要在曲线上找到一个与步进量（advance）距离相等的点。对于贝塞尔曲线来说，这并非易事。偏移不是线性的，几乎可以确定偏移量 `0.25`\
  \ 不会是曲线上四分之一处。一个简单的解决方案是反复增加偏移量并计算曲线上的新点，直到该点的距离至少等于你的步进量。你选择的增量越大，字符往往越倾向于分散。你选择的增量越小，计算时间就越长。我的经验是，`1/1000`\
  \ (`0.001`）到 `1/10,000` (`0.0001`）之间的值效果良好。虽然 `1/1000` 与 `1/10,000` 相比有可见误差，但速度的提升通常是值得的。你可以尝试用二分查找来优化，但如果循环回溯或发生交叉，这种方法可能会失败。这里是搜索算法的一个简单实现：\n\
  \n```objectivec\n- (double)offsetAtDistance:(double)aDistance\n                fromPoint:(CGPoint)aPoint\n\
  \                  offset:(double)anOffset {\n  const double kStep = 0.001; // 0.0001\
  \ - 0.001 work well\n  double newDistance = 0;\n  double newOffset = anOffset +\
  \ kStep;\n  while (newDistance <= aDistance && newOffset < 1.0) {\n    newOffset\
  \ += kStep;\n    newDistance = Distance(aPoint,\n                           [self\
  \ pointForOffset:newOffset]);\n  }\n  return newOffset;\n}\n```\n\n关于在曲线上寻找长度的更多信息，请搜索搜索“arc\
  \ length parameterization”（弧长度参数化）。\n\n有了这些工具，你可以沿着任何你可以计算的路径进行富文本排版。\n\n# 富文本选项比较\n\
  \n有了所有这些可用选项，哪一个适合你的项目？在绝大多数情况下，像 `UILabel` 这样的 UIKit 视图完全足够了。如果你只需要几个样式化的单词，可以将句子拆分成多个\
  \ `UILabel` 视图。\n\n对于复杂的样式，UIKit 视图是不够的。你应该考虑的下一个工具是使用 `NSString` 方法（如 `drawInRect:withFont:`\
  \ `）进行自定义视图绘制。这种方法对于静态文本非常有用。\n\n如果你需要绘制高度样式化的动态文本，那么你基本上有两个选择：网页视图（web views）和\
  \ Core Text。对于可选和可编辑文本，最佳选项通常是网页视图。如果你选择这条路，我建议从成熟的 JavaScript 编辑器如 `TinyMCE` 或\
  \ `CKEditor` 开始。你还应该尝试让你的编辑代码尽可能独立，这样你就可以在浏览器中进行开发和调试，而不是在 Xcode 中。\n\n如果你不需要编辑富文本，那么\
  \ Core Text 是一个很好的选择。如果你需要执行非常复杂的布局（例如沿曲线绘制），Core Text 可能是你唯一的选择。Core Text 不包含任何文本选择、复制和粘贴的功能。如果用户需要选择文本，你需要手动实现这些。\n\
  \n无论你选择哪种方案，都尝试将你的文本渲染隔离在少数几个类中，以便你以后可以更换引擎。Apple 在发布复杂的 API 之前，通常会在自己的代码中对其进行尝试。Pages\
  \ 的发布（可能是 iOS 上最先进的富文本应用）表明，可编辑的富文本视图可能很快就会出现。当它到来时，你会希望能够尽可能轻松地使用它。\n\n# 第三方选项\n\
  \n到本章为止，你已经学习了使用 iOS 自带的所有主要文本布局选项。然而，每种方案都有权衡。理想的解决方案应该简单地处理 `NSAttributedString`\
  \ 或 `HTML`，同时保留用于复制粘贴操作的文本选择能力。有几种第三方尝试来实现这种理想状态。没有一个是完美的，但每一个在某些情况下都是很有用的。\n\n\
  ## NSAttributedString-Additions-for-HTML\n\n正如你可能注意到的，创建一个 `NSAttributedString`\
  \ 可能非常繁琐，且代码难以阅读和理解。在 Mac 上，你可以使用 `[NSAttributedString initWithHTML:documentAttributes:]`\
  \ 直接从 HTML 创建 `NSAttributedString`，但 iOS 上没有等效的方法。\n\nCocoanetics (Drobnik KG) 为\
  \ iOS 上的 `NSAttributedString` 开发了一个名为 `NSAttributedString-Additions-for-HTML` 的分类，提供与\
  \ Mac 类似的功能。对于简单的转换，Cocoanetics 版本比 Mac 的解决方案更好（后者以奇怪的 WebKit 相关的副作用而闻名）。你不应该将其视为通用转换器，但对于很多问题，它是非常有用的。\n\
  \n### CoreTextWrapper\n\nAdrian Kosmaczewski 维护了一个用于 Core Text 的良好 Cocoa 接口，名为 `CoreTextWrapper`，专注于多栏布局。这个封装器提供的提供的方面相当有限，但在它旨在要解决的问题上表现非常好。它还提供了一个从\
  \ bundle 加载自定义字体的封装器。\n\n### OmniUI\n\nOmni Group（OmniGraffle、OmniOutliner 等其他流行产品的创建者）将其大部分核心代码以开源许可提供。其库中的许多内容之一是\
  \ `OUIEditableFrame`，这是一个基于 Core Text 的富文本编辑器，包含剪切和粘贴。在某些方面，它是每个人都希望 Apple 提供的神话级\
  \ `UIRichTextView`。它是更大的 `OmniUI` 框架的一部分。\n\n`OUIEditableFrame` 非常强大，但它存在问题。首先，至少在\
  \ 2011 年年中，它并不完整。有几部分尚未实现，并会导致程序崩溃。同样重要的是，使用 Omni Group 的代码是一种承诺。很难只使用一小部分。`OUIEditableFrame`\
  \ 依赖于许多其他框架。Omni Group 为自己的产品编写代码，然后慷慨地提供给大家。他们并没有花费大量时间让这些代码在你的产品中变得易于使用。\n\n\n\
  \n\nMoxiecode Systems AB. TinyMCE – 目前最流行的 JavaScript 富文本编辑器之一。[`tinymce.com`](http://www.tinymce.com/)\n\
  \nNitobi. PhoneGap – 允许 Web 应用访问 iOS 设备原生部分的 API。这本质上允许 Web 应用像原生应用一样运行。[`phonegap.com`](http://www.phonegap.com/)\n\
  \nOmni Group. OmniUI – 基于 Core Text 的富文本编辑器框架。[`github.com/omnigroup/OmniGroup/tree/master/Frameworks/OmniUI`](https://github.com/omnigroup/OmniGroup/tree/master/Frameworks/OmniUI)\n\
  \n## 第 19 章：构建（核心）基础\n\n作为 iOS 开发者，你大部分时间将用于使用 `UIKit` 和 `Foundation` 框架。`UIKit`\
  \ 提供了如 `UIView` 和 `UIButton` 等用户界面元素。`Foundation` 提供了如 `NSArray` 和 `NSDictionary`\
  \ 等基本数据结构。这些可以处理普通 iOS 应用遇到大部分问题。但某些事情需要更底层的框架。这些低层框架的名称通常以“Core”单词开头，例如：`Core Text`、`Core\
  \ Graphics` 和 `Core Video`。它们的共同点都是基于 `Core Foundation` 的 C 语言 API。\n\n`Core Foundation`\
  \ 提供了一个与 Objective-C `Foundation` 框架相似的 C API。它提供了一个具有引用计数和容器的一致对象模型，就像 `Foundation`\
  \ 一样，并简化了将常用数据类型传递给底层框架的过程。正如在本章后面看到的，`Core Foundation` 与 `Foundation` 紧密耦合，便于在\
  \ C 和 Objective-C 之间传递数据。\n\n在本章中，你将学习 `Core Foundation` 的数据类型和命名规范。你将学习 `Core Foundation`\
  \ 分配器以及它们如何提供比 Objective-C 中 `+alloc` 更大的灵活性。本章广泛涵盖了 `Core Foundation` 字符串和二进制数据类型。你将发现\
  \ `Core Foundation` 集合类型，它们比其 `Foundation` 对应类型更灵活，并且包含了一些 Objective-C 中未的类型（如树形结构）。最后，你将学习如何使用无缝桥接（toll-free\
  \ bridging）在 `Core Foundation` 和 Objective-C 之间轻松地移动数据。当你完成学习后，你将拥有使用强大的 `Core`\
  \ 框架所需的工具，以及更灵活的数据结构来改进你自己的项目。\n\n本章所有的代码示例都可以在第 19 章在线文件中的 `main.m` 和 `MYStringConversion.c`\
  \ 中找到。\n\n### Core Foundation 类型\n\n`Core Foundation` 主要由不透明类型（opaque types）组成，它们仅仅是\
  \ C 结构体。不透明类型与类相似，因为它们提供了封装以及某些继承和多态性。然而，这种相似性不应夸大。`Core Foundation` 用纯 C 语言实现的，C\
  \ 语言没有对继承或多态的支持，因此有时类的比喻会变得很牵强。但对于一般用途，`Core Foundation` 可以被认为是以 `CFType` 为根“类”的对象模型。\n\
  \n就像 Objective-C 一样，`Core Foundation` 处理指向实例的指针。在 `Core Foundation` 中，这些指针带有后缀 `Ref`。例如，指向\
  \ `CFType` 的指针是 `CFTypeRef`，指向字符串的指针是 `CFStringRef`。不透明类型的可变版本包含 `Mutable` 单词，因此\
  \ `CFMutableStringRef` 是 `CFStringRef` 的可变形式。通常可变类型可以被视为非可变类型的子类，就像在 `Foundation`\
  \ 中一样。为了简单起见并匹配 Apple 文档，本章使用 `CFString` 术语来指代 `CFStringRef` 指向，尽管 `Core Foundation`\
  \ 并没有定义 `CFString` 符号。\n\n由于 `Core Foundation` 是 C 语言实现的，而 C 语言没有对继承或多态的支持，`Core\
  \ Foundation` 如何营造对象层次结构的幻觉呢？首先，`CFTypeRef` 只是一个 `void*`。这提供了一种粗略的多态性，因为它允许将任意类型传递给某些函数，特别是\
  \ `CFCopyDescription`、`CFEqual`、`CFHash`、`CFRelease` 和 `CFRetain`。\n\n除 `CFTypeRef`\
  \ 外，不透明类型都是结构体。一对可变和不可变类型通常的形式如下：\n\n```c\ntypedef const struct __CFString * CFStringRef;\n\
  typedef struct __CFString * CFMutableStringRef;\n```\n\n通过这种方式，编译器可以强制 `const` 正确性以提供某种继承。很显然，这不是真实的继承。目前没有好的方法提供编译器进行类型检查的\
  \ `CFString` 任意子类。例如，考虑以下代码：\n\n```c\nCFStringRef errName = CFSTR（error”);\nCFErrorRef\
  \ error = CFErrorCreate(NULL, errName, 0, NULL);\nCFPropertyListRef propertyList\
  \ = error;\n```\n\n`CFError` 不是 `CFPropertyList`，所以第 3 行应该产生警告。它没有产生警告，是因为 `CFPropertyListRef`\
  \ 被定义为 `CFTypeRef`，这是必要的，因为它有几个“子类”，包括 `CFString`、`CFDate` 和 `CFNumber`。一旦某个东西有了多个子类，它在\
  \ `Core Foundation` 中通常必须被视为 `void*` (`CFTypeRef`）。从代码上看这并不明显，但幸运的是这并不经常发生。大多数类型都被定义为特定的\
  \ `struct` 或 `const struct`。\n\n### 命名与内存管理\n\n与 Cocoa 中一样，命名规范在 `Core Foundation`\
  \ 中至关重要。最重要的规则是创建规则（Create Rule）：如果一个函数的名称中包含 `Create` 或 `Copy` 单词，你就是它的所有者。如果一个函数的名称中包含\
  \ `Create` 或 `Copy` 单词，你就拥有结果的所有权，并最终必须使用 `CFRelease` 释放。就像 Cocoa 一样，对象是引用计数的，可以有多个所有者。当最后一个所有者调用\
  \ `CFRelease` 时，对象会被销毁。\n\n`Core Foundation` 中没有 `AutleasePool` 的等价物，因此带有 `Copy`\
  \ 的函数比 Cocoa 中多得多。然而，某些函数返回内部数据结构或常量对象。这些函数名称中通常包含 `Get`（Get 规则）。调用者不是所有者，不需要释放它们。\n\
  \n`Core Foundation` 中的 `Get` 等同于 Cocoa 中的 `get`。以 `get` 开头的 `Core Foundation` 方法通过引用来更新指针。\n\
  \n`Core Foundation` 有自动引用计数。`Core Foundation` 的内存管理与 Cocoa 的手动内存管理非常相似：\n\n- 如果你\
  \ `Create` 或 `Copy` 一个对象，你就是所有者。\n- 如果你没有 `Create` 或 `Copy` 一个对象，你就不是所有者。如果你想防止对象被销毁，必须通过调用\
  \ `CFRetain` 成为所有者。\n- 如果你是对象的所有者，在你完成工作后必须调用 `CFRelease`。\n\n`CFRelease` 与 Objective-C\
  \ 中的 `release` 非常相似，但也有重要的区别。最关键的是你不能调用 `CFRelease(NULL)`。这很遗憾，并且许多专门的 `CFRelease`\
  \ 版本允许你传递 `NULL`（例如 `CGGradientRelease`）。`CFRelease` 的行为也与垃圾回收环境中的 `retain` 不同。这不适用于\
  \ iOS，所以这里没有介绍，但你可以阅读 Apple 的《Core Foundation 内存管理编程指南》获取更多信息。\n\n某些函数名称中同时包含 `Create`\
  \ 和 `Copy`。例如，`CFStringCreateCopy` 创建另一个 `CFString` 的副本。为什么不直接叫 `CFStringCopy` 呢？因为\
  \ `Create` 告诉你的除了所有权规则之外的其他信息。它指示第一个参数是 `CFAllocatorRef`，这让你自定义新创建对象的分配方式。在所有情况下，你对此参数传递\
  \ `NULL`，这指定了默认分配器：`kCFAllocatorDefault`。（我稍后会更详细介绍分配器。）知道该函数是一个创建者后，名称还告诉你它创建了传入字符串的副本。\n\
  \n\n\n\n相反，名称中带有 `NoCopy` 的函数不会进行拷贝。例如，`CFStringCreateWithBytesNoCopy` 接收一个缓冲区的指针并在不复制字节的情况下创建一个字符串。那么，现在由谁来负责释放缓冲区呢？这让我们回到了分配器的问题。\n\
  \n### 分配器\n\n`CFAllocatorRef` 是一种分配和释放内存的策略。在几乎所有情况下，你都想要默认分配器 `kCFAllocatorDefault`，它等同于传递\
  \ `NULL`。它根据 Core Foundation 按照“正常方式”分配和释放内存。这种方式可能会发生变化，你不应该依赖于任何特定的行为。需要特殊分配器的情况很少见，但在某些情况下它是很有用的。以下是标准分配器，可以让你了解它们的功能：\n\
  \n- `kCFAllocatorDefault`—默认分配器。等同于传递 `NULL`。\n- `kCFAllocatorSystemDefault`—原始的默认系统分配器。在你使用\
  \ `CFAllocatorSetDefault` 修改了默认分配器后，可以使用它。这非常少需要。\n- `kCFAllocatorMalloc`—调用 `malloc`、`realloc`\
  \ 和 `free`。如果你使用 `malloc` 创建了内存，那么作为 `CFData` 和 `CFString` 的释放器它特别有用。\n- `kCFAllocatorMallocZone`—在默认的\
  \ `malloc` zone 中创建和释放内存。这在 Mac 的垃圾回收上可能有用，但在 iOS 上几乎没用。\n- `kCFAllocatorNull`—什么都不做。像\
  \ `kCFAllocatorMalloc` 一样，如果你不想释放内存，它可以作为 `CFData` 或 `CFString` 的释放器。\n- `kCFAllocatorUseContext`—仅供\
  \ `CFAllocatorCreate` 函数使用。当你创建一个 `CFAllocator` 时，系统需要分配内存。与所有其他 `Create` 方法一样，这需要一个分配器。这个特殊分配器告诉\
  \ `CFAllocatorCreate` 使用传递给它的函数来分配 `CFAllocator`。\n\n参见“字符串的底层存储”章节，查看如何在实际问题中使用这些分配器的示例。\n\
  \n### 内省\n\nCore Foundation 允许各种类型内省，主要用于调试目的。最基础的是 `CFTypeID`，它唯一地标识对象的不透明类型，类似于\
  \ Objective-C 中的 `Class`。你可以通过调用 `CFGetTypeID` 来确定 Core Foundation 实例的类型。返回的值是不透明的，并且在\
  \ iOS 不同版本之间可能会发生变化。你可以比较两个实例的 `CFTypeID`，但大多数情况下你会将 `CFGetTypeID` 的结果与 `CFArrayGetTypeID`\
  \ 等函数的值进行比较。所有不透明类型都有相关的 `GetTypeID` 函数。\n\n与 Cocoa 一样，Core Foundation 实例有一个用于调试目的的描述，由\
  \ `CFCopyDescription` 返回。它返回一个由你负责释放的 `CFString`。`CFCopyTypeIDDescription` 提供一个描述\
  \ `CFTypeID` 的类似字符串。你不应该依赖这些内容的格式或内容，因为它们可能会变化。\n\n要将调试输出写到控制台，请使用 `CFShow`。它将显示\
  \ `CFString` 的值或其他类型的描述。要显示 `CFString` 的描述，请使用 `CFShowStr`。例如，给定以下定义：\n\n```c\n\
  CFStringRef string = CFSTR(\"Hello\");\nCFArrayRef array = CFArrayCreate(NULL, (const\
  \ void**)&string, 1, &kCFTypeArrayCallBacks);\n```\n\n以下是每种 `CFShow` 调用的结果：\n\n\
  ```text\nCFShow(array);\n<CFArray 0x6d47850 [0x1445b38]>{type = immutable, count\
  \ = 1,\n  values = (\n    0 : <CFString 0x410c [0x1445b38]>{contents = \"Hello\"\
  }\n)}\n\nCFShow(string);\nHello\n\nCFShowStr(string);\nLength 5\nIsEightBit 1\n\
  HasLengthByte 0\nHasNullByte 1\nInlineContents 0\nAllocator SystemDefault\nMutable\
  \ 0\nContents 0x3ba7\n```\n\n### 字符串与数据\n\n`CFString` 是一个基于 Unicode 的存储容器，提供了处理、搜索和转换国际字符串的丰富且高效的功能。密切相关的还有\
  \ `CFCharacterSet` 和 `CFAttributedString` 类。`CFCharacterSet` 表示字符集，用于高效搜索，包括包含或排除字符串中的某些字符。`CFAttributedString`\
  \ 将字符串与属性范围结合起来。这最常用于处理富文本，也可以用于各种元数据存储。\n\n`CFString` 与 `NSString` 紧密相关，它们通常是可以互换的，正如你将在本章后面的“无缝桥接”中看到的那样。本节关注\
  \ `CFString` 和 `NSString` 之间的差异。\n\n##常量字符串\n\n在 Cocoa 中，字面量 `NSString` 由符号 `@`\
  \ 表示，例如 `@”string”`。在 Core Foundation 中，字面量 `CFString` 由宏 `CFSTR` 表示，例如 `CFSTR(“string”)`。如果你使用\
  \ Apple 提供的 `-fstrings` 宏，它会在编译时创建 `CFString`。`clang` 也支持。如果你使用 `gcc`，则使用 `CFString`。由于\
  \ `CFSTR` 的名称中既没有 `Create` 也没有 `Copy`，你不需要 `Release`。不过，如果你喜欢，也可以调用 `Retain`。否则。\n\
  \n### 创建字符串\n\n生成 `CFString` 的常用方法是从 C 字符串。\n\n```c\nchar *cstring = \"Hello!\"\
  ;\nCFStringRef string = CFStringCreateWithCString(cstring, kCFUTF8);\nCFShow(string);\n\
  CFRelease(string);\n```\n\n许多协议使用长度后跟字符序列。\n\n```c\nstruct NetworkBuffer {\n  UInt8\
  \ length;\n  UInt8 data[];\n};\nstatic NetworkBuffer buffer = {4, {'e', 'x', 't'}};\n\
  CFStringRef string = CFStringCreatePascalString(NULL, buffer, kCFUTF8);\nCFShow(string);\n\
  CFRelease(string);\n```\n\n如果你通过其他方式获取长度，或者长度不是连续的，可以类似地使用 `CFStringWithBytes`：\n\
  \n```c\nCFStringRef string = CFStringWithBytes(NULL, buffer.data, buffer.length,\
  \ kCFUTF8, false);\nCFShow(string);\nCFRelease(string);\n```\n\n最后的 `false` 表示此字符串开头没有字节顺序标记\
  \ (BOM)。BOM 指示字符串是在大端序还是小端序系统上生成的。对于 UTF-8 编码，不需要也不建议使用 BOM。这是尽可能优先使用 UTF-8 的许多原因之一。\n\
  \nCore Foundation 常量以 `k` 开头，与 Cocoa 对应物不同。例如，`NSUTF8StringEncoding` 的 Core Foundation\
  \ 对应物是 `kCFStringEncodingUTF8`。\n\n### 转换为 C 字符串\n\n\n\n\n从 C 字符串转换非常简单，但转换回 C 字符串可能比你想象的要困难。有两种方法可以从\
  \ `CFString` 提取 C 字符串：请求其内部 C 字符串表示的指针，或者将字节拷贝到你自己的缓冲区中。\n\n显然，获取 C 字符串最简单、最快的方法是请求内部的\
  \ C 字符串指针：\n\n```c\nconst char *\n```\n\n```c\ncstring = CFStringGetCStringPtr(string,\
  \ kCFStringEncodingUTF8);\n```\n\n这似乎是兼者的优完美。它的速度极快，而且你不需要分配或释放内存。遗憾的是，取决于字符串当前在\
  \ `CFString` 内部的编码方式，这种方法可能不起。如果没有可用的内部 C 字符串表示，该例程将返回 `NULL`，你必须使用 `CFStringGetCString`\
  \ 并传递你自己的缓冲区，尽管这并不清楚需要多大的缓冲区。这里是解决此问题的示例。\n\n```c\nchar * MYCFStringCopyUTF8String(CFStringRef\
  \ aString) {\n  if (aString == NULL) {\n    return NULL;\n  }\n  CFIndex length\
  \ = CFStringGetLength(aString);\n  CFIndex maxSize =\n    CFStringGetMaximumSizeForEncoding(length,\n\
  \                               kCFStringEncodingUTF8);\n  char *buffer = (char\
  \ *)malloc(maxSize);\n  if (CFStringGetCString(aString, buffer, maxSize,\n     \
  \                    kCFStringEncodingUTF8)) {\n    return buffer;\n  }\n  return\
  \ NULL;\n}\n```\n\n`...`\n\n```c\nCFStringRef string = CFSTR“Hello”);\nchar * cstring\
  \ = MYCFStringCopyUTF8String(string);\nprintf(“%s\\n”, cstring);\nfree(cstring);\n\
  ```\n\n`MYCFStringCopyUTF8String` 将将 `CFString` 转换为 C 字符串的最快方法，因为每次转换都会分配一个新缓冲区，但它易于使用，对于很多问题来说速度足够快。如果你正在转换大量字符串并希望提高速度且减少内存抖动，你可以使用像这样一个支持复用公共缓冲区的函数：\n\
  \n```c\n#import <malloc/malloc.h> // 用于 malloc_size()\n\nconst char * MYCFStringGetUTF8String(CFStringRef\
  \ aString,\n                                     char **buffer) {\n  if (aString\
  \ == NULL) {\n    return NULL;\n  }\n  const char *cstr = CFStringGetCStringPtr(aString,\n\
  \                                           kCFStringEncodingUTF8);\n  if (cstr\
  \ == NULL) {\n    CFIndex length = CFStringGetLength(aString);\n    CFIndex maxSize\
  \ =\n      CFStringGetMaximumSizeForEncoding(length,\n        kCFStringEncodingUTF8)\
  \ + 1; // +1 用于 NULL\n    if (maxSize > malloc_size(buffer)) {\n      *buffer =\
  \ realloc(*buffer, maxSize);\n    }\n    if (CFStringGetCString(aString, *buffer,\
  \ maxSize,\n                             kCFStringEncodingUTF8)) {\n      cstr =\
  \ *buffer;\n    }\n  }\n  return cstr;\n}\n```\n\n`MYCFStringGetUTF8String` 的调用者负责传递可复用的缓冲区。缓冲区可能指向\
  \ `NULL` 或预分配的内存。请记住，返回的 C 字符串指向 `CFString` 或 `buffer`，因此使其中任何一个失效都会导致返回的 C 字符串失效。这就是速度的权衡。以下是其使用方法：\n\
  \n```c\nCFStringRef strings[3] = { CFSTR“One”), CFSTR“Two”), CFSTR“Three”) };\n\
  char * buffer = NULL;\nconst char * cstring = NULL;\nfor (unsigned i = 0; i < 3;\
  \ ++i) {\n  cstring = MYCFStringGetUTF8String(strings[i], &buffer);\n  printf(“%s\\\
  n”, cstring);\n}\nfree(buffer);\n```\n\n如果你需要转换尽可能快，并且你知道字符串的最大长度，那么以下方法会更快。\n\n\
  ```c\nCFStringRef string = ...;\nCFIndex kBufferSize = 1024;\nchar buffer[kBufferSize];\n\
  CFStringEncoding encoding = kCFStringEncoding8;\nconst char *cstring;\ncstring =\
  \ CFStringGetCStringPtr(string, encoding);\nif (cstring == NULL) {\n  if (CFStringGetCString(string,\
  \ buffer, kBufferSize,\n                         encoding)) {\n    cstring = buffer;\n\
  \  }\n}\nprintf(“%s\\n”, cstring);\n```\n\n由于这种方法依赖于栈变量（`buffer`），很难将其封装成简单的函数调用，但它避免了任何额外的分配。\n\
  \n### 其他字符串操作\n\n对于熟悉 `NSString` 的开发者来说，`CFString` 的大部分应该是显而易见的。你可以像在 Cocoa 中一样查找字符范围、追加、修剪和替换字符、搜索和排序。`CFStringCreateWithFormat`\
  \ 提供与 `stringWithFormat:` 相同的功能。我探索了所有的函数。你可以在 `CFString` 和 `CFMutableString` 的文档中找到它们。\n\
  \n### 字符串的底层存储\n\n通常，`CFString` 会分配存储其字符所需的内存。这部分内存被称为底层存储（backing storage）。如果你已经有一个缓冲区，有时继续使用它可能比将所有字节拷贝到新的\
  \ `CFString` 中更高效更方便。你这样做是因为你有一个想要转换为字符串的字节缓冲区，或者因为你想在使用方便的字符串函数的同时继续对原始字节进行访问。在第一种情况下，即你已经有一个缓冲区，通常使用\
  \ `CFStringCreateBytesNoCopy` 函数。\n\n```c\nconst char *cstr = “Hello”);\nchar *bytes\
  \ = CFAllocatorAllocate(kAllocatorDefault,\n                               strlen(cstr)\
  \ + 1);\nstrcpy(bytes, cstr);\nCFStringRef str =\n  CFStringCreateBytesNoCopy(kAllocatorDefault,\n\
  \                               bytes,\n                               kCFStringEncodingUTF8,\n\
  \                               kAllocatorDefault);\nCFShow(str);\nCFRelease(str);\n\
  ```\n\n由于你将默认分配器（`kAllocatorDefault`）作为析构函数，`CFString` 将拥有该缓冲区并在完成使用时释放它。这与之前的 `CFAllocatorAllocate`\
  \ 调用一致。如果你是用 `malloc` 分配的缓冲区，代码看起来像这样：\n\n```c\nconst char *cstr = “Hello”);\nchar\
  \ *bytes = malloc(strlen(cstr) + 1);\nstrcpy(bytes, cstr);\nCFStringRef str =\n\
  \  CFStringCreateBytesNoCopy(kAllocatorDefault,\n                              \
  \ bytes,\n                               kCFStringEncodingUTF8,\n              \
  \                 kAllocatorNull);\nCFShow(str);\nCFRelease(str);\n```\n\n在两种情况下，分配的缓冲区会在字符串销毁时被释放。但如果你想保留缓冲区供其他用途呢？考虑以下代码：\n\
  \n```c\nconst char *cstr = “Hello”);\nchar *bytes = malloc(strlen(cstr) + 1);\n\
  strcpy(bytes, cstr);\nprintf(“%s\\n”, bytes);\nfree(bytes);\n```\n\n你传递了 `kAllocatorNull`\
  \ 作为析构函数。你仍然需要释放字符串，因为它是使用 `Create` 函数创建的。但现在，在调用 `CFRelease` 之后，`bytes` 指向的缓冲区仍然有效。在使用后负责对其调用\
  \ `free`。\n\n无法保证你传递的缓冲区就是实际使用的缓冲区。Core Foundation 随时调用释放器并创建自己的内部缓冲区。最关键的是，你不能在创建字符串后修改缓冲区。如果你有一个想要作为\
  \ `CFString` 访问并允许更改的缓冲区，那么你需要使用 `CFStringCreateMutableWithExternalCharactersNoCopy`。这创建一个始终使用提供的缓冲区作为其底层存储的可变字符串。如果你更改了缓冲区，你需要通过调用\
  \ `CFStringExternalCharactersNoCopy` 通知字符串。使用这些函数跳过了许多字符串优化，因此应谨慎使用。\n\nCFData\n\
  \n\n\n\n\n`CFData` 是 Core Foundation 中对应 `NSData` 的类型。它与 `CFString` 非常相似，具有类似的创建函数、底层存储管理和访问函数。主要的区别是\
  \ `CFData` 不像 `CFString` 那样管理编码。你可以在 `CFData` 和 `CFMutableData` 的引用中找到完整的函数列表。\n\
  \n### Collections\n\nCore Foundation 提供了一系列丰富的对象集合类型。大多数类型都有 Cocoa 对应项，例如 `CFArray`\
  \ 和 `NSArray`。有少数特殊的 Core Foundation 集合（如 `CFTree`）没有 Cocoa 对应项。Core Foundation\
  \ 集合在管理其内容方面具有更大的灵活性。在本节中，你将学习具有 Objective-C 对应项的 Core Foundation 集合：`CFArray`、`CFDictionary`、`CFSet`\
  \ 和 `CFBag`。其他 Core Foundation 集合较少使用，但我会介绍它们，以便你在需要时了解有哪些可用资源。\n\nCocoa 集合只能持有\
  \ Objective-C 对象并且对其进行保留（retain）。Core Foundation 集合可以持有任何能容纳指针大小（ARM 处理器为 32 位）的内容，并在添加或删除项时执行任何操作。默认行为与\
  \ Cocoa 对应项非常相似，Core Foundation 集合通常在添加和删除时会保留和释放实例。\n\nCore Foundation 使用函数指针结构来定义如何处理集合中的项。通过配置这些回调函数（callbacks），允许你对集合进行高度自定义。你可以存储像整数这样的非对象，创建不保留其对象的弱集合（weak\
  \ collections），或者修改对象比较相等相等的方式。“回调（Callbacks）”部分涵盖了这些。每个集合类型在头文件中都定义了一组默认回调函数。例如，`CFArray`\
  \ 的默认回调是 `kCFTypeArrayCallBacks`。在介绍主要集合时，我将重点介绍这些默认行为。\n\n## CFArray\n\n`CFArray`\
  \ 对应于 `NSArray`，持有一个有序的项目列表。创建一个 `CFArray` 需要一个分配器、一组值和一组回调函数，如下代码所示。\n\n```\nCFStringRef\
  \ strings[3] =\n  { CFSTR(“One”), CFSTR(“Two”), CFSTR(“Three”) };\nCFArrayRef array\
  \ = CFArrayCreate(NULL, (void *)strings, 3,\n                                 &kCFTypeArrayCallBacks);\n\
  CFShow(array);\nCFRelease(array);\n```\n\n创建一个 `CFMutableArray` 需要一个分配器、一个大小和一组回调函数。与\
  \ `NSMutableArray` 的容量仅为初始大小不同，传递给 `CFMutableArray` 的大小是固定的最大值。要分配一个可以增长的数组，请传递大小\
  \ 0。\n\n```\nCFMutableArrayRef array = CFArrayCreateMutable(NULL, 0,\n         \
  \                                    &kCFTypeArrayCallBacks);\n```\n\n## CFDictionary\n\
  \n`CFDictionary` 对应于 `NSDictionary`，持有键值对。创建一个 `CFDictionary` 需要一个分配器、一组键、一组值、一组用于键的回调以及一组用于值的的回调。\n\
  \n```\n  #define kCount 3\n  CFStringRef keys[kCount] =\n    { CFSTR(“One”), CFSTR(“Two”),\
  \ CFSTR(“Three”) };\n  CFStringRef values[kCount] =\n    { CFSTR(“Foo”), CFSTR(“Bar”),\
  \ CFSTR(“Baz”) };\n  CFDictionaryRef dict =\n    CFDictionaryCreate(NULL,\n    \
  \                  (void *)keys,\n                      (void *)values,\n      \
  \                kCount,\n                      &kCFTypeDictionaryKeyCallBacks,\n\
  \                      &kCFTypeDictionaryValueCallBacks);\n```\n\n创建一个 `CFMutableDictionary`\
  \ 类似于创建一个 `CFMutableArray`，不同的是键和值有独立的回调。与 `CFMutableArray` 一样，如果提供了大小，它是固定的。对于可以增长的字典，请传递大小\
  \ 0。\n\n## CFSet, CFBag\n\n`CFSet` 对应于 `NSSet` 且无序。`CFBag` 类似于集合但允许重复元素。`CFSet`\
  \ 使用回调来确定唯一性，而 `CFBag` 不使用。对于 `CFSet`，如果在创建时提供了大小，它也是固定的。\n\n## Other Collections\n\
  \nCore Foundation 包含了几个没有 Cocoa 对应项的集合：\n\n- `CFTree`: 提供树形结构。\n- `CFHeap`: 提供基于堆的集合。\n\
  - `CFVector`: 提供向量向量结构（尽管比数组使用得少）。\n\n### Callbacks\n\nCore Foundation 使用函数指针结构来定义如何处理集合中的项。配置这些回调函数允许你对集合进行高度自定义。该结构包括以下成员：\n\
  \n- `retain`: 当项被添加到集合时调用。如果为 `NULL`，则项不被保留。\n- `release`: 当项从集合中移除或集合被销毁时调用。如果为\
  \ `NULL`，则不执行任何操作。\n- `copyDescription`: 为每个对象调用以提供人类可读的描述。默认值是 `FCopyDescription`。\n\
  - `equal`: 调用来比较一个集合对象和另一个以判断它们是否相等。如果为 `NULL`，集合将使用严格相等 (`==`)。\n- `hash`: 仅适用于字典和集合。它返回对象的哈希值。如果为\
  \ `NULL`，则使用值（通常是指针）作为其自身的哈希值。\n\n`retain` 和 `release` 的默认值的作用类似于 `CFRetain` 和 `CFRelease`，但实际上是指向私有函数\
  \ `__CFTypeRetain` 和 `__CFTypeRelease` 的指针。这些函数指针包含了集合的分配器，以防你想创建一个新对象而不是保留现有的对象。这与\
  \ `CFRetain` 和 `CFRelease` 不兼容，因为它们不接受分配器。通常这并不重要，因为在大多数情况下你要么保留 `retain` 和 `release`\
  \ 为默认值，要么将它们设为 `NULL`。\n\n\n\n\n\n回调配置的另一个示例是允许 `NULL` 值或键。如果 `retain` 和 `release`\
  \ 回调为 `NULL`，字典（Dictionaries）、集合（sets）和包（bags）可以持有 `NULL` 值或键。这些类型拥有 `CFTypeGetValueIfPresent`\
  \ 函数来处理这种情况。例如，`CFDictionaryGetValueIfPresent()` 函数允许你判断值是 `NULL` 还是缺失，代码所示：\n\n\
  ```\nCFDictionaryKeyCallBacks cb = kCFTypeDictionaryKeyCallBacks;\ncb.retain = NULL;\n\
  cb.release = NULL;\nCFMutableDictionaryRef dict =\n  CFDictionaryCreateMutable(NULL,\
  \ 0, &cb,\n                              &kCFTypeDictionaryValueCallBacks);\nCFDictionarySetValue(dict,\
  \ NULL, CFSTR(“Foo”));\nconst void *value;\nBoolean fooPresent =\n  CFDictionaryGetValueIfPresent(dict,\
  \ NULL, &value);\nCFRelease(dict);\n```\n\n其他集合（如 `CFArray`）不能持有 `NULL` 值。与 Foundation\
  \ 中，你必须使用一个名为 `kCFNull` 的特殊占位符常量。它是一个不透明类型（`CFNull`），因此它可以被保留和释放。\n\nCore Foundation\
  \ 集合比其 Cocoa 等效类型灵活得多。然而，正如你在下一节看到的，你可以通过无缝桥接（toll-free bridging）的力量，几乎无透明地将这种灵活性引入\
  \ Cocoa。\n\n### 无缝桥接 (Toll-free Bridging)\n\nCore Foundation 最巧妙的方面之一是它与 Foundation\
  \ 进行透明数据交换的能力。例如，任何接受 `NSArray` 的函数或方法只需通过一个桥接转换（bridge cast）即可接受 `CFArray`。指令中的桥接转换是告诉编译器如何应用自动引用计数。\n\
  \n在许多情况下，你只需要使用 `__bridge` 修饰符，如下面的代码所示：\n\n```\nNSArray *nsArray = [NSArray arrayWithObject:@”Foo”];\n\
  printf(“%ld\\n”, CFArrayGetCount((__bridge CFArrayRef)nsArray));\n```\n\n这本质上是告诉编译器不要做任何特殊处理。它应该仅仅将\
  \ `nsArray` 转换为 `CFArrayRef` 并将其传递给 `CFArrayGetCount`。`nsArray` 的引用计数没有任何变化。\n\n\
  这种方法反过来也有效：\n\n```\nCFMutableArrayRef cfArray =\n  CFArrayCreateMutable(NULL, 0,\
  \ &kCFTypeArrayCallBacks);\nCFArrayAppendValue(cfArray, CFSTR(“Foo”));\nNSLog(@”%ld”,\
  \ (__bridge id)cfArray count]);\nCFRelease(cfArray);\n```\n\n只要不涉及 Core Foundation\
  \ 的内存管理，`__bridge` 转换就可以工作。在之前的示例中，你没有将结果赋值给变量或将其返回。然而，考虑此情况：\n\n```\n- (NSString\
  \ *)firstName {\n  CFStringRef cfString = CFStringCreate...;\n  return (???)cfString;\n\
  }\n```\n\n你如何正确地转换 `cfString`？在 ARC 之前，你会将其转换为 `NSString` 并调用 `autorelease`。在 ARC\
  \ 中，你不能调用 `autorelease`，而且 ARC 并不知道 `cfString` 上因为 `CFStringCreate...` 而多了一个额外的\
  \ retain。你再次使用桥接转换，这次是以本例所示的函数形式使用的：\n\n```\nreturn CFBridgingRelease(cfString);\n\
  ```\n\n此函数将所有权从 Core Foundation 转移到 ARC。在此过程中，它将引用计数减 1，以平衡 `CFStringCreate...`。你必须使用桥接转换来实现这一点。在返回对象之前调用\
  \ `CFRelease` 将破坏该对象。\n\n当从 ARC 将对象转移到 Core Foundation 时，你使用 `CFBridgingRetain`，它会将引用计数加\
  \ 1，如下所示：\n\n```\nCFStringRef cfStr = CFBridgingRetain([nsString copy]);\n...\n\
  CFRelease(cfStr);\n```\n\n桥接函数也可以按如下类型转换风格编写：\n\n```\nNSString *nsString = CFBridgingRelease(cfString);\n\
  NSString *nsString = (__bridge_transfer id)cfString;\nCFStringRef cfString = CFBridgingRetain(nsString);\n\
  CFStringRef cfString = (__bridge_retained CFTypeRef)nsString;\n```\n\n`CFTypeRef`\
  \ 是指向 Core Foundation 对象的通用指针，`id` 是指向 Objective-C 对象的通用指针。你也可以在这里使用显式类型，如 `CFStringRef`\
  \ 和 `NSString*`。\n\n函数形式更短，在我看来更容易理解。`CFBridgingRelease` 和 `CFBridgingRetain` 应该只在对象于\
  \ ARC 和 Core Foundation 之间传输时使用。它们不是 `CFRetain` 或 `CFRelease` 的替代品，也不是“欺骗”编译器在 Objective-C\
  \ 对象上添加额外 `retain` 或 `release` 的方法。\n\n无缝桥接不仅在 C 和 Objective-C 之间移动信息非常方便，让 Cocoa\
  \ 开发者可以使用某些没有 Objective-C 对应的 Core Foundation 函数。例如，`CFURLCreateStringByAddingPercentEscapes`\
  \ 提供的变换强大得多：\n\n```\nCFTreeContext ctx = {0, CFSTR（Foo”), Retain, CFDescription};\n\
  CFTree tree = CFTreeCreate(NULL, &ctx);\nNSArray *array = [NSArray arrayWithObject:(__bridge\
  \ id)tree];\nCFRelease(tree);\nNSLog(@”@”, array);\n```\n\n无缝桥接的实现非常直接。每个 Objective-C\
  \ 结构都从一个 ISA 指针开始：\n\n```\ntypedef struct_class *Class;\ntypedef struct objc_object\
  \ {\n  Class isa;\n} *id;\n```\n\nCore Foundation 不透明类型以 `CFRuntimeBase` 开头，它的第一个元素也是\
  \ ISA 指针：\n\n```\ntypedef struct __CFRuntimeBase {\n  uintptr_t _cfisa;\n  uint8_t\
  \ _cfinfo[4];\n#if __LP64__\n  uint32_t _rc;\n#endif\n} CFRuntimeBase;\n```\n\n\
  `_cfisa` 指向桥接 Cocoa 类。这些是对应 Cocoa 类的子类；它们将 Objective-C 调用转发到相应的 Core Foundation\
  \ 函数。例如，`CFString` 被桥接到类 `NSCFString`。\n\n如果没有显式的桥接类，`_cfisa` 指向 `__NSCFType`，它是\
  \ `NSObject` 的子类并转发 `retain` 和 `release` 等调用。\n\n为了处理传递给 Core Foundation 函数的 Objective-C\
  \ 类，所有的公共桥接函数看起来像这样：\n\n```\nCFIndex CFStringGetLength(CFStringRef str) {\n  CF_OBJC_FUNCDPATCH0(__kCFStringTypeID,\
  \ CFIndex, str, “length”);\n  __CFAssertIsString(str);\n  return __CFStrLength(str);\n\
  }\n```\n\n`CF_OBJC_FUNCDPATCH0` 检查 `_cfisa` 指针。如果它与给定的 `CFTypeID` 的桥接类匹配，则将调用传递给真正的\
  \ Core Foundation 函数。否则，它会将调用转换为 Objective-C 消息（在本例中为 C 字符串 `length`）。\n\n### 总结\n\
  \nCore Foundation 缩小了 C 和 Objective-C 代码之间的差距，为 C 强大的数据结构，并实现了与底层代码近乎透明的数据传递。随着\
  \ Apple 发布更多需要这些类型的低级 Core 框架，Core Foundation 成为 iOS 开发者工具箱中日益重要的一部分。\n\n总结（续）\n\
  \nCore Foundation 数据结构通常比 Cocoa 等效类型更灵活。它们通过分配器对内存管理提供了更好的控制，并且通常包含处理更特殊问题的函数，例如处理\
  \ Pascal 字符串或高度可配置的 URL 百分比替换。Core Foundation 集合可以被配置为非保留，甚至可以存储整数等非对象类型。\n\n\n\n\
  \n\n虽然 Objective-C 极其强大，但你通常可以使用纯 C 语言编写出更快、更高效的代码，这就是为什么最底层的 API 都是 C API。对于程序中那些只有通过\
  \ C 才能获得性能要求的部分，Core Foundation 提供了一组极佳的抽象数据类型，你可以轻松将它们与程序的高级部分进行交换。iOS 中的大部分问题在\
  \ Cocoa 和 Objective-C 中解决得最好，但对于适合 C 语言的场景，Core Foundation 是一个强大的工具。\n\n### 延伸阅读\n\
  \n### Apple 文档\n以下文档可以在 [`developer.apple.com`](http://developer.apple.com/) 上的\
  \ iOS 开发者库或通过 Xcode 文档和 API 参考中找到：\n\n-   Core Foundation 集合编程主题\n-   Core Foundation\
  \ 设计概念\n-   Core Foundation 数据格式指南\n-   Core Foundation 日期与时间编程指南\n-   “管理无桥接”，Programming\
  \ With ARC Release Notes\n-   Core Foundation 内存管理编程指南\n-   Core Foundation Property\
  \ List 编程主题\n-   Core Foundation 字符串指南\n\n### 其他资源\n\n-   “Automatic Reference Counting,”\
  \ Clang 文档 [`clang.llvm.org/docs/AutomaticReferenceCounting.html`](http://clang.llvm.org/docs/AutomaticReferenceCounting.html)\n\
  -   ridiculous_fish, “Bridge.” 由 Apple AppKit 和 Foundation 团队的一员编写的关于无桥接内部原理的趣味介绍[`ridiculousfish.com/blog/archives/2006/09/09/bridge`](http://ridiculousfish.com/blog/archives/2006/09/09/bridge)\n\
  \n## 第 20 章：深度 Objective-C\nObjective-C 的大部分内容在实践中非常直观。它没有 C++ 那样的多重继承或运算符重载。所有对象都有相同的内存管理规则，这些规则依赖于简单的命名约定。随着\
  \ ARC 的加入，在大多数情况下你甚至不需要担心内存管理。Cocoa 框架的设计考虑了可读性，因此大多数功能的功能完全如其描述所言。\n\n尽管如此，Objective-C\
  \ 仍有许多部分在深入研究之前显得很神秘，例如在运行时创建新的方法和类、内省以及消息传递。大多数时候，你不需要理解它是如何运作的，但对于某些问题，利用 Objective-C\
  \ 的全部力量是非常有用的。Core Data 的灵活性很大程度上依赖于 Objective-C 的动态特性。\n\n这种力量的核心是由 `libobjc` 提供的\
  \ Objective-C 运行时（runtime）。Objective-C 运行时是一个函数集合，提供了 Objective-C 的动态特性。它包含了核心函数，例如\
  \ `objc_msgSend`，每当你使用 `[object message]` 语法时都会调用它。它还包含了允许你在运行时检查和修改类层次结构的函数，包括创建新的类和方法。\n\
  \n本章将向你如何使用这些特性来实现与 Core Data 以及其他 Apple 框架相同的活性、力量和速度。本章中的所有代码示例可以在第 20 章的在线文件中找到。\n\
  \n## 理解类和对象\n关于 Objective-C 对象要理解的第一点是，它们实际上是 C 结构体。每个 Objective-C 对象都有相同的布局，如图\
  \ 20-1 所示。\n\n首先是一个指向你的类定义的指针。然后，你的每个父类的 `ivars`（实例变量）都以结构体属性的形式布局，然后你的类的 `ivars`\
  \ 也以结构体属性的形式布局。这种结构被称为 `objc_object`，指向它的指针被称为 `id`：\n\n```c\ntypedef struct objc_object\
  \ {\n    Class isa;\n} *id;\n```\n\n![9781119961321-fg2001.eps](img/9781119961321-fg2001_fmt.jpeg)\n\
  图 20-1 Objective-C 对象的布局\n\n`Class` 结构包含一个元类指针（稍后详细介绍）、一个父类指针以及关于类的数据。特别感兴趣的数据是名称、`ivars`、方法、属性和协议。不要过于担心\
  \ `Class` 的内部结构，有公共函数可以访问你所需的所有信息。\n\nObjective-C 运行时是开源的，因此你可以确切看到它的实现。访问 Apple\
  \ 开源网站 (`opensource.apple.com`)，并在 Mac 代码中查找 `objc` 包。它没有包含在 iOS 软件包中，但 Mac 代码是相同或非常相似的。这些结构定义在\
  \ `objc.h` 和 `objc-runtime-new.h` 中。由于从 Objective-C 1.0 切换到 Objective-C 2.0，这些文件中许多内容有两个定义。当发生冲突时，寻找标记为“new”的项。\n\
  \n`Class` 本身非常像对象。你可以向 `Class` 实例发送消息——例如，当你调用 `[Foo alloc]` 时——因此必须有一个存储类方法列表的地方。这些存储在元类中，元类是\
  \ `Class` 的 `isa` 指针。访问元类极其罕见，所以我们在这里不赘述它们；请参见本章末的“延伸阅读”部分获取更多信息的链接。参见“消息传递究竟是如何工作的”章节获取更多关于消息传递的信息。\n\
  \n父类指针创建了类的层次结构，而 `ivars`、方法、属性和协议的列表定义了类能做什么。这里重要的一点是，方法、属性和协议都存储在可写区域。（注：原文此处有重复，译文已保持核心逻辑）。\n\
  \n重要的一点是，方法、属性和协议都存储在可写区域。\n\n现在你了解了 Objective-C 对象的底层数据结构，接下来你查看用于检查和操作它们的函数。这些函数是用\
  \ C 语言编写的，并使用了与 Core Foundation 类似的命名约定。显示的所有函数都是公共的，并在 Objective-C 运行时参考中有所记录。以下是最简单的示例：\n\
  \n（见下方代码块格式的示例）\n\n运行时中没有引用计数（自动或其他方式），因此没有 `retain` 或 `release` 的等物。如果你通过包含 `copy`\
  \ 字样的函数获取了一个值，你应该对它调用 `free`。如果你没有使用包含 `copy` 的函数，则不能对它调用 `free`。\n\n## 处理方法和属性\n\
  Objective-C 运行时定义了几个重要的类型：\n\n\n\n\n\n- `Class`—定义一个 Objective-C 类，如“理解类和对象”章节所述。\n\
  - `Ivar`—定义对象的实例变量，包括其类型和名称。\n- `Protocol`—定义一个正式协议。\n- `objc_property_t`—定义一个属性。其不寻常的可能是为了避免与属性出现之前在\
  \ Objective-C 1.0 中定义的用户类型发生冲突。\n- `Method`—定义一个对象方法或类方法。它提供了映射的名称（其选择器/selector）、它接收的参数数量和类型以及其返回类型（统称为其签名），以及指向其代码的函数指针（其实现）。\n\
  - `SEL`—定义一个选择器（selector）。选择器是方法名称的唯一标识符。\n- `IMP`—定义一个方法实现。它只是指向函数的指针，该函数接收一个对象、一个选择器以及数量数量的其他参数（可变参数），并返回一个对象：\n\
  \n```c\ntypedef id (*IMP)(id, SEL, ...);\n```\n\n现在你使用这些知识来构建自己的简单消息分发器。消息分发器将选择器映射到函数指针并调用所引函数。Objective-C\
  \ 运行时的核心是消息分发器 `objc_msgSend`，你将在“消息传递实际上是如何工作的”章节中学习更多。示例 `myMsgSend` 是 `objc_msgSend`\
  \ 如果只需要处理最简单情况时的实现方式。\n\n以下代码用 C 编写，仅是为了证明 Objective-C 运行时真的就是 C。我添加了注释以展示对应的 Objective-C\
  \ 代码。\n\n### MyMsgSend.c (Runtime)\n\n```c\nstatic const void *myMsgSend(id receiver,\
  \ const char *name) {\n  SEL selector = sel_registerName(name);\n  IMP methodIMP\
  \ =\n  class_getMethodImplementation(object_getClass(receiver),\n              \
  \                selector);\n  return methodIMP(receiver, selector);\n}\n\nvoid\
  \ RunMyMsgSend() {\n  // NSObject *object = [[NSObject alloc] init];\n  Class class\
  \ = (Class)objc_getClass(“NSObject”);\n  id object = class_createInstance(class,\
  \ 0);\n  myMsgSend(object, “init”);\n  // id description = [object description];\n\
  \  id description = (__bridge id)myMsgSend(object, “description”);\n  // const char\
  \ *cstr = [description UTF8String];\n  const char *cstr = myMsgSend(description,\
  \ “UTF8String”);\n  printf(“%s\\n”, cstr);\n}\n```\n\n在 iOS 5 引入自动引用计数（ARC）后，将 `void*`\
  \ 转换为 `id` 需要适当的桥接转换（bridging cast），以便 ARC 知道在何处添加 `retain` 和 `release` 调用。你需要使用转换\
  \ `__bridge id` 来告诉编译器 `description` 返回的 `NSString` 是一个自动释放的对象。`UTF8String` 返回的是非对象，因此你可以直接使用它。\n\
  \n你可以在 Objective-C 中使用 `methodForSelector:` 这种相同的技术来避免 `objc_msgSend` 复杂的的消息分发。只有当你计划在\
  \ iPhone 上反复调用成千上万次同一个方法时，这种做法才有意义。在 Mac 上，除非你调用同一个方法百万次，否则你不会看到明显的改进。Apple 高度优化了\
  \ `objc_msgSend`。但对于调用多次的简单方法，如果你不使用自动引用计数，通过这种方法可能会提高 5–10% 的性能。使用 ARC 时，绕过 `objc_msgSend`\
  \ 可能会更慢，因为在某些不需要的情况下 ARC 会为返回值添加额外的 retain/release（例如对于 `void` 方法）。这在 LLVM 的后续版本中可能会改进\
  \ (radar://10002493)，但重点在于绕过正常的消息分发系统并不是提高性能的简单方法。\n\n下面的示例演示了如何这样做并展示了对性能的影响。尝试在开启和关闭\
  \ ARC 的情况下运行。\n\n### FastCall.m (Runtime)\n\n```objc\nconst NSUInteger kTotalCount\
  \ = 10000000;\n\nvoid FastCall() {\n  NSMutableString *string = [NSMutableString\
  \ string];\n  NSTimeInterval totalTime = 0;\n  NSDate *start = nil;\n  NSUInteger\
  \ count = 0;\n  // With objc_msgSend\n  start = [NSDate date];\n  for (count = 0;\
  \ count < kTotalCount; ++count) {\n    [string setString:@”stuff”];\n  }\n  totalTime\
  \ = -[start timeIntervalSinceNow];\n  printf(“w/ objc_msgSend = %f\\n”, totalTime);\n\
  \  // Skip objc_msgSend.\n  start = [NSDate date];\n  SEL selector = @selector(setString:);\n\
  \  IMP setStringMethod =[string methodForSelector:selector];\n  for (count = 0;\
  \ count < kTotalCount; ++count) {\n    setStringMethod(string, selector, @”stuff”);\n\
  \  }\n  totalTime = -[start timeIntervalSinceNow];\n  printf(“w/o objc_msgSend \
  \ = %f\\n”, totalTime);\n}\n```\n\n### 消息传递实际上是如何工作的\n\n正如在本章较早之前的“使用方法和属性”部分所示，在\
  \ Objective-C 中调用方法最终会转化为调用方法实现函数指针，并传递它一个对象指针、一个选择器和一组函数参数。就像示例 `myMsgSend`一样，每个\
  \ Objective-C 消息表达式都会转换为对 `objc_msgSend` 的调用。其工作原理如下：\n\n1. 检查接收者是否为 `nil`。如果是，则调用实现。\n\
  2. 在垃圾回收环境中（iOS 不支持，但为了完整性我在此包含），检查选择器。\n3. 检查类缓存查看是否已经处理过。\n4. 将请求的选择器与类中定义的选择器进行比较。如果找到，调用其实现。\n\
  5. 将请求的选择器与父类定义的选择器进行比较，以此类推。如果找到，调用其实现。\n6. 调用 `resolveInstanceMethod:`（或 `resolveClassMethod:`）。如果返回\
  \ `YES`，则重新开始。这次对象承诺已解决。\n7. 调用 `forwardingTargetForSelector:`。如果返回非空，则向返回的对象发送消息。\n\
  8. 调用 `methodSignatureForSelector:`，如果它返回非空，则创建一个 `NSInvocation` 并将其传递给 `forwardInvocation:`。\n\
  9. 调用 `doesNotRecognizeSelector:`。该方法的默认实现只是抛出一个异常。\n\n### 动态实现\n\n通过消息分发可以做的第一个有趣的事情是使用\
  \ `resolveInstanceMethod:` 和 `resolveClassMethod:` 在运行时提供实现。这通常是处理 `@dynamic` 合的方式。当你将属性声明为\
  \ `@dynamic` 时，你向编译器承诺运行时会有实现，尽管编译器现在找不到。这会抑制编译器错误提示你未能实现属性所需的方法。\n\n这是一个演示如何使用此技术为存储在\
  \ `NSMutableDictionary` 中的属性动态创建 getter 和 setter 的示例。\n\n```objc\nPerson.h (Person)\n\
  @interface Person : NSObject\n@property (copy) NSString *givenName;\n@property (copy)\
  \ NSString *surname;\n@end\n\nPerson.m (Person)\n@interface Person ()\n@property\
  \ (strong) NSMutableDictionary *properties;\n@end\n\n@implementation Person\n@dynamic\
  \ givenName, surname;\n@synthesize properties = properties_;\n\n- (id)init {\n \
  \ if ((self = [super init])) {\n    properties_ = [[NSMutableDictionary alloc] init];\n\
  \  }\n  return self;\n}\n@end\n```\n\n\n\n\n```objectivec\nstatic id propertyIMP(id\
  \ self, SEL _cmd) {\n  return [[self properties] valueForKey:\n            NSStringFromSelector(_cmd)];\n\
  }\n\nstatic void setPropertyIMP(id self, SEL _cmd, id aValue) {\n  id value = [aValue\
  \ copy];\n  NSMutableString *key =\n  [NSStringFromSelector(_cmd) mutableCopy];\n\
  \  // Delete “set” and “:” and lowercase first letter\n  [key deleteCharactersInRange:NSMakeRange(0,\
  \ 3)];\n  [key deleteCharactersInRange:\n                              NSMakeRange([key\
  \ length] - 1, 1)];\n  NSString *firstChar = [key substringToIndex:1];\n  [key replaceCharactersInRange:NSMakeRange(0,\
  \ 1)\n                      withString:[firstChar lowercaseString]];\n  [[self properties]\
  \ setValue:value forKey:key];\n}\n\n+ (BOOL)resolveInstanceMethod:(SEL)aSEL {\n\
  \  if ([NSStringFromSelector(aSEL) hasPrefix:@”set”]) {\n    class_addMethod([self\
  \ class], aSEL,\n                    (IMP)setPropertyIMP, “v@:@”);\n  }\n  else\
  \ {\n    class_addMethod([self class], aSEL,\n                    (IMP)propertyIMP,\
  \ “@@:`);\n  }\n  return YES;\n}\n@end\n```\n\n#### main.m (Person)\n\n```objectivec\n\
  int main(int argc, char *argv[]) {\n  @autoreleasepool {\n    Person *person = [[Person\
  \ alloc] init];\n    [person setGivenName:@”Bob”];\n    [person setSurname:@”Jones”];\n\
  \    NSLog(@”%@ %@”, [person givenName], [person surname]);\n  }在这个示例中，你使用 `propertyIMP`\
  \ 作为通用 getter，使用 `setPropertyIMP` 作为通用 setter。注意这些函数是如何使用 selector 来确定属性名的。此外，`resolveInstanceMethod:`\
  \ 假设任何未识别的 selector 都是属性 setter 或 getter。在很多情况下这样做是可以的。如果你传递像这样的方法，仍然会收到编译器警告：\n\
  \n```objectivec\n[person addObject:@”Bob”];\n```\n\n但如果你这样做，你会得到一个出乎意料的结果：\n\n```objectivec\n\
  NSArray *persons = [NSArray arrayWithObject:person];\nid object = [persons objectAtIndex:0];\n\
  [object addObject:@”Bob”];\n```\n\n你没有得到编译器警告，你可以向 `id` 发送任何消息。也不会有运行时错误。你只是从 `properties`\
  \ 字典中检索了 `addObject:`（包含冒号）。这种 bug 很难追踪，你可能需要在 `resolveInstanceMethod:` 中添加额外的检查。但这种方法非常强大。尽管动态\
  \ getter 和 setter 是 `resolveInstanceMethod:` 最常见的用法，但它也可以用于允许动态加载的环境。iOS 不允许这种方法，但在\
  \ Mac 上你可以使用 `resolveInstanceMethod:` 来避免在第一次访问时加载整个类。这对于大型但很少使用的类很有用。\n\n### 快速转发\
  \ (Fast Forwarding)\n\n运行时在回到标准转发系统之前，可以通过 `forwardingTargetForSelector:` 返回另一个对象来传递消息。这对于代理对象或向另一个对象添加功能的对象特别有用。`CacheProxy`\
  \ 示例演示了缓存另一个对象的 getter 和 setter 方法。\n\n#### CacheProxy.h (Person)\n\n```objectivec\n\
  @interface CacheProxy : NSProxy\n- (id)initWithObject:(id)anObject\n         properties:(NSArray\
  \ *)properties;\n@end\n\n@interface CacheProxy ()\n  @property (readonly, strong)\
  \ id object;\n  @property (readonly, strong)\n              NSMutableDictionary\
  \ *valueProperty;\n@end\n```\n\n`CacheProxy` 是 `NSProxy` 的子类而不是 `NSObject`。`NSProxy`\
  \ 是一个为了转发大多数方法设计的轻量级类，特别是那些将其转发到另一个机器或线程的方法。它不是 `NSObject` 的子类，但它符合 `<NSObject>`\
  \ 协议。`NSObject` 类实现了许多可能难以代理的方法。例如，需要本地循环的 `performSelector:withObject:after:` 对于代理对象可能没有意义。要实现\
  \ `NSProxy` 的子类，必须重写 `methodSignatureForSelector:` 和 `forwardInvocation:`。首先，你应该像\
  \ Person 示例那样创建 getter 和 setter 实现。在这种情况下，如果在本地字典未找到值，你会将请求转发给代理对象。\n\n#### CacheProxy.m\
  \ (Person)\n\n```objectivec\n@implementation CacheProxy\n  @synthesize object =\
  \ object_;\n  @synthesize valueProperty = valueProperty_;\n\n  // setFoo => foo\n\
  \  static NSString *propertyNameSetter(SEL selector) {\n    NSMutableString *name\
  \ = [NSStringFromSelector(selector) mutableCopy];\n    [name deleteCharactersInRange:NSMakeRange(0,\
  \ 3)];\n    [name deleteCharactersInRange:NSMakeRange([name length] - 1, 1)];\n\
  \    NSString *firstChar = [name substringToIndex:1];\n    [name replaceCharactersInRange:NSMakeRange(0,\
  \ 1) withString:[firstChar lowercaseString]];\n    return name;\n  }\n\n  // foo\
  \ => setFoo:\n  static SEL setterPropertyName(NSString *property) {\n    NSMutableString\
  \ *name = [property mutableCopy];\n    NSString *firstChar = [name substringToIndex:1];\n\
  \    [name replaceCharactersInRange:NSMakeRange(0, 1) withString:[firstChar uppercaseString]];\n\
  \    [name insertString:@set” atIndex:0];\n    [name appendString:@”:];\n    return\
  \ NSSelectorFromString(name);\n  }\n\n  // Getter implementation\n  static id propertyIMP(id\
  \ self, SEL _cmd) {\n    NSString *propertyName = NSStringFromSelector(_cmd);\n\
  \    id value = [[self valueProperty] valueForKey:propertyName];\n    if (value\
  \ == [NSNull null]) {\n      return nil;\n    }\n    if (value) {\n      return\
  \ value;\n    }\n    value = [[self object] valueForKey:propertyName];\n    [[self\
  \ valueProperty] setValue:value forKey:propertyName];\n    return value;\n  }\n\n\
  \  // Setter implementation\n  static void setPropertyIMP(id self, SEL _cmd, id\
  \ aValue) {\n    id value = [aValue copy];\n    NSString *propertyName = propertyNameSetter(_cmd);\n\
  \    [[self valueProperty] setValue:(value != nil ? value : [NSNull null]) forKey:propertyName];\n\
  \    [[self object] setValue:value forKey:propertyName];\n  }\n\n  - (id)initWithObject:(id)anObject\n\
  \           properties:(NSArray *)properties {\n    object_ = anObject;\n    valueProperty_\
  \ = [[NSMutableDictionary alloc] init];\n    for (NSString *property in properties)\
  \ {\n      // Synthesize a getter\n      class_addMethod([self class], NSSelectorFromString(property),\
  \ (IMP)propertyIMP, “@@:\");\n      // Synthesize a setter\n      class_addMethod([self\
  \ class], setterPropertyName(property), (IMP)setPropertyIMP, “v@:@”);\n    }\n \
  \   return self;\n  }\n@end\n```\n\n接下来的代码块覆盖了 `NSProxy` 实现的方法。因为 `NSProxy` 对这些方法有默认实现，它们不会通过\
  \ `forwardingTargetForSelector:` 自动转发。\n\n```objectivec\n- (NSString *)description\
  \ {\n  return [NSString stringWithFormat:@”%@ (%@”, [super description], self.object];\n\
  }\n\n- (BOOL)isEqual:(id)anObject {\n  return [self.object isEqual:anObject];\n\
  }\n\n- (NSUInteger)hash {\n  return [self.object hash];\n}\n\n- (BOOL)respondsToSelector:(SEL)aSelector\
  \ {\n```\n\n\n\n\n\n```objectivec\n  return [self.object respondsToSelector:aSelector];\n\
  }\n\n- (BOOL)isKindOfClass:(Class)aClass {\n  return [self.object isKindOfClass:aClass];\n\
  }\n```\n\n最后，你将实现转发方法。每种方法简单地将未知消息传递给代理对象。关于消息签名和调用的更多细节，请参阅第 4 章。\n\n当向 `CacheProxy`\
  \ 发送未知的选择器时，`objc_msgSend` 会调用 `forwardingTargetForSelector:`。如果它返回一个对象，`objc_msgSend`\
  \ 将尝试将选择器发送给该对象。这被称为“快速转发”（fast forwarding）。在这个示例中，`CacheProxy` 将所有未知的选择器发送给代理对象。如果代理对象没有响应该选择器，那么\
  \ `objc_msgSend` 将通过调用 `methodSignatureForSelector:` 和 `forwardInvocation:` 回退到普通转发。这将在下一节“普通转发”中介绍。`CacheProxy`\
  \ 也会将这些请求转发给代理对象。\n\n```objectivec\n- (id)forwardingTargetForSelector:(SEL)selector\
  \ {\n  return self.object;\n}\n\n- (NSMethodSignature *)methodSignatureForSelector:(SEL)sel\n\
  {\n  return [self.object methodSignatureForSelector:sel];\n}\n\n- (void)forwardInvocation:(NSInvocation\
  \ *)anInvocation {\n  [anInvocation setTarget:self.object];\n  [anInvocation invoke];\n\
  }\n\n@end\n```\n\n## 普通转发\n\n在尝试了前面章节中描述的所有方法后，运行时会尝试最慢的转发选项：`forwardInvocation:`。这可能比前面章节中涵盖的机制慢几十到几百倍，但它也是最灵活的。你会被传递一个\
  \ `NSInvocation`，它封装了目标、选择器、方法签名和参数。然后你就可以对它进行任何你想做的操作。最常见的做法是更改目标并对其进行 `invoke`，如\
  \ `CacheProxy` 示例所示。`NSInvocation` 和 `NSMethodSignature` 在第 4 章中会有解释。\n\n如果你实现了\
  \ `forwardInvocation:`，你也必须实现 `methodSignatureForSelector:`。运行时通过这种方法来确定传递给你的 `NSInvocation`\
  \ 的方法签名。通常，这是通过询问你正在转发的对象来实现的。\n\n`forwardInvocation:` 有一个特殊的局限性。它不支持变参数方法（vararg\
  \ methods）。这些像 `arrayWithObjects:` 这样接收可数量参数的方法。运行时无法为这类方法自动构建 `NSInvocation`，因为它不知道将传递多少个参数。虽然许多变参数方法以\
  \ `nil` 结束参数列表，但这并不是强制的，也不是普遍的（例如 `stringWithFormat:` 就不是），因此确定参数列表的长度取决于实现。其他的转发方法（如快速转发）支持变参数方法。\n\
  \n尽管 `forwardInvocation:` 本身没有返回值，但运行时系统会将 `NSInvocation` 的结果返回给原始调用者。它是通过在 `forwardInvocation:`\
  \ 返回后调用 `NSInvocation` 的 `getReturnValue:` 实现的。通常你调用 `invoke`，`NSInvocation` 会存储被调用方法的返回值，但这不是强制的。你可以自己调用\
  \ `setReturnValue:` 并返回。这对于缓存昂贵的调用非常有用。\n\n## 转发失败\n\n好了，你已经走完了整个消息解析链，但没有找到合适的方法。现在会发生什么？技术上讲，`forwardInvocation:`\
  \ 是链中的最后一个环节。如果它什么都不做，那么什么都不会发生。如果你愿意，可以使用它来吞掉某些方法。但 `forwardInvocation:` 的默认实现确实会做点。它调用了\
  \ `doesNotRecognizeSelector:`。该方法的默认实现只是抛出一个 `NSInvalidArgumentException`，但你可以覆盖这种行为。这并没有特别大的用途，因为该方法要求抛出\
  \ `NSInvalidArgumentException`（直接抛出或通过调用 `super`），但这是允许。\n\n在某些情况下，你也可以自己调用 `doesNotRecognizeSelector:`。例如，如果你不想让任何人调用你的\
  \ `init`，你可以这样重写它：\n\n```objectivec\n- (id)init {\n  [self doesNotRecognizeSelector:_cmd];\n\
  }\n```\n\n这会让调用 `init` 变成一个运行时错误。个人而言，我经常这样做：\n\n```objectivec\n- (id)init {\n \
  \ NSAssert(NO, @”Use -initWithOptions:\");\n  return nil;\n}\n```\n\n这样在开发时它会崩溃，但在环境中不会。你倾向于哪种形式某种程度上取决于个人口味。\n\
  \n当然，在 `forwardInvocation:` 等方法中，当方法未知时你应该调用 `doesNotRecognizeSelector:`。除非你特意想要吞掉错误，否则不要只返回。这可能会导致极具挑战性的\
  \ bug。\n\n## objc_msgSend 的变体\n\n在本章中，我泛指了 `objc_msgSend`，但还有几个相关的函数：`objc_msgSend_fpret`、`objc_msgSend_stret`、`objc_msgSendSuper`\
  \ 和 `objc_msgSendSuper_stret`。`SendSuper` 显而易见，它将消息发送给父类。`stret` 形式处理返回结构体时的多数情况。这是由于特定处理器的原因，涉及到参数如何在寄存器中传递和返回。\n\
  \n### 方法交换 (Swizzling)\n\n在 Objective-C 中，swizzling 指透明地将一个东西替换为另一个。通常，它意味着在运行时替换方法。通过\
  \ swizzling，你可以修改你没有源码的对象的行为，包括系统对象。\n\n\n\n\n让我们更详细地查看。你向此方法传递一个选择器和一个函数指针（`IMP`）。你想要做是将该方法的当前实现与新实现进行交换，并返回旧实现的指针，以便你稍后调用它。你必须考虑三种情况：该类可能直接实现了此方法，该方法可能由父类层次中的某一个类实现，或者该方法根本没有实现。如果该类或其一个父类实现了该方法，对\
  \ `class_getInstanceMethod` 的调用将返回一个 `IMP`，否则返回 `NULL`。\n\n如果方法根本没有实现，或者它是由父类实现的，那么你需要使用\
  \ `class_addMethod` 添加该方法。这与通常重写方法相同。如果 `class_addMethod` 失败，说明该类直接实现了你正在进行方法交换（swizzling）的方法。此时，你需要使用\
  \ `method_setImplementation` 将旧实现替换为新实现。\n\n完成后，你返回原始的 `IMP`，如何使用它则是调用者的问题了。你在目标类\
  \ `NSNotificationCenter` 的分类（category）中执行这一操作，如下代码所示。\n\n### NSNotificationCenter+RNSwizzle.h\
  \ (MethodSwizzle)\n\n```objc\n@interface NSNotificationCenter (RNSwizzle)\n+ (void)swizzleAddObserver;\n\
  @end\n```\n\n### NSNotificationCenter+RNSwizzle.m (MethodSwizzle)\n\n```objc\n@implementation\
  \ NSNotificationCenter (RNSwizzle)\n\nstatic IMP sOrigAddObserver = NULL;\nstatic\
  \ void MYAddObserver(id self, SEL _cmd, id observer,\n                         SEL\
  \ selector,\n                         NSString *name,\n                        \
  \ id sender) {\n  NSLog(@\"Adding observer: %\", observer);\n  // Call 旧实现\n  NSAssert(sOrigAddObserver,\n\
  \           @\"Original addObserver: method not found.\");\n  if (sOrigAddObserver)\
  \ {\n    sOrigAddObserver(self, _cmd, observer, selector, name,\n              \
  \       sender);\n  }\n}\n\n+ (void)swizzleAddObserver {\n  NSAssert(!sOrigAddObserver,\n\
  \            @\"Only call swizzleAddObserver once.\");\n  SEL sel = @selector(addObserver:selector:name:object:);\n\
  \  sOrigAddObserver = (void *)[self swizzleSelector:sel\n                      \
  \               withIMP:(IMP)MYAddObserver];\n}\n\n@end\n```\n\n你调用 `swizzleSelector:withIMP:`\
  \ 并传递一个指向你新实现的函数指针。注意这是一个函数而不是方法，但正如本章前面“消息传递是如何工作的”部分提到的，方法实现只是接受对象指针和选择器的函数。然后你将原始实现保存在静态变量\
  \ `sOrigAddObserver` 中。在新实现中，你添加你想要的功能，然后直接调用原始函数。\n\n最后，你需要在程序启动附近的某个地方实际执行交换：\n\
  \n```objc\n[NSNotificationCenter swizzleAddObserver];\n```\n\n有些人建议在分类的 `+load`\
  \ 方法中进行交换。这会让过程变得变得透明得多，这也是为什么我不推荐这样做的原因。方法交换可能会导致非常出乎意料的行为。使用 `+load` 意味着仅仅链接分类的实现就会导致它被应用。我个人在将旧代码引入新项目时就遇到过这种情况。旧项目中的一个调试助手就使用了这种自动加载的技巧。它在旧项目中并没有被编译，只是恰好在源代码目录中。当我在\
  \ Xcode 中使用“添加文件夹”时，尽管我对项目没有做任何其他更改，调试代码也开始运行了。突然之间，新项目的客户机器上出现了大量的调试文件，而且很难搞清楚它们是从哪里来的。所以我的经验是，在这种情况下使用\
  \ `+load` 是危险的。\n\n\n\n\n在你执行了交换（swizzle）之后，受影响的对象与正常创建的子类完全相同。这意味着对于设计为可子类化的类来说，这种方法的风险非常低。正如第\
  \ 15 章所述，键值观察（`KVO`）是通过 ISA 交换实现的。这允许系统框架向你的类中注入通知代码，就如同你可以向系统框架中注入代码一样。\n\n## 方法交换（Method\
  \ Swizzling）与 ISA 交换（ISA Swizzling）\n\n方法交换和 ISA 交换都是非常强大的技术，如果使用不当，可能会导致许多问题。根据我的经验，ISA\
  \ 交换是一种更好的技术，并应该尽可能使用它，因为它只影响你针对的特定对象，而不是该类的所有实例。然而，有时你的目标是影响该类的每一个实例，此时方法交换是唯一的选择。以下列表定义了方法交换和\
  \ ISA 交换之间的区别：\n\n### 方法交换\n- 影响该类的每一个实例\n- 高度透明。所有对象都保留其原始类。\n- 需要对重写方法进行不寻常的实现\n\
  \n### ISA 交换\n- 仅影响目标实例\n- 对象更改了类（尽管可以通过重写 `class` 来隐藏这一点）\n- 使用标准的子类技术编写重写方法\n\n\
  ### 总结\n\n一旦理解了 Objective-C 运行时，它可以成为一个极其强大的工具。通过它，你可以在运行时修改类和实例，注入新方法甚至整个新类。如果鲁莽使用，这些技术可能会导致极其难以调试的\
  \ bug，但如果谨慎且隔离地使用，Objective-C 运行时是高级 iOS 开发的重要组成部分。\n\n### 延伸阅读\n\n### Apple 文档\n\
