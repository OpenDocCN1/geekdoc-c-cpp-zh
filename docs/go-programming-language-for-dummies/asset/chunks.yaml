    This chapter explores one of the foundational building blocks of programming:
    how to declare variables and constants in Go. This chapter also tells you how
    to manipulate strings in Go and how to convert data from one type to another.


    ![Remember](images/remember.png) In Go, there are four types of data:


    *   **Basic:** Examples include strings, numbers, and Booleans.


    *   **Aggregate:** Examples include arrays and structs.


    *   **Reference:** Examples include pointers, slices, functions, and channels.


    *   **Interface:** An interface is a collection of method signatures.


    In this chapter, I focus on the basic data types in Go. (I cover the other data
    types throughout the rest of this book.)


    ## Declaring Always-Changing Variables


    In programming, variables are containers that store values. These values may change
    over the lifetime of the program. In Go, you can declare and initialize variables
    in a variety of ways. I cover the possibilities in the following sections.


    ### Using the var keyword: Type-inferred variables


    The first way to declare a variable is to prefix the variable name with the `var`
    keyword and then assign it a value, as in the following example:


    `package main`


    `import "fmt"`


    `func main() {`


    **`var num1 = 5 // type inferred`**


    `fmt.Println(num1) // 5`


    `}`


    ![Tip](images/tip.png) In Go, anything that follows the double-slash (`//`) is
    a comment. The compiler will ignore your comments, but adding comments to your
    code is usually a good practice because it makes it more understandable.


    In the preceding example, `num1` is a variable whose type is an integer. Because
    it''s assigned the value of 5 during declaration, its type is inferred to be that
    of `int` (integer).


    ![Remember](images/remember.png) In Go, a compilation error occurs if you declare
    a variable but you don’t make use of it (for example, by printing its value).
    So, in the previous example, one way to resolve this issue is to print it out
    using the `Println()` function. If you don''t resolve the issue, your program
    won’t compile.


    A variable can be defined outside a function as well, as the following example
    shows:


    `package main`


    `import "fmt"`


    **`var num1 = 5 // type inferred`**


    `func main() {`


    `fmt.Println(num1) // 5`


    `}`


    Variables that are defined outside functions are accessible to all functions.


    ### Specifying the data type: Explicitly typed variables


    You can specify the data type of the variable explicitly when declaring them,
    as the following example demonstrates:


    `package main`


    `import "fmt"`


    `func main() {`


    `var num1 = 5 // type inferred`


    **`var num2 int // explicitly typed`**


    `fmt.Println(num1)`


    **`fmt.Println(num2)`**


    `}`


    Here, `num2` is explicitly declared to be an `int` variable. When you print out
    its value, you see 0\. Variables declared without initialization are given their
    *zero value.* The zero values for the various types are shown below:


    `var num3 float32 // floating point variable`


    `var name string // string variable`


    `var raining bool // boolean variable`


    `fmt.Println(num3) // 0`


    `fmt.Println(name) // "" (empty string)`


    `fmt.Println(raining) // false`


    You can also explicitly declare and initialize a value at the same time, like
    this:


    `var rates float32 = 4.5 // declared as float32 and`


    `// then initialized`


    ### Using the short variable declaration operator


    Another way to declare and initialize a variable is to use the *short variable
    declaration operator* (`:=`), like this:


    `firstName := "Wei-Meng"`


    Here, I''m declaring `firstName` as a `string` variable by initializing it to
    the string `"Wei-Meng"`, all without needing to use the `var` prefix.


