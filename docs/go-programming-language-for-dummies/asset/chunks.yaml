    [FIGURE 1-1:](#c01.xhtml_rc01-fig-0001) Downloading the Go installer.


    ![Tip](images/tip.png) This book code has been written and tested using Go version
    1.15. When you’re reading this book, a new version of Go may have been released.
    In order to ensure that you can follow the examples in this book, I strongly suggest
    that you install the same version of Go that I’ve used. You can find it here:


    *   **macOS:** [`https://golang.org/dl/go1.15.8.darwin-amd64.pkg`](https://golang.org/dl/go1.15.8.darwin-amd64.pkg)

    *   **Windows:** [`https://golang.org/dl/go1.15.8.windows-amd64.msi`](https://golang.org/dl/go1.15.8.windows-amd64.msi)


    ![Technical Stuff](images/technicalstuff.png) If you want to be able to choose
    the Go installer for each of the supported operating systems (Linux, macOS, and
    Windows), and even see the source code for Go, go to [`https://golang.org/dl/`](https://golang.org/dl/).


    After you’ve downloaded the Go installer, double-click the installer to start
    the straightforward installation process. I recommend that you just use the default
    installation settings — you don’t need to change any of those settings.


    In the following sections, I show you how to verify that your installation is
    performed successfully on macOS and Windows.


    ### macOS


    On macOS, the Go installer installs the Go distribution in the `/usr/local/go`
    directory. It also adds the `/usr/local/go/bin` directory to your `PATH` environment
    variable. You can verify this by entering the following command in the Terminal
    app (which you can find in the `Applications/Utilities` folder):


    ```

    $ echo $PATH

    ```


    You should see something like the following output (note the added path, highlighted
    in bold):


    `/Users/weimenglee/opt/anaconda3/bin:/Volumes/SSD/opt/anaco-nda/condabin:/Users/weimenglee/flutter/bin:/Users/weimeng-lee/go/bin:/Users/weimenglee/.nvm/versions/node/v9.2.0/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/go/bin:/usr/local/share/dotnet:~/.dotnet/tools:/Library/Application
    Support/Apple/bin:/Library/Frameworks/Mono.framework/Versions/Current/Commands`


    ![Tip](images/tip.png) Make sure to restart the Terminal app after you''ve installed
    Go in order for the changes to take effect.


    To verify that the installation is correct, type the following command in Terminal:


    ```

    $ go version

    ```


    You should see the version of Go installed on your system:


    ```

    go version go1.15.8 darwin/amd64

    ```


    ### Windows


    On Windows, the Go installer installs the Go distribution in the `C:\Go` directory.
    It also adds the `C:\Go\bin` directory to your `PATH` environment variable. You
    can verify this by entering the following command in Command Prompt (which you
    can find by typing `cmd` in the Windows search box):


    ```

    C:\Users\Wei-Meng Lee>path

    ```


    You should see something like the following output (note the added path, highlighted
    in bold):


    ```

    PATH=C:\WINDOWS\system32;C:\WINDOWS;C:\WINDOWS\System32\Wbem;C:\WINDOWS\System32\WindowsPowerShell\v1.0\;C:\WINDOWS\System32\OpenSSH\;C:\Program
    Files\dotnet\;C:\Program Files\Microsoft SQL Server\130\Tools\Binn\;C:\Go\bin;C:\Program
    Files\Git\cmd;C:\Program Files\Graphviz 2.44.1\bin;C:\Program Files\CMake\bin;C:\Program
    Files\Docker\Docker\resources\bin;C:\ProgramData\Docker\version-bin;C:\Program
    Files\MySQL\MySQL Shell 8.0\bin\;C:\Users\Wei-Meng Lee\AppData\Local\Microsoft\WindowsApps;;C:\Users\Wei-Meng
    Lee\AppData\Local\Programs\Microsoft VS Code\bin;C:\Users\Wei-Meng Lee\.dotnet\tools;C:\Users\Wei-Meng
    Lee\go\bin

    ```


    ![Tip](images/tip.png) Make sure to restart the Command Prompt window after you''ve
    installed Go in order for the changes to take effect.


    To verify that the installation is correct, type the following command in Command
    Prompt:


    ```

    C:\Users\Wei-Meng Lee>go version

    ```


    You should now see the version of Go installed on your computer:


    ```

    go version go1.15.8 windows/amd64

    ```


    ## Using an Integrated Development Environment with Go


    To develop applications using Go, you just need a text editor (such as Visual
    Studio Code, TextEdit on macOS, or even the old trusty NotePad), and you’re good
    to go (pun unintended). However, many developers prefer to use integrated development
    environments (IDEs) that can help them organize them.

