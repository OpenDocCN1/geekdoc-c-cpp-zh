  trans: "\n\n本书是为初学（或相对刚接触） Go 的读者准备的。我不假设你已经熟悉 Go 编程，但我假设你具备以下条件：\n\n*   你熟悉编程基础。\n\
    *   你熟悉数据结构概念，例如字典、数组和结构体。\n*   你有一台可以使用的计算机，用来尝试书中的示例。\n\n## 本书中使用的图标\n\n与《自学教程》（*For\
    \ Dummies*）系列中的其他书籍一样，本书使用了图标——即页边栏的小图片，来吸引你注意某些类型的材料。以下是我使用的图标：\n\n![Remember](img/remember.png)\
    \ 每当我告诉你某些有用或足够重要的内容，且你最好将这些信息存储在记忆中某个安全的地方以备后回回时，我会用 `Remember`（记住）图标进行标记。\n\n\
    ![Technical Stuff](img/technicalstuff.png) `Technical Stuff`（技术细节）图标标记了仅供极客阅读的技术细节或解释，你可以自由跳过它们。\n\
    \n![Tip](img/tip.png) `Tip`（提示）图标标记了快捷方法或更简单的方法，我希望这些能让你的生活变得更轻松。\n\n![Warning](img/warning.png)\
    \ `Warning`（警告）图标标记了包含友好但异常坚持提醒的文本，以避免进行某些操作。你已被警告了。\n\n## 本书之外\n\n除了你正在阅读的内容，该产品还附带了一个免费的随处访问的快捷表，它会告诉你如何在不安装任何额外软件的情况下在线尝试\
    \ Go，如何使用在线工具将 JSON 转换为 Go 结构体，以及如何在 Docker 中使用 Go。要获取此快捷表，请访问 [`www.dummies.com`](http://www.dummies.com)get\
    \ 搜索框中输入 `Go Programming Language For Dummies Cheat Sheet`。\n\n本书包含一些可下载内容。访问\
    \ [`www.dummies.com/go/goprogramminglanguagefd`](http://www.dummies.com/go/goprogramminglanguagefd)\
    \ 下载书中的所有代码。\n\n## 接下来该去哪里\n\n如果你是 Go 的完全新手，你可能想从第一章开始一直读到最后。如果你已经有了一些 Go 的基础知识，你可能想前往第\
    \ 5 部分 看看 Go 的实际运行。无论你有多少经验，都可以查阅索引或目录来找到你最感兴趣的话题。\n\n最后，我对所有初学者的建议是：练习，练习，再练习。输入每一章中的代码并犯错。犯的错越多，你对讨论的话题理解和记忆就越深。\n\
    \n祝你好运，并享受你获得的新知识！\n\n# 第一部分：开始学习 Go\n\n在本部分中…… \n\n*   编写你的第一个 Go 程序。\n*   发现\
    \ Go 中的基本数据类型，并了解如何声明变量和常量。\n*   探索各种逻辑和比较运算符，并使用它们做出决策。\n*   理解循环如何工作，以及你如何重复执行代码。\n\
    *   使用函数创建易于维护和理解的 Go 程序。\n\n# 第 1 章：Hello, Go!\n\n在本章中\n\n*   ![Bullet](img/check.png)\
    \ **理解为什么 Go 将是未来的趋势**\n*   ![Bullet](img/check.png) **在你的计算机上安装 Go**\n*   ![Bullet](img/check.png)\
    \ **使用集成开发环境**\n*   ![Bullet](img/check.png) **编写 Go 程序并理解其工作原理**\n*   ![Bullet](img/check.png)\
    \ **查看 Go 与其他语言的对比**\n\nGo 是一种开源编程语言——全球增长最快的编程语言之一——由 Google 于 2009 年发布。它是一种多用途编程语言，专门用于构建快速、可扩展的应用程序。\n\
    \n![Technical Stuff](img/technicalstuff.png) Go 来自一个非常令人深刻的团队：Ken Thompson（Unix\
    \ 和 C 设计者和创始人）、Rob Pike（UTF-8 和 Unix 格式的共同创建者）以及 Robert Griesemer（一位 Google 工程师）。如果你对技术感兴趣，你可能想看看这名为“Go\
    \ at Google：为软件工程服务的语言设计”的文章（[`https://talks.golang.org/2012/splash.article`](https://talks.golang.org/2012/splash.article)），它讨论了\
    \ Go 最初是如何为了解决 Google 的问题而构的。\n\n在本章中，我将解释为什么学习 Go 对你的职业很重要，Go 可以用在何处以及如何开始 Go\
    \ 编程。\n\n![Tip](img/tip.png) 因为其网址，Go 经常被称为 Golang：[`https://golang.org`](https://golang.org/)`。然而，该语言的官方名称是\
    \ Go，因此我在本书书中都是这样称呼它的。\n\n## 学习 Go 能为你带来什么\n\n今天你学习学习许多编程语言，但 Go 因为以下原因脱颖而出：\n\
    \n*   **Go 易于学习。** Go 的语法使其成为一种可读性很高的语言。它不支持面向对象编程（OOP），这意味着你不需要担心类、继承以及随之而来的复杂性。\n\
    \n    ![Technical Stuff](img/technicalstuff.png) 面向对象编程（OOP）是一种基于`objects`对象（数据）概念的编程范式。OOP\
    \ 不关注函数和逻辑，而是围绕数据或对象组织软件。OOP 中的一个核心概念是 `classes`类（类似于模板）。假设你想在应用程序中显示按钮。与其编写代码逐个显示每个按钮，不如创建一个表示通用按钮的\
    \ `class`（类）。\n\n*   **Go 的功能比其他语言少。** 你不需要担心解决问题的最佳方法——只有一种。这使得你的代码库易于维护。\n\n\
    *   **Go 在并发编程方面表现出色。** Go 对 `Goroutines` 的支持让运行多个函数变得极其简单。\n\n![Tip](img/tip.png)\
    \ Go 目前还不支持泛型（在实际使用时指定实际类型的能力），但随着语言的演进这可能会改变。\n\n如果你还没有被说服应该学习 Go，也许这条消息会激励你：在\
    \ 2019 年 Stack Overflow 开发者调查（[`https://insights.stackoverflow.com/survey/2019`](https://insights.stackoverflow.com/survey/2019)）中，Go\
    \ 开发者的薪资仅次于 Clojure 和 F# 开发者。\n\n尽管 Go 已经存在很久（自 2009 年起），但由于云计算和微服务的普及，它最近才被开发者广泛采用。今天，Go\
    \ 已被 Dailymotion、Dropbox、Google 和 Uber 等大公司广泛使用。\n\n以下是 Go 的用途示例：\n\n*   云服务：在\
    \ Google Cloud Platform (GCP) 上使用 Go 构建可扩展的应用。\n*   网络应用：得益于 Go 对 `Goroutines`\
    \ 的支持，你可以使用 Go 构建分布式服务器和应用程序接口 (API)。\n*   Web 服务：你可以使用 Go 构建可扩展且高效的 Web 服务。\n\
    *   命令行应用：由于 Go 可以在运行在多个平台上，你可以编译相同的代码库并针对不同的平台（例如运行在 macOS 和 Windows 平台）。\n\n\
    ## 在你的机器上安装 Go\n\n你可能非常急于在你的机器上开始 Go 编程，让我们让我们开始吧！\n\n安装 Go 最简单的方法是访问 [`https://golang.org/doc/install`](https://golang.org/doc/install)。该网站会自动检测你正在使用的操作系统\
    \ (OS)，并向你显示点击下载 Go 安装程序的按钮（参见图 1-1](#c01.xhtml_c01-fig-0001)）。\n\n![下载 Go 安装程序的截图。](img/9781119786191-fg0101.png)\n\
    \n"
