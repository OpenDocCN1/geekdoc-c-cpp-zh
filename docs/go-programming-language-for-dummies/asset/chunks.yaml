- fmt: "\nThis book is for people who are new (or relatively new) to Go. I don’t assume\
    \ that you’re familiar with Go programming, but I do assume the following:\n\n\
    *   You’re familiar with the basics of programming.\n*   You’re familiar with\
    \ the concept of data structures, such as dictionary, arrays, and structs.\n*\
    \   You have a computer that you can use to try out the examples in this book.\n\
    \n## Icons Used in This Book\n\nLike other books in the *For Dummies* series,\
    \ this book uses icons, little pictures in the margin to draw your attention to\
    \ certain kinds of material. Here are the icons that I use:\n\n![Remember](images/remember.png)\
    \ Whenever I tell you something useful or important enough that you’d do well\
    \ to store the information somewhere safe in your memory for later recall, I flag\
    \ it with the `Remember` icon.\n\n![Technical Stuff](images/technicalstuff.png)\
    \ The `Technical Stuff` icon marks text that contains some for-nerds-only technical\
    \ details or explanations that you’re free to skip.\n\n![Tip](images/tip.png)\
    \ The `Tip` icon marks shortcuts or easier ways to do things, which I hope will\
    \ make your life easier.\n\n![Warning](images/warning.png) The `Warning` icon\
    \ marks text that contains a friendly but unusually insistent reminder to avoid\
    \ doing something. You’ve been warned.\n\n## Beyond the Book\n\nIn addition to\
    \ what you’re reading right now, this product comes with a free access-anywhere\
    \ Cheat Sheet that tells you how to try Go online without installing any additional\
    \ software, how to use the online tools to convert JSON to Go structs, and how\
    \ to use Go in Docker. To get this Cheat Sheet, go to [`www.dummies.com`](http://www.dummies.com)\
    \ and type `Go Programming Language For Dummies Cheat Sheet` in the Search box.\n\
    \nThis book includes some downloadable content as well. Go to [`www.dummies.com/go/goprogramminglanguagefd`](http://www.dummies.com/go/goprogramminglanguagefd)\
    \ to download all the code in the book.\n\n## Where to Go from Here\n\nIf you’re\
    \ totally new to Go, you may want to start from the first chapter and follow through\
    \ to the end. If you already have some basic knowledge of Go, you may want to\
    \ head to [Part 5](# you see Go in action. Regardless of how much experience you\
    \ have, you can always turn to the index or table of contents to find the subjects\
    \ that interest you most.\n\nFinally, my advice to all beginners is: Practice,\
    \ practice, practice. Type in the code in each chapter and make mistakes. The\
    \ more mistakes you make, the better you’ll understand and remember the topics\
    \ discussed.\n\nGood luck and enjoy your newfound knowledge!\n\n# Part 1: Getting\
    \ Started with Go\n\nIN THIS PART … \n\n*   Write your first Go program.\n*  \
    \ Discover the basic data types in Go and find out how to declare variables and\
    \ constants.\n*   Explore the various logical and comparison operators and use\
    \ them to make decisions.\n*   Understand how looping works and how you can execute\
    \ code repeatedly.\n*   Use functions to create Go programs that are easy to maintain\
    \ and understand.\n\n# Chapter 1: Hello, Go!\n\nIN THIS CHAPTER\n\n*   ![Bullet](images/check.png)\
    \ **Understanding why Go is the wave of the future**\n*   ![Bullet](images/check.png)\
    \ **Installing Go on your computer**\n*   ![Bullet](images/check.png) **Working\
    \ with an integrated development environment**\n*   ![Bullet](images/check.png)\
    \ **Writing a Go program and understanding how it works**\n*   ![Bullet](images/check.png)\
    \ **Seeing how Go compares to other languages**\n\nGo is an open-source programming\
    \ language — one of the fastest-growing programming languages around — released\
    \ by Google in 2009. It’s a multipurpose programming language specifically designed\
    \ to build fast, scalable applications.\n\n![Technical Stuff](images/technicalstuff.png)\
    \ Go comes from a pretty impressive team of people: Ken Thompson (designer and\
    \ creator of Unix and C), Rob Pike (cocreator of UTF-8 and Unix format), and Robert\
    \ Griesemer (a Google engineer). If you’re technically inclined, you may want\
    \ to check out an article called “Go at Google: Language Design in the Service\
    \ of Software Engineering” (`https://talks.golang.org/2012/splash.article`](https://talks.golang.org/2012/splash.article)),\
    \ which discusses how Go was initially conceived to solve problems at Google.\n\
    \nIn this chapter, I explain why learning Go is important for your career, where\
    \ Go can be used, and how to get started with Go programming.\n\n![Tip](images/tip.png)\
    \ Go is often referred to as Golang because of its web address: [`https://golang.org`](https://golang.org/).\
    \ However, the official name of the language is Go, so that’s how I refer to it\
    \ throughout this book.\n\n## Seeing What Learning Go Can Do for You\n\nYou can\
    \ learn many programming languages today, but Go stands out from the others for\
    \ a few reasons:\n\n*   **Go is easy to learn.** Go’s syntax makes it a readable\
    \ language. It has no support for object-oriented programming (OOP), which means\
    \ you don’t have to worry about classes and inheritance and the complexities that\
    \ come with that.\n\n    ![Technical Stuff](images/technicalstuff.png) Object-oriented\
    \ programming (OOP) is a programming paradigm that is based on the concept of\
    \ `objects` (data). Instead of focusing on the functions and logics, OOP organizes\
    \ software around data, or objects. A key concept in OOP is `classes` (sort of\
    \ like templates). Suppose you want to display buttons in your application. Instead\
    \ of writing the code to display each button individually, you can create a `class`\
    \ to represent a generic button.\n\n*   **Go has fewer features than other languages.**\
    \ You don’t have to worry about the best way to solve a problem — there is only\
    \ one way to solve it. This makes your codebase easy to maintain.\n\n*   **Go\
    \ excels in concurrent programming.** Go’s support for `Goroutines` makes it extremely\
    \ easy to run multiple functions concurrently.\n\n![Tip](images/tip.png) Go has\
    \ no support for `generics` (the ability to specify the actual type until it’s\
    \ actually used), but this may change as the language evolves.\n\nIf you still\
    \ aren’t convinced that you should learn Go, perhaps this next bit of news will\
    \ motivate you: In the Stack Overflow Developer Survey 2019 (`https://insights.stackoverflow.com/survey/2019`](https://insights.stackoverflow.com/survey/2019)),\
    \ Go developers were the third highest paid in the industry, behind Clojure and\
    \ F# developers.\n\nAlthough Go has been around for quite while (since 2009),\
    \ only recently did it get wide adoption by developers, thanks to the proliferation\
    \ of cloud computing and microservices. Today, Go has been widely used by major\
    \ companies such as Dailymotion, Dropbox, Google, and Uber.\n\nHere are some examples\
    \ of where Go can be used:\n\n*   **Cloud services:** You can build scalable apps\
    \ using Go on the Google Cloud Platform (GCP).\n*   **Networking apps:** With\
    \ Go’s support for `Goroutines`, you can use Go to build distributed servers and\
    \ application programming interfaces (APIs).\n*   **Web services:** You can use\
    \ Go to build scalable and efficient web services.\n*   **Command-line apps:**\
    \ Because Go runs on multiple platforms, you can compile the same codebase and\
    \ target different platforms (such as those running on macOS and Windows).\n\n\
    ## Installing Go on Your Machine\n\nYou’re probably very eager to get started\
    \ with Go programming on your machine, so let’s get to it!\n\nThe easiest way\
    \ to install Go is to go to [`https://golang.org/doc/install`](https://golang.org/doc/install).\
    \ This website automatically detects the operating system (OS) you’re using and\
    \ shows you the button to click to download the Go installer (see [Figure 1-1](#c01.xhtml_c01-fig-0001)).\n\
    \n![Snapshot of downloading the Go installer.](images/9781119786191-fg0101.png)\n"
