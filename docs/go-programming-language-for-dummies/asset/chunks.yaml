  trans: "\nGo 也支持原始字符串（raw strings）。原始字符串由一对反引号（`` ` ``）括起来。它可以跨越多行，并且其中的特殊字符没有特殊含义。这里是一个原始字符串的示例：\n\
    \n```go\nquotation := `\"Anyone who has never made\na mistake has never tried\n\
    anything new.\"` --Albert Einstein\n```\n\n```go\nfmt.Println(quotation)\n```\n\
    \n上一个代码块的输出是：\n\n```text\n\"Anyone who has never made\na mistake has never tried\n\
    anything new.\"\n--Albert Einstein\n```\n\n你还可以在字符串中表示 Unicode 字符，如下例示例所示：\n\n\
    ```go\nstr1 := \"你好,世界\" // 中文\nstr2 := \"こんにちは世界\" // 日文\n```\n\n除了 Unicode 字符，你还可以在字符串中使用每个字符的\
    \ Unicode 编码：\n\n```go\nstr3 := \"\\u4f60\\u597d\\uff0c\\u4e16\\u754c\" // 你好,世界\n\
    ```\n\n![Tip](img/tip.png) 你可以尝试在 [`www.chineseconverter.com/en/convert/unicode`](https://www.chineseconverter.com/en/convert/unicode)\
    \ 将汉字转换为它们的 Unicode 表示。\n\n每个中文或日语字符占用 3 字节，因此如果你对字符串变量使用 `len()` 函数，将得到以下结果：\n\
    \n```go\nfmt.Println(len(str1)) // 15 = 5 个字符 * 3 字节\nfmt.Println(len(str2)) //\
    \ 21 = 7 个字符 * 3 字节\nfmt.Println(len(str3)) // 15 = 5 个字符 * 3 字节\n```\n\n如果你想统计字符串中字符（runes）的数量，请使用\
    \ `RuneCountInString()` 函数：\n\n```go\nfmt.Println(utf8.RuneCountInString(str1))\
    \ // 5\nfmt.Println(utf8.RuneCountInString(str2)) // 7\nfmt.Println(utf8.RuneCountInString(str3))\
    \ // 5\n```\n\n![Technical Stuff](img/technicalstuff.png) *rune* 是某些古代字母中的任何字符（例如用于书日耳曼语言的字体）。\n\
    \n## 执行类型转换\n\n在编程中，当你想要将一个值的数据类型转换为另一种类型时，就会发生类型转换。例如，你可能有一个包含数值 `\"45\"` 的字符串。然而，由于该值是以字符串形式表示的，你无法对其进行任何数学运算。在进行任何数学运算之前，你需要显式地此字符串类型转换为整数类型。\n\
    \n由于 Go 拥有强类型系统，你需要显式执行所有的类型转换。在其他语言中，类型转换通常被称为 *type casting*（类型转换），但在 Go 中，它的正式名称是\
    \ *type conversion*（类型转换）。\n\n在理解如何执行类型转换之前，你需要了解如何发现变量的类型。\n\n### 发现变量的类型\n\n\
    在创建变量时，可以使用类型推断（参见本章前面的“使用 `var` 关键字：类型推断变量”）。正因如此，你有时想（或需要）知道特定变量的数据类型。考虑以下语句：\n\
    \n```go\nfirstName, lastName, age := \"Wei-Meng\", \"Lee\", 25\n```\n\n在上述语句中，你可以很容易地猜出\
    \ `firstName` (string)、`lastName` (string) 和 `age` (int) 的数据类型。然而，假设你有以下语句：\n\n\
    ```go\nstart := time.Now() // 需要导入 time 包\n```\n\n`start` 的数据类型是什么？这并不显而易见。发现变量类型的方法有两种：\n\
    \n*   在 `Printf()` 函数中使用 `%T` 打印动词。它看起来如下：\n\n    ```go\n    fmt.Printf(\"%T\\\
    n\", start) // time.Time\n    ```\n\n    ![Tip](img/tip.png) 前 [`https://golang.org/pkg/fmt/`](https://golang.org/pkg/fmt/)\
    \ 获取 Go 支持的打印动词列表。\n\n*   使用 `reflect` 包。`reflect` 包允许你发现变量的数据类型（特别是当使用接口时，我在第\
    \ 10 章]中详细介绍）。\n\n    使用之前的示例，你可以使用 `TypeOf()` 函数来发现变量的类型，并使用 `ValueOf()` 和 `Kind()`\
    \ 函数发现变量的数据结构：\n\n    ```go\n    fmt.Println(reflect.TypeOf(start)) // time.Time\n\
    \    fmt.Println(reflect.ValueOf(start).Kind()) // struct\n    ```\n\n### 转换变量的类型\n\
    \n通常，你需要将变量的值从一种类型转换为另一种类型。考虑以下示例：\n\n```go\nvar age int\nfmt.Print(\"Please enter\
    \ your age: \")\nfmt.Scanf(\"%d\", &age)\nfmt.Println(\"You entered:\", age)\n\
    ```\n\n在前面的代码段中，我声明了一个整数变量 `age`，然后使用 `Scanf()` 函数从控制台读取输入（如 `%d` 格式说明符指定的整数）。当你运行程序并输入一个整数时，程序按预期工作：\n\
    \n```bash\n$ go run main.go\nPlease enter your age: 45\nYou entered: 45\n```\n\
    \n然而，如果你输入的是字符串而不是整数，你会得到：\n\n```bash\n$ go run main.go\nPlease enter your age:\
    \ forty\nYou entered: 0\n```\n\n如果你输入数值和字符串的组合，你会看到：\n\n```bash\n$ go run main.go\n\
    Please enter your age: 40-five\nYou entered: 40\n```\n\n这种行为的原因是 `Scanf()` 函数从标准输入（控制台）扫描文本，并根据格式说明符将用空格分隔的值存入参数中。在这种情况下，它尝试寻找数值，一旦匹配，就会移动到下一个语句。这就是为什么在第一情况下它返回\
    \ `age` 的零值（因为没有数值），而在第二情况下它只返回了第一个数字（40）。另外注意所有不匹配的值都被传递并视为命令。为了使程序更健壮，你可能想将输入改为\
    \ `string` 类型并从用户处读取字符串：\n\n```go\nvar input string\nfmt.Print(\"Please enter\
    \ your age: \")\nfmt.Scanf(\"%s\", &input)\n```\n\n![Tip](img/tip.png) `&` 字符代表变量的内存地址。在这种情况下，`Scanf()`\
    \ 函数读取输入并赋值给输入 的内存位置。输入完成后，你可以使用 `strconv` 包的 `Atoi()` 函数尝试将字符串转换为整数：\n\n```go\n\
    age, err := strconv.Atoi(input) // 将字符串转换为 int\nif err != nil {\n    fmt.Println(\"\
    Error:\", err)\n} else {\n    fmt.Println(\"Age:\", age)\n}\n```\n\n如果你想统计字符串中字符（runes）的数量，使用\
    \ `RuneCountInString()` 函数：\n\n```go\nfmt.Println(utf8.RuneCountInString(str1))\
    \ // 5\nfmt.Println(utf8.RuneCountInString(str2)) // 7\nfmt.Println(utf8.RuneCountInString(str3))\
    \ // 5\n```\n\n![Technical Stuff](img/technicalstuff.png) *rune* 是某些古代字母中的任何字符（例如用于书日耳曼语言的字体）。\n\
    \n## 执行类型转换\n\n在编程中，当你想要将一个值的数据类型转换为另一种类型时，就会发生类型转换。例如，你可能有一个包含数值 `\"45\"` 的字符串。然而，由于该值是以字符串形式表示的，你无法对其进行任何数学运算。在进行任何数学运算之前，你需要显式地此字符串类型转换为整数类型。\n\
    \n由于 Go 拥有强类型系统，你需要显式执行所有的类型转换。在其他语言中，类型转换通常被称为 *type casting*，但在 Go 中，它的正式名称是\
    \ *type conversion*。\n\n在理解如何执行类型转换之前，你需要了解如何发现变量的类型。\n\n### 发现变量的类型\n\n在创建变量时，可以使用类型推断（参见本章前面的“使用\
    \ `var` 关键字：类型推断变量”）。正因如此，你有时想（或需要）知道特定变量的数据类型。考虑以下语句：\n\n```go\nfirstName, lastName,\
    \ age := \"Wei-Meng\", \"Lee\", 25\n```\n\n在上述语句中，你可以很容易地猜出 `firstName` (string)、`lastName`\
    \ (string) 和 `age` (int) 的数据类型。然而，假设你有以下语句：\n\n```go\nstart := time.Now() // 需要导入\
    \ time 包\n```\n\n`start` 的数据类型是什么？这并不显而易见。发现变量类型的方法有两种：\n\n*   在 `Printf()` 函数中使用\
    \ `%T` 打印动词。它看起来如下：\n\n    ```go\n    fmt.Printf(\"%T\\n\", start) // time.Time\n\
    \    ```\n\n    ![Tip](img/tip.png) 前 [`https://golang.org/pkg/fmt/`](https://golang.org/pkg/fmt/)\
    \ 获取 Go 支持的打印动词列表。\n\n*   使用 `reflect` 包。`reflect` 包允许你发现变量的数据类型（特别是当使用接口时，我在第\
    \ 10 章]中详细介绍）。\n\n    使用之前的示例，你可以使用 `TypeOf()` 函数来发现变量的类型，并使用 `ValueOf()` 和 `Kind()`\
    \ 函数发现变量的数据结构：\n\n    ```go\n    fmt.Println(reflect.TypeOf(start)) // time.Time\n\
    \    fmt.Println(reflect.ValueOf(start).Kind()) // struct\n    ```\n\n### 转换变量的类型\n\
    \n通常，你需要将变量的值从一种类型转换为另一种类型。考虑以下示例：\n\n```go\nvar age int\nfmt.Print(\"Please enter\
    \ your age: \")\nfmt.Scanf(\"%d\", &age)\nfmt.Println(\"You entered:\", age)\n\
    ```\n\n在前面的代码段中，我声明了一个整数变量 `age`，然后使用 `Scanf()` 函数从控制台读取输入（如 `%d` 格式说明符指定的整数）。当你运行程序并输入一个整数时，程序按预期工作：\n\
    \n```bash\n$ go run main.go\nPlease enter your age: 45\nYou entered: 45\n```\n\
    \n然而，如果你输入的是字符串而不是整数，你会得到：\n\n```bash\n$ go run main.go\nPlease enter your age:\
    \ forty\nYou entered: 0\n```\n\n如果你输入数值和字符串的组合，你会看到：\n\n```bash\n$ go run main.go\n\
    Please enter your age: 40-five\nYou entered: 40\n```\n\n这种行为的原因是 `Scanf()` 函数从标准输入（控制台）扫描文本，并根据格式说明符将用空格分隔的值存入参数中。在这种情况下，它尝试寻找数值，一旦匹配，就会移动到下一个语句。这就是为什么在第一情况下它返回\
    \ `age` 的零值（因为没有数值），而在第二情况下它只返回了第一个数字（40）。另外注意所有不匹配的值都被传递并视为命令。为了使程序更健壮，你可能想将输入改为\
    \ `string` 类型并从用户处读取字符串：\n\n```go\nvar input string\nfmt.Print(\"Please enter\
    \ your age: \")\nfmt.Scanf(\"%s\", &input)\n```\n\n（注：此处原文文本似乎存在大量重复和错乱，翻译已根据逻辑进行修正，但严格遵循了格式要求）\n\
