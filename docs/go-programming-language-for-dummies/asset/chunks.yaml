    要验证安装是否正确，请在 Terminal 中输入以下命令：


    ```

    $ go version

    ```


    你应该看到系统上安装的 Go 版本：


    ```

    go version go1.15.8 darwin/amd64

    ```


    ### Windows


    在 Windows 上，Go 安装程序会将 Go 分发版安装在 `C:\Go` 目录。它还将将 `C:\Go\bin` 目录添加到你的 `PATH` 环境变量中。你可以在命令提示符（通过在
    Windows 搜索框中输入 `cmd` 可以找到）中输入以下命令来验证：


    ```

    C:\Users\Wei-Meng Lee>path

    ```


