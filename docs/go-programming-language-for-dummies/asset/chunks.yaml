    # Introduction


    Today, if you’re a programmer, you have lots of options when it comes to choosing
    a programming language. Popular programming languages include `C++`, `C#`, `Go`,
    `Java`, `JavaScript`, `Python`, `R`, `Swift`, and many more. Each language is
    designed to solve a different set of problems and, depending on what you’re going
    to create (mobile apps, web apps, desktop apps), you may end up learning one or
    more of these.


    So, why Go? Turns out that three engineers at Google were frustrated with the
    various toolsets they were working on and set out to design a new language that
    would address the criticisms of other languages while at the same time keeping
    useful features.


    Go was designed to


    * Use static typing and have the run-time efficiency of `C`

    * Have the readability and usability of languages like `Python` and `JavaScript`

    * Exhibit great performance in networking and multiprocessing


    The problems with existing languages forced the team at Google to design a new
    language from the ground up, creating a lean and mean language designed for massive
    multreading and concurrency.


    This book covers the basics of Go (also known as Golang), one of the fastest-growing
    programming languages specifically designed to build faster and more scalable
    applications.


    ## About This Book


    In this code-intensive book, you’re encouraged to try out the various examples,
    which are designed to be compact, easy to follow, and easy to understand. But
    you don’t have to read the book from the first page to the last. Each chapter
    is designed to be independent, so you can dive in wherever you want and find the
    topics that you want to start.


    If you’re short on time, you can safely skip sidebars (text in gray boxes) or
    anything marked with the Technical Stuff icon (more on that in “[Icons Used in
    This Book](#c00.xhtml_i01-sec-004),” later in this Introduction). They’re interesting,
    but they aren’t essential to understanding the subject at hand.


    Within this book, you may note that some web addresses break across two lines
    of text. If you’re reading this book in print and want to visit one of these web
    pages, simply key in the web address exactly as it’s noted in the text, pretending
    as though the line break doesn’t exist. If you’re reading this as an e-book, you’ve
    got it easy — just click the web address to be taken directly to the web page.


