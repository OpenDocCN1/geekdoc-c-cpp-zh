  raw: 'When you’re done typing, press ⌘  +S (Ctrl+S) to save the file. Name the file
    `main.go`. If this is the first time you''re writing a Go program using Visual
    Studio Code, it may prompt you to download additional plugins for Go. I recommend
    that you install the plugins.


    ![Tip](images/tip.png) For this book, save your files to a folder named with the
    chapter number you’re reading. For example, save `main.go` in a folder named `Chapter
    1` in your home directory. On a Mac, that looks like this:


    `~/Chapter 1`


    `|__main.go`


    In Windows, it looks like this:


    `C:\users\yourname\Chapter 1`


    `|__main.go`


    After the file is saved, notice that your Go statements will now be color-coded
    — light blue for keywords such as `package`, `import`, and `func`; orange for
    strings like `Hello, world!` and `fmt`; and yellow for functions like `main()`
    and `Println()`.


    ### Compiling and running the program


    After you''ve saved a program, you need to compile it so that you can run it.


    You can run the program directly in Visual Studio Code. To do that, launch the
    Terminal by choosing Terminal ⇒ New Terminal. The Terminal now opens in Visual
    Studio Code (see [Figure 1-6](#c01.xhtml_c01-fig-0006)).


    Next, change the directory to `Chapter 1`. In macOS, use the following command:


    `$` **`cd ~/”Chapter`****`1”`**


    In Windows, use the following command:


    `$` **`cd “C:\users\username\Chapter`****`1”`**


    To compile the `main.go` file, type the following command:


    `$` **`go build main.go`**


    ![Snapshot of directly accessing the Terminal in Visual Studio Code.](images/9781119786191-fg0106.png)


    [FIGURE 1-6:](#c01.xhtml_rc01-fig-0006) You can directly access the Terminal in
    Visual Studio Code.


    The preceding command compiles the `main.go` program into an executable file.
    On macOS, after running the program, you see a file named `main`. To run it, use
    the following command:


    `$` **`./main`**


    `Hello, world!`


    If you see the `Hello, world!` string printed, congratulations! You''re now officially
    a Go programmer!


    If you’re using Windows, the `build` command generates an executable named `main.exe`.
    To run it, use the following command:


    `C:\users\username\Chapter 1>`**`main`**


    `Hello, world!`


    Because you often want to run the program immediately after compiling it, you
    can use the `run` option to compile and run the program straight away:


    `$` **`go run main.go`**


    ### Understanding how a Go program works


    Now that your Go program works, it''s time to understand how. I’ll walk you through
    it line by line. The first line defines the package name for this program:


    `package main`


    Go programs are organized into *packages.* A package is a collection of source
    files grouped in a single directory. In this example, `main` is the name of the
    package stored in the `Chapter 1` directory. If you have additional source files
    (`.go` files), they''ll all belong to this `main` package (more on this in later
    chapters).


    ![Tip](images/tip.png) You aren’t constrained to using `main` as the package name.
    You can use any package name you want. But this `main` package name has a special
    meaning: Packages with the name `main` will contain a function named `main()`,
    which serves as an entry point for your program to get started. Also, your package
    name and the name of the file containing it don''t need to be the same. I could’ve
    named the file `dog.go` instead of `main.go`, and the program would still run
    (but now the executable would be named `dog` instead of `main`).


    The next line imports a package named `fmt`:


    `import "fmt"`


    This package contains various functions to allow you to format and print to the
    console. It also contains functions to get a user''s inputs.


    ![Tip](images/tip.png) If you’re new to programming, a function is a block of
    code that’s used to perform a single, related task. Turn to [Chapter 5](#c05.xhtml)
    for more about functions.


    The next block of code is the main entry point of your program:


    `func main() {`


    `}`


    Because the package name is `main`, this `main()` function will now serve as the
    starting point for your program to execute.


    Finally, the following line calls the `Println()` function from the `fmt` package
    to print the string `Hello, world!` to the console:


    `fmt.Println("Hello, world!")`


    ### Making sense of the Go file structure


    You should now have a good idea of how the Go program works. Let''s dive a little
    deeper into how Go files are grouped together. As I mention in the previous section,
    all files in the same directory belong to the same package. So, let’s now add
    another file to the `Chapter 1` directory and name it `show_time.go`. The `Chapter
    1` directory should now have one more file:


    `Chapter 1`


    `|__main.go`


    **`|__show_time.go`**


    Populate the `show_time.go` file with the following statements:


    `package main`


    `import (`


    `"fmt"`


    `"time"`


    `)`


    `func displayTime() {`


    `fmt.Println(time.Now())`


    `}`


    Notice that the file is part of the `main` package (the first line reflects that).
    Also, you can import multiple packages by enclosing them within a pair of parentheses.
    In this case, we imported the `time` package in addition to the `fmt` package.
    Finally, we also added a function named `displayTime()`, which displays the current
    date and time using the `Now()` function from the `time` package.


    Because the `displayTime()` function belongs to the `main` package, it can also
    be called from `main.go`:


    `package main`


    `import "fmt"`


    `func main() {`


    `fmt.Println("Hello, world!")`


    **`displayTime()`**


    `}`


    ![Tip](images/tip.png) You can call functions defined in the same package without
    needing to import the package.


    Because there are now two files in the package (`main`), you don''t build the
    program using a specific filename. Instead, you just need to use the `build` command
    within the `Chapter 1` directory:


    `$ go build`


    This time around, you''ll see that there is a new file named `Chapter_1` (in Windows,
    you’ll see a file named `Chapter_1.exe`) created in the `Chapter 1` directory.


    To run it in macOS, type the following in Terminal:


    `$` **`./Chapter_1`**


    To run it in Windows, type the following command:


    `C:\users\username\Chapter 1>`**`Chapter_1`**


    You should now be able to see the output:


    `Hello, world!`


    `2020-10-01 12:01:13.412568 +0800 +08 m=+0.000365532`


    ### Compiling for multiple operating systems


    When you install Go, the Go installer automatically sets up a number of Go environment
    variables in order for your Go program to work correctly. Specifically, it auto-detects
    values of the host architecture and OS and sets the `GOHOSTARCH` and `GOHOSTOS`
    environment variables, respectively. The value of these two variables will be
    used as the target platform for your program to compile to.


    To examine the values of these Go environment variables, use the `env` command:


    `$` **`go env`**


    `GOARCH="amd64"`


    `GOBIN=""`


    `GOCACHE="/Users/weimenglee/Library/Caches/go-build"`


    `GOEXE=""`


    `GOFLAGS=""`


    `GOHOSTARCH="amd64"`


    `GOHOSTOS="darwin"`


    `GOOS="darwin"`


    `…`


    `…`


    `PKG_CONFIG="pkg-config"`


    To compile your program for another OS, you need to set another two environment
    variables: `GOOS` and `GOARCH`. These two variables configure the target OS based
    on the values shown in [Table 1-1](#c01.xhtml_c01-tbl-0001).


    | **Operating Systems** | **GOOS** | **GOARCH** |


    | --- | --- | --- |


    | macOS | `darwin` | `amd64` |


    | Linux | `linux` | `amd64` |


    | Windows | `windows` | `amd64` |


    [TABLE 1-1](#c01.xhtml_rc01-tbl-0001) Environment Variables for the Various Operating
    Systems


    To compile for macOS, use the following command and options:


    `$` **`GOOS=darwin GOARCH=amd64`** `go build` **`-o Chapter_1-mac`**


    ![Tip](images/tip.png) In the near future, when Go has been ported natively to
    Apple Silicon, the value of `GOARCH` would be `arm64`.


    To compile for the Windows OS, use the following command and options:


    `$ cd ~/"Chapter 1"`


    `$` **`GOOS=windows GOARCH=amd64`** `go build` **`-o Chapter_1-windows.exe`**'
