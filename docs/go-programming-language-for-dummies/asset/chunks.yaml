- fmt: "\nGo also supports raw strings. A raw string is enclosed by a pair of back\
    \ ticks (`` ` ``). It can span multiple lines, and special characters have no\
    \ meaning in it. Here's an example of a raw string:\n\n```go\nquotation := `\"\
    Anyone who has never made\na mistake has never tried\nanything new.\"` --Albert\
    \ Einstein\n```\n\n```go\nfmt.Println(quotation)\n```\n\nThe output of the preceding\
    \ block of code is:\n\n```text\n\"Anyone who has never made\na mistake has never\
    \ tried\nanything new.\"\n--Albert Einstein\n```\n\nYou can also represent Unicode\
    \ characters in your strings, as the following examples illustrate:\n\n```go\n\
    str1 := \"你好,世界\" // Chinese\nstr2 := \"こんにちは世界\" // Japanese\n```\n\nInstead\
    \ of Unicode characters, you can also use the Unicode encodings of each character\
    \ in your strings:\n\n```go\nstr3 := \"\\u4f60\\u597d\\uff0c\\u4e16\\u754c\" //\
    \ 你好,世界\n```\n\n![Tip](images/tip.png) You can try your hand at converting Chinese\
    \ characters to their Unicode representations at [`www.chineseconverter.com/en/convert/unicode`](https://www.chineseconverter.com/en/convert/unicode).\n\
    \nEach Chinese or Japanese character takes up 3 bytes, so if you use the `len()`\
    \ function on the string variables, you get the following results:\n\n```go\n\
    fmt.Println(len(str1)) // 15 = 5 chars * 3 bytes\nfmt.Println(len(str2)) // 21\
    \ = 7 chars * 3 bytes\nfmt.Println(len(str3)) // 15 = 5 chars * 3 bytes\n```\n\
    \nIf you want to count the number of characters (runes) in a string, use the `RuneCountInString()`\
    \ function:\n\n```go\nfmt.Println(utf8.RuneCountInString(str1)) // 5\nfmt.Println(utf8.RuneCountInString(str2))\
    \ // 7\nfmt.Println(utf8.RuneCountInString(str3)) // 5\n```\n\n![Technical Stuff](images/technicalstuff.png)\
    \ A *rune* is any of the characters of certain ancient alphabets (for example,\
    \ a script used for writing the Germanic languages).\n\n## Performing Type Conversions\n\
    \nIn programming, type conversion happens when you want to convert the data type\
    \ of one value into another. For example, you may have a string that contains\
    \ a numeric value `\"45\"`. However, because this value is represented as a string,\
    \ you can't perform any mathematical operations on it. You need to explicitly\
    \ convert this string type into an integer type before you can perform any mathematical\
    \ operations on it.\n\nDue to the strong type system in Go, you need to perform\
    \ all type conversions explicitly yourself. In other languages, type conversion\
    \ is usually referred to as *type casting,* but in Go, the official name for this\
    \ is *type conversion.*\n\nBefore you can understand how to perform type conversion,\
    \ you need to understand how to discover the type of a variable.\n\n### Discovering\
    \ the type of a variable\n\nYou can use type inferencing when creating your variables\
    \ (see “[Using the `var` keyword: Type-inferred variables](#c02.xhtml_c02-sec-0003),”\
    \ earlier in this chapter). And because of this, you sometimes want (or need)\
    \ to know the data type of a particular variable. Consider the following statement:\n\
    \n```go\nfirstName, lastName, age := \"Wei-Meng\", \"Lee\", 25\n```\n\nIn the\
    \ preceding statement, you can easily guess the data types of `firstName` (string),\
    \ `lastName` (string), and `age` (int). However, suppose you have the following\
    \ statement:\n\n```go\nstart := time.Now() // need to import the time package\n\
    ```\n\nWhat is the data type of `start`? It's not so obvious. There are two methods\
    \ for finding out the data type of a variable:\n\n*   Use the `%T` printing verb\
    \ in the `Printf()` function. It looks like this:\n\n    ```go\n    fmt.Printf(\"\
    %T\\n\", start) // time.Time\n    ```\n\n    ![Tip](images/tip.png) Go to [`https://golang.org/pkg/fmt/`](https://golang.org/pkg/fmt/)\
    \ for a list of printing verbs supported by Go.\n\n*   Use the `reflect` package.\
    \ The `reflect` package allows you to find out the data type of a variable (especially\
    \ when using interfaces, which I cover in more detail in [Chapter 10](#c10.xhtml)).\n\
    \n    Using the previous example, you can use the `TypeOf()` function to find\
    \ out the data type of a variable, and the `ValueOf()` and `Kind()` functions\
    \ to find out the data structure of a variable:\n\n    ```go\n    fmt.Println(reflect.TypeOf(start))\
    \ // time.Time\n    fmt.Println(reflect.ValueOf(start).Kind()) // struct\n   \
    \ ```\n\n### Converting a variable's type\n\nVery often, you need to convert the\
    \ value of a variable from one type to another. Consider the following example:\n\
    \n```go\nvar age int\nfmt.Print(\"Please enter your age: \")\nfmt.Scanf(\"%d\"\
    , &age)\nfmt.Println(\"You entered:\", age)\n```\n\nIn the preceding code snippet,\
    \ I declared an integer variable `age`, and then used the `Scanf()` function to\
    \ read the input (as an integer as indicated by the `%d` format specifier) from\
    \ the console. When you run the program and enter an integer, the program works\
    \ as expected:\n\n```bash\n$ go run main.go\nPlease enter your age: 45\nYou entered:\
    \ 45\n```\n\nHowever, if you enter a string instead of an integer, this is what\
    \ you get:\n\n```bash\n$ go run main.go\nPlease enter your age: forty five\nYou\
    \ entered: 0\n$ orty five\nbash: orty: command not found\n```\n\nIf you enter\
    \ a combination of numeric and string values, you see the following:\n\n```bash\n\
    $ go run main.go\nPlease enter your age: 40-five\nYou entered: 40\n$ five\nbash:\
    \ five: command not found\n```\n\nThe reason for this behavior is because the\
    \ `Scanf()` function scans text read from standard input (the console), storing\
    \ successive space-separated values into successive arguments as determined by\
    \ the format specifier. So, in this case, it tries to look for numeric values,\
    \ and as soon as there is a match, it moves on to the next statement. This is\
    \ why in the first case, it returns the zero value of `age` (because there is\
    \ no numeric value), and in the second case it returns only the first digits (`40`).\
    \ Also notice that all unmatched values are brought forward and treated as commands.\
    \ To make the program more robust, you may want to change the input variable to\
    \ `string` type and read input as a string from the user:\n\n```go\nvar input\
    \ string\nfmt.Print(\"Please enter your age: \")\nfmt.Scanf(\"%s\", &input)\n\
    ```\n\n![Tip](images/tip.png) The `&` character represents the memory address\
    \ of the variable. In this case, it means `Scanf()` function reads the user's\
    \ input and assigns the value to the memory location of `input`. After the input\
    \ is read, you can use the `strconv` package's `Atoi()` function to try to convert\
    \ the string into an integer:\n\n```go\nage, err := strconv.Atoi(input) // convert\
