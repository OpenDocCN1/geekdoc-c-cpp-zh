    \ the `file` command to examine the various executables created for each platform:\n\
    \n```bash\n$ file Chapter_1-mac\n```\n`Chapter_1-mac: Mach-O 64-bit executable\
    \ x86_64`\n\n```bash\n$ file Chapter_1-windows.exe\n```\n`Chapter_1-windows.exe:\
    \ PE32+ executable (console) x86-64 (stripped to external PDB), for MS Windows`\n\
    \n```bash\n$ file Chapter_1-linux\n```\n`Chapter_1-linux: ELF 64-bit LSB executable,\
    \ x86-64, version 1 (SYSV), statically linked, Go BuildID=bSETwZgNDR5vlulRHnzw/KNpENRt9Hipd8Nu7HGDg/v38ZPzDs35yMw33hUxoz/Y_cNfU8fID2cCtz36hCq,\
    \ not stripped`\n\n## Comparing Go with Other Languages\n\nWhen learning a new\
    \ programming language, it’s always helpful to try to compare it with another\
    \ language that you may already be familiar with. Doing so allows you to try to\
    \ map your current knowledge to the new language that you’re trying to learn.\n\
    \nIn this section, I compare Go with two of the most commonly used programming\
