    FIGURE 1-1: 下载 Go 安装程序。


    ![Tip](img/tip.png) 本书的代码是 Go 1.15 版本编写并测试的。当你阅读此本书时，Go 可能已经发布了新版本。为了确保你能够跟随书中的示例操作，我强烈建议安装与我使用的相同的
    Go 版本。你可以在这里找到：


    *   **macOS:** [`https://golang.org/dl/go1.15.8.darwin-amd64.pkg`](https://golang.org/dl/go1.15.8.darwin-amd64.pkg)

    *   **Windows:** [`https://golang.org/dl/go1.15.8.windows-amd64.msi`](https://golang.org/dl/go1.15.8.windows-amd64.msi)


    ![Technical Stuff](img/technicalstuff.png) 如果你想为每个受支持的操作系统（Linux、macOS 和 Windows）选择
    Go 安装程序，甚至查看 Go 的源代码，请访问 [`https://golang.org/dl/`](https://golang.org/dl/)。


    下载 Go 安装程序后，双击安装程序开始直观的安装过程。我建议你直接使用默认安装设置——你不需要更改任何设置。


    在接下来的章节中，我将向你如何在 macOS 和 Windows 上验证安装是否成功。


    ### macOS


    在 macOS 上，Go 安装程序会将 Go 分发版安装在 `/usr/local/go` 目录。它还将将 `/usr/local/go/bin` 目录添加到你的
    `PATH` 环境变量中。你可以在 Terminal 应用程序（可以在 `Applications/Utilities` 文件夹中找到）中输入以下命令来验证：


    ```

    $ echo $PATH

    ```


    你应该看到类似下面的输出（注意加粗显示的添加路径）：


    `/Users/weimenglee/opt/anaconda3/bin:/Volumes/SSD/opt/anaco-nda/condabin:/Users/weimenglee/flutter/bin:/Users/weimeng-lee/go/bin:/Users/weimenglee/.nvm/versions/node/v9.2.0/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/go/bin:/usr/local/share/dotnet:~/.dotnet/tools:/Library/Application
