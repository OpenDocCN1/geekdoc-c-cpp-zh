    Wei-Meng Lee is a technologist and founder of Developer Learning Solutions ([`http://calendar.learn2develop.net`](http://calendar.learn2develop.net/)),\
    \ a company specializing in hands-on training on the latest technologies.\n\n\
    Wei-Meng has many years of training experience. His training courses place special\
    \ emphasis on the learning-by-doing approach. Wei-Meng’s hands-on approach to\
    \ learning programming makes understanding the subject much easier than reading\
    \ books, tutorials, and documentation. His name regularly appears in online and\
    \ print publications, such as DevX.com, MobiForge.com, and *CODE Magazine.* He\
    \ is also the author of *Python Machine Learning* (Wiley), *Learning WatchKit\
    \ Programming* (Addison-Wesley), *Beginning Swift Programming* (Wrox), and *SwiftUI\
    \ For Dummies* (Wiley).\n\nWhen he’s not coding, Wei-Meng speaks at meetups and\
    \ conferences, such as NDC Oslo, NDC London, NDC Copenhagen, and RigaDevDays.\n\
    \n## Dedication\n\nI dedicate this book with love to my dearest wife, Sze Wa,\
