    ## Comparing Go with Other Languages


    When learning a new programming language, it’s always helpful to try to compare
    it with another language that you may already be familiar with. Doing so allows
    you to try to map your current knowledge to the new language that you’re trying
    to learn.


    In this section, I compare Go with two of the most commonly used programming languages
    used in the industry, Java and Python. Occasionally, I compare Go with C, because
    Go is syntactically similar to C. Go is often touted as the language with the
    speed of C and the productivity of Python.


    ![Remember](images/remember.png) If you aren’t familiar with any of the languages
    listed in this section, don’t worry! In this book, I cover all the features mentioned
    here.


    ### Syntax


    In terms of syntax, Go is closer to C and Java, which use curly braces to enclose
    blocks of code. This syntax differs from Python, which uses indentation as a form
    of denoting blocks of code.


    Like Python, Go functions are first-class citizens, whereas in Java everything
    revolves around classes, and you need a class just to enclose a function.


    Unlike Python and Java, Go doesn’t have OOP support, and it doesn’t support inheritance.
    But it does have interfaces and structs that work just like classes.


    Go is statically typed, like Java. It differs from Python, which is dynamically
    typed.


    ### Compilation


    Whereas Python and Java are compiled to byte code, which is then interpreted and
    run on a virtual machine, Go compiles directly to machine code, which makes Go
    take the lead in terms of performance.


    Like Python and Java, Go is also garbage collected. In programming, garbage collection
    (GC) is a form of automatic memory management. The garbage collector tries to
    reclaim memory occupied by objects that are no longer in use by the program.


    Python is extremely memory intensive. Java is not much better because everything
    is heap allocated. But Go affords more control of memory usage.


    ### Concurrency


    Go has parallelism and concurrency built in, which means writing multi-threaded
    applications is very easy. Both Java and Python support concurrency through threading,
    but they aren’t as efficient as Go. In fact, concurrency is one of Go’s main selling
    points.


    ### Library support


    All three languages have huge library support — both standard and third-party
    libraries. A language’s survival depends in large part on its support for third-party
    libraries. That’s why Python has been so hot for the past couple of years — its
    support for third-party libraries for doing data analytics brings machine learning
    and deep learning readily to the masses. Although Go doesn’t have the scale of
    third-party library support that Python does because it’s young, the number of
    libraries for Go is growing.


