  ```\n\n在 Windows 上，它看起来像这样：\n\n```\nC:\\users\\yourname\\Chapter 1\n|__main.go\n\
  ```\n\n文件保存后，你会发现 Go 语句会有颜色区分——`package`、`import` 和 `func` 等关键字显示为浅蓝色；`Hello, world!`\
  \ 和 `fmt` 等字符串显示为橙色；`main()` 和 `Println()` 等函数显示为黄色。\n\n### 编译并运行程序\n\n保存程序后，你需要编译它才能运行它。\n\
  \n你可以直接在 Visual Studio Code 中运行程序。要做到这一点，选择 Terminal  New Terminal 来启动终端。终端现在会在\
  \ Visual Studio Code 中打开（参见图 1-6）。\n\n接下来，切换目录到 `Chapter 1`。在 macOS 中，使用以下命令：\n\n\
  ```\n$ cd ~/\"Chapter 1\"\n```\n\n在 Windows 中，使用以下命令：\n\n```\n$ cd \"C:\\users\\\
  username\\Chapter 1\"\n```\n\n要编译 `main.go` 文件，输入以下命令：\n\n```\n$ go build main.go\n\
  ```\n\n![在 Visual Studio Code 中直接访问终端的截图。](img/9781119786191-fg0106.png)\n\n图 1-6：\
  \ 你可以直接在 Visual Studio Code 中访问终端。\n\n前面的命令将 `main.go` 程序编译为可执行文件。在 macOS 上，运行程序后，你会看到一个名为\
  \ `main` 的文件。要运行它，使用以下命令：\n\n```\n$ ./main\n```\n\n```\nHello, world!\n\n如果你看到打印出\
  \ `Hello, world!` 字符串，恭喜你！你现在正式成为一名 Go 程序员了！\n\n如果你使用的是 Windows，`build` 命令会生成一个名为\
  \ `main.exe` 的可执行文件。要运行它，使用以下命令：\n\n```\nC:\\users\\username\\Chapter 1>main\n```\n\
  \nHello, world!\n\n因为你经常想编译后立即运行程序，可以使用 `run` 选项直接编译并运行程序：\n\n```\n$ go run main.go\n\
  ```\n\n### 理解 Go 程序的工作原理\n\n现在你的 Go 程序已经可以运行了，是时候理解它是如何运行的了。我将为你逐行讲解。第一行定义了该程序的包名：\n\
  \n```\npackage main\n```\n\nGo 程序组织成包（package）。一个包是分组在单个目录中的源代码集合。在这个示例中，`main`\
  \ 是存储在 `Chapter 1` 目录中的包名。如果你有额外的源文件（`.go` 文件），它们都将属于这个 `main` 包（稍后章节将对此详细介绍）。\n\
  \n![提示](img/tip.png) 你并不局限于使用 `main` 作为包名。你可以使用任何想要的包名。但这个 `main` 包名有一个特殊含义：名为 `main`\
  \ 的包将包含一个名为 `main()` 的函数，该函数作为程序启动的入口。此外，你的包名和包含该包的文件名不需要相同。我本可以将文件命名为 `dog.go`\
  \ 而不是 `main.go`，程序仍然可以运行（但现在可执行文件将命名为 `dog` 而不是 `main`）。\n\n下一行导入了一个名为 `fmt` 的包：\n\
  \n```\nimport \"fmt\"\n```\n\n该包包含了各种函数，允许你格式化输出并打印到控制台。它还包含了获取用户输入的函数。\n\n![提示](img/tip.png)\
  \ 如果你是编程初学者，函数（function）是一个用于执行单一相关任务的代码块。关于函数的更多信息，请参阅第 5 章]。\n\n下一个代码块是你的程序的主入口：\n\
  \n```\nfunc main() {\n}\n```\n\n由于包名是 `main`，这个 `main()` 函数现在将作为你程序执行的起点。\n\n最后，下一行调用了\
  \ `fmt` 包中的 `Println()` 函数，将字符串 `Hello, world!` 打印到控制台：\n\n```\nfmt.Println(\"Hello,\
  \ world!\")\n```\n\n### 理解 Go 文件结构\n\n现在你应该对 Go 程序是如何运作的有了良好的认识。让我们更深入地了解 Go 文件是如何组合在一起的。正如我在上一节中提到的，同一目录下的所有文件都属于同一个包。现在，让我们在\
  \ `Chapter 1` 目录中添加另一个文件，并将其命名为 `show_time.go`。`Chapter 1` 目录现在应该多出一个文件：\n\n```\n\
  Chapter 1\n|__main.go\n|__show_time.go\n```\n\n向 `show_time.go` 文件填充以下内容：\n\n```go\n\
  package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tfmt.Println(time.Now())\n\
  \tfmt.Println(\"Hello, world!\")\n}\n```\n\n\n\n\n\n![Tip](img/tip.png) `-o` 选项（`output`\
  \ 的缩）允许你指定可执行文件的名称。\n\n前面的命令编译了 `Chapter 1` 文件夹中的包并在 Windows 上运行，并将可执行文件保存为 `Chapter_1-windows.exe`。\n\
  \n要为 Linux 编译，请使用以下命令和选项：\n\n```bash\n$ GOOS=linux GOARCH=amd64 go build -o Chapter_1-linux\n\
  ```\n\n![Tip](img/tip.png) 如果你在树莓派上使用 Go，那么你应该为 `GOARCH` 指定 `arm64`。\n\n如果你正在运行\
  \ macOS 或 Linux，可以使用 `file` 命令检查为每个平台创建的不同可执行文件：\n\n```bash\n$ file Chapter_1-mac\n\
  ```\n`Chapter_1-mac: Mach-O 64-bit executable x86_64`\n\n```bash\n$ file Chapter_1-windows.exe\n\
  ```\n`Chapter_1-windows.exe: PE32+ executable (console) x86-64 (stripped to external\
  \ PDB), for MS Windows`\n\n```bash\n$ file Chapter_1-linux\n```\n`Chapter_1-linux:\
  \ ELF 64-bit LSB executable, x86_64, version 1 (SYSV), statically linked, Go BuildID=bSETwZgNDR5vlulRHnzw/KNpENRt9Hipd8Nu7HGDg/v38ZPzDs35yMw33hUxoz/Y_cNfU8fID2cCtz36hCq,\
  \ not stripped`\n\n## Go 与其他语言的对比\n\n在学习新编程语言时，尝试与你可能熟悉的另一种语言进行比较总是很有帮助的。这样做可以让你尝试将现有知识映射到正在学习的新语言上。\n\
  \n在本节中，我将 Go 与行业中最最常用的两种编程语言 Java 和 Python 进行了比较。有时我会将 Go 与 C 进行比较，因为 Go 在语法上与 C\
  \ 相似。Go 通常被誉为具有 C 的速度和 Python 的生产力的语言。\n\n![Remember](img/remember.png) 如果你不熟悉本节中列出的任何语言，不要担心！在本书中，我涵盖了这里提到的所有特性。\n\
  \n### 语法\n\n在语法方面，Go 更接近 C 和 Java，它们使用大括号来包围代码块。这种语法与 Python 不同，Python 使用缩进作为表示代码块的形式。\n\
  \n与 Python 类似，Go 函数是一等公民，而在 Java 中，一切都围绕类展开，你只需要一个类来包围一个函数。\n\n与 Python 和 Java 不同，Go\
  \ 不支持面向对象编程（OOP），也不支持继承。但它拥有接口（interfaces）和结构体（structs），它们的作用就像类一样。\n\nGo 是静态类型的，类似于\
  \ Java。它与动态类型的 Python 不同。\n\n### 编译\n\nPython 和 Java 被编译为字节码，然后在虚拟机上进行解释和运行，而 Go\
  \ 直接编译为机器码，这使得 Go 在性能方面处于领先。\n\n与 Python 和 Java 一样，Go 也也有垃圾回收机制。在编程中，垃圾回收（`GC`）是自动内存管理的一种。垃圾回收器尝试回收程序不再使用的对象所占用的内存。\n\
  \nPython 极其消耗内存。Java 也不好在哪里，因为一切都是在堆上分配的。但 Go 提供了对内存使用的更多控制。\n\n### 并发\n\nGo 内置了并行和并发，这意味着编写多线程应用程序非常简单。Java\
  \ 和 Python 都通过线程支持并发，但它们没有 Go 那么高效。事实上，并发是 Go 的主要卖点之一。\n\n### 库支持\n\n这三种语言都拥有巨大的库支持——包括标准库和第三方库。一种语言的生存很大程度上取决于其对第三方库的支持。这就是为什么\
  \ Python 在过去几年里如此火热——它对用于数据分析的第三方库的支持使得机器学习和深度学习能够触及大众。尽管 Go 因为还很年轻，第三方库的支持规模没有\
  \ Python 那么大，但 Go 的库数量正在不断增长。\n\n# 第 2 章\n\n## 使用不同的数据类型\n\n本章内容\n\n- ![Bullet](img/check.png)\
  \ **声明变量**\n- ![Bullet](img/check.png) **声明常量**\n- ![Bullet](img/check.png) **移除未使用的变量**\n\
  - ![Bullet](img/check.png) **操作字符串**\n- ![Bullet](img/check.png) **将一个值的数据类型转换为另一种类型**\n\
  \n本章探索了编程的基础基石之一：如何在 Go 中声明变量和常量。本章还告诉了你如何在 Go 中操作字符串，以及如何将数据从一种类型转换为另一种类型。\n\n\
  ![Remember](img/remember.png) 在 Go 中，有四种数据类型：\n\n* **基础 (Basic):** 包括字符串、数字和布尔值。\n\
  * **聚合 (Aggregate):** 包括数组和结构体。\n* **引用 (Reference):** 包括指针、切片、函数和通道。\n* **接口 (Interface):**\
  \ 接口是方法签名的集合。\n\n在本章中，我关注 Go 的基础数据类型。（我在本书的其他部分涵盖了其他数据类型。）\n\n### 声明不断变化的变量\n\n\
  在编程中，变量是存储值的容器。这些值在程序的生命周期内可能会发生。在 Go 中，你可以通过多种方式声明和初始化变量。我将在接下来的章节介绍这些可能性。\n\n\
  ### 使用 var 关键字：类型推断\n\n声明变量的第一种方法是在名称前加上 `var`，然后给它赋值，如下例所示：\n\n```go\npackage main\n\
  \nimport \"fmt\"\n\nfunc main() {\n    var num1 = 5 // 类型推断\n    fmt.Println(num1)\
  \ // 5\n}\n```\n\n![Tip](img/tip.png) 在 Go 中，`//` 之后的任何内容都是注释。编译器会忽略注释，但在代码中添加注释是良好的习惯。\n\
  \n在前面的示例中，`num1` 是一个类型推断的变量。然而，如果你声明了一个变量但未使用它（例如通过打印它），就会发生编译错误。\n\n在函数外部定义的变量对所有函数可见。变量也可以定义在函数外部：\n\
  \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    var num1 = 5 // 类型推断\n\
  \    fmt.Println(num1) // 5\n```\n\n\n\n### 指定数据类型：显式类型变量\n\n在声明变量时可以显式指定其数据类型，如下所示：\n\
  \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    var num1 = 5 // 类型推断\n\
  \    var num2 int // 显式类型\n    fmt.Println(num1)\n    fmt.Println(num2) // 0\n}\n\
  ```\n\n在这里，`num2` 被显式声明为 `int` 变量。当你打印它的值时，你会看到 0。未初始化的变量会被赋予*零值*。各种类型的零值所示：\n\n\
  ```go\nvar num3 float32 // 浮点数变量\nvar name string // 字符串变量\nvar raining bool //\
  \ 布尔变量\n\nfmt.Println(num3) // 0\nfmt.Println(name) // \"\" (空字符串)\nfmt.Println(raining)\
  \ // false\n```\n\n你也可以同时显式声明并初始化一个值，如下：\n\n```go\nvar rates float32 = 4.5 // 声明为\
  \ float32 并初始化\n```\n\n### 使用短变量运算符\n\n另一种声明和初始化变量的方法是使用*短变量运算符*（`:=`），如下：\n\n```go\n\
  firstName := \"Wei-Meng\"\n```\n\n在这里，我通过将其初始化为字符串 `\"Wei-Meng\"` 来将 `firstName`\
  \ 声明为 `string` 变量，而不需要使用 `var` 前缀。\n\n你还可以在一条语句中声明并初始化多个变量（不同类型），如下：\n\n\n\n\n\n\
  ```\nfirstName, lastName, age := \"Wei-Meng\", \"Lee\", 25\n```\n\n这种方法也适用于 `var`\
  \ 关键字：\n\n```go\nvar firstName, lastName string = \"Wei-Meng\", \"Lee\"\n```\n\n\
  请注意，如果你使用 `var` 关键字声明并初始化多个变量，则所有变量必须是相同类型。以下操作是不允许的：\n\n```go\nvar firstName, lastName\
  \ string, age int = \"Wei-Meng\", \"Lee\", 25\n```\n\n上述语句可以通过移除数据类型来修复，如下：\n\n\
  ```go\nvar firstName, lastName, age = \"Wei-Meng\", \"Lee\", 25\n```\n\n或者，你也可以这样声明它们：\n\
  \n```go\nvar (\n    firstName string = \"Wei-Meng\"\n    lastName string = \"Lee\"\
  \n    age int = 25\n)\n```\n\n当你使用 `:=` 运算符声明并初始化变量时，你不能将其用于在函数体外部声明的变量，如下所示：\n\n\
  ```go\nimport (\n    \"fmt\"\n)\n\nnum1 := 5 // error; non-declaration statement\n\
  // outside function body\n\nfunc main() {\n    fmt.Println(\"Hello, world!\")\n\
  }\n```\n\n![Remember](img/remember.png) `:=` 运算符只能在函数内部用于声明和初始化变量。\n\n## 声明不可变常量\n\
  \n与变量一样，常量也是容器。与变量不同，常量的值在初始化后永远不会改变。\n\n你像在 Go 中定义变量一样定义常量，只是你使用 `const` 关键字代替\
  \ `var` 关键字，语句，如下：\n\n```go\npackage main\nimport \"fmt\"\n\nconst publisher = \"\
  Wiley\"\n\nfunc main() {\n    fmt.Println(publisher)\n}\n```\n\n![Tip](img/tip.png)\
  \ `const` 可以出现在任何 `var` 语句出现的地方。\n\n## 删除未使用的变量\n\n如果你以前写过程序，那么你对这种情况再熟悉不过：你声明了一些变量但在程序中没有使用它们。考虑以下情况：\n\
  \n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc main() {\n    var num1\
  \ = 5\n    fmt.Println(\"Hello, world!\")\n}\n```\n\n注意 `num1` 被声明并初始化了一个值。然而，我没有在程序的任何地方使用它。如果你这样做，当你尝试运行时，Go\
  \ 编译器会标记一个错误（`num1 declared and not used`）。根据 Go FAQ：\n\n> 未使用的变量的存在可能表明存在错误，而未使用的导入只会减慢编译速度。在你的代码树中累积足够未使用的导入，运行可能会变得非常慢。出于这些原因，Go\
  \ 这者都不允许。\n\n此外，如果你导入了一个包但没有使用它，编译器同样会引发错误。有趣的是，如果一个变量声明在函数外部且在程序的任何地方都没有使用，如下所示，编译器将不会抱怨：\n\
  \n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nvar num1 = 5\n\nfunc main()\
  \ {\n    fmt.Println(\"Hello, world!\")\n}\n```\n\n![Remember](img/remember.png)\
  \ 对于在函数内部声明的变量，你需要使用它们，否则将收到错误信息。\n\n![Tip](img/tip.png) 如果你坚持在程序中使用未使用的变量，Go 提供了一种快速解决此问题的方法。只需将未使用的变量赋值给空白标识符（`_`），如下：\n\
  \n```go\nvar num1 = 5\n_ = num1 // 编译器现在很开心了！\n```\n\n## 处理字符串\n\n在 Go 中，字符串是一个只读的字节切片。将字符串视为字节的集合。（我会在第\
  \ 6 章中更详细解释切片）。\n\n之前的示例展示了 Go 中字符串的一个例子：\n\n```go\nfirstName string = \"Wei-Meng\"\
  \n```\n\n字符串可以包含特殊字符（例如 `\\n` 或 `\\t`），如下例所示：\n\n```go\naddress := \"The White House\\\
  n1600 Pennsylvania Avenue NW\\nWashington, DC 20500\"\n```\n\n当使用 `Println()` 函数打印\
  \ `address` 变量时，输出如下：\n\n```\nThe White House\n1600 Pennsylvania Avenue NW\nWashington,\
  \ DC 20500\n```\n\n\n\n\nGo 也支持原始字符串（raw strings）。原始字符串由一对反引号（`` ` ``）括起来。它可以跨越多行，并且其中的特殊字符没有特殊含义。这里是一个原始字符串的示例：\n\
  \n```go\nquotation := `\"Anyone who has never made\na mistake has never tried\n\
  anything new.\"` --Albert Einstein\n```\n\n```go\nfmt.Println(quotation)\n```\n\n\
  上一个代码块的输出是：\n\n```text\n\"Anyone who has never made\na mistake has never tried\n\
  anything new.\"\n--Albert Einstein\n```\n\n你还可以在字符串中表示 Unicode 字符，如下例示例所示：\n\n```go\n\
  str1 := \"你好,世界\" // 中文\nstr2 := \"こんにちは世界\" // 日文\n```\n\n除了 Unicode 字符，你还可以在字符串中使用每个字符的\
  \ Unicode 编码：\n\n```go\nstr3 := \"\\u4f60\\u597d\\uff0c\\u4e16\\u754c\" // 你好,世界\n\
  ```\n\n![Tip](img/tip.png) 你可以尝试在 [`www.chineseconverter.com/en/convert/unicode`](https://www.chineseconverter.com/en/convert/unicode)\
  \ 将汉字转换为它们的 Unicode 表示。\n\n每个中文或日语字符占用 3 字节，因此如果你对字符串变量使用 `len()` 函数，将得到以下结果：\n\n\
  ```go\nfmt.Println(len(str1)) // 15 = 5 个字符 * 3 字节\nfmt.Println(len(str2)) // 21\
  \ = 7 个字符 * 3 字节\nfmt.Println(len(str3)) // 15 = 5 个字符 * 3 字节\n```\n\n如果你想统计字符串中字符（runes）的数量，请使用\
  \ `RuneCountInString()` 函数：\n\n```go\nfmt.Println(utf8.RuneCountInString(str1))\
  \ // 5\nfmt.Println(utf8.RuneCountInString(str2)) // 7\nfmt.Println(utf8.RuneCountInString(str3))\
  \ // 5\n```\n\n![Technical Stuff](img/technicalstuff.png) *rune* 是某些古代字母中的任何字符（例如用于书日耳曼语言的字体）。\n\
  \n## 执行类型转换\n\n在编程中，当你想要将一个值的数据类型转换为另一种类型时，就会发生类型转换。例如，你可能有一个包含数值 `\"45\"` 的字符串。然而，由于该值是以字符串形式表示的，你无法对其进行任何数学运算。在进行任何数学运算之前，你需要显式地此字符串类型转换为整数类型。\n\
  \n由于 Go 拥有强类型系统，你需要显式执行所有的类型转换。在其他语言中，类型转换通常被称为 *type casting*（类型转换），但在 Go 中，它的正式名称是\
  \ *type conversion*（类型转换）。\n\n在理解如何执行类型转换之前，你需要了解如何发现变量的类型。\n\n### 发现变量的类型\n\n在创建变量时，可以使用类型推断（参见本章前面的“使用\
  \ `var` 关键字：类型推断变量”）。正因如此，你有时想（或需要）知道特定变量的数据类型。考虑以下语句：\n\n```go\nfirstName, lastName,\
  \ age := \"Wei-Meng\", \"Lee\", 25\n```\n\n在上述语句中，你可以很容易地猜出 `firstName` (string)、`lastName`\
  \ (string) 和 `age` (int) 的数据类型。然而，假设你有以下语句：\n\n```go\nstart := time.Now() // 需要导入\
  \ time 包\n```\n\n`start` 的数据类型是什么？这并不显而易见。发现变量类型的方法有两种：\n\n*   在 `Printf()` 函数中使用\
  \ `%T` 打印动词。它看起来如下：\n\n    ```go\n    fmt.Printf(\"%T\\n\", start) // time.Time\n\
  \    ```\n\n    ![Tip](img/tip.png) 前 [`https://golang.org/pkg/fmt/`](https://golang.org/pkg/fmt/)\
  \ 获取 Go 支持的打印动词列表。\n\n*   使用 `reflect` 包。`reflect` 包允许你发现变量的数据类型（特别是当使用接口时，我在第 10\
  \ 章]中详细介绍）。\n\n    使用之前的示例，你可以使用 `TypeOf()` 函数来发现变量的类型，并使用 `ValueOf()` 和 `Kind()`\
  \ 函数发现变量的数据结构：\n\n    ```go\n    fmt.Println(reflect.TypeOf(start)) // time.Time\n\
  \    fmt.Println(reflect.ValueOf(start).Kind()) // struct\n    ```\n\n### 转换变量的类型\n\
  \n通常，你需要将变量的值从一种类型转换为另一种类型。考虑以下示例：\n\n```go\nvar age int\nfmt.Print(\"Please enter\
  \ your age: \")\nfmt.Scanf(\"%d\", &age)\nfmt.Println(\"You entered:\", age)\n```\n\
  \n在前面的代码段中，我声明了一个整数变量 `age`，然后使用 `Scanf()` 函数从控制台读取输入（如 `%d` 格式说明符指定的整数）。当你运行程序并输入一个整数时，程序按预期工作：\n\
  \n```bash\n$ go run main.go\nPlease enter your age: 45\nYou entered: 45\n```\n\n\
  然而，如果你输入的是字符串而不是整数，你会得到：\n\n```bash\n$ go run main.go\nPlease enter your age: forty\n\
  You entered: 0\n```\n\n如果你输入数值和字符串的组合，你会看到：\n\n```bash\n$ go run main.go\nPlease\
  \ enter your age: 40-five\nYou entered: 40\n```\n\n这种行为的原因是 `Scanf()` 函数从标准输入（控制台）扫描文本，并根据格式说明符将用空格分隔的值存入参数中。在这种情况下，它尝试寻找数值，一旦匹配，就会移动到下一个语句。这就是为什么在第一情况下它返回\
  \ `age` 的零值（因为没有数值），而在第二情况下它只返回了第一个数字（40）。另外注意所有不匹配的值都被传递并视为命令。为了使程序更健壮，你可能想将输入改为\
  \ `string` 类型并从用户处读取字符串：\n\n```go\nvar input string\nfmt.Print(\"Please enter your\
  \ age: \")\nfmt.Scanf(\"%s\", &input)\n```\n\n![Tip](img/tip.png) `&` 字符代表变量的内存地址。在这种情况下，`Scanf()`\
  \ 函数读取输入并赋值给输入 的内存位置。输入完成后，你可以使用 `strconv` 包的 `Atoi()` 函数尝试将字符串转换为整数：\n\n```go\n\
  age, err := strconv.Atoi(input) // 将字符串转换为 int\nif err != nil {\n    fmt.Println(\"\
  Error:\", err)\n} else {\n    fmt.Println(\"Age:\", age)\n}\n```\n\n如果你想统计字符串中字符（runes）的数量，使用\
  \ `RuneCountInString()` 函数：\n\n```go\nfmt.Println(utf8.RuneCountInString(str1))\
  \ // 5\nfmt.Println(utf8.RuneCountInString(str2)) // 7\nfmt.Println(utf8.RuneCountInString(str3))\
  \ // 5\n```\n\n![Technical Stuff](img/technicalstuff.png) *rune* 是某些古代字母中的任何字符（例如用于书日耳曼语言的字体）。\n\
