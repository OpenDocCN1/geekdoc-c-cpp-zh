  \ Go\n\n要使用 Go 开发应用程序，你只需要一个文本编辑器（例如 Visual Studio Code、macOS 上的 TextEdit，甚至是老旧的记事本），就可以开始工作了（这里是个双关语）。但是，许多开发者倾向于使用集成开发环境（IDE），它们可以帮助他们组织代码。\n\
  \n\n\n\n\n完成输入后，按下 ⌘  +S (Ctrl+S) 保存文件。将文件命名为 `main.go`。如果你是第一次使用 Visual Studio\
  \ Code 编写 Go 程序，它可能会提示你下载额外的 Go 插件。我建议你安装这些插件。\n\n![提示](img/tip.png) 对于本书，请将文件保存到以你正在阅读的章节命名的文件夹中。例如，将\
