    # # Function Declarations


    A function is a computation that manipulates variables, and optionally changes
    the state of the program. It takes as input variables and returns some single
    variable as output.


    To declare a function we write the type of the variable it returns, the name of
    the function, and then in parenthesis of the variables it takes input, separated
    by commas. The contents of the function are put inside curly brackets { }, and
    all lists of the statements the function executes, terminated by semicolons; A
    `return` statement is used to exit the function and output a value.


    For example a function that takes two `int` variables called `x` and `y` and adds
    them could look like this


    ```

    int add_together(int x, int y) {

    int result = x + y;

    return result;

    }

    ```


    We call functions by writing their name and putting the arguments to the function
    in parenthesis, separated by commas. For call the above function and store the
    result in a variable `added` we would write the following.


    ```

    int added = add_together(10, 18);

    ```


    # # Structure Declarations


    Structures are used to declare new types. Structures are several variables bundled
    together into a single package.


    We can use structure to represent more complex data types. For example to represent
    a point in 2D space we could create a structure called `point` that packs'
