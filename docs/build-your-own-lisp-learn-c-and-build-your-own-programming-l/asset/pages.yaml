  md: '# Variable Hashtable


    At the moment when we lookup variable names in our language we just do a linear
    search over all of the variables in the environment. This gets more and more inefficient
    the more variables we have.


    A more efficient way to do this is to implement a Hash Table. This technique converts
    the variable name to an integer and uses this to index into an array of known
    size to find the value associated with this symbol. This is a really important
    data structure in programming and will crop up everywhere because of its fantastic
    performance under heavy loads.


    Anyone who is interested in learning more about data structures and algorithms
    would be smart to take a shot at implementing this data structure or one of its
    variations.


    # Pool Allocation


    Our Lisp is very simple, it is not Ruby. Its performance is relative to scripting
    languages such as Python and Ruby. Most of the performance overhead in our program
    comes from the fact that doing almost anything requires us to construct and destroy
    `malloc` very often. This is a slow function as it requires the operating system
    to do management for us. When doing calculations there is lots of overhead we
    need to lower the number of calls to `malloc` allocating a large pool of memory,
    and deallocation of `malloc` types.


    One method to do this is to call `malloc` once at the beginning of the program,
    allocating a large pool of memory, and then replace all our `malloc` calls to
    some function that slices and dices up this memory for use in the program. This
    means that we are emulating some of the behaviour of the operating system, but
    in a faster way. This idea is called pool allocation and is a common technique
    used in game development, and other performance sensitive applications.


    This can be tricky to implement correctly, but conceptually does not need to be
    complex. If you want a quick method for getting gains in performance, looking
    into this interest you.


    # Garbage Collection


    Almost all other implementations of Lisps assign variables differently to ours.
    They do not store a copy of a value in the environment, actually a pointer, or
    reference, to it directly. Because pointers are used, rather than copies, just
    like in C, there is much less overhead when using large data structures.


    If we store pointers to values, rather than copies, we need to ensure that the
    data points to is not deleted we other value try to use of it. We want to deleted
    it before some other value there are no longer any'
