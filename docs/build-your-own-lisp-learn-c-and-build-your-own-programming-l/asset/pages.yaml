  md: '# Basics • Chapter 3


    # Overview


    In this chapter I''ve prepared a quick overview of the basic features of C. There
    are very few features in C, and the syntax is relatively simple. But this doesn''t
    mean it is easy. All the depth hides below the surface. Because of this we''re
    going to cover the features and syntax fairly quickly now, and see them in greater
    depth as we continue.


    The goal of this chapter is to get everyone on the same page. People totally new
    to C should therefore take some time over it, while with some existing experience
    may find it easier to skim and return to as required.


    ![](img/f0182debe7478735c07b82d15dd58fde_14_0.png)


    # Programs


    A program in C consists of only function definitions and structure definitions.


    A source file is simply a list of functions and types. These functions can call
    each other or themselves, and can use any data types that have been declared or
    built into the language.


    It is possible to call functions in other libraries, or to use their data types.
    This is how layers of complexity are accumulated in C programming.


    As we saw in the previous chapter, the execution of a C program always starts
    in the function called `main`. From here it calls more and more functions, to
    perform all the actions it requires.


    # Variables


    Functions in C consists of manipulating variables. These are items of data which
    we give a name to.


    Every variable in C has an explicit type. These types are declared by ourselves
    or built into the language. We can declare a new variable by writing the name
    of its type, followed by its name, and optionally setting it to some value using
    `=`. This declaration is a statement, and we terminate all statements in C with
    a semicolon;


    To create a new `int` called `count` we could write the following...'
