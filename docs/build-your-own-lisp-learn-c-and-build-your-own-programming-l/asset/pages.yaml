  md: '# Functions • Chapter 12


    # What is a Function?


    Functions are the essence of all programming. In the early days of computer science
    they represented a naive dream. The idea was that we could reduce computation
    into these smaller and smaller bits of re-usable code. Given time, and a proper
    structure for libraries, we would eventually have written code required for all
    computational needs. No longer would people have to write their own functions,
    and programming would consist of an easy job of stitching components.


    This dream hasn''t come true yet, but it persists, no matter how flawed. Each
    new programming technique or paradigm that comes along shakes this up a little.
    They promise better re-use of code. Better abstractions, and an easier life for
    all.


    In reality each paradigm delivers simply different abstractions. There has been
    a trade-off. For each higher level of thinking about programming, some piece is
    thrown away. And no matter how you decide to keep and what to leave, occasionally
    someone will need that piece which has lost. But through all of this, one way
    or the other, functions have always persisted, and have continually proven to
    be effective.


    ![](img/f0182debe7478735c07b82d15dd58fde_110_0.png)


    We''ve used functions in C, we know what they look like, but we don''t know exactly
    what they are. Here are a few ways to think about them.


    One way to think about functions is description of some computation you want to
    be performed later. When you define a function it is saying "when I use this name
    I want sort of thing to happen". This is a very practical idea of a function.
    It is intuitive, and metaphorical to language. This is the way you command a human
    or animal. Another thing I think like this is that it captures the delayed nature
    of functions. Functions are defined once, but can be called on repeatedly.


    Another way to think about functions is a black box that takes some input and
    produces some output. This idea is slightly different from the former. It is more
    algebraic, and doesn''t talk about computation or commands. This idea is a mathematical
    concept, and not tied to some particular machine, or language. In some situations
    this is exceptionally useful. It allows us to think about functions without worrying
    about their internals, or how they are computed. We can combine and compose functions
    without worry of something subtle going wrong. This is the core idea behind abstraction,
    and what allows layers of complexity to work together with each other rather than
    conflict. This idea''s strength can also be its downfall. Because it does not
    mention anything about computation it does not deal with a number of real world
    concerns "How long will'
