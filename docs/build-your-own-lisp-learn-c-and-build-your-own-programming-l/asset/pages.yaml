    \ & xs) (xs))\n\n; Curried and Unried calling\n(def (curry) unpack)\n(def (uncurry)\
    \ pack)\n```\n\nWe say to do several things in order. One way we can do this is\
    \ to put each to do as an argument to some function. We know that arguments are\
