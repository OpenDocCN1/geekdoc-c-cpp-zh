  md: '# Strings • Chapter 14


    # Libraries


    Our Lisp is finally functional. We should be able to write almost any functions
    we want. We can build some complex constructs using it, and even do some cool
    things that can''t be done in lots of other heavyweight and popular languages;


    Every time we update our program and run it it is annoying having to type in all
    of our functions. In this chapter we''ll add the functionality to load code from
    a file and run it. This will allow us to start building up a standard library.
    Along the way we''ll also add support for code comments, strings, and printing.


    ![](img/f0182debe7478735c07b82d15dd58fde_153_0.png)


    # String Type


    For the user to load a file we will have to let them supply a string consisting
    of the file name. Our language supports symbols, but still doesn''t support strings,
    which can include spaces and other characters. We need to add this possible lval
    type to specify the file names we need.


    We start, as in other chapters, by adding an entry to our enum and adding an entry
    to our lval to represent the type''s data.


    ```

    enum { LVAL_ERR, LVAL_NUM, LVAL_SYM, LVAL_STR,

    LVAL_FUN, LVAL_SEXPR, LVAL_QEXPR };

    ```


    ```

    /* Basic */

    long num;

    char* err;

    char* sym;

    char* str;

    ```


    Next we can add a function for constructing string lval, very similar to how we
    construct symbols.


    ```

    lval* lval_str(char* s)

    lval* v = malloc(sizeof(lval));

    v->type = LVAL_STR;

    v->str = malloc(strlen(s) + 1);

    strpy(v->str, s);

    return v;

    ```'
