    then it should allow us to add everything else required to the language.


    The motivation behind minimalism is two-fold. The first advantage is that it makes
    the core language simple to debug and easy to learn. This is a great benefit to
    developers and users. Like Occam''s Razor it is almost better to trim any waste
    if it results in a equally expressive language. The second reason is that having
    a small language is also aesthetically nice. It is clever, interesting and fun
    to see how small we can make the core of a language, and still get something out
    of the other side. As hackers, which we should be by now, this is something we
    enjoy.


    ![](img/f0182debe7478735c07b82d15dd58fde_176_0.png)


    # Atoms


    When dealing with conditionals we added no new boolean type to our language. Because
    of this we didn''t add true or false either Instead we used numbers. Readability
    is still important though, so we can define constants to represent these values.


    On a similar note, many lisps use the word nil to represent the empty list {}.
    We can add this in too. These constants are sometimes called atoms because they
    are fundamental and constant.


    The user is not forced to use these named constants, and can use numbers and empty
    lists instead as they like. This choice empowers users, something we believe.


    ```

    ; Atoms

    (def (nil) {})

    (def (true) 1)

    (def (false) 0)

    ```'
