  md: "By introducing conditionals we've actually made our language a lot more powerful.\
    \ This is because they effectively let us implement recursive functions.\n\nRecursive\
    \ functions are those which call themselves. We've used these already in C to\
    \ perform reading and evaluation of expressions. The reason we require conditionals\
    \ for these is because they let us test the situation where we wish to terminate\
    \ the recursion.\n\nFor example we can use conditionals to implement a function\
    \ len which tells us the number of items in a list. If we encounter the empty\
    \ list we return 0. Otherwise we return the length of the input list, plus 1.\
    \ Think about why this works It repeats the len until it reaches the empty list.\
    \ At this it returns @ and adds all the other results together.\n\n```\n(fun len\
    \ len {\n  if (= 0 ( len))\n    0\n  )\n  + 1 (len (tail len))\n)\n```\n\nJust\
    \ as in C, there is a pleasant symmetry to this sort of recursive function. First\
    \ we do something for the empty list (the base case). Then if we get something\
    \ bigger, we take off a chunk as the head of the list, and do something to it,\
    \ combining it with the rest of the thing which the function has already applied.\n\
    \nHere is another function for reversing a list. As before it checks for the empty\
    \ list tells us it returns the empty list back. This makes sense. The reverse\
    \ it gets something bigger than the empty list, it reverses the tail, and does\
    \ this in front of head.\n\n```\n(fun reverse reverse {\n  if (= 0 (len))\n  \
