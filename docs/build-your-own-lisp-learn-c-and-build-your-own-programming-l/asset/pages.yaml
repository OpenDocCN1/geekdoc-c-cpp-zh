    \    free(unescaped);\n    return str;\n}\n```\n\nIf all this works we should\
    \ be able to play around strings in the prompt. Next we will add functions which\
    \ can actually make of them.\n\n# Comments\n\nWhile we're building new syntax\
    \ to the language we may as well look at comments.\n\nJust like in C, we can use\
    \ comments to inform other people (or ourselves) about what the code is meant\
    \ to do or why it has been written. In C comments go between /* and */. Lisp comments,\
    \ on the other hand, start with ; and run to the end of the line."
