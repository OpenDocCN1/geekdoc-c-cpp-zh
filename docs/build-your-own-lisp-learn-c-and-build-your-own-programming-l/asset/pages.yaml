    # Parser Combinators


    mpc is a Parser Combinator library I have written. This means it is a library
    that allows you to build programs that understand and process particular languages.
    These are known as parsers. There are many different ways of building parsers,
    but the cool thing about using a Parser Combinator library is that lets you build
    parsers just by specifying the grammar... sort of.


    Many Parser Combinator libraries work by letting you write normal code that looks
    like a grammar, not by actually specifying a grammar directly. In many situations
    it is fine, but it can get clunky and complicated. Luckily for us mpc allows us
    to write normal code that looks like a grammar, or we can use special notation
    to write a grammar directly!


    # Coding Grammars


    So what does code look like a grammar...look like? Let us take a look at mpc by
    trying to write a grammar that recognizes the language of Shiba Inu. More colloquially
    we as Doge. This language we are going to define as follows:


    +   - An Adjective is either "wow", "many", "so" or "such".

