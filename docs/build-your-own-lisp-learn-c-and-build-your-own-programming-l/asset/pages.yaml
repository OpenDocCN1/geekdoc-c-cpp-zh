    # # Error Reporting


    So far our error reporting doesn''t work so well. We can report when an error
    occurs and give a vague notion of what the problem was, but we don''t give the
    user much information about what exactly has gone wrong. For example if there
    is an unbound symbol we should be able to report exactly which symbol was unbound.
    This can help the user track down errors, typos, and other trivial problems.


    Wouldn''t it be great if we could write a function that can report errors in a
    similar way to how `printf` works. It would be ideal if we could pass strings,
    integers, and other data to make our error messages richer.


    ![](img/f0182debe7478735c07b82d15dd58fde_97_0.png)


    The `printf` function is a special function in C because it takes a variable number
    of arguments. We can create our variable argument functions, which is what we''re
    going to do to make error reporting better.


    We''ll modify `lval_err` to act in the same as `printf`, taking a format string,
    and after that a variable number of arguments to match this string.


    To declare that a function takes variables arguments in the type signature you
    use the special syntax of ellipsis `...`, which represent the rest of the arguments.


    ```

    lval* lval_err(char* fmt, ...);

    ```


    Then, inside the function there are standard library functions we can use to examine
    the caller what has passed in.

    The first step is to create a `va_list` and initialise it with `va_start`, passing
    in the last named argument. For other purposes it is possible to examine each
    argument passed using `va_arg`, but we are going to pass our variable argument
    list directly to `sprintf`. This function acts like `printf` but writes to a string
    and takes in a `va_list`. Once we are done with our variables, we should call
    `va_end` to clean up any resources.


    The `sprintf` function outputs to a string, which we need to allocate first. Because
    we don''t know the size of this string until we''ve run the function we first
    allocate a buffer `512` characters and then reallocate to a smaller buffer if
    we''ve output it to. If an error message is going to be longer than 512 characters
    it will just get cut off, but hopefully this won''t happen


    Putting it all together our error function looks like this.


    ```

    lval* lval_err(char* fmt, ...)

    lval* v = malloc(sizeof(lval));

    v->type = LVAL_ERR;

    ```'
