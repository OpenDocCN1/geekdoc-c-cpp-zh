  md: '# Natural Grammars


    lets us write grammars in a more natural form too. Rather than using C functions
    that look less like a grammar, we can specify the whole thing in one long string.
    When using this method we don''t have to worry about how to join or discard inputs,
    with functions such as mpc_strfold_or free . All of that is done automatically
    for us.


    Here is how we recreate the previous examples using this method.


    ```

    mpc_parser_* Adjective = mpc_new("adjective")

