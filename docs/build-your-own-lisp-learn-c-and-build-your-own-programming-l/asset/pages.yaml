    # Why learn C


    C is one of the most popular and influential programming languages in the world.
    It is the language of choice for development for Linux, and has been used extensively
    in the creation of OS X and to some extent Microsoft Windows. It is used on microcomputers
    too. Your fridge and car can probably run on. In modern development, the use of
    C may be escapable, but its legacy is not. Anyone wanting to make a career out
    of software would be smart to learn C.


    But C is not software development and careers. C is about freedom. It rose to
    fame on the back of technologies of collaboration and freedom - Unix, Linux, and
    The Libre Software Movement. It personifies the idea of personal liberty within
    computing. It wills you to take control of the technology affecting your life.


    In this day and age, technology is more powerful than ever, this could not be
    more important.


    ![](img/f0182debe7478735c07b82d15dd58fde_6_0.png)


    The ideology of freedom is reflected in the nature of C itself. There is little
