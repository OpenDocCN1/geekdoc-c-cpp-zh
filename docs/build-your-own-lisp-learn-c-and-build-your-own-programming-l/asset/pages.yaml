  md: "The way the parent environment works is simple. If someone calls len_get on\
    \ the environment, and the symbol cannot be found. It will look then in any parent\
    \ environment to see if the named value exists, and repeat the process till either\
    \ the variable is found or there are no more parents. To signify that an environment\
    \ has no parent we set the reference to NULL.\n\nThe constructor function requires\
    \ basic changes to allow for this.\n\n```\nstruct {\n  lenv* par;\n  int count;\n\
    \  char** syms;\n  lenv** vals;\n};\nnlenv* lenv_new(void) {\n  lenv* e = malloc(sizeof(lenv));\n\
    \  e->par = NULL;\n  e->count = 0;\n  e->syms = NULL;\n  e->vals = NULL;\n  return\
    \ e;\n}\n```\n\nTo get a value from an environment we need to add in the search\
    \ of the parent environment in the case that a symbol is not found.\n\n```\nlval*\
    \ lenv_get(lenv* e, lval* k) {\n  for (int i = 0; i < e->count; i++) {\n    if\
    \ (strcmp(e->syms[i], k->sym) == 0) {\n      return lval_copy(e->vals[i]);\n \
    \   }\n  }\n  /* If no symbol check in parent otherwise else */\n  if (e->par)\
    \ {\n    return lenv_get(e->par, k);\n  } else {\n    return lval_err(\"Unbound\
    \ Symbol '%s\", k->sym);\n  }\n}\n```\n\nBecause we have a new lval type that\
    \ has its own environment we need to use when we copy lval structs.\n\n```\nlenv*\
    \ lenv_copy(lenv* e) {\n  lenv* n = malloc(sizeof(lenv));\n  n->par = e->par;\n\
    \  n->count = e->count;\n  n->syms = malloc(sizeof(char*) * n->count);\n  n->vals\
    \ = malloc(sizeof(lval*) * n->count);\n  for (int i = 0; i < e->count; i++) {\n\
    \    n->syms[i] = malloc(strlen(e->syms[i]) + 1);\n    strcpy(n->syms[i], e->syms[i]);\n\
    \    n->vals[i] = lval_copy(e->vals[i]);\n  }\n  return n;\n}\n```\n\nHaving parent\
    \ environments also changes our concept of defining a variable."
