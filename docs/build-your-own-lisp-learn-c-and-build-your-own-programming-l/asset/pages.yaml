  md: "This complicated but makes a lot more sense when explained in parts. It reads\
    \ like this. A string is a * character, followed by zero or more of either a backslash\
    \ \\ followed by any other character , or anything that isn't a character [\\\\\
    \"]. Finally it ends with another * character.\n\nWe also need to deal with this\
    \ using the lval_ function.\n\n```\nif (string(t->tag, \"string\")) {\n    return\
    \ lval_read_str(t);\n}\n```\n\nBecause the string input is in an escaped form\
    \ we need to create a function lval_read_str - deals with this Function is a little\
    \ tricky because it has to do a few tasks. It must strip the string input of the\
    \ \" * characters on either side. Then it must unescape the string, converting\
    \ series of characters such as \\ to their encoded characters. Finally it has\
    \ to create a new lval and clean up anything that happened in between.\n\n```\n\
    lval* read_str(mpc_ast_t *t) {\n    /* Cut the first quote character */\n    t->contents[strlen(t->contents)]\
    \ = 0;\n    /* Copy the string missing the first quote character */\n    char*\
