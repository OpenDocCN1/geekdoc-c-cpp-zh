    This function essentially checks that all the fields which make up the data for\
    \ a particular lval are equal. If all fields are equal, the whole thing is considered\
    \ equal. Otherwise if there are any differences the thing is considered unequal.\n\
    \n```\nint lval_eq(lval* x, lval* y) {\n  /* Different Types are always unequal\
    \ */\n  if (x->type != y->type) return 0;\n\n  /* Compare base upon type */\n\
    \  switch (x->type) {\n    /* Compare Number Value */\n    case LVAL_NUM: return\
