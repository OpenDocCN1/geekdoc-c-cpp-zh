    \ it between \" characters */\n  printf(\"\\%%%s\\\", escaped);\n  /* free the\
    \ copied string */\n  free(escaped);\n}\n```\n\n# Reading Strings\n\nNow we need\
    \ to add support for parsing strings. As usual this requires adding a new grammar\
    \ rule called string and adding it to our parser.\n\nThe rule we are going to\
    \ use that represents a string is essentially a series of escape characters, or\
    \ normal characters, between two quotation marks \" \". A string is essentially\
    \ a series of escape characters. We can specify this as a regular expression outside\
    \ our grammar string as follows.\n\n```\nstring :\"(\\\\\\.|[^\"])*\"/ ;\n```"
