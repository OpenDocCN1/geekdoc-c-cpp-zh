    \ in the environment and check their name. If a match is found we delete the value\
    \ stored at location, and store a copy of the input value.\n\nIf no existing value\
    \ found with that name we need to allocate some memory to put it in. In this case\
    \ we use malloc, and store a copy of the lval and its name at the newly allocated\
    \ locations.\n\n```\nlval* len_get(env* e, lval* k) {\n    /* Iterate over all\
