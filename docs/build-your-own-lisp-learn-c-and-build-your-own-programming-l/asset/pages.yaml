  md: '# Parsing • Chapter 6


    # Polish Notation


    To try out `mp` we''re going to implement a simple grammar that resembles a mathematical
    subset of our Lisp. It''s called Polish Notation and is a notation for arithmetic
    where the operator comes before the operands. For example...


    ![](img/f0182debe7478735c07b82d15dd58fde_34_0.png)


    +   1 + 2 + 6

    6 + (2 * 9)

    (10 * 2) / (4 + 2)


    We need to work out a grammar which describes this. We can begin by describing
    it textually and later formalise our thoughts.


    To start, we observe that in polish notation the operator always comes first in
    an expression, followed by either numbers or other expressions in parenthesis.
    This means we can say "a program is an operator followed by one or more expressions,"
    where "an expression is a number, or, in parenthesis, an operator followed by
    one or more expressions.


    More formally...


    ```

    Program the start of, an `Operator`, one or more `Expression`, and the end of
    input.

    Expression either a `Number` or ''('', an `Operator`, one or more `Expression`,
    and an '')''.

    Operator `+`, `-`, `*`, or `/`.

    Number an optional , and one or more characters between `0` and `9`

    ```


    # Regular Expressions


    We should be able to encode most of the above rules using things we know already,
