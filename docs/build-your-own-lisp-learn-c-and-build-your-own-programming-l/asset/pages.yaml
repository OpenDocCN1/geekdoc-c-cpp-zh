  md: '# Installation • Chapter 2


    # Setup


    Before we can start programming in C we''ll need to install a couple of things,
    and set up our environment so that we have everything we need. Because C is such
    a universal language this should hopefully be fairly simple. Essentially we need
    to install two main things. A text editor and a compiler.


    ![](img/f0182debe7478735c07b82d15dd58fde_9_0.png)


    A text editor is a program that allows you to edit files in a way suitable for
    programming.


    On **Linux** the text editor I recommend is edit. Whatever other basic text editor
    installed with your distribution will also work well if you are a Vim or Emacs
    user these are fine to use. Please don''t use an IDE. It''s not required for a
    small project and won''t help in understanding what is going on.


    On **Mac** a simple text editor that can be used is TextWrangler. If you have
    a different preference this is fine, but please don''t use Xcode for editing.
    This is a simple project and using an IDE you won''t understand what is going
    on.


    On **Windows** my text editor of choice is Notepad++. If you have another preference
    this is fine. Please don''t use Visual Studio as it does not have support for
    C programming. If you attempt to use it you will run into many problems.


    # Compiler


    The compiler is a program that transforms the C source code into a program your
    computer can run. The installation process for these is different depending on
    what operating system you are running.


    Compiling and running C programs is also going to require really basic usage of
    the command line. This will not cover, so I am going to assume you have at least
    some familiarity with using the command line. If you are worried about this then
    search for online tutorials on using it, relevant to your operating system.


    On **Linux** you can install a compiler by downloading some packages. If you are'
