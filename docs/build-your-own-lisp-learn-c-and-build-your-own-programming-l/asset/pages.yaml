  md: '# Q-Expressions • Chapter 10


    # Adding Features


    You''ll notice the following chapters will all follow a similar pattern. This
    pattern is the typical approach used to add new features to a language. It consists
    of a number of steps that bring a feature from start to finish. These are listed
    below, and are exactly what we''re going to do in this chapter to introduce a
    new feature called a Q-Expression.


    +   - Syntax Add new rule to the language grammar for this feature.

    - Representation Add new data type variation to represent this feature.

    - Parsing Add new functions for reading this feature from the abstract syntax
    tree.

    - Semantics Add new functions for evaluating and manipulating this feature.


    # Quoted Expressions


    In this chapter we''ll implement a new type of Lisp Value called a Q-Expression.

    This stands for quoted expression, and it is a type of Lisp Expression that is
    not evaluated by the standard Lisp mechanics. When encountered by the evaluation
    Q-Expressions are left exactly as they are. This makes them ideal for a number
    of purposes, we can use them to store and manipulate other Lisp values such as
    symbols, or other S-Expressions themselves.


    After we''ve added Q-Expressions we are going to implement a concise set of operators
    to manipulate them. Like the arithmetic operators these will prove fundamental
    in how we think about and play with expressions.


    The syntax for Q-Expressions is very similar to that of S-Expressions. The only
    difference is that instead of parenthesis ( ), Q-Expressions are surrounded by
    curly brackets { }. We can add this to our grammar as follows.


    > I''ve never heard of Q-Expressions.

    Q-Expressions don''t exist in Lisp. Other Lisps use Macros to stop evaluation.
    These look like normal functions, but they do not evaluate their arguments. A
    special macro called quote '' which can be used to stop the evaluation of almost
    anything. This is the inspiration for Q-Expressions, which are unique to Lisp,
    and will be used instead of Macros for doing all the same tasks and more.


    The way I''ve used S-Expression and Q-Expression in this book is a slight abuse
    of terminology, but I hope this misdemeanor makes the behaviour of our Lisp clearer.'
