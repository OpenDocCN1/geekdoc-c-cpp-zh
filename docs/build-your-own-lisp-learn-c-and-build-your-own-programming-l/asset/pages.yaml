  md: '# # How to learn C


    There is no way around the fact that C is a difficult language. It has many concepts
    that are unfamiliar, and it makes no attempts to help a new user. In this book
    I am not going to cover in detail things like the syntax of the language, or how
    to write loops and conditional statements.


    I will, on the other hand, show you how to build a real world program in C. This
    approach is much more difficult for the reader, but will teach you implicit things
    a traditional approach cannot. I cannot guarantee that this book will make you
    a confident user of C. What I can promise, is that those 1000 lines of code are
    going to be packed with content - and you will learn something worthwhile.


    This book consists of 16 chapters. How you complete this is up to you. It may
    well be possible to blast through this book over a weekend, or to take it more
    slowly and a chapter or two evening over a week. It shouldn''t take very long
    to complete, and will hopefully leave you with a taste for developing your language.


    # # Why build a Lisp


    The language we are going to be building in this book is a Lisp. This is a family
    of programming languages generalised by the fact that all their computation is
    represented by lists. This may sound scarier than it is. Lisps are actually very
    easy, distinctive, and powerful languages.


    Building a Lisp is a great project for many reasons. It puts you in the shoes
    of language designers, and gives you an appreciation for the whole process of
    programming, from language all the way down to machine. It teaches you about functional
    programming, and novel ways to view computation. The final product you are rewarded
    with provides a template for thoughts and developments, giving you a starting
    ground for new things. It''s simply not possible to comprehend the creativity
    and cleverness that goes into programming and computer science until you explore
    languages themselves.


    ![](img/f0182debe7478735c07b82d15dd58fde_7_0.png)


    The type of Lisp we''ll be building is one I''ve invented for the purposes of
    this book. I''ve designed it for minimalism, simplicity and clarity, and I become
    quite fond of it along the way. I hope you come to it too. Conceptually, syntactically,
    and in implementation, this Lisp has many differences to other major brands of
    Lisp. So much so I''m sure I will be getting e-mails from Lisp programmers telling
    me it isn''t a Lisp because it doesn''t do/have/look-like this or that.


    I''ve made this Lisp different to confuse beginners. I''ve made it different because
    different is good.'
