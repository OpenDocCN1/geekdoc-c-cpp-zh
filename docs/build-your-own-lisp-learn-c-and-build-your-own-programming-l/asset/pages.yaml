  md: 'start or the end of input, optional characters, or range of characters.


    These can be expressed, but they require something called a Regular Expression.
    Regular expressions are a way of writing grammars for small sections of text such
    as words or numbers. Grammars using regular expressions cannot consist of multiple
    rules, but they do give precise and concise control over what is matched and what
    isn''t. Here are some basic rules for writing regular expressions:


    +   - Any character is required.

    - The character a is required.

    - Any character in the set abcdef is required.

    - Any character in the range a to f is required.

    - The character a is optional.

    - Zero or more of the character a are required.

    - One or more of the character are required.

    - The start of input is required.

    - The end of input is required.


    These are all the regular expression rules we need for now. Whole books have been
    written on regular expressions. For the curious much more information can be found
    online or from these sources. We will use them in later chapters, so some basic
    knowledge will be required, but you won''t need to master them for now.


    In an mpc grammar we write regular expressions by putting them between forward
    slashes /. Using the guide above Number rule can be expressed as a regular expression
    using the string -?([0-9]+).


