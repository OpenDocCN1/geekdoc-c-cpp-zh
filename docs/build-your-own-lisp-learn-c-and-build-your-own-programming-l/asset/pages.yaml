    \ operators we use in C. Try to define an if function that tests for some condition\
    \ and then evaluate some code, or some other code, depending on the result. Once\
    \ you've finished come back and compare your work to mine. Observe the differences\
    \ and decide which parts you prefer.\n\nIf you still feel uncertain don't worry.\
    \ Follow along and I'll explain my approach.\n\n![](img/f0182debe7478735c07b82d15dd58fde_135_0.png)\n\
    \n# Ordering\n\nFor simplicity's make a rule to re-use our number data type to\
    \ represent the result of comparisons. I'll make a rule similar to C, to say that\
    \ any number that isn't evaluates to true, while always evaluates to false.\n\n\
    Therefore our ordering functions are a like a simplified version of our arithmetic\
    \ functions. They will only work on numbers, and we want them to work on two arguments.\n\
    \nIf these error conditions are met the miss we want to return a number zero or\
    \ one depending on the equality comparison between the two input values. We can\
    \ use C's comparison operators to do this. Like our arithmetic functions we will\
    \ make of a single function to deal all of the comparisons.\n\nFirst we check\
    \ the error conditions, then we compare the numbers in each of the arguments to\
    \ get result. Finally we return this result as a number value.\n\n```\nlval* builtin_gt(len*\
    \ e, lval* a) {\n  return builtin_ord(e, a, '>');\n}\n```\n\n```\nlval* builtin_lt(len*\
    \ e, lval* a) {\n  return builtin_ord(e, a, '<');\n}\n```"
