  md: "code.\n\nMacros work by taking some arguments (which can be almost anything),\
    \ Macros are copying and pasting them into some pattern. By changing the pattern\
    \ or the arguments we can alter what code is generated by the Macro. To define\
    \ macros we use #define preprocessor directive. After this we write the name of\
    \ the macro, followed by the argument names in parenthesis. After this pattern\
    \ is specified, we declare what code is generated for our error conditions.\n\n\
    We can design a macro to help with our error conditions called LASSERT . Macros\
    \ are typically given in capitals to help distinguish them from normal C functions.\
    \ This macro takes in three arguments args, cond and err. Then it generates code\
    \ as shown on the right hand side, but with these values pasted in the locations\
    \ where they are. This pattern is a good fit for all of our error conditions.\n\
    \n```\n#define LASSERT(args, cond, err)\nif ((cond)) { lval_del(err);\n```\n\n\
    We can use this to change how our functions are written, without changing what\
    \ code is generated by the compiler. This makes it much easier to read for the\
    \ programmer, and saves a bit of typing. The rest of the error conditions for\
    \ our functions should become easy to write too!\n\n# Head & Tail\n\nUsing our\
    \ head and tail functions are defined as follows. Notice how much clearer their\
    \ real functionality is.\n\n```\nlval* builtin_head(lval* a) {\nLASSERT(a, a->count\
    \ = 1,\n  \"Function 'head' passed too many arguments!\");\nLASSERT(a, a->cell[0]->type\
    \ = LVAL_QEXPR,\n  \"Function 'head' passed incorrect type!\");\nLASSERT(a, a->cell[0]\
    \ != 0,\n  \"Function 'head' passed!\");\n}\n```\n\n```\nlval* v = lval_take(a,\
    \ 0);\nwhile (v->count != 1) { lval_del(lval_pop(v, 1)); }\nreturn v;\n```\n\n\
    ```\nlval* builtin_tail(lval* a) {\nLASSERT(a, a->count = 1,\n  \"Function 'tail'\
    \ passed too many arguments!\");\nLASSERT(a, a->cell[0]->type = LVAL_QEXPR,\n\
    \  \"Function 'tail' passed incorrect type!\");\nLASSERT(a, a->cell[0] != 0,\n\
    \  \"Function 'tail' passed!\");\n}\n```\n\n```\nlval* v = lval_take(a, 0);\n\
    lval_del(lval_pop(v, 0));\nreturn v;\n```\n\n# List & Aval"
