  md: "# Evaluation • Chapter 7\n\n# Trees\n\nNow we can read input, and have it structured\
    \ internally, but we are still unable to evaluate it. In this chapter we add the\
    \ code that evaluates this structure and actually performs the computations encoded\
    \ within.\n\nThis internal structure is what we printed out by the program in\
    \ the previous chapter. It is called an Abstract Syntax Tree, and it represents\
    \ the structure of the program based on the input entered by the user. At the\
    \ leaves of this tree are numbers and operators - the actual data to be processed.\
    \ At the branches are the rules we used to produce this part of the tree - the\
    \ information on how to traverse and evaluate it.\n\nBefore working out exactly\
    \ how we are going to do this traversal, let's see how this structure is defined\
    \ internally. We peek inside mpc.h we have a look at the definition of mpc_ast_t,\
    \ which is the data structure we got from the parse.\n\n![](img/f0182debe7478735c07b82d15dd58fde_40_0.png)\n\
    \n```\ntypedef struct mpc_ast_t {\n    char* tag;\n    char* contents;\n    struct_state_t\
    \ state;\n    int children;\n    struct mpc_ast_t** children;\n} mpc_ast_t;\n\
    ```\n\nThis struct has a number of fields we can access. Let's take a look at\
    \ one by one.\n\nThe first field is tag . When we printed out the tree this was\
    \ the information that preceded the contents of the node. It was a string containing\
    \ a list of all the rules we used to parse that particular item. For example expr|number|regex.\n\
    \nThis tag field is going to be important as it lets us see what parse rules have\n\
    \nused to create the node.\n\nThe second field is state . This will contain the\
    \ actual contents of the node as '' , '(' or ')' . You'll notice for branches\
    \ this is empty, but for leaves we can use it to find the operator or number to\
    \ use.\n\nThe next field is line . This contains information about what state\
    \ the parser was when it found this, such as the line and column number. We won't\
    \ make use of this in our program.\n\nFinally we see two fields that are going\
    \ to help us traverse the tree. These are"
