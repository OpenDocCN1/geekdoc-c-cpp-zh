    \ language, a minimal Lisp, in under 1000\nlines of code! We'll be using a library\
    \ to do some of the initial work, so I'm cheating a\n on the line count, but the\
    \ rest of the code will be completely original, and you'll\n really create a powerful\
    \ Lisp by the end.\n\nThis book is inspired by other tutorials which go through\
    \ the steps of building a\nprogramming language from scratch. I wrote this book\
    \ to show that this kind of fun\ncreative project is a great way to learn a language,\
    \ and not limited to abstract\nhigh-level programmers.\n\nMany people are keen\
    \ to learn C, but have nowhere to start. Now there is no excuse.\n If follow this\
    \ book I can promise that, in the worst case, you'll get a cool new\nprogramming\
    \ language to play with, and hopefully you'll become an experienced C\nprogrammer!\n\
    \n# Who is this for\n\nThis book is for anyone wanting to learn C, or who has\
    \ once wondered how to build\nrow own programming language. This book is not suitable\
    \ as a first programming\nlanguage book, but anyone with some minimal programming\
    \ experience, in any\nlanguage, should find something new and interesting inside.\n\
    \nI tried to make this book as friendly as\npossible to beginners. I welcome beginners\n\
    the most because they have so much to\ndiscover! But beginners may be covering\
    \ many\nnew concepts, and essentially learning two\nnew programming languages\
    \ at once.\n\n![](img/f0182debe7478735c07b82d15dd58fde_5_0.png)\n\nIf you look\
    \ for help you may find people are not\npatient with you. You may find that, rather\
    \ than\nhey take the time to express how much\nthey know about the subject. Experienced\n\
    programmers might tell you that you are\nwrong. You should stop now, rather than\
    \ inflict your\nbad code on you.\n\n> Ada Lovelace • Your typical programmer.\n\
    \nAfter a couple of engagements like this you\nmay decide that you are not a programmer,\
    \ or don't really like programming, or that\nyou just don't get it. You may have\
    \ thought that you once enjoyed the idea of building\nyour own programming language,\
