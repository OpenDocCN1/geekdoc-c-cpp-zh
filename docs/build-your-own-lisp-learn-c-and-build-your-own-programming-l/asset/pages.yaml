    # How can I access these mpc functions?


    For now don''t worry about compiling or running any of the sample code in the
    next chapter. Just focus on understanding the theory behind grammars. In the next
    chapter we will set up with mpc and use it for a language closer to our Lisp.


    To define Phrase we can reference our parsers. We need to use the function mpc_and,
    that specifies one thing is required then another. As we pass it as Adjective
    and Noun, our previously defined parsers handle the arguments mpc_strfold and
    free, which show how to join or delete the results of these parsers. Ignore these
    arguments for now.


    ```

    mpc_parser_t Phrase = mpc_and(2, mpc_strfold,

    Adjective, Noun, free);

    ```


    To define Dog we must specify that one or more of some parser is required. For
    this we need to use the function mpc_many. As before, this requires the special
    variable mpc_strfold to say how the results are joined together, we can ignore.


    ```

    mpc_parser_t Dog = mpc_many(mpc_strfold, Phrase);

    ```


    By creating a parser that looks for zero or more occurrences of another parser
    an interesting thing has happened. Our Dog parser accepts inputs of any length.
    This means its language is infinite. Here are just examples of possible strings
    Dog could accept. As we discovered in the first section of this chapter we have
    used a finite number of re-write rules to create an infinite language.


    +   - wow book language many lisp

    - so c build such language

    - many build c c

    - wow lisp wow c many language

    - so c


    If we use mpc functions, we can slowly build up parsers that parse more and more
    complicated languages. The code we use sort reads like a grammar, but becomes
    more messy with added complexity. Due to this, this approach isn''t an easy task.
    A whole set of helper functions that build on simple constructs to make frequent
    tasks are all documented on the mpc repository. This is a good approach for complicated
    languages, as it allows for fine-grained control, but won''t be required for our
    needs.'
