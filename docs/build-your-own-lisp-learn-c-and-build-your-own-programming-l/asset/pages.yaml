    # Recursion


    There is a thing about this tree structure. It refers to itself. Each of its children
    are

    themselves again, and the children of those children are trees yet again. Just

    like languages and re-write rules, data in this structure contains repeated

    substructures represent their parents.


    This pattern of repeated substructures could

    go and on. Clearly if we define a function

    can work on all possible trees we can

    look just a couple of nodes, we have to

    define it on trees of any depth.


    We can do this, by exploiting the

    nature of how these substructures represent

    and using a technique called recursion.


    Put simply a recursive function is one that

    calls itself as some part of its calculation.


    It sounds weird for a function to be defined in

    terms of itself. But consider that functions can

    give different outputs when supplied with

    different inputs. If we gave changed, or

    different inputs to a recursive call to the same

    function, and provide a way for this function


    ![](img/f0182debe7478735c07b82d15dd58fde_41_0.png)'
