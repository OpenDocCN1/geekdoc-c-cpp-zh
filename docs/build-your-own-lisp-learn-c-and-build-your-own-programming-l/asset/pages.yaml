    \ such as print and load we don't care much about what it evaluates to, but do\
    \ we care about the order in which it happens.\n\nTherefore we can create a function\
    \ which evaluates a number of expressions in order and returns the last one. This\
    \ relies on the last function, which sometimes returns the final element of a\
    \ list. We'll define this later.\n\n```\n; Perform Several things in Sequence\n\
    (fun (do & 1)\n  if (= x 1)\n    (nil)\n    (last 1))\n))\n```\n\nSometimes we\
    \ want to save results to local variables using the operator. When we're inside\
    \ a function we save locally, but sometimes we want to open up an even more local\
    \ scope. For this we can create a function let which creates an empty function\
    \ for code to take place in, and evaluates it.\n\n```\n; Open new scope\n(fun\
    \ (let b)\n  (() (b))\\))\n```\n\nWe can use this in conjunction with do to ensure\
    \ that variables do not leak out of their scope.\n\n```\nlispy> let (do (= x)\
