  md: "to not call itself again under certain conditions, we can be more confident\
    \ in this recursive function is doing something useful.\n\nAs an example we write\
    \ a recursive function which will count the number of nodes in our tree structure.\n\
    \nTo begin we work out how it will act in the most simple case - if the tree has\
    \ no children. In this case we know the result is simply. Now we can go on to\
    \ define the more complex case - if the tree has one or more children. In this\
    \ case the result will be one (the root node itself), plus the number of nodes\
    \ in all of those children.\n\nBut how do we find the number of nodes in all of\
    \ the children? We can use the function we are in the process of defining! Yeah,\
    \ Recurs.\n\nIn C we might write something like this.\n\n```\nint number_nodes(mpc_node_t\
    \ *t) {\n  if (t->children_num == 0) { return 1; }\n  if (t->children_num == 1)\
    \ {\n    int total = 1;\n    for (int i = 0; i < t->children_num; i++) {\n   \
    \   total = total + number_nodes(t->children[i]);\n    }\n    return total;\n\
    \  }\n}\n```\n\nRecursive functions are weird because they require an odd leap\
    \ of faith. First we have to assume that a function does something correctly already,\
    \ and then we have to go about using this function, to write the initial function\
    \ we assumed had!\n\nLike most things, recursive functions almost always end up\
    \ following a similar pattern. A base case is defined. This is the case that ends\
    \ the recursion, such as t->children_num == 0 in our previous example. After this\
    \ the recursive case is defined, such as t->children_num == 1 in our example,\
    \ which breaks down a computation into smaller parts and calls itself to compute\
    \ those parts, before combining them.\n\nRecursive functions can take some thought,\
    \ pause and ensure you understand them before continuing onto other chapters because\
    \ we'll be making good use of them in the rest of the book. If you are still uncertain,\
    \ you can attempt some of the bonus marks for this chapter.\n\n# Evaluation\n\n\
    To evaluate the parse tree we are going to write a recursive function. But before\
