  md: 'included with C. One of the functions from this library is the puts function
    you see later on the program.


    Next we declare a function called main. This function is declared to output an
    int, and as input an int called argc and a char** called argv. All C programs
    must contain this function. All programs start running from this function.


    Inside the main function is called with the argument "Hello, world!\ This outputs
    the message Hello, world! to the command line. The function puts is short for
    string. The second statement inside the function is return 0;. This tells the
    main function to finish and return 0. When a C program returns 0 this indicates
    have been no errors running the program.


    # Compilation


    Before we can run this program we need to compile it. This will produce the actual
    executable we can run on our computer. Open the command line and browse to the
    directory that hello_world.c is saved in. You can then compile your program using
    the following command.


    ```

    cc -stdc99 -Wall hello_world.c -o hello_world

    ```


    This compiles the code in hello_world.c reporting any warnings and outputs the
    program to a new file called hello_world. Use the -stdc99 flag to tell the compiler
    which version or standard of C we are programming. This lets the compiler ensure
    our code is standardized so people with different operating systems or compilers
    will be able to use our code.


    If successful you should see the output file in the current directory. This can
    be run by typing ./hello_world (or just hello_world on Windows). Everything is
    correct you should see a friendly hello, world! message appear.


    Congratulations!You''ve compiled and run your first C program.


    # Errors


    If there are some problems with your C program the compilation process may fail.
    These issues can range from simple syntax errors, to other complicated problems
    that are harder to understand.


    Sometimes the error message from the compiler will make sense, but if you are
    having trouble understanding it by searching online for it. You should see if
    you can find a concise explanation of what it means, and work out how to correct
    it. Remember this: there are many people before you have struggled with exactly
    the same problems.


    Sometimes there will be many compiler errors stemming from one source. Always
    go through compiler errors from first to last.


    Sometimes the compiler will compile a program, but when you run it it will crash.
    Debugging programs in this situation is hard.'
