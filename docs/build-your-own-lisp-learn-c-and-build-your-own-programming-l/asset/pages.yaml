    be given is fairly restrictive, we''re going to allow for all sorts of characters
    in the name of a variable.


    We can create a regular expression that expresses the range of characters available
    as follows.


    ```

    /[a-zA-Z0-9_\+\*|\\\\\\<>!&]+/

    ```


    On first glance looks like we''ve bashed our hands into keyboard. Actually it
    is a regular expression with a big range identifier [] Inside range specifiers
    special characters lose meaning, but some of these characters still need to be
    escaped with backslashes. Because this part of a C string we need to put two backslashes
    to represent a single character in the input.


    This rule limits symbols to the normal of the C identifiers a-zA-Z0-9_ the arithmetic
    operators .+\*|\\/; the backslash character \\\ the comparison operators <> or
    an ampersands &. This will give us all the flexibility needed for defining and
    extending symbols.


    ```

    mpca_lang(MPCA_LANG_DEFAULT,

    number : /-[0-9]*/

    symbol : /[a-zA-Z0-9_\+\*|\\\\\\<>!&]+/

    sexpr : ''<expr>''

    qexpr : ''<expr>''

    expr : ''|<symbol> | <expr>''

    lispy : ''/\/ <expr> \*/

    Number, Symbol, Sexpr, Qexpr, Expr, Lisp);

    ```


    # # Function Pointers


    Once we introduce variables, symbols will no longer represent functions in our
    language, but rather they will represent a name for us to look up into our environment
    and get new value from back.


    Therefore we need a new value to represent functions in our language, we can return
    one of the builtin symbols is encountered. To create this new type of lval we
    are going to use something called function pointer.


    Function pointers are a great feature of C that lets you store and pass around
    pointers to. It doesn''t make sense to edit the data pointed by these pointers.
    Instead we use them to call the function pointed to, as if it were a normal function.


    Like normal pointers, function pointers have some type associated with them. This
    type specifies the type of function pointed to, not the type of the data pointed
    to. This compiler works only if it has been called.


    In the previous chapter our builtin functions take a lval* as input and returned
    a lval* as output. In this chapter our builtin functions will take an extra pointer
    to the environment len* as input. We can declare a new function pointer type called
    builtin, for this type of function, like this.


    ```

    typedef lval*(*builtin)(lenv*, lval*);

    ```'
