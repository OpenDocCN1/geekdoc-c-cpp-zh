    \ (fst l)) (tail l)))\n  )\n```\n\n使用折叠我们可以以非常优雅的方式定义求和和积函数。\n\n```lisp\n(fun\
    \ sum (fold + 0))\n(fun product (fold * 1))\n```\n\n## 条件函数\n\n通过定义 `fun` 函数，我们已经展示了我们的语言在定义看起来像新语法的函数方面的强大。另一个例子是模拟\
    \ C 中的 `switch` 和 `case` 语句。在 C 语言中，这些是语言内置的，但对于我们的语言，我们可以将它们定义为库的一部分。\n\n我们可以定义一个\
    \ `select` 函数，它接收零或多个两个元素的列表作为输入。对于参数中的每个元素列表，它首先求值对中的第一个元素。如果为真，则评估并返回第二个项，否则对列表的剩余部分执行相同的操作。\n\
    \n```lisp\n(fun {select & cs} {\n  if (= cs nil) \n    (error \"No Selection Found\"\
    )\n  if (fst (fst cs)) (snd (fst cs)) (select (tail cs))\n}\n)\n```\n\n我们还可以定义一个\
    \ `otherwise` 函数，使其始终求值为真。这有点像 C 语言中的 `default` 关键字。\n\n```lisp\n; 默认情况\n(def\
    \ (otherwise) true)\n```\n\n```lisp\n; 打印日期后缀\n(fun (month-day-suffix i) {\n \
    \ select\n    (= i 0) \"st\"\n    (= i 1) \"nd\"\n    (= i 2) \"rd\"\n    (otherwise)\
    \ \"th\"\n})\n```\n\n这实际上比 C 的 `switch` 语句更强大。在 C 语言中，输入值仅与值进行相等比较，而不是传入条件；我们将一个值与多个候选值进行比较。我们也可以在\
    \ Lisp 中定义这个函数，再次比较一个值以及零或多个两个元素的列表。如果元素列表的第一个元素等于 `x`，则评估第二个元素，否则处理继续向下进行。\n\n\
    ```lisp\n(fun {case x cs} {\n  if (= cs nil)\n    (error \"No Case Found\")\n\
    \  if (= x (fst (fst cs))) (snd (fst cs))\n    (case (join (list x) (tail cs))\n\
    })\n```\n\n这个函数的语法变得非常好且简单。尝试想实现此类方法的其他控制结构或有用函数。\n\n```lisp\n(fun {day-name x}\
    \ {\n  case x\n    0 \"Monday\"\n    1 \"Tuesday\"\n    2 \"Wednesday\"\n    3\
    \ \"Thursday\"\n    4 \"Friday\"\n    5 \"Saturday\"\n    6 \"Sunday\"\n})\n```\n\
    \n## 波那契\n\n通过定义 `fun` 函数，我们已经展示了我们的语言在定义看起来像新语法的函数方面的强大。另一个例子是模拟 C 中的 `switch`\
