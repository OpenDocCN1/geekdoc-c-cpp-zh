    \ Adjective = mpc_or($,\n    mpc_sym(\"wow\"), mpc_sym(\"many\"),\n    mpc_sym(\"\
    so\") \n```\n\n## 我如何访问这些 mpc 函数？\n\n目前不要担心编译或运行下一章中的任何示例代码。只需专注于理解语法背后的理论。在下一章中，我们将设置\
    \ `mpc` 并将其用于一种更接近我们 Lisp 的语言。\n\n要定义 `Phrase`，我们可以引用我们的解析器。我们需要使用 `mpc_and` 函数，它指定了先需要一个，然后另一个。当我们将其作为\
