    \ and evaluate them. Our load function is going to rely on mpc_parse* called Lispy.\n\
    \nTherefore, just like functions, we need to forward declare our parser pointers,\
    \ and place them at the top of the file.\n\n```\nmpc_parser_t* Number;\nmpc_parser_t*\
    \ Symbol;\nmpc_parser_t* String;\nmpc_parser_t* Comment;\nmpc_parser_t* Opr;\n\
    mpc_parser_t* Expr;\nmpc_parser_t* Lispy;\n```\n\nOur load function will be like\
    \ any other builtin. We need to start by checking that the input argument is a\
