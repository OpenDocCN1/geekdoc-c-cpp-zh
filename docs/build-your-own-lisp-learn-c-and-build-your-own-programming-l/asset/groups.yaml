  mdcn: "\n\n我曾尝试研究为什么 Lisp 使用 `;` 作为注释，但这些符号的起源似乎已经消失在时间的迷雾中。我将其想象为对 C 和 Java 等命令式语言的一种微小反抗，因为这些语言毫无廉耻且频繁地使用分号来分隔语句。对于\
    \ Lisp 来说，这些语言都只是注释。\n\n因此在 Lisp 中，注释定义为分号 `;` 后面跟着任意数量非换行符（由 `\\r` 或 `\\n` 表示）的字符。我们可以使用正则表达式来定义它。\n\
    \n```\ncomment : \"/;([^([^\\\\\\\\r\\\\n])\\*\\*/\";\n```\n\n就像字符串一样，我们需要创建一个新的解析器并使用它来更新\
    \ `mpc_lang` 中的语言。我们还需要忘记清理 `mpc_cleanup` 中的解析器，并更新第一个参数以反映传入的解析器数量。\n\n我们最终的语法看起来如下：\n\
    \n```\nmpca_lang(MPCA_LANG_DEFAULT, \n number : /?([0-9]+)/;\n symbol : /\\'([A-zA-Z0-9_]+|\\\
    \\\\\\\\\\\\\\\\\\|<>!])\\+/;\n string : /\\'([^\\\\\\\\r\\\\n])*\\'/;\n sexpr\
    \ : /\\'<expr>\\'/;\n qexpr : /\\'<number>|<symbol>|<string>/;\n expr : /\\'<comment>|<sexpr>|<expr>/;\n\
    \ lisp : /\\'<expr>\\*\\*/;\n ',', Number, String, Comment, Sexpr, Qexpr, Expr,\
    \ Lispy));\n```\n\n清理函数看起来像这样：\n\n```\nmpc_cleanup(0,\n Number, String, String,\
    \ comment,\n Sexpr, Qexpr, Expr, Lispy);\n```\n\n由于注释仅供程序员阅读代码时使用，我们读取它们的内部函数仅包含忽略它们的操作。我们可以在\
    \ `lval_read` 中添加一个子句来处理方括号和括号中的这种情况。\n\n```\nif (strstr(t->children[i]->tag,\
    \ \"comment\")) { continue; }\n```\n\n注释在交互式提示符中用处不大，但对于添加代码文件并进行注释非常有帮助。\n\n\
    # 加载函数 (Load Function)\n\n我们想要构建一个函数，在传入文件名字符串时加载并评估文件。为了实现这个函数，我们需要利用我们的语法，因为我们需要读取文件内容、解析并评估它们。我们的\
    \ `load` 函数将依赖于名为 `Lispy` 的 `mpc_parse*`。\n\n因此，就像函数一样，我们需要向前声明解析器指针，并将它们放在文件顶部。\n\
    \n```\nmpc_parser_t* Number;\nmpc_parser_t* Symbol;\nmpc_parser_t* String;\nmpc_parser_t*\
    \ Comment;\nmpc_parser_t* Sexpr;\nmpc_parser_t* Qexpr;\nmpc_parser_t* Expr;\n\
    mpc_parser_t* Lispy;\n```\n\n我们的 `load` 函数将像其他内置函数一样。我们需要通过检查输入是否为单个字符串来开始。然后使用语法通过\
    \ `mpc_contents` 读取文件内容。当像 `mpc_parse` 一样，它将文件内容解析为某个抽象语法树 `mpc_result` 对象。与我们的命令行提示符略有不同，成功解析文件后，它允许多个表达式并评估它们。为了实现这种行为，我们需要遍历内容中的每个表达式并逐一评估。如果发生解析错误，我们应该打印它并继续。如果有错误，我们将提取消息并将其放入\
    \ `lval`。该内置函数的返回值也可以是表达式。完整代码如下：\n\n```\nlval* builtin_load(lval* len, lval*\
    \ a) {\nASSERT_NUM(\"load\", a);\nASSERT_TYPE(\"load\", 0, LVAL_STR);\n/* 解析给定的文件\
    \ */\nmpc_result_t* r;\nif (mpc_parse_contents(a->cell[0]->str, Lispy, &err))\
    \ {\n  // 读取内容 */\n  lval* expr = lval_read(r->output);\n  mpc_ast_delete(r->output);\n\
    \n/* 评估每个表达式 */\nwhile (expr->count()) {\n  // 如果评估导致错误则打印\n  if (x->type == LVAL_ERROR)\
    \ { lval_printf(x); }\n  lval_del(x);\n}\n/* 删除表达式和参数 */\nlval_del(expr);\nlval_del(a);\n\
    \n/* 返回空列表 */\n  return lval_lexpr(r);\n\n} else {\n  // 获取解析错误作为字符串\n  char*\
    \ err_msg = mpc_err_string(r->error);\n  mpc_err_delete(r->error);\n\n/* 使用它创建错误消息\
    \ */\nlval* err = lval_err(\"Could not load library %s\", err_msg);\nfree(err_msg);\n\
    lval_del(err);\n\n/* 清理并返回错误 */\nreturn err;\n}\n```\n\n# 命令行参数 (Command Line\
    \ Arguments)\n\n有了加载文件的能力，我们可以添加其他编程语言的功能。当命令行给出文件名时，我们可以运行这些文件。例如可以写 `filename.py`。\n\
    \n这些命令行参数可以通过 `argc` 和 `argv` 变量访问。`argc` 变量给出参数的数量，`argv` 始终设置为至少一个，第一个参数。这意味着如果\
    \ `argc` 设置为 1，我们调用解释器，否则通过 `builtin_load` 运行每个参数。\n\n```c\n/* 文件列表 */\nif (argc\
    \ > 1) {\n    /* 遍历每个文件名（从 1 开始） */\n    for (int i = 1; i < argc; i++) {\n  \
    \      /* 单个参数 */\n        lval* args = lval_lexpr(argv[i]);\n        /* 传递给内置\
    \ load 并获取结果 */\n        lval* x = builtin_load(a,args);\n        /* 如果结果是错误确保打印它\
    \ */\n        if (x->type == LVAL_ERROR) {\n            lval_del(x);\n       \
    \ }\n    }\n}\n```\n\n现在可以编写基础程序并使用这种方法调用 `example.lisp`。\n\n# 打印函数 (Print Function)\n\
    \n如果我们从命令行运行程序，可能希望它们输出某些数据而不是定义函数和值。我们可以在 Lisp 中添加 `print` 函数，它用空格分隔每个参数，然后打印换行结束。\n\
    \n```c\nlval* builtin_print(lenv e, lval* a) {\n\n    /* 打印每个参数并在后加空格 */\n   \
    \ for (int i = 0; i < a->count; i++) {\n        lval_print(a->cell[i]);\n    }\n\
    \    /* 打印换行并删除参数 */\n    putchar('\\n');\n    lval_del(a);\n    return lval_lexpr();\n\
    }\n```\n\n# 错误函数 (Error Function)\n\n我们也可以使用字符串来添加错误报告函数。这可以作为 `lval_err` 的输入字符串错误消息。\n\
    \n```c\nlval* builtin_error(lenv e, lval* a) {\n    ASSERT_NUM(\"error\", a, 1);\n\
    \    ASSERT_TYPE(\"error\", 0, LVAL_STR);\n    /* 从第一个参数构造错误 */\n    lval* err\
    \ = lval_err(a->cell[0]->str);\n    /* 删除参数并返回 */\n    lval_del(a);\n    return\
    \ err;\n}\n```\n\n最后一步是将这些注册为内置。现在我们终于可以开始构建库并将它们写入文件了。\n\n```\n/* 函数 */\nlenv_add_builtin(e,\
    \ \"load\", builtin_load);\nlenv_add_builtin(e, \"error\", builtin_error);\nlenv_add_builtin(e,\
    \ \"print\", builtin_print);\n```\n\n```\nlisp \"Hello World!\"\n\"Hello World!\"\
    \n()\nlisp error \"This is an error\"\nError: This is an error\nlisp> load hello.lisp\n\
    \"Hello World!\"\n()\nlisp>>\n```\n\n# 结束 (Finishing Up)\n\n这是 Lisp 的最后一章，我们将显式处理\
    \ C 实现。本章的结果将是你语言的最终状态。代码行应该接近 1000 行。编写这么多代码并非易事。如果你到了这里，你编写了一个真正的程序并开始了一个正式的项目。在这里学到的技能应该是迁移的，并给你寻求你的目标的信心。你现在有了一个值得自豪的程序。去向你的朋友和家人展示它吧！我的参与真的只是开始。感谢一直关注，祝你未来编写任何代码好运！\n\
