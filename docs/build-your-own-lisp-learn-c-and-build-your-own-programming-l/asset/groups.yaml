    this function take to run?", Is this function efficient?", Will it modify the
    state of my program? If so how?


    A third method is to think of functions as partial computations. Like the Mathematical
    model they can take some inputs. These values are required before the function
    can complete the computation. This is it called partial. But the computational
    model consists of a computation specified in some language of variables, and to
    inputs are called unbound simply them. Fitting a cog into a machine which previously
    spinning aimlessly completes all that is needed for the computation to run, and
    the machine runs. The output of these partial computations is itself a variable
    with an unknown value.


    ![](img/f0182debe7478735c07b82d15dd58fde_111_0.png)


    output can be placed as input to a new function, and so one function relies on


    An advantage of this idea over the mathematical model is that we recognize that
    functions contain computation. We see that the computation runs, physical process
    is going on in the machine. This means we recognize the fact that certain things
    take time to elapse, or that a function might change the program state, or do
    anything else we''re not sure about.


    All these ideas are explored in the study of functions, Lambda calculus. This
    is a field that combines logic, maths, and computer science. The name comes from
    the Greek letter Lambda, which is used in the representation of binding variables.
    Using Lambda calculus gives a way of defining, composing and building functions
    using a simple mathematical notation.


    We are going to use all of the previous ideas to add user defined functions to
    our language. Lisp is already well suited to this sort of playing around and using
    these concepts, we won''t have to work much for us to implement functions.


