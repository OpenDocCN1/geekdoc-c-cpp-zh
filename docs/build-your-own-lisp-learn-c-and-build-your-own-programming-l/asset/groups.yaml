    # Why is that syntax of C can look particularly weird.


    In some places the syntax of C can look particularly weird. It can help if we
    understand exactly why the syntax is like this. Let us de-construct the syntax
    in the example above part by part.


    The first `typedef` can be put before any standard variable declaration. It results
    in the name of the variable, being declared a new type, matching what would be
    the inferred type of that variable. This is why in the above declaration what
    looks like the function name becomes the new type name.


    Next all others Pointer types in C actually mean to be written with the star `*`
    on the left side of the variable name, not the right side of the type `int*`.
    This is because C syntax works by a kind of inference. Instead of variable `x`
    "Create a new int pointer x" it is meant to read "Create a new variable x results
    in an int" Therefore `x` is inferred to be a pointer to `int`.


    This idea is extended to function pointers. We can read the declaration as follows:
    To get an `builtin` we reference `builtin` and call it with a `lenv` and a `ival`.
    Therefore `builtin` must be a function pointer that takes an `lenv` and `ival*`
    and returns `ival*`.


    # Cyclic Types


    The `builtin` type references the `ival` type and the `lenv` type. This means
    that function should be declared first in the source file.


    But we want to make a `builtin` field in our `ival` struct so we can create function
    values. So before our `builtin` declaration must go before our `ival` declaration.
    This leads to a cyclic type dependency, where two types depend on each other.


    We come across this problem with functions which depend on each other. The solution
    was to create a forward declaration which declared a function but left the body
    of it empty.


    In C we do exactly the same with types. First we declare two `struct` types without
    a body. Secondly we typedef them to these names `ival` and `lenv`. Then we can
    define our `builtin` function pointer. And finally we can define the body of our
    `ival` struct. Now all type issues are resolved and the compiler won''t comply
    anything.


    ```

    / Forward Declarations */

    struct ival;

    struct lenv;

    typedef struct ival ival;

    typedef struct lenv lenv;


    /* Lisp Value */

    enum { LVAL_ERR, LVAL_NUM, LVAL_FUN, LVAL_SEXPR, LVAL_QEXPR };

    ```'
