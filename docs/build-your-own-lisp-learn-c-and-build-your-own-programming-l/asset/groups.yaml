    There are two functions we''ve used and not defined in the above code. These are
    lval_pop and lval_take. These are general purpose functions for manipulating S-Expression
    lists, which we''ll use of here and in the future.


    The lval_pop function extracts a single element from a list and shifts the rest
    of the list back so that it no longer contains lval* and returns the extracted
    value. Notice that it does not delete the input. It is like taking an element
    from a list and popping it, leaving what remains. This means both the element
    popped and the next one need to be deleted at some point with lval_del.


    The lval_take function is similar to lval_pop but it deletes the rest. This is
    like taking an element from the list and deleting the rest. It is a slight variation
    on lval_pop, but it makes our code easier to read in some places. Unlike lval_pop,
    only the expression that the list needs to be deleted by lval_del.


    ```

    lval* lval_pop(lval* v, int i) {

    /* Find the item at "i" */

    lval* x = v->cell[i];

    /* Shift memory after the item at "i" over the top / */

    memmove(&v->cell[i], v->cell[i+1], sizeof(lval*) * (v->count-i));

    /* Decrease the count of items in the list */

    v->count--;

    /* Reallocate the memory used */

    v->cell = realloc(v->cell, sizeof(lval*) * v->count);

    return x;

    }

    ```


    ```

    lval* lval_take(lval* v, int i) {

    lval* x = lval_pop(v, i);

    lval_del(v);

    return x;

    }

    ```


