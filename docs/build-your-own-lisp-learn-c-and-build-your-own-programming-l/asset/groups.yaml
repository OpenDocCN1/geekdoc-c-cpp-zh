    \ data from the previous thing, but conceptually it is a good way to think about\
    \ how language works. So actually variables are simply a way of naming values.\
    \ They let us assign a name to a value, and then let us get a copy of that value\
    \ later. To allow for naming variables we need to create a structure that stores\
    \ the name and value of everything in our program. We call this the environment.\
    \ When we start a new program we want to create a new environment to go along\
    \ with it, in which each bit of input is evaluated. We can then store and recall\
    \ variables. What happens when we reassign a name to something? Isn't this like\
    \ mutability? In Lisp, when we reassign a name we're going to delete the old and\
    \ create a new one. This gives the illusion that the thing assigned to that name\
    \ has changed, and is mutable, but in fact we have deleted the old thing and assigned\
    \ it a new thing. This is different from C without deleting and creating a new\
    \ one.\n\n# Symbol Syntax\n\nNow we're going to allow for user defined variables\
    \ we need to update the grammar for symbols to be more flexible. Rather than just\
    \ builtin functions it should match any possible symbol. Unlike in C, the name\
    \ a variable can be given is fairly restrictive. We can create a regular expression\
    \ that expresses the range of characters available. On first glance like we've\
    \ bashed our hands into keyboard. Actually it is a regular expression with a big\
    \ range special characters lose meaning, but some of these characters still need\
    \ to be escaped with backslashes. Because this part of C we need to put two backslashes\
    \ to represent a single character in the input. This rule limits symbols to the\
    \ a-zA-Z0-9_ the arithmetic operators +*|/ the comparison operators <> or an ampersands\
    \ &. This will give us all the flexibility needed for defining and extending symbols.\n\
    \n```c\nmpca_lang(MPCA_LANG_DEFAULT,\nnumber : /[0-9]+/\nsymbol : /[a-zA-Z0-9_\\\
