    \n这就是名为 `mpc` 的库派用用场。\n\n## Parser Combinators\n\n`mpc` 是我写的一个解析器组合（Parser Combinator）库。这意味着它允许你构建能够理解并处理特定语言的程序。这些被称为解析器（parsers）。构建解析器有许多方法，但使用解析器组合库的酷之处在于，它让你只需指定语法就能构建解析器……某种意义上。\n\
