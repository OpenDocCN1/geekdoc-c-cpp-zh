    \n通过引入 S-表达式，我们终于进入了 Lisp 的世界。\n\n# 指针\n\n在 C 语言中，如果不正确处理指针，就探索列表的概念。指针是 C 语言中著名的被误解的方面。它们很难教，但在概念上又非常简单；它们伴随着许多新术语，而且没有明确的用例。这使得它们看起来比实际要狰狞得多。幸运的是，我们有两个理想的用例，这两者在\
    \ C 语言中都极其典型，并且很可能成为你 90% 时间里使用指针的方式。\n\n我们在 C 中需要指针的原因是函数调用的工作方式。当你在 C 中调用函数时，参数总是通过值传递传递的。这意味着它们的副本会被传递给你调用的函数。这对于\
    \ `int`、`long`、`char` 以及偶尔的用户定义的结构体类型（如 `lval`）都是如此。大部分情况下很好，但偶尔会引起问题。\n\n当我们有一个包含许多其他想要传递的大型结构体时，就会出现常见问题。每当我们调用函数时，必须创建另一个副本。突然，仅仅为了调用函数而需要复制的数据量可能会变得巨大！\n\
    \n第二个问题是，如果我们定义一个结构体，它是固定大小的。它有有限的字段，而且每个字段必须是一个自身大小受限的结构体。如果我想用一个列表来调用函数，其中项的数量随调用而变化，我显然不能使用结构体来增长和缩小。\n\
    \n为了解决这些问题，C 的开发者（或某位……）想出了一个好主意。他们将计算机内存想象成一个单一列表。（此处原文中重复的句子已按要求处理）。\n\n"
