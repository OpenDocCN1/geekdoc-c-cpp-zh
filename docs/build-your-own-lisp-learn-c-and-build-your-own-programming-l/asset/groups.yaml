  mdcn: "\n条件语句：只有在满足特定条件下，程序才会执行某些代码。\n\n为了在条件下执行代码，我们使用 `if` 语句。它的写法是 `if` 后面跟着括号内的某些条件，然后是花括号中要执行的代码。`if`\
    \ 语句后面可以紧跟一个可选的 `else` 语句，随后是另一个花括号中的其他语句。当条件为假时，将执行这些括号中的代码。\n\n我们可以使用逻辑运算符 `||`（或）和\
    \ `&&`（与）来测试多个条件。\n\n在条件语句的括号内，任何非 0 的值都会被求为 `true`。记住这一点很重要，因为我们很多时候是隐式使用条件来检查内容的。\n\
    \n如果我们想检查整数 `x` 是否大于 10 且小于 100，可以写如下代码：\n\n```\nif (x > 10 && x < 100) {\n  puts(\"\
    x is greater than 10 and less than 100!\");\n} else {\n  puts(\"x is less than\
    \ 11 or greater than 99!\");\n}\n```\n\n# 循环\n\n循环允许某些代码重复执行，直到某些条件变为假或达到其他计数器。\n\
    \nC 语言有两种主要的循环。第一种是 `while` 循环。该循环反复执行代码块，直到某个条件变为假。它的写法是 `while` 后面跟着括号内的某些条件，然后是花括号中要执行的代码。例如，一个从\
    \ 10 计数到 1 的循环可以写如下：\n\n```\nint i = 10;\nwhile (i > 0) {\n  puts(\"Loop Iteration\"\
    );\n  i = i - 1;\n}\n```\n\n第二种循环是 `for` 循环。这种循环需要的不是一个条件，而是三个用分号隔开的表达式：初始化器、条件和递增器。初始化器在循环开始前执行。条件在循环每次迭代之前进行检查。如果条件为假，则退出循环。递增器在每次迭代结束时执行。这些循环通常用于计数，因为它们比\
    \ `while` 循环更紧凑。\n\n例如，为了写一个从 0 计数到 9 的循环，我们可能会写如下代码。在这种情况下，`++` 运算符初始化了变量 `i`。\n\
    \n```\nfor (int i = 0; i < 10; i++) {\n  puts(\"Loop Iteration\");\n}\n```\n\n\
    #  Bonus题\n\n- 使用 `for` 循环打印五次 `Hello World!`。\n- 使用 `while` 循环打印五次 `Hello World!`。\n\
    - 声明一个输出 `n` 次 `Hello World!` 的函数。在 `main` 中调用它。\n- 除了列出的类型外，还有哪些内置类型？\n- 除了大于\
    \ `>` 和小于 `<` 之外，还有哪些条件运算符？\n- 除了加法 `+` 和减法 `-` 之外，还有哪些数学运算符？\n- `+=` 运算符是什么？它是如何工作的？\n\
    - `do` 循环是什么？它是如何工作的？\n- `switch` 语句是什么？它是如何工作的？\n- `break` 关键字是什么？它起什么作用？\n-\
    \ `continue` 关键字是什么？它起什么作用？\n- `typedef` 关键字具体是做什么的？\n\n# 交互式提示符 • 第 4 章\n\n#\
    \ 读取、求值、打印\n\n在我们构建编程语言时，需要某种方法与它交互。C 使用的是编译器，你可以在其中修改语言、重新编译并运行它。如果我们能做些更好的、动态地与语言交互，那就好了。然后我们可以非常快速地测试它在多种条件下的行为。为了这一点，我们可以构建一个称为交互式提示符的程序。\n\
    \n这是一个提示用户输入某些内容的程序，当提供输入后，它会返回某些消息。这将测试我们的编程语言并观察其行为的最简单方法。该系统被称为 REPL，即读取-求值-打印循环。它是与编程语言交互的常用方式，你可能在\
    \ Python 等语言中用过。\n\n![](img/f0182de747835c07b2d15dd58f19.png)\n\n在构建完整的 REPL 之前，我们将从更简单的开始。我们将创建一个提示用户并回显其输入字符串的系统。我们可以扩展它来解析输入并进行求值，就像真正的\
    \ Lisp 程序一样。\n\n# 交互式提示符\n\n对于基础设置，我们想要写一个反复输出消息并等待某些输入的循环。为了获取输入，可以使用 `gets`\
    \ 函数，它可以读取输入直到换行。我们需要一个地方来存储这些用户输入。为了这一点，我们可以声明一个固定大小的缓冲区。\n\n```\n#include <stdio.h>\n\
    /* 声明一个大小为 2048 的输入缓冲区 */\nstatic char input[2048];\n\nint main(int argc, char**\
    \ argv) {\n    /* 打印版本信息 */\n    puts(\"Lisp Version 0.0.1\");\n    puts(\"Press\
    \ Ctrl+c to Exit\\n\");\n\n    /* 无限循环 */\n    while (1) {\n        /* 输出我们的提示符\
    \ */\n        fputs(\"lispy\", stdout);\n\n        /* 读取最大长度 2048 的用户输入 */\n \
    \       if (fgets(input, 2048, stdin) == NULL) {\n            break;\n       \
    \ }\n\n        /* 将输入回显给用户 */\n        printf(\"you're a %s\", input);\n    }\n\
    \    return 0;\n}\n```\n\n# 绿色的文本是什么？\n\n上面的代码包含了注释。这些是位于 `/* */` 符号之间的代码段，编译器会忽略它们，但它们用于告知阅读者正在发生什么！\n\
