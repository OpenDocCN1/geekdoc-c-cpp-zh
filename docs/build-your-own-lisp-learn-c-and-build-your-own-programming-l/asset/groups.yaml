  mdcn: "\n\n你可以说些：“一个句子必须是一个动词短语”，或者“一个动词短语可以是一个动词、副词和一个动词”。这种方法对人类来说很好，但对计算机来说太不精确。在编程时，我们需要对语法编写更正式的描述。\n\
