    # Variables • Chapter 11


    # Immutability


    In the previous chapters we''ve made considerable progress on the infrastructure
    of our language.

    Already we can do a number of cool things that other languages can''t, such as
    putting code inside lists. Now is the time to start adding in the features which
    will make our language practical. The first one of these is going to be variables.

    They''re called variables, but it''s a misleading name, because variables won''t
    vary. Our variables are immutable meaning they cannot change. Everything in our
    language so far acted as if it is immutable. When we evaluate an expression we
    have imagined the previous thing has been deleted and a new thing thrown. In implementation
    it is easier for us to reuse the data from the previous thing to build the new
    thing, but conceptually it is a good way to think about how language works.

    So actually variables are simply a way of naming values. They let us assign a
    name to a value, and then let us get a copy of that value later on when we need
    it.


    ![](img/f0182debe7478735c07b82d15dd58fde_87_0.png)


    To allow for naming variables we need to create a structure that stores the name
    and value of everything named in our program. We call this the environment. When
    we start a new interactive program we want to create a new environment to go along
    with it, in which each new bit of input is evaluated. We can then store and recall
    variables as we manage?


    > What happens when we re-assign a name to something new? Isn''t this like mutability?

    In Lisp, when we re-assign a name we''re going to delete the old association and
    create a new one. This gives the illusion that the thing assigned to that name
    has changed, and is mutable, but in fact we have deleted the old thing and assigned
    it a new thing. This is different from C where we really can change the data pointed
    to a pointer, or stored in a struct, without deleting and creating a new one.


    # Symbol Syntax


    Now we''re going to allow for user defined variables we need to update the grammar
    for symbols to be more flexible. Rather than just our builtin functions it'
  - '[PAGE 88]


    should match any possible valid symbol. Unlike in C, the name a variable can be
    given is fairly restrictive, we''re going to allow for all sorts of characters
    in the name of a variable.


    We can create a regular expression that expresses the range of characters available
    as follows.


    ```

    /[a-zA-Z0-9_\+\*|\\\\\\<>!&]+/

    ```


    On first glance looks like we''ve bashed our hands into keyboard. Actually it
    is a regular expression with a big range identifier [] Inside range specifiers
    special characters lose meaning, but some of these characters still need to be
    escaped with backslashes. Because this part of a C string we need to put two backslashes
    to represent a single character in the input.


    This rule limits symbols to the normal of the C identifiers a-zA-Z0-9_ the arithmetic
    operators .+\*|\\/; the backslash character \\\ the comparison operators <> or
    an ampersands &. This will give us all the flexibility needed for defining and
    extending symbols.


    ```

    mpca_lang(MPCA_LANG_DEFAULT,

    number : /-[0-9]*/

    symbol : /[a-zA-Z0-9_\+\*|\\\\\\<>!&]+/

    sexpr : ''<expr>''

    qexpr : ''<expr>''

    expr : ''|<symbol> | <expr>''

    lispy : ''/\/ <expr> \*/

    Number, Symbol, Sexpr, Qexpr, Expr, Lisp);

    ```


    # # Function Pointers


    Once we introduce variables, symbols will no longer represent functions in our
    language, but rather they will represent a name for us to look up into our environment
    and get new value from back.


    Therefore we need a new value to represent functions in our language, we can return
    one of the builtin symbols is encountered. To create this new type of lval we
    are going to use something called function pointer.


    Function pointers are a great feature of C that lets you store and pass around
    pointers to. It doesn''t make sense to edit the data pointed by these pointers.
    Instead we use them to call the function pointed to, as if it were a normal function.


    Like normal pointers, function pointers have some type associated with them. This
    type specifies the type of function pointed to, not the type of the data pointed
    to. This compiler works only if it has been called.


    In the previous chapter our builtin functions take a lval* as input and returned
    a lval* as output. In this chapter our builtin functions will take an extra pointer
    to the environment len* as input. We can declare a new function pointer type called
    builtin, for this type of function, like this.


    ```

    typedef lval*(*builtin)(lenv*, lval*);

    ```'
