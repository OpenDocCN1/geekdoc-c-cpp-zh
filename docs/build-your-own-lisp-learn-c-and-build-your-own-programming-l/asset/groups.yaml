    \ Some may take a few hundred lines of code, others a few thousand. The choice\
    \ of what to tackle is up to you. If you've become fond of your language you may\
    \ enjoy doing some of these projects.\n\n# Native Types\n\nCurrently our language\
    \ only wraps the native long and char types. This is pretty limiting if you want\
    \ to do any kind of useful computation. Our operations on these data types are\
    \ also pretty limited. Ideally our language should wrap all of the native C types\
    \ and allow for methods of manipulating them. One of the most important additions\
    \ would be the ability to manipulate decimal numbers. For this you could wrap\
