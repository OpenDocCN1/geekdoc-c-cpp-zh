    # Bonus Projects • Chapter 16


    # Only the Beginning


    Although we''ve done a lot with it Lisp, it is still some way off from a fully
    complete, production-strength programming language. If you tried to use it for
    any sufficiently large project there are a number of issues you would eventually
    run into and improvements you''ve had to make. Solving these problems would what
    bring it into the scope of a fullyfledged programming language.


    Here are some of these you would likely encounter, potential solutions to these
    problems, and some other fun ideas for other improvements. Some may take a few
    hundred lines of code, others a few thousand. The choice of what to tackle is
    up to you. If you''ve become fond of your language you may enjoy doing some of
    these projects.


    # Native Types


    Currently our language only wraps the native long and char types. This is pretty
    limiting if you want to do any kind of useful computation. Our operations on these
    data types are also pretty limited. Ideally our language should wrap all of the
    native C types and allow for methods of manipulating them. One of the most important
    additions would be the ability to manipulate decimal numbers. For this you could
    wrap the double type and relevant operations. With more than one number type we
    need to make sure the arithmetic operators such as + and - work on them all, and
    in combination.


    Adding support for native types should be interesting for people wishing to do
    computation with decimal and floating-point numbers in their language.


    # User Defined Types


    As well adding support for native types it would be good to give users the ability
    to add their own new types, just like we use structs in C. The syntax or method
    you use to do this would be up to you. This is a really essential part making
    our language usable for any reasonably sized project.


    This task may be interesting to anyone who has a specific idea of how they would
    like to develop the language, and what they want a final design to look like.


    # List Literal'
  - '[PAGE 189]


    Some lisps square brackets [] to give a literal notation for lists of evaluated
    values lists. This is syntactic sugar for writing something like `list 10 20 300`.
    It lets you write `(list 10 20 300)`. In some situations this is clearly nicer,
    but it uses the [] characters which could possibly be used for more interesting
    purposes.


    This should be a simple addition for people looking to try adding extra syntax.


    ![](img/f0182debe7478735c07b82d15dd58fde_189_0.png)


    # # Operating System Interaction


    An essential part of bootstrapping a language is to give it proper access to opening,
    reading, and writing lists. This means wrapping all C functions such as `read`,
    `write`, `fgets`, etc in Lisp equivalents. This is a fairly straightforward task,
    but requires quite a large number of wrapper functions. This is why we''ve not
    done it for our language so far.


    On a similar note it would be great to give our language access to whatever operating
    systems are appropriate. We should give it the ability to change directory, list
    files in a directory and that of thing. This is an easy task but again requires
    a lot of wrapping functions. It is essential for any practical use of this language
    as a scripting language.


    People who wish to use their language for simple scripting tasks and string manipulation
    may be interested in implementing this project.


    # # Macros


    Many other Lisps allow you to write things like `def x 100` to define the value
    `100`. In our lisp this wouldn''t work because it would attempt to evaluate the
    `x` value stored as `x` in the environment. In other Lisps these functions are
    called macros, and when they encountered the evaluation of their arguments, they
    can manipulate them un-evaluated. They let you write things that look like normal
    function calls, but actually do complex and interesting things.


    These are fun thing to have in a language. They make it so you can add a little
    bit of magic to some of the workings. In many cases this can make syntax nicer
    or allow a user to not repeat themselves.


    I like how our language handles things like `def` and `if` without resorting to
    macros, but if you dislike how it works, and want it to be more similar to conventional
    Lisps, this might be something you are interested in implementing.'
