    or being passed a number that is too large to be represented internally using
    a long. These can be enumerated as follows:


    ```

    /* Create Enumeration of Possible Error Types */

    enum { LERR_DIV_ZERO, LERR_BAD_OP, LERR_BAD_NUM };

    ```


