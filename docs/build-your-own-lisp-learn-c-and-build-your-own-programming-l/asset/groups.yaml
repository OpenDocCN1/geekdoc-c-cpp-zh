    references to it. One method to do this, called Mark and Sweep, is to monitor
    those values that are in the environment, as well as every value that has been
    allocated. When a variable is put into the environment it, and everything it references,
    is marked. Then, when we wish to free memory, we can then iterate over every allocation,
    and delete any that are not marked.


    This is called Garbage Collection and is an integral part of many programming
    languages. With pool allocation, implementing a Garbage Collector does not need
    to be complicated, but if you wish to make it efficient. Implementing this would
    be essential to making this language for working with large amounts of data. A
    particularly good tutorial on implementing a garbage collector in C can be found
    Here.


    This should interest anyone who is concerned with the language''s performance
    and wishes to change the semantics of how variables are stored and modified in
    the language.


    ## Tail Optimisation


    Our programming language uses recursion to do its looping. This is conceptually
    a clearer way to do it, but practically it is quite poor. Recursive functions
    call themselves to collect all the partial results of a computation, and then
    combine all the results together. This is a wasteful way of doing computation
    when partial results can be accumulated as total over a loop. This is particularly
    problematic for loops that are intended to run for many, or infinite, iterations.


    Some recursive functions can be automatically converted to corresponding loops,
    which accumulate step by step, rather than altogether. This automatic conversion
    is called tail optimisation and is an essential optimization for programs that
    do a lot of looping using recursion.


    People who are interested in compiler optimisations and the correspondences between
    different forms of computation might find this project interesting.


    ## Lexical Scoping


    Our language tries to lookup a variable that has been undefined it throws an error.
    It would be better if it could tell us which variables are undefined before evaluating
    the program. This would let us avoid typos and other annoying bugs. Finding these
    issues before the program is run is called lexical scoping, and uses the rules
    for variable definition to track and infer which variables are defined and which
    aren''t at each point in the program, without doing any evaluation.


    This could be a difficult task to get exactly right, but should be interesting
    to anyone who wants to make their programming language safer to use, and less
    bug-prone.


    ## Static Typing


    Every value in our program has an associated type with it. We know before any
    evaluation has taken place. Our builtin functions only take certain types as input.
    We be able to use this information to infer the types of new user defined functions
    and values. We can also use this information to check that functions are being
    called with the correct types before we run the program. This will reduce any
    errors from calling functions with incorrect types before evaluation. This is
    called static typing.


    ![](img/f0182debe7478735c07b82d15dd58fde_192_0.png)


    Type systems are really interesting and fundamental part of computer science.
    They are currently the best method we know of detecting errors before running
    a program. Anyone interesting in programming language safety and type systems
    should find this project really interesting.


    ## Conclusion


    Many thanks for reading this book. I hope you''ve found something of interest
    in its pages. If you did enjoy it tell your friends about it. If you are going
    to continue developing your language then best of luck and I hope you learn many
    more things about C, programming languages, and computer science.


    Most of all I hope you''ve had fun building your own Lisp. Until next time!


