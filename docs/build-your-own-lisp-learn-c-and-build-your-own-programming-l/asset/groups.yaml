    lval_del(err);\n```\n\n```c\n/* Cleanup and return error */\nreturn err;\n}\n\
    ```\n\n# Command Line Arguments\n\nWith the ability to load files, we can take\
    \ the chance to add in some functionality typical of other programming languages.\
    \ When file names are given as arguments the command line we can run these files.\
    \ For example one might write `filename.py`.\n\nThese command line arguments are\
