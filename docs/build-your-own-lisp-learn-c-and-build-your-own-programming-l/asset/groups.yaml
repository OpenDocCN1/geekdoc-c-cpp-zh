    \ separated by a space and then prints newline to finish.\n\n```c\nlval* builtin_print(lenv\
    \ e, lval* a) {\n\n    /* Print each argument followed by a space */\n    for\
    \ (int i = 0; i < a->count; i++) {\n        lval_print(a->cell[i]);\n    }\n \
    \   /* Print newline and delete arguments */\n    putchar('\\n');\n    lval_del(a);\n\
    \    return lval_lexpr();\n}\n```\n\n# Error Function\n\nWe can also use strings\
    \ to add an error reporting function. This can be as input string as error message\
    \ for `lval_err`.\n\n```c\nlval* builtin_error(lenv e, lval* a) {\n    ASSERT_NUM(\"\
    error\", a, 1);\n    ASSERT_TYPE(\"error\", 0, LVAL_STR);\n    /* Construct Error\
    \ from first argument */\n    lval* err = lval_err(a->cell[0]->str);\n    /* Delete\
    \ arguments and return */\n    lval_del(a);\n    return err;\n}\n```\n\nThe final\
    \ step is to register these as builtins. Now finally we can start building up\
    \ libraries and writing them to files.\n\n```\n/* Functions */\nlenv_add_builtin(e,\
    \ \"load\", builtin_load);\nlenv_add_builtin(e, \"error\", builtin_error);\nlenv_add_builtin(e,\
    \ \"print\", builtin_print);\n```\n\n```\nlisp \"Hello World!\"\n\"Hello World!\"\
    \n()\nlisp error \"This is an error\"\nError: This is an error\nlisp> load hello.lisp\n\
    \"Hello World!\"\n()\nlisp>>\n```\n\n# Finishing Up\n\nThis is the last chapter\
