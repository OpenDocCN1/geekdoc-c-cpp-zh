    # What is that text in light green?


    The above code contains contents. These are sections of the code between /* *
    symbols, which are ignored by the compiler, but are used to inform the person
    reading what is going on of them!


    Let''s go over this in a little more depth.


    The line static char input[2048]; declares a global array of 2048 characters.
    This is a reserved buffer of data that we can access from any part of our program.
    In it are going to store the user input which is typed into the command line.
    The static keyword makes this variable local to this file, and the [2048] section
    declares the size.


    We write an infinite loop using while (1). In a conditional block i always evaluates
    to true. Therefore contents inside this loop will run forever.


    To output our we use the function puts. This is a slight variation of which does
    not append a newline character. We use the gets for getting user input from the
    command line. Each of these functions require some file to write to or from. For
    this we supply the special variables stdin and stdout. These are declared in <stdio.h>
    and are special files representing input to, and output from, the command line.
    When passed this variable the gets function will wait for a user to input a line,
    and when it will store it into the input buffer, including the newline. So that
    gets does not read too much data we must also supply the buffer 2048.


    To echo the message back to the user we use the function printf. This is a function
    that provides a way of printing messages consisting of several elements. It matches
    arguments to the given string. For example case we can see the %s pattern in the
    given string. This means that it will be replaced by whatever argument is passed
    in next, interpreted as a string.


    For information on these different patterns please see the documentation on printf.


    # How I want to know about functions gets and printf ?


    It''s immediately obvious how to know about these standard functions, and when
    and to use them. When faced with a problem it takes experience to know when it
    has been solved for you by library functions.


    Luckily C has a very small standard library and all of it can be learnt in practice.
    If you want to do something that seems quite basic, or fundamental, it is worth
    looking at the reference documentation for the standard library and checking if
    there are any functions included that do what you want.'
