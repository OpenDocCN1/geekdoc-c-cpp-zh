    \ \"build\"。\n- 短语（Phrase）是一个形容词后跟一个名词。\n- 狗（Dog）是零或多个短语。\n\n我们可以从定义形容词和名词开始。为了做到这一点，我们创建了两个新的解析器，用类型\
