- md: "\nI attempted to research why Lisps use ; for comments, but it appears that\
    \ the origins of these have been lost in the mists of time. I imagine it as a\
    \ small rebellion against the imperative languages as C and Java which use semicolons\
    \ shamelessly and frequently to separate statements. To Lisp all these languages\
    \ are just comments.\n\nSo in lisp a comment is defined by a semicolon ; followed\
    \ by any number of characters that are not newline characters represented by \\\
    r or \\n. We can use regex to define it.\n\n```\ncomment : \"/;([^([^\\\\\\\\\
    r\\\\n])\\*\\*/\";\n```\n\nAs with strings we need to create a new parser and\
    \ use this to update our language in mpc_lang. We also need to remember that the\
    \ parser to mpc_cleanup, and update the first argument to reflect the number of\
    \ parsers passed in.\n\nOur final grammar looks like this:\n\n```\nmpca_lang(MPCA_LANG_DEFAULT,\
    \ \n number : /?([0-9]+)/;\n symbol : /\\'([A-zA-Z0-9_]+|\\\\\\\\\\\\\\\\\\\\\
    |<>!])\\+/;\n string : /\\'([^\\\\\\\\r\\\\n])*\\'/;\n sexpr : /\\'<expr>\\'/;\n\
    \ qexpr : /\\'<number>|<symbol>|<string>/;\n expr : /\\'<comment>|<sexpr>|<expr>/;\n\
    \ lisp : /\\'<expr>\\*\\*/;\n ',', Number, String, Comment, Sexpr, Qexpr, Expr,\
    \ Lispy));\n```\n\nAnd the cleanup function looks like this:\n\n```\nmpc_cleanup(0,\n\
    \ Number, String, String, comment,\n Sexpr, Qexpr, Expr, Lispy);\n```\n\nBecause\
    \ comments are only for programmers reading the code, our internal function for\
    \ reading them in just consists of ignoring them. We can add a clause to deal\
    \ with this in brackets and parenthesis in lval_read.\n\n```\nif (strstr(t->children[i]->tag,\
    \ \"comment\")) { continue; }\n```\n\nComments won't be of much use on the interactive\
    \ prompt, but they will be very helpful for adding files of code to annotate them.\n\
