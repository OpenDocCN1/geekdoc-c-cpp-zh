    # Currying


    At the moment functions like + take

    a variable number of arguments. In

    some situations that''s great, but what

    if we had a list of arguments we

    wished to pass to it. In this situation it

    is rendered somewhat useless.


    Again we can try to create a function

    to solve this problem. If we can create

    a list in the format we use for

    our expression we can use eval to

    treat it as such. In the situation of + we could append this function to the front
    of

    list and then perform the evaluation.


    ![](img/f0182debe7478735c07b82d15dd58fde_121_0.png)


    We define a function unpack- that does. It takes as input some function and

    s list and appends the function to the front of the list, before evaluating it.


    ```

    fun unpack f xs (eval (list f xs))

    ```


    In some situations we might be faced with the opposite dilemma. We may have a

    function that takes input some list, but we wish to call it using variable arguments.

    In this case the solution is even simpler. We use the fact that & syntax for

    variable arguments packs up variable arguments into a list for us.


    ```

    fun pack f & xs (f xs)

    ```


    In languages Curry is called currying and respectively. This is named

    a Haskell Curry but unfortunately has nothing to do with our favourite spicy food.


    ```

    lispy> def (curry) pack

    ()

    lpy> def (curry) unpack

    ()

    lpy> curry + 5 6 7

    18

    lpy> uncurry head 5 6 7

    {5}

