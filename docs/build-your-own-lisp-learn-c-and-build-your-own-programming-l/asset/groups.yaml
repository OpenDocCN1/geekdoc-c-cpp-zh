    # Don''t Lisp use Cons?

    Other Lisps have a slightly different definition of what an S-Expression is. In
    most other Lisps S-Expressions are defined inductively as either an atom such
    as a symbol of number, or two other S-Expressions joined, or cons, together.

    Naturally leads to an implementation using linked lists, a different data structure
    to the one we are using. Choosing to represent S-Expressions as a variable array
    in this book for the purposes of simplicity, but it is important to be aware that
    the official definition, and typical implementation are both subtly different.


