  - "[PAGE 78]\n\ncode.\n\nMacros work by taking some arguments (which can be almost\
    \ anything), Macros are copying and pasting them into some pattern. By changing\
    \ the pattern or the arguments we can alter what code is generated by the Macro.\
    \ To define macros we use #define preprocessor directive. After this we write\
    \ the name of the macro, followed by the argument names in parenthesis. After\
    \ this pattern is specified, we declare what code is generated for our error conditions.\n\
    \nWe can design a macro to help with our error conditions called LASSERT . Macros\
    \ are typically given in capitals to help distinguish them from normal C functions.\
    \ This macro takes in three arguments args, cond and err. Then it generates code\
    \ as shown on the right hand side, but with these values pasted in the locations\
    \ where they are. This pattern is a good fit for all of our error conditions.\n\
    \n```\n#define LASSERT(args, cond, err)\nif ((cond)) { lval_del(err);\n```\n\n\
    We can use this to change how our functions are written, without changing what\
    \ code is generated by the compiler. This makes it much easier to read for the\
