    \ to make sure the arithmetic operators such as + and - work on them all, and\
    \ in combination.\n\nAdding support for native types should be interesting for\
    \ people wishing to do computation with decimal and floating-point numbers in\
    \ their language.\n\n# User Defined Types\n\nAs well adding support for native\
    \ types it would be good to give users the ability to add their own new types,\
    \ just like we use structs in C. The syntax or method you use to do this would\
    \ be up to you. This is a really essential part making our language usable for\
    \ any reasonably sized project.\n\nThis task may be interesting to anyone who\
    \ has a specific idea of how they would like to develop the language, and what\
    \ they want a final design to look like.\n\n# List Literal\n\nSome lisps square\
    \ brackets [] to give a literal notation for lists of evaluated values lists.\
    \ This is syntactic sugar for writing something like `list 10 20 300`. It lets\
    \ you write `(list 10 20 300)`. In some situations this is clearly nicer, but\
    \ it uses the [] characters which could possibly be used for more interesting\
    \ purposes.\n\nThis should be a simple addition for people looking to try adding\
    \ extra syntax.\n\n![](img/f0182debe7478735c07b82d15dd58fde_189_0.png)\n\n# Operating\
    \ System Interaction\n\nAn essential part of bootstrapping a language is to give\
    \ it proper access to opening, reading, and writing lists. This means wrapping\
    \ all C functions such as `read`, `write`, `fgets`, etc in Lisp equivalents. This\
    \ is a fairly straightforward task, but requires quite a large number of wrapper\
    \ functions. This is why we've not done it for our language so far.\n\nOn a similar\
    \ note it would be great to give our language access to whatever operating systems\
    \ are appropriate. We should give it the ability to change directory, list files\
    \ in a directory and that of thing. This is an easy task but again requires a\
    \ lot of wrapping functions. It is essential for any practical use of this language\
    \ as a scripting language.\n\nPeople who wish to use their language for simple\
    \ scripting tasks and string manipulation may be interested in implementing this\
    \ project.\n\n# Macros\n\nMany other Lisps allow you to write things like `def\
    \ x 100` to define the value `100`. In our lisp this wouldn't work because it\
    \ would attempt to evaluate the `x` value stored as `x` in the environment. In\
    \ other Lisps these functions are called macros, and when they encountered the\
    \ evaluation of their arguments, they can manipulate them un-evaluated. They let\
    \ you write things that look like normal function calls, but actually do complex\
    \ and interesting things.\n\nThese are fun thing to have in a language. They make\
    \ it so you can add a little bit of magic to some of the workings. In many cases\
    \ this can make syntax nicer or allow a user to not repeat themselves.\n\nI like\
    \ how it works, but if you dislike how it works and want it to be more to Lisps,\
    \ this might be something you are interested in implementing.\n\n# Hashtable\n\
    \nAt the moment when we lookup variable names in our language we just do a linear\
    \ search over all the variables. This gets more and inefficient the more variables\
    \ we have.\n\nA more efficient way to do this is to implement a Hash Table. This\
    \ technique converts the variable name to an integer and uses this to index into\
    \ an array of known size to find the value associated with symbol. This is a really\
    \ important data structure in programming and will crop up everywhere because\
    \ of its fantastic performance.\n\nAnyone who is interested in learning more about\
    \ data structures and algorithms would be smart to take a shot at implementing\
    \ this.\n\n# Pool Allocation\n\nOur Lisp is very simple, it is not Ruby. Its performance\
    \ is relative to scripting languages. Most of the performance overhead in our\
    \ program comes from the fact that doing anything requires us to construct and\
    \ destroy `malloc` very often. This is a slow function as it requires the operating\
    \ system to do management for us. When doing calculations there is lots of overhead\
    \ we need to lower the number of calls to `malloc`.\n\nOne method to do this is\
    \ to call `malloc` once at the beginning of the program, allocating a large pool\
    \ of memory, and then replace all `malloc` calls to some function that slices\
    \ and dices up this memory for use in the program. This means that we are emulating\
    \ some of the behaviour of the operating system, but in a faster way. This idea\
    \ is called pool allocation and is a common technique used in game development,\
    \ and other performance sensitive applications.\n\nThis can be tricky to implement\
    \ correctly, but conceptually does not need to be complex. If you want a quick\
    \ method for getting gains in performance, looking into this interest you.\n\n\
    # Garbage Collection\n\nAlmost all other implementations of Lisps assign variables\
    \ differently to ours. They do not store a copy of a value in the environment,\
    \ actually a pointer, or reference, to it directly. Because pointers are used,\
    \ rather than copies, just like in C, there is much less overhead when using large\
    \ data structures.\n\nIf we store pointers to values, rather than copies, we need\
    \ to ensure that the data points to is not deleted we other value try to use of\
    \ it. We want to deleted it before some other value there are no longer any\n"
