    # Introduction • Chapter 1


    ## About


    In this book you''ll learn the C programming language and at the same time learn
    how to build your very own programming language, a minimal Lisp, in under 1000
    lines of code! We''ll be using a library to do some of the initial work, so I''m
    cheating on the line count, but the rest of the code will be completely original,
    and you''ll really create a powerful Lisp by the end.


    This book is inspired by other tutorials which go through the steps of building
    a programming language from scratch. I wrote this book to show that this kind
    of fun creative project is a great way to learn a language, and not limited to
    abstract high-level programmers.


    Many people are keen to learn C, but have nowhere to start. Now there is no excuse.
    If you follow this book I can promise that, in the worst case, you''ll get a cool
    new programming language to play with, and hopefully you''ll become an experienced
    C programmer!


    ## Who is this for


    This book is for anyone wanting to learn C, or who has once wondered how to build
    their own programming language. This book is not suitable as a first programming
    language book, but anyone with some minimal programming experience, in any language,
    should find something new and interesting inside.


    I tried to make this book as friendly as possible to beginners. I welcome beginners
    the most because they have so much to discover! But beginners may be covering
    many new concepts, and essentially learning two new programming languages at once.


    ![](img/f0182debe7478735c07b82d15dd58fde_5_0.png)


    If you look for help you may find people are not patient with you. You may find
    that, rather than take the time to express how much they know about the subject,
    experienced programmers might tell you that you are wrong. You should stop now,
    rather than inflict your bad code on you.


    > Ada Lovelace • Your typical programmer.


    After a couple of engagements like this you may decide that you are not a programmer,
    or don''t really like programming, or that you just don''t get it. You may have
    thought that you once enjoyed the idea of building your own programming language,
    but now you have realised that it is too abstract and you don''t care any more.
    You are now concerned with your-


    ## How learn C


    There is no way around the fact that C is a difficult language. In this book I
    am not going to cover in detail things like the syntax, or how to write loops.
    I will, on the other hand, show you how to build. I cannot guarantee that this
    book will make you a confident user. What I can promise, is those 1000 lines of
    code are going to be packed with content - and will learn something worthwhile.


    This book consists of 16 chapters. How you complete this is up to you. It may
    well be possible to blast through this over a weekend, or to take it more slowly
    and a chapter or two over a week. It shouldn''t take very long to complete, and
    will hopefully leave you with a taste for developing.


    ## Why build a Lisp


    The language we are going to be building in this book is a Lisp. This is a family
    of programming languages generalised by the fact that all computation is represented
    by lists. This may sound scarier than it is. Lisps are actually very easy, distinctive,
    and powerful languages.


    Building a Lisp is a great project for many reasons. It puts you in the shoes
    of language designers, and gives you an appreciation for the whole process of
    programming, from language all the way down to machine. It teaches you about functional
    programming, and novel ways to view computation. It''s simply not possible to
    comprehend the creativity and cleverness that goes into programming and computer
    science until you explore languages themselves.


    The type of Lisp we''ll be building is one I''ve invented for the purposes of
    this book. I''ve designed it for minimalism, simplicity and clarity, and I become
    quite fond of it along the way. I hope you come to it too.

