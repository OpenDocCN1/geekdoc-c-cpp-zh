    # # How to learn C


    There is no way around the fact that C is a difficult language. It has many concepts
    that are unfamiliar, and it makes no attempts to help a new user. In this book
    I am not going to cover in detail things like the syntax of the language, or how
    to write loops and conditional statements.


    I will, on the other hand, show you how to build a real world program in C. This
    approach is much more difficult for the reader, but will teach you implicit things
    a traditional approach cannot. I cannot guarantee that this book will make you
    a confident user of C. What I can promise, is that those 1000 lines of code are
    going to be packed with content - and you will learn something worthwhile.


    This book consists of 16 chapters. How you complete this is up to you. It may
    well be possible to blast through this book over a weekend, or to take it more
    slowly and a chapter or two evening over a week. It shouldn''t take very long
    to complete, and will hopefully leave you with a taste for developing your language.


    # # Why build a Lisp


    The language we are going to be building in this book is a Lisp. This is a family
    of programming languages generalised by the fact that all their computation is
    represented by lists. This may sound scarier than it is. Lisps are actually very
    easy, distinctive, and powerful languages.


    Building a Lisp is a great project for many reasons. It puts you in the shoes
    of language designers, and gives you an appreciation for the whole process of
    programming, from language all the way down to machine. It teaches you about functional
    programming, and novel ways to view computation. The final product you are rewarded
    with provides a template for thoughts and developments, giving you a starting
    ground for new things. It''s simply not possible to comprehend the creativity
    and cleverness that goes into programming and computer science until you explore
    languages themselves.


    ![](img/f0182debe7478735c07b82d15dd58fde_7_0.png)


    The type of Lisp we''ll be building is one I''ve invented for the purposes of
    this book. I''ve designed it for minimalism, simplicity and clarity, and I become
    quite fond of it along the way. I hope you come to it too. Conceptually, syntactically,
    and in implementation, this Lisp has many differences to other major brands of
    Lisp. So much so I''m sure I will be getting e-mails from Lisp programmers telling
    me it isn''t a Lisp because it doesn''t do/have/look-like this or that.


    I''ve made this Lisp different to confuse beginners. I''ve made it different because
    different is good.'
- md: "\nIf you are looking to learn about the semantics and behaviours of conventional\
    \ Lisps, and how to program, this book may not be for you. What this book offers\
    \ instead is new and unique concepts, self-expression, creativity, and fun. Whatever\
    \ your motivation, heed this disclaimer now. Not everything I say will be objectively\
    \ correct or true! You will have to decide for yourselves.\n\n# Your own Lisp\n\
    \nThe best way to follow this book is to, as the title says, write your own Lisp.\
    \ If you are feeling confident enough I want you to add your own features, modifications\
    \ and changes. Your Lisp should suit you and your own philosophy. Throughout the\
    \ book I'll be giving description and insight, but with it'll be providing a lot\
    \ of code. This will make it easy to follow by copy and pasting each section into\
    \ your program without really understanding. Please do not this!\n\nType out each\
    \ piece of sample code you type. This is called The Hard Way. Not because it is\
    \ hard technically, but because it requires discipline. By doing things The Hard\
    \ Way you will come to understand the reasoning behind what you are typing. Ideally\
    \ things will click as you follow it along character by character. When reading\
    \ you may have an intuition as to why it looks right, or what may be going on,\
    \ but this will not always translate to a real understanding unless you do the\
    \ writing yourself!\n\nIn a perfect world you would use my code as a reference\
    \ - instruction booklet and guide to building the programming language you always\
    \ dreamed of. In reality this isn't practical or viable. But the base philosophy\
    \ remains. If you want to change something, do it.\n\n# Installation • Chapter\
    \ 2\n\n# Setup\n\nBefore we can start programming in C we'll need to install a\
    \ couple of things, and set up our environment so that we have everything we need.\
    \ Because C is such a universal language this should hopefully be fairly simple.\
    \ Essentially we need to install two main things. A text editor and a compiler.\n\
    \n![](img/f0182debe7478735c07b82d15dd58fde_9_0.png)\n\nA text editor is a program\
    \ that allows you to edit files in a way suitable for programming.\n\nOn **Linux**\
    \ the text editor I recommend is edit. Whatever other basic text editor installed\
    \ with your distribution will also work well if you are a Vim or Emacs user these\
    \ are fine to use. Please don't use an IDE. It's not required for a small project\
    \ and won't help in understanding what is going on.\n\nOn **Mac** a simple text\
    \ editor that can be used is TextWrangler. If you have a different preference\
    \ this is fine, but please don't use Xcode for editing. This is a simple project\
    \ and using an IDE you won't understand what is going on.\n\nOn **Windows** my\
    \ text editor of choice is Notepad++. If you have another preference this is fine.\
    \ Please don't use Visual Studio as it does not have support for C programming.\
    \ If you attempt to use it you will run into many problems.\n\n# Compiler\n\n\
    The compiler is a program that transforms the C source code into a program your\
    \ computer can run. The installation process for these is different depending\
    \ on what operating system you are running.\n\nCompiling and running C programs\
    \ is also going to require really basic usage of the command line. This will not\
    \ cover, so I am going to assume you have at least some familiarity with using\
    \ the command line. If you are worried about this then search for online tutorials\
    \ on using it, relevant to your operating system.\n\nOn **Linux** you can install\
    \ a compiler by downloading some packages. If you are running Ubuntu or Debian\
    \ you can install everything you need with the following command sudo apt-get\
    \ install build-essential . If you are running Fedora or a similar Linux variant\
    \ you can use this command su -c \"yum groupinstall development-tools\".\n\nOn\
    \ Mac you can install a compiler by downloading and installing the latest version\
    \ of Xcode from Apple. If you are unsure of how to do this you can search for\
    \ \"installing xcode\" and follow any advice. You will then need to install the\
    \ Command Line Tools. On Mac OS X 10.9 this can be done by running the command\
    \ xcodeselect --install from command line. On versions of Mac OS prior to 10.9\
    \ this can be done by going to Xcode Preferences, Downloads, and selecting Command\
    \ Line Tools for Installation.\n\nOn Windows you can install a compiler by downloading\
    \ and installing MinGW. You will use the installer at some point it may present\
    \ you with a list of possible packages. Make sure you pick at least ming2-base\
    \ Once installed you need to add the compiler and other programs to your system\
    \ PATH variable. To do follow these instructions adding the value ;C%bin to the\
    \ variable called PATH . You can create this variable if it doesn't exist. You\
    \ may need to restart cmd.exe for the changes to take effect. This will allow\
    \ you to run a compiler from the command line cmd.exe . It will also install other\
    \ programs that make cmd.exe act like a Unix command.\n\n# Testing the Compiler\n\
    \nTo test if your C compiler is installed correctly type the following into the\
    \ command line.\n\n```\ncc --version\n```\n\nIf you get some information about\
    \ the compiler version echoed back then it should be installed correctly. You\
    \ are ready to go! If you get any sort of error message about an unrecognised\
    \ or not found command, then it is not ready. You may need to restart the command\
    \ line or your compiler for changes to take effect.\n\n# Hello World\n\nNow that\
    \ your environment is set, start by using your text editor and inputting the program.\
    \ Create a directory where you are going to put your work for this book and save\
    \ this file as hello.world.c. This is your first C program.\n\n```c\n#include\
    \ <stdio.h>\n\nint main(int argc, char** argv) {\n    puts(\"Hello, world!\");\n\
    \    return 0;\n}\n```\n\nThis may initially make very little sense. What is called\
    \ a header. The first line we include this statement allows us to use the functions\
    \ from stdio.h, the standard input and output library Next we declare a function\
    \ called main. This function is declared to output an int, and as input int argc\
    \ and char** argv. All C programs must contain this function. All programs start\
    \ running from this function.\n\nInside the main function is called with the argument\
    \ \"Hello, world!\". This outputs the message Hello, world! to the command line.\
    \ The function puts is short for string. The second statement inside the function\
    \ is return 0. This tells the main function to finish and return 0. When a C program\
    \ returns 0 this indicates have no errors running the program.\n\n# Compilation\n\
    \nBefore we can run this program we need to compile it. This will produce the\
    \ actual executable we can run. Open the command line and browse to the directory\
    \ that hello.world.c is saved in. You can then compile your program using the\
    \ following command.\n\n```\ncc -std99 -Wall hello_world.c -o hello_world\n```\n\
    \nThis compiles the code in hello.world.c reporting any warnings and outputs the\
    \ program to a new file called hello_world. Use the -std99 flag to tell the compiler\
    \ which version or standard of C we are programming. This lets the compiler ensure\
    \ our code is standardized so people with different operating systems or compilers\
    \ will be able to use our code. If successful you should see the output file in\
    \ the current directory. This can be run by typing ./hello_world (or just hello_world\
    \ on Windows). Everything is correct you should see a friendly hello, world! message\
    \ appear.\n\nCongratulations!You've compiled and run your first C program.\n\n\
    # Errors\n\nIf there are some problems with your C program the compilation process\
    \ may fail. These issues can range from simple syntax errors, to other complicated\
    \ problems that are harder to understand. Sometimes the error message from the\
    \ compiler will make sense, but if you are having trouble it by searching online\
    \ for it. You should see if you can find a concise explanation of what it means,\
    \ and work out how to correct it. Remember this: there are many people before\
    \ you have struggled with exactly the same problems.\n\nSometimes there will be\
    \ many compiler errors stemming from one source. Always go through compiler errors\
    \ from first to last.\n\nSometimes the compiler will compile a program, but when\
    \ you run it it will crash. Debugging programs in this situation is hard.\n"
  mdcn: "\n\n如果你想学习传统 Lisp 的语义和行为，以及如何进行编程，这本书可能并不适合你。相反，这本书提供的是新颖独特的概念、自我表达、创造力和乐趣。无论你的动力是什么，请现在注意此免责声明：我所说的一切并不总在客观上都是正确或真实的！你必须自己做决定。\n\
    \n# 你自己的 Lisp\n\n遵循这本书的最佳方法是如标题所示，编写你自己的 Lisp。如果你觉得有足够的信心，我希望你添加自己的功能、修改和更改。你的\
    \ Lisp 应该适合你以及你自己的哲学。在整书中，我将提供描述和见解，但也会提供大量的代码。这使得人们很容易通过将每个部分复制粘贴到你的程序中而不需要真正理解它来跟进。请不要这样做！\n\
    \n手动输入你所输入的每一段示例代码。这被称为“硬方法”（The Hard Way）。这并不是因为它在技术上很困难，而是因为需要自律。通过用“硬方法”办事，你将理解你所输入的内容背后的逻辑。理想情况下，当你一个字符一个字符地跟随时，一切都会豁然开朗。在阅读时，你可能直觉地知道为什么它看起来是正确的，或者正在发生什么，除非你亲手编写，否则这不会总是转化为真正的理解！\n\
    \n在一个完美的世界里，你会将我的代码作为参考——构建你一直梦想的编程语言的说明书和指南。在现实中，这并不实际或可行。但基本哲学仍然。如果你想改变某些东西，尽管去做。\n\
    \n# 安装 • 第2章\n\n# 设置\n\n在我们开始用 C 编程之前，我们需要安装一些东西，并设置我们的环境，以便我们拥有所需的一切。因为 C 是一种非常通用的语言，所以这应该相当简单。基本上，我们需要安装两个主要东西：一个文本编辑器和一个编译器。\n\
    \n![](img/f0182debe7478735c07b82d15dd58fde_9_0.png)\n\n文本编辑器是一种允许你以适合编程的方式编辑文件的程序。\n\
    \n在 **Linux** 上，我推荐的文本编辑器是 edit。你的发行版自带的任何其他基础文本编辑器也能良好工作，如果你是 Vim 或 Emacs 用户，使用它们也可以。请不要使用\
    \ IDE。对于小型项目来说，这不是必需的，而且无益于理解发生了什么。\n\n在 **Mac** 上，可以使用的简单文本编辑器是 TextWrangler。如果你有不同的偏好也可以的，但请不要使用\
    \ Xcode 进行编辑。这是一个简单的项目，使用 IDE 的话你不会理解发生了什么。\n\n在 **Windows** 上，我首选的文本编辑器是 Notepad++。如果你有其他偏好也可以。请不要使用\
    \ Visual Studio，因为它不支持 C 语言编程。如果你尝试使用它，将会遇到很多问题。\n\n# 编译器\n\n编译器是将 C 源代码转换为你的计算机可以运行的程序。这些编译器的安装过程取决于你运行的操作系统。\n\
    \n编译和运行 C 程序还需要非常基本的命令行用法。这部分不会涵盖，所以我假设你至少熟悉如何使用命令行。如果你担心这一点，请搜索与你操作系统的在线使用教程。\n\
    \n在 **Linux** 上，你可以通过下载一些包来安装编译器。如果你运行 Ubuntu 或 Debian，可以使用以下命令 `sudo apt-get\
    \ install build-essential` 安装你需要的所有内容。如果你运行 Fedora 或类似的 Linux 变体，可以使用此命令 `su -c\
    \ \"yum groupinstall development-tools\"`。\n\n在 Mac 上，你可以通过下载并安装 Apple 的最新版本 Xcode\
    \ 来安装编译器。如果你不确定如何操作，可以搜索“installing xcode”并遵循任何建议。你将需要安装命令行工具（Command Line Tools）。在\
    \ Mac OS X 10.9 上，可以通过从命令行运行命令 `codeselect --install` 完成。在 10.9 之前的 Mac OS 版本中，可以通过\
    \ Xcode Preferences -> Downloads 并选择 Command Line Tools for Installation 来完成。\n\
    \n在 Windows 上，你可以通过下载并安装 MinGW 来安装编译器。你将在某个时刻使用安装程序，它可能会向你展示一个可能的包列表。确保你至少选择了\
    \ `mingw2-base`。安装完成后，你需要将编译器和其他程序添加到系统的 PATH 变量中。请按照以下指令操作：将值 `;C%bin` 添加到名为\
    \ PATH 的变量中。如果该变量不存在，你可以创建它。你可能需要重启 cmd.exe 以使更改生效。这将允许你从命令行 cmd.exe 运行编译器。它还会安装其他让\
    \ cmd.exe 变得像 Unix 命令的程序。\n\n# 测试编译器\n\n要测试你的 C 编译器是否安装正确，请在命令行中输入以下内容。\n\n```\n\
    cc --version\n```\n\n如果你看到返回了关于编译器版本的信息，那么它应该安装正确了。你准备好了！如果你收到任何关于未识别或未找到命令的错误消息，那么它还没有就绪。你可能需要重启命令行或你的编译器使更改生效。\n\
    \n# Hello World\n\n现在环境已经设置好，从使用你的文本编辑器并输入程序开始。创建一个你将存放这本书作品的目录，并将此文件保存为 `hello.world.c`。这是你的第一个\
    \ C 程序。\n\n```c\n#include <stdio.h>\n\nint main(int argc, char** argv) {\n   \
    \ puts(\"Hello, world!\");\n    return 0;\n}\n```\n\n起初看起来可能没什么意义。什么是所谓的“头文件”（header）。我们包含的第一行此语句允许我们使用来自\
    \ `stdio.h` 的函数，即标准输入输出库。接下来，我们声明了一个名为 `main` 的函数。该函数被声明输出一个 `int`，并带有输入 `int\
    \ argc` 和 `char** argv`。所有的 C 程序必须包含这个函数。所有程序都从这个函数开始运行。\n\n`main` 函数内部带有参数 `\"\
    Hello, world!\"` 调用。这会在命令行输出消息 `Hello, world!`。`puts` 函数是 string（字符串）的缩写。函数内部的第二个语句是\
    \ `return 0`。这告诉 `main` 函数结束并返回 0。当 C 程序返回 0 时，表示程序运行没有错误。\n\n# 编译\n\n在我们运行此程序之前，我们需要编译它。这将产生一个我们可以运行的实际可执行文件。打开命令行并浏览到\
    \ `hello.world.c` 所在的目录。然后你可以使用以下命令编译你的程序。\n\n```\ncc -std99 -Wall hello_world.c\
    \ -o hello_world\n```\n\n这会编译 `hello.world.c` 中的代码，报告任何警告，并将程序输出到一个名为 `hello_world`\
    \ 的新文件中。使用 `-std99` 标志告诉编译器我们正在编写的 C 版本或标准。这让编译器确保我们的代码是标准的，使得拥有不同操作系统或编译器的人能够使用我们的代码。如果成功，你应该会在当前目录下看到输出文件。可以通过输入\
    \ `./hello_world`（Windows 上只需输入 `hello_world`）来运行。如果一切正常，你应该看到一个友好的 `hello, world!`\
    \ 消息出现。\n\n恭喜！你编译并运行了你的第一个 C 程序。\n\n# 错误\n\n如果你的 C 程序出现某些问题，编译过程可能会失败。这些问题从简单的语法错误到更难理解的复杂问题不等。有时编译器的错误信息是有意义的，但如果你遇到困难，可以在网上搜索它。你应该看看是否能找到关于其含义的简洁解释，并想出如何纠正它。记住：在你之前有很多人曾与完全相同的问题苦扎。\n\
    \n有时会有许多编译错误源于同一个地方。务必从第一个到最后一个检查编译错误。\n\n有时编译器会编译程序，但当你运行它时它会崩溃。在这种情况下调试程序是困难的。\n\
    \n"
