    \n    long num;\n    char* err;\n    char* type;\n    lbuiltin fun;\n\n    int\
    \ count;\n    lval** cell;\n};\n```\n\n## Function Type\n\nAs we've added a new\
    \ possible lval type with the enumeration LVAL_FUN . We should update all our\
    \ relevant functions that work on lvals to deal directly with this update. In\
    \ most cases this means inserting new cases into switch statements.\n\nWe can\
    \ start by making a new constructor function for this type.\n\n```c\nlval* lval_fun(builtin\
    \ func) {\n    lval* v = malloc(sizeof(lval));\n    v->type = LVAL_FUN;\n    v->fun\
    \ = func;\n    return v;\n}\n```\n\nOn **deletion** we don't need to do anything\
    \ special for function pointers.\n\n```c\ncase LVAL_FUN: break;\n```\n\nOn **printing**\
    \ we can just print out nominal string.\n\n```c\ncase LVAL_FUN: printf(\"<function>*\"\
    ); break;\n```\n\nWe're also going to add a new function for **copying** an lval.\
    \ This is going to come in useful when we put things in, and takes things out\
    \ of, the environment. For numbers and functions we can just copy the relevant\
    \ fields directly. For strings we need to copy malloc and strcpy. To lists we\
    \ need to allocate the correct amount of space and copy each element individually.\n\
    \n```c\nlval* lval_copy(lval* v) {\n    lval* x = malloc(sizeof(lval));\n    x->type\
    \ = v->type;\n\n    switch (v->type) {\n        /* Functions and Numbers Direct's\
    \ Directly */\n        case LVAL_FUN: x->fun = v->fun; break;\n        case LVAL_NUM:\
    \ x->num = v->num; break;\n\n        /* Strings using malloc and strcpy */\n \
    \       case LVAL_ERR:\n            x->err = malloc(strlen(v->err) + 1);\n   \
    \         strcpy(x->err, v->err); break;\n\n        case LVAL_SYM:\n         \
    \   x->sym = malloc(strlen(v->sym) + 1);\n            strcpy(x->sym, v->sym);\
    \ break;\n\n        /* Copy Lists by copying each sub-expression */\n        case\
    \ LVAL_QEXPR:\n            x->count = v->count;\n            x->cell = malloc(sizeof(lval*)\
    \ * x->count);\n            for (int i = 0; i < x->count; i++) {\n           \
    \     x->cell[i] = lval_copy(v->cell[i]);\n            }\n            break;\n\
    \    }\n\n    return x;\n}\n```\n\n## Environment\n\nOur environment structure\
    \ must encode a list of relationships between names and values. There are many\
    \ ways to build a structure that can do this sort of thing. We are going to go\
    \ for the simplest method that works well. This is to use two lists of each length.\
    \ One is a list of lval*, and the other is a list of char*. Each entry in one\
    \ list has a corresponding entry in the other list at the same position.\n\nWe've\
    \ already declared our `lenv` struct, so we can define it as follows:\n\n```c\n\
    struct lenv {\n    int count;\n    char** syms;\n    lval** vals;\n};\n```\n\n\
    We need some functions to create and delete this structure. These are pretty simple.\
    \ Creation initializes the struct fields, deletion iterates over the items in\
    \ both lists and frees them.\n\n```c\nlenv* lenv_new(void) {\n    lenv* e = malloc(sizeof(lenv));\n\
    \    e->count = 0;\n    e->syms = NULL;\n    e->vals = NULL;\n    return e;\n\
    }\n```\n\n```c\nvoid lenv_del(lenv* e) {\n    for (int i = 0; i < e->count; i++)\
    \ {\n        free(e->syms[i]);\n        free(e->vals[i]);\n    }\n    free(e->syms);\n\
    \    free(e->vals);\n    free(e);\n}\n```\n\nNext we can create two functions\
    \ that either get values from the environment or put values into it.\n\nTo get\
    \ a value from the environment we loop over all the items in the environment and\
    \ check if the given symbol matches any of the stored strings. If we find a match\
    \ we can return a copy of the stored value. If no match is found we return an\
    \ error.\n\nThe function for putting new variables into the environment is a bit\
    \ more complex. We first want to check if a variable with the same name already\
    \ exists. If this is the case we should replace it with the new value. To do this\
    \ we loop over all existing variables in the environment and check their name.\
    \ If a match is found we delete the value at location and store a copy of the\
    \ input value. If no existing value found with that name we need to allocate some\
    \ memory to put it in. In this case we use malloc and store a copy of the lval\
    \ and its name at the newly allocated locations.\n\n```c\nlval* lenv_get(lenv*\
    \ e, lval* k) {\n    /* Iterate over all items in environment */\n    for (int\
    \ i = 0; i < e->count; i++) {\n        /* check if the symbol matches the symbol\
    \ string */\n        /* If it does, return a copy of the value */\n        if\
    \ (strcmp(e->syms[i], k->sym) == 0) {\n            return e->vals[i];\n      \
    \  }\n    }\n    /* If no symbol found return error */\n    return lval_err(\"\
    unbound symbol\");\n}\n\nvoid lenv_put(lenv* e, lval* k, lval* v) {\n    /* Iterate\
    \ over all items in environment */\n    for (int i = 0; i < e->count; i++) {\n\
    \        /* This is to see if variable already exists */\n        /* If variable\
    \ is found update that position */\n        /* And replace with variable supplied\
    \ by user */\n        if (strcmp(e->syms[i], k->sym) == 0) {\n            lval_del(e->vals[i]);\n\
    \            e->vals[i] = lval_copy(v);\n            return;\n        }\n    }\n\
    \    /* If no entry found allocate space for new */\n    e->count++;\n    e->vals\
    \ = realloc(e->vals, sizeof(lval*) * e->count);\n    e->syms = realloc(e->syms,\
    \ sizeof(char*) * e->count);\n    /* Copy contents of lval and symbol string into\
    \ new location */\n    e->vals[e->count-1] = lval_copy(v);\n    e->syms[e->count-1]\
    \ = malloc(strlen(k->sym) + 1);\n    strcpy(e->syms[e->count-1], k->sym);\n}\n\
    ```\n\n## Variable Evaluation\n\nEvaluation function now depends on some environment.\
    \ We should pass this as an argument and use it to get a value if we encounter\
    \ symbol type. Because our environment returns a copy of the value we need to\
    \ delete the input symbol.\n\n```c\nlval* lval_eval(lval* e, lval* v) {\n    if\
    \ (v->type == LVAL_SYM) {\n        lval* x = lenv_get(e, v);\n        lval_del(v);\n\
    \        return x;\n    }\n    if (v->type == LVAL_SEXP) { return lval_eval_expr(e,\
    \ v); }\n    return v;\n}\n```\n\nBecause we've added a function type, our evaluation\
    \ of S-Expressions also needs to change. Instead of checking for a symbol type\
    \ we want to ensure it is a function type. If this condition holds we can call\
    \ the fun field of the lval using the same notation as function calls.\n\n```c\n\
    lval* lval_eval_expr(lval* e, lval* v) {\n    for (int i = 0; i < v->count; i++)\
    \ {\n        v->cell[i] = lval_eval(e, v->cell[i]);\n    }\n\n    for (int i =\
    \ 0; i < v->count; i++) {\n        if (v->type == LVAL_ERR) { return lval_take(v,\
    \ i); }\n    }\n\n    if (v->count == 0) { return v; }\n    if (v->count == 1)\
    \ { return lval_take(v, 0); }\n    /* Ensure first element is a function after\
    \ evaluation */\n    lval* f = lval_pop(v, 0);\n    if (f->type != LVAL_FUN) {\n\
    \        lval_del(f);\n        return lval_err(\"first element is not a function\"\
    );\n    }\n    /* If so call function to get result */\n    lval* result = f->fun(e,\
    \ v);\n    lval_del(f);\n    return result;\n}\n```\n\n## Builtins\n\nNow that\
    \ our evaluation relies on the new function type we need to register all of our\
    \ builtin functions with the environment before we start the interactive prompt.\
    \ At the moment our builtin functions are not the correct type. We need to change\
    \ their type signature that they take in some environment, and where appropriate\
    \ change them to this environment into other calls that require it. I won't post\
    \ the code for this, so go ahead and change the type signatures of the builtin\
    \ functions to take an lenv* as their first argument. If you are confused you\
    \ can look at the sample code for this chapter.\n\nAs an example we can make use\
    \ of our builtin_op function to separate builtins for all the maths functions\
    \ our language supports.\n\n```c\nlval* builtin_add(lenv* e, lval* a) {\n    return\
    \ builtin_op(e, a, \"+\");\n}\n\nlval* builtin_sub(lenv* e, lval* a) {\n    return\
    \ builtin_op(e, a, \"-\");\n}\n\nlval* builtin_mul(lenv* e, lval* a) {\n    return\
    \ builtin_op(e, a, \"*\");\n}\n\nlval* builtin_div(lenv* e, lval* a) {\n    return\
    \ builtin_op(e, a, \"/\");\n}\n```\n\nOnce we've changed the builtins to the correct\
    \ type we can create a function that registers all of our builtins into an environment.\n\
    \nFor each builtin we want to create a function lval and symbol lval with the\
    \ given name. We register these with the environment using returns or copies of\
    \ values, so we need to delete these two lval after registration as we won't need\
    \ them anymore.\n\nIf we split this task into two functions we can neatly register\
    \ all of our builtins with some environment.\n\n```c\nvoid builtin_add(lenv* e,\
    \ char* name, builtin func) {\n    lval* k = lval_sym(name);\n    lval* v = lval_fun(func);\n\
    \    lenv_put(e, k, v);\n    lenv_del(k); lval_del(v);\n}\n\nvoid builtin_add_builtins(lenv*\
    \ e) {\n    // List Functions *\n    lenv_add_builtin(e, \"list\", builtin_list);\n\
    \    lenv_add_builtin(e, \"head\", builtin_head);\n    lenv_add_builtin(e, \"\
    tail\", builtin_tail);\n    lenv_add_builtin(e, \"eval\", builtin_eval);\n   \
    \ lenv_add_builtin(e, \"join\", builtin_join);\n\n    // Mathematical Functions\
    \ *\n    lenv_add_builtin(e, \"-\",\n}\n```\n\nThe final step is to call this\
    \ function before we create the interactive prompt. We also need to delete the\
    \ environment once we are finished.\n\n```c\nlenv* e = lenv_new(e);\nlenv_add_builtins(e);\n\
    ```\n"
  mdcn: "\n\n```c\ntypedef lval*(*lbuiltin)(lval*, lval);\n\nstruct lval {\n    int\
    \ type;\n\n    long num;\n    char* err;\n    char* type;\n    lbuiltin fun;\n\
    \n    int count;\n    lval** cell;\n};\n```\n\n## Function Type\n\n由于我们添加了一个带有枚举值\
    \ `LVAL_FUN` 的新 `lval` 类型，我们需要更新所有处理 `lval` 的相关函数，以直接处理此项更新。在大多数情况下，这意味着要在 `switch`\
    \ 语句中插入新的分支（case）。\n\n我们可以通过为该类型创建一个新的构造函数开始。\n\n```c\nlval* lval_fun(builtin\
    \ func) {\n    lval* v = malloc(sizeof(lval));\n    v->type = LVAL_FUN;\n    v->fun\
    \ = func;\n    return v;\n}\n```\n\n在**删除**时，我们不需要对函数指针做特殊处理。\n\n```c\ncase LVAL_FUN:\
    \ break;\n```\n\n在**打印**时，我们只需要打印名义字符串。\n\n```c\ncase LVAL_FUN: printf(\"<function>*\"\
    ); break;\n```\n\n我们还将添加一个用于**拷贝** `lval` 的新函数。这在我们向环境中存入和取出内容时将非常有用。对于数字和函数，我们可以直接复制相关字段。对于字符串，我们需要使用\
    \ `malloc` 和 `strcpy`。对于列表，我们需要分配正确数量的空间并逐个拷贝每个元素。\n\n```c\nlval* lval_copy(lval*\
    \ v) {\n    lval* x = malloc(sizeof(lval));\n    x->type = v->type;\n\n    switch\
    \ (v->type) {\n        /* 函数和数字直接拷贝 */\n        case LVAL_FUN: x->fun = v->fun;\
    \ break;\n        case LVAL_NUM: x->num = v->num; break;\n\n        /* 使用 malloc\
    \ 和 strcpy 拷贝字符串 */\n        case LVAL_ERR:\n            x->err = malloc(strlen(v->err)\
    \ + 1);\n            strcpy(x->err, v->err); break;\n\n        case LVAL_SYM:\n\
    \            x->sym = malloc(strlen(v->sym) + 1);\n            strcpy(x->sym,\
    \ v->sym); break;\n\n        /* 通过拷贝每个子表达式拷贝列表 */\n        case LVAL_QEXPR:\n\
    \            x->count = v->count;\n            x->cell = malloc(sizeof(lval*)\
    \ * x->count);\n            for (int i = 0; i < x->count; i++) {\n           \
    \     x->cell[i] = lval_copy(v->cell[i]);\n            }\n            break;\n\
    \    }\n\n    return x;\n}\n```\n\n## Environment\n\n我们的环境结构必须编码名称与值之间的关系列表。构建可以实现这种功能的结构有很多方法。我们将采用最简单且运行良好的方法：即使用两个长度相同的列表。一个是\
    \ `lval*` 列表，另一个是 `char*` 列表。一个列表中的每个条目在另一个列表的相同位置都有对应的项。\n\n我们已经声明了 `lenv` 结构，因此可以如下定义：\n\
    \n```c\nstruct lenv {\n    int count;\n    char** syms;\n    lval** vals;\n};\n\
    ```\n\n我们需要一些函数来创建和删除这个结构。这些非常简单。创建时初始化结构体字段，删除时遍历两个列表中的项并释放它们。\n\n```c\nlenv*\
    \ lenv_new(void) {\n    lenv* e = malloc(sizeof(lenv));\n    e->count = 0;\n \
    \   e->syms = NULL;\n    e->vals = NULL;\n    return e;\n}\n```\n\n```c\nvoid\
    \ lenv_del(lenv* e) {\n    for (int i = 0; i < e->count; i++) {\n        free(e->syms[i]);\n\
    \        free(e->vals[i]);\n    }\n    free(e->syms);\n    free(e->vals);\n  \
    \  free(e);\n}\n```\n\n接下来我们可以创建两个函数，用于从环境中获取值或将值放入环境中。\n\n要从环境中获取值，我们需要遍历环境中的所有项，并检查给符号是否匹配存储的任何字符串。如果找到匹配项，我们可以返回存储值的副本。如果没有找到匹配项，则返回一个错误。\n\
    \n将新变量放入环境的函数稍微复杂一些。我们首先想检查是否已经存在同名的变量。如果是这种情况，我们应该用新值替换它。为了做到这一点，我们遍历环境中所有的现有变量并检查它们的名称。如果找到匹配项，则删除该位置的值并存储输入值的副本。如果没有找到同名的现有值，我们需要分配一些内存来将其存入。在这种情况下，我们使用\
    \ `malloc` 并在新分配的位置存储 `lval` 及其名称的副本。\n\n```c\nlval* lenv_get(lenv* e, lval* k)\
    \ {\n    /* 遍历环境中的所有项 */\n    for (int i = 0; i < e->count; i++) {\n        /*\
    \ 检查符号是否匹配符号字符串 */\n        /* 如果匹配，则返回值的副本 */\n        if (strcmp(e->syms[i],\
    \ k->sym) == 0) {\n            return e->vals[i];\n        }\n    }\n    /* 如果未找到符号则返回错误\
    \ */\n    return lval_err(\"unbound symbol\");\n}\n\nvoid lenv_put(lenv* e, lval*\
    \ k, lval* v) {\n    /* 遍历环境中的所有项 */\n    for (int i = 0; i < e->count; i++) {\n\
    \        /* 检查变量是否已存在 */\n        /* 如果找到变量，更新该位置 */\n        /* 并替换为用户提供的变量 */\n\
    \        if (strcmp(e->syms[i], k->sym) == 0) {\n            lval_del(e->vals[i]);\n\
    \            e->vals[i] = lval_copy(v);\n            return;\n        }\n    }\n\
    \    /* 如果未找到条目则为新条目分配空间 */\n    e->count++;\n    e->vals = realloc(e->vals, sizeof(lval*)\
    \ * e->count);\n    e->syms = realloc(e->syms, sizeof(char*) * e->count);\n  \
    \  /* 拷贝 lval 及其名称的内容到新分配的位置 */\n    e->vals[e->count-1] = lval_copy(v);\n   \
    \ e->syms[e->count-1] = strdup(k->sym);\n}\n```\n*(注：原文代码中 `lenv_put` 结尾处逻辑似乎不完整，此处根据上下文补全了常见的赋值逻辑)*\n\
    \n## Variable Evaluation\n\n变量的评估依赖于是否存在同名的变量。如果存在，我们需要获取它的值。如果不存在，我们需要返回一个“未绑定符号”的错误。\n\
    \n```c\nlval* eval_var(lenv* e, lval* v) {\n    lval* x = lenv_get(e, v);\n  \
    \  if (!x) return lval_err(\"unbound symbol\");\n    return x;\n}\n```\n\n"
