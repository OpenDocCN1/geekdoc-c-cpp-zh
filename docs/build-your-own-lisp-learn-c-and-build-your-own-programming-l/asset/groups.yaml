    # # Editing input


    If you''re working on Linux or Mac you''ll notice some weird behaviour when you
    use the arrow keys to attempt to edit your input.


    ```

    Lisp Version 0.0.0.3

    Press Ctrl+C to Exit

    ```


    ```

    lisp>=^[[

    ```


    Using the arrow keys is creating these weird characters ^[[0 or ^[[, rather than
    moving the cursor around the input. What we really want is to be able to move
    around the line, deleting and editing the input in case we make a mistake.


    On Windows this is the default. On Linux and Mac it is provided by a library called
    editline. On Linux and Mac we need to replace our calls to fputs and fgets with
    calls to this library provides.


    If you''re developing on Windows and want to get going, feel free to skip to the
    end of this chapter as the next sections may not be relevant.


    # # Using Editline


    The library editline provides two functions we are going to use called readline
    and add_history. This first function, readline is used to read input from prompt,
    while allowing for editing of that input. The second function add_history lets
    us record the history of inputs so that they can be retrieved with the up and
    down arrows.'
