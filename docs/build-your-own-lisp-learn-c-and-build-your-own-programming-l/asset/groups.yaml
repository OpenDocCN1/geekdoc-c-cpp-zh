    # S-Expressions • Chapter 9


    # Lists and Lisps


    Lisps are famous for having lively distinction between data and code. They use
    the same structures to represent both. This allows them to do many powerful things
    which other languages cannot do. If we want our programming language we''re going
    to have to separate out the process of reading input, and evaluating the input
    we have stored.


    The final result of this chapter will only slightly in behaviour from the previous
    chapter. This is because we are going to spend time changing things how internally.
    This is well re-factoring and it will make our life a bit easier later on. Like
    preparation for a meal, just because we''re not putting food onto plates doesn''t
    mean we''re wasting time. Sometimes the anticipation is better than ever!


    ![](img/f0182debe7478735c07b82d15dd58fde_55_0.png)


    To store the program we will need to create an internal structure that is built
    recursively of numbers, symbols, and other lists. In Lisp, this structure is commonly
    called an S-Expression standing for Symbolic Expression. We will extend our local
    structure to be able to represent it. The evaluation of S-Expressions is the behaviour
    typical of Lisps, that we are used to so far. To evaluate an S-Expression we look
    at the first item in the list, and take this to the operator. We look at all the
    other items in the list, and take these as operands to get the result.


    By introducing S-Expressions we will finally entering the world of Lisp.


    # Pointers


    In C no concept of lists can be explored without dealing properly with pointers.
    Pointers are a famously misunderstood aspect of C. They are difficult to teach
    while being conceptually very simple, they come with a lot of new terminology,
    and no clear use-case. This makes them appear far monstrous than they are. Luckily
    for us, we have couple ideal use-cases, both of which are extremely typical in
    C, and will likely end up being how you use pointers 90% of the time.


    The reason we need pointers in C is because of function calling works. When you
    call a function in C the arguments are always passed by value. This means a copy
    of them is passed to the function you call. This is true for int, long, char,
    and occasionally user-defined struct types such as lval:: Most of this is great
    but occasionally it can cause issues.'
  - '[PAGE 56]


    A common problem occurs when we have a large struct containing many other structs
    we wish to pass around. Every time we call a function we must create another copy
    of it. Suddenly the amount of data that needs to be copied around just to call
    a function can become huge!


    A second problem is that we define a struct it is a fixed size. It has a limited
    number of fields, and each of these must be a struct which itself is limited in
    size. If I want to call a function with a list of things, where the number of
    things varies from call I clearly can''t use a struct to grow and shrink.


    To get around these issues the developers of C (or y...someone) came up with a
    clever idea. They imagined computer memory as a single list of bytes. In this
    list each can be given a global index, or a position. A bit like a house number.
    The first list is numbered 0, the second is 1.


    In this case all the data in the computer, including the structs and variables
    used in the currently running program, start at some index in this huge list.
    If rather than copying the data to a function, we instead copy a number representing
    the index at where data starts, the function called can look up any of data it
    wants.


    By using addresses instead of the actual data, we can allow a function to access
    and modify some in memory without having to copy any data. Functions can also
    use pointers to do other stuff, like output data to some address given as input.


    Because the total size of computer memory is fixed, the number of bytes needed
    to represent an address is always the same. But if we keep track of it, the addresses
    to points can grow and shrink. Then we can create a variable sized data-structure
    and still pass it to a function, which can inspect and modify it.


    So a pointer is just a number. A number representing the starting index of some
    data in memory. The type of the pointer hints to us, and the compiler, what type
    of data might be accessible at this location.


    We can declare pointer types by suffixing existing ones with the * character.
    We''ve seen some examples of this already with `mp_parser_t`, `mp_ast_t`, or `char*`.


    To create a pointer to some data, we need to get its index, or address. To get
    the address of some data we use the address of operator &. Again you have seen
    this before we use a pointer toH_parse so it would output into our `mp_result_t`.


    Finally to get the data at an address, called dereferencing, we use the * operator
    on the left-hand side of a variable. To get the data at the field of a pointer
    to a struct we use the arrow ->. This you saw in chapter 7.


    # # Stack & Heap


    I said that memory can be visualised as one long list of bytes. Actually it is
    better to imagine it split into two sections. These sections are called The Stack
    and The Heap.


    Some of you may have heard tales of these mysterious locations, such as "the stack
    grows down but the heap grows up", or "there are many stacks, but only'
  - '[PAGE 57]


    heap". These sorts of things don''t matter much. Dealing with the stack and the
    heap in C can be complex, but it doesn''t have to be a mystery. In essence they
    are just two sections of memory used for two different tasks.


    # The Stack


    The Stack is the memory where your program lives. It is where all of your temporary
    variables and data structures exist as you manipulate and edit them. Every time
    you call a function a new area of the stack is put aside for it to use. Into this
    area are local variables, copies of any arguments passed to the function, as well
    as some bookkeeping data such as who caller was, and what to do when finished.
    When the function is done the area it is unallocated, ready for use again by someone
    else.


    ![](img/f0182debe7478735c07b82d15dd58fde_57_0.png)


    I like to think of the stack as a building site. Each time we need to do something
    we corner off a section of space, enough for our tools and materials, and to work.
    We can still go to parts of the stack, or off-site, if we need certain things,
    but all our work is done in this section. Once we are done with some task, we
    take what we''ve constructed to a new place and clean up that section of the space
    we''ve been using to make it.


    # The Heap


    The Heap is memory put aside for storage of objects with a longer lifespan. Memory
    in this area has to be manually allocated and deallocated. To allocate new memory
    the malloc function is used. This function takes as input the number of bytes
    requested, and returns a pointer to a new block of memory with many bytes set.


    When done with the memory at that location it must be released again. To do this
    the pointer received from malloc should be passed to the free


    Using the Heap is trickier than the Stack because it requires the programmer to
    remember to call free and call it correctly. If he or she doesn''t, the program
    may continuously allocate more and more memory. This is called a memory leak.
    An easy rule to avoid this is to ensure for each


