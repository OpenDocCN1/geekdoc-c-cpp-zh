    list of symbols, just like we def arguments, also known as the unbound variables.
    They act as the inputs to our partial computation. The second argument could be
    another list. When running the function this is going to be evaluated with our
    builtin function.


    This function will call \ , (a homage to The Lambda Calculus as the \ character
