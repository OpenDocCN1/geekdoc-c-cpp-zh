    # Languages • Chapter 5


    # What is a Programming Language?


    A programming language is very similar to a real language. There is a structure
    behind it, and some rules which dictate what is, and isn''t, a valid thing to
    say. When we read and write natural language, we are unconsciously learning these
    rules, and the same is true for programming languages. We can utilise these rules
    to understand others, and generate our own speech, or code.


    In the 1950s the Noam Chomsky formalised a number of important observations about
    languages. Many of these form the basis of our understanding of language today.
    One of these was the observation that natural languages are built up of recursive
    and repeated substructures.


    As an example of this, we can examine the phrase.


    +   - The cat walked on the carpet.

    - Using the rules of English, the noun cat can be replaced by two nouns separated
    by and.

    - The cat and dog walked on the carpet.


    Each of these new nouns could turn in be replaced. We could use the same rule
    before, and replace cat with two new nouns joined with Or we could use a different
    rule and replace each of the nouns with an adjective and a noun, to add to them.


    > The cat and mouse dog walked on the carpet.


    ![](img/f0182debe7478735c07b82d15dd58fde_28_0.png)


    +   The white cat and black dog walked on the carpet.


    These are just examples, but English has different rules for how types of words
    can be changed, manipulated and replaced.

    We notice this exact behaviour in programming languages too. In C, the body of
    an if statement creates a set of new statements. Of these new statements, could
    be another if statement. These repeated structures and replacements are reflected
    in all parts of the language. These are sometimes re-write rules because they
    tell you how one can be re-written as something else.


    ```

    if (x > 5) { return x; }

    if (x > 10) { return x; }

    ```


    The consequence of this observation by Chomsky was important. It meant that although
    there is an infinite number of different things that can be said, or written down
    in a particular language. It is still possible to process and understand all of
    them with a finite number of re-write rules. The name given to a set of re-write
    rules is a grammar.


    We can describe re-write rules in a number of ways. One way is textual.'
- md: "\nsay something, \"a sentence must be a verb phrase\", or \"a verb phrase can\
    \ be either a verb, an adverb and a verb\". This method is good for humans but\
    \ it is too imprecise for computers to understand. When programming we need to\
    \ write down a more formal description of a grammar.\n\nTo write a programming\
    \ language like a Lisp we are going to need to understand grammar. For reading\
    \ the user input we need to write a grammar which describes it. Then we can use\
    \ it with our user input to decide if the input is valid. We can also use a structured\
    \ internal representation, which will make the job of understanding it, and then\
    \ evaluating it, performing the computations within, much easier.\n\nThis is where\
    \ a library called mpc comes in.\n\n## Parser Combinators\n\nmpc is a Parser Combinator\
    \ library I have written. This means it is a library that allows you to build\
    \ programs that understand and process particular languages. These are known as\
    \ parsers. There are many different ways of building parsers, but the cool thing\
    \ about using a Parser Combinator library is that lets you build parsers just\
    \ by specifying the grammar... sort of.\n\nMany Parser Combinator libraries work\
    \ by letting you write normal code that looks like a grammar, not by actually\
    \ specifying a grammar directly. In many situations it is fine, but it can get\
    \ clunky and complicated. Luckily for us mpc allows us to write normal code that\
