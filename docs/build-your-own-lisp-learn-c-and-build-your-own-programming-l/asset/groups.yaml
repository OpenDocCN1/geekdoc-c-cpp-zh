  - "[PAGE 17]\n\nConditional statements the program perform some code only if certain\
    \ conditions are met.\n\nTo perform code under some condition we use the if statement.\
    \ This is written as if followed by some condition in parenthesis, followed by\
    \ the code to execute in curly brackets. An if statement can be followed by an\
    \ optional else statement, followed by other statements in curly brackets. The\
    \ code in these brackets will be performed in the case the conditional is false.\n\
    \nWe can test for multiple conditions using the logical operators || for or, and\
    \ && for and.\n\nInside a conditional statement's parenthesis any value that is\
    \ not @ will evaluate to true. This is important to remember as many conditions\
    \ we use to check things implicitly.\n\nIf we wished to check an int x was greater\
    \ than 10 and less than 100 we would write the following.\n\n```\nif (x > 10 &&\
    \ x < 100) {\n  puts(\"x is greater than 10 and less than 100!\");\n} else {\n\
    \  puts(\"x is less than 11 or greater than 99!\");\n}\n```\n\n# Loops\n\nLoops\
    \ allow for some code to be repeated until some condition becomes false, or some\
    \ other counters.\n\nThere are two main loops in C. The first is a while loop.\
    \ This loop repeatedly executes a block of code until some condition becomes false.\
    \ It is written as while followed by some condition in parenthesis, followed by\
    \ the code to execute in curly brackets. For example a loop that counts from 10\
    \ to 1 could be written as follows.\n\n```\nint i = 10;\nwhile (i > 0) {\n  puts(\"\
    Loop Iteration\");\n  i = i - 1;\n}\n```\n\nThe second kind of loop is a for loop.\
    \ Rather than a condition, this loop requires three expressions separated by semicolons;\
    \ these are initialiser, condition and an incrementer. The initialiser is performed\
    \ before the loop starts. The condition is checked before each iteration of the\
    \ loop. If it is false, the loop is exited. The incrementer is performed at the\
    \ end of each iteration of the loop. These loops are often used for counting as\
    \ they are more compact than the while loop.\n\nFor example to write a loop that\
    \ counts from 0 to 9 we might write the following. In this case the ++ operator\
    \ initializes the variable i.\n\n```\nfor (int i = 0; i < 10; i++) {\n  puts(\"\
    Loop Iteration\");\n}\n```"
