    # Why learn C


    C is one of the most popular and influential programming languages in the world.
    It is the language of choice for development for Linux, and has been used extensively
    in the creation of OS X and to some extent Microsoft Windows. It is used on microcomputers
    too. Your fridge and car can probably run on. In modern development, the use of
    C may be escapable, but its legacy is not. Anyone wanting to make a career out
    of software would be smart to learn C.


    But C is not software development and careers. C is about freedom. It rose to
    fame on the back of technologies of collaboration and freedom - Unix, Linux, and
    The Libre Software Movement. It personifies the idea of personal liberty within
    computing. It wills you to take control of the technology affecting your life.


    In this day and age, technology is more powerful than ever, this could not be
    more important.


    ![](img/f0182debe7478735c07b82d15dd58fde_6_0.png)


    The ideology of freedom is reflected in the nature of C itself. There is little
    C hides from you, including its warts and faults. There is little C stops you
    from doing including your programs in horrible ways. C dares you to change what
    to do.


    ways. When programming in C you won''t stand on a path, but a path of decision,
    and C dares you to change what to do.


    C is also the language of fun and learning. Before the mainstream media got of
    it we had a word for this. Hacking The philosophy that glorifies what is fun and
    nothing to do with the illegal unauthorised access of other peoples'' computers.
    Hacking is the philosophy of exploration, personal expression, pushing boundaries,
    breaking the rules. It stands against hierarchy and bureaucracy. It celebrates
    the individual. Hacking baits you with fun, learning, and gary. Hacking is the
    promise that with a computer and access to the internet, you have the agency to
    change the world.


    Want to master C is to care about what is powerful, clever, and free. To become
    a programmer with all the vast powers of technology at his or her fingertips and
    the responsibility to do something to benefit the world.'
