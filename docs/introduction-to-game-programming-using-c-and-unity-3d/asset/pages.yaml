  md: '# Unity 3D – Game Programming Intro


    A Prefab is a powerful feature within Unity that allows you to make a copy of
    your GameObject and store it for later use. The Prefab acts as a template from
    which you can create new object instances in the scene. Another powerful feature
    provided by the Prefab is the ability to edit and modify the Prefab and automatically
    all active instances of the Prefab will be reflected by the latest updates. You
    can also break a link between an instance of a Prefab and the Prefab to overwrite
    the properties or special changes to that particular non-related instance. You
    will get a better feel of what Prefabs are and why they are so useful in later
    chapters.


    # Parent-Child Relationship


    Unity uses a concept called Parenting. Parenting is one of the most important
    concepts to understand when using Unity. When a GameObject is a Parent to another
    GameObject, the Child GameObject will move, rotate, and scale exactly as its Parent
    does. You can think of parenting as being the relationship between your arms and
    your body; whenever you move your body, your arms move along with it. Child objects
    can also have their own children and etc...


    To make any GameObject the child of another, drag the desired child onto the desired
    parent in the Hierarchy. A child will inherit the movement and rotation of its
    parent. You can use a parent object''s fold-arrow to show or hide its children
    as necessary. The parent-child relationship of a GameObject is visually represented
    in the Hierarchy Window. A GameObject can have a very complex parent-child structure.'
