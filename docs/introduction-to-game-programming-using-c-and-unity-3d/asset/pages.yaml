    \ function. Here is a listing of the function:\n\n```\nprivate void ChangeHitDirection()\
    \ {\n switch (this.hit_dir) {\n    // change direction based on logic\n    case\
    \ HitDirection.none:\n        this.hit_dir = HitDirection.up;\n        break;\n\
    \    case HitDirection.up:\n        this.hit_dir = HitDirection.right;\n     \
    \   break;\n    case HitDirection.right:\n        this.hit_dir = HitDirection.down;\n\
    \        break;\n    case HitDirection.down:\n        this.hit_dir = HitDirection.left;\n\
    \        break;\n    case HitDirection.left:\n        this.hit_dir = HitDirection.none;\n\
