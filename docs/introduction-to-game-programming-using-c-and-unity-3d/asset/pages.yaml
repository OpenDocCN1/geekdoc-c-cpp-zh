  md: '# Unity 3D – Game Programming Intro


    Looking at Figure 79 we get a look at our desired GUI layout. As indicated in
    the diagram, we have five buttons representing the selection of our pieces for
    board placement at the bottom of the screen, we have a button for the change of
    orientation at the top left corner of the screen, and we have two big blocks representing
    the game boards that we are going to use for our game.


    If you notice Figure 79, does not display any information regarding the score
    in the game. This is captured in Figure 80. Here is how the UI logic works:


    +   1. Player selects a given ship to be placed on his/her board.

    2. After successful placement, the select piece will be moved from the UI.

    3. This process repeats until all pieces have been placed onto the playing board.

    4. At this point, when the game starts, all placement buttons are either removed
    or hidden from the UI.

    5. Then the score UI is displayed to the user as indicated in the sketch.


    This is another important concept when you are designing a GUI for a particular
    application. Due to the restrictions of screen real-estate, you will need to decide
    how to manage the information you want to display to the end user. Not only will
    you need to think about the size location and orientation of the UI elements,
    but also at what time you want to display specific information.


    In some cases, you might have to continuously display a set of very important
    data to the player, you will need to design the UI in a way that will be comfortable
    for the player to get the information or she needs, but at the same time it does
    not interfere with the gameplay.


    At other points, you might want to display information (more details) regarding
    a certain criteria upon a trigger by the player. This action will bring up a panel
    or a window that will display data in more details.'
