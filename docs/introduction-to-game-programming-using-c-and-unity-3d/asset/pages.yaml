    # Inheritance


    Inheritance is an interesting object-oriented programming concept. It allows one
    class to be based upon another, the super-class, and inherit all of its functionality.
    Additional code may then be written to create a more specialized version of the
    class. If we wanted to improve on our model and design, we would create a new
    class called Vehicle. This new class will be the super class, and the Car class
    will inherit the Vehicle class.


    Inheritance is not limited to a single level but will cascade down any number
    of levels in a class hierarchy. This makes inheritance a very powerful mechanism
    because classes can be endowed with rich sets of capabilities simply by placing
    them in the correct branch of a class hierarchy. They will automatically pull
    together all the interface and implementation definitions of the classes above
    them in the hierarchy, defining for themselves only the additional capabilities
    that make them unique.'
