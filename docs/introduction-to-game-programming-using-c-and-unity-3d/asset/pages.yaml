  md: '# Unity 3D – Game Programming Intro


    A few things to explain before we move forward. Each script you create will by
    default inherit from MonoBehaviour. We will discuss this class at a later point.
    Each script that you create will also have two functions defined as: Start() and
    Update().


    The Start() function will be run only once at the start of the program. So any
    logic and data initializations that you need or want to do placed in the Start()
    function.


    The Update() function is where most of the magic happens. This is the function
    that gets called continuously throughout the life of your game or simulation.
    This is the function where you will update your game objects. In short it is the
    function which will be called each frame rendering the scene.


    The line this.transform.Rotate(new Vector3(0, 1, 0)); will perform the desired
    rotation we are looking for on the given object it is applied to. Without getting
    too much into the details and the behind the scene complication of this function.
    We can utilize the Rotate function defined on the transform component of our object
    to pass in a Vector3 object, representing our (X,Y,Z), and the rotation angle.


    Since we are planning to rotate on the Y-Axis, we have to define our Vector3 as
    (0,1,0). The function will do all of the necessary transformations and handle
    the computation for you. The next parameter is the rotation angle, which we have
    defined as 1.


    There are several ways to apply a script to a Game Object. The simplest way would
    be to drag and drop your script onto the desired game object on the scene. After
    you have applied the script, in the Inspector Windows, you will see that the script
    is a component of the cube.'
