    // Function to place the calculate position of next item around

    a circular path.

    void CirclePath(Vector3 center, float radius, int id {

    float ang = 90 * id; //Random.value * 360

    Vector3 pos;

    pos.x = center.x + radius * Math.Sin(ang * Math.Deg2Rad);

    pos.z = center.z + radius * Math.Cos(ang * Math.Deg2Rad);

    pos.y = center.y+1;

    return pos;

    }

