  md: '# while loop


    The while statement executes a statement or a block of statements until a specified
    expression evaluates to false. Because the test of the while expression takes
    place before each execution of the loop, a while loop executes zero or more times.


    # do-while loop


    The do-while statement executes a statement or a block of statements repeatedly
    until a specified expression evaluates to false. Unlike the while loop, a do-while
    loop is executed one time before the conditional expression is evaluated.


    ![](img/4873514db350e34656eaacf188ad9d35_24_0.png)


    ![](img/4873514db350e34656eaacf188ad9d35_24_1.png)


    Figure 3 - while loop diagram


    Figure 4 - do-while loop diagram


    Every programming language and environment will provide some kind of a looping
    mechanism. In C# we have four types which have been discussed above. Each loop
    structure is used for specific purpose as described. The most commonly used loops
    are the for loop, the foreach loop and the while loop structure. The do-while
    loop is used on special occasions, where you would like to execute the body of
    the loop'
  merge: -1
