  md: '# Chapter 3 – Game Objects and Components


    # What Is a GameObject?


    GameObjects are the most important concept in Unity. It is very important to understand
    what a GameObject is. Every object in your game is a GameObject. Think of a GameObject
    as an empty container that can hold different Components. These Components are
    then added to implement the functionality of the GameObject. Depending on what
    kind of object you want to create, you will add different combinations of Components
    to the GameObject.


    In Chapter 2 – Brief Introduction to Unity IDE, if you recall from the Inspector
