  md: '# Unity 3D – Game Programming Intro


    The numeric data types are represented by byte, short, int, long, float, and double.
    Alpha-Numeric data types are char and strings. Then you have your Boolean data
    type, that take either a true or a false value, and finally complex data types
    that are user defined. Complex or user defined data types are the classes that
    will be discussed later.


    There are 15 different built-in data types in the C# language. The following table
    will list them out for you and also provide you with the range possible each type.


    | Short Name | .NET Class | Type | Width | Range (bits) |

    | --- | --- | --- | --- | --- |

    | byte | Byte | Unsigned integer | 8 | 0 to 255 |

    | sbyte | SByte | Signed integer | 8 | -128 to 127 |

    | int | Int32 | Signed integer | 32 | -2,147,483,648 to 2,147,483,647 |

    | uint | UInt32 | Unsigned integer | 32 | 0 to 4,294,967,295 |

    | short | Int16 | Signed integer | 16 | -32,768 to 32,767 |

    | ushort | UInt16 | Unsigned integer | 16 | 0 to 65,535 |

    | long | Int64 | Unsigned integer | 64 | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807
    |

    | ulong | UInt64 | Unsigned integer | 64 | 0 to 18,446,744,073,709,551,615 |

    | float | Single | Single-precision floating point type | 32 | -3.4028235e-38
    to 3.4028234e+38 |

    | double | Double | Double-precision floating point type | 64 | -1.79769313348623e-308
    to 1.79769313348623e+308 |

    | char | Char | A Unicode character | 16 | Unicode symbols used in text |

    | bool | Boolean | Logical Boolean type | 8 | True or false |

    | object | Object | Base type of all types | | |

    | string | String | A sequence of characters | | |

    | decimal | Decimal | Precise integral type that can represent decimal numbers
    with 29 significant digits | 128 | ±1.0 × 10e-28 to ±7.9 × 10e28 |


    The following code block illustrates how to use some of the common data types:


    ```

    // true or false – one bit

    bool b = true;

    ```'
