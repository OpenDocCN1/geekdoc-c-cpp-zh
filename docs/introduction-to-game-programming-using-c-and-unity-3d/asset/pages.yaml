  md: '# Chapter 1 – Programming Concepts


    What Is a Programs?


    A program is a step-by-step instruction that has been designed to solve a given
    problem. Here is another definition:


    > An organized list of instructions that, when executed, causes the computer to
    behave in a predetermined manner. Without programs, computers are useless.


    But the best definition I was given by my Professor Dr. Lee in the data class
    structure at Cal Poly:


    Program = Data + Algorithm


    A program is like a recipe. It contains a list of variables that represent the
    data to be processed, and a list of directions, the algorithm(s) that perform
    special operations on the data.


    # Fundamentals of Programming


    Every program needs to store data. In order to store data in a computer, we use
    what are called variables. A variable needs to know what kind of data it is storing,
    hence a variable needs to have a Data Type.


    # Data Types


    Today''s programming languages and frameworks provide several basic data types
    that can be used to store and retrieve information on the computer. These data
    types are in general:


    +   1. Numeric

    2. Alpha-Numeric

    3. Boolean

    4. Complex'
  merge: -1
