  md: 'Vahé Karamian


    Figure 78 provides a more detailed view of how the internal game logic is once
    the player and the A.I. have placed their ships onto their respective boards.
    Each player gets a chance to select a board unit when it is their turn, if the
    selected board unit is occupied by the opponent''s piece, then we have a hit,
    several operations happen behind the scene by the game manager for accounting
    and also visual and audio representation, finally the game manager checks if the
    player has hit all of the opponent''s pieces, and if so, the game is over.


    The A.I. starts with similar logic and the program performs the same steps for
    the hit or miss criteria, however, there is a backtracking20 algorithm developed
    for the A.I. if there is a hit! This is basically the code that actually gives
    the A.I. its intelligence. It determines what the best next move is for the A.I.
    if the A.I. has a hit. In the meantime game manager also checks to determine if
    the A.I. has hit all of the play''s pieces, and if so, the game is terminated
    with the A.I. being the winner.


    As you can see, even for a simple game, there is a lot of planning to do as a
    designer and programmer. The diagrams are provided to make it easier to visualize
    the flow of the program. We will look at the implementation in a different section.


    # Game User Interface


    As any other application, a game also needs to provide a Graphical User Interface
    (GUI) to the user. The GUI of your game is a means of how the user will interact
    with your game. Generally speaking, the GUI of an application or a game is driven
    by the features and goals of that particular application or game.


    Typically the GUI has to display meaningful information to the end user. The information
    are data related to the environment. In instance, in our game, we need a means
    for the player to select the pieces that are needed to be placed onto their board,
    we also need a means to


