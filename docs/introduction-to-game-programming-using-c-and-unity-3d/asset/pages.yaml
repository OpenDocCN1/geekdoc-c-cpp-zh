  md: '# Unity 3D – Game Programming Intro


    will render in front of or behind other objects in the scene

    based on 3D placement. This is useful for UIs that are\meant to be a part of the
    world. This is also known as a

    “diegetic interface”.


    # Basic Layout


    Every UI element is represented as a rectangle for layout purposes.

    This rectangle can be manipulated in the Scene View using the Rect

    Tool in the toolbar. The Rect Tool is used for both Unity’s 2D features

    and for UI, and in fact can be used even for 3D objects as well.


    ![](img/4873514db350e34656eaacf188ad9d35_147_0.png)


    Figure 46 - Rect Tool Toolbar Buttons


    The Rect Tool can be used to move, resize and rotate UI elements.

    Once you have selected a UI element, you can move it by clicking an-

    ywhere inside the rectangle and dragging. You can resize it by clicking

    the edges or corners or dragging.


    The element can be rotated by hovering the cursor slightly away

    from the corners until the mouse cursor looks like a rotation symbol.

    You can then click and drag in either direction to rotate.


    Just like the other tools, the Rect Tool uses the current pivot mode

    and space. When working with UI it’s usually a good

    idea to keep those set to Pivot and Local.


    # Rect Transform:


    The Rect Transform is a new transform component that is used for

    all UI elements instead of the regular Transform component.


    Rect Transforms have position, rotation, and scale just like regular

    Transforms, but it also has a width and height, used to specify the di-

    mensions of the rectangle.'
