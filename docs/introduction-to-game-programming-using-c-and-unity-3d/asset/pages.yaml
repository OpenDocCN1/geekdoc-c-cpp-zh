    a look at the UI implementation of Level 3.


    # Level 3 – UI Design


    For Level 3, we would need to create a totally different type of a UI. In Level
    3, our objective is to create a Storage Facility which will collect and store
    resources for us. The objective of the level is for the player to kill the opponent
    and for the opponent to kill the player. Whoever accomplishes this first is the
    winner.


    ![](img/4873514db350e34656eaacf188ad9d35_173_0.png)


    Figure 58 - Level 3 UI Concept


    Our UI will need to be designed in a way to give us information regarding the
    status of our resources, our health and also the next collectable resource. It
    would be nice to also have a way to display relevant'
