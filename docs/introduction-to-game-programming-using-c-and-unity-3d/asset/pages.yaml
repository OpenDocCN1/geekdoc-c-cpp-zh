    # The Implementing Class:


    This is the class that agrees to the contract described in the interface. For
    example, a Bomb might be a class that implements IWeapon and thus implements the
    Explode() function within the class based on the Bomb''s requirements.


    # The Client Class:


    The client calls functions on the implementing class. For example, you might have
    a Battleship class that might have an array of IWeapon objects. The client can
    expect to be able to call Explode() on each object, and although each individual
    object may implement the method differently, each will do so appropriately and
    without complaint!


    You might ask, what is the difference between Abstract Base Classes and an Interface?
    The key difference is that an abstract base class serves as the base class for
    a family of derived classes, and an interface is meant to be mixed in with other
    inheritance chains. That is, class can inherit from only a single parent class,
    but it can implement multiple interfaces.


    In addition, when you derive from an abstract class, you must override all the
    abstract methods, but you do not have to override any non-abstract functions.
    You can simply use the implementation that the base class provides. This is called
    Partial Implementation. Interfaces don''t have any implementation, so you must
    implement every function defined in the interface. You can''t partially implement
    an interface.


