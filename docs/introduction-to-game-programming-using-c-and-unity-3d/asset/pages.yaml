    of these meshes is the highly complex and detailed shape visible to the player
    in the game, and a second simplified invisible mesh is used to represent the object
    to the physics engine so that the physics engine can interact with it.


    # Enter the Collider Component


    Colliders are used to define the shape of an object for the purpose of physical
    collisions. The collider does not necessarily need to be the shape of the game
    object''s mesh. Usually a rough estimate is often more efficient and indistinguishable
    in gameplay.


    The simplest colliders, which are also the least processorintensive, are the primitive
    collider types: Box Collider, Sphere Collider, and by combining positioning these
    colliders you can pretty create a compound collider that will satisfy any game
    object for collision detection.


    Colliders can be added to an object without a Rigidbody component to create floors,
    walls and other motionless elements of a scene. These are referred to static colliders.


    # Triggers


    The scripting system can detect when collisions occur and initiate actions using
    the OnCollisionEnter() function. However, we can also use the physics engine simply
    to detect when one collider enters the space of another without creating a collider.
    A collider configured as a Trigger, using the IsTrigger property, does not behave
    as a solid object and will simply allow other colliders to pass through. When


