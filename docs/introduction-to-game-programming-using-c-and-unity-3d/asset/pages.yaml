    # Enhancing the User Interface


    In this section we will take Level 3 and make a few additions to the UI design.
    The main layout will not be changing, but what I would like to demonstrate is
    the ease of how to use textures to enhance the look and feel of the UI elements.


    ![](img/4873514db350e34656eaacf188ad9d35_188_0.png)


    Figure 59 - Another UI Sample


    Now that you are familiar with the basics of UI and design the Architecture in
    Unity, we can take it a little further. Generally speaking, when you are designing
    and developing your game, you will have a team of people dedicated only for creating
    graphics content and models for the purposes of the project. You will be working
    with them hand in hand to incorporate their elegant design into the game environment.


    Most of the UI will have highly polished 2D texture graphics that can be used
    to provide visually appealing themes for the player. I want to show you how easy
    it is to incorporate such textures in the new UI Architecture in Unity.


