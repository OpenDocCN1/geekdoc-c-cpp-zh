  md: '# Unity 3D – Game Programming Intro


    Transform component but it will not respond to collision and forces like a non-kinematic
    rigidbody. Kinematic rigidbodies should be used for colliders that can be moved
    or disabled/enabled occasionally but that should otherwise behave like static
    colliders. The best example to illustrate this concept would be a sliding door.
    The door normally act as an immovable physical obstacle but can be opened when
    necessary. Unlike a static collider, a moving kinematic rigidbody will apply friction
    to other objects and will “wake up” other rigidbodies when they make contact.


    # RigidBody


    A Rigidbody is the main component that enables physical behavior for an object.
    With a Rigidbody attached, the object will immediately respond to gravity. If
    one or more Collider components are also added, the object will be moved by moving
    collisions.


    Rigidbodies allow GameObjects to act under control of the physics engine. This
    opens the gateway to realistic collisions, varied types of joints, and other cool
    behaviours. Manipulating your GameObject by adding forces to the Rigidbody creates
    a very different behavior than adjusting the Transform component directly. As
    a good rule of thumb, you shouldn''t manipulate the Rigidbody and the Transform
    of the same GameObject, only one or the other.


    # Joints


    You can attach one rigidbody to another or to a fixed point in space using a Joint
    component. Generally, you want a joint to allow at least some freedom of motion.
    Unity provides the following Join components that enforce restrictions: Hinge
    Joint and Spring Joint. Hinge Joint allows rotation around a specific point and
    axis, while Spring Joint keeps the object apart but the distance between them
    stretch slightly. Joins also have other options that can be enabled for specific
    effects.'
