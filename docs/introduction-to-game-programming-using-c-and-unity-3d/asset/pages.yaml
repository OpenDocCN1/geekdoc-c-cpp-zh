    be achieved with realtime techniques.


    # Occlusion Culling


    Occlusion Culling is a feature that disables rendering of objects when they are
    not currently seen by the camera because they are obscured (occluded) by other
    objects. This does not happen automatically, most of the time objects farthest
    away from the camera are drawn first and closer objects are drawn over the top.
    This is different from Frustum Culling, as Frustum Culling only disables the renderers
    for objects that are outside the camera''s viewing area but does not disable anything
    hidden from view by redraw.


    The occlusion culling process will go through the scene using a virtual camera
    to build a hierarchy of potentially visible sets of objects. This is the data
    that is used by each camera at runtime to determine what is visible and what is
    not. This reduces the number of draw calls and increases the performance of the
    game.


    # Batching


    To draw an object on the scene, Unity engine has to issue a draw call to the graphics
    API. Draw calls are often expensive, with the graphics API doing significant work
    for every draw call, causing performance overhead on the CPU side.


    Unity uses static batching to address this. The goal of the static batching is
    to regroup as many meshes in buffers to get better performance, rendering giant
    meshes instead of a lot of small meshes which is inefficient.


