  md: '# Chapter 6 – Creating Battleship


    # Historical Background


    The game of Battleship is thought to have its origins in the French game L''Attaque
    played during World War I. The game is said to have been played by Russian officers
    before World War I. The first commercial version of the game was Salvo, published
    in 1931 in the United States by the Starex company. Other versions of the game
    were printed in the 1930s and 1940s, including the Strathmore Company''s Combat:
    The Battleship Game, Milton Bradley''s Broadsides: A Game of Naval Strategy and
    Maurice L. Freedman''s Warfare Naval Combat.


    | A | B | C | D | E | F | G | H | I | L |

    |---|---|---|---|---|---|---|---|---|---||

    | 1 | | | | | | | | | | |

    | 2 | | | | | | | | | | |

    | 3 | | | | | | | | | | |

    | 4 | | | X | | | | | | | |

    | 5 | | | | | | X | X | | | |

    | 6 | X | | | | | | | X | X |

    | 7 | | | | X | | | | | | |

    | 8 | X | X | | | | | X | | |

    | 9 | | | | | | | | | | |

    | 10 | | | | | | | | | | |


    Figure 68-Grid Sample Layout


    Battleship was one of the earliest games to be produced as a computer game, with
    a version being released for the Z80 Compicolor in 1979. Many computer editions
    of the game have been produced since. In Clubhouse Games for the Nintendo DS,
    Battleship is known as Grid Attack. It is played on an 8×8 grid, and includes
    slight variations, such as 4-player gameplay, various ship sizes and shapes, as
    well as the option to make the ships touch each other.'
