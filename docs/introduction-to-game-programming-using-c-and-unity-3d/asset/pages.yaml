  md: '# Vahé Karamian


    In computer science and visualization, a canvas is a container that holds various
    drawing elements (lines, shapes, text, frames containing other elements, etc.).
    It takes its name from the canvas used in visual scene graph because it arranges
    the logical representation of a user interface or graphical scene. Some implementations
    also define the spatial representation and allow the user to interact with the
    elements via a graphical user interface.


    In Unity 3D, the canvas is the area that all UI elements should be inside. It
    is a GameObject with a Canvas Component attached to it, and all UI elements must
    be children of such a Canvas.


    # Draw Order and Render Modes:


    UI elements in the Canvas are drawn in the same order they appear in the Hierarchy.
    The first child is drawn first, the second child next, and etc... If two UI elements
    overlap, the later one will appear on top of the earlier one.


    # Render Modes:


    There are three render modes available for the Canvas:


    +   Screen Space – Overlay: This render mode places UI elements on the screen
    rendered on top of the scene. If the screen is resized or changes resolution,
    the Canvas will automatically change size to match it.


    +   Screen Space – Camera: Similar to Screen Space – Overlay, but in this render
    mode, the Canvas is placed a given distance in front of a specified Camera. The
    UI elements are rendered by the Camera, which indicates that the Camera settings
    will have an effect on the appearance of the UI elements.


    +   World Space: In this render mode, the Canvas will behave as any other object
    in the scene. The size of the Canvas can be set manually using its Rect Transform,
    and UI elements'
