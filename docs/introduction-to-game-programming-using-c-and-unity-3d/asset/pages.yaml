  md: '# Unity 3D – Game Programming Intro


    This will lead to a better decision making when you are designing the layout of
    your UI and the features and functions available at a given time.


    ![](img/4873514db350e34656eaacf188ad9d35_145_0.png)


    User Interfaces come in many shapes and forms. As mentioned before, it really
    comes down to what type of information you want to share with the player, and
    what type of functionality, if any, you would like to provide to the player.


    # The Basics of User Interface Design in Unity 5


    If you have experience with creating user interfaces with previous versions of
    Unity, you know that it was extremely tedious and limited. With the introduction
    of Unity 5, the underlying UI engine has been improved tenfold.


    # The Canvas


    A little bit of background and fun. What is a Canvas?


    > Canvas is an extremely durable plain-woven fabric used for making sails, tents,
    marquees, backpacks, and other items for which sturdiness is required. It is also
    popularly used by artists as a painting surface, typically stretched across a
    wooden frame.'
