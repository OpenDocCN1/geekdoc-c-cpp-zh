    If you notice, both of the if conditions check for the same criteria: the board
    unit must be attacked and it must be occupied. These criteria are checked through
    this.ATTACKED and this.OCCUPIED properties. The main difference between the two
    blocks is done through the tag property associated with the unit board prefab.


    We need to be able to somehow identify whose board we are interacting with, and
    this is done through the tag property that is associated to the unit board prefab.
    For the player’s board, the tag property is defined as “boardAttack” and for the
    enemy’s board, the tag property is defined as “board”. The tag property is defined
    and assigned at design time. In other words, since we are using one one script
    to handle both the player’s board units and the enemy’s board units, we need to
    somehow distinguish between the two, and hence we are doing through that tag property.


    Since that is now out of the way, the actual structure and logic for both if blocks
    are similar, if the conditions are met, we activate/enable the prefab for visually
    representing a hit. The next step is to check a timer variable, the timer is to
    set reset every (4) seconds, we instantiate the defined visual FX prefab on the
    attack position transform associated with the unit board prefab. Notice that every
    four seconds we destroy the visual GameObject from the scene.


