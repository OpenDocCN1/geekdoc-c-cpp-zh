  md: '# Preface


    The book came to be based on several factors. First and foremost, the main objective
    of this book is to provide a starting point in the field of computer science,
    and specifically game programming. Second, it is intended as a way to raise the
    interest in individuals in the field of computer science.


    The book is intended for specific audience. It is assumed that the reader has
    a passion for the study of computer science, and that they have a passion in game
    design and development. It is also assumed that the reader is proactive and that
    they would have the ability to engage on a deeper level on their own.


    The book is intended mostly for the programmer rather than the artist. There are
    plenty of books out there specifically targeting the artistic part of game development.
    This book is written for those who want to give life to those beautiful artistic
    parts! It is for the magical part of the whole process. It is for the code warrior.


    Since the topics discussed in the book are extremely large in breadth and depth,
    it is impossible to cover every single aspect in one book. Keeping in mind that
    this is intended as an introductory book for the subject, the content discussed
    in the first few chapters are generic to the field of computer science, the rest
    of the book concentrates on game mechanics and how to write computer games.


    What other topic would have such an attraction compared to game design and development?
    The future of Human Computer Interaction is going to be through Virtual Reality
    and Augmented Reality in the coming years. This books will give you the building
    blocks for the pathway to the future.'
