  md: '# Unity 3D – Game Programming Intro


    We have now seen the implementation of a few game mechanics in the Game Mechanics
    chapter and in this chapter we have seen how to create related User Interface
    elements that will support the game game mechanics.


    While you were studying this chapter and going over the UI designs, you might
    have thought to yourself about the plainness of them. This is intentional as this
    book is geared towards game programmers / developers. There is more emphasis on
    the coding and scripting and less on the graphics. Having said that, for those
    who are more creative, you can take what you have learned in this book and apply
    your own creative touch.


    There are some minor enhancements we can do improve our user interface design
    further. This is covered in the next section.'
