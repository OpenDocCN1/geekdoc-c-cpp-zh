  md: "# Unity 3D – Game Programming Intro\n\nIn Code Block 62, we have isolated the\
    \ code responsible for the registration of a hit or a miss by the player. If we\
    \ have a hit, we update the state of the unit board accordingly to the display\
    \ as well the data that represents the board in the 2-dimensional array. Likewise\
    \ we do the same if the attack is a miss.\n\nThere is one last condition we need\
    \ to check, if the player has a hit, then it will be again the player’s turn to\
    \ select the next attack position. Otherwise, we give the turn to the A.I.\n\n\
    ```\nif(Input.GetMouseButtonUp(0)){\n  if (this.playerHadHit){\n    // now we\
    \ capture the true aspect for turn of player vs. A.I.\n    this.PLAYER_TURN =\
    \ this.PLAYER_TURN;\n    this.playerHadHit = false;\n  }\n}\n```\n\n# Code Block\
    \ 63 - Changing Turns after Player's selection\n\nLooking at the scenario where\
    \ it is the A.I.’s turn to attack, the A.I. checks to see if it had a hit from\
    \ the previous move, and if it gets the hit direction, the hit row and the hit\
    \ column. Based on the information provided, it decides where to make its next\
    \ move. After the move we check to make sure we are in the boundaries of the board.\
    \ If not, we recursively call the function to get a new attack position.\n\nIf\
    \ all is well, we grab the player’s unit board data, and check to see if it was\
    \ previously attacked, so if we get a new position.\n\nFinally, we check to see\
    \ if the position selected is occupied, this determines if we have a hit for the\
    \ move. The program performs the necessary accounting, saves the updated data\
    \ into the 2-dimensional array representing the player’s board and the process\
    \ goes to the next step."
