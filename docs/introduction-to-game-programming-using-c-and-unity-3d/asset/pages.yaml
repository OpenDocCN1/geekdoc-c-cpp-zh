    # Script Actions on Collision


    When collisions occur, the physics engine calls functions with specific names
    on any scripts attached to the objects involved. You will need to implement the
    code logic in these functions to respond to the collision event.


    On the first physics update where the collision is detected, the On-CollisionEnter()
    function is called. During updates where contact is maintained, OnCollisionStay()
    is called and finally, OnCollisionExit() function is called indicating that the
    contact has been broken. Similarly, trigger colliders call the analogous OnTriggerEnter()
    function, OnTriggerStay() function and the OnTriggerExit() function.


    # Collider Interactions


    Colliders interact with each other differently depending on how their Rigidbody
    components have been configured.


    # Static Collider


    This is a GameObject that has a collider but no Rigidbody. Static colliders are
    used for level geometry which always stays at the same place and never moves around.
    Incoming rigidbody objects will collide with the static collider but will not
    move.


    # Rigidbody Collider


    This is a GameObject with a collider and a normal, non-kinematic Rigidbody attached.
    Rigidbody colliders are fully simulated by the physics engine and can react to
    collisions and forces applied from a script. They can collide with other objects,
    including static colliders, and are the most commonly used collider configuration
    in games using physics.


    # Kinematic Rigidbody Collider


    This is a GameObject with a collider and a kinematic Rigidbody attached, the IsKinematic
    property of the Rigidbody is enabled. You can move a kinematic rigidbody object
    from a script by modifying its


