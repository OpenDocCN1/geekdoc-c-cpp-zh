  md: '# Unity 3D – Game Programming Intro


    At the moment as you can see, the IDE is pretty uninteresting That''s because
    we do not have anything interesting going on in the designer, it is just a blank
    canvas waiting for your creative ideas! Let''s get a better understanding of what
    each of these regions will be used for in a nut-shell:


    # Scene View


    The Scene View is your interactive sandbox. You will use the Scene View to select
    and position your GameObjects. These includes the player, the camera, your enemies,
    and everything else that will be to generate your level. Maneuvering and manipulating
    objects within the Scene View are some of the most important functions in Unity,
    so it is important to learn how to perform them in an efficient way. As we go
    along the examples, more hints will be provided to improve increase productivity.


    # Game View


    The Game View is rendered from the Camera(s) in your game. It is representative
    of your final, published game. You will need to use one or more Cameras to control
    what the player actually sees when they are playing your game. You can also quickly
    change the aspect ratio of the Game View window to see how your game will look
    on different resolutions and screen sizes. One other great feature of the Game
    View window is that you can actually get the Rendering Statistics which is a great
    utility for checking the performance of your game. This data can be used for optimizing
    graphics performance for complex scenes.


    # The Inspector


    The Inspector displays detailed information about your currently selected GameObject
    and all of the attached Components and their properties. Within the Inspector
    Window, you can modify the functionality of GameObjects in your scene. Any property
    that is displayed in the Inspector can be directly modified. This includes script
    variable. You can also use the Inspector to change properties to see the actual
    result during runtime! The Inspector is another part of the Unity'
