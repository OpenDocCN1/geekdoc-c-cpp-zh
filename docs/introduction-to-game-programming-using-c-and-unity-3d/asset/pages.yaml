    # Global Illumination


    Global Illumination is a system that models how light is bounced off surfaces
    onto other surfaces, indirect light, rather than limited to just the light that
    hits a surface directly from a light source, direct light. Modeling indirect light
    allows for effects that make the virtual world seem more realistic and connected,
    since object''s affect each other''s appearance. An example would be when sunlight
    hits the floor at the opening of a case and bounces around inside so the inner
    parts of the case are illuminated as well.


    Traditionally, video games and realtime graphics applications have been limited
    to direct lighting, because calculations required for indirect lighting were too
    slow so could only be used in non-realtime situation such computer generated films.
    A way for games to work around this limitation is to calculate indirect light
    only for objects and surfaces that are known ahead of time that have no motion,
