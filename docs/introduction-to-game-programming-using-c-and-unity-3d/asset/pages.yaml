  md: '# About the Author


    As a child I was always curious about how things work and what the driving force
    behind them was. This curiosity eventually directed me into the study of Computer
    Science. One of the only fields with unlimited potential for creating everything
    that you can ever possibly conceive of.


    In reality, the ability to create your own world and be able to command the virtual
    and the physical environment is what I wanted to do. How to build and control
    robots, how to make computers think, how to create a simulation and so forth.
    Long story short, that’s my journey began.


    Vahé Karamian holds a master’s degree in computer science, his interest include
    how to enhance Virtual Learning through Virtual Worlds and 3D Environments. He
    has developed and taught computer science courses since 2011. Topics include Introduction
    to Computer Science, Java, C#, Python, Data Structures and Algorithms, Operating
    Systems and Game Design and Programming.'
