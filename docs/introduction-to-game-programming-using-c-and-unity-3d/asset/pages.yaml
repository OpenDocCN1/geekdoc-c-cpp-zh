  md: "# Unity 3D – Game Programming Intro\n\nBy default, when a value type is passed\
    \ to a method, a copy is passed instead of the object itself. Therefore, changes\
    \ to the argument have no effect on the original copy in the calling method. You\
    \ can pass a value-type by reference by using the ref keyword.\n\nWhen passing\
