  md: '# Introduction


    This book is written with two objective in mind, first, to introduce the reader
    to the concepts of programming using C#, second, to put into practice the concepts
    in a fun and entertaining way by developing computer games and game design concepts.


    Even though this is an introductory book, I assume that the reader would have
    some familiarity with computer programming and object-oriented programming with
    the C# language. It is also assumed that the reader knows the basics of the Unity
    3D environment.


    In Chapter 1, the reader is given a brief overview of the concepts of programming
    and object-oriented design terminology. The chapter is intended as a quick reference.
    For those readers who are already familiar with the basics, it will be a nice
    review. For those readers who are just starting out, it will give a good footing
    and hopefully make the topics more accessible as you grow in the field.


    Chapter 2, is an introduction to the Unity 3D IDE environment. The basic sections
    of the IDE are explained. The user is shown how to navigate within the IDE and
    create GameObjects. How to use the tools to translate, scale and rotate a GameObject.
    The Inspector Window is discussed where all of the GameObject components and properties
    can be modified through the designer and many other useful tips and tricks.


    Chapter 3, digs deeper into the concept of GameObjects. How to create them, how
    to add components, existing or custom. Scripts are discussed and shown how they
    can be attached to GameObjects and act as components. The concept of a Prefab
    is introduced and the parent-child relationship within a GameObject is also introduced
    and discussed.


    Chapter 4, the reader is introduced to Game Rules and Mechanics. This is the chapter
    that sets the foundation and rules for game design'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'and development. It discusses the basics of game mechanics that are used in
    all games to an extent. Then several examples are built from scratch to illustrate
    the concepts. Physics, colliders and Rigidbody are also discussed.


    Chapter 5, the reader is introduced to User Interface design, and the new built-in
    architecture for UI design in Unity 5. An overview of the UI architecture is given
    in the chapter and the examples built in Chapter 4 are used to introduce UI concepts
    and demonstrate how to build interesting UIs for your game.


    Chapter 6, discusses a classic game called Battleship. A brief historical background
    is given and the game rules and play are discussed. Then the reader is walked
    through the steps for designing and implementing the game. Game objects, game
    flow, game logic and the user interface are discussed.


    Chapter 7, delves into the C# code that has been discussed and generated throughout
    Chapter 6 and enhanced in Chapter 7. The primary scripts are dissected, functions
    are defined and explained and the User Interface for the game finalized.'
  merge: -1
