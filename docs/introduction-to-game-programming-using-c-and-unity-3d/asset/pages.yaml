    # Message Passing


    Messages, also known as interfaces, describe the communication between objects
    using their accessible interfaces. Message interfaces offer two important kinds
    of protection. First, they protect an object''s internal components from being
    corrupted by other objects. If other objects had direct access to an object''s
    variables and internal methods, eventually one of these objects would handle a
    variable incorrectly or damage the object. An object protects itself from this
    kind of error by hiding its variables and internal methods behind its message
    interface.


    The second and less obvious kind of protection works in the opposite direction
    by hiding its variable and internal methods, an object protects other objects
    from depending on its internal structure. For example they are spared having to
    keep track of each variable''s name, the type of information it contains, the
    amount of space it takes up in storage, and a host of other details that would
    complicate all their procedures for accessing and object''s variables. With encapsulation,
    an object only needs to know how to ask another object for information. All the
    details about how the information is stored are neatly tucked out of sight behind
    the message interface.


    There are three ways to pass messages in C#: methods, properties and events. A
    property can be defined in a class to allow objects of that type to advertise
    and allow changing of state information, such as StartEngine property. Methods
    can be provided so that other objects can request a process to be undertaken by
    an object, such as Accelerate() method. Events can be defined by an object that
    can raise in response to an internal action. Other objects subscribe to these
    so that they can react to an event occurring. One example could be for collision
    detection in the Unity engine framework.


