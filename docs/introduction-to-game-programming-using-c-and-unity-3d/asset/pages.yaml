  md: '# Unity 3D – Game Programming Intro


    # # Game Play


    The game is played on four grids, usually 10×10 – the grids are typically square
    – and the individual squares in the grid are identified by letter and number.
    On one grid the player arranges ships and records the shots by the opponent. On
    the other grid the player records his own shots.


    Before play begins, each player secretly arranges their ships on their primary
    grid. Each ship occupies a number of consecutive squares on the grid, arranged
    either horizontally or vertically. The number of squares for each ship is determined
    by the type of the ship. The ships cannot overlap (i.e., only one ship can occupy
    any given square in the grid). The types and numbers of ships allowed are the
    same for each player. These may vary depending on the rules.


    | Type of Ship | Size |

    |---|--|

    | Aircraft Carrier | 5 |

    | Battleship | 4 |

    | Submarine | 3 |

    | Destroyer | 3 |

    | Patrol Boat | 2 |


    After the ships have been positioned, the game proceeds in a series of rounds.
    In each round, each player takes a turn to announce a target square in the opponent''s
    grid which is to be shot at. The opponent announces whether or not the square
    is occupied by a ship, and if it is a "miss", the player marks their primary grid
    with a white peg; if a "hit" they mark on their own primary grid with a red peg.
    The attacking player notes the hit or miss on their own "tracking" grid with the
    appropriate color peg (red for "hit", white for "miss"), in order to build up
    a picture of the opponent''s fleet.


    The player who successfully locates all their opponent’s ships first by hitting
    each square they occupy is the winner as all ships have been destroyed.'
