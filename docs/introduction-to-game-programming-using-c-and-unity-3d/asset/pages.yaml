  md: '# Vahé Karamian


    and specifying any required method arguments. In C#, every executed instruction
    is performed in the context of a method.


    Methods are declared in a class or struct by specifying the access level such
    as public or private, optional modifiers such as abstract or sealed, the return
    value, the name of the method, and any method parameters. All these together are
    the signature of the method. Method parameters are enclosed in parentheses and
    are separated by commas, empty parentheses indicate that the method requires no
    parameters. The following is an example of a method''s signature:


    ```

    [access modifier] return-type method-name([parameter-type parameter-name[]])

    { /* method-body */ }

    ```


    The syntax elements are as follows:


    +   - access-modifier: determines the degree to which the method is accessible
    by other classes.

    - return-type: the type of variable returned by the method (a method can also
    return an object of a specified class). Your method must return a value using
    the return-type, and it must return a value that matches the return-type.

    - method-name: the name you assign to your method.

    - parameter-type: the type of parameter passed to your method (a method can also
    accept objects of a specified class).

    - parameter-name: the name of the parameter passed to your method.

    - method-body: the statement that perform your method''s task.


    ```

    // The following function takes two floating point data

    // parameters, and returns the sum of the two variables

    // as another float data type

    private float Add(float x, float y)

    {

    return x + y;

    }

    ```


