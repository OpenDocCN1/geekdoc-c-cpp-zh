  md: '# Hinge Joint


    The Hinge Joint groups two Rigidbodies together, constraining to move them like
    they are connected by a hinge. Best example would be a door, but can also be applied
    and used to model chains, and etc..


    A single Hinge Joint should be applied to a GameObject. The hinge will rotate
    at the point specified by the Anchor property, moving around the specified Axis
    property.


    # Spring Joint


    The Spring Joint joins two Rigidbody together but allows the distance between
    them to change as though they were connected by a spring.


    The spring acts like a piece of elastic that tries to pull the two anchor points
    together to the exact same position. The strength of the pull is proportional
    to the current distance between the points with the force per unit of distance
    set by the Spring property. To prevent the spring from oscillating endlessly you
    can set the Damper value that reduces the spring force in proportion to the relative
    speed between the two objects. The higher the value, the more quickly the oscillation
    will die down.


