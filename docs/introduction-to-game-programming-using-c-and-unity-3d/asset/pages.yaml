  md: '# Chapter 5 – Creating the User Interface


    User Interface (UI) design is a very important aspect of any software system.
    After all, this is how your users are going to be able to interact with your applications,
    games and environments. In this chapter we are going to take a look at the new
    UI architecture available with Unity 5. If you have done any development in older
    versions of Unity, you will appreciate the new enhancement that are made in the
    new release of Unity 5.


    User Interface design and development is an art by itself. Just like anything
    else, it takes years of practice and hands on experience to really fine-tune your
    UI designs. There is no science in the design of a UI per-se, however, good UI
    designers tap into other human sciences and art sciences to bring something unique.


    ![](img/4873514db350e34656eaacf188ad9d35_144_0.png)


    Since each UI is going to be unique to the environment you are designing for,
    it will be very important for the UI designer to understand the system inside
    and out. I am not talking about the technical details of how things might work
    internally, but, you should be aware of all of the specifications for the inputs
    and the outputs of the system.'
  merge: -1
