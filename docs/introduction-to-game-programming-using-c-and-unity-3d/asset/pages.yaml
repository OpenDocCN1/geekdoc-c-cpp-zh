  md: '# Unity 3D – Game Programming Intro


    anchored to the parent Rect Transform in various ways. For example, the child
    can be anchored to the center of the parent, or to one of the corners.


    ![](img/4873514db350e34656eaacf188ad9d35_149_0.png)


    The anchoring also allows the child to stretch together with the width or height
    of the parent. Each corner of the rectangle has a fixed offset to its corresponding
    anchor, i.e. the top left corner of the rectangle has a fixed offset to the top
    left anchor, This way the different corners of the rectangle can be anchored to
    different points in the parent rectangle.


    In the Inspector, the Anchor Preset button can be found in the upper left corner
    of the Rect Transform component. Clicking the button brings up the Anchor Preset
    dropdown. From here you can quickly select from some of the most common anchoring
    options. You can anchor the UI element to the sides or middle of the parent, or
    stretch together with the parent size. The horizontal and vertical anchoring is
    independent.'
