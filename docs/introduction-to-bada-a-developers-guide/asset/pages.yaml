  md: '# #2.10 Get geographic data from provider and show map


    # ## Problem description


    You want to obtain geographic information and display it in form of a map on your
    bada device. In addition you want to show the current position of a user on that
    map.


    # ## The recipe


    The following configuration is required.


    | Namespaces used: | Osp::Locations, Osp::Locations::Services, Osp::Locations::Controls,
    Osp::Graphics |

    | Header files to:#include: | FLocations.h |

    | Required libraries: | FLocations, FLocationControls[.lib | .so] |

    | Required privilege level: | Normal |

    | Required privilege groups: | LOCATION, LOCATION_SERVICE |


    The namespace `Osp::Locations` contains among others the classes `Location` and
    `Location`, which we will use in our recipe. With the `Location` class you can
    define where you want to get a position from (e.g. from the GPS sensor). This
    class also implements the interface `ILocationListener`, which gives you information
    about location updates. The class `Location` representing the location information
    is a part of `LocationProvider`.'
