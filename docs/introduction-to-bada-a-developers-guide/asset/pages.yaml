    AES using AesSecureRandom class, DES using DesSecureRandom and 3DES using DesEdeSecureRandom.


    These functions generate cryptographically secure random numbers (CSPRNG) which
    can be used in bada to generate secret keys using the SecretKey, SecretKeyGenerator
    and related interface classes. A secret key could be used for password protecting
    a file, for example.'
