  md: '# 4.2.4 C++ pitfalls


    Coming back to native development, the C++ environment is modern, straightforward,
    and comprehensive. It is supported by standard, open tools including the Eclipse
    IDE and GNU/CodeSourcery C++ compiler ^44


    The pitfalls of C++ on constrained devices are well-known. It''s fair to ask if
    mobile platforms really still be considered constrained, at least by the standards
    of the old definitions, in these days of 1 Ghz processors and multi-gigabyte memory.
    (See Wave specs).


    The answer is that mobile is entirely constrained relative to the desktop, in
    all respects from CPU capability to available RAM to screen size and network bandwidth.


    But also, there are *absolute* constraints on mobile. Let''s not go through all
    the differences again (we looked them in Chapter 1), but on mobile resources are
    critical in the following:


    +   * Memory - size and speed (e.g. flash, no HD)

    * CPU

    * ROM

    * Battery/power

    * Network bandwidth


    The power and flexibility of C++ comes at a price. The most critical issues are:


    +   * Memory management, which the application must manage for itself, in contrast
    with languages that provide garbage garbage collection to reclaim allocated memory
    that is no longer in use


    > ^4 From C http://www.codesourcery.com -- Sourcery G++'
