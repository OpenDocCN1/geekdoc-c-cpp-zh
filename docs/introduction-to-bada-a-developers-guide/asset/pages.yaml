  md: '# 3.3.4 Colours


    Finally, to complete this survey we will look briefly at the Color class.


    Although colour values may not seem to be universally relevant as, say, String
    or Number types, most apps - in fact, all apps - are clients of the graphics classes
    which define colours, and every app developer should have at least a good, casual
    understanding of how colours are used and manipulated in bada.


    Mobile phones have come a very long way from the early, monochrome (or green-screen,
    text-based), devices that at least some of us remember from the early days of
    our careers in mobile development.


    In fact, Samsung is a technology leader in screen technology and has consistently
    driven phone specifications towards the high end, breaking new ground with HD
    (High Definition) and, recently, AMOLED technology (Organic Light Emitting Diode).
    Phones like Wave have physically big screens with high pixel density and bright,
    high-contrast, outdoor-readable screens with vibrant, dazzling colour.


    With the widespread availability of hardware graphics acceleration and shader
    support, UI effects like transparency, animation, and full-3D are now possible
    on phone displays, which were just a few years ago they were unthinkable.


    Interestingly, AMOLED technology has brought device displays into the power-management
    equation in a surprising way. Unlike standard LCD technologies, OLED use active
    pixels for which power requirements vary depending on the hue displayed by the
    pixel. Quite literally, darker colours are cheaper (in power usage) than lighter
    colours, meaning that UI designers can add power-usage to the list of factors
    determining their design choices for app palettes and colour schemes.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'In bada, colours are defined using the ARGB colour model, which uses Alpha
    (i.e. transparency), Red,

    Green, and Blue values.


    > Note: not all graphics objects have an alpha channel. Bitmap and Canvas both
    do, and both therefore support alpha blending.


    The Color class provides useful built-in functions including:


    +   - Setting and getting colour components for or from a Color object, with values
    for all ARGB or

    specific colour values (and alpha), as well as a 32-bit colour value

    - Predefined ten-colours


    All colours are 32-bit entities supporting 24-bit "true-color" or "millions of
    colours" display, with 8 bits

    for each red, green, blue, and alpha data. If a device display supports a lesser
    physical bit depth, then

    colours are down-sampled, resulting in a loss of quality. Pixels, by the way,
    are always square on bada

    phones.


    > Note: bada uses 32-bit ARGB color by default. Each channel (ARGB) occupies 8bits.
    However if the

    device supports only 16-bit for the colors, RGB occupies 5bits, 6bits, and 5bits
    respectively. This means

    colors are down-sampled.'
  merge: -1
