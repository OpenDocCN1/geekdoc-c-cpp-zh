  md: '# 3.3.2 Graphics primitives


    As you would expect, bada provides a comprehensive set of graphics primitives.
    These are always drawn to a Canvas object. The Canvas supplies the graphics context
    for the primitives that are drawn to it, in the form of the settable Canvas attributes
    shown. You can set and reset these dynamically at any time in your drawing code.
    The Canvas you draw may be either one you explicitly construct, or one you request
    from an appropriate Control.


    The Point, Dimension, and Rectangle classes are used to construct the various
    graphical primitives.


    # Point


    A two dimensional point composed of X, Y coordinates


    # Dimension


    An X, Y ordered pair of (width, height)


    # Rectangle


    An rectangular region with a top-left point (X, Y) and a width and height.


    Shapes are always constructed from the top left corner, which is the (0,0) point
    of the local coordinate space.


    # Simple shapes and text


    Note for simple drawing of shapes and text, all the work is done by the Canvas.
    You do not need to explicitly create shape, line, or text objects; instead, set
    Canvas attributes and invoke a dedicated drawing method of the Canvas object,
    for example:


    +   1. Construct a canvas:


    ```

    Canvas::Construct()

    ```


    +   2. Clear the canvas:'
