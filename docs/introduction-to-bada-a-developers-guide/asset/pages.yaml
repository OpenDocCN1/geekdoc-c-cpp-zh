  md: '# 5.3 Services in detail


    You should now have a general understanding of bada server associated services.
    It is time to understand how to use these features. Let''s start with location
    services.


    # 5.3.1 Location as a service


    A key distinction between the mobile application and the convention application
    is the location feature. Majority of modern smartphones are equipped with GPS
    transceivers. Devices are aware of location changes all the time. Mobile developers
    could utilize the real location data to make function-rich applications, such
    as FourSquare, Loopt.


    The bada platform provides several types of Location based service discussed at
    the beginning of this chapter. Now we will examine each of them, and give you
    a deeper view. Before we start, let''s think of a user case: imagine you want
    to make an application to give directions to a user''s next Starbucks based on
    their current location, and show it on a map. Simple, right?


    To search a particular landmark, you can use the directory service or remote landmark
    service provided by bada. In this chapter we show how to use the directory service.
    As mentioned in the previous chapter, all development on bada is related to: service
    provider (e.g. IDirectoryServiceProvider interface), listener (e.g. IDirectoryServiceListener
    interface) and handler (e.g. OnDirectoryReceivedN method).


