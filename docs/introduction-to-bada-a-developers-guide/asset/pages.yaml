  md: '# Summary


    Selected important classes:


    +   - IDirectoryServiceProvider

    - IMapServiceProvider

    - IRouteServiceProvider

    - ProviderManager


    This namespace provides support for geographic information services: maps, geocoding,
    directory and route services. The starting point for implementing these services
    is the ProviderManager class which retrieves information about the service providers
    available to the device and allows the application to choose the one that provides
    the appropriate services.


    Support for map services is provided by a set of interface classes to get map
    information and render the map. The IMap interface implements dynamic maps from
    the service provider, supporting features such as panning and zooming, the user
    interface to which is handled by classes in the Locations::Controls namespace.


    # Route and directory services


    The Route Service is implemented by the IRouteProvider and IRouteServiceListener
    allows the application to request a route, given a set of waypoints- which must
    consist of a minimum a start and destination- and parameters such as mode of transport
    and whether the route is the fastest or shortest. The application is returned
    a list of Routes, which contains a set of coordinates representing the route and
    information such as length, estimated travelling time and a set of RouteSegments.
    The application could then display this information on a map, to provide services
    such as by turn directions. The classes which provide the Route Service are shown
    in Figure 6.16.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    ![](img/864ad06741e6f2ddc308988094c37b2f_223_0.png)


    Figure 6.16 Classes which manage the functionality of service

    in in Locations: :: Services


    The Directory Service allows application developers to implement a user friendly
    search for products and

    ervices within a specified geographic area - coffee shops within a certain city,
    for example. Developers

    put together their search request with the methods of IDirectoryServiceProvider
    and process

    the response asynchronously using IDirectoryServiceListener. The search results
    are returned

    as a list of Landmarks. Underpinning these services is the Geocoding service,
    which converts an address

    to geographic coordinates and versa.


    > Note: to make use of these services, you will need an account with a geographic
    information services

    provider such as DeCarta (www.decarta.com), which is the currently supported map
    provider by bada.


    However, you can provide access to maps in an application using the Web::Control
    class

    and websites such as www.googlemaps.com.


    73'
