    # Virtual path prefixes on bada phones


    | Path | Description | Permissions |

    |---|---||

    | /Home | Home directory for an application | r/w |

    | /Home/Share | Used to share temporary data with other applications | r/w |

    | /Share/[appid] | Used to read temporary data of other applications | r |

    | /Res | Used to read resourcefiles, such as the icon file that was shipped with
    the app. | r |

    | /Share/AppControl/[appcontrol-name] | Used to read data provided by an app controlby
    its name. | r |

    | /Media/{Images,Sounds,Videos, Themes,Others} | Used to read mediata likeimage,
    sound, video, theme,and so on. | r |

    | /Storagecard/Media/{Images,Sounds, Videos,Themes,Others} | Used to read media
    data in external memory like image, sound, video, and so on. | r |


    The paths are defined by the Osp::io namespace as part of the data caching policy
    which is enforced for bada apps, and ensures that an app''s private files cannot
    be read or written by other apps, and that files stored in read-only locations
    cannot be over written (even by the owning application).


