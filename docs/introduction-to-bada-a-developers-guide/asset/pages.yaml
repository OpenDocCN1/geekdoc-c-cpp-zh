  md: '# Introduction to bada: a Developer’s Guide - (draft preview, July 2010)


    Included in the description of most namespaces in this Chapter are one or more
    UML diagrams, designed to show the most important classes in each namespace and
    the relationship between them. We have included as many classes as possible in
    the diagrams, but for clarity in some cases we have just focused on the key classes
    within a particular namespace. In a few cases, there is no UML diagram at all,
    because the namespace isn’t interesting, but because the classes are mostly contained
    and a diagram will not add much to the description.


    If you’re not a UML aficionado, there’s no need to panic. We’ve used just enough
    UML in this chapter to show how the important classes in each namespace fit together.
    For a refresher on UML syntax, please see the appendix for a UML primer.


    # Libraries, headers and privileges


