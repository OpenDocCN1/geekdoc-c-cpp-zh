    # 4.3.3 Using Buffers


    Just as Strings always be used instead of native C-style null-terminated character
    arrays (because Strings are inherently Unicode, and size-checking means that they
    cannot overflow), the Buffer class is preferred to native, C-style arrays.


    Buffers are container classes that wrap arrays (sequences) of C++ primitive types,
    for example int, long, double, and char. (Compare with strings which are sequences
    of non-primitive type, Character.)


    Buffers provide absolute and relative indexing, as well as a mark that stores
    an index.'
