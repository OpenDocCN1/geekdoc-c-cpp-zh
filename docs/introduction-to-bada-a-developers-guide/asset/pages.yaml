  md: '# Chapter 5: Exploring bada server


    In this chapter, we will explore some of features provided by the bada server.
    As you may know, the bada platform is not limited to providing features only on
    devices, but also server associated features. These are key and unique features
    compared with other mobile platforms on the market. The bada platform provides
    its devices with a remote server infrastructure as a means of easy integrating
    web services. And it provides a full mobile application eco-system to its developers.
    This chapter is dedicated to these service-centric features.


    This chapter is divided into three sections: the first section gives overview
    of all services; the second section gives the big picture of communication between
    devices and the server; the last section is a practical section with some examples
    of using these services.


    Through this chapter, you will learn how to utilize these features in your own
    applications.


    # 5.1 What are the services?


    When you downloaded the bada SDK, you may come cross some namespaces such as Osp::Commerce::Store,
    Osp::Locations::Services, Osp::Social::Services and Osp::Content. Actually they
    are referring to services provided via the bada server. There are some other namespaces
    which also contain features provided by the bada server, such as Osp::Security.
    These are the services we will discuss in this chapter. Let''s look into each
    of these services.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# 5.1.1 Location Service


    The location service allows developers to utilize features such as displaying
    a map, geo-coding an address, finding points of interest (POI) and searching routes
    from one place to another.


    The bada platform provides developers with easy APIs to integrate different location
    service providers. There are also other nice features available from the bada
    location service that are social related. It is possible to request location data
    in the form of GPS measurable parameters. This positioning data can be for yourself
    or for few individuals who have allowed their position to be monitored by you,
    via the bada server. In addition, it is possible to finely tune this data for
    location reporting when subject either enters or leaves a specified region. Users
    can store their personal landmarks on the server. We will explain these features
    in detail on chapter 5.3.


    > Note: during the time of writing of this book only DeCarta is integrated as
    map provider in the bada platform.


    # 5.1.2 Social Service


    Social networking has become a popular feature of current mobile applications.
    Without exception, the bada platform also provides fully functioning social services
    including profile management, buddy management, privacy management, messaging
    and Social Network Service (SNS) Gateway.


    The Social service allows applications to create, share and manage information
    from bada user profiles. Applications can also manage buddies between bada users.
    The relationships between buddies are stored on the server. bada apps that use
    the buddy service can make use of these relationships.


    For latest information, please check the latest status from developer.bada.com.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Profiles


    Profiles can contain data such as names, gender and marital status. More data
    can be added, but may be subject access controls for privacy. The owner of a private
    profile must grant permission for another to view it. Custom profiles can be created
    to hold specific data.


    Communication and collaboration can exist between profile ‘associates’ through
    the use of messaging exchange services.


    # Buddy lists


    A buddy describes the confirmed relationship between users of the bada server.
    The relationship is initiated by a request and is only established following acceptance
    of the recipient. A bada app, for instance, can fully manage and categorize the
    buddies of an individual based on the closeness of the relationship.


    It is also possible to communicate your buddies via the bada messaging server
    using messaging APIs. Finally you can integrate 3rd party social services into
    your bada applications utilizing the unique feature of the bada SNS gateway.


    # 5.1.3 Content Service


    When we mention the word ‘content’ here, we are referring to the media content
    such as images, audio and videos. There are two types of contents described in
    Osp::Content namespace, content on device side and content on server side. As
    this chapter is dedicated to bada service-centric features, we will only explain
    the server side contents.


    Basically bada content service allows developers to create, read, update and delete
    (CRUD) contents on the server. It is also possible to search contents and set
    the access level of the server remotely. By using the content service, developers
    can not only manage content itself, but also manipulate the metadata of contents,
    such as thumbnail information, geo-tag information, and basic file information.'
  merge: -1
