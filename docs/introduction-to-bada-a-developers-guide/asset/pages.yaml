    As with the graphics primitives, Bitmaps represent pixel data and are displayed
    by drawing the Bitmap into a region of a Canvas, and showing the Canvas.


    > Note: Graphics provides the alpha blending functionality only for the Canvas
    which has an alpha channel.


    Because every image has a ''real'' size (the size at which it was created), which
    may or not be the size at which you wish to display it on the phone, decoding
    from an image file supports image scaling. Other transformations, for example
    rotation, can be performed when the image is drawn to the Canvas.


    Bitmaps can also be clipped to regions of the Canvas, as a separate step from
    sizing and positioning the screen region (which must always be a rectangle) to
    which they are drawn.


