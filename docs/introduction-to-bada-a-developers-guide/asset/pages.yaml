  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    +   - The /inc and /src folders are where the generated C++ code files for your
    project are saved;

    - .h files in /inc and .cpp files in /src

    - The /Home folder is the filesystem root for any data files or folders your app
    reads or writes

    - The /Icons folder is where you should store the icons used by your app, and
    it''s where Wizard chooses the default app icon – which you should change for
    your own, of course, when you create a real project

    - The /Res folder is where application keeps resources that it uses. You will
    see how resources are used when we create the BuddyFix UI.


    Note that /Icons, /Home, and /Res are also created as folders on a real device
    when you install your app. On a phone, /Home, /Icons and /Res are read-only “system”
    locations, while /Home is readable and writeable, and private to your application.


    > Note: in the IDE, the Project Explorer also shows an /Includes folder, which
    is a virtual folder that maps all paths for your project. It is not a physical
    folder in your Windows filesystem. Project Explorer also hides some files that
    you will see in your Windows filesystem, with names like .badapr, .project, and
    .project. These are standard Eclipse house-keeping files which you can ignore.


    Table: Project folders generated by the wizard


    | /Home | Root folder of the application data area, which provides dedicated (and
    protected) file system storage. The folder is empty until the app creates and
    saves file data, but always exists, even if not used by the app |

    | /Icons | Contains default .png icon and splash screen files, which you replace
    with your own custom graphics |

    | /Res | Contains all resources used by the app, typically Forms and Strings.
    Forms are defined by XML definition files, and partitioned into display resolution-specific
    sub-folders if you choose to target phones with different display resolutions.
    For BuddyFix, the supported resolution is 480x800 pixels i.e. QVGA |

    | /inc | Contains the skeleton app''s .header file |

    | /src | Contains the skeleton app''s .cpp files, including an Entry file which
    defines the app entry point to the Framework. This is generated code which you
    will not need to modify |'
  merge: -1
