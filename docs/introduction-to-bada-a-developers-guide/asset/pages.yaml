  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    by the system, but that will usually indicate a serious error of some kind. In
    either case, when your app transitions to terminating, its OnAppTerminating()
    method will be called, and you should prepare to close; release all resources,
    and possibly save state if relevant (but typically not user data – which should
    always be saved at the point of change).


    When your app runs, it will launch into the Initializing state, which is the difference
    between its being terminated, and being put into background.


    # 3.1.6 Terminated


    Your app is no longer running.


    # 3.1.7 A note about frameworks


    The great thing about frameworks is that they enable your app to take advantage
    of ready-made behaviour. Because bada''s language is C++, bada''s frameworks use
    C++ inheritance to share behaviour between the frameworks and your app. If you
    know your C++, then you''ll probably know (at least approximately) how that works,
    but it doesn''t matter if you don''t. The principle is simple: the frameworks
    declare methods that your app must implement; the frameworks will call these methods,
    and when they do, your implementations will run.


    The bada C++ frameworks use derivation and virtual functions to share responsibilities
    between the framework itself, and apps that use the frameworks. The framework
    base classes that derive provide ready-made implementations of common behaviour
    that all apps share, as well as behaviour defined in virtual methods that may
    optionally be overridden, and abstract behaviour defined in pure virtual methods
    for which the derived class must provide an implementation.


    Abstract classes are used extensively in bada, particularly to define interface
    classes. See Chapter 4 for more about interface classes and how to use them.


    > Note: in C++, derivation (i.e. inheritance) is the generic mechanism that allows
    derived classes to share the behaviour of base classes; and specifically, virtual
    functions (dynamic binding) allow derived classes'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Introduction to bada: a Developer''s Guide (draft preview, July 2010)


    to extend the behaviour of base classes by *overriding* the base class behaviour.
    Overriding is not the same as *overloading*, in which methods with the same name
    but signatures are allowed, and the references are resolved at compile time; virtual
    methods use the `virtual` keyword and have the same name and signature, and the
    references are resolved at runtime.


    In C++, *pure virtual methods*, also known as abstract methods, are declared with
    a special=`0;` syntax that indicates the method has a null body i.e. no code won''t
    link until an implementation is provided.


    Pure virtual methods in the base class *must* be implemented by a derived class;
    other virtual methods of the base class have a base class implementation, but
    optionally may be reimplemented by a derived class to override the default behaviour.


    # 3.2 Using the UI Framework


    Implementing the application lifecycle effectively and appropriately is one important
    aspect of making the best use of the bada frameworks. A second is using the GUI
    frameworks to create an effective, good-looking, and easy-to-use GUI. TouchWiz
    on bada has a host of nice features, and the built-in apps showcase them well.
    In the following sections we take a deeper look at bada''s control and graphics
    classes, which provide the building blocks for creating the app GUI.


    > More precisely, a derived class that will be instantiated must implement the
    pure virtual of its base class(es). Chains of abstract classes are possible, but
    a class that does not implement an inherited pure virtual is itself an abstract
    class that cannot be instantiated.'
  merge: -1
