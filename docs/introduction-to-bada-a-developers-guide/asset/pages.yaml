  md: 'from this sensor: weather, your current location on the planet, and most influentially
    nearby magnetic fields, such as magnets or electric coils.


    The magnetic sensor uses the phone as a fixed frame of reference as indicated
    in the figure below and models this into the 3-axis Cartesian coordinate system.


    ![](img/864ad06741e6f2ddc308988094c37b2f_315_0.png)


    **Figure 2.9.1** Magnetic field related to the device


    For this example we use the **SensorManager** class and the **EventListener**
    interface both from the namespace Osp::Uix. The SensorManager class provides the
    functionality for adding and removing listeners, checking if a sensor is available,
    setting intervals and getting the max and min intervals. A bada device can have
    various sensors (for example, an acceleration sensor, GPS sensor, or proximity).
    The **SensorManager** supports simple access of built-in sensors in a device.
    By registering a listener to the **SensorManager**, an application can get sensor
    data with a timestamp based on definable intervals.


    In our example we define a class that inherits from the **EventListener** interface.
    Below you can find a sample header file that contains all the signatures of the
    methods we will show in this recipe.'
