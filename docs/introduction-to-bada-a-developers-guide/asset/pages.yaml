    L"ClientName=username;Client Password=pwd";

    HostUrl=http://developer.kr.dz.decarta.com:80/opens";


    IDirectoryServiceProvider *pProvider =

    dynamic_cast<IDirectoryServiceProvider>(ProviderManager::ConnectToServiceProviderN(providerName,
    LOC_SVC_PROVIDER_TYPE_DIRECTORY, extraInfo);

    ;

    ```'
