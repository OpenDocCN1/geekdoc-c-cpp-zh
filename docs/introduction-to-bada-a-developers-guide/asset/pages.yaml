  md: '# # Chapter 6: bada Namespaces


    Namespaces in C++, like packages in Java, or import modules in Python for example,
    are a language-level mechanism for partitioning the global program namespace.
    In C++, namespaces can be thought of as a top-level encapsulation mechanism.


    In bada, namespaces provide a mean for structuring the system at a programming
    level into well-defined, logically coherent, functional subsets.


    Each namespace declares a discreet subset of the classes that make up the bada
    class library.


    In all, bada contains twenty primary namespaces within the top-level *Osp* namespace,
    which encapsulates all bada third-party APIs. Around half of the primary namespaces
    contain one or more nested namespaces, for a total of over thirty namespaces beneath
    the *Osp* root namespace.


    The rest of this chapter summarises each individual namespace.


    # **What you will learn**


    This chapter walks through the bada namespaces to highlight the most important
    features of each, and to place each in the bigger context of the platform as a
    whole. It will provide you with:


    +   1. an overview of how the bada platform is partitioned into major functional
    areas

    2. an understanding of what contribution to the overall system is made by each
    namespace


    You''ll know where the interesting functionality is, and how to access it.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# What you will need


    To get the most from this chapter, keep your editor open and browse the header
    files which are mentioned, which in almost all cases contain useful commentary
    and code examples.


    # 6.1 using directives and declarations


    If you are not familiar with namespace syntax in C++, don''t despair; it is very
    straightforward.


    To use the classes and other definitions from a given namespace in C++, you must
    include either a directive to declare all names from the namespace that you want
    to be available in a given source file, or qualify the names of individual identifiers
    as they occur in your code using declarations.


    Where *somenames* is a namespace, a directive has the form:


    +   * *using namespace somenamespace;*


    And where *someidentifier* is an identifier (a class name, say, or enumeration),
    a declaration has the form:


    +   * *using somenamespace::someidentifier;*


    For example:


    +   * *using namespace Graphics;*'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'makes the Graphics namespace available to all code that follows it, allowing
    access to Graphics classes

    like Canvas and Bitmap.'
  merge: -1
