    # 2.2.2 Standard elements of a Form – Indicator Bar, Title Bar, Soft Keys, Option
    Menu


    A Form occupies the full physical display area of the phone – everything visible
    on the screen. Forms therefore also include some standard system elements. These
    are:


    +   - The Indicator bar at the top of the display area, used to display system
    icons (like signal and battery strength) and notifications (whether you have unread
    messages)

    - The Title bar that displays the current application name

    - Soft keys that are displayed in the command area at the bottom of the main display

    - The Option menu key, displayed at the bottom between the soft keys, used to
    launch Option menu'
