    SnsGateway


    The SnsGateway class manages one of the most powerful features of the Services
    namespace, allowing you to create applications that can easily communicate with
    social networking sites such as Facebook, Myspace and Twitter and retrieve information
    such as pictures and status updates all from your application. All you need to
    do is use the SnsGateway class and related classes such as SnsAuthenticator and
    the low level work of connecting to and retrieving information from the various
    social networking sites is taken care of you by the bada server.'
