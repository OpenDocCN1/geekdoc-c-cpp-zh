    # 2.5 The App Icon and other properties


    There is only one more thing to do to complete our app skeleton. Every app needs
    an icon. As we saw, the icon is displayed in the Main menu, and provides the mechanism
    for the user to launch your app.


    The app icon is defined as a property of the app project, and is easy to set.
    Select your project in **Project Explorer**, and select **Project | Properties**
    from the main menu to launch the **Properties** dialog.


    Expand the **bada Build** item and select **Application Information**.


    Here we can see some basic defining information for BuddyFix.


    To add an icon, you will need to create the graphic of course. If you browse the
    file properties of the default icon (in Windows Explorer, for example), you''ll
    see the following:


    | File Type | PNG |

    | --- | --- |

    | Size | 100x96 pixels |

    | Resolution | 72dpi |

    | Bit depth | 32 bit |


    Create an icon in your favourite graphics application, and add it to the **/Icons**
    folder.


    Select the **File System** button beside the **Main Menu** to browse the **/Icons**
    folder choose the app icon of choice. Select ''OK'' to save. Next time you launch
    the Simulator, your chosen icon will display in the Main menu. (You do not need
    to rebuild for the change to take effect.)


    > Note: no effects are applied to the icon, for example rounding or bevelling
    (other than dimming to indicate selection). You should create your icon with any
    effects that'
