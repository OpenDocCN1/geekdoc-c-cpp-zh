    # # 2.2 The application UI


    We''ve said that a bada application can be thought of as a GUI that does something,
    where the GUI is the public face that your app shows to the user. Before getting
    down to practicalities and showing you how to build a simple GUI, let''s fill
    in some background.


    Depending on its complexity, an application may require only one screen – a simple
    calculator layout, for example, for a Calculator app. Or it may require multiple
    screens like an Address Book app, which might organise its main screen as a scrolling
    list of name and address entries, with a details to display details of a single
    complete entry, and editing screens to enable editing of entry details, labels,
    and so on.


    Getting your GUI design is one of the most important tasks you''ll face as an
    app developer. Lots has been written about the art of good UI design, and a lot
    has been written about the special case of mobile UI design.³ Two attributes that
    characterise the set, are fanatical attention to detail and ruthless simplification.


    > Get hold of Scott Jensen''s The Simplicity Shift, if you don''t already know
    it (Cambridge, 2002). A classic mobile case study is Lindholm et al. Mobile Accessibility
    (McGraw-Hill, 2003). Ballard, Designing the Mobile User Experience (Wiley, 2007),
    is a good overview text. And no app developer should be without Bill Moggridge,
    Designing Interactions (MIT, 2007). There''s also a wealth of material on the
    web that discusses the general'
