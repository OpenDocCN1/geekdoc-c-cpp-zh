- img_proc: true
  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    You can think of everything your app displays as being organised in a hierarchical
    tree. The root of the tree is the application Frame. Within every app, the Frame
    is the top-level container to which all GUI elements are added. More formally,
    the Frame encapsulates the device display, and plays the role of the application''s
    top-level window, of which there is exactly one per application. All applications
    have a Frame, and you don''t need to do anything anything to create it or set
    it up. It''s all taken care of by the framework.


    Within the Frame, what the GUI displays is based on a simple metaphor of Forms
    as containers for standard GUI elements. A Form implements a single application,
    and an app can include as many Forms as it needs to build a complete GUI. Each
    Form is a layout container that is populated with Controls, which are the individual
    GUI elements required to construct the behaviour – buttons, lists, pop-ups and
    so on – and any other graphical elements, backgrounds, or images which make up
    the screen''s design. Controls are either standard controls that are ready-made
    by the framework, or your own derived custom controls. The Control class abstracts
    a screen region, both for display and capturing input.


    Naturally, bada provides comprehensive graphical primitives, bitmaps, animations,
    and fonts, so the real limits here are your imagination – and your design skills!
    The relationship between Frames, Forms, and Controls is shown in Figure 2.8


    > ⁴ To be precise, there is a limit of thirty Forms per app, but this is not a
    limit you should expect to encounter!


    > ⁵ Under the hood, the raw horsepower for bada''s graphics capabilities is based
    on OpenGL ES, with support for 2.0 (hardware acceleration and hardware shaders)
    and 1.1 standards (hardware acceleration only). The OpenGL ES version available
    is device dependent. It is also possible that at the low end, some bada phones
    will not support OpenGL ES at all. Apps that require OpenGL ES will not install
    on phones that lack appropriate support.'
  merge: -1
