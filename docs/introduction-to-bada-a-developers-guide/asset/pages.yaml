  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    ![](img/864ad06741e6f2ddc308988094c37b2f_28_0.png)


    Figure 2.9 The application name and system elements


    All of these elements are defined as properties of the Form. The decision whether
    to display all or some of these elements are made by each Form, and is therefore
    under the control of the application that defines the Form. However, the look
    and feel of these screens (and in the case of the Indicator bar, its contents)
    is not directly controlled by the app. Although the Form displays these elements,
    the framework retains control of them.


    # 2.2.3 Handling events


    We said that Controls abstract a screen region, for display and input, but we
    didn''t say how. Input events include input from the touch screen, including menus
    and soft keys, from the physical phone keys including side keys like Lock or Camera,
    from gestures and raw sensor events, from bada system events – potentially from
    any type of event.


    Listeners are the glue that binds behaviour presentation in a bada app. Listeners
    provide the mechanism for all event handling. At any time, exactly one has “focus”
    in the GUI. “Focus” just means, which object is actively updating the display
    and receiving user and system GUIs. Conceptually, focus belongs to the currently
    active control of the running foreground application. Events are cascaded down
    through the hierarchy of UI controls belonging to that application, starting with
    its Frame,'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    then the current Form, and so on, until the currently active control is found.
    This Control receives any input events that occur (and by the way, also, initiates
    redrawing the display).


    Every Control has built-in listeners for the basic event types it recognises.
    Depending on the control, these might include any of the following:


    +   * Focus events

    * Key events

    * Touch events

    * Drag and drop events


    Many controls then add their own, control-specific listeners. For example, slider
    controls recognise the slider-specific “adjustment” event, which reports how far
    the slider has been moved.


    Also, many controls share an ''action'' event listener, which responds to specific
    events generated by the UI framework, including:


    +   * Button and CheckButton events

    * ContextMenu and OptionMenu events

    * Tab events


    # 2.2.4 Summary


    Let''s sum the essentials. The application Frame, and the Form or Forms it contains,
    and the Controls that populate the Forms, are the building blocks from which a
    bada application constructs its GUI:


    +   * Each application has a single Frame, which abstracts the device display

    * Frame is the root object of the app GUI

    * A Frame contains one or more Forms (usually – a special case is a full-screen,
    also known as Frame-based, app, which contains no Forms; instead it draws its
    graphics directly)

    * A Form is the highest level container object after Frame, and defines one complete
    application screen'
  merge: -1
  pgno: 29
- img_proc: true
  md: '+   * Arbitrary Controls can be added to Forms

    * Listeners are added to Controls to hook events the app wants to respond to


    # # 2.3 UI Builder


    Now we know what''s in a GUI, let''s build one. The WYSIWYG, UI Builder tool makes
    it easy to create a basic GUI layout, using standard controls. UI Builder will
    also generate the underlying class source code for the controls we define. Only
    a small amount of hand coding will then be required to hook up the UI layout and
    controls with the application skeleton we have already created.


    # ## 2.3.1 A simple UI


    BuddyFix is a single screen application, with a simple list-based presentation.
    The UI design is based on the requirements summarised in the box below. If this
    was a fully-fledged commercial app we would want something than this simple spec;
    but it''s enough for our purposes, as an exercise in defining basic but realistic
    application functionality, and showing how to implement it in bada.


    | The BuddyFix UI |

    | BuddyFix is a simple app that enables a simple use-case. It enables a user to
    share periodically updated location information with a list of friends in order
    to converge real-time on a meeting place. |

    | To do so, BuddyFix uses the Buddy service that bada provides as a service API.
    |

    | BuddyFix displays a list of buddies, with the following information displayed
    for each buddy: |'
