  md: '# Chapter 1: The mobile difference


    In this chapter we present detailed information about what the ''difference''
    of mobile software is made up of and we describe the essential characteristics
    as opposed to ''conventional'' fixed software for desktops or web applications.
    We also summarise some recommended mobile software development-practices. Where
    appropriate we give forward references to later chapters where we deal with specific
    topics and how bada implements or supports the various aspects of development.


    # 1.1 The mobile context


    20 years from the birth of mobile, hardware and telecoms have changed out of recognition
    – mobile usage has changed the way people behave. The exploitation of mobile services
    has hardly begun. The apps revolution of last few years, dominated by iPhone,
    is a signpost – but the real revolution will be the arrival of apps and services
    for the mass market. bada could be the game changer.


    With the bada platform and the accompanying ecosystem we pick up the characteristics
    of mobile app development as you will see in this chapter and throughout the book.
    By using bada, you will be equipped with a proper environment and tools that lay
    the ideal foundations for your successful mobile applications.


    Mobile hardware is different from desktop hardware. It''s not just that mobile
    phones fit in your pocket. The relentless drive to fit more and more functionality
    into tinier and thinner packages has led to almost continuous innovation. Mobile
    storage (memory), mobile display, and mobile power technologies are different
    from their big brothers on the desktop. When you are developing for mobile, it
    is essential to understand how these differences can impact the way you design
    your apps and how you write your code.


    But to some extent these differences are only skin deep, they are not really differentiates
    mobile from fixed. Users use mobile differently. Users consume mobile services
    differently. Users buy and pay for their mobiles and mobile software differently.
    In fact this is a crucial difference – that users are'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    willing to BUY mobile software! Again, these differences impact the way you design
    your apps and write your code.


    Take mobile services. We can differentiate between types of services that are
    only meaningful in a mobile context and others that are traditionally used in
    fixed or web browser-based environments and can now be extended to the mobile
    dimension.


    Take location-based or map services as a representative example for the former
    group. The idea of location-based services (LBS) have been around for over a decade
    now. The added-value of such services is clear and unchanged. It is the provision
    of information that is related to a user''s current position and addresses an
    immediate need. Services and information can be delivered according to specific
    locations. Only a few such services, however, turned out to be big hits. Technology
    and the whole ecosystem just was not back then. Today, however, everything is
    prepared such that LBS could deliver their promise.


    An example for the second group is the booming social network services (SNS) stemming
    from the Web 2.0 movement that gave birth to blogs, facebook, MySpace, YouTube,
    Twitter, you name it. Such applications and social networks can now be increasingly
    invoked and used from mobile handsets either by web sites customised for mobile
    browsers or standalone apps.


    This suggests how different mobile apps can be from desktop applications. On the
    desktop, your wordprocessor or spreadsheet or database application, and your first
    person shooter or adventure game, are big, complex, kitchen-sink type applications;
    do everything, integrate with everything, and each would be very happy if it was
    the only application you needed. Mobile apps are almost the opposite of this –
    they are small and focused pieces of software. (Are they complex? We will see…)


    Regardless of which type, software for mobile devices that can provide such added-value
    is we refer to as mobile software. To deliver a successful mobile solution the
    specific characteristics must be respected such as hardware constraints, different
    ecosystem structures (like much shorter lifetime and hence shorter time to market),
    or diversified types of usage context (user experience). Ideally, the added value
    of mobile software in all application areas is directly addressing a need or the
    increase of comfort. This can mean an optimisation for users in terms of costs,
    efforts, or time savings, increase of flexibility, improvement of communication
    means, or just fun.


    2'
