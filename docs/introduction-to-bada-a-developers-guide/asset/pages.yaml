  md: '# Info window


    Word bubbles that display useful information about locations and businesses. This
    may include a brief description of a business and their contact details, for example.
    Info windows are created using the NativeMapInfoWindow class for pre-defined windows
    and IMapInfoWindow classes for user defined windows.


    # MyLocation


    Displays the current location on the map, together with a circular bounds showing
    the margin of error. The application can choose whether to display this information
    by using the Map::SetMyLocationEnabled method.


    # Overlay


    An interactive layer with shapes marking out locations on the map and markers
    that can be moved by the user like pins on a physical map. Shapes: polygons, circles
    and rectangles can be added to a map by adding objects deriving from the MapOverlayShape
    class, while movable markers derive from MapOverlayMarker as shown in Figure 6.15.


    Applications implement the IMapOverlayEventListener to handle the events received
    when the user moves the markers around.


    # Map


    The basic map graphic as provided by the map service provider and encapsulated
    by the Map class. Methods of this class provide lots of control over how the map
    is displayed, including its size and bounding rectangle.'
