  md: '![](img/864ad06741e6f2ddc308988094c37b2f_217_0.png)


    # Server supported services


    Using the bada server, together with the RemoteLocationProvider class, developers
    can also access information about remote devices, periodically report the last
    location of the local device to the server and use the SubscribeToTraceService
    method and ITraceServiceListener class to record a path of travel.


    Reporting device location to the bada server is done using the StartLocationReport
    method, together with the IReportListener class. This causes location information
    to be uploaded to the bada server periodically, information which will be available
    for other authenticated devices to read.


    To retrieve the last locations of remote devices, use the RequestLastKnownLocationList
    method, passing in a list of TargetInfo objects which identify a device from the
    user’s server userID. You can also narrow down to the devices with last known
    locations inside a given area using the RequestLastKnownLocationInCircle and RequestLastKnownLocationInRectangle
    methods.'
