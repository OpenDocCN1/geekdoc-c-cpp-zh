  md: '# 3.4 The BuddyFix UI revisited


    As we saw, UI Builder only gets us so far in creating a functional UI. In particular,
    to complete the basic UI for BuddyFix we will need to:


    +   - Implement the ‘Add’ softkey

    - Implement the Option Menu


    Also, before we can make any final decisions about the layout of the main list
    and its items, we will need to populate it.


    # 3.4.1 Adding an OptionMenu


    The Option Menu is popped up when the user presses the soft key (also known as
    the handle) in the command area at the bottom of the screen, for a Form for which
