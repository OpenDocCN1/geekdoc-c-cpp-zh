- img_proc: true
  md: '# Introduction to bada: a Developer''s Guide (draft preview, July 2010)


    It is important, too, to understand your app GUI in the context of the platform
    look and feel. Samsung standardised on its TouchWiz UI across the complete range
    of its touch phones. Currently TouchWiz is at version 3.0, and this is the version
    that ships on Wave, and that you''ll see in the bada Simulator.


    Remember that bada is designed to push the smart phone experience down from the
    high end into the midrange. This influences the design of TouchWiz, and in it
    should influence your GUI design. While there is no substitute for getting your
    hands on a real device, the following points are worth bearing in:


    +   - Touch – finger-based, direct manipulation, multi-touch including pinching
    and swiping, and of course tactile feedback


    +   - Simplicity – simple screen layout, relatively large and bold fonts, large
    GUI elements for interaction, large simple icons, limited customisation, simple
    menus


    +   - Bright and bold – making the most of superAMOLED display technology, high
    contrast, vivid colours, saturated blacks (and by the way, dark colour schemes
    are preferred to light, because with AMOLED technology dark pixels consume less
    power than light pixels)


    +   - Extended user input – as well as touch and hard keys, TouchWiz supports
    gestures (physical including tapping the case, rotating the phone, snap and shake),
    even face detection


    +   - Multiple display sizes and resolutions – WVGA (Wide VGA) 480x800, WQVGA
    (Wide Quarter VGA) 240x400


    You can find detailed UI guidelines in the SDK Help, select Help | Help Contents
    | bada Application UI Guide in the IDE.


    # 2.2.1 Frames, Forms, and Controls


    The GUI is not just what you see on the screen. The simplicity of the TouchWiz
    look and feel extends to the architecture beneath it, and to the concepts that
    motivate the architecture. While bada won''t design your GUI for you, it provides
    a simple and standardised GUI architecture for your app to use.


    principles of mobile UI design, including some excellent documentation published
    for other mobile platforms may be familiar with, relevant to all mobile app development,
    whatever the platform.'
