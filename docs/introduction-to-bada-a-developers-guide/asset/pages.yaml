    # EnrichedText


    EnrichedText gives you much greater control of text styles. Using simple Canvas
    text styles only allows Direction, Underline, and StrikEOUT styles to be set.


    Using EnrichedText you can fully specify text styles by combining overall styles
    for the complete EnrichedText block, for example alignment and wrapping, with
    individual styles for each TextElement object in the blocks, for example font
    styles and sizes, colours, and so on.


    | Table: EnrichedText attributes |

    |---|---|

    | Horizontalalignment | Left, center, or right |

    | Vertical alignment | Top, middle, or bottom |

    | Text wrapping style | None, character wrap, or word wrap |

    | Abbreviation | Whether the drawn text is abbreviated in case the text size exceeds
    the dimension of EnrichedText |

    | Font size and style | The font size and style: plain, bold or italic |

    | Text color | The foreground colour of the text element |

    | Background colour | The background colour of the text element |

    | Outlinecolour | The outline colour of the text element |


    EnrichedText is still drawn using the Canvas, that the text itself is explicitly
    created and passed as a parameter:


