  md: '# # Chapter 3: Beyond the basics


    So far, BuddyFix is just a shell. In this chapter we begin to extend it. As we
    do, we will learn more about how apps interact with the bada frameworks to inherit
    their runtime architecture and the GUI look and feel. We also cover some essential
    topics that every bada developer needs to know about, including bada API privileges
    and the security model.


    # ### What you will learn


    This chapter shows how to go beyond the App Wizard skeleton as you start to shape
    your application functionality. You will learn about:


    +   * How bada apps interact with the application and UI frameworks

    * The runtime application lifecycle

    * How to build for and deploy to a phone

    * The developer and publishing services provided by the bada developer


    # ### What you will need


    The emphasis in this chapter stays practical and hands on. Have your own code
    in front of you, and the bada reference documentation to hand to check out API
    details.


    # ## 3.1 Expanding the application skeleton


    We have seen how easy it is to get a project started in bada; wizards do the hard
    work for you. Now let''s dig a bit deeper into code.


    Let''s start by walking through the main BuddyFix class as declared in `buddyfix.h`
    (this is the code the App Wizard generated for us):'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Introduction to bada-: A Developer''s Guide - (draft preview, July 2010)


    ```

    class BuddyFix :

    public Osp::App::Application,

    public Osp::System::IScreenEventListener


    ```


    Every app derives from the App::Application class, so when you create your own
    app and derive from Application, you extend a class bada frameworks you already
    know, with the custom behaviour you specify. All the methods frameworks expect
    are present in your derived class. You''ll notice that your app also derives from
    the System::IScreenEventListener class; "I" stands for "Interface", which is a
    pattern we see a lot more of.


    Next, we see our public declarations declared:


    ```

    public:

    static Osp::App::Application* CreateInstance(void);


    public:

    BuddyFix();

    ~BuddyFix();

    ```


    CreateInstance() is a so-called factory function that wraps the C++ constructor
    and when invoked, returns an instance of the application. The two declarations
    that follow it are the C++ constructor and destructor methods. Since the default
    implementations for all three will work for us, there''s nothing to worry about
    here. The remaining public declarations, which complete the class, are the ones
    we''re interested in:


    ```

    public:

    bool OnInitializing(Osp::App::AppRegistry& appRegistry)

    bool OnTerminating(Osp::App::AppRegistry& appRegistry,

    bool forcedTermination = false);

    void OnForeground(void);

    void OnBackground(void);

    void OnLowMemory(void);

    void OnBatteryLevelChanged(Osp::System::BatteryLevel batteryLevel);

    void OnScreenOn(void);

    void OnScreenOff(void);


    ```'
