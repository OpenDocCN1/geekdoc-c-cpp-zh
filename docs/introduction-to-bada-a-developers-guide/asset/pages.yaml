  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    prescriptive philosophy of C++, as well as with its goal of being a true modelling
    and simulation language. In C++, the ability to model the real world closely is
    a requirement, and in the real world, objects can belong to multiple categories.
    Restricting inheritance therefore implies a loss of flexibility, and even inefficiency.


    The counter arguments - in the C++ context at least centre on precedence and ambiguity
    (what if multiple base classes have identically named methods? Which one will
    get called in the derived class?); efficiency and the "evil diamond" pattern1
    which can cause code to be duplicated; and complexity (to use it well, programmers
    must understand it, which means another language feature to master).


    The compromise solution, which bada adopts, like some other mobile platforms,
    and the Java language, is to promote the use of interfaces to solve the kinds
    of design problems that programmers towards multiple inheritance, and allow multiple
    interface inheritance, but only single inheritance from any concrete base class.


    Interface classes are very natural to use, and allow simple and expressive design.
    They also have the advantage of being familiar to developers through the Java
    language.


    In bada for example, Frame access, listeners of all code, interactions with base
    applications, collections and collection comparators and enumerators, are just
    some of the behaviours which can be implemented using interface classes.


    Java raises the concept of interfaces into a language feature, with the interface
    keyword. In C++ there is no built-in language convention, and therefore bada introduces
    its own convention of naming interface classes with a leading I (for example IList,
    IEnumerator, IEventListener, and so on).


    bada, in common with many other platforms:


    +   - An interface class is always abstract i.e. it contains pure virtual methods,
    which means that it cannot be instantiated directly (you cannot new an interface
    class), it can only be inherited from


    +   - The deriving class is therefore responsible for implementing the behaviour
    of interface methods'
