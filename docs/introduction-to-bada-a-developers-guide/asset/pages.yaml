  md: '# # Appendix B: A software engineering process model for mobile app development


    As mentioned early in the book (see Chapter 1), in order to successfully develop
    a mobile software solution you should follow an engineering process the helps
    you address the specific characteristics of mobile software. We refer to this
    as **mobile software engineering**. Such a process is highly agile incorporating
    several macro and micro iterations. Of course, you can follow any process you
    prefer or develop your software without following any process at all. There is
    a range from strict *waterfall* model to *cowboy coding*. As a rule of thumb the
    more complex the project is and the more coordination it requires the more formalization
    in terms of processes is advisable. Experience showed that so called agile processes
    are very appropriate with software for fast paced markets, which definitely is
    the case in mobile app development.


    From a high-level point of view, it might not make a difference if software for
    desktops, servers, the Web or for mobile devices is developed. It is all software
    engineering and the basic steps are always the same: requirements, design, programming,
    testing and deployment. However, it is the detail that makes the difference. From
    experience we can tell that it is not possible to simply transfer the techniques
    of traditional software engineering one-to-one to mobile software engineering
    without significant modifications.


    Since this book we are talking about the bada platform for mobile applications,
    our prime interest in this chapter, naturally, is the mobile software engineering
    process. In the following pages we will introduce one such agile mobile software
    engineering process that subsumes several recommended best-practices. Of course,
    you are free to choose whichever engineering process you want to follow and whether
    you comply with the phases we introduce, pick out the most relevant for your needs
    or don’t'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'use it at all. We will also show where and how the bada platform and its tools
    support the described

    phases and best-practices.


    # Some mobile software engineering best-practices


    For developing mobile software, we recommend deploying ideas from agile development
    initiatives

    (stated in the agile manifesto) such as adaptability, iterations, and making heavy
    use of prototyping and

    diversified testing as early as possible in the process.


    Prototypes can be exploited early in any phase of the engineering of a mobile
    software solution. They

    are primarily helpful in eliciting requirements or to get a common understanding
    with various

    stakeholders early in the project. Testing surely is not unique to mobile software
    engineering but must be

    treated and executed differently we as we will argue throughout this chapter.


    The mobile software engineering process that we introduce here is subdivided into
    three major phases:


    +   1. Feasibility and economic efficiency analysis phase

    2. Software product realization phase

    3. Distribution phase


    The following sections discuss each of these phases in detail and the figure below
    gives an illustration of

    the whole process. The phases of this mobile software engineering process mainly
    interweave with the

    concept, market entry, development, and evolution phases of software product management,
    where

    clearly the strongest overlap can be mapped to the development phase.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '![](img/864ad06741e6f2ddc308988094c37b2f_330_0.png)


    **Figure A.1** A software engineering process model


    # # Phase 1: Feasibility and economic efficiency analysis


    This first phase should help all the stakeholders to get a better picture about
    the feasibility, the acceptance, and the potential economic success of a mobile
    software solution. With economic efficiency analysis we mean that very early in
    the project lifetime it can be determined whether it is worth to pursue a mobile
    software development project. This first phase is composed of the four stages
    requirements engineering, design drafting, early prototyping, user acceptance
    testing, and a milestone at the end of phase.


    # ## Stage 1.1: Requirements engineering


    The first step in this analysis phase is the elicitation and understanding of
    the requirements. The business requirements cover considerations about the business
    model and distribution policy. This is input which usually originates from the
    product management process that embeds our mobile software engineering process.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    User requirements are the starting point and represent what users need and what
    they expect from a mobile software. These requirements must be collected and maintained
    in form of use cases or user stories. Early prototypes can already be exploited
    for this elicitation because users can get a more tangible impression about the
    future system. Such early prototypes can be low-fidelity ones as drawings on a
    paper. More advanced ones can be done by electronic images that can actually allow
    showing a sequence and simple interactions. Even more advanced is the use of simple
    UIs that can be created easily and quickly by the UI builder provided by the bada
    IDE. The envisioned application can be sketched and simple user interaction (clicking
    on buttons or exploiting multi-touch) can be modeled and deployed on some real
    hardware device. This helps the user ever more to think of the future use of an
    application, which is directly reflected in the quality of the users'' feedback.
    Chapter 2 shows the usage of the bada UI builder.


    For mobile applications we recommend to focus on addressing a clearly defined
    problem or need with little functionality as required. Many applications seem
    overloaded and are difficult to use. Focus on the core and address less needs.
    We are not talking about desktop applications. We outlined the differences between
    mobile and desktop apps above. As mentioned the cognitive resources and the attention
    span is substantially more limited. Traditional software engineers tend to underestimate
    the impact that a mobile setting will have on application usage patterns.


    # Stage 1.2: Design drafting


    The drafting of the design deals with two aspects. The first one being the draft
    of the dialog flow logic and the user interface (UI) design. This is the only
    part of the software that is exposed to the user and hence, the only part she
    can experience. From user workshops and feedback to our applications we know that
    it is tremendously important to provide a simple yet attractive user interface.
    If an application is too complex to understand within the first minute or it is
    ugly looking, the user will most probably not launch it second time.


    The second aspect deals with preliminary software component architecture considerations.
    The UI design activities are conducted in various micro iterations with feedback
    from stakeholders.'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    # Stage 1.3: Early prototyping


    Early prototypes embody the requirements gathered and the design developed so
    far. They are a good means to get a common understanding. Experience showed that
    some rudimentary functionality should be in place such that minimal interaction
    is possible. That can be achieved by paper prototypes, an interactive slide show
    or a click-able UI mock-up. The goal is to find a good balance between a fast
    and cost effective prototype and providing a user experience which comes close
    to the final product.


    As mentioned above, the bada tools give an ideal support for building good prototypes
    fast. A further advantage is that these prototypes can be re-used for the later
    programming as is without the need of entirely re-doing all the work for the UI.
    This is a result from the clear separation of UI design and programming brought
    to you by bada.


    # Stage 1.4: User acceptance testing


    This is an optimal stage. However, we recommend to plan and execute tests with
    users that are not involved in the project. These tests can be short in length
    but should be as close to the real-world context as possible. This way, many problems
    that will go unnoticed in a lab environment will become apparent, such as bad
    readability under sunlight or overly complex and confusing user interfaces. These
    kinds of trials will almost always yield highly valuable feedback about the future
    acceptance by users and thus the potential success on the market. After a test
    session there may be one or more iterations back to requirements engineering stage
    depending on available time, quality and cost targets.


    The first phase is ended with the milestone Decision for Continuation, which entails
    the decision to pursue or abandon the software project. With the knowledge gained
    in this phase – particularly arising from the early acceptance tests – the potential
    success of a mobile solution can be estimated much clearer, which helps to assess
    the economic efficiency.


    # Phase 2: Software product realization


    The second main phase deals with realizing the software solution. It bases on
    the works of the first phase where as many results as possible should be reused.
    To follow this agile engineering process, also this this'
  merge: -1
  pgno: 332
