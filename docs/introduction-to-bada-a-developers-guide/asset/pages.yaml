    2. Running OnForeground(); OnBackground(); OnLowMemory();

    OnBatteryLevelChanged(); OnScreenOn(); OnScreenOff();

    3. Terminating OnAppTerminating()();

    4. Terminated (no associated methods – your app is no longer running)


    The application lifecycle is show in Figure 3.1:


    ![](img/864ad06741e6f2ddc308988094c37b2f_72_0.png)


    Figure 3.1 The application lifecycle


    Strictly speaking, only four of these methods relate specifically to the lifecycle;
    the others, like

    OnBatteryLevelChanged() and OnScreenOff(),respond to system events triggered by

    conditions that are so important, or so frequent on mobile, that the framework
    makes a special case of

    them and gives you the opportunity to respond appropriately.


    Let’s look more closely at the four lifecycle states, and at how the lifecycle
    methods map to them.'
  merge: -1
