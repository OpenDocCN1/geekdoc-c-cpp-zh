  md: '# Introduction to bada: A Developer''s Guide (draft preview, July 2010)


    This provides a minimal framework for propagating exceptions within application
    code, and a simple mechanism for returning and checking for exceptions. Significantly,
    it forces responsibility for handling the app developer. Looked positively it
    makes that app developers are encouraged to "try to understand and handle problems"⁹
    rather than bouncing into an exception mechanism that, by convention, emphasises
    terminating programs upon exceptions, rather than gracefully recovering.


    This is an important point to make, and interestingly, it is one that differentiates
    mobile from more conventional desktop platforms.


    As Stroustrup explains, an important part of the design philosophy of C++ is to
    support the development of systems that execute ''where no programmer is present,''¹⁰
    for example telephone exchanges and ATMs.


    In contexts, the recommended response of an application to an exception is termination.¹¹
    In a scientific or academic context this to correctness is entirely appropriate,
    and it is indeed the kind of behaviour we have become accustomed to in (say) wordprocessor
    or spreadsheet applications on the desktop. But if my phone behaves like that,
    it will go right back to the shop.


    The point to make about exceptions on mobile is not simply that they must be handled,
    but that they must be expected. As we wrote elsewhere,¹² low memory, low power,
    sudden loss of power, loss of connectivity and intermittent connectivity, and
    even the loss of a file system (for example when removable media is abruptly removed
    from a device without first unmounting), are all everyday occurrences on mobile,
    and apps that respond to such events by promptly terminating will not be popular
    with users.


    > ⁹ In the (these days possibly unfashionable) words of Doug McIlroy, quoted by
    Stroustrup (green), p.384.


    > ¹⁰ P107 green


    > ¹¹ For example, see Frank p.52: "We therefore suggest immediate program termination
    in the event of memory allocation failure." As he goes on to, ''of course'' some
    helpful message should also be reported to the user ''so that the nature of the
    error can easily be determined if necessary."


