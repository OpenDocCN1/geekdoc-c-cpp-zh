  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    In the agile manifesto² software engineering experts summarised the key factors
    that should help to produce better software faster and more reliably. They state
    that agile development is based **on result**. That means executable software
    should be built as soon as possible, which is the primary measure of progress.
    Tool and process support is relevant but must be chosen **appropriate** to the
    solution in order to avoid unnecessary overhead. Finally software engineering
    is about people working together. Hence, **communication** – ideally in a face-to-face
    and spoken way – is at the core of agile development. It does not only refer to
    the project team but also similarly important to the stakeholders, clients and
    end users.


    In line with this, we would like to add to this recommendation an emphasis on
    using much **prototyping** and **diverse testing** as possible throughout the
    whole development, where both are integral parts of herein inherently supported
    by the bada platform and its development tools. Prototypes are exploited nearly
    in any phase of development of mobile software solutions. They are primarily helpful
    for eliciting requirements or to get a common understanding with various stakeholders
    early in the project. Testing surely is not unique to *mobile software engineering
    but must be treated and executed differently. This is an effect of various issues
    related to mobile software such as the heterogeneity of hardware and devices,
    the dependence on context factors which are difficult to test on simulators (e.g.
    geographic locations), and the phenomenon of the discrepancy between the simulator
    versus real device behaviour.


    The bada toolset provides means to support both. First, the **UI Builder**, which
    is integrated into the bada IDE, Developers can use WYSIWYG tool to create “clickable”
    demos by visually placing a variety of UI controls onto the device screen.


    A convenient tool is the **Event Injector** that comes with the bada simulator.
    This is useful for simulating a broad variety of context data. Incoming calls,
    text messages or battery level can be tested as well as different sensor as location,
    acceleration, tilt, magnetic field or proximity. It is always difficult to test
    mobile apps in a simulator obviously you are missing all the so necessary context
    data. So the by far more expensive and complex type of test is the deployment
    on the real devices and


