  md: '# Step 1: On the developer.bada.com portal


    After you signed up on the developer.bada.com portal to download the IDE and SDK,
    you did more than register for a download; you joined the bada developer program.
    This enables you to access the online services that provide many useful resources
    such as documentation, API reference, code samples, tutorials, blogs, videos,
    or a support forum.


    # Generate an application profile and download the manifest.xml


    In this section we concentrate on the custom app profile generator, which should
    be the starting point for your real projects, because it allows you to define
    the functionality of your app and to specify the hardware features your app requires
    or expects (for example screen size, sensors, default orientation). The portal
    also checks that your app name is globally unique, as well as assigning a unique
    numerical ID that your app also uses to protect its private resources.


    In section 2.1, metadata, we looked very briefly at the two metadata files that
    every app project must include: application.xml and manifest.xml. These, we said,
    declare application information used to package the app – like names, versions,
    and intended target phone models – as well as critical security permission declarations.
    Configuration of the application.xml is handled by the IDE. The Web portal helps
    to establish the manifest.xml.


    To create your manifest file go to the developer.bada.com portal and click the
    “My Applications” tab. Then invoke the Application Manager on the left. There
    you can start to generate your application profile. Figure 2.22 shows the web
    site and the five simple steps to follow.'
