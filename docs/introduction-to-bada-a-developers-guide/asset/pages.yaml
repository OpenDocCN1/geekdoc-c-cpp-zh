  md: '# # Introduction


    **Note**: in this draft, pre-publication, downloadable version of the book, we
    present the first 10 recipes only, as a taster of what''s to come.


    The recipes as well as this book and further resources can be accessed on our
    website

    http://developer.bada.com.


    In Part 2 of the book we will present 70 C++ recipes, organized into 9 functional
    groupings, that explore the bada APIs and provide you with ready-made code solutions
    for common *how-to-do-to-it* questions. These are questions you are likely (in
    fact, certain!) to meet in the course of your own projects. By providing you with
    ready-made solutions, we want to help speed you on your way to your finished apps.
    Just as importantly, by solving these basic problems for you, hope we will clear
    the way for you to focus on the interesting problems that your apps present -
    the kinds of features that differentiate your great idea from everyone''s.


    # ## What''s in the recipes


    +   1. UI and extended UI


    Basic recipes to get you started, demonstrating how to work with common UI elements
    including Frames, Forms, Controls, and Popups.


    These recipes also include application input types, including keyboards, keys,
    touch, multi-touch, and gestures.


    These recipes also include managing sensor and other hardware input including
    from the camera.


    +   2. Fundamentals


    Application basics, recipes that demonstrate how to work with the app lifecycle
    and with app state, and that demonstrate the use of bada idioms for C++, as well
    as common basic types from the bada class library, including Strings, Dates and
    Times, Numbers.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'These recipes also include using base (built-in) applications from your own
    apps.


    # 3. Multimedia content


    Essential multimedia recipes.


    # 4. Networking


    Recipes that demonstrate common networking, phone, messaging, and similar techniques.


    # 5. Service-centric features


    Recipes that demonstrate interaction with server-based content.


    # 6. Maps and locations


    Recipes that demonstrate how to use maps and location in your own apps.


    # 7. Social networking and commerce


    Recipes that demonstrate how to use social networking services, including Facebook
    and Twitter, and other server-based content from your own apps.


    # 8. Security


    Recipes demonstrating security features and use.


    # 9. Internationalization


    Recipes demonstrating internationalization features and use.


    .'
  merge: -1
