- img_proc: true
  md: '# 3.2.2 More about UI Controls


    Forms contain content. Content types include plain text, directly embedded images
    including backgrounds, and standard or custom Controls. Controls that derive from
    Container can also be containers for nested controls. As well as containing content,
    Controls are active and can respond to user events touches, multi-touches, and
    gestures.


    As you would, bada provides a comprehensive set of standard Controls, like buttons,
    pickers, and edit areas, as well as more specialised controls including animations,
    Flash movies, and overlay panels that enable controls to be layered (for example
    to overly player-like controls on a video frame).


    Applications can also derive and customise their own Controls, if there is no
    suitable standard Control that meets the application''s needs.


    All Controls must be drawn and shown in order to display, either synchronously
    using the Draw() and Show() methods, or asynchronously using RequestRedraw().


    The synchronous methods should not be called from a callback. Instead, use the
    asynchronous RequestRedraw() method, which returns immediately after queuing the
    redraw request. In this case your drawing code should be performed in the OnDraw()
    callback method, which will be called by the framework when your queued request
    is acted.


    > Note: a control only becomes display after it has been added to a drawable container.
    Whether a control is displayable will determine whether its child controls, if
    any, are displayable. For this reason, a general rule is that no methods of the
    control should be called until it has been added to the container, to avoid possible
    unexpected behaviour, for example related to displayability.


    Drawing requests cascade top-down through the control hierarchy until there is
    no further child to cascade to, when the first Draw() is performed. Drawing is
    then performed in a reverse, bottom-up cascade, from the most-nested control back
    towards the root of the hierarchy. Unexpected results can occur if a Draw() request
    higher up in the control hierarchy overwrites a Draw() lower down in the hierarchy.
    In practice, this is only likely to be an issue when a Canvas is being used.'
  merge: -1
  pgno: 79
