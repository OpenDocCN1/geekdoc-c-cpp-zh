  md: '# Appendix A: A UML primer


    Here''s an explanation of the subset of UML notation that we''ve used in Chapter
    6:


    # 1. Class diagrams


    Interface inheritance


    Queue derives from and implements the interface defined by ICollection. See Chapter
    4, "pada fundamentals" for more information about interfaces.


