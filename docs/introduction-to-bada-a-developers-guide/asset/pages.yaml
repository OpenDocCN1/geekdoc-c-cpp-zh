  md: '# 4.3.6 Using numbers


    In bada, both wrapper and comparison classes are defined for each of the C++ primitive
    numeric types of short, char (8-bit integer), int (32-bit integer), double, long,
    longlong, float.


    This makes number comparisons and number-to-string and string-to-number conversions,
    as well as hashing, trivial. It also adds robustness to the platform (and to your
    apps) ensuring that overflows (whether accidental or deliberate) are impossible
    when numeric classes are used for number handling instead of primitive numeric
    types.


    App developers are encouraged to use the numeric types when handling numeric data,
    and not to rely on primitive C++ types.


    # 4.4 Security and the privilege model in bada


    All platforms need to protect end-users against malicious (or just badly designed)
    software that might disrupt the device; corrupt, steal, or destroy private data;
    or spoof users or the system in performing billable actions that incur unwanted
    costs, for example, making premium-rate voice or expensive calls.


    In some respects, mobile phones have an advantage over desktop systems:


    +   - Because they are ROM-based, all system software and data can be restored
    by rebooting

    - Their network connection model ensures that they are permanently held behind
    an operator firewall

    - Their intermittent and mobile connection makes them continuously moving IP address
    targets

    - Both of the above, together with their (relatively) low-bandwidths makes them
    poor targets for both networks and other infections

    - Shortlink connectivity typically requires user acceptance. Bluetooth attacks
    are mostly mythical.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    At the same time, phones are potentially attractive target to malware because
    they are a rich source of personal data, and the pay-to-connect model theoretically
    creates opportunities for rogue software to exploit.


    In practice, viruses of the kind that plague desktop systems are almost unknown
    on phones, partly for the reasons mentioned, partly because phones require greater
    programming skills and partly because mobile platforms have designed-in security.


    For mobile app developers, it li or not, regardless of platform, security considerations
    will always be present, and will always create overhead in term of effort.


    In this respect, bada is no different from other mobile platforms. All impose
    security limitations of some kind. However, unlike sandboxed systems (for example
    mobile Java, Windows Mobile .NET, Android), bada offers native API access for
    apps – and therefore layers a security model on top of its APIs.


    # Privileges in bada


    In bada, sensitive APIs are protected by privileges. Privileges have two dimensions:


    +   1. A privilege group is a category that typically applies to related methods
    of a class or namespace. When you are granted access to the group, you have access
    to all methods requiring that privilege

    2. Every privilege group belongs to one of two privilege levels – NORMAL or SYSTEM


    The goal of the privilege model in bada is to protect users against malicious
    code, and to protect bada services against abuse. Because bada includes network-based,
    service-centric features in its API set, there is clearly scope for those with
    malicious intent to attempt to circumvent or break the services. Because these
    services potentially hide private user data, protecting them is essential.


    Not all bada APIs are protected, and in fact the majority require no privileges.
    To access privileged APIs, you must have the required privilege level, and your
    app must declare the required privilege group in its manifest file.'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'Introduction to bada: a Developer''s Guide (draft preview, July 2010)


    Declaring privileges is easy. Privileges are metadata, not code: you simply add
    the required privilege group while defining your profile on the developer.bada.com
    (as explained in Chapter 2). Privilege groups map closely to namespaces (there
    are currently more than thirty privilege groups, compared to twenty-something
    top-level namespaces, and thirty-something namespaces in total if you included
    nested namespaces), and in general, adding a new namespace implies checking to
    see whether privileges are required.


    The unusual dimension of privileges is the privilege level, which interprets accesses
    to privileges in terms of the app developer, instead of the app itself. Access
    to privileges is therefore controlled by developer status, defined as membership
    level in the bada ecosystem - for which there are only two values, ordinary members
    and strategic partners. The unfortunate side-effect of this in current versions
    of bada, is that access to privileges is severely restricted. Almost half of the
    privilege groups, and in many ways the most interesting ones, are placed out of
    the reach of ordinary third-party developers and are available only to strategic
    partners.


    This is a reflection of the newness of the platform as much as anything, and will
    change. Keep an eye on developer.bada.com for news.


    # In practice


    Privilege level restrictions aside, using privileges in your app is straightforward.


    +   - Where no privilege group is required, which is the case for most of the
    bada class library, no special declarations or other action is required

    - All developers automatically have NORMAL privileges, which means that their
    apps can use any APIs that are marked as requiring NORMAL privileges. Simply declare
    the required group in your manifest file

    - If you only have NORMAL privilege and you want to access APIs requiring SYSTEM
    level privilege, the only solution is to apply to become a bada partner developer.
    Realistically, this option is bound to be restricted compared to the number of
    developers who would like access.


    80'
