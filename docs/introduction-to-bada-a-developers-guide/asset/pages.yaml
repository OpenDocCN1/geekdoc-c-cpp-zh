    # Exceptions in practice on bada


    On bada, errors can be caught and handled, or propagated, by either:


    +   - Returning a result using the return type with an enumerated value, enabling
    a caller to test for a possible exception


    +   - Setting a result using an enumerated value, enabling a possible exception
    to be handled in a decoupled by a method other than the immediate caller


    +   - Jumping to local handler label after testing a returned type for an enumerated
    value, enabling the exception to be handled immediately and locally, in the method
    in which the exception is detected


    Returning a result value and testing it has the advantages of imediacy and simplicity,
    where handling by the caller is appropriate:


