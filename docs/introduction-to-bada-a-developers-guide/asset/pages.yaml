  md: '# 2.6 Using a keypad control


    Problem description


    You want to pop up a Keypad and get input from it.


    The recipe


    The following configuration is required for this recipe:


    | Namespaces used: Osp::Ui, Osp::Ui::Controls, Osp::Base

    Header files to #include:

    UI.h, FControls.h, FBase.h

    Required libraries:

    UI, Controls, FBase [.lib | .so]

    Required privilege level:

    Normal

    Required privilege groups:

    None |


    A Keypad is a UI control which provides a means for the user to input alphanumeric
    text.


    A Keypad can either be used within an application as a stand-alone keypad or as
    part of an Edit Field or Edit Area input control. For a stand-alone keypad, a
    full screen keypad is available. For a Keypad automatically created by the system
    for an Edit Field or Edit Area control, both full screen and overlay keypads are
    supported


    This recipe shows two different methods that can be deployed to make use of the
    Keypad control. Each method details the steps required to create and use the Keypad,
    and provides some sample code snippets.'
