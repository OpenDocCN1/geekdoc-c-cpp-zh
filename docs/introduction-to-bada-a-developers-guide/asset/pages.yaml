  md: '# Introduction to bda: A Developer''s Guide - (draft preview, July 2010)


    TOUCH_LONG_PRESSED and TOUCH_DOUBLE_PRESSED events. These event sequences need
    to be taken into account when designing an application''s event processing.


    The sequence of events for a movement touch event is:


    +   1. TOUCH_PRESSED

    2. TOUCH_MOVED (multiple times)

    3. TOUCH_RELEASED


    The sequence of events for a long press touch event is:


    +   1. TOUCH_PRESSED

    2. TOUCH_LONG_PRESSED

    3. TOUCH_RELEASED


    The sequence of events for a double-tap touch event is:


    +   1. TOUCH_PRESSED

    2. TOUCH_RELEASED

    3. TOUCH_DOUBLE_PRESSED

    4. TOUCH_RELEASED


    It might be suitable for an application to only process a TOUCH_PRESSED event
    when its corresponding TOUCH_RELEASED event has been received. Or alternatively,
    the application may be designed so that any processing done in the OnTouchPressed()
    method is reversed if the TOUCH_MOVED, TOUCH_LONG_PRESSED or TOUCH_DOUBLE_PRESSED
    event is received in the sequence afterwards. In both cases it would be necessary
    to store the status of the previous event(s).


    It is advisable not to do too much processing in the OnTouchMoved() method, as
    the sensitivity (2 pixels) of movement can result in this method being called
    many times.


    In this recipe, the GetCanvas() method is used in the OnDraw() method to retrieve
    the MainForm''s canvas. To prevent memory leaks, if a method has an ''N'' suffix,
    the caller must delete the returned instance after the caller is finished with
    the instance.


