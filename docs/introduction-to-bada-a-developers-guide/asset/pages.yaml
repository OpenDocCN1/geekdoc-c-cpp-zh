  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    At the one end of the chain we have the developers or application providers who
    want to develop applications. On the other end are the users or customers who
    want to use mobile apps. Along this chain Samsung provides core building blocks
    that foster the bada ecosystem. Central to it is the bada mobile platform where
    the execution environment deployed on mobile handsets. This platform not covers
    the mobile part but also allows seamless access to the bada server as you will
    get to know later in chapter 5. Powerful and well-abstracted APIs are exposed
    as an open SDK to developers. In addition to the left block in Figure 1.1 covers
    a large number and variety of technical support resources such as training material,
    tutorials, sample code, tech blogs, and the API reference documentation. The right
    block is the application store that allows certifying and publishing your apps.
    Once your app is ready for publication you can decide if – via the store – you
    want to sell your app or give away for free, or however else you want to become
    rich and famous.


    In the next chapter we would like to introduce some app development best-practices
    that should help to produce successful mobile applications.


    # 1.3 Mobile app development best-practices


    We argued that mobile apps show some specific characteristics that make them different
    from conventional software for desktops or servers. Related markets are also different
    and develop at a faster pace. Hence, in order to create successful mobile solutions
    or applications we recommend to deploy some best practices that we want to introduce
    in this chapter. In the appendix we provide an example of a full software engineering
    process for mobile applications.


    Of course, you can follow any process you prefer or develop your software without
    following any process at all. There is a range from strict waterfall model to
    cowboy coding. As a rule of thumb the more complex a project is and the more coordination
    it requires, the more formalisation in terms of processes is advisable. Experience
    showed that so called agile software development processes are very appropriate
    for fast paced software, which mobile apps definitely are.'
  merge: -1
