  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    The lifetime and the time to market of a mobile app are substantially shorter
    than traditional software products and developers need to adapt. By having a central
    distribution system such as SamsungApps, the developer can concentrate on creating
    and marketing their application in the knowledge that the distribution, purchasing
    and revenue sharing model will be taken care of by the Samsung Apps store.


    This simplified way of application distribution also has other advantages. Users
    can be sure that applications will be independently tested and will comply with
    a certain quality standard and will respect the integrity of the user''s data
    and won''t spend their money on phone and data without asking.


    A further positive effect resulting from the first app initiatives is that all
    costs of a sudden become much more transparent. Network operators recognised this
    trend and came up with smart bundles with flat data rates or volume packages to
    encourage the download of apps from stores. In the past, incomprehensible and
    non-transparent cost models discouraged users from using mobile services or downloading
    apps because they feared exaggerated costs. With new all-inclusive models, downloading
    apps and invoking mobile services have become a lot more user friendly and thus
    accepted. From this, we conclude that the future of mobile apps ahead of us is
    quite promising.


    The bada platform in combination with SamsungApps represents an ecosystem that
    addresses, exploits, and in fact shapes some of the differences that we outlined
    in this chapter. Figure 1.1 summarises what the bada ecosystem stands for.


    ![](img/864ad06741e6f2ddc308988094c37b2f_7_0.png)


    Figure 1.1 The bada ecosystem'
