  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    # Media format support


    A wide variety of standard audio playback formats are supported: MP3, AAC, M4A,
    XMF, 3GA, MMF, MIDI, WAV and AMR. Audio can be recorded in AMR or WAV formats.


    The range of video playback formats is also wide: WMV, ASF, AVI, MP4 and 3GP while
    video can be recorded in MP4 and 3GP formats.


    The following image formats can be decoded by the Image class: BMP, GIF, JPEG,
    PNG, TIFF and WBMP. Images can be output in BMP, JPEG and PNG formats.


    Audio and Video files protected by the OMA and Windows Media Digital Rights Management
    (DRM) formats can also be played.


