  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    # Step 2: In the bada IDE/SDK


    Create bada app with the manifest file


    After you''ve downloaded the manifest file to your hard disk you can create a
    bada app project as described earlier. In the Wizard you arrive at the point to
    select the manifest file, you should uncheck the default one and point the Wizard
    to the just downloaded manifest.xml on your hard disk. The other option - if you
    already have an existing project with an existing manifest file - is to simply
    overwrite the old manifest file with the new one.


    # Program and build


    The next best to get your app is actually thinking of your logic and programming.
    When you think your app is in a runnable state you can build your bada project
    in the IDE as described earlier.


    # Test and debug on simulator


    Once your app compiles and can be built without any errors, you can start test
    while running it in the simulator. The simulator is very useful for testing the
    principal correctness of your code. Traditionally there was a large discrepancy
    between behaviour of simulators and real mobile devices. Because of the importance
    of context intensive real-world tests had to be on the mobile device anyway. The
    bada Simulator comes the real device very close. In addition to the bada Simulator
    provides an extra tool to call the Event Injector that injecting sensor events
    of all kinds into the simulator. In fact, so can other events including phone
    calls, messaging events, network events, and device events like low battery or
    low memory. This helps a lot and makes testing much more efficient since many
    of the real world tests can be shifted to the less expensive simulator tests.


    The following events can be simulated:


    +   - Incoming calls

    - Network characteristics and quality (e.g., service level, roaming, or network
    codes)

    - Transmission of text messages, WAP push, and push notifications

    - Location data (latitude and longitude) by choosing on a map or explicitly inserting

    - Various sensors such as accelerometer, GPS, magnetic, tilt, proximity, or weather'
