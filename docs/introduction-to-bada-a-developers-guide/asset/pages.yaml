  md: "# Introduction to bada: A Developer's Guide - (draft preview, July 2010)\n\n\
    The downloaded manifest.xml typically contains info as illustrated below:\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<Manifest>\n  <Id>93bt1p123e</Id>\n\
    \  <Secret>9C645DBA19C71BAD1204DAA7A0B9</Secret>\n  <AppVersion>1.0.0</AppVersion>\n\
    \  <Privileges>\n    <Name>IMAGE</Name>\n  </Privileges>\n  <DeviceProfile>\n\
    \    <CPU>Cortex-A8</CPU>\n    <MinimumHeapSize>16</MinimumHeapSize>\n    <MinimumVRAMSize>4</MinimumVRAMSize>\n\
    \    <Accelerator3D>OpenGL-ES1.1</Accelerator3D>\n    <Accelerator3D>OpenGL-ES2.0</Accelerator3D>\n\
    \    <BluetoothProfile>OPP</BluetoothProfile>\n    <BluetoothProfile>SPP</BluetoothProfile>\n\
    \    <WIFIMode>Infrastructure</WIFIMode>\n    <WIFIMode>Ad-hoc</WIFIMode>\n  \
    \  <Sensor>GPS</Sensor>\n    <Sensor>Accelerometer</Sensor>\n    <Sensor>Magnetic</Sensor>\n\
    \    <Sensor>Proximity</Sensor>\n    <InputDevice>Touch</InputDevice>\n    <ScreenSize>480x800</ScreenSize>\n\
    \    <SoundMixing>Enable</SoundMixing>\n    <APIVersion>1.0</APIVersion>\n  </DeviceProfile>\n\
    </Manifest>\n```\n\nHere, the first attributes are basic application information.\
    \ While <Id> and <Secret> both appear in code, the framework takes care of their\
    \ use. The ID is a random and unique number. The secret is uniquely related to\
    \ your app."
  merge: -1
