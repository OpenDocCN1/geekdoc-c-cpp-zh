  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    The FaceDetector is the class used to locate a face in a still image or camera
    preview, while the FaceRecognizer will analyse this image and identify it from
    a list of already identified faces.


    A device can contain many sensors available to application developers, including
    acceleration, GPS, magnetic, proximity and tilt sensors. The SensorManager class
    is used to determine if a sensor is available and to add or remove the sensor
    event handlers, while the SensorData class is used to retrieve information from
    that sensor. The classes which handle the functionality of these sensors are shown
    in Figure 6.35.


    ![](img/864ad06741e6f2ddc308988094c37b2f_255_0.png)


    Figure 6.35 Sensors provided by the UIX namespace


    Note: sensor monitoring methods like ISEventListener::OnDataReceived are called
    from a separate thread to the main thread, in order not to be slowed down by the
    API calls in the main thread. This means that if you implement monitoring of a
    sensor you should minimise what you do in the OnDataReceived method and do any
    drawing in the main thread. This also applies to the weather services classes
    which are used to retrieve and store a one day weather forecast for a given location.'
