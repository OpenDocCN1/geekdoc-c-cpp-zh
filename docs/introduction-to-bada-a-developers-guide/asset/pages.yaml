    The pixel formats represent the following standard colour modes:


    +   - RGB565 16-bit RGB with 5 bits of red and blue, and 6 bits green

    - ARGB8888 specifies 32-bit Alpha RGB with 8 bits each

    - RGBGB88A8 is an alternative 32-bit, byte-based format preferred by OpenGL(R)


