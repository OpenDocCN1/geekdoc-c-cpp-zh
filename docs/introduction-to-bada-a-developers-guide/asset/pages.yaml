    Except for the special case of a full-screen app (or what the App Wizard refers
    to as Frame-based application), a Form is the starting point for GUI design. Like
    Frame, Form is a full-screen-sized container. Unlike Frame, Form can contain instances
    of any Control derived class (with the exception of Frame; Frame cannot be instantiated
    by the app), and Form itself (a Form cannot contain another Form).


    As we saw in the previous chapter, because it encapsulates the full screen, Form
    includes system areas like the Indicator and Title bars, and soft keys, as well
    as the application client area.


    In addition, the bada UI framework allows a Form to display or add them just by
    launching an Option key that displays at the bottom of the screen in the command
    area. In BuddyFix, for instance, we will use the Options menu to provide global
    options, like managing settings and adding and removing buddies.


