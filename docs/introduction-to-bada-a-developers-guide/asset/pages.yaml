  md: '# 4.2.2 The native system


    The Bada platform itself is written in C++ (all frameworks, all higher level components,
    and of course the bada class library), with some low-level C-code (low level components,
    kernel interfaces).


    The Bada UI, application, and application services frameworks, and the suite of
    native apps that are shipped on phones as part of the platform, are exclusively
    C++. And it''s those frameworks and the class library that the app developer develops.


    # 4.2.3 Alternatives to native


    On bada, then, native means C++ development. However, there are other options
    open to application developers, for runtime includes like Flash and WebKit, so
    long as the (relative) penalty of non-native performance is acceptable. (Typically,
    the critical variable is the type of app - app that is heavy on user input or
    is file-centric a poor candidate, content browsers are usually good candidates.)
    These options are relevant when access to the complete native platform is not
    required, or when existing assets have been written using cross-platform technologies,
    or when cross-platform usage is the overriding requirement.


    There are plenty of possibilities on bada:


    +   A Flash engine is completely integrated at a low level with the native graphics
    architecture, making Flash a perfect choice for graphics intensive apps (and in
    fact Flash is used as a system component by bada itself, enabling the phone''s
    UI to be written in Flash, making it seamlessly portable across multiple different
    families of phones in Samsung''s portfolio, across operating systems from Symian
    to WinMo, to Android and LiMo).


    +   WebKit is also fully supported. The bada native Dolfin browser is based on
    WebKit with support for HTML 4.0.1 and HTML 5.'
