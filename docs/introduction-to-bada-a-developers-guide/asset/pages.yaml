    # Summary


    This namespace provides support for the OpenGL ES 2D and 3D graphics library.
    OpenGL ES is a cross platform for embedded graphics and provides full functionality
    for 3D games. By supporting OpenGL ES, bada allows developers to make use of graphics
    code originally written for other mobile platforms.


