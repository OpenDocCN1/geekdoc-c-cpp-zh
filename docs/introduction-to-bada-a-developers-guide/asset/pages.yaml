  md: '# Introduction to bada: a Developer’s Guide - (draft preview, July 2010)


    Let''s call these ‘lifecycle’ methods; every app has them, and every app must
    implement them. The wizard provides a minimal implementation for us, but as we''ll
    see, these methods are important in defining the way our app behaves, so we definitely
    want to understand what they can do for us.


    # 3.1.1 Being event driven


    A bada app is entirely event driven; its runtime behaviour is defined in response
    to events that it receives from the framework. These include user-oriented events
    like touch events, soft key events and (hard) key events, and system-oriented
    events like timer, sensor notifications, incoming voice calls or messages, and
    lifecycle events.


    In bada the event loop is hidden within the bada frameworks, and is not visible
    to the application. To receive the events that it wants, the app implements the
    appropriate listener call-back methods. This makes a bada application very straightforward
    to write. Applications are essentially reactive, and are completely defined by
    the set of events they handle.


    Choosing which events to listen for and handle depends on how you want your GUI
    to behave, and on your app’s core functionality. However, the lifecycle methods
    define a common set of system events every bada app should handle.


    # 3.1.2 The runtime app lifecycle


    The application lifecycle defines the dynamic, runtime architecture of every application.
    The lifecycle is defined by the bada application frameworks, and when you derive
    your app from App::Application, your app inherits the lifecycle methods.


    In bada, the lifecycle is very simple. Your app exists in one of four possible
    states: Initializing, Running, Terminating, or Terminated. At any time, your app
    can be in only one of these states. You probably recognise this as a simple state
    machine: your application transitions between these states, and associated with
    the transitions or states are the lifecycle methods:'
  merge: -1
  pgno: 71
- img_proc: true
