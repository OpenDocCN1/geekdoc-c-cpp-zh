  md: '# Introduction to bada: A Developer’s Guide - (draft preview, July 2010)


    # Hints, pitfalls and related topics


    The WEB_SERVICE group privilege must be set in the Application’s manifest file
    in order to use the Browser Application control.


    When using the Contact application control for the user to select the required
    contact, request the return of multiple items of data related to a single contact
    (e.g. both the phone number and the Email address). If this functionality is required
    the following steps should be performed instead:


    +   - Use the Contact application control for the user to select the required
    contact, but request the return type from the operation to the contact ID.

    - Use the Osp::Social::Addressbook class’s GetContactN() method to retrieve all
    the contact details associated with the contact.


    The ADDRESSBOOK group privilege must be set in the Application’s manifest file
    in order to use this Address book fully functionality.


    When selecting multiple items from the Contact application, they may not be added
    to the IList collection in the same order as they are presented in the Contact
    application. They will be returned in the order of ascending contact ID (i.e.
    in the order in which the information was saved in the Contact application).


