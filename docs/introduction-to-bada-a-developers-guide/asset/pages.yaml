    # 5.1.4 Commerce Service


    The Commerce service allows ends to browse and purchase items through bada applications.
    Items can be everything that can be purchased out of a bada app. Developers can
    set up their own online store, manage items on the store and track purchase statistics.


    As a developer, you can utilize this service to create an application with functionalities
    such as retrieving selling item information and purchasing in your application.


    Purchases are made simple as buyers are required to pre-register their credit
    cards when they sign up with the SamsungApps site. There is no need for developers
    to handling any credit card information from buyers. The SamsungApps store maintains
    the buyer''s credit details and associates it with a buyer ID. Purchases are then
    a simple matter of entering the buyers ID and a password.


    > Note: to sell your items, you always need to register at SamsungApps seller
    office at seller.samsungapps.com


    # 5.1.5 Single Sign On


    bada services are not limited to the ones mentioned above. There are some other
    services which are located in other namespaces. As such sign on on (SSO) application
    control from the Osp::App::AppControl namespace, and the weather sensor service
    from the Osp::Uix namespace.


    The bada server can manage identities by associating a single login and password
    with all of its services. This single sign on (SSO) method utilizes an an authentication
    token provided by the server to validate and sign into all the services that a
    user may have on the bada server.'
