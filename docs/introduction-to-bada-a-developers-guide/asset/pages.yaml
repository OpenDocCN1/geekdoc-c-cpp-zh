    # 3.3.1 More about Canvas


    The Canvas class enables direct access to the device display for drawing. Whenever
    you want to direct drawing graphical primitives (like Line, Rectangle, Ellipse,
    Polygon, and so on, as well as TextElement for text and Bitmap for images, which
    are all members of the Osp::Graphics namespace, then you must use a Canvas.


    You can explicitly construct a normal (global) Canvas object from anywhere in
    your GUI:


    ```

    // Construct a "normal" or global canvas

    Canvas* pCanvas = new Canvas();

    pCanvas->Construct();

    ```


    Note that Canvas is always constructed in two-phases by allocating operator new
    and initialising with Construct() (see Chapter 4, on two-phase construction).


    A normal Canvas overlays the application Frame and bypasses the window (and Control)
    hierarchy, providing direct access to the display and overwriting anything within
    its display rectangle (including your current Form and any Controls it contains).
    If no rectangle is specified in construction, a normal Canvas is full-screen size.


    This means that Canvas can be used to set a full-screen background image. (Recall
    that both Frame and Form allow their background colour to be set, but will not
    load an image as background.)'
