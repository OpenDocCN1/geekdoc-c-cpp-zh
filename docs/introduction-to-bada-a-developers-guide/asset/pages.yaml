  md: '# Chapter 2: bada basics


    This chapter gets straight down to the essentials of developing native bada applications
    in C++. We''ll see just how easy it is to get a first skeleton application up
    and running on the bada Simulator.


    To start with, this little app doesn''t do much – think Hello World! But this
    is the code at the heart of every bada app, and as we''ll see in the next few
    chapters, bada makes it easy to build up from this basic skeleton to create a
    full-featured, native application.


    > Note: The Simulator launches from the Eclipse-based bada IDE, which is included
    in the SDK. At the time of writing the SDK installs on Microsoft Windows only.
    It''s likely that bada will support other development options eventually, but
    nothing is currently announced.


    # What you will learn


    This chapter aims to get you started quickly. You will learn:


    +   * How to create a simple application using the Application Wizard

    * How to add a simple UI using UI Builder


    # What you will need


    This chapter assumes beginner''s C++ skills. If you don''t know C++, don''t give
    up: bada works hard to make the app developer''s life as easy as possible. If
    you have experience using any modern programming language, then a good C++ primer
    should be enough to get you up and running.


    By the way, don''t worry if you are new to mobile development. As we saw in the
    previous chapter, there are some things that make mobile unique, and different
    from the world of the desktop. We''ll highlight those issues as they arise in
    the context of each chapter.'
  merge: -1
  pgno: 13
