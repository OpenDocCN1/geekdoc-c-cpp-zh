  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    To send HTTP requests, you must first set up a HttpSession which includes the
    connection type (the default is to send plain text over a TCP/IP connection),
    a proxy server (if any) and the URL of the server that you''re sending HTTP requests
    to. To send a HTTP request and receive a response, you use a HttpRequest which
    manages the interaction between client and server. Clients support one or more
    sessions while a session can consist of many transactions.


    Messages are packed up to be sent using the HttpRequest class, while the response
    is received as a HttpResponse. Adding a header to a request or reading one or
    a whole list of headers in a response is made easy by bada using HttpHeader.


    Like the rest of the communications features of bada, Http requests are dealt
    with asynchronously, so to receive a responses to a request, and to upload messages
    which are divided into chunks, you need to implement a IHttpTransactionEventListener.


    For websites that require a name and password, you can specify this information
    when you open a HttpTransaction by wrapping the login information up in a HttpAuthentication
    object.


