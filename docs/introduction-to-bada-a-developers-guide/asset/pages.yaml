  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    +   - Exception handling, where the C++ standard exception mechanism is expensive
    in terms of memory footprint and processor cycles


    +   - Lack of native string and array types


    Most runtime failures (crashes) of C and C++ programs are caused by the same common
    kinds of programming errors, specifically memory allocation errors and memory
    access errors, including pointer and array indexing errors.


    This simple fact is what motivates many of the distinctive features of Java. No
    pointers, true primitive types for arrays and strings, and automatic garbage collection.


    However, Java imposes a runtime cost that can be noticeable even on the desktop,
    and can be astopper on mobile; it forces devs into a sandbox in which access to
    native features is denied, reduces flexibility, and creates a barrier between
    apps and the native platform.


    On mobile, giving native apps all the power of the underlying platform. However,
    the kind of tolerance for runtime failure that seems to become a habit on the
    desktop is simply not acceptable on mobile. Mobile users will not accept data
    loss, calls hanging, or the other frustrations of buggy apps that crash or freeze.


    To offer the best of both worlds - robust apps that don''t crash and a fully capable
    platform providing native performance - bada imposes some limitations on developers
    by limiting use of some C++ features.


    In particular:


    +   1. Platform code in bada uses 2-phase construction (though it is not enforced
    for classes you define yourself)


    +   2. A simple ownership policy is supported: an app is *always* responsible
    for deleting memory it allocates (every call to new must have a symmetrical call
    to delete), and an app must *always* delete platform allocated objects returned
    from a platform method named with a trailing N, for example SearchN(); in all
    other cases, the platform takes care of deleting the objects it allocates'
