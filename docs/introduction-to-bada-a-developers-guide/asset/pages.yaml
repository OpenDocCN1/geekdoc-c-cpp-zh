    +   3. Set the line color to red:


    ```

    Canvas::SetForegroundColor(Color::COLOR_RED);

    ```


    +   4. Draw a rectangle onto the canvas:


    ```

    Canvas::DrawRectangle();

    ```


    +   5. Show the canvas to the display:


    ```

    Canvas::Show();

