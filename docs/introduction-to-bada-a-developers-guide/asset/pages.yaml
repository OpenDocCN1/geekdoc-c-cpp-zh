  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    Facebook and Twitter can now be accessed easily by mobile users using web pages
    designed for access-on-the-go or by applications.


    Users may be able to do more with their devices, but they are still confronted
    by a huge range of different screen sizes, input methods and user interface ''look
    and feel'' approaches that can make mobile applications a frustrating experience.
    Developers who follow user interface guidelines, such as those provided by bada,
    will create easy to use, consistent applications on a particular platform, but
    there are still many platforms available. Several initiatives such as bada, the
    LiMo foundation, the Open Handset Alliance and the Symbian Foundation show a trend
    towards services to facilitate harmonisation and the easing of application development
    and deployment. However, mobile developers will have to deal with the problem
    of incompatible platforms for some time to come.


    Mobile applications are also used differently to their desktop equipments. If
    you are mobile and want to find information about what is showing on the local
    minima, or a review of a particular restaurant, you want to find that information
    quickly and don''t spend time searching through information you don''t need. Your
    attention span for using the application is limited, so you want to be presented
    with location specific information. You might also be trying to find directions,
    or using the mobile in sunlight or somewhere with a lot of background noise, all
    environmental factors need to be considered.


    The Samsung Wave device represents a very successful attempt of addressing such
    issues by deploying the AMOLED screen, whose design goal among others was to be
    less susceptible to sunlight reflections, or enriching the user interfaces with
    haptics and motion detection.


    # Differences in the ecosystem


    Users expect to be able to find and download the software they want using their
    device when they''re on the move. Users should be served following a wish and
    use notion. When users wish to satisfy a current need they should be able to get
    and use information or services as fast and simple as possible. They want the
    purchasing and installation process to be simple, which is a central stop shop
    such as the SamsungApps store comes. Developers distribute their applications
    via SamsungApps, one central location from users of bada devices can purchase
    and download apps and make in-app purchases. One side effect of this approach
    is that the network operator no longer plays the ''gatekeeper'' role to their
    devices, the user can freely decide which apps to install.'
  merge: -1
