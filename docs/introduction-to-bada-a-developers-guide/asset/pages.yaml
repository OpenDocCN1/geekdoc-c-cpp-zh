    # 5.2.2 bada Server and 3rd party server interaction with open APIs


    On the bada platform, the bada server uses sets of open APIs to communicate with
    3rd party servers. Through open APIs, the bada server can make seamless connections
    to 3rd party servers to retrieve and manage contents. Developers can use simplified
    bada native APIs to interrogate popular search engines and handle lists for popular
    SNS sites such as Twitter, Facebook and MySpace. The bada server does handle the
    work of handling the specifics of connecting to each SNS service. Being scalable,
    scope exists to add further services in the future.


    > Note: currently the SNS Gateway is mainly used to retrieve the buddy information
    from the 3rd party social network provider. For other functions, such as follow
    and un-follow from Twitter, you have to use the HTTP connection and XML parser
    provided by bada.


