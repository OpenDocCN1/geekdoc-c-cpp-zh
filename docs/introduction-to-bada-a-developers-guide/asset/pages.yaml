  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    # Landmarks


    The Landmark class represents a geographical location that has a name and contains
    extra information such as a description and a URL. Applications can create their
    own landmarks, from a user selected location on a map, for example, or pre-defined
    landmarks by other applications or third party content providers.


    Landmark information is stored in a database on the device managed by the LandmarkStore
    class which contains classes to create, modify, delete and search for landmarks
    within a specified area or with given name or category (such as a restaurant or
    theatre), for example.


    The landmark functionality becomes a lot more powerful when used with the bada
    server and the RemoteLandmarkStore class which allows landmark information to
    be shared between applications using the bada server. In remote landmark stores
    consists of user created stores, where the landmark information can be shared
    between all devices that use the same application, or pre-defined stores which
    are handled by third party content providers and available to all applications.


    > Note: landmarks are usually drawn on a map in the overlay layer as markers of
    the class Locations::Controls::MapOverlayMarker. See the discussion of the way
    maps are drawn in the Locations::Controls namespace description.


