  md: 'Introduction to bada: A Developer''s Guide (draft preview, July 2010)


    phase is characterized by many iterations, incremental development (''first things
    first''), and a high degree

    of internal and external communication.


    This phase is composed of the six stages requirements reviewing, design detailing,
    defining test cases,

    programming, testing, user acceptance testing, and a milestone at the end of the
    phase. Again, we would

    like to emphasize that we present a complete mobile software engineering. Due
    to our advice about

    working in an agile way, which implies adaptability, you are free of choosing
    which stages you want

    to deploy in your software project.


    # Stage 2.1: Requirements reviewing


    Prior to starting with the detailed software design, programming, and testing
    the requirements should be

    reviewed and revised – ideally with all stakeholders.


    # Stage 2.2: Design detailing


    In this step the available UI and architecture designs of the first phase are
    detailed into much more fine-

    grained levels – down to element and component level. Although, mobile software
    engineering is a

    comparatively unique discipline, some (mostly vendor-driven) initiatives emerged
    that provide guidelines

    about user interface design. Although you are not bound to use these, we strongly
    recommend complying

    with such guidelines because it simply increases the usability of your product
    and the acceptance.


    Also bada platform introduced such guidelines. These are implicitly used when
    you use the open APIs

    for the UI and extended controls. Apart from the IDE ships with a help document
    that gives

    further information about best-practices for ideal UI design.


    # Stage 2.3: Defining test cases


    Testing is absolutely necessary in any software engineering endeavor. In mobile
    software engineering it is

    more multifaceted and more variables need to be taken into consideration. The
    definition of test cases is

    t first activity related to testing. The cases can be derived from the requirements.


    # Stage 2.4: Programming'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    This stage means transforming the designs into program code that can finally successfully
    pass all test cases. Although, mobile devices get more and more powerful, nevertheless
    it is highly recommend to write efficient code with an eye on conservative computation
    in order to conserve as much battery capacity as possible. availability of battery
    power is crucial as we argued in chapter 1 earlier.


    The bada IDE ideally supports you with all you need for writing your program code
    such as syntax highlighting, code completion, comprehensive documentation and
    example material, and all the necessary compiling, linking, deploying, and running
    functionalities.


    Important is also to understand that every mobile application is subject to a
    ‘technical’ application lifecycle, which subsumes initializing, running, terminating,
    and terminated. The bada platform and its shipped IDE to access it provides the
    support to easily deal with this app lifecycle and to do the right things in the
    appropriate stages (through well-defined methods).


    # Stage 2.5: Testing


    In the mobile software engineering process, much emphasis must be placed on this
    stage: testing. We must differentiate between the testing platform and the real
    platform. The testing platform is usually a desktop computer that runs an emulation
    of the mobile device. Unfortunately, emulators per se exhibit a great discrepancy
    compared to the real mobile devices. Emulator tests are tests in ideal lab environments
    where context factors such as position or light conditions are either not considered
    or simulated. Hence, it is necessary to test software on the real target mobile
    device and in the real world environment where the software is intended to be
    used. All "controllable" variables might be caught by the software such as behavior
    according to device capabilities, adapting to screen size, masking network disconnections
    or loss of GPS signal.


    The last three (2.3 defining test cases, 2.4 programming, and 2.5 testing) are
    characterized by many micro iterations and in reality they partly also executed
    in parallel. Particularly testing naturally iterates with the test case definition
    and programming stages. It usually also iterates with the design detailing and
    the requirements reviewing steps.


    # Stage 2.6: User acceptance testing'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    User acceptance tests at the end of the second phase are again optional but recommended.
    By this, engineers can make sure to really meet users'' requirements with a software
    version that more and more approaches a final state. This type of testing can
    be repeated and can be fed back into earlier steps of this phase. Human-computer
    interaction techniques such as audio/video recordings, questionnaires, cooperative
    evaluations, focus groups, or controlled experiments can be deployed and are beneficial.


    Afterholders accept the existing version of the mobile software, it can be denoted
    as a release. This means that the milestone Version Released is fulfilled, and
    the next iteration of the same phase (to realize a further increment) or the successive
    phase can start.


    # Phase 3: Distribution


    This phase mainly deals with bringing the mobile software product into the market
    to the users. This phase is less iterative than the other two. The phase is composed
    of the three stages marketing, preparing for deployment, product maintaining,
    and a milestone at the end of the phase.


    # Stage 3.1: Marketing


    The marketing stage exemplifies how and how the processes of mobile software engineering
    and product management overlap and complement one another. This stage serves for
    the finalization of the business model and distribution policy and for preparation
    of the actual market entry of the software product. Marketing is partly in parallel
    to other steps and already starts during earlier phases as suggested by the product
    management process.


    # Stage 3.1: Preparing for deployment


    In this step, the software must be prepared (i.e. signed) such that the needed
    functionality of a mobile device can be accessed appropriately. It must be decided
    which components and contents are packaged together and which parts may be downloaded
    or installed on-demand. Also the distribution channel must be prepared which usually
    involves requesting an account and getting familiar with the according policies.
    Finally, the mobile software is physically distributed and installed on the end
    users'' devices.


    # Stage 3.1: Product maintenance'
  merge: -1
  pgno: 335
