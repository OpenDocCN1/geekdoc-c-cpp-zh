  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    Turning back the time machine, mobile platforms were difficult. But bada shows
    how far things have come. Some platforms still bear the legacy - Symbian''s quirky
    build-system, for example. In fact, these are all part of what makes mobile different
    and gives development its reputation for difficulty.


    At the time of writing, the first bada phone has been shipped – the Samsung Wave,
    a feature-packed, top-of-the-line phone that defines the high end of the bada
    product line. Eventually, bada phones will extend from this high point down through
    the midrange of affordable "smartphones for everyone", taking smartphone features
    to the mass-market.


    Before you can build and deploy a bada app on the Wave device you need to install
    the Wave driver in your desktop operating system. These device drivers are a simple
    executable shipped within the IDE/SDK bundle that you downloaded from the developer.bada.com
