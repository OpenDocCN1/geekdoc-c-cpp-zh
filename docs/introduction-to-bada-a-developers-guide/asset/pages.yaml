    # 4.2.5 Native idioms and types tutorial


    It''s time to get practical again.


    When you read through bada code in the SDK tutorials and samples, you''ll see
    the native types being used in real world contexts, and of course you''ll need
    to use them in your own code.


    The following brief tutorials will get you to speed with the things that bada
    does differently and will be a useful reference to come back to as you explore
    the platform more deeply. You may want to bookmark these pages.


    # 4.2.6 The problem of object construction


    In C++, like C, memory at runtime is divided between:


    +   * Static memory, which is assigned by the compiler and is part of the application
    binary at runtime

    * Stack memory, allocated and freed at runtime by the operating system as function
    activation frames for the running program are created and released

    * Heap memory, allocated and freed dynamically as requested by a program


    Memory leaks are caused when programs allocate heap memory and fail to release
    it. Because mobile phones typically run for days or longer without being switched
    off, memory leaks can seriously compromise the phone''s performance. The problem
    is compounded because (relative to the desktop), phones typically have much less
    RAM, and (in absolute terms), because of the power and physical size constraints
    of phones, memory technologies, e.g. Flash file systems are slow.


    53'
