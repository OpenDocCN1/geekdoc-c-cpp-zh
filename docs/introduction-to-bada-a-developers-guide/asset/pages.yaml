  md: '# IComparer


    Enables comparison of two individual objects


    # IHashCodeProvider


    A hash map


    Again, as exactly with the concrete collection classes, a templated version of
    each of the interface classes is provided for use with the template classes: for
    ICollection representing a templated collection, IListT, IMapT, and so on.


    Here is the difference between the object based classes and the template based
    classes:


    +   - Object based collections derive from ICollection, and store objects that
    derive from Object

    - Template-based collections derive from ICollectionType, and should typically
    be used to store C++ primitive types


    > Note: object-based collections don''t collect copies of objects (for obvious
    reasons of efficiency), instead they collect pointers. So any object you want
    to put into a collection class must be allocated using operator new (or an overload).
    Otherwise, if your collection stores a pointer to an automatic variable, its lifetime
    is unpredictable, and it likely will not exist when the collection comes to use.
    Your app will crash, unpredictably.


