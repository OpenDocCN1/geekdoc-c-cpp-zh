    The Services namespace provides different ways for users to interact using the
    features of the bada server. There are features to build social relationships
    between bada users and a social networking aggregation service (SNA) which provides
    built in support for social networking services such as Facebook and Twitter all
    from within the application.


    As you can see the table, the functionality of Services can be broken into five
    groups: Profile, Privacy, Messaging and Buddy management work with the features
    of the bada server to connect bada users, while the SNS Gateway provides the link
    from the application through the bada server and onto social networking services.


    The ProfileService class is used to manage profiles. A user''s profile actually
    consists of several different parts: a BasicProfile, which is public by default
    and other profiles such as ContactProfile and SocialProfile which are available
    across the device to all permitted users, which are set as private when stored
    on the bada server. Users must choose to be listed in the public directory on
    the bada server and can choose choose of their other profiles are be accessed
    by all or a specified group of users. You need to implement IProfileListener to
    respond'
