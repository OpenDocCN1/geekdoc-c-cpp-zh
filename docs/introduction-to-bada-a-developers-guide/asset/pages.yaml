  md: '# 2.1.3 App metadata


    There are two important files that we haven''t mentioned yet, application.xml
    and manifest.xml. The application.xml is generated by the wizard, and placed into
    your project root directory. The manifest.xml is ideally created by the Application
    Manager on the developer.bada.com website or alternatively you can use the default
    file created by the wizard.


    These are metadata files and are essential to your project. They declare application
    information used to create your final app package – the app name and version,
    vendor name, and so on – as critical information about the APIs that your app
    uses and any security permissions, known as privileges in bada, that are required
    to use. Privileges are part of the bada security model, and we will look at them
    in detail in Chapter 4.


    When you start a real project, you''ll need to create a custom version of the
    manifest using the tools that are available through your account on the bada developer
    portal (see section 2.7). But to start with wen''t worry worry about these details
    at all; the default metadata files generated by the App Wizard will be fine to
    get started.


    # Project metadata files


    # application.xml


    +   Used by the app packaging tools to create an installable package. Declares
    the app name, description, vendor, and version; identifies the app icon files.


    # manifest.xml


    +   Used for privilege checking and by the certification process. Declares app
    properties including keys and IDs; required device features, for example CPU type,
    minimum heap size, screen size, sensors used; and required privileges.


    > Note: if you''ve done any widget development, then application.xml will look
    familiar: it''s equivalent of the config.xml file that defines a widget package;
    and if you''ve developed for Android, manifest.xml does a similar job to the Android
    manifest file.'
