    - Canvas

    - EnrichedText


    The graphics namespace contains classes for drawing 2D and 3D graphics, text and
    images.


    All graphics are rendered into a Canvas and the Canvas class contains the methods
    for drawing basic shapes and the graphic settings such as foreground and background
    color, line style and font information for text drawing. You can create your own
    Canvas, but in most cases you will draw into the area of control.


    > Note: to get a Canvas with the bounds of the whole application frame, we use
    the Osp::App::Application::GetAppFrame method to get the frame control and then
