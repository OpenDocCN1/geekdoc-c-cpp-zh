  md: "# Introduction to bada: A Developer's Guide - (draft preview, July 2010)\n\n\
    This is all straightforward enough. The problem arises if the class constructor\
    \ attempts to allocate memory, for example calling new to create a class member\
    \ that happens to be an object, and the allocation fails. In this case, the destructor\
    \ cannot be called to delete the object, because the object pointer will be null\
    \ (since construction failed), and trying to delete a null pointer will cause\
    \ an exception. Meanwhile, if any did succeed as part of construction, before\
    \ the failed allocation occurred, there is no way for either the system of the\
    \ program to free memory, because no pointers exist to it. The allocated memory\
    \ is orphaned.\n\nOn mobile, low memory conditions should be assumed to occur\
    \ as a matter of course. Multitasking, web browsing, playing music, recording\
    \ and viewing images, playing or recording video, and trying out apps, are all\
    \ part of the everyday for a phone, and may occur in any dynamic pattern of usage.\
    \ Any one may cause a memory usage spike, if your own app is unlucky to encounter\
    \ it, it may cause memory to be unavailable to you. Worse, if any program running\
    \ on the device is leaking memory, then over time, a low memory condition will\
    \ become a certainty, and all apps on the device will be effectively compromised\
