  md: '# Osp::Base::Collection


    Declared in: FBaseCol.h


    Privileges required: None


    # Summary


    Selected important classes:


    +   * ICollection

    * IComparer

    * IEnumerator

    * LinkedList

    * Stack

    * Queue


    This is the namespace for handling various collections such as arrays, lists and
    stacks. It contains methods to make it easy to create and manipulate these collections.
    Collections are either object or template based. Object based collections, derived
    from ICollection are used to store objects, while template based collections,
    deriving from ICollectionT are used to store interface pointers and primitive
    types such as integers.


    For the sake of clarity, Figure 6.5 just shows the derivation and relationships
    between the non-template versions of the classes in the namespace, but for each
    collection class shown in the diagram there is also a version of the class that
    takes a template type- LinkedList and LinkedListListT, for example.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '![](img/864ad06741e6f2ddc308988094c37b2f_201_0.png)


    The Collection classes shown in Figure 6.5, you just need to choose an appropriate
    collection class to match the way you want to manage your data.


    Stack and Queue are simple collections of objects organized in last in first out
    (LIFO) order and first in out (FIFO) order respectively.


    ArrayList and LinkedList implement a list of objects which can be accessed by
    index, whereas HashMap and MultiMap manage a list of key/value pairs, represented
    MapEntries. You can iterate through the elements in both of these collections,
    to perform an operation on each element, for example, by using the IEnumerator
    class returned by the GetEnumerator() method of the collection you''re using.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Introduction to bada: A Developer''s Guide (draft preview, July 2010)


    **Note:** ArrayList and LinkedList are used in the same way, but the implementation
    of each class is subtly different. ArrayList items are stored in a contiguous
    area of memory, accessing the list faster, but adding elements slower than a LinkedList
    since the entire block of memory may need to be resized as a new item is added.
    The LinkedList is slower to access, but faster to resize. So if you have a fixed
    list and don''t plan on adding or removing items frequently, then choose an ArrayList.
    If the number of items in the list is likely to change more often, then use a
    LinkedList.


    IComparer classes can also be used to Sort() the list, in the case of ArrayList
    and LinkedList or for key comparator for key/value pair lists. There are number
    of comparators provided by bada to compare specific types, including IntegerComparator
    and StringComparator but for more complex object comparisons, you could develop
    your own comparison class from IComparer.


    **Note:** object-based collections don''t collect copies of objects, instead they
    collect pointers. So any object you want to put into a collection class must be
    allocated using operator new. Otherwise, if your collection stores a pointer to
    an automatic variable, its lifetime is unpredictable, and it likely will not exist
    when the collection comes to use it. Your app will crash, unpredictably.


