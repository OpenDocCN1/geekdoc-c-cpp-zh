  md: '# Introduction to cuda: A Developer''s Guide - (draft preview, July 2010)


    Unfortunately, in C++ the problem of ensuring memory is not leaked is more complex
    than it is in C, and requires more than just discipline on the part of programmers
    (i.e. matching every allocation with a deallocation).


    In C++, allocating heap memory may be done explicitly by the programmer with calls
    to operator new or new[], or implicitly by the compiler as part of C++ object
    creation.


    Unlike C, in which every runtime is either static on the stack or on the heap,
    the parts of a single C++ object may be allocated in one or more or all of those
    allocations, depending on how the class has been coded.


    Because a C++ class has only one destructor (which will be the default one generated
    by the compiler, if the programmer has not explicitly coded a destructor), while
    it may have many different constructors, destructors must be coded with care.


    The result of all of which is naive coding in C++ can very easily result in memory
    leaks.


    There are two specific problems that make matters even worse. The first problem
    is that in C++, when a constructor fails, the destructor is not called.


    The problem of memory leaking is, as we have said, a problem with heap memory.
    (Static memory is never a problem, because it is allocated at compile time, and
    stack memory frames are automatically released when the functions with which they
    are associated).


    A (heap allocated) C++ object is created when the new operator is called on a
    class constructor. The allocated memory must be released with a matching call
    to delete(), i.e. allocation and deallocation must be symmetrical if memory is
    not to leak. delete() invokes the class destructor. Within the destructor, any
    further memory allocated by the class should be released with appropriate calls
    to delete(). When the destructor returns, the final step performed by delete()
    is to release the memory that was allocated for the object itself.


    > For an excellent discussion with examples, see Franek, 2004, Chapter 8.'
