  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    By the way, the splash screen is displayed to fill any delay while your app is
    launched. Delay may occur for a number of reasons, depending on the load on the
    phone at any time. The splash screen is not displayed by the app itself to hide
    a delay while the app initializes. And in fact you should design your app to postpone
    any initialisation which might cause perceptible delay in showing its main screen.
    You can do this by performing such initialisation in the background using multi-threading
    techniques, or by deferring this deeper initialisation until the app has launched,
    or both.

    A hint: in order to pass the certification process a bada app must have its own
    splash screen and app icon.


    # 2.1.5 Standard output


    One useful view in the Eclipse IDE is the Output page. When you launch an app
    in the Simulator, the system logs an ''Application started'' message, and when
    you close the system logs an

    ''Application finished'' message:


    ```

    0010:200,INFO,P26,T-01,A-01,OspMain (24) > Application started.

    0014.030,INFO,P26,T-01,A93,OspMain (39) > Application finished.

    ```


    Between these logs, you can output your own printf-like logging messages to trace
    your app''s behaviour at runtime, using bada logging macros, AppLog(), AppLogDebug(),
    and AppLogError(). For example, to output a log message, add the line:


    ```

    AppLog("This message will display in the output view");

    ```


