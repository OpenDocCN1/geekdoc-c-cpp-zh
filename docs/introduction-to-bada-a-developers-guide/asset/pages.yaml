  md: '# # 4.2 bada coding idioms


    # ## 4.2.1 C++ and bada


    Of all current mainstream programming languages, C++ is the most powerful and
    flexible. That doesn’t make it the most popular language. In fact, at the time
    of writing, C++ maintains a steady third place in popularity surveys, behind Java
    and C.^3


    There are good reasons why C++ is unlikely to win a popularity contest. Compared
    with more recent languages (Python, say, or even Java), it has a complex syntax.
    There are several reasons for that. One is its retention of C as a proper language
    subset. Another is the deliberate decision to favour terse and compact (and even
    cryptic) over verbose and transparent. Yet another is the breadth of the language
    - both high-level and low-level and everything in between; supporting procedural,
    OOP, and generic (template-based) programming styles. And finally, while the previous
    point suggests maximalist goals (include everybody!), C++ takes a very minimalist
    view of what a programming language should aspire to be. Its built-in types are
    essentially those of C, and there (more or less) the language ends. There are
    no frameworks, or class libraries, included in the language proper. (Even the
    minimalist std.h and stdio.h are strictly optional).


    For all these reasons, C++ is not the kind of language that holds your hand. This
    probably gives it a more fearsome reputation as it deserves. But it also means
    that any platform based on C++ must tame the language to suit its own purposes.


    > ^ E.g. according to the TIOBE Programming Community Index software survey, April
    2010


    http://www.tiobe.com/index.php/content/paperinfo/tpcci/index.html. Intriguingly,
    in 2010 Java and C have swapped places in the top two places, with C now the most
    popular language, as Java’s popularity shares fairs. Meanwhile is roaring around
    the table. For comparison: C and Java score around 20%; C++ around 10%; and Objective
    around 2%.'
