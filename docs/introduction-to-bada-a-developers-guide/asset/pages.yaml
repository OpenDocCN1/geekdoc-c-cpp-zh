  md: '# 2.9 Get magnetic field from Compass Sensor


    Problem description


    You want to obtain data from the magnetometer (compass sensor) to interpret that
    information for various applications (e.g., determine device orientation or metal
    detection).


    The recipe


    The following configuration is required.


    | Namespaces used:

    | Osp::Uix |

    | Header files to #include:

    | FUixSensorManager.h, FUixSensorTypes.h |

    | Required libraries:

    | FUix.lib | .so |

    | Required privilege level:

    | Normal |

    | Required privilege groups:

    | none.


    This recipe is related to the namespace Osp::Uix. Uix stands for UI extension,
    which provides additional novel ways for the user to interface with a device.
    These are not covered in basic UIs. Traditional UI approaches mostly depend on
    oral or visual in- out for providing information, they take commands or information
    from the user through buttons. UI extension is intended to improve the user''s
    experience of interacting with a mobile phone.


    This recipe covers one particular part of that namespace. We make use of the magnetometer
    (magnetic sensor). This sensor is a 3-axis electronic compass. It can also be
    used for determining the orientation. The magnetic sensor measures the magnetic
    field strength. The measurements are split into the X, Y, and Z axis and the unit
    is Micro-Tesla (µT). Note that several factors can have an impact on the data
    coming'
  merge: -1
  pgno: 314
