    # Text and Unicode


    Unicode is a universal encoding that aims to support all living languages (and
    most dead ones too, not to mention some made-up ones) Fonts by providing codepoints
    for the individual characters of some 90 alphabets, scripts, ideographic, and
    hieroglyphic writing systems. The list of supported scripts includes everything
    from ASCII and Western Latin and no-Latin languages like Greek and Cyrillic, all
    the way through the Semitic and Indic scripts and other scripts of the Indian
    sub-continent, to the ideographic character sets of the Far East including Chinese,
    Japanese, and Korean hangul. Unicode is vast.


    Like most modern platforms, whether mobile or desktop, bada has comprehensive
    Unicode support. Most importantly, bada supports multi-way conversion between
    the most common encoding schemes (many of which Unicode includes as subsets within
    its global character space), including:


    | Encoding scheme | Description |

    |---|---|n| UTF-8 | The encoding used by XML, and therefore increasingly the standard
    for web-based textual resources |

    | Latin1 | Western alphabets i.e. ISO-8859-2 |

    | UCS2 | |

    | ASCII | |

    | GSM | |


    Encoding and decoding between different schemes can either be done per-String(or
    per ByteBuffer or MCharBuffer using a GetBytes() or GetChars()) method of the
    encoded string, or by constructing an Encode or Decoder, which you should do for
    large blocks of text, or where you have sequential data, for example if you are
    reading text in from an external source.


    Natively, all character strings are Unicode by default.'
