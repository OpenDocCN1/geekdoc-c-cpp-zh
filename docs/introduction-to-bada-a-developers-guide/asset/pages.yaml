  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    It is essential to understand that users'' requirements of mobile software are
    substantially different from software for fixed environments (such as Desktop
    software). Mobile software must be engineered by seriously respecting the different
    characteristics of mobile software. We define this type of software development
    for a mobile usage context as Mobile Software Engineering.**


    # # 1.2 Characteristics of mobile software


    Mobile software has a number of characteristics that make it very different to
    desktop or web based software, the most important being:


    +   1. Technological differences

    2. Differences related to usability and user experiences

    3. Differences in the ecosystem


    In the following sections we touch on each of these topics in more detail.


    # ## Technological differences


    Mobile handsets are getting steadily more powerful, with processor speeds of up
    to 1GHz, memory of up to 512MB and flash memory of 16GB or more common on many
    devices. Advances in display technology have also enhanced the user experience.
    The first bada-powered device, the Samsung Wave, is equipped with the Super AMOLED¹
    display which delivers better contrast, more efficient energy consumption and
    less sunlight reflection than older mobile displays.


    As connections get faster, the services available to users have grown to include
    rich multimedia streaming and games, while user confidence in increased connection
    security has led to an explosion in mobile eCommerce and eTicketing apps.


    > ¹ AMOLED stands for Active-matrix organic light-emitting diode.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# Introduction to bada: a Developer''s Guide - (draft preview, July 2010)


    But it''s the advances in positioning technologies that have led to the biggest
    revolution in mobile apps. GPS is now standard even in low end devices and offers
    developers an easy and powerful way to develop location aware apps through their
    APIs for location services.


    Advances in hardware provide new development possibilities, such as the wide range
    of sensors which can be exploited to improve the user experience. Some devices
    include accelerometers, electronic compasses, tilt, light and temperature sensors
    and of course touch sensitive sensors. Users will find it natural to tilt their
    device to the enable landscape mode or list a random set of restaurants by shaking
    the device. Sensors provide functionality not available to fixed, desktop applications.


    Developing for mobile devices also provides some challenges to those used to creating
    desktop or web applications. Mobile hardware is improving rapidly, but devices
    are still not as powerful or as much storage as desktops or servers. While communications
    technology has become more reliable, a developer cannot assume an always on internet
    connection. The way that the user interacts with a device is also different. A
    smaller screen, touch screen or small keyboard input cannot offer the same experience
    as a proper keyboard and mouse.


    The most important, and often overlooked, difference in mobile compared to desktop
    development is energy consumption and the dependence on the battery. Battery capacity
    of devices has increased, but so have the range of technologies which consume
    a lot of energy: GPS, Wi-Fi, Bluetooth, 3G and multimedia support being prime
    examples. Some of the currently successful devices do not even make it through
    the day without needing recharging and battery life is a frequent user complaint.


    Device manufacturers are doing their best to improve battery life, but software
    developers have their part to play through careful use of resources. Because mobile
    phones typically run for days or weeks or longer without being switched off, memory
    leaks, for instance, can seriously compromise the phone''s performance.


    # Differences related to usability and user experiences


    New mobile technologies such as sensors and touch screens allow us to build better
    user interfaces and to represent information in more user friendly and usable
    ways. In particular Web 2.0 applications such as'
  merge: -1
  pgno: 5
