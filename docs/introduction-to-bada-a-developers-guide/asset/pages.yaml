    network (say, from Flickr), or embedded in the app by the developer at build time
    (background images used in the UI).


    In all of these cases, typically the image exists in the first instance as a data
    file.² In format it will be viewable by media player and browser apps, assuming
    the file is a supported format.


    Before it can be used within an application, image data must be loaded from file
    into memory. Image data that is held in memory on the phone should typically be
    saved into a file format before it is transferred off the phone, or before it
    can be shared with others on the phone.


    In bada, the Bitmap class encapsulates image data in memory, and the Image class
    is provided as a utility class to perform conversions both ways between files
    and Bitmaps, as well as directly between different files. Using the Image class,
    image data can be decoded into a Bitmap from a supported file format. A Bitmap
    object contains a (decoded) physical copy of the original file data, stored in
    a standard bitmap format (see below). This means after decoding, the Image object
    and the original image file are no longer required.


    To create a Bitmap from an image file the steps are:


    +   1. new and Construct() an empty Image object:


    ```

    Image* pImage = new Image();

    pImage->Construct();

    Bitmap* pBitmap = null;

    ```


    +   2. Call the Image.DecodeN() method to decode image data from the file. DecodeN()
    returns a Bitmap object:


    ```

    pBitmap = pImage->DecodeN(L"/Res/bada.png", BITMAP_PIXEL_FORMAT_ARGB8888);

    ```


    +   3. Delete the Image object:


    ```

    delete pImage;

    ```


    > ² This is a simplification. Images can also be stored as binary data in byte
    buffers. See the SDK API Reference.'
