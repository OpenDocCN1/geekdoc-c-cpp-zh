  md: '# # 2.2 Adding a button to a Form


    # ## Problem description


    You want to add a Button control to a Form.


    # ## The recipe


    The following configuration is required for this recipe:


    | Namespaces used:

    | Osp::Ui, Osp::Ui::Controls, Osp::Media¹, Osp::Graphics²⁵ |

    | Header files to #include:

    | FUI.h, FUIControls.h, FMedia.h, FGraphics.h²⁵ |

    | Required libraries:

    | FUI, FUIControls, FMedia²⁵, FGraphics²⁵ [.lib |.so] |

    | Required privilege level:

    | Normal |

    | Required privilege groups:

    | IMAGE²⁵ |


