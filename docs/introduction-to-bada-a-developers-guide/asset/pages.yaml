    Base applications are those which are stored in the built-in memory of the device
    and are not removable via the Application Manager. Base applications export features
    which are commonly required by other applications e.g. playing a video, retrieving
    a contact. Access to these features is provided through Application Control.


    The Application Manager is used to find the base application that provides the
    feature required by an application, and an instance of the Application Control
    is returned. The Application Control is then used to start a base application
    and control specific behavior. Once the Application Control goes to the background
    and the target application control UI is displayed.


    > ⁴ Required for example 1 only.'
