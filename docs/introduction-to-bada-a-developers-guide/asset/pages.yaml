  md: '# 2.1 Your first bada application


    Native bada apps are C++ executables that combine the code that you write with
    framework code. Because the bada frameworks take care of the basic functionality
    that every app requires, there is very little code required to create a minimal
    app, as we will see.


    To start with, we will use the bada Simulator only. In the next chapter we''ll
    dig a little deeper and show you how to build for (and deploy to) a real bada
    phone.


    Because bada is highly modular, most of your time as a developer will be spent
    connecting together the pieces while the bada frameworks do the heavy lifting
    for you.


    As you might expect, all bada applications are fully graphical programs. In fact,
    one easy way to think of a bada application is as a GUI that does something (where
    a GUI, of course, is a Graphical User Interface.)


    For any app, the GUI is where the user and the app meet. It''s the GUI that presents
    the functionality to the user, and the GUI that allows the user to control that
    functionality. For the user, your GUI is your app, and to a large degree determines
    the app experience.


    All bada apps that use the standard UI elements the distinctive look-and-feel
    and behaviour of the bada UI and application frameworks. When you need more customised
    elements, you can derive your own and extend the default behaviour. Of course,
    there may be times you want complete control (in a game, for example), and don''t
    want the standard look and feel. In that case bada allows you to write directly
    to the full-screen display to create your own UI from scratch.


    But that''s enough of an introduction! If your C++ is rusty, this is a good time
    to get out your favourite C++ primer. Then fire up the bada IDE, and follow along.


    > Note: the bada IDE is included in the SDK and is based on the industry-standard
    Eclipse IDE, see http://eclipse.org/, and includes the Sourceery G++ GNU Toolchain,
    including C++ compilers for Win32 Simulator targets and ARM core targets. The
    SDK adds adds header files, libraries, documentation, and code Example and Sample
    programs. The Appendices for more information'
  merge: -1
  pgno: 14
