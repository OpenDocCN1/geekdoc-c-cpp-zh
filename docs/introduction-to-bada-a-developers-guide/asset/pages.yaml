    # 4.2.8 Exception handling


    Exception handling arrived in C++ not exactly as an afterthought, but a long time
    after the first release⁶. Efficiency was an important design goal⁷ in particular
    adding time or space cost to code that doesn''t use exceptions. That goal was
    certainly achieved, but quantifying the cost for code that does exceptions is
    more controversial.


    At least in the unoptimised case, "turning on" standard C++ exception handling
    can add as much as a 10% code size increase to a system,⁸ with a measurable runtime
    performance penalty when exceptions are thrown and handled.


    For these reasons, as well as for reasons of simplicity, bada does not support
    native C++ exceptions, instead implements a simple error handling mechanism.


    In bada:


    +   - All exceptions are caught and returned as a simple type-defined result value

    - Framework methods that can fail return a result value, and app developers are
    encouraged to do the same in their own code

    - Framework methods are provided to get and set the "last result", and get error
    messages, which assists simplistic propagation of exceptions


    > ⁶ See Ststrup green book, 1.0 released 1986, exceptions included 1992.

    ⁷ Strou p.385.

    ⁸ Morris. The example is Symbian.'
