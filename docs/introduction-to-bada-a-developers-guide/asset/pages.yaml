  md: '# 2.5 Display MessageBox to confirm an action


    # Problem description


    You want to prompt the user for confirmation of an action, outside the fixed view
    or menu structure of

    your application.


    # The recipe


    The following configuration is required.


    | Namespaces used:

    | Osp::Ui, Osp::Ui::Control |

    | Header files to #include:

    | FUI.h, FUIControls.h |

    | Required libraries:

    | FUI [.lib | .so], FUIControls [.lib | .so] |

    | Required privilege level:

    | Normal |

    | Required privilege groups:

    | None |


    This recipe shows how to launch and display an acknowledgement MessageBox that
    displays a message

    to the user and an OK button, and waits for the user to confirm by pressing OK.
    A MessageBox can also

    have no button, in which case the message is simply displayed, or two or three
    buttons. Buttons have

    fixed text, set by the MSGBOX_STYLE parameter.


    Handling the user response is easy - it is set in the argument passed to the launch
    method.


    Unlike other-derived classes which are used as building blocks to populate the
    Forms from

    anapplication''s UI is constructed, a MessageBox is a so-called modal control;
    a MessageBox is

    instantiated, initialized, and displayed outside the normal event flow of the
    currently displayed Form and

    any Controls the Form owns.'
  merge: -1
  pgno: 283
- img_proc: true
  md: "Unlike other controls, MessageBox derives from the Window class, via the derivation\
    \ chain:\n\nObject -> Control -> Container -> Window -> [ MessageBox -> Popup\
    \ ]\n\nA MessageBox therefore is drawn directly into the window area it defines,\
    \ on top of the current Form.\n\nConceptually therefore a MessageBox defines an\
    \ additional mode of interaction outside the fixed infrastructure of the application's\
    \ Forms; a MessageBox is direct and immediate.\n\nTo use a MessageBox, #include\
    \ the following header files and declare the appropriate namespace:\n\n```\n#include\
    \ <FUI.h>\n#include <FUIControls.h>\n#include <FBase.h>\n\nusing Osp::Ui::Controls;\n\
    ```\n\nThe code to instantiate and launch a MessageBox is almost trivial:\n\n\
    ```\n/*\n * Giving a title and message for the popup windows showing to the user\n\
    \ */\nvoid Utils::showMessage(const String &title, const String &message)\n{\n\
    \    MessageBox message;\n    MessageBox.Construct(title, message, MSBOX_STYLE_OK,\
    \ 3000);\n    // ShowAndWait - draw, show itself and process events\n    int modalResult\
    \ = 0;\n    message.ShowAndWait(modalResult);\n    switch(modalResult)\n    {\n\
    \        case MSBOX_RESULT_OK:\n            // TODO\n            break;\n    \
    \    default:\n            break;\n    }\n}\n```"
  merge: -1
  pgno: 284
- img_proc: true
  md: 'Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    The MessageBox constructor is used to set values for the title, message, style,
    timeout period of the instance; and then the ShowAndWait(result) method is called,
    which instantiates and displays the MessageBox, sets the user response in the
    result argument, and manages destruction and cleanup.


    # Hints, pitfalls, and related topics


    Forms and menus create the fixed architecture of an interactive application. But
    a typical application requires the more dynamic kinds of interaction provided
    by prompts, alerts, messages and notifications based on the specific context of
    the moment.


    The MessageBox class is almost trivial to use, but limited in the options it provides;
    in particular, only a small selection of preset buttons is provided:


    | MSGBOX_STYLE_NONE | Contains no buttons |

    | MSGBOX_STYLE_OK | Contains one button: OK |

    | MSGBOX_STYLE_CANCEL | Contains one button: CANCEL |

    | MSGBOX_STYLE_OKCANCEL | Contains two buttons: OK and CANCEL |

    | MSGBOX_STYLE_YESNO | Contains two buttons: YES and NO |

    | MSGBOX_STYLE_YESNOCANCEL | Contains three buttons: YES, NO and CANCEL |

    | MSGBOX_STYLE_ABORTRETRYIGNORE | Contains three buttons: ABORT, RETRY, and IGNORE
    |

    | MSGBOX_STYLE_CANCELTRYCONTINUE | Contains three buttons: CANCEL, TRY and CONTINUE
    |

    | MSGBOX_STYLE_RETRYCANCEL | Contains two buttons: RETRY and CANCEL |


    Where more flexibility is required, the Popup class enables a similar style of
    dynamic interaction, and is fully customizable – also requires explicit construction,
    initialization, display, and cleanup. Popups can also contain buttons, labels,
    and other simple controls to enable capturing a variety of user choices or selections.


    On return of the ShowAndWait() method (which is a synchronous function), the result
    argument contains the result of the call.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Introduction to bada: A Developer''s Guide - (draft preview, July 2010)


    The following results are returned by a MessageBox:


    | MSGGBOX RESULT CLOSE | The message box was closed |

    | MSGGBOX RESULT OK | The OK button was selected |

    | MSGGBOX RESULT CANCEL | The cancel button was selected |

    | MSGGBOX RESULT YES | The Yes button was selected |

    | MSGGBOX RESULT NO | The No button was selected |

    | MSGGBOX RESULT ABORT | The Abort button was selected |

    | MSGGBOX RESULT RETRY | The Try button was selected |

    | MSGGBOX RESULT IGNORE | The Ignore button was selected |

    | MSGGBOX RESULT CONTINUE | The Continue button was selected |


    The MessageBox class is easy to use, but it has one important limitation.


    +   - The call to launch a MessageBox is synchronous and blocking; the MessageBox
    is not dismissed until the user response is received or until it times out.


    For this reason a MessageBox should never be launched from a listener callback
    method, since it will block the callback''s return and disrupt the asynchronous
