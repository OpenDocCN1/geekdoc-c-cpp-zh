    The UI namespace together with the `Controls` sub namespace provide the classes
    and methods to implement a graphical user interface. The `Ui` namespace provides
    common base classes for all controls as well as interfaces for event handlers.


    An application UI is divided into layers of a frame, forms and controls. The frame
    is the top level window of an application and an application can have only one.
    Within that forms- there can be many forms within an application and within forms
