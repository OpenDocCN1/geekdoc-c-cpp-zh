- img_proc: true
  md: 'In contrast:


    +   - using Graphics::Canvas;


    makes the Canvas class from the Graphics namespace available, but not the Bitmap
    class, for which you would need to make a separate declaration:


    +   - using Graphics::Bitmap;


    To include a nested namespace, for example Ui::Controls, you must explicitly include
    the nested namespace, and not just the containing namespace. To use a Button object,
    for example, the following would appear in your code:


    +   - using namespace Ui; using namespace Ui::Controls;


    # 6.2 How this chapter is organized


    In this book we''ve divided the functionality of bada into 9 groups - it''s the
    same way the recipes (in the print publication) are organized, for example. Figure
    6.1 shows how each namespace maps to each area of functionality. Some namespace
    features apply to more than one of the functional groups, such as Locations and
    Locations::Services, but it should provide a starting point for identifying which
    namespace contains the functionality you need.'
