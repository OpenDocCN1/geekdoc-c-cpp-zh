  md: '# Introduction to bada: a Developer''s Guide (draft preview, July 2010)


    It is essential to understand that in the Running state we differentiate between
    the two sub-states Foreground and Background. There are two methods with these
    states: OnForeground() and OnBackground().OnForeground() is implicitly called
    when an app is started and the app is shown. A running app is sent to the background
    when the Home key is pressed or when a native application such as an incoming
    call or SMS is invoked. The OnBackground() method is called and it is recommended
    to stop resource intensive operations and release unused memory. Once your app
    moves into the foreground again you can proceed normally.


    Recall also the long list of listeners the Ui builder added to our MainListForm–
    key presses, touch and multi-touch events, and focus events will cause all listener
    implementations (call-backs) to run, so that we can handle the events appropriately.


    And of course system events will generate call-backs. As we''ve seen, the minimum
    set of system events should be prepared to handle is:


    +   - OnBackground()

    - OnLowMemory()

    - OnBatteryChanged()

    - OnScreenOn()

    - OnScreenOff()


    The two screen events, as you may have guessed, are the reason for deriving from
    IScreenEventListener.


    There are no hard and fast rules for how you should code for these events. But
    clearly, for example, memory is low you should consider releasing memory you own;
    if the battery level becomes low, save power, and be prepared for sudden failure;
    if the screen is off, there is no point in updating the display, and so on.


    # 3.1.5 Terminating


    Your app may be terminated by the user; typically in bada, apps do not have an
    Exit softkey or menu option, but instead are ended when the user presses the Power/End
    key. Your app may also be terminated'
  merge: -1
