  md: 'In this code, our app launches, we:


    +   1. Create the default Form we will display, add it to the application Frame,
    and set it to be the current Form.

    2. Draw() and Show() the Frame; in two steps, this renders the Form (and any controls
    contains) to the logical display; and then updates the physical frame buffer (which
    updates the phone display, so that you can see it).


    The AppRegistry& appRegistry parameter is passed to the method to save you having
    to make a method call to get it. Typical uses of the registry at initialization
    time:


    +   * Look for kind of signature to tell us whether is the first time the app
    has run, if there are specific "first time" actions we want to perform, like inviting
    the user to register, or provide default data like a nickname, or just so that
    we can say Hello!

    * If we find a signature, restore saved preferences


    In both cases it''s a good idea to limit any code to simple, quick flag setting,
    to be acted later, so that the Form we loaded can be drawn and the screen updated,
    and we can get on and launch; which we do by setting the return value:


    ```

    return true;

    ```


    This is important; if the value is true, the framework will set our state to Running;
    otherwise, it will be set to Terminating.


    # 3.1.4 Running


    If OnInitializing() returned true, our app will enter the Running state. There
    is no lifecycle method associated with this transition – so how do we code for
    it?


    The answer is that we don''t need to manage the transition. Our default Form is
    being displayed; and our app is now the foreground application. User interaction
    will cause GUI event handling code to run, for example we coded OnActionPerformed()
    to respond to the soft keys, option menu key, and option menu selections.'
