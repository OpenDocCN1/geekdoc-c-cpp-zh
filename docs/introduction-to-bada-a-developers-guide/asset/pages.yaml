    only ever used Window classes like Frame.


    Since the Frame is at the root of your GUI hierarchy, getting hold of the Frame
    is the starting point for setting up the UI when an initialises. Within any Form
    method, getting the Frame is easy:


    ```

    Frame *pFrame = GetAppFrame()->GetFrame();

    ```


    Typically, a Form does not declare a Frame pointer; instead, it dynamically allocates
    the Frame pointer, *pFrame in the example above, when it is required.


    Note: While Frame is at the top of the logical hierarchy of all GUI elements in
    an application, and has displayable properties – for example, its background and
    transparency – Frame itself is only displayed if no Form exists; what the user
    sees the GUI elements that are contained by the application''s Forms, or in the
    case of a full-screen app which does not use Forms, the user sees directly rendered
    graphics.


