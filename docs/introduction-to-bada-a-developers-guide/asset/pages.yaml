    # 2.6 Becoming multilingual in 3 easy steps


    There is a serious limitation in the way we have implemented this GUI: we have
    hard-coded English language strings into the UI that we display - for example
    the soft-key text. One excellent feature of bada is its extensive language support.
    In fact, at the time of writing, the SDK (as version 1.0b3) includes the following
    languages: Basque, Bulgarian, Catalan, Chinese Simplified, Chinese Traditional
    (Hong Kong), Chinese Traditional (Taiwan),Croatian, Czech, Danish, English, Estonian,
    Finnish, French, German, Greek, Hungarian, Icelandic, Italian, Kazakh, Korean,
    Latvian, Lithuanian, Macedonian, Norwegian, Polish, Portuguese, Romanian, Russian,
    Serbian, Slovak, Slovenian, Spanish, Turkish, and Ukrainian. Arabic, Farsi, Hebrew,
    Malay, Thai, Urdu and Vietnamese are promised soon.


    As the list makes clear, bada is a truly multilingual platform, with a wide range
    of support for both Roman and non-Roman languages, making it possible for you
    to practise your application for a huge range of potential markets. Localisation
    means more ensuring that all the text you display in your application''s user
    interface matches the user''s language settings.


    Everything you display to the user should be in a format that they expect. Date
    and time information should appear in the right format for a particular country
    and language setting, with the appropriate separators and day and month names.
    Numbers should appear with the correct separators and the appropriate currency
    symbols should be used. For localised number formats, dates, times and currency
    is provided by the Locales namespace. (More detail in Chapter 6).


    The rest of this section will concentrate on how to make your application multilingual.
    It''s really important that all the text displayed in your user interface matches
    the user''s language settings. Supporting multiple languages and date, time formats
    really improves your application''s chances of worldwide success.'
