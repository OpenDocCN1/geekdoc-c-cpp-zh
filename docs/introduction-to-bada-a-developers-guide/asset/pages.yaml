    table, specifying the privilege groups required to use certain functionality within
    that namespace. You’ll notice some of the functionality requires privileges at
    the SYSTEM level which may not be available to all developers, mainly those functions
    which work together with the bada server. Check out the developer site at developer.bada.com
    for the latest information about how your application can obtain this privilege
    level. More information about obtaining privileges can be found in Chapter 2 and
    Chapter 4 covers the bada security model in detail, including privileges.


