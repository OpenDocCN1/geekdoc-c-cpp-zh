- img_proc: true
  md: "# Introduction to bada: A Developer's Guide - (draft preview, July 2010)\n\n\
    Most interesting, then, is the <Privileges> attribute, and its <Privilege> sub-attributes.\
    \ In the manifest file above, the single IMAGE privilege is specified:\n\n```\n\
    <Privileges>\n  <Privilege>\n    <Name>IMAGE</Name>\n  </Privilege>\n</Privileges>\n\
    ```\n\nThe format of the declaration here is straightforward XML; <Privileges>\
    \ is an attribute, and contains a list of <Privilege> sub-attributes, each of\
    \ which is declared using the <Name> sub-attribute, in this case <Name>IMAGE</Name>.^6\n\
    \nPrivileges declare which functionality app offers. If appropriate privileges\
    \ are not declared, an exception will be thrown at runtime when the app attempts\
    \ to use an undeclared, privileged API.\n\nMore interesting than how to declare\
    \ privileges is what they mean and what they do. Privileges are important for\
    \ the security mechanisms in bada to ensure privacy (for instance). You can find\
    \ more information about the privilege model in bada in Chapter 6.\n\nThe next\
    \ XML tag in the manifest file is the <DeviceProfile>. It declares the minimum\
    \ system requirements for the application. It is all automatically generated by\
    \ the portal for the information the developer provides.\n\nYou can update the\
    \ manifest in the same way that you generate it, using the portal tools.\n\nDeclaring\
    \ privileges is easy. Just remember that whenever you add APIs from a new namespace,\
    \ probably need to declare a new privilege (and update the libraries you are linking\
    \ when you build).\n\n> ^6 Instead of \"attributes\" you can call these \"properties\"\
    \ if you prefer."
