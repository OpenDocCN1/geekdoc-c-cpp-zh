  md: 'Maintenance covers support, bug fixing, and feedback integration. This step
    – depending on the significance of the reported issue and the policy of the application
    provider – can lead to an additional iteration with the preparing-for-deployment
    step. Also the level of maintenance and the commitment to it depends on the provider
    and can range from 24/7 service to no support at all.


    The mobile software engineering process ends with the end event (milestone: Project
    End) which was defined by the stakeholders and the project manager.'
