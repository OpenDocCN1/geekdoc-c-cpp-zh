    This chapter starts with an overview of the bada platform – its origins and its
    architecture – and moves to look at its programming idioms and conventions, the
    bada class library and its platform-specific types. It concludes with some practical
    quick tutorials that run through the most important of bada''s C++ programming
    idioms.


