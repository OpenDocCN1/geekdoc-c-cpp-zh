  raw: 'Unlike the **=** assign operator, the **==** equality operator compares operands
    and is described [here](#chapter02.xhtml_sec12).


    **Comparing values**


    ![image](images/pg30_1.jpg)


    The operators that are commonly used in C++ programming to compare two numerical
    values are listed in the table below:


    | **Operator:** | **Comparative test:** |


    | **==** | Equality |


    | **!=** | Inequality |


    | **>** | Greater than |


    | **<** | Less than |


    | **>=** | Greater than or equal to |


    | **<=** | Less than or equal to |


    The **==** equality operator compares two operands and will return **true** (1)
    if both are equal in value, otherwise it will return a **false** (0) value. If
    both are the same number, they are equal, or if both are characters, their ASCII
    code values are compared numerically. Conversely, the **!=** inequality operator
    returns **true** (1) if two operands are not equal, using the same rules as the
    **==** equality operator, otherwise it returns **false** (0). Equality and inequality
    operators are useful in testing the state of two variables to perform conditional
    branching in a program.


    ![image](images/hot.jpg)


    A-Z uppercase characters have ASCII code values 65-90, and a-z lowercase characters
    have ASCII code values 97-122.


    The **>** “greater than” operator compares two operands and will return **true**
    (1) if the first is greater in value than the second, or it will return **false**
    (0) if it is equal or less in value. The **<** “less than” operator makes the
    same comparison but returns **true** (1) if the first operand is less in value
    than the second, otherwise it returns **false** (0). A **>** “greater than” or
    **<** “less than” operator is often used to test the value of an iteration counter
    in a loop.


    Adding the **=** operator after a **>** “greater than” or **<** “less than” operator
    makes it also return **true** (1) if the two operands are exactly equal in value.


    Each comparison operation is demonstrated in the program [here](#chapter02.xhtml_gra).


    ![image](images/1r.jpg)Start a new program by specifying the C++ library classes
    to include and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonr.jpg)


    comparison.cpp


    ![image](images/2r.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3r.jpg)In the main function, insert statements to declare and
    initialize variables that can convert to Booleans


    **int nil = 0, num = 0, max = 1 ; char cap = ‘A’, low = ‘a’ ;**


    ![image](images/4r.jpg)Next, insert statements to output equality comparisons
    of integers and characters


    **cout << “Equality comparisons: ” ;**


    **cout << “(0 == 0) ” << ( nil == num ) << “(true)” ;**


    **cout << “(A == a) ” << ( cap == low ) << “(false)” ;**


    ![image](images/5r.jpg)Now, insert statements to output all other comparisons


    **cout << endl << “Inequality comparison: ” ;**


    **cout << “(0 != 1) ” << ( nil != max ) << “(true)” ;**


    **cout << endl << “Greater comparison: ” ;**


    **cout << “(0 > 1) ” << ( nil > max ) << “(false)” ;**


    **cout << endl << “Lesser comparison: ” ;**


    **cout << “(0 < 1) ” << ( nil < max ) << “(true)” ;**


    **cout << endl << “Greater or equal comparison: ” ;**


    **cout << “(0 >= 0) ”<< ( nil >= num ) << “(true)” ;**


    **cout << endl << “Lesser or equal comparison: ” ;**


    **cout << “(1 <= 0) ” << ( max <= num ) << “(false)” ;**


    ![image](images/6r.jpg)Save, compile, and run the program to see the output


    ![image](images/pg31_1.jpg)


    ![image](images/forget.jpg)


    The ASCII code value for uppercase “A” is 65, but for lowercase “a” it’s 97 –
    so their comparison here returns **false** (0).


    **Assessing logic**


    ![image](images/pg32_1.jpg)


    The logical operators most commonly used in C++ programming are listed in the
    table below:


    | **Operator:** | **Operation:** |


    | **&&** | Logical AND |


    | **&#124;&#124;** | Logical OR |


    | **!** | Logical NOT |


    The logical operators are used with operands that have Boolean values of **true**
    or **false**, or are values that convert to **true** or **false**.


    The logical **&&** AND operator will evaluate two operands and return **true**
    only if both operands themselves are **true**. Otherwise, the **&&** operator
    will return **false**. This is used in conditional branching where the direction
    of a program is determined by testing two conditions – if both conditions are
    satisfied, the program will go in a certain direction, otherwise it will take
    a different direction.


    ![image](images/snake.jpg)


    Where there is more than one operand, each expression must be enclosed by parentheses.


    Unlike the **&&** AND operator that needs both operands to be **true**, the **||**
    OR operator will evaluate its two operands and return **true** if either one of
    the operands itself returns **true**. If neither operand returns **true** then
    the **||** OR operator will return **false**. This is useful in C++ programming
    to perform a certain action if either one of two test conditions has been met.


    The third logical **!** NOT operator is a unary operator that is used before a
    single operand. It returns the inverse value of the given operand, so if the variable
    **a** had a value of **true**, then **!a** would have a value of **false**. The
    **!** NOT operator is useful in C++ programs to toggle the value of a variable
    in successive loop iterations with a statement like **a = !a**. This ensures that
    on each pass the value is changed, like flicking a light switch on and off.


    ![image](images/pg32_2.jpg)


    The term “Boolean” refers to a system of logical thought developed by the English
    mathematician George Boole (1815-1864).


    In C++ programs, a 0 represents the Boolean **false** value and any non-zero value,
    such as 1, represents the Boolean **true** value.


    Each logical operation is demonstrated in the program [here](#chapter02.xhtml_peci).


    ![image](images/1r.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonr.jpg)


    logic.cpp


    ![image](images/2r.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3r.jpg)In the main function, declare and initialize two integer
    variables – with values that can represent Boolean values


    **int a = 1 , b = 0 ;**


    ![image](images/4r.jpg)Insert statements to output the result of AND evaluations


    **cout << “AND logic:” << endl ;**


    **cout << “(a && a) ” << ( a && a ) << “(true) ” ;**


    **cout << “(a && b) ” << ( a && b ) << “(false) ” ;**


    **cout << “(b && b) ” << ( b && b ) << “(false)” << endl ;**


    ![image](images/5r.jpg)Insert statements to output the result of OR evaluations


    **cout << endl << “OR logic:” << endl ;**


    **cout << “(a || a) ” << ( a || a ) << “(true) ” ;**


    **cout << “(a || b) ” << ( a || b ) << “(true) ” ;**


    **cout << “(b || b) ” << ( b || b ) << “(false)” << endl ;**


    ![image](images/6r.jpg)Insert statements to output the result of NOT evaluations


    **cout << endl << “NOT logic:” << endl ;**


    **cout << “a = “ << a << “ !a = “ << !a << “ “ ;**


    **cout << “b = “ << b << “ !b = “ << !b << endl ;**


    ![image](images/7r.jpg)Save, compile and run the program to see the output


    ![image](images/pg33_1.jpg)


    ![image](images/forget.jpg)


    Notice that **0 && 0** returns **0**, not **1** – demonstrating the maxim “two
    wrongs don’t make a right”.


    **Examining conditions**


    Possibly the C++ programmer’s most favorite test operator is the **?:** “ternary”
    operator. This operator first evaluates an expression for a **true** or **false**
    condition, then returns one of two specified values depending on the result of
    the evaluation. For this reason it is also known as the “conditional” operator.


    ![image](images/pg34_1.jpg)


