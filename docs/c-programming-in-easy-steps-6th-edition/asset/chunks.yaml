    \ ” << num << endl ;\n```\n\n![image](images/7r.jpg)Save, compile and run the\
    \ program to see the output\n\n![image](images/pg39_1.jpg)\n\n![image](images/snake.jpg)\n\
    \nDo not rely upon default precedence as it may vary between compilers – always\
    \ use parentheses to clarify expressions.\n\n### Casting data types\n\n![image](images/pg40_1.jpg)\n\
    \nAny data stored in a variable can be forced (coerced) into a variable of a different\
    \ data type by a process known as “casting”. The cast statement simply states\
    \ the data type to which the value should be cast in parentheses preceding the\
    \ name of the variable containing the data to be cast. So casting syntax looks\
    \ like this:\n\n`variable-name = ( data-type ) variable-name ;`\n\nThis is the\
    \ traditional form of casting that is also found in the C programming language.\
    \ A newer alternative available in C++ uses angled brackets with the `static_cast`\
    \ keyword, like this:\n\n`variable-name = static_cast < data-type > variable-name\
    \ ;`\n\nThe newer version allows casts to be more easily identified in source\
    \ code by avoiding the use of parentheses, which can easily be confused with parentheses\
    \ in expressions. The newer form of casting is preferred, but the older form is\
    \ still widely found.\n\nCasting is often necessary to accurately store the result\
