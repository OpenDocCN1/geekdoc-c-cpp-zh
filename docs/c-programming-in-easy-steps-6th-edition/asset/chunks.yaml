    \n当参数名称与成员名称相同时，使用 `this ->` 指针来显式标识类成员。\n\n![image](img/6v.jpg)在 `main` 方法中，插入一条在不传递任何参数的情况下创建一个\
    \ `Dog` 对象——调用默认构造函数。\n\n```cpp\nDog rex ;\n```\n\n![image](img/7v.jpg)添加调用每个\
