    If you accidentally start running an infinite loop, press the `Ctrl + C` keys
    to terminate the process.


    A `break` statement can be included in any kind of loop to immediately terminate
    the loop when a test condition is met. The `break` statement ensures no further
    iterations of that loop will be executed.


    Similarly, a `continue` statement can be included in any kind of loop to skip
    to the next iteration.


