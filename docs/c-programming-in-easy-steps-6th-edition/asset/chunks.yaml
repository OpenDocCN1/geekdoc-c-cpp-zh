  trans: "\n\n循环结构在第 3 章中引入，通常用于遍历数组元素。\n\n## 使用向量数组\n\n向量（vector）是普通数组的替代方案，它的优点是大小可以根据程序需要进行更改。与普通数组一样，可以为任何数据类型创建向量，并且它们的元素也从\
    \ 0 开始编号。\n\n![image](img/pg20_1.jpg)\n\n为了在程序中使用向量，必须在程序开头使用 `#include <vector>`\
    \ 预处理指令添加 C++ `vector` 库。该库包含了下表中的预定义函数，用于操作向量：\n\n| **函数:** | **描述:** |\n| :---\
    \ | :--- |\n| `at(number)` | 获取指定元素编号包含的值 |\n| `back()` | 获取最后一个元素的值 |\n| `clear()`\
    \ | 移除所有向量元素 |\n| `empty()` | 如果向量为空则返回 true (1)，否则返回 false (0) |\n| `front()`\
    \ | 获取第一个元素的值 |\n| `pop_back()` | 移除最后一个元素 |\n| `push_back(value)` | 在向量末尾添加一个包含指定值的最终元素\
    \ |\n| `size()` | 获取元素数量 |\n\n创建向量的声明如下：\n\n`vector < data-type > vector-name\
    \ ( size ) ;`\n\n一个 `int` 向量默认情况下，每个元素都会自动初始化为零值。可选情况下，可以在声明中的大小之后指定一个不同的初始值，语法如下：\n\
    \n`vector < data-type > vector-name ( size , initial-value ) ;`\n\n操作向量的函数只需通过点操作符（dot\
    \ operator）附加到所选的向量名称即可。例如，要获取名为“vec”的向量的大小，可以使用 `vec.size()`。\n\n![image](img/forget.jpg)\n\
    \n单个向量元素可以像普通数组一样使用方括号引用，例如 `vec[3]`。\n\n![image](img/1b.jpg) 通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\
    \n```cpp\n#include <vector>  // 向量支持。\n#include <iostream>\nusing namespace std\
    \ ;\n```\n\n![image](img/commonb.jpg)\n\nvector.cpp\n\n![image](img/2b.jpg) 添加一个包含最终返回语句的\
    \ main 函数\n\n```cpp\nint main()\n{\n    // 程序代码在此处。\n    return 0 ;\n}\n```\n\n\
    ![image](img/3b.jpg) 在 main 函数中，插入语句来声明并初始化一个包含三个值为 100 的元素的向量数组\n\n`vector <int>\
    \ vec( 3, 100 ) ;`\n\n![image](img/4b.jpg) 现在，插入语句来操作向量元素\n\n```cpp\ncout << “Vector\
    \ size: ” << vec.size() << endl ;\ncout << “Is empty?: ” << vec.empty() << endl;\n\
    cout << “First element: ” << vec.at(0) << endl;\nvec.pop_back() ;  // 移除最后一个元素。\n\
    cout << “Vector size: ” << vec.size() << endl;\ncout << “Final element: ” << vec.back()\
    \ << endl;\nvec.clear() ;  // 移除所有元素。\ncout << “Vector size: ” << vec.size() <<\
    \ endl;\nvec.push_back( 200 ) ;  // 添加一个元素。\ncout << “Vector size: ” << vec.size()\
    \ << endl;\ncout << “First element: ” << vec.front() << endl;\n```\n\n![image](img/5b.jpg)\
    \ 保存、编译并运行程序以查看输出\n\n![image](img/pg21_1.jpg)\n\n![image](img/hot.jpg)\n\n示例此处展示了如何使用循环为向量填充数据，使每个元素具有不同的初始值。\n\
    \n## 声明常量\n\n在程序执行期间不会更改的数据应该存储在常量容器中，而不是变量中。这使得编译器能够更好地检查代码中的错误——如果程序尝试更改存储在常量的值，编译器将报告错误导致编译失败。\n\
    \n![image](img/pg22_1.jpg)\n\n通过在变量声明前加上 `const` 关键字并后跟一个空格，可以为任何数据类型创建常量。通常，常量名使用大写字母，以将它们区别于（小写的）变量名。与变量不同，常量必须在声明时初始化。例如，数学值\
    \ pi 的常量的声明如下：\n\n`const double PI = 3.1415926536 ;`\n\n`enum` 关键字提供了一种简洁创建整数常量序列的方便方法。可选情况下，声明可以在\
    \ `enum` 关键字之后包含该序列的名称。常量名在花括号内以逗号分隔的列表形式出现。例如，此声明创建了一个常量序列：\n\n`enum suit { CLUBS\
    \ , DIAMONDS , HEARTS , SPADES } ;`\n\n默认情况下，每个常量的值都比列表中前一个常量大一。除非指定，否则第一个常量将有一个值。有时使用\
    \ `typedef` 关键字来定义枚举常量列表是方便的。`typedef` 关键字简单地为结构体创建一个别名。\n\n```cpp\ntypedef enum\
    \ { NEGATIVE , POSITIVE } charge;\n```\n\n然后可以像往一样创建自定义类型的变量。例如，对于上面的示例，将 `POSITIVE`\
    \ 常量赋值给 `charge` 变量实际上赋值了 1。\n\n![image](img/1b.jpg) 通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\
    \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonb.jpg)\n\
