  trans: "\n\n![image](img/6b.jpg)在 `Laser` 类中，定义在该类派生类中声明的纯虚方法\n\n```cpp\nvoid Model()\
    \ { cout << “Laser Classic” << endl ; }\nvoid Boom() { cout << “Boom: 14ft” <<\
    \ endl ; }\n```\n\n![image](img/7b.jpg)声明一个 `main` 方法，包含一个最终的 `return` 语句，并在层次结构的底层创建一个派生类的实例\n\
    \n```cpp\nint main()\n{\n    Laser* pLaser = new Laser ;\n    // Add more statements\
    \ here.\n    return 0 ;\n}\n```\n\n![image](img/8b.jpg)在 `main` 方法中，插入对每个定义方法的调用\n\
    \n```cpp\npLaser -> Model() ;\ncout << “Length: “ << pLaser -> getLength() <<\
    \ “ft” << endl ;\ncout << “Height: “ << pLaser -> getMast() << “ft” << endl ;\n\
    pLaser -> Boom() ;\n```\n\n![image](img/9b.jpg)保存、编译并运行程序以查看输出\n\n![image](img/pg145_2.jpg)\n\
    \n![image](img/hot.jpg)\n\n尝试添加一个派自 `Boat` 类的 `Powerboat` 类（包含引擎信息），以及一个派自 `Powerboat`\
    \ 类的 `Cruiser` 类 —— 用于为变量赋值并定义虚方法。\n\n#### 隔离类结构\n\n书中每个示例程序的源代码通常包含在单个 `.cpp`\
    \ 文件中以节省空间，但实际上，OOP 程序通常包含在三个单独文件中：\n\n*   头文件 `.h` – 仅包含类声明。\n*   实现文件 `.cpp`\
    \ – 包含类定义，用于实现头文件中声明的方法，该文件通过 `#include` 指令引用。\n*   客户端 `.cpp` 文件 – 包含一个 `main`\
    \ 方法，该方法使用头文件中声明的类成员，该文件同样通过 `#include` 指令引用。\n\n![image](img/pg146_1.jpg)\n\n\
    例如，一个加法器程序可能由三个文件组成：`ops.h`（声明操作类的头文件）、`ops.cpp`（定义操作方法的实现文件）和 `sum.cpp`（调用各种操作的客户端文件）。\n\
    \n![image](img/hot.jpg)\n\n客户端文件有时被称为“驱动”（driver）文件。\n\n编译 `sum.cpp` 时，编译器会将包含的头文件和实现文件合并到程序中。它首先将头文件和实现文件转换为二进制对象文件（`ops.o`），然后将头文件和客户端文件转换为第二个二进制对象文件（`sum.o`）。最后，链接器将两个对象文件合并成单个可执行文件（`sum.exe`）。\n\
    \n![image](img/pg146_2.jpg)\n\n![image](img/hot.jpg)\n\n使用 `#include` 指令引用头文件与使用\
    \ `#include` 指令引用标准 C++ 库的方式类似。\n\n在独立的“模块化”文件中隔离类结构具有提高可移植性的优势，并且通过明确识别每个文件的目的使代码维护更加容易。\n\
    \n要让编译器将三个源文件合并成单个可执行文件，只需要在编译器命令中显式指定 `.cpp` 文件 —— `#include` 指令确保头文件也会被识别。\n\
    \n例如，在 `ops.cpp` 和 `sum.cpp` 中都使用 `#include “ops.h”` 语句，编译侧描述的示例的命令不需要在编译器命令中指定\
    \ `ops.h` 头文件，只需要 `c++ ops.cpp sum.cpp -o sum.exe`。\n\n![image](img/pg147_1.jpg)\n\
    \n### 计算器\n\n此示例将允许用户输入一个简单的算术表达式并输出计算结果。它将在首次启动时提供说明，并允许用户输入后续表达式 —— 或通过字符 0\
    \ 退出。\n\n![image](img/1b.jpg)通过声明名为“Calculator”的类开始编写头文件\n\n```cpp\nclass Calculator\n\
    {\n} ;\n```\n\n![image](img/pg147_2.jpg)\n\n#### ops.h\n\n![image](img/2b.jpg)在类声明中插入公共方法声明\n\
    \n```cpp\npublic :\n    Calculator() ;\n    void launch() ;\n    void readInput()\
    \ ;\n    void writeOutput() ;\n    bool run() ;\n```\n\n#### ops.cpp\n\n![image](img/3b.jpg)在类声明中插入私有声明\n\
    \n```cpp\nprivate :\n    double num1 ;\n    double num2 ;\n    char oper ;\n \
    \   bool status ;\n```\n\n#### 类的应用\n\n![image](img/4b.jpg)使用 `#include` 开始头文件\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n#### 隔离的方法\n\n![image](img/5b.jpg)用定义开始实现文件\n\
    \n```cpp\nCalculator::Calculator()\n{\n    status = true ;\n}\n\nvoid Calculator::launch()\n\
    {\n    cout << “CALCULATOR” << endl ;\n    cout << “Enter a number, an operator\
    \ (+,-*,/), and another number.” << endl ;\n    cout << “Hit zero to exit.” <<\
    \ endl ;\n}\n\nvoid Calculator::readInput()\n{\n    cout << “> “ ; cin >> num1\
    \ ;\n    if ( num1 == 0 ) \n        status = false ;\n    else\n        cin >>\
    \ oper >> cin >> num2 ;\n}\n\nvoid Calculator::writeOutput()\n{\n    if ( status\
    \ ) \n        switch( oper )\n        {\n            case ‘+’ : { cout << ( num1\
    \ + num2 ) << endl ; break; }\n            case ‘-’ : { cout << ( num1 - num2\
    \ ) << endl ; break; }\n            case ‘*’ : { cout << ( num1 * num2 ) << endl\
    \ ; break; }\n            case ‘/’ : \n                if ( num2 != 0 ) \n   \
    \                 cout << ( num1 / num2 ) << endl ;\n                else \n \
    \                   cout << “Cannot divide by 0” << endl ;\n                break;\n\
    \        }\n}\n\nbool Calculator::run()\n{\n    return status ;\n}\n```\n\n####\
    \ sum.cpp\n\n![image](img/6b.jpg)使用包含指令开始编写客户端文件\n\n```cpp\n#include “ops.h”\n\
    \nint main()\n{\n    Calculator* pCalc = new Calculator ;\n    pCalc -> launch()\
    \ ;\n    while ( pCalc -> run() )\n    {\n        pCalc -> readInput() ;\n   \
    \     pCalc -> writeOutput() ;\n    }\n    return 0 ;\n}\n```\n\n"
- fmt: "\nThis program loops until the user types a 0 and hits Return – changing the\
    \ “status” control variable to `false`, and so exiting the program.\n\n## Summary\n\
    \n![image](images/pg150_1.jpg)\n\n* The three cornerstones of Object Oriented\
    \ Programming are encapsulation, inheritance, and polymorphism.\n* Polymorphic\
    \ entities have a different meaning, or purpose, according to their context.\n\
    * A base class pointer can be used to call inherited methods in the derived class\
    \ to which it is bound.\n* A base class pointer can also be used to explicitly\
    \ call base class methods using the `::` scope resolution operator.\n* Virtual\
    \ base class methods are intended to be overridden in derived classes.\n* Polymorphism\
    \ allows calls to methods of the same name to be directed to the appropriate overriding\
    \ method.\n* Capability classes generally contain no data, but merely declare\
    \ virtual methods that can be overridden in derived classes.\n* Virtual methods\
    \ that return a `-1` value signal an error to indicate they should not be called\
    \ directly.\n* An Abstract Data Type represents a concept, and is always the base\
    \ to other classes.\n* Declaration of a pure virtual method, with the assignation\
    \ `=0`, indicates that class is an ADT.\n* Classes can be derived from an ADT\
    \ – but you cannot create an instance of an ADT.\n* An ADT can be derived from\
    \ another ADT to create a complex hierarchy of classes.\n* Programs can be separated\
    \ into header, implementation, and client files to aid portability and to ease\
    \ code maintenance.\n* Header files that are referenced by `#include` directives\
    \ will be automatically included by the compiler during compilation.\n\n9\n\n\
    ## Processing macros\n\n***This chapter demonstrates how the C++ compiler can\
    \ be made to perform useful tasks before compiling a program.***\n\n[Exploring\
    \ compilation](#chapter09.xhtml_sec73)\n* [Defining substitutes](#chapter09.xhtml_sec74)\n\
    * [Defining conditions](#chapter09.xhtml_sec75)\n* [Providing alternatives](#chapter09.xhtml_sec76)\n\
    * [Guarding inclusions](#chapter09.xhtml_sec77)\n* [Using macro functions](#chapter09.xhtml_sec78)\n\
    * [Building strings](#chapter09.xhtml_sec79)\n* [Debugging assertions](#chapter09.xhtml_sec80)\n\
    * [Summary](#chapter09.xhtml_sec81)\n\n## Exploring compilation\n\nWhenever the\
    \ C++ compiler runs, it first calls upon its preprocessor to seek any compiler\
    \ directives that may be included in the source code. Each of these begin with\
    \ the `#` hash character and will be implemented first to effectively modify the\
    \ source code before it is assembled and compiled.\n\n![image](images/pg152_1.jpg)\n\
    \nThe changes made by compiler directives to the preprocessor create new temporary\
    \ files that are not normally seen. It is these temporary files that are used\
    \ to create a binary object file:\n\n* The first temporary file created during\
    \ compilation expands the original source code by replacing its compiler directives\
    \ with library code that implements those directives. This text file is named\
    \ like the source file, but with a `.ii` file extension.\n* The second temporary\
    \ file created during compilation is a translation of the temporary expanded `.ii`\
    \ file into low-level Assembly language instructions. This text file is named\
    \ like the source file, but with a `.s` file extension.\n* The third temporary\
    \ file created during compilation is a translation of the temporary Assembly language\
    \ `.s` file into machine code. This binary object file is named like the source\
    \ file, but with a `.o` file extension.\n\nSo, the compilation process employs\
    \ the Preprocessor to compile source code, an “Assembler” to translate this into\
    \ machine code, and a Linker to convert one or more binary objects into an executable\
    \ program.\n\nYou can see the temporary files by instructing the compiler to save\
    \ them using the `-save-temps` compiler option. Both temporary text files can\
    \ then be examined by opening them in a plain text editor.\n\nMost significantly,\
    \ you can see that the temporary file with the `.ii` file extension contains the\
    \ complete function definitions from any included library. For example, it replaces\
    \ an `#include <iostream>` directive with definitions for the `cin`, `cout`, `cerr`\
    \ functions, and the `clog` function that can be used to redirect error messages\
    \ to a file. The end of the `.ii` file shows the defined functions to be part\
    \ of the “std” namespace – so they can appear without the `std::` prefix.\n\n\
    ![image](images/1r.jpg)Create a simple program named “prog.cpp” that will output\
    \ a message when it gets executed\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std ;\n\nint main()\n{\n    cout << “This is a simple test program” << endl\
    \ ;\n    return 0 ;\n}\n```\n\n![image](images/commonr.jpg)\n\nprog.cpp\n\n![image](images/2r.jpg)Issue\
    \ a command using the `-save-temps` option, to save temporary files, and a `-c`\
    \ option to compile this program’s source files into an object file – with no\
    \ executable file `c++ prog.cpp -save-temps -c`\n\n![image](images/3r.jpg)Open\
    \ the `.ii` file in a plain text editor such as Notepad, then scroll to the end\
    \ of the file to see the modified source code – notice how the `<iostream>` library\
    \ functions are defined in the `std` namespace\n\n![image](images/pg153_1.jpg)\n\
    \n![image](images/4r.jpg)Open the `.s` file in a plain text editor to see the\
    \ low-level assembler instructions – notice how the message string is now terminated\
    \ by the special `\\0` character\n\n![image](images/5r.jpg)Issue a command using\
    \ the -save-temps option, to save temporary files `c++ prog -o prog`\n\n![image](images/pg153_2.jpg)\n\
    \n![image](images/forget.jpg)One or more object files can be used to create an\
    \ executable file – as described [here](#chapter08.xhtml_70).\n\n![image](images/hot.jpg)\n\
    \n## Defining substitutes\n\nJust as the preprocessor substitutes library code\
    \ for `#include` directives, other preprocessor directives can be used to substitute\
    \ text or numeric values before assembly and compilation.\n\n![image](images/pg154_1.jpg)\n\
    \nThe `#define` directive specifies a macro, comprising an identifier name and\
    \ a string or numeric value, to be substituted by the preprocessor for each occurrence\
    \ of that macro in the source code.\n\nLike `#include` preprocessor directives,\
    \ `#define` directives can appear at the start of the source code. As with constant\
    \ names, the macro name traditionally uses uppercase, and defined string values\
    \ should be enclosed within double quotes. For numeric substitutions in expressions,\
    \ the macro name should be enclosed in parentheses to ensure correct precedence.\n\
    \n![image](images/1r.jpg)Start a new program by declaring three define directives\n\
