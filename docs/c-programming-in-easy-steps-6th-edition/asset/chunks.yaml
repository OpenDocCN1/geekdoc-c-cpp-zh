    **Summary**


    ![image](images/pg150_1.jpg)


    •The three cornerstones of Object Oriented Programming are encapsulation, inheritance,
    and polymorphism.


    •Polymorphic entities have a different meaning, or purpose, according to their
    context.


    •A base class pointer can be used to call inherited methods in the derived class
    to which it is bound.


    •A base class pointer can also be used to explicitly call base class methods using
    the :: scope resolution operator.


    •Virtual base class methods are intended to be overridden in derived classes.


    •Polymorphism allows calls to methods of the same name to be directed to the appropriate
    overriding method.


    •Capability classes generally contain no data, but merely declare virtual methods
    that can be overridden in derived classes.


    •Virtual methods that return a **-1** value signal an error to indicate they should
    not be called directly.


    •An Abstract Data Type represents a concept, and is always the base to other classes.


    •Declaration of a pure virtual method, with the assignation **=0**, indicates
    that class is an ADT.


    •Classes can be derived from an ADT – but you cannot create an instance of an
    ADT.


    •An ADT can be derived from another ADT to create a complex hierarchy of classes.


    •Programs can be separated into header, implementation, and client files to aid
    portability and to ease code maintenance.


    •Header files that are referenced by **#include** directives will be automatically
    included by the compiler during compilation.


    9


    **Processing macros**


    ***This chapter demonstrates how the C++ compiler can be made to perform useful
    tasks before compiling a program.***


    [Exploring compilation](#chapter09.xhtml_sec73)


    [Defining substitutes](#chapter09.xhtml_sec74)


    [Defining conditions](#chapter09.xhtml_sec75)


    [Providing alternatives](#chapter09.xhtml_sec76)


    [Guarding inclusions](#chapter09.xhtml_sec77)


    [Using macro functions](#chapter09.xhtml_sec78)


    [Building strings](#chapter09.xhtml_sec79)


    [Debugging assertions](#chapter09.xhtml_sec80)


    [Summary](#chapter09.xhtml_sec81)


    **Exploring compilation**


    Whenever the C++ compiler runs, it first calls upon its preprocessor to seek any
    compiler directives that may be included in the source code. Each of these begin
    with the **#** hash character and will be implemented first to effectively modify
    the source code before it is assembled and compiled.


    ![image](images/pg152_1.jpg)


    The changes made by compiler directives to the preprocessor create new temporary
    files that are not normally seen. It is these temporary files that are used to
    create a binary object file:


    •The first temporary file created during compilation expands the original source
    code by replacing its compiler directives with library code that implements those
    directives. This text file is named like the source file, but with a **.ii** file
    extension.


    •The second temporary file created during compilation is a translation of the
    temporary expanded **.ii** file into low-level Assembly language instructions.
    This text file is named like the source file, but with a **.s** file extension.


    •The third temporary file created during compilation is a translation of the temporary
    Assembly language **.s** file into machine code. This binary object file is named
    like the source file, but with a **.o** file extension.


    So, the compilation process employs the Preprocessor to compile source code, an
    “Assembler” to translate this into machine code, and a Linker to convert one or
    more binary objects into an executable program.


    You can see the temporary files by instructing the compiler to save them using
    the **-save-temps** compiler option. Both temporary text files can then be examined
    by opening them in a plain text editor.


    Most significantly, you can see that the temporary file with the **.ii** file
    extension contains the complete function definitions from any included library.
    For example, it replaces an **#include <iostream>** directive with definitions
    for the **cin**, **cout, cerr** functions, and the **clog** function that can
    be used to redirect error messages to a file. The end of the **.ii** file shows
    the defined functions to be part of the “std” namespace – so they can appear without
    the **std::** prefix.


    ![image](images/1r.jpg)Create a simple program named “prog.cpp” that will output
    a message when it gets executed


    **#include <iostream>**


    **using namespace std ;**


    **int main()**


    **{**


    **cout << “This is a simple test program” << endl ;**


    **return 0 ;**


    **}**


    ![image](images/commonr.jpg)


    prog.cpp


    ![image](images/2r.jpg)Issue a command using the **-save-temps** option, to save
    temporary files, and a **-c** option to compile this program’s source files into
    an object file – with no executable file **c++ prog.cpp -save-temps -c**


    ![image](images/3r.jpg)Open the **.ii** file in a plain text editor such as Notepad,
    then scroll to the end of the file to see the modified source code – notice how
    the **<iostream>** library functions are defined in the **std** namespace


    ![image](images/pg153_1.jpg)


    ![image](images/4r.jpg)Open the **.s** file in a plain text editor to see the
    low-level assembler instructions – notice how the message string is now terminated
    by the special **\0** character


    ![image](images/5r.jpg)Issue a command to output an executable file from the **.o**
    object file, then run the program to see the message **c++ prog.o -o prog.exe**


    ![image](images/pg153_2.jpg)


    ![image](images/forget.jpg)


    One or more object files can be used to create an executable file – as described
    [here](#chapter08.xhtml_sec70).


    ![image](images/hot.jpg)


    You can combine these steps, creating an executable file and saving temporary
    files, by issuing the command **c++ prog.cpp** **-save-temps -o prog.exe**.


    **Defining substitutes**


    Just as the preprocessor substitutes library code for **#include** directives,
    other preprocessor directives can be used to substitute text or numeric values
    before assembly and compilation.


    ![image](images/pg154_1.jpg)


    The **#define** directive specifies a macro, comprising an identifier name and
    a string or numeric value, to be substituted by the preprocessor for each occurrence
    of that macro in the source code.


    Like **#include** preprocessor directives, **#define** directives can appear at
    the start of the source code. As with constant variable names, the macro name
    traditionally uses uppercase, and defined string values should be enclosed within
    double quotes. For numeric substitutions in expressions, the macro name should
    be enclosed in parentheses to ensure correct precedence.


    ![image](images/1r.jpg)Start a new program by declaring three **define** directives


    **#define BOOK “C++ Programming in easy steps”**


    **#define NUM 200**


    **#define RULE “*******************************”**


    ![image](images/commonr.jpg)


    define.cpp


    ![image](images/2r.jpg)Specify the library classes to include, and the namespace


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/3r.jpg)Add a main function containing a final **return** statement
    and three statements to output substituted values


    **int main()**


    **{**


    **cout << RULE << endl << BOOK << endl << RULE ;**


    **cout << endl << “NUM is: ” << NUM << endl ;**


    **cout << “Double NUM: ” << ( ( NUM ) * 2 ) << endl ;**


    **return 0 ;**


    **}**


    ![image](images/4r.jpg)Save, compile, and run the program to see the output


    ![image](images/pg154_2.jpg)


    ![image](images/snake.jpg)


    Numeric constants are often best declared as **const** variables – because values
    substituted by the preprocessor are not subject to type-checking.


    ![image](images/5r.jpg)Recompile the program, saving the temporary files **c++
    define.cpp -save-temps -o define.exe**


    ![image](images/6r.jpg)Open the temporary “define.ii” file in a plain text editor
    and scroll to the end of the file to see the substitutions'
