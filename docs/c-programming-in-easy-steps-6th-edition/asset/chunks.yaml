  trans: "\n\n- `&` 引用操作符可以引用指针内部存储的内存地址。\n- 引用比指针更易使用，但与指针不同，引用必须在声明时始终初始化，且不能被赋值不同的变量。\n\
    \n# 7\n\n# 创建类和对象\n\n本章介绍了封装和继承两个主题——这是 C++ 面向对象编程的前两个原则。\n\n- 数据封装\n- 创建对象\n\
    - 创建多个对象\n- 初始化类成员\n- 重载方法\n- 继承类属性\n- 调用基构造函数\n- 重写基方法\n- 总结\n\n## 数据封装\n\n类是一种可以在单个实体中同时包含变量和函数的数据结构。这些统称为其“成员”，而函数被称为其“方法”。\n\
    \n从类外部访问类成员受类声明中“访问修饰符”的控制。通常，这些饰符会拒绝对变量成员的访问，但允许访问可以存储和检索这些变量成员数据的方法。这种“数据隐藏”技术确保了存储的数据被安全地封装在类变量成员内部，它是面向对象编程（OOP）的第一大原则。\n\
    \n![image](img/pg116_1.jpg)\n\n类声明以 `class` 关键字开始，后面跟着空格，然后是程序员指定的名称——遵循通常的 C++\
    \ 命名规范，但大写字母开头。接下来是访问修饰符和类成员，它们包含在一对括号内。每个类声明必须在右大括号后以分号结束——因此类声明语法如下：\n\n```cpp\n\
    class ClassName\n{\n    access specifier :\n        member1 ;\n        member2\
    \ ;\n    access specifier :\n        member3 ;\n        member4 ;\n};\n```\n\n\
    访问修饰符可以是 `public`、`private` 或 `protected` 关键字中的任意一个，用于指定其列出成员的访问权限：\n\n- 公有成员（Public）可以在类可见的任何地方访问。\n\
    - 私有成员（Private）仅供同类的其他成员访问。\n- 保护成员（Protected）仅供同类的其他成员以及该类派生类的成员访问。\n\n默认情况下，所有类成员都有私有访问权限——因此，任何出现在类声明中没有访问修饰符的成员都具有私有权限。\n\
    \n![image](img/forget.jpg)\n\n使用 `protected` 访问修饰符的派生类将在本章稍后介绍。\n\n任何现实世界的对象都可以通过属性和动作来定义。例如，狗有年龄、重量和颜色等属性，以及它可以执行的吠等动作。C++\
    \ 中的类机制提供了一种在程序中创建虚拟狗对象的方法，其中类的变量成员可以代表其属性，方法则代表其动作：\n\n```cpp\nclass Dog\n{\n\
    \    private: // 默认访问级别。\n        int age, weight ;\n        string color;\n \
    \   public :\n        void bark() ;\n        // ... 其他用于存储/检索数据的方法。\n};\n```\n\
    \n![image](img/forget.jpg)\n\n虽然程序类无法完美模拟真实世界对象，但目标是封装所有相关的属性和动作。\n\n重要的是，类声明只定义了一个数据结构——为了创建对象，你必须声明该数据结构的一个“实例”。这与声明普通\
    \ C++ 数据类型的实例的方式完全相同：\n\n| `int num ;` | `// 创建一个名为“num”的实例。// 属于普通的 C++ int 数据类型。`\
    \ |\n| `Dog fido ;` | `// 创建一个名为“fido”的实例。// 属于程序员定义的 Dog 数据结构。` |\n\n或者，可以通过在类声明右大括号和最终分号之间指定其名称来创建实例对象。可以通过指定用逗号分隔的对象名称列表来创建多个实例。例如，下面列出的类声明创建了四个名为“fido”、“pooch”、“rex”和“sammy”的\
    \ Dog 类实例对象。\n\n```cpp\nclass Dog\n{\n    int age, weight ;\n    string color;\n\
    \    public:\n        void bark() ;\n        // ... 其他用于存储/检索数据的方法。\n} fido, pooch,\
    \ rex, sammy ;\n```\n\nC++ 编程中的封装原则描述了数据和功能在类成员中的组合——即 Dog 类中的年龄、重量、颜色属性和 bark\
    \ 动作。\n\n![image](img/hot.jpg)\n\n类名通常以大写字母开头，对象名以小字母开头。\n\n## 创建对象\n\n为了从类的私有成员中分配和检索数据，必须向类中添加特殊的公有访问方法。这些是“设置器”（setter）方法，用于分配数据，以及“访问器”（getter）方法，用于检索数据。访问方法通常以它们处理的变量命名，首字母大写，并分别以“set”或“get”为缀。例如，处理\
    \ `age` 变量的访问方法可以命名为 `setAge()` 和 `getAge()`。\n\n![image](img/pg116.jpg)\n\n"
