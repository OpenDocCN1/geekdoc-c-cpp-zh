    \ C 风格强制转换以及使用 `static_cast` 关键字的新更新形式强制转换。\n\n# 3 语句\n\n*本章将演示 C++ 条件语句，这些语句允许程序向不同的方向进行分支，并引入了\
    \ C++ 函数结构。*\n\n- 使用 if 进行分支\n- 使用 switch 分支\n- 使用 for 循环\n- 使用 while 循环\n- 声明函数\n\
    - 传递参数\n- 函数重载\n- 函数优化\n- 总结\n\n## 使用 if 进行分支\n\nC++ 的 `if` 关键字执行基础条件测试，评估给定表达式的布尔值为\
    \ `true` 或 `false` —— 其语法看起来如下：\n\n```cpp\nif ( test-expression ) { statements-to-execute-when-true\
    \ }\n```\n\n![image](img/pg44_1.jpg)\n\n测试语句后面的大括号可以包含一个或多个语句，每条语句都以分号结束，但这些语句仅在表达式被判定为\
    \ `true` 时才会执行。当测试结果为 `false` 时，程序将继续执行下一个任务。\n\n可选地，`if` 语句可以在 `if` 语句块之后附加 `else`\
    \ 语句块，在测试失败时提供备用执行语句，如下：\n\n```cpp\nif ( test-expression ) { statements-to-execute-when-true\
    \ }\nelse { statements-to-execute-when-false }\n```\n\n![image](img/hot.jpg)\n\
    \n当测试成功时只有一条语句需要执行，可以省略大括号 —— 但保留它们有助于代码的可读性。\n\n为了测试两个条件，测试表达式可以使用 `&&` 运算符 ——\
    \ 例如，`if ( ( num > 5 ) && ( letter == ‘A’ ) )`。或者，可以将一个 `if` 语句“嵌套”另一个 `if` 语句中，这样内部语句块中的语句只有在两个测试都成功才会执行\
    \ —— 但如果外部测试成功，外部语句块中的语句将被执行。\n\n![image](img/1g.jpg)通过指定要包含的 C++ 库类和使用的命名空间前缀开始一个新程序\n\
    \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commong.jpg)\n\
    \nifelse.cpp\n\n![image](img/2g.jpg)添加包含最终 `return` 语句的主函数\n\n```cpp\nint main()\n\
    {\n    // 程序代码写在这里。\n    return 0 ;\n}``````\n\n![image](img/3g.jpg)在主函数中，插入语句声明并初始化两个变量\n\
    \n```cpp\nint num = 8 ;\nchar letter = ‘A’ ;\n```\n\n![image](img/4g.jpg)接下来，插入一个\
    \ `if-else` 语句来测试整数变量的值并输出相应的响应\n\n```cpp\nif ( num > 5 )\n{ cout << “Number exceeds\
    \ five” << endl ; }\nelse\n{ cout << “Number is five or less” << endl ; }\n```\n\
    \n![image](img/5g.jpg)在 `if` 语句块中，插入一个嵌套的 `if` 语句来测试字符变量的值并在匹配时输出\n\n```cpp\n\
    if ( letter == ‘A’ ) { cout << “Letter is A” << endl ; }\n```\n\n![image](img/6g.jpg)保存、编译并运行程序以查看两个测试均成功\n\
    \n![image](img/pg45_1.jpg)\n\n![image](img/7g.jpg)修改字符变量声明以更改其值\n\n```cpp\nchar\
    \ letter = ‘B’ ;\n```\n\n![image](img/8g.jpg)再次保存、编译并运行程序以查看只有外部测试成功 —— 执行外部 `if`\
    \ 语句\n\n![image](img/pg45_2.jpg)\n\n![image](img/9g.jpg)修改整数变量声明以更改其值\n\n```cpp\n\
    int num = 3 ;\n```\n\n![image](img/10g.jpg)再次保存、编译并运行程序以查看两个测试均失败 —— 执行外部 `else`\
    \ 语句\n\n![image](img/pg45_2.jpg)\n\n![image](img/hot.jpg)\n\n在测试布尔值时可以使用简写 ——\
    \ 因此表达式 `if ( flag == true )` 可以写为 `if ( flag )`\n\n![image](img/snake.jpg)\n\n\
    避免嵌套超过三层的 `if` 语句 —— 以避免混淆和错误。\n\n## 使用 switch 分支\n\n![image](img/pg46_1.jpg)\n\
    \n`if` 和 `else` 关键字在此处引入，允许程序根据测试的结果向不同的方向分支，并可以用于测试变量 —— 例如，测试整数：\n\n```cpp\n\
    if ( num == 1 ) { cout << “Monday” }\nelse\nif ( num == 2 ) { cout << “Tuesday”\
    \ }\nelse\nif ( num == 3 ) { cout << “Wednesday” }\nelse\nif ( num == 4 ) { cout\
    \ << “Thursday” }\nelse\nif ( num == 5 ) { cout << “Friday” }\n```\n\n长 `if-else`\
    \ 语句通常可以使用 `switch` 语句更高效地执行，`switch` 语句接收一个值，然后在 `case` 语句中寻找匹配值。如果没有找到匹配项，`case`\
    \ 语句将执行执行，但你可以在最后的 `case` 语句之后添加 `default` 语句来指定要执行的语句 —— 除非这正是你所需要的。例如，对于三个值，如下：\n\
    \n```cpp\nswitch( variable-name )\n{\n    case value1 ; case value2 ; case value3\
    \ :\n        statements-to-executed ; break ;\n    case value4 ; case value5 ;\
    \ case value6 :\n        statements-to-executed ; break ;\n}\n```\n\n通常，每个 `case`\
    \ 语句将拥自己的执行语句并以 `break` 结束，如相反程序所示。\n\n缺少 `break` 关键字不是语法错误 —— 确保所有必要的 `break`\
