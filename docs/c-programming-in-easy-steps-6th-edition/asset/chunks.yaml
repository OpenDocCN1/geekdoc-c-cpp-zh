- fmt: "\n| `( )` | Function call | `[ ]` | Array index | LTR |\n| :--- | :--- | :---\
    \ | :--- | :--- |\n| `->` | Class pointer | `.` | Class member | |\n| `!` | Logical\
    \ NOT | `*` | Pointer | RTL |\n| `--` | Decrement | `++` | Increment | |\n| `+`\
    \ | Positive sign | `-` | Negative sign | |\n| `sizeof` | Size of | `&` | Address\
    \ of | |\n| `*` | Multiply | `/` | Divide | LTR |\n| `%` | Modulus | | | |\n|\
    \ `+` | Add | `-` | Subtract | LTR |\n| `<=` | Less or equal | `<` | Less than\
    \ | LTR |\n| `>=` | Greater or equal | `>` | Greater than | |\n| `==` | Equality\
    \ | `!=` | Inequality | LTR |\n| `&&` | Logical AND | | | LTR |\n| `||` | Logical\
    \ OR | | | LTR |\n| `?:` | Ternary | | | RTL |\n| `+= -= *= /= %=` | Assignments\
    \ | RTL | | |\n| `,` | Comma | | | LTR |\n\nIn addition to the operators in this\
    \ table there are a number of “bitwise” operators, which are used to perform binary\
    \ arithmetic. This is outside the scope of this book, but there is a section devoted\
    \ to binary arithmetic in [C Programming in easy steps](http://www.ineasysteps.com/).\
    \ Those operators perform in just the same way in C++.\n\nOperator precedence\
    \ is demonstrated in the program opposite.\n\n![image](images/forget.jpg)\n\n\
    The `*` multiply operator is on a higher row than the `+` addition operator –\
    \ so in the expression `a=6+8*3`, multiplication is completed first, before the\
    \ addition.\n\n![image](images/hot.jpg)\n\nThe `->` class pointer and the `.`\
    \ class member operators are introduced later in this book – but they are included\
    \ here for completeness.\n\n![image](images/1r.jpg)\n\nStart a new program by\
