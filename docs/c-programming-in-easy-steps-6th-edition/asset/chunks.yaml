    ```\n\n![image](img/3b.jpg)在 main 函数中插入语句来声明和初始化各种数据类型的变量\n\n```cpp\nchar letter\
    \ ; letter = ‘A’ ;  // 声明后初始化。\nint number ; number = 100 ; // 声明后初始化。\nfloat\
    \ decimal = 7.5 ;  // 声明并初始化。\ndouble pi = 3.14159 ;  // 声明并初始化。\nbool isTrue\
    \ = false ;  // 声明并初始化。\n```\n\n![image](img/4b.jpg)现在，插入语句输出每个存储的值\n\n```cpp\n\
    cout << “char letter: ” << letter << endl ;\ncout << “int number: ” << number\
    \ << endl ;\ncout << “float decimal: ” << decimal << endl ;\ncout << “double pi:\
    \ ” << pi << endl ;\ncout << “bool isTrue: ” << isTrue << endl ;\n```\n\n![image](img/5b.jpg)保存、编译并运行程序以查看输出\n\
    \n![image](img/pg17_1.jpg)\n\n![image](img/hot.jpg)\n\n布尔变量名始终以“is”开头，以便它们能立即识别为布尔值。此外，对于所有由多个单词组成的变量名使用“驼峰命名法”（lowerCamelCase）——除第一个单词外的所有单词大大写开头，如\
    \ `isTrue`。\n\n## 使用变量数组\n\n数组是一个可以存储多个数据项的变量——与普通变量不同，后者只能存储一个数据。数据项顺序存储在数组“元素”中，从\
    \ 0 开始编号。因此，第一个值存储在元素 0 中，第二个值存储在元素 1 中，以此此类推。\n\n![image](img/pg18_1.jpg)\n\n\
    数组的声明方式与其他变量相同，此外在声明中必须指定数组的大小，放在数组名称后的方括号中。例如，声明一个名为 `nums` 存储六个整数的数组的语法如下：\n\
    \n```cpp\nint nums[6] ;\n```\n\n可选，可以在声明时通过用大括号括起来逗号分隔列表为每个元素赋值来初始化数组。例如：\n\n\
    ```cpp\nint nums[6] = { 0, 1, 2, 3, 4, 5 } ;\n```\n\n![image](img/snake.jpg)\n\
    \nC++ 中的名称是区分大小写的——因此，名为 `VAR`、`Var` 和 `var` 的变量被视为三个独立的变量。传统上，C++ 变量名是小写且很少以下划线开头，因为某些\
    \ C++ 库使用了这种约定。\n\n下表列出了五种基本的 C++ 数据类型，并带有简要描述和示例内容：\n\n| 数据类型 | 描述 | 示例 |\n|\
    \ :--- | :--- | :--- |\n| `char` | 单字节，可以存储一个字符 | ‘A’ |\n| `int` | 整数 | `100`\
    \ |\n| `float` | 浮点数，精确到六位小数 | `0.123456` |\n| `double` | 浮点数，精确到十位小数 | `0.0123456789`\
    \ |\n| `bool` | `true` 或 `false` 的布尔值，或者数值上零为假，任何非零为真 | `false` 或 `0`, `true`\
    \ 或 `1` |\n"
- fmt: "\nThe loop structures, introduced in [Chapter 3](#chapter03.xhtml), are often\
    \ used to iterate array elements.\n\n## Employing vector arrays\n\nA vector is\
    \ an alternative to a regular array, and has the advantage that its size can be\
    \ changed as the program requires. Like regular arrays, vectors can be created\
    \ for any data type, and their elements are also numbered starting at 0.\n\n![image](images/pg20_1.jpg)\n\
    \nIn order to use vectors in a program, the C++ `vector` library must be added\
    \ with an `#include <vector>` preprocessor directive at the start of the program.\
    \ This library contains the predefined functions in the table below, which are\
    \ used to work with vectors:\n\n| **Function:** | **Description:** |\n| :--- |\
    \ :--- |\n| `at(number)` | Gets the value contained in the specified element number\
    \ |\n| `back()` | Gets the value in the final element |\n| `clear()` | Removes\
    \ all vector elements |\n| `empty()` | Returns true (1) if the vector is empty,\
    \ or returns false (0) otherwise |\n| `front()` | Gets the value in the first\
    \ element |\n| `pop_back()` | Removes the final element |\n| `push_back(value)`\
    \ | Adds a final element to the end of the vector, containing the specified value\
    \ |\n| `size()` | Gets the number of elements |\n\nA declaration to create a vector\
    \ looks like this:\n\n`vector < data-type > vector-name ( size ) ;`\n\nAn `int`\
    \ vector will, by default, have each element automatically initialized with a\
    \ zero value. Optionally, a different initial value can be specified after the\
    \ size in the declaration, with this syntax:\n\n`vector < data-type > vector-name\
    \ ( size , initial-value ) ;`\n\nThe functions to work with vectors are simply\
    \ appended to the chosen vector name by the dot operator. For example, to get\
    \ the size of a vector named “vec” you would use `vec.size()`.\n\n![image](images/forget.jpg)\n\
    \nIndividual vector elements can be referenced using square brackets as with regular\
    \ arrays, such as `vec[3]`.\n\n![image](images/1b.jpg) Start a new program by\
    \ specifying the C++ library classes to include, and a namespace prefix to use\n\
    \n```cpp\n#include <vector>  // Include vector support.\n#include <iostream>\n\
    using namespace std ;\n```\n\n![image](images/commonb.jpg)\n\nvector.cpp\n\n![image](images/2b.jpg)\
    \ Add a main function containing a final return statement\n\n```cpp\nint main()\n\
    {\n    // Program code goes here.\n    return 0 ;\n}\n```\n\n![image](images/3b.jpg)\
    \ In the main function, insert a statement to declare and initialize a vector\
    \ array of three elements of the value 100\n\n`vector <int> vec( 3, 100 ) ;`\n\
    \n![image](images/4b.jpg) Now, insert statements to manipulate the vector elements\n\
    \n```cpp\ncout << “Vector size: ” << vec.size() << endl ;\ncout << “Is empty?:\
    \ ” << vec.empty() << endl;\ncout << “First element: ” << vec.at(0) << endl;\n\
    vec.pop_back() ;  // Remove final element.\ncout << “Vector size: ” << vec.size()\
    \ << endl;\ncout << “Final element: ” << vec.back() << endl;\nvec.clear() ;  //\
    \ Remove all elements.\ncout << “Vector size: ” << vec.size() << endl;\nvec.push_back(\
    \ 200 ) ;  // Add an element.\ncout << “Vector size: ” << vec.size() << endl;\n\
    cout << “First element: ” << vec.front() << endl;\n```\n\n![image](images/5b.jpg)\
    \ Save, compile, and run the program to see the output\n\n![image](images/pg21_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe example [here](#chapter03.xhtml_sec22) shows\
    \ how to use a loop to populate a vector with different initial values in each\
    \ element.\n\n## Declaring constants\n\nData that will not change during the execution\
    \ of a program should be stored in a constant container, rather than in a variable.\
    \ This better enables the compiler to check the code for errors – if the program\
    \ attempts to change the value stored in a constant, the compiler will report\
    \ an error and the compilation will fail.\n\n![image](images/pg22_1.jpg)\n\nA\
    \ constant can be created for any data type by prefixing a variable declaration\
    \ with the `const` keyword, followed by a space. Typically, constant names appear\
    \ in uppercase to distinguish them from (lowercase) variable names. Unlike variables,\
    \ constants must always be initialized in the declaration. For example, the declaration\
    \ of a constant for the math pi value looks like this:\n\n`const double PI = 3.1415926536\
    \ ;`\n\nThe `enum` keyword provides a handy way to create a sequence of integer\
    \ constants in a concise manner. Optionally, the declaration can include a name\
    \ for the sequence after the `enum` keyword. The constant names follow as a comma-separated\
    \ list within braces. For example, this declaration creates a sequence of constants:\n\
    \n`enum suit { CLUBS , DIAMONDS , HEARTS , SPADES } ;`\n\nEach of the constants\
    \ will, by default, have a value one greater than the preceding constant in the\
    \ list. Unless specified, the first constant will have a value. It is occasionally\
    \ convenient to define a list of enumerated constants – using the `typedef` keyword.\
    \ The `typedef` keyword simply creates a nickname for a structure.\n\n```cpp\n\
    typedef enum { NEGATIVE , POSITIVE } charge;\n```\n\nVariables can then be created\
    \ of the custom type in the usual way. For example, with the example above, assigning\
    \ `POSITIVE` constant to a `charge` variable actually assigns 1.\n\n![image](images/1b.jpg)\
    \ Start a new program by specifying the C++ library classes to include, and a\
    \ namespace prefix to use\n\n```cpp\n#include <iostream>\nusing namespace std\
    \ ;\n```\n\n![image](images/commonb.jpg)\n\nconstant.cpp\n\n![image](images/2b.jpg)\
    \ Add a main function containing a final return statement\n\n```cpp\nint main()\n\
    {\n    // Program code goes here.\n    return 0 ;\n}\n```\n\n![image](images/3b.jpg)\
    \ In the main function, insert statements to declare a constant, and output using\
    \ the constant value\n\n`const double PI = 3.1415926536 ;`\n`cout << “6 circumference:\
    \ ” << (PI * 6) << endl;`\n\n![image](images/4b.jpg) Next, insert statements to\
    \ declare an enumerated list of constants, and output using some of those constant\
    \ values\n\n```cpp\nenum { RED=1, YELLOW, GREEN, BROWN, BLUE, PINK, BLACK } ;\n\
    cout << “I shot a red worth: ” << RED << endl;\ncout << “Then a blue worth: ”\
    \ << BLUE << endl;\ncout << “Total scored: ” << ( RED + BLUE ) << endl;\n```\n\
    \n![image](images/5b.jpg) Now, insert statements to declare a custom data type\
    \ and output its assigned values\n\n```cpp\ntypedef enum { NEGATIVE , POSITIVE\
    \ } charge;\ncharge neutral = NEGATIVE , live = POSITIVE ;\ncout << “Neutral wire:\
    \ ” << neutral << endl;\ncout << “Live wire: ” << live << endl;\n```\n\n![image](images/6b.jpg)\
    \ Save, compile, and run the program to see the output\n\n![image](images/pg23_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nIn the PI declaration, the `*` character is the\
    \ C++ multiplication operator, and the backslash character in `\\”` escapes the\
    \ quote mark from recognition – so the string does not get terminated prematurely.\n\
    \n## Summary\n\n![image](images/pg24_1.jpg)\n\n- C++ is an object-oriented programming\
    \ language that is an extension of the procedural C programming language.\n- The\
    \ GNU C++ Compiler is available for Windows and Linux.\n- Preprocessor directives\
    \ are used to make functions within the standard C++ libraries available to a\
    \ program.\n- Each C++ program must contain one main method as the entry point\
    \ to the program.\n- Statements define the actions that the program will execute.\n"
  raw: 'The loop structures, introduced in [Chapter 3](#chapter03.xhtml), are often
    used to iterate array elements.


    **Employing vector arrays**


    A vector is an alternative to a regular array, and has the advantage that its
    size can be changed as the program requires. Like regular arrays, vectors can
    be created for any data type, and their elements are also numbered starting at
    0.


    ![image](images/pg20_1.jpg)


    In order to use vectors in a program, the C++ **vector** library must be added
    with an **#include <vector>** preprocessor directive at the start of the program.
    This library contains the predefined functions in the table below, which are used
    to work with vectors:


    | **Function:** | **Description:** |


    | **at(** *number* **)** | Gets the value contained in the specified element number
    |


    | **back()** | Gets the value in the final element |


    | **clear()** | Removes all vector elements |


    | **empty()** | Returns true (1) if the vector is empty, or returns false (0)
    otherwise |


    | **front()** | Gets the value in the first element |


    | **pop_back()** | Removes the final element |


    | **push_back(** *value* **)** | Adds a final element to the end of the vector,
    containing the specified value |


    | **size()** | Gets the number of elements |


    A declaration to create a vector looks like this:


    **vector < *data-type* > *vector-name* ( *size* ) ;**


    An **int** vector will, by default, have each element automatically initialized
    with a zero value. Optionally, a different initial value can be specified after
    the size in the declaration, with this syntax:


    **vector < *data-type* > *vector-name* ( *size , initial-value* ) ;**


    The functions to work with vectors are simply appended to the chosen vector name
    by the dot operator. For example, to get the size of a vector named “vec” you
    would use **vec.size()**.


    ![image](images/forget.jpg)


    Individual vector elements can be referenced using square brackets as with regular
    arrays, such as **vec[3]**.


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <vector>  // Include vector support.**


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonb.jpg)


    vector.cpp


    ![image](images/2b.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return** **0** ;


    **}**


    ![image](images/3b.jpg)In the main function, insert a statement to declare and
    initialize a vector array of three elements of the value 100


    **vector <int> vec( 3, 100 ) ;**


    ![image](images/4b.jpg)Now, insert statements to manipulate the vector elements


    **cout << “Vector size: ” << vec.size() << endl ;**


    **cout << “Is empty?: ” << vec.empty() << endl ;**


    **cout << “First element: ” << vec.at(0) << endl ;**


    **vec.pop_back() ;  // Remove final element.**


    **cout << “Vector size: ” << vec.size() << endl ;**


    **cout << “Final element: ” << vec.back() << endl ;**


    **vec.clear() ;  // Remove all elements.**


    **cout << “Vector size: ” << vec.size() << endl ;**


    **vec.push_back( 200 ) ;  // Add an element.**


    **cout << “Vector size: ” << vec.size() << endl ;**


    **cout << “First element: ” << vec.front() << endl ;**


    ![image](images/5b.jpg)Save, compile, and run the program to see the output


    ![image](images/pg21_1.jpg)


    ![image](images/hot.jpg)


    The example [here](#chapter03.xhtml_sec22) shows how to use a loop to populate
    a vector with different initial values in each element.


    **Declaring constants**


    Data that will not change during the execution of a program should be stored in
    a constant container, rather than in a variable. This better enables the compiler
    to check the code for errors – if the program attempts to change the value stored
    in a constant, the compiler will report an error and the compilation will fail.


    ![image](images/pg22_1.jpg)


    A constant can be created for any data type by prefixing a variable declaration
    with the **const** keyword, followed by a space. Typically, constant names appear
    in uppercase to distinguish them from (lowercase) variable names. Unlike variables,
    constants must always be initialized in the declaration. For example, the declaration
    of a constant for the math pi value looks like this:


    **const double PI = 3.1415926536 ;**


    The **enum** keyword provides a handy way to create a sequence of integer constants
    in a concise manner. Optionally, the declaration can include a name for the sequence
    after the **enum** keyword. The constant names follow as a comma-separated list
    within braces. For example, this declaration creates a sequence of constants:


    **enum suit { CLUBS , DIAMONDS , HEARTS , SPADES } ;**


    Each of the constants will, by default, have a value one greater than the preceding
    constant in the list. Unless specified, the first constant will have a value of
    0, the next a value of 1, and so on. A constant can be assigned any integer value,
    but the next constant in the list will always increment it by 1.


    It is occasionally convenient to define a list of enumerated constants as a “custom
    data type” – by using the **typedef** keyword. This can begin the **enum** declaration,
    and a chosen type name can be added at the end of the declaration. For example,
    this **typedef** statement creates a custom data type named “charge”:


    **typedef enum { NEGATIVE , POSITIVE } charge ;**


    Variables can then be created of the custom data type in the usual way, which
    may legally be assigned any of the listed constants. Essentially, these variables
    act just like an **int** variable – as they store the numerical integer value
    the assigned constant represents. For example, with the example above, assigning
    a **POSITIVE** constant to a **charge** variable actually assigns an integer of
    1.


    ![image](images/forget.jpg)


    The **typedef** keyword simply creates a nickname for a structure.


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonb.jpg)


    constant.cpp


    ![image](images/2b.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.


    return 0 ;**


    **}**


    ![image](images/3b.jpg)In the main function, insert statements to declare a constant,
    and output using the constant value


    **const double PI = 3.1415926536 ;**


    **cout << “6\” circle circumference: “ << (PI * 6) << endl ;**


    ![image](images/4b.jpg)Next, insert statements to declare an enumerated list of
    constants, and output using some of those constant values


    **enum**


    **{ RED=1, YELLOW, GREEN, BROWN, BLUE, PINK, BLACK } ;**


    **cout << “I shot a red worth: ” << RED << endl ;**


    **cout << “Then a blue worth: ” << BLUE << endl ;**


    **cout << “Total scored: ” << ( RED + BLUE ) << endl ;**


    ![image](images/5b.jpg)Now, insert statements to declare a custom data type and
    output its assigned values


    **typedef enum { NEGATIVE , POSITIVE } charge ;**


    **charge neutral = NEGATIVE , live = POSITIVE ;**


    **cout << “Neutral wire: ” << neutral << endl ;**


    **cout << “Live wire: ” << live << endl ;**


    ![image](images/6b.jpg)Save, compile, and run the program to see the output


    ![image](images/pg23_1.jpg)


    ![image](images/hot.jpg)


    In the PI declaration, the ***** character is the C++ multiplication operator,
    and the backslash character in **\”** escapes the quote mark from recognition
    – so the string does not get terminated prematurely.


    **Summary**


    ![image](images/pg24_1.jpg)


    •C++ is an object-oriented programming language that is an extension of the procedural
    C programming language.


    •The GNU C++ Compiler is available for Windows and Linux.


    •Preprocessor directives are used to make functions within the standard C++ libraries
    available to a program.


    •Each C++ program must contain one main method as the entry point to the program.


    •Statements define the actions that the program will execute.'
