  raw: '•The **sizeof** operator returns the memory byte size of a variable.


    •An **int** variable may be qualified as a **short** type for smaller numbers,
    or as a **long** type for large numbers.


    •Where an **int** variable will only store positive numbers, it may be qualified
    as **unsigned** to extend its numeric range.


    •It is important to explicitly set operator precedence in complex expressions
    by adding parentheses **( )**.


    •Data stored in a variable can be forced into a variable of a different data type
    by the casting process.


    •C++ supports traditional C-style casts and the newer form of casts that use the
    **static_cast** keyword.


    3


    **Making statements**


    ***This chapter demonstrates C++ conditional statements, which allow programs
    to branch in different directions, and introduces C++ function structures.***


    [Branching with if](#chapter03.xhtml_sec19)


    [Switching branches](#chapter03.xhtml_sec20)


    [Looping for](#chapter03.xhtml_sec21)


    [Looping while](#chapter03.xhtml_sec22)


    [Declaring functions](#chapter03.xhtml_sec23)


    [Passing arguments](#chapter03.xhtml_sec24)


    [Overloading functions](#chapter03.xhtml_sec25)


    [Optimizing functions](#chapter03.xhtml_sec26)


    [Summary](#chapter03.xhtml_sec27)


    **Branching with if**


    The C++ **if** keyword performs the basic conditional test that evaluates a given
    expression for a Boolean value of **true** or **false** – and its syntax looks
    like this:


    **if ( *test-expression* ) { *statements-to-execute-when-true* }**


    ![image](images/pg44_1.jpg)


    The braces following the test may contain one or more statements, each terminated
    by a semi-colon, but these will only be executed when the expression is found
    to be **true**. When the test is found to be **false**, the program proceeds to
    its next task.


    Optionally, an **if** statement can offer alternative statements to execute when
    the test fails by appending an **else** statement block after the **if** statement
    block, like this:


    **if ( *test-expression* ) { *statements-to-execute-when-true* }**


    **else { *statements-to-execute-when-false* }**


    ![image](images/hot.jpg)


    Where there is only one statement to execute when the test succeeds, the braces
    may be omitted – but retaining them aids code clarity.


    To test two conditions, the test expression may use the **&&** operator – for
    example, **if ( ( num > 5 ) && ( letter == ‘A’ ) )**. Alternatively, an **if**
    statement can be “nested” within another **if** statement, so those statements
    in the inner statement block will only be executed when both tests succeed – but
    statements in the outer statement block will be executed if the outer test succeeds.


    ![image](images/1g.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commong.jpg)


    ifelse.cpp


    ![image](images/2g.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3g.jpg)In the main function, insert statements to declare and
    initialize two variables


    **int num = 8 ;**


    **char letter = ‘A’ ;**


    ![image](images/4g.jpg)Next, insert an **if-else** statement that tests the integer
    variable value and outputs an appropriate response


    **if ( num > 5 )**


    **{ cout << “Number exceeds five” << endl ; }**


    **else**


    **{ cout << “Number is five or less” << endl ; }**


    ![image](images/5g.jpg)In the **if** statement block, insert a nested **if** statement
    that tests the character variable value and outputs when matched


    **if ( letter == ‘A’ ) { cout << “Letter is A” << endl ; }**


    ![image](images/6g.jpg)Save, compile and run the program to see both tests succeed


    ![image](images/pg45_1.jpg)


    ![image](images/7g.jpg)Edit the character variable declaration to change its value


    **char letter = ‘B’ ;**


    ![image](images/8g.jpg)Save, compile, and run the program once more to see only
    the outer test succeed – executing the outer **if** statement


    ![image](images/pg45_2.jpg)


    ![image](images/9g.jpg)Edit the integer variable declaration to change its value


    **int num = 3 ;**


    ![image](images/10g.jpg)Save, compile, and run the program again to see both tests
    now fail – executing the outer **else** statement


    ![image](images/pg45_2.jpg)


    ![image](images/hot.jpg)


    Shorthand can be used when testing a Boolean value – so the expression **if (
    flag == true )** can be written as **if ( flag )**


    ![image](images/snake.jpg)


    Avoid nesting more than three levels of **if** statements – to avoid confusion
    and errors.


    **Switching branches**


    ![image](images/pg46_1.jpg)


    The **if** and **else** keywords, introduced [here](#chapter03.xhtml_sec19), allow
    programs to branch in a particular direction according to the result of a test
    condition, and can be used to repeatedly test a variable to match a value – for
    example, testing for an integer:


    **if ( num == 1 ) { cout << “Monday” ; }**


    **else**


    **if ( num == 2 ) { cout << “Tuesday” ; }**


    **else**


    **if ( num == 3 ) { cout << “Wednesday” ; }**


    **else**


    **if ( num == 4 ) { cout << “Thursday” ; }**


    **else**


    **if ( num == 5 ) { cout << “Friday” ; }**


    The program will branch in the direction of the match.


    Conditional branching with long **if**-**else** statements can often be more efficiently
    performed using a **switch** statement instead, especially when the test expression
    evaluates one variable.


    The **switch** statement works in an unusual way. It takes a given variable value,
    then seeks a matching value among a number of **case** statements. Statements
    associated with the matching case statement value will then be executed.


    When no match is found, no **case** statements will be executed, but you may add
    a **default** statement after the final **case** statement to specify statements
    to be executed when no match is found.


    It is important to follow each case statement with the **break** keyword, to stop
    the program proceeding through the switch block after all statements associated
    with the matched **case** value have been executed – unless that is precisely
    what you require. For example, one statement for each block of three values, like
    this:


    **switch( *variable-name* )**


    **{**


    **case *value1* ; case *value2* ; case *value3* ;**


    ***statements-to-be-executed* ; break ;**


    **case *value4* ; case *value5* ; case *value6* ;**


    ***statements-to-be-executed* ; break ;**


    **}**


    Usually, each **case** statement will have its own set of statements to execute
    and be terminated by a **break**, as in the program opposite.


    ![image](images/snake.jpg)


    Missing **break** keywords are not syntax errors – ensure that all intended breaks
    are present after **case** statements.


    ![image](images/1g.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commong.jpg)


    switch.cpp


    ![image](images/2g.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3g.jpg)In the main function, insert a statement to declare and
    initialize an integer variable with a value to be matched


    **int num = 3 ;**


    ![image](images/4g.jpg)Next, insert a **switch** statement to seek a match


    **switch ( num )**


    **{**


    **case 1 : cout << num << “ : Monday” ; break ;**


    **case 2 : cout << num << “ : Tuesday” ; break ;**


    **case 3 : cout << num << “ : Wednesday” ; break ;**


    **case 4 : cout << num << “ : Thursday” ; break ;**


    **case 5 : cout << num << “ : Friday” ; break ;**


    **}**


    ![image](images/5g.jpg)In the **switch** statement, insert a **default** statement
    after the final **case** statement


    **default : cout << num << “ : Weekend day” ;**


    ![image](images/6g.jpg)Save, compile, and run the program to see the output'
