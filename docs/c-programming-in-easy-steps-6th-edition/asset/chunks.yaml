    ![image](images/hot.jpg)


    An image for display may be in any popular file format – such as **.bmp**, **.gif**,
    **.jpg**, **.png**, or **.tif**.


    ![image](images/5g.jpg)In **Solution Explorer**, the selected image file now appears
    in the project’s **Asset** folder


    ![image](images/pg175_1.jpg)


    ![image](images/6g.jpg)Select the Image component in **Designer** view, then click
    **View**, **Properties** to reveal its properties


    ![image](images/pg175_2.jpg)


    ![image](images/7g.jpg)In the **Properties** window, expand the **Common** category,
    then click the **Source** item’s arrow button and select the added image from
    the drop-down list


    ![image](images/8g.jpg)The image now appears in the **Design** view, and its path
    gets added to the **XAML** view code and **Source** property


    ![image](images/pg175_3.jpg)


    ![image](images/pg175_4.jpg)


    ![image](images/hot.jpg)


    Explore the **Appearance** and **Transform** options in an image’s **Properties**
    window to discover how you can modify how it will be displayed.


    **Designing the layout**


    To complete the app’s layout, design attributes can be added to the XAML element
    tags to specify what they will display and precisely where in the interface they
    will appear:


    ![image](images/1g.jpg)Open **MainPage.xaml**, then add two attributes to the
    outer **<StackPanel>** element to fix its position **HorizontalAlignment = ”Left”
    VerticalAlignment = ”Top”**


    ![image](images/commong.jpg)


    Universal


    ![image](images/2g.jpg)Next, edit the **<Image>** element by modifying the initial
    assigned value of 200 – to increase its width


    **Width = ”300”**'
