- fmt: "\n![image](images/pg62_1.jpg)\n\nLike the `<iostream>` class library, the\
    \ `<string>` library is part of the `std` namespace that is used by the C++ standard\
    \ library classes. This means that a string object can be referred to as `std::string`,\
    \ or more simply as `string` when a `using namespace std;` directive is included\
    \ at the start of the program.\n\nOnce the `<string>` library is made available,\
    \ a `string` “variable” can be declared in the same way as other variables. The\
    \ declaration may optionally initialize the variable using the `=` assignment\
    \ operator, or it may be initialized later in the program.\n\nAdditionally, a\
    \ `string` variable may be initialized by including a text string between parentheses\
    \ after the variable name.\n\nText strings in C++ must always be enclosed within\
    \ “ ” double quote characters – ‘ ’ single quotes are only used to surround character\
    \ values of the `char` data type.\n\nA C++ `string` variable is much easier to\
    \ work with than the `char` arrays that C programmers must use, as it automatically\
    \ resizes to accommodate the length of any text string. At a lower level, the\
    \ text is still stored as a character array, but the `string` variable lets you\
    \ ignore those details. Consequently, a character array can be assigned to a `string`\
    \ variable using the `=` assignment operator.\n\nIt is important to remember that\
    \ when numeric values are assigned to a `string` variable, they are no longer\
    \ a numeric data type, so arithmetic cannot be performed on them. For example,\
    \ attempting to add `string` values of “7” and “6” with the `+` addition operator\
    \ produces the concatenated `string` “76”, not the numerical value of 13. In this\
    \ case, the `+` operator recognizes that the context is not arithmetical, so adopts\
    \ the guise of “concatenation operator” to unite the two strings. Similarly, the\
    \ `+=` operator appends a `string` to another `string` and is useful to build\
    \ long strings of text.\n\nSeveral `string` values are built into a single long\
    \ string in the example program described [here](#chapter04.xhtml_ecif).\n\n![image](images/1p.jpg)Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n\n```cpp\n#include <string>  // Include string support.\n#include\
    \ <iostream>\nusing namespace std ;\n```\n\n![image](images/commonp.jpg)\n\nstring.cpp\n\
    \n![image](images/2p.jpg)Add a main function containing four string variable declarations\
    \ and a final return statement\n\n```cpp\nint main()\n{\n    string text = “9”\
    \ ;\n    string term( “9 “ ) ;\n    string info = “Toys” ;\n    string color ;\n\
    \    // Add more statements here.\n    return 0 ;\n}\n```\n\n![image](images/3p.jpg)In\
    \ the main function, after the variable declarations, insert statements to declare\
    \ and initialize a character array, then assign its value to the uninitialized\
    \ string variable\n\n```cpp\nchar hue[4] = { ‘R’, ’e’, ’d’, ’\\0’ } ;\ncolor =\
    \ hue ;\n```\n\n![image](images/4p.jpg)Assign a longer text string to one of the\
    \ string variables\n\n```cpp\ninfo = “Balloons” ;\n```\n\n![image](images/5p.jpg)Build\
