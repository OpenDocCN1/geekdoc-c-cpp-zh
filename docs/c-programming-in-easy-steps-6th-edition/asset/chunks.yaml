  trans: "\n\nWindows 10 引入了**通用 Windows Platform** (UWP)，它允许您创建一个单一的**通用 Windows\
    \ 应用** (UWA)，该应用可以在任何现代基于 Windows 的设备上运行。UWA 的界面布局使用**可扩展应用程序标记语言** (XAML) 来指定组件。为了为\
    \ UWP 开发应用，您应该运行 Windows 10 或 Windows 11，并且您的 Visual Studio IDE 必须包含**通用 Windows\
    \ 应用开发工具**：\n\n![image](img/1g.jpg)进入 Windows 应用程序菜单并启动 `Visual Studio Installer`\n\
    \n![image](img/pg170_2.jpg)\n\n![image](img/commong.jpg)\n\nUniversal\n\n![image](img/2g.jpg)点击安装程序的**修改**按钮以打开“修改”对话框\n\
    \n![image](img/pg170_3.jpg)\n\n![image](img/3g.jpg)选择“工作负载”菜单，然后选择**通用 Windows\
    \ 平台开发**工作负载组件\n\n![image](img/pg170_4.jpg)\n\n![image](img/4g.jpg)点击对话框中的**修改**按钮以下载并安装\
    \ UWP 开发工作负载组件\n\n![image](img/pg170_5.jpg)\n\n![image](img/5g.jpg)点击**启动**按钮打开\
    \ Visual Studio IDE\n\n![image](img/pg170_6.jpg)\n\n![image](img/6g.jpg)选择**创建新项目**选项\n\
    \n![image](img/pg170_7.jpg)\n\n![image](img/7g.jpg)滚动项目选项列表，点击**安装用于 C++ 开发的 Windows\
    \ 通用工具**选项以下载工具\n\n![image](img/pg170_8.jpg)\n\n![image](img/snake.jpg)\n\n本章示例针对\
    \ Windows 11 上的 Visual Studio 2022 说明 – 其他版本的说明可能会不同。\n\n![image](img/forget.jpg)\n\
    \n根据您安装 Visual Studio 时的选择，您可能已经拥有通用 Windows 应用开发工具。\n\n![image](img/8g.jpg)再次选择**创建新项目**并选择**空白应用（通用\
    \ Windows - C++/CX）**项目选项\n\n![image](img/pg171_1.jpg)\n\n![image](img/9g.jpg)点击**下一步**打开**配置你的新项目**对话框，然后将项目命名为“Universal”并点击**创建**\n\
    \n![image](img/pg171_2.jpg)当要求选择目标和最小平台版本时，只需点击**确定**以接受默认选项\n\n![image](img/11g.jpg)在\
    \ Visual Studio 创建新项目后，选择**视图, 解决方案管理器**以检查生成的文件：\n\n* **Assets** 文件夹中的一组 logo\
    \ 图像。\n* 内部 XAML 和 C++ **App** 文件。\n* **MainPage** 的 XAML 和 C++ 文件 – 您将在此处创建界面组件和功能代码。\n\
    * 其他杂项**Package** 包文件。\n\n![image](img/pg171_3.jpg)\n\n![image](img/snake.jpg)\n\
    \n确保在**设置>隐私与安全性>开发人员**中启用了 Windows **开发模式**和**设备发现**选项。\n\n![image](img/forget.jpg)\n\
    \n这些文件对于所有使用 C++ 的 UWP 应用都至关重要，并且存在于 Visual Studio 创建的每个以 C++ 为目标针对通用 Windows\
    \ 平台的项目中。\n\n## 插入页面组件\n\nVisual Studio 提供了一个双部分窗口来向 UWP 应用中插入界面组件。这包含了组件的**设计**视图和用于\
    \ XAML 代码的 **XAML** 视图：\n\n![image](img/1g.jpg)打开**解决方案管理器**，然后双击 `MainPage.xaml`\
    \ – 启动双部分窗口\n\n![image](img/pg172_1.jpg)\n\n![image](img/commong.jpg)\n\nUniversal\n\
    \n![image](img/2g.jpg)看到默认情况下，**设计**视图在**横**模式下显示空白画布\n\n![image](img/pg172_2.jpg)有一个弹出的**工具箱**功能，允许您向画布上添加组件，但稍后需要在\
    \ XAML 代码中对它们进行编辑。在本示例中，组件从一开始就开始在 XAML 代码中创建。\n\n![image](img/hot.jpg)\n\nXAML\
    \ 的发音为“zammel”。\n\n![image](img/3g.jpg)现在，看到默认情况下，**XAML** 视图显示存在 `<Grid> </Grid>`\
    \ 标签 – 这是画布的根元素，您可以在其中添加组件元素\n\n![image](img/pg173_1.jpg)组件元素最好嵌套在 `<StackPanel>`\
    \ 元素中，因为可以给它赋予一个 `x:Name` 以在功能代码中引用，并赋予一个 `Orientation` 属性以指定嵌套元素出现的方向。常见的组件元素包括\
    \ `<Image>`、`<TextBox>`、`<TextBlock>`（标签）和 `<Button>`。多个 `<StackPanel>` 元素相互嵌套可以确定组件的**水平**和**垂直**布局：\n\
    \n![image](img/4g.jpg)在根 `<Grid> </Grid>` 标签之间插入元素，使 **XAML** 视图代码看起来恰好像这样：\n\n\
    ![image](img/pg173_2.jpg)\n\n![image](img/5g.jpg)当您在**设计**视图中添加组件时，它们看起来所示：\n\n\
    ![image](img/pg173_3.jpg)\n\n```xml\n<Grid>\n    <StackPanel>\n        <Image\
    \ x:Name=\"image1\" />\n        <TextBox x:Name=\"textbox1\" />\n        <TextBlock\
    \ x:Name=\"textblock1\" Text=\"Label\" />\n        <Button x:Name=\"button1\"\
    \ Content=\"Click\" />\n    </StackPanel>\n</Grid>\n```\n\n## 导入资源\n\n为了让 `<Image>`\
    \ 组件显示图形，首先需要将图像文件添加到项目的 **Assets** 文件夹。然后将其分配给 `<Image>` 标签的 `Source` 属性：\n\n\
    ![image](img/1g.jpg)将图像复制到项目的 Assets 文件夹，通常位于 `C:\\Users\\username\\repos\\project\\\
    Assets`\n\n![image](img/commong.jpg)\n\nUniversal\n\n![image](img/2g.jpg)打开解决方案管理器，然后右键点击\
    \ **Assets** 文件夹并从右键菜单中选择**添加**\n\n![image](img/3g.jpg)现在，从下一个键菜单中选择**现有项目…**\
    \ – 打开现有项目对话框\n\n![image](img/pg174_1.jpg)在现有项目对话框中，浏览到图像文件的位置并点击**添加**按钮\n\n\
    ![image](img/pg174_2.jpg)\n\n![image](img/hot.jpg)用于显示的图像可以是任何文件格式 – 如 `.bmp`、`.gif`、`.jpg`、`.png`\
    \ 或 `.tif`。\n\n![image](img/5g.jpg)在解决方案管理器中，选中的图像现在出现在项目的 Assets 文件夹中\n\n![image](img/pg175_1.jpg)在设计视图中选择\
    \ Image 组件，点击**查看>属性**显示其属性\n\n![image](img/pg175_2.jpg)在属性窗口中，展开**常用**类别，然后点击\
    \ `Source` 项目的箭头按钮并从下拉列表中选择添加的图像\n\n![image](img/pg175_3.jpg)图像现在出现在**设计**视图中，其路径被添加到\
    \ **XAML** 视图代码和 `Source` 属性中\n\n![image](img/pg175_4.jpg)\n\n## 导入资源\n\n探索图像属性窗口中的**外观**和**变换**选项，发现如何修改它的显示方式。\n\
    \n## 设计布局\n\n为了完成应用的布局，可以在 XAML 元素标签中添加设计属性，以指定它们显示的内容以及它们在界面上的精确位置：\n\n![image](img/1g.jpg)打开\
    \ `MainPage.xaml`，然后为外部 `<StackPanel>` 元素添加两个属性以固定其位置 `HorizontalAlignment=\"\
    Left\" VerticalAlignment=\"Top\"`\n\n接下来，通过修改初始分配值 200 来编辑 `<Image>` 元素 – 将其宽度\
    \ **Width=\"300\"**\n\n"
