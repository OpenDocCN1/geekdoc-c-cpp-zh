  raw: 'All command line examples in this book have been compiled and tested with
    the latest GNU C++ Compiler available at the time of writing – they may not replicate
    exactly with other compilers.


    **Creating variables**


    A “variable” is like a container in a C++ program in which a data value can be
    stored inside the computer’s memory. The stored value can be referenced using
    the variable’s name.


    ![image](images/pg16_1.jpg)


    The programmer can choose any name for a variable, providing it adheres to the
    C++ naming conventions – a chosen name may only contain letters, digits, and the
    underscore character, but cannot begin with a digit. Also, the C++ keywords, listed
    on the inside cover of this book must be avoided. It’s good practice to choose
    meaningful names to make the code more comprehensible.


    To create a new variable in a program it must be “declared”, specifying the type
    of data it may contain and its chosen name. A variable declaration has this syntax:


    ***data-type variable-name ;***


    Multiple variables of the same data type can be created in a single declaration
    as a comma-separated list with this syntax:


    ***data-type variable-name1 , variable-name2 , variable-name3 ;***


    ![image](images/snake.jpg)


    Names are case-sensitive in C++ – so variables named **VAR**, **Var**, and **var**
    are treated as three individual variables. Traditionally, C++ variable names are
    lowercase and seldom begin with an underscore, as some C++ libraries use that
    convention.


    The five basic C++ data types are listed in the table below, together with a brief
    description and example content:


    | **Data Type** | **Description** | **Example** |


    | **char** | A single byte, capable of holding one character | **‘A’** |


    | **int** | An integer whole number | **100** |


    | **float** | A floating-point number, correct to six decimal places | **0.123456**
    |


    | **double** | A floating-point number, correct to 10 decimal places | **0.0123456789**
    |


    | **bool** | A Boolean value of **true** or **false**, or numerically zero is
    false and any non-zero is true | **false** or **0** **true** or **1** |


    ![image](images/snake.jpg)


    Character values of the **char** data type must always be enclosed between single
    quotes – not double quotes.


    Variable declarations must appear before executable statements – so they will
    be available for reference within statements.


    When a value is assigned to a variable it is said to have been “initialized”.
    Optionally, a variable may be initialized in its declaration. The value stored
    in any initialized variable can be displayed on standard output by the **cout**
    function, which was used [here](#chapter01.xhtml_sec3) to display the “Hello World!”
    greeting.


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonb.jpg)


    vars.cpp


    ![image](images/2b.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.


    return 0 ;**


    **}**


    ![image](images/3b.jpg)In the main function, insert statements to declare and
    initialize variables of various data types


    **char letter ; letter = ‘A’ ;  // Declared then initialized.**


    **int number ; number = 100 ; // Declared then initialized.**


    **float decimal = 7.5 ;  // Declared and initialized.**


    **double pi = 3.14159 ;  // Declared and initialized.**


    **bool isTrue = false ;  // Declared and initialized.**


    ![image](images/4b.jpg)Now, insert statements to output each stored value


    **cout << “char letter: ” << letter << endl ;**


    **cout << “int number: ” << number << endl ;**


    **cout << “float decimal: ” << decimal << endl ;**


    **cout << “double pi: ” << pi << endl ;**


    **cout << “bool isTrue: ” << isTrue << endl ;**


    ![image](images/5b.jpg)Save, compile, and run the program to see the output


    ![image](images/pg17_1.jpg)


    ![image](images/hot.jpg)


    Always begin Boolean variable names with “is” so they are instantly recognizable
    as Booleans. Also, use “lowerCamelCase” for all variable names that comprise multiple
    words – where all except the first word begin with uppercase, like “isTrue”.


    **Employing variable arrays**


    An array is a variable that can store multiple items of data – unlike a regular
    variable, which can only store one piece of data. The pieces of data are stored
    sequentially in array “elements” that are numbered, starting at 0. So, the first
    value is stored in element 0, the second value is stored in element 1, and so
    on.


    ![image](images/pg18_1.jpg)


    An array is declared in the same way as other variables, but additionally the
    size of the array must also be specified in the declaration, in square brackets
    following the array name. For example, the syntax to declare an array named “nums”
    to store six integer numbers looks like this:


    **int nums[6] ;**


    Optionally, an array can be initialized when it is declared by assigning values
    to each element as a comma-separated list enclosed by curly brackets (braces).
    For example:


    **int nums[6] = { 0, 1, 2, 3, 4, 5 } ;**


    ![image](images/forget.jpg)


    Array numbering starts at 0 – so the final element in an array of six elements
    is number 5, not number 6.


    ![image](images/pg18_2.jpg)


    An individual element can be referenced using the array name followed by square
    brackets containing the element number. This means that **nums[1]** references
    the second element in the example above – not the first element, as element numbering
    starts at 0.


    Arrays can be created for any C++ data type, but each element may only contain
    data of the same data type. An array of characters can be used to store a string
    of text if the final element contains the special **\0** null character. For example:


    **char name[5] = { ‘m’, ‘i’, ‘k’, ‘e’, ‘\0’ } ;**


    The entire string to be referenced just by the array name. This is the principle
    means of working with strings in the C language, but the C++ string class, introduced
    in [Chapter 4](#chapter04.xhtml), is far simpler.


    Collectively, the elements of an array are known as an “index”. Arrays can have
    more than one index – to represent multiple dimensions, rather than the single
    dimension of a regular array. Multi-dimensional arrays of three indices and more
    are uncommon, but two-dimensional arrays are useful to store grid-based information,
    such as coordinates. For example:


    **int coords[2] [3] = { { 1, 2, 3 } , { 4, 5, 6 } } ;**


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonb.jpg)


    arrays.cpp


    ![image](images/2b.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3b.jpg)In the main function, insert statements to declare and
    initialize three variable arrays


    **// Declared then initialized.**


    **float nums[3] ;**


    **nums[0] = 1.5 ; nums[1] = 2.75 ; nums[2] = 3.25 ;**


    **// Declared and initialized.**


    **char name[5] = { ‘m’, ‘i’, ‘k’, ‘e’, ‘\0’ } ;**


    **int coords[2] [3] = { { 1, 2, 3 } , { 4, 5, 6 } } ;**


    **}**


    ![image](images/4b.jpg)Now, insert statements to output specific element values


    **cout << “nums[0]: ” << nums[0] << endl ;**


    **cout << “nums[1]: ” << nums[1] << endl ;**


    **cout << “nums[2]: ” << nums[2] << endl ;**


    **cout << “name[0]: ” << name[0] << endl ;**


    **cout << “Text string: ” << name << endl ;**


    **cout << “coords[0][2]: ” << coords[0][2] << endl ;**


    **cout << “coords[1][2]: ” << coords[1][2] << endl ;**


    ![image](images/5b.jpg)Save, compile, and run the program to see the output


    ![image](images/pg19_1.jpg)


    ![image](images/snake.jpg)


    Where possible, variable names should not be abbreviations – abbreviated names
    are only used in this book’s examples due to space limitations.


    ![image](images/hot.jpg)'
