    **Isolating class structures**


    The source code for each example program in this book is generally contained in
    a single **.cpp** file to save space, but in reality OOP programs are often contained
    in three separate files:


    •Header **.h** file – contains only class declarations.s


    •Implementation **.cpp** file – contains class definitions to implement the methods
    declared in the header file, which is referenced by an **#include** directive.


    •Client **.cpp** file – contains a **main** method that employs the class members
    declared in the header file, which is also referenced by an **#include** directive.


    ![image](images/pg146_1.jpg)


    For example, a sum calculator program might comprise three files named **ops.h**
    (a header file declaring operation classes), **ops.cpp** (an implementation file
    defining the operation methods), and **sum.cpp** (a client file calling the various
    operations).


    ![image](images/hot.jpg)


    The client file is sometimes referred to as a “driver” file.


    When compiling **sum.cpp**, the compiler incorporates the included header file
    and implementation file into the program. It first translates the header file
    and implementation file into a binary object file (**ops.o**), then it translates
    the header file and client file into a second binary object file (**sum.o**).
    Finally, the Linker combines both object files into a single executable file (**sum.exe**).


    ![image](images/pg146_2.jpg)


    ![image](images/hot.jpg)


    Using an **#include** directive to reference a header file works in a similar
    manner to using an **#include** directive to reference a standard C++ library.


    Isolating class structures in separate “modular” files has the advantage of improving
    portability, and makes code maintenance easier by clearly identifying the purpose
    of each file.


