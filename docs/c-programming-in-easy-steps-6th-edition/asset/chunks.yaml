- fmt: "\nEach function is declared early in the program code as a “prototype”, comprising\
    \ a data type for the value it will return and the function name followed by parentheses,\
    \ which may optionally contain a list of “argument” data types of passed values\
    \ it may use. The syntax of a function prototype declaration looks like this:\n\
    \n`return-data-type function-name ( arguments-data-type-list ) ;`\n\n![image](images/hot.jpg)\n\
    \nStrictly speaking, the arguments in a function prototype are known as its “formal\
    \ parameters”.\n\nFor example, a function named `computeArea` that returns a `float`\
    \ value and is passed two `float` arguments is declared as:\n\n```cpp\nfloat computeArea(\
    \ float, float ) ;\n```\n\n### Defining functions\n\nThe function’s definition\
    \ appears later in the program code and comprises a repeat of the prototype, plus\
    \ the actual function body. The function body is the statements to be executed\
    \ whenever the function is called, contained within a pair of braces.\n\n![image](images/forget.jpg)\n\
    \nUse the `void` keyword if the function will return no value to the caller.\n\
    \nIt is important to recognize that the compiler checks the function definition\
    \ against the prototype, so the actual returned data type must match that specified\
    \ in the prototype, and any supplied arguments must match in both number and data\
    \ type. Compilation fails if the definition does not match the prototype. A simple\
    \ `computeArea` definition might look like this:\n\n```cpp\nfloat computeArea(\
    \ float width, float height )\n{\n  return ( width * height ) ;\n}\n```\n\n###\
    \ Variable scope\n\nVariables that are declared in a function can only be used\
    \ locally within that function, and are not accessible globally for use in other\
    \ functions. This limitation is known as “variable scope”.\n\n![image](images/1g.jpg)Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n\n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n\
    ![image](images/commong.jpg)\n\nscope.cpp\n\n![image](images/2g.jpg)Next, declare\
    \ two simple function prototypes\n\n```cpp\nfloat bodyTempC() ;\nfloat bodyTempF()\
    \ ;\n```\n\n![image](images/3g.jpg)Now, add a main function containing calls to\
