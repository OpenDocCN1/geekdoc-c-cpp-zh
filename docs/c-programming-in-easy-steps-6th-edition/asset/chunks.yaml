    an access specifier, and its base class name.


    •When an instance object of a derived class is created, the default constructor
    of the base class gets called in addition to the constructor of the derived class.


    •A derived class method can override a matching method in its base class – also
    overriding all overloaded methods of that name within the base class.


    8


    **Harnessing polymorphism**


    ***This chapter demonstrates how to separate programs into modular components
    and introduces the topic of polymorphism – the third principle of C++ Object Oriented
    Programming.***


    [Pointing to classes](#chapter08.xhtml_sec64)


    [Calling a virtual method](#chapter08.xhtml_sec65)


    [Directing method calls](#chapter08.xhtml_sec66)


    [Providing capability classes](#chapter08.xhtml_sec67)


    [Making abstract data types](#chapter08.xhtml_sec68)


    [Building complex hierarchies](#chapter08.xhtml_sec69)


    [Isolating class structures](#chapter08.xhtml_sec70)


    [Employing isolated classes](#chapter08.xhtml_sec71)


    [Summary](#chapter08.xhtml_sec72)


    **Pointing to classes**


    The three cornerstones of Object Oriented Programming (OOP) are encapsulation,
    inheritance, and polymorphism. Examples in [Chapter 7](#chapter07.xhtml) have
    demonstrated how data can be encapsulated within a C++ class, and how derived
    classes inherit the properties of their base class. This chapter introduces the
    final cornerstone principle of polymorphism.


    ![image](images/pg134_1.jpg)


    The term “polymorphism” (from Greek, meaning “many forms”) describes the ability
    to assign a different meaning, or purpose, to an entity according to its context.


    In C++, overloaded operators can be described as polymorphic. For example, the
    ***** character can represent either the multiply operator or the dereference
    operator, according to its context. Similarly, the **+** character can represent
    either the add operator or the concatenate operator, according to its context.


    More importantly, C++ class methods can also be polymorphic. The key to understanding
    polymorphism with classes is to recognize that a base class pointer can be created
    that is also bound to a particular derived class by association.


    A pointer to a base class can be assigned the memory address of a derived class
    to provide a “context” – to uniquely identify that derived class. For example,
    with a **Base** base class and a derived **Sub** class, a pointer can be created
    like this:


    **Sub inst ;**


    **Base* pSub = &inst ;**'
