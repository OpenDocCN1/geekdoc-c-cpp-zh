    ![image](images/2bl.jpg)After the preprocessor instructions, define an inline
    function to output the total of two passed arguments


    **inline void add ( int& a, int* b )**


    **{ cout << “Total: ” << ( a + *b ) << endl ; }**


    ![image](images/3bl.jpg)Add a main function containing a final **return** statement
    and declarations creating two regular integer variables, one reference, and two
    pointers


    **int main()**


    **{**


    **int num = 100 , sum = 500 ;**


    **int& rNum = num ;**


    **int* ptr = &num ;**


    **void (* fn ) ( int& a, int* b ) = add ;**


    **// Add more statements here.**


    **return 0 ;**


    **}**


    ![image](images/4bl.jpg)In the main function, insert statements to output the
    first integer variable values via the reference and pointer


    **cout << “Reference: ” << rNum << endl ;**


    **cout << “Pointer: ” << *ptr << endl ;**


    ![image](images/5bl.jpg)Now, assign the second integer variable to the pointer
    and output its value via the pointer, then call the function pointer to output
    the sum of the variable values


    **ptr = &sum ;**


    **cout << “Pointer now: ” << *ptr << endl ;**


    **fn( rNum , ptr ) ;**


    ![image](images/6bl.jpg)Save, compile, and run the program to see the output


    ![image](images/pg113_1.jpg)


    ![image](images/hot.jpg)


    C programmers tend to put the **&** and ***** characters before the variable names,
    but in C++ it is usual to put them after the data type – as the feature is a property
    of the data type, not the name.


    **Summary**


    ![image](images/pg114_1.jpg)


    •Data is stored in computer memory within sequentially numbered addresses.


    •Operands to the left of an **=** operator are L-values, and those to its right
    are R-values.


    •An R-value may only appear to the right of an **=** operator.


    •A pointer is a variable that stores the memory address of another variable –
    that to which it points.


    •The ***** character appears as an L-value in a pointer declaration, indicating
    that the statement will create a pointer variable.


    •Once declared, the ***** dereference operator can be used to reference the value
    within a variable to which a pointer points.


    •Pointer arithmetic can be used to iterate through the values stored in array
    elements.


    •A variable is passed to a function by value, whereas pointers and references
    are passed by reference.


    •Passing by reference allows the receiving function to directly manipulate variables
    declared within the calling function.


    •A string value can be assigned to a pointer of the **char** data type, and the
    whole string retrieved using the pointer name.


    •Each element in a pointer array can store data or a pointer.


    •A reference is not a variable, but merely an alias for a variable.


    •The **&** character appears as an L-value in a reference declaration, indicating
    that the statement will create an alias.'
