- fmt: "\nReferences provide access to the data stored in the variable to which they\
    \ refer, just like the variable itself, and can be used to change the stored data\
    \ by assigning a new value of the appropriate data type.\n\n![image](images/pg110_1.jpg)\n\
    \nAdditionally, references can, like pointers, be passed to functions as arguments:\n\
    \n• When variables are passed to functions, their data is passed “by value” to\
    \ a local variable inside the function – so that the function operates on a copy\
    \ of the original value.\n• When references are passed to functions, their data\
    \ is passed “by reference” – so the function operates on the original value.\n\
    \nThe benefit of passing by reference allows functions to directly manipulate\
    \ variable values declared within the calling function.\n\n![image](images/1bl.jpg)Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n\n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n\
    ![image](images/commonbb.jpg)\n\nfnref.cpp\n\n![image](images/2bl.jpg)After the\
    \ preprocessor instructions, declare two function prototypes to each accept a\
    \ single reference argument\n\n```cpp\nvoid writeOutput ( int& ) ;\nvoid computeTriple\
    \ ( int& ) ;\n```\n\n![image](images/3bl.jpg)Add a main function containing a\
    \ final return statement and declaring an initialized regular integer variable\n\
    \n```cpp\nint main()\n{\n    int num = 5 ;\n    // Add more statements here.\n\
    \    return 0 ;\n}\n```\n\n![image](images/4bl.jpg)In the main function, insert\
    \ a second variable declaration, initializing a reference as an alias of the integer\
    \ variable\n\n```cpp\nint& ref = num ;\n```\n\n![image](images/forget.jpg)\n\n\
    This example may seem familiar, as it recreates the example [here](#chapter06.xhtml_sec49)\
    \ – but replaces pointers with references.\n\n![image](images/5bl.jpg)After the\
    \ main function block, define a function to output the current value of a variable\
    \ to which a reference refers\n\n```cpp\nvoid writeOutput( int& value )\n{\n \
    \   cout << “Current value: ” << value << endl ;\n}\n```\n\n![image](images/6bl.jpg)Define\
    \ another function to multiply the current value of a variable to which a reference\
    \ refers\n\n```cpp\nvoid computeTriple( int& value )\n{\n    value *= 3 ;  //\
    \ Multiply and assign a referenced value.\n}\n```\n\n![image](images/7bl.jpg)In\
    \ the main function, pass a reference argument to a function to output the variable\
    \ value to which it refers\n\n```cpp\nwriteOutput( ref ) ;\n```\n\n![image](images/8bl.jpg)Next,\
    \ use the reference to increase the variable value, then display its new value\n\
    \n```cpp\nref += 15 ;  // Add and assign a referenced value.\nwriteOutput( ref\
    \ ) ;\n```\n\n![image](images/9bl.jpg)Now, pass a reference argument to a function\
    \ to multiply the variable to which it refers, then display its new value\n\n\
    ```cpp\ncomputeTriple( ref ) ;\nwriteOutput( ref ) ;\n```\n\n![image](images/10bl.jpg)Save,\
    \ compile, and run the program to see the computed values output\n\n![image](images/pg111_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nThe function prototype and definition must both\
    \ contain a reference argument.\n\n![image](images/hot.jpg)\n\nFunctions that\
    \ operate directly on variables within the calling function need no return statement.\n\
    \n### Comparing pointers & references\n\nPointers and references can both be used\
    \ to refer to variable values and to pass them to functions by reference rather\
    \ than by value. Technically, passing by reference is more efficient than passing\
    \ by value, so the use of pointers and references is to be encouraged.\n\n![image](images/pg112_1.jpg)\n\
    \nThe decision whether to use a pointer or a reference is determined by the program\
    \ requirements. C++ programmers generally prefer to use references wherever possible,\
    \ as they are easier to use and easier to understand than pointers. References\
    \ must, however, obey certain rules that can make the use of pointers necessary:\n\
    \n| Rule: | References: | Pointers: |\n| :--- | :--- | :--- |\n| Can be declared\
    \ without initialization | No | Yes |\n| Can be reassigned | No | Yes |\n| Can\
    \ contain a 0 (null) value | No | Yes |\n| Easiest to use | Yes | No |\n\nAs a\
    \ general rule, the choice between using a reference or a pointer can be determined\
    \ by following these guidelines:\n\n• If you don’t want to initialize in the declaration,\
    \ use a pointer;\n• or\nIf you want to be able to reassign another variable, use\
    \ a pointer;\n• otherwise\nAlways use a reference.\n\nPointers are more flexible\
    \ than references, however, and can even point to functions. In this case, the\
    \ pointer declaration must precisely match the return data type and arguments\
    \ to those of the function to which it points. Additionally, the pointer name\
    \ must be enclosed within parentheses in the declaration to avoid compiler errors.\
    \ The function pointer can then be assigned a function by name, so that function\
    \ can be called via the pointer.\n\n![image](images/forget.jpg)\n\nA reference\
    \ must be initialized in the declaration to refer to a variable or object – then\
    \ always refers to that item.\n\n![image](images/1bl.jpg)Start a new program by\
    \ specifying the C++ library classes to include, and a namespace prefix to use\n\
    \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](images/commonbb.jpg)\n\
    \npref.cpp\n\n![image](images/2bl.jpg)After the preprocessor instructions, define\
    \ an inline function to output the total of two arguments\n\n```cpp\ninline void\
    \ add ( int& a, int* b )\n{\n    cout << “Total: ” << a + b << endl ;\n}\n```\n\
    \n![image](images/3bl.jpg)Add a main function containing a final return statement\
    \ and declarations two integer variables, one reference, and two pointers\n\n\
    ```cpp\nint main()\n{\n    int num = 100 , sum = 500 ;\n    int& rNum = num ;\n\
    \    int* ptr = &num ;\n    // Add more statements here.\n    return 0 ;\n}\n\
    ```\n\n![image](images/4bl.jpg)In the main function, insert statements to output\
    \ the first variable via the reference and pointer\n\n```cpp\ncout << “Reference:\
    \ ” << rNum << endl ;\ncout << “Pointer: ” << *ptr << endl ;\n```\n\n![image](images/5bl.jpg)Now,\
    \ assign the second integer variable to the pointer and output its value via the\
    \ pointer, then call the function to output the sum of variable values\n\n```cpp\n\
    ptr = &sum ;\ncout << “Pointer now: ” << *ptr << endl ;\nadd( rNum , ptr ) ;\n\
    ```\n\n![image](images/6bl.jpg)Save, compile, and run the program to see the output\n\
    \n![image](images/pg113_1.jpg)\n\n![image](images/hot.jpg)\n\nC programmers tend\
    \ to put the `&` and `*` before the variable names, but in C++ it is usual to\
    \ put them after the data type – as the feature is a property of the data type,\
    \ not the name.\n\n### Summary\n\n![image](images/pg114_1.jpg)\n\n• Data is stored\
    \ in computer memory within sequentially numbered addresses.\n• Operands to the\
    \ left of `=` operator are L-values, and those to its right are R-values.\n• An\
    \ R-value may only appear to the right of `=` operator.\n• A pointer is a variable\
    \ that stores the memory address of another variable – that to which it points.\n\
    • The `*` character appears as an L-value in a pointer declaration, indicating\
    \ that the statement will create a pointer variable.\n• Once declared, the `*`\
    \ dereference operator can be used to reference the value within a variable to\
    \ which a pointer points.\n• Pointer arithmetic can be used to iterate through\
    \ the values stored in array elements.\n• A variable is passed to a function by\
    \ value, whereas pointers and references are passed by reference.\n• Passing by\
    \ reference allows the receiving function to directly manipulate variables declared\
    \ within the calling function.\n• A string value can be assigned to a pointer\
    \ of the `char` data type, and the whole string retrieved using the pointer name.\n\
    • Each element in a pointer array can store data or a pointer.\n• A reference\
    \ is not a variable, but merely an alias for a variable.\n• The `&` character\
    \ appears as an L-value in a reference declaration, indicating that the statement\
    \ will create an alias.\n"
