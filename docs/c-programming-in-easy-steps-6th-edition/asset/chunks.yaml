    (Wait, I should translate Preface 之后的内容 content)\n本书的创作为我——Mike McGrath 提供了一个更新我之前的\
    \ C++ 书籍的好机会。书中提供的所有示例都演示了当前 Windows 和 Linux 操作系统上的编译器支持的 C++ 特性，适用于 Microsoft\
    \ Studio 开发套。我衷心希望你们在发现 C++ 强大且富有表现力的可能性时，能像我编写这本书时一样享受其中。\n\n## 本书中的约定\n为了清晰每个示例中列出的代码，我采用了特定的色彩约定。C++\
    \ 语言本身的组件为蓝色，数值和字符串值为红色，程序员指定的名称为黑色，注释为绿色，如下所示：\n\n```cpp\n// 存储并输出文本字符串值。\nstring\
    \ myMessage = \"Hello from C++!\";\ncout << myMessage ;\n```\n\n此外，为了标识步骤中描述的每个源代码文件，步骤旁边会出现彩色图标和文件名：\n\
    \n![image](img/pg6_1.jpg)\n`main.cpp`\n\n![image](img/pg6_2.jpg)\n`header.h`\n\
    \n## 获取源代码\n为了方便起见，我将书中示例的源代码文件放置在一个 ZIP 压缩包中，提供了 Windows 和 Linux 平台版本以及 Microsoft\
    \ Studio IDE。你可以可以通过以下简单的步骤获取完整的压缩包：\n\n![image](img/1g1.jpg)\n访问 **[www.ineasysteps.com](http://www.ineasysteps.com)**，然后导航到免费资源\
    \ (Free Resources) 并选择下载 (Downloads) 部分。\n\n![image](img/2g1.jpg)\n在列表中找到 C++\
    \ Programming in easy steps, 6th edition，然后点击标题为 All Code Examples 的超链接下载压缩包。\n\
    \n![image](img/3g1.jpg)\n现在，将压缩包内容解压到你计算机上的任何方便的位置。\n[/content]\n\nWait, the prompt\
