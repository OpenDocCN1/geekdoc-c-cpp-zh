    Do not rely upon default precedence as it may vary between compilers – always
    use parentheses to clarify expressions.


    **Casting data types**


    ![image](images/pg40_1.jpg)


    Any data stored in a variable can be forced (coerced) into a variable of a different
    data type by a process known as “casting”. The cast statement simply states the
    data type to which the value should be cast in parentheses preceding the name
    of the variable containing the data to be cast. So casting syntax looks like this:


    ***variable-name* = ( *data-type* ) *variable-name* ;**


    This is the traditional form of casting that is also found in the C programming
    language. A newer alternative available in C++ uses angled brackets with the **static_cast**
    keyword, like this:


    ***variable-name* = static_cast < *data-type* > *variable-name* ;**


    The newer version allows casts to be more easily identified in source code by
    avoiding the use of parentheses, which can easily be confused with parentheses
    in expressions. The newer form of casting is preferred, but the older form is
    still widely found.


    Casting is often necessary to accurately store the result of an arithmetic operation,
    because dividing one integer by another integer will always produce an integer
    result. For example, the integer division **7/2** produces the truncated integer
    result of **3**.


    To store the accurate floating-point result would require the result be cast into
    a suitable data type, such as a **float**, like this:


    **float result = ( float ) 7 / 2 ;**


    Or alternatively using the newer form of cast:


    **float result = static_cast < float > 7 / 2 ;**


    ![image](images/forget.jpg)


    The result of dividing an integer by another integer is truncated, not rounded
    – so a result of 9.9 would become 9.


    In either case, it should be noted that operator precedence casts the first operand
    into the specified data type before implementing the arithmetic operation, so
    the statement can best be written as:


    **float result = static_cast < float > ( 7 ) / 2 ;**


    Bracketing the expression as **( 7 / 2 )** would perform the arithmetic first
    on integers, so the integer result would be truncated before being cast into the
    **float** variable – not the desired effect!


    Casting with both the older C-style form and the newer C++ form is demonstrated
    in the program [here](#chapter02.xhtml_namespa).


