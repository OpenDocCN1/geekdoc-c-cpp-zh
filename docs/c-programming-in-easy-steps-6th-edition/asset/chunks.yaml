    **centigrade = fToC( fahrenheit ) ;**


    ![image](images/8g.jpg)Now, output a message describing the result


    **cout << fahrenheit << “F is “ << centigrade << “C” ;**


    ![image](images/9g.jpg)Finally, add a statement to output a further message using
    the default argument value of the function prototype


    **cout << endl << “Freezing point: “ << fToC() << “C” ;**


    ![image](images/10g.jpg)Save, compile, and run the program, then enter a numeric
