  raw: '**( *test-expression* ) ? *if-true-return-this* : *if-false-return-this* ;**


    Although the ternary operator can initially appear a little confusing, it is well
    worth becoming familiar with this operator as it can execute powerful program
    branching with minimal code. For example, to branch when a variable is not a value
    of 1:


    **( var != 1 ) ? *if-true-do-this* : *if-false-do-this* ;**


    The ternary operator is commonly used in C++ programming to assign the maximum
    or minimum value of two variables to a third variable. For example, to assign
    a minimum like this:


    **c = ( a < b ) ? a : b ;**


    The expression in parentheses returns **true** when the value of variable **a**
    is less than that of variable **b** – so in this case, the lesser value of variable
    **a** gets assigned to variable **c**.


    Similarly, replacing the **<** less than operator in the test expression with
    the **>** greater than operator would assign the greater value of variable **b**
    to variable **c**.


    Another common use of the ternary operator incorporates the **%** modulus operator
    in the test expression to determine whether the value of a variable is an odd
    number or an even number:


    **( var % 2 != 0 ) ? *if-true(odd)-do-this* : *if-false(even)-do-this* ;**


    ![image](images/forget.jpg)


    The ternary operator has three operands – the one before the **?**, and those
    before and after the **:**.


    Where the result of dividing the variable value by two does leave a remainder,
    the number is odd – where there is no remainder, the number is even. The test
    expression **( var % 2 == 1 )** would have the same effect but it is preferable
    to test for inequality – it’s easier to spot when something is different than
    when it’s identical.


    The ternary operator is demonstrated in the program [here](#chapter02.xhtml_tar).


    ![image](images/1r.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


