    ![image](images/1g.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commong.jpg)


    overload.cpp


    ![image](images/2g.jpg)Below the preprocessor instructions, declare a function
    prototype that returns a float value and has one argument


    **float computeArea ( float ) ;**


    ![image](images/3g.jpg)Now, declare two overloaded function prototypes – having
    different arguments to the first prototype


    **float computeArea ( float, float ) ;**


