  raw: 'Each function is declared early in the program code as a “prototype”, comprising
    a data type for the value it will return and the function name followed by parentheses,
    which may optionally contain a list of “argument” data types of passed values
    it may use. The syntax of a function prototype declaration looks like this:


    ***return-data-type function-name ( arguments-data-type-list ) ;***


    ![image](images/hot.jpg)


    Strictly speaking, the arguments in a function prototype are known as its “formal
    parameters”.


    For example, a function named “computeArea” that returns a **float** value and
    is passed two **float** arguments is declared as:


    **float computeArea( float, float ) ;**


    Defining functions


    The function’s definition appears later in the program code and comprises a repeat
    of the prototype, plus the actual function body. The function body is the statements
    to be executed whenever the function is called, contained within a pair of braces.


    ![image](images/forget.jpg)


    Use the **void** keyword if the function will return no value to the caller.


    It is important to recognize that the compiler checks the function definition
    against the prototype, so the actual returned data type must match that specified
    in the prototype, and any supplied arguments must match in both number and data
    type. Compilation fails if the definition does not match the prototype. A simple
    **computeArea** definition might look like this:


    **float computeArea( float width, float height )**


    **{**


    **return ( width * height ) ;**


    **}**


    Variable scope


    Variables that are declared in a function can only be used locally within that
    function, and are not accessible globally for use in other functions. This limitation
    is known as “variable scope”.


    ![image](images/1g.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commong.jpg)


    scope.cpp


    ![image](images/2g.jpg)Next, declare two simple function prototypes


    **float bodyTempC() ;**


    **float bodyTempF() ;**


    ![image](images/3g.jpg)Now, add a main function containing calls to each function
    and a final **return** statement


    **int main()**


    **{**


    **cout << “Centigrade: ” << bodyTempC() << endl ;**


    **cout << “Fahrenheit: ” << bodyTempF() << endl ;**


    **return 0 ;**


    **}**


    ![image](images/4g.jpg)After the main function, define both other functions –
    to each return the value of a local “temperature” variable


    **float bodyTempC()**


    **{**


    **float temperature = 37.0 ;**


    **return temperature ;**


    **}**


    **float bodyTempF()**


    **{**


    **float temperature = 98.6 ;**


    **return temperature ;**


    **}**


    ![image](images/5g.jpg)Save, compile, and run the program to see the output


    ![image](images/pg53_1.jpg)


    ![image](images/hot.jpg)


    Variables of the same name do not conflict when they are declared in a different
    scope – they are not visible to each other.


    **Passing arguments**


    Function calls frequently supply argument values to a function. These can be of
    any quantity and data type, but they must agree with those specified in the function
    prototype declaration.


    ![image](images/pg54_1.jpg)


    Note that arguments passed to a function only supply a copy of the original value,
    in a procedure known as “passing by value”.


    The values passed to arguments can be “static” values, specified in the program
    code, or “dynamic” values that are input by the user. At a command prompt, the
    C++ **cin** function can be used with the **>>** input stream operator to direct
    a value from standard input to a variable, like this:


    **float num ;**


    **cout << “Please enter a number: ” ;**


    **cin >> num ;**


    Input can then be passed to a function as an argument in a function call, such
    as **workWith( num )**.


    ![image](images/snake.jpg)


    Function prototypes must be declared before they can be defined. Typically, the
    prototypes appear before the main function, and their definitions appear after
    the main function.


    Optionally, a function prototype can assign default values to arguments, which
    will be used when a call does not pass an argument value. Multiple arguments can
    be assigned default values in the prototype but these must always appear at the
    end of the argument list, after any other arguments.


    In the same way that functions can be called from the main function, functions
    may call other functions and pass arguments.


    ![image](images/1g.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commong.jpg)


    args.cpp


    ![image](images/2g.jpg)Next, declare a function prototype that returns a float
    value and specifies a single float argument, to which a default value is assigned


    **float fToC ( float degreesF = 32.0 ) ;**


    ![image](images/3g.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/4g.jpg)After the main function, define the “fToC” function with
    statements that will return a converted value


    **float fToC( float degreesF )**


    **{**


    **float degreesC = ( ( 5.0 / 9.0 ) * ( degreesF - 32.0 ) ) ;**


    **return degreesC ;**


    **}**


    ![image](images/5g.jpg)In the main function, insert a statement to declare two
    **float** variables – to store an input Fahrenheit temperature value and its Centigrade
    equivalent


    **float fahrenheit, centigrade ;**


    ![image](images/6g.jpg)Insert statements to request that user input be stored
    in the first variable


    **cout << “Enter a Fahrenheit temperature:\t” ;**


    **cin >> fahrenheit ;**


    ![image](images/7g.jpg)Next, call the “fToC” function to convert the input value
