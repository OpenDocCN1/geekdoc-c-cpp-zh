    ```xml

    VerticalAlignment = ”Center”

    ```


    ![image](images/4g.jpg)Then, edit all six `<TextBlock>` elements alike, to specify
    their initial content, width, and margin on all four sides


    ```xmlText = ”...” Width = ”20” Margin = ”15”

    Text = ”...” Width = ”20” Margin = ”15”

    Text = ”...” Width = ”20” Margin = ”15”

    Text = ”...” Width = ”20” Margin = ”15”

    Text = ”...” Width = ”20” Margin = ”15”

    Text = ”...” Width = ”20” Margin = ”15”

    ```


    ![image](images/5g.jpg)Edit the first `<Button>` element to rename it, specify
    its button label content, and set its margin on all four sides


    ```xmlx:Name = “BtnPick” Content = “Get My Lucky Numbers”

    Margin = “15”

    ```


    ![image](images/6g.jpg)Edit the second `<Button>` element to rename it and specify
    its button label content


    ```xmlx:Name = “BtnReset” Content = “Reset”

    ```


    ![image](images/7g.jpg)Finally, add an attribute to each respective `<Button>`
    element to specify their default state


    ```xmlIsEnabled = “True”

    IsEnabled = “True”

    ```


    ![image](images/hot.jpg)


    A single `Margin` value sets all four margins around that component. You can specify
    two values to set left & right, top & bottom margins; e.g. `Margin = “10,30”`.
    Alternatively, you can specify four values to set left,top,right,bottom margins
    individually; e.g. `Margin = “10,30,10,50”`.


    The order in which the attributes appear in each element is unimportant, but the
    elements within the `MainPage.xaml` file should now look similar to the screenshot
    below:


    ![image](images/pg177_2.jpg)


    ![image](images/pg177_1.jpg)


    As you make changes to the `XAML` view code, the component layout gets changed
    accordingly in the `Design` view and should now look like this:


    ![image](images/pg177_3.jpg)


    ![image](images/hot.jpg)


    You can optionally add `Margin = “0”` attributes to explicitly require elements
    to have no margin width.


    ### Adding runtime function


    Having completed the application component layout with `XAML` elements [here](#chapter10.xhtml_rde),
    you are now ready to add functionality with C++ programming code:


    ![image](images/1g.jpg)In `Design` view, double-click on the `BtnPick` button


    ![image](images/commong.jpg)


    Universal


    ![image](images/2g.jpg)The `MainPage.xaml.cpp` code-behind page opens in the `Code
    Editor` at a generated `BtnPick_Click` event-handler


    ![image](images/3g.jpg)In the `BtnPick_Click` event-handler block, insert these
    statements to create a randomized array of integers between 1 and 59


    ```cpp

    int i , j , k , seq[ 60 ] ;

    srand( ( int ) time( 0 ) ) ;

    for ( i = 1 ; i < 60 ; i++ ) seq[ i ] = i ;

    for ( i = 1 ; i < 60 ; i++ )

    {

    j = ( ( int ) rand( ) % 59 ) + 1 ;

    k = seq[ i ] ; seq[ i ] = seq[ j ] ; seq[ j ] = k ;

    }

    // Statements to be inserted here (Steps 4-5).

    ```


    ![image](images/4g.jpg)Next, insert statements to assign six array element values
    to the `<TextBlock>` components


    ```cpp

    textBlock1->Text = seq[ 1 ].ToString( ) ;

    textBlock2->Text = seq[ 2 ].ToString( ) ;

    textBlock3->Text = seq[ 3 ].ToString( ) ;

    textBlock4->Text = seq[ 4 ].ToString( ) ;

    textBlock5->Text = seq[ 5 ].ToString( ) ;

    textBlock6->Text = seq[ 6 ].ToString( ) ;

    ```


    ![image](images/5g.jpg)Next, insert statements to set the `<Button>` states


    ```cpp

    BtnPick->IsEnabled = false ;

    BtnReset->IsEnabled = true ;

    ```


    ![image](images/6g.jpg)Return to `MainPage.xaml`, then in `Design` view, double-click
    on the `BtnReset` button


    ![image](images/7g.jpg)The `MainPage.xaml.cpp` code-behind page opens in the `Code
    Editor` at a generated `BtnReset_Click` event-handler


    ![image](images/hot.jpg)


    The `srand()` function seeds a random number generator with the current system
    time, so subsequent calls to the `rand()` function return different pseudo-random
    numbers.


    ![image](images/forget.jpg)


    There is no `Label` component in UWP apps; it is called a `TextBlock` instead.


    ![image](images/snake.jpg)


    There is no `Enabled` property in UWP apps; it is called `IsEnabled` instead.


    ![image](images/8g.jpg)In the `BtnReset_Click` event-handler block, insert statements
    to assign strings to the `<TextBlock>` components


    ```cpp

    textBlock1->Text = “...” ;

    textBlock2->Text = “...” ;

    textBlock3->Text = “...” ;

    textBlock4->Text = “...” ;

    textBlock5->Text = “...” ;

    textBlock6->Text = “...” ;

    // Statements to be inserted here (Step 9).

    ```


    ![image](images/pg179_1.jpg)


    ![image](images/9g.jpg)Finally, insert statements to set the `<Button>` states


    ```cpp

    BtnPick->IsEnabled = true ;

    BtnReset->IsEnabled = false ;

    ```


    The `MainPage.xaml.cpp` code-behind page should now look like the screenshot below:


    ![image](images/pg179_2.jpg)


    ![image](images/10g.jpg)Return to the `MainPage.xaml` file, then in `XAML` view,
    see that attributes have been automatically added to the `<Button>` elements to
    call the event-handler code


    ![image](images/pg179_3.jpg)


    ![image](images/forget.jpg)


    The `BtnReset` button simply returns the `<TextBox>` and `<Button>` components
    to their original states.


    ![image](images/hot.jpg)


    Notice that the first `for` loop contains only one statement to be executed on
    each iteration, so braces are not required.


    ### Testing the program


    Having added functionality with C++ code [here](#chapter10.xhtml_sec86), you are
    now ready to test the program:


    ![image](images/1g.jpg)On the Visual Studio standard toolbar, select the `Debug`
    for `x64` architecture and `Local Machine` options, then click the `Start` button
    to run the app with debugging enabled


    ![image](images/pg180_1.jpg)


    ![image](images/commong.jpg)


    Universal


    ![image](images/2g.jpg)Wait while the application gets built and loaded, then
    click the buttons to try out their functionality


    ![image](images/pg180_2.jpg)


    ![image](images/pg180_3.jpg)


    ![image](images/pg180_4.jpg)


    ![image](images/forget.jpg)


    You must have your PC set to **Developer Mode** in **Settings**, **Privacy & security**,
    **For developers**.


    The app looks good – numbers are being randomized and the button states are changing
    as required.


    ![image](images/3g.jpg)Now, on the Visual Studio standard toolbar, select `Debug`,
    `Stop Debugging` to exit the running program


    ![image](images/pg180_5.jpg)


    ![image](images/4g.jpg)Click the `Start` button to restart the app, then click
    the buttons and compare the sequences of randomized numbers to those generated
    in the previous test


    ![image](images/pg181_2.jpg)


    ![image](images/pg181_3.jpg)


    ![image](images/pg181_4.jpg)


    ![image](images/pg181_1.jpg)


    ![image](images/hot.jpg)


    Test on the emulator with lowest memory and smallest screen and it should be fine
    running on those emulators with better features.


    Great – the random number generator is seeded using the current time to ensure
    a different sequence each time the app gets run.


    ![image](images/5g.jpg)Drag the window edge to reduce its width, to simulate how
    the app would look on a narrower display area


    ![image](images/pg181_5.jpg)


    This is unsatisfactory – adjustments will be needed to the interface layout so
    it will adapt to suit narrower display areas.


    ![image](images/snake.jpg)


    Do not click the X button on the emulator window to stop the running program,
