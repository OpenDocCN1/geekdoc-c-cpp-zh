    # 1


    ## Getting started


    Welcome to the exciting world of C++ programming. This chapter demonstrates how
    to create a simple C++ program and how to store data within a program.


    - [Introducing C++](#chapter01.xhtml_sec1)

    - [Installing a compiler](#chapter01.xhtml_sec2)

    - [Writing your first program](#chapter01.xhtml_sec3)

    - [Compiling & running programs](#chapter01.xhtml_sec4)

    - [Creating variables](#chapter01.xhtml_sec5)

    - [Employing variable arrays](#chapter01.xhtml_sec6)

    - [Employing vector arrays](#chapter01.xhtml_sec7)

    - [Declaring constants](#chapter01.xhtml_sec8)

    - [Summary](#chapter01.xhtml_sec9)


    ## Introducing C++


    C++ is an extension of the C programming language that was first implemented on
    the UNIX operating system by Dennis Ritchie way back in 1972. C is a flexible
    programming language that remains popular today, and is used on a large number
    of platforms for everything from microcontrollers to the most advanced scientific
    systems.


    ![image](images/pg8_1.jpg)


    A powerful programming language (pronounced “see plus plus”), designed to let
    you express ideas.


    C++ was developed by Dr. Bjarne Stroustrup between 1983 and 1985 while working
    at AT&T Bell Labs in New Jersey. He added features to the original C language
    to produce what he called “C with classes”. These classes define programming objects
    with specific features that transform the procedural nature of C into the object-oriented
    programming language of C++.


    The C programming language was so named as it succeeded an earlier programming
    language named “B” that had been introduced around 1970. The name “C++” displays
    some programmers’ humor because the programming `++` increment operator denotes
    that C++ is an extension of the C language.


    C++, like C, is not platform-dependent, so programs can be created on any operating
    system. Most illustrations in this book depict output on the Windows operating
    system purely because it is the most widely used desktop platform. The examples
    can also be created on other platforms such as Linux or macOS.


    ### Why learn C++ programming?


    The C++ language is favored by many professional programmers because it allows
    them to create fast, compact programs that are robust and portable.


    Using a modern C++ Integrated Development Environment (IDE), such as Microsoft’s
    Visual Studio Community Edition, the programmer can quickly create complex applications.
    But to use these tools to greatest effect, the programmer must first learn quite
    a bit about the C++ language itself.


    This book is an introduction to programming with C++, giving examples of program
    code and its output to demonstrate the basics of this powerful language.


    ![image](images/forget.jpg)


    Microsoft’s free Visual Studio Community Edition IDE is used in this book to demonstrate
    visual programming.


    ### Should I learn C first?


    Opinion is divided on the question of whether it is an advantage to be familiar
    with C programming before moving on to C++. It would seem logical to learn the
    original language first in order to understand the larger extended language more
    readily. However, C++ is not simply a larger version of C, as the approach to
    object-oriented programming with C++ is markedly different to the procedural nature
    of C. It is, therefore, arguably better to learn C++ without previous knowledge
    of C to avoid confusion.


    This book makes no assumption that the reader has previous knowledge of any programming
    language, so it is suitable for the beginner to programming in C++, whether they
    know C or not.


    If you do feel that you would benefit from learning to program in C before moving
    on to C++, we recommend you try the examples in [C Programming in easy steps](http://www.ineasysteps.com/)
    before reading this book.


    ### Standardization of C++


    As the C++ programming language gained in popularity, it was adopted by many programmers
    around the world as their programming language of choice. Some of these programmers
    began to add their own extensions to the language, so it became necessary to agree
    upon a precise version of C++ that could be commonly shared internationally by
    all programmers.


    A standard version of C++ was defined by a joint committee of the American National
    Standards Institute (ANSI) and the Industry Organization for Standardization (ISO).
    This version is sometimes known as ANSI C++, and is portable to any platform and
    to any development environment.


    The examples given in this book conform to ANSI C++. Example programs run in a
    console window, such as the Command Prompt window on Windows systems or a shell
    terminal window on Linux systems, to demonstrate the mechanics of the C++ language
    itself. An example in the final chapter illustrates how code generated automatically
    by a visual development tool on the Windows platform can, once you’re familiar
    with the C++ language, be edited to create a graphical, windowed application.


    ![image](images/hot.jpg)


    “ISO” is not an acronym but is derived from the Greek word “isos” meaning “equal”
    – as in “isometric”.


    ## Installing a compiler


    C++ programs are initially created as plain text files, saved with the file extension
    of `.cpp`. These can be written in any text editor, such as Windows’ Notepad application
    or the Vi editor on Linux.


    In order to execute a C++ program, it must first be “compiled” into byte code
    that can be understood by the computer. A C++ compiler reads the text version
    of the program and translates it into a second file – in machine-readable, executable
    format.


    Should the text program contain any syntax errors, these will be reported by the
    compiler and the executable file will not be built.


    If you are using the Windows platform and have a C++ Integrated Development Environment
    (IDE) installed, then you will already have a C++ compiler available, as the compiler
    is an integral part of the visual IDE. The excellent, free Microsoft C++ Express
    IDE provides an editor window, where the program code can be written, and buttons
    to compile and execute the program. Visual IDEs can, however, seem unwieldy when
    starting out with C++ because they always create a large number of “project” files
    that are used by advanced programs.


    The popular free GNU C++ Compiler is available free under the terms of the General
    Public License (GPL). It is included with most distributions of the Linux operating
    system. The GNU C++ Compiler is also available for Windows platforms and is used
    to compile examples throughout this book.


    To discover if you already have the GNU C++ Compiler on your system, type `c++
    -v` at a command prompt then hit `Return`. If it’s available, the compiler will
    respond with version information. If you are using the Linux platform and the
    GNU C++ Compiler is not available on your computer, install it from the distribution
    disc, download it from the GNU website, or ask your system administrator to install
    it.


    The GNU (pronounced “guh-new”) Project was launched back in 1984 to develop a
    complete free Unix-like operating system. Part of GNU is “Minimalist GNU for Windows”
    (MinGW). MinGW includes the GNU C++ Compiler that can be used on Windows systems
    to create executable C++ programs. Windows users can download and install the
    GNU C++ Compiler by following the instructions [here](#chapter01.xhtml_int).


    To open a Windows Command Prompt, press the `Windows` + `R` keys to launch a Run
    dialog, then type `cmd` into the dialog and hit `Enter`.

