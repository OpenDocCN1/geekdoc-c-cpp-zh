    \n- The first principle of Object Oriented Programming is the encapsulation of\
    \ data and functionality within a single class.\n- Access specifiers `public`,\
    \ `private`, and `protected` control the accessibility of class members from outside\
    \ the class.\n- A class declaration describes a data structure from which instance\
    \ objects can be created.\n- Public setter and getter class methods store and\
    \ retrieve data from private class variable members.\n- The scope resolution operator\
    \ `::` can explicitly identify a class.\n- Class members that have the same name\
    \ as a passed argument can be explicitly identified by the `this->` pointer.\n\
    - A constructor method is called when an object gets created, and a destructor\
    \ method is called when it gets destroyed.\n- Class variables can be initialized\
    \ by a constructor.\n- The second principle of Object Oriented Programming is\
    \ the virtue of inheritance that allows derived classes to inherit the properties\
    \ of their base class.\n- In a derived class declaration, the class name is followed\
    \ by colon, an access specifier, and its base class name.\n\n# 8 Harnessing polymorphism\n\
    \n***This chapter demonstrates how to separate programs into modular components\
