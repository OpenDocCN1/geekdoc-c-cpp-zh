    “add.h” and by inclusion in “triple.h”


    ![image](images/pg161_1.jpg)


    ![image](images/7r.jpg)Edit the header file “add.h” to enclose the inline function
    declaration within a preprocessor inclusion guard


    **#ifndef ADD_H**


    **#define ADD_H**


    **inline int add ( int x, int y ) { return ( x + y ) ; }**


    **#endif**


    ![image](images/8r.jpg)Save the modified file, then compile and run the program
    – compilation now succeeds because the inclusion guard prevents the apparent re-definition
    of the add function


    ![image](images/pg161_2.jpg)


    ![image](images/snake.jpg)


    Use the conventional naming scheme, where the macro name resembles the file name,
    to avoid conflicts.


    ![image](images/forget.jpg)


    All header files should contain header guards – add a **TRIPLE_H** macro to the
    **triple.h** file.


    **Using macro functions**


    The **#define** directive can be used to create macro functions that will be substituted
    in the source code before compilation.


    ![image](images/pg162_1.jpg)


    A preprocessor function declaration comprises a macro name, immediately followed
    by parentheses containing the function’s arguments – it is important not to leave
    any space between the name and the parentheses. The declaration is then followed
    by the function definition within another set of parentheses. For example, a preprocessor
    macro function to half an argument looks like this:


    **#define HALF( n ) ( n / 2)**


    Care should be taken when using macro functions, because unlike regular C++ functions,
    they do not perform any kind of type checking – so it’s quite easy to create a
    macro that causes errors. For this reason, inline functions are usually preferable
    to macro functions, but because macros directly substitute their code, they avoid
    the overhead of a function call – so the program runs faster. The resulting difference
    can be seen in the first temporary file created during the compilation process:


    ![image](images/1r.jpg)Start a new program by defining two macro functions to
    manipulate a single argument


    **#define SQUARE( n ) ( n * n )**


    **#define CUBE( n ) ( n * n * n )**


    ![image](images/commonr.jpg)


    macro.cpp


    ![image](images/2r.jpg)After the macro function definitions, specify the library
    classes to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/3r.jpg)Next, declare two inline functions to manipulate a single
    argument – just like the macro functions defined above


    **inline int square ( int n ) { return ( n * n ) ; }**


    **inline int cube ( int n ) { return ( n * n * n ) ; }**


    ![image](images/4r.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/5r.jpg)At the start of the main function block, declare and initialize
    an integer variable


    **int num = 5 ;**


    ![image](images/6r.jpg)Now, insert statements to call each macro function and
    each comparable inline function


    **cout << “Macro SQUARE: ” << SQUARE( num ) << endl ;**


    **cout << “Inline square: ” << square( num ) << endl ;**


    **cout << “Macro CUBE: ” << CUBE( num ) << endl ;**


    **cout << “Inline cube: ” << cube( num ) << endl ;**


    ![image](images/7r.jpg)Save the file, then compile the program, saving the temporary
    files and run the program


    **c++ macro.cpp -save-temps -o macro.exe**


    ![image](images/pg163_1.jpg)


    ![image](images/8r.jpg)Open the temporary “.ii” file in a plain text editor like
    Notepad, to see that the macro functions have been directly substituted in each
    output statement


    ![image](images/pg163_2.jpg)


    ![image](images/hot.jpg)


    Using uppercase for macro names ensures that macro functions will not conflict
    with regular lowercase function names.


    ![image](images/forget.jpg)


    An inline function saves the overhead of checking between a function prototype
    declaration and its definition.


    **Building strings**


    The preprocessor **#** operator is known as the “stringizing” operator, as it
    converts a series of characters passed as a macro argument into a string – adding
    double quotes to enclose the string.


    ![image](images/pg164_1.jpg)


    All whitespace before or after the series of characters passed as a macro argument
    to the stringizing operator is ignored, and multiple spaces between characters
    is reduced to just one space.


    The stringizing operator is useful to pass string values to a preprocessor **#define**
    directive without needing to surround each string with double quotes.


    A macro definition can combine two terms into a single term using the **##** merging
    operator. Where the combined term is a variable name, its value is not expanded
    by the macro – it simply allows the variable name to be substituted by the macro.


    ![image](images/1r.jpg)Start a new program by defining a macro to create a string
    from a series of characters passed as its argument, to substitute in an output
    statement


    **#define LINEOUT( str ) cout << #str << endl**


    ![image](images/commonr.jpg)


    strung.cpp


    ![image](images/2r.jpg)Define a second macro to combine two terms passed as its
    arguments into a variable name, to substitute in an output statement


    **#define GLUEOUT( a, b ) cout << a##b << endl**'
