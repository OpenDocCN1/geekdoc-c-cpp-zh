    \n```cpp\npublic :\n\nSon ( int a ) : Parent ( a )\n{ cout << endl << \"     \
    \ Derived Son class overloaded constructor called.\"; }\n```\n\n![image](img/9v.jpg)在\
    \ `Son` 类之后，添加一个包含最终 `return` 语句的 main 方法，并创建每个派生类的实例 – 调用基类和派生类的构造函数。\n\n```cpp\n\
    int main()\n{\n    Daughter emma ;\n    Son andrew(0) ;\n    return 0 ;\n}\n```\n\
    \n![image](img/10v.jpg)保存、编译并运行程序，以查看每个构造函数被顺序调用时的输出。\n\n![image](img/pg129_1.jpg)\n\
    \n![image](img/snake.jpg)\n\n注意重载的 `Son` 类构造函数中的语法将整数参数传递给重载的基类构造函数。\n\n![image](img/forget.jpg)\n\
    \n每个类自动拥有一个空的默认构造函数和析构函数 – 例如，`Son( ){ }` 和 `~Son( ){ }`。\n\n### 重写基类方法\n\n可以在派生类中声明一个方法来覆盖基类中匹配的方法\
    \ – 如果两个方法的声明具有相同的名称、参数和返回类型。这实际上有效地隐藏了基类方法，因为除非显式调用（使用 `::` 作用域解析符进行精确识别），否则它是无法访问的。\n\
    \n![image](img/pg130_1.jpg)\n\n然而，重写基类方法的方法必须谨慎，以避免无意中隐藏重载方法 – 派生类中的单个重写方法将隐藏基类中所有同名的重载方法！\n\
    \n![image](img/1v.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始新程序。\n\n```cpp\n#include <string>\n\
    #include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonv.jpg)\n\
    \noverride.cpp\n\n![image](img/2v.jpg)声明一个名为 “Man”的类，它将作为一个基类。\n\n```cpp\nclass\
    \ Man\n{\n    // 类成员在这里。\n} ;\n```\n\n![image](img/3v.jpg)在 `Man` 类声明的大括号之间，插入一个公共访问修符和一个内联输出方法。\n\
    \n```cpp\npublic :\nvoid speak() { cout << \"Hello! \" << endl ; }\n```\n\n![image](img/4v.jpg)现在，插入一个重载的内联输出方法。\n\
    \n```cpp\nvoid speak( string msg )\n{ cout << \" \" << msg << endl ; }\n```\n\n\
    ![image](img/5v.jpg)在 `Man` 类声明之后，声明一个派自 `Man` 类的名为 “Hombre”的类。\n\n```cpp\nclass\
    \ Hombre : public Man\n{\n    // 类成员在这里。\n} ;\n```\n\n![image](img/forget.jpg)\n\
    \n派生类中的方法声明必须与基类中的匹配才能覆盖它 – 如果使用了 `const` 关键字。\n\n![image](img/6v.jpg)在 `Hombre`\
    \ 类声明的大括号之间，插入一个访问修符和一个重写重载基类方法的方法 – 不带制表符输出。\n\n```cpp\npublic :\nvoid speak(\
    \ string msg ) { cout << msg << endl ; }\n```\n\n![image](img/7v.jpg)在 `Hombre`\
    \ 类声明之后，添加一个包含最终 `return` 语句的 main 方法，并创建两个对象 – 基类的实例和派生类的实例。\n\n```cpp\nint main()\n\
    {\n    Man henry ;\n    Hombre enrique ;\n    // 在此处添加更多语句。\n    return 0 ;\n\
    }\n```\n\n![image](img/pg131_1.jpg)\n\n![image](img/8v.jpg)在 main 方法中，插入调用基类两个方法的语句。\n\
    \n```cpp\nhenry.speak() ;\nhenry.speak( \"It’s a beautiful evening.\" ) ;\n```\n\
    \n![image](img/9v.jpg)接下来，插入一条调用派生类中重写方法的语句 – 不带制表符的输出。\n\n```cpp\nenrique.speak(\
    \ \"Hola!\" ) ;\n```\n\n![image](img/10v.jpg)现在，插入一条显式调用基类中被重写方法的语句。\n\n```cpp\n\
    enrique.Man::speak( \"Es una tarde hermosa.\" ) ;\n```\n\n![image](img/11v.jpg)保存、编译并运行程序，查看重写方法和被重写方法的输出。\n\
    \n![image](img/pg131_2.jpg)\n\n![image](img/snake.jpg)\n\n在派生类中声明的重写方法隐藏了基类中的两个重载类。尝试调用\
    \ `enrique.speak()` – 编译器将报错说该调用没有匹配的方法。\n\n### 总结\n\n![image](img/pg132_1.jpg)\n\
    \n- 面向对象编程的第一原则是在单个类中对数据和功能进行封装。\n- 访问修符 `public`、`private` 和 `protected` 控制类成员从类外部的可访问性。\n\
    - 类声明描述了一个可以从其创建实例对象的数据结构。\n- 公共的 setter 和 getter 类方法从私有类变量成员中存储和检索数据。\n- 作用域解析符\
    \ `::` 可以显式识别一个类。\n- 与传递的参数同名的类成员可以显式识别。\n- 构造函数在对象创建时调用，析构函数在对象销毁时调用。\n- 面向对象编程的第二个原则是允许派生类继承基类的属性。\n\
    - 在派生类声明中，类名后面跟着冒号、修符。\n\n# 8 利用多态\n\n***本章将演示如何将程序拆分为模块组件，并引入多态 – C++ 的第三原则。***\n\
    \n- 指向类\n- 调用虚方法\n- 引导方法调用\n- 提供能力类\n- 抽象数据类型\n- 构建层次结构\n- 隔离类结构\n- 使用隔离类\n- 总结\n\
