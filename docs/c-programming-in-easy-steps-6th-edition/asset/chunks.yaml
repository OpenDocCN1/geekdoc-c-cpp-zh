    **Handling strings**


    ***This chapter demonstrates how to manipulate C++ text strings as a simpler,
    more powerful alternative to character arrays.***


    [Creating string variables](#chapter04.xhtml_sec28)


    [Getting string input](#chapter04.xhtml_sec29)


    [Solving the string problem](#chapter04.xhtml_sec30)


    [Discovering string features](#chapter04.xhtml_sec31)


    [Joining & comparing strings](#chapter04.xhtml_sec32)


    [Copying & swapping strings](#chapter04.xhtml_sec33)


    [Finding substrings](#chapter04.xhtml_sec34)


    [Replacing substrings](#chapter04.xhtml_sec35)


    [Summary](#chapter04.xhtml_sec36)


    **Creating string variables**


    Unlike the **char**, **int**, **float**, **double**, and **bool** data types,
    there is no native “string” data type in C++ – but its **<string>** library class
    provides a **string** object that emulates a string data type. To make this available
    to a program, the library must be added with an **#include <string>** directive
    at the start of the program.'
