    ASCII (pronounced “askee”) is the American Standard Code for out Information Interchange,
    which is the accepted standard for plain text. In ASCII, characters are represented
    numerically within the range 0-127\. Uppercase ‘A’ is 65, so that integer value
    gets cast into an **int** variable.


    **Summary**


    ![image](images/pg42_1.jpg)


    •Arithmetical operators can form expressions with two operands for addition **+**,
    subtraction **-**, multiplication *****, division **/**, or modulus **%**.


    •Increment **++** and decrement **--** operators modify a single operand by a
    value of 1.


    •The assignment **=** operator can be combined with an arithmetical operator to
    perform an arithmetical calculation, then assign its result.


    •Comparison operators can form expressions comparing two operands for equality
    **==**, inequality **!=**, greater **>**, lesser **<**, greater or equal **>=**,
    and lesser or equal **<=** values.


    •Logical **&&** and **||** operators form expressions evaluating two operands
    to return a Boolean value of true or false.


    •The logical **!** operator returns the inverse Boolean value of a single operand.


    •A ternary **?:** operator evaluates a given Boolean expression, then returns
    one of two operands depending on its result.'
