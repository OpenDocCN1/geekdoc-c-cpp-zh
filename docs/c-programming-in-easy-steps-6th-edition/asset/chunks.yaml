    ### Finding substrings


    A `string` value can be searched to see if it contains a “substring” using the
    `find()` function of `<string>`. Its parentheses should specify the substring
    to seek as its first argument, and the index number of which to start searching
    as its second argument.


    ![image](images/pg74_1.jpg)


    When a search successfully locates the substring, the `find()` function returns
    the index number of the first occurrence. When the search fails, `find()` returns
    a value of -1. There are several other functions in `<string>` that are related
    to the `find()` function. Two of these are the `find_first_of()` function and
    `find_first_not_of()` function. Instead of seeking the first occurrence of a complete
    `string`, as `find()` does, `find_first_of()` function seeks the first occurrence
    of any characters in a specified `string`. The `find_last_of()` and `find_last_not_of()`
