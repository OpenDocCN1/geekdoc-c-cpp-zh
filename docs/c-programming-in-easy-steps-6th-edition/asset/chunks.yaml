    **Doing arithmetic**


    ![image](images/pg26_1.jpg)


    The arithmetical operators commonly used in C++ programs are listed in the table
    below, together with the operation they perform:


    | **Operator:** | **Operation:** |


    | **+** | Addition |


    | **-** | Subtraction |


    | ***** | Multiplication |


    | **/** | Division |


    | **%** | Modulus |


    | **++** | Increment |


    | **--** | Decrement |


    The operators for addition, subtraction, multiplication, and division act as you
    would expect. Care must be taken, however, to bracket expressions where more than
    one operator is used to clarify the expression – operations within innermost parentheses
    are performed first:


    **a = b * c - d % e / f ; // This is unclear.**


    **a = ( b * c ) - ( ( d % e ) / f ) ; // This is clearer.**


    The **%** modulus operator will divide the first given number by the second given
    number and return the remainder of the operation. This is useful to determine
    if a number has an odd or even value.


    The **++** increment operator and **--** decrement operator alter the given number
    by 1 and return the resulting value. These are most commonly used to count iterations
    in a loop. Counting up, the **++** operator increases the value by 1, while counting
    down, the **--** decrement operator decreases the value by 1.


    ![image](images/hot.jpg)


    Values used with operators to form expressions are called “operands” – in the
    expression **2 + 3** the numerical values **2** and **3** are the operands.


    The increment and decrement operators can be placed before or after a value to
    different effect. If placed before the operand (prefix), its value is immediately
    changed; if placed after the operand (postfix), its value is noted first, then
    the value is changed.


    ![image](images/1r.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonr.jpg)


    arithmetic.cpp


    ![image](images/2r.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3r.jpg)In the main function, insert a statement to declare and
    initialize two integer variables


    **int a = 8 , b = 4 ;**


    ![image](images/4r.jpg)Next, insert statements to output the result of each basic
    arithmetic operation


    **cout << “Addition result: ” << ( a + b ) << endl ;**


    **cout << “Subtraction result: ” << ( a - b ) << endl ;**


    **cout << “Multiplication result: ” << ( a * b ) << endl ;**


    **cout << “Division result: ” << ( a / b ) << endl ;**


    **cout << “Modulus result: ” << ( a % b ) << endl ;**


    ![image](images/5r.jpg)Now, insert statements to output the result of both postfix
    and prefix increment operations


    **cout << “Postfix increment: ” << a++ << endl ;**


    **cout << “Postfix result: ” << a << endl ;**


    **cout << “Prefix increment: ” << ++b << endl ;**


    **cout << “Prefix result: ” << b << endl ;**


    ![image](images/6r.jpg)Save, compile, and run the program to see the output


    ![image](images/pg27_1.jpg)


    ![image](images/forget.jpg)


    A prefix operator changes the variable value immediately – a postfix operator
    changes the value subsequently.


    **Assigning values**


    ![image](images/pg28_1.jpg)


    The operators that are used in C++ programming to assign values are listed in
    the table below. All except the simple **=** assignment operator are a shorthand
    form of a longer expression so each equivalent is given for clarity:


    | **Operator:** | **Example:** | **Equivalent:** |


    | **=** | **a = b** | **a = b** |


    | **+=** | **a += b** | **a = ( a + b )** |


    | **-=** | **a -= b** | **a = ( a - b )** |


    | ***=** | **a *= b** | **a = ( a * b )** |


    | **/=** | **a /= b** | **a = ( a / b )** |


    | **%=** | **a %= b** | **a = ( a % b )** |


    In the example above, the variable named “a” is assigned the value that is contained
    in the variable named “b” – so *that* becomes the new value stored in the **a**
    variable.


    The **+=** operator is useful to add a value onto an existing value that is stored
    in the **a** variable.


    In the table example, the **+=** operator first adds the value contained in variable
    **a** to the value contained in variable **b**. It then assigns the result to
    become the new value stored in variable **a**.


    ![image](images/forget.jpg)


    It is important to regard the = operator to mean “assign” rather than “equals”
    to avoid confusion with the == equality operator.


    All the other operators work in the same way by making the arithmetical operation
    between the two values first, then assigning the result of that operation to the
    first variable – to become its new stored value.


    With the **%=** operator, the first operand **a** is divided by the second operand
    **b**, then the remainder of that operation is assigned to the **a** variable.


    Each assignment operation is demonstrated in the program [here](#chapter02.xhtml_rogra).


