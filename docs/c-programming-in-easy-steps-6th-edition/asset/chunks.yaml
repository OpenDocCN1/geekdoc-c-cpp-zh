- fmt: '

    The declaration of a filestream object for writing output begins with the `ofstream`
    keyword, then a chosen name for that particular filestream object followed by
    parentheses nominating the text file to write to. So, the declaration syntax looks
    like this:


    ```

    ofstream *object-name* ( *“file-name”* ) ;

    ```


    The argument nominating the text file may optionally contain the full file path,
    such as `“C:\data\log.txt”` or `“home/user/log.txt”`, otherwise the program will
    seek the file within the directory in which the program resides.


    Before writing output to a file, the program should always first test that the
    filestream object has actually been created. Typically, this is performed by an
    `if` statement that allows the program to write output only when the test is successful.


    If a nominated file already exists, it will by default be overwritten without
    warning. Otherwise, a new file will be created and written.


    ![image](images/snake.jpg)


    The nominated file name or path must be enclosed within double quotes, like a
    `string`.


    After writing output to a nominated file, the program should always call the associated
    filestream object’s `close()` function to close the output filestream.


    The program described opposite first builds a string for writing as output. This
    is written to a nominated file when the filestream object has been successfully
    created, then the filestream is closed.


    ![image](images/1o.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <fstream>  // Include filestream support.

    #include <string>

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/commono.jpg)


    write.cpp


    ![image](images/2o.jpg)Add a main function containing a final `return` statement
    and building a lengthy text string in a `string` variable


    ```cpp

    int main()

    {

    string poem = “\n\tI never saw a man who looked” ;

    poem.append( “\n\tWith such a wistful eye” ) ;

    poem.append( “\n\tUpon that little tent of blue” ) ;

    poem.append( “\n\tWhich prisoners call the sky” ) ;

    // Add more statements here.

    return 0 ;

    }

    ```


    ![image](images/3o.jpg)In the main function, create an output filestream object


    ```cpp

    ofstream writer( “poem.txt” ) ;

    ```


    ![image](images/4o.jpg)Insert statements to write the `string` to a file or exit,
    then save, compile, and run the program to see the result


    ```cpp

    if ( ! writer )

    {

    cout << “Error opening file for output” << endl ;

    return -1 ;  // Signal an error then exit the program.

    }

    writer << poem << endl ;  // Write output.

    writer.close() ;  // Close filestream.

    ```


    ![image](images/pg81_1.jpg)


    ![image](images/pg81_2.jpg)


    ![image](images/hot.jpg)


    String values can contain `\n` newline and `\t` tab escape sequences for formatting
    lines.


    ![image](images/forget.jpg)


    Notice how the newline and tab characters are preserved in the text file.


    ### Appending to a file


    ![image](images/pg82_1.jpg)


    When a filestream object is created, the parentheses following its chosen name
    can optionally contain additional arguments, specifying a range of file “modes”
    to control the behavior of that filestream object. These file modes are part of
    the `ios` namespace, so must be explicitly addressed using that prefix. Each file
    mode is listed in the table below, together with a behavior description:


    | Mode: | Behavior: |

    | :--- | :--- |

    | `ios::out` | Open a file to write output |

    | `ios::in` | Open a file to read input |

    | `ios::app` | Open a file to append output at the end of any existing content
    |

    | `ios::trunc` | Truncate the existing file (default behavior) |

    | `ios::ate` | Open a file without truncating and allow data to be written anywhere
    in the file |

    | `ios::binary` | Treat the file as binary format rather than text so the data
    may be stored in non-text format |


    Multiple modes may be specified if they are separated by a “|” pipe character.
    For example, the syntax of a statement to open a file for binary output looks
    like this:


    ```cpp

    ofstream *object-name* ( *“file-name” , ios::out|ios::binary ) ;

    ```


    ![image](images/forget.jpg)


    The preprocessor directive `using namespace std;` allows the `std` namespace prefix
    to be omitted – so `cout` refers to the `std::cout` function. The `ios` namespace
    exists within the `std` namespace – so the file modes can be explicitly addressed
    using both namespace prefixes – for example, `std::ios::out`.


    The default behavior when no modes are explicitly specified regards the file as
    a text file that will be truncated after writing.


    The most commonly specified mode is `ios::app`, which ensures existing content
    will be appended, rather than overwritten, when new output is written to the nominated
    file.


    The program described opposite appends data to the text file created in the previous
    example.


    ![image](images/1o.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <fstream>  // Include filestream support.

    #include <string>

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/commono.jpg)


    append.cpp


    ![image](images/2o.jpg)Add a main function containing a final `return` statement
    and building a text string in a `string` variable


    ```cpp

    int main()

    {

    string info = “\n\tThe Ballad of” ;

    info.append( “\n\t\tOscar Wilde 1898” ) ;

    // Add more statements here.

    return 0 ;

    }

    ```


    ![image](images/3o.jpg)In the main function, create an output filestream object
    – specifying a file mode that will append existing text


    ```cpp

    ofstream writer( “poem.txt” , ios::app ) ;

    ```


    ![image](images/4o.jpg)Insert statements to write the `string` to a file or exit,
    then save, compile, and run the program to see the result


    ```cpp

    if ( ! writer )

    {

    cout << “Error opening file for output” << endl ;

    return -1 ;  // Signal an error then exit the program.

    }

    writer << info << endl ;  // Append output.

    writer.close() ;  // Close filestream.

    ```


    ![image](images/pg81_1.jpg)


    ![image](images/pg81_2.jpg)


    ![image](images/hot.jpg)


    The file must allow the program suitable read and write permissions.


    ### Reading characters & lines


    The `ifstream` filestream object has a `get()` function that can be used in a
    loop to read a file and assign each character in turn to the `char` variable specified
    as its argument:


    ![image](images/1o.jpg)Start a new program by specifying the C library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <fstream>  // Include filestream support.

    #include <string>

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/commono.jpg)


    read.cpp


    ![image](images/2o.jpg)Add a main function containing a final `return` statement
    and two variable declarations – one variable to store a character and another
    to count loop iterations


    ```cpp

    int main()

    {

    char letter ;

    int i ;

    // Add more statements here.

    return 0 ;

    }

    ```


    ![image](images/3o.jpg)In the main function, create an input filestream object
    to read the text file from the previous example


    ```cpp

    ifstream reader( “poem.txt” ) ;

    ```


    ![image](images/4o.jpg)Insert statements to exit unless the filestream object
    exists


    ```cpp

    if ( ! reader )

    {

    cout << “Error opening input file” << endl ;

    return -1 ;  // Signal an error then exit the program.

    }

    ```


    ![image](images/5o.jpg)Next, insert a loop to read the text file, assigning each
    character in turn to the variable and outputting its value


    ```cpp

    else

    for ( i = 0 ; ! reader.eof() ; i++ )

    {

    reader.get( letter ) ;

    cout << letter ;

    }

    ```


    ![image](images/6o.jpg)Finally, insert statements to close the filestream and
    output the total number of loop iterations


    ```cpp

    reader.close() ;

    cout << “Iterations: ” << i << endl ;

    ```


    ![image](images/hot.jpg)


    Notice how the `ifstream eof()` function is used to check if the “end of file”
    has been reached.

