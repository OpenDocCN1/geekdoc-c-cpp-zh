    \ temperature ;\n}\n```\n\n![image](images/5g.jpg)Save, compile, and run the program\
    \ to see the output\n\n![image](images/pg53_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nVariables of the same name do not conflict when they are declared in a different\
    \ scope – they are not visible to each other.\n\n### Passing arguments\n\nFunction\
    \ calls frequently supply argument values to a function. These can be of any quantity\
    \ and data type, but they must agree with those specified in the function prototype\
    \ declaration.\n\n![image](images/pg54_1.jpg)\n\nNote that arguments passed to\
    \ a function only supply a copy of the original value, in a procedure known as\
    \ “passing by value”.\n\nThe values passed to arguments can be “static” values,\
    \ specified in the program code, or “dynamic” values that are input by the user.\
    \ At a command prompt, the C++ `cin` function can be used with the `>>` input\
    \ stream operator to direct a value from standard input to a variable, like this:\n\
    \n```cpp\nfloat num ;\ncout << “Please enter a number: ” ;\ncin >> num ;\n```\n\
    \nInput can then be passed to a function as an argument in a function call, such\
    \ as `workWith( num )`.\n\n![image](images/snake.jpg)\n\nFunction prototypes must\
    \ be declared before they can be defined. Typically, the prototypes appear before\
