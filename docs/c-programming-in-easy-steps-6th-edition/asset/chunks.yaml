  trans: "\n该程序循环运行，直到用户输入 0 并按下回车键——将“status”控制变量更改为 `false`，从而退出程序。\n\n## 总结\n\n\
    ![image](img/pg150_1.jpg)\n\n*   面向对象编程的三基石是封装、继承和多态。\n*   多态实体根据其语境具有不同的含义或目的。\n\
    * 基类指针可以用于调用其所绑定的派生类中继承的方法。\n* 基类指针还可以使用 `::` 作用域解析符显式地调用基类方法。\n* 虚基类方法旨在在派生类中被重写。\n\
    *   多态允许将同名方法的调用定向到相应的重写方法。\n*   能力类（Capability classes）通常不包含数据，仅声明了可以在派生类中重写的虚方法。\n\
    *   返回 `-1` 值的虚方法发出错误信号，表示它们不应被直接调用。\n* 抽象数据类型（ADT）代表一个概念，并且总是其他类的基类。\n*   使用赋值\
    \ `=0` 声明纯虚拟方法表示该类是一个 ADT。\n*   类可以从 ADT 派生——但你无法创建 ADT 的实例。\n* 一个 ADT 可以从另一个\
    \ ADT 派生，创建一个复杂的类层次结构。\n* 程序可以拆分为头文件、实现文件和客户端文件，以帮助移植性并简化代码维护。\n* 被 `#include`\
    \ 指令引用的头文件将在编译期间由编译器自动包含。\n\n9\n\n## 宏处理\n\n***本章演示了如何让 C++ 编译器在编译程序之前执行实用的任务。***\n\
    \n探索编译\n* 定义替换符\n* 定义条件\n* 提供备选方案\n* 保护包含\n* 使用宏函数\n* 构建字符串\n* 调试断言\n* 总结\n\n\
    ## 探索编译\n\n每当 C++ 编译器运行时，它首先调用其预处理器来寻找可能包含在源代码中的任何编译器指令。这些指令中的每一个都以 `#` 哈希字符开头，并将首先执行，以便在汇编和编译之前有效地修改源代码。\n\
    \n![image](img/pg152_1.jpg)\n\n编译器指令对预处理器所做的更改创建了通常不可见的临时文件。正是这些临时文件被用于创建二进制对象文件：\n\
    \n* 编译期间创建的第一个临时文件通过将编译器指令替换为实现这些指令的库代码来扩展原始源代码。该文本文件的命名与源文件相似，但扩展名为 `.ii`。\n\
    * 编译期间创建的第二个临时文件是将临时扩展 `.ii` 文件翻译成低级汇编语言指令。该文本文件的命名与源文件相似，但扩展名为 `.s`。\n* 编译期间创建的第三个临时文件是将临时汇编语言\
    \ `.s` 文件翻译成机器码。该二进制对象文件的命名与源文件相似，但扩展名为 `.o`。\n\n因此，编译过程利用预处理器来编译源代码，使用“汇编器”将其翻译成机器码，并使用“链接器”将一个或多个二进制对象转换为可执行程序。\n\
    \n你可以通过指示编译器使用 `-save-temps` 编译器选项来保存它们，从而查看临时文件。然后可以在纯文本编辑器中打开这两个临时文本文件。\n\n\
    最重要的是，你可以看到带有 `.ii` 扩展名的临时文件包含了来自任何已包含库的完整函数定义。例如，它将 `#include <iostream>` 指令替换为\
    \ `cin`、`cout`、`cerr` 函数以及用于将错误消息重定向到文件的 `clog` 函数的定义。`.ii` 文件的末显示定义的函数属于“std”命名空间——因此它们可以在没有\
    \ `std::` 前缀的情况下出现。\n\n![image](img/1r.jpg)创建一个名为“prog.cpp”的简单程序，该程序在执行时将输出一条消息\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std ;\n\nint main()\n{\n    cout\
    \ << “This is a simple test program” << endl ;\n    return 0 ;\n}\n```\n\n![image](img/commonr.jpg)\n\
    \nprog.cpp\n\n![image](img/2r.jpg)使用 `-save-temps` 选项发布命令保存临时文件，并使用 `-c` 选项将此程序的源文件编译为对象文件——不生成可执行文件\
    \ `c++ prog.cpp -save-temps -c`\n\n![image](img/3r.jpg)用记事本等纯文本编辑器打开 `.ii` 文件，然后滚动到文件末尾查看修改后的源代码——注意\
    \ `<iostream>` 库函数如何在 `std` 命名空间中定义\n\n![image](img/pg153_1.jpg)\n\n![image](img/4r.jpg)用纯文本编辑器打开\
    \ `.s` 文件查看低级汇编指令——注意消息字符串现在由特殊字符 `\\0` 终止\n\n![image](img/5r.jpg)使用 -save-temps\
    \ 选项发布命令保存临时文件 `c++ prog -o prog`\n\n![image](img/pg153_2.jpg)\n\n![image](img/hot.jpg)一个或多个对象文件可以创建可执行文件——如处所示](#chapter08.xhtml_70)。\n\
    \n## 定义替换\n\n正如预处理器为 `#include` 指令替换库代码一样，其他预处理器指令也可在汇编和编译之前替换文本或数值。\n\n![image](img/pg154_1.jpg)\n\
    \n#define 指令指定一个宏，其由标识符名称和字符串或数值组成，由预处理器替换源代码中的每个出现。\n\n与 #include 预处理器指令一样，define\
    \ 指令可以出现在源代码的开头。与常量相同，宏名称传统上使用大写，定义的字符串值应包含双引号内。对于表达式中的数值替换，宏名称应包含括号以确保正确的优先级。\n\
    \n![image](img/1r.jpg)通过声明三个 define 直接启动新程序\n\n```cpp\n#define BOOK “C++ Programming\
    \ in easy steps”\n#define NUM 200\n#define RULE “*******************************”\n\
    ```\n\n![image](img/commonr.jpg)\n\ndefine.cpp\n\n![image](img/2r.jpg)指定要包含的库类和命名空间\n\
    \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/3r.jpg)添加包含返回语句的三个输出替换值的\
    \ main 函数\n\n```cpp\nint main()\n{\n    cout << RULE << endl << BOOK << endl <<\
    \ RULE ;\n    cout << endl << “NUM is: ” << NUM << endl ;\n    cout << “Double\
    \ NUM: ” << ( NUM ) * 2 ) << endl ;\n    return 0 ;\n}\n```\n\n![image](img/4r.jpg)保存、编译并运行程序以查看输出\n\
    \n```bash\nc++ .o -o define\n```\n\n![image](img/5r.jpg)数值常量通常最好声明为 `const` 变量——因为由预处理器替换的值不受类型检查。\n\
    \n![image](img/6r.jpg)重新编译程序，保存临时文件 `c++ define.cpp -save-temps -o define.exe`\n\
    \n"
- fmt: "\n![image](images/pg155_1.jpg)\n\n![image](images/hot.jpg)\n\nLinux users\
    \ can employ escaped double quotes `\\””string”\\”` or plain single quotes `‘“string”’`\
    \ to enclose a quoted string in a command.\n\nSubstitutions can alternatively\
    \ be made from the command-line using a `-Dname` option to replace macros with\
    \ specified values. Note that string values within double-quotes must also be\
    \ enclosed in escaped quotes in the command – so the substitution will include\
    \ the double-quote characters.\n\n![image](images/7r.jpg)Delete, or comment-out,\
    \ the `define` directives for both the `BOOK` and `NUM` identifiers – then save\
    \ the program file to apply the changes.\n\n![image](images/8r.jpg)Recompile the\
    \ program, specifying substitute macro values, then run the program once more\
    \ `c++ -DNUM=50 -DBOOK=\\””Java in easy steps”\\”`.\n\n```bash\ndefine.cpp -o\
    \ define.exe\n```\n\n![image](images/pg155_2.jpg)\n\n![image](images/hot.jpg)\n\
    \nLinux users can employ escaped double quotes `\\””string”\\”` or plain single\
    \ quotes `‘”string”’` to enclose a quoted string in a command.\n\n![image](images/forget.jpg)\n\
    \nAttempting to compile a program in which an identifier has not been defined\
    \ will produce a “not declared in this scope” error.\n\n### Defining conditions\n\
    \nThe preprocessor can make intelligent insertions to program source code by using\
    \ macro functions to perform conditional tests. An `#ifdef` directive performs\
    \ the most common preprocessor function by testing to see if a specified macro\
    \ has been defined. When the macro has been defined, so the test returns true,\
    \ the preprocessor will insert all directives, or statements, on subsequent lines\
    \ up to a corresponding `#endif` directive.\n\n![image](images/pg156_1.jpg)\n\n\
    Conversely, an `#ifndef` directive tests to see if a specified macro has not been\
    \ defined. When that test returns true, it will insert all directives, or statements,\
    \ on subsequent lines up to a corresponding `#endif` directive.\n\nTo satisfy\
    \ either conditional test, it should be noted that a `#define` directive need\
    \ only specify the macro name to define the identifier – it need not specify a\
    \ value to substitute.\n\nAny previously defined macro can be removed later using\
    \ the `#undef` directive – so that subsequent `#ifdef` conditional tests fail.\
    \ The macro can then be redefined by a further `#define` directive:\n\n![image](images/1r.jpg)Start\
    \ a new program with a conditional test to insert a directive when a macro is\
    \ not already defined.\n\n```cpp\n#ifndef BOOK\n#define BOOK “C++ Programming\
    \ in easy steps”\n#endif\n```\n\n![image](images/commonr.jpg)\n\nifdef.cpp\n\n\
    ![image](images/2r.jpg)Specify the library classes to include, and the namespace\n\
    \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](images/3r.jpg)Add\
    \ a main function containing a final `return` statement.\n\n```cpp\nint main()\n\
    {\n    // Program code goes here.\n    return 0 ;\n}\n```\n\n![image](images/4r.jpg)In\
    \ the main function, add a conditional preprocessor test to insert an output statement\
    \ when the test succeeds.\n\n```cpp\n#ifdef BOOK\ncout << BOOK ;\n#endif\n```\n\
    \n![image](images/5r.jpg)Add another conditional preprocessor test to both define\
    \ a new macro and insert an output statement when the test succeeds.\n\n```cpp\n\
    #ifndef AUTHOR\n#define AUTHOR “Mike McGrath”\ncout << “ by ” << AUTHOR << endl\
    \ ;\n#endif\n```\n\n![image](images/6r.jpg)Next, add a conditional test to undefine\
    \ a macro if it has already been defined.\n\n```cpp\n#ifdef BOOK\n#undef BOOK\n\
    #endif\n```\n\n![image](images/7r.jpg)Now, add a conditional test to redefine\
    \ a macro if it is no longer defined, and to insert an output statement.\n\n```cpp\n\
    #ifndef BOOK\n#define BOOK “Linux in easy steps”\ncout << BOOK “ by “ << AUTHOR\
    \ << endl ;\n#endif\n```\n\n![image](images/8r.jpg)Save, compile, and run the\
    \ program to see the insertions.\n\n![image](images/pg157_1.jpg)\n\n![image](images/9r.jpg)Recompile\
    \ the program, this time defining the `BOOK` macro in the command, then run the\
    \ program again to see the specified value appear in the first line of output.\n\
    \n```bash\nc++ -DBOOK=\\”“Python in easy steps”\\” ifdef.cpp -o ifdef.exe\n```\n\
    \n![image](images/pg157_2.jpg)\n\n![image](images/snake.jpg)\n\nEach preprocessor\
    \ directive must appear on its own line – you cannot put multiple directives on\
    \ the same line.\n\n![image](images/forget.jpg)\n\nOn Windows systems, string\
    \ macro values specified in a command must be enclosed in escaped double quotes.\n\
    \n### Providing alternatives\n\nThe conditional test performed by `#ifdef` and\
    \ `#ifndef` can be extended to provide an alternative by adding an `#else` directive.\
    \ For example:\n\n```cpp\n#ifdef WEATHER\ncout << WEATHER ;\n#else\n#define WEATHER\
    \ “Sunny”\n#endif\n```\n\n![image](images/pg158_1.jpg)\n\nSimilarly, `#if`, `#else`,\
    \ and `#elif` macros can perform multiple conditional tests, much like the regular\
    \ C++ `if` and `else` keywords.\n\nThe predefined macros are platform-specific,\
    \ typically these have names beginning with a double underscore to avoid accidental\
    \ confusion with chosen names. To see a list of predefined macros, issue a command\
    \ calling the preprocessor directly with the `-dM` option on the empty file:\n\
    \n```bash\ncpp -dM empty.txt\n```\n\nScroll through the list to find `_WIN32`\
    \ on Windows or `__linux` on Linux. `_WIN32` macro has one underscore but the\
    \ `__linux` macro has two underscore characters.\n\n### Guarding inclusions\n\n\
    ![image](images/pg158_2.jpg)\n\n![image](images/pg158_3.jpg)\n\n![image](images/snake.jpg)\n\
    \nUse the `cpp` command (not the `c++` command) and ensure the `-dM` option is\
    \ capitalized correctly.\n\n```cpp\n#if defined __WIN32\n#define PLATFORM “Windows”\n\
    #elif defined __linux\n#define PLATFORM “Linux”\n#endif\n\n#include <iostream>\n\
    using namespace std ;\n\nint main()\n{\n    cout << PLATFORM << “ System” << endl\
    \ ;\n    return 0 ;\n}\n\nif ( PLATFORM == “Windows” )\n    cout << “Performing\
    \ Windows-only tasks...” << endl ;\nif ( PLATFORM == “Linux” )\n    cout << “Performing\
    \ Linux-only tasks...” << endl ;\n```\n```"
