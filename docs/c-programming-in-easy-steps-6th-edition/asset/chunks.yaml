    Additionally, pointers can be passed to functions as arguments – with a subtly
    different effect to passing variables as arguments:


    •When variables are passed to functions, their data is passed “by value” to a
    local variable inside the function – so that the function operates on a copy of
    the original value.


    •When pointers are passed to functions, their data is passed “by reference” –
    so that the function operates on the original value.


    The benefit of passing by reference allows functions to directly manipulate variable
    values declared within the calling function.


