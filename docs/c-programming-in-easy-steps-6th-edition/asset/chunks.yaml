  trans: "\n\n![image](img/pg62_1.jpg)\n\n与`<iostream>`类库一样，`<string>` 库是 `std` 命名空间的一部分，C++\
    \ 标准库类都使用了该命名空间。这意味着字符串对象可以被称为 `std::string`，或者在程序开头包含 `using namespace std;`\
    \ 指令时，更简单地简称为 `string`。\n\n一旦`<string>` 库可用，就可以像声明其他变量一样声明一个 `string` “变量”。在声明时，可以选择性使用\
    \ `=` 赋值运算符对变量进行初始化，也可以在程序的稍后部分进行初始化。\n\n此外，可以通过在变量名后的括号中包含一个文本字符串来初始化 `string`\
    \ 变量。\n\nC++ 中的文本字符串必须始终包含在双引号 “ ” 之内——单引号 ' ' 仅用于围绕 `char` 数据类型的字符值。\n\n与 C 语言程序员必须使用的\
    \ `char` 数组相比，C++ `string` 变量处理起来要容易得多，因为它会自动调整大小以容纳任何文本字符串的长度。在更底层的层级上，文本仍然存储为字符数组，但\
    \ `string` 变量允许你忽略这些细节。因此，可以使用 `=` 赋值运算符将字符数组赋值给 `string` 变量。\n\n需要记住，当将数值赋给 `string`\
    \ 变量时，它们不再是数值数据类型，因此不能对它们进行算术运算。例如，尝试用 `+` 加法运算符相加“7”和“6”的 `string` 值会产生拼接后的字符串“76”，而不是数值值\
    \ 13。在这种情况下，`+` 运算符识别出上下文不是算术运算，因此采用“字符串连接运算符”的外壳来合并两个字符串。同样，`+=` 运算符将一个 `string`\
    \ 追加到另一个 `string` 之后，这对于构建长文本字符串非常有用。\n\n在此处 描述的示例程序中，有几个 `string` 值被构建在一个长字符串中。\n\
    \n![image](img/1p.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <string>\
    \  // 字符串支持。\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonp.jpg)\n\
    \nstring.cpp\n\n![image](img/2p.jpg)添加一个包含四个 string 变量声明和一个最终返回语句的 main 函数\n\n\
    ```cpp\nint main()\n{\n    string text = “9” ;\n    string term( “9 “ ) ;\n  \
    \  string info = “Toys” ;\n    string color ;\n    // 在此处添加更多语句。\n    return 0\
    \ ;\n}\n```\n\n![image](img/3p.jpg)在 main 函数中，变量声明之后插入语句来声明并初始化字符数组，然后将其值赋予未初始化的\
    \ string 变量\n\n```cpp\nchar hue[4] = { ‘R’, ’e’, ’d’, ’\\0’ } ;\ncolor = hue ;\n\
    ```\n\n![image](img/4p.jpg)将较长的文本字符串赋值其中一个 string 变量\n\n```cpp\ninfo = “Balloons”\
    \ ;\n```\n\n![image](img/5p.jpg)通过组合第一个 string 变量中的所有 string 变量值来构建长字符串，然后输出组合后的字符串值\n\
    \n```cpp\ntext += ( term + color + info ) ;\ncout << endl << text << endl ;\n\
    ```\n\n![image](img/6p.jpg)保存、编译并运行程序查看输出\n\n![image](img/pg63_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n记得添加特殊的 `\\0` 字符来标记 char 数组中字符串的结束。\n\n### 获取字符串输入\n\nC++ `cin` 函数在第 3 章中引入用于输入数值，它也可以将文本输入赋值给\
    \ `string` 变量。这有一个局限性，因为它每次只能用于输入一个单词——`cin` 函数在遇到空格时会停止读取，将任何其他文本留留在“输入缓冲区”中。\n\
    \n![image](img/pg64_1.jpg)\n\n当你想要允许用户输入带有空格的字符串（例如句子）时，可以使用 `getline()` 函数。该函数需要两个参数来指定字符串的源和目的。例如，当\
    \ `cin` 函数是源而名为“str”的 string 变量是目的时：\n\n```cpp\ngetline( cin , str ) ;\n```\n\n\
    `getline()` 函数从输入“流”中读取，直到遇到行尾的 `\\n` 换行符——该换行符是在按下 **Return** 键时产生的。\n\n混合使用\
    \ `cin` 和 `getline()` 函数时必须小心，因为 `getline()` 函数会自动读取输入缓冲区中留下的任何内容——给人一种程序跳过了指令的印象。可以使用\
    \ `cin.ignore()` 函数通过忽略输入缓冲区中留的内容来解决这个问题。\n\n![image](img/1p.jpg)通过指定要包含的 C++\
    \ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <string>  // 字符串支持。\n#include <iostream>\n\
    using namespace std ;\n```\n\n![image](img/commonp.jpg)\n\ninput.cpp\n\n![image](img/2p.jpg)添加一个包含一个\
    \ string 声明和一个最终返回语句的 main 函数\n\n```cpp\nint main()\n{\n    string name ;\n  \
    \  // 在此处添加更多语句。\n    return 0 ;\n}\n```\n\n![image](img/3p.jpg)在 main 函数中，插入语句将用户输入赋值给\
    \ string 变量，然后输出其值\n\n```cpp\ncout << “Please enter your name: ” ;\ncin >> name\
    \ ;\ncout << “Welcome “ << name << endl ;\n```\n\n![image](img/4p.jpg)接下来，插入语句再次请求名称，但这次使用\
    \ getline 函数将输入赋值给 string 变量之前输出其值\n\n```cpp\ncout << “Please re-enter your full\
    \ name: ” ;\ngetline( cin , name ) ;\ncout << “Thanks, “ << name << endl ;\n```\n\
    \n![image](img/5p.jpg)保存、编译并运行程序，并在提示时输入全名\n\n![image](img/pg65_1.jpg)\n\n这个不理想的结果显示\
    \ `cin` 读取到空格为止，将第二个名字留在缓冲区中，然后由 `getline()` 读取。即使你只输入了名字，问题仍然存在，因为 `cin` 将你按下\
    \ **Return** 键时产生的换行符留在了输入缓冲区中。\n\n![image](img/6p.jpg)通过在调用 getline 函数之前插入语句修改程序以解决此问题，指令其忽略输入缓冲区中的内容\n\
    \n```cpp\ncin.ignore( 256, ‘\\n’ ) ;\n```\n\n![image](img/7p.jpg)再次保存、编译并运行程序，然后重新输入全名以查看程序按要求执行\n\
    \n![image](img/pg65_2.jpg)\n\n### 解决字符串问题\n\n当你需要将 string 变量转换为不同的数据类型（也许为了对这些值进行算术运算）时，string\
    \ 变量就会出现问题。由于 string 对象不是 C++ 的原生数据类型，无法通过强制类型转换将 string 变量值转换为 `int` 或任何常规数据类型。\n\
    \n![image](img/pg66_1.jpg)\n\n解决方案由 C++ `<sstream>` 库提供，它允许 `stringstream` 对象作为中间介，通过它可以将\
    \ `string` 值转换为数值数据类型，并将数值值转换为 `string` 数据类型。\n\n"
- fmt: '

    Values can be loaded into a `stringstream` object with the familiar output stream
    `<<` operator that is used with `cout` statements. Contents can then be extracted
    from a `stringstream` object with the `>>` input stream operator that is used
    with `cin` statements.


    In order to re-use a `stringstream` object, it must first be returned to its original
    state. This requires its contents to be set as an empty `string` and its status
    bit flags to be cleared.


    ![image](images/1p.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <string>  // Include string support.

    #include <sstream> // Include stringstream support.

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/commonp.jpg)


    convert.cpp


    ![image](images/2p.jpg)Add a main function containing a final `return` statement
    and declaring two initialized variables to be converted


    ```cpp

    int main()

    {

    string term = “100” ;

    int number = 100 ;

    // Add more statements here.

    return 0 ;

    }

    ```


    ![image](images/3p.jpg)In the main function, insert statements to declare an integer
    variable, `string` variable, and a `stringstream` object


    ```cpp

    int num ;  // To store a converted string.

    string text ;  // To store a converted integer.

    stringstream stream ;  // To perform conversions.

    ```


    ![image](images/4p.jpg)Next, use the stream output operator to load the initialized
    `string` value into the `stringstream` object


    ```cpp

    stream << term ;  // Load the string.

    ```


    ![image](images/5p.jpg)Use the stream input operator to extract content from the
    `stringstream` object into the uninitialized integer variable


    ```cpp

    stream >> num ;  // Extract the integer.

    ```


    ![image](images/6p.jpg)Perform arithmetic on the integer and output the result


    ```cpp

    num /= 4 ;

    cout << “Integer value: ” << num << endl ;

    ```


    ![image](images/7p.jpg)Reset the `stringstream` object ready for re-use


    ```cpp

    stream.str(“”) ;  // Empty the contents.

    stream.clear() ;  // Empty the bit flags.

    ```


    ![image](images/8p.jpg)Now, use the stream output operator to load the initialized
    integer value into the `stringstream` object


    ```cpp

    stream << number ;  // Load the integer.

    ```


    ![image](images/9p.jpg)Use the stream input operator to extract content from the
    `stringstream` object into the uninitialized `string` variable


    ```cpp

    stream >> text ;  // Extract the string.

    ```


    ![image](images/10p.jpg)Perform concatenation on the `string` and output the result


    ```cpp

    text += “ Per Cent” ;

    cout << “String value: ” << text << endl ;

    ```


    ![image](images/11p.jpg)Save, compile, and run the program to see the converted
    output values


    ![image](images/pg67_1.jpg)


    ![image](images/hot.jpg)


    Notice how the `stringstream` object’s `str()` function is used here to reset
    its contents to an empty string.


    ![image](images/forget.jpg)


    A non-empty `stringstream` object has bit flags indicating its status as good,
    bad, eof, or fail – these should be cleared before re-use by the `stringstream`
    object’s `clear()` function, as demonstrated here.


    ## Discovering string features


    The C++ `<string>` library provides a number of functions that make it easy to
    work with strings. To use them, simply add the function name after the `string`
    variable name and a dot. For example, with a `stringstream` variable named “msg”
    you can call upon the `size()` function, to return its character length, with
    `msg.size()`.


    ![image](images/pg68_1.jpg)


    A `string` variable can be emptied of all characters by assigning it an empty
    string with two double quotes without spacing – as `“”`, or alternatively by calling
    the `<string>` library’s `clear()` function.


    Unlike a `char` array, a `string` variable will dynamically enlarge to accommodate
    the number of characters assigned to it, and its current memory size can be revealed
    with the `<string>` library’s `capacity()` function. Once enlarged, the allocated
    memory size remains, even when a smaller `string` gets assigned to the variable.


    The `<string>` library’s `empty()` function returns a Boolean `true` (1) or `false`
