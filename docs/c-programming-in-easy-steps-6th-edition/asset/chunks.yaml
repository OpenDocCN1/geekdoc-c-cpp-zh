    **Finding substrings**


    A **string** value can be searched to see if it contains a specified “substring”
    using the **find()** function of the **<string>** library. Its parentheses should
    specify the substring to seek as its first argument, and the index number of the
    character at which to start searching as its second argument.


    ![image](images/pg74_1.jpg)


    When a search successfully locates the specified substring, the **find()** function
    returns the index number of the first occurrence of the substring’s first character
    within the searched string. When the search fails, **find()** returns a value
    of -1 to indicate failure.


    There are several other functions in the **<string>** library that are related
    to the **find()** function. Two of these are the **find_first_of()** function
    and the **find_first_not_of()** function. Instead of seeking the first occurrence
    of a complete **string**, as **find()** does, the **find_first_of()** function
    seeks the first occurrence of any of the characters in a specified **string**,
    and **find_first_not_of()** seeks the first occurrence of a character that is
    not in the specified **string**.


    The **find_last_of()** and **find_last_not_of()** functions work in a similar
    manner – but begin searching at the end of the **string** then move forward.


