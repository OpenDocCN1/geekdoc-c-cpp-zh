    [Handling errors](#chapter05.xhtml_sec44)


    [Summary](#chapter05.xhtml_sec45)


    **Writing a file**


    The ability to read and write files from a program provides a useful method of
    maintaining data on the computer’s hard disk. The format of the data may be specified
    as human-readable plain text format or machine-readable binary format.


    ![image](images/pg80_1.jpg)


    The standard C++ **<fstream>** library provides functions for working with files,
    which can be made available by adding an **#include <fstream>** directive at the
    start of the program.


    For each file that is to be opened, a filestream object must first be created.
    This will be either an “ofstream” (output filestream) object, for writing data
    to the file, or an “ifstream” (input filestream) object, for reading data from
    the file. The **ofstream** object is used like the **cout** function that writes
    to standard output, and the **ifstream** object works like the **cin** function
    that reads from standard input.'
