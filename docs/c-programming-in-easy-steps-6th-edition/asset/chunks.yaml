    - [Making abstract data types](#chapter08.xhtml_68)\n- [Building complex hierarchies](#chapter08.xhtml_69)\n\
    - [Isolating class structures](#chapter08.xhtml_70)\n- [Employing isolated classes](#chapter08.xhtml_71)\n\
    - [Summary](#chapter08.xhtml_72)\n\n## Pointing to classes\n\nThe three cornerstones\
    \ of Object Oriented Programming (OOP) are encapsulation, inheritance, and polymorphism.\
    \ Examples in Chapter 7(#chapter07.xhtml) have demonstrated how data can be encapsulated\
    \ within a C++ class, and how derived classes inherit the properties of their\
