    **Optimizing functions**


    Functions can call themselves recursively, to repeatedly execute the statements
    contained in their function body – much like a loop. As with loops, a recursive
    function must contain an incrementer and a conditional test to call itself again,
    or stop repeating when a condition is met. The syntax of a recursive function
    looks like this:


    ***return-data-type function-name* ( *argument-list* )**


    **{**


    ***statements-to-be-executed* ;**


    ***incrementer* ;**


    ***conditional-test-to-recall-or-exit* ;**


    **}**


    ![image](images/pg58_1.jpg)


    The incrementer will change the value of a passed argument – so subsequent calls
    will pass the adjusted value back to the function.


