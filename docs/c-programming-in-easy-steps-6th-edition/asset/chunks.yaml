    ## Joining & comparing strings


    When the `+` operator is used to concatenate strings in an assignment, the combined
    strings get stored in the `string` variable. But when it is used with the `cout`
    function, the strings are only combined in the output – the variable values are
    unchanged.


    ![image](images/pg70_1.jpg)


    The `<string>` library’s `append()` function can also be used to concatenate strings,
    specifying the `string` value to append as an argument within its parentheses.
    When this is used with the `cout` function, the strings are combined in the variable,
    then its value written as output – in this case, the variable value does change.


    String comparisons can be made, in the same way as numeric comparisons, with the
    `==` equality operator. This returns `true` (1) when both strings precisely match,
    otherwise it returns `false` (0).


    Alternatively, the `<string>` library’s `compare()` function can be used to compare
    a `string` value specified as its argument. Unlike the `==` equality comparison,
    the `compare()` function returns 0 when the strings are identical, by examining
    the `string` value’s combined ASCII code values. When the `string` argument totals
    more than the first string, it returns -1, otherwise it returns 1.

