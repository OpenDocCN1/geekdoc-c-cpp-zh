    ### Copying & swapping strings


    String values can be assigned to a `string` variable by the `=` assignment operator,
    or by the `<string>` library’s `assign()` function. This function specifies the
    `string` value to be copied to the variable as an argument within its parentheses.


    ![image](images/pg72_1.jpg)


    Optionally, the `assign()` function can copy just a part of the specified `string`
    value by stating the position of the starting character as a second argument,
    and the number of characters to copy as a third argument.


    The contents of a `string` variable can be exchanged for that of another `string`
    variable by the `<string>` library’s `swap()` function. In this case, the contents
    of the first variable receives those of the second variable, which in turn receives
    those of the first variable.


