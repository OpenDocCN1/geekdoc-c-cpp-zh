    ### Calling a virtual method


    A base class pointer that is bound to a specific derived class can be used to
    call derived class methods that have been inherited from the base class. Methods
    that are unique to the derived class must, however, be called via an instance
    object.


    ![image](images/pg136_1.jpg)


    A base class pointer that is bound to a specific derived class can also be used
    to explicitly call a method in the base class using the `::` scope resolution
    operator.


    Most usefully, an inherited method in a derived class can override that in the
    base class when the base method has been declared as a “virtual” method. This
    is just a regular method declaration in the base class preceded by the `virtual`
    keyword. The declaration of a virtual method indicates that the class will be
    used as a base class from which another class will be derived, which may contain
    a method to override the virtual base method.


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/commonb.jpg)virtual.cpp


    ![image](images/2b.jpg)Declare a base class named “Parent”, containing a regular
    method declaration and a virtual method declaration


    ```cpp

    class Parent

    {

    public :

    void Common() const

    { cout << “I am part of this family, “ ; }

    virtual void Identify() const

    { cout << “I am the parent” << endl ; }

    } ;

    ```


    ![image](images/3b.jpg)Declare a derived class named “Child”, containing a method
    to override the virtual base method


    ```cpp

    class Child : public Parent

    {

    public :

    void Identify() const

    { cout << “I am the child” << endl ; }

    } ;

    ```


    ![image](images/snake.jpg)Pointers to a base class cannot be used to call non-inherited
    methods in a derived class.


    ![image](images/4b.jpg)Declare a “Grandchild” class, derived from the “Child”
    class, containing a method to override the virtual base method and a regular method
    declaration


    ```cpp

    class Grandchild : public Child

    {

    public :

    void Identify() const

    { cout << “I am the grandchild” << endl ; }

    void Relate() const

    { cout << “Grandchild has parent and grandparent” ; }

    } ;

    ```


    ![image](images/pg137_1.jpg)Parent Child Grandchild


    ![image](images/5b.jpg)Declare a main method containing a final `return` statement
    and creating instances of each derived class, plus base class pointers binding
    those derived classes


    ```cpp

    int main()

    {

    Child son ;

    Grandchild grandson ;

    Parent* ptrChild = &son ;

    Parent* ptrGrandchild = &grandson ;

    // In the main method, insert calls to each method

    ptrChild -> Common() ; // Inherited

    ptrChild -> Identify() ; // Overriding

    ptrGrandchild -> Common() ; // Inherited

    ptrGrandchild -> Identify() ; // Overriding

    ptrChild -> Parent::Common() ; // Explicit

    ptrGrandchild -> Parent::Identify() ; // Explicit

    return 0 ;

    }

    ```

