    # 编写你的第一个程序


    按照以下步骤，完全按照列出的内容复制代码，创建一个简单的 C++ 程序，它将输出传统的第一个程序问候语：


    ![image](img/commonb.jpg)


    hello.cpp


    ![image](img/1b.jpg)打开一个纯文本编辑器，例如 Windows 记事本，然后输入这些“预处理器指令”：


    ```cpp

    #include <iostream>

    using namespace std ;

    ```


    ![image](img/2b.jpg)在预处理器指令下方几行，添加一个描述程序的“注释”


    ```cpp

    // A C++ Program to output a greeting.

    ```


    ![image](img/3b.jpg)在注释下方，添加一个“main 函数”声明以包含程序语句


    ```cpp

    int main()

    {

    }

    ```


    ![image](img/4b.jpg)在主函数的大括号（braces）之间，插入此输出“语句”：


    ```cpp

    cout << “Hello World!” << endl ;

    ```


    ![image](img/5b.jpg)接下来，在主函数中插入最后的“return”语句


    ```cpp

    return 0 ;

    ```


    ![image](img/6b.jpg)将程序保存到任何方便的位置命名为“hello.cpp” – 完整的程序看起来应该是这样：


    ![image](img/pg12_1.jpg)


    ![image](img/forget.jpg)


    本书中的注释均以绿色显示 – 以将它们与其他代码区分。


    ![image](img/snake.jpg)


    在输入主方法的最后一个闭合 `}` 大括号后，始终按 `Return` 以添加换行符 – 你的编译器可能坚持源文件应以换行符结束。


    可以单独检查此处所示的程序代码的各个部分，以更清楚地理解每个部分：


    *   **预处理器指令 (Preprocessor Directives)** – 这些在程序代码之前由编译器处理，因此必须始终出现在页面开头。在这里，`#include`
    指令编译器使用名为 `iostream` 的标准 C++ 输入输出库，在`< >` 尖括号之间指定库名。下一行是“使用指令”（using directive），允许使用指定命名空间中的函数而无需其命名名前缀。`iostream`
    库的函数位于 `std` 命名空间内 – 因此此 `using` 指令允许将 `std::cout` 和 `std::endl` 写为 `cout` 和 `endl`。

    *   **注释 (Comments)** – 这些应该让其他人更容易理解代码，以及自己在以后重新查看代码时。在 C++ 编程中，`//` 双斜杠之后单行上的所有内容都会被编译器忽略。

    *   **主函数 (Main function)** – 这是每个 C++ 程序的强制入口点。程序可以包含许多函数，但它们必须包含一个名为 `main`
    的函数，否则编译器将无法编译程序。可选情况下，函数名后的括号可以指定一个用逗号分隔的“参数”值列表，供该函数使用。执行后，函数必须向操作系统返回其在声明中指定的数据类型的值
    – 在本情况下，是一个 `int`（整数）值。

    *   **语句 (Statements)** – 这些是程序运行时将执行的动作。每个语句必须以分号终止，就像英语句子必须以句号结束一样。在这里，第一条语句调用
    `cout` 库函数来输出文本和一个 `endl` 换行符。这些通过 `<<` 输出流运算符定向到标准输出。注意文本必须包含在双引号内。最后的语句使用 `return`
    返回零值。C++ 编译器支持 `/*` 和 `*/` 之间的多行注释 – 但这些仅用于注释代码段。


    ![image](img/hot.jpg)


    注意代码使用空格和缩进（统称为空白字符）来提高可读性。C++ 编译器忽略所有空白。


    # 编译与运行程序


    本书的 C++ 源文件存储在为此目的创建的目录中。该目录命名为 `MyPrograms` – 其在 Windows 上的绝对地址为 `C:\MinGW`，在
    Linux 上为 /*user。你可以重建此目录来存储等待编译的程序：


    ![image](img/1b.jpg)将 `hello.cpp` 程序文件移动到 `MyPrograms` 目录


    ![image](img/2b.jpg)在命令提示符处，使用 `cd` 命令导航到 `MyPrograms` 目录


    ![image](img/3b.jpg)输入命令尝试编译程序：


    ```bash

    c++ hello.cpp

    ```


    当尝试成功时，编译器会在源文件旁边创建一个执行文件。默认情况下，执行文件在 Windows 上名为 a.exe，在 Linux 上名为 a。同一目录下编译不同的源文件将覆盖第一个执行文件。这显然是不理想的，因此在编译程序时应为执行文件指定自定义名称，使用编译命令中的
    `-o` 选项：


    ```bash

    c++ hello.cpp -o hello.exe

    ```


    ![image](img/pg14_1.jpg)


    ![image](img/pg15_1.jpg)


    ![image](img/forget.jpg)


    `c++` 命令是 GNU C++编译编译别名 – 也可以使用 `g++` 命令。你可以通过命令查看编译器版本号：


    ```bash

    c++ --version

    ```


    并通过以下命令显示所有选项：


    ```bash

    c++ --help

    ```


    在 Windows 上运行生成的执行程序文件，只需在 `MyPrograms` 目录的提示符处输入文件名 – 可选省略文件扩展。在 Linux 中，必须使用完整文件名，并加上
    `./` 点斜 – 因为在没有明确指示的情况下，Linux 不查找当前目录：


    ```bash

    ./hello

    ```


