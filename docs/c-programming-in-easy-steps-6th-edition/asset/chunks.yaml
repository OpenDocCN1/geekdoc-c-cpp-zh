- fmt: "\n`( *test-expression ) ? `if-true-return-this` : `if-false-return-this` ;`\n\
    \nAlthough the ternary operator can initially appear a little confusing, it is\
    \ well worth becoming familiar with this operator as it can execute powerful program\
    \ branching with minimal code. For example, to branch when a variable is not a\
    \ value of 1:\n\n`( var != 1 ) ? `if-true-do-this` : `if-false-do-this` ;`\n\n\
    The ternary operator is commonly used in C++ programming to assign the maximum\
    \ or minimum value of two variables to a third variable. For example, to assign\
    \ a minimum like this:\n\n`c = ( a < b ) ? a : b ;`\n\nThe expression in parentheses\
    \ returns `true` when the value of variable `a` is less than that of variable\
    \ `b` – so in this case, the lesser value of variable `a` gets assigned to variable\
    \ `c`.\n\nSimilarly, replacing the `<` less than operator in the test expression\
    \ with the `>` greater than operator would assign the greater value of variable\
    \ `b` to variable `c`.\n\nAnother common use of the ternary operator incorporates\
    \ the `%` modulus operator in the test expression to determine whether the value\
    \ of a variable is an odd number or an even number:\n\n`( var % 2 != 0 ) ? `if-true(odd)-do-this`\
    \ : `if-false(even)-do-this` ;`\n\n![image](images/forget.jpg)\n\nThe ternary\
    \ operator has three operands – the one before the `?`, and those before and after\
