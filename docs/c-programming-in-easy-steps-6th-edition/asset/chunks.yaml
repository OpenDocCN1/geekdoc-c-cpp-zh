    **Comparing pointers & references**


    Pointers and references can both be used to refer to variable values and to pass
    them to functions by reference rather than by value. Technically, passing by reference
    is more efficient than passing by value, so the use of pointers and references
    is to be encouraged.


    ![image](images/pg112_1.jpg)


    The decision whether to use a pointer or a reference is determined by the program
    requirements. C++ programmers generally prefer to use references wherever possible,
    as they are easier to use and easier to understand than pointers. References must,
    however, obey certain rules that can make the use of pointers necessary:


    | **Rule:** | **References:** | **Pointers:** |


    | Can be declared without initialization | No | Yes |


    | Can be reassigned  | No | Yes |


    | Can contain a 0 (null) value  | No  | Yes  |


    | Easiest to use | Yes | No |


    As a general rule, the choice between using a reference or a pointer can be determined
    by following these guidelines:


    •If you don’t want to initialize in the declaration, use a pointer;


    **or**


    •If you want to be able to reassign another variable, use a pointer;


    **otherwise**


    •Always use a reference.


    Pointers are more flexible than references, however, and can even point to functions.
    In this case, the pointer declaration must precisely match the return data type
    and arguments to those of the function to which it points. Additionally, the pointer
    name must be enclosed within parentheses in the declaration to avoid compiler
    errors. The function pointer can then be assigned a function by name, so that
    function can be called via the pointer.


    ![image](images/forget.jpg)


    A reference must be initialized in the declaration to refer to a variable or object
    – then always refers to that item.


    ![image](images/1bl.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonbb.jpg)


