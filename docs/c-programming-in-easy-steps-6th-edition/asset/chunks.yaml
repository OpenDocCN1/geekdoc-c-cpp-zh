    quotes **‘”string”’** to enclose a quoted string in a command.


    ![image](images/forget.jpg)


    Attempting to compile a program in which an identifier has not been defined will
    produce a “not declared in this scope” error.


    **Defining conditions**


    The preprocessor can make intelligent insertions to program source code by using
    macro functions to perform conditional tests. An **#ifdef** directive performs
    the most common preprocessor function by testing to see if a specified macro has
    been defined. When the macro has been defined, so the test returns true, the preprocessor
    will insert all directives, or statements, on subsequent lines up to a corresponding
    **#endif** directive.


    ![image](images/pg156_1.jpg)


    Conversely, an **#ifndef** directive tests to see if a specified macro has not
    been defined. When that test returns true, it will insert all directives, or statements,
    on subsequent lines up to a corresponding **#endif** directive.


    To satisfy either conditional test, it should be noted that a **#define** directive
    need only specify the macro name to define the identifier – it need not specify
    a value to substitute.


    Any previously defined macro can be removed later using the **#undef** directive
    – so that subsequent **#ifdef** conditional tests fail. The macro can then be
    redefined by a further **#define** directive:


    ![image](images/1r.jpg)Start a new program with a conditional test to insert a
    directive when a macro is not already defined


    **#ifndef BOOK**


    **#define BOOK “C++ Programming in easy steps”**


    **#endif**


    ![image](images/commonr.jpg)


    ifdef.cpp


    ![image](images/2r.jpg)Specify the library classes to include, and the namespace


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/3r.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/4r.jpg)In the main function, add a conditional preprocessor test
    to insert an output statement when the test succeeds


    **#ifdef BOOK**


    **cout << BOOK ;**


    **#endif**


    ![image](images/5r.jpg)Add another conditional preprocessor test to both define
    a new macro and insert an output statement when the test succeeds


    **#ifndef AUTHOR**


    **#define AUTHOR “Mike McGrath”**


    **cout << “ by ” << AUTHOR << endl ;**


    **#endif**


    ![image](images/6r.jpg)Next, add a conditional test to undefine a macro if it
    has already been defined


    **#ifdef BOOK**


    **#undef BOOK**


    **#endif**


    ![image](images/7r.jpg)Now, add a conditional test to redefine a macro if it is
    no longer defined, and to insert an output statement


    **#ifndef BOOK**


    **#define BOOK “Linux in easy steps”**


    **cout << BOOK “ by “ << AUTHOR << endl ;**


    **#endif**


    ![image](images/8r.jpg)Save, compile, and run the program to see the insertions


    ![image](images/pg157_1.jpg)


    ![image](images/9r.jpg)Recompile the program, this time defining the **BOOK**
    macro in the command, then run the program again to see the specified value appear
    in the first line of output


    **c++ -DBOOK=\”“Python in easy steps”\” ifdef.cpp -o ifdef.exe**


    ![image](images/pg157_2.jpg)


    ![image](images/snake.jpg)


    Each preprocessor directive must appear on its own line – you cannot put multiple
    directives on the same line.


    ![image](images/forget.jpg)


    On Windows systems, string macro values specified in a command must be enclosed
    in escaped double quotes.


    **Providing alternatives**


    The conditional test performed by **#ifdef** and **#ifndef** can be extended to
    provide an alternative by adding an **#else** directive. For example:


    **#ifdef WEATHER**


    **cout << WEATHER ;**


    **#else**


    **#define WEATHER “Sunny”**


    **#endif**


    ![image](images/pg158_1.jpg)


    Similarly, **#if**, **#else**, and **#elif** macros can perform multiple conditional
    tests, much like the regular C++ **if** and **else** keywords.


    For testing multiple definitions, the **#ifdef** macro can be expressed as **#if
    defined**, and further tests made by **#elif defined** macros.


    ![image](images/hot.jpg)


    The **#elif** macro simply combines **else** and **if** to offer an alternative
    test.


    While most macros are defined in the source file with a **#define** directive,
    or on the command line with the **-D** option, some macros are automatically predefined
    by the compiler. Typically, these have names beginning with a double underscore
    __ to avoid accidental confusion with chosen names. The compiler’s predefined
    macros are platform-specific, so a program can employ a multiple definition test
    to identify the host platform:


    ![image](images/1r.jpg)Launch a plain text editor and save a new file (without
    any content) as “empty.txt” in your program’s directory


    ![image](images/commonr.jpg)


    else.cpp


    ![image](images/2r.jpg)To see a list of the compiler’s predefined macros, issue
    a command calling the cpp preprocessor directly with a “-dM” option on the empty
    file


    **cpp -dM empty.txt**


    ![image](images/3r.jpg)Scroll through the list to find the “_WIN32” macro on Windows
    or the “__linux” macro on Linux systems


    ![image](images/pg158_2.jpg)


    ![image](images/pg158_3.jpg)


    ![image](images/snake.jpg)


    Use the **cpp** command to call the preprocessor directly (not the **c++** command)
    and ensure the **-dM** option is capitalized correctly.


    ![image](images/4r.jpg)Start a new program with a conditional test to seek the
    _WIN32 and __linux macros – to identify the platform


    **#if defined __WIN32**


    **#define PLATFORM “Windows”**


    **#elif defined __linux**


    **#define PLATFORM “Linux”**


    **#endif**


    ![image](images/5r.jpg)Specify the library classes to include, and the namespace


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/6r.jpg)Now, add a main function containing a final **return**
    statement and a statement to identify the host platform


    **int main()**


    **{**


    **cout << PLATFORM << “ System” << endl ;**


    **return 0 ;**


    **}**


    ![image](images/7r.jpg)In the main function, insert statements to execute for
    specific platforms


    **if ( PLATFORM == “Windows” )**


    **cout << “Performing Windows-only tasks...” << endl ;**


    **if ( PLATFORM == “Linux” )**


    **cout << “Performing Linux-only tasks...” << endl ;**


    ![image](images/8r.jpg)Save, compile, and run the program to see platform-specific
    output


    ![image](images/pg159_1.jpg)


    ![image](images/pg159_2.jpg)


    ![image](images/snake.jpg)


    The predefined **_WIN32** macro has one underscore but the **__linux** macro has
    two underscore characters.


    ![image](images/forget.jpg)


    The conditional test of predefined macros could be extended to seek those of other
    operating systems, and a final **#else** directive added to specify an “Unknown”
    default.


    **Guarding inclusions**'
