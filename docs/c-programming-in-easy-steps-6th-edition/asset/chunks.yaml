    **Deploying the application**


    Having tested the app [here](#chapter10.xhtml_img183), it can now be deployed
    onto your PC. This will register the app on your PC and add it to the **All apps**
    menu, so an icon image can usefully be added to the program files to identify
    the app:


    ![image](images/1g.jpg)Add a 400 x 400 pixel icon image into the project’s Assets
    folder on your PC


    ![image](images/commong.jpg)


    Universal


    ![image](images/2g.jpg)In **Solution Explorer**, right-click on the Assets folder
    and choose **Add, Existing Item** from the context menu and add the icon image


    ![image](images/3g.jpg)Next, double-click **Package.appxmanifest** and select
    the **Visual Assets** tab and **All Visual Assets** item


    ![image](images/pg184_1.jpg)


    ![image](images/4g.jpg)Add the icon image as the **Source**, and click the **Generate**
    button to produce variously-sized tiles and logo images


    ![image](images/5g.jpg)Change the build type to **Release**, then click **Build**,
    **Deploy Solution** to register the app on your PC and see it get added to your
    PC’s **All apps** menu


    ![image](images/pg184_2.jpg)


    ![image](images/pg184_3.jpg)


    An **App Package** can be created for deployment on other devices running Windows
    version 1809 or later:


    ![image](images/1g.jpg)Select **Release** on the toolbar


    ![image](images/pg185_2.jpg)


    ![image](images/pg185_1.jpg)


    ![image](images/2g.jpg)In **Solution Explorer**, right-click on the top-level
    **Universal** project folder, then choose **Publish, Create App Packages** from
    the context menu to launch a wizard


    ![image](images/3g.jpg)In the “Create App Packages” wizard, choose the **Sideloading**
    option, then click **Next**


    ![image](images/4g.jpg)Select a package signing certificate, then click **Next**


    ![image](images/5g.jpg)Choose a destination (e.g. a USB drive), version numbering,
    and architecture – then click **Create**


    ![image](images/pg185_3.jpg)


    The build creates a folder of several items, including an Application Package
    file (.msixbundle) and a Security Certificate (.cer) file.


    ![image](images/6g.jpg)Move the folder to another device, then right-click on
    the Security Certificate file and **Install** it in the Trusted Root Certification
    Authorities certificate store on that device


    ![image](images/7g.jpg)Finally, double-click the Application Package file to **Install**
    and **Launch** the app on that device


    ![image](images/pg185_4.jpg)


    ![image](images/pg185_5.jpg)


    **Summary**


    ![image](images/pg186_1.jpg)


    •The **Universal Windows Platform** (UWP) enables a single app to run on any modern
    Windows-based device.


    •The **eXtensible Application Markup Language** (XAML) is used to specify components
    and layout on UWP apps.


    •The **Universal Windows App Development Tools** are needed in order to develop
    UWP apps.


    •The **Blank App (Universal Windows)** template can be used to create a new UWP
    project.


    •Visual Studio provides a graphical **Design** view and a text code **XAML** view
    for the **MainPage.xaml** file.


    •Component elements can be placed within XAML **<StackPanel>** elements to arrange
    their orientation.


    •Image files can be added to the **Assets** folder and assigned to XAML **<Image>**
    elements for display on the interface.


    •Space can be added around a component by adding a **Margin** attribute and assigned
    value within its element tag.


    •Functional C++ programming code can be added to the **MainPage.xaml.cpp** code-behind
    page.


    •The **Developer Mode** setting must be enabled in the Windows settings in order
    to develop and test UWP apps.


    •A UWP app can be tested in **Debug** mode on the **Local Machine**.


    •The interface of a UWP app can adapt to different screen sizes by changing the
    orientation of **<StackPanel>** elements.


    •Image files can be added to the Assets folder for assignment as logos in the
    **Package.appxmanifest** window.


    •A **Release** version can be deployed on the Local Machine PC using the **Build,
    Deploy Solution menu**.


    •A **Release** version can be deployed on other modern Windows devices using the
    **Publish, Create App** Packages wizard.


    [![image](images/ibc.jpg)](http://www.ineasysteps.com)


    [![image](images/bcover.jpg)](http://www.ineasysteps.com)'
