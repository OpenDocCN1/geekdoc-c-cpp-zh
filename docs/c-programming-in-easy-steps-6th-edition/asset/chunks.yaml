    # 1


    ## 开始上手


    欢迎来到精彩的 C++ 编程世界。本章将演示如何创建一个简单的 C++ 程序，以及如何在程序中存储数据。


    - 介绍 C++

    - 安装编译器

    - 编写你的第一个程序

    - 编译并运行程序

    - 创建变量

    - 使用变量数组

    - 使用 vector 数组

    - 声明常量

    - 总结


    ## 介绍 C++


    C++ 是 C 编程语言的扩展，由 Dennis Ritchie 在 1972 年首次在 UNIX 操作系统上实现。C 是一种灵活的编程语言，至今仍然非常流行，并被用于从微控制器到最先进科学系统的各种平台。


    ![image](img/pg8_1.jpg)


    一种强大的编程语言（读音为“see plus plus”），设计用于让你表达思想。


    C++ 是由 Bjarne Stroustrup 博士在 1983 年至 1985 年间于新泽西州的 AT&T 贝尔实验室工作期间开发的。他在原始 C 语言的基础上添加了特性，产生了他所谓的“带有类的
    C”（C with classes）。这些类定义了具有特定特性的编程对象，将 C 的过程化本质转换为 C++ 的面向对象编程语言。


    C 编程语言之所以得此名，是因为它继承了在 1970 年左右引入的名为“B”的早期编程语言。“C++”这个名字体现了一些程序员的幽默感，因为编程中的 `++`
    增运算符表示 C++ 是 C 语言的扩展。


    C++ 像 C 一样，不依赖于平台，因此可以在任何操作系统上创建程序。书中的大多数插图描述的是 Windows 操作系统上的输出，纯粹是因为它是最常用的桌面平台。示例也可以在
    Linux 或 macOS 等其他平台上创建。


    ### 为什么要学习 C++ 编程？


    C++ 语言受到许多专业程序员的喜爱，因为它允许他们创建快速、紧凑且健壮可移植的程序。


    使用现代的 C++ 集成开发环境（IDE），例如微软的 Visual Studio Community 版，程序员可以快速创建复杂的应用程序。但为了充分发挥这些工具的作用，程序员必须首先学习大量的
    C++ 语言本身。


    本书是 C++ 编程的入门教程，提供了程序代码及其输出示例，以演示这种强大语言的基础知识。


    ![image](img/forget.jpg)


    微软免费的 Visual Studio Community 版 IDE 在书中用于演示可视化编程。


    ### 我应该先学 C 语言吗？


    对于在转向 C++ 之前熟悉 C 编程是否是一个优势，人们意见不一。先学习原始语言以便更轻松地理解更大的扩展语言似乎是合逻辑的。然而，C++ 并不仅仅是 C
    的大版本，因为 C++ 的面向对象编程方法与 C 的过程化本质有显著不同。因此，认为在没有 C 语言知识的情况下学习 C++ 更好，以避免混淆。


    本书并不假设读者具备任何编程语言的先前知识，因此适合 C++ 编程的初学者，无论他们是否知道 C 语言。


    如果你觉得在转向 C++ 之前学习 C 语言编程对你有所帮助，我们建议你在阅读本书之前尝试[易学 C 语言编程](http://www.ineasysteps.com/)中的示例。


    ### C++ 的标准化


    随着 C++ 编程语言普及性的提高，它被全球许多程序员作为首选编程语言。其中一些程序员开始向语言中添加自己的扩展，因此有必要约定一个精确的 C++ 版本，以便所有程序员在国际范围内共同共享。


    标准版本的 C++ 是由美国国家标准协会（ANSI）和国际标准化组织（ISO）的联合委员会定义的。这个版本有时被称为 ANSI C++，它可以移植到任何平台和任何开发环境。


    书中所给示例符合 ANSI C++。示例程序运行在控制台窗口中（例如 Windows 系统上的命令提示符窗口或 Linux 系统上的 shell 终端窗口），用以演示
    C++ 语言本身的机制。最后一章中的一个示例说明了在 Windows 平台上通过视觉化开发工具自动生成的代码，一旦你熟悉了 C++ 语言，就可以通过编辑来创建一个图形化的窗口应用程序。


    ![image](img/hot.jpg)


    “ISO”不是缩写词，而是源自希腊单词“isos”，意为“相等”——就像“等距”（isometric）。


    ## 安装编译器


    C++ 程序最初以纯文本文件创建，扩展名为 `.cpp`。这些文件可以在任何文本编辑器中编写，例如 Windows 的记事本应用程序或 Linux 上的 Vi
    编辑器。


    为了执行 C++ 程序，必须将其“编译”成计算机可以理解的字节码。C++ 编译器读取程序的文本版本并将其翻译成第二个文件——机器可读的、可执行格式。


    如果文本程序包含任何语法错误，编译器将报告这些错误且不会生成可执行文件。


    如果你使用 Windows 平台并安装了 C++ 集成开发环境（IDE），那么你已经可以使用 C++ 编译器，因为编译器是视觉 IDE 的不可缺的一部分。优秀的免费微软
    C++ IDE 在开始学习 C++ 时可能会显得笨重，因为它们总是创建许多高级程序使用的“项目”文件。


    流行的免费 GNU C++ 编译器根据通用公共许可证（GPL）免费提供。它包含在大多数 Linux 操作系统发行版中。GNU C++ 编译器也适用于 Windows
    平台，并用于编译书中的示例。


    要发现系统是否已安装 GNU C++ 编译器，请在命令提示符处输入 `c++ -v` 然后按回车。如果可用，编译器将返回版本信息。如果你使用 Linux 平台且计算机上没有
    GNU C++ 编译器，请从发行版磁盘安装、从 GNU 网站下载或要求系统管理员安装。


    GNU 项目（读音为“guh-new”）于 1984 年启动，旨在开发一个完全免费的类 Unix 操作系统。GNU 的一部分是“Windows 最小化 GNU”（MinGW）。MinGW
    包含了可以在 Windows 系统上创建可执行 C++ 程序的 GNU C++ 编译器。Windows 用户可以按照此处的说明下载并安装 GNU C++ 编译器。


    要打开 Windows 命令提示符，按下 `Windows + R` 启动运行对话框，然后在对话框中输入 `cmd` 并按回车。


