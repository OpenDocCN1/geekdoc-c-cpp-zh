    The merging operator is alternatively known as the “token-pasting” operator, as
    it pastes two “tokens” together.


    ### Debugging assertions


    It is sometimes helpful to use preprocessor directives to assist with debugging
    program code – by defining an `ASSERT` macro function to evaluate a specified
    condition for a Boolean value.


    ![image](images/pg166_1.jpg)


    The condition to be evaluated will be passed from the caller as the `ASSERT` function
    argument. The function can then execute appropriate statements according to the
    result of the evaluation. Multiple statements can be included in the macro function
    definition by adding a backslash `\` at the end of each line, allowing the definition
    to continue on the next line.


    Numerous statements calling the `ASSERT` function can be added to the program
    code to monitor a condition as the program proceeds. For example, to check the
    value of a variable as it changes.


    ![image](images/forget.jpg)


    You can comment-out sections of code when debugging using C-style `/* */` comment
    operators.


    Usefully, an `ASSERT` function can be controlled by a `DEBUG` macro. This allows
    debugging to be easily turned on and off simply by changing the value of the `DEBUG`
    control macro:


    ![image](images/1r.jpg)Start a new program by defining a DEBUG macro with an “on”
    value of 1 – to control an `ASSERT` function


    ```cpp

    #define DEBUG 1

    ```


    ![image](images/commonr.jpg)


    assert.cpp


    ![image](images/2r.jpg)Next, add a macro `if-elif` statement block to define the
    `ASSERT` function according to the control value


    ```cpp

    #if( DEBUG == 1 )

    // Definition for “on” goes here.

    #elif( DEBUG == 0 )

    // Definition for “off” goes here.

    #endif

    ```


    ![image](images/3r.jpg)In the top part of the `ASSERT` function statement block
    insert a definition for when the debugging control is set to “on” – to output
    failure details from predefined macros


    | `#define ASSERT( expr )` | `\` |

    | :--- | :--- |

    | `cout << #expr << “ ...” << num ;` | `\` |

    | `if ( expr != true )` | `\` |

    | `{` | `\` |

    | `cout << “ Fails in file: ” << __FILE__ ;` | `\` |

    | `cout << “ at line: ” << __LINE__ << endl ;` | `\` |

    | `}` | `\` |

    | `else cout << “ Succeeds” << endl ;` | |


    ![image](images/snake.jpg)


    Do not place a backslash continuation character on the last line of the definition,
    and remember to use the `#` stringizing operator to output the expression as a
    string.


    ![image](images/4r.jpg)In the bottom part of the `ASSERT` function statement block,
    insert a definition for when the debugging control is set to “off ” – to simply
    output the current variable value


    ```cpp

    #define ASSERT( result ) \

    cout << “Number is “ << num << endl ;

    ```


    ![image](images/5r.jpg)After the macro definitions, specify the library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/6r.jpg)Add a main function containing a final return statement


    ```cpp

    int main()

    {

    // Program code goes here.

    return 0 ;

    }

    ```


    ![image](images/7r.jpg)At the start of the main function block, declare and initialize
    an integer variable, then call the macro `ASSERT` function to check its value
    as it gets incremented


    | `int num = 9 ;` | `ASSERT( num < 10 ) ;` |

    | :--- | :--- |

    | `num++ ;` | |


    ![image](images/8r.jpg)Save, compile, and run the program to see the output


    ![image](images/pg167_1.jpg)


    ```cpp

    #define DEBUG 0

    ```


    ![image](images/pg167_2.jpg)


    ![image](images/forget.jpg)Predefined macro names are prefixed by a double underscore
    and suffixed by a double underscore.


    ![image](images/hot.jpg)Additionally, the current date and time can be output
    from `__DATE__` and `__TIME__` predefined macros.


    ### Summary


    ![image](images/pg42_1)


    - The C++ compiler’s `-save-temps` option saves the temporary files created during
    compilation.

    - Compilation first writes program code and included library code into a single
    `.ii` file, which is then translated into low-level Assembly language as `.s`
    file.

    - Assembly language `.s` files are translated to machine code as `.o` object files,
    which are used to create the executable program.

    - A `#define` directive defines a macro name and a value that the preprocessor
    should substitute for that name in program code.

    - The preprocessor can be made to perform conditional tests using `#ifdef`, `#ifndef`,
    and `#endif` directives, and a definition can be removed using `#undef`.

    - Each header file should use inclusion guards to prevent accidental multiple
    definition of the same class or function.

    - The macro name of an inclusion guard is an uppercase version of the file name,
    with the dot replaced by an underscore.

    - A `#define` directive may also define a macro function that will be substituted
    in program code in place of the macro name.

    - Inline functions are usually preferable to macro functions because, unlike macro
    functions, they perform type checking.

    - The preprocessor `#` stringizing operator converts a series of characters passed
    as a macro argument into a string value.

    - Two terms can be combined into a single term by the preprocessor `##` merging
    operator.

    - An `ASSERT` macro function is useful for debugging code, and may be controlled
    by a `DEBUG` macro to easily turn debugging on or off.

