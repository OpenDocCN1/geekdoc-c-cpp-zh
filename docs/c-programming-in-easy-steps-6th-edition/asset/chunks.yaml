    ## Passing pointers to functions


    Pointers can access the data stored in the variable to they point using the `*`
    dereference operator. This can also be used to change the stored data by assigning
    a new value of the appropriate data type.


    ![image](images/pg104_1)


    Additionally, pointers can be passed to functions as arguments – with a subtly
    different effect to passing variables:


    - When variables are passed to functions, their data is passed “by value” to a
    local variable inside the function – so that the function operates on a copy of
    the original value.

    - When pointers are passed to functions, their data is passed “by reference” –
    so that the function operates on the original value.


    The benefit of passing by reference allows functions to directly manipulate variables
    declared within the calling function.


    ![image](images/1bl.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/commonbb.jpg)


    fnptr.cpp


    ![image](images/2bl.jpg)After the preprocessor instructions, declare two function
    prototypes to each accept a single pointer argument


    ```cpp

    void writeOutput ( int* ) ;

    void computeTriple ( int* ) ;

    ```


    ![image](images/3bl.jpg)Add a main function containing a final `return` statement
    and declaring an initialized regular integer variable


    ```cpp

    int main()

    {

    int num = 5 ;

    // Add more statements here.

    return 0 ;

    }

    ```


    ![image](images/4bl.jpg)In the main function, insert a second variable declaration
    that initializes a pointer with the address of the regular integer variable


    ```cpp

    int* ptr = &num ;

    ```


    ![image](images/5bl.jpg)After the main function block, define a function to output
    the current value of a variable to which a pointer points


    ```cpp

    void writeOutput( int* value )

    {

    cout << “Current value: ” << *value << endl ;

    }

    ```


    ![image](images/6bl.jpg)Define another function to multiply the current value
    of a variable to which a pointer points


    ```cpp

    void computeTriple( int* value )

    {

    *value *= 3 ;  // Multiply and assign dereferenced value.

    }

    ```


    ![image](images/7bl.jpg)In the main function, pass a pointer argument to a function
    to output the variable value to which it points


    ```cpp

    writeOutput( ptr ) ;

    ```

