  trans: "\n\n![image](img/7o.jpg)保存、编译并运行程序，以在标准输出上显示文本文件内容和循环计数\n\n![image](img/pg85_2.jpg)\n\
    \n![image](img/pg85_1.jpg)\n\n这个程序运行得足够好，但循环必须多次迭代才能输出文本的内容。通过在循环的每次迭代中读取一行可以提高效率：\n\
    \n![image](img/8o.jpg)插入一个预处理器指令，使程序可以使用 C++ 字符串库\n\n```cpp\n#include <string>\n\
    ```\n\n![image](img/9o.jpg)将 `char` 变量声明替换为 `string` 变量声明\n\n```cpp\nstring line\
    \ ;\n```\n\n![image](img/10o.jpg)替换 `for` 循环中的两个语句以读取行，然后再次保存、编译并运行程序\n\n```cpp\n\
    getline( reader , line ) ;\ncout << line << endl ;\n```\n\n![image](img/pg85_3.jpg)\n\
    \n![image](img/forget.jpg)\n\n在每行输出后输出一个 `endl` – 因为 `getline()` 在遇到 `\\n` 换行符时停止读取。\n\
    \n### 使用 `getline` 格式化\n\n`getline()` 函数可以包含第三个参数，用于指定停止读取行的分隔符。这可以用于从数据文件的制表符列表中读取文本：\n\
    \n![image](img/1o.jpg)在纯文本编辑器中，创建一个包含 12 个数据项目的文本文件，每行四个项目，每个项目之间用制表符分隔\n\n![image](img/pg86_1.jpg)\n\
    \n![image](img/commono.jpg)\n\nformat.cpp\n\n![image](img/2o.jpg)通过指定要包含的 C++\
    \ 库类和使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <fstream>  // 包含文件流支持。\n#include <string>\n\
    #include <iostream>\nusing namespace std ;\n```\n\n![image](img/3o.jpg)添加一个包含最终\
    \ `return` 语句四个变量声明的 main 函数 – 一个固定数值、一个存储数据的 `string` 数组以及两个设置为 0 的计数器变量\n\n\
    ```cpp\nint main()\n{\n  const int RANGE = 12 ;\n  string tab[ RANGE ] ;\n  int\
    \ i = 0 , j = 0 ;\n  // Add more statements here.\n  return 0 ;\n}\n```\n\n![image](img/4o.jpg)插入一个语句创建一个输入文件流对象\n\
    \n```cpp\nifstream reader( “records.txt” ) ;\n```\n\n![image](img/5o.jpg)插入语句，除非文件流对象存在否则退出\n\
    \n```cpp\nif ( ! reader )\n{\n  cout << “Error opening input file” << endl ;\n\
    \  return -1 ;\n}\n```\n\n![image](img/forget.jpg)\n\n`string` 数组必须有足够的元素来存储每个数据项\
    \ – 它需要扩大以处理更多记录。\n\n![image](img/6o.jpg)接下来，插入一个循环，将每行读取到 `string` 数组中 – 每行的前三个项目读取到\
    \ `\\t` 制表符，第四个项目读取到 `\\n` 换行符\n\n```cpp\nwhile ( ! reader.eof() )\n{\n  if (\
    \ ( i + 1 ) % 4 == 0 )\n    getline( reader, tab[ i++ ], ‘\\n’ ) ;\n  else\n \
    \   getline( reader, tab[ i++ ], ‘\\t’ ) ;\n}\n```\n\n![image](img/pg87_1.jpg)\n\
    \n![image](img/7o.jpg)现在，关闭文件流并重置计数器\n\n```cpp\nreader.close() ;\ni = 0 ;\n```\n\
    \n![image](img/8o.jpg)插入第二个循环输出存储在每个数组元素中的数据，并用描述和换行进行格式化\n\n```cpp\nwhile ( i\
    \ < RANGE )\n{\n  cout << endl << “Record Number: ” << ++j << endl ;\n  cout <<\
    \ “Forename: ” << tab[ i++ ] << endl ;\n  cout << “Surname: ” << tab[ i++ ] <<\
    \ endl ;\n  cout << “Department: ” << tab[ i++ ] << endl ;\n  cout << “Telephone:\
    \ ” << tab[ i++ ] << endl ;\n}\n```\n\n![image](img/9o.jpg)保存、编译并运行程序，查看来自文本文件的格式化输出\n\
    \n![image](img/pg87_2.jpg)\n\n![image](img/hot.jpg)\n\n`if` 语句测试项目数（元素编号加 1）是否恰好被四整除，以决定读取到换行符或制表符为止。\n\
    \n![image](img/snake.jpg)\n\n记录计数器必须使用前置增符在输出之前增加变量值。\n\n### 操作输入与输出\n\n输入和输出流的行为可以通过带有\
    \ `cout` 和 `cin` 函数的“插入运算符”来修改。为它们的 `width()` 函数指定一个整数参数可以设置流的字符宽度。当内容未填充整个流宽度时，可以作为\
    \ `fill()` 函数的参数指定填充字符以指示空部分。同样，通过为它们的 `precision()` 函数指定一个整数可以更改浮点数默认的六位小数精度。使用插入运算符修改流的语句应放在使用\
    \ `<<` 或 `>>` 的语句之前。\n\n![image](img/pg88_1.jpg)<iostream>` 库提供了下表所示的“操纵符”，它们通过\
    \ `<<` 或 `>>` 运算符修改流。\n\n| 操纵符 | 显示 |\n| :--- | :--- |\n| `noboolalpha` | 布尔值为\
    \ 1 或 0 |\n| `boolalpha` | 布尔值为 “true” 或 “false” |\n| `dec`* | 整数为十进制 (decimal)\
    \ |\n| `hex` | 整数为十六进制 (hexadecimal) |\n| `oct` | 整数为八进制 (octal) |\n| `right`*\
    \ | 在输出宽度中右对齐 |\n| `left` | 在输出宽度中左对齐 |\n| `internal` | 在输出宽度中内部分对齐 |\n| `noshowbase`*\
    \ | 不显示进制前缀 |\n| `showbase` | 显示进制前缀 |\n| `noshowpoint`* | 仅当有分数时显示小数点 |\n| `showpoint`\
    \ | 所有浮点数显示小数点 |\n| `noshowpos`* | 正数前不显示正号 |\n| `showpos` | 正数前显示 + 号 |\n| `noskipws`*\
    \ | 输入时不跳过空白 |\n| `skipws` | 跳过空白输入 |\n| `fixed`* | 浮点数固定六位小数 |\n| `scientific`\
    \ | 浮点数使用科学计数法 |\n| `nouppercase`* | 科学计数法使用小写 e |\n| `uppercase` | 科学计数法使用大写\
    \ E |\n\n![image](img/forget.jpg)插入运算符仅修改一个对象 – 后续对象使用默认值，除非它们也被插入运算符修改。\n\n![image](img/hot.jpg)标记为\
    \ * 的操纵符是默认行为。\n\n![image](img/1o.jpg)通过指定要包含的 C++ 库类和使用的命名空间前缀开始一个新程序\n\n```cpp\n\
    #include <iostream>\nusing namespace std ;\n```\n\n![image](img/commono.jpg)\n\
    \nmanipulate.cpp\n\n![image](img/2o.jpg)添加一个包含最终 `return` 语句并声明两个初始化变量的 main 函数\n\
    \n```cpp\nint main()\n{\n  bool isTrue = 1 ;\n  int num = 255 ;\n  // Add more\
    \ statements here.\n  return 0 ;\n}\n```\n\n![image](img/3o.jpg)在 main 函数中，插入语句设置输出流的宽度和填充符，然后在其上输出一个字符串\n\
    \n```cpp\ncout.width( 40 ) ;\ncout.fill( ‘.’ ) ;\ncout << “Output” << endl ;\n\
    ```\n\n![image](img/4o.jpg)接下来，插入语句设置输出流的精度以停止对小数的截断 – 然后输出一个显示所有小数的浮点数\n\n```cpp\n\
    cout.precision( 11 ) ;\ncout << “Pi: ” << 3.1415926536 << endl ;\n```\n\n![image](img/5o.jpg)现在，插入使用操纵符以修改格式输出变量值的语句\n\
    \n```cpp\ncout << isTrue << “: ” << boolalpha << isTrue << endl ;\ncout << num\
    \ << “: ” << hex << showbase << uppercase << num << endl ;\n```\n\n![image](img/6o.jpg)保存、编译并运行程序查看输出\n\
    \n**预测问题**\n\n尽管程序员尽了努力，C++ 程序不幸可能包含以下三种类型的任或多个 Bug：\n\n"
- fmt: "\n- **Syntax errors** – the code contains incorrect use of the C++ language.\
    \ For example, an opening brace does not have a matching closing brace.\n- **Logic\
    \ errors** – the code is syntactically correct, but attempts to perform an operation\
    \ that is illegal. For example, the program may attempt to divide a number by\
    \ zero, causing an error.\n- **Exception errors** – the program runs as expected\
    \ until an exceptional condition is encountered that crashes the program. For\
    \ example, the program may request a number, which the user enters in word form\
    \ rather than in numeric form.\n\n![image](images/pg90_1.jpg)\n\nThe C++ standards\
    \ allow the compiler to spot “compile-time” errors involving syntax and logic,\
    \ but the possibility of exceptional errors is more difficult to locate as they\
    \ only occur at “run-time”. This means that the programmer must try to predict\
    \ problems that may arise and prepare to handle those exceptional errors.\n\n\
    The first step is to identify which part of the program code that may, under certain\
    \ conditions, cause an exception error. This can then be surrounded by a “try”\
    \ block, which uses the `try` keyword and encloses the suspect code within a pair\
    \ of braces.\n\n![image](images/hot.jpg)\n\nAlways consider that the user will\
    \ perform the unexpected – then ensure your programs can handle those actions.\n\
    \nWhen an exception error occurs, the `try` block then “throws” the exception\
    \ out to a “catch” block, which immediately follows the `try` block. This uses\
    \ the `catch` keyword and encloses statements to handle the exception error within\
    \ a pair of braces.\n\nThe program described [here](#chapter05.xhtml_osit) has\
    \ a `try` block containing a loop that increments an integer. When the integer\
    \ reaches 5, a `throw()` function manually throws an exception to the `catch`\
    \ block exception handler, passing the integer argument.\n\n![image](images/1o.jpg)Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n\n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n\
    ![image](images/commono.jpg)\n\ntry.cpp\n\n![image](images/2o.jpg)Add a main function\
    \ containing a final `return` statement and declaring an integer variable for\
    \ increment by a loop\n\n```cpp\nint main()\n{\n    int number ;\n    // Add more\
    \ statements here.\n    return 0 ;\n}\n```\n\n![image](images/3o.jpg)In the main\
    \ function, insert `try` and `catch` blocks to handle a “bad number” exception\n\
    \n```cpp\ntry\n{\n}\ncatch ( int num )\n{\n}\n```\n\n![image](images/4o.jpg)In\
    \ the `try` block, insert a loop to increment the variable\n\n```cpp\nfor ( number\
    \ = 1 ; number < 21 ; number++ )\n{\n    if (number > 4 ) throw ( number ) ;\n\
    \    else\n        cout << “Number: ” << number << endl ;\n}\n```\n\n![image](images/5o.jpg)In\
    \ the `catch` block, insert an exception handler statement\n\n```cpp\ncout <<\
    \ “Exception at: ” << num << endl ;\n```\n\n![image](images/6o.jpg)Save, compile,\
    \ and run the program to see the thrown exception get caught by the `catch` block\n\
    \n![image](images/pg91_1.jpg)\n\n![image](images/forget.jpg)\n\nWhen an exception\
    \ occurs, control passes to the `catch` block – in this example, the loop does\
    \ not complete.\n\n### Recognizing exceptions\n\nWhen a program exception occurs\
    \ within a `try` block, an “exception” object is automatically thrown. A reference\
    \ to the exception can be passed to the associated `catch` block in the parentheses\
    \ after the `catch` keyword. This specifies the argument to an `exception` type,\
    \ and a chosen exception name prefixed by the `&` reference operator – for example,\
    \ `exception &error`.\n\n![image](images/pg92_1.jpg)\n\nOnce an exception reference\
    \ is passed to a `catch` block, an error description can be retrieved by the exception’s\
    \ `what()` function:\n\n![image](images/1o.jpg)Start a new program by specifying\
    \ the C++ library classes to include, and a namespace prefix to use\n\n```cpp\n\
    #include <string>  // Include string support.\n#include <iostream>\nusing namespace\
    \ std ;\n```\n\n![image](images/commono.jpg)\n\nwhat.cpp\n\n![image](images/2o.jpg)Add\
    \ a main function containing a final `return` statement and declaring an initialized\
    \ `string` variable\n\n```cpp\nint main()\n{\n    string lang = “C++” ;\n    //\
    \ Add more statements here.\n    return 0 ;\n}\n```\n\n![image](images/3o.jpg)In\
    \ the main function, insert a `try` block containing a statement attempting to\
    \ erase part of the `string` variable\n\n```cpp\ntry { lang.erase( 4, 6 ) ; }\n\
    ```\n\n![image](images/4o.jpg)Next, insert a `catch` block containing a statement\
    \ to send a description to standard error output by the `cerr` function\n\n```cpp\n\
    catch ( exception &error )\n{ cerr << “Exception: ” << error.what() << endl ;\
    \ }\n```\n\n![image](images/5o.jpg)Save, compile, and run the program to see the\
    \ error description of the caught exception\n\n![image](images/pg91_1)\n\n![image](images/forget.jpg)\n\
    \nThe error description will vary for different compilers-`stdexcept` library\
    \ defines a number of exception classes. Its base class is named “exception”,\
    \ from which other classes are derived. `cout` sends data to standard output,\
    \ whereas `cerr` sends data to standard error. When the `stdexcept` library is\
    \ made available to a program, by adding `#include <stdexcept>`, the exception\
    \ classes can be used. Specific exception class name can appear, in place of the\
    \ general `exception` type, within the `catch` block. Multiple `catch` blocks\
    \ can be used in succession, much like `case` statements in a `switch` block,\
    \ to handle several types. Additionally, exceptions can be produced manually by\
    \ the `throw` keyword. This can be used to create any of the `logic_error` and\
    \ `runtime_error` exceptions. Optionally, a custom error message can be specified\
    \ for manual exceptions, which can be retrieved by its `what()` function.\n\n\
    ### Handling errors\n\nException type information can be provided by including\
    \ the C++ standard `<typeinfo>` library. Its `typeid()` function accepts an exception\
    \ argument so its `name()` function can return the type name:\n\n![image](images/1o.jpg)Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n\n```cpp\n#include <stdexcept> // Support standard exceptions.\n\
    #include <typeinfo>  // Support type information.\n#include <fstream>\n#include\
    \ <string>\n#include <iostream>\nusing namespace std ;\n```\n\n![image](images/commono.jpg)\n\
    \nexcept.cpp\n\n![image](images/2o.jpg)Add a main function containing a final\
    \ `return` statement, two initialized variable declarations, and a statement outputting\
    \ a text message\n\n```cpp\nint main()\n{\n    string lang = “C++” ;\n    int\
    \ num = 1000000000 ; // One billion.\n    // Try-catch block goes here.\n    cout\
    \ << “Program continues...” << endl ;\n    return 0 ;\n}\n```\n\n![image](images/3o.jpg)In\
    \ the main function, insert a `try` block containing a statement attempting to\
