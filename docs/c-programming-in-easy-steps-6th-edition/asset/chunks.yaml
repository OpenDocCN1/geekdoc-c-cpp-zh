    # Writing your first program


    Follow these steps, copying the code exactly as it is listed, to create a simple
    C++ program that will output the traditional first program greeting:


    ![image](images/commonb.jpg)


    hello.cpp


    ![image](images/1b.jpg)Open a plain text editor, such as Windows’ Notepad, then
    type these “preprocessor directives”:


    ```cpp

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/2b.jpg)A few lines below the preprocessor directives, add a “comment”
    describing the program


    ```cpp

    // A C++ Program to output a greeting.

    ```


    ![image](images/3b.jpg)Below the comment, add a “main function” declaration to
    contain the program statements


    ```cpp

    int main()

    {

    }

    ```


    ![image](images/4b.jpg)Between the curly brackets (braces) of the main function,
    insert this output “statement”:


    ```cpp

    cout << “Hello World!” << endl ;

    ```


    ![image](images/5b.jpg)Next, insert a final “return” statement in the main function


    ```cpp

    return 0 ;

    ```


    ![image](images/6b.jpg)Save the program to any convenient location as “hello.cpp”
    – the complete program should look like this:


    ![image](images/pg12_1.jpg)


    ![image](images/forget.jpg)


    Comments throughout this book are shown in green – to differentiate them from
    other code.


    ![image](images/snake.jpg)


    After typing the final closing `}` brace of the main method, always hit `Return`
    to add a newline character – your compiler may insist that a source file should
    end with a newline character.


    The separate parts of the program code shown [here](#chapter01.xhtml_sec3) can
    be examined individually to understand each part more clearly:


    *   **Preprocessor Directives** – these are processed by the compiler before the
    program code, so must always appear at the start of the page. Here, the `#include`
    directive instructs the compiler to use the standard C++ input/output library
    named `iostream`, specifying the library name between `< >` angled brackets. The
    next line is the “using directive” that allows functions in the specified namespace
    to be used without their namespace prefix. Functions of the `iostream` library
    are within the `std` namespace – so this `using` directive allows functions such
    as `std::cout` and `std::endl` to be simply written as `cout` and `endl`.

    *   **Comments** – these should be used to make the code more easily understood
    by others, and by yourself when revisiting the code later. In C++ programming,
    everything on a single line after a `//` double-slash is ignored by the compiler.

    *   **Main function** – this is the mandatory entry point of every C++ program.
    Programs may contain many functions, but they must always contain one named `main`,
    otherwise the compiler will not compile the program. Optionally, the parentheses
    after the function name may specify a comma-separated list of “argument” values
    to be used by that function. Following execution, the function must return a value
    to the operating system of the data type specified in its declaration – in this
    case, an `int` (integer) value.

    *   **Statements** – these are the actions that the program will execute when
    it runs. Each statement must be terminated by a semi-colon, in the same way that
    English language sentences must be terminated by a period (full stop). Here, the
    first statement calls upon the `cout` library function to output text and an `endl`
    carriage return. These are directed to standard output by the `<<` output stream
    operator. Notice that text strings in C++ must be enclosed within double quotes.
    The final statement uses `return` to return a zero value. The C++ compiler also
    supports multiple-line comments between `/*` and `*/` – but these should only
    be used to comment-out sections of code.


    ![image](images/hot.jpg)


    Notice how the program code is formatted using spacing and indentation (collectively
    known as whitespace) to improve readability. All whitespace is ignored by the
    C++ compiler.


    # Compiling & running programs


    The C++ source files for this book are stored in a directory created for that
    purpose. The directory is named `MyPrograms` – its absolute address on Windows
    is `C:\MinGW` and on Linux it is `/home/*user*/MyPrograms`. You can recreate this
    directory to store programs awaiting compilation:


    ![image](images/1b.jpg)Move the `hello.cpp` program source file to the `MyPrograms`
    directory


    ![image](images/2b.jpg)At a command prompt, use the `cd` command to navigate to
    the `MyPrograms` directory


    ![image](images/3b.jpg)Enter a command to attempt to compile the program:


    ```bash

    c++ hello.cpp

    ```


    ![image](images/hot.jpg)


    When the attempt succeeds, the compiler creates an executable file alongside the
    original source file. By default, the executable file is named `a.exe` on Windows
    and `a.out` on Linux. Compiling a different source code file in the same directory
    would overwrite the first executable file without warning. This is obviously undesirable,
    so a custom name for the executable file should be specified when compiling programs,
    using the compiler’s `-o` option in the compile command:


    ```bash

    c++ hello.cpp -o hello.exe

    ```


    ![image](images/pg14_1.jpg)


    ![image](images/pg15_1.jpg)


    ![image](images/forget.jpg)


    The command `c++` is an alias for the GNU C++ Compiler – the command `g++` can
    also be used. You can see the compiler version number with the command:


    ```bash

    c++ --version

    ```


    and display all options with:


    ```bash

    c++ --help

    ```


    To run the generated executable program file in Windows, simply enter the file
    name at the prompt in the `MyPrograms` directory – optionally, the file extension
    may be omitted. In Linux, the full file name must be used, preceded by a `./`
    dot-slash – as Linux does not look in the current directory unless it is explicitly
    directed to do so:


    ```bash

    ./hello

    ```


    ![image](images/pg15_2.jpg)


    ![image](images/pg15_3.jpg)


