    ## 将指针传递给函数


    指针可以使用 `*` 解引用运算符访问指向变量的数据。这也可以通过赋值适当数据类型的新值来更改存储的数据。


    ![image](img/pg104)


    指针可以作为参数传递给函数——与传递变量的效果有所不同：


    - 当变量传递给函数时，数据是“按值”传递给函数内部的局部变量——因此函数操作的是原始值。

    - 当指针传递给函数时，数据是“按引用”传递的——因此函数操作的是原始值。


    按引用传递的用处允许函数直接操作调用函数内的变量。


