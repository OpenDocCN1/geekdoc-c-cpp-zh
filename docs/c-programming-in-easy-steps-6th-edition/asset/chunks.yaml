    \ you to create a single **Universal Windows Application** (UWA) that will run\
    \ on any modern Windows-based device. The interface layout of a UWA uses the **eXtensible\
    \ Application Markup Language** (XAML) to specify components. In order to develop\
    \ apps for the UWP, you should be running Windows 10 or Windows 11, and your Visual\
    \ Studio IDE must include the **Universal Windows App Development Tools:**\n\n\
    ![image](images/1g.jpg)Go to the Windows apps menu and launch the `Visual Studio\
    \ Installer`\n\n![image](images/pg170_2.jpg)\n\n![image](images/commong.jpg)\n\
    \nUniversal\n\n![image](images/2g.jpg)Click the Installer’s **Modify** button\
