    ![image](images/7g.jpg)Now, edit the integer variable declaration to change its
    value, then save, compile and run the program once more


    ```cpp

    int num = 6 ;

    ```


    ![image](images/pg47_1.jpg)


    ![image](images/hot.jpg)


    Notice that a `default` statement does not need to be followed by a `break` keyword
    – because a `default` statement always appears last in a `switch` statement.


    ## Looping for


    A loop is a piece of code in a program that automatically repeats. One complete
    execution of all statements contained within the loop block is known as an “iteration”
    or “pass”.


    ![image](images/pg48_1.jpg)


    The number of iterations made by a loop is controlled by a conditional test made
    within the loop. While the tested expression remains `true`, the loop will continue
    – until the tested expression becomes `false`, at which time the loop ends.


    The three types of loop structures in C++ programming are `for` loops, `while`
    loops, and `do`-`while` loops. Perhaps the most commonly used loop is the `for`
    loop, which has this syntax:


    ```cpp

    for ( *initializer ; *test-expression ; *incrementer* ) { *statements* }

    ```


    The initializer sets the starting value for a counter of the number of iterations
    made by the loop. An integer variable is used for this purpose and is traditionally
    named “i”.


    Upon each iteration of the loop, the test expression is evaluated, and that iteration
    will only continue while this expression is `true`. When the tested expression
    becomes `false`, the loop ends immediately without executing the statements again.
    On each iteration the counter is incremented then the statements executed.


    Loops may be nested within other loops – so that the inner loop will fully execute
    its iterations on each iteration of the outer loop.


    ![image](images/1g.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <iostream>

    using namespace std ;

    ```


    ![image](images/commong.jpg)


    forloop.cpp


    ![image](images/2g.jpg)Add a main function containing a final `return` statement


    ```cpp

    int main()

    {

    // Program code goes here.

    return 0 ;

    }

    ```


    ![image](images/3g.jpg)In the main function, insert a statement to declare an
    integer variable to be used as a loop iteration counter


    ```cpp

    int i ;

    ```


    ![image](images/4g.jpg)Next, insert a `for` loop to output the counter value on
    each of three iterations


    ```cpp

    for ( i = 1 ; i < 4 ; i++ )

    {

    cout << “Loop iteration: ” << i << endl ;

    }

    ```


    ![image](images/5g.jpg)Save, compile, and run the program to see the output


    ![image](images/pg49_1.jpg)


    ![image](images/6g.jpg)Now, edit the variable declaration to add a second counter


    ```cpp

    int i , j ;  // Integer variable “j” added.

    ```


    ![image](images/7g.jpg)Inside the `for` loop block, after the output statement
    add an inner loop to output its counter value on each iteration


    ```cpp

    for ( j = 1 ; j < 4 ; j++ )

    { cout << “ Inner loop iteration: “ << j << endl ; }

    ```


    ![image](images/8g.jpg)Save, compile, and run the program again to see the inner
    loop fully execute on each iteration of the outer loop


    ![image](images/pg49_2.jpg)


    ![image](images/hot.jpg)


    Alternatively, a `for` loop counter can count down by decrementing the counter
    value on each iteration using `i--` instead of the `i++` incrementer.


    ![image](images/forget.jpg)


    On the third iteration of these loops, the incrementer increases the counter value
    to 4 – so when it is next evaluated, the test returns false and the loop ends.


    ## Looping while


    An alternative to the `for` loop, introduced [here](#chapter03.xhtml_sec21), uses
    the `while` keyword, followed by an expression to be evaluated. When the expression
    is `true`, statements contained within braces following the test expression will
    be executed. The expression will then be evaluated again, and the `while` loop
    will continue until the expression is found to be `false`.


    ![image](images/pg50_1.jpg)


    The loop’s statement block must contain code that will affect the tested expression
    in order to change the evaluation result to `false`, otherwise an infinite loop
    is created that will lock the system! When the tested expression is found to be
    `false` upon its first evaluation, the `while` loop’s statement block will never
    be executed.


    A subtle variation of the `while` loop places the `do` keyword before the loop’s
    statement block and a `while` test after it, with this syntax:


    ```cpp

    do { statements-to-be-executed } while ( test-expression ) ;

    ```


    In a `do-while` loop, the statement block will always be executed at least once
    – because the expression is not evaluated until after the first iteration of the
    loop.


