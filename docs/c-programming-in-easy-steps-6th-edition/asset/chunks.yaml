    \ ;\ncout << “ year old “ << rex.getColor() ;\ncout << “ dog who weighs “ << rex.getWeight()\
    \ ;\ncout << “ pounds .” ;\n```\n\n![image](img/8v.jpg)现在，添加重载输出方法的调用。\n\n```cpp\n\
    rex.bark( “GRRR!” ) ;\n```\n\n![image](img/9v.jpg)插入一条传递两个参数创建 `Dog` 语句——调用重载构造函数。\n\
    \n```cpp\nDog sammy( 2, 6 ) ;\n```\n\n![image](img/10v.jpg)添加语句获取由重载构造函数方法设置的值，并调用重载输出方法。\n\
    \n```cpp\ncout << “Sammy is a “ << sammy.getAge() ;\ncout << “ year old “ << sammy.getColor()\
    \ ;\ncout << “ dog who weighs “ << sammy.getWeight() ;\ncout << “ pounds .” ;\n\
    sammy.bark( “BOWOW!” ) ;\n```\n\n![image](img/11v.jpg)保存、编译并运行程序。\n\n![image](img/pg125_1.jpg)\n\
    \n![image](img/snake.jpg)\n\n在不传递参数创建对象时，不要在对象名后加括号——注意是 `Dog rex ;` 而不是 `Dog\
    \ rex() ;`。\n\n![image](img/hot.jpg)\n\n这是 `Dog` 类的最终版本。在继续之前，请确保你能轻松识别它的公共成员和私有成员。\n\
    \n## 继承类属性\n\n一个 C++ 类可以作为一个全新的类创建（如之前的示例所示），也可以从现有类中“派生”。重要的是，派生类会继承它所派生的父类（基类）的成员——除了它自己的成员之外。\n\
    \n![image](img/pg126_1.jpg)\n\n从基类继承成员的能力允许创建派生类，这些派生类共享某些已经在基类中定义的共同属性。例如，“Polygon”（多边形）基类可以定义所有多边形共\
    \ `width`（宽度）和 `height`（高度）属性。“Rectangle”（矩形）和“Triangle”（三角形）类可以从 Polygon 类派生——继承宽度和高度属性，加上它们定义自身独特特征的成员。\n\
    \n![image](img/pg126_2.jpg)\n\n继承的优点非常强大，并且是面向对象编程（OOP）的第二个原则。\n\n派生类的声明在其类名后添加一个冒号\
    \ `:`，后面跟一个访问限定符和它派生的类。\n\n![image](img/1v.jpg)通过指定要包含的 C++ 库类和使用的命名空间前缀开始新程序。\n\
    \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonv.jpg)\n\
    \nderived.cpp\n\n![image](img/2v.jpg)声明一个名为 “Polygon”的类，包含两个保护变量（仅该类成员及其派生类的成员可访问），以及一个用于给这些变量赋值的公共方法。\n\
    \n```cpp\nclass Polygon\n{\nprotected:\n    int width, height ;\npublic:\n   \
    \ void setValues( int w, int h ) { width = w; height = h ; }\n} ;\n```\n\n![image](img/3v.jpg)在\
    \ Polygon 类之后，声明一个派自 Polygon 类的 Rectangle 类并添加一个独特方法。\n\n```cpp\nclass Rectangle\
    \ : public Polygon\n{\npublic:\n    int area() { return ( width * height ) ; }\n\
    } ;\n```\n\n![image](img/4v.jpg)在 Rectangle 类之后，声明一个派自 Polygon 类的 Triangle 类并添加一个独特方法。\n\
    \n```cpp\nclass Triangle : public Polygon\n{\npublic:\n    int area() { return\
    \ ( ( width * height ) / 2 ) ; }\n} ;\n```\n\n![image](img/5v.jpg)在 Triangle 类之后，添加包含最终\
    \ `return` 语句的 main 方法并创建每个派生类的实例。\n\n```cpp\nint main()\n{\n    Rectangle rect\
    \ ; Triangle trgl ;\n    return 0 ;\n}\n```\n\n![image](img/6v.jpg)插入对继承自 Polygon\
    \ 基类调用——以初始化继承的变量。\n\n```cpp\nrect.setValues( 4, 5 ) ;\ntrgl.setValues( 4, 5 )\
    \ ;\n```\n\n![image](img/7v.jpg)输出每个派生类独特方法的返回值。\n\n```cpp\ncout << “Rectangle\
    \ area : “ << rect.area() << endl ;\ncout << “Triangle area : “ << trgl.area()\
    \ << endl ;\n```\n\n![image](img/8v.jpg)保存、编译并运行程序。\n\n![image](img/pg127.jpg)不要混淆实例和派生类——实例是类的拷贝，而派生类是继承基类属性的新类。\n\
    \n## 调用构造函数\n\n虽然派生类继承父类的成员，但并不继承它的构造函数和析构函数。需要注意的是，创建派生类对象时总是会调用基类的默认构造函数——当对象被销毁时调用基类的析构函数。这些调用是在派生类之外进行的。\n\
    \n基类的默认构造函数没有参数，但该类也可以带有参数的重载构造函数。如果你希望在创建派生类对象时调用基类的重载构造函数，可以在派生类中创建一个匹配的重载构造函数——具有相同数量和类型的参数。\n\
    \n![image](img/128.jpg)\n\n通过指定要包含的 C++ 库类和使用的命名空间前缀开始新程序。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std ;\n```\n\nbasecon.cpp\n\n![image](img/2v.jpg)声明一个名为\
    \ “Parent”的类，它将作为一个基类。\n\n```cpp\nclass Parent\n{\n    // 类成员在这里\n} ;\n```\n\n\
    ![image](img/3v.jpg)在 Parent 类声明的大括号之间插入一个公共访问限定符并添加一个默认构造函数以输出文本——标识何时被调用。\n\n\
    ```cpp\npublic:\n    Parent()\n    { cout << “Default Parent constructor called.”\
    \ ; }\n```\n\n![image](img/4v.jpg)添加一个重载构造函数，接受一个整数参数并同样输出标识文本。\n\n```cpp\nParent\
    \ ( int a )\n{ cout << endl << “Overloaded Parent constructor called.” ; }\n```\n\
    \n![image](img/5v.jpg)在 Parent 类之后，声明一个派生的 “Daughter” 类。\n\n```cpp\nclass Daughter\
    \ : public Parent\n{\n} ;\n```\n\n![image](img/pg128_2.jpg)\n\nSon – Parent –\
    \ Daughter\n\n![image](img/6v.jpg)在 Daughter 类声明中，插入一个公共访问限定符并添加一个默认构造函数以输出文本——标识何时被调用。\n\
    \n```cpp\npublic :\n    Daughter ()\n    { cout << endl << “     Derived Daughter\
    \ class default constructor called.” ; }\n```\n\n![image](img/7v.jpg)在 Daughter\
    \ 类之后，声明一个派生的 “Son” 类。\n\n```cpp\nclass Son : public Parent\n{\n} ;\n```\n\n"
