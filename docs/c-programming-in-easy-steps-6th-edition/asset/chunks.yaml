  raw: '![image](images/pg62_1.jpg)


    Like the **<iostream>** class library, the **<string>** library is part of the
    **std** namespace that is used by the C++ standard library classes. This means
    that a string object can be referred to as **std::string**, or more simply as
    **string** when a **using namespace std;** directive is included at the start
    of the program.


    Once the **<string>** library is made available, a **string** “variable” can be
    declared in the same way as other variables. The declaration may optionally initialize
    the variable using the **=** assignment operator, or it may be initialized later
    in the program.


    Additionally, a **string** variable may be initialized by including a text string
    between parentheses after the variable name.


    Text strings in C++ must always be enclosed within “ ” double quote characters
    – ‘ ’ single quotes are only used to surround character values of the **char**
    data type.


    A C++ **string** variable is much easier to work with than the **char** arrays
    that C programmers must use, as it automatically resizes to accommodate the length
    of any text string. At a lower level, the text is still stored as a character
    array, but the **string** variable lets you ignore those details. Consequently,
    a character array can be assigned to a **string** variable using the **=** assignment
    operator.


    It is important to remember that when numeric values are assigned to a **string**
    variable, they are no longer a numeric data type, so arithmetic cannot be performed
    on them. For example, attempting to add **string** values of “7” and “6” with
    the **+** addition operator produces the concatenated **string** “76”, not the
    numerical value of 13\. In this case, the **+** operator recognizes that the context
    is not arithmetical, so adopts the guise of “concatenation operator” to unite
    the two strings. Similarly, the **+=** operator appends a **string** to another
    **string** and is useful to build long strings of text.


    Several **string** values are built into a single long string in the example program
    described [here](#chapter04.xhtml_ecif).


    ![image](images/1p.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <string>  // Include string support.**


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonp.jpg)


    string.cpp


    ![image](images/2p.jpg)Add a main function containing four **string** variable
    declarations and a final **return** statement


    **int main()**


    **{**


    **string text = “9” ;**


    **string term( “9 “ ) ;**


    **string info = “Toys” ;**


    **string color ;**


    **// Add more statements here.**


    **return 0 ;**


    **}**


    ![image](images/3p.jpg)In the main function, after the variable declarations,
    insert statements to declare and initialize a character array, then assign its
    value to the uninitialized **string** variable


    **char hue[4] = { ‘R’, ’e’, ’d’, ’\0’ } ;**


    **color = hue ;**


    ![image](images/4p.jpg)Assign a longer text **string** to one of the **string**
    variables


    **info = “Balloons” ;**


    ![image](images/5p.jpg)Build a long **string** by combining all the **string**
    variable values in the first **string** variable, then output the combined **string**
    value


    **text += ( term + color + info ) ;**


    **cout << endl << text << endl ;**


    ![image](images/6p.jpg)Save, compile, and run the program to see the output


    ![image](images/pg63_1.jpg)


    ![image](images/forget.jpg)


    Remember to add the special **\0** character to mark the end of a **string** in
    a **char** array.


    **Getting string input**


    The C++ **cin** function, which was introduced in [Chapter 3](#chapter03.xhtml)
    to input numeric values, can also assign text input to **string** variables. This
    has a limitation, as it can only be used to input a single word at a time – the
    **cin** function stops reading the input when it encounters a space, leaving any
    other text in the “input buffer”.


    ![image](images/pg64_1.jpg)


    When you want to allow the user to input a string with spaces, such as a sentence,
    the **getline()** function can be used. This function requires two arguments to
    specify the source and destination of the string. For example, where the **cin**
    function is the source, and a string variable named “str” is the destination:


    **getline( cin , str ) ;**


    The **getline()** function reads from an input “stream” until it encounters a
    **\n** newline character at the end of the line – created when you hit **Return**.


    Care must be taken when mixing **cin** and **getline()** functions, as the **getline()**
    function will automatically read anything left on the input buffer – giving the
    impression that the program is skipping an instruction. The **cin.ignore()** function
    can be used to overcome this problem by ignoring content left in the input buffer.


    ![image](images/1p.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <string>  // Include string support.**


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonp.jpg)


    input.cpp


    ![image](images/2p.jpg)Add a main function containing one string variable declaration
    and a final **return** statement


    **int main()**


    **{**


    **string name ;**


    **// Add more statements here.**


    **return 0 ;**


    **}**


    ![image](images/3p.jpg)In the main function, insert statements assigning the user
    name input to a string variable, then outputting its value


    **cout << “Please enter your full name: ” ;**


    **cin >> name ;**


    **cout << “Welcome “ << name << endl ;**


    ![image](images/4p.jpg)Next, insert a statement requesting the user name again,
    but this time assigning the input to the **string** variable with the **getline**
    function before outputting its value


    **cout << “Please re-enter your full name: ” ;**


    **getline( cin , name ) ;**


    **cout << “Thanks, “ << name << endl ;**


    ![image](images/5p.jpg)Save, compile, and run the program and enter your full
    name when requested


    ![image](images/pg65_1.jpg)


    This unsatisfactory result shows that **cin** reads up to the first space, leaving
    the second name in the input buffer, which is then read by **getline()** and subsequently
    output. The problem persists even when you enter only your first name, because
    **cin** leaves the newline character, created when you hit **Return**, on the
    input buffer.


    ![image](images/6p.jpg)Edit the program to resolve this issue by inserting a statement,
    just before the call to the **getline** function, instructing it to ignore content
    in the input buffer


    **cin.ignore( 256, ‘\n’ ) ;**


    ![image](images/7p.jpg)Save, compile, and run the program again, then re-enter
    your full name to see the program perform as required


    ![image](images/pg65_2.jpg)


    ![image](images/forget.jpg)


    Use the **cin** function for numeric input or single word input, but use the **getline()**
    function for string input.


    ![image](images/hot.jpg)


    The arguments to the **cin.ignore()** function specify it should discard up to
    256 characters and stop when it encounters a newline character.


    **Solving the string problem**


    A problem arises with **string** variables when you need to convert them to a
    different data type, perhaps to perform arithmetical operations with those values.
    As the **string** object is not a native C++ data type, a **string** variable
    value cannot be converted to an **int** or any other regular data type by casting.


    ![image](images/pg66_1.jpg)


    The solution is provided by the C++ **<sstream>** library that allows a **stringstream**
    object to act as an intermediary, through which **string** values can be converted
    to a numeric data type, and numeric values can be converted to a **string** data
    type. To make this ability available to a program, the library must be added with
    an **#include <sstream>** directive at the start of the program.'
