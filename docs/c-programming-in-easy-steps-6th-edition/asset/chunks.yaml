  trans: "\n\n![image](img/forget.jpg)\n\n在字符串中需要使用反斜符 `\\` 来转义单引号。\n\n## 提供能力类\n\n\
    其唯一目的是允许其他类派生自该类的类被称为“能力类”（capability classes）——它们为派生类提供能力。\n\n![image](img/pg140_1.jpg)\n\
    \n能力类通常不包含数据，仅声明了若干可以在派生类中重写的虚拟方法。\n\n接下来的示例在之前的示例的基础上，展示了如何将 `Bird` 类更写地写为一个能力类。它的方法不再包含输出语句，但如果被显式调用，将返回\
    \ `-1`（错误）值。\n\n有必要将这些方法的返回类型从 `void` 更改为 `int`，并且这些更改必须反映在派生类中的每个重写方法中。\n\n![image](img/1b.jpg)通过指定要包含的\
    \ C++ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <iostream>\nusing namespace std\
    \ ;\n```\n\n![image](img/commonb.jpg)\n\n`capability.cpp`\n\n![image](img/2b.jpg)声明一个名为“Bird”的基能力类，包含两个虚拟方法声明，如果被显式调用将报告错误\n\
    \n```cpp\nclass Bird\n{\npublic :\n    virtual int Talk() const { return -1 ;\
    \ }\n    virtual int Fly() const { return -1 ; }\n} ;\n```\n\n![image](img/3b.jpg)声明一个名为“Pigeon”的派生类，包含两个重写基类方法的方法\n\
    \n```cpp\nclass Pigeon : public Bird\n{\npublic :\n    int Talk() const { cout\
    \ << “Coo! Coo!” << endl ; return 0 ; }\n    int Fly() const { cout << “A pigeon\
    \ flies away...” << endl ; return 0 ; }\n} ;\n```\n\n![image](img/forget.jpg)\n\
    \n派生类中重写方法的返回值必须与基类中声明的返回值匹配。\n\n![image](img/4b.jpg)声明一个名为“Chicken”的派生类，包含两个重写基类方法的方法\n\
    \n```cpp\nclass Chicken : public Bird\n{\npublic :\n    int Talk() const { cout\
    \ << “Cluck! Cluck!” << endl ; return 0 ; }\n    int Fly() const { cout << “I’m\
    \ just a chicken – I can’t fly!” << endl ; return 0 ; }\n} ;\n```\n\n![image](img/5b.jpg)声明一个主方法，创建绑定派生类的基类指针\n\
    \n```cpp\nint main()\n{\n    Bird* pPigeon = new Pigeon ;\n    Bird* pChicken\
    \ = new Chicken ;\n}\n```\n\n![image](img/6b.jpg)在主方法中，插入方法调用和一条在显式调用基类方法并遇到错误时终止程序的语句\n\
    \n```cpp\npPigeon -> Talk() ;\npChicken -> Talk() ;\npPigeon -> Bird::Talk() ;\n\
    if ( -1 ) { cout << “Error! - Program ended.” << endl ; return 0 ; }\npPigeon\
    \ -> Fly() ;  // 将不会被调用。\npChicken -> Fly() ; // 将不会被调用。\nreturn 0 ;  // 语句将不会执行。\n\
    ```\n\n![image](img/7b.jpg)保存、编译并运行程序以查看输出\n\n![image](img/pg141_1.jpg)\n\n![image](img/snake.jpg)\n\
    \n能力类方法旨在在派生类中被重写——它们不应被显式调用。\n\n![image](img/hot.jpg)\n\n更多错误处理的详细信息，请参考此处和此处。\n\
    \n## 抽象数据类型\n\n抽象数据类型（ADT）代表一个概念而非一个实体对象，并且总是其他类的基类。通过将其一个或多个方法初始化为 `0`，可以将基类变为\
    \ ADT。这些被称为“纯虚拟方法”，并且必须在派生类中被重写。\n\n![image](img/1b.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\
    \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonb.jpg)\n\
    \n`adt.cpp`\n\n![image](img/2b.jpg)声明一个名为“Shape”的基 ADT 类，包含三个纯虚拟方法\n\n```cpp\n\
    class Shape\n{\npublic :\n    virtual int getArea() = 0 ;\n    virtual int getEdge()\
    \ = 0 ;\n    virtual void Draw() = 0 ;\n} ;\n```\n\n![image](img/3b.jpg)声明一个名为“Rect”的派生类，包含两个私有变量\n\
    \n```cpp\nclass Rect : public Shape\n{\nprivate :\n    int height, width ;\n}\
    \ ;\n```\n\n![image](img/4b.jpg)在派生类声明中，插入公共构造函数和析构函数\n\n```cpp\npublic :\n  \
    \  Rect( int initWidth, int initHeight )\n    {\n        height = initHeight ;\n\
    \        width = initWidth ;\n    }\n    ~Rect() ;\n```\n\n![image](img/snake.jpg)\n\
    \n创建 ADT 的实例对象是不允许的——尝试这样做会导致编译器错误。\n\n![image](img/5b.jpg)在派生类“Rect”声明中，插入公共方法以重写“Shape”基类\n\
    \n```cpp\nint getArea() { return height * width ; }\nint getEdge() { return 2\
    \ * (height + width) ; }\nvoid Draw()\n{\n    for (int i = 0 ; i < height ; i++)\
    \ { cout << “_” }\n}\n```\n\n![image](img/6b.jpg)声明一个主方法，包含返回语句并创建“Rect”类的实例——表示一个形状\n\
    \n```cpp\nint main()\n{\n    Shape* pQuad = new Rect( 3, 7 ) ;\n    Shape* pSquare\
    \ = new Rect( 5, 5 ) ;\n    return 0 ;\n}\n```\n\n![image](img/7b.jpg)在主方法中插入对方法的调用，然后保存、编译并运行程序以查看输出\n\
    \n```cpp\npQuad -> Draw() ;\ncout << “Area is ” << pQuad -> getArea() << endl\
    \ ;\ncout << “Perimeter is ” << pQuad -> getEdge() << endl ;\npSquare -> Draw()\
    \ ;\ncout << “Area is ” << pSquare -> getArea() << endl ;\ncout << “Perimeter\
    \ is ” << pSquare -> getEdge() << endl ;\n```\n\n![image](img/pg43.jpg)\n\n![image](img/forget.jpg)基类只需要包含一个虚拟方法即可创建抽象数据类型。\n\
    \n## 构建复杂的层次结构\n\n有时从另一个 ADT 派生 ADT 以构建复杂的类层次结构。这提供了极大的活性，只要每个纯方法在某个派生类中定义都是完全可以的。\n\
    \n![image](img/1b.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <iostream>\n\
    using namespace std ;\n```\n\n![image](img/commonb.jpg)\n\n`hierarchy.cpp`\n\n\
    ![image](img/2b.jpg)声明一个名为“Boat”的基 ADT 类，包含一个变量、访问方法和一个纯虚拟方法\n\n```cpp\nclass\
    \ Boat\n{\nprotected:\nint length ;\npublic:\n    int getLength() { return length\
    \ ; }\n    virtual void Model() = 0 ;\n} ;\n```\n\n![image](img/3b.jpg)声明一个名为“Sailboat”的\
    \ ADT 类（派自 Boat 类）——同样包含一个变量、访问方法和一个纯虚拟方法\n\n```cpp\nclass Sailboat : public Boat\n\
    {\nprotected :\nint mast ;\npublic :\n    int getMast() { return mast ; }\n  \
    \  virtual void Boom() = 0 ;\n} ;\n```\n\n![image](img/4b.jpg)声明一个名为“Laser”的普通类（派自\
    \ Sailboat 类），其中所有成员将允许公共访问\n\n```cpp\nclass Laser : public Sailboat\n{\npublic\
    \ :\n} ;\n```\n\n"
- fmt: "\n![image](images/6b.jpg)In the `Laser` class, define the pure virtual methods\
    \ declared in each class from which this class is derived\n\n```cpp\nvoid Model()\
    \ { cout << “Laser Classic” << endl ; }\nvoid Boom() { cout << “Boom: 14ft” <<\
    \ endl ; }\n```\n\n![image](images/7b.jpg)Declare a main method containing a final\
    \ `return` statement and creating an instance of the derived class on the bottom\
    \ tier of the hierarchy\n\n```cpp\nint main()\n{\n    Laser* pLaser = new Laser\
    \ ;\n    // Add more statements here.\n    return 0 ;\n}\n```\n\n![image](images/8b.jpg)In\
    \ the main method, insert calls to each defined method\n\n```cpp\npLaser -> Model()\
    \ ;\ncout << “Length: “ << pLaser -> getLength() << “ft” << endl ;\ncout << “Height:\
    \ “ << pLaser -> getMast() << “ft” << endl ;\npLaser -> Boom() ;\n```\n\n![image](images/9b.jpg)Save,\
    \ compile, and run the program to see the output\n\n![image](images/pg145_2.jpg)\n\
    \n![image](images/hot.jpg)\n\nTry adding a `Powerboat` class derived from the\
    \ `Boat` class (to contain engine information), and a `Cruiser` class derived\
    \ from the `Powerboat` class – to assign variable values and to define virtual\
    \ methods.\n\n### Isolating class structures\n\nThe source code for each example\
    \ program in this book is generally contained in a single `.cpp` file to save\
    \ space, but in reality OOP programs are often contained in three separate files:\n\
    \n*   Header `.h` file – contains only class declarations.\n*   Implementation\
    \ `.cpp` file – contains class definitions to implement the methods declared in\
    \ the header file, which is referenced by an `#include` directive.\n*   Client\
    \ `.cpp` file – contains a `main` method that employs the class members declared\
    \ in the header file, which is also referenced by an `#include` directive.\n\n\
    ![image](images/pg146_1.jpg)\n\nFor example, a sum calculator program might comprise\
    \ three files named `ops.h` (a header file declaring operation classes), `ops.cpp`\
    \ (an implementation file defining the operation methods), and `sum.cpp` (a client\
    \ file calling the various operations).\n\n![image](images/hot.jpg)\n\nThe client\
    \ file is sometimes referred to as a “driver” file.\n\nWhen compiling `sum.cpp`,\
    \ the compiler incorporates the included header file and implementation file into\
    \ the program. It first translates the header file and implementation file into\
    \ a binary object file (`ops.o`), then it translates the header file and client\
    \ file into a second binary object file (`sum.o`). Finally, the Linker combines\
    \ both object files into a single executable file (`sum.exe`).\n\n![image](images/pg146_2.jpg)\n\
    \n![image](images/hot.jpg)\n\nUsing an `#include` directive to reference a header\
    \ file works in a similar manner to using an `#include` directive to reference\
