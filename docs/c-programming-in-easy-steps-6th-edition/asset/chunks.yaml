    ternary.cpp


    ![image](images/2r.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3r.jpg)In the main function, insert statements declaring three
    integer variables, and initializing two of them


    **int a, b, max ;**


    **a = 1, b = 2 ;**


    ![image](images/4r.jpg)Insert statements to output the value and parity of the
    first examined variable


    **cout << “Variable a value is: ” ;**


    **cout << ( ( a != 1 ) ? “not 1, “ : “1, “ ) ;**


    **cout << ( ( a % 2 != 0 ) ? “odd” : “even” ) ;**


    ![image](images/5r.jpg)Next, insert statements to output the value and parity
    of the second examined variable


    **cout << endl << “Variable b value is: ” ;**


    **cout << ( ( b != 1 ) ? “not 1, “ : “1, “ ) ;**


    **cout << ( ( b % 2 != 0 ) ? “odd” : “even” ) ;**


    ![image](images/6r.jpg)Now, insert statements to output the greater of the two
    stored variable values


    **max = ( a > b ) ? a : b ;**


    **cout << endl << “Greater value is: ” << max << endl ;**


    ![image](images/7r.jpg)Save, compile and run the program to see the output


    ![image](images/pg35_1.jpg)


    ![image](images/hot.jpg)


    The ternary operator can return values of any data type – numbers, strings, Boolean
    values, etc.


    **Establishing size**


    Declaration of a variable allocates system memory where values assigned to that
    variable will be stored. The amount of memory allocated for this is determined
    by your system and the data type.


    ![image](images/pg36_1.jpg)


    Typically, an **int** data type is created as a “long” value by default, which
    can store values from +2,147,483,647 to -2,147,483,648\. On the other hand, if
    the **int** data type is created as a “short” value by default, it can only store
    values from +32,767 to -32,768.


    The preferred range can be explicitly specified when declaring the variable by
    prefixing the **int** keyword with a **short** or **long** qualifier. The **short
    int** is useful to save memory space when you are sure the limited range will
    never be exceeded.


    When an **int** variable is declared, it can by default contain either positive
    or negative integers, which are known as “signed” values. If the variable will
    always contain only positive integers, it can be qualified as **unsigned** to
    increase its maximum possible value. Typically, an **unsigned short int** has
    a range from zero to 65,535 and an **unsigned long int** has a range from zero
    to 4,294,967,295.


    The memory size of any variable can be discovered using the C++ **sizeof** operator.
    The name of the variable to be examined can be specified in optional parentheses
    following the **sizeof** operator name. For example, to examine a variable named
    “var”:


    **sizeof( var ) ; // Alternatively you can use “sizeof var ;”.**


    The **sizeof** operator will return an integer that is the number of bytes allocated
    to store data within the named variable.


    ![image](images/hot.jpg)


    Although **sizeof** is an operator that does not strictly need parentheses, it
    is commonly seen with them – as if it was a function, like **main()**.


    Simple data types, such as **char** and **bool**, only need a single byte of memory
    to store just one piece of data. Longer numeric values need more memory, according
    to their possible range – determined by data type and qualifiers.


    The memory allocated to an array is simply a multiple of that allocated to a single
    variable of its data type, according to its number of elements. For example, an
    **int** array of 50 elements will allocate 50 times the memory allocated to a
    single **int** variable.


    The **sizeof** operator is demonstrated in the program [here](#chapter02.xhtml_cifyin).


    ![image](images/1r.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonr.jpg)


    sizeof.cpp


    ![image](images/2r.jpg)Add a main function containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/3r.jpg) In the main function, insert statements declaring variables
    of various data types


    | **int num ;** | **int nums[50] ;** | **float decimal ;** |


    | **bool isTrue ;** | **unsigned int max ;** | **char letter ;** |


    | **double pi ;** | **short int number ;** | **char letters[50] ;** |


    ![image](images/4r.jpg)Next, insert statements to output the byte size of each
    integer variable


    **cout << “int size:” << sizeof( num ) << endl ;**


    **cout << “50 int size: ” << sizeof( nums ) << endl ;**


    **cout << “short int size: ” << sizeof( number ) << endl ;**


    **cout << “unsigned int size: ” << sizeof( max ) << endl ;**


    ![image](images/5r.jpg)Now, insert statements to output the size of other variables


    **cout << “double size: ” << sizeof( pi ) << endl ;**


    **cout << “float size: ” << sizeof( decimal ) << endl ;**


    **cout << “char size: ” << sizeof( letter ) << endl ;**


    **cout << “50 char size: ” << sizeof( letters ) << endl ;**


    **cout << “bool size: ” << sizeof( isTrue ) << endl ;**


    ![image](images/6r.jpg)Save, compile and run the program to see the output


    ![image](images/pg37_1.jpg)


    ![image](images/forget.jpg)


    Here, the **int** data type is created as a **long** type by default – your system
    may be different.


    **Setting precedence**


    Operator precedence determines the order in which C++ evaluates expressions. For
    example, in the expression **a = 6 + 8 * 3**, the order of precedence determines
    that multiplication is completed first.


    ![image](images/pg38_1.jpg)


    The table below lists operator precedence in descending order – those on the top
    row have highest precedence; those on lower rows have successively lower precedence.
    The order in which C++ evaluates expressions containing multiple operators of
    equal precedence is determined by “operator associativity” – grouping operands
    with the one on the left (LTR) or on the right (RTL).


    | **Operator:** | **Direction:** |'
