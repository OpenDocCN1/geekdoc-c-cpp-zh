    The backslash **\** character is required to escape the apostrophe in strings.


    **Providing capability classes**


    Classes whose sole purpose is to allow other classes to be derived from them are
    known as “capability classes” – they provide capabilities to the derived classes.


    ![image](images/pg140_1.jpg)


    Capability classes generally contain no data, but merely declare a number of virtual
    methods that can be overridden in their derived classes.


    The following example builds upon the previous example to demonstrate how the
    “Bird” class can be better written as a capability class. Its methods no longer
    contain output statements, but return a **-1** (error) value if they are called
    explicitly.


    It is necessary to change the return type of those methods from **void** to **int,**
    and these changes must also be reflected in each overriding method in the derived
    classes.


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonb.jpg)


    capability.cpp


    ![image](images/2b.jpg)Declare a base capability class named “Bird”, containing
    two virtual method declarations that will signal an error if called explicitly


    **class Bird**


    **{**


    **public :**


    **virtual int Talk() const { return -1 ; }**


    **virtual int Fly() const { return -1 ; }**


    **} ;**


    ![image](images/3b.jpg)Declare a derived class named “Pigeon”, containing two
    methods to override those in the base class


    **class Pigeon : public Bird**


    **{**


    **public :**


    **int Talk() const**


    **{ cout << “Coo! Coo!” << endl ; return 0 ; }**


    **int Fly() const**


    **{ cout << “A pigeon flies away...” << endl ; return 0 ; }**


    **} ;**


    ![image](images/forget.jpg)


    The return value of overriding methods in derived classes must match those declared
    in the base class.


    ![image](images/4b.jpg)Declare a derived class named “Chicken” containing two
    methods to override those in the base class


    **class Chicken : public Bird**


    **{**


    **public :**


    **int Talk() const**


    **{ cout << “Cluck! Cluck!” << endl ; return 0 ; }**


    **int Fly() const**


    **{ cout << “I\’m just a chicken – I can\’t fly!”** **<< endl ; return 0 ; }**


    **} ;**


    ![image](images/5b.jpg)Declare a main method creating base class pointers binding
    the derived classes


    **int main()**


    **{**


    **Bird* pPigeon = new Pigeon ;**


    **Bird* pChicken = new Chicken ;**


    **}**


    ![image](images/6b.jpg)In the main method, insert method calls and a statement
    to terminate the program when an error is met by explicitly calling a base class
    method


    **pPigeon -> Talk() ;**


    **pChicken -> Talk() ;**


    **pPigeon -> Bird::Talk() ;**


    **if ( -1 ) { cout << “Error! - Program ended.”**


    **<< endl ; return 0 ; }**


    **pPigeon -> Fly() ;  // Call will not be made.**


    **pChicken -> Fly() ; // Call will not be made.**


    **return 0 ;  // Statement will not be executed.**


    ![image](images/7b.jpg)Save, compile, and run the program to see the output


    ![image](images/pg141_1.jpg)


    ![image](images/snake.jpg)


    Capability class methods are intended to be overridden in derived classes – they
    should not be called explicitly.


    ![image](images/hot.jpg)


    Refer back to [here](#chapter05.xhtml_sec42) and [here](#chapter05.xhtml_Replacethe)
    for more details on error handling.


    **Making abstract data types**


    An Abstract Data Type (ADT) represents a concept, rather than a tangible object,
    and is always the base to other classes. A base class can be made into an ADT
    by initializing one or more of its methods with 0\. These are known as “pure virtual
    methods” and must always be overridden in derived classes.


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonb.jpg)


    adt.cpp


    ![image](images/2b.jpg)Declare a base ADT class named “Shape”, containing three
    pure virtual methods


    **class Shape**


    **{**


    **public :**


    **virtual int getArea() = 0 ;**


    **virtual int getEdge() = 0 ;**


    **virtual void Draw() = 0 ;**


    **} ;**


    ![image](images/3b.jpg)Declare a derived class named “Rect”, containing two private
    variables


    **class Rect : public Shape**


    **{**


    **private :**


    **int height, width ;**


    **} ;**


    ![image](images/4b.jpg)In the derived class declaration, insert a public constructor
    and destructor


    **public :**


    **Rect( int initWidth, int initHeight )**


    **{**


    **height = initHeight ;**


    **width = initWidth ;**


    **}**


    **~Rect() ;**


    ![image](images/snake.jpg)


    It is illegal to create an instance object of an ADT – attempting to do so will
    simply create a compiler error.


    ![image](images/5b.jpg)In the derived “Rect” class declaration, declare three
    public methods to override the pure virtual methods declared in the “Shape” base
    class


    **int getArea() { return height * width } ;**


    **int getEdge() { return ( 2 * height ) + ( 2 * width ) ; }**


    **void Draw()**


    **{**


    **for ( int i = 0 ; i < height ; i++ ) {**


    **for ( int j = 0 ; j < width ; j++ ) { cout << “x ” ; }**


    **cout << endl ; }**


    **}**


    ![image](images/pg143_1.jpg)


    ![image](images/6b.jpg)Declare a main method containing a final **return** statement
    and creating two instances of the derived “Rect” class – to represent a Square
    and a Quadrilateral shape


    **int main**


    **{**


    **Shape* pQuad = new Rect( 3, 7 ) ;**


    **Shape* pSquare = new Rect( 5, 5 ) ;**


    **// Add more statements here.**


    **return 0 ;**


    **}**


    ![image](images/pg143_2.jpg)


    ![image](images/7b.jpg)In the main method, insert calls to each method then save,
    compile, and run the program to see the output


    **pQuad -> Draw() ;**


    **cout << “Area is ” << pQuad -> getArea() << endl ;**


    **cout << “Perimeter is ” << pQuad -> getEdge() << endl ;**


    **pSquare -> Draw() ;**


    **cout << “Area is ” << pSquare -> getArea() << endl ;**


    **cout << “Perimeter is ”<< pSquare -> getEdge() <<endl ;**


    ![image](images/pg143_3.jpg)


    ![image](images/forget.jpg)


    A base class need only contain one pure virtual method to create an Abstract Data
    Type.


    **Building complex hierarchies**


    It is sometimes desirable to derive an ADT from another ADT to construct a complex
    hierarchy of classes. This provides great flexibility and is perfectly acceptable,
    providing each pure method is defined at some point in a derived class.


    ![image](images/1b.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonb.jpg)


    hierarchy.cpp


    ![image](images/2b.jpg)Declare a base ADT class named “Boat”, containing a variable
    and accessor method together with one pure virtual method


    **class Boat**


    **{**


    **protected:**


    **int length ;**


    **public :**


    **int getLength() { return length ; }**


    **virtual void Model() = 0 ;**


    **} ;**


    ![image](images/3b.jpg)Declare an ADT class (derived from the Boat class) named
    “Sailboat” – also containing a variable and accessor method together with one
    pure virtual method


    **class Sailboat : public Boat**


    **{**


    **protected :**


    **int mast ;**


    **public :**


    **int getMast() { return mast ; }**


    **virtual void Boom() = 0 ;**


    **} ;**


    ![image](images/4b.jpg)Declare a regular class (derived from the Sailboat class)
    named “Laser”, in which all members will allow public access


    **class Laser : public Sailboat**


    **{**


    **public :**


    **} ;**


    ![image](images/pg144_1.jpg)


    Laser


    Sailboat (Boat)


    ![image](images/forget.jpg)


    The Boat class has properties common to any boat, whereas the Sailboat class has
    properties specific to boats that have sails.


    ![image](images/5b.jpg)In the Laser class, insert a call to its constructor method
    to assign values to the variables in each class from which this class is derived
    – and call the destructor method


    **Laser() { mast = 19 ; length = 35 ; }**


    **~Laser() ;**


