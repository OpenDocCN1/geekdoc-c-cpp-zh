    ![image](img/4g.jpg)然后，修改所有六个 `<TextBlock>` 元素以指定初始内容、宽度以及四个边的边距


    ```xmlText = ”...” Width = ”20” Margin = ”15”

    Text = ”...” Width = ”20” Margin = ”15”

