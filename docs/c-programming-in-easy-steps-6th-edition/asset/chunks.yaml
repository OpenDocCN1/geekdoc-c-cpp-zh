    \ 类指针和 `.` 类成员运算符将在本书的后面介绍——但为了完整性，它们被包含在这里。\n\n![image](img/1r.jpg)\n\n通过指定要包含的\
    \ C++ 库类和要使用的命名空间前缀来开始一个新程序：\n\n```cpp\n#include <iostream>\nusing namespace std\
    \ ;\n```\n\n![image](img/commonr.jpg)\n\nprecedence.cpp\n\n添加一个包含最终返回语句的 main\
    \ 函数：\n\n```cpp\nint main()\n{\n    // 程序代码写在这里。\n    return 0 ;\n}\n```\n\n![image](img/2r.jpg)在\
    \ main 函数中，声明一个整数变量，并使用默认优先级的表达式结果进行初始化，然后输出结果：\n\n```cpp\nint num = 1 + 4 * 3\
    \ ;\ncout << endl << “Default order: ” << num << endl ;\n```\n\n![image](img/4r.jpg)接下来，使用显式优先级将此表达式的结果赋值变量，然后输出结果：\n\
    \n```cpp\nnum = ( 1 + 4 ) * 3 ;\ncout << “Forced order: ” << num << endl << endl\
    \ ;\n```\n\n![image](img/5r.jpg)使用方向优先级将另一个表达式的结果赋值给变量，然后输出结果：\n\n```cpp\nnum\
    \ = 7 - 4 + 2 ;\ncout<< “Default direction: ” << num << endl ;\n```\n\n![image](img/6r.jpg)现在，使用显式优先级将此表达式的结果赋值变量，然后输出结果：\n\
    \n```cpp\nnum = 7 - ( 4 + 2 ) ;\ncout << “Forced direction: ” << num << endl ;\n\
    ```\n\n![image](img/7r.jpg)保存、编译并运行程序以查看输出：\n\n![image](img/pg39_1.jpg)\n\n![image](img/snake.jpg)\n\
    \n不要依赖默认优先级，因为它在编译器之间可能会不同——始终使用括号来明确表达式。\n\n### 数据类型转换\n\n![image](img/pg40_1.jpg)\n\
    \n存储在变量中的任何数据都可以通过名为“强制转换”（casting）的过程强制（迫）转换为不同数据类型的变量。转换语句只需在包含要转换数据的变量名之前的括号中指明该值应该转换到的数据类型。因此，转换语法看起来如下：\n\
    \n`variable-name = ( data-type ) variable-name ;`\n\n这是传统的转换形式，在 C 编程语言中也可以找到。C++\
    \ 中一种较新的替代方案使用尖角括号和 `static_cast` 关键字，如下：\n\n`variable-name = static_cast < data-type\
    \ > variable-name ;`\n\n新版本允许通过避免使用括号在源代码中更容易地识别转换，因为括号很容易与表达式中的括号混淆。虽然优选较新的转换形式，但旧形式仍然广泛存在。\n\
    \n为了准确存储算术运算的结果，转换通常是必要的，因为将一个整数除以另一个整数总是产生整数结果。例如，整数除法 `7/2` 产生被截断的整数结果 `3`。\n\
    \n要存储准确的浮点数结果，需要将结果转换为适当的数据类型，例如 `float`，如下：\n\n`float result = ( float ) 7 /\
    \ 2 ;`\n\n或者使用较新的转换形式：\n\n`float result = static_cast < float > 7 / 2 ;`\n\n![image](img/forget.jpg)\n\
    \n"
- fmt: "\n- The `sizeof` operator returns the memory byte size of a variable.\n- An\
    \ `int` variable may be qualified as a `short` type for smaller numbers, or as\
    \ a `long` type for large numbers.\n- Where an `int` variable will only store\
    \ positive numbers, it may be qualified as `unsigned` to extend its numeric range.\n\
    - It is important to explicitly set operator precedence in complex expressions\
    \ by adding parentheses `( )`.\n- Data stored in a variable can be forced into\
    \ a variable of a different data type by the casting process.\n- C++ supports\
    \ traditional C-style casts and the newer form of casts that use the `static_cast`\
    \ keyword.\n\n# 3 Making statements\n\n*This chapter demonstrates C++ conditional\
    \ statements, which allow programs to branch in different directions, and introduces\
    \ C++ function structures.*\n\n- [Branching with if](#chapter03.xhtml_sec19)\n\
    - [Switching branches](#chapter03.xhtml_sec20)\n- [Looping for](#chapter03.xhtml_sec21)\n\
    - [Looping while](#chapter03.xhtml_sec22)\n- [Declaring functions](#chapter03.xhtml_sec23)\n\
    - [Passing arguments](#chapter03.xhtml_sec24)\n- [Overloading functions](#chapter03.xhtml_sec25)\n\
    - [Optimizing functions](#chapter03.xhtml_sec26)\n- [Summary](#chapter03.xhtml_sec27)\n\
    \n## Branching with if\n\nThe C++ `if` keyword performs the basic conditional\
    \ test that evaluates a given expression for a Boolean value of `true` or `false`\
    \ – and its syntax looks like this:\n\n```cpp\nif ( test-expression ) { statements-to-execute-when-true\
    \ }\n```\n\n![image](images/pg44_1.jpg)\n\nThe braces following the test may contain\
    \ one or more statements, each terminated by a semi-colon, but these will only\
    \ be executed when the expression is found to be `true`. When the test is found\
    \ to be `false`, the program proceeds to its next task.\n\nOptionally, an `if`\
    \ statement can offer alternative statements to execute when the test fails by\
    \ appending an `else` statement block after the `if` statement block, like this:\n\
    \n```cpp\nif ( test-expression ) { statements-to-execute-when-true }\nelse { statements-to-execute-when-false\
    \ }\n```\n\n![image](images/hot.jpg)\n\nWhere there is only one statement to execute\
    \ when the test succeeds, the braces may be omitted – but retaining them aids\
    \ code clarity.\n\nTo test two conditions, the test expression may use the `&&`\
    \ operator – for example, `if ( ( num > 5 ) && ( letter == ‘A’ ) )`. Alternatively,\
    \ an `if` statement can be “nested” within another `if` statement, so those statements\
    \ in the inner statement block will only be executed when both tests succeed –\
    \ but statements in the outer statement block will be executed if the outer test\
    \ succeeds.\n\n![image](images/1g.jpg)Start a new program by specifying the C++\
    \ library classes to include, and a namespace prefix to use\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std ;\n```\n\n![image](images/commong.jpg)\n\nifelse.cpp\n\
    \n![image](images/2g.jpg)Add a main function containing a final `return` statement\n\
    \n```cpp\nint main()\n{\n    // Program code goes here.\n    return 0 ;\n}\n```\n\
    \n![image](images/3g.jpg)In the main function, insert statements to declare and\
    \ initialize two variables\n\n```cpp\nint num = 8 ;\nchar letter = ‘A’ ;\n```\n\
    \n![image](images/4g.jpg)Next, insert an `if-else` statement that tests the integer\
    \ variable value and outputs an appropriate response\n\n```cpp\nif ( num > 5 )\n\
    { cout << “Number exceeds five” << endl ; }\nelse\n{ cout << “Number is five or\
    \ less” << endl ; }\n```\n\n![image](images/5g.jpg)In the `if` statement block,\
    \ insert a nested `if` statement that tests the character variable value and outputs\
    \ when matched\n\n```cpp\nif ( letter == ‘A’ ) { cout << “Letter is A” << endl\
    \ ; }\n```\n\n![image](images/6g.jpg)Save, compile and run the program to see\
