    **Understanding data storage**


    In order to understand C++ pointers it is helpful to understand how data is stored
    on your computer. Envision the computer’s memory as a very long row of sequentially-numbered
    slots, which can each contain one byte of data. When a variable is declared in
    a program, the machine reserves a number of slots at which to store data assigned
    to that variable. The number of slots it reserves depends upon the variable’s
    data type. When the program uses the variable name to retrieve stored data, it
    actually addresses the number of the variable’s first reserved slot.


    ![image](images/pg98_1.jpg)


    Comparison can be drawn to a long row of sequentially-numbered houses that can
    each accommodate a different family. Any family can be explicitly referenced by
    addressing their house number.


    The slot (house) numbers in computer memory are expressed in hexadecimal format
    and can be revealed by the **&** reference operator.


    ![image](images/1bl.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <string>**


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonbb.jpg)


    address.cpp


    ![image](images/2bl.jpg)Add a main function containing a final **return** statement
    and declaring three initialized variables


    **int main()**


    **{**


    **int num = 100 ;**


    **double sum = 0.0123456789 ;**


    **string text = “C++ Fun” ;**


    **// Add more statements here.**


    **return 0 ;**


    **}**


    ![image](images/3bl.jpg)In the main function, insert statements to output the
    memory address of the first slot of each variable


    **cout << “Integer variable starts at: “ << &num << endl ;**


    **cout << “Double variable starts at: “ << &sum << endl ;**


    **cout << “String variable starts at: “ << &text << endl ;**


    ![image](images/4bl.jpg)Save, compile, and run the program to see the three memory
    addresses


    ![image](images/pg99_1.jpg)


    Once memory space has been reserved by a variable declaration, a value of the
    appropriate data type can be stored there using the **=** assignment operator.
    For example, **num = 100** takes the value on its right (**100**) and puts it
    in the memory referenced by the named variable on its left (**num**).


    ![image](images/forget.jpg)


    The location addresses are dynamically allocated – so will vary from those in
    this screenshot.


    The operand to the left of the **=** assignment operator is called its “L-value”
    and the operand to its right is called its “R-value”. Consider the “L” in L-value
    to mean “Location” and consider the “R” in R-value to mean “Read”.


    One important rule in C++ programming insists that an R-value cannot appear to
    the left of the **=** assignment operator, but an L-value may appear on either
    side. Code that places an R-value to the left of an **=** assignment operator
    will not compile:


    ![image](images/5bl.jpg)Just before the **return** statement, insert statements
    placing R-values incorrectly to the left of assignment operators


    **200 = num ;**


    **5.5 = sum ;**


    **“Bad assignments” = text ;**


    ![image](images/6bl.jpg)Save, and attempt to recompile the program to see the
    errors caused by incorrectly placed R-values


    ![image](images/pg99_2.jpg)


    ![image](images/hot.jpg)


    L-values are containers but R-values are data.


    **Getting values with pointers**


    Pointers are a useful part of efficient C++ programming – they are simply variables
    that store the memory address of other variables.


    ![image](images/pg100_1.jpg)


    Pointer variables are declared in the same way that other variables are declared,
    but the data type is suffixed by a “*****” character. This denotes, in a declaration,
    that the variable will be a pointer. Always remember that the pointer’s data type
    must match that of the variable to which it points.'
