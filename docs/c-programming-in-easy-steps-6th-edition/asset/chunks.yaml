  trans: "\n\n![image](img/pg155_1.jpg)\n\n![image](img/hot.jpg)\n\nLinux 用户可以使用转义的双引号\
    \ `\\””string”\\”` 或普通的单引号 `‘“string”’` 来在命令中包含引用的字符串。\n\n此外，也可以通过命令行使用 `-Dname`\
    \ 选项进行替换，将宏替换为指定的值。请注意，双引号内的字符串值在命令中也必须用转义引号括——因此替换将包含双引号字符。\n\n![image](img/7r.jpg)删除或注释掉针对\
    \ `BOOK` 和 `NUM` 标识符的 `define` 指令——保存程序文件以应用更改。\n\n![image](img/8r.jpg)重新编译程序并指定替换宏的值，然后再次运行程序\
    \ `c++ -DNUM=50 -DBOOK=\\””Java in easy steps”\\”`。\n\n```bash\ndefine.cpp -o\
    \ define.exe\n```\n\n![image](img/pg155_2.jpg)\n\n![image](img/hot.jpg)\n\nLinux\
    \ 用户可以使用转义的双引号 `\\””string”\\”` 或普通的单引号 `‘”string”’` 来在命令中包含引用的字符串。\n\n![image](img/forget.jpg)\n\
    \n尝试编译一个未定义标识符的程序将产生“未在此作用域中声明”的错误。\n\n### 定义条件\n\n预处理器可以通过使用宏函数执行条件测试，从而对程序源代码进行智能插入。`#ifdef`\
    \ 指令执行最常见的预处理器功能，它会测试指定的宏是否已定义。当宏已定义时（测试返回真），预处理器将插入后续行上的所有指令或语句，直到遇到相应的 `#endif`\
    \ 指令。\n\n![image](img/pg156_1.jpg)\n\n相反，`#ifndef` 指令测试指定的宏是否未定义。当该测试返回真时，它将插入后续行上的所有指令或语句，直到遇到相应的\
    \ `#endif` 指令。\n\n为了满足任一条件测试，需要注意的是，`#define` 指令仅需指定宏名称来定义标识符——它不需要指定用于替换的值。\n\
    \n以后可以使用 `#undef` 指令移除之前之前定义的任何宏——使得随后的 `#ifdef` 条件测试失败。随后可以通过另一个 `#define` 指令重新定义宏：\n\
    \n![image](img/1r.jpg)启动一个带有条件测试的新程序，当宏尚未定义时插入一个指令。\n\n```cpp\n#ifndef BOOK\n\
    #define BOOK “C++ Programming in easy steps”\n#endif\n```\n\n![image](img/commonr.jpg)\n\
    \nifdef.cpp\n\n![image](img/2r.jpg)指定要包含的库类和命名空间\n\n```cpp\n#include <iostream>\n\
    using namespace std ;\n```\n\n![image](img/3r.jpg)添加一个包含最终 `return` 语句的 main 函数。\n\
    \n```cpp\nint main()\n{\n    // 程序代码在此。\n    return 0 ;\n}\n```\n\n![image](img/4r.jpg)在\
    \ main 函数中，添加一个条件预处理器测试，在测试成功时插入输出语句。\n\n```cpp\n#ifdef BOOK\ncout << BOOK ;\n\
    #endif\n```\n\n![image](img/5r.jpg)添加另一个条件预处理器测试，在测试成功时定义一个新宏并插入输出语句。\n\n```cpp\n\
    #ifndef AUTHOR\n#define AUTHOR “Mike McGrath”\ncout << “ by ” << AUTHOR << endl\
    \ ;\n#endif\n```\n\n![image](img/6r.jpg)接下来，添加一个条件测试，如果宏已经定义，则取消定义它。\n\n```cpp\n\
    #ifdef BOOK\n#undef BOOK\n#endif\n```\n\n![image](img/7r.jpg)现在，添加一个条件测试，如果宏不再定义，则重新定义它并插入输出语句。\n\
    \n```cpp\n#ifndef BOOK\n#define BOOK “Linux in easy steps”\ncout << BOOK “ by\
    \ “ << AUTHOR << endl ;\n#endif\n```\n\n![image](img/8r.jpg)保存、编译并运行程序以查看插入结果。\n\
    \n![image](img/pg157_1.jpg)\n\n![image](img/9r.jpg)重新编译程序，这次在命令中定义 `BOOK` 宏，然后再次运行程序，在输出的第一行中看到指定的值。\n\
    \n```bash\nc++ -DBOOK=\\”“Python in easy steps”\\” ifdef.cpp -o ifdef.exe\n```\n\
    \n![image](img/pg157_2.jpg)\n\n![image](img/snake.jpg)\n\n每个预处理器指令必须单独占一行——你不能在同一行上放置多个指令。\n\
    \n![image](img/forget.jpg)\n\n在 Windows 系统上，命令中指定的字符串宏值必须用转义的双引号括。\n\n### 提供替代方案\n\
    \n可以通过添加 `#else` 指令扩展 `#ifdef` 和 `#ifndef` 执行的条件测试提供替代方案。例如：\n\n```cpp\n#ifdef\
    \ WEATHER\ncout << WEATHER ;\n#else\n#define WEATHER “Sunny”\n#endif\n```\n\n\
    ![image](img/pg158_1.jpg)\n\n同样，`#if`、`#else` 和 `#elif` 宏可以执行多个条件测试，就像普通的 C++\
    \ `if` 和 `else` 关键字一样。\n\n预定义宏是特定平台的，通常这些名称以双下划线开头，以避免与选择的名称意外冲突。要查看预定义宏列表，对空文件使用\
    \ `-dM` 选项直接调用预处理器：\n\n```bash\ncpp -dM empty.txt\n```\n\n滚动列表查找 Windows 的 `_WIN32`\
    \ 或 Linux 的 `__linux`。`_WIN32` 宏有一个下划线，而 `__linux` 宏有两个下划线。\n\n### 包含保护\n\n![image](img/pg158_2.jpg)\n\
    \n![image](img/pg158_3.jpg)\n\n![image](img/snake.jpg)\n\n使用 `cpp` 命令（而不是 `c++`\
    \ 命令）并确保 `-dM` 选项大小写正确。\n\n```cpp\n#if defined __WIN32\n#define PLATFORM “Windows”\n\
    #elif defined __linux\n#define PLATFORM “Linux”\n#endif\n\n#include <iostream>\n\
    using namespace std ;\n\nint main()\n{\n    cout << PLATFORM << “ System” << endl\
    \ ;\n    return 0 ;\n}\n\nif ( PLATFORM == “Windows” )\n    cout << “Performing\
    \ Windows-only tasks...” << endl ;\nif ( PLATFORM == “Linux” )\n    cout << “Performing\
    \ Linux-only tasks...” << endl ;\n```\n"
- fmt: "\nTypically, a C++ program will have many `.h` header files and a single `.cpp`\
    \ implementation file containing the main program. Header files may often contain\
    \ one or more `#include` directives to make other classes or functions available\
    \ from other header files, and can cause duplication where definitions appear\
    \ in two files. For example, where a header file includes another header file\
    \ containing a function definition, the compiler will consider that definition\
    \ to appear in each file – so compilation will fail.\n\n![image](images/pg160_1.jpg)\n\
    \nThe popular solution to this problem of re-definition employs preprocessor directives\
    \ to ensure the compiler will only be exposed to a single definition. These are\
    \ known as “inclusion guards” and create a unique macro name for each header file.\
    \ Traditionally, the name is an uppercase version of the file name, with the dot\
    \ changed to an underscore - for example, `RUM_H` for a file `rum.h`.\n\n![image](images/hot.jpg)\n\
    \nInclusion guards are also known as “macro guards” or simply as “include guards”.\n\
    \nIn creating a macro to guard against duplication, an `#ifndef` directive first\
    \ tests to see if the definition has already been made by another header file\
    \ included in the same program. If the definition already exists, the compiler\
    \ ignores the duplicate definition, otherwise a `#define` directive will permit\
    \ the compiler to use the definition in that header file:\n\n![image](images/1r.jpg)Create\
    \ a header file named “add.h” containing the inline declaration of an “add” function\n\
    \n```cpp\ninline int add ( int x, int y ) { return ( x + y ) ; }\n```\n\n![image](images/commonhr.jpg)\n\
    \nadd.h\n\n![image](images/2r.jpg)Now, create a header file named “triple.h” containing\
    \ a processor directive to make the add function available for use in the inline\
    \ declaration of a “triple” function\n\n```cpp\n#include “add.h”\n\ninline int\
    \ triple ( x ) { return add( x, add( x, x ) ) ; }\n```\n\n![image](images/commonhr.jpg)\n\
    \ntriple.h\n\n![image](images/3r.jpg)Start a new program with preprocessor directives\
    \ to make both the add and triple functions available\n\n```cpp\n#include “add.h”\n\
    \n#include “triple.h”\n```\n\n![image](images/commonr.jpg)\n\nguard.cpp\n\n![image](images/4r.jpg)Specify\
    \ the library classes to include, and the namespace\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std ;\n```\n\n![image](images/5r.jpg)Add a main function containing\
    \ statements that call both the `add()` and `triple()` functions from the included\
    \ headers\n\n```cpp\nint main()\n{\n  cout << “9 + 3 = “ << add( 9, 3 ) << endl\
    \ ;\n  cout << “ 9 x 3 = “ << triple( 9 ) << endl ;\n  return 0 ;\n}\n```\n\n\
    ![image](images/6r.jpg)Save the files, then attempt to compile the program to\
    \ see compilation fail because the add function appears to be defined twice –\
    \ in “add.h” and by inclusion in “triple.h”\n\n![image](images/pg161_1.jpg)\n\n\
    ![image](images/7r.jpg)Edit the header file “add.h” to enclose the inline function\
    \ declaration within a preprocessor inclusion guard\n\n```cpp\n#ifndef ADD_H\n\
    #define ADD_H\n\ninline int add ( int x, int y ) { return ( x + y ) ; }\n#endif\n\
    ```\n\n![image](images/8r.jpg)Save the modified file, then compile and run the\
    \ program – compilation now succeeds because the inclusion guard prevents the\
    \ apparent re-definition of the add function\n\n![image](images/pg161_2.jpg)\n\
    \n![image](images/snake.jpg)\n\nUse the conventional naming scheme, where the\
    \ macro name resembles the file name, to avoid conflicts.\n\n![image](images/forget.jpg)\n\
    \nAll header files should contain header guards – add a `TRIPLE_H` macro to the\
    \ `triple.h` file.\n\n## Using macro functions\n\nThe `#define` directive can\
    \ be used to create macro functions that will be substituted in the source code\
    \ before compilation.\n\n![image](images/pg162_1.jpg)\n\nA preprocessor function\
    \ declaration comprises a macro name, immediately followed by parentheses containing\
    \ the function’s arguments – it is important not to leave any space between the\
    \ name and the parentheses. The declaration is then followed by the function definition\
    \ within another set of parentheses. For example, a preprocessor macro function\
    \ to half an argument looks like this:\n\n```cpp\n#define HALF( n ) ( n / 2)\n\
    ```\n\nCare should be taken when using macro functions, because unlike regular\
    \ C++ functions, they do not perform any kind of type checking – so it’s quite\
    \ easy to create a macro that causes errors. For this reason, inline functions\
    \ are usually preferable to macro functions, but because macros directly substitute\
    \ their code, they avoid the overhead of a function call – so the program runs\
    \ faster. The resulting difference can be seen in the first temporary file created\
    \ during the compilation process:\n\n![image](images/1r.jpg)Start a new program\
    \ by defining two macro functions to manipulate a single argument\n\n```cpp\n\
    #define SQUARE( n ) ( n * n )\n\n#define CUBE( n ) ( n * n * n )\n```\n\n![image](images/commonr.jpg)\n\
    \nmacro.cpp\n\n![image](images/2r.jpg)After the macro function definitions, specify\
    \ the library classes to include, and a namespace prefix to use\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std ;\n```\n\n![image](images/3r.jpg)Next, declare\
    \ two inline functions to manipulate a single argument – just like the macro functions\n\
    \n```cpp\ninline int square ( int n ) { return ( n * n ) }\n\ninline int cube\
    \ ( int n ) { return ( n * n * n ) }\n```\n\n![image](images/4r.jpg)Add a main\
    \ function containing a final `return` statement\n\n```cpp\nint main()\n{\n  //\
    \ Program code goes here.\n  return 0 ;\n}\n```\n\n![image](images/5r.jpg)At the\
    \ start of the main function, declare and initialize an integer variable\n\n```cpp\n\
    int num = 5 ;\n```\n\n![image](images/6r.jpg)Now, insert statements to call each\
    \ macro function and each inline function\n\n```cpp\ncout << “Macro SQUARE: ”\
    \ << SQUARE( num ) << endl ;\ncout << “Inline square: ” << square( num ) << endl\
    \ ;\ncout << “Macro CUBE: ” << CUBE( num ) << endl ;\ncout << “Inline cube: ”\
    \ << cube( num ) << endl ;\n```\n\n![image](images/7r.jpg)Save the file, then\
    \ compile the program, saving the temporary files and run the program\n\n```bash\n\
    c++ macro.cpp -save-temps -o macro.exe\n```\n\n![image](images/pg163_1.jpg)\n\n\
    ![image](images/8r.jpg)Open the temporary “.ii” file in a plain text editor, to\
    \ see that the macro functions have been directly substituted in each output statement\n\
    \n![image](images/pg163_2.jpg)\n\n## Building strings\n\nThe preprocessor `#`\
    \ operator is known as the “stringizing” operator, as it converts a series of\
    \ characters passed as a macro argument into a string – adding double quotes to\
    \ enclose the string.\n\n![image](images/pg164_1.jpg)\n\nAll whitespace before\
    \ or after the series of characters passed as a macro argument to the stringizing\
    \ operator is ignored, and multiple spaces between characters is reduced to just\
    \ one space.\n\nThe stringizing operator is useful to pass string values to a\
    \ preprocessor #define directive without needing to surround each string with\
    \ double quotes.\n\nA macro definition can combine two terms into a single term\
    \ using the `##` merging operator. Where the combined term is a variable name,\
    \ its value is not expanded by the macro – it simply allows the variable name\
    \ to be substituted by the macro.\n\n![image](images/1r.jpg)Start a new program\
    \ by defining a macro to create a string from a series of characters passed as\
    \ its argument, to substitute in an output statement\n\n```cpp\n#define LINEOUT(\
    \ str ) cout << #str << endl\n```\n\n![image](images/commonr.jpg)\n\nstrung.cpp\n\
    \n![image](images/2r.jpg)Define a second macro to combine two terms passed as\
    \ its arguments into a variable name, to substitute in an output statement\n\n\
    ```cpp\n#define GLUEOUT( a, b ) cout << a##b << endl\n```\n"
