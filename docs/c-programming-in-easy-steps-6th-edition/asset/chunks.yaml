    ## Doing pointer arithmetic


    Once a pointer variable has been initialized with a memory address, it can be
    assigned another address or changed using pointer arithmetic.


    ![image](images/pg102_1.jpg)


    The `++` increment operator or the `--` decrement operator will move the pointer
    along to the next or previous address for that data type – the larger the data
    type, the bigger the jump.


    Even larger jumps can be achieved using the `+=` and `-=` operators.


    Pointer arithmetic is especially useful with arrays, because the elements in an
    array occupy consecutive memory addresses. Assigning just the name of an array
    to a pointer automatically assigns it the address of the first element. Incrementing
    the pointer by 1 moves the pointer along to the next element.


    ![image](images/1bl.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    ```cpp

    #include <iostream>

    using namespace std ;

    ```


