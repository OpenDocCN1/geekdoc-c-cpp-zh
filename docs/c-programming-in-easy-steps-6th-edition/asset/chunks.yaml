    \ stored within a pointer.\n- References are easier to use than pointers but,\
    \ unlike pointers, a reference must always be initialized in its declaration and\
    \ can never be assigned a different variable.\n\n# 7\n\n# Creating classes and\
    \ objects\n\nThis chapter introduces the topics of encapsulation and inheritance\
    \ – the first two principles of C++ Object Oriented Programming.\n\n- [Encapsulating\
    \ data](#chapter07.xhtml_sec55)\n- [Creating an object](#chapter07.xhtml_sec56)\n\
    - [Creating multiple objects](#chapter07.xhtml_sec57)\n- [Initializing class members](#chapter07.xhtml_sec58)\n\
    - [Overloading methods](#chapter07.xhtml_sec59)\n- [Inheriting class properties](#chapter07.xhtml_sec60)\n\
    - [Calling base constructors](#chapter07.xhtml_sec61)\n- [Overriding base methods](#chapter07.xhtml_sec62)\n\
    - [Summary](#chapter07.xhtml_sec63)\n\n## Encapsulating data\n\nA class is a data\
    \ structure that can contain both variables and functions in a single entity.\
    \ These are collectively known as its “members”, and the functions are known as\
    \ its “methods”.\n\nAccess to class members from outside the class is controlled\
    \ by “access specifiers” in the class declaration. Typically, these will deny\
    \ access to the variable members, but allow access to methods that can store and\
    \ retrieve data from those variable members. This technique of “data hiding” ensures\
    \ that stored data is safely encapsulated within the class variable members, and\
    \ is the first principle of Object Oriented Programming (OOP).\n\n![image](images/pg116_1.jpg)\n\
    \nA class declaration begins with the `class` keyword, followed by a space, then\
    \ a programmer-specified name – adhering to the usual C++ naming conventions,\
    \ but beginning in uppercase. Next, come the access specifiers and class members,\
    \ contained within a pair of braces. Every class declaration must end with a semicolon\
    \ after the closing brace – so the class declaration syntax looks like this:\n\
    \n```cpp\nclass ClassName\n{\n    access specifier :\n        member1 ;\n    \
    \    member2 ;\n    access specifier :\n        member3 ;\n        member4 ;\n\
    };\n```\n\nAn access specifier may be any one of the keywords `public`, `private`,\
    \ or `protected` to specify access rights for its listed members:\n\n- Public\
    \ members are accessible from any place where the class is visible.\n- Private\
    \ members are accessible only to other members of the same class.\n- Protected\
    \ members are accessible only to other members of the same class and to members\
    \ of classes derived from that class.\n\nBy default, all class members have private\
    \ access – so any members that appear in the class declaration without an access\
    \ specifier will have private access.\n\n![image](images/forget.jpg)\n\nDerived\
    \ classes, which use the `protected` access specifier, are introduced later in\
    \ this chapter.\n\nAny real-world object can be defined by its attributes and\
    \ by its actions. For example, a dog has attributes such as age, weight, and color,\
    \ and actions it can perform such as bark. The class mechanism in C++ provides\
    \ a way to create a virtual dog object within a program, where the variable members\
    \ of a class can represent its attributes, and the methods represent its actions:\n\
    \n```cpp\nclass Dog\n{\n    private: // The default access level.\n        int\
    \ age, weight ;\n        string color;\n    public :\n        void bark() ;\n\
    \        // ... Plus methods to store/retrieve data.\n};\n```\n\n![image](images/forget.jpg)\n\
    \nWhile a program class cannot perfectly emulate a real-word object, the aim is\
    \ to encapsulate all relevant attributes and actions.\n\nIt is important to recognize\
    \ that a class declaration only defines a data structure – in order to create\
    \ an object you must declare an “instance” of that data structure. This is achieved\
    \ in just the same way that instances are declared of regular C++ data types:\n\
    \n| `int num ;` | `// Creates an instance named “num”. // of the regular C++ int\
    \ data type.` |\n| `Dog fido ;` | `// Creates an instance named “fido”. // of\
    \ the programmer-defined Dog data structure.` |\n\nAlternatively, an instance\
    \ object can be created by specifying its name between the class declaration’s\
    \ closing brace and its final semicolon. Multiple instances can be created this\
    \ way, by specifying a comma-separated list of object names. For example, the\
    \ class declaration listed below creates four instance objects of the Dog class\
    \ named “fido”, “pooch”, “rex”, and “sammy”.\n\n```cpp\nclass Dog\n{\n    int\
    \ age, weight ;\n    string color;\n    public:\n        void bark() ;\n     \
    \   // ... Plus methods to store/retrieve data.\n} fido, pooch, rex, sammy ;\n\
    ```\n\nThe principle of encapsulation in C++ programming describes the grouping\
    \ together of data and functionality in class members – age, weight, color attributes\
    \ and bark action in the Dog class.\n\n![image](images/hot.jpg)\n\nIt is conventional\
    \ to begin class names with an uppercase character and object names with lowercase.\n\
    \n## Creating an object\n\nIn order to assign and retrieve data from private members\
    \ of a class, special public accessor methods must be added to the class. These\
    \ are “setter” methods, to assign data, and “getter” methods, to retrieve data.\
    \ Accessor methods are often named as the variable they address, with the first\
    \ letter made uppercase, and prefixed by “set” or “get” respectively. For example,\
    \ accessor methods to address an `age` variable may be named `setAge()` and `getAge()`.\n\
    \n![image](images/pg116.jpg)\n\n(Note: The remaining text appears to be a fragmented\
    \ reconstruction/scrambled in the user-provided source, I have maintained the\
    \ logical flow based on the provided snippets.)\n"
  raw: '•The **&** reference operator can be used to reference the memory address
    stored within a pointer.


    •References are easier to use than pointers but, unlike pointers, a reference
    must always be initialized in its declaration and can never be assigned a different
    variable.


    7


    **Creating classes and objects**


    ***This chapter introduces the topics of encapsulation and inheritance – the first
    two principles of C++ Object Oriented Programming.***


    [Encapsulating data](#chapter07.xhtml_sec55)


    [Creating an object](#chapter07.xhtml_sec56)


    [Creating multiple objects](#chapter07.xhtml_sec57)


    [Initializing class members](#chapter07.xhtml_sec58)


    [Overloading methods](#chapter07.xhtml_sec59)


    [Inheriting class properties](#chapter07.xhtml_sec60)


    [Calling base constructors](#chapter07.xhtml_sec61)


    [Overriding base methods](#chapter07.xhtml_sec62)


    [Summary](#chapter07.xhtml_sec63)


    **Encapsulating data**


    A class is a data structure that can contain both variables and functions in a
    single entity. These are collectively known as its “members”, and the functions
    are known as its “methods”.


    Access to class members from outside the class is controlled by “access specifiers”
    in the class declaration. Typically, these will deny access to the variable members,
    but allow access to methods that can store and retrieve data from those variable
    members. This technique of “data hiding” ensures that stored data is safely encapsulated
    within the class variable members, and is the first principle of Object Oriented
    Programming (OOP).


    ![image](images/pg116_1.jpg)


    A class declaration begins with the **class** keyword, followed by a space, then
    a programmer-specified name – adhering to the usual C++ naming conventions, but
    beginning in uppercase. Next, come the access specifiers and class members, contained
    within a pair of braces. Every class declaration must end with a semicolon after
    the closing brace – so the class declaration syntax looks like this:


    ***class ClassName***


    **{**


    ***access specifier* :**


    ***member1* ;**


    ***member2* ;**


    ***access specifier* :**


    ***member3* ;**


    ***member4* ;**


    **} ;**


    An access specifier may be any one of the keywords **public**, **private**, or
    **protected** to specify access rights for its listed members:


    •Public members are accessible from any place where the class is visible.


    •Private members are accessible only to other members of the same class.


    •Protected members are accessible only to other members of the same class and
    to members of classes derived from that class.


    By default, all class members have private access – so any members that appear
    in the class declaration without an access specifier will have private access.


    ![image](images/forget.jpg)


    Derived classes, which use the **protected** access specifier, are introduced
    later in this chapter.


    Any real-world object can be defined by its attributes and by its actions. For
    example, a dog has attributes such as age, weight, and color, and actions it can
    perform such as bark. The class mechanism in C++ provides a way to create a virtual
    dog object within a program, where the variable members of a class can represent
    its attributes, and the methods represent its actions:


    **class Dog**


    **{**


    **private: // The default access level.**


    **int age, weight ;**


    **string color ;**


    **public :**


    **void bark() ;**


    **// ... Plus methods to store/retrieve data.**


    **} ;**


    ![image](images/forget.jpg)


    While a program class cannot perfectly emulate a real-word object, the aim is
    to encapsulate all relevant attributes and actions.


    It is important to recognize that a class declaration only defines a data structure
    – in order to create an object you must declare an “instance” of that data structure.
    This is achieved in just the same way that instances are declared of regular C++
    data types:


    | **int num ;** | **// Creates an instance named “num”.****// of the regular C++
    int data type.** |


    | **Dog fido ;** | **// Creates an instance named “fido”.****// of the programmer-defined
    Dog data structure.** |


    Alternatively, an instance object can be created by specifying its name between
    the class declaration’s closing brace and its final semicolon. Multiple instances
    can be created this way, by specifying a comma-separated list of object names.
    For example, the class declaration listed below creates four instance objects
    of the Dog class named “fido”, “pooch”, “rex”, and “sammy”.


    **class Dog**


    **{**


    **int age, weight ;**


    **string color ;**


    **public:**


    **void bark() ;**


    **// ... Plus methods to store/retrieve data.**


    **} fido, pooch, rex, sammy ;**


    The principle of encapsulation in C++ programming describes the grouping together
    of data and functionality in class members – age, weight, color attributes and
    bark action in the Dog class.


    ![image](images/hot.jpg)


    It is conventional to begin class names with an uppercase character and object
    names with lowercase.


    **Creating an object**


    In order to assign and retrieve data from private members of a class, special
    public accessor methods must be added to the class. These are “setter” methods,
    to assign data, and “getter” methods, to retrieve data. Accessor methods are often
    named as the variable they address, with the first letter made uppercase, and
    prefixed by “set” or “get” respectively. For example, accessor methods to address
    an **age** variable may be named **setAge()** and **getAge()**.


    ![image](images/pg118_1.jpg)


    ![image](images/1v.jpg)Start a new program by specifying the C++ library classes
    to include, and a namespace prefix to use


    **#include <string>**


    **#include <iostream>**


    **using namespace std ;**


    ![image](images/commonv.jpg)


    object.cpp


    ![image](images/2v.jpg)Declare a class named “Dog”


    **class Dog**


    **{**


    **} ;**


    ![image](images/3v.jpg)Between the braces of the Dog class declaration, declare
    three **private** variable members


    **int age, weight ;**


    **string color ;**


    ![image](images/4v.jpg)After the **private** variables, add a **public** access
    specifier


    **public:**


    ![image](images/5v.jpg)Begin the **public** members list by adding a method to
    output a **string** when called


    **void bark() { cout << “WOOF!” << endl ; }**


    ![image](images/6v.jpg)Add **public** setter methods – to assign individual values
    to each of the **private** variables


    **void setAge ( int yrs ) { age = yrs ; }**


    **void setWeight ( int lbs ) { weight = lbs ; }**


    **void setColor ( string hue ) { color = hue ; }**


    ![image](images/7v.jpg)Add **public** getter methods – to retrieve individual
    values from each of the **private** variables


    **int getAge()      { return age ; }**


    **int getWeight() { return weight ; }**


    **string getColor() { return color ; }**


    ![image](images/forget.jpg)


    Members declared before an access specifier are **private** by default, and remember
    to add a final semicolon after each class declaration.


    ![image](images/hot.jpg)


    In the class declaration, notice that all methods are declared **public** and
    all variables are declared **private**. This notion of “public interface, private
    data” is a key concept when creating classes.


    ![image](images/8v.jpg)After the Dog class declaration, declare a main method
    containing a final **return** statement


    **int main()**


    **{**


    **// Program code goes here.**


    **return 0 ;**


    **}**


    ![image](images/9v.jpg)Between the braces of the main method, declare an instance
    of the Dog class named “fido”


    **Dog fido ;**


    ![image](images/pg119_1.jpg)


    Fido


    ![image](images/10v.jpg)Add statements calling each setter method to assign data


    **fido.setAge( 3 ) ;**


    **fido.setWeight( 15 ) ;**


    **fido.setColor( “brown” ) ;**


    ![image](images/11v.jpg)Add statements calling each getter method to retrieve
    the assigned values


    **cout << “Fido is a “ << fido.getColor() <<**


    **“ dog” << endl ;**


    **cout << “Fido is “ << fido.getAge() <<**


    **“ years old” << endl ;**


    **cout << “Fido weighs “ << fido.getWeight() <<**


    **“ pounds” << endl ;**'
