    **Adjusting the interface**


    The app test for narrow display areas [here](#chapter10.xhtml_lic) failed to satisfactorily
    present the controls, as the interface is too wide for smaller display areas.
    Happily, the interface can be made to adapt to different sizes so it can also
    look good on narrow display areas. The adaptation relies upon recognizing the
    display area size and changing the orientation of a <StackPanel> element in **XAML**
    for narrow display areas:'
