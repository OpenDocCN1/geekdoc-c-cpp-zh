- fmt: "\n![image](images/forget.jpg)\n\nThe backslash `\\` character is required\
    \ to escape the apostrophe in strings.\n\n## Providing capability classes\n\n\
    Classes whose sole purpose is to allow other classes to be derived from them are\
    \ known as “capability classes” – they provide capabilities to the derived classes.\n\
    \n![image](images/pg140_1.jpg)\n\nCapability classes generally contain no data,\
    \ but merely declare a number of virtual methods that can be overridden in their\
    \ derived classes.\n\nThe following example builds upon the previous example to\
    \ demonstrate how the `Bird` class can be better written as a capability class.\
    \ Its methods no longer contain output statements, but return a `-1` (error) value\
    \ if they are called explicitly. \n\nIt is necessary to change the return type\
    \ of those methods from `void` to `int,`, and these changes must also be reflected\
    \ in each overriding method in the derived classes.\n\n![image](images/1b.jpg)Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n\n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n\
    ![image](images/commonb.jpg)\n\n`capability.cpp`\n\n![image](images/2b.jpg)Declare\
    \ a base capability class named “Bird”, containing two virtual method declarations\
    \ that will signal an error if called explicitly\n\n```cpp\nclass Bird\n{\npublic\
    \ :\n    virtual int Talk() const { return -1 ; }\n    virtual int Fly() const\
    \ { return -1 ; }\n} ;\n```\n\n![image](images/3b.jpg)Declare a derived class\
    \ named “Pigeon”, containing two methods to override those in the base class\n\
    \n```cpp\nclass Pigeon : public Bird\n{\npublic :\n    int Talk() const { cout\
    \ << “Coo! Coo!” << endl ; return 0 ; }\n    int Fly() const { cout << “A pigeon\
    \ flies away...” << endl ; return 0 ; }\n} ;\n```\n\n![image](images/forget.jpg)\n\
    \nThe return value of overriding methods in derived classes must match those declared\
    \ in the base class.\n\n![image](images/4b.jpg)Declare a derived class named “Chicken”\
    \ containing two methods to override those in the base class\n\n```cpp\nclass\
    \ Chicken : public Bird\n{\npublic :\n    int Talk() const { cout << “Cluck! Cluck!”\
    \ << endl ; return 0 ; }\n    int Fly() const { cout << “I’m just a chicken –\
    \ I can\\’t fly!” << endl ; return 0 ; }\n} ;\n```\n\n![image](images/5b.jpg)Declare\
    \ a main method creating base class pointers binding the derived classes\n\n```cpp\n\
    int main()\n{\n    Bird* pPigeon = new Pigeon ;\n    Bird* pChicken = new Chicken\
    \ ;\n}\n```\n\n![image](images/6b.jpg)In the main method, insert method calls\
    \ and a statement to terminate the program when an error is met by explicitly\
    \ calling a base class method\n\n```cpp\npPigeon -> Talk() ;\npChicken -> Talk()\
    \ ;\npPigeon -> Bird::Talk() ;\nif ( -1 ) { cout << “Error! - Program ended.”\
    \ << endl ; return 0 ; }\npPigeon -> Fly() ;  // Call will not be made.\npChicken\
    \ -> Fly() ; // Call will not be made.\nreturn 0 ;  // Statement will not be executed.\n\
    ```\n\n![image](images/7b.jpg)Save, compile, and run the program to see the output\n\
    \n![image](images/pg141_1.jpg)\n\n![image](images/snake.jpg)\n\nCapability class\
    \ methods are intended to be overridden in derived classes – they should not be\
    \ called explicitly.\n\n![image](images/hot.jpg)\n\nRefer back to [here](#chapter05.xhtml_sec42)\
    \ and [here](#chapter05.xhtml_Replacethe) for more details on error handling.\n\
    \n## Making abstract data types\n\nAn Abstract Data Type (ADT) represents a concept,\
    \ rather than a tangible object, and is always the base to other classes. A base\
    \ class can be made into an ADT by initializing one or more of its methods with\
