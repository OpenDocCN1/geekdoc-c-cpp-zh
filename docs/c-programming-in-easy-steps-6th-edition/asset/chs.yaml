  \n## 声明常量\n\n在程序执行期间不会更改的数据应该存储在常量容器中，而不是变量中。这使得编译器能够更好地检查代码中的错误——如果程序尝试更改存储在常量的值，编译器将报告错误导致编译失败。\n\
  \n![image](img/pg22_1.jpg)\n\n通过在变量声明前加上 `const` 关键字并后跟一个空格，可以为任何数据类型创建常量。通常，常量名使用大写字母，以将它们区别于（小写的）变量名。与变量不同，常量必须在声明时初始化。例如，数学值\
  \ pi 的常量的声明如下：\n\n`const double PI = 3.1415926536 ;`\n\n`enum` 关键字提供了一种简洁创建整数常量序列的方便方法。可选情况下，声明可以在\
  \ `enum` 关键字之后包含该序列的名称。常量名在花括号内以逗号分隔的列表形式出现。例如，此声明创建了一个常量序列：\n\n`enum suit { CLUBS\
  \ , DIAMONDS , HEARTS , SPADES } ;`\n\n默认情况下，每个常量的值都比列表中前一个常量大一。除非指定，否则第一个常量将有一个值。有时使用\
  \ `typedef` 关键字来定义枚举常量列表是方便的。`typedef` 关键字简单地为结构体创建一个别名。\n\n```cpp\ntypedef enum\
  \ { NEGATIVE , POSITIVE } charge;\n```\n\n然后可以像往一样创建自定义类型的变量。例如，对于上面的示例，将 `POSITIVE`\
  \ 常量赋值给 `charge` 变量实际上赋值了 1。\n\n![image](img/1b.jpg) 通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\
  \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonb.jpg)\n\
  \nconstant.cpp\n\n![image](img/2b.jpg) 添加一个包含最终返回语句的 main 函数\n\n```cpp\nint main()\n\
  {\n    // 程序代码在此处。\n    return 0 ;\n}\n```\n\n![image](img/3b.jpg) 在 main 函数中，插入语句来声明常量并输出常量值\n\
  \n`const double PI = 3.1415926536 ;`\n`cout << “6 circumference: ” << (PI * 6) <<\
  \ endl;`\n\n![image](img/4b.jpg) 接下来，插入语句声明枚举常量列表并输出某些常量值\n\n```cpp\nenum { RED=1,\
  \ YELLOW, GREEN, BROWN, BLUE, PINK, BLACK } ;\ncout << “I shot a red worth: ” <<\
