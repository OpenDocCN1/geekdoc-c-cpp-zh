  \n![image](img/hot.jpg)\n\n三元运算符可以返回任何数据类型的值 —— 数字、字符串、布尔值等。\n\n### 确定大小\n\n变量声明分配系统内存，用于存储赋值给该变量的值。为此分配的内存量取决于系统和数据类型。\n\
  \n![image](img/pg36_1.jpg)\n\n通常，`int` 数据类型默认创建为“长型”（long）值，它可以存储从 +2,147,483,647\
  \ 到 -2,147,483,648 的值。另一方面，如果 `int` 数据类型默认创建为“短型”（short）值，它只能存储从 +32,767 到 -32,768\
  \ 的值。\n\n在声明变量时，通过在 `int` 关键字前加上 `short` 或 `long` 修饰符可以显式指定首选范围。当你确定永远不会超出限制范围时，`short\
  \ int` 有助于节省内存空间。\n\n当声明 `int` 变量时，它默认包含正整数或负整数，这些被称为“有符号”（signed）值。如果变量始终只包含正整数，可以将其限定为\
  \ `unsigned`无符号）以增加其最大可能值。通常，`unsigned short int` 的范围从 0 到 65,535，`unsigned long\
  \ int` 的范围从 0 到 4,294,967,295。\n\n可以使用 C++ 的 `sizeof` 运算符发现任何变量的内存大小。可以使用 `sizeof`\
  \ 检查要检查的变量名。\n\n\n\n\n\n| `( )` | 函数调用 | `[ ]` | 数组索引 | LTR |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| `->` | 类指针 | `.` | 类成员 | |\n| `!` | 逻辑非 | `*` | 指针 | RTL |\n\
  | `--` | 递减 | `++` | 增 | |\n| `+` | 正号 | `-` | 负号 | |\n| `sizeof` | 大小 | `&` | 地址\
  \ | |\n| `*` | 乘法 | `/` | 除法 | LTR |\n| `%` | 取模 | | | |\n| `+` | 加法 | `-` | 减法\
  \ | LTR |\n| `<=` | 小于等于 | `<` | 小于 | LTR |\n| `>=` | 大于等于 | `>` | 大于 | |\n| `==`\
  \ | 等于 | `!=` |不等 | LTR |\n| `&&` | 逻辑与 | | | LTR |\n| `||` | 逻辑或 | | | LTR |\n\
  | `?:` | 三元运算符 | | | RTL |\n| `+= -= *= /= %=` | 赋值 | RTL | | |\n| `,` | 逗号 | |\
  \ | LTR |\n\n除了表中的运算符外，还有许多“位”运算符，用于执行二进算术。这超出了本书的范围，但在[C 语言编程快速入门](http://www.ineasysteps.com/)中有一个专门介绍二进制算术的章节。这些运算符在\
