  \n## 插入页面组件\n\nVisual Studio 提供了一个双部分窗口来向 UWP 应用中插入界面组件。这包含了组件的**设计**视图和用于 XAML\
  \ 代码的 **XAML** 视图：\n\n![image](img/1g.jpg)打开**解决方案管理器**，然后双击 `MainPage.xaml` – 启动双部分窗口\n\
  \n![image](img/pg172_1.jpg)\n\n![image](img/commong.jpg)\n\nUniversal\n\n![image](img/2g.jpg)看到默认情况下，**设计**视图在**横**模式下显示空白画布\n\
  \n![image](img/pg172_2.jpg)有一个弹出的**工具箱**功能，允许您向画布上添加组件，但稍后需要在 XAML 代码中对它们进行编辑。在本示例中，组件从一开始就开始在\
  \ XAML 代码中创建。\n\n![image](img/hot.jpg)\n\nXAML 的发音为“zammel”。\n\n![image](img/3g.jpg)现在，看到默认情况下，**XAML**\
  \ 视图显示存在 `<Grid> </Grid>` 标签 – 这是画布的根元素，您可以在其中添加组件元素\n\n![image](img/pg173_1.jpg)组件元素最好嵌套在\
  \ `<StackPanel>` 元素中，因为可以给它赋予一个 `x:Name` 以在功能代码中引用，并赋予一个 `Orientation` 属性以指定嵌套元素出现的方向。常见的组件元素包括\
  \ `<Image>`、`<TextBox>`、`<TextBlock>`（标签）和 `<Button>`。多个 `<StackPanel>` 元素相互嵌套可以确定组件的**水平**和**垂直**布局：\n\
  \n![image](img/4g.jpg)在根 `<Grid> </Grid>` 标签之间插入元素，使 **XAML** 视图代码看起来恰好像这样：\n\n\
  ![image](img/pg173_2.jpg)\n\n![image](img/5g.jpg)当您在**设计**视图中添加组件时，它们看起来所示：\n\n\
  ![image](img/pg173_3.jpg)\n\n```xml\n<Grid>\n    <StackPanel>\n        <Image x:Name=\"\
  image1\" />\n        <TextBox x:Name=\"textbox1\" />\n        <TextBlock x:Name=\"\
  textblock1\" Text=\"Label\" />\n        <Button x:Name=\"button1\" Content=\"Click\"\
  \ />\n    </StackPanel>\n</Grid>\n```\n\n## 导入资源\n\n为了让 `<Image>` 组件显示图形，首先需要将图像文件添加到项目的\
