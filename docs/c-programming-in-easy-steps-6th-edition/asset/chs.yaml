  \n![image](img/hot.jpg)\n\n布尔变量名始终以“is”开头，以便它们能立即识别为布尔值。此外，对于所有由多个单词组成的变量名使用“驼峰命名法”（lowerCamelCase）——除第一个单词外的所有单词大大写开头，如\
  \ `isTrue`。\n\n## 使用变量数组\n\n数组是一个可以存储多个数据项的变量——与普通变量不同，后者只能存储一个数据。数据项顺序存储在数组“元素”中，从\
  \ 0 开始编号。因此，第一个值存储在元素 0 中，第二个值存储在元素 1 中，以此此类推。\n\n![image](img/pg18_1.jpg)\n\n数组的声明方式与其他变量相同，此外在声明中必须指定数组的大小，放在数组名称后的方括号中。例如，声明一个名为\
  \ `nums` 存储六个整数的数组的语法如下：\n\n```cpp\nint nums[6] ;\n```\n\n可选，可以在声明时通过用大括号括起来逗号分隔列表为每个元素赋值来初始化数组。例如：\n\
  \n```cpp\nint nums[6] = { 0, 1, 2, 3, 4, 5 } ;\n```\n\n![image](img/snake.jpg)\n\
  \nC++ 中的名称是区分大小写的——因此，名为 `VAR`、`Var` 和 `var` 的变量被视为三个独立的变量。传统上，C++ 变量名是小写且很少以下划线开头，因为某些\
  \ C++ 库使用了这种约定。\n\n下表列出了五种基本的 C++ 数据类型，并带有简要描述和示例内容：\n\n| 数据类型 | 描述 | 示例 |\n| :---\
  \ | :--- | :--- |\n| `char` | 单字节，可以存储一个字符 | ‘A’ |\n| `int` | 整数 | `100` |\n| `float`\
  \ | 浮点数，精确到六位小数 | `0.123456` |\n| `double` | 浮点数，精确到十位小数 | `0.0123456789` |\n| `bool`\
  \ | `true` 或 `false` 的布尔值，或者数值上零为假，任何非零为真 | `false` 或 `0`, `true` 或 `1` |\n\n\n\n\
  \n循环结构在第 3 章中引入，通常用于遍历数组元素。\n\n## 使用向量数组\n\n向量（vector）是普通数组的替代方案，它的优点是大小可以根据程序需要进行更改。与普通数组一样，可以为任何数据类型创建向量，并且它们的元素也从\
  \ 0 开始编号。\n\n![image](img/pg20_1.jpg)\n\n为了在程序中使用向量，必须在程序开头使用 `#include <vector>`\
  \ 预处理指令添加 C++ `vector` 库。该库包含了下表中的预定义函数，用于操作向量：\n\n| **函数:** | **描述:** |\n| :---\
  \ | :--- |\n| `at(number)` | 获取指定元素编号包含的值 |\n| `back()` | 获取最后一个元素的值 |\n| `clear()`\
  \ | 移除所有向量元素 |\n| `empty()` | 如果向量为空则返回 true (1)，否则返回 false (0) |\n| `front()` |\
  \ 获取第一个元素的值 |\n| `pop_back()` | 移除最后一个元素 |\n| `push_back(value)` | 在向量末尾添加一个包含指定值的最终元素\
  \ |\n| `size()` | 获取元素数量 |\n\n创建向量的声明如下：\n\n`vector < data-type > vector-name (\
  \ size ) ;`\n\n一个 `int` 向量默认情况下，每个元素都会自动初始化为零值。可选情况下，可以在声明中的大小之后指定一个不同的初始值，语法如下：\n\
  \n`vector < data-type > vector-name ( size , initial-value ) ;`\n\n操作向量的函数只需通过点操作符（dot\
  \ operator）附加到所选的向量名称即可。例如，要获取名为“vec”的向量的大小，可以使用 `vec.size()`。\n\n![image](img/forget.jpg)\n\
  \n单个向量元素可以像普通数组一样使用方括号引用，例如 `vec[3]`。\n\n![image](img/1b.jpg) 通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\
  \n```cpp\n#include <vector>  // 向量支持。\n#include <iostream>\nusing namespace std\
  \ ;\n```\n\n![image](img/commonb.jpg)\n\nvector.cpp\n\n![image](img/2b.jpg) 添加一个包含最终返回语句的\
