  \n## 设计布局\n\n为了完成应用的布局，可以在 XAML 元素标签中添加设计属性，以指定它们显示的内容以及它们在界面上的精确位置：\n\n![image](img/1g.jpg)打开\
  \ `MainPage.xaml`，然后为外部 `<StackPanel>` 元素添加两个属性以固定其位置 `HorizontalAlignment=\"Left\"\
  \ VerticalAlignment=\"Top\"`\n\n接下来，通过修改初始分配值 200 来编辑 `<Image>` 元素 – 将其宽度 **Width=\"\
  300\"**\n\n\n\n\n\n![image](img/3g.jpg)现在，为嵌套的 `<StackPanel>` 元素添加一个属性来固定它的位置\n\n\
  ```xml\nVerticalAlignment = ”Center”\n```\n\n![image](img/4g.jpg)然后，修改所有六个 `<TextBlock>`\
  \ 元素以指定初始内容、宽度以及四个边的边距\n\n```xmlText = ”...” Width = ”20” Margin = ”15”\nText =\
  \ ”...” Width = ”20” Margin = ”15”\nText = ”...” Width = ”20” Margin = ”15”\nText\
  \ = ”...” Width = ”20” Margin = ”15”\nText = ”...” Width = ”20” Margin = ”15”\n\
  Text = ”...” Width = ”20” Margin = ”15”\n```\n\n![image](img/5g.jpg)编辑第一个 `<Button>`\
  \ 元素进行重命名，指定它的按钮标签内容，并设置它的四个边边距\n\n```xmlx:Name = “BtnPick” Content = “Get My Lucky\
  \ Numbers”\nMargin = “15”\n```\n\n![image](img/6g.jpg)编辑第二个 `<Button>` 元素进行重命名并指定它的按钮标签内容\n\
  \n```xmlx:Name = “BtnReset” Content = ”Reset”\n```\n\n![image](img/7g.jpg)最后，为每个相应的\
  \ `<Button>` 元素添加属性以指定它们的默认状态\n\n```xmlIsEnabled = ”True”\nIsEnabled = “True”\n\
  ```\n\n![image](img/hot.jpg)\n\n单个 `Margin` 值会设置该组件周围的所有四个边距。你可以指定两个值来设置左右和上下边距；例如\
  \ `Margin = ”10,30”`。或者，你也可以指定四个值来分别设置左、上、右、下边距；例如 `Margin = “10,30,10,50”`。\n\n\
  属性在每个元素中出现的顺序并不重要，但 `MainPage.xaml` 文件中的元素现在应该类似于下方的截图：\n\n![image](img/pg177_2.jpg)\n\
  \n![image](img/pg177_1.jpg)\n\n当你更改 `XAML` 视图代码时，`Design` 视图中的组件布局会随之改变，现在看起来应该是这样的：\n\
  \n![image](img/pg177_3.jpg)\n\n![image](img/hot.jpg)\n\n你可以选择性添加 `Margin = ”0”`\
  \ 属性，以显式要求元素没有边距宽度。\n\n### 添加运行时功能\n\n在此处使用 `XAML` 元素完成应用程序组件布局后，你现在准备好使用 C++ 编程代码添加功能了：\n\
  \n![image](img/1g.jpg)在 `Design` 视图中，双击 `BtnPick` 按钮\n\n![image](img/commong.jpg)\n\
  \n通用\n\n![image](img/2g.jpg)`MainPage.xaml.cpp` 后代码页面将在 `Code Editor` 中打开，并位于生成的\
  \ `BtnPick_Click` 事件处理程序\n\n![image](img/3g.jpg)在 `BtnPick_Click` 事件处理块中，插入这些语句来创建一个\
  \ 1 到 59 之间的随机整数数组\n\n```cpp\nint i , j , k , seq[ 60 ] ;\nsrand( ( int ) time(\
  \ 0 ) ) ;\nfor ( i = 1 ; i < 60 ; i++ ) seq[ i ] = i ;\nfor ( i = 1 ; i < 60 ; i++\
  \ )\n{\nj = ( ( int ) rand( ) % 59 ) + 1 ;\nk = seq[ i ] ; seq[ i ] = seq[ j ] ;\
  \ seq[ j ] = k ;\n}\n// 在此处插入语句（步骤 4-5）。\n```\n\n![image](img/4g.jpg)接下来，插入语句将六个数组元素值赋值给\
  \ `<TextBlock>` 组件\n\n```cpp\ntextBlock1->Text = seq[ 1 ].ToString( ) ;\ntextBlock2->Text\
  \ = seq[ 2 ].ToString( ) ;\ntextBlock3->Text = seq[ 3 ].ToString( ) ;\ntextBlock4->Text\
  \ = seq[ 4 ].ToString( ) ;\ntextBlock5->Text = seq[ 5 ].ToString( ) ;\ntextBlock6->Text\
  \ = seq[ 6 ].ToString( ) ;\n```\n\n![image](img/5g.jpg)接下来，插入语句设置 `<Button>` 状态\n\
  \n```cpp\nBtnPick->IsEnabled = false ;\nBtnReset->IsEnabled = true ;\n```\n\n![image](img/6g.jpg)返回\
  \ `MainPage.xaml`，然后在 `Design` 视图中，双击 `BtnReset` 按钮\n\n![image](img/7g.jpg)`MainPage.xaml.cpp`\
  \ 后代码页面将在 `Code Editor` 中打开，并位于生成的 `BtnReset_Click` 事件处理程序\n\n![image](img/hot.jpg)\n\
