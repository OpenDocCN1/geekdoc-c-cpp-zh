  \ ” << ( RED + BLUE ) << endl;\n```\n\n![image](img/5b.jpg) 现在，插入语句声明自定义数据类型并输出其赋值值\n\
  \n```cpp\ntypedef enum { NEGATIVE , POSITIVE } charge;\ncharge neutral = NEGATIVE\
