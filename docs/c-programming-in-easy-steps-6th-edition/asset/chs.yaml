  \n### 优化函数\n\n函数可以递归地调用自身，以重复执行其函数体包含的语句——类似于循环。和循环一样，递归函数必须包含一个增量器和一个条件测试，以便再次调用自身，或者在满足条件时停止重复。递归函数的语法如下：\n\
  \n```cpp\nreturn-data-type function-name ( argument-list )\n{\n  statements-to-be-executed\
  \ ;\n  incrementer ;\n  conditional-test-to-recall-or-exit ;\n}\n```\n\n![image](img/pg58_1.jpg)\n\
  \n增量器会改变所传参数的值——因此后续调用会将调整后的值传回函数。\n\n![image](img/1g.jpg)通过指定要包含的 C++ 库类和使用的命名空间前缀开始一个新程序\n\
  \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commong.jpg)\n\
  \noptimize.cpp\n\n![image](img/2g.jpg)在预处理器指令下方，声明两个都是递归函数的原型\n\n```cpp\nint computeFactorials\
  \ ( int, int ) ;\nint factorial ( int ) ;\n```\n\n![image](img/3g.jpg)在原型声明下方，添加一个包含最终\
  \ `return` 语句的 `main` 函数\n\n```cpp\nint main()\n{\n  // Program code goes here.\n\
  \  return 0 ;\n}\n```\n\n![image](img/4g.jpg)在 `main` 函数之后，添加第一个函数原型的定义——一个递归函数\n\
  \n```cpp\nint computeFactorials( int num, int max )\n{\n  cout << “Factorial of\
  \ “ << num << “: ” ;\n  cout << factorial( num ) << endl ;  // Statements.\n  num++\
  \ ;  // Incrementer.\n  if ( num > max ) return 0 ;  // 退出或再次调用.\n  else return\
  \ computeFactorials( num , max ) ;\n}\n```\n\n![image](img/hot.jpg)\n\n递归函数通常比循环消耗更多的系统资源——但它可以使代码更易读。\n\
  \n![image](img/5g.jpg)为第二个原型定义一个递归函数\n\n```cpp\nint factorial( int n )\n{\n  int\
  \ result ;\n  if ( n == 1 ) result = 1 ;  // 退出或...\n  else result = ( factorial(\
  \ n - 1 ) * n ) ;  // 递减...\n  return result ;  // 再次调用.\n}\n```\n\n![image](img/6g.jpg)在\
  \ `main` 函数开始处，插入对递归函数的调用\n\n```cpp\ncomputeFactorials( 1, 8 ) ;\n```\n\n![image](img/7g.jpg)保存、编译并运行程序查看输出\n\
  \n![image](img/pg59_1.jpg)\n\n![image](img/forget.jpg)\n\n如果你意外运行了无限递归，请按下 `Ctrl\
  \ + C` 键终止进程。\n\n输出列出了阶乘值（3 的阶乘是 3x2x1=6 等），但可以通过优化 `factorial()` 函数来改进程序。该函数如果使用三元运算符，不需要变量。\n\
  \n![image](img/8g.jpg)用三元运算符替换 `factorial()` 函数\n\n```cpp\ninline factorial( int\
  \ n )\n{\n  return ( n == 1 ) ? 1 : ( factorial( n - 1 ) * n ) ;\n}\n```\n\n\n\n\
  \n\n![image](img/pg62_1.jpg)\n\n与`<iostream>`类库一样，`<string>` 库是 `std` 命名空间的一部分，C++\
  \ 标准库类都使用了该命名空间。这意味着字符串对象可以被称为 `std::string`，或者在程序开头包含 `using namespace std;` 指令时，更简单地简称为\
  \ `string`。\n\n一旦`<string>` 库可用，就可以像声明其他变量一样声明一个 `string` “变量”。在声明时，可以选择性使用 `=`\
  \ 赋值运算符对变量进行初始化，也可以在程序的稍后部分进行初始化。\n\n此外，可以通过在变量名后的括号中包含一个文本字符串来初始化 `string` 变量。\n\
  \nC++ 中的文本字符串必须始终包含在双引号 “ ” 之内——单引号 ' ' 仅用于围绕 `char` 数据类型的字符值。\n\n与 C 语言程序员必须使用的\
  \ `char` 数组相比，C++ `string` 变量处理起来要容易得多，因为它会自动调整大小以容纳任何文本字符串的长度。在更底层的层级上，文本仍然存储为字符数组，但\
  \ `string` 变量允许你忽略这些细节。因此，可以使用 `=` 赋值运算符将字符数组赋值给 `string` 变量。\n\n需要记住，当将数值赋给 `string`\
  \ 变量时，它们不再是数值数据类型，因此不能对它们进行算术运算。例如，尝试用 `+` 加法运算符相加“7”和“6”的 `string` 值会产生拼接后的字符串“76”，而不是数值值\
  \ 13。在这种情况下，`+` 运算符识别出上下文不是算术运算，因此采用“字符串连接运算符”的外壳来合并两个字符串。同样，`+=` 运算符将一个 `string`\
  \ 追加到另一个 `string` 之后，这对于构建长文本字符串非常有用。\n\n在此处 描述的示例程序中，有几个 `string` 值被构建在一个长字符串中。\n\
  \n![image](img/1p.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <string>\
  \  // 字符串支持。\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonp.jpg)\n\
  \nstring.cpp\n\n![image](img/2p.jpg)添加一个包含四个 string 变量声明和一个最终返回语句的 main 函数\n\n```cpp\n\
  int main()\n{\n    string text = “9” ;\n    string term( “9 “ ) ;\n    string info\
  \ = “Toys” ;\n    string color ;\n    // 在此处添加更多语句。\n    return 0 ;\n}\n```\n\n\
  ![image](img/3p.jpg)在 main 函数中，变量声明之后插入语句来声明并初始化字符数组，然后将其值赋予未初始化的 string 变量\n\n\
  ```cpp\nchar hue[4] = { ‘R’, ’e’, ’d’, ’\\0’ } ;\ncolor = hue ;\n```\n\n![image](img/4p.jpg)将较长的文本字符串赋值其中一个\
  \ string 变量\n\n```cpp\ninfo = “Balloons” ;\n```\n\n![image](img/5p.jpg)通过组合第一个 string\
  \ 变量中的所有 string 变量值来构建长字符串，然后输出组合后的字符串值\n\n```cpp\ntext += ( term + color + info\
  \ ) ;\ncout << endl << text << endl ;\n```\n\n![image](img/6p.jpg)保存、编译并运行程序查看输出\n\
  \n![image](img/pg63_1.jpg)\n\n![image](img/forget.jpg)\n\n记得添加特殊的 `\\0` 字符来标记 char\
  \ 数组中字符串的结束。\n\n### 获取字符串输入\n\nC++ `cin` 函数在第 3 章中引入用于输入数值，它也可以将文本输入赋值给 `string`\
  \ 变量。这有一个局限性，因为它每次只能用于输入一个单词——`cin` 函数在遇到空格时会停止读取，将任何其他文本留留在“输入缓冲区”中。\n\n![image](img/pg64_1.jpg)\n\
  \n当你想要允许用户输入带有空格的字符串（例如句子）时，可以使用 `getline()` 函数。该函数需要两个参数来指定字符串的源和目的。例如，当 `cin`\
  \ 函数是源而名为“str”的 string 变量是目的时：\n\n```cpp\ngetline( cin , str ) ;\n```\n\n`getline()`\
  \ 函数从输入“流”中读取，直到遇到行尾的 `\\n` 换行符——该换行符是在按下 **Return** 键时产生的。\n\n混合使用 `cin` 和 `getline()`\
  \ 函数时必须小心，因为 `getline()` 函数会自动读取输入缓冲区中留下的任何内容——给人一种程序跳过了指令的印象。可以使用 `cin.ignore()`\
  \ 函数通过忽略输入缓冲区中留的内容来解决这个问题。\n\n![image](img/1p.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\
  \n```cpp\n#include <string>  // 字符串支持。\n#include <iostream>\nusing namespace std\
  \ ;\n```\n\n![image](img/commonp.jpg)\n\ninput.cpp\n\n![image](img/2p.jpg)添加一个包含一个\
  \ string 声明和一个最终返回语句的 main 函数\n\n```cpp\nint main()\n{\n    string name ;\n    //\
  \ 在此处添加更多语句。\n    return 0 ;\n}\n```\n\n![image](img/3p.jpg)在 main 函数中，插入语句将用户输入赋值给\
  \ string 变量，然后输出其值\n\n```cpp\ncout << “Please enter your name: ” ;\ncin >> name\
  \ ;\ncout << “Welcome “ << name << endl ;\n```\n\n![image](img/4p.jpg)接下来，插入语句再次请求名称，但这次使用\
  \ getline 函数将输入赋值给 string 变量之前输出其值\n\n```cpp\ncout << “Please re-enter your full\
  \ name: ” ;\ngetline( cin , name ) ;\ncout << “Thanks, “ << name << endl ;\n```\n\
  \n![image](img/5p.jpg)保存、编译并运行程序，并在提示时输入全名\n\n![image](img/pg65_1.jpg)\n\n这个不理想的结果显示\
  \ `cin` 读取到空格为止，将第二个名字留在缓冲区中，然后由 `getline()` 读取。即使你只输入了名字，问题仍然存在，因为 `cin` 将你按下 **Return**\
  \ 键时产生的换行符留在了输入缓冲区中。\n\n![image](img/6p.jpg)通过在调用 getline 函数之前插入语句修改程序以解决此问题，指令其忽略输入缓冲区中的内容\n\
  \n```cpp\ncin.ignore( 256, ‘\\n’ ) ;\n```\n\n![image](img/7p.jpg)再次保存、编译并运行程序，然后重新输入全名以查看程序按要求执行\n\
  \n![image](img/pg65_2.jpg)\n\n### 解决字符串问题\n\n当你需要将 string 变量转换为不同的数据类型（也许为了对这些值进行算术运算）时，string\
  \ 变量就会出现问题。由于 string 对象不是 C++ 的原生数据类型，无法通过强制类型转换将 string 变量值转换为 `int` 或任何常规数据类型。\n\
  \n![image](img/pg66_1.jpg)\n\n解决方案由 C++ `<sstream>` 库提供，它允许 `stringstream` 对象作为中间介，通过它可以将\
  \ `string` 值转换为数值数据类型，并将数值值转换为 `string` 数据类型。\n\n\n\n\n\n值可以使用与 `cout` 语句中相同的输出流运算符\
  \ `<<` 加载到 `stringstream` 对象中。随后，可以使用与 `cin` 语句中相同的 `>>` 输入流运算符从 `stringstream`\
  \ 对象中提取内容。\n\n为了重用 `stringstream` 对象，必须先将其恢复原始状态。这需要将其内容设置为空字符串 `string`，并清除其状态位标志。\n\
  \n![image](img/1p.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\n```cpp\n#include <string>\
  \  // 包含 string 支持。\n#include <sstream> // 包含 stringstream 支持。\n#include <iostream>\n\
  using namespace std ;\n```\n\n![image](img/commonp.jpg)\n\nconvert.cpp\n\n![image](img/2p.jpg)添加一个包含最终\
  \ `return` 语句的 `main` 函数，并声明两个要转换的初始化变量\n\n```cpp\nint main()\n{\nstring term =\
  \ “100” ;\nint number = 100 ;\n// 在此处添加更多语句。\nreturn 0 ;\n}\n```\n\n![image](img/3p.jpg)在\
  \ `main` 函数中，插入语句声明一个整数变量、`string` 变量和一个 `stringstream` 对象\n\n```cpp\nint num ;\
  \  // 用于存储转换后的字符串。\nstring text ;  // 用于存储转换后的整数。\nstringstream stream ;  // 执行转换。\n\
  ```\n\n![image](img/4p.jpg)接下来，使用流输出运算符将初始化的 `string` 值加载到 `stringstream` 对象中\n\n\
  ```cpp\nstream << term ;  // 加载字符串。\n```\n\n![image](img/5p.jpg)使用流输入运算符将内容从 `stringstream`\
  \ 对象提取到未初始化的整数变量中\n\n```cpp\nstream >> num ;  // 提取整数。\n```\n\n![image](img/6p.jpg)对整数进行算术运算并输出结果\n\
  \n```cpp\nnum /= 4 ;\ncout << “Integer value: ” << num << endl ;\n```\n\n![image](img/7p.jpg)重置\
  \ `stringstream` 对象准备好重用\n\n```cpp\nstream.str(“”) ;  // 清空内容。\nstream.clear() ;\
  \  // 清空位标志。\n```\n\n![image](img/8p.jpg)现在，使用流输出运算符将初始化的整数值加载到 `stringstream` 对象中\n\
  \n```cpp\nstream << number ;  // 加载整数。\n```\n\n![image](img/9p.jpg)使用流输入运算符将内容从\
  \ `stringstream` 对象提取到未初始化的 `string` 变量中\n\n```cpp\nstream >> text ;  // 提取字符串。\n\
  ```\n\n![image](img/10p.jpg)对 `string` 进行拼接并输出结果\n\n```cpp\ntext += “ Per Cent”\
  \ ;\ncout << “String value: ” << text << endl ;\n```\n\n![image](img/11p.jpg)保存、编译并运行程序查看转换后的输出值\n\
  \n![image](img/pg67_1.jpg)\n\n![image](img/hot.jpg)\n\n注意此处是如何使用 `stringstream`\
  \ 对象的 `str()` 函数将其内容重置为空字符串的。\n\n![image](img/forget.jpg)\n\n非空的 `stringstream`\
  \ 对象具有指示其状态为 good、bad、eof 或 fail 的位标志——如此处所示，在重用之前应通过 `stringstream` 对象的 `clear()`\
  \ 函数将其清除。\n\n## 发现字符串特性\n\nC++ `<string>` 库提供了许多函数，可以轻松处理字符串。要使用它们，只需在 `string`\
  \ 变量名后加点和函数名即可。例如，对于名为“msg”的 `stringstream` 变量，你可以调用 `size()` 函数来返回其字符长度，即 `msg.size()`。\n\
  \n![image](img/pg68_1.jpg)\n\n可以通过为 `string` 变量赋值一个没有空格的双引号空字符串——`“”`来清空所有字符，或者调用\
  \ `<string>` 库的 `clear()` 函数。\n\n与 `char` 数组不同，`string` 变量会动态扩大以适应分配给它的字符数，其当前的内存大小可以通过\
  \ `<string>` 库的 `capacity()` 函数显示。一旦扩大，即使给变量分配较小的字符串，分配的内存大小依然保留。\n\n`<string>`\
  \ 库的 `empty()` 函数返回布尔 `true` (1) 或 `false` (0) 响应，以显示字符串是否为空。\n\n![image](img/1p.jpg)通过指定要包含的\
