  \ letter = ‘B’ ;\n```\n\n![image](img/8g.jpg)再次保存、编译并运行程序以查看只有外部测试成功 —— 执行外部 `if`\
  \ 语句\n\n![image](img/pg45_2.jpg)\n\n![image](img/9g.jpg)修改整数变量声明以更改其值\n\n```cpp\n\
  int num = 3 ;\n```\n\n![image](img/10g.jpg)再次保存、编译并运行程序以查看两个测试均失败 —— 执行外部 `else`\
  \ 语句\n\n![image](img/pg45_2.jpg)\n\n![image](img/hot.jpg)\n\n在测试布尔值时可以使用简写 —— 因此表达式\
  \ `if ( flag == true )` 可以写为 `if ( flag )`\n\n![image](img/snake.jpg)\n\n避免嵌套超过三层的\
  \ `if` 语句 —— 以避免混淆和错误。\n\n## 使用 switch 分支\n\n![image](img/pg46_1.jpg)\n\n`if` 和\
  \ `else` 关键字在此处引入，允许程序根据测试的结果向不同的方向分支，并可以用于测试变量 —— 例如，测试整数：\n\n```cpp\nif ( num\
  \ == 1 ) { cout << “Monday” }\nelse\nif ( num == 2 ) { cout << “Tuesday” }\nelse\n\
  if ( num == 3 ) { cout << “Wednesday” }\nelse\nif ( num == 4 ) { cout << “Thursday”\
  \ }\nelse\nif ( num == 5 ) { cout << “Friday” }\n```\n\n长 `if-else` 语句通常可以使用 `switch`\
  \ 语句更高效地执行，`switch` 语句接收一个值，然后在 `case` 语句中寻找匹配值。如果没有找到匹配项，`case` 语句将执行执行，但你可以在最后的\
  \ `case` 语句之后添加 `default` 语句来指定要执行的语句 —— 除非这正是你所需要的。例如，对于三个值，如下：\n\n```cpp\nswitch(\
  \ variable-name )\n{\n    case value1 ; case value2 ; case value3 :\n        statements-to-executed\
  \ ; break ;\n    case value4 ; case value5 ; case value6 :\n        statements-to-executed\
  \ ; break ;\n}\n```\n\n通常，每个 `case` 语句将拥自己的执行语句并以 `break` 结束，如相反程序所示。\n\n缺少 `break`\
  \ 关键字不是语法错误 —— 确保所有必要的 `break` 都存在。\n\n![image](img/1g.jpg) \n\n```cpp\n#include\
  \ <iostream>\nusing namespace std ;\n```\n\nswitch.cpp\n\n![image](img/2g.jpg)添加包含最终\
  \ `return` 语句的主函数\n\n```cpp\nint main()\n{\n    // 程序代码写在这里。\n    return 0 ;\n}```\n\
