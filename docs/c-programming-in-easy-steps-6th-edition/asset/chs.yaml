  \n### 赋值\n\n![image](img/28.jpg)前置运算符立即改变变量值——后置运算符随后改变值。\n\n### 赋值操作\n\nC++ 中用于赋值的运算符下表所示。\n\
  \n| 运算符: | 示例: | 等效于 |\n| :--- | :--- | :--- |\n| `=` | `a = b` | `a = b` |\n| `+=`\
  \ | `a += b` | `a = a + b` |\n| `-=` | `a -= b` | `a = a - b` |\n| `*=` | `a *=\
  \ b` | `a = a * b` |\n| `/=` | `a /= b` | `a = a / b` |\n| `%=` | `a %= b` | `a\
  \ = a % b` |\n\n在上面的示例中，`=` 运算符表示赋值，而不是 `==` 运算符（相等）。\n\n其他运算符以相同的方式工作。\n\n\n\n\
  与 `=` 赋值运算符不同，`==` 等于运算符用于比较操作数，其描述请参见此处。\n\n## 比较值\n\n![image](img/pg30_1.jpg)\n\
  \nC++ 编程中常用的用于比较两个数值的运算符列如下表所示：\n\n| **运算符：** | **比较测试：** |\n| :--- | :--- |\n|\
  \ `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=`\
  \ | 小于等于 |\n\n`==` 等于运算符比较两个操作数，如果两个操作数的数值相等，则返回 `true` (1)，否则将返回 `false` (0) 值。如果两者都是同一个数字，则它们是相等的；如果两者都是字符，则会对其它们的\
  \ ASCII 码值进行数值比较。相反，`!=` 不等于运算符在两个操作数不相等时返回 `true` (1)，其使用的规则与 `==` 等于运算符相同，否则返回\
  \ `false` (0)。相等和不等于运算符对于测试两个变量的状态以执行程序中的条件分支非常有用。\n\n![image](img/hot.jpg)\n\n\
  A-Z 大写字母的 ASCII 码值为 65-90，a-z 小写字母的 ASCII 码值为 97-122。\n\n`>` “大于”运算符比较两个操作数，如果第一个的数值大于第二个，则返回\
  \ `true` (1)；如果其数值等于或小于第二个，则返回 `false` (0)。`<` “小于”运算符进行相同的比较，但如果第一个操作数的数值小于第二个的，则返回\
  \ `true` (1)，否则返回 `false` (0)。`>` “大于”或 `<` “小于”运算符常用于测试循环中迭代计数器的值。\n\n在 `>` “大于”或\
  \ `<` “小于”运算符后添加 `=` 运算符，可以使其在两个操作数数值恰好相等时也返回 `true` (1)。\n\n每个比较操作都在此处 的程序中进行了演示。\n\
  \n![image](img/1r.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀启动新程序\n\n```cpp\n#include <iostream>\n\
