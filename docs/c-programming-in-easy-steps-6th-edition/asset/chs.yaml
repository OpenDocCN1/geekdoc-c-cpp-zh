- "# C++ 编程入门指南，第 6 版\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\n![image](img/ifc.jpg)\n\
  \n![image](img/title.jpg)\n\n\n\n\n\n\n\n\n\n\n# 前言\n本书的创作为我——Mike McGrath 提供了一个更新我之前的\
  \ C++ 书籍的好机会。书中提供的所有示例都演示了当前 Windows 和 Linux 操作系统上的编译器支持的 C++ 特性，适用于 Microsoft Studio\
  \ 开发套。我衷心希望你们在发现 C++ 强大且富有表现力的可能性时，能像我编写这本书时一样享受其中。\n\n## 本书中的约定\n为了清晰每个示例中列出的代码，我采用了特定的色彩约定。C++\
  \ 语言本身的组件为蓝色，数值和字符串值为红色，程序员指定的名称为黑色，注释为绿色，如下所示：\n\n```cpp\n// 存储并输出文本字符串值。\nstring\
  \ myMessage = \"Hello from C++!\";\ncout << myMessage ;\n```\n\n此外，为了标识步骤中描述的每个源代码文件，步骤旁边会出现彩色图标和文件名：\n\
  \n![image](img/pg6_1.jpg)\n`main.cpp`\n\n![image](img/pg6_2.jpg)\n`header.h`\n\n\
  ## 获取源代码\n为了方便起见，我将书中示例的源代码文件放置在一个 ZIP 压缩包中，提供了 Windows 和 Linux 平台版本以及 Microsoft\
  \ Studio IDE。你可以可以通过以下简单的步骤获取完整的压缩包：\n\n![image](img/1g1.jpg)\n访问 **[www.ineasysteps.com](http://www.ineasysteps.com)**，然后导航到免费资源\
  \ (Free Resources) 并选择下载 (Downloads) 部分。\n\n![image](img/2g1.jpg)\n在列表中找到 C++ Programming\
  \ in easy steps, 6th edition，然后点击标题为 All Code Examples 的超链接下载压缩包。\n\n![image](img/3g1.jpg)\n\
  现在，将压缩包内容解压到你计算机上的任何方便的位置。\n\n\n\n如果你没有获得任何示例所示的结果，只需将你的代码与你下载的原始示例文件中的代码进行比较，以发现错误出在哪里。\n\
  \n# 1\n\n## 开始上手\n\n欢迎来到精彩的 C++ 编程世界。本章将演示如何创建一个简单的 C++ 程序，以及如何在程序中存储数据。\n\n- 介绍\
  \ C++\n- 安装编译器\n- 编写你的第一个程序\n- 编译并运行程序\n- 创建变量\n- 使用变量数组\n- 使用 vector 数组\n- 声明常量\n\
  - 总结\n\n## 介绍 C++\n\nC++ 是 C 编程语言的扩展，由 Dennis Ritchie 在 1972 年首次在 UNIX 操作系统上实现。C\
  \ 是一种灵活的编程语言，至今仍然非常流行，并被用于从微控制器到最先进科学系统的各种平台。\n\n![image](img/pg8_1.jpg)\n\n一种强大的编程语言（读音为“see\
  \ plus plus”），设计用于让你表达思想。\n\nC++ 是由 Bjarne Stroustrup 博士在 1983 年至 1985 年间于新泽西州的\
  \ AT&T 贝尔实验室工作期间开发的。他在原始 C 语言的基础上添加了特性，产生了他所谓的“带有类的 C”（C with classes）。这些类定义了具有特定特性的编程对象，将\
  \ C 的过程化本质转换为 C++ 的面向对象编程语言。\n\nC 编程语言之所以得此名，是因为它继承了在 1970 年左右引入的名为“B”的早期编程语言。“C++”这个名字体现了一些程序员的幽默感，因为编程中的\
  \ `++` 增运算符表示 C++ 是 C 语言的扩展。\n\nC++ 像 C 一样，不依赖于平台，因此可以在任何操作系统上创建程序。书中的大多数插图描述的是\
  \ Windows 操作系统上的输出，纯粹是因为它是最常用的桌面平台。示例也可以在 Linux 或 macOS 等其他平台上创建。\n\n### 为什么要学习\
  \ C++ 编程？\n\nC++ 语言受到许多专业程序员的喜爱，因为它允许他们创建快速、紧凑且健壮可移植的程序。\n\n使用现代的 C++ 集成开发环境（IDE），例如微软的\
  \ Visual Studio Community 版，程序员可以快速创建复杂的应用程序。但为了充分发挥这些工具的作用，程序员必须首先学习大量的 C++ 语言本身。\n\
  \n本书是 C++ 编程的入门教程，提供了程序代码及其输出示例，以演示这种强大语言的基础知识。\n\n![image](img/forget.jpg)\n\n\
  微软免费的 Visual Studio Community 版 IDE 在书中用于演示可视化编程。\n\n### 我应该先学 C 语言吗？\n\n对于在转向 C++\
  \ 之前熟悉 C 编程是否是一个优势，人们意见不一。先学习原始语言以便更轻松地理解更大的扩展语言似乎是合逻辑的。然而，C++ 并不仅仅是 C 的大版本，因为 C++\
  \ 的面向对象编程方法与 C 的过程化本质有显著不同。因此，认为在没有 C 语言知识的情况下学习 C++ 更好，以避免混淆。\n\n本书并不假设读者具备任何编程语言的先前知识，因此适合\
  \ C++ 编程的初学者，无论他们是否知道 C 语言。\n\n如果你觉得在转向 C++ 之前学习 C 语言编程对你有所帮助，我们建议你在阅读本书之前尝试[易学\
  \ C 语言编程](http://www.ineasysteps.com/)中的示例。\n\n### C++ 的标准化\n\n随着 C++ 编程语言普及性的提高，它被全球许多程序员作为首选编程语言。其中一些程序员开始向语言中添加自己的扩展，因此有必要约定一个精确的\
  \ C++ 版本，以便所有程序员在国际范围内共同共享。\n\n标准版本的 C++ 是由美国国家标准协会（ANSI）和国际标准化组织（ISO）的联合委员会定义的。这个版本有时被称为\
  \ ANSI C++，它可以移植到任何平台和任何开发环境。\n\n书中所给示例符合 ANSI C++。示例程序运行在控制台窗口中（例如 Windows 系统上的命令提示符窗口或\
  \ Linux 系统上的 shell 终端窗口），用以演示 C++ 语言本身的机制。最后一章中的一个示例说明了在 Windows 平台上通过视觉化开发工具自动生成的代码，一旦你熟悉了\
  \ C++ 语言，就可以通过编辑来创建一个图形化的窗口应用程序。\n\n![image](img/hot.jpg)\n\n“ISO”不是缩写词，而是源自希腊单词“isos”，意为“相等”——就像“等距”（isometric）。\n\
  \n## 安装编译器\n\nC++ 程序最初以纯文本文件创建，扩展名为 `.cpp`。这些文件可以在任何文本编辑器中编写，例如 Windows 的记事本应用程序或\
  \ Linux 上的 Vi 编辑器。\n\n为了执行 C++ 程序，必须将其“编译”成计算机可以理解的字节码。C++ 编译器读取程序的文本版本并将其翻译成第二个文件——机器可读的、可执行格式。\n\
  \n如果文本程序包含任何语法错误，编译器将报告这些错误且不会生成可执行文件。\n\n如果你使用 Windows 平台并安装了 C++ 集成开发环境（IDE），那么你已经可以使用\
  \ C++ 编译器，因为编译器是视觉 IDE 的不可缺的一部分。优秀的免费微软 C++ IDE 在开始学习 C++ 时可能会显得笨重，因为它们总是创建许多高级程序使用的“项目”文件。\n\
  \n流行的免费 GNU C++ 编译器根据通用公共许可证（GPL）免费提供。它包含在大多数 Linux 操作系统发行版中。GNU C++ 编译器也适用于 Windows\
  \ 平台，并用于编译书中的示例。\n\n要发现系统是否已安装 GNU C++ 编译器，请在命令提示符处输入 `c++ -v` 然后按回车。如果可用，编译器将返回版本信息。如果你使用\
  \ Linux 平台且计算机上没有 GNU C++ 编译器，请从发行版磁盘安装、从 GNU 网站下载或要求系统管理员安装。\n\nGNU 项目（读音为“guh-new”）于\
  \ 1984 年启动，旨在开发一个完全免费的类 Unix 操作系统。GNU 的一部分是“Windows 最小化 GNU”（MinGW）。MinGW 包含了可以在\
  \ Windows 系统上创建可执行 C++ 程序的 GNU C++ 编译器。Windows 用户可以按照此处的说明下载并安装 GNU C++ 编译器。\n\n\
  要打开 Windows 命令提示符，按下 `Windows + R` 启动运行对话框，然后在对话框中输入 `cmd` 并按回车。\n\n\n\n\n\n![image](img/1b.jpg)连接互联网，启动网络浏览器然后导航到\
  \ `[osdn.net/projects/mingw](http://osdn.net/projects/mingw)` 并点击链接下载 MinGW 安装程序\
  \ `mingw-get-setup.exe`。\n\n![image](img/pg11_1.jpg)\n\n![image](img/2b.jpg)启动安装程序，并在“Installation\
  \ Manager”对话框中接受建议的位置 `C:\\MinGW`。\n\n![image](img/3b.jpg)勾选 `Basic MinGW` 和 `C++\
  \ Compiler` 项目，然后点击 `Installation`、`Apply Changes`、`Apply` 进行安装。\n\n![image](img/pg11_2.jpg)\n\
  \nMinGW C++ 编译器是一个位于 `C:\\MinGW\\bin` 的二进制执行文件。为了允许从任何系统位置访问，现在应将此文件夹添加到系统路径（System\
  \ Path）：\n\n![image](img/4b.jpg)打开 Windows “系统属性”对话框，然后选择`Advanced`选项卡并点击`Environment\
  \ Variables`按钮 – 打开“环境变量”对话框。\n\n![image](img/5b.jpg)选择`Path`系统变量，然后点击`Edit`按钮并添加位置\
  \ `C:\\MinGW\\bin;`。\n\n![image](img/6b.jpg)点击`OK`关闭每个对话框，然后打开命令提示符窗口输入命令 `c++`。如果安装成功，编译器应该响应你没有指定任何用于编译的输入文件\n\
  \n![image](img/pg11_3.jpg)\n\n![image](img/hot.jpg)\n\n要打开系统属性对话框，按下 `Windows` +\
  \ `R` 键启动运行对话框，然后在对话框中输入 `sysdm.cpl` 并按 `Enter` 。\n\n![image](img/pg11_4.jpg)\n\n\
  ![image](img/pg11_5.jpg)\n\n![image](img/pg11_6.jpg)\n\n# 编写你的第一个程序\n\n按照以下步骤，完全按照列出的内容复制代码，创建一个简单的\
  \ C++ 程序，它将输出传统的第一个程序问候语：\n\n![image](img/commonb.jpg)\n\nhello.cpp\n\n![image](img/1b.jpg)打开一个纯文本编辑器，例如\
  \ Windows 记事本，然后输入这些“预处理器指令”：\n\n```cpp\n#include <iostream>\nusing namespace std\
  \ ;\n```\n\n![image](img/2b.jpg)在预处理器指令下方几行，添加一个描述程序的“注释”\n\n```cpp\n// A C++ Program\
  \ to output a greeting.\n```\n\n![image](img/3b.jpg)在注释下方，添加一个“main 函数”声明以包含程序语句\n\
  \n```cpp\nint main()\n{\n}\n```\n\n![image](img/4b.jpg)在主函数的大括号（braces）之间，插入此输出“语句”：\n\
  \n```cpp\ncout << “Hello World!” << endl ;\n```\n\n![image](img/5b.jpg)接下来，在主函数中插入最后的“return”语句\n\
  \n```cpp\nreturn 0 ;\n```\n\n![image](img/6b.jpg)将程序保存到任何方便的位置命名为“hello.cpp” – 完整的程序看起来应该是这样：\n\
  \n![image](img/pg12_1.jpg)\n\n![image](img/forget.jpg)\n\n本书中的注释均以绿色显示 – 以将它们与其他代码区分。\n\
  \n![image](img/snake.jpg)\n\n在输入主方法的最后一个闭合 `}` 大括号后，始终按 `Return` 以添加换行符 – 你的编译器可能坚持源文件应以换行符结束。\n\
  \n可以单独检查此处所示的程序代码的各个部分，以更清楚地理解每个部分：\n\n*   **预处理器指令 (Preprocessor Directives)**\
  \ – 这些在程序代码之前由编译器处理，因此必须始终出现在页面开头。在这里，`#include` 指令编译器使用名为 `iostream` 的标准 C++ 输入输出库，在`<\
  \ >` 尖括号之间指定库名。下一行是“使用指令”（using directive），允许使用指定命名空间中的函数而无需其命名名前缀。`iostream` 库的函数位于\
  \ `std` 命名空间内 – 因此此 `using` 指令允许将 `std::cout` 和 `std::endl` 写为 `cout` 和 `endl`。\n\
  *   **注释 (Comments)** – 这些应该让其他人更容易理解代码，以及自己在以后重新查看代码时。在 C++ 编程中，`//` 双斜杠之后单行上的所有内容都会被编译器忽略。\n\
  *   **主函数 (Main function)** – 这是每个 C++ 程序的强制入口点。程序可以包含许多函数，但它们必须包含一个名为 `main` 的函数，否则编译器将无法编译程序。可选情况下，函数名后的括号可以指定一个用逗号分隔的“参数”值列表，供该函数使用。执行后，函数必须向操作系统返回其在声明中指定的数据类型的值\
  \ – 在本情况下，是一个 `int`（整数）值。\n*   **语句 (Statements)** – 这些是程序运行时将执行的动作。每个语句必须以分号终止，就像英语句子必须以句号结束一样。在这里，第一条语句调用\
  \ `cout` 库函数来输出文本和一个 `endl` 换行符。这些通过 `<<` 输出流运算符定向到标准输出。注意文本必须包含在双引号内。最后的语句使用 `return`\
  \ 返回零值。C++ 编译器支持 `/*` 和 `*/` 之间的多行注释 – 但这些仅用于注释代码段。\n\n![image](img/hot.jpg)\n\n\
  注意代码使用空格和缩进（统称为空白字符）来提高可读性。C++ 编译器忽略所有空白。\n\n# 编译与运行程序\n\n本书的 C++ 源文件存储在为此目的创建的目录中。该目录命名为\
  \ `MyPrograms` – 其在 Windows 上的绝对地址为 `C:\\MinGW`，在 Linux 上为 /*user。你可以重建此目录来存储等待编译的程序：\n\
  \n![image](img/1b.jpg)将 `hello.cpp` 程序文件移动到 `MyPrograms` 目录\n\n![image](img/2b.jpg)在命令提示符处，使用\
  \ `cd` 命令导航到 `MyPrograms` 目录\n\n![image](img/3b.jpg)输入命令尝试编译程序：\n\n```bash\nc++\
  \ hello.cpp\n```\n\n当尝试成功时，编译器会在源文件旁边创建一个执行文件。默认情况下，执行文件在 Windows 上名为 a.exe，在 Linux\
  \ 上名为 a。同一目录下编译不同的源文件将覆盖第一个执行文件。这显然是不理想的，因此在编译程序时应为执行文件指定自定义名称，使用编译命令中的 `-o` 选项：\n\
  \n```bash\nc++ hello.cpp -o hello.exe\n```\n\n![image](img/pg14_1.jpg)\n\n![image](img/pg15_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n`c++` 命令是 GNU C++编译编译别名 – 也可以使用 `g++` 命令。你可以通过命令查看编译器版本号：\n\
  \n```bash\nc++ --version\n```\n\n并通过以下命令显示所有选项：\n\n```bash\nc++ --help\n```\n\n\
  在 Windows 上运行生成的执行程序文件，只需在 `MyPrograms` 目录的提示符处输入文件名 – 可选省略文件扩展。在 Linux 中，必须使用完整文件名，并加上\
  \ `./` 点斜 – 因为在没有明确指示的情况下，Linux 不查找当前目录：\n\n```bash\n./hello\n```\n\n![image](img/pg15_2.jpg)\n\
  \n![image](img/pg15_3.jpg)\n\n![image](img/snake.jpg)\n\n\n\n\n书中的所有命令行示例都已使用写作时最新的最新\
  \ GNU C++ 编译器进行了编译和测试——它们在其他编译器上可能无法完全复制。\n\n## 创建变量\n\n“变量”就像 C++ 程序中的一个容器，数据值可以存储在计算机的内存中。可以使用变量的名称来引用存储的值。\n\
  \n![image](img/pg16_1.jpg)\n\n程序员可以为变量选择任何名称，只要它符合 C++ 的命名规范——所选名称只能包含字母、数字和下划线字符，但不能以数字开头。此外，必须避免使用书内封上列出的\
  \ C++ 关键字。选择有意义的名称是一个良好的习惯，可以使代码更易于理解。\n\n要在程序中创建一个新变量，必须对其进行“声明”，并指定它可能包含的数据类型和所选的名称。变量声明的语法如下：\n\
  \n```cpp\ndata-type variable-name ;\n```\n\n可以在单个声明中创建多个相同数据类型的变量，其格式为用逗号分隔的列表，语法如下：\n\
  \n```cpp\ndata-type variable-name1 , variable-name2 , variable-name3 ;\n```\n\n\
  ![image](img/snake.jpg)\n\nC++ 中的名称是区分大小写的——因此，名为 `VAR`、`Var` 和 `var` 的变量被视为三个独立的变量。传统上，C++\
  \ 变量名是小写且很少以下划线开头，因为某些 C++ 库使用了这种约定。\n\n下表列出了五种基本的 C++ 数据类型，并带有简要描述和示例内容：\n\n| 数据类型\
  \ | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `char` | 单字节，可以存储一个字符 | ‘A’ |\n| `int`\
  \ | 整数 | `100` |\n| `float` | 浮点数，精确到六位小数 | `0.123456` |\n| `double` | 浮点数，精确到十位小数\
  \ | `0.0123456789` |\n| `bool` | `true` 或 `false` 的布尔值，或者数值上零为假，任何非零为真 | `false`\
  \ 或 `0`, `true` 或 `1` |\n\n![image](img/snake.jpg)\n\n`char` 数据类型的字符值必须始终包含在单引号之间——而不是双引号。\n\
  \n变量声明必须出现在可执行语句之前——这样它们在语句内部就可以被引用。\n\n当一个值赋值给变量时，该变量被称为已“初始化”。可选，可以在声明时初始化变量。任何初始化变量中存储的值都可以通过\
  \ `cout` 函数显示在标准输出上，该函数在此处用于显示“Hello World!”问候。\n\n![image](img/1b.jpg)通过指定要包含的\
  \ C++ 库类和要使用的命名空间前来启动新程序\n\n```cpp\n#include <iostream>\nusing namespace std ;\n\
  ```\n\n![image](img/commonb.jpg)\n\nvars.cpp\n\n![image](img/2b.jpg)添加一个包含最终 `return`\
  \ 语句的 main 函数\n\n```cpp\nint main()\n{\n    // 程序代码放在这里。\n    return 0 ;\n}\n```\n\
  \n![image](img/3b.jpg)在 main 函数中插入语句来声明和初始化各种数据类型的变量\n\n```cpp\nchar letter ; letter\
  \ = ‘A’ ;  // 声明后初始化。\nint number ; number = 100 ; // 声明后初始化。\nfloat decimal = 7.5\
  \ ;  // 声明并初始化。\ndouble pi = 3.14159 ;  // 声明并初始化。\nbool isTrue = false ;  // 声明并初始化。\n\
