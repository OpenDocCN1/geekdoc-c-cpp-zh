  \n同名的变量在不同的作用域中声明时不会冲突 —— 它们相互不可见。\n\n### 传递参数\n\n函数调用经常为函数提供参数值。这些可以是任意数量和数据类型，但它们必须与函数原型声明中指定的匹配。\n\
  \n![image](img/pg54_1.jpg)\n\n注意，传递给函数的参数仅提供原始值的副本，这种过程被称为“值传递（passing by value）”。\n\
  \n传递给参数的值可以是程序代码中指定的“静态”值，也可以是用户输入的“动态”值。在命令行提示符下，可以使用 C++ 的 `cin` 函数配合 `>>` 输入流操作符将值从标准输入重定向到变量，例如：\n\
  \n```cpp\nfloat num ;\ncout << “Please enter a number: ” ;\ncin >> num ;\n```\n\n\
  输入可以作为函数调用中的参数传递给函数，例如 `workWith( num )`。\n\n![image](img/snake.jpg)\n\n函数原型必须在定义之前声明。通常，原型出现在主函数之前，而它们的定义出现在主函数之后。\n\
  \n可选情况下，函数原型可以为参数分配默认值，当调用未传递参数值时将使用这些默认值。可以为多个参数分配默认值。通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\
  \n(抱歉，上述翻译过程中出现了重复逻辑错误，我将重新为您提供文本后半部分的正确合并翻译：)\n\n[content]\n以摄氏度：... “是 C” 摄氏度转换为华氏度\n\
  \n![image](img/4g.jpg) 之后\n\n函数函数](5g.jpg) \n在函数定义中给参数和变量命名的名称不需要与调用函数中的变量名相同，但它有助于清晰程序。\n\
  \n### 重载函数\n\n函数“重载（overloading）”允许同名的函数在同一个程序中和谐地共存，只要它们的参数在数量、数据类型或数量和数据类型上有所不同。编译器通过识别参数数量和数据类型将函数调用匹配到正确的函数版本\
  \ —— 这一过程被称为“函数解析（function resolution）”。\n\n![image](img/pg56_1.jpg)当要执行的任务相似但细有不同时，创建重载函数是有用的。\n\
  \n![image](img/1g.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\n```cpp\n#include <iostream>\n\
  using namespace std ;\n```\n\n![image](img/commong.jpg)\n\noverload.cpp\n\n![image](img/2g.jpg)在预处理指令下方，声明一个返回\
  \ float 值并有一个参数的函数原型\n\n```cpp\nfloat computeArea ( float ) ;\n```\n\n![image](img/3g.jpg)现在，声明两个重载函数原型\
  \ —— 为第一个原型具有不同的参数\n\n```cpp\nfloat computeArea ( float, float ) ;\nfloat computeArea\
  \ ( char, float, float ) ;\n```\n\n![image](img/4g.jpg)在原型声明下方，添加一个包含最终 `return`\
  \ 语句的主函数\n\n```cpp\nint main()\n{\n  // 程序代码在此处。\n  return 0 ;\n}\n```\n\n\n\n\n\
  ![image](img/5g.jpg)在 `main` 函数之后，定义第一个接收参数的函数\n\n```cpp\nfloat computeArea( float\
  \ diameter )\n{\n  float radius = ( diameter / 2 ) ;\n  return ( 3.141593 * ( radius\
  \ * radius ) ) ;\n}\n```\n\n![image](img/snake.jpg)\n\n仅通过返回数据类型不同的函数不能进行重载——必须是参数有所不同。函数解析时不考虑返回数据类型。\n\
  \n![image](img/6g.jpg)在第一个函数定义下方，定义接收不同参数的重载函数\n\n```cpp\nfloat computeArea( float\
