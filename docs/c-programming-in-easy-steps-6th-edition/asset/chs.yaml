  \n注意，`default` 语句后面不需要跟 `break` 关键字 —— 因为 `default` 语句始终出现在 `switch` 语句的最后。\n\n\
  ## 循环 (Looping for)\n\n循环是程序中一段会自动重复的代码。对循环块内包含的所有语句的完整执行称为一次“迭代”（iteration）或“通过”（pass）。\n\
  \n![image](img/pg48_1.jpg)\n\n循环执行的迭代次数由循环内部的条件测试控制。只要被测试的表达式保持为 `true`，循环就会继续 ——\
  \ 直到被测试的表达式变为 `false`，此时循环结束。\n\nC++ 编程中的三种循环结构是 `for` 循环、`while` 循环和 `do`-`while`\
  \ 循环。可能最常用的循环是 `for` 循环，其语法如下：\n\n```cpp\nfor ( *initializer ; *test-expression\
  \ ; *incrementer* ) { *statements* }\n```\n\n初始化器（initializer）为循环迭代次数的计数器设置起始值。为此使用一个整数变量，传统上通常命名为“i”。\n\
  \n在循环的每次迭代中，都会评估测试表达式，只有当该表达式为 `true` 时，该迭代才会继续。当被测试的表达式变为 `false` 时，循环立即结束，不再再次执行语句。在每次迭代中，计数器加增，然后执行语句。\n\
  \n循环可以嵌套在其他循环中 —— 这样内部循环在外部循环的每次迭代中都会完整执行其迭代。\n\n![image](img/1g.jpg)通过指定要包含的 C++\
  \ 库类和使用的命名空间前缀来启动新程序\n\n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\
  \n![image](img/commong.jpg)\n\nforloop.cpp\n\n![image](img/2g.jpg)添加一个包含最终 `return`\
  \ 语句的 main 函数\n\n```cpp\nint main()\n{\n// 程序代码放在这里。\nreturn 0 ;\n}\n```\n\n![image](img/3g.jpg)在\
  \ main 函数中，插入一条语句声明一个整数变量作为循环迭代计数器\n\n```cpp\nint i ;\n```\n\n![image](img/4g.jpg)接下来，插入一个\
  \ `for` 循环在三次迭代的每次输出计数器值\n\n```cpp\nfor ( i = 1 ; i < 4 ; i++ )\n{\ncout << “Loop\
  \ iteration: ” << i << endl ;\n}\n```\n\n![image](img/5g.jpg)保存、编译并运行程序查看输出\n\n\
  ![image](img/pg49_1.jpg)\n\n![image](img/6g.jpg)现在，修改变量声明以添加第二个计数器\n\n```cpp\nint\
  \ i , j ;  // 添加了整数变量“j”。\n```\n\n![image](img/7g.jpg)在 `for` 循环块内部输出语句之后添加一个内部循环，在每次迭代中输出其计数器值\n\
  \n```cpp\nfor ( j = 1 ; j < 4 ; j++ )\n{ cout << “ Inner loop iteration: “ << j\
  \ << endl ; }\n```\n\n![image](img/8g.jpg)再次保存、编译并运行程序，查看内部循环在外部循环的每次迭代中完整执行\n\n\
  ![image](img/pg49_2.jpg)\n\n![image](img/hot.jpg)\n\n另一种，`for` 循环计数器可以通过在每次迭代中使用\
  \ `i--` 而不是 `i++` 增器来递减计数器值。\n\n![image](img/forget.jpg)\n\n在循环的第三次迭代中，增器将计数器值增加到\
  \ 4 —— 因此当下次评估时，测试返回为 false 且循环结束。\n\n## while 循环 (Looping while)\n\n`for` 循环的替代方案（此处）使用\
  \ `while` 关键字，跟着一个要评估的表达式。当表达式为 `true` 时，测试表达式后大括号内的语句将被执行。表达式将再次被评估，`while` 循环将持续直到发现表达式为\
  \ `false`。\n\n![image](img/pg50_1.jpg)\n\n循环的语句块必须包含影响被测试表达式的代码，以便将评估结果更改为 `false`，否则将导致导致锁定系统的死循环！如果在第一次评估时发现被测试表达式为\
  \ `false`，则 `while` 循环的语句块将永远不会执行。\n\n`while` 循环的一种微妙变是将 `do` 关键字放在循环语句块之前并在之后加上\
  \ `while` 测试，语法如下：\n\n```cpp\ndo { statements-to-be-executed } while ( test-expression\
  \ ) ;\n```\n\n在 `do-while` 循环中，语句块将至少执行一次 —— 因为表达式在循环的第一次迭代之后才会被评估。\n\n![image](img/hot.jpg)\n\
  \n如果你不小心启动了死循环，请按 `Ctrl + C` 键终止进程。\n\n`break` 语句可以包含在任何类型的循环中，在满足测试条件时立即终止循环。`break`\
  \ 语句确保该循环不会再执行后续迭代。\n\n同样，`continue` 语句可以包含在任何循环中以跳到下一次迭代。\n\n![image](img/1g.jpg)通过指定要包含的\
  \ C++ 库类和使用的命名空间前缀启动新程序\n\n```cpp\n#include <vector>\n#include <iostream>\nusing\
  \ namespace std ;\n```\n\n![image](img/commong.jpg)\n\nwhile.cpp\n\n![image](img/2g.jpg)添加一个包含最终\
  \ `return` 语句的 main 函数\n\n```cpp\nint main()\n{\n// 程序代码放在这里。\nreturn 0 ;\n}\n```\n\
  \n![image](img/3g.jpg)在 main 函数中，插入语句声明整数 vector 和整数循环计数器\n\n```cpp\nvector <int>\
  \ vec( 10 ) ;\nint i = 0 ;\n```\n\n![image](img/4g.jpg)接下来，插入一个 `while` 循环在每次迭代将计数器值赋值给\
  \ vector 的元素\n\n```cpp\nwhile ( i < vec.size() )\n{\ni++; // 递增。\nvec[ i-1 ] = i\
  \ ; // 赋值给元素。\ncout << “ | ” << vec.at( i-1 ) ;\n}\n```\n\n![image](img/5g.jpg)保存、编译并运行程序查看输出\n\
  \n![image](img/pg51_1.jpg)\n\n![image](img/6g.jpg)修改 `while` 循环在增器后立即添加 `continue`\
  \ 语句，使循环跳过第三次迭代\n\n```cpp\nif ( i == 3 ) { cout << “ | Skipped” ; continue ; }\n\
  ```\n\n![image](img/7g.jpg)在 `continue` 语句之后现在添加 `break` 语句，使循环在第八次迭代退出\n\n```cpp\n\
  if ( i == 8 ) { cout << endl << “Done” ; break ; }\n```\n\n![image](img/8g.jpg)再次保存、编译并运行程序，查看循环现在跳过了某些迭代\n\
  \n![image](img/pg51_2.jpg)\n\n![image](img/forget.jpg)\n\n在此示例中必须通过预处理器指令包含 vector\
  \ 库。\n\n![image](img/snake.jpg)\n\n`break` 和 `continue` 语句的位置很重要 —— 它们必须出现在增器之后，以避免创建死循环，但在影响程序的其他语句之前，以避免执行这些语句。\n\
  \n## 函数声明 (Declaring functions)\n\n函数封装了一段为程序提供特定功能代码。当主程序调用函数时，其语句将被执行，并可以在完成后向主程序返回一个值。使用函数有三个主要好处：\n\
  \n• 函数使程序代码更易理解和维护。\n\n• 经过测试的函数可以在其他程序重用。\n\n• 在大型项目中，多个程序员可以通过编写程序的不同函数来分担工作量。\n\
  \n\n\n\n\n每个函数在程序代码早期被声明为“原型（prototype）”，它包含一个返回数值的数据类型，以及函数名及其后的括号，括号内可选地包含该函数可能使用的传入值的“参数”数据类型列表。函数原型声明的语法如下所示：\n\
  \n`return-data-type function-name ( arguments-data-type-list ) ;`\n\n![image](img/hot.jpg)\n\
  \n严格来说，函数原型中的参数被称为“形式参数（formal parameters）”。\n\n例如，一个名为 `computeArea`、返回 `float`\
  \ 值并传递两个 `float` 参数的函数声明为：\n\n```cpp\nfloat computeArea( float, float ) ;\n```\n\
  \n### 定义函数\n\n函数的定义出现在程序代码的后部分，它包含了对原型的重复，加上实际的函数体。函数体是每次调用该函数时要执行的语句，包含在一对括号中。\n\
  \n![image](img/forget.jpg)\n\n如果函数不向调用者返回任何值，请使用 `void` 关键字。\n\n重要的一点是，编译器会根据原型对定义进行检查，因此实际返回的数据类型必须与原型中指定的匹配，且提供的任何参数在数量和数据类型上必须匹配。如果定义与原型不匹配，编译将失败。一个简单的\
  \ `computeArea` 定义可能如下：\n\n```cpp\nfloat computeArea( float width, float height\
  \ )\n{\n  return ( width * height ) ;\n}\n```\n\n### 变量作用域\n\n在函数中声明的变量只能在该函数内部局部使用，不能全局供其他函数访问。这种限制被称为“变量作用域（variable\
  \ scope）”。\n\n![image](img/1g.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std ;\n```\n\n![image](img/commong.jpg)\n\nscope.cpp\n\
  \n![image](img/2g.jpg)接下来，声明两个简单的函数原型\n\n```cpp\nfloat bodyTempC() ;\nfloat bodyTempF()\
  \ ;\n```\n\n![image](img/3g.jpg)现在，添加一个包含对每个函数调用和最终 `return` 语句的主函数\n\n```cpp\n\
  int main()\n{\n  cout << “Centigrade: ” << bodyTempC() << endl ;\n  cout << “Fahrenheit:\
  \ ” << bodyTempF() << endl ;\n  return 0 ;\n}\n```\n\n![image](img/4g.jpg)在主函数之后，定义另外两个函数\
  \ —— 每个函数都返回局部“temperature”变量的值\n\n```cpp\nfloat bodyTempC()\n{\n  float temperature\
  \ = 37.0 ;\n  return temperature ;\n}\n\nfloat bodyTempF()\n{\n  float temperature\
  \ = 98.6 ;\n  return temperature ;\n}\n```\n\n![image](img/5g.jpg)保存、编译并运行程序以查看输出\n\
  \n![image](img/pg53_1.jpg)\n\n![image](img/hot.jpg)\n\n同名的变量在不同的作用域中声明时不会冲突 —— 它们相互不可见。\n\
  \n### 传递参数\n\n函数调用经常为函数提供参数值。这些可以是任意数量和数据类型，但它们必须与函数原型声明中指定的匹配。\n\n![image](img/pg54_1.jpg)\n\
  \n注意，传递给函数的参数仅提供原始值的副本，这种过程被称为“值传递（passing by value）”。\n\n传递给参数的值可以是程序代码中指定的“静态”值，也可以是用户输入的“动态”值。在命令行提示符下，可以使用\
  \ C++ 的 `cin` 函数配合 `>>` 输入流操作符将值从标准输入重定向到变量，例如：\n\n```cpp\nfloat num ;\ncout <<\
  \ “Please enter a number: ” ;\ncin >> num ;\n```\n\n输入可以作为函数调用中的参数传递给函数，例如 `workWith(\
  \ num )`。\n\n![image](img/snake.jpg)\n\n函数原型必须在定义之前声明。通常，原型出现在主函数之前，而它们的定义出现在主函数之后。\n\
  \n可选情况下，函数原型可以为参数分配默认值，当调用未传递参数值时将使用这些默认值。可以为多个参数分配默认值。\n\n通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\
  \n![image](img/1g.jpg)\n\n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\
  \n```.\n\nscope.cpp 接下来，声明两个简单的函数原型\n\n![image](img/2g.jpg)\n\n```cpp\nfloat bodyTempC()\
  \ ;\nfloat bodyTempF() ;\n```\n\n![image](img/3g.jpg)现在，添加一个包含对每个函数调用和最终 `return`\
  \ 语句的主函数\n\n```cpp\nint main()\n{\n  cout << “Centigrade: ” << bodyTempC() << endl\
