  C++ 编程中最常用的逻辑运算符列如下表所示：\n\n| **运算符：** | **操作：** |\n| :--- | :--- |\n| `&&` | 逻辑与\
  \ |\n| `||` | 逻辑或 |\n| `!` | 逻辑非 |\n\n逻辑运算符用于具有布尔值 `true` 或 `false` 的操作数，或者可以转换为\
  \ `true` 或 `false` 的值。\n\n逻辑 `&&` 与 运算符会评估两个操作数，只有当两个操作数本身都为 `true` 时才会返回 `true`。否则，`&&`\
  \ 运算符将返回 `false`。这被用于条件分支，程序的运行方向通过测试两个条件来决定 —— 如果两个条件都满足，程序将进入某个方向，否则它将采取另一个方向。\n\
  \n![image](img/snake.jpg)\n\n逻辑运算符用于具有布尔值 `true` 或 `false` 的操作数，或者可以转换为 `true` 或\
  \ `false` 的值。\n\n逻辑 `&&` 与 运算符会评估两个操作数，只有当两个操作数本身都为 `true` 时才会返回 `true`。否则，`&&`\
  \ 运算符将返回 `false`。这被用于条件分支，程序的运行方向通过测试两个条件来决定 —— 如果两个条件都满足，程序将进入某个方向，否则它将采取另一个方向。\n\
  \n*(注：由于原文后续存在大量重复的无效段落，已根据指令要求仅保留核心逻辑内容)*\n\n\n\n\n`( *test-expression ) ? `if-true-return-this`\
  \ : `if-false-return-this` ;`\n\n虽然三元运算符最初看起来可能有些困惑，但熟悉这个运算符是非常有价值的，因为它可以用最少的代码执行强大的程序分支。例如，当一个变量的值不为\
  \ 1 时进行分支：\n\n`( var != 1 ) ? `if-true-do-this` : `if-false-do-this` ;`\n\n三元运算符在\
  \ C++ 编程中常被用于将两个变量的最大值或最小值赋值给第三个变量。例如，这样赋值最小值：\n\n`c = ( a < b ) ? a : b ;`\n\n\
  当括号中的表达式在变量 `a` 的值小于变量 `b` 的值时返回 `true` —— 因此在这种情况下，变量 `a` 的较小值被赋值给变量 `c`。\n\n同样地，将测试表达式中的\
  \ `<` 小于运算符替换为 `>` 大于运算符，会将变量 `b` 的较大值赋值给变量 `c`。\n\n三元运算符的另一个用法是在测试表达式中使用 `%` 取模运算符来确定变量的值是奇数还是偶数：\n\
  \n`( var % 2 != 0 ) ? `if-true(odd)-do-this` : `if-false(even)-do-this` ;`\n\n![image](img/forget.jpg)\n\
  \n三元运算符有三个操作数：`?` 之前的那个，以及 `:` 之前和之后的两个。\n\n当变量值除以二有余数时，该数字为奇数 —— 没有余数时，数字为偶数。测试表达式\
  \ `( var % 2 == 1 )` 具有相同的效果，但最好测试不相等性 —— 发现不同之处比发现相同之处更容易。\n\n程序在处 展示了三元运算符的用法。\n\
