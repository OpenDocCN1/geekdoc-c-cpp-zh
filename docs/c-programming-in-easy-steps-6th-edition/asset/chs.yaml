  \ text = “C++ Programming” ;\n// 在此处添加更多语句。\nreturn 0 ;\n}\n```\n\n![image](img/3p.jpg)在主函数中，插入语句使用\
  \ `+` 拼接运算符输出两个 `string` 值的值，并输出第一个变量的（未改变）值\n\n```cpp\ncout << “Concatenated: ”\
  \ << ( lang + term ) << endl ;\ncout << “Original: ” << lang << endl ;\n```\n\n\
  ![image](img/4p.jpg)接下来，插入语句使用 `append()` 函数输出两个 `string` 值，并输出第一个变量的（已改变）值\n\n\
  ```cpp\ncout << “Appended: ” << lang.append( term ) << endl ;\ncout << “Original:\
  \ ” << lang << endl ;\n```\n\n![image](img/5p.jpg)使用 `==` 等值运算符比较两个不同的 `string`\
  \ 值，然后比较两个匹配的 `string` 值\n\n```cpp\ncout << “Differ: ” << ( lang == term ) << endl\
  \ ;\ncout << “Match: ” << ( lang == text ) << endl ;\n```\n\n![image](img/6p.jpg)现在，使用\
