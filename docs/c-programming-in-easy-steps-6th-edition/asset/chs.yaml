  \n![image](img/forget.jpg)\n\n字符串中的第一个字符位于位置 0，而不是位置 1。\n\n### 替换子字符串\n\n`<string>`\
  \ 库包含了许多用于操作子字符串的有用函数。可以使用 `insert()` 函数将一个 `string` 插入到另一个 `string` 中。这需要将要插入 `string`\
  \ 的索引位置作为第一个参数，并将要插入的 `string` 值作为第二个参数。\n\n![image](img/pg76_1.jpg)\n\n相反，可以使用\
  \ `erase()` 函数从 `string` 中删除子字符串。这需要将开始删除的索引位置作为第一个参数，并将要删除的字符数作为第二个参数。\n\n`replace()`\
  \ 函数简洁地结合了 `erase()` 和 `insert()` 函数，同时删除子字符串并插入替换内容。它需要三个参数，分别指定开始删除的位置、要删除的字符数，以及要插入该位置的替换\
  \ `string`。\n\n可以使用 `substr()` 函数从 `string` 中复制一个子字符串，将开始复制的索引位置作为第一个参数，并将要复制的字符数作为第二个参数。\n\
  \n可以使用 `at()` 函数复制 `string` 中任何指定位置的字符，该函数需要索引位置作为参数。`string` 中最后一个字符的元素索引总是比 `string`\
  \ 的长度少 1——因为索引计数从 0 开始，而不是从 1。\n\n![image](img/1p.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序。\n\
  \n```cpp\n#include <string>  // 字符串支持\n#include <iostream>\nusing namespace std\
  \ ;\n```\n\n![image](img/commonp.jpg)\n\nsub.cpp\n\n![image](img/2p.jpg)添加一个包含最终\
  \ `return` 语句、已初始 `string` 变量声明以及输出 `string` 变量值语句的 main 函数。\n\n```cpp\nint main()\n\
  {\n  string text = “I do like the seaside” ;\n  cout << “Original: ” << text <<\
  \ endl ;\n  // Add more statements here.\n  return 0 ;\n}\n```\n\n![image](img/3p.jpg)在\
  \ main 函数中，插入语句在索引位置 10 变量值处插入子字符串，并输出修改后的 `string`。\n\n```cpp\ntext.insert( 10,\
  \ “to be beside “ ) ;\ncout << “Inserted: ” << text << endl ;\n```\n\n![image](img/4p.jpg)接下来，插入语句从索引位置\
  \ 3 开始从修改后的 `string` 值中删除两个字符，并输出修订后的 `string`。\n\n```cpp\ntext.erase( 2, 3 ) ;\n\
  cout << “Erased: ” << text << endl ;\n```\n\n![image](img/5p.jpg)现在，插入语句在索引位置 7\
  \ 处删除 25 个字符，插入替换子字符串，然后再次修订后的 `string`。\n\n```cpp\ntext.replace( 7, 25, “strolling\
  \ by the sea” ) ;\ncout << “Replaced: ” << text << endl ;\n```\n\n![image](img/6p.jpg)最后，插入语句输出索引位置\
  \ 7 处复制的九个字符，并输出字符串中的最后一个字符。\n\n```cpp\ncout << “Copied: ” << text.substr( 7, 9\
  \ ) << endl ;\ncout << “Last character: ” << text.at( text.size() - 1 ) << endl\
  \ ;\n```\n\n![image](img/7p.jpg)保存、编译并运行程序，查看输出显示 `string` 如何被操作。\n\n![image](img/pg77_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n`insert()` 函数可以可选地拥有第三和第四个参数——指定子字符串中开始复制的位置以及要复制的字符数。\n\
  \n![image](img/hot.jpg)\n\n`replace()` 函数可以可选地拥有第四和第五个参数——指定子字符串中开始复制的位置以及要复制的字符数。\n\
  \n## 总结\n\n![image](img/pg78_1.jpg)\n\n• C++ `<string>` 库提供了一个模拟数据类型的“string”对象——这样就可以创建\
  \ `string` 变量了。\n• 对于赋值给 `string` 变量的数值值，在将其转换为数值数据类型之前，无法对其进行算术运算。\n• 标准 `cin`\
  \ 函数从标准输入读取直到遇到空格，因此可以用于输入单个单词，并提供了一个 `ignore()` 函数。\n• `getline()` 函数从标准输入读取直到遇到换行符，因此可以输入字符串。\n\
  • `<sstream>` 库提供了一个“stringstream”对象，作为中间转换将字符串转换为其他类型。\n• 通过赋值空字符串 `\"\"` 或调用 `clear()`\
  \ 函数可以清空 `string` 变量。\n• 通过调用 `size()`、`capacity()` 和 `empty()` 函数可以揭示 `string`\
  \ 的特征。\n• 使用 `+` 运算符可以将多个 `string` 值拼接。\n• 使用 `+=` 运算符或调用 `append()` 函数可以将 `string`\
  \ 追加到另一个 `string` 中。\n• 使用 `==` 运算符或调用 `compare()` 函数可以将 `string` 进行比较。\n• 使用 `=`\
  \ 运算符或调用 `assign()` 函数可以将 `string` 值赋值给 `string`。\n• `swap()` 函数交换两个 `string` 变量的值。\n\
  • 可以 `find()` 函数搜索 `string` 的子字符串，或使用专门函数如 `find_first_of()`，并通过 `at()` 函数从指定位置检索字符。\n\
  • 子字符串可以通过 `insert()` 函数添加到 `string` 中，通过 `erase()` 函数删除，通过 `replace()` 函数替换，或通过\
  \ `substr()` 函数复制。\n\n\n\n\n用于写入输出的文件流对象声明以 `ofstream` 关键字开始，然后是为该特定文件流对象选择的名称，随后是括号，其中用于指定要写入的文本文件。因此，声明语法如下：\n\
  \n```\nofstream *object-name* ( *“file-name”* ) ;\n```\n\n指定文本文件的参数可以可选包含完整的文件路径，例如\
  \ `“C:\\data\\log.txt”` 或 `“home/user/log.txt”`，否则程序将在程序所在的目录中查找该文件。\n\n在向文件写入输出之前，程序应始终先测试文件流对象是否已实际创建。通常，这是通过一个\
  \ `if` 语句实现的，该语句允许程序仅在测试成功时才写入输出。\n\n如果指定的文件已存在，默认情况下它将被覆盖且不发出警告。否则，将创建一个新文件并进行写入。\n\
  \n![image](img/snake.jpg)\n\n指定的文件名或路径必须包含在双引号内，就像 `string` 一样。\n\n在向指定的文件写入输出内容后，程序应始终调用关联文件流对象的\
  \ `close()` 函数来关闭输出文件流。\n\n对应的程序首先构建一个用于写入输出的字符串。当文件流对象成功创建时，将其写入指定的文件，然后关闭文件流。\n\
  \n![image](img/1o.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <fstream>\
  \  // 文件流支持。\n#include <string>\n#include <iostream>\nusing namespace std ;\n```\n\
  \n![image](img/commono.jpg)\n\nwrite.cpp\n\n![image](img/2o.jpg)添加一个包含最终 `return`\
  \ 语句的 main 函数，并在 `string` 变量中构建一个长文本字符串\n\n```cpp\nint main()\n{\nstring poem =\
  \ “\\n\\tI never saw a man who looked” ;\npoem.append( “\\n\\tWith such a wistful\
  \ eye” ) ;\npoem.append( “\\n\\tUpon that little tent of blue” ) ;\npoem.append(\
  \ “\\n\\tWhich prisoners call the sky” ) ;\n// 在处添加更多语句。\nreturn 0 ;\n}\n```\n\n\
  ![image](img/3o.jpg)在 main 函数中，创建一个输出文件流对象\n\n```cpp\nofstream writer( “poem.txt”\
  \ ) ;\n```\n\n![image](img/4o.jpg)插入语句将 `string` 写入文件或退出，然后保存、编译并运行程序以查看结果\n\n```cpp\n\
  if ( ! writer )\n{\ncout << “Error opening file for output” << endl ;\nreturn -1\
  \ ;  // 信号错误并退出程序。\n}\nwriter << poem << endl ;  // 输出。\nwriter.close() ;  // 关闭文件流。\n\
  ```\n\n![image](img/pg81_1.jpg)\n\n![image](img/pg81_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n字符串值可以包含 `\\n` 换行和 `\\t` 制表符转义序列用于格式化行。\n\n![image](img/forget.jpg)\n\n注意换行符和制表符在文本文件中是如何保留的。\n\
  \n### 追加到文件\n\n![image](img/pg82_1.jpg)\n\n当创建文件流对象时，其选择名称后的括号可以可选包含额外的参数，指定一组文件“模式”以控制该文件流对象的行为。这些文件模式是\
  \ `ios` 命名空间的一部分，因此必须使用该前缀显式指定。下表列出了每个文件模式，并附带行为描述：\n\n| Mode: | 行为: |\n| :--- |\
  \ :--- |\n| `ios::out` | 打开文件写入输出 |\n| `ios::in` | 打开文件以读取输入 |\n| `ios::app` | 打开文件并在任何现有内容的末尾追加输出\
  \ |\n| `ios::trunc` | 截断现有文件（默认行为） |\n| `ios::ate` | 打开文件且不截断，并允许在文件的任何位置写入数据 |\n\
  | `ios::binary` | 将文件视为二进制格式而非文本，因此数据可以存储在非文本格式中 |\n\n如果多个模式之间用“|”管道符分隔，则可以指定多个模式。例如，为二进制输出打开文件的语句的语法如下所示：\n\
  \n```cpp\nofstream *object-name* ( *“file-name” , ios::out|ios::binary ) ;\n```\n\
  \n![image](img/forget.jpg)\n\n预处理器指令 `using namespace std;` 允许省略 `std` 命名空间前缀——因此\
  \ `cout` 指向 `std::cout` 函数。`ios` 命名空间存在于 `std` 命名空间内——可以使用命名空间前缀显式指定文件模式——例如 `std::ios::out`。\n\
  \n当未显式指定模式时的默认行为是将文件视为文本文件，写入后将被截断。\n\n最常用的模式是 `ios::app`，它确保在向指定文件写入新输出时，现有内容将被追加而非覆盖。\n\
  \n对应的程序将数据追加到上一个示例创建的文本文件中。\n\n![image](img/1o.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\
  \n```cpp\n#include <fstream>  // 文件流支持。\n#include <string>\n#include <iostream>\n\
  using namespace std ;\n```\n\n![image](img/commono.jpg)\n\nappend.cpp\n\n![image](img/2o.jpg)添加一个包含最终\
  \ `return` 语句的 main 函数，并在 `string` 变量中构建文本字符串\n\n```cpp\nint main()\n{\nstring info\
  \ = “\\n\\tThe Ballad of” ;\ninfo.append( “\\n\\tOscar Wilde 1898” ) ;\n// 在处添加更多语句。\n\
  return 0 ;\n}\n```\n\n![image](img/3o.jpg)在 main 函数中，创建一个输出文件流对象——指定将追加文本的模式\n\n\
  ```cpp\nofstream writer( “poem.txt” , ios::app ) ;\n```\n\n![image](img/4o.jpg)插入语句将\
  \ `string` 写入文件或退出，然后保存、编译并运行程序以查看结果\n\n```cpp\nif ( ! writer )\n{\ncout << “Error\
  \ opening file for output” << endl ;\nreturn -1 ;  // 信号错误并退出程序。\n}\nwriter << info\
  \ << endl ;  // 追加输出。\nwriter.close() ;  // 关闭文件流。\n```\n\n![image](img/pg81_1.jpg)\n\
  \n![image](img/pg81_2.jpg)\n\n![image](img/hot.jpg)\n\n读取字符。\n\n### 读取字符与行\n\n`ifstream`\
