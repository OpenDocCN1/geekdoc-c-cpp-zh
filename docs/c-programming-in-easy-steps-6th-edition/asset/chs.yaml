  \n## 合并与比较字符串\n\n当使用 `+` 运算符在赋值中拼接字符串时，合并后的字符串存储在 `string` 变量中。但当它用于 `cout` 函数时，字符串仅在输出中合并——变量值保持不变。\n\
  \n![image](img/pg70_1.jpg)\n\n`<string>` 库的 `append()` 函数也可用于拼接字符串，在其括号内指定要追加的 `string`\
  \ 值作为参数。当这用于 `cout` 函数时，字符串在变量中合并，然后将其值输出——在这种情况下，变量值会发生变化。\n\n字符串比较可以像数值比较一样，使用\
  \ `==` 等等运算符进行。当两个字符串精确匹配时，它返回 `true` (1)，否则返回 `false` (0)。\n\n或者，`<string>` 库的\
  \ `compare()` 函数也可用于比较作为其参数指定的 `string` 值。与 `==` 等等比较不同，`compare()` 函数在字符串完全相同时返回\
  \ 0，这是通过检查 `string` 值的组合 ASCII 代码实现的。当 `string` 参数的总和大于第一个字符串时，它返回 -1，否则返回 1。\n\n\
  \n\n\n\n![image](img/2p.jpg)添加一个主函数，包含一个最终的 `return` 语句并声明三个初始化的 `string` 变量\n\n\
