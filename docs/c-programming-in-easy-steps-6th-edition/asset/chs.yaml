  ## 继承类属性\n\n一个 C++ 类可以作为一个全新的类创建（如之前的示例所示），也可以从现有类中“派生”。重要的是，派生类会继承它所派生的父类（基类）的成员——除了它自己的成员之外。\n\
  \n![image](img/pg126_1.jpg)\n\n从基类继承成员的能力允许创建派生类，这些派生类共享某些已经在基类中定义的共同属性。例如，“Polygon”（多边形）基类可以定义所有多边形共\
  \ `width`（宽度）和 `height`（高度）属性。“Rectangle”（矩形）和“Triangle”（三角形）类可以从 Polygon 类派生——继承宽度和高度属性，加上它们定义自身独特特征的成员。\n\
  \n![image](img/pg126_2.jpg)\n\n继承的优点非常强大，并且是面向对象编程（OOP）的第二个原则。\n\n派生类的声明在其类名后添加一个冒号\
  \ `:`，后面跟一个访问限定符和它派生的类。\n\n![image](img/1v.jpg)通过指定要包含的 C++ 库类和使用的命名空间前缀开始新程序。\n\
  \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonv.jpg)\n\
  \nderived.cpp\n\n![image](img/2v.jpg)声明一个名为 “Polygon”的类，包含两个保护变量（仅该类成员及其派生类的成员可访问），以及一个用于给这些变量赋值的公共方法。\n\
  \n```cpp\nclass Polygon\n{\nprotected:\n    int width, height ;\npublic:\n    void\
  \ setValues( int w, int h ) { width = w; height = h ; }\n} ;\n```\n\n![image](img/3v.jpg)在\
  \ Polygon 类之后，声明一个派自 Polygon 类的 Rectangle 类并添加一个独特方法。\n\n```cpp\nclass Rectangle\
  \ : public Polygon\n{\npublic:\n    int area() { return ( width * height ) ; }\n\
  } ;\n```\n\n![image](img/4v.jpg)在 Rectangle 类之后，声明一个派自 Polygon 类的 Triangle 类并添加一个独特方法。\n\
  \n```cpp\nclass Triangle : public Polygon\n{\npublic:\n    int area() { return (\
  \ ( width * height ) / 2 ) ; }\n} ;\n```\n\n![image](img/5v.jpg)在 Triangle 类之后，添加包含最终\
  \ `return` 语句的 main 方法并创建每个派生类的实例。\n\n```cpp\nint main()\n{\n    Rectangle rect\
  \ ; Triangle trgl ;\n    return 0 ;\n}\n```\n\n![image](img/6v.jpg)插入对继承自 Polygon\
  \ 基类调用——以初始化继承的变量。\n\n```cpp\nrect.setValues( 4, 5 ) ;\ntrgl.setValues( 4, 5 ) ;\n\
  ```\n\n![image](img/7v.jpg)输出每个派生类独特方法的返回值。\n\n```cpp\ncout << “Rectangle area :\
  \ “ << rect.area() << endl ;\ncout << “Triangle area : “ << trgl.area() << endl\
  \ ;\n```\n\n![image](img/8v.jpg)保存、编译并运行程序。\n\n![image](img/pg127.jpg)不要混淆实例和派生类——实例是类的拷贝，而派生类是继承基类属性的新类。\n\
  \n## 调用构造函数\n\n虽然派生类继承父类的成员，但并不继承它的构造函数和析构函数。需要注意的是，创建派生类对象时总是会调用基类的默认构造函数——当对象被销毁时调用基类的析构函数。这些调用是在派生类之外进行的。\n\
  \n基类的默认构造函数没有参数，但该类也可以带有参数的重载构造函数。如果你希望在创建派生类对象时调用基类的重载构造函数，可以在派生类中创建一个匹配的重载构造函数——具有相同数量和类型的参数。\n\
  \n![image](img/128.jpg)\n\n通过指定要包含的 C++ 库类和使用的命名空间前缀开始新程序。\n\n```cpp\n#include <iostream>\n\
  using namespace std ;\n```\n\nbasecon.cpp\n\n![image](img/2v.jpg)声明一个名为 “Parent”的类，它将作为一个基类。\n\
  \n```cpp\nclass Parent\n{\n    // 类成员在这里\n} ;\n```\n\n![image](img/3v.jpg)在 Parent\
  \ 类声明的大括号之间插入一个公共访问限定符并添加一个默认构造函数以输出文本——标识何时被调用。\n\n```cpp\npublic:\n    Parent()\n\
  \    { cout << “Default Parent constructor called.” ; }\n```\n\n![image](img/4v.jpg)添加一个重载构造函数，接受一个整数参数并同样输出标识文本。\n\
  \n```cpp\nParent ( int a )\n{ cout << endl << “Overloaded Parent constructor called.”\
  \ ; }\n```\n\n![image](img/5v.jpg)在 Parent 类之后，声明一个派生的 “Daughter” 类。\n\n```cpp\n\
  class Daughter : public Parent\n{\n} ;\n```\n\n![image](img/pg128_2.jpg)\n\nSon\
  \ – Parent – Daughter\n\n![image](img/6v.jpg)在 Daughter 类声明中，插入一个公共访问限定符并添加一个默认构造函数以输出文本——标识何时被调用。\n\
  \n```cpp\npublic :\n    Daughter ()\n    { cout << endl << “     Derived Daughter\
  \ class default constructor called.” ; }\n```\n\n![image](img/7v.jpg)在 Daughter\
  \ 类之后，声明一个派生的 “Son” 类。\n\n```cpp\nclass Son : public Parent\n{\n} ;\n```\n\n\n\n\
  \n\n![image](img/8v.jpg)在 `Son` 类声明中，插入一个公共访问修符并添加一个接受单个整数参数的重载构造函数，同时输出标识性文本。\n\
  \n```cpp\npublic :\n\nSon ( int a ) : Parent ( a )\n{ cout << endl << \"      Derived\
  \ Son class overloaded constructor called.\"; }\n```\n\n![image](img/9v.jpg)在 `Son`\
  \ 类之后，添加一个包含最终 `return` 语句的 main 方法，并创建每个派生类的实例 – 调用基类和派生类的构造函数。\n\n```cpp\nint\
  \ main()\n{\n    Daughter emma ;\n    Son andrew(0) ;\n    return 0 ;\n}\n```\n\n\
  ![image](img/10v.jpg)保存、编译并运行程序，以查看每个构造函数被顺序调用时的输出。\n\n![image](img/pg129_1.jpg)\n\
  \n![image](img/snake.jpg)\n\n注意重载的 `Son` 类构造函数中的语法将整数参数传递给重载的基类构造函数。\n\n![image](img/forget.jpg)\n\
  \n每个类自动拥有一个空的默认构造函数和析构函数 – 例如，`Son( ){ }` 和 `~Son( ){ }`。\n\n### 重写基类方法\n\n可以在派生类中声明一个方法来覆盖基类中匹配的方法\
  \ – 如果两个方法的声明具有相同的名称、参数和返回类型。这实际上有效地隐藏了基类方法，因为除非显式调用（使用 `::` 作用域解析符进行精确识别），否则它是无法访问的。\n\
  \n![image](img/pg130_1.jpg)\n\n然而，重写基类方法的方法必须谨慎，以避免无意中隐藏重载方法 – 派生类中的单个重写方法将隐藏基类中所有同名的重载方法！\n\
  \n![image](img/1v.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始新程序。\n\n```cpp\n#include <string>\n\
  #include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonv.jpg)\n\n\
  override.cpp\n\n![image](img/2v.jpg)声明一个名为 “Man”的类，它将作为一个基类。\n\n```cpp\nclass Man\n\
  {\n    // 类成员在这里。\n} ;\n```\n\n![image](img/3v.jpg)在 `Man` 类声明的大括号之间，插入一个公共访问修符和一个内联输出方法。\n\
  \n```cpp\npublic :\nvoid speak() { cout << \"Hello! \" << endl ; }\n```\n\n![image](img/4v.jpg)现在，插入一个重载的内联输出方法。\n\
  \n```cpp\nvoid speak( string msg )\n{ cout << \" \" << msg << endl ; }\n```\n\n\
  ![image](img/5v.jpg)在 `Man` 类声明之后，声明一个派自 `Man` 类的名为 “Hombre”的类。\n\n```cpp\nclass\
  \ Hombre : public Man\n{\n    // 类成员在这里。\n} ;\n```\n\n![image](img/forget.jpg)\n\
  \n派生类中的方法声明必须与基类中的匹配才能覆盖它 – 如果使用了 `const` 关键字。\n\n![image](img/6v.jpg)在 `Hombre`\
  \ 类声明的大括号之间，插入一个访问修符和一个重写重载基类方法的方法 – 不带制表符输出。\n\n```cpp\npublic :\nvoid speak( string\
  \ msg ) { cout << msg << endl ; }\n```\n\n![image](img/7v.jpg)在 `Hombre` 类声明之后，添加一个包含最终\
  \ `return` 语句的 main 方法，并创建两个对象 – 基类的实例和派生类的实例。\n\n```cpp\nint main()\n{\n    Man\
  \ henry ;\n    Hombre enrique ;\n    // 在此处添加更多语句。\n    return 0 ;\n}\n```\n\n![image](img/pg131_1.jpg)\n\
  \n![image](img/8v.jpg)在 main 方法中，插入调用基类两个方法的语句。\n\n```cpp\nhenry.speak() ;\nhenry.speak(\
  \ \"It’s a beautiful evening.\" ) ;\n```\n\n![image](img/9v.jpg)接下来，插入一条调用派生类中重写方法的语句\
  \ – 不带制表符的输出。\n\n```cpp\nenrique.speak( \"Hola!\" ) ;\n```\n\n![image](img/10v.jpg)现在，插入一条显式调用基类中被重写方法的语句。\n\
  \n```cpp\nenrique.Man::speak( \"Es una tarde hermosa.\" ) ;\n```\n\n![image](img/11v.jpg)保存、编译并运行程序，查看重写方法和被重写方法的输出。\n\
  \n![image](img/pg131_2.jpg)\n\n![image](img/snake.jpg)\n\n在派生类中声明的重写方法隐藏了基类中的两个重载类。尝试调用\
  \ `enrique.speak()` – 编译器将报错说该调用没有匹配的方法。\n\n## 总结\n\n![image](img/pg132_1.jpg)\n\
  \n- 面向对象编程的第一原则是在单个类中对数据和功能进行封装。\n- 访问修符 `public`、`private` 和 `protected` 控制类成员从类外部的可访问性。\n\
  - 类声明描述了一个可以从其创建实例对象的数据结构。\n- 公共的 setter 和 getter 类方法从私有类变量成员中存储和检索数据。\n- 作用域解析符\
  \ `::` 可以显式识别一个类。\n- 与传递的参数同名的类成员可以显式识别。\n- 构造函数在对象创建时调用，析构函数在对象销毁时调用。\n- 面向对象编程的第二个原则是允许派生类继承基类的属性。\n\
  - 在派生类声明中，类名后面跟着冒号、修符。\n\n# 8 利用多态\n\n***本章将演示如何将程序拆分为模块组件，并引入多态 – C++ 的第三原则。***\n\
  \n- 指向类\n- 调用虚方法\n- 引导方法调用\n- 提供能力类\n- 抽象数据类型\n- 构建层次结构\n- 隔离类结构\n- 使用隔离类\n- 总结\n\
  \n## 指向类\n\n面向对象编程（OOP）三个基石是封装、继承和多态。第 7 章(#chapter7.xhtml)的示例演示了如何将数据封装在 C++ 类中，以及派生类如何继承基类的属性。本章引入最后一个基石原则：多态。\n\
  \n“多态”一词（源自希腊语，意为“多种形式”）描述了根据上下文赋予实体不同含义或目的。在 C++ 中，重载运算符可以被认为是多态的。例如，`*` 字符根据上下文可以表示乘法运算符或引用运算符。同样，`+`\
  \ 字符根据上下文可以表示加法运算符或拼接运算符。\n\n重要的是，C++ 类方法也可以是态的。理解类多态的关键是意识到可以创建一个基类指针并与特定的派生类绑定。\n\
  \n基类指针可以分配派生类的内存地址，以提供“上下文” – 唯一标识该派生类。例如，对于一个 `Base` 基类和一个派生类 `Sub` 类，可以这样创建指针：\n\
  \n```cpp\nSub inst ;\nBase* pSub = &inst ;\n```\n\n\n\n\n\n或者更简单地使用 `new` 关键字，如下：\n\
  \n```cpp\nBase* pSub = new Sub ;\n```\n\n![image](img/forget.jpg)\n\n返回第 6 章 了解更多关于指针的知识。\n\
  \n当存在多个派生类时，可以创建基类指针，通过每个派生类的唯一内存地址进行绑定——可以使用 `addressoof` `&` 运算符获取地址。\n\n![image](img/1b.jpg)通过指定要包含的\
  \ C++ 库类和要使用的命名空间缀来启动新程序\n\n```cpp\n#include <iostream>\nusing namespace std ;\n\
  ```\n\n![image](img/commonb.jpg)classptr.cpp\n\n![image](img/2b.jpg)声明一个 `Base`\
  \ 类，包含一个以十六进制格式输出传递整数值的方法\n\n```cpp\nclass Base\n{\npublic:\nvoid Identify( int\
  \ adr ) const\n{ cout << “Base class called by 0x” << hex << adr << endl ; }\n}\
  \ ;\n```\n\n![image](img/3b.jpg)声明两个空的派生类，`SubA` 和 `SubB`\n\n```cpp\nclass SubA\
  \ : public Base {     } ;\nclass SubB : public Base {     } ;\n```\n\n![image](img/4b.jpg)声明一个包含最终\
  \ `return` 语句的 main 方法\n\n```cpp\nint main()\n{\n// Program code goes here.\nreturn\
  \ 0 ;\n}\n```\n\n![image](img/5b.jpg)在 main 方法中，插入语句创建两个基类指针——每个指针绑定到特定的派生类\n\n\
  ```cpp\nBase* ptrA = new SubA ;\nBase* ptrB = new SubB ;\n```\n\n![image](img/6b.jpg)现在，插入使用指针调用基类方法的语句，传递每个类的内存地址进行输出\n\
  \n```cpp\nptrA -> Identify( (int) &ptrA ) ;\nptrB -> Identify( (int) &ptrB ) ;\n\
  ```\n\n![image](img/7b.jpg)保存、编译并运行程序以查看地址\n\n![image](img/pg135_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n此处使用 `->` 类指针运算符来调用类方法。\n\n![image](img/hot.jpg)\n\n十六进制地址作为 `int` 数据类型传递，然后由\
  \ `hex` 输出操纵符以十六进制格式显示。地址在每次程序执行时都会不同——它们是动态分配的。\n\n### 调用虚拟方法\n\n绑定到特定派生类的基类指针可以用于调用从基类继承的派生类方法。然而，派生类特有的方法必须通过实例对象调用。\n\
  \n![image](img/pg136_1.jpg)\n\n绑定到特定派生类的基类指针也可以使用 `::` 作用域解析符显式调用基类中的方法。\n\n最有用的是，当基类方法被声明为“虚”方法时，派生类中的继承方法可以重写基类中的方法。这只是在基类中一个以\
  \ `virtual` 关键字之前的普通方法声明。虚拟方法的声明表示该类将用作基类，从其派生出另一个类，该类可能包含一个用于重写虚拟基方法的方法。\n\n![image](img/1b.jpg)通过指定要包含的\
  \ C++ 库类和要使用的命名空间缀来启动新程序\n\n```cpp\n#include <iostream>\nusing namespace std ;\n\
  ```\n\n![image](img/commonb.jpg)virtual.cpp\n\n![image](img/2b.jpg)声明一个名为“Parent”的基类，包含一个普通方法声明和一个虚拟方法声明\n\
  \n```cpp\nclass Parent\n{\npublic :\nvoid Common() const\n{ cout << “I am part of\
  \ this family, ; }\nvirtual void Identify() const\n{ cout << “I am the parent” <<\
  \ endl ; }\n} ;\n```\n\n![image](img/3b.jpg)声明一个名为“Child”的派生类，包含一个重写虚拟基方法的方法\n\n\
  ```cpp\nclass Child : public Parent\n{\npublic :\nvoid Identify() const\n{ cout\
  \ << “I am the child” << endl ; }\n} ;\n```\n\n![image](img/snake.jpg)基类指针不能用于调用派生类中的非继承方法。\n\
  \n![image](img/4b.jpg)声明一个派自“Child”类的“Grandchild”类，包含一个重写虚拟基方法的方法和一个普通方法声明\n\n```cpp\n\
  class Grandchild : public Child\n{\npublic :\nvoid Identify() const\n{ cout << “I\
  \ am the grandchild” << endl ; }\nvoid Relate() const\n{ cout << “Grandchild has\
  \ parent and grandparent” ; }\n} ;\n```\n\n![image](img/pg137_1.jpg)Parent Child\
  \ Grandchild\n\n![image](img/5b.jpg)声明一个包含最终 `return` 语句并创建每个派生类实例的 main 方法，加上这些派生类的基类指针\n\
  \n```cpp\nint main()\n{\nChild son ;\nGrandchild grandson ;\nParent* ptrChild =\
  \ &son ;\nParent* ptrGrandchild = &grandson ;\n// 在 main 方法中，插入对每个方法的调用\nptrChild\
  \ -> Common() ; // 继承\nptrChild -> Identify() ; // 重写\nptrGrandchild -> Common()\
  \ ; // 继承\nptrGrandchild -> Identify() ; // 重写\nptrChild -> Parent::Common() ; //\
  \ 显式\nptrGrandchild -> Parent::Identify() ; // 显式\nreturn 0 ;\n}\n```\n\n\n\n\n\
  ![image](img/forget.jpg)\n\n在字符串中需要使用反斜符 `\\` 来转义单引号。\n\n## 提供能力类\n\n其唯一目的是允许其他类派生自该类的类被称为“能力类”（capability\
  \ classes）——它们为派生类提供能力。\n\n![image](img/pg140_1.jpg)\n\n能力类通常不包含数据，仅声明了若干可以在派生类中重写的虚拟方法。\n\
  \n接下来的示例在之前的示例的基础上，展示了如何将 `Bird` 类更写地写为一个能力类。它的方法不再包含输出语句，但如果被显式调用，将返回 `-1`（错误）值。\n\
  \n有必要将这些方法的返回类型从 `void` 更改为 `int`，并且这些更改必须反映在派生类中的每个重写方法中。\n\n![image](img/1b.jpg)通过指定要包含的\
  \ C++ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <iostream>\nusing namespace std ;\n\
  ```\n\n![image](img/commonb.jpg)\n\n`capability.cpp`\n\n![image](img/2b.jpg)声明一个名为“Bird”的基能力类，包含两个虚拟方法声明，如果被显式调用将报告错误\n\
  \n```cpp\nclass Bird\n{\npublic :\n    virtual int Talk() const { return -1 ; }\n\
  \    virtual int Fly() const { return -1 ; }\n} ;\n```\n\n![image](img/3b.jpg)声明一个名为“Pigeon”的派生类，包含两个重写基类方法的方法\n\
  \n```cpp\nclass Pigeon : public Bird\n{\npublic :\n    int Talk() const { cout <<\
  \ “Coo! Coo!” << endl ; return 0 ; }\n    int Fly() const { cout << “A pigeon flies\
  \ away...” << endl ; return 0 ; }\n} ;\n```\n\n![image](img/forget.jpg)\n\n派生类中重写方法的返回值必须与基类中声明的返回值匹配。\n\
  \n![image](img/4b.jpg)声明一个名为“Chicken”的派生类，包含两个重写基类方法的方法\n\n```cpp\nclass Chicken\
  \ : public Bird\n{\npublic :\n    int Talk() const { cout << “Cluck! Cluck!” <<\
  \ endl ; return 0 ; }\n    int Fly() const { cout << “I’m just a chicken – I can’t\
  \ fly!” << endl ; return 0 ; }\n} ;\n```\n\n![image](img/5b.jpg)声明一个主方法，创建绑定派生类的基类指针\n\
  \n```cpp\nint main()\n{\n    Bird* pPigeon = new Pigeon ;\n    Bird* pChicken =\
  \ new Chicken ;\n}\n```\n\n![image](img/6b.jpg)在主方法中，插入方法调用和一条在显式调用基类方法并遇到错误时终止程序的语句\n\
  \n```cpp\npPigeon -> Talk() ;\npChicken -> Talk() ;\npPigeon -> Bird::Talk() ;\n\
  if ( -1 ) { cout << “Error! - Program ended.” << endl ; return 0 ; }\npPigeon ->\
  \ Fly() ;  // 将不会被调用。\npChicken -> Fly() ; // 将不会被调用。\nreturn 0 ;  // 语句将不会执行。\n\
  ```\n\n![image](img/7b.jpg)保存、编译并运行程序以查看输出\n\n![image](img/pg141_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n能力类方法旨在在派生类中被重写——它们不应被显式调用。\n\n![image](img/hot.jpg)\n\n更多错误处理的详细信息，请参考此处和此处。\n\
  \n## 抽象数据类型\n\n抽象数据类型（ADT）代表一个概念而非一个实体对象，并且总是其他类的基类。通过将其一个或多个方法初始化为 `0`，可以将基类变为\
  \ ADT。这些被称为“纯虚拟方法”，并且必须在派生类中被重写。\n\n![image](img/1b.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\
  \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/commonb.jpg)\n\
  \n`adt.cpp`\n\n![image](img/2b.jpg)声明一个名为“Shape”的基 ADT 类，包含三个纯虚拟方法\n\n```cpp\nclass\
  \ Shape\n{\npublic :\n    virtual int getArea() = 0 ;\n    virtual int getEdge()\
  \ = 0 ;\n    virtual void Draw() = 0 ;\n} ;\n```\n\n![image](img/3b.jpg)声明一个名为“Rect”的派生类，包含两个私有变量\n\
  \n```cpp\nclass Rect : public Shape\n{\nprivate :\n    int height, width ;\n} ;\n\
  ```\n\n![image](img/4b.jpg)在派生类声明中，插入公共构造函数和析构函数\n\n```cpp\npublic :\n    Rect(\
  \ int initWidth, int initHeight )\n    {\n        height = initHeight ;\n      \
  \  width = initWidth ;\n    }\n    ~Rect() ;\n```\n\n![image](img/snake.jpg)\n\n\
  创建 ADT 的实例对象是不允许的——尝试这样做会导致编译器错误。\n\n![image](img/5b.jpg)在派生类“Rect”声明中，插入公共方法以重写“Shape”基类\n\
  \n```cpp\nint getArea() { return height * width ; }\nint getEdge() { return 2 *\
  \ (height + width) ; }\nvoid Draw()\n{\n    for (int i = 0 ; i < height ; i++) {\
  \ cout << “_” }\n}\n```\n\n![image](img/6b.jpg)声明一个主方法，包含返回语句并创建“Rect”类的实例——表示一个形状\n\
  \n```cpp\nint main()\n{\n    Shape* pQuad = new Rect( 3, 7 ) ;\n    Shape* pSquare\
  \ = new Rect( 5, 5 ) ;\n    return 0 ;\n}\n```\n\n![image](img/7b.jpg)在主方法中插入对方法的调用，然后保存、编译并运行程序以查看输出\n\
  \n```cpp\npQuad -> Draw() ;\ncout << “Area is ” << pQuad -> getArea() << endl ;\n\
  cout << “Perimeter is ” << pQuad -> getEdge() << endl ;\npSquare -> Draw() ;\ncout\
  \ << “Area is ” << pSquare -> getArea() << endl ;\ncout << “Perimeter is ” << pSquare\
  \ -> getEdge() << endl ;\n```\n\n![image](img/pg43.jpg)\n\n![image](img/forget.jpg)基类只需要包含一个虚拟方法即可创建抽象数据类型。\n\
  \n## 构建复杂的层次结构\n\n有时从另一个 ADT 派生 ADT 以构建复杂的类层次结构。这提供了极大的活性，只要每个纯方法在某个派生类中定义都是完全可以的。\n\
  \n![image](img/1b.jpg)通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\n```cpp\n#include <iostream>\n\
  using namespace std ;\n```\n\n![image](img/commonb.jpg)\n\n`hierarchy.cpp`\n\n![image](img/2b.jpg)声明一个名为“Boat”的基\
  \ ADT 类，包含一个变量、访问方法和一个纯虚拟方法\n\n```cpp\nclass Boat\n{\nprotected:\nint length ;\n\
  public:\n    int getLength() { return length ; }\n    virtual void Model() = 0 ;\n\
  } ;\n```\n\n![image](img/3b.jpg)声明一个名为“Sailboat”的 ADT 类（派自 Boat 类）——同样包含一个变量、访问方法和一个纯虚拟方法\n\
  \n```cpp\nclass Sailboat : public Boat\n{\nprotected :\nint mast ;\npublic :\n \
  \   int getMast() { return mast ; }\n    virtual void Boom() = 0 ;\n} ;\n```\n\n\
  ![image](img/4b.jpg)声明一个名为“Laser”的普通类（派自 Sailboat 类），其中所有成员将允许公共访问\n\n```cpp\nclass\
  \ Laser : public Sailboat\n{\npublic :\n} ;\n```\n\n\n\n\n\n![image](img/6b.jpg)在\
  \ `Laser` 类中，定义在该类派生类中声明的纯虚方法\n\n```cpp\nvoid Model() { cout << “Laser Classic”\
  \ << endl ; }\nvoid Boom() { cout << “Boom: 14ft” << endl ; }\n```\n\n![image](img/7b.jpg)声明一个\
  \ `main` 方法，包含一个最终的 `return` 语句，并在层次结构的底层创建一个派生类的实例\n\n```cpp\nint main()\n{\n \
  \   Laser* pLaser = new Laser ;\n    // Add more statements here.\n    return 0\
  \ ;\n}\n```\n\n![image](img/8b.jpg)在 `main` 方法中，插入对每个定义方法的调用\n\n```cpp\npLaser ->\
  \ Model() ;\ncout << “Length: “ << pLaser -> getLength() << “ft” << endl ;\ncout\
  \ << “Height: “ << pLaser -> getMast() << “ft” << endl ;\npLaser -> Boom() ;\n```\n\
  \n![image](img/9b.jpg)保存、编译并运行程序以查看输出\n\n![image](img/pg145_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n尝试添加一个派自 `Boat` 类的 `Powerboat` 类（包含引擎信息），以及一个派自 `Powerboat` 类的 `Cruiser` 类 ——\
  \ 用于为变量赋值并定义虚方法。\n\n### 隔离类结构\n\n书中每个示例程序的源代码通常包含在单个 `.cpp` 文件中以节省空间，但实际上，OOP 程序通常包含在三个单独文件中：\n\
  \n*   头文件 `.h` – 仅包含类声明。\n*   实现文件 `.cpp` – 包含类定义，用于实现头文件中声明的方法，该文件通过 `#include`\
  \ 指令引用。\n*   客户端 `.cpp` 文件 – 包含一个 `main` 方法，该方法使用头文件中声明的类成员，该文件同样通过 `#include` 指令引用。\n\
  \n![image](img/pg146_1.jpg)\n\n例如，一个加法器程序可能由三个文件组成：`ops.h`（声明操作类的头文件）、`ops.cpp`（定义操作方法的实现文件）和\
  \ `sum.cpp`（调用各种操作的客户端文件）。\n\n![image](img/hot.jpg)\n\n客户端文件有时被称为“驱动”（driver）文件。\n\
  \n编译 `sum.cpp` 时，编译器会将包含的头文件和实现文件合并到程序中。它首先将头文件和实现文件转换为二进制对象文件（`ops.o`），然后将头文件和客户端文件转换为第二个二进制对象文件（`sum.o`）。最后，链接器将两个对象文件合并成单个可执行文件（`sum.exe`）。\n\
  \n![image](img/pg146_2.jpg)\n\n![image](img/hot.jpg)\n\n使用 `#include` 指令引用头文件与使用\
  \ `#include` 指令引用标准 C++ 库的方式类似。\n\n在独立的“模块化”文件中隔离类结构具有提高可移植性的优势，并且通过明确识别每个文件的目的使代码维护更加容易。\n\
  \n要让编译器将三个源文件合并成单个可执行文件，只需要在编译器命令中显式指定 `.cpp` 文件 —— `#include` 指令确保头文件也会被识别。\n\n\
  例如，在 `ops.cpp` 和 `sum.cpp` 中都使用 `#include “ops.h”` 语句，编译侧描述的示例的命令不需要在编译器命令中指定 `ops.h`\
  \ 头文件，只需要 `c++ ops.cpp sum.cpp -o sum.exe`。\n\n![image](img/pg147_1.jpg)\n\n###\
  \ 计算器\n\n此示例将允许用户输入一个简单的算术表达式并输出计算结果。它将在首次启动时提供说明，并允许用户输入后续表达式 —— 或通过字符 0 退出。\n\n\
  ![image](img/1b.jpg)通过声明名为“Calculator”的类开始编写头文件\n\n```cpp\nclass Calculator\n{\n\
  } ;\n```\n\n![image](img/pg147_2.jpg)\n\n#### ops.h\n\n![image](img/2b.jpg)在类声明中插入公共方法声明\n\
  \n```cpp\npublic :\n    Calculator() ;\n    void launch() ;\n    void readInput()\
  \ ;\n    void writeOutput() ;\n    bool run() ;\n```\n\n#### ops.cpp\n\n![image](img/3b.jpg)在类声明中插入私有声明\n\
  \n```cpp\nprivate :\n    double num1 ;\n    double num2 ;\n    char oper ;\n   \
  \ bool status ;\n```\n\n#### 类的应用\n\n![image](img/4b.jpg)使用 `#include` 开始头文件\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n```\n\n#### 隔离的方法\n\n![image](img/5b.jpg)用定义开始实现文件\n\
  \n```cpp\nCalculator::Calculator()\n{\n    status = true ;\n}\n\nvoid Calculator::launch()\n\
  {\n    cout << “CALCULATOR” << endl ;\n    cout << “Enter a number, an operator\
  \ (+,-*,/), and another number.” << endl ;\n    cout << “Hit zero to exit.” << endl\
  \ ;\n}\n\nvoid Calculator::readInput()\n{\n    cout << “> “ ; cin >> num1 ;\n  \
  \  if ( num1 == 0 ) \n        status = false ;\n    else\n        cin >> oper >>\
  \ cin >> num2 ;\n}\n\nvoid Calculator::writeOutput()\n{\n    if ( status ) \n  \
  \      switch( oper )\n        {\n            case ‘+’ : { cout << ( num1 + num2\
  \ ) << endl ; break; }\n            case ‘-’ : { cout << ( num1 - num2 ) << endl\
  \ ; break; }\n            case ‘*’ : { cout << ( num1 * num2 ) << endl ; break;\
  \ }\n            case ‘/’ : \n                if ( num2 != 0 ) \n              \
  \      cout << ( num1 / num2 ) << endl ;\n                else \n              \
  \      cout << “Cannot divide by 0” << endl ;\n                break;\n        }\n\
  }\n\nbool Calculator::run()\n{\n    return status ;\n}\n```\n\n#### sum.cpp\n\n\
  ![image](img/6b.jpg)使用包含指令开始编写客户端文件\n\n```cpp\n#include “ops.h”\n\nint main()\n\
  {\n    Calculator* pCalc = new Calculator ;\n    pCalc -> launch() ;\n    while\
  \ ( pCalc -> run() )\n    {\n        pCalc -> readInput() ;\n        pCalc -> writeOutput()\
  \ ;\n    }\n    return 0 ;\n}\n```\n\n\n\n\n该程序循环运行，直到用户输入 0 并按下回车键——将“status”控制变量更改为\
  \ `false`，从而退出程序。\n\n## 总结\n\n![image](img/pg150_1.jpg)\n\n*   面向对象编程的三基石是封装、继承和多态。\n\
  *   多态实体根据其语境具有不同的含义或目的。\n* 基类指针可以用于调用其所绑定的派生类中继承的方法。\n* 基类指针还可以使用 `::` 作用域解析符显式地调用基类方法。\n\
  * 虚基类方法旨在在派生类中被重写。\n*   多态允许将同名方法的调用定向到相应的重写方法。\n*   能力类（Capability classes）通常不包含数据，仅声明了可以在派生类中重写的虚方法。\n\
  *   返回 `-1` 值的虚方法发出错误信号，表示它们不应被直接调用。\n* 抽象数据类型（ADT）代表一个概念，并且总是其他类的基类。\n*   使用赋值\
  \ `=0` 声明纯虚拟方法表示该类是一个 ADT。\n*   类可以从 ADT 派生——但你无法创建 ADT 的实例。\n* 一个 ADT 可以从另一个 ADT\
  \ 派生，创建一个复杂的类层次结构。\n* 程序可以拆分为头文件、实现文件和客户端文件，以帮助移植性并简化代码维护。\n* 被 `#include` 指令引用的头文件将在编译期间由编译器自动包含。\n\
  \n9\n\n## 宏处理\n\n***本章演示了如何让 C++ 编译器在编译程序之前执行实用的任务。***\n\n探索编译\n* 定义替换符\n* 定义条件\n\
  * 提供备选方案\n* 保护包含\n* 使用宏函数\n* 构建字符串\n* 调试断言\n* 总结\n\n## 探索编译\n\n每当 C++ 编译器运行时，它首先调用其预处理器来寻找可能包含在源代码中的任何编译器指令。这些指令中的每一个都以\
  \ `#` 哈希字符开头，并将首先执行，以便在汇编和编译之前有效地修改源代码。\n\n![image](img/pg152_1.jpg)\n\n编译器指令对预处理器所做的更改创建了通常不可见的临时文件。正是这些临时文件被用于创建二进制对象文件：\n\
  \n* 编译期间创建的第一个临时文件通过将编译器指令替换为实现这些指令的库代码来扩展原始源代码。该文本文件的命名与源文件相似，但扩展名为 `.ii`。\n* 编译期间创建的第二个临时文件是将临时扩展\
  \ `.ii` 文件翻译成低级汇编语言指令。该文本文件的命名与源文件相似，但扩展名为 `.s`。\n* 编译期间创建的第三个临时文件是将临时汇编语言 `.s`\
  \ 文件翻译成机器码。该二进制对象文件的命名与源文件相似，但扩展名为 `.o`。\n\n因此，编译过程利用预处理器来编译源代码，使用“汇编器”将其翻译成机器码，并使用“链接器”将一个或多个二进制对象转换为可执行程序。\n\
  \n你可以通过指示编译器使用 `-save-temps` 编译器选项来保存它们，从而查看临时文件。然后可以在纯文本编辑器中打开这两个临时文本文件。\n\n最重要的是，你可以看到带有\
  \ `.ii` 扩展名的临时文件包含了来自任何已包含库的完整函数定义。例如，它将 `#include <iostream>` 指令替换为 `cin`、`cout`、`cerr`\
  \ 函数以及用于将错误消息重定向到文件的 `clog` 函数的定义。`.ii` 文件的末显示定义的函数属于“std”命名空间——因此它们可以在没有 `std::`\
  \ 前缀的情况下出现。\n\n![image](img/1r.jpg)创建一个名为“prog.cpp”的简单程序，该程序在执行时将输出一条消息\n\n```cpp\n\
  #include <iostream>\n\nusing namespace std ;\n\nint main()\n{\n    cout << “This\
  \ is a simple test program” << endl ;\n    return 0 ;\n}\n```\n\n![image](img/commonr.jpg)\n\
  \nprog.cpp\n\n![image](img/2r.jpg)使用 `-save-temps` 选项发布命令保存临时文件，并使用 `-c` 选项将此程序的源文件编译为对象文件——不生成可执行文件\
  \ `c++ prog.cpp -save-temps -c`\n\n![image](img/3r.jpg)用记事本等纯文本编辑器打开 `.ii` 文件，然后滚动到文件末尾查看修改后的源代码——注意\
  \ `<iostream>` 库函数如何在 `std` 命名空间中定义\n\n![image](img/pg153_1.jpg)\n\n![image](img/4r.jpg)用纯文本编辑器打开\
  \ `.s` 文件查看低级汇编指令——注意消息字符串现在由特殊字符 `\\0` 终止\n\n![image](img/5r.jpg)使用 -save-temps\
  \ 选项发布命令保存临时文件 `c++ prog -o prog`\n\n![image](img/pg153_2.jpg)\n\n![image](img/hot.jpg)一个或多个对象文件可以创建可执行文件——如处所示](#chapter08.xhtml_70)。\n\
  \n## 定义替换\n\n正如预处理器为 `#include` 指令替换库代码一样，其他预处理器指令也可在汇编和编译之前替换文本或数值。\n\n![image](img/pg154_1.jpg)\n\
  \n#define 指令指定一个宏，其由标识符名称和字符串或数值组成，由预处理器替换源代码中的每个出现。\n\n与 #include 预处理器指令一样，define\
  \ 指令可以出现在源代码的开头。与常量相同，宏名称传统上使用大写，定义的字符串值应包含双引号内。对于表达式中的数值替换，宏名称应包含括号以确保正确的优先级。\n\
  \n![image](img/1r.jpg)通过声明三个 define 直接启动新程序\n\n```cpp\n#define BOOK “C++ Programming\
  \ in easy steps”\n#define NUM 200\n#define RULE “*******************************”\n\
  ```\n\n![image](img/commonr.jpg)\n\ndefine.cpp\n\n![image](img/2r.jpg)指定要包含的库类和命名空间\n\
  \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/3r.jpg)添加包含返回语句的三个输出替换值的\
  \ main 函数\n\n```cpp\nint main()\n{\n    cout << RULE << endl << BOOK << endl <<\
  \ RULE ;\n    cout << endl << “NUM is: ” << NUM << endl ;\n    cout << “Double NUM:\
  \ ” << ( NUM ) * 2 ) << endl ;\n    return 0 ;\n}\n```\n\n![image](img/4r.jpg)保存、编译并运行程序以查看输出\n\
  \n```bash\nc++ .o -o define\n```\n\n![image](img/5r.jpg)数值常量通常最好声明为 `const` 变量——因为由预处理器替换的值不受类型检查。\n\
  \n![image](img/6r.jpg)重新编译程序，保存临时文件 `c++ define.cpp -save-temps -o define.exe`\n\
  \n\n\n\n\n![image](img/pg155_1.jpg)\n\n![image](img/hot.jpg)\n\nLinux 用户可以使用转义的双引号\
  \ `\\””string”\\”` 或普通的单引号 `‘“string”’` 来在命令中包含引用的字符串。\n\n此外，也可以通过命令行使用 `-Dname`\
  \ 选项进行替换，将宏替换为指定的值。请注意，双引号内的字符串值在命令中也必须用转义引号括——因此替换将包含双引号字符。\n\n![image](img/7r.jpg)删除或注释掉针对\
  \ `BOOK` 和 `NUM` 标识符的 `define` 指令——保存程序文件以应用更改。\n\n![image](img/8r.jpg)重新编译程序并指定替换宏的值，然后再次运行程序\
  \ `c++ -DNUM=50 -DBOOK=\\””Java in easy steps”\\”`。\n\n```bash\ndefine.cpp -o define.exe\n\
  ```\n\n![image](img/pg155_2.jpg)\n\n![image](img/hot.jpg)\n\nLinux 用户可以使用转义的双引号\
  \ `\\””string”\\”` 或普通的单引号 `‘”string”’` 来在命令中包含引用的字符串。\n\n![image](img/forget.jpg)\n\
  \n尝试编译一个未定义标识符的程序将产生“未在此作用域中声明”的错误。\n\n### 定义条件\n\n预处理器可以通过使用宏函数执行条件测试，从而对程序源代码进行智能插入。`#ifdef`\
  \ 指令执行最常见的预处理器功能，它会测试指定的宏是否已定义。当宏已定义时（测试返回真），预处理器将插入后续行上的所有指令或语句，直到遇到相应的 `#endif`\
  \ 指令。\n\n![image](img/pg156_1.jpg)\n\n相反，`#ifndef` 指令测试指定的宏是否未定义。当该测试返回真时，它将插入后续行上的所有指令或语句，直到遇到相应的\
  \ `#endif` 指令。\n\n为了满足任一条件测试，需要注意的是，`#define` 指令仅需指定宏名称来定义标识符——它不需要指定用于替换的值。\n\n\
  以后可以使用 `#undef` 指令移除之前之前定义的任何宏——使得随后的 `#ifdef` 条件测试失败。随后可以通过另一个 `#define` 指令重新定义宏：\n\
  \n![image](img/1r.jpg)启动一个带有条件测试的新程序，当宏尚未定义时插入一个指令。\n\n```cpp\n#ifndef BOOK\n#define\
  \ BOOK “C++ Programming in easy steps”\n#endif\n```\n\n![image](img/commonr.jpg)\n\
  \nifdef.cpp\n\n![image](img/2r.jpg)指定要包含的库类和命名空间\n\n```cpp\n#include <iostream>\n\
  using namespace std ;\n```\n\n![image](img/3r.jpg)添加一个包含最终 `return` 语句的 main 函数。\n\
  \n```cpp\nint main()\n{\n    // 程序代码在此。\n    return 0 ;\n}\n```\n\n![image](img/4r.jpg)在\
  \ main 函数中，添加一个条件预处理器测试，在测试成功时插入输出语句。\n\n```cpp\n#ifdef BOOK\ncout << BOOK ;\n#endif\n\
  ```\n\n![image](img/5r.jpg)添加另一个条件预处理器测试，在测试成功时定义一个新宏并插入输出语句。\n\n```cpp\n#ifndef\
  \ AUTHOR\n#define AUTHOR “Mike McGrath”\ncout << “ by ” << AUTHOR << endl ;\n#endif\n\
  ```\n\n![image](img/6r.jpg)接下来，添加一个条件测试，如果宏已经定义，则取消定义它。\n\n```cpp\n#ifdef BOOK\n\
  #undef BOOK\n#endif\n```\n\n![image](img/7r.jpg)现在，添加一个条件测试，如果宏不再定义，则重新定义它并插入输出语句。\n\
  \n```cpp\n#ifndef BOOK\n#define BOOK “Linux in easy steps”\ncout << BOOK “ by “\
  \ << AUTHOR << endl ;\n#endif\n```\n\n![image](img/8r.jpg)保存、编译并运行程序以查看插入结果。\n\n\
  ![image](img/pg157_1.jpg)\n\n![image](img/9r.jpg)重新编译程序，这次在命令中定义 `BOOK` 宏，然后再次运行程序，在输出的第一行中看到指定的值。\n\
  \n```bash\nc++ -DBOOK=\\”“Python in easy steps”\\” ifdef.cpp -o ifdef.exe\n```\n\
  \n![image](img/pg157_2.jpg)\n\n![image](img/snake.jpg)\n\n每个预处理器指令必须单独占一行——你不能在同一行上放置多个指令。\n\
  \n![image](img/forget.jpg)\n\n在 Windows 系统上，命令中指定的字符串宏值必须用转义的双引号括。\n\n### 提供替代方案\n\
  \n可以通过添加 `#else` 指令扩展 `#ifdef` 和 `#ifndef` 执行的条件测试提供替代方案。例如：\n\n```cpp\n#ifdef WEATHER\n\
  cout << WEATHER ;\n#else\n#define WEATHER “Sunny”\n#endif\n```\n\n![image](img/pg158_1.jpg)\n\
  \n同样，`#if`、`#else` 和 `#elif` 宏可以执行多个条件测试，就像普通的 C++ `if` 和 `else` 关键字一样。\n\n预定义宏是特定平台的，通常这些名称以双下划线开头，以避免与选择的名称意外冲突。要查看预定义宏列表，对空文件使用\
  \ `-dM` 选项直接调用预处理器：\n\n```bash\ncpp -dM empty.txt\n```\n\n滚动列表查找 Windows 的 `_WIN32`\
  \ 或 Linux 的 `__linux`。`_WIN32` 宏有一个下划线，而 `__linux` 宏有两个下划线。\n\n### 包含保护\n\n![image](img/pg158_2.jpg)\n\
  \n![image](img/pg158_3.jpg)\n\n![image](img/snake.jpg)\n\n使用 `cpp` 命令（而不是 `c++`\
  \ 命令）并确保 `-dM` 选项大小写正确。\n\n```cpp\n#if defined __WIN32\n#define PLATFORM “Windows”\n\
  #elif defined __linux\n#define PLATFORM “Linux”\n#endif\n\n#include <iostream>\n\
  using namespace std ;\n\nint main()\n{\n    cout << PLATFORM << “ System” << endl\
  \ ;\n    return 0 ;\n}\n\nif ( PLATFORM == “Windows” )\n    cout << “Performing\
  \ Windows-only tasks...” << endl ;\nif ( PLATFORM == “Linux” )\n    cout << “Performing\
  \ Linux-only tasks...” << endl ;\n```\n\n\n\n\n通常，一个 C++ 程序将包含许多 `.h` 头文件和一个包含主程序的单个\
  \ `.cpp` 实现文件。头文件通常可能包含一个或多个 `#include` 指令，以便从其他头文件中可以使用其他类或函数，并可能在定义出现在两个文件中时导致重复。例如，当一个头文件包含了了另一个包含函数定义的头文件时，编译器将认为该定义出现在了每个文件中——因此编译将失败。\n\
  \n![image](img/pg160_1.jpg)\n\n解决此重定义问题的流行方案是使用预处理器指令，以确保编译器只接触到单一定义。这些被称为“包含保护符”（inclusion\
  \ guards），并为每个头文件创建一个唯一的宏名称。按照惯例，该名称通常是文件名的大写版本，并将点更改为下划线——例如，文件 `rum.h` 对应 `RUM_H`。\n\
  \n![image](img/hot.jpg)\n\n包含保护符也被“宏保护符”（macro guards）或简单称为“包含保护符”（include guards）。\n\
  \n在创建一个用于防止重复的宏时，`#ifndef` 指令首先测试该定义是否已经由同一程序中包含的另一个头文件创建。如果定义已存在，编译器将忽略重复定义，否则\
  \ `#define` 指令将允许编译器使用该头文件中的定义：\n\n![image](img/1r.jpg)创建一个名为“add.h”的头文件，其中包含“add”函数的内联声明\n\
  \n```cpp\ninline int add ( int x, int y ) { return ( x + y ) ; }\n```\n\n![image](img/commonhr.jpg)\n\
  \nadd.h\n\n![image](img/2r.jpg)现在，创建一个名为“triple.h”的头文件，其中包含一个处理器指令，使 `add` 函数可以在“triple”函数的内联声明中使用\n\
  \n```cpp\n#include “add.h”\n\ninline int triple ( x ) { return add( x, add( x, x\
  \ ) ) ; }\n```\n\n![image](img/commonhr.jpg)\n\ntriple.h\n\n![image](img/3r.jpg)使用预处理器指令开始一个新程序，使\
  \ `add` 和 `triple` 函数均可用\n\n```cpp\n#include “add.h”\n\n#include “triple.h”\n```\n\
  \n![image](img/commonr.jpg)\n\nguard.cpp\n\n![image](img/4r.jpg)指定要包含的库类和命名空间\n\n\
  ```cpp\n#include <iostream>\n\nusing namespace std ;\n```\n\n![image](img/5r.jpg)添加一个主函数，其中包含调用包含头文件中\
  \ `add()` 和 `triple()` 函数的语句\n\n```cpp\nint main()\n{\n  cout << “9 + 3 = “ << add(\
  \ 9, 3 ) << endl ;\n  cout << “ 9 x 3 = “ << triple( 9 ) << endl ;\n  return 0 ;\n\
  }\n```\n\n![image](img/6r.jpg)保存文件，然后尝试编译程序以查看编译是否失败，因为 `add` 函数似乎定义了两次——分别在“add.h”中和通过包含在“triple.h”中\n\
  \n![image](img/pg161_1.jpg)\n\n![image](img/7r.jpg)编辑头文件“add.h”，将内联函数封装在预处理器包含保护符中\n\
  \n```cpp\n#ifndef ADD_H\n#define ADD_H\n\ninline int add ( int x, int y ) { return\
  \ ( x + y ) ; }\n#endif\n```\n\n![image](img/8r.jpg)保存修改后的文件，然后编译并运行程序——现在编译成功，因为包含保护符防止了\
  \ `add` 函数的表面重复定义\n\n![image](img/pg161_2.jpg)\n\n![image](img/snake.jpg)\n\n使用传统的命名方案（即宏名称与文件名相似）以避免冲突。\n\
  \n![image](img/forget.jpg)\n\n所有头文件都应该包含头保护——在 `triple.h` 文件中添加 `TRIPLE_H` 宏。\n\n\
  ## 使用宏函数\n\n`#define` 指令可用于创建宏函数，这些函数会在编译前的源代码中被替换。\n\n![image](img/pg162_1.jpg)\n\
  \n一个预处理器函数声明由一个宏名称以及紧随其包含函数参数的括号组成——在名称和括号之间不要留任何空格是非常重要的。声明之后紧跟在另一组括号内的函数定义。例如，一个将参数减半的预处理器宏函数看起来如下：\n\
  \n```cpp\n#define HALF( n ) ( n / 2)\n```\n\n使用宏函数时需要小心，因为与普通的 C++ 函数不同，它们不执行任何形式的类型检查——因此很容易创建一个导致错误的宏。由于由于原因，内联函数通常比宏函数更优，但由于宏直接替换其代码，它们避免了函数调用的开销——因此程序运行得更快。结果差异可以在编译过程中创建的第一个临时文件中：\n\
  \n![image](img/1r.jpg)通过定义两个处理单个参数的宏函数开始一个新程序\n\n```cpp\n#define SQUARE( n ) ( n\
  \ * n )\n\n#define CUBE( n ) ( n * n * n )\n```\n\n![image](img/commonr.jpg)\n\n\
  macro.cpp\n\n![image](img/2r.jpg)在宏定义之后，指定要包含的库类和要使用的命名空间前缀\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std ;\n```\n\n![image](img/3r.jpg)接下来，声明内联函数来处理单个参数——就像宏函数一样\n\
  \n```cpp\ninline int square ( int n ) { return ( n * n ) }\n\ninline int cube (\
  \ int n ) { return ( n * n * n ) }\n```\n\n![image](img/4r.jpg)添加一个主函数，其中包含最后的 `return`\
  \ 语句\n\n```cpp\nint main()\n{\n  // 程序代码在这里\n  return 0 ;\n}\n```\n\n![image](img/5r.jpg)在主函数开头声明并初始化一个整数变量\n\
  \n```cpp\nint num = 5 ;\n```\n\n![image](img/6r.jpg)现在，插入语句调用每个宏函数和每个内联函数\n\n```cpp\n\
  cout << “Macro SQUARE: ” << SQUARE( num ) << endl ;\ncout << “Inline square: ” <<\
  \ square( num ) << endl ;\ncout << “Macro CUBE: ” << CUBE( num ) << endl ;\ncout\
  \ << “Inline cube: ” << cube( num ) << endl ;\n```\n\n![image](img/7r.jpg)保存文件，然后编译程序，保存临时文件并运行程序\n\
  \n```bash\nc++ macro.cpp -save-temps -o macro.exe\n```\n\n![image](img/pg163_1.jpg)\n\
  \n![image](img/8r.jpg)用纯文本编辑器打开临时“.ii”文件，查看宏函数已直接替换在每个输出语句中\n\n![image](img/pg163_2.jpg)\n\
  \n## 构建字符串\n\n处理器 `#` 运算符被称为字符串化（stringizing）运算符，因为它将作为宏参数传递的字符序列转换为字符串——添加双引号来封装字符串。\n\
  \n![image](img/pg164_1.jpg)\n\n作为字符串化运算符参数的字符序列前后的空白都会被忽略，字符之间的多个空格将减少为一个空格。\n\n\
  字符串化运算符有助于将字符串值传递给预处理器 `#define` 指令，而无需为每个字符串加上双引号。\n\n宏定义可以使用 `##` 合并运算符将两个项合并为一个项。当合并后的项是变量名时，其值不会被宏展开——它只是允许变量名被宏替换。\n\
  \n\n\n\n\n![image](img/3r.jpg)在宏定义之后，指定要包含的库类以及要使用的命名空间缀\n\n```cpp\n#include <string>\n\
  #include <iostream>\nusing namespace std ;\n```\n\n![image](img/4r.jpg)添加一个包含最终返回语句的\
  \ main 函数\n\n```cpp\nint main()\n{\n// Program code goes here.\nreturn 0 ;\n}\n\
  ```\n\n![image](img/5r.jpg)在 main 函数块的开始，声明并初始化一个字符串变量，然后追加另一个字符串\n\n```cpp\nstring\
  \ longerline = “They carried a net ” ;\nlongerline += “and their hearts were set”\
  \ ;\n```\n\n![image](img/6r.jpg)现在，添加语句使用宏输出文本\n\n```cpp\nLINEOUT(In a bowl to sea\
  \ went wise men three) ;\nLINEOUT(On a brilliant night in June) ;\nGLUEOUT( longer,\
  \ line ) ;\nLINEOUT(On fishing up the moon.) ;\n```\n\n![image](img/7r.jpg)保存文件，然后编译程序，保存临时文件并运行程序\n\
  \n```bash\nc++ strung.cpp -save-temps -o strung.exe\n```\n\n![image](img/pg165_1.jpg)\n\
  \n![image](img/8r.jpg)用纯文本编辑器（如记事本）打开临时 `.ii` 文件，可以看到字符串值和变量名已在输出语句中替换\n\n![image](img/pg165_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n注意第二个语句包含多个空格，这些将被字符串化运算符移除\n\n![image](img/forget.jpg)\n\
  \n合并运算符被称为“标记粘贴”（token-pasting）运算符，因为它将两个“标记”粘贴在一起。\n\n### 调试断言 (Debugging assertions)\n\
  \n有时使用预处理器指令来辅助程序代码调试是有帮助的——通过定义一个 `ASSERT` 宏函数来对布尔值评估指定的条件。\n\n![image](img/pg166_1.jpg)\n\
  \n要评估的条件将作为 `ASSERT` 函数的参数从调用者传递。该函数随后可以根据评估结果执行适当的语句。通过在每行末尾添加反斜杠 `\\`，可以在宏函数定义中包含多个语句，允许定义延续到下一行。\n\
  \n可以在程序代码中添加许多调用 `ASSERT` 函数的语句，以在程序运行期间监控条件。例如，检查变量值变化的情况。\n\n![image](img/forget.jpg)\n\
  \n在调试时，可以使用 C 风格的 `/* */` 注释运算符注释代码部分。\n\n有用的是，`ASSERT` 函数可以通过 `DEBUG` 宏控制。这允许通过简单更改\
  \ `DEBUG` 控制宏的值来轻松开启或关闭调试：\n\n![image](img/1r.jpg)通过定义一个值为 1 的 DEBUG 宏来启动新程序——以控制\
  \ `ASSERT` 函数\n\n```cpp\n#define DEBUG 1\n```\n\n![image](img/commonr.jpg)\n\nassert.cpp\n\
  \n![image](img/2r.jpg)接下来，添加一个宏 `if-elif` 语句块，根据控制值定义 `ASSERT` 函数\n\n```cpp\n#if(\
  \ DEBUG == 1 )\n// Definition for “on” goes here.\n#elif( DEBUG == 0 )\n// Definition\
  \ for “off” goes here.\n#endif\n```\n\n![image](img/3r.jpg)在 `ASSERT` 函数语句块的顶部部分插入当调试控制设置为“开启”时的定义——用于从预定义的宏输出失败细节\n\
  \n| `#define ASSERT( expr )` | `\\` |\n| :--- | :--- |\n| `cout << #expr << “ ...”\
  \ << num ;` | `\\` |\n| `if ( expr != true )` | `\\` |\n| `{` | `\\` |\n| `cout\
  \ << “ Fails in file: ” << __FILE__ ;` | `\\` |\n| `cout << “ at line: ” << __LINE__\
  \ << endl ;` | `\\` |\n| `}` | `\\` |\n| `else cout << “ Succeeds” << endl ;` |\
  \ |\n\n![image](img/snake.jpg)\n\n不要在定义的最后一行放置反斜杠续行符，并记得使用 `#` 字符串化运算符将表达式作为字符串输出。\n\
  \n![image](img/4r.jpg)在 `ASSERT` 函数语句块的底部，插入当调试控制设置为“关闭”时的定义——仅输出当前的变量值\n\n```cpp\n\
  #define ASSERT( result ) \\\ncout << “Number is “ << num << endl ;\n```\n\n![image](img/5r.jpg)在宏定义之后，指定要包含的库类以及要使用的命名空间缀\n\
  \n```cpp\n#include <iostream>\nusing namespace std ;\n```\n\n![image](img/6r.jpg)添加一个包含最终返回语句的\
  \ main 函数\n\n```cpp\nint main()\n{\n// Program code goes here.\nreturn 0 ;\n}\n\
  ```\n\n![image](img/7r.jpg)在 main 函数块的开始，声明并初始化一个整数变量，然后调用宏 `ASSERT` 函数检查其递增后的值\n\
  \n| `int num = 9 ;` | `ASSERT( num < 10 ) ;` |\n| :--- | :--- |\n| `num++ ;` | |\n\
  \n![image](img/8r.jpg)保存、编译并运行程序以查看输出\n\n![image](img/pg167_1.jpg)\n\n```cpp\n#define\
  \ DEBUG 0\n```\n\n![image](img/pg167_2.jpg)\n\n![image](img/forget.jpg)预定义宏以双下划线开头并以双下划线结尾\n\
  \n![image](img/hot.jpg)此外，可以使用 `__DATE__` 和 `__TIME__` 预定义宏输出当前日期和时间\n\n### 总结 (Summary)\n\
  \n![image](img/pg42_1)\n\n- C++ 编译器的 `-save-temps` 选项保存编译过程中产生的临时文件。\n- 编译首先将程序代码和包含的库代码写入单个\
  \ .ii 文件，然后将其转换为汇编语言 .s 文件。\n- 汇编语言 .s 文件被翻译为机器码 .o 对象文件，用于创建可执行程序。\n- `#define`\
  \ 指令定义一个宏名称和预处理器应替换该名称的值。\n- 预处理器可以使用 `#ifdef`, `#ifndef` 和 `#endif` 进行条件测试，并可以使用\
  \ `#undef` 删除定义。\n- 每个头文件都应使用包含保护符防止类的重复定义，宏名称是文件名的大写版本，并将点替换为下划线。\n- `#define`\
  \ 指令还可定义一个宏函数，该函数会在程序代码中被宏名称替换。\n- 内联函数通常比宏函数更好，因为与宏函数不同，它们会进行类型检查。\n- 预处理器 `#`\
  \ 字符串化运算符将作为宏参数传递的字符转换为字符串值。\n- 两个标记可以通过预处理器 `##` 合并运算符合并成一个标记。\n- `ASSERT` 宏函数对于调试代码非常有用，并且可以通过\
  \ `DEBUG` 宏控制以轻松开启或关闭调试。\n\n\n\n\n\nWindows 10 引入了**通用 Windows Platform** (UWP)，它允许您创建一个单一的**通用\
  \ Windows 应用** (UWA)，该应用可以在任何现代基于 Windows 的设备上运行。UWA 的界面布局使用**可扩展应用程序标记语言** (XAML)\
  \ 来指定组件。为了为 UWP 开发应用，您应该运行 Windows 10 或 Windows 11，并且您的 Visual Studio IDE 必须包含**通用\
  \ Windows 应用开发工具**：\n\n![image](img/1g.jpg)进入 Windows 应用程序菜单并启动 `Visual Studio Installer`\n\
