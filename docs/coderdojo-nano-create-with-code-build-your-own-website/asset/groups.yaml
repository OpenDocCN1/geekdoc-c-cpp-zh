    # ## the nanonauts


    +   [Home](#) | [About Us](#) | [Our Songs](#) | [See Us play](#) | [Playing a
    Concert](#)


    # ## Meet the Nanonauts


    We are the Nanonauts. Our names are Holly, Davey, Derek, and Sam.


    ![](img/52e45ce976f775dd17fd84d91912f770_86_1.png)


    # ### Daniel – Singer extraordinaire


    ![](img/52e45ce976f775dd17fd84d91912f770_86_2.png)


    Daniel is the Nanonauts'' singer. He likes to sing all the time – not just when
    he''s playing with The Nanonauts! His mom and dad say he learned to sing before
    he learned to talk. Daniel also plays clarinet and is learning the alto saxophone.


    # ### Sam – One-man rhythm section


    ![](img/52e45ce976f775dd17fd84d91912f770_86_3.png)


    Sam had music in his blood from the day he was born. Both his mom and dad play
    instruments and got him his first drum kit when he was only two years old, which
    led to trouble with the neighbors. On some songs he plays the bass guitar and
    on some songs the drums.


    # ### Holly – If it''s got strings, she''ll play it


    # ## Nano Noodling – Buy Our New CD!


    **Great! If you''re learning to play!** Are you just beginning to play musical
    instruments? Then why not order this great CD of the Nanonauts'' favorite songs?
    As well as helping you learn some great songs, the CD comes with lots of information
    about each song, including which instrument you should play.


    # ### Track List


    +   - Nuclear Mystery

    +   - Eight or ...

    +   - The Long and Winding Code

    +   - 2000 Dancing

    +   - Empty Elements

    +   - ...


    # ### How to Buy


    On sale at our online store and selected music shops.


    # ## Our Next Concert


    # ### Sunday, June 12, Theatre


    The Nanonauts will be appearing live in concert. Come and see us play our latest
    songs and favorites. Tickets are available now.'
