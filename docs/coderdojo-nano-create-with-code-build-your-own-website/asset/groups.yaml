    # # <ABOUT US>  EDITING YOUR FIRST WEB PAGE


    So, let''s get going! This is the code for a simple web page:


    +   1. Type this code into a simple **plain-text editor** such as Notepad (Windows),
    GEdit (Ubuntu), or in a **code editor** such as Brackets, Notepad++, or Atom.
    If you''re not sure how to do this, go to scholastic.com/coder-dojo/texteditors


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>About Us</title>

    </head>

    <body>

    <h1>About Us</h1>

    <p>We are the Nanonauts.</p>

    <p>Our names are Holly, Dervla, Daniel, and Sam.</p>

    </body>

    </html>

    ```

    ```


    ![](img/52e45ce976f775dd17fd84d91912f770_7_0.png)


    # ## NINJA TIP


    Don''t try to edit your pages in a word processor such as Microsoft Word or LibreOffice.


    # ## NINJA TIP


    **about-us.html** is the file name of the web page. The **.html** at the end is
    called the **file extension**. This tells the various programs of your computer
    that **about-us.html** is a web page.


    Sometimes file extensions get hidden in Windows so that you only see **about-us**
    rather than **about-us.html**. This can be confusing, so make sure that they are
    visible. If you''re not sure how to do this, go to scholastic.com/coder-dojo/filenames


    +   2. Next, make a folder on your computer called **nanonauts** and save the
    code as a file called **about-us.html**.


    ![](img/52e45ce976f775dd17fd84d91912f770_7_1.png)'
  - '[PAGE 8]


    **3.** The code tells a **web browser**, such as Chrome or Firefox, what is in
    the web page. This type of code is known as **HTML**, which stands for Hypertext
    Markup Language.


    Let''s open the file in our web browser. This time, instead of looking at the
    code, you''ll see the web page as it is meant to be seen! You can usually do this
    just by clicking or double-clicking the file. If you''re having trouble, go to
    scholastic.com/coder-dojo/openfiles


    ![](img/52e45ce976f775dd17fd84d91912f770_8_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_8_1.png)


    # CHANGE IT!


    **4.** Now you have the same file open in your web browser and the code editor.
    Arrange the windows so that you can see the code editor and the web browser at
    the same time.


    Change the text in the code editor so that it shows the names of you and your
    friends. Change the name of the band if you like as well. So instead of saying
    “Our names are Holly, Deryla, Daniel, and Sam,” it might say “Our names are Anna,
    Ali, Zeke, and Zoe.” To change the text, click in the code editor and type in
    the new text. Don''t change the **tags** — the things between the **angle brackets**
    such as **<h1>** and **<p>** — just change the text between them.


    # NINJA TIP


    ![](img/52e45ce976f775dd17fd84d91912f770_8_2.png)


    When you''re developing a web site, you''ll need to open the web pages in two
    different applications:


    +   - a plain-text editor or a code editor to write the code for the page

    +   - a web browser to see the results


    This can be a little confusing at first, but you''ll soon get used to it!


    ![](img/52e45ce976f775dd17fd84d91912f770_8_3.png)'
