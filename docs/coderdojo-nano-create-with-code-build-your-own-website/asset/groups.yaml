    \n## 关于 CoderDojo\n\n这本书讲的是编程。也许这是你迈向成为真正优秀程序员的第一步。而且，如果你对编程感兴趣，你可能听说过 CoderDojo。\n\
    \nCoderDojo 是一个面向年轻人的编程俱乐部，让你和其他程序员一起玩、学习新东西，并 generally 在计算机上玩得开心。它免费，而且你可以和朋友们一起工作。你可能去过\
    \ CoderDojo，已经尝试过编程，但想继续练习。或者你附近可能没有 Dojo，而这是你第一次尝试编程。无论哪种情况，这本书都适合你！\n\n以下是如何获得你自己的官方迷你\
    \ Dojo，称为 Dojo Nano。\n\nDojo Nano 的组成要素：\n\n- 一个或多个朋友\n- 一台电脑\n- 这本书\n\n![](img/52e45ce976f775dd17fd84d91912f770_4_0.png)\n\
    \n### 什么是 Dojo Nano？\n\n在你的 Dojo Nano 里会发生什么？基本上，任何你认为在编程方面很酷的事情都可以。在本书中，我们将认识\
    \ Nanonauts，他们建立了自己的 Dojo Nano，并将在那里学习为他们的乐队制作一个网站。他们将 HTML、CSS 和 JavaScript 结合起来制作网站，你也可以学习这些技能来制作自己的网站！\n\
    \n### 创意 + 朋友 + 代码 = DOJO NANO\n\n作为开始，在本书的帮助下，你将制作你的 Dojo Nano 网站，然后也许再为你的朋友们做几个网站。这很简单，很有趣，这本书会带你上路！你可以跟着\
    \ scholastic.com/coder-dojo 一起搭建网站，并在 coderdojo.com 了解更多关于 CoderDojo 的信息。\n\n\
    ## 认识 NANONAUTS\n\nHolly、Dervla、Daniel 和 Sam 在一个叫 Nanonauts 的乐队里。Holly 弹吉他，Dervla\
    \ 弹钢琴，Daniel 唱歌，Sam 打鼓。他们已经开始举办不少音乐会，并觉得如果能建一个网站向世界介绍他们的音乐，那就太好了。\n\n![](img/52e45ce976f775dd17fd84d91912f770_5_0.png)\n\
    \nNanonauts 一开始讨论这件事，就有了许多关于网站的想法：\n\n- 我们可以告诉大家我们下一场音乐会的时间\n- 我们可以宣传我们的 CD 和\
    \ T 恤\n- 我们可以链接到我们的 YouTube 视频\n- 我们可以提供购买乐器以及保养乐器的建议\n- 我们可以提供练习时又不把邻居逼疯的建议\n\
    \n——他们最终把这些想法变成了这张站点地图。\n\n![](img/52e45ce976f775dd17fd84d91912f770_5_1.png)\n\
    \n在本书中，我们将开始搭建 Nanonauts 在他们的站点地图中勾勒出的网站。如果你愿意，可以跟着示例搭建一个关于 Nanonauts 的网站。但如果你有自己的乐队，或者想让页面完全关于其他东西，那也没问题！尽管深入代码，不要害怕尝试。如果一开始有些东西不工作，不要气馁。仔细看看你的代码，看看能不能找出哪里不工作。程序员把这叫做“调试”。\n\
    \n继续读下去，了解如何把 Nanonauts 的站点地图变成真正的网站！\n\n![](img/52e45ce976f775dd17fd84d91912f770_6_0.png)\n\
    \n## 接下来要做的事\n\n- 为什么不为你想要制作的网站勾勒一张自己的站点地图呢？如果你不想做关于乐队的网站，这里有一些想法：\n  - 关于你的宠物的网站\n\
    \  - 关于你最喜欢的游戏的网站\n  - 关于你的学校朋友的网站\n  - 关于你的爱好的网站\n  - 关于你所在城镇可做的事情的网站\n\n###\
    \ 忍者小贴士\n\n你在本书中制作的所有网页都在网上。你可以跟着 Nanonauts 一起搭建他们的网站，并复制代码以节省时间。更多信息请访问 scholastic.com/coder-dojo/examples\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_6_1.png)\n\n## 关于我们：编辑你的第一个网页\n\n那么，我们开始吧！这是一个简单网页的代码：\n\
    \n- **1.** 将这段代码输入一个简单的**纯文本编辑器**，例如 Notepad（Windows）、GEdit（Ubuntu），或者输入**代码编辑器**，例如\
    \ Brackets、Notepad++ 或 Atom。如果你不确定怎么做，请访问 scholastic.com/coder-dojo/texteditors\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>About Us</title>\n</head>\n\
    <body>\n<h1>About Us</h1>\n<p>We are the Nanonauts.</p>\n<p>Our names are Holly,\
    \ Dervla, Daniel, and Sam.</p>\n</body>\n</html>\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_7_0.png)\n\
    \n### 忍者小贴士\n\n不要尝试在 Microsoft Word 或 LibreOffice 之类的文字处理软件中编辑你的页面。\n\n### 忍者小贴士\n\
    \n**about-us.html** 是网页的文件名。末尾的 **.html** 称为**文件扩展名**。这会告诉计算机上的各种程序，**about-us.html**\
    \ 是一个网页。\n\n有时文件扩展名在 Windows 中会被隐藏，这样你只会看到 **about-us**，而不是 **about-us.html**。这可能会让人困惑，所以请确保它们可见。如果你不确定怎么做，请访问\
    \ scholastic.com/coder-dojo/filenames\n\n- **2.** 接下来，在你的计算机上创建一个名为 **nanonauts**\
    \ 的文件夹，并将代码保存为名为 **about-us.html** 的文件。\n\n![](img/52e45ce976f775dd17fd84d91912f770_7_1.png)\n\
    \n- **3.** 代码会告诉**网页浏览器**（例如 Chrome 或 Firefox）网页中有什么内容。这类代码称为 **HTML**，它代表超文本标记语言。\n\
    \n让我们在网页浏览器中打开这个文件。这一次，你不是看代码，而是会看到网页本应呈现的样子！通常，你只需单击或双击该文件即可。如果你遇到问题，请访问 scholastic.com/coder-dojo/openfiles\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_8_0.png)\n\n![](img/52e45ce976f775dd17fd84d91912f770_8_1.png)\n\
    \n### 修改它！\n\n- **4.** 现在你在网页浏览器和代码编辑器中打开了同一个文件。调整窗口位置，以便同时看到代码编辑器和网页浏览器。\n\n\
    修改代码编辑器中的文本，使其显示你和朋友们的名字。如果你愿意，也可以修改乐队名称。因此，不要写“Our names are Holly, Dervla, Daniel,\
    \ and Sam”，而可以写“Our names are Anna, Ali, Zeke, and Zoe”。要修改文本，请点击代码编辑器并输入新文本。不要修改**标签**——即**尖括号**之间的内容，例如\
    \ **<h1>** 和 **<p>**——只修改它们之间的文本。\n\n### 忍者小贴士\n\n![](img/52e45ce976f775dd17fd84d91912f770_8_2.png)\n\
    \n在开发网站时，你需要用两个不同的应用程序打开网页：\n\n- 一个纯文本编辑器或代码编辑器，用来编写页面代码\n- 一个网页浏览器，用来查看结果\n\n\
    一开始这可能会有点让人困惑，但你很快就会习惯的！\n\n![](img/52e45ce976f775dd17fd84d91912f770_8_3.png)\n\
    \n"
