  - '[PAGE 47]


    # <EMBEDDING A MAP>


    If you can embed a YouTube video you can also embed a Google Map. The way you
    do it is very similar. The Nahanouts’ next concert is at the bandstand in Seafront
    Park at their hometown of Bray, Ireland. Let’s see how they add a map to a page
    showing the location of Seafront Park.


    ![](img/52e45ce976f775dd17fd84d91912f770_47_0.png)


    # 1. PINPOINT THE LOCATION


    In the address box on Google Maps, enter the address for Seafront Park.


    ![](img/52e45ce976f775dd17fd84d91912f770_47_1.png)


    Google Maps will mark the location with a red “pin” on the map.


    ![](img/52e45ce976f775dd17fd84d91912f770_47_2.png)


    # 2. GET THE EMBED CODE


    Click the Share button. A dialog box pops up – choose the Embed Map option.


    The Embed Map option now allows you to drag and resize the map until you have
    just the view you want.


    When you are happy you have the right view, select the code from the Embed bar
    and then copy it to the computer’s memory (remember the copy shortcuts – Ctrl-C
    for Windows and Linux systems or ⌘-C for Macs).


    ![](img/52e45ce976f775dd17fd84d91912f770_47_3.png)'
  - '[PAGE 48]


    # 3. PASTE THE EMBED CODE INTO THE WEB PAGE


    The Nanonauts add the map to the See Us Play page. Here is the code for the main
    part of their page.

    The embedded code for the map is pasted after the details of the concert.


    ```

    <h1>See Us Play!</h1>

    <h2>Our Next Concert</h2>

    <p>It''s at the bandstand, Bray Seafront Park on Saturday, June 18 at 4:00 pm</p>

    <p>Admission is <strong>free!</strong></p>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2389.768415129388!2d-6.1004805846458385!3d53.2046939306309!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m1!1s0x4867a860beaa21b5%3A0x6c1f5ae..."
    width="600" height="450" frameborder="0" style="border:0" allowfullscreen></iframe>

    ```


    The Google Map will now appear embedded in the web page.


    ![](img/52e45ce976f775dd17fd84d91912f770_48_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_48_1.png)'
  - '[PAGE 49]


    # # <ADDING A TABLE>


    The See Us Play page only shows information about the next Nonaunauts concert.
    But they have quite a few concerts coming up and it would be good if there was
    a list of these concerts. The list could show:


    +   - the date of the concert

    +   - where the concert is taking place

    +   - what time the Nonaunauts are playing

    +   - how much it will cost to get in


    A good way to do this would be to show the information in a table. Something like
    this:


    # ## UPCOMING CONCERTS


    | Date | Place | Time | Price |

    |---|---|---|---|

    | Sunday, June 12 | Greystones Theatre | 7:30 pm | $5.00 |

    | Wednesday, June 15 | Presentation College, Bray | 8:00 pm | Free! |

    | Saturday, July 10 | Bray Bandstand | 11:00 am | Free! |

    | Sunday, July 11 | Bray Bandstand | 2:00 pm | Free! |

    | Sunday, August 28 | Greystones Theatre | 7:30 pm | $5.00 |


    # ## THE TABLE IN HTML


    To understand how to add the table to the See Us Play web page we need to understand
    what the different parts of the table are called. This is shown in the diagram
    below:


    | table row → | table header | table header | table header | table header |

    |---|---|---|---|---|

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |


    ![](img/52e45ce976f775dd17fd84d91912f770_49_0.png)'
  - '[PAGE 50]


    From this we can see that, in HTML, the recipe for a table is:


    +   1. Add one or more table row elements.

    +   2. Fill each row with table header or table data elements.


    The HTML elements are named as shown to the right.


    table row — `tr`

    table header — `th`

    table data — `td`


    If we use the element names, our diagram looks like this:


    | th | th | th | th |

    |---|---|---|---|

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |


    From this we can see what the actual HTML markup should look like if the table
    was empty:


    ```

    <h2>Upcoming Concerts</h2>

    <table>

    <tr>

    <th></th><th></th><th></th><th></th>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    </table>

    ```


    > We call this the **table skeleton** because this just the bones of the table.
    We haven''t added the actual content yet.


    ![](img/52e45ce976f775dd17fd84d91912f770_50_0.png)


    # NINJA TIP


    ![](img/52e45ce976f775dd17fd84d91912f770_50_1.png)


    If you''re creating a table, it''s best to begin by working out how many rows
    and columns your table will have and then creating the skeleton, otherwise tables
    can get pretty confusing. Make sure when you create the skeleton that all the
    opening and closing tags are in the correct place. Notice how there are four `th`
    elements in the first row and then four `td` elements in the following rows. These
    tags are surrounded by `tr` opening and closing tags.'
