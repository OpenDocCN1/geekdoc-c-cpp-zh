    \ href=\"css/my-first-stylesheet.css\"/>\n</head>\n<body>\n<nav>\n<ul>\n<li><a\
    \ href=\"index.html\">Home</a></li>\n<li><a href=\"about-us.html\">About Us</a></li>\n\
    <li><a href=\"our-songs.html\">Our Songs</a></li>\n<li><a href=\"see-us-play.html\"\
    >See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\">Playing a Concert</a></li>\n\
    </ul>\n</nav>\n<h1>Playing a Concert</h1>\n```\n\n- **4.** Save the file and then\
    \ open it in your browser. You can see that the links appear above the **h1**\
    \ element. They look a little strange, however, it would be better if they ran\
    \ across the top in a row like the top menu bar you see on most websites.\n\n\
    ## THINGS TO DO NEXT\n\nFirst of all, try to change two things.\n\n- Add a link\
    \ to the home page above the About Us link.\n- Then copy the full set of links\
    \ to all the other pages (except the home page because it already has them).\n\
    \nPut the links in the same place before the **h1** element. So all your pages\
    \ should have a set of links to the other pages above the **h1** heading.\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_33_0.png)\n\n## ‹ADDING A MENU›\n\nHaving\
    \ a list of links at the top of the page looks a little weird. But most sites\
    \ would arrange these links in a menu bar—which would look something like this.\n\
    \n- [Home] | [About Us] | [Our Songs] | [See Us Play] | [Playing a Concert]\n\n\
    But guess what? Just by using CSS we can turn the list of links into a menu. There's\
    \ no need to change the HTML code at all. We'll do it by adding the following\
    \ code to the stylesheet.\n\n![](img/52e45ce976f775dd17fd84d91912f770_34_0.png)\n\
    \nThis turns the links from a list into a menu bar:\n\n```css\nnav ul {\n  list-style-type:\
    \ none;\n  background-color: #B577B5;\n  border: 4px solid #111111;\n  border-radius:\
    \ 10px;\n  font-family: sans-serif;\n  font-weight: bold;\n  padding: 16px;\n\
    }\nnav ul li {\n  display: inline;\n  border-right: 2px solid #111111;\n  padding-right:\
    \ 8px;\n  padding-left: 8px;\n}\nnav ul li:last-child {\n  border-right: none;\n\
    }\nnav ul li a {\n  text-decoration: none;\n  color: #111111;\n}\n```\n\n- [Home]\n\
    - [About Us]\n- [Our Songs]\n- [See Us Play]\n- [Playing a Concert]\n\n- [Home]\
    \ | [About Us] | [Our Songs] | [See Us Play] | [Playing a Concert]\n\n### MORE\
    \ COMPLEX RULES!\n\nIn our previous example our rules just had a single element\
    \ name outside the curly brackets. For example, here are three declarations which\
    \ set the color, font family, and font size for a single h1 element.\n\n```css\n\
    h1 {\n  color: #111111;\n  font-family: sans-serif;\n  font-size: 32px;\n}\n```\n\
    \n```css\nnav ul li {\n  display: inline;\n  border-right: 2px solid #111111;\n\
    \  padding-right: 8px;\n}\n```\n\nBut in the menu example the elements outside\
    \ the curly brackets get a little more complicated. Instead of just a single element\
    \ name, we see several element names, separated by spaces. Think of it as an address.\
    \ This example applies to every li that is inside a ul that is inside a nav element.\
    \ So the rules would be applied only to list items that were inside `nav` elements\
    \ – not “ordinary” lists. To see the effect of each declaration, we’ll follow\
    \ the same method described in the tip on page 28, by adding the empty rules and\
    \ then adding in the declarations one at a time. If you add in the declarations\
    \ in the order described below it will help you to understand how the stylesheet\
    \ works.\n\n### 1.\n\n```css\nnav ul {\n  list-style-type: none;\n}\nnav ul li\
    \ {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n\nRemoves the bullet\
    \ points from lists inside `nav` elements. You can change the appearance of the\
    \ bullet point or remove it completely using the `list-style-type` declaration.\n\
    \n- `list-style-type: none;` removes the bullet point\n- `list-style-type: square;`\
    \ changes them to squares.\n\n![](img/52e45ce976f775dd17fd84d91912f770_35_0.png)\n\
    \n### 2.\n\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    }\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n\nChanges\
    \ the background color of the list (the `ul` element) to a darker purple (`#B577B5`\
    \ is the hexadecimal value for this color).\n\n![](img/52e45ce976f775dd17fd84d91912f770_35_1.png)\n\
    \n### 3.\n\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    \  border: 4px solid #111111;\n}\nnav ul li {\n}\nnav ul li:last-child {\n}\n\
    nav ul li a {\n}\n```\n\nAdds a 4-pixel-wide border to the list. The border is\
    \ solid, rather than dotted or dashed, and is a solid black (`#111111` is the\
    \ hexadecimal value for this color). Try changing:\n\n- the pixel width of the\
    \ border\n- the border style from **solid** to **dotted** or **dashed**\n- the\
    \ hexadecimal value to one you choose from an online color picker (see page 31).\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_35_2.png)\n\n### 4.\n\n```css\nnav\
    \ ul {\n  list-style-type: none;\n  background-color: #B577B5;\n  border: 4px\
    \ solid #111111;\n  border-radius: 10px;\n}\nnav ul li {\n}\nnav ul li:last-child\
    \ {\n}\nnav ul li a {\n}\n```\n\nAdds curved corners to the border. Try changing\
    \ the **border-radius** value to see what it does. Try:\n\n- 5px\n- 20px\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_0.png)\n\
    \n### 5.\n\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    \  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n\
    }\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n\nMakes sure\
    \ the font is sans-serif. If you don't specify the **font-family**, it will display\
    \ in the browser's default font. Try changing it to *cursive* or *fantasy* to\
    \ see what they do.\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_1.png)\n\n\
    ### 6.\n\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    \  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n\
    \  font-weight: bold;\n}\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav ul li\
    \ a {\n}\n```\n\nMakes the font heavier and darker looking\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_2.png)\n"
  mdcn: "\n## &lt;用菜单链接页面&gt;\n\n尽管 Nanonauts 网站现在有四个页面，但除非从主页（`index.html`）开始，否则没有简便方法从一个页面转到另一个页面。因此，我们要为我们创建的所有页面添加链接。这样无论我们位于网站中的哪个位置，都能从一个页面转到另一个页面。目前，我们仅有的链接在\
    \ `index.html` 主页上。为此，我们将打开 `index.html` 文件，复制链接的 HTML 代码，然后将其粘贴到其他文件（`about-us.html`、`our-songs.html`\
    \ 等）中。我们还会添加一个返回主页的链接。\n\n### 复制链接\n\n```html\n<body>\n<h1>We are the Nanonauts!</h1>\n\
    <p>This is our website. Click on a link to visit\na page:</p>\n<ul>\n<li><a href=\"\
    about-us.html\">About Us</a></li>\n<li><a href=\"our-songs.html\">Our Songs</a></li>\n\
    <li><a href=\"see-us-play.html\">See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\"\
    >Playing a\nConcert</a></li>\n</ul>\n</body>\n```\n\n- **1.** 在代码编辑器中打开 `index.html`，并选择链接的\
    \ HTML 代码。这段代码会高亮显示。\n  \n  要选择链接的代码：\n  - 在 `ul` 开始标签之前单击。按住鼠标或触摸板按钮，然后向下拖动，并在此过程中高亮文本。\n\
    \  - 到达 `ul` 结束标签时松开按钮。\n  - 选中链接后，检查是否包含了 `ul` 元素的全部开始和结束标签。\n\n### 正确\n\n```html\n\
    <ul>\n<li><a href=\"about-us.html\">About Us</a></li>\n<li><a href=\"our-songs.html\"\
    >Our Songs</a></li>\n<li><a href=\"see-us-play.html\">See Us Play</a></li>\n<li><a\
    \ href=\"playing-a-concert.html\">Playing a Concert</a></li>\n</ul>\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_32_0.png)\n\
    \n### 错误\n\n```html\n<ul>\n<li><a href=\"about-us.html\">About Us</a></li>\n<li><a\
    \ href=\"our-songs.html\">Our Songs</a></li>\n<li><a href=\"see-us-play.html\"\
    >See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\">Playing a\nConcert</a></li>\n\
    </ul>\n```\n\n- **2.** 将链接复制到内存中。你可以使用键盘快捷键来完成此操作——例如 Windows 和 Linux 系统使用 `Ctrl-C`，Mac\
    \ 使用 `⌘-C`。在编辑器中打开你之前创建的某个网页（在下一页的示例中，我们将使用“Playing a Concert”页面）。\n- **3.** 在\
    \ **h1** 开始标签之前单击，然后粘贴链接。还要添加一个指向主页的链接。粘贴链接后，在 **`<ul>`** 开始标签之前添加一个 **`<nav>`**\
    \ 开始标签，并在 **`</ul>`** 结束元素之后添加一个 **`</nav>`** 结束标签。这样就把我们的链接列表放到了一个 **nav**（navigation\
    \ 的缩写）元素内。这清楚地表明这个列表是特殊的——它是菜单链接列表，而不是页面故事中的列表。\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Playing a Concert</title>\n<link type=\"text/css\" rel=\"\
    stylesheet\" href=\"css/my-first-stylesheet.css\"/>\n</head>\n<body>\n<nav>\n\
    <ul>\n<li><a href=\"index.html\">Home</a></li>\n<li><a href=\"about-us.html\"\
    >About Us</a></li>\n<li><a href=\"our-songs.html\">Our Songs</a></li>\n<li><a\
    \ href=\"see-us-play.html\">See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\"\
    >Playing a Concert</a></li>\n</ul>\n</nav>\n<h1>Playing a Concert</h1>\n```\n\n\
    - **4.** 保存文件，然后在浏览器中打开它。你可以看到链接出现在 **h1** 元素上方。它们看起来有点奇怪，不过，如果它们像你在大多数网站上看到的顶部菜单栏那样，在顶部排成一行横跨页面，那就更好了。\n\
    \n## 接下来要做的事\n\n首先，尝试做两处更改。\n\n- 在 About Us 链接上方添加一个指向主页的链接。\n- 然后将完整的链接集合复制到所有其他页面（主页除外，因为它已经有这些链接了）。\n\
    \n将链接放在 **h1** 元素之前的同一位置。因此，你的所有页面都应该在 **h1** 标题上方有一组指向其他页面的链接。\n\n![](img/52e45ce976f775dd17fd84d91912f770_33_0.png)\n\
    \n## ‹添加菜单›\n\n在页面顶部放一个链接列表看起来有点奇怪。但大多数网站会把这些链接排成菜单栏——看起来会像这样。\n\n- [首页] | [关于我们]\
    \ | [我们的歌曲] | [观看我们演出] | [演奏音乐会]\n\n但你猜怎么着？仅使用 CSS 就能把链接列表变成菜单。完全不需要更改 HTML 代码。我们将通过把以下代码添加到样式表中来实现。\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_34_0.png)\n\n这会把链接从列表变成菜单栏：\n\n```css\n\
    nav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n  border: 4px\
    \ solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n  font-weight:\
    \ bold;\n  padding: 16px;\n}\nnav ul li {\n  display: inline;\n  border-right:\
    \ 2px solid #111111;\n  padding-right: 8px;\n  padding-left: 8px;\n}\nnav ul li:last-child\
    \ {\n  border-right: none;\n}\nnav ul li a {\n  text-decoration: none;\n  color:\
    \ #111111;\n}\n```\n\n- [首页]\n- [关于我们]\n- [我们的歌曲]\n- [观看我们演出]\n- [演奏音乐会]\n\n-\
    \ [首页] | [关于我们] | [我们的歌曲] | [观看我们演出] | [演奏音乐会]\n\n### 更复杂的规则！\n\n在我们之前的示例中，规则的花括号外只有一个元素名称。例如，下面有三条声明，它们为一个\
    \ h1 元素设置颜色、字体系列和字体大小。\n\n```css\nh1 {\n  color: #111111;\n  font-family: sans-serif;\n\
    \  font-size: 32px;\n}\n```\n\n```css\nnav ul li {\n  display: inline;\n  border-right:\
    \ 2px solid #111111;\n  padding-right: 8px;\n}\n```\n\n但在菜单示例中，花括号外的元素变得稍微复杂一些。我们看到的不再只是一个元素名称，而是几个用空格分隔的元素名称。可以把它想象成一个地址。这个示例适用于位于\
    \ `nav` 元素内的 `ul` 内的每一个 `li`。因此，这些规则只应用于 `nav` 元素内的列表项——而不是“普通”列表。要查看每条声明的效果，我们将采用第\
    \ 28 页提示中描述的相同方法，先添加空规则，然后一次添加一条声明。如果你按下面描述的顺序添加声明，将有助于你理解样式表的工作原理。\n\n### 1.\n\
    \n```css\nnav ul {\n  list-style-type: none;\n}\nnav ul li {\n}\nnav ul li:last-child\
    \ {\n}\nnav ul li a {\n}\n```\n\n移除 `nav` 元素内列表的项目符号。你可以使用 `list-style-type` 声明更改项目符号的外观，或将其完全移除。\n\
    \n- `list-style-type: none;` 移除项目符号\n- `list-style-type: square;` 将其改为方块。\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_35_0.png)\n\n### 2.\n\n```css\nnav ul\
    \ {\n  list-style-type: none;\n  background-color: #B577B5;\n}\nnav ul li {\n\
    }\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n\n将列表（`ul` 元素）的背景颜色更改为较深的紫色（`#B577B5`\
    \ 是这种颜色的十六进制值）。\n\n![](img/52e45ce976f775dd17fd84d91912f770_35_1.png)\n\n### 3.\n\
    \n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n \
    \ border: 4px solid #111111;\n}\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav\
    \ ul li a {\n}\n```\n\n为列表添加 4 像素宽的边框。边框是实线，而不是点线或虚线，并且是纯黑色（`#111111` 是这种颜色的十六进制值）。试着更改：\n\
    \n- 边框的像素宽度\n- 将边框样式从 **solid** 改为 **dotted** 或 **dashed**\n- 将从在线颜色选择器中选择的十六进制值改为你选择的值（见第\
    \ 31 页）。\n\n![](img/52e45ce976f775dd17fd84d91912f770_35_2.png)\n\n### 4.\n\n```css\n\
    nav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n  border: 4px\
    \ solid #111111;\n  border-radius: 10px;\n}\nnav ul li {\n}\nnav ul li:last-child\
    \ {\n}\nnav ul li a {\n}\n```\n\n为边框添加圆角。试着更改 **border-radius** 的值，看看它会有什么效果。试试：\n\
    \n- 5px\n- 20px\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_0.png)\n\n### 5.\n\
    \n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n \
    \ border: 4px solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n\
    }\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n\n确保字体为 sans-serif。如果你没有指定\
    \ **font-family**，它将使用浏览器的默认字体显示。试着将其改为 *cursive* 或 *fantasy*，看看它们的效果。\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_1.png)\n\
    \n### 6.\n\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    \  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n\
    \  font-weight: bold;\n}\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav ul li\
    \ a {\n}\n```\n\n让字体看起来更粗、更深。\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_2.png)\n\
    \n"
