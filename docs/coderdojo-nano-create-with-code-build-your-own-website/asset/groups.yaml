    # <A GUITAR TUNER FOR THE SITE>


    # EMBEDDING A SCRATCH PROJECT


    After realizing how easy it was to embed videos and maps, Holly wondered if she
    could embed a guitar tuner into the site. But where would she get one from? Then
    she remembered that her sister had been learning to make games at CoderDojo using
    the Scratch programming language. She went to the Scratch site and searched for
    “guitar tuner”. There were loads.


    She found one she liked but couldn''t see any embed option! Fortunately, her sister
    came to the rescue – Holly had to log in to the Scratch site before the Embed
    button appeared in the information bar at the bottom of the game. The guitar tuner
    she liked best had the following embed code:


    ```

    ```html

    <iframe allowtransparency="true"

    width="485" height="402" src="//scratch.mit.edu/projects/

    embed/16403918/?autostart=false"

    frameborder="0" allowfullscreen></iframe>

    ```

    ```


    Note that the tuner will only show up if your web page is online. For more information
    on how you get a page online, see page 90.


    ![](img/52e45ce976f775dd17fd84d91912f770_60_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_60_1.png)


    # WORDS TO REMEMBER


    ![](img/52e45ce976f775dd17fd84d91912f770_60_2.png)


    **iframe** — you may have noticed that both the YouTube video and the Google map
    also use the `iframe` element. An iframe allows you to embed content from another
    site inside your web page. You specify where to find the content by entering a
    URL inside the iframe’s `src` attribute.'
  - "[PAGE 61]\n\n# # &lt;JAVASCRIPT&gt;\n\n![](img/52e45ce976f775dd17fd84d91912f770_61_0.png)\n\
    \nWhen you're developing your website, sooner or later you'll encounter **JavaScript**.\
    \ **JavaScript** is a programming language that lets you add all kinds of special\
    \ effects and features to your pages. Things like games, charts, and animations.\
    \ We don't have enough space in this book to show you all the things that **JavaScript**\
    \ can do, but here is an example to give you an idea of the sort of things you\
    \ can do. We'll use a simple function that swaps one image for another.\n\nThe\
    \ JavaScript behind the image swapper is embedded inside a page. It's called embedded\
    \ because the actual JavaScript is in the body of the page inside the **script**\
    \ element. (You can also put the JavaScript into a separate file if you like.\
    \ See scholastic.com/coder-dojo/javascript for more information about this and\
    \ about JavaScript in general.)\n\n```\n    <!DOCTYPE HTML>\n    <html>\n    <head>\n\
    \    <link type=\"text/css\" rel=\"stylesheet\" href=\"css/full-style.css\"/>\n\
    \    </head>\n    <body>\n    <p>\n    <img id=\"display-image\" onclick=\"swapImage()\"\
    \ src=\"images/01.png\" width=\"180\"\n    height=\"180\"/>\n    </p>\n    <p>Click\
    \ the image to change it!</p>\n    <script>\n    function swapImage() {\n    var\
    \ imageDisplayed = document.getElementById('display-image');\n    if (imageDisplayed.src.match(\"\
    images/01.png\")) {\n    imageDisplayed.src = \"images/02.png\";\n    }\n    else\
    \ {\n    imageDisplayed.src = \"images/01.png\";\n    }\n    }\n    </script>\n\
    \    </body>\n    </html>\n```\n\nIf we look at the code above we can see that\
    \ the **img** element has an attribute named **onclick** with a value of **swapImage()**."
  - "[PAGE 62]\n\n![](img/52e45ce976f775dd17fd84d91912f770_62_0.png)\n\nThe purpose\
    \ of the `onclick` attribute is to contain the name of a function that will be\
    \ called when the image is clicked. Function is the name we give to some code\
    \ that performs a useful task. In this case the `swapImage()` function is contained\
    \ inside the `script` element. The function begins a series of processes that\
    \ happen like this:\n\n+   1. When the image is clicked the `swapImage()` function\
    \ runs.\n\n```\n```html\n<img id=\"display-image\" onclick=\"swapImage()\" src=\"\
    images/01.png\" width=\"180\" height=\"180\">\n```\n```\n\n+   2. This makes the\
    \ image (identified by its `id` of `display-image`) available to the script as\
    \ a variable (`var`) with a name of `imageDisplayed`. (The `id` attribute allows\
    \ you to give a unique identifying name to an element.)\n\n```\n```javascript\n\
    var imageDisplayed = document.getElementById('display-image');\n```\n```\n\n+\
    \   3. If the source (`src`) of the `imageDisplayed` variable is currently set\
    \ to `images/01.png`, then the function changes it to `images/02.png`.\n\n```\n\
    ```javascript\nif (imageDisplayed.src.match(\"images/01.png\")) {\n    imageDisplayed.src\
    \ = \"images/02.png\";\n}\n```\n```\n\n+   4. However, if the source (`src`) of\
    \ the `imageDisplayed` variable is currently set to `images/02.png`, it will change\
    \ it to `images/01.png`.\n\n```\n```javascript\nelse {\n    imageDisplayed.src\
    \ = \"images/01.png\";\n}\n```\n```"
