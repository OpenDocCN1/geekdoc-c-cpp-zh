    \n![](img/52e45ce976f775dd17fd84d91912f770_65_1.png)\n\n### section 元素\n\n`section`\
    \ 元素用于将一篇较大的文章分成较小的区块。每个区块都应该有一个小标题，并构成文章的主要部分。在“Meet the Nanonauts”这篇文章中，每位 Nanonaut\
    \ 的传记都可以放在一个 section 中。你也可以使用 section 元素将 `aside` 元素（见下一页）分成多个 section。\n\n![](img/52e45ce976f775dd17fd84d91912f770_65_2.png)\n\
