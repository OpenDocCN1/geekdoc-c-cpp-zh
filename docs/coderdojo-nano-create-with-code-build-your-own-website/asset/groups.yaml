  - '[PAGE 31]


    # # <MORE ABOUT MEASUREMENTS>


    You may have noticed that we use three different types of measurements in our
    stylesheets: **px**, **em**, and **%**.


    What''s the difference and where do we use them?


    | Measurement | Meaning | Use |

    |---|---|---|

    | **px** | Your screen image is made up of tiny dots called **pixels**. The abbreviation
    for a pixel is **px**. The thinnest line you could see on the screen would be
    1px in width. The smallest shape you could see would be a 1px by 1px dot. | Use
    pixels when you want to give an exact width to something. But only if that width
    should never change, even if the screen gets wider or narrower. For example, the
    width of a border or the amount of padding between the words and the edge of an
    element. |

    | **em** | An **em** is about the width of two letters (we say “about” because
    letters have different widths). We use the em measurement because it is calculated
    in relation to the font size. So if your font size gets bigger, the width allowed
    for 50 em will increase. For this reason an em is called a **relative** measurement.
    | Use ems when you need to set a maximum or minimum line width for a block of
    text. Between 40 and 60 em is about the maximum length a line can get before it
    becomes difficult to follow the words from one line to another. |

    | **%** | When an element has a percentage width, the percentage is measured against
    the width of the element that contains it (remember that elements are nested inside
    each other). So if you set the width of an `img` element that was inside a `p`
    element to 50%, it would be half of the width of the `p` element. Percentage widths
    are indicated by the **%** symbol. | Using percentage measurements is a good choice
    when you are creating the overall layout of the web page. We''ll use percentage
    measurements later in this book when we create more complicated page layouts.
    |


