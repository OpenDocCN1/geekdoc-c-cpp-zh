  - "[PAGE 81]\n\n**8.** Now for the really interesting part. At the moment, all of\
    \ our structural elements are arranged one on top of the other, rather like a\
    \ long ladder of elements. Try resizing your browser window to see what happens.\
    \ Basically, the line length stretches, up to a maximum width of 1024px and then\
    \ after that the right and left margins fill the window. But if we have a decent\
    \ width available we could show the **aside** element to the right of the **article**\
    \ element.\n\nTo do this we need to write a CSS rule that says: “When the screen\
    \ is above a certain width, show the **article** and **aside** elements side by\
    \ side.” We do this using a special type of rule called a **media query**. This\
    \ is our media query:\n\n```\n```css\n@media all and (min-width: 900px)\n{\n```\n\
    \n```\n\nIt begins with a statement that says when the query will be applied.\
    \ **@media all and (min-width: 900px)**. We can break this short example down:\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_81_0.png)\n\n| 规则 | 含义 |\n|---|---|\n\
    | `@media` | This is a media query! |\n| `all` | Applies to both the screen and\
    \ (when printed pages (we could say “print,” if it only applied to printed versions\
    \ of the page, or “screen” to refer to on-screen versions) |\n| `and` | Connects\
    \ the two. |\n| `(min-width: 900px)` | This query will come into effect only when\
    \ the browser window is wider than 900px. |\n\nNotice that these three rules go\
    \ inside the curly brackets of the media query. That's why the last rule has two\
    \ brackets after it.\n\n```\n```css\n@media all and (min-width: 900px) {\n  article\
    \ {\n    float: left;\n    width: 66%;\n  }\n  aside {\n    float: left;\n   \
    \ padding-left: 24px;\n    width: 34%;\n  }\n  footer {\n    clear: both;\n  }\n\
    }\n```\n```\n\nWhat these rules do is use the **float** property to position the\
    \ **article** and the **aside** elements next to one another. By applying floats\
    \ to both elements and then making their combined widths equal to 100% (66% for\
    \ the article and 34% for the aside) we make them appear side by side when the\
    \ window reaches 900 pixels in width. We add some padding to the left of the aside\
    \ so that the borders don't bump up against each other when this happens.\n\n\
    Finally we add a **clear: both** rule to the footer element. This ends the floating\
    \ elements and ensures that the footer appears in its normal position. If you\
    \ don't add this rule, the footer floats to the right of the article – not the\
    \ effect we're looking for!"
