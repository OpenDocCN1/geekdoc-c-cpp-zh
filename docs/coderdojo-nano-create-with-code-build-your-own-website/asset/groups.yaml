    \ Us page and then style the blocks so that the page looks great!\n\n## GETTING\
    \ RESPONSIVE\n\n![](img/52e45ce976f775dd17fd84d91912f770_73_0.png)\n\n**Responsive**\
    \ websites are sites that work on all types of devices – desktop computers, laptops,\
    \ tablets, mobile phones. Responsive websites do this by changing the size and\
    \ position of the elements on a web page to suit the amount of screen that is\
    \ available. The diagram below shows how the Nanonauts' About Us page might change\
    \ its layout depending on the device it is being viewed on.\n\n**MOBILE**\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_73_1.png)\n\n**TABLET**\n\n![](img/52e45ce976f775dd17fd84d91912f770_73_2.png)\n\
    \nFrom these examples we can see that:\n\n- Mobile or tablet displays can simply\
    \ stack the elements, one on top of the other.\n- Desktop machines allow for extra\
    \ width: the **aside** element (containing the ads) can move into a right-hand\
    \ column.\n\n**DESKTOP**\n\n![](img/52e45ce976f775dd17fd84d91912f770_73_3.png)\n\
    \nTo figure out how best to design a page we can use a **mobile-first** approach.\
    \ Mobile-first is a popular way to design website pages: first create a design\
    \ that works well on the smallest mobile device, such as a phone, and then add\
    \ extra features that make use of the extra screen space available on larger devices.\n\
    \nWe're going to use a mobile-first approach to style the About Us page we created\
    \ previously. To show how this works we're going to go through the following steps:\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_73_4.png)\n\n- 1. Add colored backgrounds\
    \ to the structural elements so that we can easily see how they are being affected\
    \ by changes in the CSS.\n- 2. Style the structural elements so that they look\
    \ good and are easy to read on mobile phones and larger devices.\n- 3. Add some\
    \ extra features that will make use of the extra screen space available on larger\
    \ devices.\n\nOur starting point is the following stylesheet. You can type it\
    \ in or you can download it from scholastic.com/coder-dojo/stylesheet. You can\
    \ also download the full code of the About Us page if you don't want to type it\
    \ all in. This stylesheet simply highlights the structural elements by giving\
    \ each a distinctive background color. This will make it easy for us to see the\
    \ effect of applying new CSS rules.\n\n```css\n/* technical stuff - set sizing\
    \ to border-box method */\n\nhtml {\nbox-sizing: border-box;\n}\n\n*, *:before,\
    \ *:after {\nbox-sizing: inherit;\n}\n\n/* style the various structural elements\
    \ */\nhtml {\nbackground-color: White;\n}\n\nbody {\nbackground-color: White;\n\
    }\n\nheader {\nbackground-color: #F45556;\n}\n\nnav {\nbackground-color: #FCAB68;\n\
    }\n\narticle {\nbackground-color: #FFD239;\n}\n\nsection {\nbackground-color:\
    \ #88BB75;\n}\n\naside {\nbackground-color: #1EADDF;\n}\n\nfooter {\nbackground-color:\
    \ #BA99C0;\n}\n```\n\n### NINJA TIP\n\n![](img/52e45ce976f775dd17fd84d91912f770_74_0.png)\n\
    \nUse **comments** in your code to let people know what each element does. (It's\
    \ also handy if you need to remind yourself!)\n\nComments start with `/*` and\
    \ end with `*/` in CSS\n\n![](img/52e45ce976f775dd17fd84d91912f770_74_1.png)\n\
    \nWhen you add this basic stylesheet skeleton you'll see the various structural\
    \ elements highlighted in color (the same colors in the diagram on page 73).\n\
    \nIn the rest of this chapter, we will apply the rules one by one, like before,\
    \ so that you can see the effect of each change. We'll start off with the simple\
    \ stylesheet that displays the elements one on top of the other. We'll finish\
    \ with a stylesheet that changes where the elements are displayed depending on\
    \ the width of your browser window.\n\n![](img/52e45ce976f775dd17fd84d91912f770_75_0.png)\n\
    \nFrom this:\n\n![](img/52e45ce976f775dd17fd84d91912f770_76_0.png)\n\nTo this:\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_76_1.png)\n\n- 1. We begin by setting\
    \ the basic dimensions and appearance of the page's **body** element.\n- 2. We\
    \ restrict the width to **1024px**.\n- 3. We set a minimum width of **256px**.\
    \ If the window gets smaller than this, a horizontal scroll bar will appear at\
    \ the foot of the page.\n- 4. We set the `margin-left` and `margin-right` properties\
    \ to `auto`. This makes our body panel stay in the center of the browser window.\n\
    - 5. We also set the font style and the text color.\n\n![](img/52e45ce976f775dd17fd84d91912f770_76_2.png)\n\
    \n```css\nbody {\n  background-color: white;\n  color: #111111;\n  font-family:\
    \ sans-serif;\n  margin-left: auto;\n  margin-right: auto;\n  max-width: 1024px;\n\
    \  min-width: 256px;\n}\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_76_3.png)\n\
    \n- 2. Next we set sizes for small, medium, and large images. Remember that we\
    \ used the class attribute to distinguish which images should be small, medium,\
    \ and large. For example:\n\n`<img class=\"small\" src=\"images/dervla.png\" alt=\"\
    Dervla\" />`\n\n```css\nimg {\n  height: 200px;\n}\n\nimg.medium {\n  max-width:\
    \ 360px;\n  width: 50%;\n}\n\nimg.large {\n  width: 100%;\n}\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_77_0.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_77_1.png)\n\n3. To make better use\
    \ of the space inside the biography section we can let the small images float\
    \ to the left — so that the text wraps around them.\n\n```css\nimg.small {\n \
    \ float: left;\n  height: 200px;\n}\n```\n\n### NINJA TIP\n\nYou can float images\
    \ to the left or right of text.\n\n![](img/52e45ce976f775dd17fd84d91912f770_77_2.png)\n\
    \n4. Everything is looking a little squashed up against the side of the boxes.\
    \ It would be nice if there were a little spacing around the edges. To achieve\
    \ this we add a margin and some left and right padding to the body and section\
    \ elements, and small images. Add these rules in one line at a time and see the\
    \ effects.\n\n![](img/52e45ce976f775dd17fd84d91912f770_78_0.png)\n\n```css\nimg.small\
    \ {\n  float: left;\n  height: 200px;\n  margin-bottom: 24px;\n  margin-right:\
