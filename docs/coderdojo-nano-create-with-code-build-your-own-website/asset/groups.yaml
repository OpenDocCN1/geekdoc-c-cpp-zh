  - "[PAGE 57]\n\n3. After you've made the changes, refresh the web page in your browser.\
    \ Notice that the changed menu entry is no longer clickable. Adding the **class**\
    \ attribute hasn't done anything on its own. Try refreshing the menu and it'll\
    \ look the same. But adding the **class** attribute allows you to pick out the\
    \ link in the **my-first-stylesheet.css** file and change its color to gray to\
    \ suggest that it's not clickable. Here's how:\n\n```\n/* my-first-stylesheet.css\
    \ */\nnav li a {\n  text-decoration: none;\n}\n\nnav li a {\n  text-decoration:\
    \ none;\n}\nnav li.selected {\n  color: #606060;\n}\n```\n\n4. Refresh and you'll\
    \ see the selected link change to gray. What you've done is added a new rule which\
    \ applies only to **li** elements with a **class** attribute of **selected**.\
    \ Notice the syntax in the CSS file — instead of specifying **li** in the rule,\
    \ you specify **li.selected**.\n\n# NINJA TIP\n\n![](img/52e45ce976f775dd17fd84d91912f770_57_0.png)\n\
    \n> > `nav li.selected` means “li elements with a class of selected inside nav\
    \ elements”\n\n5. Finally, make the links show an underline when you hover over\
    \ them by adding a new rule to the CSS. This rule defines what will happen when\
    \ you hover your cursor over an element.\n\n```\nnav li a:hover {\n  text-decoration:\n\
    \  underline;\n}\n```\n\nThe **:hover** part of the selector is called a **pseudo\
    \ class**. A pseudo class changes the appearance of an element in certain special\
    \ situations. The following pseudo classes are available for styling links:\n\n\
    +   - `unvisited` — Sets how the link should appear before you have visited the\
    \ link destination.\n+   - `visited` — Sets how the link should appear after you\
    \ have visited the link destination.\n+   - `hover` — Sets what should happen\
    \ when you hover the cursor over an element.\n+   - `active` — Sets what should\
    \ happen when you click on the link before releasing the mouse button."
  - "[PAGE 58]\n\nSo a set of rules for link formatting might look like this:\n\n\
    ```\n```css\na:link {\n  color: blue;\n}\na:visited {\n  color: purple;\n}\na:hover\
    \ {\n  text-decoration: underline;\n}\na:active {\n  text-decoration: underline;\n\
    \  background-color: black;\n  color: white;\n}\n```\n```\n\n# # FINISHED!\n\n\
    # ## THINGS TO DO NEXT\n\n+   - Play around with the various options for formatting\
    \ links.\n+   - Make some changes to the rules in the example and see what effect\
    \ it has on your site.\n\n# ## THE CSS BOX MODEL\n\nWhen you're styling the page\
    \ using your stylesheet there's a secret to understanding how CSS works – the\
    \ **CSS box model**. The box model works by imagining that every HTML element\
    \ is inside a box. This box contains three regions:\n\n+   - padding\n+   - border\n\
    +   - margin – spacing between this box and the next box\n\nThis is shown below.\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_58_0.png)\n\n![](img/52e45ce976f775dd17fd84d91912f770_58_1.png)"
  - "[PAGE 59]\n\nUsing the CSS you can change every single part of the box separately.\
    \ For example you can change the appearance of your headings and paragraphs quite\
    \ dramatically simply by adjusting the padding and spacing properties.\n\nAs well\
    \ as changing the size of the various parts of the box, you can also change the\
    \ colors of the different parts of the box. Many of the great visual effects you\
    \ see on a web page are created in this way.\n\n![](img/52e45ce976f775dd17fd84d91912f770_59_0.png)\n\
    \n# MEET THE NANONAUTS!\n\nYou can also change the overall size of the box by\
    \ setting its width or height. Elements that are used to contain individual words\
    \ or short phrases such as **em** or **strong** are called **inline elements**.\
    \ For inline elements, the box fits around the word or phrase. Elements that are\
    \ used to contain whole paragraphs are known as **block elements**. For block\
    \ elements, the box normally stretches across the whole width of the page.\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_59_1.png)\n\nThese **boxes** have been\
    \ drawn around **inline** elements.\n\n+   - This box has been drawn around a\
    \ block element.\n\nThe following tables show you which common elements are normally\
    \ block elements and which are normally inline:\n\nWe say “normally” inline or\
    \ “normally” block because you can change this in the stylesheet if required.\
    \ We did this earlier in step 8 of our menu formatting example (see page 38) when\
    \ we changed the **li** elements inside the menu so that they appeared side by\
    \ side rather than one above the other. We did this by setting the **display**\
    \ property to **inline** like this:\n\n| INLINE | BLOCK |\n|---|---|\n| a | h1\
    \ to h6 |\n| em | p |\n| strong | ul, ol |\n|  | li |\n\n```\nnav li {\n  display:\
    \ inline;\n}\n```"
