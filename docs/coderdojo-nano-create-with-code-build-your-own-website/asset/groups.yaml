    # # <PICTURING THE NANONAUTS>


    # ## ADDING A PHOTO TO THE PAGE


    The About Us page tells everyone about the band. But wouldn''t it be more interesting
    if it showed a photo as well? To show a photo you''ve got to tell the web browser
    where to find it. And to understand where to look, the web browser needs to know
    **1.** the name of the folder in which the photo is stored and **2.** the title
    name of the picture. Let''s say you have a picture called `nanonauts.jpg`.


    You can add the picture to the page by adding the following line of code:


    ```

    ```html

    <p><img src="images/nanonauts.jpg" alt="Picture of the Nanonauts"/></p>

    ```

    ```


    This is how the modified code looks:


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>About Us</title>

    <link type="text/css" rel="stylesheet" href="css/my-first-stylesheet.css"/>

    </head>

    <body>

    <h1>About Us</h1>

    <p><img src="images/nanonauts.jpg" alt="Picture of the Nanonauts"/></p>

    <p>We are the Nanonauts.</p>

    <p>Our names are Holly, Dervla, Daniel, and Sam.</p>

    </body>

    </html>

    ```

    ```


    ![](img/52e45ce976f775dd17fd84d91912f770_12_0.png)


    After saving the page and reloading it in the browser, it looks like this:


    ![](img/52e45ce976f775dd17fd84d91912f770_12_1.png)'
  - '[PAGE 13]


    Let''s take a closer look at the code.


    ```

    ```html

    <p><img src="images/nanonauts.jpg" alt="Picture of the Nanonauts" /></p>

    ```

    ```


    The really important part here is `src="images/nanonauts.jpg"`.


    This tells the web browser to look inside the **images** folder for a file named
    **nanonauts.jpg**. The web browser looks for the **images** folder in the same
    place that the web page is saved. So, if you look at the files in the **nanonauts**
    folder, as well as the **about-us.html** file, you''ll see an **images** folder.
    And, if you open this folder, you''ll see the **nanonauts.jpg** file.


    ![](img/52e45ce976f775dd17fd84d91912f770_13_0.png)


    # NINJA TIP


    If the **nanonauts.jpg** file were missing from the **images** folder, then the
    browser would show a symbol that indicates that. Something like this:


    ![](img/52e45ce976f775dd17fd84d91912f770_13_1.png)


    The `src="images/nanonauts.jpg"` is an **attribute**. Attributes always follow
    the same pattern — an attribute name, followed by an equals sign, followed by
    an attribute value contained within a pair of straight quote marks. Like this:


    | attribute name | equals sign | opening straight quote mark | attribute value
    | closing straight quote mark |

    |---|---|---|---|---|

    | `src` | `=` | `"` | `images/nanonauts.jpg` | `"` |


    The **alt** attribute, in the same way, contains text that appears if the picture
    cannot be shown. This is helpful if the web page is being translated into speech
    for blind people, for example.


    Now that you know how to add a picture, add your own picture into your **about-us.html**
    page. To do this, copy the picture into the **images** folder and then add the
    code that will display your picture. So, if your picture came from a digital camera
    and was called **DSC03730.jpg** you might add the following code:


    ```

    ```html

    <p><img src="images/DSC03730.jpg"

    alt="Holly playing the guitar" /></p>

    ```

    ```


    ![](img/52e45ce976f775dd17fd84d91912f770_13_2.png)'
