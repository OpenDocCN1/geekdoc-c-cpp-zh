    # # ABOUT CODERDOJO


    This book is about coding. Maybe the first steps you''ll take toward becoming
    a seriously good coder. And, if you''re interested in coding, you may have heard
    of CoderDojo.


    CoderDojo is a coding club for young people that lets you hang out with other
    coders, learn new stuff, and generally have fun with computers. It''s free and
    you work with your friends. You may have been to CoderDojo and have already tried
    coding but want to continue practicing. Or you might not have a Dojo near you
    and this is your first crack at coding. In either case, this book is for you!


    Here''s how to get your own official mini-Dojo, called a Dojo Nano.


    Ingredients for a Dojo Nano:


    +   - one or more friends

    +   - a computer

    +   - this book


    ![](img/52e45ce976f775dd17fd84d91912f770_4_0.png)


    # ## WHAT''S A DOJO NANO?


    What happens at your Dojo Nano? Basically, whatever you think is cool coding-wise.
    In this book we''re going to meet the Nanonauts, who have set up their own Dojo
    Nano where they will be learning to make a website for their band. They''re combining
    HTML, CSS, and JavaScript to make their website, and you can learn these skills
    to make your own website as well!


    # ## IDEAS + FRIENDS + CODE = DOJO NANO


    As a start, with the help of this book, you''re going to make your Dojo Nano website,
    and then maybe a couple of sites for your friends. It''s easy, it''s fun, and
    this book will set you on the way! You can follow along with building the site
    at scholastic.com/coder-dojo, and find more about CoderDojo at coderdojo.com'
  - '[PAGE 5]


    # # <INTRODUCING THE NANONAUTS>


    Holly, Dervla, Daniel, and Sam are in a band called the Nanonauts. Holly plays
    guitar, Dervla piano, Daniel sings, and Sam plays drums. They''ve started to play
    quite a few concerts and think it would be great if they could build a website
    to tell the world about their music.


    ![](img/52e45ce976f775dd17fd84d91912f770_5_0.png)


    As soon as the Nanonauts start talking about it they have loads of ideas for their
    site -


    +   - we could tell people when we are playing our next concert

    +   - we could advertise our CD and T-shirt

    +   - we could have links to our YouTube videos

    +   - we could have tips on buying instruments - and taking care of them

    +   - we could have tips on practicing without driving the neighbors crazy


    - which they eventually turn into this site map.


    ![](img/52e45ce976f775dd17fd84d91912f770_5_1.png)'
