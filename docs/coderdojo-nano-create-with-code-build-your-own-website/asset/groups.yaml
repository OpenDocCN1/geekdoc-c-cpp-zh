    ## 嵌套你的元素！


    元素应始终嵌套。这意味着它们总是互相套在一起，就像俄罗斯套娃一样！


    ### “嵌套”是什么意思？


    当我们说一个元素嵌套在另一个元素中时，我们是指它的开始标签和结束标签出现在另一个元素的开始标签和结束标签之间的某个位置。例如，如果我们说一个包含单词“Tip”的
    **strong** 元素“位于”一个 **p** 元素“内部”，我们是指它的开始标签 `<strong>` 和结束标签 `</strong>` 出现在 p
    元素的开始标签 `<p>` 和结束标签 `</p>` 之间的某个位置。


    **正确**


    ```html

    <p><strong>Tip:</strong>

    If you make a mistake

    don''t stop playing!</p>

    ```


    **错误**


    ```html

    <strong>Tip</strong>

    If you make a mistake

    don''t stop playing!</p>

    ```


