    # <LINKING AND EMBEDDING VIDEOS>


    If you were thinking of booking the Nanonauts to play at your party you''d want
    to see them first, right? Well, thanks to video-sharing sites such as YouTube
    and Vimeo, it''s possible to do just that. And because the Nanonauts have already
    shared a few of their performances on YouTube it should just be a matter of linking
    to these videos. So what''s the best way of doing this?


    # LINKING TO YOUTUBE


    One method would be to provide a link to the video on YouTube. So if you clicked
    the link you''d be taken to the YouTube page. To do this:


    +   1. Go to the YouTube page that shows the video.

    +   2. Click the Share icon.

    +   3. Click the Share option.

    +   4. Copy the URL that appears in the Share box.


    ![](img/52e45ce976f775dd17fd84d91912f770_44_0.png)


    https://youtu.be/bTK54gRVryk


    Create a link to the URL like this:


    ```

    ```html

    <a href="https://youtu.be/bTK54gRVryk">Visit the Nanonauts on YouTube!</a>

    ```

    ```


    This is a little boring, though – and it takes you away from the Nanonauts'' site
    and sends you off to YouTube. Wouldn''t it be better to show the videos on a page
    on the site, so that you could play them without having to leave? Luckily there''s
    a really easy way to do this – it''s called embedding a video.


    # EMBEDDING A YOUTUBE VIDEO


    To embed a video, once again go to the YouTube page that shows the video and click
    the Share icon. However, this time:


    +   1. Click the Embed option

    +   2. Copy the code that appears in the Embed box.


    ```

    ```html

    <iframe width="560" height="315" src="https://www.youtube.com/embed/bTK54gRVryk"
    frameborder="0" allowfullscreen></iframe>

    ```

    ```


    +   3. Paste this code into the HTML for the page on which you want the video
    to appear. For example, we could add the video so that it appeared after the list
    of songs on the Our Songs page.


    ![](img/52e45ce976f775dd17fd84d91912f770_44_1.png)'
