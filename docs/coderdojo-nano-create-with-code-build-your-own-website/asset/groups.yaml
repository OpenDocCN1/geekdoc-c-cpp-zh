    \ But the whole point of a web page is that it's ... well ... on the web.\n\n\
    To do this you need to do two things:\n\n- register a **domain name** (such as\
    \ www.nanonauts.com)\n- copy your site to a **web server** linked to the domain\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_89_0.png)\n\nThen, when someone types\
    \ your domain name into a web browser they are sent to the web server. A web server\
    \ is just a computer that has been connected to the Internet and has been set\
    \ up to send web pages to a computing device (phone, tablet, laptop, and so on)\
    \ that requests them.\n\nAlthough setting all this up may sound a little complicated,\
    \ it's actually made pretty easy because you can buy a **hosting package** from\
    \ an Internet service provider (ISP). A hosting package lets you rent some space\
    \ on a web server for a small fee per month. Then, once you've chosen your package,\
    \ all you need to do is pick your domain name and copy across your web pages.\
    \ You do this using an **FTP program**.\n\n### USING AN FTP PROGRAM\n\nAn FTP,\
    \ or “file transfer protocol,” program simply allows you to copy files between\
    \ two computers that are connected to the Internet. If you're copying files from\
    \ your computer to the web server this is called **uploading**. If you're copying\
    \ them from the web server to your computer, often referred to as the **local\
    \ machine**, this is called **downloading**. You're probably already familiar\
    \ with downloading. Well, this is your chance to do some uploading for a change!\
    \ So how do you do it?\n\nOnce you've purchased your hosting package, you'll need\
    \ to download and install an FTP program. A good free program is FileZilla, which\
    \ you can find at https://filezilla-project.org. Next you'll need the **IP address**\
    \ of your web server and a username and password. You normally get this information\
    \ from the Internet service provider when you purchase a hosting package. The\
    \ IP address is a long number divided into four parts by periods—for example,\
    \ **66.175.209.200**—which allows the FTP program to find your web server.\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_89_1.png)\n\n### NINJA TIP\n\n> URLs\
    \ such as www.nanonauts.com are simply more user-friendly versions of IP addresses.\
    \ In fact, a URL simply tells a web browser to get files from a computer with\
    \ a particular IP address.\n\nOnce you have the information you can start your\
    \ FTP program and enter details of the computer you want to connect to. This is\
    \ known as the “host.” In FileZilla you do the following:\n\n- 1. Choose File\
    \ > Site Manager and click the New Site button.\n- 2. In the left-hand window,\
    \ give the site a name such as Nanonauts.\n- 3. Enter the IP address of the server\
    \ in the Host box.\n- 4. If the service provider gave you a port number, you can\
    \ enter this in the Port field. Usually you would leave this empty.\n- 5. Change\
    \ the logon type from Anonymous to Normal.\n- 6. Enter the username and password.\n\
    - 7. Click Connect. After a second or two you should see details of the web server\
    \ appear in the right-hand pane. When you connect to the web server it's important\
    \ that you upload your files to the correct folder. This folder is known as the\
    \ **web root**. The web root folder should always contain your **index.html**\
    \ file and a copy of all the files and folders used to create your site on your\
    \ local machine.\n- 8. In the left-hand pane of FileZilla, copy across all the\
    \ files in your local copy of the website to the web root folder.\n- 9. Select\
    \ all the files and drag them across into the web root folder.\n\n![](img/52e45ce976f775dd17fd84d91912f770_90_0.png)\n\
    \n### NINJA TIP\n\nThe name of the web root folder may vary from one hosting package\
    \ to another. Common names include:\n\n- www\n- wwwroot\n- httpdocs\n- public_html\n\
    - html\n- public\n- web\n\n### YOU'RE DONE!\n\nGo to your web browser and type\
    \ in the web address of your site. If all has gone well you should see your website!\
    \ Congratulations, you now have your own site up and running on the web! Let your\
    \ friends and family know!\n\n![](img/52e45ce976f775dd17fd84d91912f770_90_1.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_90_2.png)\n\n## <CODE REFERENCE>\n\n\
    As we've built our web pages we've been using a number of HTML elements. The table\
    \ below contains a list of these elements. Mix-and-match as you need to build\
    \ your pages!\n\n| Element | Meaning |\n|---|---|\n| `a` | A link. You put the\
    \ page you want to link to in the `href` attribute. |\n| `body` | The part of\
    \ a web page that you can see in the browser. |\n| `em` | Allows you to make important\
    \ words or phrases stand out by appearing in sloping italic text. |\n| `h1` |\
    \ A major heading – usually used for the page’s main title. |\n| `h2` | A secondary\
    \ heading – used to divide up a long page into individual topics. |\n| `h3` |\
    \ A minor heading – used to divide long topics up into smaller chunks. |\n| `head`\
    \ | Contains information that the browser uses when figuring out how the page\
    \ should be displayed. |\n| `html` | All of your web page must be inside a `html`\
    \ element. A page can only have a single `html` element. The `html` element always\
    \ contains a single `head` element followed by a single `body` element. |\n| `iframe`\
    \ | An `iframe` allows you to embed content from another site, such as YouTube\
    \ or Google Maps, inside your web page. You say where to find the content by entering\
    \ a URL inside the iframe's `src` attribute. |\n| `img` | Allows you to display\
    \ an image or picture. It’s a good idea to give your image a `class` attribute\
    \ with a value such as large, medium, or small and then use the CSS to control\
    \ the size of the image. The `src` attribute is used to locate the image. |\n\
    | `li` | An individual item in a list. `li` elements can occur inside `ul` and\
    \ `ol` elements. |\n| `link` | Provides the link to the CSS stylesheet that will\
    \ be used to format the web page. The address of the stylesheet goes in the `href`\
    \ attribute. |\n\n![](img/52e45ce976f775dd17fd84d91912f770_91_0.png)\n"
  mdcn: "\n\n## <字体>\n\n改变页面外观的最佳方法之一是更改字体。字体是文本的一种特定样式。你为页面选择的字体会对页面的外观产生巨大影响。\n\n\
    如果你想选择某种特定字体，那么你需要使用**Web 字体**。Web 字体是一种特殊类型的字体，会随样式表一起下载。使用 Web 字体比使用**sans-serif**或**monospace**这类通用名称能让你拥有更多控制权。\n\
    \n例如，如果你选择 monospace，那么在 Firefox 和 Chrome 中使用的字体会不同。但是，如果你选择 Web 字体，那么它在任何最新浏览器中都应该显示相同。\n\
    \n使用 Web 字体最简单的方法是从 Google Fonts 页面 https://www.google.com/fonts 中选择一种。在这里你会看到一长串可供选择的字体。肯定比无聊的默认字体令人兴奋得多！\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_87_0.png)\n\n### 忍者小贴士\n\n> 你必须联网，Web\
    \ 字体才能正常工作。如果你正在查看网页但没有互联网连接，你就不会看到 Web 字体。\n\n![](img/52e45ce976f775dd17fd84d91912f770_87_1.png)\n\
    \n找到你想要的字体后，点击“Quick Use”图标。\n\n“Quick Use”页面会打开。在第 1 步中，你可以选择不同的样式；在第 2 步中，你可以挑选你需要的字符。此页面会提供将\
    \ Web 字体添加到你的网站所需的信息。\n\n![](img/52e45ce976f775dd17fd84d91912f770_88_0.png)\n\n\
    - 1. 选择你想要的样式：\n  - PT Sans Narrow\n    - Regular\n    - Bold\n\n在此页面上，第 3 步和第\
    \ 4 步都非常重要！在第 3 步中，你会看到三个标签页，分别名为“Standard”“@import”和“Javascript”。点击“@import”标签页。@import\
    \ 标签页上显示的代码就是你需要添加到样式表中的代码。它看起来会像这样：\n\n- Standard · @import · Javascript\n\n\
    3. 将此代码添加到你的网站：\n\n```css\n@import url(http://fonts.googleapis.com/css?family=PT+Sans+Narrow);\n\
    ```\n\n这一行会导入字体，并使其可在样式表中使用。你应该像这样把它添加到样式表的第一行。\n\n在上面的示例中，@import 语句会使名为 PT Sans\
    \ Narrow 的字体可用。但仅此而已——我们实际上还没有在任何地方使用该字体。要做到这一点，我们需要在样式表中的某条规则里使用该字体。这就是第 4 步的用武之地！\n\
    \n第 4 步告诉我们如何在样式表中引用该字体。它给出了一个简单的声明示例，类似下面这样：\n\n```css\nfont-family: \"PT Sans\
    \ Narrow\", sans-serif;\n```\n\n```css\n@import url(http://fonts.googleapis.com/css?family=PT+Sans+Narrow);\n\
    html {\n  /* set sizing to border box method */\n  box-sizing: border-box;\n}\n\
    *, *:before, *:after {\n  box-sizing: inherit;\n}\n/* set maximum and minimum\
    \ widths for the\nbody and center within the viewport */\nbody {\n  font-family:\
    \ sans-serif;\n  margin-left: auto;\n  margin-right: auto;\n  max-width: 1024px;\n\
    \  min-width: 256px;\n  padding-top: 8px;\n```\n\n## <将你的网站发布到网上>\n\n到目前为止，你制作的网站只能在你自己的电脑上看到。但网页的全部意义就在于它……嗯……在网络上。\n\
    \n要做到这一点，你需要做两件事：\n\n- 注册一个**域名**（例如 www.nanonauts.com）\n- 将你的网站复制到与该域名关联的**Web\
    \ 服务器**上\n\n![](img/52e45ce976f775dd17fd84d91912f770_89_0.png)\n\n然后，当有人在 Web\
    \ 浏览器中输入你的域名时，他们就会被发送到 Web 服务器。Web 服务器只是一台已连接到互联网并已设置好向请求网页的计算设备（手机、平板电脑、笔记本电脑等）发送网页的计算机。\n\
    \n尽管设置这一切听起来可能有点复杂，但实际上相当简单，因为你可以从互联网服务提供商（ISP）那里购买**托管套餐**。托管套餐让你以每月少量费用租用 Web\
    \ 服务器上的一些空间。然后，一旦你选好套餐，你所需要做的就是选择域名并复制你的网页。你可以使用 **FTP 程序**来完成这项工作。\n\n### 使用\
    \ FTP 程序\n\nFTP（即“文件传输协议”）程序只是允许你在两台连接到互联网的计算机之间复制文件。如果你将文件从自己的计算机复制到 Web 服务器，这称为**上传**。如果你将它们从\
    \ Web 服务器复制到你的计算机（通常称为**本地机器**），这称为**下载**。你可能已经熟悉下载。那么，这正是你换个方式做些上传工作的机会！那么该怎么做呢？\n\
    \n购买托管套餐后，你需要下载并安装一个 FTP 程序。FileZilla 是一个不错的免费程序，你可以在 https://filezilla-project.org\
    \ 找到它。接下来，你需要 Web 服务器的 **IP 地址**以及用户名和密码。你通常会在购买托管套餐时从互联网服务提供商那里获得这些信息。IP 地址是一个由句点分成四部分的长数字——例如，**66.175.209.200**——它让\
    \ FTP 程序能够找到你的 Web 服务器。\n\n![](img/52e45ce976f775dd17fd84d91912f770_89_1.png)\n\
    \n### 忍者小贴士\n\n> 像 www.nanonauts.com 这样的 URL 只是 IP 地址的更用户友好版本。事实上，URL 只是告诉 Web\
    \ 浏览器从具有特定 IP 地址的计算机获取文件。\n\n获得这些信息后，你就可以启动 FTP 程序，并输入要连接的计算机的详细信息。这台计算机称为“主机”。在\
    \ FileZilla 中，你需要执行以下操作：\n\n- 1. 选择“File”>“Site Manager”，然后单击“New Site”按钮。\n-\
    \ 2. 在左侧窗口中，给该站点起一个名字，例如 Nanonauts。\n- 3. 在“Host”框中输入服务器的 IP 地址。\n- 4. 如果服务提供商给了你端口号，你可以将其输入到“Port”字段中。通常你会让它留空。\n\
    - 5. 将登录类型从“Anonymous”更改为“Normal”。\n- 6. 输入用户名和密码。\n- 7. 单击“Connect”。一两秒后，你应该会看到\
    \ Web 服务器的详细信息出现在右侧窗格中。当你连接到 Web 服务器时，务必将文件上传到正确的文件夹。此文件夹称为 **Web 根目录**。Web 根目录文件夹应始终包含你的\
    \ **index.html** 文件，以及用于在本地机器上创建网站的所有文件和文件夹的副本。\n- 8. 在 FileZilla 的左侧窗格中，将本地网站副本中的所有文件复制到\
    \ Web 根目录文件夹中。\n- 9. 选择所有文件，并将它们拖到 Web 根目录文件夹中。\n\n![](img/52e45ce976f775dd17fd84d91912f770_90_0.png)\n\
    \n### 忍者小贴士\n\nWeb 根目录文件夹的名称可能因托管套餐而异。常见名称包括：\n\n- www\n- wwwroot\n- httpdocs\n\
    - public_html\n- html\n- public\n- web\n\n### 大功告成！\n\n转到你的 Web 浏览器，输入你网站的网址。如果一切顺利，你应该会看到自己的网站！恭喜你，现在你已经在网上拥有并运行自己的网站了！告诉你的朋友和家人吧！\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_90_1.png)\n\n![](img/52e45ce976f775dd17fd84d91912f770_90_2.png)\n\
    \n## <代码参考>\n\n在构建网页的过程中，我们使用了许多 HTML 元素。下表列出了这些元素。你可以根据需要混合搭配来构建页面！\n\n| 元素 |\
    \ 含义 |\n|---|---|\n| `a` | 一个链接。将要链接到的页面放在 `href` 属性中。 |\n| `body` | 网页中可以在浏览器里看到的部分。\
    \ |\n| `em` | 通过以倾斜的斜体文本显示，让重要的单词或短语突出。 |\n| `h1` | 主标题——通常用于页面的主标题。 |\n| `h2`\
    \ | 次级标题——用于将长页面分成各个主题。 |\n| `h3` | 小标题——用于将长主题分成更小的块。 |\n| `head` | 包含浏览器在确定页面应如何显示时使用的信息。\
    \ |\n| `html` | 你的整个网页都必须位于一个 `html` 元素内。一个页面只能有一个 `html` 元素。`html` 元素始终包含一个 `head`\
    \ 元素，后跟一个 `body` 元素。 |\n| `iframe` | `iframe` 允许你在网页中嵌入来自其他网站（如 YouTube 或 Google\
    \ Maps）的内容。你可以通过在 iframe 的 `src` 属性中输入 URL 来指定在何处查找内容。 |\n| `img` | 允许你显示图像或图片。最好为图像添加一个\
    \ `class` 属性，其值例如 large、medium 或 small，然后使用 CSS 控制图像大小。`src` 属性用于定位图像。 |\n| `li`\
    \ | 列表中的单个项目。`li` 元素可以出现在 `ul` 和 `ol` 元素内。 |\n| `link` | 提供指向将用于格式化网页的 CSS 样式表的链接。样式表的地址放在\
    \ `href` 属性中。 |\n\n![](img/52e45ce976f775dd17fd84d91912f770_91_0.png)\n\n"
