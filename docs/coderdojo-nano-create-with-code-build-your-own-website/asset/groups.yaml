    \n```css\nnav li a:hover {\n  text-decoration: underline;\n}\n```\n\n选择器中的 **:hover**\
    \ 部分称为**伪类**。伪类会在某些特殊情况下改变元素的外观。以下伪类可用于设置链接样式：\n\n- `unvisited` — 设置在你访问链接目标之前链接应如何显示。\n\
    - `visited` — 设置在你访问链接目标之后链接应如何显示。\n- `hover` — 设置当光标悬停在元素上时应发生什么。\n- `active`\
    \ — 设置当你在释放鼠标按钮之前点击链接时应发生什么。\n\n因此，一组链接格式规则可能如下所示：\n\n```css\na:link {\n  color:\
    \ blue;\n}\na:visited {\n  color: purple;\n}\na:hover {\n  text-decoration: underline;\n\
    }\na:active {\n  text-decoration: underline;\n  background-color: black;\n  color:\
    \ white;\n}\n```\n\n## 完成！\n\n### 接下来要做的事\n\n- 尝试各种链接格式设置选项。\n- 对示例中的规则做一些更改，看看它对你的网站有什么影响。\n\
    \n## CSS 盒模型\n\n使用样式表为页面设置样式时，理解 CSS 工作原理有一个秘诀——**CSS 盒模型**。盒模型的工作原理是想象每个 HTML\
    \ 元素都位于一个盒子中。这个盒子包含三个区域：\n\n- padding（内边距）\n- border（边框）\n- margin（外边距）——此盒子与下一个盒子之间的间距\n\
    \n如下图所示。\n\n![](img/52e45ce976f775dd17fd84d91912f770_58_0.png)\n\n![](img/52e45ce976f775dd17fd84d91912f770_58_1.png)\n\
    \n使用 CSS，你可以分别更改盒子的每一个部分。例如，只需调整内边距和间距属性，就能大幅改变标题和段落的外观。\n\n除了更改盒子各部分的大小，你还可以更改盒子不同部分的颜色。你在网页上看到的许多出色视觉效果都是通过这种方式创建的。\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_59_0.png)\n\n### 认识 NanoNauts！\n\n\
    你还可以通过设置盒子的宽度或高度来更改其整体大小。用于包含单个单词或短语（例如 **em** 或 **strong**）的元素称为**内联元素**。对于内联元素，盒子会贴合单词或短语。用于包含整个段落的元素称为**块级元素**。对于块级元素，盒子通常会横跨页面的整个宽度。\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_59_1.png)\n\n这些**盒子**是围绕**内联**元素绘制的。\n\
    \n- 这个盒子是围绕一个块级元素绘制的。\n\n下表显示了哪些常见元素通常是块级元素，哪些通常是内联元素：\n\n| 内联 | 块级 |\n|---|---|\n\
    | a | h1 到 h6 |\n| em | p |\n| strong | ul, ol |\n|  | li |\n\n我们说“通常”是内联或“通常”是块级，是因为如有需要，你可以在样式表中更改这一点。我们在前面菜单格式示例的第\
    \ 8 步（见第 38 页）就这样做了：当时我们更改了菜单内的 **li** 元素，使它们并排显示，而不是一个在另一个上方。我们通过将 **display**\
    \ 属性设置为 **inline** 来实现这一点，如下所示：\n\n```css\nnav li {\n  display: inline;\n}\n```\n\
    \n## 为网站添加吉他调音器\n\n### 嵌入 Scratch 项目\n\n在意识到嵌入视频和地图有多么容易之后，Holly 想知道她是否能在网站中嵌入一个吉他调音器。但她从哪里弄到一个呢？然后她想起，她的姐姐一直在\
    \ CoderDojo 使用 Scratch 编程语言学习制作游戏。她去了 Scratch 网站，搜索“guitar tuner”。结果有很多。\n\n她找到了一个喜欢的，但看不到任何嵌入选项！幸运的是，她的姐姐来救场了——Holly\
    \ 必须先登录 Scratch 网站，Embed 按钮才会出现在游戏底部的信息栏中。她最喜欢的吉他调音器有以下嵌入代码：\n\n```html\n<iframe\
    \ allowtransparency=\"true\" width=\"485\" height=\"402\" src=\"//scratch.mit.edu/projects/embed/16403918/?autostart=false\"\
    \ frameborder=\"0\" allowfullscreen></iframe>\n```\n\n请注意，只有你的网页在线时，调音器才会显示出来。有关如何让页面上线的更多信息，请参见第\
    \ 90 页。\n\n![](img/52e45ce976f775dd17fd84d91912f770_60_0.png)\n\n![](img/52e45ce976f775dd17fd84d91912f770_60_1.png)\n\
    \n### 要记住的术语\n\n![](img/52e45ce976f775dd17fd84d91912f770_60_2.png)\n\n**iframe**\
    \ ——你可能已经注意到，YouTube 视频和 Google 地图也都使用了 `iframe` 元素。iframe 允许你将另一个网站的内容嵌入到你的网页中。你可以通过在\
    \ iframe 的 `src` 属性中输入 URL 来指定在哪里找到该内容。\n\n## JAVASCRIPT\n\n![](img/52e45ce976f775dd17fd84d91912f770_61_0.png)\n\
    \n在开发网站时，你迟早会遇到 **JavaScript**。**JavaScript** 是一种编程语言，可让你为页面添加各种特殊效果和功能，比如游戏、图表和动画。本书没有足够的篇幅向你展示\
    \ **JavaScript** 能做的所有事情，但下面这个例子可以让你了解你能做的一些事情。我们将使用一个简单的函数来将一张图片替换为另一张。\n\n图像交换器背后的\
    \ JavaScript 被嵌入在页面中。之所以称为嵌入，是因为实际的 JavaScript 位于页面 body 内的 **script** 元素中。（如果你愿意，也可以将\
    \ JavaScript 放入单独的文件中。有关这一点以及 JavaScript 一般信息的更多内容，请参见 scholastic.com/coder-dojo/javascript。）\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<link type=\"text/css\" rel=\"stylesheet\"\
    \ href=\"css/full-style.css\"/>\n</head>\n<body>\n<p>\n<img id=\"display-image\"\
    \ onclick=\"swapImage()\" src=\"images/01.png\" width=\"180\" height=\"180\"/>\n\
    </p>\n<p>Click the image to change it!</p>\n<script>\nfunction swapImage() {\n\
    \  var imageDisplayed = document.getElementById('display-image');\n  if (imageDisplayed.src.match(\"\
    images/01.png\")) {\n    imageDisplayed.src = \"images/02.png\";\n  }\n  else\
    \ {\n    imageDisplayed.src = \"images/01.png\";\n  }\n}\n</script>\n</body>\n\
    </html>\n```\n\n如果我们查看上面的代码，可以看到 **img** 元素有一个名为 **onclick** 的属性，其值为 **swapImage()**。\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_62_0.png)\n\n`onclick` 属性的用途是包含一个函数的名称，当图像被点击时将调用该函数。函数是我们给执行有用任务的某些代码起的名称。在本例中，`swapImage()`\
    \ 函数包含在 `script` 元素内。该函数会启动一系列按如下方式发生的过程：\n\n- 1. 当图像被点击时，`swapImage()` 函数会运行。\n\
    \n```html\n<img id=\"display-image\" onclick=\"swapImage()\" src=\"images/01.png\"\
    \ width=\"180\" height=\"180\">\n```\n\n- 2. 这使图像（通过其 `id` 为 `display-image` 来标识）作为名为\
    \ `imageDisplayed` 的变量（`var`）可供脚本使用。（`id` 属性允许你为元素指定唯一的标识名称。）\n\n```javascript\n\
    var imageDisplayed = document.getElementById('display-image');\n```\n\n- 3. 如果\
    \ `imageDisplayed` 变量的源（`src`）当前设置为 `images/01.png`，那么函数会将其更改为 `images/02.png`。\n\
    \n```javascript\nif (imageDisplayed.src.match(\"images/01.png\")) {\n  imageDisplayed.src\
    \ = \"images/02.png\";\n}\n```\n\n- 4. 但是，如果 `imageDisplayed` 变量的源（`src`）当前设置为\
    \ `images/02.png`，则会将其更改为 `images/01.png`。\n\n```javascript\nelse {\n  imageDisplayed.src\
    \ = \"images/01.png\";\n}\n```\n\n"
