    # ONLINE SAFETY FOR YOUNGER READERS


    Spending time online is great fun!

    Here are a few simple rules to help younger fans stay safe and keep the Internet
    a great place to spend time:


    +   - Never give out your real name - don''t use it as your username.

    +   - Never give out any of your personal details.

    +   - Never tell anybody which school you go to or how old you are.

    +   - Never tell anybody what password you use or where you live.

    +   - Be aware that you must be 13 or over to create an account on many sites.

    +   - Always check the site policy and ask a parent or guardian for permission
    before registering.

    +   - Always tell a parent or guardian if something is worrying you.


    Stay safe online. Any web site addresses listed in this book are correct at the
    time of going to print.

    Please be aware that online content can be subject to change and websites can
    contain content that

    is unsuitable for children. We advise that all children are supervised when using
    the internet.'
