    \ and how you can choose them, turn back to page 30.\n\n## «HELPING YOU GET AROUND»\n\
    \n### STYLING THE MENU LINKS\n\nThe Nanonauts would like to make some changes\
    \ to the top menu to make it easier for users of the site to find their way from\
    \ one page to another. There are two things they'd like to do:\n\n- When you land\
    \ on, for example, the See Us Play page, the See Us Play menu item should appear\
    \ in light gray rather than black and you shouldn't be able to click it, because\
    \ it would take you to the page you're already on!\n\n![](img/52e45ce976f775dd17fd84d91912f770_55_0.png)\n\
    \n- When you roll over the other menu items, the links should change to underlined\
    \ to show that they are active.\n\n![](img/52e45ce976f775dd17fd84d91912f770_55_1.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_55_2.png)\n\nTo style your links like\
    \ those above you'll need to edit both the HTML files and the CSS file.\n\n- 1.\
    \ In each of your HTML files remove the link from each menu that leads to the\
    \ same page. For example, in the `about-us.html` page you will remove the `<a\
    \ href=\"about-us.html\">` link, in the `playing-a-concert.html` page you will\
    \ remove the `<a href=\"playing-a-concert.html\">` link, and so on.\n- 2. Add\
    \ a `class` attribute with a value of `selected` to the `li` elements from which\
    \ you removed the link. The two changes are shown in the before and after tables\
    \ below.\n\n### Menu code before editing\n\n### Menu code after editing\n\n| Menu\
    \ code before editing | Menu code after editing |\n|---|---|\n| ```html\n<nav>\n\
    <ul>\n<li><a href=\"index.html\">Home</a></li>\n<li><a href=\"about-us.html\"\
    >About Us</a></li>\n<li><a href=\"our-songs.html\">Our Songs</a></li>\n<li><a\
    \ href=\"see-us-play.html\">See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\"\
    >Playing a Concert</a></li>\n</ul>\n</nav>\n``` | ```html\n<nav>\n<ul>\n<li><a\
    \ href=\"index.html\">Home</a></li>\n<li class=\"selected\">About Us</li>\n<li><a\
    \ href=\"our-songs.html\">Our Songs</a></li>\n<li><a href=\"see-us-play.html\"\
