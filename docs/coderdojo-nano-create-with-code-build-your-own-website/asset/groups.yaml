    ### HTML 中的表格


    要理解如何将表格添加到“观看我们演出”网页中，我们需要了解表格的不同部分叫什么。如下图所示：


    | 表行 → | 表头 | 表头 | 表头 | 表头 |

    |---|---|---|---|---|

    | 表行 → | 表数据 | 表数据 | 表数据 | 表数据 |

    | 表行 → | 表数据 | 表数据 | 表数据 | 表数据 |

    | 表行 → | 表数据 | 表数据 | 表数据 | 表数据 |

    | 表行 → | 表数据 | 表数据 | 表数据 | 表数据 |

    | 表行 → | 表数据 | 表数据 | 表数据 | 表数据 |


    ![](img/52e45ce976f775dd17fd84d91912f770_49_0.png)


    由此我们可以看出，在 HTML 中，表格的配方是：


    1. 添加一个或多个表行元素。

    2. 用表头或表数据元素填充每一行。


    这些 HTML 元素的名称如右侧所示。


    - 表行 — `tr`

    - 表头 — `th`

    - 表数据 — `td`


    如果我们使用元素名称，我们的示意图看起来像这样：


    | th | th | th | th |

    |---|---|---|---|

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |


    由此我们可以看出，如果表格为空，实际的 HTML 标记应该是什么样子：


    ```html

    <h2>Upcoming Concerts</h2>

    <table>

    <tr>

    <th></th><th></th><th></th><th></th>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    </table>

    ```


    > 我们称之为**表格骨架**，因为这只是一个表格的骨架。我们还没有添加实际内容。


    ![](img/52e45ce976f775dd17fd84d91912f770_50_0.png)


    ### 忍者提示


    ![](img/52e45ce976f775dd17fd84d91912f770_50_1.png)


    如果你要创建表格，最好先计算表格将有多少行和多少列，然后创建骨架，否则表格会变得非常混乱。创建骨架时，确保所有开始和结束标签都在正确的位置。注意第一行有四个
    `th` 元素，然后后面的行有四个 `td` 元素。这些标签被 `tr` 开始和结束标签包围。


