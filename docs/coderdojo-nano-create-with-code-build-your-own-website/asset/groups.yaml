    \n- 3.\n\n```css\ntable {\n  font-size:70%;\n  width:100%;\n  th, td {\n    border:1px\
    \ solid #000000;\n  }\n  th {\n  }\n  td {\n  }\n}\n```\n\n为表格中的每个 **th** 和 **td**\
    \ 元素添加 1 像素宽的纯黑边框。注意，每个元素都有自己独立的边框。这不是我们想要的效果，所以接下来我们将进行修复。规则的第一部分是 **th, td**，由于元素名称之间有逗号，它的意思是“将此规则应用于\
    \ **th** 和 **td** 元素”。\n\n![](img/52e45ce976f775dd17fd84d91912f770_52_3.png)\n\
