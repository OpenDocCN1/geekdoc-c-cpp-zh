    \n- 8. 现在进入真正有趣的部分。目前，我们所有的结构元素都一个叠一个地排列，就像一条长长的元素阶梯。试着调整浏览器窗口大小，看看会发生什么。基本上，行长度会拉伸，直到最大宽度\
    \ 1024px，之后左右边距会填满窗口。但如果我们有足够的宽度，就可以把 **aside** 元素显示在 **article** 元素的右侧。\n\n为此，我们需要写一条\
    \ CSS 规则，内容为：“当屏幕宽度超过某个值时，让 **article** 和 **aside** 元素并排显示。”我们使用一种称为 **媒体查询**\
    \ 的特殊规则来实现。这是我们的媒体查询：\n\n```css\n@media all and (min-width: 900px)\n{\n```\n\n\
    它以一个说明查询何时生效的语句开头。**@media all and (min-width: 900px)**。我们可以把这个简短示例拆解如下：\n\n|\
    \ 规则 | 含义 |\n|---|---|\n| `@media` | 这是一个媒体查询！ |\n| `all` | 适用于屏幕和打印页面（如果只适用于页面的打印版本，我们可以写“print”；如果指屏幕版本，可以写“screen”）\
    \ |\n| `and` | 连接两者。 |\n| `(min-width: 900px)` | 仅当浏览器窗口宽度大于 900px 时，此查询才会生效。\
    \ |\n\n注意，这三条规则位于媒体查询的花括号内。这就是最后一条规则后面有两个括号的原因。\n\n```css\n@media all and (min-width:\
    \ 900px) {\n  article {\n    float: left;\n    width: 66%;\n  }\n  aside {\n \
    \   float: left;\n    padding-left: 24px;\n    width: 34%;\n  }\n  footer {\n\
    \    clear: both;\n  }\n}\n```\n\n这些规则的作用是使用 **float** 属性将 **article** 和 **aside**\
    \ 元素彼此相邻定位。通过同时为两个元素应用浮动，然后让它们的总宽度等于 100%（article 为 66%，aside 为 34%），我们就能在窗口宽度达到\
    \ 900 像素时让它们并排显示。我们在 aside 左侧添加一些内边距，这样当它们并排时，边框不会相互碰撞。\n\n最后，我们为 footer 元素添加一条\
    \ **clear: both** 规则。这会结束浮动元素，并确保 footer 出现在其正常位置。如果你不添加这条规则，footer 就会浮动到 article\
    \ 右侧——这不是我们想要的效果！\n\n![](img/52e45ce976f775dd17fd84d91912f770_82_0.png)\n\n##\
    \ 结果！\n\n你可以轻松交换 article 和 aside 元素的位置，让 aside 出现在左侧。为此，只需在查询中将其替换为 `float: right`。像这样：\n\
    \n```css\n@media all and (min-width: 900px) {\n  article {\n    float: right;\n\
    \    width: 65%;\n  }\n  aside {\n    float: right;\n    padding-right: 24px;\n\
    \    width: 34%;\n  }\n  footer {\n    clear: both;\n  }\n}\n```\n\n## 接下来要做的事\n\
    \n尝试添加一个媒体查询，使宽度低于 480px 时字体变小。\n\n![](img/52e45ce976f775dd17fd84d91912f770_82_1.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_82_2.png)\n\n## 认识内容\n\n一个响应式网页布局示例。\n\
