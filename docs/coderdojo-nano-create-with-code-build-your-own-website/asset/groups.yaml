    \ 剧院 | 晚上 7:30 | $5.00 |\n\n有关颜色的更详细介绍以及如何选择颜色，请翻回第 30 页。\n\n## «帮助你在网站中导航»\n\n\
    ### 为菜单链接设置样式\n\nNanonauts 希望更改顶部菜单，让网站用户更容易从一页导航到另一页。他们想做两件事：\n\n- 例如，当你进入 See\
    \ Us Play 页面时，See Us Play 菜单项应以浅灰色而非黑色显示，并且不应能够点击它，因为它会带你回到你当前所在的页面！\n\n![](img/52e45ce976f775dd17fd84d91912f770_55_0.png)\n\
    \n- 当你将鼠标悬停在其它菜单项上时，链接应变为带下划线，以表明它们是活动的。\n\n![](img/52e45ce976f775dd17fd84d91912f770_55_1.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_55_2.png)\n\n要像上面那样设置链接样式，你需要同时编辑 HTML\
    \ 文件和 CSS 文件。\n\n- 1. 在每个 HTML 文件中，从每个菜单中移除指向同一页面的链接。例如，在 `about-us.html` 页面中，你将移除\
    \ `<a href=\"about-us.html\">` 链接；在 `playing-a-concert.html` 页面中，你将移除 `<a href=\"\
    playing-a-concert.html\">` 链接，以此类推。\n- 2. 为移除链接的 `li` 元素添加一个值为 `selected` 的 `class`\
    \ 属性。这两个更改如下面的“编辑前”和“编辑后”表格所示。\n\n### 编辑前的菜单代码\n\n### 编辑后的菜单代码\n\n| 编辑前的菜单代码 |\
    \ 编辑后的菜单代码 |\n|---|---|\n| ```html\n<nav>\n<ul>\n<li><a href=\"index.html\">Home</a></li>\n\
    <li><a href=\"about-us.html\">About Us</a></li>\n<li><a href=\"our-songs.html\"\
