- pgno: 47
  md: '# <EMBEDDING A MAP>


    If you can embed a YouTube video you can also embed a Google Map. The way you
    do it is very similar. The Nahanouts’ next concert is at the bandstand in Seafront
    Park at their hometown of Bray, Ireland. Let’s see how they add a map to a page
    showing the location of Seafront Park.


    ![](img/52e45ce976f775dd17fd84d91912f770_47_0.png)


    # 1. PINPOINT THE LOCATION


    In the address box on Google Maps, enter the address for Seafront Park.


    ![](img/52e45ce976f775dd17fd84d91912f770_47_1.png)


    Google Maps will mark the location with a red “pin” on the map.


    ![](img/52e45ce976f775dd17fd84d91912f770_47_2.png)


    # 2. GET THE EMBED CODE


    Click the Share button. A dialog box pops up – choose the Embed Map option.


    The Embed Map option now allows you to drag and resize the map until you have
    just the view you want.


    When you are happy you have the right view, select the code from the Embed bar
    and then copy it to the computer’s memory (remember the copy shortcuts – Ctrl-C
    for Windows and Linux systems or ⌘-C for Macs).


    ![](img/52e45ce976f775dd17fd84d91912f770_47_3.png)'
  merge: -1
  img_proc: true
- pgno: 48
