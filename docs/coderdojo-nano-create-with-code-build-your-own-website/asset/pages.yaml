- pgno: 93
  md: '# # AFTERWORD


    By now, you have your very own website up and running. Congratulations! It doesn’t
    stop there, though. Code, and the computers that run it, is everywhere. It’s in
    laptops, tablets, mobile phones, and game consoles. It’s in everything from car
    engines and refrigerators to electric toothbrushes!


    The computer revolution didn’t happen overnight. It took the cleverness and hard
    work of many people, working together and sharing their ideas.


    A long time ago in Cork, Ireland, a man called George Boole had a really amazing
    idea: instead of having to use all sorts of different numbers to look at a problem,
    you could just use 0 and 1.


    At around the same time a mathematician called Ada Lovelace was working with a
    mechanical genius called Charles Babbage, who was making a machine that could
    actually do math. She wrote a set of commands that the machine would use to figure
    out math problems.


    In the 1930s, a man called John Vincent Atanasoff had a flash of brilliance and
    created the first electronic computer using the work of Boole. It took instructions
    like the ones Ada Lovelace used in Babbage’s machine.


    The secret of this revolution is that to get a computer to do exactly what you
    want, even something totally new, all you need to know is how to speak to it.
    Because of coders like Ada Lovelace, we can photograph other galaxies using space
    telescopes powered by code. We can see a baby inside its mother’s tummy using
    ultrasound powered by code. We can make incredible visions come true in the movies
    with code-powered animations and special effects.


    Now that you know the secret, too, it’s up to you what you do with it. I hope
    that whatever it is, you share the fun you have, and that whatever you build is
    cool!


    > — Bill Liao, CoderDojo Foundation


