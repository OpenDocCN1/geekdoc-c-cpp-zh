- pgno: 71
  md: "# <STRUCTURE AND INDENTATION>\n\nEvery HTML page has its own particular combination\
    \ of elements. Some pages might have lots of headings and paragraphs. Others might\
    \ have lots of images or tables. The way the elements are arranged is called the\
    \ page's structure. It's common to show this structure by pushing in the elements\
    \ from the left margin. An element inside another element is pushed over further\
    \ than the element it is inside; this is known as indenting. Most HTML editors\
    \ will show you an indented view of your code. Two simple pages are shown below\
    \ in indented and non-indented views. Note: Indentation does not affect how the\
    \ page appears in the browser, but it makes it easier to understand the structure\
    \ of your page!\n\n# NON-INDENTED\n\n# INDENTED\n\n```\n```html\n<body>\n<h1>About\
    \ Us</h1>\n<p>We are the Nanonauts.</p>\n<p>Our names are Holly\nDervla, Daniel,\
    \ and Sam.</p>\n</body>\n```\n```\n\n```\n```html\n<body>\n    <h1>About Us</h1>\n\
    \    <p>We are the Nanonauts.</p>\n    <p>Our names are Holly\n    Dervla, Daniel,\
    \ and Sam.</p>\n</body>\n```\n```\n\n```\n```html\n<body>\n<h1>Our Songs</h1>\n\
    <p>This is a list of the\nsongs we can play:</p>\n<ul>\n<li>Magical Mystery Bug</li>\n\
    <li>Boot It</li>\n<li>The Long and Winding\nCode</li>\n<li>Dojo Dancing</li>\n\
    <li>Empty Elements</li>\n<li>Java Chameleon</li>\n</ul>\n</body>\n```\n```\n\n\
    ```\n```html\n<body>\n    <h1>Our Songs</h1>\n    <p>This is a list of the songs\
    \ we can\n    play:</p>\n    <ul>\n        <li>Magical Mystery Bug</li>\n    \
    \    <li>Boot It</li>\n        <li>The Long and Winding Code</li>\n        <li>Dojo\
    \ Dancing</li>\n        <li>Empty Elements</li>\n        <li>Java Chameleon</li>\n\
    \    </ul>\n</body>\n```\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_71_0.png)\n\
    \nNotice how the various tags are nested inside each other.\n\nWe could represent\
    \ the same information by showing the elements as boxes. If an element is nested\
    \ inside another element, then the boxes are also nested, one inside the other.\
    \ We can make the structure even clearer by giving each element a different color.\
    \ We end up with the diagram shown opposite:"
