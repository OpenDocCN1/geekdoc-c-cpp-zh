    }\n```\n\n```\nbody {\n  background-color: white;\n  color: #111111;\n  font-family:\
    \ sans-serif;\n  margin-left: auto;\n  margin-right: auto;\n  max-width: 1024px;\n\
    \  min-width: 256px;\n  padding-left: 24px;\n  padding-right: 24px;\n}\n```"
