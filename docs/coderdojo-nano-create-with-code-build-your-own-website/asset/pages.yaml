- pgno: 7
  md: '# # <ABOUT US>  EDITING YOUR FIRST WEB PAGE


    So, let''s get going! This is the code for a simple web page:


    +   1. Type this code into a simple **plain-text editor** such as Notepad (Windows),
    GEdit (Ubuntu), or in a **code editor** such as Brackets, Notepad++, or Atom.
    If you''re not sure how to do this, go to scholastic.com/coder-dojo/texteditors


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>About Us</title>

    </head>

    <body>

    <h1>About Us</h1>

    <p>We are the Nanonauts.</p>

    <p>Our names are Holly, Dervla, Daniel, and Sam.</p>

    </body>

    </html>

    ```

    ```


    ![](img/52e45ce976f775dd17fd84d91912f770_7_0.png)


    # ## NINJA TIP


    Don''t try to edit your pages in a word processor such as Microsoft Word or LibreOffice.


    # ## NINJA TIP


    **about-us.html** is the file name of the web page. The **.html** at the end is
    called the **file extension**. This tells the various programs of your computer
    that **about-us.html** is a web page.


    Sometimes file extensions get hidden in Windows so that you only see **about-us**
    rather than **about-us.html**. This can be confusing, so make sure that they are
    visible. If you''re not sure how to do this, go to scholastic.com/coder-dojo/filenames


    +   2. Next, make a folder on your computer called **nanonauts** and save the
    code as a file called **about-us.html**.


    ![](img/52e45ce976f775dd17fd84d91912f770_7_1.png)'
  merge: -1
  img_proc: true
- pgno: 8
  md: '**3.** The code tells a **web browser**, such as Chrome or Firefox, what is
    in the web page. This type of code is known as **HTML**, which stands for Hypertext
    Markup Language.


    Let''s open the file in our web browser. This time, instead of looking at the
    code, you''ll see the web page as it is meant to be seen! You can usually do this
    just by clicking or double-clicking the file. If you''re having trouble, go to
    scholastic.com/coder-dojo/openfiles


    ![](img/52e45ce976f775dd17fd84d91912f770_8_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_8_1.png)


    # CHANGE IT!


    **4.** Now you have the same file open in your web browser and the code editor.
    Arrange the windows so that you can see the code editor and the web browser at
    the same time.


    Change the text in the code editor so that it shows the names of you and your
    friends. Change the name of the band if you like as well. So instead of saying
    “Our names are Holly, Deryla, Daniel, and Sam,” it might say “Our names are Anna,
    Ali, Zeke, and Zoe.” To change the text, click in the code editor and type in
    the new text. Don''t change the **tags** — the things between the **angle brackets**
    such as **<h1>** and **<p>** — just change the text between them.


    # NINJA TIP


    ![](img/52e45ce976f775dd17fd84d91912f770_8_2.png)


    When you''re developing a web site, you''ll need to open the web pages in two
    different applications:


    +   - a plain-text editor or a code editor to write the code for the page

    +   - a web browser to see the results


    This can be a little confusing at first, but you''ll soon get used to it!


    ![](img/52e45ce976f775dd17fd84d91912f770_8_3.png)'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# # <ADD A STYLESHEET>


    We''re now going to change how the page looks. To do this we''re going to create
    a **stylesheet**. A stylesheet tells you how the web page should look. Should
    the background be white or blue or green? Should the text be large or small? Should
    the links change color when you roll the mouse over them?


    The stylesheet is the place where you keep all this information. The stylesheet
    is kept separate from the .html file so that you can change the web page''s color
    scheme without having to change the HTML code of the page itself.


    +   1. The stylesheet we''ll be creating will be in a new file called **my-first-stylesheet.css**.
    Notice that the file extension of the stylesheet is **.css**, not **.html**. (Stylesheets
    in this book will be orange, so that you can tell the difference at a glance.)
    To keep things neat, we''ll save our stylesheet in its own folder. We''ll name
    this folder **css** and create it inside the **nanonauts** folder.

    +   2. Type in the code from the orange box and save it as **my-first-stylesheet.css**
    in the **css** folder.

    +   3. To link the stylesheet to the web page, you need to add an extra line into
    your HTML – it''s highlighted in the code below.


    ![](img/52e45ce976f775dd17fd84d91912f770_9_0.png)


    ```

    ```css

    body {

    font-family: sans-serif;

    }

    ```

    ```


    +   4. What this line does is link the web page to the stylesheet called **my-first-stylesheet.css**


    This stylesheet is kept in the **css** folder. (That''s what the line of code
    **css/my-first-stylesheet.css** refers to!) In other words, the stylesheet you''ve
    just created.


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>About Us</title>

    <link type="text/css" rel="stylesheet"

    href="css/my-first-stylesheet.css"/>

    </head>

    <body>

    <h1>About Us</h1>

    <p>We are the Nanonauts.</p>

    <p>Our names are Holly, Dervla, Daniel, and Sam.</p>

    </body>

    </html>

    ```

    ```


    To see the difference the stylesheet makes to the web page, you must reload the
    page. To reload the page, click on the Reload symbol in the toolbar.


    ![](img/52e45ce976f775dd17fd84d91912f770_9_1.png)'
  merge: -1
  img_proc: true
- pgno: 10
  md: '5. After it''s reloaded, the page looks a little different. That''s because
    the words are now displaying in a **sans-serif** font — that''s what `font-family:
    sans-serif;` does in the stylesheet.


    A serif font looks like this


    A sans-serif font looks like this


    ![](img/52e45ce976f775dd17fd84d91912f770_10_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_10_1.png)


    # # CONGRATULATIONS!


    # YOU''VE MADE A WEB PAGE AND A STYLESHEET — AND THEY''RE WORKING TOGETHER!


    # THINGS TO DO NEXT


    ![](img/52e45ce976f775dd17fd84d91912f770_10_2.png)


    Enter some more paragraphs of text. Paragraphs go between the `<p>` and `</p>`
    tags. Like this:


    ```

    ```html

    <p>I am learning how to make a website for my Dojo Nano.</p>

    ```

    ```


    `<p>` is a start tag. `</p>` is an end tag. Can you spot the difference?


    You can see now that a web page is just text typed into a text file. How the text
    appears on the web page is controlled by the tags. What happens if you use `h1`
    or `h2` tags instead of `p` tags? What happens if you put some words inside `strong`?


    ```

    Like this: `<p>My name is <strong>Sam</strong></p>`

    ```


    ![](img/52e45ce976f775dd17fd84d91912f770_10_3.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_10_4.png)'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # WORDS TO REMEMBER


    ![](img/52e45ce976f775dd17fd84d91912f770_11_0.png)


    **Code editor** – a program that allows you to edit the HTML code for your web
    page. You don''t have to use a special code editor – Notepad will do just fine
    – but code editors make it easier by color-coding the HTML markup and providing
    other helpful features.


    **Edit** – when you make changes to a web page, you edit it.


    **File** – whenever you save anything onto your computer or on the web, it''s
    stored as a file. Files can contain any kind of information – they can be web
    pages, photos, songs, PDF documents, you name it. But programmers refer to all
    of these things as files.


    **File name** – files always have a file name. So the About Us web page has a
    file name: `about-us.html` File names usually end with a period followed by three
    or four letters (such as `.jpg`, `.pdf`, `.html`). This is known as a **file extension**
    and it tells the computer what kind of file it is. For example, a file ending
    `.jpg` is an image file.


    **Folder** – when you save a file, it goes into a folder. A folder is a particular
    storage location on a computer. Folders can contain other folders. You refer to
    a folder by giving its **path**. For example, `C:/nanonauts/images` gives the
    path to the **images** folder inside the **nanonauts** folder on your computer''s
    **C:** drive.


    **Tags** – are special markers used in HTML code. They use angle brackets and
    look like these examples: `<p>` `</p>` `<h1>` `</h1>` `<br />` You''ll be seeing
    a lot more of them throughout this book!


    **Web browser** – Chrome, Firefox, Internet Explorer, Opera, Safari, and other
    applications that let you browse the web are called web browsers. To view a web
    page you need a web browser.


    # ## NINJA TIP


    Some word-processing programs will automatically turn your quotation marks (")
    into "smart quotes" ("). Your code won''t work! Use a plain-text editor.


    # ## MORE ONLINE


    Want to know more about editing code using a code editor? Go to scholastic.com/coder-dojo/codeeditor'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # <PICTURING THE NANONAUTS>


    # ## ADDING A PHOTO TO THE PAGE


    The About Us page tells everyone about the band. But wouldn''t it be more interesting
    if it showed a photo as well? To show a photo you''ve got to tell the web browser
    where to find it. And to understand where to look, the web browser needs to know
    **1.** the name of the folder in which the photo is stored and **2.** the title
    name of the picture. Let''s say you have a picture called `nanonauts.jpg`.


    You can add the picture to the page by adding the following line of code:


    ```

    ```html

    <p><img src="images/nanonauts.jpg" alt="Picture of the Nanonauts"/></p>

    ```

    ```


    This is how the modified code looks:


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>About Us</title>

    <link type="text/css" rel="stylesheet" href="css/my-first-stylesheet.css"/>

    </head>

    <body>

    <h1>About Us</h1>

    <p><img src="images/nanonauts.jpg" alt="Picture of the Nanonauts"/></p>

    <p>We are the Nanonauts.</p>

    <p>Our names are Holly, Dervla, Daniel, and Sam.</p>

    </body>

    </html>

    ```

    ```


    ![](img/52e45ce976f775dd17fd84d91912f770_12_0.png)


    After saving the page and reloading it in the browser, it looks like this:


    ![](img/52e45ce976f775dd17fd84d91912f770_12_1.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Let''s take a closer look at the code.


    ```

    ```html

    <p><img src="images/nanonauts.jpg" alt="Picture of the Nanonauts" /></p>

    ```

    ```


    The really important part here is `src="images/nanonauts.jpg"`.


    This tells the web browser to look inside the **images** folder for a file named
    **nanonauts.jpg**. The web browser looks for the **images** folder in the same
    place that the web page is saved. So, if you look at the files in the **nanonauts**
    folder, as well as the **about-us.html** file, you''ll see an **images** folder.
    And, if you open this folder, you''ll see the **nanonauts.jpg** file.


    ![](img/52e45ce976f775dd17fd84d91912f770_13_0.png)


    # NINJA TIP


    If the **nanonauts.jpg** file were missing from the **images** folder, then the
    browser would show a symbol that indicates that. Something like this:


    ![](img/52e45ce976f775dd17fd84d91912f770_13_1.png)


    The `src="images/nanonauts.jpg"` is an **attribute**. Attributes always follow
    the same pattern — an attribute name, followed by an equals sign, followed by
    an attribute value contained within a pair of straight quote marks. Like this:


    | attribute name | equals sign | opening straight quote mark | attribute value
    | closing straight quote mark |

    |---|---|---|---|---|

    | `src` | `=` | `"` | `images/nanonauts.jpg` | `"` |


    The **alt** attribute, in the same way, contains text that appears if the picture
    cannot be shown. This is helpful if the web page is being translated into speech
    for blind people, for example.


    Now that you know how to add a picture, add your own picture into your **about-us.html**
    page. To do this, copy the picture into the **images** folder and then add the
    code that will display your picture. So, if your picture came from a digital camera
    and was called **DSC03730.jpg** you might add the following code:


    ```

    ```html

    <p><img src="images/DSC03730.jpg"

    alt="Holly playing the guitar" /></p>

    ```

    ```


    ![](img/52e45ce976f775dd17fd84d91912f770_13_2.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# THINGS TO DO NEXT


    Try adding some of your own photographs to the page. Add a few selfies!


    ![](img/52e45ce976f775dd17fd84d91912f770_14_0.png)


    # WORDS TO REMEMBER


    **Attribute** – tags sometimes contain additional information held inside attributes.
    In the example of the `img` tag below we can see that there are two attributes:
    `src` and `alt`.


    ```

    ```html

    <img src="images/DSC03730.jpg" alt="Holly playing the guitar"/>

    ```

    ```


    Attributes **always** consist of an attribute name (such as `src` or `alt`) followed
    by an `=` sign and then by the attribute value contained inside straight quote
    marks, for example `"images/DSC03730.jpg"`.


    The `src` (source) attribute tells the browser where to look for the image. The
    `alt` (alternative) attribute holds text that will appear if the image cannot
    be displayed, or if it will be read aloud by screen-reading software.


    **Element** – An element is anything between a start tag and an end tag of the
    same type. So an `li` element is everything between an `<li>` start tag and an
    `</li>` end tag.


    **Empty element** – Some elements don''t have separate start and end tags: they
    are called **empty elements**. Examples are:


    - `img` – the image element

    - `br` – the line-break element


    Instead of having a separate end tag they have just a single tag that ends with
    a forward slash before the closing angle bracket.


    ```

    ```html

    <img src="images/DSC03730.jpg"

    alt="Holly playing a chord on the

    guitar"/> <br/>

    ```

    ```


    # MORE ONLINE


    +   - Adding pictures to pages – scholastic.com/coder-dojo/addpics

    +   - Making pictures the right size – scholastic.com/coder-dojo/picsize'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# < BUILDING THE SITE >


    # ADDING NEW WEB PAGES


    The Nanonauts now want to make a new page that lists the songs they play. The
    easiest way to make a new page is to copy an existing page and change it.


    Open the **about-us.html** file. Then go to the **File** menu and choose the **Save
    As** option. Save the file as **our-songs.html**. Notice how the new file appears
    in the list of files in the **nananouts** folder. You now have a new web page
    named **our-songs.html**. But at the moment it''s just the same as the **about-us.html**
    page. You''ll need to edit the text so that the page is now a list of songs. Use
    the example below for ideas. Add in your own favorite songs!


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Our Songs</title>

    <link type="text/css" rel="stylesheet" href="css/my-first-stylesheet.css"/>

    </head>

    <body>

    <h1>Our Songs</h1>

    <p>This is a list of the songs we can play:</p>

    <ul>

    <li>Magical Mystery Bug</li>

    <li>Boot It</li>

    <li>The Long and Winding Code</li>

    <li>Dojo Dancing</li>

    <li>Empty Elements</li>

    <li>Java Chameleon</li>

    </ul>

    </body>

    </html>

    ```

    ```


    When you''ve finished editing the page, save it and then open the file in your
    web browser.


    # NINJA TIP


    Every time you save a file in the editor, reload the web page in the web browser
    to see the effect of your most recent changes. Think “Save and reload!”


    ![](img/52e45ce976f775dd17fd84d91912f770_15_0.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: "When the page displays in the browser it looks like this:\n\nThe songs are\
    \ displayed as a **bulleted list** (the little circles to the left of the song\
    \ names are called bullets). The code for the list is shown below – we'll learn\
    \ more about lists later.\n\n![](img/52e45ce976f775dd17fd84d91912f770_16_0.png)\n\
    \n```\n~~~html\n<ul>\n  <li>Magical Mystery Bug</li>\n  <li>Boot It</li>\n  <li>The\
    \ Long and Winding Code</li>\n  <li>Dojo Dancing</li>\n  <li>Empty Elements</li>\n\
    \  <li>Java Chameleon</li>\n</ul>\n~~~\n```\n\nEach song in the list is inside\
    \ an `li` element. An **element** is anything between a **start tag** and an **end\
    \ tag** of the same type. So an `li` element is everything between an `<li>` **start\
    \ tag** and an `</li>` **end tag**. Notice also that all of the `li` elements\
    \ are inside a single **`ul`** element. Can you see the `<ul>` start tag before\
    \ the first song?\n\n```\n~~~html\n<ul>\n  <li>Magical Mystery Bug</li>\n~~~\n\
    ```\n\nAnd the `</ul>` end tag after the last song?\n\n```\n~~~html\n<li>Java\
    \ Chameleon</li>\n</ul>\n~~~\n```\n\n# NINJA TIP\n\nSave the page every so often\
    \ as you're working on it. That way you won't lose your work if your laptop battery\
    \ runs out suddenly!\n\n# THINGS TO DO NEXT\n\nSee what happens if you put the\
    \ `li` elements inside an `ol` instead of a `ul` element. Figure out:\n\n+   -\
    \ where the `h1` element starts and ends\n+   - where the `body` element starts\
    \ and ends\n+   - where the `html` element starts and ends\n\nThe `img` element\
    \ is an **empty element**. It doesn't have separate start and end tags. See if\
    \ you can spot another empty element.\n\nMake another page called See Us Play\
    \ with a file name of `see-us-play.html` that gives the date and time of the Nanonauts'\
    \ next concert.\n\n![](img/52e45ce976f775dd17fd84d91912f770_16_1.png)"
