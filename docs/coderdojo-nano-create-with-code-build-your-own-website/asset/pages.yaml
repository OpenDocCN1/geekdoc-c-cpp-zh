    \ none;\n  color: #111111;\n}\n```\n```\n\nEnsures the link color is black. To\
    \ complete our menu we change the links to black to blend in with the rest of\
    \ the menu bar’s color scheme.\n\n# Playing a Concert\n\nPlaying a concert can\
    \ be great fun! Or it can be totally scary! Sometimes both at the same time.\n\
    \nSo we’ve put together a list of our top tips for great concerts.\n\n# Write\
    \ out a set-list\n\nA set-list is a list of all your songs in the order you’ll\
    \ play them.\n\nMake copies for everyone.\n\nPrint it BIG! So that you can still\
    \ read it if it’s down by your feet on the floor, or if the lighting isn’t very\
    \ good.\n\n# Remember your spares\n\nSome instruments have parts that need to\
    \ be replaced if they wear out or break. For example:\n\n+   - guitar strings\n\
    +   - saxophone or clarinet reeds\n+   - drumsticks\n\n![](img/52e45ce976f775dd17fd84d91912f770_40_0.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_40_1.png)"
