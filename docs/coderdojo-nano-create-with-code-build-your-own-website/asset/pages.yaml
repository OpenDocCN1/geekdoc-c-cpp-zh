- pgno: 39
  md: "```\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    \  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n\
    \  font-weight: bold;\n  padding: 16px;\n}\n\nnav ul li {\n  display: inline;\n\
    \  border-right: 2px solid #111111;\n  padding-right: 8px;\n  padding-left: 8px;\n\
    }\n\nnav ul li:last-child {\n  border-right: none;\n}\n\nnav ul li a {\n}\n```\n\
    ```\n\nRemoves the final separator line. As you can see, we've moved on to a new\
    \ rule again. This rule begins with **nav ul li:last-child**. The **last-child**\
    \ condition included in the rule means that it will only apply to the last li\
    \ element inside ul elements within **nav** elements.\n\n![](img/52e45ce976f775dd17fd84d91912f770_39_0.png)\n\
    \n```\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    \  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n\
    \  font-weight: bold;\n  padding: 16px;\n}\n\nnav ul li {\n  display: inline;\n\
    \  border-right: 2px solid #111111;\n  padding-right: 8px;\n  padding-left: 8px;\n\
    }\n\nnav ul li:last-child {\n  border-right: none;\n}\n\nnav ul li a {\n  text-decoration:\
    \ none;\n}\n```\n```\n\nRemoves the underlining of the menu items. Showing links\
    \ as underlined is useful in a web page but doesn't look good in the top menu.\
    \ We can set the **text-decoration** value to **none** to remove the underlining.\
    \ The **nav ul li a** part of the rule means it will apply to **a** elements inside\
    \ **li** elements inside **ul** elements within **nav** elements.\n\n![](img/52e45ce976f775dd17fd84d91912f770_39_1.png)"
