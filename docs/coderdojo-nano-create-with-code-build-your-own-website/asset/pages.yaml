- pgno: 24
  md: '# # <LAYING ON THE STYLE!>


    If you want to change the appearance of your web pages, you don''t change the
    code of the pages themselves. Instead you change the code of the stylesheet. We
    came across the stylesheet earlier in the book. But now we''re going to look at
    it in a lot more detail. Stylesheets are where a lot of the magic happens when
    you''re designing a great-looking website!


    In the picture below you can see the exact same HTML web page - the only thing
    that''s changed is the stylesheet.


    ![](img/52e45ce976f775dd17fd84d91912f770_24_0.png)


    # ## WHAT STYLESHEET IS MY PAGE USING?


    If you look at the top part of the code for your web pages you''ll see a link
    element below the page title.


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Playing a Concert</title>

    <link type="text/css" rel="stylesheet" href="css/my-first-stylesheet.css"/>

    </head>

    ```

    ```


    By looking at this link you can find the name of the css file that is being used
    to style the page. The link element tells the web browser to look inside the css
    folder for the my-first-stylesheet.css file.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# # WHAT'S IN THE STYLESHEET?\n\nLet's take a look at the stylesheet and see\
    \ how we can modify it. Open one of your web pages in your browser and open **my-first-stylesheet.css**\
    \ alongside it in the code editor, so that you can see them both side by side.\
    \ The **my-first-stylesheet.css** file contains just one rule.\n\nThis rule tells\
    \ the browser how to format everything inside the **body** element of the HTML\
    \ file. What this rule is saying is “display everything in the body element in\
    \ a sans-serif font.”\n\n```\n```css\nbody {\n  font-family: sans-serif;\n}\n\
    ```\n```\n\nSo if we change the rule so that the **font-family** is now **serif**\
    \ and reload the web page, we see that it suddenly looks different.\n\n```\n```css\n\
    body {\n  font-family: serif;\n}\n```\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_25_0.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_25_1.png)\n\n![](img/52e45ce976f775dd17fd84d91912f770_25_2.png)\n\
    \n# ## MORE ONLINE\n\nIf you find opening the stylesheet difficult, see the tutorial\
    \ at scholastic.com/coder-dojo/stylesheets"
  merge: -1
  img_proc: true
- pgno: 26
  md: "Let's change the stylesheet a little more. We'll change the body font back\
    \ to sans-serif and we'll also make the background a purple color. So the changed\
