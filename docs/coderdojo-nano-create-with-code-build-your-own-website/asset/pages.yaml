- pgno: 41
  md: "# # <FORMATTING A PARTICULAR PART OF THE PAGE>\n\nYou may remember that when\
    \ we added the menu we surrounded it with a **nav** element - like this:\n\n```\n\
    ```html\n<nav>\n  <ul>\n  </ul>\n</nav>\n```\n```\n\nBy doing this we make the\
    \ code easier to read and also make it possible to add rules in the stylesheet\
    \ that applied only to the menu.\n\nThe rule to the right will change only the\
    \ background colors of **ul** elements inside a **nav** element.\n\n```\n```css\n\
    nav ul {\n  background-color: #B577B5;\n}\n```\n```\n\nThis list would have a\
    \ purple background color:\n\n```\n```html\n<body>\n<nav>\n<ul>\n<li><a href=\"\
    index.html\">Home</a></li>\n<li><a href=\"about-us.html\">About Us</a></li>\n\
    <li><a href=\"our-songs.html\">Our Songs</a></li>\n<li><a href=\"see-us-play.html\"\
    >See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\">Playing a Concert</a></li>\n\
    </ul>\n</nav>\n```\n```\n\nBut this list will NOT have a purple background color:\n\
    \n```\n```html\n<body>\n<ul>\n<li><a href=\"index.html\">Home</a></li>\n<li><a\
    \ href=\"about-us.html\">About Us</a></li>\n<li><a href=\"our-songs.html\">Our\
    \ Songs</a></li>\n<li><a href=\"see-us-play.html\">See Us Play</a></li>\n<li><a\
    \ href=\"playing-a-concert.html\">Playing a Concert</a></li>\n</ul>\n```\n```\n\
    \nIf you added the rule below, it would change the background colors of both lists.\n\
    \n```\n```css\nul {\n  background-color: #B577B5;\n}\n```\n```\n\nAlso notice\
    \ that you can make rules for elements that apply only when they appear inside\
    \ other elements.\n\nSo the rule to the right applies to **li** elements **only**\
    \ if they are inside a **ul** element, which is, in turn, inside a **nav** element.\
    \ We'll make use of this technique (its proper name is **contextual selection**)\
    \ later on when we'll be designing some much more complicated pages.\n\n```\n\
    ```css\nnav ul li {\n  display: inline;\n  border-right: 2px solid #111111;\n\
    \  padding-right: 8px;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "# <I'M SPECIAL! USING THE `class` ATTRIBUTE>\n\nAnother way to identify elements\
    \ that have a special meaning and that should be styled in a particular way is\
    \ to use a **class** attribute.\n\n# LET'S SEE HOW THIS WORKS ...\n\nThe Nanonauts\
    \ have decided that they want to include “top tips” for musicians on some of the\
    \ pages. They want these tips to stand out from the rest of the page – like this:\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_42_0.png)\n\n> **TOP TIP:** If you\
    \ hit a wrong note or make a mistake, don't stop playing — pretend you meant to\
    \ do it!\n\nThe first thing they do is, in the HTML page, add a `class` attribute\
    \ to a `<p>` element that contains the tip. Like this:\n\n```\n```html\n<p class=\"\
    top-tip\">If you hit a wrong note or make a mistake, don't stop playing - just\
    \ keep going and look as though you meant it!</p>\n```\n```\n\nThe Nanonauts then\
    \ use the stylesheet to format the tips in a special way so that they stand out.\
    \ Here are the rules they use to format the top tip:\n\n```\n```css\np.top-tip\
    \ {\n  border: 4px solid #EA6E8E;\n  border-radius: 10px;\n  padding: 16px;\n\
    \  background-color: #C5E8FB;\n}\np.top-tip:before {\n  color: black;\n  content:\
    \ \"TOP TIP: \";\n  font-weight: bold;\n}\n```\n```\n\n# THINGS TO DO NEXT\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_42_1.png)\n\n+   See if you can add some\
    \ top tips to your pages.\n+   \n+   - Can you figure out what the `p.top-tip:before`\
    \ rule does?\n+     - Hint: try changing `content: \"Top Tip: \"` to `content:\
    \ \"Mega Tip! \"`.\n+   - Can you make just the words Top Tip: appear in orange?\n\
    +   - What happens if you change the border from `solid` to `dashed`?\n\n# MORE\
    \ ONLINE\n\n![](img/52e45ce976f775dd17fd84d91912f770_42_2.png)\n\nIf you want\
    \ to make a web page look really good, it's important that you can pick out the\
    \ various parts of the page. The `class` attribute has a hidden secret that allows\
    \ you to apply more than one formatting rule to an element. Find out about the\
    \ `class` attribute here: scholastic.com/coder-dojo/class"
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # WORDS TO REMEMBER


    ![](img/52e45ce976f775dd17fd84d91912f770_43_0.png)


    **Class attribute** - we''ve already seen what an attribute is. Most attributes
    can only be used with particular elements, but the **class** attribute is special
    because it can be applied to any HTML element. For example:


    ```

    ```html

    <p class="top-tip">

    <h3 class="author">

    <table class="football-league-table">

    <li class="selected-menu-item">

    ```

    ```


    You use the **class** attribute to identify the meaning of a particular element
    and you can then apply a special style only to the element with that particular
    class.


