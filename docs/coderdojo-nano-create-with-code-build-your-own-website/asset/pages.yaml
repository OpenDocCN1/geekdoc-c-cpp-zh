- pgno: 65
  md: '# THE ARTICLE ELEMENT


    The `article` element is used to contain a single item of content, a section that
    makes sense on its own without the rest of the page in context. Articles can appear
    inside articles, a little like Russian dolls!


    ![](img/52e45ce976f775dd17fd84d91912f770_65_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_65_1.png)


    # THE SECTION ELEMENT


    The `section` element is used to divide a large article into smaller chunks. Each
    chunk should have a subheading and form a major part of the article. Within the
    ''Meet the Nanonauts'' article, each individual Nanonaut biography can be placed
    within a section. You can also divide the `aside` element (see the next page)
    into sections using the section element.


    ![](img/52e45ce976f775dd17fd84d91912f770_65_2.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# THE ASIDE ELEMENT


    The aside element is used to contain content that isn’t really part of the main
    subject of the page. For example, you often see ads on a page, or information
    about up-and-coming events. This sort of content can be placed inside an aside
    element. In the case of the About Us page, the ads for the CD and T-shirt, and
    information about the next concert can all be placed within the aside element.


    ![](img/52e45ce976f775dd17fd84d91912f770_66_0.png)


    # THE FOOTER ELEMENT


    The footer element is used to contain content that appears at the bottom of the
    page. The footer may be the same for every page on the site. Quite often the footer
    will contain a copyright notice and may contain contact information such as an
    email address or telephone number.


    ![](img/52e45ce976f775dd17fd84d91912f770_66_1.png)'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# **STRUCTURAL ELEMENTS IN USE**


    # THE EXPANDED ABOUT US PAGE


    Now that the Nanonauts have the basic plan of their site they want to make the
    individual pages more interesting. They are going to start by adding the extra
    information described in the last section to the About Us page.


    ![](img/52e45ce976f775dd17fd84d91912f770_67_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_67_1.png)


    This is the list of things they want to do:


    +   1. Add a header to the page containing the name of the band and the title
    of the page.

    +   2. Add a section called Meet the Nanonauts that contains a short feature about
    each band member – with their photograph and a few personal details.

    +   3. Include ads for their CD and T-shirt.

    +   4. Show details of their next concert.

    +   5. Add a footer to the page containing a copyright statement and a contact
    email address.


    The code for the page is shown on the next few pages, with the structural elements
    within the body element bracketed in different colors (see the key at the top
    of page 69 for reference). We also used indentation to show the structure more
    clearly – more on this in a moment. Notice how the body element contains the nav
    element followed by a single article (“About Us”). The “Meet the Nanonauts” article
    is split into four sections (“Daniel – Singer extraordinaire,” “Sam – One-man
    rhythm section,” “Holly – if it’s got strings, she’ll play it,” and “Dervla –
    Keyboard maestro”).


    Notice that we haven’t given the images a width. Instead we’ve given each image
    a class – small, medium, or large – and we’ll use the stylesheet to set the image
    width.'
  merge: -1
  img_proc: true
