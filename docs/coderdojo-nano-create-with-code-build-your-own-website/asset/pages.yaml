- pgno: 73
  md: '# # <GETTING RESPONSIVE>


    ![](img/52e45ce976f775dd17fd84d91912f770_73_0.png)


    **Responsive** websites are sites that work on all types of devices – desktop
    computers, laptops, tablets, mobile phones. Responsive websites do this by changing
    the size and position of the elements on a web page to suit the amount of screen
    that is available. The diagram below shows how the Nanonauts'' About Us page might
    change its layout depending on the device it is being viewed on.


    **MOBILE**


    ![](img/52e45ce976f775dd17fd84d91912f770_73_1.png)


    **TABLET**


    ![](img/52e45ce976f775dd17fd84d91912f770_73_2.png)


    From these examples we can see that:


    +   - Mobile or tablet displays can simply stack the elements, one on top of the
    other.

    +   - Desktop machines allow for extra width: the **aside** element (containing
    the ads) can move into a right-hand column.


    **DESKTOP**


    ![](img/52e45ce976f775dd17fd84d91912f770_73_3.png)


    To figure out how best to design a page we can use a **mobile-first** approach.
    Mobile-first is a popular way to design website pages: first create a design that
    works well on the smallest mobile device, such as a phone, and then add extra
    features that make use of the extra screen space available on larger devices.


    We''re going to use a mobile-first approach to style the About Us page we created
    previously. To show how this works we''re going to go through the following steps:


    ![](img/52e45ce976f775dd17fd84d91912f770_73_4.png)


    +   1. Add colored backgrounds to the structural elements so that we can easily
    see how they are being affected by changes in the CSS.

    +   2. Style the structural elements so that they look good and are easy to read
    on mobile phones and larger devices.

    +   3. Add some extra features that will make use of the extra screen space available
    on larger devices.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Our starting point is the following stylesheet. You can type it in or you can
    download it from scholastic.com/coder-dojo/stylesheet. You can also download the
    full code of the About Us page if you don''t want to type it all in. This stylesheet
    simply highlights the structural elements by giving each a distinctive background
    color. This will make it easy for us to see the effect of applying new CSS rules.


    ```

    ```css

    /* technical stuff - set sizing to border

    box method */


    html {

    box-sizing: border-box;

    }


    *, *:before, *:after {

    box-sizing: inherit;

    }


    /* style the various structural elements */

    html {

    background-color: White;

    }


    body {

    background-color: White;

    }


    header {

    background-color: #F45556;

    }


    nav {

    background-color: #FCAB68;

    }


    article {

    background-color: #FFD239;

    }


    section {

    background-color: #88BB75;

    }


    aside {

    background-color: #1EADDF;

    }


    footer {

    background-color: #BA99C0;

    }

    ```

    ```


    # NINJA TIP


    ![](img/52e45ce976f775dd17fd84d91912f770_74_0.png)


    Use **comments** in your code to let people know what each element does. (It''s
    also handy if you need to remind yourself!)


    Comments start with `/*` and end with `*/` in CSS


    ![](img/52e45ce976f775dd17fd84d91912f770_74_1.png)'
