- pgno: 23
  md: '![](img/52e45ce976f775dd17fd84d91912f770_23_0.png)


    # NINJA TIP


    Use list markup when you need to make a list of things. There are two kinds of
    lists: use the **ul** element for **bulleted** (unordered) lists; use the **ol**
    element for **numbered** (ordered) lists. Each list item should be inside its
    own **li** element.


    | Bulleted List | Numbered List | Bulleted List | Numbered List |

    |---|---|---|---|

    | `<ul>`<br>`<li>rock</li>`<br>`<li>paper</li>`<br>`<li>scissors</li>`<br>`</ul>`
    | `<ol>`<br>`<li>rock</li>`<br>`<li>paper</li>`<br>`<li>scissors</li>`<br>`</ol>`
    | • rock<br>• paper<br>• scissors | 1. rock<br>2. paper<br>3. scissors |


    You can see that the word **"set-list"** and the phrase **"find out what time
    you''re on"** are inside **strong** elements. The **strong** elements can be used
    inside other elements such as **p** and **li**. You use it if you want to make
    particular words stand out.


    # NEST YOUR ELEMENTS!


    Elements should always be nested. This means that they always slot inside one
    another, like Russian dolls!


    # What does “nested” mean?


    When we talk about an element being nested in another element, we mean that its
    opening and closing tags occur somewhere between the other element''s opening
    and closing tags. For example, if we say that a **strong** element containing
    the word “Tip” is “inside” a **p** element we mean that its opening `<strong>`
    and closing `</strong>` tags occur somewhere between the opening `<p>` and closing
    `</p>` tags of the p element.


    ```

    **CORRECT**

    ```html

    <p><strong>Tip:</strong>

    If you make a mistake

    don''t stop playing!</p>

    ```

    ```


    ```

    **INCORRECT**

    ```html

    <strong>Tip</strong>

    If you make a mistake

    don''t stop playing!</p>

    ```

    ```


    # MAKING IT LOOK BETTER


    So far our web pages look ... OK. But they''re a little boring, aren''t they?
    They look more like pages in a printed book than web pages. BUT maybe we could
    change this by:


    +   - changing the background color of the page

    +   - adding a background picture

    +   - making the text look fancier


