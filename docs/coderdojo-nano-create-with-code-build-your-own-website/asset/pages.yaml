- pgno: 38
  md: "# 9.\n\n```\n```css\nnav ul {\n  list-style-type: none;\n  background-color:\
    \ #B577B5;\n  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family:\
    \ sans-serif;\n  font-weight: bold;\n  padding: 16px;\n}\nnav ul li {\n  display:\
    \ inline;\n  border-right: 2px solid #111111;\n}\nnav ul li:last-child {\n}\n\
    nav ul li a {\n}\n```\n```\n\nAdds a 2-pixel-wide separator line on the right\
    \ of each menu entry. You make the line thicker or thinner by changing the number\
    \ before the px. Notice how the declaration combines three separate properties\
    \ of the border: thickness, line-style, and color.\n\n![](img/52e45ce976f775dd17fd84d91912f770_38_0.png)\n\
    \n# 10.\n\n```\n```css\nnav ul {\n  list-style-type: none;\n  background-color:\
    \ #B577B5;\n  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family:\
    \ sans-serif;\n  font-weight: bold;\n  padding: 16px;\n}\nnav ul li {\n  display:\
    \ inline;\n  border-right: 2px solid #111111;\n  padding-right: 8px;\n  padding-left:\
    \ 8px;\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n```\n\nAdds some\
    \ extra space between each menu entry and the separator line to its right.\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_38_1.png)"
