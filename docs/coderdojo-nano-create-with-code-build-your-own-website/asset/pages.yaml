  md: "2. Next we set sizes for small, medium, and large images. Remember that we\
    \ used the class attribute to distinguish which images should be small, medium,\
    \ and large. For example:\n\n`<img class=\"small\" src=\"images/dervla.png\" alt=\"\
    Dervla\" />`\n\n```\n```css\nimg {\n  height: 200px;\n}\n\nimg.medium {\n  max-width:\
    \ 360px;\n  width: 50%;\n}\n\nimg.large {\n  width: 100%;\n}\n```\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_77_0.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_77_1.png)\n\n3. To make better use\
    \ of the space inside the biography section we can let the small images float\
    \ to the left — so that the text wraps around them.\n\n```\n```css\nimg.small\
    \ {\n  float: left;\n  height: 200px;\n}\n```\n```\n\n> **NINJA TIP**\n> \n> You\
    \ can float images to the left or right of text.\n\n![](img/52e45ce976f775dd17fd84d91912f770_77_2.png)"
