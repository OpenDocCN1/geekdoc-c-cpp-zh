- pgno: 49
  md: '# # <ADDING A TABLE>


    The See Us Play page only shows information about the next Nonaunauts concert.
    But they have quite a few concerts coming up and it would be good if there was
    a list of these concerts. The list could show:


    +   - the date of the concert

    +   - where the concert is taking place

    +   - what time the Nonaunauts are playing

    +   - how much it will cost to get in


    A good way to do this would be to show the information in a table. Something like
    this:


    # ## UPCOMING CONCERTS


    | Date | Place | Time | Price |

    |---|---|---|---|

    | Sunday, June 12 | Greystones Theatre | 7:30 pm | $5.00 |

    | Wednesday, June 15 | Presentation College, Bray | 8:00 pm | Free! |

    | Saturday, July 10 | Bray Bandstand | 11:00 am | Free! |

    | Sunday, July 11 | Bray Bandstand | 2:00 pm | Free! |

    | Sunday, August 28 | Greystones Theatre | 7:30 pm | $5.00 |


    # ## THE TABLE IN HTML


    To understand how to add the table to the See Us Play web page we need to understand
    what the different parts of the table are called. This is shown in the diagram
    below:


    | table row → | table header | table header | table header | table header |

    |---|---|---|---|---|

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |

    | table row → | table data | table data | table data | table data |


    ![](img/52e45ce976f775dd17fd84d91912f770_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'From this we can see that, in HTML, the recipe for a table is:


    +   1. Add one or more table row elements.

    +   2. Fill each row with table header or table data elements.


    The HTML elements are named as shown to the right.


    table row — `tr`

    table header — `th`

    table data — `td`


    If we use the element names, our diagram looks like this:


    | th | th | th | th |

    |---|---|---|---|

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |

    | td | td | td | td |


    From this we can see what the actual HTML markup should look like if the table
    was empty:


    ```

    <h2>Upcoming Concerts</h2>

    <table>

    <tr>

    <th></th><th></th><th></th><th></th>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    <tr>

    <td></td><td></td><td></td><td></td>

    </tr>

    </table>

    ```


    > We call this the **table skeleton** because this just the bones of the table.
    We haven''t added the actual content yet.


    ![](img/52e45ce976f775dd17fd84d91912f770_50_0.png)


    # NINJA TIP


    ![](img/52e45ce976f775dd17fd84d91912f770_50_1.png)


    If you''re creating a table, it''s best to begin by working out how many rows
    and columns your table will have and then creating the skeleton, otherwise tables
    can get pretty confusing. Make sure when you create the skeleton that all the
    opening and closing tags are in the correct place. Notice how there are four `th`
    elements in the first row and then four `td` elements in the following rows. These
    tags are surrounded by `tr` opening and closing tags.'
  merge: -1
  img_proc: true
