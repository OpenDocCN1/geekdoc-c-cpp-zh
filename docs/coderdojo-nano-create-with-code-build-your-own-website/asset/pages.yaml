- pgno: 57
  md: "3. After you've made the changes, refresh the web page in your browser. Notice\
    \ that the changed menu entry is no longer clickable. Adding the **class** attribute\
    \ hasn't done anything on its own. Try refreshing the menu and it'll look the\
    \ same. But adding the **class** attribute allows you to pick out the link in\
    \ the **my-first-stylesheet.css** file and change its color to gray to suggest\
    \ that it's not clickable. Here's how:\n\n```\n/* my-first-stylesheet.css */\n\
    nav li a {\n  text-decoration: none;\n}\n\nnav li a {\n  text-decoration: none;\n\
    }\nnav li.selected {\n  color: #606060;\n}\n```\n\n4. Refresh and you'll see the\
    \ selected link change to gray. What you've done is added a new rule which applies\
    \ only to **li** elements with a **class** attribute of **selected**. Notice the\
    \ syntax in the CSS file — instead of specifying **li** in the rule, you specify\
    \ **li.selected**.\n\n# NINJA TIP\n\n![](img/52e45ce976f775dd17fd84d91912f770_57_0.png)\n\
    \n> > `nav li.selected` means “li elements with a class of selected inside nav\
    \ elements”\n\n5. Finally, make the links show an underline when you hover over\
    \ them by adding a new rule to the CSS. This rule defines what will happen when\
    \ you hover your cursor over an element.\n\n```\nnav li a:hover {\n  text-decoration:\n\
    \  underline;\n}\n```\n\nThe **:hover** part of the selector is called a **pseudo\
    \ class**. A pseudo class changes the appearance of an element in certain special\
    \ situations. The following pseudo classes are available for styling links:\n\n\
    +   - `unvisited` — Sets how the link should appear before you have visited the\
    \ link destination.\n+   - `visited` — Sets how the link should appear after you\
    \ have visited the link destination.\n+   - `hover` — Sets what should happen\
    \ when you hover the cursor over an element.\n+   - `active` — Sets what should\
    \ happen when you click on the link before releasing the mouse button."
  merge: -1
  img_proc: true
- pgno: 58
  md: "So a set of rules for link formatting might look like this:\n\n```\n```css\n\
    a:link {\n  color: blue;\n}\na:visited {\n  color: purple;\n}\na:hover {\n  text-decoration:\
    \ underline;\n}\na:active {\n  text-decoration: underline;\n  background-color:\
    \ black;\n  color: white;\n}\n```\n```\n\n# # FINISHED!\n\n# ## THINGS TO DO NEXT\n\
    \n+   - Play around with the various options for formatting links.\n+   - Make\
    \ some changes to the rules in the example and see what effect it has on your\
    \ site.\n\n# ## THE CSS BOX MODEL\n\nWhen you're styling the page using your stylesheet\
    \ there's a secret to understanding how CSS works – the **CSS box model**. The\
    \ box model works by imagining that every HTML element is inside a box. This box\
    \ contains three regions:\n\n+   - padding\n+   - border\n+   - margin – spacing\
    \ between this box and the next box\n\nThis is shown below.\n\n![](img/52e45ce976f775dd17fd84d91912f770_58_0.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_58_1.png)"
  merge: -1
  img_proc: true
- pgno: 59
  md: "Using the CSS you can change every single part of the box separately. For example\
    \ you can change the appearance of your headings and paragraphs quite dramatically\
    \ simply by adjusting the padding and spacing properties.\n\nAs well as changing\
    \ the size of the various parts of the box, you can also change the colors of\
    \ the different parts of the box. Many of the great visual effects you see on\
    \ a web page are created in this way.\n\n![](img/52e45ce976f775dd17fd84d91912f770_59_0.png)\n\
    \n# MEET THE NANONAUTS!\n\nYou can also change the overall size of the box by\
    \ setting its width or height. Elements that are used to contain individual words\
    \ or short phrases such as **em** or **strong** are called **inline elements**.\
    \ For inline elements, the box fits around the word or phrase. Elements that are\
    \ used to contain whole paragraphs are known as **block elements**. For block\
    \ elements, the box normally stretches across the whole width of the page.\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_59_1.png)\n\nThese **boxes** have been\
    \ drawn around **inline** elements.\n\n+   - This box has been drawn around a\
    \ block element.\n\nThe following tables show you which common elements are normally\
    \ block elements and which are normally inline:\n\nWe say “normally” inline or\
    \ “normally” block because you can change this in the stylesheet if required.\
    \ We did this earlier in step 8 of our menu formatting example (see page 38) when\
    \ we changed the **li** elements inside the menu so that they appeared side by\
    \ side rather than one above the other. We did this by setting the **display**\
    \ property to **inline** like this:\n\n| INLINE | BLOCK |\n|---|---|\n| a | h1\
    \ to h6 |\n| em | p |\n| strong | ul, ol |\n|  | li |\n\n```\nnav li {\n  display:\
    \ inline;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 60
  md: '# <A GUITAR TUNER FOR THE SITE>


    # EMBEDDING A SCRATCH PROJECT


    After realizing how easy it was to embed videos and maps, Holly wondered if she
    could embed a guitar tuner into the site. But where would she get one from? Then
    she remembered that her sister had been learning to make games at CoderDojo using
    the Scratch programming language. She went to the Scratch site and searched for
    “guitar tuner”. There were loads.


    She found one she liked but couldn''t see any embed option! Fortunately, her sister
    came to the rescue – Holly had to log in to the Scratch site before the Embed
    button appeared in the information bar at the bottom of the game. The guitar tuner
    she liked best had the following embed code:


    ```

    ```html

    <iframe allowtransparency="true"

    width="485" height="402" src="//scratch.mit.edu/projects/

    embed/16403918/?autostart=false"

    frameborder="0" allowfullscreen></iframe>

    ```

    ```


    Note that the tuner will only show up if your web page is online. For more information
    on how you get a page online, see page 90.


    ![](img/52e45ce976f775dd17fd84d91912f770_60_0.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_60_1.png)


    # WORDS TO REMEMBER


    ![](img/52e45ce976f775dd17fd84d91912f770_60_2.png)


    **iframe** — you may have noticed that both the YouTube video and the Google map
    also use the `iframe` element. An iframe allows you to embed content from another
    site inside your web page. You specify where to find the content by entering a
    URL inside the iframe’s `src` attribute.'
  merge: -1
  img_proc: true
- pgno: 61
  md: "# # &lt;JAVASCRIPT&gt;\n\n![](img/52e45ce976f775dd17fd84d91912f770_61_0.png)\n\
    \nWhen you're developing your website, sooner or later you'll encounter **JavaScript**.\
    \ **JavaScript** is a programming language that lets you add all kinds of special\
    \ effects and features to your pages. Things like games, charts, and animations.\
    \ We don't have enough space in this book to show you all the things that **JavaScript**\
    \ can do, but here is an example to give you an idea of the sort of things you\
    \ can do. We'll use a simple function that swaps one image for another.\n\nThe\
    \ JavaScript behind the image swapper is embedded inside a page. It's called embedded\
    \ because the actual JavaScript is in the body of the page inside the **script**\
    \ element. (You can also put the JavaScript into a separate file if you like.\
    \ See scholastic.com/coder-dojo/javascript for more information about this and\
    \ about JavaScript in general.)\n\n```\n    <!DOCTYPE HTML>\n    <html>\n    <head>\n\
    \    <link type=\"text/css\" rel=\"stylesheet\" href=\"css/full-style.css\"/>\n\
    \    </head>\n    <body>\n    <p>\n    <img id=\"display-image\" onclick=\"swapImage()\"\
    \ src=\"images/01.png\" width=\"180\"\n    height=\"180\"/>\n    </p>\n    <p>Click\
    \ the image to change it!</p>\n    <script>\n    function swapImage() {\n    var\
    \ imageDisplayed = document.getElementById('display-image');\n    if (imageDisplayed.src.match(\"\
    images/01.png\")) {\n    imageDisplayed.src = \"images/02.png\";\n    }\n    else\
    \ {\n    imageDisplayed.src = \"images/01.png\";\n    }\n    }\n    </script>\n\
    \    </body>\n    </html>\n```\n\nIf we look at the code above we can see that\
    \ the **img** element has an attribute named **onclick** with a value of **swapImage()**."
  merge: -1
  img_proc: true
- pgno: 62
  md: "![](img/52e45ce976f775dd17fd84d91912f770_62_0.png)\n\nThe purpose of the `onclick`\
    \ attribute is to contain the name of a function that will be called when the\
    \ image is clicked. Function is the name we give to some code that performs a\
    \ useful task. In this case the `swapImage()` function is contained inside the\
    \ `script` element. The function begins a series of processes that happen like\
    \ this:\n\n+   1. When the image is clicked the `swapImage()` function runs.\n\
    \n```\n```html\n<img id=\"display-image\" onclick=\"swapImage()\" src=\"images/01.png\"\
    \ width=\"180\" height=\"180\">\n```\n```\n\n+   2. This makes the image (identified\
    \ by its `id` of `display-image`) available to the script as a variable (`var`)\
    \ with a name of `imageDisplayed`. (The `id` attribute allows you to give a unique\
    \ identifying name to an element.)\n\n```\n```javascript\nvar imageDisplayed =\
    \ document.getElementById('display-image');\n```\n```\n\n+   3. If the source\
    \ (`src`) of the `imageDisplayed` variable is currently set to `images/01.png`,\
    \ then the function changes it to `images/02.png`.\n\n```\n```javascript\nif (imageDisplayed.src.match(\"\
    images/01.png\")) {\n    imageDisplayed.src = \"images/02.png\";\n}\n```\n```\n\
    \n+   4. However, if the source (`src`) of the `imageDisplayed` variable is currently\
    \ set to `images/02.png`, it will change it to `images/01.png`.\n\n```\n```javascript\n\
    else {\n    imageDisplayed.src = \"images/01.png\";\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 63
  md: '# <ORGANIZING YOUR PAGES>


    So far we''ve looked at HTML elements that are used to mark up our text – to organize
    it into headings, paragraphs, lists, and tables. But many web pages have lots
    of different topics on a single page: Let''s imagine that the Nanonauts want to
    make their About Us page more interesting.


    ![](img/52e45ce976f775dd17fd84d91912f770_63_0.png)


    They''ve decided that they want to have:


    +   - a short feature about each Nanonaut

    +   - an ad for their new CD

    +   - an ad for a new Nanonauts T-shirt

    +   - details of their next concert


    They imagine the page layout might look something like this:


    ![](img/52e45ce976f775dd17fd84d91912f770_63_1.png)


    To make it easier for the Nanonauts to organize their page, they can use HTML''s
    structural elements. Structural elements allow you to divide up your page so that
    it''s easy to see where one topic begins and another ends. Some of the most commonly
    used of these structural elements are **header**, **nav**, **article**, **section**,
    **aside**, and **footer**.


    Using these elements makes it easier to organize your code and also helps to give
    you more control over how the page appears.


    ![](img/52e45ce976f775dd17fd84d91912f770_63_2.png)'
  merge: -1
  img_proc: true
