- pgno: 32
  md: "# # <LINK THE PAGES WITH A MENU>\n\nAlthough the Nanonauts site now has four\
    \ pages, there isn't an easy way to go from one page to another unless you start\
    \ from the home page (`index.html`). So we're going to add links to all the pages\
    \ we created. This will allow us to go from one page to another no matter where\
    \ we are in the site. Right now, the only links we have are on the `index.html`\
    \ home page. To do this we'll open up the `index.html` file, copy the HTML code\
    \ for the links, and then paste it into the other files (`about-us.html`, `our-songs.html`,\
    \ and so on). We'll also add a link back to the home page.\n\n# ## TO COPY THE\
    \ LINKS\n\n```\n```html\n<body>\n<h1>We are the Nanonauts!</h1>\n<p>This is our\
    \ website. Click on a link to visit\na page:</p>\n<li><a href=\"about-us.html\"\
    >About Us</a></li>\n<li><a href=\"our-songs.html\">Our Songs</a></li>\n<li><a\
    \ href=\"see-us-play.html\">See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\"\
    >Playing a\nConcert</a></li>\n</ul>\n</body>\n```\n```\n\n+   1. Open `index.html`\
    \ in the code editor and select the HTML code for the links. This code is highlighted.\n\
    +   \n+   To select the code for the links:\n+   - Click just before the `ul`\
    \ opening tag. Keep the mouse or touchpad button pressed down and then drag down,\
    \ highlighting the text as you go.\n+   - Take your finger off the button when\
    \ you get to the `ul` closing tag.\n+   - When the links are selected, check that\
    \ you've included ALL of the start and end tags for the `ul` element.\n\n# ##\
    \ CORRECT\n\n```\n```html\n<ul>\n<li><a href=\"about-us.html\">About Us</a></li>\n\
    <li><a href=\"our-songs.html\">Our Songs</a></li>\n<li><a href=\"see-us-play.html\"\
    >See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\">Playing a Concert</a></li>\n\
    </ul>\n```\n```\n\n![](img/52e45ce976f775dd17fd84d91912f770_32_0.png)\n\n# ##\
    \ INCORRECT\n\n```\n```html\n<ul>\n<li><a href=\"about-us.html\">About Us</a></li>\n\
    <li><a href=\"our-songs.html\">Our Songs</a></li>\n<li><a href=\"see-us-play.html\"\
    >See Us Play</a></li>\n<li><a href=\"playing-a-concert.html\">Playing a\nConcert</a></li>\n\
    </ul>\n```\n```\n\n+   2. Copy the links into memory. You can use a keyboard shortcut\
    \ to do this — such as `Ctrl-C` for Windows and Linux systems or `⌘-C` for Macs.\
    \ Open one of the web pages you made earlier in the editor (in the example on\
    \ the next page, we'll use the Playing a Concert page)."
  merge: -1
  img_proc: true
- pgno: 33
  md: '3. Click just before the **h1** opening tag and paste in the links. Add in
    a link to the home page too. After you''ve pasted the links add a **<nav>** opening
    tag before the opening **<ul>** tag, and a **</nav>** closing tag after the closing
    **</ul>** element. This puts our list of links inside a **nav** (short for navigation)
    element. This makes it clear that this list is special - a list of menu links,
    rather than a list within a story on a page.


    ```

