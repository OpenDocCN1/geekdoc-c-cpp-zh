  md: '+   9. Our page is just about finished. But lastly, we need to substitute the
    correct background colors for the structural elements and add the fancy page background
    into the **html** element. The color rules are removed from the **header**, **aside**,
    and **footer** elements, so they are the same color as the **body**. The final
    stylesheet looks like this:


