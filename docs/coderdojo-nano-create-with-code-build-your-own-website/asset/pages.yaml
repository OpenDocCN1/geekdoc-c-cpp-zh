- pgno: 19
  md: '# # HEADINGS, PARAGRAPHS, AND LISTS


    The Nanonauts had lots of ideas for what to put on their Playing a Concert page:


    > “You need a list of the songs you’ll be playing, in case you forget what you’re
    supposed to be doing next!” said Holly.


    > “Don’t forget what you’ve already read about what you need to play your songs
    or instruments,” said Dave.


    > “Set up drums on the stage first,” said Sam. “That’s my tip. If you leave them
    till last, there might not be enough room for them.”


    > “Make sure you know where you’re going,” said Daniel. “We were late for Bob’s
    birthday gig because we couldn’t find the house.”


    In fact, they had so many ideas that when they put them all on the page it started
    to look a little confusing:


    # ## Playing a Concert


    Playing a concert can be great fun! Or it can be totally scary! Sometimes both
    at the same time. So we’ve put together a list of our top tips for great concerts.


    Write out a set-list. A set-list is a list of all your songs in the order you’ll
    play them. Make copies for everyone. Print it big so that you can still read it
    if it’s down by your feet on the floor, or if the lighting isn’t very good.


    Remember your spares. Some instruments have parts that need to be replaced if
    they wear out or break. For example: guitar strings, saxophone or clarinet reeds,
    and drumsticks. Make a list of the spares you might need and make sure you know
    where they are in an emergency.


    Plan where you’ll be on the stage. Before you start to set up your instruments,
    take a few minutes to decide where you are all going to be. Will the drums be
    center stage? Or off to one side? Is there a power socket for the amplifier if
    your guitar player stands on the right?


    It’s much better to think about all this before you start setting up your instruments.
    It’s really annoying if you have to start unplugging things and swapping places
    once you’ve begun to set things up! Know where you’re going, know when you’re
    on. If you’re playing a concert somewhere you’ve never been before make sure you
    know where it is. Print out a map or set the GPS before you leave. There’s nothing
    worse than being lost in an unfamiliar place a half hour before you’re due to
    go on stage. And when you do arrive, the first thing you should do is find out
    what time you’re on. Times often change. Ask whoever is running the event when
    you’ll be on. Don’t get caught off guard!


    ![](img/52e45ce976f775dd17fd84d91912f770_19_0.png)


    How could they fix it? We’ve already seen quite a few different HTML elements.
    For example:


    +   - `h1` is a heading

    +   - `ul` is a list with bullet points

    +   - `ol` is a numbered list

    +   - `p` is a paragraph'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'By using these elements and mixing in a few new ones the Hanonauts made their
    page much easier to read. Like this, in fact:


    # # Playing a Concert


    Playing a concert can be great fun! Or it can be totally scary! Sometimes both
    at the same time.


    So you''ve got together a list of our top tips for great concerts.


    # ## Write out a set-list


    A set-list is a list of all your songs in the order you''ll play them.


    # ### Make copies for everyone


    Print it off so that you can see and read it if it''s down by your feet on the
    floor or if the lighting isn''t very good.


    # ## Remember your spares


    Some instruments have parts that need to be replaced if they wear out or break.
    For example:


    +   - guitar strings

    +   - saxophone or clarinet reeds

    +   - drumsticks


    Make a list of the spares you might need and make sure you know where they are
    in an emergency.


    # ## Plan where you''ll be on the stage


    Before you start to set up your instruments, take a few minutes to decide where
    you''re all going to be.


    +   - Will the drums be centre stage? Or off to one side?

    +   - Is there a power socket for the amplifier if your guitar player stands on
    the right?


    It''s much better to think about all this before you start setting up your instruments.
    It''s really annoying if you have to start unplugging things and swapping places
    once you''ve begun to set things up!


    # ## Know where you''re going, know when you''re on


    If you''re playing a concert somewhere you''ve never been before make sure you
    know where it is. Print out a map or get the GPS before you leave. There''s nothing
    worse than being lost in an unfamiliar place a half hour before you''re due to
    go onstage.


    And when you do arrive, the first thing you should do is find out what time you''re
    on. Times often change. Ask whoever is running the event when you''ll be on. Don''t
    get caught off guard!


    # So how did they do it?


    > 1) They used headings to divide up the page


    > 2) They used bulleted lists to make it easier to read


    > 3) They split up large blocks of text into shorter paragraphs


    > 4) They emphasised some words using the strong element


    The way in which you put together your HTML elements is known as **markup**. Markup
    is a word programmers use a lot. Good programming is all about using the different
    elements to make your page easy to read.


    ![](img/52e45ce976f775dd17fd84d91912f770_20_0.png)'
