- pgno: 79
  md: "**5.** We styled our menu earlier. We can simply drop those styles into our\
    \ current stylesheet to get ourselves a nice-looking menu. Add these rules in\
    \ one line at a time and see the effects.\n\n![](img/52e45ce976f775dd17fd84d91912f770_79_0.png)\n\
    \n```\n```css\nnav ul {\n  list-style-type: none;\n  background-color: #C5A?B8;\n\
    \  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family: sans-serif;\n\
    \  font-weight: bold;\n  padding: 16px;\n}\nnav ul li {\n  display: inline;\n\
    \  border-right: 2px solid #111111;\n  padding-right: 8px;\n  padding-left: 8px;\n\
    }\nnav ul li:last-child {\n  border-right: none;\n}\nnav ul li a {\n  text-decoration:\
    \ none;\n  color: #111111;\n}\nnav ul li a:hover {\n  text-decoration: underline;\n\
    }\n```\n```\n\n**6.** Next, we can neaten up our header (the element at the top\
    \ of the page) and footer (the element at the bottom of the page) by using a combination\
    \ of the `float: left` rule and `text-align: right`. Again, add these rules in\
    \ one at a time to see the effect they have and how they work together. Notice\
    \ that we are using contextual selectors to identify all the elements:\n\n+  \
    \ - `header p` means “any `p` element inside the `header` element”\n+   - `header\
    \ h1` means “any `h1` element inside the `header` element”\n+   - `footer p.copyright`\
    \ means “any `p` element with a class of `copyright` inside the `footer` element”\n\
    +   - `footer p.contact` means “any `p` element with a class of `contact` inside\
    \ the `footer` element”"
  merge: -1
  img_proc: true
- pgno: 80
  md: "```\n    header p {\n      float: left;\n      font-size: 16px;\n      font-weight:\
    \ bold;\n      margin-top: 0px;\n    }\n\n    header h1 {\n      font-size: 16px;\n\
    \      text-align: right;\n    }\n\n    footer p.copyright {\n      float: left;\n\
    \      margin-top: 0px;\n    }\n\n    footer p.contact {\n      text-align: right;\n\
    \    }\n```\n\n+   7. We’d now like to give the rounded borders to the body, section,\
    \ and image elements. To do this we create a single rule that applies it to all\
    \ the elements at one time. It looks like this:\n\n```\n    body, section, img\
    \ {\n      border: 2px solid Gray;\n      border-radius: 16px;\n    }\n```\n\n\
    Notice the commas between the element names! Take the commas away and the elements\
    \ to which the rule applies are completely different:\n\n```\n    body, section\n\
    ```\n\nmeans \"apply this rule to **body** elements and **section** elements and\
    \ **image** elements\"\n\n```\n    body section img\n```\n\nmeans \"apply this\
    \ rule to **img** elements, which are inside **section** elements, which are in\
    \ turn, inside **body** elements\"\n\n![](img/52e45ce976f775dd17fd84d91912f770_80_0.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_80_1.png)"
  merge: -1
  img_proc: true
- pgno: 81
  md: "**8.** Now for the really interesting part. At the moment, all of our structural\
    \ elements are arranged one on top of the other, rather like a long ladder of\
    \ elements. Try resizing your browser window to see what happens. Basically, the\
    \ line length stretches, up to a maximum width of 1024px and then after that the\
    \ right and left margins fill the window. But if we have a decent width available\
    \ we could show the **aside** element to the right of the **article** element.\n\
    \nTo do this we need to write a CSS rule that says: “When the screen is above\
    \ a certain width, show the **article** and **aside** elements side by side.”\
    \ We do this using a special type of rule called a **media query**. This is our\
    \ media query:\n\n```\n```css\n@media all and (min-width: 900px)\n{\n```\n\n```\n\
    \nIt begins with a statement that says when the query will be applied. **@media\
    \ all and (min-width: 900px)**. We can break this short example down:\n\n![](img/52e45ce976f775dd17fd84d91912f770_81_0.png)\n\
    \n| 规则 | 含义 |\n|---|---|\n| `@media` | This is a media query! |\n| `all` | Applies\
    \ to both the screen and (when printed pages (we could say “print,” if it only\
    \ applied to printed versions of the page, or “screen” to refer to on-screen versions)\
    \ |\n| `and` | Connects the two. |\n| `(min-width: 900px)` | This query will come\
    \ into effect only when the browser window is wider than 900px. |\n\nNotice that\
    \ these three rules go inside the curly brackets of the media query. That's why\
    \ the last rule has two brackets after it.\n\n```\n```css\n@media all and (min-width:\
    \ 900px) {\n  article {\n    float: left;\n    width: 66%;\n  }\n  aside {\n \
    \   float: left;\n    padding-left: 24px;\n    width: 34%;\n  }\n  footer {\n\
    \    clear: both;\n  }\n}\n```\n```\n\nWhat these rules do is use the **float**\
    \ property to position the **article** and the **aside** elements next to one\
    \ another. By applying floats to both elements and then making their combined\
    \ widths equal to 100% (66% for the article and 34% for the aside) we make them\
    \ appear side by side when the window reaches 900 pixels in width. We add some\
    \ padding to the left of the aside so that the borders don't bump up against each\
    \ other when this happens.\n\nFinally we add a **clear: both** rule to the footer\
    \ element. This ends the floating elements and ensures that the footer appears\
    \ in its normal position. If you don't add this rule, the footer floats to the\
    \ right of the article – not the effect we're looking for!"
  merge: -1
  img_proc: true
- pgno: 82
  md: "![](img/52e45ce976f775dd17fd84d91912f770_82_0.png)\n\n# THE RESULT!\n\nYou\
    \ can easily swap the position of the article and aside elements, so that the\
    \ aside appears on the left. To do this just replace it with `float: right` in\
    \ the query. Like this:\n\n```\n```css\n@media all and (min-width: 900px) {\n\
    \  article {\n    float: right;\n    width: 65%;\n  }\n  aside {\n    float: right;\n\
    \    padding-right: 24px;\n    width: 34%;\n  }\n  footer {\n    clear: both;\n\
    \  }\n}\n```\n```\n\n# THINGS TO DO NEXT\n\nTry to add a media query that makes\
    \ the font smaller when the width is below 480px.\n\n![](img/52e45ce976f775dd17fd84d91912f770_82_1.png)\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_82_2.png)\n\n# Meet the content\n\n\
    A sample responsive webpage layout.\n\n# Daniels - Singer extraordinaire\n\nA\
