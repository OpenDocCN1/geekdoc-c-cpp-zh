  md: '# # <FONTS>


    One of the best ways to change a page''s appearance is to change the font. A font
    is a particular style of text. The fonts you choose for your page can have a huge
    effect on how the page appears.


    If you want to pick a particular font, then you''ll need to use a **web font**.
    A web font is a special type of font that is downloaded along with the stylesheet.
    Using a web font gives you more control than using a general name like **sans-serif**
    or **monospace**.


    For example, if you choose monospace, then the font that is used is different
    in Firefox and Chrome. However, if you choose a web font, then it should appear
    the same in any up-to-date browser.


    The easiest way to use a web font is to choose one from the Google Fonts page
    at https://www.google.com/fonts. Here you''ll see a long list of fonts that you
    can choose from. Definitely more exciting than the boring default ones!


    ![](img/52e45ce976f775dd17fd84d91912f770_87_0.png)


    # ## NINJA TIP


    > > You must be online for web fonts to work. If you are looking at your web page
    but you don''t have an internet connection you won''t see the web fonts.


    ![](img/52e45ce976f775dd17fd84d91912f770_87_1.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: "Once you've found the font you're looking for, click the Quick Use icon.\n\n\
    The Quick Use page opens. In step 1 you can choose different styles, and in step\
    \ 2, you can pick the characters that you'll need. This page gives you the information\
    \ you'll need to add the web font to your site.\n\n![](img/52e45ce976f775dd17fd84d91912f770_88_0.png)\n\
    \n+   1. Choose the styles you want:\n+      - PT Sans Narrow\n+        - Regular\n\
    +        - Bold\n\nOn this page, Step 3 and Step 4 are both very important! At\
    \ Step 3 you'll see three tabs named “Standard”, “@import,” and “Javascript.”\
    \ Click the “@import” tab. The code shown on the @import tab is the code that\
    \ you'll need to add to your stylesheet. It will look something like this:\n\n\
    +   Standard · @import · Javascript\n\n3. Add this code to your website:\n\n```\n\
    ```css\n@import url(http://fonts.googleapis.com/css?family=PT+Sans+Narrow);\n\
    ```\n```\n\nThis line imports the font and makes it available for use in the stylesheet.\
    \ You should add it as the first line in the stylesheet like this.\n\nIn the example\
    \ above the @import statement will make a font called PT Sans Narrow available.\
    \ But that's all—we haven't actually used the font anywhere. To do this we need\
    \ to use the font in a rule within the stylesheet. That's where Step 4 comes in!\n\
    \nStep 4 tells us how to refer to the font in our stylesheet. It gives us a simple\
    \ example of a declaration, something like the one below:\n\n```\n```css\nfont-family:\
    \ \"PT Sans Narrow\",\nsans-serif;\n```\n```\n\n```\n```css\n@import url(http://fonts.googleapis.com/\n\
    css?family=PT+Sans+Narrow);\nbody {\n  /* set sizing to border box method */\n\
    }\nhtml {\n  box-sizing: border-box;\n}\n*, *:before, *:after {\n  box-sizing:\
    \ inherit;\n}\n/* set maximum and minimum widths for the\nbody and center within\
    \ the viewport */\nbody {\n  font-family: sans-serif;\n  margin-left: auto;\n\
    \  margin-right: auto;\n  max-width: 1024px;\n  min-width: 256px;\n  padding-top:\
    \ 8px;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: '# # <PUTTING YOUR SITE ON THE WEB>


    So far you made a website that can only be seen on your own computer. But the
    whole point of a web page is that it''s ... well ... on the web.


    To do this you need to do two things:


    +   - register a **domain name** (such as www.nanonauts.com)

    +   - copy your site to a **web server** linked to the domain


    ![](img/52e45ce976f775dd17fd84d91912f770_89_0.png)


    Then, when some one types your domain name into a web browser they are sent to
    the web server. A web server is just a computer that has been connected to the
    Internet and has been set up to send web pages to a computing device (phone, tablet,
    laptop, and so on) that requests them.


    Although setting all this up may sound a little complicated, it''s actually made
    pretty easy because you can buy a **hosting package** from an Internet service
    provider (ISP). A hosting package lets you rent some space on a web server for
    a small fee per month. Then, once you''ve chosen your package, all you need to
    do is pick your domain name and copy across your web pages. You do this using
    an **FTP program**.


    # ## USING AN FTP PROGRAM


    An FTP, or "file transfer protocol," program simply allows you to copy files between
    two computers that are connected to the Internet. If you''re copying files from
    your computer to the web server this is called **uploading**. If you''re copying
    them from the web server to your computer, often referred to as the **local machine**,
    this is called **downloading**. You''re probably already familiar with downloading.
    Well, this is your chance to do some uploading for a change! So how do you do
    it?


    Once you''ve purchased your hosting package, you''ll need to download and install
    an FTP program. A good free program is Filezilla, which you can find at https://filezilla-project.org.
    Next you''ll need the **IP address** of your web server and a username and password.
    You normally get this information from the Internet service provider when you
    purchase a hosting package. The IP address is a long number divided into four
    parts by periods - for example, **66.175.209.200** - which allows the FTP program
    to find your web server.


    ![](img/52e45ce976f775dd17fd84d91912f770_89_1.png)


    # ### NINJA TIP


    > > URLs such as www.nanonauts.com are simply more user-friendly versions of IP
    addresses. In fact, a URL simply tells a web browser to get files from a computer
    with a particular IP address.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Once you have the information you can start your FTP program and enter details
    of the computer you want to connect to. This is known as the "host." In FileZilla
    you do the following:


    +   1. Choose File > Site Manager and click the New Site button.

    +   2. In the left-hand window, give the site a name such as Nanonauts.

    +   3. Enter the IP address of the server in the Host box.

    +   4. If the service provider gave you a port number, you can enter this in the
    Port field. Usually you would leave this empty.

    +   5. Change the logon type from Anonymous to Normal.

    +   6. Enter the username and password.

    +   7. Click Connect. After a second or two you should see details of the web
    server appear in the right-hand pane. When you connect to the web server it''s
    important that you upload your files to the correct folder. This folder is known
    as the **web root**. The web root folder should always contain your **index.html**
    file and a copy of all the files and folders used to create your site on your
    local machine.

    +   8. In the left-hand pane of FileZilla, copy across all the files in your local
    copy of the website to the webroot folder.

    +   9. Select all the files and drag them across into the web root folder.


    ![](img/52e45ce976f775dd17fd84d91912f770_90_0.png)


    # NINJA TIP


    The name of the web root folder may vary from one hosting package to another.
    Common names include:


    +   * www

    +   * wwwroot

    +   * httpdocs

    +   * public_html

    +   * html

    +   * public

    +   * web


    # YOU''RE DONE!


    Go to your web browser and type in the web address of your site. If all has gone
    well you should see your website! Congratulations, you now have your own site
    up and running on the web! Let your friends and family know!


    ![](img/52e45ce976f775dd17fd84d91912f770_90_1.png)


    ![](img/52e45ce976f775dd17fd84d91912f770_90_2.png)'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # <CODE REFERENCE>


    As we''ve built our web pages we''ve been using a number of HTML elements. The
    table below contains a list of these elements. Mix-and-match as you need to build
    your pages!


    | Element | Meaning |

    |---|---|

    | `a` | A link. You put the page you want to link to in the `href` attribute.
    |

    | `body` | The part of a web page that you can see in the browser. |

    | `em` | Allows you to make important words or phrases stand out by appearing
    in sloping italic text. |

    | `h1` | A major heading – usually used for the page’s main title. |

    | `h2` | A secondary heading – used to divide up a long page into individual topics.
    |

    | `h3` | A minor heading – used to divide long topics up into smaller chunks.
    |

    | `head` | Contains information that the browser uses when figuring out how the
    page should be displayed. |


    | Element | Meaning |

    |---|---|

    | `html` | All of your web page must be inside a `html` element. A page can only
    have a single `html` element. The `html` element always contains a single `head`
    element followed by a single `body` element. |

    | `iframe` | An `iframe` allows you to embed content from another site, such as
    YouTube or Google Maps, inside your web page. You say where to find the content
    by entering a URL inside the iframe''s `src` attribute. |

    | `img` | Allows you to display an image or picture. It’s a good idea to give
    your image a `class` attribute with a value such as large, medium, or small and
    then use the CSS to control the size of the image. The `src` attribute is used
    to locate the image. |

    | `li` | An individual item in a list. `li` elements can occur inside `ul` and
    `ol` elements. |

    | `link` | Provides the link to the CSS stylesheet that will be used to format
    the web page. The address of the stylesheet goes in the `href` attribute. |


