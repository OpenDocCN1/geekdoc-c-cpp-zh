- pgno: 34
  md: "# # ‹ADDING A MENU›\n\nHaving a list of links at the top of the page looks\
    \ a little weird. But most sites would arrange these links in a menu bar—which\
    \ would look something like this.\n\n+   [Home] | [About Us] | [Our Songs] | [See\
    \ Us Play] | [Playing a Concert]\n\nBut guess what? Just by using CSS we can turn\
    \ the list of links into a menu. There's no need to change the HTML code at all.\
    \ We'll do it by adding the following code to the stylesheet.\n\n![](img/52e45ce976f775dd17fd84d91912f770_34_0.png)\n\
    \nThis turns the links from a list into a menu bar:\n\n```\n```css\nnav ul {\n\
    \  list-style-type: none;\n  background-color: #B577B5;\n  border: 4px solid #111111;\n\
    \  border-radius: 10px;\n  font-family: sans-serif;\n  font-weight: bold;\n  padding:\
    \ 16px;\n}\nnav ul li {\n  display: inline;\n  border-right: 2px solid #111111;\n\
    \  padding-right: 8px;\n  padding-left: 8px;\n}\nnav ul li:last-child {\n  border-right:\
    \ none;\n}\nnav ul li a {\n  text-decoration: none;\n  color: #111111;\n}\n```\n\
    ```\n\n+   - [Home]\n+   - [About Us]\n+   - [Our Songs]\n+   - [See Us Play]\n\
    +   - [Playing a Concert]\n\n+   [Home] | [About Us] | [Our Songs] | [See Us Play]\
    \ | [Playing a Concert]\n\n# ## MORE COMPLEX RULES!\n\nIn our previous example\
    \ our rules just had a single element name outside the curly brackets. For example,\
    \ here are three declarations which set the color, font family, and font size\
    \ for a single h1 element.\n\n```\n```css\nh1 {\n  color: #111111;\n  font-family:\
    \ sans-serif;\n  font-size: 32px;\n}\n```\n```\n\n```\n```css\nnav ul li {\n \
    \ display: inline;\n  border-right: 2px solid #111111;\n  padding-right: 8px;\n\
    }\n```\n```\n\nBut in the menu example the elements outside the curly brackets\
    \ get a little more complicated. Instead of just a single element name, we see\
    \ several element names, separated by spaces. Think of it as an address. This\
    \ example applies to every li that is inside a ul that is inside a nav element."
  merge: -1
  img_proc: true
- pgno: 35
  md: "So the rules would be applied only to list items that were inside `nav` elements\
    \ – not “ordinary” lists. To see the effect of each declaration, we’ll follow\
    \ the same method described in the tip on page 28, by adding the empty rules and\
    \ then adding in the declarations one at a time. If you add in the declarations\
    \ in the order described below it will help you to understand how the stylesheet\
    \ works.\n\n# **1.**\n\n```\nnav ul {\n  list-style-type: none;\n}\nnav ul li\
    \ {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n\nRemoves the bullet\
    \ points from lists inside `nav` elements. You can change the appearance of the\
    \ bullet point or remove it completely using the `list-style-type` declaration.\n\
    \n+   - `list-style-type: none;` removes the bullet point\n+   - `list-style-type:\
    \ square;` changes them to squares.\n\n![](img/52e45ce976f775dd17fd84d91912f770_35_0.png)\n\
    \n# **2.**\n\n```\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    }\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n\nChanges\
    \ the background color of the list (the `ul` element) to a darker purple (`#B577B5`\
    \ is the hexadecimal value for this color).\n\n![](img/52e45ce976f775dd17fd84d91912f770_35_1.png)\n\
    \n# **3.**\n\n```\nnav ul {\n  list-style-type: none;\n  background-color: #B577B5;\n\
    \  border: 4px solid #111111;\n}\nnav ul li {\n}\nnav ul li:last-child {\n}\n\
    nav ul li a {\n}\n```\n\nAdds a 4-pixel-wide border to the list. The border is\
    \ solid, rather than dotted or dashed, and is a solid black (`#111111` is the\
    \ hexadecimal value for this color). Try changing:\n\n+   - the pixel width of\
    \ the border\n+   - the border style from **solid** to **dotted** or **dashed**\n\
    +   - the hexadecimal value to one you choose from an online color picker (see\
    \ page 31).\n\n![](img/52e45ce976f775dd17fd84d91912f770_35_2.png)"
  merge: -1
  img_proc: true
- pgno: 36
  md: "# 4.\n\n```\n```css\nnav ul {\n  list-style-type: none;\n  background-color:\
    \ #B577B5;\n  border: 4px solid #111111;\n  border-radius: 10px;\n}\nnav ul li\
    \ {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n```\n```\n\nAdds curved corners\
    \ to the border. Try changing the **border-radius** value to see what it does.\
    \ Try:\n\n+   - 5px\n+   - 20px\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_0.png)\n\
    \n# 5.\n\n```\n```css\nnav ul {\n  list-style-type: none;\n  background-color:\
    \ #B577B5;\n  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family:\
    \ sans-serif;\n}\nnav ul li {\n}\nnav ul li:last-child {\n}\nnav ul li a {\n}\n\
    ```\n```\n\nMakes sure the font is sans-serif. If you don't specify the **font-family**,\
    \ it will display in the browser's default font. Try changing it to *cursive*\
    \ or *fantasy* to see what they do.\n\n![](img/52e45ce976f775dd17fd84d91912f770_36_1.png)\n\
    \n# 6.\n\n```\n```css\nnav ul {\n  list-style-type: none;\n  background-color:\
    \ #B577B5;\n  border: 4px solid #111111;\n  border-radius: 10px;\n  font-family:\
    \ sans-serif;\n  font-weight: bold;\n}\nnav ul li {\n}\nnav ul li:last-child {\n\
    }\nnav ul li a {\n}\n```\n```\n\nMakes the font heavier and darker looking\n\n\
    ![](img/52e45ce976f775dd17fd84d91912f770_36_2.png)"
