    4. Save the file and then open it in your browser. You can see that the links
    appear above the **h1** element. They look a little strange, however, it would
    be better if they ran across the top in a row like the top menu bar you see on
    most websites.


    # THINGS TO DO NEXT


    First of all, try to change two things.


    +   - Add a link to the home page above the About Us link.

    +   - Then copy the full set of links to all the other pages (except the home
    page because it already has them).


    Put the links in the same place before the **h1** element. So all your pages should
