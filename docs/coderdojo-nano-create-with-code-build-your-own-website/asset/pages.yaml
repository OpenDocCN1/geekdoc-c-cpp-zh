- pgno: 52
  md: "# ‹A STYLISH TABLE!›\n\n![](img/52e45ce976f775dd17fd84d91912f770_52_0.png)\n\
    \nTo make our jumbled-up table look more attractive we'll return to our CSS stylesheet.\
    \ Go through the steps below, adding one line at a time to the stylesheet and\
    \ clicking the refresh button on your web browser after each new line has been\
    \ added.\n\n+   1.\n\n```\ntable {\n  font-size:70%;\n\n  th, td {\n  }\n  th\
    \ {\n  }\n  td {\n  }\n}\n```\n\nMakes all the text inside the table smaller.\
    \ The value is entered as a percentage of the font size on the rest of the page.\n\
    \n![](img/52e45ce976f775dd17fd84d91912f770_52_1.png)\n\n+   2.\n\n```\ntable {\n\
    \  font-size:70%;\n  width:100%;\n\n  th, td {\n  }\n  th {\n  }\n  td {\n  }\n\
    }\n```\n\nMakes the table cover the full width of the body area.\n\n![](img/52e45ce976f775dd17fd84d91912f770_52_2.png)\n\
    \n+   3.\n\n```\ntable {\n  font-size:70%;\n  width:100%;\n  th, td {\n    border:1px\
    \ solid #000000;\n  }\n  th {\n  }\n  td {\n  }\n}\n```\n\nAdds a 1-pixel-wide,\
    \ solid, black border to each **th** and **td** element in the table. Notice that\
    \ each element has its own separate border. This is not the effect we're looking\
    \ for, so we'll fix that next. The first part of the rule is **th, td** which,\
    \ thanks to the comma between the element names, means “apply this rule to **th**\
    \ and **td** elements”.\n\n![](img/52e45ce976f775dd17fd84d91912f770_52_3.png)"
  merge: -1
  img_proc: true
- pgno: 53
  md: "```\n```css\ntable {\n  font-size: 70%;\n  border-collapse: collapse;\n  width:\
    \ 100%;\n}\nth, td {\n  border: 1px solid #000000;\n}\nth {\n}\ntd {\n}\n```\n\
    ```\n\nWe return to the table rule and set the **border-collapse** property to\
    \ **collapse**. This merges the borders of the individual cells, creating a nicer\
    \ visual effect.\n\n| Date | Place | Time | Price |\n|---|---|---|---|\n| Sunday,\
    \ June 12 | Theatre | 7:30 pm | $5.00 |\n| Wednesday, June 15 | College | 8:00\
    \ pm | Free! |\n| Saturday, July 10 | Bandstand | 11:00 am | Free! |\n| Sunday,\
    \ July 11 | Bandstand | 2:00 pm | Free! |\n| Sunday, August 28 | Theatre | 7:30\
    \ pm | $5.00 |\n\n```\n```css\ntable {\n  font-size: 70%;\n  border-collapse:\
    \ collapse;\n  width: 100%;\n}\nth, td {\n  border: 1px solid #000000;\n  padding:\
    \ 8px;\n}\nth {\n}\ntd {\n}\n```\n```\n\nNow we add some padding around the text\
    \ in the **th** and **td** elements. This makes the contents of the table easier\
    \ to read.\n\n| Date | Place | Time | Price |\n|---|---|---|---|\n| Sunday, June\
    \ 12 | Theatre | 7:30 pm | $5.00 |\n| Wednesday, June 15 | College | 8:00 pm |\
    \ Free! |\n| Saturday, July 10 | Bandstand | 11:00 am | Free! |\n| Sunday, July\
    \ 11 | Bandstand | 2:00 pm | Free! |\n| Sunday, August 28 | Theatre | 7:30 pm\
    \ | $5.00 |\n\n```\n```css\ntable {\n  font-size: 70%;\n  border-collapse: collapse;\n\
    \  width: 100%;\n}\nth, td {\n  border: 1px solid #000000;\n  padding: 8px;\n\
    \  text-align: left;\n}\nth {\n}\ntd {\n}\n```\n```\n\nThe header text looks unbalanced\
    \ centered, so we align it to the left.\n\n| Date | Place | Time | Price |\n|---|---|---|---|\n\
    | Sunday, June 12 | Theatre | 7:30 pm | $5.00 |\n| Wednesday, June 15 | College\
    \ | 8:00 pm | Free! |\n| Saturday, July 10 | Bandstand | 11:00 am | Free! |\n\
    | Sunday, July 11 | Bandstand | 2:00 pm | Free! |\n| Sunday, August 28 | Theatre\
    \ | 7:30 pm | $5.00 |"
  merge: -1
  img_proc: true
