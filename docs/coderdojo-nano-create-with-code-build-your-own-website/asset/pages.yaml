- pgno: 92
  md: '| Element | Meaning |

    | --- | --- |

    | `meta` | Provides information to the browser that it uses to display the page
    correctly. |

    | `ol` | An ordered list. Used to create numbered lists. Each individual list
    item should be inside an `li` element. |

    | `p` | A paragraph. Probably the most common element. If you want to create "special"
    types of paragraphs (such as Tips or Notes) you can do so by using a `class` attribute.
    |

    | `strong` | Allows you to make important words or phrases stand out by appearing
    in heavy bold text. |

    | `title` | The title of the page that the browser will display in the page tab.
    |

    | `ul` | An unordered list. Used to create bulleted lists and menus. Each individual
    list item should be inside an `li` element. |


    | Attribute | Meaning |

    | --- | --- |

    | `class` | Any element can have a class attribute. The class attribute allows
    you to pick out elements that have a special purpose and format them in a distinctive
    way in your CSS. |

    | `href` | Use within an `a` element to make a link. You put the address of the
    page you want to link to in the `href` attribute. Also used within the link element
    to identify the location of your CSS stylesheet. |

    | `id` | A unique identification for a particular element. A particular `id` value
    must only occur once on a page. |

    | `src` | Used within the `img` element to identify the source of the image (for
    example, `images/derula.jpg`). Images usually end with a `.jpg` or `.png` file
    extension. |


