    # NINJA TIP


    If you look at the Nanonauts'' page you can see that they''ve used the h2 heading
    element to chop up the text so that you, the reader, can easily find what you''re
    looking for. When you''re marking up a page you should use the h1 heading for
    the main title of the page and use h2 elements to provide a heading for each part
    of the page. You can have as many h2 elements as you need.


    # NINJA TIP


    Another thing the Nanonauts have done is divided each of the sections up into
    paragraphs. A paragraph is just one or more sentences of text contained inside
    a p element. Think of a paragraph as being a block of text about a single thought
    or idea. By splitting up your page into paragraphs you make it easier for readers
    to follow what you''re saying.


