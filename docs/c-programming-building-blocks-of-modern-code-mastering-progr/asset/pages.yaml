    # Understanding I/O Ports:


    In embedded systems, I/O ports serve as gateways for communication between the
    microcontroller and external devices. These ports consist of pins, each of which
    can be configured as an input or output. C enables direct manipulation of these
    ports, offering fine-grained control over the state of individual pins.


    ```

    #include <avr/io.h>


    // Function to initialize I/O port for output

    void initOutputPort() {

    // Set Port D Pin 5 as an output

    DDRD |= (1 << DDD5);

    }


    // Function to toggle the state of an output pin

    void toggleOutputPin() {

    // Toggle the state of Port D Pin 5

    PORTD ^= (1 << PORTD5);

    }

    ```


    This code snippet, designed for an AVR microcontroller, demonstrates the initialization
    of Port D Pin 5 as an output and the toggling of its state. The DDRD register
    configures the port as an output, while the PORTD register manipulates the state
    of the individual pin.


    # Bitwise Operations for Port Manipulation:


    C''s ability to perform bitwise operations is invaluable when working with I/O
    ports. Bitwise operations allow developers to set, clear, or toggle specific bits
    within a register without affecting the others.


    ```

    #include <avr/io.h>

    ```'
