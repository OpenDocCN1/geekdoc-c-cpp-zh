    # Loop Control Statements


    Within the "Loops in C" module of the book "C Programming: Building Blocks of
    Modern Code," the concept of loop control statements provide developers with powerful
    tools to manipulate the flow of execution within loops, adding flexibility and
    control to the iterative process.


    # The break Statement


    The break statement is a fundamental loop control mechanism, allowing developers
    to prematurely exit a loop based on a specified condition. This statement is especially
    useful in scenarios where a certain condition is met, and further iterations are
    unnecessary.


    ```

    // Example of using the break statement

    for (int i = 1; i <= 10; i++) {

    if (i == 5) {

    break; // Exit the loop when i reaches 5

    }

    printf("%d ", i);

    }

    ```


    In this example, the loop prints numbers from 1 to 10 but breaks out of the loop
    when i reaches 5. The break statement ensures that the loop terminates prematurely
    when the condition is satisfied.


    # The continue Statement


    While the break statement terminates the entire loop, the continue statement is
    used to skip the rest of the loop body for the current iteration and move on to
    the next iteration.


    ```

    // Example of using the continue statement

    for (int i = 1; i <= 5; i++) {

    if (i == 3) {

    continue; // Skip the rest of the loop body when i is 3

    }

    ```'
