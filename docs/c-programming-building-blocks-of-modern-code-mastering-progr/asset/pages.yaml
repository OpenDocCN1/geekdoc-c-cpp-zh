    # Ternary Operator


    The "Conditions and Decision Making" module within the book "C Programming: Building
    Blocks of Modern Code" introduces the ternary operator, a concise and powerful
    tool for making decisions within a single line of code. The ternary operator provides
    a compact alternative to the traditional if-else statements, especially useful
    when assigning values based on a given condition.


    # Syntax of the Ternary Operator


    The ternary operator has a simple syntax:


    ```

    condition ? expression_if_true : expression_if_false;

    ```


    It evaluates the condition, and if true, it returns the value of expression_if_true;
    otherwise, it returns the value of expression_if_false.


    ```

    int num = 7;

    printf("The number is %s.\n", (num % 2 == 0) ? "even" : "odd");

    ```'
