    \n// Function to check the state of an input pin\nint isButtonPressed() {\n  //\
    \ Check the state of Port B Pin 2\n  return (PINB & (1 << PINB2)) != 0;\n}\n```\n\
    \nHere, the isButtonPressed function checks which Port B Pin 2 is high, indicating\
    \ a pressed button. The PINB register is used to read the state of the input pin.\n\
    \n# Handling Multifunction Pins:\n\nMany microcontrollers have pins that can serve\
    \ multiple functions. C allows developers to configure these multifunction pins\
    \ for specific purposes, such as digital input or output, analog input, or specialized\
    \ communication protocols.\n\n```\n#include <avr/io.h>\n\n// Function to configure\
