    Code" introduces the do-while loop, a control structure that guarantees the execution
    of a block of code at least once, regardless of the initial condition. The do-while
    loop is particularly useful when the loop body should be executed before evaluating
    the loop condition.


    ```

    // Example of a simple do-while loop

    int i = 0;

    do{

    printf("Iteration %d\n", i);

    i++;

    } while (i < 5);

    ```


    In this example, the do-while loop prints the value of i during each iteration
    and continues to execute as long as i is less than 5. The crucial distinction
    is that the loop body is guaranteed to execute at least once.


    # Syntax of the do-while Loop


    The do-while loop''s syntax is distinct from the while and for loops. It starts
    with the do keyword, followed by the loop body enclosed in curly braces, and ends
    with the while keyword and the loop condition enclosed in parentheses.


    ```

    do{

    // Code to be executed at least once

    } while (condition);

    ```'
