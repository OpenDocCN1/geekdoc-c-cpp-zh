  md: '# J. Albert Mayan*, G. Swamy Reddy, G. Madhava Rao


    # 1 Optimizing the traffic flow in VANETs using deep quantum annealing


    **Abstract:** We have developed an optimization for the traffic flow in VANETs
    using deep quantum annealing. Deep quantum annealing is designed to maintain optimal
    traffic flow without congestion in smart cities. Careful considerations are made
    to improve the flow in a manner that is better than the conventional methods.
    Simulation is carried out to test the efficacy of deep quantum annealing in VANETs.
    The results show that the proposed method achieves higher rate of accuracy in
    maintaining the traffic flow than expected.


    # 1.1 Introduction


