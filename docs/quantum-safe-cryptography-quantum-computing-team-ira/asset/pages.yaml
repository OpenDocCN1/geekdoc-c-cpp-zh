  md: '# M. S. Kavitha*, Ramachandra Rao G., K. Sangeetha, A. Kowshika

    20 Mitigating the risk of quantum computing in cyber security era


    **Abstract:** The existence of quantum computers transmitted via the internet
    poses a huge threat to the privacy and safety of information. Once large-scale,
    error-tolerant quantum physics is discovered, the methods of encryption that are
    currently employed by the majority of people will become outdated. Consequently,
    it is not only important but also opportune to take action in order to prevent
    this threat. This chapter presents the utilization of cyber security modeling
    using quantum algorithm. The method is designed using quantum CNN method that
    enables better prediction of attacks from input datasets. Testing of the model
    shows a better prediction of the attacks than with other methods.


    # 20.1 Introduction


    The application of quantum computing has the potential to be of substantial use
    in a number of different fields, including the fields of artificial intelligence,
    healthcare, and weather forecasting, among others. Despite this, it presents a
    significant threat to the integrity of computer networks, which require modification
    to the way we approach the reactive security of sensitive data, [1, 2].


    Even if the vast majority of currently used methods of encryption are susceptible
    to being decrypted by quantum computers, we still need to take precautions against
    such a possibility and work on developing solutions that are resistant to the
    effects of quantum computing. The implementation of quantum technology will also
    lead to an enhancement in the safety of communications that take place via the
    internet. We have the potential to be carried out the expansion of secret keys
    in an entirely secure measure [3–5]. There are various ways that today quantum
    computing devices can be used to make a system more secure. These techniques have
    a number of advantages, one of which is that they be used to make things more
    secure [6–8].


