  md: '# 20.3 Methods


    In quantum computing, several quantum phenomena, such as superposition and entanglement,
    are utilized in order to represent classical data in a quantum context and modify
    it in such a way to yield results that can be comprehended. This is accomplished
    through the usage of quantum computing. Quantum entanglement is the method that
    is used to achieve this goal.


    Classical computers use bits to represent the state of the data being processed,
    but quantum computers use qubits, which can be in one of two conceivable states
    (0 or 1). Nevertheless, the state is a linear combination (superposition) of the
    basis states, each of which has a quantifiable probability while the computation
    is in operation. This means that the state can be thought of as a superposition
    of states. This state is the product of combining the basis states in a linear
    fashion.


    By measuring the system, the superposition can be reduced to one of the basis
    states from which information regarding the status of a quantum computer can be
    extracted (QC). The QC reduces to just one of the basis states when the state
    is measured, which means that the computation that was performed only one of the
    possible outcomes. This indicates that a QC with n qubits has the capability of
    representing all n-bit integers and carrying out computations on all of them at
    the same time.


    Quantum algorithms, on the other hand, to amplify specific base states by using
    the underlying structure of the problem in order to home in them. Because of this,
    the possibility of particular states is increased, which in turn, ensures that
    the result reached is repeatable and definitive. When employed in some circumstances,
    quantum algorithms have the potential to produce a significantly improved runtime
    complexity in contrast to their conventional equivalents, which can result in
    a speedup as a direct consequence of this potential.


