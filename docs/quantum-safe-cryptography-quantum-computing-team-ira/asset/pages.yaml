  md: '# Deepali Virmani*, T. Nadana Ravishankar, Mihretab Tesfayohanis

    6 IoT attack detection using quantum deep learning in large-scale networks


    **Abstract:** The probability of a cyberattack rises at an exponential pace in
    direct proportion to the size of the network-connected device population. Cybercriminals
    will concentrate their efforts on wireless networks because it is anticipated
    that more than half of all data on the Internet would originate from wireless
    networks. In this chapter, we develop an IoT attack detection using an intrusion
    detection system (IDS) framework that develops a quantum convolutional neural
    network-Based Long Short-Term Memory (QNN-LSTM) in large-scale networks. The collection
    of network logs is initially processed and then is classified using classifiers.
    The model is simulated to test its robustness against different scale of attacks,
    and the results show higher level of accuracy in detecting the attacks using QNN-LSTM
    than other methods.


    #  6.1 Introduction


    The probability of a cyberattack rises at an exponential pace in direct proportion
    to the size of the network-connected device population [1]. Cybercriminals will
    concentrate their efforts on wireless networks because it is anticipated that
    more than half of all data on the Internet would originate from wireless networks
    [2]. There are currently four times as many spam emails as there were a year earlier,
    and IBM [3] reported a large increase in the number of account takeovers in 2016.
    According to the same survey, there are many various types of cyberattacks, some
    of which include brute force, phishing, SQL injection, distributed denial of service,
    malware, and others.


    85% of the malicious software that was detected was ransomware. If such attacks
    were successful, there is potential for significant financial loss as a result
    of either the disclosure of confidential information or the disruption of regular
    business activities. Companies that are involved in the provision of financial
    services are always those who experience the most severe consequences as a result
    of breaches. After that, the wholesale and retail trade followed


