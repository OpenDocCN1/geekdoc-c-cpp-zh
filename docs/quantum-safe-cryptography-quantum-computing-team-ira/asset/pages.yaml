    # 16 RSA security implementation in quantum

    computing for a higher resilience


    **Abstract:** The public key cryptosystem is widely used in the current scenario.
    The possibility of breaking this system by a quantum algorithm would pose a significant
    threat to the confidentiality of the data and assets held by all participants
    in the digital economy. This is because the public key cryptosystem was designed
    specifically for the purpose of encrypting information. The chapter discusses
    the security implementation in quantum computing using RSA to improve the security
    against vulnerabilities. The RSA is designed in such a way that it mitigates all
    possible attacks in the system, and provides better resilience against attacks.
    The results show reduced computational time in detecting attacks and mitigating
    them with other methods.


    # 16.1 Introduction


    There is a large range of experimental systems that have been identified as possible
    candidates for quantum computing. Trapped ion systems are yet another possibility
    in the field of quantum computing. These systems have a very high level of fidelity
    and extraordinarily fast operation times. In 2018, IonQ created a 11-qubit quantum
    processor with the goal of determining the energy level of water molecules when
    they are in their ground state [1–6]. In addition, the business carried out a
    trapped ion quantum computation that comprised 79-bit single-qubit operations
    and 160-bit shorter qubits [7]. The advent of quantum computing paved the way
    for the achievement of both goals.


    Quantum algorithms can shorten the amount of time needed for calculation, but
    their applicability in the actual world is still limited to a certain extent.
    Especially in the sphere of cryptography, the results obtained are useless unless
    the cracking takes longer than a particular length of time that was defined beforehand
    [8]. To give you an example, if the amount of time required to break a cipher
    text is longer than the term of confidentiality, then it is evident that the cracking
    was a waste of time. Another


