  md: '# 21.3.2 Architecture


    The platform''s three-tiered design is made of architecture layers for the purposes
    of integrating devices, integrating data, as well as extracting and visualizing
    information. This information may be accessed through the platform.


    Data consumers are not technically regarded to be a component of the platform
    because they are often end-users or third-party applications. For example, doctors
    fall into this category. Its purpose is to make it clearer how the platform may
