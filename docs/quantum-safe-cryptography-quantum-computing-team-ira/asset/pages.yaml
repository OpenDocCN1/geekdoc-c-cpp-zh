    # 21.3.1 Data aggregation


    Before data can be saved on the cloud, it must first pass through a variety of
    intermediaries. This is a prerequisite for cloud storage. Gateways and fog servers
    are two examples of the forms that these intermediaries can take. Patients'' smartphones
    serve as the gateways via which their caregivers are able to monitor the patient''s
    circumstances. This allows the caregivers to better serve their patients. On the
    other hand, fog servers make it possible to instantiate the system at healthcare
    establishments.


    When they reach their destination, the servers are able to function as local hospital
    information systems (HIS), which simplifies the process of viewing and maintaining
    electronic records. Technologies that are based on big data processing, machine
    learning, and web analytics process the aggregated, anonymized data that is kept
    on the cloud for the purposes of knowledge extraction and statistical analysis.


    Cloud services that let the sharing of data have the additional benefit of making
    it possible to make the information accessible to applications that are not attached
    to one another. This is an advantage that is not offered by services that do not
    permit the sharing of data.'
