    An anomaly-based IDS, is a type of security system that monitors for suspicious
    activity by generating a profile of typical user behavior and sounding an alarm
    whenever this profile suggests suspicious activity has occurred. One of the most
    impressive aspects of this IDS is its capacity to identify threats that have never
    been seen before. When it comes to detecting threats, the detection performance
    of IDS systems that are based on misuse rather than anomalies is typically higher.
    Because misuse is a more common occurrence than anomalies. An IDS known as a specification-based
    IDS functions on the basis of rules and constraints that are personally established
    by an administrator. During the course of the execution, any deviation from the
    pre-determined parameters ought to be regarded as suspicious [–10].


