  md: '# 12.2.3 Cryptography using elliptical curves


    ECC provides quicker, smaller, and more efficient cryptographic keys using the
    elliptic curve theory. ECC creates keys using the elliptic curve equation. The
    system supports most public key encryption methods, including RS. Some researchers
    think ECC can give the same level of security as other methods, with a 164-bit
    key. ECC is popular for mobile applications because it provides equivalent security
    with less power and battery. In 1985, UW''s Neil Kobitz and IBM''s Victor Miller
    created the elliptic curve cryptography. An elliptic curve is a looping line between
    two axes. ECC is based on a mathematical group''s equation, obtained from points
