  md: 'S. Karthik*, Thenmozhi, R. M. Bhavadharini, T. Sumathi


    # 7 Quantum transfer learning to detect passive attacks in SDN-IOT


    **Abstract:** An attack on the network presents a potential risk to the integrity
    of the network security, which may or not occur. The field of quantum machine
    learning has made rapid strides in recent years, quantum learning (QL) has demonstrated
    quantum benefits in a variety of classification problems. This is due to the fact
    that variational quantum neural networks are also known as QL. When compared to
    an IDS that is based on quantum machine learning, an IDS that is based on classical
    machine learning is both less efficient and less accurate. This chapter discusses
    quantum transfer learning to detect the passive attacks in SDN-IOT. The use of
    quantum transfer learning makes the system detect the possible intrusions in the
    network before the data show an improved accuracy rate than those of state-of-the-art
    methods.


    # 7.1 Introduction


    There are over 26 billion linked devices, and over 80% of business apps are now
    hosted in the cloud. In addition, numerous new technologies have been developed
    in order to meet the expectations of businesses and the customers of these firms.
    Some examples of these new technologies are cloud computing, the Internet of Things,
    mobility, and virtualization. System designers frequently need to make alterations
    to existing networks, update software, and organize available computer and network
    resources in order to accommodate the ever-evolving requirements of these new
    technologies [1]. This is necessary in order to accommodate the proliferation
    of new technologies. In order to meet the demands of users and businesses while
    also reducing the level of complexity that is imposed by operations, a new network
    design that is both flexible and rapidly capable of implementing policies and
    supporting automation is required [2].


