  md: '# # Biographies


    Dr. Satya Prakash Yadav is Associate Professor at the Department of Computer Science
    and Engineering, GL Bajaj Institute of Technology and Management (GLBITM), Greater
    Noida (India). He has awarded his Ph.D. degree entitled "Fusion of Medical Images
    in Wavelet Domain" to A. P. J. Abdul Kalam University (AKTU) after than 14 years
    of experience, he has published four books *Programming in C, Programming in C++,
    and Blockchain and Cryptocurrency* by I.K. International Publishing Pvt Ltd.,
    including *Distributing Artificial Intelligence: A Modern Approach*, published
    in 2020 by CRC Press. He has undergone industrial training programs during which
    he was involved in live projects in the areas of SAP, Railway Traffic Management
    Systems, and Visual Vehicles Classification and Classification (using the metro
    network rail system). He is an alumnus of Netaj Subhash Institute of Technology
    (NSIT) at Delhi University. Dr. Yadav has published two authored and many other
    research papers in web of science indexed journals. Additionally, he has presented
    research papers in many areas of Image Processing, Information Retrieval, Feature
    Extraction and Recognition, Digital Image Processing, Feature Extraction, Information
    Retrieval, C++, C#, Data Structure, and Java. Also, he is a lead editor at CRC
    Press, Taylor and Francis Group Group (USA), Tech Press Science (Computer Systems
    and Engineering), International Springer Publisher, Springer Publishing Group
    (USA), and Eureka Journals, Pune (India).


    Dr. Raghur Singh is a B.Tech.(CSE), M.S. (Software Systems) and Ph.D.(Computer
