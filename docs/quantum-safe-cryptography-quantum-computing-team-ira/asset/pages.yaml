    available to users on an as-needed, pay-per-use basis. These resources include
    data storage, application software, and more. Computing on the cloud is sometimes
    referred to as utility computing [5].


    As all of the processing calls for a considerable number of resources may be done
    in the cloud, it is not required for a mobile device to have a powerful CPU or
    a large amount of memory [6]. The amount of memory that can be stored on mobile
    devices, as well as the amount of bandwidth that can be accessed, are all subject
    to constraints [7].


    Customers who subscribe to a software-as-a-service (SaaS) model are restricted
    to using the cloud-based software offered by the supplier. Beyond the user-specific
    configuration settings, users of cloud-based apps such as salesforce.com need
    not be concerned about the administration [8]. Users are able to design and run
    their own apps in the cloud Platform as a Service, which is also commonly referred
    to PaaS. This is made possible with the assistance of the development tools and
    programming languages that are available by the service provider [9].


    They need not be concerned about the underlying cloud infrastructure; however,
    users do have some in how their hosted applications, such as Google Apps, are
    organized and configured. Users have the ability to store and operate their virtual
    computers in the cloud with Infrastructure as a Service (IaaS), which can come
    complete with pre-installed software such as operating systems and applications.
    Users also have the ability to store and operate their virtual computers in the
    cloud with Amazon Web Services (AWS) [10].


    Customers who use a service such as Amazon Elastic Compute Cloud (EC2) need not
    be worried about the underlying cloud architecture; nevertheless, these customers
    do have complete control over the operating system (OS), RAM, and any applications
    that have been installed on the server. MCC differs from cloud computing, which
    is still in its early stages, in a number of ways, including mobility, usage of
    bandwidth, fault tolerance, and security, to name a few of these differences [11].


