    Mobile health care solutions, in contrast to more conventional forms of medical
    software, give mobile consumers speedy and uncomplicated access to perinent information
    [16].


    As a result of the on-demand services that are given by the cloud, mobile medical
    applications no longer have problems with the security of their data, the availability
    of storage space, or the performance of their applications. Mobile gaming offloads
    the processing of its graphics rendering and computing resources to servers that
    are situated in the cloud [17]. This is done so that the game engine can be used
    on mobile devices. Both the development and hosting of mobile applications have
    opportunities that may be explored through the use of the cloud as an alternative.
    It is expected that mobile applications are compatible with many mobile operating
    systems at the same time, such as Apple iOS, Google Android, and Microsoft Windows,
    store their data in the cloud, analyze their data in the cloud, and make use of
    cloud fault tolerance [18].


    Cloud service providers and their customers may have a tough time determining
    who is responsible for what, in terms of the security measures and controls that
    are installed in the cloud. Customers have the ability to configure and use the
    services in a manner that is compliant with the norms of their respective industries
    and geographic regions [19]. On the one hand, it is the responsibility of service
    providers to design their offerings, including any features, that they satisfy
    the criteria for data protection and privacy. On the other hand, the capability
    to do so is available to customers. Despite the fact that service providers are
    able to put operational controls in place to protect the data of their customers
    who keep their data in the cloud, the final responsibility for ensuring that their
