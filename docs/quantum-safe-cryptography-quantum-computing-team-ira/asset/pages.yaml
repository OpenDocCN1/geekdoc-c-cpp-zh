    # 19.2 Related works


    A unique quantum-inspired classifier for binary supervised learning was presented
    by Sergioli et al. [17] under the name Helstrom Quantum Centroid. Their investigation
    was predicated on density matrices as well as the formal aspects of quantum theory.
    The authors used fourteen distinct datasets to conduct an analysis in which they
    compared the effectiveness of their model to that of a range of more conventional
    methods.


    Using decision theory, classical machine learning, and the idea of quantum detection,
    the authors [18] constructed a new quantum-inspired binary classifier (QIBC).
    They were able to accomplish this by utilizing one of the laws of quantum physics
    is referred to as superposition. Compared to more traditional methods such as
    KNN and SVM, the newly developed classifier has the potential to achieve greater
    levels of precision, recall, and F-measure.


    Ding et al. [19] presented a new technique that was inspired by quantum support
    vector machines and was able to tackle classification issues at an exponentially
    faster rate. Linear transformation that acts as the foundation of the algorithm
    is the primary idea of operation.


    Dang et al. [20] developed an innovative model for the classification of images
    that makes use of both parallel computing and quantum KNN. Both the speed and
    accuracy of the classification process consider considerable improvements as a
    direct result of the model that they developed.


    Quantum Nearest Mean Classifiers, commonly known as QNMCs, were first conceived
    by Sergioli et al. [21] as a potential improvement to the conventional minimum
    distance classifier. They were introduced for the first time in their work. First,'
