    # 6.3 Methods


    This chapter presents an example of a system design that is capable of detection
    of system-based Internet of Things (IoT) botnets. The artificial intelligence
    (CNN-LSTM) model that is applied in this system is at the cutting edge of technology
    and is used to monitor devices connected to the IoT for indications of an intrusion.


    The methodology was validated by using real-world traffic data that was obtained
    from numerous IoT devices that had been lawfully infected by a massive botnet
    attack, not notably Mirai. These devices were used to corroborate the methodology.
    In order for the security system to be able to spot common dangers, it was configured
    to recognize zero-day attacks that were carried out by devices connected to the
    IoT.


