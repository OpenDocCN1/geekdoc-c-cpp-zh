  md: 'The concept of software-defined networking (SDN) began to take shape in people''s
    minds. The development of the concept of SDN was sparked by the realization that
    there is a pressing requirement for interoperability across all different kinds
    of devices [3]. An SDN is a type of network that is capable of having its architecture
    dynamically reshaped in response to events as they occur in real time. In order
    to achieve this goal, the control plane and data plane must be isolated from one
    another. Next, the intelligence and control of the network must be centralized,
    and finally, the applications must be kept in the dark regarding specifics of
    the network underlying infrastructure [4].


    SDN has the potential to serve as the architecture for future networks due to
    the numerous advantages it provides such as agility, automation, loop avoidance,
    failure response, and management in a variety of domains. However, SDN architecture
    is vulnerable to a broad variety of attacks [5].


    Due to the ease with which man-in-the-middle attacks can be carried out, particularly
    in an environment where they are centralized, as well as the fact that they are
    difficult to detect, SDN security is a primary issue that needs to be addressed.
    When an adversary eavesdrops on a conversation that is taking place between two
    legal users with the purpose of capturing encryption keys and sensitive information,
    this type of attack is known as Man in the Middle (MitM) [6].


    An SDN environment is rife with the prevalence of MitM attacks due to the ease
    with which they can be carried out, the difficulty in detecting them, and the
    fact that they are used to steal sensitive information that is being transmitted
    between controllers and SDN nodes. When an MitM attack takes place, the security
    of an SDN can be breached at any level, including the transport, application,
    and user levels. The effects of this could be felt for a long time [7–15].


    A number of studies that have been published in recent years have made the detection
    and protection of MitM attacks on SDN architecture the subject of their investigations.
    In these works, specific intrusion detection and prevention systems are used,
    In addition, to authenticate SDN nodes, this study makes use of variety of cryptographic
    and biometric methods that are already in use. When working with an SDN, it might
    be difficult to deploy traditional security measures due to the sheer quantity
    and variety of nodes that are present in the network. This can make conventional
    security measures more difficult to be executed [16, 17]. In fact, the great majority
    of the proposed MitM detection algorithms are founded on antiquated and redundant
    datasets that are better suited to an environment containing traditional networks
    rather than an SDN [18]. Furthermore, previous works focused their attention primarily
    on the control layer of the SDN rather than the data layer, and they did not provide
    effective mechanisms for automating filtration rules or feature selection methods
    that were appropriate to the context of the SDN for the purpose of rapid and efficient
    anomaly identification in real-time. This was a problem [19, 20].'
