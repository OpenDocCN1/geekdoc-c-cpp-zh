  md: '# Shally Nagpal, Puneet Garg*, Shivani Gaba, Alankrita Aggarwal

    13 An improved genetic quantum cryptography model for network communication


    **Abstract:** Any wireless or open network''s biggest problem is security. When
    the network has limited coverage and high-speed mobility, communication becomes
    even more crucial. One similar network with a lower sensing limit and designed
    for indoor is WPAN. In order to increase the communication''s dependability and
    security, this paper suggests a quantum-inspired encoded communication. The work
    model is established for a highly mobile, randomly scattered WPAN network. The
    initial step of this model performs node-level characterization under the parameters
    of coverage, stability, and load. Based on this analysis, the initial population
    sequence is generated and based on this generation, communication can be performed.
    The genetic model applied on this population pool is processed to generate the
    effective communication pair. After generating the population pair, quantum technique
    is applied to capture the characteristics of the node pair to generate the key.
    Finally, the data is encoded using the quantum key-based SHA. Over the network,
    this encoded communication is carried out.


    # 13.1 Introduction


    Cryptographic methods are available to provide encoded communication between distributed
    users in the public environment. It protects from intruders who want to swoop
    on it. Cryptography is about having an integrated authentication policy that protects
    the communication from various kinds of network attacks [1].


    There are a number of methods to provide security and protect the communication
    in an open environment. Anti-virus are software programs that secure a system
    from viruses. Firewalls can also be used for a specific application, program or
    a system to provide secure gateway adaptive communication.


