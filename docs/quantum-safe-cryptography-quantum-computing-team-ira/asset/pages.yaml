  md: '# Annapantula Sudhakar*, G. R. S. Murty, Thirukumaran S.

    15 Post-quantum cryptography for the detection of injection attacks in small-scale
    networks


    **Abstract:** In this chapter, we develop a post-quantum cryptography for the
    detection of injection attacks in small-scale vehicular ad hoc networks. The model
    is designed using genetic algorithm-based convolutional neural network to test
    the efficacy of the network against mitigating attacks. IoT devices in vehicular
    networks are easily prone to attacks and hence the research uses the deep learning
    model to train and classify the attacks. A simulation shows the efficacy of the
    model in detecting the attacks over various layers of attacks.


