  md: '# Kumari Manisha*, V. Dhanunjana Chari, Leta Tesfaye Jule

    8 Intrusion detection framework using quantum computing for mobile cloud computing


    **Abstract:** Mobile cloud computing (MCC) refers to a hybrid approach that brings
    together mobile computing, cloud computing, and wireless networks. The processing
    and storage of data are supposed to be moved away from the mobile device, which
    is its purpose. In MCC, mobile devices are not accountable for performing calculations
    or storing user data; rather, these responsibilities are transferred to the powerful
    infrastructures of the cloud. In this chapter, an intrusion detection system (IDS)
    is developed to improve the detection of attacks in MCC. The model using quantum
    computing (QC) to detect the possible attacks in the MCC. Various types of attacks
    are proliferated and tested on the proposed QC and its detection rate is noted.
    The results show that the proposed QC has higher rate of accuracy and reduced
    computational burden than other methods.


    # 8.1 Introduction


    Mobile Cloud Computing (MCC), which uses Ethernet or the Internet to share multiple
    mobile devices in a variety of settings, without limiting their access to a shared
    pool of resources for unlimited storage, utility, and mobility, is one of the
    technologies that has the potential to alter the course of history that we [1-2].
    MCC is one of the technologies that possesses the ability to become an expert
    in MCC, it is vital to have a comprehensive understanding of all there is to know
    about cloud computing and the services that it provides. As a result of cloud
    computing, the traditional client-server architecture, which is centered on the
    organization, has been supplanted by a data-centric strategy that is more scalable,
    efficient, and flexible [4]. This new method focuses on the data rather than on
    the organization. The cloud makes several computing resources, including


