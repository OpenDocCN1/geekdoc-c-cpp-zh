    # 11.2 Taxonomy


    In this section, we will organize the various quantum computing technologies into
    the several groups that they belong to, according to the criteria outlined in
    the introduction. Each of these categories is differentiated from the others by
    its own particular set of activities and attributes. The quantum computing taxonomy
    takes into account all of the relevant elements, including the fundamental features,
    the algorithmic features, the time and gate features, and the extra features:
    (A) Features that are fundamental, B) Features that are time and gate, and (D)
    Features that are additional. Figure 11.5, which can be accessed through this
