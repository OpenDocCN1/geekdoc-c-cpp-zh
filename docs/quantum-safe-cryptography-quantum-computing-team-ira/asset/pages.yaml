    # # 16.5 Conclusion


    The chapter demonstrated that hash-based signature algorithms are efficient in
    terms of the amount of time that is required to generate keys, the amount of time
    that is required to generate signatures, and the amount of time that is required
    to verify signatures. This research also sheds light on the difficulties of using
    traditional methods rather than hash-based signatures in settings. When compared
    to the strategies utilized by its rivals, RSA reveals itself to be the strategy
    with the highest level of efficiency. Following a side-by-side comparison of the
    two time-tested approaches, we came to the conclusion that the RSA protocol generates
    keys and signatures in significantly shorter amount of time. On the other hand,
    it was found that the RSA method was the one that was most effective when checking
    signatures.


