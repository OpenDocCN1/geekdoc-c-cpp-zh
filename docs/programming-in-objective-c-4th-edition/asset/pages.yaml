  md: 'Prior to the release of Xcode 4, the UI was designed using a separate application
    called Interface Builder.


    Apple distributes an iPhone simulator as part of the iOS SDK. The simulator replicates
    much of your iPhone environment, including its home screen, Safari web browser,
    Contacts application, and so on. The simulator makes it much easier to debug your
    applications; you don''t have to download each iteration of your application to
    an actual iPhone device and debug it there. This can save you a lot of time and
    effort.


    To run applications on an iOS device, you need to register for the iOS developer
    program and pay a $99 fee (as of the time of this writing) to Apple. In turn,
    you will receive an activation code that will allow you to test and install applications
    on an iOS device. Unfortunately, you cannot develop applications even for your
    own iOS device without going through this process. Note that the application we
    develop in this chapter will be loaded and tested on the iPhone simulator and
    not on an iPhone device.


    # Creating a New iPhone Application Project


