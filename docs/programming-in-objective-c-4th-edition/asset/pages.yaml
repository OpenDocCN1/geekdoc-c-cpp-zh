  md: 'int cannot be used as a variable name because its use has a special meaning
    to the Objective-C compiler. This use is known as a reserved name or reserved
    word. In general, any name that has special significance to the Objective-C compiler
    cannot be used as a variable name.


    Always remember that upper- and lowercase letters are distinct in Objective-C.
    Therefore, the variable names sum, Sum, and SUM each refer to a different variable.
    As noted, when naming a class, start with a capital letter. Instance variables,
    objects, and method names, on the other hand, typically begin with lowercase letters.
    To aid readability, capital letters are used inside names to indicate the start
    of a new word, as in the following examples:


    +   * AddressBook—This could be a class name.


    +   * currentEntry—This could be an object.


    +   * current_entry—Some programmers use underscores as word separators.


    +   * addNewEntry—This could be a method name.


    When deciding on a name, keep one recommendation in mind: Don''t be lazy. Pick
    names that reflect the intended use of the variable or object. The reasons are
    obvious. Just as with the comment statement, meaningful names can dramatically
    increase the readability of a program and will pay off in the debug and documentation
    phases. In fact, the documentation task will probably be much easier because the
