  md: 'You can also declare the instance variables for a class in the interface section.
    The ability to do it in the implementation section was added as of Xcode 4.2 and
    is considered a better way to define a class. You learn more about why in a later
    chapter.


    Each of these sections is a part of every Objective-C program, even though you
    might not need to write each section yourself. As you''ll see, each section is
    typically put in its own file. For now, however, we keep it all together in a
    single file.


    # The @interface Section


    When you define a new class, you have to tell the Objective-C compiler where the
    class came from. That is, you have to name its parent class. Next, you need to
    define the type of operations, or methods, that can be used when working with
    objects from this class. And, as you learn in a later chapter, you list items
    known as properties in this special section of the program called @interface section.
    The general format of this section looks like this:


    ```

    @interface NewClassName:ParentClassName

    propertyAndMethodDeclarations;

    @end

    ```


    By convention, class names begin with an uppercase letter, even though it''s not
    required. This enables someone reading your program to distinguish class names
    from other types of variables by simply looking at the first character of the
    name. Let''s take a short diversion to talk a little about names in Objective-C.


    # Choosing Names'
