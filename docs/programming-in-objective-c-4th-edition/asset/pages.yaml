- pgno: 744
  md: '**class object** An object that identifies a particular class. The class name
    can be used as the receiver of a message to invoke a class method. In other places,
    the `class` method can be invoked on the class to create a class object.


    **cluster** An abstract class that groups a set of private concrete subclasses,
    providing a simplified interface to the user through the abstract class.


    **Cocoa** A development environment that consists of the Foundation, Core Data,
    and Application Kit frameworks.


    **Cocoa Touch** A development environment that consists of the Foundation, Core
    Data, and UIKit frameworks.


    **collection** A Foundation framework object that is an array, dictionary, or
    a set used for grouping and manipulating related objects.


    **compile time** The time during which the source code is analyzed and converted
    into a lower-level format known as object code.


    **composite class** A class that is composed of objects from other classes; often
    it''s used as an alternative to subclassing.


    **concrete subclass** A subclass of an abstract class. Instances can be created
    from a concrete subclass.


    **conform** A class conforms to a protocol if it adopts all the required methods
    in the protocol, either directly through indirectly through inheritance.


    **constant character string** A sequence of characters enclosed inside a pair
    of double quotation marks. If preceded by an @ character, it defines a constant
    character string object of type `NSConstantString`.


    **data encapsulation** The notion that the data for an object is stored in its
    instance variables and is accessed only by the object''s methods. This maintains
    the integrity of the data.'
  merge: -1
  img_proc: true
