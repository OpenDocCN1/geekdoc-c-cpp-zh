  md: '# 16. Working with Files


    The Foundation framework enables you to get access to the file system to perform
    basic operations on files and directories. This is provided by FileManager, whose
    methods include the capability to


    +   * Create a new file

    * Read from an existing file

    * Write data to a file

    * Rename a file

    * Remove (delete) a file

    * Test for the existence of a file

    * Determine the size of a file as well as other attributes

    * Make a copy of a file

    * Test two files to see whether their contents are equal


    Many of these operations can also be performed on directories. For example, you
    can create a directory, read its contents, or delete it. Another feature is the
    ability to link files. That is, the ability to have the same file exist under
    two different names, perhaps even in different directories.


    To open a file and perform multiple read-and-write operations on the file, you
    use the methods provided by FileHandle. The methods in this class enable you to


    +   * Open a file for reading, writing, or updating (reading and writing)

    * Seek to a specified position within a file

    * Read or write a specified number of bytes from and to a file'
