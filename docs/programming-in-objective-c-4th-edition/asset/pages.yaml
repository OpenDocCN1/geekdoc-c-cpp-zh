- pgno: 243
  md: "![](img/6897a0c84e438cb4e5aad2d8a2fad0b8_243_0.png)\n\nFrom a terminology point\
    \ of view, we can speak of classes, child classes, and parent classes. Analogously,\
    \ we can talk about classes, subclasses, and subclasses. You should become familiar\
    \ directly with both types of terminology.\n\nWhenever a new class (other than\
    \ a new root) is defined, the class inherits certain things. For example, the\
    \ (non-private) instance variables and the methods from the parent implicitly\
    \ become part of the new class definition. That means the subclass can access\
    \ these methods and instance variables, as if they were defined directly within\
    \ the class definition.\n\nNote that the instance variables are to be accessed\
    \ directly by a subclass must be declared in the interface section, and not in\
    \ the implementation section as we have been doing throughout this book. Instance\
    \ variables declared or synthesized in the implementation section are private\
    \ instance variables and are not directly accessible by subclasses. Instead, you'll\
    \ want to use their explicitly defined or synthesized getter setter methods to\
    \ access their values.\n\nA simple example, albeit contrived, helps to illustrate\
    \ this key concept of inheritance. Here's a declaration for an object ClassA with\
    \ one method called initVar (and note that here we are declaring the instance\
    \ variable x in the interface section to make it accessible by subclasses.)\n\n\
    ```\n@interface ClassA: NSObject\n{\n    int x;\n}\n```"
