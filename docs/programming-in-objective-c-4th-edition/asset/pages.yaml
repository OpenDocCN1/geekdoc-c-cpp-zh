    So, in the first message call, the numerator message will be sent to the Fraction
    object myFraction. In that method, the code will return the value of the numerator
    instance variable for that fraction. Remember, the context of a method while it
    is executing the object that is the receiver of the message. So when the numerator
    method accesses and returns the value of the numerator instance variable, it''s
    myFraction''s numerator will be accessed and returned. That returned integer value
    is then passed to NSLog to be displayed.


    For the second message call, the denominator method will be called to access and
    return the value of myFraction''s denominator, which is then passed to NSLog to
    be displayed.


    Incidentally, methods that set the values of instance variables are often collectively
    referred to as setters, and methods to retrieve the values of instance variables
    are called getters. For the Fraction class, setNumerator and setDenominator: are
    the setters, and numerator and denominator are the getters. Collectively, setters
    and getters are also referred to as accessor methods.


    Make sure you understand the difference between setters and the getters. The setters
    don''t return a value because their purpose is to take an argument and to set
    the corresponding instance variable to the value of that argument. No value needs
    to be returned in that case. That''s the purpose of a setter to set the value
    of an instance variable, so setters typically do not return values. On the other
    hand,'
