    # # NSIndexSet


    Let''s take a look at another type of set: the NSIndexSet. This class is used
    to store indexes into some other data structure, typically an array. You can use
    this class, for example, to efficiently generate a list of index numbers from
    an array of objects, where each object satisfies some criteria that you specify.
    You''ll want to note that there is no mutable version of the NSIndexSet class.


    As an example, the NSArray method indexOfObjectPassingTest: takes a block as its
    argument. The blocks get executed for each element in the array, passing the array
    element, the index number, and a pointer to a BOOL variable. The code in the block
    will presumably test the element against some criteria, and return YES if the
    array element satisfies the criteria, and NO if it does not. Even if the method
    returns YES, the method will continue processing the next element from the array
    until all elements have been processed. You can stop processing at any time by
    setting the value the BOOL pointer reference to YES. (Refer back to Chapter 13,
    for a discussion on pointers.)'
