    message. That was done in accordance with a memory management system known as
    manual reference counting. As of Xcode 4.2, programmers no longer have to worry
    about this and can rely on the system to take care of releasing memory as necessary.
    This is done through a mechanism known as Automatic Reference Counting, or ARC
    for short. ARC is enabled by default when you compile new applications using Xcode
