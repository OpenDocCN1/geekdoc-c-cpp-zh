    # The break Statement


    Sometimes when executing a loop, you''ll want to leave the loop as soon as a certain
    condition occurs—for instance, maybe you detect an error condition or find the
    data you''re looking for in a list of data. Execution of the break statement causes
    the program to immediately exit from the loop it is executing, whether it''s a
    for, while, or do loop. Subsequent statements in the loop are skipped and execution
    of the loop is terminated. Execution continues with whatever statement follows
    the loop.


    If a break is executed from within a set of nested loops, only the innermost loop
    in which the break is executed is terminated.


    The format of the break statement is simply the keyword break followed by a semicolon,
    like so:


    ```

    break;

    ```


    # The continue Statement


    The continue statement is similar to the break statement, except that it doesn''t
    cause the loop to terminate. At the point that the continue statement is executed,
    any statements that appear after'
