    # Type int


    An integer consists of the sequence of one or more digits. A minus sign preceding
    the sequence indicates that the value is negative. The values 158, -10, and 0
    are all valid examples of integer constants. No embedded spaces are permitted
    between the digits, and commas can''t be used.(So the value 12,000 is not a valid
    integer constant and must be written as 12000.)


    Every value, whether it''s a character, an integer, or a floating-point number,
    has a range of values associated with it. This range has to do with the amount
    of storage allocated to store a particular type of data. In general, that amount
    is not defined in the language; it typically depends on the computer you''re running
    on and is therefore called implementation or machine dependent. For example, an
    integer variable might take 32 bits on your computer, or perhaps it might be stored
    in 64. If 64 bits were used, then much larger numbers can be stored inside integer
    variables than if 32 bits were used instead.


    > Note


    Under Mac OS X, you are given the option of compiling an application as either
    a 32-bit or 64-bit application. In the former case, an int takes up 32 bits; in
    the latter case, 64 bits are used.


    # Type float'
