  md: "# Fast Enumeration\n\nThe list method's for loop shows a construct you haven't\
    \ seen before:\n\n```\nfor ( AddressCard *theCard in book )\n    NSLog(\\(\\@%-20s\
    \ %-32s\", [theCard.UTF8String],\n    [theCard.email UTF8String]);\n```\n\nThis\
    \ uses a technique known as fast enumeration to sequence through each element\
    \ of the book array. The syntax is simple enough: You define a variable that will\
    \ hold each element in the array in turn (AddressCard *theCard). You follow that\
    \ with the keyword in, and then you list the name of the array. When the for loop\
    \ executes, it assigns the first element in the array to the specified variable\
    \ and then executes the body of the loop. Then it assigns the second element of\
    \ the array to the variable and again executes the body of the loop. This continues\
    \ in sequence until all elements of the array have been assigned to the variable\
    \ and the body of the loop executed for each element.\n\nNote that if theCard\
    \ had been previously defined as an AddressCard object, the for loop would more\
    \ simply become this:\n\n```\nfor ( theCard in book )\n...\n```\n\nProgram 15.10\
