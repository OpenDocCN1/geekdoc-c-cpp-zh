  md: 'The next program provides another example of the use of the while statement.
    The program computes the greatest common divisor of two integer values. The greatest
    common divisor (we abbreviate hereafter as gcd) of two integers is the largest
    integer value that evenly divides the two integers. For example, the gcd of 10
    and 15 is 5 because 5 is the largest integer that evenly divides both 10 and 15.


    A procedure, or algorithm, that can be followed to arrive at the gcd of two arbitrary
    integers is based on a procedure originally developed by Euclid around 300 B.C.
    It can be stated as:


    +   Problem: Find the greatest common divisor of two nonnegative integers u and
    v.

    Step 1: If v equals 0, then we are done and the gcd is equal to u.

    Step 2: Calculate temp = u % v, u = v, v = temp and go back to step 1.


    Don''t concern yourself with the details of how the previous algorithm works—simply
    take it on faith. We are more concerned here with developing a program to find
    the greatest common divisor than in performing an analysis of how the algorithm
    works.


    After expressing the solution to the problem of finding the greatest common divisor
    in terms of an algorithm, developing the computer program becomes a much simpler
    task. An analysis of the steps of the algorithm reveals that step 2 is repetitively
    executed as long as the value of v is not equal to 0. This realization leads to
    the natural implementation of this algorithm in Objective-C with the use of a
    while statement.


    Program 5.7 finds the gcd of two nonnegative integer values typed by the user.


