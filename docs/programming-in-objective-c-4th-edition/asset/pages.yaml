  md: 'condition is true (that is, nonzero), expression1 is evaluated and the result
    of the evaluation becomes the result of the operation. If condition evaluates
    false (that is, zero), expression2 is evaluated and its result becomes the result
    of the operation.


    A conditional expression is often used to assign one of two values to a variable,
    depending on some condition. For example, suppose you have an integer x and another
    integer variable s. If you wanted to assign -1 to s if x were less than 0, and
    the value of x2 to otherwise, you could write the following statement:


    ```

    s = ( x < 0 ) ? -1 : x * x;

    ```


    The condition x < 0 is first tested when the previous statement executed. Parentheses
    are generally placed around the condition expression to aid in the statement''s
    readability. This is usually not required, because the ? is evaluated. The precedence
    of the conditional operator is very low—lower, in fact, than all other operators
    but the assignment operators, and the comma operator.


    If the value of x is less than zero, the expression immediately following the
    ? is evaluated. This expression is simply the constant value -1, which is assigned
    to the variable s if x is less than zero.


    If the value of x is not less than zero, the expression immediately following
    the ? is evaluated and assigned to s. So if x is greater than or equal to zero,
    the value of x *, or x2, is assigned to s.


    As another example of the conditional operator, the following statement assigns
    to the variable max_value the maximum of a and b:


    ```

    max_value = ( a > b ) ? a : b;

    ```


