- pgno: 671
  md: 'Your address book has two instance variables, called name and email. Because
    these are both NSString objects, you can use the encodeObject:forKey method to
    encode each of them in turn. These two instance variables are then added to the
    archive.


    The encodeObject:forKey method encodes an object and stores it under the specified
    key for later retrieval using that key. The key names are arbitrary, so long as
    you use the same name to retrieve (decode) the data as you did when you archived
    (encoded), you can specify any key you like. The only time a conflict might arise
    is the same key is used for a subclass of an object being encoded. To prevent
    this from happening, you can insert the instance variable name in front of the
    class name when composing the key for the archive, as was done in [Program 19.5](Program
    19.5).


    Note that encodeObject:forKey can be used for any object that has implemented
    a corresponding encodeWithCoder method in its class.


    The decoding process works in reverse. The argument passed to initWithCoder: is
    again an NSCoder object. You don''t need to worry about this argument; just remember
    that it''s the one that gets sent the messages for each object you want to extract
    from the archive.


    Again, since our AddressCard class inherits directly from NSObject, you don''t
    have to worry about decoding inherited instance variables. If you did, you would
    insert a line like this at the start of your decoder method (assuming the superclass
    of your class conforms to the NSCoding protocol):


    ```

    self = [super initWithCoder: decoder];

    ```


    Each instance variable is then decoded by invoking the decodeObject:ForKey method
    and passing the same key that was used to encode the variable.'
