  md: '# 8. Inheritance


    In this chapter, you''ll learn about one of the key principles that makes object-oriented
    programming so powerful. Through the concept of inheritance, you will build on
    existing class definitions and customize them for your own applications.


    # It All Begins at the Root


    You learned about the idea of a parent class in Chapter 3, "Classes, Objects,
    and Methods.". A parent class can itself have a parent. The class that has no
    parent is at the top of the hierarchy and is known as a root class. In Objective-C,
    you have the capability to define your root class, but it''s something you normally
    won''t want to do. Instead, you''ll want to take advantage of existing classes.
    All the classes we''ve defined up to this point are descendants of the root class
    called NSObject, which you specified in your interface file like:


    ```

    @interface Fraction: NSObject

    ...

    @end

    ```


    The Fraction class is derived from the NSObject class. Because NSObject is at
    the top of the hierarchy (that is, there are no classes above it), it''s called
    a root class, as shown in Figure 8.1. The Fraction class is known as a child or
    subclass.


    # Figure 8.1. Root and subclass'
