    # Don’t Forget About Object-Oriented Programming!


    Now you know how to define a structure to store a date, and you''ve written various
    routines to manipulate that date structure. But what about object-oriented programming?
    Shouldn''t you have made a class Date instead and then developed methods to work
    with a Date object? Wouldn''t that be a better approach? Well, yes. Hopefully,
    that entered your mind when we were discussing dates in your program.


    Certainly, if you have to work with a lot of dates in your programs, defining
    a class and methods to work with dates is a better approach. In fact, the Foundation
    framework has a couple of classes, called NSDate and NSCalendarDate, defined for
    such purposes. We leave it as an exercise for you to implement a Date class to
    deal with dates as objects instead of structures.


    # Pointers


    Pointers enable you to effectively represent complex data structures, change values
    passed as arguments to functions and methods, and more concisely and efficiently
    deal with arrays. At the end of this chapter, we also clue you in about how important
    they are to the implementation of objects in the Objective-C language.


    We introduced the concept of a pointer in Chapter 8, "Inheritance," when we talked
    about the Point and Rectangle classes and stated that you can have multiple references
    to the same object.


    To understand the way pointers operate, you must first understand the concept
    of indirection. We witness this concept in our everyday life. For example, suppose
    that I needed to buy a new toner cartridge'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'for my printer. In the company that I work for, the purchasing department handles
    all purchases. So I would call Jim in purchasing and ask him to order the new
    cartridge for me. Jim would then call the local supply store to order the cartridge.
    To obtain my new cartridge, I would take an indirect approach because I would
    not be ordering the cartridge directly from the supply store.


    This same notion of indirection applies to the way pointers work in Objective-C.
    A pointer provides an indirect means of accessing the value of a particular data
    item. And just as there are reasons it makes sense to go through the purchasing
    department to order new cartridges (I don''t have to know which particular store
    the cartridges are being ordered from, for example), good reasons exist for why
    sometimes it makes sense to use pointers in Objective-C.


    But enough talk; it''s time to see how pointers actually work. Suppose you''ve
    defined a variable count as follows:


    ```

    int count = 10;

    ```


    You can define another variable, called intPtr, that enables you to indirectly
    access the value of count with the following declaration:


    ```

    int *intPtr;

    ```


    The asterisk defines the Objective-C system that the variable intPtr is of type
    pointer to int. This means that the program will use intPtr to indirectly access
    the value of one or more integer variables.


    You have seen how we used the & operator in the scanf calls of previous programs.
    This unary operator, known as the address operator, makes a pointer to a variable
    in Objective-C. So if x is a variable of a particular type, the expression &x
    is a pointer to that variable. If you want, you can assign the expression &x to
    any pointer variable that has been declared to be a pointer of the same type as
    x.'
