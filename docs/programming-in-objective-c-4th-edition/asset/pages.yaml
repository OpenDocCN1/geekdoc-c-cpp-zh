    \ first else clause from the previous example will not result in the statement\
    \ being interpreted as its format indicates:\n\n```\nif ([chessGame isOver] ==\
    \ NO )\n    if ([chessGame whoseTurn] == YOU )\n        [chessGame yourMove];\n\
    else\n    [chessGame finish];\n```\n\nInstead, this statement will be interpreted\
    \ as follows:\n\n```\nif ([chessGame isOver] == NO )\n    if ([chessGame whoseTurn]\
