  md: 'ignores any characters that follow these slashes, up to the end of the line.


    You can also initiate a comment with the two characters / and *. This marks the
    beginning of the comment. These types of comments have to be terminated. To end
    the comment, you use the characters * and /, again without any embedded spaces.
    All characters included between the opening /* and the closing */ are treated
    as part of the comment statement and are ignored by the Objective-C compiler.
    This form of comment is often used when comments span many lines of code, as it
    in the following:


    ```

    /*

    This file implements a class called Fraction,

    which represents fractional numbers. Methods allow

    manipulation of fractions, such as addition, subtraction, etc.


