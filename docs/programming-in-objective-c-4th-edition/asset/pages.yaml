    #ifdef DEBUG

    NSLog ("User name = %s, id = %i", userName,

    userId());

    #endif

    ```


    You might have many such debugging statements throughout the program. Whenever
    the program is being debugged, it can be compiled with DEBUG defined to have all
    the debugging statements compiled. When the program is working correctly, it can
    be recompiled without DEBUG defined. This has the added benefit of reducing the
    size of the program because all your debugging statements are not compiled in.


