- pgno: 623
  md: 'longer referenced and therefore no longer needed by the application? Those
    objects might still be sitting in memory somewhere, even though you''re no longer
    using them. Well, without some sort of "cleaning up" process, memory continues
    to fill with unreferenced objects, potentially taking your application to the
    breaking point, where it literally had no available memory left to do any more
    work.


    This chapter covers the idea of memory management, albeit at a fairly high level.
    Memory management is all about cleaning up (recycling) unused memory so that it
    can be used again. If an object is no longer being used, let''s reuse its memory.
    That sounds simple enough. However, it''s not quite that simple. Somebody has
    to figure out that simple fact. That is, somebody—and that somebody can be you,
    the computer, or both—has to be able to determine when an object is no longer
    being used and that the memory occupies can therefore be reclaimed.


    Several different memory management strategies have been developed to assist in
    these efforts. Two of them are automated methods; that is, the computer keeps
    track of the objects and frees their memory as necessary. The third method is
    a hybrid approach; the system does some of the work for you, but also requires
    that you, the programmer, be diligent and take care of telling the system when
    an object is no longer being used.


    Up until the release of Xcode 4.2 memory management was the subject of great consternation,
    one that required a great deal of understanding and foresight on the part of the
    programmer. Programmers had to carefully navigate the world of reference counts,
    retains, releases, and autoreleases in order to produce applications that judiciously
    used memory and weren''t subject to crashing at the most inpportune times, often
    as the result of trying to reference an object that had inadvertently been destroyed
    before its time had really passed.


    With the release of a feature known as Automatic Reference Counting, or ARC, in
    Xcode 4.2, programmers no longer have to'
