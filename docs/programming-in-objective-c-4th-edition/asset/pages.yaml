    \ precisely this function. The name of the statement is the switch statement,\
    \ and its general format is as follows:\n\n```\nswitch ( expression )\n{\n   \
    \ case value1:\n        program statement\n        program statement\n    ...\n\
    \    break;\n    case value2:\n        program statement\n        program statement\n\
    \    ...\n    break;\n    case valuen:\n        program statement\n        program\
