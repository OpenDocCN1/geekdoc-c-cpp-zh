  md: 'The convertToString: method checks the numerator and denominator of the fraction
    to produce a more eye-pleasing result. If the numerator and denominator are equal
    (but not zero), we return @1". If the numerator is zero, the string @0" is returned.
    If the denominator is 1, it''s a whole number: there''s no need to show the denominator.


    Recall the stringWithFormat: method that''s used inside convertToString: returns
    a given a format string (akin to NSLog) and a comma-separated list of arguments.
    You pass arguments to a method that takes a variable number of arguments by separating
    them with commas, just like you did when passing the arguments to the NSLog function.


