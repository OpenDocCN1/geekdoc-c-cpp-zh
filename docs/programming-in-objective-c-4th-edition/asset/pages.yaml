  md: '# 14. Introduction to the Foundation Framework


    A framework is a collection of classes, methods, functions, and documentation
    logically grouped together to make developing programs easier. On Mac OS X, more
    than 90 frameworks are available for developing applications so that you can easily
    work with the Mac''s Address Book structure, burn CDs, play back DVDs, play movies
    with QuickTime, play songs, and so on.


    The framework that provides the base or foundation for all your program development
    is called the Foundation framework. This framework, the subject of the second
    part of this book, enables you to work with basic objects, such as numbers and
    strings, and with collections of objects, such as dictionaries, and sets. Other
    capabilities provide for working with dates and times, using automated memory
    management, working with the underlying file system, storing (or archiving) objects,
    and working with geometric data structures as points and rectangles.


    The Application Kit framework contains an extensive collection of classes and
    methods to develop interactive graphical applications. These provide the capability
    to easily work with text, menus, toolbars, tables, documents, the pasteboard,
    and windows. In Mac OS X, the term Cocoa collectively refers to the Foundation
    framework, the Application Kit framework, and a third framework known as Core
    Data. The term Cocoa Touch collectively refers to the Foundation, Core Data, and
    UIKit frameworks. Part III, "Cocoa, Cocoa Touch, and the iOS SDK," provides more
    detail on this subject.


