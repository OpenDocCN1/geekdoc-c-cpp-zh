  md: "# The NSURL Class\n\nThe NSURL class provides an easy way for you to work with\
    \ URL addresses in your program. For example, given an HTTP address that is a\
    \ path to a file on the Internet, you can easily read the contents of that file\
    \ with a few method calls. You'll find many methods in Foundation that take NSURL\
    \ objects as arguments. remember that an NSURL object is not a string object such\
    \ as \"@http://www.apple.com\", but it's easy to create one from a string object\
    \ using the URLWithString: method.\n\nProgram 16.9 shows how the HTML contents\
    \ from a web address can be read into a program.\n\n# Program 16.9\n\n```\n//\
    \ Read the contents of a file stored at a URL\n```\n\n```\n#import <Foundation/Foundation.h>\n\
    \nint main (int argc, const char * argv[]) {\n    @autoreleasepool {\n       \
    \ NSURL *myURL = [NSURL URLWithString:@\"http://classroomM.com\"];\n\n       \
    \ NSString *myHomePage = [NSString stringWithWithContentsOfURL:myURL\n       \
    \                         encoding:NSASStringEncoding error:NULL];\n\n       \
    \ NSLog(\"%@%@\", myHomePage);\n    }\n}\n```"
