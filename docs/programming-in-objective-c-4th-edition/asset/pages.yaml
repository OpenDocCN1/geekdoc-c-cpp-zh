    # Protocols and Delegation


    A protocol is a list of methods that is shared among classes. The methods listed
    in the protocol do not have corresponding implementations;they''re meant to be
    implemented by someone else (like you!). A protocol provides a way to define a
    set of methods that are somehow related with a specified name. The methods are
    typically documented so that you know how they are to perform and so that you
    can implement them in your own class definitions, if desired.


    A protocol list a set of methods, some of which you can optionally implement,
    and others that you are required to implement. If you decide to implement all
    of the required methods for a particular protocol, you are said to conform or
    adopt that protocol. You are allowed to define a protocol where all methods are
    optional, or one where all are required.


    Defining a protocol is easy: You use the @protocol directive followed by the name
    of the protocol, which is up to you. After that, you declare methods just as you
    did with your interface section. All'
