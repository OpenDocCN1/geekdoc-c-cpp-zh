    a godsend to iOS developers. The proof of that is that I have really had to mention
    memory management at all up until this chapter. In the previous edition of this
    book, I took great pains throughout the entire text to make sure that readers
    fully understood and judiciously applied proper memory management techniques.


    In this chapter, you get an overview of the different memory management schemes
    that exist for Cocoa and iOS developers. We''ll also briefly describe how manual
    memory management works. That''s in case you have to support older code or for
    some reason decide not to avail yourself of the automatic memory management features
    that are currently available.


    Although you no longer have to worry about the life span of your objects (and
    things like releasing their memory when you''re done using them), depending on
    the type of application you''re writing judicious use of memory is still important.
    For example, if you''re writing an interactive drawing application that creates
    many objects during the execution of the program, you must take care that your
    program does not continue to consume more memory resources as it runs. In some
    cases, it becomes your responsibility to intelligently manage those resources
    and make sure you''re not unnecessarily allocating objects.


    There are three basic memory management models that are supported for Objective-C
    developers:


    +   1. Automatic garbage collection


    +   2. Manual reference counting and the autorelease pool


    +   3. Automatic Reference Counting (ARC)


