  md: '# Entering Your Code


    Now we''re ready to modify some of your project files. Notice that a class called
    project-nameAppDelegate was created for you, where in this example project-name
    is iPhone_1. An application delegate subclass is created for every new iOS application
    you create. In general, in this class are methods that control the application''s
    execution. This includes such things as what to do when the application starts,
    when it enters and leaves the background, when the system tells it it''s using
    too much memory, and when it terminates. We won''t make any changes to this class
    in either of the two examples in this chapter.


    A second class was also created for you called iPhone_1ViewController. As you
    can see, Xcode creates interface and implementation selections for you in the
    corresponding .h and .m files. A view controller is responsible for managing the
    display of one or more "views" on your iPhone''s display. We have only one view
    in this application, as depicted in Figure 21.1. It''s uncommon for applications
    to present many different views and toのである have multiple view controllers to manage
    them.


