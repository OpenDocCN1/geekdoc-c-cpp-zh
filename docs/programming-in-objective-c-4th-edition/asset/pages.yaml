  md: 'protocol. An informal protocol is really no more than a grouping of methods
    under a name. This can help somewhat from the point of documentation and modularization
    of methods.


    The class that declares the informal protocol doesn''t implement the methods in
    the class itself, and a subclass that chooses to implement the methods needs to
    redeclare them in its interface section, as well as implement one or more of them.
    Unlike formal protocols, the compiler gives no help with informal protocols; there’s
    no concept of conformance or testing by the compiler.


    If an object adopts a formal protocol, the object must conform to all the required
    messages in the protocol. This can be enforced at runtime as well as compile time.
    If an object adopts an informal protocol, the object might not need to adapt all
    methods in the protocol, depending on the protocol. Conformance to an informal
    protocol can be enforced at runtime (via respondsToSelector:) but not at compile
    time.


