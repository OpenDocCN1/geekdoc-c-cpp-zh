    # Return Values


    When you declare a new method, you have to tell the Objective-C compiler whether
    the method returns a value and, if it does, what type of value it returns. You
    do this by enclosing the return type in parentheses after the leading minus or
    plus sign. So this declaration specifies that the instance method called `currentAge`
    returns an integer value:


    +   - (int) currentAge;


    Similarly, this line declares a method that returns a double precision value.
    (You''ll learn more about this data type in [Chapter 4, "Data Types and Expressions"])


    +   - (double) retrieveDoubleValue;


    A value is returned from a method using the Objective-C return statement, similar
    to the way in which we returned a value from main in previous program examples.


    If the method returns no value, you indicate that using the type `void`, as in
    the following:


    +   - (void) print;


    This declares an instance method called `print` that returns no value. In such
    a case, you do not need to execute a `return` statement at the end of your method.
    Alternatively, you can execute a `return` without any specified value, as in the
    following:


    ```

    return;

    ```


