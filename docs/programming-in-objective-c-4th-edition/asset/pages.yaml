    has the effect of treating the value contained in the pointer variable as a memory
    address. The value stored at that memory address is then fetched and interpreted
    in accordance with the type declared for the pointer variable. So if intPtr were
    of type pointer to int, the system would interpret the value stored in the memory
    address given by *intPtr as an integer.'
