    # Finding the Right Method


    When you send a message to an object, you might wonder how the correct method
    is chosen to apply to that object. The rules are actually quite simple. First,
    the class to which the object belongs is checked to see whether a method is explicitly
    defined in that class with the specific name. If it is, that’s the method that
    is used. If it’s not defined, the parent class is checked. If the method is defined
    there, that’s what is used. If not, the search continues.


    Parent classes are checked until one of two things happens: Either you find a
    class that contains the specified method or you don’t find the method after going
    all the way back to the root class. If the first occurs, you’re all set; if the
    second occurs, you have a problem, and a warning message is generated that looks
    like this:


    > warning: ''ClassB'' may not respond to ''-ity''


    In this case, you inadvertently are trying to send a message called ity to a variable
    of type ClassB. The compiler tells you that objects from that class do not know
    how to respond to such a method. Again, this was determined after checking ClassB’s
    methods and its parents’ methods back to the root class (which, in this case,
    is NSObject).'
