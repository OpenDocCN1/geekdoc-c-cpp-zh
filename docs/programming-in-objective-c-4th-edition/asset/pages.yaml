    Find a suitable calculator image on the Internet that you can use and set up the
    fraction calculator to use this image as its application icon.


    +   6. Give your calculator''s buttons a custom look by using your own image for
    a button. You first add the image to your project (drag it into the left pane).
    Next, set the button''s type to Custom in the Inspector window and set the Image
    to the file you just copied into your project. Figure 21.21 shows a Fraction Calculator
    that uses such a custom image. This calculator is available at no charge from
    Apple''s App Store, and the source code is posted on the forum for this book (classroomM.com/objective-c).


    # Figure 21.21. Fraction Calculator with custom buttons'
