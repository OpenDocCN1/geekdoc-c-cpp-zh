- pgno: 742
  md: '# Appendix A. Glossary


    This appendix contains informal definitions for many of the terms you will encounter.
    Some of these terms have to do directly with the Objective-C language itself,
    whereas others gain their etymology from the discipline of object-oriented programming.
    In the latter case, I provide the meaning of the term as it specifically applies
    to the Objective-C language.


    +   **abstract class** A class defined to make creating subclasses easier. Instances
    are created from the subclass, not of the abstract class. See also [concrete subclass](#).


    +   **accessor method** A method that gets or sets the value of an instance variable.
    Using accessor methods to set and retrieve the values of instance variables is
    consistent with the methodology of data encapsulation.


    +   **Application Kit** A framework for developing an application''s user interface,
    which includes objects such as menus, toolbars, and windows. Part of Cocoa and
    more commonly called AppKit.


    +   **ARC** See [Automatic Reference Counting](#).


    +   **archiving** Translating the representation of an object''s data into a format
    that can later be restored (unarchived).


    +   **array** An ordered collection of values. Arrays can be defined as a basic
    Objective-C type and are implemented as objects under Foundation through the `NSArray`,
    and `NSMutableArray` classes.


    +   **Automatic Reference Counting (ARC)** A feature added as of Xcode 4.2 whereby
    the compiler manages the memory associated with an object. Before Xcode 4.2, iOS
    programmers were required to use manual techniques to manage memory.'
  merge: -1
  img_proc: true
- pgno: 743
  md: 'This required the use of retain, release, autorelease, and dealloc methods.


    **automatic variable** A variable that is automatically allocated and released
    when a statement is entered and exited. Automatic variables have scope that is
    limited to the block in which they are defined and have no default initial value.
    They are optionally preceded by the keyword `auto`.


    **autorelease pool** An object before ARC was managed by the autoreleasePool class.
    Now it''s implemented through the @autoreleasepool directive. The autorelease
    pool keeps track of objects that are targeted for delayed release by the system.
    For iOS and Cocoa applications, that''s typically at the end of the run loop.


    **bitfield** A structure containing one or more integer fields of a specified
    width. Bitfields can be accessed and manipulated the same way other structure
    can.


    **block** An extension to the C language added by Apple, Inc. A block has a function-like
    syntax, captures the values of variables within its scope when defined, and can
    be assigned to a variable or passed as an argument to a method or function. A
    block can be efficiently dispatched to another thread or processor for execution.


    **category** A set of methods grouped together under a specified name. Categories
    can modularize the method definitions for a class and can be used to add new methods
    to an existing class.


    **character string** A null-terminated sequence of characters.


    **class** A set of instance variables and methods that have access to those variables.
    After a class is defined, instances of the class (that is, objects) can be created.


    **class method** A method (defined with a leading + sign) that is invoked on class
    objects. See also instance method.'
