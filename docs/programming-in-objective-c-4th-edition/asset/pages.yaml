  md: '# Strong Variables


    By default, all object pointer variables are strong variables. That means that
    assigning an object reference to such a variable causes that object to be automatically
    retained. Further, the old object reference will be released before the assignment
    is made. Finally, strong variables are initialized to zero by default. And that''s
    true whether it''s an instance variable or a local or global variable.


    Look at this code, which creates and sets two Fraction objects.


    ```

    Fraction *f1 = [[Fraction alloc] init];

    Fraction *f2 = [[Fraction alloc] init];

    ```


    ```

    [f1 setTo: 1 over: 2];

    [f2 setTo: 2 over: 3];

    ```


    Now when you write the following using manual memory management


    ```

    f2 = f1;

    ```


    the effect is to just copy the reference to the Fraction object into f2. The Fraction
    object referenced by f2 would be lost as a result, as its value is overwritten.
    This would create what''s known as a memory leak; a variable that is no longer
    referenced and therefore can''t be released.


    If you''re using ARC, f1 and f2 are both strong variables. So the previous assignment
    actually works like this:


    ```

    [f1 retain]; // retain new value

    [f2 release]; // release the old value

    f2 = f1; // copy the reference

    ```'
  merge: -1
  img_proc: true
- pgno: 638
  md: 'Of course, you don''t see this happening because the compiler does

    all the work for you. You just the write the assignment statement and

    forget about it.


    Because all object variables are strong variables by default, you

    don''t need to declare them as such. However, you can explicitly do

    so by using the _strong keyword for a variable:


    ```

    _strong Fraction *fl;

    ```


    It''s important to note that properties are not strong default. Their

    default attribute is unsafe_retained (or, equivalently assign).

    You''ve seen how to declare the strong attribute for a property:


    ```

    @property (string, nonamatic) NSMutableArray

    *birdNames;

    ```


    The compiler makes sure that strong properties survive the event

    loop by retaining them on assignment. No such action is taken for

    properties that are unsafe_retained (aka assign) or weak.


    # Weak Variables


    Sometimes you set up a relationship between two objects where

    each object needs to reference the other (this could be as simple as

    two objects or as complex as a chain of objects that create a cycle).

    For example, iOS applications present graphics on the screen

    through objects known as views. Views are maintained in a

    hierarchy. So one might present an image, and inside that

    image view you might want to display a title for that image. You can

    set this up where the image view is the main view, and the title is a

    subview. When the main view is shown, the subview is automatically

    shown as well. You can think of the main image view as the parent

    view and the title view as the child view. The main image view owns

    the subview.'
