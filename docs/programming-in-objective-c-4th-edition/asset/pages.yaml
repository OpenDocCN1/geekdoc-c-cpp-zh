    # Accessing Instance Variables and Data Encapsulation


    You''ve seen the methods that deal with fractions can access the two instance
    variables numerator and denominator directly by name. In fact, an instance method
    can always directly access its instance variables. A class method can, however,
    because it''s dealing with only the class itself, not with any instances of the
    class (think about that for a second). But what if you wanted to access your instance
    variables from someplace else—for example, from inside your main routine? You
    can''t directly access because they are hidden. The fact that they are hidden
    from you is a key concept called data encapsulation. It enables someone writing
    class definitions to extend and modify the class definitions, without worrying
    about whether programmers (that is, users of the class) are encapsulation provides
    a nice layer of insulation between the programmer and the class developer.


    You can access your instance variables in a clean way by writing special methods
    to set and retrieve their values. We wrote: and setDenominator methods to set
    the values of the two instance variables in our Fraction class. To retrieve the
    values of those instance variables, you''ll need to write two new methods. For
    example, you will create two new methods called, appropriately enough, numerator
    and denominator to access the corresponding instance variables of the Fraction
    that is the receiver of the message. The result is the corresponding integer value,
    which you return. Here are the declarations for your two new methods:'
