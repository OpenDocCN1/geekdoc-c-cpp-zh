  md: 'set up the environment for the program loop. The program statement that immediately
    follows (which is, of course, terminated by a semicolon) can be any valid Objective-C
    program statement and constitutes the body of the loop. The statement is executed
    as many times as specified by the parameters set up in the statement.


    The first component of the for statement, labeled init_expression, is used to
    set the initial values before the loop begins. In Program 5.2, this portion of
    the for statement is used to set the initial value of n to 1. As you can see,
    an assignment is a valid form of an expression.


    The second component of the for statement specifies the condition(s) necessary
    for the loop to continue. In other words, looping continues as long as this condition
    is satisfied. Again referring to Program 5.2, the loop_condition of the for statement
    is specified by the following relational expression:


    n <= 200


    This expression can be read as "n less than equal to 200." The "less than or equal
    to" operator (which is the less than character [<] followed immediately by the
    equals sign [=]) is only one of several relational operators provided in the Objective-C
    programming language. These operators are used to test specific conditions. The
    answer to the test is yes (or "true") if the condition is satisfied and no (or
    "false") if the condition is not satisfied.


    Table 5.1 lists all the relational 5.1. Operators available in Objective-C.


