    # The Bitwise Exclusive-OR Operator


    The bitwise Exclusive-OR operator, which is often called the XOR operator, works
    as follows: For corresponding bits of the two operands, if either is a 1—but not
    both bits—the corresponding bit of the result is a 1; otherwise, it is a 0. The
    truth table for this operator is as shown.


    | b1 | b2 | b1 ^ b2 |

    |---|---||

    | 0 | 0 | 0 |

    | 0 | 1 | 1 |

    | 1 | 0 | 0 |

    | 1 | 1 | 0 |


