    Local variables are basic C data types have no default initial value, so you must
    set them to some value before using them. The three local variables in the reduce
    method are set to values before they are used, so that''s not a problem. Local
    object variables are initialized to nil by default. Unlike your instance variables
    (which retain their values through method calls), these local variables have no
    memory. Therefore, after the method returns, the values of these variables disappear.
    Every time a method is called, each local variable defined in that method is reinitialized
    to the value specified (if any) with the variable’s declaration.


