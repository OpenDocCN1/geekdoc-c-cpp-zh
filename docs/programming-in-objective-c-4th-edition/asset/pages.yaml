    start up the Xcode application. Select File, New, then New Project... Under iOS
    (and if you don''t see this in the left pane, you haven''t installed the iOS SDK),
    click on Application. You should see a window, as shown in Figure 21.3.


    # Figure 21.3. Starting a new iOS project.'
