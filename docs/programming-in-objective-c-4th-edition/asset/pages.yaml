  md: '# Arithmetic Expressions


    In Objective-C, just as in virtually all programming languages, the plus sign
    (+) is used to add two values, the minus sign (-) is used to subtract two values,
    the asterisk (*) is used to multiply two values, and the slash (/) is used to
    divide two values. These operators are known as binary arithmetic operators because
    they operate on two values or terms.


    # Operator Precedence


    You have seen how a simple operation such as addition can be performed in Objective-C.
    The following program further illustrates the operations of subtraction, multiplication,
    and division. The last two operations performed in the program introduce the notion
    that one operator can have a higher priority, or precedence, over another operator.
    In fact, each operator in Objective-C has a precedence associated with it.


    This precedence is used to determine how an expression that has more than one
    operator is evaluated: The operator with the higher precedence is evaluated first.
    Expressions containing operators of the same precedence are evaluated either from
    left to right or from right to left, depending on the operator. This is known
    as the associative property of operator.


