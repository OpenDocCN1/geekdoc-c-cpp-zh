    \ the preceding example. This else clause is executed if the game is over:\n\n\
    ```\nif ([chessGame isOver] == NO )\n    if ([chessGame whoseTurn] == YOU )\n\
    \        [chessGame yourMove];\nelse\n    [chessGame finish];\n```\n\nOf course,\
