    # How Things Work


    We would be remiss if we finished this chapter without tying a couple of things
    together. Because the Objective-C language has the C language underneath, it''s
    worth mentioning the connections between the two. You can ignore these implementation
    details or use them to better understand how things works, in the same way that
    learning about pointers as memory addresses can help you better understand pointers.
    We don''t get too detailed here; we just state four facts about the relationship
    between Objective-C and C.


    # Fact #1: Instance Variables Are Stored in Structures


    When you define a new class and its instance variables, those instance variables
    are actually stored inside a structure. That''s how you can manipulate objects;
    they''re really structures whose members are your instance variables. So the inherited
    instance variables plus the ones you added in your class comprise a single structure.
    When you allocate a new object using alloc, space is reserved to hold one of these
    structures.'
  merge: -1
  img_proc: true
- pgno: 472
  md: 'One of the inherited members (it comes from the root object) of the structure
    is a protected member called isa that identifies the class to which the object
    belongs. Because it''s part of the structure (and, therefore, part of the object),
    it is carried around with the object. In that way, the runtime system can always
    identify the class of an object (even if you assign it to a generic id object
    variable) by just looking at its isa member.


    You can gain direct access to the members of an object''s structure by making
    them @public (see the discussion in Chapter 10). If you did that with the numerator
    and denominator members of your Fraction class, for example, you could write expressions
    such as


    ```

    myFract->numerator

    ```


    in your program to directly access the numerator member of the Fraction object
    myFract. But we strongly advise against doing that. As we mentioned Chapter 10,
    it goes against the grain of data encapsulation.


    # Fact #2: An Object Variable Is Really a Pointer


    When you define an object variable such as a Fraction, as in


    ```

    Fraction *myFract;

    ```


    you''re really defining a pointer variable called myFract. This variable is defined
    to point to something of type Fraction, which is the name of your class. When
    you allocate a new instance of a Fraction, with


    ```

    myFract = [Fraction alloc];

    ```


    you''re allocating space to store a new Fraction object in memory (that is, space
    for a structure) and then storing the pointer to that structure = is returned
    inside the pointer variable myFract.'
  merge: -1
  img_proc: true
- pgno: 473
  md: 'When you assign one object variable to another, as in


    ```

    myFract2 = myFract1;

    ```


    you''re simply copying pointers. Both variables end up pointing to the same structure
    stored somewhere in memory. Making a change to one of the members referenced (that
    is, pointed to) by myFract2 therefore changes the same instance variable (that
    is, structure member) that myFract1 references.


    # Fact #3: Methods Are Functions, and Message Expressions Are Function Calls


    Methods are really functions. When you invoke a method, you call a function associated
    with the class of the receiver. The arguments passed to the function are the receiver
    (self) and the method''s arguments. So all the rules about passing arguments to
    functions, return values, and automatic and static variables are the same whether
    you''re talking about a function or a method. The Objective-C compiler creates
    a unique name for each function using a combination of the class name and the
    method name.


    # Fact #4: The id Type Is a Generic Pointer Type


    Because objects are referenced through pointers, which are just memory addresses,
    you can freely assign them between id variables. A method that returns an id type
    justly returns a pointer to some object in memory. You can then assign that value
    to any object variable. Because the object carries its wherever it goes, its class
    can always be identified, even if you store it in a generic object variable of
    type id.


