  md: 'The `if` statement tests the result of the expression evaluation. If the result
    is nonzero, the statement that immediately follows is executed; otherwise, the
    statement is skipped.


    The preceding discussion also applies to the evaluation of conditions inside the
    `for`, `while`, and `do` statements. Evaluation of compound relational expressions
    such as in the following statement proceeds previously:


    ```

    while ( char != ''e'' && count != 80 )

    ```


    If both specified conditions are valid, the result is 1, but if either condition
    is not valid, the result of the evaluation is 0. The results of the evaluation
    are then checked. If the result is 0, the `while` loop terminates; otherwise,
    it continues.


    Returning to [Program 6.10]() and the notion of flags, it is perfectly valid in
    Objective-C to test whether the value of a flag is true using an expression such
    as this:


    ```

    if ( isPrime )

    ```


    This expression is equivalent to the following:


    ```

    if ( isPrime != 0 )

    ```


    To easily test whether the value of a flag is false, you use the logical negation
    operator, `!. In the expression that follows, the logical negation operator is
    used to test whether the value of `isPrime` is false (read this statement as "if
    not `isPrime`")


    ```

    if ( ! isPrime )

    ```


    In general, an expression such as this one negates the logical value of `expression:`


    ```

    ! expression

    ```'
