    A definition for a name can include more than a simple constant value. It can
    include an expression and, as you will see shortly, just about anything else!


    The following defines the name TWO_PI as the product of 2.0 and 3.141592654:


    ```

    #define TWO_PI 2.0 * 3.141592654

    ```


    You can subsequently use this defined name anywhere in a program where the expression
    2.0 * 3.141592654 would be valid. So you could replace the return statement of
    the circumference method from the previous example with the following statement:


    ```

    return TWO_PI * radius;

    ```


    Whenever a defined name is encountered in an Objective-C program, everything that
    appears to be the right of the defined name in the #define statement is literally
    substituted for the name at that point in the program. Thus, when the preprocessor
    encounters the name TWO_PI in the return statement shown previously, it substitutes
    for this name whatever appeared in the #define statement for this name. Therefore,
    the preprocessor literally substitutes 2.0 * 3.141592654 whenever the defined
    name TWO_PI occurs in the program.


    The fact that the preprocessor performs a literal text substitution whenever the
    defined name occurs explains why you don''t usually want to end your #define statement
    with the semicolon. If you did, the semicolon would also be substituted into the
    program wherever the defined name appeared. If you had defined PI as


    ```

    #define PI 3.141592654;

    ```'
