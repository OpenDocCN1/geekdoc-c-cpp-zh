- pgno: 689
  md: '# 20. Introduction to Cocoa and Cocoa Touch


    Throughout this book you developed programs that had a simple user interface.
    You relied on the NSLog routine to display your output in the form of simple lines
    of text. However, as useful as this routine is, it is very limited in its capabilities.
    Certainly, other programs you use on the Mac or iPhone aren’t as unfriendly. In
    fact, the Mac’s reputation is based on its user-friendly dialogs and ease of use.
    Lucky for you, this is where Xcode and its built-in user interface design tool
    come to the rescue. Not only this combination offers a powerful environment for
    program development, consisting of editing and debugging tools, and convenient
    access to online documentation, but it also provides an environment for easily
    developing sophisticated graphical user interfaces (GUIs).


    The frameworks that provide the support for your Mac OS X applications to provide
    a rich user experience are called Cocoa, which actually consists of three frameworks:
    the Foundation framework, with which you are already familiar, the Core Data framework,
    for easily storing and managing data that is database-driven, and the Application
    Kit (or AppKit) framework. This last framework provides the classes associated
    with windows, buttons, lists, and so on.


    # Framework Layers


    A diagram is often used to illustrate the different layers that separate the application
    at the topmost level from the underlying hardware. One such representation is
    depicted in Figure 20.1.


    # Figure 20.1. The application hierarchy'
  merge: -1
  img_proc: true
- pgno: 690
  md: '![](img/6897a0c84e438cb4e5aad2d8a2fad0b8_690_0.png)


    # Computer Resources (memory, disk, display, etc.)


    The kernel provides the low-level communication to the hardware in the form of
    device drivers. It manages the system’s resources, which includes scheduling programs
    for execution, managing memory and power, and performing basic I/O operations.


    As its name implies, Core Services provides support at a lower or “core” level
    than that provided in the layers above it. For example, here you find support
    for collections, networking, debugging, file management, folders, memory management,
    threads, time, and power.


    The Application Services layer includes support for printing and graphics rendering,
    including Quartz, OpenGL, and Quicktime.


    Directly below your application sits the Cocoa layer. As noted, Cocoa includes
    the Foundation, Core Data, and AppKit frameworks. Foundation offers classes for
    working with collections, strings, memory management, the file system, archiving,
    and so on. AppKit'
  merge: -1
  img_proc: true
- pgno: 691
  md: 'provides classes for managing views, windows, documents, and the rich user
    interface for which Mac OS X is well known.


    From this description, there seems to be duplication of functionality between
    some of the layers. Collections exist in both the Cocoa and Core Services layers.
    However, the former builds on support of the latter. Also, in some cases, a layer
    can be bypassed or "bridged." For example, some Foundation classes, such as those
    that deal with the file system, rely directly on functionality in the Core Services
    layer and so bypass the Application Services layer. In many cases, the Foundation
    framework defines an object-oriented mapping of data structures defined in the
    lower-level Core Services layer (which is written primarily in the procedural
    C language).


    # Cocoa Touch


    iOS devices like the iPhone, the iPod Touch, and the iPad contain a computer that
    runs a scaled-down version of Mac OS X. Some features in the iPhone’s hardware,
    such as its accelerometer, are unique to the phone and are not found in other
    Mac OS X computers, such as MacBook Pros or iMacs.


    > Note

    Actually, Mac notebooks contain an accelerometer so the hard drive can be parked
    if the computer gets dropped; however, you can''t access this accelerometer directly
    from your programs.


    Whereas the Cocoa frameworks are designed for application development for Mac
    OS X desktop and notebook computers, the Cocoa Touch frameworks are for applications
    targeted for iOS devices.'
  merge: -1
  img_proc: true
- pgno: 692
  md: 'Both Cocoa and Cocoa Touch have the Foundation and Core Data frameworks in
    common. However, the UIKit replaces the AppKit framework under Cocoa Touch, providing
    support for many of the same types of objects, such as windows, views, buttons,
    text fields, and so on. In addition, Cocoa Touch provides classes for working
    with the accelerometer, gyroscope, triangulating your location with GPS and Wi-Fi
    signals, and the touch-driven interface, and also eliminates classes that aren''t
    needed.


    That concludes this brief overview of Cocoa and Cocoa Touch. In the next chapter,
    you learn how to write an application for the iPhone, using the simulator that
    is part of the iOS SDK.'
  merge: -1
  img_proc: true
- pgno: 693
  md: '# 21. Writing iOS Applications


    In this chapter, you''ll develop two simple iPhone applications. The first illustrates
    some fundamental concepts to familiarize you with using Interface Builder, making
    connections, and understanding delegates, outlets, and actions. For the second
    iPhone application, you''ll build a fraction calculator. It combines what you
    learned while developing the first application with what you learned throughout
    the rest of the book. The same principles you learn here can be used to develop
    applications for other iOS devices as well.


    # The iOS SDK


    To write an iPhone application, you have to install Xcode and the iOS SDK. This
    SDK is available free of charge from Apple''s Web site. To download the SDK, you''ll
    need to register to be an Apple Developer. That process is also free. To get the
    appropriate links, you can start at developer.apple.com and navigate to the appropriate
    point. It''s a great idea to become familiar with that site.


    The discussions in this chapter are based on Xcode 4.2 and the iOS SDK for iOS
    5. Later versions of either should be compatible with what''s described here.
    If you notice your screens look different than those shown, it may be because
    you''re using a different version of Xcode. In that case, check the forum at classroomM.com/objective-c
    for current information.


    # Your First iPhone Application


    The first application shows how you can put a black-colored window on the iPhone''s
    screen, allow for the user to press a button, and then display some text in response
    to the pressing of that button.'
  merge: -1
  img_proc: true
