    */

    ```


    Which style of comment you use is entirely up to you. Just note that you can''t
    nest the /* style comments.


    Get into the habit of inserting comment statements in the program as you write
    or type it into the computer, for three good reasons. First, documenting the program
    while the particular program logic is still fresh in your mind is far easier than
    going back and rethinking the logic after the program has been completed. Second,
    by inserting comments into the program at such an early stage of the game, you
    can reap the benefits of the comments during the debug phase, when program logic
    errors are isolated and debugged. Not only can a comment help you (and others)
