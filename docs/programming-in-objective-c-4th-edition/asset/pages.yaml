- pgno: 636
  md: '+   • The autorelease pool provides for the automatic release of objects when
    the pool itself is drained. The system does this by sending a release message
    to each object in the pool for each time it was autoreleased. Each object whose
    reference count goes down to 0 is sent a dealloc message to destroy the object.


    +   • If you no longer need an object from within a method but need to return
    it, send it an autorelease message to mark it for later release. The autorelease
    message does not affect the reference count of the object.


    +   • When your application terminates, all the memory objects take up is released,
    regardless of whether they were in the autorelease pool.


    +   • When you develop Cocoa or iOS applications, autorelease pools will be created
    and drained throughout execution of the program (this will happen each time an
    event occurs). In such cases, if you want to ensure that an autoreleased object
    survives automatic deallocation when the autorelease pool is drained, you need
    to retain it. All objects that have a reference count greater than the number
    of autorelease messages they have been sent will survive the release of the pool.


    # Automatic Reference Counting (ARC)


    Automatic reference counting (ARC) eliminates all the potential pitfalls associated
    with manual reference counting. Under the hood, reference counts are still being
    maintained and tracked. However, the system determines when to retain an object
    and when to autorelease or release it. You don''t have to worry about it at all.


    And you don''t have to worry about returning allocated objects from methods. The
    compiler figures out how that object''s memory needs to be managed by generating
    the correct code to autorelease or retain the returned object as necessary.'
