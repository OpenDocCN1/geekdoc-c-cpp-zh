    Applying a method to an object can affect the state of that object. If your method
    is to “fill up my car with gas,” after that method is performed, your car’s gas
    tank will be full. The method then will have affected the state of the car’s gas
    tank.


    The key concepts here are that objects are unique representations from a class,
    and each object contains some information (data) that is typically private to
    that object. The methods provide the means of accessing and changing that data.


    The Objective-C programming language has the following particular syntax for applying
    methods to classes and instances:


    ```

    [ ClassInstance method ] ;

    ```


    In this syntax, a left bracket is followed by the name of a class or instance
    of that class, which is followed by one or more spaces, which is followed by the
    method you want to perform. Finally, it is closed off with a right bracket and
    a terminating semicolon. When you ask a class or an instance to perform some action,
    you say that you are sending a message: the recipient of that message is called
    receiver. So another way to look at the general format described previously is
    as follows:


    ```

    [ receiver message ] ;

    ```


