- pgno: 88
  md: 'the purpose of the getter is to "get" the value of an instance variable stored
    in an object and send it back to the program. In order to do that, the getter
    must return the value of the instance variable using the return statement.


    Again, the idea that you can''t directly set or get the value of an instance variable
    from outside of the methods written for the class, but instead have to write setter
    and getter methods to do so is the principle of data encapsulation. So you have
    to use methods to access this data that is normally hidden to the "outside world."
    This provides a centralized path to the instance variables and prevents some other
    code from indirectly changing these values, which would make your programs harder
    to follow, debug, and modify.


    We should also point out that there''s also method called new that combines the
    actions of alloc and init. So this line could be used to allocate and initialize
    a new Fraction:


    ```

    Fraction *myFraction = [Fraction new];

    ```


    It''s generally better to use the two-step allocation and initialization approach
    so you conceptually understand that two distinct events are occurring: You''re
    first creating a new object and then you''re initializing it.


