    The variable triangularNumber is set equal to 0 before the for statement is declared.
    In general, you need to initialize all variables to some value (just like your
    objects) before you use them in your program. As you''ll learn later, certain
    types of variables are given default initial values, but it''s safer not to rely
    on that and you should set them anyway.


    The for statement avoids having to explicitly write each integer from 1 to 200.
    In a sense, this statement generates these numbers for you.


    The general format of the for statement is as follows:


    ```

    for ( init_expression; loop_condition; loop_expression )

    program statement

    ```


    The three expressions enclosed within the parentheses—init_expression, loop_condition,
    and loop_expression—'
