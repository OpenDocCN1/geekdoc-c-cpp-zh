    Luckily, you don''t need to concern yourself with the particular memory addresses
    assigned to variables—the system automatically handles them. However, the knowledge
    that each variable is associated with a unique memory address will help you understand
    the way pointers operate.


    Whenever you apply the address operator to a variable in Objective-C, the value
    generated is the actual address of that variable inside the computer''s memory.
    (Obviously, this is where the address operator gets its name.) So the statement


    ```

    intPtr = &count;

    ```


    assigns to intPtr the address in the computer''s memory that has been assigned
    to the variable count. Thus, if count were located at address 1000FF_16, this
    statement would assign the value 0x1000FF to intPtr.


    Applying the indirection operator to a pointer variable, as in the expression


    ```

