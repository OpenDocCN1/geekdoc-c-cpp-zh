    # Accessing Properties Using the Dot Operator


    The Objective-C language allows you to access properties using a more convenient
    syntax. To get the value of the numerator stored in myFraction, you could write
    this:


    ```

    [myFraction numerator]

    ```


    This sends the numerator message to the myFraction object, resulting in the return
    of the desired value. In Objective-C, you can also write the following equivalent
    expression using the dot operator:


    ```

    myFraction.numerator

    ```


    The general format here is:


    ```

    instance.property

    ```


    You can use a similar syntax to assign values as well:


    ```

    instance.property = value

    ```'
