  md: '# 19. Archiving


    In Objective-C terms, archiving is the process of saving one or more objects in
    a format so that they can later be restored. Often this involves writing the object(s)
    to a file so it can subsequently read back in. We discuss two methods for archiving
    data in this chapter: [property lists]() and key-valued coding.


    # Archiving with XML Property Lists


    Mac OS X applications use XML propertylists (or plists) for storing things as
    your default preferences, application settings, and configuration information,
    so it''s useful to know how to create them and read back in. Their use for archiving
