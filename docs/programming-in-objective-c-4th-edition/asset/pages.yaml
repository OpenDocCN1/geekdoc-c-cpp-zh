    It is no coincidence that the value 1 is typically used to represent the true
    or on state and 0 is used to represent the false or off state. This representation
    corresponds to the notion of a single bit inside a computer. When the bit is on,
    its value is 1; when it is off, its value is 0. But in Objective-C, there is an
    even more convincing argument in favor of these logic values. It has to do with
    the way the Objective-C language treats the concept of true and false.


    When we began our discussions in this chapter, we noted that if the conditions
    specified inside if statement are satisfied, the program statement that immediately
    followed was executed. But what exactly does satisfied mean? In the Objective-C
    language, satisfied means nonzero, and nothing more. Thus, the statement


    ```

    if ( 100 )\ NSLog("@This will always be printed.");

    ```


    results in the execution of the NSLog statement because the condition in the if
    statement (in this case, simply the value 100) is nonzero, and therefore, is satisfied.


    In each of the programs in this chapter, we used the notions of "nonzero means
    satisfied" and "zero means not satisfied." This is because, whenever a relational
    expression is evaluated in Objective-C, it is given the value 1 if the expression
    is satisfied and 0 if the expression is not satisfied. So, evaluation of the statement


    ```

    if ( number < 0 )

    number = -number;

    ```


    actually proceeds as follows: The relational expression number < 0 is evaluated.
    If the condition is satisfied—that is, if number is less than 0—the value of the
    expression is 1; otherwise, its value is 0.'
