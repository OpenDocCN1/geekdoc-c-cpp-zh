    # Working with the NSData Class


    When working with files, you frequently need to read data into a temporary storage
    area, often called a buffer. When collecting for subsequent output to a file,
    a storage area is often used. Foundation''s NSData class provides an easy way
    to set up a buffer, read the contents of the file into it, or write the contents
    of a buffer out to a file. And just in case you''re wondering, for a 32-bit application,
    an NSData buffer can store up to 2GB. For a 64-bit application, it can hold up
    to 8EB (exabytes) or 8 billion gigabytes of data!


