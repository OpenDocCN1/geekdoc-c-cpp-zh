- pgno: 26
  md: "# 2. Programming in Objective-C\n\nIn this chapter, we dive right in and show\
    \ you how to write your first Objective-C program. You won’t work with objects\
    \ just yet; that’s the topic of the next chapter. We want you to understand the\
    \ steps involved in buying a program and compiling and running it.\n\nTo begin,\
    \ let's pick a rather simple example: a program that displays the phrase \"Programming\
    \ is fun!\" on your screen. Without further ado, Program 2.1 shows an Objective-C\
    \ program to accomplish this task.\n\n# Program 2.1\n\n```\n// First program example\n\
    \n#import <Foundation/Foundation.h>\n\nint main (int argc, const char * argv[])\
    \ {\n    @autoreleasepool {\n        NSLog(\"Programming is fun!\");\\n    }\n\
    \    return 0;\n}\n```\n\n# Compiling and Running Programs\n\nBefore we go into\
    \ a detailed explanation of this program, we need to cover the steps involved\
    \ in compiling and running it. You can both compile and run your program using\
    \ Xcode, or you can use the"
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Clang Objective-C compiler in a Terminal window. Let''s go through the sequence
    of steps using both methods. Then you can decide how you want to work with your
    programs throughout the rest of this book.


    # Note


    You''ll want to go to developer.apple.com and make sure you have the latest version
    of the Xcode development tools. There you can download Xcode and the iOS SDK at
    charge. If you''re not a registered developer, you''ll have to register first.
    That can also be done at no charge. Note that Xcode is also available for a minimal
    cost from the Mac App Store.


    # Using Xcode


    Xcode is a sophisticated application that enables you to easily type in, compile,
    debug, and execute programs. If you plan on doing serious application development
    on the Mac, learning how to use this powerful tool is worthwhile. We just get
    you started here. Later we return to Xcode and take you through the steps involved
    in developing a graphical application with it.


    # Note


    As mentioned, Xcode is a sophisticated tool, and the introduction of Xcode 4 added
    even more features. It''s easy to get lost using this tool. If that happens to
    you, back up a little and try reading the Xcode User Guide, which can be accessed
    from Xcode help menu, to get your bearings.'
  merge: -1
  img_proc: true
