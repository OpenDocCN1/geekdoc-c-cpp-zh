    for you to explore and learn more concepts on your own with a separate Cocoa or
    iOS programming text.


    Figure 21.1 shows the first application you develop for the iPhone, running on
    the iPhone simulator (more about that shortly).


    # Figure 21.1. First iPhone application.'
