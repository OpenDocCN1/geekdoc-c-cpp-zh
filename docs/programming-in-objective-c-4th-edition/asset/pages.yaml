- pgno: 166
  md: "The if statements you've used so far in this chapter set up simple relational\
    \ tests between two numbers. Program 6.1 compared the value of number against\
    \ zero, whereas Program 6.2 compared the denominator of the fraction to zero.\
    \ Sometimes it becomes desirable, if not necessary, to set up more sophisticated\
    \ tests. Suppose, for example, you want to count the number of grades from an\
    \ exam that were between 70 and 79, inclusive. In such a case, you would want\
    \ to compare the value of a grade not merely against one limit, but against the\
    \ two limits 70 and 79 to ensure that it fell within the specified range.\n\n\
    The Objective-C language provides the mechanisms necessary to perform these types\
    \ of tests. A compound relational test is one or more simple relational tests\
    \ joined by either the logical AND or the logical OR operator. These operators\
    \ are represented by the character pairs && and || (two vertical characters),\
    \ respectively. For an example, the following Objective-C statement increments\
    \ the value of grades_70_to_79 only if the value of grade is greater than or equal\
    \ to 70 and less than equal to 79:\n\n```\nif ( grade >= 70 && grade <= 79 )\n\
    \    ++grades_70_to_79;\n```\n\nIn a similar manner, the following statement causes\
    \ execution of the NSLog if statement is less than 0 or greater than 99:\n\n```\n\
    if ( index < 0 || index > 99 )\n    NSLog(\"Error - index out of range\");\n```\n\
    \nThe compound operators can be used to form extremely complex expressions in\
    \ Objective-C. The Objective-C language grants the programmer the ultimate flexibility\
    \ in forming expressions, but this flexibility is a capability that programmers\
    \ often abuse. Simpler expressions are almost always easier to read and debug."
  merge: -1
  img_proc: true
- pgno: 167
  md: "When forming compound relational expressions, liberally use parentheses to\
    \ aid readability of the expression and avoid getting into trouble because of\
    \ a mistaken assumption about the precedence of the operators in the or expression.(The\
    \ && operator has lower precedence than any arithmetic or relational operator\
    \ but higher precedence than the || operator.) Blank spaces can also aid in the\
    \ expression's readability. An extra blank space around the && and || operators\
    \ visually sets these operators apart from the expressions they are joining.\n\
    \nTo illustrate the use of a compound relational test in an actual example, let's\
    \ write a program that tests whether a year is a leap year. We all know that a\
    \ year is a leap year if it is evenly divisible by 4. What you might not realize,\
    \ however, is that a year that is divisible by 100 is not a leap year unless it\
    \ is also divisible by 400.\n\nTry to think how you would go about setting up\
    \ a test for such a condition. First, you could compute the remainders of the\
    \ year after division by 4, 100, and 400, and assign these values to appropriately\
    \ named variables, such as rem_4, rem_100, and rem_400, respectively. Then you\
    \ could test these remainders to determine whether the desired criteria for a\
    \ leap year were met.\n\nIf we rephrase our previous definition of a leap year,\
    \ we can say that a year is a leap year if it is evenly divisible by 4 and not\
    \ by 100 or if it is evenly divisible by 400. Stop for a moment to reflect on\
    \ this last sentence and to verify to yourself that it is equivalent to the previously\
    \ stated definition. Now that we have reformulated our definition in these terms,\
    \ it becomes a relatively straightforward to translate it into a program statement,\
    \ as follows:\n\n```\nif ( rem_4 == 0 && rem_100 != 0 ) || rem_400 == 0 )\n  NSLog(\"\
    It's a leap year.\");\n```"
