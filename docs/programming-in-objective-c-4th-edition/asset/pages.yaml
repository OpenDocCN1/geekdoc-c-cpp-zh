    # # The Conditional Operator


    Perhaps the most unusual operator in the Objective-C language is one called the
    conditional operator. Unlike all other operators in Objective-C—which are either
    unary or binary operators—the conditional operator is a ternary operator; that
    is, it takes three operands. The two symbols used to denote this operator are
    the question mark (?) and the colon (:). The first operand is placed before the
    ?, the second between the ? and the :, and the third after the :.


    The general format of the conditional expression is shown here:


    ```

    condition ? expression1 : expression2

    ```


    In this syntax, condition is an expression, usually a relational expression, that
    the Objective-C system evaluates first when it encounters the conditional operator.
