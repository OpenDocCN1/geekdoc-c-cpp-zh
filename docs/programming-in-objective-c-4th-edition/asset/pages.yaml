    values of variables or trace the flow of program execution.


    The #ifdef, #endif, #else, and #ifndef Statements


    Unfortunately, a program sometimes must rely on system-dependent parameters that
    need to be specified differently on different devices (for example, an iPhone
    versus an iPad) or on a particular version of the operating system (for example,
    Leopard versus Snow Leopard.)


    If you had a large program that had many dependencies on the particular hardware
    and/software of the computer system (you should minimize this as much as possible),
