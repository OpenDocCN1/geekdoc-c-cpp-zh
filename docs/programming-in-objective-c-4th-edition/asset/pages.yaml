    # # Abstract Classes


    What better way to conclude this chapter than with a bit of terminology? We introduce
    it here because it''s directly related to the notion of inheritance.


    Sometimes classes are created just to make it easier for someone to create a subclass.
    For that reason, these classes are called abstract classes or, equivalently, abstract
    superclasses. Methods and instance variables are defined in the class, but no
    one is expected to actually create an instance from that class. For example, consider
    the root object NSObject. Can you think of any use for defining an object from
    that class?


    The Foundation framework, covered in Part II, "The Foundation Framework," has
    several of its so-called abstract classes. As an example, the Foundation''s NSNumber
    class is an abstract class that was created for working with numbers as objects.
    Integers and floating-point numbers typically have different storage requirements.
    Separate subclasses of NSNumber exist for each numeric type. Because these subclasses,
    unlike their abstract superclasses, actually exist, they are known as concrete
    subclasses. Each concrete subclass falls under the NSNumber class and is collectively
    referred as a cluster. When you send a message to the NSNumber class to create
    a new integer object, the appropriate subclass is used to allocate the necessary
