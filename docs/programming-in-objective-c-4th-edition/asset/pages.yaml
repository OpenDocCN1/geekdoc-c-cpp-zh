  md: 'The ones complement operator is a unary operator, and its effect is to simply
    ''flip'' the bits of its operand. Each bit of the operand is a 1 is changed to
    a 0, and each bit that is a 0 is changed to a 1. The truth table is provided here
    simply for the sake of completeness.


    | b1 | ~b1 |

    | 0 | 1 |

    | 1 | 0 |


    if wl is a short int that is 16 bits long and is set equal to hexadecimal a52f,
    then taking the ones complement of this value produces a result of hexadecimal
    5ad0:


    ```

    wl      1010 0101 0010 1111  0xa52f

    ~wl     0101 1010 1101 0000  0x5ad0

    ```


    The ones complement operator is useful when you don''t know the precise size of
    the quantity that you are dealing with in an operation, and its use can help make
    a program less dependent on the particular size of an integer data type. For example,
    to set the low-order bit of an int called wl to 0, you can AND with with an int
    consisting of all 1s except for a single 0 in the rightmost bit. So a statement
    in C as this one works fine on machines on which an integer is represented by
    32 bits:


    ```

    wl &= 0xFFFFFFFF

    ```


    If you replace the preceding statement with this one, wl will be ANDed with the
    correct value on any machine:


    ```

    wl &= ~1;

    ```


    This is because the ones complement of 1 will be calculated and consist of as
    many leftmost 1 bits as necessary to fill the size of an int (63 leftmost bits
    on a 64-bit integer system).'
