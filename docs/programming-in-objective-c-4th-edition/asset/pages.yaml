    \n\n# The while Statement\n\nThe while statement further extends the Objective-C\
    \ language's repertoire of looping capabilities. The syntax of this frequently\
    \ used construct is as follows:\n\n```\nwhile ( expression )\n    program statement\n\
    ```\n\nThe expression specified inside the parentheses is evaluated. If the result\
