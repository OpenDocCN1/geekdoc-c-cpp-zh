    The line


    ```

    @property (copy, nonatomic) NSString *name,

    *email;

    ```


    lists the attributes copy and nonatomic for the properties. The copy attribute
    says to make a copy of the instance variable in the setter method, as you did
    in the version you wrote. The default action is to not make a copy, but to instead
    perform a simple assignment(that''s the default attribute assign), an incorrect
    approach in this case which we have recently discussed.


    The nonatomic attribute says that you don''t need to worry about race conditions
    that could occur from multiple threads trying to access the instance variable
    at the same time. Chapter 18, "Copying Objects," discusses this topic in greater
    detail.


    Program 15.9 is the new AddressCard implementation file that specifies that the
    accessor methods are synthesized. (Note that we removed the explicit declaration
    of our instance variables here because we now have properties for them.)'
