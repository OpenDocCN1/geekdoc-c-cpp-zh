- pgno: 369
  md: '# 12. The Preprocessor


    The preprocessor provides the tools that enable you to develop programs that are
    easier to develop, read, modify, and port to different systems. You can also use
    the preprocessor to literally customize the Objective-C language to suit a particular
    programming application or your own programming style.


    The preprocessor is a part of the Objective-C compilation process that recognizes
    special statements that can be interspersed throughout a program. As its name
    implies, the preprocessor actually processes these statements before analysis
    of the Objective-C program itself takes place. Preprocessor statements are identified
    by the presence of a pound sign (#), which must be the first spacpace character
    on the line. As you will see, preprocessor statements have a syntax that is slightly
    different from that of normal Objective-C statements. We begin by examining the
    #define statement.


    # The #define Statement


    One of the primary uses of the #define statement is to assign symbolic names to
    program constants. The preprocessor statement


    ```

    #define  TRUE  1

    ```


    defines the name TRUE and makes it equivalent to the value 1. The name TRUE can
    subsequently be used anywhere in the program where the constant 1 could be used.
    Whenever this name appears, the preprocessor automatically substitutes its defined
    value of 1 into the program. For example, you might have the following Objective-C
    statement that uses the defined TRUE:


    ```

    gameOver = TRUE;

    ```'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'This statement assigns the value of TRUE to gameOver. You don’t need to concern
    yourself with the actual value you defined for TRUE, but because you know that
    you defined it to be 1, the preceding statement would have the effect of assigning
    1 to gameOver. The preprocessor statement


    ```

    #define FALSE 0

    ```


    defines the name FALSE makes its subsequent use in the program equivalent to specifying
    the value 0. Therefore, the statement


    ```

    gameOver = FALSE;

    ```


    assigns the value of FALSE to gameOver, and the statement


    ```

    if ( gameOver == FALSE )

    ...

    ```


    compares the value of gameOver against the defined value of FALSE.


    A defined name is not a variable. Therefore, you cannot assign a value to it unless
    the result of substituting the defined value is a variable. Whenever a defined
    name is used in the program, the preprocessor automatically substitutes into the
    program whatever appears to be the right of the defined name in the #define statement.
    It’s analogous to a search and replace with a text editor; in this case, the preprocessor
    replaces all occurrences of the defined name with its associated text.


    Note that the #define statement has a special syntax: No equals sign is used to
    assign the value 1 to TRUE. Furthermore, a semicolon does not appear at the end
    of the statement. Soon you will understand why this special syntax exists.'
