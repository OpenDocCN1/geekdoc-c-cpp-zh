    # Array Objects


    A Foundation array is an ordered collection of objects. Most often, elements in
    an array are of one particular type, but that’s not required. Just as mutable
    and immutable strings, there are mutable and immutable arrays. Immutable arrays
    are handled by the NSArray class, whereas mutable ones are handled by NSMutableArray.
    The latter is a subclass of the former, which means it inherits its methods.


