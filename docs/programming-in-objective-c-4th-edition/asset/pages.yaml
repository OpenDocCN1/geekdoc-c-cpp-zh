  md: '# 18. Copying Objects


    This chapter discusses some of the subtleties involved in copying objects. We
    introduce the concept of shallow versus deep copying and discuss how to make copies
    under the Foundation framework.


    Chapter 8, "Inheritance," discussed what happens when you assign one object to
    another with a simple assignment statement, such as here:


    ```

    origin = pt;

    ```


    In this example, origin and pt are both XYPoint objects with two integer instance
    variables called x and y.


    Recall that the effect of the assignment is to simply copy the address of the
    object pt into origin. At the end of the assignment operation, both variables
    point to the same location in memory. Making changes to the instance variables
    with a message such as


    ```

    [originX: 100 andY: 200];

    ```


    changes the x, y coordinate of the XYPoint object referenced by both the origin
    and pt variables because they both reference the same object in memory.


    The same applies to Foundation objects: Assigning one variable to another simply
    creates another reference to the object. So if dataArray and dataArray2 are both
    NSMutableArray objects, the following statements remove the first element from
    the same array that both variables reference:


    ```

    dataArray2 = dataArray;

    [dataArray2 removeObjectAtIndex: 0];

    ```'
