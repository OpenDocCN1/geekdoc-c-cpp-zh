  md: 'First, when you define a variable to be an object from a particular class,
    you are using what''s known as static typing. The word static refers to the fact
    that the type of object that will be stored in the variable is being explicitly
    declared. So the class of the object stored in that type is predetermined, or
    static. When you use static typing, the compiler ensures, to the best of its ability,
    that the variable is used consistently throughout the program. The compiler can
    check to ensure that a method applied to an object is defined or inherited by
    that class; if not, it issues a warning message. Thus, when you declare a Rectangle
    variable myRect in your program, the compiler checks any methods you invoke on
    myRect are defined in the Rectangle class or are inherited from its superclass.


    # Note


    Certain techniques make it possible to invoke methods that are specified by a
    variable, in which case the compiler can''t check that for you.


    However, if this check is performed for you at runtime anyway, why do you care
    about static typing? You care because it''s better to get your errors out during
    the compilation phase of your program than during the execution phase. If you
    leave it until runtime, you might not even be the one running the program when
    the error occurs. If your program is put into production, some poor unsuspecting
    user might discover when when running the program that a particular object does
    not recognize a method by having the program crash on her.


    Another reason for using static typing is that it makes your programs more readable.
    Consider the following declaration:


    ```

    id f1;

    ```


