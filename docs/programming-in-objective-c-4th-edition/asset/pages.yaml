  md: 'The primary change made to the NSLog statement is the inclusion of a field
    width specification. The characters %2i tell the NSLog routine not only that you
    want to display the value of an integer at that particular point, but also that
    the size of the integer to be displayed should take up at least two columns in
    the display. Any integer that would normally take less than two columns (that
    is, the integers 0-9) will be displayed with a leading space. This is known as
    right justification.


    Thus, by using a field width specification of %2i, you guarantee that at least
    two columns will be used for displaying the value of n; you also ensure that the
    values of triangularNumber will be aligned.


    # Keyboard Input


    Program 5.2 calculates the 200th triangular number, and nothing more. What if
    you wanted to calculate the 50th or the 100th triangular number instead? Well,
    if that were the case, you would have to change the program so that the for loop
    would be executed the correct number of times. You would also have to change the
    NSLog statement to display the correct message.


    An easier solution might be to somehow have the program ask you triangular number
    you want to calculate. Then, after you had given your answer, the program could
    calculate the desired triangular number. You can effect such a solution by using
    a routine called scanf. The scanf routine is similar in concept to the NSLog routine.
    Whereas the NSLog routine is used to display values, the purpose of the scanf
    routine is to enable the programmer to type values into the program. Of course,
    if you''re writing an Objective-C program that uses a graphical User Interface
    (UI), such as a Cocoa or iOS application, you likely won''t be using NSLog or
    scanf at all in your program.'
