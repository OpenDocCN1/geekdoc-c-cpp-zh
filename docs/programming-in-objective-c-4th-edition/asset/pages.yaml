    The NSString class contains more than 100 methods that can work with string objects.
    Table 15.2 summarizes some of the more commonly used ones, and Table 15.3 lists
    some of the additional methods that the NSMutableString class provides. Some other
    NSString methods (such as working with pathnames and reading the contents of a
    file into a string) are introduced to you throughout the remainder of this book.
    You should look at the documentation for the NSString class to just get a better
    idea of the wide variety of methods that are at your disposal.


    #  15.2. Common NSString Methods


    | Method | Description |

    |---|---|

    | +(id) stringWithContentsFile: path encoding: enc: err | Creates a new string
    and sets it to the contents of a file by using character encoding enc, returning
    error in err if non-nil |

    | +(id) stringWithContentsURL: encoding: enc: err | Creates a new string and sets
    it to the contents of url using character encoding enc, returning error in err
    if non-nil |

    | +(id) string | Creates a empty string |

    | +(id) stringWithFormat:nsstring | Creates a new string, setting it to nsstring
    |

    | +(NS*) stringWithFormat: format, arg1, arg2, arg3... | Creates a new string
    according to the specified format and arguments arg1, arg2, arg3... |

    | -(id) initWithNsstring | Sets a newly allocated string to nsstring |

    | -(id) initWithContentsFile: path encoding: enc: err | Sets a string to the contents
    of a file specified by path |

