  md: '# Using NSData to Create Custom Archives


    You might not want to write your object directly to a file using the archiveRootObject:ToFile:
    method, as was done in the previous program example. For example, perhaps you
    want to collect some or all of your objects and store them in a single archive
    file. You can do this in Objective-C using the data class NSData, which we briefly
    visited in Chapter 16, Working with Files.


    As mentioned in Chapter 16, an NSData object can be used to reserve an area of
    memory into which you can store data. Typical uses of this data area might be
    written to a file or perhaps to hold the contents of a file read from the disk.
    The simplest way to create a mutable data area is with the data method:


    ```

    dataArea = [NSMutableData data];

    ```


