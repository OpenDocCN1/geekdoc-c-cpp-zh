    A second loop is set to divide p by the integers 2 through p-1. Inside the loop,
    a test is performed to see whether the remainder of p divided by d is 0. If it
    is, you know that p cannot be prime because an integer other than 1 and itself
    divides it. To signal that p is no longer a candidate as a prime number, the value
    of the variable isPrime is set equal to 0.


    When the innermost loop finishes execution, the value of isPrime is tested. If
    its value is not equal to zero, no integer was found that evenly divided p; therefore,
    p must be a prime number, and its value is displayed.


    You might have noticed that the variable isPrime takes either 0 or 1, and no other
    values. Its value is 1 as long as p still qualifies as a prime number. But as
    a single even divisor is found, its value is set to 0 to indicate that p no longer
    satisfies the criteria for being prime. Variables used in such a manner are generally
    referred to as Boolean variables. A flag typically assumes only one of two different
