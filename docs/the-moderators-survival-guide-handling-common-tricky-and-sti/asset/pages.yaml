- pgno: 304
  md: '# APPENDIX B: PREPARING FOR A SUCCESSFUL SESSION


    +   - You may cut short areas of conversation to make sure you cover everything
    you need to.

    - You may not answer their questions right away.

    - The prototype may not be fully functional (if applicable).

    - They can take a break or end the session at any time.


    Reiterate the consent form, including how the data and recordings will be used.


    Ask the participant to turn off the ringer on her cell phone.


    Use a format that is easy for you to read.


    Consider how you''ll provide tasks to the participant. Will you read the tasks
    aloud? Will you send the tasks ahead of time (if the participant is remote)?


    Decide when you''ll provide compensation:


    +   - Unless you specify otherwise as part of the recruit, plan to provide compensation
    to participants if they''re late or do not seem to meet your recruit criteria.

    - Decide if you''ll give the compensation at the beginning or end of the session.


    # The product, space, and technology


    If you''re using a live website or application:


    +   - Ensure that no updates will happen during your research.

    - If A/B testing is performed on the website, see if there is a way for you to
    consistently access the same version (e.g., always the A version).


    If you''re using a prototype:


    +   - Work with your developers to make the prototype as functional as possible.

    - Build the illusion of functionality (e.g., by making all links look clickable)
    areas that cannot be prototyped in time for your study.


    Test and document your technical setup, including:


    +   - Any recording technology you''ll be using (e.g., Morae, camcorders) and
    the resulting files.

    - The product, on the device that the participant will use. For example, if you''re
    using a prototype of a website, open the prototype on the computer and in the
    web browser that the participant will use.

    - Any links and passwords required to access the product.

    - Any phone or audio conferencing systems you''ll be using.

    - Other devices that you plan to use to capture participant feedback (e.g., eye-tracking
    equipment).

    - Your screen-sharing application (both your process as the moderator and what
    the participant will experience when she joins the session).


