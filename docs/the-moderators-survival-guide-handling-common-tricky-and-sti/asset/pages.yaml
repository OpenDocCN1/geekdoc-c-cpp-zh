  md: '# 5.7 Participant thinks the session is a job interview


    The participant shows up in a polished suit and gives only positive feedback.
    At the end of the session, she hands you her resume and asks when she''ll hear
    back about the job!


    Method(s): In-person usability study; In-person interview

    Frequency: Rare

    Pattern(s) to apply: Take responsibility; Shift the focus; End the session early


    # What to do


    This misunderstanding may happen if you''re researching for a well-known organization.
    If someone is unemployed and expecting calls for interviews, she may feasibly
    misinterpret a research recruitment call for the other type of recruitment call.
    This can also accidentally happen if you have a waiting area for lots of different
    people—site visitors, job interview candidates, customers, and user researchers.
    It''s easy to bring in the wrong person, and believe us, things can get confusing
    and interesting after that.


    +   Be very clear and explicit in the beginning of the session about why the participant
    is there and what she''ll be doing. Hopefully any misunderstanding will surface
    at this time.


    +   If at any point you suspect that the participant is there for a job interview,
    try asking a couple of general questions. For example, ask what she made here
    today, or if she has participated in a user research session before, and reconfirm
    the recruiting criteria. If it''s still not clear, you might need to directly
    ask if she is there for the session.


    +   If the miscommunication becomes clear at the start of the session (e.g., when
    asking background questions), spare the poor participant further embarrassment
    and explain the actual purpose of the session. Take responsibility for the miscommunication
    and offer to cancel the session while still providing her with the full compensation.
    If you realize that you brought in the wrong person from the waiting area, quickly
    find the participant!


    +   If you''ve offered to end the session but the participant legitimately interested
    in participating, consider letting her continue (unless your actual participant
    is waiting for you). If she doesn''t fully meet the recruiting criteria, you could
    see if there is a way to let her stay and feel useful rather than that she wasted
    the travel time and a perfectly nice interview outlet. You may want to:


    +   Run the session anyway if she is able to get through the tasks and questions
    without needing specialized knowledge or skills. Just make note in your findings
    how this participant deviated from the recruiting criteria.'
