- pgno: 194
  md: '# 11.1 Remote participant is obviously distracted


    During a remote session, you hear the participant doing things that are obviously
    outside the realm of this study. Maybe you can hear their typing in a window that''s
    not being shared or is on a different monitor. There may be muffled conversations
    or noises in the background, and the participant may be slow to respond or entirely
    miss your questions.


    Method(s): Any remote method

    Frequency: Frequent

    Pattern(s) to apply: Clarify the task/question; Build engagement; Take a break;
    End the session early


    # What to do


    +   First, give the participant a subtle hint that you know something else is
    going on. Asking something like “Is this still a good time for you?” gives her
    an out in case she really has more important to deal with but feels too polite
    to say so. It also gives the participant a chance to share any complications within
    her environment. For example, participants within corporate environments (if you''re
    talking to employees who are participating from work) often find it impossible
    to try out the rest of the world for your research, and may be multitasking as
    you''re talking to them. The participant may tell you that she has to keep her
    email open during the session, or that it''s a very busy time and she may need
    to stop to talk with coworkers. In this case, you can offer to reschedule but
    you may need to accept that even so, she may still experience similar distractions.

    * If the participant is willing to continue and seems interested in receiving
    feedback, but is dealing with distractions outside of her control, focus on the
    most important tasks/questions you can make most of her limited feedback.

    * If the participant doesn''t respond to your hint or you get the sense that she
    is distracted, make a judgment on whether or not to continue the session, and
    if you continue, you can adapt to these circumstances. If you think the session
    may be salvageable, consider asking the participant questions that are more directly
    targeted to what she is doing (e.g., how her process works or parts of the product
    she uses often) instead of continuing with your planned tasks. Getting her to
    talk about herself may increase her engagement in the session. If this works,
    you can move back to your study plan, using the knowledge you''ve gained to tailor
    what comes next. However, if she seems distracted, tell the participant that you''ve
    covered everything you''d planned, and then wrap it early.


    The Moderator''s Survival Guide. http://dx.org/10.1016/B9978-0-12-404700-6.00011-0

    Copyright © 2014 Elsevier Inc. All rights reserved.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 11.1 Remote participant is obviously distracted (cont.)


    # What to say


    +   > "<Participant>, is now there''s something a good time for you?"

    > "It sounds like there''s something else going on. Do need to take a quick break
    before we continue with <task/question>?"\n> "There seem to be a number of things
    competing for your attention now. Are you able to continue with this study? If
    not, that''s fine, and we can reschedule."

    > "I know you''re very busy, I appreciate you taking the time to give us feedback."


    # What not to do or say


    +   - Hide your frustration or annoyance with the participant. Be polite and respectful.


    # How to avoid


    +   - Be upfront about your expectations for the session so the participant can
    reschedule any competing priorities and plan accordingly. But, recognize that
    this may not be enough and that interruptions could still come up.

    - During your recruiting process, ask the participant for the “best” time to conduct
    the session, and schedule her session for that time. Check with her day before
    to ensure that the scheduled time still works.


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_195_0.png)


    Watch Video 3 to see an example of a moderator interacting with a distracted participant
    during a remote usability study. The participant ends up sharing more than she
    intends.


    Visit our website (http://www.modsurvivalguide.org/videos) or use your QR reader
    to scan this code.


    # See also


    +   - 8.6 Participant is unwilling or unsure

    - 12.2 Something personal, inappropriate, or confidential is visible

    - 12.3 Participant is obviously distracted by external circumstances'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 11.2 Participant distressed by a personal line of questioning


    You''ve had to ask the participant some relatively personal questions and she
    starts to become uncomfortable and edgy. The tone of her voice changes, her voice
    gets louder or softer, and her answers become short and curt. You may tell outright
    that she is not comfortable answering certain questions. The questions you''re
    asking are part of your study plan and may be domain-specific, like online dating
    behaviors as part of a usability study for a dating website or the frequency that
    she she as part of an interview about disposable razors. Or, you may be asking
    some specific questions about her job (e.g., how a factory worker breaks rules
    to get something done more safely, easily, or efficiently).


    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Reassure the participant; Take a break


    # What to do


    +   Think about the participant''s expectations. If the participant was expecting
    to only talk in general about websites and is distressed by your questions about
    estate planning, try to make your questions broader and less personal to be in
    line with her expectations. If this isn''t possible, it''s best to just drop the
    topic if it means losing data point. The participant signed up to participate
    in an interview about online dating, then you can soften the personal nature of
    the questions you''re asking, but she shouldn''t be too surprised at the topic
    you''re exploring.

    Let the participant know if there are any questions that she''s not comfortable
    answering, she should tell you.

    Reassure the participant about how her answers will be used. For example, tell
    her that the feedback will be aggregated with the answers of other participants,
    and her name will not be associated with it. This reassurance will make the participant
    feel comfortable as possible sharing what she is willing to disclose.

    If the participant seems afraid of getting in trouble because of her answers (e.g.,
    because she is an internal employee and the research is for her organization),
    add to your reassurance remind she''s not being evaluated in any way on how she
    approaches her work or any other aspect of her life.

    If the participant is especially uncomfortable or agitated by your questions,
    offer to talk to her about in private, with any recording turned off. If she seems
    rattled, take a break, and when the session resumes, soften the personal questions
    or move on to another area of your study plan. If the participant still seems
    upset or agitated, bring the session to an early end.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 11.2 Participant is distressed by a personal line of questioning (cont.)


    # What to say


    +   - "Let me know if you''re uncomfortable answering any of my questions. While
    we want to learn as much as possible from you, I also want to respect your privacy
    and your comfort."

    - "I''m sorry, I didn''t mean to pry with that question. Let me rephrase..."

    - "Please know that anything you say will be kept confidential."

    - "Thank you for your feedback so far. I know these topics may be difficult to
    talk about, but your feedback will help us understand how to make the product
    better for you and others like you."


    # What not to do or say


    +   - Don''t ignore signs of the participant''s agitation or discomfort! Even
    if it means to adjust your planned tasks or questions, be empathetic toward the
    participant and do your best to make her more comfortable.


    # How to avoid


    +   - Both during the recruiting process and at the beginning of the session,
    set expectations regarding the type of topics that will be covered during the
    session, especially if any of your topics are personal. This advanced warning
    should reduce a participant''s surprise at your questions.


    # See also


    +   - 8.3 Participant looks or sounds uncomfortable and/or nervous'
  merge: -1
