- pgno: 192
  md: '# SURVIVAL STORY: "THE REQUEST CAUGHT ME OFF-GUARD"

    DANA DOUGLAS


    We were conducting a usability study with international researchers for a collaborative
    research website. The sessions were conducted remotely from our lab in Maryland
    with participants located around the world. One of the sessions was with a very
    pleasant man from Indonesia. At the beginning of the session as I was introducing
    the study, he asked permission to take a few-minute break when he heard the Islamic
    call to prayer, which he expected to sound during our session. While the request
    caught me off-guard, I knew that I wanted to respect him and make sure he felt
    comfortable with me, so I graciously agreed and proceeded with the session. Then,
    in the middle of the session as he was completing a task, we heard the call. At
    that point, he promptly excused himself and for the next few minutes I waited
    on the line for him to return. When he did, he thanked me and we picked up exactly
    where we left off.


    Since the goals of the study were more qualitative than quantitative, the effect
    that the interruption had on the findings was insignificant. While, the break
    was somewhat disruptive and caused the session to run a few minutes longer than
    planned, we were both able to smoothly transition in and out, and in doing so,
    I was able to respect his normal practices. This particular situation made it
    clear to me, to get the most valuable feedback, the most important thing is to
    create an environment (even in a remote situation) in which the participant is
    comfortable.'
  merge: -1
  img_proc: true
