- pgno: 149
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 8.6 Participant is unwilling or unsure


    When you ask the participant, “How was that experience for you?” or “What would
    you expect to happen there?” he answers, “I don’t know.” He may be giving one
    or two word answers—for example, “sure” or “I guess”—and not responding to your
    efforts to follow up or get him to go into more detail.


    Method(s): Any

    Frequency: Occasional

    Pattern(s) apply: Reassure the participant; Build engagement


    # What to do


    While participants really *don''t know*, if they give one- two-word responses
    repeatedly it usually indicates a problem. Two common causes are that participants
    are unwilling to put in effort or are unsure about how to articulate their thoughts.
    The former tends to be people who were forced to participate (e.g., by managers)
    or are just participating for the compensation. The latter can be anyone, but
    you can tell them that they’re struggling to find in words. The signs of a nervous/uncomfortable
    participant described in section 2.4 might also acquaint these responses.


    +   To address this situation at the very beginning of the session, or if it appears
    later in the session, as you notice it. Thank the participant for joining the
    session and tell him how much feedback will be needed.


    +   Keep encouraging the participant throughout the session. Without interrupting
    their workflow or train of thought, continually ask for the participant''s feedback
    so he knows his opinion matters.


    +   If the participant seems to have trouble articulating his thoughts, be not
    to rush him. Sometimes a little bit of extra time is all that is needed. If the
    time doesn''t seem to help, you can ask a question a different way or to narrow
    the range of possible answers. For example, instead of, “How was your experience
    using vacuum?” ask “Was your experience with this vacuum same, better, or worse
    than the other vacuums you’ve used?”


    +   If the reluctance stems from nervousness, use some of the techniques outlined
    in section 8.3 to alleviate his nerves.


    +   If your session is held remotely, the participant may be distracted and doing
    other things, which may make him seem unwilling to put in any effort. See section
    11.1 for more discussion on this situation.


    +   Despite your best efforts, the participant still seems drazled and unwilling
    to put in a good effort, don not lose hope. Instead of being annoyed at him, change
    your perspective and see the situation as a challenge. Try to get him engaged
    in the session by making your


    148'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 8.6 Participant is unwilling or unsure (cont.)


    task/question more personal. One of the most satisfying things for a moderator
    is watching a participant go from moody or annoyed to calm and engaged during
    the course of a session.


    # What to say


    Before the session:


    +   - Thanks so much for participating. I know we''re taking time out of your
    busy day, but I want you to know that your feedback is extremely important to
    us. You''re helping us make the product better.


    +   - Hopefully this session will be a fun break from your typical work."


    During the session:


    +   - This is just the kind of feedback we want to hear."


    +   - All of this has been very helpful to hear and see. Thank you for your continual
    feedback.


    +   - To try to personalize: "Have you ever tried to do this, or anything like
    this, before? Tell me about your experience."


    # What not to do or say


    +   - Try not to get frustrated with the participant, as it may lead him to be
    more closed down and resentful.


    # How to avoid


    +   - Participants should never be forced to participate. Sometimes we leave recruiting
    to others who have access to the right people, like call center managers or representatives
    at a target organization. They don''t always know the ins and outs of research,
    and don''t know the trickle-down effect that their decisions can have on the quality
    of the research. If they''re not positioning the research as valuable, or worse,
    are are coercing participants to take part, you''ll end up with participants who
    may not be interested in pushing the effort.


    +   - We suggest working closely with recruiters to make sure you''re finding
    people to volunteer voluntarily and that the participants know ahead of time what
    to expect. Refer to 15.1 for more discussion.


    # See also


    +   - 6.3 Participant is nots to questions


    +   - 11.1 Remote participant is obviously distracted'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # Survival Story


    # SURVIVAL STORY: "SHE LOOKED AGITATED"

    CAROL PETERSON


    My colleagues and I were doing onsite testing of Windows-based search and retrieval
    software, not all of whom had experience with Windows since the early 1990s. Our
    users were librarians, not of a lot of catalogs were still on text-based mainframe
    systems. We had told our recruiter we wanted participants with at least some Windows
    experience.


    Our participant arrived, and I welcomed her and explained she was trying to do
    some search tasks on the computer ... we had brought. I told her she could start
    the first task so she turned to the computer ... and just sat there, not saying
    or doing anything. After a bit, I asked her what she was thinking. She didn''t
    answer me and looked agitated. After another silence that seemed interminable,
    she suddenly got up, "excuse me," and quickly left the room.


    My colleagues (who were acting as observers) and I looked at each other in confusion.
    Several minutes passed, during which we wondered what had happened and if she
    was going to come back—we had no idea where she had gone or why.


    Finally, after about 10 minutes she did return, still looking nervous. She told
    me she had been very anxious about the test to begin with, and when she saw the
    computer screen, she didn''t know what to do since she had never used a mouse—she
    needed to leave to compose herself.


    Of course I immediately reassured her, apologizing for her angst, etc., while
    my head was frantically thinking of ways I could salvage from the study. Fortunately,
    that time Windows was new enough it included mini-tutorials on how to use a mouse
    and work with the desktop. And even more fortunate, I actually remembered her.
    I asked if she wanted to try one of the tutorials to learn the mouse, and she
    was willing. After completing the tutorial, she calmed down and felt competent
    enough to try some of the tasks.


    We didn''t get a feedback on the software, but I learned some valuable lessons:


    +   - Ensure your recruiter understands which criteria are "make or break”—they
    must understand not only what will qualify a participant, but what will disqualify
    one.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Survival Story (cont.)


    +   - Get to know the participant. When the participant first arrives, before
    I talk about the tasks I want them to perform, I ask them to briefly describe
    their background and their current job. Talking about a known topic helps relax
    the participant, plus it gives me a chance to judge whether there are any potential
    gaps in their knowledge that will affect the test.


    +   - Stay flexible during the test. If I hadn''t been able to adapt, not only
    would we have missed a chance to get data, but we would have left the participant
    feeling awful, which in my mind is even worse.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# CHAPTER 9


    # What''s Going On?

    Recovering from External Interruptions


    Your session is going smoothly until something or someone interrupts the flow.
    Or, your session time may have started but the participant is nowhere to be found.
    These situations involve regaining control, limiting the possibility of future
    interruptions, and moving forward with a recovery plan.


    +   9.1 Participant is running late

    9.2 Observers are loud and distracting

    9.3 Participant receives a call during the session

    9.4 Participant cancels or is a no-show

    9.5 Observer unexpectedly interacts with the participant

    9.6 Session interrupted accidentally by an observer or someone else

    9.7 Session interrupted by someone the participant knows'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 9.1 Participant is running late


    The session was scheduled to start 20 minutes ago. You have a room full of observers,
    some of whom flew into town to watch your research. You have no idea whether or
    not the participant is stuck in traffic or just decided not to show up. You need
    to track down the participant while managing any observers or stakeholders, prioritizing
    your study plan for a truncated session, and preparing for the possibility of
    a no-show.


    Method[s): Any

    Frequency: Frequent

    Pattern(s) to apply: Take responsibility; Shift the focus


    # What to do


    This situation is especially challenging due to its unpredictability. You may
    have no idea whether the participant is going to be slightly late, extremely late,
    or a no-show. If your study is in an urban area, the participant may be stuck
    in traffic or on a broken-down train—sometimes even the most conscientious participants
    fall victim to a city''s transportation hazards.


    +   - If you are using a recruiter, reach out to her to see if the participant
    has contacted her. If the participant hasn''t been in touch, ask the recruiter
    to call the participant (or give you the participant''s phone number) to check
    her status—is she late, or not coming?

    - While waiting for the participant, identify how you can adjust the study plan
    or method based on she arrives. For example, if you''re running a summative study,
    you may have a very late participant to attempt a few tasks so you have more data,
    where for a more formative study, you might decide to do a product walkthrough
    instead where you bring the participant to specific areas rather than asking her
    to get there on her.

    - Consider putting a quick survey or written version of your background questions
    that you can ask the participant to quickly fill out her. For more on this, see
    15.2.

    - If you have a floater or backup participant available, consider starting with
    her instead. If your scheduled participant arrives, you can step out to thank
    her for coming in, provide her with compensation, and let her know that she can
    leave early.

    Update all your observers on the session''s status, especially if you have remote
    observers who may be wondering what''s happening when you''re talking to the in-facility
    observers. A good solution, if applicable, is to enter text on the computer or
    device being shared with the observers, letting them know that the participant
    hasn''t arrived yet (or any other status update necessary).'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 9.1 Participant is running late (cont.)


    +   - If you have remote participants who you''re trying to get in touch with,
    leave a status message for observers. For example, “9:05 a.m.: Tried calling participant,
    but no answer. Will try again in five minutes.” We suggest not using a screen-sharing
    program’s chat feature for this, as the participant may see the entire conversation
    later. Something like a document or text files icy. If you get in touch with the
    participant, close the document before you bring her in to the remote session.

    - If the participant arrives late, be gracious and sincerely thank her for coming
    in.

    - If the participant arrives extremely late and even a little bit of feedback
    will be helpful, consider running an abbreviated session.

    - If she is staying to stay, and your schedule allows for spilling over, continue
    with the session past the scheduled end. Just sure not to go beyond the total
    number of minutes for the participant was promised compensation.

    - If she is unwilling or unable to stay to make up for the last time, bring her
    through as much of the prioritized parts of the session as time permits.

    - If she is so late then unable to stay, let her know you’re unable to run the
    session with her. If she asks for her compensation, provide it to her unless you
    specified the session was contingent on arriving by a certain time. For more on
    this, consider section 15.2.


    # What to say


    To observers (in the example of shifting session focus to a product walkthrough):


    +   - “I’d like to use the 20 minutes we have with the participant to just do
    a quick walkthrough of the design. So for this session only, I’ll be showing things
    and asking for feedback, rather than having her attempt tasks on our. I think
    this is the best way to obtain feedback on all the important parts of the design
    in a short amount of time. Does that sound okay to you?”


    When the participant arrives/starts:


    +   - “Because we’re getting started later than planned, are you able to stay
    after your scheduled time so we can get as much of your feedback as possible?
    About how long can you stay?”


    If you need to dismiss the participant:


    +   - “I’m sorry, <we won’t have enough time to run the session/we’ve started
    the session with another participant>. I know you did your best getting here,
    so we’d still like to compensate you and give you some time back in your day.”'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 9.1 Participant is running late (cont.)


    # What not to do or say


    +   - Don''t blame the participant for being late, no matter how frustrated or
    irritated you are.

    - Avoid making veiled comments about how much you had planned to get through if
    the participant had been on time.


    # How to avoid


    +   - Ask the recruiter to ensure participants arrive 15 minutes early to fill
    out forms or to "check in." If there are typically traffic or parking issues in
    a particular area, or a known event or construction is happening, the recruiter
    warn participants about scheduling extra travel time and suggest alternative methods
    of transportation.

    - Obtain the participants'' cell phone numbers so you can call them directly if
    they''re running late. Ensure that the participants also have a contact phone
    number for you and your recruiter in case they''re running late.

    - Schedule backup or floater participants for sessions when it''s extremely important
    not to have a late or no-show participant (discussed more in section 15.1).

    - If budget is a concern for your study, consider working out an arrangement with
    the recruiter where, if the participant is not at your location within a certain
    number of minutes of her scheduled time, she''ll not receive her compensation.
    If you do explore this option, we recommend recommend having a backup or floater
    system so you don''t end up with empty timeslots. Include the use of floaters
    in your proposal to the stakeholders who manage your research budget, although
    keep in mind that this system probably won''t reduce your compensation costs.


    # See also


    +   - 9.4 Participant cancels or is a no-show'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# 9.2 Observers are loud and distracting


    > You have a number of observers for your session, all watching from a room where
    you and the participant are working. You (and the participant) can hear the observers
    laughing, yelling, or just talking loudly. The participant may ask you if the
    observers are laughing because of something she did.


    **Method(s):** Any in-person method

    **Frequency:** Frequent

    **Pattern(s) to apply:** Take responsibility; Reassure the participant; Take a
    break


    # What to do


    As we saw in the opening survival story in Chapter 1, hearing observers laugh,
    snicker, sigh, or otherwise react can be an awkward and humiliating experience
    for both you and the participant.


    +   - If the observers are loud, but not laughing, take responsibility for their
    rudeness and apologize to the participant for the interruption. Excuse yourself
    to the observers to quiet down for the remainder of the session.

    - If the observers are in another room, remind them that you are able to hear
    them through the walls and that the participant is also able to hear them.

    - If the observers are in the room with you and causing the distraction, take
    them outside the room for a brief chat and stay quiet for the remainder of the
    session.

    - Regardless of where they''re located, the observers know that even if they''re
    laughing at something unrelated to the participant or the session, the participant
    may feel like she is being laughed at, which will affect her behavior and comfort.


    +   - If the observers were laughing, reassure the participant that she is not
    being laughed at, even if you think that is what the observers were doing. Try
    to make her comfortable, even if you have to use a pretext for the observers''
    behavior, such as:

    - (If it''s not obvious where the sound is coming from): "There another meeting
    space next door and there might be another meeting going on."

    - "The observers often get into intense conversations about the product and stop
    paying attention to the session, so you''re just hearing part of their discussion."'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 9.2 Observers are loud and distracting (cont.)


    # What to say


    To excuse yourself so you can ask the observers to be quiet:


    +   - «Participant», I apologize for the noise. Please excuse me while I ask the
    people next door to be quiet.


    To the observers:


    +   - “I want to let you know that the participant and I are able to hear you.
    This is making the participant feel very uncomfortable, and that is my number-one
    priority, so forgive me for being direct—if you aren''t able to be quiet in here,
    please go to another part of the building. Remember that our participant is giving
    her time to us and deserves to be treated with respect.”


    If participant asks whether she was being laughed at:


    +   - “No, the observers are definitely not laughing at you. Right now they''re
    probably discussing the best way to address the issues you''ve uncovered today.
    I''m going to remind them to keep their voices down.”


    +   - “No, absolutely not. Everyone observing is really grateful for your feedback.
    You just sometimes stop watching the session and become distracted by other conversations,
    and get out of it. I''ll talk to them to make sure they pay attention!”


    +   - “I think that was actually sound coming from another conference room on
    the other side of this area, and they may not know we have a study going on. Excuse
    me for a moment while I go let them know.”


    # What not to do or say


    +   - Don''t let the participant she is being laughed at, or that the loudness
    coming from the next room has anything to do with her or her actions.


    # How to avoid


    +   - Provide ground rules for observers ahead of time that include remaining
    quiet during a session, and let them know that they''re required to take them
    seriously. See section 15.4 for more about these ground rules.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 9.2 Observers are loud and distracting (cont.)


    # See also


    +   - 6.9 Observers are not engaged in the session

    - 9.5 Observer unexpectedly interacts with the participant

    - 9.6 Session interrupted accidentally by an observer or someone else

    - Survival Story: “Are they laughing at me?” at the start of Chapter 1'
  merge: -1
