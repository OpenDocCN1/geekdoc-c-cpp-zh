- pgno: 40
  md: '# CHAPTER 2


    behave ethically as a user researcher. As a quick cheat sheet, here are the key
    things to remember when interacting with your participants:


    +   - Do no harm, and if possible, provide benefits. As discussed with Chapter
    1, there is always level of stress associated with participating in user research.
    However, your responsibility as a moderator is to keep that stress—whether physical,
    mental, or emotional—from reaching an unreasonable level.

    - Act with integrity. Be respectful toward the participant, no matter who he or
    what does.

    - Respect the participant''s privacy, confidentiality, and anonymity. Make sure
    he has informed consent, and that he knows the steps you''ll take to avoid disclosing
    his personal information.


    Ensuring the participant’s physical comfort is fairly easy to accomplish. Let
    him know that he is welcome to take a break at any time and, if possible, offer
    him a beverage. If he seems uncomfortable in the research space (e.g., because
    the chairs are at an awkward height or size for him or the air conditioning is
    noisy), make whatever adjustments you can to keep the environment as welcoming
    and stress-free as possible.


    The participant''s psychological comfort can be more challenging to maintain,
    especially when he is asked to interact with a product that has major usability
    issues or he is being interviewed about a sensitive or private situation. However,
    keep in mind that if a participant is struggling or growing frustrated with a
    usability study task, his comfort is not necessarily threatened. In fact, struggle
    often fulfills a common goal of research, which is to identify problem areas.
    The participant’s struggle serves the purpose of making better for future users.


    If, the participant berates himself for being stupid or unable to figure something
    out, or exhibits more than one of the signs of an uncomfortable participant (Table
    2.4), you need to alleviate his discomfort. A participant who leaves a session
    disgruntled or unhappy is an unhappy customer (potential customer). Given how
    easy it is to share negative reviews and experiences via social media, you must
    avoid any potential damage to the credibility of your research or organization.


    If the participant seems uncomfortable, be careful not to assign any blame to
    him. Remember that he is in an unfamiliar environment (home), or may be stressed
    by a stranger (you) around his comfortable environment. He may be under a lot
    of stress unrelated to the session, such as childcare issues or tight work deadlines.
    Even if there is nothing external


    Pay attention to context when evaluating the participant''s comfort level. He
    may be sweating because he is nervous, or because the environment is set too high.
    But if he is sweaty and calling him stupid, he is probably uncomfortable.


    # 33'
