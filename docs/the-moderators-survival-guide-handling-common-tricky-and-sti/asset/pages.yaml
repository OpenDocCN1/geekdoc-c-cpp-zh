  md: '► There should be no conversation or discussion, and absolutely no laughing
    or even throwing meaningful looks at other-room observers.


    ► Avoid multitasking (the appearance of multitasking). Pay attention!


    ► Avoid disruptions (stepping out, etc.) unless necessary.


    ► Know if, when, and how to interact with the participant, based on a conversation
    before the session. For example:


    +   ■ The observer should not help the participant complete tasks or answer questions.


    +   ■ Is the observer experienced talking to users? If so you may let her ask
    questions the participant directly during the session or at the end. Or, if you''re
    less comfortable with that, have her write down questions on notes and (subtly)
    pass them to you.


    When observers are observing remotely, include additional ground rules:


    +   ► Keep the phone or voice over IP (VoIP) functionality on mute at all times
    unless otherwise. This includes situations when it seems the participant has dropped
    off the call or has hung up. As in-person observer, the observer should know if
    to interact with the participant at all, and when (e.g., at the end of the call
    when the moderator opens up the line for questions.


    +   ► Know how and when to interact with you, as described in the preceding points.
    Communicating via an IM application can be very useful when you have remote observers.
    As discussed earlier, clear with the observers about whether or how you might
    react to their IM requests and questions.


    | | Watch Video 5 to see an example of a moderator dealing with an interrupting
    observer in a contextual inquiry. The moderator pulls the observer out of the
    room to reiterate the session ground rules. |


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_287_0.png)


    Visit our website (http://www.modsurvival.org/videos) or use your QR reader to
    scan this code.


    # 15.5 Your technique


    Before you moderate your first session for a study, review:


    +   ► The list of prefabricated phrases from Appendix A. If you''re new to moderating,
    jot a couple of the phrases in your study plan to reference throughout the study.


    +   ► The guidelines for your language and tone from section 2.5.


    +   ► The list of moderator behaviors to avoid from section 2.3.'
