- pgno: 134
  md: '# 7.5 Prototype or product changes unexpectedly


    During a usability study session, you notice that something in the prototype has
    been changed since the prior session or even earlier in the same session. The
    change may be something like a new label for a link or a button, updated content,
    or different color choices for graphical elements. Similar mayhem may occur if
    you''re asking participants to use a live product. If the product development
    isn''t frozen during your research, you may notice subtle or not-so-subtle design
    changes!


    Method(s): Usability study

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Take a break


    # What to do


    +   Play it cool. Remember that you''re in charge of the session, and it won''t
    help the participant if you started or surprised by something that she is giving
    feedback on.

    If you see more than one (or are very concerned about the one change you see),
    excuse yourself from the room and talk with the designers/developers to identify
    what has been changed, and why. Explain that you need to know because the questions
    in your study plan are carefully calculated to not be leading or use any of the
    terms from the product''s user interface, and you may need to readjust your study
    plan accordingly.

    If you feel that the changes made were not helpful or unnecessary, ask if there
    is a way to “roll back” to the earlier version of the prototype or product. Changes
    in the middle of a study may ruin the integrity of your data if the goal of the
    study is to gather summary (quantitative data) that measures the experience. But,
    you might also consider changes unhelpful or unnecessary if:

    The change was only based on the feedback of one or two participants (assuming
    that you''re testing with a larger number than)

    The change violates design and usability best practices.


    # What to say


    If the participant notices the change (because the change happened after she had
    already interacted with the product):


    +   “Yes, it looks like the team was eager to start adjusting the design based
    on your feedback. What do you think about this change?”'
  merge: -1
  img_proc: true
