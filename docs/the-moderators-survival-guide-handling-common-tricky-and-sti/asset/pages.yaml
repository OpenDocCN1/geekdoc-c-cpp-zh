- pgno: 106
  md: '# 6.1 Participant reluctant to say anything negative (cont.)


    # What to say


    To the participant:


    +   - "I know that this is a product you’re required to use in your job, but tell
    me candidly..."

    - "Please know that your honesty is appreciated. Nothing you say will hurt anyone’s
    feelings. You’re here to help us make the product better for yourself and future
    users."


    To observers:


    +   - "I get sense that this participant was worried about offending someone with
    his feedback. So I just to remind all of you, for him and our other participants,
    please respect the participant’s confidentiality and feedback. Don’t approach
    the participant to discuss his participation or talk to one about another since
    he is an employee here."


    # What not to do or say


    +   - Avoid making the participants feel like you don’t believe them. If you suspect
    a participant is not being entirely honest, don’t say, “It’s okay, you can tell
    the truth,” or “Could you tell me how you really feel?”


    # How to avoid


    +   - Set expectations with the participant that his data will be kept confidential,
    and that his superiors or team members are not observing the session and will
    not have access to the raw identifiable data from the study.


    # See also


    +   - 6.7 Participant does not have any negative feedback

    - 8.3 Participant looks or sounds uncomfortable and/or nervous

    - 10.5 Participant gives vague responses to questions'
  merge: -1
