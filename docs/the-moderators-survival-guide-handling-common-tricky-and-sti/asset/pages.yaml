  md: '# LIST OF VIDEOS


    All these videos are available on our website at http://www.modsurvivalguide.org/videos.
    You can also use your QR reader to scan the code for each video.


    | Video | QR Code | Description |

    |---|---|---|

    | 1 | | Watch Video 1 to see an example of a moderator interacting with a self-blaming
    participant during a usability study. The participant is very nervous about the
    session and is looking for affirmation. |

    | 2 | | Watch Video 2 to see an example of a moderator working with a participant
    who is distracted by external circumstances during a usability study. The participant
    is reluctant to leave the session early even though he is distracted and has trouble
    focusing. |

    | 3 | | Watch Video 3 to see an example of a moderator interacting with a distracted
    participant during a remote usability study. The participant ends up sharing more
    than she intends. |

    | 4 | | Watch Video 4 to see an example of a moderator dealing with a flirtatious
    participant during a usability study. The participant starts off being friendly
    but becomes more forward as the session progresses. |

    | 5 | | Watch Video 5 to see an example of a moderator dealing with an interrupting
    observer during a contextual inquiry. The moderator pulls the observer out of
    the room to reiterate the session ground rules. |

    | 6 | | Watch Video 6 to see an example of a participant who is expecting an interview
    inside of a contextual inquiry. The moderator clarifies her expectations, but
    has to repeat them couple of times as the session progresses. |

    | 7 | | Watch Video 7 to see an example of a moderator realizing that the participant
    scheduled for an interview lacks the necessary experience. The moderator discusses
    what to do with a stakeholder and finds a way to adapt the session. |'
