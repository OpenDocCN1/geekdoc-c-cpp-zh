- pgno: 275
  md: 'Many of the situations described in Part 2 can be mitigated earlier in the
    session or prevented entirely ahead of time. This chapter compiles the tips we
    provide in each situation’s “How to avoid” section to help reduce the chances
    of you encountering, or make it easier to deal with, many of the situations discussed
    earlier, especially the occasional and rare situations. This isn''t intended to
    be a comprehensive list of everything you need to prepare for a successful study,
    but instead highlights the key topics—from expectation setting to technical tinkering
    to practicing and preparing your space.


    # 15.1 Recruiting process


    We hate horrible feeling you get when you realize the participant had completely
    different expectations for your session, or you have a room full of high-level
    observers who are lousy because the participant is running late. These tips help
    you set expectations with participants and plan ahead for situations you absolutely
    cannot have a late or no-show participant.


    Appendix summarizes steps in this chapter, and Appendix C lists books that go
    into more detail about planning user research.


    # Specify your recruit criteria


    It doesn’t matter how carefully you crafted your study plan or how sharp your
    motivating skills are if the participant doesn’t meet the necessary criteria.
    As you prepare for your recruit, think carefully about the must-haves that your
    participants need to provide the desired feedback. Craft your list of criteria
    carefully to avoid any deal-breakers.


    Potential must-haves may include participants:


    +   - **Have the desired experience or role.** You can''t just join on jobs to
    figure out if a participant is really who you''re looking for. Instead, think
    the specific tasks or attributes that you need to her. For example, if you need
    to get feedback on a new timesheet approval, it will not be enough to recruit
    managers—you need to verify that participants have direct reports whose timesheets
    approve.

    **Representative users.** Recruiting unresponsive users often happens when you
    ask someone within your organization to recruit internal employees. For example,
    if you need to interview sales managers, the person scheduling participants may
    only find you the top performing managers. Communicate that you want truly representative
    users—an average sample.

    Set up to show what you need.** For example, if you’re visiting participants at
    home to watch their process for doing laundry, make sure that have dirty laundry
    at the time of the scheduled session.


    For additional tips on how to build a recruiting screener and find qualified participants,
    see Rubin and Chisnell (2008).


    By being specific about these criteria ahead of time, you’hopefully avoid any
    unpleasant surprises once your session start!'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Set participant expectations through the recruit


    To avoid a mismatch between your expectations and those of your participants,
    it''s important to be crystal clear with the recruit about what participants will
    be doing during the session. Important elements to highlight include:


    +   - The type of research (e.g., a usability study, an interview), along with
    a brief description of what this means. Participants are sometimes intimidated
    to find out that they will be working through tasks in a usability study when
    they assumed they were just chatting in an interview.

    - The length and location of the session. If the session is taking place at the
    participant''s location, confirm her contact information and address, and ask
    if there are any special things you need to know about parking, entering the building,
    or anything you might not be allowed to bring into the building (e.g., cameras
    or other equipment).

    - The session will be one-on-one, so there will be only one other person (you)
    interacting with the participant. If participants expect to be in a focus group,
    they may wrongly assume they would be able to hide behind others or cancel without
    advance.

    - If the session will be recorded, and what will be recorded (e.g., both the screen
    showing the product and a capture of the participant''s face).

    - The amount and type of compensation provided, as well as how and when they''ll
    receive it. For example, some organizations compensate in cash immediately following
    or before a session, while others use recruiting agencies and have the agency
    send a check in the mail after the session is complete.


    Be sure to send a confirmation letter to participants either via mail or email
    so they have the study details in writing. The letter should also include your
    contact information on the day of the scheduled session (who should be contacted
    if the participant is running late or can''t make it). If possible, call the participant
    a day before the session to verify the details and answer any last-minute questions
    they may have.


    # Take extra measures if you have internal employees as participants


    When using internal employees of an organization for research, you''ll probably
    encounter a hornet'' nest of politics that have little, if anything, to do with
    your project. Internal employees may be chosen because they''re the target users
    of an internal product, or as surrogate users (who can play the role of your target
    users). They may be recruited as part of a convenience sample—they''re chosen
    by the person managing the recruit you can easily find rather than because they
    represent a diverse sample of users. Often they''re recruited by managers who
    tell them nothing about the project. As a result, they have no expectations or
    the wrong expectations (e.g., it''s a training session). These participants may
    feel, or actually be, pressured into participating, so they may come into the'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'session with a chip on their shoulder. Also, many organizations prohibit internal
    employees from receiving compensation for their participation, participants may
    be doing your research for no additional incentive.


    To help ensure a smooth session when you have internal employees as your participants:


    +   - If someone recruited the participant for you, spend a bit of extra time
    at the beginning of her session explaining the purpose of the study and how the
    feedback will be used. Reinforce that you will keep her information confidential
    and will not use her name or any other specific identifying information, and that
    she is not required to participate. The participant may not have told you much,
    anything about the research.

    - Avoid having the participant''s direct manager, people from the same team as
    the participant, or employees from human resources observing a session. This can
    make the participant feel even nervous or that she is being evaluated.

    - Disclose whether you have observers and that it''s possible any of them may
    recognize her, but emphasize that they''re all for any feedback she has to give
    and that she is not evaluated at all. Reinforce that none of the observers are
    from her team. Also make sure to brief your observers how to behave in a manner
    that respects the participant and maintains her confidentiality (section 15.4
    for more observer guidelines).

    - Sincerely thank the participant for her time, and that her feedback is extremely
    valuable.


    Also, keep in mind the same guidelines that apply to regular participants for
    internal employees! You still have an ethical responsibility to look out for their
    physical and emotional safety.


    # Consider scheduling backup or floater participants


    Sometimes it''s critical not to have an empty slot during a study. Stakeholders
    may be traveling to observe sessions, or the project may be very constrained so
    there is no way to schedule replacement sessions. In these situations, considering
    either:


    +   - Backup participants. A backup participant is double-booked for a timeslot,
    so actually have two people scheduled for the same times. If the backup participant
    doesn''t show up or is late. If the regular participant shows up, compensate the
    backup and let her leave.

    - Floater participants. A floater participant is available as a backup for a period
    of time that stretches across multiple slots, and usually is compensated for doing
    so. If you have floats, but end not needing them, you might still have a colleague
    conduct an interview to get some useful data, or give them a survey, an unmoderated
    study, or some other independent activity from which you can collect feedback.


    > if you schedule a backup participant, we recommend not telling that she is a
    backup. She may be more likely to skip the session if she doesn''t think she is
    needed.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'When discussing backup and floater participants with your stakeholders and
    other researchers, be sure to clarify exactly what you mean. Sometimes these terms
    are used interchangeably.


    It also helps to discuss with your stakeholders surrogates who are internal employees
    from your organization might be appropriate floaters or backups in case of a no-show
    participant. If you don''t have floaters or backups, expectations that no-shows
    are a fact of life and plan accordingly (e.g., recruiting ten participants to
    ensure that at least eight show up).


    # # 15.2 Your study plan


    Sometimes you have to do some creative juggling within a session. Maybe you may
    have to shift the focus of the research because your product is experiencing technical
    difficulties. Or, maybe the participant spent more time than expected answering
    your first few questions and tasks and you realize you''ve not through everything
    else in your plan. You also need to think about how you''ll brief the participant,
    present your questions or tasks, and when you''ll provide compensation.


    # # Prioritize the study plan and create a backup plan


    As you''re writing your study plan in place, structure the protocol in such way
    that it''s easy to identify the high-priority tasks and questions. Work with your
    stakeholders to determine what, if any, material can be comfortably cut if necessary.
    This way, if you know you need to end the session early for reason, you can adapt-on-the-fly
    making sure you hit all the necessary areas.


    The shift the focus patterns about when and why you might adapt a session. See
    section 3.8 for more on this.


    Once you have your study plan in place, also think about additional questions
    or tasks that you can prepare as a backup. This backup content can be used if
    you need to shift the focus of a session or take an extended break, and will you
    continue to get feedback related to your research. Depending on the length of
    your study plan, you may already have several lower-priority tasks and questions.
    For example, if you''re planning a usability study or contextual inquiry, review
    your study plan and consider what additional questions you can ask if you need
    to shift the focus to an interview. These techniques are all ways to make use
    of a session that may otherwise been wasted.


    Another type of backup you can create is a paper or online questionnaire. The
    questionnaire can contain questions related to your project (e.g., demographics
    and product usage) or anything else that would be helpful, but not, to know about
    your participants. If appropriate, you can give the questionnaire to all participants
    at the end of the session, but have it ready to use earlier in case something
    goes awry and you have to take an extended break.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'If you’re asking participants to interact with a product, think about any extra
    tasks that you can keep in “back pocket.” These may be lower-priority tasks related
    to the project or more general tasks that always apply to any user who participates.
    These tasks may come in handy if the product breaks in the middle of a session,
    or if you realize the participant doesn''t meet your criteria and would not provide
    the right kind of feedback on your intended tasks.


    # Prepare your presession briefing


    When the participant arrives for your session, greet her warmly and make some
    casual conversation to help her feel comfortable. Once you arrive in your study
    space, transition to your presession briefing. The briefing should:


    +   - Explain your goals for the session.

    - Set clear expectations for how the session time will be used.

    - Let the participant know she can take a break or end the session at any time.

    - Reiter the points highlighted in your consent form including any recording that
    is being done and how the findings from this research will be used.


    Set up the briefing in whatever format will be easiest for you to read without
    missing any key elements. Some researchers prefer to have a bulleted list, while
    others write everything—find what is most comfortable for you. Even if you have
    your points memorized, make sure you refer back to the list so you aren''t forgetting
    important points; forgetting one important point may open the door for a tricky
    or sticky situation to occur. To make things less awkward, you can preface the
    briefing by saying, “I’ll be referring to my notes to make sure I don''t miss
    anything.”


    If you have a detailed script, practice it ahead of time so that you can deliver
    it in a comfortable tone while making eye contact with the participant. If you
    read for word, looking down at your clipboard and with a monotone voice, participants
    zone out, irritated, or get nervous. Newer moderators who feel more comfortable
    reading directly from a script can prefer to the participant that you do, but
    may want to write in reminders for you to “LOOK UP!” after every few lines.


    If you have a list of points to cover in your briefing, find a way to keep it
    up and engaging. For example, ask some background questions in sets of briefing
    points, stop periodically to ask if everything makes sense so far and what the
    participant has questions, and use your intonation and delivery to keep the participant
    listening carefully. Sometimes something, “I have a lot of points to go over,
    forgive me in advance for throwing a lot of information at you! I just want to
    make sure you have a clear understanding of what we’re doing here today.”'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Consider keeping the tasks "close to your vest"


    Letting usability study participants know ahead of time how many tasks you''ll
    be asking them to attempt may create complications. If the participant sees the
    number of tasks, they may start self-timing and rush through some tasks or others
    instead of approaching them naturally. Another challenge is that in some situations,
    those described in sections 10.4 and 10.7, you may not get through everything
    you''d planned. She may then feel bad about not being able to give the feedback
    you needed.


    Divulging tasks one by one is a useful way to mitigate these issues. After the
    participant completes a task, you may hand her the next task or move on to other
    part of your study. However, this method presents its own challenges: not being
    able to send tasks to participants ahead of time, having to read tasks to participants,
    or needing to be in the room with the participant to hand her the next task. Think
    about the needs of your study and choose accordingly. If the participant has tasks
    ahead of time, as she starts, encourage her to go at her natural pace and not
    speed up or slow down for your sake (write this into your study plan so you don''t
    forget to say it). Warn her for the sake of time you may push her sometimes, but
    that you don''t expect to get through everything (even if you do expect to), so
    she doesn''t feel bad if the session ends before all tasks have been attempted.


    # Decide when you''ll provide compensation


    You''ll notice that in many situations, we recommend providing the full compensation
    amount to your participant even if she doesn''t stay for the full session or if
    she doesn''t meet your recruitment criteria. We''ve found that it''s easier to
    provide the compensation no matter what trying to define the specific instances
    when it''s not appropriate. It''s too difficult to figure out where to place the
    blame for a participant who does not meet your recruitment criteria or why a participant
    arrived late, and we''d pay a little extra in compensation to keep participants
    satisfied than get an argument with an uncompensated participant.


    > Compensating the participant is also consistent with the pattern of taking responsibility
    wherever possible—as described in section 3.1.


    Obviously leeway may vary on this recommendation. However, if you implement a
    policy that would prevent the participant from receiving her compensation, be
    very clear with her about other circumstances during the recruiting process and
    allow a bit of tolerance. For example, if you let participants know they won''t
    be compensated if they arrive more than 15 minutes late, and the participant arrives
    17 minutes late, she should still receive compensation. Be reasonable and understanding.


    Also, think about when in the session—the beginning or end—you''ll provide compensation
    to participants. Most researchers provide compensation at the end of the session.
    However, providing compensation at the beginning of the session ensures the participant
    that she is really free to leave at any time and that she is not going to be penalized
    for leaving early.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 15.3 The product, space, and technology


    If you''re planning to have the participant interact with a product—whether released/live
    version or a prototype—during the session, follow these tips to limit the possibility
    of technical or product-related situations.


    # Preparing a live website or application


    If you''re getting feedback on a live website or application, talk with your development
    team to ensure that no updates are applied during your research. Explain that
    you need participants to give all feedback on the same version of the product.
    If it''s weekly and any A/B testing is being done, see if there is a way for you
    to have that functionality turned off during your research or for you to see the
    same version of pages (e.g., always the A design). If these guarantees cannot
    be made, see if you can run your research from a developer sandbox, quality assurance
    link, or some other staging area with the extensive functionality of the live
    product.


    If you''re getting feedback on the released public-facing version of an application
    or software product, check to see if any updates are scheduled to be released
    now or during your study. For most research you want feedback on the most recent
    version, so you may be able to get access to a test or beta version of the upcoming
    release so you can plan ahead.


    If you''re unable to talk with the development team (e.g., because you''re running
    a competitive study and have no way to contact a team), check the product every
    day for a couple of weeks before the study to see what, if anything, changes.
    This diligence will help you get a feel for what you might expect on your days.
    However, keep in mind that you might come to find that a brand-new design has
    been rolled out. Be sure that your stakeholders are aware of this a potential
    complication.


    # Preparing a prototype


    The features needed in a prototype (typically used for a usability study) vary
    widely depending on the domain, product type, and goals of the study. However,
    the following tips will help make your prototype (i.e., an interactive environment
    beyond static images) successful during a study:


    +   * Make the prototype as functional as possible. The situation described in
    11.4 is a good example of why: participants can be frustrated by a low-functioning
    prototype. Developers or prototypers new to research often mistakenly think the
    study as a demo that will be performed in a very structured and linear fashion.
    This mindset may lead them to create a prototype that has only the correct answer-paths
    working, and sometimes in only a set order. Participants will catch on to which
    areas are working and'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    which aren''t, which can lead to frustration and bias. It may influence the way
    they think about the design and the actions they take.


    +   - If the prototype can be completely functional, make it adequately functional.
    In the real world, participants will try lot of crazy paths to an answer and sometimes
    you can''t anticipate all of them. So "adequately functional" means that the prototype
    includes more than just linear flow of clicks or steps, and more than just the
    correct paths are working. The prototype should provide alternative and anticipated
    paths or steps that the participant can explore and attempt.


    +   - We recognize that most teams have time and rescuing constraints. If you
    can''t get more than the correct paths or steps working, provide the *illusion*
    that the prototype is functional. One example of this is, in a website, make all
    of the links look clickable even if they''re just null links that don''t go anywhere.
    Doing this prevents the mouse "drive-by," where participants can catch onto what
    is working based on where they get the hover-hand icon.


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_282_0.png)


    As with running your study on a live product, talk with your designers/developers
    to ensure that no design changes are made to the prototype during the study. Let
    them know that changes you want to make be discussed and by you first, as those
    changes may have an impact on your study protocol, the data you''re to collect
    and compare to previous participants'' results, and the prototype''s stability.


    # Test and document the technical setup


    To avoid, or at least minimize, technical difficulties during your study, do a
    full walkthrough of your technical setup for the session. This walkthrough should
    include turning on and off any cameras, screen-sharing applications, and recording
    devices. Test the order in which each item needs to be turned on or document the
    order that works best. Depending on the complexity of your study, consider a checklist
    of your setup steps in your study so you can easily reset if anything changes
    during a session.


    If you''re running a remote session:


    +   - Familiarize yourself with options to mute others on the call or eject them
    from the screen-sharing session to avoid observers interrupting the session.


    +   - Do a dry run with participants to ensure that your screen-sharing software
    works on their computers, which will save time during their sessions.


    +   - In your technical setup checklist, include screenshots of what the participant
    will experience as they see the remote session. These screenshots will help you
    provide instructions to the participant to perform basic troubleshooting.


    For more ideas on what to look at in your technical setup, see the sidebar "Troubleshooting
    Skills Are a Lifesaver.",


    288'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# TROUBLESHOOTING SKILLS ARE A LIFESAVER


    A key skill for a user researcher is technical troubleshooting. Given how integrated
    technology is with our work, it''s in your best interest to learn as much as possible
    about:


    +   - Recording technologies, including software like Moraes or Camtasia, and
    old-school recording technologies such as DVD burners and video cameras.

    - Screen-sharing technologies, such as WebEx and GoToMeeting.

    - Built-in and external web cameras, their drivers, and how they''re used through
    recording and screen-sharing programs.

    - Phone conferencing systems, including voiceover IP systems that integrate into
    programs like WebEx.

    - General computer basics, such as networking, extended and clone desktop, and
    changing screen resolution. Try to be at least familiar with both Macs and PCs.

    - Cables and connection types, including VGA, DVI, and HDMI.

    - Usability lab settings, the specifics of which depend on the lab but include
    changing camera views, routing screens, and sound.

    - Any other devices you plan to use to capture participant feedback, such as eye-tracking
    equipment.


    No matter the problem, the most valuable troubleshooting tip we have is to isolate
    the variables! For example, if your audio is not working, avoid changing five
    settings at once. If the audio still not working after multiple changes, you don''t
    know anything more about the problem than you started—and if it did, you lost
    a chance to identify the most efficient solution. Change one thing at a time and
    see if it solves the problem. Only consider combinations of things if, based on
    prior experience, you need to know and individual changes didn''t make a difference.


    Knowing these basics will help you keep your sessions running without waiting
    for someone else to help you. Tinker with the equipment and settings before a
    study. Ask someone knows the equipment to deliberately break something (e.g.,
    disconnect a cable or change a camera setting) and try to troubleshoot it for
    practice. If you have a team of researchers, you can set up troubleshooting exercises
    for each other to increase your competence and confidence. The next time something
    goes wrong during a session, you''ll have the skills to handle it!'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Familiarize yourself with the space and its safety options


    Before your study begins, familiarize yourself as much as possible with the space
    that your research is being performed in. Are there security guards? Where is
    the nearest fire exit? Don''t be afraid to ask questions, especially if you''re
    in an unfamiliar space. By knowing these answers ahead of time, you''ll be able
    to quickly respond to anything that requires a bit of "native" knowledge.


    If there is building security, notify them about any participants who may be coming
    for your research. Again, if something happens, their advance knowledge of what
    you''re doing may save precious time.


    Also, make sure at least one person from your team, whether a team member or stakeholder,
    is available to watch each session. We highly recommend avoiding running user
    research on your own because, if an uncomfortable or potentially litigious situation
    arises, you need another set of eyes, and hands.


    Once you have another person who can join you for the session, consider creating
    a "safe phrase." This is a phrase that you share with the person observing the
    session, and that you use only if you need to interrupt the session. For example,
    if you''ve been getting a bad feeling about the participant, and the participant
    has positioned himself between you and the door, you may want to use the phrase
    to notify your observer that you need her to knock on the door and provide an
    excuse for you to leave the room. Since it may be difficult to tell exactly how
    serious a situation is from another room, the safe phrase is your way to request
    assistance.


    # Investigate cultural customs and taboos


    If you''re doing research in other countries or cultural regions, do your diligence
    and learn about the customs ahead of time. For example, some cultures require
    you to take off your shoes before entering. Others may take offense if you don''t
    accept tea, or if your knees and shoulders aren''t covered. Some cultures expect
    you to exchange business cards in a certain way. The more you prepare, the less
    uncomfortable or awkward the situation will be.


    But also be careful not to assume anything based on what you read or hear—that
    could be offensive too. Try to catch cues from your participants—for example,
    if the participant has her shoes off and there is a shoe rack at the door, that
    is probably a good sign that it''s important to respect that rule in the household.
    Put your empathy and observational skills to good use!


    > A good resource for conducting user research with different cultures is The
    Handbook of Global User Research (Schumacher, 2010).'
