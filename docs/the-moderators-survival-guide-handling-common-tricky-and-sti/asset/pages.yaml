- pgno: 119
  md: '# 6.7 Participant does not have any negative feedback (cont.)


    If you suspect he is reluctant to give negative feedback:


    +   - “Thank you for this feedback—it is all very helpful to hear. The project
    team is really excited to get all feedback—both positive and negative. So just
    continue to let me know anything you tell me, good or bad. Let''s move on to....”


    +   - “This has been very useful feedback, thank you. Let''s think about this
    <task/topic/area> for a moment. What did you like most about it? What did you
    like least? What would you want to improve if you were using this at work or home?”


    # What not to do or say


    +   - Try not to call out the participant for giving only positive feedback, or
    pressure him to come up with negative feedback. Doing so may naturally bias the
    participant''s approach to the product during the session, and might ostrace your
    stakeholders.


    # How to avoid


    +   - Make sure that participants know upfront that you want them to provide both
    positive and negative feedback.


    # See also


    +   - 6.1 Participant is reluctant to say anything negative'
