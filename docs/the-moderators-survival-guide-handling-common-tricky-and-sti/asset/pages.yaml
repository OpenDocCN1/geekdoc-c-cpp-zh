- pgno: 49
  md: 'As we start describing situations that you may encounter (in Part 2), you''ll
    notice that we repeat some recommended actions over and over again. You can think
    of these actions as moderation patterns that can be applied to any situation,
    and if needed, as modified. Table 3.1 lists all the patterns that we''ll discuss
    in this chapter. Some of may seem obvious to you, especially if you already have
    moderating experience under your belt. Even so, our goal is to help you think
    about when each pattern is appropriate to use based on the circumstances of the
    session and your desired outcome.


    Most of these patterns aren''t mutually exclusive—you can use one or multiple
    at a time within the same session. Given that you may encounter situations that
    build on each other (e.g., experiencing technical problems while the pattern is
    already distracted by external circumstances), you may need to apply multiple
    patterns within a short period.


    At the beginning of each situation in Part 2, you''ll see a heading for "Pattern(s)
    to apply" followed by any relevant patterns.


    +   - Take responsibility

    - Clarify the task/question

    - Redirect the participant

    - Reassurance the participant

    - Build engagement

    - Disengage from the participant

    - Take a break

    - Shift the focus

    - End the session early


    Table 3.1: Moderation Patterns. Each pattern defines a type of interaction that
    you can use during a user research session to affect its outcome and direction.


    # 3.1 Take responsibility


    Take responsibility means recognizing that, as the moderator, you''re in charge
    of the session, and then using power wisely.


    # When to use


    When something happens during a session that a participant may not know how to
    react to, or when a misunderstanding is encountered, you should step up and take
    responsibility.


    +   - To keep the participant from feeling badly about something she did.

    - If the participant seems to have misunderstood something you asked her about,
    or to.'
