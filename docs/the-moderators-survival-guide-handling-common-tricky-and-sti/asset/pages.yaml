- pgno: 19
  md: '# 1.1 "Are they laughing at me?"


    I used to work at an institution of higher learning. We did a lot of usability
    testing, up to 120 studies a year. One particular day we had a client who wanted
    to test a website, but wanted their entire department staff to observe the testing.
    Our observation room sat 12 and it was mostly filled. Being late in the day, the
    observers were getting sloppy-after watching users identify the same usability
    problems over and over again. It was our last session of the day when we encountered
    a slightly eccentric participant than normal.


    As she telling the tasks, she was quite entirable in some of her feedback, and
    you could hear, through the adjoining wall to the observation room, muffled commentary
    becoming louder. I proceeded to instant message my colleague in the room to have
    the observers keep down, but by the time she read note, it was too late. My participant''s
    eccentric nature had come out via an absolutely hysterical moment that I, as the
    moderator, had to literally bite my tongue to not laugh. While I controlled my
    reaction, a volcanic eruption of laughter could be heard through the wall. As
    my participant heard, her face changed immediately, followed by “Are they laughing
    at me?"


    I no longer wanted to laugh. I was paralyzed by “What do I do?” I lied. I told
    her, they''re not laughing at her, but rather that everyone who has in room today
    has had a similar experience with this task, so we''ll have to redesign the website.
    It was the best I could do at the time, but I''m not sure she believed me. During
    the next several tasks, there were no sounds from the observation room; they were
    silent as she became. After the end, she walked out and apologized on behalf of
    the observers.


    > Michael Dutton


    # 1.2 Power and responsibility


    Michael''s story emphasizes how important a role you have as a moderator of a
    research session. Your position on the session''s frontline means when tricky,
    sticky, and unexpected situations arise, you''re the only one who has decide what
    to do and take action.


    When you encounter the awkward or uncomfortable situation with a friend or else
    you know, you can inform report with your knowledge about that person. You rarely
    have any additional knowledge to help you when the same situation happens during
    a research session. And, of course, you have additional complicado to consider.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_20_0.png)


    **Figure 1.1** As the moderator, you''re balancing a lot of competing needs during
    the session.


    During a session, your reactions as a moderator must balance the following competing
    needs (Figure 1.1):


    +   * The participant''s emotional and physical states. Is she nervous or uncomfortable?
    Is she looking like she is unwell or experiencing physical discomfort?

    * Your emotional and physical states. Are you uncomfortable with anything happening
    in the session? Are you reacting to an allergen in the environment? Is there an
    external circumstance occurring that might threaten your physical safety or of
    the participant''s?

    * The study''s research goals. Are you measuring an experience, looking for issues
    that need to be fixed, or trying to understand the participant''s process?

    * General session management needs. Are your remote session technology and equipment
    working correctly? Are your observers behaving well, especially if they''re in
    the same room as you?

    * Protection of your organization. Are you ensuring the participant leaves with
    a positive experience so she doesn''t say things about your organization on social
    media? Are you doing your best to get feedback from participants that will help
    improve the experience for future users of your organization''s products or services?


    Throughout a session, this balance may shift you, as the moderator, have to adjust
    accordingly. The way you handle a situation at the beginning of a session can
    be very different than how you handle the same situation later on, even with the
    same participant.


    Take the example of the usability study session from Michael''s story. At the
    beginning of the session, his duty as the moderator was mainly to elicit feedback
    that satisfied the'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'study’s minimal encouragement may have been needed along the way to keep the
    participant content, but his larger concerns were to stay neutral and keep the
    observers engaged in the session. But as soon as the participant heard laughter
    from the adjacent room, she became uncomfortable, embarrassed, and all too aware
    that her performance was being watched.


    At this point, the balance of competing needs shifted away from the session goals
    and more toward the participant''s emotional comfort. Because the participant''s
    comfort was at risk, Michael''s attention as a moderator had to focus on collecting
    feedback and on making sure she was okay and would leave the session feeling comfortable
    (rather than upset him or his organization). Under normal conditions, telling
    the participant that everyone else had the same experience with the task might
    have been biasing. But Michael sacrificed such data integrity to help the participant
    and avoid tarnishing the reputation of his organization. Also, he needed to ease
    tension between himself and the participant for his own emotional comfort.


    Finding the right balance of these needs can be difficult and stressful, especially
    if you’re new to moderating. There are times when you’ll feel pressure to help
    the participant—it can be painful to watch their struggle—but you must resist
    that and maintain neutrality so that the data you’re collecting are unaffected.
    On the flip side, you’ll feel pressure from the stakeholders to stick to your
    plan but you’ll need to deviate from plan to comfort an upset participant.


    This response may have biased the participant by reinforcing his feelings about
    the product, possibly changing his feedback and behavior for the remainder of
    the session.


    This responsibility is why you, as the moderator, are important. You have the
    power to impact both the study results and the participant’s emotional state.
    More than anyone else in the research, your interpersonal and troubleshooting
    skills can mean the difference between a successful session and an awful one.
    But, as we’ve learned from countless movies, this power comes with great responsibility.
    You have to take that power and use it wisely in all kinds of common, tricky,
    and sticky situations. We hope this book will be your moderating Swiss Army knife:
    the right set of tools to help you deal with anything comes your way during user
    research sessions.


    # 1.3 The session ringmaster


    Empathy. Flexibility. Creativity. Sense of humor. Aura of authority. To successfully
    handle tricky and sticky situations while moderating, you must embody and balance
    all these qualities. You may recognize these skills as being similar to that of
    a circus ringmaster. The ringmaster actively listens to monitors everything that
    is going on around her, directs the audience’s attention, and controls the overall
    pacing and flow of the show.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    Let’s talk about these qualities in more detail:


    +   Empathy helps you recognize the participant is feeling. Remember that no matter
    what you''re dealing with outside of a session -argumentative stakeholders,amental
    technology, travel problems, etc.—the participant is a person and not just a way
    for you to get feedback. Put yourself in her shoes and think of how you''d want
    to be treated if the positions were reversed. Be genuinely interested to identify
    when she is upset or frustrated and respond in a sincere, compassionate way to
    help her feel comfortable again.


    +   Flexibility is necessary because these situations occur—a participant becomes
    sick or angry, an observer swears, or in technology fails—you can''t railroad
    your way through the study plan. Sticking superbly to your original plan may just
    exacerbate the situation, leading to uncontrollable participants and biased results.


    New moderators tend to have the most difficulty with the principle of flexibility.
    See the sidebar "Tips for New Moderators."


    +   Creativity or improvisation is crucial for unexpected situations arise. In
    fact, we know a few improv actors who are great moderators. A simple formula called
    “Yes, and ...” underlies improv. The principle behind “Yes, and...” is to acknowledge
    and accept what you have to work with and build upon it rather than fight it.
    This concept is well-suited for user research activities. If a tricky situation
    arises, embrace it (flexibility, or the “yes”) and think quickly about how to
    handle it (creativity, or the...). Creativity is not an easily learned thing,
    and for some it’s more natural than others. You can set up a framework conducive
    to creativity by embracing your mindset.


    When used carefully, subdued humor can take the edge off an awkward situation.
    Carefully is the key word. Use humor when appropriate and there is no way for
    the participant to feel that you''re laughing at her.


    +   A sense of humor is important in unpredictable situations. When everything
    feels like it’s falling apart during a session, it’s better for you to laugh than
    to cry! We don''t mean you have to be obnoxious or make inappropriate judgments
    to the participant—of course you need to stay professional. Rather, we mean you.
    Try not to get upset or nervous if something doesn''t go as planned. Take a breath
    and remind yourself that you have the tools to handle this. In the worst case,
    you’ll have a great story to share with your colleagues (after removing any confidential
    information, of course).


    +   An aura of authority means, as the moderator, you must establish both to the
    participant and the observers as one in control of the session. Remember that
    you''re ultimately responsible for what happens here! Your body language and tone
    of voice are vital in establishing this authority. You must also be comfortable
    keeping the session on track. For example, if the participant is taking longer
    than you expected to show you during a complex inquiry and you need additional
    feedback before the session ends, you must politely firmly move on. Remember to
    balance your authority with empathy that the participant feels comfortable and
    confident while sharing her feedback.


    While you have control over the session, the participant should feel that she
    is leading the conversation (i.e., she “speaking”). See Dumas and Loring (2008)
    for more on this.


    While you put the participant in the spotlight during user research, don''t forget
    that you''re ideally in control. Harness your inner ringmaster, plus or minus
    the hat and coats.


    14'
