- pgno: 178
  md: '# 10.2 Participant consistently focuses on irrelevant details


    The participant keeps honing in on things that are irrelevant to what you''re
    trying to research, even after you''ve asked him to do otherwise multiple times.
    This can come in a mild form such as only focusing on the colors of a design rather
    than the functionality. For example, a participant might reiterate how much he
    hates the shade of green used in a prototype. Or, this may be more disruptive
    such as continuing to use a search engine to attempt tasks that you''ve asked
    him to do on a particular website.


    +   - Method(s): Any

    - Frequency: Occasional

    - Pattern(s) to apply: Clarify the task/question; Redirect the participant


    # What to do


    +   - Verify the feedback provided by the participant really is irrelevant. The
    behaviors that participants keep coming back to a session may represent their
    natural behavior and can be a valuable set of data for a research project. If
    there is a way to get out of his behavior or answers, you let him continue on
    as long as your research agenda permits.


    +   - Ask the participant to tell you in his own words what he is trying to do.
    His answer will help you figure out if he misunderstood you or if something else
    is at play. If he misunderstands you, repeat or reward your question, or ask him
    to re-read the task.


    +   - If you find yourself asking the participant to re-read the task or repeating
    questions over and again, acknowledge what he is trying to do and explain what
    you want to focus on instead. For example, if the participant keeps trying to
    use a search engine instead of the website you''re evaluating, let him know that
    you understand that he would typically use a search engine to attempt these tasks,
    you need to stay on the website so you can find ways to make that happen.


    +   - If the participant seems to have an agenda regarding what he wants to provide
    feedback on, considering letting him vent for a few minutes and redirecting him
    back to the task as described in 11.7.


    # What to say


    +   - “You’ve mentioned that <feedback on irrelevant aspect of design>. What do
    you think about <relevant aspect of design>?”


    +   - “I’ve noticed that you have a lot of feedback on <relevant topic>. Due to
    time constraints, we unfortunately can''t focus on that in today''s session. But,
    do you want to take a minute or two to tell me your thoughts before we move to
    the other topics?”'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 10.2 Participant consistently focuses on irrelevant details (cont.)


    In a usability study:


    +   - “It’s helpful to know that you would look for a lot of this information
    in <area>. While that might be one place to find that information, we don''t want
    to focus on it today. Instead, I''ll ask you to try these tasks another way.


    # What not to do or say


    +   - Try not to be rude or abrupt about redirecting the participant. It can be
    easy to offend or embarrass the participant, especially if you tell him there
    are no right or wrong answers but keep steering him to a certain topic. Acknowledging
    what he is trying to do will go long way.


    # How to avoid


