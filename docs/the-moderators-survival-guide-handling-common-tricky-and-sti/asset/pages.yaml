    \n# Your study plan\n\n+   - Work carefully on the wording of your tasks and questions\
    \ to avoid leading or influencing the participant's responses.\n\n+   - Prioritize\
    \ the study plan so you know the highest- and lowest-priority tasks/questions.\n\
    \n+   - Create a backup plan. Consider creating a paper questionnaire that can\
    \ give participants if you experience technical difficulties.\n\n+   - Think about\
    \ any additional questions or tasks you may want to use if you have to shift the\
    \ focus of the research in the middle of a session.\n\n+   - Prepare your presession\
    \ briefing:\n\n+   - Set clear expectations about the session:\n  - The purpose\
    \ of the session.\n  - How you want to provide feedback/think aloud (if applicable).\n\
    \  - You're not a subject matter expert."
