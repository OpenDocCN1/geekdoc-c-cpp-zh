- pgno: 101
  md: '# Survival Story


    # SURVIVAL STORY: "SHE WAS DESPERATE FOR WORK"

    ADRIAN HOWARD


    I was moderating in-person usability sessions that compared a number of websites
    designed for people seeking work.


    The sessions were run at the client''s site and we had a lot of participants.
    I helped set up the screening parameters, but the recruitment of the participants
    was managed by the client.


    We ended up organizing a testing production line. While I was moderating one session,
    the next participant was being prepared in a different room by a coworker. The
    people who handled the recruitment managed the meet-and-greet as participants
    arrived.


    Toward the end of a long day, a participant walked into the test room under a
    major misapp. A few minutes into the session it became very clear she thought
    this was an actual job interview.


    Oh dear.


    Obviously I stopped the session immediately. It would have been unethical to continue.
    Once I explained, the participant became upset almost to the point of tears. She
    was desperate for work and used time and money to attend that she could afford
    to waste. All because she thought it could lead to full-time employment.


    We went to a private office to talk in comfort and emphasized the situation wasn''t
    her fault but ours. I immediately reassured her that she would not be out of pocket
    for the day and gave her time to compose herself while she fetched coffee.


    We ended up providing a taxi home along with some additional compensation to cover
    her costs in attending. She would never have participated if she had understood
    that it was just a usability session.


    When we looked to the underlying causes of this failure we discovered three main
    factors: poor communication, poor screening, and time pressure.


    The lack of communication was the biggest issue. The recruiters didn''t raise
    problems they encountered when people arrived. The person briefing the participants
    assumed that'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Survival Story (cont.)


    they had had the process explained to them. I assumed that the participant was
    ready for the test. Our innocent victim fell between the gaps.


    Better communication would have helped us spot the poor screening questions. The
    language used could be misinterpreted by somebody in a job-seeking context (e.g.,
    the word ''interview''). It became obvious our participant had verbally okayed
    things in the screening and briefing that she hadn''t fully understood in the
    vain hope that this rather strange job interview process would soon make sense!
    I should have been more involved with the recruiters and ensured that the screening
    questions were working well.


    Finally, at the end of a long day, everybody involved was tired and not paying
    as much attention as they should have been. Tight time constraints cause problems.
    We need to give ourselves the time to pay full attention to every participant
    we work with. If we hadn''t been running a production line to try and jam as many
    sessions as possible into a tight schedule, we would have caught this participant
    much earlier.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# SURVIVAL STORY: "HE REFUSES TO LEAVE"

    CLIFF ANDERSON


    I was at my desk when I got a call from the lab (another usability engineering
    was running a study that week. Was from our lab assistant, who seemed more than
    a little excited—“Cliff, there is a man here, and he refuses to leave, and he
    is threatening us, and we don''t know what to do." After calling him, I learned
    that he had expected to get his $100 compensation in cash, was basking because
    we were offering Visa gift cards—something that was new for us and for our regular
    recruiting agency.


    I told her "I''ll be right down," then hit the stairs to get to the lab. When
    I got there, I found my assistant, the usability engineer was running our test,
    and the user. Things seemed pretty under control, but I noticed that the user
    seemed a little perturbed.


    I went right up to him, introduced myself, shook his hand, and asked him what
    was the matter. He went into his story, and I did my best job at active and empathetic
    listening, using all the tricks and tropes that I had learned over the years working
    with users and doing research.


    I could tell he was calming down, but I still hadn''t come up with a way to address
    his problem. So, I put my hand on my chin, knotted my brows, and it came to me!
    "Why don''t you give him that gift card, and we can go to the ATM in the lobby
    downstairs, and I can withdraw your $100"


    He agreed, we withdrew the $100, shook hands, and parted amicably. I went back
    upstairs shaking my head, giving myself credit for keeping cool under pressure
    (in general, one of the best skills a usability engineer can have) and also making
    sure that our screener (and recruiting agency) made sure to mention this new form
    of compensation ahead of time.'
  merge: -1
  img_proc: true
