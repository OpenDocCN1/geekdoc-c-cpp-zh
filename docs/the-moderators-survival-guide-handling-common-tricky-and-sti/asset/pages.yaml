    # Observe others moderating and ask questions


    If you’re lucky enough to work with other user researchers, it sits in on as many
    of their sessions as possible. Even experienced moderators can pick up tips, tricks,
    and reminders about behaviors they want to try emulate (or avoid) by watching
    others. Take notes while you watch so you can review later.


    If you’re unsure why a moderator did something during a session, ask him or her
    afterwards. Remember to keep your tone curious and courteous, not accusatory.


    # Seek out resources


    While there aren’t a ton of resources focused on moderating, the topic is discussed
    in almost any book about user research. Find books on the research methods that
    you’re most interested in, and read their tips on moderating for those methods.
    There are also many articles that pop up on this topic in professional magazines
    and journals.


    Many user experience conferences focus on methodology and research techniques
    will include presentations or tutorials about moderating. Dumas and Loring (2008)
    also recommend attending a short course on conducting usability tests, although
