  md: '# 10.6 Participant is difficult to hear or understand (cont.)


    # What to say


    +   - Can I have you repeat that just a little louder? I want to make sure that
    our recording equipment is able to pick you up.\n- Would you mind repeating that
    for me, a bit slower so I can write it down?

    - Could you use the mouse to show me on the screen what area you’re talking about?


    If the participant is remote:


    +   - Could you move a little closer to the phone? I’m having a bit of trouble
    hearing you.\n- I apologize, I think your phone line cut out for a moment and
    I missed part of what you said. Would you mind repeating that for me?


    # What not to do or say


    +   - Don’t tell the participant that you can’t understand him because his accent
    is too strong, he is soft-spoken, or there’s something strange about the way he
    talks.


    # How to avoid


    +   - Ask whoever is handling the recruit to screen out potential participants
    who are difficult to understand. However, if you’re recruiting internally or interviewing
    very targeted users, you may not have enough flexibility to screen someone out
    for this reason.\n- Keep in mind that even if a participant is difficult to understand,
    he still has valuable feedback to offer!


    # See also


    +   - 4.3 Participant has an unexpected physical feature'
