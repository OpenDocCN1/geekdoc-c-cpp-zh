- pgno: 55
  md: 'Frequency: If you tell the participant that her feedback is good or helpful
    every time she says or does something, you start to sound like a broken record
    and may lose trust in you. Similarly, providing this feedback at the wrong times
    could annoy her and possibly bias the study. For example, the participant may
    catch on you if you only tell her her feedback is useful when she says or does
    something in particular.


    Wording: Saying “that is great feedback” or “that is good feedback” qualifies
    the participant’s feedback, which may again attune her to when you are or not
    “praising” her feedback.


    Be careful and methodical about how you provide any kind of affirmation. Instead
    of responding to everything that the participant says or does, pause periodically
    after a number of tasks or questions and tell her, “This is helpful for you to
    hear, and is the type of feedback we’re looking to get. Let’s move on to……” You
    only need to do this once or twice during a session, ideally toward the beginning
    of the session when participants are most guarded and can benefit from this feedback.


    When providing any other feedback to the participant, stay neutral with responses
    such as “Okay,” or “Okay, thank you for that” instead of adding qualifiers. Additional
    guidelines for carefully using language and tone are discussed in 2.5.


    # 3.5 Build engagement


    Sometimes a participant just''t seem connected to what you’re asking her to do
    or talk about. By building engagement, you can help her feel invested in the session.
    This emotional investment may make her more willing to provide the feedback you
    need.


    # When to use


    Use this pattern to help draw an unengaged participant into the session. This
    may be appropriate if:


    +   - The participant seems nervous or reluctant about providing feedback.


    +   - The participant is not engaging with the product being studied.


    +   - The participant seems distracted or uninterested.


    # What to do


    One way to build engagement is to adjust your body language, making sure that
    you’re taking the position of an active and interested listener (Figure 3.1).
    Sit up straight, angling your body slightly toward the participant. If you’re
    in the room with her, adjust your seat so you can maintain comfortable eye contact
    and she doesn’t have to look up or down at you.'
