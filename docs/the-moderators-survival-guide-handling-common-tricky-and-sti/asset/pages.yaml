- pgno: 260
  md: '# 14.4 You begin to feel unwell while moderating a session


    While you felt fine at the beginning of the session, you begin to feel ill or
    unwell later on. Your symptoms are severe enough that you start to have difficulty
    paying attention to the participant.


    Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Take responsibility; Take a break; End the session early


    # What to do


    +   If you''re experiencing something like a coughing or sneezing fit, excuse
    yourself from the room and go to the next restroom until it over. Splash cold
    water on your face and wash your hands before heading back to the research room.


    +   Take a quick break. Get a cool drink and get fresh air if possible. If you
    haven''t eaten, have a small snack to keep your blood sugar up. Those small changes
    may be enough to make you feel better.


    +   If you feel seriously ill, or contagious and unable to continue, you can do
    one of two things:


    +   If you have another moderator available, have him or her continue the session
    for you.

    End the session as quickly as possible, for your comfort and that of the participant.
    Use a preset if you''re not comfortable sharing details about how you''re feeling.
    Be sure to give him/her their full compensation even if you''re ending the session
    early.


    # What to say


    +   “Let’s take a short break and resume again in five minutes. Can I get a drink
    while you''re waiting?”


    +   “I feel a sneezing, <coughing fit on—please excuse me for a few minutes”


    +   “I apologize, <participant>, but we need to end the session a bit earlier
    than planned due to technical difficulties with our setup. Thank you so much for
    your feedback today—what gave us was extremely helpful. Here''s your compensation.”


    # What not to do or say


    +   Don''t force yourself to continue the session if you don''t feel able to.
    It''s better to end a session early than to collapse in front of the participant!'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 14.4 You begin to feel unwell while moderating a session (cont.)


    # How to avoid


    +   - Unfortunately, these situations are unavoidable. Within your testing environment,
    be sure to use antibacterial cleaner and have hand sanitizer available to limit
    the chance of an ill participant sparning his germs to you (and other participants).


    +   - If you have ongoing health problems that require you to sometimes leave
    a room quickly, give your team a heads up (details are not necessary!). If someone
    else on your team can fill in for you a moderator and will be watching your session,
    considering asking that person to take over for you immediately or after a few
    minutes if you have to leave the room in a hurry.


    # See also


    +   - 14.3 Participant starts to look ill or otherwise unwell


    +   - 14.5 You notice a bad smell or have an allergic reaction'
