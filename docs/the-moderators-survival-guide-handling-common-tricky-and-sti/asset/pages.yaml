- pgno: 35
  md: '# 2.2 Resolve any threats to physical safety


    In the middle of a contextual inquiry, you hear a low rumbling sound. You take
    a moment to evaluate the situation, and quickly realize that you''re experiencing
    an earthquake. What do you do next?


    For more about how to handle earthquakes and other natural disasters, see section
    14.2.


    When a situation involves a physical threat, you need to respond to and address
    the threat as soon as you''ve taken a couple of seconds to understand what''s
    going on. Respond quickly and appropriately, even if that you''re unable to continue
    the session. The safety of you and the participant takes priority over your data
    collection needs!


    Keep in mind that the participant may not know what to do, especially if he is
    in your facility. You must take responsibility for his safety as well as your
    own. For example, if a fire alarm goes off or your building is evacuated, the
    participant with you as you follow standard evacuation procedures. While the participant
    may end up seeing your observers, your top priority is to keep them from physical
    harm instead maintaining the integrity of the session.


    In the example of an earthquake, you should instruct the participant about where
    to go (e.g., under a desk or in a doorway). If you''re moderating a usability
    study from an adjacent room, and you think it''s safe to spend another couple
    of seconds using the microphone, tell the participant that you''re experiencing
    an earthquake and instruct him to go under the desk or in the doorway immediately.


    The participant''s perception of his safety is just as important, even if you
    think he is safe. For example, we''ve heard of moderators interrupting a session
    through an earthquake or a fire drill without saying anything to the participant.
    Be sensitive to the participant''s comfort and keep him informed.


    If you''re in the participant''s space, follow his lead to exit the building safely
    or follow the appropriate safety protocol for the event that you''re experiencing.


    Depending on the severity of the situation and safety of the environment, you
    may want to cancel or end the session without asking the participant to wait until
    the situation is resolved. If you do this, give him his full compensation and
    thank for the feedback provided. If the environment is safe, and the participant
    is not visibly shaken and willing to continue, offer to a short break before resuming
    so you and the participant can regain focus.


    # 2.3 Verify that you''re not causing or magnifying the situation


    During an interview, the participant starts making remarks after each question
    you ask. You''re not sure why he is responding that way. The issue doesn''t resolve
    itself, and taking break doesn''t help. There is no physical danger to resolve
    if you''re worried about the participant''s attitude and its effect on the feedback
    he is providing. What, if anything, should you do?


    Let''s step into some awkward territory for a minute, but we promise, it''s for
    your own good! Sometimes a situation is magnified, if not created, by something
    that you''re doing. Part of being'
