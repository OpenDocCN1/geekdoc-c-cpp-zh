- pgno: 108
  md: '# 6.2 Participant does something you don''t understand (cont.)


    experts observing or share your notes with them later. If there is time after
    he''s completed the workflow, ask the participant about what he was doing.


    # What to say


    +   - “I’m not a subject-matter expert here, so bear with me for a second—can
    you explain in plain terms what you mean by?”

    - “I’m not sure I understand. Could you rephrase that for me?”

    - “<Trained observer>, do you have any follow-up questions about that for <participant>?


    Post-observation of participant''s workflow during contextual inquiry:


    +   - “I noticed you doing something that I couldn''t follow. Could you help me
    understand what you were doing and why? It was <did thing>.


    # What not to do or say


    +   - Don''t make the participant feel like he was inarticulate or supercilious
    with his feedback. Be humble yet professional when asking for clarification.

    - Don''t ignore the feedback altogether just because you don''t understand it.
    Try to seek clarification either during the session with the participant or afterwards
    with a domain expert. You may actually learn a few things!


    # How to avoid


    +   - A good practice when performing research in an unfamiliar domain is to gain
    a basic level of familiarity with the domain and product before you start your
    sessions. Having even a shallow foundation will help you filter relevant information
    from the participant and ask more targeted questions. You don''t have to become
    an expert—in fact, some user researchers argue that it is helpful if you''re not
    immersed in the subject matter so that you can maintain a neutral and objective
    perspective. However, if your research is with expert users, you''ll find that
    a bit of additional knowledge will help come up with meaningful follow-up questions.
    Some evidence of understanding on your part will help establish your credibility
    with the participant and may encourage feedback.

    - Tell the participant at the beginning of the session that you''re not a domain
    expert. Stress that your role is to get his feedback and report it back to the
    team. Tell him that you may not be able to answer his questions, and that you
    may ask him for clarification at times you don''t understand something.


    # See also


    +   - 10.3 Participant does something very unexpected'
  merge: -1
