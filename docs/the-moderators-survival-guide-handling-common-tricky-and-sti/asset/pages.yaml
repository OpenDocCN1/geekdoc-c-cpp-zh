  md: '+   The participant’s reactions in particular situations, both his body language
    and what he is saying. If necessary, go back a bit in the recording and replay
    it. Did you do (or not do) anything that made the participant react? What did
    you miss about the participant’s behavior and attitude while you were sitting
    with him? Which of his reactions are you surprised by?


    +   If, and how, you adapt your behavior throughout the session. How might you
    adapt your moderation style based on the participant''s reactions? Should you?


    +   Examples of what you did well. What should you continue to do in the future?


    If you encountered a situation that''s listed in this book, go back and look at
    that section. How did you compare with what is listed there? If you deviated from
    your suggestions, did it make sense to do based on your circumstances? Every scenario
    is unique, and real-life scenarios can include a confusing combination of situations.
    You may encounter times when the goals and strategies for handling one situation
    conflict with the goals and strategies for the other, combined situation. If that
    is the case, use your best judgment and the suggestions in Chapters 2 and 3 to
    help decide what should take priority. If you''re unsure whether you did the right
    thing, have a discussion with colleagues about the best course of action and the
    trade-offs you had to make.


    # Giving unsolicited feedback


    You may find yourself needing to give feedback to someone who hasn''t asked for
    it. Maybe you''re working with a consultant who is moderating some research for
    you, and you''ve noticed some behaviors that are influencing the participant.
    Or, maybe you have junior team members helping with a study who needs to avoid
    asking questions.


    You may feel nervous if the person you need to give feedback is more senior than
    you, or is someone is well-known in the field. One approach you can take to avoid
    sounding confrontational is to ask the person why he handled the situation the
    way he did, taking a curious and conversational tone:


    +   I noticed that when the participant asked how he was doing, you told him that
    other participants had the same problems he he. I am curious about why you answered
    way—is that a standard response?


    +   During the session, the participant seemed upset about how poorly he was doing.
    I''ve seen other scenarios where the moderator offered to let the participant
    take a break when the participant gets upset. What do you think about that—is
    that ever appropriate?'
