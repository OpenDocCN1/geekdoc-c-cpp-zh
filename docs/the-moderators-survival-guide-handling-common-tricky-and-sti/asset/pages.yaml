- pgno: 145
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 8.4 Participant self-blaming


    The participant blames himself for not understanding something or performing a
    task wrong. He may apologize for what he perceives as his poor performance or
    lack of knowledge, explain that if he wasn''t nervous he''d be doing a better
    job. In a contextual inquiry, the participant may discount his abilities and say
    that you may be better off watching someone who has received better training or
    who has more experience than he does.


    **Method(s):** Usability study; Contextual inquiry

    **Frequency:** Frequent

    **Pattern(s) to apply:** Redirect the participant; Reassure the participant


    # What to do


    +   - Refer back to what you told the participant during the briefing at the beginning
    of the session—that he is not testing, and that his feedback is appreciated.

    - If the participant doesn''t think he has the level necessary or is otherwise
    unqualified, reassure him that you''re interested in hearing from users with all
    types of experience.

    - Rather than letting the participant dwell on his self-blaming, follow your reassurance
    with an immediate redirect to another follow-question or task related to the research
    goals. For example, you may say, “Remember what I said earlier—if we don''t see
    areas work well and not so well, we wouldn''t learn anything. Tell me more about
    what you were expecting..."


    # What to say


    +   - “Please don''t feel badly. Remember that we''re evaluating the product,
    not you.”

    - “If we don''t see areas work well or not so well for you, we wouldn''t learn
    anything.”

    - “You''re here to partner with users to evaluate the design, so all of this is
    really helpful for us to see and hear.”

    - “There are no wrongs here; you''re here to help us.”

    - “It''s important for us to bring in users with all levels and types of experience
    because we want this product to be easy to use for everyone.”


    # What not to do or say


    +   - Do not dismiss the participant''s comments by saying something like, “It''s
    okay,” or “No problem,” as it may be perceived as confirming that he is not doing
    a good job.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 8.4 Participant is self-blaming (cont.)


    +   - Try to avoid phrases like “Everyone hasn''t been able to figure that out,”
    or “You’re not the only person who’s had difficulty with this” because (a) you''re
    acknowledging that he is doing something wrong and (b) by stating that others
    have had problems, you''re empathizing too much and not remaining unbiased.


    # How to avoid


    +   - Making a participant feel as comfortable as possible in the beginning of
    the session will help avoid this. As part of your participant briefing, let the
    participant know that anything he says or will be useful to the team, and that
    problems he experiences are a reflection on the product, not on him; those problems
    are an opportunity for improvement. Say this as sincerely and empathetically as
    possible; we''ve found that just racing through this section of your study plan
    often results in information going in one ear and out the other.


    > Watch Video 1 to see an example of a moderator interacting with a self-blaming
    participant during a usability study. The participant is very nervous about the
    session and is looking for affirmation.


    Visit our website (http://www.modsurvivalguide.org/videos) or use your QR reader
    to scan this code.


    # See also


    +   - 8.1 Participant looks for affirmation

    - 8.3 Participant looks or sounds uncomfortable and/or nervous'
