- pgno: 254
  md: '# 14.1 Fire alarm goes off or the facility needs to be evacuated


    At some point during your session, a fire alarm goes off or there''s some other
    emergency that requires everyone to evacuate. This may happen during an in-person
    session while you''re moderating a session remotely.


    Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Take responsibility; End the session early


    # What to do


    +   - If the session is being held at your facility (or a facility you''ve rented),
    it is your responsibility to bring the participant to safety. Ensure that he gathers
    all his belongings (if time permits) and bring him to a safe place outside of
    the building.


    +   - If your observers are unfamiliar with the facility, bring the participant
    with you and make sure the observers get out safely as well. Prepare the participant
    as you''re on route by letting him know that you need to make your stakeholder
    danger is safe. This gives the participant a heads up that the people''ll see
    next have been watching during the session.


    +   - If you''re recording the session and the situation doesn''t seem to be dire,
    try to pause the recording before you leave. This shouldn''t take long, and will
    keep you from needing to edit the recording later. Of course, if you''re in immediate
    danger, don''t stop to worry about the recording!


    +   - If possible, bring the participant''s compensation with you. This, if you''re
    unable to go back inside in a timely manner, you can still provide the participant
    with his promised incentive.


    +   - Once outside, stay with the participant until it''s safe to go inside. You
    can make casual conversation to pass the time, but remember to stay professional.


    +   - If the participant seems freaked out by the situation, if the situation
    is lasting a long time, or if the weather is inclement, leave the participant
    alone. Thank him for his feedback and provide him with full compensation if you
    were able to bring it with you. If you weren''t, let him know that you''ll coordinate
    with your recruiter for a way to get the compensation to him. Give him your contact
    information as well so he can reach out to you if he doesn''t receive the compensation.


    +   - If your session is being held at the participant''s facility, follow his
    lead as he evacuates the building. Be sure to grab your belongings in case you''re
    unable to get back into the facility later.


    The Moderator''s Survival Guide, http://dt.elsevier.com/10.1016/B978-0-12-40470-6.00014-6

    Copyright © 2014 Elsevier, Inc. All rights reserved.


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_254_0.png)


    257'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 14.1 Fire alarm goes off the facility needs to be evacuated (cont.)


    +   If the section is being held remotely, let the participant (and the observers)
    know that you''re experiencing an emergency and will need to drop off the call.
    Ask the participant to disconnect from the screen-sharing application and any
    associated conference calls, and let him know you''ll get in touch with him when
    it''s safe for you to return to the building. If time permits, add a note in your
    screen-sharing application to let any observers who join while you''re outside
    know is happening.


    # What to say


    For an in-person situation:


    +   "<Participant>, that''s a fire alarm, so we need to evacuate the building.
    Please gather your belongings, and we''ll go outside."


    For a remote session:


    +   "<Participant>, our alarm is going off so I''ll need to leave the building.
    Please go ahead and exit the screen-sharing application and hang up the phone.
    I''ll contact you when I''m able to return to the building."


    # What not to do or avoid


    +   Don''t abandon the participant. Remember that he may be in an unfamiliar location
    and not know what to do. Also, once outside, don''t leave him by himself. Keep
    him company, chatting informally but professionally to keep him engaged and distracted
    from what''s going on.


    # How to avoid


    +   There is no way to avoid this situation. However, you can be prepared by familiarizing
    yourself with your facility''s emergency procedures. If you have control over
    access to the space, make sure a copy of the emergency procedures are printed
    and stored in an easily accessible location. Review these procedures with your
    team at least once a year, and consider conducting a mock drill as well to work
    out the best way to accommodate participants in case of an emergency.


    +   If you''re renting a facility for the study, ask ahead of time if there are
    any special procedures that you should follow in case of an emergency.


    # See also


    +   14.2 A natural disaster (e.g., earthquake, tornado) occurs'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 14.2 A natural disaster (e.g., earthquake, tornado) occurs


    > Your session is interrupted by a natural disaster such as an earthquake, tornado,
    or severe storm. This may happen during an in-person session or while you''re
    moderating session remotely.


    Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Take responsibility; End the session early


    # What to do


    +   If you receive a warning before severe weather, let the participant know.
    Provide as many details as you know—how far away the weather is, the participant
    may want to leave immediately to go. Help them make an informed decision, but
    let him know that he can stay and wait out the weather in your facility if there''s
    any chance he won''t make it safely.


    +   If you live in an area that''s prone to the type of natural disaster you''re
    experiencing, you should have a pretty good sense of what to do. Follow the correct
    procedures for your building and the disaster experienced, keeping in mind that
    you and your organization still have responsibility for the safety and well-being
    of the participant.


    +   End the session, but ask the participant to remain until you verify that it
    is safe for him to leave.


    +   If you''re unfamiliar with what to do for the type of disaster you''re experiencing,
    first, try not to panic. Then,


    +   If you''re experiencing severe weather or a tornado, you and the participant
    should head toward interior rooms or hallways on the lowest floor of your building
    (take stairs, not elevators). If you have observers who are unfamiliar with the
    building, be sure to bring them with you as well. Crouch to make yourself as small
    as possible, and be sure to cover your head with your hands. Avoid windows and
    glass.


    +   If you''re experiencing an earthquake, you and the participant need to drop
    to the ground and take cover (either under a sturdy table, or if one is not available,
    move to an inner corner of the room, crouch, and cover your head with your hands).
    Don''t leave the room until shaking stops. Once the shaking stops, ask the participant
    to gather belongings and bring him (and any observers) out of the building, avoiding
    elevators.


    +   On onsite research at a participant''s home or facility, follow his lead.
    Stay at the location as long as necessary for your own safety, but leave as soon
    as you safely can, as both you and the participant will probably be distracted
    by what is happening.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 14.2 A natural disaster (e.g., earthquake, tornado) occurs (cont.)


    +   - If you forget to give the participant compensation before he leaves, follow
    up with the recruiter afterwards to arrange a way to get the compensation to him.

    - If the session is being held remotely, let the participant (and the observers)
    know that you'' experiencing an emergency and end the session immediately. Ask
    the participant to disconnect from the screen-sharing application and any associated
    conference calls, and let him know you''ll get in touch to reschedule the session
    at a later time. If time and conditions permit, add a note in your screen-sharing
    application to let any observers who join later know what is happening.


    # What to say


    For an in-person session:


    +   - "<Participant>, we''re going to end the session right now. But please stay
    here while we figure out what''s going on—I don''t want you to leave unless we''re
    positive it''s safe to do so.


    For a remote session:


    +   - \<Participant>, we''re experiencing an emergency I need to end the session.
    Please go ahead and exit the screen-sharing application, and hang up the phone.
    I''ll contact you later to reschedule the session.


    # What not to do or say


    +   - Don''t abandon the participant. His comfort and safety is in your hands.


    # How to avoid


    +   - We highly recommend reading FEMA''s guidelines on what to do in case of
    emergencies, available at www.ready.gov. Read them—you won''t have time in the
    event of an actual emergency!


    +   - There''s no way to avoid a natural disaster. However, you can be prepared
    by familiarizing yourself with your facility''s emergency procedures. If possible,
    create an emergency kit in your space that includes a flashlight. If you''re renting
    a facility for the study, ask ahead of time if there are any special procedures
    that you should follow in case of an emergency, especially if you''re in an area
    that is prone to disasters that you''re unfamiliar with.


    # See also


    +   - 14.1 Fire alarm goes off or the facility needs to be evacuated

    - Survival Story: “The ground started to move” in Chapter 3'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 14.3 Participant starts to look ill or otherwise unwell


    While the participant seemed fine at the beginning of the session, he starts to
    seem ill or unwell later on. He may become very pale, start sneezing/coughing
    uncontrollably, develop motor control difficulties, or faint/collapse.


    Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Take a break; End the session early


    # What to do


    +   - For minor-symptoms such as coughing or sneezing, offer to let the participant
    take a break (in case he''s experiencing an allergy attack or something temporary)
    or end the session early. If he''s coughing, also offer to get him some water.

    - If the participant has collapsed or is showing signs of motor control difficulties
    that didn''t exist before, immediately call for help.

    - For a faint or collapse, find someone who can bring water to stay with the participant.
    When the participant comes around, offer to call someone to pick him up or offer
    some other way to make sure he gets safely (e.g., by arranging a cab).

    - For a seizure or other motor control issue, call 911. In some corporate buildings,
    you may need to call building security first and ask them to call 911. Your first
    priority is to get the participant the care he needs. Don''t try to restrain the
    participant, but remove any sharp objects that he may run into. Stay in the room
    with the participant until help arrives.

    - If the participant leaves the session abruptly (e.g., in an ambulance), follow
    up with the recruiter afterwards to see if he''s okay and, if appropriate for
    your study and his physical condition, he''d like to be rescheduled. You can also
    arrange a way to get his compensation.


    # What to say


    If the participant looks pale or is sneezing/coughing:


    +   - <Participant>, are you okay? Let me know if you want to take a break, if
    you need to end the session early, or if I can help in any way.


    If the participant begins having serious motor control difficulties or faints,
    immediately get him help:


    +   - <Participant>, I''m going to call 911 (or contact building security) and
    stay right here with you until help arrives.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 14.3 Participant starts to look ill or otherwise unwell (cont.)


    # What not to do or say


    +   - Don''t ignore the participant''s condition. Remember your ethical responsibilities
    to protect the participant from harm.


    # How to avoid


    +   - Unfortunately, these situations are pretty unavoidable. Within your testing
    environment, be sure to use antibacterial cleaner and have hand sanitizer available
    to limit the chance of an ill participant spreading your germs to you (and other
    participants).


    +   - Also, if your facility has a security presence, ask them if there''s some
    facilities with extensive security services ask you to contact them first so they
    can coordinate directly with 911.


    # See also


    +   - 14.4 You begin to feel unwell while moderating a session


    +   - 14.6 Participant seems to be drunk or stoned'
