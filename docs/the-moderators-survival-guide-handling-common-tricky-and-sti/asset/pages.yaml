- pgno: 297
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    If you feel that you have a strong relationship with the person you''d like to
    give feedback to and aren''t worried about his reaction, you can try a more direct
    approach. But don''t just giving him feedback; start by asking if he''d like to
    hear it:


    +   - I had a chance to watch one of your sessions, and thought that you did a
    good job. There were a couple of things that I noticed while you were moderating.
    You have a lot going on, would you be interested in hearing my feedback?>


    +   - <Hey <moderator>, great session! I know if it were me, I''d want to hear
    any feedback that other moderators have for me (and please let me know what you
    have for me!). So I have a couple of ideas to bounce off what I noticed watching
    you moderate, if you''re up for hearing them.


    Of course, a direct way of giving feedback is to present it in a funny way. For
    example, "Heh, when you were upset, ''Are you having a problem?'' and the participant
    got upset and was like, ''Um-NO!'' We received feedback veiled in humor before
    we''ve given the message and were glad to hear it! But course of using humor can
    be touchy, so if the person you''re giving feedback doesn''t respond, responds
    negatively, avoid using that approach him in the future.


    Also, keep in mind everything you''ve learned when presenting user research findings:
    discussing what worked help the more negative feedback be received smoothly.


    Another way to exchange feedback is to set up a process where you and your colleagues
    can submit feedback. For example, if you work on a large user research team, you
    could create an anonymous survey to fill out each study. Or the survey could "suggestion
    box" ideas, collecting generalized feedback that is not specifically targeted
    to any one researcher or study. The entire team can then get together and discuss
    the comments. It''s a great way to continuously moderating techniques and improve
    everyone''s skills.


    If you''re hiring a consultant to work with or for you on a project, he might
    solicit feedback on his performance after the project has ended. This mechanism
    is in place, make sure to include feedback on his moderating. If something like
    that is not in place, consider working with the agency to instantiate a feedback
    loop for that purpose.


    # 16.4 Spread your wings


    We hope this book has provided you with the confidence to handle anything that
    gets thrown your way while moderating user research. Even if many of the situations
    listed are uncommon, we recommend that you flip through them anyway. So you should
    be able to make connections between the patterns, steps, and best practices we''ve
    presented to you, and our recommended courses of action in the many normal, abnormal,
    boring, interesting, common, intimidating, zany, and scary situations you''ve
    read. Internalizing those connections and recommendations, and continuously working
    to improve your skills as discussed in this chapter, will help you handle any
    new situations that arise—with confidence.


    304'
