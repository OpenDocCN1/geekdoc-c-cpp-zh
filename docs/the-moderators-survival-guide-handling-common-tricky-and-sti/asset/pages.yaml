- pgno: 204
  md: '# 11.6 Participant does not seem to respect you or take you seriously


    The participant does not seem to take you seriously. She seems to think that you''re
    really young or inexperienced, old and out of touch, or are operating at a different
    (lower) level than she is. Participants who have a lot of authority in their jobs
    (e.g., doctors, high-net investors, executives) act this way, especially if they
    feel like the session may be a waste of their time. Their feelings come across
    as condescension (e.g., "You wouldn''t know the kind of things I have to go through")
    or rudeness (e.g., "You probably weren''t even alive then")


    +   Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Redirect the participant; Build engagement


    # What to do


    +   - Be unfailingly polite. Think of it as a challenge to get the participant
    to leave the session with a newfound respect (or at least a grudging acceptance
    for you)

    - If the participant points out how old you are, or for any other personal information
    about yourself, try to avoid directly answering the question. For example, if
    she asks how old you are, you can say that you''re not answer and quickly redirect
    to another topic. Providing personal information shifts the balance of the session
    away from your control and may take the participant further off topic. However,
    if you do not answer the question perceived as rude, you should provide a quick
    answer immediately by a redirect back to the task or at hand. If you''re comfortable,
    you can also try using humor. For example, if the participant asks what year you
    were born in, you can say, "I''m a baby boomer that''s neither here nor there!
    Can you tell me about..."

    - Consider playing the role that the participant seems to cast you in by asking
    the participant to explain things to you. For example, the participant seems to
    think that you''re too young or inexperienced to understand the kind of issues
    she facing with retirement, respond immediately by asking her to tell you more
    about her situation and the challenges she''s facing. This approach has the advantage
    of flattering her ego, and may help her “buy in” to the session.


    # What to say


    +   - "I’d rather not answer question right now, but I would like to tell you
    more about me..."

    - "You alluded to some of the factors that you''d consider important when making
    this decision. Tell me more about those factors and how they would influence the
    choice you''d make."'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 11.6 Participant does not seem to respect you or take you seriously (cont.)


    +   - It''s really important for us to get the perspective from someone with your
    experience and expertise, so we''re really grateful you found the time to come
    in. We want to make sure that this product will be designed to meet your needs.


    # What not to do or say


    +   - Don''t feel obliged to share personal information with the participant.


    # How to avoid


    +   - Establish your credentials and your role at the beginning of the session.
    Let the participant know that you''re a neutral observer, not a subject-matter
    expert.

    - Treat the participant with respect by using her title (e.g., Dr. Smith) until
    she tells you otherwise.

    - If the participant has a high-level role or a lot of authority in her job, acknowledge
    that the role she plays in her organization is a critical one you''ll make good
    use of her time.


    # See also


    +   - 11.7 Participant becomes insulting or has an agenda

    - Survival Story: “I would have trusted my gut"'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 11.7 Participant becomes insulting or has an agenda


    During the session, the participant says something insulting or disparaging that''s
    directed toward you, your stakeholders, or your organization. If the comment is
    directed toward your organization, she may be venting based on experiences she''s
    had outside of the session. She may have to come to the session with an agenda
    or to nudge a nurse, and wants to make sure her opinion gets heard. This kind
    of behavior can happen with both an organization''s internal employees and its
    customers.


    Method(s): Any

    Frequency: Rare

    Pattern(s) to use: Redirect the participant; Take a break; End the session early


    # What to do


    +   If the participant seems to be venting about your stakeholders or your organization,
    provide her with a focused outlet for her. For example, you can acknowledge that
    she seems to be upset about experiences she''s had, and suggesting the next few
    minutes to have her breath what happened and then proceed with the rest of the
    session.


    +   If the participant insults you directly (e.g., “You''re really bad at this”),
    take a moment before responding. You may be in shock but need to carefully think
    through your next step so you avoid escalating the situation. Try to ignore the
    comment and move without acknowledging it, or place that topic out of scope (e.g.,
    “That is not relevant to our session today”) before quickly moving on to another
    area of discussion.


    +   Try your best not to react, and maintain a neutral expression and tone. This
    may be difficult to, especially if you feel personally attacked, but do your best.
    Take a deep breath, control your face, and imagine the participant comments rolling
    off you like water on a duck''s back—don''t let them stick.


    +   Take a short break if necessary so you can recover and maintain neutrality
    in front of the participant. Use the break to consider your options for what you
    can do to improve the session you rescue.


    +   If the participant''s insult was in the context of what you''re doing for
    the study (e.g., a derogatory remark when you ask her to use a website she dislikes),
    clarify your role and responsibilities as a neutral observer and what your expectations
    are for what she''ll be doing. Apologize for any misunderstandings and ask if
    she has any questions about how the session will work.


    +   If the participant''s comment seemed sparked by what you were asking her to
    do or talk about (e.g., “Only an idiot would vert to do that”), change the topic
    of conversation or redirect the participant to the next task or section of your
    study plan.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 11.7 Participant becomes insulting or has an agenda (cont.)


    +   If the participant continues to be insulting or disparaging toward you or
    becomes confrontational, end the session early and pay her promised compensation.
    Remember you need to look out for your emotional well-being and that additional
    data point you''d gain by sticking with the session is not worth it.


    # What to say


    For a venting participant:


    +   You keep alluding to some really bad experiences with <organization>. Why
    don''t we take the next few minutes to share your experiences? However, after
    five minutes, we need to get back to my list of questions. Does that sound okay?


    +   Thank you for sharing that experience. Part of why this research is being
    performed is to improve what users go through, so your feedback will hopefully
    keep others from going through bad experiences. So, let me ask you <return to
    your study plan>.


    For a participant who deliberately insults you:


    +   This topic is not relevant to our session today. Let''s go back to our questions/tasks,
    unless you''d like to take a short break first?


    To redirect a participant:


    +   I''d like to bring your attention now to <next task or question>.


    # What not to do or say


    +   Don''t get pulled into the participant''s agenda.


    +   Don''t insult or get into an argument with the participant, even if you really
    want to! Remember to stay professional.


    +   If the participant insulted a group of people who you strongly identify with,
    don''t bring up yourself as a counterpoint to whatever the participant said.


    # How to avoid


    +   Be upfront with participants about the purpose of the session. This may not
    filter out everyone who has an agenda, but may reduce the odds.


    +   Pay attention to the participant''s emotional state throughout the session
    and diffuse earlier discomfort before it escalates to insults or disparagement.


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_207_0.png)'
