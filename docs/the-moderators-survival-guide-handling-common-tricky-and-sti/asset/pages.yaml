- pgno: 147
  md: '# 8.5 Participant asks, "Did other people have trouble with this?"


    The participant struggles with the product and asks you if other people also had
    difficulty. Or, he may ask a similar question about his performance or the experience
    of your other participants.


    Method(s): Usability study

    Frequency: Frequent

    Pattern(s) to apply: Redirect the participant; Reassure the participant


    # What to do


    Participants often want to know if they''re the only ones who can''t understand
    something. If a participant knows that others had trouble too, he thinks he''ll
    feel better about any problems he''s having. Because the question is asked directly,
    you may feel on-the-spot to answer or address it.


    +   - Avoid answering the question, even if you want to say "yes" to make the
    participant feel better.

    - Try to turn the question into an affirmation that his individual approach and
    feedback is what really matters, then redirect the conversation to the close subject.

    - If it feels too disingenuous and you feel to give some kind of answer, tell
    the participant that you can''t remember or are not sure, and quickly redirect
    to another question or task.


    # What to say


    +   - "What matters is your experience, which we can learn from. Tell me more
    about what you''re experiencing here...."

    - "I''m not sure, but tell me about what you''re thinking here...."


    # What not to do or say


    +   - Do not respond "yes" or "no.\ Saying "yes" to a participant has an inherent
    bias because he may change his approach and reaction to the product given the
    new piece of information. Saying "yes" also may come across as agreeing with him,
    which breaks your neutrality. Saying "no" may make him feel inadequate or insecure
    about his abilities.


    # How to avoid


    +   - There is no good way to prevent this question from coming up. However, you
    can reduce the odds by telling the participant at the beginning of the session
    that you''re trying to be a neutral'
  merge: -1
