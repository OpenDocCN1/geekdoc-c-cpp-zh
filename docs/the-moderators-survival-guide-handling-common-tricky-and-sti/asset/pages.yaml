- pgno: 262
  md: '# 14.5 You notice a bad smell or have an allergic reaction


    A very unpleasant smell distracts you during the session. The smell may be coming
    from the participant or, if you''re at the participant''s location, from the environment
    itself. If you''re in the participant''s home, the smell may also be accompanied
    by unsanitary living conditions such as rodents, cockroaches, and unwashed dishes.
    Similarly, something that either the participant is wearing or that''s present
    in the environment may be causing you to have an allergic reaction.


    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: Take a break; End the session early


    # What to do


    +   * Try moving to a different position in the room (e.g., from the participant''s
    right side to his left side). A few inches may make a big difference in how you''re
    being affected by the allergen or smell.

    * If you''re in the participant''s home and changing positions in the room hasn''t
    helped, ask if there''s another room that you can use for the session. This question
    can be phrased clearly so the participant won''t feel insulted, ideally by tying
    the movement to the reason for the session. For example, you could ask the participant
    to show you you''re discussing.

    * If you don''t feel able to end the session (e.g., because you really need this
    participant''s feedback), take a short break and get some fresh air.

    * If you''re in a location where bad smells are for the course (e.g., an animal
    testing facility, certain manufacturing facilities), consider being honest with
    the participant and letting him know that you''re having a hard time with the
    smell. He may be able to bring you to a location that''s better ventilated and
    less odorless.

    * If the smell is making you feel sick and you''re unable to continue, go ahead
    and end the session. If you still want to get feedback from the participant, you
    can ask if he''d be willing to talk to you more by phone.


    # What to say


    +   * “I''m sorry, I think I might be allergic to <something in this room>. Is
    there another location that we could talk in?”

    * “Let''s take a short break and resume again in five minutes. Can I get you a
    drink while you''re waiting?”'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 14.5 You notice a bad smell or have an allergic reaction (cont.)


    +   - “I know you warned me about this ahead of time, I’m having trouble handling
    the smell in. Here is another location we can move to for a little bit?”


    # What not to do or say


    +   - Try not point out a smell unless it''s something that''s expected from the
    kind of location you''re in (e.g., a factory or manufacturing facility). Doing
    so would be rude and potentially insulting.


    # How to avoid


    +   - We wish there was a way to avoid this situation, especially when it comes
    to contextual inquiry, there’s only so much you can do. For site visits, you can
    ask ahead of time what kind of environment to expect, but these kinds of olfactory
    issues may come up. There’s no way (that we know of) to avoid participants with
    poor personal hygiene.


    +   - If you have known allergies (e.g., to cats or dogs), be prepared and have
    medication with you at all times.


    # See also


    +   - 12.5 Participant has disconcerting or distracting physical characteristic


    +   - 14.4 You begin to feel unwell while moderating a session


    +   - Survival Story: “I knew what it was like”'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 14.6 Participant seems to be drunk or stoned


    When the participant arrives, you notice that something seems a little off about
    him. His eyes may be glassy or red, he may smell heavily of alcohol and have slashed
    speech or difficulty walking.


    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: End the session early


    # What to do


    +   - End the session early, provide the participant with compensation.

    - Ask the participant how he got to the session. If he drove himself and wouldn''t
    be comfortable with him getting behind the wheel, encourage him to take alternate
    transportation instead (e.g., a cab, calling a friend) and offer to arrange it
    for him. Remember your responsibility to the participant''s safety.

    - If you have onsite building security, contact them for assistance. They may
    be able to wait with the participant and provide additional help.

    - If the participant refuses your suggestions and insists on driving, and you
    don''t have an onsite security team, get his car''s key and model, and contact
    the police right away.

    - If the participant is making you uncomfortable in any way, trust your gut and
    end the session as quickly as possible. Contact security and the authorities if
    you''re worried about your safety or that of others in your location (see section
    14.9 for more on handling this).


    # What to say


    +   - “Thank you for coming today. You seem a little distracted, so why don''t
    we reschedule for a day and time that works for you.”

    - “Is there someone I can call to take you home, or can I call you a cab?”

    - “I’m sorry, but we’re going to have to cancel the session due to some technical
    difficulties. Thank you so much for coming in and here''s your compensation. Let
    me walk you to your exit. How did you get here today?”


    # What not to say or do


    +   - Don’t run a session with a participant who you think is physically unable
    to give accurate and useful feedback. Let participants who are under the influence
    go home safely.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 14.6 Participant seems to be drunk or stoned (cont.)


    +   - Ensure that you have another person (e.g., an observer or someone from your
