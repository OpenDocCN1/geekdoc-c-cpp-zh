- pgno: 136
  md: '# SURVIVAL STORY: "THE LIGHTS SEEMED DIMMER THAN NORMAL"

    CAROL SMITH


    Usability studies have always had challenges, but the biggest one I''ve faced
    came when the building I was conducting the testing in lost power!


    I was contracting to a large company in a big suburban office park. Driving in,
    everything had seemed okay despite the bad weather, but as I came into the building
    I noticed that the lights seemed dimmer than normal. I hurried to the testing
    lab and when I got found that the lights were not working. Luckily there was a
    lot of natural light from large windows across one side of the room.


    It was too late to contact participants as this was a relatively large city and
    participants were most likely in route or to arrive fairly soon.


    Luckily all of the consent forms and other supporting documentation were ready
    to go. The study was to test a clickable prototype on a desktop computer running
    Morae. Someone had either planned for such an instance or we got very lucky, as
    the testing machines were all plugged into outlets connected to the backup power
    generator.


    As participants arrived, I explained the situation to them and told them that
    if it made them uncomfortable we could try to reschedule. I was especially concerned
    because I needed to walk them down a very dark hallway to entering the testing
    room. I cannot think of a more stressful way to enter a study if the dark makes
    you nervous.


    This situation only affected a few participants and they were very understanding.
    I was careful to make sure the participants feel safe before beginning each session.
    By the third participant that day the power came back on and I continued the study
    without further issues.


    Having the necessary documents prepared ahead of time was a lifesaver. As much
    as possible I try to continue to plan for each day''s testing the day before.
    Regardless, it was pleasantly surprising how much we could do without electricity!'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# CHAPTER 8


    # Is This Right?

    Responding to Uncertain Participants


    The artificial situation created by user research may cause participants to be
    nervous or worried about not being a “good” participant. Even if you tell a participant
    that he''s not being tested, a usability lab setting or the presence of recording
    equipment and observers may be intimidating. You need a set of responses and comforting
    steps that can help reassure the participant and make him more comfortable with
    the session.


    +   8.1 Participant looks for affirmation 137

    8.2 Participant asks for your opinion 139

    8.3 Participant looks or sounds uncomfortable and/or nervous 141

    8.4 Participant is self-blaming 144

    8.5 Participant asks, “Did other people have trouble with this?” 146

    8.6 Participant is unwilling or unsure 148


