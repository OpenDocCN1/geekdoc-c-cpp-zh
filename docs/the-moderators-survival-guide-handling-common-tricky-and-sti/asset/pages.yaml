- pgno: 242
  md: '# 13.4 Participant flirts with you


    > The participant seems to be more interested in smiling at you than actually
    focusing on the session. She may use subtle hints like smiling and ogling, or
    perhaps stronger hints like asking you out on a date or propositioning you. It
    feels awkward or uncomfortable for you, not to mention a little embarrassing if
    you''re being observed and recorded!


    Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Redirect the participant; Disengage from the participant;
    Take a break


    # What to do


    +   - If the flirt is subtle (e.g., smiling or ogling), ignore it rather than
    acknowledging drawing attention to the participant''s behavior.

    - If a participant becomes more and more flirtatious throughout the session, try
    to make your intentions of professionalism by redirecting attention to what is
    being researched, and gently pulling away physically. Adjust your body to be turned
    slightly away from behind the participant, and use a neutral, formal tone. Don''t
    give in to her flirting to be nice or accommodating.

    - If the situation escalates further (e.g., to direct questions or propositions),
    use more explicit language to redirect the participant back to your session goals.
    If you''re comfortable using humor, you can use a firm humorous tone for the redirection,
    especially if the participant also has a joking tone. The benefit of this approach
    is by responding in a similar tone, you may keep the participant from feeling
    embarrassed while regaining control of the session. If it continues unab, let
    her know her questions are inappropriate or not relevant to the study and you''d
    like to bring her attention to the task.

    - If being direct doesn''t help the situation, consider using another reason to
    end the session early, such as getting through your material faster than expected
    or technical difficulties. Or, if you have someone else who is able to manage
    the remainder of the session, you could tell the participant that for the next
    section of the session, she''ll be talking to that person. Leave the room and
    have colleague step in and take over.

    - If the participant persists any of her flirtatious behavior after the session
    is over, kindly let her know that you''re obligated to keep your relationship
    with participants professional and thank her again for coming in.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 13.4 Participant flirts with you (cont.)


    # What to say


    If complimented in a way that you feel compelled to look at this area....


    +   - “Thanks. Why don’t you go back to...<task/question>.”

    - “Okay. Let’s go back to...<task/question>.”


    If you need to redirect a flirtatious participant:


    +   - “If it’s okay, I want to stick to the agenda for the session because we
    have a lot to get through. Let me bring your attention back to...."


    If you’re having a colleague take over moderating duties for the session:


    +   - “Okay <participant>, for the next part what I’m going to do is have my colleague
    come in and join you. She’ll be right in"


    If the participant asks you before or after the session:


    +   - “It’s very nice to meet you. But I have an obligation to keep our interaction
    on a professional level.\"


    # What not to do or say


    +   - Don’t yield to flirting or give the perception that you welcome that behavior!
    It’s important to draw the line and keep the session professional, especially
    if you’re on a site visit at someone’s home or if the participant is at your facility
    after hours when few people are around. Over friendly or flirtatious behavior
    can lead to bad things—physical danger or legal liability.

    - Don’t embarrass the participant!


    # How to avoid


    +   - There’s no easy way to avoid a flirtaty participant, but if you notice a
    participant becoming more friendly or starting to flirt, adapt your style immediately
    to a more disengaged (less friendly) demeanor before it escalates to a more awkward
    situation.


    Watch Video 4 to see an example of a moderator dealing with a flirtatious participant
    during a usability test. The participant starts off being friendly but becomes
    more forward as the season progresses.


