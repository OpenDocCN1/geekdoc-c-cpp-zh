- pgno: 80
  md: '# Survival Story


    # SURVIVAL STORY: "AN UNEXPECTED PICTURE STARTED TO EMERGE"\ANONYMOUS


    In mid-2012, I was one of the user experience researchers for an interview-based
    study designed to inform our new personas we were building. The main research
    goal of this exercise was to determine our customers'' emotional relationships
    with their money.


    The day had been going well; I was viewing sessions remotely, taking notes for
    the moderator. At the beginning of the next session, the male participant who
    entered seemed "normal" enough—30 years old, informally, yet neatly dressed, and
    pretty articulate. As my colleague warmed him up during the background interview,
    an unexpected picture started to emerge.


    > You just told me the economic downturn necessitating back in your family, is
    that right?” (Sadly, this was not an infrequently heard fact—even worse were stories
    of participants who didn''t have a "home" to go back to as they were on the brink
    of losing their houses and honestly he did not know where they would turn next.)


    > “Well, yes, but I kind of tired of that. So I moved after a few months. Into
    my … . car.”


    My colleague could not have handled this startling news with more grace. The participant
    went to detail on his grooming rituals, which included using baby wipes, mouthwash,
    and powder.


    For the personas we were building


    What surprised and impressed me the moderator''s reaction was, once, she had determined
    that the participant no longer qualified, she took a few minutes to gain composure
    and figure out what she would do next. She waited long enough past the critical
    moment to put her suspicion at bay, especially given her lack of reaction when
    she was listening to him.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# CHAPTER 5

    Participant Misconceptions:

    Not What the Participant was Expecting


    When there is a mismatch between the participant''s expectations for the session
    and what you have planned, you need to clarify your expectations before continuing.
    If the participant brought someone or something else with her to the session,
    you also need to tactfully and quickly figure out if, and how, to proceed. These
    situations require you to immediately take responsibility for any misunderstanding
    and figure out the best way to move forward.


