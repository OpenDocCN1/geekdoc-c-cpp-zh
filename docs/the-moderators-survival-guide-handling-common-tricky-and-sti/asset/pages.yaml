- pgno: 24
  md: 'moderators propose only interrupting participants during tasks if absolutely
    necessary, and keeping their interruptions confined to minimal phrases, or when
    Dumas and Loring (2008) refer to as “acknowledgement tokens” like “so” and “mmhm”.
    Even if the participant is upset or distressed, their interaction with her would
    not change.


    Some user researchers in the science camp think-al-protocol as a biasing factor
    in usability studies, citing research like Boren and Ramsey (2000). Instead, they
    watch the participants silently and ask detailed questions later.


    We don''t see the science and art approaches as a binary choice, but rather as
    the endpoints of a spectrum. Depending on the study goals and moderating, your
    approach may fall anywhere along spectrum.


    Because the majority of studies we''ve conducted have been formative (where the
    goal is to improve and learn rather than measure), our approach leans toward the
    art of moderating. This approach allows for more natural interactions with participants
    and, in our experience, lets you be more responsive when the unexpected occurs
    and acknowledgement tokens won''t cut. In types of research other than usability
    studies, there is an even stronger need for there to be summative. A flexibility
    level is fundamental for moderating those methods. For example, an interviewee
    may raise a topic relevant to your study goals that you had not planned on discussing,
    and you''d like to follow up. During a contextual inquiry, you may not anticipate
    how the participant will do some of her work, so you may need to muster up on-the-spot
    questions about what she is doing.


    We found that the science approach works best for summative research (where the
    goal is to measure or validate a product) and when biometric or eye-tracking devices
    are used. However, for summative research, needing to prioritize the participant''s
    well-being, even if it means sacrificing your data''s integrity. For example,
    if the participant starts crying during your summative usability study, you should
    respondately instead of maintaining your neutral acknowledgments. This may mean
    your time measurements or other metrics may be affected, your ethical priority
    is toward the participant.


    Where your approach should fall on the science/art spectrum depends on varying
    contexts, such as:


    +   The type and nature of the research—is a usability study, contextual inquiry,
    or an interview? While bias is a concern for all methods, influencing participant
    behavior during usability studies or contextual inquiries might be a bigger concern
    than influencing attitudes stated in an unstructured interview.


    +   If it''s a usability study, is it formative? A summative study requires strict
    assessment, usually measuring the user experience with metrics like task time
    and task success. Interruptions and exploratory questions may come at a cost in
    data quality. A formative test is meant to be more exploratory and anecdotal,
    so there is usually room for more conversation and creative follow-up tasks/questions.'
