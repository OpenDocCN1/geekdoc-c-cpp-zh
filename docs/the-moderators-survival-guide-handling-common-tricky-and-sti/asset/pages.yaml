- pgno: 238
  md: '# 13.2 You know the participant, or the participant knows you


    > The participant may be someone you know socially, someone you dated, or someone
    you know from outside of work. She may even be your friend, or someone you''ve
    heard about through personal or professional circles but haven''t actually met
    in person.


    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Disengage from the participant


    # What to do


    +   - Acknowledge your acquaintance with the participant and be yourself, but
    keep any casual conversation to a bare minimum.

    - Whether it''s an ex-partner, old friend, relative, or distant acquaintance,
    do your best to keep outside knowledge of the participant out of the session unless
    that is related to her not meeting the study criteria.

    - If you know something about the participant that disqualifies her from participating
    (e.g., your recruit criteria was for HR managers but you know the participant
    is in a different group), bring up your knowledge as question to see if it''s
    accurate. If it''s accurate and she is not qualified, let her go or, as discussed
    in section 3.8, see if there''s a way to adapt the session.

    - If you''re worried you won''t be able to treat the participant neutrally (or
    vice versa), ask another member of your team to mediate the session for you instead,
    if that is possible, stick close to your study plan and do your best to put aside
    your concerns and treat the participant just like any other.

    - Before the session starts, let your observers know that the participant is someone
    you know. You don''t have to go into detail about how you know the participant,
    but it''s better to let the observers know ahead of time so they''re surprised
    or worried if the participant seems like she knows you.

    - If the participant is overly friendly with you or brings up personal details
    that you''d rather not, remind her that you want to get her feedback as part of
    the session and that you can catch up after the session is over. You can also
    remind her that she is being observed and recorded.


    # What to say


    +   - “It''s good to see you again. We have a lot to get through during the next
    <number of minutes>'
