- pgno: 142
  md: '# 8.3 Participant looks or sounds uncomfortable and/or nervous


    > The participant looks uncomfortable and/or nervous. If you''re in a usability
    lab, you may notice that he is looking around the room and at the cameras, his
    arms are crossed, and he is very quiet.


    Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Reassure the participant; Build engagement; Take a break


    # What to do


    Usability participants often are nervous and uncomfortable at the start of the
    session. They may be surprised that it''s a one-on-one situation rather than a
    focus group, or feel nervous about being watched. And, of course, as much as we
    tell them they''re not being tested, sometimes they still feel like they. Similarly,
    contextual inquiries are all being watched, so a participant may feel awkward
    or nervous about your presence.


    +   - If a participant seems nervous at the beginning of the session, try to ease
    his discomfort so that he doesn''t get even more nervous. Spend a few minutes
    asking him who he is, if he had any difficulty getting to your location (if applicable),
    and/or other niceties like the weather or (nonroversial) news of the day. Ask
    if he has participated in any kind of research before to get a sense of any prior
    experience. Then, proceed to your normal participant briefing.

    - If the participant seems nervous about being observed, explain at a high level
    what the observers are and why they''re watching. You can reassure him that it
    may feel strange to be watched, you''ll be the only person interacting with him
    and after a while he''ll probably forget the observers.

    - Remember to check if there is anything you could contribute to the situation,
    as discussed in 2.3. Check your body language and anything you''ve done during
    the session may be contributing to the participant''s nervousness. For example,
    ensure that you''re not sitting too close to the participant, or doing anything
    uncomfortable like staring intently at him.

    - Tone of voice can go a long towards calming a participant''s nerves. Be genuinely
    interested in what he says, which will help keep your tone and gentle, while still
    neutral and nonpatronizing. This is a tricky balance to achieve but an effective
    one.

    - Provide occasional reassurance that the participant''s feedback is helpful.
    For more on how to provide this reassurance, see the Chapter 3 sidebar “Should
    You Tell a Participant That Her Feedback Is Helpful?”'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 8.3 Participant looks or sounds uncomfortable and/or nervous (cont.)


    +   - If a participant seems extremely nervous or uncomfortable, and is not responding
    to the previous suggestions, take a short break. After the participant has had
    a few minutes to himself, you can ask him, in private (e.g., outside of the research
    room), if he is okay to continue with the session.


    # What to say


    Before the session:


    +   - "Please know that we''re not testing you or your abilities; you''re here
    to help us <evaluate the product/learn more about your process>."


    +   - "Anything you do or say is useful for us to know; there are no wrong answers."


    If disclosing observers:


    +   - "Any observers who may be watching are all on the team for this project,
    and want a chance to see feedback from their <current/potential> users—both positive
    and negative."


    +   - "Even though there may be observers, you''ll only be interacting with me.
    After a while, you may forget that anyone else is watching."


    During the session:


    +   - "This is just the kind of feedback we want to hear."


    +   - "All of this has been very helpful to hear and see. Thank you for your continual
    feedback."


    # What not to do or say


    +   - If your modifying style is similar to the Down to Business style described
    in section 1.5, you may find that a hands-off approach makes a participant''s
    natural nervousness even worse. Instead, adapting your style to be a bit more
    reassuring and gentle with your questions and instructions.


    +   - Don''t ignore a participant''s nervousness, as this may make him even more
    nervous or uncomfortable.


    # How to avoid


    +   - Nervousness can''t usually be avoided but can be tempered by some of the
    techniques discussed—adapting to a more gentle style, ensuring a participant upfront
    that he is not being tested, and reassuring him throughout the session that what
    he is doing is helpful. Also, follow the tips described in section 2.3 to ensure
    that you don''t contribute to a participant''s nervousness.'
  merge: -1
  img_proc: true
