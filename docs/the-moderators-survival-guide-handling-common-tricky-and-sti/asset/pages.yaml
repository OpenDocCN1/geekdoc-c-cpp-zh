- pgno: 46
  md: 'If your first attempts to regain control don''t work, you may need to use stronger
    language to rein the participant back in:


    +   I apologize for interrupting, but it''s really important that I get your feedback
    on this <task/topic>. If you don''t, let''s return to that, and if there is time
    at the end of the session, we can return to this discussion in detail.


    Also, check that your body language projects an appropriate authority level. Maintain
    eye contact with the participant and angle your body toward—this will help draw
    their attention and increase the odds that he''ll pay attention to you. However,
    never touch the participant, even as a way to get his attention or give him comfort.
    Remember that many people do not like being touched by strangers and the inherent
    power imbalance in a moderating session can make any touch completely inappropriate.


    If the session is veering out of control through no fault of the participant (e.g.,
    technical problems), avoid your frustration and do your best to get emotion out
    of your voice. The participant may feel like you''re directing irritation at them.


    Another reason you may need to regain control is when the participant does not
    meet the desired criteria and you must adapt accordingly. One approach to this
    situation is to transition the session into a different type of research. This
    works especially well if the participant is an important customer, or part of
    a user group, who you want to feel validated and listened to. For example, a usability
    study with a customer who doesn''t match your target user profile may be transitioned
    into an interview that will provide more information about his profile. Be sure
    to discuss these options with your stakeholders to know what they''re having and
    provide input on other types of feedback they might be interested in. If, the
    participant will be able to provide any kind of useful input (e.g., if his role
    is entirely unrelated to yours), you may need to politely end the session.


    No matter what situations you encounter, the steps discussed in this session should
    help you figure out the best approach to resolve them. In doubt, think back to
    what you would want to do if your positions were reversed—how would your moderator
    handle the situation? Chapter 3 details some of the specific interaction patterns
    that you can apply to help with this resolution.


    We talk more about how to use your body language in section 3.5.


    This technique is also referred to as shifting the focus, which we discuss more
    in section 3.8.'
