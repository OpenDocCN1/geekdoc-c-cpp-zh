  md: "# 10.6 Participant is difficult to hear or understand\n\n> When the participant\
    \ talks, you have a difficult time hearing or understanding him. He may have a\
    \ very soft voice, be a fast talker, or have a thick accent. If the session is\
    \ remote, a poor-quality phone connection may make it even more difficult to hear\
    \ or understand.\n\n+   Method(s): Any\nFrequency: Occasional\nPattern(s) to apply:\
    \ Take responsibility\n\n# What to do\n\n+   - Make the session is recorded so\
    \ you can go back and review the participant's feedback closely.\n- If you're\
    \ running a usability study, ask the participant to use his mouse (or finger if\
    \ the product does not have a screen) to indicate the areas that he is providing\
    \ feedback on. This can also provide vital context that may help you understand\
    \ his feedback.\n- If you're having difficulty hearing the participant:\n  - Ask\
    \ the participant to speak. This situation is a good place to use a pretext of\
    \ the recording equipment having difficulty capturing voices if the participant\
    \ is too quiet or a poor phone connection that keeps cutting out.\n  - If the\
    \ participant is remote, ask him to move closer to his phone or microphone. Also\
    \ check the volume on your phone's speakers or screen-sharing software to ensure\
    \ that it is turned up as high as possible.\n- If you're having difficulty understanding\
    \ the participant:\n  - If the session is in person, look at the participant's\
    \ face and maintain eye contact while he's talking, even if that means you need\
    \ to take detailed notes. Sometimes maintaining eye contact and being able to\
    \ see the participant's facial expressions can help you understand what he is\
    \ saying.\n  - If the participant is remote, ask the participant to repeat what\
    \ he said, using difficulties with the phone connection as a pretext. However,\
    \ this may not be practical if the participant continues to be difficult to understand.\
    \ In those situations, you can use this tip occasionally, but accept that you'll\
    \ need to go back to the records later.\n  - Ask the participant to read tasks\
    \ aloud. This may help “calibrate” to the participant’s way of speaking as he'll\
    \ be reading something that you know."
