- pgno: 29
  md: 'Conversely, other situations require you to draw a participant out and build
    engagement. Consider a fairly scripted interview where the participant is quiet
    and reserved. She seems like is either shy or nervous about the session. If you''re
    more of a By the Book moderator, you may need to turn on the Friendly Face to
    help her feel more comfortable. A genuine smile and sincere tone of voice can
    help the participant out of her shell without biasing her feedback.


    There is no precise way to pinpoint a participant''s or moderator''s personality,
    making it difficult to give one-size-fits-all advice for moderating. But our hope
    is that we''ve made you aware of different moderating styles and how these styles
    can impact a session. To be truly effective you need to adapt and switch to other
    styles as needed. Being aware of moderating styles and their comparative strengths
    and weaknesses will help you shape and polish your own approach.


    # TIPS FOR NEW MODERATORS


    When you''re just starting to moderate, you may feel overwhelmed by everything
    that you need to track throughout a session. Moderators need to be Very By the
    Book of these concerns. You may cling tightly to a scripted study plan, worried
    that you''ll miss a question or ask the wrong thing. While these are reasonable
    concerns, devotion to a script may mean that you''ll miss a change in the participant''s
    body language or tone, potentially missing an issue until it''s too late to successfully
    resolve it.


    These are some recommendations we give to new moderators to help balance their
    attention so that the participant doesn''t go unnoticed:


    +   - If you have a scripted study plan, review it carefully before moderating
    your session. If possible, watch a team member from the same script before your
    first session so you can get a real feel for the overall flow. This familiarity
    will make it easier for you to pay more attention to the participant instead of
    being focused on the script.

    - Add a note to the bottom of each page of your study plan to remind yourself
    to look up at the participant.

    - Limit your note taking so you can pay more attention to the participant. Use
    your pen to check off questions/tasks as you go through them so you have a quick
    visual indicator of what you''ve covered already and what''s remaining.


    For additional tips on improving your moderating skills, see Chapter 16.'
