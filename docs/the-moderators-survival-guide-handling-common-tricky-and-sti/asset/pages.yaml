- pgno: 266
  md: '# 14.7 Participant touches you


    At some point during the session, the participant deliberately touches you. The
    touch may be something like a brief touch on your arm or hand. Or, when you''re
    both leaned in look at something, his shoulders touches yours and he doesn''t
    move away. Or maybe he not-so-briefly touches your leg or back.


    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: Redirect the participant; Disengage from the participant;
    Take a break


    # What to do


    +   - If the participant''s touch was more of a grab or threatening movement,
    or he deliberately ignores your request not to be touched, end the session as
    soon as you can. If you were feeling uncomfortable with him and already the touch
    you more uncomfortable, do the same. Trust your gut! If you don''t feel safe with
    the participant, leave the room and find a team member to extend the session for
    you.


    +   - If the participant is very expressive and his arm movements the result in
    an infrequent touching of your arm) or accidental (e.g., mistaking your foot for
    the leg of the table), carry on with the session. You can also reposition yourself
    or the participant so that you''re further away. For example, you can scout your
    chair behind him in a usability or contextual inquiry, or go into another room
    to moderate over a microphone if your setup allows it. If making a physical shift
    would seem like an abrupt change, you can first take a break. Then, when you resume,
    make a different position.


    +   - If the touch is unintended but subtle (like a fictitious participant touching
    your hand or leg), steadily pull away to show that it''s not okay. Turn the reposition
    your body slightly away from the participant, minimize eye contact, and use a
    more formal tone. You could also ask the participant to adjust his position (e.g.,
    by moving to a different chair in the room).


    +   - If you''re uncomfortable continuing with the participant, switch moderators
    if someone else is available or end the session early.


    # What to say


    To reposition yourself or the participant:


    +   - “I’m having a hard time getting a view of what you''re doing while beside
    you, so I''ll just scout behind you and watch what you''re doing.


    +   - “I realized that your chair is one of the most uncomfortable ones we have—I''m
    sorry! Why don''t you switch over that chair instead for the rest of this interview.”'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 14.7 Participant touches you (cont.)


    To take a break:


    +   - I need to check on something before the next part of the session, so let''s
    take a brief break.


    # What not to do or say


    +   - Try not to disengage immediately after the touch happens. If it’s an awkward
    touch, slowly and steadily pull away. But you don’t need to jump to sitting elsewhere
    in the room or taking a break. This can make things more awkward. However, this
    is a rare case where’s helpful to Just continue with the task, question, or thought
    you’re on, and then find the next natural breaking point to either move positions,
    take a break, or switch motions.


    # How to avoid


    +   - Although it’s always important to disclose the participant that there are
    observers, we usually draw much attention to it. However, this is a rare case
    where’s helpful to emphasize that there are observers and video cameras—it will
    usually keep participants within bounds.


    +   - At the beginning of the session, position yourself a comfortable distance
    away from the participant where it will be hard for him to touch you without going
    out of his. In studies involving computers, it’s helpful to have the computer
    setup so that you have a second keyboard and mouse wirelessly connected. It allows
    both you and the participant to have your own controls, so you can change anything
    on the screen without having to reach over the participant or ask him to move
    or get up.


    +   - Never run research alone, especially at night and in others’ homes. Always
    have at least one person observing, and if you’re going onsite, bring a buddy!


    # See also


    +   - 13.4 Participant flirts with you'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 14.8 Participant''s environment contains dangerous items


    While entering the participant''s home or work space—either in person or through
    a virtual view established by a webcam—you notice the presence of materials that
    are dangerous (e.g., guns or weapons) or potentially offensive (e.g., porn or
    racist propaganda).


    Method(s): Contextual inquiry; Interview

    Frequency: Rare

    Pattern(s) to apply: Take responsibility


    # What to do


    +   - If you feel uncomfortable or that you''re in the slightest bit of danger,
    trust your gut and end the session as quickly as possible. We strongly recommend
    that you trust your instincts when it comes to potential warning signs—again,
    your safety is more important than gaining an additional data point.


    +   - If you do the session, for your safety, to end the session in a subtle way
    that doesn''t make obvious that it''s due to the participant''s environment. For
    example, wait a couple of minutes and use a pretext like you forgot some study
    materials, or check your phone and pretend there''s an emergency that you need
    to leave for.


    +   - If you feel safe continuing the session (again we suggest that you to err
    on the side of caution here, but leave at your discretion—for example, if the
    participant is a collector of medieval weapons that are in a locked case and you''re
    not picking up any odd vibes from him), ask him if he can move any dangerous materials
    to another area of the house or if you can talk in a different location. If he''s
    unable to make an accommodation that you feel comfortable with, end the session.
    Be respectful when drawing attention to any of these items, regardless of your
    personal feelings towards the questionable items.


    +   - If the materials are offensive, but not dangerous, try not to mention them.
    This may be difficult, keep in mind that you''re out in the field to see the reality
    of your user''s environment, and that reality isn''t always what you expect.


    +   - If you video recording the session or taking pictures, remind the participant
    before you start. The participant may realize that he has materials visible that
    he wouldn''t want a wider audience to see and move those materials on his own.


    # What not to do or say


    +   - Avoid engaging in the participant in a discussion about the dangerous/offensive
    materials unless the participant brings it up on his own and the material is somehow
    connected to your research'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 14.8 Participant''s environment contains dangerous items (cont.)


    goals. For example, if you''re talking with the participant about how he spends
    his free time and brings him up his antique gun collection, you can ask him follow-up
    questions just as you would for any other answer.


    # What to say


    +   “Thank you so much for letting me talk with you today. Before we get started,
    can I ask you to move that <dangerous item> into another room while we''re talking
    in here? I really appreciate it.”

    “Before I take this picture, I want to remind you that this will get shared with
    other members of the project team. Is it okay for me to continue?”


    # How to avoid


    +   There''s not much you can do to avoid this—ideally, a participant who knows
    he is having visitors will make the environment safe. However, this isn''t always
    the case. Keep in mind that the beauty of field research is that it lets you see
    the reality of a user''s environment, and that environment may not be what you
    expected.


    # See also


    +   12.2 Something personal, inappropriate, or confidential is visible

    14.9 Participant is doing something illegal or threatening

    Survival Story: “We didn''t know much about them”'
