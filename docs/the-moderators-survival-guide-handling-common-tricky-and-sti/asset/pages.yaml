- pgno: 39
  md: '# 2.4 Check the participant''s comfort level


    Once you’ve verified that the situation you’re seeing hasn’t been caused or exacerbated
    by your own behavior, check to see if the participant’s degree of comfort has
    declined to an unacceptable level.


    Most user research starts out being somewhat uncomfortable for the participant.
    He may arrive without knowing exactly what he''ll be asked to do, or may worry
    that he is being tested in some way. If you are coming into his space, he''ll
    be unable to get away from the typical hassles of his environment, which may become
    magnified by the uncertainty of what he''ll be asked to do during the session.


    Unless you’re doing very specific research that deliberately puts users in uncomfortable
    situations, you want to minimize, if not altogether eliminate, anything that compromises
    the comfort or safety of the participant. Part of your job as a moderator is helping
    the participant feel comfortable participating and providing his feedback, and
    ensuring that he remains comfortable—physically and psychologically—during the
    session.


    # PROTECTING PARTICIPANT RIGHTS


    Most professional organizations whose members interact with nonmembers in a professional
    capacity, including the User Experience Professionals Association (UXPA), have
    a code of conduct or ethical guidelines to govern their members'' behavior. These
    guidelines are in place to ensure the ethical behavior of the professional (i.e.,
    you, the moderator), and protect the rights of the nonmember (participant).


    As a researcher, you need to keep your ethical obligations to the participant
    front and throughout the session. Remember, when the participant comes to your
    session, he may have little to no information about what he''ll be doing and why
    he''ll be doing it. It’s your job to provide him with this information before
    he begins, and obtain his consent to participate.


    This informed consent lets the participant know what he’ll be doing as part of
    the study, what he’ll receive for participating (compensation), and his rights
    (e.g., to take a break or leave at any time). Even though you should have him
    sign a consent form before the session begins, review the key points verbally
    as part of your briefing at the beginning of a session.


    We recommend reviewing the UXPA’s code of conduct at http://www.usabilityprofessionals.org/about_upa/leadership/code_of_conduct.html,
    which outlines how to'
