- pgno: 107
  md: '# 6.2 Participant does something you don''t understand


    The participant starts sharing feedback of a highly specialized nature in a domain
    that you don''t fully understand. Perhaps you''re a consultant who is new to the
    content or the participant is an expert in a field that you don''t know much about.
    Either, you aren''t able to follow everything that he is saying or can''t determine
    what pieces of his feedback are important or relevant. Similarly, in a contextual
    inquiry, you may observe the participant doing something you''re unable to understand
    or follow.


    | Method(s): | Any |

    | Frequency: | Frequent |

    | Pattern(s) to apply: | Clarify the task/question |


    # What to do


    If the participant is saying something you don''t understand: or if the session
    is being recorded, you can


    +   - If you have observers who are subject-matter experts or if you capture the
    feedback and continue with your study plan. After the session, verify with observers
    what the participant was talking about. This will move the session along smoothly,
    but you may lose opportunities for immediate follow-up.


    +   - If you know enough about the domain that the participant is within reach
    of your understanding, ask him to clarify what he means. Be honest--tell him that
    you''re not a subject-matter expert and would appreciate hearing his thoughts
    in more common terms.

    - In some cases it helps to have an in-room observer (or on-phone observer for
    remote sessions) where a domain expert is also trained in talking to users and
    knows the ground rules of


    If the participant is doing something you don''t understand:


    +   - If there is time for interruption for the participant''s workflow, ask him
    to explain what he''s doing in layman''s terms and why he''s doing it.

    - If it would be too disruptive to his workflow to ask for clarification, make
    sure to capture the exact process/steps with your notes and/or recording equipment.
    If possible, have domain'
