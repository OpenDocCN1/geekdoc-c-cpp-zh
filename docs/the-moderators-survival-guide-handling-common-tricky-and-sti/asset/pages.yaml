  md: '# 5.8 Participant brings a child or pet to the session


    The participant arrives with a child (or children!) or animal in tow. The animal
    isn''t a service-animal, but is just a pet. The participant may expect you or
    your team to provide childcare, or may indicate that the child or pet can “quietly”
    stay in the room with you.


    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: Take responsibility; End the session early


    # What to do


    +   - Confirm the participant is aware of how long the session will last and what
    you''ll be asking her to do. You can also show her the space that you''ll be in,
    as that may change her mind about continuing (in which case, you can offer to
    reschedule her or just offer the compensation for coming in).


    +   - If the participant has brought a child, ideally she came prepared with items
    to keep her child occupied during the session. If not, take a deep breath and
    get creative! Depending on the child''s age, you can volunteer to bring in some
    paper and markers for her to use, or some other set of (safe!) materials for the
    pet to play with, such as a deck of cards or a tablet.


    +   - While we haven''t seen participants bring other than dogs to usability sessions
    (unless they''re service animals), we''re sure it can handle. In that case, address
    any potential concerns with the pet being there. For example, you may need to
    limit participants'' exposure to allergens, and make sure the pet''s behavior
    and “calls to nature” can be controlled without interfering with your session.


    +   - If the child or pet is excessively loud/consistently disrupts after an initial
    period of time, try to be patient and understanding if the participant seems eager
    to continue. But if there are constant disruptions, you might want to end the
    session early. Do so delicately, without blaming the child or pet. If you need
    to use a pretext, you can blame technical difficulties or explain that you made
    through all your questions faster than anticipated. Offer again reschedule for
    a time when the participant can come on her own. If she is unable to reschedule,
    we recommend still giving her the full compensation.


    # What to say


    When the participant arrives:


    +   - “This is meant to be a focused one-on-one session. Will your <child/pet>
    be okay in the room with us? Our setup may not be comfortable for <child/pet>,
    so we''re happy to reschedule you for a time when you can come by yourself.”'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# 5.8 Participant brings a child or pet to the session (cont.)


    If concerned about a pet, blame allergies:


    +   - “I’m sorry, we try to keep this room allergen-free since we have so many
    people coming through here. Are you able to reschedule for a time when you can
    come by yourself?”


    If child/pet is being excessively disruptive and you need to end early:


    +   - “It looks like we made it through everything faster than I expected, so
    you’ll have a bit of extra time in your day. Thank you for your feedback, and
    here is your compensation.”


    # What not to do or say


    +   - Do not allow team members to babysit or pet during the session, even from
    within the research room. Doing so would potentially leave your organization vulnerable
    if something happened to the child or pet while they were out of the participant’s
    view. Also, you don’t want to risk the possibility of your colleague being bitten
    (by a child or pet!). If the participant asks for this service, let her know you’re
    not equipped to do so and offer to reschedule at a more convenient time when she
    can come in her own.


    # How to avoid


    Explain the setup of the session to the participant before she arrives (e.g.,
    during the recruit and in the confirmation letter) and make sure the one-on-one
    aspect is clear.


    # See also


    +   - 5.6 Participant brings someone else to participate with her

    - 12.8 Participant has an unexpected disability or service animal

    - Survival Story: “I know what she needs” in Chapter 2'
  merge: -1
