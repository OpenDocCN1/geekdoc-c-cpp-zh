- pgno: 61
  md: '# What to do


    In the case of technical or environmental issues, you have a built-in reason for
    ending the session. For example, if you have to evacuate your facility because
    of a fire, the intensity of the situation and unstable environmental conditions
    means you should let the participant leave.


    Ending a session early for any other reason requires careful communication skills,
    as you don''t want the participant to think that you''re ending because she did
    something wrong. If you did not provide them with a list of tasks or questions
    ahead of time, you can just skip unfinished items and go straight to ending the
    session without any additional explanation. If she can tell you''re skipping something,
    you can use a preset such as, “The rest of these tasks/questions aren''t applicable
    to your role, so we''re going to skip them.” Other patterns that may come in handy
    to explain a shortened session include:


    +   * “You went through everything faster than expected"

    * “We’re having some technical difficulties, so rather than having you wait around,
    we’re going to end early so you have time back in your day.


    The point at which you decide that a session is not worth saving—your breaking
    point—will different for each day and study with the factors that are key to the
    study''s success. Think about it ahead of time and discuss with your stakeholders:
    What are the deal-breakers that would make you end a session rather than continuing
    it?


    # See pattern in use


    You can see this pattern used in such situations as:


    +   * 4.1 Participant does not seem to meet a key recruit criteria

    * 14.6 Participant seems to be drunk or stoned


    # 13.0 Choosing the best pattern for your situation


