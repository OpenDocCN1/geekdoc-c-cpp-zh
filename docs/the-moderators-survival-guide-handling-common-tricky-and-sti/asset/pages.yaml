  img_proc: true
- pgno: 120
  md: '# 6.8 Participant believes he has successfully completed a task


    > The participant is confident that he has successfully completed a task, and
    that it was easy. However, you know that he was not successful.


    Method(s): Usability study

    Frequency: Occasional

    Pattern(s) to apply: Clarify the task/question; Redirect the participant; Reassure
    the participant


    # What to do


    This situation is closely related to the situation described in section 6.4 except
    that, in this case, the participant doesn''t realize that he was unsuccessful.
    What to do in this situation depends on:


    +   The participant actually needs to know that he did not complete the task?
    As a moderator, you shouldn''t tell him when the task was “successful” or Instead,
    let the participant decide for himself when he is done. If he happens to doing
    something wrong, you usually don''t need to point anything out and can simply
    move on. Remember that if he gives subjective feedback or ratings, his performance
    may not be correlated with his rated experiences. Because he doesn''t know that
    he wasn''t successful, the participant may think everything is great and rate
    his experience very highly.


    +   If the participant needs to know that he wasn''t successful (e.g., if tasks
    are interdependent in a way that requires a task to be completed before attempting
    the next one, or the participant never to go to a area of focus for your research),
    follow the recommendations in section 6.4 to provide an assist.


    # What to say


    If the participant doesn''t need to know or see the correct path:


    +   “Okay, why don''t we move onto the next task?


    # What not to do or say


    +   Don''t make the participant feel like he did anything wrong or is being tested.
    Avoid saying things like “This task isn''t yet complete” or “Let me show you the
    correct way.”'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 6.8 Participant believes he has successfully completed a task (cont.)


    # How to avoid


    +   - Participants will do this from time to time, so there is no way to avoid
    it! Remember that this type of feedback is just as valuable as seeing participants
    struggle to complete a task.


    # See also


