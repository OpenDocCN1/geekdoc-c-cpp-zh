    let the twelfth participant explore other areas of the product outside what''s
    in the study plan than when you''re running the second participant.


    Because of all these factors, it''s impossible to spell out exactly what pattern
    is best to use in every situation. Instead, use these questions to identify what''s
    best for your situation.


