- pgno: 70
  md: '# 4.2 Participant either refuses to or can''t do a key task


    As part the recruiting process, participants were told that they would be asked
    to do a specific task during the session. For example, you need the participant
    to log in to his bank account and perform nontransaction tasks, so the recruiter
    told him that he must be able to log in to his account for the session. When you
    ask the participant to do this, he can''t (e.g., because he has forgotten his
    login information) or won''t (e.g., because he changed his mind).


    +   - Method(s): Usability study; Contextual inquiry

    - Frequency: Occasional

    - Pattern(s) to apply: Take responsibility; End the session early


    # What to do


    +   - If you were explicit about participants needing to do something specific
    during the session as a condition of the recruit, and the participant is unable
    or unwilling to do this, end the session. The exceptions are if there is a way
    for you to reschedule the participant, shift the focus of the session, or you
    have some other backup plan in place. You''ll need to provide the participant
    with his compensation unless you were crystal clear throughout the process that
    the compensation was contingent on performing this task. However, in this circumstance,
    err on the side of the participant, if you have any sense that he misunderstood
    what he signed up for.


    +   - If the participant is willing to do the key task but is unable to (e.g.,
    because he forgot his password), or if there is a way for you to help him get
    whatever information he needs to proceed. For example, if he forgot his password,
    ask him to go through the Forgot Password or Password Reset. This process involves
    using the phone or answering sensitive questions on the screen to reset account
    information, leave the room to avoid overwhelming personal identifying information
    andor be sure that nothing is being screen-shared or recorded during that time.
    If the participant seems reluctant to make this attempt, do not force him, and
    intend the session.


    +   - Offer to reschedule if the participant is genuinely disappointed about not
    being able to participate. Be sure to confirm and reconfirm your expectations
    for what he''ll need to do during the rescheduled time!


    # What to say


    +   - “I''m sorry, but we need participants to do <task>. Unfortunately, this
    means we''re not going to be able to have you participate today. If you''re able
    and willing to get the information and come back, we''d be happy to reschedule
    you.”'
  merge: -1
