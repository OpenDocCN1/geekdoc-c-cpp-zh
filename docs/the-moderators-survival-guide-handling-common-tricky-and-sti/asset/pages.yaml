- pgno: 173
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # Survival Story


    # SURVIVAL STORY: "TOO DUMB’ TO YIELD MEANINGFUL RESULTS"

    CHARLOTTE SCHWENDEMAN


    At the conclusion of a session during the first usability study I ever facilitated,
    a developer who watched the session from an observation room approached me in
    a slightly confrontational manner. He put his hands on his hips, stomped his foot,
    and asked, “Where did you get these stupid users?” I didn’t expect to hear participants
    called “stupid” again during my career, but also, I did.


    My team was in the process of creating and iteratively usability testing prototypes
    for a web-based solution for a new concept. The company itself was new and its
    existence depended on the success of the study. I was working for a small consulting
    firm at the time and my client consisted of the group of senior marketing executives
    who originated the idea for the concept.


    I sold the concept on the value of observing the sessions and we all flew to the
    city where my team would facilitate the first round of usability studies. Since
    our client had never seen a usability study before, I sat with them in the observation
    room, explaining what was happening and why, while another member of my team facilitated
    the first session. After 20 minutes into the session the client began making noises
    that the participant was not “normal.” After a few minutes the client became angry
    and vocal, stating that the participant was “too dumb” to yielding, valid results.
    The client wanted me to end the session prematurely and move on to the next participant
    because they didn’t think they were “getting enough” from it. I attempted to calm
    the client and explain in many ways as I could that the participant was a good
    match and what they were seeing was typical. The client remained persistent and,
    in the end, got its way.


    As I write about it now, long after the fact, it doesn’t seem any more unusual
    than other odds that occur during usability studies; however, at the time, the
    client was so angry about it that it created a very volatile situation. It changed
    the relationship between the client and my team going forward. They feared their
    concept would fail and my feared marketing team would insist on cherry-picking
    participants for the remainder of the project, thereby rendering our usability
    studies useless. If I had been a “do-over,” I think I would have paid more time
    and attention explaining to the client that participants who fit the profile can
    run a fairly wide gamut. The biggest lesson I learned was the time to before a
    test to explain in detail to stakeholders what they will see and why, and the
    type of results they can expect.


    172'
  merge: -1
  img_proc: true
