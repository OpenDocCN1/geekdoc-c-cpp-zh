- pgno: 23
  md: '# "YES, AND ..."


    The "Yes, and ..." principle is central to improvisation. Let’s imagine that you
    start a scene with “Happy birthday. I made you a *cake,* and my response is, “That
    is not a cake. That is a dinosaur and my birthday was last month." This response
    makes it harder to respond with something that builds the scene along smoothly.
    I’ve probably set you up for an awkward situation.


    You say, “Happy birthday. I made you a *cake.* Now my response is, “Thank you
    so much! Mmm, the cake frosting is my favorite part.” Once again, the goal is
    to build upon the scene, however, instead of controlling it. Rather than saying,
    “No, it’s not bacon frosting! It’s buttercream,” you might say, “Yeah. It goes
    well with the wasabi filling. This is saying—”Yes, and ...!” You took weird and
    made it weirder—which makes an exciting and (potentially) hilarious scene.


    We’re not saying if the participant starts a bizarre conversation, how would follow
    it if it goes (the topic relates to your goals). But if unexpected happens, roll
    with it. If a prototype breathes, troubleshoot-on-the-fly or find a way to get
    the participant’s feedback out. If an observer barges in, address and resume the
    session. If the participant talks about cake frosting, keep a poker face and bring
    the scene back on track (again, unless bacon frosting is in scope!). Flexibility
    and creativity to smoothly move the “scene” along.


    # 1.4 The science and art spectrum


    You’re conducting a usability study. The participant is attempting a task that
    asks her to book a flight on a travel website. She gets to a page where she is
    considering the fares and pays, “I don’t usually just book a flight. I typically
    explore the flight-plus-hotel combination deals and purchase one of them,”


    Do you ask the participant to continue the original task of picking a flight?
    If you did, you’d be able to compare all participants’ data fairly. Or do you
    go off-script and follow the participant into whatever they would typically explore?
    You’d get some valuable information about other areas of the website that you
    might not get from other participants.


    You’ve just stumbled into one user’s great debates: Is moderating a science or
    an art? This debate usually arises in the context of usability studies when the
    participant is asked to attempt tasks with a product. Those who contend that moderating
    is a science believe that every moderator-participant interaction is an opportunity
    for bias and skewed data. Such'
