- pgno: 211
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # Survival Story


    # SURVIVAL STORY: "I WOULD HAVE TRUSTED MY GUT"

    CHRISTINA YORK


    The first time I had an unqualified participant slip through my screener, I was
    pretty green. I was conducting in-person usability studies in our lab. The participants
    would meet us at our office and do the usability assessment in a little lab we
    had up in an empty office. I was both moderator and notetaker, with only an audio
    recorder as backup.


    The participant criteria were pretty specific. Participants did not have to be
    familiar with our product, but they did have to at least one semester of college
    under their belt and be currently enrolled in a degree program.


    The moment Bobby entered the room, I had a gut feeling he had fooled our screener.
    He walked in way too much confidence but wouldn''t look me in the eye. He had
    no parhernalia that seemed, "I''m a student!"—no bag, no computer, no notebook,
    no college colors, no case of acne. I didn''t know enough to trust my gut instinct
    and find out if he really was a student, so I pushed on with the session. When
    I asked him what browser he usually used, he deflected: "Oh, any old browser [sic]
    you got." That is when I knew I was in trouble.


    Bobby had difficulty with the tasks. He would ignore what I was asking him to
    do dive into the session, gesturing with his hands at the screen, critically moving
    the mouse (sometimes in midair), and all while explaining why our website wasn''t
    working. He took on the attitude of teacher, and started explaining me how he
    search works, or "how to use computer to read books on." He confidently talked
    over any errors he was making or any confusion he had. He even explained to me
    how the mouse needed to be redesigned for "real people." I tried desperately to
    gain some insight into his behavior and prompted him with questions, "Tell me
    what it is about the make that makes this task difficult." I didn''t know what
    to do. I took notes, I asked questions, I thanked him, and I paid him.


    Knowing what I know now, I would have trusted my gut and ended the session before
    it began. I''ve learned that you can''t rely on any screener, and that confirming
    participant qualifications is necessary. I''ve also learned to have a retrospective
    on every study and examine my discomfort from situations like that I can plan
    how to handle future discomfort. Also, from that session, I arranged for a "backup"—a
    person working nearby who would come into the lab to assist upon receiving my
    signal. That way, I would never feel like I was "on my own" conducting one-on-one
    research.


    212


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_211_0.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# CHAPTER

    12


    # A Delicate Touch:

    Addressing Sensitive Situations


    Sensitive situations involve matters that are personal, embarrassing, or emotional.
    These complexities mean that you need to be especially delicate with your approach
    to avoid making matters worse. These situations challenge both your empathy and
    your ability to tactfully and gracefully respond. Consider these a true test of
    your interpersonal skills.


    +   12.1 | Participant is extremely entertaining and friendly | 215

    12.2 | Something personal, inappropriate, or confidential is visible | 217

    12.3 | Participant is obviously distracted by external circumstances | 220

    12.4 | Participant tells you something personal | 222

    12.5 | Participant has a disconcerting or distracting physical attribute | 225

    12.6 | You have to point out something potentially embarrassing | 227

    12.7 | Participant seems upset | 228

    12.8 | Participant has an unexpected disability or service animal | 231'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 12.1 Participant is extremely entertaining and friendly


    > The participant seems to be enjoying both the session and your companionship.
    He may be trying to make you laugh or making casual side conversation. These efforts
    keep distracting from what you''re asking him to accomplish. You may find yourself
    distracted as well by how much fun you''re having, or catch yourself starting
    to respond to his friendly conversation.


    Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Redirect the participant; Disengage from the participant;
    Take a break


    # What to do


    +   Remember that you''re in a research situation, not a coffee shop! While want
    to be a kind host and make the participant feel at ease, it is a slippery slope
    from friendly banter to some other situations in this book—like a participant
    flirting with you, or starting to ask for your opinion. Plus, that constant friendly
    conversation can distract the participant from approaching his workflow in a natural
    way, which leads to potential biases in your results.


    +   Adapt your moderating style to help establish a more formal tone for the session.
    If you''re being too friendly with your words, tone, and body language, try to
    disengage from the participant and move toward a Down to Business style (as discussed
    in section 1.5). Make slightly less contact, avoid laughing or smiling too much,
    and consciously to listen instead of responding conversationally.


    +   As part of disengaging from the participant, consider changing how you moderate.
    If you''re running a usability study or contextual inquiry, and are sitting beside
    the participant, moving slightly behind him so it''s harder to turn around and
    look at you. Or if you''re in a lab with a separate control room that has a microphone,
    consider moderating from that room instead.


    +   Try to stick closely to your study plan, and use gentle redirection to more
    questions or tasks when the participant attempts to be friendly.


    # What to say


    +   “That sounds like an interesting story! I don''t want to get us off task,
    though, so why don''t we move on to....”


    +   “I''d like to hear more about that. Let''s go back to the point you made earlier
    here....”


    +   “I''m just going to sit behind chair so that you can watch what you''re doing.”'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 12.1 Participant is extremely entertaining and friendly (cont.)


    +   - For the next tasks, I’m going to run next door and facilitate from there
    I don’t distract you. I’ll have a microphone so I can talk to you, and I will
    be able to hear you and see what you’re doing.


    # What not to do or say


    +   - Don’t change your demeanor too abruptly, as this may make the participant
    uncomfortable. Try subtle changes instead. For example, don’t change your tone
    and move your chair behind the participant at the same time—do one first, followed
    by the other a few minutes later.


    +   - Don’t be rude about redirecting the participant back to the task/questions.
    If it comes naturally to you, sometimes some gentle humor may help. For example,
    “I’m having a great time here but we’ll never get anything done if we keep talking!
    I’m going to go into serious mode now so that we can stay focused.


    # How to avoid


    +   - If you’re not paying attention, it can feel like this situation sneaks up
    on you. So, if you get any indication that your participant is very friendly upon
    meeting him, start the session with a more serious, formal style to minimize the
    chances of having to adapt later.


    # See also


    +   - 12.4 Participant tells you something personal


    +   - 13.2 You know the participant, or the participant knows you


    +   - 13.4 Participant flirts with you'
