  md: '# 5.4 Participant brings you to a conference room or other space


    You''ve scheduled a contextual inquiry at a participant''s work location with
    the goal of watching her in her own environment. However, when you arrive, the
    participant brings you to a conference room instead, explaining that it will be
    quieter and easier to talk there.


    Method(s): Contextual inquiry

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility


    # What to do


    +   The participant may not understand why you want to see her in her workspace,
    and assumes that she is being helpful by providing a conference room or other
    space instead. Thank for reserving the space, but explain that one of your goals
    is to understand how she works when you''re not there, and seeing her in environment
    and what she does in that environment will provide the information that you need.


    +   The participant may feel like she doesn''t have space for someone to join
    her in her workspace, or that her space is too messy for visitors. Let her know
    that you don''t need a lot of space, and that it doesn''t matter how it looks—you''re
    interested in her day-to-day reality, not the tidied-up version of her work.


    +   If the participant has a crowded or open workspace, offer to chat in private
    with the participant at the end of the session. This private conversation may
    be an opportunity for her to give any feedback that she doesn''t want her coworkers
    or manager to overhear in her work environment.


    # What to say


    +   “I''realize I may not have clear enough <in the confirmation letter/when we
    talked earlier>. It''s really important for us to be in the environment that you''re
    normally working. Could we move instead? It''s okay if it is noisy or cramped.
    We can come back to this conference room at the end of the session to wrap up.


    +   “I''d like to work in your own environment, so that I can witness your day-to-day
    tasks. After that, we can debrief back in a conference room. Does that sound okay
    to you?”


    # What not to do or say


    +   Don''t blame the participant for misunderstanding—take responsibility for
    not being clear enough about what you''re doing or what you need.'
