    | | ➤ Comes as relatively casual and responsive to participants, often using nonverbal
    feedback as smiling and nodding, and can help participants feel comfortable and
    happy to be part of the research activity. | ➤ Participants are participating
    out of obligation. | ➤ Slipping into the role of a buddy, saying biasing things
