    # See pattern in use


    You can see this pattern being used in situations as:


    +   - 12.1 Participant is extremely entertaining and friendly

    - 13.4 Participant flirts with you


    # 3.7 Take a break


    Taking a break lets hit the session’s “pause” button. This pause can reset the
    flow of the session and give you and the participant some time and space.


    # When to use


    Use this pattern when you need to take some time, either for yourself or the participant.
    This pattern is appropriate:


    +   - If the participant is stressed or upset and seems to need some space.

    - If you are feeling stressed or upset by anything happening in the session.

    - If you need to get a second opinion about the participant from your observers
    so you can determine how to proceed with the rest of the session.

    - If you need to let the observers know they’re being loud or disruptive.

    - If something in your technical setup needs to be changed or fixed.


    > Remember that your emotional well-being is just as important as the participant''s!


    # What to do


    Let the participant know you’re taking a short break. If the reason you need to
    take a break when upset or offend the participant, you can provide that as a reason.
    For example, “The batteries on your audio recorder seem to have died. Let’s take
    a break for a few minutes while I replace them.” Alternatively, you can leave
    the reason vague, or stretch the truth if necessary. For example，“I need to check
    into something about the prototype.”


    The idea of using convenient excuses to take a break or end a session early is
    discussed in the Chapter 2 sidebar “Using a Pretext.”'
