- pgno: 218
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 12.3 Participant is obviously distracted by external circumstances


    The participant seems to be dazzled or annoyed by something outside of the session.
    It may be something small scale that''s distracting him (e.g., he has a lot to
    do today or couldn''t find parking at your location) or something on a much larger
    scale (e.g., he just got into a car accident).


    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Responsibility; Clarify the task/question; Reassure the participant;

    Take a break; End the session early


    # What to do


    It''s not easy to know why a participant seems distracted. Sometimes a participant
    will tell you the reason for his frazzled state (e.g., "Ugh, I need to wind down.
    I just got a huge speeding ticket!") while other times you might need to probe
    gently for a little more information so you can respond appropriately.


    +   If a participant is honest about how he''s distracted, make a judgment call
    based on the severity of the issue. Once we emphasize that comfort is your first
    priority.


    +   If something very big happened (e.g., he got an accident, a family member
    is ill, he seems upset about something personal, etc.), offer him the compensation
    and let him leave to take care of the situation.


    +   If he insists on moving forward with the session, take a short break so he
    has a chance to cool off, and then start with the session. However, monitor him
    closely and pant to end, especially if he seems distraught. It''s unethical to
    put a participant through an entire session when he''s obviously in emotional
    distress.


    +   If the cause is on a smaller scale (e.g., he ran full speed to be on time,
    he just came from a stressful meeting, etc.), offer to take a quick break before
    starting the session. If he refuses but obviously benefit from a couple minutes,
    consider taking it into your own hands and tell him that could use more time to
    get set away. Offer him a beverage and a comfortable place to relax, away from
    observers. Let him unwind when the session starts, he is ready to listen and concentrate.


    +   Once the participant starts the session, you might need to speak more slowly
    and deliberately so that he can absorb your information and questions. Reiterate
    or reward questions if it seems like he''s not giving you undivided attention.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 12.3 Participant is obviously distracted by external circumstances (cont.)


    # What to say


    Before the session:


    +   - I’m sorry to hear that. If you aren''t feeling up to the session, I completely
    understand and <we can reschedule/you can leave if you need to>.

    - It seems like you have a lot going on. We''re not in an immediate rush. How
    about I get set up and you take about 5 or 10 minutes to relax? Would you like
    a beverage?

    - I could arguably use more time to set up, so why don’t you take a few minutes
    to relax and settled, I’ll be with you in a bit.


    During the session:


    +   - Just wanted to check in quickly and make sure you’re doing alright and are
    okay proceeding with the session? Remember that you can take a break or leave
    at any time.


    # What not to do or say


    +   - Try not to invade a participant’s privacy. Even if the participant tells
    you something of a personal nature, not follow up with more detailed questions
    about his personal life. Respect his privacy and focus on getting information
    you need to decide whether and how to move forward.


    # How to avoid


    +   - Just like we can''t avoid distracting situations in our own life, we can''t
    expect participants to avoid them in theirs.


    > Watch Video 2 to see an example of a moderator working with a participant who
    is distracted by external circumstances during a usability study. The participant
    is reluctant to leave the session even though he is distracted and has trouble
    focusing.


    Visit our website (http://www.modsurvivalguide.org/videos) or use your QR reader
    to scan this code.


    # See also


    +   - 11.1 Remote participant is obviously distracted

    - 12.4 Participant tells you something personal

    - 12.7 Participant seems upset

    - Survival Story: “She was so appreciative” in Chapter 6'
