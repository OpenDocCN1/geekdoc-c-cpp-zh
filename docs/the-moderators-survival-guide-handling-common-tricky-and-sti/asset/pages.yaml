- pgno: 91
  md: '# 5.5 Participant treats a contextual inquiry like an interview


    You arrive onsite to perform a contextual inquiry but the participant expects
    that she just needs to tell you about what she does with a product and what she
    thinks of it. For example, a call representative anticipates an interview and
    schedules special time off her phone queue to chat with you. Your goal was actually
    to take her calls and ask her questions in between calls. If you''re doing the
    session remotely, the participant may just work about the inquiry instead of showing
    it to you through the screen-sharing software.


    **Method(s):** Contextual inquiry

    **Frequency:** Occasional

    **Pattern(s) to apply:** Take responsibility; Clarify the task/question; Shift
    the focus


    # What to do


    This situation may happen because the participant was given vague details when
    recruited for the study, or made the wrong assumption when asked to participate.
    Most people are familiar with the idea of being interviewed, but a contextual
    inquiry is not a very common method outside of the user research community.


    +   - Clarify your expectations as soon as you realize what is happening, and
    apologize for not being clear enough ahead of time what you were planning. Hopefully
    the participant will be able to adapt and you can continue the session as planned.
    If you can''t continue, see if you can reschedule or shift the focus to some other
    way to get feedback.

    - If she seems embarrassed or feels bad about the mix-up, take responsibility
    for the miscommunication (even if someone''s fault).

    - Prepare a list of questions for when you can''t watch the participant work.
    This may come up without a misunderstanding. For example, the participant''s system
    may be down, or she may have completed a project early and have nothing to show
    you.


    # What to say


    +   - "I was actually looking to do today is to watch you in the way that you
    would typically if I weren''t here. I have some questions for you along the way,
    or things I ask to show me, but in general, you should be working and my role
    is mostly to be a wallflower and watch quietly"

    - "Are you able to get set so that I can quickly just watch while you work?"

    - "I''m sorry for the mix-up—I must not clearly communicated my intent for this
    session. If it isn''t too much trouble, could you go ahead and show me what you''re
    describing?"'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 5.5 Participant treats a contextual inquiry like an interview (cont.)


    # What not to do or say


    +   - Don''t end the session, if you can help it. Try to find a way to have the
    participant get set up to work. If that is not possible, shift the focus of the
    research if turning into an interview would provide some useful information. As
    a last resort, find a time to reschedule if possible and end the session. Site
    visits usually take a lot of effort and time to plan, you should do your best
    to get some feedback out of the session.


    # How to avoid


    +   - During the recruit, specify the exact setup of the session and what it involves.
    For example, include in your recruiting script and confirmation letter that you
    need to watch the participant at her work computer using a specific application.


    Video 6 to see an example of a participant who is expecting an interview instead
    of a contextual inquiry. The moderator clarifies her expectations, but has to
    repeat them a couple of times as the session progresses.


