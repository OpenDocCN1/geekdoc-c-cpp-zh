- pgno: 59
  md: 'If you’re taking the break to give the participant space, offer to show her
    where the restroom is or get her something to drink. If you’re leaving her in
    the room and the recording equipment is still running, remind her of it so she
    doesn''t think she has privacy and start making personal phone calls. Similarly,
    if the participant is remote and her screen is being shared, have her turn off
    the screen sharing first or remind her that her screen is still visible.


    If possible, have a backup survey or questionnaire related to the study that you
    give to the participant if you need to take a break and provide her with something
    useful to do. Section 15.2 describes this idea in more detail. Having this kind
    of backup also has the advantage of making the participant feel productive and
    useful—an advantage over leaving her staring nervously at herself in a one-way
    mirror!


    # See pattern in use


    You can see this pattern being used in situations such as:


    +   * 7.1 Technical issues arise with your setup and/or equipment

    * 14.4 You begin to feel unwell while moderating a session


    # 3.8 Shift the focus


    Shifting the focus lets you adjust your study plan and research method to something
    that is a better fit for the participant''s qualifications or emotional state.


    # When to use


    Use this pattern if you realize that your study plan is not going to work with
    the participant you have. This may happen if:


    +   * The participant is reacting poorly to the current form of research (e.g.,
    because she says she would never perform the tasks you’re asking her to do and
    can''t be persuaded to try anyway).

    * The participant doesn’t match your recruiting criteria, but is either high profile
    (e.g., a customer VIP) or if, based on your study goals or timing, it’s better
    to get some data than getting nothing.


    Keep in mind that this pattern may not be appropriate if:


    +   * Your research goals are very narrowly defined and there is no value in adjusting
    the session (in which case, you should end the session early).

    * The participant doesn’t match your recruiting criteria and you have a backup/floater
    participant available who you could run instead (in which case, you should end
    the session early with your current participant).'
