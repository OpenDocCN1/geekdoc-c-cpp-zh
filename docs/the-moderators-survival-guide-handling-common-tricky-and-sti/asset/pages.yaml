- pgno: 199
  md: '# 11.3 Participant insists that she would never do something (cont.)


    # What to say


    +   - Are you involved at all in <task/process>? If so, can you talk me through
    what you do, and what tools do you use? Feel free to pull up any tools you use
    as part of the process.

    - I understand that you don''t typically do this. However, for the sake of today''s
    study, I''d like you to play the role of someone who does <task/process> so we
    can understand what the experience would be like for a new user.

    - Okay, in that case, let''s move on to our next task...


    # What not to do or say


    +   - Don''t move on another task right away. Take advantage of the moment to
    understand more about the participant''s role, and how the task/process gets performed
    (and by whom).

    - Don''t push too hard if the participant is unwilling to play the role of a new
    user. Some participants have a harder time than others playing a role, and there
    may be political situations affecting their willingness to attempt this.


    # How to avoid


    +   - During your recruit, ensure that your criteria are detailed enough about
    the responsibilities and roles participants must have, especially for your key
    tasks (see section 15.1 for more on this). Also, reinforce these criteria in your
    communications with scheduled participants so they know what kind of responsibilities
    you''re expecting them to have. It''s better to discover a mismatch between user
    types and tasks before you begin a research study!


    # See also


    +   - 4.1 Participant does not seem to meet a key recruit criteria

    - 4.2 Participant refuses to or can''t do a key task'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 11.4 Participant is frustrated by the prototype''s limited functionality


    The participant is using a prototype that isn''t completely built out. As she
    tries to complete tasks, you have to let her know over and over again that the
    functionality she''s trying to use isn''t working. She''s getting annoyed by this
    and may even make snaky comments like, "Oh, I bet this isn''t working," or "You
    ask me to give you feedback but the thing isn''t even working. How am I supposed
    to comment on it?"


    +   Method(s): Usability study

    Frequency: Occasional

    Pattern(s) to apply: Redirect the participant; Reassure the participant


    # What to do


    +   Refer back to what you told the participant in your briefing about her interacting
    with a prototype that has limited functionality instead of a finished product.
    Acknowledge that these limitations may be frustrating, even if there are sections
    she''s really interested in seeing or being able to provide feedback. Gather her
    expectations for those missing areas; even if it''s outside the scope of your
    research, it will help the participant feel appreciated and may reduce her frustration.

    If the participant seemed concerned that missing or broken functionality indicates
    quality concerns with the product, reassure her that the prototype is not the
    same as the finished product. The prototype is just showing a limited set of features
    so you can get feedback on those specific areas.

    Let the participant know it''s helpful to see where she is trying to go, even
    though the functionality isn''t available. Emphasize that knowing her expectations
    for how area of the prototype works is useful and ask her to go into detail about
    how she would want those specific areas to behave.

    Be patient with the participant, even if she has complained about the lack of
    functionality multiple times. Use an appreciative, sincere tone.


    # What to say


    +   “I''m sorry that we couldn''t get everything built out in this prototype for
    today. But your expectations for how it should work are important too. Knowing
    where you expect things to be and what you''d expect to see those areas were working
    is very useful for us.”

    “As you can see, not too much is working in the prototype today. But thank you
    for being patient and just keep showing me where you''d go for these tasks and
    describing your expectations.”'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 11.4 Participant is frustrated by the prototype’s limited functionality (cont.)


    # What not to do or say


    +   - As much as you may want to snap back at the participant, don’t! At the end
    of the day, the participant is “always right” and you need to try to diffuse any
    negative feelings she’s having toward the study setup.


    # How to avoid


    +   - Make your prototype as functional as possible given your available time
    and resources. For more discussion about how to build successful prototypes, see
    section 15.3.

    - Set clear expectations with the participant at the beginning of the session
    about what she’ll be using. A participant who is expecting a fully functional
    product may be horrified by a medium fidelity prototype with what she perceives
    as “broken” functionality. Reinforce those expectations when a participant tries
    to do something that isn’t supported by the prototype by quickly acknowledging
    the area isn’t built out right now, you’d like to hear what she expects to see/happen.
    By being proactive and redirecting her energy, you can limit the time that participant
    spends wondering if the prototype is broken.


    # See also


    +   - 11.8 Participant becomes agitated by a product’s usability issues'
  merge: -1
  img_proc: true
