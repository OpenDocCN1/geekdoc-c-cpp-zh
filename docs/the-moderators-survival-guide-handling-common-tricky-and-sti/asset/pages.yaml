  md: '# 10.1 Participant starts going on a tangent


    While answering a question, the participant goes off on a tangent that is not
    directly connected to or relevant to the research you''re doing. Similarly, if
    you''re running a usability study or contextual inquiry, he may start exploring
    an area in the product that''s outside the scope of your study plan.


    Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Clarify the task/question; Redirect the participant


    # What to do


    The participant''s tangent may be irrelevant to your research for a variety of
    reasons. Perhaps the functionality or processes he uses or is discussing are out
    of scope, you already have enough data about the subject matter, or it has nothing
    to do with what you''re researching. However, the participant doesn''t know this,
    and the information he''s providing may important to him.


    +   - Ask the participant to tell you in his own words what he''s trying to do.
    His answer will help you figure out if he misunderstood you or is pursuing the
    tangent for other reasons. If he did misunderstand you, repeat or reward work,
    or ask him to re-read the task.


    +   - If you have time in the session, consider letting the participant pursue
    his tangent. It helps feel heard, especially if it''s on a topic he''s been asked
    to talk about. You may be surprised by the relevant feedback that can surface
    from letting him do.


    +   - Set a time for how long you''ll let the participant stay on a tangent before
    steering back. The time limit depends on the length of the session, what you need
    to cover, and whether it seems like the tangent may connect to something that''s
    relevant to your research. For example, let''s say you''re running a one-hour
    interview about how users think about retirement. If, just a few questions in
    the session, the participant goes on a tangent about mobile applications if he''s
    had negative experiences, you may want to politely rein him in just a couple of
    minutes. However, if he goes on the same tangent 45 minutes in to the session
    when you only have one or two questions left, let him go to five minutes. If you
    see a way to connect the tangent to your study goals—say the goal of your research
    is to understand how users approach their smartphones compared to tablets—you
    may let him go longer, and probe for more specifics about why those actions were
    frustrating.


    +   - If you''re running a usability study:


    +   - Keep in mind that if you are keeping a participant back from his tangents
    to a specific area (the area is the goal of your research), you''re essentially
    telling him that the other ways'
