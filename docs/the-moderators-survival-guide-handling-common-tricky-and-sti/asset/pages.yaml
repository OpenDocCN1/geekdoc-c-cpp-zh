- pgno: 184
  md: '# 10.5 Participant gives vague responses to questions


    The participant responds to your questions with vague answers. You may not be
    sure he doesn''t understand your questions, isn''t articulate, is shy, or just
    wants to collect the promised compensation.


    +   Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Clarify the task/question; Build engagement


    # What to do


    +   Try clarifying or reordering your questions in case the participant didn''t
    understand what you are asking. If necessary, try to back up to broader, easier
    questions and then, once you''ve built up that foundation, lead into the harder
    questions. If he seems frustrated or unfazed, take responsibility for “not being
    clear” about your question.


    +   Ask “Why?” to prompt the participant to dig deeper into his response. For
    example, if you ask a participant about his experience using a remote control
    and he says it is okay, you follow up with, “Tell me more—why do you say it is
    ‘okay’?” You can ask “Why?” multiple times until you feel you''ve reached the
    level of detail needed.


    +   If the participant is being vague because he is unfamiliar with the subject
    matter, move on to the next task/question that doesn''t cover the topic. Familiarity
    with topic is a deal-breaker, section 4.1.


    +   If the participant is shy and reluctant to share feedback, try to adapt your
    moderating style as discussed in section 1.5 to a more informal and approachable
    one such as Friendly Face or Inquisitive Mind.


    +   If the participant doesn''t seem interested in the topic or seems eager to
    get through the session as quickly as possible, see 8.6 for ideas on how to inspire
    his interest.


    # What to say


    To clarify:


    +   “I’m sorry, I don''t think I’m being clear with my question. Let me rephrase....”


    +   “Let me back up a little, and first ask you this....”


    To build engagement:


    +   “Thanks so much for participating. I know this is taking time out of your
    busy day, but your feedback is very helpful.”'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 10.5 Participant gives vague responses to questions (cont.)


    “Have you ever tried to do this before? Tell me about your experience.”


    # What not to do or say


    +   Try not to get frustrated with the participant, as it may lead him to become
    closed down and resentful.


    # How to avoid


    +   Craft your questions to provoke a thoughtful, detailed response. A poorly
    worded question or a question that can be answered with a simple “yes/no” may
    generate a vague and disinterested answer. For example, a participant may give
    a general response to “What do you think about your local bus service?” but will
    be more specific when asked “Describe the last time you used your local bus service.”


