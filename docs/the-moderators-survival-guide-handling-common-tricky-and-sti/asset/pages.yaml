- pgno: 188
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 10.7 You don''t have time to complete everything


    > At some point you realize that you''re running out of time and won''t able to
    get through everything that you''d intended. The participant might have arrived
    later than scheduled or taken more time than anticipated on tasks and questions.
    You may have been zealous in your study plan about how much you''d get through
    your session. Whatever the reason, you need to figure out what to do and what
    you''ll be able to cover.


    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Redirect the participant; Disengage
    from the participant


    # What to do


    +   - Go into prioritization mode. Think across all your questions or tasks and
    consider what can be dropped and skipped. Resolve to go through your tasks or
    questions and let the session end where it ends.

    - If your priority is for breadth rather than depth (i.e., getting a small amount
    of feedback on each of the remaining tasks/questions instead of attempting few
    complete tasks), consider turning the rest of the session into a “gut-reaction”
    game where the participant shows or tells you his first inclination to respond
    to a task or question. For example, instead of having the participant complete
    a task of finding a savings account that meets his needs on a banking website,
    bring him to the homepage and ask where he would click first if he was going to
    attend that task. This approach will quickly give you “first-click” information,
    depending on your research goals, may be useful.

    - When you''ve gathered the information you need from a question/task, gently
    push the participant along your next item. If you plan to do this repeatedly,
    warn participants that due to time constraints, you may keep moving them along.

    - Consider narrowing the focus of any remaining tasks/questions. For example,
    you may tell the participant to only focus on a part of the design or process
    rather than the full experience.\ If a participant starts to feel bad at the end
    of the session because he didn''t get through all of his tasks/questions, assure
    him that you hadn''t planned to get through everything, and take the blame for
    trying to fit too much into one session.


    # What to say


    Gently bring the participant to the next task/question:


    +   - “This is all very helpful to see and hear. For the sake of time, I''m going
    to ask you to <go the next task/go back to...>


    GET ON TRACK: OVERCOMING MOMENTUM BLOCKERS


    188'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 10.7 You don’t have time to complete everything (cont.)


    +   - “I’m interested in hearing more about this. I want to make sure we cover
    everything we have planned, so if there’s time, let’s come back to this at the
    end of the session"


    If you know that you need to move quickly:


    +   - “I just did a time check, and we’re running a bit low on time. We have a
    lot of <questions/tasks> that I’d like to get your feedback on, so I may just
    push you along at times so that we can cover as much as possible."


    +   - “For the remaining tasks, we’re going to move faster than we have before.
    For each of the following tasks, show where you would click first"


    If the participant feels bad about not getting through at the end of the session:


    +   - “Don’t worry about that; I didn’t expect us to get through everything. Your
    feedback was very important and helpful. I’m glad we spent the time that we did."


    # What not to do or say


    +   - Don’t rush participants through tasks or questions for the sake of getting
    everything done. Adjust and prioritize what you need to do based on the time available
    so they don’t leave the session feeling like they were rushed.


    +   - Don’t panic. If you’re concerned about time, try not to let it show. This,
    of course, comes with practice but it’s good to be mindful of it.


    # How to avoid


    +   - Run a session with a participant to make sure that you have an accurate
    sense of timing. Of course, you’ll always get circumstances that result in a time
    crunch, but at least you can adjust the things that are under your control.


    +   - As you put together your study plan, identify which questions/tasks are
    the highest priority. This will help you adapt the session if necessary as discussed
    in section 15.2.


    # See also


    +   - 10.4 Participant is slow or thorough'
