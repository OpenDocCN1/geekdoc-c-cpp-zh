- pgno: 36
  md: 'a good minder being enough to constantly evaluate and reflect on how you''re
    interacting with participants. Before you jump to a conclusion about why the participant
    is behaving in a certain way, try to detect anything you may have done to trigger
    this behavior.


    Table 2.3 shows some examples of problematic moderator behavior that we''ve observed,
    the moderating styles (as identified by Table 1.1) that may encourage this behavior,
    and how it can impact the participant''s comfort level.


    As discussed in Chapter 1, there is a delicate balance between the goals and method
    of your study, the type of participant you have, your current emotional state,
    and the appropriate moderating style to use. These two elements in particular
    can change multiple times


    | Moderator Behavior (Moderating Style) | How the Participant React |

    |---|---|n| Over-the-top fake (Friendly Face) | You''re trying to be very kind
    and respectful towards the participant while maintaining a friendly tone. You
    don''t realize that you come across patronizing or disingenuous. | The participant
    becomes irritated and curt with his feedback. He may feel like you''re not taking
    his responses seriously. |

    | Buddy-buddy (Friendly Face) | You want the participant to be comfortable, so
    you start acting like the two of you are old pals. You laugh together and making
    jokes. He tries to make you laugh and looks to you for affirmation, as with natural
    friendly exchange. For an example of what this might look like, see Figure 2.1.
    | The participant begins to try to please you, unknowingly reflecting your attitudes
    and biases. His efforts to please him off his course of interaction and keep him
    from answering questions fully and honestly. |

    | Obliviously abrasive (Down to Business) | You maintain a serious, expectant
    tone as you ask questions. However, your tone comes across as stony. You also
    intense the participant looking nervous and blinking his eyes. For an example
    of what this might look like, see Figure 2.1. | If the participant is naturally
    talkative and high profile, he may feel insulted or put off by your serious tone.
    If he started nervous, your tone may only increase his discomfort. The intent
    staring may unnerve him to the point of asking to leave |

    | Death silence (Down to Business, by the Book) | You''re trying to be neutral
    as much as possible so you take a very minimalistic approach to moderating. You
    completely silent most of the time even though the participant is obviously nervous
    and uncomfortable with the silence. | The participant starts to blame himself
    and apologizes for "doing a bad job." Because you don''t respond, he becomes more
    uncomfortable. |

    | Clock watcher (By the Book) | You''re trying to stay on schedule, and look at
    the clock or watch at the most inappropriate times. You ask a question from your
    study plan and, while the participant answers, look at the clock, look ahead in
    the study plan, or obviously pay no attention to the participant''s answer. |
    The participant gets frustrated and makes sarcastic or snide remarks because he
    doesn''t feel like you''re listening to him. |


    Table 2.3: Examples of Problematic Moderator Behavior and Its Effects.'
