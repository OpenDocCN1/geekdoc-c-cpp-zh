  md: "# 11.3 Participant insists that she would never do something\n\nWhen you ask\
    \ the participant to show you how she does something or to complete a task, she\
    \ tells you that it's not something she would ever do. Or, she tells you that\
    \ the task doesn't fit into her current role or responsibilities.\n\nMethod(s):\
    \ Usability study; Contextual inquiry\nFrequency: Occasional\nPattern(s) to apply:\
    \ Clarify the task/question\n\n# What to do\n\nWhile this is similar to a participant\
    \ who can't or won't doing that was a key condition of the recruit (see section\
    \ 4.2), this participant matches your recruiting criteria.\n\n+   Take advantage\
    \ of this opportunity to learn more about why this falls outside of what participant\
    \ does or would expect to. You might learn something that will be incredibly valuable\
    \ for your team about users, especially if this is a key component of the product.\
    \ Ask her to clarify (and demonstrate if possible) her current involvement in\
    \ the task or process. What are the steps that she takes, and the tools she uses?\
    \ If the person who normally does the task isn't there, what would she do?\n\n\
    +   In a contextual inquiry, if you need feedback specifically on this task or\
    \ process, ask the participant if she can point you towards the person who actually\
    \ does the task you're interested in, and see if you can schedule time with that.\
    \ You might be able to adjust your study plan to get some other relevant information\
    \ from the participant—especially site visits can be tricky to coordinate—but\
    \ even if you can't, be sure to broke with the promised complication!\n\n+   \n\
    Explain that you understand that this task may not be something she does, you'd\
    \ still like her to attempt it so you can get feedback on the interface from the\
    \ perspective of a new user.\nIf the participant pushes back (e.g., because she\
    \ is more senior or more junior than the person who typically does this task),\
    \ let her know that you understand, but her feedback would still be useful in\
    \ making the product better by helping you understand what type of issues a new\
    \ user experience.\nIf she continues to push back or become obstinate about continuing,\
    \ go ahead and skip to the next task. If time permits after you can ask the participant\
    \ if she'd be willing to return to this task/process so you can get some feedback."
