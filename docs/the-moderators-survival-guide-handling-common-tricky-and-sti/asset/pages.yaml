- pgno: 290
  md: 'Since you''re reading this book, you''re already aware that moderating is a
    skill that can be improved. You may have noticed that user researchers rarely
    talk to each other about our moderating skills. Instead, we commiserate with each
    other about challenging participants or unique situations. This commation is valuable,
    but it can be difficult to translate these stories into actionable ways to improve
    yourself. Think of your moderating skill as a blade that needs to be sharpened
    on a sharp basis if you want it to work efficiently. If you''ve ever gone a few
    months between moderating sessions, you''ve probably felt a bit rusty and like
    you were off your game. This chapter focuses on how to get feedback on your moderating,
    and how to give feedback to others. These techniques will help you improve and
    refine your moderating skills whether you''re a novice or an expert.


    # 16.1 Working on your moderating skills


    No matter how experienced you are, at various times in your career you''ll inevitably
    say or do things while moderating that you haven''t. You''ll say outrageously
    leading or give away something about how a task can be accomplished, and in horror
    as words float out of your mouth. Even the most experienced moderators among us
    can get sloppy and fall into bad habits. We make mistakes. But mistakes don''t
    make you a bad moderator as you recognize when you could have done something better
    and take steps to avoid those mistakes in the future.


    The following are some ways in which you can elicit feedback and improve your
    own moderating skills.


    This recognition and self-reflection helps you grow and succeed as a moderator.


    # Watch yourself


    First, watch a recording of a session that you''ve moderated. Yes, this may be
    painful, especially if you''re fairly new to moderating. You may hate the sound
    of your voice and cringe at the verbal cues you noticed before. But, take a deep
    breath and remember that you''re doing this to be better and more successful at
    your job! Watching yourself is the easiest way to build a realistic awareness
    of what moderating is really like. For specific ideas on what to look for while
    watching the recording, see the sidebar “What to Look for in a Moderating Critique.


    If you can plan ahead of time to record a session specifically for your purpose,
    and your facility has the appropriate setup, adjust the cameras so you can capture
    both you and the participant. This will let you watch your body language and give
    a wider lens to your interactions with the participant.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Ask a colleague to watch


    One of the best ways to get feedback on how you''re doing is to ask a trusted
    colleague with user research experience to watch while you moderate. If possible,
    and your confidentiality policies allow it, have him watch you with a real participant,
    but if that''s not possible, ask another colleague to be your practice participant.
    A friendly incentive, such as taking him out for a coffee, especially if you''re
    asking him to help outside of his normal work hours.


    If you can''t work out a time when your colleague can watch you actually ran a
    session, see you can sit with him as he watches to receive his feedback in context
    of the recording, or talk with him afterwards.


    If you''re not sure how to ask your colleague to watch and provide feedback, consider
    something like:


    +   - I’d like to get feedback on my moderating. Do you have some time to watch
    one of my sessions? I’d really appreciate your perspective and recommendations
    about my tone


    If you feel comfortable taking it a step further, consider asking him to:


    +   - Take notes while watching. This will help him document and remember concrete
    examples of things you did and could do better.


    +   - Be as candid as possible, because you value constructive criticism.


    +   - Spend some time debriefing with you, rather than just handing off his notes.
    Ideally, you’d like to have a conversation.


    +   - Pay attention to specific areas that you would advice for, especially if
    you’re recording a. Ask him to think about what he would do in certain situations
    in which you struggled. Also, consider giving him a copy of the sidebar “What
    to Look for in a Moderating Critique."


    You could also ask multiple colleagues (who ideally have moderating research sessions)
    to watch a session. We recommend that you know and trust your audience if you
    do this, as it is humbling to have a group of people scrutinizing your work! It
    may be comfortable to have colleagues you''ve worked with repeatedly and whose
    judgment you trust, rather than a random group of people who don''t know you or
    have limited experience with user research. We recommend asking an individual
    colleague to take notes while watching and debrief with you afterwards.


    Depending on your colleagues, they might feel more comfortable if you broaden
    the scope to have them comment on anything related to the study setup and protocol
    in addition to your moderating interactions.


    Be sure not to violate participant confidentiality for recordings by sharing out
    of your project team (or whatever agreement established). If you''re at all uncertain
    whether this is allowed, run and record a practice session that you can share
    instead.'
