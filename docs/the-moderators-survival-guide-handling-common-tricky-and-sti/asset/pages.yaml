- pgno: 140
  md: '# 8.2 Participant asks for your opinion


    > The participant answers a question or completes a task and then asks you for
    your opinion. This query may be very pointed (e.g., "What do you think is the
    best brand") or more general (e.g., "What do you think about it?")


    Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Redirect the participant; Disengage from the participant


    # What to do


    The participant may be using these questions to engage you in a conversation like
    if you were talking in a more casual setting. A conversation may feel more natural
    to him than being asked to just respond to your questions.


    +   * Redirect the question by reminding the participant that you are interested
    in what thinks. Explain that you want to stay neutral.

    * If you find the participant is being overly friendly or conversational with
    you, and his friendliness is leading to these types of questions, adapt your moderating
    style (as we discussed in sections 1.5 and 1.6) away from a more informal disposition.
    For example, if your style was similar to the Friendly Face, you could shift to
    the more formal Down to Business. In conjunction with this change, you may need
    to disengage slightly from the participant by subtly changing your tone and body
    language/positioning as discussed in section 3.6.


    # What to say


    +   * “My opinion isn’t to the team—we’re here to talk about yours. What do you
    think?"

    * "I want to stay neutral here, so I’m going to turn back on you. What are your
    thoughts on this?"


    # What not to do or say


    +   * This one is easy—do not give your opinion!

    * Don’t ignore the participant’s question, as your avoidance may come off as rude.

    * Also try not to sound inconsiderate by saying something like “I’m not going
    to answer you.” Participants are already in a vulnerable position, so don’t make
    them feel worse!'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 8.2 Participant asks for your opinion (cont.)


    # How to avoid


    +   Use language at the start of the session to let the participant know that
    you''re trying to be a neutral observer, which means you may not answer his questions
    directly. Even though this won''t prevent the question from ever coming up, it''s
    important to set the expectation at the beginning so you can refer back to what
    you said if the participant keeps pressing you for an answer.


    # See also


    +   8.1 Participant looks for affirmation'
