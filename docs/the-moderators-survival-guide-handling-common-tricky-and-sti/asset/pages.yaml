- pgno: 50
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    +   - If the participant is approaching emotional or physical discomfort or physical
    danger.

    - If there is an emergency where you have to assist the participant to ensure
    her safety.


    # What to do


    This pattern means that you take responsibility for anything that, from the participant’s
    perspective, is unexpected during the session. For example, if you need to skip
    tasks or end a session due to something about the participant’s behavior (e.g.,
    she brings a baby with to the session or misrepresents a question), you can blame
    yourself for not having the setup to support her situation or for not choosing
    the best words. Putting the responsibility on you keeps the participant from feeling
    badly herself.


    This pattern also means that if something in the session seems to be wrong, you
    should take, or absorb, responsibility for it. If the participant is complaining,
    don’t agree or disagree with her—just absorb and accept her feedback. If something
    goes wrong, don’t blame players, developers, recruiters, or the participant—even
    if something is objectively their fault. As far the participant is concerned,
    the buck stops with you.


    Take responsibility is a pattern that can be used in almost any kind of session.
    It is a good principle to keep in mind as unexpected situations arise.


    You also need to take responsibility for the participant when it comes to her
    physical comfort and safety, especially in life-threatening situations such as
    fires or earthquakes. Especially if she is at your facility, it’s your job to
    watch over, and direct her until she is safely on her way home.


    Keep in mind that you may also need to use this pattern with observers, if your
    observers are in the same room as you and the participant. If the observers are
    distracting or causing problems, you must take responsibility and resolve the
    situation to ensure the comfort of the participant.


    # See pattern in use


    You can see this pattern being used in situations such as:


    +   - 5.8 Participant brings a child or a pet to her session

    - 14.1 Fire alarm goes off the facility needs to be evacuated


    # 3.2 Clarify the task/question


    By clarifying what you mean by a task/question, or asking the participant to reiterate
    understanding of what you asked her to do, you’ll reduce misunderstandings and
    improve the odds of getting the kind of feedback you need.'
