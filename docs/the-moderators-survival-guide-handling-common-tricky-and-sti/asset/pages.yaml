- pgno: 45
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    | What Not to Say | Why |

    | | | |

    | "Let me give you a hint." | Reinforces that the participant needs help. |

    | "Why would you want to go there?" or "What made you do that way?" | Implies
    that the participant wants to go, or did, is not correct. |

    | "Talk to me..." | Depending on how it''s said, or how much it''s overused, can
    sound commanding or condescending. |

    | "No, Don''t do that." | Reinforces that the participant is doing something they
    shouldn''t. |

    | "Well they did that because <special could happen or special constraint limited
    us>" | Implies that you were part of the design team, and/or defending the choices.
    |

    | "That is great feedback," or "That is good feedback." | Implies that other feedback
    is not great. |


    Table 2.5: Examples of What You Should Not Say While Moderating


    # 2.6 Regain control to bring the session back on track


    Hopefully, you''ve done so far you have jumpstarted the session. However, if the
    participant feels out of control or continues in a direction that is not useful
    to your research goal, it''s your job to steer him back. As the moderator, you''re
    always responsible for maintaining control of the session. This accepting responsibility
    for changing the tone or providing whatever support is necessary to bring the
    session back on track.


    Remember that you''re not the participant''s buddy. You didn''t set up this him
    for a gripe or therapy session. It''s your job to keep him from treating it that
    way. At the same time, some of the art of moderating includes redirecting a session
    and treating the participant''s feedback with grace and respect.


    How do you reestablish control of the session? For most one-on-one methods, a
    specific restatement or refocusing of a task or question is enough to get the
    participant back on track:


    +   - "Thank you for the pattern for redirecting the participant is more fully
    explained in section it''s helpful for the sake of time though, I''d like you
    to return to <attempting/answering task/question>..."


    +   -Thank you for explaining that, it''s helpful for us to hear. We''re a bit
    pressed for time so I''d like to direct your attention to..."


    You can also bring the participant to a different task or question if you think
    he may be getting stuck or hung up on something in particular.


    The pattern for redirecting the participant is more fully explained in section
    3.3.


