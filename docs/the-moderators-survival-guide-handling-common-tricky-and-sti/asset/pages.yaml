  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 4.1 Participant does not meet a key recruit criteria (cont.)


    won''t feel like "failed." However, if the reason is potentially sensitive, a
    pretext such as having "technical difficulties." Be appropriately apologetic to
    the participant, especially if he was excited about giving his feedback, and provide
    him with his full compensation.


    +   If the participant is a very important person (VIP) or customer, or a colleague
    hooked in your project team, you probably can''t get away with the technical failure
    pretext. Check with your observers/stakeholders on the best way to handle this
    particular participant. They may encourage you to proceed anyway so the participant
    feels like he has a chance to provide feedback that will be taken seriously, even
    if it isn''t in line with your research goals. One way to get this feedback is
    to adjust your study plan to learn more about what the participant does or is
    interested in doing.


    # What to say


    +   Before we continue, I just want to verify a few things about your <experience/expertise/role>.
    According to the information provided by our recruiter..."


    +   I''m sorry, <participant name>, but for the purpose of this research, we need
    to talk to people who <criteria>. Thank you much for your willingness to come
    in today, and here is your agreed-upon compensation.


    Ending early:


    +   "I''m sorry, it looks like the prototype I wanted to get your feedback on
    isn''t working. I have a few questions for you, but after that, we''ll end the
    session early. You''ll still get your full compensation!"


    # What not to do or say


    +   Don''t be accusatory of the participant''s qualifications (or lack thereof).
    He may take it personally. When verifying the participant criteria, do so in a
    subtle and nonjudgmental way.


    +   Don''t assume that the participant lied about his qualifications. The screener
    could have been poorly worded, or your recruiter may have been more lenient than
    he should have been. After the session, go back and review the requirements with
    the recruiter.


    +   Likewise, do not assume that the recruiter messed up. If you''re able to look
    into what happened, you won''t know the truth of the situation. When interacting
    with the participant, always take the responsibility for the misunderstanding
    yourself, even if you''re pretty sure the fault lies with your recruiter.


    # How to avoid


    +   Ensure that the recruiter has detailed information about each of your desired
    criteria and how to evaluate whether or not the participant matches the criteria.
    Avoid using "give-away" questions


