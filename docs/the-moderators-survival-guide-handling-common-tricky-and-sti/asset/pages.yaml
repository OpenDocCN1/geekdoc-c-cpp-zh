- pgno: 124
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # Survival Story


    # SURVIVAL STORY: "SHE WAS SO APPRECIATIVE"

    KAYCEE A. COLLINS


    I was conducting an in-person usability study for a newly conceptualized investment
    tool. For client-facing designs, I used a third-party vendor to complete the recruiting
    process. I would provide a screener and client list for the recruiters to use
    and they would provide the scheduled participants. At the time, I was not meticulous
    about double-checking the scheduled participants to verify that they matched the
    type of user I was looking for. Walking into the lobby, I met my first participant
    of the day and started small talk, nothing out of the norm, but simple questions
    like “Did you find the facility okay?” and “How is your day going?” This is when
    I learned the recruiter scheduled two people for consecutive sessions who were
    not living in the same household, but had just filed for divorce.


    The woman continued to talk about her so-to-be-husband and the emotional abuse
    she had endured. After listening to her for about 10 minutes and acting as a pseudo-psychologist,
    we were able to focus on story. The remainder of the session she was so appreciative
    to have had someone listen to her, she returned the favor by concentrating on
    the prototypes without the distractions of the stressful situation running through
    her. Every question was answered honestly and without hesitation. In the end,
    I received great feedback that positively impacted the design due to her openness.
    Sometimes it takes letting participants get things off their chest before buckling
    and focusing on the task at hand. When participants have other thoughts in mind,
    it can be hard to get focused on providing feedback on a design because they were
    preoccupied. I always get participants with a warm smile and small chat to break
    the ice and hopefully put them in the right mindset to provide feedback. In this
    case, the participant and I had already built a rapport and trust before even
    starting the session.


    As for him, he was waiting when I walked his wife to the door after the session.
    I thanked him for coming and told him I overwhelmed, not because of the conversation
    I had with his wife, but to avoid having more than one person per household to
    negate any sample error, especially when testing with only a handful of users.
    I then took the floater for the next session.


    I learned a lot from this experience. First, double-check my scheduled participants
    sheet to validate I have the right users. Second, have a close relationship with
    vendors. The vendor I was working with no idea how two participants from the same
    household would have a negative impact on the study; they were more than happy
    to keep a lookout for this situation in the future. Third, when participants need
    to talk, let them get it off their chest. It will be beneficial in the end.


    SOME GUIDANCE REQUIRED: PARTICIPANTS IN NEED OF SHEPHERDING


    122'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 7


    # CHAPTER

    Make it Work:

    Handling Technical Obstacles


    A technical problem can stop your session in its tracks. Whether you''re encountering
    broken equipment or difficulties with your remote session setup, you need to reassure
    the participant that the problems are not her fault and find a way to resolve
    the issues so you can get back to your study plan.


    +   7.1 Technical issues arise with your setup and/or equipment 125

    7.2 Remote participant experiences difficulty joining 127

    7.3 Facility loses its Internet connection 129

    7.4 Remote participant drops off the call 131

    7.5 Prototype or product changes unexpectedly 133'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 7.1 Technical issues arise with your setup and/or equipment


    Something goes wrong, or stops working, with your technical setup. Your audio
    recorder may stop working, your camera may run out of battery power, or your screen
    recording software may decide to stop recording. The mobile device that you''re
    using for your study may receive an (unrelated) call in the middle of the session,
    or the product breaks while the participant is using it.


    +   Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Take responsibility; Take a break; Shift the focus


    # What to do


    +   Figure out if the problem can be easily resolved. Batteries can be replaced
    or charged, cables can be tightened, device volumes can be lowered, and computers
    can be restarted (restarting a computer often corrects a multitude of issues).


    +   If the problem cannot be resolved, decide whether you''re able to proceed.
    In most cases, you should be able to proceed with slight modifications (e.g.,
    you may not be able to record the session, but you can still take detailed notes
    of what the participant says and does.


    +   If you have observers who can help fix a more complicated problem with a product,
    you can ask them for an estimate of how long a fix would take. Based on that,
    you can steer the session in a different direction with the participant while
    the item is being fixed (e.g., ask for a series of interviews) or end the session.


    +   If you plan to fix a technical issue with a product in front of the participant
    during a usability study, first think about what the participant might see. If
    by fixing the product, the participant will discover parts of the design that
    you hadn''t intended to see yet or what might bias later tasks, consider asking
    them to turn away or take a short break. If the participant is remote, pause or
    stop the screen-sharing application first so the participant doesn''t see you''re
    doing.


    +   If someone needs to enter your research space to fix the technical issue,
    ask them not to interact more than necessary with the participant. Then, warn
    the participant and let her know exactly who is coming into the space and why.
    Offer to let the participant leave the room to get a drink or go to restroom while
    the work is being performed, or sit in a chair and use her phone or mobile device.
    Be sure the recording equipment is turned off while the work is being done, and
    remember to turn it back on when the session resumes.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 7.1 Technical issues arise with your setup and/or equipment (cont.)


    # What to say


    +   - “Excuse me for a moment, but I just noticed that there is something wrong
    with our equipment. Let''s take a short break so I can get it working.

    - “Please bear with me as I try to get this working again. Sorry about this!"

    - “We’re having a technical problem and I need to get one of our technical experts
    to come in and fix this. She''ll need to use *the product*, and it may take a
    few minutes, so let''s take a break. <Technical expert>, please come on in."


    # What not to do or say


    +   - Don’t freak out or panic!

    - Try not to badmouth the makers of the equipment or software that you’re using.
    While you’re probably frustrated by this situation, maintain professional demeanor
    around the participant.

    - Don’t blame the participant for anything that happened, even if the technical
    issue was caused by someone she did.


    # How to avoid


    +   - Test the technical setup beforehand. If the setup is complex, use a checklist
    of everything that needs to happen. That, if you need to restart or change something
    in the session, you can reference the checklist to make sure you''ve forgotten
    anything. This checklist should also include any URLs, user names, or passwords
    necessary. For more tips and discussion, refer to section 15.3.

    - Verify the status of all your equipment before the session. Make sure any devices
    and rechargeable batteries are charged. Also, be sure you have additional batteries
    or battery packs.

    - In cases where you have equipment or software problems that take time to resolve,
    it helps to have a generic questionnaire prepared to give to participants. For
    example, you could put together a survey asking the participant additional questions
    about her usage of the product and her experiences.

    - If you use a screen-sharing application for observers to watch the session,
    consider having a backup account with a different service so if you have technical
    problems with one, you can quickly set up a new meeting using your backup service.
    Be sure to include information about this backup service on your checklist.


    # See also


    +   - 7.2 Remote participant experiences difficulty joining

    - 7.3 Facility loses its Internet connection

    - 7.4 Remote participant drops off the call

    - Chapter 15 sidebar: "Troubleshooting Skills Are a Lifesaver"

    - Survival Story: “The lights seemed dimmer than normal”'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 7.2 Remote participant experiences difficulty joining


    > As you try to get the remote participant set up in the session, you run into
    a number of technical difficulties. The most common are difficulties accessing
    screen-sharing software (e.g., trouble downloading software or any necessary extensions).


    Method(s): Any remote methods

    Frequency: Frequent

    Pattern(s) to apply: Take responsibility; Shift the focus; End the session early


    # What to do


    Because screen-sharing software is usually vital for doing any kind of remote
    research, these difficulties may reduce the amount of time you can spend actually
    getting the feedback you need for the study. You may feel extra stressed if you
    have observers, as spent troubleshooting less time spent on what they care about.


    +   - Ask the participant to describe what is happening on her computer. If you''ve
    created a step-by-step guide (see "How to avoid" section), this has in front of
    you so you can match what the participant is seeing with what she is supposed
    to see.

    - Ask the participant to verify what kind of computer (e.g., Mac or PC) and web
    browser (e.g., Internet Explorer or Chrome) she is using. You can then verify
    this information against the screen-sharing software''s system requirements. Keep
    in mind that if a browser meets the official requirements, there may be missing
    or degraded functionality for older versions of browsers. Try another (if the
    participant has multiple installed or can install a different one) and see if
    that solves the problem. If the participant''s setup doesn''t work with the screenssharing
    software, ask if she has access to another computer that meets the requirements.

    - If possible, try to follow along with what the participant is using the same
    browser as her (e.g., if you''re already connected to screen-sharing with Firefox,
    open Internet Explorer). By this, you can check exactly what the participant is
    and should be, seeing at various points in the process even if you don''t have
    a step-by-step guide.

    - If you have access to another screen-sharing application, consider using it
    instead. If you have a team member available, ask her to send out the new observation
    information to any remote observers while you try to get the participant set up
    on the new application.

    - If none of these solutions work and you were intending to run a usability study
    or contextual inquiry, consider the focus of the research to more of an interview
    approach that only requires a conference.

    - As a last resort, ask the participant if you can reschedule her session, and
    follow up with her separately to work out any troubleshooting issues.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 7.2 Remote participant difficulty joining (cont.)


    # What not to do or say


    +   - When giving troubleshooting directions to the participant, avoid using user
    interface jargon (e.g., status bar, dialog box), as may not understand what you''re
    talking about. Instead, reference areas of the screen based on their location
    and physical characteristics.


    +   - Be very careful about suggesting something that may cause harm to the participant''s
    computer. For example, you might not want to go the person into the Windows registry
    to delete a file or disable features or devices.


    # What to say


    +   - “Can you tell me exactly what you''re seeing on the screen right now? I''ll
    do my best to get this sorted out for you."


    +   - “Please bear with me while I try to follow along. Thank you for your patience!"


    # How to avoid


    +   - Meet with the participant before your scheduled session to do a five-minute
    dry run of the technology. This dry run will let verify that the participant has
    the correct system requirements to support your screen-sharing software, and gives
    you ample time to troubleshoot any problems that come up.


    +   - Research any restrictions that either your organization or the participant''s
    organization (if she is at work) have on networking. We''ve found some pretty
    funky issues in the past with screensaring applications due to a firewall/security
    settings, private virtual network (VPN) access, platform and browser support,
    or a combination thereof. For example, we''ve discovered cases where internal
    employees of a company attempting to use WebEx through their VPN could only join
    if they used the Chrome browser on a PC or the Safari browser on a Mac. We don''t
    make this stuff up!


    +   - Create a step-by-step guide for joining your screen-sharing application,
    with screenshots, and have it printed in front of you as the participant joins
    to join the session. You can also create an abbreviated version to send to participants
    ahead of time.


    +   - If you have observers who are only available at certain times, consider
    scheduling backup or floater participants in case you need to cancel a participant
    due to technical difficulties. See section 15.1 for more on making this decision.


    # See also


    +   - 7.1 Technical issues arise with your setup and/or equipment


    +   - 7.4 Remote participant drops off the call


    +   - Chapter 15 sidebar: “Troubleshooting Skills Are a Lifesaver"'
