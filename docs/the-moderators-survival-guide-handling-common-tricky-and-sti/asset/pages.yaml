- pgno: 168
  md: '# 9.6 Session interrupted accidentally by an observer or someone else


    > At some point during the session, someone accidentally intrudes the study space.
    The intrusion may be in person (e.g., someone coming into your research space
    without realizing it''s occupied) or remote (e.g., an observer doesn''t realize
    that her phone is not muted, or puts you and the other observers on hold and now
    everyone hears music).


    Method[s]: Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility, Reassure the participant


    # What to do


    For an in-person interruption:


    +   - Get the interrup out of the room as quickly as possible. If the interrup
    is lost or looking for something in particular, take a moment to help her or direct
    her to someone who can.

    - Apologize to the participant for the interruption, and let her know that you
    don''t anticipate any more interruptions going forward (hope for the best).


    If the interruption is during a remote session:


    +   - Remind all observers to put their phones on mute.

    - If you''re using screen-sharing software (e.g., in WebEx, by right-clicking/contextual-clicking
    on the observer''s name and choosing Mute). If you can''t find this functionality,
    you should be able to eject the observer from the meeting, which will disconnect
    her audio. Conference calling systems have a similar ability to mute everyone
    or except certain attendees.

    - If you can still hear the observer (e.g., if she has stepped away from her phone
    and you can hear her background conversation), as a colleague to send an email
    reminding all observers to mute their phones. You may also need to pause the session
    for a few minutes, especially if the noise is very loud. This pause may give the
    disruptive observer a chance to get back to her desk and realize what is happening.

    - If you have access to another conference call number, you can ask anyone to
    join a new call instead. If the participant is remote, be sure to give the new
    information to her, or let her know that you''ll call her directly to conference
    her in (depending on your setup).'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 9.6 Session interrupted by an observer or someone else (cont.)


    +   - you do not have the time or means to set up another conference call, you
    can simply call the participant directly and not let any remote observers listen
    to the remainder of the session. If you do, send out a message to the observers
    (or have someone do it for you) so they understand why you made the change and
    offer to share any recordings.


    +   - If none of these options are possible solutions for you, you can try to
    continue the session and tolerate the distracting sounds. If the noise from the
    offending observer is too loud for this to be a viable option, ask the participant
    to wait until the noise issues get resolved. While this may mean that you will
    have to end the session earlier than planned, hopefully the steps you''ve taken
    in the meantime will prevent this from happening again—with this group of observers,
    at least.


    # What to say


    If there is an in-person disruption, to the person who interrupted:


    +   "I’m sorry, this room is being used for a research session. It will be available
    <later/at X time>.


    If on the phone:


    +   <Participant>, please hold on for a moment; we’re getting some background
    noise. Could everyone on the call make sure that your phone is muted?


    If you''re not able to get the attention of a remote observer who is typing or
    otherwise making a lot of noise unknowingly:


    +   <Participant>, please bear with me while I work with my team to try to get
    in touch with the person making the noise. I am muting your phone and step away
    for a few minutes. Please stay on the line.


    # What not to do or say


    +   - If you know who the offending remote observer is, try not to call them out
    by name unless it''s the last resort in getting attention. Make a generic announcement
    needing to mute their phones and attempt to get in touch with the observer some
    other way, like email, instant message, or through the screen-sharing application
    with a private chat message.


    # How to avoid


    +   - If your session is in person, put a sign on the door of your study space
    to let passersby know they should not enter the space.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 9.6 Session interrupted accidentally by an observer or someone else (cont.)


    +   If your session has remote observers, take advantage of options within your
    screen-sharing application or conference call system to automatically mute all
    attendees from the start (except for the participant, course; you may need to
    call her separately if she is remote). Also, tell observers ahead of time that
    they should mute their phones when they join the call—you can''t be too careful


    # See also


    +   9.2 The observers are loud and distracting


    +   9.5 Observer unexpectedly interacts with the participant


    +   9.7 Session interrupted by someone the participant knows'
