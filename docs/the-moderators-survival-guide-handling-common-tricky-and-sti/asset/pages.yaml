- pgno: 47
  md: '# SURVIVAL STORY: "I KNOW WHAT SHE NEEDS!"

    CAROLYN SNYDER


    I was running a paper prototype usability study at the client site. It was codcovery.
    User #1 had already shown up. User #2 arrived with her angelic, sleeping two-month-old
    baby in tow. She was surprised when I reminded her that the session would take
    two hours. She was under the (sleep-deprived) impression it would just take a
    few minutes.


    What I should have done explained that we couldn''t accommodate infants, apologized
    for the misunderstanding, paid her, and sent her home. I asked the client if they
    were okay with a baby in the room. They were surprised, but didn''t object. (For
    the record, most of them were mothers themselves, and User #1 was female.)


    I spent the rest of the session agonizing over how the client would respond. They
    chose not to make an issue of it (I have wonderful clients), but even now, 20
    years later, I still think about all the ways it could have ended badly.


    It did cross my mind to send her home. But in the moment, it was, surprisingly
    hard to choose that fork in the road. Being an eager younger user experience consultant,
    I put a higher priority on getting feedback for the client than the comfort of
    the participant, client, and even myself. I lacked the confidence to make a unilateral
    decision and take responsibility for it. I do still make mistakes, but I''ve learned
    to own them.'
