- pgno: 209
  md: '# 11.8 Participant becomes agitated by a product''s usability issues


    The participant seems really upset by the product she''s using. She may be frustrated
    not being able to figure out how to accomplish a task or answer a question, and
    takes anger out on the product or the people who created the product. While some
    agitation for powerful video clips, an extended period of anger ceases to be productive
    and could derail the session.


    **Method(s):** Usability study; Contextual inquiry

    **Frequency:** Rare

    **Pattern(s) to apply:** Take responsibility; Redirect the participant; Take a
    break


    +   - Maintain a calm, neutral demeanor, even if you''re startled or nervous about
    the participant''s agitation. Keep the tone of your voice neutral and calm, and
    avoid any sudden shifts in body language. Avoid anything that might increase the
    level of agitation.

    - Acknowledge the participant''s frustration, and thank her for her feedback.
    Slowly adjust your position to angle toward her and make eye contact. Reassure
    her that even though you''re irritated, it''s helpful to hear these issues so
    the product can be improved.

    - Redirect away from whatever is causing the extreme agitation. For example, if
    she'' frustrated because she can''t figure out how to accomplish a task, follow
    the recommendations in section 6.4 on giving the participant an assist to help
    her continue, or move on to the next task/question that covers a different area
    of the product.

    - If the participant continues to be agitated, take a short break so she has a
    chance to calm down. When you resume the session, move on to a task/question that
    covers a different area of the product.


    # What to say


    +   - "It''s really helpful to hear for what areas are confusing or frustrating
    so they can be improved in future versions. So, we really appreciate you going
    through all with us!"

    - "Thank you for your feedback so far. Let''s take a quick five-minute break so
    I can see if any of our observers have any questions for you."


    # What not to do or say


    +   - Don''t be impatient toward the participant or defensive about the product.
    Remember that the goal of your research is to understand a product''s usability
    issues, which is exactly what the participant has discovered.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 11.8 Participant becomes agitated by a product''s usability issues (cont.)


    # How to avoid


    +   At the beginning of the session, tell the participant that if she finds anything
    confusing or frustrating, you want to hear about it the product can be improved
    so others don''t experience the same issues. Making sure the participant feels
    that she has permission to share her frustrations may reduce any agitation she
    feels later in the session.


    # See also


    +   10.8 Participant struggles excessively with a task

    11.4 Participant is frustrated by the prototype''s limited functionality'
