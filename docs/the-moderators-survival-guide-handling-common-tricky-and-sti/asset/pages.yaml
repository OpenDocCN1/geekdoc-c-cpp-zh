  md: '# THE MODERATOR''S SURVIVAL GUIDE


    +   * He increases his physical distance from what''s being evaluated (e.g., chair
    pushed away from the table or keeping a physical product at arm''s length).

    * He crosses his arms.

    * He blames himself or apologizes for being "stupid" or inperienced.

    * He has difficulty speaking clearly.

    * He exhibits signs of emotional distress, as tremors, crying, or excessive sweating.

    * He constantly glances around the room or at the cameras.

    * He asks to end the session early.

    * He pays excessive attention to distractions (e.g., his email is open in the
    background and keeps checking it).


    Table 2.4: Signs a Participant May Be Uncomfortable.


    Watch Video 1 to see an example of a moderator interacting with a self-blaming
    participant during a usability study. The participant is very nervous about the
    session and is looking for affirmation.


    Visit our website (http://www.modsurvivalguide.org/videos) or use your QR reader
    to scan this code.


    causing his discomfort, the research session itself can create some stress no
    matter what you do to avoid it.


    To help the participant feel more comfortable,


    +   * Reassure him that he is not being tested, and that anything that frustrates
    him is valuable information for the product team. Remind him that his feedback
    will make the product easiest to use for future users. For a contextual inquiry
    or interview, you can reassure him his feedback is confidential and will ultimately
    be used to make his own life/work better.

    * If you''re running a usability study, avoid using the term test when referring
    to your research. A test is something that can be failed, and may place additional
    pressure on the participant. He may not understand that you are testing the product
    and not him. Instead, use study, session, or evaluation of <product>. Likewise,
    you may consider calling each usability task a scenario instead of task.

    * If the participant crosses arms or moves away from you (the product being evaluated),
    ask him to tell you what he is thinking. This question gives him permission to
    express the reasons for his discomfort, and may reveal if he is uncomfortable
    because of something you asked him to.

    * Ask the participant if he would like to take a short break, or go ahead and
    suggest a break.


    If you tell the participant upfront that the test refers to testing the product,
    he may not internalize this. He may stay on edge if you continue to refer to the
    study as a test.


