- pgno: 220
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 12.4 Participant tells you something personal


    The participant tells you something personal about himself or his situation. Maybe
    he apologizes for seeming distracted and lets you know he''s going through a very
    bitter divorce. Or, he starts telling you about his spouse''s recent health problems
    and seems on the verge of tears. The information that the participant shares may
    be that needs to be kept confidential, such as his social security number and
    personal financial details.


    +   Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Redirect the participant; Reassurance the participant; Take
    a break


    # What to do


    We''ve experienced times when a participant shares personal information. Sometimes
    the participant is sharing because he knows he''s emotional and gives you a heads
    up in case comes up later in the session. "Sorry I''m not focused. My mother died
    last week." Other times it comes unexpectedly as an answer to one of your standard
    questions. Or, you may be starting the session with the expectation of hearing
    a participant''s personal stories because a sensitive matter is the focus of your
    research.


    +   If the participant is unnecessarily giving away personal information as financial
    information because he thinks it''s necessary for the study (e., while interacting
    with a financial application), ask him not to share any personal data. Go back
    to the notes and make sure that any of information is deleted or masked.


    +   If you''re performing research in a sensitive subject area, you should be
    expecting to hear a participant''s personal stories. Remember to remain empathetic
    as you answer his questions, and be sensitive if you probe on his answers or ask
    follow-up questions. Thank him sincerely for his feedback.


    +   If the feedback provided by the participant affects you deeply on a personal
    level (e., because you''ve had similar experiences), remember to keep the focus
    on the participant instead of sharing your story. You want the participant to
    feel safe and respected, and intercepting your takes the focus away from the importance
    of his feedback.


    +   If the participant starts telling you a story that seems to be affecting him
    emotionally, let him finish the story, and then redirect him to the task at hand.
    For example, if you asked a participant to tell you how long he opened a checking
    account and he responds with a story about how he and his late wife chose together,
    listen to him respectfully until he finishes the story. Thank him for his answer,
    and if he''s okay continuing to the next section or if he''d like to take a short
    break.


    222'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 12.4 Participant tells you something personal (cont.)


    +   - Sometimes life just gets in the way, and a participant becomes distracted
    or upset over a personal situation. Handling this is a fine balance between comforting
    the participant and hijacking the session to listen to his. In these cases, start
    by taking a short break. Walk the participant out of the observed/recorded study
    area if he is okay and give him time to recover.


    +   - If the participant is telling you something personal but doesn''t seem emotionally
    fragile about it, consider the context and whether it becomes a recurring problem.
    For example, a participant may respond, "I watch a lot of pornography" in response
    to being asked about website usage. Although it is likely considered socially
    taboo, the participant was answering a question and it was the only comment he
    made that was too much information (TMI!). In those cases, try not to react and
    continue with the session. If, instead, the participant starts telling a longer
    personal story or goes into excessive amounts of detail, consider reminding him
    that he''s being recorded or redirect him back to the topic being discussed.


    # What to say


    +   - "<Participant>, please use fake information rather than your own here. We
    want to respect your privacy.


    In response to a personal comment where the participant does not seem emotionally
    affected:


    +   - "Okay. Let''s move on to..." or "Let me ask you about...


    In response to a longer personal answer where the participant is emotionally affected:


    +   - "Okay, thank you for that. Are you okay continuing to the next <task/question>?",


    In response to a longer personal answer where the participant does not seem emotionally
    affected:


    +   - "I''m sorry to interrupt. I just want to remind that we''re recording the
    session and there may be people listening, so let''s stay focused on the original
    topic. There''s anything else that you want to know, let''s move onto..."


    +   - "Why don''t we take a little break and step outside for a couple of minutes.".


    +   - (In private): "I don''t want you to continue the session if you''re feeling
    uncomfortable. We don''t end the session for today?"


    # What not to do or say


    +   - Don''t ignore any signs of emotional distress from the participant.


    +   - Even if you''re intrigued, avoid expressing interest in stories that involve
    very personal information unless the story is relevant to your research goals.
    The participant may take your interest as license to overshare more and it may
    be better to pull him back to your scripted questions.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 12.4 Participant tells you something personal (cont.)


    # How to avoid


    +   - For research involving sensitive topics, such as using a website about cancer,
    consider whether you need to recruit participants who have firsthand experience
    with the topic. In some cases it may make sense to do so, but in others you may
    want to actively screen out participants who are likely to experience distress
    because of the subject matter (e.g., family members of someone who died of cancer).


    # See also


    +   - 12.1 Participant is extremely entertaining and friendly

    - 12.3 Participant is obviously distracted by external circumstances'
