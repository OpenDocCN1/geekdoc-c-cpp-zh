- pgno: 182
  md: '# 10.4 Participant is slow or thorough


    > The participant is taking a lot of time to read, think, respond, and elaborate.
    This behavior may simply be a result of a slow and careful personality, or the
    participant may not realize how much other content you''ve planned for the session.
    He may also feel the need to be thorough because he''s being watched or out of
    perceived obligation because he''s being paid for his time.


    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Redirect the participant


    # What to do


    +   To see if the participant is just naturally slow or thorough person, ask him
    whether he''s doing similar to what he''s done on his own. For example, “If you
    were doing this on your own, would you read these Terms and Conditions like we
    are now, or spend more time on them, less time on them..."


    +   If the participant is being slow because that is his natural approach, accept
    that there''s not much you can do to change that. Rushing him might confuse him
    or provoke anxiety. Instead, go into prioritization mode. Think across all your
    upcoming questions or tasks and consider what can be dropped and skipped over.


    +   If the participant is being slow because you feel like you want him to be
    thorough, reassure him that you want him to be as if he would be doing this on
    his own without watching. This could help speed him up. If it doesn''t, use the
    same prioritization technique mentioned in the previous point to direct him to
    the next task/question with the highest priority.


    +   If the participant seems to feel bad that he didn''t get through all your
    tasks or questions, assure him that you hadn''t planned to get through everything
    in the allotted session time.


    # What to say


    If you anticipate the participant being slow upfront, give background instructions:


    +   “We have a lot of <tasks>, but we probably won''t go through all of them.
    You may see me skipping around to make sure I make the most out of our time.


    If you want to see whether the participant is behaving naturally or is being slow
    and thorough for your sake:


    +   “Please go at whatever pace you would be doing this on your own and I wasn''t
    sitting here with you. Don''t feel like you have to rush or be more thorough because
    I''m here.”'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 10.4 Participant slow or thorough (cont.)


    +   - “You seem to spending some time <doing this>. Would you be doing that if
    you were on your own at <place/home/work>?”


    If the participant needs some pushing along midsession:


    +   - “This is all very helpful to see and hear. Just for the sake of time, I’m
    going to ask you to <go to the next task/go back to...>


    +   - “I’m interested in hearing more about this. I do want to make sure we cover
    everything we have planned, so if there’s time, let’s come back to the end of
    the session.”


    If the participant feels badly about not getting everything:


    +   - Don’t worry about that; I didn’t expect us to get through everything. All
    of your feedback was very important and helpful. I’m glad we spent the time the
    way that we did.


    # What not to do or say


    +   - Don’t rush participants through tasks or questions for the sake of getting
    everything done. Be respectful of the participant’s speed and level of detail,
    and adjust your questions/tasks accordingly.


    +   - Don’t panic. If you’re concerned about time, try not to let it show. This,
    of course, comes with practice but it’s good to be mindful of it.


    # How to avoid


    +   - There is no way to avoid participants who are slow and deliberate. It’s
    just a matter of being prepared! The best way to be prepared is to identify which
    questions/tasks are the highest priority as you put together your study plan.
    This will help you adapt the session if necessary as discussed in section 15.2.


    # See also


    +   - 10.7 You don’t have time to complete everything'
  merge: -1
