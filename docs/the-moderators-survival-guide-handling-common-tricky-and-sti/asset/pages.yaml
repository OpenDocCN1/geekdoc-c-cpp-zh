- pgno: 132
  md: '# 7.4 Remote participant drops off the call


    You''re running a remote session using screen-sharing and audio-conference technology
    such as WebEx. Suddenly you realize that you can no longer hear the participant.
    She may also no longer be visible as an attendee in the screen-sharing application.


    +   Method(s): Any remote session

    Frequency: Occasional

    Pattern(s) to apply: Take a break


    # What to do


    +   First check to see whether you have a visual representation of who is in the
    audio conference, either via your screen-sharing application (if using VoIP) or
    your phone interface. If you do, check to see if the participant is still there.
    If she is listed, you may be able to send her a chat message from within the application
    to see if she is still on the call.


    +   If you do not have a visual indicator of everyone on your conference call,
    first verify whether the participant is really gone or just accidentally muted.
    Ask her if she is still on the call, and to check to make sure she is not accidentally
    on mute.


    +   Assuming the participant is really gone, the best thing to do depends on how
    the participant was brought into the call. If she dialed in her own, wait a few
    minutes for her to call back in. If you called her or referred her (i.e., she
    doesn''t have a number to rejoin the conference), you''ll need to repeat the initial
    steps to bring her in to the audio portion of the session.


    +   If you''re having trouble getting hold of the participant or if she has not
    yet dialed back in on her, take a break for a moment to provide the observers
    with an update. Let them know that you''ll continue trying to get in touch with
    the participant.


    +   Send the participant an email with your contact information so she can reach
    out to you if she is experiencing technical problems that are keeping her from
    rejoining the session.


    # What to say


    To participant:


    +   <Participant>, I can no longer hear you. Are you still there? If you can hear
    me, please check to make sure you''re not on mute.


    To observers on call:


    +   I believe we''ve lost our participant. Please stay on the line, and I''ll
    attempt to get in touch with her.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# 7.4 Remote participant drops off the call (cont.)


    # What not to do or say


    +   Don''t say anything negative about the participant, as she may not really
    have been dropped from the call (e.g., she just be having audio problems) or may
    be dialing back in. You may not want to allow observers to speak on the call for
    the same reason.


    # How to avoid


    +   Provide the participant with instructions ahead of time on what to do if she
    gets dropped. For example, "I will call you again at this number."


    # See also


    +   7.1 Technical issues arise with your setup and/or equipment

    7.2 Remote participant experiences difficulty joining

    Chapter 15 sidebar: "Troubleshooting Skills Are a Lifesaver"'
