- pgno: 229
  md: '# 12.8 Participant has an unexpected disability or service animal


    The participant has an unexpected physical disability such as visual or auditory
    impairment. He may also have brought a service animal with him. Because this situation
    is unexpected, your facility may not be set up to accommodate this kind of participant.


    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: Take responsibility; Shift the focus


    # What to do


    +   First, assess whether the participant’s limitation prevents him from participating
    as planned. With some types of visual impairment, the user can adjust a computer
    monitor’s settings (e.g., font size and contrast) to accommodate his level of
    vision. A participant with an auditory impairment probably have brought some kind
    of assistive hearing device, or can read lips. However, a legally blind participant
    who relies on a screen reader to unable to use a computer that does not have a
    screen reader (e.g., Jaws) or magnifier (e.g., ZoomText).


    +   If you don''t feel like you can proceed as planned with the participant, decide
    if it''s appropriate to shift the focus of the research to still gain value from
    the session. For example, move to an interview instead of usability study of a
    prototype. This shift will be most appropriate in formative studies, depending
    on your client and your research goals, it may also work for other types of research.
    Sometimes just going more depth into your background questions can yield valuable
    results.


    +   If the participant hasn''t brought his limitations, but you notice him squinting
    at a monitor or moving closer to the screen, let him know that you noticed his
    adjustment, and ask if there''s anything that you can do to make the screen easier
    for him to read.


    +   If your participant brought a service animal, ask if there''s anything specific
    that you should do or not for the animal. Most animals are well trained and will
    quietly sit by the participant during the session.


    +   Likewise, ask the participant if there''s anything you should or shouldn''t
    do to accommodate his needs. For example, blind participants and others with walking
    challenges sometimes appreciate when they''re offered an arm for them to hold
    onto while walking, others prefer to rely on their walking stick or service animal.


    +   Keep in mind that users with visual impairments are often more difficult (expensive)
    to recruit, so do your best to take advantage of the situation to provide your
    client team with feedback that they may not get other.


    +   If you''re unable to proceed with the participant and have to let him go (or
    the end session), be sure to provide him with his full compensation.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 12.8 Participant has an unexpected disability or service animal (cont.)


    # What to say


    +   - If you see a service animal with you. Is there anything that you need me
    to do, or not do, for your animal during our session?

    - You mentioned that you have some issues with your vision. Tell me the issues
    you have, and about the setup you have at home to accommodate these issues.

    - I noticed you seem to be squinting at the monitor. Is there anything I can adjust
    to make it easier for you? Feel free to move your chair to the monitor as well
    if that helps.

    - I want to be accommodating and respectful of your vision. Is there anything
    in particular that I prefer help with or not help with while you''re here?


    # What not to do or say


    +   - Don''t make adjustments to your setup without checking with the participant
    first. You will just be making assumptions about what will work for them.

    - Likewise, do not make assumptions about what the participant will need in terms
    of physical assistance. You don''t want to come across as patronizing or make
    things more difficult. Honestly ask him what he prefers and how you can help with.

    - Don''t pet or try to play with a service animal. They''re on duty!


    # How to avoid


    +   - Most participants with any kind of limitation will mention it during the
    screening process, so you''ll usually have a heads up from the recruiter. However,
    if the participant doesn''t mention it ahead of time and meets your recruit criteria,
    there''s a good chance he is still part of your target audience, so anything you
    do to accommodate him will yield interesting results—that is, this may not be
    a situation you want to avoid.

    - If there are specific reasons why you can''t have someone with a physical limitation
    (e.g., eye-tracking study), include the criteria in your screener. For example,
    for eye-tracking studies, we include in our screener a question whether the respondent
    uses bifocals, trifocals, or hard contact lenses—if he does, he is ineligible
    to participate. We recommend reviewing your screener by an institutional review
    board (IRB) to ensure that your wording is nondiscriminatory.

    - To learn more recommend reviewing the “Interacting with Diverse Populations”
    chapter in Dumas and Loring (2008).


    # See also


    +   - 4.3 Participant has an unexpected physical feature

    - 5.8 Participant brings a child or pet to the session'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# SURVIVAL STORY: "MY BEST OPTION WAS TO SMILE"

    DORIENNE ROSENBERG


    One of my first moderating sessions was with a participant who was very jovial
    and frank with her remarks towards the website we were testing. The feedback she
    was was excellent and I felt the research team well as the client was going to
    be able to learn a lot from her comments. Approximately three-quarters of the
    way through the one-on-one session, she made a racially inordinate and offensive
    joke about users of the website we were testing. I was highly uncomfortable with
    her comment but was concerned that if I reacted instinctively, I would lose the
    rapport and trust I had built up with the participant. Further concerns I had
    were what the client and my observing colleagues would think if I did not express
    discomfort toward a derogatory comment. I figured that my best option was to smile
    to acknowledge the participant''s attempt at humor and to make her feel comfortable,
    but not to verbally support or oppose her opinion. The participant did not seem
    affected by my response as the rest of the session went very smoothly.


    I question if my choice to smile gave the participant the impression that I agreed
    with her, and if I could have chosen a different response that would still keep
    the session on track, such as changing the subject. Looking back, I realize that
    my choice was the right one, for if I had been open about my distaste toward that
    participant''s joke, I could have compromised the session, lost a data point,
    and wasted the client''s time and money. I am pleased that my choice did not create
    tension between myself and the participant, but realize that the cost of suppressing
    your beliefs can be remorseful and unpleasant.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # Survival Story


    # SURVIVAL STORY: "YOU SURE ARE PRETTY"

    LORIE WHITAKER


    I was conducting one-on-one usability sessions on a hospital website. To ensure
    we were testing the next demographic, my colleague and I traveled to three different
    cities in Texas that served the hospital district. The first two cities went smoothly—all
    participants showed up and were able to attempt/complete the tasks we asked of
    them. However, one incident was that I still remember to this day.


    We were in Round Rock, TX, outside of Austin and it was my turn to moderate. We
    set up in a conference room at our hotel, with my colleague and client in a separate
    room watching the session via a projector and laptop with speakers. We relied
    on the receptionists to meet and greet the participants but they were in no way
    obligated to turn anyone away—instead, they just had to let know when the next
    person arrived.


    I got the notification that the next participant had arrived so I went out to
    greet him. The man I greeted was older, overweight, and had a large 44-oz. mug
    with him. This isn''t unusual for Texas, so I didn''t think of it. I led him back
    to the session room, and as he walked, it appeared to me he was a drunk. Turns
    out, I was only a little right. As he made himself comfortable and I worked my
    way through my introduction, he was smiling at me. This wasn''t out of the ordinary.
    However, the session took a turn when I asked him any questions and he began with
    the “Are you single?” line of questioning. I tried to deflect it, thinking (a)
    it''s not of your business and (b) it''s not about me—it''s about you, the user.
    He was deterred and continued with “You are pretty” and “You have a nice smile.”


    This was the first time it happened to me in a session, but I started wanted to
    we was drinking in the 44-oz. mug! He then went on to tell me, rather proudly,
    while leering at me that he had attended the previous Dallas Cowboys'' football
    game in Dallas (three hours away) and barely made it before he had to come to
    the session. This I thought “This isn''t going well” I couldn''t get him to focus
    on anything but me. So, I decided to fake a technical glitch and said I had go
    to the back room and check on it. I was in the back room, my male colleague that
    he needed to go out there and dismiss him. Pay him if he wanted to, but I wasn''t
    going back out until the guy was gone. My colleague agreed and went to dismiss
    the participant. I watched from the observation room and saw the participant never
    questioned the quality of technology issue and left in a jovial mood.


    A DELICATE TOUCH: ADDRESSING SENSITIVE SITUATIONS


    234'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Survival Story (cont.)


    From this experience, I learned you run in to all sorts of people when dealing
    with running usability tests because you''re dealing with the public. While I
    used a tried-and-true method of getting a difficult participant back on track,
    I learned that when alcohol is involved, you have to use whatever you can think
    of to get the session back on track. When that fails, sometimes it''s best to
    just end the session in a manner that leaves the participant feeling that he is
    drunk and can''t participate. One reason is that we all have bad days. We drink
    a little too much, we''re a bit cranky, or we didn''t get enough sleep the night
    before. One method that has always worked for me is to blame the technology. If
    you can''t steer the session back on track, pretend there is a technology issue
    and the session can''t continue. This allows the participant to feel it was not
    his fault and also allows you to take a chance and bring him in again, if you
    can or want to.'
  merge: -1
  img_proc: true
