- pgno: 109
  md: '# 6.3 Participant is not thinking aloud


    > Even though you asked him to think out loud, the participant is very quiet and
    forgets to share his thoughts or expectations with you as he interacts with the
    product being evaluated.


    Method(s): Usability study

    Frequency: Frequent

    Pattern(s) to apply: Clarify the task/question; Build engagement; Shift the focus


    # What to do


    This behavior may not be a problem for summative studies, when you''re capturing
    usability metrics such as time on task. But formative or more exploratory studies,
    thinking aloud is usually an important part of the process, so you may need to
    draw the participant out of your comfort zone.


    +   Give the participant another moment or before prompting him. He may need to
    process what he is seeing on the screen before verbalizing his reaction to it.
    As discussed in section 2.1, taking this moment may be enough for this situation
    to resolve itself.


    +   After a few moments ask the participant what he is thinking. This cue is usually
    enough to have him think aloud for the rest of the session.


    +   If the participant is persistently silent, remind him to try to think out
    loud as he continues.

    If the participant doesn''t get enough feedback, try to build engagement; draw
    him out with more general questions about what he is doing or what his experience
    is like. For example, you may ask him to compare his experience to other products
    he has used.


    +   If the participant is reluctant, encourage him to think aloud by describing
    what you see him doing. Use the excuse of not being there as motivation to keep
    him talking. For example, "Since I''m not able to see you as you use this product,
    it''s helpful if you tell me what you''re trying to do and what you''re seeing
    is working for you." This will get him to being verbal on the call, and will lead
    to more feedback.


    # What to say


    +   * "What''s going through your mind right now?"


    +   * "What are your thoughts on this?"


    +   * "I''d like to remind you to think out loud as you go through these tasks.
    I know it may feel uncomfortable at first, but it helps understand more about
    how you''re approaching the tasks."'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 6.3 Participant is not thinking aloud (cont.)


    If the participant is remote:


    +   - <Participant>, since I''m not beside you to see when you''re doing certain
    things like clicking, I will ask you to explain to me what you''re doing as you''re
    doing it. If there is anything along the way that you particularly like or don''t
    like about what you''re seeing, let me know that too.


    +   - I can''t see you, so it will be hard to know what''s going on when you feel
    silent. Please remember to think out loud for me as you''re going through the
    tasks. If you''re too quiet, I''ll remind you to think aloud!


    +   - It looks like you tried to <click or do something>. What were you expecting
    to happen?


    # What not to do or say


    +   - Try not to be machine-like when asking participants to think aloud. Paralanguage
    (how you say something) matters. “What are you thinking?” may not roll off your
    tongue comfortably and you may feel (and sound) awkward saying it. Try to use
    a friendly tone and play with wording to find something that sounds more natural
    for you. For example, “What is going through your mind right now?


    # How to avoid


    +   - Explain the value of thinking aloud in the introduction to the test, specifying
    what you''re interested in hearing. For example, “What I mean by thinking aloud
    is, tell me what steps you''re taking, what you''re looking for, what you''re
    trying to do, what you expect to happen, and whether or not what meets your expectations.


    +   - Partway through the study, thank the participant for thinking aloud to confirm
    that he is doing what you asked and encourage him to continue.


    # See also


    +   - 6.5 Participant ignores or pretends to understand your question


    +   - 8.6 Participant is unwilling or unsure'
