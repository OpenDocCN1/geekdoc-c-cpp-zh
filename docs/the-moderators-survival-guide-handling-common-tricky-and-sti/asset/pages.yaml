- pgno: 78
  md: '# 4.6 Participant or others ask you to help


    > You''re onsite to conduct a contextual inquiry. Because they see you as an extra
    set of hands, the participant or your other contacts onsite ask you to pitch in
    with their work, providing training, or help out with something else. Their request
    may start as a quick favor, but they continue to rely on you to help as the session
    is beginning.


    Method(s): Contextual inquiry

    Frequency: Rare

    Pattern(s) to apply: Clarify the task/question; Disengage with the participant


    # What to do


    +   - Clarify your purpose for being onsite and what you want to get out of the
    contextual inquiry. Emphasize that you wouldn''t typically be there to help, so
    you would rather see how the participant handles it on his own.

    - The participant and your other contacts may perceive your session to be something
    informal, especially if you have a preexisting working relationship with them.
    If this is the case, disengage slightly and adapt to a more formal modeling style.
    For example, you might want to take a less social tone, and let them know you
    need to start/resume your planned session goals.

    - If you have the resources available, offer to help after the session is over
    (if there is time) and/or to find them more help.


    # What to say


    +   - "I’m sorry, I would like to help—it looks fun/interesting. But my role is
    to be a neutral outside observer here. If I’m not able to focus on all that I
    need to."

    - "If I helped, you would be dividing labor by what you usually do, so I wouldn’t
    get an accurate depiction of your day-to-day work. I’d rather see what you’d do
    if I wasn’t."

    - "I wish I could of help, but I can’t really leave to <favor asked of you>. My
    role is to sit here and watch <the participant> end-to-end workflow. I’m happy
    to help after, though."


    +   If asked to train:

    - "I’m sorry, my role is not train. It’s the opposite—I don’t want to show you
    what to do! I’m here to sit back and observe the way you naturally do things on
    your own. If we have time at the end, I can try to answer any questions for you
    then."'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 4.6 Participant or others ask you to help (cont.).


    # What not to do or say


    +   - Don''t be offensive or condescending about not helping. Remain professional
    and just explain your viewpoint.


    +   - Avoid helping participants do their work, especially in a business environment.
    Doing so may create liability issues if you give them bad advice and they lose
    or corrupt data. If you''re an expert in the systems used by the participant,
    you may offer some basic tips like shortcuts or ways to be more efficient at the
    end of the session. However, keep in mind that you don''t know all the details
    about their systems, so it may be better to direct the participant to someone
    who is in a better position to help.


    # How to avoid


    +   - While preparing for your field visit, set expectations that you''re there
    to watch the participants do. Iterate this point when you brief the participants
    at the beginning of a session.


    # See also


    +   - 5.1 Participant thinks that she is participating in a focus group


    +   - 5.5 Participant treats a contextual inquiry like an interview'
