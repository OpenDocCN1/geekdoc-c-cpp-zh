- pgno: 71
  md: '# 4.2 Participant either refuses to or can’t d key task (cont.)


    # What not to do or say


    +   - Don’t assume the participant lied about its willingness to do this task
    when recruited. The screener questions could have been poorly worded, or your
    recruiter may have been more lenient than he should have been. Take responsibility
    for any miscommunication.


    # How to avoid


    +   - If you’re making the participant’s compensation contingent on his ability
    to attempt the key task, confirm this task with several times before the session.
    Be as explicit as possible about what he may need to prepare for the session,
    especially if it will involve accessing potentially sensitive information. As
    soon as the session begins, verify that the participant will be able to attempt
    the key task before he signs the consent form (and thus before being recorded
    or observed by others).


    +   - Alternatively, you can avoid conflict altogether and compensate any participant
    who shows up for testing, regardless of whether he is willing or able to move
    forward.


    +   - Despite your best efforts, accept that you may have a participant arrive
    who still falls into this category. Your backup plan may include having backup
    or floater participants available, shifting the focus to a different type of study,
    or setting up a test account that a participant can use to attempt tasks on his
    own. For more discussion on backup participants, floater participants, and backup
    plans, see sections 15.1 and 15.2.


    # See also


    +   - 4.1 Participant does not seem to meet a key recruit criteria

    - 4.4 Participant is unfamiliar with the equipment

    - 6.4 Participant is not able to complete a necessary task

    - 11.3 Participant insists that she would never do so something'
