  md: '# CHAPTER


    # Get on Track:

    Overcoming Momentum Blockers


    Momentum blockers slow the progress of the session, sometimes all the way to a
    full stop. Whether you''re having difficulty understanding the participant, or
    you''re running out of time to accomplish your tasks, this chapter will help you
    figure out the best way to move forward and bring the session back on track.


    +   10.1 Participant starts going on a tangent 175

    10.2 Participant consistently focuses on irrelevant details 178

    10.3 Participant does something very unexpected 180

