  md: '# THE MODERATOR''S SURVIVAL GUIDE


    her instead to describe the last time she had to find a new doctor for herself.
    After she has talked for a bit about something neutral and seems more comfortable,
    you can tie her response into your original personal question. For example, “You
    said that personal recommendations were extremely important in how you found your
    dermatologist. Tell me about if, and how, personal recommendations played a role
