- pgno: 118
  md: "# 6.7 Participant does not have any negative feedback\n\n+   The participant\
    \ seems to be a \"yes-man,\" with one or more of the following characteristics:\n\
    - Seems to be trying to please you or the observers.\n- Likes everything and dislikes\
    \ nothing about the design.\n- In a usability study, completes everything without\
    \ experiencing any problems.\n\nMethod(s): Usability study\nFrequency: Occasional\n\
    Pattern(s) to apply: Take responsibility; Reassure the participant\n\n# What to\
    \ do\n\n+   - If a usability study participant completes his tasks without experiencing\
    \ any difficulties, don't panic! Receiving all or positive feedback is unusual\
    \ but not unprecedented. Do not pressure the participant to come with negative\
    \ feedback. Remember that it is useful to know what works well in a design so\
    \ you can make sure it doesn't get.\n- If the participant seems to have contradictory\
    \ reactions (e.g., struggles excessively with tasks or use of the product but\
    \ loves everything the design), think about what may be in play:\n  - Did you\
    \ forget to mention at the start of the session that participants should be candid\
    \ and provide both positive and negative feedback? If so, find a way to sneak\
    \ that into discussion, even if you need to take responsibility and admit that\
    \ you forgot to say it.\n  - Does the participant think or know what was worked\
    \ on the design, or that the team who designed the product is observing? If so,\
    \ make it clear that everyone wants to hear both positive and negative feedback\
    \ so they can keep what is working and fix what isn't.\n- Is the participant a\
    \ die-hard fan or early adopter of the product and feels it can do no wrong? If\
    \ this seems likely, to draw out things that does not like about the product since\
    \ he may not mention these things on his own. For example, “If you could wave\
    \ a magic wand and change one thing about this product, what would it be?”\n\n\
    # What to say\n\nIf the participant seems to have had a genuinely positive experience:\n\
    \n+   - “If you could wave a magic wand and improve any one thing about this product,\
    \ what would it be? Why?”"
