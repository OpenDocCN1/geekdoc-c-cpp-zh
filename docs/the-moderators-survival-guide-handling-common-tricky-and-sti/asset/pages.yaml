    # What not to do or say


    +   * Don''t point out if the participant hasn''t noticed it on her own.

    * Avoid bothering the designers/developers for making the change.


    # How to avoid


    +   * Discuss your rules ahead of time with designers/developers. We typically
    ask our teams not to make any changes to the prototype or product without consulting
    ahead of time (and even then, we may not agree that the change should be made).
    It''s also important to insist that no changes be made to the prototype during
    a session. Often a “quick” has unexpected consequences consequences. See section
