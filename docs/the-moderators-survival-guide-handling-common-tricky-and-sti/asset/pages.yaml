- pgno: 64
  md: '# SURVIVAL STORY: "THE GROUND STARTED TO MOVE"

    COLIN BAY


    Back when I worked at Fortune 500 company, I was running a usability study in
    one of our labs when I had a real surprise. The participant was in the test room
    and I was on the observation side of the mirror (which was probably a 20-yard
    walk from the participant), speaking through the intercom system while I took
    notes. In the middle of a task, the ground started to move and quickly reached
    peak magnitude. It was a 3.9 earthquake, centered about 10 miles away.


    I should probably explain that I''ve been in many small to medium earthquakes
    before and was well aware that the company I worked for, cautious in the extreme,
    built their factories and office buildings to the most exacting standards of safety.
    In fact, we had recently had an earthquake inspection in which some minor items,
    such as a bookcase in a usually inhabited hallway that was bolted to the wall
    in the right way, flagged as needing urgent attention.


    So when I could tell that the tremors weren''t big, I wasn''t especially worried,
    and have to say, to my embarrassment today, that I kept on taking notes. After
    typing the next sentence or two, I glanced up and was nonplussed to find that
    the participant had disappeared. She was just gone! I finally figured out that
    she had done the smart thing that I hadn''t: ducked under the desk for safety.
    When the shaking was over, I ran down the hallway and into the participant''s
    room to see how she was doing. She came out from under the desk and was clearly
    ready to go home.


    It''s obvious to now that I failed in my primary responsibility of looking out
    for the participant''s well-being. Had that been my first thought, I would have
    grabbed the microphone, ducked under the desk myself, and talked to the participant
    during the earthquake to make sure she was okay and to keep her reassured. But
    at least I was right about ending the session, as the participant was too shaken
    to continue comfortably.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# SURVIVAL STORY: "HIS FRUSTRATION WAS CLEARLY GROWING"

    DAN SEWARD


    I was conducting a task-based usability study for a tourism website with a “general
    public” audience, which left the door wide open for our recruiter. We''d had some
    wacky participants, but the website was testing fairly well and meeting design
    goals. One of our last participants was a soft-spoken mechanic who became embarrassed
    when he was handed a card with a written task description. After looking at the
    card, he mumbled that he didn''t understand the ( fairly straightforward) task.
    Thinking that something was just unclear, I read the task out loud to him and
    he immediately took the mouse and went to work.


    The way he used the website was odd. I didn''t understand some of the navigational
    choices he made. He also began a pattern of verbally giving up on tasks, but at
    first he read well to gentle encouragement and was able to complete most of the
    items in a roundabout way. About two-thirds of the way through a long-hour session,
    his frustration was clearly growing—he was giving up on tasks more quickly and
    changing the subject (repeatedly describing how he used Facebook). As a moderator
    I was getting frustrated with his attitude, but my did best not to show it, and
    gently pushed him back on task. Finally, he looked at me sidemays and explained
    that he ""didn''t read very well,\" and actually apologized for coming to a research
    activity that required reading. We certainly hadn''t specified a literacy level
    in the recruiting brief—only whether someone had a particular amount of experience
    using the Internet."


    Suddenly, our session made a lot less sense. First, I expressed and sincerely
    thanked him for coming in and giving it a try. I expressed the website was designed
    for anybody with Internet access to, and that his feedback was really valuable.
    Offered him one of the remaining tasks, but it was clear from his body language
    (slumped shoulders, dating eyes) that he had thrown in the towel. So I let him
    off the hook a few minutes early; visibly relaxed, and I could see that it was
    a definite.


    The session was valuable. Prior to this session, shamefully, we hadn''t considered
    low-literacy users. Our participant reinforced the value of navigation cues, imagery,
    and video throughout the website, and showed that low-literacy users would likely
    to benefit from some of the descriptions of hotels and attractions. In the end,
    the session was a tricky but useful story.


    Anecdototally, I learned that low-literacy participants are unlikely to disclose
    their abilities without prompting, and that they might need a particular type
    of encouragement to work through testing tasks. And, paradoxically, I learned
    that it might be worth screening for this sort of participant, if your testing
    material is intended for general audiences.'
