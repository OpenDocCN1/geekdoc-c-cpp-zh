- pgno: 225
  md: '# 12.6 You have to point out something potentially embarrassing


    > You notice something that the participant is doing, or that is happening to
    him, that may be embarrassing, especially if he finds out it later on his own!
    For example, a button may have popped off a female participant''s shirt, or a
    participant returned from a bathroom break with unzipped pants.


    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: Take a break


    # What to do


    +   - Turn off your recording equipment, and if you have any observers, bring
    the participant into a private space.

    - Once in a private space where you and the participant cannot be overheard, kindly
    let him know about the embarrassing situation. Then, give him a private moment
    to address the situation, or direct him to the nearest restroom if he may need
    more privacy.

    - If the participant seems embarrassed when he returns to the session, reassure
    him that it''s okay, and make sure he''s comfortable before resuming any recording
    or observing.


    # What to say


    +   - "Excuse, <participant>, I''m going to stop our recording equipment for just
    a moment. Could I ask you to step out into the hall with me"


    Once in a private location:


    +   - "I just want to let you know that <embarrassing situation>, so you have
    a chance to address it before we continue the session."


    # What not to do or say


    +   - Avoid pointing out the embarrassing item while on camera, or in front of
    observers.


    # How to avoid


    +   - While there is no way to avoid this happening, try to do a quick check of
    yourself and the participant before you start recording.


    # See also


    +   - 12.2 Something personal, inappropriate, or confidential is visible'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 12.7 Participant seems upset


    The participant seemed nervous at the beginning of the session, but now seems
    more upset, on the verge of tears. You''ve been sensitive and have been trying
    to help alleviate nervousness and make him feel comfortable, but his emotions
    have escalated.


    Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Take responsibility; Reassure the participant; Take a break;
    End the session early


    # What to do


    +   - Immediately stop recording of the session and let the participant know that
    you''re putting on hold. For example, “I’ve turned off our recording equipment—let’s
    take a short break from these sessions.”


    +   - If you have in-room observers, ask them to leave the room.


    +   - Offer the participant a tissue if you have a box available—you can do this
    without speaking, just by sliding the box toward him. If there is a more private
    room available, offer to bring the participant there.


    +   - Gently ask the participant if he’d like to leave the session early. Let
    him know that he is under no obligation to continue, that you appreciate the feedback
    he has provided so far, and that he’ll still receive his full compensation. If
    he says he wants to continue, go ahead and resume plan to end the session early.


    +   - If the participant is upset by your questions and leaves the building, do
    not follow him. Instead, make sure that he is able to get back in the building
    (e.g., depending on your setup you may have to notify a security desk that he
    may return). If he never returns, follow up with your recruiter to find a way
    to provide the participant with his compensation, and also to thank him for the
    feedback provided.


    +   - If the participant offers a reason for being upset that has to do with the
    session setup (e.g., he’s nervous about being observed by people in another room),
    immediately offer to resolve those issues, and ask him if he’d comfortable continuing
    if those issues are resolved. For example, you may turn off your observation equipment
    for that session. However, as mentioned earlier, remind the participant that he’s
    under obligation to continue and if he’s more comfortable leaving the session,
    he’s free to do so.


    +   - If the participant explains that he’s upset about something outside of the
    session (e.g., a family situation), offer to reschedule the session for a different
    time.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 12.7 Participant seems upset (cont.)


    # What to say


    To talk in private:


    +   - "<Participant>


    +   - "I’ve turned off our recording equipment so no one is able to see or hear
    us now. Let’s take a break for a few minutes."


    While talking in private:


    +   - "I just want to remind you that you’re under no obligation to continue with
    the session. You’ve given us very helpful feedback so far


    +   - "I don’t want to continue the session if you’re feeling upset or uncomfortable.
    You can stop the session at any time, so just let me know. Is there anything I
    can do to help you make more comfortable?",


    # What not to do or say


    +   - Do not ignore the participant’s emotional state!


    +   - Don’t touch the participant, even if you think a pat on the shoulder or
    a hug would provide comfort! Touching a participant violates ethical boundaries
    and may make the situation worse since you don’t know how a stranger will react
    to being touched.


    +   - Don’t directly say, “Why are you upset?” even if you’re curious. This might
    make the participant feel like you called him out, which can make the situation
    worse.


    +   - Try not to have the participant make a decision about continuing the session
    in front of observers.


    # How to avoid


    +   - Situations like rarely come from nowhere. Nervous or uncomfortable participants
    may become so throughout the session if their concerns are not accommodated. Be
    responsive and aware of your participant’s emotional state throughout the session
    and react quickly to any signs of emotional distress. This awareness and quick
    action will help keep a situation from deteriorating to tears.


    +   - At the beginning of the session, genuinely reassure the participant that
    he’s not being tested. This comfort can be effective even for a participant who’s
    distracted by external circumstances.'
  merge: -1
  img_proc: true
