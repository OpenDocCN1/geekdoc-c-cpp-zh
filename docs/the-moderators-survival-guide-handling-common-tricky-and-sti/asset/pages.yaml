- pgno: 87
  md: '# 5.3 Participant has different expectations for the compensation


    The participant thought that she was receiving either a different amount for compensation
    (e.g., $100 instead of $75) or a different format (e.g., cash instead of a gift
    card). She may get very upset about this misunderstanding and feel like she was
    lied to.


    +   Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility


    # What to do


    +   - Address this issue as it comes in. Ideally, a participant will notice the
    discrepancy at the beginning of the session when she signs the consent form (which
    should explicitly state the compensation she''ll receive for participating). But,
    if it comes up later in the session, address it right away instead of waiting
    until the end.


    +   - If there is a way to provide the compensation in a different format, and
    the participant is insistent on receiving it that you, go ahead and make the adjustment
    if you can (and if there are no issues from a legal perspective for your organization—some
    organizations require that compensation be handled in very specific ways).


    +   - If the participant is insistent that the recruiter promised her a different
    amount, apologize for the misunderstanding and ask if she has something documenting
    that amount, such as a confirmation letter, email, or voicemail. If there indeed
    a mistaken promise, find a way to give her the promised amount even if it''s different
    than what you compensated else. Immediately, follow up with the recruiter (if
    applicable) to see if this was a mistake that happened with other participants
    as well. Follow the earlier recommendations for what to do.


    +   - If the participant is expecting a different amount because she knows other
    people who participated received that amount, go ahead and make the adjustment
    if the inconsistency is an oversight on your part. If the other participants were
    doing something distinct from this session (e.g., had 1.5-hour sessions instead
    of 1-hour sessions), apologize and explain the discrepancy to the participant.


    +   - Be prepared to explain any compensation formats that a participant may be
    unfamiliar with. For example, if we provided participants with American express
    cards, we should spend a few minutes explaining how those cards work and can be
    used.'
