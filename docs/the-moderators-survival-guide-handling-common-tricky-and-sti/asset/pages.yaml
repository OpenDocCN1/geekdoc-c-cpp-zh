- pgno: 245
  md: '# 13.5 Participant does something awkward or uncomfortable


    At some point during the session, the participant says or does something that
    makes you uncomfortable. She may ask you to touch her pregnant stomach or if she
    can take her shoes off. Or may she lies down on a couch in the study space. These
    are just a few real-life examples of countless “Did that just happen?” moments
    we’ve encountered and heard about. These actions and requests are somewhat benign—not
    quite dangerous or crazy—but awkward and uncomfortable nonetheless.


    ```

    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: Take responsibility

    ```


    # What to do


    +   - If the request or action is strange but won’t get in the way of the session
    (e.g., taking offs), let the participant to avoid any further awkward interactions
    about it.

    - If it’s strange personal request or something that would be more disruptive,
    politely decline. Try to place the blame on yourself, your study setup, facility,
    policies, or anything so that the participant doesn’t feel bad or stupid for asking.
    It may be a slight stretch of truth, but will help maintain a connection with
    the participant. For example, if the participant asks you to touch her pregnant
    stomach, tell her there’s a no-touching policy at your organization. If the participant
    starts showing you pictures of a celebration with a wardrobe malfunction, remind
    her that the session and screen are being recorded and that there is a lot to
    cover in the remainder of the session.

    - You can also use humor if you are comfortable doing so as part of your explanation.
    Remember to keep it tasteful, and make sure that humor cannot be misinterpreted
    making fun of the participant. For example, if the participant lies down on the
    couch, you can gently say, “If this were a sleep, I’d bring you a blanket and
    pillow, but for now, I actually need you to sit over here in front of the computer
    so we can get started!”


    # What to say


    +   - “I’m sorry; our policy is to not let guests <do that>. Are you okay to move
    forward with the session?”

    - “For the sake of today’s study setup, I actually need you to <describe what
    you need to do>.”

    - “I’m sorry, but we don’t usually let anyone <do that>. Let’s get back to...."'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 13.5 Participant does something awkward or uncomfortable (cont.)


    # What not to do or say


    +   - Don''t shield the participant or do anything to make her feel inadequate,
    or that would make her more nervous about participating.

    - Don''t laugh or make fun of the participant, even if her request or actions
    seem ridiculous to you. She may just be trying to be friendly, or is making herself
    comfortable.


    # How to avoid


    +   - It''s hard to see these situations coming! Approach each session with a
    sense of humor so you can roll with the unexpected.


    # See also


    +   - 13.1 Participant curses or makes inappropriate comments

    - 13.4 Participant flirts with you

    - 13.6 Participant makes a strangely specific request

    - Survival Story: "She tipped me ... big!"'
