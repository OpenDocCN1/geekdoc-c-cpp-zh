    more about your compensation decisions), you might see if there is a way to adapt
    the session to include the participant''s feedback, or shift the focus of the
    session entirely to another method. To decide this, see if the participant''s
    actual qualifications would be useful for your research. For example, based on
    your research goals, you may know that talking to a novice manager will provide
    useful feedback even though your target for recruiting experienced managers. If
    your stakeholders are observing in person, you should take a moment to discuss
    this them privately. Especially if your project has time or budget restrictions,
    you may not have a chance to replace the participant with someone who''s a better
    fit. Be prepared to argue the case for your observers as why the participant may
    yield useful and valid data.


    +   If you need to let the participant go and not proceed with the session, consider
    being candid about why you might be appropriate if the criteria were role-based—for
    example, “I apologize for the misunderstanding. For the purpose of this study,
    we will need to talk with managers who have direct reports.”—or any other reason
    why the participant'
