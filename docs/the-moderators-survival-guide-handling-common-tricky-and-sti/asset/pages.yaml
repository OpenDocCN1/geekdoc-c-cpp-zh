- pgno: 33
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    with your questions. Also, consider the example of a usability study participant
    who becomes confused or frustrated. A delay of a few extra seconds is often enough
    time for a participant to find his bearings and continue without intervention
    from you. This delay may also be all a distracted participant needs to reengage
    with a task or question on his.


    +   - If the situation persists, additional seconds will keep the participant
    from seeing you sweat (in a remote session, hearing you fumble your your words
    as you try to figure out what to do). Remember that, as the moderator, you establish
    the place for the session. Take this moment to think through your options and
    prepare what you''re going to do and say if your situation continues.


    This moment may feel like a lifetime to you, but it doesn''t necessarily feel
    that way to the participant! Even in a potentially life-threatening situation
    (e.g., a fire alarm goes off), take a moment to gather as much information as
    possible before proceeding. Your need to appropriately outweigh your instinct
    to react immediately. Remember that you''re responsible for the participant''s
    well-being as well as your own.


    Think of this moment as securing your oxygen mask before assisting other passengers.


    If the situation is especially tense or you''re not sure what''s going on, you
    may want to take your moment in another room, away from the participant. Taking
    a break is an incredibly powerful tool that we''ll discuss more in section 3.7.
    A break gives you a chance to think about what''s happening in the session without
    the pressure of monitoring everything. If you have observers, you can use this
    break to check with them and get a "gut-check" on what you think is happening
    and why. The participant may also benefit from a few minutes to cool off, or deal
    with their distractions.


    Table 2.2 shows examples of what you can say if you need to take a break. Note
    that you can use these phrases if they aren''t entirely true—consider the mild
    deceptions for the greater good. Pretexts are discussed further in the sidebar
    "Using a Pretext."


    | For a usability study with a multiuser setup |

    | "We''re at a good stopping point right now. Let''s take a short break and resume
    the session in five minutes." (If appropriate given your setup, you can add: "Feel
    free to leave the room to get a drink or go to the restroom while I''m gone.")
    |

    | For an onsite and remote sessions:

    | "I''m sorry, but would you mind if I took a quick-minute break to get a drink?"
    |

    | "This seems like a good stopping point. Why don''t we take a quick-minute break?"
    |


    Table 2.2: What to Say: Taking a Break.


    22'
