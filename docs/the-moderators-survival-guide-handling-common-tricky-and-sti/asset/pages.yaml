- pgno: 11
  md: '# INTRODUCTION


    # Why we wrote this book


    Throughout the years that we''ve known each other, we''ve spent a lot of time
    thinking talking about the unique challenges of moderating user research. In the
    usability lab between sessions, driving to and from field visits, at professional
    meetings, and in the local coffee shop, we picked each other’s brains. We shared
    stories about our experiences with participants, approaches that our colleagues
    used, and any recent research on moderating techniques (the latter always felt
    lacking). A book on this topic has been percolating for quite a while because,
    as you can probably guess, we’re big moderating geeks.


    When we started to mentor new user researchers, we found ourselves sharing tips
    on more than just how to moderate, how to handle anything that comes up during
    a session including what to say in those situations. Even the most experienced
    researchers struggle to balance the competing and ever-changing needs of a session,
    which means less experienced researchers are often thrown off-balance by the unexpected
    and as well expected.


    While there are a lot of resources on how to plan user research and how to be
    a good moderator, there is little written about how to handle unexpected, tricky,
    or sticky situations that occur during a user research session. Although we’ve
    seen hints of these guidelines in the literature and heard them in conversations
    with colleagues, we found almost nothing that codified this topic. Loring and
    Patel (2001) wrote a great paper about handling awkward usability testing situations,
    but we wanted something that went into more detail and incorporated other types
    of one-on-one user research. The closest full-length work we’ve found is Moderating
    Usability Tests by Dumas and Loring (2008), which is an important, helpful, and
    well-written book about moderating fundamentals. If you haven’t read it already,
    we recommend that you do in conjunction with this book!


    We wrote this book as a survival guide for anything that comes your way during
    a user research session. Our focus is on actionable and specific steps that you
    can take—including many examples of what to say—and how to decide what’s best
    for your situation. We also want to start a conversation about these topics and
    help encourage more mindful moderation.


    # Who this book is for


    This book will be most useful for anyone who performs one-on-one user research.
    These roles typically include user researchers or other related professionals
    or students involved in the design and evaluation of systems or experiences.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'We''re assuming that you already know the basics moderating and running a user
    research session. You should also be familiar with logistical responsibilities
    such as recruiting participants, creating clear and informed consent forms, and
    welcoming the participant when he arrives for his session. If you need a refresher
    on the fundamentals, Appendix B lists some helpful resources for getting up to
    speed.


    Beyond that, it doesn''t matter whether you''re a new moderator or a seasoned
    veteran; believe there are nuggets of wisdom and food for thought in this book
    for everyone.


    # What you''ll learn


    Our goal is after reading this book, you''ll be inspired and empowered to make
    the best decisions for you, the participant, and your research. In many cases,
    your decisions will come down to “it depends” (as so many things in research),
    but we will help you think through and accommodate the things decisions depend
    on in various types of situations. This book should be a quick, handy resource
    for you—think of it as your Swiss Army knife that you can employ.


    You''ll learn the steps involved in making these decisions and taking the appropriate
    action, including:


    +   What to consider any time you encounter a common, unexpected, tricky, or sticky
    situation.


    +   How to approach the situation and adapt your response as necessary depending
    on the study type, study goals, and the participant''s comfort level.


    +   What kind of things you can say to help address the situation.


    You can see specific examples of these principles in Part 2. In these chapters,
    we describe the spectrum of situations that you may encounter, ranging from the
    very common to the very rare. Note that we focus only on situations that occur
    during a research session and exclude any interactions that may occur in study
    preplanning, between sessions, or in postsession or poststudy debriefing. (That''s
    enough material for another book!) Obviously, we can''t provide a comprehensive
    list of every possible situation that you might encounter. At the same time, some
    of the situations listed here may never happen in your career. Essentially, these
    situations were selected to highlight how your responses need to adapt depending
    on what''s happening around you.


    Through these examples you can envision what you might do in similar situations.
    Even if you never encounter, say, an earthquake during a session (and we hope
    you don''t), reading up on what to do in that situation will hopefully bring awareness
    and consideration for how to handle other types of emergencies.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# One-one-user research methods


    This book focuses on user research methods where a moderator is interacting with
    a single participant, typically as an evaluation of or conversation about a product.
    We cover situations that occur during in-person sessions (with the participant
    and moderator in the same location) and remote sessions (with the participant
    and moderator in different locations).


    The three methods that we refer to:


    +   * *Usability studies.* During a usability study, you watch a participant as
    he attempts to complete tasks using a product (or a prototype of a product). The
    goal of a usability study is to evaluate how easy or difficult that product is
    to use.


    +   * *Contextual inquiry.* During a contextual inquiry, you observe the participant
    in his native environment and ask him to show how he does something. The participant
    guides the session, but you ask questions to clarify and validate his observations.
    The goal of a contextual inquiry is usually to gain a deeper understanding of
    the user''s process, including what the user find important and necessary.


    +   * *Interview.* During an interview, you ask a participant a series of questions.
    The goal of an interview is to gather detailed information from participants about
    a specific topic or set of topics. User research interviews, as opposed to market
    research interviews, usually focus on the participant''s experience using products
    with the goal of collecting requirements and feedback to improve the product or
    experience.


    # Language used in this book


    For the sake of simplicity, we''ve made the following terminology choices that
    you''ll see throughout the book:


    +   * *Product.* The product, prototype, or service being evaluated as part of
    the user research. It can be a computer system, mobile device interface, physical
    product, or a process. In a usability study, the product can be in the form of
    a low- or high-fidelity prototype or live environment. Basically anything and
    everything is fair game—as long as it''s the focus of the user research.


    +   * *User researcher.* Synonymous with user researcher. This refers to you,
    the moderator, even if your title is something else.


    +   * *Your organization.* If you''re an employee of the organization (e.g., company
    or business) that you''re doing research for, your organization refers to your
    employer. If you are a consultant working on behalf of a client, your organization
    refers to your client.


    +   *Study and session.* A study is made up of a number of sessions with participants.
    For example, a usability study of a product might include six individual sessions
    with participants. We commonly refer to sessions in the context of being back-to-back
    in a full day, but sessions could also intermittently span the course of many
    days or weeks.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   Study plan. The moderator''s guide, study protocol, or test script that
    a user researcher puts together for a study and follows for each session. This
    can be as formal as a 10-page typed document or as informal as a few handwritten
    notes on a piece of notebook paper.


    +   Stakeholders. Your stakeholders are key decision makers. If you''re a consultant,
    your stakeholders are your clients. If you are an in-house researcher, your stakeholders
    could be business partners, developers, project managers, and anyone else you
    need to work with as closely as you design your study. We refer to stakeholders
    when we''re talking about decisions for your study.


    +   Observers. Observers include your stakeholders and anyone else observing the
    session, whether they''re in the room with you, in another room (e.g., in a usability
    lab), or remotely. We refer to observers when we mean anyone watching the study.


    +   He/she. For ease of reading and quality for all, use pronouns throughout this
    book between “he” (this introduction and even-numbered chapters) and “she” (oddnumbered
    chapters). Please keep this arbitrary rule in mind when reading, as the situations
    don''t have implicit gender-based assumptions. Every situation could happen with
    any combination of male and female moderators and participants.


    # How this book is organized


    This book is structured in three parts.


    Part 1 discusses your responsibilities as a moderator, provides high-level guidelines
    for handling situations during a session, and introduces moderator patterns. This
    part is broken into traditional chapters that you may want to read in their entirety.


    Part 2 takes the principles from Part 1 and applies them to over 90 situations,
    grouped by topic. Each situation stands on its own, so Chapters 4-14 do not need
    to be read end-to-end. You can look up particular situations, browse through types
    of situations, or read a bunch at a time. Each situation is organized the same
    way:


    +   Description—what is the situation


    +   Method(s)—the type of method that this situation occurs in (usability study,
    contextual inquiry, interview)


    +   Frequency—how often a moderator might encounter this situation (frequent/occasional/rare)


    +   Pattern(s) to apply—which moderation patterns may be appropriate and helpful


    +   What to do—instructions for how to react and resolve the situation


    +   What to say—specific wording guidelines for talking with the participant


    +   What not to say or do—pitfalls to avoid'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'How to avoid—tips to minimize the chance of this situation happening or, if
    that''s not applicable, tips to help prepare you for the situation


    See also—cross-references to other situations that are similar to this one


    Part 3 offers tips on how to minimize the chance of certain types of situations
    occurring and how to sharpen your moderating skills, no matter your experience
    level!


    The appendices include a handy aggregated checklist of the most useful phrases
    a moderator can use during a session and a list of things that you can do before
    a session to minimize the chances of something unexpected or sticky happening.
    These checklists are also available on our website (http://www.modssurvivalguide.org).


    Here is a detailed breakdown of what each part of our book covers:


    # Part 1: Your Moderation Toolkit


    Chapter 1: Moderation Matters: Power, Responsibility, and Style. This discusses
    the qualities that are most helpful for a moderator during a research session
    and the different moderating styles that you can choose depending on the needs
    of the session.


    Chapter 2: In the Trenches: Six Steps for Handling Situations. This chapter provides
    a high-level view of the steps you should take to understand what type of situation
    the participant is dealing with and respond appropriately.


    Chapter 3: Mix and Match: Your Moderation Patterns Toolbox. This chapter defines
    specific steps that you can take to change the course of a session and when each
    pattern works best.


    # Part 2: Your Survival Mishaps


    Chapter 4: Recruiting Participants You W''t Expecting. This chapter covers situations
    where the participant does not fit your recruiting criteria or has some other
    feature that makes proceeding with a session challenge.


    Chapter 5: Participant Misconceptions: Not What the Participant Was Expecting.
    This chapter covers situations where there is a mismatch between the participant''s
    expectations for the sessions and you''ve planned.


    Chapter 6: Some Guidance Required: Participants in Need of Sherding. This chapter
    covers situations where the participant or your observers are not fully engaged
    with the session or require some other type of guidance to ensure that you get
    the feedback you need.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Chapter 7: Make It Work: Handling Technical Obstacles. This chapter covers
    situations where you encounter challenges with the technical setup, including
    prototype and remote session difficulties.


    Chapter 8: Is This Right? Responding to Uncertain Participants. This chapter covers
    situations where the participants seem hesitant or unsure about their feedback.


    Chapter 9: What''s Going On? Recovering from External Interruptions. This chapter
    covers situations where your session is interrupted by an observer or someone
    else.


    Chapter 10: Get on Track: Overcoming Momentum Blockers. This chapter covers situations
    that can slow down your session or throw it off track.


    Chapter 11: Take the Wheel: Guiding Wayward Participants. This chapter covers
    situations where the participant becomes defensive or attacks you or the product.


