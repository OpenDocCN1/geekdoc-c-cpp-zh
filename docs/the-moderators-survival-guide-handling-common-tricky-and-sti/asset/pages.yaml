- pgno: 111
  md: '# 6.4 Participant is not able to complete a necessary task


    > You''re conducting a usability study where tasks are interdependent—that is,
    one task needs to be accomplished before moving forward with the other tasks.
    Or, within a particular task, the participant must find or do something to reach
    the other areas you need feedback on. The participant is not successful at one
    of the dependent parts, which means that you need to provide a way to get him
    to those areas.


    Method(s): Usability study

    Frequency: Frequent

    Pattern(s) to apply: Clarify the task/question; Redirect the participant


    # What to do


    +   Decide how and when to give the participant assist. Time permitting, try to
    allow the participant to keep working on his own for a bit to see if he-corrects.
    If the participant has not self-corrected, give him a broad or vague assist, followed
    by more specific ones if needed. Thinking of it as a funnel slowly leading the
    participant to the desired location if he can''t get there on his. For example,
    the participant is using a mobile device to look for a place to change a setting
    for his email account. He keeps overlooking the Settings and navigating elsewhere
    to do it. For example, you might say, “What if I were to give up, you to tell
    you that there is a way to do that from the Settings?” It gives him broad direction
    but isn''t pointing out anything specific. If he still can''t find it, you might
    point him toward a specific area of the Settings. Ultimately, you could point
    the particular link that you need him to select.\When you need to point out a
    specific area to the participant, find a way to do that it doesn''t make the participant
    feel stupid or embarrassed. In the previous example, if you finally have to point
    out the “Email Settings” button, you might say something like, “This has been
    helpful seeing where you were expecting to find that option. I''ll just point
    out this button here. What do you think about where it''s located?” By providing
    this direct assist:

    * You acknowledge that what he did up until this point was wasteful.

    * You allow the session to proceed.

    * You reassure the participant that he is there to help evaluate the design.

    Be careful with the feedback you get immediately following a direct assist—participants
    will often say something snarky like, “Well, obviously I didn''t find it if it''s
    not intuitive,” or become overly accommodating and say, “Now that I know it''s
    there, that is fine.” Asking for the participant’s feedback here more about his
    emotional well-being during your data collection.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 6.4 Participant is not able to complete a necessary task (cont.)


    +   - We also like to use a stealthier tactic in situations like this. For a detailed
    description, see the Chapter 3 sidebar “The Diversionary Assist.

    - Another option is to set the product to the necessary state yourself while the
    participant’s not looking. For example, you can pass the screen-sharing with a
    remote participant, or have an in-person participant look away briefly so you
    can do whatever needs to be done. This avoids the complications of a direct assist,
    which can be awkward, especially if you need to ask the participant to look away.
    Gentle humor and a smile can make this less awkward, for example, “I know this
    sounds strange, but I need you to look away for a few seconds while I reset the
    prototype for your next task"


    # What to say


    For an initial vague assist:


    +   - “What if I were to tell you that...”

    - “I’ll just let you know there is a way from here to do that....


    For a direct assist:


    +   - “Let me draw your attention to this area. What are your thoughts on it being
    here?”

    - “I’ll point out that you can find functionality. Talk to me about this versus
    your expectations.”

    - “It’s good to see your thought process in doing that. I will just let you know
    there is actually a different way of doing that task. I am curious to know what
    you think of it” <point him to correct way>.


    For a redirect as part of a diversion assist:


    +   - “Let’s move on now. I wanted to ask you about what you did earlier.”

    - “Why don’t we stop this here, because I wanted to ask you about...."

    - “Let’s stop this here and we can come back to it. Read the next scenario....”


    # What not to do or say


    +   - Try avoid asking, “Did you notice this link?” when the participant obviously
    hadn’t. It can work in a pinch with nothing to say, but it often makes the participant
    feel a little uncomfortable.

    - Avoid saying anything implying there is a correct answer. For example, “What
    you’re looking for is here” or “This is the right answer.”'
