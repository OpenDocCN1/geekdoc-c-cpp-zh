  md: '# 6.9 Observers are not engaged in the session


    The observers are obviously not engaged in the session you''re running. They may
    be checking their email, working on other projects, or having side conversations.
    When you ask for their feedback on an issue (outside of the participant room),
    or check to see if they have any questions, they are so disengaged that they''re
    unable to provide anything helpful.


    ```

    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility

    ```


    # What to do


    +   - If the observers are in the same room as you and the participant, you may
    need to take a short break so you can ask them to pay more attention to the session.
    Remind that the participant''s feedback is valuable and he needs to feel comfortable
    to provide it. A disengaged observer in the room distract from this.

    - Provide ways for observers to take ownership over the session result. Ask them
    to track the usability issues they see during the sessions, and review their findings
    with them after each session. Post the list they create it so it is constantly
    visible for all the observers. For more ideas on how to involve your stakeholders,
    refer to It''s Our Research (Sharon, 2012).

    - Encouraging engagement from remote observers can be more challenging. However,
    you can do something similar to this recommendation by asking each observer to
    keep track of the issues they see during sessions, and running quick debriefs
    after each session the observers can share their findings. If some of the remote
    observers are in the same location, recommend that they get a conference room
    so they can watch the sessions together and create a unified list of their findings.


    # What to say


    +   - “How do you think the sessions are going so far? Have you seen or heard
    anything that was surprising?"

    - “During this next session


    # What not to do or say


    +   - Don''t lash out at the observers. While it can be very frustrating to know
    that your work is not being observed (or actively appreciated), recognize that
    most people are busy and that'
