- pgno: 270
  md: '# 14.9 Participant doing something illegal or threatening


    > At some point during the session, you realize that the participant poses some
    kind of threat to your well-being and that of others at your location. You may
    notice that the participant is stealing items from your facility. Or, the participant
    may seem unstable or potentially violent and you no longer feel comfortable proceeding
    with the session.


    Method(s): Any in-person method

    Frequency: Rare

    Pattern(s) to apply: Disengage from the participant; Take a break; End the session
    early


    # What to do


    +   * If you feel that a participant may be unstable or a danger to you or others
    (e.g., paranoid, violent, extreme mood swings), trust your gut and end the session
    as quickly as possible. We strongly recommend that you use your instinct when
    it comes to potential warning signs—again, your safety is more important than
    gaining an additional data point.

    * If you do end the session immediately, for your safety, try to do so in a subtle
    way that doesn''t make it obvious that it''s due to his behavior. For example,
    wait a couple of minutes and use a pretext such as technical difficulties with
    the product or not having the right study materials.

    * If the participant is doing something illegal, take a break as soon as you can,
    again citing a pretext as a coworker or observer to alert the appropriate authorities
    (police, security, etc.) to the situation. Depending on what the participant is
    doing (or has done), you may ask the authorities to be aware as the participant
    leaves the facility, or you may ask them to confirm the participant (to regain
    stolen goods). Follow the guidance provided by the authorities when you describe
    the situation.

    * Once you have some kind of backup available, end the session with the participant.
    Provide him with her compensation to keep the session proceeding normally as much
    as possible from his perspective.

    * Do your best to look and sound neutral when interacting with the participant,
    even if you''re scared or nervous.

    * Remember that you need to look out for your comfort and safety, so if you''re
    not comfortable for any reason, end the session.


    # What to say


    To the participant, to end the session:


    +   * “’m sorry, but we have to end the session early due to some problems with
    our equipment. Thank you so much for coming in—here’s your compensation. Let me
    walk you out.”


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_270_0.png)'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 14.9 Participant is doing something illegal or threatening (cont.)


    To police or security:


    +   - This is <name> in <location>. I''m running a research study with a participant
    and I''m worried about my safety because of what the participant is doing. <Describe
    the participant''s actions or behavior> I am going to end the study, but I want
    you to be aware of what''s happening. Do you have any recommendations on what
    I should do?


    # What not to do or say


    +   - If at all possible, avoid the situation on your own (e.g., by confronting
    the participant about what he has done). These rare scenarios are one of the main
    reasons we recommend never performing research alone.


    # How to avoid


    +   - Have all emergency numbers posted and ensure any observers and team members
    know where those numbers are located.


    +   - If you have onsite security at the facility where you''re performing research,
    let them know ahead of time that you''re running a research study. This way, if
    you need to contact them in case of emergency, they will already have some knowledge
    about who you are and what you''re doing.


    +   - Check with your building''s security team about any policies they have about
    weapons, as they may have specific procedures to follow if you notice an armed
    participant.


    # See also


    +   - 14.8 Participant''s environment contains dangerous items'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# SURVIVAL STORY: “WE DIDN’T KNOW MUCH ABOUT THEM"

    BOB VIRZI


    We were doing a usability evaluation of some home networking gear. We had completed
    a series of lab studies, but our customers were still reporting problems with
    the installation in the field. In response, we initiated a field study where we
    observed customers attempting to install the equipment in their homes.


    When we contacted people to participate in the study we explained that the interview
    would be conducted in their home, using their equipment, and they would be expected
    to try to install the networking gear while we observed. We collected some information
    from them like their age and type of equipment, but other than that, we didn’t
    know much about them. We always sent two for safety and liability reasons, usually
    two usability experts. But in this case it was one usability expert (a man in
    his twenties) and a business partner (a woman in her late fifties).


    They arrived at the home of the participant, a man in his thirties, and were brought
    to his study where his computer was. Apart from a generally messy room, the other
    thing that was striking to the researchers was that the walls and the home screen
    of the computer were plastered with porn. While the two researchers were dumbfounded
    at this casual display of sexually explicit material, our interviewee was not
    at all off and seemed to think everything was normal. After a quick private conference,
    researchers decided the participant seemed genuinely interested in participating
    in the study and, apart from his sensibilities about what is appropriate content
    for wall art, appeared to be a reasonable test participant. As a result, they
    went ahead with the session.


    A few takeaways from this are, (1) that is why we send people out to homes in
    pairs, (2) you need to be prepared for anything when you enter an unknown person’s
    home, and (3) trust your gut—if it doesn’t feel right, get out of there quickly.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # Survival Story


    # SURVIVAL STORY: "I KNEW WHAT IT WAS LIKE"

    JACQUELINE STETSON PASTORE


    I was working on an ethnography project with a pharmacology client, designing
    software to manage the development of tumor models. To do my job correctly I had
    to go into the labs where scientists performed their tumor research on see where
    the work was being done.


    I also point out that I had a brain tumor as a teenager and had surgery to remove
    it. As the date for the lab visit came closer and closer, I felt a strong bond
    with the mice I hadn''t met yet I knew what it was like to have a tumor cut out
    of you. I was nervous about seeing the racks of animal cages. I myself by the
    thousands, sitting in little boxes and growing tumors to be removed. Also, I am
    a flaming animal lover and on-off-again vegetarian who can''t bear to see blood
    or needles, so I honestly didn''t know if I would be able to handle the lab.


    The day came for our first lab visit. We tagged along behind a few of the scientists
    to learn what their typical day was. When it came to prepare for the lab, they
    showed how to put on the jumpers, hair nets, safety goggles, boots, and gloves.
    We would have to double-glove-and-bottle once we entered the work room.


    Because I know that I am nimble about animals, I had to be careful not projecting
    my personal beliefs during the sessions. When I saw the first surgery, my nerves
    got the better of me and I got a bit wiggly. I thought about the strategies they
    trained us—where the trash can vents and how to exit the lab by stepping into
    certain areas and removing boots and gloves. I reminded myself what I felt like
    observers: you''re an alien in a strange world and you have no preconceived ideas.
    You''re to learn and do your job. So I marched over the air conditioning vent
    and got cold air blown on my head. This cleared my head and I was ready to focus
    again.


    After watching a few surgeries to make sure I understood the ergonomic and workflow
    concerns, I positioned myself to focus on the scientists'' faces so the surgical
    area was out of my view. We had to use iPhones and iPads to take notes notebooks,
    pens and laptops were not allowed. However, once we were in the lab, we discovered
    that touch devices work when you''re double-gloved. Since we were not allowed
    to use recording devices, we solved this by doing debrief sessions immediately
    afterwards to write down everything we saw. All in all, it was an amazing experience.
    I was lucky to be able to go into a lab and help design software that may cure
    diseases one day.


    SAFETY FIRST: MINIMIZING EMOTIONAL AND PHYSICAL DISTRESS


    276'
  merge: -1
  img_proc: true
