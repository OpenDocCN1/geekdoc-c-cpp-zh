- pgno: 239
  md: '# 13.2 You know the participant, or the participant knows you (cont.)


    +   - “I''m sorry, but I really want to get your feedback on <topic>. Let''s finish
    catching up once we''re done, if you''re able to stick around for a few extra
    minutes.”


    # What not to do or say


    +   - Don''t pretend that you don''t know the participant—this may frustrate and
    confuse her, and keep her from providing valuable feedback.


    +   - Don''t use your session time to catch up with the participant. Stay professional
    and focused on your research goals.


    # How to avoid


    +   - Monitor the list of participant names provided by your recruiter, and if
    you see anyone recognize, plan ahead of time for someone else to moderate the
    session if possible.


