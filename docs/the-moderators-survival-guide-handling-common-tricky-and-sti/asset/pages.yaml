- pgno: 286
  md: '# Provide ground rules


    Another way to avoid or minimize observer interruptions is to provide a set of
    ground rules for observer behavior during a session. You should share these ground
    rules with your observers before the session so they have a chance to read them
    ahead of time. Also, print the list of rules and give it to your observers if
    they''re in the room during the session, or post the rules on the wall of your
    observation space.


    Here are some ground rules for observers in another room (e.g., usability lab
    observation room):


    +   - Keep any conversation or discussion to a minimum. No loud laughing! Even
    soundproofed walls can be permeable.


    +   - Keep the participant''s identity and personal information (e.g., company)
    confidential, especially if an observer knows her personally. The observers should
    also refrain from revealing the identity to others.


    +   - Avoid making fun of the participant.


    +   - Keep cell phones silent (not on vibrate).


    +   - Leave the room quietly if a call must be taken.


    +   - Avoid slamming doors.


    +   - Avoid talking about the research study outside of the observation room for
    as long as the sessions are running. This includes not talking to the participant
    about the study if observers run into her in the hallway or restroom before or
    after the session.


    +   - Stay for an entire session, and attend as many sessions as possible.


    +   - Follow agreed-guidelines for asking questions to the participant. These
    guidelines should be based on a conversation you had with the observers before
    the session and should cover if, when, and how they can ask questions. However,
    be careful with expectations that you may not get to ask their questions, or ask
    their questions in the way they posed.


    +   - Follow agreed-guidelines for how to communicate with you. Again, these guidelines
    should be based on a conversation you''ve had before the session about if, when,
    and how to get in touch during the session. For example, you may set the expectation
    that if they see something that isn''t working in the prototype, they can quickly
    knock on the door of your study space so you can excuse yourself and talk to them,
    but otherwise they should hold their questions until you talk to them toward the
    end of the session.


    +   - If you''ve asked them to take notes or help in other way with data collection,
    include a short summary that observers can refer to throughout the session.


    When an observer is in the room with you and the participant, most of the previous
    points apply. Some exceptions and additions include:


    For example, may want to set up an instant message (IM) session where observers
    can send their questions to. Section 9.5 includes additional options for gathering
    observer questions.'
