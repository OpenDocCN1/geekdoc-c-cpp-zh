- pgno: 30
  md: '# SURVIVAL STORY: “THE CHAIR’S ARMS WERE TOO FIXED AND NARROW”

    NICOLLE DIVER


    Couple of years ago, I was conducting a usability study on a financial services
    website in a traditional lab setting. The lab was set up with two rolling office
    chairs next to each other and facing a computer with a prototype of the website
    we were testing. The participant, Greg, was a very large person. Greg entered
    the room and attempted to make himself comfortable in one of the rolling chairs.
    Unfortunately, the chair''s arms were fixed and too narrow for Greg to sit back
    in the seat. Greg awkwardly sat on the front edge of the chair and waved hello
    to the team of observers behind the one-way mirror.


    Greg provided helpful feedback, but appeared nervous throughout the interview.
    We questioned if the feedback he was offering was helpful and second-guessed some
    of his answers. As we approached the final third of his session, Greg used his
    arms as leverage against the table to adjust his position. The rolling chair shot
    out from underneath, leaving Greg flat on his back on the floor! Instantly embarrassed,
    I asked a mortgage if he was hurt and jumped out of my chair in an attempt to
    help as he stood up. By the time a colleague rescued us into the lab from the
    observation room, Greg and I were setting ourselves back in our chairs at the
    desk. At this point, I was keen to end the session, but it was clear (despite
    a beet red face) that Greg preferred to finish the session and not dwell on the
    fall. I continued the discussion regarding the task we were testing and discretely
    cut out any remaining tasks. Instead of heading to the observation room to see
    if there were any additional questions, I completed the wrap-up questions as nothing
    had happened. Greg walked out of the office with the small talk about the weather
    and a friendly-thank you.


    We were lucky that Greg did not injure himself or cause any damage to anything
    aside from his bruised ego. Greg was not the first participant to find our standard-issue
    chairs too small.


    Key takeaways are to have the most accessible seating option possible and, in
    the the event of an embarrassing situation, do your best to help the person regain
    their dignity. Try to find a chair that is as adjustable as possible—not just
    up and down, but also with either nor or adjustable-width arms. And remember,
    the participant won''t know if you cut the last task or skip a few questions.
    By acknowledging the embarrassing event in a polite and professional way and then
    moving on, Greg left the session reassured that we got the information we needed
    despite his bruised ego.'
