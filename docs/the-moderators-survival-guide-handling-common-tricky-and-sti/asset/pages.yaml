- pgno: 247
  md: '# 13.6 Participant makes a strangely specific request


    The participant asks you to do something that''s very specific and slightly unusual.
    For example, as you start the session and offer a drink to the participant, she
    says, "Can you get me a half-regular, half-decaf coffee with one sweetener and
    fat-free-and-half?" Or you''re asked to clean a participant''s eye glasses, find
    someone to shine her shoes, call her brother, accompany her on a smoke break,
    or find her a pair of nail clippers.


    | Method(s): | Any in-person method |

    | Frequency: | Rare |

    | Pattern(s) to apply: | Take responsibility |


    # What to do


    Since requests come in all shapes and sizes, there''s no one right answer for
    this type of situation. We recommend using the following guidelines:


    +   - Accommodate the request, if it''s not consuming, unmanageable, or demeaning.
    If you don''t have exactly what the participant requests, ask if there are available
    substitutions. Even though coffee, water, and tea have been free for guests in
    many of the facilities we''ve used, we''ve had moments of grabbing our own money
    to get that special Diet Dr. Pepper from the vending machine to make the participant
    happy. Keep them as comfortable as possible, with minimal effort required.

    - If you have to spend extra time accommodating them, or you''d feel uncomfortable
    in any way, politely let the participant know that you don''t have available (if
    an item is requested) or you''re unable to help (if a service is requested), and
    offer a substitution if possible.

    - Keep your professionalism and organization''s policies in mind. For example,
    although it''s a little weird to be asked, it''s fine to clean someone''s glasses
    (we''ve seen this happen) or provide her with the materials to do so, but it''s
    not your job and not a professional presentation of yourself and your organization
    to shine participants'' shoes or call their dentist for them.


    # What to say


    +   - "I''m not sure I''ll be able to accommodate that request, but let me check
    into it for you."

    - "I''m sorry, due to our policies I can''t do that for you.

    - "We''re under some time constraints with limited people running this study,
    so we don''t really have time to do <request> today."'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 13.6 Participant makes a strangely specific request (cont.)


    # What not to do or say


    +   - Avoid giving the impression that you’re at her beck and call. Be kind and
    a good host and listen politely, but remain in control and present yourself professionally.


    # How to avoid


    +   - When the participant is recruited, make sure she knows she’ll be a participant
    for a user research session with specific goals (rather than a visit or tour as
    a guest), and what amenities (if any) will be provided.


    +   - If you have a waiting area at your facility, provide reading materials and
    have some common beverages on hand (e.g., water, coffee, tea).


    # See also


    +   - 13.5 Participant does something awkward or uncomfortable


    +   - 13.7 Participant makes request during a site visit


    +   - Survival Story: “The request caught me off-guard” in Chapter 10'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 13.7 Participant makes request during a site visit


    > You''re conducting a study at a participant''s house and asks you politely if
    you''d like a beverage, or if she can make you some food. Maybe the request is
    more personal (e.g., asking you to take off your shoes), or it''s just plain unexpected
    (e.g., asking you to take out garbage).


    Method(s): Any in-person method

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Disengage from the participant


    # What to do


    When you visit a participant''s home, keep in mind that you''re a guest and need
    to be polite and accommodating. Establishing an amicable yet professional relationship
    will set the tone for a fruitful feedback session. However, it''s a slippery slope
    from being polite to getting too involved or friendly with the participant. Doing
    so can bias the results of your study or get you into a sticky or dangerous situation.


    +   - If the participant asks you for a beverage, feel free to accept as long
    as it''s nonalcoholic, doesn''t create a burden on your host, and doesn''t take
    too much away from the session. Be gracious and thank her for the offer, and remember
    that the participant is meeting social norms for having a visitor.


    +   - Whether you accept a beverage from the participant or bring your own bottle
    of water, be careful where you place it. Some people are picky about beverages
    on their computer desks, or on tables without coasters. Ask the participant where
    she''d prefer to place your beverage.


    +   - If the participant asks you you want some kind of food, try to avoid having
    her out of the way unless she''s really excited or about serving you and it seems
    offensive to turn her down. Thank her for the offer. However, be aware that if
    a participant is, cooking you a steak dinner, it sets a precedent for a more friendly
    relationship, and it may become harder to stay neutral and in control during the
    session.


    +   - If the participant has particular customs or rules like taking off shoes,
    be considerate and follow her rules. As a rule of thumb, it''s always a good idea
    to go to a home visit with socks and shoes rather than without socks. Make sure
    your socks are ready for public viewing with no holes or inappropriate illustrations.


    +   - If the participant has a really specific request, be accommodating but try
    to avoid denying tasks for her. For example, out of respect you may take a few
    minutes of silence for her religious ritual such as praying, but you don''t have
    to take out her, answer the phone, or fix her dishwasher in return for her feedback!'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 13.7 Participant makes request during a site visit (cont.)


    +   Also try to resist any activities that don''t relate to the topic you''re
    researching. For example, if the participant tries to show you old home videos,
    tell them that you''d like to get started with the session. If necessary, take
    responsibility and say that you packed a lot into your study plan or use some
    pretext having to leave early to help her stay focused.


    +   If the participant seems to be too friendly or to connect with you, use the
    pattern of disengaging from her slightly. Adjust your demeanor and style to be
    a bit less approachable and more to Business, and remind her of your purpose for
    the session.


    # What to say


    To politely refuse a request:


    +   “Oh, no, I''ve just eaten but thanks so much for the offer.”


    +   “Thank you for offering, but I have a bottle of water right here. If it''s
    okay, I''d like to go ahead and get started.”


    If asked to take part in some awkward activity:


    +   “That''s alright, I actually have a bit of prep work to do here so if it''s
    okay, I''ll just be here working quietly.”


    +   “Actually, I''d rather just get started if that''s okay. I have a lot to get
    through and leave a few minutes early.”


    # What not to do or say


    +   Don''t do anything that may be perceived as disrespecting the participant''s
    space, like touching her things, opening her fridge, or sitting on her bed (even
    in a studio apartment), unless you have explicit permission to do so.


    +   Don''t agree to anything that may put you in danger, such as going into bedroom
    or basement alone with the participant unless location is relevant to the research
    you''re doing. Basically, don''t do anything you innocent victims do in horror
    movies—use your common sense.


    # How to avoid


    +   You never know what you''ll be asked or offered a home visit. But one way
    to get a sense for the participant''s personality is to get her call personally
    and chat for a few minutes with her. If the participant seems unusual on the phone,
    there''s a possibility that her living style and habits may suit you. So, make
    a decision on who to bring or even whether to go through with the session. Always
    bring another colleague with you on field visits.


    # See also


    +   13.6 Participant makes a strangely specific request'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Survival Story


    # SURVIVAL STORY: "SHE TIPPED ME ... BIG!"

    MHAEL ROBBINS


    It started as a routine usability study. Observing behind a huge one-way mirror
    my consultancy''s director, my boss, a couple टाक्या/equipment operators, and
    the client. The participant and I were seated side-by-side in front of a PC in
    a cramped, bare-walled testing room. She was a cheerful woman in her fifties and
    I was a thirsty-something-year-old guy.


    It well into the hour-long session before it dawned on me that she might be flirting.
    She was getting progressively more complimentary and effusive. She cleared up
    doubts when she began lightly touching my arm and her eyes shot some special twinkle.
    From behind the huge mirror I felt amused grins getting wider. The study wasn
    suffering so I kept moving around and beside, she was amusing me too! Everything
    was fine ... until she craned up after the study ended.


    She started with waves of praise about how well I had done, how professional I
    was, etc.\ I thanked her for her kind words as I handed payment to her—an envelope
    of cash. Before I knew what happened, she stuffed $20 into my hand and showered
    me with a tsunami of praise. She tipped me ... big!


    My first thought was "Oh no! What do I do now?" Then a mental flash of our unseen
    transfixing on this rapidly unfolding, live drama. I quickly interrupted her and
    handled the cash back, asking that she keeps it. She refused. I put the cash down
    on the table in front of her and rationalized that she earned it and belonged
    to her. She wasn''t wanting it. I insisted. Back and forth it went. Changing tactics,
    I stuffed the $20 deep into her open purse, got close to her, and explained in
    an earnest and disarming whisper that, just as an architect is, I wouldn''t feel
    right as a professional accepting her money and I wanted her to keep it ... really.
    And, for some extra oops, I also assured I was doing alright with money ... really.
    It worked! She left perhaps even more cheerfully than she arrived. Pewhew!


    I appreciated the knowing smile my director was wearing as she stepped out of
    the observation room and the good-natured ribbing from my colleagues.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Survival Story (cont.)


    Upon reflection, answering her good-natured flirtation with continued friendliness
    had the best chance of keeping the study running smoothly. Any “correction,” however
    gentle, risked my participant’s willing chilliness.


    As far as the tip, other than clairvoyance about which approach would work the
    first time, I''m not sure I would have changed much here either, except perhaps
    stuffing the money in her purse. That might have gone horribly awry but, as the
    paraphrased adage goes, it''s not what you do that is important, but how you do
    it.'
  merge: -1
  img_proc: true
