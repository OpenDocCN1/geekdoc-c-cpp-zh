- pgno: 180
  md: '# 10.3 Participant does something very unexpected


    While attempting a task or answering a question, the participant does or says
    something very unexpected. This may be something that no other participants have
    done or mentioned, or that is radically different from what you expected. For
    example, you ask a participant in an interview how he uses a mobile application,
    and he begins talking about the stereo system in his car.


    +   Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Clarify the task/question; Redirect
    the participant


    # What to do


    +   Let the participant continue down his path for a few minutes. If you''re running
    a usability study, remind the participant to think aloud. With a little more information,
    you should be able to tell whether the participant misunderstood you or is revealing
    something interesting about your users and their potential behavior. Using the
    example of asking the participant about his mobile application, he may have assumed
    that “mobile” means the systems he interacts with in his car rather than his smartphone.


    +   If you''re still not sure why the participant is doing this unexpected thing,
    repeat the question or verify that he didn''t mishear you, but be careful with
    your tone so it doesn''t sound like you''re reprimanding him (see example in Appendix
    A). You can also try rephrasing or adjusting the question or task slightly, see
    if he does the same thing. For example, if you asked the participant to change
    his mailing address on an e-commerce website and he gets somewhere that doesn''t
    seem to make sense, ask where he would like to change his billing address.


    +   Similarly, ask the participant to tell in his own words what he is trying
    to answer, what he is trying to do, or what he is looking for.


    +   Verify that you''re not using industry jargon or being overly verbose in your
    questions and tasks, and reward if necessary.


    +   If the participant is watching your lips closely or tilting his head to closer,
    he may be having trouble hearing you. Move your chair closer to him, speak a little
    louder, and speak in short, direct sentences.


    +   If you''re conducting a usability study and think the participant did something
    unexpected because he missed the correct path, and you need to get him back on
    the correct path due to dependencies in future tasks, bring him back to where
    the divergence happened and ask a general question about the purpose of that screen
    or the options available. Then, if necessary, you can direct him to where you
    need him to go using the technique described in the Chapter 3 sidebar “The Diversionary
    Assist.”'
  merge: -1
  img_proc: true
