- pgno: 138
  md: '# 8.1 Participant looks for affirmation


    > The participant seems unsure about what he is saying or doing, and looks to
    you for affirmation. He may ask direct questions (e.g., “Am I doing this right?”)
    or use passive statements (e.g., “I hope this is helping”).


    Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Redirect the participant; Reassure the participant


    # What to do


    This situation is similar to one where participants blame themselves and apologize
    (see section 8.4), except in this case they''re more explicitly looking for feedback
    from you to direct them.


    +   - Ensure the participant is providing the kind of feedback you need (which
    is different than assuring him he is doing anything “right”), and reiterate that
    anything he does or says is helpful for the research team.

    - Check your body language and if you see anything you during the session may
    have caused the participant to think that he is doing something wrong. For example,
    if you''re taking notes, make sure you''re taking notes when the participant is
    being successful and when isn''t, instead of just when the participant encounters
    an issue.

    - Rather than letting the participant dwell on his desire for affirmation, follow
    your reassurance with an immediate redirect to another follow-up question or task
    related to the research goals. For example, you may say, “This is the kind of
    feedback we want to hear. Now, earlier mentioned…”


    # What to say


    +   - “This is the kind of feedback we want to hear.”

    - “All of this has been very helpful to hear and see. Thank you for your continual
    feedback.”

    - “Don’t worry about how you’re doing—we’re not looking at it that way. We’re
    just here to see/how you approach it, and get your feedback on the process.”


    # What not to do say


    +   - Avoid agreeing (or disagreeing) with a participant about his feedback. For
    example, don’t say “Yeah, this is obviously a big problem we thought about.”'
  merge: -1
  img_proc: true
