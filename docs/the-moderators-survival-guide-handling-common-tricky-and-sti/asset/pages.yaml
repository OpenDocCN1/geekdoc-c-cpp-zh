- pgno: 44
  md: 'phrases may not cut it, or if a participant doesn’t act as expected given one
    of those phrases. In these cases, keep in mind these three guidelines:


    +   1. **Be as unbiased and nonjudgmental in your response as possible.** No matter
    how inflammatory or provoking the situation is, or how much you agree (or disagree)
    with what the participant is saying, it is your responsibility to remain neutral.
    Remember that it''s not just what you say, but also how you say it, in intonation
    and body language. For example, if the participant is describing a personal or
    cultural belief that you find redundant or inappropriate in response to your inquiry,
    try to keep your face and voice at an even neutral tone as you answer their next
    question.


    +   2. **Build on what the participant says rather than negating it.** As mentioned
    in Chapter 1, one of the fundamental principles of improv is to never disagree
    with something that has said, but instead to say “Yes, and....” This principle
    means that you’re always building on what someone else is doing rather than negating
    it. In a research session, your “Yes, and...” is less about agreeing with the
    participant has said and more acknowledging that he has been heard. For example,
    if the participant asks if he has performed a task correctly, respond with a prefabricated
    phrase instead of ignoring the questions. For example, “So I''ll actually turn
    that question around: Do you feel that you’ve found the information that you’re
    looking for?


    +   3. **Be as graceful as possible when redirecting or reacting.** When the participant
    wanders off track or no longer provides useful feedback, your paralanguage will
    set the stage for your reaction. You don’t want to imply that he has done something
    wrong. Here’s one of our examples of a moderator-participant exchange we’ve seen,
    showing how your word choices and intonation can have a negative effect:


    Moderator: How would you do <task>

    Participant: Oh, I would do <this>.

    Moderator: (pause, intonation rising) Oh. You would.


    The rising intonation implies a questioning of the participant, and may cause
    him to feel judged or that he should rethink his answer. Instead, a graceful reaction
    would be to say “okay” with a neutral tone and move on, or ask him if there are
    other things he would try if the first attempt didn’t work. If he is interacting
    with a prototype, you could also let him attempt the task, ask how it compares
    to what was expected, and ask if there are any other ways he might try to do the
    same thing.


    > We discuss this kind of situation where a participant makes inappropriate comments
    in section 13.1.


    WHAT NOT TO SAYnThere are some phrases that you need to be careful with, as their
    connotations may have unexpected consequences on the participant. Table 2.5 lists
    these phrases, and why they usually don’t fare well.'
