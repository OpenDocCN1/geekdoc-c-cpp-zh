- pgno: 295
  md: 'thinking about it much. Then introduce the next change—addressing the fact
    that you answer every question a participant asks right away. In preparation for
    the next session, write a note that says “WAIT FIVE SECONDS!” at the top of every
    page of your study plan. Every time the participant asks you a question, count
    to five in your head before doing or saying anything. Continue working on this
    for a few sessions until it feels natural. Then, focus on the pen-tapping for
    the next go-round.


    # 16.3 Giving feedback to other moderators


    # Giving solicited feedback


    If someone asks you for feedback on his moderating, take it as a compliment—that
    thinks enough of your skills to want your perspective. Congratulations! Be sure
    to take his request seriously; don’t respond with “Oh, your moderating is fine,”
    even if you think it is. As we’ve mentioned, even good moderators can improve
    and need to keep their skills sharp.


    For tips on how to give feedback, see the sidebar “What to Look for in a Moderating
    Critique.”


    | WHAT TO LOOK FOR IN A MODERATING CRIQUE |

    |---||

    | Here are some pointers on what to look for when watching your own moderating
    or giving feedback to other moderators (in which case, replace “you” with the
    “moderator”). Pay attention to:

    > How you start the session. The first encounter and introductions set the stage
    for the rest of the session. If you’re nervous, that might be reflected in the
    participant’s behavior.

    > Where you’re positioned relative to the participant. Are you too close or far?
    For example, is your positioning affecting the research? is sitting directly beside
    the participant encouraging him to fraternize too much?

    > What you’re saying to the participant. Are you asking leading questions? Are
    you using terms that are visible in the interface you’re testing? Are you being
    kind, yet in control? Are you talking quickly, or too slowly?

    > The tone of what you’re saying to the participant. Do you sound condescending?
    Conversely, do you sound unsure or reluctant?

    > Anything about your behavior that you find annoying or distracting. Are you
    playing with your watch, your hair, or your clipboard?

    > Anything unnecessary that you’re doing or saying. Is there something you could
    stop doing that gets in the way or doesn’t add value to the session |'
