  md: '# CHAPTER 3


    # When to use


    Use this pattern when you want to make sure that the participant is clear about
    what you asked. This pattern may be appropriate:


    +   - If the participant obviously did not understand the task/question.

    - If you think the participant may not have understood the task/question.

    - If the participant seems to be avoiding a task/question.


    # What to do


    First, verify that the participant misunderstood the task/question by asking her
    to tell you, in her own words, what she is doing or describing. For example, if
    you asked a participant during an interview to tell you about the last time she
    purchased a computer and she talking about a recent restaurant she visited, you
    can say, "So tell me why you''re describing your restaurant experience." You might
    find out that she didn''t hear your question correctly, or she visited this restaurant
    before she went to a store to purchase her computer.


    If the participant misunderstood what you were asking, reword or rephrase the
    task/question to ensure she understands what she is being asked to do. In a usability
    study, you can ask her to re-read the task out, and ask if she has any questions
    about the task. You may also need to provide some guidance on the type of feedback
    you''re looking for (e.g., functionality rather than visual design, thinking alike,
    etc.) or point the participant toward an area of the product that she hasn''t
    found on her own.


    This pattern is especially useful in situations where the participant is behaving
    or answering questions in an unexpected way. Several of these situations are described
    in Chapters 6 and 10.


    While this pattern is fairly straightforward, it can be used in a wide range of
    situations to help keep the participant on the desired path. Be careful of its
    misuse or overuse; for example, if you''re prompting the participant to re-read
    a task every time she gives off the optimal or successful path for a task, she
    may catch on it and could start to influence her behavior.


