    +   - If the participant genuinely interested in exploring part of the product
    that''s not part of your study plan, let him know if time permits, you''ll let
    him return to that area at the end of the session.


    # How to say


    At the beginning of the session:


    +   - "We have a lot to get through, so I may at times gently push along so that
    we can make sure to cover everything."


    +   - "If we wind spending too much time on any one topic, please don''t be offended
    if I ask you to move on, just to keep things on."


    During the session:


    +   - "This is all very helpful to see and hear. For the sake of time, I''m going
    to ask you to go <the next task/go back to...>"


    +   - "I''m interested in hearing more about this. I do want to make sure we cover
    everything we have planned. So if there''s time, let''s come back to this at the
    end of the session"


    If you need to interrupt and redirect:


    +   - "I''m sorry, I want to stop you for a second. For the sake of time I''d
    like you to return to the <task/question>, but we can revisit this topic at the
    end of the session if time permits."


    # What not to do or say


    +   - Do not zone out while a participant is talking about topics you don''t care
    about. We''ve seen moderators there stay in the distance, scratch their heads,
    look at their watches, and go on their mobile devices or computers. This behavior
    is disrespectful to participants. You should give the impression of your undivided
    attention at all times, no matter how irrelevant or tangential you consider their
    feedback. If you''re a bad actor and need something to help you focus, taking
    notes on what participant is saying to help them feel heard. However, keep your
    ears peeled because you never know when the participant will move into something
    that is relevant to your research—you don''t want to miss it!'
