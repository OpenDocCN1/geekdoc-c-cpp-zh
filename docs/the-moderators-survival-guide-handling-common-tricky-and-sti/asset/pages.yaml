- pgno: 57
  md: '# 3.6 Disengage from the participant


    Sometimes a participant can get a little too personal or too enthusiastic in interactions
    with you. Disengaging lets you pull away from that attention and establish a more
    neutral tone for the session.


    # When to use


    This pattern may be appropriate:


    +   - If the participant is being overly chatty or oversharing personal information.

    - If the participant is making you uncomfortable in any way, either through her
    attitude, something she is saying, or something she is doing.


    Do not use this pattern if you feel there is any danger presented by the participant''s
    behavior. Instead, take a break if you feel able to leave the room, and end the
    session early.


    # What to do


    This pattern lets you gain some emotional distance from the participant (Figure
    3.2). Move to a more neutral tone of speaking, and reposition your body slightly
    away from her. Try not to make too much eye contact with her, and focus more directly
    on the product or your notes. If you''re doing a contextual inquiry or usability
    study, you can also move yourself behind the participant. This position makes
    it more difficult for her to directly interact with you and forces her to focus
    on the product. If you''re in a multroom usability lab, you can also moderate
    from a different room. If you decide to switch to the other room, simply say,
    "For the next tasks, I''m going to be in the other room."


    You''ll find this pattern especially useful in many of the awkward situations
    described in Chapter 13.


    A variant of this pattern is to make a task or question less personal. This is
    useful if it seems that the personal nature of your question is causing the participant''s
    discomfort. For example, if you''re interviewing a participant about how she found
    a nursing home for her father but she is having a hard time about the process
    she went through, ask


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_57_0.png)


    Figure 3.2 Disengaging from the participant. A neutral moderating position (left),
    and an attempt to disengage (right). ©2013 Mark Ainscow, used with permission.'
