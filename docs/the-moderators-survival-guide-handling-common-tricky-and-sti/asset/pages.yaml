- pgno: 130
  md: '# 7.3 Facility loses its Internet connection


    At some point during your research, the facility you''re in loses its Internet
    connectivity. The Internet is required for your research, either because the product
    targeted by your research requires access or because you have remote observers
    or participants. This situation can happen at your location, at a participant''s
    site, or anywhere in the field.


    Method(s): Any

    Frequency(s): Occasional

    Pattern(s) to apply: Take responsibility; Take a break; Shift the focus


    # What to do


    +   - If you''re using a conference call to share audio of the session with observers,
    let them know that you''re experiencing Internet problems and you''re trying to
    resolve them. Place them on hold or mute while you''re trying to figure it out.


    +   - Verify (or ask the participant to, if you''re in her environment) that the
    Internet connection is down and that it is not a problem with the product or prototype.
    A quick way to check is to open a web browser and try opening anything. If you''re
    in an organization with an intranet, try both an intranet and an external website
    to narrow down the problem. If you''re able to see both an internal and external
    website, you know the problem is likely specific to your product or prototype
    rather than something with the internal or external network.


    +   - If you''re in your facility, check to make sure your network cable is still
    plugged (if using a wired connection) or that the wireless network is still visible.
    If the machine is wireless and the wireless network is not visible, make sure
    that the wireless turned is turned on and connected to the correct access point.
    If this doesn''t help, reboot the computer and stay aware. Be if you were the
    host of a screen-sharing meeting before experiencing the Internet difficulties,
    hosting role may get assigned to someone else in your area. You may need to reclaim
    that role once you''re able to return to the meeting, which may either happen
    automatically or you may need to do it manually from within the meeting (the specifies
    of how to do this varies depending on which tool you''re using).


    +   - If the Internet is unavailable after a few minutes, move to a part of the
    session that doesn''t involve using the Internet. For example, you could move
    to questions that are more interview-based, or ask the participant to complete
    a paper survey (as discussed in 15.2).


    # What to say


    +   - "It looks like we have lost our Internet connection. Please bear with me
    as I try to get the connection working again as quickly as I can."'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 7.3 Facility loses its Internet connection (cont.)


    # What not to do or say


    +   Don''t badminton the facility that you''re using or the networking team. Even
    though you just be trying to share your frustration, the participant and observers
    may take it the wrong way.


    # How to avoid


    +   If you''re using a prototype, try to install it locally on the computer being
    used for the research instead of a network. Another option is to have the prototype
    stored on a thumb drive or other portable storage device. If you''re asking the
    participant to use her computer (e.g., because you''re in her location), you can
    ask her permission to install the prototype, but be sure to uninstall it after
    the session.


    +   Most screen-sharing applications provide a call-in number that can be used
    of a "call using computer" (voice over IP, or VoIP) option. Provide this call-in
    to observers if the screen-sharing portion goes down during Internet issues, they
    can still hear what is going on during the session.


    +   Identify a technical support person who can be contacted with any issues.
    Ideally, you can let her know when you''re performing research so she can notify
    you of any planned outages or upgrades that may affect your session. If you''re
    testing a participant''s facility or remote site, you can ask your host to introduce
    you to a technical support person who can help in a pinch.


    # See also


    +   7.1 Technical issues arise with your setup and or equipment


    +   Chapter 15 sidebar: "Troubleshooting Skills Are a Lifesaver"'
  merge: -1
