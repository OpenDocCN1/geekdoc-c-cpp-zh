- pgno: 34
  md: '# CHAPTER 2


    # USING A PRETEXT


    While you should avoid misleading the participant, there are times when the truth
    is going to be harmful. For example, if you notice that the participant does not
    have the characteristics you need and want to consult with stakeholders (who are
    in another room) about what to do, you should not express your concern about his
    directly to the participant. Being honest may hurt his feelings or make him nervous
    about participating. Instead, make an excuse to leave the room.


    Technology can be blamed for many things and provides a convenient excuse if you
    need to leave the room or end the session. Just make sure that you have something
    realistic to blame so that your reason for leaving isn''t obvious. If you say,
    "The computer is not working correctly," the participant may realize that you''re
    lying because he can see that it actually is working. But if you, "Our prototype
    is not working the way it''s supposed to," he doesn''t have any reason to know
    that is an excuse.


    Examples of what you might say include:


    +   “It seems like we may be having technical issues with our recording equipment.
    Let''s take a short five-minute break while I run next door to look into it.

    “I apologize, I just noticed that there is something wrong with our prototype.
    Please excuse me for a few minutes while I go to the other room and see if anyone
    from our team knows what''s going.

    “I''m sorry, it looks like the product I wanted to get your feedback on working.
    I have a few more questions for you, but after that, we''ll end the session early.
    You''ll still get your full compensation!


    If you don''t comfortable blaming the technology or it isn''t applicable (e.g.,
    in an interview where you aren''t using any equipment), you can use the study
    itself as a pretext:


    +   “I mean to give you your compensation at the start of the session. Let me
    actually go grab that now. Let''s take a break for a few minutes.

    “I just noticed that I''m missing a page of my questions. Let''s take a quick
    break so I can run next door and point that out.

    “The rest of these tasks/questions aren''t applicable to you/your role, so we''re
    going to skip them. This means we may be done a little earlier than expected,
    but don''t worry, you''ll still receive your full compensation!


    27'
