- pgno: 74
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 4.4 Participant is unfamiliar with the equipment


    Your session requires the participant to interact with a computer, mobile device,
    or similar type of equipment. When asked to use this equipment, the participant
    indicates or demonstrates that he lacks basic familiarity with it. You can tell
    that proceeding with him will be impossible unless you spend some time acquaining
    him with the basics of the equipment.


    +   Method(s): Usability study

    Frequency: Rare

    Pattern(s) to apply: Reassure the participant; Shift the focus; End the session
    early


    # What to do


    +   - First, figure out if the participant is just unfamiliar with the platform
    that is being used. For example, participants who are used to old Apple computers
    and may not understand how to use a Windows two-button mouse, but have an understanding
    of how a mouse is supposed to work. If this is the case, provide a short explanation
    of how the device works on this platform or, if possible, switch to what he is
    used to (e.g., if you''re testing an application on an Android operating system
    and he only knows how to use an iPhone with iOS, you may want to switch devices
    if you''re able to do so).

    - If the participant is truly unfamiliar with the equipment, experiment with a
    short five-minute explanation and demonstration of what to do. Depending on what
    research is focused on, that short period might be enough to get him to a level
    where he can proceed. Make it clear to the participant that you''re training him
    for this first five minutes, after which you''ll no longer be training but rather
    observing.

    - Let the participant attempt the first task, with providing minimal technical
    support as necessary. Ask him to think aloud so you can track whether any problems
    he runs into are based on the interface or If the participant continues to struggle,
    shift the focus of the session to limit the use of this equipment and end early.
    Handle this as gracefully as possible. See section 10.8 for additional tips for
    dealing with struggling participants.

    - If at any point the participant seems like he is feeling bad or inadequate,
    reassure him that he is not being tested and that the feedback he is providing
    is helpful.


    70'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 4.4 Participant is unfamiliar with the equipment (cont.)


    # What to say


    +   - “You seem a bit uncomfortable with the <equipment>. Have you used anything
    like this before?”

    - I’m going to take a few minutes to help you set up on this <equipment>, since
    we’ll be using it later in the session.


    # What not to say


    +   - Don’t show any surprise or shock regarding a participant’s experience level.
    Remember you don’t know anything about the participant’s background, and it can
    be dangerous to make assumptions.


    # How to avoid


    +   - Consider adding some basic equipment experience into your recruit criteria.
    We’ve found that recruiting participants who spend at least five hours a week
    using the Internet doing varied activities (e.g., not just checking email but
    reading online, purchasing from e-commerce websites, etc.) typically ensures that
    they can use a computer and a mouse.

    - Depending on your study goals, this situation might not be something that you
    want to avoid. The perspective that a new or inexperienced user provides can be
    extremely valuable. However, for a typical usability study, the extra time spent
    helping an inexperienced participant results in less time getting the feedback
    that you need, so you’ll have to weigh this-off on a study-by-study basis.


    # See also


    +   - 4.1 Participant does not seem to meet a key recruit criteria

    - 4.2 Participant refuses to or can’t do a key task

    - 4.5 Participant has difficulty reading

    - Survival Story: “She looked agitated” in Chapter 8'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 4.5 Participant has difficulty


    The participant meets the recruiting criteria for the study, however, when you
    give him a task to read, he is hesitant and slow and struggles with the words.
    He has similar difficulties when trying to interact with the product, especially
    if there is a lot of text. You might notice he talks about expectations instead
    of using the product, even when you explicitly ask him to do so. It seems that
    he may have low-literacy abilities, a non-native English speaker, or some kind
    of reading disability. As the participant struggles, he may grow increasingly
    nervous and uncomfortable, or seem embarrassed.


    +   Method(s): Usability study

    Frequency: Rare

    Pattern(s) to apply: Reassure the participant; Shift the focus; End the session
    early


    # What to do


    +   - If the participant is having difficulty or seems nervous reading aloud,
    read the task to him or ask him to read it quietly and then verbally reiterate
    the task. You may find despite having issues the tasks, he approach the tasks
    with the product without issue.

    - If the participant continues to struggle with the tasks and is getting increasingly
    nervous or frustrated, shift the focus of the session to reduce the amount of
    reading required. For example, if he communicates well verbally, shift the session
    into an interview. If necessary, use a pretext to explain the shift (e.g., tell
    the participant that the prototype is not working as intended so you need to change
    the format).

    - Whether or not you shift the focus of the session to another method, end early.
    If possible, try to do it in a way that the participant doesn'' realize you''re
    ending early (e.g., by saying that you went through faster than anticipated).


    # What to say


    Switch over to reading tasks to participants:


    +   - “Let’s say your next task is to....”

    - “I apologize— I didn’t word this task very well. Let me to rephrase it....


    Change the focus to an interview:


    +   - “It looks like our prototype is not working as we planned it to, so if you
    don’t mind I’m going to ask you some questions.”'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 4.5 Participant has difficulty reading (cont.)


    End the session early:


    +   - At beginning of the session: “I’m sorry


    +   - If a little later in session: “That is actually all I had for today, so
    you’ll get some time back in your day! Thank you so much for your feedback, and
    here’s your compensation.”


    # What not to do or say


    +   - Don’t show any surprise or shock regarding a participant’s literacy level.


    +   - Avoid anything that might make the participant more nervous or embarrassed
    about his performance, as pointing out that he seems to be having trouble reading.


    # How to avoid


    +   - During recruiting, let participants know that they will be interacting with
    a product rather than just answering questions.


    +   - If low-literacy participants are part of your target recruit, be sure to
    set up your study plan appropriately to accommodate their abilities. For example,
    you should not require them to read tasks.


    # See also


    +   - 4.4 Participant is unfamiliar with the equipment


    +   - 10.8 Participant struggles excessively with a task


    +   - Survival Story: “His frustration was clearly growing” in Chapter 3


