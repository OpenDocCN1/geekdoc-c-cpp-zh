- pgno: 72
  md: '# 4.3 Participant has an unexpected physical feature


    Your room''s physical and technical setup works well until you get a participant
    who has a physical feature that requires an adjustment. For example, the participant
    may be left-handed, have an injured arm in a sling, or be a very large or small
    person.


    Method(s): Any in-person method

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Reassure the participant


    # What to do


    +   - If the feature is something you notice on your own (e.g., very tall, left-handed),
    make any adjustments to your facility as soon as possible. For example, show the
    participant how to lower the chair, or move the mouse from the right to left.
    When you make the adjustments, place any blame on you or your facility for not
    being set correctly.

    - If a participant is very large and has trouble fitting into your chair, offer
    to get them a different one without making a big deal about it. A chair without
    any arms can work well. While most participants won''t take you up on your offer,
    those who will be grateful.

    - If the participant apologizes for inconveniencing you, reassure him that it''s
    no inconvenience and that you''re looking forward to his feedback.


    # What to say


    +   - "I apologize that we''re not set up well as we could. Let me show how we
    can adjust the chair to a more comfortable height."

    - "Is there anything I can do to make you more comfortable?"

    - "Sorry, before we continue, I''m going to help you lower/raise the chair so
    our recording equipment can capture you."


    # What not to do or say


    +   - Don''t call unnecessary attention to the participant''s physical attributes.

    - Occasionally, a participant will call attention to his own attribute to acknowledge
    it. If he does, try not to follow up with personal questions. Focus questions
    on understanding how you can better accommodate him. If the participant makes
    fun of himself for some sensitive attribute, don''t laugh along. Smile politely,
    and move on to your study plan.

    - Don''t complain about any extra work created by making the accommodations for
    the participant.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 4.3 Participant has an unexpected physical feature (cont.)


    # How to avoid


    +   Familiarize yourself with the adjustments that your facility and equipment
