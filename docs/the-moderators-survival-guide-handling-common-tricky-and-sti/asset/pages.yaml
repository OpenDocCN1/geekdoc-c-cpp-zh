- pgno: 114
  md: '# 6.5 Participant ignores or pretends to understand your question


    The participant seems to be pretending to understand your questions and is giving
    you vague (e.g., "sort of" or "I don''t know") convoluted responses. Alternately,
    the participant may blatantly ignore your question and start talking about other
    topics. If you''re asking him to show you something specific or attempt a task,
    he may ignore what you ask him to focus on and instead show you something else
    that he is obviously good at or knowledgeable.


    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Clarify the task/question; Redirect
    the participant


    # What to do


    +   - Blame yourself as the moderator for not being clear with a question/task.
    For example, "I''m sorry, I didn''t explain this very well. I''d like to hear
    from you...." This technique reassures the participant that he is not being evaluated
    and he is not stupid for failing to understand your question.


    +   - Rephrase the question/task to make it easier for the participant to understand,
    or break down your question into a set of smaller questions that will lead to
    your goal.


    +   - If the participant is wiping his lips closely or tilting his head to be
    closer to yours, he may be having trouble hearing you. Move your chair a bit to
    his, speak a little louder, and use short, direct sentences.


    +   - If the participant still doesn''t understand you or is still vague, move
    on to your next task or question.


    # What to say


    +   - "If anything I don''t seem to make sense, please let me know."


    +   - "I know this may not be what you typically work on, so let me know if I''m
    not being clear about what I''m asking you to <do talk about>."


    +   - "I''m sorry, I don''t think I''m being clear with my question. Let me rephrase...."


    +   - "Would help if I rephrased the question?"


    +   - "Let me back up a little, and first ask you...."


    # What not to do or say


    +   - Don''t ask the same question over and over in in hopes of getting different
    responses. This will exacerbate the problem and further frustrate the participant.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 6.5 Participant ignores or pretends to understand your question (cont.)


    +   - Try not to say anything that may be perceived as blaming the participant.
    For example, “Did you not understand my question?”


    # How to avoid


    +   - At the beginning of the session, reassure the participant that he is an
    important part in your research. For example, “I will be asking you questions
    during this session, but if anything ask isn’t clear, please don’t hesitate to
    tell me.” Another example might be, “I’m not a subject-matter expert here, so
    if I’m not asking a question that makes sense, please let me know.”


    +   - If the participant is an internal employee, provide reassurance about how
    his feedback will be used to alleviate any concerns about looking bad in front
    of his fellow employees. For more information, see section 15.1.


    # See also


    +   - 6.3 Participant is nots to questions


    +   - Survival Story: “I would have trusted my gut” in Chapter 11'
