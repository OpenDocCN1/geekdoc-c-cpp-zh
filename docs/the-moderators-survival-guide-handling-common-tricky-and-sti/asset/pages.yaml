    # 1.5 Your moderating style


    Moderating isn''t just about controlling the session and responding to any situations

    outcurs. It''s also about the approach you take and the interpersonal skills you
    use when

    interacting with the participant. We define this approach as your moderating style.
    Just like

    how people come in all shapes, sizes, and combinations of qualities, so do our
    moderating

    personas.


    Your style of interacting with participants is a combination of your core personality
    traits and

    disposition you take while moderating. Your style may involve a combination of
    two or more

    characteristics, such as sociable, friendly, relaxed, jovial, detached, business-like,
    quiet,

    inquisitive, alert, eager, respectful, controlled, or subdued. Perhaps your natural
    style of

