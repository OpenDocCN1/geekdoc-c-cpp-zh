- pgno: 288
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    Once you have a study plan almost finalized, you can also run a practice session
    with a colleague acting as your participant so you can get a better feel for how
    the session will go and any areas that you feel like you might struggle with.
    This practice will refine your study plan and you will feel more comfortable with
    the protocol by the time your session comes around. Of course, also be sure to
    run a pilot session with an actual participant using your study plan and the product
    (if applicable) before your first day of sessions. You''ll feel more confident
    and appreciate the additional familiarity with the protocol in case anything unexpected
    happens and you will need to adjust.


    Chapter 16 provides additional suggestions for improving your moderating skills.


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_288_0.png)


    YOUR MODERATING "INSTINCTS"

    The user research field draws personality types who are curious about, and enjoy
    observing, the world and human behavior. These natural instincts help you pick
    up on the participant''s emotional state.


    With practice, you start to notice the subtle body language cues coming from the
    participant, and adjust your own body language, tone, or study accordingly. This
    unspoken feedback can help you understand how the participant feels about a product,
    and provides an opportunity for you to follow up with questions if she is not
    articulating the issues clearly on her own. Carolyn Snyder (2003) defines one
    of the roles of the moderator as a “sportcaster” who helps makes observers aware
    of what is going on in the session. Using your intuition to identify opportunities
    to probe is central to this role. Practice will also help refine your ability
    to understand whether a behavior is related to the design or the research situation,
    so that you can respond appropriately.


    Although there is no easy way to “teach” instincts, our advice is to try to broaden
    your research lens outside yourself when you moderate. In other words, don''t
    focus on your research goals but turn it into a challenge to resolve the participant''s
    demeanor. As G.I. Joe says, “saying is half the battle.”


    Also, try turning other experiences with the outside world opportunities to improve
    your instincts. Watch people interact with each other at your local coffee shop,
    and try to gauge their emotional states based on their body language. Watching
    others will help you refine your awareness of how the participant may be feeling
    and will help you adapt appropriately. Plus, it''s fun to people watch!


    294'
