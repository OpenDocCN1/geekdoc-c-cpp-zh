- pgno: 203
  md: '# 11.5 Participant seems annoyed at your neutrality (cont.)


    Take responsibility by apologizing once for your constant neutral responses. Avoid
    apologizing more than once though, as that may create awkwardness and potentially
    bias the participant''s feedback.


    # What to say


    +   - “The feedback you’re giving is really valuable for our team. We need to
    know what questions people will have when they use this, so the product can do
    a better job of providing those answers.”


    +   - “I know it''s odd to have me keep turning the question around you, but I
    really want to play a neutral role here and understand your expectations. Thanks
    for being patient with me.”


    +   - “If you were doing this on your own and I wasn’t sitting next to you, what
    would you do?”


    # What not to do or say


    +   - Don''t be defensive about being neutral, or apologize more than once for
    your responses.


    # How to avoid


    +   - At the beginning of the session, set the expectation that you may not be
    able to answer questions during the session that you may turn any questions back
    on the participant to gauge her expectations. Stress even if you do so, you''re
    genuinely interested in hearing her ongoing feedback and any questions she''d
    have while using the product.


    # See also


    +   - 11.6 Participant does not seem to respect you or take you seriously


    +   - 11.7 Participant becomes insulting or has an agenda'
