- pgno: 236
  md: '# 13.1 Participant curses or makes inappropriate comments (cont.)


    +   - In conjunction with these tips, think about your body language and moderating
    style. If you''re relaxed and friendly in disposition, now is the time to adapt
    to a more formal, less responsive moderating style (as discussed in section 1.5)
    so that the participant knows you''re serious.


    +   - If asking the participant to stop doesn''t help, or her language is still
    out of control, either take a break to assess the situation with colleagues, or
    just end the session early. Try to do so in a way that doesn''t blame the participant
    (e.g., use a pretext and blame a technical failure or pretend that you''re done
    with the tasks.


    # What to say


    If the participant is cursing and you feel comfortable using slight humor:


    +   - "I just to let you know that this is a curse-free zone!"


    +   - "If you don''t mind, let''s keep our words PG-13."


    +   - "I like your spirit, I''ll ask you not to curse in this setting if you can
    help."


    If the participant is cursing, and you want to keep the tone relatively formal:


    +   - "<Participant>, I appreciate your feedback so far, but since we''re being
    recorded and there may be others listening in me, I need you to use clean language
    for the rest of the session. Thank you So, let''s go back to..."


    If the participant is making discriminatory remarks, and you need to redirect:


    +   - "Okay, let''s move onto..."


    If the participant is making discriminatory remarks and you need to be more explicit:


    +   - "I know that you''re free to give any feedback, but I''ll ask you that you
    do so in a way that is respectful to others. Thank you in advance. Now let''s
    get back to..."


    +   - "As I said earlier, we have some observers and the session is being recorded,
    I''ll ask you to avoid <cursing, using profanity, making personal statements about
    ''kinds of people''> during the rest of the session."


    If you need to end the session, use a pretext such as:


    +   - "I''m sorry


    # What not to do or say


    +   - Don''t laugh in response to offensive or controversial jokes, even if you
    want to feel like the participant is looking for you to respond in some way.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 13.1 Participant curses or makes inappropriate comments (cont.)


    +   - Don''t scold the participant, as it may shut her down for the rest of the
    session and limit the feedback you''re able to elicit.


    +   - Avoiding your opinion or engaging in a discussion with the participant.


    # How to avoid


    Make sure that when recruiting, you look for any sign that a participant is especially
    forthcoming with inappropriate or irrelevant information, and screen her out.
    For example, if you''re recruiting for a financial services website and the participant
    goes on a long political rant about the current White House administration, that
    participant is likely to do something similar or worse during the session!


