- pgno: 82
  md: '# 5.1 Participant thinks that she is participating in a focus group


    When the participant arrives, it becomes clear that she is expecting to be in
    a focus group with other people. She may ask everyone else is, or talk about her
    previous experience participating in focus groups. Or, she may arrive late because
    she assumes that the group won''t be delayed or affected by any person not being
    there.


    Method(s): In-person usability study

    Frequency: Frequent

    Pattern(s) to apply: Clarify the task/question; Reassure the participant; Build
    engagement


    # What to do


    +   - Most people are familiar with focus groups but not with usability studies,
    so this is a common misconception. Let the participant know what she''ll be doing
    is similar to a focus group, but she''ll be the only person in the room with you
    and you''ll be asking her to interact with a product rather than having a group
    discussion.


    +   - Ask if the participant has been in a focus group before. This approach provides
    a lightweight way to get her talking, and may also reveal if the participant has
    actually participated in any kind of research before or if she has just heard
    of focus groups.


    +   - If the participant signed up to participate in a focus group where she could
    hide behind a crowd, she may be shy about performing tasks and thinking aloud.
    She may not be a personality type who would have signed up for a usability study.
    Because of this, you may need to adjust your style to be comfortable and engaging
    until she feels more comfortable. You may also need to reiterate the kind of feedback
    you''re looking to receive from throughout the session.


    # What to say


    +   - “What you''ll be helping us with today is similar to a focus group, but
    you''ll be the only person in the room with me and you''ll be working with a product.
    I''m going to ask you to try to use the product to accomplish some tasks while
    thinking about your experience. This will give us feedback on how the products
    work—both works well and what should be improved. Let me tell me a bit more about
    how our session will work…”


    +   - “It sounds like you''re familiar with focus groups. Have you participated
    in any kind of research, like a focus group or usability study before?'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 5.1 Participant thinks she is participating in a focus group (cont.)


    # What not to do or say


    +   Don''t disparage focus groups. Many user experience practitioners see focus
    groups as a technique that produces misleading results, but someone who has been
    in a focus group and had a great time doesn''t need to hear you on the methodology.
    Instead, (no pun intended) on the more practical aspects of how the research you''re
    doing today will be different than a focus group. For example, the session is
    one-on-one, and the participant will be interacting with a product.


    # How to avoid


    +   In your recruiting screener and confirmation letter, be explicit about the
    type of research you''re doing and that the session will be one-on-one between
    the participant and a moderator (you). However, be aware that no matter how explicit
    you are during the recruiting process, you''ll still get participants who assume
    they''re there for a focus group.


    # See also


    +   4.6 Participant or others ask you to help


    +   5.4 Participant brings you to a conference room or other space


    +   5.5 Participant treats a contextual inquiry like an interview


    +   5.7 Participant thinks the session is a job interview'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 5.2 Participant doesn''t want to be recorded or has other concerns


    The participant was recruited with the understanding that the session will be
    recorded. However, once she arrives and reads through the consent form, she decides
    that she is uncomfortable with being recorded and will not proceed unless refrain
    from recording the session. If she is remote, she may change her mind about being
    recorded once she is in the session, even if she already sent you signed copy
    of the consent form. Or, the participant may have other concerns about the consent
    form and refuses to sign it unless you make changes.


    +   * Method(s): Any

    * Frequency: Occasional

    * Pattern(s) to apply: Reassure the participant


    # What to do


    +   * See if there is a level of recording that the participant is comfortable
    with. For example, instead of recording picture-in-picture, offer to remove the
    capture of the participant''s face while still recording the scene and audio.
    However, don''t press the point. The participant is under no obligation to be
    recorded if she doesn''t want to be, and a recording is usually nice to have instead
    of a necessity for the session.


    +   * If the participant has issues with video/audio altogether, ask if it would
    be okay for you to just take detailed notes or another person in the room to help
    take notes. If she agrees to having another person take notes, ask your colleague
    to join you and sit behind her quietly with a notepad or note-taking device.


    +   * If you''re providing recording sessions to stakeholders, be explicit about
    their story and deletion responsibilities. You can share those responsibilities
    with the participant if she is nervous about how the recordings will be used and
    reassure that her video will not end up on YouTube!


    +   * If the participant is concerned about any other clause in the consent form,
    ask her to explain her concern. Do your best to address her concern, but if she
    is still uncomfortable, to cancel the session and let her leave with her full
    compensation.


    +   * Be sure the participant signs the consent form before the session begins.
    If she refuses to be recorded but willing to continue, mark the consent form to
    reflect the change. Bearing legal advice (“How to avoid”), use a permanent pen
    or marker of a different color to make the edits required for the participant
    to continue. Make sure the edits are obvious. If a participant doesn''t want to
    be recorded, for example, cross out the line regarding recording and write in
    big letters at the bottom, “NO RECORDING.” For recognition purposes, it may help
    if you place your initials next to the change, and have the participant add her
    initials to yours.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 5.2 Participant doesn''t want to be recorded or has other concerns (cont.)


    # What to say


    +   * “I know you''re concerned about the recording. Let me explain what would
    actually be recorded if you agree to it. The recording is a picture-in-picture
    showing the computer screen in the window, and a small inset of your face in the
    corner. If you prefer, we can set it up so we do not capture your face, only your
    voice. The recording will only used to make sure that we have an accurate record
    of your feedback. It will only be shared with the team working on this project,
    for this project—not for any other purpose. Does that make sense?”

    * “Would it be okay if we adjusted what is being recorded so we''re only capturing
    *what being recorded, e.g., just your voice and what you''re interacting with,
    without capturing your face*?”

    * “If you don''t mind, tell me what you''re concerning about *topic of concern*,”


    # What not to say


    +   * Don''t dismiss the participant''s concerns. The prevalence of platforms
    such as YouTube and Vimeo have shown how easy it is to share video, so a participant''s
    concerns regarding what him recording is warranted.


    # What to avoid


    +   * Be explicit about the recording and how it will be used. Whose is handling
    the recruit share this information with the participant during the recruitment
    process and in her confirmation letter. Make sure that the participant knows the
    recording is optional, which it usually should be. Also share your consent form
    with the recruiter so can answer questions ahead of time. If you work with the
    same recruiter multiple times, highlight anything unique or different that will
    be included in your study''s consent form hasn''t been in previous forms.

    * When a participant arrives, explain the consent form rather than just handing
    it to her. If you explains the clauses in plain terms upfront, she is likely to
    panic when trying to read and interpret the text on her.

    * Ensure that your consent form is written in plain language that clearly explains
    what will be happening during the session and what happen with the recording.
    This is often challenging in commercial environments, but is well worth the effort.
    Keep in mind that the consent is a legal contract and work with your legal team
    to craft something that is both legal and clear. See Appendix C for user method
    books that go into more detail about consent forms.

    * If you have access to legal representatives at your organization, discuss them
    with how much leverage you have in adjusting consent forms on-the-fly. For example,
    you may be allowed to use a pen to make a change to the form, put your initials
    next to the change, and have the participant put her initials next to yours.


    82


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_85_0.png)'
  merge: -1
  img_proc: true
