  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # When to use


    Use this pattern when you need to take the participant''s focus and emotions and
    redirect them in a direction more appropriate for your study. This pattern may
    be appropriate:


    +   - If the participant seems fixated on something other than you need to receive
    feedback on.

    - If the participant seems to be going down a path that will not be useful on
    your study goals, and you want to bring her attention back to your original intent.

    - If you need to give the participant an assist so she is able to continue a task
    during a usability study.

    - If the participant is obviously disoriented or unhappy with the organization/product,
    and you can tell that her complaints will get in the way of your feedback.

    - If the participant seems overly enthusiastic with the organization/product and
    loses focus.


    You will see redirection referenced in many situations throughout the book, but
    it is especially key in situations where participants are uncertain. These situations
    are listed in Chapter 8.


    # What to do


    This pattern redirects the participant toward an outcome more appropriate to the
    research you''re performing. The most common application of this pattern is the
    moderate staple of turning a question back around the participant. For example,
    if she asks, “Where would I go to that?” you respond, “Where would you expect
    to go?” If the participant asks a question that is more difficult to test around—“Am
    I doing this right?—this pattern lets you provide a vague answer that redirects
    her to a topic more relevant to the study. For example, “Like I said, we are definitely
    not testing you. Let me ask you about..."


    You may also need to provide a usability study participant with an assist if she
    struggles with a task that you need to get feedback on, or if she is unable to
    complete a future tasks that depends on. In these situations, you''re redirecting
    the participant from the path she is currently taking to the one that you need
    to use so you can accomplish your study goals.


    An assist can mean anything from a gentle prompt to pointing out what the participant
    hasn''t noticed on her own. For the different types of assists, see section 6.2
    and the sidebar "The Diversionate Assist."


    This pattern also lets you provide some space for the energy exiting from a disoriented
    or overly enthusiastic participant. One way to do this is, at the beginning of
    the session, let a disoriented participant spend a amount of time venting to get
    the negativity out of her system. For example, if you''re interviewing her about
