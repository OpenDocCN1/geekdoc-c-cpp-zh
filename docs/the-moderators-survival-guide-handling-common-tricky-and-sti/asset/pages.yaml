- pgno: 215
  md: '# 12.2 Something personal, inappropriate, or confidential is visible


    During a remote user research session, the participant is sharing their screen
    with you. He has acclimated so well to this setup that he forgets that others
    are watching, and begins doing something unrelated to your research (e.g., checking
    Facebook, typing in a chat window, responding to email) while you''re watching.
    The session is being recorded and there are observers watching. In the worst-case
    situations, the information that the participant is unwittingly sharing is negative
    in some way toward you and your research, is inappropriate (e.g., lewd wallpaper),
    or confidential (e.g., a manager''s list of employees and their salaries).


    +   Method(s): Any remote method

    Frequency: Frequent

    Pattern(s) to apply: Take responsibility; Shift the focus


    # What to do


    +   For material that is mildly embarrassing but not confidential (e.g., a chat
    window open open to a nonwork-related website), ask the participant to hide or
    close out of anything that he doesn''t want a wider audience to see. This subtle
    reminder is usually enough for the participant to realize what he''s doing and
    out of the problematic. Keep in mind that the participant will probably feel fairly
    embarrassed by the situation once he realizes what has happened, so don''t draw
    unnecessary attention to it.

    If the participant ignores your subtle reminder, be more explicit about what you''re
    seeing without specifying the content. For example, you might say, "It looks like
    your email application is open. You could close it to make sure we don''t see
    anything we''re not supposed to"

    If you see material that''s confidential (e.g., employee salary information or
    SSNs):

    Consider immediately overriding the screen sharing session to stop him sharing,
    or eject him from the meeting (ask the participant to make sure he closes on his
    computer that he doesn''t want a wider audience to see. he has verified he has
    done this, you can restart the screen sharing.

    If you don''t have the ability to override screen sharing, immediately ask the
    participant to close the window with the confidential information. Let the participant
    know how can stop sharing his screen if he thinks might need a few extra seconds
    to deal with the offending material.

    If, despite your reminder, the participant continues to share windows that he
    shouldn''t, consider blaming technical difficulties with the screen sharing and
    then refocusing the research into an interview or other form of research that
    doesn''t require screen sharing. If you have a way to easily continue the session
    without having the participant share his screen (e.g., by sharing your screen
    instead and giving the participant control of your applications), continue with
    the session that way.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# 12.2 Something personal, inappropriate, or confidential is visible (cont.)


    +   Any time you remind the participant to close out of sensitive materials, try
    to do so in a way that isn''t scolding or embarrassing. Take the responsibility
    for not being clear enough about these precautions earlier in the session and
    remind him that it''s for his privacy.


    +   Remind your observers about maintaining participant confidentiality. Ask them
    not to laugh or discuss what they''ve seen with other observers or anyone outside
    of the test.


    # What to say


    +   «Participant», I just want to remind you that your screen is currently being
    shared, please make sure you''ve closed anything you don''t want to see. Can I
    bring your attention back to...?


    +   Before we continue, would you mind closing the other applications and windows
    that are open on your computer (that aren''t relevant to <task>research>?) Since
    you''re sharing your screen, I need to be sensitive of your privacy and make sure
    you''re only sharing what you intend to share with us. If you need a moment to
    close things that you don''t want to see, you can click Stop Sharing, and Start
    Again when you''re ready.


    +   «Participant», I''m just going to stop the sharing for a second. Bear with
    me. I stopped the sharing because I noticed there was potentially personal information
    on your screen. I should have warned you before, sorry. We respect your privacy
    so I''ll ask you to close or hide anything you wouldn''t want a wider audience
    to see.


    To refresh the research:


    +   «I''m sorry to have you start sharing and then stop it abruptly. What we''re
    going to do now is switch modes lightly. I''m going to start by asking you some
    questions.


    To observers:


    +   «I could this make for a good story, but we take participant confidentiality
    and comfort seriously. So I''ll ask you not to make fun of the participant or
    discuss what you saw, either in or out of this room. Thanks for understanding.”


    # What not to do or say


    +   Don''t blame or accuse the participant of anything based on what you saw.
    It''s best to pretend as nothing happened.


    +   Don''t come across as condescending or judgmental based on what you see. For
    example, if the participant has computer wallpaper that you would consider not
    safe for work, ask him to hide anything he doesn''t want everyone to see, or if
    he needs more direction, ask him to change his wallpaper to something less distracting.
    Use directives more than descriptions—for example, say “your wallpaper is inappropriate.”'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 12.2 Something personal, inappropriate, or confidential is visible (cont.)


    +   - Avoid being snide. Even though your feelings may be hurt by a participant''s
    lack of attention to your study goals, move past it and work on getting the participant
    back in the session.


    # How to avoid


    +   - Before you have the participant share his screen, remind him that the session
    will be recorded and/or observed by others. Ask him to close or hide anything
    that he wouldn''t want a wider audience to see.


    +   - Explore your screen-sharing tool''s capabilities so you know what options
    are available to you in case you need to stop a participant from sharing, or eject
    him (or an observer) from a meeting.


