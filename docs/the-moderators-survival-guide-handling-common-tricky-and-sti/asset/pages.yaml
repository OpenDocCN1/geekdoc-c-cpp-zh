- pgno: 305
  md: '# APPENDIX B: PREPARING FOR A SUCCESSFUL SESSION


    +   Make sure you have someone (a colleague or stakeholder) who can watch every
    session, especially if you''re doing onsite sessions.


    +   Familiarize yourself with the study space:

    - Find the nearest fire exit.

    - Research evacuation procedures.

    - If there is building security, give them a heads up about your study and your
    scheduled participants.

    - If you''re going to a different country or cultural region, learn as much as
    you can about customs and taboos ahead of time.


    # Your observers


    +   Communicate your moderating approach so observers understand that you may:

    - Jump around in your study plan depending on what happens during the session.

    - Avoid answering a participant''s question directly.

    - Provide assists to participants.

    - Redirect participants from a topic but revisit it later.


    +   Establish and distribute ground rules for observer behavior during the session,
    including:

    - Keep conversation to a minimum—no laughing!

    - Keep the participant''s identity and personal information confidential.

    - Avoid making fun of the participant.

    - Keep cell phones silenced.

    - Leave the room quietly if a call must be taken.

    - Avoid slamming doors.

    - Don''t talk about the research study outside of the observation space at any
    point while sessions are running.

    - How to ask questions to the participant (e.g., you''ll check them with 10 minutes
    before the end of the session to gather any questions).

    - How to communicate with you during a session, it is necessary.

    - If you want them to take notes or help with data collection, include a short
    summary that they can refer to the session.

    - If observers will be in the room with you and the participant, also include:

    - No conversation or discussion with other in-room observers during the session.

    - Avoid multitasking.

    - Avoid disruptions.

    - Be careful of body language and any physical or audible reactions.

    - Do not help the participant complete tasks or answer questions.


    315'
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   If your observers are remote, also include:


    +   Stay on mute unless you explicitly ask them to unmute.


    +   Avoid using a screen-sharing application''s chat feature to communicate with
    you, as the participant might see it as well.


    # Your technique


    +   Review the prefabricated phrases in Appendix A and include any that you think
    will be useful in your study plan.


    +   Review the list of moderator behaviors to avoid from Chapter 1.


    +   Review the steps to take during a session from Chapter 2.


    +   If time permits, use some of the techniques discussed in Chapter 16 to further
    refine your moderating technique.


    +   Run a practice session with a colleague acting as your participant.


    +   Run a pilot session with an actual participant at least one day before your
    first scheduled session.'
