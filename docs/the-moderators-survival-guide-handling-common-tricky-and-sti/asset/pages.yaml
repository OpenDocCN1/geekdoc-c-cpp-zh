- pgno: 240
  md: '# 13.3 Participant knows an unexpected amount about you


    > You greet the participant and she says, "So, how do you like your new car?"
    "I saw that you like Jazz music." Perhaps she starts name-dropping people in the
    organization you''re representing. Or she is a remote participant who looks you
    up on Facebook as you''re running the session and shares what she finds. Regardless,
    the participant clearly has a lot of personal information at her fingertips.


    +   - Method(s): Any

    - Frequency: Rare

    - Pattern(s) to apply: Redirect the participant; Disengage from the participant;
    End the session early


    # What to do


    +   - Try to understand the impetus behind the participant''s actions. For example,
    perhaps she was given your name from the recruiting agency you used to schedule
    her and looked you up to make sure you legitimately work at the organization.
    If the participant mentions a relatively harmless excuse for her, then we will
    say, "extensive information gathering," try to ignore any weird comments and move
    forward with the session.


    +   - If the participant starts probing you on your personal life, redirect the
    conversation back to the session to avoid any awkward discussions. Also use your
    tone and language to disengage from the participant by shifting away slightly
    and using a more formal tone, while remaining kind and professional.


    +   - If the participant seems to be researching you or your colleagues while
    on a remote session with her, kindly ask her to stop what she''s doing and focus
    attention on the session.


    +   - If the participant is going out of her way to name-drop and possibly dig
    for more information on the organization or your colleagues, ignore ignorance.
    Even if you know the person she''s talking about, pretend that you don''t be evasive,
    at least until the session is over. Use redirection to keep the participant on
    track.


    +   - If the participant says and how she says moves beyond awkward into disturbing,
    you have every right to protect yourself and end the session early. Similarly,
    if the session starts out fine but the participant''s actions, words, and/or knowledge
    of you is coupled with any feelings of extreme discomfort, take a brief break
    to regroup. At point have your colleague take over moderating or end the session
    early. If ending early, take responsibility with a pretext (e.g., blame the technical
    setup) so as not to tip off that you''re ending the session because of the participant''s
    actions.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 13.3 Participant knows an unexpected amount about you (cont.)


    # What to say


    If the participant knows things about you:


    +   - *Oh, where did you hear here?*

    - *Oh, yes, I love my new car <or other short response>*. So let''s get started....*


    If a remote participant is researching during the session:


    +   - *<Participant>, I''m impressed with your ability to multitask! If you don''t
    mind, please close your windows and programs so that we can stay focused on this
    session.*


    If the participant knows something about the organization you''re representing:


    +   - *<I''m just a consultant/The organization is big> so I don''t actually know
    that person <that/at all>. So let''s get back to....*


    If ending the session with pretext:


    +   - *I''m sorry, we''re going to have to cancel the session due to some technical
    difficulties. Thank you for coming in, and here''s your compensation. Let me walk
    you to our exit. Or, “My colleague, <name>, will walk you to the door.*


    # What not to do or avoid


    +   - Don''t reprimand the participant for looking you up, even if you''re uncomfortable
    or irritated. Treat her in a respectful, professional way.

    - Avoid getting into a personal conversation about your life. Save that for friends!

    - Likewise, avoid giving personal or professional information about colleagues.


    # How to avoid


    +   - Check your social networking settings for LinkedIn, Facebook, and other
    websites to ensure that you''re comfortable with the level of information displayed
    publicly.

    - For a remote testing session, ask the participant at the beginning of the session
    to close out of all nonrelevant windows and applications so she can focus on the
    session.


    # See also


    +   - 11.7 Participant becomes insulting or has an agenda'
