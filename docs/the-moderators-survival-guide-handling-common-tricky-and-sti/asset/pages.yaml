- pgno: 190
  md: '# 10.8 Participant struggles excessively with a task


    > The participant struggles with a task for longer than expected, possibly even
    longer than other participants. He may also be growing visibly upset, frustrated,
    and/or agitated.


    **Method(s):** Usability study

    **Frequency:** Occasional

    **Pattern(s) to apply:** Take responsibility; Clarify the task/question; Redirect
    the participant; Reassure the participant; Take a break; End the session


    # What to do


    Watching where and why participants struggle is a main purpose of performing usability
    studies. Discovering those points will help improve the product for future users
    (Dumas and Loring, 2008). However, excessive struggling can take an emotional
    toll on the participant''s wellbeing, or use up valuable session time that could
    be spent other research questions.


    +   - If the participant is struggling excessively to the point where it is taking
    too much time or no longer providing data that is relevant to your research goals,
    the participant is *not* showing signs of being emotionally distraught, have him
    stop what he''s doing and move on onto the next question or task. If moving on
    requires that you give an assist (as discussed in section 6.4), go ahead and do
    so.

    - If the participant is displaying more emotional discomfort, such as frustration
    or annoyance with the product, or seems to be less engaged in what he is doing,
    take a short break. After giving him a few minutes, check in him privately to
    make sure he''s comfortable continuing. When the break is over, reassure the participant
    that his feedback has been helpful and move on to a different task or question.
    If he becomes more upset, see section 12.7 and end the session early if necessary.


    # What to say


    To move on the current task:


    +   - “That’s as far as we need to go with that. We don’t we...."

    - “Just for the sake of time, I’m going to ask you to....”


    To take a break:


    +   - “This seems like a good stopping point. Why don''t we take a quick five-minute
    break?”

    - “I’m going to turn off our recording equipment, and give you a short break.
    I''m going to step out, but I''ll be back in a few.”'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'While talking in private:


    +   - I don’t want you to continue the session if you’re feeling uncomfortable.
    You’ve already given very helpful feedback. Is there anything I can do to help,
    or would you like to end here?”


    If ending the session, and the participant feels bad:


    +   - Don’t worry about that; I didn’t expect us to get through everything. All
    of your feedback was very important and helpful. I’m glad we spent the time the
    way that we did.


    # What not to do or say


    +   - Avoid saying anything that implies the participant is taking longer than
    you expected, or that he’s failing a task.


    # How to avoid


    +   - This situation is not usually avoidable, but the tone you set at the beginning
    of the session can affect the emotional impact that struggling has on the participant.
    If he seems particularly sensitive or nervous at the start of the session, you
    may need to adapt your moderating style to be more approachable and reassuring,
    as discussed in section 1.6.


    # See Also


    +   - 4.5 Participant has difficulty reading


    +   - 11.8 Participant becomes agitated by a product’s usability issues'
