  md: '# 6.1 Participant is reluctant to say anything negative


    > The participant hesitates before answering questions and his answers are vague.
    You get the feeling that he may be reluctant to say anything negative about a
    product or process.


    Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Reassure the participant


    # What to do


    We see this sometimes when the participants are internal employees of your organization
    (also discussed in section 15.1). The participant may not want to offend the manager
    who taught him the procedure you''re watching as part of a contextual inquiry,
    the team who developed the procedures he is following as part of a usability study,
    or the in-house developers who wrote the software that you''re interviewing about.


    +   - If the participant is overly diplomatic in his responses, you may be able
    to see through his sugar-coating. But less participants may be lying or avoiding
    a question, and it''s usually because they know they are being observed or of
    fear that their feedback may remain confidential.

    - If you suspect that the participant is lying or avoiding a question to spare
    someone''s feelings, try to gently coax the truth out of him. Remind him that
    his feedback will benefit future users and help improve the product. For example,
    you could say, “I want to ensure that any feedback you provide will be used to
    make improvements to the product that will help other users. Your name will not
    be associated with any of our results.

    - If you know a question will be particularly controversial or sensitive for a
    participant, consider prefacing it with something that will make him feel better
    about being candid. For example, if you''re interviewing a call center representative
    about his calls and sense that he is worried about getting in trouble for not
    following them, consider saying something like, “I know that you are trained to
    do things, I''d like to understand more about when you have to do something that
    is different from your training. Please know that any feedback you share will
    be kept confidential.

    - Talk to your observers after the session and remind them to respect the participant''s
    feedback and anonymity, even (and especially) if his feedback was controversial.


    The Moderator''s Survival Guide http://dx.doi.org/10.1016/B978-0-12-404700-6.00006-7

    Copyright © 2014 Elsevier Inc. All rights reserved.'
