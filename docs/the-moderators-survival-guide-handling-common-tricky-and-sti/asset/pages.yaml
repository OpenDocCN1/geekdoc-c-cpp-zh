- pgno: 32
  md: 'Once you''ve understood your role as the moderator and the different styles
    of moderating, you can start thinking about how to handle the different kinds
    of situations that may arise during the session. Some of these situations will
    challenge your interpersonal skills; others will push the limits of your troubleshooting
    and crisis-handling capabilities. Although there are common circumstances you''re
    almost guaranteed to encounter, we can''t predict what might happen. Even after
    years in user research, we''re still surprised (and sometimes delighted, shocked,
    or horrified) by what happens when we-on-one with a participant. This chapter
    provides a set of guidelines (as shown in Table 2.1) to help you decide exactly
    what to do when something unexpected, sticky, or tricky happens during your session.


    +   1. Take a moment to evaluate the situation before jumping to action.

    2. Resolve any threats to physical safety.

    3. Verify that you''re not causing or magnifying the situation.

    4. Check the participant''s comfort level.

    5. Use careful language and tone to probe on the situation and begin to resolve
    it.

    6. Regain control to bring the session back on track.


    Table 2.1: Step-by-Step Guide for Handling Any Situation.


    # 2.1 Take a moment to evaluate the situation jumping to action


    You''re running an interview with a remote participant over the phone. The session
    seems to be going well until the participant doesn''t respond quickly to your
    questions. You hear whisper to someone in the background but can''t understand
    what he says. What, if anything, should you do?


    When you encounter anything outside of expected session circumstances, take a
    moment to step back and evaluate the situation. As the moderator, you keep track
    of so many things that it can be difficult to take that time. By doing so is vitally
    important. Why?


    +   - You need to make sure you understand the cause of the situation so you can
    address it appropriately. Rushing to do or say something may lead you to inadvertently
    make the situation worse or further compromise the results of the session.

    - The situation may resolve itself. In this remote session, a few moments may
    be enough for the participant''s whispering to stop and for you to be able to
    move on'
