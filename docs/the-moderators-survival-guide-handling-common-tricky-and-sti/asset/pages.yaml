- pgno: 223
  md: '# 12.5 Participant has a disconcerting or distracting physical attribute


    The participant has some type of physical attribute that you find distracting
    or disconcerting. Many of these attributes may be relatively unconscious or uncontrollable
    (e.g., a participant who is sweating heavily, blinks constantly, or has a large
    birthmark). Or, the attribute may be a bad habit that you find disgusting or unsanitary
    (e.g., an intense nose picker).


    **Method(s):** Any in-person method

    **Frequency:** Occasional

    **Pattern(s) to apply:** Take a break


    # What to do


    +   - If the participant has a physical attribute that you find distracting (e.g.,
    a birthmark or a large mole), avoid staring at it. Remember to make eye contact
    with him!

    - For a participant who is exhibiting a behavior such as sweating or nose picking,
    offer him something to alleviate his condition without direct attention to what
    he''s doing. For example, if the participant is picking his nose, offer him a
    tissue. If you feel awkward doing even that, try a tissue yourself and using it
    to blow your nose. People tend to sometimes mirror behavior in those types of
    situations. If your participant is sweating, ask him if the room is a comfortable
    temperature—if he says he''s warm, offer to open the door or lower the thermostat
    (if possible), and get him water to drink.

    - The participant may give you a reason for his attribute (e.g., he may have a
    medical condition, or a female participant may say she''s experiencing hot flashes).
    When the participant gives you this information, maintain a neutral expression
    and tone, and accommodate however you''re able.

    - For behavior that you find find, do your best to avoid watching. If you become
    very uncomfortable by it, end the session early using a pretext as technical difficulties.

    - If the participant seems uncomfortable, even after you''ve done your best to
    accommodate him, take a break to see if that helps. If the break doesn''t help,
    and the participant still feels too uncomfortable to provide useful feedback,
    gently end the session early.


    # What to say


    +   - “Would you like a tissue?”

    - “It feels a little warm in here. How is the temperature for you? I want to make
    sure that you’re comfortable.”'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 12.5 Participant has a disconcerting or distracting physical attribute (cont.)


    # What not to do or say


    +   - Don''t call direct attention to whatever you''re finding distracting about
    the participant.


    # How to avoid


    +   - There is no way to avoid this. Instead, be prepared to be respectful and
    empathetic toward participants, no matter what they look or act like.


    # See also


    +   - 4.3 Participant has an unexpected physical feature

    - 12.6 You have to point out something potentially embarrassing'
