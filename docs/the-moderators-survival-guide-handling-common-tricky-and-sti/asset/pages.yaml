  md: '# CHAPTER

    14


    # Safety First:

    Minimizing Emotional and Physical Distress


    When you or the participant experiences emotional or physical distress, you need
    to quickly address that distress. Remember your ethical obligations to the participant
    as well as the need to protect your own well-being and that of your organization.
    Don''t be afraid to end the session if you don''t feel comfortable or safe continuing.


    +   14.1 Fire alarm goes off or the facility needs to be evacuated 257

    14.2 A natural disaster (e.g., earthquake, tornado) occurs 259

    14.3 Participant starts to look ill or otherwise unwell 261

    14.4 You begin to feel unwell while moderating a session 263

    14.5 You notice a bad smell or have an allergic reaction 265

    14.6 Participant seems to be drunk or stoned 267

    14.7 Participant touches you 269

    14.8 Participant''s environment contains dangerous items 271

    14.9 Participant is doing something illegal or threatening 273'
