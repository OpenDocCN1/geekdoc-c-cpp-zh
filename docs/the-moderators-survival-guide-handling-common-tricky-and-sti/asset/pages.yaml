- pgno: 28
  md: '![](img/a21e37d9c044778903fdc14dde5d4ca5_28_0.png)


    Figure 1.2 Different moderating styles are appropriate depending on your research
    goals, how prescribed your study plan is (fluid to rigid), and how you want to
    approach the participant (engaged vs. disengaged).


    calls for rolling with the punches. Likewise, your preferred moderating style
    might not be suitable for a particular kind of study, participant, or situation,
    and you may have to transition to another-the-fly. This is when your flexibility
    is reality put to the test!


    The best style to use depends on how you need to interact with the participant
    as discussed in Table 1.1 and where your study goals fall on the quadrant shown
    in Figure 1.2. Each style falls somewhere within the range of rigid fluid (based
    on your research goals and how much you need to follow a prescribed structure
    of your study plan) and engaged versus disengaged (how you need to interact with
    the participant at any given time).


    You''ve read about the differences between moderating styles in Table 1.1, but
    let''s take a more detailed example here. Consider a contextual inquiry where
    you have a participant who you''re trying to keep focused on demonstrating your
    workflow. Contextual inquiries are typically fairly fluid, and you''re fairly
    friendly and casual moderator, so you''ve started with a style similar to Inquisitive
    Mind. However, the participant''s talkativeness, can be so informal and off-topic,
    pulling her away from the natural workflow you''re trying to observe. The session
    may quickly snowball into an interview or conversation. The best way to adapt
    is to transition to a Down to Business style with the goal of slightly disengaging
    from the participant. You don''t want to disengage so much that the participant
    becomes uncomfortable, just enough so that she knows you''re there for the serious
    business of watching her work.


    We talk more about the moderation pattern of disengaging from the participant
    in section 3.6.'
