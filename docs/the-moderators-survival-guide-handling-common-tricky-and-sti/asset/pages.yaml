- pgno: 116
  md: '# 6.6 Participant not approaching workflow naturally


    The participant demonstrates the “correct” way of going through his workflow.
    Perhaps he highlights the fastest way to accomplish his workflow, demonstrating
    his competence rather than how he usually gets things done.


    Method(s): Usability study; Contextual inquiry

    Frequency: Occasional

    Pattern(s) to apply: Clarify the task/question; Reassure the participant


    # What to do


    Because he is being observed, the participant may feel like he is being evaluated
    even if you assured him he is not. He may want to look competent, fast, or smart.
    He may not want to get into trouble for failing to follow procedures. These factors
    may keep the participant from behaving naturally.


    +   Since it is difficult to tell if a participant is approaching something naturally
    or not, look for these signs:

    - He seems to struggle with a lot with that he supposedly does on a regular basis.

    - He uses descriptions like “we do ...” or “we then have to do ...” rather than
    “I do ... ”

    - He seems nervous, looks at you frequently, and/or otherwise acts like he is
    being evaluated. For example, he says, “Are you going to grade me on?”

    - Instead of showing you the workflow, he describes the process, even after you
    prompt him himself.


    When you notice these happening, clarify with the participant that you want to
    see what he actually does, even if it''s not official procedure or the most efficient
    way to do it.


    If the participant expresses afraid of getting into trouble because of what he
    shows or tells you, talk to him about how the collected data will be used (e.g.,
    the data are kept confidential and aggregated before they’re shared with the project
    team). Reassure him that he is not being evaluated in any way.


    # What to say


    +   - “In a normal work week, how often would you do this?”

    - “Is this how you typically do this task day-to-day?”

    - “About what percentage of the time you would say that you do it this way?”'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 6.6 Participant not approaching workflow naturally (cont.)


    +   What are some other ways you’ve tried approaching this task before?


    +   I am here to watch how you work so that I understand what does and doesn’t
    work well for you. We then take this information and use it to design a better
    experience. Just to be clear, I am not here to evaluate your skills or how you
    do your job.


    +   Please know that anything you say or will not be associated with your name.


    # What not to do or say


    +   Don’t joke about evaluating the participant.


    +   Don’t tell the participant that he is doing a good or bad job.


    +   Don’t act entitled to watch the participant work, especially if someone signed
    him up for it. Instead be appreciative that you’re able to watch him and behave
    as if he is doing you a favor.


    # How to avoid


    +   In the recruiting communication to the participant, try to make it clear what
    your role is, why you’re there, and how the information will be shared/used.


    +   If you’re doing a contextual inquiry onsite, try to provide a short general
    briefing to all the participants you’ll be talking with when you arrive. This
    briefing can help set context for what you’ll be doing, how you’ll collect data,
    and what you’ll do with the results.


    # See also


    +   5.5 Participant treats a contextual inquiry like an interview'
  merge: -1
