  md: '# 5.6 Participant brings someone else to participate with her


    > You have scheduled a participant for a one-on-one session. However, when she
    arrives (or when you call her if she is remote), she has brought one or more additional
    people with her to participate as well. This other person may be a coworker, her
    manager, or a friend who thinks would be interested as well.


    Method(s): Any

    Frequency: Rare

    Pattern(s) to apply: Take responsibility


    # What to do


    When you''re running a study within an organization, this misunderstanding may
    occur participants (or the people recruiting the participants) don''t understand
    the purpose of your research and assume that it''s a training or sales session.
    Or the attendees may just be interested in what you''re doing and want a chance
    to provide their own feedback. The best thing to do in this situation depends
    on who the other attendees are.


    If the other attendees have similar roles/responsibilities (or fit the original
    recruit criteria) as the participant:


    +   - Schedule additional sessions to talk to the other attendees, and proceed
    one-on-one with the original participant. This technique may be appropriate if
    you have additional time slots available.

    - Turn the session into a codcovery session. This technique may be appropriate
    if there is only one additional attendee who cannot be scheduled for a separate
    session, and the session is a usability study or interview.

    - Talk to each attendee separately, one-on-one, for a shorter period of time.

    - Make sure to give or send consent forms to the additional participants and have
    them review and sign the form before continuing the session.


    If the other attendees have different roles/responsibilities (and do not fit the
    original recruit criteria) or are the participant''s manager, family, or friends:


    +   - Explain to the other attendees that your goal is to talk one-on-one with
    the original participant and that, while you''re excited that they are so interested
    in giving feedback, you need to leave the room. If they have a misconception that
    they''ll be missing out on something, clarify that you''re not providing any kind
    of training.'
