  md: 'If the participant reaches a point wraps up, you’re obligated to give him his
    agreed-upon compensation and thank for his time and help. You can check on afterwards
    (whatever means you originally scheduled him for the session; if he scheduled
    by a recruiter to follow up). If appropriate (e.g., if he was distraught due to
    external circumstances), you can offer to reschedule for a more convenient time.


    # SETTING CONTEXT FOR YOUR BEHAVIOR


    The first few times a usability study participant hears you respond to questions
    with questions ("What were you expecting?"), or when you do not respond at all,
    he may become unsure ("I don’t know, that is why I’m asking you!"), or even sarcastic
    ("You’re not going to tell me, anyway"). Lock of response may lead him to feel
    he is being tested, as much as you say otherwise.


    You can set the context for your behavior at the beginning of the session, and
    reinforce it along the way. In your precession instructions, tell the participant
    something, "If you ask me questions, I may not answer you or I may be vague. If
    I''m doing that, I''m not being unfriendly; I''m just trying to stay neutral..."
    Another helpful to say the first time he asks you a question, "So I''ll actually
    turn that question around you; what would you expect to happen there?" By doing
    this, the participant can start anticipating your moderating approach and will
    feel less he is being evaded or probed. Also remember that your paralanguage—how
    you say what, your intonation, loudness, or tempo—can have an effect on the message
    communicated. There is a big difference between responding to a question with,
    "What do you think?", "What do you think?" and "What do you think?" The first
    may come across as inquisitive, whereas the second and third might come off as
    rude or patronizing.


    If a participant keeps asking questions over the course of a session, we sometimes
    resort to subdued humor to make light of the situation. For example, we might
    kindly say, "I''m going to plead the fifth here—like I said, I''m just here to
    observe. Tell what you''d expect it to do?" (works if you''re in the United States),
    or "I''m going to turn that around on you again! What do you think?" Again, if
    your delivery and paralanguage is kind and not patronizing, usually the participant
    will laugh along, stop answering from from you, and resume voicing expectations
    on his own.'
