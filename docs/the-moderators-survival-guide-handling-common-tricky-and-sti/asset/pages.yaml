- pgno: 302
  md: '# APPENDIX B: PREPARING FOR A SUCCESSFUL SESSION


    Follow this checklist as you prepare for your research study. These tips will
    help you make sure that you do everything possible to reduce or minimize the chances
    of unexpected or sticky happening. While we always hope for the best when it comes
    to our participants and study setup, it never hurts to plan for the worst.


    For more information about these topics, refer to Chapter 15.


    # The recruiting process


    +   Discuss the recruit criteria with your stakeholders:

    - How many participants do you need (remember to account for possible no-shows)?

    - Do you need floater or backup participants?

    - If you don''t recruit floater or backup participants, are there surrogate users
    at your study location who may be able to fill in for a session on short notice?


    +   Identify your key criteria, whether in a formal recruiting script that can
    be used by external recruiters or a checklist that you can use when scheduling
    participants on your own:

    - Explain who and what the study is for, how long it will take, where it will
    be held, and what (if any) compensation will be offered.

    - Make sure they understand that it will be one-on-one.

    - Specify if the session will be recorded (and if so, what exactly will be recorded)


    +   - Be specific about the experience/skills required.

    - Ask about the criteria in a way that makes it hard to tell what your desired
    answer is. For example, ask “What is the make and model of your car?” “Do you
    have a Toyota Prius?


    +   - Check to make sure you can understand the participant.

    - If you (or else at an organization) will be scheduling internal employees:

    - Reinforce that they are not required to participate.

    - Recruit a representative sample of users rather than just the best or most vocal.

    - Assume that they''ll not be watched by their manager or members of their own
    team.


    +   - Ask for the best phone number you can use to contact them, and give them
    a way to directly get in touch with you if necessary.

    - If you''ll be going to the participant''s location, ask if there are any restrictions
    on what you can bring with you (e.g., cameras, USB flash drives) or if you''ll
    need to arrive early to go through any additional security.'
