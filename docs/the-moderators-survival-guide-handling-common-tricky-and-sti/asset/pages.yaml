- pgno: 60
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # What to do


    Once you realize that your study plan isn''t working, decide if you can adjust
    the method to a form of research that better matches the participant''s qualifications
    or mental state. For example, if you''re running a usability study of a bank''s
    online account opening process and the participant says they''d only open an account
    at a branch, you might adjust your questions and tasks to more of an interview
    format to learn if she has opened an account at a branch before, what the experience
    was like, and how it could be improved. Or, if you''re interviewing a nurse about
    her interactions with patients but learn that she primarily deals with administrative
    tasks instead, you can change the focus from asking her questions to the workflow
    she has to follow to accomplish her tasks.


    It sometimes helps to use this pattern in conjunction with taking a break so that
    you have time to talk to your stakeholders about your revised plan.


    To be successful at this pattern, you must have a solid understanding of the research
    goals and how your findings are being used. This understanding is key in determining
    if this pattern is appropriate and, if so, how best shift a session''s focus to
    yield useful feedback.


    # See pattern in use


    You can see this pattern being used in situations such as:


    +   - 4.2 Participant either refuses or can''t do a key task

    - 7.3 Facility loses its Internet connection


    # 3.9 End the session early


    Ending a session is your last resort when other strategies have not—or could have—been
    successful.


    # When to use


    If the participant is not responding to your efforts to make her more comfortable,
    or if external circumstances make it difficult or impossible to continue, you
    may need to end the session and cut your losses. This pattern may be appropriate:


    +   - If the participant is a misrecruit and there is no way to adjust the session
    to get feedback from her.

    - If the participant seems excessively upset or unable or unwilling to continue.

    - If you''re worried for your safety or that of the participant''s.

    - If technical or environmental issues make it difficult or impossible to continue.'
