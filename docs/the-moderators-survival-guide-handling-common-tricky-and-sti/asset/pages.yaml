  md: "# 15.4 Your observers\n\nBy sharing your moderating approach and establishing\
    \ ground rules ahead of time, you can decrease the odds of your observers disrupting\
    \ your session.\n\n# Communicate your moderating approach\n\nAs you work with\
    \ your team to create the study plan, set expectations with your potential observers\
    \ about how you're going to moderate during the session. The detail level you\
    \ need to go into will vary depending on how familiar they are with user research\
    \ in general, the specific method you're using (e.g., contextual inquiry), and\
    \ your particular moderating approach. Here are some things to consider over:\n\
    \n+   - You may not follow the study plan in its exact order, or use its exact\
    \ wording (if you are confident and experienced enough to take this approach).\
    \ You might reprioritize goals on-the-fly based on what the participant says or\
    \ does, or probe with follow-up questions wherever necessary.\n\n+   - You may\
    \ let the participant go off brief tangents and act interested in irrelevant things\
    \ to let the participant feel heard.\n\n+   - You may not answer the participant's\
    \ question, or pretend not to know an answer even if you do (and that is not an\
    \ invitation for someone to come and give you the correct answer!).\n\n+   - When\
    \ probing for something specific—a goal, or understanding more behind something\
    \ the participant did or didn't—you may start with broad questions and narrow\
    \ down to more and specific questions. For example: “What did you think of that?”\
    \ “What did you think of how this worked?” “What do you think this button does?”\n\
    \n+   - You might drift a topic, redirect to another as a division, and come back\
    \ to the first topic later (see Chapter 3 sidebar “The Diversary Assist”).\n\n\
    +   - If you're doing a usability test:\n  - You may let the participant struggle\
    \ for the sake of uncovering findings, ultimately the participant's comfort is\
    \ the first concern. There will be times you need to sacrifice “data” or be es\
    \ strict about observer behavior for the participant's well-being.\n  - Explain\
    \ what an assist is, and when and how you give participants assists.\n\nBy setting\
    \ these expectations, you can help prevent an observer from making assumptions\
    \ (e.g., assuming that you were leading when you were giving an assist). It will\
    \ also keep them from interrupting a session because they don't understand what\
    \ you're doing and you need additional information or assistance."
