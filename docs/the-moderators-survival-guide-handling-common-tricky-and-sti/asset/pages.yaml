- pgno: 54
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # When to use


    Participants may become stressed or nervous about their performance during the
    session and need some gentle reassurance. This pattern may be appropriate:


    +   - If the participant blames herself or is self-deprecating.

    - If the participant seems nervous, uncomfortable, or hesitant.

    - If the participant asks if she is doing a task correctly.


    # What to do


    Remind the participant that you''re not testing her in any way, and that you''re
    a neutral observer who wants her feedback, positive and negative. If you didn''t
    design the product, you can let her know that well. You can provide similar assurances
    during an interview or contextual inquiry to assure the participant you''re a
    neutral party who is interested in her experience. If the participant needs reassurance,
    let her know that the feedback she is providing is helpful and will help the team
    make the better product.


    This pattern also includes reassuring the participant that she can take a break
    and leave whenever she wants. Your reassurance should make her feel that you''ll
    do your best to make—and keep her comfortable, even if you don''t explicitly say
    so. Remember your ethical obligations to the participant and your best to ensure
    she''ll leave the session feeling no worse—and ideally better—than she did when
    arrived.


    For more on what kind of feedback is appropriate to provide, see the sidebar "Tell
    a Participant Her Feedback Is Helpful”


    # See pattern in use


    You can see this pattern being used in situations such:


    +   - 8.4 Participant is self-blaming

    - 10.8 Participant struggles excessively with a task


    > SHOULD YOU TELL A PARTICIPANT HER FEEDBACK IS HELPFUL?


    You may tell a participant that her feedback is the kind of feedback you''re looking
    for or it is helpful. We feel it''s useful to provide this reassurance because
    it allows you to be more proactive and reactive about reassuring her.


    Unfortunately, there are a few common minions of this approach:


    +   - Feigned interest: If your tone sounds rude or machine-like, telling a participant
    that her feedback is good or helpful can come across as disingenuous.


