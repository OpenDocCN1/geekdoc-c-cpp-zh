  md: "# 13.1 Participant curses or makes inappropriate comments\n\nThe participant\
    \ starts with \"cursing\" constantly. Perhaps she sprinkles in some rude and discriminatory\
    \ remarks and jokes. Depending on your political leanings, race, gender, sexual\
    \ orientation, etc., you may feel personally offended by the salty language or\
    \ inappropriate comments. In some cases the participant may look to you for affirmation\
    \ that she's being funny, wanting you to laugh along or share your opinion on\
    \ the topic.\n\n+   Method(s): Any\nFrequency: Occasional\nPattern(s) to apply:\
    \ Redirect the participant; Disengage from the participant; End the session early\n\
    \n# What to do\n\n+   If the participant is cursing, consider the severity and\
    \ frequency of the language. If she's occasionally using a \"bad\" word, or frequently\
    \ using less severe language (basically anything censored on TV), try to ignore\
    \ it and avoid a visible reaction. If the participant is constantly cursing in\
    \ an offensive manner or using really objectionable words (the censored kind),\
    \ simply ask the participant to keep her language clean. Be friendly but firm.\
    \ You can also remind the participant that she's being recorded and/or observed.\n\
    If the participant says something discriminatory (i.e., hostile toward race, religion,\
    \ sexuality, gender, age, disability, etc.), consider the frequency of the comments\
    \ if it happens once, ignore it and move on without acknowledging the comment\
    \ even if her insult felt personal or was directed toward a group you identify.\
    \ For example, if the participant makes an aside about how incompetent women are\
    \ (and you're a woman), just ignore the statement and continue with the session.\
    \ Avoiding validating the participant by laughing along and agreeing. If the participant\
    \ is looking for an acknowledgment that you heard her, or repeats the comment\
    \ to make sure, use a polite neutral smile and immediately redirect the conversation\
    \ to avoid awkward silence or continued conversation.\n the participant uses discriminatory\
    \ language and take it personally, or you feel some moral obligation to say something,\
    \ think very before responding. If the participant was not next to you in the\
    \ grocery store, you may be tempted to give her a talking to. But you're moderating\
    \ on behalf of an organization, it's important to stay cool and professional.\
    \ Try not to bring your personal life and beliefs into the conversation. Instead,\
    \ simply ask the participant to stay focused on the topic at hand and avoid any\
    \ controversial statements."
