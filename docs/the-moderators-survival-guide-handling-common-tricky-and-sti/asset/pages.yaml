  md: '# 4.1 Participant does not seem to meet a key recruit criteria


    Your recruit criteria were very specific about certain qualifications that participants
    should have. However, when the participant arrives, he seems to not actually meet
    those qualifications.


    Method(s): Any

    Frequency: Frequent

    Pattern(s) to apply: Take responsibility; Reassure the participant; Shift the
    focus


    # What to do


    +   First, verify that the participant does not actually meet the desired criteria.
    One way to do this is to let the participant know the information you have about
    him indicates that he has a specific qualification, and ask him directly if that
    is correct. If you''re looking for participants who perform a certain type of
    task, ask the participant to describe his role, and in particular, what he does
    regarding the task that you''re interested in. Another way is to be subtle with
    your line of questioning, that it comes off as normal background questions. That
    way if you immediately take a break and/or end the session, the participant won''t
    feel like it''s his qualifications that caused the problem.


    +   Keep in mind that the participant arrives, you''re obligated to provide him
