- pgno: 160
  md: '# 9.3 Participant receives a call during the session


    During your session, the participant receives a call on her mobile phone. Ideally,
    the participant immediately turns off the phone or ringer so this doesn''t happen
    again. However, sometimes the participant answers the call and proceeds to have
    a conversation with the caller. She may forget that the session is being recorded
    and that she is being observed.


    +   - Method(s): Any

    - Frequency: Frequent

    - Pattern(s) to apply: Take a break


    # What to do


    +   - Let the participant chat for a few seconds, as she may immediately tell
    the caller that she''ll call them later.


    If the participant talks on the phone for more than 15 or 20 seconds, take the
    following steps:


    +   - Remind her that she is still being recorded, or just pause/turn off the
    recording if she has an easy way to do so. The reminder may encourage her to get
    off the call quickly.

    - If the participant is remote (e.g., she is on her office speakerphone with you
    but you hear answer her mobile phone):

    - Ask the participant to mute herself and unmute when she is free.

    - If the participant is gone for a long period of time, speak up on the call to
    get her attention, or contact her through the screen-sharing chat feature or email
    to gauge when she''ll be able to resume the session.

    - If the participant is in-person:

    - Mute the audio for observers. If you don''t have a quick and easy way to cut
    off the sound (e.g., because your observers are in an observation room part of
    a usability setup), remind the participant that she can still be heard in another
    room.

    - If the participant continues to talk and the conversation doesn''t seem to be
    ending soon, stop the recording and take a break.

    - If it seems like an important phone call, you can also offer to bring the participant
    to a private room.

    - Once taking a break, check back in with the participant after five minutes or
    so and ask how much longer she''ll be so you you can plan accordingly.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 9.3 Participant receives a call during the session (cont.)


    +   - When you resume the session, consider asking the participant to mute or
    put her phone on a silent mode for the remainder of the session. If the participant
    says she needs to keep the phone on andor says she is dealing with an important
    situation, understanding, but prepare yourself for subsequent interruptions.


    +   - If it seems like the participant is distracted and/or upset by the call,
    you may need to take some additional care to keep the participant comfortable
    and reevaluate the plan for the session. See section 12.3 for additional tips
    about this situation.


    # What to say


    +   - “Sorry to interrupt, but I just wanted to remind you that you’re still being
    recorded. Should you pause the recording?”


    +   - “Let’s take a short break so we can finish this conversation. I’m going
    to turn off the sound/you might need to step outside/let me bring you to another
    room, because others can hear you right now.”


    If the participant is remote:


    +   - “<Participant>, there are some observers on the line and we want to be respectful
    of your privacy. Can you go ahead and mute this conference call and unmute when
    you’re done?”


    # What not to do or say


    +   - Even if you want to, do not snap at the participant. Give her the benefit
    of the doubt—even if you think she is dealing with a frivolous situation, you
    don’t truly know what is going on.


    # How to avoid


    +   - Ask participants to turn off or at least mute their phone at the beginning
    of the session.


    # See also


    +   - 9.7 Session interrupted by someone the participant knows'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 9.4 Participant cancels or is a no-show


    > Your session''s scheduled start time has come gone, and you find out that the
    scheduled participant can no longer make her timeslot. Or, you waited for a while
    and the participant does not show up and you consider her a no-show.


    Method(s): Any

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility, Shift the focus


    # What to do


    +   If the participant canceled, let any observers know that the scheduled participant
    will not make it. If the observers are upset, try to absorb the responsibility
    as much as possible rather than blaming the participant or recruiter, which can
    come across as unprofessional. If the observers include stakeholders, use this
    opportunity to refocus the conversation and discuss the best use of the session
    time moving forward.


    +   If you have a scheduled backup or floater participant (discussed in section
    15.1), you can start the session with her. Keep in mind that if you''re starting
    the session late, you may need to shift the focus of the session by adjusting
    your method or study plan to accommodate a shortened session duration.


    +   If you don''t have a scheduled backup or floater participant, decide if it
    would be appropriate to find someone onsite who is either qualified for the study
    on her or act as a surrogate user. This technique is most appropriate when you
    have a very general set of recruit criteria. If you leverage a surrogate user,
    make sure to manage expectations and appropriately weigh that person''s feedback
    when discussing results with stakeholders.


    # What to say


    Let observers know about the cancellation or no-show:


    +   It looks like the participant isn''t coming. Would you like me to look for
    a replacement in this office as a surrogate user? It won''t be an actual user
    so we''d have to weigh the results carefully, but we have the timeslot and may
    get some insightful feedback.


    If the observers are upset about the no-show:


    +   I know you <flew out here/cleared time in your busy day/etc.> specifically
    to see these sessions! I''m sorry that we''re unable to secure a participant for
    this session; we''ll make sure to confirm again for the other participants. Let''s
    talk about what best use of this time may be....'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 9.4 Participant cancels or is a no-show (cont.)


    # What not to do or say


    +   Don''t badmouth or otherwise disparage the no-show or canceled participant,
    even if you''re frustrated over the situation. Remember to stay professional.


    # How to avoid


    +   Make sure that the recruiter is clear with scheduled participants that they
    will be participating in a one-on-one session. Participants may feel guilty about
    canceling if they assume that they are in a focus group and will be covered by
    other people.


    +   Set expectations with observers that no-shows and cancellations happen, and
    work with them to establish appropriate backup plans for the best of time when
    it does.


    +   Schedule backup or float participants for sessions when it''s extremely important
    to not have a late or no-show participant (e.g., if you have observers flying
    in out of town to observe your research, or know that important stakeholders will
    be watching a particular couple of sessions).


    # See also


    +   9.1 Participant is running late'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# 9.5 Observer unexpectedly interacts with the participant\n\nBefore the session,\
    \ you asked an observer to sit in the room with you and quietly watch the session.\
    \ If the session is remote, you may have an observer listening on the call with\
    \ you. You asked your observer to hold any questions until the end. However, while\
    \ you're moderating, she interrupts and begins to interact directly with the participant.\
    \ Or, if the observer is watching from another room (like a usability study's\
    \ control or observation room), she may come into the research room to talk to\
    \ (or at) the participant.\n\n| Method(s): Any |\n| Frequency: Occasional |\n\
    | Pattern(s) to apply: Responsibility; Reassure the participant |\n\n# What to\
    \ do\n\n+   - First, quickly try to figure out why the observer felt need to interrupt,\
    \ and what tone she is taking with the participant. She is probing for more detail\
    \ based on something the participant said or did? Or is she defensive about the\
    \ product or topic being discussed, and is trying to clarify an assumption or\
    \ constraint? Or, is she verbally attacking the participant for not understanding\
    \ a concept or for doing something she didn't agree with?\n- If the observer is\
    \ following up on something that the participant said and is not being emotional\
    \ or argumentative, you might let the participant answer the question as long\
    \ as it won't take you too far off the study plan and the research goals. However,\
    \ you may also need to ask the observer to go back to quietly observing (and if\
    \ she is remote, to mute her phone) and hold off on additional questions until\
    \ the agreed-upon time.\n- If the observer is asking a question that comes as\
    \ defensive, gently reward her question for the participant so it sounds neutral.\n\
    - If the observer is remote:\n    - Remend everyone listening to keep their phones\
    \ muted. If for questions from the observers, remind them of that as well.\n \
    \   - If your remote observer is being argumentative or accusatory and you're\
    \ using a screen-application, use any available options for muting an attendee's\
    \ audio (e.g., in WebEx right-click/contextual-click on the observer's name to\
    \ mute her). While extreme, keep in mind that your first responsibility is to\
    \ provide a safe and comfortable environment for the participant and that the\
    \ observer is violating that rule.\n- If the observer is onsite and has entered\
    \ your research space, get the observer to return to the observation space and\
    \ stay there for the remainder of the session. You may need to get up and walk\
    \ her out of the room with you."
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 9.5 Observer unexpectedly interacts with the participant (cont.)


    +   If the observer continues to be argumentative or problematic, take a quick
    break so you can talk with her privately. Pay careful attention to how the participant
    reacts to the interruption and adjust accordingly. If the participant seems nervous
    or scattered, adjust your tone to be calm, focused, and reassuring. Reset the
    context for what you were doing before the interruption. For example, you can
    ask the participant to re-read the task or summarize what the participant had
    been talking about. Take a quick break if the participant seems especially rattled.


    # What to say


    At beginning of a remote session to observers, before calling the participant:


    +   “I’m about to call the participant. Just a reminder to everyone to keep your
    phones on mute for the duration of the session. Please check to make sure you
    are on mute.”


    If the observer is asking questions:


    +   “<Observer>, I appreciate your perspective on. <Participant>, let us know
    what you think, and, for the sake of time, I’d like to get back to our planned
    questions. If we have time at the end of the session, we can pursue this topic
    further.”


    +   “I’d like to bring up this issue to the <task>question>. Let’s come back to
    this issue at the end of the session,”


    +   “(For a remote session) Just a reminder that all observers keep their phones
    on mute. There may be a chance for additional questions at the end of the session,
    but for now we need to return to our planned questions.”


    If the observer asks innocent questions that were inadvertently leading or accusatory:


    +   “<Participant>, what <observer> meant to ask was <phrase neutrally>.”


    +   “<Observer>, please keep in mind that <participant> is here to help us improve
    the product. It’s good for us to see how she thinks about approaches and this.
    There are no wrong answers here. Now, I’d like to bring us back to <task>question>…”,


    +   “<Observer>, let’s step outside for a moment.” (Once outside): This session
    is meant to be one-on-one with me and the participant. Your interactions with
    the participant seem to be making her uncomfortable. I don’t want her to feel
    evaluated, and I’m worried we won’t be able to accomplish the goals of this session
    if you continue. It would help if you could just observe and remain quiet for
    the rest of the session. Does sound okay to you?”'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 9.5 Observer unexpectedly interacts with the participant (cont.)


    # What not to do or say


    +   - Don''t let the observer take the session.

    - Don''t engage a verbal altercation with the observer in front of the participant.
    If the conversation gets heated, bring the observer outside of the research space
    and out of the participant''s earshot.


    # How to avoid


    +   - Provide explicit grant rules to your observers ahead of time to remind them
    to be respectful of the participant and the goals for the research (see section
    15.4 for more about this). These rules should also specify what kind of interaction
    (if any) they''re allowed to have with the participant. Stress the importance
    of maintaining control of the session so the participant always knows who to talk
    to. There are some examples of what observers can get you their questions:

    - Ask observers to write down their questions for you to ask at the end of the
    session (or for them to ask, if you''re comfortable letting them do). We recommend
    this this approach as is the easiest and least distracting to implement.

    - When an observer is in the room, have pass notes with questions to you. Let
    the participant know about this ahead of time so she is not surprised or distracted.

    - When observers are remote or located in another room, have them use an instant-message
    program to communicate with you in the middle of the session.

    - If your session is remote:

    - At the beginning of the session, before the participant is on the call, let
    remote observers know that the session is about to begin and please mute their
    phones.

    - Take advantage of any available options within your research testing application
    and/or conference calling system to automatically mute all observers. Tell observers
    ahead of time that they should mute their phones when they join the call—you can''t
    be too careful!


    > Watch Video 5 to see an example of a moderator dealing with an interrupting
    observer during a contextual inquiry. The moderator pulls the observer out of
    the room to reiterate the session ground rules.


    Visit our website (http://www.modsurvivalguide.org/videos) to use your QR reader
    to scan this code.


    ![](img/a21e37d9c044778903fdc14dde5d4ca5_166_0.png)'
  merge: -1
  img_proc: true
