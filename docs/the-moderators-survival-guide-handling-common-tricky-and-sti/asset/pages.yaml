- pgno: 292
  md: 'Even better than asking for feedback as a one-time thing, consider finding
    one or more colleagues to be recurring “moderating mentors.” Ask your mentors
    to observe your user research studies, either via real time or recordings, and
    pay attention to the items previously listed. Having a mentor at every study will
    help you understand how you''re improving over time. benefit of having multiple
    mentors is receiving feedback from moderators with multiple perspectives and styles
    so you can begin to calibrate your approach.


    However, we know that not everyone has the luxury of working with a team of user
    researchers. If you are a “team of one” and don''t have any colleagues to provide
    feedback, reach out to local (or national) user experience groups to see if they
    can pair you with a more experienced mentor. Even if your mentor is in a different
    physical location, the Internet has made it easier than ever to share recordings
    and watch sessions remotely.


    # Practice with someone


    If you''re just starting your career, you may be nervous moderating with a real
    participant in front of your stakeholders. The best way to reduce your nervousness
    is by practicing as much as you can! Grab a colleague or family member as the
    participant. If you''re not sure what to ask, try something like:


    +   Do you have later this afternoon? I need a participant for a practice session.
    I''d go through the script I''ll use with actual participants, but I wouldn''t
    be recording you or using any of your feedback.


    You can use a study plan that you''ve used for research as long as you do not
    violate any confidentiality agreements you have in place with your stakeholders.
    Another option is to adapt a study plan for a product that is publicly available
    (a usability study or contextual inquiry), or a different topic (for interim).


    Go through the session till end, starting welcoming the participant and going
    all the way through thanking him for his time. Do your best to pretend that this
    is an actual session with a participant who doesn''t know.


    Record the session to watch


    Practicing isn''t just for new or inexperienced moderators. Even experienced moderators
    can benefit from additional practice, especially if you give the participant free
    reign to act'
