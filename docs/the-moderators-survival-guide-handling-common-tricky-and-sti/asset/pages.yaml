  md: '# # CHAPTER 11

    Take the Wheel:

    Giding Wayward Participants


    If the participant becomes agitated, annoyed, or disparaging toward you or your
    organization, it''s time for you to take the wheel of the session. These situations
    require you to diffuse the participant''s frustration, and then monitor the session
    going forward to ensure the rest of her experience is not negatively affected.


    +   11.1 Remote participant is obviously distracted 195

    11.2 Participant is distressed by a personal line of questioning 197

    11.3 Participant insists that she would never do something 199

    11.4 Participant is frustrated by the prototype''s limited functionality 201

    11.5 Participant seems annoyed at your neutrality 203

    11.6 Participant does not seem to respect you or take you seriously 205

    11.7 Participant becomes insulting or has an agenda 207

    11.8 Participant becomes agitated by a product''s usability issues 210'
