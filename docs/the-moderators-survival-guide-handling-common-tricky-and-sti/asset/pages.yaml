- pgno: 294
  md: '# CHAPTER 16


    focused on new or inexperienced practitioners and may be less useful for someone
    who wants to refine their skills.


    Refer to Appendix C to see a list of user resources that focus on specific methods.


    # Listen to stories from other moderators


    The great thing about listening to stories from other moderators is that you can
    learn without needing to go through the experience yourself. It''s not as powerful
    as experiencing it yourself, even in a practice setting, but learning vicariously
    gives you a framework for thinking about how you might deal with similar situations.
    While this book is helpful in this respect, we encourage you to reach out to others
    in your research community so you can learn from each other.


    # 16.2 Integrating tips and feedback


    Of course, becoming a better moderator isn''t as simple as taking feedback and
    tips and just doing it. These techniques won''t immediately make you a superstar
    moderator—like most skills, moderation takes lots of practice, over a long period
    of time.


    Once you''ve sought out available resources, practiced, and received feedback
    on your moderation, take an incremental approach rather than trying to change
    everything at once. You have a lot to think about during research sessions, and
    you don''t want 80% of your brain power going to generalizing your performance.
    Revisiting the metaphor of improvisational comedy, the best scenes come when the
    players are not "in their heads." In other words, if you''re thinking too hard,
    you''re blocking the passageways for the instincts formed by all of training,
    practice, and feedback you received up until that point. The same is true for
    moderating—don''t get stuck on acting and reacting perfectly, or you''ll freeze
    up.


    Instead, plan the incremental changes that you can make. When you run your next
    session (even if it''s just for practice), focus on one or two small things that
    you want to improve about your moderation. Make a note for yourself about it in
    your study plan so you have an additional reminder. Aside from those small things,
    free yourself to think on your feet and use your instincts to respond genuinely
    to the participant and acquire solid research findings. Focus on the thing across
    a few sessions or even an entire study. Then, for the next session, focus on another
    area you want to improve.


    Each change is a baby step, but those steps are incredibly effective.


    As an example of how to plan out changes, let''s say you''ve received feedback
    from a colleague saying you tend to cut off the participant, answer questions
    too soon, and unconsciously tap your pen on your clipboard. In your next session,
    focus on addressing the problem of cutting off the participant. Try deliberately
    to let him finish his thoughts before saying anything. You may have to do this
    for a few sessions until you feel like you''re not


    # 301'
