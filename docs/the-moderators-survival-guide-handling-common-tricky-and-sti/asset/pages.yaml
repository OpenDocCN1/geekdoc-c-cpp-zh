- pgno: 299
  md: '# APPENDIX A: WHAT TO SAY


    Knowing what to say, and when, is one of the biggest challenges in moderating,
    especially when you''re just starting out. Here are some of the phrases that we''ve
    found to be effective throughout a session. You''ll notice that in many cases,
    we show a lot of different ways to say the thing. Try them all and see which variations
    feel comfortable for you.


    | Desired Effect | What to Say |

    | --- | --- |

    | Set expectations | "If you ask me questions, I may not really answer you or
    I may be vague. If I''m doing that, I''m not being unfriendly; I''m just trying
    to stay neutral." |

    | Provide a neutral acknowledgment | "Mnhhm."

    "Okay, thank you."

    "Okay, thanks for that."

    "That''s good to know."

    "That''s helpful for us to know." |

    | Turn a question around | "I want to stay neutral, so I''m going to turn back
    on you—what are your thoughts on this?"

    "If you were doing this at home, and I wasn''t sitting next to you, what would
    you do?"

    "I''m not sure, but tell me more about what you''re thinking here..."

    "What matters is your experience, which we can learn from. Tell me more about
    what you''re experiencing here"

    "My opinion isn''t important to the team—we''re here to talk about yours. What
    do you think?" |

    | Prompt a silent/nonresponsive participant | "What are you trying to do right
    now?"

    "I may ask what you''re thinking about right now?"

    "What are you thinking right now?"

    "What is going through your mind right now?"

    "What are your thoughts on this?"

    "What are your thoughts on how that worked?"

    "I''d like to remind you to try to think out loud as you go through these tasks.
    It may feel uncomfortable at first, but it helps us understand more about how
    you''re approaching the tasks." |'
  merge: -1
  img_proc: true
