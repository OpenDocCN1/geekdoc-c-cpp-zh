    © 2013 Mark Ainscow, used with permission.


    Keep your facial expression friendly and neutral. An occasional smile is okay,
    and you may notice the participant smiling back in return! Check your tone, remembering
    to sound genuinely interested in what she has to say.


    If the participant seems disengaged with the product she is using, try to establish
    a personal connection between the participant and what she is doing. Encourage
    her to talk about herself or her experiences, and tie her response to a rephrasing
    or refocusing of the task. For example, if you''re running a usability study on
    a mobile device that the participant seems to find uninter, ask her to tell you
    mobile games she does enjoy. After hearing her response, ask her to compare the
    experience of her favorite game to the one she is using


    A bonus about making the personal connection is that the participant may forget
    her initial emotional response (nervousness, etc.). But be careful to keep your
    efforts off building engagement linked to the session. This pattern is not about
    making friends with the participant; it''s about turning a topic or task she finds
    boring, uninspiring, or irrelevant into something that she can provide feedback
    on.


    In having this conversation with the participant, you may discover other reasons
    for the lack of engagement, such as low literacy or computer skills or a mismatch
    with your screening criteria. If this is the case, you may decide to shift the
    focus of the session to accommodate her unexpected skill level or criteria mismatch,
    or you may need to end the session early.


    The Friendly Face and Inquisitive Mind moder styles discussed in Chapter 2 are
    most appropriate to use during this pattern.


