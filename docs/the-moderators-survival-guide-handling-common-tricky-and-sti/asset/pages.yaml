- pgno: 171
  md: '# THE MODERATOR''S SURVIVAL GUIDE


    # 9.7 Session interrupted by the participant knows


    During an onsite session, there is an interruption by someone the participant
    knows. This interruption may come from the participant''s spouse or kids if you''re
    at home, or a coworker or manager if you''re at her office. The participant may
    tell the interrupter that she is in the middle of something, but the interrupter
    is insist that she needs the participant''s attention immediately.


    +   Method(s): Any in-person method

    Frequency: Occasional

    Pattern(s) to apply: Take responsibility; Take a break; End the session early


    # What to do


    +   - If you''re in the middle of something critical or time-sensitive with the
    participant, let the interrupter and participant know how much time you need to
    get out of that critical process, and see if she is able to wait long.

    - If not, offer to take a break so the participant can deal with the interruption
    immediately. Set a time limit for the break, although accept that the participant
    may need more time than you''d like.

    - If the person interrupting seems angry or forceful towards the participant,
    minimize your presence and stay out of the situation as much as possible. If your
    presence is making the situation worse and is creating the conflict, apologize,
    thank the participant for your feedback, give her the agreed-compensation, and
    end the session early.


    # What to say


    # What not to do or say


    +   - Don’t be inflexible and insist that the participant continue the session
    with you. Letting the participant deal with the situation will keep her from being
    distracted and/or irritated.


    # How to avoid


    +   - These situations are difficult to avoid in a participant''s environment,
    and you may not want to avoid them. Interruptions may be a regular part of the
    participant''s life and you can learn a lot'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 9.7 Session interrupted by someone the participant knows (cont.)


    about whether these interruptions are typical, and how her workflow or approach
    to tasks is affected. You may be able to follow up with the participant about
    the interruption and gather feedback that you might have missed otherwise.


    +   * However, if you''re less interested in the specifics of a participant’s
    environment (e.g., you''re just performing an interview), ask the participant
    when arranging the session if she can schedule a conference room or some other
    private space that may minimize the potential for interruptions.


    # See also


    +   * 9.3 Participant receives a call during the session

    * 9.5 Observer unexpectedly interacts with the participant

    * 9.6 Session interrupted accidentally by an observer or someone else'
  merge: -1
