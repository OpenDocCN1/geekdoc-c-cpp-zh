    Scanning filestreams


    *


    The scanf() function, used to get user input, is a simplified version of the fscanf()
    function with its filestream constantly set to stdin. The fscanf() function allows
    you to nominate the filestream to read as its first argument. It also has an advantage
    when reading files containing just numbers - numbers in a text file are simply
    seen as a string of characters, but when read by fscanf() they can be converted
    to their numeric type.


    Similarly, the printf() function, used for output, is a simplified version of
    the fprintf() function with its filestream constantly set to stdout. The fprintf()
    function allows you to nominate the filestream to write to as its first argument.


    So fscanf() and fprintf() offer great flexibility in choosing whether to read
    from stdin or a file, and whether to write to stdout or a file.


