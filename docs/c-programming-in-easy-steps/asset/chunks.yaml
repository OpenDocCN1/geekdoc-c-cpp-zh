    \  \n                ……接着再利用已经提到的各个极限制辅助为大家展示各种小界限……\n                最后 return\
    \ 零收尾}\n\n最终命令行界面上的结果类似下面：（引用自给定图形）\n\n由此看出值得注意的是 Tab 转义字符被频繁应用于制造对齐效果喔！\n\n有关全局作用域的内容必需谨慎处理因为过度依赖它们很容易导致名称重叠冲突发生尽量把它们替换成局部化的传递路径更为稳妥实际上所谓的作用范围就是指能否在各个子过程看见某些量如果在一个\
    \ func 内部出现了就叫 Locally 只能在这里生效否则凡出现在外侧不受{}束缚又能漫游所有模块的都是 Global 级别存在前者会在调用期间临时现身并于结束时消失后者则会陪跑全程直到落幕那一刻为止不过要想采用外部\
    \ global 得保证源头只有一遍准确的定义并且每次调用的开端加注 extern 关键字用以指出这是外来的并不需要重复做初始化工作尤其大型项目经常会把多份源文档合并出单一\
