    Current system time is usually counted as the number of seconds elapsed since
    the Epoch at 00:00:00 GMT on January 1, 1970\. The total count represents the
    current date and time according to the Gregorian calendar and is referred to as
    "Calendar Time". Special functions to handle date and time are provided in the
    time.h header file along with a data type struct named tm in which to store date
    and time components as below:


    The current elapsed seconds count is returned by a time( NULL ) function as a
    time_t data type. This can then be specified as the argument to a localtimeO function
    for conversion to its various tm struct components.


    The struct components can be output in a standard date and time format using an
    asctime() function. Alternatively, individual components can be output using special
    time format specifiers with a strftimeO function. This function requires four
    arguments to specify a char array in which to store the formatted date string,
