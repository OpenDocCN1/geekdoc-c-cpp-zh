    The *= and /= operators cannot be used to move a pointer.


    Doing pointer arithmetic


    Once a pointer has been created with an assigned memory address it can be reassigned
    another address or moved using arithmetic.


    The ++ increment operator and the -t decrement operator will move the pointer
    forward or back to other memory addresses for that data type - the larger the
    data type, the bigger the jump.


    Even larger jumps can be achieved using the += and -= operators to specify how
    many places to jump.


    Pointer arithmetic is especially useful with arrays because the elements in an
    array occupy consecutive memory places.


    Assigning just the name of an array to a pointer automatically assigns it the
    memory address of the first element in that array. Incrementing the pointer by
    one then moves the pointer along to the next element''s address.


