    C:\MyPrograins>gcc globaU.c global_2.c -o global.exe


    C:\MyPrograms >glo ba1 Sum is 100 Num is 200


    C:\MyPrograms >_


    Registering variables


    Don''t forget


    ![picture23](images/picture23.jpg)


    The register and volatile


    keywords are described here for completeness but are seldom found in reality as
    most programs simply use regular variables to store data.


    A variable declaration that includes the register keyword advises the compiler
    that the specified variable will be heavily used by the program. The intention
    is for the compiler to place register variables in the machine registers of the
    ^computer to speed access times. Their usefulness may be questionable though as
    compilers are free to ignore this advice.


    Only local internal variables can be declared as register variables. In any case
    only a few variables can be held in machine registers and they may only be of
    certain types. The precise limitations vary from machine to machine.


    Despite these possible drawbacks register declarations are harmless because the
    register keyword is ignored when the compiler cannot actually use the machine
    registers to store the variable. Instead the variable is created as though the
    register keyword was not there.


    The complete opposite of a register variable is achieved with a variable declaration
    that includes the volatile keyword. This means that the variable must not be stored
    in a machine register as its value may change at any time without action being
    taken by any code the compiler finds nearby. This is particularly relevant to
    global variables in large programs that may be concurrently modified by multiple
    threads.


    One sort of variable that might benefit from being a register variable is a local
    variable used to store the control value of a loop. On each iteration of the loop
    that value must be compared and changed so the variable is being repeatedly accessed.
    Storing this value in a machine register could then speed up execution of the
    loop.


    On the other hand, if a global variable is used to store the control value of
    a loop and may also be changed from outside the loop, that global variable might
    benefit from being a volatile variable.


    Loop structures are described fully in chapter five but the example listed opposite
    is included to illustrate the repeated access of a register variable.


    .cont''d


