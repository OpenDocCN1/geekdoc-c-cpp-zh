    Hot tip


    Typically a struct declaration will appear before the main() function in a C program.


    Grouping in a structure


    A structure in a C program can contain one or more variables of the same or different
    data types. These are grouped together in a single structure and can be conveniently
    referenced via its name. Variables within structures are know as its "members".


    Grouping related variables together in a structure is helpful in organizing complicated
    data, especially in larger programs. For example, a structure could be created
    to describe a payroll record with variables to store an employee name, address,
    salary, tax, etc.


    A structure is declared in a C program using the struct keyword followed by a
    given name and braces containing the variable members. Finally the structure declaration
    must be terminated by a semi-colon after the closing brace. So a structure containing
    members to describe x and y coordinates of a point in a graph could look like
    this:


    struct coords {


    int x ; int y ;


    };


    Optionally "tag" names can be included just before the terminating semi-colon
    as a comma-separated list. In effect the structure declaration defines a new data
    type and tag names act like variables of that data type. For example, a variable
    named "point" of the data type "coords" can be declared like this:


    struct coords


    { > int x ;


    int y ;


    } point ;


    Each struct member can then be referenced by appending the "." operator and the
    member name to the tag name, such as point.x.


    Also a new structure variable can be declared using the name of an existing structure
    and that new variable will inherit the original member properties. For example,
    to create a new structure variable named "top" based on the structure named "coords"
    with members top.x and top.y with this declaration:


    struct coords top ;


