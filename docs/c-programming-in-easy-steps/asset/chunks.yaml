    e o


    Begin a new program with a preprocessor instruction to


    include the standard input/output library functions #include <stdio.h>


    Add a main function that declares a character array


    int main()


    {


    char str[51] ;


    }


    Next in the main function block, request input from the


    user and assign it to the array variable


    printf( "\nEnter up to 50 characters with spaces:\n" ) ;


    gets( str) ;


    Now in the main function block, output the string stored


    in the array variable printf( "gets() read: " ) ; puts( str) ;


    Repeat the process to see the scanf() limitation printf( "\nEnter up to 50 characters
    with spaces:\n" ); scanf( "%s", str) ; printf( "scanf() read: %s\n" , str ) ;


    At the end of the main function block, return a zero


    integer value as required by the function declaration return 0 ;


    Save the program file then compile and execute the program to see the string results


    c


    getsputs.c


    Hot tip


    If you don''t want a newline added after the output use printf() instead of puts().


    Copying strings


    Beware


    ![picture78](images/picture78.jpg)


    Ensure that the target array is of sufficient size to hold all the characters
    of the string being copied - including a terminating \0 null character.


    The standard C libraries include a header file named string.h that contains special
    string-handling functions. To make these available to a program the string.h header
    file must be added with an #include directive at the start of the program.


    One of the functions in the string.h file is strlen(), which can be used to find
    the length of a string supplied as its argument. The strlen() function returns
    an integer that is the total number of characters in the string - including space
    "characters", but excluding the final \0 null character.


    The string.h header file also provides two useful functions to copy strings from
    one array to another. The first of these is strcpyO, which requires two arguments
    to be specified. The first argument specifies the name of the target array to
    copy the string into, and the second argument specifies the name of the source
    array from where the string should be copied. So its syntax looks like this:


    strcpy( target-array , source-array ) ;


    All characters in the source array are copied into the target array including
    the \0 null terminating character. If there are other elements after the null
    character these are also padded with \0\. This ensures that remnants from a longer
    original string are removed when a shorter string is copied into an array.


    The second string copying function is the similarly named strncpyO function (with
    an added "n"). This is used like the strcpyO function but takes a third argument
    to specify how much of the string to copy. Its syntax therefore looks like this:


    strncpy( target-array , source-array , length ) ;


    The string being copied will begin with the first character of the source array
    but will end at the position specified by the third argument - so the final \0
    null character is not automatically copied. After the characters have been copied
    the next element in the target array must be assigned a terminating \0 null character
    to promote the array to constant string status. Thus it is necessary to ensure
    that the target array is always one element larger than the actual number of characters
    being copied into it, including space "characters", to accommodate the final \0
    null character.


    .cont''d


