- fmt: "\n通常，程序不能使用多个同名变量，但如果每个变量都被声明为`static`且在源代码文件内唯一，则可以这样做。当编程涉及多个源代码文件时，可能会发现一个通用的全局变量名在两个不同的文件中被重复使用。将这些变量声明为`static`可以避免在源代码中每次出现该名称时都对其进行重命名。\n\
    \n内部局部变量也可以被声明为静态（ `static`）。这些变量的访问范围照常仅限于其声明的函数内部，但它们在函数结束时不会消失。这使得可以在函数内拥有永久的私有存储空间直至程序结束。\n\
    \n开始一个新程序：添加预处理指令以包含标准输入/输出库函数：\n```c\n#include <stdio.h>\n```\n\n定义并初始化一个仅能在此源文件中访问的全局静态（\
    \ `global static`) 变量：\n```c\nstatic int sum = 100 ;\n```\n\n添加一个主( `main`) 函数来申明要使用这个全局静态\
    \ ( `extern`)  外部链接性的符号并打印它的值:\n```\nint main() {\n    extern int sum ;\n    printf(\
    \ \"Sum is %d \\n\" , sum ) ; \n}\n```\n现在插入另一个用于第二个外部(`extern')整型数 num的操作手段以及与之对应的外链引用标识符.\n\
    然后就是一系列动作包括用printf向屏幕打回信息比如: Num等于...,等等直到最后return返回+收尾工作完毕保存存档...\n紧接着是开启独立编写另外单纯只是赋值操作所获取出来待其它地方用的必要预备数据单元的值的内容在一个不同取名的\
    \ `.C扩展`.完成这份完整工程需要用工具连编并且执行通过检查它们的状态.\n\n实际范例流程展示如下所示：\n\n*此处省略示意性质的部分占位空格与图形标记*\n\
    \n**温馨提示**\n如果在第二份源码中对数值计数 (`num variable definition of second file.`);\n加上同类性质的封锁关键修饰限定字则会最大程度限于自身作用域范筹里运作\
    \ —— >如此情况下的重新整理生成过程即告破产出错退却中止! \n\n====================================\n\nRegistering\
    \ variables （寄存器类型保留字段）用法注意点也必须知悉一些额外说明事项--->看图和备注框内容可巨细无遗解释包含 register & volatile两大特性存在于真实复杂工程项目不少情形之下很少再见到人工刻意处理因为他们基本上只局限于非常规方法才拿来利用实体伙伴设备记忆区域而已……\n\
    \n其中有几项条款明确指出如果想安排某物跑得飞快建议把它放处理器核心指定位置去专门管这事儿 。虽然可行但又其实容易被忽略掉现实原因就在于现如今大多数编译系统版本高度智能早有打算自然会替开发者操心决定最终大量对象存放何处——故而提请我们只要始终坚持规矩创建通用形式普通模样的陈述就能妥善解决问题不需多虑!:)\n\
    \n但是对于那些依赖轮子速率的控制循环计次专用小型快闪上下文环境经典样例里的微操细节再次给予肯定:-因为一遍遍手动取值判断然后改写的模式很适合特意设置成 assignment\
    \ register form !\n\n反过来想象如果是有可能从外围意想不到角度受到更改影响逻辑走向最高权值 \U0001F511 data holder\
    \ :我们就最好考虑装上一个 V标志 ⚠️防止高速固态优化带入意外不一致性进一步危害稳定性正确率 .\n\n推荐亲自实践解读全貌以便加强理论知识掌握度 -下图配有简单实例代码片段配合表述多次存取反应现象\
    \ 。\n\n...继续新项目任务...\n\n同样是引入预编译器头宣告基本I/O能力 :\n\n格式完后缀放置最主要块结构框架():\n随后加入设定初值为零作为测试基准尺度数字样式:\n\
    \n ```\nregister女变 uint_8 number Equalizer /初始状态 => loop Tests start point!\n\
    \ ```\n\nwhile (...) {...} \n花括弧内的第一步就是对累计器实施递增一元运算法i++ ，接着便是从事报告当前经过圈数次滴答内容更新反馈至终端部分;剩余的副句分别是必须提供整数0代表顺利完成任务终于退出!\n\
    \n为了直观感受相关内容具体效果请参详本地已有截图 .PNG  \n\n警告\U0001F4E2  \n假若试图采用&地址提取针对加了此专署 adj qualifier(keyword)\
    \ declare item的设计=>那么绝大多数符合规范的标准编辑器就会选择暂存在内存区间而不是强制匹配物理寄存机资源之上!!\n\n---\n\nConverting\
    \ Data Types   \n相关术语:“ ASCII读作爱死刻背影”?完全指代American Standard Code ...这是广泛接受表示纯文本文档基础编码方式你可以参照查阅第162-163数量查看全部系列表详情\
    \ ；与此同时 “正斜杠\"/\"?记好它当作常见除号就好 ^ _^ !! \U0001F609\n\n善于迁伸思考能力的Compiler能够自主决策在不同形态之间做适度切换到似乎合乎情理途径例如碰到将Intiger赋予浮点数容器情景的过程\
    \ )) ▼▼●▽ ● \U0001F44C任何事情都存在可通过明确导引操作方法称之 Castings语法仅仅只是在来源名字括号前显式写出期望转型定语即可！应注意包裹修改前缀如Unsigned等词语恰如其分需合理搭配进去————————————所以内置遗憾规则在这里是这样说话\
    \ format expression写成下面模样那样 >> targetObj =(modifiers desired type?) sourceVal\
    \ ;\n\n需要特别留心强调的事实并不会引起永久本质变化反而是短暂复写副本给别样类属小心勿混淆才是正道O_o?))) ❗而当 float数据类型中的因子往更短长度变换时候\U0001F449\
    要注意此类约束并不是直接把后面小数点最末几位去掉就算噢～它会就近原则取舍四舍五入哦！！！还便于阅读即刻试试对比案例 ↓ Scenario A\U0001F47B\
