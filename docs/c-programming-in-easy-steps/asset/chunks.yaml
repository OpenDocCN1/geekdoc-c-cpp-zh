    Alternatives can be offered with #if, #else and #elif (else if) preprocessor directives.
    These allow conditional branching to execute sections of code according to the
    result of an evaluation.


    A constant initially defined bv a preprocessor #define directive can be subsequently
    undefined with an #undef directive. An evaluation may also be made to consider
    whether a constant is undefined with an #ifndef (if not defined) preprocessor
    directive.


    All evaluations can be made in a function block, mixed with regular C statements,
    and may be nested one within another. Macros of this kind are particularly useful
