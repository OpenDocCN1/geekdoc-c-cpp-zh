    include the standard input/output library functions #include <stdio.h>


    Add a main function that declares and initializes a local register variable containing
    a loop control value of zero


    int main() {


    register int num = 0 ;


    }


    Now insert a conditional test to see if the control value is


    below five, followed by a pair of braces


    while ( num < 5 )


    { }


    Between the braces of the loop structure insert statements


    to increment the control value and output its current


    value on each iteration of the loop + + num ;


    printf( "Pass %d \n" , num ) ;


    At the end of the function block return a zero integer


    value as required by the function declaration return 0 ;


    Save the program file then compile and execute the program to see the values retrieved
    from the register variable on each iteration of the loop


    c


    u


    register.c


    Beware


    ![picture24](images/picture24.jpg)


    If the & addressof operator is used on a register variable the compiler will place
    the variable in a memory location rather than in a register.


    Converting data types


    Hot tip


    ASCII (pronounced as "as-kee") is an acronym for "American Standard Code for Information
    Interchange" and is the accepted standard for plain text. You can find the full
    range of standard ASCII codes on pages 162-163.


    Hot tip


    The / forward slash character is the division operator in the C language.


    The compiler will implicitly change one type of data into another if it seems
    logical to do so. For example, where an integer is assigned to a float variable
    the compiler converts the integer to a floating-point value. v


    Any data stored in a variable can be explicitlv forced (coerced) into a variable
    of a different data tvpe bv a process known as "casting". A cast just states the
    data type to which the variable should be converted in parentheses before the
    name of the variable storing the data in its original data tvpe. The parentheses
    should also include any modifiers, such as unsigned, where appropriate - so the
    syntax of a cast looks like this:


    variable-name2 = ( modifiers data-type ) variable-namel ;


    Note that casting does not change the original data tvpe of the variable but merely
    copies that value as a different data tvpe.


    When casting from a float variable into an int variable the value is simply truncated
    at the decimal point. There is no rounding to the nearest integer. For example,
    with float num = 5.75 the cast to an integer with (int)num produces the integer
    5, not 6.


    When casting from a char variable to an int variable the resulting integer value
    is the numerical ASCII code value that represents that character. The uppercase
    alphabet has numerical ASCII values 65-90, whereas the lowercase alphabet has
    97-122\. For example, with char letter = ''A'' the cast to an integer with (int)letter
    produces the integer 65. Casting integer values within these ranges to a char
    data tvpe produces the equivalent letter.


    It is often necessary to cast integer values into their floating-point equivalents
    to perform accurate arithmetic. Division can otherwise produce a truncated integer
    result. For example, with int x=7,y=5 the statement float z = x / y assigns the
    value of 1.000000. Accurate arithmetic requires the statement to use casts as
    (float)x / (float)y produces the floating-point value of 1.400000.


    Casting long precise floating-point numbers from a double data type into a shorter
    float data type does not simply truncate the longer value at the sixth decimal
    place but rounds up or down to the nearest figure. For example, with double decimal
    = 0.1234569 the cast to a float with (float)decimal produces 0.123457.


    .cont''d


