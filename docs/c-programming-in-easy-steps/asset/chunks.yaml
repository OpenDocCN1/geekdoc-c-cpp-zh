    to which the pointer points gets called.


    Summary


    %


    A pointer is a variable that stores the memory address of another variable expressed
    in hexadecimal


    The * dereference operator is used to reference the value contained in the variable
    to which the pointer points


    In a pointer variable declaration the variable name is prefixed by the * character
    to denote that the variable will be a pointer


    A pointer variable can be assigned the address of another variable using the &
    addressof operator


    Pointer arithmetic allows a pointer to move between consecutive memory places
    and is especially useful for moving between array elements


