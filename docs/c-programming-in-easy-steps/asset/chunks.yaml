    最终命令行界面上的结果类似下面：（引用自给定图形）\n\n由此看出值得注意的是Tab转义字符被频繁应用于制造对齐效果喔！\n\n有关全局作用域的内容必需谨慎处理因为过度依赖它们很容易导致名称重叠冲突发生尽量把它们替换成局部化的传递路径更为稳妥实际上所谓的作用范围就是指能否在各个子过程看见某些量如果在一个func内部出现了就叫Locally只能在这里生效否则凡出现在外侧不受{}束缚又能漫游所有模块的都是Global级别存在前者会在调用期间临时现身并于结束时消失后者则会陪跑全程直到落幕那一刻为止不过要想采用外部\
    \ global得保证源头只有一遍准确的定义并且每次调用的开端加注extern关键字用以指出这是外来的并不需要重复做初始化工作尤其大型项目经常会把多份源文档合并出单一\
    \ exe此时全域性质的东西天然能横跨各处沟通彼此尽管所有的subroutine也享有同等穿透力但是我们仍然可以用static加在其身前将可见度压制到各自的原初档案里防止意外搅局风险降低维护负担。\n\
    \n[[另有若干个非英文字母片段及插图编号已被省略因其难以还原实际意图]]\n"
