  raw: 'If you are using the Windows operating system and the GNU C Compiler is not
    already available you can download and install the Minimalist GNU for Windows
    (MinGW) package, which includes the GNU C Compiler, by following the steps opposite.


    .cont''d


    o


    e e


    o e


    Launch a web browser and navigate to the MinGW project page at http://sourceforge.net/projects/mingw


    On the MinGW project page, click on the Download button to go to the MinGW downloads
    page


    On the MinGW downloads page, click on the download link for the "Automated MinGW
    Installer" then choose to download the ".exe" file that is offered - this is named
    similar to MinGW-5.x.x.exe


    Double-click the downloaded Automated MinGW Installer then, in the components
    dialog that appears, check the MinGW base tools and g + + compiler items


    Accept the suggested installation location at C:\MinGW then click the Next button
    to start the installation


    Beware


    ![picture4](images/picture4.jpg)


    The MinGW installation steps provided here are correct at the time of writing
    but may be subject to change. Refer to www.mingw.org for the latest details. Further
    download and installation assistance is available via the Help link on the MinGW
    projects page at sourceforge.net.


    When installation has completed the GNU C Compiler executable can be found in
    the sub-directory at C:\MinGW\bin. It is convenient to add this location to your
    system path so the compiler can be easily run from any directory on your sysytem:


    o


    e


    ©


    Launch the Environment Variables dialog by clicking the System icon in Control
    Panel, then select the Advanced tab and push the Environment Variables button


    Find the Path variable then Edit the end of its statement line to add ;C\MinGW\bin;


    To test the availability of the GNU C Compiler, at a command prompt type gcc -v
    then hit Return to see the compiler respond with version information


    Hot tip


    Because C++ is an extension of C any C+ + development tool can also be used to
    compile C programs.


    ;:\Use»*s\Mike>gcc -u


    Reading specs from C:/MinGU/bin/..


    rhread model: Win32


    jcc version 3.4.5 <ningw-vista special v3>


    I: MJsersSMike >_


    Writing a C program


    Beware


    ![picture5](images/picture5.jpg)


    Do not use word processor applications to create program code as they store additional
    formatting information which prevents code compilation.


    Don''t forget


    ![picture6](images/picture6.jpg)


    Preprocessor instructions begin with a # hash character and must enclose standard
    library names within < > angled brackets.


    u


    c


    hello.c


    In C programs the code statements to be executed are contained within "functions",
    which are defined using this syntax format:


    data-type function-name ( ) { statements-to-be-executed }


    After a function has been called upon to execute the statements it contains, it
    can return a value to the caller. This value must be of the data type specified
    before the function name.


    A program can contain one or many functions but must always have a function named
    "main". The main() function is the starting point of all C programs and the C
    compiler will not compile the code unless it finds a main() function within the
    program.


    Other functions in a program may be given any name you like using letters, digits,
    and the underscore character, but the name may not begin with a digit. Also the
    C keywords, listed in the table on the front inner cover of this book, must be
    avoided.


    The ( ) parentheses that follow the function name may, optionally, contain values
    to be used by that function. These take the form of a comma-separated list and
    are known as function "arguments".


    The { } curly brackets (braces) contain the statements to be executed whenever
    that function is called. Each statement must be terminated by a semi-colon, in
    the same way that English language sentences must be terminated by a period full
    stop.


    Traditionally, the first program to attempt when learning any programming language
    is that which simply generates the message "Hello World":


    o


    Open a plain text editor, such as Notepad, then type this


    line of code at the start of the page, exactly as it is listed #include <stdio.h>


    The program begins with an instruction to the C compiler to include information
    from the standard input/output stdio.h library file. This makes the functions
    contained within that library available for use within this program. The instruction
    is more properly called a "preprocessor instruction" or "prepocessor directive"
    and must always appear at the start of the page, before the actual program code
    is processed.


    .cont''d


    e


    Two lines below the preprocessor instruction, add an


    empty main function int main()


    {


    }


    This function declaration specifies that an integer value, of the int data type,
    should be returned by the function upon completion


    e


    Between the braces, insert a line of code that calls upon


    one of the functions defined in the standard input/output


    library - made available by the preprocessor instruction printf ( "Hello World\n"
    ) ;


    Hot tip


    Whitespace between the code is ignored by the C compiler but program code should
    always end with a newline character.


    Here the printf() function specifies a single string argument between its parentheses.
    In C programming strings must always be enclosed within double quotes. This string
    contains the text Hello World and the \n "newline" escape sequence that moves
    the print head to the left margin of the next line.


    o


    Between the braces, insert a final line of code to return a zero integer value,
    as required by the function declaration


    return 0


    Traditionally returning a value of zero after the execution of a program indicates
    to the operating system that the program executed correctly


    e


    Check that the program code looks exactly like the listing below, then add a final
    newline character (hit Return after the closing brace) and save the program as
    "hello.c"


    #include <stdio.h>


    int main() {


    printf( "Hello World\n" ) ; return 0 ;


    }


    Don''t forget


    ![picture7](images/picture7.jpg)


    Each statement must be terminated by a semi-colon character.


    The complete program in text format is now ready to be compiled into machine-readable
    byte format as an executable file.


    Hot tip


    At a command prompt type gcc --help then hit Return to see a list of all compiler
    options.


    Compiling a C program


    The C source code files for the examples in this book are stored in a directory
    created expressly for that purpose. The directory is named "MyPrograms" and its
    absolute address on Windows is C:\MyPrograms, whereas on Linux it''s at /home/MyPrograms.
    The hello.c source code file, created by following the steps on the previous page,
    is saved in this directory awaiting compilation to produce a version in executable
    byte code format.


    o


    e


    At a command prompt issue a cd command with the path to the MyPrograms directory
    to navigate there


    At a command prompt in the MyPrograms directory type gcc hello.c then hit Return
    to compile the program


    When the compilation succeeds the compiler creates an executable file alongside
    the original source code file. By default this file will be named a.out on Linux
    systems and a.exe on Windows systems. Compiling a different C source code file
    in the MyPrograms directory would now overwrite the first executable file without
    warning. This is obviously unsatisfactory so a custom name for the executable
    file must be specified when compiling hello.c. This can be achieved by including
    a -o option followed by a custom name in the compiler command.


    e


    At a command prompt in the MyPrograms directory type gcc hello.c -o hello.exe
    then hit Return to compile the program once more


    On both Linux and Windows systems an executable file named hello.exe is now created
    alongside the C source code file:


    c


    (^J\^J ! . ► MyPrograms * J ±f | | Search


    File Edit View Tools Help


    Organize


    Name Date modified Size Type


    hello.c


    hello.exe


    .cont''d


    o


    MyPrograms - File Browser


    File Edit View Go Bookmarks Help Location: /home/MyPrograms


    hello.c


    hello.exe'
