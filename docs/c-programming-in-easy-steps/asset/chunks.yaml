    practice.


    The goto keyword jump is a powerful feature that has existed in computer programs
    for decades, but its power was abused by many early programmers who created programs
    that jumped around in an unfathomable manner. This produced unreadable program
    code so the use of goto became hugely unpopular.


    One possible valid use of the goto keyword is to break cleanly from an inner nested
    loop by jumping to a label just after the end of its outer loop block. This immediately
    exits both loops so no further iterations of either loop are executed.


    ©


    e


    Begin a new program with a preprocessor instruction to


    include the standard input/output library functions #include <stdio.h>


    Add a main function that declares two integer variables to


    be used later as loop iteration counters


    int main()


    {


    int i , j ;


    e


    o


    }


    Next in the main function block, insert two nested loops to output their counter
    values on each of three iterations for( i = 1; i < 4; i++ ) {


    for( j = 1; j < 4; j + + ) {


    printf( "Running i=%d j=%d\n", i, j ) ;


    }


    }


    Insert a statement as the first line of the inner nested loop, to jump to a label
    named "end" at a specified counter value if( i == 2 && j == 1 ) { goto end ; }


    Now add the label after the closing brace of the outer loop } end:


    .cont''d


    e e


    At the end of the main function block return a zero integer value as required
    by the function declaration


    return 0


    Save the program file then compile and execute the program to see the loops exit
    after the jump


    Hot tip


    In C boolean values are represented numerically as 1 (true) and 0 (false).


    One alternative, avoiding the goto keyword, might check a variable for a boolean
    true value (1) on each iteration of each loop:


    e e


    Add another variable to the existing variable declarations


    and initialize with a true value of one int i , j , flag = 1 ;


    Insert a conditional test o£.the new variable''s value, both


    at the start of the outer loop block and at the start of the


    inner loop block just before the output statement if( flag )


    Change the first line of the inner loop to replace the goto


    statement with one assigning a false value of zero if( i == 2 && j == 1 ) { flag
    = 0 ; }


    Delete the now obsolete end: label after the closing brace then save, compile,
    and execute the program again to see the same resulting output as before


    Beware


    ![picture59](images/picture59.jpg)


    Avoid creating a program executable named "goto.exe" as this would conflict with
    the internal Windows GOTO command.


    Summary


    The if keyword performs a basic conditional test to evaluate a given expression
    for a boolean value of true or false


    The else keyword can be used to provide alternative statements to execute when
    an if statement evaluates an expression as false


    Offering a program alternative directions in which to proceed following an evaluation
    is known as "conditional branching"


    Conditional branching performed by multiple if else statements can often be performed
    more efficiently by a switch statement


    Usually the case statements within a switch block must each be terminated by a
    break statement


    Optionally a switch block may contain a default statement specifying statements
    to execute when no match is found


    The for keyword is followed by parentheses specifying an initializer, test-expression,
    and incrementer to control a loop


    The while keyword is followed by parentheses specifying a test expression to determine
    whether a loop should continue


    A while loop block must be preceded by an initializer and contain an incrementer
    within its statement block


    The do keyword is followed by a statement block after which there must be a while
    statement terminated by a semi-colon


    A do while loop must be preceded by an initializer and contain an incrementer
    within its statement block


    Unlike for loops and while loops the statements in a do while loop will always
    be executed at least once


    The break keyword can be used to terminate a loop, whereas the continue keyword
    can be used to skip a single iteration


    Loops may be nested and the goto keyword can be used to exit to a specified label,
    although its use is not recommended


    Employing functions


    This chapter demonstrates


    how statements can be


    enclosed within a "junction" for execution whenever called by the Cprogram.


    Declaring functions Supplying arguments Calling recursively Placing functions
    in headers Restricting accessibility Summary


    Hot tip


    The function prototype is sometimes referred to as the "function header".


    u


    C


    first.c


    Declaring functions


    Previous examples in this book have used the obligatory main() function and standard
    functions contained in the C header library, such as the printfO function from
    the stdio.h file. However, most C programs contain a number of custom functions,
    which can be called as required during the execution of the program.


    A function block simply contains a group of statements that get executed whenever
    that function is called. Once the function statements have been executed program
    flow resumes at the point directly following the function call. This modularity
    is very useful in C programming to isolate set routines so they can be called
    upon repeatedly.


    To introduce a custom function into a C program it must first be declared, in
    a similar manner that variables must be declared before they can be used. Function
    declarations should be added before the main() function block.


    Like the main() function, custom functions can return a value. The data type of
    this return value must be included in the function declaration. If the function
    is to return no value its return data type should be declared with the void keyword.
    The function should be named following the same naming conventions used for variable
    names.'
