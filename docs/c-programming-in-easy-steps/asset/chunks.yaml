    Don''t forget


    Many C programmers never use bitwise operators but it is useful to understand
    what they are and how they may be used.


    A byte comprises eight bits that can each contain a 1 or a 0 to store a binary
    number representing decimal values from 0 to 255\. Each bit contributes a decimal
    component only when that bit contains a 1. Components are designated right-to-left
    from the "Least Significant Bit" (LSB) to the "Most Significant Bit" (MSB). The
    binary number in the bit pattern below represents decimal 50.


    Binary 0 0 1


    Although the char data type is the basic 1-byte storage unit in C programming,
    as described on the previous page, it is possible to manipulate individual parts
    of a byte using "bitwise" operators.


    Hot tip


    Each half of a byte is known as a "nibble" (4 bits). The binary numbers in the
    examples in the table describe values stored in a nibble.


