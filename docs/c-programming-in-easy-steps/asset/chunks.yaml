    \ ————多数场合会被当作长的来处理使得可容纳区间大致覆盖 +2147483647 ~ -2147483648 。若罕见地成为 short 则仅能在 ±32767\
    \ 处波动而已。\n                                        \n但是我们可以通过显式地在申明环节加入 short/long\
    \ 这两个限位词去精确调整这个幅度大小:\n\n\n///节省内存///\n             ``` C 代码块部分缺失 ，推测应为 ：shor t\
    \ ant nimbl e . … ```\n\n而标准的附头档 limits． h 里面存放着由编译器决定的种种极限常数值比如 INT_MAX INT_MIN\
    \ 分别对应普通尺寸的数边界、\n同样也有 SHRT_MAX SHRTMIN 针对较小尺度版本以及 LONGMAX LONGMIN 应对更大的款式 。\n\n\
    另外假如某个计数肯定不会落进负数区域那么完全可以使用 unsinged 前缀把它标注为非负有范类型 —— unsigned shor tint 举例来说虽然占用字节数和一般短短相同却能把窗口拓宽至\
    \ 0..65535,\n同理 unsigned long 虽占据四字但其峰值达到了约 42 亿之巨倍超原先的两番规模！\n       \nC 语言还提供了\
    \ sizeof 操作特性帮我们查看每种不同类型的保留容量——优秀的编码习惯倾向于最小化资源配置比如说如果一个计数器只会产生低于六万余的正位移那么就选二字节容量的\
    \ Unsigned Short 显然要比四字的 Long 节俭许多。\n\n\n接下继续举例如编写检测特定数据类型长度的例子开头依然是预处理器指引:\n\
    \            \n``# include<stdio\\.h > ``\n\n\n主逻辑则是这样布局\n    \n       进入 main(){\n\
