    Displaying a dialog box


    ![picture111](images/picture111.jpg)


    Don''t forget


    Notice that the WinMainO function requires an integer to be returned upon completion,
    just like the usual main() function


    Hot tip


    Other MessageBox icon constants include MBJCONERROR, MBJCONQUESTION and MB ICONINFORMATION.


    In the Windows operating system C programs can easily produce graphical components
    via special functions provided by the Windows Application Programming Interface
    (WINAPI). This is made available to the program by adding a compiler directive
    to include the Windows-specific windows.h header file.


    In a C program for Windows the usual main() function program entry point is replaced
    by this special WinMainO function:


    int WINAPI WinMain( HINSTANCE hlnstance,


    HINSTANCE hPrevlnstance, LPSTR IpCmdLine, int nCmdShow)


    These arguments are always required in order for the program to communicate with
    the operating system. The hlnstance, argument is a "handle" reference to the program
    and the hPrevlnstance argument, used in earlier Windows programming, can be safely
    ignored these days. The IpCmdLine argument is a string that represents all items
    used on the command line to compile the application, and the nCmdShow argument
    controls how the window will be displayed.


    The most simple graphical component to create in Windows is a basic dialog box
    with just one "OK" button. This is created by calling this MessageBoxO function:


    int MessageBox( HWND hWnd, LPCTSTR IpText,


    LPCTSTR IpCaption, UINT uType );'
