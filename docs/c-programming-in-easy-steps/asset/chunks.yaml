    Understanding precedence


    Hot tip


    The * multiply operator is on a higher row than the + addition operator - so in
    the expression a=6+b*3 the multiplication gets completed before the addition operation.


    ![picture48](images/picture48.jpg)


    Don''t forget


    The -> and . struct operators are described later in this book but are included
    here to provide a complete precedence table of all operators.


    Operator precedence defines the order in which C evaluates expressions. For instance,
    in the expression a=6 + b*3 the order of precedence determines whether the addition
    or the multiplication is completed first.


    The table below lists operator precedence in decreasing order, where operators
    on higher rows have precedence over those on lower rows, so their operations get
    completed first. Operators on the same row have equal precedence but the order
    of completion is determined by associativity direction. For instance, for "Left
    to right" associativity the operations on the left get completed first.


