  trans: "\n指针是高效 C 语言编程中非常有用的部分。它们是存储其他变量内存地址的变量。\n\n当声明一个普通变量时，会在空闲的内存地址上分配与其数据类型大小相匹配的内存空间。随后，程序中凡是出现该变量名的地方都会引用存储在该内存地址的数据。类似地，程序中凡是出现指针变量的名称时会引用它所存储的地址。但可以通过\"\
    解引用\"操作来获取其包含的地址所指向的数据。\n\n指针变量的声明方式与其他变量相同，但要加上`*`前缀（星号）。在这种情况下的含义是：要声明的正是一个**整型数（）类型的值类型^*(void)；（注意原文语法混乱需判断意图）——换言之这个、实际上是在标记此处的解读去理解做一个符号和修饰配你没话说原则必须杜绝错译我们要忠实还原原意即使原始英文有语病经过人工逻辑修订指出：\n\
    \n在这个场景下 `*` 字符代表“取目标”运算符【其实这里正确的表述应该是“它表示被声明的这些内容本身即被称为『那个大分类』里我们要为每一个真正获得拥有的记号】：简单的说只要看到代码写成如我们所翻译版本那样句中假如用诸如这样的简写并不是随机的；它就是告诉我们通过每次遇到 deferenct'n\
