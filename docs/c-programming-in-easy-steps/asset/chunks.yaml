    Flagging bits


    C


    By tar the most common use ot bitwise operators is to manipulate a compact "bit
    field" containing a set of boolean "flags". This is a much more efficient use
    of memory than storing boolean flag values in separate variables - a char data
    tvpe of just one b\te can hold a bit field ot eight flags, one per bit, whereas
    eight separate char variables would require eight whole bytes of memory.


    The initial bit flags can be set bv assigning a decimal value to the variable
    whose binary equivalent has a 1 for each bit that is to be turned u on" as a boolean
    flag. For example, decimal 8 has a binary equivalent of 1000 (1x8 0x4 0x2 0x1)
    so turns on the fourth flag, reading trom right-to-left from the least significant
    bit.


    Subsequently the bit flag values can be reversed using the bitwise NOT — operator
    but care must be taken to mask zeros before the bit flags, otherwise thev will
    each be returned as 1\. For example, to reverse a bit field ot tour flags within
    the four right bits of a bvte the four left bits must be masked. Decimal 15 is
    binary 0001111 (0x128 0x64 0x32 0x16 1x8 1x4 1x2 lxl) and can be applied as this
    mask with the bitwise AND & operator.


    The bit flag pattern can also be manipulated bv shitting those flags that are
    turned on bv a specified number ot bits using the bitwise Shift left << and Shift
    right >> operators.


