    Measuring size


    Hot tip


    Always enclose an operand supplied to the sizeof operator within parentheses for
    code consistency.


    In C programming the sizeof operator returns an integer value, which is the number
    of bytes needed to store the content of its operand in memory.


    Where the operand supplied to the sizeof operator is a data type name, such as
    int, the operand must be enclosed within parentheses - as with the examples listed
    earlier on page 27.


    Alternatively, where the supplied operand is a data object name, such as a variable
    name, the parentheses may optionally be omitted. In practice many programmers
    will always enclose the sizeof operator''s operand within parentheses to avoid
    having to remember this distinction.


    The basic storage unit in C is defined by the char data type that stores a single
    character in a single byte of memory. This means that sizeof( char ) will return
    1 (one byte).


    Typically the int and float data types will each allocate 4 bytes of machine memory,
    whereas the double data type will typically allocate 8 bytes of machine memory
    to accommodate its range of possible values. These sizes are not defined by the
    standards however, but are implementation-defined, so may vary. It is therefore
    good practice to use the sizeof operator to measure the actual memory allocation
    rather than assume these typical sizes will be allocated.


    The memory space allocated for array variables will simply be the number of bytes
    allocated for that data type multiplied by the number of elements in that array.
    So, for example, the expression sizeof( int[3] ) will typically return 12 (3 x
    4 bytes).


    It is especially important to use the sizeof operator to accurately discover the
    amount of memory allocated for user-defined structures that have members of different
    data types, as "padding" is often automatically added. This means that total memory
    allocation may exceed the sum allocated to each member. It might seem reasonable
    to expect that a structure comprising member variables int score and char grade
    will be allocated total memory of 5 bytes (4+1), but the total allocation will
    typically be 8 bytes. This is because (32-bit) computer systems like to read and
    write data in "word" sized chunks of 4 bytes each. So padding gets added to make
    the memory allocation a multiple of four.


