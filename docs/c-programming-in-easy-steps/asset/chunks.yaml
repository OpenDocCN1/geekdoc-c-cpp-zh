    Foreword


    The examples in this book have been carefully prepared to demonstrate the features
    of the C programming language. You are encouraged to try out the examples on your
    own computer to discover the exciting possibilities offered by C programming.
    The straightforward descriptions should allow you to easily recreate the examples
    manually or, if you prefer, you can download an archive containing all the C source
    code by following these easy steps:


    Open your browser and visit our website at http://www.ineasysteps.com


    ^ Navigate to the "Resource center" and choose the "Downloads" section


    Find the "From C Programming in easy steps, 3rd edition" item in the "Source code"
    list, then click on the link entitled "All code examples" to download the ZIP
    archive


    Extract the contents of the ZIP archive to any convenient location on your computer
    - for easy reference these are arranged in sub-folders whose names match each
    chapter title in this book. The C source files are named as described in the book
    and can be found in the appropriate chapter folder of the archive. For example,
    the comparison.c file described in Chapter 4 is located in the folder named 4-Performing
    operations


    ![picture0](images/picture0.jpg)


