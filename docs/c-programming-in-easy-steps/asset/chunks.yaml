  raw: 'Getting the current time both before and after an event means that the duration
    of the event can be calculated by their difference. The time.h header file contains
    a difftime() function for that particular purpose. This function requires two
    arguments, both of which are of the time_t data type. It subtracts the second
    argument from the first argument and returns the difference expressed in whole
    seconds, but as a double data type.


    Another way to work with time is offered by the clock() function from the time.h
    header file. This returns the processor time used since the program began expressed
    in clock "ticks". This function can be used to "pause" the execution of a program
    by running an empty loop until a future point in time is reached.


    u 0


    © e


    ©


    ©


    Begin a new program with a preprocessor instruction to


    include the standard input/output library functions and


    the date and time functions #include <stdio.h> #include <time.h>


    Next declare a function prototype to pause the program void wait( int seconds
    ) ;


    Add a main function that declares two time_t variables,


    and an integer variable


    int main()


    {


    time t go , stop ; int i ;


    }


    Next in the main function block, get the current time and


    output a message


    go = time( NULL ) ;


    printf ("\nStarting countdown...\n\n");


    Add a loop to output a countdown value and call the


    other function on each iteration


    for( i = 10; i > -1; i- )


    {


    printf (" - %d", i ) ; wait(1) ;


    }


    .cont''d


    ^ Next in the main function block, get the current time once more then output
    the time taken to run the loop stop = time( NULL ) ;


    printf("\nRuntime: %.0f seconds\n" , difftime( stop, go ) ) ;


    ^ Finally in the main function block, return a zero integer


    value as required by the function declaration return 0 ;


    ^ After the main function block, begin the function definition by initializing
    a clock_t variable at a future


    point beyond the current elapsed running time


    void wait( int seconds )


    {


    clock t endwait =


    ( clock() + ( seconds * CLOCKS_PER_SEC ) );


    }


    ^ Finally in the wait function block add an empty loop that


    terminates when the current time reaches the future point,


    returning control to the loop in the main function while ( clock() < end wait
    ) { }


    Save the program file then compile and execute the program to see the countdown
    timer and runtime


    Beware


    ![picture108](images/picture108.jpg)


    The number of clock ticks per second is implementation-dependent but is defined
    in time.h by the CLOCKS_PER_SEC constant.


    Hot tip


    You can find the elapsed runtime expressed in seconds by dividing the value returned
    by the clock() function by the CLOCKS PER SEC value.


    Generating random numbers


    The stdlib.h header file provides a rand() function that generates a psuedo-random
    positive integer when called. This will, by default, return a number in the range
    from 0 to a large value (at least 32,767). A specific range can be set by Using
    the modulus operator to specify a maximum upper limit. For example, to specify
    a range from 0 to 9 with the expression rand() % 9.


    To set a minimum lower limit for the range its value can be added to the result
    of the expression. For example, to specify a range from 1 to 10 with the expression
    ( rand() % 9 ) + 1.


    The numbers generated by the rand() function are not truly random as the function
    successively generates the same sequence of numbers each time a program using
    rand() is executed. In order to generate a different sequence of numbers the "seed"
    that starts the sequence must be specified. By default the initial seed value
    is 1 but this can be changed by specifying an alternative integer argument to
    the srand() function. For example, srand(8). This will cause rand() to generate
    a different sequence of numbers to those generated using the default seed value
    but the sequence will still be repeated each time a program using rand() is executed.


    To generate different random sequences upon successive execution the argument
    specified to srand() must be something other than a static integer. The common
    solution is to seed the rand() function with the current time in elapsed seconds
    with srand( time( NULL) ).


    Now the sequence of numbers generated by rand() will be different each time a
    program using rand() is executed.


    Begin a new program with preprocessor instructions


    to include the standard input/output library functions,


    random number, time, and string functions #include <stdio.h> #include <stdlib.h>
    #include <time.h> #include <string.h>


    Add a main function that declares int and char variables int main() {


    int i , r , temp , nums[50] ;


    char buf[4], str[50]= { "Your Six Lucky Numbers Are: " } ;


    }


    ![picture109](images/picture109.jpg)


    .cont''d


    e


    o e


    o


    e


    o


    o


    In the main function block, first seed the random number


    generator with the current elapsed seconds value srand( time(NULL) ) ;


    Next fill an array with the numbers 0-49 in sequence for( i = 0 ; i < 50 ; i +
    + ) { nums[i] = i ; }


    Now shuffle the sequence into a random order


    for( i = 1 ; i < 50 ; i + + )


    {


    r= ( rand() % 49 ) + 1 ;


    temp = nums[i] ; nums[i] = nums[r] ; nums[r] = temp ;


    }


    Add the numbers from six array elements to a string


    for( i = 1 ; i < 7 ; i + + )


    {


    sprintf( buf, "%d ", nums[i] ) ; strcat( buf , " " ) ; strcat( str , buf ) ;


    }


    Then output the string printf( "\n%s\n\n" , str ) ;


    At the end of the main function block return a zero


    integer value as required by the function declaration return 0 ;


    Save the program file then compile and execute the program repeatedly to see a
    selection of six different random numbers in the range 1-49 upon each execution


    ![picture110](images/picture110.jpg)


    Don''t forget


    The array element nums[0] gets assigned a zero value but this is not included
    in the shuffle as only elements 1-49 are eligible for selection.


    Hot tip


    Notice how the sprintf()


    function is used here to translate int values into char values that can then be
    concatenated to the larger text string.


