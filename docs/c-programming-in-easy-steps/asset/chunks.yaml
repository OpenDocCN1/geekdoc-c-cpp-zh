    Converting strings


    The standard C library file stdlib.h contains a useful function named atoi() that
    can be used to convert a string to an integer. To make this function available
    to a program the stdlib.h file must be added with an #include directive at the
    start of the program.


    The atoi() function, alpha-to-integer, takes the string to be converted as its
    single argument. If the string is empty, or if the string''s first character is
    not a number or a minus sign, then atoi() will return zero. Otherwise the string,
    or at least the numeric start of the string, will be converted to an int data
    type up until atoi() meets a non-numeric character in the string. When atoi()
    meets a non-numeric character in the string it returns the number so far converted
    as an int data type.


    There is also an itoa() function, integer-to-alpha, that can be used to convert
    an int data type value to a string. This is widely used but is not part of the
    standard ANSI C specification. The itoa() function requires three arguments to
    specify the number to be converted, the string to which the converted number is
    to be assigned, and finally the base to be used for the conversion. For example,
    a specified base of 2 will assign the binary equivalent of the specified numeric
    argument to the specified string argument.


    An ANSI-compliant alternative to the itoa() function is the sprintf() function
    in the stdlib.h header file. It is less powerful because a base value cannot be
    specified. The sprintf() function also takes three arguments - the string to which
    the converted number is to be assigned, a format specifier, and the number to
    be converted. This function returns an integer that is the number of characters
    in the converted string.


