    ASCII character codes


    ASCII (American Standard Code for Information Interchange) is the standard representation
    of characters by numerical code. The non-printing character codes, originally
    developed for teletypes, are now rarely used for their intended original purpose.


    There are also extended ASCII code sets from 128-255 (not listed) containing accented
    characters and symbols, but these sets do vary.


    Note that the character represented by character code 32 is not missing - it is,
    in fact, the non-printing space character. Also the character represented by character
    code 127 is the delete character.


    .cont''d


    Hot tip


    To find out more about extended ASCII sets try the website at www.asciitable.com
    or


    search for "ASCII" on the web.


    Hot tip


    The term "ASCII file" just means a plain text file, such as those produced by
    Windows'' Notepad application.


    <stdioh> Input & output functions


    The functions and tvpes defined in the stdio.h header file represent almost one
    third of the C language library. It is used to introduce data into a program and
    generate output from a program.


    A "stream" is a data source terminated by a \n newline character. It may be read
    or written by "opening" the stream, and terminated by "closing" it. Opening a
    stream returns a FILE type pointer in which information needed to control the
    stream is stored.


    The functions listed in the following table perform file operations: File-handling
    FILE fopen( const char ^filename , const char mode )


    functions


    The fopen() function returns a file pointer, or null if the


    file cannot be opened. Any of the following modes may be specified in the function
    call:


    r open a text file for reading only


    w create a text file to write to, and discard any previous contents


    a append - open or create a text file for writing at the end of the file


    r+ open a text file to update (read and write)


    w+ open a text file to update (read and write discarding any previous contents)


    a+ append - open or create a text file for update, for writing at the end of the
    file


    If the file being opened is a binary file a b should be added after the file mode.
    For example wb+


    FILE freopen( const char * f ilename , const char mode , FILE *stream )


    The freopen() function opens a file with the specified mode and associates the
    stream with it. It returns the stream, or null if an error occurs. This function
    is normally used to change the files associated stdin, stdout or stderr


    int fflush( FILE *stream )


    On an output stream this function causes any buffered data to be written immediately.
    It returns the EOF constant for a write error, or zero otherwise. A call to fflush(
    null ) flushes all output streams.


    .cont''d


    <stdio.h>


    int fclose( FILE *stream )


    ![picture112](images/picture112.jpg)


    A call to fcloseO flushes any unwritten data from the stream then closes the stream.
    It returns the EOF constant if an error occurs, or zero otherwise


    int remove( const char *filename )


    This function removes the specified file - so that any subsequent attempt to open
    that file will fail. It returns a non-zero value if it cannot remove the file


    int rename( const char *old-name , const char *new-name )


    The renameO function changes the name of the specified file, or it returns a non-zero
    value if it cannot rename the file


    FILE *tmpfile( void )


    Calling tmpfileO creates a temporary file, with the file mode of wb+, that is
    removed when the program ends. This function returns a stream, or null if the
    file cannot be created


