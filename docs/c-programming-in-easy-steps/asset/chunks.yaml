  raw: 'It is good practice to choose meaningful names for variables to make the program
    code more easily understood. To create a variable in the program simply requires
    it to be "declared". A variable declaration has this syntax:


    data-type variable-name ;


    First the declaration specifies which type of data the variable is permitted to
    contain. This will be one of the four data types described on the opposite page.
    The data type is followed by a space then the chosen variable name, adhering to
    the naming conventions in the table above. As with all statements in C programs
    the declaration must end with a semi-colon terminator. Multiple variables of the
    same data type can be created in a single declaration as a comma-separated list
    like this:


    data-type variable-name-1 , variable-name-2 , variable-name-3 ;


    .cont''d


    There are four basic data types in the C language. These are defined using the
    C keywords that are listed in the table below, together with a description of
    each data type:


    Data type Description


    char


    int


    float


    double


    ![picture14](images/picture14.jpg)


    A single byte, capable of storing just one character


    An integer whole number


    A floating-point number correct to six decimal places


    A floating-point number correct to ten decimal places


    100


    0.123456


    0.0123456789


    Beware


    ![picture15](images/picture15.jpg)


    Values of the char data type must always be enclosed by single quotes - double
    quotes are incorrect.


    The four data types allocate different amounts of machine memory for storing data.
    The smallest is the char data type, which allocates just a single byte of memory,
    and the largest is the double data type, which typically allocates eight bytes
    of memory. This is twice the amount of memory allocated by the float data type
    so the double data type should only be used when a lengthy precise floating-point
    number is a necessity.


    Variable declarations should be made before any executable code appears in the
    program. When a value is assigned to a variable that variable is said to have
    been "initialized". Optionally a variable may be initialized when it is declared.


    The example code fragment below declares and initializes various variables with
    appropriate values as described in the code comments - descriptive comments between
    /* and */ that are ignored by the compiler:


    int num1 , num2 ;


    char letter;


    float decimal = 7.5 ;


    num1 = 100 ; num 2 = 200 ;


    /* Declares two integer variables. */


    /* Declares a character variable. */


    /* Declares and initializes


    a floating-point variable. */


    /* Initializes the integer variables. */


    Hot tip


    In a variable assignment the part to the left of the = operator is known as the
    L-value object and that to its right is known as the R-value data.


    letter = ''A'' ;


    /* Initializes the character variable. */


    Displaying variable values


    The value of variables can be displayed using the printf() function that was used
    in chapter 1 to display the "Hello World" message. The desired format in which
    to display the variable value must be specified as an argument in the printf()
    function''s parentheses using a suitable "format specifier", along with the variable
    name:


    ![picture16](images/picture16.jpg)


    Don''t forget


    Single char character values must be enclosed by single quotes - a string of multiple
    characters, on the other hand, must be enclosed by double quotes.


    A format specifier can ensure that the output occupies a specific minimum number
    of spaces by stating the required number immediately after the % character. For
    example, to ensure that an integer always fills at least seven spaces with the
    specifier %7d. If it is preferable for the blank spaces to be filled with zeros
    just add a zero between the % character and the specified number. For example,
    to ensure that an integer always fills at least seven spaces and that blank spaces
    are filled with zeros with the specifier %07d.


    A precision specifier, which is a period followed by a number, can be used with
    the %f format specifier to determine how many decimal places to display. For example,
    to display just two decimal places with the precision specifier %.2f. The precision
    specifier can also be combined with the minimum space specifier to control both
    the minimum number of spaces and number of decimal places to display. For example,
    to display seven spaces including two decimal places and empty spaces filled by
    zeros with %07.2f.


    By default empty spaces precede the number so it is right-aligned, but can be
    added after the number to make it left-aligned by prefixing the minimum space
    specifier with a minus sign.


    .cont''d


