  raw: 'Pointers can be passed as arguments to other functions


    Passing a pointer as a function argument passes by reference, allowing that function
    to operate on the original value


    Each element in an array of pointers can store the address of another variable


    i


    An array of pointers is especially useful for handling strings of characters


    When a character string variable array name is assigned to a pointer that pointer
    automatically stores the entire string


    A pointer to a function must always be enclosed within parentheses when using
    the * dereference operator to avoid compiler errors


    Dereferencing a function pointer calls the function to which it points and passes
    any arguments specified to the pointer


    f;l Manipulating strings


    110 Reading strings


    This chapter demonstrates


    112 Copying strings


    how strings of text may be


    114 Joining strings


    manipulated in Cprograms.


    116 Finding substrings


    118 Validating strings


    120 Converting strings


    122 Summary


    Reading strings


    ■


    Hot tip


    You can find the standard ASCII character code table on page 162.


    Don''t forget


    ![picture77](images/picture77.jpg)


    In C character values must be enclosed by single quotes and strings must be enclosed
    by double quotes.


    In C programming a string is an array of characters that has the special \0 null
    character in its last element. Each character, including punctuation and non-printing
    characters such as newline, has a unique numerical ASCII code value. This means
    that characters can be changed arithmetically. For example, where char letter
    = ''S'' then letter++ changes the value to T.


    ASCII code values for lowercase letters are always 32 higher than those of uppercase
    letters so the case of any character can be changed by adding or subtracting a
    value of 32\. For example, where char letter = ''M'' then letter+ = 32 changes
    the value to''m''.


    As C does not have a dedicated string data type string variables must be created
    as character arrays, remembering to add a final element for the \0 null character
    to promote the array to string constant status. This means that the name of an
    array then acts like an implied pointer to the entire string of characters. The
    sizeof operator will return the string length when the string name is supplied
    as its argument. A string may be assigned to an array or to a pointer of the char
    data type like this:


    char arr[6] = { ''A'', ''I'', ''p\ ''h'', ''a'' } ; char *ptr = "Beta" ;


    printf( "%s" , arr ) ; /* Outputs "Alpha" printf( "%s" , ptr) ; /* Outputs "Beta"


    */ */


    String values can be introduced into a C program by input from the user via the
    scanf() function described on page 24\. This function works well for single characters
    or multiple characters forming a single word but scanf() has a severe limitation
    in that it stops reading when it encounters a space. This means that the user
    cannot input a sentence via scanf() as the string gets truncated at the space
    following the first word.


    The solution to the scanf() problem is provided by two alternative functions located
    in the stdio.h header file. The first of these is named gets() and is used to
    read input from the user. This accepts all characters, including spaces, and assigns
    the string to a character array specified as its argument. It automatically adds
    the \0 null character at the end of the string when the user hits the Return key
    - to ensure the input has string constant status. The companion to gets() is the
    puts() function that will output a string specified as its argument and automatically
    add a newline character at the end.


    .cont''d


    o


    e


