    \n```c\nint main()\n{\n    char letter;\n    int num1, num2 ;\n}\n```\n\n在主函数内、在那些变元数声明的语句之后插入从用户获取输入的语句:\n\
    \n```\nprintf( \"Enter any one keyboard character: \" ) ;\nscanf( \"%c\", &letter)\
    \ ;\n\nprintf( \"Enter two integers separated by a space: \" ) ; \nscanf( \"%d\
    \ %d\" , &num1, &num2 );\n   \n接下来插入用于输出已存数据细节的语句\n\n     printf(\"Numbers input:%\
    \ d and% d \\n\",&nbsp;100200);\n    \n   ... // (原文本此处有乱码)\n     \n保存文件并编译执行它时会要求你提供一些示例值然后看到如下的控制台打印：\n\
    Command Prompt(C:\\MyPrograms>... )\n\n![picture18](images/picture18.jpg)\n\n\
    不要忘记！机器地址对应的格式化符号是\"%p\". \n\n提示信息：“常量通常全大写命名以便同其他类型的标识区分开来”。下图展示了相关结论；背景图显示了一些补充提醒内容：“给未指明大小的整型分配空间多少依赖于操作系统具体实现但基本按照long类型对待”。\n\
    \                                              \n(<图片19请见原文位置>)别忘了这一点—当创建一个无额外限定词的整数时它的默认属性允许正负数值出现这两种可能情况即“带符号”的情形下不同范围的确定受环境影响要么视为长整数(long),要是短的话就相反\
