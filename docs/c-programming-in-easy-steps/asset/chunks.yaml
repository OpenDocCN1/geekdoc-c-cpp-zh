- fmt: "\n`scanf()`函数可以同时为多个变量赋值。其第一个参数必须包含一个格式说明符列表，每个说明符之间用空格分隔，且整个列表需用双引号括起来。第二个参数必须包含一个逗号分隔的变量名列表，每个变量名前都需要加上取地址运算符（`&`），以指定各格式所应用的变量。\n\
    \n取地址运算符（`&`）也可用来返回存储该变量数据的十六进制内存地址。\n\n结合来自 `printf()` 函数的输出和 `scanf()` 函数的输入可以在用户与程序间创建基本的交互性.\n\
