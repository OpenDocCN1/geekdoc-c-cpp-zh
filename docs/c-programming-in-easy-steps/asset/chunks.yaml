  raw: 'Variables of this enum data type can be declared in the same way that variables
    are declared of other data types - using this syntax:


    data-type variable-name ;


    The example on the previous page created an enumerated sequence named SNOOKER,
    which can be regarded as a data type of enum SNOOKER. So a variable named "pair"
    of that data type can be created with the declaration enum SNOOKER pair; and can
    store values of the enumeration set defined by that type.


    To explicitly assign an integer value to a variable of an enumerated data type
    the C standard recommends that a cast be used to convert the int data type to
    the enum data type, like this:


    pair = ( enum SNOOKER ) 7 ;


    In practice this is not needed though as enumerated values are always integers
    so are equivalent to the int data type.


    An enum declaration can optionally also create a variable by specifying a variable
    name after the final brace. For example, the declaration enum BOOLEAN { FALSE
    , TRUE } flag ; defines an enum data type and creates a variable named "flag"
    of that type.


