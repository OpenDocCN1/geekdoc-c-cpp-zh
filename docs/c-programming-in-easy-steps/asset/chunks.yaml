    Declaring program constants


    Where a program is required to use a fixed constant data value that will never
    change it should be declared in the same way as a variable but including the const
    keyword in the declaration. For example, a constant representing the unchanging
    integer value of one million can be declared and initialized like this:


    ![picture29](images/picture29.jpg)


    constant.c


    const int MILLION = 1000000 ;


    Constant declarations must always initialize the constant object with the data
    value they will contain. The program can never change the value of a constant
    from its initial value. This safeguards the constant value from accidental alteration
    as the compiler will report an error if the program attempts to subsequently alter
    the initial value.


    Constant names are subject to the same naming conventions as variable names, described
    on page 20, but it is traditional to use uppercase characters for constant names
    - to easily distinguish them from variable names when reading the source code.


    The const keyword can also be used in an array declaration if all its initial
    element values are never to be changed by the program.


