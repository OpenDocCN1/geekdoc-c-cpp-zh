  raw: 'Logical AND && and OR 11 operators form expressions evaluating two operands
    to return a boolean value of true or false, but the logial NOT ! operator returns
    the inverse boolean value of a single operand


    A conditional ?: operator evaluates a given boolean expression then returns one
    of two operands depending on its result


    The sizeof operator returns the memory byte size of a data type or a data object


    A single memory byte comprises eight bits, which may each contain a value of one
    (1) or zero (0)


    Bitwise operators OR |, AND &, NOT ~, and XOR ~ each return a value after comparison
    of the values within two bits, whereas the Shift left < < and Shift right > >
    operators move the bit values a specified number of bits in their direction


    The most common use of bitwise operators is to manipulate a compact bit field
    containing a set of boolean flags


    Expressions containing multiple operators will execute their operations in accordance
    with the default precedence rules unless explicitly determined by the addition
    of parentheses


    Making statements


    This chapter demonstrates


    how statements can evaluate


    expressions to determine


    the direction in which a C


    program should proceed.


    72 Testing expressions


    74 Branching switches


    76 Looping for a number


    78 Looping while true


    80 Breaking out of loops


    82 Going to labels


    84 Summary


    Testing expressions


    Hot tip


    When the code to be executed is just a single statement the braces may optionally
    be omitted.


    Hot tip


    Multiple expressions can be evaluated by combining if and else statements with
    if() { ... } else if () { ... }


    The if keyword is used to perform the basic conditional test that evaluates a
    given expression for a boolean value of true or false. Statements within braces
    following the evaluation will only be executed when the expression is found to
    be true. So the syntax of an if test statement looks like this:


    if ( test-expression ) { statements-to-execute-when-true }


    There may be multiple statements to be executed when the test is true but each
    statement must be terminated by a semi-colon.


    Sometimes it may be desirable to evaluate multiple expressions to determine whether
    following statements should be executed and this can be achieved in two ways.
    The logical && AND operator can be used to ensure the statements will only be
    executed when two expressions are both found to be true, with this syntax:


    if ( ( test-expression ) && ( test-expression ) ) { statements-to-execute }


    Alternatively multiple if statements can be "nested", one inside another, to ensure
    following statements will only be executed when both evaluated expressions are
    found to be true, like this:


    if ( test-expression ) {


    if ( test-expression ) { statements-to-execute }


    }


    When one or more expressions evaluated by an if test statement are found to be
    false the statements within its following braces are not executed and the program
    proceeds to subsequent code.


    It is often preferable to extend an if statement by appending an else statement
    specifying statements within braces to be executed when the expessions evaluated
    by the if statement are found to be false, with this syntax:


    if ( test-expression )


    { statements-to-execute-when-true }


    else


    { statements-to-execute-when-false }


    This is a fundamental programming technique that offers the program two directions
    in which to proceed, depending on the result of the evaluation, and is known as
    "conditional branching".


    .cont''d


    e


    ^ Begin a new program with a preprocessor instruction to


    include the standard input/output library functions #include <stdio.h>


    ^ Add a main function that outputs a statement when a


    tested expression is found to be true


    int main()


    {


    if( 5 > 1 ) { printf( "Yes, 5 is greater than 1\n" ) ; }


    }


    Next in the main function block, output a statement when two tested expressions
    are both found to be true if ( 5 > 1 ) {


    if( 7 > 2 )


    { printf("5 is greater than 1 and 7 is greater than 2\n") ;}


    }


    Now output a default statement after two tested


    expressions are both found to be false if( 1 > 2 )


    { printf( "1st Expression is true\n" ) ; } else if( 1 > 3 )


    { printf( "2nd expression is true\n" ) ; } else


    { printf( "Both expressions are false\n" ) ; }


    ^ At the end of the main function block return a zero integer value as required
    by the function declaration return 0 ;


    ^ Save the program file then compile and execute the program to see output following
    conditional tests


    o


    I Command Prompt


    C:\MyProgranis>gcc ifelse.c -o ifelse.exe


    C: \MyPro grains > if e Is e Ves, 5 is greater than 1


    5 is greater than 1 and 7 is greater than 2 Both expressions are false


    C:\MyPro grams >_


    <i I


    1


    C


    ifelse.c


    Don''t forget


    ![picture51](images/picture51.jpg)


    In C boolean true is represented numerically as 1 and boolean false as 0 (zero).
    So the expression ( 5 > 1 ) is shorthand for ( 5 > 1 == 1 ).


    Branching switches


    Hot tip


    It''s always a good idea to include a default statement - even if it''s only to
    output an error message when the switch statement fails.


    ![picture52](images/picture52.jpg)


    Don''t forget


    A default statement need not appear at the end of the switch block but it is logical
    to place it there where it needs no break statement.


    Conditional branching performed by multiple if else statements can often be performed
    more efficiently by a switch statement when the test expression just evaluates
    a single condition.


    The switch statement works in an unusual way. It takes a given value as its parameter
    argument then seeks to match that value from a number of case statements. Code
    to be executed when a match is found is included in each case statement.


    It is important to end each case statement with a break keyword statement so the
    switch statement will then exit when a match is found without seeking further
    matches - unless that is the deliberate requirement.


    Optionally the list of case statements can be followed by a single final default
    statement to specify code to be executed in the event that no matches are found
    within any of the case statements. So the syntax of a switch statement typically
    looks like this:


    switch ( test-value ) i


    case match-value : statements-to-execute-when-matched case match-value : statements-to-execute-when-matched
    case match-value : statements-to-execute-when-matched default : statements-to-execute-when-no-match-found
    ;


    }


    break ; break ; break ;


    A switch statement can have up to at least 257 case statements according to the
    ANSI C standard, but no two of its case statements can attempt to match the same
    value.


    Where a number of match-values are to each execute the same statements only the
    final case statement need include the statements to be executed and the break
    statement to exit the switch statement block. For example, to output the same
    message for match-values of 0, 1, and 2:


    switch ( num ) {


    case 0 : case 1 :


    case 2 : printf( "Less than 3\n" ) ; break ;


    case 3 : printf( "Exactly 3\n" ) ; break ;


    default : printf( "Greater than 3 or less than zero\n" ) ;


    }


