  raw: 'Pointers are a very useful part of efficient C programming. They are variables
    that store the memory address of other variables.


    When a regular variable is declared memory is allocated, of the size appropriate
    for its data type, at a vacant memory address. Subsequently, wherever the program
    finds that variable name it references the data stored at that memory address.
    Similarly, wherever the program finds the name of a pointer variable it references
    the address it stores. But a pointer variable can be "dereferenced" to reveal
    the data stored at the address it contains.


    Pointer variables are declared in just the same way that other variables are declared
    but the variable name is prefixed by a "*" . In this case the * character represents
    the "dereference operator" and merely denotes that the declared variable is a
    pointer. The pointer''s data type must match the data type of the variable to
    which it points.


    Once declared, a pointer variable can be assigned the address of another variable
    using the & addressof operator. The pointer variable should not be prefixed by
    the * dereference operator in the assignment statement unless the pointer is initialized
    immediately in the pointer variable declaration itself.


    A pointer variable name, when used alone, references a memory address expressed
    in hexadecimal


    When the * dereference operator is used in a variable declaration it merely denotes
    that the variable is a pointer but prefixing a variable pointer name with the
    * dereference operator elsewhere in the program references the data stored at
    the address assigned to that pointer variable.


    A pointer variable name, when prefixed by the * dereference operator after its
    declaration, references the data stored at the address assigned to that pointer
    variable


    This means that a program can get the address assigned to a pointer variable just
    using its name, or it can get the data stored at the address to which it points
    by prefixing its name with the * dereference operator.


    .cont''d


