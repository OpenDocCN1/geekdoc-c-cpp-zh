    Enumerating constant values


    The enum keyword provides a handv wav to create a sequence of integer constants
    in a concise manner. Optionally the declaration can include a name for the sequence
    after the enum keyword. The constant names follow as a comma-separated list within
    braces.


    Each of the constants will by default have a value one greater than that of the
    constant it follows in the list. Unless specified the first constant will have
    a value of zero, the next a value of 1, and so on. For example, named weekday
    constants can be given a sequence of integer values starting at zero with enum{MON,TUE.WED.THU,FRI};
    - in this case the constant WED has an integer value of 2.


    The constants can be assigned any individual integer value in the declaration
    but the next constant in the list will always increment the preceding value bv
    one, unless it too is assigned a value. For example, to begin the sequence at
    one instead of zero, assign one to the first constant with enum{MON = 1,TUE,WED,THU,FRI};
    - in this case the constant WED has an integer value of 3.


    The list of enumerated constants is also known as an "enumeration set" and mav
    contain duplicate constant values. For example, the value zero could be assigned
    to constants named NIL and NONE.


