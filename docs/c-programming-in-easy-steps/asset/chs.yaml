  \n循环是程序中自动重复的一段代码。一次完整地执行完所有属于某个循环的语句被称为一次“迭代”（iteration），或称为一次“通过”（pass）。  \n循环的长度由其在内部进行的条件测试来控制。当被测试的表达式结果为真时，该循环将一直继续——直到被测表达式的值为假时结束。\n\
  \n在 C 语言中有三种类型的循结构：\n-   `for` 循环\n-   `while` 循環\n-   *do while* \n\n其中最常见的大概是\
  \ for (`for`) loop ，它通常采用以下语法：\n\n```c\nfor ( initializer ; test-expression ; incrementer\
  \ ) { statements }\n```\n\n初始化器用于为记录当前已完成的迭代次数的计数器设置初始数值；为此目的而使用的变量一般为整型并且传统上命名为\
  \ i 。  \n\n每次运行到本次代开始时会评估对那个判断式进行求运算值的真假来说那这会不会发生后续相应地的影响来描述的决定是否要要继续下去的办法就是只看其是否为真的逻辑判别的其结果若成立才把这个把控方向的途径发挥作用的它的核心说明的作用能够正确理解使用一种方便的方式来结束这一轮的任务准备好再处理内容里的部分就可以往下走实现的操作时要及时的了解变化情况的反馈给后方好让下一步有依据这就必须贴合具体场景才能更加灵活的应用起来毕竟一旦被判校验操作之后如果整个周期还没满足就停下来之前的准备工作难免会打折扣因而引入更详细的管理机制也就显得重要了所以关键点在于如何合理的构造他让它能顺利运转这样就减少了不明确的地方从而对整个产出的质量有所提升这对提高程序的健壮性也很有好处在实际的过程我们可以利用这一点更好的增强体验同时也避免了意外的麻烦直接导致系统不稳定甚至挂起的现象出现因此掌握基本的格式特别必要前面说到的三要素必不可少第一部分先做好赋值第二步仔细核实要达到什么样的效果决定什么时候退出第三个步骤就是在每完成一次性任务后更新相关数据准备迎接新的挑战最终将这些小块拼接成标准的流程模式这样子既直观又不容易出错很值得推荐作为首选方案来记忆并运用一致的方法论去指导自己写出整洁可靠的代码保持风格清晰可辨对于后期维护非常有帮助相反混乱的结构往往会造成更多意想不到的问题总之有条不紊是实现目标的前提技巧也很简单只要按照规则落实就会得到良好的回报保证了产品质量的同时也为团队合作带来了便利这正是我们需要关注的重点实践过程中遇到的案例都可以参考这个模式逐步完善一并融入日常做的更好一些这样就好了不难发现其实容易上手只是需要多一些耐心反复尝试即可达到熟练的程度既然这么清楚了接下来我们就用实际例子展示来看看它是怎么工作的吧\n\
