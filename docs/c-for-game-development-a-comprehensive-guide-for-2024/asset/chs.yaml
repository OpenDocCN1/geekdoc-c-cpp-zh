  将顶点变换到裁剪空间。\n\n```cpp\n// Vertex Shader\n#version 450\nlayout(location = 0) in vec3\
  \ position;\nlayout(location = 1) in vec3 normal;\n\nuniform mat4 model;\nuniform\
  \ mat4 view;\nuniform mat4 projection;\n\nvoid main() {\n    gl_Position = projection\
  \ * view * model * vec4(position, 1.0);\n}\n```\n\n### 碎片元处理 (Fragment Processing)\n\
  根据插值属性计算像素颜色。\n\n```cpp\n// Fragment Shader\n#version 450\nlayout(location = 0)\
  \ out vec4 fragColor;\n\nvoid main() {\n    fragColor = vec4(1.0);\n}\n```\n\n###\
  \ 高级着色技术\n\n#### 基于物理的渲染 (PBR)\n一种模拟反射率（albedo）、金属光度和环境遮蔽等物理属性的技术。\n\n```cpp\n//\
  \ PBR Shader\n#version 450\nlayout(location = 0) out vec4 fragColor;\n\nin vec3\
  \ fragPosition;\nin vec3 fragNormal;\nin vec2 fragTexCoords;\n\nuniform sampler2D\
  \ albedoMap;\nuniform sampler2D metallicMap;\nuniform sampler2D roughnessMap;\n\
  uniform sampler2D aoMap;\n\nvoid main() {\n    vec3 albedo = texture(albedoMap,\
  \ fragTexCoords).rgb;\n    float metallic = texture(metallicMap, fragTexCoords).r;\n\
  \    float roughness = texture(roughnessMap, fragTexCoords).r;\n    float ao = texture(aoMap,\
  \ fragTexCoords).r;\n\n    vec3 lightColor = vec3(1.0);\n    vec3 lightDir = normalize(vec3(0.0,\
  \ 1.0, 0.0));\n    vec3 viewDir = normalize(cameraPosition - fragPosition);\n\n\
  \    vec3 diffuse = max(dot(fragNormal, lightDir), 0.0) * albedo;\n    vec3 specular\
  \ = calculateSpecular(fragNormal, lightDir, viewDir, roughness, metallic);\n\n \
  \   fragColor = vec4(diffuse * lightColor + specular) * ao;\n}\n```\n\n#### 延迟着色\
  \ (Deferred Shading)\n通过多次渲染渲染场景几何，并将信息存储在 G-buffer 中。在单独的通道中执行光照计算，允许多光源的复杂光照。\n\
  \n```cpp\n// Geometry Pass\n#version 450\nlayout(location = 0) out vec3 gPosition;\n\
  layout(location = 1) out vec3 gNormal;\nlayout(location = 2) out vec4 gAlbedoSpec;\n\
  \nvoid main() {\n    gPosition = fragPosition;\n    gNormal = fragNormal;\n    gAlbedoSpec\
  \ = vec4(texture(albedoMap, fragTexCoords).rgb, 1.0);\n}\n\n// Lighting Pass\n#version\
  \ 450\nlayout(location = 0) out vec4 fragColor;\n\nuniform sampler2D gPosition;\n\
  uniform sampler2D gNormal;\nuniform sampler2D gAlbedoSpec;\n\nvoid main() {\n  \
  \  vec3 position = texture(gPosition, fragTexCoords).rgb;\n    vec3 normal = texture(gNormal,\
  \ fragTexCoords).rgb;\n    vec3 albedo = texture(gAlbedoSpec, fragTexCoords).rgb;\n\
  \n    vec3 lightDir = normalize(lightPosition - position);\n    vec3 viewDir = normalize(cameraPosition\
  \ - position);\n\n    vec3 diffuse = max(dot(normal, lightDir), 0.0) * albedo;\n\
  \    vec3 specular = calculateSpecular(normal, lightDir, viewDir);\n\n    fragColor\
  \ = vec4(diffuse + specular, 1.0);\n}\n```\n\n\n\n\n\n# 高级光技术\n\n## 全局光照 (GI)\n\n\
  通过考虑光线在表面上的反射来模拟间接照明。\n技术包括体素锥追踪、光照传播体积和屏幕空间光照。\n\n```cpp\n// Voxel Cone Tracing\
  \ Example\nvoid voxelConeTracing(vec3 position, vec3 normal) {\n    // Trace cones\
  \ in various directions\n    for (int i = 0; i < coneCount; ++i) {\n        vec3\
  \ direction = getConeDirection(i, normal);\n        vec3 color = traceCone(position,\
  \ direction);\n        indirectLight += color;\n    }\n}\n```\n\n## 屏幕空间反射 (SSR)\n\
  \n通过在屏幕空间内进行射线步进并利用深度缓冲区计算反射。\n通过反射动态物体和环境来增强真实感。\n\n```cpp\n// SSR Fragment Shader\
  \ Example\nvoid main() {\n    vec3 viewDir = normalize(cameraPosition - fragPosition);\n\
  \    vec3 reflectDir = reflect(viewDir, fragNormal);\n    vec3 samplePosition =\
  \ fragPosition;\n\n    for (int i = 0; i < maxSteps; ++i) {\n        samplePosition\
  \ += reflectDir * stepSize;\n        vec3 sampleColor = texture(screenTexture, samplePosition.xy\
  \ / samplePosition.z).rgb;\n        if (length(sampleColor) > threshold) {\n   \
  \         reflectionColor = sampleColor;\n            break;\n        }\n    }\n\
  \    fragColor = mix(originalColor, reflectionColor, reflectionFactor);\n}\n```\n\
  \n## 后处理特效\n\n### 溢光 (Bloom)\n\n通过提取高亮区域并应用模糊创建光光效果。\n增强亮光和反射的视觉吸引力。\n\n```cpp\n\
  // Bloom Extract Pass\nvoid extractBrightAreas() {\n    for (int i = 0; i < screenWidth;\
  \ ++i) {\n        for (int j = 0; j < screenHeight; ++j) {\n            vec3 color\
  \ = texture(sceneTexture, vec2(i, j) / screenSize).rgb;\n            if (length(color)\
  \ > bloomThreshold) {\n                brightTexture[i][j] = color;\n          \
  \  } else {\n                brightTexture[i][j] = vec3(0.0);\n            }\n \
  \       }\n    }\n}\n\n// Bloom Blur Pass\nvoid blurBrightAreas() {\n    for (int\
  \ i = 0; i < blurIterations; ++i) {\n        for (int j = 0; j < screenHeight; ++j)\
  \ {\n            for (int k = 0; k < screenWidth; ++k) {\n                vec3 blurColor\
  \ = vec3(0.0);\n                for (int l = -blurRadius; l <= blurRadius; ++l)\
  \ {\n                    blurColor += brightTexture[j][k + l] * blurWeights[l +\
  \ blurRadius];\n                }\n                blurredTexture[j][k] = blurColor;\n\
  \            }\n        }\n    }\n}\n```\n\n### 深 (DoF)\n\n通过模糊焦平面之外的物体来模拟相机聚焦。\n\
  为场景添加电影感质量和深度。\n\n```cpp\n// DoF Fragment Shader Example\nvoid main() {\n    float\
  \ depth = texture(depthTexture, fragTexCoords).r;\n    float focusFactor = abs(focusDepth\
  \ - depth) / focusRange;\n    vec3 color = texture(sceneTexture, fragTexCoords).rgb;\n\
  \    vec3 blurredColor = texture(blurredTexture, fragTexCoords).rgb;\n    fragColor\
  \ = mix(color, blurredColor, focusFactor);\n}\n```\n\n## 体积特效\n\n### 体积光\n\n模拟光线通过雾或烟雾等介质的散射。\n\
  增加大气深度和真实感。\n\n```cpp\n// Volumetric Lighting Example\nvoid calculateVolumetricLight(vec3\
  \ lightPos, vec3 fragPos, vec3 viewDir) {\n    vec3 lightDir = normalize(lightPos\
  \ - fragPos);\n    float scattering = dot(viewDir, lightDir) * scatteringFactor;\n\
  \    vec3 scatterColor = lightColor * scattering;\n    fragColor = mix(fragColor,\
  \ scatterColor, volumetricFactor);\n}\n```\n\n### 雾雾与大气散射\n\n通过模拟大气中的光散射来增强深度感知。\n\
