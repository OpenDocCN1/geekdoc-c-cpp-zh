  lights[\" + std::to_string(i) + \"].Color\", lightColors[i]);\n}\nrenderQuad();\n\
  ```\n\n# 动画与骨骼系统\n\n游戏开发中的动画通过快速显示一系列帧产生运动幻象。基本概念包括：\n\n### 关键帧动画\n\n定义运动的关键点（关键帧），并在它们之间进行插值以创建平滑的过渡。\n\
  \n```cpp\nstruct Keyframe {\n    float time;\n    vec3 position;\n    quat rotation;\n\
  \    vec3 scale;\n};\n```\n\n### 绑定 (Rigging)\n\n为 3D 模型创建骨骼结构的过程，使其能够真实地移动和变形。\n\
  \n## 骨骼动画 (Skeletal Animation)\n\n骨骼动画是一种通过使用骨骼和关节的层次结构来实现更复杂真实运动的技术。关键组件包括：\n\n\
  -   **骨骼 (Bones)**：代表骨骼的刚性部分，并定义规定移动的层次结构。\n-   **关节 (Joints)**：连接骨骼并提供旋转或移动的点。\n\
  \n```cpp\nstruct Bone {\n    std::string name;\n    int parentIndex;\n    mat4 offsetMatrix;\n\
  \    mat4 finalTransformation;\n};\n\nstruct Skeleton {\n    std::vector<Bone> bones;\n\
  \    std::vector<mat4> boneTransforms;\n}\n```\n\n\n\n\n## 2. 蒙皮\n- **蒙皮 (Skinning)**：将网格绑定到骨骼的过程，允许网格根据骨骼的移动产生变形。\n\
  - **线性混合蒙皮 (LBS)**：一种常用技术，每个顶点受多个骨骼的影响，并通过权重定义这种影响程度。\n\n```cpp\nvec3 skinVertex(const\
  \ vec3& vertex, const vec4& weights, const ivec4& boneIndices) {\n    mat4 transform\
  \ = mat4(0.0);\n    for (int i = 0; i < 4; ++i) {\n        transform += weights[i]\
  \ * boneTransforms[boneIndices[i]];\n    }\n    return (transform * vec4(vertex,\
  \ 1.0)).xyz;\n}\n```\n\n## 3. 逆向动力学 (IK)\n- 一用于计算必要的关节角度以使端执行器（如手或脚）达到所需位置的技术。\n\
  - `IK` 对于真实的角色移动至关重要，例如伸手拿物体或将脚放在不平的地面上。\n\n```cpp\nvec3 calculateIK(vec3 target,\
  \ vec3 initialPos, vec3 boneDir, float boneLength) {\n    vec3 dirToTarget = normalize(target\
  \ - initialPos);\n    float angle = acos(dot(boneDir, dirToTarget));\n    vec3 rotationAxis\
  \ = cross(boneDir, dirToTarget);\n    quat rotation = angleAxis(angle, rotationAxis);\n\
  \    return initialPos + (rotation * vec4(boneDir, 0.0) * boneLength).xyz;\n}\n\
  ```\n\n## 动画技术\n\n### 混合树 (Blend Trees)\n一种用于混合多种动画的技术，允许平滑过渡和复杂的动作。\n混合树通常用于根据角速度组合空闲、行走和跑步动画。\n\
  \n```cpp\nfloat blendFactor = clamp((characterSpeed - walkSpeed) / (runSpeed - walkSpeed),\
  \ 0.0, 1.0);\nvec3 blendedPosition = mix(walkAnimation.position, runAnimation.position,\
  \ blendFactor);\nquat blendedRotation = slerp(walkAnimation.rotation, runAnimation.rotation,\
  \ blendFactor);\n```\n\n### 动画控制器 (Animation Controllers)\n管理不同动画之间的状态和转换，通常使用状态机。\n\
  动画控制器对于处理复杂的角色行为和交互至关重要。\n\n```cpp\nenum class AnimationState { Idle, Walking, Running,\
  \ Jumping };\n\nclass AnimationController {\npublic:\n    void update(float deltaTime)\
  \ {\n        switch (currentState) {\n            case AnimationState::Idle:\n \
  \               if (characterSpeed > 0.1f) {\n                    transitionToState(AnimationState::Walking);\n\
  \                }\n                break;\n            case AnimationState::Walking:\n\
  \                if (characterSpeed > walkSpeed) {\n                    transitionToState(AnimationState::Running);\n\
  \                } else if (characterSpeed < 0.1f) {\n                    transitionToState(AnimationState::Idle);\n\
  \                }\n                break;\n            // Add transitions for other\
  \ states\n        }\n    }\n\nprivate:\n    AnimationState currentState;\n    void\
  \ transitionToState(AnimationState newState) {\n        // Handle state transition\
  \ logic\n        currentState = newState;\n    }\n};\n```\n\n## 高级动画技术\n\n### 动作捕获\
  \ (MoCap)\n一种记录真实演员动作并将其映射到数字角色上的方法，以实现高写实度。\n`MoCap` 数据可以经过处理和精炼以创建栩栩生的动画。\n\n\
  ### 程序化动画 (Procedural Animation)\n使用算法实时生成动画，通常用于二次运动，如头发、布料或环境交互。\n`Procedural`\
