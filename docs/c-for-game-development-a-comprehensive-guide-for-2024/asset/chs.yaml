  \n```cpp\nstruct Node {\n    sf::Vector2i position;\n    float gCost = 0;\n    float\
  \ hCost = 0;\n    Node* parent = nullptr;\n\n    float fCost() const { return gCost\
  \ + hCost; }\n};\n\nclass Grid {\npublic:\n    Grid(int width, int height);\n  \
  \  Node* getNode(sf::Vector2i position);\n    std::vector<Node*> getNeighbors(Node*\
  \ node);\n\nprivate:\n    int width_;\n    int height_;\n    std::vector<std::vector<Node>>\
  \ nodes_;\n};\n```\n\n### 实现 A* 算法\n实现 A* 算法以找到 `NPC` 到玩家之间的最短路径。\n\n```cpp\n#include\
  \ <queue>\n#include <algorithm>\n#include <cmath>\n\nstd::vector<sf::Vector2i> findPath(Grid&\
  \ grid, sf::Vector2i start, sf::Vector2i goal) {\n    auto heuristic = [](const\
  \ sf::Vector2i& a, const sf::Vector2i& b) {\n        return std::abs(a.x - b.x)\
  \ + std::abs(a.y - b.y);\n    };\n\n    std::priority_queue<Node*, std::vector<Node*>,\
  \ decltype([](Node* a, Node* b) {\n        return a->fCost() > b->fCost();\n   \
  \ })> openSet;\n\n    Node* startNode = grid.getNode(start);\n    Node* goalNode\
  \ = grid.getNode(goal);\n    \n    if (!startNode || !goalNode) return {};\n\n \
  \   startNode->gCost = 0;\n    startNode->hCost = heuristic(start, goal);\n    openSet.push(startNode);\n\
  \n    while (!openSet.empty()) {\n        Node* current = openSet.top();\n     \
  \   openSet.pop();\n\n        if (current == goalNode) {\n            std::vector<sf::Vector2i>\
  \ path;\n            while (current != startNode) {\n                path.push_back(current->position);\n\
  \                current = current->parent;\n            }\n            std::reverse(path.begin(),\
  \ path.end());\n            return path;\n        }\n        // ... 扩展逻辑\n    }\n\
  \    return {};\n}\n```\n\n\n\n\n\n```cpp\nreturn path;\n}\n\nfor (Node* neighbor\
  \ : grid.getNeighbors(current)) {\n    float tentativeGCost = current->gCost + 1;\n\
  \    if (tentativeGCost < neighbor->gCost) {\n        neighbor->parent = current;\n\
  \        neighbor->gCost = tentativeGCost;\n        neighbor->hCost = heuristic(neighbor->position,\
  \ goal);\n        openSet.push(neighbor);\n    }\n}\n\nreturn {};\n}\n```\n\n###\
