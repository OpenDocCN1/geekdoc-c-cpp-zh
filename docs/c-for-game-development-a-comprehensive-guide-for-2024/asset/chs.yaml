  renderScene(shadowShader);\n```\n\n### 级联阴影映射 (CSM)\n\n针对大场景的阴影映射增强技术，将视视体体分成多个部分，每个部分都有自己的阴影映射。这种技术改进了阴影质量并减少了伪影。\n\
  \n```cpp\nfor (int i = 0; i < cascadeLevels; ++i) {\n    glViewport(0, 0, shadowWidth[i],\
