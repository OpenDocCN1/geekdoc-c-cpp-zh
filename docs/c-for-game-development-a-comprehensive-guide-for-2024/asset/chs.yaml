  \n```cpp\nssaoShader.use();\nssaoShader.setInt(\"gPosition\", 0);\nssaoShader.setInt(\"\
  gNormal\", 0);\n```\n\n## 动画\n\n光照与阴影的相互作用对于实现真实场景至关重要。延迟渲染等技术允许\n\n### 延迟渲染 (Deferred\
