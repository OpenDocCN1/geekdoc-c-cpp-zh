  \  void setupMenuItems() {\n        menuItems.push_back(MenuItem(\"Graphics\", []()\
  \ { openGraphicsSettings(); }));\n        menuItems.push_back(MenuItem(\"Audio\"\
  , []() { openAudioSettings(); }));\n        menuItems.push_back(MenuItem(\"Controls\"\
  , []() { openControlSettings(); }));\n    }\n};\n```\n\n## 实现 HUD\n\n### 血量和状态条\n\
  HUD 最关键的元素之一是血条，它提供了玩家当前健康状况的视觉表示。可以使用简单的图形元素来实现，根据玩家的血量动态变化。\n\n```cpp\nclass HealthBar\
