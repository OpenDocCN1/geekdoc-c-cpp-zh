    \ <iostream>\n\nint main() {\n    int playerScore = 85;\n\n    if (playerScore\
    \ >= 90) {\n        std::cout << \"Congratulations! You achieved an A grade!\"\
    \ << std::endl;\n    }\n    else if (playerScore >= 80) {\n        std::cout <<\
    \ \"Well done! You got a B grade.\" << std::endl;\n    }\n    else {\n       \
    \ std::cout << \"Keep practicing! You can improve.\" << std::endl;\n    }\n\n\
    \    for (int i = 0; i < 5; ++i) {\n        std::cout << \"Count: \" << i << std::endl;\n\
    \    }\n\n    int countdown = 3;\n    while (countdown > 0) {\n        std::cout\
    \ << \"Countdown: \" << countdown << std::endl;\n        countdown--;\n    }\n\
    \n    return 0;\n}\n```\n\n1. `if`, `else if`, `else`: Used for conditional branching\
    \ based on the player's score.\n2. `for (int i = 0; i < 5; ++i)`: A `for` loop\
    \ that iterates from 0 to 4 (inclusive) and prints the count.\n3. `while (countdown\
