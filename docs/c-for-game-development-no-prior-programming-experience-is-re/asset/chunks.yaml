    \ are examples of declaring variables and using basic data types:\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    int score = 100;\n    float pi = 3.14f;\n\
    \    char grade = 'A';\n    bool isGameRunning = true;\n\n    std::cout << \"\
    Score: \" << score << std::endl;\n    std::cout << \"Pi value: \" << pi << std::endl;\n\
    \    std::cout << \"Grade: \" << grade << std::endl;\n    std::cout << \"Game\
    \ Running? \" << std::boolalpha << isGameRunning << std::endl;\n\n    return 0;\n\
    }\n```\n\n1. `int score = 100;`: Declares an integer variable named `score` and\
    \ initializes it with the value `100`.\n2. `float pi = 3.14f;`: Declares a floating-point\
