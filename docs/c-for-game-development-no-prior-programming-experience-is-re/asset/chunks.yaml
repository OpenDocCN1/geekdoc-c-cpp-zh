    \ to create SDL window: \" << SDL_GetError() << std::endl;\n        SDL_Quit();\n\
    \        return -1;\n    }\n\n    // Game loop\n    bool quit = false;\n    SDL_Event\
    \ event;\n    while (!quit) {\n        while (SDL_PollEvent(&event)) {\n     \
    \       if (event.type == SDL_QUIT) {\n                quit = true;\n        \
    \    }\n            // Handle other events here\n        }\n        // Update\
    \ game logic and render here\n    }\n\n    // Cleanup and exit\n    SDL_DestroyWindow(window);\n\
    \    SDL_Quit();\n    return 0;\n}\n```\n\n### Handling Keyboard Input\n\nTo handle\
    \ keyboard input, you can check for key events inside the event loop:\n\n```cpp\n\
    while (SDL_PollEvent(&event)) {\n    if (event.type == SDL_QUIT) {\n        quit\
    \ = true;\n    } else if (event.type == SDL_KEYDOWN) {\n        switch (event.key.keysym.sym)\
