    }\n```\n\nThis loop will iterate five times, printing \"Iteration 1\" to \"Iteration\
    \ 5\".\n\n#### `while` Loop\n\nThe `while` loop is used when the number of iterations\
    \ depends on a condition.\n\n```cpp\n#include <iostream>\n\nint main() {\n   \
    \ int countdown = 3;\n    while (countdown > 0) {\n        std::cout << \"Countdown:\
    \ \" << countdown << std::endl;\n        --countdown;\n    }\n    std::cout <<\
    \ \"Liftoff!\" << std::endl;\n    return 0;\n}\n```\n\nIn this example, the loop\
    \ runs until `countdown` becomes 0, printing the countdown values and then \"\
    Liftoff!\".\n\n### Control Flow in Game Development\n\nIn game development, control\
    \ flow statements are extensively used for various purposes:\n\n1.  **Game State\
