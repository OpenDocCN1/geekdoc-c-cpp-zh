    In this example, `Weapon` is a base class, and `Sword` is a derived class inheriting
    from `Weapon`. The `Sword` class adds additional attributes and methods specific
    to swords while inheriting the common properties from `Weapon`. This hierarchical
    structure promotes code reuse and allows for specialization of objects.


    Benefits of Classes and Objects in Game Development


    1\. Modularity: Classes and objects promote modular design, allowing developers
    to manage game entities, systems, and behaviors independently.


    2\. Code Reusability: Object-oriented programming facilitates code reuse through
    inheritance and polymorphism, reducing redundant code and enhancing productivity.


    3\. Encapsulation: Encapsulation ensures data security, hides implementation details,
    and promotes a clear interface for interacting with objects.


    4\. Abstraction: Data abstraction simplifies complex systems by focusing on essential
    features and hiding unnecessary details.


    5\. Hierarchy and Polymorphism: Inheritance and polymorphism enable hierarchical
    structures and dynamic behavior based on object types, enhancing flexibility and
    extensibility.


    By leveraging classes and objects effectively, game developers can create scalable,
    maintainable, and feature-rich game systems with organized code, improved data
    management, and streamlined development processes. OOP principles are foundational
    in modern game development frameworks and engines, empowering developers to build
    complex and engaging games efficiently.


    Inheritance: Building Relationships Between Game Objects


    Inheritance is a fundamental concept in object-oriented programming (OOP) that
    allows for building relationships between classes, promoting code reuse, and creating
    hierarchies of related objects. In game development, inheritance is crucial for
    modeling game entities, behaviors, and relationships, leading to more organized
    and scalable codebases. Let''s explore inheritance in C++ for game development
    with relevant code examples and its impact on building relationships between game
    objects.


    Understanding Inheritance in C++


    Inheritance involves creating new classes (derived or child classes) based on
    existing classes (base or parent classes). The derived class inherits attributes
    and behaviors from its base class and can extend or modify them as needed. This
    concept follows the "is-a" relationship, where a derived class "is-a" type of
    its base class.


    ```cpp


    #include <iostream>


    #include <string>


    // Base class representing a GameCharacter


    class GameCharacter {


    public:


    GameCharacter(const std::string& name, int health) : characterName(name), characterHealth(health)
    {}


    void displayInfo() const {


    std::cout << "Character Name: " << characterName << ", Health: " << characterHealth
    << std::endl;


    }


    protected:


    std::string characterName;


    int characterHealth;


    };


    // Derived class representing a PlayerCharacter (inherits from GameCharacter)


    class PlayerCharacter : public GameCharacter {


    public:


    PlayerCharacter(const std::string& name, int health, int experience)


    : GameCharacter(name, health), playerExperience(experience) {}


    void displayPlayerInfo() const {


    std::cout << "Player Name: " << characterName << ", Health: " << characterHealth


    << ", Experience: " << playerExperience << std::endl;


    }


    private:


    int playerExperience;


    };


    int main() {


    PlayerCharacter player("Hero", 100, 500);


    player.displayInfo(); // Accessing base class method


    player.displayPlayerInfo(); // Accessing derived class method


    return 0;


    }


    ```


    In this example, `GameCharacter` is the base class, and `PlayerCharacter` is the
    derived class inheriting from `GameCharacter`. The `PlayerCharacter` class inherits
    the `characterName` and `characterHealth` attributes from `GameCharacter` and
    adds the `playerExperience` attribute specific to player characters.


    Types of Inheritance


    1\. Single Inheritance: A derived class inherits from only one base class.


    2\. Multiple Inheritance: A derived class inherits from multiple base classes.


    3\. Multilevel Inheritance: A derived class is derived from another derived class,
    forming a hierarchy.


    ```cpp


    // Example of multiple inheritance


    class Weapon {


    public:


    Weapon(const std::string& name, int damage) : weaponName(name), weaponDamage(damage)
    {}


    void displayWeaponInfo() const {


    std::cout << "Weapon Name: " << weaponName << ", Damage: " << weaponDamage <<
    std::endl;


    }


    protected:


    std::string weaponName;


    int weaponDamage;


    };


    class Sword : public Weapon {


    public:


    Sword(const std::string& name, int damage) : Weapon(name, damage) {}


    void displaySwordInfo() const {


    std::cout << "Sword Name: " << weaponName << ", Damage: " << weaponDamage << std::endl;


    }


    };


    class MagicStaff : public Weapon {


    public:


    MagicStaff(const std::string& name, int damage) : Weapon(name, damage) {}


    void displayStaffInfo() const {


    std::cout << "Staff Name: " << weaponName << ", Damage: " << weaponDamage << std::endl;


    }


    };


    class Wizard : public Sword, public MagicStaff {


    public:


    Wizard(const std::string& name, int swordDamage, int staffDamage)


    : Sword("Excalibur", swordDamage), MagicStaff("Fire Staff", staffDamage), characterName(name)
    {}


    void displayInfo() const {


    std::cout << "Wizard Name: " << characterName << std::endl;


    displaySwordInfo(); // Accessing methods from base classes


    displayStaffInfo();


    }


    private:


    std::string characterName;


    };


    int main() {


    Wizard wizard("Gandalf", 50, 80);


    wizard.displayInfo(); // Displaying combined information


    return 0;


    }


    ```


    In this multiple inheritance example, `Sword` and `MagicStaff` are derived from
    the `Weapon` base class, and `Wizard` inherits from both `Sword` and `MagicStaff`,
    showcasing multiple inheritance.


    Benefits of Inheritance in Game Development


    1\. Code Reuse: Inheritance promotes code reuse by inheriting properties and behaviors
    from existing classes, reducing redundant code and enhancing productivity.


    2\. Hierarchy and Structure: Inheritance allows for building hierarchical structures
    of related classes, reflecting real-world relationships and improving code organization.


    3\. Polymorphism: Inheritance enables polymorphism, where derived classes can
    be treated as their base class type, promoting flexibility and extensibility in
    game systems.


    4\. Specialization and Customization: Derived classes can specialize and customize
    behaviors or attributes inherited from base classes, providing tailored functionalities
    for specific game entities.


    5\. Maintenance and Scalability: Inheritance simplifies maintenance and scalability
    by modularizing code into manageable units, making it easier to add new features
    or modify existing ones.'
