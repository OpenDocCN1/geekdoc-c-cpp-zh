    ## 引言


    释放 C++ 的力量：逐像素打造你的梦想游戏（即使你是编程新手）


    你是否曾梦想构建沉浸式的世界？打造让玩家着迷、意犹未尽的游戏？那就来探索传奇的 C++ 游戏开发领域吧！本书是你将这些梦想转化为惊人现实的门户。


    忘掉那些限制你创造力的笨重、预构建的游戏引擎吧。C++ 赋予你原始、无拘无束的力量，从核心机制到炫目视觉效果，塑造你游戏的方方面面。它是行业巨头如 Epic
    Games（虚幻引擎）和 Crytek（CryEngine）打造杰作所信赖的语言。


    但是等等，C++ 不是很复杂吗？虽然它以健壮著称，但有些人可能觉得它令人生畏。秘诀在于：本书将 C++ 游戏开发分解为一系列清晰、可操作的步骤。我们将手把手地引导你从绝对基础开始，直到构建出你的第一款引人入胜的游戏。


    在这段激动人心的 C++ 游戏开发之旅中，你将收获：


    ● 掌握基础：我们将建立坚实的 C++ 语法、变量、运算符和控制流基础。这些是构建你游戏逻辑的基石。


    ● 拥抱面向对象编程（OOP）：学习为你的游戏对象创建可复用的类，促进代码的整洁与高效。思考玩家、敌人、强化道具——所有这些都基于 OOP 原则构建！


    ● 释放图形的力量：探索 2D 图形，使用精灵和动画让你的游戏世界栩栩如生（可选：使用 OpenGL 或 DirectX 等流行库深入 3D 图形）。


    ● 打造逼真的物理效果：通过实现力、运动和碰撞检测等物理概念，让你的游戏对象逼真地移动。想象你的角色跳跃、躲避并与环境互动——物理让这一切成为可能！


    ● 构建游戏引擎（可选）：接受终极挑战，构建你自己的核心游戏引擎框架。学习如何管理游戏循环、对象和用户输入，深入理解游戏幕后的运作原理。


    ● 优化与调试：我们将为你提供识别和修复错误的工具，确保你的游戏运行流畅，提供卓越的玩家体验。


    如果你符合以下情况，本书非常适合你：


    ● 你是完全的初学者：无需任何编程经验；我们将一步步引导你。


    ● 你是经验丰富的程序员：渴望获得 C++ 为游戏开发提供的终极控制力和灵活性。


    ● 你是有抱负的游戏开发者：渴望摆脱限制，构建真正独特的游戏。


    在这段旅程结束时，你将能够：


    ● 自信地编写专为游戏开发量身定制的 C++ 代码。


    ● 具备设计和构建沉浸式游戏机制的知识。


    ● 有能力创造视觉震撼且引人入胜的游戏体验。


    停止梦想，开始构建吧！打开本书，踏上你的 C++ 游戏开发冒险之旅。让我们将这些像素锻造成迷人的世界和难忘的游戏体验！


    ## 第 1 章


    为什么选择 C++ 进行游戏开发？


    C++ 凭借其性能、灵活性和底层控制的独特结合，在游戏开发领域仍然占据主导地位。让我们深入探讨为什么 C++ 是游戏开发的首选，并附上基于 C++ 游戏开发实践的代码示例。


    1. 性能优化

