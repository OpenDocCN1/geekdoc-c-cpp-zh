    \ = 'A';`: Declares a character variable named `grade` and initializes it with\
    \ the character `'A'`.\n4. `bool isGameRunning = true;`: Declares a boolean variable\
    \ named `isGameRunning` and initializes it with the value `true`.\n\n### Control\
