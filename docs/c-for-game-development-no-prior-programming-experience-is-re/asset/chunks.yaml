    \ 获取鼠标坐标，以确定用户在屏幕上的点击位置。\n\n## 游戏手柄输入\n\n现代游戏手柄可以增强游戏体验。SDL 也提供了对游戏手柄输入的支持。以下是一个基本示例：\n\
    \n```cpp\n// 使用游戏控制器支持初始化 SDL\nif (SDL_Init(SDL_INIT_VIDEO | SDL_INIT_GAMECONTROLLER)\
