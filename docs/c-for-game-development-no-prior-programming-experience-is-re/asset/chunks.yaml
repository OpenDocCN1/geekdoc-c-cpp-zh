    Optimization: Use fixed-size arrays instead of dynamic structures where possible
    for better memory locality and reduced memory overhead.


    3\. Loop Optimization


    Optimizing loops can significantly improve code performance, especially in computationally
    intensive sections.


    Example: Loop Unrolling


    ```cpp


    #include <vector>


    void ProcessData(const std::vector<int>& data) {


    int sum = 0;


    for (size_t i = 0; i < data.size(); ++i) {


    sum += data[i];


    }


    }


    int main() {


    std::vector<int> numbers(1000000, 1); // Large data set


    ProcessData(numbers);


    return 0;


    }


    ```


    Optimization: Unroll loops manually or enable compiler optimizations (`-O2`, `-O3`)
    to allow the compiler to perform loop unrolling optimizations.


    4\. Parallelism and Multithreading


    Utilizing multi-threading and parallel processing can leverage modern CPUs'' capabilities
    to improve performance for parallelizable tasks.


    Example: Multi-Threading


    ```cpp


    #include <iostream>


    #include <thread>


    void Task(int id) {


    std::cout << "Thread " << id << " started\n";


    // Perform task...


    std::cout << "Thread " << id << " finished\n";


    }


    int main() {


    std::thread t1(Task, 1);


    std::thread t2(Task, 2);


    t1.join();


    t2.join();   


    return 0;


    }


    ```


    Optimization: Identify tasks that can run concurrently and use multi-threading
    (e.g., std::thread, std::async) to parallelize computations and improve overall
    performance.


    5\. Compiler Optimizations


    Modern compilers offer a range of optimizations to improve code performance automatically.


    Example: Compiler Optimizations


    ```cpp


    #include <vector>


    void ProcessData(const std::vector<int>& data) {


    int sum = 0;


    for (int num : data) {


    sum += num;


    }


    }


    int main() {


    std::vector<int> numbers(1000000, 1); // Large data set


    ProcessData(numbers);


    return 0;


    }


    ```


    Optimization: Enable compiler optimizations (e.g., `-O2`, `-O3` for GCC/Clang)
    to let the compiler perform optimizations such as loop unrolling, inlining, and
    code rearrangement.


    6\. Profile and Iterate


    After applying optimizations, profile your code again to measure improvements
    and identify new bottlenecks. Optimization is an iterative process, and continuous
    profiling and refinement lead to better performance.


