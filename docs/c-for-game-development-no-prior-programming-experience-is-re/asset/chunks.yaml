    \n5. **Class**：C++ 中的一种用户定义数据类型，它封装了数据（属性）和操作该数据的函数（方法）。类是面向对象编程（OOP）的基础，在游戏开发中广泛用于创建游戏对象和实体。\n\
    \n6. **Object**：类的实例。对象保存由类定义的数据，并可以执行由类的方法定义的操作。\n\n7. **Inheritance**：OOP 中的一种机制，其中一个类（派生类或子类）可以从另一个类（基类或父类）继承属性和方法。继承促进了代码重用和游戏开发架构中的层次结构。\n\
    \n8. **Polymorphism**：对象根据其上下文呈现多种形式或行为的能力。C++ 中的多态性通过虚函数、函数重写和函数重载实现，允许灵活和可扩展的代码设计。\n\
    \n9. **Template**：C++ 中的一项功能，通过定义带有占位符类型的函数或类来实现泛型编程。模板支持代码重用，并为创建游戏开发中使用的数据结构和算法提供了灵活性。\n\
