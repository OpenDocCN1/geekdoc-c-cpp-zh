    OpenGL uses transformation matrices to apply transformations to objects. Here''s
    an example of a transformation matrix for translation:


    ```cpp


    #include <glm/glm.hpp>


    #include <glm/gtc/matrix_transform.hpp>


    void renderModel(const glm::mat4& view, const glm::mat4& projection) {


