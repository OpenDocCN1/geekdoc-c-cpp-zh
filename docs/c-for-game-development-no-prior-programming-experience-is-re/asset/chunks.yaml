    \ of variables or player input.\n\n```cpp\n#include <iostream>\n\nint main() {\n\
    \    int playerHealth = 75;\n    if (playerHealth > 0) {\n        std::cout <<\
    \ \"Player is alive.\" << std::endl;\n    }\n    else {\n        std::cout <<\
    \ \"Player is defeated.\" << std::endl;\n    }\n    return 0;\n}\n```\n\nIn this\
    \ example, the program checks if the player's health (`playerHealth`) is greater\
    \ than 0. If so, it prints \"Player is alive\"; otherwise, it prints \"Player\
    \ is defeated\".\n\nYou can also use `else if` to handle multiple conditions:\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int playerScore = 85;\n   \
    \ if (playerScore >= 90) {\n        std::cout << \"Excellent score!\" << std::endl;\n\
    \    }\n    else if (playerScore >= 80) {\n        std::cout << \"Good score!\"\
    \ << std::endl;\n    }\n    else {\n        std::cout << \"Work harder for a higher\
    \ score!\" << std::endl;\n    }\n    return 0;\n}\n```\n\n### Looping with `for`\
    \ and `while` Statements\n\nLoops are essential for repeating tasks such as iterating\
    \ over arrays, updating game states, or running game simulations. Two commonly\
    \ used loop structures are `for` and `while`.\n\n#### `for` Loop\n\nThe `for`\
    \ loop is used when you know the number of iterations in advance.\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    for (int i = 0; i < 5; ++i) {\n     \
