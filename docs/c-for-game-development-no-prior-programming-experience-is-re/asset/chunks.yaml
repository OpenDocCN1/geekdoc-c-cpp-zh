    \n1.  **第一定律（惯性定律）**：静止的物体保持静止，运动的物体保持运动，除非受到外力作用。\n2.  **第二定律（加速度定律）**：物体的加速度与其所受的合外力成正比，与其质量成反比（`F\
    \ = ma`）。\n3.  **第三定律（作用与反作用）**：每一个作用力都有一个大小相等、方向相反的反作用力。\n\n### 在C++中实现力\n\n\
