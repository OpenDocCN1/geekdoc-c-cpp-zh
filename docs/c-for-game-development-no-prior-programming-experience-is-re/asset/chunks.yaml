    SDL_Quit();


    return 0;


    }


    ```


    Handling Keyboard Input


    To handle keyboard input, you can check for key events inside the event loop:


    ```cpp


    while (SDL_PollEvent(&event)) {


    if (event.type == SDL_QUIT) {


