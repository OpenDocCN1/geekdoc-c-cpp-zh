    \ Management**：\n    * **Stack**：存储局部变量、函数参数和函数返回地址的内存区域。栈内存由编译器自动管理。\n    * **Heap**：用于动态内存分配的内存区域。游戏开发人员使用堆来为对象、纹理、音频资产和运行时所需的其他资源分配内存。\n\
