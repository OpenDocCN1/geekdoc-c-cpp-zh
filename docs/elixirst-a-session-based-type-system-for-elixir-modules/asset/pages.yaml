    b, v = b \\ [/] & p = x \\ \text{\textbf{match}}(w_1, v_1), \text{\textbf{match}}(w_2,
    v_2) & p = [w_1 | w_2], v = [v_1 | v_2] \\ \text{\textbf{match}}(w_1, v_1), ...,
    \text{\textbf{match}}(w_n, v_n) & p = \{w_1, ..., w_n\} \text{ and } v = \{v_1,
