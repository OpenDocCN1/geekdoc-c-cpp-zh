  md: '![](img/21b2a144330b93d666562c91ebc20aff_8_0.png)


    ![](img/21b2a144330b93d666562c91ebc20aff_8_1.png)


    In contrast, a call to a (private) function, f/n, with an unknown session type
    associated to it is typechecked using the [rUNKNOWNCALL] rule. As in the other
    rule, it ensures that parameters have the correct types (Γ ⊢exp ei : Ti). In addition,
    it also analyses the function body t (obtained from Σ) with respect to the session
    type S inherited from the initial session type of the call. This session type
    is appended to the session typing environment Δ for future reference, i.e., Δ''
    = (Δ, f/n : S) which allows it to handle recursive calls to itself; should the
    function be called again, rule [rKNOWNCALL] is used thus bypassing the need to
    re-analyse its body.


    The remaining rules (Fig. 4) make up the functional aspect of the language. The
    let statement x = t1 ; t2 is typechecked using the rule [rLET]. The initial session
    type S is first transformed to S'' due to some actions in t1 and finally becomes
    S'''' after the actions in t2. The rule [rCASE] checks the case construct, where
    each case has to match the corresponding type T and session type S. The final
    pattern (Xni) of the case construct acts as a catch-all alternative to ensure
    that all values are matched to at least one case. The catch-all case is sometimes
    omitted for ease of readability. Finally, [rEXPRESSION] checks all expressions
    e using expression typing. Expressions do not have a side effect, so the continuation
    session type S remains unchanged.


    Expression typing. Expressions are typechecked using the judgement Γ ⊢exp e :
    T, where expression e has type T subject to the variable environment Γ. The expression
    typing rules (Fig. 5) are adapted from [13]. Rule [rBASIC] checks the type of
    basic values using the function type, which returns the type for basic values,
    e.g., type(true) = boolean. Rule [rVARIABLE] checks that variables have the correct
    type, as specified in Γ. Rules [rTUPLE], [rTLIST] and [rLIST] check the types
    of tuples, empty lists and lists, respectively. Rule [rARITHMETIC] ensures that
    numbers are used when doing arithmetic operations. The remaining rules, [rBOOLEAN],
    [rNOT] and [rCOMPARISON], are analogous.


    Pattern typing. In the term typing rules [rBRANCH] and [rCASE], new variables
    are introduced as a result of pattern matching. These need to be assigned to their
    respective type for typechecking purposes. This is obtained via the judgement
    Γ ⊢pat T : Γ'' defined in Fig. 6, which states that all variables in a pattern
    p are collected (with their type) in Γ''. Basic types are checked in [rBASIC],
    and new variables are introduced in [rVARIABLE]. The latter also ensures that
    the pid of the dual process remains unchanged (i.e., x ≠ w), which allows to statically
    locate the destination pid of the messages. Each element in a tuple is checked
    individually for either values or variables ([rTUPLE]). Lists are checked using
    [rTLIST] and [rLIST]. Multiple variable environments Γ and Γ'' are joined together
    for Γ, Γ'' (their domains must be distinct).'
