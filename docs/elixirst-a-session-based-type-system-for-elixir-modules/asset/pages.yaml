    where X = S is shorthand for rec X.S.


    The body of a function consists of a term, t, which can take the form of an expression,
    a let statement, a send or receive construct, a case statement or a function call;
    see Fig. 3. In the case of the let construct, x = t1; t2, the variable x is a
    binder for the variables in t2, acting as a placeholder for the value that the
    subterm t1 evaluates to. We write t1; t2, as syntactic sugar for x = t1; t2 where
    variable x is not used in t2. The send statement, send(x, {l1, e1, ..., en}),
    allows a process to send a message to the pid stored in the variable x, containing
    a message {l1, e1, ..., en}, where l is the label. The receive construct, receive
    do ({l1, p1}, ..., pln} -> tl)end, allows a process to receive a message tagged
    with a label that matches one of the labels l1... ln and a list of payloads that
    match the patterns p1, ..., pln, branching to continue executing as tl. Patterns,
    p, defined in Fig. 3, can take the form of a variable, a basic value, a tuple
    or a list (e.g. [x|y]), where x is the head and y is the tail of the list. The
    remaining constructs are fairly standard. Variables in patterns p1, ..., pln employed
    by the receive and case statements are binders for the respective continuation
    branches ti. In our formalisation, the case construct is assumed to have a catch-all
    pattern which acts as a fail-safe mechanism for unmatchable values. This provides
    stronger static guarantees, however, it is more conservative when compared to
