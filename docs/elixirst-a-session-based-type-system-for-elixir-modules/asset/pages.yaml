    \triangleleft t : S \triangleright \text{end}\)

    \(\vdash \text{de} \cdot \text{module} \vdash \text{P} \overrightarrow{D} \text{end}\)

    ```


    For every public function \(f\ell n\) in \(\text{functions}(\vec{D})\), [TModule]
    checks that its body adheres to its session type using the highlighted term typing
    judgement detailed below:


    ![](img/21b2a144330b93d666562c91ebc20aff_6_0.png)


    This judgement states that "the term t can produce a value of type T after following
    an interaction protocol starting from the initial session type S up to the residual
    session type S'' (akin to parameterised monads [12]), while interacting with a
    dual process with pid identifier w. This typing is valid under some session typing
    environment \(\Delta\), variable binding environment \(\Gamma\) and function information
    environment \(\Sigma\)." Since the function information environment \(\Sigma\)
    is static for the whole module (and by extension, for all sub-terms), it is left
    implicit in the term typing rules. We consider each rule in detail.


    ```

    \(\forall i \in I \cdot \begin{cases} \forall j \in 1..n \cdot \begin{cases} \text{\textbf{simplepat}}(p_i^j,
    T_i^j) \\ p_i^j \vdash p_i^j : T_i^j \triangleright T_i^j \end{cases} \\ \Delta
    \vdash (\Gamma, T_i^1) \dots (T_i^n) \vartriangleright W \vdash_\Sigma t_i : T
    \vartriangleright S'' \end{cases}\)

    [TBRANCH]

    \(\Delta \vdash \Gamma \vdash W \vdash [2\lambda_i(T_i) \overrightarrow{S}_i]_{i
    \in I} \triangleright \text{receive do} \langle i : l_i, \overrightarrow{p_i}
    \rangle \rightarrow t_i \text{end} : T \vartriangleright S''\)

    ```'
