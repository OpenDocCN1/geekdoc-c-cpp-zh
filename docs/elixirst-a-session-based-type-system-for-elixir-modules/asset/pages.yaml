  md: "# # ElixirST: A session-based type system for Elixir modules\n\nAdrian Francalanza,\
    \ Gerard Tabone\n\nDept. of Computer Science, University of Malta, Msida, Malta\n\
    \n+   ARTICLE INFO\n+   \n+   Article history:\n+   Received 5 January 2023\n\
    +   Received in revised form 28 April 2023\n+   Accepted 16 June 2023\n+   Available\
    \ online 4 July 2023\n+   \n+   Keywords:\n+   Session types\n+   Type systems\n\
    +   Elixir\n+   Functional programming\n\n# ## ABSTRACT\n\nThis paper investigates\
    \ the adaptation of session types to provide behavioural information about Elixir\
    \ modules. We devise a type system, called ElixirST, which statically determines\
    \ whether functions in an Elixir module observe their endpoint specifications,\
    \ expressed as session types: a correspondence tool automating this typechecking\
    \ has also been developed and released. We also develop a tailored operational\
    \ semantics for session-oriented semantics for the language fragment supported\
    \ by the type system is developed, modelling its runtime behaviour when interacting\
    \ with the module client. This operational semantics is then used to prove a form\
    \ of session fidelity and progress for ElixirST.\n\n# ## 1. Introduction\n\nModern\
    \ programming languages offer a variety of abstractions for the construction of\
    \ concurrent programs. In the case of message-passing functional programs, concurrency\
    \ manifests itself as spawned computation that exhibits communication as a side-effect,\
    \ potentially influencing the execution of other (concurrent) computation. Such\
    \ side-effects inevitably increase the complexity of the programs produced and\
    \ lead to new sources of errors. As a consequence, correctness becomes harder\
    \ to verify and language support for detecting errors statically, can substantially\
    \ decrease the number of concurrency errors.\n\nElixir [1] is one such example\
    \ of a functional programming language which supports concurrency based on the\
    \ actor model [2,3]. As depicted in Fig. 1, Elixir programs are structured as\
    \ a collection of modules that contain functions, the basic unit of code decomposition\
    \ in the language. A module only exposes a subset of these functions to external\
    \ invocations by defining them as public; these functions act as the only entry\
    \ points to the functionality encapsulated by a module. Internally, the bodies\
    \ of these public functions may then invoke other functions, which can either\
    \ be the public ones already exposed or the private functions that can only be\
    \ invoked from within the same module. For instance, Fig. 1 depicts a module m\
    \ that contains several public functions (i.e., f1, ..., fn) and private functions\
    \ (i.e., g1, ..., gk). The public function f1 delegates part of its computation\
    \ by calling the private functions g1 and gk, whereas the body of the public function\
    \ fn invokes the other public function f1 when executed. Internally, the body\
    \ of the private function g1 calls the other private function g2, which in turn\
    \ can call g1 again, whereas the private function gj can recursively call itself."
