    # 3.6. Elixir system


    Natively, Elixir can create actors using its spawn functions (eg spawn/3), which
    take a function (and it arguments), spawns it and return its pid. ElixirS extends
    this to provide a bespoke spawning function called session/4 which allows the
    initiation of two concurrent processes executing in tandem as part of a session.
    This session/4 function takes two pairs of arguments: two references of function
    names (that will be spawned), along with their list of arguments. Its participant
    creation flow is shown in Fig. 7. Initially the actor (pre-server) is spawned,
    passing its pid (server) to the second spawned actor (pre-client). Together, both
    these pid (client) to pre-server in this way both actors participating in a session
    are aware of each other''s pids. From this point onwards, the two spawned actors
    can interact to behave as the participants in the binary session; the first argument
    of each running function is initiated to the respective pid of the other participant.
    Fig. 7 shows that the server process executes the body t, where it has access
    to the mailbox, which we denote as M. As it executes, messages may be sent or
    received (shown by the action \(\alpha\)) and stored in the (modified) mailbox
    M\''. The specific working of these transitions is explained in the following
    section.


    # 4. Operational semantics


    We describe the operational semantics of the Elixir language subset of Fig. 3
    as a labelled transition system (LTS) [14] describing how a handler process within
    a session executes while interacting with the session client (left implicit),
    as outlined in Fig. 1. The transition \(t \xrightarrow{\alpha} t''\) describes
    the fact that a handler process in state t performs an execution step to transition
    to the new state \(t''\), while possibly interacting with the client via the action
    \(\alpha\) as a side-effect. External actions are visible by, and bear an effect
    on the client, whereas internal actions do not. In our case, an action \(\alpha\)
    can take the following forms:


    ```

    \alpha \in \text{ACT} ::= \alpha! \{1; \forall\} \quad \text{Output message to
    } t \text{ tagged as } :1 \text{ with payload } \forall \quad \text{external action}

    | ? \{1; \forall\} \quad \text{Input message tagged as } :1 \text{ with payload
    } \forall

    | f/n \quad \text{Call function } f \text{ with arity } n \quad \text{internal
    action}

    | \tau \quad \text{Internal reduction step}

    ```


    Both output and input actions constitute external actions that affect either party
    in a session; the type system from Section 3.4 disciplines these external actions.
    Internal actions, include silent transition (\(\tau\)) and function calls (f/n);
    although'
