    \ annotate it with the `@dual` information on line 20.\n\nOur proposed session\
    \ type annotations serve two important purposes. On the one hand, they provide\
    \ a high-level (yet formal) specification as to how a public function is to be\
    \ interacted with, without the need to look inside its implementation, as in the\
    \ case of line 4. For instance, by inspecting the `counter` session type on line\
    \ 4 of Listing 2, one can immediately tell that a process running function `server`\
