    The variable binding environment, \(\Gamma\), maps (data) variables to basic types
    (\(x:T\)). We write \(\Gamma, x:T\) to extend \(\Gamma\) with the new mapping
    \(x:T\), where \(x \notin \text{dom}(\Gamma)\). The session typing environment,
    \(\Delta\), maps function names and arity pairs to their session type (\(f\ell
    n:S\)); this will be used when recursing (i.e., function calls) to check whether
    a function is already mapped to a session type. If a function \(f\ell n\) has
    a known session type, then it can be found in \(\Delta\), i.e., \(\Delta(f\ell
    n) = S\). Each module has a static function information environment, \(\Sigma\),
    that holds information related to the function definitions. For a function \(f\),
    with arity \(n\), \(\Sigma(f\ell n)\) returns the tail list of parameters (params)
    and their types (param\_types), the function''s body (body), and its return type
    (return\_type). It also returns the static variable name that represents the interacting
    process \(\text{pid}\) (dual). We assume that function information environment,
    \(\Sigma\), is well-formed, meaning that for all functions mapped (\(f\ell n \in
    \text{dom}(\Sigma)\)) observe the following condition requiring that the body
    of function \(f\ell n\) is closed, i.e., for \(\Sigma(f\ell n) = \Omega\):


    ```

    \(\text{fv}(\Omega.\text{body}) \setminus (\Omega.\text{params} \cup (\Omega.\text{dual}))
    = \emptyset\)

    ```


    Intuitively, if we look at a function''s body, its only free variables will be
    its parameters (i.e., params and dual). Session typechecking is initiated by analysing
    an Elixir module, rule [TModule]. A module is typechecked by inspecting each of
    its public functions, ascertaining that they correspond and fully consume the
    session types ascribed to them. The rule uses three helper functions. The function
    \(\text{functions}(\vec{D})\) returns a list of all function names (and arity)
    of the public functions (\(\vec{D}\)) to be checked individually. The function
    \(\text{sessions}(\vec{D})\) obtains a mapping of all the public functions to
    their expected session types stored in \(\Delta\). This ensures that when a function
    \(f\) with arity \(n\) executes, it adheres to the session type associated with
    it using either the @session or @dual annotations. The helper function \(\text{details}(\text{--})\)
    populates the function information environment (\(\Sigma\)) with details about
    all the public (\(\vec{D}\)) and private functions (\(\vec{P}\)) within the module.


