  md: "Actor systems are notoriously hard to analyse statically. The main reason for\
    \ this is that actors are open to receive any kind of messages, which makes it\
    \ difficult to predict or analyse their behaviour. Our work takes a lenient view\
    \ of this, where we simply ignore malformed messages using Elixir’s selective\
    \ `receive` construct. On the other hand, well-formed but _insolicited_ messages\
    \ can cause behavioural issues. Other works handle this by typing the actors’\
    \ mailboxes directly rather than their behaviour. DeLiguoro and Padovani [49]\
    \ introduced a mailbox calculus which considers mailboxes as first-class citizens.\
    \ This calculus adds types to mailboxes, thus ensuring that processes are free\
    \ from behavioural issues, such as deadlocks. Fowler et al. [50] built on this\
    \ to implement mailbox types within a practical concurrent programming language.\
    \ These works [47,48,50] are presented with an implementation for purpose-built\
    \ bespoke languages. The aims of our work are different since we start with an\
    \ industry strength language and try to retrofit session type mechanisms so as\
    \ to support the existing design patterns of the language.\n\n# 8. Conclusion\n\
    \nIn this work we established a correspondence between the ElixirST type system\
    \ [7] and the runtime behaviour of a client handler running an Elixir module function\
    \ that has been typechecked w.r.t. its session type protocol. In particular, we\
    \ showed that this session-based type system observes the standard session _fidelity_\
    \ property, meaning that processes executing a typed function always follow their\
    \ ascribed protocols at runtime. This property provides the necessary underlying\
    \ guarantees to attain various forms of communication safety, whereby should two\
    \ processes following mutually compatible protocols (e.g. `S` and its dual `S̄`),\
    \ they avoid certain communication errors (e.g. a send statement without a corresponding\
    \ receive construct).\n\n# Future work\n\nThere are a number of avenues we intend\
    \ to pursue. One line of investigation is the augmentation of protocols that talk\
    \ about multiple entry points to a module perhaps from the point of view of a\
    \ client that is engaged in multiple sessions at one time, possibly involving\
    \ multiple modules. The obvious starting points to look at here are the well-established\
    \ notions of multiparty session types [16,38] or the body of work on intuitionistic\
    \ session types organising processes hierarchically [51,18]. Another natural extension\
    \ to our work would be to augment our session type protocol in such a way to account\
    \ for process failure and supervision, which is a core part of the Elixir language.\
    \ To do this, we will look at prior work on process/session type extensions that\
    \ account for failure [52,53,39,54–57]. We should also augment our session type\
    \ system to support session types with runtime cost, such as those developed by\
    \ Castagna et al. [58]. It is also worth straightforward to integrate the elaborate\
    \ expression typechecking mechanism developed by Castagna et al. [60] to replace\
    \ our (limited) expression typing in Fig. 5. This would considerably enhance the\
    \ expressivity of our framework to handle a wider range of Elixir programs.\n\n\
    # Declaration of competing interest\n\nThe authors declare that they have no known\
