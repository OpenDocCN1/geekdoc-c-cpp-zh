    # Definition 4.1 (Pattern Matching).


    The **match** function pairs patterns with a corresponding value, resulting in
    a sequence of substitutions (called \(\sigma\)), e.g., **match**(\(p, v\)) = \([v_1/x_1][v_n/x_n]\).
    The match function builds a meta-level list of substitutions, which should not
    be confused with the lists defined by the Elixir syntax in Fig. 3.


