  md: "![](img/21b2a144330b93d666562c91ebc20aff_15_0.png)\n\nFig. 11. Stages of Elixir\
    \ compilation along with the session type implementation (in red).\n\nBy Proposition\
    \ 3 we know that if a process depends on external factors (i.e., a term expects\
    \ an incoming message), then it should not have a problem to be able to handle\
    \ these messages. From this, we can infer that a well-typed receive construct\
    \ is able to transition to a new term, when a message is received. If we extend\
    \ this to all terms, we can form the Progress Theorem, where we establish that\
    \ a process can always transition from one form to another. If no further transitions\
    \ are possible (see Fig. 10), then the process must be itself a (final) value.\
    \ In this theorem we also establish that the action produced during the transition\
    \ is always allowed by the protocol; this is checked using the after function.\n\
    \n> **Theorem 4 (Progress).** If $\\Delta ; \\emptyset \\vdash^h S \\triangleright\
    \ T : T < S'$, then either $t$ is a value, or else there exists some term $t'$\
    \ and action $\\alpha$ such that $t \\xrightarrow{\\alpha}_\\Sigma t'$ and $\\\
    text{after}(S, \\alpha)$ is defined\n\n**Proof.** By induction on the typing derivation\
    \ $\\Delta ; \\emptyset \\vdash^h S \\triangleright T : T < S'$. Refer to Appendix\
    \ B.3.\n\n# ## 6. Implementation\n\nThis section describes how the type system\
    \ of Section 3 is implemented as the session type checker tool called ElixirST.\
    \ This tool is integrated in Elixir with minimal changes to the syntax of the\
    \ surface language. The source code is written in Elixir and is available open-source.\n\
    \n# ### 6.1. Elixir compilation with session types\n\nThe Elixir source code is\
    \ compiled in several steps (see Fig. 11). The original Elixir source code is\
    \ initially parsed into an Abstract Syntax Tree (AST). Then, Elixir's powerful\
    \ macro system expands all non-special form into special form macros (e.g., if/unless\
    \ statements are converted into case constructs [17]). Afterwards, the expanded\
    \ Elixir AST is converted into Erlang abstract format and Core Erlang. Finally,\
    \ it is compiled into BEAM code which can be executed on the Erlang Virtual Machine\
    \ (BEAM).\n\nOur implementation integrates seamlessly within this compilation\
    \ pipeline (see Fig. 11, red). Inside the Elixir source code, processes are described\
    \ with a specific session type using annotations (starting with @). Annotations\
    \ are able to hold information about a module during compile-time. We provide\
    \ normal labelled session types (@session) and their dual (@dual, referenced by\
    \ a label):\n\n```\n@session 'X = ping() : pong() : X'\nping() ->\n    receive\
    \ do\n    {:ok, \"X\" # equivalent to x -> x.ping().pong().X'\n```\n\nThe annotations\
    \ set up the rules of the session types, which way need to be enforced later on\
    \ in the compilation process. Elixir provides several compile-time hooks which\
    \ provide a way to alter or append to the compilation pipeline. In this implementation,\
    \ we initially use the on_definition hook to parse the session type (from the\
    \ annotations) and compute the dual type where required; this is done using the\
    \ Erlang modules leex and yecc which create a lexer and a parser, respectively,\
    \ based on the session type syntax rules shown in Fig. 3. Then, the after_compile\
    \ hook is used to run ElixirST right after the BEAM code is produced. Since the\
    \ BEAM code stores directly the expanded Elixir AST, ElixirST is able to traverse\
    \ this AST and verify its concurrent parts using session types.\n\n# ### 6.2.\
    \ Bridging between Elixir and our model\n\nEvery construct in Fig. 3 maps directly\
    \ to a corresponding construct in the actual Elixir language. The @spec annotation\
    \ which decorates functions with types is already present in the latest distribution\
    \ of the language. It is typically used for"
