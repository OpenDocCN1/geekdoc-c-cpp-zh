  md: '# [TLET] From the rule, we know that t = (x = t_1; t_2), and


    \(\Delta \cdot \emptyset \vdash^w S > t_1 : T'' > S''''\) (B.27)


    By the inductive hypothesis and eq. (B.27), we know that **after**(S, \(\sigma\))
    is defined and that the term t_1 can be a value, or else transition to a new term
    t''_1. We consider both sub-cases:


    +   1. If t_1 \Rightarrow t''_1, then case holds by [rLET], resulting in t \Rightarrow
    t''_1; t_2.

    +   2. Otherwise, if t_1 = v_1, then case holds by [rLETv], resulting in the internal
    transition t \xrightarrow{t} t_2 [v_1/x].


    In both cases, **after**(S, \(\sigma\)) remains defined from the inductive hypothesis.


    # [TBRANCH] From the rule, we know that


    t = receive do (\{1 \downarrow_i \vec{p}_i\} \rightarrow t_i)_{i \in I} end (B.28)

    S = &\{1(\vec{T}_i).S_i\}_{i \in I} (B.29)


    A receive term (eq. (B.28)) transitions to a new subterm (t_i) when a message
    (\sigma = ?\{1, v_1, ..., v_n\}) is received. An incoming message is guaranteed
    to match with one of the available patterns, since (i) we are dealing with a trusted
    observer which sends valid actions, and (ii) the branches are restricted to simple
    patterns (using simplepl) so a well structured message will match with one of
    the branches. An incoming message is matched to a branch using its label :1_j
    (for j \in I). So by [rBRANCH], we know that t \xrightarrow{?\{1_j, v_1, ...,
    v_n\}} t_j \sigma, where \sigma is computed using the Pattern Matching Definition
    (i.e., \sigma = match(\vec{p}_j, v_1, ..., v_n)). By the incoming message action
    and S from eq. (B.29), after(S, ?\{1_j, \vec{v}\}) is defined, as required.


    # [TCHOICE] From the rule, we know that for some \mu \in I, then


    t = send t, (\{1_\mu \triangleright e_1, ..., e_n\})

    \theta \vdash exp_j : T''_j for all j \in 1..n (B.30)

    S = \oplus\{1_j(\vec{T}_j)\}_{j \in I} (B.31)


    By Lemma 16 and eq. (B.30), any expression e_i can be either a value, or else
    reduce to a new expression, so we consider both sub-cases:


    +   1. If, for any i \in 1..n, expression e_i can be reduced (i.e., e_i \Rightarrow
    e''_i), then case holds by [rCHOICE_e], resulting in the internal transition:
    t \xrightarrow{t} send t, (\{1_\mu \triangleright v_1, ..., v_{i-1}, e''_i, ...,
    e_n\})


    Since this is an internal transition, after(S, \tau) is defined for any S.


    +   2. Otherwise, for all i \in 1..n, e_i = v_i, then case holds by [rCHOICE_v],
    resulting in the transition t \xrightarrow{!(1, v_1, ..., v_n)} (1, v_1, ...,
    v_n). In this case, a message containing (1, v_1, ..., v_n) is sent to process
    with pid t. From eq. (B.31), we know that S is an internal choice, thus after(S,
    !(1, \vec{v})) is defined, as required.


    # [TKNOWNCALL] From the rule, we know that


    t = f(t, e_2, ..., e_n)

    \theta \vdash exp_i : T_i for all i \in 2..n (B.32)


    By Lemma 16 and eq. (B.32), any expression e_i can be either a value, or else
    reduce to a new expression, so we consider both sub-cases:


    +   1. If, for any i \in 2..n, expression e_i can be reduced (i.e., e_i \Rightarrow
    e''_i), then case holds by [rCALL_e], resulting in the internal transition: t
    \xrightarrow{t} f(v, v_2, ..., v_{i-1}, e''_i, ..., e_n).


    +   2. Otherwise, if for all i \in 2..n, e_i = v_i, then case holds by [rCALL_v],
    resulting in the transition t \xrightarrow{fn} t''[f_j/x_j]_{j=1}^n ... The callee''s
    function body (i.e., t'') and the substitution details (e.g. y, x_2) are obtained
    directly from the function information environment \Sigma using the transition
    action fn, e.g. \Sigma (fn).body = t''.


    For both cases, after(S, \sigma) is defined since after accepts and session type
    S for internal actions (fn and \tau).


    # [TUNKNOWNCALL] Analogous to previous case.'
