  md: "code documentation and to statically analyse programs using the Dialyzer [11],\
    \ a tool that detects potential (type) errors in Core Erlang programs using success\
    \ typing [9]. We use the @spec information to specify the types for the parameters\
    \ and the return type of the functions, supplementing our session typechecking\
    \ analysis. A similar approach to ours was adopted by Cassola et al. [13] for\
    \ a gradual static type system for Elixir.\n\n```\nreceive do\n  {:a} -> send(p,\
    \ {:c}) > ok\n  {:b} -> send(p, {:c}) > ok\nend\n\nreceive do\n  {:a} -> ok\n\
    \  {:b} -> ok\nend\nsend(p, {:c})\n```\n\nThe typing rules of Section 3 are designed\
    \ in a way to minimally alter common coding patterns in the language. For instance,\
    \ branches in session types might have common continuations, such as !C().end\
    \ in the type &{?A().end, ?B().!C().end}. Many type systems force programs to\
    \ structure their code as shown in the left-hand side code snippet above (which\
    \ performs the same send action twice). However, in Elixir it is common to express\
    \ this as a fork-join pattern, with a single continuation performing the common\
    \ action once as shown in the right-hand side code snippet. Our type system can\
    \ typecheck both code snippets.\n\nThe only aspect left to discuss is the mechanism\
    \ used by our implementation to guarantee an interaction between the two processes\
    \ implementing the respective endpoints of binary session type. To achieve this\
    \ end, we implemented a bespoke spawning function (refer to Section 3.5) that\
    \ takes the code of the respective endpoints and returns a tuple with the pids\
    \ of the two processes that are already linked. The implementation of our session\
    \ initiation is given below:\n\n```\n1 def session(serverFn, serverArg, clientFn,\
    \ clientArg)\n2   when is_function(serverFn) and is_function(clientFn) do\n3 \
    \    server_pid = spawn(fn ->\n4       receive do\n5         {:pid, client_pid}\
    \ ->\n6           apply(serverFn, [client_pid | server_arg])\n7       end\n8 \
    \    end\n9\n10    client_pid = spawn(fn ->\n11      send(server_pid, {:pid, self()})\n\
    12      apply(clientFn, [server_pid | client_arg])\n13    end\n14\n15    {server_pid,\
    \ client_pid}\n16  end\n```\n\nThis modified session/4 function takes two pairs\
    \ of arguments: two references of function names (that should be spawned) and\
    \ their list of arguments. The code implements the initialisation protocol depicted\
    \ in Fig. 7. It first spawns one process (pre-client in Fig. 7 for line 3) and\
    \ passes its pid to the second spawned process (pre-client in Fig. 7 as the variable\
    \ server_pid on lines 11 and 12). Then, the pre-client process sends its pid to\
    \ the pre-server process (line 11 and lines 4 and 5). At this point, both processes\
    \ execute their respective functions to transform into the actual first and second\
    \ processes participating in the session, passing the respective pids as the first\
    \ argument of the executing functions (lines 6 and 12).\n\nThe current implementation\
    \ of the session/4 function can only launch two processes at a time, in line with\
    \ the binary sessions. This can however, be extended to handle more than two processes\
    \ in the case of hierarchical processes, where a process may interact in several\
    \ separate binary sessions, similar to the notion of intuitionistic session types\
    \ [18].\n\nOur implementation still allows spawned processes to receive messages\
    \ from any other process. Unfortunately, unsolicited messages can interfere with\
    \ a session-typed process, since the receiver is not able to distinguish when\
    \ the message is originating from in the present implementation. An improvement\
    \ would be exploiting Elixir's ability to cherry-pick messages out-of-order from\
    \ the queue using pattern matching. As soon as a session is launched, a unique\
    \ session ID would be shared with the two parties, and each message exchanged\
    \ between them would use this ID to identify the source (and destination). This\
    \ would enable selective reads to filter unsolicited messages. Mostrous and Vasconcelos\
    \ [19] created a similar system to distinguish messages by attaching a unique\
    \ reference to each message.\n\n# 6.3. Case study\n\nWe use ElixirST to verify\
    \ an Elixir (CLI) application which interacts with a third-party service (i.e.\
