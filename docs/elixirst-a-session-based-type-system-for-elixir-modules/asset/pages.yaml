    \ they state that, if the interacting processes (that are left implicit) follow\
    \ the prescribed protocol correctly, then the module code being typechecked is\
    \ guaranteed to behave correctly w.r.t. the protocol (expressed in terms of the\
    \ adapted session fidelity and progress properties).\n\nIn this paper we merge\
    \ and extend the work presented in [7,8]. In addition to [8], we include the full\
    \ typing rules which were originally relegated to the appendix. We also present\
    \ two additional sections (adapted from [7]): (a) Section 2 introduces a motivating\
    \ example; and (b) Section 6 describes the implementation details of the ElixirST\
    \ tool, along with a case study. The validation part of the paper is also expanded,\
    \ by including all proofs. We also add a new result, showing that ElixirST observes\
    \ a form of the progress property.\n\n# 2. Motivating example\n\nConsider a simple\
    \ counter system, adapted from [9], whereby a (server) process stores a counter\
    \ total which can be increased by a (client) interacting process or else terminated\
    \ by this same (client) process. A sample Elixir Counter module is shown in Listing\
    \ 1. It offers one public function called server on lines 3-8 taking two arguments:\
    \ the pid of the client, client, and the initial counter total, total. A process\
    \ executing this function waits to receive client requests as messages in its\
    \ mailbox using the receive do ... end statement; this construct is blocking,\
    \ meaning that the process stops until a message with the expected format is received.\
    \ The server function accepts two types of messages, namely, increment requests\
    \ with label :incr carrying payload val, or termination requests denoted by the\
    \ label :stop. On function branches accordingly: for increment requests, it recurses\
    \ while updating the running total to total+value on line 5, whereas termination\
    \ requests on line 6 are handled by calling the private function terminate. Private\
    \ functions, defined using defp, are only visible from within a module. In this\
    \ case, the function terminate (defined on lines 11-14) sends a :value message\
    \ carrying the final total value total to the client process and terminates with\
    \ the atom value :ok. Assuming that a client process carrying a pid to variable\
    \ client already exists, a counter server linked to cid initialised with a running\
    \ total of 0 can be launched using the statement:\n\n```\nid = spawn(Counter,\
    \ :server, [cid, 0]).\n```\n\nElixir conducts dynamic typechecking to catch runtime\
    \ errors. In addition, @spec annotations such as those on lines 2 and 10 can help\
    \ with detecting potential errors at compile-time. However, the language offers\
    \ limited support to assist the static detection of errors relating to the concurrent\
    \ messaging. For instance, it might not be immediately apparent that the payload\
    \ carried by a :incr request should be a number value. Similarly, the code in\
    \ Listing 1 does not necessarily convey enough information that the intended interaction\
    \ with a server process should follow the protocol depicted in Fig. 2. This means\
    \ that if a client sends a message to a server process an arbitrary number of\
    \ times, followed by a single termination request (i.e. no further increment or\
    \ termination requests after the last one).\n\nFrom the perspective of the server,\
    \ the entire session of interactions can be formalised as the session type (called\
    \ counter) below:\n\n```\ncounter = & { ?incr(number), counter,\n  ?stop():!value(number),\
    \ end }   (1)\n```\n\nIt states that the server can branch (i.e. &) in two ways:\
    \ if it receives (i.e. ?) an incr label with a number payload, the server recurs\
    \ back to the beginning, and if it receives a stop label, it has to send (i.e.\
    \ !) back a label value with a payload of type number (i.e. !value(number)). No\
    \ further interactions are allowed when the end statement is reached. Accordingly,\
    \ the client has to follow a compatible protocol, such as the dual of the same\
    \ session type.\n\n```\ncounter = & { ?incr(number), counter,\n  ?stop():!value(number),\
