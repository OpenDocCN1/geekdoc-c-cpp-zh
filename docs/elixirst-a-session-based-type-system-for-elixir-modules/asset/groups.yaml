    ## 5. ElixirST 类型系统的验证


    我们通过建立与第 4 节定义的转换语义中类型检查 Elixir 程序的运行时行为的关系，来验证第 3 节概述的 ElixirST 类型系统所强加的静态属性。广义上，我们建立了一种
    _类型保持_ 形式，它指出如果一个类型良好的术语进行转换，则生成的术语仍然保持类型良好 [10]。然而，我们的类型保持概念需要更强，以同时考虑 _(i)_
    执行产生的副作用；以及 _(ii)_ 相对于表示为会话类型的协议的执行进展。遵循长期存在的类型传统，这些类型属性随后由精炼属性 _会话忠实性_ 和 _会话活性_
    [15,16] 捕获。该命题形式化了 _(i)_ 类型保持属性，即类型化进程的执行结果是协议当前阶段允许的动作之一；以及 _(ii)_ 转换后的生成进程相对于仍未完成的协议剩余部分仍然保持类型良好。我们还建立了一种条件形式的进展，其中类型良好的进程要么是一个值，要么可以安全地转换到一个新术语，产生一个内部（或外部）动作。


    在着手证明会话忠实性和进展之前，我们证明一个辅助命题，作为第 4 节操作语义的健全性检查。我们注意到，操作语义假设只执行 _封闭_ 程序；开放程序（即包含自由变量的程序）被视为由于缺少信息而无法正确执行的不完整程序。为此，命题
    1 确保封闭术语在转换后 _仍然保持封闭_。


    ### 命题 1（封闭术语）。


    _如果_ fv(t) = ∅ _且_ t →ᵅ t′_, 那么_ fv(t′) = ∅_。


