    \ work\n\nIn this section, we compare ElixirST with other type systems and implementations.\n\
    \n# ### 7.1. Type systems for Elixir\n\nCassola et al. [13,25] presented a gradual\
    \ type system for Elixir. It statically typechecks the functional part of Elixir\
    \ modules, using a gradual approach, where some terms may be left with an unknown\
    \ expression type. In contrast to ElixirST, Cassola et al. analyse directly the\
    \ unexpanded Elixir code which results in more explicit typechecking rules. Also,\
    \ they focus on the static type system without formulating the operational semantics.\n\
    \nAnother static type-checker for Elixir is Gradient [26]. It is a wrapper for\
    \ its Erlang counterpart tool and takes a similar approach to [13], where gradual\
    \ types are used. Another project, Typecheck [27], adds dynamic type validations\
    \ to Elixir programs. Typecheck performs runtime typechecking by wrapping checks\
    \ around existing functions. Gradual and Typecheck achieve an implementation of\
