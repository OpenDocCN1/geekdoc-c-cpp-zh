    ```

    [rCHOICE]

    \(\mu \in I\)   \(\forall j \in 1..n. \{ \Gamma \vdash_{exp} e_j : T_j \}\)

    -------------------------------------------------------

    \(\Delta, \Gamma \vdash^w @\{l_i(\bar{T}_i).S_i\}_{i \in I} \triangleright \text{send}(w,
    \{;l_\mu, e_1, ..., e_n\}) : \{atom, \bar{T}_\mu\} < S_\mu\)

    ```


