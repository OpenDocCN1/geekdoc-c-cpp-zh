    会话忠实性属性的陈述依赖于一个名为 **after** 的偏函数的定义（定义 5.1），它以会话类型和动作作为参数，并返回另一个会话类型作为结果。该函数有两个用途：(i)
    函数 after(S, α) 仅为协议 S（立即）允许的动作 α 定义，这使我们能够验证术语转换步骤是否违反了协议；(ii) 由于 S 描述了要遵循的协议的当前阶段，我们需要一种方法在
    α 是允许动作时将此协议演进到下一阶段，这正是 S′，即 after(S, α) = S′ 返回的延续会话类型。


    ### 定义 5.1（After 函数）。


    after 函数是以下情况定义的偏函数：


    ```

    after(S, t) def S

    after(S, f/n) def S

    after(⊕{j₁:⟨T̃i⟩Si}i∈I, ⊕{j:⟨T̃j⟩Sj} def Sj where j ∈ I

    after(&{?j₁:⟨T̃i⟩Si}i∈I, &{?j:⟨T̃j⟩Sj} def Sj where j ∈ I

    ```


    ![](img/21b2a144330b93d666562c91ebc20aff_13_0.png)


    该函数在所有其他情况下均未定义。**after** 函数被重载以作用于会话类型环境（\(\Delta\)），以便给定某个动作 \(\alpha\) 和会话类型
    \(S\) 计算新的会话类型环境：


    ```

    after(\(\Delta\), f, hn, S) def= \(\Delta\), f hn : S

    ```


    ```

    after(\(\Delta\), \(\alpha\), S) def= \(\Delta\) if \(\alpha \neq\) f hn

