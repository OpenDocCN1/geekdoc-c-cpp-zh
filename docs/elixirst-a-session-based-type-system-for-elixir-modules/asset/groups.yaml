    ```

    Variable binding env. \(\Gamma ::= \emptyset \mid \Gamma, x:T\)

    Session typing env. \(\Delta ::= \emptyset \mid \Delta, f\ell n:S\)

    Function information env. \(\Sigma ::= \emptyset \mid \Sigma, f\ell n: \begin{cases}
