    # B.1. Proofs for Proposition 1


    Before proving Proposition 1, we must analyse some properties related to closed
    terms, where we see how they affect variable substitutions (Definition A.3). Lemma
    5 states that if a variable x does not exist inside a term t, then, if we initiate
    x with some value, term t must remain unaffected, i.e., t[γ/τ] = t. Restricting
    this statement, Corollary 6 states that, if x is not a free variable in t, then
    the same result should hold. Lemma 7 consists of two statements that compare the
    free variables in terms (or expressions) with those that include a substitution.


