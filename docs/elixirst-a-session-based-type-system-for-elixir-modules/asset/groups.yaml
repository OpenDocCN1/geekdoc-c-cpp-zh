    ### [TCASE]


    From the rule, we know that


    ```

    t = case e do (p_i -> t_i)_i end

    \theta \vdash \text{exp } e : U \quad \text{(B.33)}

    ```


    By Lemma 16 and eq. (B.33), expression e can be either a value, or reduce to a
    new expression. Consider both sub-cases:


    - 1. If expression e can be reduced (i.e., e -> e''), then case holds by [kCase$_e$],
    resulting in the internal transition: t -> case e'' do (p_i -> t_i)_i end.

    - 2. Otherwise, if e = v, then case holds by [kCase$_v$], resulting in the internal
    transition t -> t sigma_j, where t_j is the branch which pattern matches with
    v, and sigma contains the substitutions (i.e., sigma = match(p_j, v)).


    ### [TEXPRESSION]


    From the rule, we know that


    ```

    t = e \quad \text{(B.34a)}

    \theta \vdash \text{exp } e : T \quad \text{(B.34b)}

    ```


    Similar to the previous case. By Lemma 16 and eq. (B.34b), expression e can be
    either a value, or reduce to a new expression. In the former of the cases, where
    e can be reduced (i.e., e -> e''), then case holds immediately by [kExpression]
    (i.e., t -> t''), where after(S, r) is defined. In the other case, when e is a
    value, then t is also a value, since t = e (by eq. (B.34a)).


