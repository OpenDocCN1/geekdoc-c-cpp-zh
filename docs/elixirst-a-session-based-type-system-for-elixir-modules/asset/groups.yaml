    \ S > case e' do (p_i -> t_i)_{i \\in I} (x_{nil} -> t_{all}) end : T < S'\n\n\
    这与预期一致，因为 after(S, \\tau) = S 且 after(\\Delta, S) = \\Delta。\n\n- 2. [RCASE_2]\
    \ 由规则可知，t = case v do (p_i -> t_i)_{i \\in I} (x_{nil} -> t_{all}) end 且 e = v。为方便起见，我们将兜底模式包含在\
    \ t 的其余模式中，因此 t = case v do (p_i -> t_i)_{i \\in I} end。于是，对于某些 j \\in I'，\n\n\
    \\text{match}(p_j, v) = \\sigma \\text{ where } \\sigma = [\\tau :: \\dots \\\
    backslash v_k / \\dots \\backslash \\kappa] \\quad (B.23h)\n\nt' = t_j \\sigma\
    \ \\quad (B.23i)\n\n由等式 (B.24c)、(B.23d) 和 (B.23h) 以及引理 13，可知 \\Gamma''_j = x_1\
    \ : T_1, \\dots, x_n : T_n 且\n\n\\emptyset \\vdash_{exp} v_k : T_k \\text{ for\
    \ all } k 1..n \\quad (B.23j)\n\n然后，通过反复对等式 (B.23j)、(B.23e for i = j) 应用替换引理，可得\n\
    \n\\Delta \\cdot \\vdash^w S > \\sigma : T < S'\n\n这成立，因为 after(S, \\tau) = S\
    \ 且 after(\\Delta, S) = \\Delta。\\square\n\n### [TEXPRESSION]\n\n由规则可知\n\nt =\
    \ e \\quad (B.24a)\n\n\\emptyset \\vdash_{exp} e : T \\quad (B.24b)\n\n由 t 的结构（等式\
    \ (B.24a)），项转换 (t \\mapsto t') 只能使用 [RExpression] 推导，从而产生内部转换（即，\\alpha = \\tau）\n\
    \ne \\to e' \\quad (B.24c)\n\n由引理 15 和等式 (B.24b) 及 (B.24c)，可知\n\n\\emptyset \\\
    vdash_{exp} e' : T \\quad (B.24d)\n\n因此，情况成立，因为 [RExpression] 和等式 (B.24d)。\n\n\
    ## B.3. 定理 4 的证明\n\n在本节中，我们提供命题 3 的证明，这些证明推导出表达式（引理 16）和项（定理 4）的进展性证明。\n\n###\
    \ 命题 3.\n\n任何遵循分支会话类型的良好类型项 (\\Delta \\cdot \\Gamma \\vdash_S^w S \\triangleright\
    \ T : T < S') 都能处理任何有效的传入消息，即，\n\n$t = \\text{receive do } \\{ (l_i; p_i^1, \\\
    dots, p_i^n) \\rightarrow t_i \\}_{i \\in I} \\text{ end} \\qquad S = \\&\\{l_i(T_i^1,\
    \ \\dots, T_i^n).S_i\\}_{i \\in I} \\implies \\text{\\textbf{匹配}}(p_k^j, v^j)_{j\
    \ \\in 1..n} \\text{ is defined} \\qquad \\text{after}(S, ?[l_k, v^1, \\dots,\
    \ v^n]) = S_k \\text{ for some } k \\in I$\n\n**证明.** 遵循分支会话类型 (\\&{...}) 的良好类型项必须精确是一个\
    \ receive 构造，如项 t 所示。此类项只能使用 [rBRANCH] 规则进行类型化，由此我们推断出\n\n$\\text{simplepat}(p_i^j,\
    \ T_i^j)_{i \\in I, j \\in 1..n}$\n\nsimplepat 语句表明分支中使用的所有模式都是简单的，即，$p_i^j$ 形式为变量\
    \ ($x_i^j$) 或变量元组 ($x_i^j$)。由第三条语句可知，如果消息与 t 中可用的某个标签匹配（即，某些 $k \\in I$ 的 $l_k$）且每个有效载荷值\
    \ ($v^1, \\dots, v^n$) 与会话类型 S 规定的载荷类型匹配，则该消息有效。因此，我们可以将 $x_i^j$ 和 $v^j$（对所有 $j\
    \ \\in 1..n$）应用于匹配函数，以获得所需的一系列变量替换。\n\n### 引理 16 (进展（表达式）).\n\n如果 $\\emptyset\
    \ \\vdash_{exp} e : T$，那么要么 $e$ 是一个值，要么存在某个 $e'$ 使得 $e \\rightarrow e'$\n\n**证明.**\
    \ 对类型推导 $\\emptyset \\vdash_{exp} e : T$ 进行归纳。我们考虑主要情况。\n\n### [TTUPLE]\n\n由规则可知，$e\
    \ = \\langle e_1, \\dots, e_k, \\dots, e_n \\rangle$ 且\n\n$\\emptyset \\vdash_{exp}\
    \ e_i : T_i \\quad \\text{for all } i \\in 1..n$ (B.25)\n\n由归纳假设和等式 (B.25)，表达式\
    \ $e_1$ 要么是一个值，要么可归约为 $e'_1$。我们考虑两种子情况：\n\n- 1. 若对任意 $i \\in 1..n$，$e_i \\rightarrow\
    \ e'_i$，则情况由 [rTUPLE] 成立，产生归约 $e \\rightarrow \\langle v_1, \\dots, v_{i-1}, e'_i,\
    \ \\dots, e_n \\rangle$。\n- 2. 否则，若对所有 $i \\in 1..n$，$e_i = v_i$，则情况成立，因为元组 $\\\
    langle v_1, \\dots, v_n \\rangle$ 是一个值。\n\n### [TARITHMETIC]\n\n由规则可知，$e = e_1\
    \ \\circ e_2$ 且\n\n$\\emptyset \\vdash_{exp} e_1 : \\text{number}$ (B.26a)\n$\\\
    emptyset \\vdash_{exp} e_2 : \\text{number}$ (B.26b)\n\n由归纳假设和等式 (B.26a)，$e_1$\
    \ 要么是一个值，要么可归约为 $e'_1$。我们考虑两种子情况：\n\n- 1. 若 $e_1 \\rightarrow e'_1$，则情况由 [rOPERATION_]\
    \ 成立，产生归约 $e \\rightarrow e'_1 \\circ e_2$。\n- 2. 否则，若 $e_1 = v_1$，我们需要考虑 $e_2$\
    \ 的行为，由归纳假设和等式 (B.26b) 产生另外两种子情况：\n  - 2a. 若 $e_2 \\rightarrow e'_2$，则情况由 [rOPERATION_]\
    \ 成立，产生归约 $e \\rightarrow v_1 \\circ e'_2$。\n  - 2b. 否则，若 $e_2$ 是一个值，则情况由 [rOPERATION_]\
    \ 成立。\n\n关于其余情况：[rBOOLEAN]、[rCOMPARISON]、[rLIST] 和 [rNOT] 的情况与前一种情况类似。最后，[rBASIC]\
    \ 和 [rELIST] 的情况立即成立，因为在这些实例中 $e$ 是一个值。\n\n### 定理 4 (进展).\n\n如果 $\\Delta \\vdash\
    \ \\emptyset \\vdash_S^w S \\triangleright T : T < S'$，那么要么 $t$ 是一个值，要么存在某个项 $t'$\
    \ 和动作 $\\alpha$ 使得 $t \\xrightarrow{\\alpha}_T t'$ 且 $\\text{after}(S, \\alpha)$\
    \ 已定义\n\n**证明.** 对类型推导 $\\Delta \\vdash \\emptyset \\vdash_S^w S \\triangleright\
    \ T : T < S'$ 进行归纳。\n\n### [TLET]\n\n由规则可知，$t = (x = t_1; t_2)$，且\n\n\\(\\Delta\
    \ \\cdot \\emptyset \\vdash^w S > t_1 : T' > S''\\) (B.27)\n\n由归纳假设和等式 (B.27)，可知\
    \ **后继**(S, \\(\\sigma\\)) 已定义，且项 t_1 可以是一个值，或者转换为新项 t'_1。我们考虑两种子情况：\n\n- 1. 若\
    \ t_1 \\Rightarrow t'_1，则情况由 [rLET] 成立，产生 t \\Rightarrow t'_1; t_2。\n- 2. 否则，若\
    \ t_1 = v_1，则情况由 [rLETv] 成立，产生内部转换 t \\xrightarrow{\\tau} t_2 [v_1/x]。\n\n在两种情况下，**后继**(S,\
    \ \\(\\sigma\\)) 由归纳假设保持已定义。\n\n### [TBRANCH]\n\n由规则可知\n\nt = receive do (\\{1\
    \ \\downarrow_i \\vec{p}_i\\} \\rightarrow t_i)_{i \\in I} end (B.28)\nS = &\\\
    {1(\\vec{T}_i).S_i\\}_{i \\in I} (B.29)\n\n当接收到消息 (\\sigma = ?\\{1, v_1, ...,\
    \ v_n\\}) 时，接收项（等式 (B.28)）转换为新子项 (t_i)。传入消息保证能与某个可用模式匹配，因为 (i) 我们处理的是发送有效动作的可信观察者，且\
    \ (ii) 分支限制为简单模式（使用 simplepat），因此结构良好的消息将与某个分支匹配。传入消息通过其标签 :1_j（对 j \\in I）与某个分支匹配。因此由\
    \ [rBRANCH] 可知，t \\xrightarrow{?\\{1_j, v_1, ..., v_n\\}} t_j \\sigma，其中 \\sigma\
    \ 使用模式匹配定义计算（即，\\sigma = match(\\vec{p}_j, v_1, ..., v_n)）。由传入消息动作和等式 (B.29) 中的\
    \ S，after(S, ?\\{1_j, \\vec{v}\\}) 已定义，如所要求。\n\n### [TCHOICE]\n\n由规则可知，对于某些 \\\
    mu \\in I，则\n\nt = send t, (\\{1_\\mu \\triangleright e_1, ..., e_n\\})\n\\theta\
    \ \\vdash exp_j : T'_j for all j \\in 1..n (B.30)\nS = \\oplus\\{1_j(\\vec{T}_j)\\\
    }_{j \\in I} (B.31)\n\n由引理 16 和等式 (B.30)，任何表达式 e_i 要么是一个值，要么可归约为新表达式，因此我们考虑两种子情况：\n\
    \n- 1. 若对任意 i \\in 1..n，表达式 e_i 可归约（即，e_i \\Rightarrow e'_i），则情况由 [rCHOICE_e]\
    \ 成立，产生内部转换：t \\xrightarrow{\\tau} send t, (\\{1_\\mu \\triangleright v_1, ...,\
    \ v_{i-1}, e'_i, ..., e_n\\})\n\n由于这是内部转换，after(S, \\tau) 对任何 S 均已定义。\n\n- 2.\
    \ 否则，对所有 i \\in 1..n，e_i = v_i，则情况由 [rCHOICE_v] 成立，产生转换 t \\xrightarrow{!(1, v_1,\
    \ ..., v_n)} (1, v_1, ..., v_n)。在此情况下，包含 (1, v_1, ..., v_n) 的消息被发送到 pid 为 t 的进程。由等式\
    \ (B.31)，可知 S 是内部选择，因此 after(S, !(1, \\vec{v})) 已定义，如所要求。\n\n### [TKNOWNCALL]\n\
    \n由规则可知\n\nt = f(t, e_2, ..., e_n)\n\\theta \\vdash exp_i : T_i for all i \\in\
    \ 2..n (B.32)\n\n由引理 16 和等式 (B.32)，任何表达式 e_i 要么是一个值，要么可归约为新表达式，因此我们考虑两种子情况：\n\n\
    - 1. 若对任意 i \\in 2..n，表达式 e_i 可归约（即，e_i \\Rightarrow e'_i），则情况由 [rCALL_e] 成立，产生内部转换：t\
    \ \\xrightarrow{\\tau} f(v, v_2, ..., v_{i-1}, e'_i, ..., e_n)。\n\n- 2. 否则，若对所有\
    \ i \\in 2..n，e_i = v_i，则情况由 [rCALL_v] 成立，产生转换 t \\xrightarrow{fn} t'[f_j/x_j]_{j=1}^n\
    \ ... 被调用者的函数体（即 t'）和替换细节（例如 y, x_2）直接从函数信息环境 \\Sigma 使用转换动作 fn 获得，例如 \\Sigma\
    \ (fn).body = t'。\n\n在两种情况下，after(S, \\sigma) 已定义，因为 after 对内部动作（fn 和 \\tau）接受会话类型\
    \ S。\n\n### [TUNKNOWNCALL]\n\n与前一种情况类似。\n\n"
