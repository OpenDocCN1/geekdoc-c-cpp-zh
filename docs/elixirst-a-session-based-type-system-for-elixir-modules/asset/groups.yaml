    action as arguments and returns another session type as a result. This function
    serves two purposes: (i) the function after(S, α) is only defined for actions
    α that are (immediately) permitted by the protocol S, which allows us to verify
    whether a term transition step violated a protocol or not; and (ii) since S describes
    the current stage of the protocol to be followed, we need a way to evolve this
    protocol to the next stage should α be a permitted action, and this is precisely
    S′, the continuation session type returned where after(S, α) = S′.


