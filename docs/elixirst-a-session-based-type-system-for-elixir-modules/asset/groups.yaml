    ### [TCASE]


    根据规则，可知


    ```

    t = case e do (p_i -> t_i)_i end

    \theta \vdash \text{exp } e : U \quad \text{(B.33)}

    ```


    根据引理 16 和公式 (B.33)，表达式 e 要么是一个值，要么可以归约为一个新表达式。请考虑以下两种子情况：


    - 1. 如果表达式 e 可以归约（即，e -> e''），则根据 [kCase$_e$] case 成立，产生内部转换：t -> case e'' do
    (p_i -> t_i)_i end。

    - 2. 否则，如果 e = v，则根据 [kCase$_v$] case 成立，产生内部转换 t -> t sigma_j，其中 t_j 是与 v 模式匹配的分支，sigma
    包含替换（即，sigma = match(p_j, v)）。


    ### [TEXPRESSION]


    根据规则，可知


    ```

    t = e \quad \text{(B.34a)}

    \theta \vdash \text{exp } e : T \quad \text{(B.34b)}

    ```


    与前一种情况类似。根据引理 16 和公式 (B.34b)，表达式 e 要么是一个值，要么可以归约为一个新表达式。在前一种情况中，即 e 可以归约（e ->
    e''），则根据 [kExpression] case 立即成立（即，t -> t''），其中 after(S, r) 已定义。在另一种情况中，当 e 是一个值时，t
    也是一个值，因为 t = e（根据公式 (B.34a)）。


    ## 参考文献


    - [1] D. Thomas. 《Elixir 编程：函数式、并发、实用、有趣》. Pragmatic Bookshelf, 2018.

    - [2] C. Hewitt, P. Bishop, R. Steiger. 面向人工智能的通用模块化 ACTOR 形式主义. In: N.J. Nilsson
    (编), 第 3 届国际人工智能联合会议论文集. Stanford, CA, USA, 1973 年 8 月 20-23 日, William Kaufmann,
