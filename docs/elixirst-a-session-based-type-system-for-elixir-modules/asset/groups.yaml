    的 \(T_\mu\)）匹配，这通过表达式类型判断 \(\Gamma \vdash_{exp} e : T\) 说明（见图 5）。send 构造的结果表达式类型等同于正在发送的消息的类型，即
    \(\{;l_\mu, e\}\) 具有类型 atom(\(T_\mu\))。类型规则还检查 send 语句收件人的 pid，它必须与判断本身中的双 pid（w）匹配，以确保消息仅发送给正确的收件人。


    ```

    \(\Delta(f/n) = S\)   \(\forall i \in 2..n. \{ \Gamma \vdash_{exp} e_i : T_i \}\)

    -----------------------------------------------------------

    \(\Omega \vdash ... \Omega . \text{return\_type} = \bar{T}\)

    ```


    由于公共函数使用 @session（或 @dual）注释显式装饰了会话类型，因此它们列在 dom(\(\Delta\)) 中。对公共函数的调用使用 [rKNOWN
    CALL] 规则进行类型检查，该规则验证预期的初始会话类型是否等同于从会话类型环境中已知的函数会话类型（S），即 \(\Delta(f/n) = S\)。在不类型检查函数体（由规则
    [rMODULE] 完成）的情况下，该规则确保预期的会话类型 S 被完全消耗，因此剩余类型变为 end。规则 [rKNOWN CALL] 还确保在函数调用期间保留
    pid（w），通过要求将其作为参数传递并将其与预期的双 pid 进行比较（即 \(\Delta \vdash \Gamma \vdash^w S > f(w,
    ...) : T < \text{end}\)）。


    ```

    \(\Sigma(f/n) = \Omega\)

    \(\Omega . \text{param\_types} = \bar{x} \dots \Omega . \text{body} = t \dots
    \Omega . \text{return\_type} = T\)

    \(\forall i \in 2..n. \{ \Gamma \vdash_{exp} e_i : T_i \}\)

    ```


    ```

    [rUNKNOWN CALL]

    (\Delta, f/n : S) : (y : pid, \bar{x} : \bar{T}) \vdash S \triangleright T : C
    < S''

    -----------------------------------------------------------

    \(\Delta, \Gamma \vdash^w S > f(w, e_2, ..., e_n) : T < S''\)

    ```

