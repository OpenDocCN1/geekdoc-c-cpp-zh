    ## 5. Validation of the ElixirST type system


    We validate the static properties imposed by the ElixirST type system, overviewed
    in Section 3, by establishing a relation with a runtime behaviour of a typechecked
    Elixir program, using the transition semantics defined in Section 4. Broadly,
    we establish a form of _type preservation_, which states that if a well-typed
    term transitions, the resulting term then remains well-typed [10]. However, our
    notion of type preservation, needs to be stronger to also take into account _(i)_
    the side-effects produced by the execution; and _(ii)_ the progression of the
    execution with respect to protocol expressed as a session type. Following the
    long-standing typing tradition, these type properties, then, two aspects are captured
    by the refined properties of _session fidelity_ and _session liveness_ [15,16].
    This proposition formalises _(i)_ the type preservation property as a result of
    the execution of the typed process is one of the actions allowed from the current
    stage of the protocol; and that _(ii)_ the resultant process following the transition
    is still well-typed w.r.t. the remaining part of the protocol that is still outstanding.
    We also establish a conditional form of progress, where well-typed processes are
    either a value, or else they can safely transition to a new term, producing an
    internal (or external) action.


    Before embarking on the proofs for session fidelity and progress, we prove an
    auxiliary proposition that acts as a sanity check for our operational semantics
    of Section 4. We note that the operational semantics assume that only _closed_
    programs are executed; an open program (i.e., a program containing free variables)
    is seen as an incomplete program that cannot execute correctly due to missing
    information. To this end, Proposition 1 ensures that a closed term _remains closed_
    even after transitioning.


