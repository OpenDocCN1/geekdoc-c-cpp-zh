    t'' : T < S''\) 且 \(\text{after}(\Delta, \alpha, S) = \Delta''\)

    - 对于 \(\alpha \in \{f, t, \iota, !\{i.. \overline{i}\}, \overline{v}\rangle\}\)，则存在某些
    \(S''''\) 和 \(\Delta''\)，使得 \(\Delta'' \cdot \emptyset \vdash^w S'''' \triangleright
    t'' : T < S''\) 对于 \(\text{after}(S, \alpha) = S''''\) 和 \(\text{after}(\Delta,
    \alpha, S) = \Delta''\)


    ### 证明.


    通过对类型推导 \(\Delta \cdot \emptyset \vdash^w S \triangleright t : T < S''\) 进行归纳。


    ### [TLET]


