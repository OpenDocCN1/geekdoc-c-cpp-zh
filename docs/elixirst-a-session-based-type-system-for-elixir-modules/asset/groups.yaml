    ## Theorem 2 (会话保真). 如果 \(\Delta \cdot \emptyset \vdash^w S \triangleright T :
    T < S''\) 且 \(t \xrightarrow{\alpha} t''\)


    - 对于 \(\alpha = ?\{i.. \overline{i}\}, \overline{v}\rangle\) 和某些会话类型 \(S'' = \text{after}(S,
