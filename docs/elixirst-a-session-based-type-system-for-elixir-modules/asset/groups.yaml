  mdcn: "\n\n## ElixirST: 基于会话的 Elixir 模块类型系统\n\nAdrian Francalanza, Gerard Tabone\n\
    \nDept. of Computer Science, University of Malta, Msida, Malta\n\n- ARTICLE INFO\n\
    - Article history:\n  - Received 5 January 2023\n  - Received in revised form\
    \ 28 April 2023\n  - Accepted 16 June 2023\n  - Available online 4 July 2023\n\
    - Keywords:\n  - Session types\n  - Type systems\n  - Elixir\n  - Functional programming\n\
    \n## ABSTRACT\n\n本文探讨了将会话类型（session types）应用于提供 Elixir 模块行为信息的方法。我们设计了一种名为 ElixirST\
    \ 的类型系统，它能够静态地确定 Elixir 模块中的函数是否遵守其端点规范，这些规范表达为会话类型：一个自动化此类型检查的对应工具也已开发并发布。我们还为类型系统所支持的语言片段开发了专门的面向会话的运行时语义，以模拟其与模块客户端交互时的运行时行为。然后使用此运行时语义来证明\
    \ ElixirST 的一种会话忠实性（session fidelity）和进展性（progress）。\n\n## 1. Introduction\n\n\
    现代编程语言为构建并发程序提供了多种抽象。在消息传递函数式程序的情况下，并发表现为生成的计算，其将通信作为副作用，可能影响其他（并发）计算的执行。此类副作用不可避免地增加了所生成程序的复杂性，并导致新的错误来源。因此，正确性变得更难验证，而语言对静态错误检测的支持可以大幅减少并发错误的数量。\n\
    \nElixir [1] 是这种基于 Actor 模型 [2,3] 支持并发的函数式编程语言的一个示例。如图 1 所示，Elixir 程序结构为包含函数的模块集合，函数是该语言中代码分解的基本单位。模块仅通过将函数定义为公共（public）来向外部调用暴露其中的一部分；这些函数是模块所封装功能的唯一入口。在内部，这些公共函数的函数体可以调用其他函数，这些函数可以是已暴露的公共函数，也只能在同一模块内调用的私有函数。例如，图\
    \ 1 描绘了一个包含多个公共函数（即 f1, ..., fn）和私有函数（即 g1, ..., gk）的模块 m。公共函数 f1 通过调用私有函数 g1\
    \ 和 gk 来委托部分计算，而公共函数 fn 的函数体在执行时会调用另一个公共函数 f1。在内部，私有函数 g1 的函数体调用另一个私有函数 g2，后者又可以再次调用\
    \ g1，而私有函数 gj 可以递归地调用自身。\n\n![](img/21b2a144330b93d666562c91ebc20aff_1_0.png)\n\
    \nFig. 1. 由公共和私有函数组成的 Elixir 模块，与客户端进程进行交互。\n\nElixir 中一种普遍的设计模式是服务器监听客户端请求，我们将其称为服务处理器设计模式（service\
    \ handler design pattern）。对于每个请求，服务器会生成一个（公共）函数以独立执行并充当专用客户端处理器：在客户端和生成的处理器的各自进程\
    \ ID 相互告知后，两个并发实体之间（通过消息传递）开始一个交互会话。例如，在图 1 中，运行公共函数 f1 的处理器进程被分配给与客户端 client1\
