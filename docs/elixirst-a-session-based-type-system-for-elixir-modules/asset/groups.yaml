  md: "\n![](img/21b2a144330b93d666562c91ebc20aff_17_0.png)\n\nFig. 12. Interactions\
    \ with Duelf API.\n\nonly accept HTTP messages (e.g. GET or POST requests), so\
    \ we use a gateway which acts as a middleman between the client and the third-party\
    \ server.\n\nFrom the Duelf API documentation, we can get a list of API calls\
    \ that can be made, along with their details. Thus, we can infer an order (i.e.\
    \ a protocol) of calls that need to be invoked in the correct order, to achieve\
    \ what we want. For instance, we consider a client that searches and books a flight.\
    \ Concretely, the client has to interact with several endnodes, including !offer_requests,\
    \ !offers and !orders, in a correct order. This order of interaction is formalised\
    \ in the S_client protocol which is then used by ElixirST to ensure that a client\
    \ process follows it, thus interacting safely (via a gateway process which converts\
    \ the requests to HTTP messages) with the Duelf server.\n\n```\nS_client = \\\
    oplus {\n    |request(origin: binary, destination: binary,\n    dep_date: binary,\
    \ class: atom, pass_no: number).S_offers,\n    |cancel()\n}\nS_offers = rec Y.&\
    \ {\n    ?offer(offer_no: number, total_amount: number,\n    currency: binary,\
    \ duration: number,\n    stops: number, segments: binary).S_details,\n    ?error(binary).S_client\n\
    }\nS_details = \\oplus {\n    |more_details().& {\n        ?details(...).\\oplus\
    \ {\n            |make_booking(...).\n            |&(?ok(...), ?error(binary)),\n\
    \            |cancel()\n        },\n        ?error(binary)\n    },\n    |reject().Y\n\
    }\n```\n\nFor clarity, S_client is split in two: S_offers and S_details. Furthermore,\
    \ we add labels to each payload type to make it more apparent what data needs\
    \ to be transferred - labels are also allowed in ElixirST, given that labels are\
    \ only used for decorative purposes. We take a brief look at how the client can\
    \ book a flight. The interaction starts with the client making request to get\
    \ the available flights (S_client). By glancing on S_client, one can get more\
    \ information on what the client needs to include the request details, such as\
    \ the origin and destination locations. Note that, we use the binary type, which\
    \ is the type for strings in Elixir. Then, the client starts receiving (and rejecting)\
    \ one offer at a time, until the client decides to take up an offer (S_offers).\n\
    \nTo learn more about the flight offer, the client sends a request to get more\
    \ details (e.g. operating airline and updated price), and awaits the results (S_details).\
    \ Once the details are received, the client can decide to either cancel the order,\
    \ or book the flight. In case of the latter, the booking will be finalised after\
    \ the client receives back a confirmation code. Throughout this interaction, the\
    \ server may reply with an error message, which the client also needs to handle\
    \ (i.e. ?error(binary)).\n\nThis behaviour formalised by S_client is applied in\
    \ the module FlightSystem, which is shown partly in Listing 5. FlightSystem contains\
    \ a public function client, a private function consume_offer, and an omitted public\
    \ function gateway. The client function starts the session type S_client using\
    \ ElixirST.session/4, and then awaits the client follows the protocol (line 4).\
    \ The client function then performs the actions: requesting offers, receiving\
    \ offers, and calling function consume_offer. This latter client follows the remaining\
    \ actions in the session type, i.e. S_offers. The dual part of the interaction,\
    \ the gateway function, should follow a compatible protocol, such as the dual\
    \ session type, S_client. This is not enforced, since the gateway function goes\
    \ beyond the syntax defined in Section 3.3 (e.g., uses other modules to parse\
    \ JSON responses, or uses dynamic types) which are not defined by our type system\
    \ in Section 3.4. This function may also be inaccessible for static analysis (e.g.\
    \ proprietary source code), so we assume that at runtime it obeys S_client. Nevertheless,\
    \ we can initiate a session executing both public functions using our session\
    \ function, as follows:\n\n```\nElixirST.session(@FlightSystem.Client,\n    {\"\
    MAD\", \"CDG\", \"2023-11-24\", :economy, 2},\n    @FlightSystem.gateway/1,\n\
    \    [1])\n```\n\n9 https://duelf.com/docs/api/overview/welcome.\n\n```elixir\n\
    defmodule FlightSystem do\n  use ElixirST\n\n  @spec client(pid, binary, binary,\
    \ binary, atom, number) :: ok\n  def client(pid, origin, destination, dep_date,\
    \ class, pass_no) do\n    send(pid, {:request, origin, destination, dep_date,\
    \ class, pass_no})\n    IO.puts(\"Sending request for a flight from #{origin}\
    \ to ...\")\n    IO.puts(\"Waiting for a response from the server...\")\n    consume_offer(pid)\n\
    \  end\n\n  @spec consume_offer(pid) :: atom\n  defp consume_offer(pid) do\n \
    \   receive do\n      {:ok, offer_no, total_amount, currency, dur, stops, segments}\
    \ ->\n        IO.puts(\"Offer #{offer_no}: \\n#{currency}#{total_amount}...\"\
    )\n        IO.puts(\"Accept? (y/n: \")\n        case accept? do\n          \"\
    y\" -> send(pid, {:more_details})\n            IO.puts(\"Requesting updated details\
    \ for offer...\")\n            send(pid, {:reject})\n          _ -> consume_offer(pid)\n\
    \        end\n      {:error, message} -> send(pid, {:cancel})\n    end\n  end\n\
    end\n```\n\nListing 5: Session-typed snippet of a flight system written in Elixir.\n\
    \nElixirST ensures that the function client follows the pattern described by S_client\
    \ which mirrors the implicit order of API requests by Duelf. For instance, if\
    \ a client tries to make a booking before making a request containing the flight\
    \ details (i.e., skipping line 7), then the order will fail; this will be flagged\
    \ by our type system earlier on instead of being rejected by Duelf at runtime.\n\
    \nThis case study shows that ElixirST is flexible and practical enough to be integrated\
    \ in real-world applications. In addition to verifying statically the individual\
    \ functions, by explicitly adding information about the interactions, we provide\
    \ a source of documentation within the source code itself.\n\nIn this case study\
    \ we analysed the client side of the interaction, leaving the gateway process\
    \ unverified, thus susceptible to behavioural issues. To fix this, we can use\
    \ existing techniques, such as synthesising runtime monitors [21-23] for the unverified\
    \ parts, similar to the work by Bartolo Burlo et al. [24].\n\n## 7. Related work\n\
    \nIn this section, we compare ElixirST with other type systems and implementations.\n\
    \n### 7.1. Type systems for Elixir\n\nCassola et al. [13,25] presented a gradual\
    \ type system for Elixir. It statically typechecks the functional part of Elixir\
    \ modules, using a gradual approach, where some terms may be left with an unknown\
    \ expression type. In contrast to ElixirST, Cassola et al. analyse directly the\
    \ unexpanded Elixir code which results in more explicit typechecking rules. Also,\
    \ they focus on the static type system without formulating the operational semantics.\n\
    \nAnother static type-checker for Elixir is Gradient [26]. It is a wrapper for\
    \ its Erlang counterpart tool and takes a similar approach to [13], where gradual\
    \ types are used. Another project, Typecheck [27], adds dynamic type validations\
    \ to Elixir programs. Typecheck performs runtime typechecking by wrapping checks\
    \ around existing functions. Gradual and Typecheck achieve an implementation of\
    \ gradual typechecking by analysing calls to ElixirST, the discussed type-checkers\
    \ [13, 26,27] analyse a substantial part of the Elixir language and do not check\
    \ related to message-passing between processes.\n\nSome implementations aim to\
    \ check issues related to message-passing. Harrison [28] statically checks Core\
    \ Erlang for such issues. For instance, it detects orphan messages (i.e., messages\
    \ that will never be received) and unreachable receive branches. In separate work,\
    \ Christakis and Sagonas [29] analyse Core Erlang code to construct a communication\
    \ graph which depicts the message flow between different processes. This is then\
    \ used to detect errors of similar kind, e.g. receive constructs that never receive\
    \ any messages. This work was implemented as part of the Dialyzer. Harrison [30]\
    \ extends [28] to analyse Erlang/OTP behaviours (e.g. gen_server, which structures\
    \ processes in a hierarchical manner) by injecting\n"
