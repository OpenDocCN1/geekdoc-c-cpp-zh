    ![](img/21b2a144330b93d666562c91ebc20aff_1_0.png)


    Fig. 1. An Elixir module consisting of public and private functions, interacting
    with client processes.


    A prevalent Elixir design pattern is that of a server listening for client requests,
    which we refer to as the service handler design pattern1. For each request, the
    server spawns a (public) function to execute independently and act as a dedicated
    client handler: after the respective process IDs of the client and the spawned
    handler are made known to each other, a session of interaction commences between
    the two concurrent entities (via message-passing). For instance, in Fig. 1, a
    handler process running public function f1 is assigned to the session with client
    client1, whereas the request from clientn is assigned a dedicated handler running
    function fn. Although traditional interface elements such as function parameters
    (used to instantiate the executing function body) with values such as the client
    process ID) and the function return value (reporting the eventual outcome of handled
    request) are important, the messages exchanged between the two concurrent parties
    within a session are equally or more important for software correctness. More
    specifically, communication incompatibilities between the interacting parties
    could lead to various runtime errors. For example, if in a session a message is
    sent with an unexpected payload, it could cause the receiver''s subsequent computation
    depending on it to crash (e.g. multiplying by a string when a number should have
    been received instead). Also, if messages are exchanged in an incorrect order,
    they may cause deadlocks, e.g. Elixir uses blocking receive constructs that wait
    until a suitable message arrives, so if a process sends an invalid message, then
    the other process ends up waiting forever for a proper message to arrive.


    In many cases, the expected protocol of interactions within a session can be statically
    determined from the respective endpoint implementations, namely the function bodies;
    for simplicity, our discussion assumes that endpoint interaction protocols are
    values of a type S1 and S2 in Fig. 1. Although it does not provide any future
    support for specifying (and verifying) this design pattern due to two major obstacles.
    Firstly, Elixir does not provide any support for describing (and verifying) the
    interaction protocol of a function in terms of its communication side-effects.
    Secondly, in open settings, it is often the case that only one side of the code
    is available, so it is difficult to obtain static guarantees without the full
    codebase.


    Contribution We present a type checker to assist Elixir module construction (following
    the service handler pattern) in two ways: (a) it allows module designers to formalise
    the session endpoint protocol as a session type, and ascribe it to a public function;
    (b) it statically verifies whether the body of a function respects the ascribed
    session type protocol specification. The type-checker analyses one side of an
    interaction, i.e. the module side, without requiring access to the code invoking
    the module public functions. This analysis assumes that the invoking code is well-behaved
    (even though it may or may not have been verified against the session type protocol
    specification), e.g. client1 follows S1 throughout the whole session in Fig. 1.
    The code for the type-checker, called ElixirST, is available at:


    https://github.com/gerlab/ElixirST


    In this paper we present the underlying type system (Section 3) on which the ElixirST
    type-checker is built and discuss its implementation details (Section 6). We also
    validate the type system; more concretely, in Section 4 we formalise the runtime
    semantics of the Elixir language fragment supported by ElixirST as a labelled
    transition system (LTS), modelling the execution of a spawned handler interacting
    with a client within a session (left implicit). This operational semantics then


    1 Some projects which build on this service handler design pattern include etorrent
    [4] and cowboy [5]. The latter is an HTTP server which spawns a handler process
    for each new request; this is scalable since spawning (and maintaining) actors
    is extremely efficient in Elixir. In literature, this pattern is also called thread-per-session
    [6].'
  - "[PAGE 2]\n\n```\n```elixir\ndefmodule Counter do\n  @spec server(pid, number)\
    \ :: atom\n  def server(client, total) do\n    receive do\n      {:incr, value}\
    \ -> server(client, total + value)\n      {:stop} -> terminate(client, total)\n\
    \    end\n  end\nend\n\n@spec terminate(pid, number) :: atom\ndef terminate(client,\
    \ total) do\n  send(client, {:value, total})\n  :ok\nend\nend\n```\n```\n\n# Listing\
    \ 1: Counter written in Elixir.\n\nallows us to prove a conditional form of the\
    \ session fidelity and progress properties for the ElixirST type system (Section\
    \ 5). Intuitively they state that, if the interacting processes (that are left\
    \ implicit) follow the prescribed protocol correctly, then the module code being\
    \ typechecked is guaranteed to behave correctly w.r.t. the protocol (expressed\
    \ in terms of the adapted session fidelity and progress properties).\n\nIn this\
    \ paper we merge and extend the work presented in [7,8]. In addition to [8], we\
    \ include the full typing rules which were originally relegated to the appendix.\
    \ We also present two additional sections (adapted from [7]): (a) Section 2 introduces\
    \ a motivating example; and (b) Section 6 describes the implementation details\
    \ of the ElixirST tool, along with a case study. The validation part of the paper\
    \ is also expanded, by including all proofs. We also add a new result, showing\
    \ that ElixirST observes a form of the progress property.\n\n# 2. Motivating example\n\
    \nConsider a simple counter system, adapted from [9], whereby a (server) process\
    \ stores a counter total which can be increased by a (client) interacting process\
    \ or else terminated by this same (client) process. A sample Elixir Counter module\
    \ is shown in Listing 1. It offers one public function called server on lines\
    \ 3-8 taking two arguments: the pid of the client, client, and the initial counter\
    \ total, total. A process executing this function waits to receive client requests\
    \ as messages in its mailbox using the receive do ... end statement; this construct\
    \ is blocking, meaning that the process stops until a message with the expected\
    \ format is received. The server function accepts two types of messages, namely,\
    \ increment requests with label :incr carrying payload val, or termination requests\
    \ denoted by the label :stop. On function branches accordingly: for increment\
    \ requests, it recurses while updating the running total to total+value on line\
    \ 5, whereas termination requests on line 6 are handled by calling the private\
    \ function terminate. Private functions, defined using defp, are only visible\
    \ from within a module. In this case, the function terminate (defined on lines\
    \ 11-14) sends a :value message carrying the final total value total to the client\
    \ process and terminates with the atom value :ok. Assuming that a client process\
    \ carrying a pid to variable client already exists, a counter server linked to\
    \ cid initialised with a running total of 0 can be launched using the statement:\n\
    \n```\nid = spawn(Counter, :server, [cid, 0]).\n```\n\nElixir conducts dynamic\
    \ typechecking to catch runtime errors. In addition, @spec annotations such as\
    \ those on lines 2 and 10 can help with detecting potential errors at compile-time.\
    \ However, the language offers limited support to assist the static detection\
    \ of errors relating to the concurrent messaging. For instance, it might not be\
    \ immediately apparent that the payload carried by a :incr request should be a\
    \ number value. Similarly, the code in Listing 1 does not necessarily convey enough\
    \ information that the intended interaction with a server process should follow\
    \ the protocol depicted in Fig. 2. This means that if a client sends a message\
    \ to a server process an arbitrary number of times, followed by a single termination\
    \ request (i.e. no further increment or termination requests after the last one).\n\
    \nFrom the perspective of the server, the entire session of interactions can be\
    \ formalised as the session type (called counter) below:\n\n```\ncounter = & {\
    \ ?incr(number), counter,\n  ?stop():!value(number), end }   (1)\n```\n\nIt states\
    \ that the server can branch (i.e. &) in two ways: if it receives (i.e. ?) an\
    \ incr label with a number payload, the server recurs back to the beginning, and\
    \ if it receives a stop label, it has to send (i.e. !) back a label value with\
    \ a payload of type number (i.e. !value(number)). No further interactions are\
    \ allowed when the end statement is reached. Accordingly, the client has to follow\
    \ a compatible protocol, such as the dual of the same session type.\n\n```\ncounter\
    \ = & { ?incr(number), counter,\n  ?stop():!value(number), end }   (2)\n```"
