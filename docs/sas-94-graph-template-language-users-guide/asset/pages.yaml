    # The LAYOUT LATTICE Statement


    The LAYOUT LATTICE statement defines a multi-cell grid of graphs that can automatically
    align plots and tick display areas across grid cells to facilitate comparisons
    among plots. The LATTICE layout differs from the classification panel layouts
    in that the number of cells must be predefined and you must define the content
    of each cell separately. LATTICE is superbly similar to a GRIDDED layout because
    it can create a grid of heterogeneous plots. However, the LATTICE has much more
    functionality and supports the following:


    +   - adjustable column and row sizes

    - axis orientation on a row or column basis to facilitate comparisons

    - internal axes on a per-cell basis, or external axes for rows or columns of cells

    - internal labeling of cell contents (cell header)

    - external labeling of rows and columns (column and row headers)'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 226 Chapter 10 Using an Advanced Multi-cell Layout


    +   - external sidebars that span all columns (top and bottom) or rows (left and
    right).


    Figure 10.1 on page 226 shows a four-cell grid (two rows and two columns). It
    was produced with a LATTICE layout to illustrate the features of this layout type.
    The figure contains definitions of four plots, which by default are deatiled independently.


    A mixture of plot types or nested layouts could be used in the cells of the lattice.
    By default, each plot manages its own axis label to the lattice boundaries. In
    the figure, a light gray border has been added to each plot to show its boundaries
    within the lattice. The shaded areas represent the optional features that can
    be added to the lattice definition. By default, these shaded areas are not used
    in the lattice and space is not reserved for them. Thus, in the default case,
    the plot areas expand to replace the shaded areas in the cells.


    Figure 10.1 LATTICE Layout with Internal Axes


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_235_0.png)


    The shaded areas that are shown in the figure are typically used as follows:


    Notice that the cell header, when present, has a separate space above the plot
    area. The cell header can contain more than one line of text, but it is not restricted
    to displaying text. For example, you could use this area to display a legend.


    +   - Sidebars are often used to present text or a legend that pertains to all
    rows or all columns in the grid. Again, the sidebar is not limited to text or
    a legend. You could place another plot in a sidebar.'
