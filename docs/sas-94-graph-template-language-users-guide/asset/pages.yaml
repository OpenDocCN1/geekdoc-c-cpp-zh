  md: "# 228 Chapter 10 • Using an Advanced Multi-cell Layout\n\nThe following example\
    \ shows a very simple LATTICE layout:\n\n```\nproc template;\n  define statgraph\
    \ intro;\n    begingraph;\n      entrytitle \"Two-Cell Lattice Layout\";n    \
    \  layout lattice;\n        barchart category=age;\n        scatterplot x=height\
    \ y=weight;\n    endlayout;\n  endgraph;\nend;\nrun;\n\nproc sgender data=sashelp.class\
    \ template=intro;\nrun;\n```\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_237_0.png)\n\
    \nIn a LATTICE layout, each plot statement is considered independent and is placed\
    \ in a separate cell. When no grid size is provided, the default layout creates\
    \ a graph with one column of cells, and it allots each cell the same amount of\
    \ space. The number of rows in the grid is determined by the number of stand-alone\
    \ plot statements in the layout block.\n\n# Defining a Basic Lattice\n\n# Setting\
    \ Grid Dimensions\n\nAssume you want a grid of five plots. Before starting to\
    \ write code, you must first decide what grid dimensions want to set (how many\
    \ columns and rows) and whether you want to permit an empty cell in the grid.\
    \ If you do not want an empty cell, you must limit the grid to five cells, which\
    \ gives you two choices for the grid dimensions: five columns by one row (5x1),\
    \ or one column by five rows (1x5)."
