    # Removing Items from a Legend


    To remove one or more items from your legend, use the EXCLUDE option on your DISCRETELEGEND
    statement. The EXCLUDE specifies the label of each item that is to be removed
    as follows:


    ```

    EXCLUDE=(\*itemLabel" "itemLabel" ...)

    ```


    Each item is enclosed in quotation marks and must match the formatted string of
    the data value. For two or more items, each label is separated by a space. String
    matching is case sensitive. Here is an example that removes groups 13 and 15 from
    the legend.


    ```

    proc template;

    define statgraph order;

    begining;

    layout overlay;

    scatterplot X=Height Y=Weight / name="sp" group=age;

    discretelegend "sp" title="Age" sortorder=ascendingformatted

    exclude="*13" "15";

    endlayout;

    endgraph;

    ```


    ```

    proc sgender data=sashelp.class template=order;

    ```


