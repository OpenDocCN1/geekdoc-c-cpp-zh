  md: '# Initializing Dynamics and Macro Variables


    This context is valid because an automatic, internal conversion using the BEST,
    format will be performed (with no warning messages).


    # Initializing Dynamics and Macro Variables


    The main difference between dynamics macro variables is that they are initialized
    differently.


    For dynamics, use the DYNAMIC statement with PROC SGREND. Values for dynamics
    that resolve to column names or strings should be quoted.


    ```

    proc sgrender data=financial template=timeseries;

    dynamic var="inflation" ylabel="Inflation Rate";

    run;

    ```


    For macro variables, use the symbol table (local or global) to up the macro variables
    at run time:


    ```

    @let locate=inside;

    let tran=3;

    proc sgrender data=financial template=timeseries;

    dynamic var="inflation" ylabel="Inflation Rate";

    run;

    ```


    No initialization is needed for automatic macro variables like the system and
    time value SYSDATE.


    It is the responsibility of the person or process that initializes the dynamics
    or macro variables to ensure that the value is supplied for the substitution context.
    If necessary, you can use conditional logic to evaluate the supplied values of
    dynamics or macro variables. Conditional logic is discussed in Chapter 15, "Using
    Conditional Logic and Expressions,\" on page 337."


    If a dynamic is used to supply a GTL option with a specific value and the supplied
    value is not valid or it is not initialized, the option is ignored and the default
    value is used. For example, the HALIGN= accepts the values RIGHT, CENTER, and
    LEFT. If the dynamic ALIGN is defined and the template values HALIGN-RIGHT, CENTER,
    or LEFT, the ALIGN must be initialized with one of the values. If it is initialized
    with another value, the example, HALIGN=specification in the template is ignored,
    the default setting for HALIGN= is used, and you may see a warning in the SAS
    log.


    If a dynamic is used to supply a required argument such as a column name, and
    the name is misspelled or not provided, a warning is issued and that plot statement
    drops out of the final graph. A graph will still be produced, but it might be
    a blank graph, or it might show the results of all except those that are in error.


    The following example shows how to generate a generalized template that can be
    used to show the distribution of any numeric variable. The dynamic named VAR must
    be used, but the other dynamics are optional: BINS (the number of histogram bins)
    and FOOTNOTE. In the example, the DYNAMIC and MVAR variables are highlighted where
    they are used.


    ```

    proc template;

    define statgraph distribution;

    dynamic VAR BINS FOOTNOTE;

    mvar SYSDATE;

    ```'
