  md: '![](img/a9ccb6123dee40d424cb295a3a99c16c_216_0.png)


    # Positioning a Continuous Legend


    The CROSS-, DOWN-, and ORDER- options are not supported by the CONTINUOUSLEG statement.
    However, you can position a continuous legend with the LOCATION, HALIGN, VALIGN,
    and ORIENT options. By default, LOCATION=OUTSIDE and ORIENT=VERTICAL when HALIGN=RIGHT
    or HALIGN=LEFT.


    # Using Color Gradients to Represent Response Values


    Cont plots, surface plots, and heat maps support the use of color gradients to
    represent response values. For example, the SURFACEPLOT statement provides the
    SURFACECOLORGRADIENT=numeric-column setting to map surface colors to a continuous
    gradient and enable the use of a continuous legend. All surface types (FILL, FILLGRID,
    and WIREFRAME) can be used. The COLORMODEL= and REVERSECOLORMODEL= options also
    apply. For more information about surface plots, see Chapter 13, "3-D Graphics,"
    on page 309.


    data lake'
