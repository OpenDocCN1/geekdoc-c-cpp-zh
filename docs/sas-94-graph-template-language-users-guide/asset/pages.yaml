  md: '# 128 Chapter 6 • Managing Graph Appearance: General Principles


    Note: The values and graphical attributes defined in a discrete attribute map
    cannot be displayed by a CONTINUOUSLEGEND statement.


    Here is an example that creates and applies a discrete attribute to the values
    in column Stock of the plot data set. It also creates a discrete legend and uses
    the STOCKS style that was created in “Using Custom Styles to Control the Appearance
    of Grouped Data” on page 125.


    ```

