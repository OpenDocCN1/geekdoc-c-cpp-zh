    These attribute definitions yield the following results:

    * 36 unique fill colors (12 base colors + 12 lighter colors + 12 dark colors)

    * 84 unique marker symbol and color combinations (7 symbols x 12 contrast colors
    or fill colors)

    * 132 unique color and line pattern combinations (11 patterns x 12 contrast colors)

    When fill colors are rotated, the colors iterate through the 36 unique colors
    (the 12 base colors, the 12 lighter, and finally the 12 dark colors). The entire
    pattern repeats starting with the 37th iteration. The following figure shows one
    complete fill rotation cycle for the DEFAULT style.


    # Complete Default Fill Color Rotation for DEFAULT Style


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_156_0.png)


    When marker symbols are rotated, the marker symbols iterate first through the
    seven symbols and the first seven contrast colors (unfilled markers). On the eighth
    iteration, the first marker symbol (CIRCLE in this case) is repeated with the
    eighth contrast color. The next four symbols are then repeated with the remaining
    three contrast colors. On the 13th iteration, the first contrast color is repeated
    with the fifth marker symbol (SQUARE in square). This pattern continues for the
    remaining group values. The entire pattern repeats, starting with the 85th iteration.

    Note: For filled markers and outlined markers, the marker fill colors rotate through
    the fill colors that are defined in the GraphData1–GraphData style'
