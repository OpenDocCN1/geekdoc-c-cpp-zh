    # Changing Box Plot Display


    The SAS System defines many graphical elements. Some have a very narrow scope,
    such as those that control the display of box plots. Using these style elements
    as a starting point, you can change the style attribute values to achieve a very
    different appearance for your box plots. The same is true for histograms, contours,
    and some other plot types.'
