    In this template, the AXISTABLE statements are not placed in an inner block. The
    OFFSETMAX option is used with the Y axis in order to reserve space at the top
    of the graph for the axis. One AXISTABLE statement displays a row of statistical
    values for each vehicle type. Four AXISTABLE statements are required to build
    the table in this example. The POSITION= option is used in each AXISTABLE statement
    to position each table row. A simpler approach is to place one AXISTABLE statement
    in an inner margin block and include the CLASS=STATNAME option in the AXISTABLE
    statement. In that case, the INNERMARGIN statement automatically reserves space
    for the table, and the CLASS= option automatically generates one row for each
    statistic. However, the POSITION= option enables greater control over the vertical
    spacing of the table rows.


    > Note: The POSITION= option is ignored when the AXISTABLE statement is placed
    in an INNERMARGIN block.


    # Creating an Axis-Aligned Inset with the GTL Annotation Facility


    You can use the GTL annotation facility to construct an axis-aligned inset. By
    using the GTL annotation facility, you can position text and other graphics elements
    at specific coordinates in the DATVALUE drawing space along an axis. Although
    more complex, the annotation facility provides a great deal of flexibility for
    creating custom insets. For an example of using the GTL annotation facility to
    create axis-aligned insets, see “Example 2: Displaying Subsets of Annotations
    in Axis-Aligned Insets” on page 431. For information about the GTL annotation
    facility, see Chapter 14, “About The GTL Annotation Facility,” in SAS Template
    Language: Reference.'
