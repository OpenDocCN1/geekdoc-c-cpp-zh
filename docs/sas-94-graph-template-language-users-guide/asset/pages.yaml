  md: '# 410 Chapter 19 • Adding Non-Data-Driven Graphics to a Graph


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_419_0.png)


    # Adding Arrows and Lines


    Use a DRAWARROW or DRAWLINE statement to draw an arrow or line on your graph:
    The basic syntax is as follows:


    ```

    DRAWARROW X1=x1 y1=y1 x2=x2 y2=y2 / <options>

    ```


    The syntax for the DRAWLINE statement is similar.


    The X1-, X2-, and Y2- specify the coordinates for each endpoint of the arrow or
    line. By default, the coordinate units are GRAPHSPHERENT. You can include the
    DRAWSPACE= option, or the XSPACE=, YSPACE=, XSPACE=, and YSPACE= options to specify
    different units. If you specify DATAVALUE as the units and you want to scale your
    arrow or line to the secondary axis, you must also include the XAXIS-X2, YAXIS-X2,
    and YAXIS-Y2 options.


    For both arrows and lines, include the LINEATTRS= option in options to specify
    the line pattern, thickness, and color. For arrows, arrowheads that point in the
    outward direction. To change the arrowhead shape, include the ARROWHEADSHAPE=
    option and specify CLOSED, FILLED, or BARBED. You can also include the ARROWHEADSCALE=
    option to scale the arrowhead by the thickness of the line. The scaling factor
    is 1 by default. You can scale the arrow from a minimum of 0.5 to a maximum of
    2.


    To change the direction of arrow, include the ARROWHEADDIRECTION= option in options
    and specify IN or BOTH. The IN direction positions the arrowhead on the (X1, Y1)
    endpoint and points it toward the (X1, Y1) endpoint. The BOTH direction includes
    IN and OUT arrows forming a two-way arrow.


    Here is an example of a DRAWARROW statement that adds a two-dashed line.


    ```

    drawarrow x1=60 y1=70 x2=190 y2=70 / drawspace=graphpixel

    lineattrs=pattern=3 thicknessscale=2

    arrowheadshape=barbed arrowhead arrowheaddirection=both;

    ```


    The arrow is drawn from endpoint (60, 70) to endpoint (190, 70) in GRAPHPIXEL
    units in the following figure:


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_419_1.png)'
