  md: '# Defining a Basic Lattice 229


    To specify grid size, use the ROWS= and COLUMNS= options in the LAYOUT LATTICE
    statement. These options can be used in three ways to create the following grid,
    which contains one row and five columns:


    | | | | | |

    |---|---|---|---|---|


    ```

    layout lattice / columns=5 rows=1;

    /* plot definitions */

    endlayout;

    ```


    This makes the grid size explicit.


    ```

    layout lattice / order=columnmajor rows=1;

    /* plot definitions */

    endlayout;

    ```


    To specify only one row, also specify ORDER-COLUMNMAJOR. In this case, there are
    as many columns as there are plot definitions. This is the recommended way to
    create a row of plots.


    ```

    layout lattice / columns=5;

    /* plot definitions */

    endlayout;

    ```


    When the number of columns is specified, you place a limit on how many plots can
    appear in one row. If you want to include more than five plot definitions, additional
    rows (with five columns) would be added automatically ORDER=ROWMAJOR by default.


    If you are willing to have an empty cell in the grid, you could use a 2x3 or a
    3x2 grid:


    ```

    layout lattice / columns=3 rows=2;

    endlayout;

    ```


    | | | |

    |---|---|---|

    | | |


    Note: The LAYOUT LATTICE statement honors the full specification of columns and
    rows, unlike the LAYOUT GRIDD statement, which honors only COLUMNS= or ROWS=,
    depending on the ORDER= setting.


    By default, the layout uses the ORDER=ROWMAJOR setting to populate grid cells.
    This specification means "fill in all cells in the top row (starting at the top
    left) and then continue to the next row below:


    ```

    layout lattice / columns=3 rows=2;

    /* plot1 definition */

    /* plot2 definition */

    /* plot3 definition */

    /* plot4 definition */

    /* plot5 definition */

    endlayout;

    ```


    | Plot 1 | Plot 2 | Plot 3 |

    | Plot 4 | Plot 5 | Empty |'
  merge: -1
