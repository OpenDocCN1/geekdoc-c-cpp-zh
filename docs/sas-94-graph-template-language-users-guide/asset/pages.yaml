- img_proc: true
  md: "# Defining Axes for Equated Layouts\n\nAxes for the OVERLAYEQUATED layout are\
    \ similar to axes for the OVERLAY layout with the following exceptions:\n\n+ \
    \  - Both axes are of TYPE=LINEAR.\n- Some axis options that apply to both axes\
    \ are specified in a COMMONAXISOPTS= option. INTEGER, TICKVALUELIST, TICKVALUESEQUENCE,\
    \ VIEWMAX, and VIEWMIN.\n- XAXISOPTS= and YAXISOPTS= are available (with a different\
    \ set of suboptions from those of OVERLAY), but X2AXISOPTS= and Y2AXISOPTS= are\
    \ not supported. Some of the supported options are DISPLAY, LABEL, GRIDDISPLAY,\
    \ DISPLAYSECONDARY, OFFSETMIN, THRESHOLDMAX, TICKVALUEFORM.\n- No independent\
    \ secondary (X2, Y2) axes are available, although secondary axes that mirror the\
    \ primary axes can be displayed. The XAXIS= and YAXIS= options are ignored.\n\n\
    Chapter 5, “Managing Axes in an OVERLAY Layout,” on page 63 discusses many of\
    \ the axis options that are available for managing axes.\nTo illustrate how to\
    \ control axes for the equated layout, we will look at a simplified version of\
    \ the PPPLOT template that is supplied with Base SAS. The following code shows\
    \ a SAS UNIVARIATE program that can be used to PROC UNIVARIATE:\n\n```\nods graphics\
    \ on;\nproc univariate data=sashelp.heart;\n var weight;\npplot / normal square;\n\
    run;\nquit;\n```\n\nWhen the code is run, it creates the following plot. The plot\
    \ uses the PPPLOT template, which is stored in the BASE.UNARIATE.GRAPHICS folder\
    \ of Sashelp.Tmplmst item store:"
  merge: -1
  pgno: 313
- img_proc: true
  md: "# Basic Display Features of Equated Plots\n\n# P-P Plot for Weight\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_314_0.png)\n\
    \nPROC UNIVARIATE, the PPPLOT statement creates a probability-probability plot\
    \ (also referred to as a P-P plot or percent plot), which compares the empirical\
    \ cumulative distribution function (ccdf) of a variable with a specified theoretical\
    \ cumulative distribution function such as the normal. If the two distributions\
    \ match, the points on the plot follow a linear pattern that passes through the\
    \ origin and has unit slope. Thus, you can use a P-P plot to determine how well\
    \ a theoretical distribution models a set of measurements.\n\nThe supplied PPPLOT\
    \ template uses several dynamics to pass in values for options, but in essence,\
    \ the template is equivalent. The dynamics for the title and axis labels have\
    \ been converted into literals appropriate for this set of data.\n\n```\nproc\
    \ template;\ndefine statgraph pp_plot;\nbegingraph;\n  entrytitle=\"P-P Plot for\
    \ Weight\";\n  entryfootnote align=right=\"Derived from PPPLOT template\";\n\n\
    layout overequated /\n  xaxisopts=(label=\"Normal(Mu=153.09 Sigma=28.915)\"\n\
    \    thresholdmin=1 thresholdmax=1)\n  yaxisopts=(label=\"Cumulative Distribution\
    \ of Weight\")\n    thresholdmin=1 thresholdmax=1)\n  commonxaxisopts=(viewmin=0.0\
    \ viewmax=1.0) ;\n\n  scatterplot x=Theoretical y=Empirical;\n  lineattr x=0 y=0\
    \ slope=1 / lineattrs=GraphFit;\nendlay;\nend;\nrun;\n```\n\nThis simplified template\
    \ produces a similar plot if it is rendered with the same data as the UNIVARIATE\
    \ plot. An ODS OUTPUT statement can convert the output object from UNIVARIATE\
    \ into a SAS data set:\n\nods graphics on;"
  merge: -1
  pgno: 314
- img_proc: true
  md: '```

    ods select pplot;

    ods output pplot=ppdata;

    proc univariate data=sashelp.heart;

    var weight;

    pplot / normal square;

    run;

    quit;

    ```


    ```

    proc sgrender data=ppdata

    template=pp_plot;

    run;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_315_0.png)


    The following template modifies the axes, as shown in the next graph:


    ```

    layout overlayequated / etype=square

    xaxisopts=(label="Normal (Mu=153.09 Sigma=28.915)\)

    thresholdmin=1 thresholdmax=1

    tickvalueformat=3.2

    display=(label tickvalues)

    displaysecondary=(tickvalues)

    griddisplayon

    yaxisopts=(label="Cumulative Distribution of Weight")

    thresholdmin=1 thresholdmax=1

    tickvalueformat=3.2

    display=(label tickvalues)

    displaysecondary=(tickvalues)

    griddisplayon

    conaxisopts=(viewmin=0.0 vmax=1.0)

    tickvaluessequence=(start=0 end=1 increment=.25));

    ```'
