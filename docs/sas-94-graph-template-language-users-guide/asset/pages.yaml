    # General Syntax for Attribute Options


    Most statements provide options that enable you to specify attributes for the
    fills, lines, data markers, or text that is used in the display. For example,
    many plots provide a DATABELATTR= option that specifies the attributes of the
    data labels. This appendix discusses the general syntax for those options and
    the valid values for them.


    A statement''s attribute options use the following general syntax:


    ```

    ATTRSOPTIONNAME=style-element | style-element (options) | (options)

    ```


    style-element


    Name of a style element. Only style attributes relevant for rendering the fill,
    line, data marker, or text are used. Example:


    ```

    ATTRSOPTIONNAME=GRAPHVALUETEXT

    ```


    style-element (options)


    Name of a style element, plus individual options to be used as style overrides.
    Any options not specified are derived from the specified style-element.Example:


    Example


    ```

    ATTRSOPTIONNAME=GRAPHVALUETEXT(SIZE=10pt)

    ```


    (options)


    Individual options. Any options not specified are derived from the default style
    element. Examples:


    Example


    ```

    ATTRSOPTIONNAME=(FAMILY="Arial" SIZE=10pt)

    ```'
  merge: -1
  pgno: 502
