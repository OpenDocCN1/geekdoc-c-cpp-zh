- img_proc: true
  md: '# Using the OUTPUTFMT= ODS Graphics Option to Control the Image Format


    Each ODS destination uses a default image format for its output. Depending on
    the destination, the default image output format is Portable Network Graphics
    (PNG) or vector graphics. See SAS Output Delivery System: User''s Guide for more
    information. You can use the OUTPUTFMT= option in the ODS GRAPHICS statement to
    change the output format.


    Unless you have a special requirement for changing the image format, we recommend
    that you not change it. The default PNG or vector graphics format is far superior
    to other formats, such as GIF, in spot for transparency and a large number of
    colors. PNG and vector graphics images require much less disk storage space than
    JPEG or TIFF formats. Additional advantages that are provided by vector graphics
    images include scalability and multiple output formats, which are PDF, EMF, and
    SVG.


    If you want to generate vector graphics images, you can use the ODS destination
    and ODS GRAPHICS statement OUTPUTFMT= option combinations that are shown in Table
    22.3 on page 452.


    # Table 22.3 Generating Vector Graphics Images with ODS


    | ODS Destination | ODS Graphics Statement OUTPUTFMT= Option |

    | --- | --- |

    | ODS HTML | OUTPUTFMT=EMF |

    | ODS LISTING | OUTPUTFMT=EMF<br>OUTPUTFMT=PDF<br>OUTPUTFMT=SVG<br>OUTPUTFMT=PS
    | EPS | EPSI |

    | ODS PDF | (vector graphics images are generated by default) |

    | ODS PRINTER | OUTPUTFMT=EMF (for EMF output)<br>OUTPUTFMT=PCL (for PCL output)<br>OUTPUTFMT=PDF
    (for PDF output)<br>OUTPUTFMT=PS | EPS | EPSI (for Postscript output)<br>OUTPUTFMT=SVG
    (for SVG output) |

    | ODS RTF | OUTPUTFMT=EMF |


    If a vector graphics image cannot be generated for the image format that you specify,
    a PNG image is generated instead and is embedded in the specified output file.
    The output file format and extension are not changed in that case. Cases where
    a vector graphics image cannot be generated include the following:


    +   * surface plots

    * bivariate histograms

    * graphs that use gradient contours

    * graphs that include continuous legends'
  merge: -1
  pgno: 461
