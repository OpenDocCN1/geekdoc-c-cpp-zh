  md: "Here is the output for this example.\n\n**Figure 17.3** An Axis-Aligned Inset\
    \ Created Using a Block Plot\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_390_0.png)\n\
    \nThe input data for this example must contain data for both the series plot and\
    \ the block plot. The simplest way to construct the appropriate data is to match-merge\
    \ the Microsoft release data and the Microsoft stock data. The first step is to\
    \ create data set Msevents, which contains the Microsoft release dates. The next\
