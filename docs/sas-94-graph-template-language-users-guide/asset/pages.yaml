    +   - DISCRETELEGEND, CONTINUOUSLEGEND, ENTRY, ENTRTITLE, and ENTRYFOOTNOTE statements
    cannot be included in the PROTOTYPE layout, nor can nested layers. For information
    about adding a legend or other information outside of the cells, use "Sidebars"
    on page 277.

    - Options for classification panels are specified by the LAYOUT DATALATTICE or
