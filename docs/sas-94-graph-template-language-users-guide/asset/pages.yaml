    #  Adding Sidebars


    The graph in Figure 10.5 on page 245 is progressing well, the ENTRYTITLE is centered
    on the entire graph. It would look better if it were centered on the grid area.
    This can be accomplished by removing the ENTRYTITLE block and replacing it with
    a SIDEBAR block. Four sidebar areas are available: two that span columns (one
    on the TOP and one on the BOTTOM), and two that span rows (one on the RIGHT and
    one on the LEFT).


    ```

    sidebar / align=top;

    entry "Microsoft Stock Performance" /

    tatextattrs=GraphlabelText pad(bottom=5px);

    endsidebar;

    ```


    Finally, we need a way of explaining that the prices in the first row represent
    an adjusted close value. We also need to explain that the axis scaling for the
    second row is in millions of shares. Two strategies are available for providing
    this information.


    The first strategy is to create an external legend. For this strategy, we must
    define legend text on two of the plot statements, and add a DISCRETELEGEND statement
    to the BOTTOM sidebar.


    ```

    seriesplot x=date2004 y=price2004 /

    lineattrs=GraphData2(thickness=2px pattern=solid)

    name="series" legendlabel="Adjusted Close";

    ```


    ```

    needleplot x=date2004 y=vol2004 /

    lineattrs=GraphData2(thickness=2px pattern=solid)

    name="needle" legendlabel="Millions of Shares";

    ```


    ```

    sidebar / align=bottom;

    discretelegend "series" "needle" / border=off pad=(top=10px);

    endsidebar;

    ```


    The following graph shows what this modification looks like:'
