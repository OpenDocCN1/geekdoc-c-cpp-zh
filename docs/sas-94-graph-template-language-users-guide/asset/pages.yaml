    # Overview: Adding Data-Driven Annotations to a Graph


    The Graph Template Language (GTL) provides an annotation facility that enables
    you to add graphics elements to a graph using graph instructions that are stored
    in a SAS data set. It is similar to the SAS/GRAPH Annot facility. Unlike adding
    graphics elements using the GTL draw statements, the annotation facility enables
    you to separate the annotation instructions from your template code. To modify
    your annotations, you can specify a different annotation data set. You do not
    have to modify your template code.


    Like the GTL draw statements, you can use the annotation facility to add the following
    graphics elements to your graphs:


    +   * text

    * arrows and lines

    * geometric shapes, such as ovals, rectangles, polylines, and polygons

    * images


    You can draw the annotations in one of the following drawing spaces on your graph:
    the data area, the wall area, the layout area, or the graph area. For more information
    about the drawing spaces, see “Selecting the Drawing Space and Units” on page
    406. You can'
