    # ### Categories of Statements


    # #### Overview of GTL Statement Categories


    GTL statements generally fall into two main categories:


    +   - Plot, Legend, and Text statements that determine what items are drawn in
    the graph.

    - Layout statements that determine how or where the items in the graphs are placed.


    # #### Plot Statement Terminology and Concepts


    # ##### Overview of the GTL Plot Statements


    GTL has numerous plot statements that can be combined with one another in many
    ways. In future releases of GTL, new layout and plot statements will be added
    to supplement now available. GTL has been designed as a high-level toolkit that
    enables you to create a large variety of graphs by combining its constructs in
    different ways. As you might imagine, not all combinations of statements are possible,
    and most of the invalid combinations are caught during template compilation. Rather
    than trying to create graphs by trial and error, we recommend that you use few
    basic "rules of assembly" to guide your efforts and make the language easier to
    work with. To that end, new terminology is useful.


    # ##### Plot Terminology


    Computed plots internally perform computational transformations on the input data
    and, as necessary, add new columns to a data object in order to render the result
    plot. For example, a LOESSPLOT requires two numeric columns of raw input data
    (X=column and Y=column). A loss fit is computed for this input point pairs, a
    new set of points on a line is generated, and a new column that contains the computed
    points is added to the data object. A smoothed line is drawn through the computed
    points. Computed plots have several options to control the computed performance.
    Another form of computed plot is user-defined transformations using the EVAL function
    to compute a new column such as Y=eval(log10(column)). This transforms values
    into corresponding logarithmic values. Why is it important to know whether a plot
    is computed? Certain layouts do not allow computed plots to be included.


    # ##### Parameterized Plots


    Parameterized plots simply render the input data that they are given. They are
    useful whenever you have input data that does not need to be preprocessed or has
    already been summarized (possibly an data set from a procedure like FREQ). For
    example, BARCHPART draws one bar per observation: the Xcolumn provides the bar
    value and the Y=column provides the bar length. So a bar chart with five bars
    requires a data set with five observations and two variables. A parameterized
    bar chart statement is useful when the computed BARCHART statement does not perform
    the type of computation that you want, and you have'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Chapter 3 • Overview of Basic Statements and Options


    done the summarization yourself. Many parameterized plots have a PARM suffix added
    to their name. Another common situation is when you want to draw a fit line and
    a confidence band from a set of data that already has the appropriate set of (X,Y)
    point coordinates. For these situations that you would use a SERIESPLOT statement
    for the fit line and BANDPLOT statement for the confidence band. Why is it important
    to know whether a plot is parameterized? Parameterized plots have no additional
    computation takes on the input data. Thus, input data that does not meet the special
    requirements for the parameterized plot might result in bad output or a blank
    graph.


    # Stand-alone Plots


    A stand-alone plot is to be drawn without any accompanying plot. In general, a
    stand-alone is if input data defines a range of values for all axes that are needed
    to draw the plot. For example, the observations in a SCATTERPLOT spans a certain
    data range in both X and Y axes. This information is necessary to successfully
    draw the axes and the markers. Why is it important to know which plots are stand-alone?
    Because most layouts need to know the extents of the X and Y axis to draw the
    plot.


    # Dependent Plots


    A dependent plot is one that, itself, does not provide enough information for
    the axes that are needed to successfully draw the plot. For example, the REFERENCE
    statement draws a straight line perpendicular to one axis at given input point
    on the same axis. Because there is only one point provided, there is not enough
    information to determine the full range of that axis. Furthermore, no information
    is provided for the data range of the second axis. Thus, a REFERENCE statement
    not provide enough information by itself to draw the axes and the plot. A plot
    needs to work with another "Stand-alone" plot, which provides the necessary information
    to determine the extents of the two axes.


    # Primary Plot


    When you overlay two or more plots, the layout container determines the type of
    axis to use, the data range of all axes, and the default label to use for each
    axis. By default, the first encountered stand-alone plot is used to decide the
    axis type and axis format. In some cases, you desire overlay stacking and must
    order your statements accordingly. This might result in undesirable properties.
    By adding the PRIMARY=TRUE option to a stand-alone plot, you can request that
    this plot be used to determine axis type and axis format and label. A dependent
    plot cannot be designated as primary.


    # Graphics Types


    GTL supports 2-D and 3-D graphics. Currently there are only two 3-D plot statements
    (SURFACEPLOTPAR and BIHISTOGRAMDPARM), 3-D plot statements must be used in a 3-D
    layout, 2-D plot statements cannot be used in a 3-D layout, and for more information
    about layouts, see "Layout Containers" on page 32.


    # Plot Statements Categorized by Type


    Plot statements are generally categorized as stand-alone or dependent, computed
    or parameterized, 2-D or 3-D. The following tables show the distribution of plots
    in these categories.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Table 3.1 Stand-alone, 2-D, Computed Plots


    | 2-D PLOTS: COMPUTED | |

    | Statement | Required Arguments | Comments |

    | --- | --- | --- |

    | BARCHART | One column | Horizontal or vertical. |

    | BOXPLOT | One numeric-column | Horizontal or vertical. |

    | BUBBLEPLOT | Three numeric-columns | Plot of bubbles where a bubble is placed
    at each X and Y= crossing and sized according to a response variable. By default,
    the bubbles appear as outlined circles. |

    | DENDOGRAM | Three numeric-columns | Tree diagram that represents the results
    of a hierarchical clustering analysis. |

    | DENSITYPLOT | One numeric-column | Theoretical distribution curve (for example,
    NORMAL or KDE). |

    | ELLIPSE | Two numeric-columns | Confidence or prediction ellipse for a set of
    points. |

