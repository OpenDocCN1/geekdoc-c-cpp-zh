    # Appearance of Grouped Data


    # Plots That Support Grouped Data


    The GROUP= column option is used to plot data when a classification or grouping
    variable is available. Plots that support the GROUP= option include the following:


    | BANDPLOT | LOESSPLOT | SCATTERPLOTMATRIX |

    | BARCHART | NEEDLEPLOT | SERIESPLOT |

    | BOXPLOT | PBSLINEPLOT | STEPPPLOT |

    | BUBBLEPLOT | PIECHART | VECTORPLOT |

    | HIGHLOW | REGRESSIONPLOT | |

    | LINEPARM | SCATTERPLOT |


    # Using the Default Appearance for Grouped Data


    By default, the GROUP= option automatically uses the style elements GraphData
    to GraphDataN for the presentation of each unique group value. Here is an example
    of a series plot that displays group data using the default HTMLBLUE ODS style.


    ```

    proc template;

    def statgraph group;

    begingraphitle "Tech Stocks 2002-2004"

    entfootnote align=left="Source: SASHELP.STOCKS";nlayout overlay;

    seriesplot x=date y=close / group=stock name="series"

    lineattrrs=(thickness=2);

    discretelegend="series"

    endlayout;

    endgraph;

    run;

    proc sgrender data=sashelp.stocks template=group;

    where date between "1jan02d" and "31dec04d"

    run;

    ```'
