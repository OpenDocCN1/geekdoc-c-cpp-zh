    The output reflects the requested stacking order.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_57_0.png)


    **Chart Orientation.** When creating a bar chart, it is sometimes desirable to
    rotate the chart from vertical to horizontal. GTL does not provide separate statements
    for vertical and horizontal charts—each is considered the same type with a different
    orientation. To create the horizontal version of the bar-line chart, you need
    to specify ORIENT=HORIZONTAL in the BARCHARTPARM statement:


    ```

    proc template;

    define sgbarline2;

    begingraph;

    entrentitle "Overlay of REFERENCELINE, BARCHARTPAEM and SERIESPLOT";

    layout overlay/* / yisaxis=(reverse=true) */;

    referenceline x=200000 / label="Target";

    barchartparm category=year response=retail / orient=horizontal

    datin=fillattrs=(pattern=r1 color=lightgray);

    seriesplot x=profit y=year / name="series";

    legend="Profit in USD";

    discretelegend="series";

    endlayout;

    endgraph;

    ```


    ```

    / compute sums for each product line */

    proc data=sashelp.orales nway;

    class year;

    var total_retail_price profit;

    output out=orales sum=Retail Profit;

    run;

    ```


    * close the ODS HTML destination */

    ods html close;'
