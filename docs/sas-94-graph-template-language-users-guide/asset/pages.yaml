    # Modifying Templates for Automatic Graphs


    The graphs are produced by the SAS analytical procedures are created from compiled
    STATGRAPH templates that are written in GTL. For each graph that is created by
    a procedure, a template has been defined by the procedure writers and shipped
    with SAS. These templates can be found in the appropriate subfolder of the Sashlep.Tnmplst
    item (issue the ODSTEMPLATE command to open the Templates window). Users wanting
    to make persistent changes to these automatic graphics can do so by editing and
    recompiling these definitions of the graphs. Understanding the structure of these
    templates requires knowledge of GTL, as described in this guide: Changes to these
    templates should follow the guidelines presented in the discussion on statistical
    graphics using ODS in the SAS/Stat User''s Guide.


    # Editing Graphs Using the ODS Graphics Editor


    After creating an ODS graph, you might want to edit and/ customize the graphical
    output for presentation to your audience or for inclusion in other documents.
    These changes could be as simple as editing the graph title, or adding a footnote
    to the graph. After you could edit the associated template using GTL and then
    regenerate the graph, you can use the ODS Graphics Editor to make simple, customized
    changes to the ODS Graphics output. The ODS Graphics Editor is an interactive,
    GUI-based tool that is specifically designed for this purpose. Using this,


    +   - edit or add titles and footnotes to the graphs'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Chapter 1 · ODS Graphics


    +   - change graph styles and visual attributes, such as marker shapes, line patterns,
    colors, and so on


    +   - add free-form text, arrows, lines, and other graph elements to call out
    elements of the results.


    Made to a graph with the ODS Graphics Editor do not affect the template that defined
    the graph. For more information about the ODS Graphics Editor, see the SAS ODS
    Graphics Editor: User''s Guide


    # Creating Graphs Using the SAS Statistical Graphics Procedures


    As so far, you can obtain analytical graphs automatically from SAS analytical
    procedures. Furthermore, you can edit or customize these graphs with the ODS Graphics
    Editor, without need to learn the GTL syntax. Frequently you might need to get
    a better understanding of the data in a study or survey by creating graphical
    views of the data. Such views might be necessary before a decision is made about
    the detailed analysis procedure. Also, your task might require data analysis using
    multiple procedures and some custom data management. After such analysis process,
    the results are contained in the output data sets might need to be displayed as
    custom graphs.


    Many such graphs can be created using the SAS Statistical (SG) Procedures. The
    SG procedures are a set of procedures behind the scenes to create commonly used
    graphs by leverage the GTL behind a simple and complex syntax. The following SG
    procedures are available with SAS:


    +   - The SGPLOT procedure for creating single-cell graphs.


    +   - The SPANEL procedure for creating multi-cell classification panels.


    +   - The SCATTER procedure for creating multi-cell comparative scatter plots.


    The SG procedures provide additional data summarization features that are not
    provided by GTL. For many users, these procedures are the right set of tools to
    use for meeting your needs, without deploying the full power of GTL.


    For more information about the SG procedures, see the SAS ODS Graphics: Procedures
    Guide


    # Creating Graphs Using the SAS ODS Graphics Designer


    If you prefer to create custom graphs without having to know the details of GTL,
    you can use the ODS Graphics Designer. The SAS ODS Graphics Designer is a graphical
    application that allows you to design and create custom graphs interactively using
    your point-and-click graphical interface. The ODS Graphics Designer is based on
    GTL, which is used by the SAS analytical procedures and the SAS ODS Graphics procedures.
    However, you do not need to know the details of GTL to create graphs using the
    ODS Graphics Designer.


    Using the ODS Graphics Designer, you can design sophisticated graphs a wide array
    of plot types. You can design multi-cell graphs, classification panels, and scatter'
  merge: -1
