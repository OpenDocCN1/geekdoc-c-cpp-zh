  md: '# Label Splitting Using SPLITWAYS


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_86_0.png)


    # Positioning the Labels


    By default, axis labels are centered in the axis area as shown in Figure 5.1 on
    page 73. You can use the LABELPOSITION+ option to change the position of the axis
    labels for the OVERLAY, DATALATTICE, DATAPANEL, and LATTICE layouts. For the OVERLAY,
    DATALATTICE, and DATAPANEL, you can specify one of the following values for LABELPOSITION=


    +   - CENTER centers the axis label in the axis area (default).

    - DATACENTER for OVERLAY layouts, centers the axis label in the axis tick display
    area. For DATALLATTICE and DATAPANEL layouts, this value repeats the axis label
    for each row or column and each label in the axis tick display area of its row
    or column.

    - TOP OR BOTTOM or the label horizontally at the top or bottom of the axis area.

    - LEFT OR RIGHT positions the label to the left or right of the axis area.


    For the LATTICE layout, you can specify one of the following values for LABELPOSITION=


    +   - CENTER centers the axis label in the axis area (default).

    - DATACENTER centers each row or column label in the axis tick display area.


    In the following example, the Y-axis label is positioned at the top of the axis
    area, and the X-axis label is positioned to the right of the axis area in an OVERLAY
    layout.


    ```

    layout overlay / cycleaxes=(labelposition=right)

    axisopts=(labelposition=top)

    yaxisopts=(labelposition=top)

    seriesplot x=Hours y=Bacteria/ curlabel="Bacteria"

    seriesplot x=Hours y=Virus / curlabel="Virus" primary=true

    endlayout;

    ```'
