    # Data Requirements for 3-D Plots


    Overview of the Data Requirements for 3-D Plots


    Both of the plot statements that can be used in the OVERLAY3D layout are parameterized
    plots.(Sec "Plot Statement Terminology and Concepts" on page 23). This means that
    the input data must conform to prerequisites in order for the plot to be drawn.


    Parameterized plots do not perform any internal data transformations or computing
    for you. So, in most cases, you will need to perform some type of preliminary
    data manipulation to set up the input data correctly before executing the template.
    The types of data transformations that you need to perform are commonly known
    as "binning" and "gridding".


    # Producing Bivariate Histograms


    A bivariate histogram shows the distribution of data for two continuous numeric
    variables. In the following graph, the X axis displays HEIGHT values and the Y
    axis displays WEIGHT values. The Z axis represents the frequency count of observations.
    The Z values could be some other measure (for example, percentage of observations),
    but they can never be negative.'
