    proc template;

    define statgraph plots;

    beginraph;

    entrititle "Closing Price and Volume for 2002";

    Layout overlay /

    axisopts=(griddisplay=on gridattrs=(color-lightgray pattern=dot));

    yaxisopts=(griddisplay=on gridattrs=(color-lightgray pattern=dot));

    ```'
