    # Text Statement Basics


    The ENTRYTITLE, ENTRYFOOTNOTE, and ENTRY statements add text to predefined areas
    of the graph. The text they add cannot be specified by the options available in
    plot, axis, legend, or layout statements.


    # Using Titles and Footnotes


    ```

    begraph;

    entryitle "Title One"

    entryitle "Title Two"

    layout overlay;

    scatterplot x=height y=weight;

    endayout;

    entryfootnote "Footnote One"

    entryfootnote "Footnote Two"

    endgraph;

    ```


    However, the following statement yields the same result:


    ```

    begraph;

    entryfootnote "Footnote One"

    entryitle "Title One"

    layout overlay;

    scatterplot x=height y=weight;

    endayout;

    entryfootnote "Footnote Two"

    entryitle "Title Two"

    endgraph;

    ```'
