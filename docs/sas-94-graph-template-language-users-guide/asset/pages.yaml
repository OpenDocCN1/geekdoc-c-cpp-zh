  md: "# Conditional Logic 341\n\n```\nIF ( condition )\n  GTL statement);\nELSE\n\
    \  IF ( condition )\n    GTL statement);\nELSE\n  GTL statement);\nENDIF;\n```\n\
    \nThe following example creates a generalized histogram that conditionally shows\
    \ the variable label and combinations of fitted distribution curves:\n\n```\n\
    proc template;\n  define statagraph conditional;\n  dynamic NUMVAR \"required\"\
    \ SCALE CURVE;\n  begingraph;\n    entrytitle \"Distribution of \" eval(colname(NUMVAR));\n\
    ```\n\n```\nif colname(NUMVAR) ne collab(NUMVAR )\n  entrytitle \"* eval(collab(NUMVAR))\
    \ \"\";\nendif;\n```\n\n```\nlayout overlay / xaxisopts=(display=(ticks tickvalues));\n\
    histogram NUMVAR / scale=SCALE;\n```\n\n```\nif ( upcase(CURVE) in (\"ALL\" \"\
    NORMAL\") )\n  densityplot NUMVAR / normal(i) name=\"N\"\n  lineattrs=GraphData\
    \ legend=\"Normal Distribution\";\nendif;\n```\n\n```\nif ( upcase(CURVE) in (\"\
    ALL\" \"KDE\" \"KERNEL\") )\n  densityplot NUMVAR / kernel(i) name=\"K\"\n  lineattrs=GraphData\
    \ legend=\"Kernel Density Estimate\";\nendif;\n```\n\n```\ndiscretelegend \"N\"\
    \ \"K\";nendlayout;\n```\n\n```\nendgraph;\nend;\nrun;\n```\n\n+   * The DYNAMIC\
    \ statement identifies the dynamic variables.\n\n+   * The first IF block specifies\
    \ an ENTRYTITLE statement that is conditionally executed if the col name differs\
    \ from the column label.\n* The next two IF blocks evaluate the value of the dynamic\
    \ variable CURVE. If CURVE is not used, the code in the conditional blocks is\
    \ not executed. If CURVE is initialized to one of the strings \"all\" or \"normal\"\
    \ in any letter, then the DENSITYPLOT statement is initialized to one of the strings\
    \ \"all\", \"kde\", or \"kernel\" in any letter, then the second DENSITYPLOT statement\
    \ is executed. Thus, the results of the conditional logic determine whether zero,\
    \ one or two density plots are generated in the graph.\n\n+   * Configuring the\
    \ legend does not require conditional logic because any referenced plot names\
    \ that do not exist are used."
