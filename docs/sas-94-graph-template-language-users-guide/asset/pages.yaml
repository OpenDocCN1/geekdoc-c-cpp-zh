  md: "Using the DEFAULT style for an example, here is a portion of the style definition\
    \ for elements that are related to box plots:\n\n```\nproc template;\n...\ndefine\
    \ style Styles.Default;\n\nstyle GraphBox /\n  capstyle = \"serif*\"\nconnect\
    \ = \"mean\"\ndisplayopts = \"fill caps median outliers*\"\nstyle GraphBoxMean\
    \ / ... ;\nstyle GraphBoxMedian / ... ;\nstyle GraphBoxOutlier / ... ;\nstyle\
    \ GraphBoxWhiskers / ... ;\\n...\nend;\nrun;\n```\n\n| Style Element | Purpose\
    \ |\n| --- | --- |\n| GraphBox | general box plot properties (see the next table)\
    \ |\n| GraphBoxMean | marker properties of mean marker (MARKERSYMBOL=, MARKERSIZE=,\
    \ CONTRASTCOLOR=) |\n| GraphBoxMedian | line properties of the median line (LINESTYLE=,\
    \ LINETHICKNESS=, CONTRASTCOLOR=) |\n| GraphBoxOutlier | marker properties of\
    \ outliers (MARKERSYMBOL=, MARKERSIZE=, CONTRASTCOLOR=) |\n| GraphBoxWhisker |\
    \ line properties of whiskers and caps (LINESTYLE=, LINETHICKNESS=, CONTRASTCOLOR=)\
    \ |\n\n| Attribute | Value(s) | Description |\n| --- | --- | --- |\n| CONNECT=\
    \ | \"MEAN\" | \"MEDIAN\" | \"Q1\" | \"Q3\" | \"MIN\" | \"MAX\" | statistic to\
    \ connect with line |\n| CAPSTYLE= | \"SERIF\" | \"LINE\" | \"BRACKET\" | shape\
    \ at ends of whiskers |\n| DISPLAYOPTS= <CAPS> | show caps at end of whiskers\
    \ |\n| | <FILL> | show filled boxes |\n| | <MEAN> | show a marker for the mean\
    \ |\n| | <MEDIAN> | show a line for the median |\n| | <OUTLIERS> | show markers\
    \ for the outliers |"
