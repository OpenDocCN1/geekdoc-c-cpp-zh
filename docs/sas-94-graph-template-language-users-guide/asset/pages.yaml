  md: '# Controlling Anti-Aliasing


    Anti-aliasing is a graphical rendering technique that improves the readability
    of text and the crispness of the graphical primitives, such as the markers and
    lines. By default, ODS Graphics uses anti-aliasing.


    Note: Footnotes, titles, entry text, axis labels, tick values, and legend text
    are always antialiased. Graphical components related to the data, such as markers,
    lines, and labels, are affected by the ANTIALIAS= and ANTIALIASMAX= options, as
    discussed in this section.


    To see how the graph quality is improved with anti-aliasing, you can turn this
    feature on and off with the ANTIALIAS= option in the ODS GRAPHICS statement.


    ```

    ods graphics / antialias=on;\ods html image_dpi=100;

    proc sgrender data=sashelp.class template=fitline;

    run;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_471_0.png)


    ```

    ods graphics / antialias=off;\ods html image_dpi=100;

    proc sgrender data=sashelp.class template=fitline;

    run;

    ```'
  merge: -1
  pgno: 471
- img_proc: true
  md: '# Common Tasks 463


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_472_0.png)


    The following image shows a zoomed-in view of a portion of the anti-aliased image
    (100dpi). Notice that the text, markers, and line appear fuzzy because of the
    anti-aliasing algorithm.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_472_1.png)


    This next image shows a zoomed-in view of the image (100dpi) that has anti-aliasing
    turned off. Notice that the text, markers, and line are not fuzzy but have a jagged
    appearance.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_472_2.png)


    If the image is created at 300dpi, the combination of anti-aliasing and higher
    resolution produces a very high quality image.'
