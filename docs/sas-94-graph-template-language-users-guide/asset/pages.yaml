    \ the Events Data Set\n\n```\n* Create a set of the release dates. */\ndata Msevents;\n\
    \    input date9. Release $;\ndatalines;\n09dec1987 2.0\n22may1989 3.0\n01aug1993\
    \ NT 3.1\n24aug1995 95\n25jun1998 98\n17feb2000 2000\n25oct2001 XP\n;\nrun;\n\n\
    /* Sort the Microsoft stock data by date. */\nproc sort data=sashelp.stocks(keep=date\
    \ stock adj)\nout=MSstock;\nwhere stocks=\"Microsoft\"\n    by date;\nrun;\n\n\
    /* Match-merge the release data and the stock data. */\ndata events;\n```"
