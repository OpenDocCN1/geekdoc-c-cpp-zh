  md: "# Plot Concepts\n\nTo illustrate the use of the different types of plot statements,\
    \ consider the following template. In this template, named MODELFIT, SCATTERPLOT\
    \ is overlaid with a REGRESSIONPLOT. The REGRESSIONPLOT is a computed plot because\
    \ it takes the input columns (Height and Weight) and transforms them into two\
    \ columns that correspond to points on the requested fit line. a linear regression\
    \ (DEGREE=1) is performed with other statistical data. The model in this case\
    \ is Height-Weight, in which the plot is specified with X-HEIGHT (independent\
    \ variable) and Y-WEIGHT (dependent variable). The number of observations generated\
    \ for the fit line is around 200.\n\nNote: Plot statements have to be used in\
    \ conjunction with Layout statements. To simplify our discussion, we will use\
    \ the most basic layout statement: LAYOUT OVERLAY. This layout statement acts\
    \ as a single container for all plot statements placed within. Every plot is drawn\
    \ on top of the previous one in the order in which the plot statements are specified,\
    \ with the last one on top.\n\n```\nproc template;\ndefine statgraph modelfit;\n\
    beginraph;\nentryitle \"Regression Fit Plot*\\\";\nlayout overlay;\n  scatterplot\
    \ x=height y=weight /\n  primary=true;\n  regressionplot x=height y=weight;\n\
    endlayout;\nendgraph;\nend;\nrun;\nproc sgrender data-sashelp.class\ntemplate=modelfit;\n\
    run;\"\n```\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_37_0.png)\n\nThe REGRESSIONPLOT\
    \ statement can also generate sets of points for the upper and lower confidence\
    \ limits of the mean (CLM), and for the upper and lower limits of individual predicted\
    \ values (CLI) for each observation. The CLM=\"name and CLI=\"name\" options cause\
    \ the extra computation. However, the confidence limits are not displayed by the\
    \ regression plot. Instead, you must use the dependent plot statement"
  merge: -1
