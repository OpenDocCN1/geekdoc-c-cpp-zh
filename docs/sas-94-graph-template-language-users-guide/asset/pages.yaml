    # Using SAS Formats


    SAS formats can be assigned to input columns with the FORMAT statement of the
    SGREENDER procedure. Also, several GTL statement options enable a SAS format as
    an option value. Examples include the TICKVALUEFORMAT= option for formatting axis
    tick values, and the TIPFORMAT= option for formatting data tips.

    Not all SAS formats are supported in the GTL or with the SGPLOT, SGATTER, SGPanel,
    and SGREENDER procedures. The tables in the following sections show the character
    and numeric SAS formats that are not supported.

    When the GTL encounters an unsupported format, a note similar to the following
    is written to the SAS log:


    ```

    TICKVALUEFORMAT>bestx. is invalid. The format is invalid or unsupported. The default
    will be used.

    ```


    # Unsupported Numeric Formats


    The following numeric formats are not supported in the GTL:


    | BESTD | BESTX | D | FLOAT | FRACT |

    | FREE | IB | IBR | IEEE | IEEER |

    | ODDSR | PCPIB | PD | PIB | PIBR |'
