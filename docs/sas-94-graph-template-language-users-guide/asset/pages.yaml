    # Introduction to Legend Management


    # Some of the Uses for a Legend


    A graphical legend provides a key to the marker symbols, lines, and other data
    elements that are displayed in a graph. Here are some of the situations where
    legends are useful:


    +   - when a plot contains grouped markers (scatter plots, for example)

    - when a plot contains lines that differ by color, marker symbol, or line pattern
    (series plots or step plots, for example)

    - when a plot contains one or more lines or bands that require identification
    or explanation'
