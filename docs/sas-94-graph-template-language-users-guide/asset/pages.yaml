    Note that adding gutters, you do not increase the size of the graph. Instead,
    the cells shrink to on the number of cells in the grid and the size of the gutters,
    you will frequently want to adjust the size of the graph to obtain optimal results,
    especially if the cells contain complex graphs. The issues of graph size and cell
    size are discussed in the following sections.


    # Graph Aspect Ratio


    The default graph size is 640 pixels in width and 480 pixels in height, which
    sets a default aspect ratio of 4:3 (640:480). Depending on your grid size, you
    might want to adjust the aspect ratio to improve the appearance of the panel.
    The following example uses three column by one row with the default aspect ratio:


    ```

    proc template;

    def statgraph onerow;

    beginraph;

    entrytitle "Yearly Profit for Sports Products";nlayout datapanel classvars=(product_group)
    / rows=1;

    layout prototype;

    barchart category=year response=profit / stat=sum;

    endlayout;

    endlayout;

    endgraph;

    end;

    run;

    ```


    ```

    proc sgrender data=sashelp.orsales template=onerow;

    where product_group in ("Golf" "Tennis" "Soccer");

    run;

    ```'
