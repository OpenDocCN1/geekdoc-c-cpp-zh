    entry halign-left="Mean" entry halign-left MEAN

    entry halign-left="Std Dev" entry halign-left STD

    endlayout;

    endgraph;

    ```


    +   The MVAR statement declares the macro variables that will be referenced in
    the template.


    +   The ENTTITLE statement specifies macro variable VAR as the argument on the
    COLNAME function, which returns the case-sensitive name of the column. The variable
    that you pass on the macro call will be displayed in the graph title.


    +   The HISTOGRAM and DENSITYPLOT statements specify macro variable VAR as their
    column arguments. Again, the variable name that you pass on the macro call will
    determine that column.


    +   The first LAYOUT GRIDD block constructs a title for the inset. Macro variable
    TEST, which will be initialized by the code in the macro, identifies the normality
    test that is applied to the data. As we will see later when we create the macro,
    either of normality tests will be used, depending on the number of observations
    that are read from the data. Macro variable TESTLABEL provides the probability
    statistics.


    +   The nested LAYOUT GRIDDED statement defines a two-column table for the statistics
    table that is displayed in the first inset. Macro variable STAT in the first column
    provides the normality value, and macro variables PTYPE and PVALUE provide the
    probability statistics. These macro variables will be initialized by the code
    in the macro body.'
