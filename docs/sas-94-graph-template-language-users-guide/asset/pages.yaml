    | CURVELABELSPLIT=TRUE | FALSE | Specifies whether the curve labels should be
    split into multiple lines, if necessary, to fit the label in the available space.
    |

    | CURVELABELSPLCHAR="character-list" | Specifies one or more characters on which
    the curve labels can be split. |

    | CURVELABELSPLITCHDROP=TRUE | FALSE | Specifies whether the splitter on which
    split occurs are removed from the displayed label. |

    | CURVELABELSPLITJUSTIFY="justification" | Specifies how each line of the split
    curve labels is to be justified. |

    | VALUEFITPOLICY="fit-policy" | Specifies how block plot text values are adjusted
    to fit within the containing block. |

    | VALUESITCHCHAR="character-list" | Specifies one or more characters on which
    the block labels can be split when value splitting is used in a block plot. |

    | VALUESITCHDROP=TRUE | FALSE | Specifies whether the splitter on which split
    occurs are removed from the displayed block label when value splitting is used
    in a block plot. |


    For axis, options are available that enable you to split long labels into multiple
    lines to avoid truncation. The following table lists these options.


    | Option | Description |

    | --- | --- |

    | LABELFITPOLICY=AUTO | SPLIT | SPLITWAYS | Specifies a fit for the axis label.
    If the original label is too long, AUTO specifies that the short label is used
    instead (specified) and SPLIT specifies that the original label is split into
    multiple lines as needed to make it fit available. SPLITWAYS specifies that the
    original label is always split into multiple lines regardless of the available
    space. |

    | LABELSPLCHAR="character-list" | Specifies one or more characters on which the
    axis label can be split when the SPLIT or SPLITWAYS policy is used. |

    | LABELSPLITCHDROP=TRUE | FALSE | Specifies whether the split characters on which
    a split occurs are removed from the displayed axis label when the SPLIT or SPLITWAYS
    fit policy is used. |

    | LABELSPLITCHJUSTIFY="justification" | Specifies how each line of the split axis
    label is to be justified when the SPLIT or SPLITWAYS fit policy is used. |'
