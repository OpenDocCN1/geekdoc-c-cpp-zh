  md: '# 14 Chapter 2 • Quick Start


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_23_0.png)


    The LAYOUT OVERLAY statement and its matching END statement define the type of
    graphical layout to be used. The OVERLAY contains the contents to be overlaid.
    It manages the plots and queries contained all plots to decide the axis types,
    axis labels, and axis ranges.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_23_1.png)


    The SCATTERPLOT and REGRESSIONPLOT statements specify Height for the X variable
    and Weight for the Y variable. For the regression, X is always used for the independent
    variable and Y for the dependent variable. By default, a linear regression is
    used.


    For more information about the types of layouts and plots in GTL, see Chapter
    3, “Overview of Basic Statements and Options,” on page 21.


    # Compiling the Template


    When you submit your PROC TEMPLATE statements, the syntax is like:


    | Log - Untitled |

    |---||

    | 12 | proc template; |

    | 13 | define statgraph modelfit; |

    | 14 | begining; |

    | 15 | entrentitle "Regression Fit Plot"; |

    | 16 | layout overlay; |

    | 17 | scatterplot x=height y=weight; |

    | 18 | regressionplot x=height y=weight; |

    | 19 | endout; |

    | 20 | endgraph; |

    | 21 | end; |

    | 22 | run; |

    | 23 | NOTE: STATGRAPH ''Modelfit'' has been saved to: SASUSER.TEMPLAT |

    | 24 | NOTE: PROCEDURE TEMPLATE used (Total process time): |

    | 25 | real time 0.01 seconds |


    If no syntax error occurs, a compiled template MODELFIT is created and stored
    physically in the Sasuser.Templ item by default. This item is chosen by default
    because it is the first item that can be updated in the current ODS path.'
