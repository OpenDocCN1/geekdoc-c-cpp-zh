    headers for a lattice layout. The complete code for this example is shown in “Defining
    a Lattice with Additional Features” on page 240.


    ```

    rowheaders;

    layout gridded / columns=2;

    entry "Volume" / textattrrs=GraphLabelText rotate=90 ;

    entry "Millions of Shares" / textattrs=GraphValueText rotate=90 ;

    endlayout;

    layout gridded / columns=2;

