  md: '# Adding Graphics Elements to Your Graph 409


    | To Draw this Type of Graphics Element | Use this GTL Statement or Block |

    |--- |--- |

    | An oval or circle | DRAWOVAL |

    | A square or rectangle | DRAWRECTANGLE |

    | A polyline | DRAW statements within a BEGINPOLYLINE block |

    | A polygon | DRAW statements within a BEGINPOLYGON block |

    | An image | DRAWIMAGE |


    This guide provides an overview of how to use these statements. For detailed information
    about these statements, SAS Graph Template Language: Reference.


    # Adding Text


    Use a DRAWTEXT statement to add a text to your graph. The basic syntax is as follows:


    ```

    DRAWTEXT <TEXTATTRS=(text-options)> "text" / X=x Y=y <options>

    ```


    In Your DRAWTEXT statement, specify in "text" the text that you want to appear
    in your text element. You must enclose the text in quotation marks. If you want
    to change any attributes of the text such as the font family, font size, or font
    color, include the necessary options in the TEXTATTRS=option in the DRAWTEXT statement.


    > Note: The TEXTATTRS=option must be placed before "text" in the DRAWTEXT statement.


    Use the X and Y= options in the DRAWTEXT statement to specify the coordinates
    where you want to place the text. By default, the coordinate units are GRAPHPOINT,
    and the text element is anchored on its center point at the specified coordinates.
    In options, , you can include the DRAWSPACE=option or the XSPACE= and YSPACE=
    options to specify different units, and the ANCHOR= option to change the anchor
    point.


    If you want to wrap within a specified area, include the WIDTH= option in options
    . The WIDTH option specifies the maximum width of the text area in PERCENT units
    by default. You can include the WIDTHTHUN= option to specify PIXEL or DATA units.
    If you want to add a border around your text, include the BORDER and the BORDERATTRS=
    options in options.


    Here is an example of a DRAWTEXT statement that adds a 120-pixel-width text block
    with a gray border.


    ```

    drawtext "A text that contains more than one line of text" /

    x=100 y=70 drawspace=graphpixel

    width=120 widthunit=pixel

    anchor=left

    border=true borderattrs=(color=gray pattern=1);

    ```


    The X and Y= option specifies the coordinates of the anchor point as (100, 70)
    in GRAPHpixel. The ANCHOR= option specifies the text to be anchored at the LEFT
    anchor point as shown in the following figure. The WIDTH= and WIDTHTHUN= option
    specify the maximum width of the text block as 120 pixels.'
  merge: -1
