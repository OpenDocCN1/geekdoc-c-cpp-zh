    ```

    layout overlay;

    scatterplot yweight=x=height / group=sex;

    loessplot yweight=x=height;

    entry halignright="Loess" / valign=bottom;

    endlayout;

    ```


    ```

    /* legend define cells 6 */

    discretelegend "scatter" / title="Sex"

