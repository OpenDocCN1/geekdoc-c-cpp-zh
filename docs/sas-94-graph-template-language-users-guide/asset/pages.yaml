    ![](img/a9ccb6123dee40d424cb295a3a99c16c_221_0.png)


    In this case, each plot statement is considered independent and is placed in a
    separate cell. When no grid size is provided, the default layout creates a graph
    with one column of cells, and it allots each cell the same amount of space. The
    number of rows in the grid is determined by the number and arrangement of stand-alone
    plot statements and nested layouts in the GRIDED layout block.


    # Defining a Basic Grid


    Although you can generate a nice looking graph in a default GRIDED layout, in
    most cases you will want more control over the grid, how it is populated, and
    the complexity of the cell contents.


    # Setting Grid Dimensions


    Assume you want a grid of five plots. Before starting to write code, you must
    first decide what grid dimensions you want to set (how many columns and rows)
    and whether you want to permit an empty cell in the grid. If you do not want an
    empty cell, you must limit the grid to five cells, which gives you two choices
    for the grid dimensions: five columns by one row (5x1), or one column by five
    rows (1x5).'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Defining a Grid 213


    To specify the grid size, you use the COLUMNS= or ROWS= option in the LAYOUT GRIDD
    statement. To use ROWS=, you must also specify ORDER=COLUMNMAJOR.


    Two explicit specifications could be used to create the following grid, which
    contains one row and five columns:


    | | | | | |

    |---|---|---|---|---|


    ```

    layout gridded / columns=5;

    /* plot defitions */

    endlayout;

    ```


    When the number of columns is specified, you place a limit on how many columns
    can be displayed across a row. The COLUMNS= option is honored only if ORDER=ROWMAJOR
    (the default).


    In the example code to the left, if you were to include more than five plot definitions,
    additional rows (with five columns) would be added automatically to accommodate
    all of the cells that need to display all plot definitions.


    ```

    layout gridded / order=columnmajor

    /* plot defitions */

    endlayout;

    ```


    When the number of rows is specified, you place a limit on how many rows can be
    displayed a column. The ROWS= option is honored only if ORDER=COLUMNMAJOR.


    In the example code to the left, if you were to include more than five plot definitions,
    but the grid would be added automatically, the grid would not wrap to a second
    row because the ROWS= setting limits the grid to a single row.


    If you are willing to have an empty cell in the grid, you could use a 2x3 or a
    3x2 grid:


    ```

    layout gridded / columns=3;

    endlayout;

    ```


    | | | |

    |---|---|--|

    | | | |

    | | | =


    By default, the layout uses the ORDER=ROWMAJOR setting to populate grid cells.
    This specification essentially means "fill in all cells in the top row (starting
    at the top left) and then continue to the next row." COLUMNS=1 by default then
    you must specify an alternative setting to increase the number of columns in the
    grid:


    ```

    layout gridded / columns=3;

    /* plot1 definition */

    /* plot2 definition */

    /* plot3 definition */

    /* plot4 definition */

    /* plot5 definition */

    endlayout;

    ```'
  merge: -1
  pgno: 222
- img_proc: true
