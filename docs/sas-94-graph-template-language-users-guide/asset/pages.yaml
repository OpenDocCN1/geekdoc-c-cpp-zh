  md: '# 158 Chapter 7 • Adding and Changing Text in a Graph


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_167_0.png)


    The following options, available on plot and legend statements, manage most of
    the text that you can add to a graph:


    | Task | Statement | Option |

    | --- | --- | --- |

    | label data points | plot statements that display markers | DATALABEL=column
    |

    | label a curve or a reference line | plot statements that display lines | CURVELABEL="string"
    | column |

    | describe a plot in a legend | most plot statements | LEGENDLABEL="string" |

    | add title to a legend | legend statements | TITLE="string" |

    | label an axis | axis statement or layout axis option | LABEL="string" |


    The GTL also provides the following text statements that can be used to add custom
    information about the graph analysis or the graph display. This text is independent
    of the text that is managed by the options on plot and legend statements:


    +   - ENTRYTITLE "string" Defines title text for the entire graph.

    - ENTRYFOOTNOTE "string" Defines footnote text for the entire graph.

    - ENTRY "string" Defines text that is displayed in the graphical area.'
