    We make the following changes:


    +   - Assign a new style that identifies STATISTICAL as its parent style. It is
    recommended that you create a new style of a different name so that access to
    the existing style is not blocked. See discussion under "Controlling ODS Search
    Paths" on page 397.

    - Change the Fonts style element (affects tables) that it uses Serif fonts.

    - Change the GraphFonts style element (affects graphs) that it uses Serif fonts.

    - Two elements govern fonts in a style: the Fonts element governs tables, and
    the GraphFonts element governs graphs. When changing fonts in a style, be sure
    to make consistent changes to both elements. In this case, we want to change from
    a sans-serif font to a serif font. You can also change font size, width, and style.


    In style templates, the name of a font family normally appears as a quoted string.
    When a name appears between less and greater symbols, such as `<serif>`, it means
    that the font family sans-serif is defined in the SAS Registry. For the Windows
    Release of SAS, some of the registry keys and values that are stored under ODS
    Fonts:


    # Display 18.1 Registry Keys and Values for the Windows Release of SAS


    | SAS Registry | Contents of ''FONTS'' | Data |

    |---|---|---|

    | APPLICATIONCLASS | dings | "Wingings" |

    | COLNAMES | monospace | "Courier New" |

    | CORE | MTfonts | "Monotype Arial" |

    | ODS | MTmonospace | "Cumberland AMT" |

    | DESTINATIONS | MTsans-serif | "Arial AMT" |

    | DMS | MTsans-serif-unicode | "Monotype WT J" |

    | FONTS | MTserif | "Thornealde" |

    | GUI | MTserif-unicode | "Thornealde Duospace WT J" |

    | ICONS | MTsymbol | "Symbol MT" |

    | ODS GRAPHICS | sans-serif | "Arial" |

    | PRODUCTS | | |


    The registry definition of MTsans-serif and MTserif refer to TrueType fonts that
    are shipped with SAS and are similar to "Arial" and "Times New Roman". "MT fonts
    (for Monotype) can be used on any computer where SAS is installed. A specific
    font family such as "Verdana" could be used instead. Note that fonts are normally
    listed in a "most-specific" to a "most generic" so that reasonable substitution
    can be made when a font cannot be located on the current computer.


    Notice that several graph fonts affect different parts of a graph. The following
    table shows some but not all features that are affected by the graph fonts:


    GraphTitleFont Used for all titles of the graph. Typically, this is the largest.'
