  md: '# Marker Options


    When specifying the attributes for a data marker, the available marker-options
    can be any one or more of the following. The options must be enclosed in parentheses,
    and each option is specified as a *name = value pair*. In all cases, the color
    can be a style-reference in the form *style-element:style-attribute*.


    **COLOR=style-reference | color**

    specifies the color of the marker. If you use a style-reference, the style-attribute
    should be a valid attribute such as COLOR, CONTRASTCOLOR, STARTCOLOR, NEUTRAL,
    END. The convention is to use CONTRASTCOLOR for markers. For grouped data, this
    option keeps all markers the same color and the marker symbol alone distinguishes
    the groups.


    If you use a color, SAS accepts color names, RED, or color codes, such as CXF000
    or #FF000. Color names must not exceed 64 characters. Color codes must not exceed
    8 characters and must be in a valid SAS color-naming scheme, such as RGB, CMYK,
    HLS, or HSV (HSB).


    **SIZE=style-reference | dimension**

    specifies the marker size (both width and height). If you use a style-reference,
    the style-attribute should be MARKERSIZE.


    **SYMBOL=style-reference | marker-name**

    specifies the name of the marker. If you use a style-reference, the style-attribute
    should be MARKERSMBOL. The following symbols are supported:


    | ↓Down | Ibeam | ▷TriangleLeft | HomeDownFilled |

    | *Asterisk | + Plus | ▷TriangleRight | SquareFilled |

    | ○ Circle | □ Square | ○ Union | ★StarFilled |

    | ◊ Diamond | ☆ Star | × X | ▲ TriangleFilled |

    | > GreaterThan | ⊢ Tack | Y Y | ▼ TriangleDownFilled |

    | < LessThan | ⊓ Tide | Z Z |  TriangleLeftFilled |

    | # Hash | △ Triangle | ○ CircleFilled | ▶ TriangleRightFilled |

    | 🏠 HomeDown | ▽ TriangleDown | ◇ DiamondFilled


    **TRANSPARENCY=number**

    specifies the degree of transparency for the plot markers.


    The transparency that is specified by the DATRANSPARENCY=option, which is 0 by
    default.


    +   Default

    Interaction  This subplot overrides the DATRANSPARENCY=option for the plot markers
    only.


    Range 0 (opaque) to 1 (entirely transparent)


    **WEIGHT=NORMAL | BOLD**

    specifies the marker weight.'
