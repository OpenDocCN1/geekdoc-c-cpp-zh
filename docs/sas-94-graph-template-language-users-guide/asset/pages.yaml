  md: 'ENTRY Statements: Additional Control 171


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_180_0.png)


    Whenever you add text within the graph wall, you have to consider the possibility
    that the text might appear on top of or behind data markers and plot lines. For
    this reason, you should consider the AUTOALIGN= option rather than the HALIGN=
    and VALIGN= options for positioning the text.


    The AUTOALIGN= option enables you to set a priority list that restricts the entry
    to certain locations. The priority list can include any of the keywords TOPLEFT,
    TOPRIGHT, LEFT, CENTER, RIGHT, BOTTOMLEFT, BOTTOM, and BOTTOMRIGHT.


    In the following histogram, we know that the best location for an entry is either
    TOPLEFT or TOPRIGHT, depending on the skew of the data. With the following coding,
    if the data were skewed to the right so that the entry text overlaps with the
    histogram, the text would automatically appear at TOPLEFT.


    ```

    layout overlay;

    histogram weight;

    entry "NOBS = 19"

    autoalign=(topright toleft)

    border=true;

    bleday;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_180_1.png)


    When the parent layout contains only scatter plots, the ENTRY statement can use
    the AUTOALIGN=AUTO setting to automatically position the text where it is the
    farthest from any scatter points. In all cases, one like the following example
    where many positions are available that minimize data collision, the AUTO specification
    selects the position for you and you have no further control over the text position.


    ```

    layout overlay;

    scatterplotplot x=height y=weight;

    entry halign=left "NOBS = 19" /\nautoalign=auto border=true;

    ```'
