  md: '# Default Axis Construction and Related Options 71


    Example: For the following layout block, the first SERIESPLOT is considered primary.
    If the Quarter column is numeric and has a date format, the X-axis type is TIME.
    If the column is numeric, but does not have a date format, then the axis type
    is LINEAR. If the column is character, then the axis type is DISCRETE.


    ```

    layout overlay;

    seriesplot x-quarter y=predictedSales;

    seriesplot x-quarter y=actualSales;

    endoverlay;

    ```


    Example: For the following layout block, the X-axis is DISCRETE because it was
    declared to be DISCRETE and does not contradict any internal decision about axis
    type because SERIESPLOT and BARCHART support a discrete axis. It does not matter
    whether X is a numeric or character.


    ```

    layout overlay / xaxis=(type=discrete);

    seriesplot x-quarter y=predictedSales;

    barchart      category=quarter response=actualSales;

    endoverlay;

    ```


    Example: For the following layout block, the SERIESPLOT is the primary plot. If
    Quarter a character column, a discrete axis is used and the overlay is successful.
    However, if Quarter is a numeric column, then a TIME or LINE axis is used, the
    BARCHART overlay fails, and a message is written to the log.


    ```

    layout overlay;

    seriesplot x-quarter y=predictedSales;

    barchart      category=quarter response=actualSales;

    endoverlay;

    ```


    > WARNING: BARCHART statement has a conflict with the axis type. The plot will
    not be drawn.


    # Apply Axis Options


    Each of the four axes (X, Y, X2, Y2) can be managed with a set of options to apply
    to any type. In addition, option bundles are available for managing each specific
    type. For example, the following syntax shows the option bundles that are available
    on the LAYOUT OVERLAY statement''s XAXISOPTS:


    ```

    LAYOUT OVERLAY < XAXISOPTS=(general-options) LINEAROPTS=(options) DISCRETEOPTS=(options)
    TIMEOPTS=(options) LOGOPTS=(options) >;

    ```


    These bundles are available for the other axes using the LAYOUT OVERLAY options:


    ```

    YAXISOPTS=(same-as-xaxisopts)

    Y2AXISOPTS=(same-as-xaxisopts)

    X2AXISOPTS=(same-as-xaxisopts)

    ```


    You can specify any type-specific option bundles as want, but only the bundle
    that corresponds to the axis type is used for a template execution.


    # Determine Axis Data Range


    After the type of axis is determined in the layout, the data ranges of all plot
    statements that contribute to an axis are compared. For LINEAR, TIME, and LOG
    axes, the minimum of all minimum values and the maximum of all maximum values
    are'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'derived from a "unioned" data range. For a DISCRETE axis, the data range is
    the set of all unique values from the sets of all values. The VIEWMIN= and VIEWMAX=
    options for LINEAR, TIME, and LOG axes can be used to change the displayed range.
    For examples, see "LINEAR Axes" on page 84, "Time Axes" on page 97, and "LOG Axes"
    on page 102.


    # Determine Axis Label


    # How Axis Labels Are Determined


    The default axis label is determined by the primary plot. If a label is associated
    with the data column, the label is used. If no column label is assigned, the column
    name is used for the axis label. Each set of axis options provides LABEL= and
    SHORTLABEL= options that can be used to change the axis label. By default, the
    font characteristics of the label are set by the current style, and the plot statement''s
    LABELATTRS= option can be used to change the font characteristics. See "Axis Appearance
    Controlled by the Current Style" on page 109. The following examples show how
    axis labels are determined and how to set an axis label.


    Consider the following data set, which contains information about bacteria and
    virus growth:


    ```

    data growth;

    hours=1 to 15 by .5;

    bacteria=100**10**(sqrt(hours));

    virus=100**10**(log(hours));

    label bacteria="Bacteria Growth" virus="Virus Growth";

    output;

    end;

    ```


    To plot the trend for both Bacteria and Virus in the same graph, we can use a
    simple overlay of series of plots. Whenever two or more columns are mapped to
    the axis, the primary plot determines the axis label. In the following example,
    the first SERIESPLOT is primary by default, so its columns determine the axis
    labels. In this case, the Y-axis label is determined by the BACTERIA column.


    ```

    layout overlay / cycleatrs=true;

    seriesplot x=Hours y=Bacteria/curvelabel="Bacteria";

    seriesplot x=Hours y=Virus/curvelabel="Virus";

    endlayout;

    ```


