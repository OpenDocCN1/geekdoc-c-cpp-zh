    ```

    entry halign-left="Mean" halign-right="119.96"

    entry halign-left="Std Dev" halign-right="19.98"

    endlayout;

    ```


    Another technique is to create the table with two columns and three rows. This
    approach places each statistic name and value in its own cell. Although this technique
    requires six ENTRY statements, it is a more flexible arrangement because each
    column alignment can be set independently. The following example left-justifies
    the text for each ENTRY statement:


    | N | 5203 |

    | Mean | 119.96 |

    | Std Dev | 19.98 |


    ```

    layout grilled / columns=2 order=rowmajor=true;

    /* row 1 */

    entry halign-left="N"

    entry halign-left="5203"

    /* row 2 */

    entry halign-left="Mean"

    entry halign-left="119.96"

    /* row 3 */

    entry halign-left="Std Dev"

    entry halign-left="19.98"

    endlayout;ORDER-MAJOR means that cells are populated horizontally, starting from
    column 1, followed by column 2, and advancing to the next row. You should order
    the ENTRY statements as shown. Add additional rows to the table, just add additional
    paragraphs of ENTRY statements.

    ```


    Of course, the LAYOUT GRLED statement allows you to organize cells by column,
    so you can achieve this effect with ORDER=COLUMNMAJOR. The code fragment formats
    the cells vertically by populating the first cell in row 1, followed by the first
    cell in row 2, followed by the first cell in row 3, and advancing to the next
    column.


    ```

    layout grilled / rows=3 order=columnmajor=true;

    /* column 1 */

    entry halign-left="N"

    entry halign-left="Mean"

    entry halign-left="Std Dev"

    /* column 2 */

    entry halign-left="5203"

    entry halign-left="119.96"

    entry halign-left="19.98"

    endlayout;

    ```


    In both cases, an HALIGN-LEFT option was added to each ENTRY statement to left-justify
    its text (the default is HALIGN-CENTER). Note that the column widths in the table
    are determined by the longest text string in each column on a per basis.


    The following example illustrates how to change the column justification and add
    extra space between the columns with the COLMNGUTTER= option. Borders have been
    added to the ENTRY statements to show the text boundaries and alignment. Although
    it'
