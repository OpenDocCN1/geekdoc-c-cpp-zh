    Note: The XSPACE=, YSPACE=, XSPACE=, YSPACE=, X2SPACE, and Y2SPACE= options override
    the DRAWSPACE option.


    # How the Graphics Elements Are Anchored


    When you specify the X and Y coordinates for a graphics element, the element is
    drawn from an anchor point that is fixed in the drawing area at the X and Y coordinates
    you specify. For lines and arrows, the anchor point is the starting point of the
    line or arrow, which is specified with the X1 and Y1 options on the draw statement.
    For elements that have height and width, the anchor point can be one of the points
    shown in the following figure.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_417_0.png)


    By default, the anchor point is CENTER. You can use the ANCHOR= option on the
    draw statements to change the anchor point of your graphics elements.


    Note: When you select the X and Y coordinates and the anchor point, make sure
    that when the graphics element is drawn, it does not extend beyond the boundaries
    of the drawing area. Any part of the element that is outside of the drawing area
    is clipped.


    # Adding Graphics Elements to Your Graph


    The Draw Statements


    The following table lists the GTL draw statement or statement block that you can
    use to draw each type of element.


    | To Draw this Type of Graphics Element | Use this GTL Statement or Block |

    |---|---|n| Text | DRAWTEXT |

    | An arrow | DRAWARROW |

    | A line | DRAWLINE |'
