    # How Plots Are Overlaid


    The following sections explain in more detail how the overlay process works and
    why some constructs might not generate the graph that you expect.


    # Statements Allowed in the Overlay Container


    +   - If you were to randomly place GTL statements within a LAYOUT OVERLAY block,
    you would often get compile errors. The following basic rules indicate which statements
    can be used within the layout:

    - all 2-D plot statements except SCATTERPLOTMATRIX

    - statements such as ENTRY, DISCRETELEGEND, and CONTINUOUSLEGEND

    - GRIDDED, LATTICE, REGION, and overlay-type layout blocks can be nested.

    However, the following restrictions apply:

    - 3-D plot statements cannot be included. Place these statements in a LAYOUTOVER3D
    block.

    - ENTRYTITLE or ENTRYFOOTNOTE statements cannot be included. Place these statements
    outside the outermost layout block.

    - Other layout types such as PROTOTYPE, DATALATTICE, and DATAPANEL layouts cannot
    be nested in an OVERLAY layout.


    # Restrictions on Allowed Statements


    Even among the statements that are valid within an OVERLAY layout, some restrictions
    apply to their use. For example, some dependent statements must be accompanied
    by at'
