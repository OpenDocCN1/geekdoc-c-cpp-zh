  md: '442 Chapter 21 Executing Graph Templates


    For a more complete discussion of this topic and additional examples, see Chapter
    14, “Using Dynamics and Macro Variables to Make Flexible Templates,” on page 327.


    # Managing the Output Data Object


    # Setting Labels and Formats for the Output Columns


    By default, the columns in the output data object derive variable attributes (name,
    type, and label) from the input variables. However, using the LABEL and FORMAT
    statements, you can change the label and format of the resulting output object
    column.


    The LABEL and FORMAT statements are available on PROC SGENDER and on the DATA
    step. The following example assigns labels to the HEIGHT and WEIGHT variables
    that are used in the MYGRAPHS.SCATTER template. It also assigns a format to the
    WEIGHT variable.


    ```

    proc sgender data=sashelp.class template=mygraphs.scatter;

    label height="Height in Inches" weight="Weight in Pounds";

    run;

    ```


    # Setting a Name and Label for the Output Data Object


    When the output data object is created, it is assigned a name and a label. The
    following table shows the default names and labels, depending on whether the corresponding
    GTL template is executed with a PROC SGENDER statement or a DATA step:


    | Option | Default Name with PROC SGENDER | Default Name with DATA Step |

    |---|---|---|

    | OBJECT=name | SGENDER | FilePrint (each execution of the DATA step increments
    the object name : FilePrint1, FilePrint2, and so on) |

    | OBJECTLABEL="string" | The SGENDER Procedure | same as object name |


    Using either PROC SGENDER or a DATA step, you can use the OBJECT= option to set
    a name for the output data object. You can use the OBJECTLABEL= option to set
    a descriptive label for the data object. The following example sets the object
    name and label on PROC SGENDER:


    ```

    /* Open ODS LISTING destination */

    ods_all_close;

    ods listing;


    /* set object name and label on PROC SGENDER */

    proc sgender data=sashelp.class template=mygraphs.scatter

    object=Scatter1

    objectlabel="Scatter Plot 1";


    run;

    ```'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# Managing the Output Data Object 443


    This next example sets the object name and label on a DATA step:


    ```

    /* set object name and label on a DATA step */

    data_null;

    set sashelp.class;

    file print _ods=( template="mygraphs.scatter*

    object=Scatter2

    objectlabel="Scatter Plot 2" );


    put _ods_

    run;

    ```


    # Viewing the Data Object Name and Label in the Results Window


    When a GTL template is executed, an ODS object is populated and bound to the template.
    The object is assigned a name, and name can be used to reference the object on
    various ODS statements, such as ODS SELECT, ODS EXCLUDE, and ODS OUTPUT. The data
    object is also assigned a label.


    Object names and labels appear in the Results window. To view them,


    +   1. Open the Results window if it is not already open (choose View ⇔ Properties)

    2. Right-click on the graph and choose Properties to view the object properties.


    The following figure shows the objects that were created in "Setting a Name and
    Label for the Output Data Object" on page 442. The Results window shows the two
    objects that were created, and the Scatter2 Properties window shows the properties
    for the second object, which was named Scatter2.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_452_0.png)


    # Setting a Name for the Output Image File


    By default, the output image file is assigned the same name as the output data
    object. You can use the IMAGENAME= option in the ODS GRAPHICS statement to assign
    an alternative name to the output image file. For example, the following code
    assigns the filename regfit_heightweight to the output image file:


    ```

    ods graphics imagename="regfit_heightweight";n

    proc sgender data=sashelp.class template=mygraphs.regfit;

    dynamic xvar="height" yvar="weight";

    ```'
