  md: '# Defining a Lattice with Additional Features 241


    **Figure 10.3** Stock Plot


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_250_0.png)


    # Transforming the Input Data


    A common use for a lattice is to create a graph that shows different subsets of
    the same input data. In some cases, those subsets are already defined in the input
    data. However, you frequently need to transform the input data to make it suitable
    for the graph that you are trying to create. This might require any or all of
    the following:


    +   * summarizing the data

    * transposing the data

    * scaling the data values

    * creating new variables that represent subsets of the data.


    The graph that is shown in Figure 10.3 on page 241 is based on data from Sashlep.stocks,
    which contains several years of monthly stock information for three companies.
    The data contains columns Stock, Date, Volume, and AdjClose (Adjusted Closing).
    However, it does not have the volume and price information in the format that
    is needed for the graph. The LATTICE layout does not support subsets of the input
    data on per-cell basis. So, in order to make the cell content different, unique
    variables must be created for each cell to provide the appropriate data, volume,
    and price information. The following DATA step performs the necessary data transformations.


    ```

    data stock;

    set sashlep.stocks;

    where eq "Microsoft" and year(date) in (2004 2005);

    format Date2004 Date2005 date;

    Price2004 Price2005 dollar$;

    label Date2004="2004" Date2005="2005";

    if (date) = 2004 then do;

    ```'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 242 Chapter 10 • Using an Advanced Multi-cell Layout


    ```

    Date2004=date;

    Vol2004=volume=10**-6;

    Price2004=adjclose;


    end;

    elelse if (date)=2005 then do

    Date2005=date;

    Vol2005=volume=10**-6;

    Price2005=adjclose;


    end;

    keep Date2004 Date2005 Vol2004

    Vol2005 Price2004 Price2005;

    ```


    The data is filtered for Microsoft and for the years 2004 and 2005. Next, new
    variables are created for each year and the Volume and Stock Price within each
    year. Because the volumes are large, they are scaled to medium. This scaling is
    not in the graph. This coding results in a "sparse" data, but it is the correct
    organization for the lattice observations with missing X or Y values are not plotted.


