  md: '# 416 Chapter 19 Adding Non-Data-Driven Graphics to a Graph


    The image file is specified as image-file.ext, which is an absolute or relative
    path to the image file on the system. The path must be enclosed in quotation marks,
    and must include the image filename and file extension, such as image.jpg or image.png.


    > Note: The image file must be accessible to the system. URL access is not supported.


    The X= and Y= options in the DRAWIMAGE statement specify the coordinates of the
    image anchor point. By default, the coordinate units are GRAPHPERCENT, and the
    image is anchored on its center point. You can include the DRAWSPACE= option,
    or the XSPACE= and YSPACE= options in options to specify different units. If you
    choose DATALVALUE as the units you want to scale the image to the secondary axis,
    you must also include the AXIS-X and AXIS-Y options. You can include the ANCHOR=
    to change the anchor point.


    You can use the HEIGHT= and WIDTH= options in the DRAWIMAGE statement to create
    a bounding box in which the image is drawn. The default units for the height and
    width are PERCENT. You can include the SIZEUNIT= option in options to specify
    PIXEL or DATA units instead. You can also include the SCALE= option to specify
    how the image is scaled within the bounding box. By default, the image is scaled
    to fit the box by height or width, or you can tile the image. If you want to draw
    a border around the image, you can include the BORDER=Y and BORDERATTR= options.


    Here is an example that adds the SAS logo at coordinates (70, 60) in GRAPHPI units.
    The image is anchored at the bottom left corner, and a black border is drawn around
    the image.


    ```

    drawimage "\images\saslogo.png" / x=70 y=60 drawspace=graphpixel anchor=bottomleft
    border=true borderatrs=(thickness=1px);

    ```


    The following figure shows how the image is placed on the graph.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_425_0.png)'
