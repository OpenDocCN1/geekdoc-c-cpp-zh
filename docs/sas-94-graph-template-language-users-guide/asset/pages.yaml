  md: '# Chapter 4 • Using a Single-cell Layout


    same type (numeric, or all, or all time). In addition, the layout must verify
    that each plot can use the requested axis type(s). In this case, the first statement
    in the layout is a BARCHART. Statements such as BARCHART and BARCHARTPARM treat
    the CATEGORYcolumn as a categorical variable (regardless of data type) and build
    a DISCRETE statement in this example layout, it determines that the X axis is
    set to DISCRETE, and subsequent plots must be made with a discrete axis.


    Many computed plots, such as REGRESSIONPLOT, LOESSPLOT, and ELLIPSE, require both
    X and Y axes to be of LINEAR type, which is a standard numeric interval axis.
    If you specified a SCATTERPLOT instead of a REGRESSIONPLOT, there would be no
    problem because SCATTERPLOT can be displayed on either a DISCRETE or LINEAR X
    axis. The end result of this example is a graph containing only the box plots.


    In this example, the REGRESSIONPLOT and BARCHART have been switched:


    ```

    layout overlay;

    regressionplot x=age y=weight;

    barchart category=age response=weight;

    endlayout;

    ```


    > WARNING: BARCHART statement has a conflict with the axis type. The plot will
    not be drawn.


    In this case, the REGRESSIONPLOT (first plot) has fixed the type of the X axis
    to be LINEAR. The BARCHART is blocked because it needs a DISCRETE X axis. The
    end result of this example is a graph containing only the regression.


    Because a SCATTERPLOT can be included on either LINEAR or DISCRETE axes, you might
    think the following combination is valid:


    ```

    layout overlay;

    scatterplot x=age y=weight;

    barchart category=age response=weight;

    endlayout;

    ```


    > WARNING: BARCHART statement has a conflict with the axis type. The plot will
    not be drawn.


    In this case, the SCATTERPLOT (first statement) sets the X or Y axis type to LINEAR
    for the variable that is numeric—even though the data might be categorical in
    nature. However, if the variable is character, the SCATTERPLOT must use a DISCRETE
    axis. If you switch the statements, both plots are drawn after the X axis is fixed
    to DISCRETE, the SCATTERPLOT can display numeric values on a DISCRETE axis.


    When a character variable is used, the axis-type conflict does not arise. The
    following combination works regardless of statement order. In either case, the
    DISCRETE X axis will display a combination of AGE values with box plots above
    and SEX values with scatter points above.


    ```

    layout overlay;

    scatterplot x-sex y=weight;

    barchart category=age response=weight;

    endlayout;

    ```'
