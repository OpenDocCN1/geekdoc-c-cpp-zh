    # Creating Inset as a Table of Text


    Perhaps the most common use for an inset is to display a table of statistics within
    the graph. This section shows how to construct that type of basic table. Examples
    show how to make the contents of the table more dynamic and how to integrate the
    table into the graph.


    The basic technique for constructing the table is to place several ENTRY statements
    in a LAYOUT GRIDED block. Each ENTRY statement becomes a cell of the grid. ENTRY
    statement options and layout options are used to further organize the table.


    Suppose you want to create the following table of text:


    | N | 5203 |

    | Mean | 119.96 |

    | Std Dev | 19.98 |


    The simplest technique for creating the table is to construct a one-column, three-row
    table. The following example uses three ENTRY statements: one for each row in
    the table. The statistic name is left-justified in each row, and the statistic
    value is right-justified.


    ```

    layout gridded / columns=1 border=true;

    entry halign=left "N" halign=right "5203" ;

    ```


    * Asterisk'
