- img_proc: true
  md: '# Microsoft Stock Performance


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_256_0.png)


    The other strategy is to add to the row information. At first glance, it would
    seem that you could do this well by extending the axis label:


    ```

    rowaxes;

    rowaxis / griddisplay=on display=(tickvalues)

    label="Volume (Millions of Shares)";

    rowaxis / griddisplay=on display=(tickvalues)

    rowaxis / Price=(Adjusted Close)";

    endrowaxes;

    ```


    The problem is that the extra axis label text might not fit; depending on the
    text size and the graph size, the text might be truncated. The axis option SHORTLABEL="string"
    is available to handle truncation, but we want more, not alternate text, and there
    is no way to wrap the axis label to two lines. The solution is use row headers
    instead of specifying axis labels.


    # Using or Row Headers


    For the graph that is in Figure 10.5 on page 245, we want to explain that the
    axis scaling in the first row is in millions of shares, and that the prices in
    the second row represent an adjusted close value. The strategy that we used in
    "Adding Sidebars" on page 246 was to create an external legend that displays information.
    Another strategy that we can use to remove the label information from the row
    axes and introduce a ROWHEADERS block, as shown in the following code:


    ```

    rowaxes;

    rowaxis / griddisplay=on display=(tickvalues);

    rowaxis / griddisplay=on display=(tickvalues);

    endrowaxes;

    rowheaders;

    layout gridded / columns=1;

    entry "Volume" / textattrs=GraphLabelText;

    entry "Millions of Shares" / textattrs=GraphLabelText;

    ```'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# 248 Chapter 10 • Using an Advanced Multi-cell Layout


    endlayout;

    layout gridded / columns=1;

    entry "Price" / textattrs=GraphLabelText;

    entry "(Adjusted Close)\ / textattrs=GraphValueText;

    endlayout;

    endrowheaders;


    By nesting the ENTRY statements in the GRIDED layouts, we can have multiple lines
    of text split exactly where we want and in any text style we desire. Without the
    GRIDED layouts, only one ENTRY statement could be used per row.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_257_0.png)


    To allow more space for the plots, we can rotate the row header text to make it
    appear to be a row axis label. Notice that we must specify COLUMNS=2 for the GRIDED
    layouts.


    ```

    rowaxes;

    rowaxis / griddisplay-on display=(tickvalues);

    rowaxis / griddisplay-on display=(tickvalues);

    endrowaxes;


    rowheaders;

    layout gridded / columns=2;

    entry "Price" / textattrs=GraphLabelText rotate=90;

    entry "(Adjusted Close)" / textattrs=GraphValueText rotate=90;

    endlayout;

    layout gridded / columns=2;

    entry "Volume" / textattrs=GraphLabelText rotate=90;

    entry "(Millions of Shares)" / textattrs=GraphValueText rotate=90;

    endlayout;

    endrowheaders;

    ```'
