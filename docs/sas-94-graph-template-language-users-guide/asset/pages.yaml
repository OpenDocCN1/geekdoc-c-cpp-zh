    \ columnvar=origin rowvar=cylinders |\n| inset information | inset=(nobs mean)\
    \ |\n| bar chart data | category=type response=mean |\n\nThe INSET=(Nobs Mean)\
    \ Option in this template is used to reference input data columns that are named\
    \ Nobs Mean. When the graph is rendered, the values that are stored in these columns\
    \ are displayed in the inset. In the inset display in this example, one row is\
    \ displayed for each column that is listed in the INSET=option, and each row has\
    \ two columns. The left column shows the column name (column label, if it is defined\
    \ in the data), and the right column contains the column value for that particular\
    \ cell of the inset. The number of values for these columns should match the number\
    \ of cells in the classification panel and the order of the values should correspond\
    \ with the sequence in which the cells are populated. The DATASEME=MATCHED subset\
    \ in the INSERTOPTS=option list specifies that the match-merging data scheme was\
    \ used to merge the inset and analytic data.\n\nThis template also adds a maximum\
