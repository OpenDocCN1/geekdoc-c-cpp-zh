  md: '# 292 Chapter 11 Using Classification Classifications


    ```

    layout prototype;

    bandplot x-days limitupper=uclm limitlower=lclm name="clm"

    display=(fill) fillattrs=GraphConfidence

    legendlabel="95% Confidence Limits";nbandplot x-days limitupper=ucl / name="cli"

    display=(outline) outlineattrs=GraphPredictionLimits

    legendlabel="95% Prediction Limits";nseriesplot x-days predicted / name="cls"

    lineatrs=graphFit legendlabel="Fit"

    scatterplot x-days response / primary=true

    markerattrs=(size=5px) datatransparency=.5;

    endlayout;

    sidebar / align=top;

    entry "Predicted Response to Dosage (mg) over Time /"

    textattrs=GraphTitleText pad=(bottom=10px);

    endsidebar;

    sidebar / align=bottom;

    discretelegend reg="clm" / axis=3;

    endsidebar;

    endlayout;

    endgraph;

    end;

    run;

    ```


    The following procedure code creates the required data set for the template. It
    uses a BY statement with the procedure to request the classification variable
    that is used in the panel.


    ```

    data trial;

    dose Dose=100 to 300 by 100;

    do Days=1 to 30;

    do Subject=1 to 10;

    Response=log(days)*(400-dose)* .01*ranuni (1) + 50;

    output;

    end;

    end;

    end;

    run;

    proc glm data=trial alpha=.05 noprint;

    by dose;

    model response=days / p clm;

    output out=stats

    lcl=lcl ucm=ucl

    lcl=lcl uci=ucl

    predicted-predicted;

    quit;

    ```


    ```

    ods html style=statistical;

    proc sgrender data=stats template=dosepanel;

    run;

    ```


    The advantage of using a procedure to generate the data is that the statistical
    procedures provide many options for controlling the model. A robust model enhances
    the output data set and therefore benefits the graph.'
