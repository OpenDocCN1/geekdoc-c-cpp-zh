    # Missing Values


    By default, missing values are included in the classification levels for the panel.
    When the data contains missing classification values, cells are created in the
    panel for the missing classes. The classification headers for the missing values
    are either blank for string values or a dot for missing numeric values. You can
    use the INCLUDEMISSINGCLASS=FALSE option to ignore the missing values. If you
    prefer to keep the missing values, you can create a format that specifies more
    meaningful headings for the missing classes. Here is an example that creates a
    format for missing product name and branch number classes.


    ```

    proc format;

    ```'
