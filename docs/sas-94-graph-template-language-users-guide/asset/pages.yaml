    ![](img/a9ccb6123dee40d424cb295a3a99c16c_278_0.png)


    For graph templates that are intended for repeated use (like the ones that are
    part of other SAS products), the effort has been made to set the CELLWIDTHMIN=
    to the smallest values that produce a reasonable panel. Other strategies produce
    smaller cells without truncating text or resulting in unwanted side effects. For
    example, you can change the orientation of the prototype layout.'
