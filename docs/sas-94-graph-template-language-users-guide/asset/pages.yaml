  md: '# Adding Observations for Arrows and Lines


    To add an arrow or line to your annotation data set, you must specify, at a minimum,
    ARROW or LINE in the Function column, coordinates of the arrow or line ending
    point. For an arrow, by default, the arrowhead shape is OPEN and the arrow direction
    is OUT. You can add the Shape and Direction columns to your observation to specify
    different values. You can add columns to specify other attributes of the arrow
    such as arrowhead scale, line pattern, line thickness, and so on. For information
    about other columns that you can add, see "ARROW Function" in SAS ODS Graphics:
    Procedures Guide.


    Here is an example of a DATA step that creates an observation for an arrow annotation.


    ```

    data rowdata;

    function="arrow"

    space="graphpixel"

    x1=60; y1=70; x2=190; y2=70;

    shape="barbed"; scale=2; direction="both"

    linepattern="shortdash"; linethickness=1;

    run;

    ```


    Here is a list of the observation.


    | Obs | function | drawspace | x1 | y1 | x2 | y2 | shape | scale |

    |---|---|---|---|---|---|---|---||

    | 1 | arrow | | 60 | 70 | 190 | 70 | barbed | 2 |

    | Obs | direction | | | | | | | |

    | | both | | shortdash | | 1 | | |


    In this observation, the Function column specifies ARROW for an arrow annotation.
    The DrawSpace column specifies that coordinates are expressed in graph-area pixels.
    The X1 and Y1 columns specify the starting location as 60 on the X axis and 70
    on the Y axis. The X2 and Y2 columns specify the arrow ending location as 190
    on the X axis and 70 on the Y axis. The Shape and Scale columns specify the shape
    and size of the arrowheads. The Direction column specifies the direction as BOTH.
    The LinePattern and LineThickness columns specify the arrow line as a 2-pixel-wide
    short-dashed line.


    Here is how the annotation is placed in a graph.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_429_0.png)


    An observation for a line is similar to that of an arrow. At a minimum, you must
    specify LINE in the Function column, the line starting coordinates and ending
    coordinates. You can add other columns to specify different attributes of the
    line, such as color, pattern, and thickness. For information about other columns
    that you can add, see “LINE Function” in SAS ODS Graphics: Procedures Guide.'
