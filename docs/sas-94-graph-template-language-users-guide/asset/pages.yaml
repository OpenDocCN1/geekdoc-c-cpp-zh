- img_proc: true
  md: "# Common Tasks 471\n\n+   - Add a column that contains the URL of each link\
    \ to the data set for the drill-down graph.\n\n+   - Use the URL=eq option in\
    \ the plot statement to specify the data column that contains the link URLs.\n\
    \n+   - Enable image mapping in ODS Graphics by using theAGEMAP=ON option in the\
    \ ODS GRAPHICS statement.\n\n+   - Write the output to the ODS HTML destination.\n\
    \nFor example, the drill-down pie chart in the previous example, you must complete\
    \ the following steps:\n\n+   1. Add the URLs for the supporting bar charts to\
    \ a character column in the data set for your main graph.\n\nNote: You must set\
    \ the column length appropriately for the expected URL values. If a URL value\
    \ exceeds the column length, the URL is truncated and the link does not work.\n\
    \n+   2. Create the template for the supporting charts.\n\n+   3. Generate the\
    \ supporting charts.\n\n+   4. Create the template for the main pie chart. In\
    \ the plot statement, include the URL=column-name option to specify the name of\
    \ the column in the data set that contains the drill-down link URLs.\n\n+   5.\
    \ Use the following statement to enable image mapping in ODS Graphics:\n graphics\
    \ / imagemap=on;\n\n+   6. Create the pie chart using the ODS HTML destination.\n\
    Note: In order to support the drill-down links, you must use the ODS HTML destination.\n\
    \n+   7. Use the following statement to disable image mapping in ODS Graphics:\n\
    raphics / imagemap=off;\n\nHere is the SAS code for this example.\n\n```\n* 1.\
