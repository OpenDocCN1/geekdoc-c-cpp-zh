    # Layout Containers


    Layout statements, a key feature of GTL, form “containers” that determine how
    the plots, legends and texts are drawn in the graph. GTL supports many different
    layout statements that are suitable for different usage. However, these statements
    fall into two categories:


    +   - Single-cell layouts that place the plots, legends, and entries in a common
    region. The statements are placed within this "overlay" containers are processed
    in order. Each plot is drawn on top of the previous plot, with the last one drawn
    on top. Chapter 4, “Using a Simple-cell Layout,” on page 45 and Chapter 12, “Using
    an Equated Layout,” on page 299.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Categories of Statements 33


    +   - Multi-cell layout statements, which partition the graph region into multiple
    smaller "cells." Each cell can be populated by an individual plot, an overlay,
    or a multi-cell layout. The layout of the "cells" is determined by the user, or
    by classification variables. See Chapter 9, "Using a Simple Multi-cell Layout,"
    on page 211, Chapter 10, "Using an Advanced Multi-cell Layout," on page 225, and
    Chapter 11, "Using Classification Panels," on page 257.


    Layout blocks always begin with the LAYOUT keyword followed by a keyword indicating
    the purpose of the layout. All layout blocks end with an ENDLAYOUT statement.
    The following table summarizes the available layouts.


    | Layout (Description) | Allowed and Cells Produced | Comments | Example |

    | :--- | :--- | :--- | :--- |

    | OVERLAY (Single Cell) | 2-D One cell | General purpose layout for superimposing
    2-D plots. | ![image]() |

    | OVERLAYEQUATED (Single Cell) | 2-D One cell | Specialized OVERLAY with equated
    axes. | |

    | PROTOTYPE (Single Cell) | 2-D One cell | Specialized LAYOUT used only as child
    layout of DATAPANELICE. Only one plot computed or 2-D plots without expressions
    are allowed. | |

    | REGION (Single Cell) | 2-D One cell | Specialized LAYOUT used only for graphs
    that do not have an axis, such as a PIECHART. Only one statement can be used at
    a time, but other statements such as legends, entries and nested layouts can be.
    | |

    | OVERLAY3D (Single Cell) | 3-D One cell | General purpose 3-D layout for superimposing
    3-D plots. | ![image]() |

    | LATTICE (Advanced Multi-cell) | 2-D or 3-D One or more cells | All cells must
    be predefined. Axes can be shared across columns or rows, and they can be external
    to the grid. Many grid labeling and alignment features. | ![image]() |

    | GRIDDED (Simple Multi-cell) | 2-D or 3-D One or more cells | All cells must
    be predefined. Axes independent for each cell. Very simple multi-cell container.
    | |'
