    # About the Single-Cell Layouts


    The single-cell layouts provide a container for a single-cell 2-D graph. These
    containers are created with the following statements:


    +   * LAYOUT REGION

    creates a single-cell graph container in which you can draw a single graph. The
    container supports only graphs that do not have axes, such as pie charts. For
    information about the LAYOUT REGION statement, see "The LAYOUT REGION Statement"
    on page 59.


    +   * LAYOUT OVEREQUATED

    creates a single-cell container in which you can overlay the results of multiple
    graph statements into a single axis area. Each graph is drawn in a separate layer
    in the order in which its graph statement occurs in the layout block. The last
    graph in the block is drawn on the top layer. The axes of this layout always have
    equal size units. For information about the LAYOUT OVEREQUATED statement, see
    "The LAYOUT OVEREQUATED Statement" on page 209.'
  merge: -1
