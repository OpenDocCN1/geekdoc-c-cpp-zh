- img_proc: true
  md: '# 446 Chapter 22 • Managing Graphical Output


    Three areas work in conjunction with each other to control all aspects of graph
    creation:


    | SAS Registry | Provides a repository of defaults for many options that affect
    ODS Graphics |

    | ODS Destination statement | Provides options specific to destinations, such
    as HTML, PDF, and RTF |

    | ODS GRAPHICS statement | Provides many global options that affect ODS graphics
    |


    You often need to add options to the ODS destination statement and the ODS GRAPHICS
    statement to get the desired output. Resetting SAS registry keys serves to configure
    your default ODS Graphics environment.


    # SAS Registry Settings for ODS Graphics


    The SAS Registry is a special SAS item store that is stored in your SASUSER storage
    location. It contains the defaults for many SAS products and their features. You
    can browse or edit this hierarchical file with PROC REGISTRY, or with the Registry
    Editor window. The window can be accessed with the global REGEDIT command from
    a Display manager. When you issue the command, the main Registry Editor window
    appears:


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_455_0.png)


    If you expand the ODS folder, you will see a subfolder for ODS GRAPHICS, which
    contains three registry keys.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_455_1.png)'
  merge: -1
  pgno: 455
- img_proc: true
  md: '# ODS Destination Statement Affecting ODS Graphics


    | Registry Key | Use |

    |--- |--- |

    | Default State | Determines whether the ODS Graphics environment is active by
    default |

    | Design Height | Determines the default height of a graph that is generated with
    GTL |

    | Design Width | Determines the default width of a graph that is generated with
    GTL |


    If you were to change the Default State from Off to On, it would make the ODS
    Environment active in every SAS session. This implies that if you run a procedure
    that normally requires you to activate the ODS Graphics environment with the ODS
    GRAPHICS ON statement; you would not have to issue this statement—ODS graphs would
    be automatically produced every time you run ODS graphics-enabled procedure such
    as UNIVARIATE, ARIMA, or REG.


    Note: The SAS procedures such as SGENDER, SGPLOT, SPANEL, and SGATTER only produce
    template-based graphs. Internally activate the ODS Graphics environment if it
    is not active and are unaffected by the Default State value.


    The Design Height and Design Width keys control the default graph size for all
    graph templates. The 640px by 480px size represents a 4/3 aspect ratio. If you
    change these values, any new or existing graph templates are affected unless you
    explicitly set a DESIGNWIDTH= or DESIGNHIGHT= option in the BEGINGRAPH statement
    in the graph template definition. For details, see “Controlling Graph Size” on
    page 455.


    # ODS Destination Statement Options Affecting ODS Graphics


    Each ODS destination has options that govern aspects of your ODS Graphics output.
    The following table shows the options for the most commonly used destinations.'
  merge: -1
  pgno: 456
