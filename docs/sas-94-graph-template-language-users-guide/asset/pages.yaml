- img_proc: true
  md: '# Prototype Orientation


    Rather generating a graph with the default row orientation, you can present the
    same information in a column-oriented format. To do so, you should change the
    design size and also changing the orientation of the prototype plot. Prototype
    plots with discrete axes often benefit from a horizontal orientation because the
    horizontal alignment can display discrete axis values without rotation or truncation
    (although it might eventually thin or stagger (the ticks). The following template
    code sets a horizontal orientation on a prototype graph.


    ```

    proc template;

    define statgraph onecol;

    beginraph(design/width=280px designheight=380px;

    entitle="Yearly Profit for Sports Products" classvars=(product_group) / columns=1

    layout datanel headerlabeldisplay=value

    cellwidth=85 cellheight=85;

    layout prototype;

    barchart category=year response=profit / stat=sum

    orient=horizontal;

    endlayout;

    endraph;

    endgraph;

    ```


    ```

    proc sgender data=sashelp.orsales template=onecol;

    where product_group in ("Golf" "Soccer");

    ```


