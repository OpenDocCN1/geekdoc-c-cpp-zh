  md: '# Features of Continuous Legends 209


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_218_0.png)


    # Scaling the Legend Values


    The EXTRACTSCALE= option enables you to extract a scale from the legend values
    to save space. By default, a named scale (millions, billions, and so on) is used
    for values of 999 trillion or less. A scientific notation scale (10n is used for
    values over 999 trillion. For large values, the scale factor is set to ensure
    that the absolute value of the largest value is greater than 1. For fractional
    values, the scale factor is set to ensure that the absolute value of the smallest
    value is greater than 1. EXTRACTSCALETYPE enables you to specify a scientific
    notation scale for values less than 999 trillion. The scale that is used is appended
    to the legend title.


    Note: You must specify a title for the legend in order to use this feature.


    For example, consider the legend in the following figure.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_218_1.png)


    Because of the fractional density values, the legend takes up a significant amount
    of space in the graph. To reduce the footprint of the legend, you can specify
    EXTRACTSCALE=TRUE to automatically scale the density values. You can also use
    the EXTRACTSCALETYPE= option to select the scale type. The following figure shows
    the result.'
