- img_proc: true
  md: 'Common Tasks 469


    # ## Scatter Plot with Custom Data Tips


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_478_0.png)


    ROLENAME=, TIP=, TIPLABEL= and TIPFORMAT= options are common to most plots in
    GTL.


    ROLENAME defines one or more name / value pairs as role-name = column-name, where
    column-name is some input data column that does not participate directly in the
    plot. In this example, we want the Name and Age values to show in the tip. Notice
    that the choice of role names is somewhat arbitrary. The TIP1 and TIP2 role names
    are assigned to the default roles X, Y, and GROUP.


    The TIP= defines a list of roles to be displayed, and it also determines their
    order in display. Notice that it is not necessary to request all default roles.
    It might be obvious from the legend that the GROUP role does not really need to
    be in the data tip, so in that case you would specify:


    ```

    tip=(tip2 X Y)

    ```


    For any role, the default label tip is 1) the data label, or 2) the name of the
    column that is associated with the role. If you use other label text displayed,
    the TIPLABEL=


    ```

    tiplabel=(tip="Student Name" group="Group")

    ```


    For any role, you can assign a format to the display of tip values.


    # ## Creating a Graph with Drill-Down Links


    For several types of plots, you can use the URL= option in the plot statement
    to add drill-down links to your graphs for HTML presentations. The following plot
    statements support the URL=option:


    +   BARCHART LINECHART SCATTERPLOT

    BARCHARTPARM MOSAICPLOTPARM SERIESPLOT

    BUBBLEPLOT NEEDLEPLOT STEPPLOT

    HEATMAPPARM PIECHART WATERFALLCHART'
