  md: '# Chapter 3 • Overview of Basic Statements and Options


    Examples:


    +   * This statement uses two keywords, no required arguments,

    and no options */

    LAYOUT OVERLAY;


    +   * This statement uses one keyword and two required arguments */

    SCATTERPLOT X-height weight;


    +   * This statement specifies a required argument.

    Required arguments do not have to be name-value pairs. */

    HISTOGRAM weight;


    +   * This statement uses one option.

    Options are specified after a slash (/) and are usually

    name-value pairs. */

    SCATTERPLOT X-height weight / GROUP=age;


    # Blocks


    A block is a pair of statements that indicate the beginning and end of a syntax
    unit. Typically, other statements are nested within the block. GTL has many specialized
    block constructs.


    Examples:


    +   * This is a valid block. No nested statements are required. */

    LAYOUT OVERLAY;

    ENDLAYOUT;


    +   * This block has no restrictions on the number of nested statements. */

    LAYOUT OVERLAY;

    SCATTERPLOT X-height weight;

    REGRESSIONPLOT X-height weight;

    ENDLAYOUT;


    +   * This block allows only nested ROWAX statements. */

    ROWAXES;

    ROWAXIS / LABEL="Row 1";

    ROWAXIS / LABEL="Row 2";

    ENDROWAXES;


    +   * Blocks support nested blocks */

    CELL;

    CELLHEADER;

    ENTRY "Cell 1";

    ENDCELLHEADER;

    LAYOUT OVERLAY;

    HISTOGRAM weight;

    DENSITYPLOT weight;

    ENDLAYOUT;

    ENDCELL;


    Whenever blocks are nested, there exists a "Parent - Child" relationship. In the
    previous example, the CELL block is the parent of the CELLHEADER block and LAYOUT
    OVERLAY block. This is important because most blocks have rules about statements
    they might contain, and they also have nesting restrictions. For example, a'
