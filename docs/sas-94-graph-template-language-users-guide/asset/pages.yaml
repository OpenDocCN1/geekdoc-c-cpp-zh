    # Subsetting Annotations


    By default, the ANNOTATE statement draws all of the annotations that are stored
    in the annotation data set. You can use the ANNOTATE statement ID= option to display
    a subset of these annotations. Subsetting your annotations enables you to use
    one annotation data set with multiple plots. To use the ID= option, the observations
    for the annotations must contain an ID column. The ID column is a character column
    that stores a unique character value that identifies the subset to which each
    annotation belongs. When the ID="identifier" option is used in the ANNOTATE statement,
    only the annotations with ID column values that match the identifier are displayed.
    The remaining annotations are ignored. For more information about the ANNOTATE
    statement ID= option, see "ANNOTATE Statement" in SAS Graph Template Language
    Reference: For an example, see "Example 2: Displaying Subsets of Annotations in
    Axis-Aligned Insets" on page 431.


    # Examples


    # Example 1: Creating Custom Labels


    # Overview


    This example demonstrates how to use the Graphic Template Language (GTL) annotation
    facility to create custom category labels for a horizontal bar chart. The bar
    chart plots the average highway mileage (response) by vehicle type (category).
    Ordinarily, the category labels for a horizontal bar chart appear on the Y axis
    to the left of each bar. This example demonstrates how to put the labels on the
    left end of each bar instead. This example also uses the sheen data skin on the
    bars. Because of the reflection on the sheen skin, the labels are raised slightly
    to center the label in the reflection on each bar. Finally, the label text color
    uses the contrast color.'
