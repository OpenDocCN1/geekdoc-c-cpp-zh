    ![](img/a9ccb6123dee40d424cb295a3a99c16c_242_0.png)


    You can enhance any cell header in the following way:


    +   - nest a GRIDDED layout in the CELLHEADER block

    - set B=TRUE in the LAYOUT GRIDED statement

    - add the ENTRY(s) to the GRIDED layout.


    The GRIDED layout fills the cell header space above the plot wall, its border
    aligns nicely with the plot.

    You can further enhance the cell header by making the GRIDED layout''s background
    opaque and setting a background color for it. To ensure the colors coordinated
    with the current style, you could choose any of several style elements that define
    light background colors, such as GraphHeaderBackground, GraphBlock, or GraphAltBlock.
    Note that several style definitions set the GraphHeaderBackground to be the same
    as the GraphBackground. For styles LISTING and JOURNAL, the background is white.


    As a final enhancement, you could coordinate the text color for the cell headers
    with a visual attribute in the plot. For example, if you are displaying a fit
    in the cell, you could see the text color to match the color of the line. The
    TEXTATTRS- option in the ENTRY statement can be used to set the text properties.
    The default settings for TEXTATTRS are derived from the GraphValue style element.
    For more information about ENTRY statements, see Chapter 7, "And Changing Text
    in a Graph," on page 157.


    The following code enhances the cell header block of the first cell. Similar code
    would be used to enhance the headers of the other two cells:


    ```

    cellheader;

    layout gridded / border=true opaque=true

    backgroundcolor=GraphAltBlock;color;

    ent "Spline Fit" / textattrs=(color=GraphFit:contrastColor);

    endlayout;

    cellheader;

    ```'
