    # Resetting the Image Name and Format


    The options in the ODS GRAPHICS statement are global to the SAS session. The options
    are in effect until you:


    +   * disable the ODS graphics environment by submitting the following statement:

    ods graphics off;


    +   * reset all options to their defaults by submitting the following statement:

    ods graphics / reset;


    +   * reset specific options by submitting the following statement:

    ods graphics / reset=option;


    The DEVICE= and PRINTERPATH= system options are also global to the SAS session.
    These options are in effect until you reset. For information about changing these
    options to a new value or back to the default value, "Changing SAS System Option
    Settings" in Chapter 1 of SAS System Options: Reference and "Resetting System
    Options to the Default or Starting Value" in Chapter 1 of SAS System Options:
    Reference.


    # Controlling the Image''s Output Location


    To control the location (path) for ODS Graphics output, use the PATH= or GPATH=
    option on the ODS destination statement.


    ```

    ods listing gpath="C:\ODGraphs";

    ```


    ```

    ods html gpath="C:\ODGraphs";

    ```


    For the HTML, the PATH= option is used to indicate whether the HTML is stored.
    If GPATH is none, images are stored at the PATH+ location. Use PATH+ and GPATH+
    when you want to store images in a different storage location. The URL=NONE (url-specific)
    subsection specifies a Resource Locator for the PATH= or the GPATH= options.


    For example, the following program will create an HTML page named u:\public_html\report.html:


    ```

    ods graphics / reset imagename="statistical"

