    # Controlling DPI


    All ODS destinations use a default DPI (dots per inch) setting when creating ODS
    Graphics output. By default, LISTING and HTML use 96 dpi, and RTF and PDF use
    150 dpi. Graphs that are rendered at high DPI have greater resolution and larger
    file size. Although DPI can be set to large values such as 1200, from a practical
    standpoint, settings larger than 300 dpi are seldom necessary for most applications.
    Also, setting an unrealistically high DPI like 1200 could cause an out-of-memory
    condition. Note that the ODS option for setting DPI is not the same for all destinations.
    For the LISTING and HTML destinations, use the IMAGE_DPI option. For the RTF and
    PDF destinations, use the DPI= option.


    ```

    ods graphics / width=440px height=scale=off;\ods html image_dpi=100 style=docimage_smallfont;

    ```'
