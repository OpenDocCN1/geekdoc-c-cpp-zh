  md: '# Attributes Available for the Attribute Options


    Depending on the attribute option used on a statement, the available attributes
    might be fill-options, :line-options , marker-options , or text-options.


    # Fill Options


    When specifying the attributes for an area field, the fill-options can be one
    or more of the following settings. The option must be enclosed in parentheses
    and specified as a name = value-pair. The value can be a style-reference in the
    form style-element:style-attribute.


    **COLOR:=style-reference | color**


    specifies the color. If you use a style-reference, the style-attribute should
    be a valid attribute such as COLOR, CONTRASTCOLOR, STARTCOLOR, NEUTRAL, ENDCOLOR.
    The convention is to use the COLOR attribute for fills.


    If you use as color, SAS accepts color names, such as RED, or color codes, such
    as CXF0000 or #FF0000. Color names must not exceed 64 characters. Color codes
    must not exceed 8 characters and must be in a valid SAS color-naming scheme, such
    as RGB, CMYK, HLS, or HSV (HSB).


    **TRANSPARENC:=number**


    specifies the degree of the transparency of the filled area. This setting enables
    you to set the transparency for the filled elements of some graph types. You can
    set this fill transparency, or set the fill independently of the other transparent
    elements in the graph. For example, you can use this setting to set the transparency
    level for the filled bars of a bar chart, and use the bar chart''s DATATRANSPARENCY=option
    to set a different transparency level for the bars.


    | Default | The same as the setting of the statement''s DATATRANSPARENCY=option.
    |


    | Range | 0 (opaque) to 1 (entirely transparent) |


    | Interaction | This setting overrides the statement''s DATATRANSPARENCY=setting
