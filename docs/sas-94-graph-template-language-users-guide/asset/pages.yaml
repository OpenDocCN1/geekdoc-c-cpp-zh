    You can create multiple levels of drill-down graphs in your presentation. That
    is, your supporting graphs can also be drill-down graphs in as many levels as
    needed.


    # Creating Shared Templates


    When creating templates (especially with dynamics that generalize the usefulness
    of the template), you typically want to enable several people to create graphs
    from the directory that is accessible to them. To access templates, you must store
    the "templates" in a directory. PROC TEMPLATE can store templates in specified
    SAS libraries and within specific items. By default, templates are stored in Sassuser.Template
    but another library.itemstore can be specified with the STORE= statement.


    ```

    libname p "\\public\templates";

    proc template;

    def statagraph graphs.distribution / store=p.templatat;

    ...

    end;

    def statagraph graphs.regression / store=p.templat;

    ...

    end;

    run;

    ```


    When this code is compiled, see the following notes in the SAS log:


    > NOTE: STATAGRAP ''Graphs.Distribution'' has been saved to:

    PUBLIC.TEMPLATE

    NOTE: STATAGRAP ''Graphs.Regression'' has been saved to:

    PUBLIC.TEMPLATE


    After shared templates are compiled and stored, others can access them to produce
    graphs.


    ```

    libname p "\\public\templates" access=readonly;

    ods path reset;

    ```'
