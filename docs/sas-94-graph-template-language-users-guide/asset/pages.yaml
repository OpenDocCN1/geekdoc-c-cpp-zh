    \ uses the CATS function to perform the type conversion when:\n\n```\nif(substr(cats(value,\
    \ 1, 2)) = \"11\")\n```\n\n# Conditional Logic\n\nGTL supports conditional logic\
    \ that enables you to include or exclude one more GTL statements at run:\n\n```\n\
    IF ( condition )\n  GTL statement);\nELSE\n  GTL statement);\nENDIF;\n```\n\n\
    The statement requires an ENDIF statement, which delimits the IF block. The IF\
    \ block can be placed anywhere within the BEGINGRAPH / ENDGRAPH block.\nThe condition\
    \ is an expression that evaluates to a numeric constant, whereas all constants\
    \ other than 0 and MISSING are true. The IF block is evaluated with an implied\
    \ EVAL(condition), so it is not necessary to include an EVAL as part of the condition.\n\
    \n> Note: Dynamic variables that are initialized to ODS-recognized value, such\
    \ as YES, TRUE, or FALSE, do not work as expected when used as an expression in\
    \ IF-THEN statement. In that case, the expression is treated as a string, which\
    \ always evaluates to a positive integer value (FALSE).\n\nHere are some examples:\n\
    \n```\n/* test a computed value */\nif (weekday(today()) in (1 7))\n  entrytitle\
