    # Adding Images


    Use a DRAWIMAGE statement to place a JPG or PNG image on your graph.


    Note: The DRAWIMAGE statement supports the JPG and PNG image formats only.


    The basic syntax is:


    ```

    DRAWIMAGE "image-file.ext" / X=x Y=y <options>

    ```'
