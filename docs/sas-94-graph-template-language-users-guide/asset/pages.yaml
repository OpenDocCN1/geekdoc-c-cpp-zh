  md: '# Appendix 6

    Memory Management for ODS Graphics


    SAS Options Affecting Memory ................................................................
    507

    Managing a Java Out of Memory Error ................................................
    507


    # ODS Options Affecting Memory


    ODS Graphics uses Java technology to produce its graphs. Most of the time this
    fact is transparent to you because the required Java Runtime Environment (JRE)
    and JAR files are included with SAS software installation. Also, the Java environment
    is automatically started and stopped for you. When Java is started, it allocates
    a fixed amount of memory. The memory can grow up to the value set for the -Xms
    suboption in the JREOPTIONS option (discussed in a moment). This memory is independent
    of the memory limit SAS sets for the SAS session with the MEMSIZE option.


    Normally, the memory limit for Java is sufficient for most ODS Graphics applications.
    However, some tasks are very memory intensive and might exhaust all available
    Java memory, resulting in an OutOfMemoryError condition. You might encounter Java
    memory limitations when


    +   - the product of the output size and the DPI settings result in very large
    output

    - a classification panel has a very large number of classifier crossings

    - a scatter plot has a large number of variables

    - creating 3-D plots and 2-D contours, which are memory intensive to generate

    - a plot has a very large number of marker labels

    - a plot uses many character variables or a large number of GROUP values

    - using the SG Editor to edit a graph with a large amount of data.


    # Managing a Java Out of Memory Error


    If you encounter a Java OutMemoryError, you can try executing your program again
    by restarting SAS and specifying a larger amount of memory for Java at SAS invocation.


    To determine what the current Java memory settings are, you can submit a PROC
    OPTIONS statement that shows the value of the JREOPTIONS option:'
  merge: -1
  pgno: 516
- img_proc: true
  md: 'Appendix 6 Memory Management for ODS Graphics


    ```

    proc options option=jreoptions;

    run;

    ```


    After you submit this procedure code, a list of JREOPTIONS settings is displayed
    in the SAS log. The JREOPTIONS option has many suboptions that configure the SAS
    Java environment. Many of the suboptions are installation and host specific and
    should not be modified, especially the ones that provide installed file locations.
    For managing memory, look for the -Xmx and -Xms suboptions:


    ```

    JREOPTIONS=(/* other Java suboptions */ -Xmx128m -Xms128m)

    ```


    # -Xms


    Use this option to set the minimum Java memory (heap) size, in bytes. Set this
    value to a multiple of 1024 greater than 1MB. Append the letter k or K to indicate
    kilobytes, or m or M to indicate megabytes. The default is 2MB. Examples:


    ```

    -Xms6291456

    -Xms6144k

    -Xms6m

    ```


    # -Xmx


    Use this option to set the maximum size, in bytes, of the memory allocation pool.
    Set this value to a multiple of 1024 greater than 2MB. Append the letter k or
    K to indicate kilobytes, or m or M to indicate megabytes. The default is 64MB.


    ```

    -Xmx8388680

    -Xmx81920k

    -Xmx80m

    ```


    As a general rule, you should set the minimum heap size (-Xms) equal to the maximum
    heap size (-Xmx) to minimize garbage collections.


    Typically, SAS sets both -Xms and -Xmx to be about 1/4 of the total available
    memory or a maximum of 128M. However, you can set a more aggressive memory (heap)
    size, it should never be more than 1/2 of physical memory.


    You should be aware of the maximum amount of physical memory your computer has
    available. Let us assume that doubling the Java memory allocation is feasible.
    So when you start SAS from a system prompt, you can add the following option:


    ```

    -jreoptions (-Xmx256m -Xms256m)

    ```


    Alternatively, you might need to specify the setting in quotation marks:


    ```

    ''jreoptions (''-Xmx256m -Xms256m'')

    ```


    The exact syntax varies for specifying Java options, depending on your operating
    system, and the amount of memory that you can vary from system to system. The
    set of JRE options must be included in parentheses. If you specify multiple JREOPTIONS
    system options, SAS appends JRE options to JRE options that are currently defined.
    Incorrect JRE options are ignored.


    If you choose to create a custom configuration file, you would simply replace
    the existing -Xms and -Xmx suboption values in the JREOPTIONS-(all Java options)
    portion of the configuration file.


    For more information, see the SAS Companion for your operating system.'
  merge: -1
  pgno: 517
- img_proc: true
  md: '# Appendix 7

    ODS Graphics and SAS/GRAPH


    SAS produces graphics using two very distinct systems: ODS Graphics and SAS/GRAPH.
    ODS Graphics and the GTL produce graphics through the Output Delivery System (ODS)
    using a template-based system. SAS/GRAPH produces graphics using a Device-based
    system. You can use both systems to generate your graphical output. That is, you
    can use SAS/GRAPH to generate the output for some jobs, and ODS Graphics to generate
    the output for others. To help you understand the differences between the two
    systems in case, here is a comparison:


    +   • The GTL does not produce GSEGs or device drivers. The output format that
    is produced is specified by the OUTPUTMT= option in the ODS GRAPHICS statement.
    The GTL produces all output in industry standard formats such as PNG, GIF, JPEG,
    WMF, TIFF, PDF, EPS, TCL, and SVG. SAS/GRAPH procedures produce a SEG in SAS analog.
    Other output formats in SAS/GRAPH, such as an image or metgraphics file, can be
    created by selecting an appropriate device driver as PNG, JPEG, or GIF.

    • The GTL has a layout-centric architecture. Each graph contains components as
    plots, inlets, and legends that can be combined in flexible inside layout containers
    to build complex graphs. Several layout types are available, some that produce
    a graph in a single cell and others that produce a graph as a panel of cells.
    In most cases, the components used in the single-cell graphs can also be used
    in the multi-cell graphs.

    • The GTL global options are specified in the ODS GRAPHICS statement or in the
    ODS destination statement. The GTL does not use the traditional SAS/GRAPH global
    statements, such as SYMBOL, PATTERN, AXIS, LEGEND, and GOPTIONS.

    • The GTL statements and options provide control over the visual properties of
    a graph. SAS/GRAPH global statements such as GOPTIONS, AXIS, LEGEND, PATTERN,
    SYMBOL, and NOTE control the properties for text, markers, and lines.

    • The GTL controls the size, format, and name of output images with the HEIGHT=,
    WIDTH=, and IMAGENAME= options in the ODS GRAPHICS statement. The ODS statement
    is similar in purpose to SAS/GRAPH controls the size and format of graphical output
    with options as HSIZE= VSIZE= and DEVICE= in the GOPTIONS statement.

    • The GTL axes, backgrounds, legends, and the other graph components are managed
    by the layout containers and do not belong to an individual plot.

    • Titles and footnotes produced by the SAS TITLE and FOOTNOTE statements do not
    appear in graphs that are generated using the GTL. The GTL has its own statements
    for producing titles and footnotes. (However, the SGPLOT, SPANEL, and SGATTER
    procedures support the TITLE and FOOTNOTE statements. They generate GTL behind
    the scenes.)'
  merge: -1
  pgno: 518
- img_proc: true
  md: '# 510 Appendix 7 ODS Graphics and SAS/GRAPH


    +   The GTL type is determined by the plot statement. A plot statement is provided
    for each plot type. The SAS/GRAPH plot type is determined by global options for
    some graphs, example, the INTERPOL= option in the SYMBOL statement might determine
    whether a graph is a scatter plot or a box.


    +   The GKL attributes for markers, lines, color, and so on, are derived from
    the default ods style, which cannot be turned off. SAS/GRAPH also uses ODS styles
    by default. However, with SAS/GRAPH, the style can be turned off and the appearance
    information that is specified in the device entries used instead. For more information
    about ODS styles, see Chapter 6, “Managing Graphics Appearance: General Principles,”
    on page 111.


    +   The GTL supports all of the ODS destinations. For the LISTING destination,
    image node is created for the graph in the Results tree. it must be manually opened
    in an external viewer or in the ODS Graphics Editor. SAS/GRAPH also supports all
    the ODS destinations. However, for the LISTING destination, SAS/GRAPH creates
    a GRAPHICS node in the Results tree, and the image appears in the graph window
    automatically.


    +   The GTL supports scaling of fonts and markers by default. This means that
    the size of fonts and markers are adjusted as appropriate to the size of your
    graph. Font and marker scaling is disabled by the NOSCALE option in the ODS GRAPHICS
    statement. SAS/GRAPH does not support scaling of fonts and markers.


    +   The GTL does not support the SAS/Graph Annotate facility. The GTL annotation
    facility or the GTL draw statements can be used to add a variety of data-driven
    or non-data-driven graphical elements to graphs. For information about the GTL
    annotation facility, see Chapter 20, “Adding Data-Driven Annotations to a Graph,”
    for information using GTL draw statements, see Chapter 19, “Adding Non-Data-Driven
    Graphics Elements to a Graph,” on page 405. You can also use the ODS Graphics
    Editor to add annotations to your graphs. See SAS ODS Graphics Editor: User’s
    Guide.


    +   The GTL does not support RUN-group processing. SAS/GRAPH supports RUN-group
    processing for some procedures.'
  merge: -1
  pgno: 519
