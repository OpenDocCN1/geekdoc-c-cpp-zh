    Legend Statements

    GTL supports two types of legends: a discrete legend that is used to identify
    graphical features such as grouped markers, lines, or overlay plots; and a continuous
    legend that shows the range of numeric variation as a ramp of color values. Legends
    are dependent on one or more plot statements and must be associated with the plot(s)
    they describe. The best strategy for creating legends is to "link" to a legend
    statement by assigning a unique, case-sensitive name to the plot statement on
    its NAME= option and then referencing that name on the legend statement.


    | Statement | Required Arguments | Comments |

    |---|---|--|

    | DISCRETELEGEND | Name(s) of associated plot(s) | Traditional legend with entries
    for grouped markers or lines, or overlay plots. |'
