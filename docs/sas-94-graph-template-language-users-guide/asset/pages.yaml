  md: '# Comparison of Fit Lines


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_231_0.png)


    The graph would look better if the graph height were smaller in relation to the
    width. You can establish a good default graph size in the template definition
    by setting the DESIGNWIDTH= and DESIGNHEIGHT= options in the BEGINGRAPHH statement.
    After some experimentation, you might decide that something closer to a 2:1 aspect
    ratio looks good:


    beingraph / designwidth=400px designheight=180px;


    # Comparison of Fit Lines


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_231_1.png)


    The DESIGNWIDTH= and DESIGNHEIGHT= options set the graph size as part of the template
    definition so if you later want a larger or smaller version of this graph, you
    can use the ODS GRAPHICS statement rather than resetting the design size and recompiling
    the template. You need only specify either a WIDTH= or a HEIGHT= option in the
    ODS GRAPHICS statement. The other dimension is automatically computed for you,
    based on the aspect ratio that is specified in the compiled template by the DESIGNWIDTH=
    and DESIGNHEIGHT= options.


    ```

    ods graphics / reset width=375px;

    proc sgdata=sashelper.cars template=fitcompare;

    run;

    ```'
