  md: "from dividing input data into subsets that are determined by the values of\
    \ one or more classification variables. GTL provides two layouts that can produce\
    \ classification panels:\n\nLAYOUT DATAPANEL\n\nsupports a list of class variables.\
    \ The number of rows and columns are controlled by statement options. Each cell\
    \ is labeled with the class variable values in the cell header.\n\nLAYOUT DATALLACK\n\
    \nsupports up to two class variables, one for a row variable and one for a column\
    \ variable. One row of cells is created for each value of the row variable, and\
    \ one column is created for each value of the class variable. The rows and columns\
    \ are labeled.\n\n# The LAYOUT DATAPANEL Statement\n\nThe example in this section\
    \ uses the LAYOUT DATAPANEL statement to specify a list of two classification\
    \ variables: DIVISION (two distinct values) and PRODUCT (three distinct values).\
    \ Six combinations (crossings) of these unique values are possible, which produces\
    \ a panel with six cells.\n\nNotice the following details about the LAYOUT DATAPANEL\
    \ statement:\n\n+   - The CLASSVAR= option on the LAYOUT DATAPANEL statement can\
    \ specify a list of one or more classifiers.\n\n+   - In the resulting graph,\
    \ the data crossings are identified by the cell headers.\n\nThe following template\
    \ code generates Figure 11.1 on page 259.\n\n```\nproc template;\n  define statgraph\
    \ datapanel_intro;\n  begraph;\n    entrytitle \"Office Furniture Sales\";\n \
    \   layout datapanel classvars=(product division) / columns=2;\n    layout prototype;\n\
    \      seriesplot x=month y=actual;\n    endlayout;\n  endlayout;\n  endgraph;\n\
    run;\n```"
