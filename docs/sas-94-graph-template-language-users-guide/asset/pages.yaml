    Often, the input data''s organization will affect your choice of plot statements
    in an OVERLAY layout. In Chapter 3, “Overview of Basic Statements and Options,”
    on page 21, you saw that you would choose different plot statements for a fit,
    depending on the nature of the input data for a fit plot.


    # # Regression Fit Plot


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_60_0.png)


    **Computed Parameterized Plots.** If the data has numeric columns for raw data
    values of Height and Weight, the simplest way to create the fit line and confidence
    bands is with a REGRESSIONPLOT, LOESSPLOT, or PBSPLINEPLOT statement and a MODELBAND
    statement. All of these computed plot statements generate values of new columns
    to the points of the fit line and boundaries.


    ```

    layout overlay;

    modelband "mycm";nscatterplot x-height y=weight / primary=true;

    regressionplot x-height y=weight / alpha=.01 clm="mycm"

    endlayout;

    ```


    If you have computed by an analytic procedure that provides points on the fit
    line and bands, you would choose a SERIESPLOT and BANDPLOT for the graph. This
    technique is required when the desired fit line cannot be computed by the REGRESSIONPLOT,
    LOESSPLOT, or PBSPLINEPLOT statement options.


    ```

    layout overlay;

    bandplot x-height upper=uclm lower=lcm / fillattrs=GraphConfidence;

    scatterplot x-height y=weight / primary=true;

    seriesplot x-height y=p / lineattrs=GraphFit;

    endlayout;

    ```


    Also, notice that additional options are used to set the appearance of the fit
    line and band to match the details for REGRESSIONPLOT and MODELBAND.'
