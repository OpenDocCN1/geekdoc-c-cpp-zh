  md: '# Default Axis Construction and Related Options


    # Determine Axis Type


    To determine axis types, the OVERLAY container examines all of the stand-alone
    plots that are specified. It also examines whether an axis type has been specified
    with the TYPE=setting on an axis option (for example, XAXISOPTS=). If there is
    only one stand-alone plot, or a plot designated as PRIMARY, the rules are:


    +   - If the plot statement is mapped to an axis treats data values as discrete
    (such as the CATEGORY=column of the BARCHART or the X=column of the BOXPLOT statement),
    the type is DISCRETE for that axis, regardless of whether the data column that
    mapped to the axis is character or numeric. A DISCRETE axis has tick values for
    each unique value in a data column.


    +   - If the plot statement is mapped to an axis bases the axis type on the type
    of the assigned values, a DISCRETE axis is created when the column type is character.
    Otherwise, a TIME or LINEAR axis is created.


    +   - If the plot statement is mapped to an axis specifies a numeric column and
    the column has a date, time, or datetime format associated with it, the axis type
    is TIME. See "TIME Axes" on page 97 for examples. Otherwise, the numeric type
    is LINEAR, the general numeric axis is "LINEAR" on page 84 for examples.


    +   - A LOG axis is never automatically created. To obtain a LOG axis, you must
    explicitly declare the axis type with the TYPE=LOG option. See "LOG Axes" on page
    102 for examples.


    +   - If a TYPE*=axis type is specified, the type used. Plots that cannot support
    that axis are not drawn


    When the overlay contains multiple plots that generate axes, GTL can determine
    default axis features for the shared axes, or you can use the PRIMARY= option
    on one of the plot statements to specify which plot you want the GTL to use.


    +   - If no plot is designated as primary, the data columns that are associated
    with the first plot that generates axes are considered primary on a per-axis basis.


    +   - If PRIMARY=TRUE for a plot within an overlay-type layout, that plot''s data
    columns and type are used to determine the default axis features, regardless of
    where this plot occurs within the layout.


    +   - Only one plot can be primary on a per-axis basis, the last one encountered
    is considered primary.


    **Example:** For the following layout, the BARCHART is the primary plot because
    it is the first stand-alone plot that is specified in the layout and no other
    plot has been set as the primary plot. A BARCHART requires a discrete X-axis.
    You cannot change the axis type. It does not matter whether Quarter is a numeric
    or character column. Because the SERIESPLOT can use a discrete axis, the overlay
    is successful.


    ```

    layout overlay;

    barchart category=quarter response=actualSales;

    seriesplot x=quarter y=predictedSales;

    endlay;

    ```'
