    # Organizing Panel Contents


    # Overview of What to Consider When Planning a Classification Panel


    When planning a classification panel, several factors will influence the layout

    sification:


    +   - Grid dimensions (number of rows and columns)

    - Cell population order as the layout is rendered

    - Gutters between the cells

    - Graph aspect ratio

    - Cell size within the panel

    - Prototype orientation.


    # Grid Dimensions and Cell Population Order


    Assume you want to create a DATAPANEL layout with one classification variable

    h five unique values. Before starting to write code, you must first decide what
    grid

    dimens you want to set (how many columns and rows) and whether you want to

    permit cells in the grid. If you do not want empty cells, you must limit the grid
    to

    f cells, which gives you two choices for the grid dimensions: five columns by
    row

    (5x1), or one column by five (1x5). If you are willing to have empty cells in
    the

    grid, you could have several grid sizes, such as a 2x3 or a 3x2 the COLUMNS= and
    ROWS=


    The easiest way to set a grid dimension is to set both the COLUMNS and ROWS-

    options to the desired number of columns and rows. If one dimension is set, the
    other

    dimension grows to accommodate the number of classification levels. By

    default, COLUMNS- and ROWS- option is not set.


    By default, the layout uses the ORDER-ROWSMAJOR setting to populate grid cells.

    this specification means "fill in all cells in the top row (at the top

    left) and then continue to the next row below." The following layout leaves the
    default

    ORDER-ROWSMAJOR setting in effect:


    ```

    layout datamodel classvars=(var) / columns=3 rows=2 ;

    layout prototype;

    ... plot statements ...

    endlayout;

    ```'
