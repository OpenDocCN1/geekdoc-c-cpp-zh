    # Creating a Graph to Include in MS Office Applications


    The default height for a graph is 480 pixels. At a 100 dot per inch (DPI) setting,
    you can consider the default height to be 4.8 inches. If you render a graph at
    480 pixels and 100 DPI, insert it into a document like an MS Office application,
    and then print the page, the graph height will be 4.8 inches and all font sizes
    will look right in their point weights. You can render the graph at higher DPI
    to get higher quality graphics. As long as the graph is inserted in the document
    as a 4.8 inch graph, it will work as expected.


    To alter the graph size or DPI for a graph you want to include in an MS Office
    application, one technique that produces good results is to create a stand-alone
    image that is sized appropriately and has high resolution, 200 DPI or 300 DPI.


    ```

    ods graphics / reset width=5in image="fitplot" outputfile=png;\ods antialias=on;\ods
    gpath="\graphs" image-dpi=200 style=analysis;

    run;

    ```


    This code produces a 5 inch, 200 DPI image \graphsfitplot.png, which can be inserted
    into Word or PowerPoint documents. When the WIDTH=HEIGHT option is specified in
    the ODS GRAPHICS statement, the design aspect ratio of the graph is maintained.
    Also, check the log to ensure that anti-aliasing has not disabled. If it is disabled,
    check the ANTIALIASMAX= option. See "Controlling Anti-Aliasing" on page 462 for
    a discussion of anti-aliasing.


    After inserting the graph into the MS Office document, you can change the picture
    size with good results (maintaining aspect ratio). If you find that the graph
    in text is too large or small, re-create the graph with different font sizes using
    the techniques discussed in "Understanding Scaling" on page 457.


    To create good looking graphs for a two-column MS Word document where each column
    is 3.5 inches wide, use a graph width of 3.5 inches. If the original graph has
    a default width of 640 pixels, use WIDTH=3.5IN in the ODS GRAPHICS statement to
    create a smaller graph with appropriately smaller fonts. In the case, the fonts
    will not be the right point size, but they will be scaled using a non-linear scaling
    factor.


    # Controlling Data Tips


    # Creating a Graph with Data Tips in an HTML Page


    Data tips can be displayed by graphs that are included in HTML pages. When data
    tips are provided, you can use "mouse over" parts of a graph, and text balloons
    open to show information (typically data values) that is associated with the area
    where the mouse pointer rests. Nearly all points in GTL create default data tip
    information. However, this information is not generated unless you request it
    with the IMAGEMAP= in the ODS GRAPHICS statement:


    ```

    ods htmlfile=" ." path=" ." (url=none);

    ```'
