    # Rectangles


    Use a DRAWRECTANGLE statement to add rectangles to graph. The basic syntax is
    as follows:


    ```

    DRAWRECTANGLE X=x Y=y WIDTH=width HEIGHT=height / <options>

    ```


    The X and Y options in the DRAWRECTANGLE statement specify the coordinates of
    the anchor point of the rectangle. By default, the rectangle is anchored on its
    center point. You can include the DRAWSPACE= option, or the XSPACE= and YSPACE=
    in options to specify different units. If you choose DATAVALUE as the coordinate
    units and you want to scale the rectangle to the secondary axis, you must also
    include the AXIS=X2 and YAXIS=Y2 options. You can include the ANCHOR= option to
    change the anchor point.


    The WIDTH= and HEIGHT= options in the DRAWRECTANGLE statement specify the dimensions
    of the rectangle in PERCENT units by default. You can include the WIDTHUNIT and
    HEIGHTUNIT= in options to specify PIXEL or DATA units instead.


    You can change other attributes of the rectangle, such as the fill color, the
    outline color, and the outline pattern. Include the FILLATTRS= option in options
    to change the fill color, and the OUTLINEATTRS= option to change the outline color
    and pattern.


    Here is an example of a DRAWRECTANGLE statement that adds a 60% wide by 40% high
    rectangle. In this example, percent refers to the percentage of the drawing area,
    at coordinates (80,80) in GRAPHXEL units.


    ```

    drawrectangle x=80 y=60 width=40 height=graphgraphpixel

    widthunit=percent heightunit=percent

    drawspace=graphpixel

    anchor=bottomleft

    display=all

    fillattrs=(color=lightgray)

    outlineattrs=(color=blue pattern=shortdash thickness=1px);

    ```'
