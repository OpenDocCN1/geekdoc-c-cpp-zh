  md: '# 396 Chapter 18 • Managing the Graph Appearance with Styles


    GraphFootnoteFont Used for all footnotes. Typically, this font is smaller than
    the title font. Sometimes, footnotes are italicized.


    GraphLabelFont Used for axes labels and legend titles. Generally, this font is
    smaller than the title font.


    GraphValueFont Used for axis values and legend entries. Generally, this font is
    smaller than the label font.


    GraphDataFont Used for text where minimum size is necessary (such as point labels).


    GraphUnicodeFont Used for adding special glyphs (for example, α, æ, ±) to text
    in the graph (see Chapter 7, “Adding and Changing Text in a Graph,” on page 157).


    GraphAnnoFont Default font for text annotation in the ODS Graph Editor.


    The SAS Output Delivery System: User’s Guide provides information and examples
    of all predefined style elements and attributes.


    In our example, we will name our modified style SerifStatistical, change all occurrences
    of sans-serif to serif, change all occurrences of MTSeries to MTserif, and change
    Helvetica and Arial (sans-serif fonts) to Times (a serif font):


    ```

    proc template;

    define style Styles SerifStatistical ;

    parent = styles.statistical;

    style fonts /

    ''TitleFont2''=(''<serif>, <MTserif>, Times ,2,bold)

    ''TitleFont1''=(''<serif>, <MTserif>, Times ,3,bold)

    ''StrongFont''=(''<serif>, <MTserif>, Times ,2,bold)

    ''EmphasisFont''=(''<serif>, <MTserif>, Times ,2,italic)

    ''FixedFont''=(''<monospaced>, Courier, monospaced,2)

    ''BatchFont''=(''<monospaced>, Courier, monospaced,2)

    ''FixedStrongFont''=(''<monospaced>, Courier, monospaced,2,bold)

    ''EmphasisFont''=(''<monospaced>, Courier, monospaced,2,italic)

    headingFont''=(''<serif>, <MTserif>, Times ,

    headingFont1''=(''<serif>, <MTserif>, Times ,2,bold)

    docFont''=(''<serif>, <MTserif>, Times ,2);

    style Graphs /

    ''GraphTitleFont''=(''<serif>, <MTserif>, .11,pt)

    ''GraphFootnoteFont''=(''<serif>, <MTserif>, .10,pt)

    ''GraphLabelFont''=(''<serif>, <MTserif>, .10pt)

    ''GraphValueFont''=(''<serif>, <MTserif>, .9pt)

    ''GraphDataFont''=(''<serif>, <MTserif>, .7pt)

    ''GraphUnicodeFont''=(''<MTserif-unicode>, .9pt)

    ''GraphAnnoFont''=(''<serif>, <MTserif>, .10pt);

    end;

    run;

    ```


    Note: By assigning the parent to STYLE.STATISTICAL, we will need to change only
    those style elements. The rest of the elements are inherited.'
