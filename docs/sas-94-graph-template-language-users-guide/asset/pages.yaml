    # Introduction to Dynamics and Macro Variables


    If all of the variable names and options that are referenced in GTL had to be
    "hard coded" in the compiled template, it would require that you redefine and
    recompile the template every time you created the same type of graph with different
    variables. SAS programmers are familiar with using SAS macros and macro variables
    to build application code in which variables and other parameters can be specified
    by a calling program. The same techniques, as well as other techniques unique
    to ODS templates, can be applied in GTL to create reusable templates.


    # Declaring Dynamics and Macro Variables


    Within the scope of a template definition, GTL supports the DYNAMIC statement
    for declaring dynamic variables, the MYVAR and NMVAR statements for declaring
    macro variables. These statements must appear after the BEGINGRAPH block. The
    following syntax shows the overall template structure:


    ```

    PROC TEMPLATE;

    DEFINE STATGRAPH template-name;

    DYNAMIC variable-I "<text-I> <...variable-n<<text-n>>;

    MYVAR variable-I "<text-I> <...variable-n<<text-n>>;

    NMVAR variable-I "<text-I> <...variable-n<<text-n>>;

    BEGINGRAPH;

    nGTL statements;

    ENDGRAPH;

    ```


    END;'
