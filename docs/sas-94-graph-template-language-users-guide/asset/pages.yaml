  md: "For more information about other features of SGRENDER, see Chapter 21, “Executing\
    \ Graph Templates,\\” on page 437.\n\n# # Managing the Graphical Output\n\n# ##\
    \ Directing Output to ODS Destinations\n\nAll ODS graphics are generated in industry\
    \ standard formats (PNG, PDF, and so on), depending on the settings for the active\
    \ ODS destinations. The ODS HTML destination is by default, and the default image\
    \ format, PDF, is the HTML destination.\n\nAll ODS destinations such as HTML,\
    \ PDF, RTF, LATEX, and PRINTER are fully supported. The ODS destinations enable\
    \ you to\n\n+   - manage the graphs that are generated by O Graphics\n- display\
    \ the output in a variety of forms (HTML, PDF, RTF, ...)\n- control the location\
    \ of stored ODS files and other features that are relevant for the active destinations.\n\
    \nAs discussed in “Compiling the Template” on page 14, a compiled template is\
    \ stored in an item store. Thus without rewriting or resubmitting the template\
    \ code, we can render the graph as needed during the current SAS session or a\
    \ future SAS session.\nTo generate ODS Graphics output for the web, we can direct\
    \ the output to the HTML destination, which generates an image file for the graph,\
    \ and also an HTML file that references the image. Thus, output that is generated\
    \ in the HTML destination is ready for display in a web browser.\n\nThe ODS HTML\
    \ statement stores the output files in the folder C:\\myfiles\\myserver The code\
    \ first closes the LISTING statement to creating output:\n\n```\nods html path=\"\
    C:\\myfiles\\myserver\" (url=none) file=\"modelfit.html\";\nproc sgrender data=sashelp;\
    \ class template=modelfit; run;\n html close; /* to close the output file */\n\
    ods listing; /* reopen the HTML destination for subsequent output */ /\n```\n\n\
    +   - The PATH option specifies storage location C:\\myfiles\\myserver for output\
    \ files that are created by the SAS statements, including images from ODS Graphics.\n\
    - The FILE option specifies that output is written to the file modelfit.html,\
    \ which is saved in the location specified in PATH.\n- The ODS HTML CLOSE statement\
    \ closes the HTML destination, which enables you to see your output. By default,\
    \ the HTML destination uses the HTMLBLUE style for graphics (“Modifying Graph\
    \ Appearance with Styles on page 18 provides an introduction to ODS styles), which\
    \ uses a gray background."
