  md: '# Avoiding Tick Value Collisions


    As with LINEAR axes, you can specify a tick value fitting policy for a TIME axis.
    The following policies are available: THIN, ROTATE, ROTATEWAYS, STAGGER, ROTATETHIN,
    STAGGERTHIN, and STAGROTATE when tick values are not split. The default policy
    is THIN .


