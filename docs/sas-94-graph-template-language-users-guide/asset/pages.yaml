  md: "# Creating a Global Legend\n\nWhen multiple discrete legends are used, you\
    \ can use a LAYOUT GLOBLEGEND block to combine all of the discrete and merged\
    \ legends into one global legend. The following restrictions apply to global legends:\n\
    \n+   - Only one LAYOUT GLOBLEGEND block is allowed for each template.\n- You\
    \ must include the LAYOUT GLOBLEGEND block in the BEGINGRAP/ENDGRAPH block.\n\
    - Any DISCRETELEGEND or MERGEDLEGEND statements that appear outside of the LAYOUT\
    \ GLOBLEGEND block are ignored.\n- The individual legends in the global legend\
    \ can be arranged in a single row or a single column only.\n- CONTINUOUSLEGEND\
    \ statements are not supported.\n\nTo combine legends into one global, include\
    \ all of the DISCRETELEGEND and MERGEDLEGEND statements in your LAYOUT GLOBLEGEND\
    \ block. The resulting global legend is placed at the bottom of the graph just\
    \ above the footnotes. You can use the TITLE= option to add a title to the global\
    \ legend. You can also use the TITLE= option on each of the DISCRETELEGEND or\
    \ MERGEDLEGEND statements to add titles for the individual legends. Use the LEGENDTITLEPOSITION=\
    \ option to specify the position of the individual legend titles.\n\nThe TYPE=\
    \ option specifies whether the legends are arranged in a column or a row. When\
    \ you specify TYPE=ROW, you can use the WEIGHTS= option to specify the amount\
    \ of space that is available for each of the legends. The WEIGHTS= option can\
    \ be one of the following values:\n\n**UNIFORM**nspecifies all of the nested legends\
    \ are given an equal amount of space (default).\n\n**PREFERRED**nspecifies that\
    \ each nested legend is to be given its preferred amount of space.\n\n**weight-list**nspecifies\
    \ a space-delimited list of PREFERRED or number keywords where each keyword corresponds\
    \ to a nested legend.\n\n**PREFERRED**nspecicates that the corresponding legend\
    \ is to get its preferred size.\n\n**number**nspecifies a proportional weight\
    \ for the corresponding legend, which determines the percentage of the available\
    \ space that the legend gets. The total of the values does not need to be 1. When\
    \ PREFERRED and number keywords are used together, the PREFERRED legends are given\
    \ their preferred space. The remaining space is divided among the number legends\
    \ based on their weighted values.\n\nFor more information, see SAS Graph Template\
    \ Language: Reference.\n\nHere is an example that creates a global legend for\
    \ two plots.\n\n```\nproc template;\n    define statgraph foo;\n    begingraph;\n\
    \        lattice;\n            entrytitle=\"Asian Makes - Under $15,000\";\n```"
