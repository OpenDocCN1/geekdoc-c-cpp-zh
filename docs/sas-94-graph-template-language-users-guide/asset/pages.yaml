    # Range Attribute Maps


    A range attribute map allows you to map one or more colors to a range of values
    of a specific numeric column in a data set. It is typically used to visually group
    values into ranges where each range is depicted as a single color or color map.


    > Note: A RANGEATTRMAP can be used with a numeric column only.


    To create a range attribute map, you must do the following:


    +   - Use a RANGEATTRMAP block with one or more RANGE statements to define your
    attribute map. Use the RANGE statement RANGECOLOR=RANGECOLORMODEL to specify a
    color or color map for each range.

    - Use a RANGEATTRVAR statement to create an attribute variable that associates
    your attribute map with a numeric column in your data set.

    - Set the MARKERCOLORGRADIENT= or CORRESPONSE= option in your plot statement to
    the name of the attribute variable that you created in your RANGEATTRVAR statement.


    The RANGEATTRMAP block includes one or more RANGE statements that associate a
    range of values with a single color or color map. The syntax of the RANGE statement
    is as follows:


    ```

    RANGE low-value < < >> high-value / options

    ```


    The optional exclusion operator (<) can be placed after the low-value value or
    before the high-value value to exclude that from the range endpoint. The low-value
    and high-values can be an unformatted numeric value or a keyword. For low-value,
    keyword MIN, NEGMAX, or NEGMAXABS can be used instead of numeric value. For'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# 130 Chapter 6 Managing Graph Appearance: General Principles


    high-value, keyword MAX and MAXABS can be used. For information about the range
    keywords, SAS Graph Template Language: Reference.


    Note: If two ranges share a common endpoint, as 10-20 and 20-30, and no exclusion
    operator (<) is used, the common endpoint belongs to the lower range, which is
    10-20 in this case.


    The RANGEATTR statement also includes a NAME= option that enables you to specify
    a unique name for the range attribute. The RANGEATTR block must appear in the
    global definition area of the template between the BEGINGRAPH statement and the
    first LAYOUT statement. An ENDRANGEATTR statement is required to end the block.
    The block must contain at least one RANGE statement.


    The RANGEATVAR statement creates an association between a range attribute and
    a numeric column in your plot data set. To create the attribute variable, do in
    the following RANGEATVAR statement:


    +   Add a RANGEATVAR statement to the global definition area of your template
    between the BEGINGRAPH statement and the first layout statement.


    +   In the RANGEATVAR statement:


    +   Set the ATTRVAR=option to a unique name for range attribute map to data set
    column.

    Set the ATTRMAP=option to the value of the NAME= option that you used in your
    RANGEATTRMAP statement.

    Set the VAR=option to the numeric column in your plot data set with which the
    range attribute map is to be associated.


    After you create the range attribute map and the range attribute variable, in
    your plot data set, set the value of the option that maps the column values to
    colors that you specified with the ATTRMAP= option in your RANGEATVAR statement.


    > Note: The values and graphical attributes defined in a range attribute map cannot
    be displayed by DISCRETELEGEND.


    Here is an example of a template that creates and includes a range attribute map
    to the Weight column of a SCATTERPLOT statement data set in order to color the
    markers by weight range. It also creates a continuous legend.


    ```

    proc template;

    def statgraph attrrange;

    begingraph;

    /* Create the range attribute map. */

    attrmap name="scale";nrange 0-70 /*/

    rangecolor=black; /* 0 to 70 exclusive */

    range 70-107 /*/

    rangecolor=blue; /* 70 to 107 inclusive */

    range 107-125 /*/

    rangecolor=green; /* 107 exclusive to 125 inclusive */

    range 125-200 /*/

    rangecolor=red; /* 125 exclusive to 200 inclusive */

    endattrmap;


    /* Create the range attribute variable. */

    rangeattrvar attrvar=weightrange var=weight attrmap="scale";


    /* Create the graph. */

    ```'
