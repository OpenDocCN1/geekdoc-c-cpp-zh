- img_proc: true
  md: '# Executing the Template to Produce the Graph


    It should be noted that STATGRAPH template syntax requires that any necessary
    arguments be specified (X= and Y= arguments are required for both the SCATTERPLOT
    and REGRESSIONPLOT statements), but no checking for the existence of the assigned
    variables is performed at compile time. Also note that no reference to an input
    data sets are in the template.


    Compiling the template does not produce a graph—it creates a compiled template
    that can be executed to produce a graph.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_24_0.png)


    To verify that the template was created, you can issue the ODSTEMPLATE command
    (ODST, for short). This opens the Templates window where you view all item stores
    and their contents. All STATGRAPH templates can be identified by the icon shown
    above.


    You can also browse the source for any compiled template by double-clicking on
    its name.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_24_1.png)


    For more information about item stores and PROC TEMPLATE in general, see SAS Output
    Delivery System: User''s Guide.


    # Executing the Template to Produce the Graph


    To produce a graph, use the SGREND procedure:


    ```

    proc sgrender data=sashelp.class template=modelfit; run;

    ```


    The SGREND procedure takes two required arguments: DATA= for the input data set
    and TEMPLATE= for the STATGRAPH template to be used.'
  merge: -1
  pgno: 24
