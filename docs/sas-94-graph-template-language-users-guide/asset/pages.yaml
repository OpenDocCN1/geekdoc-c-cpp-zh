  md: '# 80 Chapter 5 • Managing Axes in an OVERLAY Layout


    (10), which equals 3. Measuring the threshold distance of 3 from 0 yields 3, so
    if the lowest value is between 0 and 3, a tick mark is displayed at 0. In this
    case, the lowest value is 5 and is not within this threshold, the tick mark at
    0 is not displayed.


    Thresholds are important when you want the Y and Y2 (or X and X2) to have ticks
    marked at equivalent locations on different scales. By preventing “encompassing”
    ticks from being drawn, you can ensure that the axis ranges for the two correctly
    align. The following example accepts the default minimum and maximum data values
    for each axis. Note that the five scatter points for each plot are superimposed
    exactly.


