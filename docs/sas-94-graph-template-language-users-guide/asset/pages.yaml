- img_proc: true
  md: '# Using PROC SGPANEL to Create Classification Panels


    When creating a panel like the one shown in “Using Non-computed Plots in Classification
    Panels” on page 291, you might find it easier to create the panel by using PROC
    SGPANEL in SAS because the procedure does all the necessary computations for you.
    For example, the REGRESSIONPLOT, LOESSPLOT, and PBSLINE statements have been incorporated
    into the SGPANEL procedure as REG, LOESS, and PBSLINE statements. (SGPANEL can
    also generate other plot types.) By default on PROC SGPANEL, the PANELBY statement
    creates a DATAPANEL layout.


    ```

    ods html style=statistical;

    ntitle "Predicted Response to Dosage (mg) over Time*";

    proc sgpanel data=trial;

    panelby dose / rows=1;

    reg x=days y=response / cl clm;

    run;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_304_0.png)


    Most, but not all, features of the DATALLICE and DATAPANEL layouts are provided
    in the SGPANEL procedure.


    The SGPANEL procedure supports plot statements such as HISTOGRAM, DENSITY, DOT,
    VBOX, and HBOX (vertical and horizontal box plots). The PANELBY statement controls
    the layout, determining whether a DATAPANEL, DATALLICE, or other layout is used
    to produce the graph. ROWAXIS and COLAXIS statements control the external axes,
    and the KEYLEGEND statement creates legends, which are placed in sidebars for
    you.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'The SGPanel procedure does not have a PROTOTYPE block because all of the plot
    statements after PANELBY are considered part of the prototype. The SGPanel procedure
    generates GTL template code behind the scenes and executes the template to create
    its output. See SAS ODS Graphics: Procedures Guide for details.


    The following example shows additional features of SGPanel:


    ```

    ods html style=statistical;


    title "Cholesterol Distribution by Gender and Weight";

    sproc sgpanel data=sashelp.heart;

    layout=lattice onepanel varname;

    panelby sex weight_status /

    hist cholesterol;

    density cholesterol / name="density";

    refline 227 / axis=x name="ref" legendlabel="Overall Mean = 227";

    rowaxisis offsetmin=0 offsetmax=.1 max=30;

    keylegend "density" "ref";

    run;

    ```'
  merge: -1
  pgno: 305
