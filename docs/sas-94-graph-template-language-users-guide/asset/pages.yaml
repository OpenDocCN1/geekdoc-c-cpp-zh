    ![](img/a9ccb6123dee40d424cb295a3a99c16c_215_0.png)


    You can think of a GRADIENT contour as a FILL contour with a very large number
    of levels. A color ramp is displayed with an axis that shows reference points
    that are within the data range. The number of reference points is determined by
    default.


    When a CONTINUOUS legend is used in a plot that uses gradient color, the VALUESCOUNT=
    and VALUESCOUNTHINT= options can be used to manage the legend''s gradient axis.
    These options are similar to the NLEVELS= and NHINT= plot options.


    ```

    continuouslegend "cont" /

    title="Density"

    valuecounthint=5;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_215_1.png)


    ```

    continuouslegend "cont" /

    title="Density"

    valuecounthint=10;

    ```'
