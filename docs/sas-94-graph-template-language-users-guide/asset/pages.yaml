    \ the tick marks at the midpoints instead of on the midpoints.\n\n# Avoiding Tick\
    \ Collisions\n\nFit Policies for Discrete Axes\nTo avoid tick-value collisions,\
    \ a DISCRETE axis uses several of the fit policies that a LINEAR axis uses. These\
    \ policies include THIN, ROTATEALWAYS, STAGGER, ROTETHIN, STAGGERTHIN, and STAGGERROTATE.\
    \ For information about these policies, see \"Avoiding Tick Collisions\" on page\
    \ 88. A DISCRETE axis supports additional fit policies that enable you to:\n\n\
