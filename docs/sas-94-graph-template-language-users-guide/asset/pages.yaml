    # Adding and Removing Items from a Discrete Legend


    # Adding Items to a Legend


    You can use the LEGENDITEM statement to manually add items to your legend that
    do not appear in your plot. This enables you to provide additional information
    about your plot or build a common legend that you can use with multiple plots.
    The syntax of LEGENDITEM statement is as follows:


    ```

    LEGENDITEM TYPE=Entry NAME=LegendName / options

    ```


    You must place the LEGENDITEM statement in the global definition area of the template
    between the BEGINGRAPH statement and the first layout statement. The TYPE=Entry
    option specifies the type of entry that you want to add to your legend.

    EntryType can be one of the following:


    +   - LINE

    - MARKER

    - MARKERLINE


    TEXT

    Options to set the desired appearance for the entry, such as color, pattern, font,
    and so on. Note the following about the LEGENDITEM statement:


    +   - You can specify any supported set of attributes for a legend item regardless
    of its type. However, sets of attributes that are not applicable to the legend
    item type are ignored. For example, in the LEGENDITEM statement, if TYPE=FILL
    and the MARKERATTRIBUTES=( ) option is specified, ignored.

    - When TYPE=TEXT, if the TEXT=option is not specified in the LEGENDITEM statement,
    a blank space is used by default.


    Here is an example of a LEGENDITEM statement that adds item 17 to the legend of
    a height-to-weight chart that is grouped by age. The new item uses a red-filled
    star as a marker.


    ```

    proc template;

    def statgraph additem;

    dynamic legenditem;

    BeginGraph;

    entrytitle="Height vs. Weight By Age";

    legenditem type=marker name="newitem" / label="17";

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_205_0.png)'
