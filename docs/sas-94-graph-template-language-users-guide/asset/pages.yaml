  md: "# Chapter 9\nUsing a Simple Multi-cell Layout\n\n+   The LAYOUT GRIDDED Statement\
    \ ................................................................ 211\nDefining\
    \ a Basic Grid ...................................................................................................\
    \ 212\n  Setting Grid Dimensions ......................................................................................\
    \ 212\n  Setting Gutters .......................................................................................................\
    \ 214\n  Defining Cells ..................................................................................................................\
    \ 214\nBuilding a Table of Text .......................................................................................\
    \ 217\n  Using a Single Layout ......................................................................................\
    \ 217\n  Using Nested Layouts .........................................................................................\
    \ 217\nSizing Issues ................................................................................................................\
    \ 218\n  Row and Column Sizes ......................................................................................\
    \ 218\n  Adjusting Graph Size ............................................................................................\
    \ 221\n\n# The LAYOUT GRIDDED Statement\n\nThe GTL provides several layout types\
    \ to organize your graph into smaller regions (cells). The GRIDDED and LATTICE\
    \ layouts support a regular grid of cells with a fixed number of rows and columns.\
    \ The DATALLICE and DATAPANEL generate classification panels, which are graphs\
    \ where the number of cells and the cell content are determined by the values\
    \ of one or more classification variables.\n\nThe GRIDDED layout differs from\
    \ the classification layer panels in that the number of cells must be predefined\
    \ and that you must define the content of each cell separately. GRIDDED is superbly\
    \ similar to a LATTICE because it can create a grid of heterogeneous plots. The\
    \ LATTICE layout can automatically plot areas across rows and columns and has\
    \ much more functionality. For more information about the LATTICE layout, see\
    \ Chapter 10, “Using an Advanced Multi-cell Layout,” on page 225.\n\nTypical applications\
    \ of GRIDDED layouts are to create:\n\n+   * a table of text, such as an inset\
    \ (discussed in detail in Chapter 17, “Adding In to a Graph,” on page 355)\n\n\
    +   * a simple grid of plots (discussed in this chapter)\n\nIn a GRIDDED layout,\
    \ each cell is independent. Contents of the cell can be specified by a stand-alone\
    \ plot statement or a nested layout. The following example shows a very simple\
    \ GRIDDED layout:\n\n```\nproc template;\n```"
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 212 Chapter 9 • Using a Simple Multi-cell Layout


    ```

    define statgraph intro;

    beginingraph;

    entrytitle "Two-Cell Gridded Layout";nlayout gridded;

    barchart category=age;

    scatterplot x=height y=weight;

    endlay;

    endgraph;

    end;

    run;

    ```


    ```

    proc sgender data=sashelp.class template=intro;

