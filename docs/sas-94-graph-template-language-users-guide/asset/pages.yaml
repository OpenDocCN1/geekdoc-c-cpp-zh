    When the legend is dropped from the graph, see the following log note:


    > NOTE: Some legends have been dropped due to size constraints. Try adjusting
    the MAXLEGGENDAA, WIDTH= and HEIGHT= options in the ODS GRAPHICS statement.


    In such cases, use the WIDTH= and HEIGHT= options in the ODS GRAPHICS statement
    to increase the graph area so that at some point the legend is displayed.


    Another alternative is to use the MAXLEGDA= to change the threshold area where
    legends drop out. The following specification allows all legends to occupy up
    to 40% of the graph area:


    ```

    ods graphics / maxlegendarea=40;

