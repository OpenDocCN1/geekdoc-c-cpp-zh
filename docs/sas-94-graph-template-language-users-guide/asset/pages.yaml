  md: '# Controlling the Interactions of Classifiers


    Whenever you have classifiers with a large number of unique levels, the potential
    exists for generating a large number of cells in the panel. If you do not want
    to see all classification levels, you can limit the crossings by a WHERE expression
    when creating the input data. Or, you can use a WHERE expression as part of the
    PROC SGREND step that renders the graph.


    # Appearance of the Last Panel


    If you set the ROWS= and COLUMNS= to define a relatively small grid, PROC SGREND
    automatically generates as many separate panels as it takes to exhaust all the
    classification levels. Depending on the grid size and total number of classification
    levels, one or more empty cells might be created on the last panel to create the
    grid. For example, if you have six classification levels and define a 2x2 grid,
    two panels are created (with different names), and the last panel contains one
    empty cell:


    ```

    layout datapanel classvars=(product_category) /

    rows=2 labels=displayvalue

    rowaxis=grid(display=offset=0)

    display=(tickvalues) lineopts=(tickformat=$dollar12.);

    layout prototype;

    barchart category-year response=profit / fillattrs=GraphData;

    endlayout;

    sidebar / align=top;

    entry "Profit for Selected Items" */

    etextatrs=GraphTitleText;

    endsidebar;

    layout;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_289_0.png)'
  merge: -1
