  md: "# Avoiding Plot Conflicts\n\nIn GTL, it is important to know what types of\
    \ axes a given plot requires or can support. If you understand the basic ideas\
    \ behind previous examples, you can use the following GTL syntax to avoid some\
    \ of the problems caused by the first plot statement deciding the axis type:\n\
    \n+   - use the PRIMARY=TRUE option on a plot statement to ensure that plot is\
    \ used to determine the axis type\n- declare an axis type on the layout.\n\nMost\
    \ non-dependent plot statements support the PRIMARY= option. By default, PRIMARY=TRUE\
    \ for the first plot and PRIMARY=FALSE for the rest of the plots in the layout.\
    \ On a per-axis basis, only one plot in an overlay can use PRIMARY=TRUE. If multiple\
    \ plots specify PRIMARY=TRUE for the same axis, only one encountered is considered\
    \ primary. The plot that is designated as primary by default defines the axis\
    \ types for the axes it uses, regardless of its order within the layout block.\
    \ This is useful when you want a certain ordering for the plots, but do not want\
    \ the first plot to set the axes, such as axis type and default axis label.\n\n\
    In the following example, the BARCHART sets the X axis to DISCRETE and the Y axis\
    \ to LINEAR:\n\n```\nlayout overlay;\n  scatterplot x-age y=weight;\n  barchart\
    \ category=age response / primary=true ;\nendlayout;\n```\n\nAll layouts that\
    \ manage axes options allow you to control the axis features. The following example\
    \ shows how to declare an axis type for the X axis. Any plot in the layout that\
    \ cannot support a discrete axis is dropped. Also note that specifying an axis\
    \ type overrides the default axis type that is derived from the primary plot.\
    \ Axis options are discussed in detail in Chapter 5, \"Managing Axes in an OVERLAY\
    \ Layout,\" on page 63.\n\n```\nlayout overlay / xaxisopts=(type=discrete);\n\
    \  scatterplot x-age y=weight;\n  barchart category=age response=weight;\nendlayout;\n\
    ```\n\nSome combinations can never be used. A histogram and bar chart look similar,\
    \ but they have different data and axis requirements. The histogram must use a\
    \ linear X axis and the bar chart must use a discrete X axis. The two plot types\
    \ can never be overlaid.\n\n```\nlayout overlay;\n  histogram age;\n  barchart\
    \ category=age;\nendlayout;\n```\n\n> WARNING: HISTOGRAM statement has a conflict\
    \ with the axis type. The plot will not be drawn.\n\n```\nlayout overlay;\n  histogram\
    \ age;\n  barchart category=age;\nendlayout;\n```"
  merge: -1
  pgno: 66
