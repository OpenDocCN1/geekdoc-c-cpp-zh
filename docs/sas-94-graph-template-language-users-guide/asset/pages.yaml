    \ take place to optimize the appearance of the output. Among the differences between\
    \ default size graphs and smaller graphs that have scaled down font sizes. Also,\
    \ the numeric axes may display a reduced number of ticks and tick values. Thus,\
    \ the graphs that you generate from the example programs will not always look\
    \ identical to the graphs that are shown in the figures. However, both graphs\
