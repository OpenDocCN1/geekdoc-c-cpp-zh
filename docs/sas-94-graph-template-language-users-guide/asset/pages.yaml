  md: '# Features of Discrete Legends 203


    > WARNING: DISCRETELEGEND statement with DISPLAYCLIPPED=FALSE is getting clipped.

    The legend will not be drawn.


    To investigate this problem, you can specify DISPLAYCLIPPED=TRUE in the DISCRETELEGEND
    statement, which forces the legend to display so that you can visually inspect
    it.


    ```

    discreetlegend "sp" / title="Name" across=2 halign=right displayclipped=true;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_212_0.png)


    In the current example, it is apparent that the height chosen for the output is
    not large enough to display the title and all entries in two columns. The problem
    can be fixed in any of the following ways:


    +   - increasing the graph height (HEIGHT in the ODS GRAPHICS statement or DESIGNHEIGHT=
    in the BEGININGGRAPH statement)

    - relocating the legend and reorganizing it with the ACROSS= or DOWN= options

    - setting DISPLAYCLIPPED=TRUE if you are willing to see only a portion of the
    legend

    - reducing the font size for the legend entries (and possibly the title).


    To change the font size of the legend entries, use the VALUEATTRS option on the
    legend statement. To change the font size of the legend title, use the TITLEATTRS-option.
    Normally, the legend entries are displayed in 9pt, and the legend title is displayed
    in 10pt. The following example reduces the size of legend text:


    ```

    discreetlegend "sp" / title="Name" across=2 halign=(size=7pt) valueattrs=(size=8pt);

    ```


