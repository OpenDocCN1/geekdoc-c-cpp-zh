    The DATAPANEL AND DATALLICE layouts support options that control the background
    and text properties of the classification headers. By default, the background
    of the cell headers is transparent (HEADEROPAQUE=FALSE).


    To set a background color, you must set the HEADERBACKGROUND-option to a fill
    color. In the following example, the color is set as a style reference. You must
    also set HEADEROPAQUE=TRUE. You can use the HEADERLABELATTRS-option to set the
    text properties of the classification headers. For example, if the classification
    values are long, you can reduce their font size with HEADERLABELATTRS=(SIZE=pt),
    or use the smallest font in the current style setting to be bold.


    ```

    layout datalattice rowvar=product_group /

    rowdatatype=union

    rowgutter=5px

    rowheaders=left

    headerlabelid=headerisplay=value

    headerlabelattrs=(weight-bold)

    headeropaque=true

    headerbackgroundColor=GraphAltBlock:color

    columnxaxisisopts=(display=(tickvalues))

    rowawaxisisopts=(display=none displaysecondary=(tickvalues))

    linearopts=(tickvalueformat=dollar2)

    griddisplay=on offset=0);

    ```'
