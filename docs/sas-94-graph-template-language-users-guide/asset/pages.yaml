    Note: When a row or column external axis is used, all options on the internal
    axes in that same dimension are ignored.


    The following code fragment externalizes the Y axis:


    ```

    layout lattice / columns=2 colgutter=5px

    columdatarange=unionall

    rowdatarange=union;


