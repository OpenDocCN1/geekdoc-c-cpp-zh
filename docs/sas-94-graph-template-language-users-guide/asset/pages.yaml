  md: 'Using HALIGN= and VALIGN= options, you can place a legend in eight positions
    outside the plot wall. The only combination that is not supported is HALIGN=CENTER
    and VALIGN=CENTER. To accommodate the legend, the size of the plot wall is adjusted
    so that the legend(s) can be displayed.


    Note: With large legends, this size adjustment causes problems. Issues are discussed
    in "Arranging Legend Entries into Columns and Rows" on page 192 and "When Discrete
    Legends Get Too Large" on page 201.


    The following example positions the legend in the outside-right location.


    ```

    layout overlay;

    scatterplot X=Height Y=Weight /\nname="sp" group=sex;

    discretelegend "sp" /\nhalign=right valign=center ;

    endlayout;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_190_0.png)


    # Displaying Legends inside the Plot Wall


    A legend can be placed inside the plot wall (LOCATION=INSIDE) and positioned with
    the HALIGN= and VALIGN= options. Nine inside positions are possible. The defaults
    are HALIGN=CENTER and VALIGN=CENTER. The following example positions the legend
    in the inside bottom right location.


    ```

    layout overlay;

    scatterplot X=Height Y=Weight /\nname="sp" group=sex;

    discretelegend "sp" / location=inside\nhalign=right valign=bottom ;

    endlayout;

    ```'
