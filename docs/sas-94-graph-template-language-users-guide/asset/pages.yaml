    Note: Custom style Stocks was created in Table 6.1 on page 136.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_149_0.png)


    Source: SASHELP.STOCKS


    In this example, the groups are ordered in the order in which they appear in the
    Sashelp.Stocks data set. Assume that you want to arrange the groups in ascending
    order. One way to do this is to use the SORT procedure to create a sorted data
    set to use with your plot. Here is an example.


    ```

    proc sort data=sashelp.stocks out=stocks;

    by descending stock;

    run;

    ```


    ```

    ods html style=stocks;

    ```'
