    # Adding Insets to Classification Panels


    This section requires familiarity with coding classification panels in the Graph
    Template Language GTL. If you are not familiar with classification panels, see
    Chapter 11, "Using Classification Panels" on page 257.


    # About Insets in Classification Panels


    The DATALLATTICE and DATAPANEL layouts provide INSET= and INSETOPTS= for displaying
    insets in classification panels. The INSETOPTS= option supports the same appearance
    and features as those documented for the SCATTERPLOTMATRIX statement in "Adding
    Insets to a Graph" on page 369. Unlike, the SCATTERPLOTMATRIX statement, predefined
    information is not available for the DATALLATTICE and DATAPANEL layouts. Thus,
    for the INSET option, you must create the columns for the information you want
    to display in the inset and merge the input data before the graph is rendered.
    You can merge the inset data and analysis data by using match-matching (BY statement)
    or by using one-to-one mapping (BY statement). The manner in which the data is
    merged is referred to as the data scheme for classification panels. The DATASCHEME=
    option is used to specify the data scheme that was used to merge your inset and
    analysis data.


    After you have merged the inset and analysis data, in your LAYOUT DATAPANEL or
    LAYOUT DATALLICE statement, do the following:


    +   - use INSET= to specify the name of one or more columns that contain the information
    you need for your insets.'
  merge: -1
  pgno: 381
- img_proc: true
  md: "# Adding Insets to Classification Panels 373\n\n+   * Use the DATASCHEME= option\
    \ to specify the data schema that you used to merge your inset and analysis data\
    \ as LIST (one-to-one merging) or MATCH (match-merging).\n\nNote: The-matching\
    \ data schema is the preferred data schema for merging the inset and analysis\
    \ data.\n\nThe following sections describe how to add insets by using match-merged\
    \ and one-to-merged data.\n\n# Adding Insets By Using the Match-Merging Data Schema\n\
    \nThe matchmerged data schema merges the inset and analysis data according to\
    \ variables listed in a BY statement. By default, the LAYOUT DATAPANEL and LAYOUT\
    \ DATALACE statements assume one-to-one merging was used to merge the data. To\
    \ specify the match-merged data schema, you must include the DATASCHEME=MATCH\
    \ option in your LAYOUT DATAPANEL or LAYOUT DATALACE statement. This example shows\
    \ how to use the match-merging data schema to merge your inset and analysis data,\
    \ and how to add the insets to your classification panel. This example uses the\
    \ Sashelp.Cars data set as the source.\n\nHere are the high-level steps that are\
    \ performed in this example:\n\n+   1. Generate the inset from the Sashelp.Cars\
    \ data set and write it to the Mileage data set.\n\n+   2. Sort the Sashelp.Cars\
    \ data by Cylinders, Origin, and Type, and then write the sorted data to the Cars\
    \ data set.\n\n+   3. Use match-merging to merge the Cars and Mileage data sets\
    \ by Cylinders and Origin, and then write the merged data to the AvgMileage data\
    \ set.\n\n+   4. Create the template for the classification panel.\n\n+   5. Generate\
    \ the graph using the AvgMileage data.\n\nHere is the SAS code that generates\
    \ the inset data from the Sashelp.Cars data set, and writes it to the Mileage\
    \ data set.\n\n```\n/ Generate the inset information and write it to data\nset\
    \ MIAGE;\n\nproc summary data=sashelp.cars completetypes;\n  where in ('Sedan'\
    \ 'Truck' 'SUV')\n  and cylinders (4 6 8)\n  class cylinders origin;\n  var mpg_city;\n\
    \  output outmileage=Mean N/Nobs / nonhit;\n  types CYLINDERS*ORIGIN;\n;\n```\n\
    \nThe SUMMARY procedure calculates the number of observations and the mean of\
    \ MPG_City for each of the classification interactions interacted with THE TYPES\
    \ statement. Cylinder*Origin is the type that each cell's bar chart needs. The\
    \ COMPLETETYPES option creates summary observations when the frequency of the\
    \ classification interactions is zero. In addition, the code creates subsets in\
    \ the inset data to restrict the number of bars in each bar chart to at most three,\
    \ and to reduce the number cells in the classification panel. There are three\
    \ values of Origin (Asia, Europe, USA) and three values of Cylinders (4, 6, and\
    \ 8)."
