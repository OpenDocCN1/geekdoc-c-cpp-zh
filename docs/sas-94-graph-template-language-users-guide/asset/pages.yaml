  md: '# Controlling the Appearance of Grouped Data for All Graphs in a Template


    # Options That Override Style Attributes for All of the Plots in a Template


    You can use options in the BEINGGRAPH statement to override various style attributes
    for all of the plots that are defined in a template. The following table lists
    the options you can use.


    | BEINGGRAPH Option | Description |

    |---|---|n| ATTPRORITY= | Specifies a priority for the cycling of the attributes
    from the Graph1-GraphData style elements. "Attribute Rotation Patterns" on page
    145. |

    | DATACOLORS= | Specifies the list of colors that replace the graph data colors
    from the Graph1-GraphData style elements. |

    | DATACONTRASTCOLORS= | Specifies the list of contrast colors that replace the
    graph data colors from the Graph1-GraphData style elements. |

    | DATASYMBOLS= | Specifies the list of marker symbols that replace the graph data
    symbols from the marker symbols that are defined in the Graph1-GraphData style
    elements. |

    | DATALINEPATTERNS= | Specifies the list of line patterns that replace the graph
    data line patterns from the Graph1-GraphData style elements. |


    These options apply to all of the plots that are defined in the template. They
    affect the attribute assignments when the following criteria are true:


    +   * the GROUP= option is used on a plot statement

    * attribute options used in LINEATTRS= or MARKERATTR= reference a graph1-GraphData
    style element

    * the CYCLEATTRS=TRUE option is in effect in an overlay-type layout


    You can override the attributes that are defined by these options on a per-plot
    basis by using attribute or a reference to an attribute map on the plot.


    # Overriding the Fill Colors


    You can use the DATACOLORS=(color-list) to override the fill colors that are defined
    in the current style''s Graph1-GraphData style elements. When you use the DATACOLORS=
    option, the fill colors rotate through the colors that are specified in the color
    list rather than the colors that are specified in the current style''s Graph1-GraphData
    style elements. This rotation pattern enables you to use the same colors in your
    plots regardless of the style that is in effect.


    Here is an example that specifies the fill colors very red, very light green,
    and light blue for the three group values of a grouped bar chart.


    ```

    proc template;

    ```'
