    # # Positioning an Inset


    If a table of text is used as an inset within a 2-D overlay-type layout, you can
    position the table within the parent layout with options on the LAYOUT GRIDDED
    statement. You can use the AUTOALIGN= option to automatically position the inset
    to avoid collision with scatter points, lines, bars, and other plot components.


    Alternatively, you can use the HALIGN= and VALIGN= options to position the table
    absolutely. The combined values provide nine possible positions. The disadvantage
    of using the HALIGN= and VALIGN= options is that they do not attempt to avoid
    collision with other plot components.


    The following example uses the AUTOALIGN= option to restrict the table position
    to one of the upper corners of the plot area.


    ```

    proc template;

    def statgraph getset3a;

    begingraph;

    entytitle "Auto-positioning the Inset Within the Plot Wall";nlayout overlay;

    histogram mw;

    layout gridded / columns=1 border=true autalign=(topleft topRight);

    entry halign=left "N" halign-right="5203";nentry halign=left "Mean" halign-right="119.96"

    entry halign=left "Std Dev" halign-right="19.98";nendlayout;

    endlayout;

    endgraph;

    end;

    run;

    proc sgender data=sashelp.heart template=getset3a;

    run;

    ```


