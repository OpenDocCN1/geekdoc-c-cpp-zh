    # Producing Surface Plots


    A surface plot shows points that are defined by three continuous numeric variables
    and connected with a polygon mesh. A polygon mesh is a collection of vertices,
    edges, and faces that define the shape of a polyhedral object, which simulates
    the surface. In order for a surface to be drawn, the input data must be “gridded”.
    That is, the X and Y ranges are split into uniform intervals (the grid), and the
    corresponding Z values are computed for each X,Y pair. Smaller data grid intervals
    produce a smoother surface because smaller polygons are used but more resource
    intensive because of the large number of polygons that are generated. Larger data
    grid intervals produce a coarser, faced surface because the polygon mesh has fewer
    and less intensive.


    The faces of the polygons can be filled, and lighting is applied to the polygon
    mesh to create the 3D effect. It is possible to superimpose a grid on the surface.
    The grid display is a sampling of the data grid boundaries that intersect the
    surface. The grid display can be thought of as a simpler see-through line version
    of the surface and can be rendered with or without displaying the filled surface.


    The default appearance of a surface is a filled polygon mesh with superimposed
    grid lines.


    ```

    surfaceplotparam x=length y=width z=depth;

    ```'
