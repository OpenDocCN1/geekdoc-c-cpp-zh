    Valid GTL expressions are used in WHERE expressions. See THE WHERE statement in
    Base SAS for a comprehensive list of operators and operands. Unlike WHERE expressions,
    however, GTL expressions do not perform operations that create subsets. For example,
    the difference between the result of a WHERE expression and that of a logical
    GTL expression on a column is that the GTL expression returns a Boolean value
    for each observation, without changing the number of observations.


    For example, for the := argument does not reduce the number of observations that
    are plotted.


    ```

    scatterplot x=name y=equal(height between 40 and 60);

    ```


    Instead, the computed numeric column for the := argument consists of 0s and 1s,
    based on whether each observation''s HEIGHT value is between 40 and 60.


    Whenever expressions are used to create new columns, a new column name is internally
    manufactured that it does not collide with other columns in use.


    # Expressions in Statement Syntax. Through GTL documentation, you see expression
    used in statement documentation:


    ```

    BOXPLOT X=column | expression <option(s)>;

    ```


    ```

    Y=numeric-column | expression <option(s)>;

    ```


    For the X=argument in this BOXPLOT syntax, expression means any EVAL(expression)
    that results in either a numeric or character. An expression that yields a valid
    is not valid.


    For the Y=argument, expression means any EVAL(expression) that results in a numeric
    column. The expression cannot result in a character column or any constant.


    ```

    REFERENCE X=x-axisvalue | column | expression <option(s)>;

    ```


    For a single line in REFERENCE syntax, the X-argument can be a constant or x-axisvalue.
    For multiple lines, it can be a column. In either case, the supplied value(s)
    must have the same data type as the axis. Thus, EVAL(expression) can result in
    a constant, or it can result in a numeric or character column. In either case,
    the type of the result must agree with the axis type.


    Type Conversion in GTL Expressions. Although expressions that are used in a DATA
    perform automatic type conversion, GTL expression evaluation does not. Thus, you
    must use one or more functions to perform type conversions in an expression. Otherwise,
    the expression generates an error code without warning when the template is compiled.


    For example, consider the following GTL expression:


    ```

    if(substr(value, 1, 2) = "11")

    ```


    This expression uses the SUBSTR function to determine whether the first two characters
    from VALUE evaluate to the string "11". If VALUE is a string, the expression'
