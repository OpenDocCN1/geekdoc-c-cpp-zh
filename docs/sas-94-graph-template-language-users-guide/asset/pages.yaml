    # Arranging Legend Entries into Columns and Rows


    # Default Legend Item Arrangement


    The arrangement of the entries in a legend is affected by the number of entries
    in the wide legend, the length of the entry labels, and the size of the graph.
    When the graph is wide enough, all legend information can fit into one row as
    shown in the following figure.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_201_0.png)


    Note: When all the legend entries and the legend title fit in one row, the legend
    title is drawn on the left as shown in the following graph. This is to conserve
    the vertical space that is used by the legend.


    When the legend entries and the legend title cannot fit into one row, the legend
    title and entries are wrapped into multiple rows in order to fit the allotted
    space. In the following graph, the width of the graph is reduced to the point
    where it causes the legend entries to wrap into an additional row. Because the
    legend needs this extra row, the height of the plot wall must be reduced, leaving
    less room for the data display. Also, because the legend entries and title do
    not fit in one row, the title is now drawn above the legend entries.'
