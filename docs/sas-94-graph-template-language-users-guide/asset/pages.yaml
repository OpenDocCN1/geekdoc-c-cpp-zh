    plot matrices. You can add titles, footnotes, legends, and other graphics elements
    to your graphs. You can save your graphs as image files for inclusion in other
    documents, or as ODS Graphics Designer (SGD) files that you can edit later using
    the ODS Graphics Editor.


    For more information about the SAS ODS Graphics Designer, see the SAS ODS Graphics
    Designer: User''s Guide.


    # The Graph Template Language


    # Overview of the Graph Template Language


    The Graph Template Language is the heart of ODS Graphics. All of the graphs that
    are created by the SAS analytical procedures and by the SAS Statistical Procedures
    are generated using GTL. Users who need to go beyond the graphs created by these
    procedures can use GTL directly to design their graphs using the TEMPLATE and
    SGREND procedures. To successfully create or modify GTL templates, you need the
    information in this guide, which helps you understand important concepts and offers
    many code examples illustrating often used features. You also need to access the
    SAS Graph Template Language: Reference, which is the language dictionary for GTL.


    Creating a graph GTL is a two-step process:


    +   1. Define the structure of the graph using the GTL syntax in a STATGRAPH template
    that is specified in the TEMPLATE procedure. Compile and save this template

    2. Create the graph by running the SGREND procedure to associate the appropriate
    data with the template.


    # Defining the Graph Template


    GTL uses a structured "building-block" approach to defining a graph. The syntax
    provides a set of layout, plot, and other statements to define the graph. GTL
    1.1 on page 5 shows a graph of car profiles by horsepower and the syntax necessary
    to define the graph using GTL.


    Figure 1.1 ODS Graph and the Template to Generate


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_14_0.png)


    The template definition consists of the following parts:'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 6 Chapter 1 • ODS Graphics


    +   A. The GTL syntax block from BEGINGRAPH to ENDGRAPH.

    B. The title for the graph.

    C. The LAYOUT OVERLAY block. The results of the statements in this block are overlaid
    in the graph.

    D. A histogram of the Horsepower column.

    E. A density plot of the Horsepower column.


    Running the program in Figure 1.1 on page 5 creates the CARS template and saves
    it in an item store.


    # Creating the Graph


    To create the graph in Figure 1.1 on page 5, the SGRENDER procedure is run to
    associate the appropriate data set with the complete template:


    ```

    proc sgrender data=sashelp.cars template=cars; run;

    ```


    In the template, the Horsepower column is used explicitly for the HISTOGRAM and
    DENSITYPLOT statements. The explicit reference in the template to a column named
    Horsepower requires that the data set have a numeric column named Templates. Chapter
    14, on page 327 shows you how to make the template more flexible.


    The GTL supports a variety of layout, plot, and other statements to create a wide
    range of graphs. Details on all these statements and options are covered in this
    guide and in the SAS Graph Template Language: Reference.


    # When GTL Is Needed


    +   The graphs that are created by the analytical procedures use predefined GTL
    templates. These templates are designed by SAS procedure writers and shipped with
    SAS. Sashelp.Tmplint item store. To customize these templates, you must develop
    a basic understanding of the GTL.

    Often analysts need graphs of the data before an analysis can be started. Or,
    the results of a complex analysis involving multiple procedures or DATA steps
    need to be presented as graphs. Although many of these tasks can be accomplished
    using SG Procedures, those procedures do not provide many of the advanced layout
    capabilities of GTL. To create such custom graphs, you must develop a basic understanding
    of the GTL.


