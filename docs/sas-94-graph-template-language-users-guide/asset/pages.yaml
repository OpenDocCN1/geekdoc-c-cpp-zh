    a cluster with no space between the bars as shown. You can adjust the DISCRETEOFFSET=
    and BARWIDTH option values to overlap the bars or add space between the bars in
    each chart as desired.


    # TIME Axes


    # Overview of TIME Axes


    TIME axes are numeric axes that display SAS date or time values in an intelligent
    way. Such axes are created whenever the plot has a SAS date, time, datetime format
    associated with a column that is mapped to an axis. In the following example,
    the Date column has a SAS date value format associated with it. By default, the
    TIME axis decides an appropriate tick value and an interval to display. Note that,
    in the default case, when the X or X2 axis is a TIME axis, the axis is used for
    splitting the values at appropriate date or time intervals and extracting labels.
    In this example, the column format for the Date column could be MMDDYY or any
    other date-type format. The actual format serves only as a hint and is not used
    directly, unless requested.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '```

    layout overlay;

    seriesplot x=date y=close;

    endlayout;

    ```


    # Default Time Axis


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_107_0.png)


    Note: In this example, the data range for DATE was from 1Jan2004 to 1Dec2005.
    The TIME axis chooses the interval ofMONTH to display tick values. The had data
    range being large, 1Jan1998 to 1Dec2005, the TIME axis would choose a larger interval,
    YEAR, to display by default.


    # Setting the Tick Values


    You can use the INTERVAL= option to select different date or time intervals to
    display. The default interval is AUTO, which chooses an appropriate interval,
    based on the data and the column format.


    | Value on INTERVAL= | Unit | Tick Interval | Default Tick Value Format |

    |---|---|---|---|

    | AUTO | DATE, TIME, or DATETIME | automatically chosen | automatically chosen
    |

    | SECOND | TIME or DATETIME | second | TIME8. |

    | MINUTE | TIME or DATETIME | minute | TIME8. |

    | HOUR | TIME or DATETIME | hour | TIME8. |

    | DAY | DATE or DATETIME | day | TIME9. |

    | TONDAY | DATE or DATETIME | ten days | TIME9. |

    | WEEK | DATE or DATETIME | seven days | TIME9. |'
