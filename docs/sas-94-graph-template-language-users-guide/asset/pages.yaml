- img_proc: true
  md: "# Minimal Required Syntax\n\nConsider the following GTL template definition:\n\
    \n```\nproc template;\n  define statag mygraphs.scatter;\n  begingraph;\n    layout\
    \ overlay;\n      scatterplot X=height Y=weight;\n    endlayout;\n  endgraph;\n\
    end;\nrun;\n```\n\nBoth SGENDER and the DATA step can be used to execute this\
    \ template. Both techniques minimally require you to specify the input data source\
    \ and the template name. Behind the scenes in both cases, an ODS data object is\
    \ populated and bound to the template. The data object is then passed to a graph\
    \ renderer, which processes the data and graph to produce an output image.\n\n\
    The PROC SGENDER syntax is simple. It uses the DATA= option to specify the data\
    \ source and the TEMPLATE= option to specify the template to use for rendering\
    \ the graph:\n\n```\nproc scatter data=sashelper.class template=mygraphs.scatter;\n\
    ;\n```\n\nThe DATA step is slightly more complex. To execute a GTL template, the\
    \ DATA file and PUT statements provide syntax that is specific to ODS. You must\
    \ minimally specify the following:\n\n```\ndata _null;\n  set sashelper.class;\n\
    \  file print _ods=(template=mygraphs.scatter*);\n  put _ods;\n```\n\n+   - The\
    \ DATA step uses keyword NULL, for the data set name so that the DATA step executes\
    \ without writing variables to an output data set. The input data source is defined\
    \ with a SET statement. This approach can be defined in the current example, but\
    \ the input data source can be any appropriate DATA step syntax (INPUT with DATELINES,\
    \ INPUT with INFILE, MERGE, UPDATE, and so on).\n- FILE PRINT directs output to\
    \ ODS. PRINT is a reserved fileref that is required when executing a GTL template.\
    \ It directs output that is produced by any PUT statements to the same file as\
    \ that is produced by SAS procedures.\n- The PUT _ods statement, also required,\
    \ writes the necessary variables to the output object for each execution of the\
    \ DATA step.\n\nNote: The necessary columns for the output data object are the\
    \ ones defined by the graph template (in this case, Height and Weight), not the\
    \ input data source. With other DATA step or procedure processing, if you know\
    \ exactly which columns the template uses, you can restrict the input columns\
    \ with DROP= or KEEP= data set options for slightly more efficient processing."
  merge: -1
  pgno: 447
- img_proc: true
  md: "# Managing the Input Data\n\n# Filtering the Input Data\n\nIf do not need all\
    \ of the variables or all of the data values from the input data source, you can\
    \ use WHERE statements or input SAS data set options (for example, OBS= WHERE=)\
    \ to control the observations that are processed. The filtering techniques can\
    \ be used whether the GTL template is executed with PROC SGENDER or with a DATA\
    \ step.\n\nIn the following example, the first PROC SGENDER uses a WHERE statement\
    \ to select only female observations for the graph. The second PROC SGENDER uses\
    \ the OBS= input data set option to limit the number of observations used in the\
    \ graph.\n\n```\n/* plot only observations for females */\nproc sgender data=sashelp.class\
    \ template=mygraphs.scatter;\nwhere sex=\"F\";\nrun;\n```\n\n```\n/* test the\
    \ template /\\nproc sgender data=sashelp.class(obs 5 )\\ntemplate=mygraphs.scatter;\n\
    run;\n```\n\n# Performing Data Transformations\n\nWhen using PROC SGENDER, any\
    \ required data transformations or computations must take place before a template\
    \ is executed. The transformations therefore require an intermediate step. For\
    \ example, the following code performs transformations on the Height and Weight\
    \ columns that are in the data set Sasclass. The transformations are stored in\
    \ a temporary data set named Class, which is used in the SGENDER statement to\
    \ produce a graph:\n\n```\ndata class;\nset sashelp.class;\nheight=height*2.54;\n\
    weight=weight*.45;\nlabel height=\"Height in CM\" weight=\"Weight in KG\";nrun;\n\
    proc sgender data=class template=mygraphs.scatter;\nrun;\n```\n\nWhen executing\
    \ a DATA step, the same DATA step that builds the data object can perform any\
    \ required data transformations or computations. An intermediate step is not needed.\
    \ This next example produces the same graph that the previous example with the\
    \ SGENDER procedure:\n\n```\ndata\tnull_;\nset sashelp.class;\nheight=height*2.54;\n\
    weight=weight*.45;\nlabel height=\"Height in CM\" weight=\"Weight in KG\"\nfile\
    \ print ods=(template=\"mygraphs.scatter\\nput ods_;\n```"
  merge: -1
  pgno: 448
