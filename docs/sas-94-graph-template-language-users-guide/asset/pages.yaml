  md: '# Initializing Template Dynamics and Macro Variables


    +   The ENTRYFOOTNOTE statement refers both of the macro variables STUDY and SYSDATE.
    The value you assign to STUDY will be displayed as a left-justified footnote,
    and the run-time value of SYSDATE will be displayed as a right-justified footnote.


    As all GTL templates, the MYGRAPHS.REGFIT template can be executed with either
    a PROC SGENDER statement or a DATA step. Either way, dynamics and/or new macro
    variables that are declared in the template must be initialized to provide run-time
    values for them. The following example executes the template with PROC SGENDER:


    ```

    %let study=CLASS dataset;

    proc sgender data=sashelp.class template=mygraphs.regfit;

    dynamic xvar="height" yvar="weight";

    ```


    +   The %LET statement assigns string value "CLASS data set" to the STUDY macro
    variable.


    +   PROC S uses the DYNAMIC statement to initialize the dynamic variables XVAR
    and YVAR. XVAR is assigned to the input variable HEIGHT, and YVAR is assigned
    to the input variable WEIGHT.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_450_0.png)


    The DATA step uses the DYNAMIC= suboption of the ODS-option to initialize dynamics.
    Macro variables can be initialized from the existing symbol table. You can update
    the symbol table during DATA step execution with a CALL SYMPUT or CALL SYMPTX.
    The following example executes the MYGRAPHS.REGFIT template with a DATA step:


    ```

    data_null;

    if n_=1= then call symput("study","CLASS data set");

    set sashelp.class;

    file print out ods=( template="mygraphs.regfit"

    dynamic=( xvar="height" yvar="weight" ) );

    run;

    put_ods_;

    ```


    +   The CALL SYMP initializes the macro variable with the value "CLASS data set.\
    The macro variable only needs to be initialized once, so the IF statement limits
    the initialization to the first observation [_N_ = 1].


    +   The DYNAMIC= suboption initializes the dynamic variables XVAR and YVAR. XVAR
    is assigned to the input variable HEIGHT, and YVAR is assigned to the input variable
    WEIGHT.'
  merge: -1
