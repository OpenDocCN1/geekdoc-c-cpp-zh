    # Managing Long Text in Titles and Footnotes


    When you change the size of a graph, the size of all fonts in the graph is scaled
    up or down by default. However, when the graph size is reduced, even font scaling
    has limits on what it can do with long text strings as specified on ENTTITLE or
    ENTRYFOOTNOTE statements. The following statement options are available to deal
    with this situation:


    ```

    TEXTFITPOLICY= WRAP | SHORT | TRUNCATE

    ```


    ```

    SHORTTEXT=(text-items)

    ```


    By default, TEXTFITPOLICY=WRAP, and no default is defined for the SHORTTEXT=option.


    The text fitting policies take effect when the length of the text and/or its font
    properties cause the text line to exceed the space available for it. The font
    properties include the font family, size, and weight (BOLD or NORMAL). Adjusting
    the length of the text and/or changing its font properties are adjustments that
    you can make to fit text in the available space. You can also use the TEXTFITPOLICY=
    and/or SHORTTEXT=options.


    The following long text uses the default fit policy, which is to wrap text that
    does not fit on a single line:


    ```

    entity="This is a lot of text to display on one line"

    ```


    Here is the output.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_178_1.png)


    Note that the current horizontal alignment (CENTER in this case) is used when
    text wraps. Text is wrapped only at word boundaries (a space).'
