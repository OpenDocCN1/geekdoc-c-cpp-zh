    # Overview: Adding Non-Data-Driven Graphics Elements to a Graph


    The Graph Template Language GTL provides draw statements that enable you to draw
    additional graphics elements on your graphs that are independent of the graph
    data. The types of elements that you can draw include the following:


    +   * text

    * arrows and lines

    * geometric shapes, such as ovals, rectangles, polylines, and polygons

    * images


    You can use the draw statements to add annotations that describe the non-data
    aspects of your graph. You can use these to create custom features on your graph,
    such as a broken axis, that are difficult to create by other means. You can draw
    the elements in one of the following drawing spaces on your graph: the data area,
    the wall area, the layout area, or the graph area. "Selecting the Drawing Space
    and Units" on page 406. You can specify the location of each element using Cartesian
    coordinates, and you can specify which to the coordinates are scaled. You can
    also specify other attributes of the graphics element, such as line color and
    pattern, text font, and so on.


    In addition to the draw space and attributes, you can also choose the layer on
    which your graphics elements are drawn. Two layers are available relative to the
    graph: front and back. The front layer appears in front of the graph. The back
    layer appears behind the graph for graphs that have axes or behind the axes. By
    default, the graphics elements are drawn on the front layer. You can'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# 406 Chapter 19 Adding Non-Data-Driven Graphics Elements to a Graph


    use the LAYER=BACK option on your draw statement to draw the elements on the back
    layer.


    For plots that have axes, if the graph wall area is filled (default), graphics
    elements that are drawn on the back layer are covered by the wall area. To make
    the elements visible in that case, use the WALLDISPLAY=NONE or WALLDISPLAY=(OUTLINE)
    in your draw statement. You can also use the TRANSPARENCY=option in the plot statement
    to adjust the transparency of the graph in order to allow the graphics elements
    to show through.


    For information about using the draw statements to add graphics elements to your
    graph, see "Adding Graphics Elements to your Graph" on page 408.


    # Selecting the Drawing Space and Units


    When you draw elements, you can specify the drawing space and the drawing units
    in your draw statements. The drawing space is the area of the graph in which the
    elements are drawn, which can be data, wall, layout, or graph. The drawing areas
    are described in the following table.


    | Drawing Space | Description | Example |

    | --- | --- | --- |

    | Data | The area of the graph in which the data is displayed. The shaded area
    in the figure on the right. The origin of the drawing space X and Y coordinates,
    (0,0), is in the lower corner as shown.


    Note: The data area does not apply to graphs that do not have axes, such as pie
    charts, that must be drawn in a REGION layout. | ![Data Area](image_url) | |

    | Wall | The area of the graph that is bound by the X and Y axes, including the
    secondary axes, if it is used.


    Note: The wall area does not apply to graphs that do not have axes, such as pie
    charts, that must be drawn in a REGION layout. | ![Wall Area](image_url) | |'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# Drawing Space Selecting the Drawing Space and Units 407


    | Description | Example |

    | --- | --- | --- |

    | Layout | The entire area of the layout container that is the immediate parent
    container of the draw statement. The figure on the right shows the case where
    a LAYOUT OVERLAY is the parent. | ![Layout Area](https://example.com/layout_area.png)
    |

    | Graph | The area in which the entire graph is displayed. Note: In a multi-cell
    layout such as GRIDLOCK or LATTICE, the GRAPHPERCENT and GRAPHPIXEL span the entire
    graph, which includes all of the cells in the layout. | ![Graph Area](https://example.com/graph_area.png)
    |


    The drawing space and units are specified in a single value that is in the following
    format:


    `<DrawingSpace><Units>`


    DrawingSpace can be DATA, WALL, LAYOUT, or GRAPH. For the WALL, LAYOUT, and GRAPH
    areas, Units can be PIXEL or PERCENT. For the DATA drawing space, Units can be
    PIXEL, PERCENT or VALUE. PIXEL indicates that the coordinates are expressed in
    pixels in the drawing space. PERCENT indicates that the coordinates are expressed
    as a percentage of the drawing space. For example, DATAPERCENT indicates that
    the coordinates are expressed as a percentage of the DATA drawing.


    For the DATA drawing, VALUE indicates that the coordinates are expressed along
    the axes. When you specify the DATA drawing space, you can use the XAXIS-, YAXIS-,
    X1AXIS-, X2AXIS-, and Y2AXIS= option in the draw statement, to specify which of
    the axes coordinates are scaled.


    > Note: A draw statement is discarded if the XAXIS-, YAXIS-, X1AXIS-, X2AXIS-,
    X2SPACE-, and Y2SPACE= option specifies an axis that does not exist in the plot.
    It is also discarded if the DRAWSPACE-, XSPACE-, YSPACE-, YISPACE-, X2SPACE-,
    and Y2SPACE= option specifies a drawing space that is not valid for the draw statement.


    You can specify a common drawing space and units for all of the X and Y coordinates
    individually. You can also specify a common space and units, use the DRAWSPACE=
    option on each draw statement or in the BEGINGRAPH statement. When you use the
    DRAWSPACE= option on a draw statement, the space and units that you specify are
    applied to the coordinates for that statement. This includes the X and Y coordinates
    or the X1, Y1, X2, and Y2 coordinates. When you use the DRAWSPACE= option in the
    BEGINGRAPH statement, the space and units that you specify are applied to all
    of the draw statements within the BEGINGRAPH/ENDGRAPHH block.'
