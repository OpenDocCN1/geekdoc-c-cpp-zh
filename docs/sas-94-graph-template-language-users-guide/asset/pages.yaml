    # Merging Legend Items from Two Plots Into One


    You can use the MERGEDLEGEND statement to merge the legend items from two grouped
    plots into one legend. The basic syntax is as follows:


    ```

    MERGEDLEGEND "graph1" "graph2" / options;

    ```


    The options used with the MERGEDLEGEND are similar to those that are used with
    the DISCRETELEGEND statement. The restrictions apply to the MERGEDLEGEND statement:


    +   - You must provide exactly two plot names.

    - Each plot name must be enclosed in quotation marks.

    - Only grouped plots are supported.

    - Only plots with line and marker overlays are supported.


    During the merge process, the group values from both plots are compared. The legend
    specifies for duplicate group values are combined into one legend item, which
    is then combined with the unique items into one legend. If the items cannot be
    merged, the following warning message appears in the SAS log:


    > WARNING: MERGEDLEGEND statement does not reference two plots whose items can
    be properly merged. The legend will not be displayed.


    If you receive this message, verify that both of the contributing plots are grouped
    that use line and marker overlays. Here is an example that displays a series plot
    and a scatter plot, and combines the plots into one merged legend and one discrete
    legend that are side-by-side for comparison.


