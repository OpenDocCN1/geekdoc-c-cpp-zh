    and Footnotes statements do not contribute to the graph. However, there are comparable
    ENTRYTITLE and ENTRYFOOTNOTE statements. Like Title and Footnote statements, multiple
    instances of these statements can be used to create multi-line text.


    | Statement | Required Arguments | Comments |

