    # Options That Override Attributes for Individual Plots


    # Overview of Graphical GTL


    In GTL, the syntax for explicitly setting the properties of a graphical feature
    is a list of name-value pairs that is enclosed in parentheses. For example, to
    set the X-axis properties, use the following option in the layout statement:


    ```

    XAXISOPTS=(LABEL="string" TYPE=axis-type ...)

    ```


    The syntax for setting appearance options is similar. For example, in statements
    such as SERIESPLOT, DENSITYPLOT, REFERENCELINE, and DROLINE, you use the LINEATTRS
    option to specify the appearance of the line:


    ```

    LINEATTRS=(COLOR=color PATTERN=line-pattern THICKNESS=line-thickness)

    ```


    The properties of any line that you can draw in GTL are specified in exactly the
    same way, possibly with a different option keyword.


    In BANDPLOT and MODELBAND statements, you use the following option to specify
    the appearance of the outline:


    ```

    OUTLINEATTRS=(COLOR=color PATTERN=line-pattern THICKNESS=line-thickness)

    ```


    In a BOXPLOT statement, you use the following options to specify the appearance
    of the whiskers and median:


    ```

    WHISKERATTRS=(COLOR=color PATTERN=line-pattern THICKNESS=line-thickness)

    ```


    ```

    MEDIANATTRS=(COLOR=color PATTERN=line-pattern THICKNESS=line-thickness)

    ```


    In BARCHART and BARCHARTPART statements, you use the following options to specify
    the appearance of the bar color and pattern:


    ```

    FILLATTRS=(COLOR=color TRANSPARENC=number)

    ```


    ```

    FILLPATTERNS=(COLOR=color PATTERN=pattern)

    ```


    The list of properties in each of these options is sometimes called an "attribute
    bundle."


    Some GTL statements provide other options that override the visual attributes
    of graphical features for an individual graph. For more information, see SAS Graph
    Template Language: Reference. The remainder of this section describes the most
    used options.'
  merge: -1
  pgno: 126
