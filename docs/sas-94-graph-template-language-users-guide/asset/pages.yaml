    # Controlling Physical Aspects of the Output


    The ODS GRAPHICS statement provides options that control the physical aspects
    of

    graphs, such as the graph size and the name of the output image file.


    The HTML destination''s default image size of 660 pixels by 480 pixels (4:3 aspect
    ratio)

    for ODS Graphics is set in the SAS Registry. You can change the graph size using
    the

    ODS GRAPHICS statement''s WIDTH= and/or HEIGHT options. To name the output

    image file, use the IMENAME=option.


    The following ODS GRAPHICS statement sets a 320 pixel width for the graph and

    names the output modelfitgraph:


    ```

    ods graphics / width=320px imagename=modelfitgraph ;


    proc sgender data=sashelp.class template=modelfitgraph;

    run;

    ```


    ods graphics / reset ;


    +   The WIDTH= option sets the image width to 320 pixels. Because HEIGHT=

    is used, SAS uses the design aspect ratio of the graph to compute the

    appropriate height (The width of 320px is half the default width, so SAS will
    set the

    height to 240px, which is half the default height). In general, it is good practice
    to

    sify only one sizing option without the other — just the WIDTH= option or just

    t HEIGHT= option. That SAS will maintain the design aspect ratio of the

    graph, which might be important for many graphs.


    The IMENAME= option in the first ODS GRAPHICS statement sets the name of

    the output file to modelfitgraph.


    The RESET option in the second ODS GRAPHICS statement resets all ODS

    GRAPHICS options to their default state. If the options are not reset, all subsequent

    graphs would be 320 pixels wide and image names would be assigned incremental

    ames (modelfitgraph1, modelfitgraph2, and so on) every time a graph is produced.


    For more information about the details of managing image name, image size,

    format, DPI, see Chapter 22, “Managing Graphical Output,” on page 445.'
  merge: -1
