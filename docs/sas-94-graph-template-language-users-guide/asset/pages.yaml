    \n```\nproc template;\n  define statgraph modelfit;\nbegraph;\n  entrytitle \"\
    Regression Fit Plot\";\n  layout overlay;\n    scatterplot x=height y=weight;\n\
    \    regressionplot x=height y=weight;\nendlayout;\nend;\n```"
