- img_proc: true
  md: '# Grouping


    Many plots support a GROUP= option, which causes visually different markers, lines,
    or bands to be displayed for each distinct data value of the specified column.
    You can vary the appearance of group values with the INDEX= option. You can also
    use the GROUPDISPLAY= option to change how groups are displayed.


    | Option | Description |

    | --- | --- |

    | GROUP=column | Specifies a group column, always treated as having discrete values.
    For an example, see the example for "Legend Statements" on page 30. |

    | INDEX= positive-integer-column | Specifies an integer column associates each
    distinct data value to a predefined graphical style element GraphData1,GraphData2,...
    |

    | GROUPDISPLAY=STACK | CLUSTER | OVERLAY | Specifies whether group values for
    each category are displayed as clusters of bars or as stacked bars for charts,
    or as a cluster of markers or as an overlay of markers for other plot types |


    For more information about using groups, Chapter 6, “Managing Graph Appearance:
    General Principles,” on page 111.


    # Axis Assignment


    All 2-D plots have four potential axes: X, X2, Y, and Y2. You can choose the axes
    that any plot uses. Axis options are typically specified in the LAYOUT statement
    that contains the plot.


    | Option | Description |

    | --- | --- |

    | XAXIS= X | X2 | Specifies whether the plot''s X= column is displayed on the
    X or X2 axis. |

    | YAXIS= Y | Y2 | Specifies whether the plot''s Y= column is displayed on the
    Y or Y2 axis. |


    For more information, see Chapter 5, “Managing Axes in an OVERLAY Layout,” on
    page 63.


    # Data Tips


    Data tips (or tooltip) are text balloons that appear in HTML pages when you move
    your pointer over a plot component such as a line, marker, or filled area of a
    graph. To obtain default data tips, simply specify ODS GRAPHICS / IMAGEMAP; as
    well as the ODS HTML destination. You can customize the data tip information.'
  merge: -1
