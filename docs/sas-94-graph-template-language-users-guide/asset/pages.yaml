    # Adjusting the Sizes of Rows and Columns


    By default, the rows and columns of the lattice are of the same depth and width.
    You can use the ROWWEIGHTS= and COLUMNWEIGHTS= options on the LAYOUT LATTICE statement
    to designate different row depths or column widths or both. Consider the following
    settings:


    ```

    LAYOUT LATTICE / ROW=2 COLUMNS=2

    ROWWEIGHTS=(.64 .41) COLUMNWEIGHTS=(.45 .65)

    ```


    Figure 10.6 on page 250 uses these settings. ROWWEIGHTS= setting specifies that
    the first row gets 60% of available row space, and the second row gets 40%. The
    COLUMNWEIGHTS= setting specifies that the first column gets 45% of available column
    space, and the second column gets 65%. Potentially, the settings on options affect
    the space that is allocated to cell headers and to row and column headers.'
  merge: -1
