  md: 'Chapter 5 • Managing Axes in an OVERLAY Layout


    # Default Axis Label for a Computed Column


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_83_0.png)


    # Overriding the Default Label


    You can use the axis option LABEL= to override the default label for an axis with
    your own label. In the case of a computed column, for example, you might want
    to replace the manufactured label with a more appropriate label as shown in the
    following example.


    ```

    layout overlay / xaxisopts(label="Product of Weight and Height");

    histogram eval(weight*height);


    ```


    In this example, the manufactured label BIN(WEIGHT*HEIGHT) is replaced with Product
    of Weight and Height.


    # Custom Axis Label for a Computed Column


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_83_1.png)


    # Making Long Axis Labels Fit


    If the data column''s label is long or if you supply a long string for the label,
    the label might be truncated if it does not fit in the allotted space. This might
    happen when you create a small graph or when the font size for the axis label
    is large. The following figure shows an example.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '![](img/a9ccb6123dee40d424cb295a3a99c16c_84_0.png)


    As a remedy for these situations, you can specify a shorter alternate label with
    the SHORTLABEL or split the label into multiple lines by setting the LABELFITPOLICY=
    option to SPLIT or SPLITWAYS.


    A short label is displayed whenever the default label or the LABEL= string does
    not fit and label splitting is not enabled. Here is the previous example to modify
    a short label.


    ```

    layout overlay / cycleatrs=true

    yaxisopts(label="Growth; of Virus and Bacteria Cultures"

    shortlabel="Growth" );

    seriesplot x-Hours y=Bacteria/ curvelabel="Bacteria"

    seriesplot x-Hours y=Virus / curvelabel="Virus"

    endlayout;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_84_1.png)


    Because the specified label does not fit the allotted space, the short label is
    used instead.


    Instead of a short label, you can enable label splitting, which automatically
    splits the axis label into multiple lines. To enable label splitting, set LABELFITPOLICY=to
    SPLIT or SPLITWAYS. The SPLIT policy splits the label into multiple lines as needed
    to make it in the available space. The SPLITWAYS policy always splits the label
    into multiple lines regardless of the available space. By default, the label is
    split on a blank space.


    Note: The SHORTLABEL= option is ignored when LABELFITPOLICY= is set to SPLIT or
    SPLITWAYS.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Chapter 5 • Managing Axes in an OVERLAY Layout


    When LABELFITPOLICY= set to SPLIT, by default, the label is split on a blank space
    where only a split is needed to make the label fit. When this option is set to
    SPLITALWAYS, the label is split on every occurrence of a blank space. If you want
    to split a character other than a blank space, use the LABELSPLITCHAR=option to
    specify one or more characters on which to split the label. The list must be specified
    as a quoted string with no space between the characters. The characters are case
    sensitive, and order is not significant. For example, to split a label on a blank
    space, comma, or a semicolon, specify:


    ```

    labelsplit*=",";

    ```


    A split character on which a split is removed from the displayed label by default.
    A split character on which a split does not occur in the displayed label. If you
    want all of the split characters to remain in the displayed label, use the LABELSPLITCHDROP=FALSE.


    Each line of a split is centered in the allotted space by default. You can use
    the LABELSPLITJUSTIFY= option to justify each line of the label left or right
    for the X and X2 axes, or top or bottom for the Y and Y2 axes.


    Here is the previous example modified to use splitting instead of a short label
    for the Y axis label.


    ```

    layout overlay/ cycleatrs=true

    yaxisopts=(label="Growth of Virus and Bacteria Cultures"

    labelfitpolicy=split;

    seriesplot x-Hours y=Bacteria/ curabel="Bacteria"

    seriesplot x-Hours y=Virus / curabel="Virus"

    endayout;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_85_0.png)


    # Label Splitting Using SPLIT


    In this example, the SPLIT policy is used, which splits the label on a blank space
    only where needed. In this case, only one split is needed after "and.\ If the
    SPLITALWAYS policy is used instead, the label is split on every occurrence of
    a blank space as shown in the following figure.'
