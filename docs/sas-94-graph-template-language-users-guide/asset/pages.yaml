    # Defining Axes


    Axes for the OVERLAY3D layout are similar to axes for the OVERLAY layout, although
    the following exceptions apply to OVERLAY3D layouts:


    +   - An additional ZAXISOPTS=( ) option is available for managing the Z axis.

    - All three types can be either LINEAR, LOG, or TIME. A DISCRETE axis is not supported
    on OVERLAY3D layouts.

    - For a LOG axis, the LOGOPTS=* option is not supported on OVERLAY3D layouts.

    - No secondary axis (X2, Y2, Z2) axes are available on OVERLAY3D layouts.

    - Axis values are automatically thinned. No other fitting policy for OVERLAY3D
    layout is available.

    - For any axis, the location of the displayed axis features (line, ticks, tick
    values, and label) might shift, based on the specified viewpoint.


