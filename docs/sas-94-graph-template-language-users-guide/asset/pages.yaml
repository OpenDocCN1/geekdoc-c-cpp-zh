    # Creating a Graph with Custom Data Tips in an HTML Page


    GTL specifies plot statement syntax that enables you to suppress or customize
    the data tip information. Here is an example:


    ```

    layout overlay;

    /* scatter points have enhanced tooltips */

    scatterplot x=height y=weight / group=sex name="s"

    rolename=(tip=name tip2+age)

    tip=(tip1 tip2 X GROUP)

    tiplabel=(tip1="*Student Name")

    tipformat=(tip2=2);

    discretelelegend "s";

    endlayout;

    ```'
  merge: -1
