  md: '# Example 2: Displaying Subsets of Annotations in Axis-Aligned Insets


    # Overview


    This example shows how to subset annotations in an annotation data set and how
    to display specific subsets of annotations in a graph. It also shows how to create
    axis-aligned inserts outside of the plot area using the GTL annotation facility.
    This example creates a vertical bar chart of vehicle type and average curb weight
    by origin. Above the bar chart, axis-aligned inserts display the average city
    and highway miles for each vehicle type. The dynamic variable _BYVAL_ is used
    to specify the vehicle origin.


    The following figure shows the first graph.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_440_0.png)


    | Avg. MPG (City/Hwy) | 17 / 22 | 23 / 30 | 20 / 27 | 55 / 56 | 22 / 28 | 18 /
    22 |

    |---|---|---|---|---|---||}{

    | Average Curb Weight (LBS) | 4000 | | | | | |

    | | 3000 | | | | | |

    | | 2000 | | | | | |

    | | 1000 | | | | | |

    | | 0 | SUV | Sedan | Sports | Hybrid | Wagon | Truck |


    The annotation data for this example requires a subset of data for each vehicle
    type. One additional subset is required for the insert labels.


    # Program


    ```

    /* SASHELP. CARS BY ORIGIN */

    proc sort data=sashelp.cars out=cars;

    by origin;

    run;

    /* Summarize the mileage data by ORIGIN */

    proc summary data=cars nway mean;

    class type;

    by origin;

    var mpg_city mpg_highway;

    output=mileage mean(mpg_city mpg_highway) = mpg_city mpg_highway;

    ```'
