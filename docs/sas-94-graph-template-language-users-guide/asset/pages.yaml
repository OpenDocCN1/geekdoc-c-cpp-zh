  md: '# 328 Chapter 14 Using Dynamics and Macro Variables to Make Flexible Templates


    RUN:


    The difference between the MVAR and NMVAR declaration of MVAR always converts
    the supplied value to a numeric token (like the SYMGETN function of the DATA step).
    Macro variables that are defined by MVAR resolve to strings (like the SYMGET function
    of the DATA step).


    Each of the DYNAMIC, MVAR, and NMVAR statements can define multiple variables
    and an optional text that denotes its purpose or usage:


    ```

    dynamic YVAR="required" YLABEL="optional";nmvar LOCATE="can be INSIDE or OUTSIDE
    SYSDATE;

    nvar TRANS="transparency";

    ```


    > Note: To make the template code more readable, it is helpful to adopt a naming
    convention for these variables to distinguish from actual option values or column
    names. Common conventions include capitalization or adding leading and trailing
    underscores to their names. The examples in this document use capitalization to
    indicate a dynamic or macro variable.


    # # Referencing Dynamics and Macro Variables


    After dynamics and macro variables are declared, you can make one or more template
    references to them by simply using the name of the dynamic or macro variable in
    any valid context. These contexts include the following:


    +   - as argument or option values:

    eriesplot x=date=YVAR / curabel=YLABEL

    curvelabelocation=LOCATE datatransparency=TRANS;

    - as parts of concatenated strings:

    entrititle "Time Series for " YLABEL;

    entryfootnote "Created on " SYSDATE;


    Dynamics and run-time macro variable references cannot be used in statement option
    keywords, or in place of punctuation that is part of the syntax (parentheses,
    semicolons, and so on).


    > Note: If you precede a macro variable with an ampersand (&), the reference will
    be resolved when the template is compiled, not when it is executed.


    For example, it is permissible to define TRANS as an MVAR in the following context:


    ```

    proc template;

    define statgraph timeseries;

    dynamic YVAR YLABEL;

    mvar LOCATE TRANS;

    begingraph;

    layout overlay;

    seriesplot x=date=YVAR / curabel=YLABEL

    curvelabelocation= LOCATE datatransparency= TRANS;

    endlayout;

    endgraph;

    end;

    run;

    ```'
