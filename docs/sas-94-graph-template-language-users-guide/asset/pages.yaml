- img_proc: true
  md: "# Adding Insets to Classification Panels\n\nHere are the high-level steps that\
    \ are performed in this example:\n\n+   1. Summarize the data in Sashelp.Cars\
    \ for the cell insets (Cinders*Origin) and the cell bar charts (Cinders*Origin*Type).\
    \ Write the output to the Mileage data set.\n2. Extract the cell summary data\
    \ (_TYPE_6) from the Mileage data set, rename the columns, and write the data\
    \ to the Overall data set.\nNote: The columns must remain in order to prevent\
    \ overwriting any values when the data is merged in the next step.\n3. Use one-to-one\
    \ merging to merge the Mileage and Overall data sets to the AvgMileage data set.\n\
    4. Create the template for the classification panel.\n5. Generate the graph using\
    \ you AvgMileage data.\n\nHere is the SAS code that summarizes thehelp.Cars data\
    \ for the cells and bar charts.\n\n```\n/* Compute the BARCHART data and inset\
    \ information */\nproc summary data=sashelp.cars completesypes,\n  where in (\"\
    Sedan\" \"Truck\" \"SUV\")\n  class cylinders (4 8)\n  types cylinders*origin\
    \ cylinders*type;\n  var mpg_city;\n  output out=mileage(drop_freq) mean=n+Nobs\
    \ noinherit;\n  types cylinders*origin cylinders*type;\n;\n```\n\nThe SUMMARY\
    \ procedure calculates the number of observations and the mean of Mpg City for\
    \ each of the classification interactions listed in the TYPES statement. Cylinders*Origin\
    \ is the crossing for the cell summaries, and Cylinders*Origin*Type is the crossing\
    \ for each cell bars' chart. The COMPLETETYPES option creates summary observations\
    \ even when the frequency of the classification interactions is zero. In addition,\
    \ the code creates subsets in the input data to restrict the number of bars in\
    \ each bar chart to at most three, and reduce the number of cells in the classification\
    \ panel. There are three values of Origin (Asia, Europe, and USA) and three values\
    \ of Cylinders (\n\nFor the insets to display accurate data, you must ensure that\
    \ the order of the observations in the data corresponds to the column order for\
    \ the CLASS statement of the SUMMARY procedure. The panel cells are populated\
    \ one row before proceeding to the next, the values of the panel's row variable\
    \ (Cylinders) determine the panel order. The values must be specified first in\
    \ the SUMMARY procedure's CLASS statement so that the values of Cylinders also\
    \ determine the order for the statistics calculations."
  merge: -1
  pgno: 386
