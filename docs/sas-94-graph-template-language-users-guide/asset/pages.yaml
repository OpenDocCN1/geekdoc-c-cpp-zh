    \  beginraph;\n    entitle \"Statistical Style\";\n    layout overlay / xaxisopts=(label=\"\
    Age\" type=linear);\n    boxplot x=ageatstart y=cholesterol / intervalboxwidth=40;\n\
    \  endlayout;\n  endgraph;\n```\n\n```\nods graphics on outputfmt=static;\nods\
    \ html style=statistical;\nproc sgrender data=sashelp.heart template=boxplotdef;\n\
    \  where ageatstart between 50 and 55;\nrun;\nods graphics off;\n```\n\n# Statistical\
    \ Style\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_410_0.png)\n\n* By default,\
    \ serif caps are displayed at the end of the fences. We want to remove those caps\
    \ from the fence lines.\n* By default, the boxes are filled. We want to display\
    \ empty, notched boxes.\n* By default, the mean values are represented by hollow\
    \ diamonds. We want to display filled diamonds and slightly reduce their size.\n\
    * By default, the marker symbols for the outliers are hollow black circles. We\
    \ want to change the size and shape of the marker symbols, and again reduce their\
    \ size.\n\nTo make these changes, we can derive a new style from the STATISTICAL\
    \ style and set the attributes that we want to change. Any attribute settings\
    \ that we do not change"
