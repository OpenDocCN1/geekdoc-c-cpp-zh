  md: '# The LAYOUT REGION Statement


    The LAYOUT REGION statement supports plots that have no axes, such as pie charts.
    It also supports annotations as text, lines, arrows, images, and geometric shapes,
    that are generated with the draw statements. For information about adding annotations,
    see Chapter 19, “Adding Non-Data-Driven Graphics Elements to a Graph,” on page
    405. The LAYOUT REGION statement allows only one plot statement. If you include
    more than one, the additional plot statements ignore. You can include DISCRETELEGEND,
    CONTINUOUSLEGEND, and ENTRY statements with your region plot statement. You can
    use a LAYOUT REGION statement to define a top-level region container or to define
    a region for a single cell in a LAYOUT GRIDED or LAYOUT LATTICE statement. You
    can also nest a REGION in other layers, such as GRIDED, LATTICE, and overlay-type
    layers. However, the REGION layout cannot be nested in DATAPEN and DATALATTICE
    layers.


    Note: When you need a REGION layout in an overlay-type layer, you must include
    the HEIGHT=, WIDTH=, VALIGN=, and HALIGN= options in your LAYOUT REGION statement
    to specify the size and alignment of the plot.


    Here is an example of a LAYOUT REGION statement that defines a top-level container
    for the pie chart that shows in the following figure.


    # Sales By State


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_68_0.png)


    Here is the SAS code that generates this chart.


    ```

    proc template;

    define statgraph region;

    ```'
