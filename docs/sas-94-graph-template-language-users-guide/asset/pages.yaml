    \ to set fonts, DPI, antialiasing, and other features that contribute to producing\
    \ professional-looking graphics of any size in any output format.\n\n# Creating\
    \ a Graph Template\n\n# Quick Look at a GTL Graph Definition\n\nTo illustrate\
