  md: "# 374 Chapter 17 Adding Insets to a Graph\n\nHere is the SAS code that sorts\
    \ the data in Sashhelp.Cars by Cylinders, Origin, and Type, and writes the sorted\
    \ data the Cars data set. This data order is required for the match-merging that\
    \ is completed in the next step\n\n```\n/* Sort the analysis data by the variables\
    \ that are\nused for the inset information: CYLINDERS, ORIGIN,\nand TYPE.\n*/\n\
