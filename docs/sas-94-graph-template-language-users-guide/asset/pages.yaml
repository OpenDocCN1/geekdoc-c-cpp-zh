- img_proc: true
  md: '176 Chapter 8 • Adding Legends to a Graph


    +   - when series plots with different data are overlaid in the graph, or fit
    lines are displayed with confidence bands, or density plots with different distributions
    generated

    - when markers vary in color to show the values of a response variable

    - when contour or surface plots use gradient fill to show the values of a response
    variable

    - GTL does not automatically generate legends for the above situations. However,
    the mechanism for creating legends is simple and flexible.


    # Types of Legends in GTL


    GTL supports two type legend statements:


    DISCRETELEGEND

    legend that contains one or more legend entries. Each entry consists of a graphical
    item (marker, line, ...) and corresponding text that explains the item. A discrete
    legend would be used for the first two situations listed in "Some of the Uses
    for a Legend" on page 175.


    For details, see "General Legend Features" on page 179 and "Features of Discrete
    Legends" on page 187.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_185_0.png)


    CONTINUOUSLEGEND

    legend that maps a color gradient to response values. A continuous legend would
    be used for the last two situations listed in "Some of the Uses for a Legend"
    on page 175.


    For details, see "General Legend Features" on page 179 and "Features of Continuous
    Legends" on page 204.


    | 0.0005 | 0.0010 | 0.0015 |

    | Continuous Legend |


    # General Syntax for Using Legends


    Regardless of the situation, the basic strategy for creating legends is to "link"
    one or more plot statements to a legend statement by assigning a unique, case-sensitive
    name to the plot statement and referencing it by the name on the legend statement.


    ```

    plot-statement . / name="id-string1";nplot-statement . / name="id-string2";nlegend-statement
    "id-string1" "id-string2" < / options > ;

    ```


    One way of thinking about this syntax is that you can identify any plot with a
    NAME=option, and you can selectively include plot names on a legend statement.
    This'
