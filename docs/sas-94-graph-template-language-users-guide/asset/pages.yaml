  md: '# Setting Alternating Wall Color Bands for Discrete Intervals


    For a discrete axis, you can use the COLORBANDS= option in DISCRETEOPTS list to
    specify alternating wall color bands for each of the discrete axis intervals.
    The alternating bands can help improve the readability of complex plots. You can
    specify attributes for the odd or even bands. The odd bands begin with the first
    axis interval. The even bands begin with the second interval.


    Note: If you specify the COLORBANDS option for more than one axis, such as the
    X and Y axes, in an overlay, you might get unexpected results.


    Include the DISCRETEATTRS= option in your DISCRETEOPTS option list to specify
    the color and transparency of the bars. You can specify a style element or a list
    of fills. If you specify all fills, you must enclose the options in parenthesis.


    +   TIP You can add a border around the color bands by including TICKTYPE=INBETWEEN
    option in the DISCRETEOPTS option list and the GRIDDISPLAY=ON and GRIDATTRS= options
    in the XAXISOPTIONS= or YAXISOPTIONS= lists.


    Here is an example that adds light-gray color bands to the discrete Y axis of
    a plot. The bands begin on the second (even) interval.


    ```

    proc template;

    define statgraph MPG

    beginning;

    entitle "MPG City - European Makes"

    layout overlay /

    xaxisopts=(griddisplay=on)

    yaxisopts=(type=discrete offsetmin=0.07 offsetmax=0.07

    discreteopts=(colorbands)=EVEN

    colorbandsattrs=(transparency=0.6 color=lightgray));

    scatterplot y=make x=mpg_city / name="sp"

    group-type groupdisisplay=cluster

    discretelelegend="sp" / title="Vehicle Type"

    endlayout;

    endgraph;

    run;


    proc sgrender data=sashelper.cars template=colorbands;

    where origin="Europe"

    run;

    ```


    The following figure shows the result.'
