    # Avoiding Tick Value Collisions


    When the tick value text becomes too crowded, the tick values that are displayed
    on the axes are scaled automatically for fit. For example, the axis below comfortably
    shows eleven tick values:


    | $0 | $5,000 | $10,000 | $15,000 | $20,000 | $25,000 | $30,000 | $35,000 | $40,000
    | $45,000 | $50,000 |


    If the size of the graph decreases or the font size for the tick values increases,
    the ticks and tick values are automatically "thinned" by removing alternating
