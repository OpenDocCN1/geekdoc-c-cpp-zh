  md: '# 464 Chapter 22 • Managing Graphical Output


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_473_0.png)


    The non-anti-aliased image at 300dpi, is good but still has jagged edges.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_473_1.png)


    To perform anti-aliasing requires additional computer resources (CPU, memory,
    and execution time). Graphs that have a lot of markers, lines, and text use even
    more resources. Filled or graded 3-D surface plots might require even more resources.


    Setting a higher DPI increases anti-aliasing resources. At some point, ODS Graphics
    deems that anti-aliasing requires too many resources and it turns the feature
    off. When this happens, you get a non-antialiased rendered graph and a message
    in the SAS log similar to the following :


    > NOTE: Marker and line antialiasing has been disabled because the threshold has
    been reached. You can set ANTIALIASMAX=5700 in the ODS GRAPHICS statement to restore
    antialiasing.


    If you want anti-aliasing for a graph that caused the anti-aliasing to be disabled,
    you must set a higher threshold (at least 5700) for anti-aliasing with the ANTIALIASMAX=option
    of the ODS GRAPHICS statement.


    ods graphics / antialiasmax=5700;


    The number that is specified on the ANTIALIASMAX= option represents the maximum
    number of observations in the data to be antialiased before anti-aliasing is disabled.


