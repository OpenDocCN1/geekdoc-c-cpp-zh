    # Using Rich Text


    "Rich text" describes text in which each character can have different text properties.
    The following example creates rich text by separating the text into pieces and
    using prefix options to set different text properties for each piece. Properties
    that are set this way in effect for subsequent text items, unless changed by another
    TEXTATTRS= prefix option.


    ```

    entrytitle texttattrs=(size=12pt color=red) "Hello \

    tattrs=(size=10pt color=blue style=italic) "World";

    ```


