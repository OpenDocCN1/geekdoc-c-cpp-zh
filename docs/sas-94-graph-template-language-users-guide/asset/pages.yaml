    # Coding Distinction between DATAPANEL and DATALLICE


    The primary difference between coding the DATAPANEL and DATALLICE layouts is the
    way that the classification variables are declared.


    DATAPANEL takes one list of variables in parentheses. The number of class variables
    in the list is unlimited, although the effectiveness of the graph decreases as
    the number of class variables exceeds three or four. In such a case, it is better
    to use class variables, and use the other class variables in the BY statement
    of SGRENDER


    ```

    layout datapanel classvars=(product division) / . . .

    ```


    DATALLICE, on the other hand, takes one variable for a row dimension and or one
    variable for a column dimension:


    ```

    layout datallice rowvar=product colvar=division / .

    ```


    # The LAYOUT PROTOTYPE Statement


    In both the DATAPANEL and the DATALLICE blocks, the PROTOTYPE layout is similar
    to an OVERLAY layout, with the following major differences:


    +   * Multiple plots can be overlaid, but BARCHART is the only computed plot that
    can be included in the prototype. This means that you cannot BOXPLOT, DENSITYPLOT,
    ELLIPSE, HISTOGRAM, REGRESSIONPLOT, LOESSPLOT, PBSPLINE, or MODELBAND statements
    in the PROTOTYPE layout. See “Using'
