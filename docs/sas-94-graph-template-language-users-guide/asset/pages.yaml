    Alternatively, you can create a sorted data set, and then use the sorted data
    to generate your graph. In that case, the legend values appear in the sorted order.


    # Formatting the Data


    You can apply a format to a group column to change the legend entry labels or
    the number of classification levels. The ordering of the legend entries is based
    on the order of the pre-formatted group values. In the following example, the
    data is sorted in ascending order, so the legend entry order is "Pre-Teen" – "Teen"
    "Adult." Because there are no adults, "Adult" does not appear in the graph. If
    the data were sorted in descending age the legend entry order would be reversed.


    ```

    proc format;

    value textfmt

    low-12 = "Pre-Teen"

    13-19 = "Teen"

    20-high = "Adult";

    run;

    proc sort data=sashelp.class out=class;

    by age;

    run;

    proc sgrender data=class template=order;

    format age teenfmt;

    dynamic

    titletitle="Formatted Order of Legend Entries";

    run;

    ```'
