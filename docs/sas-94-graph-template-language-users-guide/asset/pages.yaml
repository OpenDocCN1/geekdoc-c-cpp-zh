  md: '# Chapter 5 • Managing Axes in an OVERLAY Layout


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_87_0.png)


    Using the LABELPOSITION= option can result in label collisions in some cases.
    For example, in the previous example, if LABELPOSITION=BOTTOM is used for the
    Y axis and LABELPOSITION=LEFT the axis labels collide. When you select a position,
    make sure that it does not collide with any labels.


    # Determine Axis Tick Values


    The tick values for LINEAR and TIME axes are calculated according to an internal
    algorithm that produces good tick values by default. This algorithm can be modified
    or bypassed by axes options. For examples, see "LINEAR Axes" on page 84, "DISCRETE
    Axes" on page 89, and "LOG Axes" on page 102.


    By default, the font characteristics of the tick values are set by the current
    style, and the tick mark values progress along the axis from the least value to
    the highest value. You can set alternative font characteristics with the TICKVALUEATTRS=
    option. For more information, see"Axis Appearance Features Controlled by the Current
    Style" on page 109.


    Note: For large tick values on a linear axis, you can specify a scale for the
    values to save space. "Scaling Tick Values" on page 87.


    # Apply Axis Thresholds


    For LINEAR and LOG axes only, the default of the axis construction encompasses
    a small number of "good" tick values for the axes. This list might include "encompassing"
    tick values that go beyond the data range on both the lower or upper side of the
    axis. The THRESHOLDMAX= and THRESHAROOPTS= options can be used to establish rules
    for when to add encompassing tick marks. In the following example, the data range
    is 5 to 47. When the THRESHOLDMIN=0 and THRESHOLDMAX=0, the lowest and highest
    tick marks are at or inside the data range. Notice that the lowest tick mark is
    10 and the highest tick mark is 40.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Default Axis Construction and Related Options 79


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_88_0.png)


    When the THRESHOLDMIN=1 and THRESHOLDMAX=1, the highest and lowest tick marks
    are always at or outside the data range. Notice that the lowest tick mark is 0
    and the highest tick mark is 50.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_88_1.png)


    When the thresholds are set to any value between 0 and 1, a computation is performed
    to determine whether an encompassing tick is added. The default value for both
    thresholds is .3 . Notice that the highest tick mark is 50 and the lowest tick
    mark is 10. In this case, an encompassing tick was added for the highest tick
    but not for the lowest tick.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_88_2.png)


    At the high of the axis, there is a tick mark at 40. The THRESHOLDMAX= option
    determines whether a tick mark should be displayed at 50. The threshold distance
    is calculated by multiplying the THRESHOLDMAX= value (0.3) by the tick interval
    (10), which equals 3. Measuring the threshold distance 3 from 50 yields 47, so
    if the highest data value is between 47 and 50, a tick mark is displayed at 50.
    In this case, the highest data value is 47 and it is within the threshold, so
    the tick mark at 50 is displayed.


    At the low of the axis, there is a tick mark at 10. The THRESHOLDMIN option determines
    whether a tick mark should be displayed at 0. The threshold distance is calculated
    by multiplying the THRESHOLDMIN= value (0.3) by the tick interval value'
  merge: -1
