  md: 'MODELBAND, with the unique name as its required argument. Notice that the MODELBAND
    statement appears first in the template, ensuring that the band appears after
    the scatter points and fit line. A MODELBAND statement must be used in conjunction
    with a REGRESSIONPLOT, LOESSPLOT, or BPSLINEPLOT statement.


    ```

    layout overlay;

    modelband "myclm";

    scatterplot x=height y=weight /

    primary=true;

    regressionplot x=height y=weight /

    alpha=.01 clm="myclm";

    endlay;

    ```


    # # Regression Fit Plot


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_38_0.png)


    This is the easiest way to construct this type of plot. However, you might want
    to construct a similar plot from an analysis by a statistical procedure that has
    many more options for controlling the fit. Most procedures create output data
    sets that can be used directly to create the plot you want. Stand-alone plots
    to build the fit plot. Here is an example of non-computed, first choose which
    to do the analysis.


    ```

    proc reg data=sashelp.class noproint;

    model weight=height / alpha=.01;

    output out=predicted-p lclm=lcm uclm=ucm;

    run; quit;

    ```


