    In this example, the DISCRETEOFFSET=0.25 option in the FIRST CHART statement moves
    bars to the left of each tick mark by 25% of the distance between the tick marks.
    The SECOND CHART statement uses the default offset (0), which positions its bars
    on the tick marks. The DISCRETEOFFSET=0.25 option on the THIRD CHART statement
    positions bars to the right of each tick mark by 25% of the distance between tick
