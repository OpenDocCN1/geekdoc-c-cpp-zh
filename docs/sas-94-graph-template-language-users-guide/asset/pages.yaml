  md: '# Axis Appearance Features Controlled by the Current Style


    The appearance of graphs produced with GTL is always affected by the ODS style
    that is in effect for the ODS destination. From an axis perspective, the default
    appearance of the axis line, ticks, tick values, axis label, and grid lines are
    controlled by predefined style elements.


    | Style Element | Style Attributes | Values | Controls |

    | --- | --- | --- | --- |

    | GraphAxisLines | TickDisplay | "ACROSS" "INSIDE" "OUTSIDE" | Tick mark location
    |

    | | LineStyle | Integer: 1 to 49 | Axis line pattern |

    | | LineThickness | Dimension | Axis line and tick thickness |

    | | ContrastColor | Color | Axis line and tick color |

    | GraphGridlines | DisplayOpts | "AUTO" "ON" "OFF" | When to display grid lines
    |

    | | LineStyle | Integer: 1 to 49 | Grid line pattern |

    | | LineThickness | Dimension | Grid line color |

    | | ContrastColor | Color | Grid line color |

    | GraphLabelText | Color | Color | Axis label color |

    | | Font | font-specification* | Axis label font |

    | GraphValueText | Color | Color | Axis tick value color |

    | | Font | font-specification* | Axis tick value font |


    +   * A style font-specification includes attributes for FONTFAMILY, FWEIGHT,
    FONTSTYLE, and FONTSIZE.


    The following GTL options also control the appearance of axis features. When you
    include these options, the corresponding information from the current style is
    overridden.


    | Option | Overrides ... |

    | --- | --- |

    | GRIDDISPLAY= | DisplayOpts attribute of GraphGridLines |'
