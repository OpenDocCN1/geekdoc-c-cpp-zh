    # Apply Axis Offsets


    In addition to axis thresholds, there are also axis offsets. Offsets are small
    gaps that are potentially added to each end of an axis: before the start of the
    data range and after the end of the data range. Offsets can be applied to any
    type of axis. For example, axis offsets are automatically added to allow for markers
    to appear at the first or last tick without clipping the marker'
