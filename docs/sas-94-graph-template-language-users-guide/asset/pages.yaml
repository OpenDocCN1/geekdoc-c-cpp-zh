    # Legend Text Properties


    TITLEATTRS and VALUEATTRS options control the text properties of the legend. By
    default, the text properties come from the current style. The legend title uses
    TITLEATTRS = GraphLabelText, and legend entry uses VALUEATTRS = GraphValueText.
    For visual consistency, in the graph, the GraphLabelText style is used for axis
    labels, and the GraphValueText style is also used for axis ticks. In general,
    style elements are used in a graph to maintain visual consistency.


    This example sets all legend text to gray. The font for the legend title is made
    the same as the default for the legend values by setting TITLEATTRS=GraphValueText.


    ```

    layout overlay;

    histogram Weight / name="sp"

    densityplot Weight / normal()

    legendlabel="Normal" name="norm"

    lineattrs-GraphData;

    densityplot Weight / kernel ()

    legendlabel="Kernel" name="kde"

    lineattrs-GraphData;

    discretelegend="norm" kde" /

    location=inside across=1

    ```'
