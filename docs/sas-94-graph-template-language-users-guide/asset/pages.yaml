  md: '# Chapter 5 • Managing Axes in an OVERLAY Layout


    # X and Y Axes


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_75_0.png)


    The results in an XY plot having only two axes, X and Y. However, you can request
    that either the X or Y columns be mapped to the X2 or Y2 axes. The XAXIS= option
    can be set to X or X2. Similarly, the YAXIS= option can be set to to Y or Y2:


    ```

    layout overlay;

    scatterplot x=city y=fahrenheit / xaxis=x2 yaxis=y2 ;

    endlayout;

    ```


    # X2 and Y2 Axes


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_75_1.png)


    A single plot statement can activate one horizontal and one vertical axis. It
    cannot activate both horizontal or both vertical axes. Thus, to see both a Y and
    Y2 axis based on the Y column, you could specify an additional plot statement:


    ```

    layout overlay;

    scatterplot x=city y=fahrenheit / xaxis=x yaxis=y ;

    scatterplot x=city y=fahrenheit / xaxis=x2 yaxis=y2 ;

    endlayout;

    ```


    This could be more compactly written as follows:


    ```

    layout overlay;

    scatterplot x=city y=fahrenheit;

    scatterplot x=city y=fahrenheit / yaxis=y2 ;

    endlayout;

    ```'
  merge: -1
