  md: '# Appendix 4

    Tick Value Fit Policy Applicability


    Table A4.1 on page 500 provides a matrix of the tick value fit policies and the
    axes to which each applies in the OVERLAY, LATTICE, DATALATTICE, DATAPANEL, and
    EQUATED layouts. In the matrix, the notations V, H, and B are used to indicate
    the axes to which each policy applies for a specific case. V indicates that the
    policy applies to the vertical axis only (Y, Y2, and row axes). H indicates that
    the policy applies to the horizontal axes only (X, X2, and column axes). B indicates
    that the policy applies to both the horizontal and vertical axes.'
