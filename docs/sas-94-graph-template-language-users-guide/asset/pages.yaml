    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_91_3.png)


    The OFFSETMIN= option on a layout statement controls the distance from the beginning
    of the axis to the first tick mark (minimum data value). The OFFSETMAX= option
    controls the distance between last tick (maximum data value) and the end of the
    axis. Both OFFSETMIN and OFFSETMAX can be set to AUTO, AUTOCOMPRESS, or a numeric
    value. The default offset is AUTO. AUTO, AUTOCOMPRESS automatically provides enough
    offset to display markers and other graphical features. AUTOCOMPRESS provides
    an enough effort to reduce the offset to prevent the minimum and maximum tick
    marks from extending beyond the axis length.


    For some plots, the offsets are not desirable. To illustrate this, consider the
    contour plot below. Note that the entire plot area between minimum and maximum
    data values is filled with colors that correspond to a Z value. The narrow white
    bands around the top'
