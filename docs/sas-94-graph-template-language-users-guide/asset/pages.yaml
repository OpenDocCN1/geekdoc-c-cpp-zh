    # The LAYOUT OVERLAY3D Statement


    GTL has one layout for 3-D graphics: the LAYOUT OVERLAY3D statement. Two 3-D plot
    statements can be placed within this layout: BIHISTO3DPARM and SURFACEPLOTARM.
    No 2-D plot statements can be used in this layout, although text statements such
    as ENTRY can be used.


    Typical applications of OVERLAY3D layout are to create a 3-D representation of
    a surface or a bi-variate histogram (possibly overlaid together). The 3-D layout
    has features that 2-D layouts do not have. For example, it can do each of the
    following:


    +   - generate axes for three independent variables (X, Y,and Z)

    - set a viewpoint of the graph (TILT=, ROTATE=, and ZOOM= options)

    - display lines that represent the intersection of axis walls (CUBE= option).


    The following figure shows the basic anatomy of a 3-D graph:'
  merge: -1
  pgno: 318
- img_proc: true
  md: '![](img/a9ccb6123dee40d424cb295a3a99c16c_319_0.png)


    # Basic Display Features of 3-D Graphs


    Managing the Display of Cube Lines


    You can control whether the additional nine lines representing the intersection
    of all axes planes are displayed with the CUBE=option in the LAYOUT OVERLAY3D
    statement. The default is CUBE=TRUE.


    ```

    layout overlay3d / cube=false ;

    surfaceplotparam x=height y=weight

    z=density;


    endlayout;

    ```'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Basic Display Features of 3-D Graphs 311


    # 3D Layout with CUBE=FALSE


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_320_0.png)


    # Displaying a Fill in the Graph Walls


    By default, only the outlines of the walls bounding the XY, XZ, and YZ planes
    are shown. You can display filled walls by including the WALLDISPLAY=(FILL) or
    WALLDISPLAY=(FILL OUTLINE) settings in the LAYOUT OVERLAY3D statement. You can
    change the wall color (when filled) with the WALLCOLOR~option. When filled, the
    wall lighting is adjusted to give a 3-D effect, based on the graph viewpoint.


    ```

    layout overlay3d / cube=false

    walldisplay=(fill);

    surfaceplotparam x=height y=weight


    z=density;


    endlayout;

    ```'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 312 Chapter 13 • Using 3D-Graphics


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_321_0.png)


    # Defining a Viewpoint


    Representing a 3-D graph statically in two dimensions often obscures details that
    are better viewed from a different viewpoint. Three options on the LAYOUT OVERLAY3D
    statement can be independently set to obtain a different viewpoint.


    | Option | Value Range | Default | Description |

    |---|---|---|---|

    | ROTATE= | -360 to 360 | 54 | Specifies the angle of rotation. Rotation is measured
    in a clockwise direction about a virtual axis, parallel to the Z axis (vertical)
    and passing through the center of the bounding cube. A counterclockwise rotation
    can be specified with a negative value. |

    | TILT= | -360 to 360 | 20 | Specifies the angle of tilt in degrees. Tilt is measured
    in a clockwise direction about a virtual axis parallel to the X axis (vertical)
    and passing through the center of the bounding cube. A counterclockwise tilt can
    be specified with a negative value. |

    | ZOOM= | > 0 | 1 | Specifies a zoom factor. Factors greater than 1 move closer
    to the bounding cube (zoom in), less than move further away (zoom out). |


    These options can be used in combination with each other to obtain a desired perspective.
    The following figures show some examples. To generate the figures, LATTICE layout
    was used to "grid" a series of OVERLAY3D layouts of the same plot with different
    viewpoints. The arrows on the X and Y axes indicate increasing X and Y values.'
  merge: -1
  pgno: 321
