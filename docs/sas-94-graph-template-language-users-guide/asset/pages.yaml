  md: '# Yearly Profit for Sports Products


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_284_0.png)


    # Controlling the Classification Headers


    In many cases, it is not necessary to display the classification-variable name
    in the classification headers. Often, just the classification value is sufficient.
    Both the DATALLACKGE and DATAPANEL layouts support the HEADERLABELDISPLAY=option.
    By default, HEADERLABELDISPLAY=NAMEVALUE, which shows both the variable name and
    the value. You can set HEADERLABELDISPLAY=VALUE to display only the value or HEADERLABELDISPLAY=NONE
    to suppress the headers.


    Row and column headers are unique to the DATALLACK layout. By default, COLUMNHEADERS=TOP,
    you can set COLUMNHEADERS=BOTTOM or COLUMNHEADERS=BOTH. Likewise, ROWHEADERS=RIGHT
    is the default setting, but you can set LEFT or ON on the ROWHEADERS=option. The
    location of the row or column information can be changed by using the DISPLAYSECONDARYaxis
    option. In this example, the row headers are relocated to the left, and the axis
    information is relocated to the right. Note that DISPLAY=NONE is also needed to
    remove the default row axis information from the left side.


    ```

    layout datatabase rowvar=product_group /

    rowdatatange=union

    rowgutter=5px

    rowheaders=left

    headerlabeldisplay=value

    columnmaxaxisisopts=( display=(tickvalues) )

    rowaxisisopts=( display=none displaysecondary=(tickvalues) )

    linearopts=(tickvalueformat=dollar12.)

    ```'
  merge: -1
