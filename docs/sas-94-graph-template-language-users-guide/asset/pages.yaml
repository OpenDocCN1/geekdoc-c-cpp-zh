    # Techniques for Executing Templates


    Compiled graph templates can be executed using either the PROC SGREND statement
    or a DATA step. Both techniques offer the same functionality but differ in their
    syntax. The SGREND syntax is simpler, but any required data manipulations must
    be completed before the PROC SGREND statement is used. The DATA step syntax is
    more complex, but it can integrate data manipulations with the graph execution.


    Both SGREND and a DATA step can be used to


    +   * specify the input template

    * specify the input data set

    * associate a label with one or more input variables by using a LABEL statement

    * associate a format with one or more input variables by using a FORMAT statement

    * filter input data using a WHERE=input data set option

    * assign values to dynamic variables for substitution in the template

    * name the output data object

    * label the output data object


    The following sections show how to use both SGREND and a DATA step to generate
    graphs from compiled GTL templates.'
