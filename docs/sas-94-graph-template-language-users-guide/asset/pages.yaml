- img_proc: true
  md: "Using Non-computed Plots in Classification Panels 291\n\n```\nvalue &prdfmt\
    \ = \"Missing Product\";\nvalue branchfmt .=\"Missing Branch\";\nrun;\n```\n\n\
    The format is applied to the classification columns in the PROC SGRENDER statement.\n\
    For the missing data, the labels specified in the format statement are used as\
    \ the\nheadings for the missing classes.\n\n# Using Non-computed Plots in Classification\
    \ Panels\n\nSo far the discussion has focused on how to set up the grid and axes\
    \ of the panel using\nsimple prototype examples. However, complex prototype plots\
    \ can also be specified,\nalthough BARCHART is the only computed plot that can\
    \ be used in the prototype. The\nrestriction of using only non-computed plots\
    \ in the prototype is mitigated by the fact\nmost common plot types are available\
    \ in a non-computed(parameterized) version-\nBOXPLOTARM, ELLIPSPLOT, and PROGRAMPLOT.\
    \ Also, the fit line\nstatements (REGRESSIONPLOT, LOSSPLOT, and BPSLINEPLOT) populated\n\
    \ a SERIESPLOT, and the MODELBAND statement can beulated with a\ngeneral BANDPLOT\
    \ statement, the appropriate variables have been created in\nthe input data. Many\
    \ SAS/STAT and SAS/ETS procedures can create output data sets\nwith information.\n\
    \nThe following example uses PROC GLM to create an output data set that is suitable\n\
    in showing panel of scatter plots with overlay lines and confidence bands.\n\n\
    | Predicted Response to Dosage (mg) over Time |\n| Dose = 100 | Dose = 200 | Dose\
    \ = 300 |\n| --- | --- | --- |\n| 60 | ![image](https://api.example.com/image.png)\
    \ | | |\n| 55 | | | |\n| 50 | | | |\n| | 0 5 10 15 20 25 30 0 5 10 15 20 25 30\
    \ 0 5 10 15 20 25 30 Days | |\n| | Fit | 95% Confidence Limits | 95% Prediction\
    \ Limits |\n\n```\nproc template;\ndefine statagraph dosepanel;\nbegingraph /\
    \ designwidth=490pxheight=350px;\nlayout datapanel classvars=(dose) / rows=1;\n\
    ```\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_300_1.png)"
