  md: '# # LAYOUT OVERLAY Statement


    The LAYOUT OVERLAY statement builds a 2-D, single-cell graph by overlaying the
    results of the statements that are contained in the layout block. This is one
    of several possible layout containers in GTL. Other containers provide detailed
    information about the other layout types. It is recommended that you learn about
    this type of layout first, because most of the other layout containers contrast
    their feature sets with those of the OVERLAY layout.


    The outermost layout block of any template defines the content of the graphical
    area, which is represented in the following schematic:


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_55_0.png)


    The graph in this next figure was defined by an OVERLAY layout with its border
    turned on. The layout contains a single scatter plot. The boundaries of the layout
    container are shown by a light gray border. Everything within this border is managed
    by the layout.


    | Title One | |

    | Title Two | |

    | --- | --- |

    | Weight 140 |

    | 120 |

    | 80 |

    | 60 |

    | 50 55 60 65 70 Height |

    | Footnote One |

    | Footnote Two


    The OVERLAY container controls can be included in the layout block


    +   * which statements (plot, legend, text)

    * which statements can be combined in the plot area bounded by the axes

    * various axes features

    * which axes are used (there are four available: X and Y, as well X2 and Y2)

    * which axes types are used (axis types are LINEAR, DISCRETE, LOG, and TIME )'
  merge: -1
  pgno: 55
- img_proc: true
  md: "+   * axis label, axis data range, ticks, and tick values\n\n+   * other axis\
    \ features such as offsets\n\n+   * border, padding, and background properties\n\
    \n+   * positioning and alignment of all contained plots, text, legends, and nested\
    \ layouts\n\n+   * default appearance of the generated plots ( CYCLEATTR=option\
    \ )\n\n+   * the ratio of the rectangular area of the plot wall (ASPECTRAT=option)\n\
    \nThe layout container also queries the contained statements for plots that might\
    \ change the default internal rules for combining plots.\n\n# # Common Overlay\
    \ Combinations\n\nAfter become familiar with the plot statements GTL offers, you\
    \ will see them as basic components that can be stacked in many ways to form more\
    \ complex plots. For example, there is no \"BARLINE\" statement in GTL. You design\
    \ this type of graph by using a SERIESPLOT on a BARCHART or BARCHARTPART.\n\n\
    ```\nproc template;\n  define statgraph barline;\nbeginning;\n    entitle \"Overlay\
    \ OF REFERENCELINE, BARCHARTPART and SERIESPLOT\"\n    layout;\n      referenceline\
    \ y=25000000 / curvelabel=\"Target\"\n      barchpart category=year response=retail\
    \ / dataskin=matte\n      fillatters=(transparency=0.5)\n      fillpatterns=(pattern=R1\
    \ color=light-gray);\n      seriesplot x=year y=profit / name=\"series\"\n   \
    \ discretelegend \"series\"\n  end;\nendproc;\n```\n\n```\n* compute sums for\
    \ each product line */\nproc summary data=sashelp.orsales nway;\nclass year;\n\
    var total_retail_price profit;\noutput out=orsales sum=Retail Profit;\n```\n\n\
    ```\n* close the ODS HTML destination */\nods html close;\n```\n\n```\n* open\
    \ the LISTING destination and specify the JOURNAL3 style */\nods listing style=journal3;\n\
    ```\n\n```\n* generate the graph */\nproc sgregender data=orsales template=barline;\n\
    \  format retail profit com2.\n```\n\n```\n* close ODS LISTING and open ODS HTML\
    \ */\nods listing close;\n```"
