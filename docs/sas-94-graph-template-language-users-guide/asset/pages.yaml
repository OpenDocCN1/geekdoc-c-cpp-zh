    An important point to note, here, is that the appearance of the graph changes
    when the template is executed, not it is compiled.


    Fully one third of all GTL syntax addresses matters of appearance. Most of the
    examples in this document do not use the appearance syntax because the examples
    take advantage of the pre-defined styles. Whenever the options in your graph template
    explicitly a color or font family, you are locking those decisions into the compiled
    template. Appearance options in GTL always override any similar appearance settings
    contained in the style. Thus, setting a fixed font or color option might yield
    satisfactory results with some styles but not others. For that reason, the compiled
    graph and table templates that many SAS procedures do not contain references to
    fixed fonts and colors.


    This chapter shows "best practices" to follow so that your GTL graphics styles
    integrate definitions to create the look that you desire in your graphics output.
    The coding strategy that you depends on how much style integration you need. If
    you want to change the appearance of all your plots or apply a custom style to
    them, you can define your own style. For details, see Chapter 18, “Managing the
    Graph Appearance with Styles,” on page 391.


