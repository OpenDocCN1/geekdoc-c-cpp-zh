  md: '# Making the Appearance of Grouped Data Independent of Data Order


    Note: Using the GROUPORDER=ASCENDING or GROUPORDER=DESCENDING option performs
    a linguistic sort on the group items and has the same effect as sorting the input
    data. However, the data is not changed.


    # About Grouped Data Appearance and Data Order


    When the input source is modified, sorted, or filtered, the order of the group
    values and their associations with GraphData1-GraphDataN change. If you do not
    care which line pattern, markers, or colors are associated with particular group
    values, this might not be a problem. However there may be cases in which you want
    the appearance of plots to be consistent. For example, if you create several market
    plots by STOCK, you must maintain a consistent set of visual properties for each
    stock regardless of the input order.


    There are two methods that you can use to achieve visual consistency regardless
    of the data order; you can use a discrete attribute to assign attributes to specific
    group values or use the INDEX= option to map group values to specific graphDataN
    style elements. This section shows how to use these methods.


    # Using a Discrete Attribute Map to Achieve Data-Independent Appearance for Grouped
    Plots


    You can use a discrete attribute map to associate visual attributes to specific
    group values, which enables you to make plots that are consistent regardless of
    the order of the data. Here is an example of a stock plot that is visually consistent
    regardless of the order of the data. This example plots the stock price for IBM,
    Microsoft, and Intel. In this example, we want the plot to always use the attributes
    shown in the following table for:


    | Stock | Line Pattern | Marker | Line and Marker Color |

    |---|---|---||

    | IBM | solid | filled circle | blue |

    | Intel | solid | filled square | orange |

    | Microsoft | solid | filled triangle | dark red |


    To enforce this consistency, we must create a discrete attribute map that maps
    the desired attributes to the stock values. Here is the code for this example.


    ```

    * Define the graph template. */

    proc template;

    define statgraph groupindex;

    begining;

    /* Create an attribute map for this graph. */

    discreteattributemap name="stockname" / ignorecase=true;

    value "IBM"

    markerattrs=GraphData1(color=blue symbol=circlefilled)

    lineattrs=GraphData1(color=blue pattern=solid);

    value "Intel"

    markerattrs=GraphData2(color=orange symbol=squarefilled)

    lineattrs=GraphData2(color=orange pattern=solid);

    ```'
