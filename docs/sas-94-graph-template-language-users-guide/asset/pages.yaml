    # Creating Axis-Aligned Insets


    Sometimes you want an inset to provide information about values along an axis.
    The information is aligned with values on the axis. You can use a block plot or
    an table to display information that is aligned with axis values.


    # Creating an Axis-Aligned Inset with a Block Plot


    This section provides examples of how to create an axis-aligned inset using the
    BLOCKPLOT statement. For information about the BLOCKPLOT statement, see "BLOCKPLOT
    Statement" in SAS Graph Template Language: Reference. In the following example,
    "events" have been defined over time and the inset information at the top of the
    plot provides information about these events. The example uses a BLOCKPLOT statement,
    which creates one or more strips of rectangular blocks containing text values.
    The width of each block corresponds to specified numeric intervals along the X-axis.'
  merge: -1
