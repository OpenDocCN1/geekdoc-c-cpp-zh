    In this example, the SERIES statement creates a series plot of the closing prices
    grouped by stock. The SCATTERPLOT statement creates a scatter plot of the trading
    volume grouped by stock. Notice that both plots are grouped, and exactly two plot
    names are used in the MERGEDLEGEND statement. As shown in this example, the discrete
