  md: '# 16 Chapter 2 • Quick Start


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_25_0.png)


    SGENDER produces the graph by


    +   - building a data object for the template. This data object contains the requested
    values (Height and Weight) for the scatter points along with any internally computed
    values, such as the points on the regression line.

    - obtaining default color, line, marker, and font properties from the currently
    active style.


    This information, along with theTL definition of the graph, is then passed to
    a rendering module that assembles and produces an image, which is integrated into
    the active ODS destination(s).


    Minimally, one ODS destination must be open. By default, that destination is HTML.
    For this destination, the default is to create a file that contains a PNG image
    and an HTML file that displays the image in a browser window.


    Graph output is displayed automatically when you execute the template. To view
    the output at any time afterward, you can open the Results window (choose View
    -> Results from the menu) and select it.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_25_1.png)


    Display 2.1 Graph That Has Been Opened from the Results Window in MS Windows


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_25_2.png)'
