  md: '# Specifying Axis Options 69


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_78_0.png)


    We return to the common situation where you want a duplicated Y2 axis. Here is
    the most efficient way to do it:


    ```

    layout overlay / yaxisopts=( displaysecondary=standard );

    barchpart category=city response=fahrenheit;

    endlayout;

    ```


    This specification creates the Y2 axis as a duplicate of the Y axis: all features
    are displayed without mapping data to the Y2 axis. You can also restrict the secondary
    axis features that are displayed by specifying a list of the features you want
    to be displayed. The values available for the DISPLAYSECONDARY= option are the
    same as those of the DISPLAY= option. The following example specifies that the
    secondary axis label is not to be displayed. It also requires grid lines be displayed
    on the Y axis:


    ```

    layout overlay / xaxisopts=( display=( line tickvalues ) )

    yaxisopts=( displaysecondary=( ticksvalues line );

    griddisplay=on;

    barchpartm category=city response=fahrenheit;

    endlayout;

    ```


