    # The LAYOUT OVERLAYEQUATED Statement


    Several SAS procedures create plots where the X and Y axes are scaled in the same
    units. Here are some samples of such plots taken from the Examples section of
    the procedure documentation.


    **Figure 12.1** Sample Plot from PROC PRINQUAL


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_308_0.png)'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Chapter 12 Using an Equated Layout


    **Figure 12.2** Sample Plot from PROC LOGISTIC


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_309_0.png)


    **Figure 12.3** Sample Plot from PROC PLS


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_309_1.png)


    Whenever the same units of measure are used on both axes, it is desirable to that
    the distance displayed between the same data interval be the same on both axes.
    To achieve this effect, you must use an OVERLAYEQUATED layout.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Basic Display Features of Equated Plots 301


    For specifying plot statements, the OVERLAYEQUATED layout is similar to the OVERLAY
    layout: you can specify one or more 2-D plot statements within the layout block.
    However, OVERLAYEQUATED imposes a restriction on the plot axes and differs from
    OVERLAY in several ways. With OVERLAYEQUATED,


    +   - Both X and Y axes are always numeric (TYPE-LINEAR). Thus, plot types that
    have discrete or binned axes (BOXPLOT, BOXPLOTPARM, BARCHPARTM, HISTOGRAM, and
    HISTOGRAMP) cannot be used within this layout.

    - For equal data intervals on both axes, the display distance is the same. For
    example, an interval of 2 units on the X axis maps to the same distance as an
    interval of 2 units on the Y axis.

    - The slope of a line in the display is the same as the slope in the data. In
    other words, a 45° slope in data will be represented by a 45° slope in the display.
    The EQUATYPE= option offers different ways of presenting the data ranges while
    preserving the 45° slope. (See “Types of Equated Axes” on page 301).


    The following figure illustrates how a series plot might be displayed when it
    is specified within an OVERLAYEQUATED layout rather than an OVERLAY layout:


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_310_0.png)


    # Basic Display Features of Equated Plots


    Types of Equated Axes

    The EQUATYPE= option of the LAYOUT OVERLAYEQUATED statement manages the display
    of the axes. The following values are available:


    FIT

    X and Y axes have equal increments between tick values. The data ranges of both
    axes are correlated to establish a common increment size. The axes can be of different
    lengths and have a different number of tick marks. Each axis represents its own
    data range. One axis can be extended to use available space in the plot area.
    This is the default.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 302 Chapter 12 • Using an Equated Layout


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_311_0.png)


    EQUATE

    Same as FIT except that neither axis is extended to use available space in the
    plot area.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_311_1.png)


    SQUARE

    Both the X and Y axes have the same length and the same tick values. The axis
    length and tick values are chosen so that the minimum and maximum of both X and
    Y appear in the range of values appearing on both axes.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_311_2.png)


    The following example template uses the EQUATYPE= option:'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Basic Display Features of Equated Plots 303


    ```

    proc template;

    define statgraph mpg;

    mvar TYPE;

    beginraph;

    entrytitle "Comparison of " TYPE Vehicle Mileage by Origin";

    entryfootnote align-right="SASHELP. CARS";

    layout overlaquated / equatype=fit;

    scatterplot x=mpg_city y=mpg_highway / group=origin

    name="s" markerattrs=(size=7px);

    referenceline x=eval (mean (mpg_city));

    curvelabel=eval(put (mpg_city), 4.1));

    referenceline y=eval (mean (mpg_highway));

    velabel=eval(put (mpg_highway), 4.1));

    discretelegend "s";

    layout grid / columns=1 halign=right valign=bottom;

    entry "Reference lines at";

    entry "average overall city";

    entry "highway mileages";

    endlayout;

    endraph;

    end;

    run;

    let type=SUV;

    proc sgrender data=sashelp.cars template=mpg;

    where type="type";

    run;

    ```


