    # ODS Style Templates


    It is often useful to create graphs with specific visual characteristics that
    do not have to be hard coded into GTL for every graph that you create. For example,
    you might want to modify settings for the following graph features:


    +   - font or font sizes

    - line or marker properties

    - colors

    - display features for box plots, histograms, contours, and other chart types

    - a combination of features that are related to a publication or corporate presentation
    scheme.


    Because the default properties of nearly all GTL appearance-related options are
    obtained from the current style (see Chapter 6, "Managing Graph Appearance: Principles,"
    on page 111), modifying an existing style is the best way to enforce a look-and-feel
    across many graphs.


    Similar to graphics templates, ODS style templates are stored in SAS item stores.
    All styles supplied by SAS are located in the STYLES directory of the Sashlep.
    Template item store. Templates can be viewed from the Templates window (ODTEMPLATE
    command). The template source can be viewed by opening any template.'
