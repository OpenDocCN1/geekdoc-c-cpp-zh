  md: 'Alternatively, you can specify ORDER=COLUMNMAJOR, which means "fill in all
    cells in the left column and continue to the next row to the right":


    ```

    layout lattice / columns=3 rows=2 order=columnmajor ;

    /* plot1 definition */

    /* plot2 definition */

    /* plot3 definition */

    /* plot4 definition */

    /* plot5 definition */

    endlayout;

    ```


    | Plot 1 | Plot 3 | Plot 5 |

    | Plot 2 | Plot 4 | Empty |


    # Defining Gutters


    To conserve space, the default LATTICE layout does not include a gap between cell
    boundaries. In some cases, this might cause the cell contents to appear too congested.
    You can add a vertical gap between all cells with the COLUMNGUTTER=option, and
    you can add a horizontal gap between all rows with the ROWGUTTER=option. If no
    units are specified, pixels (PX) are assumed.


    ```

    layout lattice / columns=3 rows=2 columngutter=5 rowgutter=5 ;

    /* plot1 definition */

    /* plot2 definition */

    /* plot3 definition */

    /* plot4 definition */

    /* plot5 definition */

    endlayout;

    ```


    | Plot 1 | Plot 2 | Plot 3 |

    | Plot 4 | Plot 5 | Empty |


    Note that adding gutters, you do not increase the size of the graph. Instead,
    the cells shrink to accommodate the gutters. Depending on the size of the gutters
    and the number of cells, you will frequently want to adjust the size of the graph
    to obtain optimal results, especially if the cells contain complex graphs. For
    more information, see "Adjusting the Graph Size" on page 254.


    # Defining Cells


    Several valid techniques are available for indicating the contents of a cell:'
