  md: '# 92 Chapter 5 • Managing Axises in an OVERLAY Layout


    Since there is not enough room on the X axis to fit the names, the names are extracted
    to an axis legend as shown.


    In most cases, the EXTRACT policy moves the axis values to an axis legend only
    if a collision occurs. If no collision occurs, the values are displayed on the
    axis in the normal manner. In this case, if you increase the width of the graph
    to 650 pixels and refresh the program, the legend disappears. In contrast, the
    EXTRACTALWAYS policy moves the axis values to a legend regardless of whether a
    collision occurs.


    Note: With the exception of TICKVALUEPOLICY=EXTRACTALWAYS, the TICKVALUEPOLICY
    is never applied unless a tick value collision situation is present. That is,
    you cannot force tick values to be rotated, staggered, or moved to an axis legend
    if there is no collision situation.


    For information about the tick fit policies that can be used with a discrete axis
    in each of the applicable layouts, see Appendix 4, "Tick Value Fit Policy Applicability,"
    on page 499.


    # Splitting the Tick Values


    For long tick values, when you use the TICKVALUEPOLICY=option to SPLIT to split
    the tick values, when necessary, make them fit the available space. You can set
    this option SPLITALWAYS to always split the tick values regardless of the available
    space. For the X2 axes, the amount of available space is the width allocated to
    each midpoint value. For the Y2 axes, it is the width allocated to the axis.


    By default, the tick values are split at a blank space that occurs when a split
    is needed. The value is split until the label is successfully fitted or no more
    blank spaces exist in the value string. Each blank space on which a split occurs
    is dropped from the displayed value. Each line of the value is centered in the
    available space.


    If you want to split the values on a character other than a blank space or on
    more than one split characters, you can use the TICKVALUESSPLITCHAR=option to
    specify a list of one or more split characters. You must specify the list as a
    quoted string with no space between the characters. The characters are case sensitive,
    and order is not significant. For example, to split tick value on a blank space,
    a comma, or a semicolon, specify:


    ```

    tickvaluesplitchar=": ","

    ```


    When you specify multiple characters, each character in the list is treated as
    a separate split character unless they appear consecutively in the tick value.
    In that case, all of the characters are treated as a single split character.


    If you want to change the justification of each split line from CENTER, you can
    use the TICKVALUESSPLITJUSTIFY=option to specify LEFT or RIGHT.


    For example, consider the following values:


    Davidson, Richard

    Johnston, Miranda

    McMillian, Joseph

    Robertson, Mary Ann

    Stenovich, Timothy


    Notice that the last and first names are separated by a comma followed by a space.
    This example will make the following changes:


    +   - split the last and first names into two lines

    - left-justify both lines'
  merge: -1
