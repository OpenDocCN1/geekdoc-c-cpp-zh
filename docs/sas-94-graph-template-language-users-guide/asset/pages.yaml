  md: '# Positioning Options


    # Overview of the Legend Placement Options


    You can include a legend statement in most layout blocks. Most of the time you
    would simply like to ensure that the legend appears where you want in relation
    to the plot(s) of the graph. The issues differ, depending on whether you define
    a single-cell graph or a multi-cell graph. This section discusses single-cell
    graphs The discussion of legend placement for multi-cell layouts as GRIDDED, LATTICE,
    DATALATTICE, and DATAPANEL appears in the appropriate layout chapter:


    +   - Chapter 9, "Using a Simple Multi-cell Layout," on page 211 (GRIDDED)

    - Chapter 10, "Using an Advanced Multi-cell Layout," on page 225 (LATTICE)

    - Chapter 11, "Using Classification Panels," on page 257 (DATAPANEL, DATALATTICE,
    PROTOTYPE


    The following positioning options control a legend''s location within its parent
    layer. They are available only when the legend is nested within an overlay-layout:


    LOCATION=INSIDE | OUTSIDE


    determines whether the legend is drawn inside the plot wall of the cell, or outside
    the plot wall (and outside the axes). The default is OUTSIDE.


    HALIGN=LEFT | CENTER | RIGHT


    determines horizontal alignment. The default is CENTER.


    VALIGN=TOP | CENTER | BOTTOM


    determines vertical alignment. The default is BOTTOM.


    # Displaying Legends outside of the Plot Wall


    When you place a legend statement in a single-cell layout such as OVERLAY, OVERLAYEQUATED,
    or OVERLAY3D, the default legend appears outside the plot wall but inside the
    layout border:


    ```

    layout overlay;

    scatter x=Height Y=Weight /

    name="sp" group=sex;

    discretelegend="sp" /

    location=outside

    halign=center valign=bottom;

    endlayout;

    ```


    # Default Legend Position:

    LOCATION=OUTSIDE-CENTER-VALIGN-BOTTOM


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_189_0.png)'
