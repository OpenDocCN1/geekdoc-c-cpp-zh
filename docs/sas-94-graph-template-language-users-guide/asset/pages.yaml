  md: "# Unioned Axes\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_245_0.png)\n\nNote:\
    \ The default X-axis for a histogram shows ticks at midpoints or bin end points.\
    \ If the histograms have the same bin width, it is possible to create uniformly\
    \ scale X axes. However, when the bin widths are different, there might not be\
    \ any common midpoints. To handle this situation, the LATTICE layout automatically\
    \ switches to a LINEAR type so that the axis ticks can be uniform, even though\
    \ they might not be at midpoints or boundaries for all histograms.\n\nSome restrictions\
    \ apply to the UNION and UNIONALL settings on any row or column of the lattice:\n\
    \n+   - all plots must have the same axis type: LINEAR, LOG, TIME, or DISCRETE\n\
    - if a cell contains a LAYOUT OVERLAY3D or LAYOUT OVERLAYEQUATED statement, the\
    \ union axis ranges and external axes are not supported for that row or column.\n\
    - if you create a multipanel lattice with ROWDATARANGE=UNION in effect, the axis\
    \ range for each row might differ from panel to panel. The ROWDATARANGE=UNION\
    \ option does not extend across panels, which means the axis range is computed\
    \ on a per-row basis for each panel rather than across all of the panels.\n\n\
    # External Axes\n\n# Specifying External Axes\n\nWhenever axis scales have unified\
    \ for a row or a column, you can replace the individual cells in that row or column\
    \ with a single axis that is external to the cells.\n\nTo externalize the X axis,\
    \ use the following syntax:\n\n```\nCOLUMNNAX:\n  COLUMNNAX / options ;\n  <COLUMNNAX\
    \ / options ;>\n  ENDCOLUMNNAX:\n```\n\nTo externalize the Y axis, use the following\
    \ syntax:"
