    # Using a Legend Title and Title Border


    By default, legends do not have titles. To add a title, you can use the TITLE=
    option. You can also add a dividing line between the legend title and the legend
    body with the TITLEORDER=TRUE setting.


    ```

    layout overlay;

    histogram Weight / name="sp"

    densityplot Weight / normal(\)

    legendlabel="Normal name="norm"

    lineattrs=GraphData;

    densityplot Weight / kernel ()

    legendlabel="Kernel" name="kde"

    lineattrs=GraphData;

    discretelegend="norm" "kde"

    location=inside align=1

    autocalign=(topright toleft)

    title="Theoretical Distributions"

    titleborder=true;

    ```


