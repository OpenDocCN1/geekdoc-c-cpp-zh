    # Program Description


    Summarize the highway data in Sashlep.Cars. Because a label is needed for each
    unique value of vehicle type, the data in Sashlep.Cars is first summarized for
    the Mfg column using the Type as class variable. This step generates a data set
    that contains one observation for each unique value of Type. "Listing of the Mileage
    Data Set" on page 430.


    ```

    * Summarize the highway mileage data in SASHELP.CARS. */

    proc summary data=sashlep.cars nway;

    class type;

    var mpg_highway;

    output out=mileage mean(mpg_highway) = mpg_highway;

    run;

    ```


    Create the annotation data set. The Mileage data set is used to create the annotation
    data. The DATA step in the data set reads the observations from the Mileage data
    set. The Type column is used to set the Label and is renamed to YC1. The X1 column
    is added from the Mileage data set and set to 2 to position the labels on the
    left end of each bar. The DiscreteOffset column is added and set to 0.1 in order
    to center the labels in the data skin reflection on each bar. Additional columns
    are added to specify other attributes of the labels. "Listing of the Annot Data
    Set" on page 430.


    ```

    * Create the annotation data set. */

    data anno;

    retain function "text" drawspace "datavalue"

    textfont "Arial" textweight "bold"

    textcolor "GraphData:contrastColor"

    width 100 unit "pixel"

    anchor "left" x2

    discreteoffset 0.1;

    set mileage (keep=type);

    rename Type=yc1;

    length label $12;

    label=type;

    run;

    ```


    Create the graph template and include an ANNOTATE statement. The BARCHPART statement
    is used to generate the horizontal bar chart from the summarized mileage data.
    Because the annotation drawing space is DATAVALUE, the ANNOTATE statement is placed
    in the BARCHPART statement layout block in the template. In this location, the
    DATAVALUE values are in the context of the BARCHPART data.


    ```

    * Create the template. */

    proc template;

    define statgraph barchart;

    beginingraph;

    entryitle "Average Highway Mileage by Vehicle Type";

    ```'
