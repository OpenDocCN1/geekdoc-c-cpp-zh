    # # Special Dynamic Variables


    Special predefined dynamic variables are available that you can use with your
    templates. These special variables are listed in Table 14.1 on page 333.


    Table 14.1 Special Dynamic Variables


    _LIBNAME. This represents the name of the library that contains the data set.


    _MEMENAME. This represents the name of the library member that contains the data
    set.


    This variable is set to 1 when you specify a BY statement and the ODS GRAPHICS
    BYLINE= option is set to FOOTNOTE. Otherwise, it is set to 0 or is NULL. For more
    information about the ODS GRAPHICS BYLINE= option, see S48 Output Delivery System:
    User’s Guide.'
