    Sorting the Legend Items

    Use the SORTORDER=option in the DISCRETELEGEND statement to perform a linguistic
    sort on the legend items in ascending or descending order. By default, SORTORDER=AUTO,
    which displays the items in the order in which they are produced by the contributing
    plots.


    Note: The SORTORDER=option overrides the order that is established by the GROUPORDER=option
    in the legend''s constituent plot statements. SORTORDER=ASCENDING_FORMATTED or
    SORTORDER=DESCENDING_FORMATTED combine the entries from the contributing plots
    and orders them as a single list.


    Here is an example that sorts the legend items in ascending order.


    ```

    layout overlay;

    scatterplot x-height y=weight / name="sp"

    group=age;

    discretelegend "sp" / title="Age" sortorder=ascendingformatted;

    endlayout;

    ```'
