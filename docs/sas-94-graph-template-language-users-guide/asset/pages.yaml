  md: '# Defining a Lattice with Additional Features 253


    The PREFERRED option is typically used to size rows and columns automatically
    when a lattice contains a mix of two-dimensional and one-dimensional plots. In
    this example, the system automatically sets the height of the second row to only
    what is necessary to properly display the box plot. It sets the height of the
    first row to the balance of the available height. You can also use numeric weights
    to manually set the rows, if you prefer. For example, using the ROWHEIGHTS<.9>
    option instead of the ROWHEIGHTS-PREFERRED option in the previous example produces
    a similar result. It accords 90% of the available height to the first row and
    10% to the second row.


    If a row contains a mix of one-dimensional and two-dimensional graphs, the PREFERRED
    option sets the row height to the maximum preferred height of the one-dimensional
    plots in the row. For columns, it does the same for the column width. This might
    produce undesirable results. For example, the following figure shows a simple
    column by one row lattice that uses the default row and column sizing. It contains
    two-dimensional plots in the first column and a one-dimensional box plot in the
    horizontal direction in the second column.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_262_0.png)


    By default, the row height is set to the maximum available height as shown, which
    easily accommodates all of the plots. If the row height is set to PREFERRED, the
    row height is set to the preferred height of the box plot in the second column,
    which compresses the plots in the first column as shown in the following figure.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 254 Chapter 10 • Using an Advanced Multi-cell Layout


    # Preferred Row Height


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_263_0.png)


    The PREFERRED option should be used for rows and columns that contain only one-dimensional
    plots. For a row or column that contains a mix of one-dimensional and two-dimensional
    plots, use a numeric weight instead.


    For more information about the ROWWEIGHTS=PREFERRED and COLUMNWEIGHTS=PREFERRED
    options, see “LAYOUT LATTICE Statement” in SAS Graph Template Language: Reference.


    # Adjusting the Graph Size


    When defining the lattice grid size, you generally have some idea of a good overall
    aspect ratio for the graph. For example, if you are creating one row by three
    column grid, the graph has a default aspect ratio of 4:3. It would look something
    like this:


    # Comparison of Fit Lines


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_263_1.png)'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Adjusting the Graph Size


    The graph would look better if the graph''s height were smaller in relation to
    its width. You can establish a good default graph size in the template definition
    by setting the DESIGNWIDTH= and DESIGNHEIGHT= options in the BEGINGRAPH statement.
    After some experimentation, you might decide that a 2:1 aspect ratio looks good:


    ```

    bepingraph / designwidth=400px designheight=200px ;

    ```


    # Comparison of Fit Lines


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_264_0.png)


    The DESIGNWIDTH= and DESIGNHEIGHT= options set the graph size as part of the template
    definition so that you later want a larger or smaller version of this graph, you
    can use the ODS GRAPHICS statement rather than resetting the design size and recompiling
    the template. You need specify either a WIDTH= or HEIGHT= in the ODS GRAPHICS
    statement. The other dimension is automatically computed for you, based on the
    aspect ratio that is specified in the compiled template by the DESIGNWIDTH= and
    DESIGNHEIGHT= options.


    ```

    ods graphics / reset width=300px;

    proc sgender data=asahelp.cars template=fitcompare;

    ;

    ```


    # Comparison of Fit Lines


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_264_1.png)


    If you provide both the HEIGHT= and WIDTH= options in the ODS GRAPHICS statement,
    they completely override the design aspect ratio. If the WIDTH= or HEIGHT= options
    are not specified, the design size is in effect.


    Setting the DESIGNHEIGHT= and DESIGNWIDTH= options is highly recommended for all
    multi-cell layouts that contain plots. The GRIDDED, LATTICE, DATAPANEL, and DATALLICE
    layouts.'
  merge: -1
