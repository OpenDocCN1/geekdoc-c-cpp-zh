  md: '# Introduction to Axis Management


    When you write GTL programs, all axes are automatically managed for you. For example,
    in a LAYOUT OVERLAY block, the overlay container decides the following characteristics:


    +   - which axes are displayed

    - the type of each axis (linear, time, and so on)

    - the data range of each axis

    - the label of the axis

    - other axis characteristics, some of which are derived from the current style


    Usually, the internal techniques used to manage axes produce good default axes.
    Occasionally, you might find some feature that you want to change. Layout statements
    provide many options that change the default axis behavior. This chapter shows
    how axes are managed by default and the programming options that are available
    to you for changing that.


    > Note: This chapter discusses features that are specific to an OVERLAY layout
    when it is the outermost layout and not nested in another. Nesting layouts causes
    interactions that affect the axis features. You should read this chapter before
    reading about other layout types because this chapter provides the basic principles
    of axis management. Be aware, that the other layout types (for example, OVERLAYEQUATED,
    OVERLAY3D, LATTICE, DATAPANEL, and DATALLATTICE) also control axes. Many of these
    layouts have similar although not identical options to the OVERLAY layout. See
    the chapters on other layouts for detailed discussions on how they manage axes.


    # Axis Terminology


    The OVERLAY container has up to four independent axes (X, Y, X2, Y2) that can
    be used in various combinations. Each axis has the following features, which can
    be selectively displayed using the option or setting that is shown in parentheses.


    +   - axis line (LINE)

    - axis label (LABEL)

    - tick marks (TICKS)

    - tick values (TICKVALUES)

    - grid lines drawn perpendicular to the axis at tick marks (GRIDDISPLAY=)

    - gaps at the beginning and end of the axis (OFFSETMIN= and OFFSETMAX=)'
