  md: '# # Building a Table of Text


    # ## Using a Single Layout


    One of the most common applications of the GRIDED layout is to build a table of
    text or statistics using nested ENTRY statements.


    ```

    layout gridded / columns=2 order=rowmajor

    border=true colngutter=5px;

    /* row 1 */

    entry align=left="N"

    entry align=left="5203";

    /* row 2 */

    entry align=left="Mean"

    entry align=left="119.96";

    /* row 3 */

    entry align=left="Std Dev"

    entry align=left="19.98";

    endlayout;

    ```


    | N | 5203 |

    | Mean | 119.96 |

    | Std Dev | 19.98 |


    Tables like this can be organized many ways. For more information about these
    techniques, see Chapter 7, "Adding and Changing Text in a Graph," on page 157
    for details about ENTRY statements, and see Chapter 17, "Adding Insets to a Graph,"
    on page 355 for details about defining the tables.


    # ## Nested Layouts


    When GRIDED layouts are used to create tables, the tables often appear within
    another layout. For example, the table might be used within the plot wall of an
    OVERLAY layout, or within a SIDEBAR block of a LATTICE layout. When the table
    is used within a LAY OVERLAY, it is often necessary to position the table so that
    it avoids collision with the plot. In the following example, the AUTOALIGN=(positionlist)
    option of the GRIDED layout is used to dynamically position the table in the TOPRIGHT
    or TOPLEFT position. TOPRIGHT is used first, but TOPLEFT is used if the TOPRIGHT
    position would cause the histogram to collide with the table.


    ```

    proc template;

    def statgraph inset2;

    begingraph;

    entitle "Auto-positioning the Inset Within the Plot Wall";nlayout overlay;

    histogram nrow;

    layout gridded / columns=1 border=true

    colngutter=5px

    autoalign=(topright toleft);

    ```'
  merge: -1
  pgno: 226
- img_proc: true
