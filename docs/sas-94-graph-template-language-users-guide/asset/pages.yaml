- img_proc: true
  md: "# 402 Chapter 18 • Managing the Graph Appearance with Styles\n\ninherited from\
    \ the parent STATICAL style. The following style definition effects the\ndesired\
    \ changes:\n\n```\nproc template;\n  define style Styles.Boxplot;\n    parent\
    \ = styles.statistical;\n    style GraphBox from GraphBox /\\n    capsstyle =\
    \ \"line\"\n    displayopts = \"caps median mean outliers notches\";\n    style\
    \ GraphBoxMean from GraphBoxMean /\\n    markersymbol=\"diamondfilled\"\n    contrastcolor-GraphColors(\"\
    gcdatal\"\n    markerize = 5px;\n    style GraphOutlier from GraphOutlier /\\\
    n    markerize = 5px\n    markersymbol = \"x\"\n    contrastcolor = GraphColors(\"\
    gdata2\")\n  end;\n```\n\n+   - THE STYLE statement assigns the name BOXPLOT to\
    \ our new style, and\nsets the STATICAL style as the parent style.\n\n+   - On\
    \ the GraphBox style element, the CAPSTYLE attribute is set to LINE, which\noves\
    \ the serif caps from the fences. The DISPLAYOPTS= attribute\nfills the FILL from\
    \ the display list and adds the NOTCHES value; these\nchanges determine that the\
    \ graph displays empty, notched boxes.\n\n+   - On the GraphBoxMean style element,\
    \ the marker symbol is changed to a filled\ndiamond and the marker size is reduced\
    \ to 5 pixels (the default is 9 pixels).\nCONTRACOLOR= attribute is set to GCDATA1\
    \ (the default is GCDATA).\n\n+   - On the GraphOutlier style element, the marker\
    \ symbol is changed to an X and\ntmarker size is reduced to 5 pixels (the default\
    \ is 7 pixels).\nCONTRACOLOR= attribute is set to GCDATA2 (the default is GOUTLIER).\n\
    \nThe following code generates a box plot for the BOXPLOT style:\n\n```\nproc\
    \ template;\n  define statgraph boxplotdef;\n  beginraph;\n    entitle \"Boxplot\
    \ Style\";(label=\"Age\" type=linear);\n    layout overlay / xaxisopts=\n    \
    \  boxplot x=ageatstart y=cholesterol / intervalboxwidth=40;\n    endlayout;\n\
    \  endgraph;\n```\n\n```\nods graphics on / outputfmt=static;\nods html style=Styles.Boxplot;\n\
    ```\n\n```\nproc sgrender data=sashelp.heart template=boxplotdef;\n  where ageatstart\
    \ between 50 and 55;\nrun;\n```\n\n```\nods graphics off;\n```"
