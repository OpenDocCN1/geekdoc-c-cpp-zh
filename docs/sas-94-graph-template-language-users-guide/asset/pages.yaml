  md: "# LOG Axes\n\nOverview of LOG Axes\n\nAn axis displaying a logarithmic scale\
    \ is very useful when your data values span orders of magnitude. For example,\
    \ when you plot your growth data with a linear axis, you suspect that the growth\
    \ rate is exponential.\n\n```\nlayout overlay;\n  seriesplot x=Hours y=Growth;\n\
    endlayout;\n```\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_111_0.png)\n\nTo confirm\
    \ this, you can request a log axis, which is never drawn by default. Instead,\
    \ you must request it with the TYPE=LOG axis option. Any of the four axes can\
    \ be a log axis.\n\n```\nlayout overlay / yaxisopts=(type=log);\n```\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_111_1.png)\n\
    \nThe numeric data that is used for a log axis must be positive. If zero or negative\
    \ values are encountered, a linear axis is substituted and the following note\
    \ is written to the log:"
  merge: -1
  pgno: 111
- img_proc: true
  md: '> NOTE: Log axis cannot support zero or negative values in the data range.
    The axis type will be changed to LINEAR.


    # Setting the Log Base


    You can show a log axis with any of three bases: 10, 2 and E (natural log). The
    default log base is 10. To set another base, use the BASE=suboption setting of
    the LOGOPTS=option.


    ```

    layout overlay / yaxisopts=(type=log logopts=(base=2));

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_112_0.png)


    ```

    layout overlay / yaxisopts=(type=log logopts=(base=e));

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_112_1.png)


    # Setting the Tick Intervals


    Log axes support the TICKINTERVALSTYLE=option, which provides different styles
    for displaying tick values:


    AUTO


    A LOGEXPAND, LOGEXPONENT, or LINEAR representation is chosen automatically, based
    on the range of the data. When the data range is small (within an order of magnitude),
    a LINEAR representation is typically used. Data ranges that'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Chapter 5 • Managing Axes in an OVERLAY Layout


    encompass several orders of magnitude typically use the LOGEXPAND or LOGEXPONENT
    representation. AUTO is the default.


    # LOGEXPAND


    Major ticks are placed at uniform intervals at integer powers of the base. By
    default, a BEST6, format is applied to BASE=10 and BASE=2 tick values. This means
    that, depending on the range of data values, you might see very large or very
    small values in exponential notation (10e6 instead of 100000). The preceding examples
    with a log axis show TICKINTERVALSTYLE=LOGEXPAND.


    # LOGEXPONENT


    Major ticks are placed at uniform intervals at integer powers of the base. The
    ticks are only the integer exponents for all bases.


    # LINEAR


    Major ticks are placed at non-uniform intervals, covering the range of the data.


    When using TICKINTERVALSTYLE=LOGEXPONENT, it might not be clear what base is being
    used. You should consider adding information to the axis label to clarify the
    situation.


    ```

    layout overlay / yaxisopts=(type=log label="Growth (Powers of 10)")

    logopts=(base=10 tickintervalstyle=logexponent));

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_113_0.png)


    When using TICKINTERVALSTYLE=LINEAR, it is visually helpful to turn on the grid
    lines:


    ```

    layout overlay / yaxisopts=(type=log griddisplay=on)

    logopts=(base=10 tickintervalstyle=linear));

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_113_1.png)'
