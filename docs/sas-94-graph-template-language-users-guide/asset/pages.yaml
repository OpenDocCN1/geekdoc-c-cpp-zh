    In this template, definition,


    +   - The INSERT(F PROB) option names two variables that contain the values for
    the F statistic and p value. The INSERTOPTS= option positions the inset and sets
    its text properties.

    - The OUTSTAT= option of PROC GLM creates a data set with several statistics for
    each BY value.

    - The DATA INSET step selects the appropriate observations from the OUTSTAT data
    set. The F and PROB variables are assigned labels and formats.

    - The DATA STAT2 step creates a new input data set by performing a non-match merge
    on STATS and INSET data sets. It is important to structure the input data in this
    fashion.


