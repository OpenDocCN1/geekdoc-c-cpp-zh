  md: "# Plots with Incompatible Data\n\nAll plot statements have required argument(s)\
    \ to map input data column(s) to one or more axes. Many plot statements have restrictions\
    \ on the variable type (numeric or character) that can be used for the required\
    \ arguments.\n\nFor example, the HISTOGRAM statement accepts only a numeric variable\
    \ for the required argument. Consider the following template:\n\n```\nproc template;\n\
    \  define statgraph test;\n  begingraph;\n    layout overlay;\n      histogram\
    \ sex;\n    endlayout;\n  endgraph;\n\nrun;\n```\n\n> NOTE: 'STATGRAPH Test' has\
    \ been saved to: SASUSER.TEMPLAT\n\nIf you were to create this template, you would\
    \ not see a compilation error or warning because variables are not checked at\
    \ compile time. However, you would see warnings in the log when the template is\
    \ executed:\n\n```\nproc sgregender data=saashelp.class template=test;\nrun;\n\
    ```\n\n> WARNING: Invalid data passed to BIN. Variable must be numeric.\nWARNING:\
    \ The histogram statement will not be drawn because one or more of the required\
    \ arguments were not supplied.\nWARNING: A blank graph is produced. For possible\
    \ causes, see the graphics template language documentation.\n\nIn general, GTI\
    \ produces a graph whenever. Plots in the overlay will be drawn if they have incompatible\
    \ data for the required arguments or if they cannot support the existing axis\
    \ type(s). Hence, you might get a graph with some or none of the requested plots.\n\
    \nThe same strategy extends to plot options that have incompatible data. In the\
    \ following example, the wrong variable name was used for the GROUP=option. In\
    \ the data, the column is Sex, not Gender. This is not regarded as an error condition—the\
    \ bar chart will be drawn without groups.\n\n```\nlayout overlay;\n  bchart category=age\
    \ / group=gender;\nendlayout;\n```"
  merge: -1
  pgno: 67
