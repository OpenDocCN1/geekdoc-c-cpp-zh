    \ SAS users get the relevant graphs automatically as part of the analysis process.\
    \ In addition, they have easy to use tools that can create related graphs for\
    \ preview of the data or for creating graphs from the results of multiple analyses.\n\
    \nODS Graphics are driven by the Graph Template Language (GTL), which provides\
