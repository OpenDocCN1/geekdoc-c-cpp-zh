    # DISCRETE Axes


    # Setting the Axis Tick Values


    For a DISCRETE axis, you can include the TICKVALUELIST=(values) option in the

    DISCRETEOPTS= list to set the axis values. TICKVALUELIST= option

    enables you to set the tick values and to display the values in a specific order.

    values that you use with the TICKVALUELIST= option must be within the actual data

    range must correspond to the formatted values of the data. Here is an example
    of

    a template that uses the TICKVALUELIST= option to display the first six months
    of

    anual data.


    ```

    / Create a data set of annual failure data */

    data failrate;

    domain=1 to 12 by;

    failures=2*ranuni(ranuni(12345));

    label failures="Failure Rate (% of Units Produced)"

    out;

    run;

    ```'
