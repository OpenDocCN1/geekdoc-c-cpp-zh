    in each of the applicable layouts, see Appendix 4, "Tick Value Fit Policy Applicability,"
    on page 499.


    # Setting the Axis Data Range


    As with LINEAR axes, you can force specific tick values to be displayed with the
    TICKVALUELIST= option. The VIEWMIN= and VIEWMAX= options control the data range
    of the axis. If you specify TICKVALUEFORMAT=DATA, the format that is used with
    the column is:


    ```

    layout overlay / xaxisopts=(timeopts=(tickvalueformat=data

    viewmin="31Dec2002d" viewmax="31Dec2004d"

    tickvaluelist=("31Dec2002d" "30Jun2003d"

    "31Dec2003d" "30Jun2004d" "31Dec2004d\));

