  md: '2 Chapter 1 • ODS Graphics


    SAS System leverages the power of GTL to create graphics using other tools and
    systems. You might find that other tools meet all of your needs.


    # # Automatic Graphics from SAS Analytical Procedures


    The SAS analytical procedures that support ODS Graphics can produce graphs automatically
    when ODS Graphics is enabled. (See Table 1.1 on page 2.) When ODS Graphics is
    enabled, the graphs defined as part of any procedure''s output are written to
    the active ODS destinations. You can control the specific graphs that are produced
    by using the PLOTS—options on the procedure statement or by using the ODS SELECT
    and EXCLUDE statements. When ODS Graphics is disabled, procedures produce no graphs.


    In SAS 9.3 and later releases, ODS Graphics is enabled by default. To disable
    automatic graphics, use the following statement:


    ```

    ods graphics off / options;

    ```


    To re-enable automatic graphics, use the following statement:


    ```

    ods graphics <on> / options;

    ```


    The procedures that support ODS graphics are listed in the following table.


    Table 1.1 SAS Analytical Procedures That Support ODS Graphics

    | Product | Procedure Name | Procedure Description |

    | Base SAS | CORR FREQ UNIVARIATE | See Base SAS Procedures Guide: Statistical
    Procedures. |

    | SAS/ETS | ARIMA SIMILARITY AUTORE ENTROPY TIMESERIES ESM EXPAND VARMAX MODEL
    X12 PANEL | See SAS/ETS User''s Guide. |

    | SAS/HPF | HPF HPENGINE | See SAS High-Performance Forecasting: User''s Guide.
    |

    | SAS/QC | ANOM PARETO CAPABILITY RELIABILITY CUSUM SHEWHART MACONTROL | See SAS/QC
    User''s Guide. |'
