  md: '# Adding Graphics Elements to Your Graph 413


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_422_0.png)


    The ANCHOR option specifies the rectangle anchor point as BOTTOMLEFT, which positions
    the lower left corner at coordinates (80, 80). The DISPLAY=ALL option displays
    the outline and fill. The FILLATTRS specifies a light gray fill, and the OUTLINEATTR
    specifies a blue dashed outline.


    # Polylines


    Use a BEGINPOLYLINE block to add a polygon to your graph. The basic syntax is:


    ```

    BEGINPOLYLINE X=origin-x Y=origin-y / <options>;nDRAW X=x1 Y=y1;

    DRAW X=x2 Y=y2;

    ... DRAW statements...

    DRAW X=n Y=n;

    ENDPOLYLINE;

    ```


    Use a BEGINPOLYLINE statement to open the block. In the BEGINPOLYLINE statement,
    use the X and Y options to specify the coordinates of the beginning point of the
    polygon. The default units are GRAPHPERCENT. You can include the DRAWSPACE=option,
    or the XSPACE and YSPACE in options to specify different units. If you specify
    the units as DATAVALUE and want to scale the polygon to the secondary axis, you
    must also include the XIS=X2 and YAXIS=Y2 options. To change the line color, pattern,
    or thickness, use the LINEATTRs.


    Following the BEGINPOLYLINE statement are the individual DRAW statements. Each
    DRAW statement draws a straight line from the previous point to the endpoint specified
    in the DRAW statement''s X and Y options. For the first DRAW statement, the previous
    point is the starting point that is specified in the BEGINPOLYLINE statement.
    For subsequent DRAW statements, the previous point is the endpoint that is specified
    in the previous DRAW statement. Add DRAW statement for each segment in your polygon.
    You can add as many segments as needed. After an ENDPOLYLINE statement to close
    the block.


    Here is an example that draws a five-segment beginning at the coordinates (30,
    150). The coordinates are specified in GRAPHPIXEL units.


    ```

    beginpolyline x=30 y=150 /* xspace=graphpixel yspace=graphpixel

    lineattrs=(thickness=1px) /*

    draw x=110 y=150; /* Draw S1 */

    draw x=145 y=250; /* Draw S2 */

    draw x=170 y=150; /* Draw S3 */

    draw x=205 y=150; /* Draw S4 */*

    ```'
