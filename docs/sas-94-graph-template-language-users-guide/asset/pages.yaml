  md: "# Organizing Panel Contents 265\n\n| var = 2 | var = value 4 |\n| Plot 2 |\
    \ Plot 4 |\n| var = value 1 | var = value 3 | var = value 5 |\n| Plot 1 | Plot\
    \ 3 | Plot 5 |\n\nNote: The ROWS=, COLUMNS, and START= options are available on\
    \ both the DATAPANEL and DATALATTICE layouts. The ORDER= option is available only\
    \ on the DATAPANEL layout.\n\nIf the number of unique values of the classifiers\
    \ exceeds the number of defined cells, you automatically generate as many separate\
    \ panels as it takes to exhaust all classifier levels (assuming that the PANELNUMBER=\
    \ option is not used). So if there are 17 classification levels and you define\
    \ a 2x3 grid, three panels are created (with different names), and the last panel\
    \ will have one empty cell. The effect that the classifier values on the panel\
    \ is illustrated in “Controlling the Interactions of Classifiers” on page 280.\n\
    \nWhen you specify multiple classification variables, the crossings are always\
    \ generated in a specific way: by cycling through the last classifier, and then\
    \ the next-to-last, until all classifiers are exhausted. The following illustration\
    \ shows that classifier A has distinct values a1 and a2, and classifier B has\
    \ distinct values b1, b2, and b3:\n\n```\nlayout datapanel classvars=(var) / columns=3\
    \ rows=2 ;\n```\n\n| A = a1 | A = a1 | A = a1 |\n| B = b1 | B = b2 | B = b3 |\n\
    | Plot 1 | Plot 2 | Plot 3 |\n| A = a2 | A = a2 | A = a2 |\n| B = b1 | B = b2\
    \ | B = b3 |\n| Plot 4 | Plot 5 | Plot 6 |\n\n# Gutters\n\nTo conserve space in\
    \ the graph, the default DATAPANEL and DATALATTICE layouts do not include a gap\
    \ between cell boundaries in the panel. In some cases, this might cause the cell\
    \ contents to appear too congested. You can add a vertical gap between all cells\
    \ with the COLUMNGUTTER= option, and you can add a horizontal gap between all\
    \ rows with the ROW GUTTER= option. If no units are specified, pixels (PX) are\
    \ assumed.\n\n```\nlayout lattice classvars=(var) / columns=3 rows=2 ;\ncolumnngutter=5\
    \ rowgutter=5 ;\nlayout prototype;\n  .plot statements ...\nendlayout;\n```"
