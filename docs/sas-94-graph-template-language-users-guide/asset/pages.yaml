    # Using Cell Axes


    In cases externalizing axes improves graph appearance and streamlines coding.
    However, if there are some axis options that do not apply uniformly to all axes
    in a column row, you need to use the standard axis options on a cell basis instead
    of external axes.


    For example, if you wanted X-axis grid lines to appear on the top row of plots
    but not on the second row of plots, you could not use external axes. Instead,
    you would enclose the cell contents in an overlayer-type layout block and add
    AXISOPTS=options on the layout statements, as shown in the following layout blocks:


    ```

    /* overlay blocks define X-axis options for row 1 */

    layout overlay / xaxisopts=(display=none) griddplay=on);

    seriesplot x=date2004 y=price2004 / lineattrs=GraphData;

    endlayout;

    ```


    ```

    layout overlay / xaxisopts=(display=none) griddplay=on);

    seriesplot x=date2005 y=price2005 / lineattrs=GraphData;

    endlayout;

    ```


    ```

    /* overlay blocks define X-axis options for row 2 */

    layout overlay / xaxisopts=(display=label tikvalues)

    timeouts=(tickvalueformat=monamel);

    needleplot x=date2004 y=vol2004

    lineattrs=GraphData2(thickness=2px pattern=solid);

    endlayout;

    ```


    ```

    layout overlay / xaxisopts=(display=label tikvalues)

    timeouts=(tickvalueformat=monamel);

    ```'
