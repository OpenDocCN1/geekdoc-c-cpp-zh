    ![](img/a9ccb6123dee40d424cb295a3a99c16c_227_0.png)


    In this example, the values for the statistics in the table are hardcoded. Obviously,
    you would prefer the statistics values are calculated in the template. Chapter
    17, “Adding Insets to a Graph,” on page 355 shows how these values can be computed
    in the template or passed to the template using dynamic or macro variables.


    # Sizing Issues


    # Row and Column Sizes


    Unlike the LATTICE layout, the GRIDED layout offers no way to control column sizes
    or row sizes. These sizes are determined by the contents of the cells. If only
    plots are used in the cells, the grid is partitioned equally based on the graph
    size. However, any individual cell in the grid might contain a legend or text.
    Consider the next two examples, in which the sixth cell of the grid is populated
    with a legend.


    ```

    layout gridded / columns=3 rows=2 columnwidth=10 rowheight=10;

    /* standalone plot statements define cells 1-3 */

    boxplot x=sex y=age;

    boxplot x=sex y=height;

    ```'
  merge: -1
  pgno: 227
