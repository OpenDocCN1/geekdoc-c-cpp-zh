  md: "# 346 Chapter 16 Using Functions\n\nNote: Not all SAS functions are available\
    \ in WHERE expressions. Call routines and other DATA-step-only functions (for\
    \ example, LAG, VNAME, OPEN) are some examples of functions that cannot be used.\n\
    \nFor more information about SAS functions, Chapter 2, “Dictionary of SAS Functions\
    \ and CALL Routines,” in SAS Functions and CALL Routines: Reference.\n\n# SAS\
    \ Functions That Can Be Used to Create Flexible Templates\n\nThe following table\
    \ shows some of the SAS functions you can use to increase the flexibility of your\
    \ template code.\n\n| SAS Function Name | Description |\n|---|---|n| IFC(logical-expression,\
    \ \"true-value\", \"false-value\" <, \"missing-value\") | returns the character\
    \ value true-value if logical-expression resolves to TRUE, false-value if it resolves\
    \ to FALSE, or missing-value if it resolves to a missing value. TRUE, FALSE, and\
    \ MISSING values must be enclosed in quotation marks. |\n| IFN(logical-expression,\
