  md: "# Chapter 13 • Using 3-D Graphics\n\nAdding a Color Gradient. The surface can\
    \ be colored with a gradient that is based on a response variable by setting a\
    \ column on the SURFACECOLORGRADIENT= option. The following example uses the Depth\
    \ column:\n\n```\nproc template;\n  define statgraph surfaceplot;\n  begingraph;\n\
    \    entitle \"SURFACECOLORGRADIENT=DEPTH\";n    layout overlay3d / cube=false;\n\
    \    surfaceplot x=length y=width z=depth;\n    surfacetype=fill\n    surfacecolorgradient=depth\n\
    \    colodel=twocolormap\n    reversecolormodel=true;\n  endlayout;\n  endgraph;\n\
    \  run;\n```\n\n```\n/* created data for surface */\nproc g3grid data=sashelp.lake\
    \ out=spline;\n  grid width*length = depth naxis1=75 naxis2=75 spline;\nrun;\n\
    ```\n\n```\nproc sgender data=spline template=surfaceplot;\nrun;\n```\n\nThe COLORMODEL=TWOCOLOR\
    \ setting indicates a style element. Four possible color ramps are supplied in\
    \ every style. The REVERSECOLORMODEL=TRUE exchanges (reverses) the start color\
    \ and color that is defined by the color model. The colors were reversed so that\
    \ the darker color maps to the lower depths.\n\n# SURFACECOLORGRADIENT=DEPTH\n\
    \n![](img/a9ccb6123dee40d424cb295a3a99c16c_333_0.png)\n\nUsing Color to Show an\
