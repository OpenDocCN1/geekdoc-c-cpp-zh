    # TEXTATTRS Option


    The appearance of all text in a graph can be controlled by the style or with GTL
    syntax. Title and footnote text in a graph is specified with the ENTRYTITLE and
    ENTRYFOOTNOTE statements. One or more lines of text can be displayed in the plot
    area using one or more ENTRY statements. Each of these statements provides the
    TEXTATTRS= option for controlling the appearance of that text.


    The following is the complete syntax for the TEXTATTRS= option:


    ```

    TEXTATTRS=style-element | style-element (text-options) | (text-options)

    ```


    Most often the TEXTATTRS=(text-options) settings are used to control text font
    and color properties.


    Text can also be specified on numerous options that are available on plot statements
    and layout statements, and also on various options. For example, most plot statements
    can display a line using the CURVELABEL= for labeling the line. Axis options for
    the layout statements provide the LABEL= for specifying an axis. The default appearance
    of the text in these cases is controlled by styles, GTL syntax provides the CURVEABEL=
    and LABELATTRS= options for overriding the defaults. The syntax and use for these
    options is similar to that of the TEXTATTRS= option. For example, the following
