  md: '# Creating Axis-Aligned Insets 387


    ```

    proc template;

    define statgraph blockplot2;

    begingraph;

    entryitle "Highway Mileage for Vehicle Types" " = .05";nentryfootnotehalign-left
    (unicode alpha)

    layout overlay / xaxisopts=(label=Type);

    innermargin / align-top;

    blockplot stepped block-stat / class=classname

    cludemissingclass=false

    display=(values block outline) valuealign=center

    labelattrs=GraphDataText

    endinnermargin;

    barchartpart x=type y=mean /

    errorlower-lcm errorupper=uclm;

    endlayout;

    end;

    run;


    /* Render the graph. */

    proc sgrender-all template=blockplot2;

    run;

    ```


    The template for this graph uses a BLOCKPLOT statement in an INNERMAGIN block
    to create the inset. The INNERMAGIN block reserves sufficient space along the
    top of the graph (ALIGN=TOP) for the BLOCKPLOT statement output. The BLOCKPLOT
    statement specifies X-TYPE and BLOCK-STAT. By default, if there are adjacent repeated
    values for the BLOCK= a new block does not begin until the BLOCK value changes.
    The CLASS-STATNAME setting creates a row (block plot) for each value of the Type2
    column. By default, the values of the CLASS= variable appear as row labels external
    to the block plot.


    In order to blend the block plot with the graph, the block plot label and value
    text attributes are set to GraphDataText. The outline color is set to GraphAxisLines-Color
    in order to match the axis line and graph wall color.


    # Creating an Axis-Aligned Inset with an Axis Table


    This section provides examples of how to create an axis-aligned inset with an
    AXISTABLE statement. For information about the AXISTABLE statement, see “AXISTABLE
    Statement” in SAS Graph Template Language: Reference The following example generates
    a graph similar to that shown in Figure 17.3 on page 381. This example uses an
    axis table instead of a block plot and the same data that was generated for the
    box plot example. See Example 17.1 on page 381.'
