- img_proc: true
  md: 'The LAYOUT LATTICE Statement 227


    +   * Column Headers and Row Headers present text that pertains to individual
    columns and rows. These header areas can also be used to display other components,
    like legends and plots.


    Figure 10.2 on page 227 shows how the lattice would look if you used additions
    to optimize the axes. The figure externalizes both the row and column axes, but
    you could externalize the axes for the rows, or for the columns. When axes are
    external to the cells, the scale of the data ranges that are displayed for the
    plots are always unified in some form. Unifying the scale of the data ranges means
    taking the minimum of all data minima and the maximum of all data maxima from
    a set of plots. The following variations are available for unifying the axes:


    +   * the scale of the data ranges of all X-axes in a column can be unified on
    a per-column basis, or across all columns. (See "Column 1 Axis" and "Column 2
    Axis" in Figure 10.2 on page 227.)


    +   * the scale of the data ranges of all Y-axes in a row can be unified on a
    per-row basis, or across all rows. (See "Row 1 Axis" and "Row 2 Axis" in Figure
    10.2 on page 227.)


    By default, axes are displayed only on the primary axes (bottom and left). They
    are not displayed on the secondary axes (top and right) when requested. Notice
    that external axis use less space and result in larger plots than all axes. (Compare
    Figure 10.2 on page 227 with Figure 10.1 on page 226, which is the same size.)


    # Figure 10.2 LATTICE Layout with External Axes


