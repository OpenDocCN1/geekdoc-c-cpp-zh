  md: "# Positioning an Inset 361\n\nIn this particular case there was not enough\
    \ space to display the inset in the top left position, the next position was used\
    \ because it had no collision. With a different set of data, the inset might appear\
    \ in the top left position, resulting in a collision, the position with the least\
    \ collision would be used. You can specify an order list of nine positions for\
    \ the AUTOALIGN list: TOPLEFT, TOP, TOPRIGHT, LEFT, CENTER, RIGHT, BOTTOM, and\
    \ BOTTOMRIGHT. For a scatter plot where \"open\" is not predictable, you can specify\
    \ AUTOIGN= which selects a position that minimizes collision\n\nNote: The setting\
    \ for the AUTOALIGN= works best when the layout contains only scatter plots. When\
    \ other plot types are present, the ENTRY text might overlap a graphics element\
    \ in the plot area.\n\nOutsideInsets. An inset does not have to be placed inside\
    \ the plot wall. This next example inset in the sidebar of a LATTICE template:\n\
    \n```\nproc template;\ndefine strategy gset3b;\n begraph / pad=2px;\n entitle=\"\
    Positioning the Inset Outside the Plot Wall\";\n layout lattice;\n overlay mrw;\n\
    \ endlayout;\n sidebar / align=right;\n layout overlay / pad=(left=2px);\n layout\
    \ gridded / columns=1 border=true;\n entry halign=left \"N\" halign=right=\"5203\"\
    ;\n entry halign=left \"Mean\" halign=right=\"119.96\";\n entry halign=left \"\
    Std Dev\" halign=right=\"19.98\";\n endlayout;\n endsidebar;\n endlayout;\n endgraph;\n\
    \ end;\nrun;\nods html style=default;\n proc sgrender data=sashelp.heart template=gset3b;\n\
    run;\n```"
