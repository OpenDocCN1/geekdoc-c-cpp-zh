    ![](img/a9ccb6123dee40d424cb295a3a99c16c_246_0.png)


    # Displaying External Secondary Axes


    The DISPLAYSECONDARYoption can be used in a ROWAXIS statement to display a row
    at the right of the lattice. It can be used in a COLUMNAXIS statement to display
    a column axis at the top of the lattice. These external secondary axes are duplicates
    of the external primary axis and not truly independent axes. However, you can
    change the features that are displayed on the secondary axis. In the following
    example, the ticks and tick values are repeated on the right side of the lattice,
    but the axis label is suppressed by not listing it the features that are requested
    on

    DISPLAYSECONDARY*=option;


    ```

    layout lattice / columns=2 colgutter=5px

    columdatarange=unionall

    rowdatarange=union;


    historistor mpg_city;

    ```'
