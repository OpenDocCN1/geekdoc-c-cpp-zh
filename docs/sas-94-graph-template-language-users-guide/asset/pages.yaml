    # Changing the Grouped Data Order


    When unique values are gathered, they are internally recorded in the order in
    which they appear in the data. They are not subsequently sorted. As a result,
    the group appear in the plot in the order in which they occur in the data. Here
    is an example.


    ```

    ods html style=stocks;

    proc sggrender data=sashelp.stocks template=group;

    where date between

    "1jan02d" and "31dec04d";

    run;

