  md: '# DISCRETE Axes 93


    +   * retain the comma between the last and first names

    * discard the space that occurs after the comma


    You can use the TICKVALUEFITPOLICY-SPLIT option to split the values on space and
    discard the space by default. However, to left-justify the names, we must specify
    the TICKVALUESPLITJUSTIFY=LEFT option. The following figure shows the result:


    | Discrete Axis: TickvalueFitPolicy = SPLIT |

    |---|---|---|---|--|

    | Davidson, Richard | Johnston, Miranda | McMillan, Joseph | Robertson, Mary Ann
    | Stenovich, Timothy |


    Notice the value Report, Mary Ann splits only once though there are two occurrences
    of the split character in the value. By default, a split occurs on the character
    only if a split is needed at that character to fit the label. In this case, because
    a split is not needed at the second character, it remains in the displayed value.
    If you want to force a split at every occurrence of a split character, use the
    TICKVALUEPOLICY-SPLITWAYS option. In that case, value Report, Mary Ann, splits
    in three left-justified lines.


    If you want to keep the split characters in the tick values, use the TICKVALUESPLITCHDROP-FALSE
    option. In that case, where each split occurs, the split character remains as
    the last character in the current line, and the characters that wrap to the new
    line.


    The compound policies SPLITHIN and SPLITWAYSTHIN apply the split policy first,
    and then the tick policy if the split policy does not work.


    # Truncating the Tick Values


    You can set TICKVALUEFITPOLICY-TRUNCATE to shorten the tick values. Axis values
    that are greater than 12 characters in length are truncated to 12 characters.
    Ellipses are added to the end of the truncated values to indicate that truncation
    has occurred. When there is sufficient room on the axis to fit the full axis values,
    no truncation occurs. For example, suppose that we want to truncate the values
    from the previous example rather than split them. If we specify the TICKVALUEFITPOLICY=TRUNCATE
    option and remove the values are truncated as shown in the following figure.


    | Discrete Axis: TickvalueFitPolicy = TRUNCATE |

    |---|---|---|---|--|

    | Davidson, Ri... | Johnston, Mi... | McMillan, J... | Robertson, M... | Stenovich,
    T... |


    The compound policies STAGGERTRUNCATE, TRUNCATEROTATE, TRUNCATETAGGER, TRUNCATHIN
    apply the first first policy, and then apply the second policy if the first policy
    does not work.'
