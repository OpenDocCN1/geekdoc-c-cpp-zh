    \ lines: SPLIT and SPLITWAYS. See \"Splitting the Tick Values\" on page 92.\n\
    \ truncate the axis values: TRUNCATE. See \"Truncating the Tick Values\" on page\
    \ 93.\n\nA DISCRETE axis also supports the following additional compound fit policies:\n\
    \n```\nROTATEWAYSDROP SPLITTHIN TRUNCATESTAGGER\nSPLITWAYS STAGGERTRUNCATE TRUNCATEIN\n\
    SPLITROTATE TRUNCATEROTATE\n```\n\nExtracting Values into a Legend\nFor a large\
    \ number of tick values, you can set TICKVALUEFITPOLICY=EXTRACT or TICKVALUEFITPOLICY=EXTRACTWAYS\
    \ to move the axis values to an AXISLEGEND. In that case, on the axis, the values\
