  md: "# # How Plot Statements Affect Axis Construction\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_74_0.png)\n\
    \n**Primary and Secondary Axes.** The LAYOUT OVERLAY supports two horizontal (X\
    \ and X2) and two vertical (Y and Y2) axes. The bottom axis (X) and the left axis\
    \ (Y) are the default axes, referred to as the primary axes. The top axis (X2)\
    \ and the right axis (Y2) are referred to as the secondary axes and are displayed\
    \ only if they are requested. For example, consider this simple layout block:\n\
    \n```\n```\nlayout overlay;\n  scatterplot x=city y=fahrenheit;\nendlayout;\n\
    ```\n```\n\nExplicitly, the layout block means the following:\n\n```\n```\nlayout\
    \ overlay;\n  scatterplot x=city y=fahrenheit / xaxis=x yaxis=y;\nendlayout;\n\
    ```\n```"
  merge: -1
