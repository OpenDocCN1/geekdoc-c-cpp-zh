  md: '# Legends and Layouts


    | Option | Description |

    | --- | --- |

    | HALIGN= LEFT | CENTER | RIGHT | value | Specifies the alignment for a legend
    or layout. For legends, and for layouts that are nested within an overlay type,
    a position can be specified relative to the parent container. The values CENTER,
    LEFT, TOP, and BOTTOM position the legend or layout horizontally or vertically.
    You can use value to express the position as a percentage of the available vertical
    or horizontal space using any numeric value between 0 and 1 inclusive. In order
    to use these options on a layout block, the layout block must be embedded in an
    overlay-type layout. Otherwise, the HALIGN= and VALIGN= options are ignored. In
    that case, a note is written to the SAS log. This restriction does not apply to
    the legend statements. |

    | VALIGN= TOP | CENTER | BOTTOM | value | |


    Note the following equivalencies:


    VALIGN=TOP is equivalent to VALIGN=1

    VALIGN=BOTTOM is equivalent to VALIGN=0

    HALIGN=RIGHT is equivalent to HALIGN=1

    HALIGN=LEFT is equivalent to HALIGN=0


