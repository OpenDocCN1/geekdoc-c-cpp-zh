    # # ODS GRAPHICS Statement Options


    The ODS GRAPHICS statement is the primary statement that controls the runtime
    environment for producing template-based graphs. In a sense, it is similar to
    the GOPTIONS statement for GRSEG-based graphs, but completely independent of that
    statement. The GOPTIONS statement does not affect template-based graphical output
    and the ODS GRAPHICS statement does not affect GRSEG-based graphs.


    All options for the ODS GRAPHICS statement are global to a SAS session, unless:


    +   - the graphics environment is disabled with the ODS GRAPHICS OFF;

    - the RESET or RESET=option of the ODS GRAPHICS statement is used to return the
    default state to all options or a specific option.


    The following table shows some of the available options. For a complete and more
    detailed explanation of all available options, see the documentation of the ODS
    GRAPHICS statement in SAS Output Delivery System: User''s Guide.


    Table 22.2 Partial Listing of ODS GRAPHICS Statement Options


    | Task | Option |

    |---|--|

    | Specify the threshold for allowing anti-aliasing. | ANTILIASMAX=positive-integer

    The default is 600 markers and lines. |

    | Specify whether graph rendering uses anti-aliasing. | ANTILIAS=ON | OFF

    The default is ON. |

    | Specify whether to draw a border around any graph. | BORDER=ON | OFF

    The default is ON. |'
