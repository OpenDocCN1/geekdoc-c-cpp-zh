  md: '# Creating an Inset from Values That Are Passed to the Template 367


    +   * The LAYOUT GRIDD statement constructs a two-column inset that shows descriptive
    statistics for the analysis variable. Macro variables NOBS, MEAN, and STD will
    be calculated by the code in the macro body and resolve to the number of observations
    in the data, the mean value, and the standard deviation.


    # Defining a Macro to Initialize the Variables and Generate the Graph


    In “Creating a Template That Uses Macro Variables” on page 365 we created template
    GIPSET, which declared the following macro variables:


    | TEST | Identifies the normality test |

    | TESTLABEL | Provides the label that is associated with the applied normality
    test |

    | STAT | Provides the normality statistic that is calculated by the applied normality
    test |

    | PTYPE and PVALUE | Provide the probability (type and value) for the applied
    normality test |

    | NOBS, MEAN, and STD | Provide the number of observations, mean, and deviation
    for the analysis variable. |


    To initialize these macro variables, we will now create a macro that calculates
    values for and also specifies an SGREENDER procedure that uses template GIPSET.
    The macro needs two parameters: one for a SAS data set name, and a second for
    passing the name of a column in that data set.


    The following macro code uses PROC UNIVARIATE to create two data sets. A DATA
    step then reads the data sets, creates the required macro variables, and assigns
    values to macro variables in a local scope. When the macro runs the SGREENDER
    procedure, the values of the variables are imported into the GIPSET template to
    produce a graph with inserts, similar to the graph shown in Figure 17.1 on page
    365. As mentioned earlier, the normality test that is performed on the analysis
    will be based on the number of observations in that analysis variable.


    Note: To make the following macro more robust, it could be designed to validate
    the parameters.


    ```

    %macro histogram(dsn,var);

    /* compute tests for normality */

    ods output TestsForNormality-norm;

    proc univariate data=&dsn normaltest;

    var &var;

    output=stats n=n mean=mean std=std;

    run;


    local nobs mean std testlabel stat ptype value;


    data _null_;

    set stats(keep=n mean std);

    call symputx("*nobs",,n);

    call symput("mean",strip(put(mean,12.3)))));

    ```'
