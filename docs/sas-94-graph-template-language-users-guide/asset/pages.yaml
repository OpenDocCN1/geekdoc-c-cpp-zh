  md: '182 Chapter 8 • Adding Legends to a Graph


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_191_0.png)


    One of the advantages of inside legends is that the plot wall does not shrink.


    One of the disadvantages of inside legends with HALIGN= and VALIGN= positions
    is that the legend may be placed on top of plot markers, lines, or filled areas
    (legends, entries, and nested layouts are always stacked on top of plots, regardless
    of the statement order in an overlay block).


    # Automatically Aligning an Inside Legend


    When the plot statements are specified in a 2-D overlay-type layout, the AUTOALIGN
    option can be used to automatically position an inside legend. AUTOIGN selects
    a position that avoids or minimizes collision with plot components.


    The AUTOALIGN= option enables you to specify an ordered list of potential positions
    for the legend. The list contains one or more of the following keywords: TOPLEFT,
    TOP, TOPRIGHT, LEFT, RIGHT, BOTTOMLEFT, BOTTOM, and BOTTOMRIGHT. In the following
    example, we know that the best position for an inside legend is TOPRIGHT or TOPLEFT.
    Because the AUTOALIGN option specifies a list of preferred positions, the first
    of the listed positions that does not involve collision is used. Had the histogram
    been skewed to the right, the TOPLEFT position would be used.


    ```

    layout overlay;

    histogram Weight / name="sp";density Weight / kernel();

    label="Kernel Density"

    name="kde"

    discretelegend="kde" /\nlocation=inside\nautoalign=(topright topleft);

    endlayout;

    ```'
