  md: "# Initializing Template Dynamics and Macro Variables\n\nA useful technique\
    \ for generalizing templates is to define dynamics and/or macro variables that\
    \ resolve when the template is executed.\n\nYou can create new macro variables\
    \ or use the automatic macro variables that are defined in SAS, as the system\
    \ date and time value (SYSDATE). Both types of macro variables must be declared\
    \ before they can be referenced. Whereas automatic macro variables do not require\
    \ initialization, you must initialize any macro variables that you create with\
    \ the variable declarations. The macro variable values are obtained from the current\
    \ symbol table (local or global), as SAS resolves their values according to the\
    \ current context in which they are used.\n\nThe following template declares the\
    \ dynamic variables XVAR and YVAR, and the macro variables STUDY and SYSDATE:\n\
    \n```\nproc template;\n  define statgraph mygraphs.regfit;\n    dynamic XVAR YVAR;\n\
    \    mvar STUDY SYSDATE;\n    begingraph;\n      entitle\"Regression fit for Model\
    \ YVAR = XVAR\";n      entryfoot align=left STUDY align=right SYSDATE;\n    layout\
    \ overlay;\n      scatterplot X=XVAR Y=YVAR;\n      regressionplot X=XVAR Y=YVAR;\n\
    \    endlayout;\n  endgraph;\nend;\n```\n\n+   The Dynamic statement declares\
    \ dynamic variables XVAR and YVAR. On the statements that execute this template,\
    \ you must initialize these dynamics by assigning them to variables from the input\
    \ data source so they have values at run.\n\n+   The ENTRETITLE statement concatenates\
    \ dynamic variables XVAR and YVAR into a string that will be displayed as the\
    \ graph title. At run, the dynamics will be replaced by the names of the variables\
    \ that are assigned to the dynamics when they are initialized.\n\n+   The SCATTERPLOT\
    \ and REGRESSIONPLOT statements reference the dynamics on their X and Y attributes.\
    \ At run time for both plots, the variable that has been assigned to XVAR will\
    \ provide X values for the plot, and the variable that has been assigned to YVAR\
    \ will provide Y values.\n\n+   The MVAR statement declares the macro variable\
    \ STUDY. Because STUDY is not a SAS automatic macro variable, it will be created\
    \ for this template. On the statements that execute this template, you must initialize\
    \ a value for STUDY.\n\n+   The MVAR statement also declares the automatic macro\
    \ variable SYSDATE. At runtime, the current system date and time will be substituted\
    \ for this variable."
  merge: -1
  pgno: 449
