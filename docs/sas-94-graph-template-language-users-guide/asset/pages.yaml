    Although an image is produced, it is empty. The GTL has an internal restriction
    on how small a cell can be: 100 pixels by 100 pixels. Cell size is computed after
    all titles, footnotes, and sidebar contents have been established. Thus, if we
    had additional titles in the design, log messages similar to the one just would
    be issued, with a larger panel size.


    The CELLWIDTHMIN= and CELLHEIGHTMIN= options on the LAYOUT DATAPANEL or LAYOUT
    DATATTICE statements can be used to specify smaller cells than 100 pixels:


    ```

    proc template;

    define sgraph;

    begegin; /designwidth=160px designheight=180px;

    entertitle "Yearly Profit for Sports Products";nlayout datapanel clavisars=(product_group)
    / rows=1

    headerlabeldisplay=value

    cellwidthmin=70 cellheightmin=70 ;

    end prototype;

    barchart category=year response=profit / stat=sum;

    endlayout;

    endlayout;

    endgraph;

    end;

    run;

    ```


    ```

    proc sgrender data=sashelp.orsales template=onerow;

    where product_group in ("Golf" "Tennis" "Soccer");

