    For all plots that support data skins, by default, the GraphSkin:Data style element
    in the active style specifies the data skin that is applied. For all of plots
    in a template, you can use the DATASKIN= option in the BEINGGRAPH statement to
    override the data skin specified by the current style. For an individual plot,
    you can use the DATASKIN= option in the plot statement to override the data skin
    that is specified by the current style or the BEINGGRAPH statement''s DATASKIN=
    option. The style GraphSkin:DataSkin element and the DATASKIN= options can be
    set to one of the following values: NONE, SHEEN, GLOSS, PRESSED, CRISP, or MATTE.


    # Subpixel Rendering


    You can specify subpixel rendering in order to generate smooth curves and more
    precise bar spacing in plots that are generated using the following statements:


    +   - BANDPLOT HIGHLOWPLOT REGRESSIONPLOT

    - BARCHART LINECHART SERIESPLOT

    - BARCHARTPARM LOESSPLOT

    - DENSITYPLOT PLBSLINEPLOT


    The SAS default rendering technology for ODS Graphics is used to render curved
    lines for GTL plots. For the Java technology, for example, subpixel rendering
    is not used by default. In that case, curved lines can appear slightly jagged.
    The following figure shows a series plot with smoothed lines (SMOOTHCONNECT=TRUE)
    that was rendered with Java technology, using the default line rendering.'
