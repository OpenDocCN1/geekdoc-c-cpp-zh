    Graph Appearance with Styles," on page 391 |

    | the attributes of individual plots to make them independent of the current style
    | Use the appropriate attribute in the plot statements. | "Options That Override
    Attributes for Individual Plots" on page 117 |

    | the attributes of all the plots in a specific template to make them independent
