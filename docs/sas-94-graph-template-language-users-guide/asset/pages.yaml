    The data set up and SGRENDER stay unchanged.


    # Overlay of REFERENCELINE, BARCHARTPARM and SERIESPLOT


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_58_0.png)


    This same strategy would be used to create a horizontal box plot or histogram.
    If you wanted to reverse the ordering of the Y axis, you could add the REVERSE=TRUE
    option to the Y-axis options:


    ```

    layout overlay / yaxisopts=(reverse=true);

    ```


    Multiple Axes. Sometimes you have equivalent data in different scales (currency,
    measurements, and so on), or comparable data in the same scale that you want to
    display on independent opposing axes.


    The OVERLAY layout supports up to four independent axes where a Y2 axis opposes
    the Y axis to the right and an X2 axis opposes the X axis at the top of the layout
    container.


    The following is a complete program to generate this type of graph. We would like
    to display Fahrenheit temperatures on a separate Y2 axis from the Y axis used
    to display Celsius temperatures. For this particular example, it is not necessary
    to input variables for both temperatures because an EVAL function can be used
    to compute a new column of data within the context of the template.'
