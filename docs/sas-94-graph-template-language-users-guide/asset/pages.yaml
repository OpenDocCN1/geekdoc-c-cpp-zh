    # # Common Tasks


    The sections show the coding that is necessary to accomplish several common tasks
    for managing ODS output.


    # ## Controlling the Image Name and Image Format


    # ### Using the IMENAME= ODS Graphics Option to Control the Image Name


    For ODS Graphics output, by default, the ODS object name is used as the “root”
    name for the output file.


    The following example creates a GIF image named REPLOT:


    The assigned name REPLOT is treated as a “root” name and the first output is named
    REPLOT1, REPLOT2, and so on, with an increasing index counter. All graphs in this
    example will be GIF images.


    If you are developing a template and it takes several submissions to get the desired
    output, you might want to use the RESET or RESET= option to force each output
    to replace itself:


    ```

    ods graphics / reset=index ...;

    ```


    This specification causes all subsequent images to be created with the default
    or current image name.'
