    # Scaling Tick Values


    For large tick values on linear axes, you can specify a tick value scale to linear
    axes only. This feature allows you to use a named scale such as millions, billions,
    or trillions, or a scientific notation scale expressed as . To extract a scale
    automatically from the tick values, include the EXTRACTSCALE=TRUE option in the
    TICKVALUEFORMAT=option. By default, for tick values of 999 or greater, a named
    scale is used. For large tick values, the scale factor is set to ensure that the
    absolute value of the largest value is greater than 1. For small tick values,
    the scale factor is set to ensure that the absolute value of the smallest value
    is greater than 1.


    > Note: The scale that is extracted by the EXTRACTSCALE=option is derived from
    the English locale.


    To specify a scientific notation scale for values less than 999, include the EXTRACTSCALYPE=SCIENTIFIC
    option in the TICKVALUEFORMAT=option. The scale that is used is applied to the
    axis label.


    Here is an example that specifies the default scale for the growth example that
    is shown in “Making Axis Labels Fit” on page 74.


    ```

    layout / cycleatrs=true

    yaxisopts(label="Growth of Virus and Bacteria Cultures"

    shortlabel="Growth" lineattrs=(tickformat=(extractscale=true));

    seriesplot x=Hours y=Bacteria/ curabel="Bacteria";

    ```'
