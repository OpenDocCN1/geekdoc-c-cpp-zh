    \ in the SAS Registry\n- the size indicated by the DESIGNWIDTH= and DESIGNHEIGHT=\
    \ options of the BEGINRAPH statement\n- the WIDTH= and HEIGHT= options of the\
    \ ODS GRAPHICS statement.\n\n# BEGINRAPH Statement\n\nWhen creating a template,\
    \ you often want to control the design width and design height, especially for\
