  md: '# Using Sidebars 277


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_286_0.png)


    # Using Sidebars


    Sidebars are useful for aligning information outside of the grid. In the following
    example, a sidebar is used to display a graph title, rather than using an ENTRYTITLE
    statement. The advantage of using sidebars for title and footnote information
    is that a sidebar is always horizontally aligned on the grid itself, not on the
    complete graph width. Of course, you have to specify the properties (TEXTATTRs
    option), alignment (HALIGN= option), and padding (PAD= option). Compare the default
    centering of the "title" in this example with similar examples in this chapter
    that specify a title with the ENTRYTITLE statement.


    This example also uses a sidebar to display a legend. A legend can be placed in
    any of the TOP, BOTTOM, RIGHT, or LEFT sidebars. The legend''s alignment is based
    on the grid size, not the graph size.


    ```

    proc template;

    ende statagrap sidebar;

    beginraph / designwidth=490px designheight=800px border=false;


    layout datananel class=(product division) / columns=2

    columncounter=10 rowcounter=5

    headerlabellettrs=GraphLabelText (weight=bold)

    rowaxisisopts=(display=(ticks ticks))

    columnaxisisopts=(display=(ticks ticks))

    offsetmin=0

    linearopts=(tickvalueformat=dollar6. viewmax=2000)

    ```


    *'
  merge: -1
