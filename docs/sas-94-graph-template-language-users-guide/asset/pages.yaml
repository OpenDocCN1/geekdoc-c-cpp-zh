  md: '# 234 Chapter 10 • Using an Advanced Multi-cell Layout


    # Simple 3x1 Lattice with Enhanced Cell Headers


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_243_0.png)


    If you have a lengthy text description to add to a cell header, you should use
    multiple ENTRY statements to break the text into small segments. Otherwise, the
    text might be truncated. Also, for a given row, if the number of lines of text
    in the cell headers varies, a uniform cell height is maintained across the row
    by setting all the row headers to the height needed by the largest cell header.


    # Creating Uniform Axes across Rows or Columns


    # Internal Axes


    By default, the plots in the cells of the LATTICE layout manage manage their own
    axes, as demonstrated by the following example:


    ```

    proc template;

    define statgraph internalaxes;

    begingraph;

    ententytitle "Internal (cell-defined) Axes";

    layout lattice / columns=2 colgutter=5px;

    histogram mpg_city;

    histogram mpg_highway;

    endlayout;

    endgraph;

    ;

    ```


    ```

    proc sgrender data=sashelp.cars template=internalaxes;

    run;

    ```'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Creating Uniform Axes across Rows or Columns


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_244_0.png)


    In this example, notice that the X and Y axes have different ranges for each cell.
    cases where you want to facilitate comparisons of the cell contents, you can set
    uniform axis scales across the rows in the grid, or across the columns, or both.


    # Uniform Axis Ranges


    To set a uniform scale on the X axis in each row of a lattice, use the COLUMNDATARANGE=
    option on the LAYOUT LATTICE statement. Likewise, to set a uniform scale on the
    Y axis in each row of the lattice, use the ROWDATARANGE= option. These options
    accept accept one of the following values:


    ```

    DATA

    scales the axes independently for each cell. This is the default.


    UNION

    find the minimum of the data minima and the maximum of the data maxima, on a per-row
    or per-column basis, and sets this range on the appropriate axis for each cell
    in a row or column.


    UNIONALL

    find the minimum of the data minima and the maximum of the data maxima over rows
    or all columns, and sets this range on the appropriate axis for each cell.


    lattice lattice / columns=2 colgutter=5px

    columdatarange=unionall

    rowdatarange=union;


    histor mpg_city;

    histor mpg_high;


    endlayout;

    ```'
