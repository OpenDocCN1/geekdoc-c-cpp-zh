  md: 'If we designate another plot statement as "primary," its X= and Y columns are
    used to label the axes. The PRIMARY= option is useful when you desire a certain
    stacking order of the overlays, but you want the characteristics to be determined
    by a plot statement that is not the default primary plot statement. In the following
    example, the SECOND SERIESPLOT is set as the primary plot, so its columns determine
    the axis labels. In this case, the Y-axis label is determined by the VIRUS column.


    ```

    layout overlay / cycleatrs=true

    seriesplot x=Hours y=Bateria / curvelabel="Bacteria"

    seriesplot x=Hours y=Virus / curvelabel="Virus" primary=true;

    endlayout;

    ```


    Figure 5.1 Primary Plot Determines Default Axis Label


    # Default X and Y Linear Axes


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_82_0.png)


    In the previous two examples, allowing the primary plot to determine the Y-axis
    label did not result in an appropriate label because a more generic label is needed.
    To achieve this, you must set the axis label yourself with the LABEL= option.


    ```

    layout overlay / cycleatrs=true

    yaxisopts(label="Growth of Virus and Bateria Cultures")

    seriesplot x=Hours y=Bateria / curvelabel="Bateria"

    seriesplot x=Hours y=Virus / curvelabel="Virus"

    endlayout;

    ```


    For computed columns, an axis label is manufactured from the input column(s) and
    the functional transformation that is applied to the input column(s). For example,
    you can use an EVAL expression to compute a new column that can be used as a required
    argument as shown in the following example.


    ```

    layout overlay;

    histogram eval(weight*height);

    endlayout;

    ```


    In this example, the manufactured label is BIN(WEIGHT*HEIGHT) as shown in the
    following figure.'
