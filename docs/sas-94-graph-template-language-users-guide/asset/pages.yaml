  md: "# Distribution of Height and Weight\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_327_0.png)\n\
    \n**Setting Bin Width.** Another technique for binning data is to set a bin width\
    \ and compute the number of observations in each bin. In the DATA step below,\
    \ 5 is the bin width for HEIGHT and 25 for WEIGHT. With this technique you do\
    \ not know the exact number of bins, but you can ensure that the bins are a \"\
    good\" size.\n\n```\ndata heart;\n  set sashelp.heart (keep height weight);\n\
    \  if height ne and weight ne ;\\n  height=round(height, 5);\n  weight=round(weight,\
    \ 25);\n```\n\nAfter rounding, HEIGHT and WEIGHT can be used as classifiers for\
    \ a summarization. Notice that the COMPLETETYPES option forces all possible combinations\
    \ of the two variables to output, even if no data exists for a particular crossing.\n\
    \n```\nproc summary data-heart nway completetypes;\n  class height weight;\n \
    \ var height;\n  output out=stats (keep height weight count) N=Count;\n```\n\n\
    The template can be simplified because we know that the midpoints are spaced integers.\
    \ For this selection of bin widths, 6 bins were produced for HEIGHT and 10 for\
    \ WEIGHT.\n\n```\nproc template;\n  define statgraph histogram2a;\n  begingraph;\n\
