  md: "356  Chapter 17  Adding Insets to a Graph\n\n(DATALATTICE and DATAPANEL layouts\
    \ provide options (for example, INSET=) enable you to construct and locate inlets\
    \ in multi-cell layouts, without using ENTRY statements.\n\nThis chapter shows\
    \ several techniques for adding inlets to a graph. It assumes that you are familiar\
    \ with the concepts and techniques presented in Chapter 7, “Adding and Changing\
    \ Text in a Graph,” on page 157 and Chapter 9, “Using a Simple Multi-cell Layout,”\
    \ on page 211.\n\n# Creating a Simple Inset with an ENTRY Statement\n\nYou can\
    \ use an ENTRY statement to create a simple inset within most layout blocks.\n\
    \nIf you create the inlets within a 2-D overlay-type layout, you can use each\
    \ statement’s AUTOALIGN= option or HALIGN= and VALIGN= options to position the\
    \ text within the plot area. The HALIGN= and VALIGN= options position the text\
    \ in an absolute position (such as HALIGN=LEFT and VALIGN=TOP). The AUTOALIGN=\
    \ option is used for dynamic positioning that is based on placement of the graphical\
    \ components in the plot area.\n\nFor example, to add an inset to an overlay of\
    \ a scatter plot and an ellipse, you would like the text to appear where it does\
    \ not collide with markers or the ellipse, if at all congestion.\n\n```\nbegingraph;\n\
    entrytitle \"One Line Inset\";\nlayout overlay;\nelipse x=height y=weight / alpha=.1\
    \ predicted display=all;\nscatterplotplot x=height y=weight;\nentry \"Prediction\
    \ Ellipse ({unicode alpha} \".1\") / \nautoalign=auto;\nendlayout;\nendgraph;\n\
    ```"
