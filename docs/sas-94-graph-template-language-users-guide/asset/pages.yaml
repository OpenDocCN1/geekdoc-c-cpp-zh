    # Formatting Axis Tick Values


    Linear axes use special techniques to provide the generation of "good" tick values
    that are based on the data range. If a tick value format is not specified, the
    columns provide a "hint" on how to represent the tick values, but those formats
    do not generally control the representation or precision of the tick values.


    To force a format to be used for a linear axis, you can use syntax similar to
    the following, where you specify any SAS numeric format:


    ```

    linearopts=(tickvalueformat=best6.);

    ```


    > Note: GTL currently does not support every SAS format. For a list of supported
    formats, see Appendix 5, "SAS Formats Not Supported," on page 503.


    If you want the column format of the input data to be directly used, specify the
    following:


    ```

    linearopts=(tickvalueformat=data)

    ```


    There are special options to control tick values. INTEGER=TRUE calculates integers
    to use tick values given the range of the data.


    Here is an example that overrides the dollar format on column Close in Sashelp.Stocks
    with a decimal format.


    ```

    proc template;

    define statgraph bartchart;

    begin;

    entryitle="Monthly Stock Performance in 2001"

    layout overlay /

    xaxisopts=(griddplay=on gridattrs=(pattern=dot))

    timeopts=(tickvalueformat=moneame3. maxvalue=''01DEC2001'')

    yaxisisopts=(griddplay=on gridattrs=(pattern=dot))

    label="Closing Value (U.S. Dollars)"

    linearopts=(tickvalueformat=5.0));

    ```'
