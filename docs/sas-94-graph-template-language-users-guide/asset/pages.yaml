    | Plot 1 | Plot 3 | Plot 5 |

    | Plot 2 | Plot 4 | Empty |


    # Setting Gutters


    To conserve space, the default GRIDED layout does not include a gap between cell
    boundaries. In some cases, this might cause the cell contents to appear too congested.
    You can add a vertical gap between all cells with the COLUMNGUTTER= option, or
    add a horizontal gap between all rows with the ROWGUTTER= option. If no units
    are specified, pixels (PX) are assumed.


    ```

    layout gridded / columns=3 columgutter=5 rowgutter=5

    /* plot1 definition /

    /* plot2 definition /

    /* plot3 definition /

    /* plot4 definition /

    /* plot5 definition /

    endlayout;

    ```


    | Plot 1 | Plot 2 | Plot 3 |

    | Plot 4 | Plot 5 | Empty |


    Note that by adding gutters, you do not increase the size of the graph. Instead,
    the cells shrink to accommodate the gutters. Depending on the number of cells
    in the grid and the size of the gutters, you will frequently want to adjust the
    size of the graph to obtain optimal results, especially if the cells contain complex
    graphs. For more information, see "Sizing Issues" on page 218.


    # Defining Cells


    Two valid techniques are available for indicating the contents of the cell:'
  merge: -1
  pgno: 223
- img_proc: true
  md: '| Technique | Example | Advantages | Disadvantages |

    | --- | --- | --- | --- |

    | stand-alone statement or text | scatterplot x= y; | simplicity | cannot have
    overlays cannot adjust axes, borders, or backgrounds (these are layout options)
    |

    | layout block | layout overlay; scatterplot x= y; seriesplot x= y; endlayout;
    | cell can contain a complex plot axes can be adjusted other layout types can
    be used | more complexity |


    The following definition for a GRIDDED layout shows a simple example:


    ```

    entityrule "Simple 3x2 Lattice with Five Cells Populated";


    layout gridded / columns=3;


    /* stand-alone plot statements define cells 1-3 */

    boxplot x=sex y=age;

    boxplot x=sex y=height;

    boxplot x=sex y=weight;


    /* overlay blocks define cells 4-5 */

    layout overlay;

    scatterplot y=weight x=height;

    bpslineplot y=weight x=height;

    entry halign=right="Spline" / valign=bottom;

    endlayout;


    layout overlay;

    scatterplot y=weight x=height;

    loessplot y=weight x=height;

    entry halign=right="Loess " / valign=bottom;

    endlayout;

    ```'
