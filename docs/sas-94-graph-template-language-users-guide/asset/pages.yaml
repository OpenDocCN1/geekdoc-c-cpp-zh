  md: '# Data Skins


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_160_0.png)


    Data skins add a heightened visual effect to two-dimensional plots and pie charts
    that are generated using the GTL. Each skin uses shading, highlighting, and shadowing
    to give the appearance of contour and depth to certain elements of a graph, including
    the legend. For plots, the effect is generated by filters and is applied to filled
    areas, markers, and lines. When a data skin is applied to a filled area, it does
    not change the underlying fill color and pattern of the area, but does set the
    area fill outline color to black. In that case, the outline color is controlled
    by the filters that generate the skin and is not controlled by the ODS style attributes.
    As a result, when a data skin is applied, the area fill outline is black regardless
    of the ODS style that is in effect or any custom outline attributes that are specified.


    Data skins can be specified in the following GTL plot statements:


    +   * BARCHART HISTOGRAM SCATTERPLOTMATRIX

    * BARCHARTPARM HISTOGRAMPARM SERIESPLOT

    * BOXPLOT LINECHART STEPPLOT

    * BOXPLOTPARAM NEEDLEPLOT VECTORPLOT

    * BUBBLEPLOT PIECHART WATERFALLPLOT

    * DROPLINE REFERENCELINE

    * HIGHPLOT SCATTERPLOT


    Data skins can be applied to filled areas, markers, and lines in a plot. The data
    skins include SHEEN, GLOSS, PRESSED, CRISP, and MATTE. The following figure shows
    each of the data skins applied to the filled areas of a bar chart and a pie chart.


    Note: A display with no data skin applied is included for comparison.'
