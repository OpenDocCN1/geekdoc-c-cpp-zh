  md: 'Drill-down graphs provide a convenient means for your users to explore complex
    data. In a drill-down graph, active links are created on certain elements of the
    graph. When a user clicks a linked element, the linked resource appears in a new
    browser window by default. The resource can be another page or an image file that
    contains a supporting graph. For example, consider the pie chart shown in the
    following figure.


    # Total Sales By Product


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_479_0.png)


    To provide your users with sales information for each product, you can create
    a drill-down pie chart in which each slice is linked to a bar chart that shows
    sales data for product. You can also add a footnote that prompts the user to click
    a pie slice for more information. In this drill-down pie chart, if the user clicks
    the SOFA pie slice, a bar chart showing the sales data for SOFA appears in a new
    browser window, as shown in the following figure.


    | Total Sales By Product | SOFA Sales Data |

    | --- | --- |

    | BED $142,037 | $30,000 |

    | SOFA $148,588 | $20,000 |

    | TABLE $142,200 | $10,000 |

    | CHAIR $148,280 | $0 |

    | DESK $149,232 | CANADA GERMANY U.S.A. |

    | Product=SOFA | Year: 1993 1994 |


    *Click a pie slice for product-specific sales data.


    When the mouse pointer is positioned on a pie slice, the data tip pointer changes
    to indicate an active link. The drill-down link target is a new browser window
    by default. You can use the DRITARGET option in your ODS GRAPHICS statement to
    specify a different target, such as SELF. In that case, the drill-down graphs
    open in the same browser window. See SAS Output Delivery System: User''s Guide
    for more information about the ODS GRAPHICS DRITARGET=option.


    In order to create a drill-down graph, you must do the following:'
  merge: -1
