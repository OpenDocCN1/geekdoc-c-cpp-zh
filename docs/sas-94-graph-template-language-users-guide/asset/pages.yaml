  md: '# Controlling the Interactions of Classifiers 287


    Panel 2 of 2


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_296_0.png)


    # Sparse Data


    Multiple classifiers sometimes have a hierarchical relationship, which results
    in very sparse data when the classifier values are crossed. For example, consider
    the following LAYOUT DATAPANEL


    ```

    layout datapanel classvars=(state city) / rows=4 columns=5;

    ```


    Assume that the data for the STATE and CITY classifiers contains information for
    20 states and their capitals. How many panels would you expect to produce? One,
    or twenty? Or 400?


    The answer is one panel, which is the desired result. A single panel is produced
    even though the default DATAPANEL layout attempts to generate a complete Cartesian
    product of the crossing (400) STATE*CITY crossings in this case), it does not
    create panel for cells that have no data. The SPARSE- option controls whether
    panel cells are created when you have no observations for a crossing, and by default
    SPARSE=FALSE.


    The DATALLICE layout does not support a SPARSE-option. It creates a row / column
    for each unique value of the ROWWAR / COLMNVAR. So a cell is created for all of
    the two variable values, creating 400 cells.


    Sometimes there are unexpected gaps in the data when classification variables
    are crossed. For example, suppose you are conducting a study where a number of
    subjects receives over four treatments that might lower the subject''s heart rate
    after various amounts of physical activity. However, assume that Subject 101 did
    not get Treatment 3, and Subject 102 did not get Treatment 2. In this case, you
    create a DATAPANEL layout presenting four treatments for three subjects per panel,
    the expected alignment of the columns does not work:'
  merge: -1
  pgno: 296
- img_proc: true
