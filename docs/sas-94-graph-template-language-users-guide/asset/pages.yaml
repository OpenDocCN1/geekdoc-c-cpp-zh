    # Cell Size


    You might think that the panel size can be varied to be big or small as desired.
    However, problems arise as the graph size shrinks. Several adjustments in the
    graph enable small images to produced:


    +   - Fonts are reduced.

    - Axis values are thinned, rotated, or truncated.

    - Labels in the cell headers are truncated. (The options that are available for
    controlling the cell header content and are discussed in "Controlling the Classification
    Headers" on page 275).


    For example, the following code sets a 420 pixel width for a classification panel:


    ods graphics / reset width=420px ;


    ```

    proc sgrender data=sashelp.orsales template=onerow;

    where product_group in ("Golf" "Tennis" "Soccer")

    run;

    ```


