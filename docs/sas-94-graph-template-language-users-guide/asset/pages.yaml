  md: '# Attribute Maps to Control the Appearance of Grouped Data


    # Discrete Attribute Maps


    A Discrete attribute map enables you to consistently assign attributes to specific
    values of a numeric or character column in a data set. The assignment of the attributes
    is based on formatted data values and is independent of the position of the data
    in the set. It is typically used to visually highlight group values on a plot
    using marker symbols, fill colors, line patterns, and so on. To create a discrete
    attribute map, you must do the following:


    +   - Use a DISCRETEATTRMAP with one or more VALUE statements to define your attribute
    map.


    +   - Use a DISCRETEATTRVAR statement to create an attribute variable that associates
    your attribute map with a data column in your plot data set.


    +   - Set the group option in your plot statement to the name of the attribute
    that you created in DISCRETEATTRVAR statement. The group includes GROUP=; COLORGROUP=;
    MARKERGROUP= and so on, depending on the plot statement. SAS Graph Template Language:
    Reference for information about the group options and whether they accept attribute
    variables.


    The DISCRETEATTRMAP block includes one or more VALUE statements to associate a
    single value to a set of group attributes, such as LINEATTRS, MARKERATTRS, TEXTATTRS,
    or FILLATTRS. Any column values that are not accounted for in the VALUE statements
    are assigned the default visual properties that would normally be assigned if
    an attribute map was not used.


    The DISCRETEATTRVAR statement also includes a NAME= option that enables you to
    specify a unique name for the map. The block must appear in the global area of
    the template between the BEGINGRAPH statement and the FIRST LAYOUT statement.
    It cannot be nested within any other statement. An ENDDISCRETEATTRMAP statement
    must be used to end the block.


    The DISCRETEATTRVAR statement creates a named association between DISCRETEATTRVAR
    and a column in your plot data set. To create the attribute variable, do the following:


    +   - Add a DISCRETEATTRVAR statement to the global area of your template between
    the BEGINGRAPH statement and the first layout statement.


    +   - Set the ATTRVAR= option to a unique name for the attribute-map-to-data-set
    association.


    +   - Set the ATTRMAP= option to the value of the NAME= option that you used in
    your DISCRETEATTRMAP statement.


    +   - Set the VAR= option to the numeric or character column in your plot data
    set, or the name of a dynamic variable.


    After you create the discrete attribute map and the variable, in your plot statement,
    set the GROUP= option or other roles that can accept a discrete attribute to the
    value of the ATTRVAR= option that you used in DISCRETEATTRVAR statement.


    Note: Do not use the attribute variable in an expression. Doing so might produce
    unexpected results.'
