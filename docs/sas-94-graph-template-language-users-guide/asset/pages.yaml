    # Adding Observations for Polylines and Polygons


    Multiple observations are required to construct a polyline or polygon. The first
    observation establishes the starting point of the polyline or polygon. The subsequent
    observations specify the individual segments of the polyline or polygon. A polygon
    must have at least one segment. A polygon is similar to a polyline except the
    segments of the polygon must form a closed shape. To specify the starting point,
    you must specify, a POLYLINE or POLYGON in the Function column, and the coordinates
    of the polyline or polygon point. You can add other columns to specify attributes
    of the lines, such as color, pattern, and thickness. For information about other
    columns you can see, "POLYLINE Function" in SAS ODS Graphics: Procedures Guide
    * and "POLYGON Function" in SAS ODS Graphics: Procedures Guide.


    For each segment of your polyline or polygon, you must add one observation for
    each segment. Each segment observation specifies POLYCNT in the Function column
    and the ending coordinates for segment. For the first segment, this observation
    draws a line from the beginning to the ending point that is specified in the first
    segment. For the second and subsequent segments, the observation draws a line
    from the ending point of the previous segment to the ending point that is specified
    in the current segment observation.


    Here is an example of a DATA step creates an observation for a five-segment polyline
    annotation.


    ```

    data linedata:

    function="polyline"

    drawspace="graphpixel"; /* Begin polyline */

    x1=30; y1=150; /* Draw Segment 1 */

    output;

    function="polycont"

    x1=110; y1=150; /* Draw Segment 2 */

    output;

    x1=145; y1=250; /* Draw Segment 2 */

    output;

    x1=170; y1=50; /* Draw Segment 3 */

    output;

    x1=205; y1=150; /* Draw Segment 4 */

    output;

    x1=285; y1=150; /* Draw Segment 5 */

    output;

    ```'
