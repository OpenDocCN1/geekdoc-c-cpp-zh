  md: '# Distribution of Height and Weight


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_324_0.png)


    As with a standard histogram, the X and Y variables have been uniformly binned,
    which means their data ranges in the bivariate histogram have been divided into
    equal intervals (bins), and that observations are distributed into one of these
    bins.


    The BHISTOGRAM3DPARM statement, which produced this plot, does not perform any
    binning combination on the input columns. Thus, you must pre-bin the data. In
    following example the binning is done by PROC KDE (part of the SAS/STAT product).


    ```

    proc kde data=sashelp.heart;

    bivar height weight(ngrid=10) /

    out=kde(keep=value2 count) noprint plots=;

    ```


    In this program, the NGRID= sets the number of bins to create for each variable.
    The default for NGRID is 60. The binned values for Height are stored in VALUE1,
    and the binned values for Weight are stored in VALUE2. This selection of bins
    produces 1 observation for each of the 80 combinations. Frequency counts for each
