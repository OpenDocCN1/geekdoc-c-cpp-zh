  md: '# Overlay of NEEDLEPLOT and SCATTERPLOT SCATTERPLOT uses Y2 axis


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_59_0.png)


    At this point, the most important concept to understand about template code is
    that independent axis can be created by mapping data to it. Notice the SCATTERPLOT
    statement uses YAXIS=Y2 option. This causes the Y2 to be displayed and scaled
    with the variable representing Fahrenheit values. It is important to note that
    multiple plots in an overlay share the same axis (such as the X-Axis). Hence,
    the options to control the axis attributes are not found on the plot statements,
    but rather in the LAYOUT statement. Most of the Y and Y2 axis options are included
    to force the tick marks for the two different axis scales to accurately contrast.
    And many other issues are discussed in detail in Chapter 5, “Managing Axes in
    an OVERLAY,” on page 63.


    ```

    data temp;

    input City $1-11 Celsius;

    datelines;

    New York 11

    sydney 12

    Mexico City 18

    Paris 8

    Tokyo 6;

    ```


    ```

    proc template;

    define statgraph Yaxis;

    begirun;

    entrititle "Overlay of NEEDLEPLOT and SCATTERPLOT";

    entrititle "SCATTERPLOT uses Y2 axis";

    layout overlay /

    yaxisoptions=(display=(tickvalues));

    yaxisoptions=(griddisplay=on offset=0)

    lineoptions=(viewmin=0 viewmax=20)

    thresholdmin=0 thresholdmax=0)

    yaxisoptions=(label="Fahrenheit" offset=0)

    lineoptions=(viewmin=32 viewmax=68)

    thresholdmin=0 thresholdmax=0));

    needleplot

    x=City y=Celsius;

    scatterplot x=City y=32+(9*Celsius/5) / yaxis=y2

    markattrs=(symbol=circlefilled);

    ```'
