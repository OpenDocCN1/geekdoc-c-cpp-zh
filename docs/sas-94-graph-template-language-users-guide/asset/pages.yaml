    Introduction to GTL Statements

    GTL encompasses a large number of statements and options. This chapter provides
    an organizational framework to help you think about the language. Just as you
    can think of the SAS language syntax in Statements, Functions, Formats, and System
    options, you can apply a classification scheme to GTL. A general understanding
    of the GTL helps you write your templates with more confidence and efficiency.
    Some of the terminology introduced here will appear often in other chapters.


    # Statements


    All GTL statements have the following syntax:

    KEYWORD(s) required argument(s) < / option(s)'
