  md: '# 322 Chapter 13 • Using 3-D Graphics


    # Surface Plot of Lake Bed


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_331_0.png)


    The SURFACEPLOTPAR statement assumes that the response/Z values have been provided
    for a uniform X-Y grid. Missing Z values will leave a "hole" in the surface.


    The observations in the input data set form an evenly spaced grid of horizontal
    (X and Y) values and one vertical (Z) value for each of these combinations. The
    observations should be in sorted order of Y and X to obtain an accurate graph.
    The sort direction for Y should be ascending. The sort direction of X can be either
    ascending or descending.


    In the following example, 315 observations in Sashelp.Lake are gridded into a
    15 by 21 grid. The length of the grid is from 0 to 7 by .5, and the width of the
    grid is from 0 to 10 by .5. There are no missing depth values.


    | Obs | Width | Depth | Z |

    | --- | --- | --- | --- |

    | 1 | 0 | 0 | 0 |

    | 2 | 0 | 0 | 0 |

    | 3 | 0 | 0.5 | 0 |

    | 4 | 0 | 1.5 | -0.0059773260 |

    | 5 | 0 | 2 | 0 |

    | 6 | 0 | 2.5 | 0 |

    | 7 | 0 | 3 | 0 |

    | 8 | 0 | 3.5 | -0.0218701311 |

    | 9 | 0 | 4 | 0 |

    | 10 | 0 | 4.5 | 0 |

    | 11 | 0 | 5 | 0 |

    | 12 | 0 | 5.5 | -0.0029886630 |

    | 13 | 0 | 6 | 0 |

    | 14 | 0 | 6.5 | 0 |

    | 15 | 0 | 7 | 0 |

    | 16 | 0.5 | 0 | 0 |

    | 17 | 0.5 | 0.5 | 0 |

    | 18 | 0.5 | 1 | 0 |


    Input data with non-gridded columns should be preprocessed with PROC G3GRID. This
    procedure creates an output data set, and it allows specification of the grid
    size and various methods for computed interpolated Z column(s). For further details,
    see the documentation for PROC G3GRID in the SAS/GRAPH: Reference.


