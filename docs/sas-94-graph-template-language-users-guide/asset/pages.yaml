  md: 'IPSET=(info-options) Determines what information is displayed in an inset.
    Accepts one, two, or three of the following keywords:


    +   NOBS

    Number of observations


    +   PEARSON

    Pearson product-moment correlation


    +   PEARSONPVAL

    Probability value for the Pearson product-moment correlation


    This option must be used to determine which inset information is displayed in
    each cell. If this option is not used, the related CORRUPTS= and INSETOPTS= options
    are ignored.


    CORRUPTS=(correlation-options) Controls statistical options for computing correlations.
    These options are similar to PROC COR options. Accepts one or more of the following
    keywords:


    +   EXCLNPWG=

    specifies whether observations with non-positive weight values are excluded from
    the analysis. Accepts TRUE (the default) or FALSE.


    +   NOMISS=

    specifies observations with missing values are excluded from the analysis that
    is displayed in the inset. Accepts TRUE (the default) or FALSE. The NOMISS=TRUE
    option does not exclude observations with missing values from the plot.


    +   WEIGHT=

    specifies a weighting variable to use in the calculation of Pearson weighted-product-moment
    correlation. The observations with missing weights are excluded from the analysis.
    Accepts the name of a numeric column.


    +   VARDEF=

    specifies the variance divisor in the calculation of variances and covariances.
    Accepts one of the keywords DF (Degrees of Freedom, the default, N - 1), N (number
    of observations), WDF (sum of weights minus 1), WEIGHT (sum of weights).'
