    Unlike SAS TITLE and FOOTNOTE statements, the GTL statements are not numbered.
    If you include multiple ENTRYTITLE or ENTRYFOOTNOTE statements, the titles or
    footnotes will be stacked in the specified order—all ENTRYTITLE statements are
    gathered and placed in the ENTRYTITLE area at the top of the graph, and all ENTRYFOOTNOTE
    statements are gathered and placed in the ENTRYFOOTNOTE area at the bottom of
    the graph.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_171_1.png)


    You can add as many titles and footnotes as you want. However, the space that
    is needed to accommodate the titles and footnotes always decreases the height
    of the graphical area. For extensive titles or footnotes, you should consider
    enlarging the graph size. For a discussion on sizing graphs, see “Controlling
    Graph Size” on page 455.


    # Using Text Entries in the Graphical Area


    An ENTRY statement defines text within the graphical area. Here is a simple example
    that places text in the upper left corner of the plot area:


    ```

    layout overlay;

    scatterplot x=height y=weight;

    entry halign=left "NOBS = 19" /

    valign=top border=true;

    endlayout;

    ```'
