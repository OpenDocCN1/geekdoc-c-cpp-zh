- img_proc: true
  md: '# Comparison of Fit Lines


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_232_0.png)


    If you provide both the HEIGHT= and WIDTH= options in the ODS GRAPHICS statement,
    you completely override the design aspect ratio. If the WIDTH= or HEIGHT= options
    are not specified, the design size is in effect.


    Setting the DESIGNHEIGHT= and DESIGNWIDTH= options is highly recommended for all
    multi-cell layouts that contain plots. This recommendation applies to the GRIDED,
    LATTICE, DATAPANEL, and DATALATTICE layouts.'
