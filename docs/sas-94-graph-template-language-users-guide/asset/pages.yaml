  md: '# LINEATTRS Option


    The following syntax is the complete syntax for the LINEATTRS= option:

    LINEATTRS = style-element | style-element (line-options) | (line-options)

    Options on page 494.


    For information about the attributes that you can specify with line-options, see
    “Line Options"

    By default, a style-element is used for the LINEATTRS= REFERENCELINE and DROPLINE
    statements, the default style element is the GraphReference element. What exactly
    does this mean?


    If we look up the GraphReference element in the DEFAULT style (see Appendix 2,
    “Graph Style Elements Used by ODS Graphics,” on page 479 for a complete list of
    all elements and their defaults), we find the following:


    ```

    styleReference /

    linethickness = 1px

    linestyle = 1

    contrastcolor = GraphColors(''grefencencesline'')

    ```


    This definition is ODS style syntax for an attribute bundle. The following table
    shows how this definition''s style attributes map to GTL options.


    | Style Attribute | Description | GTL Suboption | Description |

    |---|---|---|--- |

    | LINETHICKNESS | dimension, most pixels | THICKNESS | dimension, most pixels
    |

    | LINESTYLE | numeric; 1 to 46, 1 being a solid line | PATTERN | either 1 to 46
    or a pattern name, such as SOLID, DASH, DOT (see “Available Patterns” on page
    497 for examples of available line patterns) |

    | CONTCOLOR | color specification | COLOR | color specification |


    The default specification for REFERENCELINE and DROPLINE statements are LINEATTRS=GraphReference,
    which is a shortcut meaning “initialize the three GTL line properties with the
    corresponding attributes are defined in a style element.” This can be explicitly
    expressed in GTL as follows:


    ```

    LINESTYLE= (PATTERN = GraphReference:LineStyle

    THICKNESS=GraphReference:LineThickness

    COLOR = GraphReference:Contrast )

    ```


    In GTL, a style element is a construct of the form style-element: style-attribute.
    The convention is to refer to a specific style attribute of a specific element.


    First, we will look at what it means to use a different style element for the
    LINEATTRS=option.


    When selecting a different style element, you should make sure that style element
    does not necessarily define all possible attributes. Some reasonable choices might
    be GraphDataDefault, GraphAxisLimes,'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Options That Override Attributes for Individual Plots 119


    GraphGridLines, and GraphBorderLines. You might choose GraphGridLines to force
    a reference line to match the properties of grid lines (displayed). When you make
    this type of assignment, you really do not know what line properties will be used
    because they might change, depending on how a style is defined. You should be
    confident that the grid lines and reference lines are identical in term of properties.


    Now we assume that you want reference lines to be somewhat a style element, but
    different. This involves an override. Here are some examples:


    +   1) LINEATTRS=GraphGridLines(THICKNESS=2px)

    2) LINEATTRS=GraphAxisLines(PATTERN=DASH)

    3) LINEATTRS=GraphReference(COLOR=GraphAxisLines:ContrastColor)

    4) LINEATTRS=(COLOR=GraphAxisLines:ContrastColor)

    5) LINEATTRS=(COLOR=BLUE)


    In example 1, the reference line looks like a grid line (color and pattern), but
    is thicker (assuming most styles define grid lines as 1px).


    In example 2, the reference line looks like an axis line (color and thickness),
    but it uses the DASH pattern.


    In example 3, the reference line looks like a reference line (pattern and thickness),
    but it has the color of axis lines.


    Example 4 is a short form for example 3. Any time you do not override all the
    suboptions, the suboptions not overridden from the default style references.


    Example 5 shows how you hardcode visual properties. This technique is a straightforward
    way of getting what you want. The results might look good when the DEFAULT or
    LISTING styles are in effect, but might not look good when the ANALYSIS style
    is in because ANALYSIS does not use any blues in its color scheme.


    # MARKERATTRS Option


    Much of what is said about line properties in “LINEATTRS Option” on page 118 applies
    to marker properties. Some plot statements, such as SERIESPLOT, display a line
    and can display markers. In those cases, you should use the DISPLAY=(MARKERS)
    option to turn the marker display, and also use the MARKERATTRS= option to control
    the appearance of the markers. The BOXPLOT statement uses OUTLIERATTRS= MEANATTRS=options.


    The following syntax is the complete syntax for the MARKERATTRS= option:

    MARKERATTRS=style-element | style-element (marker-options) | (marker-options)


    For information about the attributes that you can specify with marker-options,
    see "Marker Options” on page 496.


    | Style Attribute | Description | GTL Suboption | Description |

    |---|---|---|---|

    | CONTRASTCOLOR | color specification | COLOR | color specification |

    | MARKERSIZE | dimension, most often pixels | SIZE | dimension, most often pixels
    |'
