  md: "EXTENBLOCKMISSING=TRUE option extends the blocks across the missing values\
    \ of the Release column. The BLOCK= transition points control the boundary of\
    \ each block and the text that is displayed. In this case, a new block begins\
    \ at each nonmissing value of the Release column. The range of the X= values between\
    \ two block points determine the width of each block.\n\nThe BLOCKPLOT statement\
    \ specifies many options for controlling the content, position, and appearance\
    \ of the blocks and text information.\n\nDISPLAY= <OUTLINE>= <FILL> <VALUES> >\
    \ specifies the features to display\n\nEXTENBLOCKMISSING=TRUE FALSE specifies\
    \ whether the block continues with the previous nonmissing value or a new block\
    \ is started when a missing value is encountered in the Block column\n\nVALUEALIGN=TOP\
    \ | CENTER | BOTTOM specifies the vertical position of the text values within\
    \ the blocks\n\nVALUEALIGN=LEFT | RIGHT | TOP | START specifies the horizontal\
    \ position of the text values within the blocks\n\nLABELPOSITION=LEFT | RIGHT\
    \ | TOP | BOTTOM specifies a position for the block label that applies to the\
    \ blocks\n\nVALUEATTRS=style-element specifies font properties for block the values\n\
    \nLABELATTRS=style-element specifies font properties for the block label\n\nThe\
    \ next example shows a different way to present the same information. Here the\
    \ outlines are removed and the blocks are filled with colors. The example uses\
    \ the following BLOCKPLOT options: \n\nFILLTYPE= MULTICOL | ALTERNATE specifies\
    \ how the blocks are filled\n\nDATATRSPARENCY= number specifies the degree of\
    \ transparency of the block fill and outline. The range for number is from 0 (opaque)\
    \ to 1 (entirely transparent)."
  merge: -1
  pgno: 392
