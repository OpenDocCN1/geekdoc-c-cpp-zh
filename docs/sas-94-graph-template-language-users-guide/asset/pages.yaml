    ![](img/a9ccb6123dee40d424cb295a3a99c16c_294_0.png)


    Normally, when the number of cells to be created in a panel is greater than the
    defined panel size in the template (rows * columns), then the SGREND procedure
    automatically produces the number of panel graphs that are necessary to draw all
    of the cells in the data. However, you can instruct the template to create only
    one panel, which is specified by the PANELNUMBER= option. This feature can be
    used to control the creation of the panels.


    For example, the preceding panels were generated with the following template code,
    which uses the NMVAR statement to declare macro variables that will resolve as
    numbers. The PANELNUMBER-PANEL setting is a directive indicating which panel to
    produce. The ENTRYTITLE statement changes as the panel changes. For more information
    about how to pass information to a template at run time, see Chapter 14, “Using
    Dynamics and Macro Variables to Make Flexible Templates,” on page 327.


    ```

    proc template;

    def statgraph panelgen;

    mvar *right= PANEL * TOTPANELS ROWS COLS YEAR;

    begegin;

    ententytitle align="Panel PANELNUMBER" of * TOTPANELS /

    textattrs=GraphfontNotText;

    layout datapanel classvars=(product division) /

    rows=ROWS columns=COLS

    cellheight=50 cellwidth=50

    skypeptycells=true

    columnaxisopts=(type=time timeouts=(tickvalueformat=month.

    rowaxisisopts=(griddisplay=on)

    panelnumber=PANELNUMBER;

    layout prototype;

    seriesplot x=month y=actual / lineattrs=GraphDatal;

    endlayout;

    ```'
  merge: -1
  pgno: 294
- img_proc: true
  md: "# 286 Chapter 11 • Using Classification Panels\n\n```\nsidebar / align-top;\n\
    entry \"Office Furniture Sales for \" YEAR /\ntextattrs=GraphTitleText;\nendesbar;\n\
    endlayout;\nendgraph;\nrun;\n```\n\nNow that the template is defined, a macro\
    \ is needed to compute the number of panels that will be generated, execute PROC\
    \ SGRENDER an appropriate number of times, and initialize the macro variables\
    \ that are referenced in the template. The macro parameters ROWS and COLUMNS allow\
    \ different grid sizes to be used. The graph size changes based on the size.\n\
    \n```\n%macro panels(rows=1,cols=1,year=1994);\n  %local div_prod_vals panels\
    \ totpanels panelnumber;\n  /* find the number of unique values for the classifiers\
    \ */\n  proc sql noprint;\n    select n(distinct division) into: div_vals from\
    \ sashelp.prdsale;\n    select n(distinct product) into: prod_vals from sashelp.prdsale;\n\
    \  quit;\n```\n\n```\n/* compute the number of panels based on rows and cols */\n\
    \  %let panels=%syevalf(&div_vals * &prod_vals / (&rows * &cols));\n  %let totpanels=%syevalf(ceil(&panels));\
    \ /* round up to next integer */\n```\n\n```\nods graphics / reset;\nods html;\n\
    ods listing=listing-gpath=\".image_dpi=200;\n\n%do panel=1 %to &totpanels;\n```\n\
    \n```\nods graphics / imagename=\"Panel&panelnumber\";\nwidth=%syevalf(&cols)px\
    \ height=%syevalf(200*&rows)px;\n\nproc sgender data=sashelp.prdsale template=panelgen\n\
    where country=\"U.S.A.\" and region=\"EAST\" and year=&year;\nrun;\n\nods listing\
    \ close;\n html;\n%end;\n```\n\nThe three panels that are shown at the beginning\
    \ of this section were produced with the following macro call:\n\n```\n%panels(rows=2,cols=2)\n\
    ```\n\nIf you invoke the macro with different grid dimensions, the number of panels\
    \ is recomputed and a new graph size is set. For example, if the following macro\
    \ call is issued, two panels are generated (only the last panel is shown here):\n\
    \n```\n%panels(rows=2,cols=3)\n```"
  merge: -1
