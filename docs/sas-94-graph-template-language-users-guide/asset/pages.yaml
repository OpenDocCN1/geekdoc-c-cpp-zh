    ![](img/a9ccb6123dee40d424cb295a3a99c16c_173_0.png)


    For each horizontal alignment, the overall text for these statements is formed
    by the concatenation of the text items. Notice that there is no concatenation
    operator and that any spacing (such as word breaks) must be provided as needed
    within the strings ("Hello "World"). The space that separates the text-item specifications
    is not included in the final text.


    # Horizontally Aligning Text Items


    Text items can have different horizontal alignments: LEFT, CENTER, or RIGHT. The
    default alignment is CENTER. Text items with the same alignment are gathered and
    concatenated.


    ```

    entryfootnote align=left texttattrs=(weight=bold) "XYZ Corp." \

    halign=right texttattrs=(weight=normal) "30JUN08";

    ```


    Here is the output.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_173_1.png)


    # Generating Text Items with Dynamics, Macro Variables, and Expressions


    Text items are not limited to string literals. Text items can also be defined
    as dynamics, macro variables, or expressions. In the following example, SYSDATE
    is declared with an MVAR template statement. As a result, this automatic macro
    variable is resolved to today''s date at run time.


    ```

    entryfootnote align=left texttattrs=(weight=bold) "XYZ Corp." \

    halign=right texttattrs=(weight=normal) SYSDATE ;

    ```'
