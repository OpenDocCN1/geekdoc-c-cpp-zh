    # ENTRY Statements: Additional Control


    # Features Available for ENTRY Text


    +   ENTRY statements are more flexible than ENTRYTITLE or ENTRYFOOTNOTE statements
    and support additional features for automatically positioning text, aligning text
    vertically, and rotating text:


    +   AUTOALIGN=NONE | AUTO (location-list)


    +   Specifies whether the entry is automatically aligned within its parent wall
    when nested within an overlay-type layout.


    +   ROTATE=0 | 90 | 180 | 270


    +   Specifies the angle of text rotation.


    +   VALIGN=CENTER | TOP | BOTTOM


    +   Specifies the vertical alignment of the text.


    # Positioning ENTRY Text


    By default, any ENTRY statement that is defined within a 2-D overlay-type layout
    and does not specify a location is placed in the center of the graph wall (HALIGN=CENTER
    VALIGN=CENTER).


    If you know where to place the text, one way to position it is to use the HALIGN=
    and VALIGN= options, as shown in the following example:


    ```

    layout overlay;

    scatterplot x=height y=weight;

    entry halign=left "NOBS = 19" //

    valign=top border=true;

    endlayout;

    ```'
