    # Adding Subscripts, Superscripts, and Unicode Rendering


    You can build strings with subscripts or superscripts using the {SUB "string"}
    or {SUP "string"} text commands. You can also use dynamics or macro variables
    for the string portion of the text command.


    ```

    entryfootnote "R" {sup 2*}=".457";

    entryfootnote "for the H" {sub 2*} O Regression";

    ```


    Here is the output.


    ```

    R*=457

    for the H₂O Regression

    ```


    Another way to form text is to use the {UNICODE "hex-value"x} text command. Fonts
    that support Unicode code points, you can use the following syntax to render the
    glyph (character) corresponding to any Unicode value:


    ```

    entryfootnote {unicode "03B1*"}=".05";

    ```


    In the code, "03B1*" is the hexadecimal code point for the lowercase Greek letter
    alpha. Because Greek letters and some other stylistic characters are common in
    statistical graphics, keyword short cuts to produce them have been added to GTL
    syntax. Another way of indicating "03B1*" is


    ```

    entryfootnote {unicode alpha}=".05";

    ```


    Here is the output.


    ```

    α=05

    ```


