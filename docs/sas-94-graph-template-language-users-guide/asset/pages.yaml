    # More Detailed Look at a GTL Graph Definition


    The TEMPLATE procedure can produce different types of templates, like STYLE. TABLE,
    COLUMN, and STATGRAPH. The type of template to be created is specified with a
    DEFINE statement.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_22_0.png)


    The DEFINE STAT statement and its matching END statement indicate that a graphics
    template named MODELFIT is created. The template name can be a simple one-level
    name or a multi-level name as GRAPHS.MODELFIT or PROJECT.STUD3.MODELFIT indicating
    the folder in which the MODELFIT template is to be stored.


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_22_1.png)


    The BEINGRAPH statement and its matching ENDGRAPH statement define the outermost
    container for the graph. It supports options for sizing the graph. Within this
    block, you can use various statements that define the content of the graph.


    ENTRYTITLE and ENTRYFOOTNOTE statements can be used to specify graph title lines
    and graph footnote lines, if needed.'
  merge: -1
