    # Adding Insets By Using the One-to-One-Merging Data Scheme


    The one-to-one data scheme merges the inset data and the analysis data according
    to the observations position in the data sets. No BY statement is used. By default,
    LAYOUT DATAPANEL and LAYOUT DATALACIC statements assume that one-to-one was used
    to merge the inset data with the analysis data. In this case, the inset for each
    cell is populated in data order. That is, the inset data in the first observation
    is used for cell 1, the inset data for the second observation is used for cell
    2, and so on. This process requires that the inset data be placed first in the
    data set and it be ordered correctly with the cells in the classification panel.
    Because of this requirement, the one-to-one merging data scheme can be more complicated
    than the match-matching data scheme.


    Note: The match-matching data scheme is the preferred method of merging your inset
    data and analysis data. See “Adding Insets By Using the Match-Merging Data Scheme”
    on page 373.


    This example shows you how to use the one-to-one merging data scheme to merge
    your inset and analysis data, and how to add the insets to your classification
    panel. Sashelp.Cars data set is used as the data source.'
