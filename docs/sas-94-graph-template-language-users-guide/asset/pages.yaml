  md: '# Legend Wrapping


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_202_0.png)


    # Options to Control Legend Wrapping


    You can explicitly control the organization of legend entries with the following
    options on the legend statement:


    ORDER = ROWMAJOR | COLUMMAJOR


    determines whether legend entries are wrapped on a column or row basis. Default
    is ROWMAJOR.


    ACROSS = *number*


    determines the number of columns. Only used with ORDER=ROWMAJOR


    DOWN = *number*


    determines the number of rows. Use only with ORDER=COLUMMAJOR


    DISPLAYCLIPPED = TRUE | FALSE


    determines whether to show a legend when there are too many entries to fit in
    the available space


    # Organizing Legend Entries in a Fixed Number of Columns


    For left or right horizontal alignment, a vertical orientation of legend entries
    works best because it allows the most space for the plot area. In such cases,
    typically want to set a small fixed number of columns for the legend entries and
    let the entries wrap to a new row whenever necessary. This setting


    ```

    layout overlay;

    scatter x=Height y=Weight / name="sp"

    group=;

    discretelelegend "sp" / title="Age"

    halign=right valign=center

    order=rowmajor across=1 ;

    endlayout;

    ```'
