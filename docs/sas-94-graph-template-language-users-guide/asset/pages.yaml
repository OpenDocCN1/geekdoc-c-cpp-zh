- img_proc: true
  md: '# 146 Chapter 6 • Managing Graph Appearance: General Principles


    The rotation pattern is used in the current style, by the ATTPRORITY= option in
    the ODS GRAPHICS statement, or by the ATTPRORITY= option in the BEGINGRAPH statement.
    The ODS GRAPHICS statement ATTPRORITY= option value is AUTO by default, which
    enables the AttPriority attribute in the current style to determine the rotation
    pattern. In case, if the current style''s AttPriority attribute specifies color,
    the color-rotation pattern is used. If the current style does not specify AttPriority
    or specifies NONE, the default is used. The ODS GRAPHICS statement ATTPRORITY=
    option can override the current AttPriority attribute style with NONE or color.
    (See "ODS GRAPHICS Statement" in SAS Output Delivery System: User''s Guide.) The
    BEGINGRAPH statement ATTPRORITY= option overrides the attribute set in a BEGINGRAPH
    block. (See ATTPRORITY=)


    With both the default rotation pattern and the color-priority pattern, the appearance
    is dependent on the data order. Any change in the data order can affect the appearance
    of grouped plots.


    +   TIP To make the appearance of your grouped plots independent of data order,
    use a discrete attribute map or INDEX= option (where supported) to control the
    appearance of your group values. See "Making the Appearance of Grouped Data Data
    Order" on page 142.


    # The Default Attribute Rotation Pattern


    The default rotation iterates through the lists of colors, marker symbols, fill
    patterns (when supported), and line patterns as they are defined in the GraphData1-GraphData
    elements.


    > Note: Fill patterns are supported only by selected ODS styles such as JOURNAL2
    and MONOCHROMEPRINTER. For more information, see SAS Output Delivery System: User''s
    Guide.


    For the contrast colors, marker symbols, fill patterns, and line patterns, when
    all of the values in the list have been used, the values iterate through the list
    again. For the area fill colors, when all of the values have been used, two new
    sets of colors are automatically generated, which are based on the original colors.
    The first is one shade lighter than the original colors, and the second is one
    darker shade.


    The unique attribute combinations that are available on the ODS style that is
    being used. The DEFAULT style, for example, defines the attributes that are in
    the following table.


    # Table 6.2 Colors, Marker Symbols, and Line Patterns Defined in the DEFAULT Style


    | Style Element | Color | Contrast Color | Marker Symbol | Line Pattern |

    |---|---|---|---|--|

    | GraphData1 | cxC95CA | cxA25D9D | CIRCLE | 1 |

    | GraphData2 | cxDE7E6F | cxB2182B | PLUS | 4 |

    | GraphData3 | cx66A5A0 | cx01665E | X | 8 |

    | GraphData4 | cxA9865B | cx543005 | TRIANGLE | 5 |

    | GraphData5 | cxB689CD | cx9D3CDB | SQUARE | 14 |'
