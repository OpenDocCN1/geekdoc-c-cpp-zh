  md: '# How Plot Statements Affect Axis Construction 67


    # Y2 Axis as Duplicate of Y Axis


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_76_0.png)


    Note that this coding produces two overlaid scatter plots, each with five markers.
    Because the (X,Y) value pairs and the five (X,Y2) value pairs are identical, the
    Y and Y2 axes are identical and the markers are exactly superimposed. However,
    it is not necessary to create a second plot when you want the secondary axis to
    be a duplicate of the primary axis. A more direct way to accomplish this is shown
    in “Specifying Axis Options” on page 68.


    The next two examples show the independent nature of primary and secondary axes.
    In each case, a data column is mapped to the Y and Y2 axes.


    ```

    layout overlay;

    seriesplot x-date y=price;

    needleplot x=date y=volume / xaxis=y2;

    endlayout;

    ```


    As the following figure, the primary and secondary Y axes are independently scaled
    and there is no necessary connection between the units or data ranges of either


    # Y and Y2 Axes Use Different Data


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_76_1.png)


    In the next example, even though the Y and Y2 columns are different, the primary
    and secondary Y axes represent the same data range in different units. In such
    cases, the positioning of the tick values on each axis should be coordinated so
    that the grid lines represent the same temperature on each axis.\Apply Axis Thresholds”
    on page 78 provides example code that shows how to coordinate the tick value positions.


    ```

    layout overlay;

    ```'
