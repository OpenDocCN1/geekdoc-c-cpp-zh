  md: "# 340 Chapter 15 Using Conditional Logic and Expressions\n\n```\nrefereline\
    \ y=1;\nrefereline y=0;\nrefereline y=-1;\nendif;\n```\n\nThe GTL conditional\
    \ logic is used for determining which statements to render. It is not used to\
    \ control what is in the data object. In the following example, the data object\
    \ contains columns Date, Amount, and LOG10(AMOUNT), but only one scatter plot\
    \ is created.\n\n```\nif ( LOGFLAG )\n  scatterplot x=date y=amount;\nelse\n \
    \ scatterplot x=date y=eval(log10(amount));\nendif;\n```\n\nFor the conditional\
    \ logic in GTL, it is necessary to test for the existence of option values that\
    \ are set by dynamics. Consider the following example:\n\n```\nscatterplot x=date\
    \ y=amount / group=GROUPVAR;\n```\n\nThis SCATTERPLOT statement is equivalent\
    \ to the following because option values set by columns that do not exist, or\
    \ by dynamics that are uninitialized, at run time and do not produce errors or\
    \ warnings:\n\n```\nif ( exists(GROUPVAR) )\n  scatterplot x=date y=amount / group=GROUPVAR;\n\
    else\n  scatterplot x=date y=amount;\nendif;\n```\n\nThe GTL code that is specified\
    \ in the conditional block must contain complete statements and/ complete blocks\
    \ of statements. For example, the following IF block produces a compile error\
    \ because there are more LAYOUT statements than ENDLAYOUT statements:\n\n```\n\
    /* produces a compile error */\nif ( exists(SQUAREPLOT) )\n  layout overlayequated\
    \ / equatype=square;\nelse\n  layout overlay;\nendif;\n\n  scatterplot x=XVAR\
    \ y=YVAR;\nendlayout;\n```\n\nThe following logic is the correct conditional construct:\n\
    \n```\nif ( exists(SQUAREPLOT) )\n  layout overlayequated / equatype=square;\n\
    \  scatterplot x=XVAR y=YVAR;\n  endlayout;\nelse\n  layout overlay;\n  scatterplot\
    \ x=XVAR y=YVAR;\n  endlayout;\nendif;\n```\n\nGTL does not provide ELSE IF syntax,\
    \ but you can create a nested IF/ ELSE block as follows:"
