  md: '# # Setting Panel Axis Features


    The axes for classification panels are always external to the cells and displayed
    as axes for the rows or columns.


    # ## Controlling Data Ranges of Rows or Columns


    The strength of a classification panel presentation is that it makes it easy to
    visually compare similar plots across data categories. In the following example,
    the profits for Darts, Golf, and Baseball are compared:


    ```

    proc template;

    define statgraph unionall;

    beginingraph / designwidth=350px;

    designheight=400px;


    entitle

    "Yearly Profit for Sports Products";


    layout datanel

    classvars=(product_group)/

    rowdataterange=unionall;

    layout prototype;

    barchart category=year response=profit /

    stat=sum;

    endlayout;

    endlayout;

    endgraph;

    end;

    run;


    proc sgrender data=sashelp.orsales

    template=unionall;

    where product_group in

    (*Golf* "Darts" "Baseball*");

    run;

    ```'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Yearly Profit for Sports Products


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_281_0.png)


    By default, the minimum and maximum data ranges over all rows in panels are used
    to establish identical data ranges for axes that appear in the rows. The same
    is true for columns. The options that set these defaults are ROWDATRANGE-UNIONALL
    and COLUMNDATRANGE-UNIONALL. In most cases, these settings simplify quick comparisons
    because the axis for each row is scaled identically. Likewise, columns share a
    common scale: The graph just shown does a good job of showing that Golf products
    in general provide more profits than Darts or Baseball, but it does not do a very
    good job of showing the variation in Baseball profits because those profits are
    so small relative to Golf profits.


    To set independent axis scaling within each row, you can set ROWDATRANGE-UNION.
    Similarly, to set independent axis scaling within each column, you can set COLUMNDATRANGE-UNION.
    The following panel shows independent axes for each row. Now only the data minimum
    and maximum for the cells in each row are considered in deciding the axis range.


    ```

    layout datapanel classvars=(product_group) / rowdatarange=union;

    ```'
  merge: -1
  pgno: 281
- img_proc: true
  md: "# Yearly Profit for Sports Products\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_282_0.png)\n\
    \nIn this graph, the relative yearly trends for all product groups are equally\
    \ apparent, but it is harder to judge which product group is most profitable because\
    \ bar lengths are comparable only within each row.\n\n# Setting Axis Options\n\
    \nClassification planes use the ROWAXOPTS=(axis-opts) and COLUMNAXISOPTS=(axis-opts)\
    \ to set axis features. Options are available for all four axis types (LINEAR,\
    \ DISCRETE, LOG, and TIME), and the most of available axis options are a slightly\
    \ restricted set of the axis options that are available in an OVERLAY layout.\n\
    \nTo demonstrate the use of options, the following example suppresses the row\
    \ axis label because the ticks are formatted with the DOLLAR format and the axis\
    \ label is therefore not needed. The column axis label is suppressed because the\
    \ panel indicates what the bars represent. Adding title information and eliminating\
    \ axis labels is a good way to make more space available to the panel's grid.\
    \ Axis ticks on a discrete (YEAR) are often not needed, so the example suppresses\
    \ them. It also turns on grid lines to make comparisons easier.\n\nYou have probably\
    \ noticed in the examples with bar charts that the bars do not touch the axis.\
    \ This happens because a default minimum axis offset is applied to axis to avoid\
    \ possible tick collision with an adjacent cell. This example overrides the default\
    \ offset by setting OFFSETMIN=0, thus enabling the bars to touch the horizontal\
    \ axis.\n\n```\nlayout datapanel classvar=(product_group) /\nrowrowarange=union\n\
    columaxisopts=(display=(tickvalues))\n      (display=(tickvalues))\nlinearaxisopts=(tickvalueformat=dollar2)\n\
    \  griddisplay=on offsetmin=0);\n```"
  merge: -1
