  md: "# Features of Continuous Legends\n\nPlots That Can Use Continuous Legends\n\
    \nContinuous legends map the data range of a response variable to a range of colors.\
    \ Continuous legends can be used with the following plot statements when enabling\
    \ the plot option is also specified.\n\n| Plot Statement | Enabling Plot Option\
    \ | Related Plot Options |\n| --- | --- | --- |\n| CONTOURPLOTPARM | CONTOURTYPE=\
    \ | COLMODEL= REVERSECOLORMODEL= NLEVELS= NHINT= |\n| HEATMAPPARM | COLORSPONSE=\
    \ | COLMODEL= |\n| SCATTERPLOT | MARKERCOLORGRADIENT= | COLMODEL= REVERSECOLORMODEL=\
    \ |\n| SURFACEPLOTPARM | SURFACECOLORGRADIENT= | COLMODEL= REVERSECOLORMODEL=\
    \ |\n\nA contour plot provides the CONTOURTYPE= option, which you can use to manage\
    \ the contour display. The following graph illustrates the values that are available\
    \ for the CONTOURTYPE= option.\n\n![](img/a9ccb6123dee40d424cb295a3a99c16c_213_0.png)\n\
    \nAll of the variations that support contour, except for LINE and LABELEDLINE,\
    \ have a legend that shows the value of the required Z= column. For example, the\
    \ following code generates a contour plot with CONTOURTYPE=FILL:\n\n```\nproc\
    \ template;\n define statgraph contour;\nbeginiraph;\n```"
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Features of Continuous Legends 205


    ```

    entrytitle "CONTOURTYPE=FILL";nlayout overlay xaxisopts=(offsetmin=0 offsetmax=0)

    yaxisopts=(offsetmin=0 offsetmax=0);

    contourplotmap x=Height y=Weight z=Density / name="cont"

    contourtype=fill;

    continuouslegend "cont" / title="Density";

    endlayout;

    endgraph;

    run;

    ```


    ```

    proc sgrender data=sashelp.gridded template=contour;

    where height=53 and weight=225;

    run;

    ```


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_214_0.png)


    If you change to CONTOURTYPE=GRADIENT you get the following output:


    ![](img/a9ccb6123dee40d424cb295a3a99c16c_214_1.png)


    For a FILL contour, the Z variable is split into equal-sized value ranges, and
    each range is assigned a different color. The continuous legend shows the value
    range boundaries and the associated colors as a long strip of color swatches with
    an axis on it. The contour options NHINT= and NVELS= are used to change the number
    of levels (ranges) of the contour. NHINT=10 requests a number near ten used that
    results in "good" intervals for displaying in the legend. NVELS=10 forces ten
    levels to be used.


    ```

    contourplot x=Height y=Weight

    z=Density / name="cont"

    ```'
