    | Plot 1 | Plot 2 | Plot 3 |

    | Plot 4 | Plot 5 | Empty |


    Alternately, you can specify ORDER=COLUMNMAJOR, which means "fill in all cells
    in the left column and continue to the next column to the right." ROWS=1 by default
    when ORDER=COLUMNMAJOR, so you must specify an alternative setting to increase
    the number of rows in the grid:


    ```

    layout gridded / rows=2 order=columnmajor

    /* plot1 definition /

    /* plot2 definition /

    /* plot3 definition /

    /* plot4 definition /

    /* plot5 definition /

    endlayout;

