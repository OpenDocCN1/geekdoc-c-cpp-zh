  md: '# Text Options


    When specifying the settings, the available text-options can be any one or more
    of the following settings. The options must be enclosed in parentheses, and each
    option is specified as a name = value pair. In all cases, the value can be a style-reference|style-attribute.


    COLOR=style-reference | color

    sifies the color of the text. If you use a Graphics Template Language, the style-attribute
    should be a valid attribute such as COLOR, CONTRASTCOLOR, STARTCOLOR, NEUTRAL,
    ENDCOLOR. The convention is to use COLOR for text.


    If you use a color, SAS accepts color names, such as RED, or color codes, such
    as CFFF000 or #FF0000. Color must not exceed 64 characters. Color codes must not
    exceed 8 characters and must be in a valid SAS color-naming scheme, such as RGB,
    CMYK, HLS, or HSV (HSV).


    FAMILY=style-reference | "string"

    sifies the font family of the text. If you use a style-reference, the style-attribute
    should be FONTFAMILY.


    SIZE=style-reference | dimension

    sifies the font size of the text. If you use a style-reference, the style-attribute
    should be FONTSIZE.


    STYLE=style-reference | NORMAL | ITALIC

    sifies the font style of the text. If you use a style-reference, the style-attribute
    should be FONTSTYLE.


    WEIGHT=style-reference | NORMAL | BOLD

    sifies the font weight of the text. If you use a style-reference, the style-attribute
    should be FONTWEIGHT.


    # Available Line Patterns


    The following line patterns can be used with the Graphics Template Language. A
    line pattern can be specified by its number or name. Not all patterns have names.
    We recommend that you use the named patterns because they have been optimized
    to provide good discriminability when used in the same plot.'
