  md: '# 334 Chapter 14 • Using Dynamics and Macro Variables to Make Flexible Templates


    _BYLINE_ This variable represents the complete BY line when you specify a BY statement.


    _BYTITLE_* This variable is set to 1 when you specify a BY statement and the ODS
    GRAPHICS BYLINE= option is set to TITLE. Otherwise, it is set to 0 or NULL.


    _BYVAR_ This variable represents the name of the first BY variable when you specify
    a BY statement.


    _BYVARn This variable represents the name of the nth BY variable when you specify
    a BY statement with multiple variables.


    _BYVAL_ This variable represents the first BY value when you specify a BY statement.


    _BYVALn This variable represents the value of the nth BY variable when you specify
    a BY statement with multiple variables.


    +   * This variable is set automatically for analytical procedures that support
    ODS GRAPHICS. For a list of these procedures, see "Automatic Graphics from SAS
    Analytical Procedures" on page 2. For all other procedures, this is not set automatically
    (NULL).


    To use a variable in your template, you must define it in the DYNAMIC statement
    in your template. However, you do not have to define and initialize the variable
    in your SGRERENDER statement. The special variables are defined and initialized
    at run time for the SGRENDER statement.


    Here is an example of how you show special variables can be used in a template.
    This example generates a graph of the monthly stock closing price for each year
    for the years 2000 through 2005. It uses a BY statement in the SGRENDER statement
    to generate the graphs and provides the following options for displaying the BY
    value in each graph:


    +   * display the BY line in the graph title

    * display the BY line in a footnote

    * display the BY value in the graph title or in a footnote.


    The _BYLINE_ is used to include the BY line in the graph title or footnote. The
    _BYTITLE_ and _FOOTNOTE_ variables are used with the BYLINE= ODS GRAPHICS option
    to select between displaying the BY line in the title or footnote. When neither
    _BYTITLE_nor _FOOTNOTE_ is set, the _BYVAL_ variable is used to include the BY
    value in the graph as the default behavior. Finally, before the graph is rendered,
    the default BY line that is normally displayed when the BY statement is used.


    Here is the code for this example.


    ```

    /* Add a YEAR column to the data set. */

    data sashelp.stocks;

    year=year(date);

    label year="YEAR";

    run;


    /* Sort the data by YEAR. */

    proc sort data=stocks;

    ```'
