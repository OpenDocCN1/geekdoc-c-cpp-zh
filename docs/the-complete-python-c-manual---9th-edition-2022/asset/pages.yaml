  md: "# While Loop\n\nA while loop's function is to repeat a statement, or a group\
    \ of statements, while a certain condition remains true. When the while loop starts,\
    \ it initialises itself by testing the condition of the loop and the statements\
    \ within, before executing the rest of the loop.\n\n# TRUE OR FALSE?\n\nWhile\
    \ are one of the most popular form of C++ code looping. They repeatedly run the\
    \ code contained within the loop while the condition is true. Once it proves false,\
    \ the code continues as normal.\n\n+   **STEP 1** Clear what you've done so far\
    \ and create a new C++ file. There's no need for any extra headers at usual:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n\n}\n```\n\n\
    +   **STEP 3** First you need to create a condition, use a variable named num\
    \ and Now create the while loop, stating that as long as num is less than 30,\
    \ the loop is true. The loop value of num is displayed and adds 1 until it's more\
    \ than 30.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_125_0.png)\n\n+   **STEP\
    \ 2** Create a simple while loop. Enter the code below, and build and run (we\
    \ added comments to the screen):\n\n```\nint num = 1;\n\nwhile (num < 30) {\n\\\
    \    cout << \"Number: \" << num << endl;\n\\    num = num + 1;\n}\n\nreturn 0;\n\
    ```\n\nWe're introducing a few new elements. The first are the opening and closing\
    \ braces for the while loop. Because this loop is a compound statement, meaning\
    \ a group of statements; also note, there's no semicolon after the while loop.\
    \ You also have return 0, which is a clean and perfect way of ending the code.\n\
    \n```\nint num = 1; // Create the condition\nwhile (num < 30) // The condition\
    \ is true while num is less than 30\n{\n    cout << \"Number: \" << num << endl;\
    \ // Display the value of num\n    num = num + 1;\n}\n\nreturn 0; // Close the\
    \ loop and finishes the program\n```\n\n+   **STEP 5** If you didn't need to see\
    \ the continually increasing value of num, you could have gone away with the compound\
    \ and instead just added num by itself, then displayed the value:\n\n```\nint\
    \ num = 1;\nwhile (num < 30) {\n    num++;\n    cout << \"Number: \" << num <<\
    \ endl;\n}\nreturn 0;\n```\n\n126 www.bdmpublications.com"
