  md: '# Splitting and Joining Strings


    # STEP 5


    The opposite of .split function, where you will have separate items in a string
    and can join them all to a word or just a combination of items, depending on your
    running. For instance:


    ```

    alphabet="".join(["a", "b", "c", "d", "e"])

    alphabet

    ```


    This will display ''abcde'' in the shell.


    # STEP 8


    As with the .split function, the separator doesn''t have to be a space, it can
    also be a comma, a hyphen or whatever you like:


    ```

    colors=[''Red''

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_0.png)


    # STEP 6


    You can therefore apply .join to the separated name you made in Step 4, combining
    the letters to again


    ```

    name="".join(name)

    ```


    We''ve joined the string back, and retained the last list name, passing it through
    the join.


    ```

    Python 3.2 (default), Oct 19 2014, 13:31:11

    SEC [4.5.9] line

    >>> type="copyright", "credits" or "license" for more information.

    >>> name="".join(name)

    >>> name

    ''abcde''

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_1.png)


    # STEP 9


    There''s some interesting functions you apply to a string, such as .capitalize
    and .title().


    ```

    title="con the commerian"

    title.capitalize()

    title.title()

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_2.png)


    ```

    Python 3.2 (default), Oct 19 2014, 13:31:11

    >>> type="copyright", "credits" or "license" for more information.

    >>> title="con the commerian"

    >>> title.capitalize()

    ''Con the commerian''

    >>> title.title()

    ''Con The Commerian''

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_3.png)


    # STEP 7


    You can use the join function when you have a list of words to combine into a
    sentence:


    ```

    list["Conan", "raised", "his", "mighty", "sword",

    "and", "struck", "the", "demon"]\ntext="".join(list)

    text

    ```


    Note the space between the quotes before the join function (where there were no
    spaces in the Step 6 join)


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_4.png)


    # STEP 10


    You can also use logic operators on strings, if you check if a string contains
    (''in'' or ''not in'') functions. These enable the a sequence of characters:


    ```

    message="Have a nice day"

    "nice" in message

    "bad" not in message

    "day" not in message

    "night" in message

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_5.png)


    ```

    Python 3.2 (default), Oct 19 2014, 13:31:11

    >>> type="copyright", "credits" or "license" for more information.

    >>> message="Have a nice day"

    >>> "nice" in message

    True

    >>> "bad" not in message

    True

    >>> "day" not in message

    True

    >>> "night" in message

    False

    ```


