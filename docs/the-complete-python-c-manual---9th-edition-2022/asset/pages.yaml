  md: "# Data Types\n\n```\ncout.precision(22);\ncout << PI;\n```\n\nThis is mainly\
    \ due to the conversion from binary in the compiler and that the IEEE 754 double\
    \ precision standard occupies 64-bits of data, which 52-bits are divided to the\
    \ significant (significant digits in a floating-point number) and roughly 3.5-bits\
    \ are taken holding values 0 to 9. If you divide 53 by 3.5, you arrive at 15.142857,\
    \ which is 15 digits of precision.\n\nTo be honest, if you are creating code that\
    \ needs to be accurate to fifteen decimal places, then you wouldn't be using C++,\
    \ you would use some scientific language with C++ as the connective tissue between\
    \ the two.\n\nYou can create your own data types, using an alias-like system called\
    \ typedef.\n\n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\
