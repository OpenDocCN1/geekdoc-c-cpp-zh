  md: "# Calendar Module\n\nSTEP 5 You can also create a program that will display\
    \ all the days, weeks and months within a given year:\n\n```\nimport calendar\n\
    year=int(input(\"Enter the year to display: \"))\nprint(calendar.calendar(year))\n\
    ```\n\nWe're sure you'll agree that it's quite a handy bit of code to handle:\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_68_0.png)\n\nSTEP 8 You're also able\
    \ to print the individual months or days of the week:\n\n```\nimport calendar\n\
    for name in calendar.month_name:\n    print(name)\n```\n\n```\nimport calendar\n\
    for name in calendar.day_name:\n    print(name)\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_68_1.png)\n\
    \nSTEP 6 Interestingly we can also list the number of days in a month by using\
    \ a for loop:\n\n```\nimport calendar\ncal=calendar.TextCalendar(calendar.SUNDAY)\n\
    for i in cal.monthdays(2018, 6):\n    print(i)\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_68_2.png)\n\
    \nSTEP 9 The calendar module allows us to write the calendar in HTML, so that\
    \ you can display it on a website: Let's start by creating a new file:\n\n```\n\
    import calendar\ncal=open(\"/home/pi/Documents/cal.html\", \"w\")\nc=calendar.HTMLCalendar(calendar.SUNDAY)\n\
    cal.write(c.formatmonth(2018, 1))\ncal.close()\n```\n\nThis code will create an\
    \ HTML file called, open it with a browser and it displays for January 2018.\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_68_3.png)\n\nSTEP 7 You can see that\
    \ code produced zeros at the beginning of the week, Sunday in this case, and overlapping\
    \ days from the starting day of the week from the previous month. So the count\
    \ of days will start on 1st. June 2018 and will be 30 to output the correct results.\n\
    \nSTEP 10 Of course, you can modify that to display a given year as a web page:\n\
    \n```\nimport calendar\nyear=int(input(\"Enter the year to display as a webpage:\
    \ \"))\ncal=open(\"/home/pi/Documents/cal.html\", \"w\")\ncal.write(calendar.HTMLCalendar(calendar.MONDAY).formatyear(year))\n\
    .close()\n```\n\nThis code asks for a year, then it creates the necessary website.\
    \ Remember to change your file destination.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_68_4.png)\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_68_5.png)\n\n* www.bdmpublications.com\
