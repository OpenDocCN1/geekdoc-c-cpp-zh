    word=input(\"Please enter a four-letter word: \")\nif len(word) == 4:\n    print(\"\
    word, is a four-letter word. Well done.\")\nelif len(word) == 3:\n    print(\"\
    word, is a three-letter word. Try again.\")\nelse:\n    print(\"word, is not a\
    \ four-letter word.\")\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_40_0.png)\n\
    \n# LOOPS\n\nA loop looks similar to a condition but they are somewhat different\
    \ in their operation. A loop will run through the same block of code a number\
    \ of times, usually with the support of a condition.\n\nSTEP 1 Let's start with\
    \ a simple while. Like IF, this will check to see if something is TRUE, then run\
    \ the indented code:\n\nSTEP 3 The loop is another example. For is used to loop\
    \ over a range of data, usually a list stored in brackets: For:\n\n```\nx = 10\n\
    while x > 0:\n    print (x)\n    x = x + 1\n```\n\n```\nwords=['Cat\", \"Dog\"\
    , \"Unicorn\"]\nfor word in words:\n    print (word)\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_40_1.png)\n\
    \nSTEP 2 The difference between if and for is that while if gets to the end of\
    \ the indented code, for goes back and checks the statement is still true. In\
    \ an example x is less than 10. With each loop it prints the current value of\
    \ x, then adds one to value. When x eventually equals 0 it stops.\n\nSTEP 4 The\
    \ loop can also be used in the countdown example using the range function:\n\n\
    ```\nfor x in range (1, 10):\n    print (x)\n```\n\nThe x=1 isn't needed here\
    \ because the range function creates a list from the first and last numbers.\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_40_2.png)"
