    = ["Unicorn", "Balrog", "Vampire", "Dragon", "Winteraur"] | | numbers[-1] | |
    mystical_creatures[-4] | |


    +   STEP 2 Once you''ve defined your list you can call each element by referencing
    its index, or by name. A list is numbered. For example:


    numbers


    To call the entire contents of the list.


    To call the third zero item in the list (21 in this case).


    +   STEP 4 Slicing is similar to indexing but you can retrieve multiple items
    in a list by separating item numbers with a colon:


    numbers[1:3]


    Will output the 4 and 7, because the returned values excludes the second index
    (position) when numbers[1:3] returns to 4 and 7.


