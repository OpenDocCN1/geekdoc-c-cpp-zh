  md: '# THE RASPBERRY PI


    Why use a Raspberry Pi? The Raspberry Pi is a tiny computer that''s very cheap
    to purchase but offers the user a fantastic learning platform. Its main operating
    system, Raspian, comes preinstalled with the latest Python with many Modules and
    extras.


    # RASPBERRY PI


    The Raspberry Pi 3 is the latest version, incorporating a more powerful CPU, more
    memory, Wi-Fi and Bluetooth support. You can pick up a Pi for £32 or as a part
    of kit for £50+, depending on the kit you''re interested in.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_10_0.png)


    # FUZE PROJECT


    The FUZE is a learning environment built on the latest model of the Raspberry
    Pi. You can purchase the workstations that come with an electronics kit and even
    a robot arm for you to build and program. You can find more information on the
    FUZE at www.fuze.co.uk.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_10_1.png)


    # RASPBIAN


    The Raspberry Pi''s main operating system is a Debian-Linux distribution that
    contains everything you need in a simple to use format. It''s streamlined for
    the Pi and is an ideal for hardware and software projects, Python programming
    and even as a desktop computer.


    # BOOKS


    We have several great titles available via www. bdmublications.com. Our Pi books
    cover how to buy your first Raspberry Pi, how to set up and use it; there are
    some great, step-by-step project examples and guides to get you from the Raspberry
    Pi too.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_10_2.png)


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_10_3.png)'
