  md: '# Creating Functions


    STEP 5 Additional functions can be added to Python through modules. Python has
    a range of modules available that can cover numerous programming duties. They
    can be imported as and when required. For example, use advanced mathematics functions:


    ```

    import math

    ```


    Once you have used all the math functions.


    STEP 6 To use a function from a module the name of the module followed by a full
    stop, for instance, using the math module, you''ve imported it into Python, you
    can utilise the square root function. To do so:


    ```

    math.sqrt(16)

    ```


    You can see that code is presented in function.data.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_38_0.png)


    # FORGING FUNCTIONS


    There are many different functions you can import by other Python programmers
    and you will undoubtedly come across excellent examples in the future; you can
    create your own with def command.


    STEP 1 Choose File > New File to enter the editor, let''s create a function called
    Hello, that greets a user.


    ```

    def Hello():

    print("Hello")

    ```


    Hello()

    Press5 to save and run the script. You can see Hello in the Shell, and it returns
    the None value.


    STEP 3 To modify it, delete the Hello("David") line, the last line in the script
    and press Ctrl+S to save the new script. Close the editor and create a new file
    (File > New File): Entering


    ```

    from Hello import Hello

    Hello("David")

    ```


    Press5 to save and execute the code.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_38_1.png)


    STEP 2 Let''s expand the function to accept a variable, the user''s name for firstly.
    Edit your script to:


    ```

    def Hello(name):

    print("Hello", name)

    Hello("David")

    ```


    This will now accept the variable name, otherwise it prints Hello David. In the
    Shell, enter name:"Bob", you can now pass arguments.


    STEP 4 What you''ve done is import the function from the saved Hello-program and
    used it to say Hello David. This is how modules and functions work; import the
    module to use the function. Try this one, and modify it for extra credit:


    ```

    def add(a, b):

    result = a + b

    return result

    ```


