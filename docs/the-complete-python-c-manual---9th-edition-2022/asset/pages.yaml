  md: "# Working with Data\n\n# # Date and Time\n\nWhen working with date it's often\
    \ handy to have access to the time. For example, you may want to time-stamp an\
    \ entry or set when a user logged into the system and for how long. Luckily acquiring\
    \ the date and time is easy, thanks to the Time module.\n\n# TIME LORDS\n\nThe\
    \ time module contains functions that help you retrieve the current system time,\
    \ reads the date from strings, formats the date and time and more.\n\n+   - STEP\
    \ 1 If you need to import the time module. it's built-in to Python 3 so you shouldn't\
    \ need to drop into a copy and prompt install it. Once it's imported, you can\
    \ call the current date and time with a simple command:\n\n```\nimport time\n\
    time.asctime()\n```\n\n+   - STEP 3 You can see the structure of how time is presented\
    \ by\ntime.local_time()\nThe output is displayed as: 'time_struct_time_tm_year=2017,\
    \ tm_mon=9, tm_day=7, tm_hour=9, tm_min=6, tm_sec=13, tm_wday=3, tm_yday=250,\
    \ is_dst=0'; obviously dependent on your current time as opposed to the shown\
    \ above.\n\n```\nPython 3.4.2 Shell\nFile Edit Debug Options Windows help\n>>>\
    \ Python 3.4.2 default (Oct 19 2014, 13:31:51)\n[GCC 4.9.0] on Linux\ntype(\"\
    help\") or \"license\") for more information.\nn>>> time.asctime()\n'Wed Oct 07\
    \ 08:44:26 2014'\n>>> \n```\n\n+   - STEP 2 The time is split into nine tuples,\
    \ which are divided into indexed tuples, as with any other tuple, and in the screen\
