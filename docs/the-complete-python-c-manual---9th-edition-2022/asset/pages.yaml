  md: "# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're able to do much more than simply\
    \ greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to prompt a user response.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_115_0.png)\n\
    \nSTEP 3 The cin command works in the opposite way from the cout command. With\
    \ the first cout line you \"What is your age\" to the screen, as indicated with\
    \ the chevrons. Cin uses facing chevrons, indicating an input. The input is put\
    \ into the integer age and called up in the second cout count. Build and run the\
    \ code.\n\nSTEP 2 The data type of the variable must also match the type of input\
    \ you want from the user. For example, to ask a user age, you would use an integer\
    \ like this:\n\n```\n# <iostream>\nusing namespace std;\n```\n\n```\nint main\
    \ () {\n  int age;\n  cout << \"What is your age: \";\n  cin >> age;\n  cout <<\
    \ \"You are \" << age << \" years old.\\n\";\n}\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_115_1.png)\n\
    \nSTEP 4 If you're asking a question, you need to store the input as a string;\
    \ to ask the user name, you would\n\n```\n# <iostream>\nusing namespace std;\n\
    ```\n\n```\nint main () {\n  string name;\n  cout << \"What is your name: \";\n\
    \  cin >> name;\n  cout << \"Hello, \" << name << \". I hope you're well today!\\\
    n\";\n}\n```"
