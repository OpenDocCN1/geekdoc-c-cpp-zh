  md: "# C++ Maths\n\nProgramming is mathematical in nature and as you might expect,\
    \ there's plenty of built-in scope for some quite maths. C++ has a lot to offer\
    \ anyone who's implementing mathematical models into their code. It can be extremely\
    \ complex or relatively simple.\n\n# C++ = MC²\n\nThe basic mathematical symbols\
    \ apply in C++ as they do in most other programming languages. By, using the C++\
    \ Math Library, you can also calculate square roots, powers, trig and more.\n\n\
    +   * STEP 1 C++s mathematical operations follow the same patterns as taught in\
    \ school, that multiplication and division take precedence over addition and subtraction.\
    \ You can also alter that. For now, create a new file and enter:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    float numbers = 100;\n \
    \   numbers = numbers + 10; // This adds 10 to the initial\n    cout << \"\\n\"\
    ;\n    numbers = numbers - 10; // This subtracts 10 from the new\n    cout <<\
    \ \"\\n\";\n}\n```\n\n+   * STEP 3 Multiplication and division can be applied\
    \ as such:\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n \
    \   float numbers = 100;\n    numbers = numbers * 10; // This multiplies 100 by\
    \ 10\n    cout << \"\\n\";\n    numbers = numbers / 10; // This divides 1000 by\
    \ 10\n    cout << \"\\n\";\n}\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_111_0.png)\n\
    \n+   * STEP 2 While, the old math does float variables warmed up. We noted that\
    \ we used a float for that can help you integrate, if you suddenly need to use\
