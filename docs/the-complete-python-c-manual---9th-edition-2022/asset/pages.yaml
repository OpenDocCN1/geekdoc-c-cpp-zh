  md: '# # Using Comments


    When you write code, the flow of it, what each variable will program operate and
    so on is all inside your head. Another programmer could follow the code line by
    line but over time, it can become difficult to read.


    Programmers use a method of keeping their code readable by commenting on certain
    sections. If a variable is used, the programmer comments on what it''s supposed
    to do, for example, it''s just good practice.


    # ## COMMENTS!


    +   * STEP 1 Start by creating a new instance of the IDLE Editor (File -> New)
    and create a simple variable and print command:


    ```

    a=10

    print("The value of A is," a)

    ```


    Save the file and execute.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_31_0.png)


    +   * STEP 3 Resave the code and execute. You can see that the output in the IDLE
    Shell is the same as before, despite the extra lines being added. Simply put,
    the hash symbol (#) denotes a line of text the programmer can insert to inform
    them, and others, of what''s going on without the user being.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_31_1.png)


    +   * STEP 2 Running the code will return the line: The value of A is 10 to the
    IDLE Shell window, which is what we expect. Now, add some of the comments you''d
    normally see within code:


    > # Set the start value of A to 10

    # Print the current value of A

    print("The value of A is," a)


    +   * STEP 4 Let''s assume that the variable that we''ve created is the number
    of lives in a game. Every time the player dies, the value is decreased by 1. The
    programmer could insert a routine into the lines of:


    ```

    a=10

    print("You just lost a life!")

    print("You now have," "aives left!")

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_31_2.png)


    ```

    # Set the start value of A to 10

