  md: '# GOING MOBILE


    The mobile market is a great place to test your coding skills and present any
    games or apps you created. If your app is good, then who knows it could be the
    next great thing to appear on the app stores. It''s a pleasant learning experience
    nevertheless, and worth considering.


    # PORTFOLIOS


    If you''ve learned how to code with an eye for a developer job in the future,
    then it''s worth to build up an online portfolio of code. Look at job postings
    and what skills you require, then learn and code with those and add it to your
    portfolio. When it comes to applying, include a link to the portfolio.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_0.png)


    # My Work


    Want to see some examples? Email me!


    # Chroniclesd.org


    Chroniclesd.org is a blog where I share my thoughts on software development, technology,
    and life. I also write about the process I use to design a new project or solve
    problems.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_1.png)


    # ONLINE LEARNING


    Online courses are good examples of how to take your coding skills next, even
    if you are from beginner level. Often, an online course follows a strict coding
    convention, so if you''re selftaught then it might be worth seeing how other developers
    lay out their code, and what is considered acceptable.


    > Learn to code interactively, for free.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_2.png)


    # TEACH CODE


    Can you teach If your coding skills are spot on, consider approaching a college
    or university to see if they need for a programming language teacher, perhaps
    part-time or ever course. If not, then consider creating your own YouTube how
    to code.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_3.png)


    # SHARE CODE


    Get sharing, even if you think your code is not very good. The criticism, advice
    and comments you receive back help iron out any issues with your code, and you
    add them all to your checklist. Alternatively your code might be utterly amazing
    but you won''t know unless it is.


    # HARDWARE PROJECTS


    Contributing to hardware projects is a great resource for improving your code
    with others and learning from other contributors. Many of the developer boasts
    has postings for coders to apply for hardware projects, using unique code to get
    the most from the hardware''s being designed.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_4.png)'
