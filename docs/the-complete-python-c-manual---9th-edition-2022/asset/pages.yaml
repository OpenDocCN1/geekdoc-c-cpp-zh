  md: "# If... Else Statement\n\nThere is a much better way to use an statement in\
    \ your code, if... else. else works in the same way as standard if. If the Boolean\
    \ expression is true, the code with the braces is executed. Else, the code within\
    \ the next set of braces is used instead.\n\n# IF YES, ELSE NO\n\nThere are two\
    \ sections of code that can be executed depending on the outcome in an if... else\
    \ statement. It's quite easy to envisage once you get to use its structure.\n\n\
    +   - STEP 1 Begin with a new C++ file and the standard headers:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    int num = 1;\n    if (num\
    \ < 30) {\n        cout << \"The number is less than 30!\" << endl;\n    } else\
    \ {\n        cout << \"The number is greater than 30!\" << endl;\n    }\n    return\
    \ 0;\n}\n```\n\n+   - STEP 3 The first line in the code creates the integer called\
    \ num and gives it a value of 1. If the statement checks to see if value of num\
    \ is less than thirty and if it is outputs \"The number is less than 30\" to the\
    \ console:\n\n```\nif (num < 30)\n    cout << \"The number is less than 30!\"\
    \ << endl;\n```\n\n+   - STEP 2 Let's expand the code from the If Statement on\
    \ the previous page:\n\n```\nint num = 1;\nif (num < 30) {\n    cout << \"The\
    \ number is less than 30!\" << endl;\n} else {\n    cout << \"The number is greater\
    \ than 30!\" << endl;\n}\n```\n\n+   - STEP 4 The else companion to checks if\
    \ the number is greater than thirty and if so, then displays \"The number is greater\
    \ than 30\" to the console; and finally, the code is terminated satisfactorily.\n\
    \n```\ncout << \"The number is less than 30!\" << endl;\n```\n\n```\ncout << \"\
    The number is greater than 30!\" << endl;\n```\n\n+   - STEP 5 You can change\
    \ the value of the num in the code you enter a value: you can improve the code\
