  md: "# Formatting Strings\n\nWhen you work with data, creating lists, dictionaries\
    \ and objects you may want to print out the results. Merging strings with data\
    \ is easy especially with Python 3, as in earlier versions of Python tended to\
    \ complicate matters.\n\n# STRING FORMATTING\n\nSince Python 3, string formatting\
    \ has become a much neater process, using the .format function combined with curly\
    \ brackets. It's a more logical and better approach than previous.\n\n+   STEP\
    \ 1\nThe basic formatting in Python is to call each variable into the string brackets:\n\
    name=\"Conan\"\nprint(\"The barbarian hero of the Hyborian Age is: {}\".format(name))\n\
    \n+   STEP 3\nYou can of also include integers into the mix:\nnumber=100000\n\
    print(\"{} was a skilled mercenary, and thief too. He once stole {} gold from\
    \ a merchant.\".format(name, number))\n\n```\npython3.4.2 Shell\nEdit Save Debug\
    \ Help Windows help\nPython 3.4.2 (default), Oct 10 2014, 13:31:13\n>>> name=\"\
    Conan\"\n>>> print(\"credits\" or \"license\" for more information.\n>>> name=\"\
    Conan\"\n>>> print(\"The barbarian hero of the Hyborian Age is: {}\".format(name))\n\
    'The barbarian hero of the Hyborian Age is: Conan'\n>>> \n```\n\n```\npython3.4.2\
    \ Shell\nEdit Save Debug Help Windows help\nPython 3.4.2 (default), Oct 10 2014,\
    \ 13:31:13\n>>> name=\"Conan\"\n>>> print(\"credits\" or \"license\" for more\
    \ information.\n>>> name=\"Conan\"\n>>> print(\"The barbarian hero of the Hyborian\
    \ Age is: {}\".format(name))\n'The barbarian hero of the Hyborian Age is: Conan'\n\
    >>> \n```\n\n+   STEP 2\nRemember to close the print function with sets of brackets,\
    \ as you've encased the variable in one, and the print in another. You can include\
    \ multiple types of string in a single function:\nname=\"Conan\"\nplace=\"Cimmeria\"\
    \nprint(\"{} hailed from the North, in a cold land known as {}\".format(name,\
    \ place))\n\nThere are many different ways to apply string formatting, some are\
    \ quite simple, as we've shown you; here it depends on what you want from your\
    \ program. A guide to reference frequently string formatting is the Python Docs\
    \ webpage, found at docs.python.org/3/library/string.html. Here, you will find:\n\
    \n```\npython3.4.2 Shell\nEdit Save Debug Help Windows help\nPython 3.4.2 (default),\
    \ Oct 10 2014, 13:31:13\n>>> name=\"Conan\"\n>>> print(\"credits\" or \"license\"\
    \ for more information.\n>>> name=\"Conan\"\n>>> print(\"{} hailed from the North,\
    \ in a cold land known as {}\".format(name, place))\n'Conan hailed from the North,\
    \ in a cold land known as Cimmeria'\n>>> \n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_53_0.png)"
