    \ try to divide by zero. This will create an error and break your code.\n\n# ##\
    \ EXCEPTIONAL OBJECTS\n\nRather than stop the flow of your code, Python includes\
    \ exception objects which handle unexpected errors in the code. You can combat\
    \ errors by creating conditions where exceptions may occur.\n\n+   - STEP 1 You\
    \ can create an exception by simply trying to divide a number by zero. This will\
    \ report back with the ZeroDivisionError: Division by zero, as seen in the screenshot.\
    \ The ZeroDivisionError part is the exception class, of which many\n\n+   - STEP\
    \ 3 You can use the functions raise to create your error handling code. Let's\
    \ assume your code has warping around the cosmos, too much results in a warp breach.\
    \ To stop the game from exiting due to the warp core, you can create a custom\
    \ exception.\n\n```\nPython 3.4.2\nPython 3.4.2 (default, Oct 12 2014, 13:31)\n\
    [GCC 4.8.0] on Linux\nTypeError: 'int' object is not subscriptable or 'license'\n\
    Traceback (most recent call last):\n  File \"example\", line 4, in <module>\n\
    \    print(1/0)\nZeroDivisionError: division by zero\n\nraise Exception('warp\
    \ core breach')\n```\n\n| Name |\n|---||\n| BaseException |\n| LookupError |\n\
    | Exception |\n| ZeroDivisionError |\n| ArithmeticError |\n| NotIterationError\
    \ |\n| OverflowError |\n| FloatingPointError |\n| AttributeError |\n| KeyError\
