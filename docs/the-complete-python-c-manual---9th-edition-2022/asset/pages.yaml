  md: "# # Tkinter Module\n\nWhile running your code from the command line, Python\
    \ is capable of so much more. The Tkinter module enables the programmer to set\
    \ a Graphical User Interface to interact with the user, and it's surprisingly\
    \ powerful too.\n\n# ## GETTING GUI\n\nTkinter is easy to use but there's a lot\
    \ more you can do with it. Let's start by seeing how it works and getting some\
    \ code into it. Before long you will discover how powerful this module is.\n\n\
    +   - Tkinter is usually built into Python 3. However, if it's available when\
    \ you need to pip install tkinter from the command prompt. We can start to import\
    \ modules differently than before, to save on typing and importing all of their\
    \ contents:\n\n```\nimport tkinter as tk\nfrom tkinter import *\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_73_0.png)\n\
    \n+   - STEP 3 The ideal approach is to add mainloop() into the code to get that\
    \ to soon. Once you've created a Tkinter widget and there we play around with:\n\
    \n```\nbtn=Button()\nbtn.pack()\nbtn.config(text=\"Hello everyone!\")\n```\n\n\
    The first line focuses on the newly created window. Click back into the Shell\
    \ and continue the others.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_73_1.png)\n\
    \n+   - STEP 2 It's not recommended to import everything from the module using\
    \ the asterisk because it won't do anything normally. Let's begin by creating\
    \ a GUI window, enter:\n\n```\nroot=Tk()\n```\n\nThis creates a small window.\
    \ But there's not much else do at this point click the K in the corner to close\
    \ the window.\n\n+   - STEP 4 You can combine the above into a New File:\nimport\
    \ tkinter as tk\nbtn=Button()\nbtn[\"text\"]=\"Hello everyone!\")\n\nThen add\
    \ button interactions:\n\n```\ndef click():\n    print(\"you just clicked me!\"\
    )\nbtn[\"command\"]=click\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_73_2.png)"
