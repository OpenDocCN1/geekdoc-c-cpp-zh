  md: '# # Working with Files


    The ability to read files within Python is certainly half but writing to a file
    is better still. By using the write() function, you''re able to output the results
    of a program to a file, that you can then read() back into Python.


    # WRITE AND CLOSE


    The write() function is slightly more complex than read(). Along with the filename
    you must also include an access mode which determines whether the file is in read
    or in write mode.


    +   * STEP 1 Start opening IDE and enter the following:

    `t=open("/home/pi/Documents/text.txt", "w")`


    Change the destination from /home/pi/Documents to your own system. This code will
    create a file text.txt in write mode using the variable ''t''. If there''s no
    file of that name in the location, it will create one. If one already exists,
    it will overwrite it.


    +   * STEP 3 However, the actual text is still blank (can you write the line of
    the file object? This is because you check by opening it up). Part of the write()
    function is not committed to the file; you need to commit the changes; you can
    do this by entering:

    `t.close()`


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options Windows help

    >>> t.write("Hello world, Oct 19 2014, 13:31:11")

    [1 4.9.1]

    10

    >>> type(t)

    <class ''TextIOWrapper''>n>>> t.write("You awake in a small, square room. A single
    table stands to one side, there is a locked door in front of you.")

    [2 100]

    >>> t.close()

    ```


    +   * STEP 4 If you now open the file with a text editor, you can see that the
    line you created has been written to the file. This gives us the function for
    some interesting possibilities: perhaps the creation of your own log file or even
    the beginning of an adventure game.


    t.write("You awake in a small, square room. A single table stands to one side,
    there is a locked door in front of you.")


    Note the 10.9. It''s the number of characters you''ve entered.


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options Windows help

    >>> t.write("Hello world, Oct 19 2014, 13:31:11")

    [1 4.9.1]

