  md: "# # Using Your Own Modules\n\nLarge programs can be much easier to manage if\
    \ you break them up into smaller parts and import the parts you need as modules.\
    \ Learning to build your own modules also makes it easier to understand how they\
    \ work.\n\n# ## BUILDING MODULE\n\nModules are Python files, containing code,\
    \ that you save as a .py extension. These are imported into Python using the import\
    \ command.\n\n+   * STEP 1: Start by creating a set of basic mathematics functions.\
    \ Multiply a number by two, three and raise a number to an exponent (power). Create\
    \ a New File in the IDE and define them:\n\n```\ndef timwo(x):\n    return x *\
    \ 2\n```\n\n```\ndef timthree(x):\n    return x * 3\n```\n\n```\ndef square(x):\n\
    \    return x * x\n```\n\n```\ndef power(x,y):\n    return x ** y\n```\n\n+  \
    \ * STEP 3: Now you're going to define the functions out of the program and into\
    \ a separate file. Highlight the function definitions and choose Edit > Cut. Choose\
    \ File > New and use Edit > Paste in the new window. You now have two files, one\
    \ with the functions, the other with the calls:\n\n```\nprint(timwo(2))\nprint(timthree(3))\n\
    print(square(4))\nprint(power(5,3))\n```\n\n+   * STEP 2: Under the above code,\
    \ enter functions to call the code:\n\n```\nprint(timwo(2))\nprint(timthree(3))\n\
    print(square(4))\nprint(power(5,3))\n```\n\nSave the program as basic_math.py\
    \ and execute it to get the results.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_79_0.png)\n\
    \n+   * STEP 4: If you now try and Execute the basic_math.py code again, the error\
    \ **NameError: 'timestwo' is not defined**! This is due to the code no longer\
    \ having access to the functions.\n\n+   * STEP 5: Return to the newly created\
    \ window containing the function definitions, and click File > Save As. Name it\
    \ minath.py and save it in the same location as the original basic_math.py. program\
    \ now basic_math.py, so the minath.py window is left open.\n\n> Traceback (most\
    \ recent call last):\n  File \"C:\\...basic_math.py\", line 3, in <module>\n \
    \   print(timestwo(2))\nNameError: 'timestwo' is not defined\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_79_1.png)\n\
