    \ 11))\n```\n\nWhich will return 1 to 10.\n\n# COLONS\n\nIt's for beginners to\
    \ forget to add a colon to the end of a structural statement, such as:\n\n```\n\
    class Hangman:\n    def guessed(self, letter):\n```\n\nAnd so on. The colon separates\
    \ the code, and creates the indents to which the code belongs.\n\n```\nclass Hangman:\n\
    \    def __init__(self, word):\n        self.word = word\n        self.missed_letters\
