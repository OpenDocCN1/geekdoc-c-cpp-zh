    In 2008 Python 3 arrived with several enhanced features. These features provide
    a more stable, effective and efficient programming environment but sadly, most
    of these new features are not compatible with Python 2 including modules and functions.
    While not popular at first, Python 3 has since become the exciting edge of Python.


    # Download the latest version for Windows


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_12_1.png)


    Wondering which one? Here''s more about the difference between Python 2 and 3.


    Looking for Python with a different OS? Python for Windows, Linux, Mac OS, Other.


    Want to help develop latest versions of Python? Check out development.


    # PYTHON 2


    So why? Python 2 was launched in 2000 and has since adopted a large collection
    of modules, scripts, users, tutorials and over years. Python 2 has fast become
    the first of go to programming languages for beginners and experts to code in,
