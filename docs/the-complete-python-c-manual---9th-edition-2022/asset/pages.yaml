  md: '# # Opening Files


    In Python you can read and write binary files in your programs. You can also write
    to file, which is something we will look at next. Reading and writing files you''ve
    used previously to output and store data from your programs.


    # ## OPEN, READ AND WRITE


    In Python you create a file object, similar to creating a variable, only pass
    in the file using the open() function. Files are usually categorised as text or
    binary.


    +   * STEP 1 Just by entering some text into your system''s editor. The text editor
    is best, not a word processor, as word processors include basic formatting and
    other elements. In our example, we have the poem Cimmerian, by Robert E Howard.
    You need to save the file as poem.txt.


    +   * STEP 3 If you enter poem into the Shell, you will get some information regarding
    the file you''ve asked to be opened. You can also use poem to read the contents
    of the file:


    poem.read()

    Note a / in a text entry returns a new line, as you will see.


