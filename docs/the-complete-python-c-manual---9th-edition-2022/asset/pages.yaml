  md: "# C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash '/',\
    \ or a forward slash and an asterisk, '/*'. You've already seen some brief examples\
    \ but this is how they work.\n\nUsing the Hello World code as an example, you\
    \ can easily comment on different sections of the code using the forward slash:\n\
    \nBe careful when you're commenting, especially with comments. It's very easy\
    \ to forget to add the asterisk and slash to negate any code that falls inside\
    \ the comment block.\n\n```\n// My first C++ program\ncout << \"Hello, world!\\\
    n\";\n\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // My first\
    \ C++ program\n    cout << \"Hello, world!\\n\";\n}\n\n```\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    cout << \"Hello, world!\\n\";\n    cout\
    \ << \"And greetings from C++\";\n    // cover lines\n    // need to add more\
    \ slashes\n    cout << \"This line is now being ignored by the compiler!\";\n\n\
    ```\n\nHowever, you can add comments to the end of a line of code, to describe\
    \ in a better way what's going on:\n\n```\ncout << \"Hello, world!\\n\"; //This\
    \ line outputs the words 'Hello, world!'. The \\n denotes a new line.\n```\n\n\
    Note, you don't need a semicolon at the end of a comment. This is because it's\
    \ in a line that is ignored by the compiler.\n\n```\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    cout << \"Hello, world!\\n\"; //This line\
    \ outputs Hello, world. The ...\n}\n\n```\n\nIf you obviously try and add a comment,\
