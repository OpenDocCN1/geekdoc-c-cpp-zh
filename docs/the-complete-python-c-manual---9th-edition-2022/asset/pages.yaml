  md: "# For Loop\n\nIn some respects, a for loop works in very similar way to that\
    \ of a while loop, although it's structure is different. A for loop is split into\
    \ three stages: an initialiser, a condition and an incremental step. Once set\
    \ up, the loop repeats itself until the condition becomes false.\n\n# LOOPY LOOPS\n\
    \nThe initialise stage of a for loop is executed only once and sets the point\
    \ reference for the loop. The condition is evaluated by the loop to see if it's\
    \ true or false and the increment executes the second and third stage.\n\n+  \
    \ **STEP 1** Create a new C++ File, with the standard headers:\n#<iostream>\n\
    using namespace std;\nint main() {\n\n}\n\n+   **STEP 4** After the loop, you\
    \ created a compound statement in braces (curly brackets), that displays the current\
    \ value of the integer num. Every time the for repeats itself, the second and\
    \ third stages of the loop, it adds 1 until the condition <30 is false. The loop\
    \ then ends and the code continues, ending nearly with return.\n\n```\n//Forloop.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n\n\tcout << \"Number:\
    \ \" << num << endl;\n\n\treturn 0;\n}\n```\n\n+   **STEP 2** Start a simple code\
    \ for a loop that counts from 1 to 30, displaying the value to the screen with\
    \ each increment:\n//For Loop Begins\nfor (int num = 1; num < 30; num = num +\
    \ 1) {\n\tcout << \"Number: \" << num << endl;\n\treturn 0;\n}\n\n+   **STEP 5**\
    \ A loop is quite a neat package in C++, all contained within its brackets, while\
    \ the other elements of the loop are displayed below. If you want to create a\
    \ 10-second countdown, you could use:\n#<iostream>\n#include <windows.h>\nusing\
    \ namespace std;\nint main() {\n\n```\n//For Loop Begins\nfor (int a = 10; a !=\
    \ 0; a = a - 1) {\n\tcout << a << endl;\n\tSleep(1000);\n}\n\tcout << \"nBlast\
    \ Off!\" << endl;\nreturn 0;\n```\n\n+   **STEP 3** Working through the process\
    \ of the for loop, by creating an integer num and assigning it a value of 1. Next,\
    \ set the condition, in this case num up to 30. The last stage is where the loop\
    \ increments; here's the value of num being added by one.\n\n```\n//For Loop Begins\n\
    for (int num = 1; num < 30; num = num + 1) {\n}\n```"
