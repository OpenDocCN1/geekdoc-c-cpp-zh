    is to tackle functions. You''ve already used a few functions, such as the print
    command but Python enables you to define your own functions.


    # FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It''s a little
    piece of self-contained code that works on it and returns the result.


    STEP 1

    Input data to a function that works. They can do manner of useful things in Python,
    sort change items from one format to another and check the length or type of items.
    A function is a short word that follows by brackets. For example, len(), list()
    or type().


