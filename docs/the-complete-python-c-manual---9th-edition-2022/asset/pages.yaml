    \ who make the kinds of errors we outline on these pages, even hardened coders\
    \ are prone to the odd mistake here and. Here are some common issues to try and\
    \ avoid.\n\n# UNDECLARED IDENTIFIERS\n\nA common C++ mistake, and to be honest\
    \ common mistake with most programming languages, is when you try to output a\
    \ variable that doesn't exist. Displaying the value of x on-screen is fine but\
    \ not if you haven't told the compiler what the value of x is to begin.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_141_0.png)\n\
    \n# STD NAMESPACE\n\nReferencing the Standard Library is common for beginners\
    \ throughout your code, but if you miss the std:: element of a statement, your\
    \ code errors when compiling. You can combat this by:\n\n```\nusing namespace\
    \ std;\n```\n\nUnder the #include part and simply using std cin, and so on\n\n\
    ```\n#include <iostream>\nusing namespace std;\nint main() {\n    int a, b, c,\
    \ d;\n    a=10;\nb=20;\nc=30;\nd=40;\n    cout << a << b << c << d << endl;\n\
    }\n```\n\n# SEMICOLONS\n\nRemember that each line of C++ program must end with\
    \ a semicolon. If it doesn't the compiler treats the line with the missing semicolon\
    \ as the next semicolon. This creates all manner problems when trying to compile,\
    \ so don't forget your semicolons.\n\n```\n#include <iostream>\n```\n\n```\nint\
    \ main() {\n    int a, b, c, d;\n    a=10;\nb=20;\nc=30;\nd=40;\n    std::cout\
    \ << a << b << c << d;\n}\n```\n\n# GCC OR G++\n\nIf you're in Linux then you\
    \ will not come across gcc and g++. In short, gcc is the GNU Compiler (or GNU\
    \ C Compiler as it is to be called) and g++ is the GNU (the C++ version) of the\
    \ compiler. If you're using Windows then you need to ensure the correct compiler\
    \ will be used.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_141_1.png)"
