  md: '# # Using Modules


    The random module is one you will likely come across many times in your Python
    programming lifetime; as the name suggests, it''s designed to create random numbers
    or letters. However, it''s not exactly random but it will suffice for most needs.


    # ## RANDOM NUMBERS


    There are numerous functions within the random module, when applied can create
    some interesting and very useful Python programs.


    +   - **STEP 1** As with other modules you need to import random before you can
    use any of them. Let''s begin by simply printing a random number from 1 to 5:


    ```

    import random

    print(randint(0,5))

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_0.png)


    +   - **STEP 2** In our example the number four was returned. However, enter the
    print function a few times and it will different integer values from numbers,
    zero to five. The example of this pseudo-random is adequate for the average number
    to utilise in their code.


    ```

    import random

    print(random.random(*100))

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_1.png)


    +   - **STEP 4** However, the random module isn''t used exclusively for numbers.
    You can use it to select an entry from a list, and the list can contain:


    ```

    import random

    random.choice(["Conan", "Valeria", "Belit"])

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_2.png)


    +   - **STEP 5** You can extend the example somewhat by using random.choice()
    from a list of items variables.


    ```

    import random

    list=["44", "88M Publications", 3245.23, "Pi", 3.14, "Python"]

    print(random.choice(list))

    ```


    +   **STEP 3** For a bigger set of numbers, including floating multiplication
    size, you can extend the range by using the


    Will display a floating point number between 0 and 100, to use the range of around
    decimal places.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_3.png)'
