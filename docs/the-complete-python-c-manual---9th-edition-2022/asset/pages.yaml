    \ they're surprisingly powerful too.\n\n# GOING GRAPHICAL\n\nYou can draw simple\
    \ graphics, lines, squares and so on, you can use one of the many Python modules\
    \ available, to bring out some spectacular effects.\n\nSTEP 1 One of the best\
    \ graphical modules to begin learning Python is Turtle. The Turtle module is,\
    \ as the name suggests, based on the turtle robots used in many schools, that\
    \ can be programmed to draw something on a large piece of paper on the floor.\
    \ The Turtle module can be imported with: turtle:\n\nSTEP 3 The command turtle.circle(50)\
    \ is what draws the circle on the screen,(50) being the size. you beyond, where\
    \ turtle can draw an arc by: turtle.circle(50,180); you can play with the sizes\
    \ if you like, going up to 100, 150 and 180), where the size is 50, but you're\
    \ telling Python to only draw 180° of the circle.\n\n```\nFile Edit Help Setup\
    \ Window Help\nPython 3.4.2 (default: Oct 19 2014, 12:31:11)\n(C) 2000 Python\
