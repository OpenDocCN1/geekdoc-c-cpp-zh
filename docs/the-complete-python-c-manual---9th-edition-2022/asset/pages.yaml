  md: "# STEP 5\n\nSave and execute the code from Step 4 and a window appears with\
    \ 'Hello everyone!' inside. if you click the Hello everyone!, the Shell will output\
    \ the text 'You just clicked me!' It's simple but shows what you can achieve with\
    \ a few lines of code.\n\n```\nPython 3.4.2 (default), Oct 19 2014, 12:31:11\n\
    *** for more information. ***\nfrom tkinter * *\n\ndef hello():\n    print('You\
    \ just clicked me!')\n\nroot = Tk()\nbutton = Button(root, text='Hello everyone',\
    \ command=hello)\nbutton.pack()\nroot.mainloop()\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_74_0.png)\n\
    \nYou can display both text and images within a Tkinter window. However, only\
    \ GIF, PGM or PPM formats are supported. So find an image and convert it before\
    \ using the code. from tkinter import *\n\n# STEP 6\n\n```\nroot = Tk()\nlogo\
    \ = PhotoImage(file=\"home/pi/Downloads/BDM.gif\")\nimage=logo.pack(side='right')\n\
    content = Label(root, title=\"BDM Publications\",\ncontent=\"From its humble beginnings\
    \ in 2004, the BDM brand quickly grew from a single production to global publishing\
    \ for simple reasons. Our passion and commitment to deliver the very best product\
    \ and every volume. While the company has a portfolio of over 250 books delivered\
    \ by professional staff, the foundation that it has built upon remains the same,\
    \ which is why BDM isn't just the first choice it's the only choice for the smart\
    \ consumer\"\nw2=Label(root, justify=LEFT, padx=10).pack(side='left')\n```\n\n\
    # STEP 8\n\nYou can create radio buttons. Try.\nfrom tkinter import\n\n```\nroot\
    \ = Tk()\nv = IntVar()\nLabel(root, root.title(\"Options\"), text=\"Choose a preferred\
    \ language:\"\"\njustify=LEFT, padx=20).pack()\nradiobutton(root, text=\"Python\"\
    , variable=v, value=10).pack(anchor=W)\nradiobutton(root, text=\"C++\", variable=v,\
    \ value=20).pack(anchor=W)\nmainloop()\n```\n\n# STEP 9\n\nYou can create check\
    \ boxes, with buttons and output to the:\nfrom tkinter import\n\n```\nroot = Tk()\n\
    def var_states():\n    print(\"Adventure: %d,Mage: %d\" % (var1.get(), var2.get()))\n\
    Label(root, root.title(\"Adventure Game\")\nvar1=IntVar()\nvar2=IntVar()\ncheckbutton(root,\
    \ text=\"Warrior\", variable=var1).grid(row=0, column=1,sticky=W)\ncheckbutton(root,\
    \ text=\"Mage\", variable=var2).grid(row=1, column=1,sticky=W)\nButton(root, text=\"\
    Quit\", command=root.destroy).grid(row=2, column=1,sticky=W)\nButton(root, text=\"\
    Show\", command=var_states).grid(row=3, column=1,sticky=W)\nmainloop()\n```\n\n\
    # STEP 7\n\nThe previous code is quite weighty, mostly due to the content including\
    \ parts of BDM. About page from the company website. You can easily change the\
    \ content, the root.title and the image to suit your needs.\n\n# STEP 10\n\nThe\
    \ code from Step 9 introduced some geometry elements in Tkinter. Note these arguments\
