  md: '# Getting to Know Python


    # HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
    they fly above the hardware (also referred to as "the metal"). Languages that
    fly close to the metal, like Assembly, are called "low-level". Low-level languages
    command a bit like this: `mov len, eax, 5`


    # ZEN OF PYTHON


    Python lets access all the power of a computer in a language that humans can understand.
    Behind this is an ethics called "The Zen of Python". This is a collection of 20
    software principles that influence the design of the language. Principles include
    "Beautiful" is better than ugly, "Simple is better than complex", Explicit is
    better than implicit and will display all your principles.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_12_0.png)


