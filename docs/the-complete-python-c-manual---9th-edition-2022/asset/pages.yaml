  md: "# # Where Next?\n\nCoding, like most subjects, is a continual learning experience.\
    \ You may not class yourself as a beginner but you will still need to test your\
    \ code, learn new tricks and hacks to make it more efficient and even branch out\
    \ and learn another programming language.\n\n# ## INCLUDE<KEEP ON LEARNING>\n\n\
    What can you do to further your skills, learn new coding practices, experiment\
    \ and present your code and even begin to help others using what you have experienced\
    \ so far?\n\n# ## TWITTER\n\nTwitter isn't all trolls and antagonists, but the\
    \ well-personalised people who are more willing to spread their coding knowledge.\
    \ We recommend you a few who you can relate to and follow them. They often post\
    \ great tips, hacks and fixes for common problems.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_143_0.png)\n\
    \n# ## KEEP CODING\n\nIf you've mastered Python fairly well, then turn your attention\
    \ to C++ or C#. Keep still your Python skills while learning a new coding language\
    \ keeps the old brain trick active and gives you a nice view into another community,\
    \ and how they are doing differently.\n\n# ## SHARE SKILLS\n\nBecome active on\
    \ coding and development knowledge sites, such as StackExchange. If you have the\
    \ skills to help and help others, won't you really feel good doing so as you also\
    \ learn a lot by interacting with other members.\n\n```\n#pragma once\n#define\
    \ __ME_FILE__ __FILE__ __LINE___\nconst double pi = 3.14159;\ndouble *ptr = &pi;\n\
    double multptr(double x, int_t y) { return *ptr * x; }\n\ntemplate <typename T>\
    \ struct func {\n    static_assert(std::is_floating_point<T>::value,  \"T must\
    \ be a floating-point type\");\n};\n\nstruct A {\n    int a;\n    [= =]]\n   \
    \ virtual void func() override;\n};\n\ntemplate <typename T> concept EqualityComparable\
    \ = requires(T a, T b) {\n    a == b;\n};\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_143_1.png)\n\
    \n144 www.bodypublications.com"
