  md: '# USER ERROR


    User input is often a paralys mistake in code. For example, the user is supposed
    to enter a number for their age and enter it as letters. Often a user can enter
    into such an input that overflows internal buffer, thus causing the code crash.
    Watch those user inputs and clearly state what is needed from them.


    ```

    Enter an integer number

    You have entered wrong input

    You have entered wrong input

    You have entered wrong input

    sdfaf212312123

    1322n2y9n2x3n2y9n2x

    You have entered wrong input

    The number is: 12

    Process returned (0x0) execution time: 2.49 s

    Press any key to continue

    ```


    # BACKUPS


    Always make a backup of your work, with a secondary backup for any changes you''ve
    made. Mistakes can be rectified if there''s a good backup in place to revert to
    those times when something goes wrong. It''s much easier to start where you left
    off, rather than starting from the beginning.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_138_0.png)


    # RE-INVENTING WHEHEELS


    You can easily spend days trying to fathom out some of code to achieve a given
    result and it''s frustrating and often time-consuming. While it''s rewarding to
    solve the problem, often the same code is out there on the Internet somewhere.
    Don''t re-invent the wheel, look to see if someone else has done it!


    # SECURE DATA


    If you''re writing code to deal with usernames and passwords, or other sensitive
    data, how to ensure that the data isn''t in cleartext. How to create a function
    to encrypt sensitive data, prior to feeding into a routine that can transmit or
    store it where may be able to get to.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_138_1.png)


    # HELP!


    Asking for help is something of us has struggled with in the past. Will the people
    we''re asking laugh at us Am I wasting everyone''s time? It''s a common mistake
    for someone to suffer in silence. As long as you are in the correct manner, obey
    any forum or be polite, your question isn''t silly.


    # MATHS


    If your code makes multiple calculations you need to ensure that the maths behind
    it is sound. There are thousands of instances where programs have incorrect data
    based on poor mathematical coding, which on what the code is set to do. In short,
    double your code equations.


