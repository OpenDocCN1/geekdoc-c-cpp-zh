  md: '# Lists


    Lists are one of most common types of data structures that you comes across in
    Python. A list is simply a collection of items, or if you prefer, that can be
    accessed as a whole, or individually if wanted.


    # WORKING WITH LISTS


    Lists are extremely handy in Python. A list can be strings, integers and also
    variables. You can even include functions in lists, and within lists..


    +   STEP 1 A list is a sequence of data values called items. You can create the
    name of your list followed by an equals sign, then square brackets and separate
    the items with commas;


    ```

    numbers = [1, 4, 7, 21, 98, 156]

    mystical_creatures = ["Unicorn", "Balrog", "Vampire", "Dragon", "Winteraur"]

    ```


    +   STEP 3 You can also access, or index, the list item in a list by using the
    minus sign before the item number [-1], or the second to last item with [-2] and
    so on. Trying to reference an item that isn''t in the list, e.g. [10] will return
    an error: mythical[-1]


    ```

    numbers[-1]

    mystical_creatures[-4]

    ```


