- md: "\n# Beginner Python Mistakes\n\nPython is a relatively easy language to learn\
    \ when there's plenty of room for the beginner to find their footing. However,\
    \ as with any other programming language, it can be easy to make common mistakes\
    \ that will stop your code from running.\n\n## DEF BEGINNER(MISTAKES)=10\n\nHere\
    \ are ten python mistakes most beginners find themselves making. Being able to\
    \ identify these mistakes will save you headaches in the future.\n\n## VERSIONS\n\
    \nTo add to the confusion that most beginners already face when coming into programming,\
    \ Python has two live versions of its language available to download and use.\
    \ There is Python version 2.7 and Python 3.6.x. The 3.6.x is the most recent,\
    \ and the one we recommend starting with. But, 2.7 does not work with 3.6 code\
    \ and vice versa.\n\n## INDENTS, TABS AND SPACES\n\nPython uses precise indentations\
    \ when displaying its code. The indents mean that the code in that section is\
    \ part of the previous statement, not something linked to another part of the\
    \ code. Use four spaces to create an indent, not the tab.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_139_0.png)\n\
    \n## THE INTERNET\n\nEvery programmer has some points to go on the Internet and\
    \ copy some code to insert into their own routines. There's nothing wrong with\
    \ using others'; but you need to know how the code works and what it does before\
    \ you go running it in your computer.\n\n## COMMENTING\n\nAgain. It's a huge factor\
    \ in programming, even if you're the only one who is going to view the code, you\
    \ need to add comments to what's going on. When this function fails you write\
    \ a comment explaining why, it helps you remember what's going on.\n\n```\nCreate/delete\
    \ .txt file in a program\n```\n\n```python\n# I have a comment to grab values\
    \ from a list. I can delete it, depending on the value of the\n# list I want.\n\
    \n# My problem is to delete the code so if that statement creates a list then\
    \ called list\nto delete: this file if it exists.\n\n# In the event that occurs,\
    \ I would like to delete the file. If it exists, it\n# would be highly recommended.\n\
    ```\n\n```python\nimport os\n\ndef delete_file(filename):\n    if os.path.exists(filename):\n\
    \        os.remove(filename)\n\n# check value (percentage = average percentage)\n\
    # print(percentage, \"in humid\")\n```\n\n```python\n# set pygame\npygame.init()\n\
    mainClock = pygame.Clock()\n\n# set up the window\nwidth = 800\nheight = 600\n\
    screen = pygame.display.set_mode((width, height), 0, 32)\npygame.display.set_caption('caption')\n\
    \n# set up movement variables\nmoveLeft = False\nmove = False\nmoveDown = False\n\
    \n# set up direction variables\nLEFT = 0\nRIGHT = 3\n```\n\n## COUNTING LOOPS\n\
    \nRemember that in Python a loop doesn't count the last number you specify in\
    \ range. If you want the loop to count from 1 to 10, then you will need to use:\n\
    \n```python\nn = list(range(1, 11))\n```\n\nWhich will return 1 to 10.\n\n## COLONS\n\
    \nIt's for beginners to forget to add a colon to the end of a structural statement,\
    \ such as:\n\n```python\nclass Hangman:\n    def guessed(self, letter):\n```\n\
    \nAnd so on. The colon separates the code, and creates the indents to which the\
    \ code belongs.\n\n```python\nclass Hangman:\n    def __init__(self, word):\n\
    \        self.word = word\n        self.missed_letters = []\n\n    def guessed(self,\
    \ letter):\n        if letter not in self.word:\n            self.missed_letters.append(letter)\n\
    \        else:\n            pass\n```\n\n## CASE SITIVE\n\nPython is a case sensitive\
    \ programming language, so you will need to check any variables. For example,\
    \ Lives10 is a different variable to lives10, calling the wrong variable in your\
    \ code can have unexpected results.\n\n```python\n>>> lives = 10\n>>> print(Lives,\
    \ lives)\n10\n```\n\n## OPERATORS\n\nUsing the operator is also a common mistake\
    \ to make. When you're performing a comparison between two values, for example,\
    \ you need to use the equality operator (double equals, ==). Using a single equals\
    \ (=) assigns a value to a variable (such as, lives10).\n\n```python\nb=5\nc=10\n\
    # b == false 5 is not equal to 10\n# d == true 10 is equal to 1\n```\n\n## BRACKETS\n\
    \nEveryone forgets to include extra bracket they should have added to the end\
    \ of the statement. Python relies on having an equal amount of closed brackets\
    \ to open brackets, so any errors in your code could be due to you forgetting\
    \ to count your brackets.\n\n## OPERATING SYSTEMS\n\nWriting code for multiple\
    \ platforms is difficult, especially when you need to start the external elements\
    \ of the operating system. For example, if you code for the screen to be cleared,\
    \ then for Windows you must use cls. Whereas in Linux you need to use clear. You\
    \ need to be careful by capturing the input and using an alternative command.\n\
    \n```python\ndef print_status(self):\n    print (board(len(self.missed_letters)))\n\
    \    print ('Word: ' + self.hide_word())\n    for letter in self.missed_letters:\n\
    \        print (letter, '))\n\n    print ()\n    print ('Guessed: ')\n    for\
    \ letter in self.missed_letters:\n        print (letter, '))\n```\n\n```python\n\
    # Code error using a different os\nwhile(run==1):\n    try:\n        os.system('clear')\n\
    \    except OSError:\n        os.system('cls')\n```\n\n## C++ Mistakes\n\nThere\
    \ are many pitfalls the C++ developer can encounter, especially as this is a more\
    \ complex and unforgiving language to master. Beginners need to take C++ a step\
    \ at a time and digest what they've learned before moving on.\n\n## VOID MISTAKES\n\
    \nAdmittedly it's not just beginners who make the kinds of errors outlined on\
    \ these pages, even hardened coders are prone to. Here are some common issues\
    \ to try and avoid.\n\n## UNDECLARED IDENTIFIERS\n\nA common mistake with most\
    \ programming languages is when you try to output a variable that doesn't exist.\
    \ Displaying the value of x on screen is fine but not if you haven't told the\
    \ compiler what the value of x is.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_141_0.png)\n\
    \n## NAMESPACE\n\nReferencing the Standard Library is common for beginners throughout\
    \ your code, but if you miss the std:: element of a statement, your code errors\
    \ when compiling. You can combat this by simply using:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int a, b, c, d;\n    a=10;\n    b=20;\n\
    \    c=30;\n    d=40;\n    cout << a << b << c << endl;\n}\n```Remember that each\
