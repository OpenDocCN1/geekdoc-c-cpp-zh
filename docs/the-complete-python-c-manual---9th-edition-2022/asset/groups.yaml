- md: "\n# How to Set Up Python in Linux\n\nPython version 2.x is already installed\
    \ in most Linux distributions but we're going to be using Python 3.x, there's\
    \ a little work we need to do first to get hold of it. Frankly, it's not too difficult.\n\
    \n## PYTHON PENGUIN\n\nLinux is a versatile operating system that it's often difficult\
    \ to nail down one way of doing something. Different distributions go installing\
    \ software in different ways, so we will stick to Linux Mint 18.1 for this particular\
    \ tutorial.\n\n- STEP 1 First need to ascertain which version of Python is currently\
    \ installed in your Linux system; as mentioned, we're going to be using Linux\
    \ Mint 18.1 for this section. With macOS, drop it into a Terminal pressing Ctrl+Alt+T.\n\
    - STEP 2 Next enter: python --version into the Terminal 2.x of Python in the display.\
    \ You should have the output relating to in this particular case is Python 2.7.12.\n\
    - STEP 3 Some distros will automatically update the installation of Python to\
    \ the latest versions whenever we first do a system update and upgrade: sudo apt-get\
    \ update && sudo apt-get upgrade Enter your password and let the system do any\
    \ updates.\n- STEP 4 Once the update and upgrade is complete, enter: python3 --version\
    \ to see if Python 3.x is updated or even installed. In the case of Linux Mint,\
    \ we have Python 3.5.2, which is fine for our purposes.\n\n```\nFile Edit View\
    \ Search Terminal Help\ndavid@david-mint ~$\n```\n\n```\nFile Edit View Search\
    \ Terminal Help\ndavid@david-mint ~ $ python python --version\nPython 2.7.12\n\
    $ sudo apt-get update && sudo apt-get upgrade\n[sudo] password for david: \n```\n\
