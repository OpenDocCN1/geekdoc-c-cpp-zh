- md: "\n# A HANDY CHART\n\nThere are numerous character literals, or escape sequence\
    \ codes, to choose from. We therefore thought it would be good for you to have\
    \ a handy chart available, for those times you need to insert a code.\n\n| ESCAPE\
    \ SEQUENCE CODE | CHARACTER |\n| --- | --- |\n| \\ | Backslash |\n| \\' | Single\
    \ Quote |\n| \\\" | Double Quote (Speech Marks) |\n| \\? | Question Mark |\n|\
    \ \\a | Alert/Alarm |\n| \\b | Backspace |\n| \\f | Form Feed |\n| \\n | New Line\
    \ |\n| \\r | Carriage Return |\n| \\t | Horizontal Tab |\n| \\v | Vertical Tab\
    \ |\n| \\0 | Null Character |\n| \\uxxxx | Unicode (UTF-8) |\n| \\xxxxxxxxxxxx\
    \ | Unicode (UTF-16) |\n\n# UNICODE CHARACTERS (UTF-8)\n\nUnicode characters are\
    \ symbols or characters that are standard across all platforms. For example, the\
    \ copyright symbol, can be entered via the keyboard by entering the Unicode Code,\
    \ followed by Alt+X. In the case of the copyright symbol enter: 00A9 Alt+X. In\
    \ C++, you would use:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n\tcout << \"\\u00A9\";\n}\n```\n\n# UNICODE CHARACTER TABLE\n\nA complete\
    \ list of the available Unicode characters can be found at www.unicode-table.com/en/.\
    \ Hover over your mouse over the character to see its unique code to enter in\
    \ C++.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_118_0.png)\n\n# Defining Constants\n\
    \nConstants are fixed values in your code. They can be any basic data type as\
    \ the name suggests their value remain throughout the entire code. There are two\
    \ separate ways to define a constant in C++, the #define pre-processor and const.\n\
    \n## #DEFINE\nThe pre-processors are instructions to the compiler to pre-process\
    \ the information before it goes ahead and compiles the code. #Include is a pre-processor\
    \ as is #Define.\n\n### STEP 1\nYou can use the #define to define any constants\
    \ that we want in our code. Start by creating a new C++ file with the following\
    \ headers:\n\n### STEP 2\nNow let's assume your code has three different constants:\
    \ length, width and height. You can define\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\nint\
    \ main() {\n\n}\n```\n\n### STEP 3\nNote the capitals for defined constants, it's\
    \ considered good programming practise to define all in capitals. Here, the assigned\
    \ values are 50, 40 and 60, so let's call them up:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\
    int main() {\ncout << \"Length: \" << LENGTH << \"\\n\";\ncout << \"Width: \"\
    \ << WIDTH << \"\\n\";\ncout << \"Height: \" << HEIGHT << \"\\n\";\n}\n```\n\n\
    ### STEP 4\nBuild and run the code. It just as expected, the values for each of\
    \ the constants created. It's worth noting that you don't need a semicolon when\
    \ defining a constant with the #define key.\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\nint\
    \ main() {\ncout << \"Length: \" << LENGTH << \"\\n\";\ncout << \"Width: \" <<\
    \ WIDTH << \"\\n\";\ncout << \"Height: \" << HEIGHT << \"\\n\";\n}\n```\n\n```text\n\
    length: 50\nwidth: 40\nheight: 60\nProcess returned 0 (execution time: 0.042 sec)\n\
    Press any key to continue\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_119_0.png)\n\
    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_119_1.png)\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_119_2.png)\n\
    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_119_3.png)\n\n# Defining Constants\n\n\
    ### STEP 5\nYou can also define other elements as a constant. For example, instead\
    \ of using \\n for a newline in the cout statement, define it at the start of\
    \ the code:\n\n```cpp\n#include <iostream>\nusing namespace std;\n#define LENGTH\
    \ 50\n#define WIDTH 40\n#define HEIGHT 60\nint main() {\n}\n```\n\n### STEP 6\n\
    The code, when built and executed, does exactly the same as before, using the\
    \ constant to insert a newline in the cout statement. Identifying a newline constant\
    \ is not a good idea if you're making it harder to \\n or the end\n\n### STEP\
    \ 7\nDefining a constant is going to adjust your base values at the start of the\
    \ code. You can define that has three lives, or even the value of PI calling up\
    \ to the C++ library:\n\n```cpp\n#include <iostream>\nusing namespace std;\n#define\
    \ WIDTH 50\n#define HEIGHT 40\n#define NEWLINE \"\\n\"\nint main() {\n}\n```\n\
    \n### STEP 8\nAnother method of defining a constant is with the const keyword.\
    \ Use together with a data type variable = value. Using Pi as an example:\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    const double\
    \ PI = 3.14159;\n    cout << \"The Value of Pi: \" << endl;\n}\n```\n\n### STEP\
    \ 9\nBecause you are using const within the main block of code, you need to finish\
    \ the line with a semicolon. You can use either, as long as names and values don't\
    \ clash, but worth mentioning that #define uses no memory, so it is your best\
    \ bet.\n\n```cpp\n#include <iostream>\nusing namespace std;\n#define WIDTH 50\n\
    #define HEIGHT 60\n#define NEWLINE \"\\n\"\nint main() {\n}\n```\n\n### STEP 10\n\
    Const works in the same way as #define. You can create static integers and even\
    \ lines:\n\n```cpp\n#include <iostream>\nusing namespace std;\n#define PI 3.14159\n\
    int main() {\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    const int LENGTH = 50;\n    const int WIDTH = 40;\n    const char\
    \ NEWLINE = \"\\n\";\n    int area = LENGTH * WIDTH;\n    cout << \"Area is: \"\
    \ << area << NEWLINE;\n}\n```\n\n```\nThe Value of Pi:\n```\n\n# File Input/Output\n\
    \nThe standard iostream library provides C++ coders with the cin and cout functionality.\
    \ However, to be able to read and write from a file you need to utilise another\
    \ C++ library, called fstream.\n\n# FSTAMS\n\nThere are two main data types within\
    \ the library that are used to open a file, read from it and write to it, ofstream\
    \ and fstream. Here's how they work.\n\n### STEP 1\nThe first task is to create\
    \ a new C++ file with the usual headers you need to include the fstream header:\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nint main()\
    \ {\n```\n\n### STEP 2\nBegin asking a user for their name and information to\
    \ a file. You will need the fstream to store the name, and getline to accept the\
    \ input from the user.\n\n```cpp\n#include <iostream>\n#include <fstream>\nusing\
    \ namespace std;\nint main() {\nstring name;\nnewfile.open(\"name.txt\");\ncout\
    \ << \"Enter your name: \" << endl;\ngetline(cin, name);\nnewfile << name << endl;\n\
    newfile.close();\n```\n\n### STEP 3\nWe've included comments in the screenshot\
    \ of step 2 to help you understand the process. You created a string variable\
    \ to store the user's inputted name. You also created a text file named name.txt\
    \ (with the ofstream and open lines), asked the user for their name and stored\
    \ it and then wrote the data to the file.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_121_0.png)\n\
    \n### STEP 4\nTo read the contents of a file, and output to the screen, you need\
    \ to do things slightly differently. You first need to create a string variable\
    \ to store the file's contents (line by line), then open the file, use getline\
    \ to read the file by line and output it to the screen. Finally, close the file.\n\
    \n```cpp\nstring name;\nstring line;\nnewfile(\"name.txt\");\ncout << \"Contents\
    \ of the file: \" << endl;\ngetline(newfile, line);\ncout << line << endl;\ngetline(newfile,\
    \ line);\ncout << line << endl;\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_121_1.png)\n"
