    # # How to Set Up Python in Windows


    Windows users can easily install the latest version of Python via the main Downloads
    page. Whilst most seasoned Python developers may shun Windows as a platform for
    building their choice, it''s still an ideal starting point for beginners.


    # ## INSTALLING PYTHON 3.X


    Microsoft Windows doesn''t come with Python 3.x, as standard, so you''re going
    to have to install it manually. Frankly, it''s an easy process to follow.


    +   **STEP 1** Start by opening your browser to www.python.org/downloads/. Looking
    for the download link for Python 3.x (in this case it is Python 3.6 but you may
    see later versions of 3).


    +   **STEP 3** Choosing the Customise option allows you to specify certain parameters,
    and whilst you may stay with the defaults, a good habit to adopt as (sometimes
    with Python, thankfully) installers can include unwanted additional features.
    On the next screen, ensure all boxes are ticked and click the next.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_13_0.png)


    Wondering which version to choose? Here is more about the difference between Python
    2 and 3.


    Looking for a different OS? Python for Windows, Linux/Unix, Mac OS Other


    Want to help develop versions of Python? Pre-releases


    +   **STEP 2** Click the download button for version 3.x, and save the file to
    your Downloads Folder. When the file is downloaded, click the executable and the
    Python installation will launch. From here you have two choices: Install Now or
    Custom. We recommend opting for the Customise Installation link.


    The next set of pages includes some interesting features to add. Ensure the Shortcuts,
    Add Python to Environment Variables, Precompile Standard Library and for all Users
    are checked. These make using Python later much easier. Click Install when you''re
    ready to continue.


    | Install Python 3.6.2 (32-bit) |

    | :--- |

    | Install Now | Installs Python with default settings, or Custom to enable or
    disable features.

    | Custom | This includes pip, and documentation Create shortcuts for Python 3.6-32
    Create shortcuts and file associations

    | Customise location | Location and names

    | Install launcher for all users (recommended) Add Python 3.6 to PATH |


    | Advanced Options |

    | :--- |

    | Install for all users\| Associate files with Python (requires the launcher)

    | Create shortcuts for installed applications\| Add Python to environment variables

    | Precompile standard library

    | Download debug binaries (VS 2015 or later) |


    | Customise location |

    | C:/Program Files (x86)/Python36 |'
