    You can easily spend days trying to fathom out some of code to achieve a given
    result and it''s frustrating and often time-consuming. While it''s rewarding to
    solve the problem, often the same code is out there on the Internet somewhere.
    Don''t re-invent the wheel, look to see if someone else has done it!


