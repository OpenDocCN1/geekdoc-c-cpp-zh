  mdcn: "\n\n# 下一步去哪里？\n\n编程和大多数学科一样，是一个持续学习的经历。你可能不会将自己归类为新手，但你仍然需要测试代码，学习新的技巧和黑科技来让代码更高效，甚至可以扩展领域学习另一种编程语言。\n\
    \n## 包含 <持续学习>\n\n你可以做些什么来进一步提升技能、学习新的编码实践、实验并展示你的代码，甚至开始利用你目前积累的经验来帮助他人？\n\n\
    ## TWITTER\n\nTwitter 并不全是喷子和反对者，还有许多个性鲜明且更愿意分享他们编程知识的人。我们为你推荐几位你可以产生共鸣并关注他们。他们经常会发布很棒的技巧、黑科技以及针对常见问题的解决方案。\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_143_0.png)\n\n## 持续编码\n\n如果你已经相当熟练了\
    \ Python，那么请将注意力转向 C++ 或 C#。在学习新编程语言的同时保持你的 Python 技能，可以让旧大脑保持活跃，并让你领略另一个社区以及他们是如何进行不同实践的。\n\
    \n## 分享技能\n\n在 StackExchange 等编码和开发知识网站上活跃起来。如果你有能力帮助他人并获得帮助，当你这样做时真的不会感觉很棒吗？因为在与其他成员互动的过程中你学到很多。\n\
    \n```cpp\n#pragma once\n#define __ME_FILE__ __FILE__ __LINE__\nconst double pi\
    \ = 3.14159;\ndouble *ptr = &pi;\ndouble multptr(double x, int_t y) { return *ptr\
    \ * x; }\n\ntemplate <typename T> struct func {\n    static_assert(std::is_floating_point<T>::value,\
    \  \"T must be a floating-point type\");\n};\n\nstruct A {\n    int a;\n    virtual\
    \ void func() override;\n};\n\ntemplate <typename T> concept EqualityComparable\
    \ = requires(T a, T b) {\n    a == b;\n};\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_143_1.png)\n\
    \n# 进军移动端\n\n移动市场是一个测试你的编程技能并展示你创建的任何游戏或应用的好地方。如果你的 App 很好，谁知道它会不会成为应用商店中下一个大作呢。尽管如此，这是一种愉快的学习体验，值得考虑。\n\
    \n# 作品集\n\n如果你学习编程是为了将来能找一份开发人员方面的工作，那么建立一个在线代码作品集是值得的。查看招聘公告以及它们所需的技能，然后针对这些技能进行学习和编码，并将其加入你的作品集。在申请时，附上作品集的链接。\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_0.png)\n\n# 我的作品\n\n想看一些示例吗？给我发邮件吧！\n\
    \n# Chronicles.org\n\nChroniclesd.org 是一个博客，我在上面分享我对软件开发、技术和生活的看法。我还会介绍我设计新项目或解决问题的流程过程。\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_1.png)\n\n# 在线学习\n\n在线课程是提升编程技能的极佳示例，即使你处于初级水平。通常，在线课程会遵循严格的编码规范，所以如果你是自学者，那么看看其他开发者是如何布局代码的，以及什么是可以接受的，可能非常有价值。\n\
    \n> 免费互动式地学习编程。\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_2.png)\n\n# 教编程\n\
    \n你可以教吗？如果你的编程技能非常过硬，可以考虑联系学院或大学，看看他们是否需要编程语言老师，也许是兼职或短期课程。如果没有，可以考虑创建自己的 YouTube\
    \ 编程教程。\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_3.png)\n\n# 分享代码\n\n开始分享吧，即使你认为你的代码并不好。得到的批评、建议和评论有助于你解决代码中的任何问题，并将它们全部加入你的检查清单。或者，你的代码可能极其惊人，但除非展示出来，否则你并不知道。\n\
    \n# 硬件项目\n\n贡献硬件项目是与他人改进代码以及从其他贡献者那里学习的绝资源。许多开发者论坛都有发布供编码人员申请硬件项目的帖子，使用独特的代码来最大限度地发挥设计硬件的作用。\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_144_4.png)\n\n# 阅读更多\n\n# BDM 完整手册系列\n\
    \n## iPhone\n精通你的 iPhone 的必备分步手册。\n846\n\n## iPad & iPadOS 15\n精通 iPad 的必备分步手册。\n\
    853\n\n## Mac & macOS\n精通你的 Mac 和 macOS 的必备分步手册。\n968\n\n## iOS 15 适用于 iPhone\
    \ & iPad\n精通 iPad 和 iOS 15 的必备分步手册。\n1269\n\n## 黑白摄影\n精通黑白摄影的必备分步手册。\n849\n\n\
    ## 户外摄影\n精通户外摄影的必备分步手册。\n879\n\n## 创意摄影\n精通创意摄影的必备分步手册。\n883\n\n## GoPro 摄影\n\
    精通 GoPro 摄影的必备分步手册。\n853\n\n## 景观摄影\n精通景观摄影的必备分步手册。\n874\n\n## Photoshop Elements\n\
    精通 Photoshop Elements 的必备分步手册。\n860\n\n## Instagram\n适用于 iPhone、iPad、Android、PC\
    \ 和 Mac。精通 Instagram 和账户安全的必备分步手册。\n438\n\n## WhatsApp\n适用于 iPhone、iPad、Android\
