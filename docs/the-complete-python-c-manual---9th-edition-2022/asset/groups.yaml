    ```\n\n# 步骤 7\n\n在这种情况下，do... while 循环要求你输入一个数字，赋值给 `number` 变量；每次计算都使用 `number`\
    \ 的值。\n\n```cpp\ndo {\n    cout << \"\\请输入一个数字: \" << endl;\n    cin>>number;\n\
    \    sum += number;\n```\n\n# 步骤 10\n\ndo... while 循环的主要优点是它是“退出条件循环”；如果你的代码需要至少执行一次循环（例如，检查游戏中的生命值），那么\
    \ do... while 循环是完美的。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    int a = 10;\ndo {\n    cout << a << endl;\n    a -= 1;\n} while\
