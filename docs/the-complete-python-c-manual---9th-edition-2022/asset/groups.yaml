    \ C++ 文件了。\n- 步骤 10：aout 文件是编译后的 C++ 代码。运行可执行文件：`./a` 并按回车。屏幕上会出现 \"Hello World\"\
    。然而，aout 并不友好。要对其重命名，你可以重新编译：`g++ helloworld.cpp -o helloworld`。这创建一个可以通过 `./helloworld`\
    \ 运行的输出文件。\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_91_0.png)\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_91_1.png)\n\
