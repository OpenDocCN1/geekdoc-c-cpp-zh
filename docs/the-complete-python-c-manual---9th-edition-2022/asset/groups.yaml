    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_102_3.png)\n\n# Using Comments\n\n\
    While comments may seem like a minor element to the lines of code that combine\
    \ to make a game, application or even an entire operating system, in fact that\
    \ they're probably one of the most important factors.\n\n## THE IMPORTANCE OF\
    \ COMMENTING\n\nComments inside code are basically human readable descriptions\
    \ that detail what the code is doing at that particular point. They don't seem\
    \ important but without comments is one of the frustrating areas of programming,\
    \ whether you're a professional or just starting out.\n\nIn short, code should\
    \ be commented in such a manner as to effectively describe the purpose of a line,\
    \ section, or individual elements. You should get into the habit of commenting\
    \ as much as possible so that someone who doesn't know anything about programming\
    \ can pick your code and understand what it's going to do by simply reading it.\n\
    \nIn a professional environment, comments are vital to the success of the code\
    \ and ultimately. In an organization, many programmers work in teams alongside\
    \ engineers, developers, analysts and so. If you're a part of the team that's\
    \ working on software, your comments can help a team see that something went wrong,\
    \ and another team member may pick up and follow the trail to pinpoint the issue.\n\
    \nPlace yourself in the shoes of someone whose job is to find out in excess of\
    \ 800,000 lines of code, which spread across several different modules. You can\
    \ see the need for a little help from the original programmers in the form of\
    \ a good comment.\n\nThe best comments always coincide and link the code logic,\
    \ detailing what happens when the program hits its line or section. You'll need\
    \ to comment on every line. Something along the lines of if x=0 doesn't require\
    \ you to comment that if x exactly zeros then to do something: that's going to\
    \ be obvious to the reader. However, if equaling zero is something that drastically\
    \ changes the program for the user, such as you're out of lines, then it certainly\
    \ needs comment. Even if you are alone, you should write comments if you are going\
    \ to share with others. This can help you understand what you went wrong. Comments\
    \ are good practice.\n\n- Game reset start\n"
