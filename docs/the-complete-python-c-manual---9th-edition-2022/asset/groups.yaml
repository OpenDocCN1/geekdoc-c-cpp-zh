  mdcn: "\n\n# 初学者 Python 错误\n\nPython 是一种相对容易学习的语言，初学者有足够的空间来找到自己。然而，与其他任何其他编程语言一样，很容易犯会导致代码无法运行的常见错误。\n\
    \n## 定义 初学者(错误) = 10\n\n这里是大多数初学者发现自己会犯的十个 Python 错误。能够识别这些错误将为你以后以后省去很多麻烦。\n\n\
    ## 版本\n\n为了增加大多数初学者在接触编程时本就面临的困惑，Python 提供了两个活跃版本供下载和使用。有 Python 2.7 和 Python\
    \ 3.6.x。3.6.x 是最新版本，也是我们建议从它开始的版本。但是，2.7 与 3.6 的代码不兼容，反之亦然。\n\n## 缩进、制表符和空格\n\n\
    Python 在显示代码时使用精确的缩进。缩进意味着该部分的代码是上一个语句的一部分，而不是与代码的其他部分关联。使用四个空格来创建缩进，而不是制表符（tab）。\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_139_0.png)\n\n## 互联网\n\n每个程序员都会去互联网复制一些代码并插入到自己的程序中。使用他人的代码并没有错；但在你的计算机上运行它之前，你需要知道代码是如何工作的以及它的作用是什么。\n\
    \n## 注释\n\n再次强调。这是编程中的一个巨大因素，即使你是唯一查看代码的人，你也需要对正在发生的情况添加注释。当此函数失败时，写下解释原因的注释，它可以帮助你记住发生了什么。\n\
    \n```\n在程序中创建/删除 .txt 文件\n```\n\n```python\n# 我有一条注释来从列表中获取值。我可以删除它，取决于我想要的\n\
    # 列表的值。\n\n# 我的问题是删除代码，如果该语句创建了一个列表，那么调用 list\n# 来删除：此文件，如果它存在。\n\n# 在发生的情况下，我想删除该文件。如果它存在，\n\
    # 强烈建议这样做。\n```\n\n```python\nimport os\n\ndef delete_file(filename):\n    if\
