    # 字符串的分割与合并


    在 Python 中处理数据时，特别是来自用户的输入，无疑会遇到字符串。一项非常有用的技能是分割长字符串以提高可读性。还有适用于字符串的函数。


    - 步骤 1 字符串函数的主要工具是 `.split()`。根据参数分割字符串。例如，这里有一个三个三个字符串，每个由空格分隔：


    - 步骤 3 注意 `text.split()` 有括号，后面跟着引号。空格是分隔符，表示每个列表项由空格分隔。同样，逗号分隔的值由逗号分隔，你会使用：


    text="January,February,April,June"

    months=text.split(",")


    ```

    Python 3.4.2

    Edit Shell Debug Options help

    Python 3.4 (default), Oct 19 2014, 13:31:11

    GCC 4.9.0 on linux

    type("credits" or "license") for more information.

    name="Daniel Hannah".split(",")

    [''Daniel'', ''Hannah'', ''Emma'']

    ```


    - 步骤 2 将字符串转换为列表并准确分割：输入新列表的名称以查看三个项。


    - 步骤 4 你之前见过如何将一个字符串分割为单个字母，使用：


    name="David"


    返回值为 `[''D'', ''a'', ''v'', ''i'', ''d'']`。在通常情况下似乎没用，但对于创建拼写示例可能非常方便。


    ```

    Python 3.4.2

    Edit Shell Debug Options help

    Python 3.4 (default), Oct 19 2014, 13:31:11

    GCC 4.9.0 on linux

    type("credits" or "license") for more information.

    name="David".split()

    [''D'', ''a'', ''v'', ''i'', ''d'']

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_51_0.png)


    # 字符串的分割与合并


    步骤 5 `.split` 函数的反面，你在字符串中会有分开的项并可以将它们全部合并为一个单词或项的组合，取决于你的运行。例如：


    ```

    alphabet="".join(["a", "b", "c", "d", "e"])

    alphabet

    ```


    这将在 shell 中显示 ''abcde''。


    - 步骤 8 就像 `.split` 函数一样，分隔符不必是空格，也可以是逗号、连字符或你喜欢的任何字符：


    ```

    colors=[''Red'', ''Blue'']

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_0.png)


    - 步骤 6 因此你可以将 `.join` 应用你在步骤 4 中创建的分割名称，再次合并字母：


    ```

    name="".join(name)

    ```


    我们将字符串合并回，并保留了最后的列表名称，通过 join 传递了它。


    ```

    Python 3.2 (default), Oct 19 2014, 13:31:11

