- md: "\n# C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash\
    \ '//', or a forward slash and an asterisk, '/*'. You've already seen some brief\
    \ examples but this is how they work.\n\nUsing the Hello World code as an example,\
    \ you can easily comment on different sections of the code using the forward slash:\n\
    \nBe careful when you're commenting, especially with comments. It's very easy\
    \ to forget to add the asterisk and slash to negate any code that falls inside\
    \ the comment block.\n\n```cpp\n// My first C++ program\ncout << \"Hello, world!\\\
    n\";\n\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // My first\
    \ C++ program\n    cout << \"Hello, world!\\n\";\n}\n```\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    cout << \"Hello, world!\\n\";\n    cout\
    \ << \"And greetings from C++\";\n    // cover lines\n    // need to add more\
    \ slashes\n    cout << \"This line is now being ignored by the compiler!\";\n\
    }\n```\n\nHowever, you can add comments to the end of a line of code, to describe\
    \ in a better way what's going on:\n\n```cpp\ncout << \"Hello, world!\\n\"; //\
    \ This line outputs the words 'Hello, world!'. The \\n denotes a new line.\n```\n\
    \nNote, you don't need a semicolon at the end of a comment. This is because it's\
    \ in a line that is ignored by the compiler.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    cout << \"Hello, world!\\n\"; // This\
    \ line outputs Hello, world. The ...\n}\n```\n\nIf you obviously try and add a\
    \ comment, complaining of a missing bracket ']' to finish off the block of code,\
    \ it can take time to go back and rectify. Frankly, the color coding in Code:Blocks\
    \ identifies comments from code:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    cout << \"Hello, world!\\n\";\n    cout << \"And greetings\
    \ from C++\";\n    // This comment\n    // without the need to add more slashes\n\
    \    cout << \"This line is now being ignored by the compiler!\";\n}\n```\n\n\
    You can comment several lines by using the forward and slash:\n\nIf you're writing\
    \ code, it's good practice in C++ to add an asterisk to each new line of the comment\
    \ block. This helps you to remember the comment block before continuing the code:\n\
    \n> /* This comment can cover several lines without the need to add more slashes\
    \ */\n\n> /* This comment can cover several lines without the need to add more\
    \ slashes */\n\nJust remember to finish the comment block with the opposite asterisk\
    \ and slash.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    cout << \"Hello, world!\\n\";\n    cout << \"And greetings from C++\"\
    ;\n    /* This comment can\n       cover several lines\n       without the need\
    \ to add more slashes */ \n}\n```\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    cout << \"Hello, world!\\n\";\n    cout << \"And greetings\
    \ from C++\";\n    cout << \"This line is now being ignored by the compiler!\"\
    ;\n}\n```\n\n# Variables\n\nVariables differ slightly when using C++ as opposed\
    \ to Python. In Python, you can simply state that 'a' equals 10 and a variable\
    \ is assigned. However, in C++ a variable is to be declared with its type before\
    \ it can be used.\n\n# THE DECLARATION OF VARIABLES\n\nYou can declare a C++ variable\
    \ by using statements in the code. There are several distinct types of variables\
    \ you can declare. Here is how it works.\n\n### STEP 1\nOpen up a new, blank C++\
