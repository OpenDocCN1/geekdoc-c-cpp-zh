  mdcn: "\n\n# do... While 循环\n\ndo... while 循环与 for 循环甚至 while 循环略有不同。`for` 和 `while`\
    \ 都会在循环开始时（或者如果你愿意，在循环的顶部）设置并检查条件。然而，do... while 循环类似于 `while` 循环，但它在循环的底部检查条件。\n\
    \n# DO 循环\n\ndo... while 循环的优点是它能保证至少运行一次。它的结构是：`do`，后跟语句，`while true`。这是它的工作原理。\n\
    \n- 步骤 1 从空白的 C++ 文件开始并输入标准头文件：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main () {\n}\n```\n\n- 步骤 2 从一个简单的数字计数开始：\n\n```cpp\n{\nint num\
    \ = 1;\ndo{\n\tcout << \"Number: \" << num << endl;\n\tnum += 1;\n} while (num\
    \ < 30);\n\nreturn 0;\n}\n```\n\n- 步骤 3 现在让我们来看 do... while 循环的结构。首先，你创建一个名为 `num`\
    \ 的整数，值为 1。现在开始 do... while。循环体内部的代码将至少执行一次，然后检查条件为真还是为假。\n\n```cpp\n// 创建一个值为\
    \ 1 的整数\nint num = 1;\n// do... while 开始\n{\n#include <iostream>\nusing namespace\
    \ std;\nint main () {\n\tcout << \"Number: \" << num << endl; // 显示 num 的当前值\n\
    \tnum += 1; // 增加 num 的值\n} while (num < 30); // 测试条件（真或假）\n```\n\n- 步骤 4 如果条件为真，则执行循环。它会一直持续直到条件为假。当条件为假时，循环终止，继续继续。这意味着你可以创建一个循环，直到用户输入某个字符为止。\n\
    \n```cpp\n// 使用 <iostream>\nint main() {\n\tint num = 10;\ndo{\n\tcout << \"Number:\
    \ \" << num << endl; // 显示 num 的当前值\n\tnum += 1; // 增加 num 的值\n} while (num <\
    \ 20); // 测试条件（真或假）\n\nreturn 0;\n}\n// 输出返回 (10) 执行时间: 0.001s\n按任意键继续\n```\n\n\
    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_129_0.png)\n\n# 步骤 5\n\n如果你想累加用户输入的数字，直到用户输入零：\n\
