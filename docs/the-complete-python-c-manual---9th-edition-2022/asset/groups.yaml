    \ or in a file, for most cases compilers will error due to missing quotes in the\
    \ code.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_142_0.png)\n\n# INITIALISE\
    \ VARIABLES\n\nIn C++ variables are initialized to zero by default. This means\
    \ if you create a variable x then, it is given a random number from 0 to 18,446,744,073,709,551,616,\
    \ because it is difficult to include in an equation. When creating a variable,\
    \ give it\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_142_1.png)\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int x;\n    cout << x;\n\
    }\n```\n\n# EXTRA SEMICOLON\n\nWhile it is necessary to have semicolon at the\
    \ end of every C++ line, there are some exceptions to the rule. Semicolons needs\
    \ to be at the end of every complete statement but some lines of code aren't statements.\n\
    \n# #include\nif lines\nswitch switches\n\nIf it confuses you, the compiler lets\
    \ you know where you went wrong.\n\n# A.OUT\n\nA common mistake when compiling\
    \ in Linux is forgetting to name your C++ code properly. When you compile from\
    \ the Terminal, you\n\n```\n// Program to print positive number entered by the\
    \ user\n// only if it is positive\n#include <iostream>\nint main() {\n    int\
    \ x;\n    cout << \"Enter an integer: \";\n    cin >> x;\n    // checks if the\
    \ number is positive\n    if (x > 0) {\n        cout << x << \" entered a positive\
    \ integer:\" << endl;\n    }\n    cout << \"this statement is always executed.\"\
    ;\n    return 0;\n}\n```\n\n```\ng++ code.cpp\n```\n\nThis compiles the code in\
    \ the file code.cpp and creates an out file that can be executed with ./a.out.\
    \ If you already have code in a.out then it will overwrite.\n\n```\ng++ code.cpp\
    \ -o nameofprogram\n```\n\n```\nFile Edit View Search Terminal Help\ndavid-mint-date\
    \ ~/Documents g++ test1.cpp -o printer\ndavid-mint-date ~/Documents g++ test1.cpp\
    \ /a.out\ndavid-mint-date ~/Documents g++ test1.cpp /printer\ndavid-mint-date\
    \ ~/Documents $\n```\n\nwww.bdpublications.com 143"
