    name suggests their value remain throughout the entire code. There are two separate
    ways to define a constant in C++, the #define pre-processor and const.


    #DEFINE

    The pre-processors are instructions to the compiler to pre-process the information
    before it goes ahead and compiles the code. #Include is a pre-processor as is
    #Define.


