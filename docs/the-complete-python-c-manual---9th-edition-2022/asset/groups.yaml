    Setting up python3-version (3.5.2-3ubuntu3)amd64]\nSetting up python3-version\
    \ (3.5.2-3ubuntu3)amd64]\n```\n\n### STEP 5 However, if you want the latest version,\
    \ 3.6.2 as the Python website at the time of writing, you need to build from source.\
    \ Start by entering these commands in the Terminal:\n```\nsudo apt-get install\
    \ build-essential\nsudo apt-get install libreadline-dev libssl1-dev libncursesw5-dev\
    \ libsqlite3-tk-dev libdbm6-dev libbz2-dev\n```\nimg/8b33dbf2a2ef620c5ea6844ae78b2983_18_0.png)\n\
    \n### STEP 6 Open your Linux browser and go to the Python page: www.python.org/\n\
    \n### STEP 7 In the Terminal, go to the contents of the downloaded folder. Then\
    \ unpack the source code with: `tar -xvf Python-3.6.2.tar.xz` Now enter the new\
    \ binary with `cd Python-3.6.2/`\n\n### STEP 8 Within the Python folder, enter:\n\
    ```\n./configure\nmake\nsudo make install\n```\nThis could take a while depending\
    \ on the size of your computer. Once finished, `python3.6 --version` to check\
    \ the installed version.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_18_1.png)\n\
    \n### STEP 9 For the GUI IDE, you will need to enter the command into the Terminal:\n\
    ```\nsudo apt-get install idle3\n```\nThe IDE can be started with the command:\
    \ `idle3`. Note that idle runs different version from the one you installed from\
    \ source.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_18_2.png)\n\n### STEP 10\
    \ You also need pip (Pip Install Packages) which is a help to you install more\
    \ modules and extras.\n```\nsudo apt-install python3-pip\n```\npip is installed;\
    \ check for the update with: Complete, the Python 3.X will be available via the\
    \ Programming Script in your distro's demo.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_18_3.png)\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_18_4.png)\n\n# Getting Started with\
    \ Python\n\nGetting started with Python may seem a little daunting at first but\
    \ the language has been designed with simplicity in mind. Like most things, you\
    \ need to start slowly, learn how to get a result and how to get what you want\
    \ from the code.\n\nIn this section, we cover variables, numbers and expressions,\
    \ user input, conditions and loops; and the types of errors you may come across\
    \ in your time with Python.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_20_0.png)\n\
    \n| Page | Topic |\n|---|---|\n| 22 | Starting Python for the First Time |\n|\
    \ 24 | Your First Code |\n| 26 | Saving and Executing Your Code |\n| 28 | Executing\
    \ Code from the Command Line |\n| 30 | Numbers and Expressions |\n| 32 | Using\
    \ Comments |\n| 34 | Working with Variables |\n| 36 | User Input |\n| 38 | Creating\
    \ Functions |\n| 40 | Conditions and Loops |\n| 42 | Python Modules |\n\n# Starting\
    \ Python for the First Time\n\nWe're going to be using the Raspberry Pi as our\
    \ Python 3 hardware platform. The latest version of Raspian comes preinstalled\
    \ with Python 3, version 3.4.2 to be exact, so long as you have a version 3 Shell,\
    \ all our code will work.\n\n# STARTING PYTHON\n\nWe're not going to go into the\
    \ details of getting the Raspberry Pi up and running, there's plenty of material\
    \ available on that subject. However, once you're ready, fire up your Pi and get\
    \ ready for coding.\n\nSTEP 1 With the Raspberry desktop loaded, click on the\
    \ Menu button followed by Programming > Python 3 IDLE. This opens the Python 3\
    \ Shell. Windows and Mac users find the Python 3 IDLE Shell from the Windows Start\
    \ menu and Finder.\n\nSTEP 3 For example, in the Shell enter: `2+2` after pressing\
    \ Enter, the next line displays the answer: 4. Basically, Python has taken the\
    \ 'code' and produced the relevant output.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_21_0.png)\n\
    \nThe Shell where you can enter code and see the responses and output of code\
    \ you've programmed into. It is a sandbox, where you're able to try out some simple\
    \ code and projects.\n\nSTEP 4 The Python Shell acts very much like a calculator,\
    \ since code is based a series of mathematical interactions with them. Integers,\
    \ which are the infinite sequence of numbers can be easily added, subtracted,\
    \ multiplied and so on.\n"
