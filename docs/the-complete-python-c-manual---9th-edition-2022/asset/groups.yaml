    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_51_0.png)


    # Splitting and Joining Strings


    STEP 5 The opposite of .split function, where you will have separate items in
    a string and can join them all to a word or just a combination of items, depending
    on your running. For instance:


    ```

    alphabet="".join(["a", "b", "c", "d", "e"])

    alphabet

    ```


    This will display ''abcde'' in the shell.


    - STEP 8 As with the .split function, the separator doesn''t have to be a space,
    it can also be a comma, a hyphen or whatever you like:


    ```

    colors=[''Red'', ''Blue'']

    ```


