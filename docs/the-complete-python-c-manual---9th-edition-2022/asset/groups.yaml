    Initially, C++ was called C with Classes, which added features to the popular
    C programming language, making it a more user-friendly environment through a new
    structure. | The structure of a C++ program is quite precise. Every C++ code begins
    with a directive: **#include**. The pre-processor includes a section of the standard
    C++ code. For example: **#include <iostream>** includes theostream header to support
    input/output operations. | 1 #include <iostream> |

