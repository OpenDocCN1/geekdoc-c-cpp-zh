    code-portal and log in\nto get access!\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_4_0.png)\n\
    \n# C++ Fundamentals\n- 98 Your First C++ Program\n- 100 Structure of a C++ Program\n\
    - 102 Compile and Execute\n- 104 Using Comments\n- 106 Variables\n- 108 Data Types\n\
    - 110 Strings\n- 112 C++ Maths\n\n## Loops and Decision Making\n- 126 While Loop\n\
    - 128 For Loop\n- 130 Do... While Loop\n- 132 If Statement\n- 134 If... Else Statement\n\
    \n## Working with Code\n## C++ Input/Output\n- 116 User Interaction\n- 118 Character\
    \ Literals\n- 120 Defining Constants\n- 122 File Input/Output\n- 138 Common Coding\
    \ Mistakes\n- 140 Beginner Python Mistakes\n- 142 Beginner C++ Mistakes\n- 144\
    \ Where Next?\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_4_1.png)\n\nLearn to\
    \ Code\nLearn Variables, Tables, Get Started!\nLearn Arrays, Loops, Get Started!\n\
    Learn Functions, Get Started!\nwww.bdmpublications.com 5\n\n# Say Hello to Python\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_6_0.png)\n\nThere are many different\
    \ programming languages available to learn and use. Some are complex and incredibly\
    \ powerful and some are extremely basic and used as minor utilities for operating\
    \ systems. Python sits somewhere in the middle, combining ease of use with a generous\
    \ helping of power that allows the user to create minor utilities of games and\
    \ performance-heavy tasks.\n\nHowever, there's more to Python than simply being\
    \ another language. It has a vibrant and lively community behind it shares knowledge,\
    \ code and project ideas; as well as bug fixes for future releases. It's thanks\
    \ to this community that the language has grown and thrived and now it's your\
    \ turn to take the plunge and learn how to program in Python.\n\nThe first half\
    \ of this book helps you get started with the latest version of Python and guides\
    \ you on how to use some of the most common and interesting functions of the language.\
    \ Before long, you will be able to code your own helpful tools, adventures and\
    \ even control around the screen.\n\n| Page | Topic |\n| :--- | :--- |\n| 8 |\
    \ Why Python? |\n| 10 | Equipment You Will Need |\n| 12 | Getting to Know Python\
    \ |\n| 14 | How to Set Up Python in Windows |\n| 16 | How to Set Up Python on\
    \ a Mac |\n| 18 | How to Set Up Python in Linux |\n\n# Why Python?\n\nThere are\
    \ many different programming languages available for the modern computer, and\
    \ some still available for mobile platforms. Some of these languages are designed\
    \ for scientific work, others for such. So why choose Python of the rest?\n\n\
    # PYTHON POWER\n\nSince the home computers were available, enthusiasts and professionals\
    \ have toiled until the weeks, lasting over heap of circuitry to create something\
    \ akin to magic. These pioneers carved their way into a new frontier, forging\
    \ small routines that enabled ultra-high definition graphics and open world gaming.\
    \ Regardless of whether you use Android device, iOS device, PC, Mac, SmartTV,\
    \ game console, GPS built-in set-top box or another appliance, naturally these\
    \ kids formed the foundations for every piece of digital technology we use today.\
    \ Some went to become chief developers for software companies, others pushed the\
    \ hardware to its limits and Python continues to amaze us.\n\nThe languages used\
    \ today differ depending on the situation, and how the device will interact with.\
    \ C++ is usually reserved for complex programs, operating systems, and so on.\n\
    \n# Why Python?\n\nOperating systems, such as Windows and C#, and assembly of\
    \ visual-based language. Python was created years ago and has evolved to become\
    \ an ideal beginner's language for learning to program a computer. It's perfect\
    \ for the hobbyist, student, teacher and those who simply need to create their\
    \ own interaction between themselves or for external hardware itself.\n\nMore-purpose\
    \ programming is used to create programs, apps or whatever you want to call. They\
    \ are widely used across all platforms and virtually conceivable application.\
    \ Some operate faster than others and are easier to learn and use than others.\
    \ Python is one general-purpose language. Python is free to download, install\
    \ and is available for Linux, Windows, macOS, MS-OS, IBM-series machines has been\
    \ voted one of the top languages in the world and is continually evolving ahead\
    \ of the hardware and internet development curve.\n\nPython is known as a High-Level\
    \ Language, which uses arrays, objects, attributes, subroutines, and countless\
    \ more. It is not as streamlined as a Low-Level Language, which can deal directly\
    \ with memory addresses, calls and registers, but it is universally accessible\
    \ and easy to learn.\n\nTo answer the question: why python? Simply put, it's free\
    \ to learn, exceptionally powerful, universally accepted, and effective a superb\
    \ learning and educational tool.\n\n```java\n// First Invoke\nimport java.lang.reflect.*;\n\
    class Invoke {\n    public static void main(String[] args) {\n        Class c\
    \ = Class.forName(args[0]);\n        Method m = c.getMethod(args[1], new Class[]);\n\
    \        Object obj = m.invoke(null, null);\n        System.out.println(\"Invoked\
    \ method: \" + args[1]);\n    } catch (ClassNotFoundException e) {\n        System.out.println(\"\
    No class found\");\n    } catch (NoSuchMethodException e) {\n        System.out.println(\"\
    Method not found\");\n    } catch (IllegalAccessException e) {\n        System.out.println(\"\
    Illegal permission to invoke method\");\n    } catch (InvocationTargetException\
    \ e) {\n        System.out.println(\"Error occurred while invoking: \" + e.getCause());\n\
    \    }\n}\n```\n\n```basic\n40 LET PY=15\n70 FOR W=1 TO 10\n70 LET BY=W+(RND*28)\n\
    80 GET BY\n90 FOR D=1 TO 20: NEXT D\n110 PRINT PY,BY, \"  U\"\n120 PRINT PY,BY,\
    \ \"  Y\"\n130 IF INKEY=0 THEN PY=Y\n140 FOR I=1 TO 100: NEXT I\n150 IF PY=7 THEN\
    \ PY=27\n160 LET BX=BY-1\n200 LET S=S+1\n210 PRINT AT,10,0, \"score=\";S\n220\
    \ FOR V=1 TO 1000: NEXT V\n```\n\nJava is a powerful language that's used in web\
    \ pages, set-boxes, TVs and even cases.\n\nBASIC was such a language that started\
    \ early for 8-bit computer users.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_8_0.png)\n\
    \n```java\nvoid main(String[] args) {\n    String input = args[0];\n    if (input\
    \ == null) {\n        System.out.println(\"Please enter a letter\");\n    } else\
    \ if (input.length() > 1) {\n        System.out.println(\"Input is more than one\
    \ letter\");\n    }\n}\n```\n"
