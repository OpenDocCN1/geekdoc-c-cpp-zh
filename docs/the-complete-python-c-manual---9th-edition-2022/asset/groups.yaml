    \n## 提前计划\n\n虽然在一个早晨决定编写一个经典的文本冒险游戏很棒，但如果没有良好的计划，这并不总是可行的。\n\n## 用户错误\n\n用户输入通常是代码中的一个瘫痪错误。例如，用户本应该输入年龄数字，却输入了字母。通常用户可能会输入导致内部缓冲区溢出的内容，从而导致代码崩溃。观察这些用户输入并清楚地说明需要他们什么。\n\
