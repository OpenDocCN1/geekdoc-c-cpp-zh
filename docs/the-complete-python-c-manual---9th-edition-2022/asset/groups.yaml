    - STEP 9 There''s some interesting functions you apply to a string, such as .capitalize
    and .title().


    ```

    title="con the commerian"

    title.capitalize()

    title.title()

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_2.png)


