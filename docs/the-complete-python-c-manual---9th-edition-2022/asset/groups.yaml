  mdcn: "\n\n# 循环与决策\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_123_0.png)\n\n循环和重复是任何编程语言中最重要的因素之一。很好地使用循环可以使程序完全按照你的意图运行，并在没有问题或错误的情况下交付预期的结果。\n\
    \n代码中没有循环和决策事件，你的程序将无法为用户提供任何选择。正是这种对选择的理解提升了你作为程序员的技能，并写出更好的代码。\n\n| 126 | While\
