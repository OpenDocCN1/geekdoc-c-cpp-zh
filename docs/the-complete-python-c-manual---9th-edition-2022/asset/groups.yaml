    # Splitting and Joining Strings


    When dealing with data in Python, especially from a user''s input, you will undoubtedly
    come across sets of strings. A useful skill to learn in programming is being able
    to split those long strings for better readability. There are also functions that
    can be applied to strings.


    - STEP 1 The main tool in the string function is .split(). With it''re able to
    split a string of data, based on the argument. For example, here''s a string with
    three items, each separated by a space:


    - STEP 3 Note that text.split() has the brackets, followed by closing quotes.
    The space is the separator, indicating that each list entry is separated by a
    space. Likewise, (Comma Separated Value) are separated by a comma, so you''d use:


    text="January,February,April,May,June"

    months=text.split(",")


    ```

    Python 3.4.2

    Edit Shell Debug Options windows help

    Python 3.4 (default), Oct 19 2014, 13:31:11

    GCC 4.9.0 on linux

    type("credits" or "license") for more information.

    name="Daniel Hannah Emma".split(",")

    [''Daniel'', ''Hannah'', ''Emma'']

    ```


    - STEP 2 Let''s turn the string into a list and split the content accurately:
    enter the name of the new list, to see the three items.


    - STEP 4 You''ve previously seen how you can split a string into individual letters
    as well, using a name:


    name="David"


    The returned value is [''D'', ''a'', ''v'', ''i'', ''d'']. It may seem useless
    under ordinary circumstances, it could be handy for creating a spelling for example.


    ```

    Python 3.4.2

