    # # OS Module


    The OS module allows you to interact directly with the built-in commands found
    in your operating system. Commands vary depending on the OS you''re running, some
    will work with Windows whereas others will work with Linux and macOS.


    # ## INTO THE SYSTEM


    One of the primary features of the OS module is the ability to list, move, create,
    delete and otherwise interact with files stored on the system, making it the perfect
    module for backup code.


    You can start the OS module with some simple functions to see how it interacts
    with the system environment. If you''re using Linux or the Raspberry Pi, try this:


    ```

    import os

    home=os.getcwd()

    print(home)

    ```


    ```

    Python 3.4.2 (default)

    >>> import os

    >>> home=os.getcwd()

    >>> print(home)

    ''/home/pi''

    ```


    **STEP 3** The Windows output is different as that''s the current working directory
    of Python, and as you might suspect, os.getcwd() function is asking Python to
    retrieve the Current Working Directory. Linux users will see something along the
    same lines as the Raspberry Pi, as will users.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_69_0.png)


    **STEP 2** The returned result from printing the variable home is the current
    user''s folder on the system. In our example that''s /home/pi; it will be depending
    on the user name you log in and the operating system you use. For Windows 10 it
    will output: C:\Program Files (x86)\Python36-32.


    ```

    import os

    browser=os.system("/usr/bin/chromium-browser")

    ```


    ```

    Python 3.6.2 (default, v3.6.2:533, Jul 8 2017, 04:19:34) [MSC v.1919 64 bit (Intel)]
    Windows

    >>> type("copyright","credit" or "license") for more information.

    ''str''

    >>> import os

    >>> home=os.getcwd()

    >>> print(home)

    C:\Program Files (x86)\Python36-32

    ```


    **STEP 4** Yet another interesting element to the OS module, is its ability to
    launch programs that are installed in the system host. For instance, if you wanted
    to launch the browser from within a program you can use the command:


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_69_1.png)'
