    | 134 | If... Else 语句 |\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_124_0.png)\n\
    \n## While 循环\n\nwhile 循环的作用是在特定条件为真时重复执行语句或一组语句。当 while 循环开始时，它会通过测试循环条件和内部的语句来初始化自己，然后再执行循环的其余部分。\n\
    \n## 是真还是假？\n\nwhile 循环是 C++ 代码循环中最流行的形式之一。当条件为真时，它们会反复运行循环内部包含的代码。一旦证明为假，代码将恢复正常运行。\n\
    \n- **步骤 1** 清理你目前做的内容并创建一个新的 C++ 文件。通常不需要任何额外的头文件：\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n\n}\n```\n\n- **步骤 3** 首先你需要创建一个条件，使用一个名为\
    \ `num` 的变量，现在创建 while 循环，规定只要 `num` 小于 30，循环就为真。显示 `num` 的值并加 1，直到它超过 30。\n\n\
    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_125_0.png)\n\n- **步骤 2** 创建一个简单的 while\
    \ 循环。输入下面的代码，并编译和运行（我们在屏幕上添加了注释）：\n\n```\nint num = 1;\n\nwhile (num < 30) {\n\
    \    cout << \"Number: \" << num << endl;\n    num = num + 1;\n}\n\nreturn 0;\n\
    ```\n\n我们正在引入一些新元素。首先是 while 循环的左括号和右括号。因为这个循环是一个复合语句，意味着一组语句；还要注意，while 循环后面没有分号。你还有一个\
    \ `return 0`，这是结束代码的一种简洁且完美的方式。\n\n```\nint num = 1; // 创建条件\nwhile (num < 30)\
    \ // 只要 num 小于 30，条件就为真\n{\n    cout << \"Number: \" << num << endl; // 显示 num\
    \ 的值\n    num = num + 1;\n}\n\nreturn 0; // 关闭循环并结束程序\n```\n\n- **步骤 5** 如果你不需要看到\
    \ `num` 持续增加的值，你可以不用复合语句，而是直接对 `num` 自增，然后显示该值：\n\n```cpp\nint num = 1;\nwhile\
    \ (num < 30) {\n    num++;\n    cout << \"Number: \" << num << endl;\n}\nreturn\
    \ 0;\n```\n\n126 www.bdmpublications.com\n\n## 步骤 6\n\n记住不要在语句末尾添加分号很重要。为什么呢？因为分号代表了\
    \ C++ 代码行的结束。如果你在语句末尾放置分号，你的循环将永久卡死，直到你关闭程序。\n\n| line | while_loop.cpp |\n|---|---|\n\
    | 1 | #include <iostream> |\n| 2 | #include <windows.h> |\n| 3 | using namespace\
    \ std; |\n| 4 | |\n| 5 | int num = 0; |\n| 6 | |\n| 7 | while (num < 30) { |\n\
    | 8 | cout << \"Number: \" << num << endl; |\n| 9 | num++; |\n| 10 | } |\n| 11\
    \ | | |\n| 12 | return 0; |\n\n## 步骤 7\n\n在示例中，如果我们执行代码，`num` 的值将是 1，由 while 语句设置。当代码遇到该语句时，它读取条件\
    \ 1 小于 30 为真，循环。分号关闭了它，所以循环重复，但永远不会给 `num` 加 1，因为它没有继续通过复合语句。\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_126_0.png)\n\
    \n## 步骤 8\n\n你可以操作 while 语句，根据循环行显示不同的结果。为了逐字读取，如下：\n\n```cpp\n#include <iostream>\n\
    #include <fstream>\nusing namespace std;\nint main()\n```\n\n```cpp\nstring word;\n\
    fstream file(\"C:\\\\users\\\\immeria.txt\");\n\ncout << \"Cimmeria, by Howard:\
    \ \\n\" << endl;\nwhile (file >> word) {\n    cout << word << endl;\n}\n```\n\n\
    ## 步骤 9\n\n进一步扩展代码，以使每个词每秒出现一次。为了这样做，在一个新的循环中使用 `<windows.h>`。只有当你可以使用 `Sleep()`\
