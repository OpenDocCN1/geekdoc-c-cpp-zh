    \ Comments\n- 34 Working with Variables\n- 36 User Input\n- 38 Creating Functions\n\
    - 40 Conditions and Loops\n- 42 Python Modules\n\n## 66 Using Modules\n- 68 Calendar\
    \ Module\n- 70 OS Module\n- 72 Random Module\n- 74 Tkinter Module\n- 76 Pygame\
    \ Module\n- 80 Create Your Own Modules\n\n## 86 Say Hello to C++\n- 84 Why C++?\n\
    - 86 Equipment Needed\n- 88 How to Set Up C++ in Windows\n- 90 How to Set Up C++\
    \ on a Mac\n- 92 How to Set Up C++ in Linux\n- 94 Other C++ IDEs to Install\n\n\
    ## 44 Working with Data\n- 46 Lists\n- 48 Tuples\n- 50 Dictionaries\n- 52 Splitting\
