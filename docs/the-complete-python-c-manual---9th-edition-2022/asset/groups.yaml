- md: "\n# Do... While Loop\n\nA do... while loop differs slightly from a for or even\
    \ a while loop. Both for and while set and examine the condition at the start\
    \ of the loop, or the top of the loop if you prefer. However, a do... while loop\
    \ is similar to a while loop but instead checks the condition at the bottom of\
    \ the loop.\n\n# DO LOOPS\n\nThe good thing about do... while loop is that it's\
    \ guaranteed to run through at least once. its structure is: do, followed by statements,\
    \ while true. This is how it works.\n\n- STEP 1 Begin with a blank, C++ file and\
    \ enter the standard headers:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main () {\n\n}\n```\n\n- STEP 2 Begin with a simple number count:\n\
    \n```cpp\n{\nint num = 1;\ndo{\n\tcout << \"Number: \" << num << endl;\n\tnum\
    \ += 1;\n} while (num < 30);\n\nreturn 0;\n}\n```\n\n- STEP 3 Now, here's a look\
    \ at the structure of a do... while loop. First you create an integer called num,\
    \ with the value of 1. Now the do... while begins. The code inside the body of\
    \ the loop is executed at least once, then the condition is checked for true or\
    \ false.\n\n```cpp\n// Create integer with the value of 1\nint num = 1;\n// do...\
    \ while begins\n{\n#include <iostream>\nusing namespace std;\nint main () {\n\t\
    cout << \"Number: \" << num << endl; // Display the current value of num\n\tnum\
    \ += 1; // Increment value of num\n} while (num < 30); // Test the condition (true\
    \ or false)\n```\n\n- STEP 4 If the condition is true, the loop is executed. It\
    \ continues until the condition is false. When false, the loop terminates and\
    \ the code continues. This means you can create a loop that works until the user\
    \ enters a certain character.\n\n```cpp\n// using <iostream>\nint main() {\n\t\
    int num = 10;\ndo{\n\tcout << \"Number: \" << num << endl; // Display the current\
    \ value of num\n\tnum += 1; // Increment value of num\n} while (num < 20); //\
