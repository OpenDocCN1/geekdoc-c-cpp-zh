    \ 创建自己的模块\n\n## 86 你好 C++\n- 84 为什么选择 C++？\n- 86 需要的设备\n- 88 如何在 Windows 中设置 C++\n\
    - 90 如何在 Mac 上设置 C++\n- 92 如何在 Linux 中设置 C++\n- 94 其他可选的 C++ IDE\n\n## 44 数据处理\n\
    - 46 列表\n- 48 元组\n- 50 字典\n- 52 字符串拆分与合并\n- 54 字符串格式化\n\n# BDM 代码门户\n60+ 个 Python\
    \ 程序\n21,500+ 行代码\n借助我们精彩的《代码》系列书籍掌握 Python。包含游戏、工具等代码。\n访问 www.bdmpublications.com/\n\
    code-portal 并登录以访问！\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_4_0.png)\n\n#\
    \ C++ 基础\n- 98 你的第一个 C++ 程序\n- 100 C++ 程序的结构\n- 102 编译与执行\n- 104 使用注释\n- 106 变量\n\
    - 108 数据类型\n- 110 字符串\n- 112 C++ 数学\n\n## 循环与决策\n- 126 While 循环\n- 128 For 循环\n\
    - 130 Do...While 循环\n- 132 If 语句\n- 134 If...Else 语句\n\n## 代码操作\n## C++ 输入输出\n\
    - 116 用户交互\n- 118 字符字量\n- 120 定义常量\n- 122 输入/输出\n- 138 常见错误\n- 140 Python 错误\n\
    - 142 C++ 错误\n- 144 下一步去哪里？![](img/8b33dbf2a2ef620c5ea6844ae78b2983_4_1.png)\n\
    \n学习编码\n学习变量，入门！\n学习数组，循环，入门！\n学习函数，入门！\nwww.bdmpublications.com 5\n\n# 你好 Python\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_6_0.png)\n\n有很多不同的编程语言可以学习和使用。有些复杂且强大，有些则非常基础并用于操作系统。Python\
    \ 处于两者之间，兼顾了易用性和强大的功能，允许用户创建游戏和性能密集型任务。\n然而，Python 的意义不仅仅是另一种语言。它背后有一个充满活力的社区分享着知识、代码和创意；以及针对未来版本的错误修复。这本书的第一部分帮助你上手最新版本的\
    \ Python，并指导你如何使用一些常用且有趣的函数。不久，你将能够编写自己的工具、冒险，甚至控制屏幕。\n\n| 页码 | 主题 |\n| :--- |\
    \ :--- |\n| 8 | 为什么选择 Python？ |\n| 10 | 你需要的设备 |\n| 12 | 认识 Python |\n| 14 | 如何在\
    \ Windows 中设置 Python |\n| 16 | 如何在 Mac 上设置 Python |\n| 18 | 如何在 Linux 中设置 Python\
    \ |\n\n# 为什么选择 Python？\n\n现代计算机有很多不同的编程语言，有些仍然适用于移动平台。这些语言中有些是为了科学工作设计的，有些也是如此。那么为什么选择\
    \ Python 呢？\n\n# Python 的力量\n\n自从家用计算机出现，爱好者和专业人士已经努力了数周，跨越了无数电路来创造类似魔法的东西。这些先驱开辟了新的领域，编写了实现超高清图形和开放世界游戏的程序。无论你使用的是\
    \ Android 设备、iOS 设备、PC、Mac、智能电视、游戏机、内置 GPS 的顶盒或其他设备，这些孩子构成了我们今天使用的所有数字技术的基础。有些人成为了软件公司的首席开发人员，另一些则将硬件推向极限，而\
    \ Python 继续让我们惊叹。\n\n今天使用的语言取决于情况以及设备如何交互。C++ 通常留给复杂的程序、操作系统等。\n\n# 为什么选择 Python？\n\
    \n操作系统（如 Windows 和 C#）以及汇编语言。Python 诞生于许多年前，已经演变成学习编程的理想初学者语言。它对于爱好者、学生、老师以及那些只需要在自己与外部硬件之间创建交互的人来说非常完美。\n\
    \n通用编程用于创建程序、应用程序或你想要调用的任何内容。它们被广泛应用于所有平台和可以想象的应用。有些运行比其他的更快，有些比其他的更容易学习和使用。Python\
    \ 是一种通用语言。Python 免费下载、安装，并适用于 Linux、Windows、macOS、MS-OS。IBM 系列机器已被票选为世界顶级语言之一，并一直领先于硬件和互联网的发展曲线。\n\
    \nPython 被称为高级语言，它使用数组、对象、属性、子程序等无数特性。它不像可以直接处理内存地址、调用和寄存器的低级语言那样精简，但它是随处可用且易于学习的。\n\
    \n回答这个问题：为什么选择 Python？简单来说，它是免费的、极其强大的、被广泛接受的，并且是一个卓越的学习和教育工具。\n\n```java\n//\
    \ 第一次调用\nimport java.lang.reflect.*;\nclass Invoke {\n    public static void main(String[]\
    \ args) {\n        try {\n            Class c = Class.forName(args[0]);\n    \
    \        Method m = c.getMethod(args[1], new Class[]);\n            Object obj\
    \ = m.invoke(null, null);\n            System.out.println(\"Invoked method: \"\
    \ + args[1]);\n        } catch (ClassNotFoundException e) {\n            System.out.println(\"\
    未找到类\");\n        } catch (NoSuchMethodException e) {\n            System.out.println(\"\
    未找到方法\");\n        } catch (IllegalAccessException e) {\n            System.out.println(\"\
    没有调用权限\");\n        } catch (InvocationTargetException e) {\n            System.out.println(\"\
    调用时发生错误: \" + e.getCause());\n        }\n    }\n}\n```\n\n```basic\n40 LET PY=15\n\
    70 FOR W=1 TO 10\n70 LET BY=W+(RND*28)\n80 GET BY\n90 FOR D=1 TO 20: NEXT D\n\
    110 PRINT PY,BY, \"  U\"\n120 PRINT PY,BY, \"  Y\"\n130 IF INKEY=0 THEN PY=Y\n\
    140 FOR I=1 TO 100: NEXT I\n150 IF PY=7 THEN PY=27\n160 LET BX=BY-1\n200 LET S=S+1\n\
    210 PRINT AT,10,0, \"score=\";S\n220 FOR V=1 TO 1000: NEXT V\n```\n\nJava 是一种用于网页、机顶盒、电视甚至案例的强大语言。\n\
    \nBASIC 是一种早为 8 位计算机用户设计的早期语言。\n\n```java\nvoid main(String[] args) {\n    String\
    \ input = args[0];\n    if (input == null) {\n        System.out.println(\"请输入一个字母\"\
    );\n    } else if (input.length() > 1) {\n        System.out.println(\"输入多一个字母\"\
    );\n    }\n}\n```\n\n"
