  - "[PAGE 107]\n\n# C++ Fundamentals\n\n# Data Types\n\nVariables, as we've seen,\
    \ store information that the programmer can later call up, and manipulate if needed.\
    \ Variables are simply memory locations that store the values the programmer assigns,\
    \ depending on the data type used.\n\nThere are many different data types available\
    \ for the programmer in C++, such as integer, floating point, Boolean, character\
    \ and so on. It is widely accepted that there are seven basic data types, often\
    \ called Built-in Types; however, you can create your own data types should the\
    \ need arise within your code.\n\nThe seven basic data types are:\n\n| TYPE |\
    \ COMMAND |\n|---|---|n| Integer | Integer |\n| Floating Point | float |\n| Character\
    \ | char |\n| Boolean | bool |\n| Double Floating Point | double |\n| Wide Character\
    \ | wchar_t |\n| No Value | void |\n\nincredibly accurate numbers but those numbers\
    \ are only accurate up to the fifteenth decimal place. There's also the problem\
    \ when displaying numbers: using the cout function, in cout by default outputs\
    \ the first five decimal places. You can combat this by adding a .precision()\
    \ function and adding a value inside the brackets, but then you're limited by\
    \ the accuracy of the double data type. For this code:\n\n```\n#include <iostream>\n\
    using namespace std;\ndouble PI = 3.14159265358979323863;\nint main() {\n    cout\
    \ << PI;\n}\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_107_0.png)\n\nThese\
    \ basic types can also be extended using the following modifiers: Long, Signed\
    \ and Unsigned. Basically the modifiers can expand the minimum and maximum range\
    \ for each data type. For example, the int type has a default range of -2147483648\
    \ to 2147483647, a fair deal, you agree.\n\nNow, if you use one of the modifiers,\
    \ the range changes:\nunsigned int = 0 to 4294967295\nsigned int = -2147483648\
    \ to 2147483647\nshort int = -32768 to 32767\nunsigned short = 0 to 65535\nslong\
    \ int = -9223372036854775808 to 9223372036854775807\nunsigned long = 0 to 18446744073709551615\n\
    long long = 0 to 42949672\n\nNaturally you can get away with using the basic type\
    \ without the modifiers, as there's plenty of range provided with each data type.\
    \ However, it's considered good C++ programming to use the modifiers when possible.\n\
    \nThere are issues when using the modifiers though. Though represents a double-floating\
    \ point value, which you can use for\n\nbuild and run the code as it is only 3.1415,\
    \ respecting cout's limits in this instance.\n\nYou can also code the code using\
