    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_1.png)


    - 步骤 9 有一些应用于字符串的有趣函数，例如 `.capitalize` 和 `.title()`。


    ```

    title="con the commerian"

    title.capitalize()

    title.title()

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_2.png)


    - 步骤 7 当你有一组单词需要组合成句子时，可以使用 `join` 函数：


    ```

    list=["Conan", "raised", "his", "mighty", "sword",

    "and", "struck", "the", "demon"]

    text="".join(list)

    text

    ```


    注意 join 函数前引号之间的空格（步骤 6 的 join 中没有空格）


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_4.png)


    - 步骤 10 你也可以在字符串上使用逻辑运算符，如果你检查字符串是否包含 (''in'' 或 ''not in'') 函数。这些函数允许处理字符序列：


    ```

    message="Have a nice day"

    "nice" in message

    "bad" not in message

    "day" not in message

    "night" in message

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_52_5.png)


    ```

    Python 3.2 (default), Oct 19 2014, 13:31:11

    >>> type="copyright", "credits" or "license" for more information.

    >>> message="Have a nice day"

    >>> "nice" in message

    True

    >>> "bad" not in message

    True

    >>> "day" not in message

    True

    >>> "night" in message

    False

    ```


