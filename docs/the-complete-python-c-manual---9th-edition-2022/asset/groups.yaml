    ```


    ```

    Python 3.4.2 Shell

    File Edit Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    GC 4.9.1 on Windows

    >>> type("", "credits" or "license") for more information.

    >>> print("Hello")

    Hello

    >>> print(2+2)

    4

    >>> a=2

    >>> b=2

    >>> print(a+b)

    4

    ```


    # Your First Code


    - STEP 5 While it''s very interesting, it''s not particularly exciting. Instead,
    try this:


    ```

    print("Hello everyone!")

    ```


    Just like the code you entered in Sublime in Installing a Text Editor of this
    book.


    - STEP 6 This is more like it, since you''ve produced your first bit of code.
    The print command is fairly self-explanatory and it prints. Python 3 requires
    the brackets as many as you like in order to output content to the screen, in
    this case see ''hello everyone''.


    ```

    >>> print("Hello everyone!")

    >>> |

    ```


    - STEP 7 You have noticed the colour coding within Python IDLE. The colours represent
    different elements of code. They are:


    | Black - Data and Variables | Blue - User Functions |

    |---|---|

    | Green - Strings | Red - Comments |

    | Purple - Functions | |

    | Orange - Commands | Error Messages |


    - STEP 8 The Python IDLE is a configurable environment, then you can change like
    the colours are represented, via Options -> Configure IDLE and clicking on the
    Highlighting tab. However, we don''t recommend that, as you won''t be seeing the
    same as our screenshots.


    - STEP 9 Just like most programs available, regardless of your operating system,
    there are numerous. We don''t have room for all here but within the Options ->
    Configure IDLE and the Keys tab, you can see one of the current kinds.


    - STEP 10 The Python IDLE is a powerful interface and it''s actually written in
    Python using all of the Shell. If you want to know the ins and outs of the Shell,
    we recommend you take a few moments to view www.python.org/3/idle.html which details
    many of the IDLE''s features.


    | IDLE Colour Coding |

    | Color | Use | Examples |

    |---|---|---|

    | Black | Data & variables | area |

    | Green | "Hello World" | |

    | Purple | func(print()) | |

    | Orange | for | |

    | Blue | get_name() | |

    | Red | #hashtag_VAR | |

    | Light red | Error messages | Exception: |


    - STEP 5 What you have done here assigns the a and b values: 2 and 2. These are
    new variables, which can be called upon Python to output, add, subtract, and so
    on for long as their names stay. Try this:


    ```

    name="David"

    surname="Hayward"

    ```


    - STEP 8 Now let''s add them: You have two variables containing a first name and
    surname and you can print them independently.


    ```python

    print(a)

    print(b)

    ```


    - STEP 6 The output of the last steps carries the values of a and b individually,
    as asked to be printed separately. If you add them up, you use the following:


    ```python

    print(name+surname)

    ```


    - STEP 9 If we were to apply the same routine as before, using the + symbol, the
    name wouldn''t appear correctly in the output. Shell will try:


    ```python

    print(name-surname)

    ```


    and not mathematically play with.


    - STEP 7 You can play around with different kinds of variables and the Function.
    For example, you could assign variables for someone''s name:


    ```python

    name="David"

    print(name)

    ```


    - STEP 10 In Python 3 you can combine the two variables with a space using comma:


    ```python

    name="David"

    print(name, surname)

    ```


    Alternatively, you can add the space yourself:


    ```python

    print(name+" ")

    ```


    The use of the comma is much easier, and you can use Congratulations, you''ve
    just taken your first steps into the world of Python.


    # Saving and Executing Your Code


    Whilst working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for entering longer program listings. In this section you''re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    ## EDIT CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    - STEP 1 First, open the Python IDE and when it is up, click on File -> New. This
    will open a new window with Untitled as its name. This is the Python Editor and
    within it you can enter the code needed to create your future programs.


    - STEP 2 The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, coding and so on; in the same vein as Sublime. You enter
    the code as you would within the Shell, so taking an Example from the previous
    tutorial, enter:


    ```

    print("Hello everyone!")

    ```


    - STEP 3 You can see that the same colour coding is in place in the IDLE Editor
    as it is in the Shell, enabling you to better understand what''s going with your
    code. However, to execute the code you need to first save it. Press F5 and you
    get a Save... Check box.


    - STEP 4 Click on the OK button in the Save box and select a destination where
    you will save all your Python code. The destination is a dedicated folder called
    Python or you can dump it wherever you like. Remember to keep a tidy drive though,
    to help you out in the future.

