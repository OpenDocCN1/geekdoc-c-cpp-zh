    # D


    Lists are extremely useful but dictionaries in Python are by far the more technique
    of dealing with data. They can be tricky to get to grips with but fairly you''ll
    soon be able to apply them to your own code.


    ## KEY PAIRS


    A dictionary is like a list but instead each data item comes as a pair, theseese
    Key and Value. The key part must be unique and either can be a string whereas
    the value can be any data item you like.


    - **STEP 1** Let''s say you want to create a phonebook in Python. You would create
    the dictionary name and enter the data in curly brackets.


    - **STEP 3** As lists and tuples, you can check the contents of a dictionary by
    giving the dictionary name as a list, in this example. this will display the data
    items you''re looking for. No doubt familiar.


