  - "[PAGE 91]\n\n# Say Hello to C++\n\n# # How to Set Up C++ in Linux\n\nLinux is\
    \ a great C++ coding environment. Most Linux distros already have the essential\
    \ components preinstalled, such as a compiler and the text editors are excellent\
    \ for entering code, including colour coding; and there are tons of extra software\
    \ to help you out.\n\n# LINUX++\n\nIf you're not familiar with Linux, we recommend\
    \ taking a look at one of our Linux titles from the BDM Publications range. If\
    \ you have the Raspberry Pi, the commands used below work just fine and for this\
    \ example we're using Linux Mint.\n\n+   **STEP 1** The first step is to ensure\
    \ Linux is ready for your C++ code, check the system and software are up to date.\
    \ Open a terminal and type `sudo apt-get update && sudo apt-get upgrade`. Then\
    \ press Return and enter your password. The commands update the entire system\
    \ and all installed software.\n\n+   **STEP 3** Amazingly, that's it. Everything\
    \ is ready to start coding. Here's how to get your first C++ program and running.\
    \ In Linux the main text editor is Xed, which you launch by clicking on the Menu\
    \ and typing Xed into the search bar. Click on the Text editor in the right-hand\
    \ pane to open it.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_91_0.png)\n\n+\
    \   **STEP 2** Most Linux distros come preinstalled with all the necessary components\
    \ to start coding in C++; however it's always worth checking to see if everything\
    \ is present. Still within the terminal, enter `sudo apt-install build-essential`\
    \ and press Return. If you have the right components not installed, you're missing\
    \ them then are installed by the command.\n\n+   **STEP 4** In Xed, or any other\
    \ text editor you may use, enter the lines of code that make your C++ Hello World\
    \ program. It's little different from what the Mac produced:\n\n```\n#include\
    \ <iostream>\nint main() {\n  // My first C++ program\n  std::cout << \"Hello\
    \ World!\\n\";\n}\n```\n\n```\ndavid@linuxmint-mate: ~ sudo apt-get update &&\
