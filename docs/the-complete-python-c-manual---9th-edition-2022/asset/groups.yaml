    ```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_0.png)\n\n- **STEP 2** In our\
    \ example the number four was returned. However, enter the print function a few\
    \ times and it will return different integer values from numbers, zero to five.\
    \ The example of this pseudo-random is adequate for the average number to utilise\
    \ in their code.\n\n```python\nimport random\nprint(random.random()*100)\n```\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_1.png)\n\n- **STEP 4** However,\
    \ the random module isn't used exclusively for numbers. You can use it to select\
    \ an entry from a list, and the list can contain:\n\n```python\nimport random\n\
    random.choice([\"Conan\", \"Valeria\", \"Belit\"])\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_2.png)\n\
    \n- **STEP 5** You can extend the example somewhat by using random.choice() from\
    \ a list of items variables.\n\n```python\nimport random\nlist=[\"44\", \"88M\
    \ Publications\", 3245.23, \"Pi\", 3.14, \"Python\"]\nprint(random.choice(list))\n\
    ```\n\n- **STEP 3** For a bigger set of numbers, including floating point size,\
    \ you can extend the range by using the uniform() function. Will display a floating\
    \ point number between 0 and 100, to use the range of around decimal places.\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_71_3.png)\n\n# STEP 6\n\nInterestingly,\
    \ you can also use a function within the random module to shuffle the items in\
    \ the list, adding a little more randomness to the equation:\n\n```python\nrandom.shuffle(list)\n\
    print(list)\n```\n\nThis way, you can shuffle the list before displaying a random\
    \ item from it.\n\n```python\nPython 3.2.2, Oct 19 2014, 13:31:11\nimport random\n\
    # choose 'credits' or 'license' for more information.\noptions = ['credits', 'license']\n\
    choice = random.choice(options)\nprint(choice)\n\npublications = ['Python', 'Pi',\
