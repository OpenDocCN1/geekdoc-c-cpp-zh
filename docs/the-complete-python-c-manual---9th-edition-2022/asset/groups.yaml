    \n## 要安装的其他 C++ IDE\n\n如果你想尝试不同的处理 C++ 代码的方法，有很多选项供你选择。Windows 是 C++ IDE 最丰富的平台，但\
    \ Mac 和 Linux 用户也有很多。\n\n### 开发 C++\n\n这里有一些值得关注的 C++ IDE。你可以根据需要安装一个或全部，但找到适合你的。\n\
    \n- ECLIPSE Eclipse 是非常流行的 C++ IDE，为程序员提供了丰富的功能。它拥有良好的界面，易于使用，并适用于 Windows、Linux\
    \ 和 Mac。前往 eclipse.org/downloads/ 下载最新版本。如果你遇到困难，点击 Need Help 链接获取更多信息。\n- CODELITE\
    \ CodeLite 是一个免费开源的 IDE，更新频繁，适用于 Windows 和 macOS；它轻量、简单且极其强大。你可以在 codelite.org/\
    \ 找到更多信息以及如何安装它。\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_93_0.png)\n- GNAT\
    \ GNAT Programming Studio (GPS) 是一个强大且直观的 IDE，支持测试、调试和代码分析。社区版免费，而 Pro 版收费；社区版适用于\
    \ Windows、Mac Linux 甚至 Raspberry Pi。你可以在 adacore.com/download 找到它。\n- NETBEANS\
