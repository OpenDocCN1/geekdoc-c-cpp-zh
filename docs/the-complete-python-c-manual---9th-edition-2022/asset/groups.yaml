    \n# BDM's Complete Manual Series\nPython & C++\n\n# Unleash the power of Python\
    \ and C++\n\nHaving a basic knowledge of programming can open many different doors\
    \ for the newcomer to explore. You can gain a better understanding of how hardware\
    \ and software work together, how your computer or device functions and how incredible\
    \ open-world gaming environments are converted from ones and zeros to what's on\
    \ your monitor or TV. Technology is everywhere and it's all connected through\
    \ programming. Your TV, microwave, in-car entertainment and the Internet itself\
    \ are all reliant on good programming to make them work the way you want them\
    \ to. Within these pages are the building blocks to help you take your first steps\
    \ into the world of programming. We've taken two of the most powerful and versatile\
    \ programming languages available, Python and C++ and broken them down into bite-sized\
    \ tutorials and guides to help you learn how they work, and how to make them work\
    \ for you.\n\nLearn how to install them, print simple messages to the screen,\
    \ ask for user input and manipulate the data to produce amazing results. By the\
    \ end of this book you will understand how Python and C++ work and what potential\
    \ lies beyond. Ready? Let's get programming!\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_2_0.png)\n\
    \n# Contents\n\n## 6 Say Hello to Python\n- 8 Why Python?\n- 10 Equipment You\
