    # USER ERROR


    User input is often a paralys mistake in code. For example, the user is supposed
    to enter a number for their age and enter it as letters. Often a user can enter
    into such an input that overflows internal buffer, thus causing the code crash.
    Watch those user inputs and clearly state what is needed from them.


    ```

    Enter an integer number

    You have entered wrong input

    You have entered wrong input

    You have entered wrong input

    sdfaf212312123

    1322n2y9n2x3n2y9n2x

    You have entered wrong input

    The number is: 12

    Process returned (0x0) execution time: 2.49 s

    Press any key to continue

    ```


    # BACKUPS


    Always make a backup of your work, with a secondary backup for any changes you''ve
    made. Mistakes can be rectified if there''s a good backup in place to revert to
    those times when something goes wrong. It''s much easier to start where you left
    off, rather than starting from the beginning.


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_138_0.png)


