    print(\"3.Square\")\nprint(\"4.Power of\")\n```\n\n```python\nchoice = input(\"\
    nEnter choice (1/2/3/4):\")\nnum1 = int(input(\"nEnter number: \"))\n```\n\n#\
    \ Say Hello to C++\n\nC++ is a high level programming language that's used in\
    \ a multitude of technologies. Everything from your favourite mobile app, console\
    \ and PC game operating systems, all are developed using C++ and a collection\
    \ of software development kits and custom libraries.\n\nC++ is the driving force\
    \ behind most of what you use on a daily basis, which makes it a complex and extraordinarily\
    \ powerful language to get grips with. In this section, we look at how to install\
    \ a C++ IDE and compiler on your computer.\n\n| | |\n| :--- | :--- |\n| 84 | Why\
    \ C++? |\n| 86 | Equipment Needed |\n| 88 | How to Set Up C++ in Windows |\n|\
    \ 90 | How to Set Up C++ on a Mac |\n| 92 | How to Set Up C++ in Linux |\n| 94\
    \ | Other C++ IDEs to Install |\n\n# Why C++?\n\nC++ is one of the most popular\
    \ programming languages today. Originally called C with Classes, the language\
    \ was renamed C++ in 1983. It's an extension of the original C language and is\
    \ a general purpose object-oriented OOP environment.\n\n## C EVERYTHING\n\nDue\
    \ to how complex the language can be, and its power and performance, C++ is often\
    \ used to develop games, programs, device drivers and even operating systems.\n\
    \nDating back to 1979, the start of the golden era of home computing, C++, or\
    \ rather C with Classes, was the brainchild of Danish scientist Bjarne Stroustrup\
    \ working on his PhD thesis. Stroustrup's plan was to further the original C language,\
    \ which was widely used since the early seventies.\n\ncomputing labs and by regular\
    \ people who didn't have access to the Danish scientist Bjarne Stroustrup working\
    \ on his PhD thesis. Stroustrup's plan was to further the original C language,\
    \ which was widely used since the early seventies.\n\nC++ impact on the digital\
    \ world is immense. Many of the programs, for example, all of Adobe's major applications,\
    \ such as Photoshop, InDesign and so on, are developed in C++.\n"
  mdcn: "\n\n# 使用自定义模块\n\n如果能将大型程序拆分为较小的部分，并将所需的部分作为模块导入，那么管理这些程序将变得简单得多。学习构建自己的模块也有助于理解它们是如何运作的。\n\
    \n## 构建模块\n\n模块是 Python 文件，包含代码，并将其保存为 .py 扩展名。这些文件使用 `import` 命令导入到 Python 中。\n\
    \n- * 第 1 步：从创建一组基础数学函数开始。将一个数字乘以二、三，并计算一个数字的次方（幂）。在 IDE 中创建一个新文件并定义它们：\n\n```python\n\
    def timestwo(x):\n    return x * 2\n```\n\n```python\ndef timthree(x):\n    return\
    \ x * 3\n```\n\n```python\ndef square(x):\n    return x * x\n```\n\n```python\n\
    def power(x,y):\n    return x ** y\n```\n\n- * 第 2 步：在上述代码下方，输入函数来调用代码：\n\n```python\n\
    print(timestwo(2))\nprint(timthree(3))\nprint(square(4))\nprint(power(5,3))\n\
    ```\n\n将程序保存为 `basic_math.py` 并执行它以获取结果。\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_79_0.png)\n\
    \n- * 第 3 步：现在你将把函数从程序中提取到单独的文件文件中。高亮函数定义并选择 Edit > Cut（剪切）。选择 File > New（新建），并在新窗口中使用\
    \ Edit > Paste（粘贴）。现在有两个文件，一个包含函数，另一个包含调用：\n\n```python\nprint(timestwo(2))\n\
    print(timthree(3))\nprint(square(4))\nprint(power(5,3))\n```\n\n- * 第 4 步：如果你现在再次尝试执行\
    \ `basic_math.py` 代码，将会出现错误 **NameError: 'timestwo' is not defined**！这是由于代码不再能够访问这些函数。\n\
