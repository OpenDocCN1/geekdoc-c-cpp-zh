    当你编写代码时，代码的流程、每个变量将如何被程序操作等都在你的脑海中。另一个程序员可以逐行阅读代码，但随着时间的推移，代码可能会变得难以阅读。


    程序员通过对某些部分进行注释，来保持代码的可读性。如果一个变量被使用，程序员会注释它预期的功能，例如，这是一种良好的习惯。


