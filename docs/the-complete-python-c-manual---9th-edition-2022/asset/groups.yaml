- md: "\n# Using Your Own Modules\n\nLarge programs can be much easier to manage if\
    \ you break them up into smaller parts and import the parts you need as modules.\
    \ Learning to build your own modules also makes it easier to understand how they\
    \ work.\n\n## BUILDING MODULE\n\nModules are Python files, containing code, that\
    \ you save as a .py extension. These are imported into Python using the import\
    \ command.\n\n- * STEP 1: Start by creating a set of basic mathematics functions.\
    \ Multiply a number by two, three and raise a number to an exponent (power). Create\
    \ a New File in the IDE and define them:\n\n```python\ndef timestwo(x):\n    return\
    \ x * 2\n```\n\n```python\ndef timthree(x):\n    return x * 3\n```\n\n```python\n\
    def square(x):\n    return x * x\n```\n\n```python\ndef power(x,y):\n    return\
    \ x ** y\n```\n\n- * STEP 2: Under the above code, enter functions to call the\
    \ code:\n\n```python\nprint(timestwo(2))\nprint(timthree(3))\nprint(square(4))\n\
    print(power(5,3))\n```\n\nSave the program as basic_math.py and execute it to\
    \ get the results.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_79_0.png)\n\n-\
    \ * STEP 3: Now you're going to define the functions out of the program and into\
    \ a separate file. Highlight the function definitions and choose Edit > Cut. Choose\
    \ File > New and use Edit > Paste in the new window. You now have two files, one\
    \ with the functions, the other with the calls:\n\n```python\nprint(timestwo(2))\n\
    print(timthree(3))\nprint(square(4))\nprint(power(5,3))\n```\n\n- * STEP 4: If\
    \ you now try and Execute the basic_math.py code again, the error **NameError:\
    \ 'timestwo' is not defined**! This is due to the code no longer having access\
    \ to the functions.\n\n- * STEP 5: Return to the newly created window containing\
    \ the function definitions, and click File > Save As. Name it minath.py and save\
    \ it in the same location as the original basic_math.py. program now basic_math.py,\
    \ so the minath.py window is left open.\n\n> Traceback (most recent call last):\n\
    >   File \"C:\\...basic_math.py\", line 3, in <module>\n>     print(timestwo(2))\n\
    > NameError: 'timestwo' is not defined\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_79_1.png)\n\
    \n# Create Your Own Modules\n\n## STEP 6\n\nBack to the basic_math.py window:\
    \ at the top of the code enter:\n\n```python\nfrom math import *\n```\n\nThis\
    \ will import the functions as a module. Press F5 to save and execute the program\
    \ to see it in action.\n\n```python\n# math.py\n# this is used to test the basic_math.py\
    \ functions\nprint(\"create\", \"credits\") for more information.\nprint(timestwo(1))\n\
    print(timestwo(2))\nprint(timthree(3))\nprint(square(4))\n```\n\nYou can now use\
    \ the code further to make the module to it more advanced, utilizing the newly\
    \ creating a basic menu with user interaction. Select user can choose from:\n\n\
    ```python\nchoice = input(\"nEnter choice (1/2/3/4):\")\n```\n\n## STEP 9\n\n\
    Finally, you can now create a range of if statements to determine what to do with\
    \ the number and utilise the newly created function definitions:\n\n```python\n\
    if choice == '1':\n    print(timestwo(num1))\nelif choice == '2':\n    print(timthree(num1))\n\
    elif choice == '3':\n    print(square(num1))\nelse:\n    print(\"Invalid input\"\
    )\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_80_0.png)\n\n```python\nprint(\"\
    Select operation.\")\nprint(\"1.Times by two\")\nprint(\"2.Times by Three\")\n\
    print(\"3.Square\")\nprint(\"4.Power of\")\n```\n\n```python\nchoice = int(input(\"\
    nEnter choice (1/2/3/4):\"))\n\nif choice == '1':\n    print(timestwo(num1))\n\
    elif choice == '2':\n    print(timthree(num1))\nelif choice == '3':\n    print(square(num1))\n\
    else:\n    print(\"Invalid input\")\n```\n\n## STEP 7\n\nWe can now use the user\
    \ to get the number that the code will work on:\n\n```python\nnum1 = int(input(\"\
    nEnter number: \"))\n```\n\nThis saved the entered variable as variable num1.\n\
    \n## STEP 10\n\nNote that for the last options, the Power of choice, we added\
    \ a second variable, num2. This passes a second number through the function called\
    \ power. Save and execute the program to see it in action.\n\n```python\nprint(\"\
