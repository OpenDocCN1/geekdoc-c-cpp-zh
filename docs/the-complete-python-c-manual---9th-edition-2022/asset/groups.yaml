    # OS Module


    STEP 5 The os.system() function is what allows interaction with external programs;
    you can call up previous Python programs using this method. You will obviously
    need to know the full path and program file name for it to work successfully.
    You can use the:


    ```

    import os

    os.system(''start chrome "https://www.youtube.com/feed/music"'')

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_70_0.png)


    STEP 8 The ability to manipulate directories, or folders you prefer, is one of
    the OS module''s best features. For example, to create a new directory you can
    use:


    ```

    import os

    os.mkdir("NEW")

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_70_1.png)


    STEP 9 You can also rename directories you''ve created by entering:


    ```

    import os

    os.rename("NEW", "OLD")

    ```


    To delete:


    ```

    import os

    os.rmdir("OLD")

    ```


    STEP 6 For Step 5''s example we used Windows, to show that the OS module works
    roughly the same across all platforms. In that case, we opened YouTube''s music
    feed, so it therefore possible to open specific pages:


    ```

    import os

    s.system(''chromium-browser "http://bdmpublic.com/\'')")"

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_70_2.png)


    STEP 10 Another module that gathers together with OS is shutil. you can use the
    shutil together with OS and create a time-timestamped backup, and copy files into
    it:


    STEP 7 Note in the previous step''s example of the entire command and double-quotes.
    The single quotes escapes launching Chrome, whereas the double quotes opened the
    specific page. You can use variables to call multiple tabs in the same browser:


    ```

    import os

    a=(''chromium-browser "http://bdmpublic.com/"'')

    b=(''chromium-browser "http://www.google.co.uk/\'')

