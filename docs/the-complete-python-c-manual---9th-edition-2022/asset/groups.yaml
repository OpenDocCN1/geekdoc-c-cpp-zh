    3.6，但你之后可能会看到更高版本的 3 系列）。

    - **步骤 2** 点击 3.x 版本的下载按钮，并将文件保存到你的“下载”文件夹。文件下载完成后，点击可执行文件即可启动 Python 安装程序。在这里，你有两个选择：立即安装
    (Install Now) 或自定义 (Custom)。我们建议选择“自定义安装 (Customise Installation)”链接。

    - **步骤 3** 选择自定义选项允许你指定某些参数，虽然你可以保持默认设置，但养成这种习惯是好的，因为（感谢 Python）有时安装程序可能会包含不必要的额外功能。在下一个屏幕上，确保所有框都已勾选并点击下一步。


