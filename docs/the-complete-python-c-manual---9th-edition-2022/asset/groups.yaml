    # Character Literals


    In C++ a literal is an object or variable that once defined remains the same throughout
    the code. However, a character literal is defined by a backslash, such as the
    \n you''ve been using at the end of a cout statement to signify a new line.


    # ESCAPE SEQUENCE


    When used in a cout statement, character literals are also called Escape Sequence
    Codes. They allow you to insert a quote, an alert line, and much more.


    ```

    STEP 1 Create a new C++ file and enter the relevant headers:

    #include <iostream>

    using namespace std;


    int main() {


    }

    ```


    ```

    STEP 3 If you want to insert speech quotes inside a cout statement, you would
    have to use a backslash as it

    #include <iostream>

    using namespace std;

    int main() {


    cout << \"Hello, user. This is how to use \"quotes\";

    n}

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_117_0.png)


    STEP 2 You''ve experienced the \n character literal placing a new line wherever
    it''s called. The line: cout << \"Hello\" << \"I am a C++\" << \"Program\" outputs
    three lines of text, each after the last \n.


    STEP 4 There''s an even character that can trigger an alarm. In Windows 10, it''s
    the notification sound that chimes when you use \. Try this code, and turn up
    your sound.


    ```

    #include <iostream>

    using namespace std;

    int main() {


    cout << \"ALARM! \a";

    }

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_117_1.png)


