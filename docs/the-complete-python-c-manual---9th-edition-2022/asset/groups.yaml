    \ and Time\n- 58 Opening Files\n- 60 Writing to Files\n- 62 Exceptions\n- 64 Python\
    \ Graphics\n\n## 20 Getting Started with Python\n- 22 Starting Python for the\
    \ First Time\n- 24 Your First Code\n- 26 Saving and Executing Your Code\n- 28\
