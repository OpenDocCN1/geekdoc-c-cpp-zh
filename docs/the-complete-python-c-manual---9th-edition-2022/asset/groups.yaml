    \n## 初始化变量\n\n在 C++ 中变量没有初始化为零。这意味着如果你创建一个变量 x，它会被赋予一个从0开始的随机数，因为在方程中包含它。\n\n\
    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_141_1.png)\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int x;\n    cout << x;\n}\n```\n\n##\
    \ 额外的分号\n\n虽然在每一行末尾添加分号是必要的，但规则有一些例外。分号位于每个完整语句的结尾，但某些代码行并不是语句。\n\n# #include\n\
    if lines\nswitch switches\n\n如果让你感到困惑，编译器会告诉你哪里出错了。\n\n"
