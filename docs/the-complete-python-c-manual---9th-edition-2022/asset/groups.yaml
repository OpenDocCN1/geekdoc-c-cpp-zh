    \nLoops and repetition are one of the most important factors of any programming\
    \ language. Good use of a loop creates a program that does exactly what you want\
    \ it to and delivers the desired outcome without issues or errors.\n\nLoops and\
    \ decision making events within the code, your program will never be able to offer\
    \ the user any choice. It's this understanding of choice that elevates your skills\
    \ as a programmer and makes for much better code.\n\n| 126 | While Loop |\n|---|---|\n\
    | 128 | For Loop |\n| 130 | Do... While Loop |\n| 132 | If Statement |\n| 134\
    \ | If... Else Statement |\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_124_0.png)\n\
    \n## While Loop\n\nA while loop's function is to repeat a statement, or a group\
    \ of statements, while a certain condition remains true. When the while loop starts,\
    \ it initialises itself by testing the condition of the loop and the statements\
    \ within, before executing the rest of the loop.\n\n## TRUE OR FALSE?\n\nWhile\
    \ loops are one of the most popular form of C++ code looping. They repeatedly\
    \ run the code contained within the loop while the condition is true. Once it\
    \ proves false, the code continues as normal.\n\n- **STEP 1** Clear what you've\
    \ done so far and create a new C++ file. There's no need for any extra headers\
    \ at usual:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \n}\n```\n\n- **STEP 3** First you need to create a condition, use a variable\
    \ named num and Now create the while loop, stating that as long as num is less\
    \ than 30, the loop is true. The loop value of num is displayed and adds 1 until\
    \ it's more than 30.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_125_0.png)\n\n\
    - **STEP 2** Create a simple while loop. Enter the code below, and build and run\
    \ (we added comments to the screen):\n\n```\nint num = 1;\n\nwhile (num < 30)\
    \ {\n    cout << \"Number: \" << num << endl;\n    num = num + 1;\n}\n\nreturn\
    \ 0;\n```\n\nWe're introducing a few new elements. The first are the opening and\
    \ closing braces for the while loop. Because this loop is a compound statement,\
    \ meaning a group of statements; also note, there's no semicolon after the while\
    \ loop. You also have return 0, which is a clean and perfect way of ending the\
    \ code.\n\n```\nint num = 1; // Create the condition\nwhile (num < 30) // The\
    \ condition is true while num is less than 30\n{\n    cout << \"Number: \" <<\
    \ num << endl; // Display the value of num\n    num = num + 1;\n}\n\nreturn 0;\
    \ // Close the loop and finishes the program\n```\n\n- **STEP 5** If you didn't\
    \ need to see the continually increasing value of num, you could have gone away\
    \ with the compound and instead just added num by itself, then displayed the value:\n\
    \n```\nint num = 1;\nwhile (num < 30) {\n    num++;\n    cout << \"Number: \"\
    \ << num << endl;\n}\nreturn 0;\n```\n\n126 www.bdmpublications.com\n\n## STEP\
    \ 6\n\nIt's important to remember not to add a semicolon at the end of a statement.\
    \ Well, why so the semicolon represents the end of a C++ line of code. If you\
    \ place one at the end of a statement, your loop will be permanently stuck until\
    \ you close the program.\n\n| line | while_loop.cpp |\n|---|---|\n| 1 | #include\
    \ <iostream> |\n| 2 | #include <windows.h> |\n| 3 | using namespace std; |\n|\
    \ 4 | |\n| 5 | int num = 0; |\n| 6 | |\n| 7 | while (num < 30) { |\n| 8 | cout\
    \ << \"Number: \" << num << endl; |\n| 9 | num++; |\n| 10 | } |\n| 11 | | |\n\
    | 12 | return 0; |\n\n## STEP 7\n\nIn example, if we execute the code the value\
    \ of num would be 1, set by the while statement. When the code hits the statement\
    \ it reads that the condition of 1 is less than 30 is true, loop. The semicolon\
    \ closes the, so the loop repeats, but never adds 1 to num, as it not continue\
    \ through the compound statement.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_126_0.png)\n\
    \n## STEP 8\n\nYou can manipulate the while statement to display different results\
    \ depending on what code lines the loop for. To read the poem, Cimmeria, word\
    \ by word, you would:\n\n```\n#include <iostream>\n#include <fstream>\nusing namespace\
