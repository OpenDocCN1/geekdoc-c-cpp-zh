    \n# 什么是编程？\n\n在尝试学习一种语言之前，了解什么是编程语言是有帮助的，让我们来看看 Python 是如何产生的，以及它与其他语言的关系。\n\n\
    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_11_0.png)\n\n编程语言是计算机遵循的指令列表。这些指令可以简单到创建一个文件或玩一个游戏，也可以复杂到构建整个世界。Python\
