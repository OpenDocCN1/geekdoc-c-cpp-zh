    \n```python\ncake = []\nflour = 100\nbutter = 50\nmilk = 100\ncake.append([flour,\
    \ butter, milk])\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_12_0.png)\n\n\
    # Python 3 对比 Python 2\n\n在典型的计算场景中，Python 因为两个活跃版本的存在变得有些复杂：Python 2 和 Python\
