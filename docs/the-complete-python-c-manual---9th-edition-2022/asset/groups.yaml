    # 需要的设备


    学习 C++ 不需要你投入巨额资金，也不需要配备一整个计算机实验室。只要你有一台相当现代的电脑，其他一切都是免费提供的。


    # C++ 环境搭建


    大多数（如果不是所有）操作系统代码中都包含 C++，因此理所，无论你目前使用什么种操作系统，都可以学习使用 C++ 编程。


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_85_0.png)


    # 电脑


    除非你喜欢在纸上手写你的 C++ 代码（这是很多老牌程序员过去会做的），否则电脑是必不可少的。PC 用户可以使用任何最近的 Linux 发行版或 Windows
    操作系统；Mac 用户使用最新的 macOS即可。


    # IDE（集成开发环境）


    就像 Python 一样，IDE 用于输入和执行你的 C++ 代码。许多 IDE 都带有扩展和插件，可以帮助它运行得更好，或添加额外的功能。通常，IDE 会根据所使用的核心操作系统提供增强，例如针对
    Windows 10 的增强。


    # 编译器


    编译器是一个将 C++ 语言转换为二进制文件的程序，以便计算机能够理解。虽然某些 IDE 内置了编译器，但另一些没有。Code:Blocks 是我们最喜欢的
    IDE，它作为软件包的一部分自带了 C++ 编译器。关于这一点，


    # 文本编辑器


    有些程序员更倾向于在通过编译器运行之前使用文本编辑器汇编他们的 C++ 代码。本质上，你可以使用任何文本编辑器编写代码，只需将其保存为 .cpp 扩展名即可。然而，Notepad++
    是目前可用最好的文本编辑器之一。


    # 互联网访问


    虽然在没有连接互联网的电脑上学习编程是可能的，但极其困难。你需要安装相关软件、保持其更新、在编码时安装任何帮助性的额外程序或扩展。所有这些都需要访问互联网。


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_85_1.png)


    # 时间与耐心


    是的，和 Python 一样，你需要留出大量的时间来学习如何用 C++ 编码。同样，除非你是天才，否则这不会一夜之间发生，甚至在一周内完成。一个优秀的 C++
    程序员花费了多年时间磨练他们的技艺，所以请耐心，从小处开始并持续学习。


    # 特定操作系统的需求


    C++ 可以在任何操作系统上运行，但将所有必要的组件组合在一起会让新手感到困惑。以下是针对 C++ 的特定操作系统说明。


    # LINUX


    Linux 用户是幸运的，因为他们的操作系统已经内置了编译器和文本编辑器。任何文本编辑器都允许你输入 C++ 代码，当它保存为 .cpp 扩展名时，使用 g++
    进行编译即可。


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_0.png)


    # Windows


    我们之前提到过，很好的 IDE 是微软的 Visual Studio。然而，更好的 IDE 和编译器是 Code::Blocks，它每年发布两次新版本以保持更新。其他
    Windows 用户可以在 Notepad++ 中输入代码，然后像 Code::Blocks 使用的那样使用 MinGW 进行编译。


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_1.png)


    # 树莓派


    树莓派的操作系统是 Raspian，它是基于 Linux 的。因此，你可以使用文本编辑器编写代码，然后像在任何其他 Linux 发行版中一样使用 g++ 进行编译。


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_2.png)


    # Mac


    Mac 用户需要下载并安装 Xcode 才能原生编译他们的 C++ 代码。Mac 的其他选项包括 Netbeans、Eclipse 或 Code::Blocks。注意：由于缺乏
    Mac 开发者，最新版本的 Code::Blocks 并不适用于 Mac。


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_3.png)


    # 如何在 Windows 中设置 C++


    Windows 用户在 C++ 编程方面有丰富的选择。有许多 IDE 和编译器可用，包括微软的 Visual Studio。然而，在我们看来，开始开始的最佳
    C++ IDE 是 Code::Blocks。


