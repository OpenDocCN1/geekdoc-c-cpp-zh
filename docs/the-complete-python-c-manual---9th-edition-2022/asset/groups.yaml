    \ C++ 并消化他们学到的内容。\n\n## 空错误\n\n诚然，从不在代码上写注释的错误再次出现。正如我们之前提到的，代码中缺乏可读的标识符会让你和其他回顾其工作原理变得非常困难。使用更多的注释。\n\
    \n## 未定义的标识符\n\n大多数编程语言的共同错误是尝试输出不存在的变量。在屏幕上显示 x 的值没有问题，但如果你没有告诉编译器 x 的值。\n\n\
    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_141_0.png)\n\n## 命名空间\n\n在代码中引用标准库是初学者常见的，但如果你漏掉了\
    \ `std::` 元素，你的代码在编译时会出错。你可以通过简单使用来解决：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    int a, b, c, d;\n    a=10;\n    b=20;\n    c=30;\n\
    \    d=40;\n    cout << a << b << c << endl;\n}记住 C++ 程序的每一行都必须以分号结束。如果没有，编译器会将缺少分号的行视为下一个语句。这在编译时会产生各种问题，所以不要忘记你的分号。\n\
    \n```cpp\n#include <iostream>\nint main() {\n    int a, b, c, d;\n    a=10;\n\
    \    b=20;\n    c=30;\n    d=40;\n    std::cout << a << b << c << d;\n}\n```\n\
    \n## GCC 或 G++\n\n如果你在 Linux 中，你将会遇到 gcc 和 g++。简而言之，gcc 是 GNU 编译器（或称为 GNU C Compiler），而\
    \ g++ 是编译器的 GNU（C++ 版本）。如果你使用 Windows，则需要确保使用了正确的编译器。\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_141_1.png)\n\
    \n## 注释（再次）\n\n确实，从不在代码上写注释的错误再次出现了。正如我们之前提到的，代码中缺乏可读的标识符会让你和其他人在回顾其工作原理时变得非常困难。使用更多的注释。\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
    \ message = \"Hello, world!\";\n    std::cout << message << std::endl;\n    return\
    \ 0;\n}\n```\n\n## 大括号过多\n\n大括号 `{}` 是代码块的开始和结束标记。所以对于每一个（你必须有一个）。当你通常在文本编辑器中编写时，很容易包含或漏掉一个大括号，IDE\
    \ 经常会为你完成。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int x;\n    string myself = \"This is a string!\\n\";\n    cout << \"\
    What's the value of x? \";\n    cout << x << \";\n\n    cout << \"\\n\";\n   \
    \ cout << myself;\n}\n```\n\n## 引号\n\n缺少引号是一个常见的错误，对于每一个层级的用户都是如此。你需要创建字符串。在屏幕上显示\
