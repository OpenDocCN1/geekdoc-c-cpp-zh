    \n# if 语句\n\n`if` 决策语句可能是任何编程语言中最常用的语句之一，无论是 C++、Python 还是其他。它代表代码中的分支：如果条件为真执行前者，执行后者。\n\
    \n# 布尔表达式\n\n`if` 使用布尔表达式。如果表达式为真，则执行语句内部的代码。否则，则执行语句后的代码。\n\n### 步骤 1\n\n首先，创建一个新的\
    \ C++ 文件并输入标准头文件：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main\
    \ () {\n}\n```\n\n| 行号 | 内容 |\n|---|---|\n| 1 | #include <iostream> |\n| 2 | using\
    \ namespace std; |\n| 3 | int main () { |\n| 4 | |\n| 5 | } |\n\n### 步骤 2\n\n\
    当你使用基于数字条件时，`if` 是最好的：\n\n```cpp\nint num = 1;\nif (num < 30) {\n    cout << \"\
    数字小于 30。\" << endl;\n}else {\n    cout << \"数字的值: \" << num << endl;\nreturn 0;\n\
    }\n```\n\n### 步骤 3\n\n首先，创建一个名为 `num` 的整数并赋值为 1。下一个语句，我们构建了代码：如果 `num` 的值小于 1，则执行括号内的代码。\n\
    \n```cpp\nint num = 1; // num 的整数值\nif (num < 30) // num 的值小于\ncout << \"数字小于\
    \ 30。\" << endl; // 显示此输出\n```\n\n### 步骤 4\n\n第二个 `cout` 语句显示 `num` 的值并程序终止。如果你将\
    \ `num` 的初始值改为某个值，很容易看出语句是如何工作的。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main () {\n    int num = 31; // 修改 num 的值\n    if (num < 30) // num\
    \ 的值小于\n}\n```\n\n* www.com\n\n### 步骤 5\n\n当你将值改为 30 以上的任何值并运行代码时，你可以看到输出到屏幕的唯一行是第二个语句，显示\
