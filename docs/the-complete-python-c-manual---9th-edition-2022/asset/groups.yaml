    \ into your code.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_57_0.png) ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_57_1.png)\n\
    \n# Working with Files\n\nThe ability to read files within Python is certainly\
    \ half but writing to a file is better still. By using the write() function, you're\
    \ able to output the results of a program to a file, you can then read back into\
    \ Python. The write() function is slightly more complex than read(). Along with\
    \ the filename you must also include an access mode which determines whether the\
    \ file is in read or write mode.\n\n- STEP 1 Start opening IDE and enter the following:\n\
    ```python\nt=open(\"/home/pi/Documents/text.txt\", \"w\")\n```\n\n- STEP 3 However,\
    \ the actual text is still blank (can you write the line of the file object? This\
    \ is because you check by opening it up). Part of the write() function is not\
    \ committed to the file; you need to commit the changes; you can do this by entering:\n\
    ```python\nt.close()\n```\n\n```python\nPython 3.4.2\nPython 3.4.2 (default, Oct\
    \ 19 2014, 13:31:11)\n>>> type=\"copyright\", \"credits\" or \"license\" for more\
    \ information.\n>>> type(t)\n<class '_io.TextIOWrapper'>\n>>> t.write(\"You awake\
    \ in a small, square room. A single table stands to one side, there is a locked\
    \ door in front of you.\")\n>>> t.close()\n```\n\n- STEP 4 If you now open the\
    \ file with a text editor, you can see that the line you created has been written\
    \ to the file. This gives us the function for some interesting possibilities:\
    \ perhaps the creation of your own log file or even the beginning of an adventure\
    \ game.\n\nt.write(\"You awake in a small, square room. A single table stands\
    \ to one side, there is a locked door in front of you.\")\n\nNote the 109. It's\
    \ the number of characters you've entered.\n\n# Writing to Files\n\nSTEP 5 To\
    \ expand this code, you can reopen the file using 'a', for append or access mode.\
    \ This will add any text to the end of the original line of wiping the file and\
    \ create a new example.\n\n```python\nt=open(\"/home/pi/Documents/text.txt\",\
    \ \"a\")\nt.write(\"hello\\n# You stand and survey your surroundings.\nOn top\
    \ of the table is some meat, and a cup of\nwater.\n\")\n```\n\nSTEP 8 You can\
    \ pass variables to a file that you've created in Python. You can pass any value\
    \ of pi to the file using the math module, create a new file and pass the output\
    \ of pi into the new file:\n\n```python\nimport math\nprint(\"Value of Pi is:\
    \ {math.pi}\")\nprint(\"writing to a file now... \")\n```\n\n![](/8b33dbf2a2ef620c5ea6844ae78b2983_60_0.png)\n\
    \nSTEP 6 You can keep extending the text line by line, ending with a new line\
    \ (). When you're done, finish the code with close() and open the file in your\
    \ editor to see the result.\n\nSTEP 9 Now let's create a variable pi and assign\
    \ it the value of pi:\npi=math.pi\n\nYou also need to create a new file to write\
    \ pi to:\nt=open(\"/home/pi/Documents/pi.txt\", \"w\")\nRemember to change your\
    \ file location to use your system setup.\n\nt.write(\"The door is made of solid\
    \ wood with iron strips. It's bolted from the outside, locking in. You are a prisoner!\"\
    )\nt.close()\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_60_1.png)\n\nSTEP 7 There\
    \ are various types of file access to consider using the () function. Each depends\
    \ on the how and the position of the cursor. r+ opens a file in read and write\
    \ and places the cursor at the start of the file.\n\nSTEP 10 To finish, use string\
    \ formatting to call the variable and write it to the file, then commit the changes\
    \ and close the file:\nt.write(\"Value of Pi is: {}\".format(pi))\nt.close()\n\
    \nYou can see the results that you're able to pass any variable to\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_60_2.png)\n"
