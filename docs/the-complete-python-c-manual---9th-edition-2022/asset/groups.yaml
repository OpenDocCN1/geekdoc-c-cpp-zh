    \ height), 0, 32)\npygame.display.set_caption('caption')\n\n# 设置移动变量\nmoveLeft\
    \ = False\nmove = False\nmoveDown = False\n\n# 设置方向变量\nLEFT = 0\nRIGHT = 3\n```\n\
    \n## 循环计数\n\n记住在 Python 中，循环不计算你在 `range` 中指定的最后一个数字。如果你想让循环从 1 计数到 10，你需要使用：\n\
    \n```python\nn = list(range(1, 11))\n```\n\n这将返回 1 到 10。\n\n## 冒号\n\n初学者经常忘记在结构化语句末尾添加冒号，例如：\n\
    \n```python\nclass Hangman:\n    def guessed(self, letter):\n```\n\n等等等。冒号分隔代码，并创建代码所属的缩进。\n\
    \n```python\nclass Hangman:\n    def __init__(self, word):\n        self.word\
    \ = word\n        self.missed_letters = []\n\n    def guessed(self, letter):\n\
    \        if letter not in self.word:\n            self.missed_letters.append(letter)\n\
    \        else:\n            pass\n```\n\n## 大小敏感\n\nPython 是一种大小敏感的语言，所以你需要检查任何变量。例如，在代码中调用错误的变量\
    \ Lives 会产生意外结果。\n\n```python\n>>> lives = 10\n>>> print(Lives, lives)\n10\n```\n\
    \n## 运算符\n\n使用运算符也是一种常见错误。当你对两个值进行比较时，你需要使用相等运算符（双等号 `==`）。使用单等号 `=` 是给变量赋值（例如，lives10）。\n\
    \n```python\nb=5\nc=10\n# b == false 5 不等于 10\n# d == true 10 是\n```\n\n## 括号\n\
    \n每个人都会忘记在语句末尾添加额外的括号。Python 依赖于相等数量的括号，因此代码中的任何错误都可能是由于你忘记数括号。\n\n## 操作系统\n\n\
    编写多平台代码是困难的，特别是当你需要开始操作系统元素时。例如，如果为了清除屏幕，在 Windows 上你必须使用 cls。而在 Linux 上你需要使用\
    \ clear。你需要小心输入并使用替代命令。\n\n```python\ndef print_status(self):\n    print (board(len(self.missed_letters)))\n\
    \    print ('Word: ')\n    for letter in self.missed_letters:\n        print (letter,))\n\
    \nwhile(run==1):\n    try:\n        os.system('clear')\n    except OSError:\n\
