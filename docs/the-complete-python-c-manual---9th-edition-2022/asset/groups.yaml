    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_38_2.png)\n\n# Getting Started with Python\n\
    \nConditions and loops are makes a program interesting; they can be simple or\
    \ more complex. How you use them depends greatly on what the program is trying\
    \ to achieve; they could be the number of lives left in a game or just displaying\
