    # Splitting and Joining Strings


    When dealing with data in Python, especially from a user''s input, you will undoubtedly
    come across long sets of strings. A useful skill to learn in Python programming
    is being able to split those long strings for better readability.


    # STRING THEORIES


    You''ve already looked at some lists, using .insert, .remove, and .pop but there
    are also functions that can be applied to strings.


    +   STEP 1 The main tool in the string function arsenal is .split(). With it''re
    able to split a string of data, based on the argument within brackets. For example,
    here''s a string with three items, each separated by a space:


    +   STEP 3 Note that the text.split part has the brackets, quotes, followed by
    closing quotes. The space is the separator, indicating that each list entry is
    separated by a space. Likewise, CSV (Comma Separated Value) are separated by a
    comma, so you''d use:

