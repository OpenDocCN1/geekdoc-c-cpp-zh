    \ std; |\n| 5 | |\n| 6 | int num = 0; |\n| 7 | | |\n| 8 | while (num < 30) { |\n\
    | 9 | cout << \"Number: \" << num << endl; |\n| 10 | num++; |\n| 11 | } |\n| 12\
    \ | | |\n| 13 | return 0; |\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_126_1.png)\n\
    \n## 步骤 10\n\n`Sleep()` 将以毫秒运行，所以 `Sleep(1000)` 是十秒。结合头文件，while 循环将帮助你完成一些有趣的倒计时。\n\
    \n```cpp\n#include <iostream>\n#include <windows.h>\nusing namespace std;\nint\
    \ main()\n```\n\n```cpp\nint a = 10;\nwhile (a != 0) {\n    cout << a << endl;\n\
    \    a = a - 1;\n    Sleep(1000);\n}\ncout << \"\\nBlast Off!\" << endl;\nreturn\
    \ 0;\n```\n\n## For 循环\n\n在某些方面，for 循环的工作与 while 循环非常相似，尽管它的结构不同。for 循环分为三个阶段：初始化、条件和增量。一旦设置好，循环就会重复，直到条件变为假。\n\
    \n## 循环\n\nfor 循环的初始化阶段只执行一次。循环评估条件判断是真还是假，增量步骤执行第二和第三阶段。\n\n- **步骤 1** 使用标准头文件创建一个新的\
    \ C++ 文件：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \n}\n```\n\n- **步骤 2** 开始一个简单的 for 循环，从 1 计数到 30，每次增量时显示值：\n\n```cpp\n//For Loop\
    \ Begins\nfor (int num = 1; num < 30; num = num + 1) {\n    cout << \"Number:\
    \ \" << num << endl;\n}\nreturn 0;\n```\n\n- **步骤 3** 执行 for 循环的过程，创建一个整数 `num`\
    \ 并将其赋值为 1。接下来，设置条件，在这种情况下将 `num` 设置为 30。最后一个阶段是循环增加的地方；这里 `num` 的值被加了1。\n\n```cpp\n\
    //For Loop Begins\nfor (int num = 1; num < 30; num = num + 1) {\n}\n```\n\n- **步骤\
    \ 4** 循环结束后，你在花括号中创建复合语句，它显示整数的当前值。每当 for 重复时，它执行第二和第三阶段，直到条件 `<30` 为假。循环随后结束，代码继续，接近\
    \ `return`。\n\n```cpp\n//Forloop.cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    cout << \"Number: \" << num << endl;\n\n    return 0;\n}\n```\n\
    \n- **步骤 5** 循环在 C++ 中是一个非常整洁的包，包含在括号内，循环的其他元素显示在下方。如果你想创建一个 10 秒的倒计时，可以使用：\n\n\
    ```cpp\n#include <iostream>\n#include <windows.h>\nusing namespace std;\nint main()\
    \ {\n\n//For Loop Begins\nfor (int a = 10; a != 0; a = a - 1) {\n    cout << a\
