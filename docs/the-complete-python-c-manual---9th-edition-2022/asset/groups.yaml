- md: "\n# Formatting Strings\n\nWhen you work with data, creating lists, dictionaries\
    \ and objects you may want to print out the results. Merging strings with data\
    \ is easy especially with Python 3, as in earlier versions of Python tended to\
    \ complicate matters.\n\n## STRING FORMATTING\n\nSince Python 3, string formatting\
    \ has become a much neater process, using the .format function combined with curly\
    \ brackets. It's a more logical and better approach than previous.\n\n- STEP 1\n\
    The basic formatting in Python is to call each variable into the string brackets:\n\
    ```python\nname=\"Conan\"\nprint(\"The barbarian hero of the Hyborian Age is:\
    \ {}\".format(name))\n```\n\n- STEP 3\nYou can also include integers into the\
    \ mix:\n```python\nnumber=100000\nprint(\"{} was a skilled mercenary, and thief\
    \ too. He once stole {} gold from a merchant.\".format(name, number))\n```\n\n\
    ```\npython3.4.2 Shell\nEdit Save Debug Help Windows help\nPython 3.4.2 (default),\
    \ Oct 10 2014, 13:31:13\n>>> name=\"Conan\"\n>>> print(\"credits\" or \"license\"\
    \ for more information.\n>>> name=\"Conan\"\n>>> print(\"The barbarian hero of\
    \ the Hyborian Age is: {}\".format(name))\n'The barbarian hero of the Hyborian\
    \ Age is: Conan'\n```\n\n- STEP 2\nRemember to close the print function with sets\
    \ of brackets, as you've encased the variable in one, and the print in another.\
    \ You can include multiple types of string in a single function:\n```python\n\
    name=\"Conan\"\nplace=\"Cimmeria\"\nprint(\"{} hailed from the North, in a cold\
    \ land known as {}\".format(name, place))\n```\n\nThere are many different ways\
    \ to apply string formatting, some are quite simple, as we've shown you; here\
    \ it depends on what you want from your program. A guide to reference frequently\
    \ string formatting is the Python Docs webpage, found at docs.python.org/3/library/string.html.\
    \ Here, you will find:\n\n```\npython3.4.2 Shell\nEdit Save Debug Help Windows\
    \ help\nPython 3.4.2 (default), Oct 10 2014, 13:31:13\n>>> name=\"Conan\"\n>>>\
    \ print(\"credits\" or \"license\" for more information.\n>>> name=\"Conan\"\n\
    >>> print(\"{} hailed from the North, in a cold land known as {}\".format(name,\
    \ place))\n'Conan hailed from the North, in a cold land known as Cimmeria'\n```\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_53_0.png)\n\n# Formatting Strings\n\
    \n- STEP 5 Interestingly you can reference a list using the formatting function.\
    \ You can also place an asterisk in front of the list name:\n\n```python\nnumbers=1,\
    \ 3, 45, 567546, 3425346345\nprint(\"* names: {}, {}, {}, {}, {}\")\nprint(\"\
    .format(numbers))\n```\n\n```\nPython 3.4.2\nEdit Shell Debug Options Window\n\
    Python 3.4.2 (default, Oct 19 2014, 13:21:11)\n(SCCP 4.6.1) on Windows\ntype=\"\
    copyright\" or \"license\" for more information.\n>>> print(\"* numbers: {0},\
    \ {1}, {2}, {3}, {4}\").format(numbers)\n* numbers: 1, 3, 45, 567546, 3425346345\n\
    ```\n\n- STEP 8 You can also print the content of a user's input in the same fashion:\n\
    \n```python\nname=input(\"What's your name? \")\nprint(\"Hello {0}!\".format(name))\n\
    ```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_0.png)\n\n- STEP 6 With indexing\
    \ in lists, the same applies to calling a list using string formatting. You can\
    \ index each item according to its position (from 0 to many are present):\n\n\
    ```python\nnumbers=1, 4, 2, 9\nprint(\"* numbers: {0}, {1}, {2}\")\nprint([1].format(numbers))\n\
    ```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_1.png)\n\n- STEP 9 You can\
    \ extend this simple code example to display the first letter in a person entered:\n\
    \n```python\nname=input(\"What's your name? \")\nprint(\"Hello {0[0]}!\".format(name))\n\
    print(\"The first letter of your name is a {0[0]}\")\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_2.png)\n\
    \n- STEP 7 And as you probably suspect, you can mix strings-and integers in a\
    \ single list to be called in the format function.\n\n```python\ncharacters=[\"\
    Conan\", \"Belit\", \"Valeria\", 19, 27, 20]\nprint(\"{0} is {3} years old. Whereas\
    \ {1} is {4} years old.\".format(characters))\n```\n\n- STEP 10 You can also call\
    \ a list of pairs and reference individually within the same print function. Looking\
    \ back at the code from Step 7, you can alter it with:\n\n```python\nnames=[[\"\
    Conan\", 25, 21], [\"Belit\", 22]]\nCreating lists. You can call each list, and\
    \ individual items:\nprint(\"{0[0]} is {0[1]} years old. Whereas {1[0]} is {1[1]}\
    \ years old.\".format(names))\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_3.png)\n\
    \n# Working with Data\n\n## Date and Time\n\nWhen working with date it's often\
    \ handy to have access to the time. For example, you may want to time-stamp an\
    \ entry when a user logged into the system and for how long. Luckily acquiring\
    \ the date and time is easy, thanks to Time module.\n\n# TIME\n\nThe time module\
    \ contains functions that help you retrieve the current time, reads the date from\
    \ strings, formats the date and time.\n\n- STEP 1 If you need to import the time\
    \ module. it's built-in to Python 3 so you shouldn't need to drop into and call\
    \ the current date and time with a simple command:\n\n```python\nimport time\n\
    time.asctime()\n```\n\n- STEP 3 You can see the structure of how time is presented\
    \ by time.local_time(). The output is displayed as: 'time_struct(tm_year=2017,\
    \ tm_mon=9, tm_day=7, tm_hour=9, tm_min=6, tm_sec=13, tm_wday=3, tm_yday=25, is_dst=0)';\
    \ dependent on your current time as opposed to the above.\n\n```\nPython 3.4.2\
    \ Shell\nEdit Debug Options Windows help\nPython 3.4.2 (default, Oct 19 2014,\
    \ 13:31:51)\n[GCC 4.9.0] on Linux\n>>> type(\"help\") or \"license\") for more\
    \ information.\n>>> time.asctime()\n'Wed Oct 07:44:26 2014'\n```\n\n- STEP 2 The\
    \ time is split into nine tuples, which are divided into indexed tuples, as any\
    \ other tuple. There are numerous functions built into the time module. One of\
    \ the most common of these is str(). With it'll be able to present a wide range\
    \ of arguments as it converts the time into a string. For example, to display\
    \ the current day of the week you can:\n\n| Index | Field | Values |\n| --- |\
    \ --- | --- |\n| 0 | 4-digit year | 2016 |\n| 1 | Month | 1 to 12 |\n| 2 | Day\
    \ | 1 to 31 |\n| 3 | Hour | 0 to 23 |\n| 4 | Minute | 0 to 59 |\n| 5 | Second\
    \ | 0 to 61 (leap seconds) |\n| 6 | Day of Week | 0 to 6 (0 is Monday) |\n| 7\
    \ | Day of year | 0 to 366 (Julian day) |\n| 8 | Daylight savings | -1, 0 means\
    \ DST |\n\n```\nPython 3.4.2 Shell\nEdit Debug Options Windows help\nPython 3.4.2\
    \ (default, Oct 19 2014, 13:31:51)\n[GCC 4.9.0] on Linux\n>>> type(\"help\") or\
    \ \"license\") for more information.\n>>> time.local_time()\ntime_struct(tm_year=2017,\
    \ tm_mon=9, tm_day=7, tm_hour=9, tm_min=6, tm_sec=13, tm_wday=3, tm_yday=25, is_dst=0)\n\
    >>> time.strftime(\"%A\")\n'Wednesday'\n```\n\n# Date and Time\n\n- STEP 5 This\
    \ naturally means you can incorporate various into your code, such as:\n\n```python\n\
    time.strftime(\"%Y\")\ntime.strftime(\"%m\")\ntime.strftime(\"%d\")\ntime.strftime(\"\
    %H\")\ntime.strftime(\"%S\")\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_56_0.png)\n\
    \n- STEP 8 You saw at the end of the previous section, in users wanted, you can\
    \ picture how many decimal places in Python. Take the code from above and alter\
    \ it slightly by including:\n\n```python\nstart_time.time()\n```\n\nThen's:\n\n\
    ```python\nendtime.time()-start_time\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_56_1.png)\n\
    \n- STEP 6 Note the two hours and minutes, with %H and %H%M, you can also see\
    \ the hours and minutes, and the last entries, entering them as %YH%M doesn't\
    \ display the time correctly in the Shell. You can easily rectify this with:\n\
    \n```python\ntime.strftime(\"%H:%M:%S\")\n```\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_56_2.png)\n\
    \n- STEP 9 The output will look like the screenshot below. The function needs\
