    # How to Set Up Python on a Mac


    If you''re running an Apple Mac, then setting up Python is incredibly easy. In
    fact, a version of Python is already installed. However, you should make sure
    you''re running the latest version.


    ## INSTALLING PYTHON


    Apple''s operating system comes with Python installed, so you don''t need to install
    it separately. However, Apple doesn''t update Python very often and you''re probably
    running an older version. So it makes sense to check and update first.


    - **STEP 1** Open a new Terminal by clicking Go > Utilities, then double-click
    the icon. Now enter: version You will see Python "2.5.1" or even later, if Apple
    has updated the OS and Python installation. Either way, it''s best to check for
    the latest.

    - **STEP 2** Open Safari and head over to **www.python.org/downloads**. As with
    the Windows procedure on the previous pages, you can see two buttons: for 3.6,
    and the other for 2.7. Note that version numbers may be different.

    - **STEP 3** Click on the latest version of Python 3.x, or in case this is the
    download button for Python 3.6.2. This will automatically download and depending
    on how you''ve got your Mac configured, it automatically starts the installation.

    - **STEP 4** With the Python installation wizard, open, click Continue. It''s
    worth a moment to read the Important section, in case it refers to something about
    your version. When you''re ready, click on again.


