    # PLAYING WITH PYTHON


    With most languages, computer or human, it''s all about remembering and applying
    the right words to the right situation. You''re not born knowing these words,
    so you need to learn them.


    - STEP 1 If you''ve closed Python IDLE, reopen it in whichever operating system
    version you prefer. In the Shell, enter the following:


    ```

    print("Hello")

    ```


    ```

    Python 3.4.2 Shell

    File Edit Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    GC 4.9.1 on Windows

    >>> type("", "credits" or "license") for more information.

    >>> print("Hello")

    Hello

    >>> print(2+2)

    4

    ```


    - STEP 2 Just as predicted, the word Hello appears in the Shell as text, indicating
    output from a string. It''s fairly straightforward and doesn''t need too much
    explanation. Now you try:


    ```

    print("2+2")

    ```


    - STEP 3 You can see that instead of the number 4, the output is 2+2 you asked
    to be printed to the Shell. The question marks are defining what''s being printed
    out to the IDLE Shell; to print the total of 2+2 you need to remove the quotes:


    ```

    print(2+2)

    ```


    ```

    Python 3.4.2 Shell

    File Edit Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    GC 4.9.1 on Windows

    >>> type("", "credits" or "license") for more information.

    >>> print("Hello")

    Hello

    >>> print(2+2)

    4

    ```


    - You can continue as such, printing 2+2, 464+2343 and so on to the Shell. An
    easy way is to use a variable, which is something we will cover in more depth
    later. For now, enter:


    ```

    a=2

    b=2

    ```


    ```

    Python 3.4.2 Shell

    File Edit Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

