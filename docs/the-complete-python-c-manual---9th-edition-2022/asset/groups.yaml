    # 字符串格式化


    当你处理数据、创建列表、字典和对象时，你可能想要输出结果。将字符串与数据合并非常简单，特别是在 Python 3 中，而在早期的版本中，往往会让问题变得复杂。


    ## 字符串格式化


    从 Python 3 开始，字符串格式化变成了一个更加整洁的过程，使用了 `.format()` 函数结合大括号。这是一种比以前更具逻辑性、也更好的方法。


    - 步骤 1

    Python 中的基本格式化是将每个变量调用到字符串括号中：

    ```python

    name="Conan"

    print("The barbarian hero of the Hyborian Age is: {}".format(name))

    ```


    - 步骤 3

    你也可以将整数包含在其中：

    ```python

    number=100000

    print("{} was a skilled mercenary, and thief too. He once stole {} gold from a
    merchant.".format(name, number))

    ```


    ```

    python3.4.2 Shell

    Edit Save Debug Help Windows help

    Python 3.4.2 (default), Oct 10 2014, 13:31:13

    >>> name="Conan"

    >>> print("credits" or "license" for more information.

    >>> name="Conan"

    >>> print("The barbarian hero of the Hyborian Age is: {}".format(name))

    ''The barbarian hero of the Hyborian Age is: Conan''

    ```


    - 步骤 2

    记住用括号对关闭 `print` 函数，因为你已经把变量封装在一个括号中，并将打印封装在另一个括号中。你可以在单个函数中包含多种类型的字符串：

    ```python

    name="Conan"

    place="Cimmeria"

    print("{} hailed from the North, in a cold land known as {}".format(name, place))

    ```


    应用字符串格式有许多不同的方法，有些非常简单，正如我们所展示的样；这里取决于你想要从程序得到什么。经常参考字符串格式化的指南是 Python 文档网页，地址为
    docs.python.org/3/library/string.html。在这里处，你将找到：


    ```

    python3.4.2 Shell

    Edit Save Debug Help Windows help

    Python 3.4.2 (default), Oct 10 2014, 13:31:13

    >>> name="Conan"

    >>> print("credits" or "license" for more information.

    >>> name="Conan"

    >>> print("{} hailed from the North, in a cold land known as {}".format(name,
    place))

    ''Conan hailed from the North, in a cold land known as Cimmeria''

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_53_0.png)


    # 字符串格式化


    - 步骤 5 有趣的是，你可以使用格式化函数引用列表。你可以在列表名称前面放置一个星号：


    ```python

    numbers=1, 3, 45, 567546, 3425346345

    print("* names: {}, {}, {}, {}, {}")

    print(".format(numbers))

    ```


    ```

    Python 3.4.2

    Edit Shell Debug Options Window

    Python 3.4.2 (default, Oct 19 2014, 13:21:11)

    (SCCP 4.6.1) on Windows

    type="copyright" or "license" for more information.

    >>> print("* numbers: {0}, {1}, {2}, {3}, {4}").format(numbers)

    * numbers: 1, 3, 45, 567546, 3425346345

    ```


    - 步骤 8 你也可以以相同的方式打印用户输入的内容：


    ```python

    name=input("What''s your name? ")

    print("Hello {0}!".format(name))

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_0.png)


    - 步骤 6 结合列表索引，同样适用于使用字符串格式化调用列表。你可以根据位置对每个项进行索引（从 0 开始取决于有多少项）：


    ```python

    numbers=1, 4, 2, 9

    print("* numbers: {0}, {1}, {2}")

    print([1].format(numbers))

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_1.png)


    - 步骤 9 你可以扩展这个简单的代码示例来显示输入的人名的第一个字母：


    ```python

    name=input("What''s your name? ")

    print("Hello {0[0]}!".format(name))

    print("The first letter of your name is a {0[0]}")

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_2.png)


    - 步骤 7 正如你可能猜的那样，你可以将字符串和整数混合在一个列表中，并在格式函数中调用。


    ```python

    characters=["Conan", "Belit", "Valeria", 19, 27, 20]

    print("{0} is {3} years old. Whereas {1} is {4} years old.".format(characters))

    ```


    - 步骤 10 你也可以在同一个 `print` 函数中单独调用列表对。回看步骤 7 的代码，你可以这样修改它：

    ```python

    names=[["Conan", 25, 21], ["Belit", 22]]

    创建列表。你可以调用每个列表和单独的项目：

    print("{0[0]} is {0[1]} years old. Whereas {1[0]} is {1[1]} years old.".format(names))

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_54_3.png)


    # 处理数据


    ## 日期和时间


    在处理日期时，访问时间非常方便。例如，你可能在用户登录系统时需要时间戳。多亏有 `time` 模块，获取日期和时间很容易。


    TIME 模块包含了帮助你检索当前时间的函数、从字符串中读取日期以及格式化日期时间。


    - 步骤 1 如果你需要 `import time` 模块。它是 Python 内置的，所以你只需要用简单的命令调用当前日期和时间：


    ```python

    import time

    time.asctime()

    ```


    - 步骤 3 你可以通过 `time.local_time()` 查看时间的结构。输出显示为：`time_struct(tm_year=2017, tm_mon=9,
    tm_day=7, tm_hour=9, tm_min=6, tm_sec=13, tm_wday=3, tm_yday=25, is_dst=0)` 取决于你的当前时间。


    ```

    Python 3.4.2 Shell

    Edit Debug Options Windows help

    Python 3.4.2 (default, Oct 19 2014, 13:31:51)

    [GCC 4.9.0] on Linux

    >>> type("help") or "license") for more information.

    >>> time.asctime()

    ''Wed Oct 07:44:26 2014''

    ```


    - 步骤 2 时间被拆分为九个元组，分为索引的元组。`time` 模块中有很多函数。其中最常用的之一是 `str()`。它能将时间转换为字符串。例如，要显示当前的星期，你可以：


    | 索引 | 字段 | 值 |

    | --- | --- | --- |

    | 0 | 四位年份 | 2016 |

    | 1 | 月份 | 1 到 12 |

    | 2 | 日 | 1 到 31 |

    | 3 | 小时 | 0 到 23 |

    | 4 | 分钟 | 0 到 59 |

    | 5 | 秒 | 0 到 61 (闰秒) |

    | 6 | 星期 | 0 到 6 (0 是周一) |

    | 7 | 年日 | 0 到 366 (儒日) |

    | 8 | 夏令时 | -1, 0 表示 DST |


    ```

    Python 3.4.2 Shell

    Edit Debug Options Windows help

    Python 3.4.2 (default, Oct 19 2014, 13:31:51)

    [GCC 4.9.0] on Linux

    >>> type("help") or "license") for more information.

    >>> time.local_time()

    time_struct(tm_year=2017, tm_mon=9, tm_day=7, tm_hour=9, tm_min=6, tm_sec=13,
    tm_wday=3, tm_yday=25, is_dst=0)

    >>> time.strftime("%A")

    ''Wednesday''

    ```


    # 日期和时间


    - 步骤 5 这意味着你可以将各种内容整合到代码中，例如：


    ```python

    time.strftime("%Y")

    time.strftime("%m")

    time.strftime("%d")

    time.strftime("%H")

    time.strftime("%S")

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_56_0.png)


    - 步骤 8 你在上一节的末看到，在用户想要的情况下，你可以想象 Python 中的小数点位数。取上面的代码并稍稍修改它，包含：


    ```python

    start_time.time()

    ```


    然后是：


    ```python

    endtime.time()-start_time

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_56_1.png)


    - 步骤 6 注意两个小时和分钟，通过 `%H` 和 `%H%M`，你也可以看到小时和分钟以及最后的项，将它们输入为 `%YH%M` 不会在 Shell 中正确显示时间。你可以通过以下方式轻松纠正：


    ```python

    time.strftime("%H:%M:%S")

    ```


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_56_2.png)


    - 步骤 9 输出将像下面的截图所示。函数需要在输入语句的任意侧，因为当变量名正在创建时，取决于用户花费了多久登录系统。时间的长度显示在代码的最后。


    ![](img/8b33dbf2a2ef620c5ea6844ae78b2983_56_3.png)


    ```python

    login.py - Documents/Python/login.py (3.4.2) - #

    import time

    startime=time.time()

    name=input("Enter login name: ")

    endtime=time.time()

    print("User " + name + ", logged in at " + time.strftime("%H:%M:%S") +

    "to login to their account.")

    ```


