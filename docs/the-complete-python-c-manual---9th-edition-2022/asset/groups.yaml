    闰年数量：\n>>> leaps=calendar.leapdays(1900, 2018)\n>>> print(leaps)\n```\n\n结果是 2，从\
    \ 1994 年开始。\n\n```python\nPython 3.2.2 (default, Oct 19 2014, 13:31:11)\n[GCC\
