- md: "\n# Equipment Needed\n\nYou don't need to invest a huge amount of money in\
    \ order to learn C++ and you don't need an entire computing lab at your disposal\
    \ either. Providing you have a fairly modern computer, everything else is freely\
    \ available.\n\n# C++ SETUPS\n\nMost, if not all, operating systems have C++ in\
    \ their code, so it stands to reason that you can learn to program in C++ no matter\
    \ what OS you're currently using.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_85_0.png)\n\
    \n# COMPUTER\n\nUnless you fancy writing out your C++ code by hand on a sheet\
    \ of paper (which is something many older coders used to do), a computer is an\
    \ absolute must. PC users can have any recent Linux distro or Windows OS; Mac\
    \ users the latest macOS.\n\n# AN IDE\n\nJust as with Python, an IDE is used to\
    \ enter and execute your C++ code. Many IDEs come with extensions and plugins\
    \ that help it work better, or add an extra layer of functionality. Often, an\
    \ IDE provides enhancements depending on the core OS being used, such as being\
    \ enhanced for Windows 10.\n\n# COMPILER\n\nA compiler is a program that converts\
    \ the C++ language into binary, so that the computer can understand. While some\
    \ IDEs come with a compiler built-in, others do. Code:Blocks is our favourite\
    \ IDE that comes with a C++ compiler as part of the package. On this later,\n\n\
    # TEXT EDITOR\n\nSome programmers much prefer to use a text editor to assemble\
    \ their C++ code before running it through a compiler. Essentially you can use\
    \ any text editor to write code, just save it with a .cpp extension. However,\
    \ Notepad++ is one of the best text editors available.\n\n# INTERNET ACCESS\n\n\
    While it is possible to learn how to code on a computer that's not attached to\
    \ the internet, it is extraordinarily difficult. You need to install relevant\
    \ software, keep it up to date, install any extras or extensions for help when\
    \ coding. All of these require access to the Internet.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_85_1.png)\n\
    \n# TIME AND PATIENCE\n\nYes, as with Python, you're going to need aside significant\
    \ time to spend on learning how to code in C++. Likewise, unless you're a genius,\
    \ it's not going to happen overnight, or even a week. A good C++ coder has spent\
    \ many years honing their craft, so be patient, start small and keep learning.\n\
    \n# OS SPECIFIC NEEDS\n\nC++ will work in any operating system but getting all\
    \ the necessary pieces together can be confusing to a newcomer. Here are some\
    \ OS specifics for C++..\n\n# LINUX\n\nLinux users are lucky in that they already\
    \ have a compiler and text editor built into their operating system. Any text\
    \ editor allows you to type out C++ code, when it's saved with a .cpp extension,\
    \ use g++ to compile it.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_0.png)\n\
    \n# WINDOWS\n\nWe have mentioned previously that a good IDE is Microsoft's Visual\
    \ Studio. However, a better IDE and compiler is Code::Blocks, which is regularly\
    \ kept up to date with a new release twice a year. Other Windows users can enter\
    \ their code in Notepad++, then compile it with MinGW as used by Code::Blocks.\n\
    \n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_1.png)\n\n# RASPBERRY PI\n\nThe\
    \ Raspberry Pi's operating system is Raspian, which is Linux based. Therefore,\
    \ you're able to write your code using a text editor, then compile it with g++\
    \ as you would in any other Linux distro.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_2.png)\n\
    \n# MAC\n\nMac owners will need to download and install Xcode to be able to compile\
    \ their C++ code natively. Other options for the MAC include Netbeans, Eclipse\
    \ or Code::Blocks. Note: the latest Code::Blocks isn't available for Mac due to\
    \ a lack of Mac developers.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_86_3.png)\n\
    \n# How to Set Up C++ in Windows\n\nWindows users have a wealth of choice when\
    \ it comes to programming in C++. There are plenty of IDEs and compilers available,\
    \ including Visual Studio from Microsoft. However, in our opinion, the best C++\
    \ IDE to begin with is Code::Blocks.\n\n## Code::BLOCKS\n\nCode:Blocks is a free\
    \ C++, C and Fortran that feature rich and easily extensible with plug-ins. It's\
    \ easy to use, with a compiler and a vibrant community behind it.\n\n### STEP\
    \ 1\nStart by visiting the Code:Blocks download site, at www.codeblocks.org/downloads.\
    \ From there, click on the 'Download the binary releases' link to be taken the\
    \ latest downloadable version for Windows.\n\n![](img/8b33dbf2a2ef620c5ea6844ae78b2983_87_0.png)\n\
    \n### STEP 3\nWhen you've located the file, click on the Sourceforge.net link\
    \ to open the download window appears at the end of the line and click Save\n\n\
