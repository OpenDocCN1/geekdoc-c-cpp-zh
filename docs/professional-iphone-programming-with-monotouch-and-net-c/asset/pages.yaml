  md: "# Understanding the Linker\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_60_0.png)\n\
    \n# FIGURE 2-15\n\nApplications that debug-enabled have extra settings enabled\
    \ in the configuration. You can view these settings by tapping on Settings and\
    \ then the name of your application. You will see a screen that looks like Figure\
    \ 2-17. You want to make sure that the IP address that popped up in the debugging\
    \ window on your computer and the IP address shown in the device's debug matches\
    \ up.\n\nThe device may vibrate when it is in debug mode. This is a way for MonoTouch\
    \ to tell you that there is a problem, and the problem depends on how many vibrations\
    \ you get:\n\n+   - One vibration: The application could not connect to the machine\
    \ waiting for the device to connect.\n- Two vibrations: The application could\
    \ not post the host address that was configured.\n- Three vibrations: Standard\
    \ streams (stdout and stderr) could not be set up.\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_60_1.png)\n\
    \n# FIGURE 2-16\n\n| O2-UK | 22:26 | 100% |\n|---|---|---|\n| Settings | CodeExampleDebugi...\
    \ | |\n| Debug Settings | Enabled | ON |\n Debugger Host | 192.168.1.64 |\n Debugger\
    \ Port | 10000 |\n Output Port | 10001 |\n\n# FIGURE 2-17\n\n> To enable debugging\
    \ on a device, you need to have the full version of MonoTouch and the correct\
    \ certificates installed. See \"Deploying Your Application\" later in this chapter\
    \ for more information.\n\n# UNDER THE LINKER\n\nBecause you can't re-use libraries\
    \ on the iPhone, every time you put a version of a MonoTouch application on a\
    \ device or to the App Store, you are also installing the Mono framework. You\
    \ are probably thinking that having the same Mono framework for every application\
    \ is a waste, and it would be if this were the case. MonoTouch actually uses a\
    \ linker tool to go through the Mono framework assemblies and remove the code\
    \ that isn't being used in your application. This means that each application\
    \ uses its own unique and stripped-down version of the Mono framework, so when\
    \ a new version of MonoTouch comes out, you don't have to upgrade every application\
    \ using"
  merge: -1
