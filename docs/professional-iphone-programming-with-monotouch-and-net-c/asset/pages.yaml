    # Saving an Image to the Photo Album


    To save an image to your picture library, you will want to instantiate a UIImage
    object. On the UIImage class there is a method called SaveToPhotosAlbum. The photo
    album has a special folder that is used for just images saved from external sources,
    such as Safari or through an application, and not taken from the built-in camera.


    The SaveToPhotosAlbum method takes a delegate to allow it to pass back the saved
    image or an NSError if an error occurs while trying to save the image. You can
    check to see if the NSError comes back as null; if this is the case, you know
    the image was saved successfully. Listing 10-8 shows how you would save a static
    file from the project to the photos album.


    > Make sure the image is included in the project and has its build action set
    to Content.'
