    The other thing that is important to customize to a user''s preference is the
    format used for display dates, times, and numbers. This is especially critical
    when the data can have a totally different meaning based on its format; for example,
    a date shown as 3/12 March 12th in the United States but the 3rd of December in
    other countries.


    Because MonoTouch C# code will be using the .NET Framework classes for string
    and date time handling, the methods need to respect the preferences by the user.
    The CultureInfo class in the System.Globalization is the .NET "equivalent" of
    NSLocale. The two properties CurrentCulture and CurrentUICulture use the .NET
    Framework which we use for formatting output.


