  md: '# TABLE 2-1 (continued)


    | ASSEMBLY | API COMPATIBILITY |

    | --- | --- |

    | System.Data.dll | .NET 3.5 with functionality such as System.CodeDom, XML config
    support, OleDb, Odbc removed |

    | System.Json.dll | Silverlight |

    | System.ServiceModel.dll | WCF stack as present in Silverlight. |

    | System.Transactions.dll | .NET 3.5; part of System.Data support |

    | System.Web.Services.dll | Basic web services from the .NET 3.5 profile, with
    the server features removed |

    | System.Xml.dll | .NET 3.5 |

    | System.Xml.Linq.dll | .NET 3.5 |

    | System.Linq | .NET 3.5 |


    Taken from www.MonoTouch.Net/Documentation/Assemblies

    MonoTouch product is growing with every release, so chances are that extra functionality
    will be included since the time of this writing. It will be worth checking the
    source of the table for any changes and updates.


    In addition to the .NET assemblies, MonoTouch provides the monotouch.dll assembly,
    which contains APIs that are bound against the Objective-C and C-based APIs. The
    key namespaces in our assembly as follows:


    +   * MonoTouch.ObjRuntime: This namespace provides the interop/bridge between
    the .NET/C# and the Objective-C world of the iPhone. This is discussed in Chapter
    11.

    * MonoTouch.Foundation: This namespace provides support for the data types necessary
    to communicate with the Objective-C world of the iPhone. Most types are directly
    mapped. For example, the NSObject base class is mapped to the MonoTouch.Foundation.NSObject
    class in C#. Some classes aren''t directly to to Objective-C class name NSArray.
    An NSArray maps to a typed array like UIViewController[] if the array has a ViewController.

    * MonoTouch.UIKit: This namespace provides a direct binding between the UIKit
    components in Cocoa Touch. This is done by providing .NET classes for each of
    the UIKit components. This is the namespace that developers spend most of their
    working with.


    > For developers, Cocoa Touch is an abstraction layer or API for building programs
    that run on the iPhone. Cocoa is the API used for building programs that run on
    the Mac OS operating system. Cocoa Touch can be thought of as Cocoa for the touch-based
    iPhone operating system. Read more about Cocoa in Chapter 14.'
