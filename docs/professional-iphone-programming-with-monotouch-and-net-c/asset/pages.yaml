  md: "To view images, you can drag a UIImageView into the design view using Interface\
    \ Builder or you can create a UIImageView in code. For this example, you create\
    \ a UIImageView in code.\n\nFirst you want to grab an image that you have from\
    \ your view. You can do this by using the static method From on the UIImage class,\
    \ passing the path to the file.\n\n> Make sure you have included your image in\
    \ the project and set the image's build action to Content; otherwise the image\
    \ will not show. You can do this by right-clicking on the image, going to Build\
    \ Action, and then selecting Content.\n\nYou next pass the image into the UIImageView\
    \ constructor. When you have created the new image view, you set the frame size\
    \ for the image. You can use the actual width and height from your image to make\
    \ it fits correctly. You can then add the image as a sub-view of the main window\
    \ to display it on the screen. Figure 10-1 shows the image in an image view on\
    \ the screen, and Listing 10-1 shows the code.\n\n# LISTING 10-1: Adding a simple\
    \ UIImageView in code\n\n```\npublic override bool FinishedLaunching(UIApplication\
    \ app, NSictionary options)\n{\n    var image = UIImage.FromFile(\"image.png\"\
    );\n    var imageView = new UIImageView(image);\n    imageView.Frame = new CGRect(0f,\
    \ 20f, image.Size.Width, image.Size.Height);\n    window.AddSubview(imageView);\n\
    \    window.MakeKeyAndVisible();\n    return true;\n}\n```\n\nAs well as being\
    \ able to display one image using the image view, you can view the image view\
    \ to animate through a series of images. To do this pass by passing an array of\
    \ UIImage objects and use the StartAnimating and StopAnimating methods to control\
    \ when the images are animating. You can set additional properties to determine\
