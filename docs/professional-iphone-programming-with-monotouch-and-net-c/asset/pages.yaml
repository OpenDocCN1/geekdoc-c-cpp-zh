  md: 'The CoreLocation framework is exposed in MonoTouch via the MonoTouch.CoreLocation
    namespace and deals with two types of information:


    +   - Location

    - Heading


    # Location


    The location of a device is expressed in latitude and longitude, and is typically
    determined by a GPS device. Consumer GPS devices were previously limited to bulky
    car navigation systems but are now small enough to fit inside a cell phone!


    Devices without GPS capability (for example, the original iPhone and the iPod
    Touch) can calculate location information using a combination of cell tower triangulation
    and Wi-Fi network lookups. A large portion of iPhone OS devices have some sort
    of Location Services capability that you can program against.


    Because CoreLocation uses these different technologies to determine the device''s
    position, the availability and accuracy of the data can vary. Devices with GPS
    capability can determine accurate latitude/longitude position under the right
    conditions (usually outdoors with a clear view of the sky). When GPS is unavailable
    and cell tower or Wi-Fi network information is used, the data is less accurate.
    Each data source offers differing levels of accuracy: from a few to ten kilometers.
    Location-enabled applications consider the accuracy of the data that they receive
    to ensure they don''t present misleading information. CoreLocation provides an
    accuracy estimate with each reading — the "margin of error" of the location in
    meters — which should be taken into account in your code.


    Sometimes CoreLocation will be unable to provide data — this could be due to a
    number of reasons:


    +   - GPS reading cannot be taken (user is inside or outside of range of GPS signals).

    - Other locations cannot be accessed (for example, cell towers or Wi-Fi network
    info).

    - The user has prevented CoreLocation from supplying data to your application.
    To prevent applications from accessing a user''s location without their knowledge,
    the operating system will ask for their permission before sending the data to
    your application. The warning in Figure 7-2 will be displayed the first times
    your application is used; after that the operating system remembers the user''s
    reference.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_172_0.png)


    FIGURE 7-2


    +   - The user has disabled Location Services. For battery-saving Location Services
    can be turned off in Settings. You should always check whether Location Services
    are available and for any error condition (including the user denying access)
    before using location data in your code. Use the boolean LocationServicesEnabled
    property of the'
