  md: '# CHAPTER 5 WORKING WITH DATA ON THE PHONE


    > One of the problems I ran into when working on this section was in creating
    examples with code that I was familiar with. My first thought was to create a
    series of examples using the Twitter.com API. Unfortunately, the Twitter.com API
    is based on REST and therefore there is no SOAP-based ASMX or WCF native solution
    to Twitter. I decided to use simple web services to illustrate the issues. The
    ASMX web service example was found through the MonoTouch site and its examples.
    The WCF web service was built on a sample found through the MonoTouch site as
    well; however, the WCF service was running on another computer within the network.


    After speaking with many other developers, I found a lot of new development being
    WCF; however, a large number of ASMX-based web services out there are currently
    used in production, so I decided that it was important to add a short section
    on ASMX-based web services.


    # Using SOAP


    SOAP refers to the Simple Object Access Protocol, which is a mechanism to exchange
    information in the form of web services over computer networks. SOAP is highly
    reliant on XML. Due to this reliance on standards and XML, SOAP is a natural tool
    to allow different systems to communicate. For example, a Windows-based system
    can easily communicate with a UNIX or mainframe system over HTTP without requiring
    the heavy layer of access software that is normally associated with such communication.
    One of the big advantages that SOAP is that developers are familiar with creating
    and using SOAP-based web services in Visual Studio. With .NET, ASMX- are as well
    as WCF-based web services that support SOAP.


    # Working with ASMX Web Services


    ASMX web services are the first mechanism in ASP.NET for building web services.
    ASMX web services operate with the Web Description Language (WSDL) and SOAP. Consuming
    an ASMX web service to operate with MonoTouch is similar in concept to consuming
    a WCF service to run in MonoTouch.


    > I do not have an ASMX web service to work with. Instead of creating one and
    potentially causing my DDoS attack on one of my services with an example application,
    I decided to use a simple web service that allows for converting Celcius to Fabrenheit
    and back.


    The next example takes a look at how to call an ASMX-based web service using MonoTouch.
    The steps are:


    +   1. Add the System.WebServices.dll to your project.


    +   2. Add a reference to the web service''s wsdl within a project. You do this
    by right-clicking the project and adding the location of the URL. The URL is http://www.w3schools.com/WebServices/TempConvert.asmx.
    The Add Reference dialog box is shown in Figure 5-2.'
