  md: "# CHAPTER 5 WORKING DATA ON THE IPHONE\n\non the physical device. SQLite uses\
    \ SQL (Structured Query Language) to interact with it. Another good feature of\
    \ SQLite is that it is 100 percent free.\n\nThis chapter is not meant to be an\
    \ introduction to the SQL language, databases, tables, columns, data types, foreign\
    \ keys, rows, or any other type database feature. The reader is expected to understand\
