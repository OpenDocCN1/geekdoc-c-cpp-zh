    # Messages and Methods


    To return to the part of Objective-C''s syntax that will probably look the most
    foreign to you, take a look at the square brackets "[...".


    Because Objective-C is built on top of C, and dot-notation (which is used in C#
    for various purposes, accessing an object''s members) is already used by C for
    accessing the values of a struct, something needs to be done to tell the compiler
    that you are using an Objective-C object and that you need to do something.


    The square brackets are what distinguish code. The general format is [variableName
    messageToSend];


    When the compiler sees the square brackets, it knows that you are entering Objective-C
    territory; specifically, that you''re sending a message to an object instance.


    Before continuing, let''s discuss "message sending",


    Pragmatically speaking (see "Academic versus Pragmatic Approaches," earlier in
    this chapter), "sending a message" to an object is basically the same as calling
    a method on a C# object. The purists will want to point out how different the
    technical underpinnings are, but for your purposes, it''s perfectly fine to say
    that sending messages is analogous to calling methods.


    While documenting, books, posts, and so on, you might also run into the "receiver."
    Again, pragmatically speaking, you can simply think of the "receiver" as your
    object instance.


    All however, when discussing Objective-C, if it''s written or said that, for example,
    "You''re sending the init message to your receiver," you can read it as, "You''re
    calling the object''s init method." If you say it out loud, you''ll get kicked
    out of the Objective-C club, but at least you''ll understand in C# what terms''s
    being said.


    Now, you also likely noticed that the line contained nested square brackets. In
    C#, this would be similar to chaining methods using dot-notation.


    To translate, you''d take this snippet of Objective-C:


    ```

    [variableName messageToSend] anotherMessageToSend();

    ```


    and translate it into C# like so:


    ```

    someVariable.SomeMethod().AnotherMethod();

    ```'
