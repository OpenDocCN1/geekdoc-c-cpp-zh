    # Translating Buttons


    Translating UButtons is slightly different than you might expect, a common way
    for setting a button''s Title property doesn''t work as you expect — it only sets
    the text value for one possible display of the button. If you internationalize
    a button''s title like this


    ```

    OkButton.Title.Text =

    NSButton.MainBundle.LocalizedString("OK","Affirmative");

    ```


    the translation will be displayed by first but will return to English (or whatever
    the base language is) when it is touched/enabled/disabled or any other state-change
    is applied.


    Buttons have six states (defined by the UIControlState: Normal, Disabled, Highlighted,
    Selected, Application, and Reserved) and each state can have its own text. To
    localize the button properly use the SetTitle() method so that all states reflect
    the localized text:


    ```

    OkButton.SetTitle(

    NSButton.MainBundle.LocalizedString("OK","Affirmative button"),

    UIControlState.Normal);

    CancelButton.SetTitle(

    NSButton.MainBundle.LocalizedString("Cancel","Negative button"),

    UIControlState.Normal);

    ```


    Alternatively, you could set the title for the other states, potentially different
    text on each state (although be careful not to make your user interface even more
    confusing by doing so):


    ```

    OkButton.SetTitle(

    NSButton.MainBundle.LocalizedString(

    "OK","Affirmative button"),

    UIControlState.Normal);

    OkButton.SetTitle(

    NSButton.MainBundle.LocalizedString(

    "OK (unavailable),","Affirmative button disabled"),

    UIControlState.Disabled);

    ```'
