  md: '# Radio Interfaces


    Radio interfaces represent a set of buttons that switch between views when a user
    taps them. These buttons are displayed on a tab bar at the bottom of the window,
    and each tap swaps to a different view without animating between the views. This
    type of interface works well for displaying non-hierarchical data. You can use
    a UITabBar to create a radio interface.


    A radio interface might be right for your application if:


    +   - You have a set of disparate screens. If your screens aren''t related in
    nature, you should consider building multiple applications to adhere to the concept
    of cooperative single-tasking.


    +   - Your views are siblings. That is, they don''t represent levels of a hierarchy
    of data, but rather various views into data that may or not overlap.


    +   - You have a small set of closely related subsets of functionality that can
    be accessed in any order. Each view requires a separate main view controller,
    so the partitioning functionality should consider the architecture.


    Figure 3-3 shows examples of radio interfaces.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_66_0.png)


    # Navigation Interfaces


    Navigation interfaces display a hierarchy of objects. Users tap controls to move
    toward specificity. The UINavigationController class is typically used to navigate
    a hierarchy of UIViewController instances. Changing between views animates the
    more specific view in the right, while the less specific view moves out toward
    the left. Moving back up the hierarchy animates the views in the other direction.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# CHAPTER 3 PLANNING YOUR APP''S UI: EXPLORING THE SCREEN CONTROLS


    A navigation interface might be right for your application if you have a set of
    hierarchical data or functionality that you''d like to allow users to traverse.
    If your data fits tree-like data structure, a navigation interface is likely appropriate,
    and follows standards established as part of the Cocoa Touch platform.

    Figure 3-4 shows examples of navigation interfaces.


    # Modal Interfaces


    A modal interface presents a supplemental view on top of a view. This is most
    useful when presenting secondary scenes, such as an editing screen. Modal interfaces
    are similar to navigation interfaces that they transition through a stack of views
    by animating them horizontally. Modal interfaces differ by transitioning new views
    onto the top of the stack by animating them vertically. A great example of a modal
    interface that is mixed with lots of different types of interfaces is the UIViewController.


    A model interface might be right for your application if you need to provide:


    +   - A workflow for working with data in multiple steps.

    - An editable interface for an onscreen view.

    - A secondary set of functionality that users can optionally engage while remaining
    in the text of the current view. For example, you can use a modal interface if
    you want to trigger the camera to take a photograph or choose a contact from your
    Address Book, and then provide the result to the current view.


    Figure 3-5 shows examples of modal interfaces.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_67_0.png)


    # Combination Interfaces


    You should always keep in mind that radio, navigation, and modal interfaces don''t
    have to be mutually exclusive. In fact, various types of interfaces provide users
    with multiple sets of hierarchical data for navigation. If you are familiar with
    any of the popular apps, you will see that the combination of interfaces is very
    common. Navigation and modal interfaces are easily combined to create an application
    that can navigate through one of several hierarchical data sets. You can recognize
    the modal-navigation interface by a tab bar at the bottom of the screen that switches
    between table views at the top of the screen.


    A combination interface might be right for your application if:


    +   - You have complex data or functionality that would benefit from the use of
    different user interfaces.

    - Your users will interact with your application using different modes for the
    same data set.'
