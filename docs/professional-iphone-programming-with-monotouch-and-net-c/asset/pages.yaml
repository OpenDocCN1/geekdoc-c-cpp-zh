    | BOOL | bool | |

    | IBAction | None | Used by Interface Builder to connect UI component "events"
    to Objective-C methods. |

    | IBOutlet | None | Used by Interface Builder to connect UI components to local
    instance variables in Objective-C classes. |

    | id | var/object | The go-anywhere-and-do-anything generic pointer. |

