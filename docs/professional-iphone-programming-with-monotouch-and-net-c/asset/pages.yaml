    # MOBILE DEVELOPMENT


    There are a number of important points to remember when developing for the iPhone,
    or for other mobile devices:


    +   - The iPhone is a mobile device and it has limited resources.

    Continually monitoring for notifications will use the battery.


    +   - There is a tradeoff between notifications and using device resources that
    provide value to a user interface. Don''t turn on features that are not needed.


    +   - The iPhone simulator will allow developers to build applications; however,
    it has the complete featureset, as the battery and device orientation.


    FIGURE 9-8


    System Name: iPhone OS

    System Version: 3.2

    Unique ID: Blanked for security

    Localized Model: iPhone Simulator

    Name: iPhone Simulator


    # SUMMARY


    The iPhone device has a number of interesting hardware features. These are exposed
    through the MonoTouch.UIKit.UIDevice.CurrentDevice and the Networkreachability
    classes. These allow developers to interact with acceleration, device orientation,
    the battery, networking, and system information. While a user is not interested
    in these features, they are important for developers. Developers can use these
    features to weave an exciting application for end users.'
