  md: 'To get started, you want to create a CABasicAnimation object from a specific
    key path. The key path that represents a CALayer property (when creating the animation,
    you are actually animating the Layer property of your object). A few examples
    of key paths would be position.y, transform.translation.x, and opacity. The following
    is a list of the possible properties that you can animate from a CALayer.


    +   - anchorPoint - masksToBounds

    - backgroundColor - opacity

    - borderColor - position

    - borderWidth - sublayers

    - bounds - subLayerTransform

    - contents

    - contentsRect - transform

    - cornerRadius - zPosition

    - doubleSided


    When you animate your layer, you use the key path and use From, To, and By properties
    to set up the animation.


    Because you want a label from the top of the screen to the bottom, you should
    first create the label and place it in view. To animate the label from the top
    of the view to the bottom of the view, you want to translate it on the Y-axis
    to 420 (which is near the bottom of the iPhone). When creating the CABasicAnimation
    object, you use the static method FromPath passing in transform.translation.y
    as the key path you will use. Setting the property to 420 allows you to move the
    420 pixels on the Y-axis. The From property expects an NSNumber, so you can use
    a float with NSNumber.FromFloat to method for this.

    All animations last an explicit amount of time, so you want to set the Duration
    property. For example it will be 3 seconds. You probably won''t want the label
    left at the bottom of the screen so you can set the AutoReverses property to true
    so that the animation finishes, it returns back to the top.


    Now that the animation has been created, you can apply it to the layer that you
    created. Every UIView has a Layer property that allows you to animate any UIView
    object you want. In this example, you will use the method AddAnimation on the
    Layer property and pass in your created animation and a unique key for the animation.
    Adding the animation to the layer starts the animation straight away.


    You might want to trigger an event when an animation starts or finishes. You can
    do this by creating your own AnimationDelegate class and using it as the delegate
    for the animation. You override both the AnimationStarted and AnimationStopped
    methods to update the label''s text to reflect the animation status.


    Listing 10-19 shows the code for a simple animation of the label animating from
    the top of the screen to the bottom of the screen and back again.'
