    # UITEXTFIELD


    UITextField class provides with single-line editing capabilities and has built-in
    support for editing secure data such as passwords or other sensitive items. When
    a user taps a text field, a keyboard appears; when a user taps Return in the keyboard,
    the keyboard disappears and the text field handles. UITextField supports overlay
    views to display additional information, such as a bookmarks icon. UITextField
    also provides a clear text that a user taps to erase the contents of the text
    field. Via the properties of the UITextField you can control the font, style,
    color, and alignment of the text.


    Here are some of the properties of the UITextField class:


    +   * Text: The actual text displayed by the textbox.


    +   * Placeholder: The text displayed when the user has not input actual text.
    You can use this as a visual cue to your user about what data you are expecting.


    +   * TextAlignment: Use the UITextAlignment enum to choose Left, Center, or Right.


    +   * TextColor: Assigns a named color (such as UIColor.Blue) or a System color
    (such as UIColor.DarkTextColor), or a From method to use any other color.


    +   * SecureTextEntry: Determines if a mask is used to hide the typed text.


    +   * AutocapitalizationType: Determines if the Shift key is automatically used
    (for example, at the start of typing and new sentences). The default is None.


    +   * Autocorrection: Shows whether auto-correction is enabled during typing.
    The default is correction.


    +   * ReturnKeyType: Note that UIText does not support the same Done editing behavior
    as UITextField.


    +   * KeyboardType: Allows the control to show a keyboard appropriate for the
    type of data you are expecting, for example, plain text, an e-mail address, or
    numeric data.


    The code using shows these properties:


