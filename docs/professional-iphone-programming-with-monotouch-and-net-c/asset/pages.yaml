  md: '# 13


    # Programming the iPad


    WHAT''S IN THIS CHAPTER?


    +   - Short history of the iPad

    - Learning how iPad differs from iPhone

    - Using some of the new controls

    - Building a Universal Application


    On January 27, 2010, Apple announced the eagerly anticipated iPad tablet computer
    running the iPhone OS, and on April 3 the device first went on sale. The iPad
    falls into a category between a laptop and a mobile phone. It is the first large-screen
    device from Apple that runs the iPhone Operating System, with roughly four times
    the screen area of the iPhone and iPad Touch.


    In this chapter you will learn the capabilities of the device are, what new APIs
    and controls have been introduced that you can use in iPad-specific applications,
    and how to build applications that can work on both iPad and iPhone devices.


    # THE IP DEVICE


    The iPad is a tablet computer running the iPhone Operating System. It has a 9.7-inch
    LED backlit multi-touch display and is powered by a 1-gigahertz ARM processor
    designed by Apple and referred to as the A4. Connectivity is supported via a 30-pin
    standard iPad connector, Bluetooth 2.1 support, and 802.11n Wi-Fi networking.
    A separate model adds support for 3G network connectivity. Figure 13-1 shows the
    iPad next to an iPhone, demonstrating the difference in the size of the screen
    and the on-screen keyboard.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# 278 CHAPTER 13 PROGRAMMING THE IPAD


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_307_0.png)


    FIGURE 13-1


    The biggest change with the iPad is its resolution of 1024x768 screen resolution.
    This is an increase from the iPhone and iPod Touch''s 480x320 resolution. The
    question for a developer is “What should I do with the additional screen real
    estate?” For a game application, the strategy will most likely involve providing
    more visual detail in the application, more control to the user, and status information
    within the game. For productivity applications, you can take advantage of some
    new controls and APIs.


    The iPad brings a variety of new hardware and user interface capabilities to the
    iPhone OS platform, such as:


    +   - Split views allow two custom views to be presented side-by-side. These can
    be used along with master views and navigation-based interfaces.

    - Popovers allow data to be presented on top of existing views in a temporary
    fashion. Popovers are useful for menus and palettes.

    - New presentation styles are available for modally presented views.

    - Toolbars can now be placed at the top and bottom of a view and can contain more
    information due to the increased screen size.

    - Gesture recognition is now part of the UIKit framework, making it easy to support
    pinch, pan, tap, rotate, and the long press in your applications.

    - Custom input views are now supported. The custom input slides up from the bottom
    of the screen when the view becomes the first responder (as the on-screen keyboard
    does). Previously, text fields and text views supported only the keyboard as the
    input view, but on the iPad you can provide your own custom input methods.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'Custom input accessory views are also available. An input accessory view is
    a view that is attached to the top of an input view (such as the Previous and
    Next buttons attached the keyboard when entering data on a web form in Safari).
    It slides in with the input view when the object becomes the first responder.
    This allows you to add a custom toolbar to the top of the virtual keyboard.


    There is no support for text display and input:


    +   - Sophisticated text display and layout has been added to the Core Text framework.

    - The UIKit framework includes enhancements to support custom views, a new UITextChecker
    class for spell checking, and support for new custom commands in editing menus.


    External displays and projectors can be detected and can be displayed on the off-screen.


    There is support for files and documents. This is needed for productivity style
    applications.


    The UIKit framework has been enhanced to support creating PDF content from an
    application.


    # WHAT MAKES AN IPAD APPLICATION?


    An iPhone OS identification identifies itself as an iPad via the UIDeviceFamily
    entry in the Info.plist configuration file. The number “1” indicates iPhone/iPad
    touch support, the number “2” indicates iPad support, and supplying both means
    the application runs on all iPhone devices.


    ```

    <UIDeviceFamily>

    <array>

    <string>1</string>

    <string>2</string>

    </array>

    ```


    When you create an iPad application in MonoTouch, this file and entry is created
    for automatically. You can choose to support iPhone, iPad, or both via the Project
    Options as shown in Figure 13-2, and the Info.plist entry is automatically adjusted.
    Unless otherwise specified, the examples in the chapter download all target the
    iPad only.


    | iPhone Application | Target devices: | iPhone and iPad |

    | --- | --- | --- |

    | Run | Development region | iPhone only |

    | General | | iPad only |


    FIGURE 13-2


    If you change this setting in a well-written existing iPhone application (that
    already has a flexible user interface) it should run at the full iPad resolution
    without further changes. This configuration-ration is the smallest possible difference
    between an iPhone and iPad application.


    Of course you want your iPad application to be optimized for the device — and
    the rest of this chapter shows you how to do it.'
