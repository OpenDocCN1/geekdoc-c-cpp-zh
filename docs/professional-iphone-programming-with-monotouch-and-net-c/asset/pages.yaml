    # Inputs & Values: The Inputs & Values provide a set of UI controls designed for
    input. These controls are:


    +   Segmented Control (UISmentedControl): The Segmented Control can be thought
    of as a button where different segments/parts of the button function as


    +   Label (UILabel): The Label is a control to display text.


    +   Round Rect Button (UIButton): The Round Rect Button control touches events.
    A touch event is like a “click” event in .NET. This is equivalent to a button
    in .NET.


    +   Text Field (UITextField): The Text field control allows users to add text
    or data through the virtual keyboard.


    +   Switch (UISwitch): The Switch control allows users to toggle values in a interface.
