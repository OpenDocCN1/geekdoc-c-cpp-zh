  md: '# Customizing Search Appearance


    There are a number of properties on the UISearchBar that you can use to customize
    the appearance and behavior of the search These properties include:


    +   - Placeholder: The "watermark" gray text that appears when the search is empty.


    +   - Prompt: Instructional text that appears above the search box when it is
    in.


    +   - Text: Allows you to pre-set the search text to a specific value.


    +   - KeyboardType: Used to specify which keyboard appears to type the search
    text (for example, EmailAddress, NumberPad or PhonePad if you are searching for
    specific data types).


    +   - AutocorrectionType: Whether or not the search text should be autocorrected.


    +   - AutocapizationType: Whether or not the search text should be autocapitalized.
    Regardless of this setting you should consider making your search case-insensitive
    as most users will not expect the search to fail because of different capitalization.


    +   - BarStyle: The color of the search bar (Default or Black).


    The following is an example of how to use these properties in FinishedLaunching;
    in this case the code sets the watermark text when the search input is empty:


    ```

    MySearchDisplayController.SearchBar.Placeholder = "Begin typing element...";

    ```


    You can set the other properties as required to reflect the type of data you are
    searching.


    # SUMMARY


    This chapter has covered one of the key user interface elements in the iPhone
    OS: the table. Tables are used throughout the operating system and building-applications.
    This chapter covered the essentials of using UITableView and related classes:


    +   - Display a simple list of data in a table


    +   - Change the appearance of table cells using built-in designs or creating
    a custom layout in Interface Builder


    +   - Use grouping and indexing to make a table easy to read and use


    +   - Implement DequeueReusableCell to improve performance


    +   - Add the ability to edit a table''s contents


    +   - Implement search functionality in a table


    Along the way you used Touch''s special UITableViewSource instead of Apple''s
    UITableViewDataSource and UITableViewDelegate and used the UINavigationController
    to create a hierarchical menu interface.'
