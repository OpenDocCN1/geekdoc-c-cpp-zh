  md: "UIDevice.CurrentDevice.BatteryMonitoringEnabled = false;\n\n}\n\nFound in the\
    \ DeviceSupport/Main.cs file of the download\n\n# # Using Battery Charge Events\n\
    \nJust like dealing with other parts of the iPhone’s hardware, some events are\
    \ based on changes in the iPhone’s battery. When the battery changes, an event\
    \ is fired. Listing 9-8 shows how to listen for a battery state change event.\n\
    \nIn this code, the UIDeviceBatteryStateDidChangeEventNotification is hooked up\
