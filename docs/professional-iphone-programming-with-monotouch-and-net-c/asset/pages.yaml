  md: '# Localizing for an International Audience


    WHAT''S IN THIS CHAPTER?


    +   - Defining internationalization and localization

    - Displaying translated text and images

    - Formatting dates, times, and numbers

    - Extracting text for translation


    Localization and internationalization sound similar; however, they describe different
    parts of the multilingual software development process.


    Internationalization describes the writing of software that supports multiple
    languages and display formatting. It is a task generally undertaken by software
    architects and developers and influences the way that applications store and represent
    their user interface and data. Attributes of internationalized code include:


    +   - All displayed text is stored separately from the code, so that it is easy
    to update.

    - Images, colors, and icons are easily updatable.

    - Sorting lists is language-sensitive.

    - Date and time formatting (and measurement) and time calculations take the current
    user''s settings into account.

    - Number and currency formats (symbols, commas, and points) are flexible and appropriate
    for the user.

    - Measurements (temperature, weight, distance) can be represented in different
    units.

    - Appropriate input and display of addresses, telephone numbers, and government
    identification numbers.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 260 | CHAPTER 12 LOCALIZING FOR AN INTERNATIONAL AUDIENCE


    It should be possible to release an internationalized application in many different
    countries/ languages, once it has been localized.


    Localization is the process of translating the text into a target language, updating
    images and other cultural references. It is a task usually performed by translators
    and/or native speakers of the target locale. Important aspects of localization
    include:


    +   * Translating the text into the target language.


    +   * Using appropriate cultural references (colors, imagery, writing style).

    * Providing parameters/guidance for localization such as tax rates and applicability
    (assuming the internationalization process for the application made it flexible
    enough to cope with such localization business rules).


    Globalization is another term that is sometimes used to describe both internationalization
    and localization. In .NET Framework the System.Globalization namespace contains
    the classes used to create multilingual applications.


    Figure 12-1 shows some of the built-in apps with different language and region
    settings. This chapter shows how to achieve similar results for your applications,
    vastly expanding the market for your iPhone OS applications!


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_289_0.png)


    FIGURE 12-1


    > The terms internationalization and localization are often shortened to i18n
    and l10n, respectively — the numbers refer to the number of characters between
    the first and last letter of each word.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# INTERNATIONALIZING AN APPLICATION


    To internationalize an application you must be able to:


    +   - Detect what language the user wants to view.

    - Detect regional settings (also known as locale) the user has selected.

    - Display all text, numbers, dates, imagery, colors, and so on according to those
    settings.

    - Accept and validate user input in their preferred language.


    The iPhone and your .NET SDK provide frameworks that will assist you with all
    of these tasks, as long as you structure your code to take advantage of them.
    This chapter focuses on the built-in iPhone OS internationalization and localization
    features that are exposed/supported by MonoTouch mentioning the .NET System.Globalization
    classes where relevant.


    # CHANGING LANGUAGE AND REGION SETTINGS


    You configure iPhone language and region information via the Settings > General
    > International screen.


    Changing the Language on your iPhone causes the operating system to display the
    Home screen with all text translated into the selected language. Applications
    that support that language will also display content in that language.


    > Choosing a language does not imply any particular region/locale settings.


    Enabling Keyboards on your iPhone allows different languages (and their corresponding
    characters) to be entered.


    Changing the Region Format on your iPhone affects the formatting of date, numbers,
    and the calendar.


    Before writing code that uses these settings, Figure 12-2 shows you how to change
    them on the simulator (many more unrelated options exist on a real device). It
    is easier to set the Region Format before changing languages, because a language
    change causes the operating system to reload the Home screen (which takes a second
    or two).


    Remember where these options are before you change your phone or simulator to
    a language you can''t read, otherwise it might be tricky to change them back to
    your native language. If you forget, you can always use the Reset Content and
    Settings menu option in the simulator.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '![](img/d823ede3f2031777391bbe3f48a2c8fa_291_0.png)


    The choices you make on these screens affect the way content is displayed by iPhone
    native classes and by .NET, which use the same standard to identify language and
    region. The standard consists of two:


    +   - Language code: The two-letter ISO 639-1 code is the preferred method to
    identify languages. Common examples are en for English, ja for Japanese, es for
    Spanish, fr for French, and de for German.

    - Region code: The two-character ISO 3166-1 code identifies a region or locale
    that speaks a particular language (for example, US for the United States, FR for
    France, and ES for Spain).


    The two values combined make a *locale*. Sometimes the region code is the same
    as the language code, for example fr-FR indicates French spoken in France and
    es-ES indicates Spanish spoken in'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Displaying Multiple Languages


    Spain. By contrast, some iPhone users will use fr-CA (French spoken in Canada)
    or es-US (Spanish spoken in the United States). Common region codes for English
    include en-US, en-GB, en-CA, en-AU, and en-NZ (for the United States, Great Britain,
    Canada, Australia, and New Zealand).


    In addition to locales defined by a language and region are some common locale
    tags as zh-Hans (simplified Chinese script) and zh-Hant (traditional Chinese script)
    aren''t linked to a specific region.


    > The locale identifies in the preceding text used the .NET formatting with a
    dash (-) separating the language and region. iPhone OS methods use an underscore
    (_) instead.

    Both formats are used in this chapter because some use MonoTouch methods calling
    into the iPhone framework and others use the .NET class libraries (in the System.Globalization
    namespace).

    Both follow the convention of lowercase for the language code and uppercase for
    the region code.


    # DISPLAYING MULTIPLE LANGUAGES


    Developers building applications without considering other languages frequently
    "hardcode" text into the application — in the case of the iPhone text could be
    in constants or variables, directly assigned to UIKit


    ```

    var greeting = "Hello world";

    MyLabel.Text = "First name:";

    ```


    or even embedded in the XIB files that define your views. Images, audio, and video
    resources may be "hardcoded." An application that has not been internationalized
    therefore cannot be localized (unless the developer was to go into the code and
    replace every language-specific piece with the equivalent in another language).


    The process of internationalizing requires the separation of text, images, and
    so on the code so that you can create different versions of content for each locale.
    Once you have separated the content you just need to load the correct values based
    on the user''s and locale settings.


    The iPhone OS facilitates internationalization with these features:


    +   - Language-specific (.proj) folders: You can place content, such as images
    and .strings files (more than one) in these folders and the operating system will
    know to look for them when the following two methods are called. The folders are
    named with the two-character language code for their contents, such as en.proj,
    and es.proj.

    - strings files: Specifically formatted files that contain translations for individual
    pieces of strings. The default file in each language-specific folder is called
    Localizable.strings.'
