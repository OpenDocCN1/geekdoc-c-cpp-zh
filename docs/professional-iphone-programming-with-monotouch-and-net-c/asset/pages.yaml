  md: "# DEBUGGING\n\nMonoTouch supports both debugging in the iPhone simulator and\
    \ debugging on the device. As you might expect, the debugging story is very similar\
    \ to debugging through Visual Studio and supports debugging with breakpoints,\
    \ catchpoints, inspection, watches, an an immediate/expression evaluator, all\
    \ call and stepping through code.\n\n# On the Simulator\n\nYou may have noticed\
    \ a similar icon next to the \"Run\" cog in MonoDevelop; however, this one contains\
    \ a green bug over the top (see Figure 2-13). The icon you use to run your application\
    \ in debug mode. If you want to use the keyboard to do this, press Cmd+Enter.\n\
    \n![](img/d823ede3f2031777391bbe3f48a2c8fa_59_0.png)\n\nYou set breakpoints through\
    \ MonoDevelop the same way you would in Visual Studio — by clicking the left of\
    \ the line to debug. When your application is running, it hits the breakpoint\
    \ and highlights the line in yellow. When you then hover over the variables, what\
    \ would expect to be able to do in debugging, inspect individual properties. You\
    \ can see this in Figure 2-14.\n\n```\ncsharp\nbutton.Frame = new CGRect(null);\n\
    button.SetTitle(\"My Button\", UIState.Normal);\n\nbutton.TouchUpInside += (sender,\
    \ e) => {\n\tttbutton.SetTitle(\"Clicked\", UIState.Normal);\n};\n```\n\n| | |\n\
    | button.Frame = new CGRect(null); |\n| button.SetTitle(\"My Button\", UIState.Normal);\
    \ |\n| button.TouchUpInside += (sender, e) => { |\n| ttbutton.SetTitle(\"Clicked\"\
    , UIState.Normal); |\n| };\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_59_1.png)\n\
    \n# On the Device\n\nDebugging on the device is similar to debugging on the simulator.\
    \ When you select the Debugi profile within MonoDevelop (shown in Figure 2-15),\
    \ you will be left with only the debug icon that is clickable. When you click\
    \ this, the application compiles in debug mode and uploads to the device that\
    \ is plugged in. It pops up a debugging window (shown in Figure 2-16) to show\
    \ what IP address and port the device is pointing to. This is how you will be\
