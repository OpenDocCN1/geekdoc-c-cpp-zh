  md: "# NETWORKING\n\nWhile most of the work of integrating with the iPhone device\
    \ is done through the .CurrentDevice class, networking is done through the NetworkReachability\
    \ class. The class checks for connectivity and returns a set of flags. See Listing\
    \ 9-6. The flags for network connectivity are not exclusive to each other.\n\n\
    # LISTING 9-6: Determining the connection to a web site\n\n```\nvoid HandleNetworkTouchUpInside(object\
    \ sender, EventArgs e) {\n    NetworkReachability nr = new NetworkReachability(\"\
    www.apple.com\");\n    NetworkReachabilityFlags flags = new NetworkReachabilityFlags();\n\
    \    nr.GetFlags(out flags);\n    NetworkingLabel.Text = String.Empty;\n    if\
    \ (flags & NetworkReachabilityFlags.IsWWAN) == NetworkReachabilityFlags.IsWWAN)\
    \ {\nNetworkingLabel.Text += \"IsWWAN\";\nNetworkingLabel.Text += \"Network Flag:\
    \ \" + flags.ToString();\n}\n```\n\nThe flags for network reachability are:\n\n\
    +   - ConnectionAuto: The connection happens automatically. This value for the\
    \ flag is an alias for ConnectionTraffic.\n- ConnectionOnDemand: The connection\
    \ happens when a connection is initiated. The connection will occur when a socket\
    \ connection is made.\n- ConnectionOnTraffic: The host is reachable. If data is\
    \ requested, a connection is made.\n- ConnectionRequired: The host is reachable;\
    \ however, a connection must be made.\n- InterventionRequired: A connection to\
    \ the host will require user intervention.\n- IsDirect: The connection is direct\
    \ and will not go through a gateway.\n- LocalAddress: The connection is to the\
    \ local device.\n- IsWWAN: The connection is made through a cellular connection,\
    \ such as EDGE or 3G.\n- Reachable: The host is reachable.\n- TransientConnection:\
    \ The host is reachable through a transient connection, such as PPP.\n\nTesting\
    \ the connections can be somewhat confusing. To test this, Miguel de Icalaza has\
    \ some code on the site at http://github.com/migueldecalaza/monotouch-samples/tree/master/reachability\
    \ to assist. The code allows for testing whether a host is available over WiFi\
    \ or a wireless phone network, which most developers need. Figure 9-5 shows output\
    \ when checking the host\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_228_0.png)"
