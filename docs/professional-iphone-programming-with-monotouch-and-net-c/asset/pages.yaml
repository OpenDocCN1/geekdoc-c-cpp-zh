    | --- | --- | --- | --- |

    | @synthesize | Properties | None | Found in the class implementation, @synthesize
    tells the compiler to automatically generate the getters and setters for a property.
    In C#, this is done on a case-by-case basis (property PropertyName ( get; set;)).
