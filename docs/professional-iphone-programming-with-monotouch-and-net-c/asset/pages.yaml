    # Editing an Image


    The image picker provides simple functionality to allow users to crop and edit
    an image after it has been picked. The image can be either a pre-existing image
    or an image taken from a camera. A rectangle shape is placed over the selected
    image within the image picker and provides the cut-off point for the cropped image.
    Despite the fact that users can crop their selected image, the original image
    is also kept for you to manipulate the way you would.


    To allow users to crop and edit their photos, you need to set the AllowsEditing
    property to true. There is also an AllowImageEditing property; however, this has
    been superseded by the AllowEditing property since the ability to edit and crop
    was added. Editing and cropping videos are discussed in the “Video” section later
    in this chapter.


    As in Listing 10-5, use the dictionary key to get the image reference from the
    dictionary of the newly edited image and the size of the editing rectangle shape.
    The additional keys that are added to the dictionary are UIPickerControllerEditedImage
    and UIPickerControllerCropRect. Even though the edited image is provided, store
    the original image as and when you object is available. This allows you to manually
    update functions by the API are rather limited, but provide simple functionality
    for cropping and editing. Figure 10-5 shows the rectangle when editing is enabled.


