  md: '# NEW IPAD FEATURES


    In addition to the controls covered in Chapters 3 and 4, the iPad supports some
    new user interfaces that take advantage of the larger screen and the "any orientation"
    user interface. Figure 13-5 shows the iPad Mail application using the orientation-aware
    split view control. On an iPhone you must switch back and forth between your Inbox
    and messages; however, the iPad allows you to see both. The Inbox and message
    appear side-by-side in landscape mode, whereas in portrait mode the Inbox is available
    in a new popover control.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_313_0.png)


    FIGURE 13-5


    # Using UISplitViewController


    A split view manages two view controllers and displays one or both of them depending
    on the orientation of the device. In landscape mode the first view has a fixed
    width of 320 pixels (the width of the iPhone’s screen) and the second view uses
    the rest of the display. In portrait mode the 320-pixel-wide view is hidden by
    default but accessible via a popover control.


    To use the UISplitViewController class you simply need to tell it which view controllers
    to use; it detects the device’s orientation and shows the first view as requested.
    Listing 13-3 shows how it is to set up a split view (the UISplitViewController
    was dragged onto the window in Interface Builder and outlets were created to control
    the others).'
