    \ LoadFinished: This event is triggered when content has finished loading (the\
    \ entire page and all its content, including images and scripts). Use this to\
    \ hide the Network activity.\n\n+   - LoadError: This event is triggered when\
    \ a page cannot be loaded. The following example stops the Network activity and\
