    # Reading Your Settings


    Now that you have all of your specifiers set up and users can access your settings
    through the Settings application, you need a way to access those settings in your
    own application. Turns out this is really easy to do.


    +   1. First, you need to make sure that you have a reference to MonoTouch.Foundation.
    You do this just like you do with any other class:


    ```

    using MonoTouch.Foundation;

