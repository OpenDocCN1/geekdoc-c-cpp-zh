  md: '# UISEGMENTEDCONTROL


    The UISegmentedControl provides a compact, persistent grouping of buttons that
    switch views. According to the mobile HIG, segmented controls should provide feedback
    to users by swiping or appropriately updating the UI. The feedback should be immediate,
    avoiding animation effects. That said, it is, however, conceivable that you could
    use segmented controls for more complex view management. Each element comprises
    multiple segments, of which functions as a discrete button. Each segment can display
    text or an image, but not both. UISegmentedControl ensures that the width of each
    segment is proportional, based on the total number of segments, unless you set
    a specific width.


    +   NumberSegments: This is a read-only property from inside code; using Interface
    Builder you can use it to set the number of segments to display.


    +   ControlStyle: Use the UISegmentedControl enum to choose Plain, Bordered, or
    Bar.


    Figure 3-13 shows the UISegmentedControl options in Interface Builder.


