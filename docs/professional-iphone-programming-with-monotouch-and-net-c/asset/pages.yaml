  md: '# ABOUT THE AUTHORS


    WALLACE B. (WALLY) MCCLURE graduated from the Georgia Institute of Technology
    (Georgia Tech) in 1990 with a Bachelor of Science degree in electrical engineering.
    He continued his education there, receiving a master''s degree in the same field
    in 1991. Since that time, he has done consulting and development for such companies
    as The United States Department of Education, Coca-Cola, Bechtel, Magnatron, and
    Lucent Technologies, many others. Products and services have included work with
    ASP, ADO, XML, and SQL Server, as well as numerous applications in the Microsoft
    .NET Framework. Wally has authored books on architecture, ADO.NET and SQL Server,
    AJAX, and iPhone Programming with Mono/MonoTouch. Wally specializes in building
    applications that have large numbers of users and large amounts of data. You can
    read Wally''s blog at www.morewally.com. Wally is married and has two children.
    When writing software, he plays golf, exercises, and creates with his family.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_8_0.png)


    MARTIN BOWLING is the Founder/President of 27, a Charleston, West Virginia, based
    Internet marketing and mobile development consulting firm. Martin has recognized
    for his Internet Marketing tactics, providing consulting for Fortune 500 companies
    and some of the educational institutions in America. Martin is demand as a speaker,
    senior leader, and creator in various topics regarding social media marketing
    to application development. He is currently focusing on several projects that
    brings his many passions together, working with a leading social media marketing
    and SEO Search & Social to build a platform for scalable SEO and social media
    marketing to small and medium-sized businesses. His project Tweetcatching.com
    takes mobile development, social media, and the outdoors and combines it into
    one great project to allow Geocachers to easily share their finds with friends
    and they are on the go. Martin continues to find new ways to mash social media
    with mobile development to provide a rich experience to users and maximum ROI
    for the companies he works with. He lives with his wife in Charleston, West Virginia.
    His black lab, Brewski, keeps him company when he codes. Martin loves a great
    meal and mental craft. For more info up he can be reached at www.martinbowling.com
    or Twitter at http://twitter.com/MartinBowling.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_8_1.png)


    CRAIG DUNN has been developing the .NET Framework since 2001 in Australia and
    Canada, on projects ranging from Internet banking to warehouse automation systems
    (including a stint building multilingual web sites). He has been involved with
    MonoTouch the early betas in August 2009, blogging tutorials at http://conceptdev.blogspot.com
    and producing the MIX10 iPhone conference schedule in Las Vegas. Craig was also
    15th in line for an iPad.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_8_2.png)'
