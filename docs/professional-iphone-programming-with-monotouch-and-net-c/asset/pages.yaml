  md: '# Limitations of ngengstrings


    ngengstrings works by examining your compiled code for calls to the LocalizedString
    method, it then extracts the parameters from the method to build the .strings
    output files.


    Because of this you should always embed the actual strings in the method call,
    like this:


    ```

    NSBundle.MainBundle.LocalizedString("First name", "Label for firstname");

    NSBundle.MainBundle.LocalizedString("Greeting", "Hi {0},*");

    NSBundle.MainBundle.LocalizedString("One", "1,Nums, The number one");

    ```


    You should not pass variables into this method as the ngengstrings tool cannot
    parse them. The following localizable strings will not be extracted successfully:


    ```

    var key = "Firstname"

    var product = "iPad"

    NSBundle.MainBundle.LocalizedString(key,Label for firstname);

    NSBundle.MainBundle.LocalizedString("Product","The " + product,\");"

    ```


    The ngengstrings tool from Apple has the same limitation.


    > ngengstrings is an open source tool written in C# with Mono. You are free to
    modify the code provided in the download or get the latest release online from
    http://github.com/conceptdev/ngengstrings.


    # SUMMARY


    The App Store is available in more than 70 countries, which means there is a large
    market for applications in native languages. If you take the time to internationalize
    your code from the start — .strings files and retrieving text and images using
    the methods on MainBundle — it will be much easier for translators to localize
    it.


    You also learned about the open-source tool ngengstrings that can help you manage
    the localized strings regardless of size of your project and the amount of translation
    required.


    Releasing a translated application that makes careful use of localized formatting
    and culturally aware images and concepts will give you the maximum chance of success.
    Ideally, foreign-language users will not be able to distinguish your localized
    application from something that was created specifically for their market. Achieving
    that level of familiarity can be difficult across a large number of languages,
    but the iPhone with MonoTouch provides you with the tools to do it.'
