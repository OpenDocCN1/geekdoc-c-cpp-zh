  md: '# CHAPTER 2 INTRODUCTION TO MONOTOUCH


    +   - Library: This window contains the Objects, Classes, and Media tabs. These
    contain the controls that you can click and drag onto the view.


    +   - View: This window is the view that you can click and drag different controls
    on. This allows you to layout your user interface in a WYSIWYG way.


    +   - Connections: This tab is where you set up connections between your controls
    and enable them to be modified practically. As you can see, this is one of three
    other tabs. The other three tabs are Attributes, Size, and Identity, which all
    modify the controls details. Collectively, this window is known as the Inspector.


    +   - The fourth window, Untitled in Figure 2-5, is the Main Menu of Interface
    Builder. This provides a hierarchical view of all the controls on a view.


    The next sections discuss what sort of controls you have at your disposal with
    both Interface Builder and just using controls code.


    # Working with Library Controls


    The Library window contains a bunch of controls that are usable within Interface
    Builder. These controls are also available in code; the brackets represent the
    class for the control.


    +   - Controllers (UIViewController): The Controllers are a family of controllers
    that control some type of activity.


    +   - Data Views: The Data Views typically present some type of information to
    the user. The controls presented are:


    +   - Table View (UITableView): A Table View presents data to a user in a table
    list. Users are able to scroll through the data. Typically, a single cell in a
    Table View is an entire row (known as a Table Cell).


    +   - Table View Cell (UITableView): The Table View allows for custom look and
    feel, and behaviors of cells to be defined and applied within a Table View.


    +   - Image View (ImageView): The Image View displays an image or animation to
    a user. In the case of an animation, this is defined as an array of UIImages.


    +   - Web View (UIWebView): The Web View displays web content to a user within
    an application.


    +   - Map View (MKMapView): The Map View displays map content to a user within
    an application.


    +   - Text View (UITextView): The Text View displays multiple lines of editable
    text.


    +   - Scroll View (UIScrollView): The Scroll View provides a way for content to
    be displayed that does not entirely fit within a single window view.'
