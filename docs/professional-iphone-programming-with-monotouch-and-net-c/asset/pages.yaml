  md: "# Annotating the Map\n\nAdding pin markers to the map requires adding MKAnnotations\
    \ to the MKMapView. When using the MapKit framework from Objective-C, MKAnnotation\
    \ is a protocol — a similar concept to interfaces in C# that protocols can have\
    \ optional members. In MonoTouch, protocols are modeled as abstract classes to\
    \ be implemented in your application. In the case of MKAnnotation three properties\
    \ are required: Coordinate, Title, and Subtitle. The subclass in Listing 7-6 adds\
    \ private backing variables and a constructor to set them; however, other implementations\
    \ could.\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_187_0.png)\n\n```\npublic\
    \ class MyAnnotation : MKAnnotation\n{\n    private CLLocation2D coordinate;\n\
    \    private string title, subtitle;\n    public override CLLocation2D Coordinate\n\
    \    {\n        get { return coordinate; }\n    }\n    public override string\
    \ Title\n    {\n        get { return title; }\n    }\n    public override string\
    \ Subtitle\n    {\n        get { return subtitle; }\n    }\n    public MyAnnotation(CLLocation2D\
    \ l, string t, string s)\n    {\n        coordinate = l;\n        title = t;\n\
    \        subtitle = s;\n    }\n}\n```\n\nTo try out MyAnnotation create a new\
    \ MonoTouch application Mapping04 (which has been updated for this version), use\
    \ Interface Builder to draw the controls in Figure 7-12, and connect the outlets\
    \ for the MKMapView and UIButtons.\n\nAdd the code from Listing 7-7 to Main.cs\
    \ and include the MyAnnotation class where the //TODO: comment indicates. The\
    \ key elements of the code are:\n\n+   * A list of MyAnnotation objects is hardcoded\
    \ to be used in the application. This list could be the result of a web-service\
    \ call, a custom set of data in your application, or any other source of location\
    \ data you can find.\n* AddButton.TouchUpInside calls map.AddAnnotationObject(),\
    \ which results in the pin appearing on the map.\n* CenterButton.TouchUpInside\
    \ calls map.SetCenterCoordinate(), which moves the pin to the center. The second\
    \ parameter allows the change to be animated; if set to false the map just re-draws\
    \ at the new location."
