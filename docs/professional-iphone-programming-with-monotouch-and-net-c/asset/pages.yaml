    \    <dict>\n      <key>CFBundleURLName</key>\n      <string>com.christry.myapp</string>\n\
    \      <key>CFBundleURLSchemes</key>\n      <array>\n        <string>com.christry.myapp</string>\n\
    \        <string>myapp</string>\n      </array>\n    </dict>\n  </array>\n</dict>\n\
    </plist>\n```\n\n> You can find this Info.plist file as part of the files in the\
    \ Listing 11-2 folder of the download.\n\nYou can see in the XML that you can\
    \ define keys, dictionaries, and arrays. In this sample you can see the two keys,\
    \ CFBundleURLName and CFBundleURLSchemes, which are wrapped in a CFBundleURL array.\
    \ This sets the application to listen up to requests for the URL schemes provided,\
    \ and since CFBundleURLSchemes value is an array, you can set multiple URL schemes\
    \ for the application to listen out for. Once this is set up, save the file, and\
    \ then you're ready to listen for it in your code."
