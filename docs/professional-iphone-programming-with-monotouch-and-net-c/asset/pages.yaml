  md: '# 10


    # Programming with Multimedia


    WHAT''S IN THIS CHAPTER?


    +   - Integrating images and the image picker

    - Watching and recording videos

    - Playing and recording audio

    - Using animation


    Multimedia covers a broad range of items in the real world. Within the iPhone
    context, multimedia covers images, audio, video, and animation. The iPhone creates
    an innovative way of consuming multimedia, which hasn''t gone unnoticed in the
    general media. The iPhone APIs provide an easy way of interacting with the multimedia
    functions of the device. We discuss each of the multimedia items throughout this
    chapter.


    # IMAGES


    This section covers using images within your application, whether you want to
    display images, pick images, or create your own.


    # Displaying Images


    To use and display images within a view, you can use the UIImageView control.
    UIImageView is a simple control that allows two basic actions: the ability to
    view an image and the ability to view multiple images with animations.'
  merge: -1
