  md: "# Customizing the Camera\n\nUsing the camera on a device provides you with\
    \ a few different options when it comes to customizing how the camera looks and\
    \ how it works. This section explains what customization you can do when using\
    \ the camera.\n\nOne of the things that you can customize with the camera is the\
    \ camera \"controls\" that are displayed on screen. These controls are the same\
    \ default controls that are used on the camera application on the iPhone. Most\
