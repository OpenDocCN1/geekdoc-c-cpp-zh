    The following properties can be set via Interface Builder or in code:


    +   - Editable: Defaults to true, which means the text is edited and shows a keyboard
    when touched. Set this to false to read the text-only.


    +   - TextAlignment: Use the UITextAlignment to choose Left, Center, or Right.


    +   - TextColor: Assign a color (such as UIColor.Blue) or a System color (such
    as UIColor.DarkTextColor), or a "From" to use any other color (UIColor as a number
    of methods such as FromRGB and FromHSB to create specific colors from Red/Green/Blue
    or Hue/Saturation/Brightness values)


    +   - ScrollToTop: Enables the "shortcut", where touching the status bar (if shown)
    automatically scrolls a UITextView to the top of its content. This should be set
    to true if your view is the main control on the screen.


    +   - IndicatorStyle: Because UITextView inherits from UIScrollView you can set
    the color of the scrollbar using the UIScrollViewIndicatorStyle to Black or White
    so it is easy to see regardless of the background color you choose.


    In code you can also modify:


