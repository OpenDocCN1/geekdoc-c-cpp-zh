- img_proc: true
  md: '4. In iTunes, select your device under Devices, choose the Application tab,
    and make sure that the new application is checked (see Figure 15-9).


    5. Sync your device and try out the new app!


    # PREPPING FOR SUBMISSION


    Before you can release a paid app to the App Store, there are several steps you
    must take. First, you must agree to all of the paid app contracts, and submit
    your tax and bank routing info. For best results you should do this before even
    beginning on your apps. These contracts have an approval process that you must
    go through and sometimes take several weeks to be approved by Apple.


    # Building a Distribution Version of Your App


    The MonoTouch team has done a great job on making the process of building for
    distribution in MonoDevelop mimic the process in Xcode to make it possible for
    you to follow Apple''s instructions for building distribution.


    > Note that you can also export your project to Xcode using the Run ⌘R Debug Xcode
    command, and follow Apple''s instructions for code signing for distribution in
    Xcode.


    # Adding a New Configuration for Distribution


    Before you can make a distribution build you need to add a new configuration to
    MonoDevelop for distribution. You must do this for the solution and for each project
    in the solution.


    Select Project ⌘+ Solution Options from the menu, and you are presented with the
    Solution Options dialog box.


    Select the Configurations panel and click the Add button. In the New Configuration
    dialog pick a name for the configuration, such as Distribution, and make sure
    that the Platform field is set to iPhone.


    > Again, to save you the step of having to perform this action for each project
    in your solution, simply check the box Create configurations for all solution
    items.


    As with your solution you would then select the Configurations panel and click
    the Add button. In the New Configuration dialog use the same name for the configuration
    that you used in your solution, and make sure that the Platform field is set to
    iPhone, just as was in your solution.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Changing the Signing Options for the Configuration


    In the Project Options dialog, select the iPhone Bundle panel, and use the drop-downs
    at the top of the panel, select the configuration for which you wish to edit signing
    settings. This should be the configuration you created in the previous step, in
    case Distribution.


    Pick an identity for signing your application. This should be the Distribution
    identity that you obtained from Apple''s iPhone Developer portal when you created
    your distribution certificate. Choose Distribution (Automatic) if you use MonoDev
    to select the correct identity automatically.


    Pick the distribution provisioning profile that you created for your application
    that you obtained from Apple''s iPhone Developer portal. MonoDev only lists the
    provisioning profiles that are associated with the identity you have selected.


    # Review Bundle Settings


    Before you build the app you need to review the bundle settings to ensure that
    they are correct for this app. To do this, select the iPhone Application panel.
    While you are here, ensure that you have a display name and version number, and
    that the bundle identifier matches the bundle identifier that is part of the provisioning
    profile. You also need to specify your 57x57 app icon on this.


    # Building the Project


    After completing the preceding steps you can now proceed to making your distribution
    build. Before starting the build process in MonoDev, switch your active build
    configuration for the new profile you set earlier (Distribution).


    Then build the project. You can find the bundle by going to the project folder
    /bin. All that you need to do is the App is compressed in a .zip file.


    > Once again, the app could be somewhere else in the /bin folder: It will be wherever
    you decided to put it, shown on the Output pane in the project options.


    # Presubmission Checklist


    The following checklist covers the basic steps you need to address prior to submitting
    your app.


    +   1. Complete all Ad-Hoc testing.

    2. In an Xcode app, this is where you need to make sure you update the Info.plist
    file in your app. Luckily MonoDev handles all of this for you, with the information
    that you fill out in the Application Bundle and Signing Pages.

    3. Set the bundle identifier (if you haven''t already) to YourAppName. The identifier
    should not contain spaces or special characters — alphanumeric characters and
    dashes are okay.'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'If you want your app to be named something different on the actual device than
    its name in MonoDevelop, change the Bundle Display Name as well.


    Update the bundle version. If this is your first time submitting this app, the
    version number should probably be 1.0.


    Be sure the icon file is set (this should be a 57x57 .png file).


    Write a description for your app for the App Store. The upload page says the description
    should be 700 characters or less, but that limit doesn''t seem to be enforced.


    Choose a numeric SKU for your app. This can''t be left blank, and it has to be
    a unique number for each of your apps. (I use YYMM, 0902, but you can use whatever
    you want as long as it''s a number.)


    Assemble your screenshots. You''ll need at least one primary screenshot, and up
    to four secondary screenshots. Be sure they''re the right size (320x480 for portrait
    or 320x460 for landscape).


    Prepare your iTunes artwork. This is a 512x512, 72dpi JPEG. It should match your
    icon artwork as closely as possible — apps are sometimes rejected if these two
    images are dissimilar.


    # Submitting via iTunes Connect


    Now that you have run through your pre-submission checklist and gotten all those
    items out of the way, you are ready to submit your app to iTunes Connect. When
    you log in to developer.apple.com/iphone, there''s a link to iTunes Connect on
    the right. Once you are logged in to iTunes Connect, click Manage Applications
    and then Add New Application.


    The app info page asks for your app name, description, copyright info, version
    number, SKU, application and support URL, and support e-mail address (all of these
    are required). The URLs you enter to translate as follows:


    | ITUNE CALLS IT: | WHAT IT SHOWS ON YOUR APP PAGE IN ITUNE: |

    |---|---|

    | Application URL | Company Name Web Site |

    | Support URL | Appname Support |


    If this is your first time uploading an app to the App Store, and you enrolled
    as an individual developer, you will be asked to set a Company Name. Think carefully
    about this — once you set it, you cannot change it without calling Apple and going
    through its phone support line. If you set a company name, all of your apps will
    show it.


    The app upload page is where you upload your (.zip file of the compiled binary),
    the iTunes artwork and your primary and secondary screenshots. When uploading
    your screenshots, you should upload them in order of the you want them to appear
    in the App Store. For example, if you have screenshots named ss1.jpg, ss2.jpg,
    ss3.jpg, and ss4.jpg, you''ll enter ss1.jpg as the primary screenshot, then add
    (one at a time) ss4.jpg, ss3.jpg, and ss2.jpg to the secondary screenshots.'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'You also need to provide the following information on the upload page:


    +   * **Ratings:** You''ll be asked to rate your app by indicating whether it
    includes any offensive material.


    +   * **Pricing and availability:** This is where you set the price and release
    date for your app. You''ll get a chance to refresh this after you select a pricing
    tier. The page date should show a link to the pricing tiers, if it doesn''t show
    initially, just set the price to anything and let it refresh. The link should
    show up. The pricing tiers as offered by Apple are as follows:


    +   * Free

    * Tier 1 — 0.99

    * Tier 2 — 1.99

    * Tier 3 — 2.99

    * Tier 4 — 3.99

    * Tier 5 — 4.99

    * Tier 6 — 5.99

    * And so on.


    +   * **Release date:** This defaults to the present day, but you can set it to
    a date in the future if you like.


    > When your app gets approved, log back into iTunes Connect and reset the release
    date to the approval date; that way the app shows up at the top of the new releases
    sections of its category. If you fail to do this, when your app gets approved,
    it shows buried several pages down — not very desirable.


    > If you''re submitting an app update, however, you shouldn''t touch the release
    date until you get your update has been approved. If you change the release date
    of an update to sometime in the future, your current app vanishes from the App
    Store!


    Finally you get to the summary page, where you can review all the info on your
    app before submitting it for review. Check to see everything looks okay, and then
    click Submit.


    Now you just have to wait. Apple''s approval process can be a mystery; your app
    might get approved in a week, a month, or ever. They will usually e-mail you to
    know when your app is ready for sale. (They''ll also e-mail you the dreaded "your
    app is taking longer to review," which means your app might be in review for several
    more weeks or months.)'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# PROMOTING YOUR APP


    Wow, after that, your app is finally in the App Store, but your work is only half
    done. Even great apps generally won''t sell themselves. Getting noticed in the
    App Store is a job all itself. This section reviews some ways that you can help
    your app stand out from all of the rest.


    # Supporting Your App Promotion


    When you roll out your app you need a few supports right away:


    +   - A web site and blog

    - A Twitter account

    - A Facebook fan page

    - A YouTube channel


    The next sections briefly discuss how to set up these supports in the most effective
    ways to get the best platform from which to manage the promotion of your app.


    # Your Web Site and Blog


    Even though you have a description in the App Store, having at least a one-page
    web site for each of your apps can really help your perception among potential
    buyers.


    If this will an ongoing project for which you plan to add new features or continue
    development, I would encourage you to blog about it. Not only will this help get
    more content about your app into search engines, but will also give users and
    potential buyers a little insight into you and your app, making them feel part
    of the process.


    Your web site should include not only screenshots that appear in your App Store
    description but any additional screens that are important to the app but didn''t
    make the cut. The look and feel of an iPhone app is a big selling point highlight
    anything that sets your app apart from the competition.


    > Use the great SimFinger utility from Atebits (http://bit.ly/SimFinger) to create
    a screencast showing your app in use. Not only can you post this on your web site,
    but you can also syndicate it on video sharing sites. This can increase your exposure
    and also help with search engine rankings.


    # Your Twitter Account


    Being accessible to your users is key to getting good reviews and also word of
    mouth referrals. The weapon of choice for mass communication these days seems
    to be Twitter, so make sure that you have your Twitter account prominently displayed
    on your site. Use your Twitter account to gather user feedback, keep users updated,
    run contests, and just have fun. You don''t just need to engage users and take
    part in the'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'conversation. If you don''t have anything to say about yourself, your app,
    or what might be coming next, look for content items that relate to your app or
    fit in the same niche that your app focuses on. By providing this content you
    are likely to pick up new followers who could turn into new customers. You should
    try to read and if possible answer any tweets that pertain to your apps. Do this
    by not only liking the mentions on Twitter, but also utilize the search to look
    for your app name, your own name, your company, or anything that might relate
    to your app.


    > You might run into some negative comments as well as some constructive criticism.
    Try to refuse the situation, and do whatever you can to rectify the issue for
    the naysayer. This might seem overkill, but one unhappy customer can quickly turn
    into a few tweets, a blog post, several YouTube videos, bad App Store reviews,
    and before you know it, these things can impact your sales and ultimately your
    brand.


    # Your App''s Facebook Page


    In addition to Twitter, Facebook is another wildly popular social media platform
    that many people not only use to communicate with friends and family, but also
    their favorite brands. Set up a Facebook fan page for your app. Encourage your
    Twitter followers to also become a fan. You will find that you will use the fan
    page as much like you will your Twitter account. Remember, it''s not just posting
    your content — use this platform to open up the lines of communications with your
    users and potential customers.


    # YouTube Channel


    Continuing the path of social media must for your app, head over to YouTube and
    set up an official YouTube channel for your app. Use this for how-to videos, feature
    demos, and sneak peaks of upcoming versions. Your YouTube channel will not be
    about the two-way communication with your users as Facebook and Twitter, but it
    will be equally important because it can serve as a sales page for your app. As
    Google and other search engines have adapted to the increasing amount of video
    that is consumed by Internet users, as their search engine results, having a video
    with your app name and other relevant keywords is likely to rank high for those
    search queries. Users are also very likely to try and find a video on how something
    works. Making how-to''s for your app can help reduce support e-mails, tweets,
    calls, or forum posts.


    # Key App Promotion Techniques


    Now that you''ve gone over the basics that you need to have for getting the support
    structure in for your app, this section discusses specific app promotion techniques.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Running a Contest


    With each version of your app you will receive 50 promo codes. This will allow
    whoever you have given the promo code to redeem it on the App Store for a free
    copy of your app. So the first thing I suggest is to set aside five promo codes
    and run a contest on Twitter, a simple contest where all the user has to do is
    follow and retweet a message promoting the contest. At the end of the contest
    you award the promo codes to either a random follower or a random retweeter. The
    web site tweetRand (http://twitrand.com/) is a great and easy way to select either
    a follower or a retweeter. You can also adapt this to a contest for getting more
    Facebook fans.


    Before you give all 50 of your promo codes you need to set aside a few and submit
    them to App Review sites:


