  md: 'Sometimes, a compiler directive is intended to replace code that, were written
    by the developer, would be more or less identical regardless of the app being
    written. The first directive listed — for string literals — a good example. Strings
    are used often in app development, and developers shouldn''t have to write the
    code manually (unless there''s a specific reason to do so, which, with strings,
    is often not the case). So, the `@*` directives free the developer from having
    to write repetitive code.


    In other cases, compiler directives can provide metadata. They can represent code
    that would be tedious to write that the compiler can safely generate for you.


    Whatever function they perform, they''re instructions that serve a purpose at
    compile time. Table 14-2 contains these compiler directives.


    # TABLE 14-2: Compiler Directives in Objective-C and C#


    | OBJECTIVE-C | APPLIES TO... | C# | DESCRIPTION |

    |---|---|---|---|n| `@string*` | Data Types | `string*` | The only significant
    difference between string literals in Objective-C and string literals in C# is
    the `@` symbol that precedes the literal in Objective-C. Otherwise, the two may
    be treated equally. |

    | `@catch()` | Exception Handling | catch | Functionally equivalent. |

    | `@class` | Data Types | using | `@class` is used in Objective-C when referencing
    a data type that hasn''t been defined in any of the header files referenced by
    the current class. It''s a way of telling the compiler that the data type exists,
    but to resolve it at runtime. |

    | `@dynamic` | Properties | None | When properties are declared in Objective-C,
    the compiler expects to find a corresponding implementation in the class body.
    Sometimes a property implementation is created at runtime. `@dynamic` tells the
    compiler not to look for implementations for the specified properties. |

    | `@end` | Classes/Interfaces/ Extension Methods | ) | `@end` allows the compiler
    to recognize the end of an Objective-C definition. Translating to C# is as simple
    as substituting a closing curly-brace |

    | `@finally` | Exception Handling | finally | Functionally equivalent.'
