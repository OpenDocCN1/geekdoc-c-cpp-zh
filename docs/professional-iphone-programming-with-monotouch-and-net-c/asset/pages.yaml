    the App Id select the name of your app. Select all of the devices that you wish
    to run code on, and click Submit when you are done. You may need to Refresh at
    least once (sometimes Apple''s server will be behind and you may need to hit it
    multiple times); until you see the download button. Now download the provisioning
    profile. I save this in myTouch /bin directory so I can keep all of my files there;
    but you can put anywhere that you want. Keeping the provisioning file in your
    /bin directory will make it easier for you when you package your Ad-Hoc builds.


    # Building an Ad-Hoc Version of Your App


    You need to make a special build of your app that can be used along with the Ad-Hoc
    provisioning profile that that your testers can use your app on their devices.


    # Adding a New Configuration for Ad-Hoc


    Before you make an Ad-Hoc build you need to add a new configuration to MonoDevelop
    for distribution. You must do this for the solution and for each project in the
    solution.


    Select Solution Options from the menu, and you will be presented with the Solution
    dialog box. Select the Configurations panel and click the Add button. In the New
    Configuration dialog pick a name for the configuration, such as AdHoc, and make
    sure that the Platform field is set to iPhone.


    > To save the step of having to perform this action for each project in your solution,
    simply check the box Create configurations for all solution items.


    # Changing the Signing Options for the Configuration


    In the Project Options dialog, select the iPhone Bundle Signing panel, and using
    the drop-downs at the top of the panel, select the configuration for you wish
    to edit signing settings. This should be the configuration you created in your
    previous step, in this case AdHoc. You will need to repeat this process for each
    of the projects that are in your solution.


    Pick an identity for signing your application. This should be the distribution
    identity that you obtained from Apple''s iPhone Developer portal when you created
    your distribution certificate. Choose Distribution (Automatic) if you want MonoDevelop
    to select the correct identity automatically.'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'Pick the Ad-Hoc provisioning profile that you have created for your application
    that you obtained from Apple''s iPhone Developer portal. MonoDevelop only lists
    the provisioning profiles that are associated with the identity you have selected.


    # Custom Entitlements.plist


    One way that Ad-Hoc build differs from a build for the App Store is the need for
    an Entitlements.plist file. Add a new Entitlements.plist file to your project
    by choosing File ⌘ New ⌘ File ⌘ iPhone Entitlements. You will then need to open
    Entitlements.plist and disable the get-tasks-allow entitlement. This prevents
    the debugger from attaching to your application, which is required for Ad-Hoc
    distribution.


    # Reviewing Bundle Settings


    Before you build the app you need to review the bundle settings to ensure that
    they are correct for this app. To do this:


    +   1. Select the iPhone application.

    2. While you are here to ensure that you set a display name and version number,
    and that the bundle identifier matches the bundle identifier that is part of the
    provisioning profile. You also specify your 57x57 app icon on this screen.

    3. Now you need to switch over to the iPhone Signing page and add the Entitlements.plist
    file that you created in the previous step to the Custom Entitlements field in
    the code signing options. Make sure that you do this only for the Ad-Hoc distribution
    configuration.


    # Building the Project


    After completing the preceding steps you can now proceed to making your Ad-Hoc
    build. Before starting the build process in MonoDevelop, switch your active build
    configuration to the profile you set earlier (AdHoc).


    Then build the project. You can then find the build in the project folder /bin
    (the default location) or where you have pointed out the folder for your Ad-Hoc
    configuration. This will be in the Output pane of MonoDevelop. You will need to
    send both the app and the Ad-Hoc provisioning profile that you created to anyone
    you want to test this app.


    # Packaging Your Ad-Hoc Build


    You have your Ad-Hoc build ready to go; now you need to actually get it to your
    testers. Your testers will need both the app and your Ad-Hoc provisioning profile.
    You have two options: You can make an .ipa of your app, where iTunes will handle
    the unzipping, or you can make a .zip of your app.


    > If you have testers that are on Windows machines, including an .ipa is the preferred
    method because iTunes handles the decompression.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# The .zip Method


    If you have selected the .zip method, you will need to send your testers the following:
    YourApp .app compressed in a .zip file along the file YourApp_AdHoc_Provisioning_mobile.provision.


    I usually send these two files to testers via e-mail. Note, that some email providers
    may not let you send the AppName.zip because it contains a binary file. If this
    is the case, upload your files to an FTP server and send your testers a link.
    An Ad-Hoc build is much like installing a normal iPhone .app.


    +   1. If you have the .zip and .mobileprovision files in an e-mail, then save
    to a convenient location, such as your desktop.

    2. Drag and drop the .mobileprovision file to Library ⇄ Applications in iTunes.
    On the Mac, you can just drag it to the iTunes icon in your dock (Figure 15-5
    shows this in Windows).

    3. Extract the zip. To do this, right-click the zip file and Extract All... (see
    Figure 15-6). Step through the wizard and accept the defaults by clicking Next.
    Windows Users: The Built-in Ad-Hoc command reports the application so it cannot
    be installed. You should try using a different zip program like WinZip or WinRAR
    to extract the zip file.

    4. Find the .app folder (usually AppName.app) (see Figure 15-7).


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_356_0.png)


    FIGURE 15-5


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_356_1.png)


    FIGURE 15-6


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_356_2.png)


    FIGURE 15-7


    +   5. Drag and drop the .app folder onto Library ⇄ Applications in iTunes. On
    the Mac, you can just drag it onto the iTunes icon in the dock (refer back to
    Figure 15-5).


    +   6. Verify that the application shows up in Library ⇄ Applications. Note that
    it will not have its normal icon (see Figure 15-8).'
