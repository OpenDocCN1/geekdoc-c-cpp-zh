  md: '# Posting data with POST


    Now that you have to get data from a service, you need to take a closer look at
    how to post data to a service. In this example, you will posting data to a service
    with JSON.


    First some background on the service: TwmTstr is a service that provides a number
    of enhancements to businesses that are using Twitter as part of their social media
    efforts. TwmTstr exposes a set of REST-based JSON web services that allow third-party
    applications to integrate with. One of the features that TwmTstr provides the
    ability to Tweet guests to out on Twitter in the future.


    Listing 5-10 shows some example code that would schedule a post to be done in
    the future. The code will schedule a post one hour in the future.


    +   LISTING 5-10: Posting data asynchronously


    ```

    string Url = "http://www.twmTstr.com/WebServices/RemoteAPI.svc/ScheduleMessage";

    DateTime DatePost = DateTime.Now.AddHours(1).ToString("mm/dd/yyyy");

    DateTime TimePost = DateTime.Now.AddHours(1).ToString("HH:mm");

    string Body = "{"id":"" + UserName + "\","Password":"" + Password + "\",

    "AppId":"" + AppId + "\","nStatusId":"" + StatusId + "\","DatePost":"" + DatePost
    + "\",

    TimePost":"" + TimePost + "\","TweetText":"" + Tweet.Text + "\"}";

    byte[] byteData = UTF8Encoding.GetBytes(Body);

    // Create the web request

    HttpWebRequest request = WebRequest.Create(Url) as HttpWebRequest;

    request.ContentLength = Body.Length;

    // Set post method to POST

    request.Method = "POST";

    request.ContentType = "text/json";

    // Write the parameters

    Streamwriter stout = new StreamWriter(request.GetStream());

    System.Text.Encoding.ASCII.stout.Write(Body);

    stout.Close();

    request.BeginGetResponse(new AsyncCallback(ProcessResponseAndHandle), request);

    ```


    > Found in the RemoteData/Main.cs of the download


    Note the following in the code:


    +   You create the URL for this method. It is stored in the Url variable.


    +   The code creates a date and a time to post. In this example, the date and
    time are separate controls and are parsed separately to the method.


    +   The body of the method is created. Ideally, done with a custom object that
    is serialized. The reason for showing it is to display the DatePost. The body
    is put into a byte array.'
