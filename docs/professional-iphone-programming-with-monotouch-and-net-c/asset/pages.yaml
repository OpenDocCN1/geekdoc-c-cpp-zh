    \ WPF, and for all intents and purposes is like having an instance of Safari inside\
    \ your application.\n\n# Web-Based Content\n\nThe most obvious use of the UIWebView\
    \ is to display a web page in your application. There aren't many controls on\
    \ the control; the main ones are:\n\n+   - LoadRequest(): This method passes a\
    \ URL (in an NSUrlRequest object) to load that address from the Internet. In this\
    \ example this method is automatically scaled to fit (with zooming allowed) or\
    \ it is forced to be displayed \"actual size\".\n\n+   - ScalesTabPage: This property\
    \ controls whether the content is displayed \"actual size\". The default is false,\
    \ which means web pages are not scaled down for you. Familiar users with Mobile\
    \ Safari expect to be able to zoom in and out of web pages, for web content you\
    \ should ideally set this to true, or check the Scales Page To Fit option in Interface\
    \ Builder.\n\n+   - LoadStarted: This event is triggered whenever new content\
    \ is loaded by the web browser. The following example shows the Network Activity\
