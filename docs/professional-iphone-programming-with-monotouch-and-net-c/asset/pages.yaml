    # VIDEO


    The video functionality varies from device to device. All devices allow playback
    of video, but only the iPhone 3GS devices allow the ability to record video. The
    APIs allow you to detect what will or won''t work for each device, enabling you
    to create a great experience for all users using video functionality. This section
    discusses how you can integrate video into your application and how you can use
    certain devices to record video as well.


    # Playing a Video


    The iPhone SDK provides a simple controller to play videos within your application.
    Tucked away in the MonoTouch.MediaPlayer namespace, MPMPlayerController class
    provides the functionality to play a movie, prepare to play a movie, and stop
    a movie. Listing 10-9 shows how to start playing a video. The first line shows
    the instantiation of a new movie player object, passing the video content path
    in the constructor, and the second line simply calls the Play method, which displays
    the movie player and starts the video.'
