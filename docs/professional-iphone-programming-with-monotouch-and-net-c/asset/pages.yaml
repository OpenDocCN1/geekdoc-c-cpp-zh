  md: '# 322 | CHAPTER 15 THE APP STORE: SUBMITTING AND MARKETING YOUR APP


    test your app on, at the minimum least test on iPhone and iPod Touch; but if you
    have access to additional people try to get at least one from each generation
    of released iDevices.


    When I am trying to find users for your Ad-Hoc builds, the first place I look
    is my Twitter or Facebook friends. If you have a decent service network on either
    of these services, chances are you can find several types of UDIDs among those
    people. So I send out a message asking for volunteers to help me test. People
    are very eager to help; they like the idea of having software before it''s in
    the App Store, and it gives them a sense of being special. Head to some of the
    iPhone Developer forums, my favorites are http://iponedevax.com/forum/. Lots of
    these have specialized sections where people can ask for or volunteer for an Ad-Hoc
    test. If you are looking for someone local you can meet with face-to-face and
    give some feedback, try Craigslist. Another great resource for finding local testers
    is Tweetups. Meetups that are organized over Twitter are usually filled with tech-savvy
    people who would be more than willing to join and help on a project.


    However, before you can test your app you need the UDID (Unique Identifier). Every
    device has a unique set of letters and numbers that is unique to each device.
    An example UDID might look like this: 7bkl59gaep367j4lp074hzxp4dk301inf523jh.
    I am sure you wondering why you need the UDID to install on your program — this
    is because Apple requires only Store-approved applications be installed on the
    iPhone/iPod Touch. By providing the UDID, Apple can grant permission for the app
    to be run on specific devices. This is Apple''s way of allowing beta testing without
    having to approve each version of your application.


    # Getting UDID from Your Testers


    You can easily get the UDID from your testers in two ways.


    The easiest way is to point them to Erica Sudan''s free Ad Hoc Helper App (http://appsto.re/adhochepper/).
    Your testers can install this, and as soon as they run it, a Compose Mail Dialog
    is presented with their UDID in the body of the message. Provide them with an
    e-mail address to send their UDID to and they are done.


    The other way is to get the UDID using iTunes.


    +   1. Instruct your testers to open iTunes and connect their phone (see Figure
    15-1).


    +   2. Direct them to the Summary tab in the right pane. This is the tab that
    contains the information about their phone such as name, capacity, software version,
    serial number, and phone number.


    +   3. When they click the serial number, it reveals their device''s UDID (see
    Figure 15-2).


    +   4. They can now copy the UDID to their clipboard by selecting Edit -> Copy
    (see Figure 15-3).


    +   5. Now they can paste that in an e-mail or use a contact form to get you their
    UDID.'
