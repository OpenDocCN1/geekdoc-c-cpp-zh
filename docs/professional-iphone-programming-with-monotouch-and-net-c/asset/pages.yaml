  md: '# Planning Your App’s UI: Exploring the Screen Controls


    # WHAT''S IN THIS CHAPTER?


    +   - Creating iPhone(y) UI

    - Exploring the Input & Value objects in Interface Builder


    In this chapter you learn about creating your application''s UI and specifically
    how the UI on the iPhone can differ from UIs that you might have created before.
    You also explore the Input & Value objects from the Interface Builder Objects
    Library.


    Figure-1 shows the Input & Value objects in Interface Builder. We discuss those
    objects later in this chapter. First, however, you need to become familiar with
    how an iPhone UI generally looks and what patterns for interaction it follows.


    # CREATING IPHONE(Y) UI AND INTERACTION PATTERNS


    One of the most important aspects of application development for an iPhone app
    is the user interface. This is because to most users, the interface is the application.
    Designers and developers spend a lot of time deciding how common interface elements
    should look and how interaction should occur. The great thing is that the MonoTouch
    team has ported


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_64_0.png)


    * MonoTouch™'
