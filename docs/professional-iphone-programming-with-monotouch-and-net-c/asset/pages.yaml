    # A BRIEF LOOK AT OBJECTIVE-C AND COCOA


    Before learning to read/understand Objective-C and Cocoa, it helps to know what
    they are. It''s clear enough from its name that Objective-C is an object-oriented
    version of C.


    To clarify, Objective-C is C, but with an object-oriented layer built on top of
    it. You might expect, then, Objective-C will look and behave much like C itself.
    Though a reasonable assumption, if you dig in a language, it will initially surprise
    you to learn all the ways in which you''re dissimilar.


    C is simple, if cumbersome, language. It can feel stiff, curmudgeonly and stubborn;
    because it is relentless and unforgiving. Someone''s first dip in C will introduce
    him or her to C''s cleanliness, but also the fact that it''s a house that''s designed
    to be dangerous to newborns. Power outlets are all well within reach, stoves are
    left on, and you occasionally come across a gun with which to shoot yourself in
    the foot. It teaches you to code well by drill instructor gives you little leeway.


    Objective-C, as is covered in more detail in this chapter, is powerful and, for
    most developers, a much faster and easier to write applications straight C. You
    can still shoot yourself in the foot and accidentally burn yourself from time
    to time, but it was designed to achieve that increased productivity by being more
    forgiving. Given the potential dangers of C, and many APIs for the iPhone are
    C (no corresponding Objective-C framework), but most of a typical iPhone app''s
    will be a combination of C and Objective-C that borrows from the former to the
    latter.


    Compared to C, and even C#, Objective-C is much looser when it comes to certain
    things are done. In C#, much functionality is provided by the compiler. In Objective-C,
    many things, rather than being subject to hard and fast rules, are done by if/for
    blocks and, whereas the latter creates a more developer-friendly way to take advantage
    of that foundation.


    Constructors are a great illustration of the difference. In C#, there is a single,
    formal way to create constructors. In Objective-C, by'
