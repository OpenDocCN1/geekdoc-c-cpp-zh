  md: 'Simulator: Allows for emulating the iPhone, iPod Touch, and the iPad. Note
    that the simulator does not run ARM code. It runs x86 code.


    Libraries necessary to target the device: This includes libraries for Cocoa Touch,
    audio, video, networking, SQLite, threads, power management, and the general OS
    X Kernel.


    # Licensing


    The SDK is a free download. Unfortunately, to release software for the iPhone,
    a developer must join the iPhone Development Program. At the time of this writing,
    the cost to join is $99 (U.S. dollars). The cost of joining varies from country
    to country. The ability to distribute applications to devices is dependent on
    having the necessary development certificates. These are available through the
    Apple Developer site once a developer joins the iPhone Developer Program.


    # SUMMARY


    This chapter looked at the following items in the marketplace:


    +   - The iPhone, its licensing, and its operating system


    +   - The .NET Framework and Mono


    +   - MonoTouch, which allows .NET developers to target the iPhone


    +   - MonoDevelop, which allows developers to have a good IDE to write code with
    MonoTouch


    You should now be familiar with which tools are needed to build a native application
    with .NET/C# for the iPhone. The next chapter explores the specifics of building
    a MonoTouch application with MonoDevelop. Chapters 3 and 4 describe how to work
    with the user input and for presenting data to a user in a standard form factor.
    Other chapters in the book will explore specific parts of the iPhone, such as
    maps, acceleration, and the iPad.'
