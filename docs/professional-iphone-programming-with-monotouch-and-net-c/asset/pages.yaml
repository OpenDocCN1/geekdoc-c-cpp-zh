    they have been turned off and your application attempts to access location data,
    the message in Figure 7-3 will be displayed to prompt the user to turn Location
    Services back.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_173_0.png)


    FIGURE 7-3


    Application code should gracefully handle situations where location information
    is available. If your application cannot operate without Location Services you
    can add an entry in your Info.plist to prevent it from installing or running the
    correct capabilities are present on the device. Table 7-1 describes the entries
    you can include to control this behavior. Refer to Chapter 8 for details on how
    to configure Info.plist.


    TABLE 7-1: UIRequiredDeviceCapabilities Key in Info.plist


    | KEY | DESCRIPTION |

    | location-services | The device must support Location Services and they must
    be enabled in Settings before the application will run. |

    | gps | The device must specifically support GPS hardware before the application
    will install or run. |

    | magnetometer | The device must specifically support compass hardware before
    the application will install or run. |


    iPhone Application Programming Guide


    # Heading


    Only newer iPhone OS (for example, the 3GS) have a built-in compass to provide
    heading information. You should use the HeadingAvailable property of the CLLocationManager
    class to determine whether you can access heading data to ensure your applications
    display relevant information on devices without a compass.


    > The simulator has a number of limitations compared to testing with a real device,
    when testing Location Services in the simulator the location will always be 37.331689,
    -122.030731, which is Apple’s headquarters in Cupertino, California. The heading
    will return 103.27 degrees.


    This some mapping and location features (such as tracking a user’s movement to
    measure speed or distance) can only be tested on a device.'
