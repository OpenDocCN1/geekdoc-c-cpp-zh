  md: '# 7


    # Mapping


    WHAT''S IN THIS CHAPTER?


    +   - Understanding CoreLocation and MapKit


    +   - Using Location Services


    +   - Adding maps and geocoding to your application


    The display of location-specific information including maps, addresses, and points
    of interest is a natural feature for mobile devices such as the iPhone and iPod
    Touch. Outside of some niche markets it has never had success on the desktop,
    primarily because the desktop PC is often stuck in a single location. Mobile devices,
    on the other hand, are naturally going to be carried around wherever ever goes;
    and GPS technology has become smaller and cheaper has found its way into the cell
    phone market.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_170_0.png)


    When the iPhone first appeared the Maps application (shown in Figure 7-1) was
    one of the key selling features - a perfect example of the iPhone''s multitouch
    interface. No other mobile device had previously navigating maps as elegant as
    the pinch-to-zoom, swipe-to-pan operation of Maps on the iPhone''s large screen.
    This chapter shows you how to incorporate that same experience into your own MonoTouch
    applications.


    FIGURE 7-1'
