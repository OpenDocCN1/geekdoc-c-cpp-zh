  md: '# 58 | CHAPTER 4 DATA CONTROLS


    > Note that because the delegate must have a return value, it should be assigned
    to ShouldStartLoad with an equal sign (=) and not attached using +=.


    The return type of the delegate must match the type it is being assigned to (WebBrowser.ShouldStartLoad
    is a boolean in this example, matches the return type of the delegate method).


    You can interrogate the target location from the request parameter and the type
    of navigation requested by the navigationType parameter in order to handle them
    differently (for example, open a link in Safari or allow a post to continue in
    the WebView). The possible values for navigationType are shown in Table 4-1.


    # TABLE 4-1: WebViewNavigationType


    | VALUE | DESCRIPTION |

    | --- | --- |

    | LinkClicked | A link was tapped. |

    | FormSubmitted | An HTML form was submitted. |

    | BackForward | The GoBack() or GoForward() methods were triggered. |

    | Reload | The currently displayed content is reloaded. |

    | FormResubmitted | A form was resubmitted. |

    | Other | Another navigation action occurred. |


    # Other Content


    WebView can also be used to display other content. Using the same C# that loads
    a local HTML file, you can display:


    +   - PDF documents your application might contain or download from the Internet

    - Images (which you can also display using UIImageView and UIScrollView, covered
    later)


    # UIScrollView


    UIScrollView allows you to display and navigate content that is larger than the
    control itself (often sized to the entire device). It provides built-in support
    for swiping to move around the content and pinching to zoom (depending on the
    type of UIScrollView). It is also the base class for other controls that need
    to scroll content larger than their display Frame, like UITableView and UITextView.'
