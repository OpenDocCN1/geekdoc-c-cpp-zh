    # INTEGRATING WITH IPOD MUSIC COLLECTIONS


    Using the user''s iPod music within your application is a great way of providing
    extra functionality, especially when you could potentially add it in a paid feature.
    Similar to the way the Address Book allows you to programmatically access the
    data stored within, the iPod music collection provides two ways to play this content.
    You also have access to the methods you would normally expect from a music player
    such as Play, Pause, Stop, SkipToBeginning, SkipToPreviousItem, SkipToNextItem,
    BeginSeekingForward, and BeginSeekingBackward, as well as the property CurrentPlaybackTime,
    which you can set so it skips to that on the current track or return the value
    so you can use this information to set the value on a slider to indicate the current
    track position.


    > The iPod integration only allows you to play audio content and not play video
    content.


    The MPMPlayerController has two Music Player properties: ApplicationMusicPlayer
    and iPodMusicPlayer.


    +   - The application music player is self-contained in your application. This
    means that if you quit your app, the music stops.

    - The iPod music player, starts playing with the built-in iPod functionality and
    when your application quits, the music continues playing.


    Listings 11-10 and 11-11 show how to create both types of music player and start
    playing a queue of all the songs on the device.


    > Because the simulator does not have iPod functionality or any music on it, you
    will only be able to test and develop applications with iPod functionality on
    the device. You will need the full version of MonoTouch installed and the correct
    certificates from Apple to do so. You will also need at least one song on the
    device.'
