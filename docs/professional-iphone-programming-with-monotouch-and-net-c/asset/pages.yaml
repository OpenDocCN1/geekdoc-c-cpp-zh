  md: '# The Components of MonoTouch


    OpenTK: This namespace is a modified version of the OpenTK API. OpenTK is an object-oriented
    binding for OpenGL, which stands for the Open Graphics Library. OpenGL is an API
    for using three-dimensional graphics. OpenTK is a library for performing OpenGL,
    OpenAL, and Open. It is written in C# and runs on Windows, Mac OS X, and Linux.
    The OpenTK implementation on the iPhone has been updated to use Core Graphics
    and to expose the functionality on the iPhone.


    The other namespaces are bound from Objective-C in the touch.dll are listed in
    Table 2-2. You will notice the exclusion of MonoTouch.CoreData, which should be
    bound from the Objective-C CoreData class. This is left out due to the tight coupling
    it has with the Objective-C way of doing things and it works for with persistent
    storage. Instead, Mono.Sqlite should be used as an alternative.


    # TABLE 2-2: .NET Assemblies Bound from Objective-C


    | NAMESPACE | DESCRIPTION |

    |---|---|n| MonoTouch.AddressBook | Provides access to the iPhone''s Address Book
    |

    | MonoTouch.AddressBookUI | User interface components for accessing the iPhone''s
    Address Book |

    | MonoTouch.AudioToolbox | Contains low-level audio functionality for custom playback
    and recording |

    | MonoTouch.AVFoundation | General-purpose audio playback and recording |

    | MonoTouch.CoreAnimation | Provides the ability to make animations |

    | MonoTouch.CoreFoundation | Bindings for low-level C API in Cocoa Touch |

    | MonoTouch.CoreGraphics | Binding to the Quartz 2D Graphics API |

    | MonoTouch.CoreLocation | Provides location facilities |

    | MonoTouch.GameKit | Allows providing game functionality as P2P communication
    |

    | MonoTouch.MapKit | APIs to provide rich functionality |

    | MonoTouch.MediaPlayer | Provides audio and video capabilities and linking to
    the iPod library |

    | MonoTouch.MessageUI | User interface components for sending mail messages in-app
    |

    | MonoTouch.OpenGL | Provides the ability to embed Open GL into your application
    |

    | MonoTouch.StoreKit | Contains APIs to handle application payments |

    | MonoTouch.SystemConfiguration | Provides network reachability functionality
    |'
