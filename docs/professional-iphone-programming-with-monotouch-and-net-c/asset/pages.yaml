  md: "# TAKING BATTERY LIFE INTO ACCOUNT\n\nThe battery is an important part of mobile\
    \ devices. Unlike a laptop, which is typically only disconnected from power for\
    \ short periods of time (1–2 hours), mobile devices can be disconnected from power\
    \ for several days in a row. Because of this, there are several important things\
    \ to remember:\n\n+   * Applications should not continuously features that will\
    \ use the battery while providing no benefit to the user. These features include\
    \ networking, watching the accelerometer, device orientation, or any other device\
    \ that uses extra power. A great question to ask is, \"Does the user, or application,\
    \ really need this feature all the time or at this certain point?\"\n\n+   * It\
    \ is important for applications to know what is happening with the battery at\
    \ certain points.\n\n# Determining the Static Battery State\n\nOne way to determine\
    \ the current status of the battery is to specifically ask for the information.\
    \ This is done in a two-step process shown in the following code. In this code\
    \ (Listing 9-7), the battery monitoring is turned on, and once the monitoring\
    \ is turned on, the level and state of the battery can be determined.\n\nThe level\
    \ of the battery is a floating-point number between 0.0, which is fully discharged,\
    \ and 1.0, which is fully charged.\n\nThe state of the battery is one of four\
    \ values from the BatteryState enum. These values are:\n\n+   * Unknown: The state\
    \ of the battery is unknown. This value typically occurs when UIDevice.CurrentDevice.BatteryMonitoringEnabled\
    \ is set to false. The default state of BatteryMonitoringEnabled is false.\n\n\
    +   * Unplugged: This is the state when a user is using his her iPhone and it\
    \ is not attached to a charger.\n\n+   * Charging: This is the battery’s state\
    \ when the iPhone is attached to the charger.\n\n+   * Full: This is the battery’s\
    \ state when the iPhone is 100 percent charged.\n\nLISTING 9-7: Reading battery\
    \ levels\n\n```\nvoid HandleBatteryTouchInSide(object sender, EventArgs e) {\n\
    \    try {\n        UIDevice.CurrentDevice.BatteryMonitoringEnabled = true;\n\
    \        BatteryLabel.Text = \"Battery: \" + \n            UIDevice.CurrentDevice.BatteryLevel.ToString()\
    \ + \"%\" + \n            \"Battery Status: \" + \n            UIDevice.CurrentDevice.BatteryState.ToString();\n\
    \    } finally {\n```"
  merge: -1
