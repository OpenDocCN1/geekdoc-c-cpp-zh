  md: "# Integrating with iPod Music Collections\n\nHopefully you will be familiar\
    \ with notifications by using and notifications with the MPMPlayerController is\
    \ very similar to the other notifications works. One difference you may notice\
    \ in the preceding listing is that you need to explicitly begin and end notifications\
    \ whereas other notifications start automatically when you add and remove an observer.\
    \ Line 27 shows BeginPlaybackNotifications being called and line 39 shows EndGeneratingNotifications\
    \ being called to stop observers from being called.\n\nAt the moment you are still\
    \ playing all the songs on the device. This is not really useful, so you'll want\
    \ to programmatically filter down the music that's playing. You should also note\
    \ that there are no convenient filter media queries aside from the songsQuery.\
    \ To do this you will need your own MediaQuery using the MediaPlayerProperty filters.\
    \ Not all media item properties are allowed by a filter, you should also check\
    \ whether or not the item you are filtering against can be filtered. For example,\
    \ you cannot filter the artwork media item property. Line 11-14 shows how to filter\
    \ the iPod music collection by a media item property.\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_280_0.png)\n\
    \n# LISTING 11-14: Creating a media query\n\n```\nvar musicPlayer = MPMPlayerController.iPodMusicPlayer;\n\
    var mediaQuery = new MediaPlayerQuery\\();\nif(MPMediaItem.CanFilterByProperty(MPMediaItemProperty.Artist))\
    \ {\n    var artistFilter = MediaPlayerProperty.PredicateWithValue(\n        (new\
    \ NSString(\"Mew\")), MPMItemProperty.Artist);\n    mediaQuery.AddFilterPredicate(artistFilter);\n\
    }\n\nif(MPMediaItem.CanFilterByProperty(MPMediaItemProperty.AlbumTitle)) {\n \
    \   var albumFilter = MediaPlayerProperty.PredicateWithValue(\n        (new NSString(\"\
    Fringers\")), MPMItemProperty.AlbumTitle);\n    mediaQuery.AddFilterPredicate(albumFilter);\n\
    }\n\nmusicPlayer.SetQueue(mediaQuery);\nmusicPlayer.Play();\n```\n\nListing 11-14\
    \ shows how you use the AddFilterPredicate method to filter down the MediaQuery\
    \ of all the songs in your iTunes library. You may want to change the artist \"\
    Mew\" and the album name \"Fringers\" to an artist and album that you have in\
