  md: '# Adding a Slider


    Your last item type is the slider the one for the iPod volume control.


    +   1. The slider allow you to place a small graphic at the beginning and end
    of the slider, but not a label, so generally it is a best practice to place a
    slider in its own PSGroupSpecifier explaining to the users what they are changing.
    To save a little time you can just copy and paste the PSGroupSpecifier item that
    you created before. Now all you need is to change the Title; for this example,
    click it to Refresh.


    +   2. You now need to adding slider row to your newly created GroupSpecifier.
    Make sure that it is closed and click the button at the end of the row. With all
    items that hold your specifiers you need to change the type to a Dictionary.


    +   3. Then add a child to this item, set the key to Type, and set the value to
    PSSliderSpecifier. This sets the Settings application that needs to use a UISider
    to gather the input from the user for this setting.


    +   4. You also need to add another child with the key Key so you can retrieve
    and update the value later. Set its value to refreshRate.


    +   5. You can allow your user to select a value between a range of values you
    specify. For this instance, let the user select a value between 1 and 10. The
    PSSliderSpecifier also requires a default value. All of these values need to be
    stored as strings. You need three more rows to handle all of these values. Give
    the first one a key of DefaultValue and a value of 6. Give the second a key of
    MinimumValue and a value of 1, and the final one a key of MaximumValue and a value
    of 10.


    +   6. As mentioned earlier there is one more of customization that you can do
    to the PSSliderSpecifier: providing images for the MinimumValue and MaximumValue.
    You need two more children: one MinimumImage and another MaximumValueImage. You
    need to copy these image files into your Settings.bundle directory using your
    Root.plist.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_214_0.png)


    FIGURE 8-15


    Figure 8-16 shows the Property List Editor with a PSGroupSpecifier that displays
    the label “Refresh Rate” for the PSSliderSpecifier, which allows the users to
    select at what rate want their data refreshed. Figure 8-17 shows the visual result.'
