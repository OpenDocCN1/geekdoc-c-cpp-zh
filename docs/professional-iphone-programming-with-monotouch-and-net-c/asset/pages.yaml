    # Setting Up Actions


    An action is a message that is fired off when a certain event occurs. This is
    a very similar concept to events within .NET. What MonoTouch does is expose these
    actions as strongly typed partial methods from the control that fires the event.
    You can read more about this in the next section.


    Actions are set up in a similar way to how outlets are set up using the library
    classes section to create a new action and connecting this action to a method
    on a button.


    +   1. Just like you did to create an outlet, create a new action and give it
    a name.

    2. Again, doing this same way as with an outlet, you select the Actions tab and
    click the + button to add a new action to the outlet. You should call this action
    buttonPressed to follow with the example images. Interface Builder automatically
    adds a colon to the end of the method which is used to denote that it is a method
    in Objective-C but it does no harm in leaving it when using MonoTouch.

    3. You should notice in the AppDelegate Inspector Connections tab a new section
    called Received Actions, which contains the new action. Click and drag this new
    action over to the'
