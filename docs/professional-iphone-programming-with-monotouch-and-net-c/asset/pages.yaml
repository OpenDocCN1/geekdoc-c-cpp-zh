  md: "# Showing a Map\n\nThe MKMapView control provides a sophisticated user interface\
    \ to present mapping data on the device with no additional coding. Once the MKMapView\
    \ has been placed on a window in Interface Builder the user immediately has the\
    \ ability to display, pan, and zoom Google Maps images and show the current location\
    \ of the device (using CoreLocation of course).\n\nThe only caveat is that the\
    \ map images are downloaded from the Internet, MKMapView requires a network connection\
    \ (either cellular data or a wireless network). The control itself caches images\
    \ when the device is offline it will show map data for the most recently viewed\
    \ location, new map data can't be downloaded. This is of particular interest to\
    \ applications on the iPod Touch, which are less likely to be constantly networked.\n\
    \nMKMapView has a number of properties that the user can interact with:\n\n+ \
    \  * UserInteractionEnabled: When set to false the map does not respond to any\
    \ user input; it cannot be scrolled or pins (including the current user location)\
    \ will not show their when called. This property overrides ZoomEnabled and ScrollEnabled.\n\
    * ZoomEnabled: When false the user cannot zoom in or out of the map, scrolling\
    \ and pin calls will still work.\n* ScrollEnabled: When false the user cannot\
    \ scroll around the map (that is, cannot change the center point from whatever\
    \ is set in code). Zooming and pin calls will still work.\n* ShowLocation: This\
    \ is a simple property that causes the map to display a blue dot (and “accuracy\
    \ halo”) if the device location can be determined. The map will also be centered\
    \ and zoomed to that location. It can be set by a checkbox in Interface Builder\
    \ or programmatically on the MKMapView instance.\n* MapType: This is an enumeration\
    \ that defines the types of map image available for display; the three options\
    \ that Internet users have become familiar with using Google Maps:\n\n+   * Standard:\
    \ Road map\n\n+   * Satellite: Aerial photographic images\n\n+   * Hybrid: Aerial\
    \ images overlaid with roads and place names\n\nThe following MapKit example demonstrates\
    \ these properties. Create a new MonoTouch application Mapping03 and use Interface\
    \ Builder to drag an MKMapView and UISegmentedControl onto the window as shown\
    \ in Figure 7-11.\n\nThen add the code from Listing 7-5 to Main.cs to wire up\
    \ the map type selection and the properties described.\n\n> LISTING 7-5: Simple\
    \ map display (Mapping03/Main.cs)\n\n```\npublic partial class AppDelegate : UIApplicationDelegate\n\
    \    public override void OnActivated(UIApplication application) {\n    public\
    \ override bool FinishedLaunching(UIApplication a, NSDictionary dictionary)\n\
    \    {\n```\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_185_0.png)"
