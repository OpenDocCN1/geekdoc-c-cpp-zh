  md: 'cation to use UISwitch by adding item to your PreferenceSpecifiers array of
    a type of PSToggleSwitchSpecifier.


    +   1. Create a new item, and change its type to dictionary.


    +   2. Add a child row with the key of Type and the value of PSToggleSwitchSpecifier.


    +   3. Add another child row with the key of Key and the value of Share With Friends.


    +   4. Next, add a child row with the key of Key and the value of share.


    By default, a toggle switch causes a Boolean behavior or false to get saved into
    the on and off defaults. You can override this by assigning a different value
    to the optional keys TrueValue and FalseValue. You can assign strings, dates,
    or numbers to the position (TrueValue or the off position (FalseValue) so that
    the Settings application stores the string you specify instead of just storing
    true or false. Set the on position to save the string Enabled and the off position
    to store Disabled.


    +   5. You need add two children to this item: one with the key of TrueValue and
    a value of Enabled, and a second with a key of FalseValue and a value of Disabled.


    +   6. You have one more required in dictionary, which is the default value. If
    you had not supplied the optional FalseValue and TrueValue items, you would create
    a new row with the key of DefaultValue and change the type from string to Boolean.
    However, because you added two items, the value you pass in DefaultValue has to
    match either the value passed TrueValue or the one passed in FalseValue.


    +   7. Most iphone users are social media junkies, enable sharing by default.
    Create one last child and give it a key of DefaultValue and a value of Enabled.
    Note that the string Enabled is what is going to be stored in the User Defaults,
    the UISwitch still displays On/Off.


    Figure 8-14 shows the Property List Editor with a PSToggleSwitchSpecifier that
    allows the user to turn on or off switching. Figure 8-15 shows the result.


