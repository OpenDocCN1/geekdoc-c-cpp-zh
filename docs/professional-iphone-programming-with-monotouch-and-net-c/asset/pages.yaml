    # SUMMARY


    In this chapter you have learned about the two different frameworks that provide
    location-based services and mapping functionality to iPhone OS devices: CoreLocation
    and MapKit.


    You have built samples to:


    +   - Determine the current location of a device, the heading it is facing, and
    the nearest address to that location.


    +   - Track movement with different levels of accuracy.


    +   - Display a map and change the imagery from road to hybrid or satellite photography.


    +   - Add pin markers to the map.


    +   - Customize the pin markers to display informational text, images, and buttons
    and add functionality to these buttons.


    +   - Use standard .NET Framework classes to build a simple geocoder using a Google
    web service and MKMapKit.


    In the process you learned about some of the unique issues around MonoTouch''
    implementation of MapKit (such as the addition of .NET events to the MKMapKit
    class) and also the strategies for dealing with varying accuracy of location data
    in your applications.


