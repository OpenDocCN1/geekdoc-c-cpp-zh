  md: 'However it is not quite that easy! When this example is tested on a GPS-enabled
    device the first few readings might look like those shown in Table 7-2 even though
    the device is perfectly stationary.


    # **TABLE 7-2** Mapping02 Example Output


    | LOCATION (ROUNDED) | ACCURACY | DISTANCE FROM LAST READING (ROUNDED) |

    | --- | --- | --- |

    | -33.8898,151.249 | 2917 | 0 |

    | -33.8909,151.251 | 2283 | 227.2 |

    | -33.8907,151.2486 | 162 | 223.9 |

    | -33.8911,151.2488 | 76 | 43.9 |

    | -33.8911,151.2497 | 17 | 7.4 |


    What''s happening? The code is receiving multiple notifications with varying levels
    of accuracy, which affects the reported location. As the accuracy improves, the
    location is (likely to be) closer to the actual location of the device. Even though
    the device hasn''t moved, the reported location is moving. Unless your code has
    some intelligence to deal with varying accuracy, it might try to tell the user
    in this situation that he has traveled 502.4 meters when he hasn''t actually moved
    an inch!


    Strategies to address this issue:


    +   - Setting the distance and accuracy filter to the level of that you need.

    - Evaluating the accuracy of location data to see whether it meets your requirements:
    If you need high levels of accuracy you might ignore inaccurate readings.

    - Comparing location data to recent historical reports to determine whether they
    fall within a reasonable range (in particular for the elapsed period).

    - Communicating the margin of error to the user (such as the ''halo'' of uncertainty
    around the Current Location marker in the built-in Maps application).

    - Checking the Timestamp on location reports: Often the first location returned
    will be cached from a previous CoreLocation request. This might cause an obvious
    ''bug'' if the user has just turned on his phone after stepping off a plane, and
    the cached location data is from another city or country!


    # USING MAPKIT


    The MapKit framework consists of the MKMapView visual control and a number of
    supporting classes to manipulate and annotate the map''s display. Figure 7-10
    shows the most commonly used MapKit classes.'
