    A snippet of the HTML source from development WebView03 and the resulting output
    are shown in Figure 4-4.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_85_0.png)


    There are some things that you can''t do with an HTML file. You might want to
    generate the HTML dynamically in your code or reference local files as images
    and style sheets. The UIWebView you need to find local files in the basedirectory
    that all the references are relative to.


    > Any files (such as HTML and images) in your MonoTouch project that are marked
    as Bundle Action: Content will become part of your application when deployed to
    the simulator or a device. You can discover the complete path using the static
    property NSBundle.MainBundle.Path.


    That location is useful for displaying data files embedded in your application;
    however, you will not save files within the application bundle. If you saves data
    to a file, you should use a different path as Environment.GetFolderPath(Environment.SpecialFolder.Personal),
    which corresponds to the Documents folder—this data will be backed up by iTunes
    and won''t be lost if the application is upgraded to a newer version.


    The next example in the download — WebView04 — shows how to display dynamically
    generated HTML and reference local files in the HTML. The code does the following:


    +   - Determines the application bundle location.

    - Generates an HTML string in code (the complete HTML string has been truncated
    in the example shown).'
