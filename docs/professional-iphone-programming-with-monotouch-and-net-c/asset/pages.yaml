  md: "# DISPLAYING DATA IN A TABLE\n\nThe simplest form of table renders a list of\
    \ data on the screen using a built-in cell style. Create a new solution Tables01\
    \ in MonoDevelop, drag a UITableView onto the main window using Interface Builder,\
    \ and create an outlet table for it. Add the code in Listing 6-1 to Main.cs to\
    \ create a basic table. The kinds of effects you can create:\n\n+   > Creating\
    \ some data to display, in this case a simple array of strings calls colors. For\
    \ your table could come from anywhere — a hardcoded list, a database query, or\
    \ web service call.\n\n+   > Assigning the UITableView.Source property of an instance\
    \ of custom UITableViewSource subclass, passing a reference to the data being\
    \ displayed. This is how the delegate pattern “asks” the UITableView instance\
    \ for the information it needs to render, including the number of rows and what\
    \ object to display in each cell.\n\n+   > Implementing the two required methods\
    \ in the UITableViewSource subclass:\n\n+   - RowsSection: Tells the table how\
    \ many rows will be required to display the entire data set.\n\n+   - GetCell:\
    \ Called when it is rendering to the user interface. You simply create a new UITableViewCell\
    \ each time and assign your data to the TextLabel. Notice that you pass reuseidentifier\
    \ “mycell” to the constructor — it is not used elsewhere in this code but it would\
    \ be very important for larger tables later.\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_138_0.png)\n\
    \n# LISTING 6-1: Basic table display (Tables01/Main.cs)\n\n```\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing MonoTouch.Foundation;\n\
    using MonoTouch.UIKit;\nnamespace Tables01\n{\n    public class Application\n\
    \    {\n        static void Main(string[] args)\n        {\n            UIApplication.Main(args);\n\
    \        }\n        public partial class AppDelegate : UIApplicationDelegate\n\
    // This method is required in iPhoneOS 3.0\n        public override List<string>\
    \ OnActivated(UIApplication application) {}\n            private List<string>\
    \ colors;\n        }\n        public override bool FinishedLaunching(UIApplication\
    \ app, NSDictionary options)\n```\n\ncontinues"
