    # THIRD-PARTY APPLICATION INTEGRATION


    In addition to opening native Apple applications from your own app, you can also
    open applications written by third-party companies. These third-party applications
    need to optimally expose a protocol for them to allow interaction with other applications
    (this method is explained in the next section). Because applications can pick
    and choose how they go about implementing a protocol, they also need to provide
    documentation on how to use their protocols.


    Finding a particular application''s web site and then how to implement its protocol
    can be very difficult. A little site like www.handleopenurl.com provides a great
    resource for this. It''s a community-driven site where you can easily search for
    an application you may want to interact with. The following examples show you
    how to interact with two free applications available from the AppStore.


