  md: '# 2


    # Introduction to MonoTouch


    WHAT''S IN THIS CHAPTER?


    +   - Getting started with MonoTouch

    - Using MonoDevelop with MonoTouch

    - MonoTouch and Interface Builder

    - Debugging and deploying


    What is MonoTouch? If you''ve bought this book, you probably at least have some
    basic idea, but this chapter is all giving you the essential answers to this question
    so that you have a firm foundation from which to try your hand and apply your
    development skills to iPhone application development.


    Simply put, MonoTouch is a set of tools that allows developers to build iPhone
    and iPod applications on a Mac using extensive knowledge of the .NET Framework.
    The MonoTouch programming interface (API) provides a combination of the core .NET
    3.5 Framework features and the APIs that are provided by the iPhone SDK. To allow
    this to happen, the .NET Framework is compiled into ARM code so that it will run
    on the iPhone device, whereas the iPhone native APIs, which are written in Objective-C
    and C, are exposed via an interop between C# and the native APIs themselves. This
    allows developers to code against these foreign APIs in a familiar fashion and
    in a way that they are comfortable with their being knowledge of C#.


    # BEFORE YOU BEGIN DEVELOPING


    I''m going to make an assumption right from the go and that assumption is that
    you have an Intel Mac. The reason behind this is that the Apple iPhone SDK only
    supports these types of machines for development. Because MonoTouch uses the iPhone
    SDK, you''ll also need to'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'adhere to the development restrictions Apple imposes. To get your first MonoTouch
    application and running, you need to do a few things:


    +   1. Make sure you have your Intel Mac running at least 10.5.7.


    +   2. Download and install the Mono framework: www.go-mono.com/mono-downloads/download.html.


    +   3. Download and install MonoTouch: http://monotouch.net/.


    +   4. Download and install MonoDevelop: http://monodevelop.com/Download.


    +   5. Download and install the iPhone SDK: www.apple.com/downloads/macosx/development_tools/iphonesdk.html.


    > > Order of installation framework is important since MonoTouch and MonoDevelop
    depend on the Mono framework. Make sure you install these items in the order stated
    in the preceding numbered list.


    Now that you have all of the components installed, you''re ready to delve into
    MonoTouch. First, we want to take a look at what MonoTouch contains.


    # THE COMPONENTS OF MONOTOUCH


    The four components of MonoTouch are as follows:


    +   - monotouch.dll, which is a C# assembly that provides a binding API into the
    iPhone''s native APIs. (A full list of the APIs that can be found later in the
    chapter in Table 2-2.)


    +   - mtouch, which is a command-line SDK that will compile to C# and Common Intermediate
    Language (CIL) code. This compiled code can then run in the simulator or in an
    actual iPhone.


    +   - An add-in to MonoDevelop allows for iPhone development, which allows MonoDevelop
    to use the command-line tool mtouch and allows for integration with Interface
    Builder and the iPhone simulator. It also enables to deploy the device and building
    for distribution to the App Store and ad-hoc releases.


    +   - A commercial license of the Mono runtime, allows for the static linking
    of the Mono runtime with the code developed to be sold in the App Store.


    # What Is Mono?


    At the core of MonoTouch is Mono. Mono (which is Spanish for monkey) is an open-source
    implementation of the .NET Framework. It has been created by Novell to enable
    a cross-platform version of the .NET Framework. It means that the framework can
    run on many different platforms such as Apple OS X, Linux, Nintendo''s Wii, PlayStation
    3, and many others, including'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Windows. Because Mono is open source, this enables anyone to use and modify
    the framework to their own needs, which is useful if you want to target restrictive
    platforms. With this in mind, MonoTouch uses a modified version of the Mono framework
    to develop against then runs a linker on the application code (and the framework)
    to cut down the size of the overall code in your application. The linker concept
    is explained further in the “Understanding the Linker” section later in this chapter.


    # # Namespaces and Classes of MonoTouch


    The section discusses the core namespaces and classes that are included within
    MonoTouch. MonoTouch uses a superset of the Silverlight .NET assemblies, meaning
    that additional functionality has been added to the Silverlight .NET assemblies
    within MonoTouch. Table 2-1 shows a list of the .NET assemblies that are available.


    **TABLE 2-1:** Available .NET Assemblies in MonoTouch


    | ASSEMBLY | API COMPATIBILITY |

    |--- |--- |

    | Mono.CompilerServices.SymbolWriter.dll | For compiler writers |

    | Mono.Data.Sql.dll | ADO.NET provider for SQL; some limitations to the iPhone
    OS SQL version |

    | Mono.Data.Tds.dll | TDS Protocol support; used for System.Data.SqlClient support
    within System.Data |

    | Mono.Security.dll | Cryptographic APIs |

    | mscorlib.dll | Silverlight |

    | System.dll | Silverlight, plus types from the following namespaces: System.Collections.Specialized
    System.ComponentModel System.ComponentModel.Design System.Diagnostics System.IO.Compression
    System.Net System.Net.Cache System.Net.Mail System.Net.Mime System.Net.NetworkInformation
    System.Net.Security System.Net.Sockets System.Security.Authentication System.Security.Cryptography
    System.Timers |

    | System.Core.dll | Silverlight |'
