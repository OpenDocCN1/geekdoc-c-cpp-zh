  md: "If you are converting an Objective-C example or reading Apple’s documentation\
    \ you will find references to UITableView’s Delegate and DataSource properties.\
    \ In Objective-C UITableViewDelegate and UITableViewDataSource are protocols that\
    \ can both be implemented by the same class, but in C# they are exposed as abstract\
    \ classes, which means you must implement two subclasses for every table you create.\n\
    In MonoTouch properties and methods of these two classes have been \"merged\"\
    \ into UITableViewSource as a convenience for C# developers. MonoTouch allows\
    \ you to use either approach: is no difference in functionality — in this chapter\
    \ only the UITableViewSource approach has been used because it involves less typing.\n\
    \n# Selecting a Cell\n\nUITableView provides a lot of default functionality with\
    \ little or no additional coding — already the examples behave like an iPhone\
    \ OS application by inheriting the default font text settings and supporting smooth\
    \ scrolling. Respond to the touching cell takes only a few lines of code — first\
    \ create this method in the UITableView subclass to pop up a message:\n\n```\n\
    public void showAlert (string title, string message)\n{\n    using(var alert=new\
    \ UIAlertView(title,message,null,\"OK\",null))\n    {\n        alert.Show();\n\
    \    }\n}\n```\n\nThen implement the RowSelected method on the UITableView subclass.\
    \ The NSIndexPath object contains information on which row was selected — the\
    \ Row tells you the index that is used to retrieve the value in the rows array:\n\
    \n```\noverride void RowSelected\n(UITableView tableView, NSIndexPath indexPath)\n\
    {\n    ShowAlert(\"Selected\",\"You selected \"+rows[indexPath.Row]);\\n}\n```\n\
    \n> An instance of NSIndexPath contains enough information to identify a specific\
    \ row in a UITableView. In these simple examples only the Row property is used,\
    \ when grouping is used (later in the chapter) the Section property is also required.\n\
    \nYou can take many actions when a table cell is touched: Add a checkbox to the\
    \ cell, open a new view, navigate elsewhere in your application, or whatever else\
    \ you think of. Some of these actions are covered later in the chapter."
