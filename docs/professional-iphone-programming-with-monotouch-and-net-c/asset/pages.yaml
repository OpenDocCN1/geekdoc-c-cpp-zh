  md: "# Coding with the Accelerometer\n\nThe accelerometer allows a program to read\
    \ when the iPhone is moving and return data about the movement of the device.\
    \ The iPhone OS and MonoTouch provide a software solution to integrating with\
    \ the Accelerometer and handling acceleration events. The SharedAccelerometer\
    \ is a shared C# object that provides access to the acceleration hardware on the\
    \ device. Listing 9-1 shows how to handle acceleration events and display information\
    \ to the user.\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_222_0.png)\n\n```\n\
    // The name AppDelegate is referenced in the MainWindow.xib file.\npublic partial\
    \ class AppDelegate : UApplicationDelegate\n{\n// This method is invoked when\
    \ the application has loaded its\n// UI is ready to run\npublic override bool\
    \ FinishLaunching(UIApplication app, NSDictionary dictionary)\n{\n    // If you\
    \ have defined a value, add it here:\n    window.AddSubview(navigationController.View);\n\
    \    window.MakeKeyAndVisible();\n    Acceleration does not work in the Simulator.\n\
    UIAccelerometer.SharedAccelerometer.UpdateInterval = 1 / 10;\ndataLabel.Text =\
    \ \"Empty\";\nUIAccelerometer.SharedAccelerometer.Acceleration += delegate(object\
    \ sender, \nUIAccelerationEventArgs e) {\n        UIAcceleration acc = e.Acceleration;\n\
    \        double thresholdValue = 2.0;\n        double Velocity = Math.Sqrt(Math.Pow(acc.X,\
    \ 2) + \n            Math.Pow(acc.Y, 2) + \n            Math.Pow(acc.Z, 2));\n\
    \        string strReturn = System.Environment.NewLine;\n        if (Velocity\
    \ > thresholdValue) {\n            dataLabel.Text = \"Velocity: \" +\n       \
    \         Velocity.ToString() + strReturn +\n                \"X: \" + acc.X.ToString()\
    \ + strReturn +\n                \"Y: \" + acc.Y.ToString() + strReturn +\n  \
    \              \"Z: \" + acc.Z.ToString();\n        }\n}\n\n    return true;\n\
    }\n```\n\n> Found in the Accelerometer\\Main.cs file of the document\n\nA couple\
    \ of notes about programming with the accelerometer:\n\n+   The accelerometer\
    \ returns changes in the X, Y, and Z directions. It is up to the developer to\
    \ perform the math calculations to return the magnitude of the acceleration as\
    \ well as the direction. The magnitude of acceleration is calculated by adding\
    \ the squares of the acceleration in the X, Y, and Z directions and taking the\
    \ square root of the sum.\n\n+   The accelerometer is not available in the iPhone\
    \ simulator. It can only be tested on an actual device."
