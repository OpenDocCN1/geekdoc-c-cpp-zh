  md: '# 9

    Programming with Device Hardware


    WHAT''S IN THIS CHAPTER?


    +   - Programming accelerator, device orientation, and proximity detection support

    - Supporting networking

    - Developing with battery life in mind


    The iPhone has a vast amount of exciting hardware available. Although this hardware
    and in itself does not interest users, the excitement is can when the application
    presents the users with information in a way that makes sense to them. This hardware
    is very interesting to developers building apps; it allows for applications to
    provide extraordinary features based on top of this hardware. This chapter looks
    at the accelerometer, device orientation, proximity detection, networking, and
    the battery. Some example uses of this hardware are follows:


    +   - A program can test that network connection over any connection (WiFi, 3G,
    or EDGE) is available. If a connection does not exist, instead of displaying an
    error message when attempting to upload information, the user can be notified
    that there is no connection to a service.


    +   - The accelerometer can be used to pull random data from a data source. When
    the device is shaken, the application can respond by reading random data from
    a data source.


    +   - When the user changes the device from portrait to landscape, the application
    can change how it displays content to the user.


    Most of this device support comes from the MonoTouch UIKit class. The UIKit class
    exposes the CurrentDevice instance, which represents the current device. CurrentDevice
    is a static, read-only member of the UID class. The UID class allows a developer
    to obtain information about the current device, such as its unique id (used'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'for uniquely identifying an iPhone, assigned name, device model, operating
    system name, operating system version, and its physical device characteristics
    include the device orientation, battery state, and the proximity sensor. Other
    pieces of the iPhone provide support, as the networking stack that lets a program
    test whether an address is reachable, and the accelerometer, which lets a program
    know if a device is shaken.


    # RESPONDING TO ACCELERATION


    The accelerometer is one of the most interesting features of the iPhone. The UrbanSpoon
    app iPhone, one of the original native applications for the iPhone, is a great
    example of using accelerometer to return random restaurant data. With that app,
    you just shake your iPhone and the apps find a good restaurant nearby. For the
    accelerometer it is commonly used along with user interfaces, such as the UIPicker,
    to retrieve data. By programming the iPhone to respond to Acceleration events,
    you can refresh the data displayed to the user whenever you shake the iPhone.


    # Accelerometer


    In general, an accelerometer measures the proper acceleration of the device relative
    to freefall. The accelerometer in the iPhone provides changes in the XYZ axis
    which allows a program to detect the orientation of the device and the movement
    of the device. Because the changes are provided in the XYZ axis, the acceleration
    can be calculated in a vector.


    The MonoTouch framework makes it easy to access the accelerometer via the MonoTouch
    UIKit namespace, which exposes the UAccelerometer.SharedAccelerometer member.
    Instances of the class are accessed as a static, read-only member of the UIAccelerometer
    class.


    # Using the XYZ Coordinate System


    Understanding how the data is returned from the accelerometer is important. Multiple
    coordinate systems can be used. In the end, Apple has implemented the XYZ coordinate
    system for providing acceleration information. Figure 9-1 shows the iPhone within
    the coordinate system.


    Assuming that the user along the Z-axis, if the iPhone is moved toward or away
    from the user, acceleration occurs along the Z-axis. If the iPhone is moved left
    or right, acceleration occurs along the X-axis. If the iPhone is moved up or down,
    acceleration occurs along the Y-axis. The acceleration values can be determined
    along each axis. And with the help of some math, the total magnitude of acceleration
    can be calculated as well as the direction of that acceleration at any given time.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_221_0.png)'
