- img_proc: true
  md: '# CHAPTER 1 INTRODUCTION TO IPHONE DEVELOPMENT WITH MONOTOUCH FOR C# DEVELOPERS


    .NET layer over the native iPhone programming layer present on the iPhone OS,
    referred to Cocoa Touch. Cocoa Touch is based on the Cocoa layer in the Mac OS
    X and is available on the iPhone, iPod and iPad. MonoTouch does not provide a
    mechanism for cross-platform Windows Forms applications, but allows developers
    to build applications that run natively on the iPhone.


    Overall, the application programming interface (API) exposed by the MonoTouch
    SDK is a combination of the .NET 2.0 Framework''s core features, the Silverlight
    2.0 API and the APIs on the iPhone. MonoTouch provides a bridge (interop) between
    the iPhone''s native APIs based on Objective-C and C-based APIs to the .NET that
    C# developers are accustomed to.


    # MonoTouch Components


    +   MonoTouch is made up of the following components:

    - MonoTouch.dll is a C# assembly that provides a binding API to the iPhone''s
    native APIs.

    - A command-line tool that compiles C# and Common Intermediate Language (IL) code.
    This compiled code can run in the simulator or an actual iPhone.

    - An add-in to MonoDevelop that allows for iPhone development and for Interface
    Builder to create graphical applications.

    - A commercial license of the Mono runtime, which allows for the static linking
    of the Mono runtime with the code developed.


    # Namespaces and Classes


    MonoTouch provides a rich set of namespaces and classes to support building applications
    for the iPhone. Some of the most popular namespaces and classes are:


    +   - MonoTouch.ObjRuntime: This namespace provides the interop/bridge between
    the .NET/C# world and the Objective-C world of the iPhone.

    - MonoTouch.Foundation: This namespace provides support for the data types necessary
    to communicate with the Objective-C world of the iPhone. Most types are directly
    mapped. For example, the NSObject-C base class is mapped to the MonoTouch.Foundation
    NSObject class. Some are not directly mapped and are instead mapped to native
    .NET types. For example, NSString maps to the basic string and NSArray maps to
    a strongly typed array.

    - MonoTouch.UIKit: This namespace provides a direct mapping between the UI components
    within Cocoa Touch. The mapping is done by providing .NET classes for each developers
    will spend most of their time working with. For .NET developers, Cocoa Touch is
    an abstraction layer or API for building programs that run in the iPhone. Cocoa
    Touch is based on the Cocoa API used in building programs that run on the Mac
    OS X operating system. Cocoa Touch can be thought of as Cocoa tuned for the touch-based
    iPhone operating system.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'OpenTK: This namespace is a modified version of the OpenTK API. OpenTK is an
    objectoriented binding for OpenGL, which stands for the Open Graphics Library.
    OpenGL is an API for using three-dimensional graphics. OpenTK is a library for
    performing OpenGL, OpenGL, and it is written in C# and runs on Windows, Mac OS
    X, and Linux. The OpenTK implementation on the iPhone has been updated to use
    CoreGraphics and to only expose the functionality available on the iPhone.


    In addition, MonoTouch provides a set of additional namespaces that may be important
    to you. These are:


    +   - MonoTouch.AddressBook

    - MonoTouch.CoreGraphics

    - MonoTouch.AddressBookUI

    - MonoTouch.AudioToolbox

    - MonoTouch.MapKit

    - MonoTouch.MediaPlayer

    - MonoTouch.AVFoundation

    - MonoTouch.MediaPlayer

    - MonoTouch.CoreAnimation

    - MonoTouch.SystemConfiguration


    These namespaces are fairly self-explanatory in their functionalities and are
    specific to the iPhone.


    # MonoDevelop


    MonoDevelop is a free IDE for developing with Mono and is an early branch of the
    SharpDevelop IDE. Originally, MonoDevelop ran only on Linux, but with version
    2.2, MonoDevelop began running on the Mac. MonoDevelop on the Mac allows for the
    creation and management of iPhone projects as well as deploying and deployment
    to the simulator and devices for testing.


    # iPhone


    There''s no doubt that Apple has changed the mobile device marketplace since the
    introduction of the original iPod in 2001. Although the iPod was not the first
    device to play mp3 files, it was the first that played mp3 files, made it easy
    to use, and provided an easy-to-use marketplace to purchase audio files. The iPod
    really caused the mp3 device marketplace to explode.


    In January 2007, Apple turned the smartphone upside down when it officially announced
    the first-generation iPhone. The iPhone was designed to be a smartphone that provided
    web browsing,'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# CHAPTER 1 INTRODUCTION TO IPHONE DEVELOPMENT WITH MONOTOUCH FOR C# DEVELOPERS


    e-mail, and multimedia capabilities. The first-generation iPhone connected to
    a wired network and applications were delivered to the user over the mobile version
    of Safari.


    Writing a web-based application for the iPhone is fairly simple. The Safari browser
    is a great tool — it does an excellent job of scaling web-based applications to
    an iPhone-sized screen. It also does well running applications that are highly
    dependent on JavaScript. Upgrading an iPhone web-based application is also a simple
    method of deploying a new version of the application to a web server. Many applications
    have this approach.


    > Unfortunately, web applications are not suitable for all applications — applications
    that require some background processing, access to local resources, must work
    when a network connection is unavailable, and some other application types do
    not work well in this model.


    So, the question becomes how one might write an application that fits into the
    iPhone?

    The-generation iPhone did not have support for users to load applications on the
    device. For a few users, this was not acceptable, and they began jailbreaking
    their iPhones, which is the process where users run software on the devices that
    Apple has not approved.


    Jailbreaking has several problems:


    +   **Technical Issues:** Jailbreaking requires the iPhone owner to perform the
    operation, and many iPhone users are not technically proficient to do this.

    **Legality:** The legality of jailbreaking falls within the United States Millennium
    Copyright Act. The Electronic Frontier Foundation has asked Apple to recognize
    an exception to the DMCA that allows iPhone owners to jailbreak their devices.
    Apple has argued in response that jailbreaking an iPhone is a copyright violation.

    **Unknowns:** It comes with a series of unknowns. How can a jailbroken iPhone
    be upgraded to new versions of the iPhone operating system (OS)? Will jailbreaking
    an iPhone open it up to security risks?


    In 2008, Apple introduced the second generation of the iPhone, referred to as
    the iPhone 3G. With this generation and the new version of the iPhone OS, Apple
    released a number of enhancements, including ability to put together an ecosystem
    where users can find and install applications on their iPhone called the App Store.


    These native applications are a great improvement over web-based applications,
    which are limited in what they can do on a device. Fundamentally, they have to
    be loaded over the Web and are not able to access all device features. Native
    applications have more support for device features like the accelerometer, file
    system, camera, cross-domain web services, and other features that are outside
    of features available in HTML and JavaScript. In, native applications do not depend
    on the network to be loaded, whereas a web application is dependent on the wireless
    network for loading.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_35_0.png)'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'In 2009, Apple introduced the iPhone 3GS and version 3 of the iPhone operating
    system. The iPhone 3GS, a refinement of the iPhone 3G, supports higher data rates
    than the iPhone 3G, an improved camera, an updated CPU, and voice control.


    In 2010, Apple announced and shipped the iPad. The iPad is a tablet device, and
    it has a larger screen than the iPhone. Also significant is that it shipped with
    the iPhone operating system that is fundamentally different from the iPhone.


    Along with the release of each new iPhone, Apple has introduced a new iPad touch.
    The iPad touch can be thought of as an iPhone without the phone, camera, and support
    for the 3G data services; however, the iPad touch does support for wireless networking
    using WiFi.


    Since its availability three years ago, Apple has shipped more than 60 million
    units of the iPhone. The iPad is estimated to ship several million units of the
    iPad in its first year of availability, and this will likely result in the iPad
    being the most popular tablet in 2010.


    Unfortunately, for developers, three issues must be considered when running the
    device:


    +   - The iPhone operating system does not allow for code that is interpreted
    or dynamically compiled in any.


    +   - Apple''s licensing for the SDK and developing with the iPhone does not allow
    for applications to have interpreted or dynamically compiled code.


    +   - Apple has an extensive validation process for iPhone applications. Some
    of the automated tests for an application will check for dynamically compiled
    code.


    These issues and licensing are something developers need to be knowledgeable of,
    and some-what limit the choices that a developer has for writing applications
    that run on the iPhone.


    # MOBILE DEVELOPMENT


    There are a few developers need to know when building applications on the iPhone
    with MonoTouch:


    +   - The iPhone has a startup timer. If an application takes longer than 20 seconds
    to start up, the iPhone OS kills it.


    +   - The iPhone OS will kill any application that is unresponsive for longer
    than 20 seconds while the application is running. To work around this, you need
    to perform some type of asynch-operation.


    +   - The time spent processing the FinishedLaunching() event counts against the
    startup timer. As a result, you may not any long-term synchronous processing in
    the FinishedLaunching() event.


    +   - The iPhone simulator is good for initial testing; however, it is not accurate
    for all testing. Just because something works in the simulator doesn''t mean it
    will run in the iPhone in the same way. Final testing should be completed in the
    iPhone.'
  merge: -1
