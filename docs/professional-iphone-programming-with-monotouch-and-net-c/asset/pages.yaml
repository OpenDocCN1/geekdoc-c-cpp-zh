    The parameters for LocalizedString are:


    +   - key: the string used to lookup the translation in the default .strings file
    (and is also used as the fallback display value). This string should not contain
    ASCII characters as accented letters (like é).

    - comment: comment describing the text to aid translators. It is useful to store
    this in the code where the string is used. The comment is not displayed in the
    application.


    And the method works like this:


    +   1. Look for a matching key in the language-specific directory''s default Localizable.strings
    file.

    2. If no match is found, use the key to pass to the LocalizedString method as
    the display text.


    Because the operating system looks in multiple places then decides the key string
    pass to the method, when the application runs without any .strings file it is
    still usable. Apple''s development documentation recommends always using display
    text as the key for this reason — if no suitable translation can be found, least
    proper English will be displayed.


    There are two parameters passed to, they are:


    +   - key: the string used to lookup a translation in the default .strings file.

    - value: The fallback value to use if no translation is found in any .strings
    file. When this overload is used, the key is never displayed to the user. Extended
    ASCII (including accented characters like é) are allowed in this parameter.'
