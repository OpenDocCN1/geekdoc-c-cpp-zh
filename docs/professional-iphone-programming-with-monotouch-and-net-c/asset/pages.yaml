- img_proc: true
  md: 'To use SystemSound, you need to instantiate a new SystemSound object, passing
    to the constructor an NSURL the file path to the audio you want to play. The SystemSound
    object exposes two methods to play the sounds.


    +   - You can play an alert sound with the PlayAlert method. The alert behaves
    differently depending on the user settings on the device (which as vibrate when
    the sound is played) and the type of device (for example, an iPod Touch versus
    iPhone).


    +   - The other method exposed to you is the PlaySystemSound, and this is likely
    to be the method you would use for playing short sound clips.


    Listing 10-16 shows how to create the SystemSound object and play the audio file.
    The PlaySystemSound and PlayAlertSound methods are asynchronous, so they do not
    block the thread and will not block the UI thread.


    > Remember the audio file needs to be included in your project and the build action
    set for Content to work. Compressed audio files such as MP3 are not supported,
    so you need to use the AVAudioPlayer class (discussed later in the chapter) to
    play compressed audio files or use an uncompressed file such as CAF (Core Audio
    Format).


    # LISTING 10-16: Playing uncompressed audio


    ```

    using MonoTouch.AudioToolbox;


    ...

    var audioFile = NSURL.FromFilename("audio.caf");

    SystemSound sound = SystemSound.FromFile(audioFile);

    sound.PlaySystemSound();

    ```


    # Vibration


    You''re probably thinking this this is in the wrong place; vibration is not a
    sound or audio. However, to make the device vibrate, you can use the PlaySystemSound
    method on a special field of the class called Vibrate. You can directly call the
    play method on this field to make the device vibrate. Note that the vibration
    works only on a device and nothing happens in the simulator.


    ```

    SystemSound.Vibrate.PlaySystemSound();

    ```


    # Long Audio


    Chances are you going to want to either play compressed audio in your application
    or play audio that lasts longer than 30 seconds. The AVAudioPlayer class provides
    functionality to play different types of files and much longer audio files.'
