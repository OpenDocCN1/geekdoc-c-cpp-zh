    # MonoTouch.ObjCRtime


    When you want to communicate with any Objective-C code, the MonoTouch ObjCRtime
    namespace and the classes within it are the place to start. The key classes that
    you are most likely to use are Runtime, Selector, and Messaging.


    +   - The Runtime allows you to get information back from the Objective-C world
    such as NSObjects.

    - The Selector class allows you to work with selectors (remember selectors are
    essentially methods in Objective-C) from C#.

    - Messaging is the glue between these two classes allowing them to communicate
    and work together.


    In the next section you can see a very simple binding to the Flurry analytics
    using a tool called btouch, which is created by the MonoTouch team to enable an
    easy automated way of creating the Objective-C binding. This saves having to manually
    create a binding yourself.


    # Automatic Binding to Objective-C with btouch


    Using binding is a great way of using third-party Objective-C libraries within
    your MonoTouch application. To allow this to happen, first must download the third-party
    library you want to bind to. The example uses the analytics library “Flurry.”
    This example uses the 1.4 version of Flurry, so using a different version may
    vary. With this library, the downloaded files consist of a few different files.


    +   - FlurryLib: Flurry library folder without location functionality.

    - FlurryLib.h: Header file for the Flurry library.

    - FlurryLib.a: A statically compiled library file.

    - FlurryLibWithLocation

    - FlurryLibWithLocation.h: Header file for the library with added location specific
    methods.

    - FlurryLibWithLocation.a: A statically compiled library file with location functionality.


    +   - ProjectApiKey.txt: This file contains the API key you need to use with the
    library.


    +   - README.txt: ReadMe file on how to use the library; this won’t be needed
    since it focuses on Objective-C code.


    +   - RELEASE_NOTES.txt: Release notes explaining what has changed since previous
    versions.'
