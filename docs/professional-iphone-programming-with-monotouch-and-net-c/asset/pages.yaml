    \ which method to call when the gesture is detected. Generally you will specify\
    \ this as the class and create a new Selector to indicate which method.\n- \"\
    Register\" the gesture recognizer with the UIView that you want to be double-tapping\
    \ using the AddGestureRecognizer() method. Note that the UIView requires UserInteractionEnabled=true.\n\
    - Declare the method to handle your double-tap and mark it with an export attribute\
    \ using the same Selector to pass to AddTarget(). The C# method is not important\
    \ as long as the selector and selector strings match.\n- Within the method you\
    \ can capture details about the double-tap event from the UIGestureRecognizer\
    \ sender, as the location tap occurred. You must pass in the UIView that you relative\
    \ coordinates to in most cases that will be the view that detected the event (which\
    \ in the example code is a UIView). Your code can then respond to the double-tap\
    \ using those coordinates.\n\n# LIST 13-9: Double Tap Gesture (iPad06\\MyViewController.cs)\n\
