  md: '# CHAPTER 3 PLANNING YOUR APP''S UI: EXPLORING THE CONTROLS


    ILabel represents a read-only text view. UILabels can contain varying amounts
    of text and may shrink, wrap, or truncate the text, depending on the size of bounding
    rectangle and properties you set. Through its properties you can control the font,
    text color, alignment, highlighting, and shadowing of the text in the label. To
    do this, follow these steps:


    +   1. Open Interface Builder.


    +   2. Navigate to Interface & Value objects, and select a ULabel. Drag it onto
    your window/view and place it.


    +   3. Create an outlet for this UILabel so that you can access this object from
    your code.


    The members that you most frequently work with in your UILabel are:


    +   > Text: The actual text to be displayed by the label.


    +   > TextAlignment: Assign the UITextAlignment to choose Left, Center, or Right.


    +   > TextColor: Assign a named color (such as UIColor.Blue) or a System color
    (such as UIColor.DarkTextColor), or from method to use any other color.


    +   > Font: Set the font typeface and size for the text.


    +   > Lines: The maximum number of lines used to render the text.


    Figure 3-7 shows the UILabel options in Interface Builder.


    Not only can you set these inside Interface Builder but also set them from inside
    your code. The UILabel is used to display read-only information and doesn''t have
    any events to respond to clicks or touch events. This will be a very static control
    and most likely will be used as a sub-view in other controls to display your data.
    Here is an example of using these basic properties in code:


    ```

    // UILabel outlet is named Label

    Label.Font = UIFont.FromName("Times New Roman", 17f);

    Label.TextAlignment = UITextAlignment.Left;

    Label.TextColor = UIColor.Red;

    Label.Lines = 3;

    Label.Text = "It''s a UILabel from inline code with MonoTouch";

    ```


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_69_0.png)


    FIGURE 3-7


