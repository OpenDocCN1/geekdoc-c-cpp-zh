  md: "# UISLider\n\nThe UISider displays a horizontal bar, called a track, which\
    \ represents a finite range of values. The current value is shown by the position\
    \ of an indicator, or thumb. A user selects a value by sliding the thumb along\
    \ the track. You can customize the appearance of both the track and the thumb:\n\
    \n+   * Minimum: The minimum value that the control will display.\n* MaxValue:\
    \ The maximum value that the control will display.\n* MinValueImage: Contains\
    \ the image that is drawn on the side of the slider representing the minimum value.\n\
    * MaxValueImage: Contains the image that is drawn on the side of the slider representing\
    \ the maximum value.\n\nFigure 3-11 shows the UISlider controls options in Interface\
    \ Builder.\n\nThe following shows the code using these properties and creating\
    \ a delegate for when the value is updated:\n\n```\n// UISider outlet is named\
    \ slider\nslider.MinValue = 0.0f;\nslider.MaxValue = 10.0f;\nslider.SetValue(10.0,\
    \ false);\nslider.Changed += delegate(object sender, EventArgs e) {\n    Console.WriteLine(\"\
    New Value: \" + slider.Value);\n};\n```\n\n# UIACTIVITYINDICATORVIEW\n\nThe UIActivityIndicatorView\
    \ displays an element that provides feedback on the progress of a task or process\
    \ with an unknown duration (to show the progress of a task with known duration,\
    \ use UIProgress instead). As long as the task continues, the activity indicator\
    \ spins. A user does not interact with an activity indicator. The following is\
    \ a list of properties that are most used with the UIActivityIndicatorView.\n\n\
    +   * HidesWhenStopped: A Boolean that determines whether or not the control will\
    \ display when it is not animated.\n* ActivityIndicatorAnimationStyle: The UIActivityIndicatorViewStyle\
    \ to choose Gray, White, or WhiteLarge.\n\nFigure 3-12 shows the UIActivityIndicatorView\
    \ options in Interface Builder.\n\nThe following code uses these properties and\
    \ to start the animation:\n\n```\n// UIActivityIndicatorView outlet is named activity\n\
    activity.ActivityIndicatorViewStyle = UIActivityIndicatorViewStyle.WhiteLarge;\n\
    activity.HidesWhenStopped = true;\nactivity.StartAnimating();\n// Do Something\n\
    activity.StopAnimating();\n```"
