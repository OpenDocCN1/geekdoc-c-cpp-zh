    \ Visible parts of the underlying view are dimmed when a modal view is displayed.\
    \ Table 13-2 lists the available styles.\n\nTABLE 13-2: ModalPresentationStyle\
    \ Options\n| STYLE | DESCRIPTION |\n| --- | --- |\n| PageSheet | Full height and\
    \ width of portrait (therefore appears fullscreen in portrait mode in landscape\
    \ mode the background view is visible on either side) |\n| FormSheet | Small centered\
    \ view |\n| FullScreen | Fullscreen (same as earlier iPhone OS versions) |\n|\
    \ CurrentContext | Inherits the same style used by the parent view controller\
    \ |\n\nYou can also choose from four different animation styles to use when displaying\
    \ a modal view, shown in Table 13-3.\n\nTABLE 13-3: ModalTransitionStyle Options\n\
