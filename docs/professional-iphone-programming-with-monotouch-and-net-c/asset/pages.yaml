  md: '# MAP BASICS


    Before you start looking at the mapping capabilities of iPhone OS and MonoTouch,
    here are some mapping terms that are used throughout this chapter:


    +   - Latitude: The Y value of a location (90 to –90 degrees to south).


    +   - Longitude: The X value of a location (180 to –180 degrees to west).


    +   - Heading: Compass direction expressed in degrees (0–360).


    +   - GPS: Global Positioning System. A collection of satellites using radio signals
    to enable earth-receivers to determine their location with a high degree of accuracy.


    +   - Geocode: Resolving a search string (for example, an address, business, or
    landmark name) to a geographic location (latitude/longitude).


    +   - Reverse geocode: Finding the “human readable” address for a specific latitude/longitude
    location.


    The iPhone SDK provides two frameworks to enable mapping-related functionality
    within your application:


    +   - MapKit: Provides a control to display map imagery, allows you to add markers
    (pins) and reverse geocode a location.


    +   - CoreLocation: Uses whatever capabilities the device supports to determine
    the user’s location and heading (if possible).


    Used together these enable you to add mapping and location-based services to iPhone
    applications, and MonoTouch provide easy access to all the features they provide.


    # Introducing MapKit


    The MapKit framework provides a visual representation of geographic information
    using Google Maps images and data. Users can access the same road, satellite,
    and hybrid maps that they are familiar with web-based mapping applications; you
    can look up the closest “real” address for a given latitude/longitude location.
    The map is navigated with the drag and pinch gestures across the iPhone OS without
    any additional code.


    The MapKit framework is exposed in MonoTouch via the MonoTouch.MapKit namespace.


    # Introducing CoreLocation


    CoreLocation works on a number of iPhone OS devices using a variety of technologies
    to determine position, and using the built-in compass of newer devices provides
    the heading where the device is pointing to. Using this information you can determine
    where users are and what direction their device is facing, and by monitoring changes
    to how data fast they are moving and how far they have traveled.'
