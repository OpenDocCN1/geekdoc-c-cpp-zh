    \ fingers in opposite directions |\n| UILongPressRecognizer | Holding down a finger\n\
    \nList 13-9 shows how to use the UITapGestureRecognizer to detect and respond\
    \ to a double-tap. The important lines are as follows:\n\n+   - Create an instance\
