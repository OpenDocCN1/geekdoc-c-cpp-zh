    \    cell.TextLabel.Text = display.Symbol;\n    return cell;\n}\n```\n\nThe DequeueReusableCell\
    \ method asks if there are any available UITableViewCell objects that can be reused,\
    \ returns nil or creates a new UITableViewCell object and returns it at the end\
    \ of the method (ultimately back into the queue if it is off-screen).\n\n\"mycell\"\
