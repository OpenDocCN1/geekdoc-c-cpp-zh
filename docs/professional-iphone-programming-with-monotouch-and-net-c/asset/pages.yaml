  md: "# Implementing an OpenURL Scheme\n\nIf you have already played around with\
    \ the UIApplication.SharedApplication object, you may have noticed the HandleOpenURL\
    \ is exposed. In the second version of the iPhone SDK, this method was the recommended\
    \ way of handling incoming requests with the URL Schemes. In the latest version\
    \ of the iPhone SDK (3.1.3 at the time of writing), the HandleOpenURL method has\
    \ been superseded by FinishedLaunching with NSDictionary parameter options. This\
    \ method was introduced to be the de facto standard of handling the application\
    \ startup, opening URLs, and handling Apple Push Notification Service (APNS) requests.\
    \ This is the default FinishedLaunching method used in the MonoDevelop iPhone\
    \ templates, so you wouldnt need to add any code to this.\n\nWhen an application\
    \ calls into yours, the options dictionary contains key-value pairs: UIApplicationLaunchOptionsURLKey\
    \ and UIApplicationLaunchOptionsSourceApplicationKey. List 11-2 shows how to extract\
    \ the URL used to call your application and how to work out the source of the\
    \ call.\n\n# LISTING 11-2: Extract url information\n\n```\npublic bool FinishedLaunching(UIApplication\
    \ app, NSDictionary options)\n{\n    if (options != null)\n{\n        var urlKey\
    \ = new NSString(\"UIApplicationLaunchOptionsURLKey\");\n        var urlSource\
    \ = new NSString(\"UIApplicationLaunchOptionsSourceApplicationKey\");\n      \
    \  var url = (NSUrl)options[urlKey];\n        var source = (NSUrl)options[urlSource].ToString();\n\
    \n        // Grab information from NSUrl object.\n        Console.WriteLine(\"\
    Url = \" + url.AbsoluteString);\\n        // The URL Identifier from the app that\
    \ called this app.\n        Console.WriteLine(\"Source = \" + source);\\n    }\n\
    }\n```\n\nThe URL that you receive can be parsed to enable deep linking into your\
    \ app by extracting the relevant information. To test that this works and that\
    \ your app opens up as it should, you can use Safari in the simulator as a way\
    \ to call the URL. To do this, you want to enter the URL in the address bar of\
    \ the Safari app, which then closes Safari and opens up your application. This\
    \ works for all the previously mentioned URLs and protocols.\n\n# INTEGRATING\
    \ WITH THE ADDRESS BOOK\n\nThe Address Book is a key part of the exciting iPhone\
    \ functionality. This is where all the contacts users might have on their phone\
    \ life. Accessing this information can be very useful within your application.\
    \ You may want to allow users to see a list of their friends so they can send\
    \ a link to your application, for example."
