    Figure 7-4


    CLLocationManager is the class responsible for interfacing with the hardware and
    a subclass of CLLocationDelegate is required to receive "events" from it.


    Delegate classes and methods in the iPhone SDK perform a similar function to event
    handlers in .NET. The delegate subclass implements certain methods and gets assigned
    to a framework class that is responsible for interfacing with hardware. As data
    becomes available from the hard-delegate methods are called on your subclass and
    your application can respond.


    It takes some time (possibly many seconds) to retrieve location information using
    a delegate class allows your FinishedLaunching "startup code" to call StartUpdatingLocation()
    and then continue to run, knowing when the data becomes available your delegate
    method will be called for you to process it.


