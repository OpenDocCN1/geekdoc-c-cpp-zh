  md: "# Handling the Selection of Properties\n\nOn most of the views in the last\
    \ few code samples, notice some of the properties (such as telephone number or\
    \ e-mail address) are selectable, but when they are selected, happens. This is\
    \ because you need to decide whether or not the default action for the property\
    \ (such as selecting a phone number calling it) should happen. The view controllers\
    \ allow you to handle this, by using a PerformDefaultAction event. The event arguments\
    \ for this event include a property called PerformDefaultAction. To allow the\
    \ default action to happen, you simply set the property to true. Along with a\
    \ few properties the property that was selected is also passed in. This means\
    \ you can optionally let certain types of properties perform their default action.\
    \ This is useful, for example, if you don't want your application quitting from\
    \ someone clicking a phone number but you want to provide the in-app mail functionality.\
    \ Listing 11-9 shows an example of achieving this.\n\n# LISTING 11-9: Handling\
    \ default actions\n\n```\n// Example for ABPersonViewController\npersonvc.PerformDefaultAction\
    \ += delegate(object sender,\nABPersonViewPerformDefaultActionEventArgs e) {\n\
    \    // Only Allow Emails to be clickable\n    if(e.Property == ABPersonViewController.Email)\n\
    {\n        if(MailComposeViewController.CanSendMail)\n{\n            var email\
    \ = e.Person.GetEmails()[e.Identifier.Value];\n            var mail = new MailComposeViewController();\n\
    \            mail.SetRecipients(new[] {email.Value });\n            mail.Finished\
    \ += delegate (\n                personvc.DismissModalViewController(true);\n\
    \                personvc.PresentModalViewController(mail, true);\n          \
    \  );\n        }\n    }\n    else\n        e.ShouldPerformDefaultAction = true;\n\
    }\n};\n```\n\n> Make sure you have a contact with the name \"Example\" in your\
    \ address book that also has an e-mail address so that this example works.\n\n\
    Listing 11-9 shows how you would go about creating a default action when tapping\
    \ a property on a person view controller. The ABPersonViewPerformDefaultActionEvent\
    \ event argument has a"
