    you handle the default action. In this example, notice that it handles the action
    when an e-mail property is tapped. The CanSendMail method on MPMailComposeViewController,
    you can check if the device can send an e-mail, and if this is, you can provide
    the MPMailComposeViewController to allow the user to send an e-mail inside your
    application. If the user cannot send an e-mail inside the application, you want
