  md: '# Peeking in the Settings Bundle


    property list. If you want your preferences to include any sub-views, you have
    to add additional property lists to the bundle and add an entry to Root.plist
    for each child view. This is covered in detail later on in the chapter.


    # Adding Settings Bundle to Your Project


    Currently in MonoDevelop adding a settings bundle is a two-step process:


    +   1. First you must choose the Settings.bundle to do what you need to right-click
    Project  Add Add New Folder then name your folder Settings.bundle


    +   2. Then you right-click on the Settings.bundle and choose Add ⊋ New File ⊋
    XML �� Empty XML File, which you name Root.plist.


    Figure 8-3 shows the New XML file dialog on the iPhone home screen.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_206_0.png)


    FIGURE 8-3


    # Setting Up Your Property List


    If double-click the Root.plist, you open up the Property List Editor. From here
    you can edit your file and make sure it''s in the proper format for the Settings
    application to pick up. Before getting into the specifics about the format, it
    would be good to review some of the basics of the property lists all have a root
    node that has a type of Dictionary. This means that the node items using a Key/value
    pair, just as an NDictionary does. All of the children of a Dictionary need to
    have both a key and a value. To be a valid property list, your Root.plist must
    have only one root node, and all nodes must come under it.


    Different types of nodes can be put into a property list. In Dictionary nodes,
    which allow you to store child nodes, there are also Array nodes, which store
    an ordered list of other nodes similar to NSArray. The Dictionary and Array types
    are the only property list nodes that contain other nodes. There are also another
    of other node types designed to hold data. The data node types are Boolean, Data
    (Base64 encoded data, such as NSData), Date, Number, and String.'
