  md: "# Adding an index\n\nAdding an index (the alphabetic list the right side of\
    \ the table that lets you jump directly to any part of the table) is as easy as\
    \ implementing a method to decide what values should be displayed for each section:\
    \ SectionIndexTitles. It is your responsibility to ensure the number of elements\
    \ in this array is the same as the number of groups in your data.\n\n```\npublic\
    \ override string[] [SectionIndexTitles (UITableView tableView)\n // for the right-vertical\
    \ index: preferably only one character\n // is: \"A\", \"B\", \"C\", etc if you\
    \ were using the alphabet\nreturn sectionTitles.ToArray();\n```\n\nThere is limited\
    \ vertical space for the index on iPhone-sized devices so choose your indexing\
    \ strategy carefully — an index is most commonly used to display the alphabet\
    \ (such as in the Contacts and iPod applications). Use too few items and it looks\
    \ sparse and unfamiliar to users; with too many items it will be crowded and unusable.\
    \ Figure 6-6 shows a table with and without an index — it’s much easier to scroll\
    \ quickly to “Z” with an index.\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_147_0.png)\n\
    \nFIGURE 6-6\n\n> To search the magnifying glass that the built-in applications\
    \ use in their indexes, return \"{search\" as an element of the SectionIndexTitles\
    \ array. This is equivalent to using the constant UITableViewIndexSearch in Objective-C."
