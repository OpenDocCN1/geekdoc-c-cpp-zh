  md: '# Working with Remote Data


    of the database schema to support the new features in that upgraded application.
    What are the strategies that can be inserted into an application to handle upgrading
    a database that is out in the wild?


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_122_0.png)


    # Upgrading in Place


    With an existing database, one strategy is to track the version of an application
    within a table. By tracking the database schema version, the application can check
    the version on startup. If the version is not the current version, an upgrade
    of the schema can be done by executing a series of SQLite commands against the
    database. This strategy requires a check on startup of the application. This strategy
    would be good for a complicated database schema.


    # Copying Data


    The upgrade place solution requests a check each time the application starts.
    Another option is to check on startup and if the schema is not the correct version
    to create a new instance of the database and copy the necessary data. Then you
    can use a significant number of commands to be executed and potentially a lot
    of data to be moved. The more commands that must be executed the more opportunity
    there is for a mistake to be made. This option would be a good idea for an application
    that must make an extensive number of changes.


    > FIGURE 5-1


    # Storing Remotely


    The two options mentioned — and are most likely others — both result in data being
    stored in the application. Neither takes into account what happens if the device
    is lost or damaged. Another option to the problem of storing data is storing data
    remotely. The next section focuses on the web services support necessary to store
    data remotely.


    # WORKING WITH REMOTE DATA


    Applications longer live like islands of data. Everything is interconnected, or
    will be. The ability to connect with remote data is not only nice to have, but
    a requirement with today''s applications. When I got my first cell phone, I had
    all kinds of places where I connection or didn''t have any signal. Those days
    are away. Signal connections are available in all of the places I frequent, though
    such as in a gym locker room. Typically, the remote data is seen as a problem
    that has been solved. This section looks at two primary ways to connect to data
    services over the Internet: SOAP and REST. Each operates over HTTP and port 80.
    Other mechanisms exist to interchange data, but this section just looks at these
    two.'
