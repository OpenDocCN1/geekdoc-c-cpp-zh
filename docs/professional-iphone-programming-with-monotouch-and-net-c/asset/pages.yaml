  md: '# ACADEMIC VERSUS PRAGMATIC APPROACHES


    MonoTouch is an interesting place to be.


    Although Objective-C is built on top of plain old C, what sets it apart is that''s
    a layer of object-orientation implemented in a message-passing, dynamic paradigm.
    With Objective-C, you can basically pick up the phone, call an object, whatever
    you''d like to it, and it''ll either answer or won''t.


    C#, on the other hand, began its life as a statically typed language. You couldn''t
    pick up the phone and call a C# object at runtime, tell whatever you wanted to,
    and then expect it to behave. The most part, if you could call a C# object, you
    would have to "Press 1 to place an order, press 2 to check the status of an order,
    press 3 to cancel and,, if you''d like to do anything else, please call another
    object." Functionality is baked in compile time


    Objective-C, built on top of C, isn''t purely static. C#, which has acquiring
    dynamic features over the years, is no longer purely static. It is an amalgam
    of languages, incorporating a little of this and a little of that.


    In the middle is MonoTouch.


    You can now write static code that gives you the benefits of compile-time error
    checking. Some developers could find this hindrance, whereas others the idea of
    catching simple errors due to typos before their apps are in the hands of customers


    MonoTouch isn''t nearly as widely as Apple''s native developer stack, there''s
    a tendency for Objective-C developers to build with C#/MonoTouch developers in
    forums, at talks, in letters to the editor, and anywhere else you might find the
    two worlds overlapping.


    When the emotions and brand loyalties are stripped from the arguments, there''s
    usually nothing left. However, in the cases where the stacks and their actual
    technical details are being discussed, they can be pared down even further


    Ultimately, di-hard Objective-C developers tend to dislike it when Objective-C
    is talked about terms that don''t belong to the domain of languages based on messaging
    (Smalltalk, the inspiration for Objective-C, being such a language). This is perfectly
    fair. There are significant differences in how Objective-C works as opposed to
    C# works.


    A common example of a dispute-causing difference is when a C# developer says something,
    "I have an NSString, and I''m trying to call its intValue method, but I''m getting
    an error..."


    In Objective-C, one doesn''t "call methods." Rather, messages are "sent" to an
    object. At runtime, if the class an instance of has a method implementation that
    can be reached by the message sent, the instance will handle it and do its job.
    If an object, or "receiver," doesn''t "respond" to a message, meaning that it
    doesn''t have a corresponding method implementation, that message could be ignored


    If you''re accustomed to languages like C#, and if that paragraph didn''t make
    much sense to you, you aren''t alone. Developers might argue the advantages of
    either paradigm, developers are also known for presenting their opinions as facts.'
