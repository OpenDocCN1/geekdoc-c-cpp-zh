  md: '# TABLE 14-1 (continued)


    | IN OBJECTIVE-C... | IN C#... | NOTES |

    | --- | --- | --- |

    | Interfaces | Class definition | In Objective-C, an interface (see @interface
    in Table 14-2) specifies the class name, superclass, which protocols (interfaces
    in C#) it implements, its local instance variables, method definitions, and properties.
    It goes in the class''s header file. In C#, the class definition and its implementation
    are the same. |

    | Messages | Methods | Wherever "messages" are discussed, it''s safe to think
    of them as C# methods. Though there are differences, for the purposes of reading
    Objective-C, you can get away without having to consider these differences. |

    | Properties | Properties | Though properties are similar between Objective-C
    and C#, their purposes can be quite different. In Objective-C properties don''t
    generate getters and setters for local instance variables, but can also handle
    some of the repetitive groundwork of Objective-C, such as reference-counting.
    Because C# is garbage-collected, and because MonoTouch takes care of reference
    counting, the particulars of Objective-C property implementation don''t matter
    much to the C developer. One thing to remember is that Objective-C properties
    are always accessed via "self" (the equivalent of C#''s "this"). It''s also the
    only place Objective-C makes use of dot-notation (self.propertyName = variable).
    |

    | Protocols | Interfaces | An Objective-C protocol is very similar to a C# interface,
    but with one important exception: Objective-C protocols can be partially implemented.
    With Objective-C 2.0, developers can specify that a method is required (see @optional
    and @required in Table 14-2). However, Objective-C protocols do not require full
    implementation. |

    | Receivers | Object instances | In Objective-C, you "send messages," and those
    messages go to a "receiver." In C#, you "call methods" on an object." |

    | Selectors | Methods | Like messages, the C# developer can safely think of selectors
    as methods. The distinction becomes important when working with the Objective-C
    runtime. For more information, see Chapter 11 on creating MonoTouch bindings.
