  md: 'CHAPTER 1 INTRODUCTION TO IPHONE DEVELOPMENT WITH MONOTOUCH FOR C# DEVELOPERS


    # # PRODUCT COMPARISON


    This section takes a quick look at .NET Framework, Mono and MonoTouch — three
    products that have allowed the largest segment of developers to develop the iPhone,
    the most exciting mobile platform currently in the marketplace.


    # ## NET Framework


    In the late 1990s, Microsoft began work on the .NET Framework. The first version
    of the framework was shipped in 2002. Microsoft proceeded to introduce subsequent
    versions of the .NET Framework and has recently introduced the .NET Framework
    4. The .NET Framework comes in various versions, including 32-bit versions, 64-bit
    versions, a version for the XBOX gaming platform, and a version for Microsoft''s
    mobile devices referred to the Compact Framework (CF). A few facts about .NET
    Framework:


    +   - Microsoft released a development tool, Visual Studio .NET, with the Framework.
    This tool is the Integrated Development Environment for .NET.

    - It''s based on a virtual machine that executes software for the framework. This
    virtual environment is referred to as the Common Language Runtime (CLR), and is
    responsible for security, memory management, program execution, and exception
    handling.

    - Applications in the .NET Framework are initially compiled from source code,
    such as Visual Basic or C#, to an intermediate language, called MSIL. The initial
    compilation is performed by calling the language specific line compiler, Visual
    Studio, or some other build tool. A second compilation is typically done when
    an application is executed. This second compilation takes the intermediate language
    and compiles it into executable code that can run on the operating system. This
    second compilation is referred to as just-in-time compilation.

    - It''s language independent, and many languages are available for the Framework.
    In the Visual Studio, Microsoft has shipped various languages including Visual
    Basic, F, C++, and C#.

    - It has series of libraries that provide consistent functionality across the
    languages. These libraries are referred to as the Base Class Libraries.

    - Microsoft has subscribed parts of the .NET Framework to various standard organizations.
    Some of these are the C# language, the Common Language Infrastructure, Common
    Type System (CTS), Common Language Specification (CLS), and Virtual Execution
    System (VES).

    - It has the largest number of developers for any development framework out there.
    As a result, more developers are familiar with the .NET Framework than any other
    development framework.

    - A disadvantage of the .NET Framework is that it is not available for non-Mono
    platforms.


    # ## Mono


    Mono is an open source project that provides a C# compiler and Mono for non-Windows
    operating systems. Mono is currently licensed under GPL version 2, LGPL version
    2, the MIT, and dual licenses. Mono runs on Mac, Linux, BSD, and other operating
    systems.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Mono was officially announced in 2001 and is the brainchild of Miguel Icaza.
    Mono version 1.0 shipped in 2004, and currently Mono is at Version 2.6. Mono continues
    to be led by Miguel Icaza and is under the general leadership and support of Novell.


    As much as there is the desire to match .NET Framework''s features, this is not
    possible due to the fact that Microsoft has more resources and a start head in
    the development of those features. At the same time, the Mono project has parity
    with a large number of .NET Framework features.


    Along with Mono, there is an open source IDE MonoDevelop, which started as a port
    of the SharpDev IDE. Mono began as a project to allow for Mono development on
    Linux, but with the release of MonoDevelop 2.2, the ability to develop Mono expanded
    to the Mac, Windows, and several other non-Linux UNIX platforms.


    Though the .NET Framework is very popular, two issues make it unsuitable for the
    iPhone:


    +   - At level Apple and Microsoft are competitors and are likely not too excited
    to work together.


    +   - The .NET Framework fundamentally dynamically compiled at runtime. This is
    the just-in-time compilation of the .NET Framework. This is a violation of the
    Apple license and the operating principles of the iPhone OS.


    Given that code running on the Microsoft .NET Framework is compiled to machine
    code using the just-in-time compilation, one would expect applications written
    for Mono would have the same behavior and thus not be suitable for running on
    the iPhone. However, Mono has a technology that allows for applications to be
    compiled ahead of time, referred to as AOT technology.


    A disadvantage of .NET/Mono and the iPhone is that .NET/Mono developers cannot
    take their .NET/Mono/C# knowledge and apply it to the iPhone platform. As illustrated
    in Figure 1-1, you see Mono developers cannot target the iPhone because they are
    separate entities.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_32_0.png)


    FIGURE 1-1


    # MonoTouch


    In 2009, Novell announced and shipped MonoTouch, which allows .NET developers
    to create iPhone applications in C#. With MonoTouch, applications are compiled
    into executable code that runs on the iPhone. The significance of this should
    not be underestimated: .NET/Mono developers can target the iPhone through MonoTouch.
    This is illustrated in Figure 1-2.


    How does MonoTouch accomplish this? It somehow allows Forms applications to be
    translated or compiled and deployed on the iPhone? MonoTouch provides a


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_32_1.png)


    FIGURE 1-2'
  merge: -1
