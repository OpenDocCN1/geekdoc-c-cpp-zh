    # USING INTERFACE BUILDER


    The Interface Builder tool is provided in the iPhone SDK. The tool is commonly
    used in Mac OS X development and iPhone application development. Interface Builder
    provides a drag-and-drop interface for a developer to lay out controls on a screen.
    Using Interface Builder is very much love/hate thing, especially for those coming
    from a Visual Studio background; it has lots of similarities to the designer within
    Visual Studio, but how it works and allows controls to be set up is very different.


    > Interface Builder is completely optional and all controls can be used straight
    from code, but it is a useful tool for creating layouts.


    Interface Builder is integrated straight into MonoDevelop, and double-clicking
    any .xib file automatically opens Interface Builder for the selected .xib file.


    When you open Interface Builder, you are presented with a few different windows
    as shown in Figure 2-5.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_48_0.png)


    Figure 2-5'
