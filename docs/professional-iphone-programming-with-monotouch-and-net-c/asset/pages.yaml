  md: "# Device Orientation Support\n\nOne important feature of the iPad Human Interface\
    \ Guidelines is that all iPad applications must operate in any device orientation.\
    \ Some iPhone applications already support portrait and landscape orientations\
    \ (the built-in applications such as Mail and Safari are good examples), even\
    \ they support only three views: Portrait, LandscapeRight, and LandscapeLeft.\
    \ To conform to Apple's guidelines, iPad applications are expected to work in\
    \ the PortraitUpsideDown position as well.\n\nWhen your application rotates you\
    \ must ensure your views resize appropriately, which may be simple or complex\
    \ depending on how you build your user interface. When developing iPhone applications,\
    \ you can often create and use a ViewController object directly; however, to override\
    \ the autotation for an iPad application you need to create a subclass as shown\
    \ in Listing 13-1.\n\n# LISTING 13-1: Overriding ShouldAutotateToInterfaceOrientation\
    \ (IPad0\\MyViewController)\n\n```\n[Register(\"MyViewController\")]\npublic class\
    \ MyViewController : ViewController\n{\n    public ViewController() {}\n    public\
    \ override bool ShouldAutotateToInterfaceOrientation\n    (UIInterfaceOrientation\
    \ toInterfaceOrientation)\n{\n        return true;\n    }\n}\n```\n\nTo see this\
    \ you need to place some controls on this ViewController and add it to your window.\
    \ On each control you need to set the AutizingMask property to indicate how the\
    \ control's shape and position should change when the device is rotated. Listing\
    \ 13-2 contains two autoresizing examples:\n\n+   A UITextView that has flexible\
    \ Left, Top, Right, and Bottom margins. This means the controls keep the same\
    \ Height and Width but the position changes in proportion to its original place\
    \ in the window.\n\n+   A UIScrollView with flexible Height and Width, which implies\
    \ that the margins are \"fixed\" and will remain \"anchored\" to the edges of\
