  md: 'Whether one system is better than the other doesn''t ultimately matter. Presumably,
    you''re a C# developer, and you want to write apps for the iPhone using C#. With
    that in mind, the goal here isn''t to teach you to code in Objective-C, but to
    teach you just enough that you''ll be able to mentally parse Objective-C code
    and "translate" the assorted jargon into terms you''re familiar with reading documentation.


    The approach here, then, is pragmatic rather than academic. You have a job to
    do. The philosophy and deeper explanations behind Objective-C are available should
    you choose to go on and learn about the language for reasons beyond those presented.


    An aspect of the pragmatic method in this case is trying to map the closest concepts
    and terms between the two languages, their runtimes, and frameworks. To return
    to an earlier example, as frequent might be to send a message as opposed to calling
    a method, sending messages and calling methods are, to an app developer, basically
    the same thing.


    # BASIC SYNTAX AND CONCEPTS


    As discussed earlier, Objective-C is a set of object-oriented functionality built
    on top of C. As such, much of the code in an Objective-C app, depends how different
    it can look, is C.


    In those cases, C#, Java, Python, or any other number of languages, will have
    already familiar you with variable creation, flow-control, and other core details
    of coding. If a block in Objective-C will be instantly recognizable.


    The aspects of Objective-C most likely to trip you up are:


    +   - Initializers versus constructors

    - Sending messages versus calling methods

    - Reference-counting versus garbage-collection


    What''s great about MonoTouch is that, for the most part, lets you write C# as
    you normally would, abstracting away the unfamiliar and orienting you in a manner
    so that you might never have realized how different things are done in Objective-C:


    +   - Initializers as constructors.

    - You can call methods like you would, not having to worry about what it means
    to "send a message" (for more information, see Chapter 11).

    - Reference-counting is hidden from you.


    To read Objective-C, you still need to know a little about what this all means
    and how to parse it in your head.


    At this point, code is the easiest way to demonstrate the differences and how
    Objective-C concepts map to C.


    Listing 14-1 shows a block of Objective-C. Take a look at it, allow yourself to
    be confused, and let questions form in your mind. This will prime you for quickly
    learning how to see this code as C#.'
