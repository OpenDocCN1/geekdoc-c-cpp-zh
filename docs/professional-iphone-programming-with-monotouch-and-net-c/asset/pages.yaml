    +   2. Drag and drop the .ipa and .mobileprovision files onto Library Applications
    in iTunes (see Figure 15-55). On the Mac, you can just drag them to the iTunes
    icon in your dock.


    +   3. Verify that the application shows in Library Applications. Note that it
