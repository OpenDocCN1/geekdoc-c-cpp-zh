  md: '# # Introduction to iPhone Development with MonoTouch for C# Developers


    WHAT''S IN THIS CHAPTER?


    +   - The history of the iPhone and its mindshare

    - A short history of Mono and its relationship to the .NET Framework

    - How MonoTouch opens the iPhone to .NET Developers

    - Why MonoTouch is so attractive to developers


    The past several years have seen an amazing growth in the use of smartphones,
    and USA Today recently reported how smartphones have become an indispensable part
    of people''s lives.


    Windows-based computers running 32-bit x86 or 64-bit x64 processors dominate the
    desktop computer marketplace, and the .NET Framework is the dominant development
