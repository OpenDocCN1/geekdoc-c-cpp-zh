    # Memory Management


    The last aspect of Objective-C''s most likely to confuse you at first is its memory-management.


    Based on reference-counting, Objective-C''s method of managing memory leaves the
    developer with a lot of control and responsibility over an object should be created
    and when it should be destroyed. On the desktop, Objective-C supports garbage
    collection (as of Objective-C 2.0). It is not, however, available on the iPhone.
    This is one of the many things MonoTouch does for. And although reference-counting
    is trivially simple compared to other methods of non-GC memorymanagement, it still
    requires a developer to be cautious and methodical while writing iPhone apps in
    Objective-C.


    If you''ve ever used an iPhone for a few minutes and then it crash on you, it''s
    likely that the developer wasn''t paying enough attention to managing memory,
    and a leak resulted in depletion of system resources. The scenario promotes the
    OS to shut the app down before it everything brings the device to a halt, likely
    requiring a reboot. Hence, the crash.


    As a MonoTouch developer, you''re fortunate that you can generally ignore any
    referencecounting you in the Objective-C source you''re reading:


    Here''s a list of messages involved in reference-counting:


    +   - retain


    +   - release


    +   - autorelease'
