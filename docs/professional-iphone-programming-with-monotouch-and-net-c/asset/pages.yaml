  md: '# Grouped Table Style


    When you are placing a UITableView in Interface Builder it defaults to the Plain
    style shown in the previous examples. There is another style — Grouped — which
    provides a more visual connection between groups. The Grouped style can be used
    for long lists but is also commonly used to display tables containing short lists
    of repeats information (such as in the Settings application).


    Because the style of a table is set during its initialization, the Style property
    is read-only and cannot be changed in FinishedLaunching in code (beyond the scope
    of this chapter), you should choose the style in Interface Builder when you are
    designing the table (in Figure 6).


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_148_0.png)


    UITableView also allows for a footer to be shown at the end of each section. It
    can be added in Plain and Grouped styles, although it looks better with Grouped
    tables. You can easily add footers to the table with another method in the delegate
    class: TitleForFooter.


    ```

    public override string TitleForFooter(UITableView tableView, int section)


    int count = sectionElements[section].Count;

    return String.Format("%*d elements start with (%s)", count, sectionTitles[section]);n

    ```


    Grouped tables are usually used for alphabetical grouping but more often when
    you want to show smaller sets of data or when the table is being used to display
    a format. The iPhone Human Interface Guidelines state that you should not use
    an index (that is, implement SectionIndexTitles) with the Grouped table style.'
