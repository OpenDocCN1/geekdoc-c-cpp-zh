  md: '(Optional) You are going to use the class NSUserDefaults to handle the communication
    with your saved preferences, so you need to create a reference to this class:


    ```

    var prefs = NSUserDefaultsDefaults.StandardUserDefaults;

    ```


    After you have an instance of NSUserDefaults you can make some very simple calls
    to get the value for the key you need. You will read in the settings you created
    in the previous section of the chapter; notice there is a method for each type
    of variable that you may need: StringForKey, IntKey, objectForKey, FloatKey, DoubleKey,
    DictionaryKey, and ArrayKey. You will need to use that method that corresponds
    to the variable that you are expecting:


    ```

    string username = prefs.StringForKey("username");

    string password = prefs.StringForKey("password");

    string sharingService = prefs.StringForKey("service");

    string shareEnabled = prefs.StringForKey("share");

    int refreshToken = prefs.IntForKey("refreshToken");"

    ```


    # # Updating Your Settings


    You now know how to read settings, but what if you need to make a change from
    inside your app?


    (Optional) Again, you need to make sure that you have a reference to MonoTouch.Foundation.
    This gives you access to the NSUserDefaults class that does all of the heavy lifting
    for you. Before you need, create a reference to this class:


    ```

    var prefs = NSUserDefaults.StandardUserDefaults;

    ```


    After you have an instance of NSUserDefaults you simply use the Synchronize method
    for the setting to set the value and call it as illustrated here:


    ```

    prefs["username"] = new NSString(username.ToString());

    prefs["password"] = new NSString(password.ToString());

    prefs["service"] = new NSString(sharingService.ToString());

    prefs["share"] = new NSString(shareEnabled.ToString());

    int refreshToken = prefs.IntForKey("refreshToken\nprefs.Synchronize();

    ```


    You can take this knowledge along with the knowledge that you have learned about
    controls in previous chapters and make an in-app settings view for settings that
    the user might need to adjust in the application.


    # # SUMMARY


    This chapter introduced you to the NSUserDefaults class and the Settings.bundle
    so that you can allow users to easily change the preferences for your application.
    You have also learned how easy it is to read and change these settings from inside
    your app. Together with concepts and code you have learned in other chapters you
    can provide both an in-app settings and also a settings view inside the Settings
    application.'
