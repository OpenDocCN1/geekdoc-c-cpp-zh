    # UIPickerView


    The UIPickerView is analogous to a Drop Down List Box in Windows Forms or WPF
    or ASP.NET; the iPhone OS has a unique display style. It provides a set of options
    for the user to scroll through and only supports a single selection from that
    list—the row currently displayed in the center of the picker. Figure 4-10 shows
    an example picker from Safari where the web page used a <select> element to capture
    user input.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_94_1.png)


    FIGURE 4-10


    # Single Component Picker


    UIPickerView instances always sit on the edge of the window (normally the bottom)
    and take up the entire width of the screen. It has only two important members
    to discuss:


    +   - ShowsSelectionIndicator: Whether the transparent blue guide is shown over
    the center row of the control.

    - Model: Requires a delegate class that provides the picker with all the information
    it needs to display and react to user selection. The Model must contain or have
    a reference to the data you want to use for your picker.'
