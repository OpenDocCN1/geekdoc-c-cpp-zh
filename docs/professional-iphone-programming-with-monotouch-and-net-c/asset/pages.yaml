  md: 'The annotation (or callout) is added by the call to Map.AddAnnotationObject().
    Map

    GetViewForAnnotation usually gets called soon after — it is executed every time
    annotation becomes visible on the map in order for the relevant View object to
    be fetched so that the annotation can be placed within it. There are some important
    features of the GetViewForAnnotation method to review:


    +   1 returns immediately if the annotation parameter is of type MKUserLocation.
    Because this is the method called for every annotation added to the map, the Current
    Location marker, which you do not want to customize.


    +   2 casts the annotation parameter to a subclass of MKAnnotation. This is important
    because the type of the parameter is MKObject, which does not allow you to access
    any of the MKAnnotation properties required to customize the pin.


    +   3 creates a new instance of MKPinAnnotationView using the MyAnnotation class
    to provide the callout and text information. The second parameter "mynpin" is
    for using objects to draw marker, which is discussed in detail later in the chapter.


    AnimateDrop determines whether the pin "drops" from the top of the map, or just
    appears in place.


    CanShowCallout determines whether a callout appears when the pin is touched. If
    this is false the callout won''t appear, even if it is created.


    +   8 returns MKPinAnnotationView to be added to the MKMapView.


    The finished application in Figure 7-13 shows an annotation with its callout.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_190_0.png)


    FIGURE 7-13


    > Objective-C doesn''t have the same concept as .NET, which is why the iPhone
    SDK uses the delegate class to provide a mechanism to "call back" into your code.
    The delegate pattern has been used a number of times in this chapter for CoreTouch
    functionality.


    Early versions of MonoTouch also required MKMapKit to use a subclass of MKMapView
    to handle methods like GetViewForAnnotation and RegionDidChange; however, this
    pattern is unfamiliar to C# programmers. The MonoTouch team is gradually making
    the Objective-C APIs more .NET-like by exposing .NET events and properties in
    place of the delegate classes.


    The result is the GetViewForAnnotation delegate in this example — easier to use
    because no additional classes are required. The MKMapViewDelegate = MKMapViewDelegate
    subclass approach still works, but offers no advantage over the nicer C# syntax.


    Over time it is likely that other areas of the iPhone SDK that delegates will
    be similarly "improved" in MonoTouch by the addition of C# events.'
