- img_proc: true
  md: 'This hides the status bar, but only after the application has, well, finished
    launching. Your splash screen will come with a status bar for the majority of
    its appearance. However, if you use the Infoplist setting, your status bar will
    always be hidden.


    # UIInterfaceOrientation


    This is a key with a string value. The available options are the orientation options
    for the iPhone. This is the key to set if you want the application to launch in
    landscape mode. The default value here is standard portrait.


    If you want to launch the application in landscape mode, use UIInterfaceOrientationLandscapeLeft
    or UIInterfaceOrientationLandscapeRight.


    You can also launch upside down using UIInterfaceOrientationPortraitUpsDown. These
    values are the available orientations for the phone throughout the application.


    # UIRequiresWiFi


    This is a Boolean key, when set to true, will operate a Wi-Fi connection when
    the application launches. Use this if your application doesn''t work without Wi-Fi.
    This is especially helpful with displaying an error to users when no Wi-Fi is
    available.


    > Apple want to notify your users if Wi-Fi isn''t available (in other words, they''ll
    reject your app if you''re not), and because this key opens the connection on,
    it takes care of user notification for you.


    If this value is set to false, which is the default, the OS closes any active
    connection after 30 minutes.


    # UIPrerenderedCons


    When you put your 57x57 icon in the application, you''ll notice when it gets to
    the springboard, it has an added shine effect and gloss. Well, sometimes you don''t
    want that. If you want your icon to show how you designed it, without the shine
    and gloss, set this Boolean key to true, and it turns off the render effect.


    # PEEKING IN THE SETTINGS BUNDLE


    Users are used to all the programs and web sites they are providing them with
    a preferences window where they can set application-specific options. The iPhone
    OS provides users with a dedicated application that allows users to control preferences
    for their iPhone and the individual apps installed on it. This section shows you
    how to add settings for your application to the Settings application and shows
    you how to access those settings from within your application.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# The Settings Application


    The Settings application allows the user enter and change preferences for any
    applications that have a settings bundle. A settings bundle is a group of files
    built into an application bundle that tells the Settings application what preferences
    the application wishes to collect from the user.


    Figure-2 shows the Settings application open, where users can set preferences
    for their iPhone or for specific applications.


    The Settings application acts as a common user interface for the iPhone’s User
    Defaults mechanism. User Defaults is the part of Application Preferences that
    stores and retrieves preferences and is implemented by the NSUserDefaults class.
    Your application uses NSUserDefaults to read and store preference data using a
    key, just as you would collect keyed data from an NSDictionary. The difference
    is that NSUserDefaults data is persisted to the file system rather than in an
    object instance.


    If you use a settings bundle with your app, you get a UI for the Settings application.
    You create a property list defining your available settings, and the Settings
    application creates the interface for you.


    There are limits to what you can do with the Settings application, however. Any
    preference that your application is running should not be limited to the Settings
    application because your user would be forced to quit your application to change
    those values. If you have an immersive application, you generally want to provide
    a preferences view from within your application so that the user doesn''t have
    to quit in order to make those changes. This is especially true in games; however,
    there are times when utility and productivity applications might have preferences
    that a user should be able to change without leaving the application. Later in
    the chapter you learn how to collect preferences from the user in right and store
    them in iPhone’s User Defaults.


    # Adding Your App to the Settings Application


    The first thing you want to do is implement a settings bundle when the user launches
    the Settings application, or she finds an entry for your application. Once inside
    the Settings application, if a user selects your application, or she drills down
    into a view that shows the preferences that are relevant only to your app. The
    Settings application uses lots of UI elements from the iPhone to gather input
    from your users.


    # Working with the Settings Bundle


    The Settings application bases the display of preferences for a given application
    on the contents of the settings bundle must have a property list, called Root.plist,
    which defines the root-level preferences. This property list must follow a very
    preset format. When the Settings application finds a settings bundle with an appropriate
    Root.plist file, the Settings application builds a settings view for your application
    based on the contents of the


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_205_0.png)'
