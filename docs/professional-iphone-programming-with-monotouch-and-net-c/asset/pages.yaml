  md: '# Data Types


    For the most part, the C# equivalent to a data type in an Objective-C application
    will be obvious either by name or context. Objective-C adds very little on top
    of C. Most of the differences are in Cocoa, and it''s fairly easy to determine
    the C# equivalents of types as well (NSArray can be represented as a List, NSDictionary
    as a Dictionary, and so on).


    Where things get confusing is when you encounter an Objective-C type that has
    no C# counterpart or for which C# already seem to have a perfectly good data type.


    TABLE 14-3: Unknown Data Types in Objective-C and C#


    | OBJECTIVE-C | C# | EXPLANATION (IF NEEDED) |

