  md: '# CHAPTER 14 JUST ENOUGH OBJECTIVE-C


    The data types `NSString` and `string` ("string" shortcut to `System.String`)
    are functionally equivalent. They also get special treatment as far object construction
    goes, due to the frequency with which strings are used in apps.


    In the Objective-C version, you declare your variable''s type (`NSString`) and
    then assign it a string value. There is no manual allocation of memory, nor do
    you have to call a constructor, just like C#.


    In Objective-C, a string literal always takes the format `@String value goes here`.
    The `@` indicates that this is a compiler directive, all of which begin with the
    `@`. The purpose of these directives is to notify the compiler that it has to
    do some work for you. In this case, that work is to process the string literal''s
    convenience shortcut. The `@` isn''t used exclusively for your purpose, as you
    use it in the string formatting of the line that outputs the string value to the
    console, but a string literal before it indicates that the compiler has to step
    in and help out. Mostly, it''s to handle drudgery for you (nobody wants to manually
    create strings)


    * indicates that the variable you are creating is a pointer to a location in memory
    where the object is stored. Functionally, you can think of this as an everyday
    object in C#. Developers who have never worked with pointers tend to fear, but
    because you are reading this code rather than writing it, don''t let the * scare
    you.


    In C#, the quotes act as the shortcut. The C# compiler "knows" what to do here.
    You also don''t need to add `$` because you don''t need to tell C# that your variable
    is ultimately a reference to memory where your object is stored. It''s just understood.


    The next line, in the following code snippet, you get right into the differences
    between constructors and initializers. It also shows the syntactic differences
    between "sending messages" and "calling methods".


    ```

    UIButton *label = [[UIButton alloc] init];

    ```


    Code like this is everywhere in Objective-C.


    You declare your variable, along with its type, much as you would in C#. Where''s
    dramatically different is the code on the other side of the assignment operator
    (`=`).


    You aren''t using new to create your object. The allocation of memory and object
    creation takes place when you "send" the alloc "message" to the UIButton class.
    Somewhere up the food chain, the Objective-C runtime settles aside for your object
    and returns a pointer to that object space.


    It''s confusing for the mind to account of Objective-C''s syntax (which is addressed
    momentarily), but after you''ve created a newly pointer, you send it the init
