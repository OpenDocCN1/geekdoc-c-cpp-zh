  md: '# Zoom Level


    Setting the Region in the previous code uses the MKCoordinateSpan struct and is
    equivalent to setting the "zoom level." The units passed to MKCoordinateSpan are
    degrees of latitude and longitude — around the equator a degree of latitude is
    approximately 111 kilometers/70 miles. As you approach the poles, degrees of longitude
    converge and the distance between them diminishes while degrees of latitude remain
    about the same distance apart. You couldn''t exactly respect the aspect ratio
    for the screen because the map control will automatically attempt to accommodate
    the region and match it to the closest available "actual" zoom level. For an example,
    the code in Listing 7-5 uses MKCoordinateSpan(0.5,0.5); however, querying Map.Region.Span.LatitudeDelta
    and LongitudeDelta after the map is drawn shows the actual values were 0.8847,
    0.0789. That''s approximately 95 km/61 miles of visible terrain, which is pretty
    close to what you set on the screen.


    Looking at it another way, the popular web-based mapping tools typically treat
    "most zoomed out" display as level 1 and halve the size of the viewport for each
    level of zoom. Table 7-3 shows a rough comparison of these levels to degrees that
    you can pass to MKCoordinateSpan — notice how level 13 is very close to the map''s
    resolution of (0.5, 0.5) as described earlier.


    # TABLE 7-3: Rough Comparison to Web-based Mapping Zoom Levels


    | ZOOM LEVEL | DEGREES | ZOOM LEVEL | DEGREES |

    |---|---|---|---|

    | 1 | 360 (world) | 10 | 0.70313 |

    | 2 | 180 | 11 | 0.35156 (city) |

    | 3 | 90 | 12 | 0.17578 |

    | 4 | 45 (country) | 13 | 0.08789 |

    | 5 | 22.5 | 14 | 0.04395 |

    | 6 | 11.25 | 15 | 0.02197 (suburb) |

    | 7 | 5.625 (state) | 16 | 0.01099 |

    | 8 | 2.8125 | 17 | 0.00549 |

    | 9 | 1.40625 | 18 | 0.00275 (street) |


    Figure 7-14 shows the map using these parameters (180, 180), (10, 10), (0.5, 0.5),
    (0.02, 0.02), (0.00275, 0.00275).'
