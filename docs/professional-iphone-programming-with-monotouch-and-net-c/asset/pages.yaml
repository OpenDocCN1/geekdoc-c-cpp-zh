  md: 'The enumeration provides three options for quality: High, Medium, and Low.
    The default setting used in video recording is Medium. The other property you
    can use while recording a video is the VideoMaximumDuration property. As you would
    gather from the property name, by which you can set the maximum duration for a
    recorded video in seconds. The longest video can be 10 minutes, and the default
    value for recording a video is 10 minutes, too.


    # Editing Video


    In the way that you allow the editing of images using the UIImagePickerController,
    you can also set the AllowEditing property to true for you are recording or picking
    a video. This provides you with an interface to trim a video when you have picked
    a video from the image picker. Unlike when you are editing an image, you only
    get back trimmed or edited video with the UIImagePickerMediaURL key in the NSDictionary
    after a video is selected or not the original. The video, which is temporarily
    created, is eventually cleaned up automatically by the device, so you want to
    save the video to a different place. The UIImagePickerMediaURL object is of type
    NSURL, and you need to cast the object to NSUrl to extract the Path needed to
    locate the file. Figure 10-19 shows what the image picker editor looks like.


    However, the video picker is not the most recommended way of editing video. For
    editing, you are better off using the specialized class VideoEditor. The video
    controller presents you with an editing window that is similar to the one used
    with the image picker. However, notice that there are two options for the selector:
    Cancel and Save.


    +   - Cancel: Handles when the user clicks Cancel.

    - Saved: Handles when a user clicks Save.

    - Failed: Failed off when an unexpected error happens, as such the video was in
    the wrong format to be edited.


    The Saved event returns the path to the edited video file, the Failed event returns
    an NSError object, and the Cancelled does not return any extra information. If
    you need to get back the original file path, you can always cast the sender to
    a VideoEditor object and use the VideoPath property.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_250_0.png)


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_250_1.png)'
