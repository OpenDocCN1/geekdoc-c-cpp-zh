  md: "You may realize that when a new song starts, the UI shows the old track information\
    \ and doesn't get updated. To address this issue, you can use notifications to\
    \ provide information to you the player state changes (such as going from Play\
    \ to Pause) as well as when a new song is playing you can update the track information.\
    \ How you update the UI as it is and when it is needed. You can declare your NSObject\
    \ observers (listen for certain notifications from the music player) as class\
    \ variables that makes this easier to add and remove so you don't listen multiple\
    \ times for.\n\n# LISTING 11-13: Using notifications with the music player\n\n\
    ```\nNSObject NowPlayingItemChanged; PlaybackStateChanged;\nMusicPlayerController\
    \ MusicPlayer;\n\npublic override void viewDidLoad() {\n  base.viewDidLoad();\n\
    \n  var center = NSNotificationCenter.DefaultCenter;\n\n  var nowPlayingNotification\
    \ = \"MPMusicPlayerControllerNowPlayingItemIdChangeNotification\";n  NowPlayingItemChanged\
    \ = center.AddObserver(nowPlayingNotification, (notification) => {\n    Console.WriteLine(\"\
    Update UI with New Playing Info\");\n  });\n\n  var playbackStateNotification\
    \ = \"MPMusicPlayerControllerPlaybackDidChangeNotification\";n  PlaybackStateChanged\
    \ = center.AddObserver(playbackStateNotification, (notification) => {\n    Console.WriteLine(\"\
    Update UI with Playback State: \" + MusicPlayer.PlaybackState);\n  });\n\n  MusicPlayer\
    \ = MPMPlayerController.IPodMusicPlayer;\n  MusicPlayer.SetQueue(MPMediaPlayer.songsQuery);\n\
    \  MusicPlayer.BeginGeneratingPlaybackNotifications();\n  MusicPlayer.Play();\n\
    }\n\npublic override void viewWillDisappear(bool animated) {\n  base.viewWillDisappear(animated);\n\
    \n  NSNotificationCenter.DefaultCenter.RemoveObserver(NowPlayingItemChanged);\n\
    \  NSNotificationCenter.DefaultCenter.RemoveObserver(PlaybackStateChanged);\n\n\
    \  MusicPlayer.EndGeneratingPlaybackNotifications();\n  MusicPlayer.Dispose();\n\
    }\n```\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_279_0.png)"
