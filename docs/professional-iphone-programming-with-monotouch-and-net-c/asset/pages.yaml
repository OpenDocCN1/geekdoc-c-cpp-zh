    # Setting Up Outlets


    To enable all of the controls you have dropped onto Interface Builder view, you
    need to create an outlet for each control. In MonoTouch, outlets are instance
    variables on the class you assign a control to you define within Interface Builder.
    The instance variable gives you programmatic access to the control. To demonstrate
    this, you are going to use an iPhone Window-based project and open the MainWindow.xib
    file in Interface Builder.


    > Most of the time you will not want to use controls directly on a window, but
    rather use a view added as a sub-view to the window to book up your controls.
    This is because in a real application you will be just using the window to add
