  md: '# # Customizing the Cell Layout


    In addition to the four built-in cell layouts shown in Figure 6-4 there are many
    other examples (both built-in and third party) of tables with much more sophisticated
    cell layouts. These layouts can be designed in Interface Builder by creating a
    custom UITableViewCell and loading it dynamically in the UITableViewCell.GetCell
    method. This requires some careful of Interface Builder to ensure your XIB is
    set up correctly for access MonoTouch.


    To build a custom cell, use MonoDev to create a new iPhone-based Project Called
    Cells+04 and add a custom UITableViewCell to MainWindow.x (or look for it in the
    code download from this chapter). In MonoDev right-click on the project, choose
    Add C+ New File, choose Interface Definition, and make it MyTableView.x.


    In Interface Builder perform the following steps, partially depicted in Figure
    6-8:


    +   1. Delete the default UIView for the XIB — a more specific class is required.


    +   2. Drag a UITableViewCell from the Objects Library into MyTableView.x Open
    it and drag your UILabel from the Objects Library; position and format them as
    required.


    +   * In the Identity Inspector set the Class to MyTableViewCell (matching the
    filename).


    +   * In the Attributes Inspector set the Identifier to MyCellIdentifier. This
    is the re-use identifier that is referenced in DequeueReusableCell() calls.


    +   * In the Classes Library set MyTableViewCell and create outlets for each label
    (Number, Symbol, Name, Family).


    +   * In the Connections Inspector "wire up" out to the four labels.


    +   3. Make the following changes to File''s Owner:


    +   * In the Identity Inspector set the Class to MyViewController.


    +   * In the Library set MyViewController from the Classes list and add an outlet
    named Cell.


    +   * In the Connections Inspector "wire up" out the Cell outlet to MyTableViewCell.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_149_0.png)


    FIGURE 6-8'
