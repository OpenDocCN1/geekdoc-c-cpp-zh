  md: '# Startup Images


    Now that your application supports all available orientations, you should ensure
    your launch image similarly adapts to the screen. The image should fill the screen,
    leaving 20 pixels top for the status bar.


    Two elements are required to support this: First, use the Info.plist file to advise
    the operating system which orientations your application supports and then add
    specially named images to your project to be displayed for each orientation.


    Your Info.plist file should contain the following key and value array:


    ```

    <key>UISupportedInterfaceOrientations</key>

    <array>

    <string>UIInterfaceOrientationPortrait</string>

    <string>UIInterfaceOrientationLandscapeLeft</string>

    <string>UIInterfaceOrientationLandscapeRight</string>

    <string>UIInterfaceOrientationPortraitUpsideDown</string>

    </array>

    ```


    and your MonoDev project should include specially named images described in Table
    13-1 (with your Build Action to Content).


    # TABLE 13-1: Orientation-Specific Startup images


    | KEY | DESCRIPTION |

    | --- | --- |

    | Default.png | The filename used in the iPhone OS to identify the startup image
    prior to the release of the iPad. You should not use this image for iPad applications,
    but provide a 320x460-pixel image if you have built a Universal Application that
    runs on both types of device; this image will be used on the iPhone and iPod Touch.
    For iPad applications you should provide at least two images: Default-Portrait.png
    and Default-Landscape.png as described next.


    > Your FinishedLaunching code should not attempt to determine the device''s orientation
    before building the original layout. You should construct your user interface
    (either in code or in your MainWindow.xib file) for a single orientation — once
    the application has finished loading, the operating system will notify your app
    of the device''s current orientation and cause the layout to change appropriately
    before it is displayed for the first time.'
