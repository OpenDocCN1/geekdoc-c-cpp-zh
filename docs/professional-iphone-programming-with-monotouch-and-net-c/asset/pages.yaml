- img_proc: true
  md: 'MonoTouch to support the latest version or test for any regressions that might
    have cropped up. Each application will continue running its own version of the
    framework.


    The linker also helps to get the size of your application down, which is important,
    especially on a mobile device. If your application is under 20 megabytes, Apple
    allows you to download this over Edge/3G; if the application is over you will
    need to connect to a WiFi to download the application. Because you''re not including
    the whole base class library and core components of the Mono framework if you
    are not using it in application, you are not using space in your application with
    unused code.


    The linker is integrated into MonoTouch and MonoDevelop, so there is no extra
    work to enable it. By default MonoDevelop will use the [Debug|iPhone Simulator]
    [Debug|iPhone Simulator] to not use linker, and on devices [Debug|iPhone and Release|iPhone],
    it chooses [Link SDK assemblies] configuration. This means that linker goes through
    the SDK and code that isn''t being used, but it does not link the assembly you
    create. The other configuration is "Link all assemblies", which goes through the
    SDK and the assemblies you create. This can commonly cause problems with code
    involving things such as web services, reflection, or serialization if they are
    not statically called in your code. You will want to use the [Preserve] attribute
    on members that may be removed by the linker or [Preserve (AllMembers=true)] on
    types defining these members.


    # DEPLOYING YOUR APPLICATION


    You''ve got your Hello World application completed, and now it''s time to show
    the world how amazing your application is or just how awesome MonoTouch is deploying
    the application to your iPhone. Follow these steps to upload your application
    to a device:


    +   1. You will need to be a member of the Apple iPhone Developer Program. The
    cost of this program at writing is $99 per year. The location to sign up can be
    found in the list at the end of this section.


    +   5. Once the development project is set up, the MonoDevelop project must be
    set up to deploy the application to the iPhone when the developer selects the
    option to deploy to the device. This is accomplished by setting the project''s
    options. To see this you right-click on the iPhone project and select options.
    When the project opens up, you select iPhone Bundle Signing. By default it uses
    the first developer certificate that it finds. See Figure 2-18.'
