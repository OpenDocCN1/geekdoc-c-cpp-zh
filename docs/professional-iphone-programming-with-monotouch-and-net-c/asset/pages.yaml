  md: '# Configuring Your Info.plist File


    To enable your application to be opened by others, you need to update your Info.plist
    file. The plist file is essentially an XML file made of key-value pairs describing
    your application. This is covered in more detail in Chapter 8. MonoDev generates
    this for you when you build and run your application, or if you want to add custom
    settings to create it. To do this, right-click  New as shown in Figure 11-1.


    From here the New File template box appears. Select the iPhone Application Manifest
    template (see Figure 11-2). You''ll notice that it is already named Info.plist.


    Double-clicking the Info.plist file causes Apple''s List Editor to pop up. This
    program helps in adding parent and child XML nodes to the plist. To make sure
    your app responds correctly to incoming calls from other applications, you need
    to add a parent node of URL types to the plist file. You also need to add a URL
    identifier. This value is sent to application when you call its open URL schema
    — this will become clearer further in the chapter. Normally you would use a reverse
    domain to keep the URL identifier unique (for example, com.chr.myapp). In addition
    to adding a URL identifier, you need to add a node in URL Schemes. The schemes
    are the protocol that another app calls when addressing your app, such as skype
    or comgoogleeartharth. For this example, it''s a good idea to use your URL identifier
    as an additional scheme to use in case of a conflict. Figure 11-3 shows how your
    plist file should look.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_267_0.png)


    FIGURE 11-1


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_267_1.png)


    FIGURE 11-2'
