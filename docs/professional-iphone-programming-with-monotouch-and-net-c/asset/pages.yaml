- img_proc: true
  md: '# CHAPTER 1 INTRODUCTION TO IPHONE DEVELOPMENT WITH MONOTOUCH FOR C# DEVELOPERS


    +   - .NET, executables are fairly small. Every application shares the .NET Framework,
    the applications don''t have their own copy of the framework. MonoTouch is not
    built into the iPhone and its applications have their own copy of the framework;
    MonoTouch is compiled into your application. The result is that MonoTouch applications
    are larger on disk than a comparable Objective-C application.


    Although MonoTouch is a commercially licensed product, it is still a product that
    is under continuous development, and MonoTouch may not support a specific namespace
    or assembly. You have two options for this situation:


    +   - Wait on the implementation of assembly as the MonoTouch product.

    - Pull the necessary code or assembly into your project. This is fairly common
    if the application needs to use code within the System.web. namespaces.


    In addition to the technical issues of building an application for the iPhone,
    some design issues that developers should be aware of:


    +   - Don''t design an application for a desktop environment and think that it
    can be scaled down to an iPhone, or any mobile device. An iPhone does not have
    the display, hardware, or storage of a desktop computer. iPhone and mobile device
    applications are really good for simple, limited-purpose functions, but they should
    not do everything a desktop application does.

    - The iPhone simulator is a fine tool, but not limiting test to the iPhone simulator.
    A simulator is just a simulator. A keyboard and a mouse associated with the iPhone
    simulator. To really test a complicated design, the application must be tested
    from a physical iPhone.


    # APPLE SDK TOOLS


    When the iPhone originally shipped, you could not run third-party native applications
    directly on the device — March 6, 2008, when Apple released the first beta of
    the SDK. The iPhone SDK allows third parties to write applications and run them
    natively on the device. Since then, have been a steady stream of updated beta
    and released versions of the iPhone SDK. Originally, the iPhone SDK supported
    both the iPhone and the iPod Touch. With the release of the iPhone SDK Version
    3.2, Apple added support for the iPad tablet device.


    # Tools


    The Apple SDK contains a number of tools that are important to the MonoTouch developer.
    These tools are:


    +   - Xcode: A suite of tools for development in an Apple environment, the main
    tool being the IDE. Although MonoTouch does not directly use the Xcode IDE, it
    can help you create a simple app to deploy to a device. You can also use it to
    verify that the certificates and provisioning information on associated devices
    are working properly.


    +   - Interface Builder: Interface Builder (IB) allows for the graphical creation
    of a user interface. The MonoDev IDE integrates with IB and converts the interface
    created within IB into a user interface callable by MonoTouch.'
