  md: '# LISTING 10-9: Playing a video from a file


    ```

    var player = new MPMPlayerController(NSUrlFromFilename("video.mp4"));

    player.Play();

    ```


    If you would rather to stream video and progressively download the video than
    play one directly from the device, use the NSUrl method FromString fromFilename
    and pass the URL location of the video. For example, you need to replace the URL
    string with your own external video.


    ```

    var videoUrl = NSUrl.FromString("http://example.com/video.mp4")

    var player = new MPMPlayerController(videoUrl);

    player.Play();

    ```


    You might have noticed that there is a short buffering before the video starts
    to play. This is known as the preload. You can use notifications on the video
    player, which fires off a message when the video has been preloaded so you can
    show a loading screen and then show the video when the video finishes the preloads.
    You can also use notifications to get messages fired off when the video finishes
    playing and when the user has changed the scaling of the video.


    You use the DefaultCenter property from the NSNotificationCenter class to observe
    that your messages fire off when a notification happens. You can think of an observer
    as a way of adding events on certain actions using strings as a way of creating
    these events instead of using strictly typed events. For this example, you use
    the notifications MPMPlayerContentDidFinishNotification and MPMPlayerPlaybackDidFinishNotification
    MPMPlayerScalingDidChangeNotification. You can add two class variables of type
    NSObject, which you can preload and playback finished observers. Using the AddObserver
    method, you pass in an action method for each observer, which runs when the notifications
    are called. You can use a lambda expression to place this code inline. When the
    preload notification is finished, you just want to start playing the video so
    you call Play on your MPMPlayerController, and when the playback notification
    is finished, you want to remove the observers and clean up instance. You can use
    an activity indicator to make sure the user is aware that you are preloading the
    video when the application starts. Listing 10-10 shows the example code to make
    sure that you change the URL on the eighth line to an external video of your choice.


