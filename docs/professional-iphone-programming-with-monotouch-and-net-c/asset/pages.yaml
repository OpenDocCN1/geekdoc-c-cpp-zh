  md: "# CHAPTER 6 DISPLAYING DATA TABLES\n\nThere is another type of \"row selection\"\
    \ provided by the UITableView — the DisclosureButton — most commonly seen in the\
    \ Phone application. This user interface has a special element: It indicates that\
    \ touching the main part of the cell can perform an action (for example, initiating\
    \ a phone call) while touching the blue-circle-arrow performs a different action\
    \ (such as opening the contact details). To use this feature, set the Accessory\
    \ property of the cell in the GetCell method.\n\n```\ncell.Accessory = UITableViewCellAccessory.DetailDisclosureButton;\n\
    ```\n\nand implement this in the UITableViewSource subclass:\n\n```\npublic override\
    \ void AccessoryButtonTapped\\n    (UITableView tableView, NSIndexPath indexPath)\n\
    {\n    app.ShowAlert(\"AccessoryButton\", \"You tapped +text[indexPath.row]\"\
    );\n}\n```\n\nFigure 6-3 shows the RowSelected and AccessoryButtonTapped methods\
    \ in action — touching the row calls RowSelected and touching the DisclosureButton\
    \ calls AccessoryButtonTapped so you can perform two different actions from the\
    \ row.\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_141_0.png)\n\nFIGURE 6-3\n\n\
    In addition to the special DetailDisclosureButton, as you can see in Table 6-1,\
    \ there are two other possible values for cell.Accessory, each with a specific\
    \ purpose in the iPhone Human Interface Guidelines.\n\n# TABLE 6-1: UITableViewCellAccessory\
    \ Options\n\n| TYPE | DESCRIPTION |\n| --- | --- |\n| None | The default value\
    \ — no accessory is displayed. Either this cell is a read-only piece of data or\
    \ it responds to a touch. |\n| Checkmark | Use this to indicate single- or multi-selection\
    \ in a table. Do not use the blue selection state — that is only intended as a\
    \ visual indicator that the cell has been touched. |"
