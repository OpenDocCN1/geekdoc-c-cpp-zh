  md: '# UIView


    Although not an exact parallel, the UIView class has similar characteristics to
    the User Control concept in ASP.NET, WinForms, and WPF.


    UIView is the base class of every control in the UIKit framework — it is responsible
    for both rendering content to the screen and responding to touch events within
    its bounds. A UIView can contain other UIView instances — which are referred to
    as subviews — in a deep hierarchy as required. The parent (or superview) manages
    its subviews'' sizes and positions and may respond to events that are not handled
    by a sub-view.


    In simple applications (such as the control-specific examples in this book) a
    UIView (or subclass) may be added directly to the window for user and interaction.
    Applications require more complex view handling, which is done by UIViewControllers
    such as the UINavigationController covered in this chapter and the UITViewController
    covered in Chapter 6. UIViewController orchestrate all the different views in
    your application: showing and hiding them as appropriate when the device''s orientation
    changes.


    As mentioned previously, any application should only have one Window; the remainder
    of the views you add to your project will be a UIView, a UIViewController, or
    one of its subclasses. The key members to know on UIView:


    +   Bounds: Location and size of the view''s coordinate system within its frame
    rectangle; that the default origin is (0, 0) at the top left of the screen.


    +   Frame: Position and size of the view in the coordinate system of its containing
    superview.


    +   UIView(frame): Constructor for UIView that requires a RectangleF to set its
    size.


    +   AddSubview: Adds the supplied UIView instance as a sub-view to the current
    view. The new view is displayed on top of any existing sub-views and is positioned
    according to its Frame or Bounds property.


    > The Bounds and Frame properties are of type System.Drawing.RectangleF in MonoTouch,
    not CGRect from the CoreGraphics framework (which is what the underlying Objective-C
    methods accept). This is one of many examples where MonoTouch makes development
    more familiar to .NET developers by using classes wherever possible.


    # DATA VIEW CONTROLS


    The Interface Builder Views library category contains a number of different types
    of views, including some important classes that deserve their own chapters: UITableView
    (Chapter 6), UIMapView (Chapter 8), and UIImageView, which is covered in Chapter
    10. The rest are discussed in this section.


    # UIWebView


    The WebView allows you to embed web content in your application: Internet-based
    sites, HTML files distributed in your application, or dynamically generated HTML
    strings. It is'
