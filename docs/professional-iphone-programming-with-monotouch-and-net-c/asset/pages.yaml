  md: '# DETERMINING DEVICE ORIENTATION


    When programming with a desktop application, a few situations exist where the
    screen rotates or moves in any perceptible way. This is not true with a mobile
    device, which has a number of orientations. The seven orientations (plus Unknown)
    for an iPhone are:


    +   - Unknown: The device''s orientation is unknown.

    - Portrait: The device''s orientation is in portrait mode. The device is held
    upright and the home button is at the bottom.

    - PortraitUpsideDown: The device''s orientation is in portrait mode. The device
    is held upside down and the home button is at the top of the device.

    - LandscapeLeft: The device''s orientation is in landscape mode. The device is
    held upright and the home button is on the right-hand side of the device.

    - LandscapeRight: The device''s is in landscape mode. The device is held upright
    and the home button is on the left-hand side of the device.

    - FaceUp: The device has the screen facing up and is parallel to the ground.

    - FaceDown: The device has the screen facing down and is parallel to the ground.


    # Beginning Notification


    The first step to obtaining information regarding device orientation is to turn
    on the device notifications. You do this through a call to


    ```

    UIDevice.CurrentDevice.BeginGeneratingDeviceOrientationNotifications();

    ```


    Once this is made, orientation information will be available to a calling app.
    Along with turning this information on, it is important to turn the notifications
    off when they are not necessary. You can accomplish this by a call to


    ```

    UIDevice.CurrentDevice.EndGeneratingDeviceOrientationNotifications();

    ```


    > Device orientation notifications are not immediately available after notification
    starts, but are available after a very short delay. BeginGeneratingDeviceOrientationNotifications()
    is not synchronous with respect to starting the notifications.


    # Determining Static Device Orientation


    Though not the most common scenario, there may be times when a developer needs
    to obtain the device orientation. It is simpler to learn the static case and to
    learn the dynamic case. There are two steps in getting the device orientation.
    The first is to determine if the orientation notifications are on. If the orientations
    are not on, the value of Unknown is returned. See Listing 9-3.'
  merge: -1
