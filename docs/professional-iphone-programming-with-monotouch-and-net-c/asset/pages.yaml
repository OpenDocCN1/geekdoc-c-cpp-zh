    \ to multitask third-party applications, it is possible to make asynchronous calls\
    \ through MonoTouch. Calling REST-based web service asynchronously is an easy\
    \ way to get around the iPhone's 20-second time limit in an application executing\
    \ code. Another positive is that this is done through the same API as .NET. Chances\
    \ are that a developer is familiar with the .NET asynchronous programming methodologies\
    \ of calling BeginXXX/EndXXX.\n\nIn Listing 5-8, the code makes asynchronous requests\
    \ against a set of third-party web services hosted on the twmtstr.com domain.\
    \ TwmTster is an application that interfaces to Twitter and allows for the scheduling\
    \ of Twitter entries.\n\n+   LISTING 5-8: Calling a REST web service asynchronously\n\
