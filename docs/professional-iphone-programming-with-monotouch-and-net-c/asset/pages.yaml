  md: '# Using Web Services Responsibly


    Now that you have learned how to use web services in various forms in MonoTouch,
    let''s look at some issues. Web services are great tools for:


    +   - Building apps that run over the Internet. Because they run over port 80,
    there is a very small chance that the communication will be blocked.


    +   - Keeping information centralized.


    +   - Easily allowing for disparate systems to communicate.


    At the same time, web services have their drawbacks. Some of the cons of web services
    over wire-less:


    +   - Web services tend to be slow. Sending information over a textual format,
    such as JSON or XML, can be slower than sending the information over a binary/compressed
    protocol.


    +   - Wireless communications tend to be unreliable.


    +   - Sending data over numerous networks, where the Internet, tends to be unreliable.


    As a result, it is important to remember to use web services in a responsible
    manner:


    +   - Efficient in the amount of data that is sent to the web service and sent
    back to the iPhone. There is no reason to overburden the iPhone or the connection
    to the web service.


    +   - The iPhone has a limit of 20 seconds to wait on user code to finishing execution.
    After 20 seconds, the code that is being executed will terminate. As a result,
    for calling web services, it makes sense to call web services asynchronously or
    in another thread.


    # SUMMARY


    This chapter looked at data strategies on the iPhone. By using these technologies,
    developers can build native applications that run when a network connection is
    not available. You''ve learned how to:


    +   - Set up a local database in SQLite on the iPhone


    +   - Run commands against the SQLite database on the iPhone


    +   - Work with SOAP-based web services on the iPhone


    +   - Work with REST-based web services on the iPhone


    When they add in the ability to call web services, iPhone developers and their
    applications can integrate with granular datas. This allows an application of
    users to interact with other users. For example, Twitter users on their iPhone
    can interact with other Twitter users without ever having to go to the Twitter.com
    web site. By taking advantage of the features in the iPhone, developers can create
    applications that provide more features for users and are more resistant to problems
    connecting to the Internet and its datasources.'
