    \ JavaScript Object Notation (JSON)\n\nMost developers are familiar with the Extensible\
    \ Markup Language (XML), which is used for data interchange. JSON is a similar\
    \ technology; it is a data-interchange format based on the JavaScript scripting\
    \ language. The JSON format uses a series of conventions that are familiar to\
    \ more programmers that use the C-family of languages. JSON is built on two concepts:\n\
    \n+   Data is transmitted as a series of name-value pairs. The values may be a\
    \ single value or a series of values, such as an array.\n\n+   Data is stored\
    \ in a structure that can be thought of as a sequence.\n\nBecause these concepts\
    \ are commonly accepted, the concepts are available across nearly all programming\
    \ languages. As a result, nearly all programming languages have some support for\
    \ JSON. In .NET, Microsoft introduced support for JSON with the ASP.NET2 AJAX\
    \ library that shipped in 2007. Now programmers have various options for JSON\
    \ in .NET thanks to WCF, the popular .NET library, and various other libraries.\n\
