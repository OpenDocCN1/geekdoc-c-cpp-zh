    # # UITabController


    The most obvious example of the tab is the iPod application (shown in Figure 4-17)
    for Artists, Albums, Videos, and more.


    Recall the mention of the ViewController''s ViewWillAppear and ViewWillDisappear
    methods—each time the user touches a tab, the current tab''s ViewWillDisappear
    method is called, and the chosen tab''s ViewWillAppear method is called. As the
    user navigates around, these two methods are called so that your views can respond
    to being hidden and shown.


