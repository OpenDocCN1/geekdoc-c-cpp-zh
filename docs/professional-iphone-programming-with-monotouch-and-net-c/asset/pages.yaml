  md: "# EDITING TABLE ROWS\n\nAnother of the UITableView's features is the built-in\
    \ editing: deleting cells, re-ordering cells, and providing a consistent user\
    \ interface to add new rows. Each of these elements can be individually enabled\
    \ with the implementation of methods on the UITableViewSource delegate class.\n\
    \nOnce again you will start with the Colors list for this example. For example\
    \ Tables06 is in this chapter.\n\n# Adding Swipe to Delete\n\nThe simplest editing\
    \ function to implement is swipe and delete. There is no visual indicator on the\
    \ table that any editing swipes across a row a Delete button. Touching the button\
    \ immediately deletes the row. The three methods used by the UITableViewSource\
    \ subclass to enable this functionality:\n\n+   - CanEditRow: This method is called\
    \ when the table is being rendered so that it can respond to \"editing input\"\
    \ (such as a swipe). The response can be changed for each row. However, for this\
    \ example it is hardcoded true. Every row in the table will respond to the swipe\
    \ gesture and display a Delete button.\n- CommitEditingStyle: called when \"editing\"\
    \ takes place. Because only Delete is functional in this simple example, the code\
    \ shows only how Delete works. First delete the data from the underlying structure\
    \ (rows.Removeat is called in this case) and then call DeleteRows on the table\
    \ to remove the corresponding cell from the table.\n- TitleForDeleteConfirmation:\
    \ Optional customization of the text in the button.\n\n```\npublic override int\
    \ rowsInSection(UITableView tableView, int section)\n{\n    return rows.Count;\n\
    }\npublic override bool CanEditRow(UITableView tableView, NUITouch.Foundation.NSIndexPath\
    \ indexPath)\n{\n    return true;\n}\n// To support editing the table view.\n\
    public override void CommitEditingStyle(UITableView tableView, UITableViewCellCellEditingStyle\
    \ editingStyle, NSIndexPath indexPath)\n{\n    rows.Removeat(indexPath.Row);\n\
    \    tableView.DeleteRows(new NSIndexPath[] { indexPath }, UITableView.RowAnimation.Fade);\n\
    }\npublic override string TitleForDeleteConfirmation(UITableView tableView, NSIndexPath\
    \ indexPath)\n{\n    // OPTIONAL: Default to Delete\n    return \"Trash\";\n}\n\
    ```\n\nDeleteRows takes an array of IndexPaths so it knows visual representations\
    \ (cells) to animate out of the table; it also accepts a parameter to choose how\
    \ to animate the deletion. The animation options are listed in Table 6-3 and apply\
    \ to row insertion, which is covered later in the chapter."
