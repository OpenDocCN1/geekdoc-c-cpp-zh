    \nData View Controls | 57\n\nWebView04\\Main.cs\n\n# Figure 4-5 shows how to use\
    \ this\n\nThere is one more useful feature of the WebView control to learn about:\
    \ intercept \"navigation events\" and perform some other behavior before or instead\
    \ of opening the link in the browser. ShouldStartLoad requires a delegate with\
    \ three methods:\n\n+   - WebView: The control that has triggered the navigation\
    \ event.\n\n+   - NSURLRequest: The URL requested by the user.\n\n+   - UIINavigationType:\
    \ The type of navigation triggered by the user, used in Table 4-1.\n\nIf ShouldStartLoad\
    \ returns false, the requested navigation is allowed; the navigation is cancelled.\
    \ Your code could perform some alternate action as showing another view or displaying\
    \ an alert to the user.\n\n> Dear Reader,\nStyled text - not possible with TextView\
    \ - is simple to using WebView (read-only, of).\n\n> You can reference local files\
    \ to your app bundle including stylesheets and images.\n\n> Of course you can\
    \ also allow remote content\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_86_1.png)\n\
    \nFinally, you can trap local links with an event handler.\n\nFIGURE 4-5\n\n```\n\
    WebView.ShouldStartLoad = delegate (WebView, NSURLRequest request, UINavigationType\
