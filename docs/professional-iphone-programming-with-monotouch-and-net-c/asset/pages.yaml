  md: '# # 15

    The App Store: Submitting and Marketing Your App


    # WHAT''S IN THIS CHAPTER?


    +   - Getting your app ready to submit

    - Submitting your app

    - Promoting and profiting from your app


    After hours of wire framing, designing, developing, and testing, you are finally
    ready to share your app with the world. This chapter discusses all things App
    Store. First, it talks about the process that you need to go through before you
    are ready to submit — this includes final testing with Ad-Hoc builds and a presubmission
    checklist. Next it actually submitting to the App Store, and then finally what
    to do with your app after it''s in the App Store. This chapter also touches on
    alternative monetization strategies such as ads or in app purchases.


    # USING AN AD-HOC BUILD FOR PRESUBMISSION TESTING


    Before you jump right into submitting and marketing in the App Store, you need
    to make sure a few items are covered. Apple has a notoriously stringent review
    process where it tests your app on a variety of hardware in a variety of conditions.
    So before I submit my apps, I like to run them through a similar process.


    Now, most people don''t have the whole family of iDevices laying around. This
    is where the Ad-Hoc build comes in. Doing an Ad-Hoc build allows you to send your
    app up to 100 people and have them install it on their device. If you can, try
    to find a variety of devices to'
