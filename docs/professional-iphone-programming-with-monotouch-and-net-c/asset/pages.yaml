    +   Page Control (UIPageControl): The Page Control provides the user with information
    that there are additional pages in the application.


    # Windows, Views, & Bars: These are the windows, views, and bars available in
    Interface Builder and code.


    +   Window (UI): A window contains multiple views and is the first to be displayed
    on screen. Since all views will be in a window, you can only have one instance
