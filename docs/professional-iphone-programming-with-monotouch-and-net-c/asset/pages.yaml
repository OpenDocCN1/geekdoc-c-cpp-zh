  md: 'convention, one implements functionality in initializers. Rather than creating
    an object by invoking the process through a constructor, Objective-C object, with
    a little help from the developer (memory-management is simple in Objective-C,
    but not automatic), is created, and then the developer explicitly calls a method
    on the newly created object — one of its initializers — carries out the work a
    C# developer would usually place in a proper constructor.


    The fact that so much is done by convention is one of the kicker of Objective-C
    if you''re used to a world that runs according to rules. That kind of flexibility
    gives you more power over your code, which comes with a lot of responsibility.
    It puts developers in charge of things that, in more formal environments, are
    governed by syntax and remains.


    As for Cocoa, it''s not clear from its what it is. You might think one might agree
    that whatever go into the world of Objective-C, you''re all certain to encounter
    Cocoa as well. The two are linked in a way that could easily confuse you with
    the other.


    Why is this? If Objective-C is the language, what Cocoa?


    Fortunately, having already learned C# (or a similar language like Java), you''re
    familiar with the separation of a language (C#) from its framework (.NET). Outsiders
    to C# tend to assume that C# and the .NET Framework are the same thing. Of course,
    the .NET Framework is the set of libraries that does the heavy lifting for your
    applications, and C# is one of the languages you can use to code against that
    framework.


    Objective-C and Cocoa have a similar relationship. Objective-C is the language,
    and Cocoa is basically the framework against which Objective-C developers write
    their applications.


    Cocoa is to Objective-C what the .NET Framework is to C#.


    In Objective-C terms, frameworks are called *kits*. As you explore the various
    iPhone frameworks (UIKit, Game Kit, Map Kit), you''ll quickly learn and remember
    this.


    The name Cocoa is also used as an umbrella term to refer to the core frameworks
    as well as frameworks that provide additional functionality. As a C# developer
    might refer to an ASP.NET project, an Objective-C developer might refer to Cocoa
    rather than the specific kit he or she is using.


    To make matters a little confusing, Cocoa for the iPhone is actually called *Cocoa
    Touch*. Cocoa Touch is a version of Cocoa that has been designed specifically
    for the form-factor and capabilities of the iPhone, iPod, and iPad. But there
    are differences in design that shift dependencies around, and the desktop versions
    of Cocoa''s various kits have iPhone equivalents that have very different names
    (AppKit, which provides much of the core support for application development on
    the desktop, has an equivalent on the iPhone called UIKit).


    Differences arise, it''s perfectly acceptable to refer to Cocoa simply as Cocoa.
    The context of the conversation makes it clear that it isn''t the desktop version
    of Cocoa being discussed.


    Purists might not care for using certain terms that are technically incorrect,
    and that brings us to the next section of this chapter.'
