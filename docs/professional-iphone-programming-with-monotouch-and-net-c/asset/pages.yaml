    # Showing Translated Text


    The first example in the character download — Localization01 — displays some simple
    strings in a different language depending on the user settings.


    Add two lines to a new iPhone MonoTouch MainWindow and add the two lines to set
    their Text Property:


    ```

    LocalLabel.Text = NSLocale.CurrentLocale.LocaleIdentifier;

    LanguageLabel.Text = NSLocale.PreferredLanguages[0];

    ```


    These methods allow your code to retrieve the user''s settings:


    +   * NSLocale: Class that provides information about the current language and
    locale settings on the device.

    * CurrentLocale: Provides information about the region that the user has selected.
    LocaleIdentifier returns the code in format discussed previously, such as en_US.

    * PreferredLanguages: Provides a list of language codes in the order in which
    they will be searched. It is an array of two-letter language codes, with the first
    element reflecting the user''s language choice.'
