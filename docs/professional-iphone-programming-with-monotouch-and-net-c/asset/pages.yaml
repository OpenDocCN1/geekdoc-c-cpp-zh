  md: '# MANAGING LOCALIZABLE.STRINGS IN REAL-WORLD APPLICATIONS


    In a sample application like the chapter download, you find only a handful of
    calls to LocalizedString, making it relatively easy to keep the Localizable.strings
    files up-to-date with all the keys you have used.


    In a large application keeping track of all the strings you translated will be
    more difficult as the calls to LocalizedString will be spread across your entire
    codebase. Every time you add, delete, or refactor a localizable string, you need
    to remember to update the .strings files to reflect the changes in your code.
    It could become a time-consuming manual task to extract all the keys and comments
    to create the base .strings files to send off for translation.


    # gensstrings


    To help Objective-C programmers extract all the localizable strings from their
    code Apple provides a tool called genstrings Developers use genstrings to parse
    their source code to find calls to LocalizedString methods, extract the parameters
    and create a Localizable.strings file (or files) to be translated.


    Unfortunately the genstrings tool can only parse C, Objective-C, and Java code
    so it cannot be used with MonoTouch.


    # ngstrings


    The download for this chapter contains a project ngstrings that performs the same
    function as Apple''s tool but for MonoTouch projects. It works differently — instead
    of parsing the source code, it parses the .NET assembly by MonoDevelop — but the
    output is the: .strings files that you can translate and include in your application.


    ngstrings not extracts the keys and default values from your code, but also any
    comments you''ve included in certain LocalizedString() method overloads This helps
    translators to understand the context of each piece of text (assuming your comments
    are good) and ultimately improves the quality of your translation and your localized
    application.


    # Using ngstrings


    Find ngstrings.exe and lib.dll in the chapter download and save to the Applications
    folder on your Mac. You can automatically generate _strings files from your international
    application with the following steps:


    +   1. Compile your application for the iPhone simulator in Debug mode. (Release
    will also work but the folder specified in step 3 will be different.)


    +   2. Use the MonoDevelop context menu to find your application files as shown
    in Figure 12-11. This directory will contain a /bin/ folder; the .NET assembly
    is located in /bin/iPhoneSimulator/Debug/


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_303_0.png)


    FIGURE 12-11'
  merge: -1
  pgno: 303
