    # Using REST-Based Web Services


    REST stands for Representational State Transfer, and it is a general architecture
    for distributed systems, as the World Wide Web. REST architectures are made of
    clients and servers. Servers process requests that come from clients.


    REST-based web services are web services that run over HTTP and implement a more
    readable (and simpler) interface than SOAP. With REST, there is no need for proxies
    or some of the other things that make SOAP somewhat complicated.


    REST-based web services typically have these three features:


    +   1. Addressability of the resources. Some portion of the data is available
    over a URL.


    +   2. Data is sent over various HTTP verbs, as POST, GET, PUT, and DELETE. The
    verbs are typically used as:


    +   GET: A GET operation will have input data sent over the URL. This is thought
    of as a request for data.


    +   POST: A POST operation will have input data sent in the body of the request.
    A POST is used to insert/data.


    +   PUT: A PUT operation will have input data sent in the body of the request.
    A PUT is used to update data.


    +   DELETE: A DELETE operation will have all data sent in the body of the request.
    A DELETE is used to delete data.


    FIGURE 5-5


    > While some purists will argue the point, there may be valid reasons to perform
    REST-style operations by using different HTTP verbs. In addition, some operating
    systems and devices do not support all of the HTTP verbs. The examples here use
    the GET and POST verbs for operations.'
