    # Starting a PR Campaign


    Something many developers overlook a good PR campaign around their app. There
    are several PR sites where you can write a press release and push it to hundreds
    or thousands of sites in one click. Blogs, magazines, papers — they all need content
    to write about and entice readers to visit their site, so make it easy for them
    to feature a piece about your app. In your PR includes links to your web site
    and also a direct link to a media kit, where you can have and print ready art
    of your app''s logo and screenshots. Don''t overlook your local media outlets.
    Local news organizations might cover your story; it not drive lots of downloads,
    but could increase exposure and also give you something to quote on your web site.


    # Using In App Ads


    In App ads can be a great way to promote your app. Lots of the ad networks provide
    pinpoint audience targeting that includes age, gender, geography, category, device,
    and handset. Pricing models include both per-click and per-engagement. Conversion
    tracking and reporting are standard offerings. By using the audience targeting
    you can be sure that reaching someone is more likely to take a look at your app.
    You can choose a cost per click or cost per engagement with most providers as
    well. Do some research and find the network that will reach your demographic and
    fit your budget.


    # Marketing through the Social Media Sites


    Not only can you use social media to promote your app, but you can also use it
    to crowd source marketing and promotion of your app. A Tell-A-Friend feature on
    your app or settings view can be the best selling tool there is. When someone
    recommends a product to a friend or family'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'member they are more likely to purchase that item than if they saw a commercial
    or for it. I like to provide several ways for users to share this information.
    First, I implement an E-mail and SMS share with friends; this allows me to leverage
    their contacts to instantly share their new favorite app. The easier you make
    it for them, the more likely they are to use it. Next up: the social media big
    dogs — yup, you guessed it — Facebook and Twitter. Include a few prewritten blurbs
    and a short-linked to your app in the App Store, or have a space for them to write
    their own.


    # SUMMARY


    This chapter explored the final process to get your app running on end-users’
    phones. Remember the importance of testing on a variety of real devices; this
    will help you avoid any technical rejections. Apple will be quick to reject your
    app if it doesn''t behave properly on a real device.


    Promotion is key with your app, make sure you use social media and review sites
    to maximize your exposure. Include ways for users to reach out from inside your
    app; the easier it is for them to tell their friends, the more likely they are
    to do it. Free apps can be monetized too; ads or even sponsorships are a great
    way to monetize free apps.'
