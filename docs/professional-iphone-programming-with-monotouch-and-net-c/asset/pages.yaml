    Person[] allPeople = adBook.GetPeople();\nConsole.Write(\"Person Count: \" + allPeople.Count());\n\
    \n// Gets people with First or Last Name \"Fred\"\nPerson[] allFeds = adBook.GetPeopleWithName(\"\
    Fred\");\nConsole.Write(\"Fred Count: \" + allFeds.Count());\n\n// If you already\
    \ know the Id, you can get an individual person\nint personRecordId = 57;\nPerson\
