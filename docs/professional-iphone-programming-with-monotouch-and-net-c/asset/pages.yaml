    The key members that you will use on the UIDatePicker control:


    +   - Date: Property defaults to the current date/time.

    - SetDate(): Method to set the date/time for the control, optionally specifying
    the transition should be animated (that is, the wheels “spin” to the new value)
    or the wheels are simply set to the new value).

    - MinuteInterval: The minimum value is 1, the maximum is 30, and the default is
    5.

    - MinimumDate: The earliest selectable date. If today''s date is prior to this,
    the control defaults to “today” and all values prior to this date are greyed-out.
    Attempting to select a date prior to the minimum automatically selects the minimum.

    - MaximumDate: The latest selectable date. Any scrolling past this date resets
    the selection to this date and all values past this date are rendered in grey.

    - Mode: One of the UIDatePickerMode values shown in Table 4-2.


    TABLE 4-2: UIDatePickerMode Values


    | ENUM | DESCRIPTION |

    |---|---|

    | CountDown | Select hours and minutes. Useful for a TimeSpan that isn''t directly
    related to the time of day |

    | Date | Shows month, date, and year (but not day of week). Useful for selecting
    birthdays, holidays, or other dates where the year is significant.

    | DateAndTime | (default) Days with the month and date, hour, minute, and am/pm
    selection. Does not show the year. Useful for selecting appointments and reminders.

    | Time | Select hour, minute, and am/pm. Useful for setting alarms or the time.


