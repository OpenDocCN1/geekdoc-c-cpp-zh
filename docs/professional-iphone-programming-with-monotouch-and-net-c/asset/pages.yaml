  md: '# 8

    Application Settings


    WHAT''S IN THIS CHAPTER?


    +   - Exploring the Info.plist

    - Peeking in the settings bundle

    - Reading and updating your settings


    This chapter focuses on application settings, and looks at two aspects of settings
    for your MonoTouch app: the Info.plist and your settings bundle.


    +   - The Info.plist contains some basic information about your app and how it
    should look and behave.


    +   - Your settings bundle is where you would keep data that you need to persist
    from session to session.


    This chapter looks at what you might want to set in your Info.plist and why, and
    then looks at what code it takes to read and use the settings that you save in
    the settings bundle.


    This chapter also takes you through the building of the settings that you might
    have in a social media-type application. Going through each step, you will examine
    the Root.plist inside the Property List Editor and see the settings that will
    result from it.


    # EXPLORING THE INFO.PLIST


    Info.plist is short for information property list, and it is a structured text
    file that contains essential configuration information for your app. The file
    itself is encoded using the Unicode UTF-8 encoding and the contents are structured
    using XML. The root node is called «plist» and inside that you have the dictionary
    <dict>, whose contents are a set of keys and values describing different aspects
    of your app bundle. The iPhone OS uses these keys and values to obtain information
    about your application and how it is configured and how it will initially display
    your user interface by determining what XIB is loaded. The Info.plist'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# 174 | CHAPTER 8 APPLICATION SETTINGS


    name is case sensitive and must have an initial capital letter I. In iPhone applications,
    this file resides in the top level of the bundle directory.


    The contents of a typical Info.plist file convey the following information to
    the system:


    +   - The user-visible name to display for the app

    - A unique identifier string (typically in the form com.yourcompany.classname)
    that can be used to locate the bundle at runtime

    - Version information

    - Information about how the application presents content initially


    In most cases you won''t really need to edit this file or manipulate the values.
    MonoDevelop handles these tasks in the iPhone Application Settings dialog, showing
    in Figure 8-1, which can be found by right-clicking on your iPhone project and
    selecting Options and then iPhone Application Settings.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_203_0.png)


    FIGURE 8-1


    The following sections look at all of the values that you might need to edit and
    what they do.


    # UIStatusBarHidden


    This is a Boolean value that, when set to true, launches the application with
    the status bar hidden. Another way to do this is using the FinishedLaunching event
    in the application delegate. In this method, you can add the line:


    ```

    // Hide the StatusBar

    UIApplication.SharedApplication.StatusBarHidden = true;

    ```'
  merge: -1
