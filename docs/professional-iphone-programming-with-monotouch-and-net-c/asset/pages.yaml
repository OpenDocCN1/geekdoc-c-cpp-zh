    the operating system searches in Search instead of Localizable for translation
    of "Hello", and if nothing is found, "Hi there" will be displayed by HelloLabel.
    This enables you to create multiple smaller files to help manage your translations.


    When four parameters are passed, they are:


    +   > key: The string used to look up a translation in the default .strings file.

    > value: The fallback value to use if no translation is found in any .strings
    file. When this is overloaded, the key is never displayed to the user. Extended
    ASCII (including accented characters like é) are allowed in this parameter.

    > table: Allows you to specify a different .strings file. You should specify the
