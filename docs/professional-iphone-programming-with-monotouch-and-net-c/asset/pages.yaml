  md: '# 304 | CHAPTER 14 JUST ENOUGH OBJECTIVE-C


    you''re going to find yourself digging through Apple''s documentation rather than
    Novell''s. Obviously, documentation isn''t going to be presented in terms of MonoTouch
    and C#. At that point, everything will be in Objective-C.


    MonoTouch is growing in popularity, Apple''s dev tools are, and remain, the standard
    for iPhone app development. As such, if you want to take advantage of the majority
    of iPhone app example code, whether to learn from it or incorporate it into your
    own work, an ability to parse Objective-C and translate it into C# is a useful
    skill to have if you never intend to write a line of Objective-C yourself.


    Many third-party iOS libraries will be provided exclusively in MonoTouch for the
    most of these libraries, but it''s inevitable that, if you end up needing to use
    a third-party library, you will eventually find at least one for which Objective-C
    will be the exclusive language in the documentation and sample code.


    An ability to comprehend Objective-C is something that will come in very handy.
    The goal of this chapter is to provide you with a reference and introduction to
    Objective-C that will help you acquire comprehension.


    # HOW TO USE THIS CHAPTER


    You don''t need to learn Objective-C inside-out to be able to read and make sense
    of it. If you''re comfortable with OOP concepts and C-style languages, which you
    likely are if using MonoTouch, the amount of time you need to invest is surprisingly
    small. That said, it''s also important to be realistic when learning new things.
    Setting expectations accordingly helps not to become discouraged.


    Being realistic, there are a few things to keep in mind as well as directions
    on how you might best make use of the information here.


    Many Objective-C tutorials and books go on and about how simple Objective-C is.
    There''s some truth to this:


    +   1. You already know C. Not just a C-like language, but C itself.


    +   2. You''re familiar with Smalltalk (Objective-C was influenced by Smalltalk
    and has Smalltalk-style messaging).


    For the developer coming from C#, Objective-C looks a bit odd. Some of the terminology
    used to describe the language will be foreign. Objective-C conventions, and so
    on, might temporarily make you feel like you''re learning to code all again.


    If you spent your life working in Objective-C, there are very real differences
    between how it and say, C#, what work that you would benefit from learning. However,
    the syntax, jargon, runtime, and so on, have, for the most part, analogs in C.
    In the same way a Spanish speaker can get by reading Portuguese, a C developer
    can, with a little help, get by reading Objective-C.


    If you''re interested in learning more about Objective-C than just how to read
    it, you can go through this chapter from start to finish.'
