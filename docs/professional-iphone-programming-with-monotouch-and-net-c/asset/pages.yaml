    # UIViewController


    The most common methods and properties of the ViewController are:


    +   - ViewDidLoad: Called after any views have been loaded. This method is where
    you typically put initialization code such as wiring up delegates. It is called
    once in the object''s lifetime.


    +   - ViewWillAppear: Perform any additional tasks associated with presenting
    the view. This method is called after ViewDidLoad and then again whenever the
    view is displayed. Always callWillAppear() in your implementation.


    +   - ViewWillDisappear: Notification that the view is being hidden. You can use
    this method to commit changes, because you don''t know whether the view will ever
    be re-displayed. Always call .ViewWillDisappear() in your implementation. During
    the life cycle of the view controller ViewWillDisappear andWillAppear can be called
    multiple times.


    +   - Title: A property used to represent the view (see the'' example in Listing
    4-13 in the chapter).


    > If you override a method on a framework class and are unsure whether you need
    to call the base method in your code, check the Apple or MonoTouch documentation.

    http://developer.apple.com/iphone/library/

    http://go-mono.com/docs/


    Apple''s documentation for ViewWillAppear and ViewWillDisappear explicitly states
    "If you override this method, you must call super at some point in your implementation."
    super is the Objective-C equivalent of base in C#.


    Properties are only set (and used) when the view controller is associated with
    other classes discussed in the chapter. They are briefly described here, but you
    should read the last sections to fully understand their purpose.


    +   - NavigationController:null unless this is already in a navigation stack.


    +   - NavigationItem: Read-only reference to the UINavigationItem that represents
    this controller, assuming it has been pushed onto a navigation stack.


    +   - TabBarController:null unless this controller has added to a tab bar.


    +   - TabBarItem: If part of a tab bar, this references the UITabBar representing
    the controller (that is, the display text and image).


    +   - ToolbarItems: If this is being used by a UINavigationController, contains
    an array of UIToolbarItems.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_101_0.png)'
