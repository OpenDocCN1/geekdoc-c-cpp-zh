    \ device's current locale. Programmatically access this, you use the static method\
    \ LocalizedLabel on AddressBook. By passing the label that you get from the original\
    \ label, you return the localized string label.\n\nAccessing the Address Book\
    \ programmatically can be useful for the most part, but to hand crank UI components\
    \ on top of it takes a long time when you really want just the default behavior\
    \ users expect from iPhone. Fortunately Monotouch.AddressBookUI has this covered\
    \ and provides a few helpful controllers to make this interaction easier.\n\n\
    The four classes that provide this functionality are ABPersonViewController, ABPeoplePickerNavigationController,\
    \ ABNewPersonViewController, and ABUnknownPersonViewController.\n\n> All the views\
    \ by the ABPeoplePickerNavigationController need to be used with a navigation\
    \ controller; otherwise they do not work properly.\n\n# ABPersonViewController\n\
    \nThe ABPersonViewController is a view controller that provides the ability to\
    \ display and edit a single Address Book contact. Figure 11-4 shows how a default\
    \ person view would look, and Figure 11-5 shows the edit view. By default, editing\
    \ is not enabled, but you can enable it by setting AllowEditing to true. TheedPerson\
    \ property requires an ABPerson variable and sets the view controller to display\
    \ this person. Listing 11-5 shows how you would use this view controller. Make\
    \ sure you have a person with \"Example\" in their name for the sample to work."
