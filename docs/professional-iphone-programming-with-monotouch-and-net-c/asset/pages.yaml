  md: "# UIWindow\n\nAn iPhone OS application generally has only one window — it provides\
    \ the background upon which the rest of your user interface is displayed. Unlike\
    \ windows in a desktop operating system, the UIWindow class has no \"chrome\"\
    \ (no title bar; resize handles; minimize, maximize, or close buttons) and must\
    \ always fill the entire screen. The only adornment is the status bar at the top\
    \ of your window, which you can optionally show or hide.\n\nWhen you create a\
    \ new application solution in MonoDevelop it automatically adds MainWindow.x to\
    \ your project, which contains a UIWindow instance class called. It also adds\
    \ AppDelegate FinishedLaunching method that includes the line window. MakeKeyAndVisible(this),\
    \ which shows the window.\n\nIt is possible to create a window directly in code.\
    \ Listing 4-1 shows the simplest MonoTouch application requiring no Interface\
    \ Builder files to display some text on the screen. Most examples in this book\
    \ do use Interface Builder in the samples, but it's worth remembering that you\
    \ can always achieve the same effect constructing your UIView objects in code.\n\
    \n+   LISTING 4-1: Creating UIWindow in code (Window01ViewController.cs)\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_80_0.png)\n\
    \n```\nusing System;\nusing MonoTouch.Foundation;\nusing MonoTouch.UIKit;\nnamespace\
    \ Window01\n{\n    Register(\"AppController\")\n    public class AppController\
    \ : UIApplicationDelegate\n{\n        UIWindow window;\n        public override\
    \ void FinishedLaunching(UIApplication app)\n        {\n            window = new\
    \ UIWindow(UIScreen.MainScreen.Bounds);\n            new UILabel(System.Drawing.RectangleF(50,150,230,100))\n\
    \            { Text = \"Hello world\" }\n            ;\n            window.MakeKeyAndVisible();\n\
    \        }\n    }\n    class HelloWorld\n{\n        static void Main(string[]\
    \ args)\n        {\n            UIApplication.Main(args, null, \"AppController\"\
    );\n        }\n    }\n\n```\n\nUIWindow should always fill the entire screen,\
    \ the use of UIScreen.MainScreen.Bounds to size the window."
