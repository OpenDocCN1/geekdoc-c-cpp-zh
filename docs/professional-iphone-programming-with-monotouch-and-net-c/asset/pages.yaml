  md: 'CHRIS HARDY, a Microsoft ASP Insider works for a digital agency called Great
    Fridays in Manchester, United Kingdom, developing ASP.NET solutions for clients
    like Peter Gabriel and Emma MonoTouch was beta, Chris has been developing and
    evangelizing MonoTouch and was one of the first users to get a MonoTouch application
    to the App Store. Speaking at conferences around the world on the subject, Chris
    has been a key part of the community and is extending this by contributing to
    the MonoTouch book.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_9_0.png)


    RORY BLYTH has worked in the software development industry for nearly a decade.
    He began as an independent contractor, then went on to co-host the .Net Rocks
    podcast, as a public speaker for Microsoft, join''s Channel9, and delivers many
    tasks for other companies/conferences on subjects including iPhone development
    using both Objective-C and MonoTouch. He learned iPhone development during a year
    working at Spotlight Mobile — a development firm where popular iPhone apps like
    Style.com and Barnes and Noble were produced.


    # # ABOUT THE TECHNICAL EDITORS


    ALEX YORK is a graduate of the University of Manchester in England, where he studied
    computing science. He has been developing software solutions ever — almost exclusively
    with C# and .NET Framework. After graduating, Alex worked in Manchester for a
    mobile gaming company, using ASP.NET and WCF on a daily basis. He moved to Norway
    in 2008 and started working for Bennett, building customer solutions using C#
    and ASP.NET for recognizable Norwegian brands. In his spare time he was an early
    adopter of iPhone development with MonoTouch and an active member of the community.
    He currently works as a technology consultant for Capgemini, in Trondheim.


    JOHN MANIA grew up in London and has been developing since 1999 when he switched
    from marketing to development. During the time that he worked for a value-added
    reseller (VAR), a company, a portal, a design agency, a consultancy and he is
    currently working for a leading global investment bank. He has been working with
    .NET since it was beta, and for a number of years he was a major contributor to
    an open source project like Rainbow Portal (2002–2005) which has over 130,000
    downloads. One of his interests is mobile development, and he’s been using MonoTouch
    since it was beta when he was up to the MonoTouch community site http://monotouch.info
    and twitter @monouchinfo to help others who have decided to use .NET skills and
    apply to iPhone/Pad development.


    JIM ZIMMERMAN is an ASP.NET MVP and CTO of Thuzi and TeamZones in Tampa, Florida.
    He decided to learn Objective-C last year in order to create iPhone apps for his
    four kids and for himself. He has been convinced since MonoTouch is the way to
    allow him to bring his C# skills with him, giving him a much more rapid development
    experience. He looks forward to the day when he can have at least 90 percent of
    the code running on all relevant mobile devices.'
