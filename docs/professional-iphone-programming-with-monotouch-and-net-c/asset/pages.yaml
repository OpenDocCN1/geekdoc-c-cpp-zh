    \ selection of values. |\n| Space Bar Item - Represents empty space in a toolbar.\
    \ | Date Picker - Displays fields where users to select dates and times. |\n|\
    \ Tab Bar - Provides a mechanism for displaying a tab at the bottom of the screen.\
    \ | |\n| Tab Bar Item - Represents an item in a UITabBar.\n\nFIGURE 4-1\n\n# WINDOWS\
    \ AND VIEWS\n\nWindows and views form the underpinnings of all iPhone OS applications.\
