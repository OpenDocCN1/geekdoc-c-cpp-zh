  md: '# Sending a Text/SMS Message


    The sms: protocol enables you to open the Messages application and open a new
    message to a specified number. There is no option to pass a predefined message
    into a new text message. This first code example shows how to just open a list
    of texts on the device:


    ```

    var url = NSUrl.FromString("sms:");

    UIApplication.SharedApplication.OpenUrl(url);

    ```


    This next example shows how to open up a new text message with the passed-in number:


    ```

    var url = NSUrl.FromString("sms:1-408-537-6309");

    UIApplication.SharedApplication.OpenUrl(url);

    ```


    # Opening a Location in the Maps Application


    To load up the Maps application from a native iPhone app, you simply use a normal
    web site link to Google Maps. A few query string parameters are available to use
    when creating Google Maps URL, such as q for a search query and saddr and daddr
    for source and destination address, respectively. This example loads a map of
    Manchester, United Kingdom:


    ```

    var url = NSUrl.FromString("http://maps.google.com/maps?q=Manchester,UK");

    UIApplication.SharedApplication.OpenUrl(url);

    ```


    > If you are running this in the simulator, since the simulator does not have
    the Google Maps application, the map loads up in Safari. On the device, the link
    loads up in the Google Maps application.


    The ability to have web sites within your own application without closing your
    application is also available with the MapKit API. You can see how to use this
    in Chapter 7.


    # Opening a YouTube Video


    As previously saw with the Maps example, you just use a normal URL to open up
    the Maps application; this principle is the same when you want to play a YouTube
    video. You can use either of the two YouTube URLs in the following example code.
    You need to use the video identifier to identify the video. The two variables
    in the code snippet below—youtubeUrl1 and youtubeUrl2—show examples of the different
    types of URLs that you can use to open a YouTube video.


    ```

    var videoId = "QHyBnwTwQM";nvar youtubeUrl1 =

    String.Format("http://youtube.com/watch?v={0}", videoId);

    var youtubeUrl2 =

    String.Format("http://youtube.com/v/{0}", videoId);

    var url = NSUrl.FromString(youtubeUrl2)

    UIApplication.SharedApplication.OpenUrl(url);

    ```'
