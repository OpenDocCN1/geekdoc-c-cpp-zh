  md: '> You may notice we are using NSUrl.FromString() here and not just simply

    new NSUrl(). This is because using the constructor would throw an exception

    if there were an error, whereas FromString will return null.


    You can achieve a similar solution using the UIWebView to include web sites directly
    within

    your application without the need for the app to close. This is covered earlier
    in this book in

    Chapter 4.


    # # Opening E-mail


    Opening e-mail is very similar to how you''d expect it to work with the mailto:
    protocol:


    ```

    var url = NSUrl.FromString("mailto:chris@example.com*");

    UIApplication.SharedApplication.OpenUrl(url)

    ```


    > Whoops. This code won''t run in the simulator. The simulator does not have the

    capability, so you need to test this code on the device. You''ll notice this is
    the

    same for making phone calls, sending text messages, and working with other appli-

    cations, which might not be installed on the device, including third-party apps.

    The OpenUrl method returns a Boolean telling whether you or not the method

    was run successfully. You should use this information when it doesn''t run suc-\cessfully
    to show an appropriate error message.


    As the mailto: protocol, you can also pass in other commands: bcc, cc, subject,
    and

    body. This populates the necessary fields in the standard mail template. The from
    command nor-

    used with the mailto: protocol is ignored by the iPhone SDK, so it will not work.
    Here''s an

    example of the extra commands being used:


    ```

    var url = NSUrl.FromString("mailto:chris@example.com?cc=other@example.com\n&subject=Wrox&body=Monotouch*");

    UIApplication.SharedApplication.OpenUrl(url)

    ```


    # # Making a Telephone Call


    Using the tel: protocol, you can use the built-in telephone functionality of the
    iPhone by using

    following NSUrl. This example shows hyphens within the number, which are automatically

    stipped out as necessary.


    ```

    var url = NSUrl.FromString("tel:+1-408-867-5309*");

    UIApplication.SharedApplication.OpenUrl(url)

    ```'
