  md: '# Summary | 231


    Within your animation block, you do two things. The first is to set up additional
    parameters on the animation block. In this example you''re setting the animation
    duration to last one second, creating a new selector to fire when your animation
    has finished, and you''re setting the delegate to the class you''re in so that
    the selector will be found. The selector needs to be fired off Objective-C, you
    use the Export method on your `DidFinishAnimation` method to expose this. (A selector
    is simply the name of a method within Objective-C.) When the animation is complete,
    your label''s opacity will be set to 0 and will not be visible. In your `DidFinishAnimation`
    method, you can dispose of the label.


    The second thing you do within your animation block is to animate the actual objects.
    You set the final properties on your objects to how you want them to appear after
    the animation happens, and the label''s `CoreAnimation` takes care of the transformation
    from the two states. By default, the opacity is set to 1. Because you want this
    to be hidden, you set the opacity to 0 so it animates a fade out. You want the
    `hiddenButton` to appear so you do the inverse of the label and set the opacity
    to 1, and to create the rotation effect, you put a transform on the label to rotate
    it upside down.


