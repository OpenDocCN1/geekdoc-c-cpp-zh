  md: '# CHAPTER 3 PLANNING YOUR APP''S UI: EXPLORING THE SCREEN CONTROLS


    all of the CocoaTouch classes for making your apps look and feel just like CocoaTouch
    apps. In addition to exploring these classes, the author urges you to take a look
    at Apple’s *Human Interface Guidelines*; it provides developers with descriptions
    of interaction patterns for common problems.


    Apple provides the View Controller Programming Guide for iPhone OS in the iPhone
    SDK documentation. This document explores several high-level design patterns for
    user interaction. Apple has created semantics for describing the overall style
    of interaction for a given screen or set of screens in an application — almost
    all applications implement designs that can be described according to this vocabulary.
    With an understanding of these common patterns, you can plan your user interfaces
    according to your needs.


    # Command Interfaces


    A command interface is one in which you present your users with a toolbar containing
    one or more buttons that represent actions for them to command. Command interfaces
    typically don''t use controllers, but instead use wires for other objects directly.
    You add a Toolbar to your application to implement a command interface.


    A command interface might be right for your application if:


    +   - You have a very small, limited section of actions that the user can perform.

    - You are presenting the user with an editable view, maybe something like a drawing
    surface, and you want to provide a set of tools or actions.

    - You have one main screen from which the user performs all the actions of your
    application.


    Figure 3-2 shows examples of command interfaces.


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_65_0.png)


    FIGURE 3-2'
