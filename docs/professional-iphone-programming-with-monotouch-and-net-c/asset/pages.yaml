  md: '# FOREWORD


    MonoTouch is a blend of two fascinating and incredibly enjoyable worlds: the C#
    language and the iPhone. We designed MonoTouch to blend those two universes together,
    and we did this by tapping years of experience designing and implementing languages,
    APIs, and bindings.


    Our passion for the iPhone is very simple to explain: Like everyone we were smitten
    by the beautiful interfaces, we thought out design and a powerful development
    platform. This combination was hard to resist.


    Our love for C# goes back to the year 2000 when Microsoft unveiled their new language
    to the world. and just like C# rocked the Windows world, it rocked our world.
    By the year 2000 we had been working on the GNOME Desktop and the Evolution client
    for Linux for a few years, and we had learned more in developing applications.


    We were developing software in a competitive space, and we needed to produce software
    faster, with fewer developers. One option was to work harder and more hours. If
    we had chosen to raise the programming level: We kept performance sensitive code
    in C and produced bindings for high-level languages that developers could explore.


    When we announced C and the .NET Framework, the language was an immediate improvement
    that raised the programming level. The .NET language on the other hand ensured
    that our hands would not be tied to a single language, but also ensured that we
    could continue to reuse our existing code that we had written in C or C++. C made
    us and the world more productive.


    Mono over years in every possible direction. Let the desktop comfort zone where
    it originated and used everything from embedded controllers, to mp3 players, servers,
    video games, and industrial control.


    Mono on the iPhone was created out of our user''s demand. Montouchnovel.com email
    address was bombarded during 2008 and 2009 with requests to bring Mono to the
    iPhone, and by the summer of 2009 we had a full stack offering that was released
    in September.


    The authors of this book are the early testers of MonoTouch: They were there on
    the first days of MonoTouch launching, they were there to explore with the original
    API design, they were there to help shape the final product, and they continue
    to prioritize what matters most to developers targeting the iPhone.


    You know some of the authors already. Wally put out the e-book for MonoTouch in
    record time, and it helped hundreds of programmers get up and running with MonoTouch
    within months of the product release.


    Chris and Rory are both well known in the Windows/ASP.NET world and are very active
    members of the MonoTouch community: On our IRC chat room, on Stackoverflow, and
    on our forums they answered questions from new developers and helped developers
    make better applications.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Chris jumped into MonoTouch with the passion that only a rocker from Manchester
    can exhibit and started the open source Scott Hanselman “Hanselminutes” MonoTouch
    iPhone application.


    Rory has a unique view of the world; he has worked extensively with both .NET
    and Objective-C. He is a celebrity in the .NET world, but he is also the Barnes
    and Noble iPhone application, and it is battle-tested knowledge that he has brought
    into the MonoTouch community. You could not ask for a better spiritual mentor
    in this trip.


    And you probably know Craig from his series of blogs that have not only served
    newcomers to get started with MonoTouch, but also have become a reference that
    I turn to when I need to solve a problem in my own iPhone app. Craig came up with
    one of the most useful ideas for iPhone applications: the conference application.
    He used his blog for a while to explore ideas on what would make a useful conference
    application and produced two open source conference applications: the MonoSpace
    app and the PDC app.


    By the time of the Mix 2010 conference, Craig and Chris produced the MIX2010 application
    that was available to the MIX attendees. You knew it was a great idea when you
    would see people using the application on their phones before each session.


    Martin has been an early adopter of MonoTouch since its launch. He launched the
    first iPhone application for social web site DailyBirth and is a contributor to
    various open-source MonoTouch projects.


    Building applications with C# and the iPhone is the best of both worlds. You get
    to use a strongly typed, type safe, garbage collected language with the hottest
