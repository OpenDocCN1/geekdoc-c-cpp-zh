  md: '# Creating a Custom UIPopover


    The UISplitViewController automatically creates a popover for one of its views,
    but the UIPover is used throughout the iPad''s built-in applications for a variety
    of other purposes (some of which are shown in Figure 13-8):


    +   - To display information about an item on the screen by showing the popover
    when the object is touched (similar to the annotations in the Maps application)

    - To present actions that can be taken on a particular object (similar to a context-sensitive
    menu)

    - To act as an input helper (such as the birthday field in the Contacts application,
    which presents a UDatePicker in a UIPopover)


    ![](img/d823ede3f2031777391bbe3f48a2c8fa_317_0.png)


    Chapter download example iPad05 adds a button to the toolbar that displays a custom
    popover. Listing 13-5 shows how to create the button, add it to the toolbar, and
    assign a delegate that displays the popover (defined later). The delegate assigns
    the popover to a public field on the AppDelegate class declared like this:


    ```

    public UIPopoverController CustomPopover;

    ```


    so that other code can reference it (to dismiss it, for example).


