  md: "# CHAPTER 7 MAPPING\n\nWhen the AddressButton is touched it calls the MKReverseGeocoder.Start()\
    \ method, which starts a web request to reverse decode the latitude/longitude.\
    \ The web service is managed by the framework and uses Google Maps to define the\
    \ data. When the web service returns it the FoundWithPlemark delegate method,\
    \ which displays the information-on-screen.\n\nThe completed application is shown\
    \ in Figure 7-7, displaying the hardcoded location information that the simulator\
    \ allows returns.\n\n# Tracking Device Movement\n\nCoreLocation doesn't provide\
    \ a single location reading — it can be configured to continuously provide your\
    \ application with a stream of updates as the device moves around. You can affect\
    \ the frequency of these updates by setting the properties on CLLocationManager:\n\
    \n+   * DistanceFilter: Number of meters the device must move before an updated\
    \ location event is generated. The default value is to be notified of all.\n\n\
    +   * HeadingFilter: Number of degrees the device needs to turn before an updated\
    \ compass reading is generated. The default value is to be notified of all.\n\n\
    +   * DesiredAccuracy: The level of accuracy of location data that your application\
    \ requires. If you are trying to determine the user's city or country, ThreeKilometers\
    \ would be sufficient; if you are trying to determine a street address use the\
    \ Best available. The default value is to return the best available accuracy,\
    \ otherwise use the following enum to choose a value:\n\n```\nenum CLLocationAccuracy\n\
    {\n    Best = -1\n    NearestTenMeters = 10\n    HundredMeters = 100\n    Kilometer\
    \ = 1000\n    ThreeKilometers = 3000\n}\n```\n\n![](img/d823ede3f2031777391bbe3f48a2c8fa_179_0.png)\n\
    \nFIGURE 7-7\n\n> MyLocationDelegate and MyGeocoderDelegate are implemented as\
    \ \"nested types\" within the AppDelegate class for good reason. Because the buttons\
    \ and labels created in Interface Builder have references automatically generated\
    \ by MonoTouch in MainWindow.xib.designer.cs as private properties, classes defined\
    \ outside the AppDelegate cannot access them. Classes can access the private properties\
    \ of their containing class (for example, app.LocationLabel and app.AddressLabel),\
    \ which is delegate subclasses in MonoTouch are usually declared inside the class\
    \ that uses them."
