    \n> LISTING 9-8: Handling battery state notifications\n```objectivec\nNotificationCenter.DefaultCenter.addObserver(\n\
    \    *UIDeviceBatteryStateDidChangeNotification,\n    delegate {\n        BatteryLabel.Text\
    \ = UIDevice.CurrentDevice.BatteryLevel.ToString() +\n        *\" = UIDevice.CurrentDevice.BatteryState.ToString();\n\
    \    });\n```\nFound in the DeviceSupport/Main.cs file of the download\n\nFigures\
    \ 9-6 and 9-7 show the output of the battery state change notification while the\
    \ iPhone is plugged in, unplugged.\n\n| Battery | 0.85, Charging | Battery | 0.85,\
    \ Unplugged |\n| FIGURE 9-6 | | FIGURE 9-7 |\n\n# # ACCESSING SYSTEM INFORMATION\n\
    \nThe UIDevice class provides access to information about the current device beyond\
    \ the features in the device. The UIDevice.CurrentDevice class exposes a set of\
    \ properties that allow for system-level information to be determined. These properties\
    \ are:\n\n+   - LocalizedModel: The localized model property is a localized string\
    \ representing information about the specific model.\n- Model: The model property\
    \ returns a string with information about the specific model.\n- Name: The name\
    \ property returns a string with the name of the device. This is the value for\
    \ the General > About settings.\n- SystemName: The system name is the name of\
    \ the operating system currently running on the iPhone."
