  md: '# 194 | CHAPTER 9 PROGRAMMING WITH DEVICE HARDWARE


    +   In this example, all that user would have to shake the device and a result
    is displayed in the X, Y, Z, directions along with the magnitude of the acceleration.


    +   Setting the UpdateInterval directly affects the device. The more times that
    acceleration events are handled, the more the battery is drained.


    +   The UpdateInterval can only be within the hardware resolution of the device.
    If there are more requested updates per second than hardware supports, the maximum
    number of hardware updates is performed. No error occurs if the UpdateInterval
    is too quick for the hardware that the application is running.


    +   Unless the iPhone is perfectly motionless, it is most likely undergoing some
    amount of acceleration. The acceleration measured or may not be significant. It
    is a good idea to put some type of threshold value so that the acceleration is
    only used when it is needed.


    +   Acceleration is not the same as velocity. Technically, acceleration is the
    rate of change of velocity over a unit of time, they are related. The accelerometer
    measures acceleration, and from it is possible to determine velocity. (Discussion
    of mathematics is beyond this book.) Thanks to some calculus, it is fairly easy
    to take the acceleration values along its initial location and figure out the
    location of the iPhone as it moves around, even if wireless connection is available.


