    # AUDIO\n\nThe iPhone provides many different ways of playing audio on the device,\
    \ whether it is a short sound clip or a full-length podcast show. This section\
    \ discusses the different ways that you can play audio through the iPhone, how\
    \ to listen to audio, and also how to record audio.\n\n# Playing Audio\n\nUsing\
    \ audio in an application allows you either to play a short system sound, which\
    \ offers a quick and limited audio experience, or to play a much larger sound\
    \ using the AVAudioPlayer class. The next few sections describe how to use audio\
    \ in these ways.\n\n# Short Audio\n\nUsing the SystemSound functionality in the\
    \ AudioToolbox is the best way to play short audio clips. You can only use the\
    \ SystemSound method for playing audio that is shorter than 30 seconds in duration.\
    \ This is because the SystemSound class uses a low-level C interface to play short\
    \ system sounds. I discuss playing audio for a longer amount of time later in\
    \ this chapter."
