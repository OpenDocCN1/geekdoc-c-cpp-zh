  md: '# 11


    # Talking to Other Applications


    WHAT''S IN THIS CHAPTER?


    +   - Making MonoTouch talk with other applications with the OpenURL method

    - Having your applications integrate with third-party applications

    - Accessing the iPhone Address Book or the iPod music library

    - Integrating with third-party libraries with Objective-C and .NET


    This chapter discusses the ways you can use MonoTouch to talk to other applications
    on the iPhone, both App-built applications and those downloaded from the App Store.
    It also provides helpful ways of accessing the iPhone''s Address Book and the
    iPod music library.


    The secret behind interacting with any application on the device is the OpenURL
    method on the current UIApplication, which can be accessed via UIApplication.SharedApplication.
    This method handles where and what to open when you pass in an object for it to
    parse. When the method is called, the app closes in its normal fashion by calling
    the WillTerminate method as it closes and carries out the appropriate action based
    on the OpenURL passed.


    # INTEGRATING APPLE APPLICATIONS


    This section shows how you can integrate App-built applications into your own
    application.


    # Opening Up Safari


    Opening up Safari is a pretty straightforward place to start. The most likely
    reason for you to close down your app and open up Safari is because you would
    like a site to be displayed. The web site URL is the NSObject that you pass into
    the OpenURL method:


    ```

    var url = NSUrl.FromString("http://wrox.com";

    UIApplication.SharedApplication.OpenURL(url);

    ```'
