  md: '# ACKNOWLEDGMENTS


    I''VE ALWAYS BEEN INTERESTED in mobile development. It wasn''t until the summer
    of 2009 that Wrox and I were able to agree on creating a mobile development/iPhone
    project. That project, part of the Wrox series, was the first version of this
    book; it published in November 2009. Two weeks after the release of the project,
    Associate Publisher Jim Minatel was happy with the sales of the ebook and was
    wondering about a bigger print on MonoTouch. Due to schedule, I needed to get
    other authors. I initially thought of Craig Dunn, Chris Hardy, and Martin Bowling.
    I had spoken with them co-authors during the writing of my first book, so it made
    sense to talk to them about co-authoring the print book. I spoke with Joseph Hill
    at a Novel one afternoon, and he suggested them as well. With some level setting
    in my initial choices, I talked with each one and they all accepted. I was ecstatic.
    Rory Blyth joined a short way into our book. Thanks to Jim Minatel for allowing
    me to start writing on MonoTouch. Thanks to Bob Elliot for keeping us on target,
    and big thanks to Kevin Kent for doing the dirty work of keeping us on track.


    Given that my co-authors were on separate continents and hemispheres, I want to
    thank them for their great work. Craig and Chris did a great job, were very attentive
    to detail, and were always always on top of what was going on.


    I want to thank my family. They did a great job allowing me to work on the book
    and to work for customers as we owe them a huge “Thank You.”


    Finally, I want to thank you for purchasing this book. We hope you enjoy this
    book as much as we have enjoyed writing it.


    —WALLACE B. MCCLURE


    SPECIAL THANKS to my wonderful wife Mandi Rae. Without her I don''t know where
    I would be. Thanks to my mom, CK, Sarah, and all those who have supported me over
    the years. And thanks to Brewski Firth for keeping me company while I code.


    —MARTIN BOWLING


    THANKS TO Karl, Mike, and Chris for inspiration, and Mum for everything. To Jack,
    Lilliana, Will, Sam, and Marcus — always do your best.


    —CRAG DUNN


    THANKS TO my wife, Cara, for putting up with the long nights and to my parents,
    Hazel and Bob.


    —CHRIS HARDY'
