- pgno: 549
  md: '# # C in Depth


    The book explains each topic in depth without compromising over the lucidity of
    the text and programs. This approach makes this book suitable for both novices
    and advanced programmers. The well - structured programs are easily understandable
    by the beginners and useful for the experienced programmers. The book contains
    about 300 programs, 210 exercises and 80 programming exercises with solutions
    and hints to solve programming exercises. Five new chapters have been included
    in this edition of the book. The chapter on project development and library creation
    can help students in implementing their knowledge and become a perfect C programmer.


    # ## ABOUT THE AUTHOR


    Suresh Kumar Srivastava has been working in software industry for last 7 years.
    He has done B level from DOEACC Society. He has worked on development of device
    driver, debugger and system software area. He likes to work on system side as
    well as some creative work for development of software tools. He has authored
    a book on Data Structures titled “ Data Structures through C in Depth”, which
    can be useful for students to work in system software development.


    Deepali Srivastava has done MSc. In Mathematics and Advanced PG D C A from MJP
    Rohilkhand University. Her areas of interest are C and Data Structures. She also
    likes to learn and work on systems software. She has authored a book on Data structures
    titled “Data Structures through C in Depth”. She is planning to work on some other
    topics and use her creativity in system software development.'
  merge: -1
  img_proc: true
