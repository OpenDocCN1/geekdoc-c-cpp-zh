    # 8.8 Pointers and One Dimensional Arrays


    The elements of an array are stored in contiguous memory locations. Suppose we
    have an array arr[5] of type int.


    ```

    int arr[5] = {1, 2, 3, 4, 5};

    ```


    This is stored in memory as-


    | 5000 | 5002 | 5004 | 5006 | 5008 |

    |---|---|---|---|---|

    | 1 | 2 | 3 | 4 | 5 |

    | arr[0] | arr[1] | arr[2] | arr[3] | arr[4] |


    Here 5000 is the address of first element, and since each element (type int) takes
    2 bytes so address of next element is 5002, and so on. The address of first element
    of the array is also known as the base address of the array. So we have seen that
    the elements of array are stored sequentially in memory one after another.


    In C language, pointers and arrays are closely related. We can access the array
    elements using pointer expressions. Actually the compiler also accesses the array
    elements by converting subscript notation to pointer notation. Following are the
    main points for understanding the relationship of pointers with arrays.


    +   1. Elements of an array are stored in consecutive memory locations.

    +   2. The name of an array is a constant pointer that points to the first element
    of the array, i.e. it stores the address of the first element, also known as the
    base address of array.

    +   3. According to pointer arithmetic, when a pointer variable is incremented,
    it points to the next location of its base type.


    For example-


    ```

    int arr[5] = { 5 , 10 , 15 , 20, 25 }

    ```


    Here arr[5] is an array that has 5 elements each of type int.


    | arr[0] | arr[1] | arr[2] | arr[3] | arr[4] |

    |---|---|---|---|---|

    | 5 | 10 | 15 | 20 | 25 |

    | 2000 | 2002 | 2004 | 2006 | 2008 |


    We can get the address of an element of array by applying & operator in front
    of subscripted variable name. Hence &arr[0] gives address of 0th element, &arr[1]
    gives the address of first element and so on. Since array subscripts start from
    0, we’ll refer to the first element of array as 0th element and so on.


    The following program shows that the elements of an array are stored in consecutive
    memory locations.


