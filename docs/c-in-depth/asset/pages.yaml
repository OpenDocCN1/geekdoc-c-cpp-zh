    Some examples of lvalues are-


    +   - var (var is an integer variable)

    +   - ptr (ptr is a pointer)

    +   - *ptr (ptr is a pointer variable)

    +   - emp (emp is a structure variable)

    +   - emp->salary (here emp is a structure variable and salary is its member)

    +   - arr[2] (arr is a 1-d array)


    All these expressions can occur both on the left side and right side of assignment
    operator i.e. we can use their values in the program and their value can be modified.


    # 14.10 Compilation And Execution of C Programs


    There are different phases through which our program passes before being transformed
    into an executable form. The following figure shows these phases-


    # 14.10.1 Preprocessor


    The source code is the code that we write using any text editor and the source
    code file is given an extension ''.c''. This source code is firstly passed through
    the preprocessor. The preprocessor expands this code and passes it to the compiler.
    We have discussed the role of preprocessor in chapter 12.


    # 14.10.2 Compiler


    The expanded code is passed to the compiler. The compiler converts this code into
    the machine''s assembly language code.


    # 14.10.3 Assembler


    This assembly language is converted to object code by the system''s assembler.
    The name of object file is same as that of source file. In DOS the object file
    has extension ''.obj'' and in UNIX the extension is ''.o''.


    # 14.10.4 Linker


    Generally all programs written in C, use library functions. Library functions
    are precompiled and their object code is stored in library files with ''.lib''(or
    ''.a'') extension. The linker combines this object code of the library functions
    with the object code of our program. Our program may also contain references'
