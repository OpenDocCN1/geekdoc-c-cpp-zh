- pgno: 50
  md: '++x is equivalent to    x = x + 1

    --x is equivalent to    x = x - 1


    These operators should be used only with variables; they can''t be used with constants
    or expressions. For example the expressions ++5 or ++(x+y+z) are invalid.


    These operators are of two types-


    +   1. Prefix increment / decrement – operator is written before the operand (e.g.
    ++x or - -x)

    +   2. Postfix increment / decrement – operator is written after the operand (e.g.
    x++ or x - -)


    # 4.6.1 Prefix Increment / Decrement


    Here first the value of variable is incremented / decremented then the new value
    is used in the operation


    Let us take a variable x whose value is 3.


    The statement y = ++x; means first increment the value of x by 1, then assign
    the value of x to y


    This single statement is equivalent to these two statements-

    x = x+1;

    y = x;


    Hence now value of x is 4 and value of y is 4.


    The statement y = -- x; means first decrement the value of x by 1 then assign
    the value of x to y


    This statement is equivalent to these two statements.

    x = x-1;

    y = x;


    Hence now value of x is 3 and value of y is 3.


    ```

    /*P4.3 Program to understand the use of prefix increment / decrement */

    #include<stdio.h>

    main()

    {

    int x=8;

    printf("x = %d\t",x);

    printf("x = %d\t",++x); /*prefix increment*/

    printf("x = %d\t",--x); /*prefix decrement*/

    printf("x = %d\n",x);

    }

    ```


    Output:


    x = 8    x = 9   x = 9   x = 8   x = 8


    In the second printf statement, first the value of x is incremented and then printed;
    similarly in the four printf statement first the value of x is decremented and
    then printed.


    # 4.6.2 Postfix Increment / Decrement


    Here first the value of variable is used in the operation and then increment/decrement
    is perform


    Let us take a variable whose value is 3.


    The statement y = x++; means first the value of x is assigned to y and then x
    is incremented. T statement is equivalent to these two statements-'
