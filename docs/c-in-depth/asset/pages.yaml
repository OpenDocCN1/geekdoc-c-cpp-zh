- pgno: 442
  md: "We may input the value into a temporary variable and then assign it to the\
    \ bit field.\n\n```\nscanf(\"%6d\", &temp);\nvar.a = temp;\n```\n\nIf we have\
    \ pointer to structure then arrow operator(->) can be used to access the bit fields.\
    \ Code using bitfields is easier to understand than the equivalent masking operations,\
    \ but bitfields are considered non-portable as most of the issues related with\
    \ them are implementation dependent.\n\nWe had mentioned that the data type of\
    \ bit fields can be int, signed int or unsigned int. A plain int field may be\
    \ treated as signed by some compilers while as unsigned by others. So for portability,\
    \ it is better to clearly specify signed or unsigned in the declaration of bit\
    \ fields. If a bitfield is defined as signed, then it should be at least 2 bits\
    \ long because one bit is used for sign.\n\nThe direction of allocation of bit\
    \ fields within an integer is also implementation dependent. Some C compilers\
    \ allocate the bit fields from right to left, while others may allocate them from\
    \ left to right. If the bit fields are assigned from right to left, then the first\
    \ field occupies the least significant bit. If the bit fields are assigned from\
    \ left to right, then the first field occupies the most significant bit.\n\n![](img/a76c706396af8b310f291a5313a27079_442_0.png)\n\
    \nFour bit fields assigned from right to left\n\n![](img/a76c706396af8b310f291a5313a27079_442_1.png)\n\
    \nFour bit fields assigned from left to right\n\nThe other implementation dependent\
    \ issue about bit fields is that whether they can cross integer boundaries or\
    \ not. For example consider this structure-\n\n```\nstruct tag{\n    unsigned\
    \ a:5;\n    unsigned b:2;\n    unsigned c:12;\n};\n```\n\nThe first two fields\
    \ occupy only 7 bits in a 16 bit integer, so 9 bits can still be used for another\
    \ bit field. But the bits needed for next bit field is more than 9. Some implementations\
    \ may start the next field(c) from a new integer, while others may just place\
    \ the next field in 12 adjacent bits i.e. 9 unused from the previous integer and\
    \ 3 bits from the next integer.\n\n![](img/a76c706396af8b310f291a5313a27079_442_2.png)\n\
    \nBit fields cross integer boundary"
  merge: -1
  img_proc: true
- pgno: 443
  md: "![](img/a76c706396af8b310f291a5313a27079_443_0.png)\n\n# Bit fields do not\
    \ cross integer boundary\n\nWe can define unnamed bitfields for controlling the\
    \ alignment of bitfields within an integer. The size of unnamed bitfield provides\
    \ padding within the integer.\n\n```\nstruct tag{\n    unsigned a:5;\n    unsigned\
    \ b:2;\n    unsigned :9; /* padding within first integer */\n    unsigned c:12;\n\
    };\n```\n\nHere the unnamed bitfield fills out the 9 unused bits of first integer,\
    \ so the bitfield c starts with the second integer. Since these 9 bits don't have\
    \ any name, so they can't be accessed from the program\n\nWe can also take the\
    \ size of the unnamed bitfield zero, so we have no need to provide the padding\
    \ and next bitfield will start with second integer.\n\n```\nstruct tag{\n    unsigned\
    \ a : 5;\n    unsigned b : 2;\n    unsigned : 0;\n    unsigned c : 12; /*this\
    \ field starts from next integer*/\n};\n```\n\nNow we'll take the example of file\
    \ permissions that we had seen earlier using bitwise operators.\n\n```\nstruct\
    \ permission\n{\n    unsigned r_owner:1;\n    unsigned w_owner:1;\n    unsigned\
    \ a_owner:1;\n    unsigned e_owner:1;\n    unsigned r_group:1;\n    unsigned w_group:1;\n\
    \    unsigned a_group:1;\n    unsigned e_group:1;\n    unsigned r_others:1;\n\
    \    unsigned w_others:1;\n    unsigned a_others:1;\n    unsigned e_others:1;\n\
    };\n```\n\n```\nstruct permissions perm = {1, 1, 1, 1, 1, 0, 0, 1, 1, 0, 0, 0};\n\
    ```\n\nAfter this statement owners will get all permissions, group will get read\
    \ and execute permission, others will get only read permission.\n\nNow we can\
    \ write statements to grant and take permissions like this-\n\n```\nperm.e_others\
    \ = 1;    /*grant execute permission to others*/\n```"
