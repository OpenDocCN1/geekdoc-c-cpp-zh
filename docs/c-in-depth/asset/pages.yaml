- pgno: 1
  md: '# Preface to Second Edition


    The first edition of this book was appreciated by the students for its simplicity.
    The second edition maintains this feature along with inclusion of new topics and
    errors of previous edition being rectified. Every topic has been explained in
    depth without compromising over the lucidity of the text and programs. This approach
    makes this book suitable for both novices and advanced programmers.


    Development of logic and familiarity with the syntax and features of the language
    are the two pillars of excellent programming skills. The comprehensive contents
    of the chapters along with the numerous example programs helps you to develop
    your logic in a stepwise manner and makes you feel comfortable with the syntax
    of the language. Remember that you can''t learn swimming by just reading a book
    on how to swim, you have to jump into water for that, similarly if you want to
    learn programming, it is essential for you to make your own programs. So start
    by understanding the programs given in the book, work on them, modify them and
    see the results and try to make similar programs.


    Each chapter is complemented by exercises with solutions that act as a review
    of the chapter. We strongly recommend that you solve all the exercises before
    switching over to another topic. Exercises have been structured in such a way
    that you can test and implement the knowledge acquired from the chapter, and this
    is really important for getting full hold over a topic. We''re sure if you understand
    the concepts, you''ll enjoy doing the exercises.


    Our aim of writing this book is to enable any student emerge as a full-fledged
    C programmer who can withstand the challenges of the industry. This is the reason
    for inclusion of chapters on project building, library development and code optimization.


    We are thankful to our family and friends for their love and support.


    If you have any problems or suggestions, please feel free to contact us at-


    suresh_k_sri@yahoo.co.in

    deepali_tko@yahoo.co.in


    Suresh Kumar Srivastava

    Deepali Srivastava'
  merge: -1
  img_proc: true
- pgno: 2
  md: '# Preface to First Edition


    Hello ! I am Suresh Kumar Srivastava. Firstly I want to tell you how the idea
    of writing a book on ‘C’ language came to my mind. When I was in 1st semester
    of ‘B Level’, C language was in my course. I didn’t know anything about computers.
    So that time learning of ‘C’ language was very difficult for me. I faced a lot
    of problems. After thorough studies of many standard and authentic books in ‘C’,
    it became convenient for me to work in ‘C’. Presently I am in a position to say
    that that I have in-depth knowledge of ‘C’ and find myself in a position to help
    my juniors in making them comfortable with ‘C’. This idea inspired me to write
    a book which is easily understandable by beginners and contains all theoretical
    concepts and their implementation in programming.


    I was alone in this work. I was the initiator, visualizer and accomplisher for
    this work.


    I am very thankful to my elder brother Raju Bhaiya and sister Reena didi for their
    love and care for me and my work. I am thankful to my friend Shailesh Raghuvanshi
    for proof reading of my book. I am also thankful to Mr. Manish Jain and Mr. Anil
    Tyagi of BPB Publications for considering my work.


    Suresh Kumar Srivastava'
  merge: -1
  img_proc: true
