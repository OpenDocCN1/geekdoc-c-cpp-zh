  md: '# 7.7 Predefined File Pointers


    predefined constant file pointers are opened automatically when the program is
    executed.


    | File pointer | Device |

    |---|---|

    | stdin | Standard input device( Keyboard) |

    | stdout | Standard output device( Screen) |

    | stderr | Standard error output device (Screen) |


    The functions used for file I/O are


    +   - Character I/O - fgetc( ), fputc( ), getc( ), putc( )

    +   - String I/O - fgets( ), fputs( )

    +   - Integer I/O - getw( ), putw( )

    +   - Formatted I/O - scanf( ), fprintf( )

    +   - Record I/O - fread( ), fwrite( )


    We discuss all these functions one by one in detail.


    # 7.8 Character I/O


    # 7.8.1 fputc ()


    Declaration: int fputc( int c, FILE *fptr);


    This function writes a character to the specified file at the current file position
    and then increments the file position pointer. On success it returns an integer
    representing the character written, and on error returns EOF.


    ```

    /*7.11.1 Program to understand the use of fputc() function*/

    #include<stdio.h>

    main()

    {

    FILE *fptr;

    int ch;

    if((fptr=fopen("myfile.txt","w"))==NULL)

    {

    printf("File does not exist\n");

    exit();

    }

    else

    {

    printf("Enter text :\n");

    /*Press Ctrl+z in DOS and Ctrl+d in Unix to stop reading characters*/

    while((ch=getchar())!=EOF)

    fputc(ch,fptr);

    }

    fclose(fptr);

    }

    ```'
