    \ need to know the end of file so that they can stop reading. When the end of\
    \ file is reached, the operating system sends an end-of-file signal to the program.\
    \ When the program receives this signal, the file reading functions return EOF,\
    \ which is a constant defined in the file stdio.h and its value is -1. EOF is\
    \ an integer value, so make sure that the return value of the function is assigned\
    \ to an integer variable. Note that the value EOF is not present at the end of\
    \ the file, it is returned by the file reading functions when end of file is reached.\n\
