    }\n```\n\nThis program will write integers from 1 to 30 into the file \"num.dat\"\
    .\n\n# 11.9.2 getw ()\n\nDeclaration: int getw( FILE *fptr );\n\nThis function\
    \ returns the integer value from the file associated with fptr. It returns the\
