    # 10.15.6 Deletion From A Linked List


    For deleting a node from the linked list, first we traverse the linked list and
    compare with each element. After finding the element there may be two cases for
    deletion-


    +   1. Deletion of first node

    +   2. Deletion of a node in between or at the end.


    The deletion of nodes also requires adjustment of links. These link manipulations
    will delete the node from the linked list, but it will still occupy memory. Since
    the memory for each node was dynamically allocated by us, so it is our responsibility
    to release that memory after deletion of the node. To release the memory we''ll
    use the function free( ), and for that we''ll need a pointer to the node that
    has to be deleted. We''ll take a pointer tmp that will point to the node to be
    deleted and after deletion of the node we''ll call free as-


    ```

    free(tmp);

    ```


