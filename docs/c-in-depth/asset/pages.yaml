- pgno: 22
  md: '# 2.2 Execution Characters/Escape Sequences


    Characters are printed on the screen through the keyboard but some characters
    such as newline, tab, backspace cannot be printed like other normal characters.
    C supports the combination of backslash (\ ) and some characters from the C character
    set to print these characters.


    These character combinations are known as escape sequences and are represented
    by two characters. The first character is ''\'' and second character is from the
    C character set. Some escape sequences are given below-


    | Escape Sequence | Meaning | ASCII Value | Purpose |

    |---|---|---|---|

    | \b | backspace | 008 | Moves the cursor to the previous position of the current
    line |

    | \a | bell(alert) | 007 | Produces a beep sound for alert |

    | \r | carriage return | 013 | Moves the cursor to beginning of the current line.
    |

    | \n | newline | 010 | Moves the cursor to the beginning of the next line |

    | \f | form feed | 012 | Moves the cursor to the initial position of the next
    logical page. |

    | \0 | null | 000 | Null |

    | \v | vertical tab | 011 | Moves the cursor to next vertical tab position |

    | \t | Horizontal tab | 009 | Moves the cursor to the next horizontal tab position.
    |

    | \\ | backslash | 092 | Presents a character with backslash ( \ ) |


    Blank, horizontal tab, vertical tab, newline, carriage return, form feed are known
    as whitespace in C language.


    # 2.3 Trigraph Characters


    There is a possibility that the keyboard doesn’t print some characters. C supports
    the facility of "trigraph sequence" to print these characters. These trigraph
    sequences have three characters. First two are ''??'' and third character is any
    character from C character set. Some trigraph sequences are as given below-


    | Trigraph Sequence | Symbol |

    |---|---|

    | ??< | { left brace |

    | ??> | } right brace |

    | ??( | [ left bracket |

    | ??) | ] right bracket |

    | ??! | | vertical bar |

    | ??/ | \ backslash |

    | ??= | # hash sign |

    | ??- | ~ tilde |

    | ??'' | ^ caret |'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 2.4 Delimiters


    Delimiters are used for syntactic meaning in C. These are as given below-


    +   : colon used for label

    +   ; semicolon end of statement

    +   ( ) parentheses used in expression

    +   [ ] square brackets used for array

    +   { } curly braces used for block of statements

    +   # hash preprocessor directive

    +   , comma variable delimiter


    # 2.5 Reserved Words / Keywords


    There are certain words that are reserved for doing specific tasks. These words
    are known as keywords and they have standard, predefined meaning in C. They are
    always written in lowercase. There are only 32 keywords available in C which are
    given below-


    +   auto break case char

    +   const continue default do

    +   double else enum extern

    +   float for goto if

    +   int long register return

    +   short signed sizeof static

    +   struct signed switch typedef union

    +   unsigned void volatile while


    # 2.6 Identifiers


    All the words that we''ll use in our C programs will be either keywords or identifiers.
    Keywords are predefined and can''t be changed by the user, while identifiers are
    user defined words and are used to give names to entities like variables, arrays,
    functions, structures etc. Rules for naming identifiers are given below-


    +   (1) The name should consist of only alphabets (both upper and lower case),
    digits and underscore sign (_).

    +   (2) First character should be an alphabet or underscore.

    +   (3) The name should not be a keyword.

    +   (4) Since C is case sensitive, the uppercase and lowercase letters are considered
    different. For example code, Code and CODE are three different identifiers.

    +   (5) An identifier name may be arbitrarily long. Some implementations of C
    recognize only the first eight characters, though most implementations recognize
    31 characters. ANSI standard compilers recognize 31 characters.


    The identifiers are generally given meaningful names. Some examples of valid identifier
    names- Value a net_pay rec1 _data MARKS'
  merge: -1
