  md: '# 4.3 Floating-Point Arithmetic


    When both operands are of float type then the arithmetic operation with these
    operands and is called floating point arithmetic. Let us take two variables a
    and b. The value of a = 12.4 and b = 3.1, the result of the following operations
    are as-


    | Expression | Result |

    |----------|--------|

    | a+b | 15.5 |

    | a-b | 9.3 |

    | a*b | 38.44 |

    | a/b | 4.0 |


    The modulus operator % cannot be used with floating point numbers.


    ```

    /*P4.2 Program to understand the floating point arithmetic operation */

    #include<stdio.h>

    main ()

    {

    float a=12.4,b=3.8;

    printf("Sum = %.2f\n",a+b);

    printf("Difference = %.2f\n",a-b);

    printf("Product = %.2f\n",a*b);

    printf("a/b = %.2f\n",a/b);

    }


    Output:


    Sum = 16.20

    Difference = 8.60

    Product = 47.12

    a/b = 3.26

    ```


    # 4.4 Mixed Mode Arithmetic


    When one operand is of integer type and the other is of floating type then the
    arithmetic operation with these operands is known as mixed mode arithmetic and
    the resulting value is float type.


    | Expression | Result |

    |----------|--------|

    | a+b | 14.5 |

    | a-b | 9.5 |

    | a*b | 30.0 |

    | a/b | 4.8 |


    Sometimes mixed mode arithmetic can help in getting exact results. For example
    the result of expression 5/2 will be 2, since integer arithmetic is applied. If
    we want exact result we can make one of the operand float type. For example 5.0/2
    or 5/2.0, both will give result 2.5.'
