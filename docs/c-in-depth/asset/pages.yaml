    # 8.10 Pointer to an Array


    In the previous section, we had a pointer that pointed to the 0th element of array.
    We can also declare a pointer that can point to the whole array instead of only
    one element of array. This pointer is useful when talking about multidimensional
    arrays. Now we''ll see how to declare a pointer to an array.


    int (*ptr)[10];


    Here ptr is pointer that can point to an array of 10 integers. Note that it is
    necessary to enclose the pointer name inside parentheses. Here the type of ptr
    is ''pointer to an array of 10 integers''.


    Note that the pointer that points to the 0th element of array and the pointer
    that points to the whole array are totally different. The following program shows
    this.


    ```

    /*P8.11 Program to understand difference between pointer to an integer and pointer
    to an array of integers*/

    #include<stdio.h>

    main()

    {

    int *p; /*Can point to an integer*/

