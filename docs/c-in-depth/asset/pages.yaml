    Now we''ll write a program to multiply two matrices. Multiplication of matrices
    requires that the number of columns in first matrix should be equal to the number
    of rows in second matrix. Each row of first matrix is multiplied with the column
    of the second matrix then added to get the element of resultant matrix. If we
    multiply two matrices of order m×n and n×p then the multiplied matrix will be
    of order m×p.


    ![](img/a76c706396af8b310f291a5313a27079_185_0.png)


    ```

    /*P7.13 Program for multiplication of two matrices*/

