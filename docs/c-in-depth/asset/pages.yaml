    \    ........\n}\n```\n\nHere switch, case and default are keywords. The \"expression\"\
    \ following the switch keyword can be any C expression that yields an integer\
    \ value. It can be value of any integer or character variable, or a function call\
    \ returning an integer, or an arithmetic, logical, relational, bitwise expression\
    \ yielding an integer. It can be any integer or character constant also. Since\
    \ characters are converted to their ASCII values, so we can also use characters\
    \ in this expression. Data types long int and short int are also allowed.\n\n\
    The constants following the case keywords should be of integer or character type.\
    \ They can be either constants or constant expressions. These constants must be\
    \ different from one another.\n\nWe can't use floating point or string constants.\
    \ Multiple constants in a single case are not allowed; each case should be followed\
    \ by only one constant.\n\nEach case can be followed by any number of statements.\
    \ It is also possible that a case has no statement under it. If a case is followed\
    \ by multiple statements, then it is not necessary to enclose them within pair\
    \ of curly braces, but it is not an error if we do so. The statements under case\
    \ can be any valid C statements like if else, while, for or even another switch\
    \ statement. Writing a switch statement inside another is called nesting of switches.\
    \ Now we'll see some valid and invalid ways of writing switch expressions and\
