    Here we are passing addresses of variables a and b in the function call. So the
    receiving formal arguments in the function declaration should be declared of pointer
    type. Whenever function ref() is called, two pointer to int variables, named p
    and q are created and they are initialized with the addresses of a and b. Now
    if we dereference pointers p and q, we will be able to access variables a and
    b from function ref ().


    The main() accesses the memory locations occupied by variables a and b by writing
    their names, while ref () accesses the same memory locations indirectly by writing
    *p, *q.


    ![](img/a76c706396af8b310f291a5313a27079_235_0.png)


    Before calling the function ref (), the value of a = 5 and b = 8. The value of
    actual arguments are copied to pointer variables p and q, and here the actual
    arguments are addresses of variables a and b. Since p contains address of variable
    a, so we can access variable a inside function by writing *p, similarly variable
    b can be accessed by writing *q.


    Now (*p)++ means value at address 2000 (which is 5 ) is incremented. Similarly
    (*q)++ means value at address 2002 (which is 8) is incremented. Now the value
    of *p = 6 and *q = 9. When we come back to main(), we see that the values of variable
    a and b have changed. This is because the function ref () knew the addresses of
    a and b, so it was able to access them indirectly.


    So in this way we could simulate call by reference by passing addresses of arguments.
    This method is mainly useful when the called function has to return more than
    one values to the function.


