- pgno: 518
  md: '# C and Assembly Interaction


    ```

    printf("Scan code of pressed key %x\n",getscancode());

    ```


    getscancode() function will be defined in asm program, so here it will be declared
    as extern to call this asm procedure in C program. This procedure name will be
    with ( _ ) underscore because for linking procedure in C this will be needed.
    Let us assume the memory model is small then our stack will be as-


    BP + 2 | Return

    BP | BP


    Since we are not passing any parameter, so only return value of function will
    be available in stack frame. See the asm procedure below-


    ```

    .MODEL SMALL

    .CODE

    PUBLIC _getscancode

    _getscancode PROC

    PUSH BP

    MOV BP, SP

    MOV AH, 0

    INT 16H

    POP BP

    RET

    _getscancode ENDP

    END

    ```


    Here this procedure will get the scan code of pressed key and it will return this
    value. Here procedure name is in small letters because C is case sensitive and
    it will search for label in small letters. But assembler makes all public variables
    in capital letters, so we should use -mx option of assembler, so the same case
    of public variable will be used. Now we can link the assembly procedure with C
    program as-


    ```

    d:\tasm -mx GET.ASM

    d:\tcc Main.c GET.obj

    ```


    We have seen how to call assembly procedure in C program, but there was no parameter
    in function. Now we will see how to pass parameter in C function and how it can
    be used in assembly procedure.


    Suppose we are calling one function ADDNUM in C program as-


    ```

    extern int ADDNUM(int,int);

    main()

    {

    int total,a=5,b=10;

    total=ADDNUM(a,b);

    }

    ```'
