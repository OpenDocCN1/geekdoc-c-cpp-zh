    {

    static int x=2,y=5;

    printf("x=%d,y=%d\n",x,y);

    x++; y++;

    }

    ```

    ```


    **Output:**

    x = 2, y = 5

    x = 3, y = 6

    x = 4, y = 7


    Note that the effect of initialization is seen only in the first call. In subsequent
