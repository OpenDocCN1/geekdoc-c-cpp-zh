- pgno: 15
  md: '# Chapter 1


    # Introduction to C


    Software is a collection of programs and a program is a collection of instructions
    given to the computer. Development of software is a stepwise process. Before developing
    a software, number of processes are done. The first step is to understand the
    user requirements. Problem analysis arises during the requirement phase of software
    development. Problem analysis is done for obtaining the user requirements and
    to determine the input and output of the program.


    For solving the problem, an "algorithm" is implemented. Algorithm is a sequence
    of steps that gives method of solving a problem. This "algorithm" creates the
    logic of program. On the basis of this "algorithm", program code is written. The
    steps before writing program code are as-


    ![](img/a76c706396af8b310f291a5313a27079_15_0.png)


    # Process of program development


    # 1.1 Design Methods


    Designing is the first step for obtaining solution of a given problem. The purpose
    of designing is to represent the solution for the system. It is really difficult
    to design a large system because the complexity of system cannot be represented
    easily. So various methods have been evolved for designing.


    # 1.1.1 Top-Down Design


    Every system has several hierarchies of components. The top-level component represents
    the whole system. Top-Down design method starts from top-level component to lowest
    level (bottom) component. In this design method, the system is divided into some
    major components.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Then each major component is divided into lower level components. Similarly
    other components are divided till the lowest level component.


    # 1.1.2 Bottom-Up Design


    Bottom-Up design method is the reverse of Top-Down approach. It starts from the
    lowest level component to the highest-level component. It first designs the basic
    components and from these basic components the higher-level components are designed.


    # 1.1.3 Modular Approach


    It is better to divide a large system into modules. In terms of programming, module
    is logically a well-defined part of program. Each module is a separate part of
    the program. It is easy to modify a program written with modular approach because
    changes in one module don''t affect other modules of program. It is also easy
    to check bugs in the program in module level programming.


    # 1.2 Programming Languages


    Before learning any language, it is important to know about the various types
    of languages and their features. It is interesting to know what were the basic
    requirements of the programmers and what difficulties they faced with the existing
    languages. The programming languages can be classified into two types-


    +   1. Low level languages

    +   2. High level languages


    # 1.2.1 Low Level Languages


    The languages in this category are the Machine level language and Assembly language.


    # 1.2.1.1 Machine Level Language


    Computers can understand only digital signals, which are in binary digits i.e.
    0 and 1. So the instructions given to the computer can be only in binary codes.
    The machine language consists of instructions that are in binary 0 or 1. Computers
    can understand only machine level language. Writing a program in machine level
    language is a difficult task because it is not easy for programmers to write instructions
    in binary code. A machine level language program is error-prone and its maintenance
    is very difficult. Furthermore machine language programs are not portable. Every
    computer has its own machine instructions, so the programs written for one computer
    are not valid for other computers.


    # 1.2.1.2 Assembly Language


    The difficulties faced in machine level language were reduced to some extent by
    using a modified form of machine level language called assembly language. In assembly
    language instructions are given in English like words, such as MOV, ADD, SUB etc.
    So it is easier to write and understand assembly programs Since a computer can
    understand only machine level language, hence assembly language program must be
    translated into machine language. The translator that is used for translating
    is called "assembler" Although writing programs in assembly language is a bit
    easier, but still the programmer has to know all the low level details related
    with the hardware of a computer. In assembly language, data is stored in computer
    registers and each computer has different set of registers. Hence the assembly
    language program is also not portable. Since the low level languages are related
    with the hardware, hence the execution of a low-level program is faster.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# # Introduction to C


    # # 1.2.2 High-Level Languages


    High-level languages are designed keeping in mind the features of portability
    i.e. these languages are machine independent. These are English like languages,
    so it is easy to write and understand the programs of high-level language. While
    programming in a high level language, the programmer is not concerned with the
    low level details, and so the whole attention can be paid to the logic of the
    problem being solved. For translating a high-level language program into machine
    language, compiler or interpreter is used. Every language has its own compiler
    or interpreter. Some languages in this category are- FORTRAN, COBOL, BASIC, Pascal
    etc.


    # # 1.3 Translators


    We know that computers can understand only machine level language, which is in
    binary 1 or 0. It is difficult to write and maintain programs in machine level
    language. So the need arises for converting the code of high-level and low-level
    languages into machine level language and translators are used for this purpose.
    These translators are just computer programs, which accept a program written in
    high level or low-level language and produce an equivalent machine language program
    as output. The three types of translators used are-


    +   - Assembler

    +   - Compiler

    +   - Interpreter


    Assembler is used for converting the code of low-level language (assembly language)
    into machine level language.


    Compilers and interpreters are used to convert the code of high-level language
    into machine level language. The high level program is known as source program
    and the corresponding machine language program is known as object program. Although
    both compilers and interpreters perform the same task but there is a difference
    in their working.


    A compiler searches all the errors of program and lists them. If the program is
    error free then it converts the code of program into machine code and then the
    program can be executed by separate commands. An interpreter checks the errors
    of program statement by statement. After checking one statement, it converts that
    statement into machine code and then executes that statement. This process continues
    until the last statement of program or an erroneous statement occurs.


    # # 1.4 History Of C


    In earlier days, every language was designed for some specific purpose. For example
    FORTRAN (Formula Translator) was used for scientific and mathematical applications,
    COBOL (Common Business Oriented Language) was used for business applications.
    So need of such a language was felt which could withstand most of the purposes.
    “Necessity is the mother of invention”. From here the first step towards C was
    put forward by Dennis Ritchie.


    The C language was developed in 1970''s at Bell laboratories by Dennis Ritchie.
    Initially it was designed for programming in the operating system called UNIX.
    After the advent of C, the whole UNIX operating system was rewritten using it.
    Now almost the entire UNIX operating system and the tools supplied with it including
    the C compiler itself are written in C.


    The C language is derived from the B language, which was written by Ken Thompson
    at AT&T Bell laboratories. The B language was adopted from a language called BCPL
    (Basic Combined Programming Language), which was developed by Martin Richards
    at Cambridge University.'
  merge: -1
  img_proc: true
- pgno: 18
  md: "In 1982 a committee was formed by ANSI (American National Standards Institute)\
    \ to standardize the C language. Finally in 1989, the standard for C language\
    \ was introduced known as ANSI C. Generally most of the modern compilers conform\
    \ to this standard.\n\n# 1.5 Characteristics of C\n\nIt is a middle level language.\
    \ It has the simplicity of a high level language as well as the power of low level\
    \ language. This aspect of C makes it suitable for writing both application programs\
    \ and system programs. Hence it is an excellent, efficient and general-purpose\
    \ language for most of the application such as mathematical, scientific, business\
    \ and system software applications.\n\nC is small language, consisting of only\
    \ 32 English words known as keywords (if, else, for, break etc.). The power of\
    \ C is augmented by the library functions provided with it. Moreover, the language\
    \ is extendible since it allows the users to add their own library functions to\
    \ the library.\n\nC contains control constructs needed to write a structured program\
    \ hence it is considered a structure programming language. It includes structures\
    \ for selection (if...else, switch), repetition (while, for, do...while) and for\
    \ loop exit (break).\n\nThe programs written in C are portable i.e. programs written\
    \ for one type of computer or operating system can be run on another type of computer\
    \ or operating system.\n\n# 1.6 Structure of a C Program\n\nC program is a collection\
    \ of one or more functions. Every function is a collection of statements and performs\
    \ some specific task. The general structure of C program is-\n\n```\nComments\n\
    Preprocessor directives\nGlobal variables\nmain( ) function\n{\n    local variables\n\
    \    statements\n    ........\n}\nfunc1( )\n{\n    local variables\n    statements\n\
    \    ........\n}\nfunc2( )\n{\n    local variables\n    statements\n    ........\n\
    }\n```\n\nComments can be placed anywhere in a program and are enclosed between\
    \ the delimiters /* and */. Comments are generally used for documentation purposes."
