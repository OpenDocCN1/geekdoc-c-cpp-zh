  md: "# Chapter 6\n\n# Functions\n\nA function is a self-contained subprogram that\
    \ is meant to do some specific, well-defined task. A ( program consists of one\
    \ or more functions. If a program has only one function then it must be th main(\
    \ ) function.\n\n# 6.1 Advantages Of Using Functions\n\n+   1. Generally a difficult\
    \ problem is divided into sub problems and then solved. This divide and conqu\
    \ technique is implemented in C through functions. A program can be divided into\
    \ functions, eac of which performs some specific task. So the use of C functions\
    \ modularizes and divides the wor of a program.\n+   2. When some specific code\
    \ is to be used more than once and at different places in the progran the use\
    \ of functions avoids repetition of that code.\n+   3. The program becomes easily\
    \ understandable, modifiable and easy to debug and test. It become simple to write\
    \ the program and understand what work is done by each part of the program\n+\
    \   4. Functions can be stored in a library and reusability can be achieved.\n\
    \nC programs have two types of functions-\n\n+   1. Library functions\n+   2.\
    \ User-defined functions\n\n# 6.2 Library Functions\n\nC has the facility to provide\
    \ library functions for performing some operations. These functions are prese\
    \ in the C library and they are predefined. For example sqrt( ) is a mathematical\
    \ library function whi is used for finding out the square root of any number.\
    \ The functions scanf( ) and printf( ) are inp output library functions. Similarly\
    \ we have functions like strlen( ), strcmp( ) for string manipulatio\n\nTo use\
    \ a library function we have to include corresponding header file using the preprocessor\
    \ directi #include. For example to use input output functions like printf( ),\
    \ scanf( ) we have to include stdio. for mathematical library functions we have\
    \ to include math.h, for string library string .h should included. The following\
    \ program illustrates the use of library function sqrt( ).\n\n```\n/*P6.1 Program\
    \ to find the square root of any number.*/\n#include<stdio.h>\n#include<math.h>\n\
    main()\n{\n    double n,s;\n    printf(\"Enter a number : \");\n```"
