    # 7.1.4 Initialization of 1-D Array


    After declaration, the elements of a local array have garbage value while the
    elements of global and static arrays are automatically initialized to zero. We
    can explicitly initialize arrays at the time of declaration.


    The syntax for initialization of an array is-


    ```

    data_type array_name[size]={value1, value2........valueN };

    ```


    Here array_name is the name of the array variable, size is the size of the array
    and value1, value2, ........valueN are the constant values known as initializers,
    which are assigned to the array elements one after another. These values are separated
    by commas and there is a semicolon after the ending braces. For example-


    ```

    int marks[5] = {50, 85, 70, 65, 95};

    ```


    The values of the array elements after this initialization are-

    marks[0] : 50, marks[1] : 85, marks[2] : 70, marks[3] : 65, marks[4] : 95


    While initializing 1-D arrays, it is optional to specify the size of the array.
    If the size is omitted during initialization then the compiler assumes the size
    of array equal to the number of initializers. For example-


    ```

    float sal[] = { 99, 78, 50, 45, 67, 89};

    ```


    Here the size of array marks is assumed to be 6 and that of sal is assumed to
    be 3.


    If during initialization the number of initializers is less than the size of array
    then, all the remaining elements of array are assigned value zero. For example-


    ```

    int marks[5] = { 99, 78};

    ```


    Here the size of array is 5 while there are only 2 initializers. After this initialization
    the value of the elements are-

    marks[0] : 99, marks[1] : 78, marks[2] : 0, marks[3] : 0, marks[4] : 0


    So if we initialize an array like this-


    ```

    int arr[100] = {0};

    ```


    then all the elements of arr will be initialized to zero.


    If the number of initializers is more than the size given in brackets then compiler
    will show an error. For example-


    ```

    int arr[5] = {1, 2, 3, 4, 5, 6, 7, 8}; /*Error*/

    ```


    We can''t copy all the elements of an array to another array by simply assigning
    it to the other array. For example if we have two arrays a[5] and b[5] then


    ```

    int a[5] = {1, 2, 3, 4, 5};

    int b[5];

    b = a; /*Not valid*/

