  md: 'to the left of the middle element and the other one consists of all the elements
    on the right side of the element. Since the array is sorted, all the elements
    in the left portion will be smaller than the middle element and the elements in
    the right portion will be greater than the middle element. Now if the item to
    be searched is less than the middle element then we search it in the left portion
    of the array and if it is greater than the middle element then search will be
    in the right portion of the array.


    Now we will take one portion only for search and compare the item with middle
    element of that portion. This process will continue until we find the required
    item or middle element has no left or right portion to search.


    To implement this procedure we will take 3 variables viz. low, up and mid that
    will keep track of the status of lower limit, upper limit and middle value of
    that portion of the array, in which we will search the element. The value of the
    mid will be calculated as- mid = ( low+up) / 2


    +   - If item > arr[mid], search will resume in right portion

    +     low = mid+1 , up will remain same

    +   - If item < arr[mid] , search will resume in left portion

    +     up = mid-1, low will remain same

    +   - If item = = arr[mid] , search is successful

    +     item found at mid position

    +   - If low > up , search is unsuccessful

    +     item not found in array


    Let us take a sorted array of 10 elements. Suppose the element that we are searching
    is 49. The portion of array in which the element is searched is shown with a bold
    boundary in the figure.


    ![](img/a76c706396af8b310f291a5313a27079_191_0.png)


    Now let us take a case where the search fails. Suppose we are searching the element
    16 that is not present in the array.'
