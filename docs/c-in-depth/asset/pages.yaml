    \ name. The second argument represents the mode in which the file is to be opened.\
    \ The possible val of mode are-\n\n+   1. \"w\" ( write )\n+   If the file doesn't\
    \ exist then this mode creates a new file for writing, and if the file already\
    \ exists th the previous data is erased and the new data entered is written to\
    \ the file.\n+   \n+   2. \"a\" ( append )\n+   If the file doesn't exist then\
    \ this mode creates a new file, and if the file already exists then the n data\
    \ entered is appended at the end of existing data. In this mode, the data existing\
    \ in the file is erased as in \"w\" mode.\n+   \n+   3. \"r\" ( read )\n+   This\
    \ mode is used for opening an existing file for reading purpose only. The file\
    \ to be opened m exist and the previous data of file is not erased.\n+   \n+ \
    \  4. \"w+\" ( write+read )\n+   This mode is same as \"w\" mode but in this mode\
    \ we can also read and modify the data. If the doesn't exist then a new file is\
    \ created and if the file exists then previous data is erased.\n+   \n+   5. \"\
    r+\" ( read+write )\n+   This mode is same as \"r\" mode but in this mode we can\
    \ also write and modify existing data. The to be opened must exist and the previous\
    \ data of file is not erased. Since we can add new data modify existing data so\
    \ this mode is also called update mode."
