- pgno: 448
  md: "# Chapter 14\n\n# Miscellaneous Features In C\n\n# 14.1 Enumeration\n\nWords\
    \ speak more than numbers and this is the reason for the inclusion of enumerated\
    \ data types in C. Sometimes the replacement of integer constants like 1, 2 3\
    \ by some meaningful and descriptive names, enhances the readability of the code\
    \ and makes it self documenting. For example suppose we are making a date related\
    \ program, then it would be better if we could use names like Jan, Feb, Mar, Apr\
    \ instead of the numbers 1, 2, 3, 4.\n\nAn enumeration type is a user defined\
    \ data type, which can take values only from a user defined list of named integer\
    \ constants called enumerators. The syntax of defining an enumeration data type\
    \ is same as that of structure or union. The general format of definition is-\n\
    \n```\nenum tag{\n    member1;\n    member2;\n    .......\n    .......\n};\n```\n\
    \nHere enum is a keyword, tag is an identifier that specifies the name of the\
    \ new enumeration type being defined, and member1, member2 are identifiers which\
    \ represent integer constants and are called enumerator constants or enumerators.\
    \ The list of these enumerators is called enumerator list. Note that like structure\
    \ and union, here the members inside the braces are not variables, they are named\
    \ integer constants.\n\nFrom the definition, we can declare variables of this\
    \ new data type as-\n\n```\nenum tag var1, var2, var3;\n```\n\nHere var1, var2,\
    \ var3 are variables of type enum tag. These variables can take values only from\
    \ the enumerator list.\n\nThe variables can also be declared with the definition\
    \ as-\n\n```\nenum tag {\n    member1;\n    member2;\n    .......\n    .......\n\
    }var1, var2, var3;\n```\n\nHere the tag is optional. Let us take an example-\n\
    \n```\nenum month{ Jan, Feb, Mar, Apr, May, Jun };\n```"
  merge: -1
  img_proc: true
