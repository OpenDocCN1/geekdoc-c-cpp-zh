    \n```\n/*P11.4 Program to understand the use of getw() function*/\n#include<stdio.h>\n\
    main()\n{\n    FILE *fptr;\n    int value;\n    fptr=fopen(\"num.dat\",\"rb\"\
    );\n    while((value=getw(fptr))!=EOF)\n        printf(\"%d\\t\",value);\n   \
    \ fclose(fptr);\n}\n```\n\nThis program will read and print integers from the\
    \ file \"num.dat\" which was created earlier.\n\nIf getw() is used with text files\
    \ then it will stop reading if integer 26 is present in the file because in text\
    \ files end of file is denoted by ASCII 26 which is also a valid integer value.\
    \ So getw() should not be used with text files.\n\nThe value of EOF is -1 which\
    \ is a valid integer value, so this program will work correctly if -1 is not present\
