- pgno: 267
  md: '# Chapter 9

    Strings


    There is no separate data type for strings in C. They are treated as arrays of
    type char. A character array is a string if it ends with a null character( ''\0''
    ). This null character is an escape sequence with ASCII value 0. Strings are generally
    used to store and manipulate data in text form like words or sentences.




    A string constant is a sequence of characters enclosed in double quotes. It is
    sometimes called a literal. The double quotes are not a part of the string. Some
    examples of string constants are-


    +   "Taj Mahal"

    +   "2345"

    +   "Subhash Chandra Bose was a great leader"

    +   "" (Null string, contains only ''\0'')

    +   "My age is %d and height is %f\n" (Control string used in printf)


    Whenever a string constant is written anywhere in a program, it is stored somewhere
    in memory as an array of characters terminated by a null character(''\0''). The
    string constant itself becomes a pointer to the first character in the array.
    For example the string "Taj Mahal" will be stored in memory as-


    | 1000 | 1001 | 1002 | 1003 | 1004 | 1005 | 1006 | 1007 | 1008 | 1009 |

    |------|------|------|------|------|------|------|------|------|------|

    | T    | a    | j    |   | M    | a    | h    | a    | l    | \0   |


    Each character occupies one byte and compiler automatically inserts the null character
    at the end. The string constant "Taj Mahal" is actually a pointer to the character
    ''T''. So whenever a string constant is used in the program it is replaced by
    a pointer pointing to the string.


    If we have a pointer variable of type char *, then we can assign the address of
    this string constant to it as-


    char *p = "Taj mahal";


    ```

    char *p = "Taj mahal";

    ```


    Similarly when we write:


    printf("Subhash Chandra Bose\n");


    then actually a pointer to character(char *) is passed to the printf() function.


    If identical string constants are used in a program, they will be stored separately
    at different memory locations.'
