  md: "# Pointers\n\n\n\n```\nvoid *calloc(size_t n, size_t size);\n```\n\nThe calloc()\
    \ function is used to allocate multiple blocks of memory. It is somewhat similar\
    \ to malloc() function except for two differences. The first one is that it takes\
    \ two arguments. The first argument specifies the number of blocks and the second\
    \ one specifies the size of each block. For example- This allocates 5 blocks of\
    \ memory, each block contains 2 bytes and the starting address is stored in the\
    \ pointer variable ptr, which is of type int. An equivalent malloc() call would\
    \ be- ptr = (int *) malloc ( 5 * sizeof(int) );\n\nHere we have to do the calculation\
    \ ourselves by multiplying, but calloc() function does the calculation for us.\n\
    \nThe other difference between calloc() and malloc() is that the memory allocated\
    \ by malloc() contains garbage value while the memory allocated by calloc() is\
    \ initialized to zero. But this initialization by calloc() is not very reliable,\
    \ so it is better to explicitly initialize the elements whenever there is need\
    \ to do so.\n\nLike malloc(), calloc() also returns NULL if there is not sufficient\
    \ memory available in the heap.\n\n\n\n```\nvoid *realloc(void *ptr, size_t newsize);\n\
    ```\n\nWe may want to increase or decrease the memory allocated by malloc() or\
    \ calloc(). The function realloc() is used to change the size of the memory block.\
    \ It alters the size of the memory block without losing the old data. This is\
    \ known as reallocation of memory.\n\nThis function takes two arguments, first\
    \ is a pointer to the block of memory that was previously allocated by malloc()\
    \ or calloc() and second one is the new size for that block. For example- ptr\
    \ = (int *) realloc ( ptr, size );\n\nThis statement allocates the memory of the\
    \ specified size and the starting address of this memory block is stored in the\
    \ pointer variable ptr. If we want to change the size of this memory block, then\
    \ we can use realloc() as- ptr = (int *) realloc ( ptr, newsize );\n\nThis statement\
    \ allocates the memory space of newsize bytes, and the starting address of this\
    \ memory block is stored in the pointer variable ptr. The newsize may be smaller\
    \ or larger than the old size. If the newsize is larger, then the old data may\
    \ not be lost and the newly allocated bytes are uninitialized. The starting address\
    \ contained in ptr may change if there is not sufficient memory at the old address\
    \ to store all the bytes consecutively. This function moves the contents of old\
    \ block into the new block and the data of the old block is not lost. On failure,\
    \ realloc() returns NULL.\n\n```\n/*P8.29 program to understand the use of realloc()\
    \ function*/\n#include<stdio.h>\n#include<stdlib.h>\nmain()\n{\n\tint i,*ptr;\n\
    \tptr=(int *)malloc(5*sizeof(int));\n\t// more code here\n```"
