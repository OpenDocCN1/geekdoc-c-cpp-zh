  md: "```\nrec();\n.....\n}\nrec()\n{\n.....\nrec();   // recursive call\n.....\n\
    }\n```\n\nHere rec() is called inside the body of function rec(). There should\
    \ be a terminating condition to stop recursion, otherwise rec() will keep on calling\
    \ itself infinitely and will never return.\n\n```\nrec()\n{\n    if(...) /*terminating\
    \ condition*/\n    .....\n    rec();\n}\n```\n\nBefore writing a recursive function\
    \ for a problem we should consider these points-\n\n+   1. We should be able to\
    \ define the solution of the problem in terms of a similar type of smaller problem.\
    \ At each step we get closer to the final solution of our original problem.\n\
    +   2. There should be a terminating condition to stop recursion.\n\nNow we will\
    \ take some problems and write recursive functions for solving them.\n\n+   (i)\
    \ Factorial\n+   (ii) Power\n+   (iii) Fibonacci numbers\n+   (iv) Tower of hanoi\n\
    \nWe know that the factorial of a positive integer n can be found out by multiplying\
    \ all integers from 1 to n.\nn! = 1 * 2 * 3 * ........ * (n-1) * n\nThis is the\
    \ iterative definition of factorial and in the previous chapter we had written\
    \ a program to compute factorial using loop. Now we'll try to find out the recursive\
    \ definition of factorial.\n\nWe know that 6! = 6*5*4*3*2*1\nWe can write it as-\
    \ 6! = 6 * 5!\nSimilarly we can write 5! = 5*4!\nSo in general we can write n!\
    \ = n * (n-1)!\nNow problem of finding out factorial of (n-1) is similar to that\
    \ of finding out factorial of n, but it is definitely smaller in size. So we have\
    \ defined the solution of factorial problem in terms of itself. We know that the\
    \ factorial of 0 is 1. This can act as the terminating condition. So the recursive\
    \ definition of factorial can be written as-"
