    \ to variables also, but why is the pointer name enclosed in parentheses. Let\
    \ us remove the parentheses and see.\n\n```\nfloat *fp(int );\n```\n\nHow would\
    \ you declare a function returning a pointer to float and taking an int value?\
    \ Well exactly in the same manner as above. So in this declaration fp is declared\
    \ to be a function rather than a pointer and this happened because parentheses\
    \ have higher precedence than * operator. This is the reason for enclosing the\
    \ pointer name inside parentheses.\n\nNow we have learnt how to declare a pointer\
