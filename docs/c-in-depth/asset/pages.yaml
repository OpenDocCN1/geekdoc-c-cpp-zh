  md: 'Here a new data type month is defined and the enumerator list contains six
    enumerators.

    Internally the compiler treats these enumerators as integer constants. These are
    automatically assigned integer values beginning from 0, 1, 2... etc till the last
    member of the enumeration. In the above example these enumerators will take following
    values-


    Jan 0

    Feb 1

    Mar 2

    Apr 3

    May 4

    Jun 5


    These are the default values assigned to the enumerators. It is also possible
    to explicitly assign value to enumerators but in this case, the successive unassigned
    enumerators will take values one greater than the value of the previous enumerator.
    For example-


    ```

    enum month{ Jan, Feb = 4, Mar, Apr, May = 11, Jun };

    ```


    Now the enumerators will take following values-


    Jan 0

    Feb 4

    Mar 5

    Apr 6

    May 11

    Jun 12


    We can assign any signed integer value to enumerators, provided the value is within
    the range of

    It is also possible to assign same value to more than one enumerator.


    ```

    enum month{ Jan, January = 0, Feb = 1, February = 1, Mar = 2, March = 2 };

    ```


    The enumerated variables can be processed like other integer variables. We can
    assign values to them from the enumerator list or they can be compared to other
    variables and values of the same type. For example-


    ```

    enum month{ Jan, Feb, Mar, Apr, May, Jun } m1, m2;

    m1 = Mar;

    m2 = May;

    ```


    Now m1 has integer value 2 and m2 will take the value 4.

    Any variable of type enum month can take values only from the 6 enumerators specified
    in the

    For example this is invalid-

    m1 = Dec; /*Invalid*/

