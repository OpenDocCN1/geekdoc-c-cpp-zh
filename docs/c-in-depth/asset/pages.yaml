    # 14.7 volatile


    Whenever a variable is encountered in the program, compiler reads the value of
    that variable from the memory. But sometimes for optimization purposes the compiler
    stores the value of the currently used variable in any unused register. Now when
    that variable is encountered next time in the program and the compiler sees that
    the program has not changed value of the variable, it reads the value from the
    register instead of the memory. This process saves time since accessing a register
    is faster than accessing memory.


    This sort of automatic optimization by the compiler may sometimes lead to incorrect
    results. This generally happens when the value of a variable can be modified by
    some external process outside the program. These types of situations arise when
    we have memory mapped I/O, variables shared among multiple processes or variables
    that can be modified by interrupt routines.


    For example suppose we have a variable time that represents current system time
    and its value is controlled by the system clock. Now consider this loop- while(
    time != T ) /* Do nothing till value of variable time equals T*/'
