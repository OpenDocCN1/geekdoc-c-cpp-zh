- pgno: 210
  md: '# Chapter 8

    Pointers


    C is a very powerful language and the real power of C lies in pointers. The concept
    of pointers is interesting as well as challenging. It is very simple to use pointers
    provided the basics are understood thoroughly. So it is necessary to visualize
    every aspect of pointers instead of just having a superficial knowledge about
    their syntax and usage. The use of pointers makes the code more efficient and
    compact. Some of the uses of pointers are-


    +   1. Accessing array elements.

    +   2. Returning more than one value from a function.

    +   3. Accessing dynamically allocated memory.

    +   4. Implementing data structures like linked lists, trees, and graphs.




    Before studying pointers it is important to understand how memory is organized
    in a computer. The memory in a computer is made up of bytes arranged in a sequential
    manner. Each byte has an index number, which is called the address of that byte.
    The address of these bytes start from zero and the address of last byte is one
    less than the size of memory. Suppose we have 64 MB of RAM, then memory will consist
    of 64 * 2^20 = 67108864 bytes. The address of these bytes will be from 0 to 67108863


    ![](img/a76c706396af8b310f291a5313a27079_210_0.png)


    We have studied that it is necessary to declare a variable before using it, since
    compiler has to reserve space for it. The data type of the variable also has to
    be mentioned so that the compiler knows how much space needs to be reserved. Now
    let us see what happens when we declare a variable. Suppose we declare a variable
    age of type int.


    ```

    int age;

    ```


    The compiler reserves 2 consecutive bytes from memory for this variable and associates
    the name age with it. The address of first byte from the two allocated bytes is
    known as the address of variable age.'
