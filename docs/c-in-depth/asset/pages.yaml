    \ variables are stored in memory while register variables are stored in CPU registers.\
    \ Registers are small storage units present in the processor. The variables stored\
    \ in registers can be accessed much faster than the variables stored in memory.\
    \ So the variables that are frequently used can be assigned register storage class\
    \ for faster processing. For example the variables used as loop counters may be\
    \ declared as register variables since they are frequently used.\n\n```\n/*P14.8\
