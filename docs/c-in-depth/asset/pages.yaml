    # 4.8 Logical Or Boolean Operators


    An expression that combines two or more expressions is termed as a logical expression.
    For combining these expressions we use logical operators. These operator return
    0 for false and 1 for true. The operands may be constants, variables or expressions.
    C has three logical operators.


    | Operator | Meaning |

    |---|---|

    | && | AND |

    | || | OR |

    | ! | NOT |


    Here logical NOT is a unary operator while the other two are binary operators.
    Before studying these operators let us understand the concept of true and false.
    In C any non-zero value is regarded as true and zero is regarded as false.


    # 4.8.1 AND ( && ) Operator


    This operator gives the net result true if both the conditions are true, otherwise
    the result is false.


    # Boolean Table


    | Condition1 | Condition2 | Result |

    |---|---|---|

    | False | False | False |

    | False | True | False |

    | True | False | False |

    | True | True | True |


    Let us take three variables a = 10, b = 5, c = 0


    Suppose we have a logical expression-

    (a == 10) && (b < a)


    Here both the conditions a == 10 and b < a are true, and hence this whole expression
    is true. Since the logical operators return 1 for true hence the value of this
    expression is 1.


    | Expression |  | Result | Value of expression |

    |---|---|---|---|

    | (a ==10) && (b>a) | true && false | false | 0 |

    | (b>=a) && (b==3) | false && false | false | 0 |

    | a && b | true && true | true | 1 |

    | a && c | true && false | false | 0 |'
