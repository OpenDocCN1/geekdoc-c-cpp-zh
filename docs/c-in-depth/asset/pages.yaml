  md: '# Output:


    I understand the use of #define


    The C preprocessor searches for the macro name MSSG and substitutes the message
    "I understand the use of #define\n" in the printf ().


    We have many macro expansions of any sort. Here are some more examples-


    ```

    #define AND &&

    #define OR ||

    #define BEGIN main(){

    #define END }

    #define INFINITE while( 1 )

    #define NEW_LINE printf("\n");

    #define ERROR printf("An error has occurred\n");

    ```


    There is a semicolon in the last two directives. This semicolon is just a part
    of the macro_expansion. Now whenever we write NEW_LINE or ERROR in the program,
    they will be replaced by printf calls and the terminating semicolon.


    Remember that the C preprocessor will simply replace the macro_name with the macro_expansion
    and the macro_expansion can be any text. So it is our responsibility to see that
    after replacement the resulting code is valid in C. For example if we define a
    macro MAX like this-


    ```

    #define MAX 5;

    ```


    Now consider this declaration statement-


    ```

    int arr[MAX];

    ```


    This will be translated by the preprocessor as-


    ```

    int arr[5];

    ```


    and this is not valid in C.


    If the macro_name appears inside a character constant, string constant or a comment
    then it is not replaced and is left as it is. For example-


    ```

    #define SUN 2

    #define WINDOWS 3

    printf("Rays of SUN are coming through the WINDOWS");

    ```


    Here the replacement will not take place inside the string.


    It is also possible to define a macro without any macro expansion. For example-


    ```

    #define TEST

    ```


    This is used in compilation directives where the preprocessor only needs to know
    whether the macro has been defined or not.


    # 12.2 Macros with Arguments


    The #define directive can also be used to define macros with arguments. The general
    syntax is-


    ```

    #define macro_name(arg1, arg2, .....) macro_expansion

    ```'
