  md: "# Functions\n\nIn P6.3 the function definition is-\n\n```\nint sum(int x,int\
    \ y)\n{\n int s;\n s=x+y;\n return s;\n}\n```\n\nThis function returns a value\
    \ of type int because int is written at the place of return_type. This function\
    \ takes two formal arguments x and y, both type int. The variable s is declared\
    \ inside the function so it is a local variable. The formal arguments x and y\
    \ are also used as local variables inside this function.\n\n\n\nThe function definition\
    \ describes what a function can do, but to actually use it in the program the\
    \ function should be called somewhere. A function is called simply by writing\
    \ its name followed by the argument list inside the parentheses. func_name(arg1,\
    \ arg2, arg3...) These arguments arg1, arg2, ... are called actual arguments.\
    \ Here func_name is known as the called function while the function in which this\
    \ function call is placed is known as the calling function. For example in the\
    \ program P6.3, main() is the calling function, sum() is the called function and\
    \ a, b are actual arguments. The function call is written on the right hand side\
    \ as- s = sum(a, b);\n\nEven if there are no actual arguments the function call\
    \ should have the empty parentheses. For example in program P6.2, the function\
    \ call is written as- drawline( );\n\nWhen a function is called, the control passes\
    \ to the called function, which is executed and after this the control is transferred\
    \ to the statement following the function call in the calling function. The following\
    \ figure shows the transfer of control when two functions func1() and func2()\
    \ are called from main().\n\n![](img/a76c706396af8b310f291a5313a27079_127_0.png)"
