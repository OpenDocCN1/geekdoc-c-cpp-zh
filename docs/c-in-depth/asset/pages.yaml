  md: '# Chapter 15


    # Building project and creation of library


    We have studied about C language, now we''ll come to the real life problems and
    see how we can solve them step by step. Here we will use our C program to develop
    one real life project with whole software life cycle of project. This will give
    you an idea of developing a full project in C. We will develop this project in
    Turbo C as well as in Unix. Also we will see how to develop a library and use
    the functions of this library in different programs.


    The project that we are going to make is related with date. Date related operations
    are of great importance in many applications. Most of the application projects
    require date related manipulations. So our aim is to develop a project in C, which
    will perform all date related manipulations. Now we will go step by step in different
    phases of software development life cycle for developing this project. These phases
    are as-


    +   1. Requirement analysis

    +   2. Top level design

    +   3. Detail design

    +   4. Coding

    +   5. Testing


    # 15.1 Requirement Analysis


    First step is requirement analysis. Here we think about requirement of our project
    by analyzing different manipulation of dates. We know very well what are the operations
    that are needed with date, as well as different attributes of date. So after analyzing
    we came up with a document that gives all the requirement of the project. This
    is called as SRS(Software Requirement Specification).


    +   1. Given date is valid or invalid.

    +   2. Day of week from a given date.

    +   3. Comparing two dates.

    +   4. Difference of two dates in days.

    +   5. Difference of two dates in years, months and days.

    +   6. Add years to a given date.

    +   7. Subtract years from a given date.

    +   8. Add months to a given date.

    +   9. Subtract months from a given date.

    +   10. Add days to a given date.

    +   11. Subtract days from a given date.'
