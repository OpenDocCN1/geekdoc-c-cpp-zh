  md: 'division or multiplication with the number, which is power of 2 as-


    ```

    a = a * 8 ( 8 is 2³ )

    a = a / 8 ( 8 is 2³ )

    ```


    The second way to perform the same operation is by using left shift << for multiplication
    operation and right shift >> for division operation. This can be done as-


    ```

    a = a << 3 (or a = a * 2³ )

    a = a >> 3 (or a = a / 2³ )

    ```


    So,

    a << b is equivalent to a * 2^b and

    a >> b is equivalent to a / 2^b


    These bit operations will be much faster than multiplication and division operations.
    For simple operations, the compiler may automatically optimize the code but in
    case of complex expressions it is always advised to use bit operations, which
    is more effective optimization.


    Suppose we want to multiply by 6 then it can be written as-


    ```

    a = a << 1 + a << 2;

    ```


    Compiler can not optimize this code so we should always make habit of writing
    optimized code without thinking that it can be optimized by compiler or not.


    # 16.5 Simplifying Expressions


    Sometimes we can reduce some operations by simplifying expressions. Let us see
    a simple example-


    ```

    x * y + y *4

    ```


    This can be simplified as-


    ```

    ( x + 4 ) * y

    ```


    This will reduce one multiplication operation.


    # 16.6 Declare prototypes for Functions


    We should always declare prototype for functions. This will tell the compiler
    about functions and it can be helpful for compiler to optimize the code.


    # 16.7 Better Way Of Calling Function


    We know that calling a function means a stack will be setup with parameters of
    functions, so we should always try to reduce the parameter of functions, which
    can improve the stack mechanism. It will be better to use pointer instead of passing
    structure or big array, which can be overhead for stack and can decrease the efficiency
    of program.


    # 16.8 Prefer int to char or short


    We should always prefer int to char because C performs all operations of char
    with integer. In all operations like passing char to a function or any arithmetic
    operation, first char will be converted into integer and after completion of operation
    it will again be converted into char. For a single char this may not affect efficiency
    but suppose same operation is performed 100 times in a loop then it can decrease
    the efficiency of program.'
