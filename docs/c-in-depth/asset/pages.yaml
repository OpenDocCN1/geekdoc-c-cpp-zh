    ```\n\n# 13.10 Bit Fields\n\nWe have seen how to access and manipulate individual\
    \ bits or group of bits using bitwise operators. Bit fields provide an alternative\
    \ method of accessing bits. A bit field is a collection of adjacent bits is defined\
    \ inside a structure but is different from other members because its size is specified\
    \ in terms of bits. The data type of a bit field can be int, signed int or unsigned\
    \ int.\n\nLet us take an example that shows the syntax of defining bit fields.\n\
    \n```\nstruct tag {\n    unsigned a:2;\n    unsigned b:5;\n    unsigned c:1;\n\
    \    unsigned d:3;\n};\n```\n\nHere the structure has four bit fields a, b, c\
    \ and d. The sizes of a, b, c and d are 2, 5, 1 and 3 respectively. The bit fields\
    \ can be accessed like other members of the structure using the dot operator.\
    \ Whenever they appear inside expressions, they are treated like integers(of smaller\
    \ range). The following are some valid expressions using bit fields.\n\n```\n\
    struct tag var;\nvar.a=2;\nprintf(\"%d\",var.b);\nx=var.a+var.b;\nif(var.c==1)\n\
    \    printf(\"Flag is on\\n\");\n```\n\nIf the size of a bit field is n, then\
    \ the range of values that the bit field can take is from 0\n\n| Bit field | Size\
    \ in bits | Range of values |\n|---|---|---|\n| a | 2 | 0 to 2^2-1 (0 to 3) |\n\
    | b | 5 | 0 to 2^5-1 (0 to 31) |\n| c | 1 | 0 to 2^1-1 (0 and 1) |\n| d | 3 |\
    \ 0 to 2^3-1 (0 to 7) |\n\nIt would be invalid to assign any value to a bitfield\
    \ outside its range, for example-\n\n```\nvar.b = 54;  /*Invalid*/\n```\n\nWe\
    \ can't apply sizeof and address operators to bit fields. So we can't use scanf\
    \ to input in a bit field.\n\n```\nscanf(\"%d\", &var.a);  /*Invalid*/\n```"
  merge: -1
