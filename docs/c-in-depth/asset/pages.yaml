    \n```\nenum group1{ physics, chemistry, maths};\nenum group2{ zoology, botany,\
    \ chemistry }; /*Invalid*/\nfloat maths; /* Invalid*/\n```\n\nWe can use typedef\
    \ in the definition of enum, for example:-\n\n```\ntypedef enum{false, true} boolean;\n\
    ```\n\nNow we can define variables like this-\nboolean flag = true;\nWe have seen\
