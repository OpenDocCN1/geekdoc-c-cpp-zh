- pgno: 466
  md: 'Initially we''ll declare a variable of type va_list.

    va_list ap;

    This variable is conventionally named ap. Here ap is known as argument pointer
    and will be used to point to the unnamed arguments. The macro va_start initializes
    ap and makes it point to the first unnamed argument passed to the function. This
    macro takes two arguments, first one is the argument pointer ap and second one
    is the name of the last fixed argument passed to the function (i.e. argument which
    is just before the ellipsis). For example in the above function func( ), va_start
    will be called as-

    va_start( ap, num);


    Now we can access individual variable arguments sequentially by using va_arg.
    This macro takes ap and the data type of the current argument.

    arg = va_arg( ap, datatype);

    It returns the value of the current argument and increments the pointer ap so
    that it points to the next argument. After calling va_start and first call of
    va_arg returns first unnamed argument, second call returns second unnamed argument
    and so on. If datatype of the current argument in the function call does not match
    with the datatype in va_arg then the behaviour is undefined.

    The macro va_end should be called before exiting from the function. This macro
    sets the argument pointer to NULL.

    va_end(ap);


    The unnamed arguments can''t be used after calling va_end. If we want to use those
    arguments then once again we''ll have to initialize ap with va_start.

    The whole procedure is summarized in these steps:


    +   (i) Include the header file stdarg.h

    +   (ii) The function header should contain ellipsis to denote the variable argument
    list.

    +   (iii) Declare a variable of type va_list.

    +   (iv) Initialize the argument pointer using va_start, so that it points to
    the first unnamed argument.

    +   (v) Use va_arg to retrieve the value of arguments.

    +   (vi) Call the macro va_end when you have finished working with these arguments.


    There is no facility to count how many arguments were passed in the function call
    and what was the type of each argument. It is programmer''s responsibility to
    pass this information to the function through fixed arguments. For example we
    may decide to take the first fixed argument as an integer that represents the
    total number of unnamed arguments. Generally a format string is passed as a fixed
    argument, which contains information about the type of each argument. For example
    printf( ) uses the format string which contains conversion specifications which
