  md: "# Control Statements\n\n```\nelse if(per>=40)\ngrade='D';\nelse\ngrade='E';\n\
    printf(\"Percentage is %f\\nGrade is %c\\n\",per,grade);\n```\n\nIf we don't use\
    \ the else if ladder, the equivalent code for this problem would be -\n\n```\n\
    if(per>=85)\ngrade='A';\nif(per<85&per>=70)\ngrade='B';\nif(per<70&per>=55)\n\
    grade='C';\nif(per<55&per>=40)\ngrade='D';\nif(per<40)\ngrade='E';\n```\n\nIn\
    \ if...else ladder whenever a condition is found true other conditions are not\
    \ checked, while in this case all the conditions will always be checked wasting\
    \ a lot of time, and moreover the conditions here are more lengthy.\n\n# 5.3 Loops\n\
    \nLoops are used when we want to execute a part of the program or a block of statements\
    \ several times. For example, suppose we want to print \"C is the best\" 10 times.\
    \ One way to get the desired output is - we write 10 printf statements, which\
    \ is not preferable. Other way out is - use loop. Using loop we can write one\
    \ loop statement and only one printf statement, and this approach is definitely\
    \ better than the first one. With the help of loop we can execute a part of the\
    \ program repeatedly till some condition is true. There are three loop statements\
    \ in C-\n\n+   (a) while\n+   (b) do while\n+   (c) for\n\n# 5.3.1 while loop\n\
    \nThe while statement can be written as:\n\n```\nwhile(condition)\n{\n\tstatement;\n\
    }\n```"
