  md: 'In general we can write-

    arr+i Points to iᵗʰ element of arr → Points to iᵗʰ 1-D array

    Since (arr+i) points to iᵗʰ element of arr, so on dereferencing it we''ll get
    iᵗʰ element of arr which is of course a 1-D array. Hence the expression *(arr+i)
    gives us the base address of iᵗʰ 1-D array.

    We have proved earlier that the pointer expression *(arr+i) is equivalent to the
    subscript expression arr[i]. So *(arr+i) which is same as arr[i] gives the base
    address of iᵗʰ 1-D array.


    *(arr+0) - arr[0] - Base address of 0ᵗʰ 1-D array - Points to 0ᵗʰ element of 0ᵗʰ
    1-D array - 5000

    *(arr+1) - arr[1] - Base address of 1ˢᵗ 1-D array - Points to 0ᵗʰ element of 1ˢᵗ
    1-D array - 5008

    *(arr+2) - arr[2] - Base address of 2ⁿᵈ 1-D array - Points to 0ᵗʰ element of 2ⁿᵈ
    1-D array - 5016


    In general we can write-

    *(arr+i) - arr[i] - Base address of iᵗʰ 1-D array - Points to 0ᵗʰ element of iᵗʰ
    1-D array

    Note that both the expressions (arr+i) and *(arr+i) are pointers, but their base
    type is different. The base type of (arr+i) is ''an array of 4 ints'' while the
    base type of *(arr+i) or arr[i] is ''int''.


    To access any individual element of our 2-D array, we should be able to access
    any jᵗʰ element of the iᵗʰ 1-D array. Since the base type of *(arr+i) is ''int''
    and it contains the address of 0ᵗʰ element of iᵗʰ 1-D array, we can get the addresses
    of subsequent elements in the iᵗʰ 1-D array by adding integer values to *(arr+i).
    For example *(arr+i)+1 will represent the address of 1ˢᵗ element of iᵗʰ 1-D array
    and *(arr+i)+2 will represent the address of 2ⁿᵈ element of iᵗʰ 1-D array. Similarly
    *(arr+i)+j will represent the address of jᵗʰ element of iᵗʰ 1-D array. On dereferencing
    this expression we can get the jth element of the iᵗʰ 1-D array.


    +   - arr Points to 0ᵗʰ 1-D array

    +   - *arr Points to 0ᵗʰ element of 0ᵗʰ 1-D array

    +   - (arr+i) Points to iᵗʰ 1-D array

    +   - *(arr+i) Points to 0ᵗʰ element of iᵗʰ 1-D array

    +   - *(arr+i)+j Points to jᵗʰ element of iᵗʰ 1-D array

    +   - *( *(arr+i)+j ) Represents the value of jᵗʰ element of iᵗʰ 1-D array


