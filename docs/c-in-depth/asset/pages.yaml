    any data type. The syntax of declaration of a void pointer is-


    ```

    void *vp;

    ```


    Here void is a keyword and vp is declared as a pointer of void type. For example-


    ```

    int i= 2, *ip = &i;

    float f = 2.3, *fp = &f;

    double d;

    void *vp;

    /*Incorrect */

    ip = fp;

    /*Correct*/

    vp = ip;

    /*Correct */

    vp = fp;

    /*Correct */

    vp = &d;

    ```


    We can assign address of any data type to a void pointer and a void pointer can
    be assigned to a pointer of any data type.


    A void pointer can''t be dereferenced simply by using indirection operator. Before
    dereferencing, it should be type cast to appropriate pointer data type. For example
    if vp is a void pointer and it holds the address of an integer variable then we
    can''t dereference it just by writing *vp. We''ll have to write *(int *)vp, where
    leftmost asterisk is the indirection operator and (int *) is used for typecasting.
    Similarly pointer arithmetic can''t be performed on void pointers without typecasting.


