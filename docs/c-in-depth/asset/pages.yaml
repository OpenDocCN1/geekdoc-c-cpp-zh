    # 16.19 Declaring Local Variables Based On Size


    The local variables should be declared based on their sizes. We should prefer
    to declare larger to smaller datatype size variables. Compiler allocates variables
    in the same sequence in which they are declared. Declaring larger to smaller datatype
    variables will help the compiler in alignment and padding. Let us take an example-


    ```

    int a;

    float b;

    long c;

    double d, e[2];

    ```


    This should be declared as-


    ```

    double e[2];

    double d;

    long c;

    float b;

    int a;

    ```


    # 16.20 Prefer Integer Comparison


    We should always prefer integer comparison in conditions because it is faster
    as compared to any other data type.


    # 16.21 Avoid String Comparison


    We should try to avoid strings comparisons as much as possible. String comparison
    is very slow as it compares each character. Generally we use strcmp( ) function
    for comparing two strings. But this is very slow and can be very inefficient if
    we have lot of data in strings for comparing. We know we can''t avoid comparing
    strings, but we can use some trick for the comparison:


    +   1. Compare the index of ''0'' of first string with the same index of second
    string.

    +   2. Firstly compare first character of both strings; if they are same then
    only compare the full string.


    These two points can be very important in avoiding most of the string comparison.'
