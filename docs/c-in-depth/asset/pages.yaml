    \ : \");\n    scanf(\"%d\",&num);\n\n    for(i=2;i<=sqrt(num);i++)\n    {\n  \
    \      if (num%i==0)\n        {\n            printf(\"%d is not prime\\n\",num);\n\
    \            flag=0;\n            break;\n        }\n    }\n    if(flag==1)\n\
    \        printf(\"%d is prime\\n\",num);\n}\n```\n\nsqrt() is a library function\
