  md: '# 4. Including files


    # 5. Error generation, pragmas and predefined macro names.


    The preprocessor directives that perform these functions are as given below-


    +   #define #else #error

    +   #if #elif #line

    +   #ifdef #endif #pragma

    +   #ifndef #undef


    There are three operators that are used with these directives-


    +   Defined operator - defined( )

    +   Stringizing operator - #

    +   Token pasting operator - ##


    Apart from the facilities provided through directives, another important task
    that preprocessor performs is that it replaces each comment by a single space.


    # 12.1 #define


    We have already used this directive to define symbolic constants. The general
    syntax is-


    ```

    #define macro_name macro_expansion

    ```


    Here macro_name is any valid C identifier, and it is generally taken in capital
    letters to distinguish it from other variables. The macro_expansion can be any
    text. A space is necessary between the macro_name and macro_expansion. The C preprocessor
    replaces all the occurrences of macro_name with the macro_expansion. For example-


    ```

    #define TRUE 1

    #define FALSE 0

    #define PI 3.14159265

    #define MAX 100

    #define RETIRE_AGE 58

    ```


    C preprocessor searches for macro_name in the C source code and replaces it with
    the macro_expansion


    For example wherever the macro name TRUE appears in the code, it is replaced by
    1. These types of constants are known as symbolic constants. These constants increase
    the readability of the program. For example it is better to use the name PI instead
    of the value itself. Moreover if after some time we may decide to change the value
    of a constant, then the change has to be made only at one place. For example if
    we decide to increase the RETIRE_AGE from 58 to 60, then we have to change the
    #define directive only. If we had not defined this constant then we would have
    to replace each occurrence 58 by 60. We have already utilized this feature to
    define the size of an array.


    We can also define any string constant in the place of macro_expansion.


    ```

    /*P12.1 Program to show that macro expansion can be a string constant*/

    #include <stdio.h>

    #define MSG "I understand the use of #define\n"

    main()

    {

    printf(MSG);

    }

    ```'
