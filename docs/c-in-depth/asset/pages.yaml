  md: '![](img/a76c706396af8b310f291a5313a27079_153_0.png)


    # 6.19.2 Advantages And Disadvantages Of Recursion


    The use of recursion makes the code more compact and elegant. It simplifies the
    logic and hence makes the program easier to understand. But the code written using
    recursion is less efficient since recursion is a slow process because of many
    function calls involved in it.


    Most problems with recursive solutions also have an equivalent non recursive(generally
    iterative) solutions. A non recursive solution increases performance while a recursive
    solution is simpler.


    # 6.19.3 Local Variables In Recursion


    We know each function has some local variables that exist only inside that function.
    When a function is called recursively, then for each call a new set of local variables
    is created(except static), their name is same but they are stored at different
    places and contain different values. These values are remembered by the compiler
    till the end of function call, so that these values are available in the unwinding
    phase.'
