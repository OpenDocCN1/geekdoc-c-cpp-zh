    # ## 2.9 Variables


    Variable is a name that can be used to store values. Variables can take different
    values but one at a time. These values can be changed during execution of the
    program. A data type is associated with each variable. The data type of the variable
    decides what values it can take. The rules for naming variables are same as that
    for naming identifiers.


    # ### 2.9.1 Declaration of Variables


    It is must to declare a variable before it is used in the program. Declaration
    of a variable specifies its name and datatype. The type and range of values that
    a variable can store depends upon its datatype. The syntax of declaration of a
    variable is-


    ```

    ```

    datatype variablename;

    ```

    ```


    Here datatype may be int, float, char, double etc. Some examples of declaration
    of variables are-


    ```

