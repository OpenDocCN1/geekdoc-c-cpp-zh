  md: "Note that inside the body of the loop there should be a statement that alters\
    \ the value of the condition, so that the condition becomes false ultimately at\
    \ some point.\n\n```\n/*P5.8 Program to print numbers in reverse order with a\
    \ difference of 2*/\nmain()\n{\n    int k=10;\n    while(k>=2)\n    {\n      \
    \  printf(\"%d\\t\",k);\n        k=k-2;\n    }\n    printf(\"\\n\");\n}\n```\n\
    \n# Output:\n\n10      8      6      4      2\n\n```\n/*P5.9 Program to print\
    \ the sum of digits of any number*/\n#include<stdio.h>\nmain()\n{\n    int n,sum=0,rem;\n\
    \    printf(\"Enter the number : \");\n    scanf(\"%d\", &n);\n    while(n>0)\n\
    \    {\n        rem=n%10; /* taking last digit of number */\n        sum+=rem;\n\
    \        n/=10;   /* skipping last digit */\n    }\n    printf(\"Sum of digits\
    \ = %d\\n\",sum);\n}\n```\n\n# Output:\n\nEnter the number : 1452\nSum of digits\
    \ = 12\n\nHere we are extracting the digits of the number from right to left and\
    \ then these digits are added one by one to the variable sum. Note that the variable\
    \ sum is initialized to 0. This is because we are adding some numbers to it, and\
    \ if not initialized then these numbers will be added to garbage value present\
    \ in it. Let's see how the loop works when the value of n is 1452.\n\nBefore loop\
    \ starts    rem = garbage value,    sum = 0,    n = 1452\nAfter 1st iteration\
    \   rem = 1452%10 = 2,    sum = 0+2 = 2,    n = 145\nAfter 2nd iteration   rem\
    \ = 145%10 = 5,    sum = 2+5 = 7,    n = 14\nAfter 3rd iteration   rem = 14%10\
    \ = 4,    sum = 7+4 = 11,    n = 1\nAfter 4th iteration   rem = 1%10 = 1,    sum\
    \ = 11+1 = 12,    n = 0\n\nNow since the value of n is equal to zero, hence the\
    \ condition ( n > 0 ) becomes false and the loop stops."
