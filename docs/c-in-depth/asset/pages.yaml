    \ value of fopen().\n\n```\n```c\nFILE *fp;\nfp = fopen(\"text.dat\", \"w\");\n\
    if(fp==NULL)\n    printf(\"Error in opening file\");\nexit(1);\n```\n```\n\nErrors\
    \ in opening a file may occur due to various reasons, for example-\n\n+   1. If\
    \ we try to open a file in read or update mode, and the file doesn't exist or\
    \ we do not have read permission on that file.\n+   2. If we try to create a file\
    \ but there is no space on the disk or we don't have write permission.\n+   3.\
    \ If we try to create a file that already exists and we don't have permission\
    \ to delete that file.\n+   4. Operating system limits the number of files that\
    \ can be opened at a time and we are trying to open more files than that number.\n\
