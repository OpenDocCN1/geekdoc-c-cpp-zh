    \ of an int (32767). Even the factorial of 8 is more than this limit.\n\n```\n\
    /*P5.12 Program to convert a binary number to a decimal number*/\n#include<stdio.h>\n\
    main()\n{\n    int n,nsave,rem,d,j=1,dec=0;\n    printf(\"Enter the number in\
    \ binary : \");\n    scanf(\"%d\",&n);\n    nsave=n;\n    while(n>0)\n    {\n\
    \        rem=n%10;        /*taking last digit*/\n        d=rem*j;\n        dec+=d;\n\
    \        j*=2;\n        n/=10;          /*skipping last digit*/\n    }\n    printf(\"\
    Binary number = %d, Decimal number = %d\\n\",nsave,dec);\n}\n```\n\n# Ouput :\n\
    \nEnter the number in binary : 1101\nBinary number = 1101, Decimal number = 13\n\
    \nTo convert a binary number to decimal, we extract binary digits from right and\
    \ add them after multiplying by powers of 2. This is somewhat similar to the program\
    \ P5.9, only we have to multiply the digits by powers of 2 before adding them.\
    \ This is how the loop works for binary number 1101.\n\nBefore loop starts: rem=garbage,\
    \ d= garbage, dec=0, j=1, n=nsave=1101\nAfter 1st iteration: rem=1, d=1*1, dec=1,\
    \ j=2, n=110\nAfter 2nd iteration: rem=0, d=0*2, dec=1+0, j=4, n=11\nAfter 3rd\
    \ iteration: rem=1, d=1*4, dec=1+0+4, j=8, n=1\nAfter 4th iteration: rem=1, d=1*8,\
    \ dec=1+0+4+8, j=16, n=0\n\nNow the value of n becomes zero so the loop terminates.\
    \ We have taken a variable nsave to save the value of binary number, because the\
    \ value of n gets changed after the loop execution.\n\n(The above program will\
    \ be valid for binary numbers upto 11111 only, for larger numbers take long int).\n\
