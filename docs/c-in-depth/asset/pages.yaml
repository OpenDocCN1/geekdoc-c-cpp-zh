    \ \"r+t\": Text file opened in update mode\n+   - \"r+t\" or \"r+t\": Text file\
    \ opened in update mode\n+   - \"r\": Text file opened in write mode\n\n# ## 11.3.1\
    \ Errors in Opening Files\n\nIf an error occurs in opening the file, then fopen()\
