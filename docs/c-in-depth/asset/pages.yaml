  md: "# Chapter 10\n\n# Structure And Union\n\nArray is a collection of same type\
    \ of elements but in many real life applications we may need to gr different types\
    \ of logically related data. For example if we want to create a record of a person\
    \ t contains name, age and height of that person, then we can't use array because\
    \ all the three data eleme are of different types.\n\n![](img/a76c706396af8b310f291a5313a27079_302_0.png)\n\
    \nTo store these related fields of different data types we can use a structure,\
    \ which is capable of stor heterogeneous data. Data of different types can be\
    \ grouped together under a single name using structu The data elements of a structure\
    \ are referred to as members.\n\n# 10.1 Defining a Structure\n\nDefinition of\
    \ a structure creates a template or format that describes the characteristics\
    \ of its memb All the variables that would be declared of this structure type,\
    \ will take the form of this template. general syntax of a structure definition\
    \ is-\n\n```\nstruct tagname{\n    datatype member1;\n    datatype member2;\n\
    \    .............\n    datatype memberN;\n};\n```\n\nHere struct is a keyword,\
    \ which tells the compiler that a structure is being defined. member1, memb ............\
    \ memberN are known as members of the structure and are declared inside curly\
    \ bra There should be a semicolon at the end of the curly braces. These members\
    \ can be of any data t like int, char, float, array, pointers or another structure\
    \ type. tagname is the name of the structure it is used further in the program\
    \ to declare variables of this structure type.\n\nDefinition of a structure provides\
    \ one more data type in addition to the built in data types. We can dec variables\
    \ of this new data type that will have the format of the defined structure. It\
    \ is importan"
  merge: -1
  img_proc: true
- pgno: 303
  md: "note that definition of a structure template does not reserve any space in\
    \ memory for the members; space is reserved only when actual variables of this\
    \ structure type are declared. Although the syntax of declaration of members inside\
    \ the template is identical to the syntax we use in declaring variables but these\
    \ members are not variables, they don't have any existence until they are attached\
    \ with a structure variable. The member names inside a structure should be different\
    \ from one another but these names can be similar to any other variable name declared\
    \ outside the structure. The member names of two different structures may also\
    \ be same.\n\nLet us take an example of defining a structure template.\n\n```\n\
    struct student{\n    char name[20];\n    int rollno;\n    float marks;\n};\n```\n\
    \nHere student is the structure tag and there are three members of this structure\
    \ viz name, rollno and marks. Structure template can be defined globally or locally\
    \ i.e. it can be placed before all functions in the program or it can be locally\
    \ present in a function. If the template is global then it can be used by all\
    \ functions while if it is local then only the function containing it can use\
    \ it.\n\n# 10.2 Declaring Structure Variables\n\nBy defining a structure we have\
    \ only created a format, the actual use of structures will be when we declare\
    \ variables based on this format. We can declare structure variables in two ways-\n\
    \n+   - With structure definition\n+   - Using the structure tag\n\n# 10.2.1 With\
    \ Structure Definition\n\n```\nstruct student{\n    char name[20];\n    int rollno;\n\
    \    float marks;\n}stu1,stu2,stu3;\n```\n\nHere stu1, stu2 and stu3 are variables\
    \ of type struct student. When we declare a variable while defining the structure\
    \ template, the tagname is optional. So we can also declare them as-\n\n```\n\
    struct{\n    char name[20];\n    int rollno;\n    float marks;\n}stu1,stu2,stu3;\n\
    ```\n\n# 10.2.2 Using Structure Tag"
