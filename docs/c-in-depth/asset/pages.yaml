  md: '# # Control Statements


    The break statement appears. It can be written as break; When break is encountered,
    loop is terminated and the control is transferred to the statement immediately
    after the loop. The break statement is generally written along with a condition.
    If break is written inside a nested loop structure then it causes exit from the
    innermost loop.


