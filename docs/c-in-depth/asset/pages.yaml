  md: "# Chapter 17\n\n# C and Assembly Interaction\n\nC has wonderful feature to\
    \ interact with assembly. This makes it more useful. It's good that we can interact\
    \ with other language but the question arises why is it needed. We know very well\
    \ that assembly is a low level language and it can interact directly with hardware.\
    \ It does manipulation in registers so it is always fast compared to other languages.\
    \ There are so many things that can be done with assembly language only. We can\
    \ use these features with C very easily. We can write inline assembly routine\
    \ in our C code, as well as our C module can also interact with assembly module.\n\
    \n# 17.1 Inline Assembly Language\n\nWe can write assembly statement in C language\
    \ by using asm keyword before each assembly statement in our program.\n\nEx-\n\
    \n```\nasm mov AX , 5\n```\n\nLet us take a C program to print a character by\
    \ using assembly statement.\n\n```\nmain()\n{\n    asm mov dl,65\n    asm mov\
    \ ah,2\n    asm int 21 h\n}\n```\n\nHere we are using INT 21 with assembly. Let\
    \ us see its description-\n\n# INT 21 H Service 2 – Character Output on\n\nInput:\n\
    \nDL= ASCII character\nAH=2\n\nFor writing same thing in MASM we have to use keyword\
    \ _asm and all the assembly statements will be in block starting with '{ ' and\
    \ ending with '}'.\n\n```\nmain()\n{\n    _asm {\n        mov dl,65\n        mov\
    \ ah,2\n        int 21 h\n    }\n}\n```"
