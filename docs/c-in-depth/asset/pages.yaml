  md: "Similarly if we have some code in the program that is different for different\
    \ machines, we can use the above structure.\n\n# 12.11.6 Debugging\n\nThe compiler\
    \ can detect syntax errors but it is unable to detect run time errors, which result\
    \ in incorrect output. To trace these types of errors in the program the debugging\
    \ has to be done by the programmer. In a large program where many functions and\
    \ variables are involved this can be a difficult task. For this debugging purpose\
    \ we can insert some printf statements inside the code that tell us about the\
    \ intermediate results. After the debugging is complete we don't need these statements\
    \ and we can delete them. But suppose after few days we again need to debug the\
    \ program, then we'll have to insert all those statements once again. We have\
    \ another better alternative if we use preprocessor directives. Using these directives\
    \ we can make these debugging statements active or inactive depending on our needs.\
    \ The following program shows this-\n\n```\n```c\n#include<stdio.h>\n#define DEBUG\n\
    main()\n{\n    int x;\n    #ifdef DEBUG\n        printf(\"Starting main()\\n\"\
    );\n    #endif\n    ............\n    func();\n    ............\n    #ifdef DEBUG\n\
    \        printf(\"Now value of x = %d and y = %d \\n\",x,y);\n    #endif\n   \
    \ ........\n}\nfunc(){\n    #ifdef DEBUG\n        printf(\"Inside func()\\n\"\
    );\n    #endif\n    ..........\n}\n```\n```\n\nWhen the debugging is complete\
    \ we can just undefine or delete the macro DEBUG. This will make the #ifdef condition\
    \ false and all the debugging statements will not be compiled. So in this way\
    \ we can switch between the debugging and normal mode by defining or deleting\
    \ the macro DEBUG without having to delete all the debugging statements.\n\nIncluding\
    \ #ifdef and #endif for every debugging statement makes things look more lengthy\
    \ and confusing. To make it more concise we can define another macro SHOW. The\
    \ macro SHOW is defined in such a way that if macro DEBUG is defined, then SHOW\
    \ will be replaced by a printf statement, and if DEBUG is not defined then SHOW\
    \ won't be replaced by anything.\n\n```\n```c\n#include<stdio.h>\n#define DEBUG\n\
    ```\n```"
