  md: '# ## 2.8.2 Character Constants


    A character constant is a single character that is enclosed within single quotes.
    Some valid character constants are-


    +   ''g''

    +   ''D''

    +   ''$''

    +   '',''

    +   ''#''


    Some invalid character constants are-


    | Invalid | Remark |

    |---|---|

    |''four'' | There should be only one character within quotes |

    |"d" | Double quotes are not allowed |

    |'''' | No character between single quotes |

    |y | Single quotes missing |


    Every character constant has a unique integer value associated with it. This integer
    is the numeric value of the character in the machine''s character code. If the
    machine is using ASCII (American Standard Code for Information Interchange), then
    the character ''G'' represents integer value 71 and the character ''S'' represents
    value 53. Some ASCII values are-


    +   A - Z ASCII value ( 65 - 90 )

    +   a - z ASCII value ( 97 - 122 )

    +   0 - 9 ASCII value ( 48 - 57 )

    +   ; ASCII value ( 59 )


    # ## 2.8.3 String Constants


    A string constant has zero, one or more than one character. A string constant
    is enclosed within double quotes (" "). At the end of string, ''0'' is automatically
    placed by the compiler.


    +   "Kumar"

    +   "593"

    +   "8"

    +   " "

    +   "A"


    Note that "A" and ''A'' are different. The first one is a string constant which
    consists of character A and ''0'' while the second one is a character constant
    which represents integer value 65.


    # ## 2.8.4 Symbolic Constants


    If we want to use a constant several times then we can provide it a name. For
    example if we have to use the constant 3.14159265 at many places in our program,
    then we can give it a name PI and use this name instead of writing the constant
    value everywhere. These types of constants are called symbolic constants or named
    constants.


    A symbolic constant is a name that substitutes for a sequence of characters. The
    characters may represent a numeric constant, a character constant or a string
    constant.


    These constants are generally defined at the beginning of the program as'
