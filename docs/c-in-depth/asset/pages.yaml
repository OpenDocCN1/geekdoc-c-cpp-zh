    # 4.13 Precedence And Associativity Of Operators


    For evaluation of expressions having more than one operator, there are certain
    precedence and associativity rules defined in C. Let us see what these rules are
    and why are they required.


    Consider the following expression-


    ```

    2 + 3 * 5

    ```


    Here we have two operators- addition and multiplication operators. If addition
    is performed before multiplication then result will be 25 and if multiplication
    is performed before addition then the result will be 17.


    In C language, operators are grouped together and each group is given a precedence
    level. The precedence of all the operators is given in the following table. The
    upper rows in the table have higher precedence and it decreases as we move down
    the table. Hence the operators with precedence level 1 have highest precedence
    and with precedence level 15 have lowest precedence. So whenever an expression
    contains more than one operator, the operator with a higher precedence is evaluated
    first. For example in the above expression, multiplication will be performed before
    addition since multiplication operator has higher precedence than the addition
    operator.'
