    ```\n\nRegister variables don't have memory addresses so we can't apply address\
    \ operator(&) to them. There are limited number of registers in the processor\
    \ hence we can declare only few variables as register. If many variables are declared\
    \ as register and the CPU registers are not available then compiler will treat\
    \ them as automatic variables.\n\nThe CPU registers are generally of 16 bits,\
    \ so we can specify register storage class only for int, char or pointer types.\
    \ If a variable other than these types is declared as register variable then compiler\
    \ treat it as an automatic variable.\n\nThe register storage class specifier can\
