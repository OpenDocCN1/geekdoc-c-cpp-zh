  md: 'The link part of the node contains garbage value, we’ll assign address to it
    separately in the two cases.


    # 10.15.4 Insertion in the Beginning


    After insertion the new node will become the first node, and the node which is
    currently the first node will come at second place. So we just have to adjust
    the links of the nodes.


    ```

    tmp->link = start;

    ```


    Now inserted node points to the next node, which was beginning node of the linked
    list.


    Now inserted node is the first node of the linked list. So start should be reassigned
    as-


    ```

    start = tmp

    ```


    Now start will point to the inserted node, which is first node of the linked list.


    The following figure shows this process, dotted lines represent the link before
    insertion.


    ![](img/a76c706396af8b310f291a5313a27079_326_0.png)


    # 10.15.5 Insertion in Between or at the end


    First we traverse the linked list for obtaining the node after which we want to
    insert the element.


    obtain pointer q which points to the element after which we have to insert new
    node. For insert the element after the node, we give the link part of that node
    to the link part of inserted node and address of the inserted node is placed into
    the link part of the previous node.


    ```

    tmp->link = q->link;

    ```


    ```

    q->link = tmp;

    ```


    Here q is pointing to the previous node. After statement 1, link of inserted node
    will point to the next node after the previous node.


    After statement 2 link of previous node will point to the inserted node.


    If the node is to be inserted at the end then also the above two statements would
    work. In that case q will point to the last node, hence q->link will be NULL.
    So after statement 1, link of inserted node will point to NULL.'
