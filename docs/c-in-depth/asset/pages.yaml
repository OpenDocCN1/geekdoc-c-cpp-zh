    # 14.6 const


    If any variable is declared with const qualifier, then the value of that variable
    can''t be changed by the program. The const qualifier can occur in the declaration
    before or after the data type. For example-


    ```

    const int x = 9;

    int const x = 9;

    ```


    Both these declarations are equivalent and declare x as a const variable. Any
    attempt to change the value of this variable in the program will result in an
    error. For example these statements are invalid-


    ```

    x = 10;    /*Invalid*/

    x = func(); /*Invalid*/

    x++;      /*Invalid*/

    ```


    The const qualifier informs the compiler that the variable can be stored in read
    only memory. A const variable can be given a value only through initialization
    or by some hardware devices. Note that the value of a const variable can''t be
    modified by the program, but any external event outside the program can change
    its value.


    If an array, structure or union is declared as const then each member in it becomes
    constant. For example-


    ```c

    const int arr[5] = { 10, 11, 12, 13, 14 };

    const struct { char x; int y; float z; } var = { ''A'', 12, 29.5 };

    arr[2] = 22;          /*Invalid*/

    var.x = ''B'';          /*Invalid*/

    ```


    The const variables are not true compile time constants in C. So we can''t use
    const variables where constant expressions are required e.g. in array dimensions
    or case labels.


    For example the following code is invalid in C.


    ```c

    const int size=10;

    int arr[size];

    ```'
