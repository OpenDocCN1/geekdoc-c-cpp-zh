    \ x is 5*/\n```\n\nHere the two operands of the addition operator are (++x) and\
    \ (--x). These two operands have to be added and then the result has to be assigned\
    \ to variable y. Before addition, these two operands will be evaluated. Now if\
    \ the first operand(++x) is evaluated first then y will be assigned value 11,\
    \ while if second operand(--x) is evaluated first then y will be assigned the\
    \ value 9. Since C is silent on such controversies, the answers may vary on different\
    \ compilers so it is better to avoid such type of expressions.\n\nThere are four\
    \ exceptional operators where C clearly specifies the order of evaluation of operands.\
    \ These operators are logical AND( && ), logical OR( || ), conditional ( ? : )\
