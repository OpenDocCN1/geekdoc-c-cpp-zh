    When the bitwise operators &, |, ^ operate on two operands of different sizes,
    then the size of small operand is increased to match the size of larger operand.
    For example if there are two operands of sizes 16 and 32 bits, then the 16-bit
    operand will be converted to 32 bits. The extra bits are added to the left of
    the smaller operand. If the smaller operand is unsigned then all these extra bits
    are filled with zeros, and if it is signed then these smaller operand''s bits
    are filled with the sign bit.


    # 13.4 One''s Complement (~)


    One''s complement operator is a unary operator and requires only one operand.
    It negates the value of the operand. If the bit of the operand is 1 then the resulting
    bit is 0 and if the bit of the operand is 0 then the resulting bit is 1.


    | Bit of operand | Resulting Bit |

    | 0 | 1 |

    | 1 | 0 |


    ```

    /*P13.4*/

    #include<stdio.h>

    main()

    {

    int a;

    printf("Enter value for a : ");

    scanf("%d",&a);

    printf("a = %d\t\t a: "); bit_pattern(a);

    printf("~a = %d\t\t ~a: "); bit_pattern(~a);

    }

    ```


    When the complement operator is applied to an operand twice, then the result is
    the original operand i.e. ~(~a) is equal to a. This feature of complement operator
    can be used for encrypting and decrypting data. To encrypt the data, we can apply
    complement operator to it, and to decrypt the data i.e. to get back the original
    data we can apply the complement operator to the encrypted data. For example


    Original data : 0000 1110 0101 0011

    Encrypted data : 1111 0000 1010 1100 (By applying ~ to original data)'
