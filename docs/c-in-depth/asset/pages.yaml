    \ are evaluated from left to right and the type and value of the rightmost expression\
    \ is the type and value of the compound expression.\n\nFor example consider this\
    \ expression-\na = 8, b = 7, c = 9, a+b+c\n\nHere we have combined 4 expressions.\
    \ Initially 8 is assigned to the variable a, then 7 is assigned to the variable\
    \ b, 9 is assigned to variable c and after this a+b+c is evaluated which becomes\
