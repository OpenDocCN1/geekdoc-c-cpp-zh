  md: 'this expression can be derived. Let us take a two dimension array arr[3][4]-


    ```

    ```c

    int arr[3][4] = { {10, 11, 12, 13}, {20, 21, 22, 23}, {30, 31, 32, 33} };

    ```

    ```


    | | Column 0 | Column 1 | Column 2 | Column 3 |

    |---|---|---|---|---|

    | Row 0 | 10 | 11 | 12 | 13 |

    | Row 1 | 20 | 21 | 22 | 23 |

    | Row 2 | 30 | 31 | 32 | 33 |


    We have been talking about 2-D arrays in terms of rows and columns, but since
    memory in computer is organized linearly it is not possible to store the 2-D array
    in rows and columns. The concept of rows and columns is only theoretical, actually
    a 2-D array is stored in row major order i.e. rows are placed next to each other.
    The following figure shows how the above 2-D array will be stored in memory.


    ![](img/a76c706396af8b310f291a5313a27079_228_0.png)


    Each row can be considered as a 1-D array, so a two-dimensional array can be considered
    as a collection of one-dimensional arrays that are placed one after another. In
    other words we can say that a 2-D array is an array of arrays. So here arr is
    an array of 3 elements where each element is a 1-D array of 4 integers.


    We know that the name of an array is a constant pointer that points to the 0th
    element of array. In the case of 2-D arrays, 0th element is a 1-D array, so the
    name of a 2-D array represents a pointer to a 1-D array. For example in the above
    case, arr is a pointer to 0th 1-D array and contains address 5000. Since arr is
    a ''pointer to an array of 4 integers'', so according to pointer arithmetic, the
    expression (arr+1) will represent the address 5008 and expression (arr+2) will
    represent address 5016. So we can say that arr points to the 0th 1-D array, (arr+1)
    points to the 1st 1-D array and (arr+2) points to the 2nd 1-D array.


    ![](img/a76c706396af8b310f291a5313a27079_228_1.png)


    | arr - Points to 0th element of arr - | Points to 0th 1-D array - 5000 |

    | arr+1 - Points to 1st element of arr - | Points to 1st 1-D array - 5008 |

    | arr+2 - Points to 2nd element of arr - | Points to 2nd 1-D array - 5016 |'
