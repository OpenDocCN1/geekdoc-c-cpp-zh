    \ Function\n\nWe have seen that functions have addresses, so we can have pointers\
    \ that can contain these addresses and hence point to them. The syntax for declaration\
    \ of a pointer to a function is as-\n\n```\nreturn type (*ptr_name)(type1, type2,\
    \ ......);\n```\n\nFor example-\n\n```\nfloat (*fp)( int );\nchar (*func_p)(float,\
    \ char);\n```\n\nHere fp is a pointer that can point to any function that returns\
