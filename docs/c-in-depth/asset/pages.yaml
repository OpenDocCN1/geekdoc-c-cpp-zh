  md: 'Here arg1, arg2 .... are the formal arguments. The macro_name is replaced with
    the macro_expansion and the formal arguments are replaced by the corresponding
    actual arguments supplied in the macro call. So the macro_expansion will be different
    for different actual arguments. For example suppose we define these two macros-


    ```

    #define SUM(x, y) ( (x) + (y) )

    #define PROD(x, y) ( (x) * (y) )

    ```


    Now suppose we have these two statements in our program-


    ```

    s = SUM(5, 6);

    p = PROD(m, n);

    ```


    After passing through the preprocessor these statements would be expanded as-


    ```

    s = ( (5) + (6) );

    p = ( (m) * (n) );

    ```


    Since this is just replacement of text, hence the arguments can be of any data
    type. For example we may use the macro SUM to find out the sum of long or float
    types also.


    The following statement-


    ```

    s = SUM( 2.3, 4.8 );

    ```


    would be expanded as-


    ```

    s = ( (2.3) + (4.8) );

    ```


    ```

    /*P12.2 Program to understand macros with arguments*/

    #include<stdio.h>

    #define SUM(x,y) ((x)+(y))

    #define PROD(x,y) ((x)*(y))

    main()

    {

    int l,m,i,j,a=5,b=3;

    float p,q;

    l=SUM(a,b);

    m=PROD(a,b);

    i=SUM(4,6);

    j=PROD(4,6);

    p=SUM(2.2,3.4);

    q=PROD(2.2,3.4);

    printf("l=%d,m=%d,i=%d,j=%d,p=%1f,q=%1f\n",l,m,i,j,p,q);

    }

    ```


    Output:


    l = 8, m = 15, i = 10, j = 24, p = 5.6, q = 7.5


