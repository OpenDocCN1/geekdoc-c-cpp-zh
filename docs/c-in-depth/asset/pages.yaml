    \ there is no need to check divisibility by other numbers, hence the control is\
    \ transferred out of loop by break statement. Control can come out of loop in\
    \ two situations, after the full execution of loop when loop condition becomes\
    \ false, due to break statement. If control comes out after full execution of\
