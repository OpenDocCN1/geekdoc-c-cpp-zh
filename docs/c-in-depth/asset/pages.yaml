  md: '# 11.14.8 fflush( )


    Declaration: int fflush(FILE *fptr);


    This function writes any buffered unwritten output to the file associated with
    fptr. The file is not closed after call to fflush( ). On success it returns 0
    and on error it returns EOF. If we call this function with stderr, then all the
    unwritten buffered error messages will be written.


    ```

    fflush(stderr);

    ```


    To flush all output streams we can write-


    ```

    fflush(NULL);

    ```


    Although fflush( ) is defined for output streams only, but in some compilers fflush(
    ) can be used with stdin to discard unread characters on standard input. For example
    consider this situation-


    ```

    printf("Enter an integer : ");

    scanf("%d", &i);

    printf("Enter a character : ");

    scanf("%c", &ch);

    ```


    After entering the integer, we press Enter key so that the first scanf( ) terminates.
    The integer value is read by the scanf( ) but the newline character(ASCII 10 )
    is still in the input buffer. So the next scanf( ) reads this newline character
    in the variable ch, and terminates even before user enters any character. Similar
    type of problem may occur when we use gets( ) after scanf( ), since gets( ) terminates
    when it finds a newline character. To avoid such problems we can use fflush(stdin)
    to discard any unread characters. For example-


    ```

    printf("Enter an integer : ");

    scanf("%d", &i);

    printf("Enter a character : ");

    fflush(stdin);

    scanf("%c", &ch);

    ```


    Note that fflush(stdin) is not portable, it might not work on every compiler.


    # 11.14.9 tmpfile( )


    Declaration: FILE *tmpfile(void);

    tmpfile( ) creates a temporary binary file and opens it in "wb+" mode. On success
    it returns a pointer of type FILE that points to the temporary file and on error
    it returns NULL. The file created by tmpfile( ) is temporary because it is automatically
    deleted when closed or when the program terminates.


    # 11.14.10 tmpnam( )


    Declaration: char *tmpnam(char str[L_tmpnam]);

    This function is used to generate a unique name for a file. The argument str can
    be NULL or an array of minimum L_tmpnam characters. If str is NULL then tmpnam(
    ) stores the temporary file name in an internal static array and returns a pointer
    to that array. If str is not NULL, then tmpnam( ) stores the temporary file name
    in str and returns str. The number of different file names that can be generated
    by tmpnam( ) during the execution of program is specified by TMP_MAX, which is
    defined in stdio.h file. Note that tmpnam( ) only creates a file name, it does
    not create the file. A file with the name generated by tmpnam( ) can be opened
    using fopen( ), and it should be closed using fclose( ).'
