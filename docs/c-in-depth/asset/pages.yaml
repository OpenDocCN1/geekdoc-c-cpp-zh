- pgno: 219
  md: 'so we should use them carefully.


    Suppose ptr is an integer pointer and x in an integer variable. Now we''ll see
    how the pointer expressions given below are interpreted.


    ```

    x = *ptr++;

    x = *++ptr;

    x = ++*ptr;

    x = (*ptr)++;

    ```


    # (i) x = *ptr++


    The expression *ptr++ is equivalent to *(ptr++), since these operators associate
    from right to left. Hence the increment operator will be applied to ptr, and not
    to *ptr. The increment operator is postfix, so first the value of ptr will be
    used in the expression and then it will be incremented. Hence firstly the integer
    pointed to by ptr will be dereferenced and assigned to x and then ptr will be
    incremented. This is same as-


    ```

    x = *ptr;

    ptr = ptr+1;

    ```


    # (ii) x = *++ptr


    The expression *++ptr is equivalent to *(++ptr). Here also the increment operator
    is applied to ptr. The increment operator is prefix, so first ptr will be incremented
    and then its new value will be used in the expression. Hence firstly the value
    of ptr is incremented, then value at the new address is dereferenced and assigned
    to x. This is same as-


    ```

    ptr = ptr+1;

    x = *ptr;

    ```


    # (iii) x = ++*ptr


    The expression ++*ptr is equivalent to ++(*ptr). Here the increment operator is
    applied over *ptr, and not ptr. So here the value of pointer will not change but
    the value pointed to by the pointer will change, i.e., *ptr will increment. Since
    the increment operator is prefix hence first the value of *ptr will increment
    and then this value will be assigned to x. This is same as-


    ```

    *ptr = *ptr+1;

    x = *ptr;

    ```


    # (iv) x = (*ptr)++


    Here also the increment operator is applied over *ptr and since it is postfix
    increment hence first the value of *ptr will be assigned to x and then it will
    be incremented. This is same as-


    ```

    x = *ptr;

    *ptr = *ptr+1;

    ```


    Let us take an example and understand how these expressions are interpreted. Suppose
    value at address 2000 is 25, value at address 2002 is 38, ptr is an integer pointer
    that contains address 2000 hence value of *ptr is 25. Now we''ll see what will
    be the results in the above four cases, if this is the initial condition in all
    cases.


    ![](img/a76c706396af8b310f291a5313a27079_219_0.png)'
