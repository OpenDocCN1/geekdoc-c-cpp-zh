    # 14.2.2 External


    The variables that have to be used by many functions and different files can be
    declared as external variables. The initial value of an uninitialized external
    variable is zero.


    Before studying external variables, let us first understand the difference between
    their definition and declaration. The declaration of an external variable declares
    the type and name of the variable, while the definition reserves storage for the
    variable as well as behaves as a declaration. The keyword extern is specified
    in declaration but not in definition. For example the definition of an external
    variable salary will be written as-

    float salary;

    Its declaration will be written as-

    extern float salary;


    The following points will clarify the concept of definition and declaration of
    an external variable.


    +   Definition of an external variable-

    +   (a) Definition creates the variable, so memory is allocated at the time of
    definition.

    +   (b) There can be only one definition.

    +   (c) The variable can be initialized with the definition and initializer should
    be constant.

    +   (d) The keyword extern is not specified in the definition. Some compilers
    may allow the use of extern but it is better to omit this keyword in the definition.

    +   (e) The definition can be written only outside functions.

    +   Declaration of an external variable-

    +   (a) The declaration does not create the variable, it only refers to a variable
    that has already been created somewhere, so memory is not allocated at the time
    of declaration.'
