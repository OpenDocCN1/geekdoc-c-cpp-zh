  md: ".. #endif directives. For example if we open stdio.h file\n\n```\n#ifndef __STDIO_H\n\
    #define __STDIO_H\n....contents of stdio.h file.....\n#endif\n```\n\nThis sort\
    \ of coding ensures that the contents of this file will be included only once.\
    \ The first time when the file stdio.h is included, the preprocessor finds that\
    \ macro __STDIO_H is not defined, and hence it defines this macro and includes\
    \ the contents of the file. After this whenever stdio.h is included in our program,\
    \ the preprocessor finds that the macro __STDIO_H is defined and hence it skips\
    \ all the statements between #ifndef and #endif.\n\nWe can use a similar strategy\
    \ to avoid multiple definitions in our program. For example the definition of\
    \ constant NULL may be needed by many files such as stdio.h, stdlib.h, string.h,\
    \ alloc.h etc. This constant can be defined in all these files but if we include\
    \ more than one files which have definition of NULL, then our program will have\
    \ multiple definitions of NULL. So definition of NULL is put in a separate file\
    \ _null.h and this file is included in all other files.\n\nThese files don't include\
    \ the _null.h file directly, but enclose the include directive inside #ifndef\
    \ and #endif like this-\n\n```\n#ifndef NULL\n#include<_null.h>\n#endif\n```\n\
    \nNow this file will be included only when NULL has not been defined.\n\n# 12.12\
    \ Predefined Macro Names\n\nThere are certain predefined macro names which can't\
