    #define Sun 0\n#define Mon 1\n#define Tue 2\n#define Wed 3\n```\n\nNow we'll compare\
    \ the constants defined by #define preprocessor directive and enum.\n\n+   (i)\
    \ By defining an enum, we define a new type whose variables can be declared but\
    \ using #define we can only give name to some constant values.\n+   (ii) enum\
    \ is a part of C language(32 keywords) but #define is not.\n+   (iii) All #define\
