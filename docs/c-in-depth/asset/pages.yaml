  md: "+   - Insertion of an element\n+   - Deletion of an element\n+   - Creation\
    \ of list\n+   - Reversal of list\n\n# 15.1 Traversing a Linked List\n\nTraversal\
    \ of a list means accessing each node exactly once. For this we'll take a structure\
    \ pointer ptr. Initially ptr is assigned the value of start.\n\n```\nptr = start;\n\
    ```\n\nNow ptr points to the first node of linked list. We can access the info\
    \ part of first node by writing ptr->info.\n\nNow we'll shift the pointer ptr\
    \ forward so that it points to the next element. This can be easily done by assigning\
    \ the address of the next element to ptr as—\n\n```\nptr = ptr->link;\n```\n\n\
    Now ptr has address of the next element. Similarly we can traverse each element\
    \ of linked list through assignment until ptr has NULL value, which is link part\
    \ value of last element. So the linked list can be traversed as—\n\n```\nwhile(ptr!=NULL)\n\
    {\n    printf(\"%d \",ptr->info);\n    ptr=ptr->link;\n}\n```\n\n# 15.2 Searching\
    \ in a Linked List\n\nIn searching an element, we traverse the linked list and\
    \ while traversing we compare the info part of each element with the given element.\
    \ It can be written as—\n\n```\nwhile(ptr!=NULL)\n{\n    if(ptr->info==data) \
    \ /*Search successful*/\n        ............\n    else\n        ptr=ptr->link;\
    \  /*Go to next element*/\n}\n```\n\nHere data is the element, which we want to\
    \ search.\n\n# 15.3 Insertion into a Linked List\n\nInsertion in a linked list\
    \ may be possible in two ways—\n\n+   - Insertion in the beginning\n+   - Insertion\
    \ in between or at the end.\n\nTo insert a node, initially we'll dynamically allocate\
    \ space for that node using malloc(). Suppose tmp is a pointer that points to\
    \ this dynamically allocated node. In the info part of the node we'll put the\
    \ value.\n\n```\ntmp = (struct node *)malloc( sizeof(struct node) );\ntmp->info\
