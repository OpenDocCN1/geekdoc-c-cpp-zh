  md: "Here on the left side of the dot there should be a variable of structure type\
    \ and on right hand side there\nshould be the name of a member of that structure.\
    \ For example consider the following structure-\n\n```\n~~~c\nstruct student{\n\
    \        char name[20];\n        int rollno;\n        float marks;\n      };\n\
    struct student stu1,stu2;\n~~~\n```\n\nname of stu1 is given by - stu1.name\n\
    rollno of stu1 is given by - stu1.rollno\nmarks of stu1 is given by - stu1.marks\n\
    name of stu2 is given by - stu2.name\nrollno of stu2 is given by - stu2.rollno\n\
    marks of stu2 is given by - stu2.marks\n\nWe can use stu1.name , stu1.marks, stu2.marks\
    \ etc like any other ordinary variables in the program.\nThey can be read, displayed,\
