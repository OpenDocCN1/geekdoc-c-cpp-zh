- pgno: 349
  md: '| Binary | - | 0000 | 0110 | 1000 | 1111 |

    | Text | - | 0011 | 0001 | 0011 | 0110 | 0011 | 0111 | 0011 | 1001 |


    Both text files and binary files keep record of the length of the file, and identify
    the end of file when this length is reached. In text files, there is one more
    way to detect the end of file. The character with ASCII value 26 is considered
    to be the end of file character in text files. All input functions stop reading
    from a text file when this character is encountered and return an end of file
    signal to the program. C does not insert this character in the file, it can be
    entered through the keyboard by Ctrl+Z( or Ctrl +D on some systems). In binary
    files no such character represents the end of file.


    In text files newline is stored as a combination of carriage return ''\\r''(ASCII
    13 ) and linefeed ''\\n''(ASCII 10 ) while in binary files newline is stored only
    as ''\\n''(ASCII 10).


    In binary format, the data is stored in the same way as it is represented in memory
    so no conversions have to take place while transferring of data between memory
    and file. In text format some conversions have to take place while transferring
    data between memory and file. For example while writing to a text file newline(''\\n'')
    has to be converted to a combination of ''\\r'' and ''\\n'' and while reading
    from a text file this combination (''\\n'' and ''\\r'') is converted back to ''\\n''.


    The input and output operations in binary files take less time as compared to
    that of text files because in binary files no conversions have to take place.
    However the data written using binary format is not very portable since the size
    of data types and byte order may be different on different machines. In text format,
    these problems do not arise so it is considered more portable.


    # 11.2 Concept Of Buffer


    Buffer is an area in memory where the data is temporarily stored before being
    written to the file. When we open a file, a buffer is automatically associated
    with its file pointer. Whatever data we send to the file is not immediately written
    to the file. First it is sent to the buffer and when the buffer is full then its
    contents are written to the file. When the file is closed, all the contents of
    buffer are automatically written to the file even if the buffer is not full. This
    is called flushing the buffer, we can also explicitly flush the buffer by a function
    fflush( ) described later.


    The concept of buffer is used to increase efficiency. Had there been no buffer
    we would have to access the disk each time for writing a single byte of data.
    This would have taken lot of time because each time the disk is accessed, the
    read/write head has to be repositioned. When buffering is done, the data is collected
    in the buffer and data equal to the size of buffer is written to the file at a
    time, so the number of times disk is accessed decreases, which improves the efficiency.


    +   The steps for file operations in C programming are as follows-

    +   1. Open a file

    +   2. Read the file or write data in the file

    +   3. Close the file


    The functions fopen( ) and fclose( ) are used for opening and closing the files
    respectively.


