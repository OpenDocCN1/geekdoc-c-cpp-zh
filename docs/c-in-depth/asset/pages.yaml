    \ If a function is external then it can be used by all the files of the program\
    \ and if it is static then it can be used only in the file where it is defined.\n\
    \nIf an external function is to be used in another file, then that file should\
    \ contain function declaration and it is a good practice to specify extern in\
    \ that declaration.\n\n```\n```c\nfirst.c\nmain()\n{\n    ........\n}\nfloat func1(int)\n\
    {\n    ..........\n}\n```\n```\n\n```\n```c\nsecond.c\nextern float func1(int);\n\
    func2()\n{\n    ..........\n}\nstatic int func3(int)\n{\n    ..........\n}\n```\n\
    ```\n\n```\n```c\nthird.c\nvoid func4()\n{\n    ..........\n}\nvoid func5()\n\
    {\n    ..........\n}\n```\n```\n\nHere the function func1() is defined in file\
    \ first.c. Its declaration is put in file second.c, so it can be used in this\
    \ file also. The function func3() in file second.c is defined as static so it\
    \ can't be used by any other file. Generally declarations of all functions are\
    \ collected in a header file and that header file is included in other files.\n\
    \n# 14.4 Linkage\n\nThere are three types of linkages in C-\n\n+   (a) External\
    \ linkage\n+   (b) Internal linkage\n+   (c) No linkage\n\nLocal variables have\
    \ no linkage, so their scope is only within the block where they are declared.\
    \ Global variables and functions have external linkage, so they can be used in\
    \ any file of the program. Static global variables and static functions have internal\
    \ linkage, so their scope is only in the file where they are declared.\n\n# 14.5\
    \ Memory During Program Execution\n\nThe register variables are stored in CPU\
    \ registers and rest of the variables are stored in memory. Now let us see how\
    \ memory is organized when a C program is run.\n\nCode Area: This area is used\
    \ to store executable code of the program. The size of this area does not change\
    \ during run time.\n\nData Area: This area stores static and global variables.\
    \ It is further subdivided into two areas viz. initialized data area and uninitialized\
    \ data area. The initialized data area stores all the initialized static and global"
