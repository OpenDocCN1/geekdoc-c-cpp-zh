- pgno: 427
  md: "Logical shift – The vacated bits are always filled with zeros.\n\nArithmetic\
    \ shift – The vacated bits are filled with the value of the leftmost bit in the\
    \ initial bit pattern. If the leftmost bit is 1, then the vacated positions are\
    \ filled with 1, and if the leftmost bit is 0, then the vacated positions are\
    \ filled with 0.\n\nThe following two examples show arithmetic shift in signed\
    \ integers. In first case the leftmost bit is 1 so the vacated bits are filled\
    \ with 1, and in the second case the leftmost bit is 0, so the vacated bits are\
    \ filled with 0.\n\n![](img/a76c706396af8b310f291a5313a27079_427_0.png)\n\n# Arithmetic\
    \ right shift in signed integers\n\nActually the leftmost bit represents the sign\
    \ bit. If the number is negative, then it is set to 1. So in other words we can\
    \ say that, in arithmetic shift the vacated bits are filled with the sign bit.\n\
    \nWe know that expressions like x/2 or x*5 do not change the value of x , similarly\
    \ x<<4 or x>>3 will not change the value of x. If we write x = x<<4 , then only\
    \ the value of x will be changed.\n\nWhile using left shift and right shift operators,\
    \ the result is undefined if the right operand is negative or it is more than\
    \ the number of bits used to represent the left operand.\n\n```\n/*P13.6*/\n#include<stdio.h>\n\
    main()\n{\n    int a;\n    printf(\"Enter value for a : \");\n    scanf(\"%x\"\
