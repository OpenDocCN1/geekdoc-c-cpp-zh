    \n```\n#define SHOW(var) printf(\"var = %d\", var)\n```\n\nThen a call SHOW(x);\
    \ will be expanded as printf(\"var = %d\", x); Here the formal argument var outside\
    \ the string was replaced by the actual argument x, but inside the string this\
    \ replacement did not take place. To solve this sort of problem we can use the\
    \ stringizing operator. This operator is used within the definition of a macro.\
    \ It causes the argument it precedes to be turned into a string or in other words\
    \ it stringizes a macro argument. So if in the macro expansion, we have a formal\
    \ argument preceded by #, then both this operator and argument are replaced by\
    \ the actual argument surrounded within double quotes. We can write the above\
    \ macro using stringizing operator as-\n\n```\n#define SHOW(var) printf(#var \"\
    =%d\", var)\n```"
