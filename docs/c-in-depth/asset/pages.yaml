  md: 'Here are some examples of array declarations-


    ```

    ```c

    int age[100];

    float sal[15];

    char grade[20];

    ```

    ```


    Here age is an integer type array, which can store 100 elements of integer type.
    The array sal is a floating type array of size 15, can hold float values and third
    one is a character type array of size 20, can hold characters. The individual
    elements of the above arrays are-


    +   - age[0], age[1], age[2], ................ age[99]

    +   - sal[0], sal[1], sal[2], ................sal[14]

    +   - grade[0], grade[1], grade[2], ................grade[19]


    When an array is declared, the compiler allocates space in memory sufficient to
    hold all the elements of the array, so the compiler should know the size of array
    at the compile time. Hence we can''t use variables for specifying the size of
    array in the declaration. The symbolic constants can be used to specify the size
    of array. For example-


    ```

    ```c

    #define SIZE 10

    main()

    {

    int size=15;

    float sal[SIZE]; /*Valid*/

    int marks[size]; /*Not valid*/

    ..................

    }

    ```

    ```


    The use of symbolic constant to specify the size of array makes it convenient
    to modify the program if the size of array is to be changed later, because the
    size has to be changed only at one place i.e. in the #define directive.


    # 7.1.2 Accessing 1-D Array Elements


    In C, the array elements can be accessed by specifying the array name followed
    by subscript in brackets. In C, the array subscripts start from 0. Hence if there
    is an array of size 5 then the valid subscripts will be from 0 to 4. The last
    valid subscript is one less than the size of the array. This last valid subscript
    is sometimes known as the upper bound of the array and 0 is known as the lower
    bound of the array.


    ```

    ```c

    int arr[5]; /*Size of array arr is 5, can hold five integer elements*/

    ```

    ```


    +   - arr[0], arr[1], arr[2], arr[3], arr[4]


    Here 0 is the lower bound and 4 is the upper bound of the array. The subscript
    can be any expression that yields an integer value. It can be any integer constant,
    integer variable, integer expression or return(int) from a function call. For
    example, if i and j are integer variables then these are some valid subscripted
    array elements-


    ```

    ```c

    arr[3]

    arr[i]

    arr[i+j]

    ```

    ```'
