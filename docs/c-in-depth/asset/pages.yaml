    \ 2);                 /*Actual arguments less than formal*/\n```\n\nHere the third\
    \ argument receives garbage value. a = 1, b = 2, c = garbage value\n\nIf there\
    \ is a type mismatch between a corresponding actual and formal argument, then\
    \ compiler tries to convert the type of actual argument to the type of the formal\
    \ argument if the conversion is legal, otherwise a garbage value is passed to\
    \ the formal argument.\n\n# 6.13    Order Of Evaluation Of Function Arguments\n\
    \nWhen a function is called with more than one argument,then the order of evaluation\
    \ of arguments is unspecified. This order of evaluation is not important in function\
    \ calls like multiply( m, n) or multiply(m+n, n). But if we have a function call\
    \ like this-\n\n```\nint m = 3, k;\nk = multiply( m, m++);\n```\n\nNow here if\
    \ the first argument is evaluated first then value of k will be 9, and if the\
    \ second argument is evaluated first, the value of k will be 12. But since the\
    \ order of evaluation of arguments is unspecified in C and depends on compiler,\
    \ hence the result may be different on different compilers. Similarly if we write-\n\
    \n```\nint i = 10;\nprintf(\"%d %d %d\", --i, i++, i);\n```\n\nHere also the result\
    \ is unpredictable. So it is better to avoid these types of argument expressions\
    \ that can produce different results on different compilers.\n\n# 6.14    main()\
    \ Function\n\nExecution of every C program always begins with the function main(\
    \ ). Each function is called directly or indirectly in main( ) and after all functions\
    \ have done their operations, control returns back to main( ). There can be only\
    \ one main( ) function in a program.\n\nThe main( ) function is a user defined\
    \ function but the name, number and type of arguments are predefined in the language.\
    \ The operating system calls the main function and main( ) returns a value of\
    \ integer type to the operating system. If the value returned is zero, it implies\
    \ that the function has terminated successfully and any nonzero return value indicates\
    \ an error. If no return value is specified in main( ) then any garbage value\
    \ will be returned automatically. Calling the function exit( ) with an integer\
    \ value"
