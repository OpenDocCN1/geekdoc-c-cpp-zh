    \ union is used instead of struct. The main difference between union and structure\
    \ is in the way memory is allocated for the members. In a structure each member\
    \ has its own memory location, whereas members of union share the same memory\
    \ location. When a variable of type union is declared, compiler allocates sufficient\
    \ memory to hold the largest member in the union. Since all members share the\
    \ same memory location hence we can use only one member at a time. Thus union\
    \ is used for saving memory. The concept of union is useful when it is not necessary\
    \ to use all members of the union at a time.\n\nThe syntax of definition of a\
    \ union is-\n\n```\nunion union_name{\n    datatype member1;\n    datatype member2;\n\
