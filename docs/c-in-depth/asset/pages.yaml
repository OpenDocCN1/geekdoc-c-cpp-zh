  md: '# 4.12 Type Conversion


    C provides the facility of mixing different types of variables and constants in
    an expression. In these types of operations data type of one operand is converted
    into data type of another operand. This is known as type conversion. The different
    types of type conversion are-


    ![](img/a76c706396af8b310f291a5313a27079_58_0.png)


    Implicit type conversions are done by the compiler while the explicit type conversions
    are user define conversions.


    # 4.12.1 Implicit Type Conversions


    These conversions are done by the C compiler according to some predefined rules
    of C language. Th two types of implicit type conversions are automatic type conversions
    and type conversion in assignments


    # 4.12.2 Automatic Conversions


    # Automatic unary conversions


    All operands of type char and short will be converted to int before any operation.
    Some compilers conver all float operands to double before any operation.


    # Automatic binary conversions


    The rules for automatic binary conversions are as-


    +   (i) If one operand is long double, then the other will be converted to long
    double, and the result wi be long double,

    +   (ii) Otherwise if one operand is double, then the other will be converted
    to double and the result wi be double,

    +   (iii) Otherwise if one operand is float, the other will be converted to float
    and the result will be flo

    +   (iv) Otherwise if one operand is unsigned long int, then other will be converted
    to unsigned long i and the result will be unsigned long int.

    +   (v) Otherwise if one operand is long int and other is unsigned int

    +   (a) If long int can represent all the values of an unsigned int, then unsigned
    int will be convert to long int and the result will be long int,

    +   (b) Else both the operands will be converted to unsigned long int and the
    result will be unsign long int,

    +   (vi) Otherwise if one operand is long int, then the other will be converted
    to long int and the rest will be long int.'
