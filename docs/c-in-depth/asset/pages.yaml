  md: "is written to the file. The buffers allocated by the system for the file are\
    \ freed after the file is closed so that these buffers can be available for other\
    \ files. Some systems have a limitation on the number of files that can be opened\
    \ at a time, so we should close the files that are not currently in use so that\
    \ we can open other files.\n\nAlthough all the files are closed automatically\
    \ when the program terminates normally, but sometimes it may be necessary to close\
    \ the file by fclose( ) e.g. when we have to reopen the file in some other mode\
    \ or when we exceed the number of opened files permitted by the system. Moreover\
    \ it is a good practice to close files explicitly by fclose( ) when no more operations\
    \ are to be performed on the file because it becomes clear to the reader of the\
    \ program that the file has no use now.\n\nfclose( ) returns EOF on error and\
    \ 0 on success( EOF is a constant defined in stdio.h and its value is -1). An\
    \ error in fclose( ) may occur when there is not sufficient space on the disk\
    \ or when the disk has been taken out of the drive.\n\nIf more than one files\
    \ are opened, then we can close all the files by calling fclose( ) for each file.\n\
    \n```\n```\nfclose(fptr1);\nfclose(fptr2);\n........................\n........................\n\
    ```\n```\n\nWe can also close multiple files by calling a single function fcloseall(\
