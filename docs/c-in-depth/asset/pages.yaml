- pgno: 541
  md: '# Appendix C


    # Conversion Specifications


    +   - %c - a single character

    +   - %d - a decimal integer

    +   - %f - a floating point number

    +   - %e - a floating point number

    +   - %g - a floating point number

    +   - %lf - long range of floating point number( for double data type)

    +   - %h - a short integer

    +   - %o - an octal integer

    +   - %x - a hexadecimal integer

    +   - %i - a decimal, octal or hexadecimal integer

    +   - %s - a string

    +   - %u - an unsigned decimal integer


    The modifier h can be used before conversion specifications d, i, o, u, x to specify
    short integer and the modifier l can be used before them to specify a long integer.


    The modifier l can be used before conversion specifications f,e,g to specify double
    while modifier L can be used before them to specify a long double.'
