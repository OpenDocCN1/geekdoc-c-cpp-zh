    \ declaration and call of library functions-\n\n+   - Function Definition - Predefined,\
    \ precompiled and present in the library.\n+   - Function Declaration - In header\
    \ files ( files with a .h extension)\n+   - Function Call - By the programmer\n\
    \nTo use a library function in our program we should know-\n\n+   (i) Name of\
