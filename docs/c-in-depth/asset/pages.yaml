    # 12.10 Including Files


    The preprocessor directive #include is used to include a file into the source
    code. We have already used this directive to include header files in our programs.
    The filename should be within angle brackets or double quotes. The syntax is-


    ```

    #include "filename"

    #include<filename>

    ```


    The preprocessor replaces the #include directive by the contents of the specified
    file. After including the file, the entire contents of file can be used in the
    program. If the filename is in double quotes, first it is searched in the current
    directory (where the source file is present), if not found there then it is searched
    in the standard include directory. If the filename is within angle brackets, then
    the file is searched in the standard include directory only. The specification
    of standard include directory is implementation defined.


    Generally angled brackets are used to include standard header files while double
    quotes are used to include header files related to a particular program. We can
    also specify the whole path instead of the path name. For example-


    ```

    #include "C:\mydir\myfile.h"

    ```


    Note that here the path is not a string constant so there is no need to double
    the backslashes.


    Include directive should not be used to include the contents of other ''.c'' files.
    It is generally used to include header files only. Header files are given ''.h''
    extension to distinguish them from other C files, although this is not necessary.
    Header files generally contain macro definitions, declarations of enum, structure,
    union, typedef, external functions and global variables. The function definitions
    or global variable definitions should not be put in the header files.


    Include files can be nested i.e. an included file can contain another #include
    directive.


    # 12.11 Conditional Compilation


    There may be situations when we want to compile some parts of the code based on
    some condition. We know that before compilation the source code passes through
    the preprocessor. So we can direct the preprocessor to supply only some parts
    of the code to the compiler for compilation.


    Conditional compilation means compilation of a part of code based on some condition.


    These conditions are checked during the preprocessing phase. The directives used
    in conditional compilation are-


    +   #ifdef   #ifndef   #if   #else   #elif   #endif'
