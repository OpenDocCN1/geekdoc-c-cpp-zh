    # 13.5 Bitwise Left Shift ( << )\n\nThis operator is used for shifting the bits\
    \ left. It requires two operands. The left operand is the operand whose bits are\
    \ shifted and the right operand indicates the number of bits to be shifted. On\
    \ shifting the bits left, an equal number of bit positions on the right are vacated.\
    \ These positions are filled in with 0 bits. Let us take an integer variable a\
    \ = 0x1346. The binary representation of x is- 0001 0011 0100 0110 Now we'll find\
    \ out a << 4\n\nInitial Bit pattern\n\n0001 0011 0100 0110\n\nBit pattern after\
    \ left shifting\n\n0001 0011 0100 0110 0000\nLost Bits\nBits filled\n\nOn shifting\
    \ all bits to the left by 4, the leftmost 4 bits are lost while the rightmost\
    \ 4 bit positions become empty which are filled with 0 bits.\n\n```\n/*P13.5*/\n\
    #include<stdio.h>\nmain()\n{\n int a;\n printf(\"Enter value for a : \");\n scanf(\"\
    %d\",&a);\n printf(\"a = %d\\t\",a);   bit_pattern(a);\n a=a<<2;\n printf(\"a\
    \ = %d\\t\",a);   bit_pattern(a);\n}\n```\n\n# 13.6 Bitwise Right Shift ( >> )\n\
    \nThis operator is similar to the left shift operator, except that it shifts the\
    \ bits to the right side. On shifting the bits right, an equal number of bit positions\
    \ on the left are vacated. These positions are filled in with 0 bits in unsigned\
    \ integers. We'll again take a variable a = 0x1346, and this time we'll find out\
    \ a >>\n\nInitial Bit pattern\n\n0001 0011 0100 0110\n\nBit pattern after right\
    \ shifting\n\n0000 0001 0011 0100\nBits filled\n0110\nLost Bits\n\nRight shift\
    \ in an unsigned integer\n\nIn right shift if the first operand is a signed integer,\
    \ then the result is compiler dependent. Some compilers follow logical shift while\
    \ others may follow arithmetic shift."
