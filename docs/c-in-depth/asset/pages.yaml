  md: "Suppose compiler has reserved bytes numbered 2588 and 2599 for the storage\
    \ of variable age, then the address of variable age will be 2583. Let us assign\
    \ some value to this variable- age = 20;\n\nNow this value will be stored in these\
    \ 2 bytes (of course in binary form). The number of bytes allocated will depend\
    \ on the data type of variable. For example 4 bytes would have been allocated\
    \ for a float variable, and the address of first byte would be called the address\
    \ of the variable. Now we will see how to find out the address of a variable.\n\
    \n# 8.2 Address Operator\n\nC provides an address operator '&', which returns\
    \ the address of a variable when placed before it. This operator can be read as\
    \ \"the address of\", so &age means address of age, similarly &sal means address\
    \ of sal. The following program prints the address of variables using address\
    \ operator.\n\n```\n/*P8.1 Program to print address of variables using address\
    \ operator*/\n#include<stdio.h>\nmain()\n{\n    int age=30;\n    float sal=1500.50;\n\
    \    printf(\"Value of age = %d, Address of age = %u\\n\",age,&age);\n    printf(\"\
    Value of sal = %f, Address of sal = %u\\n\",sal,&sal);\n}\n```\n\n# Output:\n\n\
    Value of age = 30, Address of age = 65524\nValue of sal = 1500.500000, Address\
    \ of sal = 65520\n\nHere we have used %u control sequence to print the address,\
    \ but this does not mean that addresses are unsigned integers. We have used it\
    \ since there is no specific control sequence to display addresses. Addresses\
    \ are just whole numbers. These addresses may be different each time you run your\
    \ program, it depends on which part of memory is allocated by operating system\
    \ for this program.\n\nThe address operator cannot be used with a constant or\
    \ an expression.\n\n+   - &i; /*Valid, used with a variable*/\n+   - &arr[1];\
    \ /*Valid, used with an array element */\n+   - &289; /*Invalid, used with a constant*/\n\
    +   - &(i+k); /*Invalid, used with an expression*/\n\nThis address operator is\
    \ not new for us, we have already used it in scanf( ) function. The address of\
    \ variable is provided to scanf( ), so that it knows where to write the input\
    \ value. So now you can understand why '&' was placed before the variable names\
    \ in scanf( ).\n\n# 8.3 Pointers Variables :\n\nFinally after this brief introduction,\
    \ it is time to introduce pointers. A pointer is a variable that stores memory\
    \ address. Like all other variables it also has a name, has to be declared and\
    \ occupies some space in memory. It is called pointer because it points to a particular\
    \ location in memory by storing the address of that location."
