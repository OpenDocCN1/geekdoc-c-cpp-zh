    \ can be declared along with the definition or separately. For example-\n\n```\n\
    union union_name{\n    datatype member1;\n    datatype member2;\n    ...........\n\
    }variable_name;\n```\n\nThis can also be declared as-\nunion union_name variable_name;\n\
    \nWe can access the union members using the same syntax used for structures. If\
