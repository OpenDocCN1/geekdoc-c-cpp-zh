    # 12.3 Nesting in Macros


    One macro name can also be used for defining another macro name i.e. the macro
    expansion can also contain the name of another macro. For example-


    ```

    #define PI 3.14

    #define PISQUARE PI*PI

    ```


    Now if we have an expression-


    ```

    k = PISQUARE;

    ```


    First time the preprocessor will expand it as-


    ```

    k = PI * PI;

    ```


    Now again the preprocessor rescans this expanded expression, and if any macros
    are found then it replaces them. This process of rescanning continues till no
    macros are left in the expression. So finally the expanded expression would be-


    ```

    k = 3.14 *3.14;

    ```


    Here is another example of nesting of macros-


    ```

    #define ISLOWER(c) (c >= 97 && c <= 122)

    #define TOUPPER(c) ISLOWER(c) ? (c + ''A'' - ''a'') : c

    ```


    Here the macro TOUPPER uses the macro ISLOWER in its expansion. If the character
    is lowercase then only it will be changed to uppercase otherwise it will remain
    unchanged.


    The following program illustrates the use of nested macros-


    ```

    /*P12.3 Program to understand nesting in macros*/

    #include<stdio.h>

    #define ISLOWER(c) (c>=97&&c<=122)

    #define ISUPPER(c) (c>=65&&c<=90)

    #define ISALPHA(c) ( ISLOWER(c) || ISUPPER(c))

    #define ISNUM(c) (c>=48&&c<=57)

    #define ISALPHANUM(c) ( ISALPHA(c) || ISNUM(c))

    main()

    {

    ```'
