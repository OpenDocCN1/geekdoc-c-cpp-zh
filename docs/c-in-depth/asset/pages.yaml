    # # 12.4 Problems with Macros


    You must be wondering why so many parentheses are used in the macro expansion.
    Since the preprocessor simply replaces the formal argument with the actual argument,
    we may not get the desired result in some cases. Let us see what sort of problems
    can occur while using macros and how they can be avoided.


    In the following program we have defined a macro PROD without any parentheses
    in the macro expansion


    ```

    ```c

    /*PL2.4*/

    #include<stdio.h>

    #define PROD(x,y) x*y

    main()

    {

    printf("%d\t",PROD(2,4));

    printf("%d\n",PROD(3+4,5+1));

    }

    ```

    ```


    Output:

    8 24


    Here the first printf() gives the correct result 8, but the second printf() prints
    24 while we are expecting the result to be a product of 7 and 6 i.e. 42. Let us
    see how the preprocessor expand these macros.


    PROD(3+4, 5+1 ) is expanded as 3*4*5+1


    The precedence of multiplication operator is more than addition operator so the
    calculation went like this, 3+20*1 =24 and hence we got the wrong result. This
    problem can be solved by enclosing the formal argument inside parentheses. So
    now we rewrite our program like this-


    ```

    ```c

    /*PL2.5*/

    #include<stdio.h>

    #define PROD(x,y) (x)*(y)

    main()

    {

    printf("%d\t",PROD(2,4));

    printf("%d\t",PROD(3+4,5+1));

    printf("%d\n",60/PROD(2,3));

    }

    ```

    ```'
