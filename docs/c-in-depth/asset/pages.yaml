- pgno: 19
  md: '# # Introduction to C


    Preprocessor directives are processed through preprocessor before the C source
    code passes through compiler. The commonly used preprocessor directives are #include
    and #define. #include is used for including header files. #define is used to define
    symbolic constants and macros.


    Every C program has one or more functions. If a program has only one function
    then it must be main(). Execution of every C program starts with main() function.
    It has two parts, declaration of local variables and statements. The scope of
    the local variable is local to that function only. Statements in the main() function
    are executed one by one. Other functions are the user-defined functions, which
    also have local variables and C statements. They can be defined before or after
    main(). It may be possible that some variables have to be used in many functions,
    so it is necessary to declare them globally. These variables are called global
    variables.


    # ## 1.7 Environment For C


    The steps for the execution of C program are as-


    +   1. Program creation

    +   2. Program compilation

    +   3. Program execution


    # ## 1.7.1 Unix Environment


    Generally a command line compiler is provided with the UNIX operating system.
    This compiler is named cc or gcc.


    # ### (a) Program creation


    in unix environment, file can be created with vi editor as-


    ```

    ```

    $ vi filename.c

    ```


    Here $ is the unix prompt. The file can be saved by pressing ESC and SHIFT+zz
    .

    ```


    # ## (b) Program compilation


    After creation of C program, it can be compiled as-


    ```

    ```

    $cc filename.c

    ```


    If the program has mathematical function then it is compiled as-

    ```

    $cc filename.c -lm

    ```


    After compilation, the executable code is stored in the file a.out .

    ```


    # ## (c) Program execution


    ```

    ```

    $ a.out

    ```

    ```


    # ## 1.7.2 MS-DOS Environment


    In MS-DOS environment creation, compilation and execution can be done using command
    line or IDE (Integrated Development Environment).


    # ## 1.7.2.1 Command Line


    In Borland C, the command line compiler is bcc.exe and in Turbo C the command
    line compiler is tcc.exe.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# (a) Program creation


    The program file can be created using any editor and should be saved with .c extension


    # (b) Program compilation


    After saving the file, C program can be compiled at DOS prompt by writing-


    ```

    C:\>tcc filename (in Turbo C)

    ```


    ```

    C:\>bcc filename (in Borland C)

    ```


    # (c) Program execution


    After compilation of C program, the executable file filename.exe is created. It
    is executed at DOS prompt by writing-


    ```

    C:\>filename

    ```


    # 1.7.2.2 Integrated Development Environment


    All these steps can be performed in an IDE using menu options or shortcut keys.
    In Borland C the program bc.exe is the IDE and in Turbo C the program tc.exe is
    the IDE. So we can open the IDI by typing bc or tc at the command prompt.


    # (a) Program creation


    A new file can be created from menu option New. The file can be saved by menu
    option Save. If the file is unnamed then it is saved by menu option Save as. An
    existing file can be opened from the menu option Open.


    # (b) Program compilation


    The file compiled by the menu option Compile. (Alt+F9)


    # (c) Program execution


    The file can be executed by the menu option Run. (Ctrl+F9). The output appears
    in the output window that can be seen using the keys Alt+F5.


    We have given you just a preliminary knowledge of how to execute your programs.
    There are sever other options that you can explore while working and it is best
    to check the manual of your compile to know about these options.'
