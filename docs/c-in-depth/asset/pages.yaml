    (viii) Otherwise both operands will be int and the result will be int.


    If we leave aside unsigned variables, then these rules are rather simple and can
    be summarized by assigning a rank to each data type. Whenever there are two operands
    of different data types the operand with a lower rank will be converted to the
    type of higher rank operand. This is called promotion of data type.


    ![](img/a76c706396af8b310f291a5313a27079_59_0.png)




    If the types of the two operands in an assignment expression are different, then
    the type of the right hand operand is converted to the type of left hand operand.
    Here if the right hand operand is of lower rank then it will be promoted to the
    rank of left hand operand, and if it is of higher rank then it will be demoted
    to the rank of left hand operand.


    +   1. Some high order bits may be dropped when long is converted to int, or int
    is converted to short int or char.

    +   2. Fractional part may be truncated during conversion of float type to int
    type.

    +   3. When double type is converted to float type, digits are rounded off.

    +   4. When a signed type is changed to unsigned type, the sign may be dropped.

    +   5. When an int is converted to float, or float to double there will be no
    increase in accuracy or precision.


