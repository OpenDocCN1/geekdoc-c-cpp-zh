    # 8.6 Pointer Comparisons


    The relational operators ==, !=, <=, <, >=, > can be used with pointers. The operators
    == and != are used to compare two pointers for finding whether they contain same
    address or not. They will be equal only if both are NULL or they contain address
    of same variable. The use of these operators is valid between pointers of same
    type or between NULL pointer and any other pointer, or between void pointer and
    any other pointer. The relational operators <, >, >=, <= are valid between pointers
    of same type. These operations make sense only when both the pointers point to
    elements of the same array.


    # 8.7 Pointer To Pointer


    We know that pointer is a variable that can contain memory address. This pointer
    variable takes some space in memory and hence it also has an address. We can store
    the address of a pointer variable in some other variable, which is known as a
    pointer to pointer variable. Similarly we can have a pointer to pointer to pointer
    variable and this concept can be extended to any limit, but in practice only pointer
    to pointer is used. Pointer to pointer is generally used while passing pointer
    variables to functions.


    The syntax of declaring a pointer to pointer is as-


    ```

    data_type **pptr;

    ```


    Here variable pptr is a pointer to pointer and it can point to a pointer pointing
    to a variable of type data_type. The double asterisk used in the declaration informs
    the compiler that a pointer to pointer is being declared. Now let us take an example-


    ```

    int a = 5;

    int *pa = &a;

    int **ppa = &pa;

    ```


    Here type of variable a is int, type of variable pa is (int *) or pointer to int,
    and type of variable ppa is (int **) or pointer to pointer to int.'
