    \ including combination of special keys (Ctrl, Alt, Shift) and normal key. There\
    \ is no C function available for getting scan code of pressed key. But we can\
    \ use INT 16 with assembly for getting scan code. Let us see how INT 16 works.\n\
    \n# INT 16H, service 0 - Read key from keyboard\n\nInput:\n  AH=0\nOutput:\n \
    \ AH=Scan code    AL=ASCII code\n\n```\n```c\nmain()\n{\n    asm mov ah,0\n  \
    \  asm int 16 H\n}\n```\n```\n\nAfter these two asm statements, scan code will\
    \ be available in AH register which we can use in another part of program. So\
    \ now you got a brilliant idea, start writing the program for keyboard interaction.\n\
    \nNow we want to take the data in C statement and use it in asm statements. Suppose\
    \ we want to print a string then we will need to use 9th routine of INT 21. See\
