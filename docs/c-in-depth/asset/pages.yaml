    {\n.......\n.......\n}\n```\n\nWe have studied that changes made in formal arguments\
    \ do not affect the actual arguments, but this is not the case while passing an\
    \ array to a function. The mechanism of passing an array to a function is quite\
    \ different from that of passing a simple variable. We have studied earlier that\
    \ in the case of simple variables, the called function creates a copy of the variable\
    \ and works on it, so any changes made in the function do not affect the original\
    \ variable. When an array is passed as an actual argument, the called function\
    \ actually gets access to the original array and works on it, so any changes made\
    \ inside the function affect the original array. Here is a program in which an\
    \ array is passed to a function.\n\n```\n/*P7.9 Program to understand the effect\
    \ of passing an array to a function*/\n#include<stdio.h>\nmain()\n{\n    int i,arr[6]={1,2,3,4,5,6};\n\
    \    func(arr);\n    printf(\"Contents of array are now : \");\n    for(i=0;i<6;i++)\n\
    \        printf(\"%d \",arr[i]);\n    printf(\"\\n\");\n}\nfunc(int val[])\n{\n\
    \    int sum=0,i;\n    for(i=0;i<6;i++)\n    {\n        val[i]=val[i]*val[i];\n\
    \        sum+=val[i];\n    }\n    printf(\"The sum of squares = %d\\n\",sum);\n\
    }\n```\n\n# Output:\n\nThe sum of squares = 91\nThe contents of array are now\
    \ : 1 4 9 16 25 36"
