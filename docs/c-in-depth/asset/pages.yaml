- pgno: 149
  md: "Recursive functions work in two phases. First one is the winding phase and\
    \ the next one is unwinding phase. In winding phase the function keeps on calling\
    \ itself. The winding phase stops when the terminating condition arrives in a\
    \ call, now the unwinding phase starts and the called functions return values\
    \ in reverse order.\n\nIn the above case the function factorial( ) is called 6\
    \ times, but there is only one copy of that function in memory. Each function\
    \ call is different from another because the argument supplied is different each\
    \ time.\n\nNow we'll write a recursive function for finding out the a^n.\n\nThe\
    \ iterative definition for finding a^n is\n\na^n = a * a * a ........... n times\n\
    \nThe recursive definition can be written as-\n\na^n = { 1          n=0\n    \
    \    a * a^(n-1)  n>0 }\n\n```\n/*P6.25 Program to raise a floating point number\
    \ to a positive integer using recursion*/\n#include<stdio.h>\nfloat power(float\
    \ a,int n);\nmain()\n{\n    float a,p;\n    int n;\n    printf(\"Enter a and n\
    \ : \");\n    scanf(\"%f%d\",&a,&n);\n    p=power(a,n);\n    printf(\"%f raised\
    \ to power %d is %f\\n\",a,n,p);\n}\nfloat power(float a,int n)\n{\n    if(n==0)\n\
    \        return(1);\n    else\n        return(a*power(a,n-1));\n}\n```\n\nIn P5.20,\
    \ we had written a program to print the fibonacci series. Now we'll write a recursive\
    \ definition for finding fibonacci numbers.\n\nfib(n) = { 1                  \
    \   n=0 or n=1\n           fib(n-1)+fib(n-2)    n>1 }\n\n```\n/*P6.26 Program\
    \ to generate fibonacci series using recursion*/\n#include<stdio.h>\n```"
