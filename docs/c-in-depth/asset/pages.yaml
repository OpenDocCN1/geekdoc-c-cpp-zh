  md: "# Functions\n\nHere the definition of sum() is written before main(), so main()\
    \ knows everything about the function sum(). But in this case, function declaration\
    \ is needed. The function declaration is also known as the function prototype,\
    \ and it informs the compiler about the following three things-\n\n+   1. Name\
    \ of the function.\n+   2. Number and type of arguments received by the function.\n\
    +   3. Type of value returned by the function.\n\nFunction declaration tells the\
    \ compiler that a function with these features will be defined and used later\
    \ in the program. The general syntax of a function declaration is-\n\n```\nreturn_type\
    \ func_name(type1 arg1, type2 arg2, ......);\n```\n\nThis looks just like the\
    \ header of function definition, except that there is a semicolon at the end.\
    \ The names of the arguments while declaring a function are optional. These are\
    \ only used for descriptive purposes. So we can write the declaration in this\
    \ way also-\n\n```\nreturn_type func_name(type1, type2, ......);\n```\n\nIn program\
    \ P6.2 the declaration is written as-\n\n```\nvoid drawline(void);\n```\n\nIn\
    \ program P6.3 the declaration is written as-\n\n```\nint sum(int x, int y);\n\
    ```\n\nNow we’ll write two more example programs that use functions.\n\n```\n\
    /*P6.5 Program that finds whether a number is even or odd*/\n#include<stdio.h>\n\
    void find(int n);\nmain()\n{\n int num;\n printf(\"Enter a number : \");\n scanf(\"\
    %d\",&num);\n find(num);\n}\nvoid find(int n)\n{\n if(n%2==0)\n  printf(\"%d is\
    \ even\\n\",n);\n else\n  printf(\"%d is odd\\n\",n);\n}\n```\n\n```\n/*P6.6 Program\
    \ that finds the larger of two numbers*/\n#include<stdio.h>\nint max(int x, int\
    \ y);\nmain()\n{\n int a,b;\n printf(\"Enter two numbers : \");\n scanf(\"%d%d\"\
    ,&a,&b);\n printf(\"%d %d = %d\",a,b,max(a,b));\n}\n```"
