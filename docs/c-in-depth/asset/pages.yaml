- pgno: 148
  md: "n! = { 1          n=0\n      n * (n-1)!   n>0 }\n\nNow we'll write a program,\
    \ which finds out the factorial using a recursive function.\n\n```\n/*P6.24 Program\
    \ to find the factorial of a number by recursive method*/\n#include<stdio.h>\n\
    long fact(int n);\nmain()\n{\n    int num;\n    printf(\"Enter a number : \");\n\
    \    scanf(\"%d\",&num);\n    printf(\"Factorial of %d is %ld\\n\",num,fact(num));\n\
    }\nlong fact(int n)\n{\n    if (n==0)\n        return(1);\n    else\n        return(n*fact(n-1));\n\
    }\n```\n\nThis function returns 1 if the argument n is 0, otherwise it returns\
    \ n*fact(n-1). To return n*fact(n-1), the value of fact(n-1) has to be calculated\
    \ for which fact() has to be called again but this time with an argument of n-1.\
    \ This process of calling fact() continues till it is called with an argument\
    \ of 0.\n\nSuppose we want to find out the factorial of 5.\n\n+   - Initially\
    \ main() calls factorial(5)\n+   - Since 5>0, factorial(5) calls factorial(4)\n\
    +   - Since 4>0, factorial(4) calls factorial(3)\n+   - Since 3>0, factorial(3)\
    \ calls factorial(2)\n+   - Since 2>0, factorial(2) calls factorial(1)\n+   -\
    \ Since 1>0, factorial(1) calls factorial(0)\n\nwinding phase\n\nWhen factorial()\
    \ is called with n=0 then the condition inside if statement becomes true, so now\
    \ the recursion stops and control returns to factorial(1) Now every called function\
    \ will return the value to the previous function. These values are returned in\
    \ the reverse order of function calls."
