    \ (TASM or MASM), when it creates object file then this object file will be linked\
    \ to your C executable.\n\nNow the question arises this can be done very easily\
    \ in C language program, then why inline assembly is needed. Remember interaction\
    \ through hardware can be done best through assembly language only. There are\
    \ so many things, which cannot be done with C, that can be done only through assembly\
    \ language and there is no alternative C function available.\n\nSuppose we want\
