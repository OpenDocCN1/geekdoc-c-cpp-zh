    # 15.7 Creation Of Library And Using it in your Program in Turbo C


    Suppose we want to add a module in library. First we will produce .obj file by
    compilation then we will add the function of .obj file to library with the help
    of tlib utility. The whole process will be as-


    +   1. Produce the .obj file by compiling file as-

    +      `d:\> tcc -c xyz.c (ENTER)`

    +      Now xyz.obj will be created.

    +      We can also make the .obj file by Alt + F9.

    +   2. Now we will add all the functions of xyz.obj in new library as-

    +      `d:\> tlib ABC.lib+xyz.obj (ENTER)`

    +      Now new library ABC.lib will be created which will contain all the functions
    of XYZ.obj.

    +   3. Create one header file named ABC.h which will contain prototype of all
    the functions available in library ABC.lib.

    +   4. Now you can call any function of library ABC.lib by including header file
    ABC.h.

    +   5. Suppose we want to add some more modules. First we will get the .obj file
    of all modules then they will be added as-

    +      `d:\> tlib ABC.lib+XYZ1.obj+XYZ2.obj+XYZ3.obj (ENTER)`


    Now we will create library dtmanip.lib for our Date project and will call the
    functions in one sample file.


    +   1. First we will produce .obj files for all modules as-

    +      `d:\> tcc -c Datefmt.c Valid.c Leap.c Julian.c Weekday.c Cmpdate.c Diffymd.c
    Diffdays.c Addyear.c Subyear.c Addmonth.c Submonth.c Adddays.c Subdays.c`

    +      This will produce .obj files for all modules.

    +   2. Now we will create one new library dtmanip.lib for date manipulation by
    adding these modules.

    +      `d:\> tlib dtmanip.lib+Datefmt.obj+Valid.obj+Leap.obj+Weekday.obj+Cmpdate.obj+Diffdays.obj+Diffymd.obj+Addyear.obj+Addmonth.obj+Adddays.obj+Subyear.obj+Submonth.obj+Subdays.obj+Julian.obj`

    +      Now new library dtmanip.lib will be created, which will contain all the
    functions of above modules.

    +   3. We will create one header file dtmanip.h, which is already given before.

    +   4. Now we will create one sample file like main.c of Date project and call
    the functions available in dtmanip.lib.

    +   5. Create new project testlib and add dtmanip.h, main.c and dtmanip.lib in
    this project.

    +   6. Now we can build and run this project.


