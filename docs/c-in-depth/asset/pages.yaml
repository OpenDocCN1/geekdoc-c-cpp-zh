  md: "# Chapter 5\n\n# Control Statements\n\nIn C programs, statements are executed\
    \ sequentially in the order in which they appear in the program. But sometimes\
    \ we may want to use a condition for executing only a part of program. Also many\
    \ situations arise where we may want to execute some statements several times.\
    \ Control statements enable us to specify the order in which the various instructions\
    \ in the program are to be executed. This determines the flow of control. Control\
    \ statements define how the control is transferred to other parts of the program.\
    \ C language supports four types of control statements, which are as-\n\n+   1.\
    \ if...else\n+   2. goto\n+   3. switch\n+   4. loop\n+      - while\n+      -\
    \ do...while\n+      - for\n\n# 5.1 Compound Statement or Block\n\nA compound\
    \ statement or a block is a group of statements enclosed within a pair of curly\
    \ braces {} The statements inside the block are executed sequentially. The general\
    \ form is-\n\n```\n{\n    statement1;\n    statement2;\n    ........\n    .........\n\
    }\n```\n\nFor example-\n\n```\n{\n    i=4;\n    b=2;\n    area=i*b;\n    printf(\"\
    %d\",area);\n}\n```\n\nA compound statement is syntactically equivalent to a single\
    \ statement and can appear anywhere in the program where a single statement is\
    \ allowed."
