    # 14.2.3 Static


    There are two types of static variables-


    +   (1) Local static variables

    +   (2) Global static variables


    # 14.2.3.1 Local Static Variables


    The scope of a local static variable is same as that of an automatic variable
    i.e. it can be used only inside the function or block in which it is defined.
    The lifetime of a static variable is more than that of an automatic variable.
    A static variable is created at the compilation time and it remains alive till
    the end of a program. It is not created and destroyed each time the control enters
    a function/block. Hence a static variable is created only once and its value is
    retained between function calls. If it has been initialized, then the initialization
    value is placed in it only once at the time of creation. It is not initialized
    each time the function is called.


    A static variable can be initialized only by constants or constant expressions.
    Unlike automatic variables, we can’t use the values of previously initialized
    variables to initialize static variables. If a static variable is not explicitly
    initialized then by default it takes initial value zero.


    ```

    ```c

    int x = 8;

    int y = x; /*Valid*/

    static int z = x; /*Invalid, initializer should be constant*/

    ```

    ```


