  md: "If the function returns a value, then this function call can be used like an\
    \ operand in any expression anywhere in the program. The type and value of this\
    \ operand will be the type and value of the return value of the function. For\
    \ example-\n\n```\ns = sum(a, b);    /*Assigning the return value of sum( ) to\
    \ variable s */\nb = max(x, y)*10;    /*return value of max( ) is multiplied by\
    \ 10 and assigned to variable b*/\nif ( isprime(x) ==1 )    /*return value of\
    \ isprime( ) is used in if condition*/\n    printf(\"Number is prime\");\nprintf(\"\
    %d\\n\", sum(a+b) );    /*Return value of sum( ) is printed*/\n```\n\nIf the function\
    \ is declared as void then it cannot be used in this way in any expression. For\
    \ example it would be meaningless and invalid to write an expression like this-\n\
    \n```\ns = drawline();\n```\n\nA function call can be used as a statement, if\
    \ a semicolon is placed after it. In this case if the function returns any value,\
    \ it is just discarded. For example-\n\n```\ndraw(x, y);\ndisplay( a, b, c);\n\
    printprimes( );\n```\n\nA function call cannot occur on the left hand of an assignment\
    \ statement.\n\n```\nfunc(x, y) = a; /* Invalid */\n```\n\nThe code of a function\
    \ is executed only when it is called by some other function. If the function is\
    \ defined and not called even once then it's code will never be executed. A function\
    \ can be called more than once, so the code is executed each time it is called.\
    \ The execution of a function finishes either when the closing braces of the function\
    \ body are reached or if return statement is encountered.\n\n# 6.6 Function Declaration\n\
    \nThe calling function needs information about the called function. If definition\
    \ of the called function is placed before the calling function, then declaration\
    \ is not needed. For example if in program P6.3, we write the definition of sum(\
    \ ) before main( ), then declaration is not needed.\n\n```\n/*P6.4 Program to\
    \ find the sum of two numbers*/\n#include<stdio.h>\nint sum(int x,int y)    /*Function\
    \ definition*/\n{\n    int s;\n    s=x+y;\n    return s;\n}\nmain()\n{\n    int\
    \ a,b,s;\n    printf(\"Enter values for a and b : \");\n    scanf(\"%d %d\",&a,&b);\n\
    \    s=sum(a,b);    /*Function call*/\n    printf(\"Sum of %d and %d is %d\\n\"\
    ,a,b,s);\n}\n```"
