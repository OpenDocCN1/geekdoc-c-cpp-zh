    ```

    double atan2(double y, double x);

    ```


    This function is used for computing the arc tangent of y/x i.e. tan⁻¹(y/x). The
    return value lies in the range -π to π.


    # 18.1.6 cabs()


    ```

    double cabs(struct complex x);

    ```


    This function returns the absolute value of complex number.'
