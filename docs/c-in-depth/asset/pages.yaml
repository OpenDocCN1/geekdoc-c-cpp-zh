- pgno: 304
  md: "```\n```c\n        char name[20];\n        int rollno;\n        float marks;\n\
    };\nstruct student stu1,stu2;\nstruct student stu3;\n```\n```\n\nHere stu1, stu2\
    \ and stu3 are structure variables that are declared using the structure tag student.\n\
    \nDeclaring a structure variable reserves space in memory. Each structure variable\
    \ declared to be of type struct student has three members viz. name, rollno and\
    \ marks. The structure will reserve space for each variable sufficient to hold\
    \ all the members. For example each variable of type struct student will occupy\
    \ 26 (20+2+4) bytes.\n\n# ### 10.3&nbsp;&nbsp;&nbsp;Initialization Of Structure\
    \ Variables\n\nThe syntax of initializing structure variables is similar to that\
    \ of arrays. All the values are given in curly braces and the number, order and\
    \ type of these values should be same as in the structure template definition.\
    \ The initializing values can only be constant expressions.\n\n```\n```c\nstruct\
    \ student{\n                char name[20];\n                int rollno;\n    \
    \            float marks;\n             }stu1={\"Mary\",25,98};\nstruct student\
    \ stu2={\"John\",24,67.5};\n```\n```\n\nHere value of members of stu1 will be\
    \ “Mary” for name, 25 for rollno, 98 for marks. The value of members of stu2 will\
    \ be “John” for name, 24 for rollno, 67.5 for marks.\n\nWe cannot initialize members\
    \ while defining the structure.\n\n```\n```c\nstruct student {\n             \
    \   char name[20];\n                int rollno;\n                float marks=99;\
    \  /*Invalid*/\n             }stu;\n```\n```\n\nThis is invalid because there\
    \ is no variable called marks, and no memory is allocated for struct definition.\n\
    \nIf the number of initializers is less than the number of members then the remaining\
    \ members are initialized with zero. For example if we have this initialization-\n\
    \n```\n```c\nstruct student stu1 = {\"Mary\"};\n```\n```\n\nHere the members rollno\
    \ and marks of stu1 will be initialized to zero. This is equivalent to the initialization-\n\
    \n```\n```c\nstruct student stu1 = {\"Mary\", 0, 0};\n```\n```\n\nSome old compilers\
    \ permit initialization of only global and static structures, but there is no\
    \ such restriction in ANSI standard compilers.\n\n# ### 10.4&nbsp;&nbsp;&nbsp;Accessing\
    \ Members of a Structure\n\nFor accessing any member of a structure variable,\
    \ we use the dot ( . ) operator which is also known as the period or membership\
    \ operator. The format for accessing a structure member is-\n\n```\n```c\nstructvariable.member\n\
    ```\n```"
