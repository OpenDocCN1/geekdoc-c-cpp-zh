- pgno: 212
  md: '# 8.3.1 Declaration Of Pointer Variables


    Like other variables, pointer variables should also be declared before being used.
    The general syntax of declaration is-


    ```

    data_type *pname;

    ```


    Here pname is the name of pointer variable, which should be a valid C identifier.
    The asterisk ''*'' preceding this name informs the compiler that the variable
    is declared as a pointer. Here data_type is known as the base type of pointer.
    Let us take some pointer declarations-


    ```

    int *iptr;

    float *fptr;

    char *cptr, ch1, ch2;

    ```


    Here iptr is a pointer that should point to variables of type int, similarly fptr
    and cptr should point to variables of float and char type respectively. Here type
    of variable iptr is ''pointer to int'' or (int *), or we can say that base type
    of iptr is int. We can also combine the declaration of simple variables and pointer
    variables as we have done in the third declaration statement where ch1 and ch2
    are declared as variables of type char.


    Pointers are also variables so compiler will reserve space for them and they will
    also have some address. All pointers irrespective of their base type will occupy
    same space in memory since all of them contain addresses only. Generally 2 bytes
    are used to store an address (may vary in different computers), so the compiler
    allocates 2 bytes for a pointer variable.


    Now the question arises that when all the pointers contain addresses only and
    each one occupies 2 bytes, then why we have to mention the data type in the declaration
    statement. We will come to know about this when we study about indirection operator
    and pointer arithmetic.


    # 8.3.2 Assigning Address To Pointer Variables


    When we declare a pointer variable it contains garbage value i.e. it may be pointing
    anywhere in the memory. So we should always assign an address before using it
    in the program. The use of an unassigned pointer may give unpredictable results
    and even cause the program to crash. Pointers may be assigned the address of a
    variable using assignment statement. For example-


    ```

    int *iptr, age = 30;

    float *fptr, sal = 1500.50;

    iptr = &age;

    fptr = &sal;

    ```


    Now iptr contains the address of variable age i.e. it points to variable age,
    similarly fptr points to variable sal. Since iptr is declared as a pointer of
    type int, we should assign address of only integer variables to it. If we assign
    address of some other data type then compiler won''t show any error but the output
    will be incorrect.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/a76c706396af8b310f291a5313a27079_213_0.png)


    We can also initialize the pointer at the time of declaration. But in this case
    the variable should be declared before the pointer. For example-


    ```

    int age = 30, *iptr = &age;

    float sal = 1500.50, *fptr = &sal;

    ```


    It is also possible to assign the value of one pointer variable to the other,
    provided their base type is same. For example if we have an integer pointer p1
    then we can assign the value of iptr to it as-


    ```

    p1 = iptr;

    ```


    Now both pointer variables iptr and p1 contain the address of variable age and
    point to the same variable age.


    ![](img/a76c706396af8b310f291a5313a27079_213_1.png)


    We can assign constant zero to a pointer of any type. A symbolic constant NULL
    is defined in stdio.h, which denotes the value zero. The assignment of NULL to
    a pointer guarantees that it does not point to any valid memory location. This
    can be done as-


    ```

    ptr = NULL;

    ```


    # 8.3.3 Dereferencing Pointer Variables


    Till now we have done a lot of programming and in all our programs we have used
    the name of a variable for accessing it. We can also access a variable indirectly
    using pointers. For this we will use the indirection operator(* ). By placing
    the indirection operator before a pointer variable, we can access the variable
    whose address is stored in the pointer. Let us take an example-


    ```

    int a = 87

    float b = 4.5;

    int *p1 = &a;

    float *p2 = &b;

    ```


    In our program, if we place ''*'' before p1 then we can access the variable whose
    address is stored in p1. Since p1 contains the address of variable a, we can access
    the variable a by writing *p1. Similarly we can access variable b by writing *p2.
    So we can use *p1 and *p2 in place of variable names a'
