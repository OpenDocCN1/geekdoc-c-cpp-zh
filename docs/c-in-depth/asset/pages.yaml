    {

    int mat1[ROW1][COL1],mat2[ROW2][COL2],mat3[ROW1][COL2];

    int i,j,k;

    printf("Enter matrix mat1(%dx%d)row-wise :\n",ROW1,COL1);

    for(i=0;i<ROW1;i++)

    for(j=0;j<COL1;j++)

    scanf("%d",&mat1[i][j]);

    printf("Enter matrix mat2(%dx%d)row-wise :\n",ROW2,COL2);

    for(i=0;i<ROW2;i++)

    for(j=0;j<COL2;j++)

    scanf("%d",&mat2[i][j]);

