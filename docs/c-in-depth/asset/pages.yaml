    \ Other File Functions\n\n# 11.14.1 feof( )\n\nSo far we have used the return\
    \ value of the function to detect the end of file while reading. For example fgetc(\
    \ ), getc( ), getw( ), fprintf( ) return EOF and fgets( ) returns NULL on end\
    \ of file. But these functions return the same value both on end of file and on\
    \ error. So if a function stops reading we can't make out whether the end of file\
    \ was reached or an error was encountered. We can check separately for these two\
    \ conditions with the help of ferror( ) and feof( ).\n\nDeclaration: int feof(\
