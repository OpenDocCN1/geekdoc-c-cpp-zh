    # ## 8.21 Dynamic Memory Allocation


    The memory allocation that we have done till now was static memory allocation.
    The memory that could be used by the program was fixed i.e. we could not increase
    or decrease the size of memory during the execution of program. In many applications
    it is not possible to predict how much memory would be needed by the program at
    run time. For example if we declare an array of integers- int emp_no[200]; In
    an array, it must be to specify the size of array while declaring, so the size
    of this array will be fixed during runtime. Now two types of problems may occur.
    The first case is that the number of values to store is less than the size of
    array and hence there is wastage of memory. For example if we have to store only
    50 values in the above array, then space for 150 values (300 bytes) is wasted.
    In second case our program fails if we want to store more values than the size
    of array, for example if there is need to store 205 values in the above array.


    To overcome these problems we should be able to allocate memory at run time. The
    process of allocating memory at the time of execution is called dynamic memory
    allocation. The allocation and release of this memory can be done with the help
    of some built-in-functions whose prototypes are found in alloc.h and stdlib.h
    header file. These functions take memory from a memory area called heap and release
    this memory whenever it is not required, so that it can be used again for some
    other purpose.


    Pointers play an important role in dynamic memory allocation because we can access
    the dynamically allocated memory only through pointers.


    # ## 8.21.1 malloc()


    ```

    ```c

    void *malloc(size_t size);

    ```

    ```


    This function is used to locate memory dynamically. The argument size specifies
    the number of bytes to be allocated. The type size_t is defined in stdlib.h as
    unsigned int. On success, malloc() returns a pointer to the first byte of allocated
    memory. The returned pointer is of type void, which can be type cast to appropriate
    type o. f pointer. It is generally used as- ptr = (datatype *) malloc (specified
    size ); where ptr is a pointer of type datatype, and specified size is the size
    in bytes required to be reserved memory. The expression ( datatype *) is used
    to typecast the pointer returned by malloc() . For example-'
