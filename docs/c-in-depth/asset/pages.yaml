- pgno: 73
  md: "# 5.2 if...else\n\nThis is a bi-directional conditional control statement.\
    \ This statement is used to test a condition and take one of the two possible\
    \ actions. If the condition is true then a single statement or a block of statements\
    \ is executed (one part of the program), otherwise another single statement or\
    \ a block of statements is executed (other part of the program). Recall that in\
    \ C, any nonzero value is regarded as true while zero is regarded as false.\n\n\
    # Syntax 1:\n\n```\nif(condition)\n    statement1;\n\nif(condition)\n{\n    statement;\n\
