    # 16.1 Optimization is a Technique


    When we think about optimization, it looks like we are talking only about making
    our code shorter. But its not true, sometimes shorter code takes more execution
    time compared to large code. So here comes performance, and it depends on whether
    you want shorter code that is good for maintenance but less in performance, or
    larger code that is bad for maintenance but good in performance. Now we will come
    to resource optimization. Generally resources are shared between different processes.
    Suppose your program takes more resources, then definitely it will affect performance
    of other processes that need same resources. So we have a need to write and optimize
    our program keeping in mind resources e.g. processor''s time. You will be surprised
    to know that most of the time, increasing of hardware like processors comes only
    because of our bad programming like unnecessary variables, bad searching and sorting
    algorithms. This is because we think only about running our program properly,
    and consider about resources only after getting some problem. Companies are spending
    more than $50 million on resources, adding more than 12 processors in single server,
    only because they don''t consider other things in programs and are helpless to
    find this individual problem. So our work is not only to write program but also
    to develop the habit of writing optimized programs considering the overall view
    of system. That''s why optimization is a technique because it considers many other
    things in program not only codes. You will see more things later in each topic.


