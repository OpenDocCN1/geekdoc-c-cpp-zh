  md: "```\ns=x+y;\nreturn s;\n}\n```\n\n# 6.4 Function Definition\n\nThe function\
    \ definition consists of the whole description and code of a function. It tells\
    \ what the function is doing and what are its inputs and outputs. A function definition\
    \ consists of two parts - a function header and a function body. The general syntax\
    \ of a function definition is-\n\n```\nreturn_type  func_name( type1 arg1,type2\
    \ arg2,...... )\n{\n    local variables declarations;\n    statement;\n    ........\n\
    \    return(expression);\n}\n```\n\nThe first line in the function definition\
    \ is known as the function header and after this the body of the function is written\
    \ enclosed in curly braces\n\nThe return_type denotes the type of the value that\
    \ will be returned by the function. The return_type is optional and if omitted,\
    \ it is assumed to be int by default. A function can return either one value or\
    \ no value. If a function does not return any value then void should be written\
    \ in place of return_type\n\nfunc_name specifies the name of the function and\
    \ it can be any valid C identifier. After function name the argument declarations\
    \ are given in parentheses, which mention the type and name of the arguments.\
    \ These are known as formal arguments and used to accept values. A function can\
    \ take any number of arguments or even no argument at all. If there are no arguments\
    \ then either the parentheses can be left empty or void can be written inside\
    \ the parentheses.\n\nThe body of function is a compound statement (or a block),\
    \ which consists of declarations of variables and C statements followed by an\
    \ optional return statement. The variables declared inside the function are known\
    \ as local variables, since they are local to that function only, i.e. they have\
    \ existence only in the function in which they are declared, they can not be used\
    \ anywhere else in the program. There can be any number of valid C statements\
    \ inside a function body. The return statement is optional. It may be absent if\
    \ the function does not return any value.\n\nThe function definition can be placed\
    \ anywhere in the program. But generally all definitions are placed after the\
    \ main() function. Note that a function definition cannot be placed inside another\
    \ function definition. Function definitions can also be placed in different files.\n\
    \nIn P6.2 the function definition is-\n\n```\nvoid drawline(void)\n{\n    int\
    \ i;\n    for(i=1;i<80;i++)\n        printf(\"-\");\n}\n```\n\nHere the function\
    \ is not returning any value so void is written at the place of return_type, and\
    \ since it does not accept any arguments so void is written inside parentheses.\
    \ The int variable i is declared inside the function body so it is a local variable\
    \ and can be used inside this function only."
