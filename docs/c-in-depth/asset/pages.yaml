  md: "immediately after the label.\n\n```\n```c\n/*P5.30 Program to print whether\
    \ the number is even or odd*/\n#include<stdio.h>\nmain()\n{\n    int n;\n    printf(\"\
    Enter the number : \");\n    scanf(\"%d\", &n);\n    if(n%2==0)\n        goto\
    \ even;\n    else\n        goto odd;\n\neven :\n    printf(\"Number is even\"\
    );\n    goto end;\n\nodd :\n    printf(\"Number is odd\");\n    goto end;\n\n\
    end:\n    printf(\"\\n\");\n}\n```\n```\n\n```\n```\nEnter the number : 14\nNumber\
    \ is even\n```\n```\n\nThe label can be placed anywhere. If the label is after\
    \ the goto then the control is transferred forward and it is known as forward\
    \ jump or forward goto, and if the label is before the goto then the control is\
    \ transferred backwards and it is known as backward jump or backward goto. In\
    \ forward goto, the statements between goto and label will not be executed and\
    \ in backward goto statements between goto and label will be executed repeatedly.\
    \ More than one goto can be associated with the same label but we cannot have\
    \ same label at more than one place.\n\nThe control can be transferred only within\
    \ a function using goto statement.(Concept of functions will be introduced in\
    \ further chapters)\n\nThere should always be a statement after any label. If\
    \ label is at the end of program, and no statements are to be written after it,\
    \ we can write the null statement (single semicolon) after the label because a\
    \ program can't end with a label.\n\nThe use of 'goto' should be avoided, as it\
    \ is difficult to understand where the control is being transferred. Sometimes\
    \ it leads to \"spaghetti\" code, which is not understandable and is very difficult\
    \ to debug and maintain. We can always perform all our jobs without using goto,\
    \ and the use of goto is not favoured in structured programming.\n\nAlthough the\
    \ use of goto is not preferred but there is a situation where goto can actually\
    \ make the code simpler and more readable. This situation arises when we have\
    \ to exit from deeply nested loops."
