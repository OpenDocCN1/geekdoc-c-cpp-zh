  md: '# Chapter 12


    # The C Preprocessor


    C has a special feature of preprocessor which makes it different from other high
    level languages that don''t have this type of facility. Some advantages of using
    preprocessor are-


    +   - Readability of the program is increased.

    +   - Program modification becomes easy.

    +   - Makes the program portable and efficient.


    We know that the code that we write is translated into object code by the compiler.
    But before being compiled, the code is passed through the C preprocessor. The
    preprocessor scans the whole source code and modifies it, which is then given
    to the compiler.


    ![](img/a76c706396af8b310f291a5313a27079_392_0.png)


    The lines starting with the symbol # are known as preprocessor directives. When
    the preprocessor finds a line starting with the symbol #, it considers it as a
    command for itself and works accordingly. All the directives are executed by the
    preprocessor, and the compiler does not receive any line starting with # symbol.
    Some features of preprocessor directives are-


    +   - Each preprocessor directive starts with a # symbol.

    +   - There can be only one directive on a line.

    +   - There is no semicolon at the end of a directive.

    +   - To continue a directive on next line, we should place a backslash at the
    end of the line.

    +   - The preprocessor directives can be placed anywhere in a program (inside
    or outside functions) but they are usually written at the beginning of a program.

    +   - A directive is active from the point of its appearance till the end of the
    program.


    The main functions performed by the preprocessor directives are-


    +   1. Simple Macro Substitution

    +   2. Macros with arguments

    +   3. Conditional Compilation'
