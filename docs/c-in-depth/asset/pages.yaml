  md: "# 14.2 Storage Classes\n\nIn addition to data type, each variable has one more\
    \ attribute known as storage class. The proper use of storage classes makes our\
    \ program efficient and fast. In larger multifile programs the knowledge of storage\
    \ classes is indispensable. We can specify a storage class while declaring a variable.\
    \ The general syntax is-\nstorage_class datatype variable_name;\n\n+   There are\
    \ four types of storage classes-\n+   1. Automatic\n+   2. External\n+   3. Static\n\
    +   4. Register\n\nThe keywords auto, static, register, extern are used for these\
    \ storage classes. So we may write declaration statements like this-\nauto int\
    \ x, y;\nstatic float d;\nregister int z;\n\nWhen the storage class specifier\
    \ is not present in the declaration, compiler assumes a default storage class\
    \ based on the place of declaration.\n\nA storage class decides about these four\
    \ aspects of a variable-\n\n+   (1) Lifetime - Time between the creation and destruction\
    \ of a variable.\n+   (2) Scope - Locations where the variable is available for\
    \ use.\n+   (3) Initial value - Default value taken by an uninitialized variable.\n\
    +   (4) Place of storage - Place in memory where the storage is allocated for\
    \ the variable.\n\nNow we'll discuss all these storage classes one by one in detail.\n\
    \n# 14.2.1 Automatic\n\nAll the variables declared inside a block/function without\
    \ any storage class specifier are called automatic variables. We may also use\
    \ the keyword auto to declare automatic variables, although this is generally\
    \ not done. The following two declaration statements are equivalent and both declare\
    \ a and b to be automatic variables of type int.\n\n```\nfunc()\n{\n    int a,b;\n\
