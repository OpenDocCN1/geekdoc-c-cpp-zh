    the professional network. Participants also pointed out the ability of the metaphor
    to support traceability. It offers “a better visibility of the medical activity”
    (P2), and allows “controlling the dissemination of data which gives a feeling
    of safety” (P3). For confidential medical records shared with a student, it is
    essential to know what happens to this medical record. With another gastroenterologist,
    the responsibility is shared” (P3). However, if a student “decides to share this
    medical record with anyone, the doctor is responsible of” (P3).


    Browsing medical records is another issue. A gastroenterologist manages “about
    90 medical records every month, about 50 records every day” (P4). During his/her
    entire career, a practitioner usually collects “between 15,000 and 30,000 medical
    records” (P2 and P4). Adding the social dimension to data may facilitate the browsing.
    Indeed, participants underlined the fear of browsing a huge amount of medical
    data, in particular when asked for an “advice by phone” (P1 and P3).


    # 12.5.2.3 Social Information Seeking and Refining


    Participants appreciated the organization of the workspace according to the communities.


    However, participants also pointed out some issues: “This representation is fine
    because the pearl is small [to find a medical record]. If the pearl is small,
    we glance through the different medical records, but if the pearl is larger, how
    to find easily a medical record” (P1). Currently, doctors do “not have time to
    waste for medical record searching” (P1).


    It seems necessary to allow users searching using attributes similarly to pivot
    browsing: “by age range, type of examination or pathology, by place of examination”
    (P3). “When we search for a patient by its name, it’s because there is no relevant
    criteria for this medical'
