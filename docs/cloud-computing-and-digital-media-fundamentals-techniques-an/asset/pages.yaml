    the Apple Store or Android Market for developers to sell their products or provide
    them free of charge. Unfortunately, Canada still has one of the most expensive
    bandwidths for wireless access over the cellular telephone networks, so market
    growth of smart phones will likely be slower for lower income individuals and
    for those in rural'
