  img_proc: true
- pgno: 267
  md: '# Development of a Framework for the Desktop Grid Federation ■ 245


    ![](img/f13da3dd59d15874e4b22b03a274001b_267_0.png)


    FIGURE 10.4 The push-based volunteer computing system.


    In the CDDG federation, the broker records the credit for each organization, which
    is calculated based on the amount of resources that an organization donates to
    the others. The amount of resources is calculated in terms of CPU cycles, storage
    space, and network bandwidth. When there are two or more organizations that assign
    tasks via the federation broker, the priority is basically proportional to the
    credits. Also, in order to prevent starvation, the credits decline over time in
    a certain ratio.


    # 10.4.4 Broker Protocols


    This section discusses the communication protocols between the broker, users,
    and workers.


    # 10.4.4.1 Group Management: Join and Leave


    The group management commands are used for adding and removing users, workers,
    and broker from the system. In this report, we simply discuss the commands for
    users; the commands for other roles are similar and ignored herein.


    10.4.4.1 NEW_USER, INIT_USER, and REJECT_USER The group management protocol for
    users includes three commands: NEW_USER, INIT_USE, and REJECT_USE. A user sends
    NEW_USER command to the broker to join the desktop grid. Upon granted permission,
    the user submits his/her account information to login to the system. The broker
    replies with either a INIT_USER or a REJECT_USER message, according to the authentication
    result (Figure 10.5).'
