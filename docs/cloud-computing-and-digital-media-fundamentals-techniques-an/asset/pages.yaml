    Google proposed the fundamental architecture of distributed parallel computing
    cluster, using software control to deal with the problem of node loss that often
    happens in cluster.


    From 2003, Google has continuously presented papers that revealed the way it deals
    with distributed data and the core idea of its cloud computing technique. According
    to the papers Google presented in recent year, Google''s cloud computing infrastructure
    includes three systems that are independent but closely linked to each other:
    Google File System (GFS) [10],'
