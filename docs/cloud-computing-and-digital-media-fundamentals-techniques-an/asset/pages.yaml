    "lineage" consisting of "steering" and "completion" vectors in the memory. Through
    encoding the work performed on a tuple''s length, the operators from many queries
    can be applied in a single tuple. Meanwhile, an efficient predicate index called
    group filter is applied to reduce computation when selection predicates havealities.
    For instance, when a selection operator is inserted into a new query, its source
    field is checked whether it matches an already instantiated group filter. If the
    requirements are met, predi-cate is merged into the filter; otherwise, a new filter
    will be created with a single predicate. To avoid redundancy, the scheme splits
