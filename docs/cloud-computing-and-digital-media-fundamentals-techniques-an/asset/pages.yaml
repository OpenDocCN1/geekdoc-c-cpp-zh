    # 8.3.1 MCA-Based Classification


    Having explained how MCA is used to find correspondences between the discretized
    feature values and the class labels of a multimedia dataset, we now explain how
    such information has been used for classification in previous works (Lin and Shyu
    2010; Lin et al. 2008) and describe the reason why a direct application of MCA
    is unfeasible in big data environments. Such an explanation is necessary to understand
    our proposed MR-based MCA classification system. Since this work is oriented towards
    the task of semantic detection, we assume a training dataset with ground truth
    provided, and the goal is to determine the class labels for the instances of test.
    Moreover, we consider the multimedia data that have already been consistently
    discretized, that is, the same cut points used to discretize the training instances
    have been applied to the test instances.


    First, the MCA-based semantic classification proceeds by obtaining the cosines
    of the angles between $\{F_j\}$ and $C$ for each feature $F_j$ in the training
    dataset. Let $w_{d_j}^i$ denote the cosine of the angle between the feature value
    $F_j^i$ and $C_j$. Each $w_{d_j}^i$ is termed an MCA-based classification rule.
    Second, the class label for a test instance $i$ with feature values $\{w_{d_j}^i\}_{j=1}^F$,
    where $F$ is the number of features, is estimated by $\text{argmax } ax$ which
    yields the maximum sum of cosine values with respect to the feature values of
    $i$. We consider the set of MCA-based classification rules as the MCA model, which
    constitutes the MCA-based classifier. In addition, for ease of description, we
    term the MCA-based classification process described so far serial MCA (S-MCA)
    classification.


    The described S-MCA classification process is not suitable for big data environments
    because the dimension indicator matrix $\mathbb{Y}$ is proportional to $\mathbb{N}$,
    where $\mathbb{N}$ is the number of data instances. In a big data environment,
    it is unfeasible to load $\mathbb{Y}$ into the memory and perform the MCA steps
    previously described. We term this obstacle the MCA scalability problem. To the
    best of our knowledge, this work is the first one that provides a solution to
    this problem using MR. The experimental results we provide support our claim.'
