    # 3.2.3 Mobile Clouds


    Cloud computing is focused on pooling of resources, whereas mobile technology
    is focused on pooling and sharing of resources locally enabling alternative use
    cases for mobile infrastructure, platforms, and service delivery. Mobile cloud
    computing is envisioned to tackle the limitations of mobile devices by integrating
    cloud computing into the mobile environment. Resource-demanding applications as
    3D video games are being increasingly demanded on mobile phones. The capabilities
    of mobile networks and devices create new ways of ubiquitous interaction over
    Web 2.0 digital social networks. Consequently, mobile devices, Web 2.0, and social
    software result in an exponential growth of user-generated mobile multimedia on
    Web 2.0, which is a driving force for further cloud computing.


    Even if the hardware and mobile networks of the mobile devices continue to evolve
    and improve, the mobile devices will always be resource-poor and less secure,
    with unstable connectivity and constrained energy. Resource poverty is a major
    obstacle for many applications [13]. Therefore, computation on mobile devices
    will always involve a compromise. For example, on-the-fly editing of video clips
    on a mobile phone is prohibited by the energy and time consumption. Same performance
    and functionalities on the mobile devices still cannot be obtained as on their
    desktop personal computers (PCs) or even notebooks when dealing with tasks containing
    complicated or resource-demanding operations.'
