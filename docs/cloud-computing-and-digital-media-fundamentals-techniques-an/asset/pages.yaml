    Cloud computing is a factor for change and innovation, thanks to the increased
    efficiency of IT infrastructure utilization leading to lower costs. Cloud computing
    reduces the cost-effectiveness for the implementation of the hardware, software,
    and license for all. Large data centers benefit from economies of scale. These
    reductions in unit cost as the size of a facility and the usage levels of other
    inputs increase [12]. Large data centers can run more efficiently than private
    computing infrastructures. They provide resources to amortize the demand fluctuations
    per user basis, since the cloud resource providers can aggregate the overall demand
