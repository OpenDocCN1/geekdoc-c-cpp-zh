    cannot meet the demands for the management of extremely large-scale RDF data in
    the coming future. Moreover, the query efficiency claimed in these solutions is
    generally obtained by taking the advantages provided by the system architecture.
    Thus, these solutions are closely related to system hard states, which are hard
    to maintain.


    The other category solution is to incorporate NoSQL database to address the scalability
    and flexibility issues in the first place. Many works, such as References 39–41
    and 52–55, adopt the cloud RDF data management program. However, many of them
    focus on utilizing high-level declarative languages to create simplified user
    interface for RDF query processing, which omits the underlying optimization opportunities
    and has no guarantees on efficiency.


    There are a few works conducting RDF query processing within the MapReduce framework.
    RDFGrid [56] is an open source project, which models RDF data as objects and processes
    with Hadoop MapReduce. It provides a plug-in parser and simple aggregation processing
    of RDF data. However, join semantics and strategy still need to be defined by
    users. A greedy strategy is proposed in Reference 41, which is similar to the
    solution of Reference 39 and always tries to pick a join that may produce the
    smallest size of intermediate results. This strategy also has no guarantee on
    the overall efficiency. Husain et al. [39] presents an improved work in Reference
    40 and focuses on effective RDF data storage and querying. Our solution is different
    from Reference 39 in the following aspects. First, we partition large predicate
    files into data blocks containing *Subject (Object)* ordered triplet sequence.
    In addition, we have all data blocks organized with their content metadata attached,
    which allow for locating and processing efficient block data. Second, by identifying
    the MRJ execution plan and employing optimization techniques (hybrid join strategies
    and bloom filter), our solution promises more efficient query processing. As already
    given in the experiments, the query time of our solution can be order of magnitude
    less compared to Reference 39. Third, we use real datasets for evaluation and
    reveal how job configuration affects MRJ efficiency, which is absent in Reference
    39. Reference 16 studies the general strategy of replicating data from Map to
    Reduce that guarantees a minimal network volume in solving different kinds of
    joins with one Map-Reduce procedure. Since this framework leaves no space for
    pipelining and materialization, its practical effectiveness still needs justification.'
