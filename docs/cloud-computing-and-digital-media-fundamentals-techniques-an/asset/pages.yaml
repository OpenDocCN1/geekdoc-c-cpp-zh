    At the end of the interview, in order to identify and understand precisely their
    vision of socially augmented data, participants had fill in a qualitative questionnaire.
    This questionnaire is divided into four sections, articulated on the following:
    (1) actors, (2) data, (3) tasks, and (4) relationships between these concepts.


    # 12.5.2 Findings


    In this section, we summarize the main results related to participants’ perception
    of social data and their pearl-based representation.


    # 12.5.2.1 Pearly UI: A Social Desktop for the Cloud


    Gastroenterologists were eager to play with PearlyDesktop. As ephemeral (e.g.,
    related to students) or persistent (e.g., colleagues) medical networks are important
    aspects of their activity, participants appreciated the work-based visual representation
    (P1, P2, P3, and P4). “The structure of the interface is: the visualization at
    the center and the details displayed in the panel on the right. Legends and filters
    are meaningful and easy to use. They provide a better understanding and are useful
    to filter at a finer grain” (P2). We can view our closest contacts and shared
    folders.[etc.] It is interesting to see the referent doctor of a medical record
    or the specialist to contact for advice” (P1).


    Participants suggested improvements as the visualization of the “relationships
    within families to better detect hereditary diseases” (P2, P3, and P4) or of “similarities
    between medical records to find the right dosage of a medicine drug or to improve
    decisionmaking (P4). They also mentioned scalability as critical: How to represent
    a huge set of data without disrupting the UX? In addition, during the interview,
    several participants mentioned the importance of the temporal data: access frequency
    to a medical record, creation of medical records, or doctor’s schedule. They also
    suggested improvements including an “alphabetical sorting of medical records”
    (P2), or a “grouping of contacts [within a community] concentric circles around
    the center” (P1). Another improvement is to make a clear distinction between “active
    medical records and medical records of dead patients or patients that will never
    come back” (P2).


    # 12.5.2.2 Social Sharing and Browsing


    Participants very much appreciated the opportunity to share data, and thus to
    support a better communication among stakeholders: “situations of'
