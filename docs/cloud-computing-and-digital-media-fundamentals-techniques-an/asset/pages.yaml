    9.4.6.2 Preprocessing and Updates

    The preprocessing of raw RDF data involves four steps: (1) group by Predicate,
    (2) sort on Subject and Object for each Predicate file (the similar strategy was
    used in References 48 and 49), (3) blockwise partition for each Predicate file,
    and (4) build a "prefix tree" to manage the Predicate files. Intuitively, the
    first three steps help us obtain a content-based blockwise index for the entire
    RDF dataset. The last step is motivated by the fact that many Predicates are described
    within the same namespace. By transferring the namespace into a prefix tree structure,
    each Predicate file is stored under its prefix directory. Such a data structure
    promotes effective metadata compression and RDF semantics. Figure 9.11 shows an
    example of how the five largest Predicate files from the Billion Challenge 2009
    dataset are organized in HDFS. SO represents an ordered storage according to the
    alphabet order of Subject and vice versa.


    We take special care of Predicate files of small size. For those Predicate files
    whose sizes are less than a threshold, for example, <1% of the block size, we
    first have them merged and sorted according to the Predicate value and then split
    them into block-sized files. B-tree is used to manage these special blocks, which
    would be sufficiently small to fit into a query engine''s main memory.


    As mentioned in the previous section, the sizes of Predicate files and the selectivities
    of Subject and Object for each Predicate file will serve MRJ identification and
    scheduling. In fact, statistics collection is a side product of the data partition
    process.'
