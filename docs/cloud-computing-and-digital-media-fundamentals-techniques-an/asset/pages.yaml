    # 8.1 INTRODUCTION


    The ubiquitous reach of social sites coupled with the proliferation of mobile
    devices has brought forth an explosion in multimedia data. This fact has motivated
    the research community to develop systems that allow the meaningful retrieval
    of multimedia data. One of the requirements of the meaningful retrieval is the
    understanding of the semantics embedded in the data. However, understanding of
    the semantics is a very challenging task. The reason is the well-known problem
    of the semantic gap between low-level features and high-level semantic concepts
    (Shyu et al. 2007). Multimedia data are usually modeled using low-level features
    such as color, shape, and texture information, but such information may not be
    discriminative enough at the concept level. Two images with similar low-level
    features represent different semantic concepts. For example, querying for an image
    with a cloudy sky may return an unrelated image depicting a blue car parked in
    front of a white house. Moreover, a textual representation, for example, tags
    and file names of the, is not a feasible solution. Tagging requires a significant
    amount of human involvement that is prone to errors and inconsistent labeling
    (Shyu et al. 2007).


    Content-based multimedia retrieval (CBMIR) focuses on the understanding of the
    semantics and the retrieval of multimedia data. One important task in the realm
    of CBMIR is semantic concept detection, the purpose of which is to classify multimedia
    data into semantic concepts. Its importance is highlighted by the TREVCID conferences
    sponsored by the National Institute of Standards and Technology (NIST 2012; Over
    et al. 2012; Smeaton et al. 2009). Usually, this task involves training a classifier
    using ground truth data, followed by the classification of unlabeled test data.
    There are several classifiers proposed in the relevant literature, but in this
    work, we utilize multiple correspondence analysis (MCA) as it has been utilized
    not only as an effective classification method (Lin et al. 2008) but also as a
    discretization (Zhu et al. 2012), feature selection (Zhu et al. 2010), data pruning
    (Lin et al. 2009), and ranking mechanism (Chen et al. 2012). Based on the correlation
    information, MCA is a data analysis technique that allows us to find correspondences
    between feature values and a target concept that are helpful in bridging the gap
    between low-level features and highlevel semantic concepts.


    Nevertheless, even though MCA has shown its effectiveness in CBMIR, its direct
    application to big data is not scalable. To train an MCA classification model,
    it is required to manipulate large matrices extracted'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Large-Scale Correlation-Based Semantic Classification ■ 171


    from the training data, which impedes the useful utilization of MCA in today''s
    pervasive big data environments. Existing works that utilize MCA for CBMIR tasks
    do not take into account scalability problems that arise when processing large
    amounts of data provide a framework that effectively utilizes multiple computers
    to speed up processing. The perinent question is then how to improve the scalability
    of MCA and bring it onto the big data scale.


    In the domain of big data, MapReduce (MR; Dean and Ghemawat 2008) is the framework
    of choice for data-intensive applications. It provides an easy-to-use programming
    model and supporting processing framework for large-scale distributed applications
    and is actively used by top technology companies. Recent works in the literature
    have shown that MR can be utilized to scale CBMIR tasks, such as semantic classification
    (Basilio et al. 2011; Palit and Reddy 2010; Panda et al. 2009; Wu et al. 2009;
    Yang et al. 2009; Zhao et al. 2012), retrieval (Raj and Mala 2012; Zhang et al.
    2010), and feature extraction (Wang et al. 2012; White et al. 2010).


    In this work, we propose an MR-based MCA classification framework to support CBMIR
    in big data environments. The goal of the framework is to bring the usefulness
    of MCA in discretization, feature selection, data pruning, and classification
    tasks to large-scale CBMIR. The proposed system leverages the MR framework to
    provide distributed processing in a cluster of computers and presents a novel
    way of building MCA models that eliminates the need to process large matrices
    in memory. To the best of our knowledge, this is the first attempt to implement
    MCA as a CBMIR mechanism to process large-scale multimedia data using MR. Moreover,
    we show the usefulness of the system in big data environments by providing experiments
    that demonstrate the scalability of the system in the task of semantic concept
    classification.


    The work in this chapter is organized as follows: Section 8.2 describes the related
    work. Section 8.3 introduces MCA and describes how it is used as a classifier.
    Section 8.4 deatils the implementation of the proposed MR-based MCA classification
    framework. Section 8.5 presents the experiments and results. Finally, Section
    8.6 concludes the work.


    # 8.2 RELATED WORK


    Related literature to the work presented in this chapter consists of (1) previous
    works that apply MCA to CBMIR tasks and (2) recent works that apply the MR framework
    in CBMIR tasks. In CBMIR tasks, MCA has'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 172 ■ Cloud Computing and Digital Media


    been successfully utilized for discretization (Zhu et al. 2011, 2012), feature
    selection (Zhu et al. 2010), data pruning (Lin et al. 2009), classification (Lin
    et al. 2008; Yang et al. 2011, 2012; Zhu et al. 2013), and ranking (Chen et al.
    2012; Lin and Shu 2010). In this section, we review relevant examples. Such works
    demonstrate the usefulness of MCA in CBMIR and show the importance of having a
    framework that can support the same tasks in a big data environment. With regard
    to big data, recent works (Basilico et al. 2011; Panda et al. 2009; Yang et al.
    2009) apply the MR framework to classification tasks. These works utilize classification/modeling
    methods different from MCA and their MR implementations are orthogonal to the
    work presented here.


    Zhu et al. (2012) propose a discretization mechanism that discretizes numerical
    data based on the criteria of maximizing the correlation between feature intervals
    and class labels, utilizing MCA to measure the correlation between the feature
    values and the class labels. Their discretization strategy follows a similar recursive
    pattern to that of decision tree building. They compare the MCA-based discretization
    method against other discretization methods on six classifiers and show their
    method producing the best discretization in terms of the final classification
    results.


    Lin et al. (2008, 2009) utilize MCA for data pruning, an important task when the
    training data are imbalanced, and classification. They propose a framework that
    prunes training data based on the instances'' transaction weights. Using MCA,
    these weights consider the correlation information from the feature value pairs
    (feature-level discretization) and the class labels. The pruning threshold is
    obtained on an iterative process that selects the best threshold based on the
    FI score. They validate the MCA-based data pruning framework by noting the improvement
    in accuracy on four classifiers using the pruned data. As a classification method,
    Lin et al. (2008) utilize correlation information from MCA to generate classification
    rules. The classification model utilizes the correlation coefficients between
    the feature values and the concept labels to obtain classification rules that
    map a feature value to a concept label. For an unknown data instance, the final
    classification result is given by a majority on the class labels generated by
    the rules corresponding to the feature values of the instance. They compare the
    classification performance of the MCA-based classifier against decision trees,
    support vector machine (SVM), and naive Bayes—three of the most popular classifiers.


    Chen et al. (2012) demonstrate MCA as a re-ranking mechanism. Their proposed method
    utilizes relationships between semantic concepts to'
  merge: -1
  img_proc: true
- pgno: 195
