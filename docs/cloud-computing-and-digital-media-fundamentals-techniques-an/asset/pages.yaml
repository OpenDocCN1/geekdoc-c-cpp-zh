    # 9.4.8 Summary


    In this case, we present an efficient evaluation of SPARQL queries over large
    RDF dataset with MapReduce. By analyzing the dominating cost of MRJ, we define
    the transmission scheme from an original SPARQL query to MRJs. We propose a new
    AJ tree-based MRJ scheduling technique that guarantees an optimal query processing
    time. We elaborate our optimization techniques (hybrid join and bloom filter)
    and further explore how to fit our methodology for other join operators.


