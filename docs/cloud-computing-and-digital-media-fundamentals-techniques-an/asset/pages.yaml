    FIGURE 10.3 Organization of users and workers.


    # 10.4.2 Resource Broker


    This section presents the resource broker for allocating tasks among workers in
    several organizations. The system is called a push-based computing (PVC) system,
    since all connections to the broker, clients, and workers are all dedicated and
    allowed to push or messages immediately. For example, the clients push jobs to
    the broker that in turn pushes to workers, and the workers push or stream the
    results back to the broker that in turn pushes or streams them back to the clients
    immediately. Prompt interaction and highly dynamic job scheduling can be achieved
    (Figure 10.4).


    # 10.4.3 Broker Algorithm


    This section discusses the design and development of the resource allocation policies
    used in the resource broker of the desktop grid federation.


    In the computing environment of the desktop grid federation, resource competition
    among organizations is essential. In order to facilitate resource sharing, we
    adopt the following resource allocation principles. First, the tasks of an organization
    can be assigned to its own workers with highest priority. Thus, an organization
    donates its resources only when its task completion rate exceeds that of generation.
    Among different organizations, tasks are allocated based on fairness and starvation-free
    principles.'
