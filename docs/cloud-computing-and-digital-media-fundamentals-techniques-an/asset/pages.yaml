    # 7.2.2 Constructing a Globally Optimal Execution Plan for Multiple Queries


    As sharing of common subexpressions during execution is not always better than
    independent execution of multiple queries, blindly using common subexpressions
    may not always lead to a globally optimal plan [6,7]. Instead, the use of common
    subexpressions should be determined based on cost-benefit analysis. It has been
    shown for small problem sizes up to 10 queries, near-optimal global plans can
    be generated very efficiently through exhaustive strategies. However, as the number
    of queries increases, the exhaustive MQO solutions become impractical, calling
    for heuristic methods [7].


    Sellis [6] gives two alternative architectures for generating a global access
    plan (GAP). Architecture 1 (plan merger) makes the use of existing query optimizers.
    A conventional local optimizer generates one locally optimal access plan per query,
    and a plan merger examines all access plans and generates a GAP for the system
    to execute. Architecture 2 (global merger) is not restricted to solely using locally
    optimal plans. It relies on a global optimizer to process the set of queries and
    generates a GAP.


    Interleaved algorithm. Sellis [6] gives an exhaustive interleaved execution (IE)
    algorithm. It decomposes queries into smaller subqueries and runs them in order,
    depending on the various relationships among the queries. Then the results of
    subqueries are assembled to get the answers of the original queries. It proceeds
    as follows: First, the queries that overlap on some selections or joins are identified
    by checking the base relations that are used. For any query that overlaps with
    some other query, its corresponding local access plan is considered. A directed
    labeled graph, GAP representing the union of all such local plans, is then built.
    Some transformation rules (i.e., proper implications, identical nodes, and recursive
    elimination) are enforced on the graph, taking the effects of common subexpressions
    into account. The transformed final direct graph is the GAP that is generated
    by IE algorithm. Note that IE algorithm keeps the partial order'
