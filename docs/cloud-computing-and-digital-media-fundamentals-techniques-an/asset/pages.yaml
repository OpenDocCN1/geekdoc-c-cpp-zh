    # 4.1 BASICS OF QUERY BY SINGING/HUMMING AND QUERY BY EXACT EXAMPLE


    Query by singing/humming (QBSH) is an intuitive and successful paradigm for music
    information retrieval (MIR), allowing a user to retrieve a desired song by singing
    or humming a portion of the song. The user''s humming or singing is recorded by
    a smartphone app or Web interface. The recording (or its pitch) is then sent to
    a server that returns a result within seconds. The typical workflow of such a
    QBSH system is shown in Figure 4.1.


