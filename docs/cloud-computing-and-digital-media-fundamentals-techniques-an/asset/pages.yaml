  img_proc: true
- pgno: 97
  md: '# Supporting Practices in Professional Communities ■ 75


    The decision for partitioning is done as an optimization problem according to
    the input on the cloud side and devices, such as CPU load, available memory, remaining
    battery power on devices, and bandwidth between the cloud and the devices. Third,
    based on the solution of the optimization problem, our middleware offloads parts
    to the remote clouds and returns the corresponding results back. Two Android applications
    on the top of MACS demonstrate the potential of our approach.


    The goal of our MACS middleware is to enable the execution of elastic mobile applications.
    Zhang et al. [20] consider elastic applications to have two distinct properties.
    First, an elastic execution is divided partially on the device and partially on
    the cloud. Second, this division is not static but is dynamically adjusted during
    the run of the application. The benefits of having such application model are
    that the mobile applications can still run independently on mobile platforms,
    but can also reach cloud resources on demand and availability. Thus, mobile applications
    are not limited by the constraints of the existing device capacities. The technical
    details of this approach are covered in a previous work [38].


    The results show that the local execution time can be reduced a lot through offloading,
    which is sometimes not acceptable for the users to wait for, and by pushing the
    computation to the remote cloud can lower the CPU load on mobile devices significantly,
    thanks to the remote cloud, since most of the computations are offloaded to the
    remote cloud. Meanwhile, lots of energy can be saved, which indicates that the
    users can have more battery time compared to the local execution. The results
    also prove that the overhead of our framework is small.


