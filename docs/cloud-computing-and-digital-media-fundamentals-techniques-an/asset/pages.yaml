    # 3.6 CONCLUSIONS AND OUTLOOK


    The aim of this chapter is to shed light on how mobile cloud computing can be
    applied to support the practices of professional communities, specifically their
    needs, from the point of view of multimedia and knowledge sharing ISSs. Mobile
    professional communities exhibit complex structure and dynamic processes that
    reflect on the IS support. The utility-like resource provisioning of cloud resources
    serves perfectly to the membership nature of professional communities. Software-as-a-service
    (SaaS) concept of cloud computing provides means for unlim configurations and
    mash-ups of community services to match any emerging IS requirement. In this chapter,
    we identified three models of mobile cloud computing, each with benefits and drawbacks,
    which affect UX, availability, responsiveness, and costs of the multimedia services
    can be contemplated from a media-theoretic perspective and organizational theoretic
    perspective. This combination of perspectives helps us to understand the knowledge
    creation and learning processes within professional communities. Finally, this
    chapter provided a brief overview of some systems developed in our group, which
    cover most of the multimedia service needs identified for an IS support of professional
    communities. The experimental results provide a support for the mobile cloud approach
