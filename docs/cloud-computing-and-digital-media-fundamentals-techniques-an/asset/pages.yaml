    As research needs to synchronize the course file on different devices, the instability
    of network is the first problem that is met. The learning assistant on the mobile
    devices and encounters the disconnection of the network. If the file is broken
    when disconnected, the incomplete file cannot be used normally. To solve this
    problem, we try to divide the file into several parts. The course file sends these
    parts to the learning center and learning assistant to store, and generates an
    association table. This table saves the name of the course file, the status, the
    access time, and the file name of each part in the XML format, and use universal
    unique identifier (UUID) to ensure the uniqueness of course file. The system controls
    the size of each part in a certain range. According to this, the learning assistant
    will download the course file to the learning center. When the user is in learning
    status, learning assistant will change the content of the table to monitor the
    status, and synchronize with the learning center in each connection.


