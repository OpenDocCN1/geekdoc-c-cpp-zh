    # 12.1 RESEARCH CONTEXT AND PROBLEM


    Moving away from a classic and monolithic computing model based on local resources,
    cloud computing pushes the boundaries to fully rely on online resources, and invites
    inventor to reconsider interaction metaphors for cloud-based environments. As
    cloud computing combines and leverages the existing technologies already available
    in data centers (huge storage and computation capacities, virtualized environments
    based on high-speed data links) (Zhang et al. 2010b), users now have ubiquitous
    access to on-demand services in a pay-as-you-go manner (Mell and Grace 2009):
    “Virtualization makes it possible for cloud computing’s key characteristics of
    multi-tenancy, massive scalability, rapid elasticity and measured service to exist”
    (Carlin and Curran 2012).


    This evolution raises several issues in human-computer interaction (HCI), as follows
    the following: How to cope with offline situations (loss of connectivity, failures)
    (England et al. 2011; Stuerzlinger 2011; Terrenghi et al. 2010; Vartiainen and
    Väänänen-Vainio-Mattila 2011)? Which persuasive technologies would foster sustainability
    and power energy savings (Pan and Blevis 2011)? To what extent would migration
    from a conventional desktop to a cloud web-based setting user experience (UX)
    and impact UI consistency (England et al. 2011; Pham 2010)? Are privacy, trust,
    and data ownership UX issues (Armbrust et al. 2010; England et al. 2011; Odom
    et al. 2012)? Which plasticity must allows UIs to have the dynamic and ubiquitous
    provision of services? Which design would appropriately address traceability,
    control of data, and sharing issues raised by the socialization of cloud services
    and online activities (Odom et al. 2012; Zhang et al. 2010a)? This work focuses
    on the last issues.


    This work investigates how to make the desktop metaphor evolve so that it integrates
    cloud-based services and activities, and thus it supports the convergence of cloud
    and social computing (Pham 2010). Currently, the classic desktop metaphor is single-user,
    data-centered, and designed'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Pearly User Interfaces for Cloud Computing ■ 305


    for the use of local resources. As a first approach, we consider the social dimension
    of the desktop and agree on representing the relationships between data, people,
    activities, and services (Väänänen-Vainio-Mattila et al. 2011; Zhang et al. 2010a)
    so that it promotes the social worth of data. However, classic hierarchy-based
    folder metaphor does not suit anymore for online repositories supporting social
    sharing (Odrom et al. 2012; Shami et al. 2011). This chapter proposes the concept
    of Pearly UIs for cloud and social computing. It first browses the state of the
    art, and then reports the invention, implementation, and evaluation of Pearly
    UIs in the context of health care.


    # 12.2 RELATED WORKS


    This section covers the convergence of cloud and social computing. We identify
    three classes of research: the social desktop for the cloud with online resources
    and the socialization of services; the social navigation and sharing with privacy
    and traceability issues; and information seeking/refining to cloud with big data
    and scalability.


    # 12.2.1 Social Desktop for the Cloud


    The application-centric model of the traditional desktop is progressively fading
    away: More and more applications and services are deployed in clouds and made
    available as Web applications. However, moving to a full Web-based environment
    breaks down the guaranty of consistent UIs and leads to a fragmented UX (England
    et al. 2011; Pham 2010).


    A possible explanation of this failure (Pham 2010) may be that the current desktop
    metaphor “heavenily reflects” the local nature of resources, “grounded firmly
    in hierarchy and physical locations” and “evolved little to support sharing and
    access control.” As a consequence, the “social desktop” was proposed based on
    the concept of user-created groups. This concept extends the folder metaphor to
    encompass files, people, and applications. Compared to the usual folder metaphor,
    a unique instance of an object may be included in different groups, providing
    a lightweight means to allow sharing and access: As a group is associated with
    users, access is implicitly granted to the members of the group, allowing file
    sharing.


    Similarly, CloudRoom (Terrenghi et al. 2011) is a new desktop metaphor for the
    cloud, focusing on storage and data retrieval issues. It partitions the desktop
    into three separate areas (planes in a 3D space) to organize data: (1) a long-term
    and persistent storage, (2) a timeline overview, and'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 306 ■ Cloud Computing and Digital Media


    (3) a temporary storage for work-in-progress activities. It allows session sharing
    with contacts.


    Before the advent of cloud and social computing, when e-mail, voice mail, or instant
    messaging were considered as prevalent communication tools supporting social networking,
    Whittaker et al. (2004) first pointed out the limits of the current desktop to
    social interfaces. ContactMap is a social software application primarily designed
    to support communication-oriented tasks. The social desktop is the central element
    of ContactMap: Similar to workspaces, it allows to structure and to visually represent
    social information as groups of contacts.


    In computer-supported cooperative work (CSCW), Voida et al. (2008) advocated moving
    away from a document- and application-centric desktop to an activity-centric desktop,
    encompassing collaborative activities, and thus the social dimension. In particular,
    the Giornata interface includes a contact palette allowing users to manage contacts
    (individuals or groups) and providing a lightweight means for file sharing.


    Grudin (2010) observed that CSCW is slowly moving toward CSCW as “collaboration,
    social computing, and work,” which, from a user-centered point of view, is a foundation
    of cloud computing.


    # 12.2.2 Social Sharing and Browsing


    “Online networks have become indispensable tools for information sharing” (Kair
    et al. 2012). Still, it is difficult for users to target specific parts of their
    network. Google+s Circles are similar to Pham’s user-created groups: user’s social
    network is structured into circles allowing information sharing with parts of
    his/her social network. However, there is a lack of awareness to trace shared
    information from circles to circles.


    Shami et al. (2011) focus on social file sharing in enterprise, considering the
    social worth of files. Social metadata are added to files as extra attributes.
    Such metadata allow a non-hierarchical file organization. In addition, metadata
    facilitate pivot browsing (i.e., parameterized browsing based on metadata). To
    do so, the authors have developed the Caitail file sharing system. The system
    is able to reveal social activity around files using a time-based stream of recent
    events. Access is supported through three levels of sharing: private, confidential,
    and public.


    Several works have explored metadata to promote different and more efficient file
    organizations. In particular, Dour (2003) introduced the concept of placeless
    document, a paradigm based on document properties'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Pearly User Interfaces for Cloud Computing ■ 307


    that cover both external (e.g., creation date) and internal properties (e.g.,
    it is a photo of me and my son).


    # 12.2.3 Social Information Seeking and Refining


    Information seeking is another facet of the convergence of cloud and social networking.
    For instance, the social worth of data is also considered to improve Web search
    engines (Muralidharan et al. 2012): Web search is augmented with social annotations.
    The goal is “to make relevant social activity explicitly visible to searchers
    through social annotations.” Such an approach is similar to social metadata. In
    particular, social annotations are another contextual key to facilitate and improve
    information refining (i.e., orienting). For instance, for local file storage,
    Sawyer et al. (2012) have developed a system that detects people and groups present
    at the time a piece of information is used or created. Therefore, files are tagged
    with information (i.e., social orbits) about the present physical context of the
    social interactions. Thus, social orbits are similar to Pham’s user-created groups.


    From this broad state of the art, let us conclude that although HCI about cloud
    computing is still in its infancy, recent works show a growing interest in this
    topic. It appears that big data, social networks for data sharing, communication,
    and collaborative activities are becoming centrally and finally linked. However,
    cloud services are still unexplored. Therefore, we propose the “pearl” metaphor
    to present users socially augmented entities (SAEs) as well as the services available
    in the cloud.


    # 12.3 CASE STUDY: HEALTH-CARE INFORMATION TECHNOLOGY


    Health is particularly interesting for information technology (IT). With the evolution
    of practices and legislation, medical practitioners increasingly need tools for
    the production of images and the follow-up of medical records. Gastroenterology,
    the domain under study in this work, strongly relies on endoscopic images for
    decision making, evaluation of practices as well as for education and research.
    A medical challenge is to export endoscopic images outside the operating room,
    in the cloud for instance.


    To understand medical practices and to identify users’ needs, thorough study of
    the field has been conducted in three phases: (1) meetings with doctors and secretaries,
    (2) analysis and modeling of their needs, and (3) validation of this work with
    different actors. This study resulted in several models of the patient care process
    in gastroenterology [17 use cases,'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# 308 ■ Cloud Computing and Digital Media


    10 task models, and 29 Unified Modeling Language (UML) diagrams. The models have
    been validated by medical practitioners, and thus make a strong know-how explicit
    in the field.


    The models revealed not only the importance and variety of medical data, but also
    a crucial need for medical software applications that better support the social
    dimension of medical activities: sharing medical data, easily communicating with
    colleagues to get advices, better capitalizing medical knowledge, and better supporting
    medical decision making. More precisely, medical practitioners expand four socio-professional
    networks: (1) health workers, including colleagues, experts, and friends; (2)
    academics and students; (3) health workers involving follow-up of inpatients;
    and (4) institutions. However, in practice, information sharing is still informal
    (e.g., by phone), in particular for medicole reasons, depriving practitioners
    from peer-decisions, and giving them the feeling of being alone.


    Based on these findings, we first improved the usability of the software (named
    Sseo*) by the practitioners (giving rise to Sseo*; Figure 12.1), and then retargeted
    it for the cloud (giving rise to the PearlyDesktop running prototype; Figure 12.2).
    The redesign of Sseo* was driven by two requirements: the improvement of health-care
    quality and the ability to


