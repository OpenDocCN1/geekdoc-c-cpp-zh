    cloud multimedia services, potential mobile cloud multimedia applications include
    storing documents, photos, music, and videos in the cloud; streaming-audio and
    video in the cloud; coding/decoding audio and video in the cloud; interactive
    cloud advertisements; and mobile cloud gaming.


    In this chapter, we presented the state of the art and practices of mobile multimedia
    cloud computing with perspectives of scenario examination, requirement analysis,
    architecture design, and cloud multimedia services. Research in mobile multimedia
    cloud computing is still in its infancy, and many issues in cloud multimedia services
    remain open, for example, how to design a proxy in mobile cloud for manipulating
    3D content on demand to favor network bandwidth usage and rendering process, how
    to reduce the energy consumption of a mobile device, how to accelerate mobile
    multimedia cloud computing utilizing P2P technology (i.e., P2P-enabled mobile
    multimedia cloud computing), and so on.


