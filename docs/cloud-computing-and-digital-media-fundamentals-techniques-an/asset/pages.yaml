    # 13.2.2.1 Adoption of DICOM Standard in EHRs


    Radiology information systems (RISs) are employed to manage diagnosis reports
    generated for reviewing medical diagnostic images. These depend on PACS to manage
    medical diagnostic images. The protocols for storing and communicating such data
    are specified by standards such as DICOM. The DICOM standard defines data structures
    and services for the vendor-independent exchange of medical images and related
    information [20]. Unlike other EHR standards, DICOM uses a binary encoding with
    hierarchical lists of data elements identified by numerical tags and a complex
    DICOM-specific application level protocol. Thus, to make the EHR standards interoperable
    and also to lay the foundation of multimedia EHRs, the DICOM standards for images
    have been adopted. Using these international standards, EHRs can be implemented
    to transmit images and image-based reports among the various providers. A recent
    example is by Oracle [21,22]. Oracle has come with an enhanced version of DICOM
    standards. It has named it “Oracle Multimedia DICOM.” The architecture [22] of
    this multimedia DICOM has two perspectives: the database tier (Oracle database)
    and the client tier (thick clients). The oracle database holds DICOM content.
    The content stored in a column of a table can include DICOM data such as X-rays,
    ultrasound images, and magnetic resonance images. In the client tier, the ability
    to access Oracle Database DICOM (ORDicom) objects in the database is supported
    through Oracle Multimedia DICOM Java API. Oracle Multimedia DICOM also supports
    automatic extraction of any or all 2028 standard DICOM metadata attributes [21]
    as well as any selected private attributes search and business intelligence applications.
    Built-in functions convert DICOM to Web-friendly formats such as JPEG, GIF, MPEG,
    and AVI that can generate new DICOM format from legacy formats. They have tried
    to enhance the existing DICOM standard by making additional changes to the architecture
    and even to the storage of data, to make query processing and information retrieval
    agile and fast.


    # 13.2.2.2 Multimedia Unique Identifier: Standardized Effort


    For integration of multimedia data with EHR systems, one of the challenges is
    multimedia unique identifier (MUI) of the multimedia data. Multimedia data are
    generated from different vendors for different purposes, for different departments
    for patients. Research is needed to find out the standardized efforts for generating
    unique identifier for multimedia data of a single patient. Reports based on multimedia
    data such as'
