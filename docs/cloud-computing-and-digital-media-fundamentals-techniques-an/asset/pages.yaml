    provides personal file storage and collaboration tools. No fee cloud access is
    important for literacy learners as it provides an easier computing environment
    to learn in, and low-literacy rates go hand with low computer literacy. No fee
    access an Internet identity and a continuing address for the homeless and low-income
    earners forced to move on a frequent basis.


    Moreover, with the appearance of more inexpensive notebook computers, tablets,
    and smartphones, the cost of each access point is lowered, and thus, the cost
    of setting up public service and Internet access facilities is decreasing rapidly.
    Everyone can afford these cheap devices, with an expansion of no charge public
    WiFi, they will have continuous access to the Internet and the cloud.


    The mobile phone market has grown to the point where there are more mobile phones
    than any other computing device. Each year, more of these smartphones capable
    of higher order computing tasks, displaying text, images, and video, and accessing
    the Internet. These devices are capable of connecting to and through the cloud
