  md: '# 16 Cloud Computing and Digital Media


    Cloud multimedia rendering as a service [1] is a promising category that has the
    potential of significantly enhancing the user multimedia experience. Despite the
    growing capacities of mobile devices, there is a broadening gap with the increasing
    requirements for 3D and multiview rendering techniques. Cloud multimedia rendering
    can bridge this gap by conducting rendering in the cloud instead of the mobile
    device. Therefore, it potentially allows mobile users to experience multimedia
    with the same quality available to high-end PC users [21]. To address the challenges
    of low cloud bandwidth and high scalability, Wang et al. [1] proposed a rendering
    adaptation technique, which can dynamically vary the richness and complexity of
    graphic rendering depending on the network and server constraints, thereby impacting
    both the rate of the rendered video that needs to be streamed back from the cloud
    server to the mobile device and the computation load on the cloud servers. Zhu
    et al. [3] emphasized that the cloud equipped with GPU can perform rendering due
    to its strong computing capability. They categorized two types of cloud-based
    rendering: (1) to conduct all the rendering in the cloud and (2) to conduct only
    computation-intensive part of the rendering in the cloud while the rest would
    be performed on the client. More specifically, an MEC with a proxy can serve clients
    with high QoE since rendering (e.g., view interpolation) can be done in the proxy.
    Research challenges include how to efficiently and dynamically allocate the rendering
    resources and design a proxy for assisting mobile phones on rendering computation.


    Cloud multimedia streaming as a service utilizes cloud resources to perform computation-intensive
    tasks of encoding and transcoding in order to adapt to different devices and networks.
    Cloud multimedia streaming services utilize the elasticity provided by cloud computing
    to cost-effectively handle peak demands. Cloud-based streaming can potentially
    achieve a much lower latency and provide a much higher bandwidth due the large
    number of servers deployed in the cloud. Cloud multimedia sharing services also
    increase media QoS because cloud–client connections almost always provide a higher
    bandwidth and a shorter delay than client-client connections. The complexities
    of cloud multimedia sharing mainly reside in naming, addressing, and accessing
    control [3].'
