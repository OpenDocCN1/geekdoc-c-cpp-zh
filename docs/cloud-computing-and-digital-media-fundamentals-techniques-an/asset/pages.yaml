- pgno: 288
  md: '# 266 Cloud Computing and Digital Media


    matching pair of keypoints, the RANSAC paradigm is used to compute the epipolar
    geometry constraint of fundamental matrix and set up the homography matrix.


    The RANSAC procedure is opposite to that of conventional smoothing techniques:
    Rather than using as much of the data as possible to obtain an initial solution
    and then attempting to eliminate the invalid data points, RANSAC uses as small
    an initial dataset as feasible and ensures with consistent data when possible.
    For instance, given the task of fitting an arc of a circle to a set of 2D points,
    the RANSAC approach would be to select a set of three points, compute the center
    and radius of the implied circle, and count the number of points that are close
    enough to circle to suggest their compatibility with it (i.e, their deviations
    are small enough to measurement errors). If there are enough compatible points,
    RANSAC would employ a smoothing technique, such as least squares, to compute an
    improved estimate for the parameters of the circle now that a set of mutually
    consistent points has been identified.


    The formal RANSAC procedure is stated as follows:


    +   1. Given a model that requires a minimum of $n$ data points to instantiate
    its parameters, and a set of data points $P$ such that the number of points in
    $P$ is greater than $\#(P) \ge n$ randomly select a subset $S1$ of $n$ data points
    from $P$ and instantiates the model. Use the instantiated model $M1$ to determine
    the subset $S1^*$ of points in $P$ that are within some error tolerance of $M1$.
    The set $S1^*$ is called the consensus set of $S1$.


    +   2. If $\#(S1^*)$ is greater than some threshold $T$, which is a function of
    the estimate of the number of errors in $P$, use $S1^*$ to compute (possibly using
    least squares) a new model $M1^*$.


    +   3. If $\#(S1^*)$ is less than $t$, randomly select a new subset $S2$ and repeat
    the above process. If, after some predetermined number of trials, no consensus
    set with $t$ or more members has been found, either solve the model with the largest
    consensus set found or terminate in failure.


    The RANSAC paradigm contains three unspecified parameters: (1) the error tolerance
    used to determine whether a point is compatible with a model, (2) the number of
    subsets to try, and (3) the threshold $T$, which is'
