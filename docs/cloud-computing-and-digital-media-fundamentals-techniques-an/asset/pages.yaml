    # 3.1 INTRODUCTION


    Over the past decades, new media, new technologies and devices, and new ways of
    communication continuously define new formats of practice of professionals or
    knowledge workers. For instance, the worldwide access to heterogeneous information
    over the Internet has created a lot of means for cooperative work. Social software
    well known by examples such as the digital photo sharing platform flickr.com,
    the video sharing platform youtube.com, or the social bookmarking platform del.icio.us
    can be broadly defined as an environment that supports the activities in digital
    social networks [1]. Professionals change their work styles according to the new
    possibilities.


    Similarly, mobile devices together with mobile multimedia are changing practices,
    just as the computer and the Internet have fundamentally pushed a similar transformation
    few decades ago. Mobile phones have been transformed into digital Swiss knives
    equipped with a multitude of applications that can achieve a variety of tasks.
    Mobile devices make the information fusion of real life and virtual life possible.
    Individuals get more flexibility and mobility to communicate with other persons.
    Emerging mobile technologies include enhanced flexibility and mobility for end
    users, improving productivity and enabling social interactivity via personal mobile
    devices'' availability of context information. Handheld devices such as smartphones
    and tablets, mobile televisions, digital camcorders, and personal media players
    become an integral part of the Web, where multimedia is one of the core technologies
    underpinning the mobile growth worldwide.


    These concepts are being unified under the emerging cloud computing paradigm [2].
    The cloud computing model has recently been well explored for enterprise consumers
    and service providers [3], but little attention is paid to mobile communities.
    How cloud computing supports mobile'
