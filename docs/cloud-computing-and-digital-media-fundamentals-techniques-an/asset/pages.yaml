    Figure 5.9, compared with the three streams, the latency trends are similar but
    small differences exist due to the interval gap of video uploading. The short
    start-up latency, except for the beginning of the curve, indicates that the uploaded
    videos are shorter than others. In our uploading streams, some large video segments
    are uploaded to the server at the beginning, so they have to wait until other,
    smaller ones are encoded first. Thus, the start-up latency for these large segments
    is long. Although the start-up latency for an individual segment might be large,
    the overall latency is contrarily small. Overall, the start-up latency of SJF
    is smaller compared to that of FIFO, but the gap decreases as the workload grows.
    The average start-up latencies of FIFO and SJF with different workloads are listed
    in Table 5.4.


