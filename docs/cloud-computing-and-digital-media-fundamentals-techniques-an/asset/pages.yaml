    re-rank classification results. Based on the correlation information obtained
    from MCA, such relationships between semantic concepts are categorized as inclusive
    and exclusive relationships. The former represent high co-occurrence between a
    target semantic concept and a reference semantic concept, that is, an inclusive
    relationship means that the two semantic concepts are likely to appear together.
    The exclusive relationship represents low or nonexistent co-occurrence, that is,
    the appearance of one concept indicates a low chance for the appearance of the
    other concept. Using the average precision measure, they compare the MCA-based
    re-ranking method against the ranking produced by the subspace model proposed
    by Lin and Shyu (2010).


    Yang et al. (2009) present an MR-based, semantic modeling framework called robust
    subclass bagging (RB-SBag) algorithm. The RB-SBag is ensemble learning method
    that combines random subspace bagging with forward model selection. The latter
    is utilized to compose classifiers based on the most effective base models. They
    compare the RB-SBag method with SVM and show RB-SBag features a speedup by an
    order of magnitude on learning with competitive performance. The MR-based implementation
    consists of a two-state MR process. In the first stage, an MR job partitions the
    training data and builds a pool of base models, without using a reduce function.
    In the second-state MR, the map function computes the classification results of
    the base models on a validation set and conducts forward model selection. The
    reduce function then combines the base models with composite classifiers.


    Panda et al. (2009) introduce an MR-based framework for learning tree models over
    large datasets. Their framework is PLANET, which stands for parallel learner for
    assembling numerous ensemble trees. To construct one tree model over the entire
    training data, PLANET performs several iterations of MR jobs, where each job computes
    the splits for the current tree over the training data. The first MR job in the
    iteration creates an empty tree model, so it computes the best split for the top
    node of the tree model. A controller schedules the execution of MR jobs. Using
    boosting or bagging to build ensemble of tree models by instructing the controller
    to schedule more than one tree model. They showcase the scalability of PLANET
    against in-memory implementation of tree models.


    Basilico et al. (2011) propose an MR-based, mega-ensemble learning method that
    combines multiple random forests. The framework is called COMET, which stands
    for cloud of massive ensemble trees. Different from'
