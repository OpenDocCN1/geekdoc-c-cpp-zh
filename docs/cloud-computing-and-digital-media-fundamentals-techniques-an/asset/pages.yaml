- pgno: 9
  md: '# Foreword


    CLOUD COMPUTING WAS INITIALLY ONLY AIMING AT PROVIDING on-demand computing via
    shared pools of computational infrastructure. In just a few years, cloud computing
    has dramatically expanded its horizon to offer on-demand services to a broad range
    of configurable resources-sharing scenarios in networking, servers, storage, software,
    and applications. Such a thriving development of cloud computing is largely credited
    to an array of attractive benefits that include on-demand self-service provision,
    Internet-wide and device-independent access, rapid response to dynamic service
    requests, and usage-based pricing. The expansion from computational infrastructure
    sharing to a broader range of common resource sharing props cloud computing into
    many new application domains that were not considered possible even when cloud
    computing was originally introduced.


    Although we have witnessed an unprecedented boom in the development of various
    cloud computing-related technologies, commercially viable cloud computing services
    are still considered to be at an early stage of market adoption. However, according
    to many marketing analytics, cloud computing revenues have been, and continue
    to be, growing strongly. Based on recent forecasts by leading market analysis
    firms, the compound growth rate for cloud computing services should remain at
    20% or even higher for the next few years. A strong revenue growth should in turn
    fuel more comprehensive innovations in both technology and application development.
    We have every reason to anticipate a profound penetration of cloud computing technology
    into all walks of digital life in the years to come.


    Among various technical disciplines that have been vigorously impacted by cloud
    computing, digital media is probably the most prominent beneficiary from the recent
    advances in cloud computing. One reason for this pronounced impact can be attributed
    to the unique characteristics'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Foreword


    of digital media in its enormous data volume and real-time requirement throughout
    the entire application life cycle from generation, encoding, storage, processing,
    transmission, reception, and consumption of digital media. Cloud computing services,
    with their on-demand provision in nature, have been able to offer an extremely
    flexible platform for hosting a wide variety of digital media applications to
    take full advantage of virtually unlimited resources for the deployment, management,
    retrieval, and delivery of digital media services.


    Many digital media applications are indeed demanding computing at the data center
    for an efficient management of media contents so as to release the burden of computational
    requirements for media terminals. Such applications are very suited for the most
    acknowledged cloud computing service class known as infrastructure as a service
    (IaaS). The demands for intensive computation typically involving processing metric
    data with parallel machines at cloud centers. More recently, two new types of
    cloud computing services, known as a service (SaaS) and platform as a service
    (PaaS), have also been recognized as having the potential to substantially change
    the way media content is accessed by consumers distributed over scattered geographical
    locations worldwide. Among this diverse set of digital media applications, can
    also be captured as software applications running on an underlying cloud computing
    infrastructure as services that are readily accessible via Web browsers from any
    terminal at any location. Emerging digital media applications can also be deployed
    at cloud computing infrastructure using programming languages and toolsets as
    PaaS to host a variety of digital media toolsets for both enterprise and individual
    consumers.


    The contemporary necessity of a ubiquitous access requirement for increasing mobile
    device users has boosted the adoption of cloud computing for digital media enterprises
    and executives. Most cloud centers can be considered as geographically neutral
    because they can be accessed by mobile devices from locations worldwide. This
    is this characteristic of cloud services that enables digital media companies
    to develop new and better ways to quickly and efficiently deliver media content
    to fine-grained consumers. Using cloud computing services, digital media enterprises
    will be able to capture the greatest opportunity of efficient delivery because
    cloud centers allow content storage, media processing, and media distribution
    to be colocated and seamlessly coordinated. The cloud-based strategy can also
    improve media companies'' competitive advantage'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'through a faster and universal infiltration of multichannel (both wired and
    wireless networks) and multiscreen (fixed, tablet, laptop, and smartphones) markets
    with potentially reduced operation costs.


    However, mobile media also poses significant challenges in the evolving paradigm
    of cloud computing. At the center of these challenges is the significant unbalance
    in computational and storage capabilities between the cloud centers and mobile
    devices that triggers the necessary shift of intensive media operations from client
    mobile devices to cloud centers. Resource optimization becomes the major challenge
    for cloudbased digital media applications, especially for new media services that
    involve multicannels and multiscreens. To meet the demands from various media
    flows, novel solutions are needed to shift computational and storage loads from
    mobile devices to the cloud, to perform load balancing within a cloud, and to
    allocate resources across multiple clouds.


    Emerging applications of cloud computing have outreach to a broader range beyond
    digital media services. Two noticeable areas of such emerging applications are
    in health care and education. In health care, one central issue is the migration
    of currently hosted electronic health record databases to the cloud-based service
    infrastructure to achieve reduced health-care integration costs, optimized resource
    management, and innovative multimedia-based electronic health records. In education,
    the ubiquity of cloud computing service centers facilitates pervasive learning
    environment for both continuing education of common people and asynchronous tutoring
    of personalized learners.


    As the landscape of new technologies for cloud computing and its applications
    changes at a steadfast pace, it is very much desired to have a comprehensive collection
    of articles in various topics in cloud computing as as their applications in digital
    media. This excellent book coeded by Kwan-Chi Li, Qi Li, and Timothy K. Shih covers
    the fundamentals of cloud and media infrastructure, emerging technologies that
    integrate cloud and digital media with cloud computing, and real-world applications
    that exemplify the potential of cloud computing for next-generation digital media.
    Specifically, this book covers resource optimization for multimedia cloud computing,
    a key technical challenge in adopting cloud computing for various digital media
    applications. It also contains several important new technologies in cloud computing
    and digital media such as query processing, semantic classification, music retrieval,
    multimedia, and video transcoding. In addition, this book also includes several
    chapters to illustrate emerging health-care and educational applications of'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'cloud computing that shall have a profound impact on the welfare of mass populations
    in terms of their physical well-being and intellectual life. This book is indeed
    a must read not only for the researchers, engineers, and graduate students who
    are working in the related research and development topics but also for technology
    company executives, especially media their business models and market trends.
    I expect that the timely contributions from these distinguished colleagues shall
    have prominent influences on the continued flourishing of research and development
    in cloud computing and digital media.


    Chang Wen Chen

    State University of New York

    Buffalo, New York'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Preface


    LOUD COMPUTING HAS APPEARED AS A NEW TREND FOR BOTH computing and storage. It
    is a computing paradigm where hardware and network details are abstracted and
    hidden from the users who no longer need to have expertise in or control over
    the technology because the infrastructure “in the cloud” should support them.
    Cloud computing describes a new supplement, consumption, and delivery model based
    on the Internet, where shared resources, software, and information are provided
    on demand to computers and other devices, similar to an electricity grid. It has
    even been said that cloud computing may have a greater effect on our lives than
    the personal computer and de-dev revolutions combined due to scalability, reliability,
    and cost benefits that this technology can bring.


    Digital media is a term that widely covers a large number of topics including
    entertainment, gaming, digital content, streaming, and authorizing. Encompassed
    with the advancements of microprocessor and networking technologies, digital media
    is considered as a niche in the market as “the creative convergence of digital
    arts, science, technology and business for human expression, communication, social
    interaction and education.


    The purpose of this book is to bridge the gap between digital media and cloud
    computing and to bring together technologies for media/data communication, elastic
    media/data storage, security, authentication, cross-network media/data fusion,
    interdevice media interaction/reaction, data centers, PaaS, SaaS, and so on. This
    book also aims at applications involving digital media in the cloud. In addition,
    this book points out new research issues for the community to discuss in conferences,
    seminars, and lectures.


    The book contains 15 chapters centered on digital media and cloud computing, covering
    various topics that can be roughly categorized into three levels: infrastructure
    where fundamental technologies need to be'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# xiv Preface


    developed, middleware where integration of technologies and software systems need
    to be defined, and applications cases from the real world. The book is thus suitable
    as a timely handbook for senior and graduate students who major in computer science,
    computer engineering, management information system (MIS), or digital media technologies,
    as well as professional instructors and product developers. In addition, it can
    also be used as a textbook in senior research seminars and graduate lectures.


    The development and production of this book would not have been possible without
    the support and assistance of Randi Cohen, computer science acquisitions editor
    at Chapman & Hall/CRC Press. Cohen brought this project from concept to production
    and has been a wonderful colleague and friend throughout the process. She deserves
    the credit for all the tedious work that made our work as appear easier. Her warm
    personality made this project fun, and her advice significantly improved the quality
    of this book. Kate Gallo, Samantha White, and Ed Curtis worked intensively with
    us and provided the necessary support to make this book ready.


    With the continued and increasingly attracted attention on digital media in cloud
    computing, we foresee that this fast growing field will flourish just as successfully
    as the Web has done over the past two decades. We believe that readers can benefit
    from this book in searching for state-oftthe-art research topics as well as in
    the understanding of techniques and applications in cloud computing, interaction/reaction
    of mobile devices, and digital media/data processing and communication. Of course,
    we also hope that readers will like this book and enjoy the journey of studying
    the fundamental technologies and possible research focuses of digital media and
    cloud computing.


    Kuan-Ching Li

    Providence University


    Qing Li

    City University of Hong Kong


    Timothy K. Shih

    National Central University'
