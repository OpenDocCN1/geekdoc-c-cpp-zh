    # 5.2.2 Typical Scheduling Strategies


    Cloud computing provides tremendous computing resources for applications. There
    is no universal “best” scheduling algorithm, and many operating systems use extended
    or combinations of the scheduling algorithms above. For example, Windows NT/XP/Vista
    uses a multilevel feedback queue, a combination of fixed-priority (FP) preemptive
    scheduling; round-robin (RR); and first in, first out (FIFO). Processes can dynamically
    increase or decrease in priority depending on whether they have been served or
    whether they are waiting extensively. Every priority level is represented by its
    own queue, with RR scheduling among FIFO among the lower ones. In this sense,
    response time is short for processes, but short critical systems get completed
    very quickly. Since processes can only use one unit of the RR scheme in the highest
    priority queue, starvation can be a problem for longer high-priority processes.
    To fully utilize computing resources in the cloud, an appropriate scheduling algorithm
    for the specific application is essential. In the following, a few widely used
    scheduling algorithms are described:


    +   - FIFO: It is the simplest scheduling algorithm, which simply queues all the
    waiting jobs and processes them in the order that they arrived in the queue.


    +   - Shortest job (SJF): It Enables the scheduler to assign the job, whose estimated
    processing time is the shortest among all the waiting jobs, to be processed in
    the first place.


    +   - RR: It assigns a fixed processing time for each job in the queue. If the
    processor cannot finish the job in the current cycle, it preempts and allocates
    the resources to another job and reprocesses the current job when the next cycle
    comes.


    +   - FP: The priority of each job is predefined, and the scheduler will choose
    to process the job with highest priority first. When a new job’s priority is higher
    than the current processing job, the current'
