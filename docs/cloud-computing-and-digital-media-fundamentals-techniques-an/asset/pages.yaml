    of meta-data associates the data items with tenants tags and the meta-data are
    used to optimize searches by channeling processing resources during a query to
    only those pieces of data bearing relevant unique tag. In certain aspects, each
    tenant''s virtual schema includes a variety of customizable fields, some or all
    of which may be designated as indexable. One goal of traditional query optimizer
    is to minimize the amount of data that must be read from disk and choose selective
    tables or columns that will yield the fewest rows during processing. If the optimizer
    knows that a certain column has a high cardinality, it will choose to use an index
    on that column instead of a similar index on a lower cardinality column. However,
    consider in a multitenant system that a physical column has a large number of
    distinct values for most tenants, but a small number of distinct values for specific
    tenant. Then, the overall high-cardinality column strategy will not get a better
    performance because the optimizer is unaware that for this specific tenant, the
    column is not selective. Furthermore, by using aggregate statistics, the optimizer
    might choose a query plan that is incorrect or inefficient for a single tenant
    that does not conform to the “normal” average of the entire database as determined
    from the gathered statistics. Therefore, the first phase typically includes tenant-level
    and user-level statistics to find the suitable tables or columns for the common
    subexpressions. The statistics gathered includes the information in entity rows
    for tenants being tracked to make decisions about query access paths and a list
    of users to access to privileged data. The second phase constructs an optimal
    plan based on query graph. The difference is that some edges are labeled directed
    and single node consists of multiple relations considering the private security
    model to keep data or application state. The common subexpressions of the first
    phase are stored by building many-to-many (MTM) physical table, which can also
    specify whether a user has access to a particular entity row. When handling multiple
    queries for entity rows that the current user can see, the optimizer must choose
    between accessing MTM table from the user and the entity side of the relationship.


