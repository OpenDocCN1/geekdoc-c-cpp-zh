    #  4.2 BASICS OF GPU


    The use of a GPU architecture can significantly accelerate both QBSH and QBEE
    for commercial or real-time applications. In this section, we briefly introduce
    the basics of GPU, using NVIDIA''s GPU as an example.


    As shown in Figure 4.3, GPU consists of several streaming multiprocessors (SMs),
    each composed of dozens of cores [streaming processors (SPs)], on-chip shared
    memories, and registers. The shared memory on each SM is usually 48 KB with 65,536
    registers, with exact numbers depending on the type of GPU. It also features constant
    memory, texture memory, and global memory, which are shared by all of the SMs.
    Constant and texture memories can be accessed rapidly, but they are read-only
    by the GPU, and data can only be written to these memories by the central processing


    ![](img/f13da3dd59d15874e4b22b03a274001b_107_0.png)


    FIGURE 4.3 Basic GPU architecture.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 86 Cloud Computing and Digital Media


    unit (CPU). Global memory is much larger, and it can be written by the GPU, the
    access time is usually several hundred times longer than that required for constant
    and texture memories. With unified virtual addressing (UVA), we can access the
    host memory directly from the GPU. Although such access may be slow, UVA still
    helps putting data into global memory even more efficient. Our system uses the
    NVIDIA GeForce GTX 560 Ti, which contains 384 cores (48 cores per SM) sharing
    a global memory of 1 GB with 256-bit interface width, providing a throughput of
    128 GB/second. Figure 4.3 shows the basic architecture of the GPU with arrows
    indicating the direction of data transfer.


    Compute unified device architecture (CUDA) is a parallel computing framework developed
    by NVIDIA for their recent GPUs. It can be viewed as an extension of the C programming
    language, allowing programmers to define C functions (called kernels) for parallel
    execution by CUDA threads. Several threads are grouped in a block. A block is
    executed on an SM; thus, data in shared memory are shared by all threads within
    the block. The number of threads within one block is limited to 1024 MB for GTX
    560 Ti.


