    # 6.2  CLOUD-BASED EDUCATIONAL SERVICE


    In the past few years, cloud computing became a popular topic in many researches.
    Cloud computing is the idea of using a network to bring together the resources
    and information available in many places for problem solving and communication.
    IBM’s technical white paper, cloud computing (Boss et al. 2007) is defined as
    follows:


    Cloud computing term is used to describe both system platform and a type of application.
    Cloud computing platform is to be deployed on-demand, configuration, reconfigure
    and deprovision, and so on. In the cloud computing platform, the server can be
    physical servers or virtual servers. A high-level calculation usually contains
    a number of other computing resources, such as storage area networks, network
    devices, firewalls and other security equipment, describes a scalable application
    through the Internet. Any user can access a cloud computing application through
    appropriate equipment and a standard browser.


    Some researchers believe cloud computing service has the potential to affect all
    fields in the IT industry and make software and hardware even more attractive
    as a service (Bai et al. 2011; Dagger et al. 2007). Developers of cloud computing
    for novel interactive services do not require the large capital outlays in hardware
    to deploy their service, and also do not need the large human expense to operate
    it. Furthermore, the companies with large tasks can get their results as quickly
    as their programs can develop (Al-Zoube 2009). This extension of resources is
    unprecedented in the history of IT development.


    Cloud computing comprises three layers, which are as follows (Figure 6.1):


    +   - Infrastructure as a service (IaaS) delivers a full computer infrastructure
    via the Internet.


    +   - Platform as a service (PaaS) offers a full or partial application development
    environment that users can access and utilize online, even in collaboration with
    others.


    +   - Software as a service (SaaS) provides a complete, turnkey application including
    complex programs such as those for customer relationship management (CRM) or enterprise
    resource management via the Internet.'
