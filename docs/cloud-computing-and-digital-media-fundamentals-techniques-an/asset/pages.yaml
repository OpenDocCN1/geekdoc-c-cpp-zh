    Virtual learning environments (VLEs) are electronic platforms that can be used
    to provide and track e-learning courses and enhance face-to-face instruction with
    online components (Lainhart 2000). Primarily, they automate the administration
    of learning by facilitating and then recording the learner''s activity. VLEs are
    the dominant learning environments in higher education institutions. Also known
    as LMSs and course management systems (CMSs), their main function is to simplify
    course management aimed for numerous learners. Traditional e-learning platforms,
    or LMSs, provide holistic environments for delivering and managing educational
    experiences (Brock and Ginski 2000).


    E-learning platforms can be divided into two different generations. The first
    generation of e-learning platforms provides, in essence, black box solutions.
    For the most part, these systems use proprietary formats to manage the courses
    directly. These platforms focus on the delivery and interoperability of the content
    designed for a specific purpose, such as a particular course. The second, or current,
    generation of e-learning platforms expands their predecessors'' successes and
    begin to address their failures. Examples of these second-generation platforms
    include WebCT/ Moodle, and Sakai. In terms of e-learning evolution, these platforms
    provide a shift toward modular architectural designs and recognize the need for
    semantic exchange.


