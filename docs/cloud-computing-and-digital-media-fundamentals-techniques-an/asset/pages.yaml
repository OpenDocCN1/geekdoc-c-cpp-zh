    For example, the workplace is currently being shifted from cen-tralized offices
    to mobile on-site places, causing transformation of professional communities into
    mobile communities. With respect to their information technology (IT) needs, mobile
    communities introduce unique requirements. These on-site communities are character-ized
    by a high degree of collaborative work, mobility, and integration of data coming
    from many members, devices, and sensors. A mobile community, therefore, needs
    tools for communication, collaboration, coordination, and sensing as well as for
    member, community, and event awareness. Community members are often distributed
    geographically; therefore, their interactions are mediated by digital channels
    for direct communication and indirect exchange of information objects. Tools for
    communication are natively supported on mobile devices. However, multiple forms
    of communication, such as voice, messages, chat, and video streaming, should also
    be supported.


    # 3.2.2 Media-Centric IS


    Multimedia ISs have played a significant role in supporting professional communities.
    Members of a mobile community need to collaborate around different multimedia
    artifacts, such as images or videos. On the data management level, various data
    need to be captured, created, stored, managed, and prepared for further processing
    in applications. However, the massive amount of user-generated multimedia content
    does not necessarily imply the content quality and the social value. Mobile multimedia
    ISs need to empower individuals and communities with adding-value to the content
    easily. For example, techniques from data mining, machine learning, computer vision,
    and recommender systems can help further detect, filter, sort, or enhance multimedia
    content.


    As shown in Figure 3.1 [7], the development of ISs for CoP needs a sup-port for
    digital media and related communication tools between comm-unity members and collaboration
    tools over digital media objects.


