  md: '# 12.6.2 Social Sharing and Browsing


    Thinking cloud is far from being easy for users. They are not familiar with this
    way of organizing data (Mell and Gray 2009; Odom et al. 2012). Obviously, Dourish’s
    concept of placeless document (Dourish 2003) is fully relevant: Neither hierarchical
    organizations sense anymore.


    The health community is strongly constrained by the need of medical confidentiality.
    Despite the diversity of solution in the medical field, there is a fear of losing
    data control, which limits the sharing between medical professionals. The communities
    (i.e., pearls of actors) allow an easier and faster sharing, such as circles in
    Google+(Kairam et al. 2012). We are taking the pearls concept step further by
    providing a graph representation. This approach allows the user to become aware
    of these past and future exchanges, and gives a feeling of trust to the users.


    Currently, data are presented as a list that do not browse. They search only by
    keywords. The fear of browsing a huge amount of medical data also appears with
    this visual representation. We propose to enhance data with the social dimension
    to support pivot browsing, as proposed by Dourish. Socially augmented will make
    it possible to parameterize the browsing.


    # 12.6.3 Social Information Seeking and Refining


    During these experiments, the visual representation as well as filters appeared
    as sufficient for the addressed research scenarios. Surprisingly, the users did
    not use the search entry. Similar to the social orbits (Sawyer et al. 2012), this
    reorganization of the workspace facilitates information seeking.


    As proposed by Muralidharan (2012), the social worth of data is used to make relevant
    the medical activity on record (i.e., patient appointments with a specialist).
    To indicate the status of activities (the last exchange, the last appointment,
    etc.), we propose to label relationships.


    In future, we plan to integrate the context into our taxonomy so that it ensures
    a stable interaction. By context, we mean all the environmental information (e.g.,
    social, physical) that may influence the user while performing his/her task.


    Context may be a means for filtering information as well as pushing the right
    information at the right time. This opens research on user interface plasticity.'
