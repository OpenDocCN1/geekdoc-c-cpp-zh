  md: '# Standardized Multimedia Data in Health-Care Applications ■ 327


    # 13.1.1 Standardized EHR Databases


    Health-care domain generates large quantities of data from various laboratories,
    wards, operating theaters, primary care organizations, and wearable and wireless
    devices [2]. Its primary purpose is to support an efficient and quality-integrated
    health care. It contains information that is retrospective, concurrent, and prospective.
    EHRs need to be standardized for information exchange between different clinical
    organizations. The existing standards aim to achieve data independence along with
    semantic interoperability.


    The semantic interoperable EHR semantics such as Health Level 7 (HL7) [3], openEHR
    [4], and CEN/ISO 13606 [5] deal with communication, data representation, and meaning.
    Many medical experts using the standardized EHR system for diagnosis, analysis,
    and decision making. There are several reasons behind this hindrance as high cost,
    system complexity, lack of standardization, and different naming convention.


    EHRs must provide support for multimedia device and integrating images, along
    with alphanumeric, and other forms of data. Currently, multimedia data are not
    part of any standard EHR functionality [6]. Multimedia data should be integral
    to standardized EHRs because they can capture information that cannot be easily
    summarized into the text. Multimedia records are also crucial for providing best
    advice to patients to improve the health-care services and reduce the human errors.
    Structured text data cannot efficiently present the whole history and current
    status of patients, and need more time during analysis and decision making compared
    to visual data and multimedia data. These limitations of structured text data
    can potentially be overcome by storing nontextual types of data, such as multimedia
    data. Diagnostic reports as CT scan, X-ray, waveforms, and audio–video file need
    to be included in EHRs. Although multimedia data are very useful for better clinical
    judgments, these types of data can be stored in digital form with good clinical
    interpretations. It can be widely integrated with the existing standardized EHRs.
    Apart from technical complexity of incorporation of multimedia into EHRs, there
    are a few challenges for creating multimedia EHR systems [7].


    # 13.1.2 Multimedia Data and Standardized EHRs


    Multimedia data represent various types of media contents (text, audio, video,
    animation, and images). These are often used today. The data contents in the text
    format are huge when considered in regard to EHRs leading to difficulties in communication
    and analysis. The overall size can possibly be reduced by storing nontextual type
    of data (multimedia data).'
