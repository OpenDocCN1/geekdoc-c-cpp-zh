    # 7.3 MULTIPLE-QUERY PROCESSING AND OPTIMIZATION IN STREAMING DATABASES


    Traditional databases have been used in applications that store sets of relatively
    static records with no predefined notion of time, unless time-attributes are explicitly
    added. A data stream is a real-time, continuous, ordered sequence of items; meanwhile,
    it is infeasible to store a store in its entirety. Queries are executed continuously
    over streams during a selected time window and incrementally return results as
    data arrive. Therefore, a static batch-oriented approach is unsuitable in real-world
    environments where queries join and leave the system in ad hoc fashion. Similar
    to multiple-query processing in the traditional databases, multiple streaming
    query processing proceeds in two steps: (1) to optimize individual query and find
    out opportunities in the access plans, and (2) to globally optimize all the queries
    to produce a shared access plan. For single-site processing, many dynamic “on-the-fly”
    approaches have been put forward for different kinds of queries: (1) joins with
    individual predicates or varying windows, (2) aggregates with individual predicates
    or varying windows, (3) joins and aggregates with individual predicates and varying
    windows. Similar strategies are also applied to distributed environment by taking
    the optimal allocation of each node resource into account. A taxonomy of multiple-query
    processing and optimization in streaming databases is shown in Figure 7.2.'
