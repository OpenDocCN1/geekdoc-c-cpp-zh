    are then stored as a hash table for comparison dur- the retrieval stage.


    +   Retrieval stage. During retrieval, the query obtains landmarks for comparison
    using the above-mentioned procedure. The system then performs an efficient table
    lookup to identify relevant hash entries in the hash table. Based on the difference
    in offset time of both the query and the database landmarks, we should be able
    derive the number of matched landmarks for each song. The song with the most matching
    landmarks is more likely to be the desired song. The system then returns a ranked
    list according to the matched landmark counts.


