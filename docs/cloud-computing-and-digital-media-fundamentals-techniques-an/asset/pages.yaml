    Another successful MIR paradigm is query by exact example (QBEE), also known as
    audio fingerprinting (AFP). The goal of QBEE is to identify a noisy clip audio
    of the original music. For example, suppose you hear an unfamiliar song on the
    radio. With QBEE, you can record a 10-second clip (in a noisy environment) using
    your mobile device and upload the clip to the server to identify the song. The
    workflow of the QBEE system is similar to that of the QBSH system shown in Figure
    4.1, except that the pitch tracking part is replaced by landmark extraction. The
    basic components of QBEE are described as follows:


    +   1. Feature extraction for database preparation. The music clips in the database
    are first transformed into spectrograms by fast Fourier transform (FFT). A set
    of landmarks, defined as salient pairs of local'
