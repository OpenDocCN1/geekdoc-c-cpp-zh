    # 8.3 MULTIPLE CORRESPONDENCE ANALYSIS


    Being a natural extension of the standard correspondence analysis to more than
    two variables, MCA is an exploratory data analytic technique designed to analyze
    tables for some measures of correspondence between the rows and the columns (Greenacre
    and Blasius 2006). In this section, we explain the inner workings of MCA and how
    it has been used for classification (Lin et al. 2008).


    The observations used for MCA are a set of nominal values. For the task at hand,
    each feature in which the multimedia data instances are represented, which usually
    consists of numerical values, is discretized into several intervals. We refer
    to these intervals as feature values. For example, the multimedia instances shown
    in Table 8.1 are numerically represented by two features F^1 and F^2, whose class
    labels are C_1 or C_2, and Table 8.2 shows the discretization results. The discretized
    values are denoted by F_k^j, where F_k represents the j-th feature, and F^j denotes
    the set of values of feature F^j Let C denote the number of discretized values
    in F^j and the class C, respectively. Having the discretized instances, MCA is
    applied for each feature and class combination. The discretized instances are
    utilized to construct an indicator matrix Y, whose dimensions are N x (|F^j|+|C|),
    where N is the number of instances. The indicator matrix maps the instances to
    a feature-based binary representation. An example derived from Table 8.2 is shown
    in Table 8.3.


