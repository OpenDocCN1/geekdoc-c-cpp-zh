    # 3.5.4 Mobile Augmentation Cloud Services: Cloud-Aware Computation Offloading
    for Augmenting Devices’ Capabilities


    Offloading enables mobile applications to use external resources adaptively, that
    is, different portions of the application are executed remotely based on resource
    availability. For example, in case of unstable wireless Internet connectivity,
    the mobile applications can still be executed on the device. In contrast, client/server
    applications have static partitioning of code, and business logic between the
    server and the client, which is done in development phase. Actually, client/server
    applications can be seen as a special type of offloaded applications.


    We developed a framework that integrates with the established Android application
    model for “offloadable” applications, a lightweight application partitioning,
    and a mechanism for seamless adaptive computation offloading [38]. We propose
    Mobile Augmentation Cloud Services (MACS), a services-based mobile cloud computing
    middleware. Android applications that use the MACS middleware benefit from seamless
    offloading of computation-intensive parts of the application into nearby or remote
    clouds. First, from a developer''s perspective, the application model stays the
    same as on the Android platform. The only requirement is that intensive parts
    are developed as Android services, each of which encapsulates specific functionality.
    Second, according to different conditions/parameters, the modules of program are
    divided into two groups: one group runs locally and the other group runs on the
    cloud side.'
