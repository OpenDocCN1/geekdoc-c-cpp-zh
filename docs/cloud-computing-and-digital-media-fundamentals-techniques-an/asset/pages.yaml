    the execution of MapReduce jobs such that the query can be answered with the minimum
    time span. These jobs may have dependency relationships and intercompetition for
    resource consumptions during the concurrent execution. Currently, the MapReduce
    framework requires the number of Reduce tasks as a user-specified input. Thus,
    after decomposing a multiway theta-join query into a number of MapReduce jobs,
    one challenging issue is how to specify each job a proper Reduce task number such
    that the overall scheduling achieves the minimum execution time.


    # 9.2 BACKGROUND


    # 9.2.1 MapReduce Essentials


    MapReduce is a programming framework introduced by Google to perform parallel
    computation on very large datasets, for example, crawled documents, or Web request
    logs. Large amount of data requires that it is distributed over a large number
    of machines (nodes). Each participating node contributes storage sources and all
    are connected over the same distributed file system. Additionally, each machine
    performs the same computations over the same locally stored data, which results
    in large-scale distributed and parallel processing. The MapReduce framework takes
    care of all the underlying details regarding parallelization, data distribution,
    and network partition tolerant while the user can concern only the local computations
    executed on every machine. These computations are divided into two phases: the
    Map phase and the Reduce phase. The nodes assigned the Map phase take their local
    data as input and processes producing intermediate results that are stored locally.
    The nodes performing Reduce computation receive the Map intermediate outputs,
    and combine and process to produce the final result, which in turn is stored in
    the distributed file system.


