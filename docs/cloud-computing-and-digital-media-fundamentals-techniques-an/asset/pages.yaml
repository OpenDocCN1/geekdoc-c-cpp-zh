    # 15.2.7 Summary


    Cloud computing changes the efficiencies and economics of providing ICT services.
    Large cloud “utilities” are being developed that will make it cost-effective to
    move many if not most ICT services “to the cloud”; the nature of the services
    provided can be negotiated with the cloud provider. Virtualization will enable
    several computing jobs (such as word processing or e-mail users) to run on a single
    computer, while elasticity makes it possible to have huge amounts of computing
    resources instantly available to meet the demands for intensive data processing.
    Cloud computing is evolving rapidly and new methods to ensure effective management
    and security will emerge. Currently, most applications of cloud computing are
    in administration and research, but the ability to build and share powerful new
    processes will rapidly expand the variety of services available. This is where
    the greatest potential lie for adult learning and literacy training.


    Katz at al. [14] provide the following list of the benefits of a cloud computing
    approach:


