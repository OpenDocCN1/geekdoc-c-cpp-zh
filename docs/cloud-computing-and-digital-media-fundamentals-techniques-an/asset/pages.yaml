    # 9.2.3 Multiway Join Processing Using MapReduce


    Existing efforts toward efficient join query evaluation using MapReduce mainly
    fall into two categories: The first category is to implement different types of
    join queries by exploring the partition of $(key,value)$ pairs from Map tasks
    to Reduce tasks without touching the implementation details of the MapReduce framework
    and the second category is to improve the functionality and efficiency of MapReduce
    itself to achieve better query performance. For example, MapReduce Online [13]
    allows outlined join interconnections to avoid intermediate result materialization.
    A parallel conjunct (PACT) model [14] extends the MapReduce concept for complex
    relational operations. Our work, as well as the work of Vernica et al. [15] on
    similarity join and Okan et al. [7] on theta-join, falls in the first category.
    We briefly survey some most related works in this category.


    Afrati et al. [6,16] present their novel solution for evaluating multiway-join
    in one MRJ. The essential idea is that, for each join key, they logically partition
    the Reduce tasks into different groups such that a valid join result can be discovered
    on least one Reduce task. Their optimization goal is to minimize the volume of
    data copying over the network. But the solution'
