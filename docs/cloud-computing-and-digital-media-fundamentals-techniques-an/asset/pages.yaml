    adults in isolated communities are among those with the least access to Internet
    connectivity and computers.


    Some 20% of Canadians form “the working poor” earning less than one-third of the
    median wage [23]. Many of them are also in rural and remote areas and traditionally
    earned their living in primary resources and agriculture sectors. With the decline
    of the resource economy, many lack sufficient education to access retraining for
    other jobs. Others simply cannot access the existing daytime literacy programs
    because of commitments to work or family care.


    While there are lot of people falling through the cracks, some adult literacy
    practices are making significant inroads. Prior Learning Assessment and Recognition
    enables individuals to get recognition for life experiences and skills, and the
    resulting academic credits make academic credentials accessible. In British Columbia
    (BC), considerable work has also taken place in “laddering” or transferring credits
    earned in college or trades paths into higher education. In Alberta and the Northwest
    Territories, the Alberta–North collaboration of higher education institutions
    and community organizations that provide technology access and educational support
    in 87 remote communities enables a large number of learners to be first in their
    family to earn a degree.


    Despite the low level of federal–provincial coordination in adult literacy, the
    community is organizing itself into regional and national networks to exchange
    information and educational resources. Of particular note is the National Adult
    Literacy Database (www.nald.com) which maintains a repository of up-to-date research
    and AlphaPlus (www.alphaplus.com), which also shares learning resources. When
