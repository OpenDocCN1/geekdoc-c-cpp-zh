    # 9.4.3 Solution Overview


    There are a number of challenges to fit RDF query processing, especially join
    processing, directly into the MapReduce framework. Although attempts were made
    in existing solutions [39–41], the following problems are not solved:


    +   * How to map the implied join operations inside a SPARQL query to a number
    of MapReduce jobs? A MapReduce job can either zero-reduce processing (simple selection),
    pairwise join, or multiway join. It is difficult to decide the types for all MapReduce
    jobs in order to achieve the overall efficiency.

    * How to execute MapReduce jobs efficiently? For a given system and job dependencies,
    how to make the best use of computing and network resources to maximize the job
    execution parallelism such that we can achieve the shortest execution time.

    * How to organize and manage RDF data on cloud such that MapReduce jobs can scale
    along with the data volumes involved in different queries?


    To solve the above challenges, we present a cost-based RDF join processing solution
    on the cloud. To elaborate, we first decompose RDF data into Predicate files and
    organize them according to data contents. Then we map a SPARQL query directly
    to a sequence of MapReduce jobs that may employ hybrid join strategies (combination
    of Map-side join, Reduce-side join, and memory backed joined). Finally, based
    on our cost model of MapReduce jobs for join processing, we present an All Possible
    Join (API) tree-based technique to schedule these jobs to be executed in the most
    extended parallelism style. We also discuss how to extend our solution to handle
    other types of joins over RDF data.'
