    and the bandwidth resource. The scheduling resource is represented by the scheduling
    rate $S$ indicating the number of requests scheduled per second; the computation
    resource at computing server $i$ is represented by the processing rate $C^i$ indicating
    the number of instructions executed per second; and the bandwidth resource is
    represented by the transmission rate $B^i$ indicating the number of bits transmitted
    per second. The resource allocation in the multimedia cloud determines the optimal
    scheduling resource $C^i$ ($i=1,\dots,\mathcal{N}$) and bandwidth resource $B^i$
    at time slot $t$.


    Suppose $M$ classes of applications are provided. For each class of application,
    there are four parameters: the average request rate $r_i$, the average task size
    $D_i$, and the service response requirement $t_i$. The workload of each application
    is time varying, and the resource demands are dynamically changing. Moreover,
    the response time requirement affects the resource demands.


    # 2.3.1.2 Queuing Model


    The proposed queuing model is shown in Figure 2.2. The model consists of three
    concatenated queuing systems: the scheduling queue, the computation queue, and
    the transmission queue. The master server maintains the scheduling queue. Since
    two consecutive arriving requests may be from different users, the inter-arrival
    time is a random variable, which can be modeled as an exponential random variable
    [30]. Therefore, the arrivals of requests follow a Poisson process. The average
    arrival rate is denoted by $\lambda^i$. The requests are scheduled to the computing
    servers at the rate $S^i$. Each computing server has a corresponding computation
    queue to process requests. The service results are sent back to the users at the
    rate $B^i$ the transmission server. We assume that the service availability is
    guaranteed


