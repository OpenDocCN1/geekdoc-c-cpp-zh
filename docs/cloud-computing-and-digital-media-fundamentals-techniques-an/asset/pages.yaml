    # 8.4 MR MCA-BASED CLASSIFICATION


    MR is a data-processing programming model and supporting framework introduced
    by Dean and Ghemawat (2008). Its open source implementation, Hadoop (Apache 2013),
    is utilized by a large number of companies for distributed data processing. Hadoop
    offers a distributed file system called Hadoop distributed file system (HDFS)
    on which applications store large data as well as an MR framework on which distributed
    applications are built. Furthermore, the MR framework abstracts the programmer
    from the details of parallelization, fault tolerance, data distribution, and load
    balancing, which greatly reduces the complexity of developing distributed applications.


    As shown in Figure 8.1


    ```

    map ap(K₁, N₁)   list(K₂, N₂)


    reduce(K₂, list(V₂))   list(K₃, N₃)

    ```


    The processing of an input dataset begins with the map phase, in which the MR
    framework partitions the data into chunks called splits and invokes a map task
    to process each split. The size of a split is by default that of an HDFS block,
    although users can define their own criteria for splitting. The MR framework abstracts
    a split as a list of records, where a record is


    ![](img/f13da3dd59d15874e4b22b03a274001b_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 178 Cloud Computing and Digital Media


    key-value pair $K_1V_1\hat{0}$. After executing the map function, the map tasks
    generate intermediate key-value pairs $K_2V_2\hat{0}$ The shuffle sorts the generated
    key-value pairs by key, copies them to the node where the reduce operation is
    performed, and merges the sorted pairs from all map tasks. Subsequently, the reduce
    phase spawns one or more reduce tasks, which invoke the reduce function. If there
    is more than one reduce task, the shuffle phase invokes a partition function to
    separate the keys between the reduce tasks. Each invocation of the reduce function
    receives as $K_2,list(V_2,)$ a map-generated key paired with all the map-generated
    values for the key. The output key-value pairs of the reduce tasks make up the
    output data of the MR job. Additionally, users can also specify a function of
    the form $combine(K_2,list(V_2))\{E}$ that is used by the MR framework to reduce
    the data transfer between the map and reduce tasks. The combine function is run
    on the map output key-value pairs, and its output key-value pairs are used as
    input for the reduce function. It is worth noting that the combine function is
    an optimization feature of the MR framework, and there are no guarantees of how
    many times it will be called, if at all.


    With the aforementioned description of the MR framework, we proceed to explain
    the MR-based MCA classification framework and our solution for the MCA scalability
    problem. We term our proposed framework as distributed MCA (D-MCA).


    The S-MCA classification process previously described can be divided into model
    training and data classification procedures. The proposed D-MCA classification
    framework consists of two MR jobs, as shown in Figure 8.2. The first MR job carries
    the MCA model training to generate the MCA model, that is, the MCA-based rules
    are used to classify the test data. Once the MCA model is built, the second MR
    job loads the model as side data and classifies the dataset, which consists of
    unknown data instances. We point out the steps of model training and data classification
    consist of a single-pass MR.


    The scalability problem of S-MCA can be overcome by interpreting the $B_{ij}$
    of the Burst matrix $B=YTY$. The value of $B_{ij}$ for some $k_i, k_j$, and feature
    $F_{ij}^k$ is the number of data instances that have $P_{ki}^k$ and $P_{kj}^k$.
    This interpretation can be proven since $B_{ij}=\hat{A}_m^1(Y_{km}Y_{jm})$, where
    $Y_{km}=1$ if and only if instance $m$ has the feature value $F_{ki}^k$ and $F_{kj}^k$,
    $Y_{km}$ and $Y_{jm}$ are zero otherwise. Another insight is that for $F_{ki}^k$
    and $F_{kj}^k$, $B_{ij}=0$ means the same instance can have $F_{ki}^k$ or $F_{kj}^k$
    but not simultaneously. With this result,'
