    # 12.7 CONCLUSION


    This chapter presents a new metaphor targeted for the cloud. The contributions
    are twofold: a taxonomy of SAE and the concept of pearl for empowering users with
    these SAE. We consider the social dimension as an approach to provide the first
    answer to the issues raised by cloud computing. For instance, highlighting the
    social status of entity constitutes a means to represent sharing of data and traceability.
    Our application domain, gastroenterology, illustrates this: As Underlined by the
    medical practitioners we have met, this feature is highly relevant to medical
    confidentiality.


    Early feedbacks from medical practitioners encourage pursuing. As underlined,
    there are several issues to address in order to improve the metaphor and therefore
    our prototype.


