    record, or pathology has not been informed” (P1). “We do not necessarily remember
    patient names, but rather a time, a date or a place” (P3). For these situations,
    our metaphor appears meaningful, as the social worth of data constitutes additional
    criteria. This idea seems very suitable for “young doctors or doctors managing
    a large number of patients” (P3).


    # 12.6 DISCUSSION AND IMPLICATIONS


    Participants’ feedbacks are very positive. Still, these raise issues that must
    be addressed by future research.


    # 12.6.1 Social Desktop for the Cloud: Pearly Ui


    The experimentations point out the limits of data-centered metaphors: Information
    is fragmented and distributed across different services—e-mail services to manage
    contacts (actors), health-care information systems to manage medical records (data),
    and so on. Our PearlyDesktop prototype appears as a promising answer to (partly)
    satisfies the needs of health-care professionals.


    Similar to Pham’s user-created groups (Pham 2010), we promote an enlarged folder
    metaphor to integrate the social worth of data. Although Pham’s proposal is based
    on a visualization that only focuses on relations among actors, our approach merges
    two: data and actors. In addition, depending on the social status of actors and
    data, and the social relationships among actors, the view on data may be restricted
    or enlarged. In instance, while access to medical records would be restricted
    for students, a referent doctor may have a full access to a medical record managed
    by a gastroenterologist.


    Compared to CloudRoom (Terrenghi et al. 2010) that relies on different and disconnected
    access to data, we foster a metaphor that reveals the context of data such as
    the social orbits of Sawyer et al. (2012); physical location related to data such
    as an operating room or a medical office). The temporal dimension constitutes
    another means to reveal such a context. However, we have to revisit the invitation
    to comply with Schneiderman’s mantra: “We should see data, cluster, relationships
    and gaps of data. […]ud] The user zooms in on what he wants to see, filter it
    does not want and click on the item for which he wants information” (Schneiderman
    2010). Currently, we investigate how to combine this user-centered representation
    with a timeline, to allow users to zoom and filter, that preserves the representation
    of the social context of data.'
