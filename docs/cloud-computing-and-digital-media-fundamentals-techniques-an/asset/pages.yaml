    identify the equivalence and subsumption of two expressions at the logical level
    using heuristic rules. They first present a multiple-query connection graph for
    a set of queries by extensions of the query graphs introduced by Wong and Youssefi
    [15]. The connection graph contains nodes (representing edges) and edges (representing
    conditions between attributes of the nodes they are connected with). They then
    detect and exploit the common subexpressions to decompose the graph into a single
    plan for the set of queries through two transformations: instantiation and iteration.
    The transformation consists of selecting a node, writing an expression for evaluating
    the graph in terms of edges associated with the node, and rewriting the graph
    in terms of a simpler plan. Such a process is recursively applied until the graph
    consists only of isolated nodes. Here, a node chosen for instantiation is based
    on the following heuristics: (1) it has several edges from different queries incident
    on it and the conditions associated with all the edges are identical; (2) it has
    several edges from different queries incident on it and the edges can be partitioned
    into two groups that the condition of one query subsumes (intuitively more general)
    the condition of the other group; (3) it has several edges from different queries
    incident on it and these edges can be partitioned into sets, where each consists
    of edges from the same subset of queries; (4) whenever it satisfies; and (5) the
    number of partitions is small (either 1 or 2), then perform the iteration immediately
    followed by instantiation [14].


    Chakravarthy and Rosenthal [16] also use an AND/OR graph to represent queries
    and detect subsumption by comparing each pair of operator nodes from different
    queries.


    Apart from the identical and subsumption operations, Chen and Dunham [9] propose
    a multigraph processing technique to cover the overlap case. First, they decompose
    a set of queries into unrelated sets. These sets are created, queries in each
    subset are executed separately. This decomposition step is performed before the
    determination of common subexpressions to reduce the size of query sets. The later
    can then be easily handled by selecting multiple edges between the same pair of
    nodes in the multigraph. With a set of heuristics for selecting common operations
    for processing (e.g., delay selection in one query in order to take advantage
    of the common join operations with another query, leave all project operations
    to the final stages, and select edges with the identical/subsumed/overlapped select
    and join conditions), high scalability across queries can be achieved.'
