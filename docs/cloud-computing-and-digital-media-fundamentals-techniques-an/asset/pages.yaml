  md: '# Supporting Practices in Professional Communities ■ 55


    Mobile devices can be seen as entry points and interface of cloud online services.
    The combination of cloud computing, wireless communication infrastructure, portable
    computing devices, location-based services, mobile Web, and so on has laid the
    foundation for a novel computing model, and called mobile cloud computing, which
    allows users an online access to unlimited computing power and storage space.
    Taking the cloud computing features in the mobile domain, we can define:


    Mobile cloud computing is a model for transparent elastic augmentation of mobile
    device capabilities via ubiquitous wireless access to cloud storage and computing
    resources, with context-aware dynamic adjusting of virtual device capacities in
    respect to operating conditions, while preserving available sensing and interactivity
    of mobile devices.


    To make this vision reality beyond simple services, mobile cloud computing has
    many hurdles to overcome. Existing cloud computing tools tackle only specific
    problems like paralyzed processing on massive data volumes, flexible virtual machine
    (VM) management, or large data storage. However, these tools provide little for
    mobile clouds. The full potential of mobile cloud applications can be unleashed,
    if computation and storage are offloaded into the cloud, but without hurting user
    interactivity, introducing latency, or limiting application possibilities. The
    applications should benefit from the rich built-in sensors that open new doorways
    to smart mobile applications. As the mobile environments change, the application
    has to shift computation between device and cloud without operation interruptions,
    considering many external and internal parameters. The mobile cloud computing
    model needs to address the mobile constraints in success to supporting “unlimited”
    computing capabilities for applications. Such model should be applicable to different
    scenarios. The research challenges include how to abstract the complex heterogeneous
    underlying technology, how to model all the different parameters that influence
    the performance and interactivity of the application, how to achieve optimal adaptation
    under different constraints, and how to integrate computation and storage with
    the cloud while preserving privacy and security. The adoption of cloud computing
    affects the security in mobile systems. The aspects are related to ensuring that
    the data and processing controlled by a third party are secure and remain private,
    and the transmission of data between the cloud and the mobile device is'
