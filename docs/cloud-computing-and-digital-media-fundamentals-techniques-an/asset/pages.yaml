    # 7.1 INTRODUCTION


    Cloud computing explains the phenomenon of the integration among multiple devices,
    which refers to both the applications over the Internet and the hardware or systems
    software in the data centers that provide these services. Here, cloud means a
    metaphor for the Internet where data are stored and costly operations are performed
    to generate the necessary response delivered to each client. Meanwhile, database
    applications are becoming increasingly complex, with demand for handling the distributed
    data that are often heterogeneous in nature. In order to provide efficient Web
    services, multitenancy can come to achieve high scalability, which incurs the
    research issues of multiple-query processing and optimization.


    In the data management field, multiple-query processing and optimization problem
    has long historically extensively investigated, spanning from relational databases,
    deductive databases, semistructured Extensible Markup Language (XML) databases,
    to streaming databases. Given a set of database queries, instead of separating
    the queries one at a time, multiple-query optimization (MQO) aims to perform the
    queries together by taking advantage of common data and common query subexpressions
    these queries may. In this way, redundant data access can be avoided and the overall
    execution time can be reduced. In this chapter, the aim is to survey two main
    bodies of research activities in traditional databases and streaming databases.
    On the previous classic models, we discuss some possible extensions in the multitenant
    database.


    The remainder of the chapter is organized as follows. Sections 7.2 and 7.3 review
    multiple-query processing techniques in traditional databases and streaming databases,
    respectively. Section 7.4 discusses their possible extensions to multitenant databases.
    Section 7.5 concludes the chapter and explores the future work.'
