  md: '# Standardized Multimedia Data in Health-Care Applications ■ 339


    limitations, initial cost, semantic interoperability, security and privacy, bandwidth
    requirements for information exchange and transfer, and usability. These issues
    need to be addressed and resolved as soon as possible to take full advantage of
    multimedia EHR systems.


    # 13.4.1 Bandwidth Requirements


    Bandwidth is a critical issue when dealing with large amount of multimedia rich
    data. It may be available in the urban and well-served cities, but in developing
    countries most of the population belongs to rural and underserved communities.
    Thus, it is very difficult to meet the bandwidth requirement. Few of the measures
    that may solve this problem as follows:


    +   1. Image compression can reduce the size of images and other media content,
    but it will reduce the quality of the data.

    2. Streaming the images live whenever required (just-in-time streaming) can reduce
    the burden on the network.

    3. Prioritizing the order for the optimized presentation may be utilized.

    4. Performing rendering of the data by huge visualization engines on the server
    side and giving the direct access can be utilized.


    The above-mentioned measures reduce load on the available bandwidth and help in
    smooth functioning of multimedia-integrated EHR services.


    # 13.4.2 Archiving and Storage of Multimedia Data


    Another important issue in multimedia databases is the management of storage subsystem.
    There are certain characteristics of multimedia data objects that make their storage
    an unusual problem. Multimedia objects can be very large. Indeed, in most real-world
    systems, we may expect multimedia objects to be a few orders of magnitude larger
    on the average than other objects (typically text files and binary files). Along
    with that, they have real-time timing constraints during display. Multimedia data
    may require a high degree of temporal data management. The HL7,openEHR, and European
    Committee for Standardization (CEN) standards support the EHR repositories. The
    medical personnel frequent interaction with these archives. Further, the patient,
    care professional, care provider, funding organizations, policy makers,'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# 340 Cloud Computing and Digital Media


    legislators, researchers, and analysts also need to access these archives. The
    problems about information exchange arise, as these archives have different data
    storage representations. Similarly, the information exchange (among the various
    archival storages) also poses difficulties. These problems can be overcome by
    using some simple techniques, such as the following:


    +   - Multimedia data are mostly archival and tend to be accessed in the read
    mode. This means that modifications of multimedia data objects, in many applications,
    are relatively few. This allows designers to read optimize the data.

    - Multimedia data also tend to show temporal locality. This allows easier management
    and optimization of cache buffers.


    Although these optimization methods are not universal, some applications may still
    benefit from them.


    # 13.4.3 MUIs for Different Needs


    Different specialists use image data in different forms, ranging from dental X-rays,
    dermatology photographs, and pathology slides to computerized tomography scans
    for oncologists and magnetic resonance images for cardiologists. Each specialty
    has different requirements for viewing and interpreting images. For cardiologists,
    multiple real-time images are required to correctly identify the disease and treat
    it. In case of neurosurgeons, intraoperative images are needed, along with the
    images taken in the past for the reference purpose. Similarly, obstetric and gynecnec
    physicians deal with a patient population that is mobile. For these, images must
    be taken and stored in such a manner that they can be transferable between providers
    and annotated in order to have consistent readings and interpretations. Primary
    care physicians also have their requirements and areas on which they focus. Radiologists
    have different requirements such as frequent viewing, electronic ordering of procedures,
    facilitation of report generation, and support for rapid notification of the ordering
    physician in case of time-sensitive critical findings. This widespread use of
    the images in health care requires portable datasets with metadata linked to the
    images that can be easily viewed and interpreted by other members of health-care
    team.'
