    # 3.3 MOBILE CLOUD MODELS


    The clouds have a huge processing power at their disposal, it is still challenging
    to make them truly accessible to mobile devices. The traditional client-server
    model and Web services/applications can be considered as the most widespread cloud
    application architectures. However, several other approaches to augmenting the
    computation capabilities of constrained mobile devices have been proposed. Offloading
    has gained big attention in mobile cloud computing research, because it has similar
    aims as the emerging cloud computing paradigm, that is, to circumvent mobile devices''
    shortcomings by augmenting their capabilities with external resources. The full
    potential of mobile cloud applications can only be unleashed, if computation and
    storage are offloaded to the cloud, without hurting user interactivity, introducing
    latency, or limiting application positions.


    # 3.3.1 Cloud-Based Mobile Applications


    A model where the services are delivered to mobile devices using the traditional
    client-server model, but cloud computing concepts are applied to the “server”
    architecture. The bulk of research literature covers this type of applications
    as examples of mobile cloud computing. This is understandable,'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Supporting Practices in Professional Communities ■ 57


    since it is the most simple way to augment the capabilities of mobile devices.

    The client–server model has been well researched and established in practice for
    distributed systems and Web applications. In this case, the mobile app, regardless
    of whether it is native or Web based, acts as front end to the services provided
    in the cloud, which in turn benefits from the interconnected services, high computational
    power, and storage capacities.


    Multimedia services in the cloud typically experience unpredictable bursts of
    data access and delivery. The cloud''s utility–like allocation mechanism for computing
    and storing resources is very effective for dynamic requirements such as those
    of professional communities. However, the generic cloud services provided by major
    cloud vendors are insufficient to deliver acceptable UX. The fluctuations in mobile
    wireless networks, limited capacities of mobile devices, and QoS needs for mobile
    media expose more specific requirements than those for the wired Internet cases.
    For example, streaming high definition (HD) content to a mobile phone would cause
    UX even if the device could support decoding of content.


    With the growing scale of Web applications and the data associated with them,
    scalable data management becomes a necessary part of the cloud ecosystem. Some
    of the popular scalable storage technologies in the modern are Amazon Simple Storage
    Service (S3), Google BigTable, HBase and Hadoop distributed file system (HDFS),
    and so on. Basically, these distributed blob and key-value storage systems are
    very suitable for multimedia content, that is, they are scalable and reliable
    as they use distributed and replicated storage over many virtual servers or network
    drives.

    Cloud-based mobile multimedia applications, in general, use cloud services and
    cloud infrastructure to meet the requirements for mobile multimedia, including
    content delivery networks (CDNs), peer-to-peer (P2P) multimedia delivery, and
    parallelized (high-performance) processing of multimedia content. The CDN delivers
    multimedia content to end users with a better performance, lower latency, and
    a higher availability. Amazon Web Services, for example, provide their CloudFront
    service to application developers for such needs. High-performance multimedia
    processing, typically, has referred to speeding up the transformation process
    of multimedia content with the use of powerful server machines. The current trend
    in practice is to use many commodity hardware machines to perform the same operation
    with lower operational costs. This approach has become popular under the term
    “Datenter as a Computer” [16]. This is why cloud vendors rely on custom server
    construction with tens of thousands of cheap computers'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 58 Cloud Computing and Digital Media


    with conventional multicore processors. They are cheaper and more efficient. One
    powerful machine costs more than two-not-so-powerful machines that have the same
    performance. Having a larger number of small computational units gives an easier
    way of tackling the fault-tolerant issue. These systems exploit the power of parallelism
    and at the same provide reliability at the software level. Instead of using expensive
    hardware, the system takes advantage of thousands of inexpensive independent components
    with anticipated hardware failure. The software is responsible for ensuring data
    replications and computation predictability.


    # 3.3.2 Cloud-Aware Mobile Applications


    The relative poverty of mobile devices as well as their lower trust and robustness
    lead to reliance on static servers [17]. But the need to cope with unreliable
    wireless networks and limited power capacity argues for self-reliance. Mobile
    cloud computing approaches must balance between these aspects. This balance must
    dynamically react on changes in the mobile environment. Mobile applications need
    to be adaptive, that is, the responsibilities of the client and the server need
    to be adaptively reassigned.


    The cloud computing concepts can be considered from a viewpoint of the mobile
    device. In fact, we want to achieve a virtually more powerful device, but in contrast
    to the previous model, we want to keep all the application logic and control on
    the device. There are many reasons why this kind of application is desired, for
    example, to retain privacy and security without sharing the code and data with
    the cloud, or simply reuse the existing desktop applications on the mobile device,
    or reduce the communication latency introduced by the remote cloud.


    Offloading has gained big attention in mobile cloud computing research, because
    it has similar aims as the emerging cloud computing paradigm, that is, to overcome
    mobile devices'' shortcomings by augmenting their capabilities with external resources.
    Offloading or augmented execution refers to a technique used to overcome the limitations
    of mobile phones in terms of computation, memory, and battery.


    Such applications, whose code can be partitioned and certain parts are offloaded
