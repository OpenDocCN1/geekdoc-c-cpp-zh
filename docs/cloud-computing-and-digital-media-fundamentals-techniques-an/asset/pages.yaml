- pgno: 359
  md: '# Standardized Multimedia Data in Health-Care Applications ■ 337


    X-ray, CT scan, heartbeat sounds, waveforms, electrocardiography (ECG), and magnetic
    resonance imaging are generated by different devices with different formats and
    standard of user interface for the same and different patients. Most of the time
    devices use the day–date–time format to generate unique identifier. The clinical
    staff manually enters the patient name, so the uniqueness of identifier is not
    unique all the time and manual entry may increase the probability of human errors.
    Sometimes, the same tests are being done again for checking improvement in patient’s
    health. Therefore, unique identifier plays a key role in the retrieval process.
    MUI must be generated in such manner that it becomes easy for clinical expert
    to find all the data regarding a patient (test reports, multimedia data, text
    data, EHR data, and interpretations of previous clinical experts). MUI should
    also support groups by query processing where clinical experts find out the related
    history of similar health issues of different patients.


    # 13.3 EHRs ON CLOUD COMPUTING SYSTEMS


    Cloud computing paradigm is one of the popular IT infrastructures for facilitating
    EHR sharing and integration. An ecosystem will evolve that constantly generates
    and exchanges insights and brings appropriate and insights into health-care decisions.
    One of the key benefits will be the ability to exchange data between disparate
    systems; such a capability is needed by health-care industry. For example, cloud
    can support various health-care organizations to share EHR (doctor’s prescriptions,
    test reports, and results), which are stored across different systems around the
    globe as shown in Figure 13.2.


    The electronic record sharing between different electronic medical record (EMRs)
    systems is difficult. The interoperation and sharing among different EMRs have
    been extremely slow. Heavy investment and poor usability are the biggest obstacles,
    which hinder the adoption of IT, especially EHR systems. Cloud computing provides
    an platform to cut down the cost of EHR systems in terms of both ownership and
    maintenance burdens for many medical practices. Cloud computing environment can
    provide better opportunities and openings to clinicians, hospitals, and other
    health-care related organizations. These units can come to a consensus to exchange
    health-care multimedia information among themselves, which will help doctors and
    physicians. It will also help the patients by providing better treatment facilities
    along with accurate and fast decision-making facilities.'
