    # 2.2.2 Resource Allocation in Cloud Computing


    The resource allocation in cloud environment is an important and challenging research
    topic. Verma et al. [12] formulate the problem of dynamic placement of applications
    in virtualized systems as a continuous optimization: The placement of VMs at each
    time frame is optimized to minimize resource consumption under certain performance
    requirements. Chaisiri et al. [13] study the trade-off between advance reservation
    and the on-demand resource allocation, and propose a VM placement algorithm based
    on stochastic integer programming. The proposed algorithm minimizes the total
    cost of resource provision in infrastructure as a service (IaaS) cloud. Wang et
    al. [14] present a virtual appliance-based automatic resource provisioning framework
    for large virtualized data centers. Their framework can dynamically allocate resources
    to applications by adding or removing VMs on physical servers. Verma et al. [12],
    Chaisiri et al. [13], and Wang et al. [14] study resource allocation from VM placement
    perspective. Bacagupo et al. [15] compare the effectiveness of different techniques
    on response time prediction. They study different cloud services that demand cloud
    resource at notice and dynamic enterprise systems that need to adapt to frequent
    changes in the workload. Based on these cloud services, the layered queuing network
    and historical performance model are quantitatively compared in terms of prediction
    accuracy. Song et al. [16] present a resource allocation approach according to
    application priorities in multiplication virtualized cluster. This approach requires
    machine learning to obtain the utility functions for applications and defines
    the application priorities in advance. Lin and Qi [17] develop a self-organizing
    model to manage cloud resources in the absence of centralized management. Nan
    et al. [18] present optimal cloud resource allocation in priority service to minimize
    the resource cost. Appleby et al. [19] present a prototype of infrastructure,
    which can dynamically allocate cloud resources for an e-business utility, Xu et
    al. [20] propose a two-level resource management system with local controllers
    at the VM and a global controller at the server level. However, they focus only
    on resource allocation among VMs within a cloud server [19,20].


    Recently, there is an upscale of research interests in QoS provisioning for cloud-based
    multimedia applications. Zhu et al. [21] introduce multi-media cloud computing
    from the perspectives of the multimedia-aware'
