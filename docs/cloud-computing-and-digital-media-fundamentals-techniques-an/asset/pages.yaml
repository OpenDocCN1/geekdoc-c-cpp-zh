    information sharing are numerous: between practitioners about a patient, with
    laboratories, the hospital for admissions, [etc.]” (P4). Lack of sharing today
    is a real problem: “we do not know who whom” (P4). “We do not have a full access
    to information about a patient which is crucial to know, for instance, what the
