    JOIN QUERY is one of the most expensive and expensive analytic tools in traditional
    database systems. Along with the exponential growth of various data collections,
    NoSQL data storage has risen as the prevailing solution for big data. However,
    without the strong support of heavy index, the join operator becomes even more
    and challenging for querying against or from massive data. As reported from Facebook
    [1] and Google [2], the underlying data volume is hundreds of terabytes or even
    petabytes. In these scenarios, solutions from the traditional distributed or parallel
    databases are infeasible due to unsatisfactory scalability and poor fault tolerance.
    There have been intensive studies on different types of join operations over distributed
    data, for example, similarity join, set join, fuzzy join, all of which focus on
    efficient join query by exploring the massive parallelism of the MapReduce computing
    framework on the cloud platform. In this chapter, we explore the efficient processing
    of multiway generalized join queries, namely the “complex join,” which are widely
    employed in various practical analytic scenarios, that is, querying resource description
    framework (RDF), feature selection from biochemical data. The substantial change
    of complex join lies in, given a number of processing units, mapping a complex
    query to a number of parallel tasks and having them executed in a well-scheduled
    sequence that the total processing time span is minimized. In this chapter, we
    focus on the evaluation of complex join queries on the cloud platform and elaborate
    with case studies on the efficient Simple Protocol and RDF Query Language (SPARQL)
    query processing and the multiway theta-join evaluation.


