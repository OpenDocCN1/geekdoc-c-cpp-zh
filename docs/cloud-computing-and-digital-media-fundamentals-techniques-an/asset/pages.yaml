  md: '364 ■ Cloud Computing and Digital Media


    This chapter is organized around four questions:


    +   1. What is cloud computing and why is it important for adult literacy?

    2. What is the current state of adult literacy education in Canada and is a cohesive
    online adult literacy community feasible?

    3. What is the current use of IT to support adult literacy?

    4. What might a cloud computing strategy for adult literacy look like and what
    are the challenges to realize such a vision?


    Technical issues arise, the changes cloud computing brings may provide an unprecedented
    opportunity to revolutionize the way in which we offer adult literacy training
    and new literacy services that can hasten the integration of low-literacy adults
    into society. The cloud could facilitate the alignment of institutional processes,
    and therefore enable the reduction of system complexity. There are legitimate
    reasons for institutional or organizational differences: size, programming, structure,
    and operational mandate, all of which provide significant reasons for differentiation.
    The initial benefits of an adult education cloud are outsourcing the infrastructure
    costs. However, the areas of significant gain can still be realized at the application
    level with, for example, e-mail and shared learning management systems, content
    management systems, automated assessment systems, and Web conferencing systems.
    These would represent the initial applications that would formulate a cloud provision.


    # 15.2 QUESTION 1: WHAT IS CLOUD COMPUTING AND WHY IS IT IMPORTANT FOR ADULT LITERACY?


    > Cloud computing is a nebulous term


    > —Anonymous


    Wikipedia notes that the cloud originated among telephone networks and that “The
    first scholarly use of the term cloud computing was in a 1997 lecture by Ramnath
    Chellappa.


    According to Pingdom [7], the term “cloud computing” was launched into the mainstream
    in 2006 when Eric Schmidt, CEO of Google, used describing Google’s own services
    during a search engine conference: “It starts with the premise that the data services
    and architecture should be on servers. We call it cloud computing—they should
    be in a ‘cloud’ somewhere.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# Cloud Computing and Adult Literacy ■ 365


    The National Institute of Standards and Technology (NIST) defines the term as
    follows:


    Cloud computing is a model for enabling convenient, on-demand network access to
    a shared pool of configurable computing resources (e.g., networks, servers, storage,
    applications, and services) that can be rapidly provisioned and released with
    minimal management effort or service provider interaction [8].


    In common usage, cloud computing has grown to mean Internet access to large-scale
    computing facilities provided by others. There are a few key concepts which are
    described below.


    # 15.2.1 Economies of Scale


    The cost of providing ICT has become a growing concern for many organizations.
    For example, a large university with tens of thousands of students might be spending
    over $500,000 each year for the infrastructure (servers, software, storage, staff,
    and communications) to provide e-mail. However, Google has a huge e-mail facility
    that currently provides millions of Gmail accounts for no fee (the cost to Google
    of adding a few thousand or a few hundred thousand academic mail users is nearly
    negligible). Cloud providers have located their computing facilities near power
    generation facilities (where the electricity is “greener”) and cheaper since less
    power is wasted in transmission) and their large facilities are more robust and
    require fewer staff per e-mail account to maintain than small facilities. Google
    Apps for Education is currently providing free e-mail and other applications as
    document sharing to entice universities to switch to greener and cheaper cloud
    computing services. Microsoft and Amazon (and others) are also offering cloud
    services on a large scale.


    In traditional ICT organizations, increasing computing capacity requires additional
    capital investment followed by increased operating and maintenance costs. With
    erecting a new building, the infrastructure needs to be maintained regardless
    of usage. In contrast, cloud computing is like renting space in a building–you
    pay for the space and services as long as you need them. The cost of the building
    is amortized over a large number of tenants. Since cloud tenants connect via the
    Internet, their number can be very great and their share of costs can be very
    small compared with traditional ICT costs.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# 366 Cloud Computing and Digital Media


    The economies of scale can also apply to the adult literacy community. The development
    of an adult literacy cloud could help reduce this fund-ustainability gap by allowing
    more effective planning and provision of services. This is not a simple task,
    and will require significant and involved collaboration across the adult education
    sectors, yet institutions and organizations appear to have few viable alternatives.
    A freely accessible adult learning cloud computing environment or medley of environments
    provide significant financial savings for learners, employers, and adult learning
    organizations and institutions while at the same time the basis for coordinated
    approaches to delivering provincially or even nationally. A long-term investment
    in a cloud for adult learning in Canada would not only reduce the cost and increase
    the scope of technology services but also enable institutions to create more meaningful
    and realistic technology plans that address the short- and long-term technology
    needs of their program delivery. Of course, this coordination of services would
    also have to address issues such as data and personal privacy. Low-literacy refugees
    from war-torn countries are reluctant to use free services if there is the slightest
    change that their identities are not protected.


    # 15.2.2 Virtualization


    Today''s computers are both fast and powerful and capable of serving several users
    at the same time. Each user is given a share of the computer''s time and resources,
    and several "virtual" computing sessions can be run at the same time; the typical
    user does not notice that they are sharing a computer. Every job that accesses
    the cloud through the Internet is assigned to the next available virtual space—often
    on a different physical computer than the last virtual session. The cloud management
    software looks after the job allocations, constantly shifting usage to optimize
    the use of servers connected together in the cloud. Fewer computers are needed
    in the workplace than in the current desktop environment where each user has his/her
    own personal computer.


    # 15.2.3 Device Independence


    Since the data processing is "in the cloud," the user no longer needs a powerful
    (nor expensive) desktop computer. Smaller and cheaper workstations,"notebook"
    computers, and mobile devices such as tablet computers or even "smart phones"
    can connect to the cloud via the Internet. The cloud will be able to reformat
    the output to suit the user’s device—perhaps reading out loud to a mobile phone
    rather than sending text to'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Cloud Computing and Adult Literacy ■ 367


    its small screen [9]. Moreover, users can alternate devices and access their applications
    and content independently from wherever they are located using any Internet-capable
    device. For learning institutions, device independence may result in the scarce
    financial resources for software and hardware purchases and maintenance more effectively
    as they do not need to provide and support physical computers. The lower cost
    may also enable greater access to computers by learners, as they can find lessexpensive
    alternative access devices. Technical support could be provided from more aggregated
    central units, and therefore lower cost, addressing a current need especially
    in community-based agencies where practitioners commonly provide their support.


    # 15.2.4 Elasticity


    With desktop computing, each user is limited to the resources (processing, memory,
    and data) available in his/her personal computer. With cloud computing, users
    can request as much computing as they need. For example, Roth [10] discusses how
    he recently used a cloud computing facility to find a missing security code by
    testing every possible combination until he found the one that. With a desktop
    computer, this might have taken years, but by programming a cloud to run hundreds
    of virtual copies of his/her program at the same time, the missing code was found
    in minutes, at a cost of about $2. Cloud resources are said to be “elastic”—they
    can expand or contract to the amount of computing power needed at any time. This
    means that very powerful analyses can be conducted more readily than be feasible
    on a desktop computer. Keahey et al. [11] note how several scientists can schedule
    the use of a shared cloud and that open-source cloud software makes it possible
    to quickly create new cloud installations. Of course, licensing approaches need
    to be more flexible for this to be advantageous. A more flexible, “pay-as-you-go”
    approach will need to be integrated into licensing structures.


    # 15.2.5 Cloud Service Models


    Cloud services typically fall into one of three technical/marketing categories:
    infrastructure as a service (IaaS) in which the expert user implements his/her
    software to optimize the use of the computing facility; platform as a service
    (PaaS) in which the client customizes his/her application to run inside the cloud
    management software; and as a service (SaaS), such as Gmail, in which the user
    simply uses the software provided. This flexible approach means that an organization
    with special needs'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# 368 ■ Cloud Computing and Digital Media


    appropriate technical skills can build their own computing solution, while customization
    and the use of generic software can meet most users'' requirements. As a rough
    analogy, for IaaS were renting a car at the airport, then PaaS would be hauling
    a taxi and SaaS would be taking the public bus. The service models provide options
    to suit user independence, expertise, budget, and technical needs. Different services
    will have different benefits; the uptake rate will be influenced by the applicability
    within organizations. The models will need to evolve with requirements of the
    adult literacy providers and their needs for the cloud; executing working cloud
    models and ensuring satisfactory quality of service are essential.


    # 15.2.6 Concerns over Cloud Computing


    The major concern is about security. Since it is difficult to know where a virtual
    job be processed (i., where the computer is physically located), data may cross
    international boundaries and suddenly be open to legal inspection in other countries—this
    would be a concern, for example, should Canadian data that are supposed to be
    protected under Protection of Privacy Laws cross over the United States and be
    subject to the Patriot Act. Hague [12] notes that Microsoft located its European-mail
    server farm in Dublin to alert clients that their data would be open to the US
    government. Private, secure, or mission critical data should not be processed
    in third-party public cloud computing environments. Secure data could be processed
    in private clouds—for example, Danek [13] notes that the Canadian government forecast
    to set up its own secure computing environment to rationalize the use and cost
    of government ICT infrastructure across several departments. A cloud run on systems
    based in Canada would be an essential investment for the adult education and adult
    literacy sector across the country. Clients of these programs belong to marginalized
    groups that share concerns about the protection of their privacy and use of personal
    information. In jurisdictions where adult literacy programs are publicly funded,
    client data include information about government services needs to be secured
    and protected.


    The second concern is the need for a fast and reliable Internet connection. Cloud
    computing involves rapidly moving the data to be processed elsewhere, and then
    returning the results. A slow or intermittent Internet connection can interrupt
    the data flow and separate the user from the virtual machine. (One author of this
    report had to retype paragraphs when a communications interruption disconnected
    him from the word processing application in a cloud environment.) As more and
    more'
