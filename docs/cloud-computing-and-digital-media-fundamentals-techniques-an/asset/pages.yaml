    challenging to handle the large amounts of data within their own organization
    without having large budget, time, and professional expertise. This is why cloud
    computing could make techniques for search, mining, and analysis easily accessible
    from anywhere. Large-scale data and cloud computing are closely linked.


    Cloud computing is fundamental to Web 2.0—it enables convenient access to data
    and services. Sharing large amounts of content is one of the salient features
    of Web 2.0. Clouds further extend these capabilities with externalization of the
    computing and storage resources. Clouds provide virtually “unlimited” capacities
    at users'' disposal. Cloud computing further extends Web 2.0 with means for flexible
    composition of arbitrary services, where the user pays only for the consumed resources.
    This enables communities to be supported with personalized set of services, and
    not just typical ones, which is important for professional communities with specialized
    needs. There is no minimum fee and start-up cost. Cloud vendors charge storage
    and bandwidth. No installation of complex media software and upgrade are needed.
    Expensive and complex licenses are aggregated in the cloud offers. The always-on
    cloud storage provides worldwide distribution of popular multimedia content. The
