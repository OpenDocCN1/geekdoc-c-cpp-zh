    in cloud computing. We then propose queuing model-based resource optimization
    schemes for multimedia cloud computing, in which we present the system models,
    the problem formulations, and the simulation results. Finally, the future research
    directions in the area of multimedia cloud computing will be discussed.


    The remainder of this chapter is organized as follows: Section 2.2 discusses the
    state of the art of optimal resource allocation and QoS provisioning in cloud
    computing. Section 2.3 presents the proposed queuing model-based resource optimization
    schemes, including system models, problem formulations, and simulation results.
    Section 2.4 discusses the future research directions. Finally, Section 2.5 provides
    the summary.


    # 2.2 RELATED WORK


    In this section, we present the recent advances on cloud-based multimedia services
    and resource allocation in cloud computing.


    # 2.2.1 Cloud-Based Multimedia Services


    The development of cloud computing has a profound effect on the development of
    multimedia services. Conventionally, the multimedia storage, streaming, processing,
    and retrieval services are provided by private clusters, which are too expensive
    for small businesses. The “pay-as-you-go” model of public cloud would greatly
    facilitate multimedia service providers, especially the start-up businesses. They
    pay for the computing and storage resources they used, rather than maintaining
    costly private clusters. Cloud-based multimedia services have been increasingly
    adopted in the recent years.


    Cloud-based live video streaming provides an “always-on” video streaming platform
    so that users can access preferred channels at arbitrary time. Huang et al. [6]
    present CloudStream, a cloud-based peer-to-peer (P2P) live video streaming platform
    that utilizes public cloud servers to construct a scalable video delivery platform
    with Scalable Video Coding (SVC). In the CloudStream, a large number of users
    can receive live video stream at the same time by dynamically arranging the available
    resources based on the users. Inspired by the similar idea, Pan et al. [7] present
    a framework of adaptive mobile video streaming and user behavior-oriented video
    prefetching in clouds, which is named as adaptive mobile video prefetching cloud
    (AMVP-Cloud). In the AMVP-Cloud, a private agent is generated for each mobile
    user to provide'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Resource Optimization for Multimedia Cloud Computing ■ 25


    “nonterminating” video streaming and to adapt to the fluctuation of link quality
    based on the SVC technique and feedback from users. With back-ground prefetching
    among video agents and local storage of mobile side, the AMVP-Cloud realizes “nonwaiting”
    experiences for mobile users.


    Besides video streaming, cloud-based media storage is another research topic.
    Liu et al. [8] proposes a real-video-on-demand (VoD) cloud which is called Novaski.
    The Novaski is based on a P2P storage cloud that can store and refresh video stream
    in a decentralized way. The storage cloud is a large-scale pool of storage space,
    which can be accessed conveniently by users who need storage resources. In contrast
    to the traditional P2P VoD with local caching, peers in P2P storage cloud are
    interconnected with a high-bandwidth network, which supplies a stellar level of
    performance when streaming on-demand videos to participating users. Based on the
    P2P storage cloud, the Novaski is able to deliver over 1,000 cinematic-quality
    video streams to 10,000 users at bit rates of 1-2 Mbps, which is much higher than
    the bit rate of 400 Kbps in traditional P2P VoD. In addition to the P2P storage
    cloud, content delivery cloud (CDC) offers elastic, scalable, and low-cost services
    for users. For multimedia streaming, the latency of content delivery can be minimized
    by caching the media content onto the edge server of CDC. The work by Bao and
    Yu [9] studies the caching algorithm for scalable multimedia over CDC, in which
    the edge server can calculate a truncation ratio for the cached multimedia contents
    to balance the quality and the resource usage.


    Mobile multimedia is becoming popular nowadays. The shipments of smart phones
    in the United States have exceeded the traditional computer segments since 2010
    [10]. However, due to the power limit, it is hard to fully operate computationally
    intensive multimedia applications on mobile devices. Cloud computing can help
    to address this issue by providing multimedia applications with powerful computation
    resources and storage spaces. Mobile users, therefore, can easily access the cloud
    media applications through wireless connectivity. Zhang et al. [11] presents an
    interactive mobile search application, which can understand visual queries captured
    by the built-in camera such that mobile-based social activities can be recommended
    for users. On the client end, a user can take a photo and indicate an interested
    object with so-called “O” gesture. On the cloud, a recognition-by-search mechanism
    is implemented on cloud servers to identify users’ visual intent. By incorporating
    visual search results with sensory context [e.g., global positioning system (GPS)
    location], the relevant social activities can be recommended for users.'
