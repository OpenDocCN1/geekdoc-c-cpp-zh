    # 5.2 VIDEO TRANSCODING IN A CLOUD ENVIRONMENT


    In the recent years, cloud computing has become an increasingly broad topic in
    computer science. It is an emerging technology aimed at sharing resources and
    providing various computing and storage services over the Internet. For multimedia
    applications and services over the Internet and mobile networks, there are strong
    demands for cloud computing because of the significant amount of computation required
    for millions of Internet or mobile users simultaneously [10]. As stated in Section
    5.1, to enable DASH streaming, the HTTP server has to prepare the MPD and multiple
    video segments with alternative bit rates as soon as the video is uploaded to
    the server. The complex nature of video transcoding (CPU intensive) and the bursty
    nature of streaming requirements have made cloud computing uniquely suitable for
    video transcoding. Cloud-based video transcoding exhibits the following key characteristics:


    +   - Reliability: In a cloud environment, data backup and recovery are relatively
    easier. Currently, most cloud providers usually provide service-level agreements
    to handle recovery of information. For example, the data (i.e., video segments
    in our case) are usually stored with multiple copies in different places and improves
    the reliability of the whole system in case of disk failure, network disconnection,
    data center damage, and other unexpected events.


    +   - Scalability: Cloud computing allows for immediate scaling, either up or
    down, at any time without long-term commitment as the computing requirements change.
    With cloud computing, the scheduler can easily run the video transcoding tasks
    in parallel according to the requirements. For example, if more video segments
    are uploaded to the server simultaneously, the video transcoding tasks can be
    deployed onto more processing nodes without installing any software or hardware
    by the new user for a application to the new nodes and vice versa.


    +   - Hardware: With cloud computing, it is easy to achieve large volume storage
    space and powerful computing units. As in the application of DASH, the HTTP server
    always needs to keep multiple formats and multiple bit rates of video copies,
    and processes multiple jobs in parallel, which pose extremely high demands on
    hardware resources. A cloud environment, instead of a single machine, can meet'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Video Transcode Scheduling for MPEG-DASH in Cloud Environments ■ 111


    the requirements of the computing-intensive and time-consuming video transcoding
    jobs.


    +   - Cost: The biggest advantage of cloud computing is the elimination of the
    investment in stand-alone software or servers by the user. With cloud computing,
    there are no separate overhead charges as cost of data storage, software updates,
    management, and most importantly cost of quality control. Currently, anyone can
    use the services of cloud computing at affordable rates. In our case, video segments
    can be encoded within a fairly short time after being uploaded to the server by
    spending a small amount of money.


    # 5.2.1 Existing Cloud Video Transcoding Service


    There exist several commercial cloud services that support video transcoding.


    +   - Amazon released their Elastic Transcoder [11] in January 2013. Amazon Elastic
    Transcoder manages aspects of the transcoding process transparently and automatically.
    It also enables customers to process multiple files in parallel and organize their
    transcoding workflow using a feature called transcoding pipelines. With Amazon
    Elastic Transcoder''s pipeline feature, customers set up pipelines for these various
    scenarios and ensure that their files are encoded when how they want, allowing
    them to seamlessly scale for spiky workloads efficiently. It runs the transcoding
    jobs using Amazon Elastic Compute Cloud (Amazon EC2) [12] and stores the video
    content in the Amazon Simple Storage Service (Amazon S3) [13]. Developers can
    simply use the Web-based console or application programming interfaces (APIs)
    to create a transcoding job that specifies an input file, the transcoding settings,
    and the output file. They can also assign the priority of each pipeline to allow
    important videos to be encoded first. Amazon charges a video transcoding fee according
    to the output duration and definition.


    +   - Zencoder [14] provides video transcoding services as well. In addition to
    providing typical video transcoding services in the cloud, it also supports live
    video transcoding. Its Web service accepts Real-Time Messaging Protocol (RTMP)
    input streams and encodes to RTMP and HLS at multiple bit rates for adaptive bit
    rate playback. Zencoder provides different price packages so that users can select
    the most appropriate one on their own video duration and definition.'
