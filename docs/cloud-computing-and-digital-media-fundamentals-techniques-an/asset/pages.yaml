    Among the board games, Connect6 attracted much attention due to three merits:
    fairness, simplicity of rules, and game complexity. First, Connect6 is fair in
    the sense of balancing. For example, each player has one stone more than the other,
    after finishing a move and before the opponent makes the next move. Second, Connect6
    is simple in the sense that no extra rules are imposed. In contrast, prohibition
    rules of double threes and doubles for Black are imposed in Renju, a professional
    version of five-in-a-row games [2], for the sake of balancing. Third, Connect6
    is complex in the sense of game tree complexity, since the combination of choosing
    two intersections to place stones is normally much higher than of choosing one.


