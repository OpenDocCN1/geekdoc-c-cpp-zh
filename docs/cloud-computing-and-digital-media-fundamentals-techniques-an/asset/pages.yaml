  md: '# Editors


    Kuan-Ching Li is a professor in the Department of Computer Science and Information
    Engineering and the special assistant to the university president at Providence
    University, Taiwan. He earned his PhD in 2001 from the University of São Paulo,
    Brazil. He has received awards from NVIDIA, investigator of several National Science
    Council (NSC) awards, and also has held visiting professorships at universities
    in China and Brazil. He serves or has served as the chair of several conferences
    and workshops, and he has organized numerous conferences related to high-performance
    computing and computational science and engineering. Dr. Li is the editor-in-chief
    of the technical publications International Journal of Computational Science and
    Engineering (IJCSE) and International Journal of Embedded Systems (IJES), both
    published by Inderscience, and he also serves on editorial boards and as guest
    editor for a number of journals. He is a fellow of the Institution of Engineering
    and Technology (IET), a senior member of the Institute of Electrical and Electronics
    Engineers (IEEE), and a member of the Taiwan Association for Cloud Computing (TACC).
    He has coautored over 100 articles in peer-reviewed journals and conferences on
    topics that included networked computing, graphics processing unit (GPU) computing,
    parallel software design, virtualization technologies, and performance evaluation
    and benchmarking.


    Qing Li is a professor in the Department of Computer Science, City University
    of Hong Kong, where he has been a faculty member since September 1998. He earned
    his BEng at Hunan University and MSc and PhD at the University of Southern California,
    Los Angeles, all in computer science. His research interests include database
    modeling, Web services, multimedia retrieval and management, and e-learning systems.
    He has been actively involved in the research community and is serving or has
    served as an editor of several leading technical journals, such'
  merge: -1
  img_proc: true
