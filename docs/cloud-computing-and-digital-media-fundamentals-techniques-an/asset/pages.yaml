- pgno: 353
  md: '# Standardized Multimedia Data in Health-Care Applications ■ 331


    The DICOM standard is related to the field of medical informatics. Within that
    field, it addresses the exchange of digital information between medical imaging
    equipment and other systems. Due to the fact that such equipment may interoperate
    with other medical devices, the scope of this standard needs to overlap with other
    areas of medical informatics.


    13.3.1.1 DICOM and Interoperability - In digitized form, the individual patient''s
    medical record can be stored, retrieved, and shared over a network through enhancement
    in information technology. Thus, EHRs should be standardized, incorporating semantic
    interoperability. Semantic interoperability refers to the ability of computer
    systems to transmit data with unambiguous, shared meaning. The DICOM standard
    facilitates the interoperability of devices claiming conformance by


    +   Addressing the semantics of commands and associated data. Thus, devices must
    have standards on how they will react to commands and associated data, not just
    the information that is to be moved between devices.


    +   Providing semantics of the file services, file formats, and information directories
    necessary for off-line communication.


    +   Explicitly defining the conformance requirements of implementation. A conformance
    statement must specify enough information to determine the functions for which
    interoperability can be expected with another device claiming conformance.


    +   Making use of existing international standards where applicable, and itself
    conforms to establish documentation guidelines for international standards.


    The DICOM standard facilitates the interoperability of systems claiming conformance
    in a multivendor environment, but does not, by itself, guarantee interoperability.


    13.3.1.2 DICOM and Security The DICOM standard does not address any security issues
    directly but focus on appropriate security policies, which are necessary for a
    higher level of security. It only provides mechanisms that could be used to implement
    security policies with regard to interchange of DICOM objects between application
    entities. For example, a security policy'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# 332 Cloud Computing and Digital Media


    dictate some level of access control. This provides the technological means for
    the application entities involved in exchange sufficient information to implement
    access controls. The DICOM standard assumes that the application entities involved
    in a DICOM interchange can implement appropriate security policies. Essentially,
    each application entity must ensure that their own local environment is secure
    before attempting securing communications with other application entities. The
    standard assumes that application entities can securely identify local users of
    the application entity, using the users'' rules or licenses. It also assumes that
    entities have to determine whether the "owners" (i.e., patients or institutions)
    of information have authorized users, or classes of users to access information.


    This standard also assumes that an application entity using Transport Layer Security
    (TLS) has secure access to or securely obtain X.509 key certificates for the users
    of the application entities.


    Table 13.1 depicts the scope of the EHR standards with regard to two basic properties
    of an EHR: the EHR content structure and the access services (communication protocol)
    [12]. It also gives a brief comparison between the security measures taken by
    IADO and DICOM reporting (SR) standards.


    For the content-related features such as the persistent documents, multimedia
    content, and content that can be easily processed, distribution rules, visualization,
    and digital signatures (for providing security) are taken into consideration.
    As indicated in Table 13.1, the standard ISO WADO does not support for content
    structure. Thus, none of the above-mentioned features are supported by it. The
    DICOM SR has support for content structure but does not support the visualization
    for content. It also not have any specified rules for distribution for the content.


    Similarly, considering the comparison based on access services such as querying,
    retrieval, and submitting EHR content and content formats, both the standards
    have support for these. At the same time, none of them have complete support for
    these. Considering retrieval and storage of EHR content, ISO WADO has the functionality
    to support, but it lacks support for the querying and submission of EHR content.
    The DICOM SR has support for querying, retrieval, and submission as well as storage
    supports. Both these standards lack the formatting agnostics of the EHR content.


    In case of the EHR data, the security of the data plays an important role. But,
