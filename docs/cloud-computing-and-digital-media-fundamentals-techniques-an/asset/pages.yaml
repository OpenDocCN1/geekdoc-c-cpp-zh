    # 9.3.5 Summary


    In this case study, we focus on the efficient evaluation of multiway theta-join
    queries using MapReduce. The solution includes two parts. First, we study how
    to conduct a chain-type multiway theta-join using MapReduce job. We present a
    Hilbert curve-based space partition method that minimizes data copying over network
    and balances the workload among Reduce tasks. Second, we elaborate a resource-aware
    scheduling scheme that handles the evaluation of complex queries achieve a near-optimal
    time efficiency in resource-restricted scenarios.


    # 9.4 CASE STUDY 2: SPARQL QUERY PROCESSING


    With increasing supports from prevailing search engine projects, as such Rich
    Snippets from Google and SearchMoney from Yahoo!, as well as the willingness to
    integrate across-domain knowledge, there emerges a huge volume of RDF data for
    management and analysis. For example, the largest RDF dataset [30] available in
    the Linked Data community [31] has over 3.2 billion triples, and the largest dataset
    containing various bio- and gene-related data (Bio2RDF) has over 2.7 billion triples.
    The increasing demands of massive data-intensive RDF data analysis and the great
