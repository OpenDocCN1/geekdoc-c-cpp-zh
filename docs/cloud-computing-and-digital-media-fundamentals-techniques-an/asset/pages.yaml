    # 2.4 FUTURE RESEARCH DIRECTIONS


    In spite of the progress made in cloud computing, there remain a number of important
    open issues as follows:


    +   1. Resource demand prediction. Since the process of cloud resource allocation
    takes time to complete, it will be too late to prevent the QoS degradation if
    the resource reallocation is only carried out when'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 42 ■ Cloud Computing and Digital Media


    resources become insufficient. Therefore, an accurate resource demand prediction
    model is required to forecast the resource demand in the near-term future based
    on the previous statistics.


    +   Workload monitoring. The workload in cloud is changing in real time. To allocate
    resources to satisfy the dynamic workload, especially the burst of requests, a
    live workload monitoring is needed for cloud providers. In addition, it is a challenge
    to dynamically allocate the cloud resources to handle the time-varying workload.


    +   Workload scheduling. There are two levels of scheduling in cloud computing.
    The first level is the user-level scheduling, in which the requests for one application
    are distributed to different VMs according to the current workload. By balancing
    workload among the VMs, the user-level scheduling can effectively avoid episodic
    congestions in the cloud. Compared to the user-level scheduling, the task-level
    scheduling performs in a finer granularity. An application can be decomposed into
    a set of tasks, each of which requires different resources. The task-level scheduling
    is to assign different tasks to different VMs so that the performance can be maximized.


    +   Resource migration. With current techniques, VMs and application migrations
    have been implemented in the local area network (LAN) environment. In the future,
    cloud should be able to migrate VMs and services to other clouds, which can greatly
    improve the robustness of cloud data center.


    +   Joint resource optimization. Currently, most of the resource optimization
    methods focus only on the cloud side, ignoring the transmission path and the user
    side. In fact, it is a challenging task to minimize or maximize an end-to-end
    QoS metric by jointly optimizing the resources in the cloud, at the client, and
    along the transmission path between the cloud and the client.


    # 2.5 SUMMARY


    Multimedia cloud computing, as a specific cloud computing model, focuses on how
    cloud can effectively provide multimedia services and guarantee QoS provisioning.
    Optimal resource allocation in multimedia cloud computing can greatly improve
    the performance for multimedia applications. In this chapter, we investigate the
    optimal resource allocation for multimedia cloud computing. We first provide a
    review of recent advances on'
