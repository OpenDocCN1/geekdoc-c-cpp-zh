    We need to control this by buying expensive but trustworthy hardware and designing
    the program.


    Parallel computing may become the only solution to deal with large photo collections.
    However, it requires more careful design than running on a super computer of the
    implementation of scene reconstruction. Since every node in a cluster may fail,
    the first thing of our system is to detect the status of each node periodically
    and make response. When a node fails, we need to make sure that we have backup
    data in another computer and can resume the previous job successfully. Moreover,
    we must design a program to combine the data from all nodes. Such all additional
    work makes the pipeline of scene reconstruction more complex and hard to control.


    If there exists a platform that has already waived us from such additional work,
    and provided us the powerful but simple parallel computing in front of us, why
    shall we not explore the possibility of applying scene reconstruction on this
