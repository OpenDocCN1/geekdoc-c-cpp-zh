  md: '# 4.4 METHODS OF QBEE


    QBEE (or AFP) is a fast, convenient, and noise robust method for MIR based on
    an exact but noisy music clip. Figure 4.12 shows the block diagram of a QBEE system
    based on Wang''s seminal work [9]. In the offline stage, each music clip in the
    database is converted into a spectrogram, where pairs of salient peaks are selected
    to form landmarks. There are several approaches based on salient peaks. One approach,
    as proposed by Ellis [10], is to create an energy threshold based on the Gaussian
    functions centered at local maxima of the power spectrum for a specific frame.
    Thus, a local peak is considered to be salient if it is equal to the energy threshold,
    as shown in Figure 4.13, where thin line is the spectrum, the dots are the local
    peaks, and the thick line is the energy threshold. To remove the local peaks that
    are not salient along time, the energy threshold is linearly decayed and recomputed
    along the time in both directions. A typical 3D view of the energy threshold along
    the positive time axis is shown in Figure 4.14.


    After obtaining the salient peaks, we pair the peaks to form landmarks. A peak
    is paired with other peaks following it in a specific range.


