    # 10.2 GAME TREE SEARCH APPLICATIONS


    # 10.2.1 Computer Board Games


    A typical board contains two players, Black and White, which alternately place
    black and white stones on empty intersections of a Go board (19 x 19 board) in
    each turn. The common computer board games include Connect6 [26], Chess [19,20],
    Chinese Chess [29], Go [15,18], and Shogi [19]. For example, in Connect6, two
    players alternately two black and white stones, respectively, on empty intersections
    of a Go board (19 x 19 board) in each turn. Black plays first and places one stone
    initially. The player who gets six consecutive stones of his/her own first horizontally,
    vertically, and diagonally wins.


    A game tree is a directed graph whose nodes represent the states of the game board
    and whose edges represent the moves. The computer board games heavily rely on
    tree search algorithms in several ways. Starting from'
