  md: '# 330 Cloud Computing and Digital Media


    Structured reports are sharable among different clinical experts and can be stored
    and viewed by any Picture Archiving and Communication System (PACS). These are
    the broad systems that can visualize and do processing of the images they manage
    and archive. The PACS needs to import images for visualization, which leads to
    consideration of persistence management and information consistency. In order
    to achieve image import, the system performs image streaming with the help of
    the Web Access to DICOM Persistent Objects (WADO).


    ISO WADO provides a web-based service that can be used to retrieve DICOM objects
    (images, waveforms, and reports) by Hypertext Transfer Protocol (HTTP) or HTTP
    Secure (HTTPS) from a Web server. DICOM Structured Report (DICOM SR) is a general
    model for encoding medical reports in a structured manner in DICOM''s tag-based
    format. It allows the existing DICOM infrastructure network services, such as
    storage or query/retrieve, to be used to archive and communicate, encrypt, and
    digitally signed reports with relatively small changes to the existing systems
    [12]. Siemens has launched a new PACS called syngo. plaza [13]. It is the new
    agile PACS solution for the clinical routine, where 2D, 3D, and 4D reading comes
    together at one place. EndSoft application [14] contains an integrated DICOM-compliant
    solution that generates and exports images from the EndoSoft endoscopy software
    to a PACS system.


    Some of the key benefits of DICOM are as follows:


    +   1. Better communication with the physician

    2. More accurate coding of diagnosis and fewer rejections

    3. Faster turnaround (the creation of the radiology report is achieved according
    to an interpretation process)

    4. Minimization of the typing work

    5. Data are archived, transferred, and managed with the images.

    6. References to evidences used for interpretation

    7. References to prior reports and similar case history

    8. Whole track records can be maintained for patients by maintaining the references
    of the same type of previous report.

    9. Structured report is the stand-alone complete information object.'
