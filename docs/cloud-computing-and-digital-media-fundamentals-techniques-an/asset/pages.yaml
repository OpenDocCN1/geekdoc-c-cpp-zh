    # 14.4 UPCOMING SCENARIOS AND RECOMMENDATIONS


    The development of new technologies is significantly changing the existing business
    models and legal frameworks, and puts in conflict the fundamental rights that
    were not in conflict before (e.g., privacy and copyright). This is pushing toward
    finding new balances between the concurrent interests of the right holders, CSPs,
    and other service providers and intermediaries.


    Although the incidence of copyright piracy, have contents have also contributed
    to opening the way to new distribution models via legal digital platforms. Yet
    distribution of digital content remains too segmented due to limitations imposed
