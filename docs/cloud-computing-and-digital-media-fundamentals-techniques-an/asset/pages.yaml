    # 10.3 PARALLELISM OF GAME TREE SEARCH APPLICATIONS


    In the board game application, both the editor and the JL module take huge amount
    of time or uncertain time for executing tasks, making them difficult to be integrated.
    Thus, it becomes significant to offload the game search jobs to other workers.


    In Connect6 applications, two approaches or their combination are used to run
    jobs in parallel. The first approach is to trigger jobs in parallel manually.
    When the users reading intriguing positions, they can trigger “M” and “V” operations
    for these positions by the editor tools shown in Figure 10.1.


    The “M” operation is used to invoke NCTU6 to find a best move at a given state,
    while the “V” operation is used to verify whether the moves lead to a win (or
    lose) state. When these operations are triggered, the jobs are generated and then
    dispatched to remote workers. If no more workers are available, these jobs wait
    in a job queue maintained inside the program Connect6Lib itself and will be dispatched.
    Using the editor tools, the game developers can control the execution of several
    operations for different positions concurrently.


    The second approach is to use a program to run jobs in parallel automatically.
    In Reference 9, JL proof number search (JL-PNS) is used to'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 242 ■ Cloud Computing and Digital Media


    generate moves automatically. JL-PN search is a kind of PN search, where each
    tree node is a heavy job, each requiring tens of seconds or more.


    PN search is a kind of best-first algorithm that was successfully used to prove
    or solve the theoretical values of game positions for many games [9,10], as Connect
    Four, Gomoku, Renju, Checkers, Lines of Action, Go, and Shogi. PN search is based
    on an AND/OR search tree, where each node is associated with PN/disproof number
    that indicates the minimum number of node expansions (or evaluations) to prove/disprove
    the node. During each round, the search chooses one node, named the most proving
    node (MPN), expands it, and then reevaluates the PN/disproof number of the node
    and its ancestors. An important property about MPN is as follows: If the MPN is
    proved/disproved, the PN/disproof number of root decreases by one. Thus, if the
    root is to proved/disproved, the PN search will use the MPNs to lead to proving/disproving
    the root.


    The most best-first PN search has a well-known disadvantage: the requirement of
    maintaining the whole search tree in the memory. Therefore, many variations [9,10]
    were proposed to solve this problem, as two-level PNS (PN^2), Depth-First-Number
    Search (Df-PN, Proof-Number* (PN*), and Proof-number and Disproof-Number Search
    (PDS). With the JL-PN search, it becomes possible to maintain the JL-PN search
    tree inside the client memory without much problem according to our experiences
    for Connect6.


    In JL-PN search for Connect6 (described in more detail in Reference 9), NCTU is
    used to expand OR nodes (or generate nodes from OR nodes), whereas Verifier is
    used to expand AND nodes. In our experiences, the search tree usually contains
    no more than 1 million nodes, which can fit process (client) memory. Assume that
    it takes 1 minute (60 seconds) to run NCTU6. A volunteering system with 60 processors
    takes about 11 days to build a tree up to 1 million nodes. In such cases, we can
    manually split one JL-PN search into two.


    From the two approaches, Connect6 applications require both prompt interaction
    (for the first approach) and dynamic job scheduling (the second approach). For
    the former, prompt interaction, the users want to read the returning messages
    such as the best moves and all possible defensive moves promptly. As for the latter,
    highly dynamic job scheduling, in case that some node is proved, all the subtree
    nodes should be aborted immediately. Similarly, if the node is disproved, the
    subtree nodes should be aborted.'
