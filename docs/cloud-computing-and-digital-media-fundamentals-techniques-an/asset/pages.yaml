  merge: -1
  img_proc: true
- pgno: 52
  md: '# 30 Cloud Computing and Digital Media


    by the SLA and no request is dropped during the process. Therefore, the number
    of results is equal to that of received requests.


    # 2.3.1.3 Cost Model


    The allocated cloud resources in our study include the scheduling resource at
    the master server, the computation resource at the computing servers, and the
    bandwidth resource at the transmission server. We employ a linear function to
    model the relationship of the resource cost and the allocated resources. The total
    resource cost $z^{cost(t)}$ at time slot $t$ can be formulated as


    ```

    $z^{cost(t)} = \frac{\hat{E}}{\hat{A}}S^t + \sum_{j=1}^{N} \frac{\hat{B}}{\hat{C}}C_j^t
    + \hat{\beta}\hat{\gamma}G \quad (2.1)$

    ```


    where:

    $\Gamma$ is the time slot length


    $S^t$ is the allocated scheduling resource

    $C_i^t$ is the allocated computation resource at the computing server $i$

    $B^t$ is the allocated bandwidth resource


    $\alpha$, $\beta$, and $\gamma$ are the cost rates for scheduling, computation,
    and transmission, respectively


    The linear cost model in Equation 2.1 has been justified by the numerical analysis
    in Reference 5.


    # 2.3.2 Problem Formulation


    Based on the proposed system models, we study the resource optimization problems
    in the FCFS service case and the priority service case. In each case, we optimize
    cloud resources to minimize the service response time and the resource cost, respectively.


    # 2.3.2.1 FCFS Service Case


    In the FCFS service case, the requests of users are served in the order that they
    arrived at the data center. All requests are processed with the same priority.
    Suppose there are $M$ classes of applications provided in multimedia cloud. Applications
    have different processing procedures, task sizes, result sizes, as well as different
    requirements on service response time. The mean arrival rates of the requests
    at time slot $t$ are denoted as $\lambda_1^t, \lambda_2^t, ..., \lambda_M^t$,
    respectively. According to the composition property of Poisson process [31], the
    total arrivals of requests follow the Poisson process with an average arrival
    rate $\lambda^t = \hat{\lambda}^t\mathbf{1}^t$. Thus, the'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Resource Optimization for Multimedia Cloud Computing ■ 31


    scheduling queue can be modeled as an $M/M/1$ queuing system [30] with the mean
    service rate $S^s$ at the master server. To maintain a stable queue, $\lambda^s
    < S^s$ is required. The response time of the scheduling queue is given


    ```

    $T_{FCFS}^{com(s)} = \frac{1/S^s}{1-\lambda^s/S^s}$

    ```


    Each application requires a different service procedure. $M$ computing servers
    are employed to process $M$ classes of applications, in which computing server
    $i$ is dedicated to service requests for class $i$ application. Since the VMS
    can be dynamically provisioned and released in the cloud, the number of computing
    servers can be dynamically changed according to the number of applications. For
    class-$i$ application, the average task size is denoted by $F_i$ and the execution
    time is a random variable, which is assumed to follow exponential distribution
    with average $F_i/C_i$ [32,33]. To maintain a stable queue, the constraint $\lambda^i
    < C_i/F_i$ must be satisfied. The response time at computing server $i$ is given


    ```

    $T_{FCFS}^{com(i)(t)} = \frac{F_i/C_i}{1-\lambda^i/C_i}$

    ```


    Therefore, the average response time in computation phase can be formulated as


    ```

    $T_{FCFS}^{com(t)} = \mathbf{\hat{A}}(1/\lambda^i \cdot T_{FCFS}^{com(i)(t)})
    = \mathbf{\hat{A}} \frac{F_i/C_i}{\lambda^i(1-\\lambda^i/C_i)}$

    ```


    After processing, all service results are sent to the transmission queue. Since
    a result is requested for each and the service is a closed system, the average
    arrival rate of the results at the transmission queue is $\lambda$$. For class-$i$
    application, the average result size is denoted by $D_i$. Different applications
    have different result sizes, leading to different transmission time. The transmission
