    # 3.3.3 Fog/Edge Computing


    Reduced latency, media content and processing, and aggregation are pushed to the
    edge of the network, that is, mobile network base stations or WiFi hot spots.
    In a nutshell, fog computing offers combined virtualized resources such as computational
    power, storage capacity, and networking services at the edge of the networks,
    that is, closer to the end users. Fog computing supports applications and services
    that require very low latency, location awareness, and mobility. Fog computing
    is a highly virtualized platform that provides compute, storage, and networking
    services between the end devices and the traditional cloud data centers, typically,
    but not exclusively located at the edge of network [23]. Satyanarayanan et al.
    [13] define a similar cloudlets, which are software/hardware architectural elements
    that exist on the convergence of mobile and cloud computing. They are the middle
    element in the three-tier architecture—mobile device, cloudlet, and cloud. Cloudlets
    emerge as enabling technology for resource-intensive but also latency-sensitive
    mobile applications. The critical dependence on a distant cloud is replaced by
    dependence on a nearby cloudlet and besteffort synchronization with the distant
    cloud (Figure 3.3).'
