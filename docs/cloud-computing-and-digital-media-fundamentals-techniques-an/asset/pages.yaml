    # 11.3 SCENE RECONSTRUCTION BASED ON CLOUD COMPUTING


    From Section 11.2, we have the fundamental idea of scene reconstruction and the
    time complexity of each step. Noting that reconstructing scene from an image set
    of 415 photos took 21 hours by one computer, we can easily imagine that if we
    apply this technology to construct the 3D structure of a landscape or a city from
    10,000 photos or, the most challenging problem we have to meet is to find a solution
    that can speed up the process of reconstruction, otherwise we could finally get
    our new reconstructed world from 10,000 photos after months or even years of time.
    Because of the large amount of calculation and the possibility of parallel computing
    in some steps (i.e., feature matching, SIFT detector, and $F$- and $H$-matrix
    computing), we come up with the idea of utilizing the benefits of parallel computing
    to help reduce the wait time cost. Also, since the reconstruction pipeline will
    become a large job working for day and night, and produce large amount of data,
    we need a platform to help us deal with the key feature of reliability, scalability,
    and security, which will benefit the scene reconstruction pipeline a lot. Then
    we come to the solution: scene reconstruction based on cloud computing.


    # 11.3.1 Introduction to Google Cloud Model


    When we talk about cloud computing, the first word comes into our mind is Google.
    Google''s cloud computing technique is customized for specific Google network
