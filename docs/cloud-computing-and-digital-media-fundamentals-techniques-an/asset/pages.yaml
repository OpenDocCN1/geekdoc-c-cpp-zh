    # 12.5 FIELD STUDY


    Based on an iterative user-centered approach, we conducted two successive qualitative
    experiments to evaluate the pearl metaphor. For this purpose, we implemented the
    PearlyDesktop as a Java prototype based on the Prefuse (Heer et al. 2005) and
    Vizster (Heer and Boyd 2005) software libraries devoted to interactive visualization.


    # 12.5.1 Protocol


    Four experts were recruited: three doctors (participants P1, P3, and P4) to validate
    the characterization of socially augmented data and the relevance of their presentation,
    and one specialist of medical information systems for gastroenterology(participant
    P2). Fifty medical records were entered into the database.


    Each interview lasted about an hour and was divided into three parts: (1) presentation
    of the prototype, (2) playing scenarios, and (3) filling a qualitative questionnaire.
    All interviews were recorded and then transcribed.


    The first part consisted in representing the main features of the UI. We chose
    to represent the fictive professional network of Dr. Roger filled with fictive
    medical records.


    For the second part, participants had to perform three different kinds of tasks
    identified as representative:


    +   1. Search for an expertise

    2. Search for a private medical record shared with a student

    3. Control the dissemination of a sensitive medical record


    At the end of this part, users were invited to provide comments about the prototype
    (usability, utility, etc.).'
