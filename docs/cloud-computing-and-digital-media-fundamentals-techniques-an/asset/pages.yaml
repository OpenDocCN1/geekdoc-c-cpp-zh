    # 9.3.2 Problem Definition


    Our solution targets the MapReduce job identification and scheduling. In other
    words, we work on the rules to properly decompose the query processing into several
    MapReduce jobs and have them executed in a well-scheduled fashion that the minimum
    evaluation time span is achieved. In this section, we shall first present the
    terminologies that we use in this chapter, and then give the formal definition
    of the problem. We show that the problem of finding the optimal query evaluation
    plan is NP-hard.


    Terminology and statement: For the case of presentation, in the rest of the chapter,
    we use the notation of “N-join” query to denote a multiway theta-join query. We
    use MRJ to denote a MapReduce job.


    Consider an N-join query Q defined over m relations R₁, Rₘ and n specified conditions
    j₁,jn. As adopted in many other works, such as in Reference 4, we can present
    Q as a graph, named, a join graph. For completeness, we define a join graph Gⱼ
    as follows:


    > **DEFINITION 1:** A join graph Gⱼ = {V, E, L} is a connected graph with edge
    labels, where V = {v|v∈R₁, Rₘ}, E = {e|e = (v₁,vⱼ)∈$ᵢ, ⊢qₖQ}, L = {l(eᵢ) = q_ᵢ}:


    Intuitively, Gⱼ is generated by every relation in G a vertex and connecting two
    vertices if there is a join operator between them. The edge is labeled with the
    corresponding join function θ. To evaluate Q, every θ function, that is, every
    edge from Gⱼ needs to be evaluated. However, to evaluate all the edges in Gⱼ there
    are an exponential number of plans since any arbitrary number of connecting edges
    can be evaluated in one MRJ. We propose a join-path graph to cover all the possibilities.
    For the purpose of clear illustration, we define a no-edge-repeating path between
    two vertices of Gⱼ in the first place.


    > **DEFINITION 2:** A no-edge-repeating path p between two vertices vᵢ and vj
    in Gⱼ is a traversing sequence of connecting edges (eₚ, ..., ej) between vᵢ and
    vj in Gⱼ in which no edge appears more than once.'
