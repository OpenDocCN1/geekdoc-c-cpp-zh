    # 13.4 ISSUES RELATED TO MULTIMEDIA DATA IN EHRs


    The slow acceptance of EHRs and multimedia technology in health care is due to
    many reasons such as adding older records into EHR system, storage and long-term
    preservation, synchronization of data, hardware'
