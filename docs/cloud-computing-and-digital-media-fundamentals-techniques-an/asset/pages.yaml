  md: '# Mobile Multimedia Cloud Computing ■ 17


    Cloud multimedia adaptation as a service [3] transforms input multimedia contents
    into an output video in a form that meets the needs of heterogeneous devices.
    It plays an important role in multimedia delivery. In general, video adaptation
    needs a large amount of computing, especially when there are a vast number of
    simultaneous consumer requests. Because of the strong computing and storage power
    of the cloud, cloud multimedia adaptation can conduct both offline and online
    adaptation to different types of terminals. CloudCoder is a good example of a
    cloud-based video adaptation service that was built on the Microsoft Azure platform
    [22]. CloudCoder is integrated into the origin digital content management platform
    offloading much of the processing to the cloud. The number of transcoder instances
    automatically scale to handle the increased or decreased volume. Zhu et al. [3]
    presented a cloud-based video adaptation framework in which the cloud video adaptation
    is responsible for collecting customized parameters, such as size window, bandwidth,
    and generating variations either offline or on the fly. One of the future research
    topics is how to perform video adaptation on the fly.


    Cloud multimedia retrieval as a service is a good example of cloud computing to
    search digital images in a large database based on the image content. Zhu et al.
    [3] discussed content-based image retrieval (CBIR) [23] can be integrated into
    cloud computing. CBIR includes multimedia feature extraction, similarity measurement,
    and relevance feedback. The key challenges in CBIR are how to improve the search
    quality and how reduce computation time. Searching in a database such as the Internet
    is becoming computation intensive. With the use of the strong computing capacity
    of a media cloud, one can achieve a higher search quality with acceptable computation
    time, resulting in better performance.


    # 1.6 CONCLUSION


    Multimedia computing needs powerful computing and storage capacity for handling
    multimedia content while achieving the desired QoE, as response time, computing
    cost, network bandwidth, and concurrent user numbers. Mobile devices are constrained
    in resources of memory, computing power, and battery life in the handling of multimedia
    content. Cloud computing has the ability to develop on-demand computing and storage
    capacities by networking computer server resources. Integrating cloud computing
    into mobile multimedia applications has a profound impact on the entire life cycle
    of multimedia contents, such as authoring, storing, rendering, streaming and sharing,
    and retrieving. With the use of'
