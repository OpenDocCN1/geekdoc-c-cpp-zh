    # 15.5 QUESTION: WHAT MIGHT A CLOUD COMPUTING STRATEGY FOR ADULT LITERACY LOOK
    LIKE AND ARE THE CHALLENGES TO REALIZE SUCH A VISION?


    Whenever a new technology is implemented, there is a tendency to think of it and
    use it in whatever it replaced, similar to the way automobiles were first thought
    of as horseless carriages. Gradually, as improves, it finds acceptance and stimulates
    new ideas and new ways of using it—much the web mobile phones merged with personal
    digital assistants (PDAs) that can access the Internet. Cloud computing is not
    simply an extension of the Internet; it represents a convergence of Web service
    with high-performance computing, delivered on demand over broadband networks.


    Although the initial entry point of cloud computing into the education sector
    is the outsourcing of e-mail and collaboration software, we are beginning to see
    ubiquitous access to an unprecedented variety of on-demand computing services—services
    that require processing for short instances—enough to instantly convert a tourist''s
    digital snapshot of a street sign into text, to translate the text to the target
    language, and return an audio message to the user, perhaps with an accompanying
    map and directions back to the hotel. Such applications are already being used
    and can be adapted for a wide variety of literacy applications.


    However, augmenting knowledge is not the same as amplifying learning—while we
    still do not fully understand how people learn best, we do know many useful ways
    in which technology can support learning and support the performance of daily
    tasks. Unfortunately, promising practices are currently scattered and not collected
    together into a cohesive framework. For this, we need community building and agreements
    to make it possible to cut and paste instructional ideas and resources from one
    computing environment into another. Cloud computing can serve to provide a ubiquitous
    platform to make such techniques coalesce into a common infrastructure for adult
    literacy.


    The following sections imagine a progression of cloud computing applications from
    simple (what we are doing now) to complex (what we might do in the future). We
    pass through our current state of online applications or “Apps” that provide personal
    computing support and community collaborations to the power that comes from being
    able to track language acquisition and analyze one''s performance in order to
    prescribe'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'appropriate learning methods and appropriate instructional resources for literacy
    training. As we may also see the rise of contextualized devices that will help
    everyone decode the text back into the spoken words it represents, the latest
    level are applications that will illiteracy no more an impairment as an astigmatism
    is for those wearing corrective eyeglasses. There are two paths to end illiteracy,
    while educators might persevere in training low-literacy adults, and perhaps the
    real power of cloud computing will be in developing methods and devices that make
    the stigma irrelevant.


    # 15.5.1 Provision of Personal Computing


    No fee provision of application services means anyone who can get on the Internet
