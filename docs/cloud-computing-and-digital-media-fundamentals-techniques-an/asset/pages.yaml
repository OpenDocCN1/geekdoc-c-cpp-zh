    # 11.1.3 Challenges in Scene Reconstruction


    Although the scene reconstruction pipeline provides a robust and stable way to
    construct the geometry of the scene, it is still hard to apply to the large photo
    collections from the Internet because of the hard calculation and memory space.
    There are several parts of the scene reconstruction pipeline that requires significant
    computational resources: scale-invariant feature transform (SIFT) [3] feature
    detection, pairwise feature matching, F-matrix estimation, H-matrix estimation,
    linking matches into tracks, and incremental structure from motion (SfM) [4].
    We will describe all these steps in detail and the time complexity in Section
    11.3. In my'
