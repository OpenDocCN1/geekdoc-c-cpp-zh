- pgno: 24
  md: '# Cloud Computing and Digital Media


    # 1.1 INTRODUCTION


    Mobile multimedia cloud provides access to data-intensive services (multimedia
    services) and data stored in the cloud via power-constrained mobile devices. With
    the development of multimedia computing, mobile devices, mobile multimedia services,
    and cloud computing, mobile multimedia cloud computing attracts growing attention
    from researchers and practitioners [1–3].


    Mobile devices refer to miniaturized personal computers (PCs) [4] in the form
    of pocket PCs, tablet PCs, and smartphones. They provide optional and portable
    ways for users to experience the computing world. Mobile devices [5] are also
    becoming the most frequently used terminal to access information through the Internet
    and social networks. A mobile application (mobile app) [4,6] is a software application
    designed to run on mobile devices. Mobile apps such as Apple App Store (https://store.apple.com/us),
    Google Play (https://play.google.com/store?hl=en), Windows Phone Store (http://www.windowsphone.com/en-us/),
    and BlackBerry App World (http://appworld.blackberry.com/webstore/) are usually
    operated by the owner of the mobile system. Original mobile apps were for general
    purposes, e-mail, calendars, contacts, stock market, and weather information.
    However, the number and variety of apps are quickly increasing to other categories,
    such as mobile games, factory automation, global positioning system (GPS) and
    location-based services, binding ticket purchases, and multimedia applications.
    Mobile multimedia applications are concerned with intelligent multimedia techniques
    to facilitate effort-free multimedia experiences on mobile devices, including
    media acquisition, editing, sharing, browsing, management, search, advertising,
    and related user interface [7]. However, mobile multimedia service still needs
    to meet bandwidth requirements and stringent timing constraints [8].


    Cloud computing creates a new way of designing, developing, deploying, and maintaining
    applications on the Internet [9]. The cloud center distributes power, applications,
