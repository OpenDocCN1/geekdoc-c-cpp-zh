    # 15.5.6 Beyond Text: Is Literacy Obsolete?


    Early digital computers had to be programmed using binary code, and only in the
    1970s, did we see higher level computer languages that allowed programmers to
    specify directions in English-like text commands. Today computers (like those
    used in a car''s navigation system) can be directly interfaced by voice command.
    Smartphones equipped with cameras can easily read quick response (QR) codes and
    retrieve messages from the Internet—including short video clips or other relevant
    material. With enhanced processing, text analysis can be made available to scan
    and interpret text—not just into English, but through other Web services such
    as Google Translate, to the target language of choice. For the large number of
    Canadians who struggle in adult basic education classes, this form of literacy
    appliance can be an excellent assistive technology. Voice to text, text to voice,
    French to English, or any other language, we are approaching the era where the
    universal translator once the stuff of science fiction (like the Babel Fish translator
    in The Hitchhiker''s Guide to the Galaxy) is becoming a reality.


    Universal literacy is a fairly modern concept that came along with the industrial
    revolution and the need to have a literate population to work and communicate
    in the era of the post office. Before literacy “scribes” were called upon to write
    and read letters dictated by the illiterate members of their community. Perhaps,
    voice and video over Internet and mobile phones have flattened the need for this
    type of training, and with electronic book readers, the illiterate have gained
    access to copious amounts of text information. In parts of Africa, the tribal
    herds have given way to solar-powered FM transmitters and mobile phones—neither
    of which rely on the heavy burden of text that extracts many years of anguish
    among the dyslexic population and others that have the fortune of reading difficulties.
    In the near future, speech-to-text and text-to-speech applications will help to
    level the playing field for with'
