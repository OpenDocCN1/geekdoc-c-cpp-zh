    10.4.4.4 Connection Management Commands

    As mentioned earlier, the CGDG maintains dedicated connections between users and
    workers for enabling dynamic game tree search. There are user-broker and worker-broker
    HEART_BEAT messages to identify the network node availability. When the broker
    detects that some node fail, it will try to automatically reestablish the last
    connection via sending NEW_WORKER and INIT_WORKER messages (Figure 10.9).


    # 10.5 TEMPLATE-BASED SOFTWARE DEVELOPMENT OF DESKTOP GRID APPLICATIONS


    # 10.5.1 Software Framework


    Although desktop grid federation has enabled many large-scale e-science projects
    for the resource-restricted organizations, software development and maintenance
    could be costly. The JL module offers a template of JL'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Development of a Framework for the Desktop Grid Federation ■ 249


    search algorithm, which uses a design pattern called template method, and provides
    the accessibility to the desktop grids. The JL developers rapidly implement their
    JL search algorithm by extending this template.


    The JL module accepts the game tree search jobs from the game record editor and
    dispatches them to the workers for running. The jobs include by giving a start
    position, finding the best move, expanding all moves, or running an MCTS simulation.
    The execution result can be the best move, all the expanded moves, or the simulation
    result for updating the tree.


    The JL module, as shown in Figure 10.2, includes four phases: selection, pre-update,
    execution, and update. First, in the selection phase, select a node using a selection
    function based on search techniques. For example, PN search selects the MPN [11,12],
    and MCTS selects a node based on the so-called tree policy (defined in References
    4 and 13). Note that the search tree is supposed to be unchanged in this phase.


    Second, in the pre-update phase, update the tree in advance to prevent choosing
    the same node. In this phase, several policies can be used to update the search
    tree. For example, the flag policy is to set a flag on the selected node so that
    the flagged nodes will not be selected.


    Third, in the execution phase, perform a job for a position on an idling worker
    as mentioned earlier, finding the best move from a node n, expanding all moves
    of n, or running a simulation from n for MCTS.


    Fourth, in the update phase, update the search tree according to the job result,
    for example, generating a node for the best move, generating nodes for all expanded
    moves, and updating the status on the path to the root.


    The template of the JL module includes eight functions that are grouped into three
    event handlers:


    +   1. Initialization event handler: This event is triggered when a user demands
    to start the computation of the game tasks.


    +   2. Idle worker event handler: This event is triggered when an idle worker
    is available. When an idle worker is reported, the application, deployed to this
    worker, is invoked to go through the selection, pre-update, and execution phases
    in order.


    +   3. Returning job result event handler: This event is triggered when a job
    result is returned. When this event is reported, the application is invoked to
    go through the update phase.'
