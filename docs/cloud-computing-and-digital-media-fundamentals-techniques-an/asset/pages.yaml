    # 11.3.1.1 Google File System


    GFS, which is a scalable distributed file system for large distributed data-intensive
    applications. It is designed to provide an efficient, reliable access to data
    using large cluster of commodity hardware. Now let us check whether the system
    assumption of GFS fits the scene reconstruction pipeline:


    +   1. The system is built from many inexpensive commodity components that often
    fail.


    +   2. Multi-gigabyte files are the common case and should be managed efficiently,
    whereas small files must be supported but not optimize for them.


    +   3. The two kinds of reads are large streaming reads and small random reads.


    +   4. The workloads also have many large, sequential writes that append data
    to file.


    +   5. The system must efficiently implement well-defined semantics for concurrently
    appending.


    Obviously, the conditions 1, 3, 4, and 5 fit just our requirement. However, based
    on my understanding of scene reconstruction, the pipeline will possess most of
    the files as small files (photos, key descriptor files, and matches). We can organize
    them as group files to solve this problem.


    # 11.3.1.1 Architecture of GFS


    A GFS cluster consists of a single master and multiple chunk servers and is accessed
    by multiple clients, as shown in Figure 11.9. Notice that the chunk server and
    the client can be run on the same machine.


    For each cluster, the nodes are divided into two types: one master node and a
    large number of chunk servers. Chunk servers store the data files, with each individual
    file broken up into fixed size chunks (hence the name)'
