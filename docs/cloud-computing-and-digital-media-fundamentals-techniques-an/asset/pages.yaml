    less significant as an element to a person''s immediate and direct participation
    in society. Nonetheless, computer literacy and access to computing resources will
    continue to increase in importance and will grow as a critical component in the
    curriculum of adult education.


    # 15.5.7 Conclusion: The Impact of Cloud Computing on Adult Education and Literacy


    This chapter provides a glance at rapidly emerging technology and attempts to
    grasp its potential impact for the world of adult learning and literacy. We will
    recap some basic notions.


    First of all, "cloud computing" is a movement toward utility computing where large
    "server farms" located next to "green energy" sources and connected by low-power
    high-bandwidth fiber optics provide the computing infrastructure for small, medium,
    and large organizations that can no longer cost-effectively provision their own
    in-house IT systems. The first of these commercial systems have already been launched
    by companies as Amazon, Google, and Microsoft, and many more are being planned.
    Cloud computing facilities are also being used for research and for government
    services. Some are public and can be used by anyone; others are private and tightly
    secured to protect the privacy of the information contained. Both Microsoft and
    Google are giving away cloud computing capacity to educational organizations to
    run e-mail and other documentation services. This appeals to universities because
    student e-mail alone is costing them thousands of dollars each year.


    Thus, a first step toward the use of cloud computing by an adult literacy community
    could be to recommend the learners use of the free services available or a special
    e-mail arrangement if a branded e-mail address is preferred. It would be ideal
    if a significant number of adult literacy providers in Canada could collaborate
    on this approach, because the same cloud provider could host a portfolio of specialized
    services of benefit to learners with literacy difficulties. It would also make
    it easier to develop and share services in the future. Every adult learner would
    benefit by having free e-mail and free access to these services, and the adult
    literacy community could benefit by using the data collected to refine software
    and determine new services that might be useful. This could all be achieved without
    losing traditional organizational or institutional e-mail identities or “logo
    brands.” Probably,'
