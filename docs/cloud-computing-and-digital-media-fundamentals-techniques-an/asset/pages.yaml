    # 7.2 MULTIPLE-QUERY PROCESSING AND OPTIMIZATION IN TRADITIONAL DATABASES


    In the early literature, Grant and Minker [1] describe the optimization of sets
    of queries in the context of deductive databases and propose a two-stage optimization
    procedure. During the first preprocessor stage, the system obtains at compile
    time the information on the access structures that can be used to evaluate the
    queries. Then, at the second stage, the optimizer groups queries and executes
    them in groups instead of one at a time. During that stage, common tasks are identified
    and sharing the results of such tasks is used to reduce the processing time. References
    2 and 3 show how to improve an incoming query evaluation by deriving the result
    based on the results of the earlier queries through the common subexpressions.
    Rouspoupoulos [4,5] provides a framework for inter-query analysis, aiming to find
    fast access paths for query processing. The objective of his analysis is to identify
    all possible ways to produce the result of a view, given other definitions and
    base relations. Indexes are then built as data structures to support fast processing
    of views.


    Overall, the major tasks of MQO in traditional databases are (1) identifying possibilities
    of shared computation through common operations or subexpressions and (2) constructing
    a global optimal plan, taking shared computation into account [6,7]. Through the
    first phase of common subexpressions’ identification over a set of queries, the
    alternative plans for each query can be obtained. These alternative plans will
    be used in the second phase for the selection of exactly one plan for each query,
    which will then generate a globally optimal execution plan that will produce the
    answers for all the queries. A taxonomy of multiple-query processing and optimization
    in traditional databases is shown in Figure 7.1.


    # 7.2.1 Identifying Common Subexpressions for Multiple Database Queries


    A subexpression is a part of a query that defines an intermediate result used
    during the process of query evaluation [6,8]. For two queries, four possible relationships
    may hold: (1) nothing in common, (2) identical, (3) subsumption, and (4) overlap.
    Taking the select condition on a relational attribute, x > 5 subsumes x > 10 because
    the result of x > 5 can be used for evaluating x > 10; while x > 10 overlaps with
    x < 20. Except for case (1), the two queries can be regarded to have common subexpressions.
    The problem of identifying common subexpressions is proved to be nondeterministic
    polynomial (NP)-hard [8,10]. Therefore, Jarke [8] indicates that'
