    Concerning the design of the cloud multimedia streaming on limited mobile hardware
    resources, Chang et al. [16] presented the following three key challenges for
    system developers.


    +   1. Data dependence for dynamic adjustable video encoding. Multimedia encoding
    and decoding often depends on the information on mobile devices. A suitable dynamic
    adjustable video encoding through a cloud needs to be designed to prevent failure
    of decoding.


    +   2. Power-efficient content delivery. Mobile devices usually have limited power
    supplies; therefore, it is necessary for mass data to develop power-efficient
    mechanisms to reduce energy consumption and achieve user experience quality.


    +   3. Bandwidth-aware multimedia delivery. If network bandwidth is not sufficient,
    it may easily cause download waiting time during play. Therefore, an adjustable
    multimedia encoding algorithm is required to dynamically adjust the suitable encoding
    for the multimedia file in the mobile device.


