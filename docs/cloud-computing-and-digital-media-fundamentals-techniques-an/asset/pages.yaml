    # 2.3 QUEUING MODEL-BASED RESOURCE OPTIMIZATION


    In this section, we present queuing-based resource optimization schemes for cloud-based
    multimedia applications. System models are discussed in Section 2.3.1 to characterize
    the service process at the cloud data center. Based on the system models, we study
    the relationship between the service response time and the allocated cloud resources.
    Moreover, we examine the resource allocation problem in the first-come-first-served
    (FCFS) service case and the priority service case. In each case, we formulate
    and solve the service response time minimization problem and resource cost minimization
    problem.


    # 2.3.1 System Models


    # 2.3.1.1 Data Center Architecture


    Currently, most of the clouds are built in the form of data centers [25,26]. The
    architecture of the multimedia cloud data center is illustrated in Figure 2.1,
    which consists of a master server, a number of computing servers, and a transmission
    server. The master server and computing servers are virtual clusters [27] composed
    of multiple VM instances, whereas the transmission server is used to transmit
    the service results or media data. The master server serves as a scheduler, receiving
    all requests and then distributing them to the computing servers. The number of
    computing servers is denoted by N. The computing servers process the requests
    using the allocated computation resources. In order to provide efficient services,
    the required multimedia data are shared by the computing servers, and the master
    server and computing servers are connected by high-speed communication links.
    After processing, service results will be transmitted'
