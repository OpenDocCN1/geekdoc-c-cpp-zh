- pgno: 415
  md: '... must read not only for the researchers, engineers, and graduate students
    who are working in the related research and development topics but also for technology
    company executives, especially media company executives, to keep pace with the
    innovations that impact their business models and market trends.\n—From the Foreword
    by Chang Wen Chen, State University of New York


    # Cloud Computing and Digital Media: Fundamentals, Techniques, and Applications


    presents the fundamentals of cloud and media infrastructure, novel technologies
    that integrate digital media with cloud computing, and real-world applications
    that exemplify the potential of cloud computing for next-generation digital media.
    It brings together technologies for media/communication, elastic media/data storage,
    security, authentication, cross-network media/data fusion, interdevice media interaction/reaction,
    data centers, PaaS, SaaS, and more.


    The book covers resource optimization for multimedia cloud computing—a key challenge
    in adopting cloud computing for various digital media applications. It describes
    several important new technologies in cloud computing and digital media, including
    query processing, semantic classification, media retrieval, mobile multimedia,
    and video transcoding. The book also illustrates the profound impact of emerging
    health-care and educational applications of cloud computing.


    Covering an array of state-of-the-art research topics, this book will help you
    understand the techniques and applications of cloud computing, the interaction/reaction
    of mobile devices, and digital media/data processing and communication.


