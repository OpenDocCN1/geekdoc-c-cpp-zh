    YOUTUBE [1] has indicated that over 4 billion hours of videos are watched each
    month and 72 hours of video are uploaded every minute. Another study from Cisco
    [2] has indicated that the overall mobile data traffic reached 885 petabytes per
    month by the year of 2012, 51% of which are mobile video. Forecasts predict that
    video will grow at a compound annual growth rate (CAGR) of 75% between 2012 and
    2017 and reach 1 exabyte per month by 2017. During video playback, mobile devices
    may encounter different wireless network conditions. The Dynamic Adaptive Streaming
    over Hypertext Transfer Protocol (HTTP; DASH or MPEG-DASH) [3] is designed to
    provide high-quality streaming of media content over the Internet from conventional
    web servers. The content, divided into a sequence of segments, is available at
    a number of different rates so an MPEG-DASH client can automatically select the
    next segment to download and play back based on the current network conditions.
    The task of transcoding media content to different qualities and bits is computationally
    expensive, especially in the context of large-scale video hosting systems. Therefore,
    it is preferably executed in a powerful cloud environment, rather than on the
    source computer (which may be a mobile device with limited memory, CPU speed,
    and battery life). In order to support the live distribution of media events and
    to provide a satisfactory user experience, the overall processing delay of videos
    should be kept to a minimum. In this chapter, we describe and explore various
    scheduling techniques for DASH-compatible systems in the context of-large-scale
    media distribution clouds.


    # 5.1 INTRODUCTION TO MPEG-DASH


    With the development of the content delivery networks (CDNs) and media technologies,
    HTTP streaming has emerged as a facto streaming standard, replacing the conventional
    real-time Transport Protocol (RTP) streaming or Real-Time Streaming Protocol (RTSP).
    Existing, commercial streaming platforms, such as Microsoft’s Smooth Streaming
    (MSS) [4],'
