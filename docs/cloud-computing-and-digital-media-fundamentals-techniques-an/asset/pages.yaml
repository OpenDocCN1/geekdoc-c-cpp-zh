    +   3. IHE: It supports Consistent Time Integration Profile (CT), Cross-Enterprise
    Document Sharing for Imaging (XDS-I), and Audit Trail and Node Authentication
    (ATNA) for meeting various integration requirements.


    XDS-I lays the basic framework for deploying medical images in EHR. The deployment
    of XDS-I as the framework for sharing images within the EHR is taking place in
    many countries including Canada, the United States, Japan, and several European
    countries.


    13.3.1.1 Imaging Standard: DICOM

    DICOM [9] is a standard for storing, handling, printing, and transmitting information
    in medical imaging. It is also known as the National Electrical Manufacturers
    Association (NEMA) standard PS3.x and as ISO standard 12052:2006 “Health Informatics—DICOM
    including workflow and data management." Over the years, many versions and updates
    have been released and the current versions PS3.1x are in compliance with the
    latest standards and guidelines set by the IOM. DICOM differs from some formats.
    It groups the information in datasets. This means that a file of a chest X-ray
    image, for example, actually contains the patient ID within the file, so that
    the image can never be separated from this information by accidents or mistake.
    This is similar to the way that image formats such as JPEG also have embedded
    tags to identify and otherwise describe the image.


    DICOM provides a set of protocols for devices for proper network communication
    and exchange of information during the communication. DICOM gives consistency
    in multimedia storage services, format, and report structures. Using DICOM standard,
    clinical structured reports can be generated in both multimedia and alphanumeric
    data are integrated. Clinical experts can view the whole history as well as the
    multimedia data (such as X-ray, CT scan, waveforms, and other images and interpretations).
    These types of structured reports contain all the information of patients, interpretations
    with evidence, and links to the other similar cases. Traditionally, the imaging
    reports being dictated by a radiologist who interprets the images; reports are
    then transcribed into an electronic document by a typist and verified by the radiologist.
    Structured reports enable efficient radiology workflow, improve patient care,
    optimize reimbursement, and enhance the radiology ergonomic working conditions
    [11].'
