    # 2.1 INTRODUCTION


    In the recent years, we have witnessed the fast development of cloud computing
    from a dream into a commercially viable technology. According to the forecast
    from International Data Corporation (IDC) [1], the-wide public cloud computing
    services will edge toward $100 billion by 2016 and enjoy an annual growth rate
    of 26.4%, which is 5 times the traditional information technology (IT) industry.
    As the emerging computing paradigm, cloud computing manages a shared pool of physical
    servers in data centers to provide on-demand computation, communication, and storage
    resources as services in a scalable and virtualized manner. In the traditional
    computing, both data and software are operated at user side, whereas in cloud
    computing, the tasks that require intensive computation or a large storage are
    processed in the powerful data center. By cloud-based applications, users are
    free from application installation and software maintenance.


    The emergence of cloud computing has greatly facilitated multimedia applications.
    The elastic and on-demand resource provisioning in cloud can effectively satisfy
    resource demands of multimedia processing. In particular, the scalability of cloud
    can handle frequent surges of requests, which is demonstrated with substantial
    advantages over traditional server clusters [2]. In cloud-based multimedia applications,
    computationally intensive tasks are processed in data centers, greatly reducing
    hardware requirements on the user side. Moreover, users are able to access remote
    multimedia applications from anywhere at any time, even through resource-constrained
    devices. Therefore, cloud-based multimedia applications, such as online photo
    editing [3], cloud-video retrieval [4], and various social media applications,
    have been increasingly adopted in daily life.


    Multimedia applications also bring new challenges to current generalpurpose cloud
    computing. Nowadays, the general-purpose cloud employs a utility-based resource
    management to allocate computation resources (e.g., CPU, memory, storage, etc.).
    In utility-based resource allocation, cloud resources are packaged into virtual
    machines (VMs) as a metered service. By using VMs, cloud resources can be provisioned
    or released with minimal efforts. As cloud providers, such as Amazon Elastic Compute
    Cloud (Amazon EC2) [5], the only guaranteed parameter in the service-level agreement
    (SLA) is the resource availability, that is, users can access rented resources
    at any time. However, for multimedia applications,'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Resource Optimization for Multimedia Cloud Computing ■ 23


    in addition to the computation resources, another important factor is the stringent
    quality-of-service (QoS) requirements in terms of service response time, jitter,
    and packet loss. The general-purpose cloud is used to deal with multimedia applications
    without considering the QoS-requirements, the media experience may become unacceptable
    to users. Hence, an effective resource allocation scheme is strongly needed for
    multimedia cloud computing. Recently, a lot of research efforts have been made
    on the resource allocation and QoS provisioning for cloud-based multimedia applications
    [6–26].


    From the perspective of multimedia service providers, there are two fundamental
    concerns: the QoS and the resource cost. Multimedia applications are typically
    delay sensitive. Therefore, the service response time is widely adopted as the
    major QoS factor to measure the performance of cloud-based multimedia applications.
    The service response time is defined as the duration from the time when the application
    request arrives at the data center to the time when the service result completely
    departs from the data center. A lower service response time will lead to a higher
    QoS. However, multimedia applications have different service time requirements
    and dynamic resource demands. It is challenging to optimally allocate resources
    to meet different service time requirements for all applications. Besides the
    service response, the second concern is the resource cost. Cloud computing involves
    various computing resources, and applications have different resource demands.
    As service providers, they are concerned about how to optimally allocate different
    resources to satisfy all applications at the minimal cost. The service process
    in multimedia cloud can generally be divided into three consecutive phases: the
    scheduling phase, the computation phase, and the transmission phase. Inappropriate
    resource allocation among the three phases will lead to resource waste and QoS
    degradation. For example, with excessive computing resource and inadequate bandwidth
    resource allocated in multimedia cloud, requests will be processed fast, but the
    service results cannot be transmitted efficiently due to the limited bandwidth
    capacity. Therefore, it is challenging for multimedia service providers to optimally
    configure cloud resources among the three phases to minimize the resource cost
    while guaranteeing service response time requirements.


    In this chapter, we investigate the optimal resource allocation problem for multimedia
    cloud computing. We first provide a review of recent advances on cloud-based multimedia
    services and resource allocation'
  merge: -1
  img_proc: true
