  md: 'reference images and stores them into a database. An object is recognized in
    a new image by individually comparing each feature from the new image to this
    database and finding candidate matching features based on the Euclidean distance
    of their feature vectors. Since SIFT feature descriptor is invariant to scale,
    orientation, and affine distortion, and partially invariant to illumination changes,
    this method can robustly identify objects even among clutter and under partial
    occlusion. It has wide applications, such as object recognition, robotic poping
    and navigation, image stitching, 3D modeling, gesture recognition, video tracking,
    and match moving.


    In scene reconstruction, the pipeline uses SIFT to detect the key features of
    images for the initial matching. There are five main steps in SIFT listed below:


    +   1. Scale-space extrema detection


    +   2. Accurate keypoint localization


    +   3. Orientation assignment


    +   4. Compute local image descriptor


    +   5. Keypoint matching


    # 11.2.1.1 Scale-Space Extrema Detection


    To apply SIFT, transformation of the format of input image is necessary. In general,
    we change the input image into gray scale. Also, to make full use of the input,
    the image can be expanded to create more sample points than presented in the original.


    The most important goal of SIFT is to achieve invariance. In order to attain invariant,
    theoretically, we need to search stable features in all possible scales. But in
    practice, it is impossible to get all scales, here we sample the scale space for
    reasonable frequency to attain invariant feature detection. In SIFT, difference
    of Gaussian (DoG) filter is used to build up the scale space [3]. DoG:(1) it is
    an efficient filter and (2) it provides a close approximation to scale-normalized
    Laplacian of Gaussian. The normalization of the Laplacian with the factor s² is
    required for true invariance. In SIFT, the author proved that DoG scale space
    will be almost the same as that of Laplacian Gaussian (Figure 11.3).'
