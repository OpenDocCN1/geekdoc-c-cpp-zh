    For multimedia services, in addition to central processing unit (CPU) and storage
    requirements, another very important factor is the quality of service (QoS) and
    the quality of experience (Qoe). For a long time, there was no common agreement
    on the term *user experience*. For some people, it is only seen as being user
    and interface dependent. This understanding of UX changed during the past few
    years.


    The definition of a general UX definition is very hard. First, it is connected
    with many concepts such as emotional, affective, hedonistic, and aesthetic variables
    [8]. Researchers include and exclude these variables arbitrary, depending on their
    background and interests. Second, the unit of analysis can range from a single-user
    interaction aspect to all aspects including interaction with the community. Third,
    UX research is fragmented and complicated by various theoretical models.


    In 2009, Law et al. [99] presented a survey on UX to define this term. They designed
    a questionnaire with three sections: UX Statements, UX Definitions, and Your Background.
    In “UX Statements,” they gave 23 statements and the participants were asked to
    indicate their level of agreement using a five-point scale. Two hundred and seventy-five
    researchers'
