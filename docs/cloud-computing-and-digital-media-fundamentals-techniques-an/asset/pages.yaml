    can include the module execution time, resource consumption, battery level, monetary
    costs, security, or network bandwidth. A key aspect is user waiting time, that
    is, the time a user waits from invoking some actions on the device''s interface
    until desired output or execution is returned to the user. User wait time is important
    for deciding whether to do the processing locally or remotely.


