    content” in the cloud. We believe that cloud for digital media can only work if
    CSPs and right holders agree on license terms that allow users to access their
    account from multiple devices and from different territories. More flexibility
    for the whole digital media environment is needed.


    Logically, before extensively dealing with new business models and license terms
    (Section 14.3), we need to address the personal data protection issue. In fact,
    the provision of digital media means by cloud computing technologies is typically
    made possible through a preliminary user registration form. In other words, users
    need to first create an account in order to start enjoying the service according
    to the relevant–service agreement.


    # 14.2 PERSONAL DATA PROTECTION ISSUES


    Users provide their personal data to the right holder to create an account and
    enter into a relevant licence agreement in order to access the digital media.
    The right holder is the collector of the users’ data, which will be automatically
    shared with the other relevant subjects [i.e., CSP(s) and, possibly, with the
    third-party IPR owner(s)] in order to provide users with the requested service.¹
    Legally speaking, the right holder acts as the data controller,² CSP(s) and third-party
