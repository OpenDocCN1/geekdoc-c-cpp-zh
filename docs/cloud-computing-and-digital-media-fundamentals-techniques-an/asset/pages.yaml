    overhead of the shuffle phase in data classification as in model training.


    # 8.6 CONCLUSIONS


    This chapter has introduced an MR-based MCA framework for semantic classification
    of multimedia data. The previous applications of MCA in CBMIR tasks, such as discretization,
    feature selection, data pruning, classification, and ranking, cannot directly
    scale to big data environments because MCA requires the processing of large matrices
    in memory. The proposed D-MCA framework overcomes this scalability limitation
    by bypassing the processing of large matrices in the memory, which is achieved
    by counting combinations of attribute values in a distributed approach using MR.
    The CBMIR task chosen to showcase the proposed MCA framework is semantic classification.
    Additionally, the proposed distributed implementation of MCA lays the foundation
    for the application of MCA to the'
