    performed to guarantee the range integrity of new blocks. The update of corresponding
    block-level index is an in-memory operation, and therefore can be done very efficiently.


    # 9.4.7 Related Work


    There are mainly two categories of solutions for RDF management and query processing.
    One is to use traditional relational database management system (RDBMS) technologies,
    either stand-server or distributed (parallel) computing framework. RDF data are
    represented as tables in databases. Intensive research interests lies in RDF decomposition
    (SW-Store [50]) or composition (property table [51]), index building and searching
    (Hexastore [49], RDF-3X [48]), and query optimization [43]. However, due to the
    limitation of RDBMS''s scalability, the above solutions'
