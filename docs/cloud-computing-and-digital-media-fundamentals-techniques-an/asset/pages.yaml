    It is not trivial to efficiently process complex join queries using MapReduce.
    There are two challenging issues needed to be resolved. First, the number of available
    computing units is in fact limited, which is often neglected when mapping a task
    to a set of MapReduce jobs. Although the pay-as-you-go policy of cloud computing
    platform could promise as many computing resources as required, once a computing
    environment is established, the allowed maximum number of concurrent Map and Reduce
    tasks is fixed according the system configuration. Even taking the autoscaling
    feature of Amazon Elastic Compute Cloud (EC2) platform into consideration, the
    maximum number of involved computing units is predetermined by the user-defined
    profiles. Therefore, with the user-specified Reduce task number, a multiway theta-join
    query is processed with only a limited number of available computing units.


    The second challenge is the decomposition of the multiway join query into a number
    of MapReduce tasks is nontrivial. The work of Wu et al. [4] targets at the multiway
    equi-joining processing. It decomposes queries into several MapReduce jobs and
    schedules the execution based on a specific cost model. However, it only considers
    the pairwise join as the basic scheduling unit. In other words, it follows the
    traditional multiway join processing methodology, which evaluates the query with
    a sequence of pairwise joins. This methodology excludes the possible opportunity
    to evaluate a multiway join in one MapReduce job. Our observation is that, under
    certain conditions, evaluating a multiway join with one MapReduce job is much
    more efficient than with a sequence of MapReduce jobs conducting pairwise joins.
    The work of Lee et al. [5] reports the same observation. One dominating reason
    is that the I/O costs of intermediate results generated by multiple MapReduce
    jobs may become unacceptable overheads. The work of Afrati and Ullman [6] presents
    the solution for evaluating a multiway join in one MapReduce job, which only works
    for the equi-join case. Since the theta-join cannot be answered by simply making
    the join attribute the partition key, the solution proposed in Reference 6 cannot
    be extended to solve the case of multiway theta-joins. The work of Okan et al.
    [7] demonstrates an effective pairwise theta-join processing using MapReduce.
    However, its solution is designed for partitioning a two-dimensional result formed
    by the cross-product of two relations. In the case of multiway join, the result
    space is a hypercube, the dimensionality of which is the number of the relations
    involved in the query. The solution in Reference 7 cannot be intuitively extended
    to handle the partition in high dimensions.'
