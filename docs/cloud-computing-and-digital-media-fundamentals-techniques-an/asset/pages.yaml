    to set-top boxes and/ portable devices); (2) adapt existing business models or
    identify new ones in respect of the said technological opportunities arising (e.g.,
    extending the offer of pay-TV on portable devices to current residential customers
    and/ new customers, whether on a subscription or free trial basis); and (3) assess
    ahead of whether current licensing agreements in place enable the right holders
    to make available to the public digital content according to their envisaged business
    models or otherwise require further investments. In a nutshell, the competitiveness
    of right holders shall require a continuous internal dialog and cohesion between
    internal departments (technology, legal, marketing, CRM, finance, etc.) to ensure
    an effective and timely business plan is adequately devised.


