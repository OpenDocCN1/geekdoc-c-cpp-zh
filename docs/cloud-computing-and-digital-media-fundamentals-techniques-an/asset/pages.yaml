    # 14.1 INTRODUCTION


    Entertainment, gaming, digital content, and streaming services are increasingly
    provided by means of cloud computing technologies. The benefits of this deployment
    model are as numerous as the legal challenges it poses. In fact, cloud technology
    generally improves availability, usability, integration, and portability of digital
    media services while decreasing costs. However, it creates more complex value
    chains, involving multiple jurisdictions. The relevant aspects are numerous: intellectual
    property, personal data protection, information society


    > * For example, iTunes, Grooveshark, Spotify, and UltraViolet offer music and/or
    audio-visual content to stream it over the Internet, download it for off-line
    listening/viewing, or play it.'
