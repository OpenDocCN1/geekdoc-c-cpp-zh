    Users need to have free reign to mix and remix the content and adapt it for voice
    and video as appropriate for their learners. The cloud can provide learners and
    their organizations with access to the growing number of free open education resources
    as well as open-source applications supporting social interaction, publishing,
    collaborating, editing, content creation, computing, and so on [39].


    The fourth notion is that literacy training can be augmented with literacy appliance
    software that provides just-in-time assistance to low-literacy adults.'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# 388 Cloud Computing and Digital Media


    The range of software could include text-to-voice, voice-to-text, bar code and
    QR code reading, and language translation. Much of these services exist as Web
    services, but they need to be harnessed and brought together in a suite of applications
    accessible and usable by the low-literacy population. Cloud computing can both
    provide a collaborative portal for these services as well as the high-power computing
    necessary to extract the text or shapes from pictures and generate the appropriate
    response including related information that might be available. While literacy
    would be ideal, such applications may it possible for low-literacy adults to participate
    more inclusively in everyday life. The benefits of such adaptations can be expected
    to benefit other populations such as seniors or tourists.


    Fifth, cloud computing and the Internet are available through an increasing number
    of mobile devices—in fact, more literacy learners have mobile phones than personal
    computers and mobile tablets are becoming increasingly popular and are beginning
    to augment and replace laptops and netbooks. Thus, mobile devices as a delivery
    platform should be given priority for research and technical development— over
    texts and personal computers. These mobile devices represent the state of the
    art, and they are always with the adult learners go, and are becoming the platform
    of choice for accessing a wide range of services including training through mobile
    learning.


    Sixth, and most significantly, is the reality that it is becoming impossible to
    conceive a modern definition of literacy that excludes ICT literacy. The growing
    importance of the Internet and networking skills for adults must be recognized.
    A 21st century literacy is not possible without the skills for accessing and using
    the Internet. The cloud can be the door-way to these skills.


    Cloud computing is at the adult literacy doorstep, but it will take time to implement
    the above ideas. Some of these face technical barriers, others face cultural and
    political barriers, and some have distant ideas in need of more research. However,
    they provide a unified vision of what is possible, if the adult literacy community
    can collaborate together for mutual benefit. Then all literacy providers and the
    adult literacy learners will surely benefit from the synergies that emerge. Canada
    is large and vast—the literacy movement needs to coordinate its efforts in a way
    that retains and reinforces the local roots and human face. Cloud computing provides
    an affordable opportunity to plan a new future together.'
