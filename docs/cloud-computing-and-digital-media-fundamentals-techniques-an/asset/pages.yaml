    # 13.1.3 Integration of Imaging Standards


    In order to image-enable EHRs, the technology should support industry-level standards,
    such as Digital Imaging and Communications in Medicine (DICOM) [9], HL7 [3], and
    Integrating the Health Enterprise (IHE) [10]. Figure 13.1 shows the approaches
    for integration of various imaging standards:


    +   1. DICOM: It permits storing images from multiple modalities and systems,
    by accepting and cleansing all variations of former DICOM standards, and providing
    EHRs with standardized DICOM formats.

    2. HL7: It can be used for messaging for ordering images, sending image results,
    and updating patient demographic information.


