  md: '# Mobile Multimedia Cloud Computing ■ 9


    Zhu et al. [3] stated that multimedia processing in the cloud imposes great challenges.
    They highlighted several fundamental challenges for multimedia-cloud computing.
    (1) Multimedia and service heterogeneity. Because there are many different types
    of multimedia services, such as photo sharing and editing, image-based rendering,
    multimedia streaming, video transcoding, and multimedia delivery, the cloud has
    to support all of them simultaneously for a large base of users. (2) Quality-of-service
    (QoS) heterogeneity. Different multimedia services have different QoS requirements
    for various multimedia services. (3) Network heterogeneity. Because there are
    different networks, such as the Internet, wireless local area networks (WLANs),
    and third-generation wireless networks, with different network characteristics,
    such as bandwidth, delay, and jitter, the cloud has to adapt multimedia content
    for various types of devices with different network bandwidths and latencies.
    (4) Device heterogeneity. Because there so many different types of devices, such
    as televisions, PCs, and mobile phones, with different capacities for multimedia
    processing, the cloud has to adjust multimedia processing to fit the different
    types of devices, including CPU, graphics processing unit (GPU), display, memory,
    storage, and power.


    Wang et al. [1] analyzed the requirements imposed by mobile multimedia cloud computing,
    including response time, user experience, cloud computing cost, mobile network
    bandwidth, and scalability to a large number of users; other important requirements
    are energy consumption, privacy, and security.


    Kovachev et al. [2] investigated the requirements for mobile multimedia cloud
    architecture from three crucial perspectives: technology, mobile multimedia, and
    user and community. The technology perspective establishes a basic technical support
    to facilitate mobile cloud computing. The mobile multimedia perspective concerns
    the capabilities of multimedia processing. The last perspective is related to
    users'' experiences in multimedia delivery and sharing. Table 1.3 details the
    three perspectives.


