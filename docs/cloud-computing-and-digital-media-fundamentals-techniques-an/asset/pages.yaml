    # 12.4 THE PEARL METAPHOR: PEARLY UI


    The pearl metaphor is based on two principles: (1) in terms of abstraction, modeling
    SAEs instead of classical entities (actors, data, and tasks) and (2) in terms
    of presentation, using the sets of actors and data (i.e., the pearls) to visualize
    social relationships. This metaphor is generic, applicable to several fields such
    as cloud-based e-mail services. In this chapter, it is applied to health care.


    # 12.4.1 Abstraction of Pearls: SAEs


    Lahir (2010) claims that sociality is not restricted to social interactions between
    groups. He defines sociality as a relationship between two human beings. A being,
    and thus a data, as a communication trace between two human beings, may represent
    such a relationship (Pédau 2003). Therefore, a data has a social status. Based
    on these observations, we propose to transpose the social relationships from the
    real world to the digital world. This gives rise to a taxonomy of SAEs (Figure
    12.3) based on core entities (data, actor, and task as modeled in HCI and CSCW;
    Van Welie et al. 1998) and their intra versus inter relationships.


    Data cover the information that is manipulated by an actor while achieving a task.
    In our case study, data can be a medical record, an endoscopic


