  md: '# Development of a Framework for the Desktop Grid Federation ■ 243


    The pruning process of tree search algorithm can be even more complex for the
    random simulation processes. In the JL-PN search [9], it is dynamic to choose
    the MPNs. From the above observations, it is clearly inappropriate to use the
    Berkeley Open Infrastructure for Network Computing (BOINC), or similar middleware
    systems, which are based on the pull model. The argument here shows the necessity
    of using the push model.


    # 10.4 SYSTEM DESIGN AND DEVELOPMENT


    This section discusses the design and implementation of the computer desktop grid
    (CGDG) framework. Section 10.4.1 discusses the organization of users and workers.
    Section 10.4.2 discusses the broker protocol, including group management, worker
    management, task management, and connection management.


    # 10.4.1 Organizations


    The CGDG system consists of users, workers, and a broker. A user is usually the
    game record editor mentioned in Section 10.2, which accepts the game player''s
    instructions and initiates the game computation tasks. The tasks are queued in
    the broker and dispatched to some workers. The JL module is a worker component
    that executes a tree search task.


    The CGDG maintains four types of users, each with a different permission level,
    as described below:


    +   * System administrator: The administrator with full access to every aspect
    of system data, including user profiles, organization profiles, broker policies,
    and job priorities

    * Organization administrator: Similar to the system administrator but restricted
    to the data of an organization.

    * Standard user: A registered user that can submit normal tasks via the game record
    editor.

    * Advanced user: A user that is authenticated to submit tasks with high priority.


    In order to distinguish the tasks in and across organizations, users and workers
    are grouped based on their organizations. Figure 10.3 illustrates several users
    and workers in two organizations.'
