    Apple’s HTTP Live Streaming (HLS) [5], and Adobe’s HTTP Dynamic Streaming (HDS)
    [6], all use HTTP streaming as their underlying delivery method. The commonalities
    [7] of these techniques are as follows:


    +   - Splitting an original encoded video into small pieces of self-contained
    media segments


    +   - Separating the media description into a single playlist file


    +   - Delivering segments over each other from HTTP


    In contrast, these techniques differ from each other as follows:


    +   - MSS is a compact and efficient method for the real-time delivery of MP4
    files from Microsoft’s Internet Information Services (IIS) web server, using a
    fragmented, MP4-inspired ISO Base Media File Format (ISO BMFF).


    +   - HLS uses an MPEG-2 Transport Stream (TS) as its delivery container and utilizes
    a higher segment duration than MSS.


    +   - HDS is based on Adobe’s MP4 fragment format (F4F) and its corresponding
    Extensible Markup Language (XML)-based proprietary manifest file (F4M).


    Once an HTTP client requests and establishes a connection between the server and
    itself, the progressive download is activated until the streaming is terminated
    [8]. Disadvantages of progressive download include the following:


    +   - Unstable conditions of a network, especially the wireless connection for
    mobile clients, may cause bandwidth waste due to reconnection or rebuffering events.


    +   - It does not support live streaming (e.g., a concert or a football match).


    +   - It does not support adaptive bit rate streaming.


    MPEG-DASH or DASH addresses the above weaknesses. Published in April 2012, DASH
    [3] is known as video delivery standard that enables high-quality streaming of
    media content over HTTP. The video file is broken into a sequence of small playable
    HTTP-based segments and these'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'segments are uploaded to the standard HTTP server sequentially. The visual
    content is then encoded at a variety of different bit rates and the HTTP client
    can automatically select the segment from the alternatives to download and play
    back based on the current network conditions. The client selects the segment with
    the highest possible rate that can be downloaded in time for smooth and seamless
    playback, without causing rebuffering events. The main features of DASH are as
    follows:


    +   - It splits a large video file into small chunks.


    +   - It provides client-initiated flexible bandwidth adaptation by enabling stream
    switching among differently encoded segments.


    +   - It supports on-demand, near-live, and time-shift application.


    +   - It has segments with varying durations. With live streaming, the duration
    of the next segment can also be signaled with the delivery of the current segment.


    In the following text, we will briefly introduce DASH standard and the two most
    important components of DASH: media presentation description (MPD) and the segment
    formats. Note that the vendor-specific adaptive HTTP streaming solutions are expected
    to converge toward the DASH standard in the future.


    # 5.1.1 Scope of the DASH Standard


    Figure 5.1 illustrates a simple streaming scenario between an HTTP server and
    a DASH client. The MPEG-DASH specification defines only the MPD and the segment
    formats. The delivery of the MPD and the media-transcoding formats containing
    the segments, as well as the client behavior for fetching, adaptation heuristics,
    and playing content, are outside of MPEG-DASH standard''s scope. In this figure,
    the multimedia content is captured and uploaded to an HTTP server and is then
    delivered to end users using HTTP. The content exists on the server in two parts:
    MPD and the encoded video segments with various rates.


    To play content, the DASH client first obtains the MPD. The MPD can be delivered
    using HTTP (most likely), e-mail, thumb drive, broadcast, or other transports.
    By parsing the MPD, the DASH client learns about the program timing, media content
    availability, media types, resolutions, minimum and maximum bandwidths, and the
    existence of various'
