    a repertoire of situational procedures. A personalized “my guide to my community”
    could help newcomers understand and access services available in their Canadian
    location.


    # 15.5.4 Analytics and Personalization


    Analytics refers to a wide range of data processing methods that use data from
    a wide range of sources to make inferential decisions about a situation and recommend
    a path of action. The low end are a variety of computer-based learning tutorials,
    some of which have been linked to course management systems to keep track of student
    progress. Performance tracking involves the collection of data about an individual’s
    progress through a set of online learning activities. By tracking the speed and
    outcomes of learning activities, an individual’s performance can be compared to
    aggregate histories of large numbers of learners moving through the same courses.
    The resulting analysis can lead to pattern matching and identification of persistent
    learner errors and personal


