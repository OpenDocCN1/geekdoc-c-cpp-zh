    WE DISCUSS THE DEVELOPMENT OF desktop grids of dynamic game tree applications,
    which are widely used but considered beyond the scope of the previous platforms.
    The proposed desktop grid platform adopts a push-mode streaming infrastructure
    to support tightly coupled task control that is vital to the target applications.
    In addition, the new platform provides a software framework in order to facilitate
    complex application development on the desktop grids. The users have reported
    successful results in rapid application development as well as efficient performance
    for a variety of game tree search applications.


    # 10.1 INTRODUCTION


    Desktop grid is a network computing model that can harvest unused computational
    power from desktop-level computers [2,16]. Considering the fact that today''s
    personal computers are more powerful than workstations or even mainframes 20 years
    ago, this model can offer low-cost and available resources by employing a large
    number of workers. Today, and more research organizations have built desktop grids
    as a solution for their large-scale e-science projects [1,4,17,23].


    Unlike most distributed computing models, desktop grids have remarkable resilience
    in host connections. The execution of desktop grid applications is coordinated
    by a central server node, which distributes the task units over wider worker nodes,
    awaits the execution results, and eventually consolidates the result. The worker
    nodes can be of different operating systems and are not necessarily connection
    oriented. For volunteer computing, a server partitions and assigns tasks to the
    public anonymous participants called volunteers. Since these volunteers'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Development of a Framework for the Desktop Grid Federation ■ 237


    are autonomous and can connect or disconnect from time to time, the single-worker
    response time is not a major concern. Statistically, the resource availability
    can be maintained at a certain level with a large enough number of volunteers.
    Another model of desktop grid is to have dedicated workers that are maintained
    and directly controlled by the organization. Using dedicated computers guarantees
    both quality and quantity of worker nodes.


    Most existing desktop grids are developed, which are intended to host bag-of-task
    (BoT) applications that contain a large set of task units without explicit precedence
    relations. These independent tasks can be successfully executed via massive parallelism
    over widely worker nodes. The server usually does not try to precisely control
    each single worker for a short-response time. Instead, it simply uses the polling
    mechanism to distribute and collect the execution results over workers in a daily
    or weekly basis. This model has been demonstrated by a number of successful e-science
    projects including data mining, parallel simulations, computational biology, and
    computer imaging.


    The nature of loosely communication of BoT application tasks in desktop grids
    makes resource sharing much easier compared to other network computing models.
    Based on the notion of resource sharing, the emerging desktop grid federation
    has enabled many overloaded e-science projects for the resource-restricted organizations
    [1,2]. Some related infrastructures for resource sharing are discussed as follows:


    +   * Single volunteer desktop grid. In this approach, the worker nodes in different
    organizations are directly connected to a central server [3,4]. The server manages
    the tasks based on worker credits or membership profile. This approach cannot
    support the cooperative federation with customized policies.


    +   * Grid computing community. A grid computing community [5–7] usually relies
    on a central resource broker to provide a single point of access for the resources
    across several organizations. A desktop grid can also require worker nodes via
    the broker of the grid system.


    +   * Peer-to-peer (P2P) computing platform. This platform is developed based
    on the P2P network and can easily achieve fairness. The key is to transfer the
    data via the P2P network and to evenly distribute communication and computation
    load over the entire network.'
