    # 13. INTRODUCTION


    Considering the recent developments in network technology, distribution of digital
    multimedia content through the Internet occurs on a very large scale. Electronic
    health record (EHR) databases are among the important archives in this vast ocean
    of data. EHRs are paperless solution to a disconnected-care world that runs on
    a chain of paper files. The EHRs are expected to be interoperable repositories
    of data that exist within the data management and decision support system [1].
    EHR databases are real-time databases, the state of which keeps on changing with
    time. It is a complex task for medical expert to retrieve relevant information
    from the database (in a short period of time). In health-care domain, information
    sharing and information reachability are limited to the safety of patients. A
    standardized format for the content of a patient''s clinical record helps to promote
    the integration of care among various health-care providers. Medical practices
    also also require sharing of data by many agencies over long periods of time.
    Thus, the structure and content of the life-long EHRs require standardization
    efforts for improving interoperability.


    Although the patient''s paper-based medical records are scanned and transferred
    between the providers in a standard image format, it will not fulfill the functional
    requirements of EHRs; that is, the data cannot form the electronically exchanged
    medical data that can support analysis and decision making. There is a large variety
    of the functions supported by the databases and content of EHRs. The sharing of
    information between the providers introduces new questions and challenging the
    data to be exchanged and their format. Text-based EHRs contain large amount of
    data and provide opportunities for analysis (both quantitative and qualitative).
    However, programming skills are required. Similarly, the use of standardized diagnostic
    images creates a scope of storing digital multimedia content and other media as
    well. It will simplify the data sharing and improve interoperability.'
