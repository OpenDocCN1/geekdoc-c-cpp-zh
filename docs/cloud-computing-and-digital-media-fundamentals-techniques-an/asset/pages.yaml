    # 11.5 CONCLUSION AND FUTURE WORK


    # 11.5.1 Conclusion


    The purpose of this research was to determine if scene reconstruction can be transplanted
    to Hadoop framework and to see the new properties of the Hadoop framework could
    provide into scene reconstruction. In realizing this goal, the following three
    keypoints are described in this chapter:


    +   1. Introduce the main steps of scene reconstruction pipeline in some details.

    2. Implement the first four steps of scene reconstruction running on Hadoop framework.

    3. By means of evaluation, the experimental result shows that scene reconstruction
    based on cloud computing achieves great success.


    Cloud computing with Hadoop could provide relatively inexpensive means process
    datasets of the magnitude without seriously compromising performance. We believe
    that our exploration in this field could give some hints using Hadoop framework
    to deal with complex algorithms running on large image datasets.


    # 11.5.2 Future Work


    Future work will be the following:


