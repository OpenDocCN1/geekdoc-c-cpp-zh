    image, and so on. Cloud services, such as image analysis or 3D reconstruction,
    could be applied to them.


    Actors denote the stakeholders involved in the system: They manipulate data and
    perform tasks. In our case study, actors are doctors, secretaries, and medical
    students. Cloud services, as medical workflow management, would apply to them.


    Tasks describe the goals actors are intended to achieve. They are usually decomposed
    into subtasks. In our case study, the main task is the patient follow-up. This
    means for the doctor to perform tests, capture images, communicate with colleagues,
    and so on. Cloud services, such as best practice recommendation, would be applicable
    to them.


    Relationships between these entities constitute extra information that enriches
    these entities and SAEs. Relationship is represented in Figure 12.3 as a line
    between two entities with a notation indicating the multiplicity of instances
    of each entity. Relationships may be intra or inter. "Intra" makes reference to
    relationships between entities of the same type:


    +   - Actor–Actor: Social proximity between actors (e.g., frequent collaboration
    between two doctors, the patient-doctor relationship) may enhance the Actor entity,
    and thus be considered as an SAE. Mailing services based on cloud would apply
    to these SAEs.

    - Data–Data: Data may be socially augmented instead of just being logically linked
    together (hierarchy, database, etc.). The decoration of a relationship with its
    type is a good example (e.g., genealogical relationship between a father''s and
    a son''s medical records for the prediction of hereditary pathology). Cloud services,
    such as family history research, would apply to these SAEs.

    - Task–Task: Enhancing the tasks with experts'' practices is an example of this
    category. This extra information could be presented to the doctor to serve as
    an advice. Cloud services such as expert systems would apply to these SAEs.


    "Inter" makes reference to relationships that involve entities of different types:


    +   - Data–Actor: Both are socially linked. Actors produce or use data to achieve
    their goals, giving them a social status (private, confidential, and public).
    Conversely, data may embed social information about'
