    # 11.2.2 RANSAC Paradigm


    In this section, we introduce the RANSAC paradigm, which is capable of smoothing
    data that contain a significant percentage of gross errors. SIFT, the local feature
    detector, always makes mistakes, as described in Section 11.2.1, although it is
    one of the best local feature detectors. There are two kinds of mistakes: classification
    errors and measurement errors. Classification errors occur when a feature detector
    incorrectly identifies a portion of an image as an occurrence of a feature, whereas
    measurement errors occur when the feature detector correctly identifies the feature,
    but slightly miscalculates one of its parameters (e.g., its location in the image).
