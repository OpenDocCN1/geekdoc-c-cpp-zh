- pgno: 147
  md: '# Operators


    The operators in the table below produce a result which can be assigned to another
    variable, e.g. c = a + b, but do not affect the values of a or b.


    | Symbol | Function |

    | a + b | Addition |

    | a - b | Subtraction |

    | a * b | Multiplication |

    | a / b | Division |

    | a % b | Modulo (remainder of a / b) |

    | a & b | Bitwise AND |

    | a | b | Bitwise OR |

    | a ^ b | Bitwise XOR |

    | a << b | Bit shift left |

    | a >> b | Bit shift right |

    | ~a | Bitwise 1''s complement |

    | !a | Logical NOT |


    The operators in the table below modify the value of a directly.


    | Symbol | Function |

    | a++ | Increment a by one |

    | a-- | Decrement a by one |

    | ++a | Increment a by one |'
