  md: 'gtk_container_add (GTK_CONTAINER (win), btn);


    The gtk_container_add function places the button inside the window.


    gtk_widget_show_all (win);


    Finally, the call to gtk_widget_show is now replaced with a call to gtk_widget_show_all
    – this tells GTK to show both the named widget and any widgets it contains; if
    this line wasn''t changed, the window would be shown, but the button would remain
    hidden.


    If you build and run the code, you''ll find that you get a (smaller) window with
    a button labelled ''Close window'' displayed on it:


    ![](img/6a7eee5b22417c3d49170130a20b16f2_81_0.png)


    The window with a button on it


    # Containers


    In the example, we use the line


    gtk_container_add (GTK_CONTAINER (win), btn);


    to put the button into the window.

    As you''ve probably noticed, each function call in GTK starts with the prefix
    gtk_ which is followed by the name of the widget type upon which it operates –
    so gtk_window_new creates a widget of type GtkWindow. This function call therefore
    operates on properties of widgets of type GtkContainer, but we are using it on
    win, which is a GtkWindow. How does that work?


    There is a hierarchy of widget types within GTK, and a widget type inherits of
    its parents within the hierarchy, that type can be described as a child of the
    widget types above it in the hierarchy.


    Because GtkContainer is one of the parents of GtkWindow, you can use gtk_container
    functions on Gtk widgets. Many widgets have GtkContainer as a parent, because
    putting one widget inside another like this is something we need to do often.


    You will notice that when win is supplied as an argument to the gtk_container_add
    function, it is wrapped inside the GTK_CONTAINER() function – this casts the argument
    to a variable of type GTK_CONTAINER, it tells the function to treat this'
  merge: -1
