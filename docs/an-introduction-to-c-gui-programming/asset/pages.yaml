  md: '# Chapter 17


    # More advanced layout


    Learn how to expand your window, and position and resize buttons automatically


    We mentioned in the previous chapter that boxes can be either horizontal or vertical.

    Just to see the difference, try changing the line:


    ```

    GtkWidget *box = gtk_vbox_new (FALSE, 5);

    ```


    ...to:


    ```

    GtkWidget *box = gtk_hbox_new (FALSE, 5);

    ```


    ...and rebuild - you should see the following:


    ![](img/6a7eee5b22417c3d49170130a20b16f2_90_0.png)


    The result of using a GtkVBox is that they are arranged vertically, while using
    a GtkHBox results in them being arranged horizontally.

    This demonstrates the difference between a GtkBox and a GtkHBox - they do exactly
    the same thing, but they just do it in different directions.


    But what about other arguments to gtk_box_pack_start that we glossed over earlier?
    These are designed to allow you to move things around within boxes and to give
    you more control over exactly where things end up within the window.


    In the windows we have seen so far, this doesn''t seem particularly useful, as
    the button and label take up as much space as they need but no more. Gtk windows
    can usually be resized - the user can grab a corner of a window and stretch it
    to an arbitrary size in dimension. Gtk tries to resize windows and widgets intelligently
    so that they grow and shrink in proportion to each other; these additional arguments
    let you control what happens to the widgets when the window size changes.'
  merge: -1
