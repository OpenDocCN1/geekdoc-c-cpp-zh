  md: '# AN INTRODUCTION TO C GUI PROGRAMMING


    Having created the menu, we use gtk_menu_item_set_submenu to set it as a submenu
    of the ''File'' menu item.


    ```

    gtk_menu_item_set_submenu (GTK_MENU_TREE(file_mi), f_menu);

