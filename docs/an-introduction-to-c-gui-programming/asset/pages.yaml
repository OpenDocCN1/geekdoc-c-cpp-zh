- pgno: 14
  md: '# AN INTRODUCTION TO C PROGRAMMING


    undefined, you might assume that a variable which hasn''t had a value stored in
    it is 0, but that isn''t the case in C Before reading the value from a variable
    or using it in a calculation, you must store a value in it; reading a variable
    before initialising it is a common error in C.

    The next two lines do some actual work with the variables we have declared.


    ```

    a = 2;

    ```


    This stores a value of 2 in the variable a, which will now have this value until
    it''s changed.

    The reason a is called a variable is that it can vary; you can change its value
    as often as you like, but unlike another integer. The value of a variable can
    change, but its type is fixed when it is declared.


    ```

    c = a + b;

    ```


    This line adds a to b, and stores the result in c.


    ```

    printf("The sum of adding %d and %d is %d\n", a, b, c);

    ```


    This is another output of the formatted print function we saw in the previous
    chapter. Note the three %d symbols inside the string; they are format specifiers,
    and they are how you output numbers in C. When the printf function is executed,
    each %d is replaced by a decimal representation for decimal integers of the variable
    in the corresponding position in the list after the string. The first %d will
    be replaced by the value of a, the second with the value of b, and the third with
    the value of c.


    Compile the program above and then run it. You should see this in the terminal:


    The sum of adding 2 and 3 is 5


    MULTIPLE DECLARATIONS

    You can declare multiple variables of the same type in one line separated by commas

    For the example here instead of three separate declarations you could write

    int a, b = 3, c = 0;


    # Floating-point numbers


    So we can add two integers together, what else can we do? One thing we might want
    to use floating-point numbers numbers with a decimal point. These have a different
    type, called float. Try changing the code above instead of:


    ```

    int a;

    ```'
  merge: -1
