    \ button is pressed. (All I said that it would be more useful than the previous\
    \ example; I didn't say it would be useful for anything people actually want to\
    \ do!)\n\nLabels\n\nFor displaying text on a Window we use a widget called GtkLabel\
    \ - a label is any piece of text which cannot be edited by the user (The button\
    \ we added in the previous example contains a label widget which displays the\
    \ name: we gave the button in the gtk_button_new_with_label call)\n\nYou can create\
    \ a label with text already in it, or you can create a blank label and add text\
    \ to it later on, you can also change the existing text in a label whenever you\
    \ like.\n\nHere's the code to add a label to our window:\n\n```\n#include <gtk/gtk.h>\n\
    \nvoid end_program (GtkWidget *wid, gpointer ptr)\n{\n    gtk_main_quit();\n}\n\
    \nvoid main (int argc, char *argv[])\n{\n    gtk_init (&argc, &argv);\n    GtkWidget\
    \ *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n    GtkWidget *btn = gtk_button_new_with_label('Click\
    \ me');\n    g_signal_connect (btn, \"clicked\", G_CALLBACK (end_program),\n \
    \   NULL);\n    g_signal_connect (win, \"delete_event\", G_CALLBACK (end_program),\n\
    \    NULL);\n    gtk_container_add (GTK_CONTAINER (win), btn);\n```"
