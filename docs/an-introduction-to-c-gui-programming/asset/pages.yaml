  md: "# Chapter 3\n\n# Conditions\\and comparisons\n\nBranches and loops: controlling\
    \ the flow of your C program\n\nOne of the fundamentals of any programming language\
    \ is the ability to make conditional operations – to change the program's flow\
    \ depending on the result of a test.\n\nIn this chapter, we'll look at how you\
    \ test conditions within your C programs, and how you use the results to determine\
    \ what happens next.\n\nIn C, the mechanism for controlling flow based on testing\
    \ a condition is the if-else statement. Here's a simple example:\n\n```\n#include\
    \ <stdio.h>\n\nvoid main(void) {\n    int a = 0;\n\n    if (a == 0) {\n      \
    \  printf(\"a is equal to 0\\n\");\n    } else {\n        printf(\"a is not equal\
    \ to 0\\n\");\n    }\n}\n```\n\nHere, the keyword if is followed by a test enclosed\
    \ in round brackets, in this case (a == 0). If the test evaluates as true, the\
    \ operations enclosed by the curly brackets after the test are executed.\n\nThis\
    \ example also shows the use of else clause. At the end of the curly brackets\
    \ around the operations you want to execute if the test is true, there's an else\
    \ followed by"
  merge: -1
  img_proc: true
- pgno: 19
  md: 'another set of curly brackets, these contain the operations you want to execute
    if the original test evaluated as false.


    Try compiling the code above, and change the value with which a is initialised
    to make sure it does what you expect.


    # CURLY BRACKETS


    Curly brackets are used to group together a set of statements which always execute
    together. If your loop or if statement only needs to execute one statement, you
    can leave out the curly brackets after the test, but this can make the code less
    obvious to a human.


    ```

    = Of =

    ```


    That''s all fine, but what does this a == all about? Surely if we want to know
    whether a is equal to 0, we just put a = ? The two equals signs? Well, replacing
    the double equals with a single equals and see what happens.


    This is a very important aspect of C syntax, and a common source of bugs. The
    equals sign is used for two different things: one is to assign a value to a variable,
    whereas the other is to test whether a value is equal to a value. A single equals
    sign (= assigns a variable; a double equals sign (== tests a variable.


    So the statement...


    ```

    (a == =)

    ```


    ...tests to see if a is equal to 0. If it is, then the test evaluates as true,
    and the code immediately after the if executed.


    But the statement...


    ```

    (a = =)

    ```


    ...doesn''t compare a against 0 at all; it just sets a to 0. So how does the compiler
    decide what to do? In this case, it just looks at the value of what''s in the
    brackets; you''ve set a to 0, so the value inside the brackets is 0.


    In C, a value of 0 is equivalent to false, and a non-zero value is equivalent
    to true. So by replacing the double equals with a single equals you''ve changed
    the value of a, and then look to see if the value you''ve set a is equivalent
    to true or false, neither of which were you wanted to do! If a C program is behaving
    strangely, check very carefully that all your tests are actually tests and not
    assignments.


    So == is the test to see if a value is equal to another one. There are other useful
    symbols that can be used in a test. The symbol 1=, for example, means ''is not
    equal to'''
  merge: -1
  img_proc: true
- pgno: 20
  md: '# INTRODUCTION TO C PROGRAMMING


    The mathematical operators > and < are used to test for ''is greater than'' and
    ''is less than'' respectively, and they can also be combined with an equals sign
    to give >= and <=, the tests for ''is greater than equal to'' and ''is less than
    equal to'':


    You combine tests with logical operators. The symbol && is Boolean AND (i.e test
    both sides are true), and || is Boolean OR (i.e test either side is true). So,
    to execute code only if a and b are 0 you use if (a == 0 && b == 0). To test either
    a or b is 0, you use if (a == 0 || b == 0).


    Similarly, you use the operator ! as Boolean NOT to invert the result of a test,
    so if (!(a == 0)) is the same as (a != 0).


    ![](img/6a7eee5b22417c3d49170130a20b16f2_20_0.png)


    +   - Make sure that you use a double equals sign in the brackets after the if,
    not a single one!


    # ELSE-IF


    You can have multiple else statements in one-test instead of one single else for
    one, alternative use else if () with a new test for each alternative you want.
    We''ll look more at this in the next chapter.


    # Looping


    The if statement is useful for making a single decision, but what if you want
    to do something repeatedly until a test is true or false? We use a while loop
    for this, and here''s an example'
