  md: "# INTRODUCTION TO C PROGRAMMING\n\n```\ng_signal_connect (comb, \"changed\"\
    , G_CALLBACK(combo_changed), NULL);\n```\n\nThe GtkComboBoxText is a useful control\
    \ for simple cases, but the full GtkComboBox gives a lot more flexibility. Like\
    \ some other widgets for free-form data display, it is used as a front end on\
    \ a database structure called a list store.\n\n# List stores\n\nA list store can\
    \ be thought of as a table of data with multiple rows and columns. Each cell of\
    \ the table can store a text string, an integer, or even an image.\n\nOnce a list\
    \ store is created a combo box can be associated with it and one column of the\
    \ list store can be used to provide the options for the box. The code for this\
    \ is little longer and more complex than that for a GtkComboBoxText above, but\
    \ adds the potential for much more sophisticated handling of combo boxes.\n\n\
    ```\nint pos = 0;\n\nGtkListStore *ls = gtk_list_store_new (1, G_TYPE_STRING);\n\
    gtk_list_store_insert_with_values (ls, NULL, pos++, 0,\n    \"Option 1\", -1);\n\
    gtk_list_store_insert_with_values (ls, NULL, pos++, 0,\n    \"Option 2\", -1);\n\
    gtk_list_store_insert_with_values (ls, NULL, pos++, 0,\n    \"Option 3\", -1);\n\
    ```\n\n```\nGtkWidget *comb = gtk_combo_box_new_with_model (\n    Gtk_TREE_MODEL\
    \ (ls));\n```\n\n```\nGtkCellRenderer *rend = gtk_cell_renderer_text_new ();\n\
    ```\n\n```\ngtk_cell_layout_pack_start (GTK_CELL_LAYOUT (comb), rend, FALSE);\n\
    gtk_cell_layout_add_attributes (GTK_CELL_LAYOUT (comb), rend,\n    \"text\", 0);\n\
    ```\n\nFirst, we create a GtkListStore:\n\n```\nGtkListStore *ls = gtk_list_store_new\
    \ (1, G_TYPE_STRING);\n```"
