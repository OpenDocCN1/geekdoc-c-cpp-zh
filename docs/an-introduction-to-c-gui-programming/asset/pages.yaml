- pgno: 15
  md: '...you have:


    # float a;


    This tells the compiler that a is now a floating-point value, rather than an integer.
    Compile and run your program. What happens?


    Oops! That doesn''t look right, does it? What has happened is that, while the
    maths is still all correct, the printf statement is now wrong, you''re telling
    it to print a, which is a floating-point value, as a decimal integer. To fix that,
    change the first %d in the printf function to %f, which is the format specifier
    for a floating-point number, like this:


    ```

    printf("The sum of adding %f and %d is %d\n", a, b, c);

    ```


    That should produce something a lot more sensible when you run it. This is an
    important lesson about C: it will do exactly what you told it, even if it makes
    no sense. You told it to show you a floating-point number as if it were a decimal
    integer, and the compiler assumed what you wanted, even though the result was
    nonsense.


    When you''re working with variables, always keep track of what values you''re
    putting in what types, as it''s easy to introduce errors by assuming a variable
    is of one type when it''s actually another. One common error is to produce the
    results of a calculation on floating-point values into an integer.


    Try this: make b a float as well (not forgetting to change its format specifier
    in the printf), but leave c as an int, and set the two floats to values with decimal
    points, like this:


    ```

    float a;

    float b = 3.6461;

    int c;

    ```


    ```

    a = 2.8970;

    c = a + b;

    printf("The sum of adding %f and %d is %d\n", a, b, c);

    ```


    You''ll see a result like:


    # The sum of adding 2.897000 and 3.641000 is 6


    6? That''s not right! But it''s exactly what you''ve asked for. What the compiler
    did when you told the two floating-point values together and got the answer 6.538
    but then you put that into an int c, so the compiler just threw away after the
    decimal point! If you change c to a float, and change the final %d to %f, you''ll
    find it gives the correct answer.'
  merge: -1
  img_proc: true
