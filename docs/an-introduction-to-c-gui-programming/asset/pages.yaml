  md: '# Chapter 22


    # Dialogs


    Give users information and ask them

    questions using dialogs


    f we want to ask the user a question, or to inform them of something, the best
    way to do

    is with a dialog box. GTK makes it easy to create dialogs - a GtkDialog can contain

    any GTK widgets, so can be as simple or as complex as you need.


    The characteristic which distinguishes a dialog from a window in GTK is that a
    dialog

    interrupts the operation of the application - once a dialog is shown, the rest
    of the application

    waits until the dialog is closed.


    Dialogs all have one or more buttons (typically with functions like ''OK'' and
    ''Cancel'') in what

    is called the action area at the bottom of the dialog these close the dialog and
    return control

    to the main window. Each button in the action area generates a different return
    code, which is

    passed back from the dialog to give the user''s response.


    Here''s the code for a simple dialog - connect this to the clicked signal on a
    button

    with g_signal_connect, pass a pointer to the main window of your application as
    the

    general-purpose pointer in the g_signal_connect function:


    ```

    void open_dialog(GtkWidget *wid, gpointer ptr)

    {

    nGtkWidget *dlg = gtk_dialog_new_with_buttons("My dialog",nGTK_WINDOW, (ptr),

    GTK_DIALOG_MODAL, GTK_DIALOG_DESTROY_WITH_PARENT,

    "Cancel", 0, "OK", 1, NULL);


    int result = gtk_dialog_run(GTK_DIALOG (dlg));

    gtk_widget_destroy(dlg);

    print("Return code = %d\n");

    }

    ```


    The gtk_dialog_new_with_buttons function takes a number of arguments. The first

    is the text to be displayed on the title-bar of the dialog. The second is a pointer
    to the main

    window of the application - this why the main window should be supplied to the

    g_signal_connect function which links this handler to a button''s clicked signal'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The third argument is a set of flags which control the behaviour of the dialog;
    in this case we set it to be a modal dialog and set it to be destroyed along with
    its parent window. Making a dialog modal means the parent window will be locked
    while the dialog is on display - it forces the user to close the dialog before
    they can continue; which is usually the desired behaviour. Making the dialog destroyed
    along its parent is just for tidiness – it means that if the main window of the
    application closes for some reason not, then the dialog will also close (It is
    quite rare to create a dialog without setting it to be modal and destroyed with
    its parent).


    The remaining arguments control which buttons are displayed in the action area
    of the dialog. This is a list of paired values, the first of each pair is the
    label to be displayed on a button, and the second is the return code which that
    button will generate when clicked. The list is terminated with a NULL value.


    Once we have created our dialog, we call `gtk_dialog_run` – this displays the
    dialog and allows the user to interact with it. They will be able to operate any
    widgets on the dialog, but the main window will be locked while they do; execution
    of code waits inside the `gtk_dialog_run` function until a button in the action
    area is clicked. At this point, you need to call `gtk_widget_destroy` on the dialog
    to get rid of it – you might have expected clicking a button to remove the dialog,
    but this doesn''t happen; the dialog stays on screen until it is explicitly removed.


    Build and run the code – when you click the button which calls this handler, the
    dialog should be displayed.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_120_0.png)


    A simple GtkDialog, with two buttons in the action area


    While the dialog is on screen, clicking any other controls on the main window
    will have no effect. When you close the dialog by clicking either the ''OK'' or
    ''Cancel'' buttons, you will see a message showing the return code for the button
    you clicked in the terminal window from which you launched the application.


    That''s a basic dialog, but it''s bit small and bare! Let''s add a label to it
    to ask the user a question. To do this, we have access the dialog''s content area
    effectively a dialog is a GtkWindow which holds a GtkBox with two GtkContainers
    in it – one is the action area at the bottom which holds the buttons, and the
    other is the content area at the top. We add any'
