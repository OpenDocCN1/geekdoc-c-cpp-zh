    If the file pointer exists we call the function fgetc (for ''get character'')
    in a loop; each time this function is called it reads a single byte from the file,
    and then advances the file pointer to the next byte in the file. When the file
    pointer reaches the end of the file, it returns the special value EOF (for end
    of file) So we print the value returned by fgetc each time until it returns EOF


    Once we have finished reading the file,we finish access to it by calling fclose
    (for ''file close''), which frees the file pointer and allows you to reuse it
    to access another file.


    Note that while fgetc reads characters it returns an integer; this is because
    the code for EOF falls outside the range of a char variable (0-255). Unless at
    the end of a file, fgetc returns an integer value which can always be treated
    as a char.


