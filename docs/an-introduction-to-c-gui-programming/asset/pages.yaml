  md: "# Chapter 10\n\n# File input and output\n\nReading from and writing to files\n\
    \nIn the previous chapter, we looked at how to get input from the user at the\
    \ console. In this chapter, we'll look at the other common method of input and\
    \ output in C: reading and writing files.\n\nMany programs need to be able to\
    \ access files on the host computer's disk; even if it's just for saving user\
    \ preferences and the like, file access is a fundamental requirement for a lot\
    \ of programming tasks.\n\nIn C, files are accessed by file pointers. A file pointer\
    \ contains all the information required to access a file: both its name and location\
    \ on the file system, and the current position within the file at which data will\
    \ be read or written\n\nSo the first thing we need to do is to get a file pointer.\
    \ The C function fopen, which takes two arguments. The first argument is the path\
