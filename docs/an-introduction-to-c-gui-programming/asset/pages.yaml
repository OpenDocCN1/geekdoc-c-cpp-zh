    \ int b) {\n    int res;\n    res = a + b;\n    return res;\n}\n\nvoid main(void)\
    \ {\n    int y = 2;\n    int z = sum(5, y);\n    printf(\"The sum of 5 and %d\
    \ is %d\\n\", y, z);\n}\n```\n\nThis includes both the **main** function and a\
    \ second function called **sum**. In both cases, the structure of the function\
    \ is the same a line defining the value returned by the function, the function\
