  md: "# INTRODUCTION TO C GUI PROGRAMMING\n\nreference to a GtkWindow as a GtkContainer.\
    \ The code will still work if this function isn't included, but the compiler will\
    \ complain! (GTK includes a GTK_ function for every type of widget, as it is quite\
    \ common to need to cast a widget to a different type.)\n\nSo what this line does\
    \ is to tell GTK to treat the GtkWindow win as a GtkContainer, and to put the\
    \ button btn into it.\n\n# Signals\n\nIf you run the application, you can click\
    \ the button with the mouse, and it will highlight to show that it has been clicked.\
    \ You can also hit the ENTER key on the keyboard to do the same thing - this-\
    \ behaves exactly like the buttons we are used to seeing in applications, but\
    \ it still doesn't actually do anything useful. The next step is to fix.\n\nThe\
    \ way to do that is to connect to a handler function to the signal generated when\
    \ the button is clicked.\n\nHere's the code with a handler added:\n\n```\n#include\
    \ <gtk/gtk.h>\n\nvoid end_program(GtkWidget *wid, gpointer ptr) {\n    gtk_main_quit();\n\
    }\n\nvoid main (int argc, char *argv[]) {\n    gtk_init(&argc, &argv);\n    GtkWidget\
    \ *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n    GtkWidget *btn = gtk_button_new_with_label(\"\
    Click\");\n    g_signal_connect(btn, \"clicked\", GCALLBACK(end_program), NULL);\n\
    \    gtk_container_add(GTK_CONTAINER, win, btn);\n    gtk_widget_show_all(win);\n\
    \    gtk_main();\n}\n```\n\nThe handler function, otherwise known as a callback,\
    \ is called end_program, and all it does is to call the GTK function gtk_main_quit\
    \ - as you'd expect from the name, this function exits the loop within gtk_main\
    \ and allows the program to end.\n\n```\ng_signal_connect(btn, \"destroy\", GCALLBACK(end_program),\
    \ NULL);\n```"
