  md: "# Chapter 5\n\n# Pointers\n\nPointers - variables have addresses as well as\
    \ names.\n\nThe term pointer has struck fear into the heart of many a beginner\
    \ C programmer, but once you've got your head around them, pointers are a very\
    \ useful feature of the language. They aren't actually complicated in reality,\
    \ but it's easy to get confused when using them, so let's try to avoid that...\n\
    \nRemember when we looked at the declaration of variables? Declaring a variable\
    \ - telling the compiler what type it is and what it's called - before you can\
    \ use it is necessary in C, because the declaration enables the compiler to allocate\
    \ a block of memory to store the variable. So for every variable you declare,\
    \ there's a block of memory which is set aside by the compiler for that variable,\
    \ and the compiler remembers which particular block of memory is used for each\
    \ variable.\n\n# What is a pointer?\n\nA pointer is just the address of a block\
    \ of memory with a variable in it; that's all there is to it. So if you declare\
    \ a variable and a pointer to that variable, you can access the value in that\
    \ block of memory in two ways: either with the variable name, or with the pointer.\n\
    \nLet's look at a simple example:\n\n```\n#include <stdio.h>\n\nvoid main(void)\n\
    {\n    int a;\n    int *ptr_to_a;\n\n    ptr_to_a = &a;\n\n    a = 5;\n    printf(\"\
    The value of a is %d\\n\", a);\n\n    *ptr_to_a = 6;\n    printf(\"The value of\
    \ a is %d\\n\", a);\n```"
