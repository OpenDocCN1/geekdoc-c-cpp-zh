- pgno: 112
  md: "Whenever the selected row is changed, the cursor-changed signal is generated\
    \ by the tree view, so this can be used to call an appropriate callback:\n\n```\n\
    g_signal_connect(tv, \"cursor-changed\", G_CALLBACK\n(row_selected), NULL);\n\
    ```\n\nThe callback should be as follows:\n\n```\nvoid row_selected (GtkWidget\
    \ *wid, gpointer ptr)\n{\n    GtkTreeSelection *sel;\n    GtkTreeModel *model;\n\
    \    GtkTreeIter iter;\n    char *option;\n\n    sel = gtk_tree_view_get_selection\
    \ (GTK_TREE_VIEW (wid));\n    if (gtk_tree_selection_get_selected (sel, &model,\
    \ &iter))\n    {\n        gtk_tree_model_get(model, &iter, 0, &option, -1);\n\
    \        printf (\"The selected row contains the text %s\\n\", option);\n    }\n\
    }\n```\n\nFinding out which row,s selected requires an iterator, which is a data\
    \ structure which stores the location of a row in a list store.\n\nFirst we need\
    \ to get the GtkTreeSelection for the tree view - this stores which row (or rows)\
    \ are currently highlighted.\n\n```\nsel = gtk_tree_view_get_selection (GTK_TREE_VIEW\
    \ (tv));\n```\n\nFrom a GtkTreeSelection, we then get the GtkTreeIter and GtkTreeModel\
    \ associated with it. The tree model is the list store which is providing the\
    \ data for the tree view, and the iterator is the actual row selected.\n\n```\n\
    if (gtk_tree_selection_get_selected (sel, &model, &iter))\n```\n\n(This function\
    \ returns FALSE if there is no valid selection - it's important to check for this\
    \ as otherwise the next line will cause a crash if no row is selected.)"
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Finally, we can get the actual values from the model and iterator.


    ```

    gtk_tree_model_get (model, &iter, 0, &option, -1);

    ```


    As when setting a value in a list store, arguments to this function, after the
    model and iterator, are a list of paired values, the first of each pair being
    the column to be read, and the second being a pointer to which the data should
    be written. Multiple values can be read from the same row with a single call,
    so -1 is used for the column value of the final entry in the list, to show there
    are no more values to read.


    In this case, a pointer to the text in the first column of the selected row is
    returned as option.'
