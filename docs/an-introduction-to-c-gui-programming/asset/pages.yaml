  md: "# Chapter 2\nVariables and arithmetic\n\nDoing some real work in C: creating\
    \ variables and performing mathematical operations on them\n\nIn some languages,\
    \ you can create variables as you go along and put whatever data you want into\
    \ them. C isn't like that: to use a variable in C, you need to have created it,\
    \ and at the time you create it, you have to set what type of value it's going\
    \ to store. By doing this, a block of memory of the correct size can be allocated\
    \ by the compiler to hold the variable. This process of creating a variable is\
    \ known as declaration\n\n# Integers\n\nThere are several fundamental data types\
    \ in C, but we'll start by looking at one of the most commonly used: the int type,\
    \ used to store an integer value.\n\n```\n#include <stdio.h>\n\nvoid main (void)\
    \ {\n  int a;\n  int b = 3;\n  int c;\n\n  a = 2;\n  a = a + b;\n  printf(\"The\
    \ sum of adding %d and %d is %d\\n\", a, b, c);\n}\n```\n\nThe three lines inside\
    \ the main function here are declarations. They tell the compiler that we would\
    \ like to use variables called a, b, and c respectively and that each one is of\
    \ type int, i.e. an integer.\n\nIn the second line, we see an example of an initialisation\
    \ at the same time as a declaration stores an initial value of 3 in the variable\
    \ b. Note that the values of a and c at this point are"
