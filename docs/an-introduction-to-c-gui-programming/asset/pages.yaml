  md: "the gtk_list_store_new function takes a list of arguments – the first is the\
    \ number of columns in the list store, and this is followed by a list of the types\
    \ of data stored in each column. In this example we are creating a box with a\
    \ single column, and that column will hold a text string.\nWe then add some entries\
    \ to the list store:\n\n```\ngtk_list_store_insert_values (ls, NULL, pos++, 0,\n\
    \    \"Option 1\", -1);\ngtk_list_store_insert_values (ls, NULL, pos++, 0,\n \
    \   \"Option 2\", -1);\ngtk_list_store_insert_values (ls, NULL, pos++, 0,\n  \
    \  \"Option 3\", -1);\n```\n\nEach call to gtk_list_store_insert_with_values takes\
    \ the list store as an argument, followed by a NULL pointer. In some cases, this\
    \ would be a pointer to what is called iterator, which is a reference to the entry\
    \ just added – we don't need this functionality, so we set the pointer to NULL\n\
    \nThese are followed by the index within the list store where the new entry is\
    \ to be placed - effectively the number of the row to be used for the data - then\
    \ a list of paired values. The first value of each pair is the column where the\
    \ data is to be stored and the second is the data itself, the list of pairs is\
    \ terminated with a -1 for the column value. In this case, we are only adding\
    \ a single string item to each row, in column 0.\nWe associate a combo box with\
    \ the list store:\n\n```\nGtkWidget *comb = gtk_combo_box_new_with_model (\n \
    \   GTK_TREE_MODEL (ls));\n```\n\nThis creates a combo box and tells GTK that\
    \ the data for this combo box comes from the ls list store we previously created.\
    \ The data used by a combo box is of type GtkTreeModel, so we cast our list store\
    \ to this type.\nNow we set which column of the list store should be shown in\
    \ the combo box – warned, this gets a bit complicated!\n\n```\nGtkCellRenderer\
    \ *rend = gtk_cell_renderer_text_new();\n```\n\nWe create a GtkCellRenderer -\
    \ this is a code object which is used to create a graphical representation of\
