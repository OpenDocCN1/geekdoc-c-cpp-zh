- pgno: 139
  md: '![](img/6a7eee5b22417c3d49170130a20b16f2_139_0.png)


    The widget properties editor


    Click on the GtkButton, and find the Label section for it - it''s under ''Label
    with optional image'' – change the label for the button to ''Quit'' at the bottom
    of the right-hand column – it is worth investigating the options on all the tabs
    at go into here, but of particular interest are those on the ''Packing'' tab,
    these allow you to expand the expand, fill and padding options which were available
    when adding widgets to boxes code if you play with them, you can get a good feeling
    for how much control you have over layout of the window, particularly when combining
    multiple boxes inside each, as Glade allows you to do.


    The other thing that it is important to note about right hand column is that Glade
    assigns every widget name – it can be seen in the hierarchy list at the top, and
    as the last entry on the ''General'' tab Glade assigns names as name of the widget
    type followed by a number, but you can change these if you want But there is one
    vital rule – every widget in a layout file must have a unique name If two widgets
    have the same name, the layout file is invalid and will not load correctly.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "# AN INTRODUCTION TO C AND PROGRAMMING\n\nYour button and label widgets should\
    \ have the names button1' and label1', and your window should be Window1 - remember\
    \ these; as they are important when linking the code to the layout file. For now,\
    \ save your layout as mylayout.glade by choosing the 'Save As' option in the 'File'\
    \ menu (You can select one of two different formats on the window - use the default\
    \ GtkBuilder option) Make sure you save the file in the same directory where you\
    \ are storing your GTK source code.\n\n# Using a layout file in a GTK application\n\
    \nNow we need to load the layout file into some GTK code. Try the following:\n\
    \n```\n#include <gtk/gtk.h>\n\nvoid main (int argc, char *argv[]) {\n  gtk_init(&argc,\
    \ &argv);\n\n  GtkBuilder *builder = gtk_builder_new();\n  gtk_builder_add_from_file(builder,\
    \ \"mylayout.glade\", NULL);\n\n  GtkWidget *win = (GtkWidget *) gtk_builder_get_object(builder,\
    \ \"window1\");\n  gtk_widget_show_all(win);\n\n  gtk_main();\n}\n```\n\nThe gtk_init\
    \ and gtk_main calls are the same as we have seen before, but the code between\
    \ them uses a GtkBuilder, a code object which reads in and processes a layout\
    \ file. We create a GtkBuilder object.\n\n```\nGtkBuilder *builder = gtk_builder_new();\n\
    ```\n\nWe then read the layout file into the builder.\n\n```\ngtk_builder_add_from_file(builder,\
    \ \"mylayout.glade\", \"window1\", NULL);\n```\n\nThe widgets which we created\
    \ in the layout file can now all be accessed by calls to gtk_builder_get_object,\
    \ and used as before So we get the object which was named window1 in the layout\
    \ file.\n\n```\nGtkWidget *win = (GtkWidget *) gtk_builder_get_object(builder,\
    \ \"window1\");\n```"
  merge: -1
  img_proc: true
- pgno: 141
  md: "And we show it as before:\n\n```\ngtk_widget_show_all (win);\n```\n\nIf you\
    \ build and run this code, our simple window should be displayed on the screen:\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_141_0.png)\n\nThe window created in\
    \ Glade when run\n\nAs mentioned above, layout files control the appearance of\
    \ a window to make the widgets do things, we need to connect signals as before,\
    \ so let's modify our code accordingly.\n\n```\nvoid on_destroy (GtkWidget *wid,\
    \ gpointer ptr)\n{\n    gtk_main_quit(NULL);\n}\n\nvoid main (int argc, char *argv[])\n\
    {\n    gtk_init(&argc, &argv);\n\nGtkBuilder *builder = gtk_builder_new (());\n\
    \    gtk_builder_add_from_file (builder, \"mylayout.glade\", NULL);\n\nGtkWidget\
    \ *win = (GtkWidget *)gtk_builder_get_object (builder, \"window\");\nGtkWidget\
    \ *btn = (GtkWidget *)gtk_builder_get_object (builder, \"button\");\n    g_signal_connect\
    \ (btn, \"clicked\", G_CALLBACK(on_destroy), NULL);\n\n    gtk_widget_show_all\
    \ (win);\n    gtk_main ();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 142
  md: 'This time, we also get the button widget from the builder and connect the end_program
    callback back to g_signal_connect, as we''ve done before Build and run, and this
    time the button should close the program.


    Using layout files can make the amount of code you need to write a lot shorter,
    and the use of Glade makes it easier to create complex interfaces with more customisation
    of your widgets. For small applications with a simple window, it''s probably more
    straightforward just to do everything in C, but for anything more complex, using
    a layout file can make the code a lot more readable.


    # Next steps


    One thing which GTK should be obvious to anyone who has worked through this book
    and reached this point is that GTK is a fairly huge subject! There are dozens
    of widgets, and hundreds of different ways they can be configured and used - any
    comprehensive guide to using them would run into several hundred pages.


    The best reference to GTK 2 - and the best place to find further information if
    you want to do more with it - is the official developer documentation, which can
    be found online at developer.gnome.org/gtk2/stable. This gives far more detail
    on every aspect of GTK - the reference section listing all the functions associated
    with each widget is particularly useful.


    Hopefully this book has given you an idea of where to get started with GTK programming,
    and enough of a foothold to be able to experiment for yourself. Happy GUI designing!'
  merge: -1
  img_proc: true
