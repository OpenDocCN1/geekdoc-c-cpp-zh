  md: "# Leaving a loop early\n\nThe break statement has one other use it can be used\
    \ inside while and for loops to break out of them. Look at this example:\n\n```\n\
    #include <stdio.h>\n\nvoid main (void) {\n    int a = 0;\n\n    while (1) {\n\
    \        printf(\"a is equal to %d\\n\", a);\n        a++;\n        if (a == 3)\
    \ {\n            break;\n        }\n    }\n    printf(\"a is equal to %d and I've\
    \ finished\\n\", a);\n}\n```\n\nSo we have a while loop in the test is just the\
    \ value 1; this is a non-zero value, and so always true if you enclose inside\
    \ curly brackets after a while (1) statement, the loop will never end it will\
    \ keep running forever. But in this case we have provided an alternative way to\
    \ end the loop; we test the value of a inside the loop itself in an if statement,\
    \ and if a is equal to 5 we call break This causes the loop to end and execution\
    \ to continue with the statement after the loop break statement like this can\
    \ be useful to leave a loop early in the event of an error, for example.\n\n#\
    \ CONTINUE\n\nThe keyword continue can be used in a loop instead of break but\
    \ instead of breaking out of the loop it skips all the rest of the code in the\
    \ current iteration and returns to the test case at the start of the loop. Among\
    \ other things, this can be useful to speed up your code."
