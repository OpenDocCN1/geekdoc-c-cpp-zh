    \    NULL);\n\nGtkWidget *lbl = gtk_label_new (\"My label\");\n\nGtkWidget *btn2\
    \ = gtk_button_with_label (\"Button 2\");\ng_signal_connect(btn2, GCALLBACK (count_button),\n\
    \    lbl);\n\nGtkWidget *table = gtk_table_new (2, 2, TRUE);\ngtk_table_attach_defaults\
    \ (GTK_TABLE (table), lbl, 0, 1, 0, 1);\ngtk_table_attach_defaults (GTK_TABLE\
    \ (table), btn2, 1, 2, 0, 1);\ngtk_table_attach_defaults (GTK_TABLE (table), btn,\
    \ 0, 2, 1, 2);\ngtk_container_add (GTK_CONTAINER (win), table);\ngtk_widget_show_all\
    \ (win);\n    gtk_main (0\n}\n```"
