  md: "# AN INTRODUCTION TO C AND GUI PROGRAMMING\n\nor vice versa. It's even acceptable\
    \ to put an GtkHBox as an item inside GtkHBox (but it's\ngeneral a bit pointless).\
    \ Using a combination of nested GtkHBoxes and GtkVBoxes, you can\nlay out all\
    \ the widgets in a window the way you want.\n\nNesting GtkBoxes and GtkVBoxes\
    \ works perfectly well for laying out widgets in two\ndimens, and actually give\
    \ you the best control over how they appear, there is a simpler\nalternative,\
    \ the GtkTable widget.\n\nA GtkTable is a two-dimensional box, which is defined\
    \ as having a certain number of rows and\ncolumns when it is created. Widgets\
    \ can then be located at various row and column co-ordinates.\nThis is not as\
    \ flexible as using nested GtkBoxes and GtkVBoxes, because every\nwidget has to\
    \ be aligned in both a row and a column - this means that any row is always\n\
    least high as the tallest widget anywhere in it, and any column is at least wide\
    \ as\nt widest widget anywhere in it, this can lead to a lot of wasted space.\
    \ But often a\nsimple arrangement like this is all that is needed, a Table works\
    \ fine.\n\nHere are the changes to our example if we use a GtkTable to position\
    \ the label and buttons\n\n```\nvoid main (int argc, char *argv[])\n{\n    gtk_init(&argc,\
