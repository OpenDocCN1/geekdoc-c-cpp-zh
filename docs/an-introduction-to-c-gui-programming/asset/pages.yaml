- pgno: 9
  md: '# Chapter 1


    # Getting started


    C is one of the most widely used programming languages

    learn how to use it to program the Raspberry Pi!


    # What''s so great about C?


    C is a very versatile and widely used programming language. It has been used to
    write pretty much everything, from low-level routines to control the hardware
    in embedded microcontrollers with graphical user interfaces. In spite of this
    huge flexibility, it is also relatively simple – the language only has about 20
    or so keywords, but there are huge libraries of additional functions that you
    can call on when you need them. In the first part of this book, we are going to
    concentrate on learning about the keywords, with a few of the more commonly used
    library functions; the second part of the book shows how to use the GTK library
    to make it easy to write graphical interfaces in C.


    Many of the languages you may have seen, such as Python, are all called interpreted
    languages. This means that the code you write is run directly; each line of code
    is read in and interpreted as you run it. C is different: it''s a compiled language.
    This means that the code you write, known as the source code, is never run directly.
    The source code is passed through a program compiler, which converts it into a
    machine-readable version called an executable or a binary; then you run the executable.


    This may seem complex, but it has a few advantages. First, it means that you don''t
    need to have a copy of C itself on every computer you want to run your program
    on; once compiled, the executable is standalone and self-contained. Second, the
    compilation process will find a lot of errors before you even run the program
    (but you won''t usually find all of them). importantly, the compilation process
    means that the time-consuming translation of readable code into machine-readable
    instructions has already happened, which means that compiled code generally runs
    many times faster than interpreted code would.


    # CHOOSE YOUR EDITOR


    You can use whatever editor you like to enter code, as long as it saves it as
    plain text. The Gesny editor included in Raspbian is a good choice, but you can
    also use Leafpad, nano, or any others that you prefer.'
  merge: -1
  img_proc: true
- pgno: 10
  md: "# WHITESPACE DOESN'T MATTER!\n\nUnlike Python, whitespace has no significance\
    \ in C - you can put spaces, tabs and new lines wherever you like in a C program\
    \ to make it readable.\n\n# Hello world - your first C program\n\nWith all out\
    \ of the way - which has hopefully made you think that C might be worth learning\
    \ - let's have a look at the first program everyone writes in any language, the\
    \ one that prints \"Hello World\" on the screen. Incidentallyally, the tradition\
    \ of writing a Hello World program was first introduced with the original documentation\
    \ describing C itself. Just think: no C, no Hello World...\n\n```\n#include <stdio.h>\n\
    \nvoid main ()\n{\n    /* A print statement */\n    printf(\"Hello world!\\n\"\
    );\n}\n```\n\nHopefully not too frightening! Let's look at it line by line.\n\n\
    ```\n#include <stdio.h>\n```\n\nThis is known as a #include. As mentioned above,\
    \ the C language has a large library of functions that can be included, and we\
    \ need to use one of them in this program the formatted print command printf.\
    \ This is part of the standard input-output library, or stdio for short. So what\
    \ this line does is to warn the compiler that the program needs the stdio library\
    \ to be included as part of the compile process.\n\n```\nvoid main ()\n```\n\n\
    C is a function-based language; every program is made up of a number of functions.\
    \ Each function takes zero or more arguments, and returns a single value. A function\
    \ definition consists of a specification of what the function returns (in this\
    \ case, a void), a function name (in this case, main) and a list of arguments\
    \ enclosed in round brackets (again, a void).\n\nEvery C program has to include\
    \ a function called main, when you run the compiled program, the main function\
    \ is the first thing that executes."
  merge: -1
  img_proc: true
- pgno: 11
  md: 'The word void is called a type specifier, void is a special type which means
    ''no value required''. We''ll look at more types in the next chapter.

    This line defines the main function for this program; it states that the main
    function takes no arguments, and returns no value.

    The code which makes up the function itself is enclosed between the two curly
    brackets { that follow the function definition.


    /* A print statement */


    First, we have a comment telling us what''s going on. Comments in C start with
    the symbol /*, and end with */ - anything between those two symbols is ignored
    by the compiler.

    The code itself is just one line:


    ```

    printf("Hello world!\n");

    ```


    This is a call to the printf (''print formatted'') function from stdio library.
    In this case, it takes a single argument, which is a text string enclosed within
    double quotes. As mentioned above, function arguments are enclosed in round brackets.

    Note that the line ends with a semicolon. All statements in C must finish with
    a semicolon; this tells the compiler that this is the end of a statement. One
    of the most common beginner mistakes in C is to forget a semicolon!

    What about the string itself? The Hello World! bit is straightforward enough,
    but what about \n at the end? Remember this function is called print formatted?
    Well, the \n is a bit of formatting; it''s the symbol for a newline character.
    So this line will print the string ''Hello World'', followed by a new line.


    # CHECK YOUR BRACKETS


    Unlike whitespace punctuation is very important in C - make sure you use a curly
    bracket where a round one is needed, or vice versa


    # Compiling your program


    Let''s compile and run this Raspian includes a C compiler gcc so there''s nothing
    to install, just start up Raspian on your Pi and you''re ready to go Use your
    favourite text editor to create a file hello.c, copy the program above into it,
    and save it. Then, from a terminal, go into the directory where you saved hello.c
    and enter:


    ```

    gcc -o myprog hello.c

    ```'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'This calls the gcc C compiler with the option -o myprog, which tells it to
    create an executable output file called myprog and to use hello.c as the input
    source code

    If you entered your C code correctly (did you make sure the semicolon was there?),
    this should take a second or so and then return you to the command line. There
    should now be a file in the current directory called myprog – try running it by
    typing:


    ./myprog


    Et voilà! You should now have


    Hello World!


    written in the terminal


    ```

    File Edit Tabs Help

    pi@raspberry:~ $ gcc -o myprog hello.c

    pi@raspberry:~ $ ./myprog

    Hello World!

    pi@raspberry:~ $ |

    ```


    # RUNNING YOUR PROGRAM


    That''s your first C program written, compiled, and run. In the next chapter,
    we''ll start C for something a bit more useful!'
