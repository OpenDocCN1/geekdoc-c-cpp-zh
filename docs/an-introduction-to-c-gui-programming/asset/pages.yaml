  md: '# Chapter 19


    # Combo boxes and list stores


    Create combo boxes for user input and associate list stores with them


    Widgets like spin buttons, radio buttons, and check buttons are useful to allow
    a user to make selections between small numbers of options, but sometimes we need
    to offer a larger number of options. A combo box is a good way of offering the
    user a selection of choices without taking up huge amounts of space; GTK offers
    two types of combo box.


    # Text combo boxes


    The simpler kind of combo box is the GtkComboBoxText, which only allows each option
    to be plain text. Here''s how to create one


    ```

    GtkWidget *comb = gtk_combo_box_text_new ();


    gtk_combo_box_text_append_text (comb, "Option 1");

    gtk_combo_box_text_append_text (comb, "Option 2");

    gtk_combo_box_text_append_text (comb, "Option 3");


    gtk_combo_box_set_active (comb, 0);

    ```


    The gtkk_combo_box_text_new function creates an empty combo box, and entries can
    be added to it (in the order that they should appear, from top to bottom) using
    gtkk_combo_box_text_append_text.


    The final function call shown above, gtkk_combo_box_set_active, sets the initial
    value of the combo box - in this case, setting it to 0 chooses the first option
    added to the'
  merge: -1
  img_proc: true
