  md: "# Splitting code into multiple files\n\nLet's look at an example of how this\
    \ works. Create three files, two with the extension .c and\nwith the extension\
    \ .h, as follows:\n\n```\nfunction.c\n\\int add_vals(int a, int b, int c)\n{\n\
    \    return a + b + c;\n}\n```\n\n```\nfunction.h\n\nextern int add_vals(int a,\
    \ int b, int c);\n```\n\n```\nmain.c\n\ninclude <stdio.h>\n#include \"function.h\"\
    \n\nvoid main (void)\n{\n    printf(\"The total is %d\\n\", add_vals(1, 2, 3));\n\
    }\n```\n\nPut all three files in the same directory and run gcc, giving it the\
    \ names of .c files -\ngcc -o myprog main.c function.c\n\nThe resulting program\
    \ will run the main function from main.c, which calls the add_vals\nfrom function.c.\n\
    \nA few things to note: First, inside the header file we declare the function\
    \ with the word\nextern at the start of the declaration. This tells the compiler\
    \ that this function is to be found\nexternally to the file, i.e. in another C\
    \ file.\n\nSecond, while we have always included stdio.h with its name between\
    \ <> signs,\ninclude function.h in double quotes. The <> signs tell the compiler\
    \ to look for the file in the\ndirectory where the system's include files are\
    \ stored, the \"\" signs indicate that the file is local\nand is in the same directory\
    \ as the .c files you're building. If you're creating your own header\nfiles,\
    \ always use double quotes around the name when including them."
