    In some ways, this looks easier than passing values all over the the place, surely?
    So why not just do this all the time? The answer is memory. Local variables in
    functions temporarily allocated space while the function is running, and the memory
    is freed up as the function ends. But global variables are allocated space when
    the program starts, and that space isn''t freed until the program ends, if you
    allocate enough of them, you can run out of memory systems.


    There''s a better way of making a lot of data available to every function, which
    we will come to a bit later on...


    # DIFFERENT NAMES


    While it''s perfectly valid to give a local variable the same name as a global
    variable in the same program, don''t it? If you have a global and a local with
    the same name, the local is used in the function in which it is declared, and
    the global is used everywhere this can result in unexpected behaviour


    # Type definitions


    In chapter 2, we looked at the range of variable types in C: char, int, float,
    and so on. C also allows you to define your own types with what is known as a
    typedef. A typedef is a line of the format typedef <existing type> <new name>
    usually put at the start of a program. For example:


    ```

    typedef unsigned char BYTE;

    ```


    This defines a new type called BYTE, which is another name for an unsigned char
    (Note that by convention, user-defined types are usually given names in capital
    letters. It''s not compulsory, but it helps to distinguish them from variables
    when reading the code.)


    When we define a new type, what it really does is create an alias to an existing
    type. This seems a bit pointless, but it can help in two ways. First, it can make
    it more obvious what your code is doing if you make the type names specific to
    your programs data. Second, by defining specific types, you can get the compiler
    to warn you if you use the wrong type for a function argument or variable.


    There are a couple of specific cases where typedefs are particularly useful: these
    are enumerated types and data structures.


    # Enumerated types


    Often, there''s a use for a variable which can only take one of a few values.
    C provides a type called enum for this purpose, which defines an integer with
    a fixed set of named values.'
