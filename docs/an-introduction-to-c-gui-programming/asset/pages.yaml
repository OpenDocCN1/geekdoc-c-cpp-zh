    # # An introduction to themes


    The other that GTK widgets are customised is by the use of a *theme*. A theme
    affects the appearance of every instance of a widget in every GTK application,
    rather than changing the appearance of individual widgets at one time. There is
    a selection of themes installed in Raspberry (and in most Linux desktop distributions);
    in the directory /usr/share/themes/.


    This directory contains a number of named folders, each of which is a theme for
    either GTK or other themeable applications. If a named folder contains a subfolder
    named gtk-2.0, then the name of that folder is also a valid GTK 2 theme.


    Which of the themes is used is usually controlled by the xsettings daemon, which
    runs in the background and provides configuration information to all desktop applications.
    On Raspberry, to change-which theme is set in the daemon, you need to change a
    value in a configuration file


    To do this, check if there is a file named desktop.conf in the directory ~/.config/lxssession/LXDE-pi/.
    If there isn''t, create one by copying the file /etc/xdg/lxssession/LXDE-pi/desktop.conf
    into that directory.


    If you look in the desktop.conf file with a text editor, there is a section headed
    [GTK] Somewhere under this is a heading line Gtk=ThemeName=* which by default
    on Raspberry is set to *PIX*. If you change PIX in this line to the name of another
    GTK +2 theme (any directory in /usr/share/themes/ which includes a gtk-2.0 subdirectory),
    the theme in use will automatically update and you should see every GTK application
    running redraw with the new theme.


    Creating a theme is not for the faint-hearted, but if you are interested, look
    inside one of the gtk-2.0 subfolders in the directory /usr/share/themes.


    The theme itself is a file in this folder named gtkrc; there may also be a number
    of other subfolders containing graphical elements and other resources used by
    the theme.


    The gtkrc file is a plain text document which can be opened in your editor of
    choice. Most of them contain a number of style definitions, which consist of the
    word style followed by a number of lines contained within curly brackets. At the
    end of the file are lines which associate widgets with the styles previously defined.


    To change the appearance of a widget, find it in the list of associations at the
    end of the file, and note which style it applies to. Then locate the definition
    of that style within the file and changing some of the parameters to see what
    happens. Back up the original gtkrc file before you do this – even better, copy
    the whole theme folder and give it a new name of your choice; set the ThemeName
    in desktop.conf to the name of your new theme, and create your own theme by modifying
    an existing one!'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Chapter 25


    # Glade


    Use this layout editor to more easily create window layouts for applications


    As can be seen in the previous chapters, creating widgets with GTK is a lot easier
    than doing it all from scratch by writing pixels to screen buffers, you can still
    end up with quite a lot of code for even a fairly simple window layout, and you
    do have to think quite carefully about the code you are writing to make sure the
    window looks how you want it to. It''s also not ideal that you can''t actually
    see what the window will look like until you run the application.


    Fortunately, there is a way to work on the layout of a window without having to
    write all its code, and that is to use a layout editor GTK allows the layout of
    widgets on a window to be defined in an XML file, which is then loaded and drawn
    on the screen when the application runs - you still need to link up the behaviour
    of any widgets to code, but the appearance of the widgets can be determined in
    advance. A layout editor is a useful tool to create such an XML file.


    The most widely used layout editor for GTK is a tool called Glade. There are two
    versions of Glade, one for GTK 2 and one for GTK 3 applications; they aren''t
    interchangeable, so you do need to use the correct one. The version to create
    GTK 3 applications is called ''glade''. And, just to be perverse, the version
    you need to create GTK 2 applications is called ''glade-3''. (Yes, that is counter-intuitive
    and annoying!)


    The first thing we need to do is install glade-3. At a terminal, type sudo apt-get
    install glade-3, and answer yes to any prompts. You should then have an entry
    labelled ''Glade'' in the Programming menu on your desktop. If you launch it,
    you''ll see a screen like the one shown below.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_134_0.png)'
  merge: -1
  img_proc: true
