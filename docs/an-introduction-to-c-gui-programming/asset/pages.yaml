  md: "# Chapter 24\n\n# Customising widgets\n\nChange the properties of widgets\n\
    alter how they look\n\nIn all the examples we've seen so far, we have used widgets\
    \ in their default state; we've just created the widget with the gtk_<widget name>_new\
    \ function call and used it. However, GTK does allow a degree of customisation\
    \ of widgets by setting the properties for each.\nAs an example, we are going\
    \ to look at some of the properties of the basic GtkButton widget. Try this example:\n\
    \n```\nvoid main (int argc, char *argv[]) {\n  gtk_init(&argc, &argv);\n\n  GtkWidget\
    \ *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n  GtkWidget *btn = gtk_button_new_with_label(\"\
    clicked\");\n  g_signal_connect(btn, \"clicked\", G_CALLBACK(end_program),\n \
    \ NULL);\n  g_signal_connect(win, \"delete_event\", G_CALLBACK(end_program),\n\
    \  NULL);\n\n  GtkWidget *btn2 = gtk_button_new_with_label(\"exit\");\n  g_object_set(S_OBJECT(btn2),\
    \ \"relief\", GTK_RELIEF_NONE, NULL);\n\n  GtkWidget *box = gtk_box_new(FALSE,\
    \ 5);\n  gtk_pack_start(GTK_BOX(box), btn2, TRUE, TRUE, 0);\n  gtk_pack_start(GTK_BOX(box),\
    \ btn, TRUE, TRUE, 0);\n  gtk_container_add(GTK_CONTAINER(win), box);\n  gtk_widget_show_all(win);\n\
    \n  gtk_main();\n}\n```\n\nThis is familiar code from previous examples, but the\
    \ highlighted line is new.\ng_object_set takes as arguments the name of a widget,\
    \ followed by a NULL terminator."
  merge: -1
  img_proc: true
- pgno: 131
  md: 'list of property names and property values. In this case, we are setting the
    relief property of the GtkButton btn2 to GTK_RELIEF_NONE.

    The ‘relief’ of a GtkButton controls how the border looks. The borders of some
    GTK widgets have a degree of shading applied around them to provide a 3D appearance
    - by default, a GtkButton has this shading applied, which makes the button appear
    to stand out slightly from the window background. By setting the relief to GTK_RELIEF_NONE,
    this 3D shading is removed – if you run the program above, you should be able
    to clearly see the difference between the two buttons on the window. (You can
    use the TAB key to move the dotted outline between the buttons to show the difference
    more clearly.)


    ![](img/6a7eee5b22417c3d49170130a20b16f2_131_0.png)


    +   - A GtkButton with the relief property set to GTK_RELIEF_NONE


    Here''s another example. Remove the setting of the relief property and change
