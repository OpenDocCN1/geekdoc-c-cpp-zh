- pgno: 146
  md: '# INTRODUCTION TO C AND C++ PROGRAMMING


    ```

    %u Unsigned decimal value / int

    %lu Unsigned decimal value / long int

    %o Octal value / int

    %lo Octal value / long int

    %x, %X Hexadecimal value / int

    %lx, %lX Hexadecimal value / long int

    %f Floating-point value / float

    %e Exponential value / float

    ```


    *x displays a value as a hexadecimal with lower-case letters through f; **X displays
    it with upper-case letters A through F.


    The width (or minimum number of characters printed) can be set by inserting a
    number between the % and the letter; this will pad a value shorter than with spaces
    at the start. To pad with spaces at the end, insert a - between the % and the
    number. To pad with leading zeroes, insert a Θ between the % and the number.


    For example, to print an integer variable with the value 42, using the format
    specifier `%5d` will print 42 with three spaces before it. The format specifier
    `-5d` will print 42 with three spaces after it. The format specifier `%05d` will
    print it as 00042.


    The number of decimal places shown for a floating-point or exponential value can
    be set by inserting a decimal point followed by a number between the % and the
    letter, this can be combined with a width by putting the width before the decimal
    point.


    For example, to print a floating-point variable with the value 76.54321, the format
    specifier `%.2f` will print it as 76.54. The format specifier `%0.2f` will print
    it as 00076.54 (Note that the decimal point takes up one character of the specified
    width)'
