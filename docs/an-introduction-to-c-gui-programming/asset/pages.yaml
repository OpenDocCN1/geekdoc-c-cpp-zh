  md: "# Chapter 4\n\n# More advanced\nflow control\n\nFor loops and case statements\
    \ - more advanced\nways of controlling the flow of a program\n\nThe if statement\
    \ and while loop described in the previous chapter are fairly simple control structures.\
    \ In this chapter, we're going to look at a few more complex structures that can\
    \ help to make your code shorter and reduce the amount of typing you need to do.\n\
    \nAlthough the while loop we saw in the previous article is very useful the for\
    \ loop tends to be favoured by many programmers, as it puts all the logic controlling\
    \ the loop in one place Here's an example:\n\n```\n#include <stdio.h>\n\nvoid\
    \ main (void)\n{\n    int a;\n\n    for (a = 0; a < 5; a++) {\n        printf(\"\
    a is equal to %d\\n\", a);\n    }\n    printf(\"a is equal to %d and I've finished\\\
    n\", a);\n}\n```\n\nThis isn't all that different from a while loop, but all of\
    \ the control for the loop lives in the round brackets after the for keyword This\
    \ contains three statements, separated by semicolons; in order, these are the\
    \ initial condition, the test, and the increment.\na = 0 is the initial condition,\
    \ the variable a is initialised to 0 at the start of the loop.\na < 5 is the test,\
    \ just like in a while loop. This is checked on each iteration of the loop, the\
    \ loop code is only executed if the test evaluates to true; as soon as the test\
    \ is false, execution continues after the curly bracket at the end of the loop\
    \ code."
  merge: -1
