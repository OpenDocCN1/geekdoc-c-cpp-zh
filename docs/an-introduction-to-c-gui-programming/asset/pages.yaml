  md: "# DON'T #INCLUDE C FILES\n\n#include will work on any file, it substitutes\
    \ the include line with the contents of the file. Occasionally I see this being\
    \ abused. some programmers bypass the use of header files by just including the\
    \ other C files themselves. While this does work, it's poor practice. don't be\
    \ tempted to try it!\n\n# #define\n\nAnother useful directive is #define, which\
    \ can be used to define constant values. Look at this example:\n\n```\n#include\
    \ <stdio.h>\n\n#define PI 3.14159\n\nvoid main (void) {\n    float rad = 3;\n\
    \    float circ = rad * 2 * PI;\n    float area = rad * rad * PI;\n    printf(\"\
    The circumference of a circle radius %f is %f\\n\", rad, circ);\n    printf(\"\
    The area of a circle radius %f is %f\\n\", rad, area);\n}\n```\n\nThe directive\
    \ #define is used to set the value of PI. The important thing to remember is that\
    \ PI is not a variable; it's text that will be substituted by the preprocessor.\
    \ The #define line tells the preprocessor to go through the file and replace every\
    \ instance of the text PI with the digits 314159 before passing it to the compiler.\
    \ So a line which does something like PI = 5; will cause an error; the compiler\
    \ will see the meaningless statement 3.14159 = 5;\nWhy is this useful? Why not\
    \ declare a float variable called PI and set it to 3.14159? A floating-point variable\
    \ requires allocating memory in which to store it, using #define saves that memory,\
    \ which is useful if memory is limited.\n\nYou can also #define functions:\n\n\
    ```\n#include <stdio.h>\n#define ADD(a,b) (a+b)\n```"
