  md: "a usability point of view, it's wise to stick to no more than one additional\
    \ level of submenu – having a menu create a submenu from some items is fine, but\
    \ if you are creating even more submenus from the submenus themselves, the users\
    \ may get confused!\n\n# Pop-up menus\n\nThe bar is the most common way of adding\
    \ a menu to an application, but it is also possible to use very similar code to\
    \ add pop-up menus that are produced when you click buttons, tree views, or various\
    \ other widgets.\n\nCreate the following handler, and connect it to the clicked\
    \ signal on a button.\n\n```\nvoid button_popup (GtkWidget *wid, gpointer ptr)\
    \ {\n  GtkWidget *f_menu = gtk_menu_new ()\\n  GtkWidget *quit_mi = gtk_menu_item_new_with_label\
    \ (\"Quit\");\n  gtk_menu_shell_append (GTK_MENU_SHELL (f_menu), quit_mi);\n \
    \ g_signal_connect (quit_mi, \"activate\", G_CALLBACK (end_program), NULL);\n\n\
    \  gtk_widget_show_all (f_menu);\n  gtk_menu_popup (GTK_MENU (f_menu), NULL, NULL,\
    \ NULL, NULL, 1);\n  gtk_get_current_event_time ());\n}\n```\n\nThis creates a\
    \ menu with the single item 'Quit', as before, but instead of putting it into\
    \ a menu bar, it uses the gtk_menu_popup function to display it at the mouse cursor\
    \ position. When you press the button to which this handler is connected, the\
    \ menu will be displayed over the button, and it can then be selected from there.\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_117_0.png)\n\n^ A pop-up menu, launched\
    \ from a button"
