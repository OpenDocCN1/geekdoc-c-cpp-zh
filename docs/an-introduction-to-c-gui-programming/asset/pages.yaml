  md: 'The gtk_menu_popup function is designed for use from very low-level system
    mouse events - when called from a button handler; most of the event information
    isn''t needed, which is why most of its arguments are set to NULL The only ones
    which matter are the first argument - the menu to popup, and the last two, which
    are the code for the button which was pressed (1 for the left mouse button), and
    the time at which the button was pressed (which is obtained from the gtk_get_current_event_time
    function).

    This example shows a popup being generated by a button press, but it can also
    be linked to mouse events on many other widgets.'
