    That line by line, the first line is one we''re already familiar with: we declare
    an integer

    variable a. But what''s this?


    ```

    int *ptr_to_a;

    ```


    This looks like it''s declaring another integer variable, doesn''t it? But look
    more carefully,

    an asterisk at the start of the variable name indicates that this is not declaring
    an integer

    variable, but a pointer to an integer variable.


    So we now have an integer called a, and we have a pointer to an integer variable,

    ptr_to_a But neither of them actually has a value in it yet; they are both uninitialised.

    It''s all very well calling the pointer ptr_to_a, but it has no idea what (or
    where) a is, so we''ll

    fix that with the next line.


    ```

    ptr_to_a = &a;

    ```


    This is the important bit in C: the symbol & before a variable name means address
    of the

    variable; so & means the address in memory of the variable a. And as we said above,

    pinter is the address of a variable. So this line initializes ptr_to_a to be the
    address of a,

    ptr_to_a is now a valid pointer to the variable a, so we can now use it.


    The next two lines are familiar: we set a to 5, and just to check that worked,
    we print its

    value. So let''s try doing the same thing, but with the pointer.


    ```

    *ptr_to_a = 6;

    ```


    That asterisk again, but used in a slightly different way from before. When declaring
    a

    variable, putting an asterisk before its name indicates that the variable is a
    pointer. But once

    t pointer exists, putting an asterisk in front of its name means the variable
    pointed to by

    this pointer; this is known as dereferencing pointer. So this line tells the compiler
    to set

    the variable pointed to by the pointer ptr_to_a to 6. We know that the variable
    pointed to by

    ptr_to_a is, we set up a couple of lines back, and so this line is just another
    way of

    setting a to 6; indeed, if we print the value of a, it has changed to 6.


    The next lines will hopefully help you get the relationship between pointers,
    variables, and

    addresses clear in your mind.'
