- pgno: 17
  md: "There are also modifiers which can be applied to variable types. Both char\
    \ and int can be used to store both positive and negative numbers, but by applying\
    \ the unsigned modifier when one is declared, they can be restricted to only store\
    \ positive values. So...\n\nchar a;\n\n..declares a variable which can hold values\
    \ from -128 to 127, while...\n\nunsigned char a;\n\n..declares a variable which\
    \ can hold values from 0 to 255.\n\nWhen doing arithmetic, it is important to\
    \ make sure that the answers to any calculation will fit into the variable. If,\
    \ say, you have a char containing the value 100, and you add 30 to it, you would\
    \ expect to end up with the result 130 – but as above, a char can only hold values\
    \ up to 127. So the value your char will actually end up containing is -126, because\
    \ values over 127 – the highest value a char can store – wrap around to the lowest\
    \ value (-128) and start counting up from there. This ‘overflow’ behaviour is\
    \ a common cause of bugs in C programs which do arithmetic.\n\n> REMEMBER PRECEDENCE\n\
    \ obeys the common rules for operator precedence - so a = a + 2 * 3 evaluates\n\
    the multiply first and then adds the result to a. You can use brackets to change\n\
    precedence - a = (a + 2) * 3 gives a=6.\n\nThat gives you some idea about how\
    \ C handles numbers, and how you can use it for arithmetic; in the next chapter,\
    \ we'll look at how to use the results of calculations to make decisions."
  merge: -1
  img_proc: true
