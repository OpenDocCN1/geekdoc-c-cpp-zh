- pgno: 35
  md: '# ARGUMENTS


    A function can have any number of arguments, from zero up to hundreds. If you
    don''t need any arguments, you list the arguments as (void) in the function definition
    just like in the main function); when you call the function, just put a pair of
    empty round brackets () after the function name


    # What’s in a function?


    Let’s look at the sum function.


    ```

    int sum (int a, int b)

    ```


    The definition of a function has three parts. The first part is the type of the
    value returned by the function: in this case, an int. The second part is the name
    of the function: in this case, sum. Finally, within round brackets are the arguments
    to the function, separated by commas, and each given with its type: in this case,
    two integer arguments, a and b.

    The rest of the function is between the curly brackets.


    ```

    res;

    ```


    This declares a local variable for the function, an integer res. This is a variable
    which can only be used locally, within the function itself. Variables declared
    within a function can only be used within function if you try to read or write
    res within the main function, you''ll get an error. (You could declare another
    int res within the main function, but this would be a different variable called
    res from the one within the sum function, and would get very confusing, it’s not
    recommended!)


    ```

    res = a + b;

    ```


    This should be obvious! Note that a and b are the two defined arguments of the
    function. When a function is called, a local copy of the arguments is made and
    used within the function. If you change the values of a or b within the function
    (which is a perfectly valid thing to do), that only affects the values of a and
    b within this function, it doesn’t change the values that the arguments had in
    the function from which it was called.


    ```

    return res;

    ```


    Finally, we need to return the result. The function was defined to return an integer,
    so it must call the return statement with an integer value to be returned to the
    calling function. A function doesn’t have to return a value if the return type
    is set to void, it returns nothing'
