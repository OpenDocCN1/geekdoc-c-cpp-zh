  md: '# Chapter 7


    # Arrays and strings


    How to handle arrays (lists of values) and strings

    lists of letters) in C


    The variables we have looked at so far are all single numeric values. In this
    chapter, we''re going to look at how C handles lists of values, and that leads
    to using lists of letters to store and manipulate text strings.


    An array is a single variable which stores multiple different values of the same
    type; the individual values are accessed by indexing the array. An array can have
    one or more dimensions, a one-dimensional array is a single list of values, while
    a two-dimensional array is a list of lists of values, and so on.


    An array is declared in C by putting the size of each dimension in square brackets
    after the variable name. So.


    ```

    int a[10];

    ```


    ...is a list of ten integers, while


    ```

    int b[5][6];

    ```


    ...is a list of five lists, each of which contains six integers.

    When accessing the elements inside an array, the array index - the number inside
    the bracket - starts at 0. The integers contained within an array above are referred
    to as a[0], a[1], a[2] and so on up to a[9]. The compiler will quite happily allow,
    you to read or write a[10], a[11] or indeed a[any number you like], but these
    are all outside the memory which was allocated when the array was declared, so
    writing to them is a really bad idea!


    # Arrays and pointers


    This brings us to the relationship between pointers and arrays. The name of an
    array is effectively a pointer to the first element of the array. Remember that
    a pointer is the address of a variable in memory? Well, an array is a contiguous
    block of memory which contains all the elements of the array in order, so you
    can use a pointer to access it. (In fact, even if you use values in square brackets
    to access it, the compiler treats those as a pointer anyway) Here''s an example:'
