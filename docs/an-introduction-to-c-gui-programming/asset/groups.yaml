  mdcn: "\n\n# 第 25 章\n\n## Glade\n\n使用此布局编辑器更方便地为应用程序创建窗口布局\n\n如前面的章节所示，使用 GTK 创建组件比从头开始向屏幕缓冲区写入像素来编写要简单得多。尽管如此，即使对于一个相当简单的窗口布局，你仍然需要编写大量的代码，而且你必须非常仔细地考虑你编写的代码，以确保窗口的外观符合你的预期。此外，在运行应用程序之前无法实际看到窗口的样式，这也不够理想。\n\
    \n幸运的是，有一种方法可以在不编写所有代码的情况下处理窗口布局，那就是使用布局编辑器。GTK 允许将窗口上组件的布局定义在一个 XML 文件中，该文件在应用程序运行时会被加载并绘制在屏幕上——虽然你仍然需要将任何组件的行为与代码关联，但组件的外观可以提前确定。布局编辑器是创建此类\
    \ XML 文件的有用工具。\n\nGTK 最广泛使用的布局编辑器是一个名为 Glade 的工具。Glade 有两个版本，一个一个用于 GTK 2，另一个用于\
    \ GTK 3 应用程序；它们不能互换，因此你确实需要使用正确的版本。创建 GTK 3 应用程序的版本被称为 'glade'。而且，为了增加难度，你创建 GTK\
    \ 2 应用程序所需的版本被称为 'glade-3'。（是的，这非常违反直觉且令人恼火！）我们要做的第一件事是安装 glade-3。在终端中输入 `sudo\
    \ apt-get install glade-3`，并对任何提示回答 yes。然后，你应该会在桌面的程序的编程菜单中看到一个名为“Glade”的选项。如果你启动它，将看到一个如下所示的屏幕。\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_134_0.png)\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_135_0.png)\n\
    \n# Glade 布局编辑器\n\n这是 Glade 中的基础设计界面。左侧是所有可用组件的调色板。中间是你实际设计窗口的区域，右侧是一个允许你设置单个组件属性的区域。\n\
    \n# 使用 Glade 创建布局文件\n\n我们将为应用程序创建一个简单的窗口，要做的第一件事是添加一个顶层窗口。在标记为“Toplevels”（顶层窗口）的调色板部分，左上角的项目是\
    \ GtkWindow——如果你用鼠标悬停在上面，会弹出一个带有“Window”标签的工具提示以确认这一点。只需点击此图标即可在中间的设计区域添加一个空窗口：\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_136_0.png)\n\n一个空窗口（注：此处原文为“An empty\
    \ window”，根据要求应保留格式并翻译，此处译为标题或描述）\n\n接下来，让我们添加一个 VBox 以便我们在其中放置一些组件。组件调色板有一个标记为“Containers”（容器）的部分，其中前两个项目是\
    \ HBox 和 VBox——点击 VBox，然后将光标移动到空窗口内并点击。会弹出一个对话框，询问你想在 VBox 中放置多少个项目——设置为 2，并点击“Create”（创建）：\n\
    \n# 添加垂直框\n\n现在你有了一个中间有一条线的空窗口，显示了 VBox。我们将在顶部添加一个标签，在底部添加一个按钮。在调色板的“Control and\
    \ Display”（控制与显示）部分找到这些内容——首先在调色板中点击每个项目，然后点击设计区域中相应的 VBox 以添加它们。\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_137_0.png)\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_138_0.png)\n\n- 添加了标签和按钮后：\n\n如果你查看右侧列的顶部，你会看到显示的组件层级结构——一个\
    \ GtkWindow，包含一个 GtkBox，GtkBox 包含一个 GtkLabel 和一个 GtkButton。如果你点击层级结构中的一个组件，右侧列标签区域显示的选项将是该组件的选项。\n\
    \n点击 GtkLabel 并浏览“General”（常规）选项卡上的选项，你会找到一个标记为“Edit label appearance”（编辑标签外观）的部分，包括“Label”（标签）项目——使用它来设置标签中的任意文本。\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_139_0.png)\n\n组件属性编辑器\n\n点击 GtkButton，并找到它的\
    \ Label 部分——它位于“Label with optional image”（带有可选图像的标签）下方——在右侧列底部将按钮的标签更改为“Quit”（退出）——在此处时，值得研究所有选项卡上的选项，但特别感兴趣的是“Packing”（填充）选项卡上的选项，这些允许你扩展在添加组件到框时可用的\
    \ expand（扩展）、fill（填充）和 padding（内边距）选项。如果你尝试它们，你就能对窗口布局的控制程度有一个很好的感觉，特别是当 Glade\
    \ 允许你组合多个框时。\n\n关于右侧列需要注意的重要点是 Glade 为每个组件分配名称——这可以在顶部的层级列表中看到，在“General”选项卡的最后一项中，Glade\
    \ 以组件类型加上数字进行命名，但如果你愿意，可以更改这些。但有一条关键规则——布局文件中的每个组件必须具有唯一的名称。如果两个组件具有相同的名称，则布局文件是无效且无法正确加载。\n\
    \n# C 语言和编程简介\n\n你的按钮和标签组件名称应该是 'button1' 和 'label1$，你的窗口应该是 Window1——记住这些名称；因为它们在将代码与布局文件关联时非常重要。现在，将你的布局保存为\
    \ mylayout.glade。\n\n```c\n#include <gtk/gtk.h>\n\nvoid on_destroy (GtkWidget\
    \ *wid, gpointer ptr)\n{\n    gtk_main_quit(NULL);\n}\n\nvoid main (int argc,\
    \ char *argv[])\n{\n    gtk_init(&argc, &argv);\n\n    GBuilder *builder = gtk_builder_new();\n\
    \    gtk_builder_load_from_file(builder, \"mylayout.glade\", NULL);\n\n    GtkWidget\
    \ *win = (GtkWidget*)gtk_builder_get_object(builder, \"window\");\n    GtkWidget\
    \ *btn = (GtkWidget*)gtk_builder_get_object(builder, \"button\");\n    g_signal_connect(btn,\
    \ \"clicked\", G_CALLBACK(on_destroy), NULL);\n\n    gtk_widget_show_all(win);\n\
    \    gtk_main();\n}\n```\n\n"
