  - '[PAGE 91]


    The third argument to gtk_box_pack_start is called expand. If set to TRUE, then
    when a window is enlarged, the amount of space allocated for this widget is enlarged
    in proportion If set to FALSE, the amount of space allocated for this widget is
    never more than the minimum it requires.


    The fourth argument is called fill. This has no effect if expand is set to FALSE,
    but if expand is set to TRUE, it controls whether or not it is the space allocated
    to the widget or the widget itself grows. If expand is TRUE and fill is FALSE,
    the widget itself stays the same size, if both expand and fill are TRUE, the widget
    itself grows to fill the increased space.


    That is somewhat hard to follow when written down, but a few examples will help
    to get it straight Change the GtkHB back to a GtkVBox in the example above, and
    then both expand and fill for all three gtk_box_pack_start calls in the example
    above to FALSE. If you resize the window, the label and two buttons will stay
    the same height at the top of the window.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_91_0.png)


    The layout with expand and fill both set to FALSE for all widgets


    Now try the same thing, but change the expand parameter in the gtk_box_pack_start
    for btn to TRUE:'
  - '[PAGE 92]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_92_0.png)


    The layout with expand set to TRUE and fill set to FALSE for the ''Close window''
    button


    The button now moves down the window to fit in the middle of the increased space,
    the extra space has been allocated to the button, but the button itself is the
    same size.


    Finally, try changing both expand and fill to TRUE for btn to see a result like
    the image overleaf.'
  - '[PAGE 93]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_93_0.png)


    The layout with both expand and fill set to TRUE for the ''Close window'' button


    Enlarging the window now causes the whole button to fill the extra space.

    We can see that these parameters only affect the vertical size of the widgets;
    this is because they are used inside a GtkVBox. If we want to control the horizontal
    size of the widgets as well, we need to create a GtkBox which contains a set of
    GtkBoxes, which are then used to contain the widgets themselves.

    The final argument in the call to `gtk_box_pack_start` is called `padding` – this
    is the amount of free space (in pixels) which is inserted at either end of this
    widget, this is in addition to the `spacing` which was requested between all widgets
    in the `gtk_box_new_call

    By careful tweaking of `expand`, `fill`, and `padding` parameters, you can create
    a window which displays all its widgets tidily and resizes exactly as you expect.


