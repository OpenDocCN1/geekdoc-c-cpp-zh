    exit\");\ng_object_set(G_OBJECT(btn2), \"relief\", GTK_RELIEF_NONE, NULL);\n```\n\
    \n在这种情况下，我们正在设置 `underline`（下划线）属性，它应该像这样：\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_131_1.png)\n\
    \n- 设置了 underline 的 GtkButton\n"
