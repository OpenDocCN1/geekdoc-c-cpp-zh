    %d %d %d\\n\", col.red, col.green, col.blue);\n}\n```\n\n```c\nvoid main (int\
    \ argc, char *argv[])\n{\n  gtk_init(&argc, argv);\n\n  GtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
