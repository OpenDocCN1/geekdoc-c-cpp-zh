  - '[PAGE 74]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_74_0.png)


    It has grown beyond that into a general user interface toolkit, and is now one
    of the most widely used user interface libraries on the Linux desktop


    The fundamental building blocks of GTK projects are called widgets. Everything
    you see on the screen – a window, a button, a label – is a widget. The GTK library
    does all the work required in creating widgets – all you need to do is tell it
    what widgets you want, whereabouts you want to put them, and what you want them
    to do, and GTK will manage everything else for you.


    To give you an idea of what ‘manage everything else’ means, imagine the situation
    described abovewhere you are manually creating a window by drawing pixels by writing
    data to the screen buffer. If the user clicks on the window title bar by drawing
    and drags it to another place on the screen, you have to detect that the mouse
    has been clicked, you have to track that it is being moved, and you have to redraw
    the window at each point as it moves, restoring what was underneath it in the
    areas from where it has moved. Just dragging a window would be hundreds of lines
    of code – but with GTK, you create a ‘window’ widget (with a single line of code)
    and all of that is care of you.


    Libraries like GTK therefore make the creation of rich graphical user interfaces
    relatively easy, and you may be surprised by just how little code you need to
    write to get something working.'
  - '[PAGE 75]


    # GTK 2 and GTK 3


    One thing worth mentioning at this point is that there are two versions of GTK
    in use. The current version is GTK 3, and this is still under active development
    – it changes quite a bit between releases.


    For this reason, many people prefer to use the older version, GTK 2. This offers
    most of the functionality, but it is stable code which does not change very much
    any more. Some say that it is always better to use the latest and greatest version
    of anything, but more cautious engineers (like your author.. ) tend to prefer
    the older version that has had a lot more telling and with which people have been
    fiddling about! In terms of the examples we are looking in, here, there are many
    significant differences between the two, but just to be clear, the examples in
    this book will use GTK 2.


    # A note on theming


    One of the powerful features of GTK is theming. The appearance of every widget
    in GTK can be customised in pretty much every detail, from the colour of the text
    to the shape of the corners on a button. This customisation is completely separate
    from the actual coding of a GTK application, instead, the appearance of widgets
    is controlled by the current theme which is in use on the system on which the
    GTK applications are running.


    Creating a theme is beyond the scope of this book – it''s quite a complicated
    and fiddly procedure. All the example screenshots in this book were taken from
    a Raspberry Pi Desktop environment, which uses a custom theme called Pix. If you
    are working with GTK on a different computer with a different theme your widgets
    may look slightly different from those pictured, but the code you write will be
    the same.'
  - "[PAGE 76]\n\n# Chapter 14\n\n# Your first GTK program\n\nStart coding in C with\
    \ the GTK library and create your first simple GUI application\n\nLet's create\
    \ a simple GTK program. Open your favourite text editor, and write the following.\n\
    \n```\n#include <gtk/gtk.h>\n\nint main (int argc, char *argv[]) {\n    gtk_init\
    \ (&argc, &argv);\n    GtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    \    gtk_widget_show(win);\n    gtk_main();\n    return 0;\n}\n```\n\nI told you\
    \ you didn't need much code! Let's look at that line-by-line before we try to\
    \ run it\n\n```\n#include <gtk/gtk.h>\n```\n\nThis is an instruction to the preprocessor\
    \ to tell it that we are writing a GTK program, and to load the GTK header files.\
    \ Without this, the compiler won't recognise any of the GTK library functions\
    \ that we are going to use.\n\n```\nint main (int argc, char *argv[])\n```\n\n\
    This is the standard starting point of a C program - a main function with some\
    \ arguments and a return value.\n\n```\ngtk_init (&argc, &argv);\n```"
  - '[PAGE 77]


    This is our first piece of GTK code. You need to call gtk_init at the start of
    every GTK program - this initialises all the internal variables used by the GTK
    library and sets it up to use. (Note that any command-line arguments supplied
    to the program are passed on to the GTK library via the arguments to this function.)


    ```

    GtkWidget *win = gtk_window new (GTK_WINDOW_TOPLEVEL);

    ```


    This creates a widget of type GtkWindow. For every type of widget in GTK, there
    is a _new function which creates an instance of that widget and returns a pointer
    to it.


    ```

    gtk_widget_show (win);

    ```


    This tells GTK to show the widget we have just created. The previous line created
    the widget in a hidden state; widgets can only be seen if they are unveiled with
    a _show call like this.


    ```

    gtk_main ();

    ```


    The gtk_main call runs the main loop of GTK; this effectively hands control of
    the program to GTK itself, which processes any user events like button pushes
    to control the user interface you have created.


    ```

    return 0;

    ```


    Formally, this is a C program with the main function returning an integer value,
    we need to return a value. However, this is largely pointless in a GUI program
    where the command line, and hence any return value, is usually never seen anyway;
    it''s included for completeness, but to save space, it won''t be in any other
    examples in this book.


    That''s all there is to do it - that''s the simplest GTK program which will do
    something sensible Type it in using your favourite editor and save it as gtktest.c
    Now we need to build and run it..


    # Building a GTK program


    If we''re writing a standard command-line C program, we can just use the gcc compiler
    to build our source file - gcc gtktest.c would produce an executable file. However,
    things are not quite simple if we are using an external library like GTK.


    First need to make sure that the relevant GTK libraries are installed. To do this,
    type sudo apt-get install libgtk2.0-dev into a terminal window and answer yes
    to any prompts - this installs the developer libraries for GTK 2.'
  - '[PAGE 78]


    # AN INTRODUCTION TO C PROGRAMMING


    Now we need to tell the compiler where to find the GTK header files, and also
    we need to tell the linker that we want the program linked with the GTK library
    files, or all the ''GTK-ness'' we want to use will be unavailable


    There is a utility called pkg-config that helps us here pkg config is a tool that
    generates the arguments required by gcc in order to use additional libraries.
    By typing `pkg-config --cflags --libs gtk+-2.0` at the command line and looking
    at the output You''ll see a list of strings - those which start -I/ are the directories
    where the GTK include files are stored, and those which start -l are the names
    of the GTK library files.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_78_0.png)


    All of these need to be added to the gcc command line in order to build our GTK
    program, so the pkg-config command is enclosed within back-ticks (``), like so


    ```

    gcc pkg-config --cflags --libs gtk+-2.0 gtktest -o gtktest

    ```


    If you run this, you should end up with an executable file called gtktest Run
    this by typing


    ```

    ./gtktest

    ```


    and see what happens.'
  - '[PAGE 79]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_79_0.png)


    Your first GTK window


    You should see a smallish grey square window open somewhere on your desktop; it
    won''t do much, but you can drag it around and minimise and maximise it. If you
    press the X in the top-right corner, the window closes, but if you look in the
    terminal window from which you ran gtktest, you''ll see the program is still running.
    This is because closing a window doesn''t terminate the gtk_main function, which
    will carry on running until you hit CTRL+C in the terminal window.


    Congratulations! You''ve just created your first GUI application with GTK. In
    the next chapter, we''ll put something onto that empty window.'
