    # Boxes


    A toolkit that only allowed you to put one thing at a time on a window would be
    a bit limited! So while a window can only contain one widget, GTK has several
    widgets which can be used to hold sets of other widgets. The two most useful ones
    are boxes and tables – we''ll stick to boxes for now, as they are easier to use


    There are two types of box widget, which are called GtkBox and GtkVBox, these
    are short for ''horizontal box'' and ''vertical box'', depending on how the widgets
    you put into the box are to arranged. A box widget can hold an unlimited number
    of other widgets, but appears to its parent as a single widget, so can be used
    to put multiple widgets into a window.


