- raw:
  - '[PAGE 11]


    The word void is called a type specifier, void is a special type which means ''no
    value required''. We''ll look at more types in the next chapter.

    This line defines the main function for this program; it states that the main
    function takes no arguments, and returns no value.

    The code which makes up the function itself is enclosed between the two curly
    brackets { that follow the function definition.


    /* A print statement */


    First, we have a comment telling us what''s going on. Comments in C start with
    the symbol /*, and end with */ - anything between those two symbols is ignored
    by the compiler.

    The code itself is just one line:


    ```

    printf("Hello world!\n");

    ```


    This is a call to the printf (''print formatted'') function from stdio library.
    In this case, it takes a single argument, which is a text string enclosed within
    double quotes. As mentioned above, function arguments are enclosed in round brackets.

    Note that the line ends with a semicolon. All statements in C must finish with
