    # Chapter 13

    Introduction to GTK


    Now you have a grounding in C programming, you are ready to start creating GTK


    So far in this book, we''ve learnt the basics of the C language, and seen how
    to use it to write text-only programs you run at the command line. Looking at
    the keywords and library functions we''ve seen so far, it isn''t obvious how you
    can create everything required for a full graphical user interface - desktop,
    windows, icons, mouse pointer, and so on - with them.


    It is entirely possible to do so in C, but to be honest, it would be incredibly
    long-winded and time-consuming. You need to find the screen buffer in memory -
    the part of memory that represents the pixels which make up the desktop on the
    screen - and then write new pixels for each and; you have to write even more pixels
    to show where the mouse cursor is; you then have to monitor when the user moves
    the mouse, redraw the pointer each time, and when the user clicks the mouse button
    you have to work out where the screen is and whether it is on top of a window,
    and so on...


    Fair enough, that isn''t how it''s usually done in practice - life is too short!
    Most of this functionality has already been written for you. Windows systems like
    X provide most of the underlying features, and then user interface libraries provide
    a convenient means of creating GUI applications which work with the likes of X;
    all you need to do is choose a suitable user interface library, and use the predefined
    functions in it in your C program.


    There are lots of user interface libraries available, some are designed with a
    particular desktop environment like Windows or macOS, while others are cross-platform
    and can work in a choice of desktop environments. The one which is most used in
    the Raspberry Pi Desktop included with Raspbian is called GTK, and that''s the
    one we


    # What is GTK?


    GTK (formerly known as GT+) is short for "GIMP Toolkit" Its website (gtk.org)
    describes it as a "multi-platform toolkit for creating graphical user interfaces",
    and it was originally written to provide the user interface elements used to create
    the GIMP picture-editing program.'
