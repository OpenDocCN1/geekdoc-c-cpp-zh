    \ `break` 来退出循环并在循环后立即恢复执行。\n\n在所有循环中，都可以使用关键字 `continue` 来跳过循环体中剩余的代码，并在下一次循环迭代测试处恢复执行。\n\
    \n## 变量类型\n\n| 名称 | 描述 | 大小 |\n|---|---|--|\n| char | 单个字母数字字符 | 1 |\n| signed\
    \ char | 有符号 8 位整数 (-128 - 127) | 1 |\n| unsigned char | 无符号 8 位整数 (0 - 255) |\
    \ 1 |\n| short, signed short | 有符号 16 位整数 (-32768 - 32767) | 2 |\n| unsigned short\
    \ | 无符号 16 位整数 (0 - 65535) | 2 |\n| int, signed int | 有符号 32 位整数 (-2147483648\
    \ - 2147483647) | 4 |\n| unsigned int | 无符号 32 位整数 (0 - 4294967295) | 4 |\n| long,\
    \ signed long | 有符号 32 位整数 (-2147483648 - 2147483647) | 4 |\n| unsigned long |\
    \ 无符号 32 位整数 (0 - 4294967295) | 4 |\n| float | 浮点值 (+/- 3.402823 x 10^38) | 4\
    \ |\n| double | 双精度浮点值 (+/- 10^308) | 8 |\n\n取决于平台，`int` 可以是 `short`（16位）或 `long`（32位）。在\
    \ Raspian 上，如上表所示，`int` 是 `long`（32位）整数值。\n\n## 格式说明符\n\n| 说明符 | 格式 / 类型 |\n|---|--|\n\
    | %c | 字母数字字符 / char |\n| %d | 有符号十进制值 / int |\n| %ld | 有符号十进制值 / long int |\n\
    \n## C 和 C++ 编程简介\n\n```\n%u 无符号十进制值 / int\n%lu 无符号十进制值 / long int\n%o 进制值 / int\n\
    %lo 进制值 / long int\n%x, %X 十六进制值 / int\n%lx, %lX 十六进制值 / long int\n%f 浮点值 / float\n\
    %e 指数值 / float\n```\n\n* %x 以十六进制形式显示值，使用小写字母 a 到 f；%X 使用大写字母 A 到 F 显示。\n\n宽度（或打印的最小字符数）可以通过在\
    \ `%` 和字母之间插入一个数字来设置；这将短于宽度的值在开头填充空格。要在末尾填充空格，请在 `%` 和数字之间插入一个 `-`。要在开头填充导零，请在\
    \ `%` 和数字之间插入一个 `0`。\n\n例如，要打印一个值为 42 的整数变量，使用格式说明符 `%5d` 将打印 42 并在其前面留三个空格。格式说明符\
    \ `-5d` 将打印 42 并在其后面留三个空格。格式说明符 `%05d` 将其打印为 00042。\n\n浮点值或指数值显示的十进制位数可以通过在 `%`\
    \ 和字母之间插入一个小数点后跟一个数字来设置，这可以通过在小数点前放置宽度来与宽度结合。\n\n例如，要打印一个值为 76.54321 的浮点变量，格式说明符\
    \ `%.2f` 将其打印为 76.54。格式说明符 `%0.2f` 将其打印为 00076.54（注意小数点占了指定宽度中的一个字符）。\n\n## 运算符\n\
    \n下表中的运算符产生的结果可以赋值给另一个变量，例如 `c = a + b`，但不会影响 `a` 或 `b` 的值。\n\n| 符号 | 功能 |\n|---|---|\n\
