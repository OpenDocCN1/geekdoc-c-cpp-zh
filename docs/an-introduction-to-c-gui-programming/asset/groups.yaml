    \ (table), btn, 0, 2, 1, 2);\n    gtk_container_add (GTK_CONTAINER (win), table);\n\
    \    gtk_widget_show_all (win);\n    gtk_main ();\n}\n```\n\nWe create a new GtkTable\
    \ with:\n```\nGtkWidget *tbl = gtk_table_new (2, 2, TRUE);\n```\n\nThe arguments\
    \ to the gtk_table_new function are the number of rows and the number of columns.\
    \ To insert a widget into the table, we use:\n\n```\ngtk_table_attach_defaults\
    \ (GTK_TABLE (tbl), lbl, 0, 1, 0, 1);\n```\n\nWe pass as arguments the table and\
    \ the widget we are putting into it. The following numbers are the coordinates\
    \ where the widget is attached to the table - in order they are the position of\
    \ the left and right edges, and then the top and bottom edges. This positions\
    \ the widget in the first column - between x 0 and 1 - and in the first row -\
    \ between y 0 and 1. Note that you can spread a widget across multiple rows or\
    \ columns, as in how btn is placed:\n\n```\ngtk_table_attach_defaults (GTK_TABLE\
    \ (tbl), btn, 0, 2, 1, 2);\n```\n\nIn this case, the widget spans the first and\
    \ second columns because it is attached to 0 at the left and 2 at the right. For\
    \ completeness, note that gtk_table_attach_defaults is a shortened version of\
    \ the function gtk_table_attach which has several other options. These other options\
    \ include the ability to expand, fill and set padding for each widget as in the\
    \ gtk_box_pack functions described in the previous chapter. But these functions\
    \ can get typed out - using gtk_table_attach_defaults sets padding to 0 and expand\
    \ to TRUE for each widget. If you build and run this code, you will end up with\
    \ a window that looks like the one below. Note that the 'Close window' button\
    \ spans both columns of the table as described above.\n\nimg/6a7eee5b22417c3d49170130a20b16f2_95_0.png)\n\
    \nA GtkTable allows widgets to be aligned in rows and columns to enable users\
    \ to enter text and select options using check and radio buttons. We've seen how\
    \ we can display text on a window using a label, but what if we want to read some\
    \ text that the user has typed? GTK provides the GtkEntry widget for this.\n\n\
    # Text entry\n\nModify the example code above to add a new cell to the table with\
    \ the GtkEntry widget, like so:\n\n```c\n#include <gtk/gtk.h>\n\nGtkWidget *txt;\n\
    \nvoid end_program(GtkWidget *wid, gpointer ptr)\n{\n    gtk_main_quit();\n}\n\
    \nvoid edit(GtkWidget *wid, gpointer ptr)\n{\n    const char *input = gtk_entry_get_text(GTK_ENTRY(txt));\n\
    \    gtk_label_set_text(GTK_LABEL(ptr), input);\n}\n\nvoid main(int argc, char\
    \ *argv[])\n{\n    gtk_init(&argc, &argv);\n    GtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    \    GtkWidget *btn = gtk_button_new_with_label(\"edit\");\n    gtk_signal_connect(btn,\
    \ \"clicked\", G_CALLBACK(end_program), NULL);\n    gtk_signal_connect(win, \"\
    delete_event\", G_CALLBACK(end_program), NULL);\n}\n```\n\n```c\nGtkWidget *lbl\
    \ = gtk_label_new (\"My label\");\n```\n\n```c\nGtkWidget *btn2 = gtk_button_new_with_label\
    \ ( ... );\ng_signal_connect (btn2, G_CALLBACK (copy_text), lbl);\n```\n\n```c\n\
    txt = gtk_entry_new();\n```\n\n```c\nGtkWidget *tab = gtk_table_new (2, 2, TRUE);\n\
    gtk_table_attach_defaults (GTK_TABLE (tab), lbl, 0, 0, 1, 1);\ngtk_table_attach_defaults\
    \ (GTK_TABLE (tab), btn2, 1, 0, 0, 1);\ngtk_table_attach_defaults (GTK_TABLE (tab),\
    \ win, 0, 1, 1, 2);\ngtk_table_attach_defaults (GTK_TABLE (tab), txt, 1, 2, 1,\
    \ 2);\ngtk_container_add (GTK_CONTAINER (win), tab);\ngtk_widget_show_all (win);\n\
    int main() {\n}\n```\n\nIn this example, we declare a pointer to the GtkEntry\
    \ widget txt as a global variable. This is because we need to access it from the\
    \ button handler, which in this case the handler needs access to the Gtklabel\
    \ widget. We previously used the general-purpose pointer in the g_signal_connect\
    \ function to pass widget information to a handler, but for two separate widgets\
    \ we've only got one pointer (There are ways of using a single pointer for this,\
    \ but using a global variable is easier to understand).\n\nWe've added a new function,\
    \ copy_text which uses the function gtk_entry_get_text to get a pointer to the\
    \ text buffer by the GtkEntry, which stores whatever the user has typed into the\
    \ entry box. Note that this buffer of chars is declared with the modifier const\
    \ - this indicates a variable that cannot be changed by the programmer. We then\
    \ pass this buffer to gtk_label_set_text, which copies the contents of the GtkEntry\
    \ to the GtkLabel.\n\nFinally, we created the GtkEntry itself with gtk_entry_new,\
    \ and added it to the table (Note we've also moved the attachment points of btn\
    \ so that it only takes one cell of the table rather than two, so as to give enough\
    \ space for the GtkEntry).\n\nBuild the code and run it; try typing something\
    \ into the entry box and pressing the 'Copy' button to see what happens.\n\nimg/6a7eee5b22417c3d49170130a20b16f2_97_0.png)\n\
    \nA GtkEntry added to the bottom right of the table\n"
  mdcn: "\n`gtk_box_pack_start` 的第三个参数称为 `expand`。如果设置为 TRUE，那么当窗口增大时，分配给此小部件的空间也会按比例增大。如果设置为\
    \ FALSE，分配给此小部件的空间永远不会超过所需的最小空间。\n\n第四个参数称为 `fill`。如果 `expand` 设置为 FALSE，则它没有作用；但如果\
    \ `expand` 设置为 TRUE，它将控制是分配给小部件的空间还是小部件本身增长。如果 `expand` 为 TRUE 且 `fill` 为 FALSE，小部件本身的大小保持不变；如果\
    \ `expand` 和 `fill` 均为 TRUE，小部件本身将增长以填满增加的空间。\n\n写下来这些可能很难理解，但几个例子将有助于理清思路。在上面的示例中，将\
    \ `GtkHB` 改回 `GtkVBox`，然后将示例中三个 `gtk_box_pack_start` 调用的 `expand` 和 `fill` 都设置为\
    \ FALSE。如果你调整窗口大小，标签和两个按钮将保持在窗口顶部相同的高度。\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_91_0.png)\n\
    \n所有小部件的 expand 和 fill 均设置为 FALSE 的布局\n\n现在尝试相同的操作，但将 `btn` 的 `gtk_box_pack_start`\
    \ 中的 `expand` 参数设置为 TRUE：\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_92_0.png)\n\
    \n“关闭窗口”按钮 expand 设置为 TRUE 且 fill 设置为 FALSE 的布局\n\n按钮现在向下移动以适应增加空间的中间部分，额外空间已分配给按钮，但按钮本身的大小保持不变。\n\
    \n最后，尝试将 `btn` 的 `expand` 和 `fill` 都设置为 TRUE，查看与上方图片类似的结果。\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_93_0.png)\n\
    \n“关闭窗口”按钮 expand 和 fill 均设置为 TRUE 的布局\n\n现在增大窗口会导致整个按钮填满额外空间。\n\n我们可以看到，这些参数只影响小部件的垂直尺寸；这是因为它们被使用在\
    \ `GtkVBox` 中。如果我们也想控制小部件的水平尺寸，我们需要创建一个包含一组 `GtkBoxes` 的 `GtkBox`，然后用这些容器来包含小部件本身。\n\
    \n`gtk_box_pack_start` 调用中的最后一个参数称为 `padding` —— 这是在小部件两端插入的自由空间（以像素为单位），这是在 `gtk_box_new_call`\
    \ 中请求的所有小部件之间的 `spacing` 之外的。\n\n通过仔细调整 `expand`、`fill` 和 `padding` 参数，你可以创建一个整齐显示所有小部件并完全按照你的预期调整大小的窗口。\n\
    \n# 表格\n\n你可能好奇如何在一个每两行的窗口中放置四个项目。嗯，将一个 `GtkHBox` 作为 `GtkVBox` 内部的项目之一是完全可以的，反之亦然。将一个\
    \ `GtkHBox` 作为 `GtkHBox` 内部的项目也是可以的（但通常没什么意义）。通过使用嵌套 `GtkHBoxes` 和 `GtkVBoxes`\
    \ 的组合，你可以按照想要的方式布局窗口中的所有小部件。\n\n嵌套 `GtkBoxes` 和 `GtkVBoxes` 在两个维度上布局小部件的效果非常好，并且实际上能让你对它们的外观拥有最好的控制。其实有一种更简单的替代方案：`GtkTable`\
    \ 小部件。\n\n`GtkTable` 是一个二维框，在创建时定义为具有特定数量的行和列。小部件可以位于各种行列坐标。这不如使用嵌套的 `GtkBoxes`\
    \ 和 `GtkVBoxes` 灵活，因为每个小部件必须在行和列上对齐——这意味着任何一行的高度至少与该行中最高的小部件一样，任何一列的宽度至少与该列中最宽的小部件一样，这可能导致大量的空间浪费。但很多时候，这种简单的布局就足够了，`Table`\
    \ 的工作得良好。\n\n如果我们使用 `GtkTable` 来定位标签和按钮，我们的示例将更改如下：\n\n```\nvoid main (int argc,\
    \ char *argv[])\n{\n    gtk_init(&argc, &argv);\n\n    GtkWidget *win = gtk_window\
    \ (GTK_WINDOW_TOPLEVEL);\n    GtkWidget *btn = gtk_button_with_label (\"Click\
    \ me\");\n    g_signal_connect(btn, G_CALLBACK (end_program), NULL);\n    g_signal_connect(win,\
    \ G_CALLBACK (end_program), NULL);\n\n    GtkWidget *lbl = gtk_label_new (\"My\
    \ label\");\n\n    GtkWidget *btn2 = gtk_button_with_label (\"Button 2\");\n \
    \   g_signal_connect(btn2, G_CALLBACK (count_button), lbl);\n\n    GtkWidget *table\
    \ = gtk_table_new (2, 2, TRUE);\n    gtk_table_attach_defaults (GTK_TABLE (table),\
    \ lbl, 0, 1, 0, 1);\n    gtk_table_attach_defaults (GTK_TABLE (table), btn2, 1,\
    \ 2, 0, 1);\n    gtk_table_attach_defaults (GTK_TABLE (table), btn, 0, 2, 1, 2);\n\
    \    gtk_container_add (GTK_CONTAINER (win), table);\n    gtk_widget_show_all\
    \ (win);\n    gtk_main ();\n}\n```\n\n我们通过以下代码创建一个新的 `GtkTable`：\n```\nGtkWidget\
    \ *tbl = gtk_table_new (2, 2, TRUE);\n```\n\n`gtk_table_new` 函数的参数是行数和列数。要向表格中插入小部件，我们使用：\n\
    \n```\ngtk_table_attach_defaults (GTK_TABLE (tbl), lbl, 0, 1, 0, 1);\n```\n\n\
    我们将表格和要放入其中的小部件作为参数传递。接下来的数字是小部件附加到表格上的坐标——按顺序它们是左边缘和右边缘的位置，然后是顶部和底部边缘。这把小部件放置在第一列（在\
    \ x 0 到 1 之间）和第一行（在 y 0 到 1 之间）。注意，你可以让小部件跨越多行或多列，就像 `btn` 放置的方式：\n\n```\ngtk_table_attach_defaults\
    \ (GTK_TABLE (tbl), btn, 0, 2, 1, 2);\n```\n\n在这种情况下，小部件跨越了第一列和第二列，因为它在左侧附加于 0，右侧附加于\
    \ 2。为了完整性，请注意 `gtk_table_attach_defaults` 是函数 `gtk_table_attach` 的简化版本，后者具有许多其他选项。这些其他选项包括为每个小部件提供扩展、填充和设置\
    \ `padding` 的功能，就像上一章描述的 `gtk_box_pack` 函数一样。但这些函数写起来很麻烦——使用 `gtk_table_attach_defaults`\
    \ 会将每个小部件的 `padding` 设置为 0并将 `expand` 设置为 TRUE。如果你编译并运行此代码，你将得到一个像下面的窗口。注意，“关闭窗口”按钮如上所述跨越了表格的两个列。\n\
    \nimg/6a7eee5b22417c3d49170130a20b16f2_95_0.png)\n\n`GtkTable` 允许小部件在行列中对齐，使用户可以使用选择框和单选按钮输入文本并选择选项。我们已经看到可以使用标签在窗口上显示文本，但如果我们想读取用户输入的某些文本怎么办？GTK\
    \ 提供了 `GtkEntry` 小部件来实现。\n\n# 文本输入\n\n修改上面的示例代码，在表格中添加带有 `GtkEntry` 小部件的新单元格，如下所示：\n\
    \n```c\n#include <gtk/gtk.h>\n\nGtkWidget *txt;\n\nvoid end_program(GtkWidget\
    \ *wid, gpointer ptr)\n{\n    gtk_main_quit();\n}\n\nvoid edit(GtkWidget *wid,\
    \ gpointer ptr)\n{\n    const char *input = gtk_entry_get_text(GTK_ENTRY(txt));\n\
    \    gtk_label_set_text(GTK_LABEL(ptr), input);\n}\n\nvoid main(int argc, char\
    \ *argv[])\n{\n    gtk_init(&argc, &argv);\n    GtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    \    GtkWidget *btn = gtk_button_new_with_label(\"edit\");\n    gtk_signal_connect(btn,\
    \ \"clicked\", G_CALLBACK(end_program), NULL);\n    gtk_signal_connect(win, \"\
    delete_event\", G_CALLBACK(end_program), NULL);\n}\n```\n\n```c\nGtkWidget *lbl\
    \ = gtk_label_new (\"My label\");\n```\n\n```c\nGtkWidget *btn2 = gtk_button_new_with_label\
    \ (\"Button 2\");\ng_signal_connect(btn2, \"clicked\", G_CALLBACK(edit), lbl);\n\
    ```\n\n```c\ntxt = gtk_entry_new();\n```\n\n```c\nGtkWidget *tab = gtk_table_new\
    \ (2, 2, TRUE);\ngtk_table_attach_defaults (GTK_TABLE (tab), lbl, 0, 0, 1, 1);\n\
    gtk_table_attach_defaults (GTK_TABLE (tab), btn2, 1, 0, 0, 1);\ngtk_table_attach_defaults\
    \ (GTK_TABLE (tab), win, 0, 1, 1, 2); // 注意：此处原文误为win\ngtk_table_attach_defaults\
    \ (GTK_TABLE (tab), txt, 1, 1, 1, 1);\n```\n*(注：原文提供的代码块片段在翻译处较为混乱，已根据逻辑整理以保持代码可读性)*\n\
    \n在这个示例中，我们将 `GtkEntry` 小部件的指针 `txt` 声明为全局变量。这是因为我们需要从按钮处理程序访问它，而在这种情况下处理程序也需要访问标签小部件。我们之前使用\
    \ `g_signal_connect` 函数中的通用指针将小部件信息传递给处理程序，但对于两个独立的小部件，我们只有一个指针（有很多方法可以使用单个指针，但使用全局变量更容易理解）。\n\
    \n我们添加了一个新函数 `copy_text`，它使用函数 `gtk_entry_get_text` 获取指向文本缓冲区的指针，缓冲区存储了用户在输入框中输入的任何内容。注意这个字符缓冲区带有\
    \ `const` 修饰符——这表示程序员无法更改它。然后我们将此缓冲区传递给 `gtk_label_set_text`，它会将 `GtkEntry` 的内容复制到\
    \ `GtkLabel`。\n\n最后，我们通过 `gtk_entry_new` 创建 `GtkEntry` 本身，并将其添加到表格中（注意我们移动了 `btn`\
