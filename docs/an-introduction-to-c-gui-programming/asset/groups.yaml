  mdcn: "\n`void` 单词被称为一种类型限定符，`void` 是一种特殊类型，意味着“不需要值”。我们将在下一章中查看更多类型。\n这一行定义了该程序的\
    \ main 函数；它声明 main 函数不接受任何参数，且没有返回值。\n构成函数本身的代码被包含在函数定义后的两个大括号 `{ }` 之间。\n\n/*\
    \ 一条打印语句 */\n\n首先，我们有一个注释，告诉我们正在发生什么。C 语言中的注释以符号 `/*` 开始，以 `*/` 结束 - 这两个符号之间的任何内容都会被编译器忽略。\n\
    代码本身只有一行：\n\n```\nprintf(\"Hello world!\\n\");\n```\n\n这是对 `stdio` 库中 `printf`（“格式化打印”）函数的调用。在这种情况下，它接受一个参数，即一个包含在双引号内的文本字符串。如上所述，函数参数包含在圆括号中。\n\
    注意该行以分号结尾。C 语言中的所有语句都必须以分号结束；这告诉编译器这是该语句的结束。C 语言中初学者最常见的错误之一就是忘记分号！\n那么字符串本身呢？`Hello\
    \ World!` 部分非常直观，但结尾的 `\\n` 是什么呢？记得这个函数是“格式化打印”的吗？嗯，`\\n` 是一种格式控制；它是换行符符号。因此，这一行将打印字符串\
    \ 'Hello World'，然后是一个新行。\n\n# 检查你的括号\n\n与空格不同，标点在 C 语言中非常重要 - 确保你在需要圆括号的地方使用了大括号，或者反之亦然。\n\
    \n# 编译你的程序\n\n让我们编译并运行这个程序。Raspian 包含一个 C 编译器 `gcc`，所以你不需要安装任何东西，只需在你的 Pi 上启动\
    \ Raspian 即可准备就绪。使用你喜欢的文本编辑器创建一个文件 `hello.c`，将上面的程序复制到其中并保存。然后，从终端进入你保存 `hello.c`\
    \ 的目录并输入：\n\n```\ngcc -o myprog hello.c\n```\n\n这调用了带有 `-o myprog` 选项的 gcc C 编译器，它告诉编译器创建一个名为\
