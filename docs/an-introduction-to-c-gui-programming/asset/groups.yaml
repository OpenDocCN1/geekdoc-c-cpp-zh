    使用对话框向用户提供信息并向他们提问\n\n如果我们想向用户提问或通知他们某些信息，最好的方法是使用对话框。GTK 让我们轻松地创建对话框——对话框可以包含任何\
    \ GTK 部件，根据需要变得简单或复杂。\n\n对话框与窗口的区别特征是它会中断应用程序的操作——直到对话框关闭。\n\n对话框通常有一个或多个按钮（例如“确定”和“取消”），这些按钮位于对话框的动作区域（action\
    \ area）。这里是简单对话框的代码：\n\n```c\nvoid open_dialog(GtkWidget *wid, gpointer ptr) {\n\
