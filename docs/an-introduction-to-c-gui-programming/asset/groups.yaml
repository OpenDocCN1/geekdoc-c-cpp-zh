  - "[PAGE 80]\n\n# # Chapter 15\n\n# # Buttons\n\nMake your empty window more interesting\
    \ and interactive by adding a button\n\nThe simple program we looked at in the\
    \ previous chapter draws a window on the screen, but it looks rather bare. There's\
    \ also that problem closing the window with the X button leaves the program still\
    \ running. We're going to fix both of those by adding a button to close the window.\n\
    \nA button is another standard GTK widget and it supports all the features you'd\
    \ expect - you can have a label on it; you can see its appearance change when\
    \ you click it; you can activate it with a keyboard shortcut; you can disable\
    \ it temporarily and grey it out.\n\nThe first thing to do is add the button to\
    \ the window. When we've done that, we can look at making it something useful.\n\
    \nModify the code for the previous example as:\n\n```\n#include <gtk/gtk.h>\n\n\
    void main (int argc, char *argv[])\n{\n    gtk_init (&argc, &argv);\n    Gtkwidget\
    \ *win = gtk_window_new (GTK_WINDOW_TOPLEVEL);\n    GtkWidget *btn = gtk_button_new_with_label\
    \ (\"Click me\");\n    gtk_container_add (GTK_CONTAINER (win), btn);\n    gtk_widget_show_all\
    \ (win);\n    gtk_main();\n}\n```\n\nLet's look at the changes:\n\n```\nGtkWidget\
    \ *btn = gtk_button_new_with_label (\"Click me\");\n```\n\nThis creates a GtkButton\
    \ widget. There is a standard gtk_button_new function, but using this version,\
    \ gtk_button_new_with_label, allows us to add a de facto text label to the button\
    \ at the same time as we create it."
