    \ a neater way of doing this. called a switch statement.\n\n```c\n#include <stdio.h>\n\
    \nvoid main (void) {\n    int a = 0;\n```\n\n# AN INTRODUCTION TO C AND GUI PROGRAMMING\n\
    \n```c\nswitch (a)\n{\ncase 0 :      printf(\"a is equal to 0\\n\");\n    break;\n\
    case 1 :      printf(\"a is equal to 1\\n\");\n    break;\ndefault :      printf(\"\
    a is greater than 1\\n\");\n}\n```\n\nThis does exactly the same as the example\
    \ above with multiple if statements, but is a lot shorter. How does it work?\n\
    The opening line consists of the keyword switch, with the name of a variable in\
    \ round brackets. This is the variable which will be tested against the various\
    \ cases.\nThe body of the switch statement is a number of case statements. The\
    \ variable a is compared against each case in turn. it matches the value immediately\
    \ after the word case, then the lines of code are executed.\nThe final case is\
    \ just called default - every switch should include a default case as the final\
    \ one in the list, and this is the code which is executed if none of the other\
    \ cases matches.\nNotice that the last line in each case section is the word break\
    \ - this is very important. The keyword break tells the compiler that you want\
    \ to 'break out' of the switch statement at this point that is, to stop executing\
    \ code inside the switch and to resume execution after the closing bracket. If\
    \ you forget to include the break statements, every case after the one you wanted\
    \ will execute as well as the one you wanted. Try it by compiling the code above\
    \ and running it you'll see the following in the terminal:\n\na is equal to 0\n\
    \nRemove the two break statements, so the switch looks like:\n\n```c\nswitch (a)\n\
    {\ncase 0 :      printf(\"a is equal to 0\\n\");\ncase 1 :      printf(\"a is\
    \ equal to 1\\n\");\ndefault :      printf(\"a is greater than 1\\n\");\n}\n```\n\
    \n...and run it again - you'll now see:\n\na is equal to 0\na is equal to 1\n\
    a is greater than 1\n\nNot what you expected? This is another common bug in C\
    \ code - forgetting the break statements in your cases can result in very unexpected\
    \ behaviour. But this can also be useful, programmers will sometimes structure\
    \ a switch statement with code that they want to execute in multiple different\
    \ cases, and deliberately leave out the break statements.\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_27_0.png)\n\
    \nDon't forget the break statements at the end of each case in your switch statements!\n\
    \n# YOUR FAVOURITE LOOP...\n\nAll three types of loop in C - while do and for\
