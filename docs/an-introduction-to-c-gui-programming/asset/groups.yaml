  mdcn: "\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_74_0.png)\n\n它已经超越了那个范围，成为一个通用的用户界面工具包，现在是\
    \ Linux 桌面上最广泛使用的界面库之一。\n\nGTK 项目的基础构建单元被称为“小部件”（widgets）。你在屏幕上看到的所有内容——窗口、按钮、标签——都是小部件。GTK\
    \ 库负责了创建小部件所需的所有工作——你只需要告诉它想要什么小部件、想把它们放在什么位置、以及你想让它们做什么，GTK 就会为你处理好所有其他工作。\n\n\
    为了让你了解“处理所有其他工作”意味着什么，请想象一下上述情况：你正在通过向屏幕缓冲区写入数据并绘制像素来手动创建一个窗口。如果用户点击窗口标题栏并将其拖动到屏幕上的另一个地方，你必须检测到鼠标被点击，你必须跟踪它正在移动，并且在它移动的每个点上重新绘制窗口，恢复它移动过的区域原本被遮挡的内容。仅仅拖动窗口就需要几百行代码——但有了\
    \ GTK，你只需创建一个“窗口”小部件（只需一行代码），这一切都由它来处理。\n\n因此，像 GTK 这样的库使得创建丰富的图形用户界面变得相对简单，你可能会惊讶于为了让程序运行起来你需要编写的代码是如此之少。\n\
    \n## GTK 2 和 GTK 3\n\n在这里值得提到的是，目前有两个版本的 GTK 在在使用。当前版本是 GTK 3，它仍然处于活跃开发中——不同版本之间会有很大变化。\n\
    \n出于这个原因，许多人倾向于使用较旧的 GTK 2。它提供了大部分功能，但它是稳定的代码，不再发生太大变化。有人说，对于任何东西，使用最新、最强大的版本总是好的，但更谨慎的工程师（比如你的作者……）往往更倾向于使用经过了更多测试、并且被人们反复琢磨过的旧版本！就我们在这里查看的示例而言，两者之间有很多显著差异，但为了明确起见，本书示例将使用\
    \ GTK 2。\n\n## 关于主题的说明\n\nGTK 的强大功能之一是主题化（theming）。GTK 中每个小部件的外观都可以在几乎每一个细节上进行自定义，从文本颜色到按钮角的形状。这种自定义与\
    \ GTK 应用程序的实际代码完全分离，相反，小部件的外观是由运行 GTK 应用程序的系统上使用的当前主题控制的。\n\n创建主题超出了本书的范围——这是一个相当复杂且琐碎的过程。书中所有的示例截图取自树莓派桌面（Raspberry\
    \ Pi Desktop）环境，它使用一个名为 Pix 的自定义主题。如果你在具有不同主题的其它计算机上使用 GTK，你的小部件看起来可能与所示略有不同，但你编写的代码是相同的。\n\
    \n## 第14 章\n\n## 你的第一个 GTK 程序\n\n使用 GTK 库用 C 语言开始编码并创建你的第一个简单 GUI 应用程序\n\n让我们创建一个简单的\
    \ GTK 程序。打开你喜欢的文本编辑器，编写以下内容。\n\n```c\n#include <gtk/gtk.h>\n\nint main (int argc,\
    \ char *argv[]) {\n    gtk_init (&argc, &argv);\n    GtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    \    gtk_widget_show(win);\n    gtk_main();\n    return 0;\n}\n```\n\n我告诉过你不需要太多代码！在我们尝试运行它之前，逐行查看这些代码\n\
    \n```c\n#include <gtk/gtk.h>\n```\n\n这一行告诉预处理器我们要使用 GTK 库。\n\n```c\nint main (int\
    \ argc, char *argv[])\n```\n\n这一行是 C 程序的入口。\n\n```c\ngtk_init (&argc, &argv);\n\
    ```\n\n这一行初始化了 GTK——我们需要通过命令行传递给 GTK 库的参数，并设置了 GTK 将要使用的内部变量（注意，在程序开始处需要调用 gtk_init）。\n\
    \n```c\nGtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n```\n\n这一行创建了一个\
    \ GTK 顶层窗口实例。\n\n```c\ngtk_widget_show(win);\n```\n\n这一行告诉 GTK 显示该小部件。\n\n```c\n\
    gtk_main();\n```\n\ngtk_main 调用运行了主循环；这实际上是将 GUI 的控制权交给了 GTK。\n\n```c\nreturn\
    \ 0;\n}\n```\n\nmain 函数返回一个整数，这是 C 程序的结束方式，我们需要把它保存为 gtktest.c。现在你用喜欢的编辑器把它写好并保存。\n\
    \n## 构建 GTK 程序\n\n如果我们正在编写一个命令行程序，我们可以直接使用 gcc 来构建源文件。首先需要确保 GTK 库已安装。要这样做，请在终端输入\
    \ `sudo apt-get install libgtk2-dev` 并接受任何提示——这安装了 GTK 的开发库。\n\n现在我们需要通过 gcc 来构建它\n\
    \n```bash\ngcc pkg-config --cflags --libs gtk+-2.0 gtktest -o gtktest\n```\n\n\
    如果你运行这个命令，你应该得到一个名为 gtktest 的可执行文件。通过输入以下命令运行它\n\n```bash\n./gtktest\n```\n\n\
    看看会发生什么。\n\n"
