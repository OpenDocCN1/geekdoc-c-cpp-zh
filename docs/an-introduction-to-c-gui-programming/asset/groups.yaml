    \n    while (1) {\n        printf(\"a is equal to %d\\n\", a);\n        a++;\n\
    \        if (a == 3) {\n            break;\n        }\n    }\n    printf(\"a is\
    \ equal to %d and I've finished\\n\", a);\n}\n```\n\nSo we have a while loop in\
    \ the test is just the value 1; this is a non-zero value, and so always true if\
    \ you enclose inside curly brackets after a while (1) statement, the loop will\
