    \ are currently highlighted.\n\n```\nsel = gtk_tree_view_get_selection (GTK_TREE_VIEW\
    \ (tv));\n```\n\nFrom a GtkTreeSelection, we then get the GtkTreeIter and GtkTreeModel\
    \ associated with it. The tree model is the list store which is providing the\
    \ data for the tree view, and the iterator is the actual row selected.\n\n```\n\
    if (gtk_tree_selection_get_selected (sel, &model, &iter))\n```\n\n(This function\
