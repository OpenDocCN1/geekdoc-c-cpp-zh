    \ add_vals(1, 2, 3));\n}\n```\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_69_0.png)\n\
    \n# DON'T #INCLUDE C FILES\n\n#include will work on any file, it substitutes the\
    \ include line with the contents of the file. Occasionally I see this being abused.\
    \ some programmers bypass the use of header files by just including the other\
    \ C files themselves. While this does work, it's poor practice. don't be tempted\
    \ to try it!\n\n# #define\n\nAnother useful directive is #define, which can be\
    \ used to define constant values. Look at this example:\n```c\n#include <stdio.h>\n\
    extern int add_vals(int a, int b, int c);\n\nvoid main (void) {\n    printf(\"\
    The total is %d\\n\", add_vals(1, 2, 3));\n}\n```\n\n# Chapter 13\nIntroduction\
    \ to GTK\n\nNow you have a grounding in C, you are ready to start creating GTK\n\
    \nSo far in this book, we've learnt the basics of the C language, and seen how\
    \ to use it to write text-only programs. Looking at the keywords and library functions\
    \ we've seen so far, it isn't obvious how you can create a full graphical interface\
    \ - desktop, windows, mouse pointer, and so on - with them.\n\nIt is entirely\
    \ possible to do so in C, but to be honest, it would be incredibly long-winded\
    \ and time-consuming. You need to find the screen buffer in memory - the part\
    \ of memory that represents the pixels which make up the desktop on the screen\
    \ - and then write new pixels for each; you have to write even more pixels to\
    \ show where the mouse cursor is; you then have to monitor when the user moves\
    \ the mouse, redraw the pointer each time, and when the user clicks the mouse\
    \ button you have to work out where the screen is and whether it is on top of\
    \ a window, and so on...\n\nFair enough, that isn't how it's usually done in practice\
    \ - life is too short! Most of this functionality has already been written for\
    \ you. Windows systems like X provide most of the underlying features, and then\
    \ user interface libraries provide a convenient means of creating GUI applications\
    \ which work with the likes of X; all you need to do is choose a suitable user\
    \ interface library, and use the predefined functions in it in your C program.\n\
    \nThere are lots of user interface libraries available, some are designed with\
    \ a particular desktop environment like Windows or macOS, while others are cross-platform\
    \ and can work in a choice of desktop environments. The one which is most used\
    \ in the Raspberry Pi Desktop included with Raspbian is GTK, and that's the one\
    \ we\n\n# What is GTK?\n\nGTK (formerly known as GT+) is short for \"GIMP Toolkit\"\
    \ Its website (gtk.org) describes it as a \"multi-platform toolkit for creating\
    \ graphical user interfaces\", and it was originally written to provide the user\
    \ interface elements used to create the GIMP picture-editing program.\n"
  mdcn: "\n# 第 12 章\n头文件与预处理器\n\n将代码拆分到多个文件中\n\n在到目前为止看到的示例中，我们一直将程序的所有代码都放在单个文件中。但一旦程序变得庞大，将它们拆分成多个单元，并将相似的函数组合在一起，就会更有意义。为了理解这是如何运作的，我们需要更详细地查看编译器究竟做了什么：\n\
    \n在目前为止所有的示例中，我们都对单个源文件调用了 gcc，它创建了一个单一的可执行程序。这掩盖了 gcc 实际上做了两件事的事：首先，它将你的 C 源文件编译成一个对象文件（object\
    \ file），然后将对象文件与所有的库函数链接在一起以创建可执行文件。这第二步是由一个名为链接器（linker）的程序执行的，而 gcc 包含了这个功能。\n\
    \n如果你创建一个包含多个源文件的程序，你只需要在调用 gcc 时包含所有源文件的文件名即可。它会为每个源文件创建一个对象文件，然后将你所有的对象文件链接在一起以创建可执行文件。\n\
    \n不过这里有一个障碍：如果你将代码拆分成单独的文件（通常称为模块），你将会有一些为了运行而调用其他文件中函数的文件。这些文件并不知道链接器是如何对它们操作的；文件是被单独编译的，如果你在一个编译器不认识的文件在使用函数，编译器就会报错。\n\
    \n我们使用头文件（header files）来解决这个问题。这些是扩展名为 .h 的文件，其中存储了模块中定义的函数（以及全局变量）的声明，这样当它们被另一个模块使用时，就可以告诉编译器它们的存在。我们已经见过很多次了，记得示例顶部的\
    \ #include <stdio.h> 吗？这正是这个过程；它在告诉编译器，系统头文件 stdio.h 中声明的函数在该模块中使用了。\n\n# 保持命名一致\n\
    \n虽然你可以给头文件起任何名字—— 并没有强制规定命名 —— 但良好的做法是将特定文件中函数的头文件命名为与 C 文件本身相同的名称，并使用 .h 扩展名而不是\
    \ .c。这使得阅读你代码的人更容易更容易找到定义函数的文件。\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_67_0.png)\n\
    \n# 将代码拆分到多个文件中\n\n让我们来看它是如何运作的示例。创建三个文件，两个扩展名为 .c，一个扩展名为 .h，如下所示：\n\n```c\nfunction.c\n\
    int add_vals(int a, int b, int c)\n{\n    return a + b + c;\n}\n```\n\n```c\n\
    function.h\n\nextern int add_vals(int a, int b, int c);\n```\n\n```c\nmain.c\n\
    \n#include <stdio.h>\n#include \"function.h\"\n\nvoid main (void)\n{\n    printf(\"\
    The total is %d\\n\", add_vals(1, 2, 3));\n}\n```\n\n将所有三个文件放在同一个目录下并运行 gcc，给它\
    \ .c 文件的文件名——\ngcc -o myprog main.c function.c\n\n生成的程序将运行 main.c 中的 main 函数，该函数调用了\
    \ function.c 中的 add_vals。\n\n有几点需要注意：首先，在头文件中，我们在声明开头使用 `extern` 单词来声明函数。这告诉编译器，该函数将在文件外部找到，即在另一个\
    \ C 文件中。\n\n其次，虽然我们一直在 `<>` 符号之间包含 stdio.h 及其名称，但我们使用双引号 `#include function.h`。`<>`\
    \ 符号告诉编译器在系统头文件存储的目录中查找文件，`\"\"` 符号表示该文件是本地的，并且与你正在构建的 .c 文件在同一个目录下。如果你在创建自己的头文件，包含它们时始终在名称周围使用双引号。\n\
    \n# MAKEFILES\n\n# 预处理器\n\n那么 #include 实际上做了什么？它是对预处理器的指令，预处理器是编译的第一阶段；它在将源文件传递给编译器之前替换源文件中的文本。预处理器通过所谓的指令进行控制；这些指令很容易识别，因为它们都以\
    \ # 符号开头。\n\n- `#include` 指令指示预处理器将该行替换为它所包含的文件。因此，在我们上面的示例中，.c 文件中的行 `#include\
    \ \"function.h\"` 被替换为 function.h 文件的内容，这意味着传递给编译器的内容类似于：\n\n```c\n#include <stdio.h>\n\
    extern int add_vals(int a, int b, int c);\n\nvoid main (void) {\n    printf(\"\
    The total is %d\\n\", add_vals(1, 2, 3));\n}\n```\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_69_0.png)\n\
    \n# 不要 #INCLUDE C 文件\n\n#include 可以作用于任何文件，它将包含行替换为文件的内容。偶尔我看到这种做法被滥用。某些程序员通过直接包含其他\
    \ C 文件本身来跳过对头文件的使用。虽然这可行，但这是糟糕的做法。不要受诱去尝试！\n\n# #define\n\n另一个有用的指令是 #define，可以用于定义常量值。看这个这个示例：\n\
    \n```c\n#include <stdio.h>\n#define PI 3.14159\n\nvoid main (void) {\n    printf(\"\
    The circumference is %f\\n\", 2 * PI);\n    printf(\"The area is %f\\n\", PI *\
    \ PI);\n}\n```\n\n（注：原文中 #define 的部分存在重复和乱码，已根据逻辑处理，此处保留核心示例翻译）\n"
