    # # Chapter 9


    # # User input


    Reading and interpreting input from the user


    We''ve seen the `printf` function used a lot in previous chapters; it''s the standard
    way of writing formatted text output from a program to the console, the command
    line from which you run the program. But if you want to get input from the user?
    How do we read the user types into the console?


    In the last chapter, we looked at the `scanf` function which reads values from
    a string. There''s an equivalent function called `scanf`, which reads values directly
    from the console as in the following example:


    `scanf` works exactly like `scanf`, but has one fewer argument, as it reads from
    the console rather than from a string


    However, it''s not really the best way of getting console input: it only works
    if you have a user who types in exactly what you expect. Unfortunately, users
    have a nasty tendency to type in things you aren''t expecting and `scanf` can''t
    cope well with that. For example, in the code above, if the user types in 257
    characters when asked for their name, they will overflow the space allocated for
    the input string, and bad things may happen...'
  - "[PAGE 52]\n\n# STDIN AND STDOUT\n\nWe talk about stdin in this chapter which\
    \ is the 'standard input stream' - what the user types at the console. You may\
    \ sometimes see references to stdout which is the 'standard output stream' - as\
    \ you might expect this is output which is printed to the console, usually via\
    \ printf\n\n# A better way\n\nA better approach is to read each line the user\
    \ enters into a buffer string, and then use sscanf to read values from that string\
    \ The Library function gets is useful for this. Have a look at this example:\n\
    \n```\n#include <stdio.h>\n\nvoid main (void)\n{\n    char input[256], name[256];\n\
    \    int age;\n\n    printf(\"What is your name, user?\\n\");\n    fgets(input,\
    \ 256, stdin);\n    sscanf(input, \"%s\", name);\n\n    printf(\"Hello, %s. How\
    \ old are you?\\n\", name);\n    while (1)\n    {\n        fgets(input, 256, stdin);\n\
    \        if (sscanf(input, \"%d\", &age) == 1) break;\n        printf(\"I don't\
    \ recognise that as an age - try again!\\n\");\n    }\n\n    printf(\"Well, %s,\
    \ you look young for %d...\\n\", name, age);\n}\n```\n\nfgets takes three arguments.\
    \ The first is the buffer into which it should store the input The second is the\
    \ maximum number of bytes it will write into that buffer, this is useful to prevent\
    \ the overflow situation mentioned above. Finally, it takes an argument telling\
    \ it where to read from; in this case, it is set to stdin (short for 'standard\
    \ input') which tells it to read from the console."
  - '[PAGE 53]


    Each time we ask the user for input, we use fgets to read up to 256 characters
    of whatever they type (up to the point at which they press the ENTER key), and
    we then use sscanf to interpret it. Additionally, when asking for the user''s
    age, we use the value returned by scanf (described in the previous chapter) to
    check that the user has entered what you expect, and loop until they give a valid
    answer. You can use this method to interpret pretty much anything a user types,
    and to safely handle all the cases where they type something unexpected!


    # SCANF


    Like fgets, scanf returns an integer indicating how many items it successfully
    read, which you can use to check for errors. One problem is that scanf only removes
    the matched value from the input buffer, so if a scanf fails to match anything,
    what the user typed will be read again on the next call to scanf. It is easier
    to use fgets and scanf.


    # Reading parameters


    There''s another way to get input to your program, which is to supply it as a
    parameter when you start the program from the command line.


    At this point, I have to admit to not being entirely honest for the last eight
    chapters... I''ve always shown the definition of the main function as:


    ```

    void main (void)

    ```


    This works, as you''ve seen, but it isn''t strictly correct. The strict definition
    of main returns like this:


    ```

    int main (int argc, char *argv[])

    ```


    But let''s be honest if I''d shown you in chapter 1 this integer, is this a success
    or failure code, wouldn''t you say? What does it all mean?


    First off, we can see that main returns an integer, this is a success or failure
    code which some operating systems use for processing in a shell script or the
    line. Traditionally, if a program succeeds, main returns 0, and if it fails, it
    returns a non-zero error code. For programs that run on their own, you don''t
    need to worry about it!


    What''s more useful are the other two arguments: argc is an integer, and this
    is the number of parameters which were provided on the command line when the program
    was started. Strangely, the number includes the program name itself, so this value
    is always 1 or more, if parameters were provided, it will be 2 or more.'
