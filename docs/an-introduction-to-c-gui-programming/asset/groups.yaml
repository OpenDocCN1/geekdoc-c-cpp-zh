    Finally, we can get the actual values from the model and iterator.


    ```

    gtk_tree_model_get (model, &iter, 0, &option, -1);

    ```


    As when setting a value in a list store, arguments to this function, after the
    model and iterator, are a list of paired values, the first of each pair being
    the column to be read, and the second being a pointer to which the data should
    be written. Multiple values can be read from the same row with a single call,
    so -1 is used for the column value of the final entry in the list, to show there
    are no more values to read.


    In this case, a pointer to the text in the first column of the selected row is
    returned as option.'
