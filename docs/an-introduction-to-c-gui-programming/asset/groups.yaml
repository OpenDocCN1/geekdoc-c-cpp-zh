    \ GtkContainer 类型的属性，但我们将其应用于 `win`，而它是一个 GtkWindow。\n\nGTK 内部存在控件类型的层级结构，控件类型继承其在层级中的父类型，该类型可以被描述为上方控件类型的子。因为\
    \ GtkContainer 是 GtkWindow 的父类型之一，你可以在 Gtk 控件上使用 gtk_container 函数。这样将一个控件放入另一个控件内部是我们经常需要的操作。你会注意到，当\
    \ `win` 作为参数传递给 `gtk_container_add` 函数时，它被封装在 `GTK_CONTAINER()` 函数内部——这会将参数转换为\
    \ GTK_CONTAINER 类型的变量，告诉函数将 `win` 视为一个 GtkContainer。如果不包含这个函数，代码仍然可以工作，但编译器会报错！（GTK\
    \ 为每种类型的控件都提供了一个函数，因为将控件转换为不同的类型是非常常见的。）\n\n## 信号\n\n如果你运行应用程序，你可以用鼠标点击按钮，它会高亮显示已被点击。你也可以按下键盘上的\
    \ ENTER 键来执行相同的操作——其行为与我们在应用程序中常见的按钮完全相同，但它实际上仍然没有执行任何操作。下一步是修复这个问题。\n\n这样做的方法是将处理函数连接到按钮被点击时产生的信号上。\n\
    \n这里是添加了处理函数的代码：\n\n```c\n#include <gtk/gtk.h>\n\nvoid end_program(GtkWidget *wid,\
    \ gpointer ptr) {\n    gtk_main_quit();\n}\n\nvoid main (int argc, char *argv[])\
    \ {\n    gtk_init(&argc, &argv);\n    GtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    \    GtkWidget *btn = gtk_button_new_with_label(\"Click\");\n    g_signal_connect(btn,\
    \ \"clicked\", G_CALLBACK(end_program), NULL);\n    gtk_container_add(GTK_CONTAINER,\
    \ win, btn);\n    gtk_widget_show_all(win);\n    gtk_main();\n}\n```\n\n处理函数（通常称为回调函数）名为\
    \ `end_program`，它所做的只是调用 GTK 函数 `gtk_main_quit` ——如该名称所示的那样，该函数退出 `gtk_main` 内部循环并允许程序结束。\n\
    \n```c\ng_signal_connect(btn, \"destroy\", G_CALLBACK(end_program), NULL);\n```\n\
    \n这一行将处理函数（end_program）连接到名为 \"clicked\" 的信号，该信号在按钮控件被鼠标点击时由其发射。我们使用 `GTK_CALLBACK`\
    \ 函数来确保编译器知道 `end_program` 函数是一个有效的回调。不过这并不完美——如果我们点击 X 按钮，窗口会关闭但程序不会退出。让我们通过将另一个处理函数连接到点击\
    \ X 时产生的信号来修复这个问题。\n\n"
