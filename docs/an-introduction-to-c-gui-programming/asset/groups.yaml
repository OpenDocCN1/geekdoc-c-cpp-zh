  - "[PAGE 104]\n\n# INTRODUCTION TO C PROGRAMMING\n\n```\ng_signal_connect (comb,\
    \ \"changed\", G_CALLBACK(combo_changed), NULL);\n```\n\nThe GtkComboBoxText is\
    \ a useful control for simple cases, but the full GtkComboBox gives a lot more\
    \ flexibility. Like some other widgets for free-form data display, it is used\
    \ as a front end on a database structure called a list store.\n\n# List stores\n\
    \nA list store can be thought of as a table of data with multiple rows and columns.\
    \ Each cell of the table can store a text string, an integer, or even an image.\n\
    \nOnce a list store is created a combo box can be associated with it and one column\
    \ of the list store can be used to provide the options for the box. The code for\
    \ this is little longer and more complex than that for a GtkComboBoxText above,\
    \ but adds the potential for much more sophisticated handling of combo boxes.\n\
    \n```\nint pos = 0;\n\nGtkListStore *ls = gtk_list_store_new (1, G_TYPE_STRING);\n\
    gtk_list_store_insert_with_values (ls, NULL, pos++, 0,\n    \"Option 1\", -1);\n\
    gtk_list_store_insert_with_values (ls, NULL, pos++, 0,\n    \"Option 2\", -1);\n\
    gtk_list_store_insert_with_values (ls, NULL, pos++, 0,\n    \"Option 3\", -1);\n\
    ```\n\n```\nGtkWidget *comb = gtk_combo_box_new_with_model (\n    Gtk_TREE_MODEL\
    \ (ls));\n```\n\n```\nGtkCellRenderer *rend = gtk_cell_renderer_text_new ();\n\
    ```\n\n```\ngtk_cell_layout_pack_start (GTK_CELL_LAYOUT (comb), rend, FALSE);\n\
    gtk_cell_layout_add_attributes (GTK_CELL_LAYOUT (comb), rend,\n    \"text\", 0);\n\
    ```\n\nFirst, we create a GtkListStore:\n\n```\nGtkListStore *ls = gtk_list_store_new\
    \ (1, G_TYPE_STRING);\n```"
  - "[PAGE 105]\n\nthe gtk_list_store_new function takes a list of arguments – the\
    \ first is the number of columns in the list store, and this is followed by a\
    \ list of the types of data stored in each column. In this example we are creating\
    \ a box with a single column, and that column will hold a text string.\nWe then\
    \ add some entries to the list store:\n\n```\ngtk_list_store_insert_values (ls,\
    \ NULL, pos++, 0,\n    \"Option 1\", -1);\ngtk_list_store_insert_values (ls, NULL,\
    \ pos++, 0,\n    \"Option 2\", -1);\ngtk_list_store_insert_values (ls, NULL, pos++,\
    \ 0,\n    \"Option 3\", -1);\n```\n\nEach call to gtk_list_store_insert_with_values\
    \ takes the list store as an argument, followed by a NULL pointer. In some cases,\
    \ this would be a pointer to what is called iterator, which is a reference to\
    \ the entry just added – we don't need this functionality, so we set the pointer\
    \ to NULL\n\nThese are followed by the index within the list store where the new\
    \ entry is to be placed - effectively the number of the row to be used for the\
    \ data - then a list of paired values. The first value of each pair is the column\
    \ where the data is to be stored and the second is the data itself, the list of\
    \ pairs is terminated with a -1 for the column value. In this case, we are only\
    \ adding a single string item to each row, in column 0.\nWe associate a combo\
    \ box with the list store:\n\n```\nGtkWidget *comb = gtk_combo_box_new_with_model\
    \ (\n    GTK_TREE_MODEL (ls));\n```\n\nThis creates a combo box and tells GTK\
    \ that the data for this combo box comes from the ls list store we previously\
    \ created. The data used by a combo box is of type GtkTreeModel, so we cast our\
    \ list store to this type.\nNow we set which column of the list store should be\
    \ shown in the combo box – warned, this gets a bit complicated!\n\n```\nGtkCellRenderer\
