    \ GTK widgets have a degree of shading applied around them to provide a 3D appearance\
    \ - by default, a GtkButton has this shading applied, which makes the button appear\
    \ to stand out slightly from the window background. By setting the relief to GTK_RELIEF_NONE,\
    \ the 3D appearance is removed – if you run this, you should be able to see the\
    \ difference between the buttons.\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_131_0.png)\n\
    \n- The GtkButton with the relief set\n\nHere's another example:\n\n```c\nGtkWidget\
    \ *btn2 = gtk_button_new_with_label(\"exit\");\ng_object_set(G_OBJECT(btn2), \"\
    relief\", GTK_RELIEF_NONE, NULL);\n```\n\nIn this case, we are setting the underline\
    \ property, which should look like this:\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_131_1.png)\n\
    \n- The GtkButton with the underline set\n"
  mdcn: "\n这里是一个使用 GtkColorButton 的示例：\n\n```\nstatic void (GtkButton *btn, gpointer\
