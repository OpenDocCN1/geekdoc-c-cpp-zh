  - '[PAGE 131]


    list of property names and property values. In this case, we are setting the relief
    property of the GtkButton btn2 to GTK_RELIEF_NONE.

    The ‘relief’ of a GtkButton controls how the border looks. The borders of some
    GTK widgets have a degree of shading applied around them to provide a 3D appearance
    - by default, a GtkButton has this shading applied, which makes the button appear
    to stand out slightly from the window background. By setting the relief to GTK_RELIEF_NONE,
    this 3D shading is removed – if you run the program above, you should be able
    to clearly see the difference between the two buttons on the window. (You can
    use the TAB key to move the dotted outline between the buttons to show the difference
    more clearly.)


    ![](img/6a7eee5b22417c3d49170130a20b16f2_131_0.png)


    +   - A GtkButton with the relief property set to GTK_RELIEF_NONE


    Here''s another example. Remove the setting of the relief property and change
    the name of the button by adding an underscore


    ```

    GtkWidget *btn2 = gtk_button_new_with_label ("My button");

    ```


    You should end up with a button that looks like this:


    ![](img/6a7eee5b22417c3d49170130a20b16f2_131_1.png)


    +   - A GtkButton with an underline in the label and the use-underline property
    set to FALSE


    If you now set the use-underline property:


    ```

    Gtk_object_set (G_OBJECT (btn2), "use-underline", TRUE, NULL);

    ```


    the underscore will vanish, but reappear under the ‘b’ of ‘button’ if you hold
    down the ALT key on the keyboard.'
  - '[PAGE 132]


    # INTRODUCTION TO C AND GUI PROGRAMMING


    ![](img/6a7eee5b22417c3d49170130a20b16f2_132_0.png)


    +   * The same GtkButton, but with use-underline set to TRUE


    All widgets have properties that can be set like this. As another example, try
    replacing the GtkButton with a GtkLabel:


    ```

    GtkWidget *lbl = gtk_label_new ("My label");");"

    ```


    ...then setting the angle property of the label to 45 degrees:


    ```

    g_object_set (G_OBJECT lbl, "angle", 45.0, NULL);

    ```


    (Note that it is important to enter the angle as 45.0, rather than just 45 - the
    value expected is a floating-point number, and adding the .0 to the end of the
    value ensures that the compiler treats it as such.)


    You should end up with a window which looks like this, with the label text at
    a 45 degree angle to the horizontal:


    ![](img/6a7eee5b22417c3d49170130a20b16f2_132_1.png)


    +   * A GtkLabel with the angle property set to 45.0


    In many cases, widgets also have dedicated functions to set each property which
    can be used instead of the generic g_object_set function (in the examples above,
    gtk_button_set_relief, gtk_button_set_underline, and gtk_label_set_angle, respectively)
    The advantage of g_object_set is that it can be used to set multiple properties
    in one line, which can shorten your code significantly. The GTK online documentation
    page for each widget lists all the properties and dedicated functions to set their
    values. For the two examples above, this can be found at'
