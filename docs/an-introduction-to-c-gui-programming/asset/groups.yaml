    # 欢迎阅读《C语言与 GUI 编程简介》\n\nC 编程语言发明于20世纪70年代初，从那时已成为最流行和广泛使用的通用语言之一。C 可以用于创建简单的命令行程序，或用于操作烤面包机和手表中的微型微控制器的嵌入代码。在另一端，它可以用于创建丰富的图形化桌面应用程序——事实上，大部分的\
    \ Linux（以及树莓派本身）都是用它编写的。它可以让你控制处理器运行的最细微细节，但仍然简单易学、易读。本书的第一部分是面向初学者的 C 语言入门；第二部分展示了如何使用\
    \ C 和 GTK 工具包为 Raspbian 创建桌面应用程序。你不需要任何编程经验，一台运行着 Raspbian 的树莓派即可开始。\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_4_0.png)\n\
    \n# 关于作者\n\nSimon Long 是一名在 Raspberry Pi 工作工程师。他负责树莓派桌面系统及其相关应用程序。在加入 Raspberry\
    \ Pi 之前，他在 Broadcom 工作，在那里他首次遇到了 Eben Upton；在此之前，他曾花了十年时间在一家大型咨询公司担任软件工程师和用户界面设计师。在空闲时间，他喜欢解决那些没有任何黑色方格的极难字谜游戏。\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_5_0.png)\n\n# 目录\n\n- 第1章：入门\n  学习如何使用\
    \ C 语言为树莓派 010\n- 第2章：变量与算术\n  创建变量并进行数学运算 014\n- 第3章：条件与比较\n  控制你 C 程序的流程 019\n\
    - 第4章：更高级流程控制\n  For 循环和 case 语句 024\n- 第5章：指针\n  变量也有地址 030\n- 第6章：函数\n  将你的代码拆分为易于处理的块\
    \ 035\n- 第7章：数组与字符串\n  处理值列表和字母 041\n- 第8章：字符串库\n  简化字符串的常用操作 046\n- 第9章：用户输入\n\
    \  读取和解释用户输入 052\n- 第10章：文件输入输出\n  学习从文件读取和写入文件 058\n- 第11章：更多关于类型和变量\n  枚举 63\n\
    - 第12章：头文件与预处理器\n  将代码拆分为多个 68\n- 第13章：GTK 简介\n  准备创建 GUI 74\n- 第14章：你的第一个\n \
    \ 开始创建 GUI 77\n- 第15章：按钮\n  让你的窗口更 81\n- 第16章：标签与布局 85\n- 第17章：更高级布局\n  添加文本 91\n\
    - 第18章：用户输入\n  你的窗口 97\n- 第19章：组合框\n  解释用户输入 103\n- 第20章：树形视图\n  显示信息 109\n- 第21章：菜单\n\
    \  选择选项 115\n- 第22章：对话框\n  创建栏 120\n- 第23章：内置对话框\n  提问 123\n- 第24章：自定义\n  更改属性\
    \ 131\n- 第25章：Glade\n  创建布局 135\n- 第26章：快速参考\n  代码示例 144\n\n# 第1章：入门\n\n学习如何使用\
    \ C 语言为树莓派 010\n\n# C 语言的优点何？\n\nC 编程语言发明于20 70 年代初，从那时已成为最流行和广泛使用的通用语言之一。C 可以用于创建简单的命令行程序，或用于操作烤面包机和手表中的微型微控制器的嵌入代码。在另一端，它可以用于创建丰富的图形化桌面应用程序——事实上，大部分的\
    \ Linux（以及树莓派本身）都是用它编写的。它可以让你控制处理器运行的最细微细节，但仍然简单易学、易读。本书的第一部分是面向初学者的 C 语言入门；第二部分展示了如何使用\
    \ C 和 GTK 工具包为 Raspbian 创建桌面应用程序。你不需要任何编程经验，一台运行着 Raspbian 的树莓派即可开始。\n\n# 选择你的编辑器\n\
    \n你可以使用任何喜欢的编辑器来输入代码，只要它保存为纯文本。Raspbian 自带的编辑器是一个不错的选择，但你也可以使用 Leafpad、nano 或任何你喜欢的\n\
    \n# 空格并不重要！\n\n与 Python 不同，空格在 C 中没有意义——你可以在 C 程序的任何地方放置空格、制表符和换行以提高可读性\n\n# Hello\
    \ world - 你的第一个 C 程序\n\n排除这些之后（希望这让你觉得 C 可能值得学习），让我们来看看任何语言编写的第一个程序：在屏幕上打印“Hello\
    \ World”。顺便提一下，编写 Hello World 程序的传统最早出现在描述 C 的原始文档中。想想：没有 C 没有 Hello World……\n\
    \n```c\n#include <stdio.h>\n\nvoid main ()\n{\n    /* 一个打印语句 */\n    printf(\"\
    Hello world!\\n\");\n}\n```\n\n希望并不吓！让我们逐行查看\n\n```c\n#include <stdio.h>\n```\n\
    \n这被称为 #include。如上所述，C 语言有大量的函数可以包含，而我们在程序中使用了其中一个：格式化打印命令 printf。它是标准输入输出库的一部分，简称为\
    \ stdio。因此，这一行的作用是警告编译器程序需要将 stdio 库作为编译过程的一部分包含\n\n```c\nvoid main ()\n```\n\n\
    C 是一种基于函数的语言；每个程序由若干函数组成。每个函数接收零或多个参数，并返回一个单一的值。函数定义由函数返回值的规范（在本例中为 void）、函数名称（在本例中为\
    \ main）以及圆圆括号内的参数列表（再次为 void）。\n\n每个 C 程序必须包含一个名为 main 的函数，当你运行编译后的程序时，main 函数是第一个执行的。\n\
    \n"
