    # 弹出菜单\n\n工具栏是向应用程序添加菜单最常见的方法，但也可以使用非常相似的代码来添加点击按钮、树视图或其他各种部件时产生的弹出菜单。\n\n创建以下处理函数，并将其连接到按钮的点击（clicked）信号。\n\
