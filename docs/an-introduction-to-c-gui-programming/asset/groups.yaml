  mdcn: "\n# 第 5 章\n\n# 指针\n\n指针 - 变量既有地址也有名称。\n\n“指针”一词曾让许多初学者 C 程序员心生胆畏，但一旦你理解了它们，指针就是该语言中一个非常有用的特性。在现实中，它们并不复杂，但在使用它们时很容易产生困惑，所以让我们尽量避免这种情况……\n\
    \n还记得我们看过的变量的声明吗？在 C语言中，在使用变量之前必须对其进行声明——告诉编译器它是什么类型、叫什么名字——因为声明允许编译器分配一块内存来存储该变量。因此，对于你声明的每一个变量，编译器都会为该变量留出一块内存，并且编译器会记住哪个特定的内存块被哪个变量使用。\n\
    \n## 什么是指针？\n\n指针仅仅是包含变量的内存块的地址；仅此而已。所以，如果你声明了一个变量以及指向该变量的指针，你可以通过两种方式访问该内存块中的值：通过变量名，或者通过指针。\n\
    \n让我们来看一个简单的例子：\n\n```c\n#include <stdio.h>\n\nvoid main(void)\n{\n    int a;\n\
    \    int *ptr_to_a;\n\n    ptr_to_a = &a;\n\n    a = 5;\n    printf(\"The value\
    \ of a is %d\\n\", a);\n\n    *ptr_to_a = 6;\n    printf(\"The value of a is %d\\\
    n\", a);\n\n    printf(\"The value of ptr_to_a is %d\\n\", ptr_to_a);\n    printf(\"\
    It stores the value %d\\n\", *ptr_to_a);\n    printf(\"The address of a is %d\\\
    n\", &a);\n}\n```\n\n逐行来看，第一行是我们已经熟悉的：我们声明了一个整数变量 `a`。但这是什么？\n\n```c\nint *ptr_to_a;\n\
    ```\n\n这看起来像是在声明另一个整数变量，不是吗？但仔细看，变量名开头的的星号 `*` 表示这并不是在声明一个整数变量，而是一个指向整数变量的指针。\n\
    \n所以我们现在有了一个名为 `a` 的整数，有了一个指向整数变量的指针 `ptr_to_a`。但它们内部实际上还没有任何值；它们都是未初始化的。把指针命名为\
    \ `ptr_to_a` 固然，但它不知道 `a` 是什么（或在哪里），所以我们用下一行来修复这个问题。\n\n```c\nptr_to_a = &a;\n\
    ```\n\n这是 C 语言中的关键部分：变量名前的符号 `&` 表示变量的地址；因此 `&` 意味着变量 `a` 在内存中的地址。正如我们上面所说，指针就是变量的地址。所以这一行将\
    \ `ptr_to_a` 初始化为 `a` 的地址，`ptr_to_a` 现在是一个指向变量 `a` 的有效指针，所以我们现在可以使用它了。\n\n接下来两行很熟悉：我们将\
    \ `a` 设置为 5，为了检查操作是否成功，我们打印了它的值。让我们尝试做同样的操作，但是使用指针。\n\n```c\n*ptr_to_a = 6;\n\
    ```\n\n又是那个星号，但用法与之前略有不同。在声明变量时，在它的名字前加星号表示该变量是一个指针。但一旦指针存在，在它的名字前面加星号就意味着该指针所指向的变量；这被称为**解引用**（dereferencing\
    \ pointer）。所以这一行告诉编译器将指针 `ptr_to_a` 指向的变量设置为 6。我们知道 `ptr_to_a` 指向的变量是谁，我们在几行前已经设置好了，所以这一行只是将\
    \ `a` 设置为 6 的另一种方式；事实上，如果我们打印 `a` 的值，它已经变成了 6。\n\n接下来的行有助于帮助你在脑中理清指针、变量和地址之间的关系。\n\
    \n```c\nprintf(\"The value of ptr_to_a is %d\\n\", ptr_to_a);\n```\n\n在这一行中，我们打印的是\
    \ `ptr_to_a` 的值，而不是它指向的值，而是指针本身的值。这会打印出一个很大的数字，因为它是 `a` 所在的内存地址。\n\n```c\nprintf(\"\
    It stores the value %d\\n\", *ptr_to_a);\n```\n\n在这一行中，我们打印的是 `ptr_to_a` 指向的值，注意名字前的星号。这打印的是\
    \ `a` 的值。\n\n```c\nprintf(\"The address of a is %d\\n\", &a);\n```\n\n在这一行中，我们打印的是\
    \ `a` 本身的地址——注意名字前的 `&` 符号。同样，这打印出一个很大的数字，与我们上面打印的 `ptr_to_a` 的值相同。\n\n| 当我第一次学习指针时，发现大声说出某行代码在做什么很有帮助——`*`\
    \ 是“所指向的内容”，而 `&` 是“……的地址”…… | 当这两个概念在脑海中固定后，你基本上理解了指针 |\n\n在处理指针时需要记住的关键点是：你不能只声明一个指针，你还需要声明并关联你想要指向的变量。当指针被创建时，它指向内存中的一个随机位置；如果你尝试向它写入内容，可能会导致各种错误，甚至导致计算机完全崩溃！在对指针进行任何操作之前，务必确保你的指针指向了某个东西。\n\
    \n指针是 C 语言允许你在某些情况下（强制性地）思考计算机实际硬件的方式之一——深入理解指针可以让你很好理解编译器是如何处理内存的。\n\n# C 语言与\
    \ GUI 编程简介\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_32_0.png)\n\n指针是 C 语言的一个强大特性。它们允许你直接操作内存地址，这对于动态内存分配、数据结构和高效的数组传递非常有用。\n\
    \n> 始终要有指向的对象！\n\n## 空指针与类型转换\n\n你也可以定义一个指针而不说明它指向什么种类型的变量；这就是空指针，写作为 `void *`。（注：此处存在大量重复文本，已根据要求去重并翻译）。类型转换是告诉编译器如何解释内存。\n\
    \n"
