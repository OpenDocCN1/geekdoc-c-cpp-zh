  - '[PAGE 134]


    # Chapter 25


    # Glade


    Use this layout editor to more easily create window layouts for applications


    As can be seen in the previous chapters, creating widgets with GTK is a lot easier
    than doing it all from scratch by writing pixels to screen buffers, you can still
    end up with quite a lot of code for even a fairly simple window layout, and you
    do have to think quite carefully about the code you are writing to make sure the
    window looks how you want it to. It''s also not ideal that you can''t actually
    see what the window will look like until you run the application.


    Fortunately, there is a way to work on the layout of a window without having to
    write all its code, and that is to use a layout editor GTK allows the layout of
    widgets on a window to be defined in an XML file, which is then loaded and drawn
    on the screen when the application runs - you still need to link up the behaviour
    of any widgets to code, but the appearance of the widgets can be determined in
    advance. A layout editor is a useful tool to create such an XML file.


    The most widely used layout editor for GTK is a tool called Glade. There are two
    versions of Glade, one for GTK 2 and one for GTK 3 applications; they aren''t
    interchangeable, so you do need to use the correct one. The version to create
    GTK 3 applications is called ''glade''. And, just to be perverse, the version
    you need to create GTK 2 applications is called ''glade-3''. (Yes, that is counter-intuitive
    and annoying!)


    The first thing we need to do is install glade-3. At a terminal, type sudo apt-get
    install glade-3, and answer yes to any prompts. You should then have an entry
    labelled ''Glade'' in the Programming menu on your desktop. If you launch it,
    you''ll see a screen like the one shown below.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_134_0.png)'
  - '[PAGE 135]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_135_0.png)


    # The Glade layout editor


    This is the basic design screen in Glade. On the left side is a palette of all
    the widgets available. In the centre is the area where you actually design your
    window, and on the right is an area which allows you to set the properties of
    individual widgets.


    # Using Glade to create a layout file


    We''ll create a simple window for our application, the first thing we need to
    do is to add a top-level window. Under the palette section labelled ''Toplevels'',
    the top left entry is a GtkWindow - if you hover over it with the mouse, a tooltip
    will pop up with the label ''Window'' to confirm this. Just click on this icon
    to add a blank window to the design area in the centre of the screen:'
  - '[PAGE 136]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_136_0.png)


    An empty window


    Next, let''s add a VBox to allow us to put some widgets in. The widget palette
    has a section labelled: Containers, in which the first two entries are an HBox
    and a VBox - click the VBox, and then move the cursor into the blank window and
    click within it. A dialog will pop up asking how many items you want in the VBox
    - set it to 2, and click ''Create'':'
  - '[PAGE 137]


    # Adding a vertical box


    You''ve now got a blank window with a line across the middle, showing the VBox.
    We''re going to add a label to the top, and a button to the bottom. Find these
    in the ''Control and Display'' section of the palette - first click on each in
    the palette, and then click in the relevant VBox in the design area to add them.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_137_0.png)'
  - '[PAGE 138]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_138_0.png)


    +   - With a label and a button added:


    If you look at the top of the right-hand column, you''ll see the hierarchy of
    widgets being displayed - a GtkWindow, containing a GtkBox containing a GtkLabel
    and a GtkButton. If you click on one of the widgets in the hierarchy, the options
    displayed in the tabbed area at the bottom of the right-hand column will be those
    for that widget.


    Click on the GtkLabel and scroll through the options on the ''General'' tab, you''ll
    find a section labelled ''Edit label appearance'', including the entry ''Label''
    - use this to set the text in the label to whatever you want.'
  - '[PAGE 139]


    ![](img/6a7eee5b22417c3d49170130a20b16f2_139_0.png)


    The widget properties editor


    Click on the GtkButton, and find the Label section for it - it''s under ''Label
    with optional image'' – change the label for the button to ''Quit'' at the bottom
    of the right-hand column – it is worth investigating the options on all the tabs
    at go into here, but of particular interest are those on the ''Packing'' tab,
    these allow you to expand the expand, fill and padding options which were available
    when adding widgets to boxes code if you play with them, you can get a good feeling
    for how much control you have over layout of the window, particularly when combining
    multiple boxes inside each, as Glade allows you to do.


    The other thing that it is important to note about right hand column is that Glade
    assigns every widget name – it can be seen in the hierarchy list at the top, and
    as the last entry on the ''General'' tab Glade assigns names as name of the widget
    type followed by a number, but you can change these if you want But there is one
    vital rule – every widget in a layout file must have a unique name If two widgets
    have the same name, the layout file is invalid and will not load correctly.'
  - "[PAGE 140]\n\n# AN INTRODUCTION TO C AND PROGRAMMING\n\nYour button and label\
    \ widgets should have the names button1' and label1', and your window should be\
    \ Window1 - remember these; as they are important when linking the code to the\
    \ layout file. For now, save your layout as mylayout.glade by choosing the 'Save\
    \ As' option in the 'File' menu (You can select one of two different formats on\
    \ the window - use the default GtkBuilder option) Make sure you save the file\
    \ in the same directory where you are storing your GTK source code.\n\n# Using\
    \ a layout file in a GTK application\n\nNow we need to load the layout file into\
    \ some GTK code. Try the following:\n\n```\n#include <gtk/gtk.h>\n\nvoid main\
    \ (int argc, char *argv[]) {\n  gtk_init(&argc, &argv);\n\n  GtkBuilder *builder\
    \ = gtk_builder_new();\n  gtk_builder_add_from_file(builder, \"mylayout.glade\"\
    , NULL);\n\n  GtkWidget *win = (GtkWidget *) gtk_builder_get_object(builder, \"\
    window1\");\n  gtk_widget_show_all(win);\n\n  gtk_main();\n}\n```\n\nThe gtk_init\
    \ and gtk_main calls are the same as we have seen before, but the code between\
    \ them uses a GtkBuilder, a code object which reads in and processes a layout\
    \ file. We create a GtkBuilder object.\n\n```\nGtkBuilder *builder = gtk_builder_new();\n\
    ```\n\nWe then read the layout file into the builder.\n\n```\ngtk_builder_add_from_file(builder,\
    \ \"mylayout.glade\", \"window1\", NULL);\n```\n\nThe widgets which we created\
    \ in the layout file can now all be accessed by calls to gtk_builder_get_object,\
    \ and used as before So we get the object which was named window1 in the layout\
    \ file.\n\n```\nGtkWidget *win = (GtkWidget *) gtk_builder_get_object(builder,\
    \ \"window1\");\n```"
  - "[PAGE 141]\n\nAnd we show it as before:\n\n```\ngtk_widget_show_all (win);\n\
    ```\n\nIf you build and run this code, our simple window should be displayed on\
    \ the screen:\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_141_0.png)\n\nThe window\
    \ created in Glade when run\n\nAs mentioned above, layout files control the appearance\
    \ of a window to make the widgets do things, we need to connect signals as before,\
    \ so let's modify our code accordingly.\n\n```\nvoid on_destroy (GtkWidget *wid,\
    \ gpointer ptr)\n{\n    gtk_main_quit(NULL);\n}\n\nvoid main (int argc, char *argv[])\n\
    {\n    gtk_init(&argc, &argv);\n\nGtkBuilder *builder = gtk_builder_new (());\n\
    \    gtk_builder_add_from_file (builder, \"mylayout.glade\", NULL);\n\nGtkWidget\
    \ *win = (GtkWidget *)gtk_builder_get_object (builder, \"window\");\nGtkWidget\
    \ *btn = (GtkWidget *)gtk_builder_get_object (builder, \"button\");\n    g_signal_connect\
    \ (btn, \"clicked\", G_CALLBACK(on_destroy), NULL);\n\n    gtk_widget_show_all\
    \ (win);\n    gtk_main ();\n}\n```"
  - '[PAGE 142]


    This time, we also get the button widget from the builder and connect the end_program
    callback back to g_signal_connect, as we''ve done before Build and run, and this
    time the button should close the program.


    Using layout files can make the amount of code you need to write a lot shorter,
    and the use of Glade makes it easier to create complex interfaces with more customisation
    of your widgets. For small applications with a simple window, it''s probably more
    straightforward just to do everything in C, but for anything more complex, using
    a layout file can make the code a lot more readable.


    # Next steps


    One thing which GTK should be obvious to anyone who has worked through this book
    and reached this point is that GTK is a fairly huge subject! There are dozens
    of widgets, and hundreds of different ways they can be configured and used - any
    comprehensive guide to using them would run into several hundred pages.


    The best reference to GTK 2 - and the best place to find further information if
    you want to do more with it - is the official developer documentation, which can
    be found online at developer.gnome.org/gtk2/stable. This gives far more detail
    on every aspect of GTK - the reference section listing all the functions associated
    with each widget is particularly useful.


    Hopefully this book has given you an idea of where to get started with GTK programming,
    and enough of a foothold to be able to experiment for yourself. Happy GUI designing!'
