    , G_CALLBACK(end_program), NULL);\n\n  GtkWidget *btn2 = gtk_button_new_with_label(\"\
    exit\");\n  g_object_set(G_OBJECT(btn2), \"relief\", GTK_RELIEF_NONE, NULL);\n\
    \n  GtkWidget *box = gtk_box_new(FALSE, 5);\n  gtk_pack_start(GTK_BOX(box), btn2,\
    \ TRUE, TRUE, 0);\n  gtk_pack_start(GTK_BOX(box), btn, TRUE, TRUE, 0);\n  gtk_container_add(GTK_CONTAINER(win),\
    \ box);\n  gtk_widget_show_all(win);\n\n  gtk_main();\n}\n```\n\n这是来自之前示例的熟悉代码，但高亮的行是新的。\n\
    `g_object_set` 接收参数为组件名称，后跟一个 NULL 终止符、属性名称列表和属性值。在这种情况下，我们正在将 `GtkButton` `btn2`\
    \ 的 `relief` 属性设置为 `GTK_RELIEF_NONE`。\n`GtkButton` 的 `relief`（凹凸）控制边框的外。某些 GTK\
    \ 组件的边缘应用了某种程度的阴影以提供 3D 效果——默认情况下，`GtkButton` 应用了这种阴影，使得按钮看起来略微突出窗口背景。通过将 `relief`\
    \ 设置为 `GTK_RELIEF_NONE`，3D 效果会被移除——如果你运行此程序，你应该看到按钮之间的差异。\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_131_0.png)\n\
