    \n## 字符串\n\n在 C 语言中，字符串只是另一个数组，它是单字符的数组。正如我们在第 2 章看到的，`char` 是 C 中的一种特定类型，占用一个字节，这足够容纳一个字符。一个包含十个字符的字符串将：\n\
    \n```c\nchar mystery[10];\n```\n\n需要记住的一点是，C 中的字符串必须始终以一个字节零字节结尾，并且存储这个最终零（称为终止符）所需的内存必须在声明字符串时进行分配。因此，声明为十个字符数组的\
    \ `mystery` 只能包含九个或更少的字母。\n\n## string.h\n\n字符串以单字符数组的形式存储，最后一个字符之后的元素被设置为零。\n\
    \n```c\n#include <stdio.h>\n\nvoid main (void) {\n    char str1[10] = \"first\"\
    ;\n    char str2[10] = \"second\";\n    char str3[20];\n\n    char *src, *dst;\n\
    \n    src = str1;\n    dst = str3;\n    while (*src != 0) {\n        *dst = *src;\n\
    \        src++;\n        dst++;\n    }\n    src = str2;\n    while (*src != 0)\
    \ {\n        *dst = *src;\n        src++;\n        dst++;\n    }\n    printf(\"\
    %s + %s = %s\\n\", str1, str2, str3);\n}\n```\n\n你可以使用方括号中的索引来访问字符串中的单个字符，也可以使用指针。这里有一个使用指针的示例：\n\
    \n## C 编程简介\n\n首先，我们创建两个字符串 - `str1` 为 'first'，`str2` 为 'second' - 然后我们分配一个空字符串\
    \ `str3` 来存放结果。\n\n然后，我们创建了一对 `char` 指针，让 `src` 指向 `str1` 的开头（'first' 中的 f），让\
    \ `dst` 指向空字符串 `str3` 的开头。接着我们进行循环，将 `src` 处的内容复制到 `dst`，然后将两个指针都移动一位，直到找到终止 `str1`\
    \ 的零。\n\n然后我们让 `src` 指向 `str2` 并再次执行操作，直到找到 `str2` 结尾的零。最后，我们在 `str3` 的末尾写入一个零以终止它。注意用于打印字符串的使用的格式说明符；`%s`\
    \ 用于打印字符串，它将显示从提供的参数指针开始的每一个字符，直到找到第一个终止零为止（如果你想打印单个字符，可以使用格式说明符 `%c`）。\n\n##\
    \ 写入字符串\n\n由于字符串变量名仅是指向字符串第一个字符的指针，因此你不能使用等号来设置整个字符串的值。你可以在像上面那样在声明时初始化字符串变量，但如果你想稍后设置或更改它怎么办？\n\
    \n有几种方法可以实现，但最有用的是 `printf` 函数；这是我们见过的 `printf` 的版本，它可以将任意文本写入字符串变量。唯一的区别是它接收的第一个参数是字符串变量名，并且是写入该变量而不是终端：\n\
    \n```c\n#include <stdio.h>\n\nvoid main(void)\n{\n    int val = 12;\n    char\
