    more carefully,

    an asterisk at the start of the variable name indicates that this is not declaring
    an integer

    variable, but a pointer to an integer variable.


    So we now have an integer called a, and we have a pointer to an integer variable,

    ptr_to_a But neither of them actually has a value in it yet; they are both uninitialised.

    It''s all very well calling the pointer ptr_to_a, but it has no idea what (or
    where) a is, so we''ll

    fix that with the next line.


    ```

    ptr_to_a = &a;

    ```


    This is the important bit in C: the symbol & before a variable name means address
    of the

    variable; so & means the address in memory of the variable a. And as we said above,

    pinter is the address of a variable. So this line initializes ptr_to_a to be the
    address of a,

    ptr_to_a is now a valid pointer to the variable a, so we can now use it.


    The next two lines are familiar: we set a to 5, and just to check that worked,
    we print its

    value. So let''s try doing the same thing, but with the pointer.


    ```

    *ptr_to_a = 6;

    ```


