    \ you declare a variable and a pointer to that variable, you can access the value\
    \ in that block of memory in two ways: either with the variable name, or with\
    \ the pointer.\n\nLet's look at a simple example:\n\n```\n#include <stdio.h>\n\
    \nvoid main(void)\n{\n    int a;\n    int *ptr_to_a;\n\n    ptr_to_a = &a;\n\n\
    \    a = 5;\n    printf(\"The value of a is %d\\n\", a);\n\n    *ptr_to_a = 6;\n\
