    # AN INTRODUCTION TO C AND PROGRAMMING


    # ARITHMETIC SHORTHAND

    allows shortcuts for some common operations (for example instead of typing a =
    a + 1 you can just enter a++ or a -= 3 a *= 3)


    Don''t forget to use %f instead of %d as the print specifier when changing

    the int values to float values in the example


    ![](img/6a7eee5b22417c3d49170130a20b16f2_16_0.png)


    # DECIMAL PLACES

    you can set the number of decimal places to display for a floating-point type
    using

    printf by putting a decimal point and the number of places between the % and the
    f

    %.3f will show a float value with three digits after the decimal point


    Other types

    Another common variable type is char; a character value This is used, as the name
    suggests,

    to store a single character The ASCII character encoding uses a single value between
    0 and

    127 for each letter, number, and punctuation symbol, so a char is a single byte;
    it''s really just

    an integer value which can only hold small numbers The compiler allocates several
    bytes to

    to store an int or a float, but only allocates a single byte of memory to store
    a char.'
  - "[PAGE 17]\n\nThere are also modifiers which can be applied to variable types.\
    \ Both char and int can be used to store both positive and negative numbers, but\
    \ by applying the unsigned modifier when one is declared, they can be restricted\
    \ to only store positive values. So...\n\nchar a;\n\n..declares a variable which\
    \ can hold values from -128 to 127, while...\n\nunsigned char a;\n\n..declares\
    \ a variable which can hold values from 0 to 255.\n\nWhen doing arithmetic, it\
    \ is important to make sure that the answers to any calculation will fit into\
    \ the variable. If, say, you have a char containing the value 100, and you add\
    \ 30 to it, you would expect to end up with the result 130 – but as above, a char\
    \ can only hold values up to 127. So the value your char will actually end up\
    \ containing is -126, because values over 127 – the highest value a char can store\
    \ – wrap around to the lowest value (-128) and start counting up from there. This\
    \ ‘overflow’ behaviour is a common cause of bugs in C programs which do arithmetic.\n\
    \n> REMEMBER PRECEDENCE\n obeys the common rules for operator precedence - so\
    \ a = a + 2 * 3 evaluates\nthe multiply first and then adds the result to a. You\
    \ can use brackets to change\nprecedence - a = (a + 2) * 3 gives a=6.\n\nThat\
    \ gives you some idea about how C handles numbers, and how you can use it for\
    \ arithmetic; in the next chapter, we'll look at how to use the results of calculations\
    \ to make decisions."
