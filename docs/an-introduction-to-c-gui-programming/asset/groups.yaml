  - '[PAGE 98]


    # Spin buttons


    There are various ways for the user to enter data. Quite often they need to select
    one of a number of options rather than being given a box and asked to type into
    it. GTK provides a number of widgets for this purpose, which is closely related
    to the GtkEntry, the GtkSpinButton.

    A spin button is used to enter a numeric value in a certain range You specify
    the minimum and maximum values, and by how much the value should change on each
    press of the button. This gives a text entry control - which the user can still
    type into - with an easy way of changing the value. If the user types a value
    which is outside the limits you set, it is automatically rounded to the closest
    value within the limits when you try to read it.


    We only need to change one line to convert the GtkEntry to a GtkSpinButton in
    our example above. Replace:


    ```

    txt gtk_entry_new ();

    ```


    ...with:


    ```

    GtkObject *adj = gtk_adjustment_new (0, -10, 10, 1, 0, 0);

    txt gtk_spin_button_new (GTK_ADJUSTMENT (adj), 0, 0);

    ```


    This changes txt from a GtkEntry to a GtkSpinButton. We can see that one of the
    arguments to the gtk_spin_button_new function is something called GtkAdjustment
    - what''s?

    GtkAdjustment is used to set the range of values that a spin button (and a few
    other widgets with similar behaviour) can take. The gtk_adjustment_new function
    takes arguments which specify, in order, the default value (0 in this case), the
    minimum value (-10), the maximum value (10) and the step size (1). (The last two
    arguments specify ''page increments, which are used where there are two different
    sets of buttons to change the values - a spin button doesn''t use these, so they
    can be set to zero).

    GtkAdjustment is passed as an argument to the gtk_spin_button_new function.

    The other two arguments are the climb rate - how fast the value changes when the
    button is held down - and the number of decimal places to be shown on value.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_98_0.png)


    +   - GtkSpinButton instead of the GtkEntry


    Build and run the new version of the code, the text entry box now has two small
    buttons at the right-hand side; these can be used to change the value. You can
    still type into the box, if'
  - '[PAGE 99]


    you type a value that isn''t a number, or is outside the range specified in the
    GtkAdjustment, it will be corrected to a value within a range when one of these
    buttons – or ‘Copy button’ – is pressed.


    # Toggle buttons


    One easy way to get input from the user is by the use of buttons to select an
    option. GTK offers several widgets for this purpose, two of the more useful are
    check buttons – boxes that can be ticked or unt – and radio buttons – selectors
    in which only one member of a group can be active at a time. These are both children
    of the GtkToggleButton widget, which is itself a child of the GtkButton widget
    we have already used several times, toggle button is a button which can be in
    either a selected or an unselected condition.


    # Check buttons


    Check buttons are the simplest of the two, so we’ll look at those first. A GtkCheckButton
    is a box which can be empty or have a tick mark in it; clicking on it toggles
    between those two states. Creating one is as easy as:


    ```

    GtkWidget *chk = gtk_check_button_new_with_label ("My check");

    ```


    This creates a check button and a label to its left with the supplied text in
    it. (There is also a function gtk_check_button_new, which creates the check box
    without the label – this makes things tidier if you have a label for it elsewhere
    in your window.) Try replacing btn2 in the previous example with a checkbox like
    chk – it should look like this:


    ![](img/6a7eee5b22417c3d49170130a20b16f2_99_0.png)


    A GtkCheckButton at the top-right of the window


    By default, a check button which has just been created is in the unchecked state.
    To check the button, you call


    ```

    gtk_toggle_button_set_active(GTK_TOGGLE_BUTTON (chk), TRUE);

    ```


    Setting the button’s active state to TRUE checks the box, setting it to FALSE
    unchecks it. There is a corresponding function to read the active state of a toggle
    button – to read whether a check button is currently checked into a variable,
    do:'
  - "[PAGE 100]\n\n# INTRODUCTION TO C PROGRAMMING\n\n```\nint state = gtk_toggle_button_get_active(GTK_TOGGLE_BUTTON\
    \ (chk));\n```\n\nThe value of state will be 1 if the button is checked, or 0\
    \ otherwise.\nYou can also connect a handler to the toggled signal of a check\
    \ button with signal connect - this is equivalent to connecting to the clicked\
    \ signal of a regular GtkButton, as we have seen in previous examples:\n\n```\n\
    g_signal_connect(chk, \"toggled\", G_CALLBACK(check_toggle, NULL);\n```\n\nThe\
    \ handler for a toggled call looks like this:\n\n```\nvoid check_toggle(GtkWidget\
    \ *wid, gpointer ptr)\n{\n    printf(\"The state of the button is %d\\n\", gtk_toggle_button_get_active(GTK_TOGGLE_BUTTON\
    \ (wid)));\n}\n```\n\nNote that the first argument of any handler callback is\
    \ always a pointer to the widget that generated the signal so we check the state\
    \ of the check button by calling gtk_toggle_button_get_active on the pointer received\
    \ as the first argument to its handler.\n\n# Radio buttons\n\nRadio buttons can\
    \ be viewed as a group of check buttons, in which one and only one of group is\
    \ selected at a time - checking any button in the group automatically unchecks\
    \ all other buttons in the group. These are shown as circular indicators:\nThe\
    \ code controlling radio buttons is almost identical to for check buttons; their\
    \ active state can be set or checked with the same commands, and they generate\
    \ a toggled signal when clicked.\n\nThe significant difference between radio button\
    \ and check button code is that radio buttons need to be assigned to a group of\
    \ radio buttons; this is required so that the link between the set of buttons\
    \ is established so that GTK knows which buttons need to be unchecked when another\
    \ is clicked.\n\nRadio buttons are created using the function gtk_radio_button_new_with_label\
    \ - this takes one additional parameter over gtk_check_button_new_with_label,\
    \ which is the group to which the button belongs. When the first button in a group\
    \ is created, this parameter is set to NULL:\n\n```\nGtkWidget *rad1 = gtk_radio_button_new_with_label(NULL,\
    \ \"Button 1\");\n```\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_100_0.png)"
  - "[PAGE 101]\n\nWhen second and subsequent buttons are created, the group of the\
    \ first button can be read\nwith the function gtk_radio_button_get_group passed\
