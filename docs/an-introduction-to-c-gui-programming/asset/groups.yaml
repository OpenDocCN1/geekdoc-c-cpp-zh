  md: "\n## Spin buttons\n\nThere are various ways for the user to enter data. Quite\
    \ often they need to select one of a number of options rather than being given\
    \ a box and asked to type into it. GTK provides a number of widgets for this purpose,\
    \ which is closely related to the GtkEntry, the GtkSpinButton.\n\nA spin button\
    \ is used to enter a numeric value in a certain range. You specify the minimum\
    \ and maximum values, and by how much the value should change on each press of\
    \ the button. This gives a text entry control - which the user can still type\
    \ into - with an easy way of changing the value. If the user types a value which\
    \ is outside the limits you set, it is automatically rounded to the closest value\
    \ within the limits when you try to read it.\n\nWe only need to change one line\
    \ to convert the GtkEntry to a GtkSpinButton in our example above. Replace:\n\n\
    ```\ntxt gtk_entry_new ();\n```\n\n...with:\n\n```\nGtkObject *adj = gtk_adjustment_new\
    \ (0, -10, 10, 1, 0, 0);\ntxt gtk_spin_button_new (GTK_ADJUSTMENT (adj), 0, 0);\n\
    ```\n\nThis changes txt from a GtkEntry to a GtkSpinButton. We can see that one\
    \ of the arguments to the gtk_spin_button_new function is something called GtkAdjustment\
    \ - what's?\n\nGtkAdjustment is used to set the range of values that a spin button\
    \ (and a few other widgets with similar behaviour) can take. The gtk_adjustment_new\
    \ function takes arguments which specify, in order, the default value (0 in this\
    \ case), the minimum value (-10), the maximum value (10) and the step size (1).\
    \ (The last two arguments specify 'page increments, which are used where there\
    \ are two different sets of buttons to change the values - a spin button doesn't\
    \ use these, so they can be set to zero).\n\nGtkAdjustment is passed as an argument\
    \ to the gtk_spin_button_new function.\n\nThe other two arguments are the climb\
    \ rate - how fast the value changes when the button is held down - and the number\
    \ of decimal places to be shown on value.\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_98_0.png)\n\
    \n- GtkSpinButton instead of the GtkEntry\n\nBuild and run the new version of\
    \ the code, the text entry box now has two small buttons at the right-hand side;\
    \ these can be used to change the value. You can still type into the box, if you\
    \ type a value that isn't a number, or is outside the range specified in the GtkAdjustment,\
    \ it will be corrected to a value within a range when one of these buttons – or\
    \ ‘Copy button’ – is pressed.\n\n## Toggle buttons\n\nOne easy way to get input\
    \ from the user is by the use of buttons to select an option. GTK offers several\
    \ widgets for this purpose, two of the more useful are check buttons – boxes that\
    \ can be ticked or unt – and radio buttons – selectors in which only one member\
    \ of a group can be active at a time. These are both children of the GtkToggleButton\
    \ widget, which is itself a child of the GtkButton widget we have already used\
    \ several times, toggle button is a button which can be in either a selected or\
    \ an unselected condition.\n\n## Check buttons\n\nCheck buttons are the simplest\
    \ of the two, so we’ll look at those first. A GtkCheckButton is a box which can\
    \ be empty or have a tick mark in it; clicking on it toggles between those two\
    \ states. Creating one is as easy as:\n\n```\nGtkWidget *chk = gtk_check_button_new_with_label\
    \ (\"My check\");\n```\n\nThis creates a check button and a label to its left\
    \ with the supplied text in it. (There is also a function gtk_check_button_new,\
    \ which creates the check box without the label – this makes things tidier if\
    \ you have a label for it elsewhere in your window.) Try replacing btn2 in the\
    \ previous example with a checkbox like chk – it should look like this:\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_99_0.png)\n\
    \nA GtkCheckButton at the top-right of the window\n\nBy default, a check button\
    \ which has just been created is in the unchecked state. To check the button,\
    \ you call\n\n```\ngtk_toggle_button_set_active(GTK_TOGGLE_BUTTON (chk), TRUE);\n\
    ```\n\nSetting the button’s active state to TRUE checks the box, setting it to\
    \ FALSE unchecks it. There is a corresponding function to read the active state\
    \ of a toggle button – to read whether a check button is currently checked into\
    \ a variable, do:\n\n# INTRODUCTION TO C PROGRAMMING\n\n```\nint state = gtk_toggle_button_get_active(GTK_TOGGLE_BUTTON\
    \ (chk));\n```\n\nThe value of state will be 1 if the button is checked, or 0\
    \ otherwise.\n\nYou can also connect a handler to the toggled signal of a check\
    \ button with signal connect - this is equivalent to connecting to the clicked\
    \ signal of a regular GtkButton, as we have seen in previous examples:\n\n```\n\
    g_signal_connect(chk, \"toggled\", G_CALLBACK(check_toggle), NULL);\n```\n\nThe\
    \ handler for a toggled call looks like this:\n\n```\nvoid check_toggle(GtkWidget\
    \ *wid, gpointer ptr)\n{\n    printf(\"The state of the button is %d\", gtk_toggle_button_get_active(GTK_TOGGLE_BUTTON\
    \ (wid)));\n}\n```\n\nNote that the first argument to the toggled signal is the\
    \ widget itself, the second is the name of the signal, and the third is the callback\
    \ function. The fourth argument is for data passed to the callback.\n\n## Radio\
    \ buttons\n\nRadio buttons can be viewed as a group in which only one can be selected\
    \ at a time. The significant difference between radio buttons and check buttons\
    \ is that radio buttons need to be associated with a group in order for the link\
    \ to work. Here's how to create a group and add radio buttons to it:\n\n```\n\
    GtkButtonGroup *group = gtk_button_group_new();\nGtkWidget *rad1 = gtk_radio_button_new_with_label(group,\
    \ \"Button 1\");\nGtkWidget *rad2 = gtk_radio_button_new_with_label(group, \"\
    Button 2\");\n```\n\nEvery button in the group needs to be linked with another\
    \ button in the group. If you've linked them correctly, then when you click 'Button\
    \ 2', it will be selected and 'Button 1' will be unselected, and vice versa.\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_101_0.png)\n\nTwo GtkButtons at the\
    \ top of the window\n\n## Chapter 19\n\n## Combo boxes and list stores\n\nCreate\
    \ combo boxes for user input and associate list stores with them\n\nWidgets like\
    \ spin buttons, radio buttons, and check buttons are useful to allow a user to\
    \ make selections between small numbers of options, but sometimes we need to offer\
    \ a larger number of options. A combo box is a good way of offering the user a\
    \ selection of choices without taking up huge amounts of space; GTK offers two\
    \ types of combo box.\n\n### Text combo boxes\n\nThe simpler kind of combo box\
    \ is the GtkComboBoxText, which only allows each option to be plain text. Here's\
    \ how to create one\n\n```\nGtkWidget *comb = gtk_combo_box_text_new ();\n\ngtk_combo_box_text_append_text\
    \ (comb, \"Option 1\");\ngtk_combo_box_text_append_text (comb, \"Option 2\");\n\
    gtk_combo_box_text_append_text (comb, \"Option 3\");\n\ngtk_combo_box_set_active\
    \ (comb, 0);\n```\n\nThe gtk_combo_box_text_new function creates an empty combo\
    \ box, and entries can be added to it (in the order that they should appear, from\
    \ top to bottom) using gtk_combo_box_text_append_text.\n\nThe final function call\
    \ shown above, gtk_combo_box_set_active, sets the initial value of the combo box\
    \ - in this case, setting it to 0 chooses the first option added to the.\n"
  mdcn: "\n\n## 数字调节旋按钮 (Spin buttons)\n\n用户有多种输入数据的方式。通常，他们需要从多个选项中选择一个，而不是被给一个框并要求输入内容。GTK\
    \ 为此目的提供了许多控件，它们与 GtkEntry、GtkSpinButton 密切相关。\n\n数字调节旋按钮用于在特定范围内输入数值值。你可以指定最小值、最大值，以及每次按下按钮时数值变化的步长。这提供了一个文本输入控件——用户仍然可以向其中输入——同时也提供了一种更改值的方便方法。如果用户输入了超出你设置的范围的值，当你尝试读取它时，它会自动舍入到范围内最接近的值。\n\
    \n在上面的示例中，我们只需要更改一行代码即可将 GtkEntry 转换为 GtkSpinButton。将：\n\n```\ntxt gtk_entry_new\
    \ ();\n```\n\n替换为：\n\n```\nGtkObject *adj = gtk_adjustment_new (0, -10, 10, 1,\
    \ 0, 0);\ntxt gtk_spin_button_new (GTK_ADJUSTMENT (adj), 0, 0);\n```\n\n这使得 txt\
    \ 从 GtkEntry 变为 GtkSpinButton。我们可以看到 `gtk_spin_button_new` 函数的参数之一被称为 GtkAdjustment\
    \ 的东西——它是什么？\n\nGtkAdjustment 用于设置数字调节旋按钮（以及其他具有类似行为的控件）可以取值的值范围。`gtk_adjustment_new`\
    \ 函数的参数按顺序指定了默认值（在本例中为 0）、最小值（-10）、最大值（10）和步长（1）。（最后两个参数指定“页增量”，用于那些有两组不同的按钮来更改值的情况——数字调节旋按钮不使用这些，因此它们可以设置为\
    \ 0）。\n\nGtkAdjustment 作为参数传递给 `gtk_spin_button_new` 函数。\n\n另外两个参数是爬升速率——即按住按钮时值变化的速度——以及数值上显示的小数位数。\n\
    \n![](img/6a7eee5b22417c3d49170130a20b16f2_98_0.png)\n\n-   用 GtkSpinButton 代替\
    \ GtkEntry\n\n编译并运行新版本的代码，文本输入框现在右侧有两个小按钮；这些按钮可以用来更改值。你仍然可以向框内输入内容，如果你输入的值不是数字，或者超出了\
    \ GtkAdjustment 指定范围，当按下其中一个按钮（或“复制按钮”）时，它将被纠正为范围内的一个值。\n\n## 切换按钮 (Toggle buttons)\n\
    \n获取用户输入的一种简单方法是使用按钮来选择选项。GTK 为此目的提供了几个控件，其中两个比较有用的是复选按钮（check buttons——可以被勾选或取消勾选的框）和单选按钮（radio\
    \ buttons——在一组中同时只有一个成员处于激活状态的选择器）。它们都是 GtkToggleButton 控件的子控件，而该控件本身是我们已经使用过几次的\
    \ GtkButton 控件的子控件。切换按钮是一种处于已选中或未选中状态之一的按钮。\n\n## 复选按钮 (Check buttons)\n\n复选按钮是两者中最简单的，所以我们先看它们。一个\
    \ GtkCheckButton 是一个可以是空框也可以带有勾选标记的框；点击它可以在这两种状态之间切换。创建一个复选按钮就像这样简单：\n\n```\n\
    GtkWidget *chk = gtk_check_button_new_with_label (\"My check\");\n```\n\n这创建了一个复选按钮以及其左侧一个带有提供文本的标签。（还有一个函数\
    \ `gtk_check_button_new`，它会创建一个不带标签的复选框——如果你在窗口的其他地方有它的标签，这会让事情更整洁。）尝试将上一个示例中的\
    \ `btn2` 替换为像 `chk` 的复选框——它看起来应该是这样：\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_99_0.png)\n\
    \n窗口右上角的复选按钮\n\n默认情况下，新建的复选按钮处于未勾选状态。要勾选按钮，你调用：\n\n```\ngtk_toggle_button_set_active(GTK_TOGGLE_BUTTON\
    \ (chk), TRUE);\n```\n\n将按钮的激活状态设置为 TRUE 会勾选方框，设置为 FALSE 则会取消勾选。有一个相应的函数来读取切换按钮的激活状态——要将复选按钮当前是否被勾选读取到一个变量中，请执行：\n\
    \n# C语言编程入门\n\n```\nint state = gtk_toggle_button_get_active(GTK_TOGGLE_BUTTON\
    \ (chk));\n```\n\n如果按钮被勾选，state 的值将为1，否则为 0。\n\n你也可以通过 `signal_connect` 为复选按钮的\
    \ `toggled` 信号连接一个处理函数——这等于我们在之前的示例中看到的连接到普通 GtkButton 的 `clicked` 信号：\n\n```\n\
    g_signal_connect(chk, \"toggled\", G_CALLBACK(check_toggle), NULL);\n```\n\n`toggled`\
    \ 用的处理函数如下：\n\n```\nvoid check_toggle(GtkWidget *wid, gpointer ptr)\n{\n    printf(\"\
    The state of the button is %d\", gtk_toggle_button_get_active(GTK_TOGGLE_BUTTON\
    \ (wid)));\n}\n```\n\n注意，toggled 信号的第一个参数是控件本身，第二个是信号名称，第三个是回调函数。第四个参数用于传递给回调函数的数据。\n\
    \n## 单选按钮 (Radio buttons)\n\n单选按钮可以被视为一组，其中一次只有一个能被选中。单选按钮和复选按钮之间的区别在于，单选按钮需要关联到一个组才能使链接生效。以下是创建一个组并向其中添加单选按钮的方法：\n\
    \n```\nGtkButtonGroup *group = gtk_button_group_new();\nGtkWidget *rad1 = gtk_radio_button_new_with_label(group,\
    \ \"Button 1\");\nGtkWidget *rad2 = gtk_radio_button_new_with_label(group, \"\
    Button 2\");\n```\n\n组中的每个按钮都需要与组中的另一个链接。如果你正确链接了它们，那么当你点击“Button 2”时，它会被选中而“Button\
    \ 1”会被取消选中，反之亦然。\n\n![](img/6a7eee5b22417c3d49170130a20b16f2_101_0.png)\n\n窗口顶部的两个\
    \ GtkButton\n\n## 第19章\n\n## 下拉框 (Combo boxes) 与列表存储\n\n创建下拉框并与其关联列表存储\n\n像数字调节旋按钮、单选按钮和复选按钮这样的控件允许用户在较少选项之间进行选择，但有时我们需要提供更多选项。下拉框是为用户提供选择范围而不占用大量空间的好方法；GTK\
    \ 提供了两种类型的下拉框。\n\n### 文本下拉框\n\n更简单的下拉框类型是 GtkComboBoxText，它允许每个选项仅纯文本。以下是创建它的方法：\n\
    \n```\nGtkWidget *comb = gtk_combo_box_text_new ();\n\ngtk_combo_box_text_append_text\
    \ (comb, \"Option 1\");\ngtk_combo_box_text_append_text (comb, \"Option 2\");\n\
    gtk_combo_box_text_append_text (comb, \"Option 3\");\n\ngtk_combo_box_set_active\
    \ (comb, 0);\n```\n\n`gtk_combo_box_text_new` 函数创建一个空的下拉框，可以使用 `gtk_combo_box_text_append_text`\
    \ 向其添加项目（按照它们应该出现的顺序，从上到下）。\n\n最后所示的函数调用 `gtk_combo_box_set_active` 设置了下拉框的初始值——在本例中，设置为\
    \ 0 选择了第一个添加到下拉框的选项。\n\n"
