    # Welcome to An Introduction to C & GUI Programming


    The C programming language was invented in the early 1970s, and since then has
    become one of the most popular and widely used general-purpose languages. C can
    be used to create simple command-line programs, or embedded code to operate the
    tiny microcontrollers in toasters and watches. At the other extreme, it can be
    used to create rich graphical desktop applications – in fact, most of Linux (and
    Raspberry itself) is written in it. It can give you control over the smallest
    details of how a processor operates, but is still simple to learn and read. The
    first part of this book is an introduction to programming in C for absolute beginners;
    the second part shows how to use C to create desktop applications for Raspbian,
    using the GTK toolkit. You don''t need any programming experience, and a Pi running
    Raspbian is all you need to get started.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_4_0.png)'
  - '[PAGE 5]


    # About the Author


    Simon Long is an engineer working for Raspberry Pi. He is responsible for the
    Raspberry Pi Desktop and its associated applications. Before joining Raspberry
    Pi, he worked for Broadcom, where he first met Eben Upton, and before that spent
    first ten years working as a software engineer and user interface designer for
    a major consultancy firm. In his spare time, he enjoys solving those really hard
    crosswords without any black squares.


    ![](img/6a7eee5b22417c3d49170130a20b16f2_5_0.png)'
