    We need need to create a GtkTreeView to display the list store. The first step
    of this is similar to the creation of the GtkListStore in the previous chapter
    - we associate the new GtkTreeView with the GtkListStore we created.


    ```

    GtkWidget *tv = gtk_tree_view_new_model (

    GTK_TREE_MODEL (ls));

    ```


    As with the combo box we need to create cell renderers for all the types of data
    we want to display in this case, we have two - a text renderer and a pixbuf renderer.


    ```

    GtkCellRenderer *prend = gtk_cell_renderer_pixbuf_new();

    GtkCellRenderer *trend = gtk_cell_renderer_text_new();

    ```


    Finally, we insert the columns we want to see into the tree view.


    ```

    gtk_tree_view_insert_column_with_attributes (

    GTK_TREE_VIEW (tv), -1, "Icon", prend, "pixbuf", 1, NULL);

    gtk_tree_view_insert_column_with_attributes (

    GTK_TREE_VIEW (tv), -1, "Option", trend, "text", 0, NULL);

    ```


    Each call to tree_view takes the tree itself as the first argument. The argument
    is the position of the column - this can either be the actual position, numbered
    from 0 at the left-hand side of the table, or here -1, which indicates that the
    column should be added as the next column; that is to the right of the rightmost
    column already already in the table. The next parameter is the title for the column
    (which can be shown at the top of the table), and then the renderer we created
    to be used for the column.


    The final arguments are passed to the cell renderer itself, and set an attribute
    of the renderer to the data in a column of the list store - in the first instance
    we use the ''pixbuf'' attribute of the pixbuf renderer to the data in column 1,
    and in the second we set the ''text'' attribute of the text renderer to the data
    in column 0 (Because it is possible to set multiple attributes on some renderers,
    the final argument is a NULL to indicate that there are no more attributes to
    set).


    Build and run the code, and see what happens - you should see something like the
    image overlay:


