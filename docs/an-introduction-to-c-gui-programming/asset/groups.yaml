  - '[PAGE 9]


    # Chapter 1


    # Getting started


    C is one of the most widely used programming languages

    learn how to use it to program the Raspberry Pi!


    # What''s so great about C?


    C is a very versatile and widely used programming language. It has been used to
    write pretty much everything, from low-level routines to control the hardware
    in embedded microcontrollers with graphical user interfaces. In spite of this
    huge flexibility, it is also relatively simple – the language only has about 20
    or so keywords, but there are huge libraries of additional functions that you
    can call on when you need them. In the first part of this book, we are going to
    concentrate on learning about the keywords, with a few of the more commonly used
    library functions; the second part of the book shows how to use the GTK library
    to make it easy to write graphical interfaces in C.


    Many of the languages you may have seen, such as Python, are all called interpreted
    languages. This means that the code you write is run directly; each line of code
    is read in and interpreted as you run it. C is different: it''s a compiled language.
    This means that the code you write, known as the source code, is never run directly.
    The source code is passed through a program compiler, which converts it into a
    machine-readable version called an executable or a binary; then you run the executable.


    This may seem complex, but it has a few advantages. First, it means that you don''t
    need to have a copy of C itself on every computer you want to run your program
    on; once compiled, the executable is standalone and self-contained. Second, the
    compilation process will find a lot of errors before you even run the program
    (but you won''t usually find all of them). importantly, the compilation process
    means that the time-consuming translation of readable code into machine-readable
    instructions has already happened, which means that compiled code generally runs
    many times faster than interpreted code would.


    # CHOOSE YOUR EDITOR


    You can use whatever editor you like to enter code, as long as it saves it as
    plain text. The Gesny editor included in Raspbian is a good choice, but you can
    also use Leafpad, nano, or any others that you prefer.'
  - "[PAGE 10]\n\n# WHITESPACE DOESN'T MATTER!\n\nUnlike Python, whitespace has no\
    \ significance in C - you can put spaces, tabs and new lines wherever you like\
    \ in a C program to make it readable.\n\n# Hello world - your first C program\n\
    \nWith all out of the way - which has hopefully made you think that C might be\
    \ worth learning - let's have a look at the first program everyone writes in any\
    \ language, the one that prints \"Hello World\" on the screen. Incidentallyally,\
    \ the tradition of writing a Hello World program was first introduced with the\
    \ original documentation describing C itself. Just think: no C, no Hello World...\n\
    \n```\n#include <stdio.h>\n\nvoid main ()\n{\n    /* A print statement */\n  \
    \  printf(\"Hello world!\\n\");\n}\n```\n\nHopefully not too frightening! Let's\
    \ look at it line by line.\n\n```\n#include <stdio.h>\n```\n\nThis is known as\
    \ a #include. As mentioned above, the C language has a large library of functions\
    \ that can be included, and we need to use one of them in this program the formatted\
    \ print command printf. This is part of the standard input-output library, or\
    \ stdio for short. So what this line does is to warn the compiler that the program\
    \ needs the stdio library to be included as part of the compile process.\n\n```\n\
    void main ()\n```\n\nC is a function-based language; every program is made up\
    \ of a number of functions. Each function takes zero or more arguments, and returns\
    \ a single value. A function definition consists of a specification of what the\
    \ function returns (in this case, a void), a function name (in this case, main)\
    \ and a list of arguments enclosed in round brackets (again, a void).\n\nEvery\
    \ C program has to include a function called main, when you run the compiled program,\
    \ the main function is the first thing that executes."
