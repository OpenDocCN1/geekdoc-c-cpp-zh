    \ `myprog` 的文件 - 尝试通过输入来运行它：\n\n```\n./myprog\n```\n\n搞定！你现在应该能在终端中看到：\n\nHello\
    \ World!\n\n```\nFile Edit Tabs Help\npi@raspberry:~ $ gcc -o myprog hello.c\n\
