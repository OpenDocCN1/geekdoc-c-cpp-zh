    \n剩余的参数控制动作区域显示哪些按钮。这是一个值对列表，每对第一个是显示在按钮上的标签，第二个是按钮被点击时生成的返回代码。列表以 `NULL` 值终止。\n\
    \n一旦创建了对话框，我们就调用 `gtk_dialog_run` —— 这显示对话框并允许用户与之交互。他们将操作对话框上的任何部件，但在此期间主窗口将被锁定；代码执行等待在\
    \ `gtk_dialog_run` 函数内部，直到动作区域中的按钮被点击。此时，你需要对对话框调用 `gtk_widget_destroy` 将其移除 ——\
