  trans: "\n高级 Windows 编程使用更高级的 Windows API 特性来构建复杂且快速的应用程序。本章将讨论更复杂的主题，例如程序的不同部分如何相互通信、如何管理内存、保持排序的高级方法，以及使用特殊的\
    \ Windows 特性来改进应用程序。\n\n## 核心思想\n\n- **进程间通信 (IPC)**：在不同进程之间共享信息的方法。\n- **内存管理**：有效利用使用和释放内存。\n\
    - **高级同步**：当同时使用多个线程时，确保线程安全并控制访问。\n- **Windows 特性**：使用特殊的 Windows 工具来获得更好的性能。\n\
    \n## 进程间通信 (IPC)\n\nIPC 帮助不同的程序进行通信并共享信息。Windows 为程序提供了多种相互通信的方式，例如命名管道、共享内存和消息队列。\n\
    \n### 命名管道\n\n命名管道是程序在网络上或在同一台计算机上进行通信的一种方式。它们允许单向或双向的通信。\n\n#### 创建命名管道\n使用 `CreateNamedPipe`\
    \ 创建命名管道。\n\n```cpp\nHANDLE hPipe = CreateNamedPipe(\n    TEXT(\"\\\\\\\\.\\\\\
    pipe\\\\MyPipe\"),   // 管道名称\n    PIPE_ACCESS_DUPLEX,             // 读取/写入访问\n\
    \    PIPE_TYPE_MESSAGE | PIPE_READMODE_MESSAGE | PIPE_WAIT, // 管道模式\n    1,  \
    \                            // 实例\n    1024 * 16,                      // 输出缓冲区大小\n\
    \    1024 * 16,                      // 输入缓冲区大小\n    0,                      \
    \        // 客户端超时\n    NULL                            // 默认安全属性\n);\n```\n\n\
    #### 连接到命名管道\n在服务器端使用 `ConnectNamedPipe`，在客户端使用 `CreateFile`。\n\n```cpp\nBOOL\
    \ connected = ConnectNamedPipe(hPipe, NULL);\n```\n\n在客户端：\n\n```cpp\nHANDLE hPipe\
    \ = CreateFile(\n    TEXT(\"\\\\\\\\.\\\\pipe\\\\MyPipe\"),   // 管道名称\n    GENERIC_READ\
    \ | GENERIC_WRITE,   // 期望访问\n    0,                              // 共享模式\n  \
    \  NULL,                           // 默认安全属性\n    OPEN_EXISTING,             \
    \     // 打开已有的管道\n    0,                              // 标志\n    NULL        \
    \                    // 模板文件\n);\n```\n\n### 共享内存\n\n共享内存让不同的程序使用同一部分内存。\n\n####\
    \ 创建文件映射对象\n使用 `CreateFileMapping` 创建文件映射对象。\n\n```cpp\nHANDLE hMapFile = CreateFileMapping(\n\
    \    INVALID_HANDLE_VALUE,            // 使用系统分页文件\n    NULL,                 \
    \          // 默认安全属性\n    PAGE_READWRITE,                 // 读取/写入访问\n    0, \
    \                             // 最大对象大小（高位字节）\n    1024 * 1024,              \
    \      // 最大对象大小（低位字节）\n    TEXT(\"SharedMemory\")             // 对象名称\n);\n```\n\
    \n#### 映射文件视图\n在进程可以使用的内存区域显示文件。\n\n```cpp\nLPVOID pBuf = MapViewOfFile(\n   \
    \ hMapFile,                       // 映射对象的句柄\n    FILE_MAP_ALL_ACCESS,       \
    \     // 期望访问\n    0,                              // 文件偏移高\n    0,          \
    \                    // 文件偏移低\n    0                               // 映射的字节数\n\
    );\n```\n\n### 消息队列\n\n消息队列允许应用程序相互通信，而不需要立即响应。\n\n#### 创建队列\n根据你正在使用的消息队列，使用\
    \ `CreateQueue` 或类似的函数。\n\n#### 发送和获取消息\n使用 `SendMessage` 和 `PostMessage` 在窗口或线程之间发送消息。\n\
    \n```cpp\nPostMessage(hwnd, WM_USER + 1, (WPARAM)wParam, (LPARAM)lParam);\n```\n\
    - `hwnd`:接收消息的窗口引用。\n- `wParam`:与消息相关的额外信息。\n- `lParam`:与消息相关的额外信息。\n\n## 内存管理\n\
    \n良好的内存管理有助于程序运行良好并最有效地利用资源。这意味着以智能的方式提供、使用和移除内存。\n\n### 动态内存分配\n使用 Windows 特有的工具来更好地控制内存。\n\
    \n#### 分配内存\n堆函数：使用 `HeapAlloc` 获取内存，并在完成后使用 `HeapFree` 释放。\n\n```cpp\nHANDLE\
    \ hHeap = GetProcessHeap();\nLPVOID pMemory = HeapAlloc(hHeap, HEAP_ZERO_MEMORY,\
    \ 1024);\n```\n\n虚拟内存函数：使用 `VirtualAlloc` 和 `VirtualFree` 进行更大的分配。\n\n```cpp\n\
    LPVOID pMemory = VirtualAlloc(\n    NULL,                           // 在调用进程的地址空间中分配内存\n\
    \    1024 * 1024,                    // 分配字节数\n    MEM_COMMIT,               \
    \      // 分配内存\n    PAGE_READWRITE                  // 内存保护\n);\n```\n\n### 内存映射文件\n\
    内存映射文件将文件数据直接与程序的内存连接。这使得程序可以像使用内存一样读写文件，使其处理起来更快、更方便。\n\n#### 使用内存映射文件\n创建文件映射对象：使用\
    \ `CreateFileMapping`。查看文件：使用 `MapViewOfFile`。\n\n## 高级同步技术\n\n高级同步方法有助于确保多个线程或进程能够安全、有效地使用共享资源。\n\
    \n### 事件对象\n事件对象告诉线程继续或等待。\n\n#### 创建和使用事件\n```cpp\nHANDLE hEvent = CreateEvent(\n\
    \    NULL,                           // 默认安全属性\n    FALSE,                   \
    \       // 手动重置（FALSE 为自动重置）\n    FALSE,                          // 初始状态（FALSE\
    \ 为非信号）\n    TEXT(\"EventName\")               // 事件名称\n);\nWaitForSingleObject(hEvent,\
    \ INFINITE);  // 等待事件信号\nSetEvent(hEvent);                               // 发送信号\n\
    ```\n\n### 信号量\n信号量管理对有限资源的访问。\n\n#### 创建和使用信号量\n```cpp\nHANDLE hSemaphore = CreateSemaphore(\n\
    \    NULL,                           // 默认安全属性\n    1,                       \
    \       // 初始计数\n    10,                             // 最大计数\n    TEXT(\"SemaphoreName\"\
    )            // 信号量名称\n);\nWaitForSingleObject(hSemaphore, INFINITE);  // 等待信号量\n\
    ReleaseSemaphore(hSemaphore, 1, NULL);      // 释放信号量\n```\n\n### 互斥锁\n互斥锁允许一次只有一个线程或进程使用资源。\n\
    \n#### 创建和使用互斥锁\n```cpp\nHANDLE hMutex = CreateMutex(\n    NULL,             \
    \              // 默认安全属性\n    FALSE,                          // 初始所有者（FALSE 为无初始所有者）\n\
    \    TEXT(\"MutexName\")               // 互斥锁名称\n);\nWaitForSingleObject(hMutex,\
    \ INFINITE);  // 等待互斥锁\nReleaseMutex(hMutex);\n```\n"
- fmt: '

    Debugging and testing are important steps in making software. Debugging means
    finding and fixing mistakes in computer code, and testing checks if the software
    works as it should and meets what it''s supposed to do. In Windows programming,
    there are many tools and methods that help developers check and test their applications
    properly.


    ## Main Ideas


    - **Debugging**: Finding and fixing mistakes in computer code.

    - **Testing**: Checking software to make sure it works like it should.

    - **Debugging Tools**: Tools used to find and fix mistakes in programs.

    - **Testing Methods**: Ways to check if software works correctly and performs
    well.


    ## Debugging Techniques


    ### Using the Visual Studio Debugger

    Visual Studio has a strong built-in tool that helps developers find and fix problems
    in their code.


    #### Setting Breakpoints

    Breakpoints let you stop the program at a certain line of code so you can check
    what''s happening in the application.

    To add breakpoints, click in the space next to a line of code or press `F9`.


    #### Walking Through Code

    When you reach a breakpoint, you can go through the code step by step to see what
    it does.


    - **Step Into (F11)**: Use this to go through the code one line at a time to find
    problems.

    - **Step Over (F10)**: Run the current line and go to the next one.

    - **Step Out (Shift+F11)**: Leave the current function and go back to where it
    was called from.


    #### Examining at Variables

    Use the `Locals` and `Watch` windows to look at variables and what their values
    are.


    - **Locals Window**: Displays all local variables and what they are set to.

    - **Watch Window**: Add certain variables or expressions to keep an eye on their
    values.


    ### Using the immediate Window

    The Immediate Window lets you run commands and check expressions while you are
    fixing problems in your code.


    ```cpp

    ? variableName  // Displays the value of variableName

    ```


    ### Using Debugging APIs

    Windows has tools called debugging APIs that help developers find and fix problems
    in their programs.


    - **OutputDebugString**: Sends a message to the debugger.

    ```cpp

    OutputDebugString(TEXT("Debug message"));

    ```

    - **DebugBreak**: Forces a breakpoint in the code.

    ```cpp

    DebugBreak();

    ```


    ## Testing Techniques


    ### Unit Testing

    Unit testing means checking single parts or functions of a program on their own
    to make sure they function properly.


    #### Using Microsoft Unit Test Tools

    Visual Studio allows you to do unit testing using the Microsoft Unit Testing Framework.


    - **Making Test Projects**: Add a new test project to your solution.

    - **Creating Test Methods**: Use tags like `[TestMethod]` to set up test cases.


    ```csharp

    [TestMethod]

    public void TestMethod1() {

    Assert.AreEqual(expectedValue, actualValue);

    }

    ```


    ### Integration Testing

    Integration testing checks if the different parts of the application work well
    together.


    - **Testing Interfaces**: Make sure how different parts and outside systems work
    together.

    - **Creating Real-Life Examples**: Use test cases that copy real user situations.


    ### System Testing

    System testing checks the whole software system to make sure everything works
    together.


    - **End-to-End Testing**: Make sure the app works well from the beginning to the
    end.

    - **Testing Against Requirements**: Check that the software meets all the listed
    needs.


    ### Performance Testing

    Performance testing checks how well the application works in different situations.


    - **Load Testing**: Find out how well the application works when it has a lot
    of users or tasks at once.

    - **Stress Testing**: Check how the application works in very tough situations.


    #### Using Performance Testing Tools

    - **Visual Studio Load Test**: Pretend many users are using the program at the
    same time and check how well it works.

    - Use tools like `JMeter` or `LoadRunner` for more complex situations.


    ### User Acceptance Testing (UAT)

    UAT makes sure that the software works well for the people who will use it.


    - **Getting Users Involved**: Let real users try the app in everyday situations.

    - **Getting Feedback**: Ask for opinions and fix any problems or worries.


    ## Debugging Multithreaded Applications


    ### Challenges in Multithreaded Debugging

    It can be hard to fix problems in multithreaded applications because they run
    at the same time and can have issues working together.


    #### Identifying Deadlocks

    Deadlocks happen when two or more threads are stuck, waiting forever for each
    other to free up resources.


    - **Checking Thread States**: Use tools to find deadlocks.

    - **Debugging Tools**: Use Visual Studio''s tool to see how threads are working.


    ### Synchronization Issues

    Synchronization problems can cause race conditions, where multiple threads try
    to use shared resources at the same time in the wrong way.


    - **Checking Locks**: Make sure that locks and synchronization tools are used
    properly.

    - **Finding Race Conditions**: Use tools and methods to spot and fix race conditions.


    ### Debugging with Logging

    Logging means keeping track of information while a program is running. This helps
    to find problems and see how the program works.


    #### Setting Up Logging

    - **Using the Windows Event Log**: Record messages to the Windows Event Log with
    the `EventLog` class.

    ```cpp

    EventLog.WriteEntry("Application", "Log message", EventLogEntryType.Information);

    ```

    - **File-Based Logging**: Write logs to files for persistent storage.

    ```csharp

    using (StreamWriter writer = new StreamWriter("log.txt", true)) {

    writer.WriteLine("Log message");

    }

    ```


    #### Analyzing Logs

    - **Checking Log Files**: Look at the log files for error messages and trends.

    - **Using Log Analysis Tools**: Use tools to look at and display log data.


    ## Automated Testing


    ### Benefits of Automated Testing

    Automated testing makes testing faster and makes sure the tests are done the same
    way every time.


    #### Getting Automated Tests Ready

    - **Making Automated Test Sets**: Build automated test sets using tools like `NUnit`
    or `MSTest`.

    - **Continuous Integration**: Add automatic tests to the building process using
    tools like `Jenkins` or `Azure DevOps`.


    ### Implementing Automated Test Cases

    - **Creating Test Scripts**: Make scripts to automate testing tasks.

    - **Running Tests**: Automatically check for issues while developing or launching.


    ## Debugging and Testing Best Practices


    ### Debugging Best Practices

    - **Reproduce Problems Regularly**: Make sure you can recreate the problems every
    time so you can fix them properly.

    - **Find Problems**: Break down the issues by focusing on the specific code or
    part that is causing the problem.

    - **Write down what you find**: Keep clear notes of problems and their answers
    for later use.


    ### Testing Best Practices

    - **Test Early and Often**: Begin testing at the start of the project and keep
    testing regularly.

    - **Use real test data**: Make sure the test data looks like real-life situations.

    - **Try to automate tasks whenever you can**: This will help you save time and
    make fewer mistakes.


    ## Conclusion

    In this chapter, we talked about ways to fix problems and test software that are
    important for making dependable and good-quality Windows apps. We looked into
    using Visual Studio''s debugger, creating small tests and combined tests, fixing
    issues with multiple threads, and using logging and automated testing. Following
    good methods for finding and fixing problems, as well as testing, will help you
    create strong apps that work well and satisfy users.


    # Chapter 10


    ## Deployment and Distribution

    Deployment and distribution are important parts of making software. They involve
    getting the software to users and handling its setup and updates.

