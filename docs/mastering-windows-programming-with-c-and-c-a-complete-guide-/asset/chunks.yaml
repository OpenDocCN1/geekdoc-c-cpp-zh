    TranslateMessage: Changes keyboard key messages into character messages.


    DispatchMessage: Sends the message to the window''s handler.


    Window Procedure


    The window procedure is a function that takes care of messages for a window. Each
    window has its own way of doing things. This involves handling messages like WM_PAINT,
    which helps to draw on the window, and WM_DESTROY, which helps to free up resources
