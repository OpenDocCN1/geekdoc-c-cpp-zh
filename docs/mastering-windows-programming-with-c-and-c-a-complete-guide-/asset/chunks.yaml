- fmt: "\nTo manage messages better, you can use `PeekMessage`. This lets you check\
    \ for messages without stopping your application, so it can keep doing other tasks\
    \ while waiting for new messages.\n\n```cpp\nwhile (true) {\n    if (PeekMessage(&msg,\
    \ NULL, 0, 0, PM_REMOVE)) {\n        TranslateMessage(&msg);\n        DispatchMessage(&msg);\n\
    \    } else {\n        // Perform background tasks\n    }\n}\n```\n\n# Conclusion\n\
    \nIn this chapter, we talked about the basics of Windows programming. We learned\
    \ about the Windows message system, the `WinMain` function, how to create a simple\
    \ window, and how to deal with messages. These basics give you a strong base to\
    \ create more complicated Windows apps. As you keep learning, you will learn about\
    \ more complicated topics like how to use buttons and menus, graphics, handling\
    \ files, and doing many things at once. These all connect to the main ideas we've\
    \ discussed. By learning these basic skills, you will be able to make strong and\
    \ quick Windows programs using `C` and `C++`.\n\n# Chapter 3\n\n## User Interface\
    \ Basics\n\n### Introduction to Windows Controls\n\nWindows controls, or widgets,\
    \ are the basic parts that make up the user interfaces in Windows apps. They have\
    \ buttons, text fields, labels, lists, and other things. These controls are very\
    \ important for making applications that are easy to use and interactive.\n\n\
    ### Types of Windows Controls\n\n- **Static Controls**: Used to show text or pictures\
    \ that the user does not need to interact with, like labels.\n- **Button Controls**:\
    \ Used to do things when you click them, like command buttons.\n- **Edit Controls**:\
    \ These are used for typing text, like single-line boxes and boxes where you can\
    \ write multiple lines.\n- **List Controls**: These are used to show lists of\
    \ things, like list boxes and combo boxes.\n- **Scroll Bars**: Used to move through\
    \ content in a window.\n- **Group Boxes**: Used to keep similar controls together.\n\
    \n### Creating and Using Controls\n\nYou make controls by using the `CreateWindow`\
    \ or `CreateWindowEx` function and by choosing the right class name for the type\
    \ of control you want. For instance, to make a button:\n\n```cpp\nHWND hButton\
    \ = CreateWindow(\n    \"BUTTON\",      // Predefined class; Unicode assumed\n\
    \    \"Click Me\",      // Button text\n    WS_TABSTOP | WS_VISIBLE | WS_CHILD\
    \ | BS_DEFPUSHBUTTON,  // Styles\n    10,              // x position\n    10,\
    \              // y position\n    100,             // Button width\n    30,  \
    \            // Button height\n    hWnd,            // Parent window\n    NULL,\
    \            // No menu.\n    (HINSTANCE)GetWindowLongPtr(hWnd, GWLP_HINSTANCE),\n\
    \    NULL             // Pointer not needed.\n);\n```\n\n### Handling Control\
    \ Messages\n\nControls send messages to the main window when things happen. These\
    \ messages are handled in the window process. For example, to manage when a button\
    \ is clicked:\n\n```cpp\ncase WM_COMMAND:\n    if (HIWORD(wParam) == BN_CLICKED)\
    \ {\n        int id = LOWORD(wParam);\n        if (id == BUTTON_ID) {\n      \
    \      // Handle button click\n        }\n    }\n    break;\n```\n\n## Working\
    \ with Buttons, Text Boxes, and Labels\n\n#### Button Controls\n\nButtons are\
    \ one of the most common features in Windows programs. They are used to do things\
