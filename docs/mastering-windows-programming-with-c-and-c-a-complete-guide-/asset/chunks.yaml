    # Chapter 6


    ## Multithreading and Concurrency


    Introduction to Multithreading


    Multithreading is a way of programming that allows many threads to run at the
    same time in one program. Threads use the same resources but run separately. This
    method can make applications run better by using multiple processor cores and
    providing a smoother experience for users.


    Important Ideas


    Thread: The smallest part of a program that can run on its own.


    Process: A running program that has one or more threads inside it.


    Concurrency means the system can do many tasks at the same time.


    Advantages of Using Multithreading


    Responsiveness: Keeps apps working smoothly by moving tasks like background work
    to other places.


    Performance: Uses several CPU cores to do calculations at the same time.


    Resource Sharing: Lets threads use memory and resources together in a process
    effectively.


    Creating and Managing Threads


    The CreateThread Function


    In Windows, you make threads using the CreateThread function. This function creates
    a new thread and gives you a way to access it.


    DWORD WINAPI ThreadFunction(LPVOID lpParam) {


    // Thread code here


    return 0;


    }


    HANDLE hThread = CreateThread(


    NULL,                   // Default security attributes


    0,                      // Default stack size


    ThreadFunction,         // Thread function


    NULL,                   // Parameter to thread function


    0,                      // Default creation flags


    NULL                    // Pointer to thread identifier


    );


    Thread Function: The task that the thread will do.


    Thread Handle: Used to control the thread (for example, to wait until it finishes).


    Waiting for Threads


    To wait for a thread to finish, use the WaitForSingleObject function.


    WaitForSingleObject(hThread, INFINITE);  // Wait indefinitely for the thread to
    complete


    "Shutting Down Thread Handles"


    Use CloseHandle to close thread handles and free up resources.


    CloseHandle(hThread);


    Synchronization Techniques


    Synchronization makes sure that several threads can use shared resources safely,
    avoiding conflicts or problems with the data. Common ways to manage synchronization
    include locks (mutexes), critical areas, and semaphores.


    Important Parts


    Critical sections help keep threads in the same process working together smoothly.
    They are easier to use and quicker than mutexes.


    Using Critical Sections


    Initialize: Initialize a critical section object.


    CRITICAL_SECTION cs;


    InitializeCriticalSection(&cs);


    Enter: Enter the critical section before accessing shared resources.


    EnterCriticalSection(&cs);


    // Access shared resources


    Leave: Leave the critical section when done.


    LeaveCriticalSection(&cs);


    Delete: Delete the critical section when no longer needed.


    DeleteCriticalSection(&cs);


    Mutexes


    Mutexes are used to keep things in order when different parts of a program are
    working at the same time. They make sure that only one thread can use the mutex
    at a time.


    Using Mutexes


    Create: Create or open a named mutex.


    HANDLE hMutex = CreateMutex(NULL, FALSE, "MyMutex");


    Acquire: Wait for the mutex to be available.


    WaitForSingleObject(hMutex, INFINITE);


    Release: Release the mutex when done.


    ReleaseMutex(hMutex);


    Close: Close the mutex handle.


    CloseHandle(hMutex);


    Semaphores


    Semaphores control how many people can use a limited number of resources. They
    are used to manage how many threads can use a resource at the same time.


    Using Semaphores


    Create: Create a semaphore with an initial count.


    HANDLE hSemaphore = CreateSemaphore(NULL, 1, 1, "MySemaphore");


    Wait: Decrement the semaphore count and wait if the count is zero.


    WaitForSingleObject(hSemaphore, INFINITE);


    Release: Increment the semaphore count.


    ReleaseSemaphore(hSemaphore, 1, NULL);


    Close: Close the semaphore handle.


    CloseHandle(hSemaphore);


    Thread Communication


    Threads often need to talk to each other or share information. This can be done
    using shared memory, sending messages, or using synchronization tools.


    Using Common Memory


    Threads in the same process can directly use shared memory by using global or
    static variables. We need to keep things in sync to avoid messing up the data.


    // Shared resource


    int sharedData;


    void ThreadFunction(LPVOID lpParam) {


    EnterCriticalSection(&cs);


    sharedData++;  // Modify shared resource


    LeaveCriticalSection(&cs);


    }


    Message Passing


    Threads can use message queues or ways to communicate between processes to send
    messages to each other.


    Example: PostMessage Function


    PostMessage(hwnd, WM_USER + 1, (WPARAM)wParam, (LPARAM)lParam);


    hwnd: A reference to the window that is getting the message.


    wParam: Information related to a specific message.


    lParam: Extra information related to the message.


    Managing Thread Lifecycles


    Making Threads on the Go


    Threads can be started whenever they are needed, which helps applications use
    resources better.


    HANDLE hThread = CreateThread(NULL, 0, ThreadFunction, NULL, 0, NULL);


    Stopping Threads


    Threads should be ended properly to prevent wasting resources. Only use TerminateThread
    as a last option.


    TerminateThread(hThread, 0);  // Not recommended; use proper synchronization


    Thread pools


    Thread pools are groups of worker threads that can be used again for different
    jobs, which helps make things run better and use resources more efficiently.


    Using the Thread Pool API


    HANDLE hPool = CreateThreadpool(NULL);


    SetThreadpoolThreadMaximum(hPool, 4);


    SetThreadpoolThreadMinimum(hPool, 2);


    CreateThreadpool: Makes a group of threads ready to use.


    SetThreadpoolThreadMaximum: This sets the highest number of threads allowed.


    SetThreadpoolThreadMinimum: Sets the least number of threads needed.


    Handling Thread Errors


    Looking for Mistakes


    Always look for mistakes in thread operations by using the GetLastError function.


    DWORD error = GetLastError();


    Debugging Threads


    Use debugging tools to watch how threads run and find problems.


    Visual Studio Debugger: Lets you check and manage threads.


    Fixing API issues: Use tools like DebugActiveProcess and DebugSetProcessKillOnExit.


    Advanced Multithreading Concepts


    Thread Safety


    Make sure that shared resources are safe and can be used properly by different
    threads at the same time.


    Atomic Operations: Use atomic operations to safely update data when multiple threads
    are working at the same time.'
