    Every time you move the mouse or press a key, it creates a message. These messages
    are sent to the right handler, which deals with them as needed.


    Message Loop


    Every Windows app relies on a message loop to function. This loop gets messages
    from the application''s message queue and sends them to the right window functions.
    Let''s take a closer look at the message loop:


