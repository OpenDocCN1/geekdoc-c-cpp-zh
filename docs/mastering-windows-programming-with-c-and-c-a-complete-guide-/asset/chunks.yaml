    # Chapter 4


    ## Graphics and Drawing


    Introduction to GDI (Graphics Device Interface)


    The Graphics Device Interface (GDI) is an important part of the Windows operating
    system that helps programs show images and graphics. It offers tools to create
    text, shapes, and pictures on screens and printers.


    GDI Components


    Device Context (DC): A system that describes a group of visual elements and their
    features, along with the settings that influence how things appear on the screen.


    Pens: Used to make lines and shapes.


    Brushes: Used to color in shapes.


    Fonts: They are used to create letters and words.


    Bitmaps: Used for handling pictures.


    Getting a Device Context


    You get a device context by using the GetDC function for a window or by using
    the BeginPaint function when handling the WM_PAINT message.


    HDC hdc = GetDC(hwnd);


    After using the device context, make sure to free it by using ReleaseDC.


    ReleaseDC(hwnd, hdc);


    Drawing Basics


    Drawing Lines and Shapes


    Drawing in GDI is done using functions that work with a device context.


    Drawing Lines


    You draw lines using the MoveToEx and LineTo functions.


    MoveToEx(hdc, 10, 10, NULL);  // Move to starting point


    LineTo(hdc, 100, 100);        // Draw line to endpoint


    Drawing Rectangles


    You can make rectangles using the Rectangle function.


    Rectangle(hdc, 50, 50, 200, 150);  // Draw a rectangle from (50, 50) to (200,
    150)


    Drawing Ellipses


    You can draw ellipses using the Ellipse tool.


    Ellipse(hdc, 60, 60, 180, 120);  // Draw an ellipse within the bounding rectangle
    (60, 60) to (180, 120)


    Using Pens and Brushes


    Pens and brushes create the look of lines and colors.


    Making and Choosing a Pen


    Make a pen using the CreatePen function and put it into the device context with
    SelectObject.


    HPEN hPen = CreatePen(PS_SOLID, 2, RGB(255, 0, 0));  // Create a solid red pen
    with a width of 2


    SelectObject(hdc, hPen);


    Creating and Selecting a Brush


    Make a brush with the CreateSolidBrush function and use SelectObject to add it
    to the device context.


    HBRUSH hBrush = CreateSolidBrush(RGB(0, 255, 0));  // Create a solid green brush


    SelectObject(hdc, hBrush);


    Drawing Text


    Text is drawn using the TextOut function.


    TextOut(hdc, 10, 10, "Hello, GDI!", strlen("Hello, GDI!"));  // Draw text at (10,
    10)


    Handling the WM_PAINT Message


    The WM_PAINT Message


    The WM_PAINT message is sent to a window when it needs to be redrawn. To work
    with this message, you need to use the BeginPaint and EndPaint functions to get
    and then release the drawing area.


    case WM_PAINT: {


    PAINTSTRUCT ps;


    HDC hdc = BeginPaint(hwnd, &ps);


    // Perform drawing operations here


    EndPaint(hwnd, &ps);


    break;


    }


    Example: Drawing in the WM_PAINT Handler


    case WM_PAINT: {


    PAINTSTRUCT ps;


    HDC hdc = BeginPaint(hwnd, &ps);


    // Draw a rectangle


    Rectangle(hdc, 50, 50, 200, 150);


    // Draw an ellipse


    Ellipse(hdc, 60, 60, 180, 120);


    // Draw text


    TextOut(hdc, 10, 10, "Hello, GDI!", strlen("Hello, GDI!"));


    EndPaint(hwnd, &ps);


    break;


    }


    Working with Bitmaps


    Loading and Displaying Bitmaps


    Bitmaps are often used for pictures in Windows programs. They can be taken from
    resources or files and shown using GDI functions.


    Loading a Bitmap from a Resource


    HBITMAP hBitmap = LoadBitmap(hInstance, MAKEINTRESOURCE(IDB_BITMAP1));


