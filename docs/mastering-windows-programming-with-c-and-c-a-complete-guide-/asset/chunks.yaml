    \ service;\nservice.sin_family = AF_INET;\nservice.sin_addr.s_addr = htonl(INADDR_ANY);\n\
    service.sin_port = htons(27015);\nint result = bind(sock, (SOCKADDR*)&service,\
    \ sizeof(service));\nif (result == SOCKET_ERROR) {\n    printf(\"Bind failed:\
    \ %d\\n\", WSAGetLastError());\n    closesocket(sock);\n    WSACleanup();\n  \
    \  return 1;\n}\n```\n\n`INADDR_ANY`：连接到所有可用网络连接。\n\n`htons`：将端口号转换为网络通信使用的格式。\n\
    \n#### 监听和接受连接\n##### Listen 函数\n使用 `listen` 函数设置 socket 以允许传入的连接。\n\n```cpp\n\
    int result = listen(sock, SOMAXCONN);\nif (result == SOCKET_ERROR) {\n    printf(\"\
    Listen failed: %d\\n\", WSAGetLastError());\n    closesocket(sock);\n    WSACleanup();\n\
    \    return 1;\n}\n```\n\n`SOMAXCONN`：指定等待连接的最大数量。\n\n##### accept 函数\n使用 `accept`\
    \ 接受传入的连接。\n\n```cpp\nSOCKET clientSocket = accept(sock, NULL, NULL);\nif (clientSocket\
    \ == INVALID_SOCKET) {\n    printf(\"Accept failed: %d\\n\", WSAGetLastError());\n\
    \    closesocket(sock);\n    WSACleanup();\n    return 1;\n}\n```\n\n`clientSocket`：新连接\
    \ socket 的句柄。\n\n#### 连接到服务器\n##### Connect 函数\n对于客户端应用，使用 \"connect\" 连接到服务器。\n\
    \n```cpp\nstruct sockaddr_in server;\nserver.sin_family = AF_INET;\nserver.sin_port\
    \ = htons(27015);\ninet_pton(AF_INET, \"127.0.0.1\", &server.sin_addr);\nint result\
    \ = connect(sock, (SOCKADDR*)&server, sizeof(server));\nif (result == SOCKET_ERROR)\
    \ {\n    printf(\"Connect failed: %d\\n\", WSAGetLastError());\n    closesocket(sock);\n\
    \    WSACleanup();\n    return 1;\n}\n```\n\n#### 发送和接收数据\n##### send 函数\n使用 `send`\
    \ 方法向已连接的 socket 发送信息。\n\n```cpp\nconst char* data = \"Hello, Server!\";\nint\
    \ result = send(sock, data, strlen(data), 0);\nif (result == SOCKET_ERROR) {\n\
    \    printf(\"Send failed: %d\\n\", WSAGetLastError());\n}\n```\n\n##### recv\
    \ 函数\n使用 `recv` 从 socket 接收数据。\n\n```cpp\nchar buffer[512];\nint result = recv(sock,\
    \ buffer, sizeof(buffer), 0);\nif (result > 0) {\n    printf(\"Received data:\
    \ %.*s\\n\", result, buffer);\n} else if (result == 0) {\n    printf(\"Connection\
    \ closed\\n\");\n} else {\n    printf(\"Receive failed: %d\\n\", WSAGetLastError());\n\
    }\n```\n\n#### 关闭 Socket\n##### closesocket 函数\n在完成网络通信使用后关闭 socket。\n\n```cpp\n\
    closesocket(sock);\n```\n\n始终关闭 socket 以释放资源并防止可能的泄漏。\n\n#### 处理多个连接\n##### 使用\
    \ select 管理多个连接\n`select` 帮助你检查许多 socket 以查看它们是否可以读取数据、发送数据或是否存在特殊问题。\n\n```cpp\n\
    fd_set readfds;\nFD_ZERO(&readfds);\nFD_SET(sock, &readfds);\nint result = select(0,\
    \ &readfds, NULL, NULL, NULL);\nif (result == SOCKET_ERROR) {\n    printf(\"Select\
    \ failed: %d\\n\", WSAGetLastError());\n}\n```\n\n`FD_ZERO`：清除文件描述符列表。\n\n`FD_SET`：将\
    \ socket 放入组。\n\n`Choose`：监控 socket。\n\n##### 使用 WSAAsyncSelect 进行异步 I/O\n对于 GUI\
    \ 应用，使用 `WSAAsyncSelect` 异步处理网络事件。\n\n```cpp\nWSAAsyncSelect(sock, hwnd, WM_SOCKET,\
    \ FD_READ | FD_WRITE | FD_CLOSE);\n```\n\n`hwnd`：接收消息的窗口 ID。\n\n`WM_SOCKET`：socket\
    \ 发生时的标签。\n\n### 错误处理和调试\n##### 错误代码\n当 Winsock 函数不起作用时，使用 `WSAGetLastError` 获取最后的错误代码。\n\
    \n```cpp\nDWORD error = WSAGetLastError();\n```\n\n##### 修复网络连接问题\nWireshark：使用它查看和修复网络数据。\n\
    \n日志：设置记录网络活动和问题的方法。\n\n### 高级网络编程\n##### 非阻塞 Socket\n将 socket 更改为非阻塞模式，以免停止其他进程运行。\n\
    \n```cpp\nu_long mode = 1;\nioctlsocket(sock, FIONBIO, &mode);\n```\n\n"
- fmt: "\nAdvanced Windows programming uses more advanced features of the Windows\
    \ API to build complicated and fast applications. This chapter talks about more\
    \ complex subjects like how different parts of a program can communicate with\
    \ each other, how to manage memory, advanced methods for keeping things in order,\
    \ and using special Windows features to make applications better.\n\n## Main Ideas\n\
    \n- **Inter-Process Communication (IPC)**: Methods for sharing information between\
    \ different processes.\n- **Memory Management**: Using and freeing up memory effectively.\n\
    - **Advanced Synchronization**: Keeping threads safe and controlling access when\
    \ multiple threads are used at the same time.\n- **Windows Features**: Using special\
    \ Windows tools for better performance.\n\n## Inter-Process Communication (IPC)\n\
    \nIPC helps different programs talk to each other and share information. Windows\
    \ has several ways for programs to talk to each other, like named pipes, shared\
    \ memory, and message queues.\n\n### Named pipes\n\nNamed pipes are a way for\
    \ programs to talk to each other, either over a network or on the same computer.\
    \ They allow communication in one direction or both ways.\n\n#### Creating a Named\
    \ Pipe\nUse `CreateNamedPipe` to create a named pipe.\n\n```cpp\nHANDLE hPipe\
    \ = CreateNamedPipe(\n    TEXT(\"\\\\\\\\.\\\\pipe\\\\MyPipe\"),   // Pipe name\n\
    \    PIPE_ACCESS_DUPLEX,             // Read/Write access\n    PIPE_TYPE_MESSAGE\
    \ | PIPE_READMODE_MESSAGE | PIPE_WAIT, // Pipe mode\n    1,                  \
    \            // Number of instances\n    1024 * 16,                      // Output\
    \ buffer size\n    1024 * 16,                      // Input buffer size\n    0,\
    \                              // Client time-out\n    NULL                  \
    \          // Default security attributes\n);\n```\n\n#### Connecting to a Named\
    \ Pipe\nUse `ConnectNamedPipe` on the server side and `CreateFile` on the client\
    \ side.\n\n```cpp\nBOOL connected = ConnectNamedPipe(hPipe, NULL);\n```\n\nOn\
    \ the client side:\n\n```cpp\nHANDLE hPipe = CreateFile(\n    TEXT(\"\\\\\\\\\
    .\\\\pipe\\\\MyPipe\"),   // Pipe name\n    GENERIC_READ | GENERIC_WRITE,   //\
    \ Desired access\n    0,                              // Share mode\n    NULL,\
    \                           // Default security attributes\n    OPEN_EXISTING,\
    \                  // Open existing pipe\n    0,                             \
    \ // No flags\n    NULL                            // No template file\n);\n```\n\
    \n### Shared memory\n\nShared memory lets different programs use the same part\
    \ of memory.\n\n#### Creating a File Mapping Object\nUse `CreateFileMapping` to\
    \ create a file mapping object.\n\n```cpp\nHANDLE hMapFile = CreateFileMapping(\n\
    \    INVALID_HANDLE_VALUE,            // Use system paging file\n    NULL,   \
    \                        // Default security attributes\n    PAGE_READWRITE, \
    \                // Read/Write access\n    0,                              //\
    \ Maximum object size (high-order bits)\n    1024 * 1024,                    //\
    \ Maximum object size (low-order bits)\n    TEXT(\"SharedMemory\")           \
    \  // Name of the object\n);\n```\n\n#### Mapping a view of file\nShow the file\
    \ in the area of memory the process can use.\n\n```cpp\nLPVOID pBuf = MapViewOfFile(\n\
    \    hMapFile,                       // Handle to mapping object\n    FILE_MAP_ALL_ACCESS,\
    \            // Desired access\n    0,                              // File offset\
    \ high\n    0,                              // File offset low\n    0        \
    \                       // Number of bytes to map\n);\n```\n\n### Message Queues\n\
    \nMessage queues let applications talk to each other without needing to respond\
    \ away.\n\n#### Making a Queue\nUse `CreateQueue` or similar functions based on\
    \ the message queue you are using.\n\n#### Sending and Getting Messages\nUse `SendMessage`\
    \ and `PostMessage` to send messages between windows or threads.\n\n```cpp\nPostMessage(hwnd,\
    \ WM_USER + 1, (WPARAM)wParam, (LPARAM)lParam);\n```\n- `hwnd`: A reference for\
    \ the window is getting the message.\n- `wParam`: Extra information related to\
    \ the message.\n- `lParam`: Extra information related to the message.\n\n## Memory\
    \ Management\n\nGood memory management helps things run well and makes the best\
    \ use of resources. It means giving, using, and removing memory in a smart way.\n\
    \n### Dynamic Memory Allocation\nUse Windows-specific tools for better control\
    \ of memory.\n\n#### Allocating Memory\nHeap Functions: Use `HeapAlloc` to get\
    \ memory and `HeapFree` when you’re done.\n\n```cpp\nHANDLE hHeap = GetProcessHeap();\n\
    LPVOID pMemory = HeapAlloc(hHeap, HEAP_ZERO_MEMORY, 1024);\n```\n\nVirtual Memory\
    \ Functions: Use `VirtualAlloc` and `VirtualFree` for larger allocations.\n\n\
    ```cpp\nLPVOID pMemory = VirtualAlloc(\n    NULL,                           //\
    \ Allocate memory in the address space of the calling process\n    1024 * 1024,\
    \                    // Number of bytes to allocate\n    MEM_COMMIT,         \
    \            // Allocate memory\n    PAGE_READWRITE                  // Memory\
    \ protection\n);\n```\n\n### Memory-Mapped Files\nMemory-mapped files connect\
    \ the data from a file directly with a program's memory. This lets the program\
    \ read and write to the file as if it were using memory, making it faster and\
    \ easier to work with.\n\n#### Using Memory-Mapped Files\nMaking a File Mapping\
    \ Object: Use `CreateFileMapping`. To see the file, use `MapViewOfFile`.\n\n##\
    \ Advanced Synchronization Techniques\n\nAdvanced synchronization methods help\
    \ sure that several threads or processes can use shared resources safely and effectively.\n\
    \n### Event Objects\nEvent objects tell threads to go ahead or hold on.\n\n####\
    \ Creating and Using Events\n```cpp\nHANDLE hEvent = CreateEvent(\n    NULL, \
    \                          // Default security attributes\n    FALSE,        \
    \                  // Manual reset (FALSE for auto-reset)\n    FALSE,        \
    \                  // Initial state (FALSE for non-signaled)\n    TEXT(\"EventName\"\
    )               // Event name\n);\nWaitForSingleObject(hEvent, INFINITE);  //\
    \ Wait for event to be signaled\nSetEvent(hEvent);                           \
    \    // Signal the event\n```\n\n### Semaphores\nSemaphores manage access to a\
    \ limited number of resources.\n\n#### Creating and Using Semaphores\n```cpp\n\
    HANDLE hSemaphore = CreateSemaphore(\n    NULL,                           // Default\
    \ security attributes\n    1,                              // Initial count\n\
    \    10,                             // Maximum count\n    TEXT(\"SemaphoreName\"\
    )            // Semaphore name\n);\nWaitForSingleObject(hSemaphore, INFINITE);\
    \  // Wait for semaphore\nReleaseSemaphore(hSemaphore, 1, NULL);      // Release\
    \ semaphore\n```\n\n### Mutexes\nMutexes allow only one thread or process to use\
    \ a resource at a time.\n\n#### Creating and Using Mutexes\n```cpp\nHANDLE hMutex\
    \ = CreateMutex(\n    NULL,                           // Default security attributes\n\
    \    FALSE,                          // Initial owner (FALSE for no initial owner)\n\
    \    TEXT(\"MutexName\")               // Mutex name\n);\nWaitForSingleObject(hMutex,\
    \ INFINITE);  // Wait for mutex\nReleaseMutex(hMutex);\n```\n"
  raw: 'Advanced Windows programming uses more advanced features of the Windows API
    to build complicated and fast applications. This chapter talks about more complex
    subjects like how different parts of a program can communicate with each other,
    how to manage memory, advanced methods for keeping things in order, and using
    special Windows features to make applications better.


    Main Ideas


    Inter-Process Communication (IPC): Methods for sharing information between different
    processes.


    Memory Management: Using and freeing up memory effectively.


    Advanced Synchronization: Keeping threads safe and controlling access when multiple
    threads are used at the same time.


    Windows Features: Using special Windows tools for better performance.


    Inter-Process Communication (IPC)


    IPC helps different programs talk to each other and share information. Windows
    has several ways for programs to talk to each other, like named pipes, shared
    memory, and message queues.


    Named pipes


    Named pipes are a way for programs to talk to each other, either over a network
    or on the same computer. They allow communication in one direction or both ways.


    Creating a Named Pipe


    Use CreateNamedPipe to create a named pipe.


    HANDLE hPipe = CreateNamedPipe(


    TEXT("\\\\.\\pipe\\MyPipe"),   // Pipe name


    PIPE_ACCESS_DUPLEX,            // Read/Write access


    PIPE_TYPE_MESSAGE | PIPE_READMODE_MESSAGE | PIPE_WAIT, // Pipe mode


    1,                             // Number of instances


    1024 * 16,                      // Output buffer size


    1024 * 16,                      // Input buffer size


    0,                             // Client time-out


    NULL                           // Default security attributes


    );


    Connecting to a Named Pipe


    Use ConnectNamedPipe on the server side and CreateFile on the client side.


    BOOL connected = ConnectNamedPipe(hPipe, NULL);


    On the client side:


    HANDLE hPipe = CreateFile(


    TEXT("\\\\.\\pipe\\MyPipe"),   // Pipe name


    GENERIC_READ | GENERIC_WRITE,  // Desired access


    0,                             // Share mode


    NULL,                          // Default security attributes


    OPEN_EXISTING,                  // Open existing pipe


    0,                             // No flags


    NULL                           // No template file


    );


    Shared memory


    Shared memory lets different programs use the same part of memory.


    Creating a File Mapping Object


    Use CreateFileMapping to create a file mapping object.


    HANDLE hMapFile = CreateFileMapping(


    INVALID_HANDLE_VALUE,            // Use system paging file


    NULL,                           // Default security attributes


    PAGE_READWRITE,                  // Read/Write access


    0,                              // Maximum object size (high-order bits)


    1024 * 1024,                     // Maximum object size (low-order bits)


    TEXT("SharedMemoryName")        // Name of the mapping object


    );


    Mapping a view of file


    Show the file in the area of memory the process can use.


    LPVOID pBuf = MapViewOfFile(


    hMapFile,        // Handle to file mapping object


    FILE_MAP_ALL_ACCESS, // Desired access


    0,               // File offset high


    0,               // File offset low


    0                // Number of bytes to map


    );


    Message Queues


    Message queues let applications talk to each other without needing to respond
    right away.


    Making a Message Queue


    Use CreateQueue or similar functions based on the message queue system you are
    using.


    Sending and Getting Messages


    Use SendMessage and PostMessage to send messages between windows or threads.


    PostMessage(hwnd, WM_USER + 1, (WPARAM)wParam, (LPARAM)lParam);


    hwnd: A reference for the window that is getting the message.


    wParam: Extra information related to the message.


    lParam: Extra information related to the message.


    Memory Management


    Good memory management helps things run well and makes the best use of resources.
    It means giving, using, and removing memory in a smart way.


    Dynamic Memory Allocation


    Use Windows-specific tools for better control of memory.


    Allocating Memory


    Heap Functions: Use HeapAlloc to get memory and HeapFree to release it when you’re
    done.


    HANDLE hHeap = GetProcessHeap();


    LPVOID pMemory = HeapAlloc(hHeap, HEAP_ZERO_MEMORY, 1024);


    Virtual Memory Functions: Use VirtualAlloc and VirtualFree for larger allocations.


    LPVOID pMemory = VirtualAlloc(


    NULL,                 // Allocate memory in the address space of the calling process


    1024 * 1024,          // Number of bytes to allocate


    MEM_COMMIT,           // Allocate memory


    PAGE_READWRITE        // Memory protection


    );


    Memory-Mapped Files


    Memory-mapped files connect the data from a file directly with a program''s memory.
    This lets the program read and write to the file as if it were using memory, making
    it faster and easier to work with.


    Using Memory-Mapped Files


    Making a File Mapping Object: Use CreateFileMapping.


    To see the file, use MapViewOfFile.


    Advanced Synchronization Techniques


    Advanced synchronization methods help make sure that several threads or processes
    can use shared resources safely and effectively.


    Event Objects


    Event objects tell threads to go ahead or to hold on.


    Creating and Using Events


    HANDLE hEvent = CreateEvent(


    NULL,       // Default security attributes


    FALSE,      // Manual reset (FALSE for auto-reset)


    FALSE,      // Initial state (FALSE for non-signaled)


    TEXT("EventName") // Event name


    );


    WaitForSingleObject(hEvent, INFINITE);  // Wait for event to be signaled


    SetEvent(hEvent);                        // Signal the event


    Semaphores


    Semaphores manage access to a limited number of resources.


    Creating and Using Semaphores


    HANDLE hSemaphore = CreateSemaphore(


    NULL,      // Default security attributes


    1,         // Initial count


    10,        // Maximum count


    TEXT("SemaphoreName") // Semaphore name


    );


    WaitForSingleObject(hSemaphore, INFINITE);  // Wait for semaphore


    ReleaseSemaphore(hSemaphore, 1, NULL);      // Release semaphore


    Mutexes


    Mutexes allow only one thread or process to use a resource at a time.


    Creating and Using Mutexes


    HANDLE hMutex = CreateMutex(


    NULL,      // Default security attributes


    FALSE,     // Initial owner (FALSE for no initial owner)


    TEXT("MutexName") // Mutex name


    );


    WaitForSingleObject(hMutex, INFINITE);  // Wait for mutex


    ReleaseMutex(hMutex);                   // Release mutex


    Leveraging Windows-Specific Features


    Windows has extra tools to make applications better, like COM, special Windows
    API features, and ways to check how well they are running.


    COM


    COM is a Microsoft tool that helps create and use software parts that can be reused.


    Using COM


    Starting COM: Use CoInitialize or CoInitializeEx.


    HRESULT hr = CoInitialize(NULL);


    Creating COM Objects: Use CoCreateInstance


    to create an instance of a COM object.


    ICustomInterface* pInterface = NULL;


    hr = CoCreateInstance(CLSID_CustomObject, NULL, CLSCTX_INPROC_SERVER, IID_ICustomInterface,
    (void**)&pInterface);


    Uninitializing COM: Use CoUninitialize when done.


    CoUninitialize();


    Performance Monitoring


    Windows offers tools to keep track of how well applications are running.


    Using Performance Monitors


    Making and Using Performance Counters: Use Performance Counter APIs to keep track
    of system and application data.


    PDH_HQUERY hQuery;


    PDH_HCOUNTER hCounter;


    PdhOpenQuery(NULL, 0, &hQuery);


    PdhAddCounter(hQuery, TEXT("\\Processor(_Total)\\% Processor Time"), 0, &hCounter);


    PdhCollectQueryData(hQuery);


    Windows API Extensions


    Windows 10 UWP: For creating new apps using the Universal Windows Platform (UWP).


    Windows API Functions: Use extra functions from the Windows API for special tasks.


    Conclusion


    In this chapter, we looked at more complex ideas in Windows programming. We talked
    about how programs can talk to each other (IPC), how to manage memory, advanced
    ways to keep things in sync, and using special Windows features. Learning these
    complex subjects will help you create advanced apps that work better, faster,
    and have more features.


    # Chapter 9


    ## Debugging and Testing'
