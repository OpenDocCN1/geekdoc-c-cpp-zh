    BitBlt(hdc, 0, 0, bitmap.bmWidth, bitmap.bmHeight, hdcMem, 0, 0, SRCCOPY);


    DeleteDC(hdcMem);


    DeleteObject(hBitmap);


    EndPaint(hwnd, &ps);


    break;


    }


    Advanced Drawing Techniques


    Using Regions


    Regions are areas made up of shapes like rectangles, polygons, or ellipses. They
