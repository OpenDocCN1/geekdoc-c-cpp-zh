    # Chapter 3


    ## User Interface Basics


    Introduction to Windows Controls


    Windows controls, or widgets, are the basic parts that make up the user interfaces
    in Windows apps. They have buttons, text fields, labels, lists, and other things.
    These controls are very important for making applications that are easy to use
    and interactive.


    Types of Windows Controls


    Static Controls: Used to show text or pictures that the user does not need to
    interact with, like labels.


    Button Controls: Used to do things when you click them, like command buttons.


    Edit Controls: These are used for typing text, like single-line boxes and boxes
    where you can write multiple lines.


    List Controls: These are used to show lists of things, like list boxes and combo
    boxes.


    Scroll Bars: Used to move through content in a window.


    Group Boxes: Used to keep similar controls together.


    Creating and Using Controls


    You make controls by using the CreateWindow or CreateWindowEx function and by
    choosing the right class name for the type of control you want. For instance,
    to make a button:


    HWND hButton = CreateWindow(


    "BUTTON",       // Predefined class; Unicode assumed


    "Click Me",     // Button text


    WS_TABSTOP | WS_VISIBLE | WS_CHILD | BS_DEFPUSHBUTTON,  // Styles


    10,             // x position


    10,             // y position


    100,            // Button width


    30,             // Button height


    hWnd,           // Parent window


    NULL,           // No menu.


    (HINSTANCE)GetWindowLongPtr(hWnd, GWLP_HINSTANCE),


    NULL            // Pointer not needed.


    );


    Handling Control Messages


    Controls send messages to the main window when things happen. These messages are
    handled in the window process. For example, to manage when a button is clicked:


