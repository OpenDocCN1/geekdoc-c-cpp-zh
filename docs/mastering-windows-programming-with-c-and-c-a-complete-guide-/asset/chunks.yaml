    \    }\n}\n```\n\n### 常见消息\n- `WM_CREATE`：当创建窗口时发送此消息。\n- `WM_CLOSE`：当窗口即将关闭时发送此消息。\n\
    - `WM_PAINT`：当窗口需要重绘时发送此消息。\n- `WM_DESTROY`：当窗口关闭时发送此消息。\n\n## WinMain 函数\n\n\
    #### WinMain 的目的\n`WinMain` 函数是 Windows 程序启动的地方。它启动应用程序、创建主窗口并运行消息循环。\n\n####\
