  trans: "\n\n# 映射文件视图\n\n使用 `MapViewOfFile` 使文件的部分在程序的内存中可见。\n\n```cpp\nLPVOID pMapView\
    \ = MapViewOfFile(\n    hMapping,            // 映射句柄\n    FILE_MAP_ALL_ACCESS,\
    \ // 访问权限\n    0,                  // 文件偏移高位\n    0,                  // 文件偏移低\n\
    \    fileSize            // 要映射的字节数\n);\n```\n\n## 访问映射的文件\n\n你可以使用 `MapViewOfFile`\
    \ 返回指针来获取文件数据。\n\n```cpp\nmemcpy(pMapView, \"New Data\", 8); // 向文件写入数据\n```\n\
    \n## 移除文件映射\n\n使用 `UnmapViewOfFile` 将文件从内存中移除，并使用 `CloseHandle` 关闭映射对象。\n\n```cpp\n\
    UnmapViewOfFile(pMapView);\nCloseHandle(hMapping);\n```\n\n## 错误处理与诊断\n\n### 处理错误\n\
    \n管理文件和数据时，良好的错误处理非常。当函数不起作用时，使用 `GetLastError` 获取错误代码。\n\n```cpp\nDWORD error\
    \ = GetLastError();\n```\n\n### 使用工具解决问题\n\n- **错误代码**：检查 Windows 指南以理解错误代码。\n\
    - **调试**：使用工具跟踪文件活动并发现问题。\n\n## 结论\n\n在本章中，我们讨论了 Windows 编程中处理文件和数据的重要部分。我们研究了创建文件、读取、写入和关闭文件。我们还学习了如何管理文件细节、文件夹以及文件之间的关系。了解这些概念对于在应用程序中良好管理文件和数据至关重要。在下一章中，我们将探索多线程和并发，寻找提高应用运行性能和响应的方法。\n\
    \n# 第 6 章\n\n## 多线程与并发\n\n### 多线程简介\n\n多线程是一种编程方式，允许一个程序中同时运行多个线程。线程共享相同的资源但独立运行。这种方法通过利用多个处理器核心并为用户提供更流畅的体验，可以让应用程序运行得更好。\n\
    \n### 核心概念\n\n- **线程**：程序中可以独立运行的最小单元。\n- **进程**：一个包含一个或多个线程的运行中的程序。\n- **并发**意味着系统可以同时执行许多任务。\n\
    \n### 使用多线程的优势\n\n- **响应性**：通过将后台工作等任务移动到其他地方，保持应用运行流畅。\n- **性能**：利用多个 CPU 核心同时进行计算。\n\
    - **资源共享**：允许线程在进程中有效地共享内存和资源。\n\n## 创建与管理线程\n\n### CreateThread 函数\n\n在 Windows\
    \ 中，你使用 `CreateThread` 函数创建线程。该函数会创建一个新线程并提供一种访问它的方法。\n\n```cpp\nDWORD WINAPI\
    \ ThreadFunction(LPVOID lpParam) {\n    // 此处编写线程代码\n    return 0;\n}\n\nHANDLE\
    \ hThread = CreateThread(\n    NULL,               // 默认安全属性\n    0,         \
    \         // 默认栈大小\n    ThreadFunction,     // 线程函数\n    NULL,               //\
    \ 线程函数的参数\n    0,                  // 默认创建标记\n    NULL                // 标识符指针\n\
    );\n```\n\n- **线程函数**：线程将执行的任务。\n- **线程句柄**：用于控制线程（例如等待它完成）。\n\n### 等待线程\n\n要等待线程完成，请使用\
    \ `WaitForSingleObject` 函数。\n\n```cpp\nWaitForSingleObject(hThread, INFINITE);\
    \ // 无限等待线程完成\n```\n\n### “关闭线程句柄”\n\n使用 `CloseHandle` 关闭线程句柄并释放资源。\n\n```cpp\n\
    CloseHandle(hThread);\n```\n\n## 同步技术\n\n同步确保多个线程可以安全地使用共享资源，避免数据冲突或问题。管理同步的常用方法包括锁（互斥锁）、关键区域和信号量。\n\
    \n### 重要部分\n\n关键区域（Critical sections）有助于同一进程中的线程流畅地工作。它们比互斥锁更容易使用且速度更快。\n\n###\
    \ 使用关键区域\n\n1. **初始化**：初始化关键区域对象。\n   ```cpp\n   CRITICAL_SECTION cs;\n   InitializeCriticalSection(&cs);\n\
    \   ```\n2. **进入**：在访问共享资源之前进入关键区域。\n   ```cpp\n   EnterCriticalSection(&cs);\n\
    \   // 访问共享资源\n   ```\n3. **退出**：完成后离开关键区域。\n   ```cpp\n   LeaveCriticalSection(&cs);\n\
    \   ```\n4. **删除**：不再需要时删除关键区域。\n   ```cpp\n   DeleteCriticalSection(&cs);\n \
    \  ```\n\n### 互斥锁 (Mutexes)\n\n互斥锁用于在程序不同部分同时工作时保持顺序。它们确保一次只有一个线程可以使用互斥锁。\n\n\
    ### 使用互斥锁\n\n1. **创建**：创建或打开一个命名的互斥锁。\n   ```cpp\n   HANDLE hMutex = CreateMutex(NULL,\
    \ FALSE, \"MyMutex\");\n   ```\n2. **获取**：等待互斥锁可用。\n   ```cpp\n   WaitForSingleObject(hMutex,\
    \ INFINITE);\n   ```\n3. **释放**：完成后释放互斥锁。\n   ```cpp\n   ReleaseMutex(hMutex);\n\
    \   ```\n4. **关闭**：关闭互斥锁句柄。\n   ```cpp\n   CloseHandle(hMutex);\n   ```\n\n###\
    \ 信号量 (Semaphores)\n\n信号量控制有多少线程可以使用资源。它们用于管理限制的数量。\n\n### 使用信号量\n\n1. **创建**：创建一个带有初始计数的信号量。\n\
    \   ```cpp\n   HANDLE hSemaphore = CreateSemaphore(NULL, 1, 1, \"MySemaphore\"\
    );\n   ```\n2. **等待**：递减信号量计数，如果为零则等待。\n   ```cpp\n   WaitForSingleObject(hSemaphore,\
    \ INFINITE);\n   ```\n3. **释放**：增加信号量计数。\n   ```cpp\n   ReleaseSemaphore(hSemaphore,\
    \ 1, NULL);\n   ```\n4. **关闭**：关闭信号量句柄。\n   ```cpp\n   CloseHandle(hSemaphore);\n\
    \   ```\n\n## 线程通信\n\n线程经常需要相互通信或共享信息。可以使用共享内存、发送消息或使用同步来实现。\n\n### 使用公共内存\n\n\
    同一进程中的线程可以通过全局变量或静态变量直接使用共享内存。我们需要保持同步以避免破坏数据。\n\n```cpp\nint sharedData;\n\n\
    void ThreadFunction(LPVOID lpParam) {\n    EnterCriticalSection(&cs);\n    sharedData++;\
    \ // 修改共享资源\n    LeaveCriticalSection(&cs);\n}\n```\n\n### 消息传递\n\n线程可以使用消息队列或进程间的通信方式来发送消息。\n\
    \n**示例：PostMessage 函数**\n```cpp\nPostMessage(hwnd, WM_USER + 1, (WPARAM)wParam,\
    \ (LPARAM)lParam);\n```\n- `hwnd`：接收消息的窗口句柄。\n- `wParam`：与消息相关的信息。\n- `lParam`：与消息相关的额外信息。\n\
    \n## 管理线程生命周期\n\n### 动态创建线程\n\n线程可以在需要时启动，这有助于应用程序更好地利用资源。\n\n```cpp\nHANDLE hThread\
    \ = CreateThread(NULL, 0, ThreadFunction, NULL, 0, NULL);\n```\n\n### 停止线程\n\n\
    线程应该正确结束以防止浪费资源。仅将 `TerminateThread` 作为最后的选择。\n\n```cpp\nTerminateThread(hThread,\
    \ 0); // 不推荐；使用适当的同步\n```\n\n### 线程池\n\n线程池是一组可以反复用于不同任务的工作线程，这有助于运行得更好并更高效地利用资源。\n\
    \n### 使用线程池 API\n\n```cpp\nHANDLE hPool = CreateThreadpool(NULL);\nSetThreadpoolThreadMaximum(hPool,\
    \ 4);\nSetThreadpoolThreadMinimum(hPool, 2);\n```\n- `CreateThreadpool`：创建一个线程池句。\n\
    - `SetThreadpoolThreadMaximum`：设置允许的最大线程数。\n- `SetThreadpoolThreadMinimum`：设置最小线程数。\n\
    \n## 处理线程错误\n\n### 寻找错误\n\n始终通过 `GetLastError` 函数查找线程操作中的错误。\n\n```cpp\nDWORD\
    \ error = GetLastError();\n```\n\n### 调试线程\n\n使用调试工具跟踪线程运行情况并发现问题。\n- **Visual\
    \ Studio 调试器**：让你检查和管理线程。\n- **修复 API 问题**：使用 `DebugActiveProcess` 和 `DebugSetProcessKillOnExit`\
    \ 等工具。\n\n## 高级多线程概念\n\n### 线程安全\n\n确保共享资源可以被不同线程安全地使用。\n- **原子操作**：在多个线程同时工作时，使用原子操作安全地更新数据。\n\
    \n"
