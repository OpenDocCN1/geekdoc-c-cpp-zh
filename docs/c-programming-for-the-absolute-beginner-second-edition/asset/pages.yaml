  md: '# ALLOCATING FROM THE HEAP


    So now, gentle reader, you are ready for a whole new world of possibility: you
    are ready to learn how to use the heap! This will open up many new abilities in
    your programming, but also a whole new set of possible bugs. In fact, the majority
    of bugs in C++ code have to do with the heap! It is very important to structure
    your code carefully so that you can keep track of everything you''re allocating
    and de-allocate it when you are finished with. With a few simple techniques that
    we will show you, most of the problems should be avoided! So, without any more
    introduction, let us plunge right in!


    You allocate memory in the heap using the `new` operator. This operator returns
    a pointer to the newly allocated memory. The syntax for the `new` operator is
    as follows:


    ```

    new data_type(constructor_args);

    ```


    Here `data_type` is any valid data type or class. To use this memory, you must
    assign it to a pointer variable. Keeping track of memory on the heap is where
    pointers come in really handy. For example, to create a `Point` object in the
    heap, you can do the following:


    ```

    Point* myPoint = new Point(2,4);

    ```


    If you are allocating a built-in type, like an `int`, you do not need the brackets:


    ```

    int* myInt = new int;

    ```


    That''s really all there is to it. The `new` operator is actually very easy to
    use. All memory that you allocate with the `new` operator must be de-allocated
    with the `delete` operator when you are done with it. If you do not free the memory
    you use, this memory will not be available to use later in the program. Forgetting
    to free heap memory is called a memory leak, and you should always avoid it.


    The `delete` operator acts on a pointer to a section of memory allocated with
    the `new` operator. If the `delete` operator is used on anything else, it will
    cause an error. The syntax for the `delete` operator is as follows:


    ```

    delete pointer;

    ```


    For example, to free the memory allocated in the preceding examples, do the following:


    ```

    delete myInt;

    myInt = 0;

    delete myPoint;

    myPoint = 0;

    ```'
