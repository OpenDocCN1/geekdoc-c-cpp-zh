    # UNDERSTANDING ARGUMENT RESOLUTION


    Function templates are not quite the same as class templates. With function templates,
    you do not always have to provide a template parameter when you call the function.
    Sometimes, the computer can figure out what the parameters are supposed to be
    simply from the arguments you pass. Here is an example:


    ```

    add(5,3);

    ```


    Don''t be fooled, brave reader; this is not the `add` function from Chapter 4.
    The version with the template is called here. Because the arguments are both integers,
    the computer can deduce that the parameter (T) is supposed to be int. Now, you''re
    venturing into the land of true programming; however, for now, you don''t even
    have to know that the add function has a template. You simply call it like any
    other function.


    If the arguments for the preceding function were not clear (for example, if one
    were an integer and the other a floating-point), the compiler would return an
    error. Computers have a limited intelligence, and they can''t decide whether the
    integer should be converted to a floating-point or the floating-point should be
    converted to an integer. If you choose not to provide parameters for function
    template calls, be sure that the arguments clearly designate what the parameters
    are supposed to be.


    Also, if all the parameters are not contained in the argument list (for example,
    one parameter is used only for a return type), you must provide a full parameter
    list for the function call.


    Now, as a case study, you are ready to create a function to typecast for you (In
    Chapter 2, we define typecasting as the act of converting data from one type to
    another, retaining almost the same value.)


    This function is an example of where one of the parameters is not used in the
