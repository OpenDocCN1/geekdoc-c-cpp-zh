    # Comments


    The first line in the Hello World program is a comment. It has no influence on
    the way the program runs. Whenever you type two forward slashes (/) together,
    you are telling the compiler to ignore the rest of that line. The purpose of comments
    is to help the code more understandable. Comments can be written in one of two
    ways. A single-line comment (like the preceding one) consumes only one line. Everything
    after the // on the line is ignored, as shown here:


    ```

    // I am an army of one

    ```


    Another form of the C++ comment enables you to spread a single but lengthy comment
    over as many lines as you want:


    ```

    /* dragons rule the world */

