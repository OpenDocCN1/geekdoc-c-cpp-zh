  md: '# ACKNOWLEDGMENTS


    The amount of time and effort involved in the process of publishing a book is
    considerable, and this book is no exception. As only one cog in the vast machine
    of effort involved, it is difficult for me to fully appreciate all of the hands
    that have touched this edition. However, without the ambition and drive of my
    original co-author, Dirk Henkemens, this book would have remained an unrequited
    dream. His drive and perseverance taught me that seemingly impossible things,
    like writing a book, were not only possible, but readily attainable.


    I thank Course Technology PTR for making this book possible and supporting Mitzi
    Koontz, my acquisitions editor, for all of her efforts.


    I am deeply indebted to Keith Davenport, the technical editor, whose careful eye
    ensured all of the code in this book works as it should.


    Jenny Davidson, the project and copy editor, was an exceptional resource throughout
    the project and her careful editing improved this work by orders of magnitude.


    I extend a special thank you to everyone who played a role in preparing this book
    for publication, including Value Chain International, layout; Sara Gullion, proofreader;
    and Sharon Shock, indexer. All of you played a big role in making this book what
    it is.


    We give praise to Scott Greig, the lead programmer at BioWare Corp. and the author
    of this book''s foreword. Scott, are our idol. Without you, who could aspire to
    be?


    I am deeply thankful for the scrutinizing eye of Jen Janzen whose talent for editing
    is unrivaled. Every line she touches is improved by orders of magnitude.


    Finally, I''d like to give thanks to my parents, for putting up and supporting
    me all of these years.'
