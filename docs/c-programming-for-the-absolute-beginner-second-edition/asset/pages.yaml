    # THE INCREMENT OPERATOR


    If you want to increase the value stored in an integer by exactly one, you can
    use the increment operator (++) to make your code shorter. The increment operator
    is a kind of mathematical operator that increases the value of a variable by one.
    Instead of writing:


    ```

    count = count + 1;

    ```


    you can write:


    ```

    count++;

    ```


    You can also use the decrement operator (--) in the same way to decrease an integer''s
    value by one. The decrement operator subtracts one from the value of the number.
    Instead of using:


    ```

    count = count - 1;

    ```


    you can use:


    ```

    count--;

    ```


    As well as being more concise and simpler to type, the increment and decrement
    operator compile into slightly more efficient machine code, so it is beneficial
    to use them whenever possible.'
