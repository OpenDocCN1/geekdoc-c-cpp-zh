  md: '# C++ Programming for the Absolute Beginner, Second Edition


    Although C++ does not directly support I/O operations as part of the base language,
    it does include I/O as part of the standard library. Even with I/O as part of
    the standard library, C++ leaves much of the operation of streams to programmers.
    By this, we mean that C++ has a very basic support for I/O, so programmers must
    adjust this low-level support to meet their needs.


    In order to learn I/O, you need to know the terminology. Here are several of the
    definitions we use throughout this chapter:


    +   **Stream object.** Acts as a source and a destination for bytes. The stream
    object manipulates an ordered linear sequence of bytes. This series of bytes can
    represent a screen, a file, or anywhere else the programmer wants to go. You find
    the classes that handle streams in several of the library files: `<fstream>`,
    `<iomanip>`, `<ios>`, `<iosfwd>`, `<iostream>`, `<istream>`, `<ostream>`, `<streambuf>`,
    and `<strstream>`.


    +   **Manipulator.** Manipulates the data of the stream in some way. For example,
    a manipulator can make all characters uppercase or can convert numbers using decimal
    notation to hexadecimal notation.


    +   **Insertion.** Places bytes into the stream. The methods that perform the
    insertions are called inserted.


    +   **Extraction.** Takes bytes from the stream. The methods that perform the
    extractions are called extractors.


    # Understanding The Header Files


    In the preceding section''s bullet on stream objects, we listed several header
    files. Each of these header files encapsulates a section of the overall C++ stream
    architecture. All of these files together to give the complete I/O support provided
    by C++. Each of these files completes its specific task to give C++ the most diverse
    I/O functionality of any programming language. The purpose of each of the headers
    is as follows:


    +   <fstream>`. Contains the definition for several template classes that support
    the `iostream` header file''s operations on sequences stored in external files.


    +   <iomanip>`. Contains several single-argument manipulators.


    +   <ios>`. Contains a majority of the format manipulators for the `iostream`
    header file''s classes.


    +   <iosfwd>`. Contains the forward declarations for the `iostream` header file''s
    classes.


    +   <iostream>`. Contains the declarations for the standard global stream objects
    such as `cin` and `cout`.'
