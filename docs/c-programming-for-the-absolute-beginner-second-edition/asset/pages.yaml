    # DECLARING AND ASSIGNING VARIABLES


    Before you use a variable, you must declare it. By declaring a variable, you are
    telling the computer to set aside a certain amount of memory to store data and
    give that space a name. Different types of variables need different amounts of
    memory. For example, to declare an int, you type the following:


    ```

    int x;

    ```


    The syntax for the variable declaration is:


    ```

    variable_type identifier;

    ```


    Then to assign data to that variable, you use the assignment operator (=). Operators
    are symbols or words that perform... well, operations. The operators can represent
    mathematical, relational, or other types of operators. In this chapter, we cover
    only the mathematical operators and the assignment operator. The assignment operator
    puts the values on the right side into the values on the left. Here''s an example:


    ```

    x = 5;

    ```


    Here, the variable, x is now holding the value, 5. The memory that was set aside
    for x is filled with the value, 5. Be sure to distinguish between the equal sign
    in mathematics and in programming. Here, the data on the right is assigned to
    the variable on the left. This has nothing to do with testing whether both sides
    are equal. The single equal sign does not mean “is equivalent to.” You might take
    a minute and read this information again; it is an important concept.


    Variables can also be on the right side of the assignment operator, as shown here:


    ```

    x = y;

    ```


    This puts the value stored in y into x. This does not take the value out of y.
    Instead, it makes a copy of y''s value and stores it in x. Remember, literal data
    cannot be on the left side of the assignment operator:


    ```

    5 = x;

    ```'
