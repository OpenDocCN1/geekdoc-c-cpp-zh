    it. For example, a bow has specific properties—such as color, number of arrows,
    and weight—and specific capabilities—such as the ability to fire. If you request
    a bow from an armory, you do not yet know what the properties of the bow will
    be. However, once you see the bow, you can determine its color, weight, and quiver
    size. As you will learn in the following section, this is very similar to the
