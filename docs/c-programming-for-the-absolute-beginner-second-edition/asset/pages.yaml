  md: '# INTRODUCTION TO FILE STREAMS


    To increase the functionality of games, you often need to store millions of pieces
    of data—for example, map information or data for a player''s last saved game.
    You store this data by using specialized file i/o classes: ofstream, ifstream,
    and fstream, contained in the ofstream, ifstream, and fstream header files, respectively.


    # OPENING FILES


    Generally, your first action with a file stream object, such as one derived from
    the ofstream, ifstream, and fstream classes, is to associate it with the file
    with which you want to work. You make the association using the open() method
    or the constructor of each of the classes.


    The open() method''s prototype looks like this:


    ```

    void open(const char * filename, openmode mode);

    ```


    filename is a string of characters representing the filename, and mode is a combination
    of the flags shown in Table 9.1.


    Flags are connected with the bitwise or (|) operator. Say that you want to open
    *level1.map* to output in binary mode. The open function might look like this:


    ```

    ofstream file:

    file.open("level1.map", ios::out | ios::binary);

    ```


    Each of the file classes includes the open() method; however, each stream has
    several default flags specifying its use. The default values, however, are applied
    only if the method is called without flags. The default flags are shown in Table
    9.2.


    | Table 9.1 FLAGS FOR OPENING A FILE

    | Flag | Function |

    | ios::in | Opens file for reading. |

    | ios::out | Opens file for writing. |

    | ios::ate | Initial position is at the end of the file. |

    | ios::app | Appends every output at the end of the file. |

    | ios::trunc | Erases a file, if one already existed. |

    | ios::binary | Access to the file is in binary mode. |'
