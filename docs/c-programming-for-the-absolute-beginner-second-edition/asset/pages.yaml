    You just created two bows, one named red and one named blue. Each of these object
    variables stores an object with several properties (such as a color and 20 arrows
    each), and each knows how to do two things: draw and fire (using the draw() and
    fire() methods). You can change the object stored in an object variable with the
    assignment operator (=), just as normal variables. Here is an example:


    ```

    Bow b1("blue");

    Bow b2("red");

    b1 = b2;

    ```


    b1 and b2 will then store a separate copy of the bow red.


    # Taking the Easy Way Out with Default Constructors


    If no arguments are provided when creating an object variable, the computer will
    execute the default constructor. A default constructor can be one of two things.
    If the class has no constructor, the default constructor is a blank constructor
    with no arguments; if you provide a constructor that has no arguments, the default
