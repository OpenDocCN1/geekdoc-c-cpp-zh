    **variable scope** The range of a program where a particular variable can be accessed.


    **vector** A complex data structure that is part of the standard library. It is
    in the <vector> library.


    **virtual functions** Polymorphic functions that ensure the correct class is referenced
    when pointing to a virtual function.


    **wrapper class** A class that extends the basic functionality of a primitive
    data type or object.'
