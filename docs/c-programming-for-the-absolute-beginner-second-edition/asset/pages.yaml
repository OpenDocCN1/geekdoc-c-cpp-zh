  md: '# Chapter 2 • Descending Deeper into Variables


    # THE FLOATING-POINT TYPES


    If you want to store decimals or fractions, you need the floating-point data types,
    float and double.


    The float or single-precision floating-point data type is 4 bytes long. It can
    store the positive or negative decimal or non-decimal values with a maximum and
    minimum precision of 1.2 × 10^−38 to 3.4 × 10^−38. Remember that these values
    can be positive or negative.


    Often, programmers express float and the other non-integers in scientific notation.
    Scientific notation is a way to express extremely large or small numbers in a
    relatively small space.


    Scientific notation just a shortcut method for writing floating-point numbers
    that begin to get out of hand, such as 0.000000000000000002. Here are some numbers
    written in scientific notation:


    5.6543e17 -4.02934e5 -17.204e-19


    Here''s your rule to turn a scientific number into a regular format: Move the
    decimal as many places as the number to the right of the e(the number after the
    e is called the exponent). To convert 5.6543e17 to a regular number, you do the
    following:


    +   1. Locate the number to the right of the e, the 17.

    2. Move the decimal 17 places to the right. You know it''s to the right because
    the 17 has no negative sign in front of it. Pad the new places with zeros. You
    end up with 564300000000000000.0, which is what 5.6543e17 means. This is better
    than typing 5643000000000000000.0.


    If the number has a negative exponent as 5.6543e−17, you just move the decimal
    to the left 17 places and end up with 0.00000000000000005643.


    Whatever you are storing is converted into scientific notation. Then it is rounded
    to the nearest 10^−38 place. For example, if you store Pi (3.141592653897232846
    . .) with a precision of two decimal places, the number will be rounded to 3.14,
    the standard Pi.


    You declare the floating-point using the float keyword:


    ```

    float afloat = 3.156;

    float negativeFloat = -678.876;

    cout << afloat << negativeFloat;

    ```


    To store a fraction, a computer must convert it from its a/b (fractional) form
    to a decimal form. When you access the fraction, the float will give you the most
    accurate decimal version that it can store.'
