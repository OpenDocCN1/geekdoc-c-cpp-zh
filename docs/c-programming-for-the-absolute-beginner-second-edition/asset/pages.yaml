    If you started at the beginning of this book, you are well on your way to becoming
    a professional programmer. You have learned the basics of C++ programming, and
    now you''re ready for more advanced concepts. In this chapter, you learn about
    templates, which will serve as a springboard to the C++ standard library. You
    study some of the main components of the standard library. If you''ve ever considered
