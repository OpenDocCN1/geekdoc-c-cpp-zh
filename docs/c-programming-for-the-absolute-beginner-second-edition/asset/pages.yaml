    the computer that when you add an integer and a floating-point, you are floating
    it to be returned. Here are some examples of using this new version of the add
    function:


    ```

    cout << add(3.5, 7); //displays 10.5

    out << add(7, 3.5); //displays 10.5

    ```


    Do not be overwhelmed by function template overloading. It really is just like
    normal overloading, except that you must apply a few rules. If you are ever in
    doubt, just consult the list of rules.


    # USING THE STANDARD LIBRARY


    The C++ standard library was designed to be useful for almost every C++ user.
