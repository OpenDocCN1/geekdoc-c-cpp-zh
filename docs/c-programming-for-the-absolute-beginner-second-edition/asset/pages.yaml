  md: '# TABLE 9.2 DEFAULT FLAGS FOR THE FILE CLASSES


    | Class | Flags |

    | --- | --- |

    | ofstream | ios::out | ios::trunc |

    | ifstream | ios::in |

    | fstream | ios::in | ios::trunc |


    You can also open a file by including the filename in the constructor. The class
    constructors use the same argument as the open() method. For example, if you use
    the ifstream class, the prototype for the constructor will look like this:


    ifstream::ifstream(const char * filename, openmode mode);


    Here filename and mode mean the same thing as in the open() method.


    You can check whether a file properly opened by calling to the method is_open():


    bool is_open()


    is_open() returns true if the file is properly open and false if not.


    Here are the usual reasons why a file does not open correctly:


    +   * A bad filename—for example, a name for a file that doesn''t exist.

    * A corrupt file—for example, one on a bad sector of a hard drive.

    * Another program has exclusive access—this means that the program with exclusive
    access can access the file. This is therefore unusable by other programs until
    the program with exclusive access relinquishes its exclusive privileges.

    * Windows protects the file—Windows sometimes automatically protects files in
    particular folders or of certain types. Contact your system administrator if this
    happens.


    # CLOSING FILES


    In order to make a file accessible to other programs, you must close the file.
    To close only one file at a time, use the close method. For each of the three
    classes, use the close member to to close a file, as follows:


    ```

    void close();

    ```


    If a file stream object is destroyed, its destructor will automatically close
    the file associated with that object.'
