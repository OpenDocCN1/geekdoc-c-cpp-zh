  md: '# C++ Programming for the Absolute Beginner, Second Edition


    You can also have pointers to constants. With a pointer to a constant, you can
    change the memory address stores, but not the constant pointed to. To declare
    a pointer to a constant, you add the const keyword before the * operator, as shown
    here:


    ```

    char const* pcc; // pointer to a constant char

    const int pci; // pointer to a constant int

    ```


    In the preceding code snippet, pcc can change which character it points to, but
    not the value of this constant character. Pointers to constants do not need to
    be initialized when declared the pointer is still variable, but the variable pointed
    to isn''t, as shown here:


    ```

    char c;

    pcc = &c;

    *pcc = ''d''; // this is illegal

    pcc = 0; // this is illegal

    ```


    You can also have constant to constants, where neither the memory address nor
    the thing pointed to be changed. To create such a pointer, you put the keyword
    const before and after the * operator, as shown here:


    ```

    int x;

    const int* const cpci = x;

    ```


    The only thing you can do with cpci is read its value and the value of the variable
    it points to (x). It is important to use const wherever you can in your code to
    ensure that variables get changed when you mean for them to:


    # INTRODUCING POINTERS AND FUNCTIONS


