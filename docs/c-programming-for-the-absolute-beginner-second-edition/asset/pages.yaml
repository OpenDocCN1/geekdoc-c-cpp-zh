  md: "# C++ Programming for the Absolute Beginner, Second Edition\n\nThis declaration\
    \ seems pretty simple. It's just a normal template. However, the vector class\
    \ template has a specialization as well as this more general declaration. A vector\
    \ must treat an array of void pointers differently in some way. Here is the declaration\
    \ for the Vector class's specialization:\n\n```\ntemplate<> class Vector<void*>;\n\
    ```\n\nThe preceding code essentially denotes a specialization of Vector to be\
    \ used whenever void* is used as the parameter type. That is, when you use void*\
    \ as a parameter, the specialization is used. The specialization basically takes\
    \ over. If you use any other type, the first version will be used. Here is an\
    \ example of using specializations:\n\n```\n#include <iostream>\n#include <string>\n\
    ```\n\n```\ntemplate<class T> class SayHi\n(\n    T data;\npublic:\n    SayHi(T\
    \ a) : data(a)\n    void display() { cout << data << endl; }\n)\n```\n\n```\n\
    template<> class SayHi<string>\n(\n    string data;\npublic:\n    SayHi(string\
    \ a) : data(a)\n    void display() { cout << data.c_str() << endl; }\n)\n```\n\
    \n```\nint main(void)\n(\n    SayHi<int> hi(5);\n    hi.display();\n    SayHi<string>\
    \ hs(\"Hello World\");\n    hs.display();\n    return 0;\n)\n```\n\nOutput:\n\
    5\nHello World"
