    # ITERATING THROUGH A STRING


    Iterators are common to all containers and strings. Iterators enable you to navigate
    through the values stored in a container or string. All iterators provide a similar
    interface, which is one of the main strengths of the standard library. If you
    learn about the interface for one container, you can easily use any container.
    For a basic_string, the individual characters in the string are the values navigated
    by the iterator. All the code for these iterators is included with <iterator>.


    Some containers (for this discussion, a string is being treated as a container
    of characters) can provide certain operations efficiently and cannot. For example,
    a list cannot access any particular value that it stores at any given time. In
    other words, a list does not have random access. A vector, on the other hand,
    does. There are five categories of iterators, dependant on the kind of access
    operations that are available. They are input, output, forward, bi-directional,
    and random access.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'Input can only read values from the elements and navigate forward through the
    container (input from the container to you). Output can only write values to the
    elements and navigate forward through the container (output from the container).
    Forward can read, write, and navigate forward forward through the container. Bi-directional
    can read, write, and navigate forward and backward. Random access can read, write,
    and navigate to any element at random.


    The operations available to each type of iterator are summarized in Table 8.1.


    | Operation Type | Out | In | Forward | Bi | Rand |

    |---|---|---|---|---|--|

    | Forward Iteration (++) | Yes | Yes | Yes | Yes | Yes |

    | Backward Iteration--) | No | No | No | Yes | Yes |

    | Random Access ([], +=, -= +, -) | No | No | No | No | Yes |

    | Read (*Iterator) | No | Yes | Yes | Yes | Yes |

    | Write (*Iterator = ) | Yes | No | Yes | Yes | Yes |

    | Member Access (--) | Yes | No | Yes | Yes | Yes |

    | Comparison (==, !=, <=, >=) | No | Yes | Yes | Yes | Yes |

    | More Comparison(<, <=, >=) | No | No | No | No | Yes |


    As you can see from the operations in Table 8.1, iterators are similar to arrays.
    In fact, a pointer to an array is an iterator for the array. All iterators provide
    operators that match those of pointers. To the untrained eye, an iterator can
    appear to be a pointer because it is used exactly like one.


    The categories of iterators form a hierarchy:


    ```

    struct input_iterator_tag {};

    struct output_iterator_tag {};

    struct forward_iterator_tag : public input_iterator_tag {};

    struct bidirectional_iterator_tag : public forward_iterator_tag {};

    struct random_access_iterator_tag : public bidirectional_iterator_tag {};

    ```


    This hierarchy matches the capabilities of each type. For example, a random access
    iterator can function as an input iterator, but not vice versa. Output iterators
    are left out of the hierarchy because they don''t fit with the rest. If one were
    included, it would become a second class to forward_iterator_tag, but that does
    not create any significant advantages, it''s not.'
