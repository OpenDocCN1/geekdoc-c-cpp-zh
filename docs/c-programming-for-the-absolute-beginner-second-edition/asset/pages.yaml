  md: '# Chapter 8 • Using Templates


    ```

    template<class C, class T = char_traits<C>, class A = allocator<C>> class std::basic_string;

    ```


    As you can see, the class is part of the std namespace (everything in the standard
    library is), and the template takes three parameters. So you have to provide a
    minimum of only one. C is the type of character, T is the char_traits associated
    with that character, and A is a type called an allocator that deals with allocating
    memory for the character. By default, T and A are the specializations of respective
    classes for the character type. You should leave them alone in all cases.


    Just as the char_traits class defines standard names for things with typedef,
    so does the basic_string class. Here is the list of these typedefs:


    ```

    // type of char_traits used (char_traits<char> usually

    typeef T traits_type;

    // type of memory manager (allocator<char> usually

    typeef A allocator_type;

    // kind of character being stored (char usually)

    typeef T::char_type value_type;

    // some kind of unsigned (unsigned int maybe)

    typeef A::size_type size_type;

    //reference to individual character (char& reference)

    typeef A::reference reference;

    //pointer to individual character (char* usually)

    typeef A::pointer pointer;

    //the type used for a standard iterator

    typeef compiler_dependent iterator;

    //the type used for a reverse iterator

    typeef std::reverse_iterator<iterator> reverse_iterator;

    //used to represent every character of a string

    static const size_type npos;

    ```


    You must use npos at the beginning of a template parameter when you use the parameter
    to access things inside it. For example, to define value_type, you need to access
    char_type from inside the char_traits class. compiler_dependent indicates that
    the code placed based on which compiler you are using. Code is different for every
    compiler, regardless of what it is, it will indicate some type of standard iterator.
    npos represents "all characters." That is, when you need to supply the number
    of characters to use for an operation, you can use npos to mean all of them (from
    whatever point to the end). Keep in mind that this necessarily mean the whole
    string. The most accurate meaning is "all the string."'
