  md: "int RemoveElementAt(int location);\n~Storage();\n\nThis class stores an array\
    \ of integers and provides methods to add, view, and remove the elements. But\
    \ what would you do if you wanted to store floats or characters? You'd have to\
    \ copy the preceding code and change the integers to floats or characters, which\
    \ would be inefficient. Or you might somehow pass the data type that you want\
    \ to store as a parameter. Then you might have a switch statement to handle each\
    \ case. This would quickly become complicated and unmanageable.\n\nThe best solution\
    \ to this problem is to use templates. A template version of the Storage class\
    \ can store any kind of data. Templates are a simple way to pass the data type\
    \ as a parameter without the methods becoming complicated and unmanageable. Here\
    \ is how the Storage class looks when you use a template:\n\n```\ntemplate<class\
    \ T> class Storage\n(\n  T* data;\n  int numElements;\npublic:\n  Storage();\n\
    \  Storage(T* array, int num) :\n    data(array), numElements(num) {}\n  Storage(int\
    \ num) : data = new int[num];\n  void AddElement(T element);\n  T ElementAt(int\
    \ location);\n  T RemoveElementAt(int location);\n~Storage();\n```\n\nAs you can\
    \ see, this is fairly different. It might look a little unfamiliar to you at the\
    \ moment, but soon it will become more familiar. The only thing that has changed\
    \ is the replacement of int with T (but not all instances of int) and the addition\
    \ of template<T> immediately before the class.\n\nThe uses of T are easy to explain.\
    \ They act as a placeholder for whichever kind of data the class decides to store.\
    \ So, if the user decides to store integers, all instances of T will be ints.\
    \ Some uses of int remain because they aren't part of the data. Some of them are\
    \ just for the number of elements (which should always be an integer value)."
