- img_proc: true
  md: '# COMPUTER BASICS


    A computer is comprised of a number of components. Some are very easy to identify:
    the keyboard, mouse, or the monitor. Others are internal and hidden to the novice
    user. These include the CPU (central processing unit) and the memory.


    The CPU is the brain of the computer. It is the circuit-drenched core from which
    all decisions are made. If your computer one day decided to go all zombie on you
    and you needed to know where to stay, this would be the part aim for. And thus,
    the foul beast would return to the underworld from when it came!


    Luckily, you probably won''t have to worry about zombie computers for some time,
    so you can just feel that away. The next most important component is the memory.
    Often called RAM (random-access memory), this is where the data and instructions
    are stored.


    Data and instructions? Obviously you''ve heard these terms before, but what do
    they mean here? Well, data can refer to many things. Keyboard input, file contents,
    web server requests, any piece of information that is used by the computer. Instructions
    are a special kind of data. They "instruct" the CPU what to do. Now move numbers,
    this data here, jump to this instruction next. These are examples of CPU instructions.


    The main operation of the computer is executing these instructions. Fetch the
    next instruction. Execute it. Fetch the next instruction. Execute it. Over and
    over again. Except this happens very fast. A 1 GHz CPU can execute one billion
    instructions per second! Nothing to shake a stick at (I''m not sure why one would
    want to shake a stick at things... the motivation seems to be lacking).


    # DEFINING SOURCE CODE


    Computers work by executing a series of simple instructions, but fortunately,
    programmers no longer need to write programs at a low level. Special languages,
    called programming languages, have been developed that allow ideas to be expressed
    much easily. It is up to an intermediate program, called a compiler, to translate
    ideas written in a programming language into a series of instructions that the
    computer can understand.


    ![](img/62e929c461e30706acae7c69369a00d9_20_0.png)


    You may wonder why just cannot tell the computer what to do. "Go to this webpage"
    or "Play this song" are examples of how we''d like to interact with a computer.
    The problem is that English (and all other so-called "natural" languages, like
    French, German, etc.) is too complex.Programming languages like C++ are simpler
    and more precise. Even so, well-written code can be almost as easy to read as
    English.'
