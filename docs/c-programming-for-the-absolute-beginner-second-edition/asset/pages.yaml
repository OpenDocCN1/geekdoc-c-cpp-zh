    2. What is the purpose of an exception hierarchy?


    ANSWER:


    Having numerous different exceptions can make exception handling unmanageable,
    but having a few generalized ones is not always optimal. With an exception hierarchy,
    you can choose exactly how detailed you need to make your exception catches.


    3. How can you design your programs so that they will not crash?


    ANSWER:


    You will never be able to create programs that will never crash. However, designing
    your program carefully, using exception handling, and doing a good job with debugging
    will definitely help in this regard.


    4. What is the definition of an exception?


    ANSWER:


    An exception is a non-routine circumstance that a section of code can''t handle.


    5. At what point in your program''s development should you use assertions?


    ANSWER:


    You should use assertions throughout your program''s development, but you should
    remove them when the program is released to the public.'
