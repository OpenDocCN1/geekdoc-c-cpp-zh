  md: '# C++ Programming for the Absolute Beginner, Second Edition


    You now know the basic steps to working with Xcode. You should head to http://developer.apple.com/documentation/DeveloperTools/Xcode-date.html
    to read up on further details.


    # PROGRAMMING ON LINUX


    Linux is an extremely versatile operating system, offering many different choices
    from the windowing environment to the text editor. As such, there are many different
    ways to program Linux, but in this section we will only touch on the most universal.
    You may want to check out some of the Integrated Development Environments (IDEs)
    for Linux, such as KDev or Code Crusader, the installation and usage of these
    software packages is beyond the scope of this book.


    The first thing you''ll want to do is start a terminal, from which we can issue
    commands. You''ll want to search your window managers list of programs for a terminal
    emulator. Often it is located in the Utilities menu and something like color-xterm,
    regular-xterm, gnome-terminal, konsole, or terminal. Once you have started a terminal
    window, follow these steps to create, compile, and run a new C++ project.


    +   1. Create a new directory called HelloWorld by typing mkdir HelloWorld and
    pressing-enter. Change into this directory by typing cd HelloWorld and pressing
    Enter. See Figure C.8.


    ![](img/62e929c461e30706acae7c69369a00d9_366_0.png)


    ```

    ## mkdir HelloWorld

    # cd HelloWorld

    ```


    +   2. Open an editor to start writing the code for your project. There are many
    editors to choose from such as vim, pico, nano, edit, emacs, edit, and kate. Feel
    free to use your favorite if you are already accustomed to one. We use emacs.
    You can start emacs by typing emacs HelloWorld.cpp. See Figure C.9.


    ![](img/62e929c461e30706acae7c69369a00d9_366_1.png)


    ```

    HelloWorld# emacs HelloWorld.cpp

    ```'
