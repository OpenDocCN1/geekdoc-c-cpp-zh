- img_proc: true
  md: '# CONVERTING TO DECIMAL


    Don''t be intimidated by number systems other than the decimal system. All your
    old, familiar numbers are still there; other systems just represent them differently.
    So, exactly do you convert a number in other systems to a number in a decimal
    system? It''s easy. Take the first digit (the one on the far right) and multiply
    it by n (the base system) raised to digit number -1. That is, the value of the
    first digit is multiplied by n^0, the second by n^1, the third by n^2, and so
    on. Then you add all the numbers.


    As an example, convert the hexadecimal number 0x3E1. Remember that the 0x is just
    telling you the numeric representation is in hexadecimal and does not actually
    contribute to the number. Also, remember that E is the same thing as 14 in the
    hexadecimal system.


    +   1 x 16^0 = 1

    E x 16^1 = 224

    +3 x 16^2 = 768


    Then you add them all together to get the resulting decimal number, 993.


    # CONVERTING FROM DECIMAL


    The process for converting from the decimal system to a base-n system is slightly
    harder. First, take a number and divide it by the base raised to the digit number.
    That, the first column is 1, and the second is 2, and so on. Subtract the remainder
    from the original number. To find the value of the digit in the column, divide
    the remainder by the base raised to the power of 1 less than the digit number.
    Although this concept might seem confusing, it is not too difficult. For example,
    convert 993 back to hexadecimal:


    Column number 1:


    ```

    993 / 16^1 = 62 Remainder: 1

    Hexadecimal digit = 1 / 16^0 = 1

    Hexadecimal number so far: 1

    993 - 1 = 992

    ```


    Column number 2:


    ```

    992 / 16^2 = 3 Remainder: 224

    Hexadecimal digit = 2 / 16^1 = 14 (E)

    Hexadecimal number so far: E1

    992 - 224 = 768

    ```'
  merge: -1
