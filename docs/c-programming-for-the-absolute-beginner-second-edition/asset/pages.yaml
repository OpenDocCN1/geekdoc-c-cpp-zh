  md: '# Starting the JOURNEY


    he idea of programming might sound like a daunting task, but don''t worry. We
    designed this chapter so that you can get your feet wet without having to delve
    into the deeper complexities of programming. The chapter begins with a discussion
    on computers. We''ll show you how they really work. The chapter continues with
    the basics on creating a program. Next you''ll learn how to use Visual Studio,
    a C++ compiler. Then you get to play with some text and numbers. With our help
    and your ingenuity, you will soon be creating your own simple programs. Later,
    we''re sure that your programs will become increasingly complex, but everyone
    must start the journey somewhere. Here and now, your adventure begins!


    The outset of your adventure includes the following:


    +   * How computers work

    * How to write code

    * How to write your first program

    * How to use Visual Studio

    * How the programming development cycle works

    * How to use text

    * How to use numbers'
  merge: -1
