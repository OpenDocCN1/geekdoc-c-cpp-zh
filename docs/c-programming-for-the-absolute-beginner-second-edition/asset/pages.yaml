    # REVEALING THE MAIN FUNCTION


    You''ve probably noticed that we keep calling main a function. There is a reason
    for this: main is a function. "But, it can''t be" you say, "I just learned about
    functions, and I''ve been using main since Chapter 1, "Starting the Journey!"
    Fear not, young adventurer. This is a simpler concept than you might think.


    You can broadly define a function as a section of code that breaks a program into
    smaller, more manageable tasks. Think about your computer''s operating system.
    If it is multitasking, it will have many programs running at once. Each of these
    programs has a main function. Generally, every program begins when the main function
    begins and ends when the main function ends.


    Now, think of your operating system as a program. From it, all the other main
    functions are called (as illustrated in Figure 4.2).


    Are you beginning to see a parallel between your operating system and a program
    that you create? There are also parallels between the main function and the functions
    that you create. This is why main is a function.


    In our experience, most programmers become confused at this point about exactly
    how a program runs. How does the computer decide where to start? We anticipated
    some confusion, so we now take you through the process, step by step.'
