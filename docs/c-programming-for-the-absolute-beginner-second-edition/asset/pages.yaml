    \ the book notes, “and the weapon will become completely versatile, to handle\
    \ any kind of ammo.” You're saved! You will be able to finish the bow by tomorrow.\n\
    \nIn C++, templates enable you to generalize a class or function so that it doesn't\
    \ use a particular data type, and just as you might use the magic \"Template\"\
    \ in our (newly coined) fable to create a bow that will handle all kinds of arrows,\
    \ you can use templates in C++ to create a function or class that can handle all\
    \ kinds of data types.\n\nFor example, each version of the add function we discussed\
    \ in Chapter 4, “Writing Functions,” is specific to a certain kind of data (two\
    \ integers, two floating-points, and so on). However, you can create a single\
    \ version that covers every C++ data type (and user-defined data types, such as\
    \ classes). Sound perfectly?\n\nThe theory is that when you use templates, you\
    \ are performing essentially the same operation on the data no matter what data\
    \ type you are working with. As result, there's no particular reason why you can't\
    \ program this operation only once. In this way, templates enable you to generalize\
    \ an operation to avoid redundant programming.\n\nNow, let us share with the basics\
    \ of programming with templates.\n\n# Creating Class Templates\n\nA class template\
    \ is a class that utilizes a template in order to make the class more general.\
