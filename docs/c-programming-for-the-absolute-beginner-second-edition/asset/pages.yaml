    Likewise, it is often not important to know exactly how a class works, as long
    as it does what it is designed to do. This is the principle of data abstraction
    (also known as data hiding). Data abstraction is the process of hiding the data
    members and implementation of a class behind an interface so that the user of
    the class doesn''t corrupt the data. The idea is that data is hidden inside the
    implementation for a class. You access data members through the implementation
    by accessing the data members through the member function interface. That is,
    data is not manipulated directly, but through public functions.


    The general rule is to use the smallest scope for all variables and members. Also,
    use as few global variables as possible. In doing so, only the code should have
    access to data change that. If other code needs to use or change data a private
    object, object''s member functions can supply the routines that allow this kind
    of access. It is up to you, as a designer of a class, to decide how much access
    to the data of your class needs.


    # Understanding Encapsulation


    Picture the manufacturing process of the nineteenth century. Individuals did everything
    needed to create their products. No division of labor existed. For example, a
    sweater maker had to do everything, from creating the wool (well... the sheep
    did that part, but you know we mean) to marketing the finished product, which
    meant, of course, that everything took a long time to make. With the advent of
    specialization, people became proficient at one thing and other people worked
    about the rest.


    This is similar to encapsulation. Each class that you create represent one specific
    thing or concept. Multiple classes then come to represent combinations of things
    or concepts. Remember when you created the archery contest? The contest used multiple
    bows from the Bow class and a class to represent the contest itself.


    Here''s another example of encapsulation. Say that you want to build a car. You
    must build the smaller subassemblies before you can build the finished product.
    Each small assembly does one small thing, but they all combine to produce a car.
    Figure 5.4 shows the different parts of a car. Each part serves a unique purpose.'
