  md: '# Class Tactics 101


    This section provides some guidelines to make OOP programming a bit easier. You
    can use these tactics to make your code easy to debug and understand.


    +   - Start every class name with an uppercase letter. This convention is used
    not only in C++, but also in almost every other object-oriented programming language.

    - Add a comment to the beginning of each method and class telling the user what
    following member or class does.

    - Make sure that each method does only one thing. The general rule is that if
    a method is more than 20 lines, you are trying to do too much in that method.

    - Have each class model only one concept. For example, keep the Weapon class separate
    from the Soldier class.

    - Test each class to be sure that it works before adding it to the project. Once
    you know that a class works, debugging a project is simply a matter of making
    sure the interaction between the classes work correctly. You will not have to
    worry about whether the classes themselves work, because you''ve already ensured
    they do.


    Follow these rules, and you will be more productive—and you will save yourself
    time when debugging.


    # Using Objects


    After all the preceding discussion on how to create classes, you must be eager
    to learn about classes. Soon you will be creating your own objects from your own
    classes, but for now, you learn just how to create objects. In this section, you
    will learn about object variables, default constructors, how to access members
    of a class, how to create a test class for your classes, and how to use static
    methods.


    # Using Object Variables


    Earlier, we wrote that creating a class is like creating a data type. This relationship
    becomes evident when you start learning about objects. You can use the name of
    a class exactly like the name of a primitive data type (the data types that are
    built into C++). An object variable is a variable that stores the object of a
    certain class.


    Follow these three steps to create objects:


    +   - Program the class that will become the template for the object. You completed
    this step when you created the bow class.'
