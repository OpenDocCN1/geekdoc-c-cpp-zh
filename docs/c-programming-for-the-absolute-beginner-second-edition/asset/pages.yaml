  md: '# THE GET AND PUT STREAM POINTERS


    Memory is indexed for our enjoyment, but more importantly, it is indexed to ensure
    random access. Random access enables you to access portions of files in any order.
    For example, you can read a file backward almost as easily as you can read it
    forward. Two pointers, generally referred to as stream pointers, indicate the
    location where you are reading or writing. These stream pointers are the get pointer
    and the put pointer. The get pointer indicates where you are reading, and the
    put pointer indicates where you are writing.


    All I/O streams have at least one stream pointer, depending on the stream''s method.
    Here are the ones for the following classes:


    +   - istream. Like istream, this class has the get pointer.

    - ostream. Like ostream, this class has the put pointer.

    - fstream. Because it is derived from istream and ostream, this class has both
    pointers.


    # INTERFACING WITH THE STREAM POINTER


    The two streams gain their functionality when an interface is created to adjust
    them. The interface consists of the following methods:


    +   - istream::tell(). Returns the number of bytes the get pointer is from the
    beginning of the file (not the address to which the get pointer is pointing).
    The streampos data type is effectively type alias for an integer. The prototype
    for this method is streampos tellg().

    - ostream::tellp(). Returns the number of bytes the put pointer is from the beginning
    of the file. The prototype for this method is streampos tellp().

    - istream::seekg(). Sets the position of the get pointer in the stream. The prototype
    for this method is seekg (pos_type position);

    - ostream::seekp(). Sets the position of the put pointer in the stream. The prototype
    for this method is seekp (pos_type position).

    - seekg() and seekp(). Sets the direction of the offset of the pointer and the
    amount of offset. The prototypes for these methods are:


