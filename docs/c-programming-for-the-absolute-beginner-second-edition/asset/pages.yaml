    properties of an object are, whereas the object stores specific values for each
    of these properties. For example, a Bow class describes what a bow has a certain
    color, but it doesn''t identify the color. That way, each Bow object can have
    a different color. Figure 5.2 shows two Bow objects. Each is declared using the
    Bow class, whereas the Bow class describes the properties of a bow, each of the
