    \n# ### Specifying with the Scope Resolution Operator\n\nSometimes you might come\
    \ across situations where a global variable and a local variable have the same\
    \ name. This is legal in C++, but it can cause some confusion. Here is an example:\n\
    \n```\nint intVar;\nint main(void)\n{\n  int intVar; // Different from the global\
