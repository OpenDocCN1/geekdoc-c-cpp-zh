    \ class is a good, albeit simple, example of such a function. No matter what type\
    \ of weapon it is, the cost is still calculated the same way.\n\nHere is how you\
    \ inherit both the interface and implementation:\n\n```\nclass Weapon\n(\n   \
    \ int cost;\n    int damage;\npublic:\n    Weapon(int theCost, int theDamage);\n\
    \    int getCost() ( return cost; )\n);\n```\n\n```\nWeapon::Weapon(int theCost,\
    \ int theDamage)\n    : cost(theCost), damage(theDamage)\n```\n\n```\nclass ProjectileWeapon\n\
    (\n    int range;\npublic:\n    ProjectileWeapon(int theCost, int theDamage, int\
    \ theRange);\n);\n```\n\n“But wait,” you say with confusion, “there is nothing\
    \ special here!” And indeed, my observant reader, would be correct. Inheriting\
    \ both the interface and implementation happens by default. This makes it the\
    \ least complicated type of method inheritance.\n\nThe ProjectileWeapon class\
