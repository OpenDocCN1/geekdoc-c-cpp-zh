    \ is clunky but. If the player is only allowed to carry a single weapon at a time,\
    \ this gets rather complicated to enforce. Especially as more weapon types are\
    \ added.\n\nFortunately, C++ offers a way to get the best of both worlds. We can\
    \ have a separate class for every weapon type while maintaining a single weapon\
    \ class to represent the general concept of a weapon and to keep of all the common\
    \ code. The solution is inheritance.\n\nInheritance is used to represent a “kind-of”\
    \ relationship. Projectile weapons are a kind of Weapon. When we implement inheritance,\
    \ there will be a general class and the ProjectileWeapon class will inherit from\
    \ it. The Weapon class is said to be the parent, base, or super class, and the\
    \ ProjectileWeapon class is said to be the child, derived, or sub class.\n\n#\
    \ Writing Code for Inheritance\n\nOkay, so we have three types of weapons and\
    \ we need a way to represent them succinctly. We know the proper solution is inheritance,\
    \ but how do we do it? Let’s start with the parent class, Weapon:\n\n```\nclass\
    \ Weapon\n{\n    int damage;\n    int cost;\npublic:\n    Weapon(int intDamage,\
    \ int theCost);\n    // ... more methods\n}\n\nWeapon::Weapon(int intDamage, int\
