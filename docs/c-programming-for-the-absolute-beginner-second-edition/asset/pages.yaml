    are charming, and find magical items. Describing the attributes in this manner
    is very similar to designing a class. If you create a specific knight, for example,
    Sir Lancelot, you have created an object. Sure, Sir Lancelot can save princesses,
    dragons, and find magical items with King Arthur at his side just as his class
    slays; however, his actual attributes, such as the name of his sword, how many
    princesses he saved, and exactly how charming he is, are stored by the SirLancelot
    object.


    Methods (also known as member functions or object methods) are functions contained
    within a class that define how to use objects of the class. In the example Bow
    class, you might want to have methods as draw() and fire(). Methods are like the
    functions we previously used, except that methods are part of the object. The
    methods enable you to know what the object is capable of, and they are focused
    primarily on manipulating the object''s data (data members).'
