    # TAKING ACTION WITH OPERATORS


    In a general sense, an operator is any symbol or double symbol such as <, and
    in some cases even terms as sizeof(), that causes the compiler to take an action.
    The actions of adding, subtracting, multiplying, and dividing operators. For example,
    when you ask a computer to add two numbers, you use the addition operator (+),
    which makes perfect sense, doesn''t it? We know that 2 + 2 = 4. Here''s how you
    do the same thing in code with C++:


    ```

    cout << 2 + 2;

    ```


    This line displays 4 onscreen.


    These four basic operators are self-explanatory; they exactly do what you probably
    think they do, but take a moment to review the symbol for each one:


    Addition +


    Subtraction -


    Multiplication *


    Division /


    As in math, these operators do not execute from left to right. The multiplication
    and division operators execute before the addition and subtraction operators,
    for example:


    ```

    1 + 3 * 2

    ```


    3 * 2 is executed first, and then 1 is added, resulting in the number 7.'
