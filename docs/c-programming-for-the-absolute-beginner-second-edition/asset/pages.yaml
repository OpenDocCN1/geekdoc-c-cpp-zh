    # WORKING WITH BINARY STREAMS


    Although working with text is convenient, it is inefficient in many cases. When
    using a 28.8 modem, you often send as little data as possible. In a game such
    as StarCraft, by Blizzard, you can specify ahead of time what types will be sent.
    This enables you to use more than one data type (such as characters).


    The solution is binary streams, which can send multiple data types. The program
    must know the order and kind of data types being sent in order to read the data.
    Figure 9.2 shows a text stream and a binary stream.


    In order to make correct interpretations, the program must know which structure
    the bytes in a binary stream are related. This means that the binary stream must
    apply a programmed algorithm (such as int, char, or long) to decipher the data,
    but a text stream can assume that every byte is a character. In Figure 9.2, note
    that the top data stream is a text file, and each byte means the same thing—one
    character. The bottom stream is a data stream in which bytes are part of larger
    structures; your program must know what structure is to use the byte properly.


