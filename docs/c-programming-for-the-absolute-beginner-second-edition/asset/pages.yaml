  md: '# C++ Programming for the Absolute Beginner, Second Edition


    Now, let''s begin taking this code apart to figure it out. The first thing you''ll
    notice is the complete lack of a main() function. When using Dark GDK instead
    of main(), you must create a DarkGDK() function. This function has no arguments
    and a void return value. All the code in this program is contained within this
    one function, and that code can be split into three parts: initialization, the
    main loop, and cleanup.


    The initialization is the longest of the three sections. It includes everything
    from the beginning of the DarkGDK() function up to these lines:


    ```

    // now we come to our main loop, we call LoopGDK so some internal

    // work can be carried out by the GDK

    while ( LoopGDK ( )

    ```


    The first step in the initialization section is the following two lines:


    ```

    dbSyncOn ( );

    dbSyncRate ( 60 );

    ```


    Every function provided by Dark GDK starts with the prefix "db". This is to make
    sure that the function names do not conflict with any of yours; similar to how
    the C++ Standard Library uses std namespace.


    These two lines of code set the maximum frame rate. With a graphical computer
    game, it is important to control the rate at which things happen, because on modern
    computers things can become too fast if they simply run as fast as possible. The
    frame rate here is set to 60. This means that the image on the screen will be
    updated 60 times every second (at most).


    By default, a Dark GDK program will respond to the escape key by immediately quitting.
    Often you would like to be perform some actions before quitting, or you''d like
    to use the escape key for something else. Call dbDisableEscapeKey() disables Dark
    GDK''s default action.


    The C++ Standard Library provides functionality to generate random numbers, but
    Dark GDK provides its own. Just like you use rand() to seed the standard library
    random generator, you used dbRandomize to seed the Dark GDK random number generator.
    Using dbTimer() as a seed is just like using time().


    Now we get to the exciting part! The call to dbLoadImage() reads the background
    from an image file to get it ready to be displayed. This function takes two arguments:
    the filename of the image, and an id number that you assign. You must remember
    this number so that you can refer to the loaded image in seed code.'
