  md: "# Chapter 8 · Using Templates\n\n```\ntemplate<class TypeName> return Class<TypeName>::methodName(args)\n\
    {\n    methodImplementation\n}\n```\n\nTypeName is the name of the parameter (such\
    \ as T), and methodImplementation is the implementation of the method.\n\nBecause\
    \ the constructor implementation uses the name of the class twice (once for the\
    \ class name and once for the method name), you would normally have to put <TypeName>\
    \ after each use of the class name. However, this is a bit redundant, so for the\
    \ name of the method, you don't have to (but you can if you like). Here is the\
    \ syntax for a constructor implemented outside of a class template:\n\n```\ntemplate<TypeName>\
    \ ClassName<TypeName>(args)\n{\n    constructorImplementation\n}\n```\n\nOr you\
    \ could use this, more common, syntax:\n\n```\ntemplate<TypeName> ClassName<TypeName>::ClassName(args)\n\
    {\n    constructorImplementation\n}\n```\n\nBoth ways are exactly the same. It\
    \ is a matter of personal preference. The first way is formal, but the second\
    \ way is more common.\n\n> NOTE If you are making a class template, we suggest\
    \ first designing the class for a specific data type. Then you can work out all\
    \ the bugs and design flaws before you generalize with a template. This approach\
    \ makes programming much easier.\n\n# USING Template PARAMETERS\n\nThe declaration\
    \ inside the angle brackets (for example <class T>) is a template parameter. As\
    \ you have seen, the template parameter behaves almost the same way that function\
    \ argument does. As function arguments, you can have more than one template parameter.\
    \ In fact, you can have as many as you want.\n\nOne example of where multiple\
    \ template parameters are useful is you are creating an associative array. An\
    \ associative array is like a normal array, except that two different objects\
    \ are at each element. One of the two might be a string, and the other might be\
    \ an integer"
