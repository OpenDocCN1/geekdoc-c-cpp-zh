  md: "However, the compiler can check only syntax errors when a template is compiled.\
    \ That is, the compiler can check whether a particular type works in the template\
    \ code only when you use that template with a particular data type. The point\
    \ in time which you use a template with a specific type is called the point of\
    \ instantiation.\n\nSay that you design a class template, accidentally assuming\
    \ that the type will always be a string, you use the function c_str(). In doing\
    \ so, you might wind up with a problem. If an object is created with string as\
    \ the type, no errors will occur. However, if the data type is not a string, problems\
    \ will occur. Though assumptions of this nature do not always present a problem,\
    \ they often do, so be on the lookout for them. If you design a class template\
    \ that works for only certain types, this makes condition very clear to the user.\n\
    \n# CREATING FUNCTION TEMPLATES\n\nFunctions can also use templates similarly\
    \ to the way classes use them. A good example is a function such as the add function\
    \ in Chapter 4. Admittedly, add is a trivial function (because it adds only two\
    \ numbers), but we can easily expand the concept of functions like this to something\
    \ more.\n\nAs you do with templates, you create a function template by putting\
    \ the keyword template and the parameter list at the beginning of the function.\
    \ Function templates are similar to overloaded functions, except that you can\
    \ create one function template to handle every case rather than a different function\
    \ for each case. Here is how the add function might work with a template:\n\n\
    ```\ntemplate<class T> T add (T a, T b)\n{\n  return a + b;\n}\n```\n\nUnfortunately,\
    \ this add function is not universal. You cannot provide arguments of different\
    \ types. In the section \"Overloading Function Templates,\" later in this chapter,\
    \ you learn ways to provide almost any argument and get the desired results.\n\
    \nYou can use the template parameters for any data types within the function.\
    \ Here is an example:\n\n```\ntemplate<class T> void swap(T* a, T* b)\n{\n  T\
    \ temp = *a;\n  *a = *b;\n  *b = temp;\n}\n```"
