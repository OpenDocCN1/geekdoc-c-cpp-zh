    # USING CONSTANTS


    Sometimes, when you create a variable, you want to ensure that its value cannot
    change. Maybe you have a variable that represents the number of cards in a player''s
    hand, or the number of points to win the game. These are examples of things you
    want to define once and never change again. You have entered the world of constants!


    You define a constant using the const keyword. The syntax is exactly the same
    as the syntax for declaring a regular variable, except with the const keyword
    in front:


    ```

    const constType CONSTNAME = value;

    ```


    > You must always give your constant value on the same line that you declare,
    after this line value cannot change. Any attempt to do so will result in a compile
    error. This makes it easy for you to ensure that this variable stays exactly what
    you meant it to and is not changed by accident.


    Using constants offers numerous advantages. Suppose that you need a number, such
    as 3.14, throughout the program every time you need to use the value of Pi. Then
    you realize that your application requires a higher precision; you have change
    every occurrence of 0.14 to the higher precision value as 0.14159. If, instead,
    you use a constant to define Pi by 3.14 and later to increase the precision, you
    will only need to change the const in one place and recompile the program.


    If you have a really long number (such as Pi to 22 decimal places), typing every
    time you use it will be annoying and if you are like us, you might easily make
    a mistake. Using a constant simplifies this situation considerably.


    Finally, it is good practice to use const whenever you can. This helps make your
    intentions clear. And it also helps the compiler to help you catch errors in your
    code.'
