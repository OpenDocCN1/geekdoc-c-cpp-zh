    | True | False | False |

    | False | True | False |

    | False | False | False |


    # The not Operator


    The not operator (!) changes a Boolean value to its reverse Boolean value—example,
    true to false and false to true. It is a unary operator, which means that it takes
    only one operand. Table 3.3 shows the truth table for the not operator.


    Here are some examples of the not operator:


    ```

    if (!true) // false

    if (!(2<3)) //true

    if (!( (2>3) || (3>2) ) //false

    ```


    | Table 3.3 TRUTH TABLE FOR THE NOT OPERATOR |

