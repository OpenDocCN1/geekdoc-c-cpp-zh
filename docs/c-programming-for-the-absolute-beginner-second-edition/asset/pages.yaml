  md: '# C++ Programming for the Absolute Beginner, Second Edition


    Don''t use keywords as variable names accidentally. Using keywords in this way
    can cause unpredictable results and lead to many headaches. For example, int is
    already reserved to represent an integer, if you try to use int as a variable
