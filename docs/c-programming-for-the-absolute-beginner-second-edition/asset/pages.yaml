  md: "# C++ Programming for the Absolute Beginner, Second Edition\n\nyour program\
    \ execute successfully, it is a good idea to test to be sure that conditions are\
    \ true before performing a major operation (or a potentially risky one). If a\
    \ condition fails while you are testing your program, you might simply exit the\
    \ program and have the program display a message saying what happened and on which\
    \ line.\n\nC++ provides a special macro, called an assertion, for exiting the\
    \ program and displaying a specified message for a specified condition. Assertions\
    \ are macros that test a condition and exit the program if the condition fails.\
    \ A standard version of this macro is defined in <cassert>.\n\n```\nvoid assert(int\
    \ expression);\n```\n\nEven though expression is an integer, it is treated as\
    \ a boolean expression (for example, 5 <3). Thus, testing a condition might look\
    \ like this:\n\n```\nassert (y > 0);\n```\n\nThis assertion does nothing if y\
    \ is greater than 0, but if y is not greater, the program stops, and an error\
    \ message is displayed. To see this error message for yourself, try compiling\
    \ the program:\n\n```\n//10.1 - An Assertion Failure - Mark Lee\n#include <cassert>\n\
    ```\n\n```\nint main(void)\n{\n    assert(5>6); //always fails\n    return 0;\n\
    }\n```\n\nThis assertion will always fail, no matter what, because 5 is never\
    \ greater than 6. So, what happens when this assertion fails? First, this message\
    \ is displayed:\n\nAssertion failed: 5>6, file C:\\Projects\\Temp\\Test13\\Test13.cpp,\
    \ line 5\n\nOn your computer (I'm using Windows Vista Professional and Visual\
    \ Studio 2008 Edition) a window pops up displaying a message saying that the program\
    \ terminated abnormally, as shown in Figure 10.1.\n\nThe assert macro ends the\
    \ program when it fails by calling a function called abort().). The abort() function\
    \ takes no arguments and returns no value. It simply ends the program. This is\
    \ the function that caused the message box in Figure 10.1 to appear. This function\
    \ also outputs the message, abnormal program termination."
