    a random non-land position on the first map screen, and reads all of the cities
    from the cities file.


    The game state can be one of three values: 1 for the introduction screen, 2 for
    the main game play, and 3 for the city screen. The update() member function checks
    the current state and all the corresponding member function to handle.


    The doIntroScreen() member function simply hides the ship, shows the introduction
    screen, and waits for the return key to be pressed. Once it has been pressed,
    the introduction screen is hidden and the game state is set to 2.


    The doMapScreen() member function handles most of the work of the game engine.
    First, the current screen is hidden and each of the four arrow keys is checked
    to see which way the ship should move. The ship is pointed in the appropriate
    direction with a call to the moveLeft(), moveRight(), moveUp(), or moveDown()
    member function, and the movement direction is stored. The ship''s new position
    is calculated and checked to see if it is a city or land. If the new location
    is inside a city, the game state is changed to 3. If on land, the ship does not
    move. Finally, the ship''s location is updated and drawn at its new position.


    The doCityScreen() member function is almost exactly the same as the doIntroScreen()
    member function, except that when the return key is pressed the ship''s location
    is set to the value read from the cities file. This value needs to be converted
    back to global coordinates before it can be used.


