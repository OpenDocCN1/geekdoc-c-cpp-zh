    # SIMPLIFY TEMPLATE USE


    Templates can become annoying to users of your classes and functions. Fortunately,
    you can hide the fact that templates are used.


    The first and easiest way is to use *typedef*. Because *ClassName <parameters>*
    just as you use the name of a normal class, you can *typedef* the name of a class
    template to something shorter. For example, rather than *Vector<int>*, *IntVec*.
    Then, when users want a vector of integers, they can use *IntVec*. Users do not
