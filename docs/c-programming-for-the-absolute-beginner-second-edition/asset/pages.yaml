    # DESCRIBING VARIABLE IDENTIFIERS


    Identifiers are the names you give to your variables in order to refer to them.
    For example, a variable that stores input might be called input. The rules for
    naming variables are as follows:


    +   - The name must start with a letter or underscore (_).

    - Every other character can be a letter, underscore, or number.

    - Identifiers can be long (more than 200 characters).

    - You cannot use keywords as variable names.

    - C++ is case-sensitive (variable is different from VARIABLE).


    Some examples of valid identifiers are _file5G, StringF4, input, __my_variable,
    and so on. Some examples of invalid identifiers are 9variable and &variable. It
    is not a good idea to use identifiers beginning with two underscores because they
    are often reserved for special system variables. Also, keep in mind that even
    though an identifier is valid, it might not be useful. An identifier should be
    descriptive so that when you read your code three weeks later, you will fully
    understand your intentions.'
