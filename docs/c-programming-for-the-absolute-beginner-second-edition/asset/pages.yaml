  md: "# CONSTRUCTING A STRING\n\nThe standard library provides many ways to construct\
    \ a string object. You can use another string object, a character array, a string\
    \ literal, an empty constructor, and more. We cover these constructors one by\
    \ one. The first is when you want to construct one string from another:\n\n```\n\
    //construct a string from another whole or partial string\nbasic_string(const\
    \ basic_string& s, size_type pos = 0,\n    size_type n = npos, const A& a = A());\n\
    ```\n\nThe first argument is simply another string. You can use any kind of basic_string\
    \ here. The second argument is the position (treating the string as a character\
    \ array) from which to start taking values. The third argument is the number of\
    \ characters to take. This argument defaults to npos, which loosely correlates\
    \ to the largest possible value of a string. This means \"go to the end of s\"\
    . pos = 0 means \"start at the beginning\" and n = npos means \"take every character\"\
    . The fourth argument relates to the way memory is allocated for this string.\
    \ Although we don't cover the argument here it is too complicated for a beginner,\
    \ here are some examples of how you might use this constructor:\n\n```\nstring\
    \ s = \"Hello World\"; //declare a string to work with\nstring s1(s); //s1 and\
    \ s both contain the value \"Hello World\"\n```\n\n```\n//start at position 6,\
    \ take two chars - s2 contains \"Wo\"\nstring s2(s, 6);\nstring s3(s, 6, 2); //error\
    \ need third argument too\n```\n\nThe last call to the constructor fails because\
    \ the computer mixes it up with the second constructor (explained next). The second\
    \ and third constructors create a string from a character array, as shown:\n\n\
    ```\nbasic_string(const char* p, size_type n, const A& a = A());\nbasic_string(const\
    \ char* p, const A& a = A());\n```\n\nThe first argument, p, is the character\
    \ array. n is the number of characters to use, and a has to do with the way the\
    \ string is allocated (just let it have its default value, unless you feel like\
    \ learning about allocators). If you don't supply n, the whole C-style string\
    \ is used to construct the string. Here are some examples of how you might use\
    \ these constructors:\n\n```\nchar* p = \"Hello World\";\nstring s1(p); //s1 contains\
    \ \"Hello World\"\nstring s2(p, 5); //s2 contains \"Hello\"\nstring s3(p+6, 5);\
    \ //s3 contains \"World\"\n```"
