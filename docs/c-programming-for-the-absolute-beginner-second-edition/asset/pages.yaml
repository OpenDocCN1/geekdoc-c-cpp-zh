  md: '# Chapter 10 • Errors and Exception Handling


    If this assertion does not meet your needs or if you want your program to keep
    running after a failed assert, you need to define your own assertion. However,
    if you are using the assert macro to debug your programs, you should be fine.


    You can use assertions to ensure that you don''t walk off the end of an array.
    You also use them at the beginning of functions to ensure that the user applied
    the function correctly, and you use them to validate the result of code that you
    are not sure is correct.


    ![](img/62e929c461e30706acae7c69369a00d9_283_0.png)


    Keep in mind that you use assertions to debug code, before you release something
    or give it to other people to use, be sure to remove all the assertions. (The
    users of your program do not need to know that an assertion failed on line 675
    of a code file.) If you want to handle unexpected errors happening in your program
    when you release it, use exception handling.


    # HANDLING EXCEPTIONS


    When you write code that is not a complete program (such as a class or a set of
    functions), unexpected errors can happen in your code. You can''t always count
    on the values that you expect, and you can''t assume that users of your code will
    know what they are doing. A graceful piece of code will prevent a program from
    crashing when these kinds of things happen. One way to make your code “graceful”
    is by using exception handling, which enables you to manage non-routine circumstances
    in a program.


    With exception handling, you can actually prevent unpredictable occurrences and
    exceptional events. Exceptions mean that a part of your code cannot perform a
    task that it was asked to. Exception handling enables you to try another method
    of completing the task or to attempt to fix the problem.'
