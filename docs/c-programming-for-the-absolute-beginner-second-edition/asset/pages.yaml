  md: "# Chapter 3 • Making Choices with Control Statements\n\nHere is an example:\n\
    \n```\nint swords = 9;\nif(swords < 8) //the condition\n{\n    cout << \"The number\
    \ or sword is less than 8\";\n}\n```\n\nThe cout statement will not be executed\
    \ because the condition (the controlling condition), swords < 8 (is the value\
    \ of the integer variable swords less than 8?), evaluated to false. Nine is not\
    \ less than eight. Because you want to execute only one line of code, you can\
    \ display this example in the alternate way—without the braces, as shown here:\n\
    \n```\nint swords = 9;\nif(swords < 8) //the condition\n    cout << \"The number\
    \ of swords is less than 8\";\n```\n\nIn this example, because the braces are\
    \ not used, the if statement consists of everything up to (and including) the\
    \ semicolon.\n\nAs we said earlier, the if statement is the most common control\
    \ statement. When combined with the else statements and else statements discussed\
