  md: '# Chapter 5 • Designing Software: Object-Oriented Programming


    memberList consists of a list of member declarations. These can be data member
    or method declarations. Data member declarations are normal variable declarations.
    For example, int x; is a data member declaration inside a class. However, you
    cannot initialize data members where you declare them. They must be initialized
    either in a method or outside the class. For example, int x = 5; as a data member
    declaration causes an error. The scope of data members is the same as the scope
    of the object created from that class. However, data members can never be accessed
    from outside a class. In the Bow class, these data members could store how many
    arrows are left, the color of the bow, and whether the bow is drawn. The data
    members of a class define and describe the class properties (also called attributes).
    Therefore, each bow''s object is a property of that object.


    Method declarations are just as easy to understand, as data member methods. Method
    declarations are function declarations placed inside a class (recall that a function
    declaration can also include the implementation, or you can implement it separately).
    All methods can be accessed only through an object of the class (with the exception
    of static methods, which we discuss later in the chapter “Using Static Members”).


    Two special kinds of methods, the constructor and the destructor, can be in class.
    Both are optional, but they provide special functionality that other methods cannot
    provide.


    A constructor is executed every time a new instance of the class is created—that
    is, every time you declare a new object. The constructor is normally used to set
    initial values for the data members. For example, in the Bow class, a constructor
    might set the drawn Boolean able to be false and the number of arrows to 20. A
    constructor has the same name as the class and cannot have a return value (not
    even void).


    ![](img/62e929c461e30706acae7c69369a00d9_133_0.png)


    To understand classes and constructors, you might compare the classes you declare
    with the built-in data types that C++ already understands, such as float and int.
    All data have something like constructors, even C++''s built-in data types. For
    example, when you define an integer variable, you use the int keyword. C++ knows
    the properties of an integer. Therefore, C++ sets up a variable that can hold
    integer values. C++ does not, however, know what a object is supposed to look
    like when you first define one. So your Bow class tells C++ what properties a
    Bow object will take, and the constructor creates an initial Bow object with initial
    values.


    A destructor is the opposite of a constructor and is executed when the object
    is destroyed. The destructor is always the same name as the class, but with a
    tilde (~) at the beginning (~ClassName()). The destructor cannot have arguments
    or a return value. In the example Bow class, the destructor would be ~Bow(). A
    destructor is often used to perform any necessary cleanup tasks.'
