    Now that you have seeded the generator, you are ready to use it. To generate a
    random number, you use the rand() function. This function gives a large random
    number, such as 2453. Here''s what the rand() function looks like code:


    ```

    cout << rand();

    ```


    In order to generate a random number between two other numbers (for example, a
    random number between 1 and 10), you use this formula:


    ```

    rand() % (max - min + 1) + min;

    where max is the higher value and min is the lower value. For example, to generate
    a random number between 10 and 20,

    int num = rand() % 11 + 10; // (20 - 10 + 1) = 11

    ```


    This formula works because rand % 11 evaluates to a number from 0 to 10. Adding
    10 gives a number somewhere between 10 and 20.


