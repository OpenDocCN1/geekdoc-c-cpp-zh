  md: '# C++ Programming for the Absolute Beginner, Second Edition


    int my_Function(int a, int b, int c = 0);


    you can call this function two ways:


    ```

    cout << my_Function(5, 3, 6);

    cout << my_Function(5, 3, 3);

    ```


    In the first line, the value of c is 6, but in the second line, the value of c
    is 0.


    Defaulting arguments provides a way for you to write functions that are highly
    customizable, while still very simple to call in the common case. You can get
    the best of both worlds. However, you should use them prudently and only when
    they give a real advantage and increase in clarity.


    # SEEING FURTHER WITH VARIABLE SCOPE


    All that you have learned to so far can fit one of four categories, each with
    its own rules about which variables can access it:


    +   - Code inside the main function

    - Code in another function

    - Code in a block of code, such as an if statement or a namespace

    - Code outside functions


    Within each of these categories are rules for how long a variable lasts (variable
    lifetime) and where it can be accessed (variable scope).


    The general rules for variable scope and lifetime are as follows:


    +   - If the variable is declared outside a block of code, it is called global,
    and its scope and lifetime are from the point of declaration until the end of
    the source file. We mentioned earlier in this chapter, a block of code is any
    code within curly braces. This includes functions.

    - If the variable is declared within a block of code, it is called local, and
    its scope and lifetime are until the end of the block.

    - If the variable is declared within an argument list of a function, it is called
    a parameter, and its scope and lifetime are until the end of the function.


    One implication of these rules is that functions cannot access the variables declared
    in main unless they are passed as arguments to the function.


    If a variable is declared within a block that is within another block, the scope
    of the variable is restricted to the inner block.'
