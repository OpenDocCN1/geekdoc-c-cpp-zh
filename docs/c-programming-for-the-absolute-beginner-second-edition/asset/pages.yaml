    # ## EXPLAINING MEMORY


    You may be curious to know how variables get stored in memory. You know of global
    and local variables, but how do they get allocated in memory? To allocate is to
    acquire memory for. All the variables you have used were allocated at some point
    before they could be used. In this section, we will explain more about this strange
    concept.'
