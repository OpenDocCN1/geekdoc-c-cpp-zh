- img_proc: true
  md: '# C++ Programming for the Absolute Beginner, Second Edition


    So, a computer has one chunk of memory where all of this gets stored, right? Well,
    not quite. It turns out there are actually three main sections in memory: static
    memory, the stack and the heap. Where a variable is stored depends heavily on
    how and when it is declared.


    Static memory is where global variables are stored. These are allocated when the
    program starts up, before main starts. They last throughout the entire course
    of the program, being de-allocated only when the program exits, right after main
    ends. So, everything in static memory must be decided upon before the program
    begins. When you declare global variables, you must know exactly which and how
    many you need. There is no way to decide, for instance, whether to have a global
    variable based on a user''s input. By this point, the program is already running,
    so it is too late.


    The stack (also called local or automatic memory) is where all of your local variables
    are allocated. An integer declared within main would go on the stack. When a function
    is called, its parameters would go on the stack. Every variable you''ve learned
    so far isn goes on the stack.


    When a program begins executing, space is allocated on the stack for all of main''s
    local variables (see Figure 6.1(a)). As soon as another function is called, say
    func1, more space is allocated on top for func1''s local variables and parameters
    (see Figure 6.1(b)). When func1 finishes executing and returns, its space on the
    stack is de-allocated (see Figure 6.1(c)). So, the stack grows and shrinks according
    to which functions are being called. This allows for a much flexible treatment
    of memory. You can choose whether to call a function based on user input, and
    this will decide if that memory is allocated. So, your program can adapt to changing
    circumstances.


    ![](img/62e929c461e30706acae7c69369a00d9_162_0.png)


    The stack is not well suited for storing large objects. Variables that consume
    a lot of memory must be allocated and de-allocated every time the function is
    called, making your program slow. It is best to put such large variables on the
    heap.'
  merge: -1
