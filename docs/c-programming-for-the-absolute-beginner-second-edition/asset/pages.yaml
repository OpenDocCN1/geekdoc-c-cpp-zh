    # Displaying Multiple Strings with cout


    You can now use the basics of cout, but there''s much more to learn about cout
    and strings. For example, you can display multiple strings at the same time. Say
    that you want to display two pieces of text, but they are in two different strings.
    According to the preceding techniques, the code will look something like this:


    ```

    cout << "Red"

    out << "Dragon"

    Output:

    Red Dragon

    ```


    However, there is an easier method. You can display as many strings as you want
    side-by-side and separated by <<. You can create the previous code fragment like
    this:


    ```

    cout << "Red" << "Dragon"

    Output:

    Red Dragon

    ```


    The output for both code fragments is identical, yet the second one is a little
    simpler to read. Also, because of the way C++ is written, you can split out code
    over more than one line. For example, the previous examples are also equivalent
    to the following:


    ```

    cout << "Red"

    << "Dragon"

    Output:

    Red Dragon

    ```


    This is actually a trivial example because you can use a single, larger string
    ("Red Dragon\).


    Generally, you structure your code so that it is easy to read. You should place
    a new cout at the beginning of each phrase. For example, to display a sentence
    about dragons and a sentence about elves, everything in the dragon sentence should
    be after one cout, and everything in the eleven sentence should be after a different
    cout. In this way, your code is more organized and easier to read.


