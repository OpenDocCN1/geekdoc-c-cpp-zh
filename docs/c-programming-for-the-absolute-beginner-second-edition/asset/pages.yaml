    # PROGRAMMING THE GAME ENGINE


    Now that you have the graphics all sorted out, it is time to start programming.
    The first thing to do is create a new "Dark GDK – 2D Game" project, called "Pirate
    Adventure". You will need to copy all of the images into the project folder, alongside
    your code.


    Because Dark GDK does not play along well with the C++ Standard Library, there
    is one additional change we must make. Right-click on the project name in the
    Solution Explorer select Properties. See Figure 11.18.'
