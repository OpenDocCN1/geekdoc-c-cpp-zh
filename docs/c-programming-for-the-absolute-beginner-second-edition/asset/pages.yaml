    Because it represents an integer data type (the number of bytes), you can use
    the result of this operator anywhere that you can use an integer.


    You can also use the keyword of the type rather than an identifier, as shown here:


    ```

    cout<< "The size of 2 integers is" << 2 * sizeof(int); // is equal to 8

