  md: "# Catching Every Exception\n\nYou can catch every possible exception in your\
    \ programs, making them virtually crash proof. To do so, you use a form of the\
    \ catch statement that can handle any exception that hasn't already been handled.\
    \ Rather than an exception type as the argument for the catch statement, you use\
    \ an ellipsis (...). When the computer searches the catch statements for one that\
    \ will handle an exception, the computer will use this one as a last resort (if\
    \ you include it). Here is the syntax:\n\n```\ncatch(...) { handleTheException\
    \ }\n```\n\nHere is an example of how you might use the default catch statement:\n\
    \n```\n#include <iostream>\n\nusing namespace std;\n\nint main(void)\n{\n    try\n\
    \    {\n        throw 6;\n    }\n    catch(...)\n    {\n        cerr << \"There\
    \ was an exception, but it was caught!\";\n    }\n    return 0;\n}\n```\n\nOutput:\n\
    There was an exception, but it was caught!\n\nIf you use this version of the catch\
    \ statement with other catch statements, it must be at the end of the list. If\
    \ not, no subsequent catch statements beyond the default catch statement will\
    \ ever have the possibility of being called. However, if the default catch statement\
    \ is used at the end of the list of catch statements, the default catch statement\
    \ will be used only as a last resort."
  merge: -1
