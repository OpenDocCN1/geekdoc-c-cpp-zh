    \ has the same name as a global variable, the local variable is said to shadow\
    \ the global variable. All operations performed on a variable by that name are\
    \ performed on the local variable.\n\nIt is best to avoid this situation, if at\
    \ all possible. If your variable names are conflicting, it is an indication of\
