    # Using VECTORS


    As your programs get complex, the need for more advanced data storage arises.
    Arrays are not bad for storing data, but they are pretty low-level. In other words,
    you have to deal with many of the inconveniences yourself.


    The standard library containers provide an optimal solution to this problem. There
    are many different containers to suit many different needs. In your programming
    experience, you will encounter most of them. To get you started, this section
    presents the most common one: the vector. Vector has properties that make it ideal
    in some situations and quite inefficient in others. It is up to you to decide
    which container suits your needs.


    Vectors are similar to arrays. They hold a series of values, each of which can
    be accessed as though it were its own variable (and not part of a data structure).
    In fact, the data in the vector is stored in a single-dimensional array. Because
    of this, you can easily access any element in the vector simply by providing the
    index number. This kind of access to the elements is called random access, because
    you can access any element easily.


    A vector automatically resizes itself if you add elements to it. It does so by
    creating a new, larger array and copying each element from the old array to the
    new one. This procedure is inefficient and is one of the main disadvantages of
    the vector.'
