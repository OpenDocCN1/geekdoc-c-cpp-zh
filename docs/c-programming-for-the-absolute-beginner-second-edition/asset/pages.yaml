  md: "Conditions in C++ are based on Boolean values. As you have learned, Booleans\
    \ have two possible values, true or false. The operators and operands that make\
    \ up the condition determine a condition's value.\n\nThere are two types of selection\
    \ statements: if else statements and switch statements.\n\n# Testing Conditions\
    \ with if Statements\n\nProbably the most important selection statement is the\
    \ if statement. The idea behind the if statement is a special section of code\
    \ contained within the statement (called the controlled statement) will be executed\
    \ only if a certain condition (called the controlling condition) holds true. The\
    \ general syntax for the if statement is\n\n```\nif (condition)\n  controlledStatements\n\
    ```\n\nHere, condition is the condition being tested, and controlledStatements\
    \ is zero or more controlled statements. These controlled statements are executed\
    \ only if condition evaluates to true. Note that there is no semicolon after condition.\
    \ The two lines of this general syntax are one statement, so a semicolon is not\
    \ required. Also, note that condition is in parentheses of the statement. These\
    \ parentheses are required. If controlledStatements consists of only one statement,\
    \ the syntax is this:\n\n```\nif (condition)\n  statement;\n```\n\nHere theStatement\
    \ is the single statement. Note the semicolon at the end, telling the compiler\
    \ that this is the entire if statement. When controlledStatements consists of\
    \ more than one statement, the syntax looks like this:\n\n```\nif (condition)\n\
    {\n  statementList\n```\n\nstatementList is zero or more C++ statements, each\
    \ ending with a semicolon. Note that no semicolon is required at the end of the\
    \ last curly brace (). You might recall from Chapter 2, \"Descending Deeper into\
    \ Variables,\" that a block of code is any section of code separated by curly\
    \ braces. Blocks of code can be put anywhere a single statement is allowed. This\
    \ is one example, in every program thus far, is the main function. Throughout\
    \ this chapter, you will see quite a few examples of blocks of code. Keep an eye\
    \ out for them."
