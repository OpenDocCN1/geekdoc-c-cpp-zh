  md: '# C++ Programming for the Absolute Beginner, Second Edition


    represent how many experience points the player has. You''d want to hold onto
    this value so that you can refer to it later. Sometimes, like when your player
    defeats a giant spider, you''ll want to change that value, add to it, or subtract
    from it or some other operation.


    The way you represent such a concept in your code is with a variable. So, for
    example, you may have a variable called exp_points that represents the player''s
    current experience points. The name you give to a variable is important, because
    this is how you refer to it.


    Every variable carries with it three pieces of information: its identifier, the
    name by which programmers refer to it; its type, which controls what operations
    can be performed on it and how to perform them; and the data itself.


    Being more concrete, a variable is a certain section of memory on a computer.
    The data that is associated with a particular variable is stored in this section
    of memory. Imagine that many boxes of equal size are lined up in a row. All of
    them are numbered sequentially (the first is 1, the second is 2, and so on). Computer
    memory is very similar. Each variable is one or more boxes, and inside the boxes
    is the data that the variable holds. This is where variables store their data.
    By assigning a name to that data, you can conveniently access it from memory (illustrated
    in Figure 2.1).


    ![](img/62e929c461e30706acae7c69369a00d9_44_0.png)


