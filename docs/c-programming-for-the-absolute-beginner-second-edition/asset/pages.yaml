    \n```\nclass Storage\n{\n    int* data;\n    int numElements;\npublic:\n    Storage();\n\
    \    Storage(int* array, int num) :\n        data(array), numElements(num) {}\n\
    \    Storage(int num) { data = new int[num]; }\n    void AddElement(int newElement);\n\
