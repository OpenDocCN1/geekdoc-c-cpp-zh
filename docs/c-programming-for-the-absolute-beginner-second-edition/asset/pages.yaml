    # ## WORKING WITH COMMON MANIPULATORS


    Manipulators are used to manipulate the data in a stream. For example, you can
    use some manipulators to turn all lowercase characters to uppercase or to adjust
    the way number displays. Most manipulators are included in the ios header file.
    In the following section, you use only the common manipulators found in the ios
    header file.


    Although we can''t list all the manipulators in this book, Table 9.5 lists several
    of the common ones and their functions.


    | Flag | Function |

    | --- | --- |

    | dec() | Displays in the base-10 system. |

    | hex() | Displays in the base-16 system. |

    | oct() | Displays in the base-8 system. |

    | fixed() | Inserts floating-point values. |

    | scientific() | Inserts floating-point values in scientific format using exponents.
    |

    | internal() | Pads to a field width as needed by inserting internal whitespace.
    |

    | left() | Left-justifies characters by padding with whitespace to the right.
    |

    | right() | Right-justifies characters by padding with whitespace to the left.
    |

    | boolalpha() | Symbolic representation of true and false. |

    | noboolalpha() | Cancels boolalpha(). |

    | showbase() | Shows the base of the number prefix octal and numbers with 0 and
    0x, respectively. |

    | noshowbase() | Cancels showbase(). |

    | showpoint() | Displays a decimal point if there is no fractional part. |

    | noshowpoint() | Cancels showpoint(). |

    | showpos() | Inserts a plus (+) sign before non-negative numbers. |

    | noshowpos() | Cancels showpos(). |

    | skipws() | Cancels skipws(). |

    | noskipws() | Cancels skipws(). |

    | unitbuf() | Flushes out after each insertion. |

    | noununitbuf() | Cancels unitbuf(). |

    | uppercase() | Inserts uppercase equivalents of lowercase alpha characters. |

    | nouppercase() | Cancels uppercase(). |'
