    +   - **Compile-time errors.** Errors in the syntax of the programming language.
    For example, if you do not include the t in int while trying to declare an integer,
    you go against the syntax of the programming language and will receive the nasty
    error screen when you try to compile.


    +   - **Run-time errors.** Errors that do not show up until you run the program,
    causing your program to crash. These errors are hard to debug—for example, errors
    such as declaring a constructor and forgetting to program it. They are often hard
    to find and make your program crash with an unpleasant little Windows message.
    The compiler will not pick these up; however, the compiler might provide a warning
    (an error that doesn''t stop the compile process). We recommend that you listen
    to the warnings your compiler gives and that you try to eliminate the errors from
    your code.


    +   - **Logic errors.** Errors that result in your program not doing what it is
    supposed to do. The compiler will not pick up these errors. The program functions
    will not crash but does the wrong thing. For example, imagine that the Orcs you
    programmed are all attacking them. Normally, these errors are easy to remove,
    although sometimes that is not the case.


    Debugging is by far the most annoying part of programming, and in some cases,
    it can be the most time-consuming part.


    # The Black Box


    The black box method of object-oriented programming uses the three principles
    earlier in this section on OOP principles: data abstraction, encapsulation, and
    polymorphism. The idea behind the black box method is that you send a message
    and the object always does the right thing, even though you don''t know how it
    does. This happens because the object controls all its own data. This control
    allows the object to protect itself from invalid parameters and data. You don''t
    need to know and might never know what''s inside the class, but by the time you
    finish testing with the black box, the object is well tested and functions as
    it should.


    Black box testing makes debugging easier. If you debug smaller sections of code
    and ensure that they work under all circumstances, the only errors that you might
    receive are those that occur when your smaller sections of code interact with
    the other, already debugged sections of code.


