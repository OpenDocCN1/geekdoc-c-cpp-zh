  md: '# Table 2.1 DECIMAL SYSTEM VERSUS BINARY SYSTEM


    | Decimal | Binary |

    | --- | --- |

    | 0 | 0 |

    | 1 | 1 |

    | 2 | 10 |

    | 3 | 11 |

    | 4 | 100 |

    | 5 | 101 |

    | 6 | 110 |

    | 7 | 111 |

    | 8 | 1000 |

    | 9 | 1001 |

    | 10 | 1010 |


    Don''t be too intimidated by the binary system. All your old, familiar numbers
    are still there; the binary system just represents them differently. 0 is the
    same, and so is 1. The first strange one is 2. A new digit must be added to make
    the number 2, because binary has only two digits to work, with 0 and 1. Analogously,
    decimal has only 10 digits, a new digit must be added to make the number 10. Don''t
    worry if this is a bit confusing. The most important thing to notice is that all
    values can be represented by a series of 0s and 1s.


    What fractions and decimals do you ask? Well there are ways to represent those.
    Basically, the part before the decimal and the part after are each represented
    separately. It is too complex to go into the details here, but you can be assured
    that they can be represented in computer memory.


    As we mentioned, each electrical switch is called a bit, and a bit can hold two
    possible values, 0 and 1. Eight bits in a row are called a byte. A byte can hold
    256 possible values, 0–255. Using the box analogy at the beginning of this chapter,
    where the rows of boxes represent memory, each box is one of memory. One byte
    is the smallest amount of data with which a computer can work. If one byte is
    needed, the computer uses more than one. Remember, a kilobyte is not actually
    1000 bytes per kilobyte; it''s 1024 bytes. Memory doesn''t follow the metric system
    perfectly. 1024K is a megabyte (MB). 1000MB is a gigabyte (GB). This information
    is summarized in Table 2.2. The number of possible values doubles with each bit
    added, so these numbers get large quite quickly. You always want to make sure
    you are not using more memory in your programs than you should.'
