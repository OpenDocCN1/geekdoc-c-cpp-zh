  md: "```\nint main(void) {\n    cout << add(5,3);\n    cout << add(5.5, 4.7);\n\
    \    return 0;\n}\n```\n\nThe first call to add calls the integer version of the\
    \ add function (the first one) because 5 and 3 are both integers and this matches\
    \ the prototype for the integer version of add. The second call to add calls the\
    \ floating-point version of the function.\n\n# # DEFAULTING ARGUMENTS\n\nSome\
    \ functions are highly flexible, providing many different options to customize\
    \ exactly how they work. This translates into many parameters needed to call the\
    \ function. However, some of these parameters are likely not needed most of the\
    \ time. In these cases, it is often reasonable to give these parameters a default\
    \ value, so that they do not need to be specified by the caller every time.\n\n\
    In C++, you can specify a default value for some parameters. If the calling procedure\
    \ does not pass a complete argument list, the default arguments are used.\n\n\
    Here is the general syntax for implementing arguments in your code:\n\n```\nreturn_type\
    \ function_name(arg_type arg_name = default_value)\n```\n\nHere default_value\
    \ is the default value for the argument. If the caller does not provide a value\
    \ for this parameter, default_value is used. Of course, you can still have more\
    \ than one argument:\n\n```\nreturn_type function_name(arg1 = value1, arg2 = value2)\n\
    ```\n\nHere arg1 and arg2 are the argument types and names.\n\nIt is possible\
    \ to have some arguments with default values and some without default values.\
    \ The rule is that all the arguments without default values must come first in\
