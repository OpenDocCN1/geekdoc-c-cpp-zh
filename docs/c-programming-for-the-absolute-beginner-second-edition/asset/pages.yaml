    Output:\nThere was an uncaught error.\n\n# BUILDING AN EXCEPTION HIERARCHY\n\n\
    If you really specific exceptions for a large program, you can quickly have an\
    \ unmanageable number of exceptions. Having a ton of catch statements after every\
    \ try-block is annoying at best. You can easily forget to include one and wind\
    \ up with quite a problem. Fortunately, as you program, you will discover personal\
    \ techniques to alleviate this problem.\n\nHowever, one common way is to use inheritance\
    \ (refer to Chapter 8, \"Introducing Inheritance,\" for more on that topic). If\
    \ you make a hierarchy of exceptions, you can deal with the most general one,\
