  md: '# FOLLOWING THE ORDER OF Operation


    When more than one operator is in a single expression, the computer must determine
    the order in which to execute it. Fortunately, operators are executed according
    to a standard-ized order called the order of operation.


    You might be familiar with this standard. Does the term BEDMAS sound vaguely familiar?
    It is term used in elementary school math to teach the order of operations, as
    shown here:


    +   - Brackets

    - Exponents

    - Division/Multiplication

    - Addition/Subtraction


    This list is called an order of precedence list. Entries at the top of the list
    have the highest precedence, and entries at the bottom of the list have the lowest
    precedence. If two operators are at the same level in the list, they are said
    to have equal precedence. For example, if you have a math expression, such as


    ```

    (3*7)/6-2*2

    ```


    you can use the order of precedence list to determine how to evaluate the expression.
    First, all brackets (the operation at the top of the; but PEDMAS doesnt sound
    quite right) are evaluated. This involves evaluating everything inside the bracket-s.
    The first thing is to evaluate the expression 3+7*3. Two operators are in this
    expression: multiplication and addition. Because multiplication is on the list,
    it is evaluated and then the addition, giving you 3+21 and then 24.


    The expression remaining 24/6-2*2. Next, because division and multiplication are
    on the same level of precedence, they are evaluated from left to right. The expression
    becomes 4-4. The expression remaining is easy to evaluate. The final answer is
    0.


    C++ has a similar order of precedence list as well (see Table 3.4).


    In Table 3.4, expr is any valid C++, value is any identifier whose value can change,
    and global is any global variable. As you can see, these rules are much more complex
