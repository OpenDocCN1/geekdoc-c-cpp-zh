    \nSee, that wasn’t so bad! If you’re comfortable with all of these basics, the\
    \ rest is easy.\n\n# Extending Inheritance\n\nThe simple inheritance that we have\
    \ taught so far is not particularly useful, but it is the base from which your\
    \ knowledge will grow. The following concepts are actually incredibly simple,\
    \ so if you understand the past few sections, you should be on easy street.\n\n\
    First, a derived class can also be a base class for another derived class. Through\
    \ multilevel derivation, you can get an inheritance chain. An inheritance chain\
    \ is a sequence of derived classes, each of which is also a base to the class\
    \ below it. The idea here is to begin with a general concept for the base class\
    \ and then become more specific as you move down the chain.\n\nThe following code\
    \ illustrates how inheritance structure looks in C++:\n\n```\nclass Vehicle();\n\
    class LandVehicle : public Vehicle();\nclass Car : public LandVehicle();\nclass\
    \ HondaInsight : public Car ();\n```\n\nAs with normal inheritance, the constructors\
    \ are executed from the base down, and the destructors are in reverse. For example,\
    \ in the preceding inheritance chain, the order is as follows: Vehicle constructor,\
    \ LandVehicle constructor, Car constructor, HondaInsight constructor; then Honda\
    \ destructor, Car destructor, LandVehicle destructor, and Vehicle destructor.\n\
    \nFigure 7.1 shows a conceptual diagram of the Vehicle inheritance chain. Notice\
    \ how the arrows point up rather than down. This is because the arrows show the\
    \ direction that classes can access other classes. A base class does not have\
    \ access to a derived class, but a derived class has access to a base class."
