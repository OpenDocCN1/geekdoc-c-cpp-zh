    ```\n\nIn addition, a template parameter does not have to be a general type. It\
    \ can be something specific, such as an integer or a floating-point. Here is an\
    \ example of using a specific data type in a template parameter:\n\n```\ntemplate<class\
    \ T, int i> class Array\n(\n  T data[i];\n  //...\n);\n```\n\nYou can use this\
    \ class template as follows:\nArray<int, 10> intArray;\n\nThis code snippet creates\
    \ an array of ten integers. Notice how the array is created with the size given\
    \ from the template parameter? Doing this might be confusing. You can't create\
    \ dynamic sized arrays from function arguments because a function argument does\
    \ not have to be a constant size (except an array on the free store). However,\
    \ a template parameter can be a constant or a pointer. Also, a template parameter\
    \ used within a class must be treated as a constant (you can't change its value).\n\
    \nHere is an example to illustrate these concepts:\nint i = 10;\n\n```\n// non-constant\
    \ value used for template parameter\nArray<int, i> intArray;\n\n//ok constant\
    \ value used\nArray<int, 10> intArray;\n```\n\nThe compiler has to know the size\
    \ of all arrays created before the program actually runs. If you provide a constant\
    \ expression, such as 20 - 10, the compiler will be able to evaluate the expression,\
    \ so it is acceptable to use constant expressions."
