  md: "# C++ Programming for the Absolute Beginner, Second Edition\n\nThe answer is\
    \ by using the scope resolution operator. If you want to make sure that the global\
    \ version of the variable is used, just put two colons (::) in front of it. For\
    \ example, to make the preceding code use the global version, you change the previous\
    \ code to the following:\n\n```\nint intVar;\n\nint main(void)\n{\n    int intVar;\n\
    \    ::intVar = 5;\n    return 0;\n}\n```\n\nThis shadowing effect can also happen\
    \ with sub-blocks. For example, if you have an if statement within the main function,\
    \ a variable declared within the if block can shadow a global variable or a local\
    \ variable of main. However, the scope resolution operator can be used only to\
    \ specify a global variable. For example, if an if statement shadows a main variable,\
    \ you cannot access the main version of that variable. Here's an illustration:\n\
    \n```\n#include <iostream>\n#include <string>\n\nusing std::string;\n\nstring\
    \ str = \"Humans and elves can coexist.\";\n\n//exempl the scope resolution operator(::)\n\
    int main(void)\n{\n    using std::cout;\n    string str = \"Humans often live\
    \ in the woods.\";\n    cout << str.c_str() << \" <<\" \" << str.c_str() << \"\
    \\n\";\n    if (true)\n    {\n        string str = \"Humans often live in cities.\"\
    ;\n        cout << str.c_str() << \" <<\" \" << str.c_str() << \"\\n\";\n    }\n\
    \    return 0;\n}\n```"
