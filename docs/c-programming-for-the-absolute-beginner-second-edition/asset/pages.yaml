    # RECEIVING INPUT


    When you are writing programs, you want to be able to receive input from the user.

    You want to be able to ask him questions, like what he''d like to do or what his
    name is. In this section, you learn how to do that.


    The most important component of receiving input is the word cin (pronounced "see-in").
    Just as cout is used to display text to the screen, cin is used to read input
    from the keyboard. cin is also part of the C++ Standard Library, so the proper
    files must be included:


    ```

    #include <iostream>

    ```


    Yes, that''s right. It''s in the same file as cout. iostream deals with both input
    and output capabilities. Of course, you also need a using declaration:


    ```

    std::cin;

    ```


    And you''re finally set to begin receiving input from the user!


    # STORING STRINGS WITH CIN


    You can store strings using cin as much as you''ve stored them before, except
    now you declare the name and assign it its value. When you assign this value,
    you use the cin object. The cin object represents the keyboard or some other input
    device, whereas the cout represents the screen or some other output device, like
    a file. You learn more about objects in Chapter 5, "Designing Software: Object-Oriented
    Programming." Here is an example of storing a user-input string:


    ```

    string name;

    cin >> name;

    ```


    Notice that you use cin in much the same way that you use cout. Notice that the
    less-than signs are no greater-than signs. These signs indicate that the computer
    is accepting data rather than displaying it.


    Here is an example of a complete program using cin:


    ```

    //1.3 - Hello Program - Dirk Henkemans

    #include <iostream>

    #include <string>

    ```'
