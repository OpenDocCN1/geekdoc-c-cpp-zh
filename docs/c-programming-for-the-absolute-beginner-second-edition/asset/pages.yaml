  md: '# Chapter II • Creating the Pirate Adventure


    Speaking of which, the loaded image is used in the next line. In order to display
    an image on the screen, we must first load it into a "sprite". A sprite in Dark
    GDK is a two-dimensional image that can be displayed on the screen. When we create
    a sprite, we give it an id and a background for the whole screen, is set to the
    top-left corner of the image and, since this is a background as the fourth parameter
    to refer to the top-left corner of the screen, or of (0,0). The image id is used
    to refer to the previously loaded image file.


    Using the dbSetImageColorKey() function, you can make a certain color be displayed
    as transparent onscreen. This can be a convenient way to convert a square image
    file into, say, an asteroid shaped image.


    The last step is to create the 28 asteroid sprites at random locations. These
    sprites are different from the background that they are animated. Take a look
    at Figure 11.3 to see the image these sprites are created from. As you see, all
    the different frames of animation are stored in the same file. Instead of dbLoadImage(),
    we use dbCreateAnimatedSprite() to load the images for an animated sprite. You
    must provide the number of animation frames per row and the number of columns.
    Though the sprite is created with this function call, we must still call dbSprite()
    to give this sprite a position. dbRand() is used to create random values for the
    sprite''s position.


    ![](img/62e929c461e30706acae7c69369a00d9_305_0.png)


    FIGURE 11.3

    The image file for the asteroid sprite.'
