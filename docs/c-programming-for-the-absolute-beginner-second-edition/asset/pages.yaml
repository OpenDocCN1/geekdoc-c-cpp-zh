    \ the ProjectileWeapon class. You'll notice that the member variables damage and\
    \ cost are not declared in the ProjectileWeapon class for this reason; they are\
    \ automatically included through the magic of inheritance!\n\nNow, let's take\
    \ a look at the ProjectileWeapon constructor. The naïve and incorrect way to implement\
    \ it would be the following:\n\n```\n// Will not compile. ProjectileWeapon cannot\
    \ access Weapon's private members\nProjectileWeapon:ProjectileWeapon(int intDamage,\
    \ int intCost, int intRange)\n    : damage(theDamage), cost(theCost), range(theRange)\n\
    ```\n\nThe problem is a rule of C++ inheritance that seems very odd at first.\
    \ A child class cannot access its parent's private members. At first that seems\
    \ like a rather pointless rule that just makes things more difficult, but it does\
    \ have a purpose. With this, you can ensure that the implementation details of\
    \ the Weapon class are all kept in one place. If you change the name of the damage\
    \ member, for instance, you won't need to search through every derived class for\
