    \ However, making an object from the Comparable class wouldn't have much meaning.\n\
    \nC++ provides a way, called abstract classes, to represent these abstract concepts\
    \ without accidentally mistaking them for normal objects. You create an abstract\
    \ class by putting a pure virtual function inside the class. (You cannot create\
    \ an object from an abstract class)\n\nA pure virtual function is a function that\
    \ is not implemented but is used only to create abstract classes (the base class\
    \ does not provide a definition for it). To create the syntax for a pure virtual\
    \ function, you simply put = 0 at the end of the virtual function declaration:\n\
    \n```\nvirtual return_type function_name(argument_list) = 0;\n```\n\nIf a class\
    \ has one of these pure virtual functions as one its members (or it does not override\
    \ one from its base class), the class is an abstract class. It is illegal in C++\
    \ to create an object from an abstract class. The pure virtual function just helps\
    \ to ensure that you don't accidentally attempt to create an object from that\
    \ base class. The base class exists, therefore, only to provide a structure for\
    \ derived classes. Here is an example:\n\n```\nclass Abstract\n(\npublic:\n  \
    \  virtual void draw() = 0;\n);\n```\n\n```\nint main(void)\n{\n    Abstract a;\
