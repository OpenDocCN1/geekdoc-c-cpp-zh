  md: "# C++ Programming for the Absolute Beginner, Second Edition\n\nAn exception\
    \ occurs because a section of code throws an exception. One example of an unexpected\
    \ event, or exception, is a computer running out of hard drive space. However,\
    \ running out hard drive space does not mean that a program will necessarily crash\
    \ or completely fail at its task. You can write code that handles such exceptions\
    \ by specifying that the program catch a certain kind of exception.\n\nIn order\
    \ to catch an exception, you must use a try-block. A try-block is a section of\
    \ code with the keyword try at the beginning. This keyword keeps track of whether\
    \ an exception occurs. The syntax for a try-block is as follows:\n\n```\ntry {\
    \ someCode }\n```\n\nUsing a try-block tells the computer that the code inside\
    \ a try-block might throw an exception, so watch out.\n\nAfter you establish a\
    \ try-block, you can use it to catch an exception. You do this by using a catch\
    \ statement. Here is the syntax for the catch statement:\n\n```\ncatch(exceptionName)\
    \ { whatToDo }\n```\n\nHere exceptionName is the name of an exception. When the\
    \ code inside a try-block throws an exception, the computer starts executing the\
    \ code inside the catch statement. In order for a catch statement to be connected\
    \ with a try statement, the catch statement must occur immediately after the try\
    \ statement. You cannot have any code between them:\n\n```\ntry {\n  someCode\n\
    }\ncatch (exceptionName) {\n  whatToDo\n}\n```\n\nYou can have as many catch statements\
    \ after try statements as you want:\n\n```\ntry {\n  someCode\n}\ncatch (exceptionName1)\
    \ {\n  whatToDo\n}\n```"
