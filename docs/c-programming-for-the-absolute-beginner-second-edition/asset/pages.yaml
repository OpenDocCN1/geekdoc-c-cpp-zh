    \ One solution is to use static variables.\nStatic variables have the same scope\
    \ as normal variables, but their lifetimes lasts until the end of the program.\
    \ In this way, you can create a function that has a “memory\"\n\nYou declare a\
    \ static variable with the static keyword:\n\n```\nstatic var_type var_name;\n\
    ```\n\nThe statement in which the static variable is created is executed only\
    \ once for the whole program. This means that if you initialize the static variable\
    \ on the same line\nstatic var_type var_name = value;\n\nthis initialization will\
