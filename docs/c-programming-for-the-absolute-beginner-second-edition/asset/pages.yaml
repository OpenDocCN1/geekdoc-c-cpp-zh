  md: '# FOREWORD


    the video game industry is unique in that it regularly incorporates every major
    discipline of computer science. From 3D graphics and artificial intelligence to
    operating system theory and database design, if you are designing a commercial
    video game, you will eventually run into problems from each of these fields. Some
    of these fields mean working with specialized languages, but ultimately the two
    languages that are as common to the game industry as crunch time, caffeinated
    beverages, and pizza are C and C++. Despite few commercial games written in Java
    (which is very similar to C++), almost every game that you play is written in
    either Or C++. It doesn''t matter whether the game runs on a PC, a game console,
    or even an arcade machine, chances that C or C++ routines are at its heart. Even
    in cases when performance dictates that a routine needs to be written in assembly
    language to squeeze out more speed, it is common practice to first write the routine
    in C or C++.


    During my years in the industry, I have interviewed over one hundred applicants
    for programming positions and have read resumes from thousands more. Through all
    of this, I continually to look for three things in a strong candidate. The first
    is strong problem-solving skills. With constantly changing and fierce competition,
    game programming is always throwing new problems at us. Consequently, excellent
    problem-solving skills are not only a luxury, but they are also a requirement.
    Second, a good candidate has been exposed to the entire spectrum of computer science
    disciplines. Even when programmers have specialized in one area, the solution
    to a problem often lies in a field outside their area of expertise. Finally, I
    look for strong C/C++ skills. C/C++ skills are to a game programmer what paint
    and brushes are to a painter. They are the tools of the trade, and, they need
    to be finely honed.


    Although C++ is widely used as a teaching language, this wasn''t always the case.
    I can still recall my first exposure to C programming. Until that time, all of
    my programming had been in Basic (my first video game was written in it), Pascal,
    and Fortran. I had heard of C: according to rumor, it was going to be the language
    to know. I was looking forward to my next computer science course:Introduction
    to Programming Languages." I assumed the course would teach me how to program
    in C. I was wrong. The only reference to C in the entire course was, "Here'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'is your assignment. Write it c in on Wednesday." "Okay." I thought. "At least
    one of the course textbooks is about C." As it turned out, that textbook was about
    accessing UNIX operating system information from the C language. That was useful
    if I was interested in accessing process IDs or using shell commands, but not
    a great help if I wanted to know how to read a file or write a function.


    Somehow I managed to struggle through the assignment and to actually learn something
    while I did it. It wasn''t the best way to learn a new language, but it was better
    than my first exposure to C+. That during my first job after graduation. I was
    working for the university''s athletic department writing software for various
    research projects. One of the projects in C++. Once again, I had before me a sink-or-swim
    proposition. This time, I had access to a function reference that explained the
    syntax of the language, not how to use it. I would have killed for the book that
    you are currently holding in your hands. Well, maybe not killed, but I certainly
    can''t overestimate the importance of learning C++ in such such an organized and
    straightforward manner. As you read this book, please have some sympathy for those
    of us who didn''t have the fine learning tool you have.


    ![](img/62e929c461e30706acae7c69369a00d9_5_0.png)


    Scott Greig

    Director of Programming Bio Corp.'
