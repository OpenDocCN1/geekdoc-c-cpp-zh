  md: '# Chapter II • Creating the Pirate Adventure


    ```

    char fileNameBuffer[500];

    strcpy(fileNameBuffer,m_fileName.c_str());

    dbLoadImage( fileNameBuffer, m_imageID);

    ```


    You may wonder why we don''t pass m_fileName directly to dbLoadImage(). First,
    dbLoadImage() takes a char* and m_fileName is a string. Also, the c_str() member
    function returns a const char* instead of a regular char*, so we must copy it
    into a new string in order to pass it to dbLoadImage().


    The m_mapfile is a file stream of the bitmap image of map. We use this in the
    IslandCollision() member function to ensure the ship does not travel on land.


    The addCity() function passes its arguments to the City constructor, which is
    called to create a new City object on the heap. The pointer to this new City object
    is stored in the m_cities vector.


    The hide() and show() member functions simply call dbShowSprite() and dbHideSprite()
    to show or hide this particular portion of the map depending on whether or not
    the ship is currently on this screen.


    The IslandCollision() member function takes a Point object and returns true if
    the map has land instead of water at that location. First, the file stream is
    positioned to read location from the file. The formula for computing this location
    has much to do with the internal storage of bitmaps, but basically, there are
    54 bytes at the beginning that are irrelevant and then there are 3 bytes per pixel,
    a red, a green, and a blue value. We read the green and blue values and test if
    the green is less than the blue. If so, this is water. Otherwise, it must be land.


    The enteringCity() member function takes a Point object and returns a pointer
    to a City object if that Point is inside a city. Otherwise, it returns 0. The
    function simply iterates through all of the cities and calls the isInside() member
    function.


    The destructor iterates through all of the cities and frees, destroys the sprite
    and image, and closes the file stream.


