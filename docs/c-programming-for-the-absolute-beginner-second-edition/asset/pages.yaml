    FIGURE 4.1

    Conceptual diagram of the process of calling a function.


    # EXPLORING FUNCTION SYNTAX


    In this section, we move from a theoretical to a practical level in which you
    learn how to write the code required for functions. To do so, you must first learn
    the art of function syntax. For now, however, you need to be concerned with only
    three parts of a function. The following three parts will be the foundation for
    your programs'' interactions with functions and for your declaration of functions:


    +   - The function declaration

    - The function definition

    - The function call


    In the following sections, we discuss each of these parts.


    # Declaring a Function


    A function declaration tells the compiler that a function exists. You tell the
    compiler the name of the function, what the arguments are, and what the function
    returns. A function declaration is also called a prototype because it is a model
    of the function. Here is the general syntax for a function declaration:


    ```

    return_type function_name(argument_list);

    ```


    Here return_type is the type of data that the function returns, Function_name
    is the name of the function, and argument_list is a list of arguments that the
    function requires. Don''t forget to add a semicolon at the end of the declaration.


    If you do not want to return a value, you can use the keyword void in place of
    return_type:


    ```

    void function_name(argument_list);

    ```'
