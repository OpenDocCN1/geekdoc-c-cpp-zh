    # CHARACTER ARRAYS


    As you have seen, arrays of characters are another way of representing strings.
    You can initialize a character array with a string literal, as shown in the following
    example:


    ```

    char s[] = "Hello World!";

    ```


    Because you don''t have to provide the length of the array within the subscripting
    operator, declaring a string is always as convenient as using the string class
    from the standard library. C++ will allocate enough characters in the s array
    to hold the null zero that appears at the end of the string.


    # DETERMINE STRING LENGTH


    To obtain the length of the string s[] (from the previous section "Character Arrays”),
    you can use the usual method for determining the length of an array—use the sizeof
    operator. For example, to obtain the length of s in the example in the preceding
    section, you do the:


    ```

    cout << sizeof(s);

    ```


    This code displays the number 13 onscreen. We didn''t divide by the size of char
    as you normally would obtain array length because the size of char is always 1.


    There is a slight problem with this method. The length of the string is 12, not
    13. If you obtain the size through the sizeof operator, the null character is
    included in your length. To obtain the length of the string without the null character,
    you can subtract 1 from the length you obtain, or you can use the standard library.'
