    # USING THE SIZEOF() OPERATOR


    This relatively simple operator is built in the C++ language. Use it on any variable,
    and it will give you the amount of memory, in bytes, that the variable consumes.
    You use it in the following way:


    ```

    sizeof(identifier);

    ```


    To display a double’s size to the screen, you might use this code fragment:


    ```

    double aDouble;

