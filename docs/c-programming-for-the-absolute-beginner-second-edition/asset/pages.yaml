    Before continuing with OOP, you need to understand some key terms.


    A class is like a general model from which you can create objects. For example,
    if you create a dog class, you describe the characteristics related to the general
    idea of a dog.


    Creating a class is the same as creating a new data type. When you create a class,
    you tell the computer the kind and amount of this new type can hold. You also
    tell the computer what actions the new type can perform. Then you can use the
    class you''ve created to create variables from this new type (as you will see,
    these variables are called objects). As complicated as this might seem, creating
    your own classes is an easy process, as you will learn in the following sections.


    You declare all the members and methods inside a class. Figure 5.1 shows an example
    of what a bow class might look like. The Bow class describes the general properties
    and capabilities of a bow. A Bow class tells the computer what a bow is in terms
    of programming so that the computer knows what to do the next time it encounters
    one.


