  md: '# USING THE OCTAL,

    HEXADIMAL, BINARY, AND

    DECIMAL SYSTEMS


    To most people, the standard number system is the decimal system (also called
    base-10). All numbers in the decimal number system are based on exponents of 10.
    Each digit holds 10 possibilities (1, 2, 3, 4, 5, 6, 7, 8, 9 or 0). Based on theories
    of permutations, if you have two digits in the decimal system, you can have 100
    different values (1 to 99 and 0). This principle is behind all numeric systems.


    In the binary number system (also called base-2), if you have two binary digits,
    you have four possibilities, as follows (equivalent values appear in parentheses):
    00 (0), 01 (1), 10 (2), and 11 (3).


    The hexadecimal number system (also called hex and base-16) is useful in computers
    (and, so, to programmers). Each digit has 16 possibilities (0–9 and A–F). The
    decimal number system has only 10 unique digits, so to represent 16 unique digits,
    the first five letters of the alphabet are used. A represents 10, B represents
    11, C represents 12, D represents 13, E represents 14, and F represents 15. Hex
    numbers are written with 0x prefixing the number, for example, 0x3E1 is a hexadecimal
    number.


    Octal is a base-8 number system, which is also useful in computers. Each digit
    has eight possibilities (0–7). Octal is represented with an “x” prefixing the
    number—for example, x95.'
  merge: -1
