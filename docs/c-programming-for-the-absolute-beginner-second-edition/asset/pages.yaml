  md: 'In order to appear like a professional game, the “Pirate Adventure” needs a
    title screen. A title screen generally displays the title of the game (on most
    games, the title screen will also be where you can choose to start a new game).
    The title screen (Figure 11.13 shows the title screen for the “Pirate Adventure”)
    displays until the key is pressed, and then the “Pirate Adventure” begins.


    Finally, the city screen (see Figure 11.14) displays whenever the player enters
    a city. This gives some variation to the game. The player isn''t always on the
    same screen for the entire game.


    Now that you have the background on the screen images, you can turn your attention
    to the graphics for the ship. In this game engine, there is only one ship (the
    player), but you could easily reuse the graphics for the first ship and create
    four for a second one on the screen. Because the ship travels in only four directions,
    you need only four graphics for the ship, one image for each direction. Fortunately,
    all images are small enough to fit into one image. When you need one, you just
    copy that part of the image.


    Each picture of the ship is called an animation frame. See Figure 11.15 for the
    ship image file. Because the ship must sit seamlessly on the map screen, its background
    needs to be transparent.


    ![](img/62e929c461e30706acae7c69369a00d9_313_0.png)


    > FIGURE 11.13

    Here is the “Pirate Adventure” title screen in all of its glory.'
