    # Using Visual Studio


    In this section, you find out how to use Visual Studio to create your first program.
    Visual Studio is an Integrated Development Environment (IDE). A programmer requires
    many different tools to do his work: an editor to write code, a file browser to
    organize all of his files, a compiler to turn the source code into an executable
    program, and a debugger to examine a running program. An IDE has all of these
    tools packaged together into one application. Some programmers, whereas others
    prefer to use a separate application for each tool, creating their own, customized
    environment. In Appendix C, we discuss some alternatives to Visual Studio.


    ![](img/62e929c461e30706acae7c69369a00d9_24_0.png)


    We wrote this book on the assumption that you are using Visual C++ 2008 Express
    Edition (which is freely available). However, it isn''t a big deal if you are
    not. Most of the information in this chapter and the other chapters will apply
    regardless of the compiler that you are using. For detailed instructions on how
    to download and install Visual C++ 2008 Express Edition, check out http://cplus.com/od/learnrc/ss/vc2008.htm.


    It''s time to start your quest into the world of programming. As we explain how
    to create a project with Visual Studio and present the code, try it out for yourself
    on your own computer. Practice makes the unfamiliar seem natural.


