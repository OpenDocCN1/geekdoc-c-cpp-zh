  md: 'The heap (or free store or dynamic memory) is the final type of memory. Sometimes
    you want the best of both worlds. You want memory that you can allocate whenever
    you need it, but you don''t have it to disappear when the function ends. This
    is exactly how the heap works. You call a special function to allocate memory,
    telling it how much you need, and when you''re done you call a special function
    to de-allocate it. This gives you total control, but also total responsibility.
    It is up to you to keep track of what you''ve allocated and to de-allocate it
    when you don''t need it anymore.


    # Using Pointers


    Pointers are a powerful tool if used effectively, then they can be one of the
    most challenging C++ tools to learn to. However, we promise to guide you slowly
    through the information in this section.


    The simplest definition of a pointer is: A pointer is a variable that holds a
    memory address. Although this definition of a pointer is pretty straightforward,
    its implications are far more complex.


    The memory address that the pointer stores is the address of another variable.
    So a pointer is said to "point to a variable."


    The syntax for declaring a pointer is as follows:


    ```

    pointer_type* pointer_name;

    ```


    Here, pointer_type is the type of the variable being pointed to, and pointer_name
    is the name of the pointer. However, declaring pointers is only a start; using
    them is the complicated part.


    First, you must learn about a new operator, the address of operator (&). You put
    it directly in front of a variable, and it evaluates to the memory address of
    the variable. This operator is useful for assigning values to a pointer. Here
    is an example of how to use the address of operator:


    ```

    int my_int;

    int* my_int_pointer = &my_int;

    ```


    This code makes my_int_pointer point to my_int. my_int_pointer stores the memory
    address of my_int.


    Note that if a pointer has the value 0 assigned to it, the pointer does not point
    to a variable. This case is called a null pointer or an undeclared pointer.'
