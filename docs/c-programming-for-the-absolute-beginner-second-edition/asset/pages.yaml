  md: '# C++ Programming for the Absolute Beginner, Second Edition


    The code template<class T> tells the computer that this class is using a template
    and that T is being used as a placeholder for the data type being stored. Even
    though you write class T, T doesn''t have to be a class. It can be any data type.


    Another way to think about a template is an argument list. The preceding example
    has one argument, class T. When the Storage class is used, the user passes the
    type of data to store "almost" as an argument. Then T is filled with this data
    type. As you can see, class T is much like an argument declaration. Here, the
    keyword class is used in a different way to mean "data type". For this reason,
    you can use the keyword typename rather than class if you want (it has the same
    meaning here).


    After you declare T in the first line, you can use it anywhere within the class
    just like any other name (such as int or float). This means you can declare new
    variables and pointers, arrays, or anything else for which you might use a type
    name.


    When you create an object from this class template, you must specify which type
    of data you are going to store. Here is an example for storing integers:


    Storage<int> intStore;


    As you can see, specifying the type of data for a template is like passing an
    argument. When intStore is created, int takes the place of all the Ts in the class.
    You can use Storage<int> just like you use the name of any other class. In the
    same way, you can store any kind of data:


    Storage<float> floatStore; //stores floats

    Storage<string> stringStore; //stores strings

    Storage<Shape*> shapeStore; //stores pointers to Shapes


    Take a look at the syntax for creating a class template:


    ```

    template<class TypeName> class ClassName(

    ClassDeclaration

    );

    ```


    TypeName is an arbitrary placeholder for a data type, ClassName is the name of
    the class, and ClassDeclaration is the declaration of the class (just like normal
    classes from Chapter 5, "Fighting with OOP"). Keep in mind that TypeName can be
    any valid identifier, but it is usually a single capital letter, as T or C.


    If a method is implemented outside the class template, you must use the template
    syntax again for it. Here is the syntax for methods that are implemented outside
    of the class template:'
