  md: '1. Find all the versions of the function that could possibly apply to the arguments.
    For a call of add(5,3), this rule leaves both versions as possibilities. For a
    call of add(75, ''a''), this rule leaves no possibilities (because both versions
    take two of the same data type).


    2. If one function template is a specialization of another, choose the specialization.


    3. Apply the normal overload rules for functions to everything that is left.


    4. If a function and a function template are, choose the function. For a call
    of add(5,3), both the function and the function template were candidates until
    this step. The function is chosen.


    5. If no possibilities remain, the call was an error. If two or more possibilities
    remain, the call was ambiguous and is an error.


    Earlier, we said that if the parameters are not clear from the argument list,
    you must provide parameters when you call the function—for example, if you call
    the add function with an integer and a floating-point. Fortunately, there are
    some ways around to provide overloaded versions of the add function that call
    the function template with the parameters. Here is an example of how the user
    does not have to worry about the function template.


    ```

    inline float add(int a, float b) { return add<float>(a,b);

    inline float add(float a, int b) { return add<float>(a.b); }

    ```


    Now, if you call the add function with an integer and a floating-point and you
    don''t provide a parameter, the computer will be able to figure what to do. Notice
    how the preceding functions are declared inline. This is so no extra memory is
