  md: 'An array holds a set of data. Each member of the set is called an element.
    Each element has a particular index associated with it. An index is a number that
    indicates which element of the array you are accessing.


    Beginners often often have difficulty with a seemingly odd thing about arrays:
    The numbering of the index starts at zero. So, if you have an array with five
    elements, the indexes will be 0, 1, 2, 3, and 4. After you work with arrays for
    a while, you will get used to this weird numbering, and it will start to feel
    natural. Figure 6.2 shows array as boxes lined up in a row, with the array name
    `char[]` and individual array elements (such as `char[0]`) in each of the boxes.


    ```

    charArray[4] = {''a'',''b'',''c'',''d''};

    ```


    | charArray[0] | charArray[1] | charArray[2] | charArray[3] |

    |---|---|---|--|

    | ''a'' | ''b'' | ''c'' | ''d'' |

    | 1 byte | | |


    > Figure 6.2

    nYou can picture arrays as a row of boxes lined up by side.


    # Creating Arrays


    Creating arrays is an easy process, especially now that you''ve learned about
    variables. To create an array, type the data type and the variable followed by
    the subscripting operator. Here is the basic syntax:


    ```

    data_type array_name[number_of_elements];

    ```


    This creates an array called `array_name` of type `data_type` with `number_of_elements`
    elements. For example, to create an array of integers called `int_array` with
    ten elements, you type


    ```

    int int_array[10];

    ```


    Remember that the indexing starts at 0, so the elements will be numbered 0 to
    9. Element 10 does not actually exist in this array, even though it appears to
    when you are looking at the declaration.


    You can create arrays of all data types, including user-defined types. If you
    have a class MyClass, you can create an array of ten MyClass objects like this:


    ```

    MyClass my_class_array[10];

    ```'
