  md: 'Column number 3:


    768 / 16^3 = 0 Remainder: 768


    Hexadecimal number so far: 3E1


    768 - 768 = 0


    Hexadecimal digit = 768/16^2 = 3


    You''re finished! 0x3E1 is the hexadecimal number.'
