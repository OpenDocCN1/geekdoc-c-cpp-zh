  md: '# INTRODUCTION


    ++ is the most widely used programming language around and is an industry standard
    for programming applications of all kinds. In addition, C++ is a highly efficient
    programming language that can conserve resources more effectively than languages
    such as Visual Basic or Delphi.


    In fact, because of its functionality and style, in many ways, C++ is the only
    non-Web-based programming language that you might ever need to.


    We chose to teach you C++ through game programming because initially many people
    experience computers through playing computer games. More important, computer
    games are a wonderful way to learn to program because they teach you how to display
    an interface on a monitor, how to receive commands from the user, and how to manipulate
    information. Ultimately, games are a blend of art and science that taps into logical
    and creative minds, stimulating visual, audio, and mental experiences for programmers
    and users.


    Over the course of this book, you will discover many innate programming techniques
    that apply not only to C++, but also to programming in general. These common programming
    techniques will make it easier for you to learn how to program in other languages
    and create applications other than game applications.


    # WHAT''S IN THIS BOOK


    The book moves from simple text-based programs to more complicated games with
    actual graphics. If you are an absolute beginner at programming, we suggest that
    you go through the chapters in their natural order. On the other hand, if you
    already have some experience in programming, you might want to gloss over the
    first six chapters, which jump ahead to more advanced topics.


    The book is conceptually, though not physically, organized into four sections.
    First, Chapter 1, “Starting the Journey,” through Chapter 6, “Managing Memory,”
    give you the basic knowledge you need to program in C++. Because of the sequence
    of the topics in these chapters, we suggest going through them in order. For example,
    you will probably need to work through Chapter 4, “Structuring Your Code with
    Functions,” before turning to Chapter 5, “Designing Software: Object-Oriented
    Programming,”'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    The second section of the book (Chapter 7, "Relating Classes," through Chapter
    10, "Errors and Exception Handling,") consists of the advanced C++ topics. You
    can cover these chapters in any order and fully comprehend them.


    The third section consists of Chapter 11, "Creating the Pirate Adventure." Here
    you put together everything you learned in the earlier chapters and apply it to
    programming a rocking pirate game using industry-standard techniques.


    The fourth section includes appendixes with extra information that you will find
    helpful, beginning with Appendix A, "Answers to Chapter Challenges," and ending
    with Appendix E, "Glossary."


    Now you read the book, remember that a big part of learning to program with C++
    is hands-on experience. The more you program, the better you will be at problem-solving
    (an important skill in programming, as you will discover) and detecting errors
    in your code. Who knows, if you program enough, you might even be able to calculate
    pi to a million digits... in your head (though doing so is not guaranteed by the
    author of this book!)


    Throughout the chapters, you will find small bits of code that illustrate concepts
    we present. At the end of each chapter, you will find a complete game that demonstrates
    the keys in the chapter, a summary of the chapter, and a set of challenges that
    will test your newfound knowledge. We hope that you will try the games and challenges
    because they will really help you develop the feeling of programming. The solutions
    to the challenges are in Appendix A. However, we strongly encourage you to try
    the challenges before looking at the solutions (even if you need help). They are
    all fairly short, so you can type them into your compiler (which is, again, a
    good way to gain experience).


    # What You Need to Get Started


    Learning to program is an excellent way to take advantage of the power of your
    computer. However, before you can begin programming, you need to have the following
    on hand:


    +   - A PC with a 2.0 GHz or faster processor.

    - XP Professional with Service Pack 2 installed, Windows Server 2003, or Windows
    Vista.

    - At least 512MB of RAM.

    - At least 8GB hard drive space.

    - A compiler as Visual Studio 2008 Express Edition.

    - Knowledge, time, and patience. The information in this book will give you enough
    knowledge to effectively utilize C++ and Visual Studio, or most other compilers.'
  merge: -1
