  md: '# Creating Random Numbers


    Random numbers do not exist in computers; however, you can create pseudo random
    numbers using complex mathematical formulas. We do not discuss these formulas
    because they are too complex for a beginner, and you do not need to understand
    them in order to use them.


    Random numbers are created from a random seed. A random seed is a number that
    is used to start the random number generator. This random seed usually comes from
    the current time of the computer''s clock.


    This is an ideal choice for a random seed because it is so unpredictable. The
    chance of a program being used twice in once is unlikely, so the random number
    will probably be different every time.


    The process for generating random numbers consists of two parts: first, setting
    the seed; second, generating the random number. In order to gain access to the
    second hand of the computer''s clock, you must include part of the standard C++
    library: `<ctime>`:


    ```

    #include <ctime>

    ```


    The random number generator is also part of the standard library, so you must
    include `<cstdlib>`:


    ```

    #include <cstdlib>

    ```


    In order to seed the random number generator, you use `srand()` (seed random)
    function (see Chapter 4 for more functions). You put the number with which you
    want to seed the generator within parentheses. This can be any number, but in
    this case, you are using the `time()` function. The `time()` function gives the
    number of seconds that have passed since January 1, 1970, which seems bizarre,
    but it is the standard way of getting the computer''s time. Once you have seeded
    the random number generator, you can obtain random numbers with the `rand()` function.


    First, you must include these names with a `using` declaration:


    ```

    using std::rand;

    using std::time;

    ```


    Here''s how you seed the random number generator:


    ```

    srand(time(0));

    ```'
