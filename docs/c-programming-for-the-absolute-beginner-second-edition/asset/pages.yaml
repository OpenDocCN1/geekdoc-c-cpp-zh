  md: '# # The SOFTWARE DEVELOPMENT CYCLE


    The software development cycle is the process that all software must go through
    on its journey to completion. As your skills as a programmer increase, these stages
    will become more and more natural to you. The flowchart in Figure 1.8 illustrates
    this cycle.


    ![](img/62e929c461e30706acae7c69369a00d9_29_0.png)


    Generally, to create a program, you follow these steps:


    +   1. Planning! What is the program meant to do? How should the code be structured?
    Who is the program for and what are their needs? These are all questions that
    you must answer before you begin writing code!

    2. Write code in the source code editor (Visual Studio or some other editor).
    You will do a little bit of this in the earlier section "Writing Your First Program,"
    and you will do a lot more by the time you finish this book.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# C++ Programming for the Absolute Beginner, Second Edition


    +   3. Compile the code. Imagine that you are an elf, and the computer is a dwarf.
    In order for the computer to understand your instructions, you must overcome a
    language barrier. You need a translator that can speak both Dwarven and Elven.
    In the computer world, this translator is a compiler. As we mentioned earlier,
    a compiler turns your language into machine code that your computer can read.
    However, this translation goes one way. The compiler cannot translate machine
    code into source code. If there are errors, you must go back to the code to fix
    them. For step-by-step instruction on compiling code using Visual Studio, refer
    to the earlier section "Using Visual Studio."


    +   4. Link the code. Linking the code is the process of bringing together all
    the files that make up the program together, the joining of many knights in order
    to defeat a mighty dragon! The brave knights, in this case, include your code,
    but also all libraries that you use, like the C++ Standard Library. If you get
    an error, you must return to Step 1 to fix the error. Visual Studio does the linking
    step automatically when you build your project.


    +   5. Test the program. You test the program to be sure it functions properly.
    You may ask why testing is necessary if you successfully passed the compile and
    linking stage. Obviously there are no errors, right? Well, some errors are more
    devious! Though your code may appear to work correctly, there can still be subtle
    problems. These are called logic errors! The bane of all programmers, much time
    is occupied hunting these down. It is vital that you thoroughly test your program
    to make sure everything works as you expect it to!


    +   6. Once your program makes it through these steps there is still more to do!
    Requirements change and your program may have to adapt. Maybe errors that were
    missed before be found later. Software development is a continuous process!


    # WORKING WITH TEXT


    Before the advent of graphics, text was the basis of all programs. Text-based
    adventure games and text-based bulletin board systems were our first programming
    experiences. Text is still a very important element of programming. In this section,
    you find out how to assemble and store text.


    Text is the simplest medium for displaying the output of programs. This book starts
    by using only text because text is sufficient to display the output of most programs.
    This approach also enables us to delay covering the complexities of graphics until
    the later chapters.


    The technical name for a piece of text in the computer world is string. A string
    is a sequence of characters; in general, we think of a character as a symbol that
    you can type from the keyboard, including spaces. For example, in the "Hello World\n"
    program, "Hello World\n" is a string.'
