    \n# Following the Sequence of Execution\n\nFollowing is the order in which tasks\
    \ are executed in any program:\n\n+   1. All global variables are created. Globals\
    \ are initialized and stored inside the runtime code at compile time.\n2. The\
    \ main function begins.\n3. Each line of code in the main function executes sequentially.\n\
    4. All local variables are destroyed and the main function exits.\n5. When the\
    \ program uploads, all global variables are destroyed.\n\nGlobal variables are\
    \ initialized before the main function is called because they are outside the\
    \ main function. Their scope is larger than the main function's scope.\n\nFrom\
    \ the main function, all other functions are called. It is the container for the\
    \ entire program (except for global variables). So, even though functions are\
    \ written outside the main function, they are, in a sense, contained within it.\n\
    \n# Passing Arguments to main\n\nWhen the operating system starts a program, the\
    \ system sometimes passes information to that program. For the kind of programs\
    \ that you are creating right now, only one kind of information can be passed:\
    \ command-line arguments. But in other programs, such as a Windows-based program,\
    \ many kinds of information can be passed."
