    an initializer list, the array will default to the number of elements in the initializer
    list. In the following line of code, char_array2 will automatically assume that
    the array is 6:


    ```

    char char_array2[] = (''d'', ''r'', ''a'', ''g'', ''o'', ''n'');

    ```


