  md: "As you can see, the proper way is to call the parent class’s constructor and\
    \ let it deal with\ninitializing its own private members.\n\nHere is the general\
    \ syntax for creating a derived class:\n\n```\nclass derived_class : scope_modifier\
    \ base_class\n```\n\nHere derived_class is the name of the derived class, and\
    \ base_class is the name of the base\nclass. scope_modifier can be public, private,\
    \ or protected; but for this book, you will just use\npublic. private can be very\
    \ useful in some very privileged situations, and protected should\nbe used.\n\n\
    # Accessing Members through Inheritance\n\nAlthough the rules for the member functions\
    \ of a derived class can access straight-\nforward, they are often difficult for\
    \ a beginner, and even advanced programmers at times.\nin this section, we attempt\
    \ to minimize the confusion and maximize your enjoyment (or at least\none of the\
    \ two).\n\nFirst of all, recall that there are two kinds of access members for\
    \ a class: public\nand private. There is actually a third kind of access specifier\
    \ called protected only\ncomes into play when inheritance is involved. Without\
    \ inheritance, it is exactly the same as\nprivate.\n\nThe member functions of\
    \ a derived class can access the following:\n\n+   * All global variables.\n*\
    \ The class’s own members.\n* All public and protected members of its base class.\n\
    \nSee, that’s not bad. If you are in doubt, just consult this list. A derived\
    \ class has almost\nmuch access to members as does a base class because the derived\
    \ class inherits most of the\nbase class’s functionality. The only items that\
    \ access are the base class’s\nprivate members.\n\nAs the preceding list implies,\
    \ a derived class can access all the public and protected members\nof its base\
    \ class. However, it cannot access the private members. Here is an example:\n\n\
    ```\nclass Base\n{\n    int private_int;\nprotected:\n    int getInt() { return\
    \ private_int; }\n```"
