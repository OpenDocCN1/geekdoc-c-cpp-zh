  md: '# ASSEMBLING STRINGS


    The computer interprets strings as "For Honor!!!" as a series of characters, occupying
    one letter or space (F is the first character, o is the second, and so on). Strings
    are always enclosed within double quotation marks. For example, "a", " " (space),
    "4" and "%%" are all strings consisting of one character.


    This might seem complex, creating strings is actually easy to do. The following
    are some examples of strings. As you can see, they are just a little bit of text
    surrounded by quotation marks.


    "For Honor!!!"

    "Pass me my sword."

    "Who put my staff on the wagon?"


    # DISPLAYING STRINGS WITH COUT


    Now that you know how to create a string, the first thing you are likely to want
    to do is display it to the screen. In this section, you learn multiple ways to
    do that.


    As mentioned in the dissection of the "Hello World" program, printing to the screen
    is not an innate part of C++. This capability is provided through the C++ Standard
    Library. In order to use it, you must do a few special things.


    First, you must include a reference to the relevant file at the top of your program.
    As we saw in the Hello World program, for displaying text to the screen, this
    file is iostream. Here is the syntax (structure) for this reference:


    ```

    #include <iostream>

    ```


    This provides access to the relevant parts of the C++ Standard Library, but that
    is not the end of the story. Everything in the library is in what''s called a
    namespace. This means every thing you use from library must be preceded by std::.
    For example, to use cout now, you would have to write std::cout. This can get
    tiresome, and it is often easier to bring the relevant terms out of the std namespace.
    As discussed earlier, you can bring terms out of a namespace with the following
    code:


    ```

    using std::cout;

    ```


    Now you are free to use cout without prefixing it with std::.


    Finally, to display a string to the screen, you use cout as follows:


    ```

    cout << "Hello World";

    ```'
