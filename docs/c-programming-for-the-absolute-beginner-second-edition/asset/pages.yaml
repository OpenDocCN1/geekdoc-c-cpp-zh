    # # STRUURING YOUR CODE

    WITH FUNCTIONS


    If you have been working through this book in its natural sequence, you have progressed
    far on your journey. Sit for a moment and let all the information sift through
    your brain; then get a cup of black coffee, settle into your favorite chair, and
    brace yourself. You''ve got an exciting trip ahead.


    In this chapter, you learn about the following:


    +   - Structuring your code with functions

    - Creating default arguments

    - Differentiating variable scope

    - The `main` function


    # ## DIVIDE AND CONQUER


    Imagine that you are the commander of the Roman Empire''s army, attacking the
    barbarian hordes in Germania. As any of your royal strategists will tell you,
    attacking your opponent''s entire army at once is not very strategic. It is much
    more cunning to splinter the army into sections and attack each section separately.
    Doing puts your army at a significant advantage and allows the might of the Roman
    Empire to grow even further.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'The same is true for programming in C++. If you have a massive application
    to design and are working on a time limit, the easiest way to tackle the problem
    is to divide it into several programming tasks and then handle each task separately.
    As any mathematician will tell you, divide the problem into a group of problems
    that have already been solved, and you are done. This is the idea behind using
    functions.


    Functions enable programmers to divide their code into many manageable pieces.
    Also, using functions, rather than repeating code numerous times, you can write
    it once and then use it again and again. With functions, instead of having to
    figure out a solution every time you encounter a problem, you allow a function
    to do job for you. Then you can use the solution wherever it is needed.


    For example, you might write a function called getWindowSize that calculates the
    size of a certain window. Whenever you need to know the size of a particular window,
    you just allow that function to calculate the size. Keep in mind that the function
    and the code asking perform a task must communicate with each other. In the current
    example, the getWindowSize function needs to know which window is in question,
    and the function has to send the code the size of that window.


    Before proceeding, here are some definitions we use as we continue through this
    chapter (you might not understand all of them now, but you will by the time you
    finish this chapter):


    +   - Block of code (or code block). Any code enclosed within curly braces.

    - Function. A segment of code that performs a specific task.

    - Calling procedure. Any piece of code that tells a function to execute its code.

    - Calling a function. Using a function''s name to invoke its code.

    - Arguments/Parameters. Pieces of information (data) that the calling procedure
    sends to functions.

    - Argument list/Parameter list. A list of arguments that must be passed in order
    to call a certain function.

    - Return value. Any value that a function returns to the calling procedure. Note
    that a given function can have only one return value, as illustrated in Figure
    4.1.'
