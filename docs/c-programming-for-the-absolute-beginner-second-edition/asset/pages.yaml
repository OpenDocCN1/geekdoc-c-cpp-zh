  md: '# C++ Programming for the Absolute Beginner, Second Edition


    When the designers of the C++ language were creating the standard library, they
    set these requirements:


    +   - It must be convenient, efficient, useful, and safe for all users.

    - Users should not have to reprogram the library in order to find it useful.

    - The library must provide a simple interface.

    - The library must be complete in what it tries to do.

    - The library must blend well with built-in data types and keywords.


    Knowing these requirements, the designers then constructed the library. In our
    opinion, we succeeded in meeting every one of the requirements.


    The standard library is organized into a few of header files, each serving a different
    purpose. They can be divided into ten categories: containers, general utilities,
    iterators, algorithms, diagnostics, strings, streams, locales, language support,
    and numerics.


    In this section, we discuss a few of the containers and the string that has been
    used since Chapter 1, "Starting the Journey." Containers are types that store
    a set of values. Strings (as you know) store text.


    Because templates are used specifically to make code more general, the standard
    library is a rich source for examples of how you can use templates.


    # Using Strings


    All the C++ standard string facilities are included in <string>. As we mentioned
    previously in this chapter, string is a synonym for basic_string<char>. basic_string
    is a class template that can accept any kind of character. For example, you might
    create a class to store Egyptian characters called E_char. Then you can create
    a string object using Egyptian characters like this:


    ```

    basic_string<char> egyptian;

    ```


    All characters are used as a parameter for basic_string must have their properties
    defined by another class template called char_traits. The basic declaration of
    char_traits is as follows:


    ```

    template<class Ch> struct char_traits();

    ```


    A struct is exactly like a class, except that all its members are public by default
    rather than private. Strangely enough, this template class is never used. Every
    kind of character has a specialization for this template, including this example:'
