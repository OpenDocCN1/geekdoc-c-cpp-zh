  md: 'argument_list can be blank if there are no arguments:


    ```

    return_type function_name();

    ```


    Otherwise, the argument list is a list of variable declarations separated by commas:

    return_type function_name(arg1_type arg1_name, arg2_type arg2_name, ...);


    Notice that each argument declaration is just a simple variable declaration (you
    might recognize this syntax from the material in Chapter 2, "Descending Deeper
    into Variables").


    # Example–the add Function


    The idea behind the add function is relatively straightforward—take two numbers,
    add them, and return the result. Although we use integers for this example, any
    numerical data type will work.


    To write the function declaration, you need three pieces of information:


    +   * The function name

    * The function return type

    * The function argument list


    The function name can be any valid identifier (refer to Chapter 2 for more on
    identifiers). However, a concise name that describes the function''s purpose makes
    the most sense. In this case, deciding on a name is relatively easy. It is named
    add.


    The function return type needs to be an integer. You use the integer type (int)
    because the function returns a number.


    The last piece of information needed is the function argument list. Because the
    function takes two arguments, you must write two variable declarations, which
    we arbitrarily refer to as a and b. Both a and b must be integers because they
    represent the two numbers that you will add. Here is the resulting argument list:


    ```

    (int a, int b);

    ```


    Following the general syntax, you can put the three pieces of information together
    to form the add(\() function declaration:


    ```

    int add(int a, int b);

    ```


    Before you continue creating this function, you need to know how to define a function.'
