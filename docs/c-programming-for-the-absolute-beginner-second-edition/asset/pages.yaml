  md: '# C++ Programming for the Absolute Beginner, Second Edition


    When you call a method of a class, the computer first checks that class, then
    its base class, then the base''s base, and so on up the chain until it finds the
    method.


    A base class can have more than one derived class under. In this way, you can
    create tree-like structures of inheritance. These structures are called class
    hierarchies. The MFC (Microsoft Foundation Class) is an example of a large, advanced
    class hierarchy. If you create advanced Windows applications, you will learn how
    to use it.


    ![](img/62e929c461e30706acae7c69369a00d9_202_0.png)


    A class hierarchy is not incredibly complex. The main thing is that siblings (classes
    with the same base class) are not affected by each other. No class has any of
    its siblings'' members. Figure 7.2 shows a class hierarchy for vehicles.


    The following code shows how this hierarchical structure looks in C++:


    ```

    class Vehicle {};

    class LandVehicle : public Vehicle {};

    class WaterVehicle : public Vehicle {};

    class Car : public LandVehicle {};

    class Bike : public LandVehicle {};

    class Boat : public WaterVehicle {};

    class Submarine : public WaterVehicle {};

    ```


    You can divide this fancy class hierarchy into a bunch of inheritance chains,
    as illustrated in Figure 7.3.


    ![](img/62e929c461e30706acae7c69369a00d9_202_1.png)'
