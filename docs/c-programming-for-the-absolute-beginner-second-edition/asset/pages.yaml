    1. What is the size of the string "Hello World" What is the length of the array
    name s?


    char s[] = "Hello World";


    ANSWER:


    The size of the string "Hello World" is 12 bytes. This is because each of the
    alpha characters requires 1 byte, plus one space and the terminating character
    at the end of the string, resulting in an array length of 12. Remember, though,
    that the array indexes extend only from 0 to 11.


    2. List five reasons to use pointers.


    ANSWER:


    Possible uses include


    +   - Pointers give you access to specific indexes in an array.

    - Pointers can enable you to pass a reference to a data value, instead of passing
    the data itself.

    - Pointers are the basis for using dynamic memory.

    - Pointers are the basis for binary file access.

    - Pointers are the basis for iterators.

    - Pointers are fun!


