  md: "Now that everything is initialized, it is time to enter the main loop. This\
    \ loop has the following structure:\n\n```\nwhile(LoopGDK())\n{\n  ...\n}}\n```\n\
    \nThe call to LoopGDK() performs all internal operations needed and only returns\
    \ 0 when the program is ready to quit. All of the code included in this loop is\
    \ executed once per frame.\n\nThe first thing done in the main loop is to loop\
    \ through all of the asteroid sprites and move them down. This is accomplished\
    \ with the dbMoveSprite() function. Also, the dbPlaySprite() function is used\
    \ to automatically cycle through all of the animation frames at a rate of 60 frames\
    \ per second. When a particular asteroid sprite has gone past the bottom of the\
    \ screen, its position is reset to a random location.\n\nEvery frame, dbEscapeKey()\
    \ is used to check if the escape key has been pressed. If it has, we break out\
    \ of the main loop, effectively ending the program.\n\nFinally, dbSync() is called\
    \ to update the screen with all the changes performed previously by the main loop.\n\
    \nWhen the program ends, either by the user pressing the escape key or the window\
    \ being closed, we enter the cleanup phase. Here, the resources for all of the\
    \ sprites are freed with a simple call to dbDeleteSprite(). Finally, the loaded\
    \ image file is unloaded with the call to dbDeleteImage().\n\nTable 11.1 summarizes\
    \ all of the Dark GDK functions that we'll be using in this chapter."
