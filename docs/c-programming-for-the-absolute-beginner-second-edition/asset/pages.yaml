    # # MAKING CHOICES WITH

    CONTROL STATEMENTS


    In earlier chapters, you created programs that execute from start to finish. Each
    statement is executed only once, and every statement must be executed. However,
    this linearity is acceptable only for basic programming. To create advanced, dynamic
    programs, you must master using control statements, which enable programs to jump
    to a certain piece of code or to execute a section of code more than once. In
    this chapter, you learn about the following:


    +   - Selection statements

    - Boolean logic and operators

    - Iteration statements

    - Branching statements

    - Random numbers


    CHOOSING CODE WITH SELECTION STATEMENTS

    Often, people base their decisions on certain conditions. For example, a person
    might go to a doctor if he feels sick. The decision, whether or not to go to the
    doctor, is based on a certain condition: feeling sick. The same is true when using
    programs. You can design your program so that it selects which code to execute
    based on certain conditions.'
