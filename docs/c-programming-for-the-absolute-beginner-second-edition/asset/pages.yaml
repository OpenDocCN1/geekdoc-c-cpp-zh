    # The Less-Than and Greater-Than Operators


    The less-than (<) and greater-than (>) signs in computers about the same thing
    they do in fourth-grade math. For example, 3 < 4 evaluates to true because 3 is
    less than 4. The same is the case with the greater-than sign: 4 > 3 is true because
    4 is greater than 3. Check out the following variables and what they evaluate
    to:


    ```

    int elves = 4;

    int dwarves = 5;

    if (elves<dwarves) //true

    if (dwarves < elves) //false

    if (dwarves > (2 / 3)) //true

    if (elves < (23 * 117)) //true

    ```


    The less-than and greater-than operators are binary operators and left-associative.
    For example, the following code might not do what you think:


    ```

    if (0 < x << 99)

    ```


    If you remember your math really well, you might think that this tests whether
    x is between 0 and 99. However, this is not what happens. First, x is compared
    to 0. Whatever this comparison evaluates to (true or false) is then compared to
    99. Because both true (1) and false (0) are less than 99, this condition will
    always evaluate to true, regardless of the value of x.


    # Merging with the Equivalence Operator


    You might also recall experience with the less-than-equal-to and the greater-than-equal-to
    signs in math. In C++, they are written differently, but they still exist. Instead
    of a line under the less-than or greater-than, you put an equal sign after it.
    Thus, the greater-than-or operator is >=, and the less-than-equal-to operator
    is <=.


    These operators work exactly as the less-than and greater-than operators work,
    except if the two things being compared are equal, the operator also returns true.
    Here are some examples:


    ```

    if (5 <= 5) //true

    if (6 >= 7) //false

    if (1 <= 8) //true

    ```'
