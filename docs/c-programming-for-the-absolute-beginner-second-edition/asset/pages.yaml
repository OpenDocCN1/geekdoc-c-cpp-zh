    # The Logical or Operator


    The logical operator (||) is a binary operator. It will return true if one of
    the operands evaluates to true. Both sides of the statement must first be evaluated
    to a Boolean form (true or false) before the operator can be evaluated.


    Table 3.1 shows the example of a truth table (a table in which all the possible
    values for the operands are listed, along with the resulting value which the operator
    evaluates). The first column states the value of the first operand (called A for
    convenience), the second column states the value of the second operand (called
    B), and the third column states the value of A || B.


    | Table 3.1 TRUTH TABLE FOR THE OR OPERATOR |

    | Value of A | Value of B | Value of A||B |

    | --- | --- | --- |

    | True | True | True |

    | True | False | True |

    | False | True | False |

    | False | False | False |


    Table 3.1 includes every possible combination of the operand''s values. Here are
    examples of conditions with what statements and what they evaluate to:


    ```

    if (true || false) //true

    if ((2>3) || false) //false

    if ((3*5) < 90 || (3<5)) //true

    ```


    The operator is left-associative as well. However, having more than one operator
    in one statement is not always true, as it is for the less-than and greater-than
    operators. If any of the operands are true, the entire condition will be true.


    This means that the computer executing your code can short-circuit. Short-circuiting
    is when a computer realizes it doesn''t have to execute the rest of a statement.
    For example, if the program comes across a condition with an or operand in and
    the first operand is true, the program does not have to evaluate the second operand.
    It skips the second one because it knows that the whole condition will evaluate
    to true, regardless of the second operand.'
