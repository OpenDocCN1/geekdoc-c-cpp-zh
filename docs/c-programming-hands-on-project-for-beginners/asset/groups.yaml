    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ Interface\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            InterfaceA a = new ClassA();\n            a.MyNumber =\
    \ 5;\n            a.InterfaceMethod();\n        }\n    }\n\n    interface IShape\n\
    \    {\n        int MyNumber\n        {\n            get;\n            set;\n\
    \        }\n\n        void InterfaceMethod();\n    }\n\n    class ClassA : IShape\n\
    \    {\n        private int myNumber;\n        public int MyNumber\n        {\n\
    \            get\n            {\n                return myNumber;\n          \
    \  }\n            set\n            {\n                if (value < 0)\n       \
    \             myNumber = 0;\n                else\n                    myNumber\
    \ = value;\n            }\n        }\n        public void InterfaceMethod()\n\
    \        {\n            Console.WriteLine(\"The number is {0}\", MyNumber);\n\
    \        }\n    }\n}\n```\n\n# Access Modifiers Revisited\n\nNow that we have\
