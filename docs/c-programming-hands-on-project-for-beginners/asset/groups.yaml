    在我们熟悉了字符串、数组和列表之后，让我们讨论一下 C# 中的一个重要概念。C# 中的所有数据类型都可以分类为值类型或引用类型。本章讨论的数据类型都是值类型。


    值类型是存储其数据的变量。当我们编写


    ```

