    \ 2010 are assigned to the base constructor. Behind the scene, these values are\
    \ assigned to the fields name, memberID and membersSince in the base class respectively.\n\
    \nAfter executing the base constructor, the child constructor will be executed.\
    \ The string \"Special Rate\" is assigned to remarks and displayed on the screen.\n\
    \nWhen you run the code, you will get the following output\n\n```\nParent Constructor\
    \ with 3 parameters\nChild Constructor with 4 parameters\nRemarks = Special Rate\n\
    ```\n\nNow that we have created the constructors for our child class, let us move\
    \ on to create\na method to calculate the annual fee of a normal member. The code\
    \ is simply\n\n```csharp\npublic void CalculateAnnualFee()\n{\n    annualFee =\
    \ 100 + 12*30;\n}\n```\n\nWhen-ever we write \"annualFee\" in the code above,\
    \ we are accessing the protected field annualFee in the parent class. Recall that\
    \ a child class has access to all public and protected fields in its parent class?\
    \ Hence, the child class can use this field as if it is its own. The child class\
    \ does not need to create an instance of the parent class in order to access its\
    \ protected fields.\n\nThat's all for our child class NormalMember. The class\
    \ has the following contents:\n\n### Fields\nInherited from parent class:\n- protected\
    \ int annualFee\n\n### Methods\nDeclared in child class:\n- public void CalculateAnnualFee()\n\
    \n### Constructors\n- public NormalMember()\n- public NormalMember(string remarks,\
    \ string name, int memberID, int memberSince)\n\nNext, let us write another class\
