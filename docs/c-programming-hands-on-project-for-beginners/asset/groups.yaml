    ```\n\n由于抽象方法没有体，我们用分号（;）结束声明。要在派生类中实现抽象方法，我们使用 `override` 关键字，如下：\n\n```csharp\n\
    class Class\n{\n    public override void AbstractMethod();\n}\n```\n\n下面的代码展示了一个抽象类的示例。\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace Abstract\n{\n \
    \   class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            AbstractClass a = new AbstractClass();\n            a.PrintMessage();\n\
    \        }\n    }\n\n    abstract class AbstractClass\n    {\n        protected\
    \ string message = \"Hello C!\";\n        public abstract void PrintMessage();\n\
    \    }\n\n    class AbstractClass : AbstractClass // 注意：此处原文代码类名冲突，保持原样翻译\n  \
    \  {\n        public override void PrintMessage()\n        {\n            Console.WriteLine(message);\n\
    \        }\n    }\n}\n```\n\n## Interfaces\n\n接下来，让我们来看接口。接口与抽象类的相似之处在于它们不能被实例化。然而，接口比抽象类更具概念性。它们不能包含字段，但可以包含属性。\n\
    \n抽象类和接口之间的关键区别之一是，类只能继承一个抽象类，但可以实现多个接口。我们 own不会展示多个接口的示例，因为那超出了本书的范围。\n\n接口的名称通常以字母\
    \ `I` 开头。接口中的所有属性和方法都是公共的，因此不需要为它们添加任何修饰符。\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
    \nnamespace Interface\n{\n    class Program\n    {\n        static void Main(string[]\
