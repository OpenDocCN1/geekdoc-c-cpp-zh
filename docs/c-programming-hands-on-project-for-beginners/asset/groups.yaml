  mdcn: "\n\n## ToString() 方法\n\n最后，在进入下一个节之前，我们需要再写一个方法 - `ToString()` 方法。\n\n`ToString()`\
    \ 方法是一个特殊的方法，它返回一个表示当前类的字符串。在 C# 中，所有类都带有一个预定义的 `ToString()` 方法。然而，按照惯例（这是我们被我们的），我们会重写这个方法。重写此方法简单意味着编写我们自己的方法版本。\n\
    \n通常，我们编写的 `ToString()` 方法会显示类的字段和属性的值。将以下代码添加到 `staff` 类中：\n\n```csharp\npublic\
    \ override string ToString()\n{\n    return \"Name of Staff \" + nameOfStaff +\
    \ \", hourlyRate = \" + hourlyRate + \", \" + hWorked;\n}\n```\n\n如你所见，`ToString()`\
    \ 方法返回一个字符串类型。它包含的字符串包含了 staff 类的信息。方法声明中的 `override` 关键字表示此方法重写了默认方法。我们将在下一章讨论更多关于\
    \ `override` 关键字。\n\n## 构造函数\n\n现在，让我们来看构造函数。\n\n构造函数是一个特殊的方法，用于从类模板“构造”对象。每当我们从类中创建对象时，它是第一个被调的方法。构造函数通常用于初始化类的字段。\n\
    \n构造函数的名称始终与类相同（在我们的案例中为 `Staff`），并且不返回任何值。声明构造函数时不需要使用 `void` 关键字。\n\n将以下几行添加到我们的\
    \ `Staff` 类。\n\n```csharp\npublic Staff(string name)\n{\n    nameOfStaff = name;\n\
    \    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"-\");\n\
    }\n```\n\n在这个构造函数中，我们首先用传递构造函数的字符串（`name`）初始化字段 `nameOfStaff`。然后我们在屏幕上显示 `nameOfStaff`\
    \ 的值，并用一系列连字符对其加上下划线。\n\n与其他方法一样，只要签名不同，我们就可以有多个构造函数。我们可以为类类添加另一个构造函数。\n\n```csharp\n\
    public Staff(string firstName, string lastName)\n{\n    nameOfStaff = firstName\
    \ + \" \" + lastName;\n    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"\
    --------------------\");\n}\n```\n\n这个构造函数有两个参数 - `firstName` 和 `lastName`。第一行将两个字符串连接起来并将结果字符串赋值给\
    \ `nameOfStaff`。接下来两行在屏幕上打印 `nameOfStaff` 并用一系列连字符对其加上下划线。\n\n声明构造函数是可选的。如果你不声明自己的构造函数，C#\
    \ 会自动为你创建一个。默认构造函数简单地将类中的所有字段初始化为默认值，通常对于数值字段为 0，对于字符串字段为空字符串。\n\n## 实例化对象\n\n\
    现在我们已经知道如何创建类，让我们看看如何利用该类来创建对象。这个过程被称为实例化对象。对象也被称为实例。\n\n回顾一下，我们的 `Staff` 类具有以下组件：\n\
    \n### 字段\n\n```csharp\nprivate const int hourlyRate\nprivate string nameOfStaff\n\
    private int hWorked\n```\n\n### 属性\n\n```csharp\npublic int HoursWorked\n```\n\
    \n### 方法\n\n```csharp\npublic void PrintMessage()\npublic int CalculatePay()\n\
    public int CalculatePay(int bonus, int allowance)\npublic override string toString()\n\
    ```\n\n### 构造函数\n\n```csharp\npublic Staff(string name)\npublic Staff(string firstName,\
    \ string lastName)\n```\n\n我们将在 `Program` 类的 `Main()` 方法中实例化一个 `Staff` 对象。\n\n\
    实例化对象的语法是：\n\n`ClassName objectName = new ClassName(arguments);`\n\n将以下几行添加到 `Program`\
    \ 类的大括号内部。\n\n`int pay;`\n\n```csharp\nstaff1 = new Staff(\"Peter\");\nstaff1.HoursWorked\
    \ = 160;\npay = staff1.CalculatePay(1000, 400);\nConsole.WriteLine(\"Pay = {0}\"\
    , pay);\n```\n\n在这里，我们使用第一个构造函数（带有一个参数）来创建我们的 `staff1` 对象。\n\n一旦创建了对象，我们就可以使用对象名称后的点运算符（`.`）访问\
    \ `Staff` 类中的任何公共字段、属性或方法。注意，我们需要在这里使用点运算符，因为我们正尝试从 `Program` 类访问 `Staff` 类的成员。当我们想要从另一个类访问字段、属性或方法时，点运算符是必须的。\n\
    \n如果你正在访问同一个类的成员，则不需要使用点运算符。一个例子是我们之前从 `CalculatePay()` 方法中调用 `PrintMessage()`\
    \ 方法。我们没有使用点运算符，因为这两个方法都来自同一个类。\n\n创建我们的 `staff1` 对象后，下一行显示了我们如何使用公共 `EmployeeType`\
    \ 属性来给 `worked` 字段赋值。\n\n`staff1.HoursWorked = 160;`\n\n如果我们尝试通过编写\n\n`staff1.hworked\
    \ = 160;`\n\n直接访问私有字段 `hworked`，我们将得到一个错误，因为 `hworked` 是私有字段，因此只能在 `Staff` 类内部访问。\n\
    \n要调用 `CalculatePay()` 方法，我们写：\n\n```csharp\nstaff1.CalculatePay(1000, 408);\n\
    ```\n\n由于我们在括号内有数字 1000 和 400，我们正在使用第二个 `CalculatePay()` 方法。我们把值 1000 和 400 分别传递给参数\
    \ `bonus` 和 `allowance`。我们传递的值被称为参数（arguments）。程序随后使用这些值。\n\n（注：此处原文存在大量重复的句子，翻译已根据逻辑合并并保持了核心含义的连贯）\n\
    \n## Static 关键字\n\n我们已经涵盖了一些非常好的概念。在本节中，我们将看看另一个在创建对象时有时使用的关键字。\n\n以前，我们查看了如何创建\
    \ `staff1`、`staff2` 和 `staff3` 对象。然而，某些类或成员不需要创建对象就可以访问。这些被称为静态类或成员，并使用 `static`\
    \ 关键字声明。\n\n考虑以下类：\n\n```csharp\nclass MyClass\n{\n    // 非静态成员\n    public string\
    \ message = \"Hello World\";\n    public string Name { get; set; }\n    public\
    \ void DisplayName()\n    {\n        Console.WriteLine(\"Name = {0}\", Name);\n\
    \    }\n    // 静态成员\n    public static string greetings = \"Good morning\";\n\
    \    public static int Age { get; set; }\n    public static void DisplayAge()\n\
    \    {\n        Console.WriteLine(\"Age = {0}\", Age);\n    }\n}\n```\n\nMyClass\
    \ 包含一个非静态字段 `message`、一个非静态属性 `Name` 和一个非静态方法 `DisplayName()`（第 4-9 行）。\n\n它还包含一个静态字段\
    \ `greetings`、一个静态属性 `Age` 和一个静态方法 `DisplayAge()`（第 12-17 行）。\n\n要从另一个类访问 `MyClass`\
    \ 的静态成员，我们需要像以前一样实例化对象：\n\n```csharp\nMyClass classA = new MyClass();\nConsole.WriteLine(classA.message);\n\
    classA.Name = \"Jamie\";\nclassA.DisplayAge();\n```\n\n然而，要访问静态成员，我们不需要创建任何对象。只需使用类名访问它们，如下所示：\n\
    \n```csharp\nConsole.WriteLine(MyClass.greetings);\nMyClass.Age = 39;\nMyClass.DisplayAge();\n\
    ```\n\n如果你运行上面的代码，将得到以下输出：\n\n```\nHello World\nName = Jamie\nGood morning\nAge\
    \ = 39\n```\n\n除了拥有静态方法、字段、属性和构造函数，我们还可以拥有静态类。静态类只能包含静态成员。示例所示：\n\n```csharp\n\
    static class MyStaticClass\n{\n    public static int a = 0;\n    public static\
    \ int B{get; set;}\n}\n```\n\n"
