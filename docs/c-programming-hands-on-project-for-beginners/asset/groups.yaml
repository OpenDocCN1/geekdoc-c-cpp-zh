    \ int annualFee;\n    private string name;\n    private int memberID;\n    private\
    \ int memberSince;\n}\n```\n\nMember 包含一个受保护字段和三个私有字段。受保护字段在声明它的类以及任何派自它的类中都是可的。我们很快就会讨论派生类。\n\
