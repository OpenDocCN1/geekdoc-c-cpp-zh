    # # Chapter 3: The World of Variables and Operators


    Now that you are familiar with VSC and have written your first program, Let''s
    get down to the real stuff. In this chapter, you''ll learn all about variables
    and operators. Specifically, you''ll learn what variables are and how to name,
    declare, and initialize them. You''ll also learn about the common operations that
    we can perform on them.


    # ## What are variables?


    Variables are names given to data that we need to store and manipulate in programs.
    For instance, suppose your program needs to store the age of a user. To do that,
    we can name that data age and declare the variable age using the following statement:


    ```

    int age;

    ```


    The declaration statement first states the type of the variable, followed by its
    name. The data type of a variable refers to the type of data that the variable
    will store (such as whether it''s a number or a piece of text). In our example,
    the data type is int, which refers to integers. The name of your variable is age.


    After you declare the variable age, your program will allocate a certain area
    of your computer''s storage space to store this data. You can then access and
    modify the data by referring to it by its name, age.


    # ## Data Types in C#


    There are a number of commonly used data types in C#.


    # ## int


    int stands for integer (i.e. numbers with no decimal or fractional parts) and
    holds numbers from -2,147,483,648 to 2,147,483,647. Examples include 15, 407,
    -908, 6150 etc.


    # ## byte


    byte also refers to integer numbers, but has a narrower range from 0 to 255.'
