    An abstract class is a special type of class that is created strictly to a base
    class for other classes to derive from. They cannot be instantiated. In other
    words, if FourWheelVehicles is an abstract class, the statement


    ```

    FourWheelVehicle myVeh = new FourWheelVehicle();

    ```


    will give you an error as you cannot create an object of an abstract class.


    Abstract classes may have fields, properties and methods just like any other classes.
    However, they cannot have static members. In addition, abstract classes can have
    a special type of method known as abstract methods. Abstract methods are methods
    that have no body and MUST be implemented in the derived class. They can only
    exist in abstract classes. In a way, an abstract method is like a contract. If
    you want to ensure that any class that inherits its class implements a certain
    method, you can declare the class as an abstract class and the method as an abstract
    method.


    To declare an abstract class, simply add the abstract keyword before the keyword
    class like this:


    ```

    abstract class MyClass

    {

    }

    ```


    To declare an abstract method inside an abstract class, add the abstract keyword
    before the return type, like this:


    ```

    public abstract void MyAbstractMethod();

    ```


    As abstract methods have no body, we end the declaration with a semi-colon (;).


    To implement an abstract method in the derived class, we use the override keyword,
    like this.


    ```

    public override void MyAbstractMethod()

    {\}

    ```


    The code below shows an example of an abstract class.


