    \        {\n            Console.WriteLine(\"The number is {0}\", MyNumber);\n\
    \        }\n    }\n}\n```\n\n# 复习访问修饰符\n\n现在我们已经涵盖了与继承相关的主题，让我们再次查看面向对象编程中访问修饰符的概念。之前，我们了解到访问修饰符就像守门员。它控制谁可以访问特定的字段、属性或方法。C#\
    \ 带有 4 种访问修饰符：private,\n"
