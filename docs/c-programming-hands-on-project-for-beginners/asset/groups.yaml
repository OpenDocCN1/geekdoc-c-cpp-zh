    ## Split()


    The Split() method splits a string into substrings based on an array of user-defined

    separators. After splitting the string, the Split() method returns an array that

    contains the resulting substrings.


    The Split() method requires two arguments - an array of strings that act as separators
    and a second argument to specify whether you want to remove empty strings from
    the result.


    Suppose you want to split the string "Peter, John; Andy, ,David" into substrings,
    you can do it as follows (Line numbers are added for reference):


    ```

    1 string [] separator = (", ", ";");

    2 string names = "Peter, John; Andy, ,David";

    3 string [] substrings = names.Split(separator,

    StringSplitOptions.None);

    ```


    On Line 1, we assign an array of two strings to act as separators. The first string
    is a comma followed by a space and the second is a semi-colon by a space.


    On Line 2, we assign the we want to split to the names variable. On Line 3, we
    use the names variable to call the Split() method and assign its result to the
    substrings array.


    The result of the code above is the following array


    ```

    {"Peter", "John", "Andy", "", "David"}

    ```


    This array contains an empty string as there is a space between the comma after
    "Andy" and the comma before "David" in the original string. If you want to remove
    the empty string from the result, you have to change Line 3 to


    ```

    string [] substrings = names.Split(separator,

    StringSplitOptions.RemoveEmptyEntries);

    ```


    The substrings array becomes


    ```

    {"Peter", "John", "Andy", "David"}

