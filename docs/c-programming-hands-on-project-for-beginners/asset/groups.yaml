  - "[PAGE 62]\n\n# # Chapter 7: Object-Oriented Programming Part 1\n\nWe have covered\
    \ a fair bit so far. In the next two chapters, we are going to look at another\
    \ important concept in programming – the concept of object-oriented programming.\n\
    \nIn this chapter, we'll learn what object-oriented programming is and how to\
    \ write our own classes and create objects from them. In addition, we'll also\
    \ discuss the concept of fields, properties, constructors and methods.\n\n# #\
    \ What is Object-Oriented Programming?\n\nSimply stated, object-oriented programming\
    \ is an approach to programming that breaks a programming problem into objects\
    \ that interact with each other.\n\nObjects are created from templates known as\
    \ classes. You can think of a class as the blueprint of a building. An object\
    \ is the actual \"building\" that we build based on the blueprint.\n\n# # Writing\
    \ our own class\n\nTo write our own class, we use the class keyword, following\
    \ by the name of the class.\n\nFor instance, to create a Staff class, we write\n\
    \n```\nclass Staff {\n    //Contents of the class\n    //including fields, properties\
    \ and methods\n}\n```\n\nIt is common practice to use PascalCasing when naming\
    \ our classes. PascalCasing refers to practice capitalizing the first letter of\
    \ each word, including the first word (e.g. ThisAClassName). This is the convention\
    \ that we'll be following in the book.\n\nThe content of the class is enclosed\
    \ within the pair of curly braces that follow the class name. Contents of a class\
    \ include constructors, destructors, constants, fields, methods, properties, indexers,\
    \ operators, delegates, interfaces, structs and other classes."
  - '[PAGE 63]


    We''ll cover some of the more common elements of a class in this chapter, namely
    fields, methods, properties and constructors.


    To understand what these are, let''s build a class from scratch.


    First, create a new Console Application project in Visual Studio Community and
    name this project "ClassDemo".


    The code that is automatically generated for you. Notice that inside the ClassDemo
    namespace; VSC has already created a class Program for you? Inside the Program
    class, we have the Main() method.


    By default, the Main() method (which is the starting point for C# applications)
    is put into the Program class created by VSC. If we want, we can change the name
    of the Program class to something else, but the Main() method must be called Main().
    The Main() method must be present in all C# programs.


    In this chapter, we are going to add a second class to the ClassDemo namespace.
    We''ll call this new class Staff and add fields, properties and methods to the
    class. The complete code for this chapter can be downloaded at http://www.learncodingfast.com/csharp.


    Let''s first declare the class. Add the following code just before the line class
    Program in our auto-generated code.


    ```

    class Staff

    {

    }

    ```


    We now have two classes in our project: Staff and Program.


    # Fields


    Inside the staff class, add the following lines:


    ```

    private string nameOfStaff;

    private const int hourlyRate = 30;

    private int hworked;

    ```


    Here, we declare one string variable (nameSortStaff) and two variables (hourlyRate
    and hworked). These variables are known as fields of the class. A field


    * Note'
  - '[PAGE 64]


    is simply a variable that is declared inside a class. Like any other variables,
    they are used to store data.


    Notice that there is a word private in front of each declaration statement? This
    is known as an access modifier. Access modifiers are gate keepers, who has access
    to that field (i.e. who can read and modify the value of that field).


    A field can either be private, public, protected or internal. In our case, we
    declare the three fields as private. This means they can only be accessed from
    within the Staff class itself.


    There are two reasons why we do not want the three fields to be accessible outside
    the class.


    The first reason is that there is no need for other classes to know about those
    fields. In our case, the field hourlyRate is only needed within the Staff class.
    We have a method inside the Staff class that uses the hourlyRate to calculate
    the monthly salary of an employee. Other classes do not use the hourlyRate at
    all. Hence, it is appropriate to declare hourlyRate as private so as to hide this
    field from other classes.


    This is known as encapsulation. Encapsulation enables an object to hide data and
    behaviour from other classes that do not need to know about them. This makes it
    easier for us to make changes to our code in future if necessary. We can safely
    change the value of hourlyRate inside Staff class without affecting other classes.


    The second reason for declaring a field as private is that we do not want other
    classes to freely modify them. This helps to prevent the fields from being corrupted.


    We''ll talk more about access modifiers in the next chapter.


    In addition to the private keyword, we also added the const keyword when we declared
    the hourlyRate field.


    ```

    private const int hourlyRate = 30;

    ```


    The const keyword indicates that the value cannot be changed after it is created.
    Any variable that is declared as const must be initialized at the point of the
    declaration. In our example, we initialized hourlyRate to 30. This value cannot
    be changed anywhere else in the code.'
- md: "\n# Properties\n\nNext, let us look at properties.\n\nA property is commonly\
    \ used to provide access to a private field in cases where the field is needed\
    \ by other classes. This may sound like a contradiction. Earlier, we mentioned\
    \ that we use private fields so that other classes do not have access to them.\
    \ If that is the case, why are we allowing access to them via properties?\n\n\
    One of the main reasons is that using properties gives us greater control over\
    \ what rights other classes have when assessing these private fields. We'll see\
    \ how to do that later.\n\nNow for, let us first learn how to declare a property.\n\
    \nAdd the following lines of code to our Staff class, just after the line `private\
    \ int hworked;`:\n\n```csharp\npublic int Hworked\n{\n    get\n    {\n       \
    \ return hworked;\n    }\n    set\n    {\n        if (value > 0)\n           \
    \ hworked = value;\n        else\n            hworked = 0;\n    }\n}\n```\n\n\
    We declared our property as\n\n```csharp\npublic int Hworked\n{}\n```\n\nThe access\
    \ modifier is public as we want other classes to have access to this property.\n\
    \nThe data type is int because this property is used to provide access to the\
    \ private int field `hworked`. hworked is known as the backing field of the property.\n\
    \nThe name of the property is `Hourworked`. We normally use PascalCasing for property\
    \ names.\n\nA property contains two special methods known as accessors. The first\
    \ accessor is a getter and the second is a setter.\n\nThe basic getter simply\
    \ returns the value of the private field. Hence, we write\n\n```csharp\n{\n  return\
    \ hworked;\n}\n```\n\nwhere `hworked` is a keyword and `hworked` is the name of\
    \ the backing field.\n\nThe setter sets the value of the private field. We write\n\
    \n```csharp\n{\n  if (value > 0)\n    hworked = value;\n  else\n    hworked =\
    \ 0;\n}\n```\n\n`value` is a keyword when used inside the assignment statement\
    \ when users use the property to set the value of the private field. We'll learn\
    \ how to do that later.\n\nInside the setter, we did a simple check using an `if`\
    \ statement. We checked if `value` is more than zero. If it is, we assign it to\
    \ `hworked`. Else, we set `hworked` to zero. This setter demonstrates how we can\
    \ use properties to control what values can be assigned to our private field.\n\
    \nBy default, getter and setter have the same access level as the property itself\
    \ (public in this case). Hence, we do not need to specify them. However, if you\
    \ do not want the setter to have the same access level as the property, you can\
    \ declare the setter as private so that other classes cannot modify your private\
    \ field:\n\n```csharp\nprivate set\n{\n```\n\nThe property is then a read-only\
    \ property outside the Staff class. Its value can only be set within the Staff\
    \ class itself.\n\n# Auto-implemented Properties\n\nNote that in cases where no\
    \ additional logic is required in the getter and setter, C# provides us with a\
    \ shorthand to declare the property. This is known as an auto-implemented property.\n\
    \nTo declare an auto-implemented property, we write\n\n```csharp\npublic int Hourworked\
    \ { get; set; }\n```\n\nThis is equivalent to\n\n```csharp\nprivate int Hworked;\n\
    public int Hourworked\n{\n    get\n    {\n        return Hworked;\n    }\n   \
    \ set\n    {\n        Hworked = value;\n    }\n}\n```\n\nWhen you use this shorthand,\
    \ you do not have to declare a private field. The compiler will create an anonymous\
    \ private backing field for you automatically.\n\nIf you want to make the property\
    \ read-only, you can set the setter to private like this:\n\n```csharp\npublic\
    \ int Hourworked { get; private set; }\n```\n\n# Methods\n\nNext, let us look\
    \ at methods.\n\nA method is a code block that performs a certain task.\n\nLet's\
    \ add a simple method to our Staff class.\n\n```csharp\npublic void PrintMessage()\n\
    {\n    Console.WriteLine(\"Calculating Pay...\");\n}\n```\n\nThis method is declared\
    \ as\n\n```csharp\npublic void PrintMessage()\n{}\n```\n\nThe method declaration\
    \ first states the accessibility level of the method. Here we declared the method\
    \ as public so that the method is accessible everywhere in the program (not just\
    \ within the Staff class).\n\nNext, we state the return type of the method. A\
    \ method may return a certain result after performing its task. If the method\
    \ does not return any result, we use the `void` keyword like in our example.\n\
    \nFinally, we state the name of the method (`PrintMessage` in our example).\n\n\
    The parenthesis `()` after the method name is where we include the parameters\
    \ of the method. Parameters are given names to data that we pass in to the method\
    \ in order to perform its task. If the method requires no data (like in our example),\
    \ we just add a pair of empty parenthesis after the method name.\n\nAfter we declare\
    \ the method, we define what it does inside the pair of curly braces that follow.\
    \ This is known as implementing the method. In our example, the `PrintMessage()`\
    \ method simply prints the line \"Calculating Pay...\"\n\nThat's all there is\
    \ to the `PrintMessage()` method.\n\nNext, let us move on to a more complex method.\
    \ This method calculates the pay of each employee and returns the result of the\
    \ calculation. Add the following lines of code to Staff.\n\n```csharp\npublic\
    \ int CalculatePay()\n{\n    PrintMessage();\n\n    int staffPay;\n    staffPay\
    \ = hworked * hourlyRate;\n\n    if (hworked > 0)\n        return staffPay;\n\
    \    else\n        return 0;\n}\n```\n\nThis method is declared as `public int\
    \ CalculatePay()`. The `int` keyword indicates that this method returns a value\
    \ of `int` type.\n\nInside the curly braces, we have the statement `PrintMessage();`.\
    \ This is known as calling the `PrintMessage()` method. When the program reaches\
    \ this statement, it will execute the `PrintMessage()` method first and print\
    \ the line \"Calculating Pay...\"\n\nNext, we declare a local variable `staffPay`\
    \ and assign the product of `hworked` and `hourlyRate` to it. A method can access\
    \ all the fields and properties that are declared in the class. In addition, it\
    \ can declare its own variables. These are known as local variables and only exist\
    \ within the method. An example is `staffPay` in our example.\n\nAfter assigning\
    \ `staffPay`, we use an `if` statement to determine what result the method should\
    \ return. A method usually has at least one return statement. `return` is a keyword\
    \ that is used to return an answer from the method. There can be more than one\
    \ return statement in a method. However, once the method executes a return statement,\
    \ the method will exit.\n\nIn our example, if `hworked` is greater than zero,\
    \ the program will execute the statement\n\n```csharp\nreturn staffPay;\n```\n\
    \nand exit the method. This return value can then be assigned to a variable. For\
    \ instance, if `hworked` is 10 and `hourlyRate` is 20, we can use the statement\n\
    \n```csharp\nint pay = CalculatePay();\n```\n\nto assign the result of `CalculatePay()`\
    \ to the variable `pay`. The value of `pay` will then be 200.\n\nOn the other\
    \ hand, if `hworked` is less than or equal to zero, the program will execute the\
    \ statement\n\n```csharp\nreturn 0;\n```\n\nand exit the method. The value of\
    \ `pay` will be 0.\n\n# Overloading\n\nIn C# (and most other languages), you can\
    \ create two methods of the same name as long as they have different signatures.\
    \ This is known as overloading. The signature of a method refers to the name of\
    \ the method and the parameters that it has.\n\nAdd the following method below\
    \ the `CalculatePay()` method.\n\n```csharp\npublic int CalculatePay(int bonus,\
    \ int allowance)\n{\n    PrintMessage();\n\n    if (hworked > 0)\n        return\
    \ hworked * hourlyRate + bonus + allowance;\n    else\n        return 0;\n}\n\
    ```\n\nThe signature of the first method is `CalculatePay()` while that of the\
    \ second method is `CalculatePay(int bonus, int allowance)`.\n\nThis second method\
    \ has two parameters - `bonus` and `allowance`. It calculates the pay of the employees\
    \ by adding the values of these two parameters to the product of `hworked` and\
    \ `hourlyRate`.\n"
  mdcn: "\n\n# 属性 (Properties)\n\n接下来，让我们来看属性。\n\n属性通常用于在其他类需要某个私有字段的情况下，提供对该字段的访问。这听起来可能有些矛盾。之前我们提到，使用私有字段是为了让其他类无法访问它们。既然如此，我们为什么允许通过属性来访问它们呢？\n\
    \n主要原因之一是使用属性可以对其他类在评估这些私有字段时的权利拥有更大的控制权。我们稍后会看到如何实现。\n\n现在，让我们先学习如何声明属性。\n\n\
    在 `Staff` 类中，`private int hworked;` 这一行之后添加以下代码：\n\n```csharp\npublic int Hworked\n\
    {\n    get\n    {\n        return hworked;\n    }\n    set\n    {\n        if\
    \ (value > 0)\n            hworked = value;\n        else\n            hworked\
    \ = 0;\n    }\n}\n```\n\n我们将属性声明为：\n\n```csharp\npublic int Hworked\n{}\n```\n\
    \n访问修饰符为 `public`，因为我们希望其他类能够访问此属性。\n\n数据类型是 `int`，因为此属性用于访问私有 `int` 字段 `hworked`。`hworked`\
    \ 被称为属性的备用字段 (backing field)。\n\n属性的名称为 `Hourworked`。我们通常对属性名使用大驼峰命名法 (PascalCasing)。\n\
    \n属性包含两个特殊方法，称为访问器 (accessors)。第一个访问器是获取器 (getter)，第二个是设置器 (setter)。\n\n基础的 getter\
    \ 简单地返回私有字段的值。因此，我们写道：\n\n```csharp\n{\n  return hworked;\n}\n```\n\n其中 `hworked`\
    \ 是一个关键字，而另一个 `hworked` 是备用字段的名称。\n\nsetter 设置私有字段的值。我们写道：\n\n```csharp\n{\n \
    \ if (value > 0)\n    hworked = value;\n  else\n    hworked = 0;\n}\n```\n\n当用户使用属性设置私有字段的值时，`value`\
    \ 在赋值语句内部被用作，是一个关键字。我们稍后会学习如何操作。\n\n在 setter 内部，我们使用 `if` 语句进行了一个简单的检查。我们检查 `value`\
    \ 是否大于零。如果是，则将其分配给 `hworked`。否则，我们将 `hworked` 设置为零。这个 setter 演示了我们如何使用属性来控制可以分配给私有字段的数值。\n\
    \n默认情况下，getter 和 setter 的访问级别与属性本身相同（在本例中为 `public`）。因此，我们不需要显式指定它们。然而，如果你不希望\
    \ setter 的访问级别与属性相同，可以将 setter 声明为 `private`，这样其他类就无法修改你的私有字段：\n\n```csharp\n\
    private set\n{\n```\n\n那么，该属性在 `Staff` 类之外就是一个只读属性。它的值只能在 `Staff` 类内部被设置。\n\n\
    # 自动实现属性 (Auto-implemented Properties)\n\n注意，在 getter 和 setter 不需要额外逻辑的情况下，C#\
    \ 为我们提供了一种声明属性的简写方式。这被称为自动实现属性。\n\n要声明一个自动实现属性，我们写道：\n\n```csharp\npublic int\
    \ Hourworked { get; set; }\n```\n\n这等同于：\n\n```csharp\nprivate int Hworked;\n\
    public int Hourworked\n{\n    get\n    {\n        return Hworked;\n    }\n   \
    \ set\n    {\n        Hworked = value;\n    }\n}\n```\n\n当你使用这种简写时，不需要手动声明私有字段。编译器将自动为你创建一个匿名的私有备用字段。\n\
    \n如果你想让属性只读，可以这样将 setter 设置为 `private`：\n\n```csharp\npublic int Hourworked {\
    \ get; private set; }\n```\n\n# 方法 (Methods)\n\n接下来，让我们来看方法。\n\n方法是一个执行特定任务的代码块。\n\
    \n让我们为我们的 `Staff` 类添加一个简单的方法。\n\n```csharp\npublic void PrintMessage()\n{\n  \
    \  Console.WriteLine(\"Calculating Pay...\");\n}\n```\n\n该方法的声明为：\n\n```csharp\n\
    public void PrintMessage()\n{}\n```\n\n方法声明首先说明了方法的访问级别。在这里，我们将方法声明为 `public`，以便该方法在程序的任何处都是可访问的（而不仅仅是在\
    \ `Staff` 类内部）。\n\n接下来，我们指定方法的返回类型。方法在执行任务后可能会返回特定的结果。如果方法不返回任何结果，我们像示例中那样使用 `void`\
    \ 关键字。\n\n最后，我们指定方法的名称（示例中为 `PrintMessage`）。\n\n方法名后的括号 `()` 是我们包含方法参数的地方。参数是传递给方法以执行其任务的数据的命名数据。如果方法不需要数据（如示例所示），我们只需要在方法名后添加一对空括号即可。\n\
    \n声明方法后，我们在随后的大括号内定义它的功能。这被称为实现方法 (implementing the method)。在我们的示例中，`PrintMessage()`\
    \ 方法简单地打印行“Calculating Pay...”\n\n这就是 `PrintMessage()` 方法的全部内容。\n\n接下来，让我们转向一个更复杂的方法。此方法计算每个员工的工资并返回计算结果。在\
    \ `Staff` 中添加以下代码：\n\n```csharp\npublic int CalculatePay()\n{\n    PrintMessage();\n\
    \n    int staffPay;\n    staffPay = hworked * hourlyRate;\n\n    if (hworked >\
    \ 0)\n        return staffPay;\n    else\n        return 0;\n}\n```\n\n该方法声明为\
    \ `public int CalculatePay()`。`int` 关键字表示此方法返回一个 `int` 类型的值。\n\n在大括号内部，我们有语句 `PrintMessage();`。这被称为调用\
    \ `PrintMessage()` 方法。当程序运行到这条语句时，它将首先执行 `PrintMessage()` 方法并打印行“Calculating Pay...”\n\
    \n接下来，我们声明一个局部变量 `staffPay`，并将 `hworked` 和 `hourlyRate` 的乘积赋值给它。方法可以访问类中声明的所有字段和属性。此外，它还可以声明自己的变量。这些被称为局部变量，仅存在于方法内部。示例中的\
    \ `staffPay` 就是一个例子。\n\n在分配 `staffPay` 后，我们使用 `if` 语句来确定方法应该返回什么结果。方法通常至少有一个 return\
    \ 语句。`return` 是一个用于从方法返回答案的关键字。方法中可以有多个 return 语句。然而，一旦方法执行了 return 语句，方法就会退出。\n\
    \n在我们的示例中，如果 `hworked` 大于零，程序将执行语句：\n\n```csharp\nreturn staffPay;\n```\n\n并退出方法。这个返回值可以赋值给变量。例如，如果\
    \ `hworked` 是 10 且 `hourlyRate` 是 20，我们可以使用语句：\n\n```csharp\nint pay = CalculatePay();\n\
    ```\n\n将 `CalculatePay()` 的结果赋值给变量 `pay`。此时 `pay` 的值将为 200。\n\n另一方面，如果 `hworked`\
    \ 小于等于零，程序将执行语句：\n\n```csharp\nreturn 0;\n```\n\n并退出方法。`pay` 的值将为 0。\n\n# 重载 (Overloading)\n\
    \n在 C#（以及大多数其他语言）中，只要签名不同，你就可以创建同名的方法。这被称为重载。方法的签名指的是方法的名称以及它拥有的参数。\n\n在 `CalculatePay()`\
    \ 方法下方添加以下方法：\n\n```csharp\npublic int CalculatePay(int bonus, int allowance)\n\
    {\n    PrintMessage();\n\n    if (hworked > 0)\n        return hworked * hourlyRate\
    \ + bonus + allowance;\n    else\n        return 0;\n}\n```\n\n第一个方法的签名是 `CalculatePay()`，而第二个方法的签名是\
    \ `CalculatePay(int bonus, int allowance)`。\n\n第二个方法有两个参数——`bonus` 和 `allowance`。它通过将这两个参数的值加到\
    \ `hworked` 和 `hourlyRate` 的乘积上来计算员工的工资。\n\n"
