    ## Escape Sequences


    Sometimes in our programs, we may need to print special characters such as a tab
    or newline. In this case, we use escape characters.


    For instance, if we type


    ```c

    Console.WriteLine("Hello\tWorld");

    ```


    the output


    Hello    World


    will be displayed.


    If we type


    ```c

    Console.WriteLine("Hello\nWorld");

    ```


    the output


    Hello

    World


    will be displayed.


    Other common uses include:


    - \t (tab)

    - \n (newline)


    ## Accepting User Input


    Now that we know how to display messages to users, let us look at how we can accept
    input from them. To accept user input, we can use either the Read() or ReadLine()
    method. Read() reads the next character from standard input while ReadLine() reads
    a line of characters. Standard input refers to the device that users use to enter
    data, which is usually the keyboard. ReadLine() is more commonly used than Read().


    The example below shows how we use ReadLine() to read input from users.


    ```c

    string userInput = Console.ReadLine();

    ```


    The ReadLine() method reads input as a string.


    ## Converting a String to a Number


    Sometimes, it is necessary to convert the input that users entered into a numeric
    data type so that you can perform calculations on it. C# provides us with a number
    of methods to do the conversion. The methods that we use are found in the Convert
    class, which is also grouped under the System namespace.


    To convert a string to an integer, we use the Int32() method. For instance, if
    we have


    ```c

    string userInput = Console.ReadLine();

    ```


    and the user keys in 20, userInput will be equal to "20" (which is a string and
    not an integer because of the double quotes).


    We can use


    ```c

    int newUserInput = Convert.ToInt32(userInput);

    ```


    to convert the string to the integer 20 and assign it to an int variable. We can
    now perform the usual mathematical operations on this new int variable.


    Besides converting a string to an integer, we can also convert string to a decimal,
    float or double using the ToDecimal(), ToSingle() and ToDouble() methods respectively.


