    \ 循环内部，我们有语句：\n\n```\nConsole.WriteLine(sr.ReadLine());\n```\n\nsr.ReadLine()\
    \ 从文件中读取一行并作为字符串返回。然后使用 `Console.WriteLine()` 方法打印到屏幕上。\n\n最后，在我们完成读取后，关闭文件以便其他程序可以使用。当你不再需要它时，你应该关闭文件。\n\
    \n```\nsr.Close();\n```\n\n就这样。这就是在 C# 中读取文本文件的方法。非常简单吧？\n\n然而，上面的代码有一个问题。如果找不到\
