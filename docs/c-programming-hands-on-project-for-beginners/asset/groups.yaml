    C# 中的变量名只能包含字母、数字或下划线 (_)。但是，第一个字符不能是数字。因此，你可以将变量命名为 `userName`、`user_name` 或
    `username2`，而不是 `2userName`。


    此外，还有一些保留字是不能用作变量名的，因为它们在 C# 中已经有了预定义的含义。这些保留字包括 `Console`、`if`、`while` 等。我们将在随后的章节中学习每一个。


    最后，变量名是区分大小大小的。`username` 和 `UserName` 是不同的。


    在 C# 中命名变量有两种惯例。我们可以使用驼峰命名法（camel case）或使用下划线。驼峰命名法是用混合大小写编写复合词，除了第一个单词外，每个单词的首字母都大写（例如
    `this&VariableName`）。这是我们在书中其余部分使用的约定。或者，另一种常见做法是使用下划线 (_) 来分隔单词。如果你喜欢，可以这样命名变量：`this_is_a_variable_name`。


    ## 初始化变量


    每当你声明一个新变量时，都需要给它赋一个初始值。这被称为初始化变量。稍后可以在程序中更改变量的值。


    初始化变量有两种方法。你可以在声明时初始化，也可以在单独的语句中初始化。


    下面的示例展示了如何在声明点点初始化变量：


    ### 示例 1


    这些示例展示了如何初始化 `byte` 和 `int` 变量。


    ```

    byte usage = 20;

    int numberOfEmployees = 510;

    ```


    由于 `byte` 和 `int` 用于没有小数位的数据，如果你编写类似代码，将会报错：


    ```

    byte usage2 = 20.0;

    ```


    在 C# 中，20.0 不等于 20。


