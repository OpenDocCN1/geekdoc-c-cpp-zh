    \ off letting C# figure the data type out us.\n\nAfter we create the query statement,\
    \ we can execute the query by writing\n\n```\nforeach (int i in evenNumQuery)\n\
    \    Console.WriteLine(\"{0} is an even number\", i);\n```\n\nIf you run this\
