    as the range for byte is from 0 to 255.


    There are two main reasons for using enums. The first is to improve the readability
    of

    your code. The statement


    myDays = DaysOfWeek.Mon;


    is self-explanatory that the statement


    myDays = 1;


    The second reason is to restrict the values that a variable can take. If we have
    a

    variable that stores the days of a week, we may accidentally assign the value
    10 to it.

    This can be prevented when we use an enum as we can only assign the pre-defined

    members of the enum to the variable.


    # Struct


    Now, let''s look at the struct data type.


    A struct is similar to a class in many aspects. Like classes, they contain elements
    like

    properties, constructors, methods and fields allow you to group related members

    into a single package so that you can manipulate them as a group.


    To declare a struct, you use the struct keyword. An example is:


