- md: "\nSome of the pre-written classes in C# are declared as static classes. An\
    \ example is the Console class. We do not need to create a Console object when\
    \ using methods from the Console class. We simply write Console.WriteLine(\"Hello\
    \ World\");\n\n## Advanced Method Concepts\n\nNow that you are familiar with classes,\
    \ let us move on to some advanced concepts regarding the declaration and use of\
    \ methods in a class. These concepts are more complex and may require more than\
    \ one reading to fully understand them.\n\n## Using Arrays and Lists\n\nPreviously,\
    \ we learned how to use basic data types like int and float as parameters. In\
    \ addition to using basic data types, we can also use arrays and lists.\n\nTo\
    \ use an array as a parameter, we add a square bracket [] after the parameter's\
    \ data type in the method declaration. An example is shown below.\n\n```csharp\n\
    public void PrintFirstElement(int[] a)\n{\n    Console.WriteLine(\"The first element\
    \ is {}.\\n\", a[0]);\n}\n```\n\nTo call this method, we need to declare an array\
    \ and pass it as an argument to the method:\n\n```csharp\nint[] myArray = {1,\
    \ 2, 3, 4, 5};\nPrintFirstElement(myArray);\n```\n\nThe next example shows how\
