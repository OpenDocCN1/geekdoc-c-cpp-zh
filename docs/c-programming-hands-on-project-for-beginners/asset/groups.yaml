    class ClassC\n{\n    ClassA a = new ClassA();\n\n    public void PrintMessages()\n\
    \    {\n        //This is ok\n        Console.WriteLine(a.publicNum);\n\n    \
    \    //This is NOT ok\n        Console.WriteLine(a.protectedNum);\n\n        //This\
    \ is NOT ok\n        Console.WriteLine(a.privateNum);\n    }\n}\n```\n\nIn short,\
    \ anything that is declared as public is accessible everywhere; there are no restrictions\
    \ on accessing public members. On the other hand, anything declared as private\
    \ is only accessible within the class in which it is declared. Anything declared\
    \ as protected is accessible within the class in which it is declared and any\
    \ class that is derived from it."
  - "[PAGE 98]\n\n# Chapter 9: Enum and Struct\n\nIn Chapter 3 and 4, we looked at\
    \ some built-in data types provided by C#. These include value types like int,\
    \ float and double and reference data types like arrays, strings and lists. In\
    \ addition, we also looked at how you can write your own classes in-Chapter 7\
    \ and 8. A class can be considered to be an advanced user-defined data type that\
    \ groups a set of related fields, properties and methods into a logical unit.\n\
    \nIn this chapter, we are going to look at two more user-defined data types in\
    \ C#–enum and struct.\n\n# Enum\n\nAn enum (which stands for enumerated type)\
    \ is a special data type that allows programmers to provide meaningful names for\
    \ a set of integral constants.\n\nTo declare an enum, we use the enum keyword\
    \ followed by the name of the enum. The members of the enum are enclosed in a\
    \ set of curly braces and separated by commas.\n\nAn example is shown below:\n\
    \n```\nenum DaysOfWeek\n{\n    Sun, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\n\
    Note that we do not put a semi-colon at the end of the last member.\n\nAfter declaring\
    \ the DaysOfWeek enum, we can declare and initialize a DaysOfWeek variable like\
    \ this:\n\n```\nDaysOfWeek myDays = DaysOfWeek.Mon;\n```\n\nThe name of the variable\
    \ is myDays. If we write\n\n```\nConsole.WriteLine(myDays);\n```\n\nwe'll get\n\
    \nMon"
  - "[PAGE 99]\n\nBy default, each member in the enum is assigned integer value, starting\
    \ from zero. That is, in our example, Sun is assigned a value of 0, Mon is 1,\
    \ Tues is 2 and so on.\n\nAs of an enum are essentially integers, we can cast\
    \ a DaysOfWeek variable into an int and vice versa. For instance,\n\n```\nConsole.WriteLine((int)Days);\n\
    ```\n\ngives us the integer 1 while\n\n```\nConsole.WriteLine((DaysOfWeek)1);\n\
    ```\n\ngives us Mon.\n\nIf you want to assign a different set of integers to your\
    \ enum members, you can do the following\n\n```\nenum DaysOfWeekTwo {\n  Sun =\
    \ 5, Mon = 10, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\nNow, Sun is assigned a value\
    \ of 5 and Mon is assigned 10. As we did not assign values for Tues to Sat, consecutive\
    \ numbers after 10 will be assigned to them. That is Tues = 11, Wed = 12 and so\
    \ on.\n\nAll enums are stored internally as integers (int). If you want to change\
    \ the underlying data type from int to another data type, you add a colon after\
    \ the enum name, followed by the desired data type. Any integer data type is allowed\
    \ except for char. An example is\n\n```\nenum DaysOfWeekThree : byte {\n  Sun,\
    \ Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\nOf course, if you use a byte data\
    \ type, you cannot do something like\n\n```\nenum DaysOfWeekFour : byte {\n  Sun\
    \ = 300, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```"
