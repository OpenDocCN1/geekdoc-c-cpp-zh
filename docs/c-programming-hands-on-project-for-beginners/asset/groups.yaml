- md: "\n# Chapter 10: LINQ\n\nLINQ stands for Language-Integrated Query and is an\
    \ interesting feature of C# that allows you to query data in your program. In\
    \ this chapter, we'll cover a brief introduction to LINQ followed by two examples\
    \ of how LINQ can be used.\n\nLet's first learn how to write a LINQ query. The\
    \ typical syntax for a LINQ query is from... where... select\n\nLet's suppose\
    \ we have an array of numbers and we want to select all even numbers from the\
    \ array. We can do that easily with LINQ.\n\nFirst, let's declare the array.\n\
    \n```\nint[] numbers = { 0, 1, 2, 3, 4, 5, 6 };\n```\n\nNext, we write a LINQ\
    \ query as follows:\n\n```\nvar evenNumQuery =\nfrom num in numbers\nwhere (num\
    \ % 2) == 0\nselect num;\n```\n\nThe query is the second to the fourth line. Readers\
    \ who have experience with SQL will probably find this query quite familiar. The\
    \ query consists of three parts.\nThe first part\n\n```\nfrom num in numbers\n\
    ```\n\nstates that we are performing the query on the numbers array. num is the\
    \ name that we use to represent the individual items in the array. The next line\n\
    \n```\nwhere (num % 2) == 0\n```\n\ntests the individual items to determine if\
    \ the remainder of num divided by 2 is zero. If it is, num is an even number.\
    \ The third line\n\n```\nselect num;\n```\n\nselects all elements that satisfy\
    \ this criteria.\n\nThis result is then assigned to the variable evenNumQuery,\
    \ which is declared to be of var type. var is a special data type that we use\
    \ whenever we want the compiler to determine the data type itself. This is necessary\
    \ because in our example, the data type of evenNumQuery is quite complex; we are\
    \ better off letting C# figure the data type out us.\n\nAfter we create the query\
    \ statement, we can execute the query by writing\n\n```\nforeach (int i in evenNumQuery)\n\
    \    Console.WriteLine(\"{0} is an even number\", i);\n```\n\nIf you run this\
    \ code, you will get\n\n```\n0 is an even number\n2 is an even number\n4 is an\
    \ even number\n6 is an even number\n```\n\nThat's it. That's how easy it is to\
    \ use LINQ. Let us now move on to a more complex example of LINQ.\n\nSuppose you\
    \ have a Customer with Name, Phone, Address and Balance as its properties and\
    \ a constructor to initialize each of these properties.\n\nWe can create a list\
    \ of Customer objects in our Main() method using the code below.\n\n```\nList<Customer>\
    \ customers = new List<Customer>();\n```\n\n```\ncustomers.Add(new Customer(\"\
    Alan\", \"80911291\", \"ABC Street\", 25.60m));\ncustomers.Add(new Customer(\"\
    Bill\", \"198721311\", \"DEF Street\", -32.1m));\ncustomers.Add(new Customer(\"\
    Carl\", \"298123711\", \"GHI Street\", -12.2m));\ncustomers.Add(new Customer(\"\
    David\", \"78612312\", \"JKL Street\", 12.6m));\n```\n\nNow we want to search\
    \ for all accounts with negative balances, we can use the following LINQ query.\n\
    \n```\nvar overdue = from cust in customers\n               where cust.Balance\
    \ < 0\n               orderby cust.Balance ascending\n               select {\
    \ cust.Name, cust.Balance };\n```\n\nThis query is similar to the first query,\
    \ with two main differences. Here, we used two additional keywords, orderby and\
    \ ascending, to arrange the results in ascending order.\n\nIn addition, we used\
    \ the new keyword in the select statement. The new keyword is needed whenever\
    \ we want to select more than one field from the objects.\n\nTo execute and print\
    \ the results, we can use the foreach loop below:\n\n```\nforeach (var cust in\
    \ overdue)\n    Console.WriteLine(\"Name = {0}, Balance = {1}\", cust.Name,\n\
    \    cust.Balance);\n```\n\nWe will get\n\n```\nName = Bill, Balance = -32.1\n\
    Name = Carl, Balance = -12.2\n```\n\n# Chapter 11: File Handling\n\nCool! We've\
    \ come to the last chapter of the book before the project. In this chapter, we'll\
    \ learn how to read and write to an external file.\n\nIn Chapter 5 previously,\
    \ we learned how to get input from users using the ReadLine() method. However,\
    \ in some cases, getting users to enter data into our program may not be practical,\
    \ especially if our program needs to work with large amounts of data. In cases\
    \ like this, a more convenient way is to prepare the needed information as an\
    \ external file and get our programs to read the information from the file.\n\n\
    C# provides us with a number of classes to work with files. The classes that we\
    \ are going to look at in this chapter are the File, StreamWriter and StreamReader\
    \ classes. All three classes are available in the System.IO namespace. To use\
    \ the methods in this chapter, you have to add the directive\n\nusing System.IO;\n\
    \n## Reading a Text File\n\nTo read data from a text file, we use the StreamReader\
    \ class.\n\nSuppose we want to read data from the file \"myFile.txt\" located\
    \ on the C drive. The example below shows how to do it.\n\n```c\n1 string path\
    \ = \"c:\\myFile.txt\";\n2 using (StreamReader sr = new StreamReader(path))\n\
    3 {\n4     while (sr.EndOfStream != true)\n5     {\n6         Console.WriteLine(sr.ReadLine());\n\
    7     }\n8 \n9     sr.Close();\n10 }\n```\n\nOn line 1, we first declare a string\
    \ variable path and assign the path of the file to the variable.\n\n```c\nstring\
    \ path = \"c:\\\\File.txt\";\n```\n\nNote that we have to use double slashes \\\
    \\ when writing the path. This is because if we only use a single slash, the compiler\
    \ will think the single slash is the beginning of an escape sequence and interpret\
    \ \\m as an escape sequence. This will result in an error.\n\nOn line 2, we create\
    \ a StreamReader instance. The StreamReader constructor takes in one argument\
    \ – the path of the file to be read.\n\n```\nStreamReader sr = new StreamReader(path);\n\
    ```\n\nNotice that we create this StreamReader instance inside a pair of parenthesis\
    \ that follows the word using line 2?\n\nThe using keyword here is different from\
    \ the one that we use when writing a directive.\n\nThe keyword here ensures that\
    \ the dispose() method is always called. The dispose() method is a pre-written\
    \ method in the System namespace that releases unmanaged resources such as files\
    \ and streams once they are longer needed. When we use the using keyword, we ensure\
    \ that the dispose() method is called even if an exception occurs and reaching\
    \ Line 9 where we manually close the file. It is good practice to always use the\
    \ using keyword whenever we are dealing with files. From lines 4 to 7, we use\
    \ a while loop to read the file line by line.\n\n```\nwhile (sr.EndOfStream !=\
    \ true)\n{\n    Console.WriteLine(sr.ReadLine());\n}\n```\n\nEndOfStream is a\
    \ property of the StreamReader class that returns true when the end of file is\
    \ reached. As long as the end of file is not reached, the while loop will continue\
    \ to run.\n\nInside the while loop, we have the statement\n\n```\nConsole.WriteLine(sr.ReadLine());\n\
    ```\n\nsr.ReadLine() reads a line from the file and returns it as a string. This\
    \ string is then printed onto the screen using the Console.WriteLine() method.\n\
    \nFinally, after we finish reading the file, we close the file so that other programs\
    \ may use it. You should always close your file once you longer need it.\n\n```\n\
    sr.Close();\n```\n\nThat's it. That's how you read a text file in C#. Pretty straightforward\
    \ right?\n\nHowever, there is one problem with the code above. This code will\
    \ generate an error if the file \"myFile.txt\" cannot be found. We have two options\
    \ here.\n\n### Option 1: try...catch\n\nThe first option is to use a try...catch\
    \ statement as shown below:\n\n```c\n1 try\n2 {\n3     using (StreamReader sr\
    \ = new StreamReader(path))\n4     {\n5      while (sr.EndOfStream)\n6      {\n\
    7          Console.WriteLine(sr.ReadLine());\n8      }\n9      sr.Close();\n10\
    \  }\n11 catch (FileNotFoundException e)\n12 {\n13     Console.WriteLine(e.Message);\n\
    14 }\n```\n\nFrom 1 to 11, we try to open, read and close the file in the try\
    \ block.\n\nFrom 11 to 14, we use a catch block to catch the FileNotFoundException\
    \ exception if the file is not found. Inside the catch block, we print an error\
    \ statement to inform users that the file is not found.\n\n### Option 2: File.Exists()\n\
    \nThe second method to deal with a \"file not found\" scenario is to use the Exists()\
    \ method in the File class. As the name suggests, the Exists() method checks if\
    \ a file exists. The File class is a pre-written class in the System.IO namespace\
    \ that provides static methods for the creation, copying, deletion, moving, and\
    \ opening of a single file.\n"
  mdcn: "\n\n# 第 10 章：LINQ\n\nLINQ 代表语言集成查询（Language-Integrated Query），是 C# 中一个有趣的特性，允许你对程序中的数据进行。在本章中，我们将对\
    \ LINQ 进行简要介绍，并给出两个使用 LINQ 的示例。\n\n首先，让我们学习如何编写 LINQ 查询。LINQ 查询的典型语法是来自...`from...where...select`。\n\
    \n假设我们有一个数字数组，想要从数组中选择所有的偶数。我们可以使用 LINQ 轻松地实现。\n\n首先，我们声明该数组。\n\n```\nint[] numbers\
    \ = { 0, 1, 2, 3, 4, 5, 6 };\n```\n\n接下来，我们按照如下方式编写 LINQ 查询：\n\n```\nvar evenNumQuery\
    \ =\nfrom num in numbers\nwhere (num % 2) == 0\nselect num;\n```\n\n查询位于第二行到第四行。有\
    \ SQL 经验的读者可能会觉得这个查询非常熟悉。该查询由三部分组成。\n第一部分\n\n```\nfrom num in numbers\n```\n\n\
    表示我们正在对 `numbers` 数组执行查询。`num` 是我们用来表示数组中单个元素的名称。接下来的一行\n\n```\nwhere (num % 2)\
    \ == 0\n```\n\n测试单个元素，确定 `num` 除以 2 的余数是否为零。如果是，则 `num` 是一个偶数。第三行\n\n```\nselect\
    \ num;\n```\n\n选择所有符合此标准的元素。\n\n然后将此结果赋值给变量 `evenNumQuery`，该变量被声明为 `var` 类型。`var`\
    \ 是一种特殊的数据类型，每当我们希望编译器自己确定数据类型时就会使用它。这是必要的，因为在我们的示例中，`evenNumQuery` 的数据类型相当复杂；让\
    \ C# 自己找出数据类型会更好。\n\n创建查询语句后，我们可以通过编写以下代码来执行查询：\n\n```\nforeach (int i in evenNumQuery)\n\
    \    Console.WriteLine(\"{0} is an even number\", i);\n```\n\n如果你运行这段代码，将得到：\n\
    \n```\n0 is an even number\n2 is an even number\n4 is an even number\n6 is an\
    \ even number\n```\n\n就是这样。使用 LINQ 就这么简单。现在让我们进入一个更复杂的 LINQ 示例。\n\n假设你有一个 `Customer`\
    \ 类，具有 `Name`、`Phone`、`Address` 和 `Balance` 属性，并有一个用于初始化这些每个属性的构造函数。\n\n我们可以在\
    \ `Main()` 方法中使用下面的代码创建一个 `Customer` 对象的列表。\n\n```\nList<Customer> customers =\
    \ new List<Customer>();\n```\n\n```\ncustomers.Add(new Customer(\"Alan\", \"80911291\"\
    , \"ABC Street\", 25.60m));\ncustomers.Add(new Customer(\"Bill\", \"198721311\"\
    , \"DEF Street\", -32.1m));\ncustomers.Add(new Customer(\"Carl\", \"298123711\"\
    , \"GHI Street\", -12.2m));\ncustomers.Add(new Customer(\"David\", \"78612312\"\
    , \"JKL Street\", 12.6m));\n```\n\n现在我们要搜索所有余额为负的账户，可以使用以下 LINQ 查询。\n\n```\nvar\
    \ overdue = from cust in customers\n               where cust.Balance < 0\n  \
    \             orderby cust.Balance ascending\n               select { cust.Name,\
    \ cust.Balance };\n```\n\n此查询与第一个查询相似，但有两个主要区别。在这里，我们使用了两个额外的关键字 `orderby` 和 `ascending`\
    \ 来按升序顺序排列结果。\n\n此外，我们在 `select` 语句中使用了 `new` 关键字。每当我们想要从对象中选择多个一个字段时，就需要 `new`\
    \ 关键字。\n\n要执行并打印结果，我们可以使用下面的 `foreach` 循环：\n\n```\nforeach (var cust in overdue)\n\
    \    Console.WriteLine(\"Name = {0}, Balance = {1}\", cust.Name,\n    cust.Balance);\n\
    ```\n\n我们将得到：\n\n```\nName = Bill, Balance = -32.1\nName = Carl, Balance = -12.2\n\
    ```\n\n# 第 11 章：文件处理\n\n太棒了！我们来到了项目前的最后一章。在本章中，我们将学习如何读取和写入外部文件。\n\n在之前的第 5 章中，我们学习了如何使用\
    \ `ReadLine()` 方法从用户获取输入。然而，在某些情况下，让用户向我们的程序输入数据可能并不实际，特别是当我们的程序需要处理大量数据时。在这种情况下，更方便的方法是将所需信息准备为外部文件，并让我们的程序从文件中读取信息。\n\
    \nC# 为我们提供了许多类来处理文件。在本章中我们将看到的类是 `File`、`StreamWriter` 和 `StreamReader` 类。这三个类都位于\
    \ `System.IO` 命名空间。要使用本章中的方法，你必须添加指令：\n\nusing System.IO;\n\n## 读取文本文件\n\n要从文本文件中读取数据，我们使用\
    \ `StreamReader` 类。\n\n假设我们要从位于 C 盘的 \"myFile.txt\" 文件读取数据。下面的示例显示了如何操作。\n\n```c\n\
    1 string path = \"c:\\myFile.txt\";\n2 using (StreamReader sr = new StreamReader(path))\n\
    3 {\n4     while (sr.EndOfStream != true)\n5     {\n6         Console.WriteLine(sr.ReadLine());\n\
    7     }\n8 \n9     sr.Close();\n10 }\n```\n\n在第 1 行，我们首先声明一个字符串变量 `path` 并文件路径赋值给该变量。\n\
    \n```c\nstring path = \"c:\\\\File.txt\";\n```\n\n注意，在编写路径时我们必须使用双斜杠 `\\\\`。这是因为如果我们只使用单斜杠，编译器会认为单斜杠是转义序列的开头并将\
