    \nFirst, let's declare the child class NormalMember. We indicate that it is derived\
    \ from\nMember class using a colon (:) like this\n\n```csharp\nclass NormalMember\
    \ : Member\n{\n}\n```\n\nNow, we need to write the constructor for the child class.\
    \ The constructor of a child\nclass is built upon the parent’s constructor. Whenever\
    \ we create a child object, the\nparent class constructor is always called first.\n\
    \nThere are two ways to create a child constructor. The first way is to simply\
    \ declare it\nlike any other constructor.\n\n```csharp\npublic NormalMember()\n\
    {\n    Console.WriteLine(\"Child constructor with no parameter\");\n}\n```\n\n\
    When we declare our constructor as above, C# looks for a parameterless constructor\n\
    (i.e. a constructor with no parameter) in the parent class and calls that before\n\
    executing the code in the child constructor. If you use this constructor to create\
    \ a\nchild object, the following two lines will be displayed on the screen\n\n\
    Parent Constructor with no parameter\nChild constructor with no parameter\n\n\
    The first line is from the parent constructor while the second line is from the\
    \ child\nconstructor.\n\nThe second way to declare a child constructor is to use\
    \ the colon sign () and the base\nkeyword to call a non-parameterless constructor\
    \ in the parent class. An example is\nshown below:\n\n```csharp\npublic NormalMember(string\
    \ remarks) : base (\"Jamie\", 1, 2015)\n{\n    Console.WriteLine(\"Remarks = {0}\"\
    , remarks);\n}\n```\n\nWhen we call a non-parameterless constructor in the parent\
    \ class, we need to pass in\nvalues to its parameters. In the example above, we\
    \ passed the values \"Jamie\", 1\nand 2015 to the parent constructor. These values\
    \ are then assigned to the fields name, memberID and membersSince in the base\
    \ class respectively.\n\nIn this example, we passed fixed values arguments to\
    \ the base constructor. However, a better way is to pass in the arguments through\
    \ the child constructor. The example below shows how this can be done. Replace\
    \ the previous constructor with the constructor below:\n\n```csharp\npublic NormalMember(string\
    \ name, string remarks, int memberID, int memberSince) : base (name, memberID,\
    \ memberSince)\n{\n    Console.WriteLine(\"Child Constructor with 4 parameters\"\
    );\n    Console.WriteLine(\"Remarks = {0}\", remarks);\n}\n```\n\nThis new constructor\
    \ has four parameters. The first parameter is a string parameter called remarks.\
    \ This parameter is used inside the child constructor.\n\nThe second and fourth\
    \ parameters are not used in the child constructor. Instead, they are passed in\
    \ as arguments to the parent constructor based on their names. For instance, the\
    \ second argument in the child constructor (string name) is passed in as the first\
    \ argument to the parent constructor (name).\n\nWhen we create an object with\
    \ this constructor, we write something like\n\n```csharp\nNormalMember myChildMember\
    \ = new NormalMember(\"Special Rate\", \"James\", 1, 2010);\n```\n\nThe base constructor\
