    Special Rate\", \"James\", 1, 2010);\nVIPMember mem2 = new VIPMember(\"Andy\"\
    , 2, 2011);\n```\n\nmem1 is created using the 4 parameters constructor from the\
    \ NormalMember class.\nmem2 is created using the 3 parameters constructor from\
    \ the VIPMember class.\n\nNext, we'll use the CalculateAnnualFee() methods in\
