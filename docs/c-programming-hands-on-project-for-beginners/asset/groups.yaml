    ## bool


    bool stands for boolean and can only hold two values: true and false. It is commonly
    used in control flow statements. We''ll cover control flow statements in Chapter
    6.


    ## Naming a Variable


    A variable name in C# can only contain letters, numbers or underscores (_). However,
    the first character cannot be a number. Hence, you can name your variables userName,
    user_name or username2 not 2userName.


    In addition there are some reserved words that you cannot use a variable name
    because they already have preassigned meanings in C#. These reserved words include
    words like Console, if, while etc etc. We''ll learn about each of them in subsequent
    chapters.


    Finally, variable names are case sensitive. username is not the same as UserName.


    There are two conventions when naming a variable in C#. We can either use the
    camel case notation or use underscores. Camel casing is the practice of writing
    compound words with mixed casing, capitalising the first letter of each word except
    the first word (e.g. this&VariableName). This is the convention that we''ll be
    using in the rest of the book. Alternatively, another common practice is to use
    underscores (_) to separate the words. If you prefer, you can name your variables
    like this: this_is_a_variable_name.


    ## Initializing a Variable


    Every time you declare a new variable, you need to give it an initial value. This
    is known as initializing a variable. You can change the value of the variable
    in your program later.


    There are two ways to initialize a variable. You can initialize it at the point
    of declaration or initialize it in a separate statement.


    The examples below show how you can initialize a variable at the point of declaration:


