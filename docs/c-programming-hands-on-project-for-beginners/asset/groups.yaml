    +   - a before = 2

    - a inside method = 10

    - a after = 2


    +   - b[0] before = 1

    - b[0] inside method = 5

    - b[0] after = 5


    The value of a stays the same before and after the method call; the change is
    only valid inside the method itself.


    On the other hand, the value of b[0] changes after the method call.


    Be aware of this difference when you pass in a value type variable to a method
    (e.g. int, float etc) vs a reference type variable (such as an array or list).'
