    \ ID: 1\nMember Since: 2010\nTotal Annual Fee: 460\nName: Andy\nMember ID: 2\n\
    Member Since: 2011\nTotal Annual Fee: 1200\n```\n\n## Polymorphism\n\nNow that\
    \ we have seen an example of inheritance works, let us move on to\nanother topic\
    \ that is closely related to inheritance - the concept of polymorphism. The best\
    \ way to explain polymorphism is through an example. Let's expand on our Fitness\
    \ club example.\n\nFirst, delete all the code in the Main() method and add the\
    \ following lines:\n\n```csharp\nMember[] clubMembers = new Member[5];\n\nclubMembers[0]\
    \ = new NormalMember(\"Special Rate\", \"James\", 1, 2010);\nclubMembers[1] =\
    \ new VIPMember(\"Normal Rate\", \"Andy\", 2, 2011);\nclubMembers[2] = new NormalMember(\"\
    Normal Rate\", \"Bill\", 3, 2011);\nclubMembers[3] = new NormalMember(\"Carol\"\
    , 4, 2012);\nclubMembers[4] = new VIPMember(\"Evelyn\", 5, 2012);\n```\n\nHere,\
    \ we declare an array of Member type and add 5 members to it. The first three\
    \ members are instances of the NormalMember class while the last two are instances\
    \ of the VIPMember class.\n\nAlthough ClubMembers is declared to be an array of\
    \ Member type, we can assign instances of NormalMember and VIPMember to it as\
