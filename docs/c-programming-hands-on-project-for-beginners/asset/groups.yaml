    ## 数组


    数组简单来说是一个相互相关的数据集合。假设我们要存储 5 个用户的年龄。与其将它们存储为 `user1Age`、`user2Age`、`user3Age`、`user4Age`
    和 `user5Age`，我们可以将它们存储在一个数组中。


    可以这样声明并初始化数组：


    ```

    int[] userAge = {21, 22, 23, 24, 25};

    ```


    - `int` 表示该变量存储 `int` 类型的值。

    - `[]` 表示该变量是一个数组而不是普通变量。

    - `userAge` 是数组名称。

    - `{21, 22, 23, 24, 25}` 是数组存储的五个整数。


