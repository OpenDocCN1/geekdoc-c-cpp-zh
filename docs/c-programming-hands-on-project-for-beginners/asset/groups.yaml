    ## 赋值符号


    编程中的 `=` 与我们在数学中学习的 `=` 符号具有不同的含义。在编程中，`=` 被称为赋值符号。这意味着我们将 `=` 右侧的值赋值给左侧的变量。理解像
    `year = 20` 这样的语句的好方法是将其想作 `year <- 20`。


    在编程中，语句 `x = y` 和 `y = x` 有非常不同的含义。


