    To remove all items in the list, use the Clear() method.


    ## Value type vs. Reference Type


    Now that we are familiar with strings, arrays and lists, let us discuss an important
    concept regarding data types in C#. All data types in C# can be classified as
    either a value type or reference type. The data types discussed in this chapter
    are value types.


    A value type is a variable that stores its own data. When we write


    ```

    int myNumber = 5;

    ```


    the variableNumber stores the actual value.


    A reference type, on the other hand, does not store the actual data. Instead,
    it stores a reference to the data. It does not tell the compiler what the value
    of the data is; it tells the compiler where to find the data.


    An example of reference type is a string. When you write a statement like


    ```

    string message = "Hello";

    ```


    the variable message actually does not store the string “Hello”.


    Instead, the string “Hello” is created and stored elsewhere in the computer’s
    memory. The variable message stores the address of that memory location.


    That''s all that we need to know about reference types at the moment. As this
    is a book for beginners, we will not go into details about why reference types
    are necessary. Just be aware that there is a difference between value types and
    reference types; the former stores a value while the latter stores an address.


