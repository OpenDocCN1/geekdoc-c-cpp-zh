    \ properties.\n\nSuppose we have a class with three fields:\n\n```\nclass ClassA\n\
    {\n    private int privateNum = 1;\n    public int publicNum = 2;\n    protected\
    \ int protectedNum = 3;\n}\n```\n\nIf ClassB is derived from ClassA,\n\n```\n\
    class ClassB:ClassA\n{\n    public void PrintMessages()\n    {\n        //This\
    \ is ok\n        Console.WriteLine(publicNum);\n\n        //This is ok\n     \
    \   Console.WriteLine(protectedNum);\n\n        //This is NOT ok\n        Console.WriteLine(privateNum);\n\
    \    }\n\n    public void WriteLine()\n```\n\nthe first two WriteLine() statements\
    \ will give us any error as a derived class can access any public and protected\
    \ fields in the parent class.\n\nHowever, the third statement gives us an error\
    \ as privateNum is a private field and is thus only accessible in ClassA itself.\n\
    \nIf a class is not derived from ClassA, we need to instantiate a ClassA object\
