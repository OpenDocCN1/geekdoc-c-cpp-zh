    In C#, division gives an integer answer if both x and y are integers. However,
    if either x or y is a non integer, we will get a non integer answer. For instance,


    ```

    7/2 = 3

    7.0/2 = 3.5

    7/2.0 = 3.5

    7.0/2.0 = 3.5

    ```


    In the first case, when an integer is divided by another integer, you get an integer
    as the answer. The decimal portion of the answer, if any, is truncated. Hence,
    we get 3 instead of 3.5.


    In all other cases, the result is a non integer as at least one of the operands
    is integer.


    # More Assignment Operators


    Besides the = sign, there are a few more assignment operators in C# (and most
    programming languages). These include operators like +=, -= and *=.


    Suppose we have the variable x, with an initial value of 10. If we want to increment
    x by 2, we can write


    ```

    x = x + 2;

    ```


    The program will first evaluate the expression on the right (x + 2) and assign
    the answer to the left. So eventually the statement becomes x <- 12.


    Instead of writing x = x + 2, we can also write x += 2 to express the same meaning.
    The += sign is actually means the assignment sign with the addition operator.
    Hence, x += x + 2.


    Similarly, if we want to do a subtraction, we can write x = x - 2 or x -= 2. The
    same works for all the 5 operators mentioned in the section above.


    Most programming languages also have the ++ and -- operators. The ++ operator
    is used when you want to increase the value of a variable by 1. For instance,
    suppose


    * Noteith'
  - '[PAGE 22]


    ```

    int x = 2;

    ```


    If you write


    ```

    x++;

    ```


    the value of x becomes 3.


    There is no need to use the = sign when you use the ++ operator. The statement
    x++;; is equivalent to


    ```

    x = x + 1;

    ```


    The ++ operator can be placed in front of or behind the variable name. This affects
    the order in which tasks are performed.


    Suppose we have an integer named counter. If we write


    ```

    Console.WriteLine(counter++);

    ```


    the program first prints the original value of counter before incrementing counter
    by 1. In other words, it executes the tasks in this order


    ```

    Console.WriteLine(counter);

    counter = counter + 1;

    ```


    On the other hand, if we write


    ```

    Console.WriteLine(++counter);

    ```


    the program first increments counter by 1 before printing the new value of counter.
    In other words, it executes the tasks in this order


    ```

    counter = counter + 1;

    Console.WriteLine(counter);

    ```


    In addition to the ++ operator, we also have the -- operator (two minus signs).
    This operator decreases the value of the variable by 1.


