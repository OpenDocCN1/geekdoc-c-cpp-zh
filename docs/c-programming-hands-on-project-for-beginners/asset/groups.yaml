    \ in the parent class. This is not surprising as clubMembers is declared to be\
    \ of Member type.\n\nIf you want the child method to be invoked instead, you have\
    \ to make two changes.\n\nFirst, you need to declare the parent method as virtual,\
    \ like this\n\n```csharp\npublic virtual void CalculateAnnualFee()\n{\n  annualFee\
    \ = 0;\n}\n```\n\nThe virtual keyword tells the compiler that this method may\
    \ be overridden in derived classes. When the compiler encounters this keyword,\
    \ it'll look for the same method in the derived class and execute that method\
    \ instead.\n\nNext, in the derived class, you have to declare that your method\
    \ overrides the method in the parent class using the override keyword, like this\n\
    \n```csharp\n//In VIPMember child class\npublic override void CalculateAnnualFee()\n\
    {\n  annualFee = 1200;\n}\n```\n\n```csharp\n//In NormalMember child class\npublic\
    \ override void CalculateAnnualFee()\n{\n  annualFee = 100 + 12 * 30;\n}\n```\n\
    \nNow if you run the program again, the annual fee for the first three members\
    \ (NormalMember) and the last two members (VIPMember) will be $460 and $1200 respectively.\n\
    \nThis is the result of polymorphism. At run time (i.e. when the program runs),\
    \ the program determines that the first three members of clubMembers are of NormalMember\
    \ type and executes the CalculateAnnualFee() method from that class. It also determines\
    \ that the last two members are of VIPMember type and executes the method from\
    \ that class.\n\nPolymorphism simply means that at run time, the program is smart\
    \ enough to use the CalculateAnnualFee() method from the correct child class even\
    \ when that object is declared to be of Member type.\n\nWe say that the runtime\
    \ type of the first three elements of clubMembers is NormalMember while the runtime\
    \ type of the last two elements is VIPMember. The declared type of all the 5 elements\
    \ is Member.\n\n## GetType() and typeof()\n\nIn the previous example, we let the\
