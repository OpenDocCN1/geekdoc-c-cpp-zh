    \ typeof(VIPMember))\n    Console.WriteLine(\"Yes\");\nelse\n    Console.WriteLine(\"\
    No\");\n```\n\nThe GetType() method returns the runtime type of an object.\n\n\
    The typeof() method takes the name of a data type (e.g. int, float, or the name\
    \ of a class) and returns the type of that, which we can then compare with the\
    \ result of the GetType() method on the left.\n\nIf you run the code above, you'll\
    \ get “No” as the output since clubMembers[0] is not of VIPMember type.\n\n##\
    \ Abstract Classes and Methods\n\nNow that we are familiar with inheritance (and\
    \ polymorphism), let us move on to discuss two special types of \"parent class\"\
    \ in C# - abstract classes and interfaces.\n\nFirst, let's look at abstract classes.\n\
    \nAn abstract class is a special type of class that is created strictly to a base\
    \ class for other classes to derive from. They cannot be instantiated. In other\
    \ words, if FourWheelVehicles is an abstract class, the statement\n\n```csharp\n\
    FourWheelVehicle myVeh = new FourWheelVehicle();\n```\n\nwill give you an error\
    \ as you cannot create an object of an abstract class.\n\nAbstract classes may\
    \ have fields, properties and methods just like any other classes. However, they\
    \ cannot have static members. In addition, abstract classes can have a special\
    \ type of method known as abstract methods. Abstract methods are methods that\
    \ have no body and MUST be implemented in the derived class. They can only exist\
    \ in abstract classes. In a way, an abstract method is like a contract. If you\
    \ want to ensure that any class that inherits its class implements a certain method,\
    \ you can declare the class as an abstract class and the method as an abstract\
    \ method.\n\nTo declare an abstract class, simply add the abstract keyword before\
    \ the keyword class like this:\n\n```csharp\nabstract class Class\n```\n\nTo declare\
    \ an abstract method inside an abstract class, add the abstract keyword before\
    \ the return type, like this:\n\n```csharp\nabstract void AbstractMethod();\n\
    ```\n\nAs abstract methods have no body, we end the declaration with a semicolon\
    \ (;). To implement an abstract method in the derived class, we use the override\
    \ keyword, like this\n\n```csharp\nclass Class\n{\n    public override void AbstractMethod();\n\
    }\n```\n\nThe code below shows an example of an abstract class.\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace Abstract\n{\n    class Program\n  \
    \  {\n        static void Main(string[] args)\n        {\n            AbstractClass\
    \ a = new AbstractClass();\n            a.PrintMessage();\n        }\n    }\n\n\
    \    abstract class AbstractClass\n    {\n        protected string message = \"\
    Hello C!\";\n        public abstract void PrintMessage();\n    }\n\n    class\
    \ AbstractClass : AbstractClass\n    {\n        public override void PrintMessage()\n\
    \        {\n            Console.WriteLine(message);\n        }\n    }\n}\n```\n\
    \n## Interfaces\n\nNext, let's look at interfaces. Interfaces are much like abstract\
    \ classes in that they cannot be instantiated. However, interfaces are more conceptual\
    \ than abstract classes. They cannot contain fields but can contain properties.\n\
    \nOne of the key differences between an abstract class and an interface is that\
    \ a class can only inherit one abstract class but can implement multiple interfaces.\
    \ We won't be showing an example of multiple interfaces as that is beyond the\
    \ scope of this book.\n\nIt is common to start the name of an interface with the\
    \ letter I. All properties and methods in an interface are public, so there is\
