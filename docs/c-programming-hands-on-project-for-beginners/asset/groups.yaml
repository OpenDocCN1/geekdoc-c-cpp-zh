    要使用上面的结构体，我们可以向 `Main()` 中添加以下代码：\n\n```csharp\nmyStruct example = new myStruct(2,\
    \ 3, 5);\nexample.PrintStatement();\n```\n\n如果我们运行代码，我们将得到\n\nx = 3, y = 5, myDays\
    \ = Mon\n\n结构体和类之间有两个主要区别。首先，结构体数据类型不支持继承。因此，你不能从一个结构体派生另一个。然而，结构体可以实现接口。实现方法与类相同。更多信息请参阅第\
    \ 8 章。\n\n"
