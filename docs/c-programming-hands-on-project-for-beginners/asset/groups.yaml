  - "[PAGE 65]\n\n# Properties\n\nNext, let us look at properties.\n\nA property is\
    \ commonly used to provide access to a private field in cases where the field\
    \ is needed by other classes. This may sound like a contradiction. Earlier, we\
    \ mentioned that we use private fields so that other classes do not have access\
    \ to them. If that is the case, why are we allowing access to them via properties?\n\
    \nOne of the main reasons is that using properties gives us greater control over\
    \ what rights other classes have when assessing these private fields. We'll see\
    \ how to do that later.\n\nNow for, let us first learn how to declare a property.\n\
    \nAdd the following lines of code to our Staff class, just after the line private\
    \ int hworked;\n\n```\npublic int Hworked\n{\n    get\n{\n        return hworked;\n\
    \    }\n    set\n{\n        if (value > 0)\n            hworked = value;\n   \
    \     else\n            hworked = 0;\n    }\n}\n```\n\nWe declared our property\
    \ as\n\n```\npublic int Hworked\n{}\n```\n\nThe access modifier is public as we\
    \ want other classes to have access to this property.\n\nThe data type is int\
    \ because this property is used to provide access to the private int field hworked.\
    \ hworked is known as the backing field of the property."
  - "[PAGE 66]\n\nThe name of the property is Hourworked. We normally use PascalCasing\
    \ for property names.\n\nA property contains two special methods known as accessors.\
    \ The first accessor is a getter and the second is a setter.\n\nThe basic getter\
    \ simply returns the value of the private field. Hence, we write\n\n```\n{\n \
    \ return hworked;\n}\n```\n\nwhere hworked is a keyword and hworked is the name\
    \ of the backing field.\n\nThe setter sets the value of the private field. We\
    \ write\n\n```\n{\n  if (value > 0)\n    hworked = value;\n  else\n    hworked\
    \ = 0;\n}\n```\n\nvalue hworked is a keyword when used inside the assignment statement\
    \ when users use the property to set the value of the private field. We'll learn\
    \ how to do that later.\n\nInside the setter, we did a simple check using an 1\
    \ if statement. We checked if value is more than zero. If it is, we assign it\
    \ to hworked. Else, we set hworked to zero. This setter demonstrates how we can\
    \ use properties to control what values can be assigned to our private field.\n\
    \nBy default, getter and setter have the same access level as the property itself\
    \ (public in this case). Hence, we do not need to specify them. However, if you\
    \ do not want the setter to have the same access level as the property, you can\
    \ declare the setter as private so that other classes cannot modify your private\
    \ field:\n\n```\nprivate set\n{\n```"
  - "[PAGE 67]\n\nThe property is then a read-only property outside the Staff class.\
    \ Its value can only be set within within the Staff class itself.\n\n# Auto-implemented\
    \ Properties\n\nNote that in cases where no additional logic is required in the\
    \ getter and setter, C# provides us with a shorthand to declare the property.\
    \ This is known as an auto-implemented property.\n\nTo declare an auto-implemented\
    \ property, we write\n\n```\npublic int Hourworked { get; set; }\n```\n\nThis\
    \ is equivalent to\n\n```\nprivate int Hworked;\npublic int Hourworked\n{\n  \
    \  get\n    {\n        return Hworked;\n    }\n    set\n    {\n        Hworked\
    \ = value;\n    }\n}\n```\n\nWhen you use this shorthand, you do not have to declare\
    \ a private field. The compiler will create an anonymous private backing field\
    \ for you automatically.\n\nIf you want to make the property read-only, you can\
    \ set the setter to private like this:\n\n```\npublic int Hourworked { get; private\
    \ set; }\n```\n\n# Methods\n\nNext, let us look at methods.\n\nA method is a code\
    \ block that performs a certain task.\n\nLet's add a simple method to our Staff\
    \ class."
  - "[PAGE 68]\n\n```\npublic void PrintMessage()\n{\n    Console.WriteLine(\"Calculating\
    \ Pay...\");\n}\n```\n\nThis method is declared as\n\n```\npublic void PrintMessage()\n\
    {}\n```\n\nThe method declaration first states the accessibility level of the\
    \ method. Here we declared the method as public so that the method is accessible\
    \ everywhere in the program (not just within the Staff class).\n\nNext, we state\
    \ the return type of the method. A method may return a certain result after performing\
    \ its task. If the method does not return any result, we use the void keyword\
    \ like in our example.\n\nFinally, we state the name of the method (PrintMessage\
    \ in our example).\n\nThe parenthesis () after the method name is where we include\
    \ the parameters of the method. Parameters are given names to data that we pass\
    \ in to to the method in order to perform its task. If the method requires no\
    \ data (like in our example), we just add a pair of empty parenthesis after the\
    \ method name.\n\nAfter we declare the method, we define what it does inside the\
    \ pair of curly braces that follow. This is known as implementing the method.\
    \ In our example, the PrintMessage() method simply prints the line \"Calculating\
    \ Pay...\"\n\nThat's all there is to the PrintMessage() method.\n\nNext, let us\
    \ move on to a more complex method. This method calculates the pay of each employee\
    \ and returns the result of the calculation. Add the following lines of code to\
    \ Staff.\n\n```\npublic int CalculatePay()\n{\n    PrintMessage();\n\n    int\
    \ staffPay;\n    staffPay = hworked * hourlyRate ;\n```"
  - "[PAGE 69]\n\n```\nif (hWorked > 0)\n    return staffPay;\nelse\n    return 0;\n\
    \n```\n\nThis method is declared as\npublic int CalculatePay()\n{\n\nThe int keyword\
    \ indicates that this method returns a value that is of int type.\n\nInside the\
    \ curly braces, we have the statement\n\n```\nPrintMessage();\n```\n\nThis is\
    \ known as calling the PrintMessage() method. When the program reaches this statement,\
    \ it will execute the PrintMessage() method first and print the line \"Calculating\
    \ Pay...\" before executing the rest of the CalculatePay() method. This example\
    \ demonstrates how you can call one method inside another method.\n\nNext, we\
    \ declare a local variable called staffPay and assign the product of the private\
    \ fields hourlyRate and hWorked to it.\n\nA method can access all the fields and\
    \ properties that are declared inside the class. In addition, it can declare its\
    \ own variables. These are known as local variables and only exist within the\
    \ method. An example is the staffPay variable in our example.\n\nAfter assigning\
    \ the staffPay variable, we use an if statement to determine what result the method\
    \ should return.\n\nA method usually has at least one return statement. return\
    \ is a keyword that is used to return an answer from the method. There can be\
    \ more than one return statement in a method. However, once the method executes\
    \ a return statement, the method will exit.\n\nIn our example, if hWorked is greater\
    \ than zero, the program will execute the statement\n\n```\nreturn staffPay;\n\
    ```"
  - "[PAGE 70]\n\nand exit the method. This return value can then be assigned to a\
    \ variable. For instance, if hworked is 10 and hourlyRate is 20, we can use the\
    \ statement\n\n```\nint pay = CalculatePay();\n```\n\nto assign the result of\
    \ CalculatePay() to the variable pay. The value of pay will then be 200.\n\nOn\
    \ the other hand, if hworked is less than or equal to zero, the program will execute\
    \ the statement\n\n```\nreturn 0;\n```\n\nand exit the method. The value of pay\
    \ will be 0.\n\n# Overloading\n\nC# (and most other languages), you can create\
    \ two methods of the same name as as long as they have different signatures. This\
    \ is known as overloading. The signature of a method refers to the name of the\
    \ method and the parameters that it has.\n\nAdd the following method below the\
    \ CalculatePay() method.\n\n```\npublic int CalculatePay(int bonus, int allowance)\n\
    {\n    PrintMessage();\n\n    if (hworked > 0)\n        return hworked * hourlyRate\
    \ + bonus + allowance;\n    else\n        return 0;\n}\n```\n\nThe signature of\
    \ the first method is CalculatePay() while that of the second method is CalculatePay(int\
    \ bonus, int allowance).\n\nThis second method has two parameters - bonus and\
    \ allowance. It calculates the pay of the employees by adding the values of these\
    \ two parameters to the product of hworked and hourlyRate. In this example, we\
    \ did not use a local variable to store the result of hworked * hourlyRate + bonus\
    \ + allowance. We simply return the result of the computation directly. This is\
    \ perfectly fine. We'll learn how to use this method later."
- md: "\n## The ToString() method\n\nFinally, before we move on to the next section,\
    \ we need to write one more method - the ToString() method.\n\nThe ToString()\
    \ method is a special method that returns a string that represents the current\
    \ class. In C#, all classes come with a pre-defined ToString() method. However,\
    \ it is customary (expected of us) to override this method. Overriding this method\
    \ simply means writing our own version of the method.\n\nTypically, the ToString()\
    \ method that we write displays the values of the fields and properties of the\
    \ class. Add the following code to the staff class:\n\n```c\npublic override string\
    \ ToString()\n{\n    return \"Name of Staff \" + nameOfStaff + \", hourlyRate\
    \ = \" + hourlyRate + \", \" + hWorked;\n}\n```\n\nAs you can see, the ToString()\
    \ method returns a string type. The string that it contains information about\
    \ the staff class. The override keyword in the method declaration indicates that\
    \ this method overrides the default method. We'll discuss more about the override\
    \ keyword in the next chapter.\n\n## Constructors\n\nNow, let us look at constructors.\n\
    \nA constructor is a special method that is used to ‘construct’ an object from\
    \ the class template. It is the first method that is called whenever we create\
    \ an object from our class class. Constructors are commonly used to initialize\
    \ the fields of the class.\n\nA constructor always has the same name as the class\
    \ (Staff in our case) and does not return any value. We do not need to use the\
    \ void keyword when declaring a constructor.\n\nAdd the following lines to our\
    \ Staff class.\n\n```csharp\npublic Staff(string name)\n{\n    nameOfStaff = name;\n\
    \    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"-\");\n\
    }\n```\n\nIn this constructor, we first initialize the field nameOfStaff with\
    \ the string that is passed in to the constructor (name). We then display the\
    \ value of nameOfStaff on the screen and underline it with a series of dashes.\n\
    \nLike other methods, we can have more than one constructor as long as the signature\
    \ is different. We can add another constructor to our class.\n\n```csharp\npublic\
    \ Staff(string firstName, string lastName)\n{\n    nameOfStaff = firstName + \"\
    \ \" + lastName;\n    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"\
    --------------------\");\n}\n```\n\nThis constructor has two parameters - firstName\
    \ and lastName. The first line concatenates the two strings and assigns the resulting\
    \ string to nameOfStaff. The next two lines print nameOfStaff on the screen and\
    \ underline it with a series of dashes.\n\nDeclaring a constructor is optional.\
    \ If you do not declare your own constructor, C# creates one for you automatically.\
    \ The default constructor simply initializes all the fields in the class to default\
    \ values, which is normally zero for numeral fields and empty string for string\
    \ fields.\n\n## Instantiating an Object\n\nNow that we know how to create a class,\
    \ let's look at how we can make use of the class to create an object. This process\
    \ is known as instantiating an object. An object is also known as an instance.\n\
    \nTo recap, our Staff class has the following components:\n\n### Fields\n\n```csharp\n\
    private const int hourlyRate\nprivate string nameOfStaff\nprivate int hWorked\n\
    ```\n\n### Properties\n\n```csharp\npublic int HoursWorked\n```\n\n### Methods\n\
    \n```csharp\npublic void PrintMessage()\npublic int CalculatePay()\npublic int\
    \ CalculatePay(int bonus, int allowance)\npublic override string toString()\n\
    ```\n\n### Constructors\n\n```csharp\npublic Staff(string name)\npublic Staff(string\
    \ firstName, string lastName)\n```\n\nWe shall instantiate a Staff object in the\
    \ Main() method inside the Program class.\n\nThe syntax for instantiating an object\
    \ is\n\nClassName objectName = new ClassName(arguments);\n\nAdd the following\
    \ lines inside the curly braces of the Program class.\n\n`int pay;`\n\n```csharp\n\
    staff1 = new Staff(\"Peter\");\nstaff1.HoursWorked = 160;\npay = staff1.CalculatePay(1000,\
    \ 400);\nConsole.WriteLine(\"Pay = {0}\", pay);\n```\n\nHere, we use the first\
    \ constructor (with one parameter) to create our staff1 object.\n\nOnce we create\
    \ the object, we can use the dot operator after the object's name to access any\
    \ public field, property or method in the Staff class. Note that we need to use\
    \ the dot operator here as we are trying to access members of the Staff class\
    \ from the Program class. The dot operator is necessary whenever we want to access\
    \ a field, property or method from another class.\n\nIf you are accessing members\
    \ of the same class, you do not need to use the dot operator. An example is when\
    \ we called the PrintMessage() method from the CalculatePay() method earlier.\
    \ We did not use the dot operator as both methods are from the same class.\n\n\
    After creating our staff1 object, the next line shows how we can use the public\
    \ EmployeeType property to assign a value to the worked field.\n\n`staff1.HoursWorked\
