  - '[PAGE 108]


    then printed onto the screen using the Console.WriteLine() method.


    Finally, after we finish reading the file, we close the file so that other programs
    may use it. You should always close your file once you no longer need it.


    ```

    sr.Close();

    ```


    That''s it. That''s how you read a text file in C#. Pretty straightforward right?


    However, there is one problem with the code above. This code will generate an
    error if the file "myFile.txt" cannot be found. We have two options here.


    # Option 1: try...catch


    The first option is to use a try...catch statement as shown below:


    ```

    1 try

    2 {

    3     using (StreamReader sr = new StreamReader(path))

    4     {

    5      while (sr.EndOfStream)

    6      {

    7          Console.WriteLine(sr.ReadLine());

    8      }

    9      sr.Close();

    10  }

    11 catch (FileNotFoundException e)

    12 {

    13     Console.WriteLine(e.Message);

    14 }

    ```


    From 1 to 11, we try to open, read and close the file in the try block.


    From 11 to 14, we use a catch block to catch the FileNotFoundException exception
    if the file is not found. Inside the catch block, we print an error statement
    to inform users that the file is not found.


    # Option 2: File.Exists()


    The second method to deal with a "file not found" scenario is to use the Exists()
    method in the File class. As the name suggests, the Exists() method checks if
    a file exists. The File class is a pre-written class in the System.IO namespace
    that provides static methods for the creation, copying, deletion, moving, and
    opening of a single file.'
