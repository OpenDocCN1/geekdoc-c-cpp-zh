    ## Chapter 1: Introduction to C#


    Welcome to C# programming and thank you so much for picking up this book!


    Whether you are a seasoned programmer or a complete novice, this book is written
    to help you learn C# programming fast. Topics are carefully selected to give you
    a broad exposure to C# while not overwhelming you with information overload.


    By the end of the book, you should have no problem writing your own C# programs.
    In fact, we will be coding a simple payroll software together as part of the project
    at the end of the book. Ready to start?


    First, let''s answer a few questions:


    ## What is C#?


    C#, pronounced as C Sharp, is an object-oriented programming language developed
    by Microsoft in the early 2000s, led by Anders Heisenberg. It is part of the .Net
    framework and is intended to be a simple general-purpose programming language
    that can be used to develop different types of applications, including console,
    windows, web and mobile applications.


    Like all modern programming languages, C# code resembles the English language
    which computers are unable to understand. Therefore, C# code has to be converted
    into machine language using what is known as a compiler (refer to footnote). The
    compiler that we will be using in this book is the free Visual Studio Community
    2017 provided by Microsoft.


    ## Why Learn C#?


    C# has syntax and features that resemble other programming languages like Java
    and C++. As such, if you have any prior programming experience, you will find
    learning C# a breeze. Even if you are totally new to programming, C# is designed
    to be easy to learn (unlike C or C++) and is a great first language to learn.


    In addition, C# is part of the .Net framework. This framework includes a large
    library of pre-written code that programmers can use without having to write everything
    from scratch. This allows programmers to rapidly develop their applications in
    C#, making C# the ideal language to work with if you are on a tight schedule.


    Lastly, C# is an object-oriented programming (OOP) language. Object-oriented programming
    is an approach to programming that breaks a programming problem into objects that
    interact with each other. We''ll be looking at various object-oriented programming
    concepts in this book. Once you master C#, you will be familiar with these concepts.
    This will make it easier for you to master other object-oriented programming languages
    in future.


    Ready to dip your toes into the world of C# programming? Let''s get started.


    Footnote:

    The conversion of a C# program into machine language is actually a bit more complicated
    than this. Visual Studio Community merely converts a C# program into IL, which
    stands for Microsoft Intermediate Language. The IL code is then converted into
    machine language by a virtual execution system known as the Common Language Runtime.
    For more information, you can check out https://msdn.microsoft.com/.


    ## Chapter 2: Getting ready for C#


    ### Installing Visual Studio Community


    Before we can start developing C#, we need to download Visual Studio Community.
    In fact, VSC is more than just a compiler. It is an Integrated Development Environment
    (IDE) that includes a text editor for us to write code and a debugger to help
    identify errors. To download VSC, go to https://www.microsoft.com/vs/community/.


    ### Your First Program


    To write our first program, let''s create a folder on our desktop and name it
    "C# Projects". We will save all C# projects to this folder. Next, launch VSC and
    select File > New > Project. The first program we are going to write is a console
    application. Console applications refers to programs that have no graphical user
    interface.


    From the New Project dialog box, select C# (on the left) and select "Console App
    (. Framework)" in the main box. Name this program "HelloWorld" and save it in
    the "C# Projects" folder created earlier. Finally, click OK to create the project.


    You will be presented with a default template that VSC created for you. Replace
    the code in the template with the code below. Note that line numbers are added
    for reference and are not part of the actual code. You may want to bookmark this
    page for reference when we discuss the program.


    ```

    1 using System;

    2 using System.Collections.Generic;

    3 using System.Linq;

    4 using System.Text;

    5 using System.Threading.Tasks;

    6

    7 namespace HelloWorld

    8 {

    9

    10     // A Simple Program to display the words Hello World

    11     class Program

    12     {

    13         static void Main(string[] args)

    14         {

    15             Console.WriteLine("Hello World");

    16             Console.Read();

    17         }\}

    ```


    I strongly encourage you to type the code yourself to get a better feel for how
    VSC works. As you type, you will notice that a box appears near the cursor with
    some help messages occasionally. That is known as IntelliSense. For instance,
    when you type a period (.) after the word "Console", a dropbox list appears to
    let you know what you can type after the period. This is one of the features of
    VSC to make coding easier for programmers.


    After you typing, you can execute this program by clicking on the “Start” button
    at the top menu (refer to image below).

