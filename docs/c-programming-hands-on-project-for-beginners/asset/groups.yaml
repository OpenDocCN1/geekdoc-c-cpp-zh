    ## 第 1 章：C# 简介


    欢迎学习 C# 编程，非常感谢你选择这本书！


    无论你是资深程序员还是完全的初学者，这本书的编写都是为了帮助你快速学习 C# 编程。书中主题经过仔细挑选，旨在让你广泛接触 C#，同时不会因信息过载而让你感到压力。


    读完本书后，你应该能够毫无问题地编写自己的 C# 程序。事实上，我们将在书末项目中一起编写一个简单的工资软件。准备好开始了吗？


    首先，我们来回答几个问题：


    ## 什么是 C#？


    C#（读作 C Sharp）是微软公司在 Anders Heisenberg 的领导下于 21 世纪初开发的一种面向对象的编程语言。它是 .Net 框架的一部分，旨在成为一种简单的通用编程语言，用于开发不同类型的应用程序，包括控制台、Windows、Web
    和移动应用程序。


    与所有现代编程语言一样，C# 代码类似于英语，但计算机无法理解这种语言。因此，C# 代码必须通过所谓的“编译器”（参见脚注）转换为机器语言。我们在书书中将使用的编译器是微软提供的免费版
    Visual Studio Community 2017。


    ## 为什么要学习 C#？


    C# 的语法和特征与 Java、C++ 等其他编程语言相似。因此，如果你有任何编程经验，你会发现学习 C# 是一如举反的。即使你对编程完全一陌生，C# 的设计也非常易于学习（不像
    C 或 C++），是一门非常棒的入门语言。


    此外，C# 是 .Net 框架的一部分。该框架包含了大量的预写代码库，程序员可以使用它们，而无需从头开始编写一切。这允许程序员在 C# 中快速开发应用程序，如果你时间紧迫，C#
    是你进行工作的的理想语言。


    最后，C# 是一种面向对象编程（OOP）语言。面向对象编程是一种编程方法，它将编程问题分解为相互作用的各个。我们将在书中介绍各种面向对象的编程概念。一旦你掌握了
    C#，就会熟悉这些概念。这将使你未来更容易掌握其他面向对象的编程语言。


    准备好涉足 C# 编程的世界了吗？让我们开始吧。


    脚注：

    将 C# 程序转换为机器语言实际上比这要稍微复杂一点。Visual Studio Community 仅将 C# 程序转换为 IL，代表微软中间语言（Microsoft
    Intermediate Language）。然后，IL 代码由一个称为通用语言运行时（Common Language Runtime）的虚拟执行系统转换为机器语言。欲了解更多信息，可以访问
    https://msdn.microsoft.com/。


    ## 第 2 章：为 C# 准备


    ### 安装 Visual Studio Community


    在我们开始开发 C# 之前，需要下载 Visual Studio Community。事实上，VSC 不仅仅是一个编译器。它是一个集成开发环境（IDE），包含一个供我们编写代码的文本编辑器和一个帮助识别错误的调试器。要下载
    VSC，请访问 https://www.microsoft.com/vs/community/。


    ### 你的第一个程序


    为了编写第一个程序，让我们在桌面上创建一个文件夹并命名为“C# Projects”。我们将所有的 C# 项目都存在这个文件夹中。接下来，启动 VSC 并选择文件
    > 新建 > 项目。我们要写的第一个程序是控制台应用程序。控制台应用程序指的是没有图形界面的程序。


    在新建项目对话框中，在左侧选择 C#，然后在主框中选择“控制应用 (. Framework)”。将此程序命名为“HelloWorld”，并保存到之前创建的“C#
    Projects”文件夹中。最后，点击确定创建项目。


    你将看到 VSC为你生成的默认模板。将模板中的代码替换为下面的代码。注意，行号是为了参考，不是代码的一部分。在我们讨论该程序时，你可能想标记此页面以便参考。


    ```

    1 using System;

    2 using System.Collections.Generic;

    3 using System.Linq;

    4 using System.Text;

    5 using System.Threading.Tasks;

    6

    7 namespace HelloWorld

    8 {

    9

    10     // 一个显示 Hello World 的简单程序

    11     class Program

    12     {

    13         static void Main(string[] args)

    14         {

    15             Console.WriteLine("Hello World");

    16             Console.Read();

    17         }\}

    ```


    我强烈建议你亲自输入代码，以更好地感受 VSC 的工作方式。当你输入代码时，你会注意到光标附近偶尔会出现一个带有帮助消息的框。这被称为 IntelliSense（智能感知）。例如，当你在
    "Console" 单词后输入点（.）时，会出现一个下拉列表，让你知道点号之后可以输入什么。这是 VSC 为程序员使编码更便利的功能之一。


    输入完成后，你可以通过点击顶部菜单上的“启动”按钮来运行此程序（见下图）。


    '
