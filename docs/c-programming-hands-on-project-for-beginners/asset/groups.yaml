    ```


    你的数学老师可能会对你生气，因为 `x` 不等于 `y`。


    然而，在编程中，这是好的。这条语句意味着我们将 `y` 的值赋值给 `x`（将其想成 `x <-`）。将一个变量的值赋值给另一个变量是可以的。在我们的示例中，`x`
    的值保持不变。换句话说，现在 `x = 10` 且 `y` 变成了 10。


    现在假设我们将 `x` 和 `y` 的值改回


    ```

    x = 5; y = 10;

    ```


    如果你现在写：


    ```

    y = x;

    ```


    这意味着你将 `x` 的值赋值给 `y`（将其想成 `y <-`）。


