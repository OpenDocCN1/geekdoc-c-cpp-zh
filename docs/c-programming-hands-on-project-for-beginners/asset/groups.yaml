    相反，“Hello”在计算机内存的其他地方创建并存储。变量 `message` 存储该内存位置的地址。


    这就是我们目前对引用类型的所有了解。由于这是一本书，我们将详细介绍为什么我们需要引用类型。只需注意值类型和引用类型之间存在区别；前者存储值，而后者存储地址。


