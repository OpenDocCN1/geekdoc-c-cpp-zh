    \n```csharp\nList<int> myList2 = ReturnUserInputList();\n```\n\n## 使用 params 关键字\n\
    \n接下来，让我们探索 `params` 关键字。当我们不知道一个方法有多少个参数时，`params` 关键字非常有用。例如，我们可能有一个方法可以打印一系列名字，但我们事先不知道有多少个名字。在这种情况下，我们可以使用数组作为参数，并在其前面添加\
    \ `params` 关键字。\n\n示例下：\n\n```csharp\npublic void PrintNames(params string[] names)\n\
    {\n    for (int i = 0; i < names.Length; i++)\n    {\n        Console.Write(names[i]\
    \ + \" \");\n    }\n    Console.WriteLine();\n}\n```\n\n要使用此方法，我们可以传递任意数量的字符串。\n\
