    \ memberSince)\n    {\n        Console.WriteLine(\"Child Constructor with 3 parameters\"\
    );\n    }\n\n    public void CalculateAnnualFee()\n    {\n        annualFee =\
    \ 1200;\n    }\n}\n```\n\nThis class has one constructor (with 3 parameters) and\
    \ one method CalculateAnnualFee(). The CalculateAnnualFee() method here uses a\
    \ different formula for calculating annual fee from the CalculateAnnualFee() method\
    \ in the NormalMember class. It is alright for the two methods to share the same\
