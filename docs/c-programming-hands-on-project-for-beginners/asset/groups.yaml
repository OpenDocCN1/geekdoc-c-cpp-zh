    \ convenient way is to prepare the needed information as an external file and\
    \ get our programs to read the information from the file.\n\nC# provides us with\
    \ a number of classes to work with files. The classes that we are going to look\
    \ at in this chapter are the File, StreamWriter and StreamReader classes. All\
    \ three classes are available in the System.IO namespace. To use the methods in\
