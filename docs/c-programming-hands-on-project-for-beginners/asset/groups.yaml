    ```\n"
  mdcn: "\n我们从 `Member` 类派生了两个类——`NormalMember` 和 `VIPMember`。\n\n首先，让我们声明子类 `NormalMember`。我们使用冒号\
    \ (:) 表示它派生自 `Member` 类，如下所示\n\n```csharp\nclass NormalMember : Member\n{\n}\n\
    ```\n\n现在，我们需要为子类编写构造函数。子类的构造函数基于父类的构造函数。每当我们创建一个对象时，父类的构造函数总是会被调用。\n\n创建子构造函数有两种方法。第一种像声明其他构造函数一样简单声明。\n\
    \n```csharp\npublic NormalMember()\n{\n    Console.WriteLine(\"Child constructor\
    \ with no parameter\");\n}\n```\n\n当我们像上面那样声明构造函数时，C# 会父类中查找无参数构造函数（即没有参数的构造函数），并在执行子构造函数代码之前调用它。如果你使用此构造函数创建子对象，屏幕上将显示以下两行：\n\
    \nParent Constructor with no parameter\nChild constructor with no parameter\n\n\
    第一行来自父类构造函数，第二行来自子类构造函数。\n\n声明子构造函数的第二种方法是使用冒号 `()` 和 `base` 关键字来调用父类中的非无参数构造函数。示例所示：\n\
    \n```csharp\npublic NormalMember(string remarks) : base (\"Jamie\", 1, 2015)\n\
    {\n    Console.WriteLine(\"Remarks = {0}\", remarks);\n}\n```\n\n当我们调用父类中的非无参数构造函数时，我们需要向其参数传递值。在上面的示例中，我们将值\
    \ \"Jamie\"、1 和 2015 传递给父类构造函数。这些值随后被分别赋值给基类中的 `name`、`memberID` 和 `membersSince`\
    \ 字段。\n\n在这个示例中，我们向基构造函数传递了固定值参数。然而，更好的方法是通过子构造函数传递参数。下面的示例显示了如何实现。将之前的构造函数替换为下面的构造函数：\n\
    \n```csharp\npublic NormalMember(string name, string remarks, int memberID, int\
    \ memberSince) : base (name, memberID, memberSince)\n{\n    Console.WriteLine(\"\
    Child Constructor with 4 parameters\");\n    Console.WriteLine(\"Remarks = {0}\"\
    , remarks);\n}\n```\n\n这个新构造函数有四个参数。第一个参数是一个名为 `remarks` 的字符串参数。该参数在子构造函数内部使用。\n\
    \n第二个和第四个参数在子构造函数内部未使用。相反，它们根据名称作为参数传递给父类构造函数。例如，子构造函数中的第二个参数 (string name) 被作为父构造函数的第一个参数\
    \ (name)。\n\n当我们使用此构造函数创建对象时，我们编写如下代码：\n\n```csharp\nNormalMember myChildMember\
    \ = new NormalMember(\"Special Rate\", \"James\", 1, 2010);\n```\n\n带有 3 个参数的基构造函数被首先调用并执行。值\
    \ \"James\"、1 和 2010 被分配给基构造函数。在底层，这些值被分别赋值给基类中的 `name`、`memberID` 和 `membersSince`\
    \ 字段。\n\n执行基构造函数后，将执行子构造函数。字符串 \"Special Rate\" 被赋值给 `remarks` 并显示在屏幕上。\n\n当你运行代码时，将得到以下输出\n\
    \n```\nParent Constructor with 3 parameters\nChild Constructor with 4 parameters\n\
    Remarks = Special Rate\n```\n\n现在我们已经为子类创建了构造函数，让我们继续创建一个方法来计算普通会员的年费。代码如下：\n\n\
    ```csharp\npublic void CalculateAnnualFee()\n{\n    annualFee = 100 + 12*30;\n\
    }\n```\n\n每当我们在上面的代码中编写 \"annualFee\" 时，我们都在访问父类中的受保护字段 `annualFee`。还记得子类可以访问其父类中的所有公共和受保护字段吗？因此，子类可以使用该字段，就像它是自己的一样。子类不需要创建父类的实例来访问其受保护字段。\n\
    \n我们的子类 `NormalMember` 就到此为止。该类包含以下内容：\n\n### 字段\n继承自父类：\n- protected int annualFee\n\
    \n### 方法\n在子类中声明：\n- public void CalculateAnnualFee()\n\n### 构造函数\n- public NormalMember()\n\
    - public NormalMember(string remarks, string name, int memberID, int memberSince)\n\
    \n接下来，让我们写另一个继承自 `Member` 的类。这次，派生类被称为 `VIPMember`。代码所示：\n\n```csharp\nclass VIPMember\
    \ : Member\n{\n    public VIPMember(string name, int memberID, int memberSince)\
    \ : base\n    (name, memberID, memberSince)\n    {\n        Console.WriteLine(\"\
    Child Constructor with 3 parameters\");\n    }\n\n    public void CalculateAnnualFee()\n\
    \    {\n        annualFee = 1200;\n    }\n}\n```\n\n该类有一个构造函数（带有 3 个参数）和一个方法 `CalculateAnnualFee()`。这里的\
    \ `CalculateAnnualFee()` 方法使用的计算年费的公式与 `NormalMember` 类中的 `CalculateAnnualFee()`\
    \ 方法不同。这两个方法共享相同的名称（和签名）是可以的，因为它们位于不同的类中。\n\n`VIPMember` 类包含以下内容：\n\n### 字段\n\
    继承自父类：\n- protected int annualFee\n\n### 方法\n继承自父类：\n- public override string\
    \ ToString()\n\n在子类中声明：\n- public void CalculateAnnualFee()\n\n### 构造函数\n- public\
    \ VIPMember(string name, int memberID, int memberSince)\n\n## Main() 方法\n\n现在我们已经有了需要的三个类，让我们为\
    \ `Main()` 方法编写代码。\n\n首先，我们从两个派生类中创建两个对象。\n\n```csharp\nNormalMember mem1 = new\
    \ NormalMember(\"Special Rate\", \"James\", 1, 2010);\nVIPMember mem2 = new VIPMember(\"\
    Andy\", 2, 2011);\n```\n\n`mem1` 使用 `NormalMember` 类中的 4 参数构造函数创建。\n`mem2` 使用\
    \ `VIPMember` 类中的 3 参数构造函数创建。\n\n接下来，我们将使用各自所在类中的 `CalculateAnnualFee()` 方法。\n\
    \n```csharp\nmem1.CalculateAnnualFee();\nmem2.CalculateAnnualFee();\n```\n\n由于\
    \ `mem1` 是 `Normal` 类的实例，因此执行了该类的 `CalculateAnnualFee()` 方法。因此 `mem1` 的年费为 100\
    \ + 12*30 = 460。对于 `mem2`，年费是 1200。\n\n最后，让我们使用父类的 `toString()` 方法来显示信息。我们编写\n\
    \n```csharp\nConsole.WriteLine(mem1.ToString());\nConsole.WriteLine(mem2.ToString());\n\
    ```\n\n由于 `toString()` 方法属于父类且是公共的，`mem1` 和 `mem2` 都能使用它。当你运行程序时，将得到以下输出\n\n```\n\
    Name: James\nMember ID: 1\nMember Since: 2010\nTotal Annual Fee: 460\nName: Andy\n\
    Member ID: 2\nMember Since: 2011\nTotal Annual Fee: 1200\n```\n\n## 多态\n\n现在我们已经看到了继承的示例，让我们转向另一个与继承密切的话题——多态。解释多态的最佳是通过示例。让我们扩展我们的健身俱乐部示例。\n\
    \n首先，删除 `Main()` 方法中的所有代码并添加以下行：\n\n```csharp\nMember[] clubMembers = new Member[5];\n\
    \nclubMembers[0] = new NormalMember(\"Special Rate\", \"James\", 1, 2010);\nclubMembers[1]\
    \ = new VIPMember(\"Normal Rate\", \"Andy\", 2, 2011);\nclubMembers[2] = new NormalMember(\"\
    Normal Rate\", \"Bill\", 3, 2011);\nclubMembers[3] = new NormalMember(\"Carol\"\
    , 4, 2012);\nclubMembers[4] = new VIPMember(\"Evelyn\", 5, 2012);\n```\n\n在这里，我们声明了一个\
    \ `Member` 类型的数组并向其添加了五个成员。前三个成员是 `NormalMember` 类的实例，而最后两个是 `VIPMember` 类的实例。\n\
    \n尽管 `clubMembers` 被声明为 `Member` 类型数组，但我们可以将 `NormalMember` 和 `VIPMember` 的实例赋值给它，因为它们都是\
    \ `Member` 类的子类。我们不需要为 `NormalMember` 和 `VIPMember` 对象分开数组。\n\n接下来，我们将使用 `foreach`\
    \ 循环计算每个成员的年费并显示信息。这样做，我们编写\n\n```csharp\nforeach (Member m in clubMembers)\n\
    {\n    m.CalculateAnnualFee();\n    Console.WriteLine(m.ToString());\n}\n```\n\
    \n如果你在这个阶段尝试运行程序，你将得到一个错误，说 `Member` 不包含 `CalculateAnnualFee` 的定义。这是因为 `clubMembers`\
    \ 被声明为 `Member` 类型的数组。因此，当我们编写 `m.CalculateAnnualFee()` 时，编译器尝试执行 `Member` 类中的\
    \ `CalculateAnnualFee()` 方法。出现错误的原因是我们的 `Member` 父类中没有这样的方法；它只在两个子类中。为了纠正这个错误，我们必须向我们的父类中添加以下方法。\n\
    \n```csharp\npublic virtual void CalculateAnnualFee()\n```\n"
