- img_proc: true
  md: 'Most of the time, we use int instead of byte for integral numbers. However,
    if you are programming for a machine that has limited memory space, you should
    use byte space if you are certain the value of the variable will not exceed the
    0 to 255 range.


    For instance, if you need to store the age of a user, you can use the byte data
    type as it is unlikely that the user''s age will ever exceed 255 years old.


    # float


    float refers to floating point numbers, which are numbers with decimal places
    such as 12.43, 5.2 and -9.12.


    float can store numbers from -3.4 x 10³⁸ to +3.4 x 10³⁸. It uses 8 bytes of storage
    and has a precision of approximately 7 digits. This means that if you use float
    to store a number 1.23456789 (10 digits), the number will be rounded off to 1.234568
    (7 digits).


    # double


    double is also a floating point number, but can store a much wider range of numbers.
    It can store numbers from +/-5.0 x 10⁻³²⁴ to +/-1.7 x 10³⁰⁸ and has a precision
    of about 15 to 16 digits.


    double is the default floating point data type in C#. In other words, if you write
    a number like 2.34, C# treats it as a double by default.


    # decimal


    decimal stores a decimal number but has a smaller range than float and double.
    However, it has a much greater precision of approximately 28-29 digits.


    If your program requires a high degree of precision when storing non integral
    numbers, you should use a decimal data type. An example is when you are writing
    a financial application where precision is very important.


    # char


    char stands for character and is used to store single Unicode characters such
    as ''A'', ''%'', ''@'' and ''p'' et.'
