    Specifically, we will learn about the if statement, the inline if statement, the
    switch statement, for the loop, the foreach loop, the while loop and the do loop.
    In addition, we will also learn about the try-catch-finally statement that controls
    the flow of the program when an error occurs.


    However, before we go into these control tools, we have to first look at condition
    statements.


    # Condition Statements


    Most control flow statements involve evaluating a condition statement. The program
    will proceed differently depending on whether the condition is met.


    The most common condition statement is the comparison statement. If we want to
    compare whether two variables are the same, we use the == sign (=). For instance,
    if you write x = y, you are asking the program to check if the value of x is equal
    to the value of y. If they are equal, the condition is met and the statement evaluates
    to true. Else, the statement evaluates to false.


    In addition to evaluating one value is equal to another, there are other comparison
    operators that we can use in condition statements.


    # Not equal (!=)


    Returns true if the left is not equal to the right


    +   5 != 2 is true

    6 != 6 is false


    # Greater than (>)'
