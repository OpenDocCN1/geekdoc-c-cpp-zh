  md: "# Passing Value Type vs Reference Type Parameters\n\nI hope you now have a\
    \ good understanding of how classes and methods work. Before we end this chapter,\
    \ I'd like to revisit the concept of value data types and reference data types.\
    \ In Chapter 4, we learnt that there are two main categories of data types in\
    \ C# - value types and reference types. There is a difference when you pass in\
    \ a value type variable to a method vs a reference type variable.\n\nWhen you\
    \ pass in a value type variable, any change made to the value of that variable\
    \ is only valid within itself itself. Once the program exits the method, the change\
    \ is no longer valid.\n\nOn the other hand, if you pass in a reference type variable,\
    \ any change made to the variable is valid even after the method ends.\n\nConsider\
    \ the class below:\n\n```\nclass MethodDemo\n{\n    public void PassByValue(int\
    \ a)\n    {\n        a = 10;\n        Console.WriteLine(\"inside method = {0}\"\
    , a);\n    }\n\n    public void PassByReference(int[] b)\n    {\n        b[0]\
    \ = 5;\n        Console.WriteLine(\"b[0] inside method = {0}\", b[0]);\n    }\n\
    }\n```\n\nWithin the class, we have two methods. The first method accepts a value\
    \ type variable and tries to change the value of that variable. It then prints\
    \ the value of the variable.\n\nThe second method accepts an array (reference\
    \ type) and tries to change the value of the first element in the array. It then\
    \ prints the value of that element.\n\nIn our Main() program, suppose we have\
    \ the following lines of code:\n\n```\nint a = 2;\n```"
