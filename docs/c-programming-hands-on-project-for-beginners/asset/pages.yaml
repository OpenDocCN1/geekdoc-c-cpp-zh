    t program to evaluate a certain condition is met, and to perform the appropriate

    action based on the result of the evaluation. The structure of an if statement
    is as

    follows (line numbers added for reference):


    ```

    1   if (condition 1 is met)

    2       {

    3           do Task A

    4       }

    5   else if (condition 2 is met)

    6       {

    7           do Task B

    8       }

    9   else if (condition 3 is met)

    10      {

    11          do Task C

    12  }

    13  else

    14      {

    15          do Task E

    16  }

    ```


    Line 1 tests the first condition. If the condition is met, everything inside the
    pair of

    curly braces that follow (lines 2 to 4) will be executed. The rest of the if statement

    (from line 5 to 16) will be skipped.


    If the first condition is not met, you can use the else if statements that follow
    to test

    more conditions (lines 5 to 12). There can be multiple else if statements. Finally,

    you can use the else statement (lines 13 to 16) to execute some code if none of
    the

    preceding conditions are met.'
