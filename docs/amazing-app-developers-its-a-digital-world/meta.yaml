  md: '# APPS ARE EVERYWHERE


    It''s a rainy Saturday. You check the weather on your smartphone. It says it''s
    going to rain all day. You pass the time playing Angry Birds. Later, you''re watching
    YouTube videos on your tablet when a classmate sends you a message. She asks you
    to work on a school project with her. You open Google Classroom on your laptop
    and start collaborating.


    All of these activities are examples of things you can do using software applications,
    or apps. You can use apps on nearly any computer, web browser, smartphone, or
    mobile device. There are apps for just about everything, from playing music to
    buying clothes to tracking airplane flights.


    App developers are the people who design and build the cool apps you use every
    day. They are always coming up with new ideas to make electronic devices even
    more useful and fun. Have you thought of becoming an app developer?'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# CHAPTER 1

    WHAT IS AN APP DEVELOPER?


    App developers create, design, develop, and test apps.


    They make games, word processors, and other applications for computers and mobile
    devices. Many app developers enjoy building things and have lots of creative ideas.
    They look for ways to solve problems, make life easier, or just have fun apps.


    Most app developers have a college degree in computer science, software engineering,
    or mobile application development. They usually have a strong interest in math
    and science and like to solve problems. Designing an app requires excellent planning
    and attention to detail. App developers need to think about every possible way
    people will want to use an app. Then they make sure the app can do those things.


    There are many elements that go into building an app. So, app developers sometimes
    work with people who specialize in other fields. These people may include software
    and data'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'The average salary for an app developer is about $70,000 to 90,000 per year.


    specialists to make the app function the way it should. Graphic designers help
    make sure the app looks good. Subject matter experts understand the industry an
    app is being designed for. They make sure the app meets the needs of the people
    who will be be using it. Although many people collaborate on producing an app,
    it all begins with the app developer.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# CHAPTER 2

    WHAT AN APP DEVELOPER DOES


    **App developers can work in different ways.** Sometimes they come up with their
    own ideas for apps. Other times they work for a company or client that has a special
    need.


    An app developer spends a lot of time planning an app and each action it needs
    to perform. He or she creates flowcharts showing everything the app will do. Only
    after every detail of the app is planned does the developer start building the
    app.


    Apps run on devices that contain computers. So, a big part of building an app
    is writing computer **code**. Computer code tells the computer what to do. Computer
    code has to be very precise. If even a single character is wrong, some or all
    of the app''s functions might not work.


    ![](img/232d886dd054577f285595f57fc12c44_11_0.png)


    App developers will sometimes share their computer code. Other people can then
    use it to build more apps. This is called "open source" software.


    App developers test their work often. Sometimes, they work with'
  merge: -1
  pgno: 11
- img_proc: true
  md: '> App developers often make wireframes when designing apps. These are mock-ups
    of how the app will look.


    people who test apps for them. Then errors in the code can be fixed before the
    app''s release.

    After the app is released, users can give the developer feedback. This could be
    about problems with using the app. Users can also suggest ideas for improving
    the app. The developer will then update the app based on the feedback.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# CHAPTER 3

    APP SOFTWARE


    **App developers need to know how to use many different types of software.** Every
    computer, smartphone, and tablet has an operating system (OS). This is the software
    that manages all of the applications and **hardware** on a computer or device.
    The OS performs tasks such as organizing files, connecting to printers and **networks**,
    and running apps.


    Microsoft Windows, Apple macOS, Apple iOS, and Google Android are examples of
    OSs. Some apps work on one OS, while others work on more than one. Before building
    an app, the developer needs to know which OSs it will need to run on.


    App developers build apps with programming languages that the OSs can understand.
    Two commonly used ones are Python and Java. They are cross-platform. This means
    an app can be built on one OS and run on one or more other OSs. Spotify and YouTube
    use Python. Java is the official language for Android development.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '> There are hundreds of coding languages. New programming languages are being
    developed all the time.


    Another programming language used for apps is HTML5. Apps built with HTML5 are
    web based. This means they are run by internet browsers, rather than by the OS
    directly. Web-based apps work on any OS that has an internet browser, such as
    Safari, Google Chrome, or Firefox. For example, Google Docs is a web-based app
    built using HTML5.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# CHAPTER 4 APP DEVELOPER JOBS


    **Many companies hire app developers.** Some, such as Amazon and Google, are really
    big. An app developer at these companies could be just one of many people working
    on a team. Team members **collaborate** on ideas. Then each person works on one
    aspect of an app, such as the **code** or **graphic** design. Communication skills
    are very important for an app developer. Each person on a team needs to be able
    to talk clearly about their ideas for the app. And they need to listen to other
    people’s ideas so they can successfully work together.


    ![](img/232d886dd054577f285595f57fc12c44_15_0.png)


    > Google''s headquarters is in Mountain View, California. The company is consistently
    ranked as the best workplace in the world.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'A smaller company might have just one app developer. This app developer consults
    with other people in the company about what the company’s apps should do. Then
    he or she designs and develops the apps. Other app developers don''t work for
    a company at all. Instead, these app developers come up with their own ideas and
    create independent apps.


    Many large technology companies, such as Apple and Android, offer app development
    software to the public. These programs are called integrated development environments
    (IDEs). An IDE includes the basic tools an app developer needs to design, build,
    and test an app. Anyone can use these programs to build apps.


    MOBILE APP DEVELOPERS

    Mobile developers build apps for devices such as smartphones and tablets. There
    are many challenges to creating apps for these devices. The apps need to work
    and look good on different screen sizes and different mobile OSs. Mobile apps
    also use less memory and battery power than apps for computers. And people use
    mobile devices by touching the screens, rather than using separate keyboards and
    mice. The buttons and other elements on the screen need to be easy to see and
    tap.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# CHAPTER 5

    APP BEGINNINGS


    Whether working at companies or independently, app developers have only been around
    since the 1980s.


    This is when the first devices with apps came out. These devices were called personal
    digital assistants (PDAs).


    PDAs were handheld computers that had simple operating systems and a few apps.
    PDA apps helped users do tasks that human assistants would normally do. These
    included putting events in a calendar, creating documents, and sending emails.


    In the 1990s, cell phones with apps started being introduced. Each company that
    built a new cell phone wanted to outdo its competitors. Companies started adding
    games and other features to their phones to attract customers. These were the
    first phone apps. At this time, apps were part of a cell phone''s OS. They came
    on the phone and people could not add more.


    A breakthrough in app development came in 1997 from electronics company Nokia.
    Nokia had just developed a new cell'
  merge: -1
  pgno: 17
- img_proc: true
  md: '![](img/232d886dd054577f285595f57fc12c44_18_0.png)


    The Motorola DynaTAC 8000x was the first cell phone available to the public. It
    was released in 1983 and cost $3,995!'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'phone OS. The company wanted to add something fun for people to do with their
    phones. It decided to include a game app on its phones.


    Nokia software developer Taneli Armando created the game. It was no easy task.
    People were used to computer games that had music, sound effects, and colorful
    graphics. This type of game would require way too much memory to fit on the phone''s
    OS.


    Armando would need to make a game that was just as interesting and fun to play,
    but had fewer features. The developer faced other challenges too. The phone had
    a low-resolution screen and slow processor speed. This meant the game had to be
    simple.


    Armando decided to adapt popular video game Blockade for the Nokia phone. He called
    the new game Snake. In the game, players used the phone''s number pad keys to
    move a snake into little squares. The squares represented food. Each time the
    snake entered a square, it got bigger. Snake was a hit! People instantly became
    addicted to the concept of mobile games.


    A new technology standard was developed in 1999. It was called wireless application
    protocol (WAP). WAP allowed mobile'
