  md: '**network**–a system of computers connected by communications lines.


    **online**–connected to the internet.


    **sequel**–a book or a movie that continues the story of a previous book or movie.


    **social media**–forms of electronic communication that allow people to create
    online communities to share information, ideas, messages. Facebook, Instagram,
    Snapchat are examples of social media.


    **software**–the written programs used to operate a computer.


    **specialize**–to pursue one type of work, called a specialty. A person who does
    this is a specialist.


    **technique** (tehk-NEEK)–a a method or style in which something is done.


    **technology** (tehk-NAH-luh-jee)–machinery and equipment developed for practical
    purposes using scientific principles and engineering.


    **upgrade**–an occurrence in which one thing is replaced by something better,
    newer, or more valuable.


