    App 所需的基础工具。任何人都可以使用这些程序来构建 App。


    ## 移动 App 开发者

    移动开发者为智能手机和平板电脑等设备构建 App。为这些设备创建 App 面着许多挑战。App 需要在不同的屏幕尺寸和不同的移动操作系统上运行并且外观良好。移动
    App 比电脑 App 消耗更少的内存和电量。而且，人们通过触摸屏幕来使用移动设备，而不是使用独立的键盘和鼠标。屏幕上的按钮和其他元素需要易于查看和点击。


    # 第 5 章

    ## APP 的开端


    无论是在公司工作还是独立开发，App 开发者的出现一直自 20 世纪 80 年代。


    这是第一批带有 App 的设备问世的时候。这些设备被称为个人数字助理（PDAs）。


    PDA 是手持式电脑，拥有简单的操作系统和一些 App。PDA App 帮助用户完成通常由人类助理完成的任务。这些包括将事件放入日历中、创建文档和发送电子邮件。


    在 20 世纪 90 年代，带有 App 的手机开始问世。每家制造新手机的公司都想胜过竞争对手。公司开始在手机中添加游戏和其他功能来吸引客户。这些是第一批手机
    App。当时，App 是手机操作系统系统的一部分。它们随手机出厂，人们无法添加更多。


    App 开发的突破出现在 1997 年，来自电子公司诺基亚（Nokia）。诺基亚刚刚开发了一种全新的手机操作系统。


    ![](img/232d886dd054577f285595f57fc12c44_18_0.png)


    摩托罗拉 DynaTAC 8000x 是第一个向公众出售的手机。它于 1983 年发布，售价为 3,995 美元！


    公司想为人们增加一些可以用手机玩的趣玩事物。它决定在手机中包含一个游戏 App。


    诺基亚软件开发者 Taneli Armando 创造了这款游戏。这并不是一项轻松的任务。人们已经习惯了具有音乐、音效和色彩丰富画面的电脑游戏。这种游戏需要的内存太多，无法放入手机操作系统中。


    Armando 需要制作一个玩起来同样有趣好玩，但功能更少的游戏。开发者还面临着其他挑战。手机屏幕分辨率低，处理器速度慢。这意味着游戏必须非常简单。


    Armando 决定将流行的视频游戏《Blockade》适配到诺基亚手机。他将这款新游戏命名为“贪蛇”（Snake）。在游戏中，玩家使用手机的数字键移动让蛇进入小方格。方格代表食物。每当蛇进入一个方格，它就会变大。贪蛇大火了！人们立刻就迷上了移动游戏的概念。


    9999 年开发了一项新的技术标准。它被称为无线应用协议（WAP）。WAP 允许移动设备通过无线网络发送和接收信息。这通过允许 App 在互联网上通信，彻底改变了软件应用。第一批带有
    WAP 浏览器的手机出现在 21 世纪初。


    ![](img/232d886dd054577f285595f57fc12c44_20_0.png)


    # 第 6 章

    ## iPHONE 效应


    手机公司继续在手机中包含 App。但当 Apple 在 2007 年推出 iPhone 时，App 真正腾飞了。它出厂加载了由公司 App 开发者创建的几个
    App。


    iPhone 上的 App 包括 YouTube、Google Maps、电子邮件、一个音乐播放器和一个日历。这些是原生 App（Native apps）。原生
    App 包含在设备的操作系统中并仅在该操作系统上运行。iPhone 也是第一个拥有全功能网络浏览器的手机。


    > 史蒂夫·乔斯（Steve Jobs）在 Macworld（Apple 产品年度展会）上发布了第一代 iPhone。推出了超过六万台初代 iPhone！


    ![](img/232d886dd054577f285595f57fc12c44_21_0.png)


    很快，人们希望任何事情都有 App。但 Apple 不允许公司以外的开发者为 iPhone 的操作系统（iOS）构建原生 App。相反，人们可以使用 Web
    2.0 和 Ajax 等技术构建基于 Web 的 App。然而，一个被称为“越狱社区”（jailbreaking community）的群体找到了为 iPhone
    构建并添加原生 App 的方法。


    Apple 希望对为 iPhone 开发的 App 有更多控制权。因此，公司决定帮助人们构建原生 iOS App。2008 年 3 月，公司发布了开发者工具。几个月后，Apple
    推出了 App Store。任何人都可以创建 App。App 随手机出厂，人们无法添加更多。


    ![](img/232d886dd054577f285595f57fc12c44_22.png)


    # 第 7 章

    ## 更多市场


    App Store 并不是购买 App 的唯一地方，Apple 不允许公司以外的开发者为 iPhone 的操作系统（iOS）构建原生 App。相反，人们可以使用
    Web 2.0 和 Ajax 等技术构建基于 Web 的 App。然而，一个被称为“越狱社区”的群体找到了为 iPhone 构建并添加原生 App 的方法。


    Apple 希望对为 iPhone 开发的 App 有更多控制权。因此，公司决定帮助人们构建原生 iOS App。2008 年 3 月，公司发布了开发者工具。几个月后，Apple
    推出了 App Store。任何人都可以创建 App。App 随手机出厂，人们无法添加更多。


