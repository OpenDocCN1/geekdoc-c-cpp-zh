    PDAs were handheld computers that had simple operating systems and a few apps.
    PDA apps helped users do tasks that human assistants would normally do. These
    included putting events in a calendar, creating documents, and sending emails.


    In the 1990s, cell phones with apps started being introduced. Each company that
    built a new cell phone wanted to outdo its competitors. Companies started adding
    games and other features to their phones to attract customers. These were the
    first phone apps. At this time, apps were part of a cell phone''s OS. They came
    on the phone and people could not add more.


    A breakthrough in app development came in 1997 from electronics company Nokia.
    Nokia had just developed a new cell'
  - '[PAGE 18]


    ![](img/232d886dd054577f285595f57fc12c44_18_0.png)


    The Motorola DynaTAC 8000x was the first cell phone available to the public. It
    was released in 1983 and cost $3,995!'
  - '[PAGE 19]


    phone OS. The company wanted to add something fun for people to do with their
    phones. It decided to include a game app on its phones.


    Nokia software developer Taneli Armando created the game. It was no easy task.
    People were used to computer games that had music, sound effects, and colorful
    graphics. This type of game would require way too much memory to fit on the phone''s
    OS.


    Armando would need to make a game that was just as interesting and fun to play,
    but had fewer features. The developer faced other challenges too. The phone had
    a low-resolution screen and slow processor speed. This meant the game had to be
    simple.


    Armando decided to adapt popular video game Blockade for the Nokia phone. He called
    the new game Snake. In the game, players used the phone''s number pad keys to
    move a snake into little squares. The squares represented food. Each time the
    snake entered a square, it got bigger. Snake was a hit! People instantly became
    addicted to the concept of mobile games.


    A new technology standard was developed in 1999. It was called wireless application
    protocol (WAP). WAP allowed mobile'
  - '[PAGE 20]


    ![](img/232d886dd054577f285595f57fc12c44_20_0.png)


    devices to send and receive information over wireless **networks**. This revolutionized
    **software** applications by allowing apps to communicate on the internet. The
    first cell phones with WAP **browsers** came out in the early 2000s.'
  - '[PAGE 21]


    # CHAPTER 6

    THE iPHONE EFFECT


    Cell phone companies continued to include apps on their phones. But apps really
    took off when Apple introduced the iPhone in 2007. It came loaded with several
    apps created by the company''s app developers.


    The apps on the iPhone included YouTube, Google Maps, email, a music player, and
    a calendar. These were native apps. Native apps are included on a device''s OS
    and work only on that OS. The iPhone was also the first cell phone that had a
    fully functioning web browser.


    > Steve Jobs announced the first iPhone at Macworld, an annual expo for Apple
    products. More than six million original iPhones were sold!


    ![](img/232d886dd054577f285595f57fc12c44_21_0.png)'
  - '[PAGE 22]


    Soon, people wanted apps for everything. But Apple didn’t let developers outside
    the company build native apps for the iPhone’s OS (iOS). Instead, people could
    build web-based apps using techniques such as Web 2.0 and Ajax. However, a group
    known as the jailbreaking community found ways to build and add native apps to
    the iPhone.


    Apple wanted more control over the apps that were developed for the iPhone. So,
    the company decided to help people build native iOS apps. In March 2008, Apple
    released a software development kit. Now anyone could create apps for the iPhone.
    Four months later, Apple opened an App Store. Developers could submit the apps
    they created to the store. If Apple accepted an app, people could purchase and
    download it.


    ![](img/232d886dd054577f285595f57fc12c44_22_0.png)'
  - '[PAGE 23]


    # CHAPTER 7

    MORE MARKETS


    Apple''s App Store was not the only place to buy and sell apps. It, and the iPhone,
    soon got some competition. In November 2007, Google announced a partnership with
    nearly three dozen other technology and telecommunications companies. Some of
    these companies were HTC, Samsung, Motorola, and Sprint.


    In October 2008, this partnership released the first Android smartphone. It was
    originally called the HTC Dream. It was later known as the T-Mobile G1. App developers
    hurried to design software for it.


    ![](img/232d886dd054577f285595f57fc12c44_23_0.png)


    Like Apple, Android gave developers the tools to build apps for its phones. Apps
    for Android phones were available from the online app store Android Market. At
    first, the Android Market had around 50 apps. But within


    By 2011, app developers had launched a combined total of nearly 5 million apps
    on Google play and the Apple App Store.'
  - '[PAGE 24]


    ![](img/232d886dd054577f285595f57fc12c44_24_0.png)


    two years, there were more than 80,000 apps on the Android Market. In 2012, Android
    Market''s name changed to Google Play.

    While iOS apps are only available from the Apple App Store, there are several
    marketplaces for Android apps. Besides Google Play, two others include the Microsoft
    Store and Amazon Appstore. These have more than 600,000 apps each. And there is
    a high demand for Android and iOS app developers to keep coming up with new ideas.'
  - '[PAGE 25]


    # CHAPTER 8

    APP SUCCESS


    **Today, the iOS and Android marketplaces offer millions of apps.** With so many
    apps **available**, it''s hard for a new app to get noticed. It''s not enough
    for an app developer to think an idea is great or useful. To make an app successful,
    an app developer must do research to make sure the app he or she wants to create
    is one that people will want or use.


    The first step is to find out whether there are already similar apps available.
    If there are, the developer decides if her idea is different enough to be worth
    building. Perhaps it could be easier to use, have more features, or cost less
    than the other apps.


    If there are no similar apps, the developer tries to learn why. Is it because
    people don''t need or want the features the app will offer? The developer can
    use surveys to find out. These could show that people don''t need or want the
    app. In that case, the developer may not build it. Ideally, the research will
    show that'
  - '[PAGE 26]


    ![](img/232d886dd054577f285595f57fc12c44_26_0.png)


    Facebook is the most-used app on smartphones. The app can also be used on tablets
    and even televisions!'
  - '[PAGE 27]


    the idea is new and that people will want to use it. Then the developer can get
    to work building the app.


    The work to make an app successful does not end once the app is built. Part of
    developing a successful app is creating a marketing plan. This includes how much
    to charge for the app. It also includes how to let people know that the app exists
    and where to download it.


    Some developers post ads on social media to spread the word about their app. Others
    offer their app for free. They hope many people will use it so the developers
    can make money selling ads, upgrades, and special features.


    ![](img/232d886dd054577f285595f57fc12c44_27_0.png)


    Many of the most successful apps can be used on more than one type of device.'
- md: '

    ## DIGITAL SPOTLIGHT ANGRY BIRDS APP


    One of the best-selling game apps of all time is Angry Birds. In 2009, mobile
    game company Rovio wanted to develop an iPhone app. Jaakko Lisalo was one of Rovio''s
    game designers. He created a funny-looking flock of birds on his computer.


    The Rovio team planned a game based around the bird characters. Angry Birds was
    released on the Apple App Store in 2010. Angry Birds became extremely popular
    almost immediately. It seemed everyone was playing it!


    Within two years, the game had been downloaded 50 million times. Rovio has since
    launched 15 Angry Birds spin-off games. All together, these games have been downloaded
    more than three billion times.


    There are also Angry Birds toys, clothes, and more. There was even an Angry Birds
    movie released in 2016. A sequel is planned for 2019.


    # CHAPTER 9: APP FUTURE


    App development has started moving beyond general game, lifestyle, and entertainment
    apps. To do this, it is important for app developers to keep up to date with the
    latest technology and trends. As new technologies become available, app developers
    can use them to make new and better apps.


    One trend is virtual reality. This is technology that creates artificial environments
    that a user can enter and interact with. Augmented reality is similar to virtual
    reality. But it adds artificial objects to users'' real environments.


    Wearables are another wave of the future for app developers. Computers keep getting
    smaller and smaller. As a result, they can be put into tiny devices that people
    can wear. Already, people can wear computers on their wrists, inside their glasses,
    or even as part of their clothing. Google Glass, Samsung Galaxy Gear, and Apple
    Watch are just a few examples of these types of wearables.


    The popular app Pokémon GO uses augmented reality to show Pokémon characters in
    the user''s environment.


    And these wearables have apps that let them work with devices such as computers
    and smartphones. It''s possible that desktop computers will become a thing of
    the past. New technology is always being developed and replacing old devices.
    It''s hard to imagine what devices and apps will be like in the future. But it''s
    certain that app developers will play a big role in shaping them!


    # TIMELINE


    - **1980s**: The first PDAs are released with simple apps.

    - **1997**: Nokia offers a new cell phone with the game Snake.

    - **1990s**: Cell phones with apps are introduced.

    - **2000**: Cell phones with WAP browsers become available.

    - **2007**: The first Apple iPhone is released.


    # MARCH 2008


    Apple releases a software development kit to help people develop iOS apps.


    # 2010


    The Angry Birds app becomes available on the Apple App Store.


    # JULY 2008


    Apple opens the Apple App Store.


    # OCTOBER 2008


    The first Android phone is released. The Android Market opens.


    # 2017


    Google Play and the Apple App Store reach nearly 5 million apps combined.


    # GLOSSARY


    - **augmented**–made greater, larger, or more complete.

    - **available**–able to be had or used.

    - **breakthrough**–a sudden advance or successful development.

    - **browser**–a computer program that is used to find and look at information
    on the Internet.

    - **code**–a set of instructions for a computer.

    - **collaborate**–to work with another person or group in order to do something
    or reach a goal.

    - **download**–to transfer data from a computer network to a single computer or
    device.

    - **environment**–surroundings.

    - **feedback**–information or criticism that suggests ways to improve something.

    - **graphic**–of or relating to visual arts such as painting and photography.

    - **graphics**–pictures or images on the screen of a computer, smartphone, or
    other device.

    - **hardware**–the physical parts of a computer.

    - **lifestyle**–the way a being, group, or society lives.

    - **marketing**–the process of advertising or promoting something so people will
    want to buy it.

    - **mobile**–capable of moving or being moved.

    - **network**–a system of computers connected by communications lines.

    - **online**–connected to the internet.

    - **sequel**–a book or a movie that continues the story of a previous book or
    movie.

    - **social media**–forms of electronic communication that allow people to create
    online communities to share information, ideas, messages. Facebook, Instagram,
    Snapchat are examples of social media.

    - **software**–the written programs used to operate a computer.

    - **specialize**–to pursue one type of work, called a specialty.

    - **technique**–a method or style in which something is done.

    - **technology**–machinery and equipment developed for practical purposes.

    - **upgrade**–an occurrence in which something is replaced by something better,
    newer.


