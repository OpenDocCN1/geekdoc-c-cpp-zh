  md: 'In Table 4.3, we present an SSSP algorithm decision table with programming
    contest in mind. This is to help readers in deciding which algorithm to choose
    depending on various graph criteria.


    | Graph Criteria | BFS | Dijkstra’s | Bellman Ford’s |

    |---|---|---|---|

    |  | $O(V + E)$ | $O((V + E) \log V)$ | $O(VE)$ |

    | Unweighted | Best: $V, E \le 1M$ | Ok: $V, E \le 50K$ | Bad: $VE \le 1M$ |

    | Weighted | WA except on Tree & DAG | Best: $V, E \le 50K$ | Ok: $VE \le 1M$
    |

    | Negative weight | WA | WA | Best: $VE \le 1M$ |

    | Negative cycle | Cannot detect | Cannot detect | Can detect |


