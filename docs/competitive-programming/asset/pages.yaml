  md: "# ### 5.3.2 Greatest Common Divisor (GCD) & Least Common Multiple (LCM)\n\n\
    The Greatest Common Divisor (GCD) of two integers $(a, b)$ denoted by $gcd(a,b)$,\
    \ is defined as the largest positive integer $d$ such that $d \\mid a$ and $d\
    \ \\mid b$ where $x \\mid y$ implies that $x$ divides $y$. Example of GCD: $gcd(4,8)\
    \ = 4$, $gcd(10,5) = 5$, $gcd(20,12) = 4$. One practical usage of GCD is to simplify\
    \ fraction, e.g. $\\frac{4}{8} = \\frac{4/gcd(4,8)}{8/gcd(4,8)} = \\frac{1}{2}$.\n\
    \nTo find the GCD between two integers is an easy task with an effective Euclid\
    \ algorithm [20, 4] which can be implemented as a one liner code (see below).\
    \ Thus finding the GCD is usually not the actual issue in a Math-related contest\
    \ problem, but just part of the bigger solution.\n\nThe GCD is closely related\
    \ to Least (or Lowest) Common Multiple (LCM). The LCM of two integers $(a, b)$\
    \ denoted by $lcm(a,b)$, is defined as the smallest positive integer $l$ such\
    \ that $a \\mid l$ and $b \\mid l$. Example of LCM: $lcm(4,8) = 8$, $lcm(10,5)\
    \ = 10$, $lcm(20,12) = 60$. It has been shown [20] that: $lcm(a,b) = a \\times\
    \ b/gcd(a,b)$. This can also be implemented as a one liner code (see below).\n\
    \n```\n```cpp\nint gcd(int a, int b) { return (b == 0 ? a : gcd(b, a % b)); }\n\
    int lcm(int a, int b) { return (a * (b / gcd(a, b))); } // divide before multiply!\n\
    ```\n```\n\nThe GCD of more than 2 numbers, e.g. $gcd(a,b,c)$ is equal to $gcd(a,gcd(b,c))$,\
    \ etc, and similarly for LCM. Both GCD and LCM algorithms run in $O(\\log_{10}\
    \ n)$, where $n = max(a,b)$.\n\n+   Programming Exercises related to GCD and/or\
    \ LCM:\n+   \n+   1. UVa 332 - Rational Numbers from Repeating Fractions\n+  \
    \ 2. UVa 412 - Pi\n+   3. UVa 530 - Binomial Showdown\n+   4. UVa 10193 - All\
    \ You Need Is Love\n+   5. UVa 10407 - Simple Division\n+   6. UVa 10680 - LCM\n\
    +   7. UVa 10717 - Mint (requires Complete Search on top of LCM/GCD)\n+   8. UVa\
    \ 10791 - Minimum Sum LCM (prime factorization + tricky cases)\n+   9. UVa 10892\
    \ - LCM Cardinality\n+   10. UVa 11388 - GCD LCM (must understand the relationship\
    \ between GCD and LCM)\n+   11. UVa 11417 - GCD\n\n# ### 5.3.3 Euler’s Totient\
    \ (Phi) Function\n\nNow that we have discussed prime number and GCD, we can define\
    \ relatively prime. Two integers $a$ and $b$ are said to be relatively prime if\
    \ $gcd(a,b) = 1$, e.g. 25 and 42.\n\nThere is an interesting problem of finding\
    \ positive integers below $N$ that are relatively prime to $N$ (see programming\
    \ exercises below). A naïve algorithm starts with counter = 0, iterates through\
    \ $i \\in [1 \\ldots N]$, and increases the counter if $gcd(i,N) = 1$, but this\
    \ is slow for a large $N$.\n\nA better algorithm is the Euler’s Totient (Phi)\
    \ function [36]. The Euler’s phi $\\varphi(N)$ is a function to compute the solution\
    \ for the problem posed above. $\\varphi(N) = N \\times \\prod_{p \\mid N}(1 -\
    \ \\frac{1}{p})$, where we iterate through all prime factors of $N$. For example\
    \ $N = 36 = 2^2 \\times 3^2$. $\\varphi(36) = 36 \\times (1 - \\frac{1}{2}) \\\
    times (1 - \\frac{1}{3}) = 12$."
  merge: -1
