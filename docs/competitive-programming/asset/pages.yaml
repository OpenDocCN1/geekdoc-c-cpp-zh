  md: '# Tip 5: Try Solving the Problem Backwards


    Surprisingly, some contest problems seem far easier when they are solved backwards
    than when they are solved using a frontal attack. Be on the lookout for processing
    data in reverse order or building an attack that looks at the data in some order
    other than the obvious.


    This tip is best shown using an example: UVa 10360 - Rat Attack. Abridged problem
    description: Imagine a 2-D array (up to 1024 × 1024) containing rats. There are
    n ≤ 20000 rats at some cells, determine which cell (x, y) should be gas-bombed
    so that the number of rats killed in square box (x − d, y − d) to (x + d, y +
    d) is maximized. The value d is the power of the gas-bomb (d is up to 50), see
    Figure 3.2.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_41_0.png)


    Figure 3.2: UVa 10360 - Rat Attack Illustration with d = 1


    First option is to attack this problem frontally: Try bombing each of the 1024²
    cells and see which one is the most effective. For each bombed cell (x, y), we
    need to do O(d²) scans to count the number of rats killed within the square-bombing
    radius. For the worst case when the array has size 1024² and d = 50, this takes
    1024² × 50² = 261M operations. Clearly TLE!


    Second option is to attack this problem backwards: Create an array int killed[1024][1024].
    For each n rat population at coordinate (x, y), add the value of array killed[i][j]
    with the number of rats in (x, y) that will be killed if a bomb is placed in (i,
    j) and (i, j) is within the square-bombing radius (i.e. |i − x| ≤ d and |j − y|
    ≤ d). This pre-processing takes O(n × d²) operations. Then, to determine the optimal
    bomb placing position, we find the coordinate with the highest entry in array
    killed, which can be done in O(n²) operations. This backwards approach only requires
    20000 × 50² + 20000² = 51M operations for the worst test case (n = 20000, d =
    50) and approximately 51 times faster than the frontal attack!


    # Tip 6: Optimizing Source Code


    There are many tricks that you can use to optimize your code. Understanding computer
    hardware, especially I/O, memory, and cache behavior, can help you design a better
    program. Some examples:


    +   1. Use the faster C-style scanf/printf rather than cin/cout.

    +   2. Use the expected O(n log n) but cache-friendly quicksort (built-in in C++
    STL sort as part of ‘introsort’) rather than the true O(n log n) but not (cache)
    memory friendly mergesort.

    +   3. Access a 2-D array in a row major fashion (row by row) rather than column
    by column.

    +   4. Bitwise manipulation on integer is faster than using an array of bits (see
    Section 3.4.3), etc.

    +   5. Use STL `<bitset>` rather than `vector<bool>` for Sieve of Eratosthenes
    (see Section 5.3.1).'
  merge: -1
  img_proc: true
