  md: "```\n```cpp\nstack<int> dfs_scc; // additional information for SCC\nset<int>\
    \ in_stack; // for dfs_low update check\n\nvoid tarjanSCC(int u) {\n    dfs_low[u]\
    \ = dfs_num[u] = dfsNumberCounter++; // dfs_low[u] <= dfs_num[u]\n    dfs_scc.push(u);\
    \ in_stack.insert(u); // ensure u based on order of visitation\n    TRVi (AdjList[u],\
    \ v) {\n        if (dfs_num[v->first] == DFS_WHITE) // a tree edge\n         \
    \   tarjanSCC(v->first);\n        if (in_stack.find(v->first) != in_stack.end())\
    \ // condition for update\n            dfs_low[u] = min(dfs_low[u], dfs_low[v->first]);\
    \ // update dfs_low[u]\n    }\n    if (dfs_low[u] == dfs_num[u]) { // if this\
    \ is a root of SCC\n        printf(\"SCC: \");\n        while (!dfs_scc.empty()\
    \ && dfs_scc.top() != u) {\n            printf(\"%d \", dfs_scc.top()); in_stack.erase(dfs_scc.top());\
    \ dfs_scc.pop();\n        }\n        printf(\"%d\\n\", dfs_scc.top()); in_stack.erase(dfs_scc.top());\
    \ dfs_scc.pop();\n    }\n}\n```\n```\n\nExercise: This implementation can be improved\
    \ by about $O(\\log V)$ factor by using other data structure other than `set<int>\
    \ in_stack`. How?\n\n# Topological Sort (on a Directed Acyclic Graph)\n\nTopological\
    \ sort or topological ordering of a Directed Acyclic Graph (DAG) is a linear ordering\
    \ of the vertices in the DAG so that vertex $u$ comes before vertex $v$ if edge\
    \ $(u \\to v)$ exists in the DAG. Every DAG has one or more topological sorts.\
    \ There are several ways to implement a Topological Sort algorithm. The simplest\
    \ is to slightly modify the simplest DFS implementation in this section.\n\n```\n\
    ```cpp\nvoid topoVisit(int u) {\n    dfs_num[u] = DFS_BLACK;\n    TRVi (AdjList[u],\
    \ v)\n        if (dfs_num[v->first] == DFS_WHITE)\n            topoVisit(v->first);\n\
    \    topologicalSort.push_back(u); // this is the only change\n}\n\n// inside\
    \ int main()\ntopologicalSort.clear(); // this global vector stores topological\
    \ sort in reverse order\nmemset(dfs_num, DFS_WHITE, sizeof dfs_num);\nREP (i,\
    \ 0, V - 1)\n    if (dfs_num[i] == DFS_WHITE)\n        topoVisit(i);\nreverse(topologicalSort.begin(),\
    \ topologicalSort.end());\nREP (i, 0, topologicalSort.size() - 1)\n    printf(\"\
    %d\\n\", topologicalSort[i]);\n```\n```\n\nIn topoVisit(u), we append u to the\
    \ list vertices explored only after visiting all subtrees below u. As vector only\
    \ support *efficient insertion* from back, we work around this issue by simply\
    \ reversing the print order in the output phase. This simple algorithm for finding\
    \ (a valid) topological sort is again due to Tarjan. It again runs in $O(V + E)$\
    \ as with DFS."
