  md: "```\n~~~cpp\nint main() { // easy to code if you are already familiar with\
    \ it\n  int i, j, TC, score;\n\n  scanf(\"%d\", &TC);\n  while (TC--) {\n    scanf(\"\
    %d %d\", &M, &C);\n    for (i = 0; i < C; i++) {\n      scanf(\"%d\", &K);\n \
    \     price[i][0] = K; // to simplify coding, we store K in price[i][0]\n    \
    \  for (j = 1; j <= K; j++)\n        scanf(\"%d\", &price[i][j]);\n    }\n\n \
    \   memset(memo, -1, sizeof memo); // initialize DP memo table\n    score = shop(M,\
    \ 0); // start the top-down DP\n    if (score < 0)\n      printf(\"no solution\\\
    n\");\n    else\n      printf(\"%d\\n\", score);\n  }\n} // return 0;\n~~~\n```\n\
    \n# **Approach 4: Bottom-Up DP (Accepted)**\n\nThere is another style of writing\
    \ DP solutions, called the **bottom-up DP**. This is actually the ‘true form’\
    \ of DP a.k.a. the ‘tabular method’. The steps to build bottom-up DP are like\
    \ this:\n\n+   1. Identify the Complete Search recurrence as with top-down DP\
    \ above.\n+   2. Initialize some parts of the DP table with known initial values.\n\
    +   3. Determine how to fill the rest of the DP table based on the Complete Search\
    \ recurrence, usually involving one or more nested loops to do so.\n\nFor UVa\
    \ 11450 above, we can write the bottom-up DP as follow. For clarity of this discussion,\
    \ please see Figure 3.8 which illustrates test case A above.\n\nFirst, set up\
    \ a boolean matrix can_reach[money_left][garment_id] of size 201 × 20. At first,\
    \ only the cells reachable by buying any of the models of garment_id = 0 are true.\
    \ See Figure 3.8, leftmost, where only rows ‘20-6 = 14’, ‘20-4 = 16’, and ‘20-8\
    \ = 12’ in column 0, are true.\n\nThen, we loop through from second garment until\
    \ the last garment. We set can_reach[a][b] to be true if it is possible to reach\
    \ this state from any states in previous column, i.e. from state can_reach[a +\
    \ price of any model of previous garment_id][b - 1]. See Figure 3.8, middle, where\
    \ for example, can_reach[11][1] can be reached from can_reach[11 + 5][0] by buying\
    \ a model with cost 5 in garment_id = 1; can_reach[2][1] can be reached from can_reach[2\
    \ + 10][0] by buying a model with cost 10 in garment_id = 1; etc.\n\nFinally,\
    \ the answer can be found in the last column. Find the cell in that column nearest\
    \ to index 0 that is set to be true. In Figure 3.8, rightmost, the cell can_reach[1][2]\
    \ is the answer. This means that we can somehow reach this state (money_left =\
    \ 1) by buying combination of various garment models. The final answer is actually\
    \ M - money_left, or in this case, 20-1 = 19. The answer is “no solution” if there\
    \ is no cell in the last column that is set to be true."
