- pgno: 17
  md: "# 1.2. *TIPS TO BE COMPETITIVE*\n\nMany novice programmers usually skip this\
    \ phase and tempted to directly code the first algorithm that they can think of\
    \ (usually the naïve version), after that they ended up realizing that the chosen\
    \ data structure is not efficient or their algorithm is not fast enough (or wrong).\
    \ **Our advice: refrain from coding until you are sure that your algorithm is\
    \ both correct and fast enough.**\n\nTo help you in judging how fast is ‘enough’,\
    \ we produce Table 1.4. Variants of such Table 1.4 can also be found in many algorithms\
    \ book. However, we put another one here from programming contest perspective.\
    \ Usually, the input size constraints are given in the problem description. Using\
    \ some logical assumptions that typical year 2010 CPU can do 1M operations in\
    \ 1s and time limit of 3s (typical time limit used in most UVA online judge [17]\
    \ problems), we can predict the ‘worst’ algorithm that can still pass the time\
    \ limit. Usually, the simplest algorithm has poor time complexity, but if it can\
    \ already pass the time limit, just use it!\n\nFrom Table 1.4, we see the importance\
    \ of knowing good algorithms with lower order of growth as they allow us to solve\
    \ problems with bigger input size. Beware that a faster algorithm is usually non\
    \ trivial and harder to code. In Section 3.1.2 later, we will see a few tips that\
    \ may allow us to enlarge the possible input size n for the same class of algorithm.\n\
    \n| $n$ | Worst AC Algorithm | Comment |\n|---|---|---|\n| $\\le 10$ | $O(n!),\
    \ O(n^6)$ | e.g. Enumerating a Permutation |\n| $\\le 20$ | $O(2^n), O(n^5)$ |\
    \ e.g. DP + Bitmask Technique |\n| $\\le 50$ | $O(n^4)$ | e.g. DP with 3 dimensions\
    \ + $O(n)$ loop, choosing $\\binom{n}{k=4}$ |\n| $\\le 100$ | $O(n^3)$ | e.g.\
    \ Floyd Warshall's |\n| $\\le 1K$ | $O(n^2)$ | e.g. Bubble/Selection/Insertion\
    \ Sort |\n| $\\le 100K$ | $O(n\\log_2 n)$ | e.g. Merge Sort, Building Segment\
    \ Tree |\n| $\\le 1M$ | $O(n), O(\\log_2 n), O(1)$ | Usually, contest problem\
    \ has $n < 1M$ (e.g. to read input) |\n\nTable 1.4: Rule of Thumb for the ‘Worst\
    \ AC Algorithm’ for various input size $n$ (single test case only), assuming that\
    \ year 2010 CPU can compute 1M items in 1s and Time Limit of 3s.\n\nAdditionally,\
    \ we have a few other rules of thumb:\n\n+   - $2^{10} \\approx 10^3$, $2^{20}\
    \ \\approx 10^6$.\n+   - Max 32-bit signed integer: $2^{31}-1 \\approx 2 \\times\
    \ 10^9$ (or up to $\\approx 9$ decimal digits);  \n+     Max 64-bit signed integer\
    \ (long long) is $2^{63}-1: 9 \\times 10^{18}$ (or up to $\\approx 18$ decimal\
    \ digits).  \n+     Use ‘unsigned’ if slightly higher positive number is needed\
    \ $[0 \\ldots 2^{64}-1]$.  \n+     If you need to store integers $\\ge 2^{64}$,\
    \ you need to use the Big Integer technique (Section 5.4).\n+   - Program with\
    \ nested loops of depth $k$ running about $n$ iterations each has $O(n^k)$ complexity.\n\
    +   - If your program is recursive with $b$ recursive calls per level and has\
    \ $L$ levels, the program has roughly $O(b^L)$ complexity. But this is an upper\
    \ bound. The actual complexity depends on what actions done per level and whether\
    \ some pruning are possible.\n+   - Dynamic Programming algorithms which fill\
    \ a 2-D matrix in $O(k)$ per cell is in $O(k \\times n^2)$.\n+   - The best time\
    \ complexity of a comparison-based sorting algorithm is $\\Omega(n\\log_2 n)$.\n\
    +   - Most of the time, $O(n\\log_2 n)$ algorithms will be sufficient for most\
    \ contest problems."
