- pgno: 97
  md: '# ### 4.9.1 Tree


    Tree is a special graph with the following characteristics: has $E = V-1$ (any
    $O(V + E)$ algorithm is $O(V)$), it has no cycle, it is connected, and there exists
    one unique path from any pair of vertices.


    # #### Finding Articulation Points and Bridges in Tree


    In Section 4.2, we have seen $O(V + E)$ Tarjan’s DFS algorithm for finding articulation
    points and bridges of a graph. However, if the given graph is a tree, the problem
    becomes simpler: all edges on a tree are bridges and all internal vertices (degree
    > 1) are articulation points. This is still $O(V)$ as we have to scan the tree
    to count the number of internal vertices, but the code is simpler.


    # #### Single-Source Shortest Paths on Weighted Tree


    In Sections 4.5 and 4.6, we have seen two general purpose algorithms ($O((E +
    V) \log V)$ Dijkstra’s and $O(VE)$ Bellman-Ford’s) for solving the SSSP problem
    on a weighted graph. However, if the given graph is a tree, the SSSP problem becomes
    simpler: any $O(V)$ graph traversal algorithm, i.e. BFS or DFS, can be used to
    solve this problem. There is only one unique path between any two vertices in
    a tree, so we simply traverse the tree to find the path connecting the two vertices
    and the shortest path between these two vertices is basically the sum of edge
    weights of this unique path.


    # #### All-Pairs Shortest Paths on Weighted Tree


    In Section 4.7, we have seen a general purpose algorithm ($O(V^3)$ Floyd Warshall’s)
    for solving the APSP problem on weighted graph. However, if the given graph is
    a tree, the APSP problem becomes simpler: repeat the SSSP process $V$ times from
    each vertex, thus it is $O(V^2)$.


    But this can still be improved to $O(V + Q \times L)$: $Q$ is the number of query
    and $L$ is the complexity of the Lowest Common Ancestor (LCA) implementation (see
    [40] for more details). We run $O(V)$ DFS/BFS once from any vertex $v$ to find
    $dist[v]$[other vertices] in tree. Then we can answer any shortest path query
    $(i, j)$ on this tree by reporting $dist[v][i] + dist[v][j] - 2 \times dist[v][LCA(i,
    j)]$.


    # #### Diameter of Tree


    The diameter of a graph is defined as the greatest distance between any pair of
    vertices. To find the diameter of a graph, we first find the shortest path between
    each pair of vertices (the APSP problem). The greatest length of any of these
    paths is the diameter of the graph. For general graph, we may need $O(V^3)$ Floyd
    Warshall’s algorithm discussed in Section 4.7. However, if the given graph is
    a tree, the problem becomes simpler: do DFS/BFS from any node $s$ to find furthest
    vertex $x$, then do DFS/BFS one more time from vertex $x$ to get the true furthest
    vertex $y$ from $x$. The length of the unique path along $x$ to $y$ is the diameter
    of that tree. This solution only requires two calls of $O(V)$ graph traversal
    algorithm.


    # #### Max Weighted Independent Set on Tree


    In Section 3.4, we have shown a DP on Tree example that solves Max Weighted Independent
    Set (MWIS) on Tree in $O(V)$. In Section 4.9.3 below, we will revisit this problem
    on a Bipartite Graph,'
