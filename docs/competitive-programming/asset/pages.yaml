  md: "# Transitive Closure (Warshall’s algorithm)\n\nStephen *Warshall* developed\
    \ algorithm for finding solution for Transitive Closure problem: Given a graph,\
    \ determine if vertex *i* is connected to *j*. This variant uses logical bitwise\
    \ operators which is much faster than arithmetic operators. Initially, `d[i][j]`\
    \ contains 1 (true) if vertex *i* is directly connected to vertex *j*, 0 (false)\
    \ otherwise. After running O(V³) Warshall’s algorithm below, we can check if any\
    \ two vertices *i* and *j* are directly or indirectly connected by checking `d[i][j]`.\n\
    \n```\n```text\nREP (k, 0, V - 1)\n  REP (i, 0, V - 1)\n    REP (j, 0, V - 1)\n\
    \      d[i][j] = d[i][j] | (d[i][k] & d[k][j]);\n```\n```\n\n# Minimax and Maximim\n\
    \nThe Minimax path problem is a problem of finding the minimum of maximum edge\
    \ weight among all possible paths from *i* to *j*. There can be many paths from\
    \ *i* to *j*. For a single path from *i* to *j*, we pick the maximum edge weight\
    \ along this path. Then for all possible paths from *i* to *j*, pick the one with\
    \ the minimum max-edge-weight. The reserve problem of Maximin is defined similarly.\n\
    \nThe solution using Floyd Warshall’s is shown below. First, initialize `d[i][j]`\
    \ to be the weight of edge (i,j). This is the default minimax cost for two vertices\
    \ that are directly connected. For pair i-j without any direct edge, set `d[i][j]\
    \ = INF`. Then, we try all possible intermediate vertex *k*. The minimax cost\
    \ `d[i][j]` is min of either (itself) or (the max between `d[i][k]` or `d[k][j]`).\n\
    \n```\n```text\nREP (k, 0, V - 1)\n  REP (i, 0, V - 1)\n    REP (j, 0, V - 1)\n\
    \      d[i][j] = min(d[i][j], max(d[i][k], d[k][j]));\n```\n```\n\nExercise: In\
    \ this section, we have shown you how to solve Minimax (and Maximin) with Floyd\
    \ Warshall’s algorithm. However, this problem can also be modeled as an MST problem\
    \ and solved using Kruskal’s algorithm. Find out the way!\n\nProgramming Exercises\
