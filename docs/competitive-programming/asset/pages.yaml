    # 7.6 Chapter Notes


    Some materials from this chapter are derived from the materials courtesy of **Dr
    Cheng Holun, Alan** from School of Computing, National University of Singapore.


    There are many other Convex Hull algorithms such as **Jarvis''s March**, **Gift
    Wrapping**, and **Upper/Lower Hull** with more or less similar time complexity
    as **Graham''s Scan**. The Graham''s Scan algorithm presented in this chapter
    is usually enough for most contest problems.


    There is a computational geometry technique that has not been discussed yet: **plane
    sweep**. Interested reader should consult the following books [19, 6, 4].


    If you are preparing for ICPC, it is a good idea to dedicate one person in your
    team to study this topic in depth. This person should master basic geometry formulas
    and advanced computational geometry techniques. He must train himself to be familiar
    with many degenerate (special) cases in certain geometry problems, able to deal
    with precision errors, etc.


    There are approximately **96 programming exercises** discussed in this chapter.'
