- pgno: 59
  md: "```\n```cpp\nscanf(\"%d\", &n);\nfor (int i = 0; i < n; i++) for (int j = 0;\
    \ j < n; j++) {\n    scanf(\"%d\", &arr[i][j]);\n    if (i > 0) arr[i][j] += arr[i\
    \ - 1][j]; // if possible, add values from top\n    if (j > 0) arr[i][j] += arr[i][j\
    \ - 1]; // if possible, add values from left\n    if (i > 0 && j > 0) arr[i][j]\
    \ -= arr[i - 1][j - 1]; // to avoid double count\n} // inclusion-exclusion principle\n\
    ```\n```\n\nThis code turns input array (shown in the left) into sum array (shown\
    \ in the right):\n\n```\n```text\n0  -2  -7   0    ==>    0  -2  -9  -9\n9   2\
    \  -6   2    ==>    9   9  -4   2\n-4  1  -4   1    ==>    5   6 -11  -8\n-1 \
    \ 8   0  -2    ==>    4  13  -4  -3\n```\n```\n\nNow, with this sum array, we\
    \ can answer the sum of any sub-rectangle (i, j) to (k, l) in $O(1)$! Suppose\
    \ we want to know the sum of (1, 2) to (3, 3). We can split the sum array into\
    \ 4 sections and compute\n\n`arr[3][3] - arr[0][3] - arr[3][1] + arr[0][1] = -3\
    \ - 13 - (-9) + (-2) = -9.`\n\n```\n```text\n0 [-2] | -9 [-9]\n----------------\n\
    9   9  | -4   2\n5   6  | -11 -8\n4 [13]  -4 [-3]\n```\n```\n\nWith this $O(1)$\
    \ DP formulation, this problem can now be solved in $100^4$.\n\n```\n```cpp\n\
    maxSubRect = -127*100*100; // lowest possible value for this problem\nfor (int\
    \ i = 0; i < n; i++) for (int j = 0; j < n; j++) // start coord\n    for (int\
    \ k = i; k < n; k++) for (int l = j; l < n; l++) { // end coord\n        subRect\
    \ = arr[k][l]; // this is sum of all items from (0, 0) to (k, l): O(1)\n     \
    \   if (i > 0) subRect -= arr[i - 1][l]; // O(1)\n        if (j > 0) subRect -=\
    \ arr[k][j - 1]; // O(1)\n        if (i > 0 && j > 0) subRect += arr[i - 1][j\
    \ - 1]; // inclusion-exclusion: O(1)\n        maxSubRect = max(maxSubRect, subRect);\n\
    \    }\n```\n```\n\nLesson: Not every range problems require Segment Tree as in\
    \ Section 2.3.3! Problems where the input data is static like this usually is\
    \ solvable with DP technique.\n\nExercise 1: The solution above runs in $100^4$.\
    \ There exist $100^3$ solution. Can you figure out how to formulate this solution?\n\
    \nExercise 2: What if the given static array is 1-D? Can you form a similar $O(1)$\
    \ DP solution to answer range sum query(i, j), i.e. `arr[i] + arr[i+1] + ... +\
