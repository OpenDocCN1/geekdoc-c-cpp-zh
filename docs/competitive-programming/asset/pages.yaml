- pgno: 87
  md: "To solve SSSP problem in the presence of negative edge weight, the more generic\
    \ (but slower) Bellman Ford’s algorithm must be used. This algorithm was invented\
    \ by Richard Ernest Bellman (the pioneer of DP techniques) and Lester Randolph\
    \ Ford, Jr (the same person who invented Ford Fulkerson’s method in Section 4.8).\
    \ This algorithm is simple: Relax all E edges V − 1 times!\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_87_0.png)\n\
    \nThis is based on the idea that `dist[source] = 0` and if we relax an edge(source,\
    \ u), then `dist[u]` will have correct value. If we then relax an edge(u, v),\
    \ then `dist[v]` will also have correct value... If we have relaxed all E edges\
    \ V − 1 times, then the shortest path from the source vertex to the farthest vertex\
    \ from the source (path length: V−1 edges) should have been correctly computed.\
    \ The code is simple:\n\n```\nvector<int> dist(V, INF); dist[s] = 0; // INF =\
    \ 2B not MAX_INT to avoid overflow\nREP (i, 0, V - 1) // relax all E edges V−1\
    \ times, O(V)\n  REP (u, 0, V - 1) // these two loops as O(E)\n    TRvii (AdjList[u],\
    \ v) // has edge and can be relaxed\n      dist[v->first] = min(dist[v->first],\
    \ dist[u] + v->second);\nREP (i, 0, V - 1)\n  printf(\"SSSP(%d, %d) = %d\\n\"\
    , s, i, dist[i]);\n```\n\nThe complexity of Bellman Ford’s algorithm is $O(V^3)$\
    \ if the graph is stored as Adjacency Matrix or $O(VE)$ if the graph is stored\
    \ as Adjacency List. This is (much) slower compared to Dijkstra’s. Thus, Bellman\
    \ Ford’s is typically only used to solve SSSP problem when the input graph is\
    \ not too big and *not guaranteed* to have all non-negative edge weights!\n\n\
    Bellman Ford’s algorithm has one more interesting usage. After relaxing all E\
    \ edges V−1 times, the SSSP problem should have been solved, i.e. there is no\
    \ way we can relax any more vertex. This fact can be used to check the presence\
    \ of *negative cycle*, although such a problem is ill-defined. In Figure 4.17,\
    \ left, we see a simple graph with negative cycle. After 1 pass, `dist[1] = 973`\
    \ and `dist[2] = 1015` (middle). After V − 1 = 2 passes, `dist[1] = 988` and `dist[1]\
    \ = 946` (right). But since there is a negative cycle, we can still do this one\
    \ more time, i.e. relaxing `dist[1] = 946+15 = 961 < 988`!\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_87_1.png)\n\
    \n```\nbool negative_cycle_exist = false;\nREP (u, 0, V - 1) // one more pass\
    \ to check\n  TRvii (AdjList[u], v)\n    if (dist[v->first] > dist[u] + v->second)\
    \ // should be false, but if possible\n      negative_cycle_exist = true; // then\
    \ negative cycle exists!\nprintf(\"Negative Cycle Exist? %s\\n\", negative_cycle_exist\
    \ ? \"Yes\" : \"No\");\n```"
  merge: -1
  img_proc: true
