  md: "![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_86_0.png)\n\nFigure 4.15: Dijkstra\
    \ Animation on a Weighted Graph (from UVa 341 [17])\n\nFigure 4.15 shows an example\
    \ of running Dijkstra’s on a simple weighted graph $|V| = 5$ and $|E| = 7$:\n\n\
    +   1. At the beginning, only $\\mathrm{dist}[\\mathrm{source}] = \\mathrm{dist}[2]\
    \ = 0$, $\\mathrm{pq}$ is $\\{(0,2)\\}$.\n+   \n+   2. From vertex 2, we relax\
    \ vertices $\\{1, 3, 5\\}$. Now $\\mathrm{dist}[1] = 2$, $\\mathrm{dist}[3] =\
    \ 7$, and $\\mathrm{dist}[5] = 6$. Vertex 2 is done. The content of our $\\mathrm{priority\\\
    _queue}$ $\\mathrm{pq}$ is $\\{(2,1), (6,5), (7,3)\\}$.\n+   \n+   3. Among unprocessed\
    \ vertices $\\{1, 5, 3\\}$ in pq, vertex 1 has the least $\\mathrm{dist}[1] =\
    \ 2$ and is in front of pq. We dequeue $(2,1)$ and relax all its neighbors $\\\
    {3, 4\\}$ such that $\\mathrm{dist}[3] = \\min(\\mathrm{dist}[3], \\mathrm{dist}[1]+\\\
    mathrm{weight}(1,3)) = \\min(7, 2+3) = 5$ and $\\mathrm{dist}[4] = 8$. Vertex\
    \ 1 is done. Now pq contains $\\{(5,3), (6,5), (7,3), (8,4)\\}$. See that we have\
    \ 2 vertex 3. But it does not matter, as our Dijkstra’s implementation will only\
    \ pick one with minimal distance later.\n+   \n+   4. We dequeue $(5,3)$ and try\
    \ to do $\\mathrm{relax}(3,4)$, but $5+5 = 10$, whereas $\\mathrm{dist}[4] = 8$\
    \ (from path 2-1-4). So $\\mathrm{dist}[4]$ is unchanged. Vertex 3 is done and\
    \ pq contains $\\{(6,5), (7,3), (8,4)\\}$.\n+   \n+   5. We dequeue $(6,5)$ and\
    \ $\\mathrm{relax}(5, 4)$, making $\\mathrm{dist}[4] = 7$ (the shorter path from\
    \ 2 to 4 is now 2-5-4 instead of 2-1-4). Vertex 5 is done and pq contains $\\\
    {(7,3), (7,4), (8,4)\\}$.\n+   \n+   6. Now, $(7,3)$ can be ignored as we know\
    \ that $d > \\mathrm{dist}[3]$ (i.e. $7 > 5$). Then $(7,4)$ is processed as before.\
    \ And finally $(8,4)$ is ignored again as $d > \\mathrm{dist}[4]$ (i.e. $8 > 7$).\
    \ Dijkstra’s stops here as the priority queue is empty.\n\n# 4.6 Bellman Ford’s\n\
    \nIf the input graph has negative edge weight, Dijkstra can fail. Figure 4.16\
    \ is a simple example where Dijkstra’s fails. Dijkstra’s greedily sets $\\mathrm{dist}[3]\
    \ = 3$ first and uses that value to relax $\\mathrm{dist}[4] = \\mathrm{dist}[3]+\\\
    mathrm{weight}(3,4) = 3+3 = 6$, but then $\\mathrm{dist}[3] = \\mathrm{dist}[2]+\\\
    mathrm{weight}(2,3) = 10+(-10) = 0$. The correct answer is $\\mathrm{dist}[4]\
    \ = \\mathrm{dist}[3]+\\mathrm{weight}(3,4) = 0+3 = 3$."
