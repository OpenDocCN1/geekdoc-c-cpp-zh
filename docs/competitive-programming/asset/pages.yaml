  md: "Now with a Suffix Array already built, we can search for a query string $Q$\
    \ of length $m$ in string $S$ of length $n$ in $O(m \\log n)$. This is $O(\\log\
    \ n)$ times slower than the Suffix Tree version but in practice is quite acceptable.\
    \ The $O(m \\log n)$ complexity comes from the fact that we can do $O(\\log n)$\
    \ binary search on a sorted suffixes and do up to $O(m)$ comparisons per suffix.\n\
    \nThe fact that the occurrences of $Q$ in the Suffix Array of $S$ are consecutive\
    \ can be used to deal with the longest repeated substring and the longest common\
    \ substring problems in similar $O(m \\log n) + O(occ)$. For example in $S = 'acagcg$',\
    \ the repeated substring 'ca' occurs in $SA[4]$ and $SA[5]$. For the common substring\
    \ between $S_1 = 'acgat#'$ and $S_2 = 'cgt$', we can concatenate the two string\
    \ into $S = 'acgat#cgt$', build the Suffix Array of the concatenated string, and\
    \ then modify the comparison function to check for the marker character '#' and\
    \ '$'.\n\nOur code for finding the query string $Q$ in a Suffix Array is shown\
    \ below:\n\n```\n```cpp\npair<int, int> range(int n, char *Q) {\n    int lo =\
    \ 1, hi = n, m = strlen(Q), mid = lo; // index 0 - null\n    while (lo <= hi)\
    \ {                          // valid range = [1..n]\n        mid = (lo + hi)\
    \ / 2;\n        int cmp = strncmp(S + SA[mid], Q, m);\n        if (cmp == 0) \
    \   break; // found\n        else if (cmp > 0) hi = mid - 1;\n        else   \
    \           lo = mid + 1;\n    }\n\n    if (lo > hi)\n        return make_pair(-1,\
    \ -1); // not found\n\n    for (lo = mid; lo >= 1 && strncmp(S + SA[lo], Q, m)\
    \ == 0; lo--);\n    lo++;\n    for (hi = mid; hi <= n && strncmp(S + SA[hi], Q,\
    \ m) == 0; hi++);\n    hi--;\n\n    return make_pair(lo, hi);\n}\n\nint main()\
    \ {\n    int n = strlen(gets(S));\n    suffix_array(S, n + 1); // NULL is included!\n\
    \    for (int i = 1; i <= n; i++) // SA[0] is the NULL\n        printf(\"%d %s\\\
    n\", SA[i], S + SA[i]);\n\n    gets(Q);\n    pair<int, int> pos = range(n, Q);\n\
    \    if (pos.first != -1 && pos.second != -1) {\n        printf(\"%s is found\
    \ SA [%d ... %d] of %s\\n\", Q, pos.first, pos.second, S);\n        printf(\"\
    They are:\\n\");\n        for (int i = pos.first; i <= pos.second; i++)\n    \
    \        printf(\"  %s\\n\", S + SA[i]);\n    }\n    else\n        printf(\"%s\
    \ is not found in %s\\n\", Q, S);\n\n    return 0;\n}\n```\n```"
