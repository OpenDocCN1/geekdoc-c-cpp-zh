- pgno: 74
  md: '# 4.2. DEPTH FIRST SEARCH


    A naïve algorithm to find articulation points (can be tweaked to find bridges
    too):


    +   1. Run $O(V+E)$ DFS to count number of connected components of the original
    graph

    +   2. For all vertex $v \in V$ // $O(V)$

    +      (a) Cut (remove) vertex $v$ and its incident edges

    +      (b) Run $O(V+E)$ DFS to check if number of connected components increase

    +      (c) If yes, $v$ is an articulation point/cut vertex: Restore $v$ and its
    incident edges


    This naïve algorithm calls DFS $O(V)$ times, thus it runs in $O(V \times (V+E))
    = O(V^2 + VE)$. But this is *not* the best algorithm as we can actually just run
    the $O(V+E)$ DFS once to identify all the articulation points and bridges.


    This DFS variant, due to John Hopcroft and Robert Endre Tarjan (see problem 22.2
    in [4]), is just another extension from the previous DFS code shown earlier.


    This algorithm maintains two numbers: $dfs\_num(u)$ and $dfs\_low(u)$. Here, $dfs\_num(u)$
    stores the iteration counter when the vertex $u$ is visited for the *first time*
    and not just for distinguishing $DFS\_WHITE$ versus $DFS\_GRAY/DFS\_BLACK$. The
    other number $dfs\_low(u)$ stores the lowest $dfs\_num$ reachable from DFS spanning
    sub tree of $u$. Initially $dfs\_low(u) = dfs\_num(u)$ when vertex $u$ is first
    visited. Then, $dfs\_low(u)$ can only be made smaller if there is a cycle (some
    back edges exist). Note that we do not update $dfs\_low(u)$ with back edge $(u,v)$
    if $v$ is a direct parent of $u$.


    See Figure 4.3 for clarity. In these two sample graphs, we run `ArticulationPointAndBridge()`.
    Suppose in the graph in Figure 4.3 -- left side, the sequence of visitation is
    0 (at iteration 0) → 1 (1) → 2 (2) (backtrack to 1) → 4 (3) → 3 (4) (backtrack
    to 4) → 5 (5). See that these iteration counters are shown correctly in `dfs_num`.
    Since there is no back edge in this graph, all `dfs_low = dfs_num`.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_74_0.png)


    Figure 4.3: Introducing two more DFS attributes: `dfs_number` and `dfs_low`


    In the graph in Figure 4.3 -- right side, the sequence of visitation is 0 (at
    iteration 0) → 1 (1) → 2 (2) (backtrack to 1) → 3 (3) (backtrack to 1) → 4 (4)
    → 5 (5). There is an important back edge that forms a cycle, i.e. edge 5-1 that
    is part of cycle 1-4-5-1. This causes vertices 1, 4, and 5 to be able to reach
    vertex 1 (with `dfs_num` 1). Thus `dfs_low` of {1, 4, 5} are all 1.


    When we are at a vertex $u$, $v$ is a neighbor of $u$, and $dfs\_low(v) > dfs\_num(u)$,
    then $u$ is an articulation vertex. This is because the fact that $dfs\_low(v)$
    is *not smaller* than $dfs\_num(u)$ implies that there is no back edge connected
    to vertex $v$ that can reach vertex $w$ with a lower $dfs\_num(w)$ (which further
    implies that $w$ is the parent of $u$ in the DFS spanning tree). Thus, to reach
    that parent of $u$ from $v$, one must pass through vertex $u$. This implies that
    removing the vertex $u$ will disconnect the graph.


    Special case: The root of the DFS spanning tree (the vertex chosen as the start
    of DFS call) is an articulation point only if it has more than one children (a
    trivial case that is not detected by this algorithm).'
