  md: 'In this chapter, we have seen a quite effective trial division method for finding
    prime factors of an integer. For a faster **integer factorization**, one can use
    the **Pollard’s rho** algorithm [4]. However, if the integer to be factored is
    a large prime number, then this is still a slow business. This fact is the security
    part in modern cryptography techniques.


    There are other theorem, hypothesis, and conjectures about prime numbers, e.g.
    Carmichael’s function, Riemann’s hypothesis, Goldbach’s conjecture, twin prime
    conjecture, etc. However, when such things appear in *programming* contests, usually
    their definitions are given!


    We can compute \(f_b(n)\) in \(O(\log n)\) using matrix multiplication, but this
    is usually not needed in contest setting unless the problem setter use a very
    big \(n\).


    Other mathematics problems that may appear in programming contests are those involving:
    **Chinese Remainder Theorem** (e.g. UVA 756 - Biorhythms), **Divisibility** properties
    (e.g. UVa 995), **Pascal’s Triangle**, **Combinatorial Games** (e.g. the **Sprague-Grundy’s
    theorem** for games like UVa 10165 - Stone Game (Nim game), Chess, Tic-Tac-Toe,
    etc), problems involving non-conventional **Grid** system (e.g. UVa 10182 - Bee
    Maja), etc.


    Note that (Computational) Geometry is also part of Mathematics, but since we have
    a special chapter for that, we reserve the discussions related to geometry problems
    in Chapter 7.


    In terms of doing well in ICPC, it is a good idea to have at least one strong
    mathematician in your ICPC team. This is because there usually exists one or two
    mathematics problems in the set where the solution is short but getting the solution/formula
    requires a strong thinking cap.


    We suggest that interested readers should browse more about number theory – see
    books like [20], http://mathworld.wolfram.com/, Wikipedia and do more programming
    exercises related to mathematics problems, visit http://projecteuler.net/ [7].


    There are approximately **175 programming exercises** discussed in this chapter.'
