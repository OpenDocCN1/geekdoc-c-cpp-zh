    In general, the Min Path Cover (MPC) problem in DAG is described as the problem
    of finding the minimum number of paths to cover *each vertex* in DAG G = (V,E).


    This problem has a polynomial solution: Construct a bipartite graph G'' = (V_out
    ∪ V_in, E'') from G, where V_out = {v ∈ V : v has positive out-degree}, V_in =
    {v ∈ V : v has positive in-degree}, and E'' = {(u,v) ∈ (V_out, V_in) : (u,v) ∈
    E}. This G'' is a bipartite graph. Finding a matching on bipartite graph G'' forces
    us to select at most one outgoing edge from v ∈ V_out (similarly for V_in). DAG
    G initially has n vertices, which can be covered with n paths of length 0 (the
    vertex itself). One matching between vertex a and vertex b using edge (a,b) says
    that we can use one less path as it can cover both vertices in a ∈ V_out and b
    ∈ V_in. Thus if the Max Cardinality Bipartite Matching (MCBM) in G'' has size
    m, then we just need n − m paths to cover each vertex in G.


    The MCBM in G'' that is needed to solve the MPC in G is discussed below. The solution
    for bipartite matching is polynomial, thus the solution for the MPC in DAG is
    also polynomial. Note that MPC in general graph is NP-Complete [42].


