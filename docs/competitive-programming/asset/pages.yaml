    \    printf(\" Vertex %d\\n\", i);\n```\n```\n\n# Finding Strongly Connected Components\
    \ in Directed Graph\n\nYet another application of DFS is to find *strongly connected\
    \ components* in a *directed* graph. This is a different problem to finding connected\
    \ components of an undirected graph. In Figure 4.6, we have a similar graph to\
    \ the graph in Figure 4.1, but now the edges are directed. We can see that although\
    \ the graph in Figure 4.6 looks like ‘connected’ into one component, it is actually\
    \ ‘not strong’. In directed graph, we are more interested with the notion of ‘Strongly\
    \ Connected Component (SCC)’, i.e. if we pick any pair of vertices *u* and *v*\
    \ in the SCC, we can find a path from *u* to *v* and vice versa. There are actually\
    \ three SCCs in Figure 4.6, as highlighted: {0}, {1, 3, 2}, and {4, 5, 7, 6}.\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_76_0.png)\n\nFigure 4.6: An example\
    \ of directed graph and its Strongly Connected Components (SCC)\n\nThere are at\
    \ least two known algorithms to find SCCs: Kosaraju’s – explained in [4] and Tarjan’s\
    \ algorithm [45]. In this book, we adopt Tarjan’s version, as it extends naturally\
    \ from our previous discussion of finding Articulation Points and Bridges – also\
    \ due to Tarjan.\n\nThe basic idea of the algorithm is that SCCs form the subtrees\
    \ of the DFS spanning tree and the roots of the subtrees are also the roots of\
    \ the SCCs. To determine whether a vertex *u* is the root of an SCC, Tarjan’s\
    \ SCC algorithm uses *dfs_num* and *dfs_low*, i.e. by checking if *dfs_low(u)\
    \ = dfs_num(u)*. The visited vertices are pushed into a stack according to its\
    \ *dfs_num*. When DFS returns from a subtree, the vertices are popped from the\
    \ stack. If the vertex is the root of an SCC, then that vertex and all of the\
    \ vertices popped before it forms that SCC. The code is shown below:"
