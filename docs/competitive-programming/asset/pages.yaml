- pgno: 110
  md: "In fact, there are only 12 integers less than or equal to 36 that are relatively\
    \ prime to 36. They are 1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31, and 35. As we\
    \ need to factor $N$, the complexity of this algorithm is similar with the complexity\
    \ of factoring an integer with trial division mentioned earlier. The code is below.\n\
    \n```\n```cpp\nint EulerPhi(int N) {\n  vi factors = primeFactors(N);\n  vi::iterator\
    \ new_end = unique(factors.begin(), factors.end()); // get unique\n  int result\
    \ = N;\n  for (vi::iterator i = factors.begin(); i != new_end; i++)\n    result\
    \ = result / *i;\n  return result;\n}\n```\n```\n\nProgramming Exercises related\
    \ to Euler’s Totient (Phi) Function:\n\n+   1. UVa 10179 - Irreducible Basic Fractions\
    \ (direct application of Euler’s Phi function)\n+   2. UVa 10299 - Relatives (another\
    \ direct application of Euler’s Phi function)\n+   3. UVa 10820 - Send A Table\
    \ (a[i] = a[i - 1] + 2 × φ(i))\n+   4. UVa 11064 - Number Theory\n+   5. UVa 11327\
    \ - Enumerating Rational Numbers\n\n# 5.3.4  Extended Euclid: Solving Linear Diophantine\
    \ Equation\n\nMotivating problem: Suppose a housewife buys apples and oranges\
    \ at a total cost of 8.39 SGD. If an apple is 25 cents and an orange is 18 cents,\
    \ how many of each type of fruit does she buys?\n\nThis problem can be modeled\
    \ as a linear equation with two variables: $25x + 18y = 839$. Since we know that\
    \ both $x$ and $y$ must be integers, this linear equation is called the Linear\
    \ *Diophantine* Equation. We can solve Linear Diophantine Equation with two variables\
    \ even if we only have one equation! This is different from System of Linear Equations\
    \ discussed later in Section 5.5.5. The solution for the Linear Diophantine Equation\
    \ is as follow [20].\n\nLet $a$ and $b$ be integers with $d = gcd(a, b)$. The\
    \ equation $ax + by = c$ has no integral solutions if $d \\mid c$ is not true.\
    \ But if $d \\mid c$, then there are infinitely many integral solutions. The first\
    \ solution $(x_0, y_0)$ can be found using the *Extended Euclid* algorithm shown\
    \ below (also see [4, Chapter 31), and the rest can be derived from $x = x_0 +\
    \ (b/d)n$, $y = y_0 - (a/d)n$, where $n$ is an integer.\n\n```\n```cpp\n// store\
    \ x, y, and d as global variables\nvoid extendedEuclid(int a, int b) {\n  if (b\
    \ == 0) { x = 1; y = 0; d = a; return; }\n  extendedEuclid(b, a % b);\n  int x1\
    \ = y;\n  int y1 = x - (a / b) * y;\n  x = x1;\n  y = y1;\n}\n```\n```"
