    an edge is simply one unit. Thus the layer count of a vertex that we have seen
    previously is precisely the shortest path length from the source to that vertex.
    For example in Figure 4.7, the shortest path from the vertex labeled with ''35''
    to the vertex labeled ''30'', is 3, as ''30'' is in the third layer in BFS sequence
