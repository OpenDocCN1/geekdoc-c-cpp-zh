- pgno: 107
  md: "```\n```cpp\n#include <bitset> // compact STL for Sieve, more efficient than\
    \ vector<bool>!\nll _sieve_size; // ll is defined as: typedef long long ll;\n\
    bitset<10000010> bs; // 10^7 + small extra bits should be enough for most prime-related\
    \ problems\nvi primes; // compact list of primes in form of vector<int>\n\nvoid\
    \ sieve(ll upperbound) { // create list of primes in [0 .. upperbound]\n  _sieve_size\
    \ = upperbound + 1; // add 1 to include upperbound\n  bs.reset(); bs.flip(); //\
    \ set all numbers to true\n  bs.set(0, false); bs.set(1, false); // except index\
    \ 0 and 1\n  for (ll i = 2; i <= _sieve_size; i++) if (bs.test(i)) {\n    // cross\
    \ out multiples of i starting from i * i!\n    for (ll j = i * i; j <= _sieve_size;\
    \ j += i) bs.set(size_t(j), false);\n    primes.push_back((int)i); // also add\
    \ this vector contains list of primes\n  }\n} // call this method in main method\n\
    \nbool isPrime(ll N) { // a good enough deterministic prime tester\n  if (N <=\
    \ _sieve_size) return bs.test(N); // O(1) for small primes\n  REP (i, 0, primes.size()\
    \ - 1) if (N % primes[i] == 0) return false;\n  return true; // it takes long\
    \ runtime time if N is a large prime!\n} // Note: only work for N <= (last prime\
    \ in vi \"primes\")^2\n\n// in int main()\nsieve(10000000); // can go up to 10^7\n\
    printf(\"%d\\n\", isPrime(5915587277)); // 10 digit prime\n```\n```\n\n# Optimized\
    \ Trial Divisions for Finding Prime Factors\n\nIn number theory, we know that\
    \ a prime number $N$ only have 1 and itself as factors but a **composite** numbers\
    \ $N$, i.e. the non-primes, can be written uniquely it as a multiplication of\
    \ its prime factors. That’s it, prime numbers are multiplicative building blocks\
    \ of integers. For example, $N = 240 = 2 \\times 2 \\times 2 \\times 3 \\times\
    \ 5 = 2^4 \\times 3 \\times 5$ (the latter form is called **prime-power factorization**).\n\
    \nA naïve algorithm generates a list of primes (e.g. with sieve) and check how\
    \ many of them can actually divide the integer $N$ – without changing $N$. This\
    \ can be improved!\n\nA better algorithm utilizes a kind of Divide and Conquer\
    \ spirit. An integer $N$ can be expressed as: $N = PF \\times N'$, where $PF$\
    \ is a prime factor and $N'$ is another number which is $N/PF$ – i.e. we can reduce\
    \ the size of $N$ by taking out its factor $PF$. We can keep doing this until\
    \ eventually $N' = 1$. Special case if $N$ is actually a prime number. The code\
    \ template below takes in an integer $N$ and return the list of prime factors\
    \ – see code below.\n\n```\n```cpp\nvi primeFactors(int N) {\n  vi factors;  \
    \         // vi \"primes\" (generated by sieve) is optional\n  int PF_idx = 0,\
    \ PF = primes[PF_idx]; // using PF = 2, 3, 4, ..., is also ok.\n  while (N !=\
    \ 1 && (PF * PF <= N)) { // stop at sqrt(N), but N can get smaller\n    while\
    \ (N % PF == 0) { N /= PF; factors.push_back(PF); } // remove this PF\n    PF\
    \ = primes[++PF_idx]; // only consider primes!\n  }\n  if (N != 1) factors.push_back(N);\
    \ // special case if N is actually a prime\n  return factors;\n}\n```\n```"
