  md: 'USA Computing Olympiad has a very useful training website [18] for you to learn
    about programming contest. This one is more geared towards IOI participants. Go
    straight to their website, register your account, and train yourself.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_22_0.png)


    Figure 1.3: USACO Training Gateway [18]


    TopCoder arranges frequent ‘Single Round Match’ (SRM) [26] that consists of a
    few problems that should be solved in 1-2 hours. Then afterwards, you are given
    the chance to ‘challenge’ other contestants code by supplying tricky test cases.
    This online judge uses a rating system (red, yellow, blue, etc coders) to reward
    contestants who are really good in problem solving with higher rating as opposed
    to a more diligent contestants who happen to solve ‘more’ easier problems.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_22_1.png)


    Figure 1.4: TopCoder [26]


    # 1.3 Getting Started: Ad Hoc Problems


    We will end this chapter by introducing you to the first problem type in ICPC:
    the Ad Hoc problems. According to USACO training gateway [18], Ad Hoc problems
    are problems that ‘cannot be classified anywhere else’, where each problem description
    and the corresponding solution are ‘unique’. Ad Hoc problems can be further classified
    into two: straightforward – where the solution just requires translation of problem
    requirement to code; or simulation problem – where there are some set of rules
    that must be simulated to obtain the answer.


    Ad Hoc problems almost usually appear in a programming contest. Using a benchmark
    of total 10 problems, there may be 1-2 Ad Hoc problems. If the Ad Hoc problem
    is easy, it will usually be the first problem being attacked by teams in a programming
    contest. But there exists Ad Hoc problems that are complicated to code and some
    teams will strategically defer solving them until the last hour. Assuming a 60
    teams contest, your team is probably in lower half (rank 30-60) if your team can
    only do this type of problem during an ICPC regional contest.


    Get your coding skills up and running by solving these Ad Hoc problems before
    continuing to the next chapter. We have selected one Ad Hoc problem from every
    volume in UVA online judge [17] (there are 28 volumes as of 9 August 2010) plus
    several ones from ACM ICPC Live Archive [11]. Note that some ‘simple’ Ad Hoc problems
    below are ‘tricky’.'
