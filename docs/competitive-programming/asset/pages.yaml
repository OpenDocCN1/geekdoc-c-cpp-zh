    \ the index of minimum element that is stored in this node, which is 5. Thus RMQ(4,\
    \ 6) = 5. We do not have to traverse the unnecessary parts of the tree! In the\
    \ worst case, we have two root-to-leaf paths which is just O(log n). For example\
    \ in RMQ(3, 4) = 4, we have one root-to-leaf path from [0, 6] to [3, 3] and another\
    \ root-to-leaf path from [0, 6] to [4, 4].\n\nIf the array A is static, then using\
    \ Segment Tree to solve RMQ is an overkill as there exists a Dynamic Programming\
    \ (DP) solution that requires O(n log n) one-time pre-processing and O(1) per\
    \ RMQ. This DP solution will be discussed later in Section 3.4.3.\n\nThe Segment\
    \ Tree becomes useful if array A is frequently updated. For example, if A[5] is\
    \ now changed from 1 to 100, then what we need to do is to update the leaf to\
    \ root nodes which can be done in O(log n). The DP solution requires another O(n\
    \ log n) pre-processing to do the same.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_34_0.png)\n\
    \nFigure 2.8: Updating Array A to {8, 7, 3, 9, 5, 100, 10}. Only leaf-to-root\
    \ nodes are affected.\n\nOur library implementation for Segment Tree is shown\
    \ below. The code shown here supports static Range Minimum/Maximum/Sum queries\
    \ (the dynamic update part is left as exercise). There are of course other ways\
    \ to implement segment tree, e.g. a more efficient version that only expands the\
    \ segments when needed.\n\n```\n```cpp\n#include <iostream>\n#include <math.h>\n\
    #include <vector>\nusing namespace std;\n\n// Segment Tree Library\n// The segment\
    \ tree is stored like a heap array\n#define RANGE_SUM 0\n#define RANGE_MIN 1\n\
    #define RANGE_MAX 2\nvi segment_tree;\n\nvoid init_segment_tree(int N) { // if\
    \ original array size is N,\n    // the required segment_tree array length is\
    \ 2*2^(floor(log2(N)) + 1);\n    int length = (int) (2 * pow(2.0, floor(log((double)N)\
    \ / log(2.0)) + 1));\n    segment_tree.resize(length, 0); // resize this vector\
    \ and fill with 0\n}\n\nvoid build_segment_tree(int code, int A[], int node, int\
    \ b, int e) {\n    if (b == e) { // as b == e, either one is fine\n        if\
    \ (code == RANGE_SUM) segment_tree[node] = A[b]; // store value of this cell\n\
    \        else                  segment_tree[node] = b;     // if RANGE_MIN/MAXIMUM,\
    \ store index\n    }\n```\n\n```"
