- pgno: 64
  md: "But these two states are not unique yet. For example, this partial expression:\
    \ ‘1-1+1-1...’ has state idx=3 (indices: 0,1,2,3 have been processed), open=0\
    \ (cannot put close bracket anymore), which sums to 0. Then, ‘1-(1+1-1)...’ also\
    \ has the same state idx=3, open=0 and sums to 0. But ‘1-(1+1)-1...’ has the same\
    \ state idx=3, open=0, but sums to -2. This DP state is not yet unique. So we\
    \ need additional value to distinguish them, i.e. the value ‘val’, to make these\
    \ states unique.\n\nWe can represent all possible states of this problem with\
    \ bool state[idx][open][val], a 3-D array. As ‘val’ ranges from -2800 to 3000\
    \ (5801 distinct values), the number of states is 30 × 30 × 5801 ≈ 5M with only\
    \ O(1) processing per state – fast enough. The code is shown below:\n\n```\n```c\n\
    void rec(int idx, int open, int val) {\n    if (memo[idx][open][val + 3500]) //\
    \ this state has been reached before\n        return; // notice the + 3500 trick\
    \ to convert negative indices to [0 ... 7000]\n               // negative indices\
    \ are not friendly for accessing a static array!\n    memo[idx][open][val + 3500]\
    \ = 1; // set this state to be reached\n\n    if (idx == N) { // last number,\
    \ current value is one of the possible\n        used[val + 3500] = 1; // result\
    \ of expression\n        return;\n    }\n\n    int nval = val + num[idx] * sig[idx]\
    \ * ((open % 2 == 0) ? 1 : -1);\n    if (sig[idx] == -1) // option 1: put an open\
    \ bracket only if sign is -\n        rec(idx+1, open+1, nval); // no effect if\
    \ sign is +\n    if (open > 0) // option 2: put close bracket, can only do this\
    \ if we\n        rec(idx+1, open-1, nval); // already have some open brackets\n\
    \    rec(idx+1, open, nval); // option 3: normal, do nothing\n}\n\n// Prepare\
    \ a bool array ‘used’, initially set to all false,\n//     then run this top-down\
    \ DP.\n// The solution is all the values in array ‘used’,\n//     offset by -3500,\
    \ that are flagged as true.\n```\n```\n\nLesson: DP formulation for this problem\
    \ is not trivial. Try to find a state representation that can uniquely identify\
    \ sub-problems. Make observations and consider attacking the problem from there.\n\
    \n# 6. Max Weighted Independent Set (on a Tree)\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_64_0.png)\n\
    \nFigure 3.12: Max Weighted Independent Set (MWIS) on Tree"
