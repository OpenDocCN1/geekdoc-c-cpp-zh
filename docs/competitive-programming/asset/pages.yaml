  md: "+   - Spheres\n\n+   1. A Sphere is a perfectly round geometrical object in\
    \ 3-D space.\n\n+   2. The **Great-Circle Distance** between any two points A\
    \ and B on sphere [38] is the shortest distance along a path on the **surface\
    \ of the sphere**. This path is equal to the length of the Arc of the **Great-Circle**\
    \ of that sphere that pass through the two points A and B.\n+   \n+   The Great-Circle\
    \ of a sphere is defined as the circle that runs along the surface of the sphere\
    \ so that it cuts the sphere into two equal hemispheres. To find the solution\
    \ to the Great-Circle Distance, we find the central angle AOB (see Figure 7.4)\
    \ of the Great-Circle and use it to determine the length of the arc.\n+   \n+\
    \   Although quite rare, some contest problems use this distance metric. Usually,\
    \ the two points on the surface of a sphere are given as (latitude, longitude)\
    \ pair. The following library code will help us obtain the shortest great-circle\
    \ distance given two points on the sphere and the radius of the sphere. For the\
    \ derivation of this library code, see [38].\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_136_0.png)\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_136_1.png)\n\nFigure 7.4: Great-Circle\
    \ and Great-Circle Distance (Arc A-B) (Figures from [46])\n\n```\ndouble greatCircleDistance(double\
    \ pLat, double pLong,\n                           double qLat, double qLong, double\
    \ radius) {\n    pLat *= PI / 180; pLong *= PI / 180;\n    qLat *= PI / 180; qLong\
    \ *= PI / 180;\n    return radius * acos(cos(pLat)*cos(pLong)*cos(qLat)*cos(qLong)\
    \ +\n                         cos(pLat)*sin(pLong)*cos(qLat)*sin(qLong) +\n  \
    \                       sin(pLat)*sin(qLat));\n}\n```\n\nProgramming Exercises\
