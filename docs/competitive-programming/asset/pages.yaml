  md: '# ### 5.5.4 Probability Theory


    **Probability Theory** is a branch of mathematics concerned with analysis of random
    phenomena. Although an event like an individual coin toss is random, if it is
    repeated many times the sequence of random events will exhibit certain statistical
    patterns, which can be studied and predicted.


    In programming contests, such problems are either solve-able with some closed-form
    formula, or one has no choice than to enumerate the complete search space.


    Programming Exercises related to Probability:


    +   1. UVa 474 - Heads Tails Probability

    +   2. UVa 542 - France 98

    +   3. UVa 10056 - What is the Probability?

