    \ C++ STL `<algorithm>`\n+     1. UVa 146 - ID Codes (use `next_permutation`)\n\
    +     2. UVa 10194 - Football a.k.a. Soccer (multi-fields sorting, use `sort`)\n\
    +     3. UVa 10258 - Contest Scoreboard (multi-fields sorting, use `sort`)\n+\
    \   - Sorting-related problems\n+     1. UVa 299 - Train Swapping (inversion index^4\
    \ problem solvable with bubble sort)\n+     2. UVa 612 - DNA Sorting (inversion\
    \ index + `stable_sort`)\n+     3. UVa 10810 - Ultra Quicksort (inversion index\
    \ - requires O(n log n) merge sort)\n\n^4 Inversion index problem: count how many\
    \ swaps are needed to make the list sorted."
