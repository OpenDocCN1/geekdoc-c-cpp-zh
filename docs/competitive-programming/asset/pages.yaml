    # 4.9 Special Graphs


    Some basic graph problems have simpler / faster polynomial algorithm if the given
    graph is *special*. So far we have identified the following special graphs that
    commonly appear in programming contests: **Tree**, **Directed Acyclic Graph (DAG)**,
    and **Bipartite Graph**. Problem setters may force contestants to use specialized
    algorithms for these special graphs simply by giving a large input size to judge
    a correct algorithm for general graph as Time Limit Exceeded (TLE). In this section,
    we will discuss some popular graph problems on these special graphs (see Figure
    4.25).


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_96_0.png)


    Figure 4.25: Special Graphs (Left to Right): Tree, Directed Acyclic Graph, Bipartite
    Graph'
