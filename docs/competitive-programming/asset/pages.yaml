  md: "# Flood Fill - Labeling the Connected Components\n\nDFS can be used for other\
    \ purpose than just finding (and counting) the connected components. Here, we\
    \ show how a simple tweak of `dfs(u)` can be used to *label* the components. Typically,\
    \ we ‘label’ (or ‘color’) the component by using its component number. This variant\
    \ is more famously known as ‘flood fill’.\n\n```\nvoid floodfill(int u, int color)\
    \ {\n    dfs_num[u] = color; // not just a generic DFS_BLACK\n    Trvii (AdjList[u],\
    \ v) // try all neighbors v of vertex u, note that we use our Trvii macro again\n\
    \        if (dfs_num[v->first] == DFS_WHITE) // avoid cycle\n            floodfill(v->first,\
    \ color); // v is an (neighbor, weight) pair\n}\n\n// inside int main()\nnumComponent\
    \ = 0;\nmemset(dfs_num, DFS_WHITE, sizeof dfs_num);\nREP (i, 0, V - 1) // for\
    \ each vertex u in [0..V-1], note that we use our REP macro again\n    if (dfs_num[i]\
    \ == DFS_WHITE) // if not visited\n        floodfill(i, ++numComponent);\nREP\
    \ (i, 0, V - 1)\n    printf(\"Vertex %d has color %d\\n\", i, dfs_num[i]);\n\n\
    // For the sample graph, the output is like this:\n// Vertex 0~1~2~3~4 have color\
    \ 1\n// Vertex 5 has color 2\n// Vertex 6~7 has color 3\n```\n\nExercise: Flood\
    \ Fill is more commonly performed on 2-D grid (implicit graph). Try to solve UVa\
    \ 352, 469, 572, etc.\n\n# Graph Edges Property Check via DFS Spanning Tree\n\n\
    Running DFS on a connected component of a graph will form a DFS *spanning tree*\
    \ (or *spanning forest* if the graph has more than one component and DFS is run\
    \ on each component). With one more vertex state: `DFS_GRAY = 2` (visited but\
    \ not yet completed) on top of `DFS_WHITE` (unvisited) and `DFS_BLACK` (visited\
    \ and completed), we can use this DFS spanning tree (or forest) to classify graph\
    \ edges into four types:\n\n+   1. **Tree edges:** those traversed by DFS, i.e.\
    \ from vertex with `DFS_GRAY` to vertex with `DFS_WHITE`.\n+   \n+   2. **Back\
    \ edges:** part of cycle, i.e. from vertex with `DFS_GRAY` to vertex with `DFS_GRAY`\
    \ too. Note that usually we do not count bi-directional edges as having ‘cycle’\
    \ (We need to remember `dfs_parent` to distinguish this, see the code below).\n\
    +   \n+   3. **Forward/Cross edges** from vertex with `DFS_GRAY` to vertex with\
    \ `DFS_BLACK`. These two type of edges are not typically used in programming contest\
    \ problem.\n\nFigure 4.2 shows an animation (from top left to bottom right) of\
    \ calling `dfs(0)`, then `dfs(5)`, and finally `dfs(6)` on the sample graph in\
    \ Figure 4.1. We can see that 1 → 2 → 3 → 1 is a (true) cycle and we classify\
    \ edge (3 → 1) as a back edge, whereas 0 → 1 → 0 is not a cycle but edge (1 →\
    \ 0) is just a bi-directional edge. The code for this DFS variant is shown below."
