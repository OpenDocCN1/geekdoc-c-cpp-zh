  md: "the deepest possible vertex from the start vertex before attempting another\
    \ branches. Note that this sequence of visitation depends very much on the way\
    \ we order neighbors of a vertex, i.e. the sequence 0 → 1 → 3 → 2 (backtrack to\
    \ 3) → 4 is also a possible visitation sequence. Also notice that one call of\
    \ `dfs(u)` will only visit all vertices that are *connected* to vertex `u`. That\
    \ is why vertices 5, 6, and 7 in Figure 4.1 are currently unvisited by calling\
    \ `dfs(0)`.\n\nThe DFS code shown here is very similar to the recursive backtracking\
    \ code shown earlier in Section 3.1. If we compare the pseudocode of a typical\
    \ backtracking code (replicated below) with the DFS code shown above, we can see\
    \ that the main difference is just whether we flag visited vertices. DFS does.\
    \ Backtracking does not. By not revisiting vertices, DFS runs in $O(V + E)$, but\
    \ the time complexity of backtracking goes up exponentially.\n\n```\n```c\nvoid\
    \ backtracking(state) {\n    if (hit end state or invalid state) // invalid state\
    \ includes states that cause cycling\n        return; // we need terminating/pruning\
    \ condition\n    for each neighbor of this state // regardless it has been visited\
    \ or not\n        backtracking(neighbor);\n}\n```\n```\n\n# Other Applications\n\
    \nDFS is not only useful for traversing a graph. It can be used to solve many\
    \ other graph problems.\n\n# Finding Connected Components in Undirected Graph\n\
    \nThe fact that one single call of `dfs(u)` will only visit vertices that are\
    \ actually connected to `u` can be utilized to find (and to count) the connected\
    \ components of an undirected graph (see further below for a similar problem on\
    \ directed graph). We can simply use the following code to restart DFS from one\
    \ of the remaining unvisited vertices to find the next connected component (until\
    \ all are visited):\n\n```\n```c\n#define REP(i, a, b) \\\\ // all sample codes\
    \ involving REP use this macro\n  for (int i = int(a); i <= int(b); i++)\n\n//\
    \ inside int main()\nnumComponent = 0;\nmemset(dfs_num, DFS_WHITE, sizeof dfs_num);\n\
    REP (i, 0, V - 1)\n    if (dfs_num[i] == DFS_WHITE) {\n        printf(\"Component\
    \ %d, visit: \", ++numComponent);\n        dfs(i);\n        printf(\"\\n\");\n\
    \    }\nprintf(\"There are %d connected components\\n\", numComponent);\n\n//\
    \ For the sample graph, the output is like this:\n// Component 1, visit: 0 1 2\
    \ 3 4\n// Component 2, visit: 5\n// Component 3, visit: 6 7\n```\n```\n\nExercise:\
    \ We can also use Union-Find Disjoint Sets to solve this graph problem. How?"
