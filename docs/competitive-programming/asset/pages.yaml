    with DP)

    +       9. UVa 10496 - Collecting Beepers (small TSP instance)

    +       10. LA 4793 - Robots on Ice (World Finals Harbin10, recommended problem
    for practice)


    Problem I - ''Robots on Ice'' in the recent ACM ICPC World Final 2010 can be viewed
    as a ''tough test on pruning strategy''. The problem is simple: Given an M x N
    board with 3 check-in points {A, B, C}, find a Hamiltonian path of length (M x
    N) from coordinate (0, 0) to coordinate (0, 1). This Hamiltonian path must hit
    check point {A, B, C} at one-fourth, one-half, and three-fourths of the way through
    its tour, respectively. Constraints: 2 <= M, N <= 8.


    A naive recursive backtracking algorithm will get TLE. To speed up, we must prune
    the search space if: 1). it does not hit the appropriate target check point at
    1/4, 1/2, or 3/4 distance; 2). it hits target check point earlier than the target
    time; 3). it will not be able to reach the next check point on time from the current
    position; 4). it will not be able to reach final point (0, 1) as the current path
    blocks the way. These 4 pruning strategies are sufficient to solve LA 4793.'
