  md: "**Isosceles** Triangle, two edges have the same length;  \n**Scalene** Triangle,\
    \ no edges have the same length;  \n**Right** Triangle, one of its interior angle\
    \ is 90 degrees (or a **right angle**).\n\n+   2. The **Area** $A$ of a triangle\
    \ with base $b$ and height $h$ is $A = 0.5 \\times b \\times h$.\n+   \n+   3.\
    \ The **Perimeter** $p$ of a triangle with three sides: $a$, $b$, and $c$ is $p\
    \ = a + b + c$.\n+   \n+   4. The **Heron’s Formula**: The area $A$ of a triangle\
    \ with 3 sides: $a$, $b$, $c$, is $A = \\sqrt{s \\times (s-a) \\times (s-b) \\\
    times (s-c)}$, where $s = 0.5 \\times p$ (the **Semi-Perimeter** of the triangle).\n\
    +   \n+   5. The radius $r$ of the Triangle’s **Inner Circle** with area $A$ and\
    \ the semi-perimeter $s$ is $r = A/s$.\n+   \n+   6. The radius $R$ of the Triangle’s\
    \ **Outer Circle** with 3 sides: $a$, $b$, $c$ and area $A$ is $R = a \\times\
    \ b \\times c/(4 \\times A)$.\n+   \n+   7. In **Trigonometry**, the **Law of\
    \ Cosines** (a.k.a. the **Cosine Formula** or the **Cosine Rule**) is a statement\
    \ about a general triangle that relates the lengths of its sides to the cosine\
    \ of one of its angles. See the scalene (middle) triangle in Figure 7.2. With\
    \ the notation described here, we have: $c^2 = a^2 + b^2 - 2 \\times a \\times\
    \ b \\times \\cos(\\gamma)$. This formula can be rewritten for the other two angles\
    \ $\\alpha$ and $\\beta$.\n+   \n+   8. In Trigonometry, the **Law of Sines**\
    \ (a.k.a. the **Sine Formula** or the **Sine Rule**) is an equation relating the\
    \ lengths of the sides of an arbitrary triangle to the sines of its angle. See\
    \ the scalene (middle) triangle in Figure 7.2. With the notation described there,\
    \ we have: $\\frac{a}{\\sin(\\alpha)} = \\frac{b}{\\sin(\\beta)} = \\frac{c}{\\\
    sin(\\gamma)}$.\n+   \n+   9. In Trigonometry, the **Pythagorean Theorem** specializes\
    \ the **Law of Cosines**. The Pythagorean theorem is only correct for right triangles.\
    \ If the angle $\\gamma$ is a right angle (of measure $90^\\circ$ or $\\pi/2$\
    \ radians), then $\\cos(\\gamma) = 0$, and thus the law of cosines reduces to:\
    \ $c^2 = a^2 + b^2$.\n+   \n+   10. In Trigonometry, the **Pythagorean Triple**\
    \ is a triple with three positive integers $a$, $b$, and $c$, such that $a^2 +\
    \ b^2 = c^2$. Such a triple is commonly written as $(a,b,c)$. A well-known example\
    \ is $(3,4,5)$. If $(a,b,c)$ is a Pythagorean triple, then so is $(ka,kb,kc)$\
    \ for any positive integer $k$. A **Primitive Pythagorean Triple** is one in which\
    \ $a$, $b$, and $c$ are coprime. Primitive Pythagorean Triples describe the three\
    \ integer side lengths of a Right Triangle, although the converse may not be true.\n\
    \nProgramming Exercises related to Triangles (and possibly Circles again):\n\n\
