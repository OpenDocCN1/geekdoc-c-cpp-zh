    # ### 6.4.3 Suffix Array: Basic Ideas


    Building efficient Suffix Tree under contest environment is a bit complex and
    risky. Fortunately, another data structure that we are going to describe, called
    Suffix **Array** invented by Udi Manber and Gene Myers, has similar functionalities
    as Suffix Tree but simpler to implement, especially in programming contest setting.
    Thus we will skip the discussion on building a Suffix Tree and instead focus on
    Suffix Array.


    Basically, Suffix Array is an integer array that contains indices of sorted suffixes.
    For example, consider the same S = ''acacag$'' with *n* = 7. The Suffix Array
    of S is an integer permutation of *n* as shown in Figure 6.4. Note that we regard
    the terminating symbol $ as the lexicographically smallest character.


    | Suffix | Position |

    |---|---|

    | acacag$ | 1 |

    | cacag$ | 2 |

    | acag$ | 3 |

    | cag$ | 4 |

    | ag$ | 5 |

    | g$ | 6 |

    | $ | 7 |


    ⇒ Sort


    | SA[i] | Suffix |

    |---|---|

    | 7 | $ |

    | 1 | acacag$ |

    | 3 | acag$ |

    | 5 | ag$ |

    | 2 | cacag$ |

    | 4 | cag$ |

    | 6 | g$ |


    Figure 6.4: Suffix Array of S = ''acacag$'' (Figure from [24])


    Suffix Tree and Suffix Array are very related. As we can see in Figure 6.5, the
    leaves of a Suffix Tree (from left to right) is in Suffix Array order. In short,
    a **vertex** in Suffix Tree corresponds to a **range** in Suffix Array!


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_127_1.png)


    A Suffix Array is good enough for many practical string operations in contest
    problems. In this section, we present two simple ways to build a Suffix Array
    given a string S[0 . . . n-1].'
