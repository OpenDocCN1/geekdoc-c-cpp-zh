- pgno: 52
  md: 'We can formally define these Complete Search recurrences:


    +   1. if `money_left < 0` (i.e. money goes negative),

    +      `shop(money_left, garment_id) = INVALID` (in practice, we can return a
    large negative value)

    +   2. if a model from the last `garment_id` has been bought (i.e. a candidate
    solution),

    +      `shop(money_left, garment_id) = M - money_left` (this is the actual money
    spent)

    +   3. in general case, for all model in `[1...K]` of current `garment_id`

    +      `shop(money_left, garment_id) =`

    +      `    max(shop(money_left - price[garment_id][model], garment_id + 1))`

    +      We want to maximize this value (Recall that invalid ones have large negative
    value)


    This solution works correctly, but **very slow**! Let''s analyze its worst case
    time complexity. In the largest test case, `garment_id 0` have up to 20 choices;
    `garment_id 1` *also* have up to 20 choices; ...; and the last `garment_id 19`
    *also* have up to 20 choices. Therefore, Complete Search like this runs in `20
    × 20 × ... × 20` of total 20 times in the worst case, i.e. `20^20` = a **very
    very large** number. If we *only* know Complete Search, there is no way we can
    solve this problem.


    # **Approach 2: Greedy (Wrong Answer)**


    Since we want to maximize the budget spent, why don''t we take the most expensive
    model in each `garment_id` which still fits our budget? For example in test case
    A above, we choose the most expensive model 3 of `garment_id = 0` with cost 8
    (`money_left = 20-8 = 12`), then choose the most expensive model 2 of `garment_id
    = 1` with cost 10 (`money_left = 12-10 = 2`), and then for `garment_id = 2`, we
    can only choose model 1 with cost 1 as `money_left` does not allow us to buy other
    models with cost 3 or 5. This greedy strategy ''works'' for test cases A+B above
    and produce the same optimal solution (8+10+1) = 19 and ''no solution'', respectively.
    It also runs very fast, which is 20 + 20 + ... + 20 of total 20 times = 400 operations
    in the worst case.


    But greedy does not work for many other cases. This test case below is a counter-example:


    ```

    M = 12, C = 3

    3 models of garment_id 0 → 6 4 8

    2 models of garment_id 1 → 5 10

    4 models of garment_id 2 → 1 5 3 5

    ```


    Greedy strategy selects model 3 of `garment_id = 0` with cost 8 (`money_left =
    12-8 = 4`), thus we do not have enough money to buy any model in `garment_id =
    1` and wrongly reports ''no solution''. The optimal solution is actually **(4+5+3
    = 12)**, which use all our budget.


    # **Approach 3: Top-Down DP (Accepted)**


    To solve this problem, we have to use DP. Let''s see the key ingredients to make
    DP works:


    +   1. This problem has optimal sub-structures.

    +      This is shown in Complete Search recurrence 3 above; solution for the sub-problem
    is part of the solution of the original problem. Although optimal sub-structure
    are the same ingredient to make a Greedy Algorithm work, this problem lacks the
    ''greedy property'' ingredient.

    +   2. This problem has overlapping sub-problems.

    +      This is the key point of DP! The search space is actually not as big as
    `20^20` analyzed in Complete Search discussion above as **many** sub-problems
    are actually overlapping!'
