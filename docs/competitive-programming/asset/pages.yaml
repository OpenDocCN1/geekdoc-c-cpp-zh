- pgno: 16
  md: 'The goal is not just to map problems into categories as in Table 1.1. After
    you are familiar with most of the topics in this book, you can classify the problems
    into just four types as in Table 1.3.


    **Table 1.3: Problem Types (Compact Form)**


    | No | Category | Confidence and Expected Solving Speed |

    |---|---|---|

    | A. | I have solved this type before | Confident that I can solve it again now
    (and fast) |

    | B. | I have solved this type before | But I know coding the solution takes time
    |

    | C. | I have seen this type before | But that time I have not or cannot solve
    it |

    | D. | I have not seen this type before | I may or may not be able to solve it
    now |


    To be competitive, you must frequently classify the problems that you read in
    the problem set into type A (or at least type B).


    # 1.2.2  Tip 2: Do Algorithm Analysis


    Once you have designed an algorithm to solve a particular problem in a programming
    contest, you must now ask this question: Given the maximum input bound (usually
    given in a good problem description), can the currently developed algorithm, with
    its time/space complexity, pass the time/memory limit given for that particular
    problem?


    Sometimes, there are more than one way to attack a problem. However, some of them
    may be incorrect and some of them are not fast enough... The rule of thumb is:
    Brainstorm many possible algorithms - then pick the **simplest that works** (fast
    enough to pass the time and memory limit, yet still produce correct answer!).


    For example, the maximum size of input n is 100K, or 10⁵ (1K = 1,000), and your
    algorithm is of order O(n²). Your common sense told you that (100K)² is an extremely
    big number, it is 10¹⁰. So, you will try to devise a faster (and correct) algorithm
    to solve the problem, say of order O(n log₂ n). Now 10⁵ log₂ 10⁵ is just 1.7 ×
    10⁶ ... Since computer nowadays are quite fast and can process up to order 1M,
    or 10⁶ (1M = 1,000,000) operations in seconds, your common sense told you that
    this one likely able to pass the time limit.


    Now how about this scenario. You can only devise an algorithm of order O(n⁴).
    Seems pretty bad right? But if n ≤ 10... then you are done. Just directly implement
    your O(n⁴) algorithm since 10⁴ is just 10K and your algorithm will only use relatively
    small computation time.


    So, by analyzing the complexity of your algorithm with the given input bound and
    stated time/memory limit, you can do a better judging whether you should try coding
    your algorithm (which will take your time, especially in the time-constrained
    ICPCs and IOIs), or attempt to improve your algorithm first or switch to other
    problems in the problem set.


    In this book, we will not discuss the concept of algorithm analysis. We assume
    that you have this basic skill. Please check this reference book: “Introduction
    to Algorithms” [4] and make sure you understand how to:


    +   - Prove correctness of an algorithm (especially for Greedy algorithms, see
    Section 3.3).

    +   - Analyze time/space complexity analysis for iterative and recursive algorithms.

    +   - Perform amortized analysis (see [4], Chapter 17) – although rarely used
    in contests.

    +   - Do output-sensitive analysis, to analyze algorithm which depends on output
    size, example: the O(|Q| + occ) complexity for finding an exact string matching
    of query string Q with help of Suffix Tree (see Section 6.4).'
