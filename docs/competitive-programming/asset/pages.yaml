    # 4.9.2  Directed Acyclic Graph


    A Directed Acyclic Graph, abbreviated as DAG, is a special graph with the following
    characteristics: it is directed and has no cycle.


    # Single-Source Shortest Paths on DAG


    The Single-Source Shortest Paths (SSSP) problem becomes much simpler if the given
    graph is a DAG as DAG has at least one topological order! We can use an $O(V+E)$
    topological sort algorithm in Section 4.2 to find one such topological order,
    then relax edges according to this order. The topological order will ensure that
    if we have a vertex $b$ that has an incoming edge from a vertex $a$, then vertex
    $b$ is relaxed after vertex $a$. This way, the distance information propagation
    is correct with just one $O(V+E)$ linear pass!


    # Single-Source Longest Paths on DAG


    Single-Source Longest Paths problem, i.e. finding the longest path from a starting
    vertex $s$ is NP-complete on a general graph [39]. However the problem is again
    easy if the graph has no cycle, which is true in DAG. The solution for the Longest
    Paths in DAG (a.k.a. Critical Paths) is just a minor tweak from the SSSP solution
    in DAG shown above, i.e. simply negate all edge weights.


    # Min Path Cover on DAG


    Motivating problem: Imagine that the vertices in Figure 4.26.A are passengers,
    and we draw an edge between two vertices $u-v$ if a single taxi can serve passenger
    $u$ then passenger $v$ on time. The question is: What is the minimum number of
    taxis that must be deployed to serve all passengers?'
