    n\", u, v->first);\n  }\n  dfs_num[u] = DFS_BLACK; // now color this as BLACK\
    \ (DONE)\n}\n```\n\n# **Finding Articulation Points and Bridges**\n\nMotivating\
    \ problem: Given a road map (undirected graph) with cost associated to all intersections\
    \ (vertices) and roads (edges), sabotage either a single intersection or a single\
    \ road that has minimum cost such that the road network breaks down. This is a\
    \ problem of finding the least cost Articulation Point (intersection) or the least\
    \ cost Bridge (road) in an undirected graph (road map).\n\nAn ‘Articulation Point’\
    \ is defined as a *vertex* in a graph G whose removal disconnects G. A graph without\
    \ any articulation points is called ‘Biconnected’. Similarly, a ‘Bridge’ is defined\
    \ as an *edge* in a graph G whose removal disconnects G. These two problems are\
    \ usually defined for undirected graphs, although they are still well defined\
