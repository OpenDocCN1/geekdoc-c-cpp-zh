    # ## 2.3  Data Structures with Our-Own Libraries


    As of 9 August 2010, important data structures shown in this section do not have
    built-in support yet in C++ STL or Java API. Thus, to be competitive, contestants
    must have a bug-free implementations during contests. In this section, we only
    discuss the ideas of these data structures.


    # ### 2.3.1  Graph


    Graph is a pervasive data structure which appears in many CS problems. Graph is
    simply a collection of vertices and edges (that store connectivity information
    between those vertices). In Chapter 3 & 4, we will explore many important graph
    problems and algorithms. In this subsection, we only briefly discuss four basic
    ways (there are others) to store graph information. Assuming that we have a graph
    $G$ with $V$ vertices and $E$ edges, here are the ways to store them:


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_29_0.png)'
