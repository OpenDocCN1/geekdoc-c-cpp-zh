    \nThe string alignment problem discussed in Section 6.3 is called the **global\
    \ alignment problem**. The best solution so far is to *O(nm/log² n)* [24] but\
    \ it is complicated to code. However if the given context problem is limited to\
    \ *d insertions or deletions* only, we can speed up Needleman-Wunsch’s algorithm\
    \ to *O(dn)* by just concentrating on the main diagonal of DP matrix.\n\nFor the\
    \ specialized case of local alignment problem, a better algorithm similar to Needleman-Wunsch’s\
    \ algorithm exists (**Smith-Waterman’s algorithm** [24]).\n\nThe Longest Common\
    \ Subsequence problem can be solved in *O(n log n)* when all characters are distinct\
    \ [24].\n\nThere are other string matching algorithms that are not discussed in\
    \ this chapter: **Rabin-Karp’s, Boyer-Moore’s, Knuth-Morris-Pratt’s (KMP), Aho-Corasick’s**,\
    \ etc. But for many contest problems involving string, using library functions\
    \ like C `strstr` in `<string.h>` or `string.find()` in C++ STL `<string>` is\
    \ usually already sufficient. If a faster string matching algorithm is needed\
    \ during contest time, we suggest using Suffix Array that has been discussed in\
