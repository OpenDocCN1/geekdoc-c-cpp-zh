    \ afraid to tackle them due to floating point precision errors¹ or the many tricky\
    \ ‘special cases’ commonly found in geometry problems. Some others skip these\
    \ problems as they forgot some important formulas and unable to derive the required\
    \ formulas from basic concepts. Study this chapter for some ideas on tackling\
    \ (computational) geometry problems in ICPC.\n\n# 7.1  Overview and Motivation\n\
    \nAlmost all ICPC problem sets have at least one geometry problem. If you are\
    \ lucky, it ask you for some geometry solution that you have learned in pre-University\
    \ which you still remember or the solution can be derived by drawing the geometrical\
