  md: "# # Foreword\n\nLong time ago (exactly the Tuesday November 11th 2003 at 3:55:57\
    \ UTC), I received an e-mail with the following sentence: I should say in a simple\
    \ word that with the UVa Site, you have given birth to a new CIVILIZATION and\
    \ with the books you write (he meant “Programming Challenges: The Programming\
    \ Contest Training Manual” [23], coauthored with Steven Skiena), you inspire the\
    \ soldiers to carry on marching. May you live long to serve the humanity by producing\
    \ super-human programmers.\n\nAlthough it’s clear that was an exaggeration, to\
    \ tell the truth I started thinking a bit about and I had a dream: to create a\
    \ community around the project I had started as a part of my teaching job at UVa,\
    \ with persons from everywhere around the world to work together after that ideal.\
    \ Just by searching in Internet I immediately found a lot of people who was already\
    \ creating a web-ring of sites with excellent tools to cover the many lacks of\
    \ the UVa site.\n\nThe more impressive to me was the ‘Methods to Solve’ from Steven\
    \ Halim, a very young student from Indonesia and I started to believe that the\
    \ dream would become real a day, because the contents of the site were the result\
    \ of a hard work of a genius of algorithms and informatics. Moreover his declared\
    \ objectives matched the main part of my dream: to serve the humanity. And the\
    \ best of the best, he has a brother with similar interest and capabilities, Felix\
    \ Halim.\n\nIt’s a pity it takes so many time to start a real collaboration, but\
    \ the life is as it is. Fortunately, all of us have continued working in a parallel\
    \ way and the book that you have in your hands is the best proof.\n\nI can’t imagine\
    \ a better complement for the UVa Online Judge site, as it uses lots of examples\
    \ from there carefully selected and categorized both by problem type and solving\
    \ techniques, an incredible useful help for the users of the site. By mastering\
    \ and practicing most programming exercises in this book, reader can easily go\
    \ to 500 problems solved in UVa online judge, which will place them in top 400-500\
    \ within ≈100000 UVa OJ users.\n\nThen it’s clear that the book “Competitive Programming:\
    \ Increasing the Lower Bound of Programming Contests” is suitable for programmers\
    \ who wants to improve their ranks in upcoming ICPC regionals and IOIs. The two\
    \ authors have gone through these contests (ICPC and IOI) themselves as contestants\
    \ and now as coaches. But it’s also an essential colleague for the newcomers,\
    \ because as Steven and Felix say in the introduction ‘the book is not meant to\
    \ be read once, but several times’.\n\nMoreover it contains practical C++ source\
    \ codes to implement the given algorithms. Because understand the problems is\
    \ a thing, knowing the algorithms is another, and implementing them well in short\
    \ and efficient code is tricky. After you read this extraordinary book three times\
    \ you will realize that you are a much better programmer and, more important,\
    \ a more happy person.\n\nMiguel A. Revilla  \nUVa Online Judge site creator \
    \ \nACM-ICPC International Steering Committee Member and Problem Archivist  \n\
    University of Valladolid  \nhttp://uva.onlinejudge.org  \nhttp://acmicpc-live-archive.uva.es"
  merge: -1
  img_proc: true
- pgno: 5
  md: '# # Preface


    This is a book that every competitive programmer must read – and master, at least
    during the middle phase of their programming career: when they want to leap forward
    from ‘just knowing some programming language commands’ and ‘some algorithms’ to
    become a top programmer.


    Typical readers of this book will be: 1). Thousands University students competing
    in annual ACM International Collegiate Programming Contest (ICPC) [27] regional
    contests, 2). Hundreds Secondary or High School Students competing in annual International
    Olympiad in Informatics (IOI) [12], 3). Their coaches who are looking for a comprehensive
    training materials [9], and 4). Basically anyone who loves problem solving using
    computer.


    Beware that this book is *not* for a novice programmer. When we wrote the book,
    we set it for readers who have knowledge in basic programming methodology, familiar
    with at least one programming language (C/C++/Java), and have passed basic data
    structures and algorithms (or equivalent) typically taught in year one of Computer
    Science University curriculum.


    Due to the diversity of its content, this book is *not* meant to be read once,
    but several times. There are many exercises and programming problems scattered
    throughout the body text of this book which can be skipped at first if solution
    is not known at that point of time, but can be revisited in latter time after
    the reader has accumulated new knowledge to solve it. Solving these exercises
    help strengthening the concepts taught in this book as they usually contain interesting
    twists or variants of the topic being discussed, so make sure to attempt them.


    Use uva.onlinejudge.org/index.php?option=com_onlinejudge&Itemid=8&category=118,
    felix-halim.net/uva/hunting.php, www.uvatoolkit.com/problemssolve.php, and www.comp.nus.edu.sg/~stevenha/programming/acmoj.html
    to help you to deal with UVa [17] problems listed in this book.


    We know that one probably cannot win an ACM ICPC regional or get a gold medal
    in IOI just by mastering the *current version* of this book. While we have included
    a lot of material in this book, we are well aware that much more than what this
    book can offer, are required to achieve that feat. Some pointers are listed throughout
    this book for those who are hungry for more.


    We believe this book is and will be relevant to many University and high school
    students as ICPC and IOI will be around for many years ahead. New students will
    require the ‘basic’ knowledge presented in this book before hunting for more challenges
    after mastering this book. But before you assume anything, please check this book’s
    table of contents to see what we mean by ‘basic’.


    We will be happy if in year 2010 and beyond, the level of competitions in ICPC
    and IOI increase because many of the contestants have mastered the content of
    this book. We hope to see many ICPC and IOI coaches around the world, especially
    in South East Asia, adopt this book knowing that without mastering the topics
    *in and beyond* this book, their students have no chance of doing well in future
    ICPCs and IOIs. If such increase in ‘required lowerbound knowledge’ happens, this
    book has fulfilled its objective of advancing the level of human knowledge in
    this era.


    To a better future of humankind,

    Steven and Felix Halim


    PS: To obtain example source codes, visit http://sites.google.com/site/stevenhalim.

    To obtain PowerPoint slides/other instructional materials (only for coaches),
    send a personal request email to stevenhalim@gmail.com.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# # Authors’ Profiles


    # Steven Halim, PhD <stevenhalim@gmail.com>


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_6_0.png)


    Steven Halim is currently an instructor in School of Computing, National University
    of Singapore (SoC, NUS). He teaches several programming courses in NUS, ranging
    from basic programming methodology, intermediate data structures and algorithms,
    and up to the ‘Competitive Programming’ module that uses this book. He is the
    coach of both NUS ACM ICPC teams and Singapore IOI team. He participated in several
    ACM ICPC Regional as student (Singapore 2001, Aizu 2003, Shanghai 2004). So far,
    he and other trainers @ NUS have successfully groomed one ACM ICPC World Finalist
    team (2009-2010) as well as two silver and two bronze IOI medalists (2009).


    # Felix Halim, PhD Candidate <felix.halim@gmail.com>


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_6_1.png)


    Felix Halim is currently a PhD student in the same University: SoC, NUS. In terms
    of programming contests, Felix has much colorful reputation than his older brother.
    He was IOI 2002 contestant. His teams (at that time, Bina Nusantara University)
    took part in ACM ICPC Manila Regional 2003-2004-2005 and obtained rank 10th, 6th,
    and 10th respectively. Then, in his final year, his team finally won ACM ICPC
    Kaohsiung Regional 2006 and thus became ACM ICPC World Finalist @ Tokyo 2007 (Honorable
    Mention). Today, felix_halim actively joins TopCoder Single Round Matches and
    his highest rating is a yellow coder.'
  merge: -1
  img_proc: true
