    # 4.7  Floyd Warshall’s


    # Basic Form and Application


    Motivating Problem: Given a connected, weighted graph $G$ with $V \le 100$ and
    two vertices $s1$ and $s2$, find a vertex $v$ in $G$ that represents the best
    meeting point, i.e. $dist[s1][v] + dist[s2][v]$ is the minimum over all possible
    $v$. What is the best solution?


    This problem requires the shortest path information from two sources s1 and s2
    to all vertices in G. This can be easily done with two calls of Dijkstra’s algorithm.
    One from s1 to produce shortest distance array dist1 from s1, and one from s2
    to produce dist2. Then iterates through all possible vertices in graph to find
    v such that dist1[v] + dist2[v] is minimized. Can we do better?


    If the given graph is known to have $V \le 100$, then there is an even ‘simpler’
    algorithm — in terms of implementation — to solve this problem as quickly as possible!'
