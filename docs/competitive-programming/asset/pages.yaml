  md: "In this section, we give two examples of this simple paradigm and provide a\
    \ few tips to give Complete Search solution a better chance to pass the required\
    \ Time Limit.\n\n# ### 3.1.1 Examples\n\nWe show two examples of Complete Search:\
    \ one that is implemented iteratively and one that is implemented recursively\
    \ (backtracking). We also mention a few optimization tricks to make some ‘impossible’\
    \ cases become possible.\n\n+   1. Iterative Complete Search: UVa 725 - Division\n\
    +   \n+       Abridged problem statement: Find and display all pairs of 5-digit\
    \ numbers that between them use the digits 0 through 9 once each, such that the\
    \ first number divided by the second is equal to an integer N, where 2 ≤ N ≤ 79.\
    \ That is, abcde / fghij = N, where each letter represents a different digit.\
    \ The first digit of one of the numerals is allowed to be zero, e.g. 79546 / 01283\
    \ = 62; 94736 / 01528 = 62.\n+   \n+       A quick analysis shows that fghij can\
    \ only be from 01234 to 98765, which is ≈ 100K possibilities. For each tried fghij,\
    \ we can get abcde from fghij * N and then check if all digits are different.\
    \ 100K operations are small. Thus, iterative Complete Search is feasible.\n+ \
    \      Exercise 1: What is the advantage of iterating through all possible fghij\
    \ and not abcde?\n+       Exercise 2: Does a 10! algorithm that permutes abcdefghij\
    \ work?\n+   \n+   2. Recursive Backtracking: UVa 750 - 8 Queens Chess Problem\n\
    +   \n+       Abridged problem statement: In chess (with a standard 8x8 board),\
    \ it is possible to place eight queens on the board so that no queen can be taken\
    \ by any other. Write a program that will determine all such possible arrangements\
    \ given the initial position of one of the queens (i.e. coordinate (a, b) in the\
    \ board must contain a queen).\n+   \n+       A naïve solution tries all 8^8 ≈\
    \ 17M possible arrangements of 8 queens in an 8x8 board, putting each queen in\
    \ each possible cell and filter the invalid ones. Complete Search like this receives\
    \ Time Limit Exceeded (TLE) response. We should reduce the search space more.\n\
    +   \n+       We know that no two queens can share the same column, thus we can\
    \ simplify the problem to finding valid permutation of 8! row positions row[i]\
    \ stores the row position of queen in column i. Example: row = {2, 4, 6, 8, 3,\
    \ 1, 7, 5} as in Figure 3.1 is one of the solution for this problem; row[1] =\
    \ 2 implies that queen in column 1 is placed in row 2, and so on (the index starts\
    \ from 1 in this example). Modeled this way, the search space goes down from 8^8\
    \ = 17M to 8! = 40K.\n+   \n+       We also know that no two queens can share\
    \ any of the two diagonals. Assuming queen A is at (i, j) and queen B is at (k,\
    \ l), then they attack each other iff abs(i - k) == abs(j - l). Go ahead and verify\
    \ this formula by placing two queens randomly but on the same diagonal.\n+   \n\
    +       A recursive backtracking solution will then place the queens one by one\
    \ from column 1 to 8, obeying the two constraints above. Finally, if a candidate\
    \ solution is found, check if one of the queen satisfies the input constrain,\
    \ i.e. row[b] == a. This solution is Accepted.\n+   \n+       We provide our code\
    \ in the next page below. If you have never code a recursive backtracking solution\
    \ before, please scrutinize it and perhaps re-code it using your own coding style.\
    \ For example, you may want to use C++ STL <algorithm>: next_permutation instead."
