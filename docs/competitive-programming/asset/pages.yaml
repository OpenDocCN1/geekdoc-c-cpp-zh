  md: "# Chapter 3\n\n# Problem Solving Paradigms\n\n> *If all you have is a hammer,\
    \ everything looks like a nail*  \n> — Abraham Maslow, 1962\n\nThis chapter highlights\
    \ four problem solving paradigms commonly used to attack problems in programming\
    \ contests, namely Complete Search, Divide & Conquer, Greedy, and Dynamic Programming.\
    \ Mastery of all these problem solving paradigms will help contestants to attack\
    \ each problem with the appropriate ‘tool’, rather than ‘hammering’ every problem\
    \ with brute-force solution... which is clearly not competitive. Our advice before\
    \ you start reading: Do not just remember the solutions for the problems presented\
    \ in this chapter, but remember the way, the spirit of solving those problems!\n\
    \n# 3.1  Complete Search\n\nComplete Search, also known as brute force or recursive\
    \ backtracking, is a method for solving a problem by searching (up to) the entire\
    \ search space in bid to obtain the required solution.\n\nIn programming contests,\
    \ a contestant *should* develop a Complete Search solution when there is clearly\
    \ no clever algorithm available (e.g. the problem of enumerating *all* permutations\
    \ of {1, 2, 3, ..., N}, which clearly requires *O(N!)* operations) or when such\
    \ clever algorithms exist, but overkill, as the input size happens to be small\
    \ (e.g. the problem of answering Range Minimum Query as in Section 2.3.3 but on\
    \ a static array with *N ≤ 100* — solvable with *O(N)* loop).\n\nIn ICPC, Complete\
    \ Search should be the first considered solution as it is usually easy to come\
    \ up with the solution and code/debug it. A *bug-free* Complete Search solution\
    \ should *never* receive Wrong Answer (WA) response in programming contests as\
    \ it explores the *entire* search space. However, many programming problems do\
    \ have better-than-Complete-Search solutions. Thus a Complete Search solution\
    \ may receive a Time Limit Exceeded (TLE) verdict. With proper analysis, you can\
    \ determine which is the likely outcome (TLE versus AC) before attempting to code\
    \ anything (Table 1.4 in Section 1.2.2 is a good gauge). If Complete Search can\
    \ likely pass the time limit, then go ahead. This will then give you some time\
    \ to work on the harder problems, where Complete Search is too slow. In IOI, we\
    \ usually need better problem solving techniques.\n\nSometimes, running Complete\
    \ Search on small instances of a hard problem can give us some patterns from the\
    \ output that can be exploited to design faster algorithm. The Complete Search\
    \ solution can also act as a verifier for faster but non-trivial algorithms (but\
    \ only on small instances)."
