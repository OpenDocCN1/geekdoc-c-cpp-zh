  md: '![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_83_0.png)


    Figure 4.11: Partial ‘Minimum’ Spanning Tree Problem


    # Partial ‘Minimum’ Spanning Tree


    In this variant, we do not start with a clean slate. Some edges in the given graph
    are already fixed and must be taken as part of the Spanning Tree solution. We
    must continue building the ‘MST’ from there, thus the resulting Spanning Tree
    perhaps no longer minimum overall. That’s why we put the term ‘Minimum’ in quotes.
    In Figure 4.11, we see an example when one edge 1-2 is already fixed (left). The
    actual MST is 10+13+17 = 40 which omits the edge 1-2 (middle). However, the solution
    for this problem must be (25)+10+13 = 48 which uses the edge 1-2 (right).


    The solution for this variant is simple. After taking into account all the fixed
    edges, we continue running Kruskal’s algorithm on the remaining free edges.


    # Minimum Spanning ‘Forest’


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_83_1.png)


    Figure 4.12: Minimum Spanning ‘Forest’ Problem


    In this variant, we want the spanning criteria, i.e. all vertices must be covered
    by some edges, but we can stop even though the spanning tree has not been formed
    as long as the spanning criteria is satisfied. This can happen when we have a
    spanning ‘forest’. Usually, the desired number of components is told beforehand
    in the problem description. In Figure 4.12, left, we observe that the MST for
    this graph is 10+13+17 = 40. But if we want a spanning forest with 2 components,
    then the solution is just 10+13 = 23 on Figure 4.12, right.


    To get minimum spanning forest is simple. Run Kruskal’s algorithm as per normal,
    but as soon as the number of connected component equals to the desired pre-determined
    number, we can terminate the algorithm.


    # Second Best Spanning Tree


    Sometimes, we are interested to have a backup plan. In the context of finding
    the MST, we may want not just the MST, but also the second best spanning tree,
    in case the MST is not workable. Figure 4.13 shows the MST (left) and the second
    best ST (right). We can see that the second best ST is actually the MST with just
    two edges difference, i.e. one edge is taken out from MST and another chord² edge
    is added to MST. In this example: the edge 4-5 is taken out and the edge 2-5 is
    added in.'
  merge: -1
