- pgno: 25
  md: '# Chapter 2


    # Data Structures and Libraries


    > > If I have seen further it is only by standing on the shoulders of giants.

    > >

    > > — Isaac Newton


    This chapter acts as a foundation for subsequent chapters.


    # 2.1  Data Structures


    Data structure is ‘a way to store and organize data’ in order to support efficient
    insertions, queries, searches, updates, and deletions. Although a data structure
    in itself does not solve the given programming problem – the algorithm operating
    on it does, using the most efficient data structure for the given problem may
    be a difference between passing or exceeding the problem’s time limit. There are
    many ways to organize the same data and sometimes one way is better than the other
    on different context, as we will see in the discussion below. Familiarity with
    the data structures discussed in this chapter is a must in order to understand
    the algorithms in subsequent chapters.


    As stated in the preface of this book, we assume that you are familiar with the
    basic data structures listed in Section 2.2, and thus we will not review them
    again in this book. We simply highlight the fact that they all have built-in libraries
    in C++ STL and Java API (Note that in this version of the book, we write most
    example codes from C++ perspective). If you feel that you are not sure with any
    of the terms or data structures mentioned in Section 2.2, please reading this
    book, quickly explore and learn that term in the reference books, e.g. [3], and
    resume when you get the basic ideas of those data structures.


    Note that for competitive programming, you just have to be able to use (i.e. know
    the strengths, weaknesses, and time/space complexities) a certain data structure
    to solve the appropriate contest problem. Its theoretical background is good to
    know, but can be skipped.


    This chapter is divided into two parts. Section 2.2 contains basic data structures
    with their basic operations that can be built-in libraries. Section 2.3 contains
    more data structures for which currently we have to build our own libraries. Because
    of this, Section 2.3 has more detailed discussions than Section 2.2.


    [1] Materials in Section 2.2 are usually taught in level-1 ‘data structures and
    algorithms’ course in CS curriculum. High school students who are planning to
    join competitions like IOI are encouraged to do self-study on these material.'
  merge: -1
