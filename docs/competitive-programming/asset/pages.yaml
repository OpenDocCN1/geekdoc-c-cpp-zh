  md: "```\n~~~cpp\n#include <iostream>\n#include <stdlib.h>\n#include <string.h>\n\
    using namespace std;\n\nchar S[1001]; // this naive Suffix Array cannot go beyond\
    \ 1000 characters\nint SA[1001], n;                              // compare suffixes\n\
    int SA_cmp(const void *a, const void *b) { return strcmp(S + *(int*)a, S + *(int*)b);\
    \ }\n\nint main() { // first approach: O(n^2 log n), only for n <= 1000\n  n =\
    \ strlen(gets(S));\n  for (int i = 0; i < n; i++) SA[i] = i; // sort    * comparison\n\
    \  qsort(SA, n, sizeof(int), SA_cmp);     // O(n log n) * O(n) = O(n^2 log n)\n\
    \  for (int i = 0; i < n; i++) printf(\"%d %s\\n\", SA[i], S+SA[i]);\n} // return\
    \ 0;\n~~~\n```\n\nWhen applied to string S = `acacag$`, the simple code that simply\
    \ sort all suffixes with sort library will produce the correct Suffix Array =\
    \ {6, 0, 2, 4, 1, 3, 5} (note that index starts from 0). However, this is barely\
    \ useful except for contest problems with n ≤ 1000.\n\nA better way to build the\
    \ Suffix Array is to sort suffixes O(n log n) in increasing length. We start from\
    \ suffixes with length 1, length 2, length 4, length 8, ..., up to n. As the length\
    \ grows exponentially, we only need O(log n) steps. Thus the overall complexity\
    \ is O(n log^2 n). With this complexity, working with strings of length n ≤ 100K\
    \ - the typical programming contest range - is not a problem. The library code\
    \ is shown below. For explanation, see [29, 24].\n\n```\n~~~cpp\n#include <algorithm>\n\
    #include <iostream>\n#include <stdlib.h>\n#include <string.h>\nusing namespace\
    \ std;\n#define MAXN 200010\nint RA[MAXN], SA[MAXN], LCP[MAXN], *FC, *SC, step;\n\
    char S[MAXN], Q[MAXN];\n\nbool cmp(int a, int b) {\n  if (step==-1 || FC[a]!=FC[b])\
    \ return FC[a] < FC[b];\n  return FC[a+(1<<step)] < FC[b+(1<<step)];\n}\n\nvoid\
    \ suffix_array(char *S, int n) { // O(n log^2(n))\n  for (int i=0; i<n; i++) RA[i]\
    \ = S[SA[i] = i];\n  for (FC=RA, SC=LCP, step=-1; (1<<step)<n; step++) {\n   \
    \ sort(SA, SA+n, cmp);\n    int cnt = 0;\n    for (int i=0; i<n; i++) {\n    \
    \  if (i>0 && cmp(SA[i-1],SA[i])) cnt++;\n      SC[SA[i]] = cnt;\n    }\n    if\
    \ (cnt==n-1) break; // all distinct, no need to continue\n    swap(FC,SC);\n \
    \ }\n  for (int i=0; i<n; i++) RA[SA[i]] = i;\n}\n~~~\n```"
