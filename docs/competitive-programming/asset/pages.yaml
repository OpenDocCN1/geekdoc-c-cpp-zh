    # 6.4  Suffix Tree and Suffix Array


    Suffix Tree and Suffix Array are two efficient and related data structures for
    strings. We do not put this topic in Chapter 2 as these two data structures are
    special for strings.


    # 6.4.1  Suffix Tree: Basic Ideas


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_125_0.png)


    Figure 6.2: Suffix Trie (Left) and Suffix Tree (Right) of S = ’acacag$’ (Figure
    from [24])


    Consider a string² S = ’acacag$’, a Suffix³ Trie of S is a tree that contains
    all possible suffixes of S (see Figure 6.2, left). Two suffixes that share common
    prefix will share the same first few vertices, e.g. ’cag$’ and ’cacag$’ share
    the first two vertices ’ca’ before they split. The leaves contain the indices
    of the suffixes. Suffix Tree of S is Suffix Trie where we merge vertices with
    only one child (see Figure 6.2, right). Notice the ‘edge-label’ and ‘path-label’
    in the figure.


    Exercise: Draw the Suffix Tree of S = ’competitive$’!


    ²Notice that S is usually appended with a special char ‘$’ which is lexicographically
    smaller than all the alphabets used in S.


    ³A suffix of a string is a ‘special case’ substring that goes up to the last character
    of the string.'
