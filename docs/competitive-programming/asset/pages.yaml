  md: "# 3.4  Dynamic Programming\n\nDynamic Programming (from now on abbreviated\
    \ as DP) is perhaps the most challenging problem solving paradigm among the four\
    \ paradigms discussed in this chapter. Therefore, make sure that you have mastered\
    \ the material mentioned in the previous chapters before continuing. Plus, get\
    \ yourself ready to see lots of recursions and recurrence relations!\n\n# 3.4.1\
    \  DP Illustration Using UVa 11450 - Wedding Shopping\n\nAbridged problem statement:\
    \ Given different models for each garment (e.g. 3 shirts, 2 belts, 4 shoes, ...),\
    \ *buy one model of each garment*. As the budget is limited, we cannot spend more\
    \ money than the budget, but we want to spend the *maximum possible*. But it is\
    \ also possible that we cannot buy one model of each garment due to that small\
    \ amount of budget.\n\nThe input consist of two integers 1 ≤ M ≤ 200 and 1 ≤ C\
    \ ≤ 20, where M is the budget and C is the number of garments that you have to\
    \ buy. Then, there are information of the C garments. For garment_id ∈ [0 ...\
    \ C-1], we know an integer 1 ≤ K ≤ 20 which indicates the number of different\
    \ models for that garment_id, followed by K integers indicating the price of each\
    \ model ∈ [1 ... K] of that garment_id.\n\nThe output should consist of one integer\
    \ that indicates the maximum amount of money necessary to buy one element of each\
    \ garment *without exceeding the initial amount of money*. If there is no solution,\
    \ print “no solution”.\n\nFor example, if the input is like this (test case A):\n\
    \n+   M = 20, C = 3\n+   \n+   3 models of garment_id 0 → 6 4 __8__ // see that\
    \ the prices are not sorted in input\n+   \n+   2 models of garment_id 1 → 5 __10__\n\
    +   \n+   4 models of garment_id 2 → __1__ 5 3 5\n\nThen the answer is 19, which\
    \ may come from buying the *underlined* items (8+10+1).\n\nNote that this solution\
    \ is not unique, as we also have (6+10+3) and (4+10+5).\n\nHowever, if the input\
    \ is like this (test case B):\n\n+   M = 9 (*very limited budget*), C = 3\n+ \
    \  \n+   3 models of garment_id 0 → 6 4 8\n+   \n+   2 models of garment_id 1\
    \ → 5 10\n+   \n+   4 models of garment_id 2 → 1 5 3 5\n\nThen the answer is “no\
    \ solution” as buying all the cheapest models (4+5+1) = 10 is still > M.\n\n#\
    \ Approach 1: Complete Search (Time Limit Exceeded)\n\nFirst, let’s see if Complete\
    \ Search (backtracking) can solve this problem: Start with money_left = M and\
    \ garment_id = 0. Try all possible models in that garment_id = 0 (max 20 models).\
    \ If model i is chosen, then subtract money_left with model i’s price, and then\
    \ recursively do the same process to garment_id = 1 (also can go up to 20 models),\
    \ etc. Stop if the model for the last garment_id = C − 1 has been chosen. If money_left\
    \ < 0 before we reach the last garment_id, prune this partial solution. Among\
    \ all valid combinations, pick one that makes money_left as close to 0 as possible\
    \ yet still ≥ 0. This maximizes the money spent, which is (M − money_left)."
