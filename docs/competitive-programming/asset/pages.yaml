  md: '# Min Cost (Max) Flow


    The min cost flow problem is the problem of finding the *cheapest* possible way
    of sending a certain amount of flow (usually the Max Flow) through a flow network.
    In this problem, every edge has two attributes: the flow capacity through this
    edge and the cost to use this edge. Min Cost (Max) Flow, or in short MCMF, can
    be solved by replacing the BFS to find augmenting path in Edmonds Karp’s to Bellman
    Ford’s (Dijkstra’s may not work as the edge weight in the residual flow graph
    can be negative).


