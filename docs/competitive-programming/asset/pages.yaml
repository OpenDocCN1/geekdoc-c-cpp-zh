- pgno: 142
  md: "+   7. UVa 11122 - Tri Tri (triangle and triangle)  \n+   8. UVa 11345 - Rectangles\
    \ (rectangle and rectangle)  \n+   9. UVa 11515 - Cranes (circle and circle, plus\
    \ DP)  \n+   10. UVa 11601 - Avoiding Overlaps (rectangle and rectangle)  \n+\
    \   11. UVa 11639 - Guard the Land (rectangle and rectangle)\n\n# 7.5 Divide and\
    \ Conquer Revisited\n\nSeveral computational geometry problems turn out to be\
    \ solvable with Divide and Conquer paradigm that has been elaborated earlier in\
    \ Section 3.2. One of the example is shown below.\n\n# Bisection Method for Geometry\
    \ Problem\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_142_0.png)\n\nFigure 7.6:\
    \ Athletics Track (from UVa 11646)\n\nSuppose that we have a problem as follows:\
    \ Given a desired soccer field with desired length : width ratio = A : B, two\
    \ arcs from the same circle whose center is located in the middle of the field,\
    \ and the length of the athletics track (the perimeter: 2× length + 2× arc) to\
    \ be 400m, what is the actual length and width of the field? See Figure 7.6.\n\
    \nIt is quite hard to find the solution with pen and paper, but with the help\
    \ of computer and bisection method (binary search), we can find the solution easily.\n\
    \nSuppose we binary search the value of L, then we can get W from b × L / a. The\
    \ expected length of an arc is (400 − 2 × L)/2. Now we can use Trigonometry to\
    \ compute the radius r and the angle θ via triangle CMX (see Figure 7.6). With\
    \ r and θ, we can compute the actual arc length. We then compare this value with\
    \ the expected arc length to decide whether we have to enlarge or reduce the length\
    \ L. The important portion of the code is shown below.\n\n```\nlo = 0.0; hi =\
    \ 400.0; // the range of answer\nwhile (fabs(lo - hi) > 1e-9) { // do bisection\
    \ method on L\n    L = (lo + hi) / 2.0;\n    W = b * L / a; // W can be derived\
    \ by W\n    expected_arc = (400 - 2.0 * L) / 2.0;\n    half_L = 0.5 * L; half_W\
    \ = 0.5 * W;\n    r = sqrt(half_L * half_L + half_W * half_W);\n    angle = 2.0\
    \ * atan(half_W / half_L) * 180.0 / PI;\n    this_arc = angle / 360.0 * PI * (2.0\
    \ * r);\n    if (this_arc > expected_arc) hi = L;\n    else                  \
    \       lo = L;\n}\nprintf(\"Case %d: %.12lf %.12lf\\n\", caseNo++, L, W);\n```"
  merge: -1
  img_proc: true
