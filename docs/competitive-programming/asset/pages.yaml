    +   5. UVa 11176 - Winning Streak

    +   6. UVa 11181 - Probability [Given

    +   7. UVa 11500 - Vampirs


    # ### 5.5.5 Linear Algebra


    A **linear equation** is defined as an equation where the order of the unknowns
    (variables) is **linear** (a constant or a product of a constant plus the first
    power of an unknown), e.g. `X + Y = 2`. **System of linear equations** is defined
    as a collection of $n$ unknowns (variables) in $n$ linear equations, e.g. `X +
    Y = 2` and `2X + 5Y = 6`, where the solution is $X = \frac{1}{3}, Y = \frac{2}{3}$.
    Notice the difference to the **linear diophantine equation** as the solution for
    system of linear equations can be non-integers!


    There are several ways to find the solution for a system of linear equations.
    One of them is ‘Gaussian Elimination’. See [5, 37] for details.


    Programming Exercises related to Linear Algebra:


    +   1. UVa 10089 - Repackaging

    +   2. UVa 10109 - Solving Systems of Linear Equations

    +   3. UVa 10309 - Turn the Lights Off


    # ## 5.6 Chapter Notes


    We admit that there are still a lot of other mathematics problems and algorithms
    beyond this chapter. This last section provides pointers for a few more topics.


    For an even **faster prime testing** function than the one presented here, one
    can use the non deterministic **Miller-Rabin’s** algorithm [41] — which can be
    made deterministic for contest environment with a known maximum input size $N$.'
