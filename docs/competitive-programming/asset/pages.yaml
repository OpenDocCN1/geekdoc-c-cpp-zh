  md: "# # Convention\n\nThere are a lot of C++ codes shown in this book. Many of\
    \ them uses typedefs, shortcuts, or macros that are commonly used by competitive\
    \ programmers to speed up the coding time. In this short section, we list down\
    \ several examples.\n\n```\n```cpp\n#define _CRT_SECURE_NO_DEPRECATE // suppress\
    \ some compilation warning messages (for VC++ users)\n\n// Shortcuts for \"common\"\
    \ data types in contests\ntypedef long long             ll;\ntypedef vector<int>\
    \           vi;\ntypedef pair<int, int>        ii;\ntypedef vector<ii>       \
    \      vii;\ntypedef set<int>               si;\ntypedef map<string, int>    \
    \   msi;\n\n// To simplify repetitions/loops, Note: define your loop style and\
    \ stick with it!\n#define REP(i, a, b) \\\n    for (int i = (a); i <= int(b);\
    \ i++) // a to b, and variable i is local!\n#define TRvi(c, it) \\\n    for (vi::iterator\
    \ it = (c).begin(); it != (c).end(); it++)\n#define TRvii(c, it) \\\n    for (vii::iterator\
    \ it = (c).begin(); it != (c).end(); it++)\n#define TRmsi(c, it) \\\n    for (msi::iterator\
    \ it = (c).begin(); it != (c).end(); it++)\n\n#define INF 2000000000 // 2 billion\n\
    // If you need to reach how to use memset:\n#define MEMSET_INF 127 // about 2B\n\
    #define MEMSET_HALF_INF 63 // about 1B\n//memset(dist, MEMSET_INF, sizeof dist);\
    \ // useful to initialize shortest path distances\n//memset(dp_memo, -1, sizeof\
    \ dp_memo); // useful to initialize DP memoization table\n//memset(arr, 0, sizeof\
    \ arr); // useful to clear array of integers\n```\n```"
