- pgno: 60
  md: "# **Remarks**\n\nThere are other classical DP problems that we choose not to\
    \ cover in this book such as Matrix Chain Multiplication [4], Optimal Binary Search\
    \ Tree [14], 0-1 Knapsack [5, 14]. However, Floyd Warshall's will be discussed\
    \ in Section 4.7; String Edit Distance, Longest Common Subsequence (LCS), plus\
    \ other DP on Strings in Section 6.3.\n\n# ### 3.4.3 Non Classical Examples\n\n\
    Although DP is one problem type that is most frequently appears in recent programming\
    \ contests, the classical DP problems on their *pure forms* above usually never\
    \ appear again in recent ICPCs or IOIs. We have to study them to understand more\
    \ about DP. But once we do, we have to move on to solve many other non classical\
    \ DP problems and build up our ‘DP technique skills’. As you can see below, there\
    \ are many interesting DP techniques from simple to intermediate. Try solving\
    \ these problems at the corresponding online judges to further improve your DP\
    \ skills. We have grouped and ordered the following DP problems from *our* perceived\
    \ level of difficulty (easier to harder). There are DP trick lessons in each example.\
    \ Enjoy :).\n\n# **1. Cutting Sticks (UVa 10003)**\n\nAbridged problem statement:\
    \ Given a stick of length 1 ≤ l ≤ 1000, make 1 ≤ n ≤ 50 cuts to that sticks (coordinates\
    \ within range (0 … l) are given). The cost of cut is determined by the length\
    \ of the stick to be cut. Find a cutting sequence so that the overall cost is\
    \ minimized!\n\nExample: l = 100, n = 3, and cut coordinates: coord = {25,50,75}\
    \ (already sorted)\n\nIf we cut from left to right, then we will incur cost =\
    \ 225\n\n+   1. Cut at coordinate 25, total cost = 100;\n+   2. Cut at coordinate\
    \ 50, total cost = 100 + 75 = 175;\n+   3. Cut at coordinate 75, total cost =\
    \ 175 + 50 = 225;\n\nHowever, the optimal answer is: 200\n\n+   1. Cut at coordinate\
    \ 50, total cost = 100;\n+   2. Cut at coordinate 25, total cost = 100 + 50 =\
    \ 150;\n+   3. Cut at coordinate 75, total cost = 150 + 50 = 200;\n\nSolution:\
    \ Use this Complete Search recurrences + top-down DP (memoization): cut(left,\
    \ right)\n\n+   1. If (left + 1 = right) where left and right are indices in array\
    \ coord, then cut(left, right) = 0 as we are left with 1 segment, there is no\
    \ need to cut anymore.\n+   2. Otherwise, try all possible cutting points and\
    \ pick the minimum cost using code below:\n\n```\n```cpp\n// cost = initially\
    \ infinity (a very large integer)\nfor (int i = left + 1; i < right; i++) // max\
    \ 50 steps\n    cost = min(cost, cut(left, i) + cut(i, right) + (coord[right]\
    \ - coord[left]));\n// after the loop above is done, we know that cut(left, right)\
    \ = cost\n```\n```\n\nLesson: The Complete Search recurrences above only has 50×50\
    \ possible left/right indices configuration (states) and runs in just 50 × 50\
    \ × 50 = 125K operations! It is easy to convert this Complete Search / recursive\
    \ backtracking recurrence into a top-down DP a.k.a memoization technique!"
