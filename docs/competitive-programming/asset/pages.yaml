  md: "+   6. UVa 10002 - Center of Masses (centroid of convex polygon, convex hull)\n\
    +   7. UVa 10065 - Useless Tile Packers (plus area of polygon)\n+   8. UVa 10135\
    \ - Herding Frosh\n+   9. UVa 10173 - Smallest Bounding Rectangle\n+   10. UVa\
    \ 11626 - Convex Hull\n\n# 7.4  Intersection Problems\n\nIn geometry problems,\
    \ we can virtually take any pair of objects and see if they intersect, and if\
    \ they are: what is the point/area/volume of intersection? This is the source\
    \ of many computational geometry problems in contests.\n\nLine segment intersection\
    \ is one the most frequent intersection problems. We can test whether two line\
    \ segments intersect or not by using several ccw tests (code is shown below).\n\
    \n```\nstruct line { point p1, p2; }\n\nint intersect(line line1, line line2)\
    \ {\n    return\n        ((ccw(line1.p1, line1.p2, line2.p1) * ccw(line1.p1, line1.p2,\
    \ line2.p2)) <= 0)\n        &&\n        ((ccw(line2.p1, line2.p2, line1.p1) *\
    \ ccw(line2.p1, line2.p2, line1.p2)) <= 0);\n}\n```\n\nHowever, intersections\
    \ can occur between different types of objects other than two line segments. The\
    \ other objects include: Cube, Box, Circle, Polygon, Triangle, Rectangle, etc.\
    \ Some examples are shown below.\n\nProgramming Exercises solvable related to\
    \ intersection problem:\n\n+   - Line Segment Intersection\n+     1. UVa 191 -\
    \ Intersection\n+     2. UVa 378 - Intersecting Lines\n+     3. UVa 866 - Intersecting\
    \ line segments\n+     4. UVa 920 - Sunny Mountain\n+     5. UVa 972 - Horizon\
    \ Line\n+     6. UVa 10902 - Pick-up sticks\n+     7. UVa 11343 - Isolated Segments\n\
    +   \n+   - Other Objects\n+     1. UVa 453 - Intersecting Circles (circle and\
    \ circle)\n+     2. UVa 460 - Overlapping Rectangles (rectangle and rectangle)\n\
    +     3. UVa 737 - Gleaming the Cubes (cube and cube)\n+     4. UVa 904 - Overlapping\
    \ Air Traffic Control (3D-box and 3D-box)\n+     5. UVa 10301 - Rings and Glue\
    \ (circle and circle)\n+     6. UVa 10321 - Polygon Intersection (convex polygon\
    \ and convex polygon)"
