  md: "```\n```cpp\n// for each edge with (i, j, weight) format\n//   EdgeList.push(make_pair(-weight,\
    \ make_pair(i, j)));\n// alternative implementation: use STL vector and algorithm:sort\n\
    \nmst_cost = 0; initSet(V); // all V are disjoint sets initially, see Section\
    \ 2.3.2\nwhile (!EdgeList.empty()) { // while there exist more edges, O(E)\n \
    \   pair<int, ii> front = EdgeList.top(); EdgeList.pop();\n    if (!sameSet(front.second.first,\
    \ front.second.second)) { // if no cycle\n        mst_cost += (-front.first);\
    \ // add (negated) -weight of e to MST\n        unionSet(front.second.first, front.second.second);\
    \ // link these two vertices\n    }\n}\n// note that the number of disjoint sets\
    \ must eventually be one!\n// otherwise, no MST has been formed...\n```\n```\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_82_0.png)\n\nFigure 4.9: Kruskal’s\
