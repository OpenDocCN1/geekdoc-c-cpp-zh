  md: "# ## 2.2  Data Structures with Built-in Libraries\n\n# ### 2.2.1  Linear Data\
    \ Structures\n\nA data structure is classified as *linear* if its elements form\
    \ a sequence. Mastery of all these basic linear data structures below is a must\
    \ to do well in today’s programming contests.\n\n+   - Static Array in C/C++ and\
    \ in Java\n+     This is clearly the most commonly used data structure in programming\
    \ contests whenever there is a collection of sequential data to be stored and\
    \ later accessed using their indices. As the maximum input size is normally mentioned\
    \ in a programming problem, then usually the declared array size is this value\
    \ + small extra buffer. Typical dimensions of the array are: 1-D, 2-D, 3-D, and\
    \ rarely goes beyond 4-D. Typical operations for array are: accessing certain\
    \ indices, sorting the array, linearly scanning, or binary searching the array.\n\
    +   \n+   - Resizable Array a.k.a. Vector: C++ STL `<vector>` (Java ArrayList)\n\
    +     All else the same as static array but has auto-resize feature. Using vector\
    \ over array is better if array size is unknown beforehand, i.e. before running\
    \ the program. Usually, we initialize the size with some guess value for better\
    \ performance. Typical operations are: `push_back()`, `at()`, `[]` operator, `erase()`,\
    \ and typically use iterator to scan the content of the vector.\n\n# **Efficient\
    \ Sorting and Searching in Static/Resize-able Array**\n\nThere are two central\
    \ operations commonly performed on array: sorting and searching.\n\nThere are\
    \ *many* sorting algorithms mentioned in CS textbooks, which we classify as:\n\
    \n+   1. $O(n^2)$ comparison-based sorting algorithms [4]: Bubble/Selection/Insertion\
    \ Sort.\n+      These algorithms are slow and usually avoided, but understanding\
    \ them is important.\n+   2. $O(n\\log n)$ comparison-based sorting algorithms\
    \ [4]: Merge/Heap/Random Quick Sort.\n+      We can use C++ STL `sort`, `partial_sort`,\
    \ `stable_sort`, in `<algorithm>` to achieve this purpose (Java `Collections.sort`).\
    \ We only need to specify the required comparison function and these library routines\
    \ will handle the rest.\n+   3. Special purpose sorting algorithms [4]: $O(n)$\
    \ Counting Sort, Radix Sort, Bucket Sort.\n+      These special purpose algorithms\
    \ are good to know, as they can speed up the sorting time if the problem has special\
    \ characteristics, like small range of integers for Counting Sort, but they rarely\
    \ appear in programming contests.\n\nThen, there are basically three ways to search\
    \ for an item in Array, which we classify as:\n\n+   1. $O(n)$ Linear Search from\
    \ index 0 to index $n-1$ (avoid this in programming contests).\n+   2. $O(\\log\
    \ n)$ Binary Search: use `lower_bound` in C++ STL `<algorithm>` (or Java `Collections.binarySearch`).\
    \ If the input is unsorted, it is fruitful to sort it just once using an $O(n\\\
    log n)$ sorting algorithm above in order to use Binary Search many times.\n+ \
    \  3. $O(1)$ with Hashing (but we can live without hashing for most contest problems).\n\
    \n+   - Linked List: C++ STL `<list>` (Java LinkedList)\n+     Although this data\
    \ structure almost always appears in data structure & algorithm textbooks, Linked\
    \ List is usually avoided in typical contest problems. Reasons: it involves pointers\
    \ and theoretically slow for accessing data as it has to be performed from the\
    \ head or tail of a list."
