- pgno: 28
  md: "![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_28_0.png)\n\nFigure 2.1: Examples\
    \ of BST (Left) and Heap (Right)\n\nHeap is useful to model Priority Queue, where\
    \ item with highest priority can be deleted in O(log n) and new item can be inserted\
    \ into priority queue also in O(log n). The implementation of `priority_queue`\
    \ is available in C++ STL `<queue>`. Priority Queue is an important component\
    \ in algorithms like Kruskal's for Minimum Spanning Tree (MST) problem (Section\
    \ 4.4) and Dijkstra's for Single-Source Shortest Paths (SSSP) problem (Section\
    \ 4.5).\n\nThis data structure is also used to perform `partial_sort` in C++ STL\
    \ `<algorithm>`. This is done by taking the max element k times (k is the number\
    \ of the top most items to be sorted). As each delete-max is in O(log n), `partial_sort`\
    \ has O(k log n) time complexity.\n\n+   - Hash Table: no native C++ STL support\
    \ (Java HashMap/HashSet/HashTable)\n+   \n+     Hash Table is another form of\
    \ non-linear data structures, but we do not recommend using it in contests unless\
    \ necessary. Reasons: designing a good performing hash function is quite tricky\
    \ and there is no native C++ STL support for it. Moreover C++ STL `<map>` or `<set>`\
    \ are usually good enough as the typical input size of programming contest problems\
    \ is ≤ 1M, making O(1) for Hash Table and O(log 1M) for balanced BST actually\
    \ do not differ by much.\n+   \n+     However, a form of Hash Table is actually\
    \ used in contests, namely 'Direct Addressing Table' (DAT), where the key itself\
    \ determines the index, bypassing the need of 'hash function'. For example, UVa\
    \ 11340 - Newspaper, where all possible ASCII characters [0-255] are assigned\
    \ to certain monetary values, e.g. 'a' → '3', 'W' → '10', ..., 'I' → '13'.\n\n\
    Programming exercises to practice using basic data structures and algorithms (with\
    \ libraries):\n\n+   - Static array, C++ STL `<vector>`, `<bitset>`, Direct Addressing\
