- pgno: 111
  md: "Using `extendedEuclid`, the Linear Diophantine Equation with two variables\
    \ can be easily solved.\n\nFor our motivating problem above: $25x + 18y = 839$,\
    \ we have:\n\n$a = 25, b = 18, \\text{extendedEuclid}(25, 18) = ((-5, 7), 1)$,\
    \ or\n\n$25 \\times (-5) + 18 \\times 7 = 1$.\n\nMultiplying the left and right\
    \ hand side of the equation above by $839/\\gcd(25, 18) = 839$, we have:\n\n$25\
    \ \\times (-4195) + 18 \\times 5873 = 839$. Thus,\n\n$x = -4195 + (18/1)n,\\ y\
    \ = 5873 - (25/1)n$.\n\nSince we need to have non-negative $x$ and $y$, we have:\n\
    \n$-4195 + 18n \\geq 0$ and $5873 - 25n \\geq 0$, or\n\n$4195/18 \\leq n \\leq\
    \ 5873/25$, or\n\n$233.05 \\leq n \\leq 234.92$.\n\nThe only possible integer\
    \ for $n$ is 234.\n\nThus $x = -4195 + 18 \\times 234 = 17$ and $y = 5873 - 25\
    \ \\times 234 = 23$,\n\ni.e. 17 apples (of 25 cents each) and 23 oranges (of 18\
    \ cents each) of a total of 8.39 SGD.\n\n+   Programming Exercises related to\
    \ Extended Euclid algorithm:\n+   \n+   1. UVa 718 - Skycraper Floors\n+   2.\
    \ UVa 10090 - Marbles (use solution for Linear Diophantine Equation)\n+   3. UVa\
    \ 10104 - Euclid Problem (pure problem involving Extended Euclid)\n\n# 5.3.5 \
    \ Modulo Arithmetic\n\nSome mathematics computations in programming problems can\
    \ end up having very large positive (or very small negative) results that reside\
    \ the range of largest integer data type (currently the 64-bit `long long` in\
    \ C++). Sometimes, we are only interested with the result modulo a number.\n\n\
    For example in UVa 10176 - Ocean Deep! Make it shallow!!, we are asked to convert\
    \ a long binary number (up to 100 digits) to decimal. A quick calculation shows\
    \ that the largest possible number is $2^{100} - 1$ which is beyond the reach\
    \ of 64-bit integers. However, the problem only ask if the result is divisible\
    \ by 131071. So what we need to do is to convert binary to decimal digit by digit,\
    \ and then quickly perform modulo operation to the intermediate result by 131071.\
    \ If the final result is 0, then the actual number in binary (which we never compute),\
    \ is divisible by 131071.\n\n+   Programming Exercises related to Modulo Arithmetic:\n\
    +   \n+   1. UVa 374 - Big Mod\n+   2. UVa 602 - What Day Is It?\n+   3. UVa 10174\
    \ - Couple-Bachelor-Spinster Numbers\n+   4. UVa 10176 - Ocean Deep! Make it shallow!!\
    \ (as discussed above)\n+   5. UVa 10212 - The Last Non-zero Digit\n+   6. UVa\
    \ 10489 - Boxes of Chocolates\n+   7. LA 4104 - MODEX"
