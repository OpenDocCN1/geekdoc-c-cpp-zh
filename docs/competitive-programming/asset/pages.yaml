- pgno: 139
  md: "# 7.3 Graham’s Scan\n\nThe **Convex Hull** of a set of points $P$ is the smallest\
    \ convex polygon $CH(P)$ for which each point in $P$ is either on the boundary\
    \ of $CH(P)$ or in its interior (see Figure 7.5.D). Every vertex in $CH(P)$ is\
    \ a vertex in original $P$. Thus, the algorithm of finding convex hull must decide\
    \ which vertices in $P$ to be chosen as part of the convex hull.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_139_0.png)\n\
    \nFigure 7.5: Convex Hull $CH(P)$ of Set of Points $P$\n\nThere are several convex\
    \ hull algorithms available. In this section, we choose the $O(n \\log n)$ Ronald\
    \ Graham’s Scan algorithm. This algorithm first sorts all $n$ points of $P$ (Figure\
    \ 7.5.A) based on its angle w.r.t a point called pivot. In our example, we pick\
    \ bottommost and rightmost point in $P$ as pivot (see point 0 and the counter-clockwise\
    \ order of the remaining points in Figure 7.5.B).\n\nThen, this algorithm maintains\
    \ a stack $S$ of candidate points. Each point of $P$ is pushed once on to $S$\
    \ and points that are not going to be part of $CH(P)$ will be eventually popped\
    \ from $S$. Examine Figure 7.5.C. The stack previously contains (bottom) 11-0-1-2\
    \ (top), but when we try to insert 3, 1-2-3 is a right turn, so we pop 2. Now\
    \ 0-1-3 is a left turn, so we insert 3 to the stack, which now contains (bottom)\
    \ 11-0-1-3 (top).\n\nWhen Graham’s Scan terminates, whatever left in $S$ are the\
    \ points of $CH(P)$ (see Figure 7.5.D), the stack contains (bottom) 11-0-1-4-7-10-11\
    \ (top)). Graham Scan’s eliminates all the right turns! Check that the sequence\
    \ of vertices in $CH(P)$ always makes left turns – a convex polygon.\n\nThe implementation\
    \ of Graham’s Scan, omitting parts that have shown earlier like ccw function,\
    \ is shown below.\n\n```\npoint pivot; // global variable\nvector<point> polygon,\
    \ CH;\n\nint area2(point a, point b, point c) {\n    return a.x * b.y - a.y *\
    \ b.x + b.x * c.y - b.y * c.x + c.x * a.y - c.y * a.x;\n}\n\nint dist2(point a,\
    \ point b) { // function to compute distance between 2 points\n    int dx = a.x\
    \ - b.x, dy = a.y - b.y; return dx * dx + dy * dy;\n}\n\nbool angle_cmp(point\
    \ a, point b) { // important angle-sorting function\n    if (area2(pivot, a, b)\
    \ == 0) // collinear\n        return dist2(pivot, a) < dist2(pivot, b); // which\
    \ one closer\n\n    int d1x = a.x - pivot.x, d1y = a.y - pivot.y;\n    int d2x\
    \ = b.x - pivot.x, d2y = b.y - pivot.y;\n    return (atan2((double)d1y, (double)d1x)\
    \ - atan2((double)d2y, (double)d2x)) < 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 140
  md: "```\n```cpp\nvector<point> GrahamScan(vector<point> Polygon) {\n  // first,\
    \ find P0 = point with lowest Y and if tie: rightmost X\n  int i, P0 = 0, N =\
    \ Polygon.size();\n  for (i = 1; i < N; i++)\n    if (Polygon[i].y  < Polygon[P0].y\
    \ ||\n        (Polygon[i].y == Polygon[P0].y && Polygon[i].x > Polygon[P0].x))\n\
    \      P0 = i;\n\n  point temp = Polygon[0]; // swap selected vertex with Polygon[0]\n\
    \  Polygon[0] = Polygon[P0];\n  Polygon[P0] = temp;\n\n  // second, sort points\
    \ by angle w.r.t. P0, skipping Polygon [0]\n  pivot = Polygon[0]; // use this\
    \ global variable as reference\n  sort(++Polygon.begin(), Polygon.end(), angle_cmp);\n\
    \n  // third, the ccw tests\n  stack<point> S;\n  point prev, now;\n  S.push(Polygon[N\
    \ - 1]); // put two starting vertices into stack S\n  S.push(Polygon[0]);\n\n\
    \  i = 1; // and start checking the rest\n  while (i < N) { // note: N must be\
    \ >= 3 for this method to work\n    now = S.top();\n    S.pop(); prev = S.top();\
    \ S.push(now); // trick to get the 2nd item from top of S\n    if (ccw(prev, now,\
    \ Polygon[i])) { // if these 3 points make a left turn\n      S.push(Polygon[i]);\
    \ // accept\n      i++;\n    }\n    else // otherwise\n      S.pop(); // pop this\
    \ point until we have a left turn\n  }\n\n  vector<point> ConvexHull;\n  while\
    \ (!S.empty()) { // from stack back to vector\n    ConvexHull.push_back(S.top());\n\
    \    S.pop();\n  }\n  ConvexHull.pop_back(); // the last one is a duplicate of\
    \ first one\n\n  return ConvexHull; // return the result\n}\n```\n```\n\nProgramming\
    \ Exercises related to Convex Hull:\n\n+   1. UVa 109 - Scud Busters\n+   2. UVa\
    \ 218 - Moth Eradication\n+   3. UVa 361 - Cops and Robbers\n+   4. UVa 681 -\
    \ Convex Hull Finding (pure convex hull problem for starting point)\n+   5. UVa\
    \ 811 - The Fortified Forest (Complete Search with convex hull)"
