    \ Form and Application\n\nMotivating problem: Imagine a connected, weighted, and\
    \ directed graph as a pipe network where the pipes are the edges and the splitting\
    \ points are the vertices. Each pipe has a capacity equals to the weight of the\
    \ edge. There are also two special vertices: source s and sink t. What is the\
    \ maximum flow from source s to sink t in this graph? (imagine water flowing in\
    \ the pipe network, we want to know the maximum volume of water that can be passed\
    \ by this pipe network?) This problem is called the Max Flow problem. An illustration\
    \ of this problem is shown in Figure 4.21.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_92_0.png)\n\
    \nFigure 4.21: Illustration of Max Flow (From UVa 820 [17] - ICPC World Finals\
    \ 2000 Problem E)\n\nOne solution is the Ford Fulkerson’s method – invented by\
    \ the same Lester Randolph Ford. Jr who created Bellman Ford’s algorithm and Delbert\
    \ Ray Fulkerson. The pseudo code is like this:\n\n```\nmax_flow = 0\nwhile (there\
    \ exists an augmenting path p from s to t) { // iterative algorithm\n    augment\
    \ flow f along p, i.e.\n        f = min edge weight in the path p\n        max_flow\
    \ += f // we can send flow f from s to t\n        forward edges -= f // reduce\
    \ capacity of those edges\n        backward edges += f // increase capacity of\
    \ reverse edges\n}\noutput max_flow\n```"
