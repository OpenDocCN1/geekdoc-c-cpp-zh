  md: 'In this section, we want to highlight another problem solving trick called:
    *Decomposition!*


    While there are only *few* basic algorithms used in contest problems (most of
    them are covered in this book), harder problems may require a *combination* of
    two (or more) algorithms for their solution. For such problems, try to decompose
    parts of the problems so that you can solve the different parts independently.
    We illustrate this decomposition technique using a recent top-level programming
    problems that combines *three* problem solving paradigms that we have just learned:
    Complete Search, Divide & Conquer, and Greedy!


    # **ACM ICPC World Final 2009 - Problem A - A Careful Approach**


    You are given a scenario of airplane landings. There are 2 ≤ n ≤ 8 airplanes in
    the scenario. Each airplane has a time window during which it can safely land.
    This time window is specified by two integers a_i, b_i, which give the beginning
    and end of a closed interval [a_i, b_i] during which the i-th plane can land safely.
    The numbers a_i and b_i are specified in minutes and satisfy 0 ≤ a_i ≤ b_i ≤ 1440.
    In this problem, plane landing time is negligible. Then, your task is to:


    +   1. Compute an **order** for landing all airplanes that respects these time
    windows.

    +   HINT: order = permutation = Complete Search?

    +   2. Furthermore, the airplane landings should be stretched out **as much as
    possible** so that the minimum achievable time gap between successive landings
    is as large as possible. For example, if three airplanes land at 10:00am, 10:05am,
    and 10:15am, then the smallest gap is five minutes, which occurs between the first
    two airplanes. Not all gaps have to be the same, but the smallest gap should be
    as large as possible!

    +   HINT: Is this similar to ‘greedy activity selection’ problem [4]?

    +   3. Print the answer split into minutes and seconds, rounded to the closest
    second.

    +   See Figure 3.7 for illustration: line = the time window of a plane; star =
    its landing schedule.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_49_0.png)


    Solution:


    Since the number of planes is at most 8, an optimal solution can be found by simply
    trying all 8! = 40320 possible orders for the planes to land. This is the **Complete
    Search** portion of the problem which can be easily solved using C++ STL `next_permutation`.


    Now, for each specific landing order, we want to know the largest possible landing
    window. Suppose we use a certain window length L. We can greedily check whether
    this L is feasible by forcing the first plane to land as soon as possible and
    the subsequent planes to land in `max(a[that plane], previous landing time + L)`.
    This is a **Greedy Algorithm**.


    A window length L that is too long/short will overshoot/undershoot `b[last plane]`,
    so we have to decrease/increase L. We can binary search the answer L - **Divide
    & Conquer**. As we only want the answer rounded to nearest integer, stopping binary
    search when error ε ≤ 1e-3 is enough. For more details, please study our AC source
    code shown on the next page.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "```\n```cpp\n/* World Final 2009, A - A Careful Approach, LA 4445 (Accepted)\
    \ */\n#include <algorithm>\n#include <cmath>\n#include <stdio.h>\nusing namespace\
    \ std;\n\nint i, n, caseNo = 1, order[8];\ndouble a[8], b[8], timeGap, maxTimeGap;\
    \ // timeGap is the variable L mentioned in text\n\ndouble greedyLanding() { //\
    \ with certain landing order, and certain timeGap,\n                         //\
    \ try landing those planes and see what is the gap to b[order[n - 1]]\n  double\
    \ lastLanding = a[order[0]]; // greedy, first aircraft lands immediately\n  for\
    \ (i = 1; i < n; i++) { // for the other aircrafts\n    double targetLandingTime\
    \ = lastLanding + timeGap;\n    if (targetLandingTime <= b[order[i]])\n      //\
    \ this aircraft can land, greedily choose max of a[order[i]] or targetLandingTime\n\
    \      lastLanding = max(a[order[i]], targetLandingTime);\n    else\n      return\
    \ 1; // returning positive value will force binary search to reduce timeGap\n\
    \  }\n  // returning negative value will force binary search to increase timeGap\n\
    \  return lastLanding - b[order[n - 1]];\n}\n\nint main() {\n  while (scanf(\"\
