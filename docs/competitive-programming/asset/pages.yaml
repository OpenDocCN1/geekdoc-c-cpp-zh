- pgno: 27
  md: "+   - **Stack:** C++ STL `<stack>` (Java Stack)  \n+     This data structure\
    \ is used as part of algorithm to solve a certain problem (e.g. Postfix calculation,\
    \ Graham’s scan in Section 7.3). Stack only allows insertion (push) and deletion\
    \ (pop) from the top only. This behavior is called Last In First Out (LIFO) as\
    \ with normal stack in the real world. Typical operations are `push()`/`pop()`\
    \ (insert/remove from top of stack), `top()` (obtain content from the top of stack),\
    \ `empty()`.\n\n+   - **Queue:** C++ STL `<queue>` (Java Queue)  \n+     This\
    \ data structure is used in algorithms like Breadth First Search (BFS) (Section\
    \ 4.3). A queue only allows insertion (enqueue) from the back (rear), and only\
    \ allows deletion (dequeue) from the head (front). This behavior is called First\
    \ In First Out (FIFO), similar to normal queue in the real world. Typical operations\
    \ are `push()`/`pop()` (insert from back/take out from front of queue), `front()`/`back()`\
    \ (obtain content from the front/back of queue), `empty()`.\n\n# ### 2.2.2   Non-Linear\
    \ Data Structures\n\nFor some computational problems, there are better ways to\
    \ organize data other than ordering it sequentially. With efficient implementation\
    \ of non-linear data structures shown below, you can search items much faster,\
    \ which can speed up the algorithms that use them.\n\nFor example, if you want\
    \ to store a dynamic collection of pairs (e.g. name → index pairs), then using\
    \ C++ STL `<map>` below can give you **O(log n)** performance for insertion/search/deletion\
    \ with just few lines of codes whereas storing the same information inside one\
    \ static array of `struct` may requires **O(n)** insertion/search/deletion and\
    \ you have to code it by yourself.\n\n+   - **Balanced Binary Search Tree (BST):**\
    \ C++ STL `<map>`/`<set>` (Java TreeMap/TreeSet)  \n+     BST is a way to organize\
    \ data as a tree-structure. In each subtree rooted at x, this BST property holds:\
    \ items on the left subtree of x are smaller than x and items on the right subtree\
    \ of x are greater (or equal) than x. Organizing the data like this (see Figure\
    \ 2.1, left) allows **O(log n)** insertion, search, and deletion as only **O(log\
    \ n)** worst case root-to-leaf scan is needed to perform those actions (details\
    \ in [4]) – but this only works if the BST is balanced.  \n+     Implementing\
    \ a *bug-free* balanced BST like AVL² Tree or Red-Black (RB) Tree is tedious and\
    \ hard to do under time constrained contest environment. Fortunately, C++ STL\
    \ has `<map>` and `<set>` which are usually the implementation of RB Trees, thus\
    \ all operations are in **O(log n)**. Mastery of these two STL templates can save\
    \ a lot of precious coding time during contests! The difference is simple: `<map>`\
    \ stores (key → data) pair whereas `<set>` only stores the key.\n\n+   - **Heap:**\
    \ C++ STL `<queue>`: `priority_queue` (Java PriorityQueue)  \n+     Heap is another\
    \ way to organize data as a tree-structure. Heap is also a binary tree like BST\
    \ but it must be *complete*. Instead of enforcing BST property, Heap enforces\
    \ Heap property: In each subtree rooted at x, items on the left and the right\
    \ subtrees of x are smaller than x (see Figure 2.1, right). This priority guarantee\
    \ that the top of the heap is the maximum element. There is usually no notion\
    \ of ‘search’ in Heap, but only insertion and deletion, which can be easily done\
    \ by traversing a **O(log n)** leaf-to-root or root-to-leaf path [4].\n\n² However,\
    \ for some tricky contest problems where you have to ‘augment your data structure’\
    \ (see Chapter 14 of [4]), AVL Tree knowledge is needed as C++ STL `<map>` or\
    \ `<set>` cannot be augmented easily."
  merge: -1
