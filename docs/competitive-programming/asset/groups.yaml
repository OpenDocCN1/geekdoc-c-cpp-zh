    \n### 6.3 String Processing with Dynamic Programming\n\nIn this section, we discuss\
    \ some string processing problems that are solvable with DP techniques discussed\
    \ in Section 3.4.\n\n#### 6.3.1 String Alignment (Edit Distance)\n\nThe String\
    \ Alignment (or Edit Distance) problem is defined as follows: Given two strings\
    \ A and B, align¹ A with B with the maximum alignment score (or minimum number\
    \ of edit operations):\n\nAfter aligning A with B, there are few possibilities\
    \ between character A[i] and B[i] ∀ index i:\n\n- 1. Character A[i] and B[i] **match**\
    \ (assume we give ‘+2’ score),\n- 2. Character A[i] and B[i] **mismatch** and\
    \ we replace A[i] with B[i] (‘-1’ score),\n- 3. We insert a space in A[i] (also\
    \ ‘-1’ score), or\n- 4. We delete a letter from A[i] (also ‘-1’ score).\n\nFor\
    \ example:\n\n```\nA = 'information'    -> '_ _ _ _information_'\nB = 'bioinformatics'\
    \ -> 'bioinformatic_s'\n        ----22222222---- -> String Alignment Score = 9\
    \ x 2 - 6 = 12\n```\n\nA brute force solution that tries all possible alignments\
    \ will typically end up with a TLE verdict for long strings A and/or B. The solution\
    \ for this problem is a well-known DP solution (Needleman-Wunsch’s algorithm [24]).\
    \ Consider two strings A[1 ... n] and B[1 ... m]. We define V(i,j) to be the score\
    \ of the optimal alignment between A[1 ... i] and B[1 ... j] and score(A,B) is\
    \ the score if character A is aligned with character B.\n\nBase case:\n\n```\n\
    V(0,0) = 0 // no score for matching two empty strings\n```\n\nRecurrences: For\
    \ i > 0 and j > 0:\n\n```\nV(0,j) = V(0,j-1) + score(_, B[j]) // insert space\
    \ j times to make alignment\nV(i,0) = V(i-1,0) + score(A[i], _) // delete i times\
    \ to make alignment\nV(i,j) = max(option1, option2, option3), where\noption1 =\
    \ V(i-1,j-1) + score(A[i], B[j]) // score of match or mismatch\noption2 = V(i-1,j)\
    \ + score(A[i], _) // delete\noption3 = V(i,j-1) + score(_, B[j]) // insert\n\
    ```\n\nIn short, the DP algorithm concentrates on the three possibilities for\
    \ the last pair of characters, which must be either a match/mismatch, a deletion,\
    \ or an insertion. Although we do not know which one is the best, we can try all\
    \ possibilities while avoiding re-computation of overlapping subproblems (i.e.\
    \ basically a DP technique).\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_123_0.png)\n\
