  - "[PAGE 105]\n\nThe appearance of mathematics problems in programming contests\
    \ is not surprising since Computer Science is deeply rooted in Mathematics. The\
    \ term ‘computer’ itself comes from the word ‘compute’ as computer is built primarily\
    \ to help human compute numbers.\n\nWe are aware that different countries have\
    \ different emphasis in mathematics training in pre-University education. Thus,\
    \ for some newbie ICPC contestants, the term ‘Euler Phi’ is a familiar term, but\
    \ for others, the term does not ring any bell. Perhaps because he has not learnt\
    \ it before, or perhaps the term is different in his native language. In this\
    \ chapter, we want to make a more level-playing field for the readers by listing\
    \ common mathematical terminologies, definitions, problems, and algorithms that\
    \ frequently appear in programming contests.\n\n# ## 5.2 Ad Hoc Mathematics Problems\n\
    \nWe start this chapter by mentioning Ad Hoc mathematics problems. They are basically\
    \ contest problems involving mathematics that requires no more than basic programming\
    \ skills.\n\n+   Programming Exercises related to Ad Hoc Mathematics:\n+   \n\
    +   1. UVa 344 - Roman Numerals (conversion from roman numerals to decimal and\
    \ vice versa)\n+   2. UVa 377 - Cowculations (base 4 operations)\n+   3. UVa 10346\
    \ - Peter’s Smoke (simple math)\n+   4. UVa 10940 - Throwing Cards Away II (find\
    \ pattern using brute force, then use the pattern)\n+   5. UVa 11130 - Billiard\
    \ bounces (use billiard table reflection technique)\n+   6. UVa 11231 - Black\
