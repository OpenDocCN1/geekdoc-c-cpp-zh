    ### 6.4.3 后缀数组：基本思想


    在竞赛环境中构建高效的后缀树有些复杂且有风险。幸运的是，我们将要描述的另一种数据结构——由 Udi Manber 和 Gene Myers 发明的后缀**数组**——具有与后缀树相似的功能，但更易于实现，尤其是在编程竞赛环境中。因此，我们将跳过关于构建后缀树的讨论，转而关注后缀数组。


    基本上，后缀数组是一个整数数组，包含已排序后缀的索引。例如，考虑同一个 S = ''acacag$''，其中 *n* = 7。S 的后缀数组是 *n* 的一个整数排列，如图
    6.4 所示。注意，我们将终止符号 $ 视为字典序最小的字符。


    | 后缀 | 位置 |

    |---|---|

    | acacag$ | 1 |

    | cacag$ | 2 |

    | acag$ | 3 |

    | cag$ | 4 |

    | ag$ | 5 |

    | g$ | 6 |

    | $ | 7 |


    ⇒ 排序


    | SA[i] | 后缀 |

    |---|---|

    | 7 | $ |

    | 1 | acacag$ |

    | 3 | acag$ |

    | 5 | ag$ |

    | 2 | cacag$ |

    | 4 | cag$ |

    | 6 | g$ |


    图 6.4：S = ''acacag$'' 的后缀数组（图来自 [24]）


    后缀树和后缀数组密切相关。如图 6.5 所示，后缀树的叶子（从左到右）按后缀数组顺序排列。简而言之，后缀树中的一个**顶点**对应后缀数组中的一个**区间**！


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_127_1.png)


    对于竞赛题目中的许多实际字符串操作，后缀数组已经足够好用。在本节中，我们介绍两种在给定字符串 S[0 . . . n-1] 时构建后缀数组的简单方法。


