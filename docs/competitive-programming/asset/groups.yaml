    \ all prime factors of $N$. For example $N = 36 = 2^2 \\times 3^2$. $\\varphi(36)\
    \ = 36 \\times (1 - \\frac{1}{2}) \\times (1 - \\frac{1}{3}) = 12$.\n\nIn fact,\
    \ there are only 12 integers less than or equal to 36 that are relatively prime\
    \ to 36. They are 1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31, and 35. As we need\
    \ to factor $N$, the complexity of this algorithm is similar to the complexity\
    \ of factoring an integer with trial division mentioned earlier. The code is below.\n\
    \n```cpp\nint EulerPhi(int N) {\n  vi factors = primeFactors(N);\n  vi::iterator\
    \ new_end = unique(factors.begin(), factors.end()); // get unique\n  int result\
    \ = N;\n  for (vi::iterator i = factors.begin(); i != new_end; i++)\n    result\
    \ = result / *i;\n  return result;\n}\n```\n\nProgramming Exercises related to\
    \ Euler’s Totient (Phi) Function:\n\n- 1. UVa 10179 - Irreducible Basic Fractions\
    \ (direct application of Euler’s Phi function)\n- 2. UVa 10299 - Relatives (another\
    \ direct application of Euler’s Phi function)\n- 3. UVa 10820 - Send A Table (a[i]\
    \ = a[i - 1] + 2 × φ(i))\n- 4. UVa 11064 - Number Theory\n- 5. UVa 11327 - Enumerating\
    \ Rational Numbers\n\n### 5.3.4 Extended Euclid: Solving Linear Diophantine Equation\n\
    \nMotivating problem: Suppose a housewife buys apples and oranges at a total cost\
    \ of 8.39 SGD. If an apple is 25 cents and an orange is 18 cents, how many of\
    \ each type of fruit does she buy?\n\nThis problem can be modeled as a linear\
    \ equation with two variables: $25x + 18y = 839$. Since we know that both $x$\
    \ and $y$ must be integers, this linear equation is called the Linear *Diophantine*\
    \ Equation. We can solve Linear Diophantine Equation with two variables even if\
    \ we only have one equation! This is different from System of Linear Equations\
    \ discussed later in Section 5.5.5. The solution for the Linear Diophantine Equation\
    \ is as follows [20].\n\nLet $a$ and $b$ be integers with $d = gcd(a, b)$. The\
    \ equation $ax + by = c$ has no integral solutions if $d \\mid c$ is not true.\
    \ But if $d \\mid c$, then there are infinitely many integral solutions. The first\
    \ solution $(x_0, y_0)$ can be found using the *Extended Euclid* algorithm shown\
    \ below (also see [4, Chapter 31]), and the rest can be derived from $x = x_0\
    \ + (b/d)n$, $y = y_0 - (a/d)n$, where $n$ is an integer.\n\n```cpp\n// store\
    \ x, y, and d as global variables\nvoid extendedEuclid(int a, int b) {\n  if (b\
    \ == 0) { x = 1; y = 0; d = a; return; }\n  extendedEuclid(b, a % b);\n  int x1\
    \ = y;\n  int y1 = x - (a / b) * y;\n  x = x1;\n  y = y1;\n}\n```\n\nUsing `extendedEuclid`,\
    \ the Linear Diophantine Equation with two variables can be easily solved.\n\n\
    For our motivating problem above: $25x + 18y = 839$, we have: $a = 25, b = 18,\
    \ \\text{extendedEuclid}(25, 18) = ((-5, 7), 1)$, or $25 \\times (-5) + 18 \\\
    times 7 = 1$.\n\nMultiplying the left and right hand side of the equation above\
    \ by $839/\\gcd(25, 18) = 839$, we have: $25 \\times (-4195) + 18 \\times 5873\
    \ = 839$. Thus, $x = -4195 + (18/1)n,\\ y = 5873 - (25/1)n$.\n\nSince we need\
    \ to have non-negative $x$ and $y$, we have: $-4195 + 18n \\geq 0$ and $5873 -\
    \ 25n \\geq 0$, or $4195/18 \\leq n \\leq 5873/25$, or $233.05 \\leq n \\leq 234.92$.\n\
    \nThe only possible integer for $n$ is 234.\n\nThus $x = -4195 + 18 \\times 234\
    \ = 17$ and $y = 5873 - 25 \\times 234 = 23$, i.e. 17 apples (of 25 cents each)\
    \ and 23 oranges (of 18 cents each) of a total of 8.39 SGD.\n\nProgramming Exercises\
    \ related to Extended Euclid algorithm:\n\n- 1. UVa 718 - Skyscraper Floors\n\
    - 2. UVa 10090 - Marbles (use solution for Linear Diophantine Equation)\n- 3.\
    \ UVa 10104 - Euclid Problem (pure problem involving Extended Euclid)\n\n### 5.3.5\
    \ Modulo Arithmetic\n\nSome mathematical computations in programming problems\
    \ can end up having very large positive (or very small negative) results that\
    \ exceed the range of the largest integer data type (currently the 64-bit `long\
    \ long` in C++). Sometimes, we are only interested in the result modulo a number.\n\
    \nFor example in UVa 10176 - Ocean Deep! Make it shallow!!, we are asked to convert\
    \ a long binary number (up to 100 digits) to decimal. A quick calculation shows\
    \ that the largest possible number is $2^{100} - 1$ which is beyond the reach\
    \ of 64-bit integers. However, the problem only asks if the result is divisible\
    \ by 131071. So what we need to do is to convert binary to decimal digit by digit,\
    \ and then quickly perform modulo operation to the intermediate result by 131071.\
    \ If the final result is 0, then the actual number in binary (which we never compute),\
    \ is divisible by 131071.\n\nProgramming Exercises related to Modulo Arithmetic:\n\
    \n- 1. UVa 374 - Big Mod\n- 2. UVa 602 - What Day Is It?\n- 3. UVa 10174 - Couple-Bachelor-Spinster\
    \ Numbers\n- 4. UVa 10176 - Ocean Deep! Make it shallow!! (as discussed above)\n\
    - 5. UVa 10212 - The Last Non-zero Digit\n- 6. UVa 10489 - Boxes of Chocolates\n\
    - 7. LA 4104 - MODEX\n"
