  mdcn: "\n### A 邻接矩阵\n\n通常采用二维数组的形式。\n\n在涉及图的竞赛题中，通常 $V$ 是已知的，因此我们可以通过建立一个二维的、$O(V^2)$\
    \ 的静态数组：`int AdjMat[V][V]` 来构建一个‘连通性表’。对于无权图，如果顶点 $i$-$j$ 之间存在边，我们设置 `AdjMat[i][j]\
    \ = 1`，否则设置为 0。对于加权图，如果顶点 $i$-$j$ 之间存在权重为 $w(i,j)$ 的边，我们设置 `AdjMat[i][j] = weight(i,\
    \ j)`，否则设置为 0。\n\n如果经常查询*小型稠密图*中两个顶点之间的连通性，邻接矩阵是合适的；但它不适合*大型稀疏图*，因为二维数组中会有太多空白单元格（包含零）。即使顶点\
    \ $v$ 只有少量邻居，邻接矩阵枚举顶点 $v$ 的邻居列表也恰好需要 $O(V)$ 时间——这是许多图算法中常用的一项操作。一种更紧凑、更高效的图表示形式是邻接表。\n\
    \n### B 邻接表\n\n通常采用 C++ STL `vector<vii> AdjList` 的形式，其中 vii 定义为：\n\n```cpp\n\
    typedef pair<int, int> ii; typedef vector<ii> vii; // our data type shortcuts\n\
    ```\n\n在邻接表中，我们有一个包含 $V$ 个顶点的*向量*，并且对于每个顶点 $v$，我们存储另一个向量，其中包含与 $v$ 有连接的（相邻顶点及其边权重）对。如果图是无权图，只需存储\
    \ weight = 0，或去掉第二个属性。\n\n使用邻接表，我们可以高效地枚举顶点 $v$ 的邻居列表。如果 $v$ 有 $k$ 个邻居，则这种枚举的复杂度为\
    \ $O(k)$。由于这是大多数图算法中最常见的操作之一，建议将邻接表作为默认选择。\n\n### C 边列表\n\n通常采用 C++ STL `priority_queue<pair<int,\
    \ ii> > EdgeList` 的形式。\n\n在边列表中，我们存储边的列表，通常按某种顺序排列。这种结构对于用于 MST 的 Kruskal 算法（第\
    \ 4.4 节）非常有用，其中边集合按长度从最短到最长排序。\n\n### D 父子节点树结构\n\n通常采用 `int parent` 和 C++ STL\
    \ `vector<int> child` 的形式。\n\n如果图是一棵树（无环且 $E = V - 1$ 的连通图），类似于目录/文件夹结构，那么还存在另一种数据结构形式。对于每个顶点，我们只存储两个属性：父节点（根顶点为\
    \ NULL）和子节点列表（叶节点为 NULL）。\n\n练习：给出图 4.1 中所示图的邻接矩阵、邻接表和边列表。\n\n## 2.3.2 并查集（Union-Find\
    \ Disjoint Sets）\n\n并查集（Union-Find Disjoint Sets）是一种用于对不相交集合的集合进行建模的数据结构，它具有高效<sup>4</sup>完成以下操作的能力：1).\
    \ ‘查找’某个元素属于哪个集合（或测试两个元素是否属于同一集合）；2). 将两个不相交集合‘合并’为一个更大的集合。这两个操作对于 Kruskal 算法（第\
    \ 4.4 节）或涉及‘划分’的问题很有用，例如跟踪无向图的连通分量（见第 4.2 节）。\n\n这些看似简单的操作并不能由只处理单个集合的 C++ STL\
    \ `<set>` *高效地*支持。拥有一个集合的*向量*，并循环遍历每个集合以找出哪个集合\n\n## 2.3.3 线段树\n\n在本小节中，我们讨论另一种能够高效回答*动态*区间查询的数据结构。作为起点，我们讨论这样一个问题：给定一个区间\
    \ [i..j]，找出数组中最小元素的下标。这通常被称为区间最小值查询（Range Minimum Query，RMQ）。例如，给定下面大小为 7 的数组\
    \ A，RMQ(1, 3) = 2，因为下标 2 包含 A[1]、A[2] 和 A[3] 中的最小元素。为了检验你对 RMQ 的理解，请验证在下面的数组 A\
    \ 上，RMQ(3, 4) = 4、RMQ(0, 0) = 0、RMQ(0, 1) = 1，以及 RMQ(0, 6) = 5。\n\n```text\nValues\
    \  =   8  |  7  |  3  |  9  |  5  |  1  |  10\nArray A =\nIndices =   0  |  1\
    \  |  2  |  3  |  4  |  5  |  6\n```\n\n解决这个 RMQ 有几种方法。一种朴素算法是从下标 i 到 j 遍历数组，并报告具有最小值的下标。但每次查询的复杂度为\
    \ O(n)。当 n 很大时，这种算法可能不可行。\n\n在本节中，我们用线段树来解决 RMQ：这是一种类似于堆的二叉树，但通常不是完全二叉树。对于上面的数组\
    \ A，线段树如图 2.7 所示。这棵树的根节点包含完整区间，从 [0, N - 1]。并且对于每个区间 [l, r]，我们将其分割为 [l, (l + r)\
    \ / 2] 和 [(l + r) / 2 + 1, r]，直到 l = r。参见下面 O(n log n) 的 `build_segment_tree`\
    \ 例程。在线段树已经构建好的情况下，回答一次 RMQ 现在可以在 O(log n) 内完成。\n\n例如，我们想回答 RMQ(1, 3)。图 2.7 中的执行过程（红色实线）如下：从根节点\
    \ [0, 6] 开始，我们知道 RMQ(1, 3) 的答案在顶点 [0, 6] 的左侧，因为 [0, 6] 仍然大于 RMQ(1, 3)，因此 [0, 6]\
    \ 中存储的 min（最小值）值 = 5 并不合适，因为它是比 RMQ(1, 3) 更大的区间 [0, 6] 上的最小值。\n\n我们移动到左区间 [0,\
    \ 3]。在顶点 [0, 3] 处，我们必须搜索两侧，因为 [0, 3] 仍然大于 RMQ(1, 3)，并且与左区间 [0, 1] 和右区间 [2, 3]\
    \ *两者*都相交。\n\n右区间是 [2, 3]，它位于所需的 RMQ(1, 3) 内，因此从该节点内存储的最小值可知 RMQ(2,3) = 2。我们*不*需要继续向下遍历。\n\
    \n左区间是 [0, 1]，它尚未位于 RMQ(1, 3) 内，因此需要再次分割。从 [0, 1] 出发，我们向右移动到区间 [1, 1]，此时它位于 RMQ(1,\
    \ 3) 内。然后，我们将最小值 = 1 返回给调用者。\n\n回到区间 [0, 3]，我们现在知道 RMQ(1, 1) = 1 且 RMQ(2, 3) =\
    \ 2。由于 A[1] = 7 且 A[2] = 3，因此 A[RMQ(1, 1)] > A[RMQ(2, 3)]，所以我们知道 RMQ(1, 3) = 2。\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_33_0.png)\n\n图 2.7：数组 A {8, 7, 3, 9,\
    \ 5, 1, 10} 的线段树\n\n我们来看另一个例子：RMQ(4, 6)。图 2.7 中的执行过程（蓝色虚线）如下：我们再次从根节点 [0, 6] 开始。由于它比查询区间大，我们向右移动到区间\
    \ [4, 6]。由于该区间正好就是 RMQ(4, 6)，我们只需返回该节点中存储的最小元素的下标，即 5。因此 RMQ(4, 6) = 5。我们不必遍历树中不必要的部分！在最坏情况下，我们会有两条从根到叶的路径，这仅为\
    \ O(log n)。例如在 RMQ(3, 4) = 4 中，我们有一条从 [0, 6] 到 [3, 3] 的根到叶路径，以及另一条从 [0, 6] 到 [4,\
    \ 4] 的根到叶路径。\n\n如果数组 A 是静态的，那么使用线段树来解决 RMQ 就大材小用了，因为存在一种动态规划（DP）解法，它需要 O(n log\
    \ n) 的一次性预处理和每次 RMQ 的 O(1) 时间。这个 DP 解法将在后面的第 3.4.3 节中讨论。\n\n如果数组 A 经常更新，线段树就会变得有用。例如，如果\
    \ A[5] 现在从 1 改为 100，那么我们需要做的是更新从叶节点到根节点的路径，这可以在 O(log n) 内完成。而 DP 解法需要再进行一次 O(n\
