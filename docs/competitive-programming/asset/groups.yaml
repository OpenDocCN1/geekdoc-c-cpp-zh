    \ = {2, 4, 6, 8, 3, 1, 7, 5} 是该问题的一个解；row[1] = 2 表示第1列的皇后放在第2行，等等（本例中索引从1开始）。这样建模后，搜索空间从\
    \ 8^8 = 17M 降到 8! = 40K。\n\n  我们还知道任意两个皇后不能在同一条对角线上。假设皇后 A 在 (i, j)，皇后 B 在 (k,\
    \ l)，则它们互相攻击当且仅当 abs(i - k) == abs(j - l)。你可以随意将两个皇后放在同一条对角线上来验证这个公式。\n\n  然后，递归回溯解法将按照上述两个约束，从第1列到第8列逐个放置皇后。最后，如果找到一个候选解，检查其中一个皇后是否满足输入的约束，即\
    \ row[b] == a。该解法即可通过（Accepted）。\n\n  我们在下一页下方提供了代码。如果你以前从未编写过递归回溯解法，请仔细研究它，也许可以用你自己的编码风格重新编写。例如，你也可以使用\
    \ C++ STL 的 <algorithm>: next_permutation 代替。\n\n"
