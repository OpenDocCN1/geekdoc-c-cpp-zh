    本章“完整搜索”材料的主要来源是USACO训练网关[18]。\n\n我们采用“完整搜索”这个名称，而不是“暴力搜索”，因为我们认为某些完整搜索解法虽然完整，但可以足够巧妙和快速，例如**分支限界**和**A*搜索**（本书尚未讨论这两者）。我们认为“巧妙的暴力搜索”这个说法有点自相矛盾。\n\
    \n分治范式通常以其流行算法的形式使用：二分查找（二分法）、归并/快速/堆排序，以及数据结构：二叉搜索树、堆、线段树等。稍后我们将在计算几何（第7.5节）中看到更多分治。\n\
    \n*基本*的贪心与动态规划（DP）技术总是包含在流行的算法教材中，例如 Introduction to Algorithms [4]、Algorithm\
    \ Design [13]、Algorithms [5]、Programming Challenges [23]、The Art of Algorithms\
    \ and Programming Contests [16]、Art of Programming Contest [1]。然而，为了跟上这些技术日益增长的难度和创造性，尤其是DP技术，我们加入了更多来自互联网的参考资料：TopCoder算法教程[25]以及近期的编程竞赛，例如ACM\
    \ ICPC Regional Kaohsiung 2006、Singapore 2007、Jakarta 2008、Central European Olympiad\
    \ in Informatics 2009等。\n\n然而，对于某些现实问题，尤其是被归类为NP完全[4]的问题，目前讨论的许多方法将不再适用。例如，0-1背包问题具有$O(NW)$的DP复杂度，如果$W$很大，就太慢了。为此，人们使用启发式方法或局部搜索：束搜索、禁忌搜索[10]、遗传算法、蚁群优化等。\n\
    \n本章讨论了大约**109道编程练习**。\n\n## 第4章：图\n\n*许多现实问题可以归类为图问题。有些问题有高效解法。有些问题目前还没有。在本章中，我们学习各种具有已知高效解法的图问题，涵盖基本遍历、最小生成树、最短路径和网络流算法。*\n\
    \n### 4.1 概述与动机\n\n在本章中，我们讨论编程竞赛中常见的图问题、解决这些问题的算法，以及这些算法的实际实现。如何存储图信息的问题已在前面第2.3.1节中讨论过。\n\
    \n我们假设读者熟悉以下术语：顶点/节点、边、无权/加权、无向/有向、入度/出度、自环/多重边（多重图）与简单图、稀疏/稠密、路径、环、孤立顶点与可达顶点、（强）连通分量、子图、树/森林、完全图、有向无环图、二分图、欧拉/哈密顿路径/回路。如果你遇到任何不熟悉的术语，请到Wikipedia\
    \ [46]搜索该特定术语。\n\n表4.1总结了我们迄今对近期ACM ICPC亚洲区域赛中图问题的研究及其ICPC Live Archive [11] ID。尽管图问题如此之多（本章讨论了许多），它们在一个题目集中只出现一次或两次。问题是：“我们必须学习哪些？”如果你想在竞赛中取得好成绩，除了学习所有这些材料，别无选择。\n\
    \n### 4.2 深度优先搜索\n\n#### 基本形式与应用\n\n深度优先搜索——缩写为DFS——是一种遍历图的简单算法。借助全局数组`int dfs_num[V]`（初始设为“未访问”，即常量值`DFS_WHITE\
    \ = 0`），DFS从起始顶点开始，在尝试其他分支之前，访问从起始顶点能到达的最深顶点。注意，这个访问顺序在很大程度上取决于我们排列某顶点邻居的方式，即序列0\
    \ → 1 → 3 → 2（回溯到3）→ 4也是一种可能的访问序列。还要注意，一次调用`dfs(u)`只会访问所有与顶点`u`*相连*的顶点。这就是为什么在图4.1中，通过调用`dfs(0)`，顶点5、6和7当前未被访问。\n\
    \n这里展示的DFS代码与前面第3.1节展示的递归回溯代码非常相似。如果我们把典型回溯代码的伪代码（在下面复现）与上面展示的DFS代码进行比较，可以看到主要区别只在于我们是否标记已访问顶点。DFS会标记。回溯不会。由于不重复访问顶点，DFS的运行时间为$O(V\
    \ + E)$，但回溯的时间复杂度呈指数增长。\n\n```c\nvoid backtracking(state) {\n    if (hit end state\
    \ or invalid state) // invalid state includes states that cause cycling\n    \
    \    return; // we need terminating/pruning condition\n    for each neighbor of\
    \ this state // regardless it has been visited or not\n        backtracking(neighbor);\n\
    }\n```\n\n#### 其他应用\n\nDFS不仅对遍历图有用。它还可用于解决许多其他图问题。\n\n##### 在无向图中寻找连通分量\n\n一次调用`dfs(u)`只会访问实际与`u`相连的顶点，这一事实可用于寻找（并计数）无向图的连通分量（关于有向图上的类似问题，请见下文进一步内容）。我们可以简单地使用以下代码，从剩余未访问顶点之一重新开始DFS，以寻找下一个连通分量（直到所有顶点都被访问）：\n\
    \n```c\n// all sample codes involving REP use this macro\n#define REP(i, a, b)\
    \ \\\n  for (int i = int(a); i <= int(b); i++)\n\n// inside int main()\nnumComponent\
    \ = 0;\nmemset(dfs_num, DFS_WHITE, sizeof dfs_num);\nREP (i, 0, V - 1)\n    if\
    \ (dfs_num[i] == DFS_WHITE) {\n        printf(\"Component %d, visit: \", ++numComponent);\n\
    \        dfs(i);\n        printf(\"\\n\");\n    }\nprintf(\"There are %d connected\
    \ components\\n\", numComponent);\n\n// For the sample graph, the output is like\
    \ this:\n// Component 1, visit: 0 1 2 3 4\n// Component 2, visit: 5\n// Component\
    \ 3, visit: 6 7\n```\n\n**练习：**我们也可以使用并查集（Union-Find Disjoint Sets）来解决这个图问题。怎么做？\n\
    \n##### 泛洪填充——为连通分量加标签\n\nDFS除了用于寻找（并计数）连通分量之外，还可用于其他目的。这里，我们展示如何通过对`dfs(u)`做简单调整来为连通分量*加标签*。通常，我们使用连通分量的编号来“标记”（或“着色”）该分量。这种变体更广为人知的名称是“泛洪填充”。\n\
    \n```c\nvoid floodfill(int u, int color) {\n    dfs_num[u] = color; // not just\
    \ a generic DFS_BLACK\n    TRvii(AdjList[u], v) // try all neighbors v of vertex\
    \ u, note that we use our TRvii macro again\n        if (dfs_num[v->first] ==\
    \ DFS_WHITE) // avoid cycle\n            floodfill(v->first, color); // v is an\
    \ (neighbor, weight) pair\n}\n\n// inside int main()\nnumComponent = 0;\nmemset(dfs_num,\
    \ DFS_WHITE, sizeof dfs_num);\nREP (i, 0, V - 1) // for each vertex u in [0..V-1],\
    \ note that we use our REP macro again\n    if (dfs_num[i] == DFS_WHITE) // if\
    \ not visited\n        floodfill(i, ++numComponent);\nREP (i, 0, V - 1)\n    printf(\"\
    Vertex %d has color %d\\n\", i, dfs_num[i]);\n\n// For the sample graph, the output\
    \ is like this:\n// Vertex 0 1 2 3 4 have color 1\n// Vertex 5 has color 2\n//\
    \ Vertex 6 7 has color 3\n```\n\n**练习：**泛洪填充更常见于二维网格（隐式图）上执行。尝试解决UVa 352、469、572等。\n\
    \n##### 通过DFS生成树检查图边性质\n\n在图的某个连通分量上运行DFS会形成一棵DFS*生成树*（如果图有多个连通分量，并且对每个分量运行DFS，则形成DFS*生成森林*）。在`DFS_WHITE`（未访问）和`DFS_BLACK`（已访问且已完成）之上，再增加一种顶点状态：`DFS_GRAY\
    \ = 2`（已访问但尚未完成），我们可以利用这棵DFS生成树（或生成森林）将图的边分为四类：\n\n1. **树边：**DFS遍历过的边，即从状态为`DFS_GRAY`的顶点指向状态为`DFS_WHITE`的顶点。\n\
    2. **后向边：**属于环的一部分，即也从状态为`DFS_GRAY`的顶点指向状态为`DFS_GRAY`的顶点。注意，通常我们不把双向边视为存在“环”（我们需要记住`dfs_parent`来区分这种情况，见下面的代码）。\n\
    3. **前向/交叉边：**从状态为`DFS_GRAY`的顶点指向状态为`DFS_BLACK`的顶点。这两类边通常不用于编程竞赛题目。\n\n图4.2展示了在图4.1的示例图上依次调用`dfs(0)`、`dfs(5)`，最后调用`dfs(6)`的动画（从左上到右下）。我们可以看到1\
    \ → 2 → 3 → 1是一个（真正的）环，并且我们将边(3 → 1)归类为后向边；而0 → 1 → 0不是环，边(1 → 0)只是一条双向边。这种DFS变体的代码如下所示。\n"
