    \ - 条形码（World Finals Harbin10）\n\n### 1.4 章末注释\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_24_0.png)\n\
    \n图 1.5：启发作者编写本书的一些参考书\n\n本章及后续章节得到了许多教科书（见图 1.5）和互联网资源的支持。技巧 1 改编自 USACO 训练网关\
    \ [18] 的介绍文字。关于技巧 2 的更多细节可在许多计算机科学书籍中找到，例如 [4] 的第 1-5 章、第 17 章。技巧 3 的参考资源包括 http://www.cppreference.com、C++\
    \ STL 的 http://www.sgi.com/tech/stl/，以及 Java API 的 http://java.sun.com/javase/6/docs/api。若想获得更多洞见以进行更好的测试（技巧\
    \ 4），不妨稍微绕道去读一些软件工程书籍。除了技巧 5 中提到的在线评测系统外，还有许多其他在线评测系统，例如\n\n- SPOJ http://www.spoj.pl，\n\
    - POJ http://acm.pku.edu.cn/JudgeOnline，\n- TOJ http://acm.tju.edu.cn/toj，\n-\
    \ ZOJ http://acm.zju.edu.cn/onlinejudge/，\n- Ural/Timus OJ http://acm.timus.ru\
    \ 等。\n\n本章讨论了大约 **34 道编程练习题**。\n\n## 第 2 章 数据结构与库\n\n> 如果我看得更远，那只是因为站在巨人的肩膀上。\n\
    >\n> —— 艾萨克·牛顿\n\n本章为后续章节奠定基础。\n\n### 2.1 数据结构\n\n数据结构是“一种存储和组织数据的方式”，用于支持高效的插入、查询、搜索、更新和删除。尽管数据结构本身并不能解决给定的编程问题——真正解决问题的是在其上运行的算法，但针对给定问题使用最高效的数据结构，可能决定是通过题目的时间限制还是超出时间限制。组织同一数据有许多方式，有时某种方式在不同情境下会优于另一种方式，正如我们将在下面的讨论中看到的那样。熟悉本章讨论的数据结构，是理解后续章节算法的必要条件。\n\
    \n正如本书前言所述，我们假设你熟悉第 2.2 节列出的基本数据结构，因此本书不再复习它们。我们只是强调一点：它们在 C++ STL 和 Java API\
    \ 中都有内置库（请注意，在本书的这个版本中，我们大多数示例代码是从 C++ 的角度编写的）。如果你对第 2.2 节提到的任何术语或数据结构没有把握，请阅读本书，并快速在参考书（例如\
    \ [3]）中查阅和学习该术语，待你掌握这些数据结构的基本概念后再继续。\n\n请注意，对于竞赛编程，你只需要能够使用（即了解其优点、缺点以及时间/空间复杂度）某种数据结构来解决相应的竞赛题即可。了解其理论背景固然好，但可以跳过。\n\
    \n本章分为两部分。第 2.2 节包含基本数据结构及其可内置于库中的基本操作。第 2.3 节包含更多目前我们必须自行构建库的数据结构。因此，第 2.3 节的讨论比第\
    \ 2.2 节更详细。\n\n[1] 第 2.2 节的材料通常在计算机科学课程的一级“数据结构与算法”课程中讲授。鼓励计划参加 IOI 等竞赛的高中生自学这些材料。\n\
    \n### 2.2 带内置库的数据结构\n\n#### 2.2.1 线性数据结构\n\n如果数据结构的元素形成一个序列，则该数据结构被归类为*线性*数据结构。掌握下面所有这些基本线性数据结构，是在当今编程竞赛中取得好成绩的必要条件。\n\
    \n- C/C++ 和 Java 中的静态数组\n\n  当需要存储一组顺序数据并稍后通过其索引访问时，这显然是编程竞赛中最常用的数据结构。由于编程题通常会说明最大输入规模，因此声明的数组大小通常为该值\
    \ + 少量额外缓冲。数组的典型维度包括：一维、二维、三维，很少超过四维。数组的典型操作包括：访问某些索引、对数组排序、线性扫描或二分查找数组。\n\n-\
    \ 可调整大小的数组，又称向量：C++ STL `<vector>`（Java ArrayList）\n\n  其他方面与静态数组相同，但具有自动调整大小的特性。如果事先（即在运行程序之前）不知道数组大小，使用向量比使用数组更好。通常，我们会用某个猜测值初始化其大小，以获得更好的性能。典型操作包括：`push_back()`、`at()`、`[]`\
    \ 运算符、`erase()`，并且通常使用迭代器扫描向量内容。\n\n**静态/可调整大小数组中的高效排序与搜索**\n\n数组上通常执行两种核心操作：排序和搜索。\n\
    \n计算机科学教科书中提到了*许多*排序算法，我们将其分类为：\n\n- 1. $O(n^2)$ 基于比较的排序算法 [4]：冒泡/选择/插入排序。\n\n\
    \  这些算法速度较慢，通常会被避免使用，但理解它们很重要。\n\n- 2. $O(n\\log n)$ 基于比较的排序算法 [4]：归并/堆/随机快速排序。\n\
    \n  我们可以使用 C++ STL `<algorithm>` 中的 `sort`、`partial_sort`、`stable_sort` 来实现此目的（Java\
    \ 中为 `Collections.sort`）。我们只需指定所需的比较函数，这些库例程会处理其余部分。\n\n- 3. 特殊用途排序算法 [4]：$O(n)$\
    \ 计数排序、基数排序、桶排序。\n\n  了解这些特殊用途算法是有好处的，因为如果问题具有特殊特征（例如计数排序适用于小范围整数），它们可以加快排序时间，但它们在编程竞赛中很少出现。\n\
    \n然后，在数组中查找一个元素基本上有三种方式，我们将其分类为：\n\n- 1. 从索引 0 到索引 $n-1$ 的 $O(n)$ 线性搜索（在编程竞赛中避免使用）。\n\
    - 2. $O(\\log n)$ 二分查找：使用 C++ STL `<algorithm>` 中的 `lower_bound`（或 Java `Collections.binarySearch`）。如果输入未排序，先使用上述\
    \ $O(n\\log n)$ 排序算法对其排序一次，以便多次使用二分查找，是很有成效的。\n- 3. 使用哈希实现 $O(1)$（但对于大多数竞赛题，没有哈希也能应对）。\n\
    \n- 链表：C++ STL `<list>`（Java LinkedList）\n\n  尽管这种数据结构几乎总是出现在数据结构与算法教科书中，但在典型的竞赛题中通常会避免使用链表。原因：它涉及指针，并且从理论上讲访问数据较慢，因为必须从列表的头部或尾部开始执行访问。\n\
    \n"
