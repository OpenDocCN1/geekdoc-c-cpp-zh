    ### 6.4.2 后缀树的应用


    假设字符串 $S$ 的后缀树⁴已经构建完成，我们可以将其用于以下应用：


    **在 $O(|Q| + occ)$ 内进行精确字符串匹配**


    使用后缀树，我们可以在 $O(|Q|+occ)$ 时间内找到查询字符串 $Q$ 在 $S$ 中的所有（精确）出现位置，其中 $|Q|$ 是查询字符串 $Q$
    本身的长度，$occ$ 是 $Q$ 在 $S$ 中的出现总次数——无论字符串 $S$ 有多长。当后缀树已经构建完成时，这种方法比许多精确字符串匹配算法（例如
    KMP）都*更快*。


    使用后缀树时，我们的任务是在后缀树中搜索表示查询字符串 $Q$ 的顶点 $x$。这只需沿着边标签从根到叶遍历一次即可完成。路径标签为 $= Q$ 的顶点就是目标顶点
    $x$。然后，以 $x$ 为根的子树中的叶子就是 $Q$ 在 $S$ 中的出现位置。之后，我们可以读取存储在该子树叶子中的这些子串的起始索引。


    例如，在图 6.2 右侧所示的 $S = ’acacag$’$ 的后缀树中，若 $Q = ’aca’$，我们只需从根开始遍历，沿着边标签 ‘a’，再沿着边标签
    ‘ca’，找到路径标签为 ‘aca’ 的顶点 $x$（沿图 6.2 右侧的红色虚线箭头）。该顶点 $x$ 的叶子指向索引 1（子串：’acacag$’）和索引
    3（子串：’acag$’）。


    练习：现在尝试查找查询字符串 $Q = ’ca’$ 和 $Q = ’cat’$！


