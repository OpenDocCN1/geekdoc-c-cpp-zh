    \ Enjoy :).\n\n# **1. Cutting Sticks (UVa 10003)**\n\nAbridged problem statement:\
    \ Given a stick of length 1 ≤ l ≤ 1000, make 1 ≤ n ≤ 50 cuts to that sticks (coordinates\
    \ within range (0 … l) are given). The cost of cut is determined by the length\
    \ of the stick to be cut. Find a cutting sequence so that the overall cost is\
    \ minimized!\n\nExample: l = 100, n = 3, and cut coordinates: coord = {25,50,75}\
    \ (already sorted)\n\nIf we cut from left to right, then we will incur cost =\
    \ 225\n\n+   1. Cut at coordinate 25, total cost = 100;\n+   2. Cut at coordinate\
    \ 50, total cost = 100 + 75 = 175;\n+   3. Cut at coordinate 75, total cost =\
    \ 175 + 50 = 225;\n\nHowever, the optimal answer is: 200\n\n+   1. Cut at coordinate\
    \ 50, total cost = 100;\n+   2. Cut at coordinate 25, total cost = 100 + 50 =\
    \ 150;\n+   3. Cut at coordinate 75, total cost = 150 + 50 = 200;\n\nSolution:\
    \ Use this Complete Search recurrences + top-down DP (memoization): cut(left,\
    \ right)\n\n+   1. If (left + 1 = right) where left and right are indices in array\
    \ coord, then cut(left, right) = 0 as we are left with 1 segment, there is no\
    \ need to cut anymore.\n+   2. Otherwise, try all possible cutting points and\
    \ pick the minimum cost using code below:\n\n```\n```cpp\n// cost = initially\
