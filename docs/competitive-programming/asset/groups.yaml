    # 4.7  Floyd Warshall’s


    # Basic Form and Application


    Motivating Problem: Given a connected, weighted graph $G$ with $V \le 100$ and
    two vertices $s1$ and $s2$, find a vertex $v$ in $G$ that represents the best
    meeting point, i.e. $dist[s1][v] + dist[s2][v]$ is the minimum over all possible
    $v$. What is the best solution?


    This problem requires the shortest path information from two sources s1 and s2
    to all vertices in G. This can be easily done with two calls of Dijkstra’s algorithm.
    One from s1 to produce shortest distance array dist1 from s1, and one from s2
    to produce dist2. Then iterates through all possible vertices in graph to find
    v such that dist1[v] + dist2[v] is minimized. Can we do better?


    If the given graph is known to have $V \le 100$, then there is an even ‘simpler’
    algorithm — in terms of implementation — to solve this problem as quickly as possible!'
  - "[PAGE 89]\n\nLoad the small graph into an Adjacency Matrix and then run the following\
    \ short code with 3 nested loops. When it terminates, `AdjMatrix[i][j]` will contain\
    \ the shortest path distance between two pair of vertices *i* and *j* in *G*.\
    \ The original problem now become easy.\n\n```\n```text\nREP (k, 0, V - 1) //\
    \ recall that #define REP(i, a, b) for (int i = int(a); i <= int(b); i++)\n  REP\
    \ (i, 0, V - 1)\n    REP (j, 0, V - 1)\n      AdjMatrix[i][j] = min(AdjMatrix[i][j],\
    \ AdjMatrix[i][k] + AdjMatrix[k][j]);\n```\n```\n\nThis algorithm is called Floyd\
    \ Warshall’s algorithm, invented by Robert W Floyd and Stephen Warshall. Floyd\
    \ Warshall’s is a DP algorithm that clearly runs in O(V^3) due to its 3 nested\
    \ loops⁴, but since |V| ≤ 100 for the given problem, this is do-able. In general,\
    \ Floyd Warshall’s solves another classical graph problem: the All-Pairs Shortest\
    \ Paths (APSP) problem. It is an alternative algorithm (for small graphs) compared\
    \ to calling SSSP algorithms multiple times.\n\n+   1. V calls of O((V + E) log\
    \ V) Dijkstra’s = O(V^3 log V) if E = O(V^2).\n+   2. V calls of O(VE) Bellman\
    \ Ford’s = O(V^4) if E = O(V^2).\n\nIn a programming contest setting, Floyd Warshall’s\
    \ main attractiveness is basically its implementation speed – 4 short lines only.\
    \ If the given graph is small, do not hesitate using this algorithm – even if\
    \ you only need a solution for the SSSP problem.\n\n# Explanation of Floyd Warshall’s\
    \ DP Solution\n\nWe provide this section for the benefit of readers who are interested\
    \ to know why Floyd Warshall’s works. This section can be skipped if you just\
    \ want to use this algorithm per se. However, examining this section can further\
    \ strengthen your DP skill. Note that there are graph problems that have no classical\
    \ algorithm and must be solved with DP techniques.\n\nThe basic idea behind Floyd\
    \ Warshall’s is to gradually allow the usage of intermediate vertices to form\
    \ the shortest paths. Let the vertices be labeled from 0 to V-1. We start with\
    \ direct edges only, i.e. shortest path of vertex i to vertex j, denoted as sp(i,j)\
    \ = weight of edge (i,j). We then find shortest paths between any two vertices\
    \ with help of restricted intermediate vertices from vertex [0 ... k]. First,\
    \ we only allow k = 0, then k = 1, ... up to k = V-1.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_89_0.png)\n\
    \nFigure 4.18: Floyd Warshall’s Explanation\n\n> ⁴ Floyd Warshall’s algorithm\
    \ must use Adjacency Matrix so that the weight of edge(i, j) can be accessed in\
    \ O(1)."
  - '[PAGE 90]


    In Figure 4.18, we want to find $sp(3,4)$. The shortest possible path is 3-0-2-4
    with cost 3. But how to reach this solution? We know that with direct edges only,
    $sp(3,4)=5$, as in Figure 4.18.A. The solution for $sp(3,4)$ will eventually be
    reached from $sp(3,2)+sp(2,4)$. But with only direct edges, $sp(3,2)+sp(2,4)=3+1$
    is still $>3$.


    When we allow $k=0$, i.e. vertex 0 can now be used as an intermediate vertex,
    then $sp(3,4)$ is reduced as $sp(3,4)=sp(3,0)+sp(0,4)=1+3=4$, as in Figure 4.18.B.
    Note that with $k=0$, $sp(3,2)$ — which we will need later — also drop from 3
    to $sp(3,0)+sp(0,2)=1+1=2$. Floyd Warshall’s will process $sp(i,j)$ for all pairs
    considering only vertex 0 as the intermediate vertex.


    When we allow $k=1$, i.e. vertex 0 and 1 can now be used as the intermediate vertices,
    then it happens that there is no change to $sp(3,4)$, $sp(3,2)$, nor to $sp(2,4)$.


    When we allow $k=2$, i.e. vertices 0, 1, and 2 now can be used as the intermediate
    vertices, then $sp(3,4)$ is reduced again as $sp(3,4)=sp(3,2)+sp(2,4)=2+1=3$.
    Floyd Warshall’s repeats this process for $k=3$ and finally $k=4$ but $sp(3,4)$
    remains at 3.


    We define $D^k_{i,j}$ to be the shortest distance from $i$ to $j$ with only $[0..k]$
    as intermediate vertices.


    Then, Floyd Warshall’s recurrence is as follows:


    $D^{-1}_{i,j}=weight(i,j)$. This is the base case when we do not use any intermediate
    vertices.


    $D^k_{i,j}=min(D^{k-1}_{i,j},D^{k-1}_{i,k}+D^{k-1}_{k,j})=min(\text{not using
    vertex }k,\text{ using }k)$, for $k\geq 0$, see Figure 4.19.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_90_0.png)


    Figure 4.19: Using Intermediate Vertex to (Possibly) Shorten Path


    This DP formulation requires us to fill the entries layer by layer. To fill out
    an entry in the table $k$, we make use of entries in the table $k-1$. For example,
    to calculate $D^2_{3,4}$ (row 3, column 4, in table $k=2$, index start from 0),
    we look at the minimum of $D^1_{3,4}$ or the sum of $D^1_{3,2}+D^1_{2,4}$. See
    Figure 4.20 for illustration.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_90_1.png)


    Figure 4.20: Floyd Warshall’s DP Table


    The naïve implementation is to use 3-dimensional matrix $D[k][i][j]$ of size $O(V^3)$.
    However, we can utilize a space-saving trick by dropping dimension $k$ and computing
    $D[i][j]$ ‘on-the-fly’. Thus, the Floyd Warshall’s algorithm just need $O(V^2)$
    space although it still runs in $O(V^3)$.


    # Other Applications


    The basic purpose of Floyd Warshall’s algorithm is to solve the APSP problem.
    However, it can also be applied to other graph problems.'
  - "[PAGE 91]\n\n# Transitive Closure (Warshall’s algorithm)\n\nStephen *Warshall*\
    \ developed algorithm for finding solution for Transitive Closure problem: Given\
    \ a graph, determine if vertex *i* is connected to *j*. This variant uses logical\
    \ bitwise operators which is much faster than arithmetic operators. Initially,\
    \ `d[i][j]` contains 1 (true) if vertex *i* is directly connected to vertex *j*,\
    \ 0 (false) otherwise. After running O(V³) Warshall’s algorithm below, we can\
    \ check if any two vertices *i* and *j* are directly or indirectly connected by\
    \ checking `d[i][j]`.\n\n```\n```text\nREP (k, 0, V - 1)\n  REP (i, 0, V - 1)\n\
    \    REP (j, 0, V - 1)\n      d[i][j] = d[i][j] | (d[i][k] & d[k][j]);\n```\n\
    ```\n\n# Minimax and Maximim\n\nThe Minimax path problem is a problem of finding\
    \ the minimum of maximum edge weight among all possible paths from *i* to *j*.\
    \ There can be many paths from *i* to *j*. For a single path from *i* to *j*,\
    \ we pick the maximum edge weight along this path. Then for all possible paths\
    \ from *i* to *j*, pick the one with the minimum max-edge-weight. The reserve\
    \ problem of Maximin is defined similarly.\n\nThe solution using Floyd Warshall’s\
    \ is shown below. First, initialize `d[i][j]` to be the weight of edge (i,j).\
    \ This is the default minimax cost for two vertices that are directly connected.\
    \ For pair i-j without any direct edge, set `d[i][j] = INF`. Then, we try all\
    \ possible intermediate vertex *k*. The minimax cost `d[i][j]` is min of either\
    \ (itself) or (the max between `d[i][k]` or `d[k][j]`).\n\n```\n```text\nREP (k,\
    \ 0, V - 1)\n  REP (i, 0, V - 1)\n    REP (j, 0, V - 1)\n      d[i][j] = min(d[i][j],\
    \ max(d[i][k], d[k][j]));\n```\n```\n\nExercise: In this section, we have shown\
    \ you how to solve Minimax (and Maximin) with Floyd Warshall’s algorithm. However,\
    \ this problem can also be modeled as an MST problem and solved using Kruskal’s\
    \ algorithm. Find out the way!\n\nProgramming Exercises for Floyd Warshall’s algorithm:\n\
    \n+   - Floyd Warshall’s Standard Application (for APSP or SSSP on small graph)\n\
    +     1. UVa 186 - Trip Routing (graph is small)\n+     2. UVa 341 - Non-Stop\
    \ Travel (graph is small)\n+     3. UVa 423 - MPI Maelstrom (graph is small)\n\
    +     4. UVa 821 - Page Hopping (one of the ‘easiest’ ICPC World Finals problem)\n\
    +     5. UVa 10075 - Airlines (with special great-circle distances, see Section\
    \ 7.2)\n+     6. UVa 10171 - Meeting Prof. Miguel (solution is easy with APSP\
    \ information)\n+     7. UVa 11015 - 05-32 Rendezvous (graph is small)\n+    \
    \ 8. UVa 10246 - Asterix and Obelix\n+     9. UVa 10724 - Road Construction (adding\
    \ one edge will only change ‘few things’)\n+     10. UVa 10793 - The Orc Attack\
    \ (Floyd Warshall’s simplifies this problem)\n+     11. UVa 10803 - Thunder Mountain\
    \ (graph is small)\n+     12. UVa 11463 - Commandos (solution is easy with APSP\
    \ information)"
