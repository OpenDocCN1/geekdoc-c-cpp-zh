    \ volume of water that can be passed by this pipe network?) This problem is called\
    \ the Max Flow problem. An illustration of this problem is shown in Figure 4.21.\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_92_0.png)\n\nFigure 4.21: Illustration\
