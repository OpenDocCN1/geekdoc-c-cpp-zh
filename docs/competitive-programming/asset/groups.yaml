    \ recurrence is as follows:\n\n$D^{-1}_{i,j}=weight(i,j)$. This is the base case\
    \ when we do not use any intermediate vertices.\n\n$D^k_{i,j}=min(D^{k-1}_{i,j},D^{k-1}_{i,k}+D^{k-1}_{k,j})=min(\\\
    text{not using vertex }k,\\text{ using }k)$, for $k\\geq 0$, see Figure 4.19.\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_90_0.png)\n\nFigure 4.19: Using Intermediate\
    \ Vertex to (Possibly) Shorten Path\n\nThis DP formulation requires us to fill\
    \ the entries layer by layer. To fill out an entry in the table $k$, we make use\
    \ of entries in the table $k-1$. For example, to calculate $D^2_{3,4}$ (row 3,\
    \ column 4, in table $k=2$, index start from 0), we look at the minimum of $D^1_{3,4}$\
    \ or the sum of $D^1_{3,2}+D^1_{2,4}$. See Figure 4.20 for illustration.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_90_1.png)\n\
    \nFigure 4.20: Floyd Warshall’s DP Table\n\nThe naïve implementation is to use\
    \ 3-dimensional matrix $D[k][i][j]$ of size $O(V^3)$. However, we can utilize\
    \ a space-saving trick by dropping dimension $k$ and computing $D[i][j]$ ‘on-the-fly’.\
    \ Thus, the Floyd Warshall’s algorithm just need $O(V^2)$ space although it still\
    \ runs in $O(V^3)$.\n\n### Other Applications\n\n**Transitive Closure (Warshall’s\
    \ algorithm)**\n\nStephen *Warshall* developed algorithm for finding solution\
    \ for Transitive Closure problem: Given a graph, determine if vertex *i* is connected\
    \ to *j*. This variant uses logical bitwise operators which is much faster than\
    \ arithmetic operators. Initially, `d[i][j]` contains 1 (true) if vertex *i* is\
    \ directly connected to vertex *j*, 0 (false) otherwise. After running O(V^3)\
    \ Warshall’s algorithm below, we can check if any two vertices *i* and *j* are\
    \ directly or indirectly connected by checking `d[i][j]`.\n\n```text\nREP (k,\
    \ 0, V - 1)\n  REP (i, 0, V - 1)\n    REP (j, 0, V - 1)\n      d[i][j] = d[i][j]\
    \ | (d[i][k] & d[k][j]);\n```\n\n**Minimax and Maximin**\n\nThe Minimax path problem\
    \ is a problem of finding the minimum of maximum edge weight among all possible\
    \ paths from *i* to *j*. There can be many paths from *i* to *j*. For a single\
    \ path from *i* to *j*, we pick the maximum edge weight along this path. Then\
    \ for all possible paths from *i* to *j*, pick the one with the minimum max-edge-weight.\
    \ The reverse problem of Maximin is defined similarly.\n\nThe solution using Floyd\
    \ Warshall’s is shown below. First, initialize `d[i][j]` to be the weight of edge\
    \ (i,j). This is the default minimax cost for two vertices that are directly connected.\
    \ For pair i-j without any direct edge, set `d[i][j] = INF`. Then, we try all\
    \ possible intermediate vertex *k*. The minimax cost `d[i][j]` is min of either\
    \ (itself) or (the max between `d[i][k]` or `d[k][j]`).\n\n```text\nREP (k, 0,\
    \ V - 1)\n  REP (i, 0, V - 1)\n    REP (j, 0, V - 1)\n      d[i][j] = min(d[i][j],\
    \ max(d[i][k], d[k][j]));\n```\n\nExercise: In this section, we have shown you\
    \ how to solve Minimax (and Maximin) with Floyd Warshall’s algorithm. However,\
    \ this problem can also be modeled as an MST problem and solved using Kruskal’s\
    \ algorithm. Find out the way!\n\nProgramming Exercises for Floyd Warshall’s algorithm:\n\
    \n- Floyd Warshall’s Standard Application (for APSP or SSSP on small graph)\n\
    \  1. UVa 186 - Trip Routing (graph is small)\n  2. UVa 341 - Non-Stop Travel\
    \ (graph is small)\n  3. UVa 423 - MPI Maelstrom (graph is small)\n  4. UVa 821\
    \ - Page Hopping (one of the ‘easiest’ ICPC World Finals problem)\n  5. UVa 10075\
    \ - Airlines (with special great-circle distances, see Section 7.2)\n  6. UVa\
    \ 10171 - Meeting Prof. Miguel (solution is easy with APSP information)\n  7.\
    \ UVa 11015 - 05-32 Rendezvous (graph is small)\n  8. UVa 10246 - Asterix and\
    \ Obelix\n  9. UVa 10724 - Road Construction (adding one edge will only change\
    \ ‘few things’)\n  10. UVa 10793 - The Orc Attack (Floyd Warshall’s simplifies\
    \ this problem)\n  11. UVa 10803 - Thunder Mountain (graph is small)\n  12. UVa\
    \ 11463 - Commandos (solution is easy with APSP information)\n"
  mdcn: "\n表 4.3 中，我们给出了一个面向编程竞赛的 SSSP 算法决策表。它旨在帮助读者根据各种图条件决定选择哪种算法。\n\n| 图条件 | BFS\
    \ | Dijkstra 算法 | Bellman Ford 算法 |\n|---|---|---|---|\n|  | $O(V + E)$ | $O((V\
    \ + E) \\log V)$ | $O(VE)$ |\n| 无权 | 最佳：$V, E \\le 1M$ | 尚可：$V, E \\le 50K$ |\
    \ 差：$VE \\le 1M$ |\n| 加权 | 除树和 DAG 外会 WA | 最佳：$V, E \\le 50K$ | 尚可：$VE \\le 1M$\
    \ |\n| 负权 | WA | WA | 最佳：$VE \\le 1M$ |\n| 负环 | 无法检测 | 无法检测 | 可以检测 |\n\n表 4.3：SSSP\
    \ 算法决策表\n\nDijkstra 和 Bellman Ford 算法的编程练习：\n\n- Dijkstra 标准应用（用于加权 SSSP）\n  1.\
    \ UVa 341 - 直达旅行（实际上可用 Floyd Warshall 算法求解）\n  2. UVa 929 - 数字迷宫（在二维迷宫图上）\n  3.\
    \ UVa 10278 - 消防站\n  4. UVa 10603 - 倒水\n  5. UVa 10801 - 电梯换乘（仔细建模图！）\n  6. UVa\
    \ 10986 - 发送电子邮件（直接的 Dijkstra 应用）\n  7. UVa 11377 - 机场设置（仔细建模图！）\n  8. UVa 11492\
    \ - 巴别塔（仔细建模图！）\n  9. UVa 11635 - 酒店预订（Dijkstra + BFS）\n  10. LA 3290 - 邀请你的朋友（+\
    \ BFS）\n- Bellman Ford 标准应用（用于带负环的加权 SSSP）\n  1. UVa 558 - 虫洞（检查负环是否存在）\n  2.\
    \ UVa 10557 - XYZZY\n  3. UVa 11280 - 飞往弗雷德里克顿（修改的 Bellman Ford 算法）\n\n## 4.7\
    \ Floyd Warshall 算法\n\n### 基本形式与应用\n\n动机问题：给定一个连通加权图 $G$，其中 $V \\le 100$，以及两个顶点\
    \ $s1$ 和 $s2$，在 $G$ 中找一个顶点 $v$，使其成为最佳会合点，即 $dist[s1][v] + dist[s2][v]$ 在所有可能的\
    \ $v$ 中最小。最佳解法是什么？\n\n该问题需要从两个源点 s1 和 s2 到 G 中所有顶点的最短路径信息。这可以通过两次调用 Dijkstra 算法轻松完成。一次从\
    \ s1 出发生成从 s1 到各点的最短距离数组 dist1，另一次从 s2 出发生成 dist2。然后遍历图中所有可能顶点，找到使 dist1[v] +\
    \ dist2[v] 最小的 v。我们能做得更好吗？\n\n如果已知给定图的 $V \\le 100$，那么从实现角度看，甚至有一种“更简单”的算法可以尽可能快地解决此问题！\n\
    \n将小图加载到邻接矩阵中，然后运行下面这段带 3 层嵌套循环的简短代码。当它结束时，`AdjMatrix[i][j]` 将包含 *G* 中任意一对顶点 *i*\
    \ 和 *j* 之间的最短路径距离。原问题现在变得简单了。\n\n```text\nREP (k, 0, V - 1) // recall that #define\
    \ REP(i, a, b) for (int i = int(a); i <= int(b); i++)\n  REP (i, 0, V - 1)\n \
    \   REP (j, 0, V - 1)\n      AdjMatrix[i][j] = min(AdjMatrix[i][j], AdjMatrix[i][k]\
    \ + AdjMatrix[k][j]);\n```\n\n该算法称为 Floyd Warshall 算法，由 Robert W Floyd 和 Stephen\
    \ Warshall 发明。Floyd Warshall 是一种 DP 算法，由于其 3 层嵌套循环⁴，显然运行时间为 O(V^3)，但给定问题中 |V|\
    \ ≤ 100，因此可行。一般来说，Floyd Warshall 解决另一个经典图问题：全源最短路径（APSP）问题。与多次调用 SSSP 算法相比，它是（针对小图的）另一种选择。\n\
    \n1. 调用 V 次 O((V + E) log V) 的 Dijkstra = 若 E = O(V^2)，则为 O(V^3 log V)。\n2. 调用\
    \ V 次 O(VE) 的 Bellman Ford = 若 E = O(V^2)，则为 O(V^4)。\n\n在编程竞赛环境中，Floyd Warshall\
    \ 的主要吸引力基本上在于其实现速度——仅 4 行短代码。如果给定图很小，请毫不犹豫地使用该算法——即使你只需要 SSSP 问题的解。\n\n### Floyd\
    \ Warshall 的 DP 解法说明\n\n我们提供本节是为了让有兴趣了解 Floyd Warshall 为何有效的读者受益。如果你只想使用该算法本身，可以跳过本节。不过，研究本节可以进一步增强你的\
    \ DP 技能。请注意，有些图问题没有经典算法，必须用 DP 技术求解。\n\nFloyd Warshall 的基本思想是逐步允许使用中间顶点来构成最短路径。设顶点标号为\
    \ 0 到 V-1。我们开始时只考虑直接边，即顶点 i 到顶点 j 的最短路径，记为 sp(i,j) = 边 (i,j) 的权重。然后，我们借助来自顶点 [0\
    \ ... k] 的受限中间顶点，找出任意两个顶点之间的最短路径。首先只允许 k = 0，然后 k = 1，……直到 k = V-1。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_89_0.png)\n\
    \n图 4.18：Floyd Warshall 算法说明\n\n> ⁴ Floyd Warshall 算法必须使用邻接矩阵，以便能在 O(1) 时间内访问边\
    \ (i, j) 的权重。\n\n在图 4.18 中，我们想求 $sp(3,4)$。最短可能路径是 3-0-2-4，代价为 3。但如何得到这个解？我们知道，仅考虑直接边时，$sp(3,4)=5$，如图\
    \ 4.18.A 所示。$sp(3,4)$ 的解最终会从 $sp(3,2)+sp(2,4)$ 得到。但仅考虑直接边时，$sp(3,2)+sp(2,4)=3+1$\
    \ 仍然 $>3$。\n\n当我们允许 $k=0$，即现在可以将顶点 0 用作中间顶点时，$sp(3,4)$ 被减小为 $sp(3,4)=sp(3,0)+sp(0,4)=1+3=4$，如图\
    \ 4.18.B 所示。注意，当 $k=0$ 时，我们后面会用到的 $sp(3,2)$ 也从 3 降到 $sp(3,0)+sp(0,2)=1+1=2$。Floyd\
    \ Warshall 会仅将顶点 0 作为中间顶点，处理所有顶点对的 $sp(i,j)$。\n\n当我们允许 $k=1$，即现在可以将顶点 0 和 1 用作中间顶点时，结果\
    \ $sp(3,4)$、$sp(3,2)$ 和 $sp(2,4)$ 都没有变化。\n\n当我们允许 $k=2$，即现在可以将顶点 0、1 和 2 用作中间顶点时，$sp(3,4)$\
    \ 再次被减小为 $sp(3,4)=sp(3,2)+sp(2,4)=2+1=3$。Floyd Warshall 对 $k=3$ 重复此过程，最后对 $k=4$\
    \ 重复，但 $sp(3,4)$ 仍保持为 3。\n\n我们定义 $D^k_{i,j}$ 为仅将 $[0..k]$ 作为中间顶点时从 $i$ 到 $j$ 的最短距离。\n\
    \n那么，Floyd Warshall 的递推式如下：\n\n$D^{-1}_{i,j}=weight(i,j)$。这是不使用任何中间顶点时的基本情况。\n\
    \n$D^k_{i,j}=min(D^{k-1}_{i,j},D^{k-1}_{i,k}+D^{k-1}_{k,j})=min(\\text{不使用顶点 }k,\\\
    text{ 使用 }k)$，对于 $k\\geq 0$，见图 4.19。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_90_0.png)\n\
    \n图 4.19：使用中间顶点（可能）缩短路径\n\n这种 DP 形式要求我们逐层填写表项。要填写表 $k$ 中的一项，我们利用表 $k-1$ 中的项。例如，要计算\
    \ $D^2_{3,4}$（表 $k=2$ 中的第 3 行、第 4 列，索引从 0 开始），我们查看 $D^1_{3,4}$ 与 $D^1_{3,2}+D^1_{2,4}$\
    \ 之和中的最小值。说明见图 4.20。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_90_1.png)\n\n\
    图 4.20：Floyd Warshall 的 DP 表\n\n朴素实现使用大小为 $O(V^3)$ 的三维矩阵 $D[k][i][j]$。不过，我们可以利用一种节省空间的技巧：去掉维度\
    \ $k$，并“即时”计算 $D[i][j]$。因此，Floyd Warshall 算法只需要 $O(V^2)$ 空间，尽管其运行时间仍为 $O(V^3)$。\n\
    \n### 其他应用\n\n**传递闭包（Warshall 算法）**\n\nStephen *Warshall* 开发了用于求解传递闭包问题的算法：给定一个图，判断顶点\
    \ *i* 是否与 *j* 连通。该变体使用逻辑按位运算符，比算术运算符快得多。初始时，如果顶点 *i* 直接连接到顶点 *j*，则 `d[i][j]` 包含\
    \ 1（真），否则为 0（假）。运行下面 O(V^3) 的 Warshall 算法后，我们可以通过检查 `d[i][j]` 来判断任意两个顶点 *i* 和\
    \ *j* 是直接还是间接连通。\n\n```text\nREP (k, 0, V - 1)\n  REP (i, 0, V - 1)\n    REP (j,\
    \ 0, V - 1)\n      d[i][j] = d[i][j] | (d[i][k] & d[k][j]);\n```\n\n**最小最大与最大最小**\n\
    \n最小最大路径问题是：在从 *i* 到 *j* 的所有可能路径中，找出最大边权的最小值。从 *i* 到 *j* 可能有很多路径。对于从 *i* 到 *j*\
    \ 的单条路径，我们选取该路径上的最大边权。然后，对于从 *i* 到 *j* 的所有可能路径，选择最大边权最小的那条。最大最小的反向问题定义类似。\n\n\
    使用 Floyd Warshall 的解法如下所示。首先，将 `d[i][j]` 初始化为边 (i,j) 的权重。这是两个直接相连顶点的默认最小最大代价。对于没有任何直接边的顶点对\
    \ i-j，设置 `d[i][j] = INF`。然后，我们尝试所有可能的中间顶点 *k*。最小最大代价 `d[i][j]` 是（其自身）与（`d[i][k]`\
    \ 或 `d[k][j]` 中的最大值）二者的最小值。\n\n```text\nREP (k, 0, V - 1)\n  REP (i, 0, V - 1)\n\
    \    REP (j, 0, V - 1)\n      d[i][j] = min(d[i][j], max(d[i][k], d[k][j]));\n\
    ```\n\n练习：在本节中，我们向你展示了如何用 Floyd Warshall 算法求解最小最大（以及最大最小）问题。不过，该问题也可以建模为 MST 问题，并使用\
    \ Kruskal 算法求解。请找出方法！\n\nFloyd Warshall 算法的编程练习：\n\n- Floyd Warshall 标准应用（用于小图上的\
    \ APSP 或 SSSP）\n  1. UVa 186 - 旅行路线（图很小）\n  2. UVa 341 - 直达旅行（图很小）\n  3. UVa 423\
    \ - MPI 漩涡（图很小）\n  4. UVa 821 - 页面跳转（ICPC 世界总决赛“最简单”的题目之一）\n  5. UVa 10075 - 航空公司（带有特殊的大圆距离，见第\
    \ 7.2 节）\n  6. UVa 10171 - 与 Miguel 教授会面（利用 APSP 信息很容易求解）\n  7. UVa 11015 - 05-32\
    \ 会合（图很小）\n  8. UVa 10246 - 阿斯泰利克斯和奥贝利克斯\n  9. UVa 10724 - 道路建设（添加一条边只会改变“少数几处”）\n\
    \  10. UVa 10793 - 兽人进攻（Floyd Warshall 简化了此问题）\n  11. UVa 10803 - 雷霆山（图很小）\n \
    \ 12. UVa 11463 - 突击队（利用 APSP 信息很容易求解）\n\n"
