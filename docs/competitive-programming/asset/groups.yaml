    ```\n\n现在，借助这个求和数组，我们可以在 $O(1)$ 内回答任意子矩形 (i, j) 到 (k, l) 的和！假设我们想知道 (1, 2) 到 (3,\
    \ 3) 的和。我们可以将求和数组分成 4 个部分并计算\n\n`arr[3][3] - arr[0][3] - arr[3][1] + arr[0][1]\
    \ = -3 - 13 - (-9) + (-2) = -9.`\n\n```text\n0 [-2] | -9 [-9]\n----------------\n\
    9   9  | -4   2\n5   6  | -11 -8\n4 [13]  -4 [-3]\n```\n\n借助这个 $O(1)$ 的 DP 公式，现在可以在\
