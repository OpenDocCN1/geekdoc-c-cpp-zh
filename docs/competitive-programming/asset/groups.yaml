    # ## 2. Forming Quiz Teams (UVa 10911)


    For the abridged problem statement and full solution code, refer to the very first
    problem mentioned in Chapter 1. The grandiose name of this problem is “Minimum
    Weighted Perfect Matching on Small General Graph”. In general, this problem is
    hard and the solution is Edmond’s Matching algorithm (see [34]) which is not easy
    to code.


    However, if the input size is small, up to \(M \le 20\), then the following DP
    + bitmasks technique can work. The idea is simple, as illustrated for \(M = 6\):
    when nothing is matched yet, the state is `bit_mask=000000`. If item 0 and item
    2 are matched, we can turn on bit 0 and bit 2 via these simple bit operations,
    i.e. `bit_mask | (1 << 0) | (1 << 2)`, thus the state becomes `bit_mask=000101`.
    Then, if from this state, item 1 and item 5 are matched, the state becomes `bit_mask=010111`.
    The perfect matching is obtained when the state is all ‘1’s, in this case: `bit_mask=111111`.


    Although there are many ways to arrive at a certain state, there are only \(O(2^M)\)
    distinct states! For each state, we record the minimum weight of previous matchings
    that must be done in order to reach this state. As we want a perfect matching,
    then for a currently ‘off’ bit \(i\), we must find the best other ‘off’ bit \(j\)
    from \([i+1 \ldots M-1]\) using one \(O(M)\) loop. This check is again done using
    bit operation, i.e. if `(!(bit_mask & (1 << j)))` — and similarly for \(j\). This
    algorithm runs in \(O(M \times 2^M)\). In problem UVa 10911, \(M = 2N\) and \(2
    \le N \le 8\), so this DP + bitmasks approach is feasible. For more details, please
    study the code shown in Section 1.2.


    Lesson: DP + bitmasks can solve small instances \(M \le 20\) of matching on general
    graph.


    Exercise: The code in Section 1.2 says that “this ‘break’ is necessary. do you
    understand why?”, with hint: “it helps reducing time complexity from \(O((2N)^2
    \times 2^{2N})\) to \(O((2N) \times 2^{2N})\)”. Answer it!


    # ## 3. Fishmonger (SPOJ 101)


    Abridged problem statement: Given number of cities \(3 \le n \le 50\), available
    time \(1 \le t \le 1000\), and two \(n \times n\) matrices (one gives a travel
    time and another gives tolls between two cities), choose a route from the first
    city 0 in such a way that one has to pay as little money for tolls as possible
    to arrive at the last city \(n - 1\) within a certain time \(t\). Output two information:
    the total tolls that is actually used and the actual travelling time.


    Notice that there are two potentially conflicting requirements in this problem.
    Requirement one is to *minimize* tolls along the route. Requirement two is to
    *ensure* that we arrive in last city within allocated time, which may mean that
    we have to pay higher tolls in some part of the path. Requirement two is a *hard*
    constraint. We must satisfy it, otherwise we do not have a solution.


    It should be quite clear after trying several test cases that greedy Single-Source
    Shortest Paths (SSSP) algorithm like Dijkstra’s (Section 4.5) — on its pure form
    — will not work as picking the shortest travel time to ensure we use less than
    available time \(t\) may lead to the smallest possible tolls. On the other hand,
    picking the cheapest tolls along the route may not ensure that we arrive within
    available time \(t\). Both requirements cannot be made independent!


    Solution: We can use the following Complete Search recurrences + top-down DP (memoization)
    `go(curCity, time_left)` that returns pairs of information (actual toll paid,
    actual time used):


    +   1. `go(any curCity, - 0) = make_pair(INF, INF);` // Cannot go further if we
    run out of time.

    +   2. `go(n - 1, ≥ 0) = make_pair(0, 0);` // Arrive at last city, no need to
    pay/travel anymore.

    +   3. In general case, `go(curCity, time_left)` is best described using the C++
    code below:'
  - "[PAGE 62]\n\n```\n```cpp\npair<int, int> go(int curCity, int time_left) { //\
    \ top-down DP, returns a pair\n    if (time_left < 0) // invalid\n        return\
    \ make_pair(INF, INF); // a trick: return large value so that this state is not\
    \ chosen\n    if (curCity == n - 1) // at last city\n        return make_pair(0,\
    \ 0); // no need to pay toll, and time needed is 0\n    if (memo[curCity][time_left].first\
    \ != -1) // visited before\n        return memo[curCity][time_left]; // simply\
    \ return the answer\n\n    pair<int, int> answer = make_pair(INF, INF);\n    for\
    \ (int neighbor = 0; neighbor < n; neighbor++) // try to go to another city\n\
    \        if (curCity != neighbor) { // force us to always move\n            pair<int,\
    \ int> nextCity = go(neighbor,\n                time_left - travelTime[curCity][neighbor]);\
    \ // go to the other city\n            // among neighboring cities, pick the one\
    \ that has minimum cost\n            if (nextCity.first + toll[curCity][neighbor]\
    \ < answer.first) {\n                answer.first = nextCity.first + toll[curCity][neighbor];\n\
    \                answer.second = nextCity.second + travelTime[curCity][neighbor];\n\
    \            }\n        }\n    memo[curCity][time_left] = answer;\n    return\
    \ answer; // store the answer to memo table as well as returning the answer to\
    \ the caller\n}\n```\n```\n\nLesson: Some graph shortest (longest) path problems\
    \ look solvable with classical (usually greedy) graph algorithms in Chapter 4,\
    \ but in reality should be solved using DP techniques⁷.\n\n# 4. ACORN (ACM ICPC\
    \ Singapore 2007 LA 4106)\n\nAbridged problem statement: Given $t$ oak trees,\
    \ the height $h$ of all trees, the height $f$ that Jayjay loses when it flies\
    \ from one tree to another, $1 \\leq t, h \\leq 2000$, $1 \\leq f \\leq 500$,\
    \ and the positions of acorns on each of oak trees: `acorn[tree][height]`, determine\
    \ the maximum number of acorns that Jayjay can collect in one single descent.\
    \ Example: if $t = 3, h = 10, f = 2$ and `acorn[tree][height]` as in Figure 3.11,\
    \ the best descent path has a total of 8 acorns (dotted line).\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_62_0.png)\n\
    \nFigure 3.11: ACM ICPC Singapore 2007 - Jayjay the Flying Squirrel Collecting\
    \ Acorns\n\n⁷This problem can also be solved with a modified Dijkstra’s."
  - "[PAGE 63]\n\n**Naïve DP Solution:** Use a memo table `total[tree][height]` that\
    \ stores the best possible acorns collected when Jayjay is on a certain tree at\
    \ certain height. Then Jayjay recursively tries to either go down (-1) unit on\
    \ the same oak tree or flies (-f) unit(s) to *t−1 other* oak trees from this position.\n\
    \nThis approach requires up to 2000 × 2000 = 4M states and has time complexity\
    \ 4M × 2000 = 8B operations. This approach is clearly TLE!\n\n**Better DP Solution:**\
    \ We can actually ignore the information: “on which tree Jayjay is currently at”\
    \ as just memoizing the best among them is sufficient. Set a table: `dp[height]`\
    \ that stores the best possible acorns collected when Jayjay is at this height.\
    \ The bottom-up DP code that requires only 2000 = 2K states and time complexity\
    \ of 2000 × 2000 = 4M is as follow:\n\n```\n```cpp\nfor (int tree = 0; tree <\
    \ t; tree++) // initialization\n    dp[h] = max(dp[h], acorn[tree][h]);\nfor (int\
    \ height = h - 1; height >= 0; height--)\n    for (int tree = 0; tree < t; tree++)\
    \ {\n        acorn[tree][height] +=\n            max(acorn[tree][height + 1],\
    \ // from this tree, +1 above\n                ((height + f <= h) ? dp[height\
    \ + f] : 0)); // best from tree at height + f\n        dp[height] = max(dp[height],\
    \ acorn[tree][height]); // update this too\n    }\nprintf(\"%d\\n\", dp[0]); //\
    \ solution will be here\n```\n```\n\n**Lesson:** When naïve DP states are too\
    \ large causing the overall DP time complexity not-doable, think of different\
    \ ways *other than the obvious* to represent the possible states. Remember that\
    \ no programming contest problem is unsolvable, the problem setter must have known\
    \ a trick.\n\n# 5. Free Parentheses (ACM ICPC Jakarta 2008 LA 4143)\n\n**Abridged\
    \ problem statement:** You are given a simple arithmetic expression which consists\
    \ of only *addition and subtraction* operators, i.e. `1 − 2 + 3 − 4 − 5`. You\
    \ are free to put any *parentheses* to the expression anywhere and as many as\
    \ you want as long as the expression is still *valid*. How many different numbers\
    \ can you make? The answer for simple expression above is 6:\n\n| Expression |\
    \ Result | Expression | Result |\n|---|---:|---|---:|\n| `1 − 2 + 3 − 4 − 5` |\
    \ −7 | `1 − (2 + 3 − 4 − 5)` | 5 |\n| `1 − (2 + 3) − 4 − 5` | −13 | `1 − 2 + 3\
    \ − (4 − 5)` | 3 |\n| `1 − (2 + 3 − 4) − 5` | −5 | `1 − (2 + 3) − (4 − 5)` | −3\
    \ |\n\nThe expression consists of only 2 ≤ *N* ≤ 30 non-negative numbers less\
    \ than 100, separated by addition or subtraction operators. There is no operator\
    \ before the first operand and after the last number.\n\nTo solve this problem,\
    \ we need to make three observations:\n\n+   1. We only need to put an open bracket\
    \ after a ‘−’ (negative) sign as it will reverse the meaning of subsequent ‘+’\
    \ and ‘−’ operators;\n+   2. You can only put *X* close brackets if you already\
    \ use *X* open brackets – we need to store this information to process the subproblems\
    \ correctly;\n+   3. The max value is 100 + 100 + ... 100 (30 times) = 3000 and\
    \ the min value is 100 − 100 − ... − 100 (29 times) = −2800 – this information\
    \ needs to be stored, as we will see below.\n\nThe DP states that are easier to\
    \ identify:\n\n+   1. ‘idx’ – the current position being processed, we need to\
    \ know where we are now.\n+   2. ‘open’ – number of open brackets, we need this\
    \ information in order to produce valid expression."
