    ## 3.2 分治法


    分治法（缩写为 D&C）是一种问题求解范式，我们通过将问题“划分”成更小的部分并“征服”它们，试图使问题变得*更简单*。步骤如下：


    - 1. 将原问题划分为*子问题*——通常是一半或接近一半，

    - 2. 为每个子问题找到（子）解——这些子问题现在更容易，

    - 3. 如果需要，合并这些子解，以产生主问题的完整解。


    我们在本书前面的章节中已经见过这种 D&C 范式：第 2.2.1 节中的各种排序算法，如快速排序、归并排序、堆排序以及二分查找，都利用了这种范式。第 2.2.2
    节和第 2.3.3 节中二叉搜索树、堆和线段树组织数据的方式，也体现了分治法的精神。


    ### 3.2.1 二分查找的有趣用法


    在本节中，我们围绕一个著名的二分查找算法来讨论 D&C 范式的精神。我们仍然将二分查找归类为“分治”范式，尽管一些文献（例如 [14]）建议应将其归类为“减治（减半）”范式，因为它实际上并不“合并”结果。我们强调这个算法，是因为许多竞赛选手知道它，但很少有人意识到它还可以以不同于普通用法的方式使用。


    ### 二分查找：普通用法


    回顾：二分查找的*普通*用法是在*静态有序数组*中查找一个元素。我们检查有序数组的中间部分，看它是否就是我们要找的元素。如果找到了，或者没有更多元素需要搜索，我们就停止。否则，我们判断答案在有序数组的左半部分还是右半部分。由于每次查询后搜索空间的大小都会减半（二分），该算法的复杂度为
    O(log n)。在第 2.2.1 节中，我们已经看到该算法有库例程，例如 C++ STL <algorithm>: lower_bound、Java Collections.binarySearch。


    这*并非*使用和应用二分查找的唯一方式。运行二分查找算法的前提——一个*静态有序数组（或向量）*——也可以在其他不常见的数据结构中找到，如下面结构化树上的根到叶路径。


    ### 在不常见数据结构上的二分查找（Thailand ICPC National Contest 2009）


    问题简述：给定一棵有 N 个顶点的带权（家族）树，N ≤ 80K，具有一个特殊性质：*顶点值从根到叶子递增*。从起始顶点 v 出发，找到权值至少为 P 且最靠近根的祖先顶点。这样的查询最多有
    Q ≤ 20K 个。


    朴素解法是对每次查询进行线性 O(N) 扫描：从给定顶点 v 开始，然后沿家族树向上移动，直到遇到第一个值 < P 的祖先。总体而言，由于有 Q 个查询，该方法运行时间为
    O(QN)，并且由于 N ≤ 80K 且 Q ≤ 20K，会超时。


    更好的解法是先存储所有 20K 个查询。然后使用 O(N) 的深度优先搜索（DFS）算法（第 4.2 节）从根开始*只遍历一次*家族树。搜索某个不存在的值，使
    DFS 探索*整棵*树，并在过程中构建一个局部的根到叶*有序*数组——这是因为根到叶路径上的顶点权值递增。然后，对于查询中询问的每个顶点，沿当前从根到该顶点的路径执行
    O(log N) 的**二分查找**，即 *lower_bound*，以获得权值至少为 P 且最靠近根的祖先。最后，进行 O(Q) 的后处理以输出结果。该方法的总体时间复杂度为
    O(Q log N)，现在可以接受了。


    ### 二分法


    到目前为止，我们看到的是二分查找在静态有序数组中查找元素的用法。然而，二分查找的**原理**也可以用于求一个可能难以通过数学计算得到其根的函数。


    示例问题：你想通过贷款买车，并希望分 *m* 个月每月支付 *d* 美元。假设汽车原价为 *v* 美元，银行在每月末对每一笔未还款项收取 *i*% 的利率。你每月必须支付多少钱
    *d*（四舍五入到小数点后 2 位）？


    假设 *d* = 576，*m* = 2，*v* = 1000，*i* = 10%。一个月后，你的贷款变为 1000 × (1.1) - 576 = 524。两个月后，你的贷款变为
    524 × (1.1) - 576 ≈ 0。


    但如果我们只知道 *m* = 2、*v* = 1000 和 *i* = 10%，如何确定 *d* = 576？换句话说，求根 *d*，使得贷款支付函数 *f*(*d*,
    2, 1000, 10) ≈ 0。*简单*的方法是运行二分法²。我们选择一个合理的范围作为起点。在这种情况下，我们想在范围 [*a*...*b*] 内找到
    *d*。*a* = 1，因为我们必须支付一些钱（至少 *d* = 1 美元）。*b* = (1 + *i*) × *v*，因为我们最早能在 *m* = 1
    时完成支付，即如果我们在一个月后恰好支付 (1 + *i*%) × *v* = (1 + 10%) × 1000 = 1100 美元。然后，我们按如下方式应用二分法得到
    *d*：


    - 如果我们每月支付 *d* = (*a* + *b*)/2 = (1 + 1100)/2 = 550.5 美元，那么两个月后我们少还了 53.95 美元，因此我们知道必须*增加*每月还款额。

    - 如果我们每月支付 *d* = (550.5 + 1100)/2 = 825.25 美元，那么两个月后我们多还了 523.025 美元，因此我们知道必须*减少*还款额。

    - 如果我们每月支付 *d* = (550.5 + 825.25)/2 = 687.875 美元，那么两个月后我们多还了 234.5375 美元，因此我们知道必须*减少*还款额。

    - …经过几次对数级迭代后，准确地说，经过 O(log₂((*b* − *a*)/ε)) 次迭代，其中 ε 是我们可以容忍的误差量。

    - 最后，如果我们每月支付 *d* = 576.190476... 美元，那么两个月后我们成功还清贷款（误差现在小于 ε），因此我们知道 *d* = 576
    是答案。


    为使二分法³有效，我们必须确保初始实数范围 [*a*...*b*] 中两个端点的函数值，即 *f*(*a*) 和 *f*(*b*)，具有相反的符号（在上述问题中成立）。本示例中的二分法只需要
    log₂ 1099/ε 次尝试。使用较小的 ε = 1e-9，这约为 40 次尝试。即使我们使用更小的 ε = 1e-15，也仍然只需要约 60 次尝试⁴。与线性尝试
    *d* = [1...1100]/ε 的每个可能值相比，二分法更高效。


    ² 我们将“二分查找原理”这一术语用于指代一种分治技术，它涉及将可能答案的范围减半。我们将“二分查找算法”（在有序数组中查找某个元素的索引）和“二分法”（求函数的根）作为该原理的实例。


    ³ 注意，二分法（使用二分查找原理）的要求与更广为人知的二分查找算法略有不同，后者需要有序数组。


    ⁴ 因此，一些竞赛程序员选择“循环 100 次”来保证终止，而不是测试误差是否已小于 ε，因为某些浮点误差可能导致死循环。


    ### 二分答案


    二分答案（Binary Search ‘the Answer’）是另一种可能非常强大的问题求解策略。下面以 UVa 714 - Copying Books
    展示该策略。


    在这个问题中，给定 *m* 本书，编号为 1, 2, ..., *m*，它们可能有不同的页数（*p₁, p₂, ..., pₘ*）。你想为每本书复印一份。你的任务是将这些书分配给
    *k* 个抄写员，*k* ≤ *m*。每本书只能分配给一个抄写员，并且每个抄写员必须得到一段*连续*的书。也就是说，存在一个递增的数列 0 = *b₀* <
    *b₁* < *b₂* < ... < *bₖ₋₁* < *bₖ* = *m*，使得第 *i* 个抄写员得到编号在 *bᵢ₋₁* + 1 和 *bᵢ* 之间的一段书。复印所有书所需的时间由被分配工作最多的抄写员决定。任务是最小化分配给单个抄写员的最大页数。


    这个问题存在动态规划解法，但已经可以通过以二分查找方式猜测答案来解决！假设 *m* = 9，*k* = 3，且 *p₁, p₂, ..., p₉* 分别为
    100、200、300、400、500、600、700、800 和 900。


    如果我们猜测 *ans* = 1000，那么问题变得“更简单”，即如果工作最多的抄写员最多只能复印 1000 页，这个问题能解决吗？答案是“否”。我们可以贪心地分配任务为：抄写员
    1 得到 {100, 200, 300, 400}，抄写员 2 得到 {500}，抄写员 3 得到 {600}，但我们还有 3 本书 {700, 800,
    900} 未分配。答案至少为 1000。


    如果我们猜测 *ans* = 2000，那么我们可以贪心地分配任务为：抄写员 1 得到 {100, 200, 300, 400, 500}，抄写员 2 得到
    {600, 700}，抄写员 3 得到 {800, 900}。我们仍有一些余量，即抄写员 1、2 和 3 分别还有 {500, 700, 300} 的未使用余量。答案至多为
    2000。


    这个 *ans* 可以在 *lo* = 1（1 页）和 *hi* = *p₁* + *p₂* + ... + *pₘ*（所有页）之间进行二分查找。


    可用分治法解决的问题的编程练习：


    - 1. UVa 679 - Dropping Balls（类似二分查找）

    - 2. UVa 714 - Copying Books（二分查找 + 贪心）

    - 3. UVa 957 - Popes（完全搜索 + 二分查找：upper_bound）

    - 4. UVa 10077 - The Stern-Brocot Number System（二分查找）

    - 5. UVa 10341 - Solve It（二分法）

    - 6. UVa 10369 - Arctic Networks（也可用 Kruskal 求 MST 解决——第 4.4 节）

    - 7. UVa 10474 - Where is the Marble?

    - 8. UVa 10611 - Playboy Chimp（二分查找）

    - 9. UVa 11262 - Weird Fence（二分查找 + 二分图匹配，见第 4.9.3 节）

    - 10. LA 2565 - Calling Extraterrestrial Intelligence Again（Kanazawa02）（二分查找 +
    数学）

    - 11. LA 2949 - Elevator Stopping Plan（Guangzhou03）（二分查找 + 贪心）

    - 12. LA 3795 - Against Mammoths（Tehran06）

    - 13. LA 4445 - A Careful Approach（完全搜索 + 二分法 + 贪心）

    - 14. IOI 2006 - Joining Paths

    - 15. IOI 2009 - Mecho（二分查找 + BFS）

    - 16. My Ancestor - Thailand ICPC National Contest 2009（题目由 Felix Halim 提供）

    - 17. 参见第 7.5 节“用于几何问题的分治法”

