    \n## 第3章\n## 问题求解范式\n\n> *如果你的手里只有一把锤子，那么一切东西看起来都像钉子*  \n> ——亚伯拉罕·马斯洛，1962年\n\n\
    本章重点介绍编程竞赛中常用的四种问题求解范式：完全搜索（Complete Search）、分治（Divide & Conquer）、贪心（Greedy）和动态规划（Dynamic\
    \ Programming）。掌握所有这些问题求解范式将帮助参赛者用合适的“工具”去处理每个问题，而不是用暴力解法“锤打”所有问题……这显然不具备竞争力。在开始阅读之前，我们建议：不要只记住本章所讲问题的解法，而要记住解决这些问题的方法和精神！\n\
    \n### 3.1 完全搜索\n\n完全搜索（Complete Search），也称为暴力法（brute force）或递归回溯（recursive backtracking），是一种通过搜索（尽可能）整个搜索空间来获得所需解的问题求解方法。\n\
    \n在编程竞赛中，当明显没有巧妙算法可用时（例如枚举 {1, 2, 3, ..., N} 的*所有*排列的问题，显然需要 *O(N!)* 次操作），或者当这些巧妙算法虽然存在但属于大材小用、而输入规模恰好很小时（例如回答第2.3.3节中的范围最小值查询问题，但作用于\
    \ *N ≤ 100* 的静态数组——用 *O(N)* 循环即可解决），参赛者*应该*采用完全搜索解法。\n\n在 ICPC 中，完全搜索应是首先考虑的解法，因为它通常容易想到，也容易编码/调试。一个*无\
    \ Bug* 的完全搜索解法在编程竞赛中*绝不*应该收到错误答案（Wrong Answer, WA），因为它会搜索*整个*搜索空间。然而，许多编程问题确实存在比完全搜索更好的解法。因此，完全搜索解法可能会收到超时（Time\
    \ Limit Exceeded, TLE）的裁决。通过适当的分析，你可以在尝试编写任何代码之前确定可能的结果（TLE 还是 AC）（第1.2.2节中的表1.4是一个很好的衡量标准）。如果完全搜索很可能通过时间限制，那就大胆去做。这样你就有了时间去处理更难的问题——那些完全搜索太慢的问题。而在\
    \ IOI 中，我们通常需要更好的问题求解技巧。\n\n有时，在一个难题的小规模实例上运行完全搜索，可以从输出中得到一些模式，利用这些模式可以设计更快的算法。完全搜索解法还可以作为更快但非平凡算法的验证器（但仅限于小规模实例）。\n\
    \n### 3.1.1 示例\n\n在本节中，我们给出这一简单范式的两个示例，并提供一些技巧，让完全搜索解法有更大机会通过所要求的时间限制。\n\n我们展示两个完全搜索的示例：一个采用迭代实现，另一个采用递归实现（回溯）。我们还会提到一些优化技巧，使某些“不可能”的情况变得可能。\n\
