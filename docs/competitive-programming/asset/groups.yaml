    | 2195 | 数零 | Dhaka06 | 素数 |\n| 2953 | 阶乘之和 | Guangzhou03 | |\n| 2955 | Vivian\
    \ 的问题 | Guangzhou03 | |\n| 3172 | 无限……的周期 | Manila06 | |\n| 3399 | 连续……之和 | Japan05\
    \ | 素数 |\n| 3904 | 瓷砖编码 | Seoul07 | 组合数学 |\n| 3997 | 数值惊喜 | Danang07 | |\n| 4104\
    \ | MODEX | Singapore07 | 模幂运算（Java BigInteger） |\n| 4203 | 三角形谜题 | Dhaka08 |\
    \ |\n| 4209 | 阻止末日 | Dhaka08 | 公式化简 + BigInt |\n| 4270 | 离散平方根 | Hefei08 | |\n\
    | 4340 | 找出恐怖分子 | Amritap08 | |\n| 4406 | 不可约分数 | K Lumpur08 | |\n| 4715 | 评级风险\
    \ | Phuket09 | Farey 序列 |\n| 4721 | Nowhere Money | Phuket09 | 斐波那契、Zeckendorf\
    \ 定理 |\n\n*表 5.1：近期 ACM ICPC 亚洲区域赛中的一些数学问题*\n\n编程竞赛中出现数学问题并不令人意外，因为计算机科学深深植根于数学。‘computer’（计算机）一词本身来自‘compute’（计算），因为计算机主要就是为帮助人类计算数字而建造的。\n\
    \n我们知道，不同国家在大学前教育中对数学训练的侧重点不同。因此，对一些 ICPC 新手参赛者来说，‘Euler Phi’（欧拉函数）是一个熟悉的术语，但对另一些人来说，这个术语听起来完全陌生。也许是因为他以前没学过，也许是因为在他的母语中这个术语叫法不同。在本章中，我们希望通过列出编程竞赛中经常出现的常见数学术语、定义、问题和算法，为读者营造一个更公平的竞争环境。\n\
    \n### 5.2 Ad Hoc 数学问题\n\n我们先从 Ad Hoc 数学问题开始本章。它们基本上是涉及数学的竞赛题，只需要不超过基础编程技巧即可解决。\n\
    \n与 Ad Hoc 数学相关的编程练习：\n\n- 1. UVa 344 - 罗马数字（罗马数字与十进制之间的转换）\n- 2. UVa 377 - 奶牛计算（四进制运算）\n\
    - 3. UVa 10346 - 彼得的烟（简单数学）\n- 4. UVa 10940 - 扔卡片 II（用暴力找规律，然后利用该规律）\n- 5. UVa\
    \ 11130 - 台球反弹（使用台球桌反射技巧）\n- 6. UVa 11231 - 黑白绘画（发现规律后使用 O(1) 公式）\n- 7. UVa 11313\
    \ - 美食游戏（类似 UVa 10346）\n- 8. UVa 11428 - 立方数（带完全搜索的简单数学）\n- 9. UVa 11547 - 自动答案（存在一行\
    \ O(1) 解法）\n- 10. UVa 11723 - 给道路编号（简单数学）\n- 11. UVa 11805 - Bafana Bafana（存在非常简单的\
    \ O(1) 公式）\n\n### 5.3 数论\n\n尽可能多地掌握*数论*领域中的主题很重要，因为如果你了解问题背后的理论，一些数学问题就会变得简单（或更容易）。否则，要么纯暴力求解会导致\
    \ TLE 响应，要么由于给定输入太大，在没有一些预处理的情况下你根本无法处理。\n\n#### 5.3.1 素数\n\n从 2 开始的自然数：{2, 3,\
    \ 4, ...}，如果它只能被 1 或自身整除，就被认为是**素数**。第一个（也是唯一一个偶数）素数是 2。接下来的素数是：3、5、7、11、13、17、19、23、29、……以及无穷多个素数（证明见\
    \ [20]）。在范围 [0...100] 内有 25 个素数，在 [0...1000] 内有 168 个素数，在 [0...7919] 内有 1000 个素数，在\
    \ [0...10000] 内有 1229 个素数，等等……\n\n素数是数论中的一个重要主题，也是许多编程问题的来源¹。在本节中，我们将讨论涉及素数的算法。\n\
    \n##### 优化的素数测试函数\n\n本节介绍的第一个算法用于测试给定自然数 *N* 是否为素数，即 `bool isPrime(N)`。最朴素的版本是按定义测试，即测试\
    \ *N* 是否能被 `divisor ∈ [2 … N−1]` 整除。这当然可行，但运行时间为 *O(N)*——就除法次数而言。这不是最好的方法，有几种可能的改进。\n\
    \n第一个改进是测试 *N* 是否能被 `divisor ∈ [2 … √N]` 整除，即当 *divisor* 已经大于 √N 时就停止。这是因为如果 *N*\
    \ 能被 *p* 整除，那么 *N = p × q*。如果 *q* 小于 *p*，那么 *q* 或 *q* 的一个素因子早就会整除 *N*。这是 *O(√N)*，已经比上一版本快得多，但仍可改进为快两倍。\n\
    \n第二个改进是测试 *N* 是否能被 `divisor ∈ [3, 5, 7 … √N]` 整除，即我们只测试到 √N 的奇数。这是因为只有一个偶数素数，即数字\
    \ 2，可以单独测试。这是 *O(√N/2)*，也同样是 *O(√N)*。\n\n第三个改进²对竞赛题来说已经足够好，就是测试 *N* 是否能被 *≤ √N\
    \ 的素因子*整除。这是因为如果一个素数 *X* 不能整除 *N*，那么测试 *X* 的倍数是否能整除 *N* 就没有意义。这比 *O(√N)* 更快，大约是\
    \ *O(⌊#primes ≤ √N⌋)*。例如，在 [1 … √(10⁶)] 中有 500 个奇数，但同一范围内只有 168 个素数。不超过 *M* 的素数个数——记为\
    \ π(*M*)——的界为 *O(M/(ln(M) − 1))*，因此这个素数测试函数的复杂度约为 *O(√N/ln(√N))*。\n\n代码见下面的下一段讨论。\n\
    \n##### 埃拉托斯特尼筛法：生成素数列表\n\n如果我们想生成范围 [0 … *N*] 内的素数列表，有一个比逐个测试该范围内每个数是否为素数更好的算法。该算法称为‘*埃拉托斯特尼*筛法’，由亚历山大的埃拉托斯特尼发明。其工作原理如下。\n\
    \n首先，它把范围内的所有数都设为‘可能是素数’，但把数字 0 和 1 设为非素数。然后，它把 2 当作素数，并划掉 2 的所有倍数³，从 2 × 2 =\
    \ 4、6、8、10、……开始，直到该倍数大于 *N*。接着，它把下一个未被划掉的数 3 当作素数，并划掉 3 的所有倍数，从 3 × 3 = 9、12、15、18、……开始。然后它取\
    \ 5，并划掉 5 的所有倍数，从 5 × 5 = 25、30、35、40、……开始。之后，在范围 [0 … *N*] 内所有未被划掉的数都是素数。该算法大约执行\
    \ *N* × (1/2 + 1/3 + 1/5 + 1/7 + … + 1/范围 (*N*) 内最后一个素数) 次操作。利用‘不超过 *n* 的素数倒数之和’，我们最终得到大约\
    \ *O(N log log N)* 的时间复杂度 [44]。\n\n由于使用筛法生成 ≤ 10K 的小素数列表很快（我们下面的库代码在竞赛设置下可达到 10⁷），我们选择对较小的素数使用筛法，而把优化的素数测试函数保留给较大的素数——见前面的讨论。合并后的代码如下：\n\
    \n```cpp\n#include <bitset> // compact STL for Sieve, more efficient than vector<bool>!\n\
    ll _sieve_size; // ll is defined as: typedef long long ll;\nbitset<10000010> bs;\
    \ // 10^7 + small extra bits should be enough for most prime-related problems\n\
    vi primes; // compact list of primes in form of vector<int>\n\nvoid sieve(ll upperbound)\
    \ { // create list of primes in [0 .. upperbound]\n  _sieve_size = upperbound\
    \ + 1; // add 1 to include upperbound\n  bs.reset(); bs.flip(); // set all numbers\
    \ to true\n  bs.set(0, false); bs.set(1, false); // except index 0 and 1\n  for\
    \ (ll i = 2; i <= _sieve_size; i++) if (bs.test(i)) {\n    // cross out multiples\
    \ of i starting from i * i!\n    for (ll j = i * i; j <= _sieve_size; j += i)\
    \ bs.set(size_t(j), false);\n    primes.push_back((int)i); // also add this to\
    \ vector that contains list of primes\n  }\n} // call this method in main method\n\
    \nbool isPrime(ll N) { // a good enough deterministic prime tester\n  if (N <=\
    \ _sieve_size) return bs.test(N); // O(1) for small primes\n  REP (i, 0, primes.size()\
    \ - 1) if (N % primes[i] == 0) return false;\n  return true; // it takes long\
    \ runtime time if N is a large prime!\n} // Note: only work for N <= (last prime\
    \ in vi \"primes\")^2\n\n// in int main()\nsieve(10000000); // can go up to 10^7\n\
    printf(\"%d\\n\", isPrime(5915587277)); // 10 digit prime\n```\n\n##### 用于寻找素因子的优化试除法\n\
    \n在数论中，我们知道素数 $N$ 只有 1 和它自身作为因子，而**合数** $N$，即非素数，可以唯一地写成其素因子的乘积。也就是说，素数是整数的乘法构建块。例如，$N\
    \ = 240 = 2 \\times 2 \\times 2 \\times 3 \\times 5 = 2^4 \\times 3 \\times 5$（后一种形式称为**素幂分解**）。\n\
    \n一种朴素算法生成素数列表（例如用筛法），并检查其中有多少个确实能整除整数 $N$——而不改变 $N$。这可以改进！\n\n更好的算法利用一种分治思想。整数\
    \ $N$ 可以表示为：$N = PF \\times N'$，其中 $PF$ 是一个素因子，$N'$ 是另一个数，即 $N/PF$——也就是说，我们可以通过取出因子\
    \ $PF$ 来减小 $N$ 的规模。我们可以持续这样做，直到最终 $N' = 1$。特殊情况是 $N$ 本身实际上就是一个素数。下面的代码模板接收一个整数\
    \ $N$，并返回素因子列表——见下面的代码。\n\n```cpp\nvi primeFactors(int N) {\n  vi factors;   \
    \        // vi \"primes\" (generated by sieve) is optional\n  int PF_idx = 0,\
    \ PF = primes[PF_idx]; // using PF = 2, 3, 4, ..., is also ok.\n  while (N !=\
    \ 1 && (PF * PF <= N)) { // stop at sqrt(N), but N can get smaller\n    while\
    \ (N % PF == 0) { N /= PF; factors.push_back(PF); } // remove this PF\n    PF\
    \ = primes[++PF_idx]; // only consider primes!\n  }\n  if (N != 1) factors.push_back(N);\
    \ // special case if N is actually a prime\n  return factors;\n}\n```\n"
