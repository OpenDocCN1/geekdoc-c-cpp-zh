    \ only $O(V)$ possible states! As we need to try $O(N)$ coins per state, the overall\
    \ time complexity of this DP solution is $O(VN)$.\n\n# Maximum Sum\n\nAbridged\
    \ problem statement: Given an n x n (1 ≤ n ≤ 100) array of integers, each ranging\
    \ from [-127, 127], find a minimum sub-rectangle that have the maximum value.\n\
    \nExample: The 4 x 4 array (n = 4) below has 15 as the maximum sub-rectangle value.\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_58_0.png)\n\nNaïvely attacking this\
    \ problem as shown below does not work as it is an $100^6$ algorithm.\n\n```\n\
    maxSubRect = -127*100*100; // lowest possible value for this problem\nfor (int\
    \ i = 0; i < n; i++) for (int j = 0; j < n; j++) // start coord\n  for (int k\
    \ = i; k < n; k++) for (int l = j; l < n; l++) // end coord\n    subRect = 0;\
    \ // sum items in this sub-rectangle\n    for (int a = i; a <= k; a++) for (int\
    \ b = j; b <= l; b++)\n      subRect += arr[a][b];\n    maxSubRect = max(maxSubRect,\
    \ subRect); // keep largest so far\n  }\n}\n```\n\nSolution: There are several\
    \ (well-known) DP solutions for static range problem. DP can work in this problem\
    \ as computing a large sub-rectangle will definitely involves computing smaller\
    \ sub-rectangles in it and such computation involves overlapping sub-rectangles!\n\
    \nOne possible DP solution is to turn this n x n array into an n x n sum array\
    \ where arr[i][j] no longer counts its own value, but the sum of all items within\
    \ sub-rectangle (0, 0) to (i, j). This can easily be done on-the-fly when reading\
    \ the input and still $O(n^2)$."
