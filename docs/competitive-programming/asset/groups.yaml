    # ## 5.5 Miscellaneous Mathematics Problems


    In this section, we list down a few more mathematics problems that have been used
    a few times in some programming contests. Mastering the solutions for these problems
    can be an advantage if you are given similar problem or problem that uses these
    knowledge as part of solution for the problem. The terms mentioned here also act
    as *keywords* for further study.


    # ### 5.5.1 Combinatorics


    **Combinatorics** [31] is a branch of *discrete* mathematics concerning the study
    of finite or **countable** discrete structures. Programming problems involving
    combinatorics usually titled ''How Many [Object]'', ''Count [Object]'', etc, although
    some problem setters choose to hide this fact from their problem title. The code
    is usually short, but finding the recurrence formula takes some mathematics brilliance
    and patience. In ICPC, if such problem exists in the given problem set, ask one
    team member to derive the formula whereas the other two concentrates on other
    problems. Quickly code the usually short formula once it is obtained.


    For example, try solving UVa 10401 - Triangle Counting. This problem has a short
    description: “given *n* rods of length 1, 2, ..., *n*, pick any 3 of them & build
    a triangle. How many distinct triangles can you make? (3 ≤ *n* ≤ 1M) ”. Note that,
    two triangles will be considered different if they have at least one pair of arms
    with different lengths. If you are lucky, you may spend only a few minutes to
    spot the pattern. Otherwise, this problem may end up unsolved by the time contest
    is over. Hint: answers for few small *n* = 3, 4, 5, 6, 7, 8, 9, and 10 are 0,
    1, 3, 7, 13, 22, 34, and 50, respectively.


    Programming Exercises related to Combinatorics (also see Fibonacci Numbers above):


    +   1. UVa 326 - Extrapolation using a Difference Table

    +   2. UVa 369 - Combinations (be careful with overflow issue)

    +   3. UVa 991 - Safe Salutations (Catalan Numbers)

    +   4. UVa 10007 - Count the Trees (Catalan Numbers, see [30] for details)

    +   5. UVa 10219 - Find the Ways! (use Java BigInteger class)

    +   6. UVa 10303 - How Many Trees (Catalan Numbers)

    +   7. UVa 10375 - Choose and Divide

    +   8. UVa 10784 - Diagonal

    +   9. UVa 10790 - How Many Points of Intersection?'
  - "[PAGE 117]\n\n+   10. UVa 10918 - Tri Tiling\n+   11. UVa 11069 - A Graph Problem\n\
    +   12. UVa 11115 - Uncle Jack ($N^D$, use Java BigInteger class)\n+   13. UVa\
    \ 11204 - Musical Instruments (only 1st choice matters)\n+   14. UVa 11310 - Delivery\
    \ Debacle\n+   15. UVa 11401 - Triangle Counting (spot the pattern, coding is\
    \ easy)\n+   16. UVa 11554 - Hapless Hedonism (similar to UVa 11401)\n\n# 5.5.2\
    \  Cycle-Finding\n\n**Cycle-finding** [32] is a problem of finding a cycle in\
    \ a sequence of iterated function values.\n\nFor any function $f:S\\to S$ and\
    \ any initial value $x_0\\in S$, the sequence of iterated function values: $x_0,x_1=f(x_0),x_2=f(x_1),\\\
    ldots,x_i=f(x_{i-1}),\\ldots$ must eventually use the same value twice (cycle),\
    \ i.e. $\\exists\\ i\\ne j$ such that $x_i=x_j$. Once this happens, the sequence\
    \ must repeat the cycle of values from $x_i$ to $x_{j-1}$. We let $\\mu$ as the\
    \ smallest index $i$ and let $\\lambda$ (the loop length) be the smallest positive\
    \ integer such that $x_\\mu=x_{\\mu+\\lambda}$. The cycle-finding is the problem\
    \ of finding $\\mu$ and $\\lambda$, given $f$ and $x_0$.\n\nFor example in UVa\
    \ 350 - Pseudo-Random Numbers, we are given a pseudo-random number generator $f(x)=(Z\\\
    times x+I)\\%M$ with $x_0=L$ and we want to find out the sequence length before\
    \ any number is repeated.\n\nA naïve algorithm that works in general for this\
    \ problem uses a data structure (e.g. C++ STL `<set>`, hash table or direct addressing\
    \ table) to store information that a number $x_i$ has been visited in the sequence\
    \ and then for each $x_i$ found later ($i>j$), we test if $x_i$ is stored in the\
    \ data structure or not. If it is, it implies that $x_j=x_i$, $\\mu=i$, $\\lambda=j-i$.\
    \ This algorithm runs in $O(\\mu+\\lambda)$ but also requires at least $O(\\mu+\\\
    lambda)$ space to store past values.\n\nThere is a better algorithm called Floyd’s\
    \ Cycle-Finding algorithm [32] that runs in the same $O(\\mu+\\lambda)$ time complexity\
    \ but only uses $O(1)$ memory space—much smaller than the naïve version. The working\
    \ C/C++ implementation of this algorithm is shown below:\n\n```\n```cpp\npair<int,\
    \ int> floyd_cycle_finding(int (*f)(int), int x0) {\n  // The main phase of the\
    \ algorithm, finding a repetition x_i = x_2i, hare speed is 2x tortoise’s\n  int\
    \ tortoise = f(x0), hare = f(f(x0)); // f(x0) is the element/node next to x0\n\
    \  while (tortoise != hare) { tortoise = f(tortoise); hare = f(f(hare)); }\n \
    \ // Find the position μ of the hare and tortoise move at the same speeds\n  int\
    \ mu = 0; hare = tortoise; tortoise = x0;\n  while (tortoise != hare) { tortoise\
    \ = f(tortoise); hare = f(hare); mu += 1; }\n  // Find the length of the shortest\
    \ cycle starting from x_mu, hare moves, tortoise stays\n  int lambda = 1; hare\
    \ = f(tortoise);\n  while (tortoise != hare) { hare = f(hare); lambda += 1; }\n\
    \  return make_pair(mu, lambda);\n}\n```\n```\n\n+   Programming Exercises related\
    \ to Cycle-Finding:\n+   \n+   1. UVa 350 - Pseudo-Random Numbers (straightforward\
    \ application of Floyd’s cycle-finding)\n+   2. UVa 408 - Uniform Generator"
