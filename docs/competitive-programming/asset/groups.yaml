  mdcn: "\n## 第 5 章：数学\n\n> 我们每天都用数学来预测天气、报时、处理金钱。\n> 数学不只是公式或方程；它是逻辑，是理性，\n> 是用头脑解开我们所知的最大谜团。\n\
    >\n> —— 电视剧《NUMB3RS》\n\n近期的 ICPC 赛事（尤其是在亚洲）通常包含一到两道数学题。本章旨在帮助参赛者应对这类问题。\n\n###\
    \ 5.1 概述与动机\n\n与上一章的图论主题一样，近期的 ICPC 题目集中也存在数学问题——每套题目至少有一道，有时可能有两道（见表 5.1）！\n\n\
