    We divide this chapter into two parts. The first part is **geometry basics** in
    Section 7.2. We review many (not all) English geometric terminologies and formulas
    that are commonly used in programming contests. The second part deals with **computational
    geometry** in Section 7.4 - 7.5, where we use *data structures and algorithms*
    which can be stated in terms of geometry.


    # 7.2 Geometry Basics


    As ACM ICPC contestants come from various nationalities, languages, and backgrounds,
    sometimes these English geometric terminologies below may look alien. Here, we
    try to provide a list – which cannot be exhaustive – to be used as a quick reference
    when contestants are given geometry problems.


    +   *   Lines


    +   1. A **Line** can be described with mathematical equation: $y = mx + c$ or
    $ax + bx + c = 0$. The $y = mx + c$ equation involves ''gradient'' / ''slope''
    $m$.

    +   Note: Be careful with vertical lines with ''infinite'' slope. Usually, we
    treat the vertical lines separately in the solution code (example of the *special
    cases* in geometry problems).

    +   2. A Line **Segment** is a line with two end points with finite length.


    +   Programming Exercises related to Lines:

    +   1. UVa 184 - Laser Lines

    +   2. UVa 270 - Lining Up

    +   3. UVa 833 - Water Falls

    +   4. UVa 10180 - Rope Crisis In Ropeland (closest point on line segment)

    +   5. UVa 10242 - Fourth Point

    +   6. UVa 10263 - Railway

    +   7. UVa 11068 - An Easy Task (line ax + by + c)

    +   8. UVa 11277 - The Silver Bullet (Complete Search + collinear test discussed
    below)

    +   9. LA 4601 - Euclid (Southeast USA Regional 2009)


    +   *   Circles (see Figure 7.1)


    +   1. In a 2-D *Cartesian* coordinate system, the **Circle** centered at $(a,
    b)$ with radius $r$ is the set of all points $(x, y)$ such that $(x - a)^2 + (y
    - b)^2 = r^2$.

    +   2. The constant $\pi$ is the **Ratio** of *any* circle''s circumference to
    its diameter in the Euclidean space. To avoid precision error, the safest value
    for programming contest is $\pi = 2 \times acos(0.0)$, unless if this constant
    is defined in the problem description!

    +   3. The **Circumference** $c$ of a circle with a **Diameter** $d$ is $c = \pi
    \times d$ where $d = 2 \times r$.

    +   4. The length of an **Arc** of a circle with a circumference $c$ and an angle
    $\alpha$ (in degrees²) is $\frac{\alpha}{360.0} \times c$.


    ²Human usually works with degrees, but many mathematical functions in programming
    languages works with radians. Check your programming language manual to verify
    this. To help with conversion, just remember that one $\pi$ radian equals to 180
    degrees.'
