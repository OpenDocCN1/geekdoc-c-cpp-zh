    \ = 0;\nwhile (1) { // this will be run max O(VE) times\n  f = 0;\n\n  queue<int>\
    \ q; map<int, int> dist; // O(E) BFS and record path p\n  q.push(s); dist[s] =\
    \ 0; // start from source\n  while (!q.empty()) {\n    int u = q.front(); q.pop();\
    \ // queue: layer by layer!\n    if (u == t) break; // modification 1: reach sink\
