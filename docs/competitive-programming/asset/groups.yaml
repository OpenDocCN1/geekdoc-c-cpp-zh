    \n然而，在所有这些细致的步骤之后，你可能仍然会得到非 AC 响应。在 ICPC 中，你和你的队伍实际上可以利用评测方的响应来决定下一步行动。在这类竞赛中积累更多经验后，你就能做出更好的判断。看看下面的练习：\n\
    \n美国计算机奥林匹克竞赛（USA Computing Olympiad）有一个非常有用的训练网站 [18]，可供你学习编程竞赛。这个网站更面向 IOI 参赛者。直接访问他们的网站，注册账户，并训练自己。\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_22_0.png)\n\n图 1.3：USACO 训练网关 [18]\n\
    \nTopCoder 会频繁举办“单轮赛”（Single Round Match，SRM）[26]，其中包含若干道应在 1–2 小时内解决的题目。随后，你有机会通过提供刁钻的测试用例来“挑战”其他参赛者的代码。这个在线评测系统使用评分系统（红色、黄色、蓝色等选手等级）来奖励真正擅长解题的参赛者，给予他们更高的评分，而不是奖励那些碰巧解决了“更多”简单题的更勤奋的参赛者。\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_22_1.png)\n\n图 1.4：TopCoder [26]\n\n\
    ## 1.3 入门：Ad Hoc 问题\n\n我们将通过介绍 ICPC 中的第一种题型来结束本章：Ad Hoc 问题。根据 USACO 训练网关 [18]，Ad\
    \ Hoc 问题是‘无法归入其他任何类别’的问题，其中每个题目描述及其对应解法都是‘独特的’。Ad Hoc 问题可以进一步分为两类：直接型——其解法只需把题目要求翻译成代码；或模拟型——必须模拟一组规则才能得到答案。\n\
    \nAd Hoc 问题几乎通常都会出现在编程竞赛中。以总共 10 道题作为基准，可能会有 1–2 道 Ad Hoc 问题。如果 Ad Hoc 问题较简单，它通常是编程竞赛中队伍最先攻克的题目。但也存在编码复杂的\
    \ Ad Hoc 问题，一些队伍会策略性地推迟到最后一个小时才解决它们。假设有 60 支队伍参赛，如果你的队伍在 ICPC 区域赛中只能做这种类型的题目，那么你们很可能处于下半区（排名\
