    \ 仍可达的所有顶点属于集合 $S$。其余顶点属于集合 $T$。这里，$S = \\{1,3\\}$，$T = \\{4,2\\}$。\n\n#### 多源多汇最大流\n\
    \n有时，我们可能有不止一个源点和/或不止一个汇点。然而，这个变体并不比原始的单源单汇最大流问题更难。创建一个超级源点 $ss$ 和一个超级汇点 $st$。用无限容量将\
    \ $ss$ 与所有源点 $s$ 相连，并用无限容量将 $st$ 与所有汇点 $t$ 相连，然后照常运行 Edmonds-Karp 算法。\n\n####\
    \ 带顶点容量的最大流\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_95_0.png)\n\n图 4.23：顶点拆分技术\n\
    \n我们还可以有一个最大流变体，其中容量不仅定义在边上，也定义在顶点上。要解决这个变体，可以使用顶点拆分技术。通过将顶点 $v$ 拆分为 $v_{in}$\
    \ 和 $v_{out}$，把入边重新分配给 $v_{in}$、出边重新分配给 $v_{out}$，并将原顶点 $v$ 的权重作为边 $(v_{in}, v_{out})$\
    \ 的权重，可以将带顶点权重的图转换为更常见的无顶点权重图。详情见图 4.23。然后照常运行 Edmonds-Karp 算法。\n\n#### 最大独立路径\n\
    \n寻找从源点 $s$ 到汇点 $t$ 的最大数量独立路径的问题可以归约为最大流问题。如果两条路径除 $s$ 和 $t$ 外不共享任何顶点（顶点不相交），则称它们是独立的。解法：从\
    \ $G$ 构造一个带顶点容量的流网络 $N = (V, E)$，其中 $N$ 是 $G$ 的完全副本，只是每个 $v \\in V$ 的容量为 1（即每个顶点只能使用一次），并且每条\
    \ $e \\in E$ 的容量也为 1（即每条边也只能使用一次）。然后照常运行 Edmonds-Karp 算法。\n\n#### 最大边不相交路径\n\n\
    寻找从 $s$ 到 $t$ 的最大数量边不相交路径与寻找最大独立路径类似。唯一的区别是这次没有任何顶点容量（即两条边不相交路径仍可共享同一个顶点）。从 $s\
    \ = 1$ 到 $t = 7$ 的独立路径与边不相交路径之间的比较见图 4.24。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_95_1.png)\n\
    \n图 4.24：最大独立路径与最大边不相交路径的比较\n"
