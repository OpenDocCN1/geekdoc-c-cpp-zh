    \ UVa 11313 - Gourmet Games (similar to UVa 10346)\n+   8. UVa 11428 - Cubes (simple\
    \ math with complete search)\n+   9. UVa 11547 - Automatic Answer (one liner O(1)\
    \ solution exists)\n+   10. UVa 11723 - Numbering Road (simple math)\n+   11.\
    \ UVa 11805 - Bafana Bafana (very simple O(1) formula exists)\n\n# ## 5.3 Number\
    \ Theory\n\nMastering as many topics as possible in the field of *number theory*\
    \ is important as some mathematics problems becomes easy (or easier) if you know\
    \ the theory behind the problems. Otherwise, either a plain brute force attack\
    \ leads to a TLE response or you simply cannot work with the given input as it\
    \ is too large without some pre-processing.\n\n# ### 5.3.1 Prime Numbers\n\nA\
    \ natural number starting from 2: {2, 3, 4, ...} is considered as a **prime**\
    \ if it is only divisible by 1 or itself. The first (and the only even) prime\
    \ is 2. The next prime numbers are: 3, 5, 7, 11, 13, 17, 19, 23, 29, ... and infinitely\
