    使用后缀树，我们还可以轻松找到 $S$ 中的最长重复子串。$S$ 的后缀树中最深的内部顶点 $X$ 就是答案。顶点 $X$ 可以通过 $O(n)$ 的树遍历找到。$X$
    是内部顶点这一事实意味着它表示字符串 $S$ 的多个后缀（叶子），并且这些后缀共享一个公共前缀（重复子串）。$X$ 是从根出发最深的内部顶点这一事实意味着其路径标签就是最长重复子串。


    例如，在图 6.2 右侧所示的 $S = ’acacag$’$ 的后缀树中，最长重复子串是 ‘aca’，因为它是那个最深的内部顶点的路径标签。


