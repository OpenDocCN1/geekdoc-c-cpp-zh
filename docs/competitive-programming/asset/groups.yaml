    \ j)，会怎样？第 2.3.3 节的解法使用线段树。你能否仅利用 DP 来解决同样的问题——假设这次没有更新操作？\n\n## 备注\n\n还有其他经典\
    \ DP 问题我们选择不在本书中涵盖，例如矩阵链乘法 [4]、最优二叉搜索树 [14]、0-1 背包 [5, 14]。不过，Floyd Warshall 算法将在第\
    \ 4.7 节讨论；字符串编辑距离、最长公共子序列（LCS）以及其他字符串上的 DP 将在第 6.3 节讨论。\n\n### 3.4.3 非经典示例\n\n\
    尽管 DP 是近年来编程竞赛中最常出现的问题类型之一，但上面那些处于*纯粹形式*的经典 DP 问题通常不会再次出现在近期的 ICPC 或 IOI 中。我们必须学习它们，以更深入地理解\
    \ DP。但一旦我们学会了，就必须继续解决许多其他非经典 DP 问题，并培养我们的“DP 技巧能力”。如下所示，有许多从简单到中级的有趣 DP 技巧。尝试在相应的在线评测系统中解决这些问题，以进一步提高你的\
    \ DP 技能。我们根据*我们*感知的难度水平（从易到难）对以下 DP 问题进行了分组和排序。每个示例中都有 DP 技巧课程。祝您愉快 :)。\n\n###\
    \ 1. 切割木棍（UVa 10003）\n\n简化问题陈述：给定一根长度 1 ≤ l ≤ 1000 的木棍，对该木棍进行 1 ≤ n ≤ 50 次切割（给出范围\
    \ (0 … l) 内的坐标）。切割成本由被切割木棍的长度决定。找出一个切割顺序，使总成本最小！\n\n示例：l = 100，n = 3，切割坐标：coord\
    \ = {25, 50, 75}（已排序）\n\n如果我们从左到右切割，那么将产生成本 = 225\n\n- 1. 在坐标 25 处切割，总成本 = 100；\n\
    - 2. 在坐标 50 处切割，总成本 = 100 + 75 = 175；\n- 3. 在坐标 75 处切割，总成本 = 175 + 50 = 225；\n\
    \n然而，最优答案是：200\n\n- 1. 在坐标 50 处切割，总成本 = 100；\n- 2. 在坐标 25 处切割，总成本 = 100 + 50 =\
    \ 150；\n- 3. 在坐标 75 处切割，总成本 = 150 + 50 = 200；\n\n解法：使用以下完全搜索递推式 + 自顶向下 DP（记忆化）：cut(left,\
    \ right)\n\n- 1. 如果 (left + 1 = right)，其中 left 和 right 是数组 coord 中的索引，则 cut(left,\
    \ right) = 0，因为我们只剩下 1 段，不再需要切割。\n- 2. 否则，尝试所有可能的切割点，并使用下面的代码选择最小成本：\n\n```cpp\n\
    // cost = initially infinity (a very large integer)\nfor (int i = left + 1; i\
    \ < right; i++) // max 50 steps\n    cost = min(cost, cut(left, i) + cut(i, right)\
    \ + (coord[right] - coord[left]));\n// after the loop above is done, we know that\
    \ cut(left, right) = cost\n```\n\n经验教训：上述完全搜索递推式只有 50×50 种可能的 left/right 索引配置（状态），运行仅需\
    \ 50 × 50 × 50 = 125K 次操作！很容易将这个完全搜索/递归回溯递推式转换为自顶向下 DP，也就是记忆化技术！\n"
