    \ 0` 最多有 20 个选择；`garment_id 1` *也*最多有 20 个选择；……；最后一个 `garment_id 19` *也*最多有 20\
    \ 个选择。因此，这样的完全搜索在最坏情况下会运行 `20 × 20 × ... × 20` 共 20 次，即 `20^20` = 一个**非常非常大**的数。如果我们*只*了解完全搜索，就无法解决这个问题。\n\
    \n### 方法 2：贪心（答案错误）\n\n既然我们希望最大化花掉的预算，为什么不选择每个 `garment_id` 中仍然符合预算的最贵型号呢？例如在上面的测试用例\
    \ A 中，我们选择 `garment_id = 0` 中花费为 8 的最贵型号 3（`money_left = 20-8 = 12`），然后选择 `garment_id\
    \ = 1` 中花费为 10 的最贵型号 2（`money_left = 12-10 = 2`），接着对于 `garment_id = 2`，由于 `money_left`\
    \ 不允许我们购买花费为 3 或 5 的其他型号，我们只能选择花费为 1 的型号 1。这一贪心策略对上面的测试用例 A+B 都“有效”，并分别得到相同的最优解\
    \ (8+10+1) = 19 和 “no solution”。它运行也非常快，最坏情况下为 20 + 20 + ... + 20 共 20 次 = 400\
    \ 次操作。\n\n但贪心在许多其他情况下并不可行。下面的测试用例就是一个反例：\n\n```text\nM = 12, C = 3\n3 models of\
    \ garment_id 0 → 6 4 8\n2 models of garment_id 1 → 5 10\n4 models of garment_id\
    \ 2 → 1 5 3 5\n```\n\n贪心策略选择 `garment_id = 0` 中花费为 8 的型号 3（`money_left = 12-8\
    \ = 4`），因此我们没有足够的钱购买 `garment_id = 1` 中的任何型号，并错误地报告 “no solution”。最优解实际上是 **(4+5+3\
    \ = 12)**，它用完了我们所有预算。\n\n### 方法 3：自顶向下 DP（通过）\n\n要解决这个问题，我们必须使用 DP。让我们看看使 DP 生效的关键要素：\n\
    \n- 1. 这个问题具有最优子结构。  \n  这体现在上面的完全搜索递推式 3 中；子问题的解是原问题解的一部分。虽然最优子结构也是使贪心算法生效的相同要素，但这个问题缺少“贪心性质”这一要素。\n\
    - 2. 这个问题具有重叠子问题。  \n  这是 DP 的关键点！搜索空间实际上并不像上面完全搜索讨论中分析的 `20^20` 那么大，因为**许多**子问题实际上是重叠的！\n\
    \n"
