    However, recent contest problems in ACM ICPC usually do not ask solutions for
    basic string processing except for the ''giveaway'' problem that all teams should
    be able to solve. Some string processing problems are solve-able with Dynamic
    Programming (DP) technique. We discuss them in Section 6.3. Some other string
    processing problems have to deal with **long** strings, thus an efficient data
    structure for string like Suffix Tree or Suffix Array must be used. We discuss
    these data structures and several specialized algorithms using these data structures
