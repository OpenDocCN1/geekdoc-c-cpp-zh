    \ variables can be easily solved.\n\nFor our motivating problem above: $25x +\
    \ 18y = 839$, we have:\n\n$a = 25, b = 18, \\text{extendedEuclid}(25, 18) = ((-5,\
    \ 7), 1)$, or\n\n$25 \\times (-5) + 18 \\times 7 = 1$.\n\nMultiplying the left\
    \ and right hand side of the equation above by $839/\\gcd(25, 18) = 839$, we have:\n\
    \n$25 \\times (-4195) + 18 \\times 5873 = 839$. Thus,\n\n$x = -4195 + (18/1)n,\\\
    \ y = 5873 - (25/1)n$.\n\nSince we need to have non-negative $x$ and $y$, we have:\n\
    \n$-4195 + 18n \\geq 0$ and $5873 - 25n \\geq 0$, or\n\n$4195/18 \\leq n \\leq\
    \ 5873/25$, or\n\n$233.05 \\leq n \\leq 234.92$.\n\nThe only possible integer\
    \ for $n$ is 234.\n\nThus $x = -4195 + 18 \\times 234 = 17$ and $y = 5873 - 25\
    \ \\times 234 = 23$,\n\ni.e. 17 apples (of 25 cents each) and 23 oranges (of 18\
