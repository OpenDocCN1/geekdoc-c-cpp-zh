    \ for other purpose than just finding (and counting) the connected components.\
    \ Here, we show how a simple tweak of `dfs(u)` can be used to *label* the components.\
    \ Typically, we ‘label’ (or ‘color’) the component by using its component number.\
    \ This variant is more famously known as ‘flood fill’.\n\n```\nvoid floodfill(int\
    \ u, int color) {\n    dfs_num[u] = color; // not just a generic DFS_BLACK\n \
    \   Trvii (AdjList[u], v) // try all neighbors v of vertex u, note that we use\
    \ our Trvii macro again\n        if (dfs_num[v->first] == DFS_WHITE) // avoid\
    \ cycle\n            floodfill(v->first, color); // v is an (neighbor, weight)\
    \ pair\n}\n\n// inside int main()\nnumComponent = 0;\nmemset(dfs_num, DFS_WHITE,\
    \ sizeof dfs_num);\nREP (i, 0, V - 1) // for each vertex u in [0..V-1], note that\
    \ we use our REP macro again\n    if (dfs_num[i] == DFS_WHITE) // if not visited\n\
    \        floodfill(i, ++numComponent);\nREP (i, 0, V - 1)\n    printf(\"Vertex\
