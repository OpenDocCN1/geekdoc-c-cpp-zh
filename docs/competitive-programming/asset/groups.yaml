    # ### 6.3.2 Longest Common Subsequence


    The Longest Common Subsequence (LCS) problem is defined as follows: Given two
    strings A and B, what is the longest common subsequence between them. For example,
    A = ‘ACAATCC’ and B = ‘AGCATGC’ have LCS of length 5, i.e. ‘AGATC’.


    The LCS solution is very similar to String Alignment solution presented earlier.
    Set the cost for mismatch as negative infinity, cost for insertion and deletion
    as 0, and the cost for match as 1. This makes the String Alignment solution to
    never consider mismatches.


    # ### 6.3.3 Palindrome


    A palindrome is a string that can be read the same way in either direction. Some
    variants of palindrome finding problems are solve-able with DP technique, as shown
    in this example: given a string of up to 1000 characters, determine the length
    of the longest palindrome that you can make from it by deleting zero or more characters.
    Examples:


    +   - ‘ADAM’ → ‘ADA’ (of length 3, delete ‘M’)

    +   - ‘MADAM’ → ‘MADAM’ (of length 5, delete nothing)

    +   - ‘NEVERODDOREVENING’ → ‘NEVERODDOREVEN’ (of length 14, delete ‘ING’)


    The DP solution: let len(l, r) be the length of the longest palindrome from string
    A[l ... r].


    ```

    `Base cases:`

    `If (l = r), then len(l, r) = 1. // true in odd-length palindrome`

    `If (l + 1 = r), then len(l, r) = 2 if (A[l] = A[r]), or 1 otherwise. // true
    in even-length palindrome`

    ```'
