    | 4657 | Top-10 | Jakarta09 | Suffix Array + Segment Tree |


    Table 6.1: Some String Processing Problems in Recent ACM ICPC Asia Regional


    # ## 6.2 Ad Hoc String Processing Problems


    We start this chapter by mentioning Ad Hoc string processing problems. They are
    contest problems involving string that require no more than basic programming
    skills. We only need to read the requirements in the problem description carefully
    and code it. Sometimes, pure character array (a.k.a. string) manipulation is sufficient.
    Sometimes, we need string libraries like C <string.h>,'
