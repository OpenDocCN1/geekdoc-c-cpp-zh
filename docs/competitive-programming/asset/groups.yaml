    # ### 1.2.1\quad Tip 1: Quickly Identify Problem Types


    In ICPCs, the contestants will be given a set of problems (≈ 7-11 problems) of
    varying types. From our observation of recent ICPC Asia Regional problem sets,
    we can categorize the problems types and their rate of appearance as in Table
    1.1. For IOI, please refer to IOI syllabus 2009 [8] and [28].


    | No | Category | Sub-Category | In This Book | Appearance Frequency |

    |---:|---|---|---|---|

    | 1. | Ad Hoc | Straightforward | Section 1.2 | 1-2 |

    |  |  | Simulation | Section 1.3 | 0-1 |

    | 2. | Complete Search | Iterative | Section 3.1 | 0-1 |

    |  |  | Backtracking | Section 3.1 | 0-1 |

    | 3. | Divide & Conquer |  | Section 3.2 | 0-1 |

    | 4. | Greedy | Classic | Section 3.3.1 | ≈0 |

    |  |  | Original | Section 3.3.2 | 1 |

    | 5. | Dynamic Programming | Classic | Section 3.4.2 | ≈0 |

    |  |  | Original | Section 3.4.3 | 1-2 (can go up to 3) |

    | 6. | Graph |  | Chapter 4 | 1-2 |

    | 7. | Mathematics |  | Chapter 5 | 1-2 |

    | 8. | String Processing |  | Chapter 6 | 1 |

    | 9. | Computational Geometry |  | Chapter 7 | 1 |

    | 10. | Some Harder Problems |  |  | 0-1 |

    |  |  |  | Total in Set | 7-16 (usually ≤ 11) |


    *Table 1.1: Recent ACM ICPC Asia Regional Problem Types*


    The classification in Table 1.1 is adapted from [18] and by no means complete.
    Some problems, e.g. ‘sorting’, are not classified here as they are ‘trivial’ and
    only used as ‘sub-routines’ in a ‘bigger’ problem. We do not include ‘recursion’
    as it is embedded in other categories. We also omit ‘data structure related problems’
    and such problems will be categorized as ‘Ad Hoc’.


    Of course there can be a mix and match of problem types: one problem can be classified
    into more than one type, e.g. Floyd Warshall’s is either a solution for graph
    problem: All-Pairs Shortest Paths (APSP, Section 4.7) or a Dynamic Programming
    (DP) algorithm (Section 3.4).


    In the future, these classifications may grow or change. One significant example
    is DP. This technique was not known before 1940s, not frequently used in ICPCs
    or IOIs before mid 1990s, but it is a must today. There are ≥ 30 DP problems (out
    of 11) in recent ICPC World Finals 2010.


    As an exercise, read the UVa [17] problems shown in Table 1.2 and determine their
    problem types. The first one has been filled for you. Filling this table is easy
    after mastering this book.


    | UVa | Title | Problem Type | Hint |

    |---:|---|---|---|

    | 10360 | Rat Attack | Complete Search or Dynamic Programming | Section 3.1 or
    3.4 |

    | 10341 | Solve It |  | Section 3.2 |

    | 11292 | Dragon of Loowater |  | Section 3.3 |

    | 11450 | Wedding Shopping |  | Section 3.4 |

    | 11635 | Hotel Booking |  | Section 4.3 + 4.5 |

    | 11506 | Angry Programmer |  | Section 4.8 |

    | 10243 | Fire! Fire!! Fire!!! |  | Section 4.9.1 |

    | 10717 | Mint |  | Section 5.3.2 |

    | 11512 | GATTACA |  | Section 6.4 |

    | 10065 | Useless Tile Packers |  | Section 7.3 |


    *Table 1.2: Exercise: Classify These UVa Problems*'
