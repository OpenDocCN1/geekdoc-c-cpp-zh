    \ far\n  }\n```\n\n解法：对于静态范围问题，有几种（众所周知的）DP 解法。DP 可以用于这个问题，因为计算一个较大的子矩形必然涉及计算其中的较小子矩形，而这种计算涉及重叠的子矩形！\n\
    \n一种可能的 DP 解法是将这个 n x n 数组转换为 n x n 求和数组，其中 arr[i][j] 不再表示其自身的值，而是子矩形 (0, 0) 到\
    \ (i, j) 内所有元素的和。这可以在读取输入时轻松地即时完成，并且仍为 $O(n^2)$。\n\n```cpp\nscanf(\"%d\", &n);\n\
