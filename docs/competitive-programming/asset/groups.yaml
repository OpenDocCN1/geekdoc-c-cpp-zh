  - '[PAGE 40]


    # 3.1.2 Tips


    The biggest gamble in writing a Complete Search solution is whether it will be
    able to pass the Time Limit. If it is 1 minute and your program currently runs
    in 1 minute 5 seconds, you may want to tweak the “critical code” of your program
    first rather than painfully redo the problem with a faster algorithm – which may
    not be trivial to design.


    Here are some tips that you may want to consider when designing your solution,
    especially a Complete Search solution, to give it a higher chance for passing
    the Time Limit.


    # Tip 1: Generating versus Filtering


    Programs that generate lots of candidate solutions and then choose the ones that
    are correct (or remove the incorrect ones) are called ‘filters’ – recall the naïve
    8-queens solver with 8⁸ time complexity. Those that hone in exactly to the correct
    answer without any false starts are called ‘generators’ – recall the improved
    8-queens solver with 8! complexity plus diagonal checks.


    Generally, filters are easier to code but run slower. Do the math to see if a
    filter is good enough or if you need to create a generator.


    # Tip 2: Prune Infeasible Search Space Early


    In generating solutions (see tip 1 above), we may encounter a partial solution
    that will never lead to a full solution. We can prune the search there and explore
    other parts. For example, see the diagonal check in 8-queens solution above. Suppose
    we have placed a queen at row[1] = 2, then placing another queen at row[2] = 1
    or row[2] = 3 will cause a diagonal conflict and placing another queen at row[2]
    = 2 will cause a row conflict. Continuing from any of these branches will never
    lead to a valid solution. Thus we can prune these branches right at this juncture,
    concentrate on only valid positions of row[2] = {4, 5, 6, 7, 8}, thus saving overall
    runtime.


    # Tip 3: Utilize Symmetries


    Some problems have symmetries and we should try to exploit symmetries to reduce
    execution time! In the 8-queen problem, there are 92 solutions but there are only
    12 unique (or fundamental) solutions as there are rotations and reflections symmetries
    in this problem [35]. You can utilize this fact by only generating the 12 unique
    solutions and, if needed, generate the whole 92 by rotating and reflecting these
    12 unique solutions.


    # Tip 4: Pre-Computation a.k.a. Pre-Calculation


    Sometimes it is helpful to generate tables or other data structures that enable
    the fastest possible lookup of a result - prior to the execution of the program
    itself. This is called Pre-Computation, in which one trades memory/space for time.


    Again using the 8-queens problem above. If we know that there are only 92 solutions,
    then we can create a 2-dimensional array `int solution[92][8]` and then fill it
    with all 92 valid permutations of 8 queens row positions! That’s it, we create
    a generator program (which takes some runtime) to fill this 2-D array solution,
    but afterwards, we generate a new program and submit the code that just prints
    out the correct permutations with 1 queen at (a, b) (very fast).'
  - '[PAGE 41]


    # Tip 5: Try Solving the Problem Backwards


    Surprisingly, some contest problems seem far easier when they are solved backwards
    than when they are solved using a frontal attack. Be on the lookout for processing
    data in reverse order or building an attack that looks at the data in some order
    other than the obvious.


    This tip is best shown using an example: UVa 10360 - Rat Attack. Abridged problem
    description: Imagine a 2-D array (up to 1024 × 1024) containing rats. There are
    n ≤ 20000 rats at some cells, determine which cell (x, y) should be gas-bombed
    so that the number of rats killed in square box (x − d, y − d) to (x + d, y +
    d) is maximized. The value d is the power of the gas-bomb (d is up to 50), see
    Figure 3.2.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_41_0.png)


    Figure 3.2: UVa 10360 - Rat Attack Illustration with d = 1


    First option is to attack this problem frontally: Try bombing each of the 1024²
    cells and see which one is the most effective. For each bombed cell (x, y), we
    need to do O(d²) scans to count the number of rats killed within the square-bombing
    radius. For the worst case when the array has size 1024² and d = 50, this takes
    1024² × 50² = 261M operations. Clearly TLE!


    Second option is to attack this problem backwards: Create an array int killed[1024][1024].
    For each n rat population at coordinate (x, y), add the value of array killed[i][j]
    with the number of rats in (x, y) that will be killed if a bomb is placed in (i,
    j) and (i, j) is within the square-bombing radius (i.e. |i − x| ≤ d and |j − y|
    ≤ d). This pre-processing takes O(n × d²) operations. Then, to determine the optimal
    bomb placing position, we find the coordinate with the highest entry in array
    killed, which can be done in O(n²) operations. This backwards approach only requires
    20000 × 50² + 20000² = 51M operations for the worst test case (n = 20000, d =
    50) and approximately 51 times faster than the frontal attack!


    # Tip 6: Optimizing Source Code


    There are many tricks that you can use to optimize your code. Understanding computer
    hardware, especially I/O, memory, and cache behavior, can help you design a better
    program. Some examples:


    +   1. Use the faster C-style scanf/printf rather than cin/cout.

    +   2. Use the expected O(n log n) but cache-friendly quicksort (built-in in C++
    STL sort as part of ‘introsort’) rather than the true O(n log n) but not (cache)
    memory friendly mergesort.

    +   3. Access a 2-D array in a row major fashion (row by row) rather than column
    by column.

    +   4. Bitwise manipulation on integer is faster than using an array of bits (see
    Section 3.4.3), etc.

    +   5. Use STL `<bitset>` rather than `vector<bool>` for Sieve of Eratosthenes
    (see Section 5.3.1).'
  - '[PAGE 42]


    +   6. Declare a bulky data structure just once by setting it to have global scope,
    so you do not have to pass the structure as function arguments.


    +   7. Allocate memory just once, according to the largest possible input in the
    problem description, rather than re-allocating it for every test case in a multiple-input
    problem.


    Browse the Internet or reference books to find more information on how to speed
    up your code.


    # Tip 7: Use Better Data Structure & Algorithm :)


    No kidding. Using better data structures and algorithms always outperforms any
    optimization tips mentioned in Tips 1-6 above. If all else fails, abandon Complete
    Search approach.


    Programming Exercises solvable using Complete Search:


    +   - Iterative

    +       1. UVa 154 - Recycling (try all combinations)

    +       2. UVa 441 - Lotto (6 nested loops!)

    +       3. UVa 639 - Don''t Get Rooked (generate 2^16 possible combinations, prune
    invalid ones)

    +       4. UVa 725 - Division (elaborated in this section)

    +       5. UVa 10360 - Rat Attack (this problem is also solvable using 1024^2
    DP range sum)

    +       6. UVa 10662 - The Wedding (3 nested loops!)

    +       7. UVa 11242 - Tour de France (iterative complete search + sorting)

    +       8. UVa 11804 - Argentina (5 nested loops!)

    +   - Recursive Backtracking

    +       1. UVa 193 - Graph Coloring (Maximum Independent Set)

    +       2. UVa 222 - Budget Travel (input not large)

    +       3. UVa 524 - Prime Ring Problem (also see Section 5.3.1)

    +       4. UVa 624 - CD (input size is small, use backtracking; also solve-able
    with DP)

    +       5. UVa 628 - Passwords (backtracking)

    +       6. UVa 729 - The Hamming Distance Problem (backtracking)

    +       7. UVa 750 - 8 Queens Chess Problem (solution already shown in this section)

    +       8. UVa 10285 - Longest Run on a Snowboard (backtracking, also solve-able
    with DP)

    +       9. UVa 10496 - Collecting Beepers (small TSP instance)

    +       10. LA 4793 - Robots on Ice (World Finals Harbin10, recommended problem
    for practice)


    Problem I - ''Robots on Ice'' in the recent ACM ICPC World Final 2010 can be viewed
    as a ''tough test on pruning strategy''. The problem is simple: Given an M x N
    board with 3 check-in points {A, B, C}, find a Hamiltonian path of length (M x
    N) from coordinate (0, 0) to coordinate (0, 1). This Hamiltonian path must hit
    check point {A, B, C} at one-fourth, one-half, and three-fourths of the way through
    its tour, respectively. Constraints: 2 <= M, N <= 8.


    A naive recursive backtracking algorithm will get TLE. To speed up, we must prune
    the search space if: 1). it does not hit the appropriate target check point at
    1/4, 1/2, or 3/4 distance; 2). it hits target check point earlier than the target
    time; 3). it will not be able to reach the next check point on time from the current
    position; 4). it will not be able to reach final point (0, 1) as the current path
    blocks the way. These 4 pruning strategies are sufficient to solve LA 4793.'
