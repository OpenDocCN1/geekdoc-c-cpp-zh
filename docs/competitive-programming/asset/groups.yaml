    \ we have a few other rules of thumb:\n\n- $2^{10} \\approx 10^3$, $2^{20} \\\
    approx 10^6$.\n- Max 32-bit signed integer: $2^{31}-1 \\approx 2 \\times 10^9$\
    \ (or up to $\\approx 9$ decimal digits);  \n  Max 64-bit signed integer (long\
    \ long) is $2^{63}-1 \\approx 9 \\times 10^{18}$ (or up to $\\approx 18$ decimal\
    \ digits).  \n  Use ‘unsigned’ if slightly higher positive number is needed $[0\
    \ \\ldots 2^{64}-1]$.  \n  If you need to store integers $\\ge 2^{64}$, you need\
    \ to use the Big Integer technique (Section 5.4).\n- Program with nested loops\
    \ of depth $k$ running about $n$ iterations each has $O(n^k)$ complexity.\n- If\
    \ your program is recursive with $b$ recursive calls per level and has $L$ levels,\
    \ the program has roughly $O(b^L)$ complexity. But this is an upper bound. The\
    \ actual complexity depends on what actions are done per level and whether some\
    \ pruning is possible.\n- Dynamic Programming algorithms which fill a 2-D matrix\
    \ in $O(k)$ per cell are in $O(k \\times n^2)$.\n- The best time complexity of\
