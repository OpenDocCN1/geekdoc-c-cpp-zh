    \n## 4.9.3 二分图\n\n二分图是一种具有以下特征的特殊图：顶点集合 V 可以划分为两个不相交的集合 V₁ 和 V₂，并且所有边 (u, v) ∈\
    \ E 都具有 u ∈ V₁ 且 v ∈ V₂ 的性质。最常见的应用是（二分图）匹配问题，如下所示。\n\n### 二分图最大基数匹配\n\n引例（来自 TopCoder\
    \ [26] Open 2009 Qualifying 1）：将一组数字两两配对，使得每一对的和都是质数。例如，给定数字 {1, 4, 7, 10, 11,\
    \ 12}，我们可以有：{1 + 4 = 5}、{1 + 10 = 11}、{1 + 12 = 13}、{4 + 7 = 11}、{7 + 10 = 17}\
    \ 等。\n\n实际任务：给定一个数字列表 N，返回 N 中所有能够与 N[0] 成功配对、并作为某个完整配对方案一部分的元素列表（即 N 中的每个元素 a\
    \ 都与 N 中唯一的另一个元素 b 配对，使得 a + b 为质数），按升序排序。上述例子的答案是 {4, 10}——不包括 12。这是因为，尽管 (1\
    \ + 12) 是质数，但剩下的 4 个数将无法配对；而如果我们将 (1 + 4) 配对，则有 (7 + 10)、(11 + 12)；如果我们将 (1 +\
    \ 10) 配对，则有 (4 + 7)、(11 + 12)。\n\n约束条件：列表 N 包含偶数个元素（在 [2...50] 范围内，含端点）。N 的每个元素都将在\
    \ 1 到 1000 之间（含端点）。N 的每个元素都互不相同。\n\n尽管这个问题涉及寻找质数，但它并不是纯数学问题，因为 N 中的元素不超过 1K——1000\
    \ 以下的质数并不多。问题在于，我们不能进行完全搜索式配对，因为第一对有 50C₂ 种可能，第二对有 48C₂ 种可能，……，直到最后一对有 2C₂ 种可能。DP\
    \ + 位掩码技术也不可行，因为 50! 太大了。\n\n解决这个问题的关键在于意识到，这种配对或匹配是在二分图上进行的！要得到质数，我们需要将 1 个奇数\
    \ + 1 个偶数相加，因为 1 个奇数 + 1 个奇数 = 偶数，而偶数不是质数；1 个偶数 + 1 个偶数 = 也是偶数，也不是质数。因此，我们可以将奇数/偶数分别划分到\
    \ set1/set2，并在 set1[i] + set2[j] 为质数时，从 set1 向 set2 连边。\n\n构建出这个二分图后，解法就很简单了：如果\
    \ set1 和 set2 的大小不同，则无法完成完整配对。否则，如果两个集合的大小都是 n/2，则尝试将 set1[0] 与 set2[k] 匹配，其中\
    \ k = [0...n/2 − 1]，并对剩余部分执行二分图最大基数匹配（MCBM）。这个问题可以用最大流算法解决，例如 O(VE²) 的 Edmonds-Karp\
    \ 算法。如果我们还能得到 n/2 − 1 个匹配，则将 set2[k] 加入答案。对于这个测试用例，答案是 {4, 10}。\n\n通过设置一个连接到 set1\
    \ 中所有顶点的虚拟源点，以及一个连接到 set2 中所有顶点的虚拟汇点，可以将二分图匹配归约为最大流问题。通过将该图中所有边的容量设为 1，我们迫使 set1\
    \ 中的每个顶点只能与 set2 中的一个顶点匹配。最大流将等于原图上可能的最大匹配数（见图 4.27）。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_101_0.png)\n\
    \n图 4.27：二分图匹配可以归约为最大流问题\n\n### 二分图最大权独立集\n\n引例：假设有两个用户：用户 A 和用户 B。每个用户都有若干事务，例如\
    \ A 有 \\(\\{A_1,A_2,\\ldots,A_n\\}\\)，并且每个事务都有一个权重，例如 \\(W(A_1), W(A_2)\\) 等。这些事务使用共享资源，例如事务\
    \ A1 使用 \\(\\{r_1,r_2\\}\\)。对资源的访问是排他的，例如，如果选择了 A1，那么用户 B 的任何使用 \\(r_1\\) 或 \\\
    (r_2\\) 的事务都不能被选择。保证用户 A 的两个请求永远不会使用同一资源，但来自不同用户的两个请求可能会竞争同一资源。我们的任务是最大化所选事务的权重之和！\n\
    \n让我们对这个题目做几个关键词分析。如果选择了用户 A 的某个事务，那么用户 B 中共享部分或全部资源的那些事务就不能被选择。这是 **独立集** 的一个强烈提示。并且，由于我们希望最大化所选事务的权重之和，所以这是\
    \ **最大权独立集（MWIS）**。又因为只有两个用户（两个集合），并且题目保证同一用户内部的事务之间不存在资源冲突，所以我们可以确定输入图是一个 **二分图**。因此，这个问题实际上是\
    \ **二分图上的 MWIS**。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_101_1.png)\n\n图\
    \ 4.28：二分图上 MWIS 的示例（来自 LA 3487 [11]）\n\n让我们看图 4.28 的示例说明。我们有两个用户。我们将 A 的所有事务列在左边，将\
    \ B 的所有事务列在右边。如果两个事务共享相似的资源，我们就在它们之间连一条边。例如，事务 A1 使用资源 1，事务 B1 也使用资源 1。因为 A1（权重为\
    \ 45）和 B1（权重为 54）共享同一资源，所以我们在它们之间连一条边。事实上，还有两条边：A2 -- B2 和 A3 -- B3。事务 B4 没有边，因为它使用的资源\
    \ \\(\\{4,5\\}\\) 没有与任何其他事务共享。在这个实例中，\\(\\{B_1(54), A_2(51), A_3(62), B_4(2)\\\
    }\\) 是 MWIS，总权重 = 54+51+62+2 = 169。\n\n为了求解非平凡情况，我们必须将这个问题归约为最大流问题。对于用户 A，我们将原始顶点代价（选择该顶点的权重）作为从源点到该顶点的容量；对于用户\
    \ B，将其作为从该顶点到汇点的容量。然后，对于集合 A 和 B 之间的任意边，赋予‘无限’容量。见图 4.29。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_102_0.png)\n\
    \n图 4.29：将二分图上的 MWIS 归约为最大流问题（来自 LA 3487 [11]）\n\n然后，我们在这个流图上运行 \\(O(VE^2)\\)\
    \ 的 Edmonds-Karp 算法。最大流算法终止后，解为 {s 分量 ∩ 用户 A 中的顶点} + {t 分量 ∩ 用户 B 中的顶点}，其中 s 分量（t\
    \ 分量）是运行最大流后仍可到达源点（汇点）的顶点。在图 4.30 中，解为：{A1(20), A2(18), A4(54)} + {B3(47)} = 139。这个值也可以通过以下方式得到：MWIS\
    \ = 总权重 − 最大流 = 259 − 120 = 139。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_102_1.png)\n\
    \n图 4.30：图 4.29 的解（来自 LA 3487 [11]）\n\n与二分图相关的编程练习：\n\n- 二分图最大基数匹配（图建模 + 最大流）\n\
    \  - UVa 670 - The Dog Task\n  - UVa 753 - A Plug for Unix\n  - UVa 10080 - Gopher\
    \ II\n  - UVa 10092 - The Problem with the Problemsetter\n  - UVa 10735 - Euler\
    \ Circuit\n  - UVa 11045 - My T-Shirt Suits Me\n  - UVa 11418 - Clever Naming\
    \ Patterns\n  - TopCoder Open 2003 Semifinal Round 4 - Division 1, Level 3 - RookAttack\n\
    \  - TopCoder Open 2009: Qualifying 1 - Prime Pairs\n  - LA 4407 - Gun Fight\n\
    - 二分图中的最大权独立集\n  - UVa 11159 - Factors and Multiples（与上述二分图匹配类似的解法）\n  - LA 3487\
    \ - Duopoly（也见于 Zhejiang Online Judge 题目 2129）\n- 二分图中的最大顶点覆盖\n  - UVa 11419 -\
    \ SAM I AM（最小顶点覆盖）\n  - LA 2523 - Machine Schedule（也见于 PKU 1325 - Machine Schedule）\n\
    \  - PKU 2226 - Muddy Fields\n\n## 4.10 本章注释\n\n请注意，近来的 ICPC 和 IOI 通常不会只要求参赛者解决涉及这些图算法纯形式的问题。新问题通常要求参赛者组合两种或更多算法，或者将算法与某些高级数据结构结合起来，例如在同一问题中同时使用\
    \ BFS 和 Dijkstra 算法，以计算同一张图在带权和无权版本上的最短路径；将 DAG 中的最长路径与线段树数据结构结合，等等。\n\n本章虽然已经相当长，但仍然省略了许多已知的图算法和图问题，这些问题有时会在\
    \ ICPC 或 IOI 中考查，即：用于求强连通分量的 **Kosaraju** 算法、最小生成树的 **Prim** 和 **Boruvka** 算法、第\
    \ k 短路径、**Euler** 路径/回路、**Fleury** 算法、**中国邮递员问题**、**哈密顿**路径/回路、双调旅行商问题、树形图、**Tarjan**\
    \ 离线最近公共祖先、最大流的 **Dinic** 或 **Push Relabel** 算法、循环流问题、**Kuhn-Munkres（匈牙利）**匹配算法、**Edmonds**\
    \ 花收缩，等等。\n\n如果你想提高在 ACM ICPC 中的获胜机会，请花些时间在本章之外学习它们。这些较难的内容很少出现在 *区域赛* 中；如果出现，它们通常会成为\
    \ *决胜题*。像这样的较难图问题更有可能出现在 ACM ICPC World Finals 级别。\n\n然而，对于 IOI 参赛者来说，IOI 大纲中的大多数图论内容已在本章中涵盖。\n\
    \n本章大约讨论了 **173 道编程练习**。\n\n"
