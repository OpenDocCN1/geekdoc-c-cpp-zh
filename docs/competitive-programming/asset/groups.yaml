  mdcn: "\n让我们验证这个问题是否具有重叠子问题。假设某个 `garment_id` 中有 2 个模型具有相同价格 $p$。那么，完全搜索在任选其中一个模型后，都会转到同一个子问题\
    \ `shop(money_left - p, garment_id + 1)`！类似地，如果 `money_left` 与所选模型价格的某种组合导致 `money_left₁\
    \ - p₁ = money_left₂ - p₂`，也会出现这种情况。同一个子问题会被计算多次！效率低下！\n\n那么，这个问题中有多少个不同的子问题（又称状态）？答案是仅有\
    \ $201 \\times 20 = 4,020$ 个。因为 `money_left` 只有 201 种可能（从 0 到 200，含端点），`garment_id`\
    \ 只有 20 种可能（从 0 到 19，含端点）。每个子问题只需计算一次。如果能保证这一点，我们就能更快地解决这个问题。\n\n这个 DP 解法的实现出奇地简单。如果我们已经有了递归回溯（前面展示的递推关系），可以通过执行以下少量额外步骤来实现自顶向下\
    \ DP：\n\n- 1. 用占位值（例如‘-1’）初始化一个 DP‘memo’表。DP 表的维度必须等于不同子问题的大小。\n- 2. 在递归函数开始时，只需检查当前状态之前是否已经计算过。\n\
    \  - (a) 如果是，直接从 DP memo 表返回值，O(1)。\n  - (b) 如果不是，按常规计算（只计算一次），然后将计算值存入 DP memo\
    \ 表，以便后续对此子问题的调用能快速完成。\n\n分析 DP 解法很容易。如果它有 $M$ 个状态，则至少需要 $O(M)$ 的内存空间。如果填充该状态中的一个单元格需要\
    \ $O(k)$ 步，那么总体时间复杂度为 $O(kM)$。上述 UVa 11450 - Wedding Shopping 问题有 $M = 201 \\\
    times 20 = 4020$，且 $k = 20$（因为对于每个 `garment_id`，我们最多需要遍历 20 个模型）。因此时间复杂度为 4020\
    \ × 20 = 80400，非常容易处理。下面给出我们的代码作为示例，尤其面向那些以前从未编写过自顶向下 DP 算法的人。\n\n```cpp\n/* UVa\
    \ 11450 - Wedding Shopping */\n#include <iostream>\n#include <algorithm>\n#include\
    \ <string.h>\nusing namespace std;\n\nint M, C, K, price[25][25]; // price[garment_id\
    \ (<= 20)][model (<= 20)]\nint memo[210][25]; // dp table memo[money_left (<=\
    \ 200)][garment_id (<= 20)]\n\nint shop(int money_left, int garment_id) {\n  \
    \  if (money_left < 0)\n        return -1000000000; // fail, return a large negative\
    \ number (1B)\n    if (garment_id == C) // we have bought last garment\n     \
    \   return M - money_left; // done, return this value\n    if (memo[money_left][garment_id]\
    \ != -1) // if this state has been visited before\n        return memo[money_left][garment_id];\
    \ // simply return it\n    int max_value = -1000000000;\n    for (int model =\
    \ 1; model <= price[garment_id][0]; model++) // try all possible models\n    \
    \    max_value = max(max_value, shop(money_left - price[garment_id][model], garment_id\
    \ + 1));\n    return memo[money_left][garment_id] = max_value; // assign max_value\
    \ to dp table + return it!\n}\n\nint main() { // easy to code if you are already\
    \ familiar with it\n  int i, j, TC, score;\n\n  scanf(\"%d\", &TC);\n  while (TC--)\
    \ {\n    scanf(\"%d %d\", &M, &C);\n    for (i = 0; i < C; i++) {\n      scanf(\"\
    %d\", &K);\n      price[i][0] = K; // to simplify coding, we store K in price[i][0]\n\
    \      for (j = 1; j <= K; j++)\n        scanf(\"%d\", &price[i][j]);\n    }\n\
    \n    memset(memo, -1, sizeof memo); // initialize DP memo table\n    score =\
    \ shop(M, 0); // start the top-down DP\n    if (score < 0)\n      printf(\"no\
    \ solution\\n\");\n    else\n      printf(\"%d\\n\", score);\n  }\n} // return\
    \ 0;\n```\n\n### 方法 4：自底向上 DP（已通过）\n\n还有另一种编写 DP 解法的方式，称为**自底向上 DP**。这实际上是 DP\
    \ 的‘真正形式’，又称‘表格法’。构建自底向上 DP 的步骤如下：\n\n- 1. 像上面的自顶向下 DP 一样，确定完全搜索的递推关系。\n- 2. 用已知初始值初始化\
    \ DP 表的部分内容。\n- 3. 根据完全搜索的递推关系确定如何填充 DP 表的其余部分，通常需要使用一个或多个嵌套循环来完成。\n\n对于上述 UVa\
    \ 11450，我们可以如下编写自底向上 DP。为便于讨论，请参见图 3.8，它展示了上面的测试用例 A。\n\n首先，建立一个大小为 201 × 20 的布尔矩阵\
    \ can_reach[money_left][garment_id]。起初，只有通过购买 garment_id = 0 的任意模型可到达的单元格为 true。参见图\
    \ 3.8 最左侧，其中第 0 列只有行‘20-6 = 14’、‘20-4 = 16’和‘20-8 = 12’为 true。\n\n然后，我们从第二件衣物循环到最后一件衣物。如果可以从上一列的任意状态到达该状态，即从状态\
    \ can_reach[a + 前一个 garment_id 的任意模型价格][b - 1] 到达，则将 can_reach[a][b] 设为 true。参见图\
    \ 3.8 中间，例如，can_reach[11][1] 可以通过在 garment_id = 1 中购买价格为 5 的模型，从 can_reach[11\
    \ + 5][0] 到达；can_reach[2][1] 可以通过在 garment_id = 1 中购买价格为 10 的模型，从 can_reach[2\
    \ + 10][0] 到达；等等。\n\n最后，答案可以在最后一列中找到。找到该列中离索引 0 最近且被设为 true 的单元格。在图 3.8 最右侧，单元格\
    \ can_reach[1][2] 就是答案。这意味着我们可以通过购买各种衣物模型的组合，以某种方式到达该状态（money_left = 1）。最终答案实际上是\
    \ M - money_left，或者在此例中为 20-1 = 19。如果最后一列中没有单元格被设为 true，则答案为“无解”。\n\n### 自顶向下与自底向上\
    \ DP 的对比\n\n如你所见，自底向上 DP 表的填充方式不如自顶向下 DP 直观，因为它需要对我们在前几节中推导出的完全搜索递推关系中的符号进行一些‘反转’。然而，我们知道有些程序员实际上觉得自底向上版本更直观。使用哪种\
    \ DP 风格由你决定。为了帮助你决定在遇到 DP 解法时应采用哪种风格，我们在表 3.1 中给出了自顶向下与自底向上 DP 的权衡比较。\n\n| 自顶向下\
    \ | 自底向上 |\n|---|---|\n| **优点：**<br>1. 它是从普通完全搜索递归的自然转换<br>2. 仅在必要时计算子问题（有时这更快）\
    \ | **优点：**<br>1. 如果许多子问题被重复访问，则更快，因为没有递归调用的开销<br>2. 可以使用 DP“即时”技术节省内存空间（见上方代码中的注释）\
    \ |\n| **缺点：**<br>1. 如果由于递归调用开销导致许多子问题被重复访问，则更慢（通常在编程竞赛中不会因此扣分）<br>2. 如果有 \\(M\\\
    ) 个状态，它最多可能使用 \\(O(M)\\) 的表大小，这可能在有些难题中导致内存超限（MLE） | **缺点：**<br>1. 对某些倾向于递归的程序员来说，这可能不直观<br><br>2.\
    \ 如果有 \\(M\\) 个状态，自底向上 DP 会访问并填充所有这 \\(M\\) 个状态的值 |\n\n表 3.1：DP 决策表\n\n## 3.4.2\
    \ 几个经典 DP 示例\n\n还有许多其他著名问题具有高效的 DP 解法。我们将这些问题视为经典问题，因此任何希望在 ICPC 或 IOI 中取得好成绩的人都必须了解它们！\n\
    \n### 最长递增子序列（LIS）\n\n问题：给定一个序列 {X[0], X[1], ..., X[N−1]}，顾名思义，确定其最长递增子序列（LIS）⁵。注意，‘子序列’不一定是连续的。\n\
    \n**示例：**\n\n\\(N = 8\\)，序列 = {−7, 10, 9, 2, 3, 8, 8, 1}\n\nLIS 为 {−7, 2, 3, 8}，长度为\
    \ 4。\n\n解法：设 LIS(i) 为以索引 i 结尾的 LIS，则有如下递推式：\n\n- 1. LIS(0) = 1 // 基本情况\n- 2. LIS(i)\
    \ = ans，用下面的循环计算：\n\n```cpp\nint ans = 1;\nfor (int j = 0; j < i; j++) // O(n)\n\
    \    if (X[i] > X[j]) // if we can extend LIS(j) with i\n        ans = max(ans,\
    \ 1 + LIS(j))\n```\n\n⁵ 这个问题还有其他变体：最长递减子序列、最长非递增/非递减子序列，以及利用 LIS 有序且可二分查找这一事实的\
    \ O(n log k) 解法。更多细节见 http://en.wikipedia.org/wiki/Longest_increasing_subsequence。注意，递增子序列可以建模为有向无环图（DAG）。因此，寻找\
    \ LIS 等价于在 DAG 中寻找最长路径。\n"
