    # # String Processing


    > > *Human Genome has approximately 3.3 Giga base-pairs*

    > > — Human Genome Project


    > > *In this chapter, we present one more topic that is tested in ICPC, namely:
    string processing. Processing (long) string is quite common in the research field
    of bioinformatics and some of such problems are presented as contest problems
    in ICPC.*


    # ## 6.1 Overview and Motivation


    Although not as frequent as graph and mathematics problems in the previous two
    chapters, string processing problems are also found in recent ICPCs (see Table
    6.1). Some string-related problems have huge inputs. Thus the solution must use
    efficient data structures and algorithms for string.


