  mdcn: "\n## 第 1 章：引言\n\n> *我想参加 ACM ICPC 世界总决赛！*  \n> ——一位专注的学生\n\n*在本章中，我们向读者介绍竞赛编程的世界。希望你喜欢这段旅程，并热情地继续阅读和学习，直到本书的最后一页。*\n\
    \n### 1.1 竞赛编程\n\n概括来说，“竞赛编程”就是：“给定众所周知的计算机科学（CS）问题，尽可能快地解决它们！”。\n\n让我们逐一解析这些术语。“众所周知的\
    \ CS 问题”这一说法意味着，在竞赛编程中，我们处理的是已解决的 CS 问题，而*不是*研究性问题（其解决方案仍然未知）。当然，有些人（至少出题人）以前已经解决过这些问题。“解决它们”意味着我们必须把\
    \ CS 知识提升到某个所需水平，以便我们也能编写出可运行的代码来解决这些问题——也就是在使用出题人的秘密输入数据时，得到与出题人*相同*的输出。“尽可能快”是竞赛要素，而这是一种非常自然的人类行为。\n\
    \n请注意，精通竞赛编程*不是*最终目标，它只是手段。真正的最终目标是培养全面发展的计算机科学家/程序员，使他们更能准备好开发更好的软件，或在未来面对更难的\
    \ CS 研究问题。ACM 国际大学生程序设计竞赛（ICPC）[27] 的创始人怀有这一愿景，而我们作者也认同它。通过本书，我们尽自己的一点力量，帮助当代和后代在面对近年\
    \ ICPC 和国际信息学奥林匹克（IOI）中频繁出现的著名 CS 问题时更具竞争力。\n\n求解 UVa Online Judge [17] 第 10911\
    \ 号问题（组建测验队伍）的示例。\n\n简化的问题描述：设 (x,y) 为学生房子在二维平面上的坐标。有 2N 名学生，我们想把他们两两配成 N 组。设\
    \ dᵢ 为第 i 组中两名学生房子之间的距离。组成 N 组，使得 \\(\\sum_{i=1}^{N} d_i\\) 最小。约束：N ≤ 8；0 ≤ x,\
    \ y ≤ 1000。先思考，尽量不要马上翻页！\n\n现在问问自己，你是哪一种？请注意，如果你对本章展示的材料或术语不清楚，可以在通读本书一遍后再重读本章。\n\
    \n- **非竞赛程序员 A（又名“迷糊者”）：**\n  - 第 1 步：阅读问题……困惑 @-@，以前从未见过这类问题。\n  - 第 2 步：试着写点代码……从阅读不简单的输入和输出开始。\n\
    \  - 第 3 步：意识到他的所有尝试都失败了：\n    - **贪心解法**：根据最短距离将学生配对，会得到**错误答案（WA）**。\n    -\
    \ 使用回溯的**穷举搜索**会得到**超时（TLE）**。\n    - 经过 5 小时的努力（典型比赛时长），仍未产生**通过（AC）**的解法。\n\
    - **非竞赛程序员 B（放弃）：**\n  - 第 1 步：阅读问题……然后意识到他以前见过这类问题。但也想起自己还没学会如何解决这类问题……他不知道这个问题有一个简单的解法：**动态规划（DP）**……\n\
    \  - 第 2 步：跳过这个问题，去读另一道题。\n- **（仍然）非竞赛程序员 C（慢）：**\n  - 第 1 步：阅读问题并意识到这是一个“一般图匹配”问题。一般来说，这个问题**必须**使用\
    \ **‘Edmonds 花收缩算法’** [34] 来解决。但由于输入规模很小，这个问题可以用动态规划解决！\n  - 第 2 步：编写 I/O 例程，编写递归自顶向下\
    \ DP，测试解法，**调试** >_<……\n  - 第 3 步：*仅在 3 小时后*，他的解法才被判为 AC（通过所有秘密测试数据）。\n- **竞赛程序员\
    \ D：**\n  - 与程序员 C 相同，但在 30 分钟内完成上述所有步骤。\n- **非常强的竞赛程序员 E：**\n  - 当然，一位非常强的竞赛程序员（例如\
    \ TopCoder [26] 中的红色‘target’选手）可能在 15 分钟内解决这个“经典”问题……\n\n### 1.2 保持竞争力的技巧\n\n\
    如果你想成为上例中竞赛程序员 D 或 E 那样的人，也就是说，你想在 IOI [12] 中表现出色、获得参赛资格并夺得奖牌；想在 ACM ICPC [27]\
    \ 的国家赛、区域赛乃至世界总决赛中晋级；或者想在其他编程竞赛中取得好成绩，那么本书绝对适合你！\n\n在后续章节中，你将学习近年编程竞赛中经常出现的基础到中等难度的数据结构和算法，这些内容汇编自许多资料\
    \ [19, 6, 20, 2, 4, 14, 21, 16, 23, 1, 13, 5, 22, 15, 47, 24]（见图 1.5）。但你不仅会学习算法，还会学习如何高效实现它们，并将它们应用到合适的竞赛题目中。\n\
    \n除此之外，你还会从我们的经验中学到许多零碎的编程技巧，这些技巧在比赛场景中可能会有所帮助。下面我们先给你几条通用技巧：\n\n#### **技巧 0：更快地输入代码！**\n\
    \n不是开玩笑！尽管这条建议可能没多大意义，因为 ICPC 和 IOI 都不是打字速度比赛，但我们见过近年一些 ICPC 比赛中，第 *i* 名和第 *i\
    \ + 1* 名之间只差几分钟。当你能解出与竞争对手相同数量的题目时，胜负就取决于编码技能以及……打字速度。\n\n#### 1.2.1 技巧 1：快速识别问题类型\n\
    \n在 ICPC 中，参赛者会拿到一组类型各异的题目（约 7-11 道）。根据我们对近年 ICPC 亚洲区域赛题集的观察，我们可以像表 1.1 那样对问题类型及其出现频率进行分类。关于\
    \ IOI，请参考 IOI 2009 大纲 [8] 和 [28]。\n\n| 编号 | 类别 | 子类别 | 本书位置 | 出现频率 |\n|---:|---|---|---|---|\n\
    | 1. | 杂项 | 直接题 | 1.2 节 | 1-2 |\n|  |  | 模拟 | 1.3 节 | 0-1 |\n| 2. | 穷举搜索 | 迭代\
    \ | 3.1 节 | 0-1 |\n|  |  | 回溯 | 3.1 节 | 0-1 |\n| 3. | 分治 |  | 3.2 节 | 0-1 |\n\
    | 4. | 贪心 | 经典 | 3.3.1 节 | ≈0 |\n|  |  | 原创 | 3.3.2 节 | 1 |\n| 5. | 动态规划 | 经典\
    \ | 3.4.2 节 | ≈0 |\n|  |  | 原创 | 3.4.3 节 | 1-2（最多可达 3） |\n| 6. | 图论 |  | 第 4 章\
    \ | 1-2 |\n| 7. | 数学 |  | 第 5 章 | 1-2 |\n| 8. | 字符串处理 |  | 第 6 章 | 1 |\n| 9. |\
    \ 计算几何 |  | 第 7 章 | 1 |\n| 10. | 一些较难问题 |  |  | 0-1 |\n|  |  | 每套题总计 | 7-16（通常\
    \ ≤ 11） |\n\n*表 1.1：近年 ACM ICPC 亚洲区域赛问题类型*\n\n表 1.1 中的分类改编自 [18]，且绝非完整。有些问题，例如“排序”，没有在这里分类，因为它们“平凡”，只在“更大”的问题中用作“子程序”。我们没有纳入“递归”，因为它嵌入在其他类别中。我们也省略了“数据结构相关问题”，这类问题将归类为“杂项”。\n\
    \n当然，问题类型可以混合搭配：一道题可以归入不止一种类型，例如 Floyd Warshall 算法既可以是图问题——全源最短路径（APSP，4.7 节）——的解法，也可以是一种动态规划（DP）算法（3.4\
    \ 节）。\n\n未来，这些分类可能会增加或改变。一个重要的例子是 DP。这项技术在 20 世纪 40 年代之前并不为人所知，在 20 世纪 90 年代中期之前也不常用于\
    \ ICPC 或 IOI，但如今它已是必备内容。在近年的 2010 年 ICPC 世界总决赛中，有 ≥ 3 道 DP 问题（总共 11 道）。\n\n作为练习，请阅读表\
    \ 1.2 中列出的 UVa [17] 问题，并判断它们的问题类型。第一道已经为你填好。掌握本书后，填写这张表会很容易。\n\n| UVa | 标题 | 问题类型\
    \ | 提示 |\n|---:|---|---|---|\n| 10360 | 老鼠攻击 | 穷举搜索或动态规划 | 3.1 或 3.4 节 |\n| 10341\
    \ | 解决它 |  | 3.2 节 |\n| 11292 | Loowater 之龙 |  | 3.3 节 |\n| 11450 | 婚礼购物 |  |\
    \ 3.4 节 |\n| 11635 | 酒店预订 |  | 4.3 + 4.5 节 |\n| 11506 | 愤怒的程序员 |  | 4.8 节 |\n\
    | 10243 | 火！火！！火！！！ |  | 4.9.1 节 |\n| 10717 | 造币厂 |  | 5.3.2 节 |\n| 11512 | GATTACA\
    \ |  | 6.4 节 |\n| 10065 | 无用的瓷砖包装工 |  | 7.3 节 |\n\n*表 1.2：练习：对这些 UVa 问题进行分类*\n"
