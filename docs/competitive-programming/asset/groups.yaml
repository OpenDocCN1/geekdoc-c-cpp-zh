    \ do that, consult references!\n```\n\n上面的代码片段展示了如何实现 Edmonds-Karp 算法，使其仍能达到 $O(VE^2)$\
    \ 的时间复杂度。该代码对同一个流量图*同时*使用邻接表（用于快速枚举邻居）和邻接矩阵（用于快速访问边权重）。\n\n一般来说，这个 $O(VE^2)$ 的\
