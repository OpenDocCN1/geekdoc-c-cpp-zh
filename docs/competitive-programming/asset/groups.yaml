    - 30. UVa 11716 - Digital Fortress (simple cipher)\n- 31. UVa 11734 - Big Number\
    \ of Teams will Solve This (modified string comparison function)\n\nHowever, recent\
    \ contest problems in ACM ICPC usually do not ask solutions for basic string processing\
    \ except for the 'giveaway' problem that all teams should be able to solve. Some\
    \ string processing problems are solvable with Dynamic Programming (DP) technique.\
