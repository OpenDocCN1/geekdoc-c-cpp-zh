    \n字符串对齐（或编辑距离）问题定义如下：给定两个字符串 A 和 B，以最大对齐得分（或最小编辑操作数）将 A 与 B 对齐¹：\n\n在将 A 与 B 对齐后，对于所有索引\
    \ i，字符 A[i] 与 B[i] 之间存在以下几种可能：\n\n- 1. 字符 A[i] 与 B[i] **匹配**（假设我们给出“+2”得分），\n\
