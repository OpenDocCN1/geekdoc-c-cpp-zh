    \ we simply return the index of minimum element that is stored in this node, which\
    \ is 5. Thus RMQ(4, 6) = 5. We do not have to traverse the unnecessary parts of\
    \ the tree! In the worst case, we have two root-to-leaf paths which is just O(log\
    \ n). For example in RMQ(3, 4) = 4, we have one root-to-leaf path from [0, 6]\
    \ to [3, 3] and another root-to-leaf path from [0, 6] to [4, 4].\n\nIf the array\
    \ A is static, then using Segment Tree to solve RMQ is an overkill as there exists\
