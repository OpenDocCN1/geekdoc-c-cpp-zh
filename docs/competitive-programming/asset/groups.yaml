    \ sometimes, we change the '> 0' to '>= 0' to accept collinear points\nbool ccw(point\
    \ p, point q, point r) { return (turn(p, q, r) > 0); }\n```\n\nWith the library\
    \ code above, we can now check if a polygon is convex by verifying if all three\
