    \ and typically use iterator to scan the content of the vector.\n\n**Efficient\
    \ Sorting and Searching in Static/Resizable Array**\n\nThere are two central operations\
    \ commonly performed on array: sorting and searching.\n\nThere are *many* sorting\
    \ algorithms mentioned in CS textbooks, which we classify as:\n\n- 1. $O(n^2)$\
    \ comparison-based sorting algorithms [4]: Bubble/Selection/Insertion Sort.\n\n\
    \  These algorithms are slow and usually avoided, but understanding them is important.\n\
    \n- 2. $O(n\\log n)$ comparison-based sorting algorithms [4]: Merge/Heap/Random\
    \ Quick Sort.\n\n  We can use C++ STL `sort`, `partial_sort`, `stable_sort`, in\
    \ `<algorithm>` to achieve this purpose (Java `Collections.sort`). We only need\
