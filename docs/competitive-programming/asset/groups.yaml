  - '[PAGE 22]


    USA Computing Olympiad has a very useful training website [18] for you to learn
    about programming contest. This one is more geared towards IOI participants. Go
    straight to their website, register your account, and train yourself.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_22_0.png)


    Figure 1.3: USACO Training Gateway [18]


    TopCoder arranges frequent ‘Single Round Match’ (SRM) [26] that consists of a
    few problems that should be solved in 1-2 hours. Then afterwards, you are given
    the chance to ‘challenge’ other contestants code by supplying tricky test cases.
    This online judge uses a rating system (red, yellow, blue, etc coders) to reward
    contestants who are really good in problem solving with higher rating as opposed
    to a more diligent contestants who happen to solve ‘more’ easier problems.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_22_1.png)


    Figure 1.4: TopCoder [26]


    # 1.3 Getting Started: Ad Hoc Problems


    We will end this chapter by introducing you to the first problem type in ICPC:
    the Ad Hoc problems. According to USACO training gateway [18], Ad Hoc problems
