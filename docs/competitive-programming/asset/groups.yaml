    \ A 类（或至少 B 类）。\n\n### 1.2.2 技巧 2：进行算法分析\n\n一旦你设计出一个算法来解决编程竞赛中的某个特定问题，你现在必须问这个问题：给定最大输入规模（通常在良好的题目描述中给出），当前开发的算法及其时间/空间复杂度，能否通过该特定问题给定的时间/内存限制？\n\
    \n有时，解决一个问题的方法不止一种。然而，其中一些可能不正确，一些则不够快……经验法则是：头脑风暴出许多可能的算法——然后选择**最简单且可行的**那个（快到足以通过时间和内存限制，同时仍能产生正确答案！）。\n\
    \n例如，输入 n 的最大规模是 100K，即 10⁵（1K = 1,000），而你的算法是 O(n²) 阶。你的常识告诉你 (100K)² 是一个极大的数，它是\
    \ 10¹⁰。因此，你会尝试设计一个更快（且正确）的算法来解决问题，比如 O(n log₂ n) 阶。现在 10⁵ log₂ 10⁵ 只是 1.7 × 10⁶……由于如今的计算机相当快，几秒内可以处理高达\
    \ 1M 即 10⁶（1M = 1,000,000）次操作，你的常识告诉你这个算法很可能可以通过时间限制。\n\n现在考虑这个场景。你只能设计出 O(n⁴)\
    \ 阶的算法。看起来相当糟糕，对吧？但如果 n ≤ 10……那么你就完成了。直接实现你的 O(n⁴) 算法即可，因为 10⁴ 只是 10K，而你的算法只会使用相对较少的计算时间。\n\
    \n因此，通过结合给定的输入规模和声明的时间/内存限制来分析算法的复杂度，你可以更好地判断应该尝试编写算法代码（这会花费你的时间，尤其是在时间受限的 ICPC\
    \ 和 IOI 中），还是先尝试改进算法，或转而解决题集中的其他问题。\n\n在本书中，我们不会讨论算法分析的概念。我们假设你具备这项基本技能。请查阅这本参考书：《算法导论》[4]，并确保你理解如何：\n\
    \n- 证明算法的正确性（尤其是贪心算法，见第 3.3 节）。\n- 分析迭代算法和递归算法的时间/空间复杂度。\n- 进行摊还分析（见 [4] 第 17\
    \ 章）——尽管在竞赛中很少使用。\n- 进行输出敏感分析，以分析依赖输出规模的算法，例如：借助后缀树（见第 6.4 节）查找查询串 Q 的精确字符串匹配时的\
    \ O(|Q| + occ) 复杂度。\n\n许多新手程序员通常会跳过这个阶段，并忍不住直接编写他们能想到的第一个算法（通常是朴素版本），然后最终意识到所选的数据结构效率不高，或者他们的算法不够快（或错误）。**我们的建议：在你确定算法既正确又足够快之前，不要急于编码。**\n\
    \n为了帮助你判断多快才算‘足够快’，我们制作了表 1.4。在许多算法书中也能找到这类表 1.4 的变体。不过，我们在这里从编程竞赛的角度又给出了一个。通常，题目描述中会给出输入规模约束。利用以下逻辑假设：一台典型的\
    \ 2010 年 CPU 能在 1 秒内完成 1M 次操作，且时间限制为 3 秒（大多数 UVA 在线评测 [17] 问题使用的典型时间限制），我们可以预测仍能通过时间限制的‘最差’算法。通常，最简单的算法时间复杂度较差，但如果它已经能通过时间限制，那就直接使用它！\n\
