    # Coin Change (CC) - The General Version


    Problem^6: Given a target amount V cents and a list of denominations of N coins,
    i.e. We have coinValue[i] (in cents) for coin type i ∈ [0 ...N-1], what is the
    minimum number of coins that we must use to obtain amount V? Assume that we have
    unlimited supply of coins of any type.


    Example 1:


    V = 10, N = 2, coinValue = {1, 5}


    We can use:


    +   A. Ten 1 cent coins = 10 x 1 = 10; Total coins used = 10

    +   B. One 5 cents coin + Five 1 cent coins = 1 x 5 + 5 x 1 = 10; Total coins
    used = 6

    +   C. Two 5 cents coins = 2 x 5 = 10; Total coins used = 2 -> Optimal


    Recall that we can use greedy solution if the coin denominations are suitable
    - as in Example 1 above (See Section 3.3). But for general cases, we have to use
    DP - as in Example 2 below:


    Example 2:


    V = 7, N = 4, coinValue = {1, 3, 4, 5}


    Greedy solution will answer 3, using 5+1+1 = 7, but optimal solution is 2, using
    4+3 only!


    Solution: Use these Complete Search recurrences:


    +   1. coin(0) = 0 // 0 coin to produce 0 cent

    +   2. coin(< 0) = INVALID -> (in practice, we just return a large positive value)

    +   3. coin(value) = 1 + min(coin(value - coinValue[i])) ∀i ∈ [0..N-1]


    The answer is in coin(V).


    6There are other variants of this problem, e.g. counting how many ways to do coin
    change and a variant where supply of coins are limited.'
