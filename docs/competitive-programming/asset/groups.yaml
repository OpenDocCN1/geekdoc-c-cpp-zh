    # Chapter 4


    # Graph


    _Many real-life problems can be classified as graph problems. Some have efficient
    solutions. Some do not have them yet. In this chapter, we learn various graph
    problems with known efficient solutions, ranging from basic traversal, minimum
    spanning trees, shortest paths, and network flow algorithms._


    # 4.1  Overview and Motivation


    In this chapter, we discuss graph problems that are commonly appear in programming
    contests, the algorithms to solve them, and the practical implementations of these
    algorithms. The issue on how to store graph information has been discussed earlier
    in Section 2.3.1.


    We assume that the readers are familiar with the following terminologies: Vertices/Nodes,
    Edges, Un/Weighted, Un/Directed, In/Out Degree, Self-Loop/Multiple Edges (Multigraph)
    versus Simple Graph, Sparse/Dense, Path, Cycle, Isolated versus Reachable Vertices,
    (Strongly) Connected Component, Sub-Graph, Tree/Forest, Complete Graph, Directed
    Acyclic Graph, Bipartite Graph, Euler/Hamiltonian Path/Cycle. If you encounter
    any unknown terms. Please go to Wikipedia [46] and search for that particular
    term.


    Table 4.1 summarizes our research so far on graph problems in recent ACM ICPC
    Asia regional contests and its ICPC Live Archive [11] IDs. Although there are
    so many graph problems (many are discussed in this chapter), they only appear
    either once or twice in a problem set. The question is: “Which ones that we have
    to learn?” If you want to do well in contests, you have no choice but to study
    all these materials.


