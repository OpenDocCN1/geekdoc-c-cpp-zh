    \ = 1` 执行相同过程（也可以最多有 20 个型号），依此类推。如果最后一个 `garment_id = C − 1` 的型号已经被选择，则停止。如果在到达最后一个\
    \ `garment_id` 之前 `money_left < 0`，则剪枝这个部分解。在所有有效组合中，选择一个使 `money_left` 尽可能接近\
    \ 0 但仍 ≥ 0 的组合。这会使花费的钱最大化，即 (`M − money_left`)。\n\n我们可以形式化定义这些完全搜索的递推式：\n\n- 1.\
    \ 如果 `money_left < 0`（即金额变为负数），  \n  `shop(money_left, garment_id) = INVALID`（实践中，我们可以返回一个很大的负值）\n\
    - 2. 如果已经购买了最后一个 `garment_id` 的一个型号（即一个候选解），  \n  `shop(money_left, garment_id)\
    \ = M - money_left`（这是实际花费的钱）\n- 3. 一般情况下，对于当前 `garment_id` 的所有型号 `[1...K]`  \n\
    \  `shop(money_left, garment_id) =`  \n  `    max(shop(money_left - price[garment_id][model],\
