    \ below. The code shown here supports static Range Minimum/Maximum/Sum queries\
    \ (the dynamic update part is left as exercise). There are of course other ways\
    \ to implement segment tree, e.g. a more efficient version that only expands the\
    \ segments when needed.\n\n```\n```cpp\n#include <iostream>\n#include <math.h>\n\
    #include <vector>\nusing namespace std;\n\n// Segment Tree Library\n// The segment\
    \ tree is stored like a heap array\n#define RANGE_SUM 0\n#define RANGE_MIN 1\n\
    #define RANGE_MAX 2\nvi segment_tree;\n\nvoid init_segment_tree(int N) { // if\
    \ original array size is N,\n    // the required segment_tree array length is\
