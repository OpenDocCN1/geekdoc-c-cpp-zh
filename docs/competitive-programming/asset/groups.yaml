  - "[PAGE 92]\n\n+   - Variants\n+     1. UVa 334 - Identifying Concurrent Events\
    \ (transitive closure is only the sub-problem)\n+     2. UVa 534 - Frogger (Minimax)\n\
    +     3. UVa 544 - Heavy Cargo (Maximin)\n+     4. UVa 869 - Airline Comparison\
    \ (run Warshall’s twice, then compare the AdjMatrices)\n+     5. UVa 925 - No\
    \ more prerequisites, please!\n+     6. UVa 10048 - Audiophobia (Minimax)\n+ \
    \    7. UVa 10099 - Tourist Guide (Maximin)\n\n# 4.8  Edmonds Karp’s\n\n# Basic\
    \ Form and Application\n\nMotivating problem: Imagine a connected, weighted, and\
    \ directed graph as a pipe network where the pipes are the edges and the splitting\
    \ points are the vertices. Each pipe has a capacity equals to the weight of the\
    \ edge. There are also two special vertices: source s and sink t. What is the\
    \ maximum flow from source s to sink t in this graph? (imagine water flowing in\
    \ the pipe network, we want to know the maximum volume of water that can be passed\
    \ by this pipe network?) This problem is called the Max Flow problem. An illustration\
    \ of this problem is shown in Figure 4.21.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_92_0.png)\n\
    \nFigure 4.21: Illustration of Max Flow (From UVa 820 [17] - ICPC World Finals\
    \ 2000 Problem E)\n\nOne solution is the Ford Fulkerson’s method – invented by\
    \ the same Lester Randolph Ford. Jr who created Bellman Ford’s algorithm and Delbert\
    \ Ray Fulkerson. The pseudo code is like this:\n\n```\nmax_flow = 0\nwhile (there\
    \ exists an augmenting path p from s to t) { // iterative algorithm\n    augment\
    \ flow f along p, i.e.\n        f = min edge weight in the path p\n        max_flow\
    \ += f // we can send flow f from s to t\n        forward edges -= f // reduce\
    \ capacity of those edges\n        backward edges += f // increase capacity of\
    \ reverse edges\n}\noutput max_flow\n```"
  - "[PAGE 93]\n\nThere are several ways to find an augmenting path in the pseudo\
    \ code above, each with different time complexity. In this section, we highlight\
    \ two ways: via DFS or via BFS.\n\nFord Fulkerson's method implemented using DFS\
    \ can run in O(f*E) where f* is the max_flow value. This is because we can have\
    \ a graph like in Figure 4.22 where every path augmentation only decreases the\
    \ edge capacity along the path by 1. This is going to be repeated f* times. In\
    \ Figure 4.22, it is 200 times. The fact that number of edges in flow graph is\
    \ E >= V - 1 to ensure ∃ >= 1 s-t flow dictates that a DFS run is O(E). The overall\
    \ time complexity is O(f*E).\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_93_0.png)\n\
    \nA better implementation of Ford Fulkerson's method is to use BFS for finding\
    \ the shortest path – in terms of number of layers/hops – between s and t. This\
    \ algorithm is discovered by Jack Edmonds and Richard Karp, thus named as Edmonds\
    \ Karp's algorithm. It runs in O(VE^2) as it can be proven that after O(VE) iterations,\
    \ all augmenting paths will already exhausted. Interested readers can browse books\
    \ like [4] to study more about this algorithm. As BFS also runs in O(E), the overall\
    \ time complexity is O(VE^2). Edmonds Karp's only needs two s-t paths in Figure\
    \ 4.22: s-a-t (send 100 unit flow) and s-b-t (send another 100).\n\n```\n    map<int,\
    \ int> p; // parent map to reconstruct path\n    int f, s, t; // global variables\n\
    \n    // inside int main()\n    int max_flow = 0;\n    while (1) { // this will\
    \ be run max O(VE) times\n      f = 0;\n\n      queue<int> q; map<int, int> dist;\
    \ // O(E) BFS and record path p\n      q.push(s); dist[s] = 0; // start from source\n\
    \      while (!q.empty()) {\n        int u = q.front(); q.pop(); // queue: layer\
    \ by layer!\n        if (u == t) break; // modification 1: reach sink t, stop\
    \ BFS\n\n        TRvii (AdjList[u], v) // for each neighbours of u\n         \
    \ // modification 2: also check AdjMat as edges may disappear\n          if (AdjMat[u][v->first]\
    \ > 0 && !dist.count(v->first)) {\n            dist[v->first] = dist[u] + 1; //\
    \ then v is reachable from u\n            q.push(v->first); // enqueue v for next\
    \ steps\n            p[v->first] = u; // modification 3: parent of v->first is\
    \ u\n          }\n      }\n\n      augmentPath(t, INF); // path augmentation in\
    \ O(V)\n      if (f == 0) break; // seems that we cannot pass any more flow\n\
    \      max_flow += f;\n    }\n    printf(\"Max flow = %d\\n\", max_flow);\n```"
  - "[PAGE 94]\n\n```\n```cpp\nvoid augmentPath(int v, int minEdge) {\n    if (v ==\
    \ s) { // managed to get back to source\n        f = minEdge; // minEdge of the\
    \ path\n        return;\n    }\n    else if (p.count(v)) { // augment if there\
    \ is a path\n        // we need AdjMat for fast lookup here\n        augmentPath(p[v],\
