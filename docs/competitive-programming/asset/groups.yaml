    \ - 1]); // put two starting vertices into stack S\n  S.push(Polygon[0]);\n\n\
    \  i = 1; // and start checking the rest\n  while (i < N) { // note: N must be\
    \ >= 3 for this method to work\n    now = S.top();\n    S.pop(); prev = S.top();\
    \ S.push(now); // trick to get the 2nd item from top of S\n    if (ccw(prev, now,\
    \ Polygon[i])) { // if these 3 points make a left turn\n      S.push(Polygon[i]);\
    \ // accept\n      i++;\n    }\n    else // otherwise\n      S.pop(); // pop this\
    \ point until we have a left turn\n  }\n\n  vector<point> ConvexHull;\n  while\
    \ (!S.empty()) { // from stack back to vector\n    ConvexHull.push_back(S.top());\n\
    \    S.pop();\n  }\n  ConvexHull.pop_back(); // the last one is a duplicate of\
    \ first one\n\n  return ConvexHull; // return the result\n}\n```\n\n与凸包相关的编程练习：\n\
    \n- 1. UVa 109 - 飞毛腿克星\n- 2. UVa 218 - 消灭飞蛾\n- 3. UVa 361 - 警察与强盗\n- 4. UVa 681\
    \ - 凸包求解（用于入门的纯凸包问题）\n- 5. UVa 811 - 加固森林（结合凸包的完全搜索）\n- 6. UVa 10002 - 质心（凸多边形的重心、凸包）\n\
    - 7. UVa 10065 - 无用的瓷砖打包机（外加多边形面积）\n- 8. UVa 10135 - 聚集新生\n- 9. UVa 10173 - 最小外接矩形\n\
    - 10. UVa 11626 - 凸包\n\n### 7.4 相交问题\n\n在几何问题中，我们几乎可以取任意一对对象，判断它们是否相交；如果相交，那么交点/交面积/交体积是什么？这是竞赛中许多计算几何问题的来源。\n\
    \n线段相交是最常见的相交问题之一。我们可以通过若干次 ccw 测试来判断两条线段是否相交（代码如下）。\n\n```cpp\nstruct line {\
    \ point p1, p2; };\n\nint intersect(line line1, line line2) {\n    return\n  \
    \      ((ccw(line1.p1, line1.p2, line2.p1) * ccw(line1.p1, line1.p2, line2.p2))\
    \ <= 0)\n        &&\n        ((ccw(line2.p1, line2.p2, line1.p1) * ccw(line2.p1,\
    \ line2.p2, line1.p2)) <= 0);\n}\n```\n\n然而，相交也可能发生在两条线段之外的不同类型对象之间。其他对象包括：立方体、盒子、圆、多边形、三角形、矩形等。下面给出一些示例。\n\
    \n与相交问题相关的可解编程练习：\n\n- 线段相交\n  - 1. UVa 191 - 相交\n  - 2. UVa 378 - 相交直线\n  - 3.\
    \ UVa 866 - 相交线段\n  - 4. UVa 920 - 阳光山\n  - 5. UVa 972 - 地平线\n  - 6. UVa 10902\
    \ - 挑棍游戏\n  - 7. UVa 11343 - 孤立线段\n- 其他对象\n  - 1. UVa 453 - 相交圆（圆与圆）\n  - 2. UVa\
    \ 460 - 重叠矩形（矩形与矩形）\n  - 3. UVa 737 - 闪耀的立方体（立方体与立方体）\n  - 4. UVa 904 - 重叠空中交通管制（三维盒与三维盒）\n\
    \  - 5. UVa 10301 - 圆环与胶水（圆与圆）\n  - 6. UVa 10321 - 多边形相交（凸多边形与凸多边形）\n  - 7. UVa\
    \ 11122 - 三角形相交（三角形与三角形）\n  - 8. UVa 11345 - 矩形（矩形与矩形）\n  - 9. UVa 11515 - 起重机（圆与圆，外加动态规划）\n\
    \  - 10. UVa 11601 - 避免重叠（矩形与矩形）\n  - 11. UVa 11639 - 守卫土地（矩形与矩形）\n\n### 7.5 再谈分治法\n\
    \n若干计算几何问题可以用分治范式求解，该范式已在第 3.2 节详细阐述。下面给出其中一个示例。\n\n### 几何问题的二分法\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_142_0.png)\n\
    \n图 7.6：田径跑道（来自 UVa 11646）\n\n假设我们有如下问题：给定一个期望的足球场，其期望长宽比 = A : B，两个弧来自同一个圆，圆心位于球场中央，田径跑道的长度（周长：2×\
    \ 长 + 2× 弧）为 400m，求球场的实际长和宽？见图 7.6。\n\n用纸笔很难求出解，但借助计算机和二分法（二分查找），我们可以轻松找到解。\n\n\
    假设我们对 L 的值进行二分查找，那么可由 b × L / a 得到 W。期望的弧长为 (400 − 2 × L)/2。现在我们可以用三角学通过三角形 CMX\
    \ 计算半径 r 和角度 θ（见图 7.6）。有了 r 和 θ，我们就能计算实际弧长。然后将该值与期望弧长比较，以决定是需要增大还是减小长度 L。代码的重要部分如下所示。\n\
    \n```cpp\nlo = 0.0; hi = 400.0; // the range of answer\nwhile (fabs(lo - hi) >\
    \ 1e-9) { // do bisection method on L\n    L = (lo + hi) / 2.0;\n    W = b * L\
    \ / a; // W can be derived by L\n    expected_arc = (400 - 2.0 * L) / 2.0;\n \
    \   half_L = 0.5 * L; half_W = 0.5 * W;\n    r = sqrt(half_L * half_L + half_W\
    \ * half_W);\n    angle = 2.0 * atan(half_W / half_L) * 180.0 / PI;\n    this_arc\
    \ = angle / 360.0 * PI * (2.0 * r);\n    if (this_arc > expected_arc) hi = L;\n\
    \    else                         lo = L;\n}\nprintf(\"Case %d: %.12lf %.12lf\\\
    n\", caseNo++, L, W);\n```\n\n与本节相关的编程练习：\n\n- 1. UVa 10245 - 最近点对问题（正如题名所示）\n\
    - 2. UVa 10566 - 交叉梯子（二分法）\n- 3. UVa 11378 - 贝伊之战（也是最近点对问题）\n- 4. UVa 11646 -\
    \ 田径跑道（二分法，圆心位于跑道中心）\n- 5. UVa 11648 - 分割土地（二分法）\n\n### 7.6 本章注释\n\n本章部分材料源自新加坡国立大学计算学院\
    \ **Cheng Holun, Alan 博士** 提供的材料。\n\n还有许多其他凸包算法，例如 **Jarvis 步进法**、**礼品包装法** 和\
    \ **上/下凸包法**，它们的时间复杂度与 **Graham 扫描法** 大致相似。本章介绍的 Graham 扫描算法通常足以应对大多数竞赛问题。\n\n\
    还有一种尚未讨论的计算几何技术：**平面扫描**。感兴趣的读者应查阅以下书籍 [19, 6, 4]。\n\n如果你正在备战 ICPC，最好让团队中的一名成员深入研究这一主题。此人应掌握基本几何公式和高级计算几何技术。他必须训练自己熟悉某些几何问题中的许多退化（特殊）情况，并能够处理精度误差等。\n\
    \n本章大约讨论了 **96 道编程练习**。\n\n## 附录 A\n\n### 题目致谢\n\n本书讨论的题目主要取自 UVa 在线评测系统 [17]\
    \ 和 ACM ICPC Live Archive [11]。我们已尽力联系原作者并获取许可。\n\n到目前为止，我们已联系以下出题人并获得许可：Sohel\
    \ Hafiz、Shahriar Manzoor、Manzurur Rahman Khan、Rujia Liu、Gordon Cormack、Jim Knisely、Melvin\
    \ Zhang 和 Colin Tan。\n\n如果本书中讨论的某一题目的作者中，有我们尚未联系且不允许其题目用于本书者，我们将用来自不同出题人的另一道类似题目替换该题。\n"
