    \ $O(n^k)$。\n- 如果你的程序是递归的，每层有 $b$ 个递归调用，并且有 $L$ 层，那么该程序的复杂度大致为 $O(b^L)$。但这是一个上界。实际复杂度取决于每层执行什么操作，以及是否可以进行一些剪枝。\n\
    - 以每个单元格 $O(k)$ 填充二维矩阵的动态规划算法，其复杂度为 $O(k \\times n^2)$。\n- 基于比较的排序算法的最佳时间复杂度为\
    \ $\\Omega(n\\log_2 n)$。\n- 大多数情况下，$O(n\\log_2 n)$ 算法对于大多数竞赛问题已经足够。\n\n作为本节的练习，请回答以下问题：\n\
    \n- 1. 有 \\(n\\) 个网页，\\(1 \\leq n \\leq 10M\\)。每个网页 \\(i\\) 具有不同的页面排名 \\(r_i\\\
    )。你想选出页面排名最高的前 10 个页面。哪种方法更可行？\n  - (a) 将所有 \\(n\\) 个网页的页面排名加载到内存中，排序（第 2.2.1\
    \ 节），然后选出前 10 个。\n  - (b) 使用优先队列数据结构（堆）（第 2.2.2 节）。\n\n- 2. 给定一个最多包含 \\(10K\\\
    ) 个整数的列表 L，你希望频繁查询 \\(\\operatorname{sum}(i,j)\\) 的值，即 L[i] + L[i+1] + ... + L[j]\
    \ 的和。你应该使用哪种数据结构？\n  - (a) 简单数组（第 2.2.1 节）。\n  - (b) 平衡二叉搜索树（第 2.2.2 节）。\n  -\
    \ (c) 哈希表（第 2.2.2 节）。\n  - (d) 线段树（第 2.3.3 节）。\n  - (e) 后缀树（第 6.4 节）。\n  - (f)\
    \ 用动态规划预处理过的简单数组（第 2.2.1 和 3.4 节）。\n\n- 3. 你需要计算一个带权有向无环图（DAG）中两个顶点之间的‘最短路径’，其中\
