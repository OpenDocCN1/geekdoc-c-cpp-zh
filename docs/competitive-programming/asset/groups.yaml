    # ## 3.5 Chapter Notes


    The main source of the ‘Complete Search’ material in this chapter is the USACO
    training gateway [18].


    We adopt the name ‘Complete Search’ rather than ‘Brute-Force’ as we believe that
    some Complete Search solution can be clever and fast enough, although it is complete,
    e.g. **Branch & Bound** and **A* Search** (both are not discussed yet in this
    book). We believe the term ‘clever Brute-Force’ is a bit self-contradicting.


    Divide and Conquer paradigm is usually used in form of its popular algorithms:
    binary search (bisection method), merge/quick/heap sort, and data structures:
    binary search tree, heap, segment tree, etc. We will see more Divide and Conquer
    later in Computational Geometry (Section 7.5).


    *Basic* Greedy and Dynamic Programming (DP) techniques techniques are always included
    in popular algorithm textbooks, e.g. Introduction to Algorithms [4], Algorithm
    Design [13], Algorithm [5], Programming Challenges [23], The Art of Algorithms
    and Programming Contests [16], Art of Programming Contest [1]. However, to keep
    pace with the growing difficulties and creativity of these techniques, especially
    the DP techniques, we include more references from Internet: TopCoder algorithm
    tutorial [25] and recent programming contests, e.g. ACM ICPC Regional Kaohsiung
    2006, Singapore 2007, Jakarta 2008, Central European Olympiad in Informatics 2009,
    etc.


    However, for some real-life problems, especially those that are classified as
    NP-Complete [4], many of the approaches discussed so far will not work. For example,
    0-1 Knapsack Problem which has $O(NW)$ DP complexity is too slow if $W$ is big.
    For this, people use heuristics or local search: Beam Search, Tabu Search [10],
    Genetic Algorithm, Ants Colony Optimization, etc.


    There are approximately **109 programming exercises** discussed in this chapter.'
