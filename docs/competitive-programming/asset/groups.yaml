- raw:
  - "[PAGE 4]\n\n# # Foreword\n\nLong time ago (exactly the Tuesday November 11th\
    \ 2003 at 3:55:57 UTC), I received an e-mail with the following sentence: I should\
    \ say in a simple word that with the UVa Site, you have given birth to a new CIVILIZATION\
    \ and with the books you write (he meant “Programming Challenges: The Programming\
    \ Contest Training Manual” [23], coauthored with Steven Skiena), you inspire the\
    \ soldiers to carry on marching. May you live long to serve the humanity by producing\
    \ super-human programmers.\n\nAlthough it’s clear that was an exaggeration, to\
    \ tell the truth I started thinking a bit about and I had a dream: to create a\
    \ community around the project I had started as a part of my teaching job at UVa,\
    \ with persons from everywhere around the world to work together after that ideal.\
    \ Just by searching in Internet I immediately found a lot of people who was already\
    \ creating a web-ring of sites with excellent tools to cover the many lacks of\
    \ the UVa site.\n\nThe more impressive to me was the ‘Methods to Solve’ from Steven\
    \ Halim, a very young student from Indonesia and I started to believe that the\
    \ dream would become real a day, because the contents of the site were the result\
    \ of a hard work of a genius of algorithms and informatics. Moreover his declared\
    \ objectives matched the main part of my dream: to serve the humanity. And the\
    \ best of the best, he has a brother with similar interest and capabilities, Felix\
    \ Halim.\n\nIt’s a pity it takes so many time to start a real collaboration, but\
