    # Chapter 2


    # Data Structures and Libraries


    > > If I have seen further it is only by standing on the shoulders of giants.

    > >

    > > — Isaac Newton


    This chapter acts as a foundation for subsequent chapters.


    # 2.1  Data Structures


    Data structure is ‘a way to store and organize data’ in order to support efficient
    insertions, queries, searches, updates, and deletions. Although a data structure
    in itself does not solve the given programming problem – the algorithm operating
    on it does, using the most efficient data structure for the given problem may
    be a difference between passing or exceeding the problem’s time limit. There are
    many ways to organize the same data and sometimes one way is better than the other
