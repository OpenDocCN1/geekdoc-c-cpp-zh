    \ - Krakovia（大整数加法和除法）\n- 14. LA 4104 - MODEX（大整数模幂）\n\n## 5.5 数学杂题\n\n在本节中，我们列出了一些在编程竞赛中出现过多次的数学问题。掌握这些问题的解法，可以让你在面对类似问题或需要以这些知识作为解题一部分的问题时占据优势。这里提到的术语也可作为进一步学习的*关键词*。\n\
    \n### 5.5.1 组合数学\n\n**组合数学**[31] 是*离散*数学的一个分支，研究有限或**可数**离散结构。涉及组合数学的编程问题通常以“有多少个[对象]”“数一数[对象]”等为题，不过有些出题人会在题目名称中隐藏这一事实。这类问题的代码通常很短，但找出递推公式需要一定的数学天赋和耐心。在\
    \ ICPC 比赛中，如果题目集中出现这类问题，可以安排一名队员推导公式，另外两人专心解决其他问题。一旦得到公式，由于其通常很简短，要快速编码实现。\n\n\
    例如，尝试解决 UVa 10401 - 三角形计数。这个问题描述很简短：“给定长度分别为 1, 2, ..., *n* 的 *n* 根木棍，任取其中 3 根组成一个三角形。你能组成多少个不同的三角形？（3\
    \ ≤ *n* ≤ 1M）”。注意，如果两个三角形至少有一对边的长度不同，则视为不同三角形。如果运气好，你可能只需几分钟就能发现规律；否则，这个问题可能直到比赛结束也无人解出。提示：当\
    \ *n* = 3, 4, 5, 6, 7, 8, 9, 10 时，答案分别为 0, 1, 3, 7, 13, 22, 34, 50。\n\n组合数学相关编程练习（另见上文斐波那契数）：\n\
    \n- 1. UVa 326 - 使用差分表外推\n- 2. UVa 369 - 组合数（注意溢出问题）\n- 3. UVa 991 - 安全问候（卡特兰数）\n\
    - 4. UVa 10007 - 树的计数（卡特兰数，详见 [30]）\n- 5. UVa 10219 - 找到方法！（使用 Java BigInteger\
    \ 类）\n- 6. UVa 10303 - 有多少棵树（卡特兰数）\n- 7. UVa 10375 - 选择与除法\n- 8. UVa 10784 - 对角线\n\
    - 9. UVa 10790 - 有多少个交点？\n- 10. UVa 10918 - 三行平铺\n- 11. UVa 11069 - 一个图论问题\n-\
    \ 12. UVa 11115 - 杰克叔叔（$N^D$，使用 Java BigInteger 类）\n- 13. UVa 11204 - 乐器（只有第一个选择起作用）\n\
    - 14. UVa 11310 - 送货危机\n- 15. UVa 11401 - 三角形计数（发现规律，编码很容易）\n- 16. UVa 11554 -\
    \ 倒霉的享乐主义（与 UVa 11401 类似）\n\n### 5.5.2 循环查找\n\n**循环查找**[32] 是找出迭代函数值序列中循环的问题。\n\
    \n对于任意函数 $f:S\\to S$ 和任意初值 $x_0\\in S$，迭代函数值的序列 $x_0,x_1=f(x_0),x_2=f(x_1),\\\
    ldots,x_i=f(x_{i-1}),\\ldots$ 最终必然会把某个值用到两次（即出现循环），也就是说 $\\exists\\ i\\ne j$ 使得\
    \ $x_i=x_j$。一旦出现这种情况，序列必然从 $x_i$ 到 $x_{j-1}$ 的值构成循环并不断重复。设 $\\mu$ 为最小的下标 $i$，设\
    \ $\\lambda$（循环长度）为满足 $x_\\mu=x_{\\mu+\\lambda}$ 的最小正整数。给定 $f$ 和 $x_0$，循环查找问题就是求出\
    \ $\\mu$ 和 $\\lambda$。\n\n例如，在 UVa 350 - 伪随机数中，给定一个伪随机数生成器 $f(x)=(Z\\times x+I)\\\
    %M$，其中 $x_0=L$，我们要在某个数字重复出现之前求出序列的长度。\n\n一种能通用解决该问题的朴素算法使用数据结构（例如 C++ STL 的 `<set>`、哈希表或直接寻址表）来存储某个数\
    \ $x_i$ 已在序列中被访问过的信息；然后对之后出现的每个 $x_i$（$i>j$），检查 $x_i$ 是否已存储在数据结构中。如果已存储，则意味着 $x_j=x_i$，$\\\
    mu=j$，$\\lambda=i-j$。该算法的时间复杂度为 $O(\\mu+\\lambda)$，但也至少需要 $O(\\mu+\\lambda)$ 的空间来存储过去的值。\n\
    \n有一种更好的算法，称为 Floyd 循环查找算法 [32]，其时间复杂度同为 $O(\\mu+\\lambda)$，但只使用 $O(1)$ 的内存空间——远小于朴素版本。下面是该算法可运行的\
    \ C/C++ 实现：\n\n```cpp\npair<int, int> floyd_cycle_finding(int (*f)(int), int x0)\
    \ {\n  // The main phase of the algorithm, finding a repetition x_i = x_{2i},\
    \ hare speed is 2x tortoise’s\n  int tortoise = f(x0), hare = f(f(x0)); // f(x0)\
    \ is the element/node next to x0\n  while (tortoise != hare) { tortoise = f(tortoise);\
    \ hare = f(f(hare)); }\n  // Find the position μ of the hare and tortoise move\
    \ at the same speeds\n  int mu = 0; hare = tortoise; tortoise = x0;\n  while (tortoise\
    \ != hare) { tortoise = f(tortoise); hare = f(hare); mu += 1; }\n  // Find the\
    \ length of the shortest cycle starting from x_mu, hare moves, tortoise stays\n\
    \  int lambda = 1; hare = f(tortoise);\n  while (tortoise != hare) { hare = f(hare);\
    \ lambda += 1; }\n  return make_pair(mu, lambda);\n}\n```\n\n循环查找相关编程练习：\n\n-\
    \ 1. UVa 350 - 伪随机数（Floyd 循环查找算法的直接应用）\n- 2. UVa 408 - 均匀生成器\n- 3. UVa 944 - 快乐数（与\
    \ UVa 10591 类似）\n- 4. UVa 10591 - 快乐数\n- 5. UVa 11036 - 最终周期序列\n- 6. UVa 11053\
    \ - 约瑟夫问题：重装上阵\n- 7. UVa 11549 - 计算器难题\n\n### 5.5.3 现有（或虚构的）数列与数制\n\n一些 Ad Hoc\
    \ 数学问题涉及现有（或虚构的）数列或数制的定义，我们的任务是生成某个范围内的数列/数字，或者其中的第 n 个，或者根据定义验证给定的数列/数字是否有效，等等。通常，只要仔细遵循题目描述，就足以解决问题。\n\
    \n数列与数制相关编程练习：\n\n- 数列\n  - 1. UVa 100 - 3n + 1 问题\n  - 2. UVa 413 - 上升与下降序列\n\
    \  - 3. UVa 694 - 考拉兹序列（与 UVa 100 类似）\n  - 4. UVa 10408 - 法里序列\n  - 5. UVa 10930\
    \ - A 序列\n  - 6. UVa 11063 - B2 序列\n- 数制\n  - 1. UVa 136 - 丑数\n  - 2. UVa 138\
    \ - 门牌号\n  - 3. UVa 443 - 谦虚数\n  - 4. UVa 640 - 自身数（DP）\n  - 5. UVa 962 - 出租车数（预计算答案）\n\
    \  - 6. UVa 974 - 卡普雷卡数\n  - 7. UVa 10001 - 孟加拉数\n  - 8. UVa 10006 - 卡迈克尔数\n \
    \ - 9. UVa 10042 - 史密斯数\n  - 10. UVa 10044 - 埃尔德什数（可用 BFS 解决）\n  - 11. UVa 10591\
    \ - 快乐数（可用 Floyd 循环查找算法解决）\n  - 12. UVa 11461 - 平方数\n  - 13. UVa 11472 - 漂亮数\n\
    \n### 5.5.4 概率论\n\n**概率论**是数学的一个分支，研究随机现象的分析。尽管像单次抛硬币这样的事件是随机的，但如果重复很多次，随机事件的序列会表现出某些统计规律，可以被研究和预测。\n\
    \n在编程竞赛中，这类问题要么可以用某个闭式公式解决，要么别无选择，只能枚举完整的搜索空间。\n\n概率相关编程练习：\n\n- 1. UVa 474 -\
    \ 正反面概率\n- 2. UVa 542 - 法国 98\n- 3. UVa 10056 - 概率是多少？\n- 4. UVa 10491 - 牛与汽车\n\
    - 5. UVa 11176 - 连胜\n- 6. UVa 11181 - 概率|给定\n- 7. UVa 11500 - 吸血鬼\n\n### 5.5.5\
    \ 线性代数\n\n**线性方程**定义为未知数（变量）的次数为**线性**（常数，或常数与未知数一次幂的乘积）的方程，例如 `X + Y = 2`。**线性方程组**定义为由\
    \ $n$ 个线性方程组成、包含 $n$ 个未知数（变量）的集合，例如 `X + Y = 2` 和 `2X + 5Y = 6`，其解为 $X = \\frac{1}{3},\
    \ Y = \\frac{2}{3}$。注意与**线性丢番图方程**的区别：线性方程组的解可以是非整数！\n\n求解线性方程组的方法有多种，其中一种是“高斯消元法”，详见\
    \ [5, 37]。\n\n线性代数相关编程练习：\n\n- 1. UVa 10089 - 重新包装\n- 2. UVa 10109 - 求解线性方程组\n\
    - 3. UVa 10309 - 关灯\n\n## 5.6 本章注释\n\n我们承认，本章之外仍有很多其他的数学问题和算法。这最后一节为更多主题提供指引。\n\
    \n如果需要比这里介绍的**更快的素数测试**函数，可以使用非确定性的**米勒-拉宾**算法 [41]——在已知最大输入规模 $N$ 的竞赛环境中，可以将其变为确定性算法。\n"
