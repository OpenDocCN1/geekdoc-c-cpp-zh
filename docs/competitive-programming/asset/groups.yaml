  - "[PAGE 12]\n\n# Chapter 1\n\n# Introduction\n\n> *I want to compete in ACM ICPC\
    \ World Final!*  \n> — A dedicated student\n\n*In this chapter, we introduce readers\
    \ to the world of competitive programming. Hopefully you enjoy the ride and continue\
    \ reading and learning until the very last page of this book, enthusiastically.*\n\
    \n# 1.1  Competitive Programming\n\n‘Competitive Programming’ in summary, is this:\
    \ “Given well-known Computer Science (CS) problems, solve them as quickly as possible!”.\n\
    \nLet’s digest the terms one by one. The term ‘well-known CS problems’ implies\
    \ that in competitive programming, we are dealing with solved CS problems and\
    \ *not* research problems (where the solutions are still unknown). Definitely,\
    \ some people (at least the problem setter) have solved these problems before.\
    \ ‘Solve them’ implies that we must push our CS knowledge to a certain required\
    \ level so that we can produce working codes that can solve these problems too\
    \ — in terms of getting the *same* output as the problem setter using the problem\
    \ setter’s secret input data. ‘As quickly as possible’ is the competitive element\
    \ which is a very natural human behavior.\n\nPlease note that being well-versed\
    \ in competitive programming is *not* the end goal, it is just the means. The\
    \ true end goal is to produce all-rounded computer scientists/programmers who\
    \ are much more ready to produce better software or to face harder CS research\
    \ problems in the future. The founders of ACM International Collegiate Programming\
    \ Contest (ICPC) [27] have this vision and we, the authors, agree with it. With\
    \ this book, we play our little roles in preparing current and future generations\
    \ to be more competitive in dealing with well-known CS problems frequently posed\
    \ in recent ICPCs and International Olympiad in Informatics (IOI).\n\nIllustration\
    \ on solving UVa Online Judge [17] Problem Number 10911 (Forming Quiz Teams).\n\
    \nAbridged problem description: Let (x,y) be the coordinate of a student’s house\
    \ on a 2-D plane. There are 2N students and we want to pair them into N groups.\
    \ Let dᵢ be the distance between the houses of 2 students in group i. Form N groups\
    \ such that \\(\\sum_{i=1}^{N} d_i\\) is minimized. Constraints: N ≤ 8; 0 ≤ x,\
    \ y ≤ 1000. Think first, try not to flip this page immediately!"
  - '[PAGE 13]


    Now, ask yourself, which one is you? Note that if you are unclear with the materials
    or terminologies shown in this chapter, you can re-read it after going through
    this book once.


    +   - Non-competitive programmer A (a.k.a the blurry one):

    +     Step 1: Read the problem... confused @-@, never see this kind of problem
    before.

    +     Step 2: Try to code something... starting from reading non-trivial input
    and output.

    +     Step 3: Realize that all his attempts fail:

    +       **Greedy solution**: pair students based on shortest distances gives **Wrong
    Answer (WA)**.

    +       **Complete search** using backtracking gives **Time Limit Exceeded (TLE)**.

    +       After 5 hours of labor (typical contest time), no **Accepted (AC)** solution
    is produced.

    +   - Non-competitive programmer B (Give up):

    +     Step 1: Read the problem...

    +     Then realize that he has seen this kind of problem before.

    +     But also remember that he has not learned how to solve this kind of problem...

    +     He is not aware of a simple solution for this problem: **Dynamic Programming
    (DP)**...

    +     Step 2: Skip the problem and read another problem.

    +   - (Still) non-competitive programmer C (Slow):

    +     Step 1: Read the problem and realize that it is a ''matching on general
    graph'' problem.

    +     In general, this problem **must** be solved using **''Edmond''s Blossom
    Shrinking''** [34].

    +     But since the input size is small, this problem is solve-able using Dynamic
    Programming!

    +     Step 2: Code I/O routine, write recursive top-down DP, test the solution,
    **debug** >_<...

    +     Step 3: *Only after 3 hours*, his solution is judged as AC (passed all secret
    test data).

    +   - Competitive programmer D:

    +     Same as programmer C, but do all those steps above in less than 30 minutes.

    +   - Very Competitive programmer E:

    +     Of course, a very competitive programmer (e.g. the red ''target'' coders
    in TopCoder [26]) may solve this ''classical'' problem in less than 15 minutes...


    # ## 1.2 Tips to be Competitive


    If you strive to be like competitive programmer D or E in the illustration above.
    That is, you want to do well to qualify and get a medal in IOI [12]; to qualify
    in ACM ICPC [27] national, regional, and up to world final; or in other programming
    contests, then this book is definitely for you!


    In subsequent chapters, you will learn basic to medium data structures and algorithms
    frequently appearing in recent programming contests, compiled from many sources
    [19, 6, 20, 2, 4, 14, 21, 16, 23, 1, 13, 5, 22, 15, 47, 24] (see Figure 1.5).
    But you will not just learn the algorithm, but also how to implement them efficiently
    and apply them to appropriate contest problem.


    On top of that, you will also learn many tiny bits of programming tips from our
    experience that can be helpful in contest situation. We will start by giving you
    few general tips below:


    # **Tip 0: Type Code Faster!**


    No kidding! Although this tip may not mean much as ICPC nor IOI are about typing
    speed competition, but we have seen recent ICPCs where rank *i* and rank *i +
    1* are just separated by few minutes. When you can solve the same number of problems
    as your competitor, it is now down to coding skill and ... typing speed.'
  - '[PAGE 14]


