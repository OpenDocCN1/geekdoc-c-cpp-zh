    \n图 2.8：将数组 A 更新为 {8, 7, 3, 9, 5, 100, 10}。只有叶到根节点受到影响。\n\n我们的线段树库实现如下所示。这里展示的代码支持静态的区间最小/最大/求和查询（动态更新部分留作练习）。当然，还有其他实现线段树的方法，例如一种更高效的版本，仅在需要时扩展区间。\n\
    \n```cpp\n#include <iostream>\n#include <math.h>\n#include <vector>\nusing namespace\
    \ std;\n\n// Segment Tree Library\n// The segment tree is stored like a heap array\n\
    #define RANGE_SUM 0\n#define RANGE_MIN 1\n#define RANGE_MAX 2\nvi segment_tree;\n\
    \nvoid init_segment_tree(int N) { // if original array size is N,\n    // the\
    \ required segment_tree array length is 2*2^(floor(log2(N)) + 1);\n    int length\
    \ = (int) (2 * pow(2.0, floor(log((double)N) / log(2.0)) + 1));\n    segment_tree.resize(length,\
    \ 0); // resize this vector and fill with 0\n}\n\nvoid build_segment_tree(int\
    \ code, int A[], int node, int b, int e) {\n    if (b == e) { // as b == e, either\
    \ one is fine\n        if (code == RANGE_SUM) segment_tree[node] = A[b]; // store\
    \ value of this cell\n        else                  segment_tree[node] = b;  \
    \   // if RANGE_MIN/MAXIMUM, store index\n    }\n```\n"
