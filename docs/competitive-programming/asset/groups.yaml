    - 29. UVa 11408 - 计算 DePrimes\n- 30. UVa 11466 - 最大素因数\n\n### 5.3.2 最大公约数（GCD）与最小公倍数（LCM）\n\
    \n两个整数 $(a, b)$ 的最大公约数（GCD），记作 $gcd(a,b)$，定义为满足 $d \\mid a$ 且 $d \\mid b$ 的最大正整数\
    \ $d$，其中 $x \\mid y$ 表示 $x$ 整除 $y$。GCD 示例：$gcd(4,8) = 4$、$gcd(10,5) = 5$、$gcd(20,12)\
    \ = 4$。GCD 的一个实际用途是化简分数，例如 $\\frac{4}{8} = \\frac{4/gcd(4,8)}{8/gcd(4,8)} = \\\
    frac{1}{2}$。\n\n使用高效的欧几里得算法 [20, 4] 求两个整数之间的 GCD 是一件容易的事，它可以实现为一行代码（见下文）。因此，在数学相关的竞赛题中，求\
    \ GCD 通常不是真正的问题，而只是更大解决方案的一部分。\n\nGCD 与最小（或最低）公倍数（LCM）密切相关。两个整数 $(a, b)$ 的 LCM，记作\
    \ $lcm(a,b)$，定义为满足 $a \\mid l$ 且 $b \\mid l$ 的最小正整数 $l$。LCM 示例：$lcm(4,8) = 8$、$lcm(10,5)\
    \ = 10$、$lcm(20,12) = 60$。文献 [20] 已证明：$lcm(a,b) = a \\times b/gcd(a,b)$。这也可以实现为一行代码（见下文）。\n\
    \n```cpp\nint gcd(int a, int b) { return (b == 0 ? a : gcd(b, a % b)); }\nint\
    \ lcm(int a, int b) { return (a * (b / gcd(a, b))); } // divide before multiply!\n\
    ```\n\n多于 2 个数的 GCD，例如 $gcd(a,b,c)$，等于 $gcd(a,gcd(b,c))$，依此类推；LCM 也类似。GCD 和 LCM\
    \ 算法的运行时间均为 $O(\\log_{10} n)$，其中 $n = max(a,b)$。\n\n与 GCD 和/或 LCM 相关的编程练习：\n\n\
    - 1. UVa 332 - 由循环小数得到有理数\n- 2. UVa 412 - Pi\n- 3. UVa 530 - 二项式对决\n- 4. UVa 10193\
    \ - 你只需要爱\n- 5. UVa 10407 - 简单除法\n- 6. UVa 10680 - LCM\n- 7. UVa 10717 - 铸币厂（需要在\
    \ LCM/GCD 基础上进行完全搜索）\n- 8. UVa 10791 - 最小和 LCM（素因数分解 + 棘手情况）\n- 9. UVa 10892 -\
    \ LCM 基数\n- 10. UVa 11388 - GCD LCM（必须理解 GCD 与 LCM 之间的关系）\n- 11. UVa 11417 - GCD\n\
    \n### 5.3.3 欧拉函数（Phi 函数）\n\n既然我们已经讨论了素数和 GCD，现在可以定义互素。两个整数 $a$ 和 $b$ 若满足 $gcd(a,b)\
    \ = 1$，则称它们互素，例如 25 和 42。\n\n有一个有趣的问题：找出小于 $N$ 且与 $N$ 互素的正整数（见下面的编程练习）。朴素算法从 counter\
    \ = 0 开始，遍历 $i \\in [1 \\ldots N]$，如果 $gcd(i,N) = 1$ 就增加计数器，但对于很大的 $N$ 这会很慢。\n\
    \n更好的算法是欧拉函数（Phi 函数）[36]。欧拉 phi 函数 $\\varphi(N)$ 用于计算上述问题的解。$\\varphi(N) = N \\\
    times \\prod_{p \\mid N}(1 - \\frac{1}{p})$，其中我们遍历 $N$ 的所有素因数。例如 $N = 36 = 2^2\
    \ \\times 3^2$。$\\varphi(36) = 36 \\times (1 - \\frac{1}{2}) \\times (1 - \\frac{1}{3})\
    \ = 12$。\n\n事实上，小于或等于 36 且与 36 互素的整数只有 12 个。它们是 1、5、7、11、13、17、19、23、25、29、31\
    \ 和 35。由于我们需要分解 $N$，该算法的复杂度与前面提到的用试除法分解整数的复杂度相似。代码如下。\n\n```cpp\nint EulerPhi(int\
    \ N) {\n  vi factors = primeFactors(N);\n  vi::iterator new_end = unique(factors.begin(),\
    \ factors.end()); // get unique\n  int result = N;\n  for (vi::iterator i = factors.begin();\
    \ i != new_end; i++)\n    result = result / *i;\n  return result;\n}\n```\n\n\
    与欧拉函数（Phi 函数）相关的编程练习：\n\n- 1. UVa 10179 - 不可约基本分数（欧拉 Phi 函数的直接应用）\n- 2. UVa 10299\
    \ - 亲戚（欧拉 Phi 函数的另一个直接应用）\n- 3. UVa 10820 - 发送一个表格（a[i] = a[i - 1] + 2 × φ(i)）\n\
    - 4. UVa 11064 - 数论\n- 5. UVa 11327 - 枚举有理数\n\n### 5.3.4 扩展欧几里得：求解线性丢番图方程\n\n\
    引例：假设一位家庭主妇买了苹果和橙子，总花费为 8.39 SGD。如果每个苹果 25 分、每个橙子 18 分，那么她每种水果各买了多少个？\n\n这个问题可以建模为含两个变量的线性方程：$25x\
    \ + 18y = 839$。由于我们知道 $x$ 和 $y$ 都必须是整数，因此这个线性方程称为线性*丢番图*方程。即使只有一个方程，我们也能求解含两个变量的线性丢番图方程！这与第\
    \ 5.5.5 节后面讨论的线性方程组不同。线性丢番图方程的解法如下 [20]。\n\n设 $a$ 和 $b$ 为整数，且 $d = gcd(a, b)$。若\
    \ $d \\mid c$ 不成立，则方程 $ax + by = c$ 没有整数解。但如果 $d \\mid c$，则有无穷多个整数解。第一个解 $(x_0,\
    \ y_0)$ 可以用下文所示的*扩展欧几里得*算法求出（另见 [4, 第 31 章]），其余解可由 $x = x_0 + (b/d)n$、$y = y_0\
    \ - (a/d)n$ 导出，其中 $n$ 为整数。\n\n```cpp\n// store x, y, and d as global variables\n\
    void extendedEuclid(int a, int b) {\n  if (b == 0) { x = 1; y = 0; d = a; return;\
    \ }\n  extendedEuclid(b, a % b);\n  int x1 = y;\n  int y1 = x - (a / b) * y;\n\
    \  x = x1;\n  y = y1;\n}\n```\n\n使用 `extendedEuclid`，可以轻松求解含两个变量的线性丢番图方程。\n\n\
    对于上面的引例：$25x + 18y = 839$，我们有：$a = 25, b = 18, \\text{extendedEuclid}(25, 18)\
    \ = ((-5, 7), 1)$，即 $25 \\times (-5) + 18 \\times 7 = 1$。\n\n将上述方程的左右两边同时乘以 $839/\\\
    gcd(25, 18) = 839$，得到：$25 \\times (-4195) + 18 \\times 5873 = 839$。因此，$x = -4195\
    \ + (18/1)n,\\ y = 5873 - (25/1)n$。\n\n由于我们需要 $x$ 和 $y$ 非负，因此有：$-4195 + 18n \\\
    geq 0$ 且 $5873 - 25n \\geq 0$，即 $4195/18 \\leq n \\leq 5873/25$，即 $233.05 \\leq\
    \ n \\leq 234.92$。\n\n$n$ 唯一可能的整数是 234。\n\n因此 $x = -4195 + 18 \\times 234 = 17$，$y\
    \ = 5873 - 25 \\times 234 = 23$，即她买了 17 个苹果（每个 25 分）和 23 个橙子（每个 18 分），总花费为 8.39\
    \ SGD。\n\n与扩展欧几里得算法相关的编程练习：\n\n- 1. UVa 718 - 摩天大楼楼层\n- 2. UVa 10090 - 弹珠（使用线性丢番图方程的解）\n\
    - 3. UVa 10104 - 欧几里得问题（纯扩展欧几里得问题）\n\n### 5.3.5 模运算\n\n编程问题中的一些数学计算最终可能产生非常大的正数（或非常小的负数）结果，超出最大整数数据类型的范围（目前是\
    \ C++ 中的 64 位 `long long`）。有时，我们只关心结果对某个数取模后的值。\n\n例如，在 UVa 10176 - 海洋深处！让它变浅！！中，要求我们将一个很长的二进制数（最多\
    \ 100 位）转换为十进制。快速计算可知，可能的最大数为 $2^{100} - 1$，这超出了 64 位整数的范围。然而，该问题只问结果是否能被 131071\
    \ 整除。因此，我们需要做的是逐位将二进制转换为十进制，然后快速对中间结果执行模 131071 运算。如果最终结果为 0，那么该二进制表示的实际数（我们从未真正计算它）就能被\
    \ 131071 整除。\n\n与模运算相关的编程练习：\n\n- 1. UVa 374 - 大数取模\n- 2. UVa 602 - 今天星期几？\n-\
    \ 3. UVa 10174 - 夫妻—单身汉—老处女数\n- 4. UVa 10176 - 海洋深处！让它变浅！！（如上所述）\n- 5. UVa 10212\
    \ - 最后一个非零数字\n- 6. UVa 10489 - 巧克力盒\n- 7. LA 4104 - MODEX\n"
