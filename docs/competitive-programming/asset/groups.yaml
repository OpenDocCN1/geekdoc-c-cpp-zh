    \ is the Ford Fulkerson’s method – invented by the same Lester Randolph Ford Jr.\
    \ who created Bellman Ford’s algorithm and Delbert Ray Fulkerson. The pseudo code\
    \ is like this:\n\n```text\nmax_flow = 0\nwhile (there exists an augmenting path\
    \ p from s to t) { // iterative algorithm\n    augment flow f along p, i.e.\n\
    \        f = min edge weight in the path p\n        max_flow += f // we can send\
    \ flow f from s to t\n        forward edges -= f // reduce capacity of those edges\n\
    \        backward edges += f // increase capacity of reverse edges\n}\noutput\
    \ max_flow\n```\n\nThere are several ways to find an augmenting path in the pseudo\
    \ code above, each with different time complexity. In this section, we highlight\
    \ two ways: via DFS or via BFS.\n\nFord Fulkerson's method implemented using DFS\
    \ can run in $O(f^*E)$ where $f^*$ is the max_flow value. This is because we can\
    \ have a graph like in Figure 4.22 where every path augmentation only decreases\
    \ the edge capacity along the path by 1. This is going to be repeated $f^*$ times.\
    \ In Figure 4.22, it is 200 times. The fact that the number of edges in the flow\
    \ graph is $E \\ge V - 1$ to ensure $\\exists \\ge 1$ s-t flow dictates that a\
