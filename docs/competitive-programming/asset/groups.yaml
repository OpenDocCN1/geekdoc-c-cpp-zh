  mdcn: "\n\n## 最小费用（最大）流\n\n最小费用流问题是指寻找通过流网络发送一定量流量（通常为最大流）的*最便宜*方式的问题。在该问题中，每条边都有两个属性：通过该边的流量容量以及使用该边的费用。最小费用（最大）流，简称\
    \ MCMF，可以通过将 Edmonds Karp 算法中用于寻找增广路径的 BFS 替换为 Bellman-Ford 算法（Dijkstra 算法可能不适用，因为残量流图中的边权可能为负）来解决。\n\
    \nFord Fulkerson / Edmonds Karp 算法的编程练习：\n\n- Edmonds Karp 标准应用（最大流/最小割）\n  -\
    \ 1. UVa 820 - Internet Bandwidth（本节讨论）\n  - 2. UVa 10480 - Sabotage（最小割）\n  -\
    \ 3. UVa 10779 - Collector's Problem（最大流）\n  - 4. UVa 11506 - Angry Programmer（最小割）\n\
    - 变体\n  - 1. UVa 563 - Crimewave（最大独立路径：单位边容量和顶点容量）\n  - 2. UVa 10330 - Power\
    \ Transmission（带顶点容量，本节讨论）\n  - 3. UVa 10511 - Councilling\n  - 4. UVa 10594 -\
    \ Data Flow（基础 MCMF 问题）\n  - 5. UVa 10806 - Dijkstra, Dijkstra.（最大边不相交路径 + 最小费用）\n\
    \n## 4.9 特殊图\n\n如果给定图是*特殊*的，一些基本图问题可以有更简单/更快的多项式算法。到目前为止，我们识别出了编程竞赛中常见的以下特殊图：**树**、**有向无环图（DAG）**和**二分图**。出题者可能会通过给出大数据规模，将针对一般图的正确算法判定为超时（TLE），从而迫使参赛者针对这些特殊图使用专门算法。在本节中，我们将讨论这些特殊图上的一些流行图问题（参见图\
    \ 4.25）。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_96_0.png)\n\n图 4.25：特殊图（左到右）：树、有向无环图、二分图\n\
    \n### 4.9.1 树\n\n树是一种具有以下特征的特殊图：有 $E = V - 1$（任何 $O(V + E)$ 算法都是 $O(V)$），没有环，连通，且任意一对顶点之间存在唯一路径。\n\
    \n#### 寻找树中的关节点和桥\n\n在 4.2 节中，我们已经看到了用于寻找图的关节点和桥的 $O(V + E)$ Tarjan DFS 算法。然而，如果给定图是一棵树，问题就变得更简单：树上的所有边都是桥，所有内部顶点（度\
    \ > 1）都是关节点。这仍然是 $O(V)$，因为我们必须扫描树来计算内部顶点的数量，但代码更简单。\n\n#### 加权树上的单源最短路径\n\n在 4.5\
    \ 和 4.6 节中，我们看到了两种用于解决加权图上 SSSP 问题的通用算法（$O((E + V) \\log V)$ 的 Dijkstra 算法和 $O(VE)$\
    \ 的 Bellman-Ford 算法）。然而，如果给定图是一棵树，SSSP 问题就变得更简单：任何 $O(V)$ 的图遍历算法（即 BFS 或 DFS）都可以用来解决此问题。树中任意两个顶点之间只有一条唯一路径，因此我们只需遍历树来找到连接这两个顶点的路径，而这两个顶点之间的最短路径基本上就是这条唯一路径的边权之和。\n\
    \n#### 加权树上的全源最短路径\n\n在 4.7 节中，我们看到了一个用于解决加权图上 APSP 问题的通用算法（$O(V^3)$ 的 Floyd Warshall\
    \ 算法）。然而，如果给定图是一棵树，APSP 问题就变得更简单：从每个顶点重复 SSSP 过程 $V$ 次，因此复杂度为 $O(V^2)$。\n\n但这仍然可以改进到\
    \ $O(V + Q \\times L)$：其中 $Q$ 是查询次数，$L$ 是最低公共祖先（LCA）实现的复杂度（更多细节参见 [40]）。我们从任意顶点\
    \ $v$ 运行一次 $O(V)$ 的 DFS/BFS，以找出 $dist[v]$ 到树中其他顶点的距离。然后，我们可以通过报告 $dist[v][i] +\
    \ dist[v][j] - 2 \\times dist[v][LCA(i, j)]$ 来回答该树上的任何最短路径查询 $(i, j)$。\n\n####\
    \ 树的直径\n\n图的直径定义为任意一对顶点之间的最大距离。要找到图的直径，我们首先要找到每对顶点之间的最短路径（APSP 问题）。这些路径中的最大长度就是图的直径。对于一般图，我们可能需要\
    \ 4.7 节中讨论的 $O(V^3)$ Floyd Warshall 算法。然而，如果给定图是一棵树，问题就变得更简单：从任意节点 $s$ 执行 DFS/BFS\
    \ 找到最远的顶点 $x$，然后从顶点 $x$ 再执行一次 DFS/BFS，得到从 $x$ 出发真正最远的顶点 $y$。沿着 $x$ 到 $y$ 的唯一路径长度就是该树的直径。这个解法只需要调用两次\
    \ $O(V)$ 的图遍历算法。\n\n#### 树上的最大加权独立集\n\n在 3.4 节中，我们展示了一个树形 DP 示例，它在 $O(V)$ 时间内解决了树上的最大加权独立集（MWIS）问题。在下面的\
    \ 4.9.3 节中，我们将重新讨论二分图上的这个问题，它可以归约为最大流问题，并使用 Edmonds Karp 算法在 $O(VE^2)$ 时间内运行。然而，该问题在一般图上是\
    \ NP 完全的。\n\n与树相关的编程练习（另见 3.4.3 节“树形 DP”主题）：\n\n- 1. UVa 112 - Tree Summing（回溯）\n\
    - 2. UVa 115 - Climbing Trees（树遍历，LCA）\n- 3. UVa 122 - Trees on the level（树遍历）\n\
    - 4. UVa 536 - Tree Recovery（树遍历，从前序+中序重建树）\n- 5. UVa 615 - Is It A Tree?（图性质检查）\n\
    - 6. UVa 699 - The Falling Leaves（前序遍历）\n- 7. UVa 712 - S-Trees（树遍历）\n- 8. UVa\
    \ 10308 - Roads in the North（树的直径，本节讨论）\n- 9. UVa 10459 - The Tree Root（树的直径+中心）\n\
    - 10. UVa 10701 - Pre, in and post（从前序+中序重建树）\n- 11. UVa 10938 - Flea Circus（使用\
    \ LCA）\n- 12. UVa 11695 - Flight Planning（树的直径+中心）\n\n### 4.9.2 有向无环图\n\n有向无环图，缩写为\
    \ DAG，是一种具有以下特征的特殊图：有向且无环。\n\n#### DAG 上的单源最短路径\n\n如果给定图是 DAG，单源最短路径（SSSP）问题会变得简单得多，因为\
    \ DAG 至少有一个拓扑序！我们可以使用 4.2 节中的 $O(V+E)$ 拓扑排序算法找到一个这样的拓扑序，然后按照该顺序松弛边。拓扑序将确保如果顶点\
    \ $b$ 有一条来自顶点 $a$ 的入边，那么顶点 $b$ 会在顶点 $a$ 之后被松弛。这样，只需一次 $O(V+E)$ 的线性遍历，距离信息的传播就是正确的！\n\
    \n#### DAG 上的单源最长路径\n\n单源最长路径问题，即从起始顶点 $s$ 出发寻找最长路径，在一般图上是 NP 完全的 [39]。然而，如果图没有环（在\
    \ DAG 中确实如此），该问题又变得容易了。DAG 中的最长路径（又称关键路径）的解法只是对上述 DAG 中 SSSP 解法的一个小改动，即只需将所有边权取反。\n\
    \n#### DAG 上的最小路径覆盖\n\n动机问题：想象图 4.26.A 中的顶点是乘客，如果一辆出租车可以按时先服务乘客 $u$ 再服务乘客 $v$，我们就在两个顶点\
    \ $u-v$ 之间画一条边。问题是：必须部署多少辆出租车才能服务所有乘客？\n\n上述动机问题的答案是两辆出租车。在图 4.26.D 中，我们看到一个可能的解决方案。一辆出租车（红色虚线）服务乘客\
    \ 1（红色）、乘客 2（蓝色），然后乘客 4（黄色）。另一辆出租车（绿色虚线）服务乘客 3（绿色）和乘客 5（橙色）。所有乘客只需两辆出租车即可服务。\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_99_0.png)\n\n图 4.26：DAG 中的最小路径覆盖（来自\
    \ LA 3126 [11]）\n\n通常，DAG 中的最小路径覆盖（MPC）问题描述为：找到覆盖 DAG $G = (V, E)$ 中*每个顶点*的最少路径数。\n\
    \n该问题有一个多项式解法：从 G 构造二分图 $G' = (V_{out} \\cup V_{in}, E')$，其中 $V_{out} = \\{v \\\
    in V : v \\text{ 的出度为正}\\}$，$V_{in} = \\{v \\in V : v \\text{ 的入度为正}\\}$，且 $E'\
    \ = \\{(u,v) \\in V_{out} \\times V_{in} : (u,v) \\in E\\}$。这个 $G'$ 是一个二分图。在二分图\
    \ $G'$ 上寻找匹配迫使我们从每个 $v \\in V_{out}$ 中选择至多一条出边（对于 $V_{in}$ 类似）。DAG G 初始有 $n$ 个顶点，可以用\
    \ $n$ 条长度为 0 的路径（顶点本身）覆盖。使用边 $(a, b)$ 在顶点 $a$ 和顶点 $b$ 之间的一次匹配表示我们可以少用一条路径，因为它可以同时覆盖顶点\
    \ $a \\in V_{out}$ 和 $b \\in V_{in}$。因此，如果 $G'$ 中的最大基数二分匹配（MCBM）大小为 $m$，那么我们只需要\
    \ $n - m$ 条路径来覆盖 G 中的每个顶点。\n\n解决 G 中 MPC 所需的 $G'$ 中的 MCBM 将在下面讨论。二分匹配的解法是多项式的，因此\
    \ DAG 中 MPC 的解法也是多项式的。请注意，一般图中的 MPC 是 NP 完全的 [42]。\n\n与 DAG 相关的编程练习：\n\n- DAG\
    \ 上的单源最短/最长路径\n  - 1. UVa 103 - Stacking Boxes\n  - 2. UVa 10000 - Longest Paths\n\
    \  - 3. UVa 10166 - Travel（最短路径）\n  - 4. UVa 10029 - Edit Step Ladders\n  - 5.\
    \ UVa 10350 - Liftless EME（最短路径）\n  - 6. UVa 11324 - The Largest Clique（先找 SCC，再在\
    \ DAG 上求最长路径）\n  - 7. LA 3294 - The Ultimate Bamboo Eater（使用二维线段树）\n  - 8. Ural/Timus\
    \ OJ 1450 - Russian pipelines\n  - 9. PKU 3160 - Father Christmas flymouse\n-\
    \ DAG 中的路径计数\n  - 1. UVa 825 - Walking on the Safe Side（图是 DAG，DP）\n  - 2. UVa\
    \ 926 - Walking Around Wisely（图是 DAG，DP）\n  - 3. UVa 988 - Many paths, one destination（拓扑排序\
    \ + DAG 上的 DP）\n\n"
