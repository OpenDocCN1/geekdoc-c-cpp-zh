  - "[PAGE 65]\n\nAbridged problem statement: Given a weighted graph $G$, find Max\
    \ Weighted Independent Set (MWIS) on it. A subset of vertices of graph $G$ is\
    \ said to be Independent Set (IS) if there is no edge in $G$ between any two vertices\
    \ in the IS. Our task is to select an IS with maximum weight of $G$. If graph\
    \ $G$ is a tree, this problem has easy DP solution (see Figure 3.12).\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_65_0.png)\n\
    \nFigure 3.13: Root the Tree\n\nTip: For almost tree-related problems, we need\
    \ to ‘root the tree’ first if it is not yet rooted. If the tree does not have\
    \ a vertex dedicated as root, pick an arbitrary vertex as the root. By doing this,\
    \ the subproblems w.r.t subtrees may appear, like in this MWIS problem on Tree\
    \ (See Figure 3.13).\n\nOnce we have a rooted (sub)tree, we can formulate MWIS\
    \ recurrences w.r.t their children. One formulation is: $C(v, selected) =$ max\
    \ weight of subtree rooted at ‘v’ if it is ‘selected’.\n\n+   **Base cases (the\
    \ leaves):**\n+   \n+   A. If leaf $v$ is not selected, MWIS rooted at $v$ is\
    \ 0.\n+   \n+   $C(v, false) = 0$ for all leaves $v$\n+   \n+   B. If leaf $v$\
    \ is selected, MWIS rooted at $v$ is the weight of $v$.\n+   \n+   $C(v, true)\
    \ = w(v)$ for all leaves $v$\n\n+   **Recurrence relations (the internal nodes):**\n\
    +   \n+   A. If root $v$ is taken, add weight of $v$ but all children of $v$ cannot\
    \ be taken.\n+   \n+   $C(v, true) = \\sum_{ch \\in children(v)} C(ch, false)\
    \ + w(v)$\n+   \n+   B. If root $v$ is not taken, children of $v$ may or may not\
    \ be taken (pick the maximum one).\n+   \n+   $C(v, false) = \\sum_{ch \\in children(v)}\
    \ \\max(C(ch, false), C(ch, true))$\n\nAnswer will be in the root: $\\max(C(root,\
    \ false), C(root, true))$. DP solution can be implemented either in a top-down\
    \ or bottom-up fashion. As there are only $2 \\times V$ states, the DP solution\
    \ runs in $O(kV)$ where $k$ is the average number of children of a vertex in the\
    \ tree!\n\nLesson: Optimization problems on tree may be solved with DP techniques.\
    \ The solution usually involves passing information to parent and getting information\
    \ from the children of a rooted tree.\n\n# 3.4.4 Remarks About Dynamic Programming\
    \ in Programming Contests\n\nIn the past (1990s), if a contestant is good with\
    \ DP, he can become a ‘king of programming contests’ as usually DP problems are\
    \ the ‘deciding problem’. But now, mastering DP is a basic requirement! You cannot\
    \ do well in contests without this knowledge. However, we have to keep reminding\
    \ the readers of this book not to claim that they know DP by memorizing the solutions\
    \ of classical DP problems! Try to go to the basics of problem solving using DP:\
    \ Determine states (the table)\n\n⁸FYI: The complement of Independent Set is Vertex\
    \ Cover."
