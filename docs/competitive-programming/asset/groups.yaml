  mdcn: "\n### 2.2.2 非线性数据结构\n\n对于某些计算问题，除了按顺序排列数据之外，还有其他更好的组织数据方式。通过高效实现下面所示的非线性数据结构，你可以更快地搜索条目，从而加速使用这些结构的算法。\n\
    \n例如，如果你想存储一个动态的配对集合（如 name → index 对），那么使用下面的 C++ STL `<map>` 只需几行代码就能获得 **O(log\
    \ n)** 的插入/搜索/删除性能；而如果将同样的信息存储在一个静态的 `struct` 数组中，插入/搜索/删除可能需要 **O(n)** 的时间，而且你必须自己编写代码。\n\
    \n- **栈：** C++ STL `<stack>`（Java Stack）  \n  这种数据结构作为算法的一部分用于解决特定问题（例如后缀表达式计算、7.3\
    \ 节中的 Graham 扫描）。栈只允许从顶部进行插入（push）和删除（pop）。这种行为称为后进先出（LIFO），与现实世界中的普通栈相同。典型操作有\
    \ `push()`/`pop()`（从栈顶插入/移除）、`top()`（获取栈顶内容）、`empty()`。\n\n- **队列：** C++ STL `<queue>`（Java\
    \ Queue）  \n  这种数据结构用于广度优先搜索（BFS）等算法中（4.3 节）。队列只允许从后端（rear）插入（enqueue），且只允许从头部（front）删除（dequeue）。这种行为称为先进先出（FIFO），与现实世界中的普通队列类似。典型操作有\
    \ `push()`/`pop()`（从队列后端插入/从队列前端取出）、`front()`/`back()`（获取队列前端/后端的内容）、`empty()`。\n\
    \n- **平衡二叉搜索树（BST）：** C++ STL `<map>`/`<set>`（Java TreeMap/TreeSet）  \n  BST 是一种将数据组织成树结构的方式。在每个以\
    \ x 为根的子树中，BST 性质成立：x 左子树中的项都小于 x，x 右子树中的项都大于（或等于）x。这样组织数据（见图 2.1 左）允许 **O(log\
    \ n)** 的插入、搜索和删除，因为执行这些操作只需要 **O(log n)** 最坏情况下的根到叶扫描（详见 [4]）——但这仅在 BST 是平衡的时才有效。\
    \  \n    \n    实现一棵 *无 bug* 的平衡 BST（如 AVL² 树或红黑（RB）树）在时间受限的比赛环境中是繁琐且困难的。幸运的是，C++\
    \ STL 提供了 `<map>` 和 `<set>`，它们通常就是 RB 树的实现，因此所有操作都是 **O(log n)**。精通这两个 STL 模板可以在比赛中节省大量宝贵的编码时间！区别很简单：`<map>`\
    \ 存储（键 → 数据）对，而 `<set>` 只存储键。\n\n- **堆：** C++ STL `<queue>`：`priority_queue`（Java\
    \ PriorityQueue）  \n  堆是另一种将数据组织成树结构的方式。堆也像 BST 一样是二叉树，但它必须是 *完全* 的。与强制 BST 性质不同，堆强制的是堆性质：在每个以\
    \ x 为根的子树中，x 的左、右子树中的项都小于 x（见图 2.1 右）。这个优先级保证了堆顶是最大元素。堆中通常没有“搜索”的概念，只有插入和删除，这些操作可以通过遍历\
    \ **O(log n)** 的叶到根或根到叶路径轻松完成 [4]。\n\n² 然而，对于一些棘手的比赛问题，你必须“增强你的数据结构”（见 [4] 第 14\
    \ 章），此时需要 AVL 树的知识，因为 C++ STL `<map>` 或 `<set>` 无法轻松地增强。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_28_0.png)\n\
    \n图 2.1：BST（左）和堆（右）的示例\n\n堆非常适合模拟优先队列，其中具有最高优先级的项可以在 O(log n) 时间内删除，新项也可以在 O(log\
    \ n) 时间内插入优先队列。`priority_queue` 的实现可在 C++ STL `<queue>` 中找到。优先队列是某些算法的重要组成部分，例如解决最小生成树（MST）问题的\
