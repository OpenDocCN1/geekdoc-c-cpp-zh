  mdcn: "\n## 3.1.2 技巧\n\n编写完全搜索解法时最大的风险在于它能否通过时间限制。如果限制是 1 分钟，而你的程序当前运行 1 分 5 秒，你可能更想先调整程序的“关键代码”，而不是痛苦地用更快的算法重做此题——设计更快的算法可能并不简单。\n\
    \n在设计解法时，尤其是完全搜索解法时，你可以考虑以下技巧，以提高通过时间限制的机会。\n\n### 技巧 1：生成与过滤\n\n生成大量候选解，然后选出正确解（或剔除错误解）的程序称为“过滤器”——回想一下时间复杂度为\
    \ 8⁸ 的朴素 8 皇后求解器。那些不经过任何错误尝试而直接锁定正确答案的程序称为“生成器”——回想一下复杂度为 8! 并加上对角线检查的改进版 8 皇后求解器。\n\
    \n通常，过滤器更易于编码，但运行更慢。请计算一下，以判断过滤器是否足够好，或者是否需要编写生成器。\n\n### 技巧 2：尽早剪掉不可行的搜索空间\n\n\
    在生成解时（见上面的技巧 1），我们可能遇到永远不会通向完整解的部分解。我们可以在那里剪枝，转而探索其他部分。例如，看看上面 8 皇后解法中的对角线检查。假设我们已在\
    \ row[1] = 2 放置一个皇后，那么再在 row[2] = 1 或 row[2] = 3 放置一个皇后会导致对角线冲突，而在 row[2] = 2\
    \ 放置另一个皇后会导致行冲突。从这些分支中的任何一个继续下去都永远不会得到有效解。因此，我们可以就在这个节点剪掉这些分支，只关注 row[2] = {4,\
    \ 5, 6, 7, 8} 这些有效位置，从而节省总体运行时间。\n\n### 技巧 3：利用对称性\n\n有些问题具有对称性，我们应尝试利用对称性来减少执行时间！在\
    \ 8 皇后问题中，共有 92 个解，但由于该问题存在旋转和反射对称性，只有 12 个唯一（或基本）解 [35]。你可以利用这一事实，只生成这 12 个唯一解；如果需要，再通过旋转和反射这\
    \ 12 个唯一解来生成全部 92 个解。\n\n### 技巧 4：预计算（又称预先计算）\n\n有时，在程序本身执行之前生成表或其他数据结构，以便尽可能快地查找结果，会很有帮助。这称为预计算，即以内存/空间换取时间。\n\
    \n再次以上面的 8 皇后问题为例。如果我们知道只有 92 个解，那么可以创建一个二维数组 `int solution[92][8]`，然后用 8 个皇后行位置的全部\
    \ 92 个有效排列填充它！就是这样：我们编写一个生成器程序（会消耗一些运行时间）来填充这个二维数组 solution，但之后我们生成一个新程序并提交代码，该代码只打印出在\
    \ (a, b) 放置 1 个皇后时对应的正确排列（非常快）。\n\n### 技巧 5：尝试反向求解问题\n\n令人惊讶的是，有些竞赛题从反向求解时似乎比正面求解容易得多。要留意按逆序处理数据，或构建一种以非显而易见顺序审视数据的解题方法。\n\
    \n用一个例子最能说明这个技巧：UVa 10360 - Rat Attack（鼠灾）。简化的问题描述：想象一个包含老鼠的二维数组（最大 1024 × 1024）。某些单元格中有\
    \ n ≤ 20000 只老鼠，确定应该对哪个单元格 (x, y) 投放毒气弹，使得从 (x − d, y − d) 到 (x + d, y + d) 的方形区域内杀死的老鼠数量最多。值\
    \ d 是毒气弹的威力（d 最大为 50），见图 3.2。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_41_0.png)\n\
    \n图 3.2：UVa 10360 - Rat Attack（鼠灾）示意图，d = 1\n\n第一种选择是正面求解此问题：尝试轰炸 1024² 个单元格中的每一个，看看哪一个最有效。对于每个被轰炸的单元格\
    \ (x, y)，我们需要进行 O(d²) 次扫描，以统计方形轰炸半径内杀死的老鼠数量。在最坏情况下，数组大小为 1024² 且 d = 50，这需要 1024²\
    \ × 50² = 261M 次操作。显然会超时（TLE）！\n\n第二种选择是反向求解此问题：创建一个数组 int killed[1024][1024]。对于坐标\
    \ (x, y) 处的每个 n 只老鼠种群，将数组 killed[i][j] 的值加上：如果炸弹放置在 (i, j) 且 (i, j) 位于方形轰炸半径内（即\
    \ |i − x| ≤ d 且 |j − y| ≤ d），那么在 (x, y) 处会被杀死的老鼠数量。这个预处理需要 O(n × d²) 次操作。然后，为了确定最佳炸弹放置位置，我们找出数组\
    \ killed 中条目值最高的坐标，这可以在 O(1024²) 次操作内完成。对于最坏测试用例（n = 20000，d = 50），这种反向方法只需要 20000\
    \ × 50² + 1024² = 51M 次操作，比正面求解约快 5.1 倍！\n\n### 技巧 6：优化源代码\n\n有许多技巧可用于优化代码。理解计算机硬件，尤其是\
