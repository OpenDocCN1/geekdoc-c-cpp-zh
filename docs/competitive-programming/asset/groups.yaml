  - "[PAGE 50]\n\n```\n```cpp\n/* World Final 2009, A - A Careful Approach, LA 4445\
    \ (Accepted) */\n#include <algorithm>\n#include <cmath>\n#include <stdio.h>\n\
    using namespace std;\n\nint i, n, caseNo = 1, order[8];\ndouble a[8], b[8], timeGap,\
    \ maxTimeGap; // timeGap is the variable L mentioned in text\n\ndouble greedyLanding()\
    \ { // with certain landing order, and certain timeGap,\n                    \
    \     // try landing those planes and see what is the gap to b[order[n - 1]]\n\
    \  double lastLanding = a[order[0]]; // greedy, first aircraft lands immediately\n\
    \  for (i = 1; i < n; i++) { // for the other aircrafts\n    double targetLandingTime\
    \ = lastLanding + timeGap;\n    if (targetLandingTime <= b[order[i]])\n      //\
    \ this aircraft can land, greedily choose max of a[order[i]] or targetLandingTime\n\
    \      lastLanding = max(a[order[i]], targetLandingTime);\n    else\n      return\
    \ 1; // returning positive value will force binary search to reduce timeGap\n\
    \  }\n  // returning negative value will force binary search to increase timeGap\n\
    \  return lastLanding - b[order[n - 1]];\n}\n\nint main() {\n  while (scanf(\"\
    %d\", &n), n) { // 2 <= n <= 8\n    for (i = 0; i < n; i++) {\n      scanf(\"\
    %lf %lf\", &a[i], &b[i]); // [ai, bi] is the interval where plane i can land safely\n\
    \      a[i] *= 60; b[i] *= 60; // originally in minutes, convert to seconds\n\
    \      order[i] = i;\n    }\n\n    maxTimeGap = -1; // variable to be searched\
    \ for\n    do { // permute plane landing order, 8!\n      double lowVal = 0, highVal\
    \ = 86400; // min 0s, max 1 day = 86400s\n      timeGap = -1; // start with infeasible\
    \ solution\n      // This example code uses 'double' data type. This is actually\
    \ not a good practice\n      // Some other programmers avoid the test below and\
    \ simply use 'loop 100 times (precise enough)'\n      while (fabs(lowVal - highVal)\
    \ >= 1e-3) { // binary search timeGap, ERROR = 1e-3 is OK here\n        timeGap\
    \ = (lowVal + highVal) / 2.0;    // we just want the answer to be rounded to nearest\
    \ int\n        double retVal = greedyLanding();       // round down first\n  \
    \      if (retVal <= 1e-2) // must increase timeGap\n          lowVal = timeGap;\n\
    \        else // if (retVal > 0) // infeasible, must decrease timeGap\n      \
    \    highVal = timeGap;\n      }\n      maxTimeGap = max(maxTimeGap, timeGap);\
    \ // get the max over all permutations\n    }\n    while (next_permutation(order,\
    \ order + n)); // keep trying all permutations\n\n    // another way for rounding\
