    \ case one.\n\ncoin(< 0) = ∞, base case two.\n\ncoin(1) = 1, from 1 + coin(1−1),\
    \ as 1 + coin(1−5) is infeasible.\n\ncoin(2) = 2, from 1 + coin(2−1), as 1 + coin(2−5)\
    \ is also infeasible.\n\n... same thing for coin(3) and coin(4).\n\ncoin(5) =\
    \ 1, from 1 + coin(5−5) = 1 coin, smaller than 1 + coin(5−1) = 5 coins.\n\nAnd\
    \ so on until coin(10). The answer is in coin(10), which is 2.\n\nWe can see that\
    \ there are a lot of overlapping sub-problems in this Coin Change problem, but\
    \ there are only $O(V)$ possible states! As we need to try $O(N)$ coins per state,\
    \ the overall time complexity of this DP solution is $O(VN)$.\n\n## Maximum Sum\n\
    \nAbridged problem statement: Given an n x n (1 ≤ n ≤ 100) array of integers,\
    \ each ranging from [-127, 127], find a minimum sub-rectangle that has the maximum\
    \ value.\n\nExample: The 4 x 4 array (n = 4) below has 15 as the maximum sub-rectangle\
    \ value.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_58_0.png)\n\nNaïvely attacking\
    \ this problem as shown below does not work as it is an $100^6$ algorithm.\n\n\
    ```cpp\nmaxSubRect = -127*100*100; // lowest possible value for this problem\n\
    for (int i = 0; i < n; i++) for (int j = 0; j < n; j++) // start coord\n  for\
    \ (int k = i; k < n; k++) for (int l = j; l < n; l++) { // end coord\n    subRect\
    \ = 0; // sum items in this sub-rectangle\n    for (int a = i; a <= k; a++) for\
    \ (int b = j; b <= l; b++)\n      subRect += arr[a][b];\n    maxSubRect = max(maxSubRect,\
    \ subRect); // keep largest so far\n  }\n```\n\nSolution: There are several (well-known)\
    \ DP solutions for static range problem. DP can work in this problem as computing\
    \ a large sub-rectangle will definitely involves computing smaller sub-rectangles\
    \ in it and such computation involves overlapping sub-rectangles!\n\nOne possible\
    \ DP solution is to turn this n x n array into an n x n sum array where arr[i][j]\
    \ no longer counts its own value, but the sum of all items within sub-rectangle\
    \ (0, 0) to (i, j). This can easily be done on-the-fly when reading the input\
    \ and still $O(n^2)$.\n\n```cpp\nscanf(\"%d\", &n);\nfor (int i = 0; i < n; i++)\
    \ for (int j = 0; j < n; j++) {\n    scanf(\"%d\", &arr[i][j]);\n    if (i > 0)\
    \ arr[i][j] += arr[i - 1][j]; // if possible, add values from top\n    if (j >\
    \ 0) arr[i][j] += arr[i][j - 1]; // if possible, add values from left\n    if\
    \ (i > 0 && j > 0) arr[i][j] -= arr[i - 1][j - 1]; // to avoid double count\n\
    } // inclusion-exclusion principle\n```\n\nThis code turns input array (shown\
    \ in the left) into sum array (shown in the right):\n\n```text\n0  -2  -7   0\
    \    ==>    0  -2  -9  -9\n9   2  -6   2    ==>    9   9  -4   2\n-4  1  -4  \
    \ 1    ==>    5   6 -11  -8\n-1  8   0  -2    ==>    4  13  -4  -3\n```\n\nNow,\
    \ with this sum array, we can answer the sum of any sub-rectangle (i, j) to (k,\
    \ l) in $O(1)$! Suppose we want to know the sum of (1, 2) to (3, 3). We can split\
    \ the sum array into 4 sections and compute\n\n`arr[3][3] - arr[0][3] - arr[3][1]\
    \ + arr[0][1] = -3 - 13 - (-9) + (-2) = -9.`\n\n```text\n0 [-2] | -9 [-9]\n----------------\n\
    9   9  | -4   2\n5   6  | -11 -8\n4 [13]  -4 [-3]\n```\n\nWith this $O(1)$ DP\
    \ formulation, this problem can now be solved in $100^4$.\n\n```cpp\nmaxSubRect\
    \ = -127*100*100; // lowest possible value for this problem\nfor (int i = 0; i\
    \ < n; i++) for (int j = 0; j < n; j++) // start coord\n    for (int k = i; k\
    \ < n; k++) for (int l = j; l < n; l++) { // end coord\n        subRect = arr[k][l];\
    \ // this is sum of all items from (0, 0) to (k, l): O(1)\n        if (i > 0)\
    \ subRect -= arr[i - 1][l]; // O(1)\n        if (j > 0) subRect -= arr[k][j -\
    \ 1]; // O(1)\n        if (i > 0 && j > 0) subRect += arr[i - 1][j - 1]; // inclusion-exclusion:\
    \ O(1)\n        maxSubRect = max(maxSubRect, subRect);\n    }\n```\n\nLesson:\
    \ Not every range problems require Segment Tree as in Section 2.3.3! Problems\
    \ where the input data is static like this usually is solvable with DP technique.\n\
    \n- Exercise 1: The solution above runs in $100^4$. There exist $100^3$ solution.\
    \ Can you figure out how to formulate this solution?\n- Exercise 2: What if the\
    \ given static array is 1-D? Can you form a similar $O(1)$ DP solution to answer\
    \ range sum query(i, j), i.e. `arr[i] + arr[i+1] + ... + arr[j]`?\n- Exercise\
    \ 3: Use the solution from Exercise 2 to find maximum sum in 1-D array in $O(n^2)$.\
    \ Can you further improve the solution to $O(n)$?\n- Exercise 4: Now, what if\
    \ the query is range minimum query(i, j) on 1-D static array. The solution in\
    \ Section 2.3.3 uses Segment Tree. Can you just utilize DP to solve the same problem\
    \ -- assuming that this time there is no update operation?\n\n## Remarks\n\nThere\
    \ are other classical DP problems that we choose not to cover in this book such\
    \ as Matrix Chain Multiplication [4], Optimal Binary Search Tree [14], 0-1 Knapsack\
    \ [5, 14]. However, Floyd Warshall's will be discussed in Section 4.7; String\
    \ Edit Distance, Longest Common Subsequence (LCS), plus other DP on Strings in\
    \ Section 6.3.\n\n### 3.4.3 Non Classical Examples\n\nAlthough DP is one problem\
    \ type that is most frequently appears in recent programming contests, the classical\
    \ DP problems on their *pure forms* above usually never appear again in recent\
    \ ICPCs or IOIs. We have to study them to understand more about DP. But once we\
    \ do, we have to move on to solve many other non classical DP problems and build\
    \ up our ‘DP technique skills’. As you can see below, there are many interesting\
    \ DP techniques from simple to intermediate. Try solving these problems at the\
    \ corresponding online judges to further improve your DP skills. We have grouped\
    \ and ordered the following DP problems from *our* perceived level of difficulty\
    \ (easier to harder). There are DP trick lessons in each example. Enjoy :).\n\n\
    ### 1. Cutting Sticks (UVa 10003)\n\nAbridged problem statement: Given a stick\
    \ of length 1 ≤ l ≤ 1000, make 1 ≤ n ≤ 50 cuts to that stick (coordinates within\
    \ range (0 … l) are given). The cost of cut is determined by the length of the\
    \ stick to be cut. Find a cutting sequence so that the overall cost is minimized!\n\
    \nExample: l = 100, n = 3, and cut coordinates: coord = {25, 50, 75} (already\
    \ sorted)\n\nIf we cut from left to right, then we will incur cost = 225\n\n-\
    \ 1. Cut at coordinate 25, total cost = 100;\n- 2. Cut at coordinate 50, total\
    \ cost = 100 + 75 = 175;\n- 3. Cut at coordinate 75, total cost = 175 + 50 = 225;\n\
    \nHowever, the optimal answer is: 200\n\n- 1. Cut at coordinate 50, total cost\
    \ = 100;\n- 2. Cut at coordinate 25, total cost = 100 + 50 = 150;\n- 3. Cut at\
    \ coordinate 75, total cost = 150 + 50 = 200;\n\nSolution: Use this Complete Search\
    \ recurrences + top-down DP (memoization): cut(left, right)\n\n- 1. If (left +\
    \ 1 = right) where left and right are indices in array coord, then cut(left, right)\
    \ = 0 as we are left with 1 segment, there is no need to cut anymore.\n- 2. Otherwise,\
    \ try all possible cutting points and pick the minimum cost using code below:\n\
    \n```cpp\n// cost = initially infinity (a very large integer)\nfor (int i = left\
    \ + 1; i < right; i++) // max 50 steps\n    cost = min(cost, cut(left, i) + cut(i,\
    \ right) + (coord[right] - coord[left]));\n// after the loop above is done, we\
    \ know that cut(left, right) = cost\n```\n\nLesson: The Complete Search recurrences\
    \ above only has 50×50 possible left/right indices configuration (states) and\
    \ runs in just 50 × 50 × 50 = 125K operations! It is easy to convert this Complete\
    \ Search / recursive backtracking recurrence into a top-down DP a.k.a memoization\
    \ technique!\n"
