    \ (bignum mod and base conversion)\n\n⁴For example: (132)₈ is 1 × 8² + 3 × 8¹\
    \ + 2 × 8⁰ = 64 + 24 + 2 = (90)₁₀ and (90)₁₀ is 90 (keep dividing by 2) → 45(0)\
