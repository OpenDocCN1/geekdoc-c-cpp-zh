    # Min Cost (Max) Flow


    The min cost flow problem is the problem of finding the *cheapest* possible way
    of sending a certain amount of flow (usually the Max Flow) through a flow network.
    In this problem, every edge has two attributes: the flow capacity through this
    edge and the cost to use this edge. Min Cost (Max) Flow, or in short MCMF, can
    be solved by replacing the BFS to find augmenting path in Edmonds Karp’s to Bellman
    Ford’s (Dijkstra’s may not work as the edge weight in the residual flow graph
    can be negative).


    Programming Exercises for Ford Fulkerson’s/Edmonds Karp’s algorithm:


    +   - Edmonds Karp’s Standard Application (for Max Flow/Min Cut)

    +     1. UVa 820 - Internet Bandwidth (discussed in this section)

    +     2. UVa 10480 - Sabotage (Min Cut)

    +     3. UVa 10779 - Collector’s Problem (Max Flow)

    +     4. UVa 11506 - Angry Programmer (Min Cut)

    +   - Variants

    +     1. UVa 563 - Crimewave (Max Independent Paths: with unit edge and vertex
    capacities)

    +     2. UVa 10330 - Power Transmission (with Vertex Capacities, discussed in
    this section)

    +     3. UVa 10511 - Councilling

    +     4. UVa 10594 - Data Flow (basic MCMF problem)

    +     5. UVa 10806 - Dijkstra, Dijkstra. (Max Edge-Disjoint Paths + Min Cost)


    # 4.9 Special Graphs


    Some basic graph problems have simpler / faster polynomial algorithm if the given
    graph is *special*. So far we have identified the following special graphs that
    commonly appear in programming contests: **Tree**, **Directed Acyclic Graph (DAG)**,
    and **Bipartite Graph**. Problem setters may force contestants to use specialized
    algorithms for these special graphs simply by giving a large input size to judge
    a correct algorithm for general graph as Time Limit Exceeded (TLE). In this section,
    we will discuss some popular graph problems on these special graphs (see Figure
    4.25).


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_96_0.png)


    Figure 4.25: Special Graphs (Left to Right): Tree, Directed Acyclic Graph, Bipartite
    Graph'
  - '[PAGE 97]


    # ### 4.9.1 Tree


    Tree is a special graph with the following characteristics: has $E = V-1$ (any
    $O(V + E)$ algorithm is $O(V)$), it has no cycle, it is connected, and there exists
    one unique path from any pair of vertices.


    # #### Finding Articulation Points and Bridges in Tree


    In Section 4.2, we have seen $O(V + E)$ Tarjan’s DFS algorithm for finding articulation
    points and bridges of a graph. However, if the given graph is a tree, the problem
    becomes simpler: all edges on a tree are bridges and all internal vertices (degree
    > 1) are articulation points. This is still $O(V)$ as we have to scan the tree
    to count the number of internal vertices, but the code is simpler.


    # #### Single-Source Shortest Paths on Weighted Tree


    In Sections 4.5 and 4.6, we have seen two general purpose algorithms ($O((E +
    V) \log V)$ Dijkstra’s and $O(VE)$ Bellman-Ford’s) for solving the SSSP problem
    on a weighted graph. However, if the given graph is a tree, the SSSP problem becomes
    simpler: any $O(V)$ graph traversal algorithm, i.e. BFS or DFS, can be used to
    solve this problem. There is only one unique path between any two vertices in
    a tree, so we simply traverse the tree to find the path connecting the two vertices
    and the shortest path between these two vertices is basically the sum of edge
    weights of this unique path.


    # #### All-Pairs Shortest Paths on Weighted Tree


    In Section 4.7, we have seen a general purpose algorithm ($O(V^3)$ Floyd Warshall’s)
    for solving the APSP problem on weighted graph. However, if the given graph is
    a tree, the APSP problem becomes simpler: repeat the SSSP process $V$ times from
    each vertex, thus it is $O(V^2)$.


    But this can still be improved to $O(V + Q \times L)$: $Q$ is the number of query
    and $L$ is the complexity of the Lowest Common Ancestor (LCA) implementation (see
    [40] for more details). We run $O(V)$ DFS/BFS once from any vertex $v$ to find
    $dist[v]$[other vertices] in tree. Then we can answer any shortest path query
    $(i, j)$ on this tree by reporting $dist[v][i] + dist[v][j] - 2 \times dist[v][LCA(i,
    j)]$.


    # #### Diameter of Tree


    The diameter of a graph is defined as the greatest distance between any pair of
    vertices. To find the diameter of a graph, we first find the shortest path between
    each pair of vertices (the APSP problem). The greatest length of any of these
    paths is the diameter of the graph. For general graph, we may need $O(V^3)$ Floyd
    Warshall’s algorithm discussed in Section 4.7. However, if the given graph is
    a tree, the problem becomes simpler: do DFS/BFS from any node $s$ to find furthest
    vertex $x$, then do DFS/BFS one more time from vertex $x$ to get the true furthest
    vertex $y$ from $x$. The length of the unique path along $x$ to $y$ is the diameter
    of that tree. This solution only requires two calls of $O(V)$ graph traversal
    algorithm.


    # #### Max Weighted Independent Set on Tree


    In Section 3.4, we have shown a DP on Tree example that solves Max Weighted Independent
    Set (MWIS) on Tree in $O(V)$. In Section 4.9.3 below, we will revisit this problem
    on a Bipartite Graph,'
  - '[PAGE 98]


    which can be reduced to Max Flow problem and runs in $O(VE^2)$ with Edmonds Karp’s.
    However, this problem is NP-complete on general graph.


    Programming Exercises related to Tree (also see Section 3.4.3 for “DP on Tree”
    Topic):


    +   1. UVa 112 - Tree Summing (backtracking)

    +   2. UVa 115 - Clawing Trees (tree traversal, LCA)

    +   3. UVa 122 - Trees on the level (tree traversal)

    +   4. UVa 536 - Tree Recovery (tree traversal, reconstructing tree from pre +
    inorder)

    +   5. UVa 615 - Is It A Tree? (graph property check)

    +   6. UVa 699 - The Falling Leaves (preorder traversal)

    +   7. UVa 712 - S-Trees (tree traversal)

    +   8. UVa 10308 - Roads in the North (diameter of tree, discussed in this section)

    +   9. UVa 10459 - The Tree Root (diameter + center of tree)

    +   10. UVa 10701 - Pre, in and post (reconstructing tree from pre + inorder)

    +   11. UVa 10938 - Flea Circus (use LCA)

    +   12. UVa 11695 - Flight Planning (diameter + center of tree)


    # 4.9.2  Directed Acyclic Graph


    A Directed Acyclic Graph, abbreviated as DAG, is a special graph with the following
    characteristics: it is directed and has no cycle.


    # Single-Source Shortest Paths on DAG


    The Single-Source Shortest Paths (SSSP) problem becomes much simpler if the given
    graph is a DAG as DAG has at least one topological order! We can use an $O(V+E)$
    topological sort algorithm in Section 4.2 to find one such topological order,
    then relax edges according to this order. The topological order will ensure that
    if we have a vertex $b$ that has an incoming edge from a vertex $a$, then vertex
    $b$ is relaxed after vertex $a$. This way, the distance information propagation
    is correct with just one $O(V+E)$ linear pass!


    # Single-Source Longest Paths on DAG


    Single-Source Longest Paths problem, i.e. finding the longest path from a starting
    vertex $s$ is NP-complete on a general graph [39]. However the problem is again
    easy if the graph has no cycle, which is true in DAG. The solution for the Longest
    Paths in DAG (a.k.a. Critical Paths) is just a minor tweak from the SSSP solution
    in DAG shown above, i.e. simply negate all edge weights.


    # Min Path Cover on DAG


    Motivating problem: Imagine that the vertices in Figure 4.26.A are passengers,
    and we draw an edge between two vertices $u-v$ if a single taxi can serve passenger
    $u$ then passenger $v$ on time. The question is: What is the minimum number of
    taxis that must be deployed to serve all passengers?'
  - '[PAGE 99]


    The answer for the motivating problem above is two taxis. In Figure 4.26.D, we
    see one possible solution. One taxi (red dotted line) serves passenger 1 (colored
    with red), passenger 2 (blue), and then passenger 4 (yellow). Another taxi (green
    dashed line) serves passenger 3 (green) and passenger 5 (orange). All passengers
    are served with just two taxis.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_99_0.png)


    Figure 4.26: Min Path Cover in DAG (from LA 3126 [11])


    In general, the Min Path Cover (MPC) problem in DAG is described as the problem
    of finding the minimum number of paths to cover *each vertex* in DAG G = (V,E).


    This problem has a polynomial solution: Construct a bipartite graph G'' = (V_out
    ∪ V_in, E'') from G, where V_out = {v ∈ V : v has positive out-degree}, V_in =
    {v ∈ V : v has positive in-degree}, and E'' = {(u,v) ∈ (V_out, V_in) : (u,v) ∈
    E}. This G'' is a bipartite graph. Finding a matching on bipartite graph G'' forces
    us to select at most one outgoing edge from v ∈ V_out (similarly for V_in). DAG
    G initially has n vertices, which can be covered with n paths of length 0 (the
    vertex itself). One matching between vertex a and vertex b using edge (a,b) says
    that we can use one less path as it can cover both vertices in a ∈ V_out and b
    ∈ V_in. Thus if the Max Cardinality Bipartite Matching (MCBM) in G'' has size
    m, then we just need n − m paths to cover each vertex in G.


    The MCBM in G'' that is needed to solve the MPC in G is discussed below. The solution
    for bipartite matching is polynomial, thus the solution for the MPC in DAG is
    also polynomial. Note that MPC in general graph is NP-Complete [42].


    Programming Exercises related to DAG:


    +   * Single-Source Shortest/Longest Paths on DAG

    +       1. UVa 103 - Stacking Boxes

    +       2. UVa 10000 - Longest Paths

    +       3. UVa 10166 - Travel (shortest paths)

    +       4. UVa 10029 - Edit Step Ladders

    +       5. UVa 10350 - Liftless Eme (shortest paths)

    +       6. UVa 11324 - The Largest Clique (find SCC first then longest path on
    DAG)

    +       7. LA 3294 - The Ultimate Bamboo Eater (with 2-D Segment Tree)

    +       8. Ural/Timus OJ 1450 - Russian pipelines

    +       9. PKU 3160 - Father Christmas flymouse

    +   * Counting Paths in DAG

    +       1. UVa 825 - Walking on the Safe Side (the graph is DAG, DP)

    +       2. UVa 926 - Walking Around Wisely (the graph is DAG, DP)

    +       3. UVa 988 - Many paths, one destination (topological sort + DP on DAG)'
