    \ leaf to root nodes which can be done in O(log n). The DP solution requires another\
    \ O(n log n) pre-processing to do the same.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_34_0.png)\n\
    \nFigure 2.8: Updating Array A to {8, 7, 3, 9, 5, 100, 10}. Only leaf-to-root\
