  mdcn: "\n## 序言\n\n很久以前（确切地说是 2003 年 11 月 11 日星期二 UTC 3:55:57），我收到一封电子邮件，其中有这样一句话：我应该简单地说，凭借\
    \ UVa 网站，你孕育了一个新的文明；凭借你写的书（他指的是与 Steven Skiena 合著的《Programming Challenges: The\
    \ Programming Contest Training Manual》[23]），你激励士兵们继续前进。愿你长寿，通过培养出超人般的程序员来服务人类。\n\
    \n虽然这显然有些夸张，但说实话，我开始稍微思考这件事，并有了一个梦想：围绕我在 UVa 教学工作中启动的项目创建一个社区，让来自世界各地的人按照这个理想一起工作。仅仅在互联网上搜索，我立刻发现很多人已经在创建一个网站环，用出色的工具来弥补\
    \ UVa 网站的许多不足。\n\n对我来说更令人印象深刻的是来自印度尼西亚的非常年轻的学生 Steven Halim 的“Methods to Solve”（解题方法），我开始相信这个梦想总有一天会成为现实，因为该网站的内容是一位算法与信息学天才辛勤工作的成果。此外，他公开宣称的目标与我的梦想的主要部分相吻合：服务人类。最妙的是，他有一个兴趣和能力相似的兄弟，Felix\
    \ Halim。\n\n遗憾的是，真正开始合作花了这么长时间，但生活就是这样。幸运的是，我们所有人都在以平行的方式继续工作，而你手中的这本书就是最好的证明。\n\
    \n我无法想象还有比这更好的 UVa Online Judge 网站补充材料，因为它使用了大量来自该网站的例子，这些例子经过精心挑选，并按问题类型和求解技术分类，对网站用户来说是极其有用的帮助。通过掌握和练习本书中的大多数编程习题，读者可以轻松在\
    \ UVa 在线评测系统中达到解决 500 道题，这将使他们在约 100000 名 UVa OJ 用户中进入前 400–500 名。\n\n因此，显然《竞赛编程：提高编程竞赛的下界》这本书适合那些希望在即将到来的\
    \ ICPC 区域赛和 IOI 中提升排名的程序员。两位作者本人都曾作为参赛者经历这些竞赛（ICPC 和 IOI），如今又作为教练经历这些竞赛。但它也是新手的必备伙伴，因为正如\
    \ Steven 和 Felix 在引言中所说：“这本书不是只读一遍，而是要读好几遍。”\n\n此外，它包含用于实现给定算法的实用 C++ 源代码。因为理解问题是一回事，了解算法是另一回事，而用简短高效的代码将它们实现好则很棘手。在你把这本非凡的书读三遍之后，你会意识到自己是一个好得多的程序员，而且更重要的是，一个更快乐的人。\n\
    \nMiguel A. Revilla  \nUVa Online Judge 网站创建者  \nACM-ICPC 国际指导委员会成员兼题目档案管理员  \n\
    巴利亚多利德大学  \nhttp://uva.onlinejudge.org  \nhttp://acmicpc-live-archive.uva.es\n\
    \n## 前言\n\n这是一本每位竞赛程序员都必须阅读——并掌握——的书，至少在其编程生涯的中期阶段：当他们想从“仅仅知道一些编程语言命令”和“一些算法”跃升为顶尖程序员时。\n\
    \n本书的典型读者将是：\n- 成千上万名参加一年一度 ACM 国际大学生程序设计竞赛（ICPC）[27] 区域赛的大学学生。\n- 数百名参加一年一度国际信息学奥林匹克竞赛（IOI）[12]\
    \ 的中学或高中学生。\n- 他们的教练，正在寻找全面的训练材料 [9]。\n- 基本上任何喜欢用计算机解决问题的人。\n\n请注意，本书*不是*为新手程序员准备的。我们写这本书时，将它面向这样的读者：具备基本编程方法论知识，熟悉至少一种编程语言（C/C++/Java），并且已经学过计算机科学大学课程第一年通常教授的基础数据结构与算法（或同等内容）。\n\
    \n由于其内容的多样性，本书*不是*只读一遍，而是要读好几遍。本书正文中散布着许多练习和编程问题；如果在当时不知道解法，可以先跳过，但在读者积累了新的知识能够解决它们之后，可以稍后再回来处理。解决这些练习有助于强化本书所教授的概念，因为它们通常包含对所讨论主题的有趣变化或变体，所以请务必尝试它们。\n\
    \n使用 uva.onlinejudge.org/index.php?option=com_onlinejudge&Itemid=8&category=118、felix-halim.net/uva/hunting.php、www.uvatoolkit.com/problemssolve.php\
    \ 和 www.comp.nus.edu.sg/~stevenha/programming/acmoj.html 来帮助你处理本书中列出的 UVa [17]\
    \ 问题。\n\n我们知道，一个人大概不能仅仅通过掌握本书的*当前版本*就赢得 ACM ICPC 区域赛或在 IOI 中获得金牌。虽然我们在本书中收录了大量材料，但我们很清楚，要实现这一壮举，需要的远不止本书所能提供的内容。本书通篇为那些渴望更多的人列出了一些指引。\n\
    \n我们相信，随着 ICPC 和 IOI 在未来许多年仍将继续举办，本书现在和将来都会与许多大学和高中学生相关。新学生在掌握本书之后去寻找更多挑战之前，将需要本书所呈现的“基础”知识。但在你做出任何假设之前，请查看本书的目录，看看我们所说的“基础”是什么意思。\n\
    \n如果在 2010 年及以后，ICPC 和 IOI 的竞赛水平因为许多参赛者掌握了本书内容而提高，我们会很高兴。我们希望看到世界各地的许多 ICPC 和\
    \ IOI 教练，尤其是东南亚的教练，采用本书，因为他们知道如果不掌握本书*内及超出本书*的主题，他们的学生就没有机会在未来的 ICPC 和 IOI 中取得好成绩。如果这种“所需下界知识”的提高发生了，那么本书就实现了其提升这个时代人类知识水平的目标。\n\
    \n为了人类更美好的未来，  \nSteven 和 Felix Halim\n\n附言：要获取示例源代码，请访问 http://sites.google.com/site/stevenhalim。\
    \  \n要获取 PowerPoint 幻灯片/其他教学材料（仅限教练），请向 stevenhalim@gmail.com 发送个人请求邮件。\n\n##\
    \ 作者简介\n\n### Steven Halim 博士 <stevenhalim@gmail.com>\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_6_0.png)\n\
    \nSteven Halim 目前是新加坡国立大学计算学院（SoC, NUS）的讲师。他在 NUS 教授多门编程课程，范围从基础编程方法论、中级数据结构与算法，一直到使用本书的“竞赛编程”模块。他是\
    \ NUS 两支 ACM ICPC 队伍和新加坡 IOI 队的教练。他曾作为学生参加多场 ACM ICPC 区域赛（新加坡 2001、会津 2003、上海\
    \ 2004）。到目前为止，他和 NUS 的其他教练已经成功培养出一支 ACM ICPC 世界总决赛入围队伍（2009-2010），以及两名 IOI 银牌获得者和两名铜牌获得者（2009）。\n\
    \n### Felix Halim，博士候选人 <felix.halim@gmail.com>\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_6_1.png)\n\
    \nFelix Halim 目前是同一所大学——NUS 计算学院（SoC, NUS）的博士生。就编程竞赛而言，Felix 比他哥哥拥有更丰富多彩的声誉。他曾是\
    \ IOI 2002 的参赛者。他的队伍（当时来自 Bina Nusantara University）参加了 ACM ICPC 马尼拉区域赛 2003-2004-2005，并分别获得第\
    \ 10 名、第 6 名和第 10 名。然后，在他最后一年，他的队伍终于赢得了 ACM ICPC 高雄区域赛 2006，并因此成为 ACM ICPC 2007\
    \ 年东京世界总决赛入围者（荣誉提名）。如今，felix_halim 积极参加 TopCoder Single Round Matches，他的最高评级是黄色等级选手。\n\
    \n"
