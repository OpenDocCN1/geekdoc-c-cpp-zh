    # 4.9.3  Bipartite Graph


    Bipartite Graph, is a special graph with the following characteristics: the set
    of vertices V can be partitioned into two disjoint sets V₁ and V₂ and all edges
    in (u, v) ∈ E has the property that u ∈ V₁ and v ∈ V₂. The most common application
    is the (bipartite) matching problem, shown below.


    # Max Cardinality Bipartite Matching


    Motivating problem (from TopCoder [26] Open 2009 Qualifying 1): Group a list of
    numbers into pairs such that the sum of each pair is prime. For example, given
    the numbers {1, 4, 7, 10, 11, 12}, we can have: {1 + 4 = 5}, {1 + 10 = 11}, {1
    + 12 = 13}, {4 + 7 = 11}, {7 + 10 = 17}, etc.


    Actual task: Given a list of numbers N, return a list of all the elements in N
    that could be paired with N[0] successfully as part of a complete pairing (i.e.
    each element a in N is paired to a unique other element b in N such that a + b
    is prime), sorted in ascending order. The answer for the example above would be
    {4, 10} - omitting 12. This is because even though (1+12) is prime, there would
    be no way to pair the remaining 4 numbers whereas if we pair (1+4), we have (7+10),
    (11+12) and if we pair (1+10), we have (4+7), (11+12).


    Constraints: list N contains an even number of elements (within [2...50], inclusive).
    Each element of N will be between 1 and 1000, inclusive. Each element of N will
    be distinct.


    Although this problem involves finding prime numbers, this is not a pure math
    problem as the elements of N are not more than 1K - there are not too many primes
    below 1000. The issue is that we cannot do Complete Search pairings as there are
    50C₂ possibilities for the first pair, 48C₂ for the second pair, ..., until ₂C₂
    for the last pair. DP + bitmask technique is not an option either because 50!
    is too big.


    The key to solve this problem is to realize that this pairing or matching is done
    on bipartite graph! To get a prime number, we need to sum 1 odd + 1 even, because
    1 odd + 1 odd = even number which is not prime, and 1 even + 1 even = also even
    number, which is not prime. Thus we can split odd/even numbers to set1/set2 and
    give edges from set1 to set2 if set1[i] + set2[j] is prime.


    After we build this bipartite graph, the solution is trivial: If size of set1
    and set2 are different, complete pairing is not possible. Otherwise, if the size
    of both sets is n/2, try to match set1[0] with set2[k] for k = [0...n/2 − 1] and
    do Max Cardinality Bipartite Matching (MCBM) for the rest. This problem can be
    solved with Max Flow algorithm like O(VE²) Edmonds Karps algorithm. If we obtain
    n/2 − 1 more matchings, add set2[k] to the answer. For this test case, the answer
    is {4, 10}.


    Bipartite Matching can be reduced to the Max Flow problem by assigning a dummy
    source vertex connected to all vertices in set1 and a dummy sink vertex connected
    to all vertices in set2. By setting capacities of all edges in this graph to be
    1, we force each vertex in set1 to be matched to only one vertex in set2. The
    Max Flow will be equal to the maximum number of possible matchings on the original
    graph (see Figure 4.27).'
