    \ on a bipartite graph! To get a prime number, we need to sum 1 odd + 1 even,\
    \ because 1 odd + 1 odd = even number which is not prime, and 1 even + 1 even\
    \ = also even number, which is not prime. Thus we can split odd/even numbers to\
    \ set1/set2 and give edges from set1 to set2 if set1[i] + set2[j] is prime.\n\n\
    After we build this bipartite graph, the solution is trivial: If size of set1\
    \ and set2 are different, complete pairing is not possible. Otherwise, if the\
    \ size of both sets is n/2, try to match set1[0] with set2[k] for k = [0...n/2\
    \ − 1] and do Max Cardinality Bipartite Matching (MCBM) for the rest. This problem\
    \ can be solved with Max Flow algorithm like O(VE²) Edmonds-Karp's algorithm.\
    \ If we obtain n/2 − 1 more matchings, add set2[k] to the answer. For this test\
    \ case, the answer is {4, 10}.\n\nBipartite Matching can be reduced to the Max\
    \ Flow problem by assigning a dummy source vertex connected to all vertices in\
    \ set1 and a dummy sink vertex connected to all vertices in set2. By setting capacities\
    \ of all edges in this graph to be 1, we force each vertex in set1 to be matched\
    \ to only one vertex in set2. The Max Flow will be equal to the maximum number\
    \ of possible matchings on the original graph (see Figure 4.27).\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_101_0.png)\n\
    \nFigure 4.27: Bipartite Matching can be reduced to Max Flow problem\n\n### Max\
    \ Weighted Independent Set on Bipartite Graph\n\nMotivating Problem: Suppose that\
    \ there are two users: User A and B. Each user has transactions, e.g. A has \\\
    (\\{A_1,A_2,\\ldots,A_n\\}\\) and each transaction has a weight, e.g. \\(W(A_1),\
    \ W(A_2)\\), etc. These transactions use shared resources, e.g. transaction A1\
    \ uses \\(\\{r_1,r_2\\}\\). Access to a resource is exclusive, e.g. if A1 is selected,\
    \ then any of user B’s transaction(s) that use either \\(r_1\\) or \\(r_2\\) cannot\
    \ be selected. It is guaranteed that two requests from user A will never use the\
    \ same resource, but two requests from different users may be competing for the\
    \ same resource. Our task is to maximize the sum of weight of the selected transactions!\n\
    \nLet’s do several keyword analysis of this problem. If a transaction from user\
    \ A is selected, then transactions from user B that share some or all resources\
    \ cannot be selected. This is a strong hint for **Independent Set**. And since\
    \ we want to maximize sum of weight of selected transactions, this is **Max Weighted\
    \ Independent Set (MWIS)**. And since there are only two users (two sets) and\
    \ the problem statement guarantees that there is no resource conflict between\
    \ the transactions from within one user, we are sure that the input graph is a\
    \ **Bipartite Graph**. Thus, this problem is actually an **MWIS on Bipartite Graph**.\n\
    \n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_101_1.png)\n\nFigure 4.28: Example\
    \ of MWIS on Bipartite Graph (from LA 3487 [11])\n\nLet’s see Figure 4.28 for\
    \ illustration. We have two users. We list down all transactions of A on the left\
    \ and all transactions of B on the right. We draw an edge between two transactions\
    \ if they share similar resource. For example, transaction A1 uses resource 1\
    \ and transaction B1 also uses resource 1. We draw an edge between A1 (with weight\
    \ 45) and B1 (with weight 54) because they share the same resource. In fact, there\
    \ are two more edges between A2 -- B2 and A3 -- B3. Transaction B4 has no edge\
    \ because the resources that it used: \\(\\{4,5\\}\\) are not shared with any\
    \ other transactions. In this instance, \\(\\{B_1(54), A_2(51), A_3(62), B_4(2)\\\
    }\\) is the MWIS, with total weight = 54+51+62+2 = 169.\n\nTo find the solution\
    \ for non-trivial cases, we have to reduce this problem to a Max Flow problem.\
    \ We assign the original vertex cost (the weight of taking that vertex) as capacity\
    \ from source to that vertex for user A and capacity from that vertex to sink\
    \ for user B. Then, we give ‘infinite’ capacity in between any edge in between\
    \ sets A and B. See Figure 4.29.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_102_0.png)\n\
    \nFigure 4.29: Reducing MWIS on Bipartite Graph to Max Flow Problem (from LA 3487\
    \ [11])\n\nThen, we run \\(O(VE^2)\\) Edmonds-Karp's algorithm on this Flow graph.\
    \ After the Max Flow algorithm terminates, the solution is {s-component ∩ vertices\
    \ in User A} + {t-component ∩ vertices in User B} where s-component (t-component)\
    \ are the vertices still reachable to source vertex (sink vertex) after running\
    \ Max Flow. In Figure 4.30, the solution is: {A1(20), A2(18), A4(54)} + {B3(47)}\
    \ = 139. This value can also be obtained via: MWIS = Total Weight − Max Flow =\
    \ 259 − 120 = 139.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_102_1.png)\n\n\
    Figure 4.30: Solution for Figure 4.29 (from LA 3487 [11])\n\nProgramming Exercises\
    \ related to Bipartite Graph:\n\n- Maximum Cardinality Bipartite Matching (graph\
    \ modeling + Max Flow)\n  - UVa 670 - The Dog Task\n  - UVa 753 - A Plug for Unix\n\
    \  - UVa 10080 - Gopher II\n  - UVa 10092 - The Problem with the Problemsetter\n\
    \  - UVa 10735 - Euler Circuit\n  - UVa 11045 - My T-Shirt Suits Me\n  - UVa 11418\
    \ - Clever Naming Patterns\n  - TopCoder Open 2003 Semifinal Round 4 - Division\
    \ 1, Level 3 - RookAttack\n  - TopCoder Open 2009: Qualifying 1 - Prime Pairs\n\
    \  - LA 4407 - Gun Fight\n- Max Weighted Independent Set in Bipartite Graph\n\
    \  - UVa 11159 - Factors and Multiples (similar solution with Bipartite Matching\
    \ above)\n  - LA 3487 - Duopoly (also in Zhejiang Online Judge problem 2129)\n\
    - Max Vertex Cover in Bipartite Graph\n  - UVa 11419 - SAM I AM (Min Vertex Cover)\n\
    \  - LA 2523 - Machine Schedule (also in PKU 1325 - Machine Schedule)\n  - PKU\
    \ 2226 - Muddy Fields\n\n## 4.10 Chapter Notes\n\nTake note that recent ICPCs\
    \ and IOIs usually do not just ask contestants to solve problems involving the\
    \ pure form of these graph algorithms. New problems usually require contestants\
    \ to combine two or more algorithms or to combine an algorithm with some advanced\
    \ data structures, e.g. using BFS and Dijkstra's together in the same problem\
    \ to compute shortest path on both weighted and unweighted version of the same\
    \ graph, to combine longest path in DAG with Segment Tree data structure, etc.\n\
    \nThis chapter, albeit already quite long, still omits many known graph algorithms\
    \ and graph problems that are sometimes tested in ICPCs or IOIs, namely: **Kosaraju's**\
    \ algorithm for finding Strongly Connected Component, **Prim's** and **Boruvka's**\
    \ algorithms for Minimum Spanning Tree, k-th shortest paths, **Euler's** Path/Tour,\
    \ **Fleury's** algorithm, **Chinese Postman Problem**, **Hamiltonian** Path/Tour,\
    \ Bitonic Traveling Salesman Problem, Arborescence, **Tarjan's Offline Lowest\
    \ Common Ancestor**, **Dinic's** or **Push Relabel** algorithms for Max Flow,\
    \ Circulation Problem, **Kuhn-Munkres's (Hungarian)** matching algorithm, **Edmonds's\
    \ Blossom Shrinking**, etc.\n\nIf you want to increase your winning chance in\
    \ ACM ICPC, please spend some time to study them beyond this book. These harder\
    \ ones rarely appear in *regional* contests and if they are, they usually become\
    \ the *decider* problem. Harder graph problems like these are more likely to appear\
    \ in ACM ICPC World Finals level.\n\nHowever, for IOI contestants, most graph\
    \ materials in IOI syllabus are already covered in this chapter.\n\nThere are\
    \ approximately **173 programming exercises** discussed in this chapter.\n"
