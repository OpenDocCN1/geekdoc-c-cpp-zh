    \       if (j > 0) subRect -= arr[k][j - 1]; // O(1)\n        if (i > 0 && j >\
    \ 0) subRect += arr[i - 1][j - 1]; // inclusion-exclusion: O(1)\n        maxSubRect\
    \ = max(maxSubRect, subRect);\n    }\n```\n\n经验教训：并非每个范围问题都需要像第 2.3.3 节那样使用线段树！像这样输入数据为静态的问题通常可以用\
