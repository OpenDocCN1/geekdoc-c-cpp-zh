    \ / log(2.0)) + 1));\n    segment_tree.resize(length, 0); // resize this vector\
    \ and fill with 0\n}\n\nvoid build_segment_tree(int code, int A[], int node, int\
    \ b, int e) {\n    if (b == e) { // as b == e, either one is fine\n        if\
    \ (code == RANGE_SUM) segment_tree[node] = A[b]; // store value of this cell\n\
