    is part of the solution of the original problem. Although optimal sub-structure
    are the same ingredient to make a Greedy Algorithm work, this problem lacks the
    ''greedy property'' ingredient.

    +   2. This problem has overlapping sub-problems.

    +      This is the key point of DP! The search space is actually not as big as
    `20^20` analyzed in Complete Search discussion above as **many** sub-problems
    are actually overlapping!'
