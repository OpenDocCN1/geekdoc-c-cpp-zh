    \  \n+   3. The **Perimeter** $p$ of a triangle with three sides: $a$, $b$, and\
    \ $c$ is $p = a + b + c$.\n+   \n+   4. The **Heron’s Formula**: The area $A$\
    \ of a triangle with 3 sides: $a$, $b$, $c$, is $A = \\sqrt{s \\times (s-a) \\\
    times (s-b) \\times (s-c)}$, where $s = 0.5 \\times p$ (the **Semi-Perimeter**\
    \ of the triangle).\n+   \n+   5. The radius $r$ of the Triangle’s **Inner Circle**\
    \ with area $A$ and the semi-perimeter $s$ is $r = A/s$.\n+   \n+   6. The radius\
    \ $R$ of the Triangle’s **Outer Circle** with 3 sides: $a$, $b$, $c$ and area\
    \ $A$ is $R = a \\times b \\times c/(4 \\times A)$.\n+   \n+   7. In **Trigonometry**,\
    \ the **Law of Cosines** (a.k.a. the **Cosine Formula** or the **Cosine Rule**)\
    \ is a statement about a general triangle that relates the lengths of its sides\
    \ to the cosine of one of its angles. See the scalene (middle) triangle in Figure\
    \ 7.2. With the notation described here, we have: $c^2 = a^2 + b^2 - 2 \\times\
    \ a \\times b \\times \\cos(\\gamma)$. This formula can be rewritten for the other\
