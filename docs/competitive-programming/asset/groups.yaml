    # # Authors’ Profiles


    # Steven Halim, PhD <stevenhalim@gmail.com>


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_6_0.png)


    Steven Halim is currently an instructor in School of Computing, National University
    of Singapore (SoC, NUS). He teaches several programming courses in NUS, ranging
    from basic programming methodology, intermediate data structures and algorithms,
    and up to the ‘Competitive Programming’ module that uses this book. He is the
    coach of both NUS ACM ICPC teams and Singapore IOI team. He participated in several
    ACM ICPC Regional as student (Singapore 2001, Aizu 2003, Shanghai 2004). So far,
    he and other trainers @ NUS have successfully groomed one ACM ICPC World Finalist
    team (2009-2010) as well as two silver and two bronze IOI medalists (2009).


    # Felix Halim, PhD Candidate <felix.halim@gmail.com>


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_6_1.png)


    Felix Halim is currently a PhD student in the same University: SoC, NUS. In terms
    of programming contests, Felix has much colorful reputation than his older brother.
    He was IOI 2002 contestant. His teams (at that time, Bina Nusantara University)
    took part in ACM ICPC Manila Regional 2003-2004-2005 and obtained rank 10th, 6th,
    and 10th respectively. Then, in his final year, his team finally won ACM ICPC
    Kaohsiung Regional 2006 and thus became ACM ICPC World Finalist @ Tokyo 2007 (Honorable
    Mention). Today, felix_halim actively joins TopCoder Single Round Matches and
    his highest rating is a yellow coder.'
