  - "[PAGE 109]\n\n# ### 5.3.2 Greatest Common Divisor (GCD) & Least Common Multiple\
    \ (LCM)\n\nThe Greatest Common Divisor (GCD) of two integers $(a, b)$ denoted\
    \ by $gcd(a,b)$, is defined as the largest positive integer $d$ such that $d \\\
    mid a$ and $d \\mid b$ where $x \\mid y$ implies that $x$ divides $y$. Example\
    \ of GCD: $gcd(4,8) = 4$, $gcd(10,5) = 5$, $gcd(20,12) = 4$. One practical usage\
    \ of GCD is to simplify fraction, e.g. $\\frac{4}{8} = \\frac{4/gcd(4,8)}{8/gcd(4,8)}\
    \ = \\frac{1}{2}$.\n\nTo find the GCD between two integers is an easy task with\
    \ an effective Euclid algorithm [20, 4] which can be implemented as a one liner\
    \ code (see below). Thus finding the GCD is usually not the actual issue in a\
    \ Math-related contest problem, but just part of the bigger solution.\n\nThe GCD\
    \ is closely related to Least (or Lowest) Common Multiple (LCM). The LCM of two\
    \ integers $(a, b)$ denoted by $lcm(a,b)$, is defined as the smallest positive\
    \ integer $l$ such that $a \\mid l$ and $b \\mid l$. Example of LCM: $lcm(4,8)\
    \ = 8$, $lcm(10,5) = 10$, $lcm(20,12) = 60$. It has been shown [20] that: $lcm(a,b)\
    \ = a \\times b/gcd(a,b)$. This can also be implemented as a one liner code (see\
    \ below).\n\n```\n```cpp\nint gcd(int a, int b) { return (b == 0 ? a : gcd(b,\
    \ a % b)); }\nint lcm(int a, int b) { return (a * (b / gcd(a, b))); } // divide\
    \ before multiply!\n```\n```\n\nThe GCD of more than 2 numbers, e.g. $gcd(a,b,c)$\
    \ is equal to $gcd(a,gcd(b,c))$, etc, and similarly for LCM. Both GCD and LCM\
    \ algorithms run in $O(\\log_{10} n)$, where $n = max(a,b)$.\n\n+   Programming\
    \ Exercises related to GCD and/or LCM:\n+   \n+   1. UVa 332 - Rational Numbers\
    \ from Repeating Fractions\n+   2. UVa 412 - Pi\n+   3. UVa 530 - Binomial Showdown\n\
    +   4. UVa 10193 - All You Need Is Love\n+   5. UVa 10407 - Simple Division\n\
    +   6. UVa 10680 - LCM\n+   7. UVa 10717 - Mint (requires Complete Search on top\
