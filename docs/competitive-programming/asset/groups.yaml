    # ## 3.2 Divide and Conquer


    Divide and Conquer (abbreviated as D&C) is a problem solving paradigm where we
    try to make a problem *simpler* by ‘dividing’ it into smaller parts and ‘conquering’
    them. The steps:


    +   1. Divide the original problem into *sub-problems* -- usually by half or nearly
    half,

    +   2. Find (sub-)solutions for each of these sub-problems -- which are now easier,

    +   3. If needed, combine the sub-solutions to produce a complete solution for
    the main problem.


    We have seen this D&C paradigm in previous chapters in this book: various sorting
    algorithms like Quick Sort, Merge Sort, Heap Sort, and Binary Search in Section
    2.2.1 utilize this paradigm. The way data is organized in Binary Search Tree,
    Heap, and Segment Tree in Section 2.2.2 & 2.3.3, also has the spirit of Divide
    & Conquer.


    # ### 3.2.1 Interesting Usages of Binary Search


    In this section, we discuss the spirit of D&C paradigm around a well-known Binary
    Search algorithm. We still classify Binary Search as ‘Divide’ and Conquer paradigm
    although some references (e.g. [14]) suggest that it should be classified as ‘Decrease
    (by-half)’ and Conquer as it does not actually ‘combine’ the result. We highlight
    this algorithm because many contestants know it, but not many are aware that it
    can be used in other ways than its ordinary usage.


    # ### Binary Search: The Ordinary Usage


    Recall: The *ordinary* usage of Binary Search is for searching an item in a *static
    sorted array*. We check the middle portion of the sorted array if it is what we
    are looking for. If it is or there is no more item to search, we stop. Otherwise,
    we decide whether the answer is on the left or right portion of the sorted array.
    As the size of search space is halved (binary) after each query, the complexity
    of this algorithm is O(log n). In Section 2.2.1, we have seen that this algorithm
    has library routines, e.g. C++ STL <algorithm>: lower_bound, Java Collections.binarySearch.


    This is *not* the only way to use and apply binary search. The pre-requisite to
    run binary search algorithm -- a *static sorted array (or vector)* -- can also
    be found in other uncommon data structure, as in the root-to-leaf path on a structured
    tree below.


    # ### Binary Search on Uncommon Data Structure (Thailand ICPC National Contest
    2009)


    Problem in short: given a weighted (family) tree of N vertices up to N ≤ 80K with
    a special trait: *vertex values are increasing from root to leaves*. Find the
    ancestor vertex closest to root from a starting vertex v that has weight at least
    P. There are up to Q ≤ 20K such queries.


    Naïve solution is to do this linear O(N) scan per query: Start from a given vertex
    v, then move up the family tree until we hit the first ancestor with value < P.
    In overall, as there are Q queries, this approach runs in O(QN) and will get TLE
    as N ≤ 80K and Q ≤ 20K.


    A better solution is to store all the 20K queries first. Then traverse the family
    tree *just once* from root using O(N) Depth First Search (DFS) algorithm (Section
    4.2). Search for some non-existent value so that DFS explores the *entire* tree,
    building a partial root-to-leaf *sorted* array as it goes -- this is because the
    vertices in the root-to-leaf path have increasing weights. Then, for each'
  - '[PAGE 44]


    vertex asked in query, perform a O(log N) **binary search**, i.e. *lower_bound*,
    along the current path from root to that vertex to get ancestor closest to root
    with weight at least P. Finally, do an O(Q) post-processing to output the results.
    The overall time complexity of this approach is O(Q log N), which is now manageable.


    # **Bisection Method**


    What we have seen so far are the usage of binary search in finding items in a
    static sorted array. However, the binary search **principle** can also be used
    to find the root of a function that may be difficult to compute mathematically.


    Sample problem: You want to buy a car using loan and want to pay in monthly installments
    of *d* dollars for *m* months. Suppose the value of the car is originally *v*
    dollars and the bank charges *i*% interest rate for every unpaid money at the
    end of each month. What is the amount of money *d* that you must pay per month
    (rounded to 2 digits after decimal point)?


    Suppose *d* = 576, *m* = 2, *v* = 1000, and *i* = 10%. After one month, your loan
    becomes 1000 × (1.1) - 576 = 524. After two months, your loan becomes 524 × (1.1)
    - 576 ≈ 0.


    But if we are only given *m* = 2, *v* = 1000, and *i* = 10%, how to determine
    that *d* = 576? In another words, find the root *d* such that loan payment function
    *f*(*d*, 2, 1000, 10) ≈ 0. The *easy* way is to run the bisection method². We
    pick a reasonable range as the starting point. In this case, we want to find *d*
    within range [*a*...*b*]. *a* = 1 as we have to pay something (at least *d* =
    1 dollar). *b* = (1 + *i*) × *v* as the earliest we can complete the payment is
    *m* = 1, if we pay exactly (1 + *i*%) × *v* = (1 + 10%) × 1000 = 1100 dollars
    after one month. Then, we apply bisection method to obtain *d* as follows:


    +   - If we pay *d* = (*a* + *b*)/2 = (1 + 1100)/2 = 550.5 dollars per month,
    then we undershoot by 53.95 dollars after two months, so we know that we must
    *increase* the monthly payment.

    +   - If we pay *d* = (550.5 + 1100)/2 = 825.25 dollars per month, then we overshoot
    by 523.025 dollars after two months, so we know that we must *decrease* the payment.

    +   - If we pay *d* = (550.5 + 825.25)/2 = 687.875 dollars per month, then we
    overshoot by 234.5375 dollars after two months, so we know that we must *decrease*
    the payment.

    +   - … few logarithmic iterations after, to be precise, after O(log₂((*b* − *a*)/ε))
    iterations where ε is the amount of error that we can tolerate.

    +   - Finally, if we pay *d* = 576.190476... dollars per month, then we manage
    to finish the payment (the error is now less than ε) after two months, so we know
    that *d* = 576 is the answer.


    For bisection method to work³, we must ensure that the function values of the
    two extreme points in the initial Real range [*a*...*b*], i.e. *f*(*a*) and *f*(*b*)
    have opposite signs (true in the problem above). Bisection method in this example
    only takes log₂ 1099/ε tries. Using a small ε = 1e-9, this is ≈ 40 tries. Even
    if we use an even smaller ε = 1e-15, we still just need ≈ 60 tries⁴. Bisection
    method is more efficient compared to linearly trying each possible value of *d*
    = [1...1100]/ε.


    ² We use the term ''binary search principle'' as a divide and conquer technique
    that involve halving the range of possible answer. We use the term ''binary search
    algorithm'' (finding index of certain item in sorted array) and ''bisection method''
    (finding root of a function) as instances of this principle.


    ³ Note that the requirement of bisection method (which uses binary search principle)
    is slightly different from the more well-known binary search algorithm which needs
    a sorted array.


    ⁴ Thus some competitive programmers choose to do ''loop 100 times'' which guarantees
    termination instead of testing whether the error is now less than ε as some floating
    point errors may lead to endless loop.'
