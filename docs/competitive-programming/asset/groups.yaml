    \ 我们出队 $(6,5)$ 并 $\\mathrm{relax}(5, 4)$，使得 $\\mathrm{dist}[4] = 7$（从 2 到 4 的更短路径现在是\
    \ 2-5-4，而不是 2-1-4）。顶点 5 处理完毕，pq 包含 $\\{(7,3), (7,4), (8,4)\\}$。\n- 6. 现在，$(7,3)$\
    \ 可以被忽略，因为我们知道 $d > \\mathrm{dist}[3]$（即 $7 > 5$）。然后 $(7,4)$ 像之前一样被处理。最后 $(8,4)$\
    \ 再次被忽略，因为 $d > \\mathrm{dist}[4]$（即 $8 > 7$）。由于优先队列为空，Dijkstra 算法在此停止。\n\n##\
    \ 4.6 贝尔曼-福特算法\n\n如果输入图具有负边权，Dijkstra 算法可能会失败。图 4.16 是一个 Dijkstra 算法失败的简单示例。Dijkstra\
    \ 算法贪心地先设置 $\\mathrm{dist}[3] = 3$，并使用该值来松弛 $\\mathrm{dist}[4] = \\mathrm{dist}[3]+\\\
    mathrm{weight}(3,4) = 3+3 = 6$，但随后 $\\mathrm{dist}[3] = \\mathrm{dist}[2]+\\mathrm{weight}(2,3)\
    \ = 10+(-10) = 0$。正确答案是 $\\mathrm{dist}[4] = \\mathrm{dist}[3]+\\mathrm{weight}(3,4)\
    \ = 0+3 = 3$。\n\n为了在存在负边权的情况下求解 SSSP 问题，必须使用更通用（但更慢）的贝尔曼-福特算法。该算法由理查德·欧内斯特·贝尔曼（动态规划技术的先驱）和小莱斯特·兰道夫·福特（第\
    \ 4.8 节中 Ford-Fulkerson 方法的发明者）提出。该算法很简单：将所有 E 条边松弛 V − 1 次！\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_87_0.png)\n\
    \n这基于这样的思想：`dist[source] = 0`，并且如果我们松弛一条边(source, u)，那么 `dist[u]` 将具有正确的值。如果我们随后松弛一条边(u,\
    \ v)，那么 `dist[v]` 也将具有正确的值……如果我们已经将所有 E 条边松弛 V − 1 次，那么从源顶点到距源最远顶点（路径长度：V−1 条边）的最短路径应该已被正确计算。代码很简单：\n\
    \n```cpp\nvector<int> dist(V, INF); dist[s] = 0; // INF = 2B not MAX_INT to avoid\
    \ overflow\nREP (i, 0, V - 1) // relax all E edges V−1 times, O(V)\n  REP (u,\
    \ 0, V - 1) // these two loops as O(E)\n    TRvii (AdjList[u], v) // has edge\
    \ and can be relaxed\n      dist[v->first] = min(dist[v->first], dist[u] + v->second);\n\
    REP (i, 0, V - 1)\n  printf(\"SSSP(%d, %d) = %d\\n\", s, i, dist[i]);\n```\n\n\
    如果图存储为邻接矩阵，则贝尔曼-福特算法的复杂度为 $O(V^3)$；如果图存储为邻接表，则为 $O(VE)$。与 Dijkstra 算法相比，这（要）慢得多。因此，贝尔曼-福特算法通常仅在输入图不太大，并且*不保证*所有边权均为非负时，才用于求解\
    \ SSSP 问题！\n\n贝尔曼-福特算法还有一个有趣的用途。在将所有 E 条边松弛 V−1 次之后，SSSP 问题应该已经解决，即我们无法再松弛任何顶点。这一事实可用于检查是否存在*负环*，尽管这类问题定义不明确。在图\
    \ 4.17 左图中，我们看到一个带有负环的简单图。经过 1 遍后，`dist[1] = 973` 且 `dist[2] = 1015`（中图）。经过 V\
    \ − 1 = 2 遍后，`dist[1] = 988` 且 `dist[2] = 946`（右图）。但由于存在负环，我们仍然可以再做一次，即松弛 `dist[1]\
    \ = 946+15 = 961 < 988`！\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_87_1.png)\n\
    \n```cpp\nbool negative_cycle_exist = false;\nREP (u, 0, V - 1) // one more pass\
    \ to check\n  TRvii (AdjList[u], v)\n    if (dist[v->first] > dist[u] + v->second)\
    \ // should be false, but if possible\n      negative_cycle_exist = true; // then\
    \ negative cycle exists!\nprintf(\"Negative Cycle Exist? %s\\n\", negative_cycle_exist\
    \ ? \"Yes\" : \"No\");\n```\n"
