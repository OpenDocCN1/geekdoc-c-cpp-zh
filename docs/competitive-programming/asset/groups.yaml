  - "[PAGE 20]\n\n# 1.2.4  Tip 4: Master the Art of Testing Code\n\nYou thought you\
    \ have nailed a particular problem. You have identified its type, designed the\
    \ algorithm for it, calculated the algorithm’s time/space complexity - it will\
    \ be within the time and memory limit given, and coded the algorithm. But, your\
    \ solution is still not Accepted (AC).\n\nDepending on the programming contests\
    \ you may or may not get credit by solving the problem partially. In ICPC, you\
    \ will only get credit if your team’s code solve all the judge’s secret test cases,\
    \ that’s it, you get AC. Other responses like Presentation Error (PE), Wrong Answer\
    \ (WA), Time Limit Exceeded (TLE), Memory Limit Exceeded (MLE), Run Time Error\
    \ (RTE), etc do not increase your team’s points. In IOI (2009 rule), there exists\
    \ a partial credit system, in which you will get scored based on the number of\
    \ correct/total number of test cases for the latest code that you have submitted\
    \ for that problem, but the judging will only be done after the contest is over,\
    \ so you must be very sure that your code is doing OK.\n\nIn either case, you\
    \ will need to be able to design good, educated, tricky test cases. The sample\
    \ input-output given in problem description is by default too trivial and therefore\
    \ not a good way for measuring your code’s correctness.\n\nRather than wasting\
    \ submissions (and get time or point penalties) by getting non AC responses, you\
    \ may want to design some tricky test cases first, test it in your own machine,\
    \ and ensure your code is able to solve it correctly (otherwise, there is no point\
    \ submitting your solution right?).\n\nSome coaches ask their students to compete\
    \ with each other by designing test cases. If student A’s test cases can break\
    \ other student’s code, then A will get bonus point. You may want to try this\
    \ in your team training too :). This concept is also used in TopCoder [26] ‘challenge\
    \ phase’.\n\nHere are some guidelines for designing good test cases, based on\
    \ our experience:\n\n+   1. Must include sample input as you have the answer given...\
    \ Use ‘fc’ in Windows or ‘diff’ in UNIX to help checking your code’s output against\
    \ the sample output.\n+   \n+   2. Must include boundary cases. Increase the size\
    \ of input incrementally up to the maximum possible. Sometimes your program works\
    \ for small input size, but behave wrongly when input size increases. Check for\
    \ overflow, out of bounds, etc.\n+   \n+   3. For multiple input test cases, use\
    \ two identical test cases consecutively. Both must output the same result. This\
    \ is to check whether you have forgotten to initialize some variables, which will\
    \ be easily identified if the 1st instance produce correct output but the 2nd\
    \ one does not.\n+   \n+   4. Create tricky test cases by identifying cases that\
    \ are ‘hidden’ in the problem description.\n+   \n+   5. Do not assume the input\
    \ will always be nicely formatted if the problem description does not say so (especially\
    \ for badly written programming problem). Try inserting white spaces (space, tabs)\
    \ in your input, and check whether your code is able to read in the values correctly.\n\
    +   \n+   6. Finally, generate large random test cases. See if your code terminates\
    \ on time and still give reasonably ok output (correctness is hard to verify here\
    \ -- this test is only to verify that your code runs within time limit).\n\nHowever,\
    \ after all these careful steps, you may still get non-AC responses. In ICPC,\
    \ you and your team can actually use the judge’s response to determine your next\
    \ action. With more experience in such contests, you will be able to make better\
    \ judgment. See the next exercises:"
