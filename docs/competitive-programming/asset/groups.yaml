  mdcn: "\n## 2. 组建测验团队（UVa 10911）\n\n关于简化题意和完整解法代码，请参考第 1 章中提到的第一个问题。这个问题的宏大名称是“小规模一般图上的最小权完美匹配”。一般而言，这个问题很难，解法是\
    \ Edmonds 匹配算法（见 [34]），它并不容易编码。\n\n然而，如果输入规模很小，最多 \\(M \\le 20\\)，那么下面的 DP + 位掩码技术可以奏效。思路很简单，以\
    \ \\(M = 6\\) 为例：当还没有任何匹配时，状态为 `bit_mask=000000`。如果物品 0 和物品 2 匹配，我们可以通过这些简单的位运算打开第\
    \ 0 位和第 2 位，即 `bit_mask | (1 << 0) | (1 << 2)`，于是状态变为 `bit_mask=000101`。然后，如果从这个状态出发，物品\
    \ 1 和物品 5 匹配，状态变为 `bit_mask=010111`。当状态全为‘1’时，就得到了完美匹配，在此例中为：`bit_mask=111111`。\n\
    \n尽管到达某个状态有很多方式，但不同状态只有 \\(O(2^M)\\) 个！对于每个状态，我们记录为到达该状态所必须完成的先前匹配的最小权重。由于我们想要完美匹配，那么对于当前为“关”的位\
    \ \\(i\\)，我们必须用一个 \\(O(M)\\) 的循环从 \\([i+1 \\ldots M-1]\\) 中找到最佳的另一个“关”位 \\(j\\\
    )。这个检查同样通过位运算完成，即 `(!(bit_mask & (1 << j)))`——对 \\(j\\) 也类似。该算法运行时间为 \\(O(M \\\
    times 2^M)\\)。在 UVa 10911 问题中，\\(M = 2N\\) 且 \\(2 \\le N \\le 8\\)，因此这种 DP + 位掩码方法是可行的。更多细节，请研究第\
    \ 1.2 节中给出的代码。\n\n经验教训：DP + 位掩码可以求解一般图上 \\(M \\le 20\\) 的小规模匹配实例。\n\n练习：第 1.2\
    \ 节的代码写道“这个 ‘break’ 是必要的。你明白为什么吗？”，提示是：“它有助于将时间复杂度从 \\(O((2N)^2 \\times 2^{2N})\\\
    ) 降低到 \\(O((2N) \\times 2^{2N})\\)”。回答它！\n\n## 3. 鱼贩（SPOJ 101）\n\n简化题意：给定城市数量\
    \ \\(3 \\le n \\le 50\\)、可用时间 \\(1 \\le t \\le 1000\\)，以及两个 \\(n \\times n\\)\
    \ 矩阵（一个给出旅行时间，另一个给出两个城市之间的通行费），从第一个城市 0 选择一条路线，使得在特定时间 \\(t\\) 内到达最后一个城市 \\(n\
    \ - 1\\) 时所需支付的通行费尽可能少。输出两项信息：实际使用的通行费总额和实际旅行时间。\n\n注意这个问题中有两个可能相互冲突的要求。要求一是*最小化*沿途通行费。要求二是*确保*我们在分配时间内到达最后一个城市，这可能意味着我们必须在路径的某些部分支付更高的通行费。要求二是一个*硬性*约束。我们必须满足它，否则就没有解。\n\
    \n在尝试若干测试用例后应当很清楚，像 Dijkstra 算法（4.5 节）这样的贪心单源最短路径（SSSP）算法——在其纯粹形式下——行不通，因为选择最短旅行时间来确保我们用时少于可用时间\
    \ \\(t\\)，未必会得到尽可能小的通行费。另一方面，选择沿途最便宜的通行费可能无法确保我们在可用时间 \\(t\\) 内到达。这两个要求不能相互独立！\n\
    \n解法：我们可以使用以下完全搜索递推式 + 自顶向下 DP（记忆化）`go(curCity, time_left)`，它返回信息对（实际支付的通行费，实际使用的时间）：\n\
    \n- 1. `go(any curCity, < 0) = make_pair(INF, INF);` // 如果时间耗尽，就不能继续前进。\n- 2.\
    \ `go(n - 1, ≥ 0) = make_pair(0, 0);` // 到达最后一个城市，不再需要支付/旅行。\n- 3. 一般情况下，`go(curCity,\
    \ time_left)` 最好用下面的 C++ 代码来描述：\n\n```cpp\npair<int, int> go(int curCity, int\
    \ time_left) { // top-down DP, returns a pair\n    if (time_left < 0) // invalid\n\
    \        return make_pair(INF, INF); // a trick: return large value so that this\
    \ state is not chosen\n    if (curCity == n - 1) // at last city\n        return\
    \ make_pair(0, 0); // no need to pay toll, and time needed is 0\n    if (memo[curCity][time_left].first\
    \ != -1) // visited before\n        return memo[curCity][time_left]; // simply\
    \ return the answer\n\n    pair<int, int> answer = make_pair(INF, INF);\n    for\
    \ (int neighbor = 0; neighbor < n; neighbor++) // try to go to another city\n\
    \        if (curCity != neighbor) { // force us to always move\n            pair<int,\
    \ int> nextCity = go(neighbor,\n                time_left - travelTime[curCity][neighbor]);\
    \ // go to the other city\n            // among neighboring cities, pick the one\
    \ that has minimum cost\n            if (nextCity.first + toll[curCity][neighbor]\
    \ < answer.first) {\n                answer.first = nextCity.first + toll[curCity][neighbor];\n\
    \                answer.second = nextCity.second + travelTime[curCity][neighbor];\n\
    \            }\n        }\n    memo[curCity][time_left] = answer;\n    return\
    \ answer; // store the answer to memo table as well as returning the answer to\
    \ the caller\n}\n```\n\n经验教训：一些图最短（最长）路径问题看起来可以用第 4 章的经典（通常是贪心）图算法解决，但实际上应该使用\
    \ DP 技术⁷。\n\n⁷ 这个问题也可以用修改过的 Dijkstra 算法解决。\n\n## 4. ACORN（ACM ICPC Singapore 2007\
    \ LA 4106）\n\n简化题意：给定 $t$ 棵橡树、所有树的高度 $h$、Jayjay 从一棵树飞到另一棵树时失去的高度 $f$，$1 \\leq\
    \ t, h \\leq 2000$，$1 \\leq f \\leq 500$，以及每棵橡树上橡果的位置：`acorn[tree][height]`，确定\
    \ Jayjay 在一次下降中最多能收集多少颗橡果。示例：如果 $t = 3, h = 10, f = 2$ 且 `acorn[tree][height]`\
    \ 如图 3.11 所示，最佳下降路径总共收集 8 颗橡果（虚线）。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_62_0.png)\n\
    \n图 3.11：ACM ICPC 新加坡 2007——飞鼠 Jayjay 收集橡果\n\n**朴素 DP 解法：** 使用一个记忆化表 `total[tree][height]`，它存储在\
    \ Jayjay 位于某棵树的某个高度时可能收集到的最多橡果数。然后 Jayjay 递归地尝试要么在同一棵橡树上向下移动 (-1) 个单位，要么从此位置飞到*另外\
    \ t−1 棵*橡树（-f）个单位。\n\n这种方法最多需要 2000 × 2000 = 4M 个状态，时间复杂度为 4M × 2000 = 8B 次操作。这种方法显然会\
    \ TLE！\n\n**更好的 DP 解法：** 我们实际上可以忽略“Jayjay 当前在哪棵树上”这一信息，因为只需记忆化它们之中的最优值就足够了。设置一个表：`dp[height]`，存储在\
    \ Jayjay 处于该高度时可能收集到的最多橡果数。下面这个自底向上的 DP 代码只需要 2000 = 2K 个状态，时间复杂度为 2000 × 2000\
    \ = 4M：\n\n```cpp\nfor (int tree = 0; tree < t; tree++) // initialization\n  \
    \  dp[h] = max(dp[h], acorn[tree][h]);\nfor (int height = h - 1; height >= 0;\
    \ height--)\n    for (int tree = 0; tree < t; tree++) {\n        acorn[tree][height]\
    \ +=\n            max(acorn[tree][height + 1], // from this tree, +1 above\n \
    \               ((height + f <= h) ? dp[height + f] : 0)); // best from tree at\
    \ height + f\n        dp[height] = max(dp[height], acorn[tree][height]); // update\
    \ this too\n    }\nprintf(\"%d\\n\", dp[0]); // solution will be here\n```\n\n\
    **经验教训：** 当朴素 DP 状态太大，导致整体 DP 时间复杂度不可行时，要思考*除显而易见的方法之外*的其他方式来表示可能的状态。记住，没有哪道编程竞赛题是无法解决的，出题人一定知道某种技巧。\n\
    \n## 5. 自由括号（ACM ICPC Jakarta 2008 LA 4143）\n\n**简化题意：** 给定一个简单的算术表达式，它只由*加法和减法*运算符组成，即\
    \ `1 − 2 + 3 − 4 − 5`。只要表达式仍然*合法*，你可以随意在表达式中的任何位置放置任意多个*括号*。你能得到多少个不同的数？对于上面的简单表达式，答案是\
    \ 6：\n\n| 表达式 | 结果 | 表达式 | 结果 |\n|---|---:|---|---:|\n| `1 − 2 + 3 − 4 − 5` |\
    \ −7 | `1 − (2 + 3 − 4 − 5)` | 5 |\n| `1 − (2 + 3) − 4 − 5` | −13 | `1 − 2 + 3\
    \ − (4 − 5)` | 3 |\n| `1 − (2 + 3 − 4) − 5` | −5 | `1 − (2 + 3) − (4 − 5)` | −3\
    \ |\n\n该表达式只由 2 ≤ *N* ≤ 30 个小于 100 的非负整数组成，数字之间用加法或减法运算符分隔。第一个操作数之前和最后一个数字之后没有运算符。\n\
    \n为了解决这个问题，我们需要作出三点观察：\n\n- 1. 我们只需要在‘−’（负号）后面放置左括号，因为它会反转后续‘+’和‘−’运算符的含义；\n-\
    \ 2. 只有在已经使用了 *X* 个左括号时，你才能放置 *X* 个右括号——我们需要存储这一信息，以便正确处理子问题；\n- 3. 最大值为 100 +\
    \ 100 + ... 100（30 次）= 3000，最小值为 100 − 100 − ... − 100（29 次）= −2800——这一信息需要存储，我们将在下面看到。\n\
    \n更容易识别的 DP 状态有：\n\n- 1. ‘idx’——当前正在处理的位置，我们需要知道现在在哪里。\n- 2. ‘open’——左括号的数量，我们需要这一信息以生成合法表达式。\n"
