    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_84_0.png)


    Figure 4.13: Second Best Spanning Tree (from UVa 10600 [17])


    A simple solution is to first sort the edges in $O(E \log E)$, then find the MST
    using Kruskal’s in $O(E)$. Then, for each edge in the MST, make its weight to
    be INF (infinite) to ‘delete’ it -- in practice, this is just a very big number.
    Then try to find the second best ST in $O(VE)$ as there are $E=V-1$ edges in the
    MST that we have to try. Figure 4.14 shows this algorithm on the given graph.
    Remember that both MST and second best ST are spanning tree, i.e. they are connected!
    In overall, this algorithm runs in $O(E \log E + E + VE)$.


