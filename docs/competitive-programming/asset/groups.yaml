    \nThe coin changing example above has the two ingredients for a successful greedy\
    \ algorithm:\n\n- 1. It has optimal sub-structures.\n  \n  We have seen that in\
    \ the original problem to make 42 cents, we have to use 25+10+5+1+1. This is an\
    \ optimal 5 coins solution to the original problem!\n  \n  Now, the optimal solutions\
    \ to its sub-problems are contained in this 5 coins solution, i.e.\n  - a. To\
    \ make 17 cents, we have to use 10+5+1+1 (4 coins),\n  - b. To make 7 cents, we\
    \ have to use 5+1+1 (3 coins), etc\n\n- 2. It has a greedy property.\n  \n  Given\
    \ every amount *V*, we greedily subtract it with the largest denomination of coin\
    \ which is not greater than this amount *V*. It can be proven (not shown here\
    \ for brevity) that using other strategy than this will not lead to optimal solution.\n\
    \nHowever, this greedy algorithm does *not* work for *all* sets of coin denominations,\
    \ e.g. {1, 3, 4} cents. To make 6 cents with that set, a greedy algorithm would\
    \ choose 3 coins {4, 1, 1} instead of the optimal solution using 2 coins {3, 3}.\
    \ This problem is revisited later in Section 3.4.2.\n\nThere are many other classical\
    \ examples of greedy algorithms in algorithm textbooks, for example: Kruskal’s\
    \ for Minimum Spanning Tree (MST) problem – Section 4.4, Dijkstra’s for Single-Source\
    \ Shortest Paths (SSSP) problem – Section 4.5, Greedy Activity Selection Problem\
    \ [4], Huffman Codes [4], etc.\n\n### 3.3.2 Non Classical Example\n\nToday’s contest\
    \ problems usually do not ask for solution of trivial and classical greedy problems.\
    \ Instead, we are presented with novel ones that requires creativity, like the\
    \ one shown below.\n\n### UVa 410 - Station Balance\n\nGiven \\(1 \\le C \\le\
    \ 5\\) chambers which can store 0, 1, or 2 specimens, \\(1 \\le S \\le 2C\\) specimens,\
    \ and \\(M\\): a list of mass of the \\(S\\) specimens, determine in which chamber\
    \ we should store each specimen in order to minimize IMBALANCE. See Figure 3.3\
    \ for visual explanation.\n\n\\(A = (\\sum_{j=1}^{S} M_j)/C\\), i.e. \\(A\\) is\
    \ the average of all mass over \\(C\\) chambers.\n\n\\(\\mathrm{IMBALANCE} = \\\
    sum_{i=1}^{C} |X_i - A|\\), i.e. sum of differences between the mass in each chamber\
    \ w.r.t \\(A\\).\n\nwhere \\(X_i\\) is the total mass of specimens in chamber\
    \ \\(i\\).\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_47_0.png)\n\nFigure 3.3:\
    \ Visualization of UVa 410 - Station Balance\n\nThis problem can be solved using\
    \ a greedy algorithm. But first, we have to make several observations. If there\
    \ exists an empty chamber, at least one chamber with 2 specimens must be moved\
    \ to this empty chamber! Otherwise the empty chambers contribute too much to IMBALANCE!\
    \ See Figure 3.4.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_47_1.png)\n\nFigure\
    \ 3.4: UVa 410 - Observation 1\n\nNext observation: If \\(S > C\\), then \\(S-C\\\
    ) specimens must be paired with one other specimen already in some chambers. The\
    \ Pigeonhole principle! See Figure 3.5.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_47_2.png)\n\
    \nFigure 3.5: UVa 410 - Observation 2\n\nNow, the key insight that can simplify\
    \ the problem is this: If \\(S < 2C\\), add dummy \\(2C-S\\) specimens with mass\
    \ 0. For example, \\(C = 3, S = 4, M = \\{5, 1, 2, 7\\} \\Rightarrow C = 3, S\
    \ = 6, M = \\{5, 1, 2, 7, 0, 0\\}\\). Then, sort these specimens based on their\
    \ mass such that \\(M_1 \\le M_2 \\le \\ldots \\le M_{2C-1} \\le M_{2C}\\). In\
    \ this example, \\(M = \\{5, 1, 2, 7, 0, 0\\} \\rightarrow \\{0, 0, 1, 2, 5, 7\\\
    }\\). By adding dummy specimens and then sorting them, a greedy strategy ‘appears’.\
    \ We can now:\nPair the specimens with masses $M_1$ & $M_{2C}$ and put them in\
    \ chamber 1, then pair the specimens with masses $M_2$ & $M_{2C-1}$ and put them\
    \ in chamber 2, and so on . . .\nThis greedy algorithm — known as ‘Load Balancing’\
    \ — works! See Figure 3.6.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_48_0.png)\n\
    \nFigure 3.6: UVa 410 - Greedy Solution\n\nTo come up with this way of, as it\
    \ is lightweight, but tends to get WA response. Proving that a certain problem\
    \ has optimal sub-structure and greedy property in contest time may be time consuming,\
    \ so a competitive programmer usually do this:\n\nHe will look at the input size.\
    \ If it is ‘small enough’ for the time complexity of either Complete Search or\
    \ Dynamic Programming (see Section 3.4), he will use one of these approaches as\
    \ both will ensure correct answer. He will only use Greedy solution if he knows\
    \ for sure that the input size given in the problem is too large for his best\
    \ Complete Search or DP solution.\n\nHaving said that, it is quite true that many\
    \ problem setters nowadays set the input size of such can-use-greedy-algorithm-or-not-problems\
    \ to be in some reasonable range so contestants cannot use the input size to quickly\
    \ determine the required algorithm!\n\nProgramming Exercises solvable using Greedy\
    \ (hints omitted):\n\n- 1. UVa 410 - Station Balance (elaborated in this section)\n\
    - 2. UVa 10020 - Minimal Coverage\n- 3. UVa 10340 - All in All\n- 4. UVa 10440\
    \ - Ferry Loading II\n- 5. UVa 10670 - Work Reduction\n- 6. UVa 10763 - Foreign\
    \ Exchange\n- 7. UVa 11054 - Wine Trading in Gergovia\n- 8. UVa 11292 - Dragon\
    \ of Loowater\n- 9. UVa 11369 - Shopaholic\n\nIn this section, we want to highlight\
    \ another problem solving trick called: *Decomposition!*\n\nWhile there are only\
    \ *few* basic algorithms used in contest problems (most of them are covered in\
    \ this book), harder problems may require a *combination* of two (or more) algorithms\
    \ for their solution. For such problems, try to decompose parts of the problems\
    \ so that you can solve the different parts independently. We illustrate this\
    \ decomposition technique using a recent top-level programming problems that combines\
    \ *three* problem solving paradigms that we have just learned: Complete Search,\
    \ Divide & Conquer, and Greedy!\n\n## ACM ICPC World Final 2009 - Problem A -\
    \ A Careful Approach\n\nYou are given a scenario of airplane landings. There are\
    \ 2 ≤ n ≤ 8 airplanes in the scenario. Each airplane has a time window during\
    \ which it can safely land. This time window is specified by two integers a_i,\
    \ b_i, which give the beginning and end of a closed interval [a_i, b_i] during\
    \ which the i-th plane can land safely. The numbers a_i and b_i are specified\
    \ in minutes and satisfy 0 ≤ a_i ≤ b_i ≤ 1440. In this problem, plane landing\
    \ time is negligible. Then, your task is to:\n\n- 1. Compute an **order** for\
    \ landing all airplanes that respects these time windows.\n  \n  HINT: order =\
    \ permutation = Complete Search?\n- 2. Furthermore, the airplane landings should\
    \ be stretched out **as much as possible** so that the minimum achievable time\
    \ gap between successive landings is as large as possible. For example, if three\
    \ airplanes land at 10:00am, 10:05am, and 10:15am, then the smallest gap is five\
    \ minutes, which occurs between the first two airplanes. Not all gaps have to\
    \ be the same, but the smallest gap should be as large as possible!\n  \n  HINT:\
    \ Is this similar to ‘greedy activity selection’ problem [4]?\n- 3. Print the\
    \ answer split into minutes and seconds, rounded to the closest second.\n  \n\
    \  See Figure 3.7 for illustration: line = the time window of a plane; star =\
    \ its landing schedule.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_49_0.png)\n\
    \n**Solution:**\n\nSince the number of planes is at most 8, an optimal solution\
    \ can be found by simply trying all 8! = 40320 possible orders for the planes\
    \ to land. This is the **Complete Search** portion of the problem which can be\
    \ easily solved using C++ STL `next_permutation`.\n\nNow, for each specific landing\
    \ order, we want to know the largest possible landing window. Suppose we use a\
    \ certain window length L. We can greedily check whether this L is feasible by\
    \ forcing the first plane to land as soon as possible and the subsequent planes\
    \ to land in `max(a[that plane], previous landing time + L)`. This is a **Greedy\
    \ Algorithm**.\n\nA window length L that is too long/short will overshoot/undershoot\
    \ `b[last plane]`, so we have to decrease/increase L. We can binary search the\
    \ answer L - **Divide & Conquer**. As we only want the answer rounded to nearest\
    \ integer, stopping binary search when error ε ≤ 1e-3 is enough. For more details,\
    \ please study our AC source code shown on the next page.\n"
  mdcn: "\n## 3.3 贪心法\n\n如果一个算法在每一步都做出局部最优选择，并希望借此找到最优解，那么该算法被称为贪心算法。在某些情况下，贪心法有效——解法代码短小且运行高效。但对于*许多*其他情况，它并不有效。正如[4]中所讨论的，一个问题必须具备两点，贪心算法才能对其有效：\n\
    \n- 1. 它具有最优子结构。\n  \n  问题的最优解包含子问题的最优解。\n\n- 2. 它具有贪心性质（备注：很难证明其正确性！）。\n  \n\
    \  如果我们做出当前看起来最好的选择，并在之后解决剩余的子问题，我们仍能达到最优解。我们永远不必重新考虑之前的选择。\n\n### 3.3.1 经典示例\n\
    \n假设我们有大量不同面额的硬币，即 25、10、5 和 1 美分。我们想用*最少数量*的硬币找零。以下贪心算法适用于该问题的这组面额：持续使用不大于剩余待找金额的最大面额硬币。示例：如果面额为\
    \ {25, 10, 5, 1} 美分，我们要找零 42 美分，可以这样做：42-25 = 17 → 17-10 = 7 → 7-5 = 2 → 2-1 =\
    \ 1 → 1-1 = 0，总共 5 枚硬币。这是最优的。\n\n上述找零示例具备贪心算法成功的两个要素：\n\n- 1. 它具有最优子结构。\n  \n\
    \  我们已经看到，在找零 42 美分的原问题中，我们必须使用 25+10+5+1+1。这是原问题的一个最优 5 枚硬币解！\n  \n  现在，其子问题的最优解包含在这个\
    \ 5 枚硬币解中，即\n  - a. 要找零 17 美分，我们必须使用 10+5+1+1（4 枚硬币），\n  - b. 要找零 7 美分，我们必须使用\
    \ 5+1+1（3 枚硬币），等等\n\n- 2. 它具有贪心性质。\n  \n  给定每个金额 *V*，我们贪心地用不大于该金额 *V* 的最大面额硬币减去它。可以证明（为简洁起见此处不展示），使用与此不同的其他策略不会得到最优解。\n\
    \n然而，这个贪心算法并*不*适用于*所有*硬币面额集合，例如 {1, 3, 4} 美分。要用该集合找零 6 美分，贪心算法会选择 3 枚硬币 {4, 1,\
    \ 1}，而不是使用 2 枚硬币 {3, 3} 的最优解。这个问题将在 3.4.2 节中重新讨论。\n\n算法教科书中还有许多其他经典的贪心算法示例，例如：用于最小生成树（MST）问题的\
    \ Kruskal 算法——4.4 节，用于单源最短路径（SSSP）问题的 Dijkstra 算法——4.5 节，贪心活动选择问题[4]，霍夫曼编码[4]，等等。\n\
    \n### 3.3.2 非经典示例\n\n如今的竞赛题通常不会要求解决平凡的经典贪心问题。相反，我们会遇到需要创造力的新颖问题，如下所示。\n\n### UVa\
    \ 410 - 车站平衡（Station Balance）\n\n给定 \\(1 \\le C \\le 5\\) 个可存放 0、1 或 2 个标本的腔室，\\\
    (1 \\le S \\le 2C\\) 个标本，以及 \\(M\\)：\\(S\\) 个标本的质量列表，确定我们应该将每个标本存放在哪个腔室中，以最小化\
    \ IMBALANCE。可视化解释见图 3.3。\n\n\\(A = (\\sum_{j=1}^{S} M_j)/C\\)，即 \\(A\\) 是所有质量在\
    \ \\(C\\) 个腔室上的平均值。\n\n\\(\\mathrm{IMBALANCE} = \\sum_{i=1}^{C} |X_i - A|\\)，即每个腔室中的质量相对于\
    \ \\(A\\) 的差之和。\n\n其中 \\(X_i\\) 是第 \\(i\\) 个腔室中标本的总质量。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_47_0.png)\n\
    \n图 3.3：UVa 410 - 车站平衡（Station Balance）的可视化\n\n这个问题可以使用贪心算法解决。但首先，我们必须做出几个观察。如果存在一个空腔室，那么至少有一个装有\
    \ 2 个标本的腔室必须被移到这个空腔室中！否则空腔室会对 IMBALANCE 贡献太大！见图 3.4。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_47_1.png)\n\
    \n图 3.4：UVa 410 - 观察 1\n\n下一个观察：如果 \\(S > C\\)，那么 \\(S-C\\) 个标本必须与某个腔室中已有的另一个标本配对。鸽巢原理！见图\
    \ 3.5。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_47_2.png)\n\n图 3.5：UVa 410\
    \ - 观察 2\n\n现在，可以简化问题的关键洞察是：如果 \\(S < 2C\\)，则添加质量为 0 的虚拟 \\(2C-S\\) 个标本。例如，\\\
    (C = 3, S = 4, M = \\{5, 1, 2, 7\\} \\Rightarrow C = 3, S = 6, M = \\{5, 1, 2,\
    \ 7, 0, 0\\}\\)。然后，根据质量对这些标本排序，使得 \\(M_1 \\le M_2 \\le \\ldots \\le M_{2C-1} \\\
    le M_{2C}\\)。在此示例中，\\(M = \\{5, 1, 2, 7, 0, 0\\} \\rightarrow \\{0, 0, 1, 2, 5,\
    \ 7\\}\\)。通过添加虚拟标本然后排序，一种贪心策略“出现”了。我们现在可以：\n将质量为 $M_1$ 和 $M_{2C}$ 的标本配对并放入腔室 1，然后将质量为\
    \ $M_2$ 和 $M_{2C-1}$ 的标本配对并放入腔室 2，依此类推……\n这种贪心算法——称为“负载均衡”——有效！见图 3.6。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_48_0.png)\n\
    \n图 3.6：UVa 410 - 贪心解法\n\n要提出这种做法，因为它很轻量，但往往会导致 WA 结果。在比赛时间内证明某个问题具有最优子结构和贪心性质可能很耗时，因此竞赛程序员通常会这样做：\n\
    \n他会查看输入规模。如果对于完全搜索或动态规划（见 3.4 节）的时间复杂度来说它“足够小”，他会使用其中一种方法，因为两者都能确保正确答案。只有当他知道题目给定的输入规模对于他最好的完全搜索或\
    \ DP 解法来说肯定太大时，他才会使用贪心解法。\n\n话虽如此，如今许多出题人确实会把这种能否使用贪心算法的问题的输入规模设置在某个合理范围内，以便参赛者无法利用输入规模快速确定所需算法！\n\
    \n可用贪心法解决的编程练习（提示略）：\n\n- 1. UVa 410 - Station Balance（本节详细讨论）\n- 2. UVa 10020\
    \ - Minimal Coverage\n- 3. UVa 10340 - All in All\n- 4. UVa 10440 - Ferry Loading\
    \ II\n- 5. UVa 10670 - Work Reduction\n- 6. UVa 10763 - Foreign Exchange\n- 7.\
    \ UVa 11054 - Wine Trading in Gergovia\n- 8. UVa 11292 - Dragon of Loowater\n\
    - 9. UVa 11369 - Shopaholic\n\n在本节中，我们想强调另一种解题技巧：*分解！*\n\n虽然竞赛题中只使用*少数*基本算法（本书涵盖了其中大部分），但更难的问题可能需要*组合*两种（或更多）算法来求解。对于这类问题，尝试将问题分解成若干部分，以便可以独立求解不同部分。我们用一个近期的顶级编程题来说明这种分解技术，该题结合了我们刚学过的*三个*问题求解范式：完全搜索、分治法和贪心法！\n\
    \n## ACM ICPC 2009 世界总决赛 - Problem A - A Careful Approach（谨慎的方法）\n\n给定一个飞机着陆场景。该场景中有\
    \ 2 ≤ n ≤ 8 架飞机。每架飞机都有一个可以安全着陆的时间窗口。该时间窗口由两个整数 a_i、b_i 指定，它们给出第 i 架飞机可以安全着陆的闭区间\
    \ [a_i, b_i] 的起点和终点。数字 a_i 和 b_i 以分钟为单位，并满足 0 ≤ a_i ≤ b_i ≤ 1440。本题中，飞机着陆时间可忽略不计。然后，你的任务是：\n\
    \n- 1. 计算一个满足这些时间窗口的所有飞机着陆的**顺序**。\n  \n  提示：顺序 = 排列 = 完全搜索？\n- 2. 此外，飞机着陆应**尽可能拉开**，以使相邻着陆之间可实现的最小时间间隔尽可能大。例如，如果三架飞机分别在上午\
    \ 10:00、10:05 和 10:15 着陆，那么最小间隔是五分钟，出现在前两架飞机之间。并非所有间隔都必须相同，但最小间隔应尽可能大！\n  \n \
    \ 提示：这是否类似于“贪心活动选择”问题[4]？\n- 3. 输出答案，将其分为分钟和秒，并四舍五入到最接近的秒。\n  \n  见图 3.7 的图示：线\
    \ = 飞机的时间窗口；星号 = 其着陆安排。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_49_0.png)\n\
    \n**解决方案：**\n\n由于飞机数量最多为 8，因此只需尝试所有 8! = 40320 种可能的飞机着陆顺序即可找到最优解。这是问题的**完全搜索**部分，可以使用\
    \ C++ STL `next_permutation` 轻松解决。\n\n现在，对于每个特定的着陆顺序，我们想知道尽可能大的着陆窗口。假设我们使用某个窗口长度\
    \ L。我们可以通过强制第一架飞机尽可能早着陆，并让后续飞机在 `max(a[that plane], previous landing time + L)`\
    \ 着陆，来贪心地检查这个 L 是否可行。这是一个**贪心算法**。\n\n窗口长度 L 太长/太短会超出/低于 `b[last plane]`，因此我们必须减小/增大\
    \ L。我们可以对答案 L 进行二分查找——**分治法**。由于我们只希望答案四舍五入到最接近的整数，因此当误差 ε ≤ 1e-3 时停止二分查找就足够了。更多细节，请研究下一页展示的我们的\
    \ AC 源代码。\n\n"
