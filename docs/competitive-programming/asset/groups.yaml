    # 2.3.3  Segment Tree


    In this subsection, we discuss another data structure which can efficiently answer
    *dynamic* range queries. As a starting point, we discuss a problem of finding
    the index of the minimum element in an array given a range: [i..j]. This is more
    commonly known as the Range Minimum Query (RMQ). For example, given an array A
    of size 7 below, RMQ(1, 3) = 2, as the index 2 contains the minimum element among
    A[1], A[2], and A[3]. To check your understanding of RMQ, verify that on array
    A below, RMQ(3, 4) = 4, RMQ(0, 0) = 0, RMQ(0, 1) = 1, and RMQ(0, 6) = 5.


    ```text

    Values  =   8  |  7  |  3  |  9  |  5  |  1  |  10

    Array A =

    Indices =   0  |  1  |  2  |  3  |  4  |  5  |  6

    ```


    There are several ways to solve this RMQ. One of the trivial algorithm is to simply
    iterate the array from index i to j and report the index with the minimum value.
    But this is O(n) per query. When n is large, such algorithm maybe infeasible.


    In this section, we solve the RMQ with Segment Tree: a binary tree similar to
    heap, but usually not a complete binary tree. For the array A above, the segment
    tree is shown in Figure 2.7. The root of this tree contains the full segment,
    from [0, N - 1]. And for each segment [l, r], we split them into [l, (l + r) /
    2] and [(l + r) / 2 + 1, r] until l = r. See the O(n log n) `built_segment_tree`
    routine below. With this segment tree already built, answering an RMQ can now
    be done in O(log n).


    For example, we want to answer RMQ(1, 3). The execution in Figure 2.7 (red solid
    lines) is as follows: From root [0, 6], we know that the answer for RMQ(1, 3)
    is on the left of vertex [0, 6] as [0, 6] still larger than the RMQ(1, 3), thus
    the stored min(minimum) value of [0, 6] = 5 is not appropriate as it is the min
    value over a larger segment [0, 6] than the RMQ(1, 3).


    We move to the left segment [0, 3]. At vertex [0, 3], we have to search two sides
    as [0, 3] is still larger than the RMQ(1, 3) and intersect *both* the left segment
    [0, 1] and the right segment [2, 3].


    The right segment is [2, 3], which is inside the required RMQ(1, 3), so from the
    stored min value inside this node, we know that RMQ(2,3) = 2. We do *not* need
    to traverse further down.


    The left segment is [0, 1], which is not yet inside the RMQ(1, 3), so another
    split is necessary. From [0, 1], we move right to segment [1, 1], which is now
    inside the RMQ(1, 3). Then, we return the min value = 1 to the caller.


    Back in segment [0, 3], we now know that RMQ(1, 1) = 1 and RMQ(2, 3) = 2. Because
    A[RMQ(1, 1)] > A[RMQ(2, 3)] since A[1] = 7 and A[2] = 3, we know that RMQ(1, 3)
    = 2.


    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_33_0.png)


    Figure 2.7: Segment Tree of Array A {8, 7, 3, 9, 5, 1, 10}


    Let’s take a look at another example: RMQ(4, 6). The execution in Figure 2.7 (blue
    dashed line) is as follows: We again start from the root [0, 6]. Since it is bigger
    than the query, we move right'
