    \ students who are planning to join competitions like IOI are encouraged to do\
    \ self-study on these materials.\n\n### 2.2 Data Structures with Built-in Libraries\n\
    \n#### 2.2.1 Linear Data Structures\n\nA data structure is classified as *linear*\
    \ if its elements form a sequence. Mastery of all these basic linear data structures\
    \ below is a must to do well in today’s programming contests.\n\n- Static Array\
    \ in C/C++ and in Java\n\n  This is clearly the most commonly used data structure\
    \ in programming contests whenever there is a collection of sequential data to\
    \ be stored and later accessed using their indices. As the maximum input size\
    \ is normally mentioned in a programming problem, then usually the declared array\
    \ size is this value + small extra buffer. Typical dimensions of the array are:\
    \ 1-D, 2-D, 3-D, and rarely goes beyond 4-D. Typical operations for array are:\
    \ accessing certain indices, sorting the array, linearly scanning, or binary searching\
    \ the array.\n\n- Resizable Array a.k.a. Vector: C++ STL `<vector>` (Java ArrayList)\n\
    \n  All else is the same as static array but has auto-resize feature. Using vector\
    \ over array is better if array size is unknown beforehand, i.e. before running\
