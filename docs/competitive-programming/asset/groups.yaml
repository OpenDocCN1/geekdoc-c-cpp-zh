    \n## 4.4 Kruskal’s\n\n### Basic Form and Application\n\nMotivating problem: Given\
    \ a connected, undirected, and weighted graph $G$ (see the leftmost graph in Figure\
    \ 4.8), select a subset of edges $E' \\subseteq G$ such that the graph $G$ is\
    \ (still) connected and the total weight of the selected edges $E'$ is minimal.\n\
    \nTo satisfy connectivity criteria, edges in $E'$ must form a *tree* that spans\
    \ (covers) all $V \\in G$ — the *spanning tree*! There can be several valid spanning\
    \ trees in $G$, i.e. see Figure 4.8, middle and right sides. One of them is the\
    \ required solution that satisfies the minimal weight criteria.\n\nThis problem\
    \ is called the Minimum Spanning Tree (MST) problem and has many practical applications,\
    \ as we will see later in this section.\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_81_0.png)\n\
    \nFigure 4.8: Example of a Minimum Spanning Tree (MST) Problem (from UVa 908 [17])\n\
    \nThis MST problem can be solved with several well-known algorithms, i.e. Prim’s\
    \ and Kruskal’s, both are greedy algorithms and explained in [4, 21, 14, 23, 16,\
    \ 1, 13, 5]. For programming contests, we opt for Kruskal’s as its implementation\
    \ is very easy with the help of 2 data structures.\n\nJoseph Bernard Kruskal Jr.’s\
    \ algorithm first sorts $E$ edges based on non-decreasing weight in $O(E \\log\
    \ E)$. This can be easily done using `priority_queue` (or alternatively, use `vector`\
    \ & `sort`). Then, it *greedily* tries to add $O(E)$ edges with minimum costs\
    \ to the solution as long as such addition does not form a cycle. This cycle check\
    \ can be done easily using Union-Find Disjoint Sets. The code is short and overall\
    \ runs in $O(E \\log E)$.\n\n```cpp\ntypedef pair<int, int> ii; // we use ii as\
    \ a shortcut of integer pair data type\n\npriority_queue<pair<int, ii> > EdgeList;\
    \ // sort by edge weight O(E log E)\n// PQ default: sort descending. To sort ascending,\
    \ we can use <(negative) weight(i, j), <i, j> >\n```\n"
