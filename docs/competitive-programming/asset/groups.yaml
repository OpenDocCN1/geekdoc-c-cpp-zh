    \nThe main source of the ‘Complete Search’ material in this chapter is the USACO\
    \ training gateway [18].\n\nWe adopt the name ‘Complete Search’ rather than ‘Brute-Force’\
    \ as we believe that some Complete Search solutions can be clever and fast enough,\
    \ although it is complete, e.g. **Branch & Bound** and **A* Search** (both are\
    \ not discussed yet in this book). We believe the term ‘clever Brute-Force’ is\
    \ a bit self-contradicting.\n\nDivide and Conquer paradigm is usually used in\
    \ the form of its popular algorithms: binary search (bisection method), merge/quick/heap\
    \ sort, and data structures: binary search tree, heap, segment tree, etc. We will\
    \ see more Divide and Conquer later in Computational Geometry (Section 7.5).\n\
    \n*Basic* Greedy and Dynamic Programming (DP) techniques are always included in\
    \ popular algorithm textbooks, e.g. Introduction to Algorithms [4], Algorithm\
    \ Design [13], Algorithms [5], Programming Challenges [23], The Art of Algorithms\
    \ and Programming Contests [16], Art of Programming Contest [1]. However, to keep\
    \ pace with the growing difficulties and creativity of these techniques, especially\
    \ the DP techniques, we include more references from the Internet: TopCoder algorithm\
    \ tutorial [25] and recent programming contests, e.g. ACM ICPC Regional Kaohsiung\
    \ 2006, Singapore 2007, Jakarta 2008, Central European Olympiad in Informatics\
    \ 2009, etc.\n\nHowever, for some real-life problems, especially those that are\
    \ classified as NP-Complete [4], many of the approaches discussed so far will\
    \ not work. For example, 0-1 Knapsack Problem, which has $O(NW)$ DP complexity,\
    \ is too slow if $W$ is big. For this, people use heuristics or local search:\
    \ Beam Search, Tabu Search [10], Genetic Algorithm, Ants Colony Optimization,\
    \ etc.\n\nThere are approximately **109 programming exercises** discussed in this\
    \ chapter.\n\n## Chapter 4: Graph\n\n*Many real-life problems can be classified\
    \ as graph problems. Some have efficient solutions. Some do not have them yet.\
    \ In this chapter, we learn various graph problems with known efficient solutions,\
    \ ranging from basic traversal, minimum spanning trees, shortest paths, and network\
    \ flow algorithms.*\n\n### 4.1 Overview and Motivation\n\nIn this chapter, we\
    \ discuss graph problems that commonly appear in programming contests, the algorithms\
    \ to solve them, and the practical implementations of these algorithms. The issue\
    \ on how to store graph information has been discussed earlier in Section 2.3.1.\n\
    \nWe assume that the readers are familiar with the following terminologies: Vertices/Nodes,\
    \ Edges, Un/Weighted, Un/Directed, In/Out Degree, Self-Loop/Multiple Edges (Multigraph)\
    \ versus Simple Graph, Sparse/Dense, Path, Cycle, Isolated versus Reachable Vertices,\
    \ (Strongly) Connected Component, Sub-Graph, Tree/Forest, Complete Graph, Directed\
    \ Acyclic Graph, Bipartite Graph, Euler/Hamiltonian Path/Cycle. If you encounter\
    \ any unknown terms, please go to Wikipedia [46] and search for that particular\
    \ term.\n\nTable 4.1 summarizes our research so far on graph problems in recent\
    \ ACM ICPC Asia regional contests and its ICPC Live Archive [11] IDs. Although\
    \ there are so many graph problems (many are discussed in this chapter), they\
    \ only appear either once or twice in a problem set. The question is: “Which ones\
    \ do we have to learn?” If you want to do well in contests, you have no choice\
    \ but to study all these materials.\n\n### 4.2 Depth First Search\n\n#### Basic\
    \ Form and Application\n\nDepth First Search - abbreviated as DFS - is a simple\
    \ algorithm to traverse a graph. With the help of a global array `int dfs_num[V]`\
    \ which is initially set to ‘unvisited’ (a constant value `DFS_WHITE = 0`), DFS\
    \ starts from a starting vertex, visits the deepest possible vertex from the start\
    \ vertex before attempting other branches. Note that this sequence of visitation\
    \ depends very much on the way we order neighbors of a vertex, i.e. the sequence\
    \ 0 → 1 → 3 → 2 (backtrack to 3) → 4 is also a possible visitation sequence. Also\
    \ notice that one call of `dfs(u)` will only visit all vertices that are *connected*\
    \ to vertex `u`. That is why vertices 5, 6, and 7 in Figure 4.1 are currently\
    \ unvisited by calling `dfs(0)`.\n\nThe DFS code shown here is very similar to\
    \ the recursive backtracking code shown earlier in Section 3.1. If we compare\
    \ the pseudocode of a typical backtracking code (replicated below) with the DFS\
    \ code shown above, we can see that the main difference is just whether we flag\
    \ visited vertices. DFS does. Backtracking does not. By not revisiting vertices,\
    \ DFS runs in $O(V + E)$, but the time complexity of backtracking goes up exponentially.\n\
    \n```c\nvoid backtracking(state) {\n    if (hit end state or invalid state) //\
    \ invalid state includes states that cause cycling\n        return; // we need\
    \ terminating/pruning condition\n    for each neighbor of this state // regardless\
    \ it has been visited or not\n        backtracking(neighbor);\n}\n```\n\n####\
    \ Other Applications\n\nDFS is not only useful for traversing a graph. It can\
    \ be used to solve many other graph problems.\n\n##### Finding Connected Components\
    \ in Undirected Graph\n\nThe fact that one single call of `dfs(u)` will only visit\
    \ vertices that are actually connected to `u` can be utilized to find (and to\
    \ count) the connected components of an undirected graph (see further below for\
    \ a similar problem on directed graph). We can simply use the following code to\
    \ restart DFS from one of the remaining unvisited vertices to find the next connected\
    \ component (until all are visited):\n\n```c\n// all sample codes involving REP\
    \ use this macro\n#define REP(i, a, b) \\\n  for (int i = int(a); i <= int(b);\
    \ i++)\n\n// inside int main()\nnumComponent = 0;\nmemset(dfs_num, DFS_WHITE,\
    \ sizeof dfs_num);\nREP (i, 0, V - 1)\n    if (dfs_num[i] == DFS_WHITE) {\n  \
    \      printf(\"Component %d, visit: \", ++numComponent);\n        dfs(i);\n \
    \       printf(\"\\n\");\n    }\nprintf(\"There are %d connected components\\\
    n\", numComponent);\n\n// For the sample graph, the output is like this:\n// Component\
    \ 1, visit: 0 1 2 3 4\n// Component 2, visit: 5\n// Component 3, visit: 6 7\n\
    ```\n\n**Exercise:** We can also use Union-Find Disjoint Sets to solve this graph\
    \ problem. How?\n\n##### Flood Fill - Labeling the Connected Components\n\nDFS\
    \ can be used for other purposes than just finding (and counting) the connected\
    \ components. Here, we show how a simple tweak of `dfs(u)` can be used to *label*\
    \ the components. Typically, we ‘label’ (or ‘color’) the component by using its\
    \ component number. This variant is more famously known as ‘flood fill’.\n\n```c\n\
    void floodfill(int u, int color) {\n    dfs_num[u] = color; // not just a generic\
    \ DFS_BLACK\n    TRvii(AdjList[u], v) // try all neighbors v of vertex u, note\
    \ that we use our TRvii macro again\n        if (dfs_num[v->first] == DFS_WHITE)\
    \ // avoid cycle\n            floodfill(v->first, color); // v is an (neighbor,\
    \ weight) pair\n}\n\n// inside int main()\nnumComponent = 0;\nmemset(dfs_num,\
    \ DFS_WHITE, sizeof dfs_num);\nREP (i, 0, V - 1) // for each vertex u in [0..V-1],\
    \ note that we use our REP macro again\n    if (dfs_num[i] == DFS_WHITE) // if\
    \ not visited\n        floodfill(i, ++numComponent);\nREP (i, 0, V - 1)\n    printf(\"\
    Vertex %d has color %d\\n\", i, dfs_num[i]);\n\n// For the sample graph, the output\
    \ is like this:\n// Vertex 0 1 2 3 4 have color 1\n// Vertex 5 has color 2\n//\
    \ Vertex 6 7 has color 3\n```\n\n**Exercise:** Flood Fill is more commonly performed\
    \ on 2-D grid (implicit graph). Try to solve UVa 352, 469, 572, etc.\n\n#####\
    \ Graph Edges Property Check via DFS Spanning Tree\n\nRunning DFS on a connected\
    \ component of a graph will form a DFS *spanning tree* (or *spanning forest* if\
    \ the graph has more than one component and DFS is run on each component). With\
    \ one more vertex state: `DFS_GRAY = 2` (visited but not yet completed) on top\
    \ of `DFS_WHITE` (unvisited) and `DFS_BLACK` (visited and completed), we can use\
    \ this DFS spanning tree (or forest) to classify graph edges into four types:\n\
    \n1. **Tree edges:** those traversed by DFS, i.e. from vertex with `DFS_GRAY`\
    \ to vertex with `DFS_WHITE`.\n2. **Back edges:** part of cycle, i.e. from vertex\
    \ with `DFS_GRAY` to vertex with `DFS_GRAY` too. Note that usually we do not count\
    \ bi-directional edges as having ‘cycle’ (We need to remember `dfs_parent` to\
    \ distinguish this, see the code below).\n3. **Forward/Cross edges:** from vertex\
    \ with `DFS_GRAY` to vertex with `DFS_BLACK`. These two types of edges are not\
    \ typically used in programming contest problems.\n\nFigure 4.2 shows an animation\
    \ (from top left to bottom right) of calling `dfs(0)`, then `dfs(5)`, and finally\
    \ `dfs(6)` on the sample graph in Figure 4.1. We can see that 1 → 2 → 3 → 1 is\
    \ a (true) cycle and we classify edge (3 → 1) as a back edge, whereas 0 → 1 →\
    \ 0 is not a cycle but edge (1 → 0) is just a bi-directional edge. The code for\
    \ this DFS variant is shown below.\n"
