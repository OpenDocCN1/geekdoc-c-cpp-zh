    \ with 3 sides: $a$, $b$, $c$, is $A = \\sqrt{s \\times (s-a) \\times (s-b) \\\
    times (s-c)}$, where $s = 0.5 \\times p$ (the **Semi-Perimeter** of the triangle).\n\
    - 5. The radius $r$ of the Triangle’s **Inner Circle** with area $A$ and the semi-perimeter\
    \ $s$ is $r = A/s$.\n- 6. The radius $R$ of the Triangle’s **Outer Circle** with\
    \ 3 sides: $a$, $b$, $c$ and area $A$ is $R = a \\times b \\times c/(4 \\times\
    \ A)$.\n- 7. In **Trigonometry**, the **Law of Cosines** (a.k.a. the **Cosine\
    \ Formula** or the **Cosine Rule**) is a statement about a general triangle that\
    \ relates the lengths of its sides to the cosine of one of its angles. See the\
    \ scalene (middle) triangle in Figure 7.2. With the notation described here, we\
    \ have: $c^2 = a^2 + b^2 - 2 \\times a \\times b \\times \\cos(\\gamma)$. This\
    \ formula can be rewritten for the other two angles $\\alpha$ and $\\beta$.\n\
    - 8. In Trigonometry, the **Law of Sines** (a.k.a. the **Sine Formula** or the\
    \ **Sine Rule**) is an equation relating the lengths of the sides of an arbitrary\
    \ triangle to the sines of its angle. See the scalene (middle) triangle in Figure\
    \ 7.2. With the notation described there, we have: $\\frac{a}{\\sin(\\alpha)}\
    \ = \\frac{b}{\\sin(\\beta)} = \\frac{c}{\\sin(\\gamma)}$.\n- 9. In Trigonometry,\
    \ the **Pythagorean Theorem** specializes the **Law of Cosines**. The Pythagorean\
    \ theorem is only correct for right triangles. If the angle $\\gamma$ is a right\
    \ angle (of measure $90^\\circ$ or $\\pi/2$ radians), then $\\cos(\\gamma) = 0$,\
    \ and thus the law of cosines reduces to: $c^2 = a^2 + b^2$.\n- 10. In Trigonometry,\
    \ the **Pythagorean Triple** is a triple with three positive integers $a$, $b$,\
    \ and $c$, such that $a^2 + b^2 = c^2$. Such a triple is commonly written as $(a,b,c)$.\
    \ A well-known example is $(3,4,5)$. If $(a,b,c)$ is a Pythagorean triple, then\
    \ so is $(ka,kb,kc)$ for any positive integer $k$. A **Primitive Pythagorean Triple**\
    \ is one in which $a$, $b$, and $c$ are coprime. Primitive Pythagorean Triples\
    \ describe the three integer side lengths of a Right Triangle, although the converse\
    \ may not be true.\n\nProgramming Exercises related to Triangles (and possibly\
    \ Circles again):\n\n- 1. UVa 143 - Orchard Trees (counting integer points in\
    \ triangle)\n- 2. UVa 190 - Circle Through Three Points (triangle’s outer circle)\n\
    - 3. UVa 438 - The Circumference of the Circle (triangle’s outer circle)\n- 4.\
    \ UVa 10195 - The Knights Of The Round Table (triangle’s inner circle, Heron’s\
    \ formula)\n- 5. UVa 10286 - The Trouble with a Pentagon (Law of Sines)\n- 6.\
    \ UVa 10347 - Medians (given 3 medians of a triangle, find its area)\n- 7. UVa\
    \ 10991 - Region (Heron’s formula, Law of Cosines, area of sector)\n- 8. UVa 11152\
    \ - Coloured Flowers (triangle’s inner and outer circle, Heron’s formula)\n- 9.\
    \ UVa 11437 - Triangle Fun\n- 10. UVa 11479 - Is this the easiest problem? (property\
    \ check)\n- 11. UVa 11524 - In-Circle (yet another variant of circles in triangles)\n\
    - 12. UVa 11579 - Triangle Trouble\n- 13. LA 4413 - Triangle Hazard\n- 14. LA\
    \ 4717 - In-circles Again\n\n### Rectangles\n\n- 1. A **Rectangle** is a polygon\
    \ with four edges, four vertices, and four right angles.\n- 2. The **Area** \\\
    (A\\) of a rectangle with width \\(w\\) and height \\(h\\) is \\(A = w \\times\
    \ h\\).\n- 3. The **Perimeter** \\(p\\) of a rectangle with width \\(w\\) and\
    \ height \\(h\\) is \\(p = 2 \\times (w + h)\\).\n- 4. A **Square** is a special\
    \ case of rectangle where \\(w = h\\).\n\n**Programming Exercises related to Rectangles:**\n\
    \n- 1. UVa 201 - Square\n- 2. UVa 476 - Point in Figures: Rectangles\n- 3. UVa\
    \ 922 - Rectangles by the Ocean\n- 4. UVa 10502 - Counting Rectangles (Complete\
    \ Search)\n- 5. UVa 10908 - Largest Square (implicit square)\n- 6. UVa 11207 -\
    \ The Easiest Way (cutting rectangle into 4-equal-sized squares)\n- 7. UVa 11455\
    \ - Behold My Quadrangle (property check)\n\n### Trapeziums\n\n- 1. A **Trapezium**\
    \ is a polygon with four edges, four vertices, and one pair of parallel edges.\
    \ If the two non-parallel sides of the trapezium have the same length, we have\
    \ an **Isosceles Trapezium**.\n- 2. The **Area** \\(A\\) of a trapezium with base\
    \ \\(w1\\), another edge parallel with the base \\(w2\\) and height \\(h\\) is\
    \ \\(A = 0.5 \\times (w1 + w2) \\times h\\).\n\n### Quadrilaterals\n\n- 1. A **Quadrilateral**\
    \ or **Quadrangle** is a polygon with four edges (and four vertices). Rectangles,\
    \ Squares, and Trapeziums that are mentioned above are Quadrilaterals. Figure\
    \ 7.3 shows a few more examples: **Parallelogram**, **Kite**, **Rhombus**.\n\n\
    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_135_0.png)\n\nFigure 7.3: Quadrilaterals\n"
  mdcn: "\n我们将本章分为两部分。第一部分是第 7.2 节的**几何基础**。我们回顾许多（并非全部）编程竞赛中常用的英文几何术语和公式。第二部分讨论第\
    \ 7.4 - 7.5 节的**计算几何**，其中我们使用可以用几何方式表述的*数据结构和算法*。\n\n## 7.2 几何基础\n\n由于 ACM ICPC\
    \ 参赛者来自不同的国籍、语言和背景，下面这些英文几何术语有时可能看起来陌生。在此，我们尝试提供一个列表——它不可能详尽无遗——供参赛者在遇到几何问题时作为快速参考。\n\
    \n### 直线\n\n- 1. **直线**可以用数学方程描述：$y = mx + c$ 或 $ax + by + c = 0$。$y = mx + c$\
    \ 方程涉及“梯度”/“斜率”$m$。\n- 注意：小心具有“无穷大”斜率的垂直线。通常，我们在求解代码中单独处理垂直线（几何问题中*特殊情况*的示例）。\n\
    - 2. 一条**线段**是长度有限、有两个端点的直线。\n\n**与直线相关的编程练习：**\n\n- 1. UVa 184 - 激光线\n- 2. UVa\
    \ 270 - 排队\n- 3. UVa 833 - 瀑布\n- 4. UVa 10180 - 罗普兰的绳索危机（线段上的最近点）\n- 5. UVa 10242\
    \ - 第四点\n- 6. UVa 10263 - 铁路\n- 7. UVa 11068 - 一个简单的任务（直线 ax + by + c）\n- 8. UVa\
    \ 11277 - 银弹（完全搜索 + 下文讨论的共线测试）\n- 9. LA 4601 - 欧几里得（2009 年美国东南部赛区）\n\n### 圆（见图\
    \ 7.1）\n\n- 1. 在二维*笛卡尔*坐标系中，以 $(a, b)$ 为圆心、半径为 $r$ 的**圆**是所有满足 $(x - a)^2 + (y\
    \ - b)^2 = r^2$ 的点 $(x, y)$ 的集合。\n- 2. 常数 $\\pi$ 是欧几里得空间中*任意*圆的周长与其直径的**比值**。为避免精度误差，编程竞赛中最安全的值是\
    \ $\\pi = 2 \\times acos(0.0)$，除非题目描述中已定义该常数！\n- 3. 圆的**周长** $c$ 与**直径** $d$ 的关系为\
    \ $c = \\pi \\times d$，其中 $d = 2 \\times r$。\n- 4. 周长为 $c$、角度为 $\\alpha$（单位为度²）的圆的**弧**长为\
    \ $\\frac{\\alpha}{360.0} \\times c$。\n\n² 人类通常使用度，但编程语言中的许多数学函数使用弧度。请查阅你的编程语言手册以确认这一点。为帮助换算，只需记住一\
    \ $\\pi$ 弧度等于 180 度。\n\n- 5. 半径为 *r*、角度为 *α*（单位为度）的圆的**弦**长可通过**余弦定理**得到：\\(2r^2\
    \ \\times (1 - \\cos(α))\\)——参见下文关于三角形的讨论中对这一定理的解释。\n- 6. 半径为 *r* 的圆的**面积** A\
    \ 为 \\(A = π × r^2\\)。\n- 7. 面积为 A、角度为 α（单位为度）的圆的**扇形**面积为 \\(\\frac{α}{360.0}\
    \ × A\\)。\n- 8. 圆的**弓形**面积可通过从相应扇形的面积中减去一个等腰三角形的面积得到，该三角形的边长为：*r*、*r* 和弦长。\n\n\
    ![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_133_0.png)\n\n图 7.1：圆\n\n**仅与圆相关的编程练习：**\n\
    \n- 1. UVa 10005 - 打包多边形（完全搜索：经过 2 点的圆，测试其他点）\n- 2. UVa 10012 - 它有多大（圆半径，使用完全搜索）\n\
    - 3. UVa 10136 - 巧克力曲奇（经过 2 点的圆）\n- 4. UVa 10221 - 卫星（求圆的弧长和弦长）\n- 5. UVa 10342\
    \ - 圆内多边形（圆内的 n 边正多边形）\n- 6. UVa 10451 - 古村运动（n 边正多边形的内切圆/外接圆）\n- 7. UVa 10589\
    \ - 面积（检查点是否在 4 个圆的交集内）\n\n### 三角形（见图 7.2）\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_133_1.png)\n\
    \n图 7.2：三角形\n\n- 1. **三角形**是具有三个顶点和三条边的多边形（定义见下文）。三角形有几种类型：\n  - **等边三角形**，三条边长度相同，所有内角均为\
    \ 60 度；\n  - **等腰**三角形，有两条边长度相同；\n  - **不等边**三角形，没有边长度相同；\n  - **直角**三角形，其中一个内角为\
    \ 90 度（或一个**直角**）。\n- 2. 底为 $b$、高为 $h$ 的三角形的**面积** $A$ 为 $A = 0.5 \\times b \\\
    times h$。\n- 3. 三边为 $a$、$b$、$c$ 的三角形的**周长** $p$ 为 $p = a + b + c$。\n- 4. **海伦公式**：三边为\
    \ $a$、$b$、$c$ 的三角形的面积 $A$ 为 $A = \\sqrt{s \\times (s-a) \\times (s-b) \\times\
    \ (s-c)}$，其中 $s = 0.5 \\times p$（三角形的**半周长**）。\n- 5. 面积为 $A$、半周长为 $s$ 的三角形的**内切圆**半径为\
    \ $r = A/s$。\n- 6. 三边为 $a$、$b$、$c$、面积为 $A$ 的三角形的**外接圆**半径为 $R = a \\times b \\\
    times c/(4 \\times A)$。\n- 7. 在**三角学**中，**余弦定理**（又称**余弦公式**或**余弦法则**）是关于一般三角形的命题，它将该三角形各边的长度与其某个角的余弦联系起来。参见图\
    \ 7.2 中的不等边（中间）三角形。采用此处描述的记号，有：$c^2 = a^2 + b^2 - 2 \\times a \\times b \\times\
    \ \\cos(\\gamma)$。该公式可针对另外两个角 $\\alpha$ 和 $\\beta$ 改写。\n- 8. 在三角学中，**正弦定理**（又称**正弦公式**或**正弦法则**）是联系任意三角形各边长度与其角的正弦的方程。参见图\
    \ 7.2 中的不等边（中间）三角形。采用那里描述的记号，有：$\\frac{a}{\\sin(\\alpha)} = \\frac{b}{\\sin(\\\
    beta)} = \\frac{c}{\\sin(\\gamma)}$。\n- 9. 在三角学中，**勾股定理**是**余弦定理**的特例。勾股定理仅对直角三角形成立。如果角\
    \ $\\gamma$ 是直角（度量为 $90^\\circ$ 或 $\\pi/2$ 弧度），则 $\\cos(\\gamma) = 0$，于是余弦定理简化为：$c^2\
    \ = a^2 + b^2$。\n- 10. 在三角学中，**毕达哥拉斯三元组**是由三个正整数 $a$、$b$、$c$ 组成的三元组，满足 $a^2 +\
    \ b^2 = c^2$。这样的三元组通常写作 $(a,b,c)$。一个著名的例子是 $(3,4,5)$。如果 $(a,b,c)$ 是毕达哥拉斯三元组，那么对任意正整数\
    \ $k$，$(ka,kb,kc)$ 也是。**本原毕达哥拉斯三元组**是指其中 $a$、$b$、$c$ 互质的三元组。本原毕达哥拉斯三元组描述直角三角形的三条整数边长，尽管逆命题不一定成立。\n\
    \n与三角形相关的编程练习（可能再次涉及圆）：\n\n- 1. UVa 143 - 果园树木（计算三角形内的整数点）\n- 2. UVa 190 - 过三点的圆（三角形的外接圆）\n\
    - 3. UVa 438 - 圆的周长（三角形的外接圆）\n- 4. UVa 10195 - 圆桌骑士（三角形的内切圆，海伦公式）\n- 5. UVa 10286\
    \ - 五边形的麻烦（正弦定理）\n- 6. UVa 10347 - 中线（给定三角形的 3 条中线，求其面积）\n- 7. UVa 10991 - 区域（海伦公式、余弦定理、扇形面积）\n\
    - 8. UVa 11152 - 彩色花朵（三角形的内切圆和外接圆，海伦公式）\n- 9. UVa 11437 - 三角形乐趣\n- 10. UVa 11479\
    \ - 这是最简单的问题吗？（性质检查）\n- 11. UVa 11524 - 内切圆（三角形中圆的又一种变体）\n- 12. UVa 11579 - 三角形麻烦\n\
    - 13. LA 4413 - 三角形危险\n- 14. LA 4717 - 再次内切圆\n\n### 矩形\n\n- 1. **矩形**是具有四条边、四个顶点和四个直角的多边形。\n\
    - 2. 宽为 \\(w\\)、高为 \\(h\\) 的矩形的**面积** \\(A\\) 为 \\(A = w \\times h\\)。\n- 3. 宽为\
    \ \\(w\\)、高为 \\(h\\) 的矩形的**周长** \\(p\\) 为 \\(p = 2 \\times (w + h)\\)。\n- 4. **正方形**是\
    \ \\(w = h\\) 时矩形的特例。\n\n**与矩形相关的编程练习：**\n\n- 1. UVa 201 - 正方形\n- 2. UVa 476 -\
    \ 图形中的点：矩形\n- 3. UVa 922 - 海边矩形\n- 4. UVa 10502 - 计数矩形（完全搜索）\n- 5. UVa 10908 -\
    \ 最大正方形（隐式正方形）\n- 6. UVa 11207 - 最简单的方法（将矩形切成 4 个等大的正方形）\n- 7. UVa 11455 - 看看我的四边形（性质检查）\n\
    \n### 梯形\n\n- 1. **梯形**是具有四条边、四个顶点和一对平行边的多边形。如果梯形的两条非平行边长度相同，则得到**等腰梯形**。\n- 2.\
    \ 底为 \\(w1\\)、另一条与底平行的边为 \\(w2\\)、高为 \\(h\\) 的梯形的**面积** \\(A\\) 为 \\(A = 0.5 \\\
    times (w1 + w2) \\times h\\)。\n\n### 四边形\n\n- 1. **四边形**或**四角形**是具有四条边（和四个顶点）的多边形。上文提到的矩形、正方形和梯形都是四边形。图\
    \ 7.3 还展示了一些示例：**平行四边形**、**筝形**、**菱形**。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_135_0.png)\n\
    \n图 7.3：四边形\n"
