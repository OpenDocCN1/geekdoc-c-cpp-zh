    \ a different digit. The first digit of one of the numerals is allowed to be zero,\
    \ e.g. 79546 / 01283 = 62; 94736 / 01528 = 62.\n\n  A quick analysis shows that\
    \ fghij can only be from 01234 to 98765, which is ≈ 100K possibilities. For each\
    \ tried fghij, we can get abcde from fghij * N and then check if all digits are\
    \ different. 100K operations are small. Thus, iterative Complete Search is feasible.\n\
    \n  Exercise 1: What is the advantage of iterating through all possible fghij\
