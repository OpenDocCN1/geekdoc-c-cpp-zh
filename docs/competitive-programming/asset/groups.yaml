  - "[PAGE 56]\n\n# Top-Down versus Bottom-Up DP\n\nAs you can see, the way the bottom-up\
    \ DP table is filled is not as intuitive as the top-down DP as it requires some\
    \ ‘reversals’ of the signs in Complete Search recurrence that we have developed\
    \ in previous sections. However, we are aware that some programmers actually feel\
    \ that the bottom-up version is more intuitive. The decision on using which DP\
    \ style is in your hand. To help you decide which style that you should take when\
    \ presented with a DP solution, we present the trade-off comparison between top-down\
    \ and bottom-up DP in Table 3.1.\n\n| Top-Down | Bottom-Up |\n|---|---|\n| **Pro:**<br>1.\
    \ It is a natural transformation from normal Complete Search recursion<br>2. Compute\
    \ sub-problems only when necessary (sometimes this is faster) | **Pro:**<br>1.\
    \ Faster if many sub-problems are revisited as there is no overhead from recursive\
    \ calls<br>2. Can save memory space with DP ‘on-the-fly’ technique (see comment\
    \ in code above) |\n| **Cons:**<br>1. Slower if many sub-problems are revisited\
    \ due to recursive calls overhead (usually this is not penalized in programming\
    \ contests)<br>2. If there are \\(M\\) states, it can use up to \\(O(M)\\) table\
    \ size which can lead to Memory Limit Exceeded (MLE) for some hard problems |\
    \ **Cons:**<br>1. For some programmers who are inclined with recursion, this may\
    \ be not intuitive<br><br>2. If there are \\(M\\) states, bottom-up DP visits\
    \ and fills the value of all these \\(M\\) states |\n\nTable 3.1: DP Decision\
    \ Table\n\n# 3.4.2  Several Classical DP Examples\n\nThere are many other well-known\
    \ problems with efficient DP solutions. We consider these problems as classic\
    \ and therefore must be known by everyone who wish to do well in ICPC or IOI!\n\
    \n# Longest Increasing Subsequence (LIS)\n\nProblem: Given a sequence {X[0], X[1],\
    \ ..., X[N−1]}, determine its Longest Increasing Subsequence (LIS)⁵ as the name\
    \ implies. Take note that ‘subsequence’ is not necessarily contiguous.\n\n**Example:**\n\
    \n\\(N = 8\\), sequence = {−7, 10, 9, 2, 3, 8, 8, 1}\n\nThe LIS is {−7, 2, 3,\
    \ 8} of length 4.\n\nSolution: Let LIS(i) be the LIS ending in index i, then we\
    \ have these recurrences:\n\n+   1. LIS(0) = 1 // base case\n+   2. LIS(i) = ans,\
    \ computed with a loop below:\n\n```\nint ans = 1;\nfor (int j = 0; j < i; j++)\
    \ // O(n)\n    if (X[i] > X[j]) // if we can extend LIS(j) with i\n        ans\
    \ = max(ans, 1 + LIS(j))\n```\n\n⁵ There are other variants of this problem: Longest\
    \ Decreasing Subsequence, Longest Non Increasing/Decreasing Subsequence, and the\
    \ O(n log k) solution by utilizing the fact that the LIS is sorted and binary-searchable.\
    \ See http://en.wikipedia.org/wiki/Longest_increasing_subsequence for more details.\
    \ Note that increasing subsequences can be modeled as a Directed Acyclic Graph\
    \ (DAG). Thus finding LIS is equivalent to finding longest path in DAG."
