    - 5. UVa 11507 - Bender B. Rodriguez 问题（模拟）\n\n## 7.3 格雷厄姆扫描\n\n点集 \\(P\\) 的**凸包**是包含\
    \ \\(P\\) 中每个点（要么在 \\(CH(P)\\) 的边界上，要么在其内部）的最小凸多边形 \\(CH(P)\\)（见图 7.5.D）。\\(CH(P)\\\
    ) 中的每个顶点都是原集合 \\(P\\) 中的一个顶点。因此，寻找凸包的算法必须决定选择 \\(P\\) 中的哪些顶点作为凸包的一部分。\n\n![](img/2f3eff2c1d9ecd727dd36c1db12a8ec9_139_0.png)\n\
    \n图 7.5：点集 \\(P\\) 的凸包 \\(CH(P)\\)\n\n可用的凸包算法有好几种。在本节中，我们选择 \\(O(n \\log n)\\\
    ) 的罗纳德·格雷厄姆扫描算法。该算法首先根据所有 \\(n\\) 个点相对于一个称为基准点的角度对 \\(P\\) 中的点进行排序（图 7.5.A）。在我们的例子中，我们选择\
    \ \\(P\\) 中最低且最右的点作为基准点（参见图 7.5.B 中的点 0 以及其余点的逆时针顺序）。\n\n然后，该算法维护一个候选点栈 \\(S\\\
    )。\\(P\\) 中的每个点都会被压入 \\(S\\) 一次，而最终不会成为 \\(CH(P)\\) 一部分的点会从 \\(S\\) 中弹出。观察图 7.5.C。栈先前包含（栈底）11-0-1-2（栈顶），但当我们尝试插入\
    \ 3 时，1-2-3 构成右转，因此我们弹出 2。现在 0-1-3 是左转，因此我们将 3 压入栈，此时栈包含（栈底）11-0-1-3（栈顶）。\n\n\
    当格雷厄姆扫描结束时，留在 \\(S\\) 中的就是 \\(CH(P)\\) 的点（见图 7.5.D），栈包含（栈底）11-0-1-4-7-10-11（栈顶）。格雷厄姆扫描消除了所有右转！检查\
    \ \\(CH(P)\\) 中顶点的序列总是构成左转——这是一个凸多边形。\n\n下面是格雷厄姆扫描的实现，省略了之前已经展示过的部分（如 ccw 函数）：\n\
    \n```cpp\npoint pivot; // global variable\nvector<point> polygon, CH;\n\nint area2(point\
    \ a, point b, point c) {\n    return a.x * b.y - a.y * b.x + b.x * c.y - b.y *\
    \ c.x + c.x * a.y - c.y * a.x;\n}\n\nint dist2(point a, point b) { // function\
    \ to compute distance between 2 points\n    int dx = a.x - b.x, dy = a.y - b.y;\
    \ return dx * dx + dy * dy;\n}\n\nbool angle_cmp(point a, point b) { // important\
    \ angle-sorting function\n    if (area2(pivot, a, b) == 0) // collinear\n    \
    \    return dist2(pivot, a) < dist2(pivot, b); // which one closer\n\n    int\
    \ d1x = a.x - pivot.x, d1y = a.y - pivot.y;\n    int d2x = b.x - pivot.x, d2y\
    \ = b.y - pivot.y;\n    return (atan2((double)d1y, (double)d1x) - atan2((double)d2y,\
    \ (double)d2x)) < 0;\n}\n```\n\n"
