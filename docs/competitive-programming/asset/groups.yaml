  - "[PAGE 53]\n\nLet’s verify if this problem has overlapping sub-problems. Suppose\
    \ that there are 2 models in certain `garment_id` with the same price $p$. Then,\
    \ Complete Search will move to the same sub-problem `shop(money_left - p, garment_id\
    \ + 1)` after picking either model! Similarly, this situation also occur if some\
    \ combination of `money_left` and chosen model’s price causes `money_left₁ - p₁\
    \ = money_left₂ - p₂`. This same sub-problem will be computed more than once!\
    \ Inefficient!\n\nSo, how many distinct sub-problems (a.k.a. states) are there\
    \ in this problem? The answer is, only $201 \\times 20 = 4,020$. As there are\
    \ only 201 possible `money_left` (from 0 to 200, inclusive) and 20 possible `garment_id`\
    \ (from 0 to 19, inclusive). Each of the sub-problem just need to be computed\
    \ only once. If we can ensure this, we can solve this problem much faster.\n\n\
    Implementation of this DP solution is surprisingly simple. If we already have\
    \ the recursive backtracking (the recurrence relation shown previously), we can\
    \ implement top-down DP by doing these few additional steps:\n\n+   1. Initialize\
    \ a DP ‘memo’ table with dummy values, e.g. ‘-1’.  \n+      The dimension of the\
    \ DP table must be the size of distinct sub-problems.\n+   \n+   2. At the start\
    \ of recursive function, simply check if this current state has been computed\
    \ before.\n+      \n+      (a) If it is, simply return the value from the DP memo\
    \ table, O(1).  \n+      (b) If it is not, compute as per normal (just once) and\
    \ then store the computed value in the DP memo table so that further calls to\
    \ this sub-problem is fast.\n\nAnalyzing DP solution is easy. If it has $M$ states,\
    \ then it requires at least $O(M)$ memory space. If filling a cell in this state\
    \ requires $O(k)$ steps, then the overall time complexity is $O(kM)$. UVa 11450\
    \ - Wedding Shopping problem above has $M = 201 \\times 20 = 4020$ and $k = 20$\
    \ (as we have to iterate through at most 20 models for each `garment_id`). Thus\
    \ the time complexity is 4020 × 20 = 80400, which is very manageable. We show\
    \ our code below as an illustration, especially for those who have never coded\
    \ a top-down DP algorithm before.\n\n```\n```cpp\n/* UVa 11450 - Wedding Shopping\
    \ */\n#include <iostream>\n#include <algorithm>\n#include <string.h>\nusing namespace\
    \ std;\n\nint M, C, K, price[25][25]; // price[garment_id (<= 20)][model (<= 20)]\n\
    int memo[210][25]; // dp table memo[money_left (<= 200)][garment_id (<= 20)]\n\
    \nint shop(int money_left, int garment_id) {\n    if (money_left < 0)\n      \
    \  return -1000000000; // fail, return a large negative number (1B)\n    if (garment_id\
    \ == C) // we have bought last garment\n        return M - money_left; // done,\
    \ return this value\n    if (memo[money_left][garment_id] != -1) // if this state\
    \ has been visited before\n        return memo[money_left][garment_id]; // simply\
    \ return it\n    int max_value = -1000000000;\n    for (int model = 1; model <=\
    \ price[garment_id][0]; model++) // try all possible models\n        max_value\
    \ = max(max_value, shop(money_left - price[garment_id][model], garment_id + 1));\n\
    \    return memo[money_left][garment_id] = max_value; // assign max_value to dp\
    \ table + return it!\n}\n```\n```"
