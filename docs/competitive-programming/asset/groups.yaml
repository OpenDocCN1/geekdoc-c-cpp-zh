    \ to continue\n    swap(FC,SC);\n  }\n  for (int i=0; i<n; i++) RA[SA[i]] = i;\n\
    }\n```\n\n现在，在后缀数组已经构建好的情况下，我们可以在 $O(m \\log n)$ 内，在长度为 $n$ 的字符串 $S$ 中搜索长度为 $m$\
    \ 的查询字符串 $Q$。这比后缀树版本慢 $O(\\log n)$ 倍，但在实践中相当可接受。$O(m \\log n)$ 的复杂度来自这样一个事实：我们可以对已排序的后缀进行\
