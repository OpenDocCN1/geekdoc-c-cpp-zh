    \n“割点”定义为图 G 中的一个*顶点*，移除它会使 G 不连通。没有割点的图称为“双连通图”。类似地，“桥”定义为图 G 中的一条*边*，移除它会使 G\
    \ 不连通。这两个问题通常针对无向图定义，尽管它们对有向图也仍然有良好的定义。\n\n寻找割点的朴素算法（也可以稍作调整来寻找桥）：\n\n1. 运行 $O(V+E)$\
