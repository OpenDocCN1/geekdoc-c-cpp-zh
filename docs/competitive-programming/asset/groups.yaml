    \ N，其中 2 ≤ N ≤ 79。即 abcde / fghij = N，其中每个字母代表一个不同的数字。其中一个数的首位数字允许为零，例如 79546\
    \ / 01283 = 62；94736 / 01528 = 62。\n\n  快速分析表明，fghij 只能从 01234 到 98765，约有 ≈ 100K\
    \ 种可能。对每个尝试的 fghij，我们可以通过 fghij * N 得到 abcde，然后检查所有数字是否互不相同。10万次操作量很小。因此，迭代完全搜索是可行的。\n\
    \n  练习1：遍历所有可能的 fghij 而不是 abcde 有什么好处？\n\n  练习2：对 abcdefghij 进行排列的 10! 算法可行吗？\n\
