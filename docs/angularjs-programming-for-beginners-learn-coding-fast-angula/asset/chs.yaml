  ## 总结\n- `var myModule = angular.module('myApplication', [ ])` 创建一个带有 `myApplication`\
  \ 的新模块 `myModule`。\n- `myModule.controller('myController', function($scope)` 使用\
  \ `controller()` 方法将控制器的构造函数添加到模块，使 `myController` 属于 `myModule`。\n- `$scope` 被定义为一个对象。\n\
  - `angular.uppercase()` 将字符串转换为大写。\n- `angular.lowercase()` 将字符串转换为小写。\n- `isString()`\
  \ 检查一个值是否为字符串，如果是字符串则返回 true。\n- `isNumber()` 检查一个值是否为数字，如果是数字则返回 true。\n- `isDate()`\
  \ 检查一个值是否为 Date 对象，如果是 Date 对象则返回 true。\n- `isFunction()` 检查一个值是否为函数，如果是函数则返回 true。\n\
  - `isElement()` 检查一个值是否为 Dom 元素，如果是 Dom 元素则返回 true。\n- `isObject()` 检查一个值是否为对象，如果是对象则返回\
  \ true。\n- `isDefined()` 检查一个值是否已定义，如果是定义的则返回 true。\n- `isUndefined()` 检查一个值是否未被定义，如果是未定义的则返回\
  \ true。\n\n## 动手项目\n\n### 模块示例\n打开记事本，编写 AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\"\
  \ ng-controller=\"myController\">\n高度：\n<p><input type=\"number\" ng-model=\"height\"\
  ></p>\n长度：\n<p><input type=\"number\" ng-model=\"length\"></p>\n<br>\n三角形面积：\n<h4><p>{{(height\
  \ * length)/2}}</p></h4>\n</div>\n<script>\nvar app = angular.module('myApplication',\
  \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.height =\
  \ 0;\n    $scope.length = 0;\n});\n</script>\n</body>\n</html>\n```\n\n![](img/00045.jpeg)\n\
  \n将文件命名为 `ModuleSample.html` 并保存到 `myFolder`。双击 `ModuleSample.html` 文件，输入三角形的高长度，查看输出。\n\
  \n**输出：**\n![](img/0046.jpeg)\n\n### 解释：\n- `ng-controller=\"myController\"` 定义控制器。\n\
  - `app = angular.module()` 创建一个新的模块。\n- `app.controller()` 将控制器的构造函数添加到模块。\n- `function($scope)`\
  \ 定义构造函数，同时也定义了 `$scope` 对象。当页面加载时，该函数会运行。\n- `$scope.property = value` 将值赋值给 `$scope`\
  \ 的属性。\n\n# 附录 1\n\n## Ajax 基础\n\n### 什么是 Ajax？\nAJAX 代表“异步 JavaScript 和 XML”。Ajax\
  \ 是一种用于创建更快、更具交互性的 Web 页面的技术，结合 XML、HTML、CSS、JavaScript 和服务器。Ajax 用于更新页面的部分内容而无需重新加载整个页面。通过\
  \ Ajax，你可以与服务器通信以刷新信息。通过 jQuery 和 JavaScript 可以在页面中轻松实现 Ajax。运行 Ajax 需要一个服务器。以下将介绍如何在你的电脑上设置服务器，以及如何使用\
  \ Ajax。\n\n### 设置服务器\n如果你想运行 Ajax，需要在你的电脑上设置一个服务器。“AppServ” 是一个用于设置服务器的免费软件；它可以运行\
  \ Apache、MySQL、PhpMyAdmin、Ajax、JavaScript……\n\n#### 步骤 1：\n下载“AppServ”链接：（图 1） [`www.appservnetwork.com/`](http://www.appservnetwork.com/)\
  \ (图 1)\n\n#### 步骤 2：\n将 AppServ 安装到本地电脑。`C:\\AppServ` (图 2)\n![](img/00047.jpeg)\
  \ (图 2)\n\n#### 步骤 3：\n勾选所有框进行安装。（图 3）\n![](img/00048.jpeg) (图 3)\n\n#### 步骤 4：\n\
  服务器名称：`localhost`\n邮箱地址：xxxxxx@xxxxx.xxx\nApache 端口：80 (图 4)\n![](img/00049.jpeg)\
  \ (图 4)\n\n#### 步骤 5：\n输入 root 密码：12345 (图 5）默认用户名：root\n![](img/00050.jpeg) (图\
  \ 5)\n\n#### 步骤 6：\n勾选启动 Apache、启动 MySQL。点击完成按钮。（图 6）\n![](img/00051.jpeg) (图 6)\n\
  \n#### 步骤 7：\n测试 AppServ 是否安装成功，运行浏览器并输入地址：`http://localhost`\n如果你看到如下页面：（图 7）\n\
  ![](img/00052.jpeg) (图 7）恭喜！你的服务器运行成功。\n\n#### 步骤 8：\n如何使用服务器？\n打开 `C:\\AppServ\\\
  www` 文件夹，创建一个名为 `myServer` 的文件夹作为工作区。你可以将所有程序文件放入 `myServer` 文件夹。从现在开始是 C:\\AppServ\\\
  www\\myServer。（图 8）\n![](img/00053.jpeg) (图 8)\n\n注意：Ajax 需要一个服务器。如果你的电脑可以作为服务器，请准备一个名为\
  \ `data.txt` 的文本文件，内容为“Hello World!”，并将 `data.txt` 与 Ajax 文件放在同一个文件夹中。\n\n### 示例\
  \ 1\n\n### 示例 B1\n```javascript\n1. <script Language=\"JavaScript\">\n2. var ajaxObject\
  \ = new XMLHttpRequest( );\n3. ajaxObject.open( \"GET\", \"data.txt\", true);\n\
  4. ajaxObject.onreadystatechange = function( ) {\n5. if (ajaxObject.readyState ==\
  \ 4) {\n6. alert(ajaxObject.responseText);\n7. }\n8. }\n9. ajaxObject.send( );\n\
  10. </script>\n```\n将文件保存为 `B1.html` 并双击它。\n\n**输出：**\nHello Ajax World!\n\n###\
  \ 解释：\n第 2 行：`new XMLHttpRequest()` 创建了一个名为 `ajaxObject` 的 XMLHttpRequest 对象，将用于\
  \ Ajax 脚本。\n第 3 行：`ajaxObject.open( \"GET\", \"data.txt\", true)` 初始化 XMLHttpRequest\
  \ 对象的请求。`GET` 指定了请求方法。也可以使用 `POST` 或 `PUT`。`data.txt` 是一个提供数据资源的 URL。在这里，`data.txt`\
  \ 的内容是“Hello Ajax World!”。`true` 表示使用异步技术。\n第 4 行：`ajaxObject.onreadystatechange\
  \ = function( ) { … }` 指定了一个在接收服务器响应时运行的函数。服务器响应的状态为 0 到 4：\n\n| readyState | 解释\
  \ |\n| :--- | :--- |\n| 0 | 未初始化 |\n| 1 | 已初始化 |\n| 2 | 已发送数据 |\n| 3 | 正在接收数据 |\n\
  | 4 | 完成。可以使用返回的数据。 |\n\n`ajaxObject.onreadystatechange` 正在等待服务器响应。\n第 5 行：`if (ajaxObject.readyState\
  \ == 4)` 意味着如果服务器响应为 4，则可以使用返回的数据。\n第 6 行：`alert(ajaxObject.responseText)` 显示来自\
  \ `data.txt` 的检索文本。\n\n\n\n\n\n`ajaxObject.send()` 将请求发送到服务器。\n\n## 示例 2\n\n###\
  \ B2\n\n```html\n1. <input type=\"button\" value=\"try\" onClick=\"ajaxRequest();\"\
  />\n2. <script type=\"text/javascript\">\n3. function ajaxRequest () {\n4. if (window.XMLHttpRequest){\n\
  5 ajaxObject = new XMLHttpRequest();\n6 }\n7. else if (window.ActiveXObject){\n\
  8 ajaxObject = new ActiveXObject(\"Microsoft.XMLHTTP\");\n9 }\n10 ajaxObject.open(\"\
  POST\", \"data.txt\", true);\n11 ajaxObject.onreadystatechange = function() {\n\
  12.if (ajaxObject.readyState == 4) {\n13.if(ajaxObject.status == 200) {\n14.alert(ajaxObject.responseText);\n\
  15.}\n16.}\n17.}\n19 ajaxObject.send();\n20 }\n21. </script>\n```\n\n将文件保存为 `B2.html`，并双击它。\n\
  \n### 输出:\nHello Ajax World!\n\n### 解释:\n\n### 第 1 行:\n`onClick = \"ajaxRequest()\"\
  ` 在点击按钮时调用函数 `ajaxRequest()`。\n\n### 第 3-9 行:\n这些代码创建了一个名为 `ajaxObject` 的 `XMLHttpRequest`\
  \ 对象，将用于 Ajax 脚本。\n如果浏览器是 `NON-IE`，它使用 `new XMLHttpRequest()` 创建 `ajaxObject`。\n\
  如果浏览器是 `IE`，它使用 `new ActiveXObject(...)` 来创建 `ajaxObject`。\n\n### 第 10 行:\n`ajaxObject.open(\"\
  POST\", \"data.txt\", true)` 初始化 `XMLHttpRequest` 对象的请求。\n`\"POST\"` 指定请求方法。也可以使用\
  \ `\"GET\"` 或 `\"PUT\"`。\n`\"data.txt\"` 是提供数据资源的 URL。\n在这里，`data.txt` 的内容是 \"Hello\
  \ Ajax World!\"。\n`\"true\"` 表示使用异步技术。\n\n### 第 11 行:\n`ajaxObject.onreadystatechange\
  \ = function() { ... }` 指定了一个在接收到服务器响应后运行的函数。服务器的响应值为 0 到 4：\n\n| readyState | 解释\
  \ |\n| :--- | :--- |\n| 0 | 未初始化 |\n| 1 | 已初始化 |\n| 2 | 发送数据 |\n| 3 | 接收数据 |\n|\
  \ 4 | 完成。返回的数据可用。 |\n\n`ajaxObject.onreadystatechange` 正在等待服务器的响应。\n\n### 第 12 行:\n\
  `if (ajaxObject.readyState == 4)` 意味着如果服务器响应为 4，则返回的数据可用。\n\n### 第 13 行:\n`if(ajaxObject.status\
  \ == 200){ }` 意味着如果服务器返回的 http 状态码为 200，则请求成功。\n\n| http status | 解释 |\n| :--- |\
  \ :--- |\n| 200 | 请求成功 |\n| 401 | 未授权 |\n| 403 | 禁止 |\n| 404 | 未找到 |\n\n### 第 14\
  \ 行:\n`alert(ajaxObject.responseText)` 显示从 `data.txt` 获取的文本。\n输出: \"Hello Ajax World!\"\
  .\n\n### 第 15 行:\n`ajaxObject.send()` 将请求发送到服务器。\n\n### 结果:\n运行整个脚本，将弹出一个对话框显示 \"\
  Hello Ajax World!\"。\n\n# 示例 3\n\n示例 3 中的代码与示例 2 几乎相同。\n但示例 2 中的代码可以修改并变为如下所示的示例\
  \ 3：\n\n### B3\n\n```html\n14. document.getElementById(\"display\").innerHTML =\
  \ \"A message from server is: \" + ajaxObject.responseText;\n22. <div id=\"display\"\
  ></div\n```\n\n`B3.html` 如下：\n```html\n<input type=\"button\" value=\"try\" onClick=\"\
  ajaxRequest();\"/>\n<script type=\"text/javascript\">\nfunction ajaxRequest () {\n\
  if (window.XMLHttpRequest){\najaxObject = new XMLHttpRequest();\n}\nelse if (window.ActiveXObject){\n\
  ajaxObject = new ActiveXObject(\"Microsoft.XMLHTTP\");\n}\najaxObject.open(\"POST\"\
  , \"data.txt\", true);\najaxObject.onreadystatechange = function() {\nif (ajaxObject.readyState\
  \ == 4) {\nif(ajaxObject.status == 200) {\ndocument.getElementById(\"display\").innerHTML\
  \ = \"A message from server is: \" + ajaxObject.responseText;\n}\n}\n}\najaxObject.send();\n\
  }\n</script>\n<div id=\"display\"></</div>\n```\n\n将文件保存为 `B3.html`，并双击它。\n\n###\
  \ 输出:\nA message from server is: Hello Ajax World!\n\n### 解释:\n\n### 第 14 行:\n`document.getElementById(\"\
  display\").innerHTML` 显示 ID 为 `display` 的指定位置的内容。\n`ajaxObject.responseText` 从 `data.txt`\
  \ 获取数据。\n输出: \"A message from server is: Hello Ajax World!\".\n\n### 第 22 行:\n`<div\
  \ id=\"display\"></div>` 创建了一个 id 为 `display` 的标签，用于显示内容。\n\n### 结果:\n运行整个脚本。\n\
  输出: \"A message from server is: Hello Ajax World!\"\n\n## 注意:\n`\"data.txt\"` 可以是\
  \ `data.php`、`data.asp`、`data.jsp` 和 `data.xml`。\nAjax 需要服务器的支持。\n\n## Ajax 的优势:\n\
  Ajax 在不重新加载整个页面的更新部分部分。\n\n## Ajax 图表\n| 属性 | 描述 |\n| :--- | :--- |\n| `open()`\
  \ | 初始化请求 |\n| `send()` | 将请求发送到服务器 |\n| `onreadystatechange` | 响应事件 |\n| `responseText`\
  \ | 从服务器返回文本 |\n| `readyState` | 状态 (0,1,2,3,4) |\n\n## Ajax 服务:\nAjax 需要服务器的支持。内置服务包括例如：\n\
  - `http`: 用于发送请求。\n- `timeout`: 用于延迟操作。\n- `interval`: 用于重复执行操作。\n\n\n\n\n\n| ID\
  \ | 水果 | 颜色 |\n| :--- | :--- | :--- |\n| 001 | 苹果 | 红色 |\n| 002 | 香蕉 | 绿色 |\n| 003\
  \ | 橙子 | 金色 |\n\n### 解释：\n\n`$http.get(\"angular_mysql.php\").then(function (feedback)\
  \ { })` 从 mysql 数据库获取数据。\n\n`$scope.title = feedback.records;` 返回 mysql 数据库的每条记录。\n\
  \n`<tr ng-repeat=\"v in title\">` 遍历每个字段名称。\n\n关于 PHP & MySQL，请阅读我的另一《8 小时精通 PHP\
  \ & MySQL》。\n\n### Angular 检查\n\n| `$dirty` // 检查用户已输入 | `$pristine` // 检查用户未输入\
  \ |\n\n## 示例 A4\n\n```html\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
  </head>\n<body>\n<form ng-app=\"iCode\" ng-controller=\"iController\" name=\"iForm\"\
  \ novalidate>\n<p>请在此输入您的姓名：<br><br>\n<input type=\"text\" name=\"userName\" ng-model=\"\
  userName\" required>\n<div style=\"color:red\" ng-show=\"iForm.userName.!$dirty\"\
  >\n<!--检查输入是否为空-->\n<div ng-show=\"iForm.userName.$error.required\">\n<!--显示错误信息\
  \ -->\n此字段不能为空！</div>\n</</div>\n</p>\n</form>\n<script>\nvar iModule = angular.module('iCode',\
  \ []);\niModule.controller('iController', function($scope) {\n$scope.userName =\
  \ '';   \n});\n</script>\n</body>\n</html>\n```\n\n### 输出:\n\n请在此输入您的姓名：\n\n此字段不能为空！\n\
  \n### 解释：\n\n`iForm.userName.!$dirty` 检查输入字段的空值。你可以使用 `$pristine` 或 `!$dirty`。\n\
  \n`.$error.required` 显示错误信息。\n\n### Angular 验证\n\n| `$valid` // 检查输入的有效性 | `$invalid`\
  \ // 检查输入的无效性 |\n\n## 示例 A5\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script\
  \ src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<br>\n<form ng-app=\"iCode\"\
  \ ng-controller=\"iController\" name=\"iForm\" novalidate>\n<input type=\"email\"\
  \ name=\"email\" ng-model=\"email\" required>\n<div style=\"color:red\" ng-show=\"\
  iForm.email.$invalid\">\n<!--检查邮箱地址的无效性--> <br>\n<div ng-show=\"iForm.email.$error.email\"\
  >\n<!--显示错误信息 -->\n邮箱地址格式无效！</div>\n</div>\n</form>\n<script>\nvar iModule = angular.module('iCode',\
  \ []);\niModule.controller('iController', function($scope) {\n$scope.email = 'xxxxx@gmail.com';\n\
  });\n</script>\n</body>\n</html>\n```\n\n### 输出:\n\n![](img/00054.jpeg)\n\n### 解释：\n\
  \n`<div style=\"color:red\" ng-show=\"iForm.email.$invalid\">` 检查邮箱地址的有效性。\n\n`<div\
  \ ng-show=\"iForm.email.$error.email\">` 显示错误信息。\n\n### Angular 包含\n\n| `ng-include=\"\
