  \ [ ]);\nmyModule.controller('myController', function($scope) {\n$scope.text1 =\
  \ \"javascript\";\n$scope.text2 = angular.uppercase($scope.text1);\n});\n</script>\n\
  </body>\n</html>\n```\n\n### 输出:\n\njavascript\nJAVASCRIPT\n\n### 解释:\n\n`var myModule\
  \ = angular.module('myApplication', [ ])` 创建了一个带有 `myApplication` 的新模块 `myModule`。\n\
  \n`myModule.controller('myController', function($scope)` 使用 `controller( )` 方法将控制器的构造函数添加到模块中，使\
