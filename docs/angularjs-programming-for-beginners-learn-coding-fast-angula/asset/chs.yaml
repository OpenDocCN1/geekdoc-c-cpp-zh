  \n### 解释:\n\n`ng-mouseover=\"count = count + 1\"` 当鼠标移动到文本区域上方时求值表达式。\n\n# 第 6 小\n\
  \n## 表达式\n\n`{{ Expression }}`\n\n`{{Expression}}` 用于将值绑定到 HTML 元素并显示该值。它的作用与 `ng-bind`\
  \ 指令相同。`{{Expression}}` 写在两个大括号内。`{{expression}}` 基本上是纯 JavaScript 表达式。表达式有多种，让我们逐来看。\n\
  \n### 字符串表达式\n\n我们知道字符串是字符的集合。在 AngularJS 中，字符串表达式的形式如下。\n\n| <element> {{First\
  \ String + Second String}} </element> |\n\n#### 示例 6.1\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>初学者 AngularJS 指南</title>\n    <script src=\"js/angular.min.js\"\
  ></script>\n</head>\n<body>\n<h4>使用字符串表达式组合两个字符串</h4>\n<div ng-app=\"\" >\n第一个字符串\
  \ &nbsp;&nbsp;&nbsp;: <input type=\"text\" ng-model=\"firstString\"/><br><br>\n\
  第二个字符串: <input ng-model=\"secondString\"/><br><br>\n结果字符串:<p style=\"color:blue;font-weight:bold;\"\
  >{{firstString +\" \"+secondString}}</p>\n</div>\n</body>\n</html>\n```\n\n输出:\n\
  \n![](img/00035.jpeg)\n\n解释:\n\n`{{firstString +\" \"+secondString}}` 将两个字符串连接在一起。\n\
  \n`{{ expression}}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中写了 `Ray`，第二个文本框中写了 `Yao`，但在结果字符串区域，由于使用了字符串表达式\
  \ `{{ }}`，`Ray` 字符串和 `Yao` 字符串被组合在了一起。注意：`+` 号用于字符串拼接。\n\n### 数字表达式\n\n在 AngularJS\
  \ 中，你可以使用数字表达式执行不同的数学运算。\n\n| <element> {{First Number + Second Number}} </element>\
  \ |\n\n#### 示例 6.2\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>初学者 AngularJS\
  \ 指南</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n\
  <h4>使用数字表达式相乘两个数字</h4>\n<div ng-app=\"\" ng-init=\"firstNumber=9;secondNumber=6\"\
  >\n第一个数字 &nbsp;&nbsp;&nbsp;: <input type=\"text\" ng-model=\"firstNumber\"/><br><br>\n\
  第二个数字: <input ng-model=\"secondNumber\"/><br><br>\n结果字符串:<p style=\"color:blue;font-weight:bold;\"\
  >{{firstNumber * secondNumber}}</p>\n</div>\n</body>\n</html>\n```\n\n输出:\n\n![](img/00036.jpeg)\n\
  \n解释:\n\n`{{firstNumber * secondNumber}}` 乘以 `firstNumber` 和 `secondNumber`。\n\n\
  `{{ expression}}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中写了 `9`，第二个文本框中写了 `6`，但在结果字符串区域，显示了计算结果。\n\
  \n### 对象表达式\n\nAngularJS 的字符串表达式的形式如下。\n\n| <element> {{First Number + Second Number}}\
  \ </element> |\n\n#### 示例 6.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>初学者\
  \ AngularJS 指南</title>\n<script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n\
  <h4>对象表达式</h4>\n<div ng-app=\"\" ng-init=\"name='John'; age=25\">\n<p>姓名: {{name}}</p>\n\
  <p>年龄: {{age}}</p>\n<p>信息: {{name + ' is ' + age + ' years old'}}</p>\n</div>\n\
  </body>\n</html>\n```\n\n输出:\n\n![](img/00037.jpeg)\n\n解释:\n\n`{{name + ' is ' +\
  \ age + ' years old'}}` 将字符串和变量连接起来。\n\n`{{ expression}}` 显示表达式的值。\n\n### 数组表达式\n\
  \nAngularJS 的表达式的形式的形式。\n\n| <element> {{First Number + Second Number}} </element>\
  \ |\n\n#### 示例 6.4\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>初学者 AngularJS\
  \ 指南</title>\n<script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h4>数组表达式</h4>\n\
  <div ng-app=\"\" ng-init=\"colors=['Red', 'Green', 'Blue']\">\n<ul>\n<li ng-repeat=\"\
  color in colors\">{{color}}</li>\n</ul>\n</div>\n</body>\n</html>\n```\n\n输出:\n\n\
  ![](img/00038.jpeg)\n\n解释:\n\n`ng-repeat` 用于遍历数组。\n\n### 示例 6.5\n\n```html\n<!doctype\
  \ html>\n<html ng-app>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n<meta\
  \ charset=\"utf-8\">\n</head>\n<body>\n<h3>价格计算器</h3>\n价格 1: <input type=\"number\"\
  \ ng-model=\"price1\"><br>\n价格 2: <input type=\"number\" ng-model=\"price2\"><br>\n\
  价格 3: <input type=\"number\" ng-model=\"price3\"><br>\n<p><b>总和：</b> {{price1+price2+price3}}</p>\n\
  </body>\n</html>\n```\n\n输出:\n\n![](img/00039.jpeg)\n\n### 解释:\n\n`{{expression}}`\
  \ 可以计算表达式的值。\n\n`{{price1+price2+price3}}` 可以计算用户输入的所有值并显示结果。\n\n\n\n\n\n将文件保存为\
  \ `ExpressionSample.html` 并放在 `myFolder` 中。双击 `ExpressionSample.html` 文件，查看输出。\n\
  \n输出：\n\n![](img/00040.jpeg)\n\n### 解释：\n\n`{{firstNumber + secondNumber}}` 显示了\
  \ `firstNumber` 和 `secondNumber` 的和。\n\n# 第 7 小节\n\n## Controller & Scope\n\n###\
  \ 什么是 Controller？\n\nController 基本上是一个控制应用程序数据流的 JavaScript 对象。因此，AngularJS 应用是由\
  \ `Controller` 控制的。\n\n### 如何定义 Controller？\n\n使用 `ng-controller` 指令来定义 `Controller`。我们知道\
  \ `Controller` 是一个包含 JavaScript 函数和属性的 JavaScript 对象。`Controller` 的语法如下：\n\n| `<div\
  \ ng-app=\"\" ng-controller=\"controllerName\">` |\n\n### 示例 7.1\n\n```html\n<html\n\
  <script src=\"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"Calculation\"\
  \ ng-controller=\"myController\">\nFirst Number: <input type=\"number\" ng-model=\"\
  firstNumber\"><br>\nSecond Number: <input type=\"number\" ng-model=\"secondNumber\"\
  ><br>\n<br>\nSum: {{firstNumber + secondNumber}}\n</div>\n<script>\nvar app = angular.module('Calculation',\
  \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.firstNumber\
  \ = 4;\n    $scope.secondNumber = 8;\n});\n</script>\n</body>\n</html>\n```\n\n\
  输出：\n\n![](img/00041.jpeg)\n\n### 解释：\n\n- `ng-controller=\"myController\"` 定义了一个控制器。\n\
  - `app = angular.module()` 创建了一个新模块。\n- `app.controller()` 将控制器的构造函数添加到模块中。\n- `function($scope)`\
  \ 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n- `$scope.property = value` 将值赋值给\
  \ `$scope` 对象的属性。\n\n在上面的示例中，当页面第一次加载时，你会看到两个带有不同数字的框，分别是 4 和 8；结果区域显示结果为 12。\n\n\
  `angular.module()`：AngularJS 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。一个 AngularJS 模块定义了一个应用程序，这将在后面的章节中详细讨论。\n\
  \n### 什么是 Scope？\n\nScope 是一个包含模型数据的 JavaScript 对象。\n\n| `function ($scope) { }`\
  \ |\n\n`$scope` 是 JavaScript 函数的参数，由控制器调用。让我们通过一个例子来理解。\n\n### 示例 7.2\n\n```javascript\n\
  <script>\nfunction ($scope) {\n    $scope.firstNumber = 23;\n    $scope.secondNumber\
  \ = 63;\n}\n</script>\n```\n\n### 解释：\n\n在上面的示例中，`$scope` 是函数 `function ($scope)\
  \ { }` 的参数。`$scope` 是 AngularJS 中的一个对象。\n\n`$scope.firstNumber` 和 `$scope.secondNumber`\
  \ 是 HTML 中使用的模型。模型数据通过 `$scope` 对象访问。我们使用以下公式给模型赋值：`\"$scope.property = value\"\
  `。\n\n### 例如：\n\n```javascript\n$scope.firstNumber = 23;\n$scope.secondNumber =\
  \ 63;\n```\n\n## MVC & Scope\n\n### 什么是 MVC？\n\nMVC 代表 Model（模型）、View（视图）和 Controller（控制器）。\n\
  - Model（模型）直接管理应用程序的数据、逻辑和规则。\n- View（视图）显示数据。\n- Controller（控制器）处理输入。\n\n在上面的示例中：\n\
  - `$scope.firstNumber` 和 `$scope.secondNumber` 是模型。\n- `<p ng-bind = \"firstNumber\
  \ + secondNumber\"></p>` 是 HTML 中使用的视图。\n- `ng-controller=\"myController\"` 定义了一个控制器。\n\
  \n控制器与视图之间的通信被称为 `Scope`，因此我们可以说 `Scope` 就像连接控制器和视图的桥梁。\n\n### 模块基础\n\n| `app =\
  \ angular.module()` |\n\n`app = angular.module()` 创建了一个新模块。\n\n### 示例 7.3\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<script src=\"js\\angular.min.js\"\
  ></script>\n</head>\n<body>\n<div ng-app=\"myFruit\" ng-controller=\"iController\"\
  >\n<p>Please select your favorite fruit.</p>\n<select ng-model=\"choosedFruit\"\
  \ ng-options=\"obj.fruit for obj in fruits\" size = \"4\">\n</select>\n<h3>Your\
  \ favorite fruit is: {{choosedFruit.fruit}}</h3>\n<h3>The color is: {{choosedFruit.color}}</h3>\n\
  </div>\n<script>\nvar app = angular.module('myFruit', [ ]);\napp.controller('iController',\
  \ function($scope) {\n    $scope.fruits = [\n    {fruit : \"Apple\", color : \"\
  Red\"},\n    {fruit : \"Orange\", color : \"Golden\"},\n    {fruit : \"Banana\"\
  , color : \"Green\"}\n];\n});\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/00042.jpeg)\n\
  \n### 解释：\n\n- `<div ng-app=\"myFruit\" ng-controller=\"iController\">` 定义了一个控制器\
  \ `iController`。\n- `<select ng-model=\"choosedFruit\" ng-options=\"obj.fruit for\
  \ obj in fruits\" size = \"4\">` 创建了一个选择框。\n- `ng-model=\"choosedFruit\"` 绑定选中的水果。\n\
  - `ng-options=\"obj.fruit for obj in fruits\"` 遍历水果。\n- `{{choosedFruit.fruit}}`\
  \ 显示选中的水果名称。\n- `{{choosedFruit.color}}` 显示颜色。\n- `var app = angular.module('myFruit',\
  \ [ ]);` 创建了一个新模块。\n- `app.controller('iController', function($scope)` 定义了控制器函数。\n\
  - `$scope.fruits = [...]` 存储数组。\n\n## 总结\n\n在本章中，我们学习了什么是控制器、如何定义控制器以及 MVC 和 Scope。\n\
  `ng-controller=\"myController\"` 定义了一个控制器。\n`app = angular.module()` 创建了一个新模块。\n\
  `app.controller()` 将控制器的构造函数添加到模块中。\n`function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。\n\
  `$scope.property = value` 将值赋值给 `$scope` 对象的属性。\n`<p ng-bind = \"value\"></p>` 显示数据。\n\
  \n## 动手项目\n\n控制器示例\n\n打开记事本，编写 AngularJS 代码（图 1）：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"utf-8\">\n<script src=\"js\\angular.min.js\"></script>\n\
  </head>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"myController\">\n\
  First Text:\n<p><textarea ng-model=\"firstText\"></textarea></p>\nSecond Text:\n\
  <p><textarea ng-model=\"SecondText\"></textarea></p>\n<br>\nConnected Text:\n<h4><p>{{firstText\
  \ + \" \" + SecondText}}</p></h4>\n</div>\n<script>\nvar app = angular.module('myApplication',\
  \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.firstText\
  \ = \"JavaScript\";\n    $scope.SecondText = \"in 8 Hours\";\n});\n</script>\n</body>\n\
  </html>\n```\n\n![](img/00043.jpeg)\n(图 1)\n\n文件夹中的 `ControllerSample.html`。双击 `ControllerSample.html`\
  \ 文件，输入并查看输出。（图 2）。\n\n输出：（图 2 所示）：\n\n![](img/00044.jpeg)\n\n# 第 8 小节\n\n## Module\
  \ & API\n\n### 什么是 AngularJS 模块？\n\nAngularJS 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。一个\
  \ AngularJS 模块定义了一个应用程序。\n\n创建模块的语法如下：\n\n| `var myModule = angular.module(\"myApplication\"\
  , [ ]);` |\n\n### 示例 8.1\n\n```html\n<html>\n<script src=\"js\\angular.min.js\"\
  ></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"myController\"\
  >\n{{ firstNum + lastNum }}\n</div>\n<script>\nvar myModule = angular.module(\"\
  myApplication\", [ ]);\nmyModule.controller(\"myController\", function($scope) {\n\
  \    $scope.firstNum = 100;\n});\n</script>\n</body>\n</html>\n```\n\n\n\n\n\n```javascript\n\
  $scope.lastNum = 200;\n\n});\n\n```\n\n</script>\n</body>\n</html\n\n### 输出: 300\n\
  \n### 解释:\n\n`<div ng-app=\"myApplication\" ng-controller=\"myController\">` 表示此应用程序\
  \ \"myApplication\" 有一个控制器 “myController”。\n\n`{{ firstNum + lastNum }}` 显示 `firstNum`\
  \ 加上 `lastNum` 的结果。\n\n`var myModule = angular.module(\"myApplication\", [ ])` 创建了一个带有\
  \ `myApplication` 的新模块 `myModule`。\n\n`[ ]` 参数可以定义依赖模块。\n\n`myModule.controller(\"\
  myController\", function($scope)` 使用 `controller( )` 方法将控制器的构造函数添加到模块中，使 `myController`\
  \ 属于 `myModule`。\n\n`$scope` 被为一个对象。\n\n`$scope.firstNum` 的值为 100。\n\n`$scope.lastNum`\
  \ 的值为 200。\n\n因此，`{{ firstNum + lastNum }}` 的结果是 300。\n\n### 什么是 AngularJS API？\n\
  \nAPI 意味着应用程序编程接口。\n\nAPI 上有 10 个基础函数：\n\n- `angular.uppercase()`\n- `angular.lowercase()`\n\
  - `angular.isString()`\n- `angular.isNumber()`\n- ……\n\n`uppercase( )`\n`angular.uppercase(\
  \ )` 将字符串转换为大写。\n\n### 示例 8.2\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"\
