  md: '# Part I: Getting Started with Python


    # Deciding how you can personally benefit from Python


    Ultimately, you can use any programming language to write any sort of application.
    If you use the wrong programming language for the job, the process will be slow,
    error prone, bug-ridden, and you''ll absolutely hate it — but you can get the
    job done. Of course, most of us would rather horribly painful experiences, so
    it''s important to know what sorts of applications people use Python to create.
    Here''s a list of the most common uses for Python (although you do use it for
    other purposes):


    +   **Creating rough example applications:** Developers often need to create a
    prototype, a rough example of an application, before getting the resources to
    create the actual application. Python emphasizes productivity, so you can use
    it to create prototypes of an application quickly.


    +   **Scripting browser-based applications:** Even though JavaScript is the most
    popular language used for browser-based application scripting, Python is a close
    second. Python offers functionality that JavaScript doesn''t provide (see the
    comparison at https://github.net/essay/2557 for details) and its high efficiency
    makes it possible to create browser-based applications faster (a real plus in
    today''s fast-paced world).


    +   **Designing mathematical, scientific, and engineering applications:** Interestingly
    enough, Python provides access to some really cool libraries that make it easier
    to create math, scientific, and engineering applications. The most popular libraries
    are NumPy (http://www.numpy.org/) and SciPy (http://www.scipy.org/). These libraries
    greatly reduce the time you spend writing specialized code to perform math, scientific,
    and engineering tasks.


    +   **Working with XML:** The Extensible Markup Language (XML) is the basis of
    most data storage needs on the Internet and many desktop applications today. Unlike
    most languages, where XML is just sort of bolted on, Python makes it a first-class
    citizen. If you need to work with a Web service, the main method for exchanging
    information on the Internet (or any other XML-intensive application), Python is
    a great choice.


    +   **Interacting with databases:** Business relies heavily on databases. Python
    isn''t quite a query language, like the Structure Query Language (SQL) or Language
    Integrated Query (LINQ), but it does a great job of interacting with databases.
    It makes creating connections and manipulating data relatively painless.'
