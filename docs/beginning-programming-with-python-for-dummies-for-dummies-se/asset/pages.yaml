  md: '# Processing Data Using

    the while Statement


    You use the while statement for situations when you''re not sure how much data
    the application will have to process. Instead of instructing Python to process
    a static number of items, you use the while statement to tell Python to continue
    processing items until it runs out of. This kind of loop is useful when you need
    to perform tasks such as downloading files of unknown size or streaming data from
    a source like a radio station. Any situation in which you can''t define at the
    outset how much data the application will process is a good candidate for the
    while statement that is described more fully in the sections that follow.


    # Understanding the while statement


    The while statement works with a condition rather than a sequence. The condition
    states that the while statement should perform a task until the condition is no
    longer true. For example, imagine a deli with a number of customers standing in
    front of the counter. The salesperson continues to serve customers until no more
    customers are left. The line could (and probably grow) as the other customers
    are handled, so it is impossible to know at the outset how many customers will
    be served. The salesperson knows that is continuing to serve customers until no
    more are left is important. Here is how a while statement might look:


    ```

    while Sum < 5:

    ```


    The statement begins with the while keyword. It then adds a condition. In this
    case, Sum must be less than 5 for the loop to continue. Nothing specifies the
    current value of Sum, nor does the code define how the statement is that Sum must
    be less than 5 for the loop to continue performing tasks. The statement ends with
    a colon and the tasks are indented below it.


    Because a while statement does not perform a series of times, creating an endless
    loop is possible, meaning that the loop never ends. For example, say that Sum
    is 0 when the loop begins, and the ending condition is that Sum must be less than
    5. If the value of Sum never increases, the loop will continue executing forever
    (or at least until the computer is shut down). Endless loops can cause all sorts
    of bizarre problems on systems, such as slowdowns and even computer freezes, so
    it''s best to avoid


    ![](img/ec69aa1535cd82c735ee14abfc05048f_158_0.png)'
  merge: -1
  pgno: 158
- img_proc: true
  md: "# 144 Part II: Talking the Talk\n\nthem. You must always provide a method for\
    \ the loop to end when using a while loop (contrasted with the for loop, in which\
    \ the end of the sequence determines the end of the loop). So, when working with\
    \ the while statement, you must perform three tasks:\n\n+   1. Create the environment\
    \ for the condition (such as setting Sum to 0).\n2. State the condition within\
    \ the while statement (such as Sum < 5).\n3. Update the condition as needed to\
    \ ensure that the loop eventually ends (such as adding Sum+=1 to the while code\
    \ block).\n\nAs with the for, you can modify the default behavior of the while\
    \ statement. In fact, you have access to the four clauses to modify the while\
    \ statement behavior:\n\n![](img/ec69aa1535cd82c735ee14abfc05048f_159_0.png)\n\
    \n+   ✔ break: Ends the current loop.\n✔ continue: Immediately processing of the\
    \ current element.\n✔ pass: Processing of the current element after completing\
    \ the statement in the block.\n✔ else: Provides an alternative processing technique\
    \ when conditions aren't met for the loop.\n\n# Using the while statement in an\
    \ application\n\nYou can use the while statement in many ways, but this first\
    \ example is straightforward. It simply displays a count based on the starting\
    \ and ending condition of a variable named Sum. The following steps help you create\
    \ and test the example code. This example also appears with the downloadable source\
