    wrapper and all, into the toaster. The lesson with me: Writing about procedures
    can be quite hard because we know precisely what we want to do, but often we leave
    out steps — we assume that the other person also knows precisely what we want
    to do.


    Many experiences in life revolve around procedures. Think about the checklist
    used by pilots before a plane takes off. Without a good procedure, the plane could
    crash. Learning to write a great procedure takes time, but it''s doable. You may
    have to try several times before you get a procedure that'
