  md: '# Debugging Your Application Using pdbgr


    A high-end IDE, such as Komodo IDE, comes with a complete debugger. Komodo Edit
    comes with a simple debugger. However, if you''re using something smaller, less
    expensive, and less capable than a high-end IDE, you might not have a debugger
    at all. A debugger helps you locate errors in your application and fix them. The
    better the debugger, the less effort to locate and fix the error. When your editor
    doesn''t include a debugger, you may need an external debugger such as pdbgr (https://code.google.com/p/pdbgr/).


    A reasonably good debugger includes a number of standard features, such as code
    colorization (the use of color to indicate things like keywords). However, it
    also includes a number of nonstandard features that set it apart. Here are some
    of the standard and nonstandard features that make pdbgr a good choice when your
    editor doesn''t come with a debugger:


    ![](img/ec69aa1535cd82c735ee14abfc05048f_368_0.png)


    +   **Smart eval**: The eval command helps you see what will happen when you execute
    a line of code, before you execute it in the application. It helps you perform
    “what if” analysis to see what is going wrong with the application.


    +   **Out-of-process debugging**: Normally you have to debug applications that
    reside on the same machine. In fact, the debugger is part of the application''s
    process, which means the debugger can actually interfere with the debugging process.
    Using out-of-process debugging means that the debugger doesn''t affect the application
    and you don''t have to run the application on the same machine as the debugger.


    +   **Thorough byte-code inspection**: Viewing how the code you write is turned
    into byte code (the code that the Python interpreter understands) can sometimes
    help you solve tough problems.


    +   **Event filtering and Tracking**: As your application runs in the debugger,
    it generates events that help the debugger understand what is going on. For example,
    moving to the next line of code generates an event, returning from a function
    call generates another event, and so on. This feature makes it possible to control
    just how the debugger traces through an application and which events it reacts
    to.'
