  md: "# 136 Part II: Talking the Talk\n\n# Controlling execution with\nt break statement\n\
    \nLife is often about exceptions to the rule. For example, you might want an assembly\
    \ line to produce a number of clocks. However, at some point, the assembly line\
    \ runs out of a needed part. If the part isn't available, the assembly line must\
    \ stop in the middle of the processing cycle. The count hasn't completed, but\
    \ the line must be stopped anywhere until the missing part is restocked.\n\nInterruptions\
    \ also occur in computers. You might be streaming data from an online source when\
    \ a network glitch occurs and breaks the connection; the stream temporarily runs\
    \ dry, so the application runs out of things to do though the set of tasks isn't\
    \ completed.\n\n![](img/ec69aa1535cd82c735ee14abfc05048f_151_0.png)\n\nThe break\
    \ clause makes breaking out of a loop possible. However, you dont simply place\
    \ the break clause in your code — you surround it with if statement that defines\
    \ the condition for issuing a break. The statement might say something like this:\
    \ If the stream runs dry, then break out of the loop.\n\nIn this example, you\
    \ see what happens when the count reaches a certain level when processing a string.\
    \ The example is a little contrived in the interest of keeping things simple,\
    \ but it reflects what could happen in the real world when a data element is too\
    \ long to process (possibly indicating an error condition). This example also\
    \ appears with the downloadable source code as ForBreak.py.\n\n+   1. Open a Python\
    \ File window.\n\nYou see an editor where you can type the example code.\n\n+\
    \   2. Type the following code into the window — pressing Enter after each line:\n\
