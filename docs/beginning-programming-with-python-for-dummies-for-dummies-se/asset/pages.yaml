  md: '# Chapter 9: Dealing with Errors


    argument when calling a method can also cause problems. These are examples of
    errors of commission, which are specific errors associated with your code. In,
    you can find these kinds of errors using a debugger or simply reading your code
    by line to check for errors.


    Runtime errors can also be caused by external sources not associated with your
    code. The user can input incorrect information that the application isn''t expecting,
    causing an exception. A network error can make a required resource inaccessible.
    Sometimes even the computer hardware has a glitch that causes a nonrepeatable
    application error. These are all examples of errors of omission, from which the
    application might recover if your application error-tracing code in place. It''s
    important that you consider both kinds of runtime errors — errors of commission
    and omission — when building your application.


    # Distinguishing error types


    You can distinguish errors by type, that is, by how they are made. Knowing the
    error types helps you understand where to look in an application for potential
    problems. Exceptions work like many other things in life. For example, you know
    that electronic devices don''t work without power. So, when you try to turn your
    television on and it doesn''t do anything, you might look to ensure that the power
    cord is firmly seated in the socket.


    Understanding error types helps you locate errors faster, earlier, and more consistently,
    resulting in fewer misdiagnoses. The best developers know that fixing errors while
    an application is in development is always easier than fixing when it is in production
    because users are inherently impatient and want errors fixed immediately and correctly.
    In addition, fixing an error earlier in the development cycle is always easier
    than fixing it when the application nears completion because less code exists
    to review.


    The trick is to know where to look. In this mind, Python (and most other programming
    languages) breaks errors into the following types:


    +   * Syntactical

    * Semantic

    * Logical


    The following sections examine each of these error types in more detail. I''ve
    arranged the sections in order of difficulty, starting with the easiest to find.
    A syntactical error is generally the easiest; a logical error is generally the
    hardest.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_168_0.png)'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# 154 Part II: Talking the Talk


    # Syntactical


    Whenever you make a typo of some sort, you create a syntactical error. Some Python
    syntactical errors are quite easy to find because the application simply doesn''t
    run. The interpreter may even point out the error for you by highlighting the
    errant code and displaying an error message. However, some syntactical errors
    are quite hard to find. Python is sensitive, so you may use the wrong code for
    a variable in one place and find that the variable isn''t working as you thought
    it. Finding the place where you used the wrong capitalization can be quite challenging.


    Most syntactical errors occur at compile time and the interpreter points out for
    you. Fixing the error is easy because the interpreter generally tells you what
    to fix, and with considerable accuracy. Even when the interpreter doesn''t find
    the problem, syntactical errors prevent the application from running correctly,
    so any errors the interpreter doesn''t show up during the testing phase. Few syntactical
    errors should make it into production as long as you perform adequate testing.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_169_0.png)


    # Semantic


    When you create a loop that executes too many times, you don''t generally receive
    any sort of error information from the application. The application will happily
    run because it''s doing everything correctly, but that additional loop can cause
    all sorts of data errors. When you create an error in your code, it''s called
    a semantic error.


    Semantic errors occur because the meaning behind a series of steps used to perform
    a task is wrong— the result is correct even though the code runs precisely as
    it should. Semantic errors are tough to find, and you sometimes need some sort
    of debugger to find them. (Chapter 19 provides a discussion of tools that you
    can use with Python to perform tasks such as debugging applications. You can also
    use blog posts about debugging on my blog http://blog.johnmuellerbooks.com.)


    ![](img/ec69aa1535cd82c735ee14abfc05048f_169_1.png)


    # Logical


    Some developers don''t create a division between semantic and logical errors,
    but they are different. A semantic error occurs when the code is essentially correct
    but the implementation is wrong (such as having a loop execute once too often).
    Logical errors occur when the developer''s thinking is faulty. In many cases,
    this sort of error happens when the developer uses a relational or logical operator
    incorrectly. However, logical errors can happen in all sorts of other ways, too.
    For example, a developer might think that data is always stored on the local hard
    drive, which means that the application may behave in an unusual manner when it
    attempts to load data from a network drive instead.'
  merge: -1
