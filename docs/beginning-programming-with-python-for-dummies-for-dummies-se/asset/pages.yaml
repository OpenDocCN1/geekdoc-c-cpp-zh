  md: '# Chapter 4: Writing Your First Application


    Even though single-line and multiline comments are both comments, the IDLE editor
    makes it easy to tell the difference between the two. When you''re using the default
    color scheme, single-line comments show up in red text, Python doesn''t care about
    the coloration; it''s only there to help you as the developer.


    # Using comments to leave yourself reminders


    A of people don''t really understand comments — they don''t know what to do with
    notes in code. Keep in mind that you might write a piece of code today and not
    look at it for years. You need to jog your memory so that you remember what the
    code performs and why you wrote it. In fact, there are some reasons to use comments
    in your code:


    +   - Reminding yourself about what the code does and why you wrote it

    - Telling others how to maintain your code

    - Making your code accessible to other developers

    - Listing ideas for future updates

    - Providing a list of documentation sources you used to write the code

    - Maintaining a list of improvements you''ve made


    You can use comments in a lot of other ways, too, but these are the most common
    ways. Look at how the comments are used in the examples in the book, especially
    as you get to later chapters where the code becomes more complex. As your code
    becomes more complex, you need to add more comments and make the comments pertinent
    to what you need to remember about it.


    # Using comments to keep code from executing


    Developers sometimes uses the commenting feature to keep lines of code from executing
    (referred to as commenting out). You need to do this in order to determine whether
    a line of code is causing your application to fail. In fact, it''s such a common
    and useful way to work with code that a technique for adding this sort of comment
    is built right into IDLE. Here''s an example of'
