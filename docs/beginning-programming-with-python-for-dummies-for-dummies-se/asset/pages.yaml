    in mind. If you leave out a step, the results won''t be what you expected. The
    computer won''t know what you mean or what you intended for it to perform certain
    tasks automatically. The only thing the computer knows is that you have provided
    it with a specific procedure and it needs to perform that.


    # Understanding that computers take things literally


    People eventually get to use the procedures you create. They automatically compensate
    for deficiencies in your procedure or make notes about things that you left out.
    In other words, people compensate for problems with the procedures that you write.


    > When you begin writing programs, you''ll get frustrated because computers perform
