  md: '# Making Simple Decisions

    Using the if Statement


    The if statement is the easiest method for making a decision in Python. It simply
    states that if something is true, Python should perform the steps to follow. The
    following sections tell you how you can use the if statement to make decisions
    of various sorts in Python. You may be surprised at what this simple statement
    can do for you.


    # Understanding the if statement


    If you use statements regularly in everyday life. For example, you may say to
    yourself, "If it''s Wednesday, I''ll eat tuna salad for lunch." The Python if-statement
    is a little verbose, but it follows precisely the same pattern. Say you want create
    a variable, TestMe, and place a value of 6 in it, like this:


    ```

    TestMe = 6

    ```


    You can ask the computer to check for a value of 6 in TestMe, like this:


    ```

    if TestMe == 6:

    print("TestMe does equal 6!")

    ```


    Every Python statement begins, oddly enough, with the word if. When Python sees
    if, it knows that you want to make a decision. After the word if comes a condition.
    A condition simply states what sort of comparison you want to make. In this case,
    you want Python to determine whether TestMe contains the value 6.


    Notice that the condition uses the relational operator, ==, and not the assignment
    operator, = A common mistake that developers make is to use the assignment operator
    rather than the equality operator. You can see a list of relational operators
    in Chapter 6.


    The condition always ends with a colon (:). If you don''t know that the condition
    has ended and will continue to look for additional conditions on which to base
    its decision. After the colon come any tasks you want Python to perform. In this
    case, Python prints a statement saying that TestMe is equal to 6.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_133_0.png)'
  merge: -1
