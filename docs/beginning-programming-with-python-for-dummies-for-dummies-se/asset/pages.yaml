    You might have an application written in Python sitting on your machine right
    now and not know it. Python is used in a vast array of applications on the modern
    today. The applications range from utilities run from the console to full-fledged
    CAD/CAM suites. Some applications run on mobile devices, while others run on the
    large services employed by enterprises. In short, there is no limit to what you
    can do with Python, but it really helps to see what others have done. You can
    find a number of places online that list applications written in Python, but the
    best place to look is https://wiki.python.org/moin/Applications.


    As a Python programmer, you''ll also want to know that Python development tools
    are available to make your life easier. A development tool provides some level
    of automation in writing the procedures needed to tell the computer what to do.
    Having more development tools means that you have to perform well in order to
    obtain a working application. Developers love to share their lists of favorite
    tools, but you can find a great list of tools broken into categories at http://www.python.org/about/apps.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_33_1.png)


    Of course, this chapter describes a number of tools as well, such as NumPy and
    SciPy (two scientific libraries). The remainder of the book lists lists a few
    other tools; make sure that you copy your favorite tools for later.


    # Comparing Python to other languages


    Comparing one language to another is somewhat dangerous because the selection
    of a language is just much as a matter of taste and personal preference as it
    is any sort of quantifiable scientific fact. So before I''m attacked by the rigid
    protectors of the languages that follow, it''s important to remember'
