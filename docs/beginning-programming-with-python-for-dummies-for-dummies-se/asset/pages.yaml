    \ to specify a path if the file you want to remove is in the default directory).\
    \ The ease with which you can perform this task is almost scary because it's too\
    \ easy. Putting safeguards in place is always a good idea. You may need to remove\
    \ other items, so there are other functions you should know:\n\n![](img/ec69aa1535cd82c735ee14abfc05048f_323_0.png)\n\
    \n+   * `os.rmdir()`: Removes the specified directory. The directory must be empty\
    \ or Python will display an exception message.\n* `shutil.rmtree()`: Removes the\
    \ specified directory, all subdirectories, and all files. This function is especially\
    \ dangerous because it removes everything without checking (Python assumes you\
    \ know what you're doing). As a result, you can easily lose data using this function.\n\
    \n+   3. Choose Run: Run Module.\n\nThe application displays the `File Removed!`\
