  md: '# 56 Part I: Getting Started with Python


    Both of these commands are used in emergency situations only. The first, sys.exit(),
    provides special error-handling features that you discover in Chapter 9. The second,
    os._exit(), exits Python without performing any of the usual cleanup tasks. In
    both cases, you must import the required module, either sys or os, before you
    can use the associated command. Consequently, to use the sys.exit() command, you
    actually use this code:


    ```

    import sys

    sys.exit()

    ```


    You must provide an error code using os._exit() because this command is used only
    when an extreme error has occurred. The call to exit() command will fail if you
    don''t provide an error code. To use the os._exit() command, you actually use
    this code (where the error code is 5):


    ```

    import os

    os._exit(5)

    ```


    Chapter 10 discusses importing modules in detail. For now, just know that these
    two commands are for special uses only and you won''t normally use them in an
    application.'
