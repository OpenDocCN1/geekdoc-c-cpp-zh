  md: '# Introduction


    Quick! Which programming language will get you up and running applications on
    every popular platform around? Give up? Yes, it''s Python. The amazing thing about
    Python is that you can really write an application on one platform and use it
    on every other platform that you need to support. Unlike the other programming
    languages that promised to provide independence, Python really makes that independence
    possible. In this case, the promise is as good as the result you get.


    Python emphasizes code readability and a concise syntax that lets you write applications
    using fewer lines of code than other programming languages require. In addition,
    because of the way Python works, you find it used in all sorts of fields that
    are filled with nonprogrammers. Some people view Python as a scripted language,
    but it is really so much more. (Chapter 18 provides you with just an inkling of
    the occupations that rely on Python to make things work.)


    # About This Book


    Beginning Programming with Python For Dummies is all about getting up and running
    with Python quickly. You want to learn the language fast so that you can become
    productive using it to perform your real job, which could be anything. Unlike
    most books on the topic, this one starts you right at the beginning by showing
    what Python differs from other languages and how it can help you perform useful
    work in a job other than programming. As a result, you gain an understanding of
    what you need to do from the start, using hands-on examples and spending a good
    deal of time performing actually useful tasks. You even get help with installing
    Python on your particular system.


    When you have a good installation on whatever platform you''re using, you start
    with the basics and work your way up. By the time you finish working through the
    examples in this book, you''ll be writing simple programs and'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 2 Beginning Programming with Python For Dummies


    performing tasks such as sending an e-mail using Python. No, you won''t be an
    expert, but you will be able to use Python to meet specific needs in the job environment.
    To make absorbing the concepts even easier, this book uses the following conventions:


    +   * Text that you''re meant to type just as it appears in the book **bold**.
    The exception is when you''re working through a step list: Because each step is
    bold, the text type is not bold.

    * When you see words in *italics* as part of a typing sequence, you need to replace
    that value with something that works for you. For example, if you see "Type Your
    Name and press Enter," you need to replace Your Name with your actual name.

    * Web addresses and programming code appear in `monospaced`. If you''re reading
    a digital version of this book on a device connected to the Internet, you can
    click the web address to visit website, like this: `www.dummies.com`.

    * When you need to type command sequences by a special arrow, like this: `File>>New
    File`. In this case, you go to the File menu first and then select the New File
    entry on that menu. The result is that you see a new file created.


    # Foolish Assumptions


    You might find it difficult to believe that I''ve assumed anything about you —
    after all, I haven''t even met you yet! Although most assumptions are indeed foolish,
    I made these assumptions to provide a starting point for the book.


    It''s important that you''re familiar with the platform you want to use because
    the book doesn''t provide any guidance in this regard (Chapter 2 provides Python
    installation instructions for various platforms.) In order to provide you with
