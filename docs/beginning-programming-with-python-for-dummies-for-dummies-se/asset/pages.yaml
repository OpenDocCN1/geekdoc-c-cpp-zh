  md: '# 270 Part III: Performing Common Tasks


    1. Open a Python Shell window.


    You see the familiar Python prompt.


    2. Type the following code (pressing Enter after each line and pressing twice
    after the last line):


    ```

    class MyClass:

    MyVar = 0

    ```


    The first line defines the class container, which consists of the keyword class
    and the class name, which is MyClass. Every class you create must precisely this
    way. You must include class followed by the class name.


    The second line is the class suite. All the elements that comprise the class are
    called the class suite. In this case, you create a class variable MyVar, which
    is set to a value of 0. Every instance of the class will have the same variable
    and start at the same value.


    3. Type MyInstance = MyClass() and press Enter.


    You have created an instance of class named MyInstance. Of course, you''ll want
    to verify that you really created such an instance. Step 4 completes this task.


    4. MyInstance.MyVar and press Enter.


    The output of 0, as shown in Figure 14-1, demonstrates that MyInstance does indeed
    have a variable named MyVar.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_285_0.png)


    Figure 14-1: The instance contains the required variable.


    5. Type MyInstance.__class__ and press Enter.


    Python displays the class used to create this instance, as shown in Figure 14-2.
    The output tells you that this class is part of the __main__ module, which means
    you typed it directly into the shell.'
