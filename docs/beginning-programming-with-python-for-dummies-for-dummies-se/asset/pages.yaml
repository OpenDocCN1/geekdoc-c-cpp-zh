  md: '# 86 Part II: Talking the Talk


    because each form requires a different kind of processing. The following sections
    describe the integer, floating-point, and complex number classes of data types
    that Python supports.


    # Integers


    Any whole number is an integer. For example, the value 1 is a whole number, so
    it''s an integer. On the other hand, 1.0 isn''t a whole number; it has a decimal
    part to it, so it''s not an integer. Integers are represented by the int data
    type.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_101_0.png)


    With storage boxes, variables have capacity limits. Trying to stuff a value too
    large into a storage box results in an error. On platforms, you can store numbers
    between -9,223,372,036,854,775,808 and 9,223,372,036,854,775,807 within an int
    (which is the maximum value that fits in a 64-bit value). Even though that''s
    a really large number, it isn''t infinite.


    When with the int type, you have access to number of interesting features. Many
    of them appear later in the book, but one feature is the ability to use different
    numeric bases:


    +   - Base 2: Uses 0 and 1 as numbers.

    - Base 8: Uses the numbers 0 through 7.

    - Base 10: Uses the usual numeric system.

    - Base 16: Is also hex and uses the numbers 0 through 9 and the letters A through
    F to create 16 possible values.


    To tell Python when to use bases other than one, add a 0 and a special letter
    to the number. For example, 0b10 is the value one-zero-zero in base 2. Here are
    the letters you normally use:


    +   - b: 2

    - o: 8

    - x: 16


    It''s also possible to convert numeric values to other bases using the bin(),
    oct(), and hex() commands, putting everything together, you can see how to convert
    bases using the commands shown in Figure 5-2. Try the command shown in the figure
    yourself so that you can see how various bases work. Using a different base actually
    makes things easier in many situations, and you''ll encounter some of those situations
    later in the book. For now, all you really need to know is that integers support
    different numeric bases.'
