    # Creating an Interoperable Java Environment Using JPype


    Python provides access to a huge array of libraries, and you''re really unlikely
    to use them all. However, you might be in a situation in which you find a Java
    library that is perfect but can''t use it from your Python application unless
    you''re willing to jump through a bunch of hoops. The JPype library (jpype.sourceforge.net/)
    makes it possible to access most (but not all) of the Java libraries there directly
    from Python. The library works by creating a bridge between the two languages
    at the byte-code level. Consequently, you don''t have to do anything to get your
    Python application to work with Java.


    There are many different ways to achieve interoperability between two languages.
    Creating a bridge between them, as JPype does, is one way. Another alternative
    is to convert the code created for one language into code for the other language.
    This is Jython (https://wiki.python.org/jthon/). This utility converts your Python
    code into Java code so that you can make full use of Java functionality in your
    application while maintaining the features that you like about Python.


    access to some Java libraries. In addition, there is a speed penalty in using
    this approach because the JPype bridge is constantly calling data. The problem
    is that you lose the ability to modify your code after conversion. Any changes
    that you make create an incompatibility between the original Python code and its
    Java counterpart. In short, no perfect solutions exist for getting the best features
    of two languages into one application.


    > WARNING You''ll encounter trade-offs in language interoperability no matter
    which solution you use. In the case of JPype, you won''t


