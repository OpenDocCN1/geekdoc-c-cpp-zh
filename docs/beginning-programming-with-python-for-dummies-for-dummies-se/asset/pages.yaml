    # Working with exception arguments


    Most exceptions do provide arguments (a list of values that you can check for
    additional information). The exception either occurs or it doesn''t. However,
    a few exceptions provide arguments, and you use them later in the book. The arguments
    tell you more about the exception and provide-details that you need to correct
    it.


    For the sake of completeness, this chapter includes a simple example that generates
    an exception with an argument. You can safely skip the remainder of this section
    if desired because the information is covered in more detail later in the book.
    This example also appears with the downloadable source code as ExceptionWithArguments.py.


