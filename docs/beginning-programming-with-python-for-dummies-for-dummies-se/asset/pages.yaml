  md: '# 334 Part V: The Part of Tens


    # Creating Applications

    Faster Using an IDE


    An Interactive Development Environment (IDE) helps you create applications in
    a specific language. The Integrated Development Environment (IDE) editor that
    comes with Python worked well for the needs of the book, but you may find it limited
    after a while. For example, IDE doesn''t provide the advanced debugging functionality
    that many developers favor. In addition, you may find that you want to create
    graphical applications, which is difficult using IDE.


    You can talk to 50 developers and get little consensus as the best tool for any
    job, especially when discussing IDE. Every developer has a favorite product and
    isn''t easily swayed to try another. Developers invest many hours learning a particular
    IDE and extending it to meet specific requirements (when the IDE allows such tampering).


    ![](img/ec69aa1535cd82c735ee14abfc05048f_349_0.png)


    An inability (at times) to change IDE is why it''s important to try a number of
    different IDEs before you select one. (The most common reason for not wanting
    to change an IDE before you select one is that the project types are incompatible,
    which would mean having to re-create your projects every time you change editors,
    but there are many other reasons that you can find listed online.) The PythonEditors
    https://wiki.python.org/main/PythonEditors provides an extensive list of IDEs
    that you can try. The table provides you with particulars about each editor so
    that you can eliminate some of the choices immediately.


    # Checking Your Syntax

    with Greater Ease


    The IDE editor provides some level of syntax highlighting, which is helpful in
    finding errors. For example, if you mistype a keyword, it doesn''t change color
    to the color used for keywords on your system. Seeing that it hasn''t changed
    it makes possible for you to know to correct the error immediately, instead of
    having to run the application and find out later that something has gone wrong
    (sometimes after hours of debugging).'
