- img_proc: true
  md: '# Chapter 9: Dealing with Errors


    Logical errors are quite hard to fix because the problem isn''t with the actual
    code, yet the code itself is incorrectly defined. The thought process that went
    into creating the code is faulty; therefore, the developer who created the error
    is less likely to find it. Smart developers use a second pair of eyes to help
    spot logical errors. Having a formal specification also helps because the logic
    behind the tasks the application performs is usually given a formal review.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_170_0.png)


    # Catching Exceptions


    Generally speaking, a user should never see an exception dialog box. Your application
    should always catch the exception and handle it before the user sees it. Of, the
    real world is different — users do unexpected exceptions from time to time. catching
    every potential exception is still the goal when developing an application. The
    following sections describe how to catch exceptions and handle them.


    # Understanding the built-in exceptions


    Python comes with a host of built-in exceptions — far more than you might think
    possible. You can see a list of these exceptions at https://docs.python.org/3.3/library/exceptions.html.
    The documentation breaks the exception list into categories. Here is a brief overview
    of the Python exception categories that you work with:


    from this is hard because it isn''t always possible to release memory from other
    users. When the user presses an interrupt (such as Ctrl+C or Delete), Python generates
    a KeyboardInterrupt exception. The application must handle this exception before
    proceeding with any tasks.


    +   - Base classes: The base classes provide the essential building blocks (such
    as the Exception class) for other exceptions. However, you might actually see
    some of these exceptions, such as the ArithmeticError exception, when working
    with an application.


    +   - OS exceptions: The operating system generates errors that Python passes
    them to your application. For example, if your application tries to open a file
    that doesn''t exist, the operating system generates a FileNotFoundError exception.


    +   - Concrete exceptions: Applications can experience hard errors — errors that
    are hard to overcome because there isn''t a good way to handle them or signal
    an event that the application must handle. For example, when a system runs out
    of memory, Python generates a MemoryError exception. Recovering


    +   - Warning: Python throws to warn you about unexpected events or actions that
    could result in errors later. For example, if you inappropriately use a resource,
    such as an icon, Python generates a RuntimeError exception. It is important to
    remember that this particular category is a warning and not an actual error. Ignoring
    it can cause you woe later, but you can ignore it.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_170_1.png)'
