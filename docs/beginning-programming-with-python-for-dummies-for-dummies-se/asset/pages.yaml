    As with any server, your system may prompt you for permissions. For example, you
    may see a warning from your firewall telling you that pydoc is attempting to access
    the local system. You need to give pydoc permission to work with the system that
    you can see the information it provides. Any virus detection that you have installed
    may need permission to let pydoc continue as well. Some platforms, such as Windows,
    may require an elevation in privileges to run pydoc.


    Normally, the server automatically opens a new browser window for you, as shown
    in Figure 10-13. This window contains links to the various modules that are contained
    on your system, including custom modules you create and include in the Python
    path. To see information about any module, you can simply click its link.


    The command prompt provides you with two commands to control the server. You simply
    type the letter associated with the command and press Enter to activate it. Here
    are the two commands:


    +   - b: Starts a new copy of the default browser with the index page loaded.

    - q: Stops the server.


    When you''re done browsing the help information, make sure that you stop the server
    by typing q and pressing Enter at the command prompt. Stopping the server frees
    any resources it uses and closes any holes you made in your firewall to accommodate
    pydoc.'
