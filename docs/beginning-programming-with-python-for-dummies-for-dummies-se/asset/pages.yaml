    # # Formatting Strings


    You can format strings in a number of ways using Python. The main emphasis of
    formatting is to present a string in a form that is both pleasing to the user
    and easy to understand. Formatting doesn''t mean adding special fonts or effects
    in this case, but refers merely to the presentation of the data. For example,
    the user might want a fixed-point number rather than a decimal number as output.


    You have quite a few ways to format strings and you see a number of them as the
    book progresses. However, the focus of most formatting is the format() function.
    You use the format() function to add data to that string. A format specification
    can be as simple as curly brackets {} which specify a placeholder for data. You
    use the placeholder to create special effects. For example, {} would contain the
    first data element in a string. When the elements are numbered, you can even repeat
    them so that the same data appears once in the string.


    The formatting specification follows a colon: When you want to create a formatting
    specification, the curly brackets contain the colon and whatever formatting you
    want to use. For example, {:f} would create a fixed-point number as output. If
    you want to number the entries, the number that precedes the colon: {:09f} creates
    a fixed-point number output for data element one. The formatting specification
    follows this form, with the italicized elements serving as placeholders here:


    ```

    [[fill] align][sign][#] [width][ [.precision] [type]]

    ```'
