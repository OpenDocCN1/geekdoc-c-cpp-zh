  md: '# Understanding the Class as a Packaging Method


    A class is essentially a method for packaging code. The idea is to simplify code
    reuse; make applications more reliable, and reduce the potential for security
    breaches. Well-designed classes are black boxes that accept certain inputs and
    provide specific outputs based on inputs. In short, a class shouldn''t create
    any surprises for anyone and have known (quantifiable) behaviors. How the class
    accomplishes its work is unimportant, and hiding the details of its workings is
    essential to good coding practice.


    Before you move onto actual class theory, you need to know a few terms that are
    specific to classes. The following list defines terms that you need to know in
    order to use the material that follows later in the chapter. These terms are specific
    to Python. (Other languages may use different terms for the same techniques or
    define that Python uses in different ways.)


    +   **Class**: Defines a blueprint for creating an object. The type of builder
    who wants to create a blueprint of some type. The builder uses a blueprint to
    ensure the building will meet the required specifications. Python uses classes
    as a blueprint for creating new objects.


    +   **Class variable**: Provides a storage location used by all methods in an
    instance of the class. A class variable is defined within the class proper but
    outside of any of the class methods. Class variables aren''t very often because
    they are a potential security risk — every method of the class has to being a
    security risk, class variables are also visible as part of the class rather than
    a particular instance of a class, so they pose the potential problem of class
    contamination.


    +   **Data member**: Defines either a class variable or an instance variable to
    hold data associated with a class and its objects.


    +   **Function overloading**: Creates more than one version of a function, which
    results in different behaviors. The essential task of the function may be the
    same, but the inputs are different and provide the outputs as well. Function overloading
    is used to provide flexibility so that a function can work with applications in
    various ways.


    +   **Inheritance**: Uses a parent class to create child classes that have the
    same characteristics. The child classes usually have extended functionality or
    provide more specific behaviors than the parent class does.


    +   **Instance**: Defines an object created from the specification provided by
    a class. Python can create many instances of a class to perform the work required
    by an application. Each instance is unique.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_283_0.png)


    ![](img/ec69aa1535cd82c735ee14abfc05048f_283_1.png)'
