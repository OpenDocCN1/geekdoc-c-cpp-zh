    # Handling more specific to less specific exceptions


    One strategy for handling exceptions is to provide specific clauses for all known
    exceptions and generic clauses to handle unknown exceptions. You can see the exception
    hierarchy that Python uses at https://docs.python.org/3.3/library/exceptions.html#exception-hierarchy.
    When viewing this chart, BaseException is the uppermost. Most errors are derived
    from Exception. When working through matters, you can use the generic ArithmeticError
    or a more specific ZeroDivisionError.


    Python evaluates except clauses in the order in which they appear in the source
    code file. The first clause is examined first, the second clause is examined second,
    and so on. The following steps help you examine an example that demonstrates the
    importance of using the correct exception order. In this case, you perform tasks
    that result in math errors. This example also appears with the downloadable source
    code as MultipleException.py.'
