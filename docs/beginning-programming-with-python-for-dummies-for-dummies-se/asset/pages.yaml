  md: '# Working with Tuples


    As previously mentioned, a tuple is a collection used to create complex lists,
    in which you can embed one tuple within another. This embedding lets you create
    hierarchies with tuples. A hierarchy could be something as simple as the directory
    of your hard drive or an organizational chart for your company. The idea is that
    you can create complex data structures using a tuple.


    Tuples are immutable, which means you can''t change them. You can create a new
    tuple with the same name and modify it in some way, but you can''t modifying an
    existing tuple. Lists are mutable, which means that you can change them. So, a
    tuple can seem at first to be at a disadvantage, but immutability has all sorts
    of advantages, as being more secure as well as faster. In addition, immutable
    objects are easier to use with multiple processors.


    The two biggest differences between tuple and a list are that a tuple is immutable
    and allows you to embed one tuple inside another. The following steps demonstrate
    how you can interact with a tuple in Python.


    +   1. Open a Python Shell window.


    +   You see the familiar Python prompt.


    +   2. Type Tuple = ("Red", "Blue", "Green") and press Enter.


    +   Python creates a tuple containing three strings.


    +   3. Type Tuple and press Enter.


    You see the content of MyTuple, which is three strings, as shown in Figure 13-1.
    The entries use single quotes, even though you used double quotes to create the
    tuple. In addition, that a tuple uses parentheses rather than square brackets,
    as lists.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_260_0.png)'
