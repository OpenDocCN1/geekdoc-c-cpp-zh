    to be time consuming and doesn''t make the application more functional (it also
    slows the application in many cases). The point is that users like GUIs, and if
    you want your application to use strong use, you need to meet requirements.


    # Providing a Nice Tabular Data Presentation Using PrettyTable


    Display tabular data in a manner the user can understand is important. From the
    examples you''ve seen throughout the book, you know that Python stores this type
    of data in a format that works best for programming needs. However, users need
    something that is organized in a manner that humans understand and is visually
    appealing. The PrettyTable library (https://pypi.python.org/PrettyTable) makes
    it easy to add an appealing tabular presentation to your command-line application.


    # Enhancing Your Application with Sound PyAudio


    Sound is a useful way to convey certain types of information to the user. Of course,
    you have to be careful in using sound because special-needs might not be able
    to hear it, and for those who can, using too much sound can interfere with normal
    business operations. Sometimes audio is an important means of communicating supplementary
    information to users who can interact with (or of simply adding a bit of pizzazz
    to make your application more interesting).


    One of the best platform-independent libraries to make sound work with your Python
    application is PyAudio (http://people.csail.mit.edu/hubert/pyaudio/). This library
    makes it possible to record and play back sounds as needed (such as a user recording
    an audio note of tasks to perform later and then playing back the list of items
    as needed).'
