  md: '# Chapter 8


    # Performing Repetitive Tasks


    In This Chapter


    +   - Performing a task a specific number of times

    - Performing a task until completion

    - Placing one task loop within another


    All the examples in the book so far have performed a series of steps one time
    and then stopped. However, the real world does not work this way. Many of the
    tasks that humans perform are repetitive. For example, the doctor might state
    that you need to exercise more and tell you to do 100 push-ups each day. If you
    just do one push-up, you won''t get much benefit from the exercise and you won''t
    be following the doctor''s orders. Of course, because you know precisely how many
    push-ups to do, you can perform the task a specific number of times. Python allows
    the same sort of repetition using for statement.


    Unfortunately, you don''t know how many times to perform a task. For example,
    needing to check a stack of coins for one of extreme rarity. Taking just the first
    coin from the top, examining it, and deciding that it is either or the rare coin
    doesn''t contain the task instead. You must examine each coin in turn, looking
    for the rare coin. Your stack may contain more than one. Only after you have looked
    at every coin in the stack can you say that the task is complete. However, you
    don''t know how many coins are in the stack, you don''t know how many times to
    perform the task at the outset. You only know the task is done when the stack
    is done. Python performs this kind of repetition using while statement.


    Most programming languages call any sort of repeating sequence of events a loop.
    The idea is to picture the repetition as a circle, with the code going round and
    executing tasks until the loop ends. Loops are an essential part of application
    elements such as menus. In fact, writing most modern applications without using
    loops would be impossible.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_148_0.png)'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# 134 Part II: Talking the Talk


    In cases, you must create loops within loops. For example, to create a multiplication
    table, you use a loop within a loop. The inner loop calculates the column values
    and the outer loop moves between rows. You see such an example later in the chapter,
    so don''t worry much about understanding precisely how things work right now.


    # Processing Data Using the for Statement


    The first looping code block that most developers encounter is the for statement.
    It''s hard to imagine creating a conventional programming language that lacks
    a statement. In this case, the loop executes a fixed number of times, and you
    know the number of times it will execute before the loop begins. Because everything
    about a for loop is known at the outset, for is the easiest kind of loop to use.
    However, in order to use one, you need to know how many times to execute the loop.
    The following sections describe the for loop in greater detail.


    # Understanding the for statement


    A for loop begins with a for statement. The for statement describes how to perform
    the loop. The Python for loop works through a sequence of some type. It doesn''t
    matter whether the sequence is a series of letters in a string or items within
    a collection. You can specify a range of values to use by specifying the range
    () function. Here''s a simple for statement.


    ```

    for Letter in "Howdy!\:

    ```


    The statement begins with the keyword for. The next item is a variable that holds
    a single element of a sequence. In this case, the variable name is Letter. The
    in keyword tells Python that the sequence connects next. In this case, the string
    is "Howdy!. The for statement always ends with a colon, just as the decision-making
    statements described in Chapter 7 do.


    Indented under the for statement are the tasks you want performed within the loop.
    Python considers every following indented statement part of the code block that
    composes the for loop. Again, the for loop works just like the decision-making
    statements in Chapter 7.'
