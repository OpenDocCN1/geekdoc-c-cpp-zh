    # Getting User Input


    Very few applications exist in our world — that is, part from the user. In fact,
    most applications interact with users in a major way because computers are designed
    to serve user needs. To interact with a user, an application must provide some
    means of obtaining user input. Fortunately, the most commonly used technique for
    obtaining input is also relatively easy to implement. You use the input() to do
    it.'
