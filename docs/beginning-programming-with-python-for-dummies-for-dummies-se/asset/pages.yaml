  md: '# Chapter 1: Talking to Your Computer


    # Unearthing the reasons for using Python


    Most programming languages are created with specific goals in mind. These goals
    help define the language characteristics and determine what you can do with the
    language. There really isn''t any way to create a programming language that does
    everything because people have competing goals and needs when creating applications.
    When it comes to Python, the main objective was to create a programming language
    that would make programmers efficient and productive. With that in mind, here
    are the reasons why you want to use Python when creating an application:


    +   Less application development time: Python code is usually 2-10 times shorter
    than comparable code written in languages like C/C++ and Java, which means you
    spend less time writing your application and more time using.


    +   Ease of reading: A programming language is like any other language — you need
    to be able to read it and understand what it does. Python tends to be easier to
    read than the code written in other languages, which means you spend less time
    interpreting it and more time making essential changes.


    +   Reduced learning time: The creators of Python wanted to make a programming
    language with fewer odd rules that make the language hard to learn. After all,
    programmers want to create applications, not learn obscure and difficult languages.


    It''s important to realize that although Python is a popular language, in fact,
    it currently ranks eighth on sites such as TIOBE (http://www.tiobe.com/index_index.html),
    an organization that tracks usage statistics (among other things). If you''re
    looking for a language for the purpose of obtaining a job, Python is a good choice,
    but C++, C#, or Visual Basic would be better choices. Make sure you choose a language
    you like and one on the basis of what you intend to accomplish. Python was the
    language of the year in both 2007 and 2010 and has ranked as high as the fifth
    most popular language in February 2011. So, really, it''s a good choice if you''re
    looking for a job, but not necessarily the best choice. However, it might surprise
    you to know that many colleges now use Python to teach coding, and it has become
