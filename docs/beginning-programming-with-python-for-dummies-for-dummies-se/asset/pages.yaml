  md: '# Knowing that an Application is a Form of Communication


    Computer communication occurs through the use of applications. You use one application
    to answer your e-mail, another to purchase goods, and still to create a presentation.
    An application (sometimes called an app) provides the means to express human ideas
    to the computer in a manner the computer can understand and defines the tools
    needed to shape the data used for the communication in specific ways. Data used
    to express the tent of a presentation is different from data used to purchase
    a present for your mother. The way you view, use, and understand the data is different
    for each task, so you use different applications to interact with the data in
    a manner that both the computer and you can understand.


    It''s possible to obtain applications to just about any general need you can conceive
    of today. In fact, you probably have access to applications for which you''ve
    even thought about a purpose yet. Programmers have been busy creating millions
    of applications of all types for many years now, so it might be hard to understand
    what you can accomplish by creating some new method for talking with your computer
    through an application. The answer comes down to thinking about the data and how
    you want to interact with it. Data simply isn''t common enough to attracted the
    attention of a programmer, or you may need the data in a format that no application
    currently supports, so you don''t have any to tell the computer to create a custom
    application to do it.


    The following sections describe applications from the perspective of working with
    unique data in a manner that is special in some way. For example, you might have
    access to a video library database but no method to access it in a way that makes
    sense to you. The data is unique and your access needs are special, so you may
    want to create an application that addresses both the data and your needs.


    # Thinking about procedures you use daily


    A procedure is simply a set of steps you follow to perform a task. For example,
    when making toast, you might use a procedure like this:


    +   1. Get the bread and butter from the refrigerator.

    2. Open the bread bag and take out two pieces of toast.

    3. Remove the cover from the toaster.'
