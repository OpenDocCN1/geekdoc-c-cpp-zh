  md: '# Telling the computer what to do


    Python, like every other programming language in existence, relies on commands.
    A *command* is simply a step in a procedure. In Chapter 1, you saw how "Get the
    bread and butter from the refrigerator" is a step in making toast. When working
    with Python, a command, such as print(), is simply the same thing: a step in a
    procedure.


    To tell the computer what to do, you issue one or more commands that Python understands.
    Python translates these commands into instructions that the computer understands,
    and then you see the result. A command such as print() can display the results
    onscreen so that you get an instant result. However, Python supports all sorts
    of commands, many of which don''t display results onscreen but still do something
    important.


    As the book progresses, you use commands to perform all sorts of tasks. Each of
    these tasks will help you accomplish a goal, just as the steps in a procedure.
    It seems as if the Python commands become too complex, simply remember to look
    at them as steps in a procedure. Even human procedures become complex at times,
    but if you take one step at a time, you begin to see how they work. Python commands
    are the same way. Don''t get overwhelmed by them; instead, look at one at a time
    and focus on just that in your procedure.


    # Telling the computer you''re done


    At some point, the procedure you create ends. When you make toast, the procedure
    ends when you finish buttering the toast. Computer procedures precisely the same
    way. They have a starting and ending point. When typing commands, the ending point
    for a particular step is the Enter key. You press Enter to tell the computer you
    are typing your command. As the book progresses, you find that Python provides
    a number of ways to signify that a step, group of steps, or even an entire application
    is complete. No matter how the task is accomplished, computer programs always
    have a distinct starting and stopping point.


    # Seeing the result


    You now know that a command is a step in a procedure and that each command has
    a distinct starting and ending point. In addition, groups of commands and entire
    applications also have a distinct starting and ending'
