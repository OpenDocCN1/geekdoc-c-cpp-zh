    # Administering a Network


    More than a few administrators use Python to perform tasks as monitoring network
    health or creating utilities that automate tasks. Administrators are often short
    of time, so anything they can do to automate tasks is a plus. In fact, network
    management software, such as Trigger (http://readthedocs.org/latest/), is actually
    written in Python. A of these tools are open source and free to download, so you
    can try them on your network. Also, some interesting articles using Python for
    network administration, such as "Intro to Python & Automation for Network Engineers"
    at http://packetpushers.net/show-176-intro-to-python-automation-for-network-engineers/.
    The point is knowing how to use Python on network to decrease your workload and
    perform tasks more easily. If you want to see some scripts that are written with
    network management in mind, check out 25 projects tagged "Network Management"
    at http://freecode.com/tags/network-management.


    # Teaching Programming Skills


    Many teachers are looking for a faster, more consistent method of teaching technology.
    Raspberry Pi (http://www.raspberrypi.org/) is a single-computer for schools makes
    obtaining the required equipment at a less expense for schools. The small device
