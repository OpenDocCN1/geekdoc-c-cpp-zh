  md: "# 140 Part II: Talking the Talk\n\n# Controlling execution with the pass clause\n\
    \nThe Python language includes something not commonly found in other languages:\
    \ a second sort of continue clause. The pass clause works almost the same way\
    \ as the continue clause does, except that it allows completion of the code in\
    \ the if block in which it appears. The following steps use an example that is\
    \ precisely the same as the one found in the previous section, \"Controlling execution\
    \ with the continue statement,\" except that it uses a pass clause instead. This\
    \ example also appears with the downloadable source code for ForPass.py.\n\n+\
    \   1. Open a Python File window.\n\nYou see an editor in which you can type the\
    \ example code.\n\n+   2. Type the following code into the window — pressing Enter\
    \ after line:\n\n```\nLetterNum = 1\nfor Letter in \"Howdy!\":\n  if Letter ==\
    \ \"w\":\n    pass\n  print(\"Encountered w, not processed.\")\nprint(Letter,\
    \ \", LetterNum, \" is \", Letter)\nLetterNum+=1\n```\n\n+   3. Choose Run:Run\
    \ Module.\n\nYou see a Python Shell window. The application displays the letter\
    \ sequence with the letter number, as shown in Figure 8-5. However, notice the\
    \ effect of the pass clause — the letter w is not processed. In addition, the\
    \ example displays the string that was displayed for the continue clause example.\n\
    \nThe continue clause makes it possible to silently bypass specific elements in\
    \ a sequence and without executing any additional code for that element. Use the\
    \ pass clause when you need to perform some sort of post processing on the element,\
    \ such as logging the element in an error log, displaying a message to the user,\
    \ or handling the problem element in some other way. The continue and pass clauses\
    \ both do the same thing, but they're used in distinctly different situations.\n\
    \n![](img/ec69aa1535cd82c735ee14abfc05048f_155_0.png)"
