  md: '# 94 Part II: Talking the Talk


    # Controlling How Python Views Data


    As discussed in Chapter 5, all data on your computer is stored as 0s and 1s. The
    computer does not understand the concept of letters, Boolean values, dates, times,
    or any other kind of information except numbers. In addition, a computer''s capability
    to work with numbers is both inflexible and relatively simplistic. When you work
    with a string in Python, you are depending on Python to translate the concept
    of your application into a form the computer can understand. The storage containers
    that your application creates and uses in the form of variables tell Python how
    to treat the 0s and 1s that the computer has stored. It''s important to remember
    that the Python view of data is not the same as your view of data or the computer''s
    view of data — Python acts as an intermediary to make your applications functional.


    To manage data within an application, the application must control the way in
    which Python views the data. The use of operators, packaging methods such as functions,
    and the introduction of user input help applications control data. All these techniques
    rely, in part, on making comparisons. Determining what to do next means understanding
    what state the data is in now compared to some other state. If the variable contains
    John but now you really want it to contain Mary instead, you first need to know
    that it does fact contain John. Only then can you make the decision to change
    the content of the variable.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_109_0.png)


    # Making comparisons


    Python''s main method for making comparisons is the use of operators. In fact,
    operators play a major role in manipulating data as well. The "Working with Operators"
    section discusses how operators work and how you can use them in applications
    to control data in various ways. Later chapters use operators extensively as you
    discover techniques for creating applications that can make decisions, perform
    tasks repetitively, and interact with the user in interesting ways. However, the
    basic idea behind operators is that they help applications perform various types
    of comparisons.


    In some cases, you use fancy methods for performing comparisons in an application.
    For example, you can compare the output of two functions (as described in the
    "Comparing function output" section, in this chapter). With Python, you can perform
    comparisons at a number of levels so that you can manage data without a problem
    in your application. Using these techniques hide detail so that you can focus
    on the point of the comparison and define how to react to that comparison rather
    become mired in detail.'
