  md: '# Chapter 7: Making Decisions


    # Using the if statement in an application


    It''s possible to use the if statement in a number of ways in Python. However,
    you immediately need to know about three common ways to use it:


    +   - Use a single condition to execute a single statement when the condition
    is true.

    - Use a single condition to execute multiple statements when the condition is
    true.

    - Combine multiple conditions into a single decision and execute one or more statements
    when the combined condition is true.


    The following sections explore these three possibilities and provide you with
    examples of their use. You see additional examples of how to use the if statement
    throughout the book because it''s such an important method of making decisions.


    # Working with relational operators


    A relational operator determines a value on the left side of an expression compares
    to the value on the right side of an expression. After it makes the determination,
    it outputs a value of true or false that reflects the 6 is false truth value of
    the expression. For example, 6 == 6 is true, while 5 == 6 is false. Table 6-3
    contains a listing of the relational operators. The following steps show how to
    create and use an if statement. This example also appears with the downloadable
    source code as SimpleIf1.py.


    +   1. Open a Python Shell window.


    You see the family prompt.


    +   2. Type TestMe = 6 and press Enter.


    This step assigns a value of 6 to TestMe. Notice that it uses the assignment operator
    and not the equality operator.


    +   3. If TestMe == 6: and press Enter.


    This creates an if statement that tests the value of TestMe using the equality
    operator. You should notice two features of the Python Shell at this point:


    +   - The word if is highlighted in a different color than the rest of the statement.

    - The next line is automatically indented.'
