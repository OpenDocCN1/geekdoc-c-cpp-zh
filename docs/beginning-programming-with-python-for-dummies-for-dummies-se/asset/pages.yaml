  md: '# Chapter 9: Dealing with Errors


    Errors occur in many cases when the developer makes assumptions that simply aren''t
    true. Of course, this includes assumptions about the application user, who probably
    doesn''t care about the extreme level of care you took when crafting your application.
    The user will enter bad data. Again, Python won''t know or care that the data
    is bad and will process it even when your intent was to disallow bad input. Python
    doesn''t understand the concepts of good or bad data; it simply processes incoming
    data according to any rules you set, which means you must set rules to protect
    users from them.


    Python isn''t proactive or creative — those qualities exist only in the developer.
    When a network error occurs or the user does something unexpected, Python doesn''t
    create a solution to fix the problem. It only processes code. If you don''t provide
    code to handle the error, the application is likely to fail and crash gracefully
    — possibly taking all of the user''s data with it. Of course, the developer can''t
    anticipate every possible error situation, which is why most complex applications
    have errors in them — errors of omission, in this case.


    Some developers utter they can create bulletproof code, despite the absurdity
    of thinking that code is even possible. Smart developers assume that some of bugs
    will get through the code-screening process, that nature and users use to perform
    unexpected actions, and even the smartest developer can''t anticipate every possible
    error condition or exceptions. Always assume that your application is subject
    to errors that will cause exceptions; that way, you''ll have the mindset required
    to actually make your application more reliable.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_166_0.png)


    # Considering the Sources of Errors


    You might be able to divide the potential sources of error in your application
    by reading tea, but that''s a hardly efficient way to do things. Errors actually
    fall into two well-defined categories that help you predict (to some degree) when
    and where they''ll occur. By thinking about these categories as you work through
    your application, you''re far more likely to discover potential errors before
    they occur and cause potential damage. The two principle categories are


    +   - Errors that occur at a specific time

    - Errors that are of a specific type


    The following sections discuss these two categories in greater detail. The overall
    concept is that you need to think about error classifications in order to start
    finding and fixing potential errors in your application before they become a problem.'
