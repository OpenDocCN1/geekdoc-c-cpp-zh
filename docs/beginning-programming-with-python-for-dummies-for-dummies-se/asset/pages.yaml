    # Overloading operators


    In situations, you want to be able to do something special as the result of using
    a standard operator to add (+). In fact, sometimes Pyton doesn''t provide a default
    behavior for operators because it has no default to implement. No matter what
    the reason might be, overloading operators makes it possible to assign new functionality
    to existing operators so that they do what you want, rather than what Python intended.
    The following steps demonstrate how to overload an operator and use it as part
    of an application. This example also appears with the downloadable source code
