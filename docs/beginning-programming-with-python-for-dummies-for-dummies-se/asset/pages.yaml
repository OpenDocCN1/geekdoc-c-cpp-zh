  md: "# Chapter 16: Sending an E-Mail\n\nletter leaving one location and ending up\
    \ precisely where it should at the other end seems impossible — mind-boggling,\
    \ even. However, both e-mail and its real-world equivalent have several aspects\
    \ in common that improve the likelihood that they'll actually work as intended.\
    \ The following sections examine what happens when you write an e-mail, click\
    \ Send, and the recipient receives it on the other end. You might be surprised\
    \ at what you discover.\n\n# Viewing e-mail as you do a letter\n\nThe best way\
    \ to view e-mail is the same as you view a letter. When you write a letter, you\
    \ provide two pieces of paper as a minimum. The first contains the content of\
    \ the letter, the second is an envelope. Assuming that the postal service is honest,\
    \ the content is never examined by anyone other than the recipient. The same can\
    \ be said of e-mail. An e-mail actually consists of these components:\n\n+   *\
    \ Message: The content of the e-mail, which is actually composed of two parts:\n\
    \    * Header: The part of the e-mail content that includes the subject, the list\
    \ of recipients and other features, such as the urgency of the e-mail.\n    *\
    \ Body: The part of the e-mail content that contains the actual message, formatted\
    \ as HTML, and consisting of one or more documents, or it can be a combination\
    \ of all these elements.\n* Envelope: A container for the message. The envelope\
    \ provides sender and recipient information, just as the envelope for a physical\
    \ piece of mail provides. However, an e-mail doesn't include a stamp.\n\nWhen\
    \ working with e-mail, you create a message using an e-mail application. As part\
    \ of the e-mail application setup, you define account information. When you click\
    \ send:\n\n+   1. The e-mail application wraps up your message, with the header\
    \ first, in an envelope that includes both your sender and the recipient's information.\n\
    2. The e-mail application uses the account information to contact the SMTP server\
    \ and send the message for you.\n3. The SMTP server reads only the information\
    \ found in the message envelope and redirects your e-mail to the recipient.\n\
    4. The recipient e-mail application logs on to the local server, picks up the\
    \ e-mail, and then displays only the message part for the user."
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 312 Part IV: Performing Advanced Tasks


    The process is a little more complex than this explanation, but this is essentially
    what happens. In fact, it''s much the same as the process used when working with
    physical letters in that the essential steps are the same. With physical mail,
    the e-mail application is replaced by you one end and the recipient at the other.
    The SMTP server is replaced by the post office and the employees who work there
    (including the postal carriers). However, someone generates a message, the message
    is transferred to a recipient, and receives the message in both cases.


    # Defining the parts of the envelope


    There is a difference in how the envelope for an e-mail is configured and how
    it''s actually handled. When you view the envelope for an e-mail, it looks like
    a letter in it contains the address of the sender and the address of the recipient.
    It may not look physically like an envelope, but the components are there. When
    you visualize a physical envelope, you see specifics, such as the sender''s name,
    street address, city, state, and zip code. The same is true for the recipient.
    These elements define, in physical terms, where the postal carrier should deliver
    the letter or return the letter when it can''t delivered.


    However, when the SMTP server processes the envelope for an e-mail, it must look
    at the specifics of the address, which is where the analogy of a physical envelope
    used for mail starts to break down a little. An e-mail address contains different
    information from a physical address. In summary, what is the e-mail address:


    +   - Host: The host is akin to the city and state used by a physical mail envelope.
    A host address is the address used by the card that is physically connected to
    the Internet, and it handles all the traffic that the Internet consumes or provides
    for this particular machine. A PC can use Internet resources in a lot of ways,
    but the host address for all uses is the same.


    +   - Port: The port is akin to the street address used by a physical mail envelope.
    It specifies which specific part of the system should receive the message. For
    example, an SMTP server for outgoing messages normally relies on port 25. However,
    the Point-of-Presence (POP3) server used for incoming e-mail messages usually
    relies on port 110. Your browser typically uses port 80 to communicate with websites.
    However, secure websites (those that use https as a protocol, rather than http)
    rely on port 443 instead. You can see a list of typical ports at http://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers.'
