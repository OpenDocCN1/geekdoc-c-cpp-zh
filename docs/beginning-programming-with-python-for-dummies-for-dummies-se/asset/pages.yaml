  md: "# Chapter 10: Interacting with Modules\n\nthat you want to support. In addition,\
    \ dual-language applications can be harder to maintain because you must have developers\
    \ who can speak each of the computer languages used in the application.\n\nThe\
    \ most common way to create a module is to define a separate file containing the\
    \ code you want to group separately from the rest of the application. For example,\
    \ you might want to create a print routine that an application uses in numbers\
    \ of places. The print routine is not designed to work on its own but as part\
    \ of the application as a whole. You want to separate it because the application\
