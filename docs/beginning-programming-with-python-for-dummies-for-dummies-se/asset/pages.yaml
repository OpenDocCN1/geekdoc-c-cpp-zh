  md: '# 150 Part II: Talking the Talk


    Sometimes your code detects an error in an application. When this happens, you
    need to raise or throw an exception. You see both terms used for the same thing,
    which simply means that your code encountered an error it couldn''t handle, so
    it passed the error information onto another piece of code to handle (interpret,
    process, and with luck, fix the exception). In some cases, you use error message
    objects to pass on the information. Even though Python has a wealth of message
    objects that cover most situations, some situations differ. For example, you might
    want to provide special support for a database application, and Python won''t
    normally cover contingency with a generic message object. It''s important to know
    when to handle exceptions locally, when to send them to the code that called you,
    and when every part of the application knows how to handle the exception — all
    topics covered by this chapter.


    There are also times when you must ensure that your application handles an exception
    gracefully, even if shutting the application down. Fortunately, Python provides
    the finally clause, which always executes, even when an exception occurs. You
    can place code to close files or perform other essential tasks in the code block
    associated with this clause. Even though you wouldn''t perform this task all the
    time, it is the last topic discussed in the chapter.


    # Knowing Why Python Doesn''t Understand You


    Developers often get frustrated with programming languages and computers because
    they seem out of their way to cause communication problems. Of course, programming
    languages and computers are both inanimate — there is no desire for anything on
    the part of either. Programming languages and computers also don''t; they accept
    whatever the developer has to say literally. There lie the problem


    ![](img/ec69aa1535cd82c735ee14abfc05048f_165_0.png)


    Neither Python nor the computer will "know what you mean" when you type instructions
    are code. Both follow whatever instructions you provide to the letter and literally
    as you provide them. You may not have meant to tell Python to delete a data file
    unless some absurd condition occurred. However, if you don''t make the condition
    clear, Python will delete the file whether the condition exists or not. When an
    error of this sort happens, people commonly say that the application has a bug
    in it. Bugs are simply coding errors that you can remove using a debugger. (A
    debugger is a special kind of tool that lets you stop or pause application execution,
    examine the content of variables, and generally dissect the application to see
    what makes it.)'
  merge: -1
