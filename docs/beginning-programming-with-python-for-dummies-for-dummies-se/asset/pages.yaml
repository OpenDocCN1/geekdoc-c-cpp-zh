    # Determining a variable''s type


    Sometimes you might want to know the variable type. Perhaps the type isn''t obvious
    from the code or you''ve received the information from a source whose code isn''t
    accessible. Whenever you want to see the type of a variable, use the type() method.
    For example, if you start placing a value of 5 in myInt by typing myint = 5 and
    pressing Enter, you can find the type of myInt by typing type(myInt) and pressing
    Enter. The output will be <class ''int''>, which means that myInt contains an
    value.


    When using Boolean value in Python, you rely on the bool type. A variable of this
    type can contain only values: True or False. You can assign a value using the
    True or False keywords, or you can create an expression that defines a logic that
    equates to true or false. For example, you could say, myList = 1 > 2, which would
    equate to False because 1 is not greater than 2. You see the bool type used extensively
    in the book, so don''t worry about understanding this concept right now.


    # Understanding strings


    Of all the data types, strings are the most easily understood by humans and not
    understood at all by computers. If you have read the previous chapters in this
    book, you have already seen strings quite. For example, the example code in Chapter
    4 relies on strings. A string is simply any grouping of characters you place within
    double quotes. For example, myString = "Python is a great language." assigns a
    string of characters to myString.


    The computer doesn''t see letters at all. Every letter you use is represented
    by a number. For example, the letter A is actually the number 65. To see this
    for yourself, type ord("A") at the Python prompt and press Enter. You see 65 as
    output. It''s possible to convert any single letter to its number using the ord()
    command.


    Because the computer doesn''t understand strings, strings are so useful in writing
    applications, you sometimes need to convert a string to a number. You can use
    the int() and float() commands to perform this conversion. For example, if you
    type myInt = int("123") and press Enter in the Python prompt, you create an int
    named myInt that contains the value 123. Figure 5-4 shows how you can perform
    this task and validate the content and type of myInt.'
