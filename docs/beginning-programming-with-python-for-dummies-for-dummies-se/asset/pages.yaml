  md: '# Chapter 9


    # Dealing with Errors


    In This Chapter


    +   - Defining problems in communication with Python

    - Understanding error sources

    - Handling error conditions

    - Specifying that an error has occurred

    - Developing your own error indicators

    - Performing tasks even after an error occurs


    Most application code of any complexity has errors in it. When your application
    suddenly freezes for no apparent reason, that''s an error. Seeing one of those
    obscure message boxes is another kind of error. However, errors can occur that
    do not provide you with any sort of notification. An application might perform
    the wrong computation on a series of numbers you provide, resulting in incorrect
    output that you may never know about unless someone tells you something is wrong,
    either or you check for the issue yourself. You may see them on some occasions
    and not on others. For example, an error can occur only when the weather is bad
    or overloaded. In short, errors occur in all sorts of situations and for all sorts
    of reasons. This chapter tells you about all sorts of errors and what to do when
    your application encounters them.


    It shouldn''t surprise that you errors occur — applications are written by humans,
    and make mistakes. Most developers call application errors exceptions, meaning
    that they''re the exception to the rule. Because exceptions occur in applications,
    you need to detect and do something about whenever possible. The act of detecting
    and processing an exception is called error handling or exception handling. In
    order to properly detect errors, you need to know about error sources and why
    errors occur in the first place. When you detect the error, you must process it
    by catching the exception. Catching an exception means examining it and possibly
    doing something about it. So, another part of this chapter is about discovering
    how to perform exception handling in your own application.'
  merge: -1
