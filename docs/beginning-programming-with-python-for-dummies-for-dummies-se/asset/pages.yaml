  md: "# 54 Part I: Getting Started with Python\n\nYou might wonder why Python has\
    \ a help at all if you can get the same results at the Python prompt. The answer\
    \ is convenience. It's easier to browse the help mode. In addition, even though\
    \ you don't do a lot of extra typing at the prompt, you do perform less typing\
    \ while in help mode. Help also provides additional helps, such as by listing\
    \ commands that you can type, as shown in Figure 3-3. You have all kinds of reasons\
    \ to enter help mode when you plan to ask Python a lot of help questions.\n\n\
    No matter what you ask for help, you need to observe the correct capitalization\
    \ of help topics. You must type help(FUNCTIONS) and not help('Functions') or help\
    \ ('functions'). When you use the wrong capitalization, Python will tell you that\
    \ it doesn't know what you mean or it couldn't find the help topic. It won't know\
    \ to tell you that you used the wrong capitalization. Someday computers will know\
    \ what you meant to type, rather than what you did type, but that hasn't happened\
    \ yet.\n\n# Closing the Command Line\n\nEventually, you want to leave Python.\
    \ Yes, it's hard to believe, but people have other things to do besides playing\
    \ with Python all day long. You have two standard methods for leaving Python and\
    \ a bunch of nonstandard methods. Generally, you want to use one of the standard\
    \ methods to ensure Python behaves as you expect it to, but the nonstandard methods\
    \ work just when you simply want to play around with Python and not perform any\
    \ productive work. The two standard methods are\n\n```\nquit()\nexit()\n```\n\n\
    Either of these methods will close the interactive version of Python. The shell\
    \ (the Python prompt) is designed to allow either command.\n\nBoth of these methods\
    \ can accept an optional argument. For example, you can type quit(5) or exit(5)\
    \ and press Enter to exit the shell. The numeric argument sets the command prompt's\
    \ ERRORLEVEL environment variable, which you can then intercept at the command\
    \ line or as part of a batch file. Standard practice is to simply use quit() or\
    \ exit () when nothing has gone wrong with the application. To see this way working\
    \ at exit, you must\n\n+   1. Open a command prompt or terminal.\n   See a prompt.\n\
    2. Type Python and press Enter to start your Python.\n   See the Python prompt."
