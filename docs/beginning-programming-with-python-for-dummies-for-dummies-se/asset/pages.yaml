    # Locating Your Information Using IRLib


    Finding your information can be difficult when the information grows to a center
    size. Consider your hard drive as a large, free-form, tree-based database that
    lacks a useful index. Any time a structure becomes large enough, data simply gets
    lost. Just try to find those pictures you took last summer and you''ll get the
    idea. As a result, having some type of search capability built into your application
    is important so that users can find lost file or other information.


    A number of search libraries are available for Python. The problem with most of
    them is that they are hard to install or provide consistent platform support.
    In fact, some of them work on only one or two platforms. However, IRLib (https://github.com/gr3ndata/irlib)
    is written in pure Python, which ensures that it works on every platform. If you
    find IRLib doesn''t meet your needs, make sure the product you do will provide
    the required search functionality on all the platforms you select and that the
    installation requirements are within reason.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_377_1.png)'
