- img_proc: true
  md: '# 224 Part III: Performing Common Tasks


    Lists are incredibly important in Python. This chapter introduces you to the concepts
    used to create, manage, search, and print lists (among other tasks). When you
    complete the chapter, you can use lists to make your Python applications more
    robust, faster, and more flexible. In fact, you''ll wonder how you ever got along
    without using lists in the past. The important thing to keep in mind is that you
    have already used most of your life. There really isn''t any difference now that
    you must think about the actions that you normally take for granted when managing
    your lists.


    # Organizing Information in an Application


    People create lists to organize information and make it easier to access and change.
    Use lists in Python for the same reason. In many situations, you really need some
    sort of organizational aid to hold data. For example, you might want to create
    a single place to look for days of the week or months of the year. The names of
    these items would appear in a list, much as you would need to commit them to the
    real world. The following sections describe lists and how they work in more detail.


    # Defining organization using lists


    The Python specification defines a list as a kind of sequence. Sequences simply
    provide some means of allowing multiple data to exist together in a single storage
    unit, but as separate entities. Think about one of large holders you see in apartment
    buildings. A single mail holder contains a number of small mailboxes, each of
    which can contain mail. Python supports other kinds of sequences as well (Chapter
    13 discusses a number of sequences):


    +   * Tuples

    * Dictionaries

    * Stacks

    * Queues

    * Deques


    Of all the sequences, lists are the easiest to understand and are the most directly
    related to a real-world object. Working with lists helps you better work with
    other kinds of sequences that provide greater functionality and improved flexibility.
    The point is that the data is stored in a list much as you would write it on a
    piece of paper — one item comes after


    ![](img/ec69aa1535cd82c735ee14abfc05048f_239_0.png)'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'another, as shown in Figure 12-1. The list has a beginning, a middle, and an
    end. As shown in the figure, the items are numbered. (Even if you might not normally
    number them in real life, Python always numbers the items for you.)


    ![](img/ec69aa1535cd82c735ee14abfc05048f_240_0.png)


    # Understanding how computers view lists


    The computer doesn’t view lists in the same way that you do. It doesn’t have an
    internal notepad and use a pen to write on it. A computer stores each item in
    a list in a separate memory location, as shown in Figure 12-2. The memory is contiguous,
    so as you add new items, they’re added to the next location in memory.


    Figure 12-2: Each item added to a list takes the next position in memory.

    | January | February | March | ... | October | November | December |


    In many respects, the computer uses something like a mailbox to hold your list.
    The list as a whole is the mail holder. As you add items, the computer places
    it in the next mailbox within the mail holder.'
