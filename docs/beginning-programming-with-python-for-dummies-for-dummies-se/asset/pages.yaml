    hides these details from you. You type code that runs on any platform that Python
    supports, and the Python applications translate code into something the platform
    can understand. However, in order for the translation to take place, you must
    have a version of Python that works on your particular platform. Python supports
    these platforms:


    +   - Advanced IBM Unix (AIX)

    - Amiga Research OS (AROS)'
