  md: '# 310 Part IV: Performing Advanced Tasks


    ![](img/ec69aa1535cd82c735ee14abfc05048f_325_0.png)


    # Considering the simple mail transfer protocol


    When you work with e-mail, you see a lot of references to Simple Mail Transfer
    Protocol (SMTP). Of course, the term rules technically correct, and what happens
    under the covers is technical, but all you really need to know is that it works.
    On the other hand, understanding SMTP a little more as a “black box” that takes
    an e-mail from the sender and spits it out at the other end to the recipient can
    be useful. Taking the term apart (reverse order), you see these elements:


    If you were to look at the rules for transferring the information, you would find
    they''re anything but simple. For example, RFC2123 is a standard for how Internet
    hosts are supposed to work (see http://www.rfc.org/rfc2123.html for details).
    These Internet rules are used by more than one Internet technology, which explains
    why most of them appear to work about the same (even though their resources and
    goals may differ).


    +   * Protocol: A standard set of rules. E-mail work by requiring rules that everyone
    agrees upon. Otherwise, e-mail would become unreliable.


    +   * Mail transfer: Documents are sent from one place to another, much as the
    post office does with real mail. In e-mail''s case, the transfer process relies
    on commands that connect your e-mail application to the SMTP server. The MAIL
    command tells the SMTP server who is sending the e-mail, while the RCPT command
    states where to send it.


    +   * Simple: States that this activity goes with the least amount of effort possible.
    The fewer parts to anything, the more reliable it becomes.


    Another, entirely different standard, RFC2821, describes how SMTP simplifies the
    rules in RFC1123 (see http://www.rfc.org/rfc2821.html for details). The point
    is, a lot of rules are written in jargon that only true geeks love (and geeks
    understand). If you want a plain-English explanation of how e-mail works, check
    out the article at http://computer.howstuffworks.com/e-messaging.html. Page 4
    of this (http://computer.howstuffworks.com/email3.html) describes the commands
    that SMTP uses to send information hit and across the Internet. In fact, if you
    want the shortest possible description of SMTP, page 4 is the right place to look.


    # Understanding What Happens

    When You Send E-mail


    E-mail has become so reliable and mundane that most people do not understand what
    it works at all. Actually, the can be said of the real mail service. When you
    think about it, the likelihood of one particular'
