  md: '# Chapter 16: Sending an E-Mail


    Message: Contains the information that you want the recipient to see. This information
    can include the following:


    +   - **From**: The human-readable form of the sender.

    - **To**: The human-readable form of the recipients.

    - **CC**: Visible recipients who also received the message, even though they aren''t
    the primary targets of the message.

    - **Subject**: The purpose of the message.

    - **Documents**: One or more documents, including the text message that appears
    with the e-mail.


    E-mails can actually become quite complex and length. Depending on the kind of
    e-mail that is sent, a message could include all sorts of additional information.
    most e-mails contain these simple components, and this is all the information
    you need to send an e-mail from your application. The following sections describe
    the process used to generate a letter and its components in more detail.


    # Defining the message


    Sending an envelope to someone who will work, but it isn''t very exciting. In
    order to make your e-mail message worthy, you need to define a message. Python
    has sorts of methods of creating messages. However, the easiest and most reliable
    way to create a message is to use the Multipurpose Internet Mail Extensions (MIME)
    functionality that Python provides (and no, a MIME is not a silent person with
    white gloves who acts out in public).


    With as many features, MIME is standardized, so it works no matter what platform
    you use. There are also numerous forms of MIME that are part of the email_mime
    module described at https://docs.python.org/3/library/email.mime.html. Here are
    the forms that you need to consider most often when working with e-mail:


    +   - **MIMEApplication**: Provides a method for sending and receiving application
    input and output

    - **MIMEAudio**: Contains an audio file

    - **MIMEImage**: Contains an image file

    - **MIMultipart**: Allows a single message to contain multiple subparts, such
    as both text and graphics in a single message

    - **MIMEText**: Contains text data that can be in ASCII, HTML, or another standardized
    format'
