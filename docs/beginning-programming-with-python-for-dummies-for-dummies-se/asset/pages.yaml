    by performing certain tasks, such as adding the IDLE to the machine''s path information
    during installation. Even so, you need to know how to access the installation,
    which the following sections describe.


    # Using Windows


    A Windows installation creates a new folder in the Start menu that contains your
    Python installation. You can access it by choosing Start->All Programs->Python
    3.3. The two items in the folder when creating new applications are IDLE (Python
    GUI) and Python (command line).


