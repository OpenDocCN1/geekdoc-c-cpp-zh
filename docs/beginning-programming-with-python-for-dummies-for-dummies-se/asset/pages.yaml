  md: '# 74 Part I: Getting Started with Python


    # Adding Comments


    People create notes for themselves all the time. When you need to buy groceries,
    you look through the cabinets, determine what you need, and write it down on a
    list. When you go to the store, you review your list to remember what you need.
    Using notes comes in handy for all sorts of needs, such as tracking the course
    of a conversation between business partners or remembering the essential points
    of a lecture. Humans need notes to jog their memories. Comments in source code
    are just another form of note. You add them to the code so that you can remember
    what the code performs later.


    # Understanding comments


    Computers need some special way to determine that the text you''re writing is
    a comment, not code to execute. Python provides two methods of defining text as
    a comment and not code. The first method is the single-line comment. It uses the
    number sign (#), like this:


    ```

    # This is a comment.

    print("Hello from Python!") #This is also a comment.

    ```


    A single-line comment can appear on only one line or it can appear after executable
    code. It appears on only one line. You typically use a single-line comment for
    short descriptive text, such as an explanation of a particular bit of code.


    When you need to create a longer comment, you use a multiline comment. A multiline
    comment starts and ends with double quotes (""""), like this:


    ```

    """"

    Application: Comments.py

    Written by: John

    Purpose: Shows how to use comments.

    """"

    ```


    Everything between the two sets of double quotes is considered a comment. You
    typically use multiline comments for longer explanations of who created an application,
    why it was created, and what tasks it performs. Of course, there aren''t any hard
    rules on precisely how you use comments. The main goal is to tell the computer
    precisely what is and isn''t a comment so that it doesn''t become confused.'
  merge: -1
