  md: "# Using Nested Decision Statements\n\nThe decision-making process often happens\
    \ in levels. For example, when you go to the restaurant and choose eggs for breakfast,\
    \ you have made a first-level decision. Now the server asks what type of toast\
    \ you want with your eggs. The server wouldn't ask this question if you had ordered\
    \ pancakes, so the selection of toast becomes a second-level decision. When the\
    \ breakfast arrives, you decide whether to use jelly on your toast. This is a\
    \ third-level decision. If you had selected a kind of toast that doesn't work\
    \ with jelly, you might not have had to make this decision at all. The process\
    \ of making decisions in levels, with each level made at the previous level, is\
    \ called nesting. Developers often use nesting techniques that can make complex\
    \ decisions based on various inputs. The following sections describe several kinds\
    \ of nesting you can use within Python to make complex decisions.\n\n# Using multiple\
    \ if or if...else statements\n\nThe commonly used multiple selection technique\
    \ is a combination of if and...else statements. This form of selection is often\
    \ called a selection tree because of its resemblance to the branches of a tree.\
    \ In this case, you follow a particular path to obtain a desired result. The example\
    \ in this section also appears with the downloadable source code as `MultipleElse.py.\n\
    \n+   1. Open a Python file window.\n2. Type the following code into the window\
