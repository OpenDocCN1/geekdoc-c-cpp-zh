    # Creating and Using Functions


    To manage information properly, you need to organize the tools used to perform
    the required tasks. Each line of code that you create performs a specific task,
    and you combine these lines of code to achieve a desired result. Sometimes you
    need to repeat the instructions with different data, and in cases your code becomes
    so large that it''s hard to keep track of what each part does. Functions serve
    as organization tools that keep your code neat and tidy. In addition, functions
    make it easy to reuse the instructions you created as needed with different data.
    This section of the chapter tells you all about functions. More important, in
    this section you start creating your first serious applications in the same way
    that professional developers do.


    # Viewing functions as code packages


    You go to your closet, open the door, and everything spills out. In fact, it''s
    an avalanche, and you''re lucky that you survived. That bowling ball in the top
    shelf could have done severe damage! However, you''re armed with storage boxes
    and you have everything in the closet in neatly organized boxes. The shoes go
    in one box, another, and old cards and lets in another. After you''re done, you
    can find anything you want in the closet without fear of injury. Functions are
    just like that—they messy code and place it in packages that make it easy to see
    what you have and understand how it works.


    > Commentaries about just what functions are and why they''re necessary, but when
    you pull down all that, it comes down to a single idea: Functions provide a means
    of packaging code to make it easy to find and access. If you think of functions
    as organizers, you find that working with them is much easier. For example, you
    can avoid the problem that many developers have of stuffing items in a function.
    All your functions will have a single purpose, just like those storage boxes in
    the closet.


