  md: '# Chapter 11


    # Working with Strings


    In This Chapter


    +   - Considering the string difference

    - Using special characters in strings

    - Working with single characters

    - Performing string-specific tasks

    - Finding what you need in a string

    - Modifying the appearance of string output


    > our computer doesn''t understand strings. It''s a basic fact. Computers understand
    numbers, not letters. When you see a string on the computer screen, the computer
    actually sees a series of numbers. However, humans understand strings quite well,
    so applications need to be able to work with them. Fortunately, Python makes working
    with strings relatively easy. It translates the string you understand into the
    numbers computer understands, and vice versa.


    In order to make strings useful, you need to be able to manipulate them. Of course,
    that means taking strings apart and just using the pieces you need or searching
    the string for specific information. This chapter describes how you can build
    strings using Python, dissect them as needed, and use the parts you find after
    you know what''s required. String manipulation is an important part of applications
    because humans depend on computers performing that sort of them (even though the
    computer has no idea of what a string is).


    After you have the string you want, you need to present it to the user in an pleasing
    manner. The computer doesn''t really care how it presents the string, so often
    you get the information, but it lacks pizzazz. In fact, it may be downright difficult
    to read. Knowing how to format strings so that they look nice onscreen is important
    because users need to see information in a form they understand. By the time you
    complete this chapter, you know how to create, manipulate, and format strings
    so that the user sees precisely the right information.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 206 Part III: Performing Common Tasks


    # Understanding That Strings Are Different


    Most aspiring developers (and even a few who have written code for a long time)
    have a hard time understanding that computers truly do only understand up of 0s
    and 1s. Larger numbers are numeric values. Comparisons take place with 0s and
    1s. Data is moved using 0s and 1s. In short, strings don''t exist for the computer
    (and numbers just barely exist). Although grouping 0s and 1s to make numbers is
    relatively easy, strings are a lot harder because you''re talking about information
    that the computer must manipulate as numbers but before characters.


    There are no strings in computer science. Strings are made of characters, and
    individual characters are actually characters. When you work with strings in Python,
    what you''re really doing is creating an assembly of characters that the computer
    sees as numeric values. That''s why the following sections are so important. They
    help you understand why strings are special. Understanding this material will
    save you a lot of headaches.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_221_0.png)


    # Defining a character using numbers


    To create a character, you must first define a relationship between that character
    and a number. More important, everyone must agree that when a number appears in
    an application and is viewed as a character by that application, the number is
    translated into a specific character. One of the most common ways to perform this
    task is to use the American Standard Code for Information (ASCII). Python uses
    ASCII to translate the number 65 to the letter A. The chart at http://www.ascitable.com/
    shows the numeric values and their character equivalents.


    Every character you use has a different numeric value assigned to it. The letter
    A uses a value of 65. To create a lowercase a, you must assign a different number,
    which is 97. The computer views A and a as completely different characters, even
    though people view them as uppercase and lowercase versions of the same character.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_221_1.png)


    The numeric values used in this chapter are in decimal. However, the computer
    views them as 0s and 1s. For example, the letter A is really the value 01000001
    and the letter a is really the value 01100001. When you see an A onscreen, the
    computer sees a binary value instead.'
