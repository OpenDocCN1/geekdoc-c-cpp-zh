    A bitwise operator would interact with each bit within a number specific way.
    When working with a logical bitwise operator, a value of 0 counts as false and
    a value of 1 counts as true. Table 6-5 describes the bitwise operators.


    | Operator | Description | Example |

    |---|---|--|

    | & (And) | Determines whether both individual bits within two operators are true
    and sets the resulting bit to true when they are. | 0b1100 & 0b0110 = 0b0100 |

    | | (Or) | Determines whether either of the individual bits within two operators
    is true and sets the resulting bit to true when one of them. | 0b1100 | 0b0110
    = 0b1110 |

    | ^ (Exclusive) | Determines just one of the individual bits within two operators
    is true and sets the resulting bit to true when one is. When both bits are true
    or both are false, the result is false. | 0b1100 ^ 0b0110 = 0b1010 |

    | - (One''s complement) | Calculates the one''s complement value of a number.
    | -0b1100 = -0b0011 |

    | << (Left shift) | Shifts the bits in the left operand by the value of the right
    operand. New bits are set to 0 and all bits that flow off the end are lost. |
    0b1110011 << 2 = 0b1001100 |

    | >> (Right shift) | Shifts the bits in the left operand right by the value of
    the right operand. New bits are set to 0 and all bits that flow off the end are
    lost. | 0b11100111 >> 2 = 0b00111001 |'
