  md: '# # Chapter 3


    # # Interacting with Python


    +   ### In This Chapter

    * Accessing the command line

    * Using commands to perform tasks

    * Obtaining help about Python

    * Ending a command-line session


    Ultimately, any application you create interacts with the computer and the data
    it contains. The focus is on data because without data, there isn''t a good reason
    to have an application. Any application you use (even as simple as Solitaire)
    manipulates data in some way. In fact, the acronym CRUD sums up what most applications
    do:


    +   * Create

    * Read

    * Update

    * Delete


    If you remember CRUD, you''ll be able to summarize what most applications really
    are with your data computer contains (and some applications really crude). However,
    before your application accesses the computer, you will have to interact with
    a programming language that creates a list of tasks to perform in a language the
    computer understands. That''s the purpose of this chapter. You begin interacting
    with Python. Python takes the list of steps you want to perform on the computer''s
    data and changes those steps into bits the computer understands.'
