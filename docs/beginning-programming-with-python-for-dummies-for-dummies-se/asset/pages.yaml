  md: "# Chapter 14: Creating and Using Classes\n\n# Working with methods\n\nMethods\
    \ are simply another kind of function that resides in classes. You create and\
    \ work with methods in precisely the same way that you do functions, except that\
    \ methods are always associated with a class (you don't free-standing methods\
    \ as you do functions). You can create two kinds of methods: those associated\
    \ with the class itself and those associated with an instance of a class. It is\
    \ important to differentiate between the two. The following sections provide the\
    \ details needed to work with both.\n\n# Creating class methods\n\nA class method\
    \ is one that you execute directly from the class without creating an instance\
    \ of the class. Sometimes you need to create methods that execute from the class,\
    \ such as the functions you used with the str class in order to modify strings.\
    \ As an example, the MultipleException4.py in Chapter 9 uses the str.upper() function.\
    \ The following steps demonstrate how to create and use a class method.\n\n+ \
    \  1. Open a Python Shell window.\n\nYou see the familiar Python prompt.\n\n+\
    \   2. Type the following code (pressing Enter after each line and pressing Enter\
    \ once the last line):\n\n```\nclass MyClass:\n    def SayHello():\n        print(\"\
    Hello there!\")\n```\n\nThe example class contains a single defined attribute,\
    \ SayHello(). This method doesn't accept any arguments and doesn't return any\
    \ value. It simply prints a message as output. However, the method works just\
    \ for demonstration purposes.\n\n+   3. Type MyClass.SayHello() and press Enter.\n\
    \nThe example outputs the expected string, as shown in Figure 14-5. Notice that\
    \ you didn't need to create an instance of the class — the method is immediately\
    \ available for use.\n\n+   4. Close the Python Shell window."
