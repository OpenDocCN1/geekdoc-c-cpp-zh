  md: 'Your choice of techniques for performing comparisons affects the manner in
    which Python views the data and determines the sorts of things you can do to manage
    the data after the comparison is made. All this functionality might seem absurdly
    complex at the moment, but the important point to remember is that applications
    require comparisons in order to interact with data correctly.


    # # Understanding computers make comparisons


    Computers don''t understand packaging, such as functions, or any of the other
    structures that you create with Python. All this packaging is for your benefit,
    not the computer''s. However, computers do directly support the concept of operators.
    Most Python operators have a direct corollary with a command that the computer
    understands. For example, when you ask whether one number is greater than another
    number, the computer can actually perform this computation, using an operator.
    (The upcoming section explains operators in detail.)


    ![](img/ec69aa1535cd82c735ee14abfc05048f_110_0.png)


    Some comparisons aren''t direct. Computers work only with numbers. When you ask
    Python to compare two strings, Python actually does compare the numeric value
    of each character in the string. For example, the letter *A* is the actual 65
    in the computer. A lowercase *a* has a different numeric value —97. As a result,
    even though you might see ABC as equal to abc, the computer does not agree — it
    sees them as different because the numeric values of their individuals are different
    letters.


    # # Working with Operators


    Operators are the basis for both control and management of data within applications.
    You use operators to define how one piece of data is compared to another and to
    modify the information within a single variable. In fact, operators are essential
    to performing any of math-related task and to assigning data to variables in the
    first place.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_110_1.png)


    When using an operator, that variable must supply either a variable or an expression.
    You already know that an expression is a kind of storage box used to hold data.
    An expression is an equation or formula that provides a description of a mathematical
    concept. In most cases, the result of evaluating an expression is a Boolean (true
    or false) value. The following sections describe operators in detail because you
    use them everywhere throughout the rest of the book.'
