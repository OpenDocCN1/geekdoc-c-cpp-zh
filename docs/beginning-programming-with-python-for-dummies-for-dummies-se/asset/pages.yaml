    # # Extending Classes to Make New Classes


    As you might imagine, creating a fully functional, production-grade class (one
    that is used in a real-world application actually running on a system that is
    accessed by users) is time consuming because real classes perform a lot of tasks.
    Fortunately, Python supports a feature called inheritance. By using inheritance
    you can obtain the features from a parent class when creating a child class. Overriding
    the features you don''t need and adding new features lets you create new classes
    relatively fast and with less effort on your parent. In addition, because the
    parent code is already tested, you don''t have to put quite much effort into ensuring
    that your new class works as expected. The following sections show how to build
    and use classes that inherit from each other.


    # ## Building the child class


    Parent classes are normally supersets of something. For example, you might create
    a parent class named Car and then create child classes of various car around it.
    In this case, you build a parent class named Animal and use it to define a child
    class named Chicken. Of course, you can easily add other child classes after you
    have Animal in place, such as a parent and one child class, however, for this
    example, you build just the parent and one child class, as shown in Listing 14-2.
    This example also appears with the downloadable source code as Animals.py.'
