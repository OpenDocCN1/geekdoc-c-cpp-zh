  md: "# Working with deques\n\nA deque is simply a queue where you can remove and\
    \ add items from either end. In many languages, a queue or stack starts out as\
    \ a deque. Specialized code serves to limit deque functionality to what is needed\
    \ to perform a particular task.\n\nWhen working with a deque, you need to think\
    \ of the deque as a sort of horizontal line. Certain individual functions work\
    \ with the left and right ends of the deque so that you can add and remove items\
    \ from either side. The following steps help you create an example that demonstrates\
    \ deque usage. This example also appears with the downloadable source code as\
    \ DequeData.py.\n\n+   1. Open a Python file window.\n\nYou see an editor in which\
    \ you can type the example code.\n\n+   2. Type the following code into the window\
    \ — pressing Enter each line.\n\n```\nimport collections\nMyDeque = collections.deque(\"\
    abcdef\", 10)\n\nprint(\"Starting state:\")\nfor Item in MyDeque:\n    print(Item,\
    \ end=\"\")\n\nprint(\"\\r\\nappending and extending right\")\nMyDeque.append(\"\
    h\")\nMyDeque.extend(\"ij\")\nfor Item in MyDeque:\n    print(Item, end=\"\")\n\
    print(\"\\r\\nMyDeque contains {0} items.\")\n    format(len(MyDeque))\n\nprint(\"\
    \\r\\nPopping right\")\nprint(\"{0}\".format(MyDeque.pop()))\nfor Item in MyDeque:\n\
    \    print(Item, end=\"\")\n\nprint(\"\\r\\nappending and extending left\")\n\
    MyDeque.appendleft(\"a\")\nMyDeque.extendleft(\"bc\")\nfor Item in MyDeque:\n\
    \    print(Item, end=\"\")\nprint(\"\\r\\nMyDeque contains {0} items.\")\n   \
    \ format(len(MyDeque)))\n```"
