  md: '# 40 Part I: Getting Started with Python


    # Understanding the importance of the README file


    Many applications include a README file. The README file usually provides updated
    information that didn''t make it into the documentation before the application
    was put into production status. Unfortunately, most people ignore the README file
    and some don''t even know it exists. As a result, people who know something about
    their shiny new product find out. When you have a README.txt file in the \python3
    directory. When you open this file, you will find all sorts of interesting information:


    +   - How to build a copy of Python for Linux systems

    - Where to find out about new features in the version of Python

    - Where to find the latest version of the Python documentation

    - How to convert your older Python applications to work with Python 3.3.x


    +   - What you need to do to test Python modifications

    - How to install multiple versions of Python on the same system

    - How to access bug and issue tracking for Python

    - How to request updates to Python

    - How to find out when the next version of Python will come out


    Opening and reading the README file will help you become a Python genius. People
    will be amazed that you really know something about Python and will ask all sorts
    of questions (deferring to your wisdom). Of course, you could always just sit
    there, thinking that the README is just too much effort to read.


    # Opening the Command Line


    Python offers a number of ways to interact with the underlying language. For example,
    you worked a bit with the Integrated DeVelP Environment (IDLE) in Chapter 2. IDLE
    makes it easy to develop full-fledged applications. However, you simply want to
    experiment or run to an existing application. Often, using the command-line version
    of Python works better in these cases because it offers better control over the
    Python environment through command-line switches, uses fewer resources, and relies
    on a minimalistic interface so you can focus on typing code rather than playing
    with a GUI.'
