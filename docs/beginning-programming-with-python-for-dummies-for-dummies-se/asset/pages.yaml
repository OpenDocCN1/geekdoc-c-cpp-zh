- img_proc: true
  md: '# 226 Part III: Performing Common Tasks


    Just as the mailboxes are numbered in a mail holder, the memory slots used for
    a list are numbered. The numbers begin with 0, not with 1 as you expect. Each
    mailbox receives the next number in line. A mail holder with the months of the
    year would contain 12 mailboxes. The mailboxes would be numbered from 0 to 11
    (not 12, as you might think). It''s essential to get the numbering scheme as quickly
    as possible because even experienced developers get into trouble using 1 and 0
    as a starting point at time.


    Depending on what sort of information you place in each mailbox, the boxes need
    not be of the same size. Python lets you store a string in one mailbox, an integer
    in another, and a floating-point value in another. The computer doesn''t know
    what kind of information is stored in each mailbox and it doesn''t care. All the
    computer sees one list of numbers that could be anything. Python performs all
    the work required to treat the data elements according to the right type and ensure
    that you request item, you actually get item.


    In general, it''s good practice to create lists of items to make the data easier
    to manage. When creating a list of all integers, rather than mixed data, you can
    make assumptions about the information and don''t have to spend so much time checking
    it. However, in some situations, you might need to mix data. Many other programming
    languages require that lists have just one type of data, but Python offers the
    flexibility of using mixed data sorts. Just remember that using data in a list
    means you must determine the data type when retrieving the information in order
    to work with the data correctly. Treating a string as an integer would cause problems
    in your application.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_241_0.png)


    ![](img/ec69aa1535cd82c735ee14abfc05048f_241_1.png)


    # Creating Lists


    As in real life, before you can do anything with a list, you must create it. As
    previously stated, Python lists can mix types. However, it''s always a best practice
    to restrict a list to a single type when you can. The following steps demonstrate
    how to create Python lists.


    +   1. Open a Python Shell window.


    You see the Python prompt.


    +   2. Type List1 =["One", 1, "Two", True] and press Enter.


    Python creates a list List1 for you. This list contains string values (One and
    Two), an integer value (1), and a Boolean value (True). Of course, you can''t
    actually see anything because Python processes the command without saying anything.'
