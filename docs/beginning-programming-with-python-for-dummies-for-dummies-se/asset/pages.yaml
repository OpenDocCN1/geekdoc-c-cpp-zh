  md: '# Loading and Running Existing Applications


    Running your application immediately after you write it is fun and interesting,
    but at some point you''ll close IDLE and be left with a file on your disk. The
    file contains your application, but you need to know how to use that file to execute
    it. Python actually provides a considerable number of ways to achieve this task.
    The following sections describe three of these approaches.


    # Using the command line or terminal window


    The command line, or terminal window, provides the means to execute commands by
    typing them in. You can also create batch files of a batch process. In this case,
    you''re looking at the native command environment provided by the platform you''re
    using, rather than the specialized Python command line. When working in this environment,
    you type commands to start Python and perform specific tasks. For example, if
    you want to execute FirstApp() you type `python FirstApp.py` and press Enter.
    Figure 4-24 shows typical results. You can execute any other application this
    way.


    Figure 4-24: It''s possible to execute an application directly at the command
    line.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_93_0.png)'
