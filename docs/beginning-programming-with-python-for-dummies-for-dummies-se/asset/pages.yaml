    # # Defining the parts of the letter


    The "envelope" for an e-mail address uses the SMTP server to route the e-mail.
    However, the envelope doesn''t include any content—that''s the purpose of the
    letter. A lot of developers get the elements confused because the letter contains
    sender and receiver information as well. This information appears in the letter
    just like the information that appears in a business letter—it''s for the benefit
    of the viewer. When you send a business letter, the postal delivery person doesn''t
    open the envelope to see the information inside. Only the information on the envelope
    matters.


    It''s because the information in the e-letter is separate from information in
    the envelope that nefarious individuals can spoof e-mail addresses. The envelope
    potentially contains legitimate sender information, but the letter may not. (When
    you see the e-mail in your e-mail application, all that is present in the letter,
    not the envelope—the envelope has been stripped away by the e-mail application.)
    For that matter, neither the sender nor the recipient information may be correct
    in the letter that you see onscreen in your e-mail reader.


    The letter of an e-mail is actually made of separate components, just as the envelope
    is. Here is a summary of the three components:


    +   * **Sender**: The sender information tells you who sent the message. It contains
    just the e-mail address of the sender.

    * **Receiver**: The receiver information tells you who will receive the message.
    This is actually a list of recipient e-mail addresses. Even if you want to send
    the message to only one person, you must supply the single e-mail address in a
    list.'
