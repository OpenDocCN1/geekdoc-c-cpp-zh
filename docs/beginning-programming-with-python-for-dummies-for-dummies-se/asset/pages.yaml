  md: '# Chapter 20: Ten Libraries You Need to Know About 361


    # Classifying Python sound technologies


    It''s important to realize that sound comes in many forms in computers. The basic
    multimedia provided by Python (the documentation at https://docs.python.org/3/library.html)
    provide playback functionality. You can also write certain types of audio files,
    but the selection of format is limited. In addition, some modules, such as winsound
    (https://python.org/3/library/), are platform-dependent, so you can''t use them
    in an application designed to work everywhere. The standard Python offerings are
    designed to provide basic multimedia support for playing system sounds.


    can see a list of these libraries at https://wiki.python.org/main/Audio. However,
    these libraries usually focus on needs, such as recording notes and playing back
    later. Hi-fidelity output isn''t part of the plan for these libraries.


    Gamers need audio support to ensure that they can hear special effects, such as
    a monster walking behind them. These are addressed by libraries such as PyGame
    (http://www.pygame.org/news.html). When using these libraries, you need higher-end
    equipment and have to spend considerable time working on the audio features of
    your application. You can see a list of these libraries at https://wiki.python.org/main/PyGameLibraries.


    The middle ground, augmented audio function designed to improve application usability,
    is covered by libraries such as PyAudio.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_376_0.png)


    Working with sound on a computer always involves trade-offs. For example, a platform-independent
    library can''t take advantage of special features that a particular platform might
    possess. In addition, it might not support all the files that a particular platform
    uses. The reason to use a platform-independent library is to ensure that your
    application provides basic sound support on all systems that it interacts with.


    # Manipulating Images Using PyQtGraph


    Humans are visually oriented. If you show someone a list of information and then
    show the same information as a graph, the graph is always the winner when it comes
    to conveying information. Graphs help people see trends and why the data has taken
    the course that it has. However, getting those pixels to represent the tabular
    information onscreen is difficult, which is why you need a library such as PyQtGraph
    (http://www.pyqtgraph.org/) to make things simpler.'
