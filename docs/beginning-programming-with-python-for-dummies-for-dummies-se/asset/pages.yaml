    # Working in QA


    A lot of organizations have separate Quality Assurance (QA) departments that check
    applications to ensure that they work as advertised. Many different script languages
    are on the market, but Python makes an excellent language in this regard because
    it''s incredibly flexible. In addition, you can use this single language in multiple
    environments—both on the client and on the server. The reach of Python means that
    you can learn a single language and use it for testing anywhere you need to test
    something, and in any environment.


    In this scenario, the developer usually knows another language, such as C++, and
    uses Python to test the applications written in C++. However, the QA person doesn''t
    need to know another language in all cases. In some situations, blind testing
    might be used to confirm that an application behaves in a practical manner or
    as a means for checking the functionality of an external service provider. You
    need to check with the organization you want to work with as to the qualifications
    required for a job from a language perspective.


