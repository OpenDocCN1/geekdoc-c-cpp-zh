    # Nested exception handling


    Sometimes you need to place one exception-handling routine within a process called
    nesting. When you nest exception-handling routines, Python tries to find an exception
    handler in the nested level first and then moves to the outer layers. You can
    nest exception-handling routines as deeply as needed to make your code safe.


    One of the more common reasons to use a dual layer of exception-handling code
    is when you need to obtain input from a user and need to place the input code
    in a loop to ensure that you actually get the required information. The following
    steps demonstrate how this sort of code might work. This example also appears
    with the downloadable source code as MultipleException4.py.


    +   1. Open a Python File window.


    You see an editor in which you can type the example code.'
