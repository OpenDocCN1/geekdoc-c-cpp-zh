  md: '# 304 Part IV: Performing Advanced Tasks


    In most applications, you can further break down the second step of modifying
    the in-memory presentation of the data. An application can provide some or all
    of these features as part of the modification process:


    +   - Provide an onscreen presentation of the data.

    - Allow additions to the data list.

    - Allow deletions from the data list.

    - Make changes to existing data, which can actually be implemented by adding a
    new record with the changed data and deleting the old record.


    So far in this chapter, you have performed all but one of the activities in these
    two lists. You have already read file content and written file content. In the
    modification, you added data to a list and presented the data onscreen. The only
    interesting activity that you haven''t performed is deleting data from a list.
    Modification of data is often performed as a two-part process of creating a new
    record that starts with the data from the old record and deleting the old record
    after the new record is in place in the list.


    Don''t get in a rut by thinking that you must perform every activity envisioned
    in this section for every application. A monitoring program would need to display
    the data onscreen, doing so might be harmful (or at least inconvenient). A logger
    only creates new entries — it never deletes or modifies them. An e-mail application
    usually allows the addition of new records and deletion of old records, but not
    modification of existing records. On the other hand, a word processor implements
    all the features mentioned. What you implement and how you implement it depends
    solely on the kind of application you create.


    Separating the user interface from the activities that go on behind the user interface
    is important. To keep things simple, this example focuses on what needs to go
    on behind the user interface to make updates to the file created in the "Creating
    a File" section, earlier in this chapter. The following steps demonstrate how
    to read, modify, and write a file in order to update it. It consists of an addition,
    a deletion, and a change. To allow you to run the application more than once,
    the updates are actually sent to another file. This example also appears in the
    downloadable source code as FormData.py and UpdateCSV.py.


    +   1. Open a Python File window.


    You will see an editor window in which you can type the example code:


    +   2. Type the following code into the window — pressing Enter each line:


    ```

    from FormattedData import FormatData

    import os.path

    ```


