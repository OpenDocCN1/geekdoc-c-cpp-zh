  md: '# Chapter 6: Managing Information


    The input () function always outputs a string. Even if a user types a number,
    the output from the input () function is a string. This means that if you are
    expecting a number, you need to convert it after receiving the input. The input
    () function also lets you provide a string prompt. This prompt is displayed to
    tell the user what to provide in the way of information.


    Input01.py file contains an example of using the input () function in a simple
    way. Here''s the code for that example:


    ```

    Name = input("Tell me your name: ")

    ```


    In this case, the input () function asks the user for a name. After the user types
    a name and presses Enter, the example outputs a customized greeting to the user.
    Try running this example at the command prompt or by the Python Shell. Figure
    6-1 shows typical results when you input John as username.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_130_0.png)


    Figure 6-11: Provide a username and see a greeting as output.


    You can use input () for other kinds of data; all you need is the correct version
    function. For example, the code in the Input02.py file provides one technique
    for performing such a conversion, as shown here:


    ```

    ANumber = float(input("Type a number: "))

    print("You typed: ", ANumber)

    ```


    When you run this example, the application asks for a numeric input. The call
    to float () converts the input to a number. After the conversion, print () outputs
    the result. When you run the example using a value such as 5.5, it obtains the
    desired result.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_130_1.png)'
