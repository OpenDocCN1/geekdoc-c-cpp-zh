  md: '# Chapter 20: Ten Libraries You Need to Know About 359


    The most common type of database is called a Relational Data Management System
    (RDBMS), which uses tables that are organized into records and fields (like a
    table you might draw on a sheet of paper). Each field is part of a column of the
    same kind of information, such as the customer''s name. Tables are related to
    each other in various ways, so creating complex relationships is possible. For
    example, each customer may have one or more entries in a purchase order table,
    and the customer table and the purchase order table are related to each other.


    An RDBMS relies on a special language called the Structured Query Language (SQL)
    to access the individual records. Of course, you need some means of interacting
    with the RDBMS and SQL, where is SQLAlchemy (http://www.sqlalchemy.org/) comes
    into play. This product reduces the amount of work needed to ask the database
    to perform tasks such as returning a customer record, creating a new customer
    record, updating an existing record, and deleting an old customer record.


    # Seeing the World Using Google Maps


    Geocoding (the finding of geographic coordinates, such as longitude and latitude
    from geographic data, such as address) has lots uses in the world today. People
    use the information to do everything from finding a good restaurant to locating
    a hiker in the mountains. Getting from one place to another often reveals around
    geocoding today as well. Google Maps (https://ypi.python.org/pypi/googlemaps/)
    lets you direct yours to your applications.


    In addition to getting from one point to another or finding a lost soul in the
    desert, Google Maps can also help in Geographic Information System (GIS) applications.
    "Helping People Decide on Location" section of Chapter 18 describes this particular
    technology in more detail, but essentially, GIS is about deciding on a location
    for something or why one location works better than another location for a particular
    task. In short, Google Maps presents your application with a look at the outside
    world that it can help you use.


