    # Entering an Interactive Environment Using IPython


    The Python shell works fine for many interactive tasks. You''ve used extensively
    in this book. However, you may have already noted that the default shell has certain
    deficiencies (and if you haven''t, you''ll notice them as you work through more
    advanced examples). Of course, the biggest deficiency is that Python is a pure
    text environment in which you must type commands to perform any given task. A
    more advanced shell, such as IPython (http://ipython.org/), can make the interactive
    environment friendlier by providing GUI features so you don''t have to remember
    the syntax for odd commands.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_369_0.png)


    IPython is actually more than just a simple shell. It provides an environment
    in which you can interact with Python in new ways, such as displaying graphics
    that show the result of formulas you create using IPython. In addition, IPython
    is designed as a kind of front end that can accommodate other languages. The IPython
    application actually sends commands to the real shell in the background, so you
    can use shells from other languages such as Julia and Haskell. (Don''t worry you''ve
    never heard of these languages.)


    One of the most exciting features of IPython is the ability to work in parallel
    computing environments. Normally a shell is single threaded, which means that
    you can''t perform any sort of parallel computing. In fact, you can''t even create
    a multithreaded environment. This feature alone makes IPython worth of trial.


