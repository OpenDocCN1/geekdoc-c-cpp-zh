    # Complex numbers


    You may or may not remember complex numbers from school. A complex number consists
    of a real number and an imaginary number that are paired together. In case you''ve
    completely forgotten about complex numbers, you can read about them at http://www.mathisfun.com/numbers/complex-numbers.html.
    Real-world uses for complex numbers include:


    +   - Electrical engineering

    - Fluid dynamics

    - Quantum mechanics

    - Dynamic mechanics


    Complex numbers have other uses, too, but this list should give you some ideas.
    In general, if you''re not involved in any of these disciplines, you''ll never
    encounter complex numbers. However, Python is one of the few languages that provides
    a built-in type to support them. As you progress through the book, you find other
    ways in which Python lends itself especially to science and engineering.


    The imaginary part of a complex number always appears with a j after it. So, if
    you want to create a complex number with 3 as the real part and 4 as the imaginary
    part, you make an assignment like this:


    ```

    myComplex = 3 + 4j

    ```


    If you want to see the real part of the variable, you simply type myComplex real
    at the Python prompt and press Enter. Likewise, if you want to see the imaginary
    part of the variable, you type myComplex.imag at the Python prompt and press Enter.'
