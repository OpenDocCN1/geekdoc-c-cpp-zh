    Database is essentially an organized manager of storing repetitive or structured
    data on disk. For example, customer records (individual entries in the database)
    are repetitive because each customer has the same sort of information requirements,
    such as name, address, and phone number. The precise organization of the data
    determines the sort of database that you''re using. Database products specialize
    in text organization, others in tabular information, and still in random bits
    of data (such as readings from a scientific instrument). Databases can use a tree-like
    structure or a flat-file configuration to store data. You''ll hear all sorts of
    odd terms when you start looking into Database Management System (DBMS) technology
    — most of which mean something only to a Database Administrator (DBA) and won''t
    matter to you.'
