    ![](img/ec69aa1535cd82c735ee14abfc05048f_84_0.png)


    Figure 4-13: A complete application can be quite short.


    # Saving the file


    You could run the application now if you wanted to. However, saving your application
    before you run it is always a good idea. That way, if you make a mistake that
    causes Python or the system to freeze for some reason, your application code is
    still safe. Saving the application makes it easier to go back to determine what
    went wrong, make corrections, and try running the application again.


    Choose File:Save to display the Save As dialog box, shown in Figure 4-14. The
    Edit window automatically chooses the Python33 folder to save your application
    in. However, this is where the Python code resides, and saving your application
    code in the same folder is a bad idea.


    The example code for this book is contained in a folder named BP4D (Beginning
    Python For Dummies). The code for this chapter is found in the \BP4D\Chapter4
