  md: "# Chapter 9: Dealing with Errors\n\nThe example in this section shows a quick\
    \ method for creating your own exceptions. To perform this task, you must create\
    \ a class that uses an exception as a starting point. To make things a little\
    \ easier, this example creates an exception that builds upon the functionality\
    \ provided by the ValueError exception. The advantage of this approach rather\
    \ than the one shown in the \"Passing error information to the caller\" section,\
    \ the preceding section in this chapter, is that this approach tells anyone precisely\
    \ what the ValueError exception is; additionally, it makes the modified source\
    \ exception easier to use. This example also appears with the downloadable source\
    \ code as CustomException.py.\n\n+   1. Open a Python file window.\n\nYou see\
    \ an editor in which you can type the code.\n\n+   2. Type the following code\
    \ into the window — Press after each line:\n\n```\nclass CustomValueError(ValueError):\n\
    \    def __init__(self, arg):\n        self.strerror = arg\n        self.args\
    \ = {arg}\n\ntry:\n    raise CustomValueError(\"Value must be within 1 and 10.\"\
    )\nexcept CustomValueError as e:\n    print(\"CustomValueError Exception!\", e.strerror)\n\
    ```\n\nThis example essentially replicates the functionality of the example in\
    \ the \"Passing error information to the caller\" section of the chapter. However,\
    \ it places the same error in both strerror and args so that the developer has\
    \ access to either (as would normally).\n\nThe code begins by creating the CustomValueError\
    \ class that uses the ValueError exception class as a starting point. The __init__()\
    \ function provides the means for creating a new instance of that class. Think\
    \ of the class as a blueprint and the instance built from the blueprint.\n\nNotice\
    \ that the strerror attribute has the value assigned directly to it, but args\
    \ receives it as an array. The args member normally contains an array of all the\
    \ exception values, so this is standard procedure, even when args contains just\
    \ one value as it does.\n\nThe code for using the exception is considerably easier\
    \ than modifying ValueError directly. All you do is call raise with the name of\
    \ the exception and the arguments you want to pass, all on one line.\n\n![](img/ec69aa1535cd82c735ee14abfc05048f_192_0.png)"
