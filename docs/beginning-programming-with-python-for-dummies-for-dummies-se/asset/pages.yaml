    Controlling execution with

    the continue statement


    Sometimes you want to check every element in a sequence, but don''t want to process
    certain elements. For example, you might need that you process all the information
    for every query in a database except brown cars. Perhaps you don''t need the information
    about that particular color of car. The break clause simply ends the loop, so
    you can''t use it in this situation. Otherwise, you won''t see the remaining elements
    in the sequence.


    The break clause alternative that many developers use the continue clause. As
    with the break clause, the continue clause appears as part of an if statement.
    However, processing continues with the next element in the sequence rather than
    ending completely.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_153_1.png)'
