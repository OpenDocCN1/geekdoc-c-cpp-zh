    # Using the finally Clause


    Normally you want to handle any exception that occurs in a way that doesn''t cause
    the application to crash. However, sometimes you can''t do anything to fix the
    problem, and the application is definitely going to crash. At this point, your
    goal is to cause the application to crash gracefully, which means closing files
    so that the user doesn''t lose data and performing other tasks of that nature.
    Anything you can do to keep damage to data and the system to a minimum is an essential
    part of handling data for a crashing application.


    The finally clause is part of the crashing-application strategy. You use this
    clause to perform any required last-minute tasks. Normally, the finally clause
    is quite short and uses only clauses that are likely to succeed without further
    problem. It''s essential to close the files, log the user off, and perform other
    required tasks, and then let the application crash before something terrible happens
    (such as a total system failure). With this necessity in mind, the following steps
    show a simple example of using the finally clause. This example also appears in
    the downloadable source code as ExceptionWithFinally.py.


    +   1. Open a Python File window.


    You see an editor in which you can type the example code.'
