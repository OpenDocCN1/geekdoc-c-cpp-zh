  md: '# Chapter 14: Creating and Using Classes


    +   **Instance variable**: Provides a storage location used by a single method
    of an instance of a class. The variable is defined within a method. Instance variables
    are considered safer than class variables because only one method of the class
    can access them. Data is passed between methods using arguments, which allows
    for controlled checks of incoming and better control over data management.


    +   **Instantiation**: Performs the act of creating an instance of a class. The
    resulting object is a unique class instance.


    +   **Method**: Defines the term used for functions that are part of a class.
    Even though function essentially define the same element, method is considered
    more specific because only classes can have methods.


    +   **Object**: Defines a unique instance of a class. The object contains all
    the methods and properties of the original class. However, the data for each object
    differs. The storage locations are unique, even if the data is the


    +   **Operator overloading**: Creates more than one version of a function that
    is associated with an operator as: +, -, /, or *, which results in different behaviors.
    The essential task of the operator may be the same, but the way in which the operator
    interacts with the data differs. Operator overloading is used to provide flexibility
    so that an operator can work with applications in various ways.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_284_0.png)


    # Considering the Parts of a Class


    A class has a specific construction. Each part of a class performs a particular
    task that gives the class useful characteristics. Of course, the class begins
    with a container that is used to hold the entire class together, so that''s the
    part that the first section that follows discusses. The remaining sections describe
    the other parts of a class and help you understand how they contribute to the
    class as a whole.


    # Creating the class definition


    A class need not be particularly complex. In fact, you can create just the container
    and one class element and call it a class. Of course, the resulting class won''t
    do much, but you can instantiate it (tell Python to build an object using your
    class as a blueprint) and work with it as you would any other class. The following
    steps help you understand the basics behind a class by creating the simplest class
    possible.'
