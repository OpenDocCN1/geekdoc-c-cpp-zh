  md: '# 232 Part III: Performing Common Tasks


    # Modifying Lists


    You can modify the content of a list as needed. Modifying a list means to change
    a particular entry, add a new entry, or remove an existing entry. To perform these
    tasks, you must sometimes read an entry. The concept of modification is found
    within the acronym CRUD, which stands for Create, Read, Update, and Delete. Here
    are the list functions associated with CRUD:


    +   * append(): Adds a new entry to the end of the list.

    * clear(): Removes all entries from the list.

    * copy(): Creates a copy of the current list and places it in a new list.

    * extend(): Adds items from one existing list and into a new list.

    * insert(): Adds a new entry to the position specified in the list.

    * pop(): Removes an entry from the end of the list.

    * remove(): Removes an entry from the specified position in the list.


    The following steps show how to perform modification with lists. This is a hands-on
    exercise. As the book progresses, you see these same functions used within application
    code. The purpose of this exercise is to help you gain a feel for how lists work.


    +   1. Open a Python Shell window.


    You see the familiar Python prompt.


    +   2. Type List1 = [] and press Enter.


    Python creates a list named List1.

    Notice that the square brackets are empty. List1 doesn''t contain any entries.
    You can create empty lists that you fill with information. Later, in fact, this
    is precisely many lists start because you usually don''t know what information
    they will contain until the user interacts with the list.


    +   3. Type len(List1) and press Enter.


    The len() outputs 0, as shown in Figure 12-10. When creating an application, you
    can check for an empty list using the len() function. If a list is empty, you
    cannot perform tasks such as removing elements because there is nothing to remove.


    +   4. Type List1.append(1) and press Enter.


