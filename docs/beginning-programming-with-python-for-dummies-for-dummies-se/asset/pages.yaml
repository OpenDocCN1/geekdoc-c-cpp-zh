  md: '# 30 Part I: Getting Started with Python


    Using the standard Linux installation

    The standard Linux installation works on any system. However, it requires you
    to work at the Terminal and type commands to complete it. Some of the actual commands
    may vary by version of Linux. The information at http://docs.python.org/install/
    provides some helpful tips that you can use in addition to the procedure that
    follows.


    +   1. Navigate to http://www.python.org/download/releases/3.3.4/ with your browser.

    You see information regarding the latest version of Python, as shown in Figure
    2-1.


    +   2. Click the appropriate link for your version of Linux:

    a. Python 3.3.4 compressed source tarball (any version of Linux)

    b. Python 3.3.4 xzipped source tarball (better compression and faster download)


    +   3. When asked whether you want to open or save the file, choose Save.

    The Python source files begin downloading. Be patient: The source files require
    a minute or two to download.


    +   4. Double-click the downloaded file.

    The Archive Manager opens. After the files are extracted, you see the Python 3.3.4
    folder in the Archive Manager window.


    +   5. Double-click the Python 3.3.4 folder.

    The Archive Manager extracts the files to the Python 3.3.4 subfolder of your home
    folder.


    +   6. Open a copy of Terminal.

    The Terminal window appears if you have never built any software on your system
    before, you must install the build essentials, SQLite, and bzip2 or the Python
    installation will fail. Otherwise, you can skip to Step 10 to begin working with
    Python.


    +   7. Type sudo apt-get install build-essential and press Enter.

    Linux installs the Essential support required to build packages (see https://packages.debian.org/squeeze/build-essential
    for details).


    +   8. Type sudo apt-get install libsqlite3-dev and press Enter.

    Linux installs the SQLite support required by Python for database manipulation
    (see https://packages.debian.org/squeeze/libsqlite3-dev for details).'
