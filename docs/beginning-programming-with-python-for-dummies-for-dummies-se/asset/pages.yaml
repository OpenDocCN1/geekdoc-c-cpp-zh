  md: '# Chapter 12


    # Managing Lists


    In This Chapter


    +   - Defining why lists are important

    - Generating lists

    - Looking through lists

    - Working with list items sequentially

    - Changing list content

    - Locating specific information in order

    - Putting list items in order

    - Using the Counter object to your advantage


    A lot of people lose sight of the fact that most programming techniques are based
    on the real world. Part of the reason is that programmers often use terms that
    other people do not to describe these real-world objects. For example, most people
    would call a place to store something a box or a cupboard — but programmers insist
    on using the term variable. Lists are different. Everyone makes lists and uses
    them in various ways to perform an abundance of tasks. In fact, you''re probably
    surrounded by lists of various sorts where you''re sitting right now as you read
    this book. So, the difference is that you think about something you already know
    quite a lot. The only difference is that you need to think of lists in the same
    way Python does.


    You may read that lists are hard to work with. The reason that some people find
    working with lists difficult is that they''re not used to actually thinking about
    the lists they create. When you create a list, you simply write down in whatever
    order makes sense to you. Sometimes you rewrite the list when you''re done to
    put it in a specific order. In other cases, you use your finger as a guide when
    going down the list to make looking through it easier. The point is that everything
    you normally do with lists is also doable in Python. The difference is that you
    must now actually think about what you''re doing in order to make Python understand
    what you want done.'
