  md: '# Chapter 1: Talking to Your Computer


    # Helping humans speak to the computer


    It''s important to keep the purpose of an application in mind as you write it.
    An application is there to help humans speak to the computer in a certain way.
    Every application works with some type of data that is input, stored, manipulated,
    and output so that humans using the application obtain a desired result. Whether
    the application is a game or a spreadsheet, the basic idea is the same. Computers
    work with data provided by humans to obtain a desired result.


    When you create an application, you''re providing a new method for humans to speak
    to the computer. The new approach you create will make it possible for other humans
    to view data in new ways. The communication between human and computer should
    be easy enough for the kinds of applications you''ve used in the past. The best
    applications are the ones that you focus on whatever data you''re interacting
    with. For example, an application is considered immersive only if you focus on
    the planet you''re trying to save or the ship you''re trying to fly, rather than
    the application that you do these things.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_28_0.png)


    One of the ways to start thinking about how you want to create an application
    is to look at the other people create applications. Writing down what you like
    and dislike about other applications is a useful way to start discovering you
    want your applications to look and work. Here are some questions you can ask yourself
    as you work with the applications:


    +   * What do I find about the application?

    * Which features were easy to use?

    * Which features were hard to use?

    * How did the application make it easy to interact with my data?

    * How would I make the data easier to work with?

    * What do I hope to achieve with my application that application doesn''t provide?


    Professional developers ask many other questions as part of creating an application,
    but these are good starter questions because they begin to think about applications
    as a means to help humans speak with computers. If you''ve ever found yourself
    frustrated by an application used, you already know how other people will feel
    if you don''t ask the appropriate questions when you create your application.
    Communication is the most important element of any application you create.'
