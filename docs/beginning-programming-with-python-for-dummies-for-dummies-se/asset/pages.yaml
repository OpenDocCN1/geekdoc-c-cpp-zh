  md: '# 338 Part V: The Part of Tens


    # # Making Your Python Application Fast


    Nothing turns off a user faster than an application that performs poorly. When
    an application performs poorly, you can count on users not using it at all. In
    fact, poor performance is a significant source of failure in enterprise environments.
    An organization can spend a ton of money to build an impressive application that
    does everything, but no one uses because it runs too slowly or has other significant
    performance problems.


    Performance is actually a mix of reliability, security, and speed. In fact, you
    can read about the performance triangle on my blog at http://blog.johnmuellerbooks.com/2012/04/16/considering-the-performance-triangle/.
    Many developers focus on just the speed part of performance but end not achieving
    their goal. It''s important to look at every aspect of your application''s use
    of resources and to ensure that you use the best coding techniques.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_353_0.png)


    Numerous resources are available to help you understand performance as it applies
    to Python applications. However, one of the best resources out there is "A guide
    to analyzing Python performance," at http://www.hyung.com/posts/python-performance-analysis/.
    The author takes the time to explain why something is a performance bottleneck,
    rather than simply tell you that it is. After you read this article, make sure
    to check out the PythonSpeed Performance Tips at https://wiki.python.org/moin/PythonSpeed/PerformanceTips
    as well.'
