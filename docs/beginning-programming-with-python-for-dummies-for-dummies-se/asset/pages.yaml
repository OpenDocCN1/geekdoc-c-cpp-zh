    # Floating-point values


    Any number that has a decimal portion is a floating-point value. For example,
    1.0 has a decimal part, so it''s a floating-point value. Many people get confused
    about whole numbers and floating-point numbers, but the difference is easy to
    remember. If you see a decimal in the number, then it''s a floating-point. Python
    stores floating-point values in the float data type.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_102_0.png)


    Floating-point values have an advantage over integer values in that they store
    immensely large or incredibly small values in them. As integer variables, floating-point
    variables have a storage capacity. In their case, the maximum value that a variable
    can contain is +1.7976931348623157×1³⁰⁸ and the minimum value that a variable
    can contain is -2.22507385072014×1⁻³⁰⁸ on most platforms.


    When working with floating-point values, you can assign the information to the
    variable in a number of ways. The two most common methods are to provide the number
    directly and to use scientific notation. When using scientific notation, an e
    separates the number from its exponent. Figure 5-3 shows methods of making an
    assignment. Notice that using a negative exponent results in a fractional value.'
