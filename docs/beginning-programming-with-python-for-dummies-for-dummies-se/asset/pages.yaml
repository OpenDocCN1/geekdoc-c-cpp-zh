    # Considering the message subtypes


    The "Defining message", earlier in this chapter, describes the major e-message
    types, such as application and text. However, if e-mail had to rely on just those
    types, transmitting coherent messages to anyone would be difficult. The problem
    is that the type of information is not explicit enough. If you sent someone a
    message, you need to know what sort of text it is before you process it, and guessing
    just isn''t a good idea. A message could be formatted as plain text, or it might
    actually be an HTML page. You wouldn''t know from just seeing the type, messages
    require a subtype. The type is text and the subtype is html when you send an HTML
    page to someone. The type and subtype are separated by a forward slash, so you''d
    see text/html if you looked at the message.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_337_0.png)


    Theoretically, the number of subtypes is unlimited as long as the platform has
    a handler defined for that subtype. However, the reality is that everyone needs
    to agree on the subtypes or there won''t be a handler unless you''re talking about
    a custom application for which the two parties have to agree to a custom subtype
    in advance. With this in mind, you can find a list of standard types and subtypes
    at http://www.formatter.com/mime-types-list.html. The nice thing about the table
    on site is that it provides you with a common file extension associated with the
    subtype and a reference to obtain information about it.


