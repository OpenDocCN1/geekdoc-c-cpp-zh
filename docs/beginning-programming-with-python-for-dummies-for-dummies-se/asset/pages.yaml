  md: "# Chapter 14: Creating and Using Classes\n\n# Using methods with variable\n\
    argument lists\n\nSometimes you create methods that can take a variable number\
    \ of arguments. Handling this sort of situation is something Python does well.\
    \ Here are the two kinds of variable arguments that you can create:\n\n+   * *args:\
    \ Provides a list of unnamed arguments.\n* **kwargs: Provides a list of named\
    \ arguments.\n\nThe actual names of the arguments don't matter, but Python developers\
    \ use *args and **kwargs as a convention so that other Python developers know\
    \ they're a variable list of arguments. Notice that the first variable argument\
    \ has just one asterisk (*) associated with it, means the arguments are unnamed.\
    \ The second variable has two asterisks, which means the arguments are named.\
    \ The following steps demonstrate how to use both approaches to writing an application.\
    \ This example also appears with the downloadable source code as `VariableArgs.py`.\n\
    \nREMEMBER\n\nYou see an editor in which you can type the code.\n\n+   1. Open\
    \ a Python file.\n\n+   2. Type the following code into the window — pressing\
    \ Enter after each line:\n\n```\nclass MyClass:\n    def List1(*args):\n     \
    \   for Count, Item in enumerate(args):\n            print(\"{0}. {1}\".format(Count,\
    \ Item))\n\n    def List2(**kwargs):\n        for Name, Value in kwargs.items():\n\
    \            print(\"{0} likes {1}\".format(Name, Value))\n\nMyClass.List1(\"\
    Red\", \"Blue\", \"Green\")\nMyClass.List2(\"George=\"Red\", Sue=\"Blue\", Zahara=\"\
    Green\")\n```\n\nFor the purposes of this example, you're seeing the arguments\
    \ implemented as part of a class method. However, you can use them as easily with\
    \ an instance method.\n\nLook carefully at List1() and you see a new method of\
    \ using a loop to iterate through a list. In this case, the enumerate() function\
    \ outputs both a count (the loop count) and the string that was passed to the\
    \ function.\n\n![](img/ec69aa1535cd82c735ee14abfc05048f_296_0.png)"
