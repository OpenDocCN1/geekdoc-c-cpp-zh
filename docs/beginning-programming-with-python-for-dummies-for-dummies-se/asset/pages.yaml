    # Using Python environment variables to your advantage


    Environment variables are special settings that are part of the command line or
    terminal environment for your operating system. They serve to configure Python
    in a consistent manner. Environment variables perform many of the tasks as do
    the options that you supply when you start Python, but you can make environment
    variables perform so you can configure Python the same way every time you start
    without having to manually supply the option.


    With options, most of these environment variables won''t make any sense right
    now. You can read them to see what is available. You find some of the environment
    variables used later in the book. Feel free to skip the rest of this section and
    come back to it when you need it.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_59_0.png)


    Most operating systems provide the means to set environment variables temporarily,
    by configuring them during a particular session, or permanently, by configuring
    them as part of the operating system setup. Precisely how you perform this task
    depends on the operating system. For example, when working with Windows, you can
    use the Set command (see my blog post at http://blog.johnhmullerbooks.com/2014/02/24/using-the-set-command-to-your-advantage/details)
    or rely on a Windows configuration feature (see my post at http://blog.johnhmullerbooks.com/2014/02/17/adding-a-location-to-the-windows-path/
    for setting the Path environment variable as an example).


    Using environment variables makes sense when you need to configure Python the
    same way on a regular basis. The following list describes the Python environment
    variables:


    ![](img/ec69aa1535cd82c735ee14abfc05048f_59_1.png)


    +   - PYTHONCASE=x: Forces Python to ignore case when parsing import statements.
    This is a Windows-only environment variable.

    - PYTHONDEBUG=x: Performs the same task as the -d option.

    - PYTHONTWRITEBYTECODE=x: Performs the same task as the -B option.'
