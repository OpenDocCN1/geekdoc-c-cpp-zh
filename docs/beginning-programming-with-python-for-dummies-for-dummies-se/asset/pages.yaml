    as needed. The main reason to use a dictionary is to make information lookup faster.
    The key is always short and unique so that the computer doesn''t spend a lot of
    time looking for the information you need.


    The following sections demonstrate how to create and use a dictionary. When you
    know how to work with dictionaries, you use that knowledge to make up for deficiencies
    in the Python language. Most languages include the concept of a switch statement,
    which is essentially a menu of choices from which one choice is selected. Python
    doesn''t include this option, so you must normally rely on...elif statements to
    perform the task. (Such statements work, but they aren''t as clear as they could
    be.)


    # Creating and using a dictionary


    Creating and using a dictionary is much like working with a list, except that
    you must now define a key and value pair. Here are the special rules for creating
    a key:


    +   - The key must be unique. When you enter a duplicate key, the information
    found in the second entry wins — the first entry is simply replaced with the second.

    - The key must be immutable. This rule means that you can use strings, numbers,
    or tuples for the key. You can''t, however, use a list for a key.


    You have no restrictions on the values you provide. A value can be any Python
    object, so you can use a dictionary to access an employee record or other complex
    data. The following steps help you understand how to use dictionaries better.


    +   1. Open a Python Shell window.


    You will see the Python prompt.


    +   2. Type Colors = {"Blue": "Amy": "Red", "Sarah": "Yellow"} and press Enter.


    Python creates a dictionary containing three entries with people''s favorite colors.
    Notice how you create the key and value pair. The key comes first, followed by
    a colon and then the value. Each entry is separated by a comma,


    +   3. Type Colors and press Enter.


    You see the key and value pairs, as shown in Figure 13-5. However, notice that
    the entries are sorted in key order. A dictionary automatically keeps the keys
    sorted to make access faster, which means that you get fast'
