    # Relational


    The relational operators compare one value to another and tell you when the relationship
    is provided. For example, 1 is less than 2, but 1 is never greater than 2. The
    truth value of relations is often used to make decisions in your applications
    to ensure that performing a specific task is met. Table 6-3 describes the relational
    operators.


    | Table 6-3 Python Relational Operators Example |

    | Operator | Description | Example |

    |---|---|--|

    | == | Determines whether two values are equal. Notice that the relational operator
    uses two equals signs. A mistake many developers make using just one equals sign,
    results in one value being assigned to another. | 1 == 2 is False |

    | != | Determines whether two values are not. Some older versions of Python allowed
    you to use the < operator in place of the != operator. Using the < operator results
    in an error in current versions of Python. | 1 != 2 is True |

    | > | Verifies that the left operand value is greater than the right operand value.
