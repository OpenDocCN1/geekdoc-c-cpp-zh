  md: '# 198 Part III: Performing Common Tasks


    # Using the Python Module Documentation


    You can use the doc() function whenever needed to get quick help. However, you
    have a better way to study the modules and libraries located in the Python path
    — the Python Module Documentation. This feature often appears as Module Docs in
    the Python folder on your system. It''s also referred to as pydoc. Whatever you
    call it, the Python Module Documentation makes life a lot easier for developers.
    The following sections describe how to work with this feature.


    # Opening the pydoc application


    Pydoc is just another Python application. It actually appears in the \Python33\Lib
    directory of pydoc.py. As any other .py file, you can open this one with IDLE
    and study how it works. You can start it using the Module Docs shortcut that appears
    in the Python folder on your system or by using a command at the command prompt.


    The application creates a localized server that works with your browser to display
    information about the Python modules and libraries. So, when you start this application,
    you see a command (terminal) window open like the one shown in Figure 10-12.


    # Accessing pydoc on Windows


    The Windows installation of Python has a problem. When you click Module Docs,
    nothing happens. Of course, this is a bit disconcerting users are apt to feel
    that something is wrong with their systems or with Python itself. It turns out
    that the shortcut is faulty. To overcome this problem, you must create a new shortcut
    using the following steps:


    +   1. Right-click the Desktop and choose New: Shortcut from the context menu.


    You see the Create Shortcut wizard.


    +   2. Type C:\Python33\python.exe C:\Python33\Lib\pydoc.py -b and click Next.


    This command starts a copy of the pydoc server so that you can access module information.


    +   3. Type pydoc and Finish.


    Windows creates a new shortcut for you. This shortcut allows you to access the
    module help that currently doesn''t work with Python 3.3.4 on Windows.'
