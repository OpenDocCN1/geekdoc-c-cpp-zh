  md: '# Chapter 4


    # Writing Your First Application


    In This Chapter


    +   - Working with the Integrated Development Environment (IDLE)

    - Getting started with IDLE

    - Writing the first application

    - Seeing how the first application works

    - Formatting your application code

    - Using comments effectively

    - Working with existing applications

    - Ending your IDLE session


    Many people view application development as some sort of magic practiced by wizards
    called who wave their keyboard to produce software both great and small. However,
    the truth is a lot more mundane.


    Application development follows a number of processes. It''s more than a strict
    procedure, but is most definitely not of any sort. As Arthur C. Once noted, "Any
    sufficiently advanced technology is indistinguishable from magic." This chapter
    is all about removing the magic from the picture and introducing you to the technology.
    By the time you''re finished with this chapter, you will be able to develop a
    simple application (and you won''t have to use magic to do).


    As with any other task, people use tools to write applications. In the case of
    Python, you don''t have to use a tool, but using a tool makes the task so easier
    that you will really want to use one. In this chapter, you use a tool that comes
    with Python, the Integrated Development Environment (IDLE). In the previous chapter,
    you use the command-line tool to play around with Python a little. However, IDLE
    goes further than the command-line tool around and makes it possible to write
    applications with greater ease.'
  merge: -1
