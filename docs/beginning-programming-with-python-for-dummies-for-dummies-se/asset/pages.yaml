    # Managing Information


    **In This Chapter**


    +   - Understanding the Python view of data

    - Using operators to assign, modify, and compare data

    - Organizing code using functions

    - Interacting with the user


    Whether you use the term information or data to refer to the content that applications
    manage, the fact is that you must provide some means of working with it or your
    application reality doesn''t have a purpose. Throughout the rest of the book,
    you will see information and data used interchangeably they are really the same
    thing, and in real-world situations, you''ll encounter both, getting used to both
    is a good idea. No matter which term you use, you need some means of assigning
    data to variables, modifying the content of those variables to achieve goals,
    and comparing the result you receive with desired results. This chapter addresses
    all three requirements so that you can start to control data within your applications.


    It''s also essential to start working through methods of keeping your code understandable.
    Yes, you could write your application as a really long procedure, but to understand
    such a procedure is incredibly hard, and you''d find yourself repeating some steps
    because they must be more than once. Functions are one way for you to package
    code so that it''s easier to understand and reuse as needed.


    Applications also need to interact with the user. Yes, some perfectly usable applications
    are out there that don''t really interact with the user, but they''re extremely
    rare and don''t really do much, for the most part. In order to provide a useful
    service, most applications interact with the user to discover how the user wants
    to manage data. You get an overview of this process in this chapter. Of course,
    you visit the topic of user interaction quite often throughout the book because
    it''s an important topic.'
