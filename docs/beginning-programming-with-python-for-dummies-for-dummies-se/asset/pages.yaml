  md: '# 58 Part I: Getting Started with Python


    A vast number of other tools are available for you to use when writing Python
    applications. This book doesn''t tell you much about them because IDLE performs
    every task needed and it comes with Python. However, as your skills increase,
    you might find that tools such as Komodo Edit (http://www.activestate.com/komodo-edit/downloads/)
    are easier to work with than IDLE. You can find a great list of these tools at
    https://wiki.python.org/moin/IntegratedDevelopmentEnvironments.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_73_0.png)


    # Understanding the Integrated Development Environment (IDLE)


    You can literally create any Python application you want using a text editor.
    As the editor outputs pure text rather than formatted text as a word processor,
    you can use it to write Python code. However, using a text editor isn''t efficient
    or straightforward. To make the development easier, developers have written Interactive
    Development Environments (IDEs). The IDE with Python is IDLE. However, many other
    IDEs are capable of working with Python.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_73_1.png)


    The feature set provided by IDEs varies. In fact, that''s why there are so many
    of them on the market. IDLE provides a basic feature set that is shared by most
    IDEs out there. It provides the functionality required to


    +   * Write Python code.

    * Recognize and highlight keywords and certain types of special text.

    * Perform both simple editing (such as cut, copy, and paste) and code-specific
    editing (such as showing the parentheses that surround an expression).

    * Save and open Python files.

    * Browse the Python path to make locating files easy.

    * Browse and locate Python classes.

    * Perform simple debugging tasks (removing errors from the code).


    IDLE differs from the command-line version of Python in that you get a full-fledged
    GUI and you can accomplish many tasks much more easily through IDLE than through
    the command line. In addition, the command line doesn''t really offer all the
    same features as IDLE. Yes, you can debug your application using the command line,
    but it''s a difficult, error-prone process. Using IDLE is a whole lot easier.'
  merge: -1
