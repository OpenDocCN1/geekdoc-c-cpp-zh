  md: '# Using the Edit window


    Any time you''re in IDLE, you can open an existing application in an Edit window
    and execute it, just as you have in previous sections of this chapter. To perform
    this task, load the file you saved earlier by choosing File->Open. You see an
    Open dialog box that looks similar to the Save As dialog box shown in Figure 4-14.
    Choose the folder containing the application in the Look In and highlight it in
    the list provided. Click Open to open the file. At this point, you can choose
    Run->Run Module to run the application, as you would normally.


    # Using the Python Shell window or Python command line


    When you''re in the IDLE Python Shell window or the Python command line, you''re
    in an environment where you can type commands and see them executed immediately.
    However, you need to know the right commands to perform specific tasks. In this
    case, the command is a little more complex than the print() command you''ve been
    using to date. If you want to execute FirstApp, you need a really odd-looking
    command like the one you show here:


    ```

    exec(open("C:\BP4D\Chapter04\FirstApp.py").read())

    exec(open("C:/BP4D\Chapter04/FirstApp.py").read())

    ```


    The preceding two commands are really the same one using a different slash. The
    command works well with forward slashes or backslashes. What this command says
    to this is:


    +   1. Open the FirstApp.py file located in the BP4D\Chapter04 folder on the C
    drive (open() command).

    2. Read the content of this file into the Python environment (read() command).

    3. Execute the instructions found in the file after it''s loaded (exec() command).


    It''s a little early for a command like this one, but you''ll discover that you
    can create combined commands of all sorts later in the book. For now, just try
    the command to see that it works. Figure 4-25 shows typical results.


