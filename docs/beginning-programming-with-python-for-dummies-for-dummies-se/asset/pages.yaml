  md: '# Chapter 17: Ten Amazing Programming Resources 331


    # Using the LearnPython.org Tutorial


    Many tutorials are available for Python and many of them do a great job, but they''re
    lacking a special feature that you find when using the LearnPython.org at http://www.learnpython.org/
    — interactivity. Instead of just reading about a Python function, you read it
    and then try it yourself using the interactive feature of the site.


    You have already worked through all the material in the simple tutorials in this
    book. However, you haven''t worked through the advanced tutorials yet. These tutorials
    present the following topics:


    +   * Generators: Specialized functions that return iterators.


    +   * List comprehensions: A method to generate new lists based on existing lists.


    +   * Multiple function arguments: An extension of the methods described in the
    "Using methods with variable argument lists" in Chapter 14.


    +   * Regular expressions: Wildcard setups used to match patterns of characters,
    such as telephone numbers.


    +   * Exception handling: An extension of the methods described in Chapter 9.


    +   * Sets: Demonstrates a special kind of list that never contains duplicate
    entries.


    +   * Serialization: Shows how to use a data storage methodology called JavaScript
    Object Notation (JSON).


    +   * Partial functions: A technique for creating specialized functions that derive
    from more complex functions. For example, if you have a multiply() function that
    requires two arguments, a partial function named double() might require only one
    argument that it multiplies by 2.


    +   * Code introspection: Provides the ability to examine classes, functions,
    and keywords to determine their purpose and capabilities.


    +   * Decorator: A method for making simple modifications to callable objects.'
