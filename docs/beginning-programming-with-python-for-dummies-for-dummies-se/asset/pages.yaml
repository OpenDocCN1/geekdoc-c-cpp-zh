    # Using XML to Your Advantage


    The Extensible Markup Language (XML) is used for data storage of all types in
    most applications of any today. You probably have a number of XML files on your
    system and don''t even know it XML appears under a number of file extensions.
    For example, many .config files, used to hold application settings, rely on XML.
    In short, it''s not a matter if you''ll encounter XML when writing Python applications,
    but when.


    XML has a number of advantages over other methods of storing data. It''s independent.
    You can use XML on any system, and the same file file is readable on any other
    system as long as that system knows the format. The format of XML is why it appears
    with so many other technologies, such as web services. In addition, XML is relatively
    easy to learn and because it''s text, you can usually fix it without it too many
    problems.


    It''s important to learn about XML itself, and you can do so with an easy tutorial
    such as the one found on the W3Schools site at http://www.w3schools.com/xml/default.ASP.
    Some developers rush ahead and later find that they can''t understand the Python-specific
    materials that assume they already know how to write XML files. The W3Schools
    site is nice because it breaks up the learning process into chapters so that you
    can work with XML


    +   - Taking a basic XML tutorial

    - Validating XML files

    - Using XML with JavaScript (which may not seem important, but JavaScript is prominent
    in many online application scenarios)

    - Gaining an overview of XML-related technologies

    - Using advanced XML techniques

    - Working with XML examples that make seeing XML in easier


