  md: "# Chapter 9: Dealing with Errors\n\n2. Type the following code into the window\
    \ — pressing Enter after each line:\n\n```\nimport sys\n\ntry:\n    raise ValueError\n\
    \    print(\"Rasing an exception.\")\nexcept ValueError:\n    print(\"ValueError\
    \ Exception!\")\n    sys.exit()\nfinally:\n    print(\"Taking care of last minute\
    \ details.\")\n\nprint(\"This code will never execute.\")\n```\n\nIn this example,\
    \ the code raises a ValueError exception. The except clause executes as normal\
    \ when this happens. The code to sys.exit() means that the application exits after\
    \ the exception is handled. The application cannot recover in this particular\
    \ instance, but the application normally ends, which is the final print() function\
    \ call won't execute.\n\nThe finally clause always executes. It doesn't matter\
    \ whether the exception happens or not. The code you place in this block needs\
    \ to be common code that you want to execute. For example, when working with a\
    \ file, you place the code to close into this block to ensure that the data is\
    \ not damaged by remaining in memory rather than going to disk.\n\n# 3. Choose:Run\
