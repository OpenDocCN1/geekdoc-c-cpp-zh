  md: '# Avoid the orphaned product


    Some Python tools floating around the Internet are orphaned, which means the developer
    is no longer supporting them. Developers still use the tool because they like
    the features it supports or how it works. However, doing so is always risky because
    you can''t be sure the tool will work with the latest version of Python. The best
    way to approach tools is to get tools that are fully supported by the vendor who
    created them.


    If you absolutely must use an orphaned tool (such as when an orphaned tool is
    the only one available to perform the task), make sure that the tool still has
    good community support. The vendor may not be around longer, but at least the
    community will provide a source of information when you need product support.
    Otherwise, you''ll waste a lot of time trying to use an unsupported product that
    you might never get to properly.


    PyInstaller installs the tool on all the platforms Python supports, so you just
    need one to meet every installation need you have. In addition, you can get platform-specific
    support when needed. For example, when working on a Windows platform, you can
    create code-signed executables. Mac developers will appreciate that PyInstaller
    provides support for bundles. In many cases, avoiding the platform-specific features
    is best unless you really need them. When you use a platform-specific feature,
    the installation will succeed only on the target platform.


    A number of the installer tools that you find online are platform-specific. For
    example, when you look at an installer that reportedly creates executables, you
    need to be careful that the executables are platform-specific (or at least match
    the platform you want to use). It''s important to create a product that works
    everywhere it''s needed so that you don''t create an installation package that
    the user can''t use. Having a language that works everywhere doesn''t help when
    the installation actually hinders installation.


