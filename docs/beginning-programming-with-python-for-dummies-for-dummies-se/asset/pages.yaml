  md: '# Chapter 16


    # Sending an E-Mail


    +   - Defining the series of events for sending an e-mail

    - Developing an e-mail application

    - Testing the e-mail application


    This chapter helps you understand the process of sending an e-mail using Python.
    More important, this chapter is generally about helping you understand what happens
    when you communicate the local PC. Even though this chapter is specifically about
    email, it also contains principles you can use when performing other tasks. For
    example, when working with an external service, you often need to create the same
    sort of packaging as you for an e-mail. So, the information you see in this chapter
    can help you understand all sorts of communication needs.


    To make working with e-mail as easy as possible, this chapter uses standard mail
    as a real-world equivalent of e-mail. The comparison is apt. E-mail was actually
    modeled on real-world mail. Originally, the term e-mail was used for any sort
    of electronic document transmission, and some of it required the sender and recipient
    to be online at the same time. As a result, you may find some confusing references
    online about the origins and development of e-mail. This chapter views e-mail
    as it exists today— as a storing and forwarding mechanism for exchanging documents
    of various types.


    The examples in this chapter rely on the availability of a Simple Mail Transfer
    Protocol (SMTP) server. If that sounds like Greek to you read, read the sidebar
    entitled “Considering the SMTP server” that appears later in the chapter.'
