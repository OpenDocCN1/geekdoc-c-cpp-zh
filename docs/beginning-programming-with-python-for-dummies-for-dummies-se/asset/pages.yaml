    # Obtaining a list of exception arguments\n\nThe list of arguments supplied with\
    \ exceptions varies by exception and by what the sender provides. It isn't always\
    \ easy to figure out what you can hope to obtain in the way of additional information.\
    \ One way to handle the problem is to simply print everything using code like\
    \ this (this example also appears with the downloadable source code as GetExceptionArguments.py):\n\
    \n```\nimport sys\n\ntry:\n    File = open('myfile.txt')\nexcept IOError as e:\n\
    \    for Arg in e.args:\n        print(Arg)\nelse:\n    print(\"File opened as\
    \ expected.\")\n    File.close();\n```\n\nThe args property contains a list of\
    \ the exception arguments in string format. You can use a simple for loop to print\
    \ each of the arguments. The only problem with this approach is that you're missing\
    \ the argument names, so you know the output information (which is obvious in\
    \ this case), but you don't know what to call it.\n\nA complex method of dealing\
    \ with the issue is to print both the names and the contents of the arguments.\
    \ The following code displays the names and the values of each of the arguments\
    \ (this example also appears with the downloadable source code as GetExceptionArguments2.py):\n\
    \n```\nimport sys\n\ntry:\n    File = open('myfile.txt')\n```\n\n(continued)"
