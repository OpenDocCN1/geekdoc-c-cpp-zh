    # Developing a Secure Environment Using PyCrypto


    Data security is an essential part of any programming effort. The reason that
    applications are so valued is that they make it easy to manipulate and use data
    of sorts. However, the application must protect the data or the efforts to work
    with it are. It''s the data that is ultimately the valuable part of business —
    the application is a simple tool. Part of protecting the data is to ensure that
    no one can steal it or use it in a manner that the originator didn''t intend,
    which is why cryptographic libraries as PyCrypto (https://www.dlitz.net/software/pycrypto/)
    come into play.


    The main purpose of this library is to turn your data into something others can''t
    read when it sits in permanent storage. The purposeful modification of data is
    called *encryption*. However, when you read the data into memory, a *decryption*
    routine takes the mangled data and turns it back into its original form so that
    the application can manage it. At the center of all this is the *key*, which is
    used to encrypt and decrypt the data. Ensuring that the key remains safe of your
    application coding as well. You can read the data because you have the key; no
    others can because they lack the key.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_373_0.png)


