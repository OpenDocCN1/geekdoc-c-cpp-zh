    To create a queue, you must import the queue module. This module actually contains
    a number of queue types, but this example uses only the standard FIFO queue.


    When a queue is empty, the empty() function returns True. Likewise, when a queue
    is full, the full() function returns True. By testing the state of empty() and
    full(), you can determine whether you need to perform additional work with the
    queue or whether you can add other information to it. These two functions help
    you manage a queue. It''s not possible to iterate through a queue using a for
    loop as you might have done with other collection types, so you monitor empty()
    and full() instead.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_276_0.png)


    The functions used to work with data in a queue are put(), which adds new data,
    and get(), which removes data. A problem with queues is if you try to put more
    items into the queue than it can hold, it waits until space is available to hold
    it. Unless you''re using a multithreaded application (one that uses individual
    threads of execution to perform more than one task at one time), this state could
    end up freezing your application.


    +   3. Choose:Run Module.


