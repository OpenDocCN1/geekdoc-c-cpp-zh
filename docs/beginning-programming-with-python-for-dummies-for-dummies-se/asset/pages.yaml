  md: '# Locating a Value in a String


    There are times when you need to locate string information in a string. For example,
    you may want to know whether a string contains the word Hello in it. One of the
    purposes behind creating and maintaining data is to search it later to locate
    specific bits of information. Strings are no different — they''re most useful
    when you can find what you need quickly and without problems. Python provides
    a number of functions for searching strings. Here are the most commonly used functions:


    +   - `count(str, beg=0, end=len(string))`: Counts how many times str occurs in
    a string. You can limit the search by specifying a beginning index using beg or
    an ending index using end.

    - `endswith(suffix, beg=0, end=len(string))`: Returns True when a string ends
    with the characters specified by suffix. You can limit the check by specifying
    a beginning index using beg or an ending index using.

    - `find(str, beg=0, end=len(string))`: Determines whether str occurs in a string
    and outputs the index of the location. You can limit the search by specifying
    a beginning index using beg or an ending index using.

    - `replace(old, new, [max])`: Replaces all occurrences of the character sequence
    specified by old in a string. You can limit the number of replacements by specifying
    a value for max.

    - `rfind(str, beg=0, end=len(string))`: Provides the same function-ality as find(),
    but searches backward from the end of the string instead of the beginning.

    - `rindex(str, beg=0, end=len(string))`: Provides the same function-ality as index(),
    but searches backward from the end of the string instead of the beginning.

    - `startswith(prefix, beg=0, end=len(string))`: Returns True when a string begins
    with the characters specified by prefix. You can limit the check by specifying
    a beginning index using beg or an ending index


    The data that you need is an essential programming task — one that is required
    no matter what kind of application you create. The following steps help you create
    an example that demonstrates the use of search functionality within strings. This
    example also appears with the downloadable source code as Search.py.'
