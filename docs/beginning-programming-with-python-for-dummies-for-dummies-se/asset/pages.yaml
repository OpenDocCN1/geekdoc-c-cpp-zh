  md: '# Chapter 4: Writing Your First Application


    # # Creating the Application


    It''s time to create your first Python application. Your initial Python Shell
    window won''t work for creating an application, so you can begin by creating a
    new Edit window for the application. You''ll type the required commands and then
    save the file to disk.


    # ## Opening a new window


    The initial Python Shell window is just fine for experimentation, but you need
    a nice, clean Edit window for typing your first application. The Python Shell
    window is interactive, which means that it gives you immediate feedback for any
    commands you type. The Edit window provides a static environment, where you type
    commands, save them, and then run them after you type enough commands to create
    an application. The two windows serve differently purposes.


    Choose New to create a new window. A new window like the one shown in Figure 4-11
    opens. Notice that the title bar Python 3.3.4 Untitled instead of Python 3.3.4
    Shell. A Python Shell window will always have the word "Shell" in the title bar.
    The two windows also have some unique toolbar entries. For example, an Edit window
    includes the Run command, which you use to later test your application.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_82_0.png)


    Working with the Edit window is just like working with any other text editor.
    You have access to basic editing commands such as Copy, Cut, Paste. Press Enter
    moves to the next line rather than executing a command as it would when working
    in the Python Shell window. That''s because the Edit window is a static environment
    — one where you type commands and save them for later reuse.'
  merge: -1
