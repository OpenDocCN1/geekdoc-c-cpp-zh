  md: '# Chapter 10


    # Interacting with Modules


    # In This Chapter


    +   - Organizing your code

    - Adding code from outside sources to your application

    - Locating code libraries on disk

    - Looking at library code

    - Obtaining and reading the Python library documentation


    The examples in this book are small, but the functionality of the resulting applications
    is extremely limited. Even tiny real-world applications contain thousands of lines
    of code. In fact, applications that contain millions of lines of code are somewhat
    common. Imagine trying to work with a file large enough to contain millions of
    lines of code—you would never find anything. In short, you need some method to
    organize code into small pieces that are easier to manage, like the examples in
    this book. The Python solution is to place code in separate modules. Commonly
    used modules that contain source code for generic needs are libraries.


    Modules are contained in separate files. In order to use the module, you must
    tell Python to grab the file and read it into the current application. The process
    of obtaining code found in external files is called importing. You import a module
    or library to use the code. A few examples in the book have already shown the
    import statement in detail, but this chapter explains the import statement in
    detail so that you know how to use it.


    As part of the initial setup, Python created a pointer to the general-purpose
    libraries that it uses. That''s why you can simply add an import statement with
    the name of the library and Python can find it. However, it pays to know how to
    locate the files on disk in case you ever need to update them or you want to add
    your own modules and libraries to the list of files that Python can use.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_198_0.png)'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# 184 Part III: Performing Common Tasks


    The library code is self-contained and well documented (at least in most cases
    it is). Some developers might feel that they never need to look at the library
    code, and they''re right to say some degree — you never have to look at the library
    code in order to use it. You might want to view the library code, though, to ensure
    that you understand how the code works. In addition, the library code can teach
    you new programming techniques that you might not otherwise discover. So, viewing
    the library code is optional, but it can be helpful.


    The one thing you need to know how to do is obtain and use the Python library
    documentation. This chapter shows how to obtain and use the library documentation
    as part of the application-creation process.


    # Creating Code Groupings


    It''s important to group like pieces of code together to make the code easier
    to use, modify, and understand. As applications grow, managing the code found
    in a single file becomes harder and harder. At some point, the code becomes impossible
    to manage because the file becomes too large for anyone to work with.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_199_0.png)


    The term code is used broadly in this particular case. Code groupings include:


    +   - Classes

    - Functions

    - Variables

    - Runnable code


    The collection of classes, functions, variables, and runnable code within a module
    is known as attributes. A module has attributes that you access by that attribute''s
    name. Later sections in this chapter discuss precisely how to module access works.


    The runnable code can actually be written in a language other than Python. For
    example, it''s somewhat common to find modules that are written in C/C++ instead
    of Python. The reason that some developers use runnable code to make the Python
    application faster, less resource intensive, and better able to use a particular
    platform''s resources. However, using runnable code comes with the downside of
    making your application less portable (able to run on other platforms) unless
    you have runnable modules for each platform


    ![](img/ec69aa1535cd82c735ee14abfc05048f_199_1.png)'
