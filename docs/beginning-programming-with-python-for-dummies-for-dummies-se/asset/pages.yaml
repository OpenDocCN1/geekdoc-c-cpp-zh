  md: '# 194 Part III: Performing Common Tasks


    Look at Figure 10-1, earlier in the chapter. In addition to the SayGoodbye() and
    SayHello() functions discussed previously, the list has other entries. These attributes
    are automatically generated by Python for you. These attributes perform the following
    tasks or contain the following information:


    +   - __built__ : Contains a listing of all the built-in attributes that are accessible
    from the module. Python adds these attributes automatically for you.

    - __cached__ : Tells you the name and location of the cached file that is associated
    with the module. The location (path) is relative to the current Python directory.

    - __doc__ : Outputs help information for the module, assuming that you''ve actually
    filled it in. For example, if you type os.__doc__ and press Enter, Python will
    output the help information associated with the library.

    - __file__ : Tells you the name and location of the module. The location (path)
    is relative to the current Python directory.

    - __initializing__ : Determines whether the module is in the process of initializing.
    Normally this attribute returns a value of False. This attribute is useful when
    you need to wait until one module is done loading before you import another module
    that depends on it.

    - __loader__ : Outputs the loader information for this module. The loader is a
    piece of software that gets the module and puts it into memory so that Python
    can use it. This is one attribute rarely (if ever) use.

    - __name__ : Tells you the name of the module.

    - __package__ : This attribute is used internally by the import system to make
    it easier to load and manage modules. You don''t need to worry about this attribute.


    It may surprise to find that you can drill down even further into the attributes.
    Type dir(MyLibrary.SayHello) and press Enter. You see the entries in Figure 10-8.


    Some of these entries, such as __name__, also appeared in the module listing.
    However, you might be curious about some of the other entries. For example, you
    might want to know what __sizeof__ is all about. One way to get additional information
    is to type help("__sizeof__") and press Enter. You see some scanty (but useful)
    help information, as shown in Figure 10-9.'
