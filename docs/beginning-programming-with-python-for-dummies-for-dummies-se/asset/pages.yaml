    # Defining the operators


    An operator accepts one or more inputs in the format of variables or expressions,
    performs a task (such as comparison or addition), and then provides an output
    consistent with that task. Operators are classified partially by their effect
    and partially by the elements they require. For example, a unary operator works
    with a single variable or expression; a binary operator requires two.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_111_0.png)


    The elements provided as input to an operator are called operands. The operator
    and on the left side of the operator is called the left operand, while the operator
    and on the right side of the operator is called the right operand. The following
    list shows categories of operators that you use within Python:


    +   - Unary

    - Arithmetic

    - Relational'
