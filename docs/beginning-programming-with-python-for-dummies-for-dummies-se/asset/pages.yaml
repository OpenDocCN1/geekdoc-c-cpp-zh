  md: '# Chapter 10: Interacting with Modules


    When you import attributes using the from...import statement, you don''t need
    to precede the attribute name with a module name. This feature makes the attribute
    easier to access.


    Using the from...import statement can cause problems. If two attributes have the
    same name, you can import only one of them. The import statement prevents name
    collisions, which is important when you have a large number of attributes to import.
    In sum, you must exercise care using the from...import statement.


    +   7. Type SayGoodbye(“Harold”) and press Enter.


    You imported only the SayGoodbye() function, so Python knows importing SayGoodbye()
    displays an error message. The selective nature of the from...import statement
    can cause problems when you assume that an attribute is present when it isn''t.


    +   8. Close the Python Shell.


    The Python Shell window closes.


    # Finding Modules on Disk


    In order to use the code in a module, Python must be able to locate the module
    and load it into memory. The location information is stored as paths within Python.
    Whenever you request that Python import a module, Python looks at all the files
    in its list of paths to find it. The path information comes from three sources:


    +   Environment variables: Chapter 3 tells you about Python environment variables,
    such as PYTHONPATH, that tell Python where to find modules on disk.


    +   Current directory: Earlier in this chapter, you discover that you can change
    the current Python directory so that it can locate any modules by your application.


    +   Default directories: Even when you don''t define any environments and the
    current directory doesn''t yield any usable modules, Python can still find its
    own libraries in the set of default directories that are included as part of its
    path information.


    It''s helpful to know the current path information because the lack of a path
    can cause your application to fail. The following steps demonstrate how you can
    obtain path information:


    +   1. Open the Python Shell.


    You see the Python Shell window appear.'
