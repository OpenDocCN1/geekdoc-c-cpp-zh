  md: '# Chapter 5


    # Storing and Modifying Information


    In This Chapter


    +   - Understanding data storage


    +   - Considering the kinds of data storage


    +   - Adding dates and times to applications


    > Chapter 3 introduces you to CRUD. Create, Read, Update, and Delete — not that
    Chapter 3 contains cruddy material. This acronym provides an easy method to remember
    precisely what tasks all computer programs perform with information you want to
    manage. Of course, geeks use a special term for information — data, but either
    information or data works fine for this.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_98_0.png)


    In order to make information useful, you have to have some means of storing it
    permanently. Every time you turned the computer off, all your information would
    be gone and the computer would provide limited value. In addition, Python must
    provide some rules for modifying information. The alternative is to have applications
    amok, changing information in any and every conceivable manner. This is about
    controlling information how information is stored permanently and manipulated
    by applications you create.


    # Storing Information


    An application requires fast access to information or else it will take a long
    time to complete tasks. As a result, applications store information in memory.
    However, memory is temporary. When you turn off the machine, the information must
    be stored in some permanent format, such as on your hard drive, a Universal Serial
    Bus (USB) flash drive, or a Secure Digital (SD) card. In addition, you must also
    consider the form of the information, such as whether''s a number or text. The
    following sections discuss the issue of storing information as part of an application
    in more detail.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# 84 Part II: Talking the Talk


    # Seeing variables as storage boxes


    When working with applications, you store information in variables. A variable
    is a kind of storage box. Whenever you want to work with the information, you
    access it using the variable. If you have new information you want to store, you
    put it in a variable. Changing information means accessing the variable first
    and storing the new value in the variable. Just as you store things in the real
    world, you store things in variables (a kind of storage box) when working with
    applications.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_99_0.png)


    Computers are actually pretty tidy. Each variable just one piece of information.
    Using this technique makes it easy to find the particular piece of information
    you need — unlike in your closet, where things from ancient Egypt could be hidden.
    Even though the examples you work with in previous chapters don''t use variables,
    most applications rely heavily on variables to make working with information easier.


    # Using the right box to store the data


    People need to store things in the wrong sort of box. For example, you might find
    a pair of shoes in a garment bag and a supply of pens in a shoebox. However, Python
    likes to be neat. As a result, you find numbers in one sort of variable and text
    in an entirely different kind of variable. Yes, you use variables in both cases,
    but the variable is designed to store a particular kind of information. Using
    specialized variables makes it possible to work with the information inside in
    particular ways. You don''t need to worry about the details just — just keep in
    mind that each kind of information is stored in a special kind of variable.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_99_1.png)


    Python uses specialized variables to store information that makes things easy
    for the programmer and to ensure that information remains safe. However, computers
    don''t actually know about information types. All the computer knows are 0s and
    1s, which is the presence or absence of a voltage. At a higher level, computers
    do work with numbers, but that''s the extent of what computers do. Numbers, letters,
    dates, times, and any other kind of information you can think about all down to
    0s and 1 in the computer system. For example, the letter A is actually stored
    as 01000001 or the number 65. The computer has no concept of the letter A or of
    a date such as 8/31/2014.'
  merge: -1
  pgno: 99
- img_proc: true
  md: "# Chapter 5: Storing and Modifying Information\n\n# Defining the Essential\
    \ Python Data Types\n\nEvery programming language defines variables that hold\
    \ specific kinds of information, and Python is no exception. The specific kind\
    \ of variable is called a data type. Knowing the data type of a variable is important\
    \ because it tells you what kind of information you find inside. In addition,\
    \ when you want to store information in a variable, need a variable of the correct\
    \ type to do it. Python doesn't allow you to store text in a variable designed\
    \ to hold numeric information. Doing so would damage the text and cause problems\
    \ with the application. You can generally classify Python data types as numeric,\
    \ string, and Boolean, although really isn't any limit on just how you can view\
    \ them. The following sections describe each of the standard Python types within\
    \ these classifications.\n\n# Putting information into variables\n\nTo place a\
    \ value into any variable, you make an assignment using the assignment operator\
    \ (=). Chapter 6 discusses the whole range of basic Python operators in detail,\
    \ but you need to know how to use this particular operator to some extent. For\
    \ example, to place the number 5 into a variable named myVar, you type myVar =\
    \ 5 and press Enter at the Python prompt. Even though Python doesn't provide any\
    \ additional information to you, you can type the variable name and press Enter\
    \ to see the value it, as shown in Figure 5-1.\n\n![](img/ec69aa1535cd82c735ee14abfc05048f_100_0.png)\n\
    \n```\nPython 3.4 Shell\nFile Edit Debug Options Windows Help\nPython 3.4.3 (V3.4.3:ff326415e426,\
    \ Feb 10 2014, 18:13:51) [MSC V.1600 64 bit (AM-VC64)] on win32\n>>> myVar = 5\n\
    Type '\"copyright\", \"credits\" or \"license\"' for more information.\n>>> myVar\n\
    5\n>>> \n```\n\n# Understanding the numeric types\n\nHumans tend to think about\
    \ numbers in general terms. We view 1 and 1.0 as being the same number—one of\
    \ them simply has a decimal point. However, as far as we're concerned, the two\
    \ numbers are equal and we could easily use them interchangeably. Python views\
    \ them as different kinds of numbers"
