  md: '# # Chapter 15


    # # Storing Data in Files


    **In This Chapter**


    +   - Considering how permanent storage works with applications

    - Deciding how to work with permanently stored content

    - Writing to a file for the first time

    - Obtaining content from the disk

    - Changing file content as needed

    - Removing a file from disk


    Until now, application development might seem to be all about presenting information
    onscreen. Actually, applications center around a need to work with data in some
    way. Data is the focus of all applications because it''s the data that users are
    interested in. Be prepared for a huge disappointment the first time you present
    a treasured application to a user base and find that the only users worry about
    whether the application will help them work on time after creating a presentation.
    The fact is, the best applications are invisible, but they present data in the
    most appropriate manner for a user''s needs.


    If data is focus of applications, storing the data in a permanent manner is equally
    important. For most developers, data storage revolves around a permanent media
    such as a hard drive, Solid State Drive (SSD), Universal Serial Bus (USB) flash,
    or some other methodology. (Even cloud-based solutions work fine, you won''t see
    them in this book because they require different programming techniques that are
    beyond the book''s scope.) The data in memory is temporary because it lasts only
    as long as the machine is running. A permanent storage device holds the data long
    after the machine is turned off so that it can be retrieved during the next session.


    In addition to permanent storage, this chapter also helps you understand the four
    basic operations you can perform on files: Create, Read, Update, and Delete (CRUD).
    We use the CRUD acronym often in database circles, but it applies equally well
    to any application. No matter how your application stores the data in a permanent
    location, it must be able to perform these tasks in order to provide a complete
    solution to the user. Of course,


    ![](img/ec69aa1535cd82c735ee14abfc05048f_308_0.png)'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 294 Part IV: Performing Advanced Tasks


    CRUD operations must be performed in a secure, reliable, and controlled manner.
    This chapter also helps you set a few guidelines for how access must occur to
    ensure data integrity (a measure of how often data errors occur when performing
    operations).


    # Understanding How Permanent Storage Works


    You don''t need to understand absolutely every detail about how permanent storage
    works in order to use it. For example, just how the drive spins (assuming that
    it spins at all) is unimportant. However, most platforms adhere to a basic set
    of principles when it comes to permanent storage. These principles have developed
    over a period of time, starting with mainframe systems in the earliest days of
    computing.


    Data is stored in files. You probably know about files already because every useful
    application out relies on them. For example, when you open a document in your
    word processor, you''re actually opening a data file containing the words you
    or someone else has typed.


    Files typically have an extension associated with them that defines the file type.
    The extension is generally standardized for any given application and is separated
    from the filename by a period, such as MyData.txt. In this case, .txt is the file
    extension, and you probably have an application on your machine for opening files.
    In fact, you can choose from a number of applications to perform the task .txt
    file extension is relatively common.


    Internally, file structures store data in some specific manner to make it easy
    to write and read data and from it. Any application you write about the file structure
    to interact with the data file contains. The examples in this chapter use a simple
    file structure to make it easy to write the code required to access them, but
    file structures become quite complex.


    Files would be nearly impossible to find if you placed them all in the same folder
    on the hard drive. Consequently, many computer systems also use the term folder
    for this organizational feature of permanent storage. No matter what you call
    it, permanent storage relies on directories to organize the data and make individual
    files easier to find. To find a particular file so that you can open it and interact
    with the data it contains, you must know which directory holds the file.


    Directories are arranged in hierarchies that begin at the uppermost level of the
    hard drive. For example, when working with the downloadable source code for this
    book, you find the code for the entire book in the BP4D'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 15: Storing Data in Files


    directory. However, this directory doesn''t actually contain any source code files.
    To locate the source code files, you must open one of the chapter directories
    contained in the BP4D directory first. To locate the source code files for this
    chapter, you look in the BP4D)Chapter 15 directory.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_310_0.png)


    I''ve noticed a backslash (\ to separate the directory files. Some platforms use
    the forward slash (/), while others use the backslash. You can read about this
    on my blog at http://blog.johnmellerbooks.com/2014/03/10/backslash-versus-forward-slash/.
    The book uses backashes when appropriate and assumes that you will make any changes
    for your platform.


    A final consideration for Python developers (at least for this) is that the hierarchy
    of directories is called a path. We use the term path in a few places in this
    book Python must be able to find any resources you want to use based on path you
    provide. For example, C:\BP4D\Chapter 15 is the complete path to the source code
    for this chapter on a Windows system. A path that traces the entire route that
    Python search is called an absolute path. An incomplete path that traces the route
    to a resource using the current directory as a starting point is called a relative
    path.


    # Creating Content for Permanent Storage


    A file can contain structured or unstructured data. An example of structured data
    is a database in which each record has specific information in it. An employee
    database would include columns for name, address, employee ID, and so on. Each
    record would be an individual employee and each employee record would contain
    the name, address, and employee fields. An example of unstructured data is a word
    processing file whose text can contain any content in order. There is no required
    order for the content of a paragraph, and sentences can contain any number of
    words. In both cases, the application must know how to perform CRUD operations
    with the file. This means that the content must be prepared in such a manner that
    the application can write both and read from the file.


    Even with word processing files, the text must follow a certain series of rules.
    Assume for a moment that the files are simple text. Even so, every paragraph must
    have some delimiter telling the application to begin a new paragraph. The application
    reads the paragraph until it sees this delimiter, and then it begins a new paragraph.
    The more that the word processor offers in the way of features, the more structured
    the output becomes. For example, when the word processor offers a method of formatting
    the text, the formatting must appear as part of the output file.'
