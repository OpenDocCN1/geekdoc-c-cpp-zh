  md: '# 68 Part I: Getting Started with Python


    The Edit window also provides special commands to format the text. The "Understanding
    the Use of Indentation" and "Adding Comments" sections of this chapter describe
    how to use the formatting features. What you need to know is that formatting commands
    act differently from those in a standard text editor because they help you control
    the appearance of code rather than generic text. Many of the formatting features
    work automatically, so you do not to worry about them.


    Finally, the Edit window provides access to commands that tell Python to perform
    the steps in the procedure you create one at a time. This process is called running
    the application. The "Running the Application" section of this chapter describes
    in greater detail.


    # Typing the command


    As with the Python Shell, you can simply type a command into the Edit window.
    To see how this works, type print(). Notice that the Edit window provides you
    with helpful information about the print() command, as shown in Figure 4-12. The
    information is a little terse, so you may not understand it. As the book progresses,
    you learn more about the print() command and the word value is the one you need
    to focus on. The print() command needs a value before it can print anything and
    you''ll encounter a host of different values as the book progresses.


