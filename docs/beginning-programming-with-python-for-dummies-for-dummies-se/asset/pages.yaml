  md: '# Part II: Talking the Talk


    # Choosing Alternatives Using the if...else Statement


    Many of the decisions you make in an application fall into a category of choosing
    one of two options based on conditions. For example, when looking at a signal
    light, you choose one of two: press on the brake to stop or press the accelerator
    to continue. The option you choose depends on the conditions. A green light signals
    that you can continue through the light; a red light tells you to stop. The following
    sections describe how Python makes it possible to choose between two alternatives.


    # Understanding the if...else statement


    With Python, you choose one of two alternatives using the else if if statement.
    A clause is an addition to a code block that modifies the way in which it works.
    Most code blocks support multiple clauses. In this case, the else clause enables
    you to perform an alternative task, which increases the usefulness of the if statement.
    Most developers refer to the form of the statement that has the else clause included
    in the if...else statement, with the ellipsis implying that something happens
    between if and else.


    Sometimes developers encounter problems with the if...else statement because they
    forget that the else clause always executes when the conditions for the if statement
    aren''t met. It''s important to think about the consequences of always executing
    a set of tasks when the conditions are false. Doing so can lead to unintended
    consequences.


    ![](img/ec69aa1535cd82c735ee14abfc05048f_139_0.png)


    # Using the if...else statement in an application


    The SimpleIf.py is a little less helpful than it could be when the user enters
    a value that''s outside the range. Entering data of the wrong type produces an
    error message, but entering data outside the range tells the user nothing. In
    this example, you discover the means for correcting this problem by using an else
    clause. The following steps demonstrate one reason to provide an alternative action
    when the condition for an if statement is false. This example also appears with
    the downloadable source code as IfElse.py.'
