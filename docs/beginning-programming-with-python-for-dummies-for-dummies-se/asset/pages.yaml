  md: '# Chapter 7

    Making Decisions


    In This Chapter


    +   - Using the if statement to make simple decisions

    - Performing more advanced decision making with the if..else statement

    - Creating multiple decision levels by nesting statements


    ![](img/ec69aa1535cd82c735ee14abfc05048f_132_0.png)


    The ability to make a decision, to take one path or another, is an essential element
    of performing useful work. Math gives the computer the capability to obtain useful
    information. Decisions make possible to do something with the information it obtained.
    Without the capability to make decisions, a computer would be useless. So any
    language you use will include the capability to make decisions in some manner.
    This chapter explores the techniques that Python uses to make decisions.


    Think through the process you use when making a decision. You obtain the actual
    value of something, compare it to a desired value, and then act accordingly. For
    example, when you see a signal light and see that it''s red, you compare the red
    light to the green signal light, decide that the light isn''t green, and then
    stop. Most people don''t take time to consider the process they use because they
    use it so many times every day. Decision making comes naturally to humans, but
    computers must perform the following tasks every time:


    +   - Obtain the actual or current value of something.

    - Compare the actual or current value to a desired value.

    - Perform an action that corresponds to the desired outcome of the comparison.'
  merge: -1
