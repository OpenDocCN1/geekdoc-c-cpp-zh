    # Working with queues


    A queue works differently from a stack. Think of any line you''ve ever stood in:
    Go to the back of the line, and when you reach the front of the line you get to
    whatever you stood in the line to do. A queue is often used for task scheduling
    and maintain program flow — just as it is in the real world. The following steps
    help you create a queue-based application. This example appears with the downloadable
    source code QueueData.py.


    +   1. Open a Python File window.


    You see an editor in which you can type the example code.


    +   2. Type the following code into the window — pressing Enter each line:


    ```

    import queue

    MyQueue = queue.Queue(3)

    print(MyQueue.empty())

    input("Press any key when ready...")

    ```'
