  md: "# Chapter 9: Dealing with Errors 171\n\n2. Type the following code into the\
    \ window — pressing Enter after each line:\n\n```\nTryAgain = True\nnwhile TryAgain:\n\
    \    try:\n        Value = int(input(\"Type a whole number.\"))\n    except ValueError:\n\
    \        print(\"You must type a whole number!\")\n\n        try:\n          \
    \  DoOver = input(\"Try again (y/n)?\")\n        except:\n            print(\"\
    OK, see you next time!\")\n            TryAgain = False\n        else:\n     \
    \       if str.upper(DoOver) == \"N\":\n                TryAgain = False\n\nexcept\
    \ KeyboardInterrupt:\n    print(\"You pressed Ctrl+C!\")\n    print(\"You see\
    \ you next time!\")\n    TryAgain = False\nelse:\n    print(Value)\n    TryAgain\
    \ = False\n```\n\nThe code begins by creating an input loop. Using loops for this\
    \ type of purpose is quite common in applications because you don't want the application\
    \ to end every time an input error is made. This is a simplified loop, normally\
    \ you create a separate function to hold the code.\n\nWhen the loop starts, the\
    \ application asks the user to type a number. It can be any integer. If the user\
    \ uses any non-integer value or presses Ctrl-C, Cmd-C, or any other interrupt\
    \ combination, the exception-handling code takes over. Otherwise, the application\
    \ prints the value the user supplied and sets TryAgain to False, which causes\
    \ the loop to end.\n\nA ValueError exception can occur when the user makes a mistake.\
    \ Because you don't know why the user input the wrong value, you have to ask the\
    \ user to try again. Of course, getting more input from the user could generate\
    \ another exception. The inner try...except code block handles secondary input.\n\
    \nNotice the use of the str.upper() function when getting character input from\
    \ the user. This function makes it possible to receive y or Y as input and accept\
    \ both them. Whenever you ask the user for character input, it's a good idea to\
    \ convert lowercase characters to uppercase so that you can perform a single comparison\
    \ (reducing the potential for error).\n\n![](img/ec69aa1535cd82c735ee14abfc05048f_186_0.png)"
