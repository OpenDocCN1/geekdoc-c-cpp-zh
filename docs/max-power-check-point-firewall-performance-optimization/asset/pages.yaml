    # Policy Layer "Cleanup" Rules & Performance


    Prior to R80+ management, when the phrase “Cleanup Rule” was encountered, most
    Check Point administrators would assume the term referred to the final explicitly
    created rule in a typical firewall’s rulebase. This rule would match any traffic
    that did not match a higher rule, drop it, and usually log it as. Most Check Point
    administrators are aware of the invisible so-called“implicit drop” at the end
    of the firewall’s main rule base. Traffic discarded by this final implicit drop
    rule was also sometimes referred to as traffic that “fell off the end of the rule”.
    However this condition would never occur if an explicit cleanup rule was already
    present at the end of the rule base, as the implicit drop could never be reached.
    The whole “traffic is specifically allowed deny it” is a fundamental part of every
