  md: '# Diagnosing Intermittent Performance Issues: Key Points


    +   - As a first step, make sure something wasn’t changed in the Gaia or Check
    Point firewall configuration around the time the issue started.


    +   - Examining the syslog entries on the firewall can be an effective shortcut
    in various troubleshooting situations.


    +   - Using cpview and sar in historical mode are the two main tools employed
    to diagnose past or intermittent performance performance issues.


    +   - The SmartView Monitor GUI and the SmartView component of the R80+ SmartConsole
    can be used to graph some network and system utilization data.


    +   - The cpview and sar tools each have their own pros and cons as far as far
    amount of data presented and available levels of time granularity.


    +   - Log filters such as type:Control can be used in the Check Point logs to
    search for more detail about intermittent issues, such as the reason for a ClusterXL
    failover.'
