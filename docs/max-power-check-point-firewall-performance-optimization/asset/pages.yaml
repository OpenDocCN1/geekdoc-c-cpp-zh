  md: '# Content Awareness Tips (R80.10 Firewall Only)


    Following are recommendations when invoking the Content Awareness blade on an
    R80.10+ firewall, which can match both specific file types and sensitive/confidential
    data:


    +   1. If trying to match both file type and a specific content type in the same
    policy layer, place the rule matching the file type first, the follow it with
    the rule matching a particular type of content. This rule placement mirrors the
    order in which the firewall itself evaluates the content and is more efficient.

    2. Using the Content Awareness feature does invoke a process “trip” on the firewall
    as described in Chapter 10 for any data it needs to inspect. Make sure when invoking
    Content Awareness in your policy layers that it is confined only to traffic going
    to and from limited-bandwidth connections such as to the Internet. Specifically,
    try to avoid situations where Content Awareness is configured to inspect traffic
    travelling between two high-speed internal LAN networks.

    3. If using Inline/Unified layers in your policy, avoid invoking Content Awareness
    matching in the top policy layer; keep Content Awareness matching confined to
    sub-layers only if possible.


