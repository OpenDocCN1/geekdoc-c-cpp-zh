  md: '# Firewall Path Optimization 331


    # IP Fragmentation: Nemesis of SecureXL


    You would think in today’s world of high-speed Internet access, and with the massive
    proliferation of the various Ethernet standards, that just about every network
    in the world would have a Maximum Transmission Value (MTU) of at least the Ethernet
    default of 1500. Unfortunately you would be wrong. Sub-1500 MTU values were very
    common in the early days of the Internet due to dial-connectivity and the SLIP/PPP
    protocols (default MTU 576 in most cases). Varying MTU values on different networks
    are dealt with by a process called IP fragmentation. Packets that are larger than
    a target network’s smaller MTU are fragmented into 2 or more pieces by an intervening
    router, and the fragment(s) successfully traverse the rest of the network path
    to the receiver. It is the end receiver’s responsibility to reassemble the fragments
    back into the original packets and process them. As we saw in Chapter 8’s “Low
    MTUs and PMTUD” section, digitally signed traffic (such as IPSec) cannot be fragmented
    in transit, since it would violate the ESP packet’s digital signature.


    However there is a truly insidious effect on firewall performance when a fragmented
    packet arrives at the firewall: All received packets that have been fragmented
    are ineligible for SecureXL Throughput Acceleration (Accelerated Path) or the
    Medium Path; they will always take the Firewall Path. This limitation still exists
    in R80.10 gateway. You can execute the optimization strategies stated earlier
    in this chapter you will want, but fragmented packets will always end up in the
    Firewall Path no matter what you do. Check Point firewalls perform a process called
    “virtual defragmentation” to ensure that a single attack has not been split into
    multiple packets for purposes of evading detection, and this virtual defragmentation
    process can only occur in the Firewall Path.'
  merge: -1
  pgno: 359
- img_proc: true
  md: "# 332 SecureXL Throughput Acceleration\n\nThe only exception to this is the\
    \ Check Point 21000 series appliance with an optional SAM card installed; if present\
    \ the SAM card can perform virtual defragmentation in a highly accelerated fashion.\
    \ Fragmentation can degrade firewall performance if a large percentage of received\
    \ traffic is fragmented, and there is very little you can do about directly on\
    \ the firewall itself. However if a connection is eligible for Medium or Accelerated\
    \ Path processing, and one or some of that connection's packets are fragmented,\
    \ only the fragmented packet(s) will be handled in the Firewall Path. The remainder\
    \ of the connection's packets can still be handled in the Medium or Accelerated\
    \ Path; the mere presence of a fragmented packet in a connection's stream does\
    \ not doom the remainder of the connection to languish in the Firewall Path, regardless\
    \ of future packet fragmentation status.\n\nIf you suspect fragmentation is occurring,\
    \ we can confirm this from the firewall using various tools. There is very little\
    \ you can do about fragmented packets arriving from the Internet (unless your\
    \ organization's own Internet perimeter router is the one doing the fragmentation),\
    \ but you should try to avoid this situation on any networks under your administrative\
    \ control. To figure out how many fragments the firewall is receiving, run these\
    \ commands:\n\n```\nfw ctl pstat fwaccel stats -p\nFragments:\n  0 fragments,\
    \ 0 packets, 0 expired, 0 short,\n  0 large, 0 duplicates, 0 failures\n```\n\n\
    Figure 9-28: Fragmentation Statistics Displayed by fw ctl pstat"
