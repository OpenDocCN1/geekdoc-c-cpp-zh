  md: '# 196 ClusterXL HA Performance Tuning


    # ClusterXL HA Performance Tuning: Key Points


    +   - In most cases High Availability (active/standby) is recommended over Load
    Sharing (active/active).


    +   - Use the clusterXL_admin command to perform administrative failovers; do
    not use the “Start/Stop Cluster Member” function of the SmartView GUI.


    +   - Adhere to Check Point best practices for firewall cluster optimization.
    Ensure a healthy sync network and watch out for “Magic MAC” conflicts between
    multiple firewall clusters attached to the same VLAN.


    +   - Some switches may not handle the stream of multicast CCP packets properly
    which will cause spurious failovers in the cluster. CCP may need be set to broadcast
    mode to ensure reliable cluster behavior.


