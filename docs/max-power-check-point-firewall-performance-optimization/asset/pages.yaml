  md: '# Discovery: Firewall Cluster-Specific Performance Issues 179


    By default, when running the clusterXL_admin down command its effects will not
    survive a reboot; once the member boots back up the failed “admin_down” device
    will no longer be present, and the cluster member will resume normal operation.
    In some cases (such as firewall upgrades), it is desirable to have this “admin_down”
    device persist across a reboot on a cluster member. This can be accomplished with
    the little-known -p option like this: clusterXL_admin down -p. Now the cluster
    member will not try to go across reboots (unless it is the only working member
    of the cluster detected) until the command clusterXL_admin up -p is issued. Don’t
    forget the -p option when issuing the “up” command in this case, or the “admin_down”
    device will come back to haunt you after a reboot!


