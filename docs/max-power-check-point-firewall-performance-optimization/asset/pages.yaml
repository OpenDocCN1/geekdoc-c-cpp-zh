  md: '# Analysis: SMT/Hyperthreading


    Once SMT is enabled, there are essentially twice as many cores available for configuration
    as SND/IRQ or Firewall Worker cores. Remember the recommendation from CoreXL chapter
    to allocate cores in adjacent pairs to maximize CPU fast memory access? That recommendation
    is even more important when SMT is enabled. You should never select adjacent cores
    to perform different functions when SMT is enabled. For the record, adjacent cores
    would be 0+1, 2+3, 4+5, etc. These so-called “adjacent cores” are not really two
    separate cores when SMT is enabled; they are just two logical threads on the same
    physical core. If possible, it is strongly preferable to allocate core functions
    in blocks of 4 (for example 0,1,2,3 and 4,5,6,7) to maximize CPU L2 fast cache
    sharing between the 2 physical (4 logical) adjacent cores when SMT is enabled.


    # R77.30 Special Case: IPSec VPNs & SMT/Hyperthreading


    Recall from Chapter 8 that all IPSec VPN traffic is confined to only one Firewall
    Worker core on R77.30 firewalls, regardless of whether CoreXL is enabled or not.
    R80.10+ firewalls support MultiCore IPSec VPNs by default and not subject to this
    limitation. However this presents a special problem when SMT is enabled in R77.30;
    by default the poor single logical core is tasked with all IPSec VPN operations
    now has to share resources with another Firewall Worker instance trying to run
    on the same physical core. Only being able to use one core for all IPSec VPN operations
    in R77.30 was bad enough, but this situation is exacerbated with SMT enabled.


    Thankfully there is a workaround for R77.30; simply set the fmwltik_dispatch_skip_global
    kernel variable to a value of 2 as described in:'
