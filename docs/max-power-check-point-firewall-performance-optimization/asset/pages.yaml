  md: '# Layer 3 Performance Optimization: Key Points


    +   If participating in a dynamic routing protocol such as OSPF, ensure the firewall’s
    routing table remains properly converged, and there is not a persistent routing
    flap somewhere in the network.


    +   Use a dedicated transit VLAN between the firewall and internal core router;
    other workstations or servers should not be placed on the transit VLAN.


    +   Asymmetric paths in a network can cause intermittent, one-way performance
    issues.


    +   Do not rely on the ICMP redirect mechanism for proper routing.


    +   Core Router Supernet Loops can occur when routes for the entire RFC1918 address
    space are implemented on the firewall, with the internal core router as the next
    hop.


    +   If numerous ICMP packets not associated with ping testing traffic are arriving
    at the internal and/or DMZ interfaces of the firewall, it may indicate performance
    problems elsewhere within your network.


    +   ARP neighbor table overflows can cause intermittent firewall connectivity
    problems, especially if a dedicated transit VLAN is not used between the firewall
    and internal core router.'
