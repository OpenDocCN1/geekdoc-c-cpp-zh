  md: '# # CHAPTER 10

    THE FOURTH PATH: PROCESS SPACE TRIPS


    The journey, not the destination matters...


    +   - T.S. Eliot


    Note: The phrase "Fourth Path" used in this chapter is the term I chose to describe
    certain process space operations on the firewall, and is not a term that is used
    or endorsed by Check Point.


    # Background


    I want to be absolutely clear right from the start: Some firewall inspection operations
    being performed by processes running in process space instead of inside the Gaia
    kernel is not necessarily a bad thing, even with the performance impact it causes.
    On a firewall that has been properly sized and tuned, trips up into process space
    are not a big deal and cause a barely noticeable degradation in performance. However
    on a firewall that has not been properly tuned based on the recommendations in
    this book, or on a firewall that is severely overloaded, the place that performance
    problems tend to appear initially are firewall operations that involve a trip
    up into process space.


    Reading this section, you may get the impression that trips up into process space
    on a Check Point firewall are some kind of horrible design flaw specific to Check
    Point that'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# 344 The Fourth Path: Process Space Trips


    can never be corrected. Nothing could be further from the truth. Once of the best
    things about the Check Point firewall (and the reason a book like this could never
    be written for any vendor''s firewall) is that its administrators have full access
    to the underlying Gaia/Linux operating system via expert mode. As a result Check
    Point administrators can observe the internal workings of the firewall to whatever
    degree of intimacy desired, and leverage all the great Unix/Linux tools developed
    over the last 40+ years. Other firewall vendors deliberately lock their administrators
    out of the firewall'' underlying operating system, and confine them to a command
    shell equivalent to clish that only lets firewall administrators see what those
    vendors want them to see. Are process space trips like this happening on other
    vendor''s firewalls? Almost certainly, but those vendors are simply not allowing
    you see it (and probably a lot of other “inconvenient” things going under the
    hood as well). Recall this diagram of the three kernel paths shown earlier which
    shows the Firewall Path (F2F), and a link up into process space (i.e. the “Fourth
    Path”) for certain firewall operations we will discuss in this chapter:'
  merge: -1
