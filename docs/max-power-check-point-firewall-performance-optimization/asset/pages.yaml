    tcpdump -c100 -eni (iface) vlan

    ```


    This will display VLAN-tagged frames (which shouldn’t be arriving in the first

    place), along with the source MAC address of the device that sent them to the
    firewall.


    If you suspect Situation #2 is present, the tcpdump syntax is a little more

    complicated, due to a quirk with how tcpdump handles multiple vlan expressions.
    First

    off you need to determine the list of VLAN tags that the firewall is properly
    configured

    to receive on the problematic interface. This can easily be accomplished with
    the\ifconfig -a command, or from the Gaia web interface. Let’s suppose the valid

    VLAN tags arriving are determined to be 4, 8, and 96. To view all other possible

    VLAN tags arriving inappropriately, you’d think this command would do the trick:

    tcpdump -c 100 -eni (iface) vlan and not vlan 4 and not vlan 8 and not vlan 96


    This will not work as you expect due to the above-referenced quirk in how

    tcpdump handles multiple vlan expressions. The however will work and

    show traffic associated with all VLAN tags, except the known ones (4, 8, and 96)

    in our example):


    ```

    tcpdump -c 100 -eni (iface) vlan and not "(ether[14:2]&0x0fff = 4 \

    or ether[14:2]&0x0fff = 8 or ether[14:2]&0x0fff = 96"

    ```


    (Note the ‘\’ at end of line 1 of command is a backslash and allows us to

    continue the same command on a new line)'
