    # RX-DRP Culprit 2: Unexpected or Invalid VLAN Tags


    The following three situations can also cause RX-DRP to increment on an interface:


    +   1. The firewall’s interface is not configured for 802.1q VLAN tagging (it
    is just using a directly assigned IP address with no subinterfaces), yet is receiving
    VLAN-tagged frames from the switch. The tagged frames will be discarded and RX-DRP
    incremented.

    2. The firewall’s interface is configured for 802.1q VLAN tagging via subinterfaces
    for a quantity of known VLAN tags; however it is also receiving tagged traffic
    referencing an unknown VLAN tag. These frames will be discarded and RX-DRP incremented.

    3. The firewall’s interface is configured for 802.1q VLAN tagging via subinterfaces
    for a quantity of known VLAN tags, however it is also receiving untagged traffic
    (possibly from the “native” VLAN) and the leading/untagged physical firewall interface
    has no IP address configuration set. These untagged frames will be discarded and
    RX-DRP incremented. to say these situations indicate a misconfigured network;
    VLAN traffic is not being properly pruned by the switch attached to the firewall.
