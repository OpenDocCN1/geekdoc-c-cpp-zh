    # Packet/Throughput Acceleration: The Three Kernel Paths


    Properly tuning Packet/Throughput Acceleration tends to yield the “biggest bang
    for the buck” when it comes to the optimization effort involved in the real world.
    While Session Rate acceleration can avoid computationally expensive base lookups
    at the start of the connection (such as at the start of a TCP 3-way handshake),
    Throughput accelerates the packets associated with connections that actually carry
    data. Even small gains in performance turning up into real, measurable improvement
    when thousands or millions of packets are involved.


    Let''s take a closer look at the fwaccel stats -s command output, and focus on
    the fields relevant to packet/throughput acceleration.


