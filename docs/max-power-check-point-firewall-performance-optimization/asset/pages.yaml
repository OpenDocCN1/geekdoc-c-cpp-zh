  md: '“fast drop” rules have absolutely nothing to do with the main Security Policy’s
    rules visible in the SmartDashboard/SmartConsole. Unless Drop Templates are in
    use, only accepted traffic is to be accelerated by SecureXL Session Rate Acceleration
    templates. Traffic that does not match an Accent Template will have to be forwarded
    to the Firewall Path for the Security Policy evaluation and subsequent drop to
    occur. This will of course incur far more CPU overhead than immediately dropping
    the traffic directly in the Accelerated Path instead. Drop Templates can be added
    and modified from the CLI using sim dropcfg command. In versions R70-R75.30, a
    well-hidden Global Properties checkbox called “enable_drop_templates” was used
    to toggle the entire Drop Templates feature off and on for all managed firewalls.


    For reasons various the original Drop Templates feature was not very well-known,
    and caused numerous problems when it was implemented by firewall administrators.
    The problems were severe enough that the “enable_drop_templates” checkbox disappeared
    from the Global Properties in version R75.40, never to be seen again. The implementation
