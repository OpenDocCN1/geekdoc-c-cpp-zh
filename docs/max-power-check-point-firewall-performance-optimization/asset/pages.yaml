  md: 'Spikes in any of these statistics around the time of the performance issue
    should most definitely be investigated further. The following table summarizes
    the useful options we can pass to sar, the equivalent screen in cpview (if applicable),
    and the preferred tool:


    # Table 8: sar vs. cpview for Viewing Historical Data


    | sar Option | cpview Screen | Preferred Tool & Notes |

    | -n DEV | Network.Interfaces.Traffic | cpview - Both tools show similar network
    traffic statistics, but cpview has better time granularity; SmartView Monitor
    reports can also be used to graph this data |

    | -n EDEV | Network.Interfaces."Errors and Drops" | sar - Shows network error
    counters incremented per 10-minute interval, cpview shows only running totals
    |

    | -P ALL | CPU | cpview - Both tools show similar utilization data, but cpview
    has better time granularity; SmartView Monitor reports can also be used to graph
    this data |

    | -r | Overview."Memory" | sar - Shows more detailed memory stats including memory
    allocated for buffering/caching; SmartView Monitor reports can also be used to
    graph this data |

    | N/A | Overview."Network" | cpview - Check for sudden increases in new "Connections/sec",
    "Concurrent connections" & "Packets/sec" |

    | -A | -p | Dump all possible data/screens once |'
