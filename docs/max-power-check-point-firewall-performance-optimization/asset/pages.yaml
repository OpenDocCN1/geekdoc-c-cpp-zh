  md: '# 428 Diagnosing Intermittent Performance Issues


    # Historical Statistics Granularity – cpview vs. sar


    Sar and cpview are wonderful tools that can be run live to examine real-time statistics
    with a very high degree of granularity. When running these tools in live mode,
    the minimum granularity for the sar command is 1 second, while cpview can have
    a refresh rate as low as 0.1 second. This level of granularity should be more
    than sufficient for just about every situation you wish to observe, no matter
    how fleeting it may.


    However when using these tools in historical mode, the available granularity is
    significantly reduced. By default sar only reports historical statistics every
    10 minutes, and the numbers reported for variable items like CPU usage are averaged
    inside that 10 minute period. The cpview daemons that record its history data
    take a sampling of variable statistics every 30 seconds, then return the average
    of those two samples once a minute. While the granularity offered by cpview in
    history mode may appear more than sufficient, there are some limitations to keep
    in mind. A spike in CPU utilization that lasts 20 seconds, but is not occurring
    one of the cpview historical sampling captures every 30 seconds will not show
    up at all, while being easily detectable from cpview in live mode. Obviously for
    accumulated data that only increase, such as network counters that track total
    number of packets sent and received, the granularity limitations are not as important.
    While sar averages its data points over a 10-minute interval, abound here too.
    For example in sar’s 10-minute interval measuring all if a firewall’s cores are
    99.9% idle for 9 minutes and then 100% utilized for 1 minute, sar will report
    overall average CPU utilization during that period as only 10%, which is technically
    accurate but misleading.'
  merge: -1
  pgno: 456
- img_proc: true
  md: '# Historical Statistics Granularity – cpview vs. sar 429


    So we can see thus far cpview does offer superior historical granularity when
    compared to sar, so we will generally prefer cpview whenever possible. However
    there are some statistics not available in cpview that only sar can provide, and
    we will utilize sar in those cases. Both tools automatically record their historical
    data by default, and cpview data is kept for 30 days on the firewall. Sar keeps
    its historical data for 7 days, however this can be increased by editing the /etc/


    sysconfig/sysstat file.


    cpview’s historical data is stored in a database format, and can only be viewed
    directly from the CLI by using the cpview utility itself. However the historical
    data stored by sar can not only be queried with the sar command itself, but a
    readable copy of all sar’s historical values for a particular day is also stored
    in the file /var/log/sa/saXX, where XX is the day of the month. (Note that the
    very similar looking filename/var/log/sa/saXX is what the command queries when
    executed in historical mode and is not directly human-readable). The sarXX file
    is great for searching with grep or just for perusing around the date and time
    of performance problem, and is essentially the equivalent of running sar -A (show
    all statistics) for that date.


    # Running sar and cpview Historical Reports


