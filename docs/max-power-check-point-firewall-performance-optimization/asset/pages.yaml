- img_proc: true
  md: '# Specific Recommendations by Number of Cores 231


    reached. If you reach the ring buffer maximum size for your NIC with an RX-DRP
    rate greater than 0.1%, I regret to inform you that your firewall is not appropriately
    sized for your environment. You could try turning CoreXL back after performing
    SecureXL, but you are very likely to end up back at the same conclusion: your
    firewall is oversubscribed for the network load it is being asked to process;
    time to get budgetary numbers in place for new firewall hardware. The Check Point
    cpsizeme tool can be quite helpful in determining how big of a firewall appliance
    you will need to purchase. See sk88160: The Check Point Performance Sizing Utility
    for more details.


    # Special Case: 4 Cores


    By default a 4-core firewall has 1 core dedicated to SND/IRQ processing, and 3
    cores allocated for Firewall Worker/INSPECT operations. Notice that cores 0 and
    1 are performing different functions and will experience CPU cache thrashing "out
    of the box", while cores 2 and 3 are dedicated to Firewall Worker/INSPECT operations
    only and will run efficiently. This issue will be somewhat mitigated by the presence
    of L3 cache shared by all cores on new CPU architectures (present). Generally
    in this configuration the single core handling SND/IRQs will quickly become overwhelmed
    and begin accumulating RX-DRP''s in excess of 0.1%, before the idle percentage
    of the 3 Firewall Worker cores drops below 40%. The lack of sufficient processing
    resources on core 0 essentially limits how much data the Firewall Worker can receive
    and keeps its idle percentage high; it will almost certainly be above the required
    minimum specified in the table above. If RX-DR''s on one or more interfaces is
    in excess of 0.1%, it is a no-brainer on a 4-core system to reduce the number
    of Firewall Worker'
