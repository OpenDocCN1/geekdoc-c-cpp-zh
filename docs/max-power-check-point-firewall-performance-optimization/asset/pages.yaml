    traffic. There is a stream of ACKs being sent by the system through the core router,
    back to the firewall and to the Internet in the forward direction, but these are
    small, relatively infrequent packets that are not dramatically impacted. In this
    case the user sees very good code transfer performance and is not directly affected
    by the heavy load on the core router.


