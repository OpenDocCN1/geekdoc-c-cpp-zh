  md: '# SecureXL Throughput Acceleration


    # SecureXL Throughput Acceleration: Key Points


    +   - SecureXL should be enabled for maximum performance; SecureXL can be selectively
    disabled for certain IP addresses if needed to ensure application compatibility.

    - SecureXL Throughput Acceleration permits optimized handling of existing connections
    in three possible kernel-based paths: SXL, PXL and F2F.

    - Use of the IPS and Threat Prevention features is the most common reason that
    traffic cannot be exclusively handled in the Accelerated Path.

    - IPS Performance Impact rankings directly indicate whether traffic can be handled
    in the Accelerated, Medium or Firewall Path.

    - Avoid using “Any” in the Protected Scope column of the Threat Prevention policy
    if possible.

    - Firewall Worker CPU load can be dramatically lowered by “null” Threat Prevention
    profiles and Global Exceptions.

    - Ideally no more than 20% of traffic should be handled in the Firewall Path on
    a properly tuned firewall.

    - The `fwaccel` command can be used to determine conclusively which kernel-based
    processing path (SXL, PXL, or F2F) is handling a certain connection.

    - The `sim dbg` command can (carefully) be used to determine why large amounts
    of traffic or certain connections seem to be constantly stuck in the Firewall
    or Medium Paths.'
  merge: -1
