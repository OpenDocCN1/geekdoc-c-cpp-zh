    amounts of bandwidth?


    One could potentially create a TP exception for at least some connections initiated
    from a DMZ system to another DMZ, or even connections initiated from a DMZ system
    to the internal network. A classic and very tempting example is network backups.
    Every night gigantic amounts of data traverse the firewall sourced from DMZ systems
    heading for the backup server, which could be located in another DMZ or perhaps
    somewhere on'
