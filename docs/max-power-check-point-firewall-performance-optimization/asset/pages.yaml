    # Determining the Busiest Times of Day


    Generally speaking, we will want to analyze performance and run various commands
    during the busiest periods on the firewall, and on the active cluster member if
    High Availability is employed. While performance issues can be investigated after-the-fact
    with tools such as sar and cpview as detailed in Chapter 14, the available level
    of granularity will be much lower if using these tools in historical mode.


    If you have the Monitoring Blade, determining the busiest time of day will be
    a snap; on the left-hand side of the SmartView Monitor select the System Counters...Firewall
    History report. Select the gateway you wish to inspect and once the report appears,
    select “Last Week” for the timeframe. Note the busiest times of day for the firewall.
    In many organizations it tends to be in the morning and immediately after lunch
    break. Another very busy period can be when nightly backup traffic traverses the
    firewall.


    If you do not have the Monitoring Blade, run the sar -u command on the firewall:'
