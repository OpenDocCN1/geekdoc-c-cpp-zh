    rules beneath the rule referencing the FTP service can still be templated. What
    other types of connections cannot be individually templated?


    +   - VPN traffic cannot be individually templated. Connections that are encrypting
    into a VPN tunnel outbound, or decrypting from a VPN tunnel inbound, are not eligible
    for Session Rate Acceleration via Accept Templates. (In a prior chapter we also
    noted that most VPN traffic is not eligible for Throughput Acceleration, either,
    and on an R77.30 firewall must make the Firewall Path on the lowest-numbered Firewall
    Worker core)

    - Complex connections (FTP, H323, etc.) cannot be individually templated.

    - “Complex Connections” are generally defined as protocols that dynamically data
    ports on the fly.

    - Non-TCP and Non-UDP traffic (including ICMP & GRE traffic) cannot be individually
    templated. Only TCP connections and UDP traffic are eligible for templating.


    Once again, the presence of these situations in your security policy rulebase
    does not disable templating of subsequent rules; it precludes the use of templating
    for these individual connections.


