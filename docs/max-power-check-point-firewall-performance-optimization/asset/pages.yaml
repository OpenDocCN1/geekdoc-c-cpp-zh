  md: '# Basic Gaia Optimization


    As it turns out this process is related to the scrubd process which sk97638 lists
    as part of the Threat Extraction blade feature. Using pstree can help determine
    the origin of a runaway process when the name of the process itself (or its arguments)
    is not enough to determine its purpose and whether we should do something about
    it.


    Another command that can provide some insight for a mystery process consuming
    excessive CPU is lsof (Li Open Files). Once the process ID has been determined
    (15215 in our example) run lsof -p 15215. The output will show all files currently
    being accessed by the process, along with all open network connections and TCP/UDP
    ports the process is currently listening on (if any).


    A final option that is guaranteed to satisfy even the most voracious seeker of
    information about a pesky process, is to use the trace binary (similar to the
    truss command on Solaris) and dynamically attach it to the problematic process
    with the -p option. This allows real-time monitoring of all system calls made
    by the process in an attempt to determine what it is accomplishing. trace is not
    included by default with Gaia (and its is not officially supported) but you can
    install the precompiled CentOS version of trace available here:


    http://vault.centos.org/3.8/os/i386/RedHat/RPMS/strace-4.5.14-0.EL3.1.i386.rpm


