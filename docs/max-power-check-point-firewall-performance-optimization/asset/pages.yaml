  md: '# 94 Basic Gaia Optimization


    top offenders will be listed first. In our example the top offender is 0a1e0b53
    (0a=10, 1e=30, 0b=11, 53=83) or 10.30.11.83. This IP address is consuming about
    12,322 slots in the connections table, which is quite excessive for a single IP
    address unless it is some kind of proxy server or terminal server. If that IP
    address is not some kind of server, the classic scenarios that cause this behavior:


    +   - The host is infected with some kind of self-propagating virus or worm that
    is sending thousands of short-lived connection requests

    - The host is running a port scan or performing some kind of network discovery
    that involves a very high number of connection requests (as in the case of an
    auditor, penetration tester, or the CEO’s extremely bored by very bright child)


    Remediation to deal with this annoying situation (other than not-so-politely telling
    the perpetrator to knock it off) are covered in the Chapter 7 section “CoreXL
    Firewall Loader Distribution” and Chapter 13. Another tool that can provide visibility
    into precisely which is hogging slots in the connections table is the “Top Talkers”
