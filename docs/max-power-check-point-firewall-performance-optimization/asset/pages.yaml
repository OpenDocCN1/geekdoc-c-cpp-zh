    # What about VRRP?


    While this chapter focuses on ClusterXL which is by far the most common clustering
    technology engaged in new Check Point deployments, another option is available:
    Virtual Router Redundancy Protocol (VRRP). This popular clustering protocol was
    originally made available on the IPSO-based IP series appliances (formerly known
    as Nokia appliances), and VRRP is also supported by the Gaia operating system.

    Unfortunately VRRP has several drawbacks compared to ClusterXL although VRRP still
    has its dedicated adherents:


    +   - Cluster IP addresses must be separately up in both the SmartConsole and
    Gaia web interface, and manually kept in sync with each other.

    - Cluster split-brains (both HA members mistakenly being active/master of the
    same time) and routing "black holes" are much more likely due to a configuration
    mistake in a VRRP implementation.

    - Monitoring of VRRP cluster state from the Check Point GUI tools such as SmartConsole
    & SmartView Monitor is limited; VRRP state monitoring must be performed from the
    firewall CLI or Gaia web interface.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# 176 ClusterXL HA Performance Tuning


    ClusterXL and VRRP mostly provide the same features in regards to active/standby
    capabilities, ClusterXL is dramatically easier to manage in day-to-day operation
    and far less error-prone from a configuration perspective. However VRRP does two
    additional capabilities that ClusterXL does not, namely:


    +   - VRRP can present more than one IP address (sometimes called a secondary
    address) on the same physical interface or logical subinterface, whereas ClusterXL
    can present only one. This is a relatively rare requirement though, since it usually
    indicates that more than one IP subnet is on the same VLAN/network segment, which
    is generally indicative of poor network design.

    - VRRP can allow an external entity as a load-balancing appliance or dynamic routing
    protocol to balance the traffic load between the cluster members; ClusterXL can
    only use its own load-sharing algorithms in Load Sharing mode.


    If neither of these two use cases for VRRP applies in your environment, ClusterXL
    is strongly recommended. We will focus on ClusterXL for the remainder of this
    chapter as ClusterXL is much more commonly used than VRRP in most firewall deployments.


