  md: '# Gaia Memory Management


    Run the command **free -m**. Some sample output is provided:


    ```

    [Expert@firewall:0]## free -m

    | total used free shared buffers cached |

    | Mem: 7840 3760 4079 0 276 1126 |

    | -/+ buffers/cache 2357 5483 |

    | Swap: 18457 0 18457 |

    ```


    Figure 4-9: Viewing Gaia Memory Statistics with free -m


    Let''s discuss this in detail; the first number on the second line (7840 in our
    sample output) is the total amount of RAM installed in the firewall, or at least
    how much that is recognized by the operating system. The second number (3760)
    is the total amount of RAM consumed for execution of code and buffering/caching
    of hard drive operations. **shared** is always zero. **buffers** indicates RAM
    that is allocated for buffering of disk I/O operations. **cached** is the amount
    of RAM allocated to store directory listings and file attributes for fast filesystem
    access. The RAM allocated to both buffering and caching is not used for actual
    execution of code, and could be freed and reallocated at any moment if RAM was
    needed for code execution.


    This brings us to the third line: 2357 is the amount of RAM allocated on the system
    for code execution; it does not include the RAM allocated for buffering and caching.
    5483 is the amount of currently free RAM available to be allocated for execution.
    Notice that if you subtract the RAM allocated for buffering and caching (276+1126=1402)
    from the total amount of RAM reported on the second line of output (3760), you
    get approximately the value 2357, which is the used amount reported on the third
    line of output. Therefore in our example, 2357 represents the true amount of RAM
    consumed by the firewall for execution of code. The value reported by you'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'firewall on the second line (4079 in our example) may look extremely low in
    some cases, leading you to conclude that the firewall is running low on RAM. Nothing
    could be further from the truth. The free value reported on the third line (5483
    in our example) reports the true amount of RAM readily available for code execution
    when not taking buffering and caching into account.


    Ideally, the fourth line of the free command output is reporting zero for swap
    used as shown the previous screenshot. If this value is nonzero, this indicates
    that the firewall is (or was) low on free RAM memory at one point and had to page
    at least a portion of the system memory allocated for processes to disk. The larger
    swap used the bigger performance hit. This use of virtual memory due to a lack
    of RAM can be highly destructive to firewall performance and should be avoided
    if at possible.


    **Question:** My system is low on free memory as reported on the third line of
    the free -m output and/or "Swap used" being shown as nonzero. What is consuming
    so much memory on the firewall?


    Answer: Run the top command and hit M (upper-case M). This will change the default
    sorting which would normally show the processes using the most CPU first; now
    the processes using the most memory will be first. Once again disregard the fw_worker
    processes which we will discuss in a later chapter. Do you see any other processes
    using an extremely large amount of memory in the RES column? It is possible that
    process is a runaway or otherwise leaking memory. Depending on the identity of
    the offending process you may be able to kill it (and let it automatically restart)
    without causing a service outage. Contact the Check Point TAC for assistance in
    making this determination.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Basic Gaia Optimization


    Question: My free -m is reporting the total amount of RAM as approximately 4096,
    but I know for a fact the system has at least 6GB of RAM. What’s wrong?


    Answer: The Gaia operating is running in 32-bit mode. If a firewall was initially
    configured with less than 6GB of RAM then had its memory upgraded, Gaia may still
    be running in 32-bit mode. As long as a minimum of 6GB RAM is present in the system,
    you can set Gaia for 64-bit operation to take advantage of that additional memory
    capacity. Check the edition (32-bit or 64-bit) by running the clish command show
    version os edition. To change from 32-bit to 64-bit operation run the command
    set edition 64-bit from clish, execute a save config command, and then reboot
    the system.


    # Gaia Memory Zone Reclaim


    NUMA (Non-Uniform Memory Access) allows multiple cores to access the system’s
    RAM simultaneously in the Gaia operating system. It does this by dividing the
    system’s RAM into several zones and allocating each core its own dedicated zone
    of memory. When a particular zone runs low on memory and cannot satisfy a memory
    allocation request, a “reclaim” routine can be launched in an attempt to free
    up memory inside that same zone that is not currently being used, or is not expected
    to be used. Unfortunately this reclaim process is quite intensive, and can cause
    seemingly random slowdowns when memory-intensive processes are attempting to execute
    on the firewall.


    Run the following command: cat /proc/sys/vm/zone_reclaim_mode. The returned result
    should be “0” for optimum Gaia memory management, and is normally'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Firewall Disk Space Check


    set to zero by default. If you receive a “no such file or directory” error message,
    it means that either the system’s processing hardware is not capable of NUMA,
    or that the Gaia OS is running in 32-bit mode in which case NUMA cannot be used.
    When zone_reclaim_mode is set to zero and a zone does not have enough free memory
    to satisfy an allocation request, the needed memory is simply allocated from another
    zone that does not have free memory before embarking on the intensive zone reclaim
    procedure.


    If zone_reclaim_mode is somehow set to a non-zero value on your firewall, see
    the following SK for instructions about how to permanently set it to zero: sk109772:
    R77.30 NGTP, NGTX and HTTPSS Inspection performance and memory consumption optimization.


    # Firewall Disk Space Check


    Question: Is my firewall running out of disk space?


    Answer: Run the command df -h. If any partitions show more than 90% utilization,
    cleanup of files will need to be attempted. Determine which partition is near-full
    (/, /opt, /var/log, etc) and run this command:


    ```

    find /var/log -mount -type f -size +1000000 -ls

    ```


    Look at the files and delete them if possible; old cfpos or debug captures frequently
    consume large amounts of disk space and can be removed. If no files show up in
    the find output, remove one zero from the +1000000 part of the command and run
    it again. If you can’t find any large user-generated files to delete, the cleanup
    script provided by Check Point here: sk91060: Removing old Check Point packages
    after an upgrade on Security Gateway / Security Management Server. If you still'
