    H will detect the collision, the frame as deferred, and then try to send the same
    frame after a negligible backoff delay (usually less than 1 millisecond). However
    since F is set for full-duplex with collision detection disabled, F has no idea
    the frame it just sent was mangled and lost. It is now up to the TCP stack to
