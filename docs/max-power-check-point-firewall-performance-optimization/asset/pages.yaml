  md: '# 216 CoreXL Tuning


    # Allocating More CPU Resources for SoftIRQ Processing


    So we have observed an RX-DRP rate >0.1% on one or more interfaces. Next we need
    to determine if there are sufficient CPU resources allocated to handle network
    interface SoftIRQ processing on your firewall. We can then tune the firewall in
    productive ways that hopefully won''t involve increasing RX buffer sizes or the
    SoftIRQ budget, both of which should always be considered a last resort.


    Let’s take a look at how we do that. Run netstat -ni on the firewall and note
    any interfaces that have nonzero RX-DRP counters. Compute the RX-DRP rate as demonstrated
    earlier; any interfaces showing an RX-DRP rate in excess of 0.1% are good candidates
    for tuning. Let’s suppose that interfaces eth0 and eth1 are extremely busy and
    both exhibiting signs of excessive RX-DRPs. Let’s look at how SoftIRQs are being
    processed for these interfaces with this command:


    ```

    cat /proc/interrupts

    ```


    (widen your terminal display to avoid line wrapping)


    Look along the right-hand side of the output and find interfaces eth0 and eth1.
    On the same line with each interface, look back to the left and find any columns
    with nonzero counters. You see something like this:'
