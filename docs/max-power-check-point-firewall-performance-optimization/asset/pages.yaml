    appliance model numbers 5600 and higher support AES-NI, *except* the 1200 model
    and the obsolete Power-1 9000/1100 series. The 3100 and 3200 appliance models
    also support AES-NI.


    +   3. Make sure there is adequate idle time available on the Firewall Worker
    cores during the firewall’s busiest period. For every Firewall Worker configured
    one **wttsd** process is spawned, which handles the initial HTTPS negotiation
    (and key calculations that Gaia is running in 32-bit mode) for all inspected HTTPS
    connections on that particular Firewall Worker core. If the cores assigned to
