    When Drop Optimization is enabled, the default threshold dictates that if more
    than 101 drops per second occur on an individual Firewall Worker core, the feature
    activates. Drop Templates for the offending traffic are automatically formed and
    inserted into the SecureXL Acceleration Layer; drops begin occurring immediately
    in the Accelerated Path with no need to visit the Firewall Path, thus saving valuable
    CPU resources on the Firewall Worker cores.


    Once the number of drops declines less than 20 per second (based on the default
    thresholds), the Drop Optimization feature deactivates and all the dynamically
    created Drop Templates are removed from the Accelerated Path. Drops now occur
    once again in the Firewall Path, with full logging if specified in the Track column
    of the security policy rule matching and dropping the traffic.'
