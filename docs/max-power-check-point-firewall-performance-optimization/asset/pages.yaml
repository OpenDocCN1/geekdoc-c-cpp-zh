    # Discovery: SMT/Hyperthreading


    Question: Is SMT (Simultaneous multithreading) enabled?

    Answer: Run cat /proc/smt_status. Three results are possible:


    +   **Unsupported** - Your firewall appliance does not meet at least one of the
    many requirements for SMT/Hyperthreading detailed below.

    **Soft Disable** - Your firewall appliance hardware supports SMT/Hyperthreading,
    but it has not yet been enabled from `cpconfig`.

    **Enabled** - SMT/Hyperthreading is enabled. The default for Check Point appliances
    is disabled, so SMT/Hyperthreading was explicitly enabled at some point.

    SMT/Hyperthreading support was introduced in the R77 release and allows a Check
    Point firewall appliance to take advantage of Intel’s CPU Hyperthreading feature
    (technically called Simultaneous multithreading or SMT) in certain processor architectures.
    Until the release of version R77, SMT/Hyperthreading was always disabled on all
    Check Point appliances, and Check Point strongly recommended always disabling
    Hyperthreading with CoreXL. While Intel claims as much a 50% performance boost
    can be'
