    (and therefore packet loss) increases and the useful network throughput plunges
    rapidly. Box will log CRC, framing & late collision interface errors; if a late
    occurs H will not attempt to send the frame again so there can be some frame loss
    from H to F as well. F will not log collisions but will try to log runs & framing
    errors as H abruptly ceases transmission in the middle of a frame when it senses
    a collision is occurring.


