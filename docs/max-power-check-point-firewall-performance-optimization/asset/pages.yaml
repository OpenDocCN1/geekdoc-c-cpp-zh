  md: '# ClusterXL HA Performance Tuning


    # Selective Synchronization of Services


    By default the members of a firewall cluster will synchronize the state of all
    connections between them. If the amount of sync traffic is so heavy that the firewall
    CPUs cannot keep up, processing time is wasted retransmitting and processing the
    lost sync updates. In most networks there are two protocols in particular that
    comprise at least 50% of state sync network traffic: HTTP and DNS. To determine
    if this is the case in your network, from SmartView (or cpview) execute the “Top
    Services” report in real-time while your firewall is in one of its busiest periods.
    Do protocols HTTP and DNS account for a very large number of new connections?
    It is possible to disable synchronization of HTTP and DNS between cluster members,
    which will dramatically reduce the amount of sync traffic and almost certainly
    make the sync network healthy again, albeit with one consequence: If a failover
    occurs, any active HTTP or DNS connections will be unknown by the firewall taking
    over, and therefore will be treated as “out of state” and subsequently dropped.


    In most cases this is not a problem because if a HTTP connection or download stalls,
    by the time the user hits the refresh button the new firewall is fully operational
    and the web page rendering or file download picks up where it left off. DNS uses
    the User Datagram Protocol (UDP) as its transport. UDP does not provide reliability
    anyway so DNS will just resend a query that. By that time the other firewall has
    taken over and the retransmitted DNS lookup succeeds.


    However we can take Selective Synchronization a step further in a quite useful
    way. Suppose we have two types of HTTP traffic in our network:'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Selective Synchronization of Services 193


    +   * Slackers: HTTP connections initiated outbound to the Internet by our internal
    slacker user population, who is just screwing around on Facebook and not making
    the company any money


    +   * Money-making: HTTP connections initiated inbound from the Internet to our
    web servers by paying customers, who want to pay us money on the final day of
    the calendar quarter and ensure our executives get their bonuses


    Needless to say, for career security purposes we might want to preserve the latter
    HTTP connections across a failover (it is never a good idea to make a customer
    do anything extra like hit reload while in the process of spending money), but
    we don’t particularly care about the outbound “slacker” HTTP connections in a
    failover scenario. Frankly we can specify synchronization by individual service.
    So for our example we create two new service objects called “http_customer” and
    “http_slackers”, and set both for destination port 80 on the “General” screen.
    While both services are set to match port 80, on the Advanced screen of the http_customer
    service we ensure that “Synchronize connection on cluster” remains checked, and
    on the service http_slackers that same option is UNchecked like this:'
  merge: -1
  pgno: 221
- img_proc: true
