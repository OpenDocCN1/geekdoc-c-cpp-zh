    Normally this situation will not cause a dramatic performance issue, but in general
    it is desirable to avoid asymmetric routing in a network. As an example of why,
    let’s suppose the internal core router is overloaded by numerous backups running
    several different VLANs on the internal networks. A user on the no-man’s-land
    workstation initiates an FTP to the Internet and gets a large file. The main flow
