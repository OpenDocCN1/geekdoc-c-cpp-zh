  md: 'SecureXL automatic interface affinity can be found here: sk63330: Explanation
    about ''sim affinity -c'', ''fwaffinity used cpus'', ''fw ctl affinity -l''.


    Now that you''ve been convinced that SecureXL is desirable and necessary by my
    skillful of persuasion, we will go into a brief overview of SecureXL. What does
    it do and how can it help firewall performance? Next we will talk about how to
    optimize the performance of your firewall with SecureXL, such that the processor
    load on the Firewall Worker cores can be significantly reduced. SecureXL is sometimes
    called “Performance Pack” or the “fastpath” in official Check Point documentation.


    # SecureXL Introduction


    SecureXL has two main separate functions:


    +   **Throughput Acceleration** (a.k.a. Packet Acceleration): The ability to expend
    less CPU by performing some security processing via a highly optimized Accelerated
    Path, increasing the overall throughput capability of the firewall.


    +   **Session Rate Acceleration** (a.k.a. Connection Rate Acceleration): The use
    of “Accept Templates” to expend less CPU when deciding whether to allow a new
    connection to be established. This portion of SecureXL will be covered in Chapter
    11.


    In all Check Point firewall appliance models up to and including the 23000 series,
    SecureXL simply exists as a highly optimized software kernel driver called Acceleration
    Layer (or Accelerated Path) that runs on all cores designated for SND/IRQ processing.
    The Firewall Worker cores handle more intensive security inspection functions
    in the Medium and Firewall Paths. We will cover all three kernel processing paths
    in this chapter.'
  merge: -1
  pgno: 309
- img_proc: true
