  md: '# Syslog – A Frequently Effective Shortcut 427


    Point inspection code that can be quite informative. As such we will be taking
    a bit of a shortcut here and investigating syslog messages early in our efforts,
    which can indicate problems practically anywhere on the firewall.


    Unfortunately so many messages can be redirected to these syslog files that they
    can overflow, and the oldest message files will be rolled off and automatically
    deleted. This effect can cause older syslog log files you are seeking to be unavailable,
    which is frustrating to say the least. However there is a solution to ensure that
    these logs will always be available for retroactive inspection: configure the
    firewall to automatically forward all your syslog logs via the Check Point logging
    mechanism to the Security Management Server for storage. Now even syslog files
    that have rolled off the firewall will still be available, and you’ll be able
    to use the great search capabilities of R77.30 SmartLog or the Logs & Monitor
    tab of the R80+ SmartConsole! Setting logs to be automatically forwarded to your
    Security Manager for all your firewalls is highly recommended if you don’t already
    possess some of external syslog monitoring product such as Splunk; the procedure
    to do so is detailed here:


    sk102995: How to export syslog messages from Security Gateway on Gaia OS to a
    Log and view them in SmartView Tracker.


    When looking at syslog entries, any suspicious log entries occurring around the
    time of the problem starting or recurring are worth your time to investigate.
    Here is a partial list of the typical messages you might see and their meanings:
    sk33219: Critical error messages and logs. However the log messages you might
    encounter here are nearly limitless, so you’ll almost be performing SecureKnowledge
    and Internet searches in an attempt to determine what the messages mean, and what
    you should do about them. The Check Point TAC can also be helpful in this regard,
    as well as CheckMates (community.checkpoint.com) and CPUG (cpug.org).'
