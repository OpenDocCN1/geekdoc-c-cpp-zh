    SecureXL acceleration driver (if SecureXL is enabled) or the Check Point INSPE
    driver (if SecureXL is disabled). A tcpdump capture is currently running, libpcap
    will also be a “registered receiver” in that case, and receive a copy of the frame
    as well.


    During hardware interrupt processing, the NIC driver will examine the EtherType
    field and verify there is a “registered receiver” present for the protocol specified
    in the frame header. If there is not, the frame is discarded and RX-DRP is increased.
    Example: an Ethernet frame arrives with an EtherType of 0x86dd indicating the
    presence of IPv6 in the Ethernet frame. IPv6 has not been enabled on the firewall
    (it is off by default), the frame will be discarded by the NIC driver and RX-DRP
    incremented. What other protocols are known to cause this in the real world? Let’s
    take a look at brief sampling of some other rogue EtherTypes you may see, that
    is by no means complete:


    +   - Appletalk (0x809b)


    +   - IPX (0x8137 or 0x8138)


    +   - Ethernet Flow Control (0x8808) if NIC flow control is disabled


    +   - Jumbo Frames (0x8870) if the firewall is not configured to process jumbo
    frames


    The dropping of these protocols for which there is no “registered receiver” does
    cause a very small amount of overhead on the firewall hardware interrupt processing,
    but unless the number of frames discarded in this exceeds 0.1% of all inbound
    packets, you probably shouldn’t worry too much about it.


    But how can we find out these rogue protocols, and are more importantly figure
    out where they are coming from? Run this tcpdump command to show every frame not
    IPv4 traffic or ARP traffic based on the EtherType header field:


    ```

    tcpdump -c100 -eni (iface) not ether proto 0x0800 and not ether proto proto 0x0806

    ```'
