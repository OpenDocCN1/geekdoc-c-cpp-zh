  md: '+   * Automatic NAT: Selecting the NAT tab of a network object, configuring
    Static or Hide NAT, and specifying the NAT address to use. This technique will
    auto-create the needed NAT rules in the NAT policy.


    +   * Manual NAT: Direct manipulation of the NAT policy by adding your own manual
    rules. This technique provides far more granularity for specifying precisely how
    NAT is to be performed by the firewall.


    In general using the Automatic NAT setup technique is recommended. It will handle
    the majority of NAT scenarios well, and helps gloss over some of the internal
    details of how NAT works (such as having to deal with Proxy ARP). If the Automatic
    setup is handling all the NAT on your firewall, there is very little to do as
    far as optimization. A quick look at the NAT policy reveals that the order of
    automatically generated NAT rules cannot be changed (all automatic Static NATs
    will be followed by all automatic Hide NATs) and there is no “Hit Count” column.


    NAT policy lookups always take place in the Firewall Path (F2F) unless NAT Templates
    are enabled (which are discussed in Chapter 11). If employing manual NAT rules
    on your firewall, based on some of the other recommendations in this chapter,
    your first inclination might be to move what you suspect (but cannot confirm)
