    # CCP: Multicast vs. Broadcast


    Question: When examining Control events in the SmartView Tracker/SmartLog or using
    the filter "type:Control" on the Logs & Monitor tab of the R80+ SmartConsole,
    I''m seeing constant messages about interfaces in the cluster flapping up and
    down, with occasional spurious failovers and degraded performance. What is wrong?


    Answer: Check for a nonzero carrier value for the interface(s) reported to be
    flapping using the ifconfig command, to ensure the NIC hardware itself is not
    changing link state due to a loose network cable or other physical issue.


    If the interface is found to be stable and not losing integrity, the switch attached
    to the firewall may not be reliably forwarding the cluster member''s Cluster Control
    Protocol (CCP) traffic due to its multicast nature. As a result, the firewalls
    occasionally lose contact with each other and declare the interface between them
    to be “down”, even though the physical interface itself is up, and general network
    connectivity between the two cluster members is actually fine on the “down” interface.
    The switch may need to have IGMP snooping configured to handle multicast traffic
    reliably. In addition some switches like the Cisco Nexus 7000 will drop multicast
    traffic that uses a multicast MAC address, but also not use a "traditional" Class
    D'
  merge: -1
