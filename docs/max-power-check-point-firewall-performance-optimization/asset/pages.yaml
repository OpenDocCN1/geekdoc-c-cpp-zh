    # Sending a TCP RST upon Connection Expiration


    Some applications (such as web servers backing into a database server with a SQL
    connection) create a large number of TCP connections, yet never send any appreciable
    amount of data in them. All stateful inspection firewalls (including Check Point)
    enforce an idle timer on all open connections. Check Point’s TCP connection idle
    timer is set to 60 minutes by default. Unfortunately when the Check Point idle
    timer expires a TCP connection, by default that connection is silently removed
    from the firewall’s state table, and no notification of any kind is sent to the
    two systems that established the TCP connection. When one of their attempts to
    send some data to the now-dead connection, it is promptly dropped by the firewall
    with a “TCP out of state” Regrettably some applications are just too stupid to
    quickly realize the connection is dead; they continue attempting to use it while
    their traffic continues to be dropped.


    At some point, one or both of the end systems involved finally figures out their
    connection is truly and irrevocably dead, launches a new TCP connection that is
    immediately permitted by the firewall, and everything starts working again. Depending
    on how long it takes one or both sides to figure out what happened, the application
    may appear to be hung and the user’s perception of overall application performance
    will be'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'terrible. Undoubtedly the firewall will be blamed for the application’s behavior,
    and once again the firewall administrators must exonerate themselves. There are
    three solutions to this problem:


    +   1. Enable TCP keepalives on one or both of the systems participating in the
    TCP connections that keep getting idled out. The keepalives will need to be sent
    at least every 60 minutes. This is not a popular choice as it involves application
    system changes to fix what is perceived as a “firewall problem”.


    +   2. Increase the idle timeout for the Service object (SQL in our example) on
    the Advanced tab of the service object from the default of 60 minutes up to a
    maximum of 86400 seconds (24 hours) This will probably help but is not foolproof:'
  merge: -1
