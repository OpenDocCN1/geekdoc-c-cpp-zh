- img_proc: true
  md: '# Process Space Trips: The List 349


    +   - Newer Check Point features are frequently implemented as processes, and
    those features may eventually be moved down into the kernel for increased efficiency

    - Firewall processes also handle “potentially unsafe” situations where a hostile
    peer may try to crash or otherwise DoS the firewall

    - Firewall processes are also employed to send requests to external servers such
    as the Check Point ThreatCloud, and “wait around” for a response which permits
    the kernel to resume processing other traffic; when the response arrives it is
    sent back to the kernel code that requested it


    # Process Space Trips: The List


    Now that we''ve established the basics of process space trips on a Check Point
    firewall, let’s get into exactly what features and options will incur a trip out
    of the kernel on an R80.10 firewall. Bear in mind that the features and settings
    about to be presented here are situations that can potentially cause a performance
    impact to live traffic that will be noticed by users. This is by no means a complete
    list of every possible function handled by processes on the firewall, but a list
    of situations that can cause noticeable performance impacts to live user traffic
    due to a process space trip.


    As an example of a process space function that does not directly impact user traffic:
    by default the Application Control (APCL) blade will contact the Check Point ThreatCloud
    every 2 hours to see if there are any application pattern updates. This procedure
    is executed in process space on the firewall, but even if a new update is available
    and needs to be installed, this update procedure does not in any way directly
    impede or delay user traffic. However beware that whenever a signature update
    is applied to APCL/URLF and/or certain Threat Prevention blades, SecureXL will
    be'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# 350 The Fourth Path: Process Space Trips


    automatically restarted; this may cause a transient spike in Firewall Worker core
    utilization as mentioned here: sk121712: SecureXL restarts periodically when Application
    Control & URL Filtering / Anti-Bot / Anti-Virus blade are enabled.


    On the other hand, if HTTPS Inspection is enabled on the firewall, a trip occurs
    and the process-space daemons wstslld/pkxld are called upon to handle the initial
    HTTPS negotiation and asymmetric key calculations on the user''s behavior. The
    user must wait for these operations to complete in the processes before the HTTPS
    site will begin to appear in their browser; after negotiations are complete HTTPS
    encryption/decryption then occurs from point in the F2F path which is fully implemented
    in the kernel. If wstslld/pkxld processes are trying to use a CPU that is heavily
    loaded in kernel/system space, they will be forced to wait for the CPU before
    they can complete the HTTPS negotiation that the user is waiting on. Depending
    on how long the processes have to wait, the user may see a blank screen and a
    long delay when trying to connect via HTTPS to a secure website, but then the
    page renders quickly and subsequent navigation of the same HTTPS site performs
    very well. If the user goes to a completely different HTTPS site and the CPU situation
    is still present, the user will potentially see an initial state delay once again.
    HTTPS Inspection optimization will be covered in more detail later in this chapter.


    Once again, the processes listed below are involved with trips up to process space
    that can potentially start delaying live user traffic flows in noticeable ways.
    A particular focus here is traffic that is getting good performance fully inside
