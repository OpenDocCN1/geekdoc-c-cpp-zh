    # Mitigating Overruns: Interface Bonding vs. Flow Control


    The RX-OVR counter for all interfaces displayed by netstat -ni should be zero.
    Nonzero values indicate a NIC overrun is occurring during Stage 1 of the “A Millisecond
    in the Life of a Frame” discussion in Chapter 1. An overrun means frames arrived
    from the network faster than the NIC could buffer them in its local RAM. You would
    think that a NIC can operate at a line speed of 1Gbps that it can actually keep
    up with the RAM buffering requirements when operating at full utilization. Sadly
    this is not true, especially when most incoming frames are the minimum size. I
    have personally seen Intel Gigabit NICs start to accumulate overruns when sustained
    interface throughput goes north of 950Mbps at a 1Gbps link speed. Needless to
    say this is not a good thing, and causes frame loss which must then be recovered
    by higher-layer protocols such as TCP which will cause degrade performance.


    There are two possible corrective actions for this situation: bonded interfaces
    or NIC flow control.


    Use of a bonded interface (or using an interface capable of higher speed such
    as 10Gbps) is the recommended course of action if RX-OVR situations are being
    encountered on a regular basis. The single interface experiencing overruns is
    paired (bonded) with another physical interface. The two bonded physical interfaces
    now appear as one logical aggregate Ethernet in the Gaia web interface, CLI, and
    the'
