    There is an excellent free tool called iPerf https://iperf.fr) that can be used
    on the testing workstation and testing server to generate network load through
    the firewall. Internet speed tests are subject to the variability of the Internet
    and may not provide consistent results like your own iPerf setup will.


    # A Millisecond in the Life of a Frame


    Prior to tuning your firewall for network performance, a basic understanding of
    how packets are received, processed, and transmitted by Gaia (which is based on
    Red Hat Enterprise Linux) is necessary. This has been simplified to just the amount
    of detail we need to know for your tuning efforts and will be referred to as numerous
    times as we determine why one of these stages failed and a packet was lost:


    +   - Stage 1: A frame begins arriving on the wire; the NIC checks the destination
    MAC address on the incoming frame. If the destination MAC address matches the
    NIC’s, or the destination MAC is a broadcast/multicast, or the NIC is not set
    to promiscuous mode by a packet capture utility like tcpdump, the NIC controller
    copies the frame into a physical area of built-in RAM on the NIC itself.


    +   - Stage 2: The NIC controller signals the NIC’s device driver running in the
    kernel of the operating system to retrieve the frame from the NIC’s RAM with a
    hardware interrupt (hi).'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# A Millisecond in the Life of a Frame 9


    Stage 3: The NIC driver begins processing the hardware interrupt, retrieves the
    frame from the NIC’s hardware buffer, and does various sanity checks on the frame.
    If the frame checks out, it places the frame in a reserved area in the host’s
    RAM memory called a “receive socket buffer”.


    Stage 4: The NIC driver populates an RX ring buffer slot referencing the location
    of the newly received frame in memory. Hardware interrupt processing is complete.


    Stage 5: The NIC driver schedules a soft interrupt (si/SoftIRQ) with the CPU to
    retrieve frames via the RX ring buffer at convenience.


    Stage 6: At a later time the CPU begins SoftIRQ processing and looks in the ring
    buffer. If a descriptor is present, the CPU retrieves the frame from the associated
    socket buffer, clears the descriptor referencing the frame in the ring buffer,
    and sends the frame to all “registered receivers” which will either be the SecureXL
    acceleration driver (if SecureXL is enabled) or the Check Point INSPECT driver
    (if SecureXL is disabled). If tcpdump capture is currently running, libcap will
    also be a “registered receiver” in that case and receive a copy of the frame as
    well.


    Stage 7: If SecureXL is active, the packet reaches SecureXL Acceleration Layer
    first. Existing connections to throughput acceleration may be forwarded immediately
    to the outbound SecureXL layer after optimized inspection operations. (SecureXL
    is covered in Chapters 9 and 11)


    Stage 8: If SecureXL cannot handle the packet exclusively in its Accelerated Path,
    the packet is sent to Check Point INSPECT driver (F2F) for processing in the Firewall
    Path or the Medium Path. (The different paths are covered in Chapter 9)


    Stage 9: The Check Point INSPECT driver processes the packet (Does the rulebase
    allow it? Should the packet be NATed?). (i->I) If allowed by policy packet continues
    and destination NAT is applied.


    Stage 10: Packet is forwarded to the Gaia IP driver for routing; the egress interface
    is determined by an IP routing table lookup.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Introduction & Concepts


    **Stage 11:** The Gaia IP driver sends the packet to the Check Point INSPECT driver
    for final processing (o->O)


    **Stage 12:** Packet reaches outbound SecureXL acceleration driver.


    **Stage 13:** Packet is copied to a "send socket buffer" bound for the egress
    interface determined by the IP routing lookup.


    **Stage 14:** The Linux packet scheduler adds a descriptor to the TX ring buffer
    pointing to the location of a send socket buffer containing packet in memory.


    **Stage 15:** The NIC takes the packet, adds Ethernet framing, and sends it to
    the NIC''s RAM via hardware interrupt.


    **Stage 16:** The NIC transmits the frame on the wire via the egress interface.


    More than not, many Check Point firewall performance issues are caused by problems
    during the receive operation (Stages 10-9) and almost never during the transmit
    operation. Buffering misses, corrupted packets, or NIC overruns are examples of
    issues encountered during the receive operation leading to packet loss, which
    can be devastating to firewall performance.


