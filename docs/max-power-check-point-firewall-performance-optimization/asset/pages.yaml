- img_proc: true
  md: '# 326 SecureXL Throughput Acceleration


    the internal network. Exempting this traffic from TP processing with an exception
    tempting, and could potentially save a lot of CPU overhead in the Medium Path.


    Careful here! Remember that systems located in DMZ networks are only semi-trusted;
    they were probably placed in a DMZ because they are undertaking some kind of risky
    processing that involves interactions with potentially hostile systems on the
    Internet. If you were to create an exception for this traffic, and an attacker
    (or malware) was to compromise DMZ system,it/it would be free to attack the backup
    server at will, and the firewall’s TP inspection would be the wiser. The risk
    here is that an attacker could repeatedly initiate connections to the backup server
    and experiment until a compromise was achieved – and the Various Threat Prevention
    blades would be completely oblivious to it of the exception. There would be no
    assurance that the connection attempted was made by the legitimate backup program
    on the DMZ server, rather than some kind of installed attack tool.


    One good option: If the DMZ system currently initiates the connection to the internal
    backup server, see if you can flip that. Can the backup server initiate the connection
    to the DMZ server and do the backup that way? It would be much safer to exempt
    a connection initiated from the internal network to the DMZ from TP processing.
    While an attacker with a foothold on a DMZ server could still try to attack the
    backup server via the connection already initiated from the internal network to
    the DMZ server, the attacker would no longer have the ability to launch new attacks
    at their leisure against the backup server located in the internal network.


    Carefully consider the risks before creating exceptions which blind TP to connections
    initiated from a semi-trusted system located in a DMZ, especially when connecting
    to the internal trusted network!'
