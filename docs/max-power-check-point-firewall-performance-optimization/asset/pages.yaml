    blamed first, and must be cleared of any wrongdoing. You check the firewall logs
    and everything looks fine, with only Accept/Allow actions for the connection in
    question; no drops/blocks from ACL/URLF, IPS, Threat Prevention or any other blades
    are present. You have run a tcpdump or fw monitor and have verified basic network
    connectivity and two-way packet flow for the subject connection. As the firewall
    administrator, you may now be wondering: which of the three paths (Accelerated,
    Medium, or Firewall) is this problematic connection being processed? In the past,
    SecureXL was well-known for sometimes breaking application connections in non-obvious
    ways when using the Accelerated Path; disabling SecureXL (thus eliminating the
    Accelerated Path completely) was the only way to make the legacy application work
    again.


    First off ensure that the connection is actually live and passing traffic. Seeing
    an “Accept” action for the connection in the logs only means the connection started,
    and was accepted by the firewall. It does not mean that it is still active at
    this very moment. Next determine the source and destination IP addresses of the
    problematic connection (suppose the source 192.168.1.100 and the destination is
    129.82.102.32 as an example). If your firewall is running the R77 release or later,
    go ahead and run the following command to verify the SecureXL connections:


    ```

