    # 3DES vs. AES & AES New Instructions (NI)


    Regardless of the code version you are utilizing on your firewall, the Advanced
    Encryption Standard (AES) algorithm is much more computationally efficient than
    3DES. Converting existing tunnels using 3DES to some form of AES (utilizing AES-256
    for Phase 1, and AES-128 for Phase 2 is common) can help significantly reduce
    the load on the single VPN Firewall Worker core in R77.30, and also optimize any
    VPN processing that may be occurring on the SND/IRQ cores in the SecureXL Accelerated
    Path.


    The 3DES algorithm was hurriedly introduced when it became clear that the 56-bit
    DES algorithm no longer provided a reasonable level of security. 3DES was originally
    designed to run directly on hardware, and performs poorly when virtualized on
    commodity processors such as Intel/AMD. The AES algorithm however was designed
    from the beginning to run efficiently on commodity processors, and tends to be
    at least 2-3 times faster than 3DES in the real world.


    Another option worth investigation is the AES New Instructions (NI) processor
    extensions, that can offload AES operations from the main CPU and into specialized
    hardware that is a part of recent Intel server-class processor architectures.
