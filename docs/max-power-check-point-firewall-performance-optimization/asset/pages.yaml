    resistance to a DoS attack. These features are primarily designed for use in mitigating
    a DoS attack from the Internet, but particular capabilities (such as Rate Limiting
    described below) can sometimes be useful to throttle an internal system or network
    that is consuming too many connections in the firewall’s state, or sending extremely
    heavy bursts of packets through the firewall that are detrimental to overall performance.
    Enabling the Multi-Queue feature (covered in the previous chapter) can also provide
    some benefits in a DoS scenario by distributing the processing of network interface
    SoftIRQs across multiple cores.'
