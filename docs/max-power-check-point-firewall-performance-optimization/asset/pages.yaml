    # HTTPS Inspection


    HTTPS Inspection is a feature that allows the firewall to perform a successful
    “man in the middle” attack against your own internal users’ HTTPS-secured connections
    to the Internet. It can also be configured to inspect inbound HTTPS traffic to
    your DMZ servers. Once successfully configured, this feature allows the firewall
    to inspect HTTPS-encrypted traffic with all the capabilities that can typically
    be employed cleartext traffic (APCL/URLF, Threat Prevention, etc.) that is passing
    through the firewall.


    Due to its rapidly increasing popularity, and tending to be on the front lines
    of potential process space trip delays experienced by users, this section will
    explore HTTPS Inspection optimization in detail. This discussion is not intended
    to provide an introduction to the HTTPS Inspection feature, its basic operation
    or the overall'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# 360 The Fourth Path: Process Space Trips


    organizational & legal ramifications of deploying it on your firewall. If you
    haven''t yet set up HTTPS Inspection or little experience working with it, reading
    the following two SKs is strongly recommended before proceeding: sk65123: HTTPS
    Inspection FAQ and sk108202: Best Practices - HTTPS Inspection.


    As mentioned earlier in this book, HTTPS Inspection on a gateway always takes
    place in the Firewall Path (F2F) and is not eligible for Throughput Acceleration
    by SecureXL at all. In addition certain operations such as HTTPS negotiations
    (wst1sd) and asymmetric key calculations (pkx1d) trigger a process space trip
    on the firewall.


    # The Impact: Enabling HTTPS Inspection


    Enabling HTTPS Inspection on your firewall incurs a potential “double whamma”
    as far as performance is concerned.


    +   - First off for each HTTPS connection request received from a user, the firewall
    essentially is having to proxy HTTPS connection, and now must handle the initial
    HTTPS negotiations & key calculations for two separate secure connections, as
    well as symmetric encryption and decryption of data for both connections.


    +   - Second, traffic that was previously not subject to inspection by various
    firewall blades such as Threat Prevention and APCL/URLF because it was encrypted
    with HTTPS, can now be decrypted fully inspected by potentially many more blades,
    thus incurring even more overhead on the firewall.


    The use of the term “double whamma” is particularly appropriate here, because
    when sizing a new firewall for purchase that intends to utilize the HTTPS Inspection
    feature, the general recommendation is to basically double the size of the firewall.
    In the real'
