    sim feature pbroute on – SecureXL was originally disabled on the firewall because
    the Gaia Policy-Based Routing (PBR) function was actively being utilized, PBR’s
    prior incompatibility with SecureXL was rectified on R77.30 but is not enabled
    by default. The above command will enable the use of PBR with SecureXL on an R77.30
