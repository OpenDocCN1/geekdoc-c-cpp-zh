    # Background


    In this chapter we will profile the CPU utilization of the firewall in preparation
    for CoreXL/SecureXL tuning, and perform various Gaia optimizations that are independent
    of whether CoreXL & SecureXL are enabled or not. An important concept is that
    a minimum amount of processing overhead is incurred on a per-packet level, rather
    than per-byte of actual data set. A system that is processing a large number of
    small packets with only a few bytes in the payload of each packet, works almost
    as hard as a system processing the same number of packets containing the typical
    MTU limit of 1500 bytes of data in each packet. Clearly the overall data throughput
    in these two scenarios will be radically different if the CPU load looks the same.
    Jumbo frames are supported by almost all Check Point firewalls and tend to be
    commonly deployed with the 41000-64000 series of appliances, are also sometimes
    deployed with the 13000-23000 series'
