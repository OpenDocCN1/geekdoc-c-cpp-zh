  md: '# Drop Templates & Drop Optimization 413


    So the inevitable question: Should you enable Drop Optimization on your firewall?
    It is not enabled by default (including in R80.10), but Drop Optimization should
    probably be turned on in many environments that are running at least version R77.30.
    However consider the following before enabling Drop Optimization:


    +   - The dynamic nature of Drop Optimization may instill a false sense of security
    initially, then cause intermittent problems later. Example: Drop Optimization
    is enabled in the SmartDashboard/SmartConsole and policy is pushed to the firewall.
    The current drop rate is not high enough for dynamic Drop Template formation;
    you execute your test plan and everything OK. However later the drop rate rises
    to the point where drop templates start being dynamically formed. At that time
    you start noticing network issues that were not present before; traffic discarded
    by Drop Templates is not logged. Logging of traffic discarded by drop templates
    can be enabled by setting kernel variable `sim_track_dropdb` to (See: sk67861:
    Accelerated Drop Rules Feature in R75.40 and above), but this will cause significant
    logging overhead and negate many of the Optimized Drops improvements.


    +   - SecureXL can start dropping traffic without your intervention or knowledge
    based on traffic conditions. Frankly by default a log entry will appear whenever
    Drop Optimization reaches its activation threshold, and again when it falls below
    its deactivation threshold. While continuously active, Drop Optimization will
    also issue another log every 5 minutes by default providing statistics about the
    number of packets dropped. Be on the lookout for these log entries in the firewall''s
    traffic logs should you start encountering unexplained problems at some point
    after'
