  md: '# Access Control Policy Tuning


    Hopefully you should now have a good idea of the most commonly hit rules in your
    NAT policy. But here comes the next big question: If the #PEAK value for the fwx_cache
    table is exactly 10000, how much would potentially increasing the NAT cache size
    help? There is no direct way to answer this question, but there is a way to see
    how much CPU overhead the NAT cache is currently saving at its current size: we
    can simply turn it off and see what happens to CPU utilization on the firewall!


    To accomplish this, run the command mpstat 1 in a separate window. This command
    will show CPU utilization (user/sys/soft/hi as shown in the top command) once
    per second. Let the command run for a while to get a good idea of the firewall’s
    current CPU load. Now in a separate window disable the NAT cache on the fly: fwctl
    set int do_nat_cache 0. Observe the CPU utilization closely after the change.
    Does it go up, down or stay the same? You can probably draw your conclusions about
