  md: '# Spanning Tree Protocol Sanity Check


    Next we will discuss the spanning tree protocol implemented by switches. What’s
    that

    you say? I thought this book was about firewall performance optimization, why
    the heck

    we are talking about the spanning tree protocol used by switches? Spanning tree
    issues

    on switches can cause intermittent network slowdowns and downright outages, but

    invari the firewall gets blamed for it. I''ve been involved in numerous consulting

    agements to troubleshoot "intermittent performance issues on the firewall" only
    to

    dcover a severe spanning tree issue that needs to be rectified. Let’s dive into:


    The Spanning Tree Protocol (STP) is a network protocol that ensures a loop-free

    topology for any bridged Ethernet local area network. The basic function of STP
    is to

    prevent bridge loops and the broadcast radiation that results from them. Spanning

    tree also allows a network design to include spare (redundant) links to provide

    automatic backup paths if an active link fails, without the danger of bridge loops,
    or

    the for manual enabling/disabling of these backup links.


    Wikipedia does a great job of summarizing the Spanning Tree Protocol (STP) in
    a

    nutshell. While the firewall itself does not directly participate in the STP,
    the

    performance impact of a STP issue will affect the firewall as much as the rest
    of the

    network. All switches in a network send special frames called Bridge Protocol

    Data Units (BPDUs) out of switch ports, for the purpose of electing a root bridge
    and

    disabling (partitioning) any switch ports necessary to ensure a loop-free architecture.

    The firewall itself never sends BPDUs or otherwise participates in the spanning
    tree

    algorithm. Switches that have been disabled by STP will glow an amber color on
    a

    Cisco switch as opposed to the usual green. There are many extensions of the STP
    such

    as Rapid STP, Per-VLAN STP, and Multiple STP; for simplicity’s sake we will only

    focus on the STP as originally defined in the IEEE 802.1D standard.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Spanning Tree Protocol Safety Check 41


    When a switch port first comes up, by default spanning tree will enter a “listening
    and learning” phase on the port. The switch will listen to traffic coming inbound
    to the port but not forward any frames. The switch is “listening” to the source
    MAC addresses received on the interface, trying to determine if that same source
    MAC address has been “seen” on a different switch port. If the same unicast MAC
    address appears on more than one switch port interface, it could indicate the
    presence of a bridging loop in the network which can slow or crash the entire
    network. In this case the port will never leave the “listening and learning” phase
    and be left in a partitioned/disabled state, unable to forward any traffic.


    This listening and learning phase will typically last for 12-15 seconds during
    the port will glow amber on the front of a Cisco switch. Once the timer expired
    without any conflicting MAC addresses detected, the switch port will turn green
    and enter forward state.


    This listening and learning phase can be shortened to essentially zero by setting
    the switch port to “portfast” mode. When enabled, portfast allows the switch port
    to skip the learning phase and immediately go active. However care must be taken
    to ensure that no other switches are attached to a switch port with portfast enabled,
    as it can cause immediate spanning tree issues and potentially impact the performance
    of the network. BPDU Guard (discussed later) can be enabled in the switch to prevent
    this problem from occurring.


    What can go wrong with STP? The most common scenarios I’ve run into when troubleshooting
    a “firewall performance issue” that turns out to be STP-related are:


    +   - Rogue root bridges


    +   - A constantly shifting root bridge due to a persistent network flap (especially
    on trunk ports)'
  merge: -1
