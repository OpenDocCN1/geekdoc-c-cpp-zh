  md: '# CoreXL VPN Optimization: Key Points


    +   - If a significant amount of IPSec VPN traffic is being handled by a pre-R80.10
    firewall, upgrading to R80.10+ is strongly recommended for performance and functionality
    reasons.


    +   - IPSec VPN processing for all tunnels can only take place on one Firewall
    Worker core on an R77.30 firewall.


    +   - R80.10+ firewalls support MultiCore IPSec and Route-based VPNs by default
    even used in conjunction with CoreXL.


    +   - MultiCore SSL can substantially increase Remote Access VPN performance and
    must be manually enabled on an R77.30 firewall.


    +   - The 3DES encryption algorithm should be avoided due to performance reasons;
    use the Advanced Encryption Standard (AES) algorithm instead, particularly if
    your firewall hardware supports AES-NI.


    +   - Intervening sub-1500 MTUs present between firewalls attempting to pass IPSec
    traffic can kill VPN performance.


    +   - Early versions of the CIFS/SMB protocol suite are intolerant of high-latency
    networks, and will exhibit terrible performance when used in a VPN across the
    Internet.


    +   - Numerous R77.30 VPN performance and functionality limitations can be eliminated
    by upgrading your firewall to version R80.10.'
