  md: '# Rate Limiting for DoS Mitigation/Network Quota 419


    Should all heck suddenly break loose when messing around with these Rate Limiting
    features due to a misconfiguration, the following command will save your bacon
    by instantly placing enforcement of these features into Monitor-only mode: `sim_dos
    ctl -m 1`. After correcting the issue, run `sim_dos ctl -m 0` to disable Monitor-only
    mode and resume Rate Limiting enforcement.


    As demonstrated in our example, this feature can be useful to throttle an internal
    system (such as an internal auditor running a port scan) or network that is consuming
    too many connections through the firewall’s state table, or sending extremely
    heavy bursts of packets through the firewall that are detrimental to overall firewall
    performance. These special rules are not really part of the firewall’s main security
    policy, but can efficiently drop traffic in the Acceleration Layer before it reaches
    the Firewall Worker cores. This feature is somewhat similar to the IPS “Network
    Quota” protection, however a serious downside to using the IPS “Network Quota”
    feature is that all traffic subject to this IPS Protection will be ineligible
    for any SecureXL acceleration whatsoever, and will always take the Firewall Path.
    The Rate Limiting feature discussed in this section is not subject to performance
    limitation and is fully implemented in the Accelerated Path.


    For more information, see the “Rate Limiting for DDoS Mitigation” section of [R77
    Security Gateway Technical Administration Guide](https://www.checkpoint.com/support/products/r77-security-gateway/technical-administration-guide/).


    Finally, should you find your network sustaining a confirmed DoS attack, the invaluable
    document [DDoS Protections on the Security Gateway Best Practices Guide](https://www.checkpoint.com/support/dos-protections/)
    is available on Check Point’s website and can be quite helpful. However if DoS
    attacks are becoming a regular and increasingly annoying occurrence for your organization,
    be aware that Check Point sell dedicated DDoS Protector appliances.'
