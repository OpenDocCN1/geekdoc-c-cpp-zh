    # Avoiding the Limit: “Many-to-fewer” NAT Configuration


    If the number reported by the fw tab command earlier (divided by 2 of course)
    was uncomfortably close to the 50k Hide NAT limit discussed earlier, it possible
    to set what I would term a “many-to-fewer” Hide NAT. As the name implies, it involves
    hiding networks behind more than one external IP address. Every external IP address
    added to the “fewer” side of the equation allows another 50,000 possible concurrent
    connections can be Hide NAT.


    A "many-to-fewer" Hide NAT has been possible via manual NAT rules since around
    R75. It is not really documented anywhere but it definitely work; here is a quick
