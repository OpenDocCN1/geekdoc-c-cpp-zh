  md: '# Introduction & Concepts


    # Network Device Health Check


    Now that you have discovered all the intervening devices in your network test
    path (which can include routers, switches, other vendor’s firewalls as well as
    in-line appliances such as IPS & Web filters) it is time to assess their health.
    The procedure to do this will vary depending on the vendor involved, but often
    than not the intervening devices will be some kind of Cisco box or something that
    is running a variant of the Linux OS. Specific commands for these two common devices
    will be included; if you don’t have administrative access to these devices you
    may need to ask someone on your network team to run them for you. When assessing
    the health of a network device, there are five basic things you should look at:


    +   - CPU Load (Cisco: show proc cpu; Linux: top)


    +   - Free Memory or lack thereof (Cisco: show proc mem; Linux: free -m)


    +   - Network Interface Errors such as CRC/framing errors and interface crashes
    and resets. Don’t forget to check both the ingress interface for network traffic
    (which is the one that will show up in a traceroute) and the egress interface.
    (Cisco: show interface and look for “input error”, “output error”, and “carrier
    transitions” counters; Linux: netstat -ni and look for RX-ERR and RX-OVR; ifconfig
    (interface) and check “carrier” value)


    +   - Network Buffer Processing Errors - Don’t forget to check both the ingress
    interface for network traffic (which is the one that will show up in a traceroute)
    and the egress interface. (Cisco: show buffers and look for misses; Linux: netstat
    -ni and look for RX-DRP)


    +   - Device Uptime in case the device is unstable or crashing constantly (Cisco:
    show version; Linux: uptime)'
  merge: -1
