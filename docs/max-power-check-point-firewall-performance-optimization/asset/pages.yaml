    out of the Accelerated Path (Check calls this a SecureXL “violation”) and into
    the Medium or Firewall Paths.


    > WARNING: Enabling debugging on a live production firewall can have serious performance
    impacts if done improperly. While throughout the book we have generally wanted
    to run commands during the firewall''s busiest period, for this procedure you
    may want to wait until after hours.


    The following technique be used to determine whether this connection (or an inordinate
    amount of traffic in general) seems to be constantly stuck in the Firewall and/or
    Medium Paths. First we need to set a filter for our debugging. This is important
    to keep the debug output from overwhelming us, and possibly impacting firewall
    performance. Only one filter can be active at a time. Here is how to set it for
    our example:


    ```

    sim dbg -f 192.168.1.100,*,129.82.102.32,*6

    ```


    This filter will match all TCP traffic sourced from 192.168.1.100 to 129.82.102.32
    on any source port and any destination port. Make this filter as specific as possible
    for your'
