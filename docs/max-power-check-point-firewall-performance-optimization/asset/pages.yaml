  md: '# 122 Access Control Policy Tuning


    The larger block of Internet-routable addressing assigned to an organization,
    the more of this “background noise” arrives at its firewall. This constant stream
    of compromise attempts must be inspected and eventually dropped by the firewall;
    with Internet-routable subnets in excess of a /24 (255+ hosts) this performance-draining
    effect becomes much more pronounced. Ironically the vast majority of these attempts
    are of a generic nature and are not particularly aimed at your organization. Wouldn''t
    it be nice to save precious firewall resources for actual concentrated attacks
    against your organization, and not waste time on all this “trash traffic” from
    the far corners of the Internet you don’t care about? Enter Geo Policy.


    Geo Policy allows highly efficient bulk drops of traffic to from particular countries.
    If you know for a fact your organization does not have operations or customers/partners
    in most countries of the world, would you want to even inspect traffic to from
    those countries? Just drop it all! By blocking large parts of the Internet with
    which there is no need for your organization to communicate, the amount of processing
    overhead consumed by the incessant background noise of the Internet can be substantially
    reduced.


    If you know for which countries your organization needs to communicate with, shouldn’t
    you block all other countries? Which countries are the most well-known for hosting
    attacks?


    A great starting point is blocking the 20 most populous countries of the world
