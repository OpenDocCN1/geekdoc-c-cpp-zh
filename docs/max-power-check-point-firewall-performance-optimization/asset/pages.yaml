  md: '# 262 CoreXL VPN Optimization


    While offloading of eligible IPSec VPN traffic onto the SND/IRQ cores can improve
    overall VPN performance, the following algorithms are not implemented in SecureXL
    and will preclude SecureXL acceleration of all IPSec VPN traffic utilizing them:


    +   - SHA-384 hashing algorithm

    - AES-GCM-128

    - AES-GCM-256


    The Galois/Counter Mode (GCM) versions of the AES algorithms combine integrity
    and encryption into a single operation that requires less CPU (and is even able
    to be accelerated directly in hardware with AES-NI), all traffic to these two
    GCM-based algorithms will be ineligible for processing in the SecureXL Accelerated
    Path and be forced into the Firewall Path (F2F). To clear, the generic versions
    of the AES-128 and AES-256 algorithms are potentially eligible for processing
    in the Accelerated Path where they can take advantage of AES-NI as well.


    Diffie-Hellman (DH) groups 19 & 20 utilize Elliptic Curve cryptography incur less
    CPU overhead than the lower DH group numbers and are preferred from a firewall
    performance perspective. Diffie-Hellman groups 1-18 utilize Modular Exponential
    (MODP) cryptography which is substantially less efficient, and arguably less secure.
    For further information consult: sk27054: Defining Advanced Diffie-Hellman Groups
    for IKE in Site-to-Site VPN.


