  md: '# SecureXL Throughput Acceleration


    Accelerated conns/Total conns: Ignore this line for now; it is associated with
    SecureXL Session Acceleration which is covered in Chapter 11.


    Accelerated pkts/Total pkts: This shows how many packets were able to be processed
    exclusively in the Accelerated Path through Throughput Acceleration discussed
    in the last section. The higher the percentage the better; shooting for a packet
    acceleration rate of 50% or higher is acceptable, 75% or better is ideal. Packets
    processed in this way were able to be “shortcuted” across the firewall with a
    minimum of processing and did not involve the Firewall Worker cores or Gaia IP
    routing at all. Due to this “shortcutting,” packets handled by the Acceleration
    Layer will not show up in an fw monitor packet capture.


    F2Ed pkts/Total pkts: This shows how many packets had to be forwarded to the Firewall
    Path on a Firewall Worker core and could not be accelerated at all. Generally
    we want this percentage to be as low as possible. Less than 20% is a reasonable
    target and less than 10% is ideal.


    PXL pkts/Total pkts: This shows how many packets were not able to be completely
    handled by the Accelerated Path, but did not need to travel the full Firewall
    Path. PXL is known as the Medium Path, and is generally used to inspect traffic
    for IPS signatures but also involves the firewall features Application Control/URL
    Filtering, and the various Threat Prevention blades. Medium Path processing takes
    place on a Firewall Worker core. Unlike to what Check Point’s documentation states,
    disabling SecureXL completely on a 2-core system as discussed in an earlier chapter
    does not preclude use of the Medium Path.


    QXL pkts/Total pkts: This line will only be displayed in version R77.10 and later.
    This counter measures packets subject to the QoS policy rulebase; to be clear
    this does not include Limit actions set in an Application Control/URL Filtering
    layer.'
