  md: '# # CHAPTER 6

    CLUSTERXL HA PERFORMANCE TUNING


    Success is not final, failure is not fatal: it is the courage to continue that
    counts.


    - Winston Churchill


    # ## Background


    In today’s increasingly cloud-based world, firewall failures cause unacceptable
    outages that can have far-reaching effects. ClusterXL permits the deployment of
    more than one firewall in a cluster, ensuring that if one firewall fails for any
    reason, another can immediately take its place and continue to pass traffic.


    Using High Availability (HA) in a firewall implementation introduces a new set
    of challenges for ensuring optimal performance. Additional overhead is introduced
    to monitor and maintain cluster state, and also to synchronize state tables between
    cluster members for ensuring seamless failovers. In addition the relatively new
    Cluster Load (CUL) mechanism is enabled by default in R77.30 and later, and can
    have some surprising effects on cluster failover behavior if you aren’t aware
    of it. However before diving into the optimization details, let’s go ahead and
    deal with the big elephant in the room: active/standby (HA) vs. active/active
    (Load Sharing).'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# ClusterXL HA Performance Tuning


    # Firewall Clustering: High Availability vs. Load Sharing


    The vast majority of Check Point firewall clusters deployed today are using ClusterXL
    High Availability, which is an active/standby model. A single active firewall
    processes 100% of the traffic load while the standby member (or members) processes
    0% of the load, and merely takes state synchronization updates from the active
    member. A common recommendation to increase overall firewall performance is to
    adopt an active/active model, which Check Point calls “Load Sharing” as shown
    here:


    ![](img/f71ded7ff9665818f413a53bb0d5a4bb_200_0.png)


    Figure 6-1: Firewall Cluster Load Sharing Options'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Background 173


    Can migrating to a Load Sharing model increase overall firewall performance? Yes.
    Is it worth the additional complexity and troubleshooting murkiness? For most
    sites in the real world answer is a resounding NO. “But wait aren’t two heads
    better than one?” you ask. Your manager might also ask: “Why should our very expensive
    standby firewall just sit there and do nothing?”


    To answer these questions let’s examine the two supported modes of ClusterXL Load
    Sharing:


    +   1. Load Sharing Multicast – This active/active clustering mode leverages multicast
    addresses for efficient traffic distribution to all members of the firewall cluster.
    While it is the most efficient Load Sharing method and can definitely boost overall
    cluster performance and throughput, it relies on multicast MAC addresses, which
    are almost never handled properly by the switches and routers directly adjacent
    to the cluster. To make this Load Sharing technique work properly, extensive hardcoding
    of IP and MAC addresses may be necessary on all switches and routers that are
    adjacent to the firewall cluster. This dramatically increases configuration complexity
    by requiring substantial changes to the surrounding network that may not be obvious
    to any firewall administrator or third party. These hardcoded changes will almost
    certainly come to bite you at the most annoying and inconvenient moment possible.
    In addition, frequently “Sticky Decision Function” (SDF) must be enabled for certain
    features (such as the Mobile Access blade) to work properly when using this ClusterXL
    Load Sharing mode. Enabling SDF will kill almost all SecureXL acceleration on
    the firewall, resulting in degraded performance.


    +   2. Load Sharing Unicast – This active/active technique avoids the hardcoded
    configuration morass imposed by the use of multicast MAC addresses, but the'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# 174 ClusterXL HA Performance Tuning


    method of traffic distribution amongst the cluster members is substantially less
    efficient. The Unicast traffic distribution method can even double the amount
    of traffic your network switches must carry 3 or more cluster members are present!
    In a Load Sharing Unicast setup, one of the cluster members is elected the “Pivot”
    and will always initially receive all traffic bound for cluster interfaces. In
    a 2-member Load-Sharing Unicast cluster by default the Pivot will redirect 70%
    of inbound traffic to the other cluster member for processing, and then process
    30% of the network load by itself. In a 3-member Load Sharing Unicast cluster,
    the Pivot inspects 20% of the network load and spends the rest of its redirecting
    the remaining 80% of the traffic to the two other cluster members 40/40. In this
    scenario the firewall that has been elected the Pivot is little more than a glorified
    load balancer 80% of the time, with substantially increased switchport utilization
    to boot.


    Based on the overall tone of the prior section, you probably have a sneaking suspicion
    that I am not a fan of Load Sharing. You would be correct. This isn’t a specific
    beef with Check Point’s implementation of Load Sharing; I also dislike active/active
    implementations on all other firewall vendors’ products as well. Generally speaking,
    the complexity imposed by Load Sharing is not worth it in my opinion. From a design
    perspective if you still intend to push forward with a Load Sharing configuration,
    you are going to need at least 3 firewalls. If only two firewalls are used with
    Load Sharing and one of them fails, the remaining firewall may very well not be
    able to handle 100% of the load by itself and will buckle in noticeable ways.
