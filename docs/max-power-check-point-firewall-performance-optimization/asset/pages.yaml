    # Background


    In Chapter 9 we noted that the first packet associated with the TCP 3-way handshake
    usually goes through the entire Firewall Path. Once SecureXL “learned” the new
    connection, and the second packet of the TCP 3-way handshake (SYN-ACK) was received,
    that connection and all its subsequent packets were potentially eligible for Throughput
    Acceleration and could be handled exclusively by the Accelerated Path. This assumes
    of course, that the traffic was not subject to additional inspection by the APCL/URLF
    or Threat Prevention features, in which case the Medium Path would be employed.
    Recall this diagram that shows the various paths:'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# 368 SecureXL Session Rate Acceleration


    ![](img/f71ded7ff9665818f413a53bb0d5a4bb_396_0.png)


    Figure 11-1: Firewall Traffic Processing Paths


    However upon receipt of the first packet of a new connection (most of the time
    a TCP SYN), one of the most computationally expensive operations possible has
    to be undertaken in the Firewall Path by a Firewall Worker core: Security Policy
    rulebase


    maxpowerfirewalls.com

    Copyright © 2018 Shadow Peak, Inc. All Rights Reserved'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'evaluation. In other words Firewall Worker core must decide if the connection
    should be allowed to start based on the Security Policy. In modern production
    environments, security rules can easily number into the hundreds or thousands,
    and on R77.30 the Firewall Worker core must sequentially search through the Security
    and NAT rulebases looking for a match in “top-down, first-fit” fashion. R80.10+
    gateways use Column-based matching as detailed in Chapter 5, but there can still
    be a fair amount of overhead involving finding a rule match. As policy size continues
    to grow, regardless of the technique used by the firewall to find a rulebase,
    the amount of CPU processing required will increase. Firewalls that experience
    extremely high connection rates wind up expending an inordinate amount of CPU
    time in the Firewall Path, determining if the connections should be allowed via
    evaluation of the Access Control policy.


    Once the TCP SYN has been accepted and forwarded, the Acceleration Layer can potentially
    take over and move subsequent packets associated with that connection in a highly
    efficient fashion via the Accelerated Path. Wouldn''t it be great if we could
    somehow streamline the process of handling that first packet in the Firewall Path,
    which is tying up so much of the CPU on our Firewall Worker cores performing lookups?
    The answer is SecureXL Session Rate Acceleration.


    When Session Rate Acceleration is active, the Acceleration Layer will still initially
    forward new connection requests to the Firewall Path, but it will also try to
    form what is known as an “Accept Template” for the connection request that it
    just passed to the Firewall Path. As an example, the Accept Template below records
    the following eight attributes about the connection in the Acceleration Layer’s
    template cache:'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# 370 SecureXL Session Rate Acceleration


    Source IP Address: 192.168.1.100

    Destination IP Address: 129.82.102.52

    Source Port Number: 1050

    Destination Port Number: 80

    IP Protocol Type: 6 (TCP)

    Ingress Interface (determined by Acceleration Layer on inbound side): eth0

    Egress Interface (determined by Acceleration Layer on outbound side assuming the
    packet was allowed): eth1


    The initial TCP SYN for that new connection will still traverse the Firewall Path,
    and once the SYN-ACK packet is received by the Acceleration layer, it will either
    process via the Accelerated Path on the SND/IRQ cores, or send it for Medium/Firewall
    Path processing on the Firewall Worker cores if required.


    However suppose another new connection requests inbound at the Acceleration Layer.
    The Acceleration Layer will consult its Accept Template table. Does this new connection''s
    attributes match 7 of the 8 elements of any current entries in the Accept Template
    table? Let''s suppose the new connection request looks like this:


    Source IP Address: 192.168.1.100

    Destination IP Address: 129.82.102.52

    Source Port Number: 2055

    Destination Port Number: 80

    IP Protocol Type: 6 (TCP)

    Ingress Interface (determined by Acceleration Layer on inbound side): eth0

    Egress Interface (determined by Acceleration Layer on outbound side): eth1


    Compare this with the attributes of our first connection. See how only one field
    is different (the source port number) for this connection? That is good enough
    for an Accept Template match, because if SecureXL Session Rate Acceleration can
    “mask” or disregard just one of the fields, it can match a prior tempted connection.
    The SYN packet and the rest of the TCP three-way handshake is now handled exclusively
    by the'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Discovery 371


    Acceleration Layer. There is no need to do a Security Policy rulebase lookup in
    the Network Access layer. The connection’s packets are allowed and throughput
    accelerated on the Accelerated Path or sent to the Medium/Firewall Path for processing
    immediately.


    Essentially the Acceleration Layer is assuming that since the first connection
    was accepted by the Firewall Path, the second connection was almost exactly the
    same should be permitted as well, with the same routing. Notice how we avoided
    performing a security policy evaluation in the Network Access policy layer for
    the second connection, which once again is one of the most computationally expensive
    operations a firewall has to perform. The maximum number of Accept Templates that
    can be created in the Acceleration Layer by default is 25% of the connections
    table size. Accept Templates also have an idle timeout of 100 seconds by default.


    You may be saying to yourself: “Well, how many subsequent connections are only
    going to have ONE different and be to match on an Accept Template like that?”
    Actually there are two protocols famous for rapid-fire, short-lived connections
    that only have one thing change between the different connections (usually the
    source port): HTTP and DNS. These two protocols alone can easily be responsible
    for 40% of the new connections created on a firewall, which will of course require
    constant Network Access policy lookups.


