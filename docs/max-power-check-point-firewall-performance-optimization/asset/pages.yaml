  md: '# RX-DRP Analysis & Discussion 207


    A nonzero “missed” counter is by far the most common and indicates a ring buffer
    slot was not available to receive a frame. Seeing a nonzero counter in the other
    fields above is relatively rare. So we have determined that the RX-DRP rate is
    unacceptable, and we need to tune our firewall by buffering misses. First off
    is an RX-DRP exactly? Let’s revisit “A Millisecond in the life of a Frame” from
    Chapter 1:


    **Stage 3:** The NIC kernel driver begins processing the hardware interrupt, retrieves
    the frame from the NIC’s hardware buffer, and does various sanity checks on the
    frame. If the frame checks out, it places the frame into a reserved area in the
    host’s RAM memory called a “receive socket buffer”.


    **Stage 4:** The NIC driver populates an RX ring buffer slot with a descriptor
    referencing the newly received frame in memory. Hardware interrupt processing
    is complete.


    **Stage 5:** The NIC driver schedules a soft interrupt (si/SoftIRQ) with the main
    CPU to retrieve frames via the RX ring buffer at its convenience.


    The RX-DRP counter is incremented in Stage 4 when the NIC driver is *unable unwilling*
    to place a descriptor in the RX ring buffer pointing to the frame it just received
    from the NIC’s hardware buffer in Stage 3. *Unable* means there is not a free
    RX ring buffer slot available. *Unwilling* means a basic sanity check performed
    on the frame failed; this situation will be discussed in the “RX-DRP Revisited:
    Still Racking Them Up?”'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# 208 CoreXL Tuning


    nowhere to put the frame’s descriptor during hardware interrupt processing because
    the ring buffer is full. The crux of the issue is this: The SoftIRQ processing
    scheduled in Stage 5 did not empty frames quickly enough from the RX ring buffer
    before it overflowed and incoming frames were lost.


    # Remediating Network Buffering Misses


    There are three methods to lower the RX-DRP rate if buffering misses are occurring:


    +   1) The best way: Allocate more processing resources for handling SoftIRQs
    in a timely fashion if available, this may also include Multi-Queue as discussed
    in Chapter 12.


    +   2) Not desirable but unavoidable in some cases: Increase the size of the RX
    ring buffer for more interface buffering capability.


    +   3) Unsupported and not recommended except in extreme circumstances: Increase
    the CPU “budget” for processing frames during a single SoftIRQ processing run,
    by adjusting the undocumented net.core.netdev_budget Gaia kernel variable.


    # It’s a Trap! Increasing Ring Buffer Sizes


    Let’s start with method #2: A common recommendation in the case of excessive RX-DRPs
    is to increase the size of the interface’s ring buffer from its default of 256/512
    frames of buffering, to some higher value (most NICs support a maximum ring buffer
    size up to 4096 frames). However increasing the RX ring buffer'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'size is simply addressing a symptom of the actual problem: not enough CPU resources
    are available to empty the RX ring buffer before it becomes full. The best solution
    is to allocate sufficient processing resources to empty the buffer in a timely
    fashion, without increasing the size of the ring buffer itself.


    But with computers isn''t more memory always a good thing? Doesn’t apply to ring
    buffers as well? With typical processing operations like executing code in an
    operating system, having more RAM is always better. Having to wait for data to
    be retrieved from a hard drive takes a relative eternity compared to how long
    it takes to retrieve from RAM or a CPU’s fast cache.


    However this maxim does not apply in the case of buffer processing. The larger
    the buffer the more it takes to service that buffer, which will increase latency
    and jitter. To make matters worse, the excessive buffering and wild variances
    in packet delivery (called “jitter”) can confuse TCP’ congestion-avoidance mechanism
    on the communicating workstations them to “back off”, which further reduces overall
    network throughput. It is not real-time streaming applications as voice and video
    that suffer when jitter is excessive. The decline in network throughput caused
    by oversized buffers is known as BufferBloat. To quote Wikipedia:


    Bufferbloat is a phenomenon in packet-switched networks, in which excess buffering
    of packets causes high latency and packet delay variation (also known as jitter),
    also reducing the overall network throughput. When a router is configured to use
    excessively large buffers, even high-speed networks become practically unusable
    for many interactive applications like voice calls, chat, and even web surfing.


    Overly large buffers have been placed in some models of equipment by their manufacturers.
    In this equipment bufferbloat occurs when a network link becomes congested, causing
    packets to become queued for too long in these buffers. In a first-in first-out
    queuing system, overly large buffers result in longer queues and'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'higher latency, but do not improve network throughput and may even reduce goodput
    to zero in extreme cases.


    Properly allocating CPU processing resources for SoftIRQ processing is vastly
    preferable to increasing network buffering. You can test for the presence of BufferBloat
    in your network, specifically in the “Network Buffer Measurements” report portion
    of this free testing tool:


    http://netalyzr.icsi.berkeley.edu


    Remember, our performance goal is to properly allocate CPU resources such that
    SoftIRQ processing is handled in a timely fashion and the RX-DRP rate is 0.1%
    or less. In some limited cases, it may be desirable to increase the RX ring buffer
    size on a problematic interface when sufficient processing resources are not available
    due to the firewall being underpowered. It is not always desirable (or possible)
    to have an RX-DRP rate of zero in all environments, and attempting performance
    tuning in this area when the RX-DRP rate is already less than 0.1% is just as
    likely to harm performance as it is to help it.


    # Impact of Oversized Ring Buffers – An Example


    You are probably thinking right about now: “Isn’t packet loss bad? Shouldn’t we
    bend over backwards to prevent it at all costs?” NO! The “cost” in this case is
    actual degradation of overall network throughput, not just for connections trying
    to consume large amounts of network bandwidth, but for every packet attempting
    to traverse the'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# RX-DRP Analysis & Discussion 211


    firewall. The Wikipedia BufferBloat article does a good job of explaining this,
    but let''s step through a quick example:


    Two TCP-based streams are traversing the firewall. “Slowpoke” is only occasionally
    sending infrequent data that is is delay-sensitive, while “Screamer” is not delay
    sensitive but has many terabytes of data to send. Screamer will flood the receiving
    interface’s RX ring buffer with a huge number of frames as soon as it starts.


    Suppose the inbound interface’s RX ring buffer is set to to the default of 256.
    Almost immediately Screamer overflows the RX ring buffer and experiences packet
    loss. Screamer’s TCP sees the loss very quickly, and the TCP congestion control
    algorithm on Screamer immediately backs off, sensing that the network is congested.
    After backing off, Screamer’s TCP will solely attempt to send traffic faster and
    faster once is again encountered. Screamer will very quickly settle down at the
    fastest speed possible that does not result in packet loss, thus ensuring the
    most efficient use of network resources for its connection, as well as for all
    other connections traversing the firewall. Jitter is very low and Screamer’s TCP
    rarely makes significant adjustments to its send rate. Should the lower bandwidth
    stream Slowpoke attempt to send a few packets during the much heavier stream Screamer’s
    operation, the following is likely to be true:


    +   - An RX ring buffer slot will very probably be available to receive Slowpoke’s
    frame


    +   - The delay incurred to getpacket’s frame read from the buffer and processed
    can be no more than the time it take to process between 1 and 254 frames from
    the ring buffer during SoftIRQ processing (1 in the best case, 254 in the worst
    case).


    Now suppose the RX ring buffer has been cranked to the maximum of 4096 on the
    interface. The same scenario will now look like this:'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# 212 CoreXL Tuning


    Screamer does not overflow the RX ring buffer initially, and blasts frames at
    full speed until its TCP Send Window completely closes, consuming some but not
    all of the RX buffer capacity (the TCP Send Window is the amount of data a TCP
    Stream can send without having to receive an ACK from the receiver). Screamer''s
    TCP does not see loss immediately, but a relatively long delay instead. Screamer''s
    TCP must stop sending and wait until ACKs start coming from the receiver before
    it can send more. As the ACKs start coming back, Screamer immediately sends as
    much data as it can once again its Send Window closes. The traffic pattern of
    Screamer in this case is quick, herky-jerky blasts of packets that start and stop
    repeatedly. Screamer''s sees potentially long & somewhat random-looking delays
    in the network (due to competition with other traffic and excessive latency),
    thus causing it to back off further than it should (due to the perceived performance
    inconsistency of the network). Should the lower-bandwidth Slowpoke attempt to
    send a few frames during all of this, the following is likely to be true:


    +   - An RX ring buffer slot should be available to receive Slowpoke’s packet,
    or it might get lost if Screamer is in the middle of a “packet blast

    - The delay incurred by Slowpoke’s packet read from the buffer is highly variable
    (1 in the best case, 4096 in the worst case). Jitter for Slowpoke (and any other
    streams crossing the firewall) is potentially up to 16 times higher (4096/256=16)
    than the prior example, and Screamer will probably suffer due to the wild variances
    in queue processing delay as well.


    This was a very simple example, but hopefully you can see why it is almost never
    a good idea to crank the ring buffer in an attempt to avoid packet loss at any
    cost. It is normal and expected for loss to occur when TCP streams attempt to
    consume too much bandwidth, so they will adjust to conditions in the network and
    ensure orderly access to'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# RX-DRP Analysis & Discussion 213


    the network for all connection streams. An excessive ring buffer size defeats
    that mechanism as network load increases. If you still need to increase ring buffer
    sizes anyways as a last resort (we will discuss this unhappy situation, see sk42181:
    How to increase sizes of buffer on SecurePlatform/Gaia for Intel NIC and Broadcom
    NIC.


    # Seductive but Dangerous: Increase the SoftIRQ


    ![](img/f71ded7ff9665818f413a53bb0d5a4bb_241_0.png)


    > WARNING: Tampering with the net.core.netdev_budget Gaia kernel variable is not
    documented by Check Point and not officially supported. Check Point’s SND code
    running on the same SND/IRQ core as the SoftIRQ routines are almost certainly
    expecting a certain amount of access to core processing resources relative to
    those SoftIRQ service routines, and allocating a larger SoftIRQ CPU budget than
    provided by default may have unpredictable results.


    Now let’s have a look at method #3 mentioned above: Increasing the CPU “budget”
    for processing frames during a single SoftIRQ processing run by adjusting the
    net.core.netdev_budget Gaia kernel variable. When a scheduled SoftIRQ processing
    run begins, packets are processed until one of the following three conditions
    occur, which will terminate that particular SoftIRQ run:


    +   - All possible packets have been processed, and there are no more packets
    present in any interface ring buffer(s) being emptied by that CPU.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# CoreXL Tuning


    +   - A non-tunable absolute time limit of two “jiffies” has been reached. The
    actual duration of a “jiffy” is dependent on the CPU clock speed. This helps avoid
    improper monopolization of the CPU by the SoftIRQ routine.


    +   - When the total budget (net.core.netdev_budget) for all interface(s) the
    CPU is assigned to empty has been reached. This default value of this variable
    is set to 300 frames.


    In the last two situations listed above, the SoftIRQ processing run is terminated
    early before it has completely finished emptying the ring buffer(s), and it is
    forced to relinquish the CPU for other operations that wish to use it. How can
    we tell if either of latter two situations has occurred on our firewall and in
    what quantity? Use the **cat /proc/net/softnet_stat | cut -c1-27** command, which
    displays all values in hexadecimal:'
