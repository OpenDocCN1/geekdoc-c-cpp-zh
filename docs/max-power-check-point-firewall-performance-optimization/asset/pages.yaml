    # Introduction: SMT/Hyperthreading


    In the first edition of Max Power, SMT/Hyperthreading was referred to as “Hyperspect”
    which is an outdated term. That first edition also took a fairly hard line against
    SMT, unless it was conclusively shown that the vast majority of firewall traffic
    was being handled in the Medium Path (PXL). It was also stated that enabling SMT
    under any other circumstances was increasing complexity for a questionable gain
    in performance, and that SMT had not been extensively deployed by Check Point
    customers in the real world. My stance on SMT has softened somewhat, but assuming
    you have reached our stated goal of 50% idle on all cores during the firewall’s
    busiest period with an RX-DRP rate of less than 0.1% on all interfaces, you really
    don’t need to enable SMT, even if your firewall supports it.


    However for the new series of 5800/5900/15400/15600/23500/23800 appliances, Check
    Point now recommends enabling SMT as a best practice regarding the percentage
