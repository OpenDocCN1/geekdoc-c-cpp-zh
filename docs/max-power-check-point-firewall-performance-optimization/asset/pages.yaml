  md: '# Basic Gaia Optimization: Key Points


    +   - Enabling some firewall blades can have dramatic impact on firewall performance.

    - The top command can be used to profile the firewall''s CPU usage in both process
    space and system/kernel space.

    - The free command can be used to assess whether the firewall has sufficient RAM
    available or is having to dip into performance-killing virtual memory.

    - Ensure Gaia is running in 64-bit mode if the firewall has at least 6GB of memory.

    - Clean up old files if disk space is low on the firewall.

    - All Gaia firewalls should have their Capacity Optimization set to “Automatic”
    to avoid running out of connection table entries.

    - The sar command and using the top command in batch mode can provide live monitoring
    of firewall performance.

    - cpview is an outstanding tool that can provide live and historical firewall
    statistics.'
