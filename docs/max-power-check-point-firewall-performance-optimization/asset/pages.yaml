  md: 'firewall, regardless of whether it was upgraded from an earlier release or
    fresh-loaded from scratch. Physical cores dedicated to SND/IRQ functions will
    never have processes execute on them in this case.


    Why was this affinity change made in R80.10? Almost certainly to keep the CPU
    fast caches as “hot” as possible for the SND/IRQ cores; this permits the relatively
    small SND/IRQ routines to take up increased residence in the CPU fast caches of
    the SND/IRQ cores, and not have those fast caches constantly trashed by some wayward
    process looking for an open CPU. But just how “hot” can those fast caches get?
    The 13000 series and higher models of Check Point gateway appliances have at least
    20MB of what Intel calls “SmartCache”, which is essentially Layer2/Layer3 cache
    that is accessible to all cores. For comparison here is a table showing the resident
    memory size of the various R80.10 kernel drivers used for firewall traffic inspection
    & processing in the kernel:'
