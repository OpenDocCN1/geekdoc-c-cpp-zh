  md: '# 232 CoreXL Tuning


    instances from 3 to 2. Adjacent cores 0 and 1 now run much more efficiently just
    handling SND/IRQ operations, and there are still 2 Firewall Worker cores available
    as well.


    With a 2/2 split it is fairly unlikely that RX ring buffer sizes will need to
    be increased with a 4 core system (unless the firewall is seriously overloaded),
    but increasing the interface ring buffer size can be justified in some cases.
    If you decide to increase the ring buffer size on an interface, try doubling it
    first. Start by doubling the ring buffer size from its default of 256/512 using
    the problematic interface(s) with the clish command set eth0 rx-ringsize X. Do
    not blindly crank it to the maximum allowed value.


    If after increasing the ring buffer RX-DRP rate is still >0.1%, double it again,
    and continue until the maximum is reached. If you reach the ring buffer maximum
    size for your NIC, I regret to inform that your firewall may not appropriately
    sized for your environment, and it is probably time to get budgetary numbers in
    place for new firewall hardware. The Check Point cps tool can be quite helpful
    in determining how big of a firewall appliance will need to purchase. See sk88160:
    The Check Point Performance Sizing Utility for more details.


    If the idle percentage of the remaining Firewall Worker cores during the firewall’s
    busiest period is still less than 50%, head to the SecureXL chapters for optimization
    steps to get that idle percentage up.'
