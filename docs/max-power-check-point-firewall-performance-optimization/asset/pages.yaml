  md: '# Network Interface Stability and Error Counters 33


    If the tx flow control parameters are nonzero, the firewall’s NIC has tried to
    signal the switch that it is about to be overrun and to “please slow down”. However
    by default flow control is off on most switches, so the rx values will almost
    certainly be zero unless the switch has flow control enabled well. It is actually
    possible for the RX-OVR counter in the netstat -ni output to be zero, but the
    tx_flow_control_xon and tx_flow_control_xoff counters are nonzero. How can this
    be? Essentially the NIC signaled the switch that it was out of RAM buffering capacity
    (using the nonzero tx_flow_control counters) but it did not actually run out and
    drop any frames. For a bonded configuration may be needed at some point.


    Why is bonding so strongly preferred over using flow control? Gigabit Ethernet
    control is essentially trying to perform congestion management for the network
    to prevent NIC overruns. However the vast majority of traffic in most networks
    is TCP-oriented, which has its own congestion control mechanisms. Because there
    are now two different congestion control mechanisms being implemented when NIC
    flow control is switched on, they can interact in unexpected ways that can actually
    hurt performance by making a TCP system slow down more than it should. One example
    of this phenomenon is known as “Head of Line Blocking”. (Google Beware Ethernet
    Flow Control” for a great article describing this effect) So the bottom line is
    this: I can only recommend enabling flow control in lieu of interface bonding
    for two scenarios if you are accumulating RX-OVR events on an interface:


    +   - The vast majority of traffic in your network is not-TCP (UDP, ICMP, etc)
    and does not have its own congestion control mechanisms


    +   - You don’t have another free physical interface available to implement bonding'
