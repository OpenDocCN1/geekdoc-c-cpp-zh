  md: '# # CHAPTER 14

    DIAGNOSING INTERMITTENT

    PERFORMANCE ISSUES


    Humans have a phrase: "What is past, is prologue." Minbari also have a phrase:
    "What is past, is also sometimes the future."


    Babylon 5, episode “Z’ha’dum”


    # Introduction


    Ah...the dreaded “intermittent network performance issue” that strikes into the
    heart of firewall and network administrators everywhere. Users complain that the
    network is slow during what appear to be random periods, and you can seem to find
    no pattern to the slowdowns or any correlation to increased network and/or firewall
    load. In other cases, performance was reported to be slow at some point in the
    past, but it seemed to clear up “all by itself.” If you’ve worked in Information
    Technology for any significant length of time, you are painfully aware that when
    problems occur and then seem to disappear with no explanation, they will inevitably
    return to the most utterly inconvenient and highly annoying moment possible.


    Regardless of whether the issue is a one-time event in the past or a seemingly
    recurring issue, of course the firewall will be blamed and the poor firewall administrator
    will be required to exonerate themselves. A typical Network Management System


    421'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# 422 Diagnosing Intermittent Performance Issues


    (NMS) that polls network devices and receives event traps from them using a protocol
    such as Simple Network Management Protocol (SNMP), can be invaluable in tracking
    down these types of issues and their cause. But look out: some NMS’s can get overly
    aggressive with their SNMP and ICMP polling of DMZ systems and actually cause
    performance issues on the firewall. Check out the Rate Limiting feature described
    in Chapter 13 if needed to keep the NMS from pounding the firewall too hard.


    In this chapter we will examine what you have to work when trying to diagnose
    past and/or intermittent performance problems, (and it is not possible (infeasible)
    to catch the problem “in the act”. While we will tend to follow the philosophy
    espoused by the progression of chapters in this book and our work up from the
    bottom of the OSI stack, there are certain things to check that have a high “bang
    for the buck” value when it comes to quickly finding a problem’s root cause. In
    those cases we will employ some shortcuts to save troubleshooting time.


    While the tools and techniques presented in this chapter can certainly be useful
    when trying to diagnose things that are intermittently (or permanently) broken
    and not working at all, our focus will be where everything is still working but
    just much slower than usual. The root cause can most certainly be someplace external
    to the firewall itself; however our main concentration will be exasperating or
    further implicating the firewall in regards to the performance issue.


    # What Changed & When?


    Did the performance problem start immediately (or randomly happening) after something
    was changed in the firewall or surrounding network? First off, make sure you have
    a very good idea of when the problem started and how often it tends to occur (if'
  merge: -1
  pgno: 450
- img_proc: true
  md: '# What Changed & When? 423


    applicable). Does it seem to affect everywhere in your organization or just certain
    parts? Does it tend to happen in the middle of day when everyone is at their desks,
    or in the middle of the night when typically only automated processes like backups
    are executing? Be sure to establish clear answers to these questions: Where? When?
    Who? How? Doing so will lead us to the answer for “Why?” which is what we seek.
    And then of course the big question: does the problem seem to impact traffic that
    not pass through the firewall at all? If the answer to that last question is yes,
    the problem is probably not something directly related to the firewall.


    If you are clearly able to establish when the performance problem first started
    (and when it has recurred if applicable), your initial step is to see if something
    was changed on the firewall that may have induced this behavior to start occurring.
    There are two main areas to check for configuration changes made on the firewall:
    the Gaia OS and the Check Point policy/object configuration.


    For the Gaia OS, look at the syslog files on the firewall in /var/log/messages*.
    All changes made to the Gaia OS configuration via clash or the Gaia web interface
    are logged. If a firewall cluster is present, make sure you look in the syslog
    of the firewall that was active when the problem happened. Based on the timestamps
    within, proceed to the log entries just before the problem started. Here is an
    example which has been edited for brevity:'
