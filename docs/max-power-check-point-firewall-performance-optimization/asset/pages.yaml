  md: '# Medium Path CPU Usage Optimization 323


    While both the methods shown for disabling all Threat Prevention protections for
    the Behemoth will accomplish the stated goal, generally speaking only one of them
    will make traffic to and from the Behemoth potentially eligible for handling in
    the Accelerated Path, while the other will have no effect on path selection by
