    # SmartView Historical Reports


    Included for completeness is the little-known capability of the R77.30 and R80+
    SmartView Monitor GUI to provide historical network & CPU activity reports. While
    the available granularity of these reports falls off considerably after 24 hours
    has passed, they can be useful to establish visual trends over a long period for
    items such as firewall CPU utilization and network activity. There are a couple
