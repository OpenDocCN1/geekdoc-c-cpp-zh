    the end of this section:


    +   1) Create a Manual NAT rule

    2) In Original Source, put the inside network object (or a group of internal network
    objects) to hide

    3) Translated Source of this manual NAT rule must be a IP Address Range object
    (a network object will not work), configured with the routable range of "fewer"
    addresses to hide behind'
