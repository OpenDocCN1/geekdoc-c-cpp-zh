    # Case Study: Oracle Database Traffic & IP Fragmentation


    An Oracle user reports terrible database performance through a Check Point firewall.
    When running performance benchmarks of Oracle traffic through the firewall, one
    of the Firewall Worker cores hits 100% utilization and overall throughput is only
    a small'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# 336 SecureXL Throughput Acceleration


    percentage of the available LAN bandwidth. The commands fwaccel stats -p and fwctl
    pstat report huge numbers of fragmented packets traversing the firewall.


    After some investigation, it is found that the Oracle database product has a critical
    setting known as "Session Data Unit" or SDU. By default, Oracle sets this value
    to 2048 which is obviously higher than the typical Ethernet MTU of 1500. Unfortunately
    the default setting will result in massive IP fragmentation of traffic leaving
    the Oracle database server. If this traffic attempts to traverse a Check Point
    firewall, none of the database traffic will be eligible for SecureXL Throughput
    Acceleration and will always take the Firewall Path (F2F). If the involved traffic
    is traversing two high-speed LAN interfaces, one unlucky Firewall Worker will
    rapidly hit the wall as as far as performance is concerned. The Dynamic Dispatcher
    cannot mitigate this situation in this particular case, because the heavy traffic
    is occurring inside a single TCP connection (sometimes referred to as an “elephant
    flow”), whose processing cannot be performed by more than one Firewall Worker.


    The fix to get rid of this packet fragmentation? Set the Oracle SDU value to 1460.
    Why not set it to 1500? The 40 byte differential accounts for the presence of
    IP and TCP headers which total about 40 bytes. After applying this Oracle SDU
    setting change, firewall performance was substantially increased due to the lack
    of packet fragmentation.


    # Which Path is a Certain Connection Using, and Why?


    Suppose a certain connection traversing the firewall is experiencing a latency
    or functionality issue. It could well be one of those dreaded “legacy applications”
    that nobody wants to think about or interfere with, similar to the “Behemoth”
    discussed earlier in the book. In the usual finger-pointing that ensues, the firewall
    will of be'
