    However one situation that can occur in this case will severely damage the firewall’s
    performance (almost to the point of looking like rolling outages in some cases):
    an overflow of the firewall’s ARP cache. By default, the R77.30/R80.10 Gaia OS
    has a default value of 4096 ARP cache slots available for use. The default under
    lower firewall code versions was much lower (in R75.40 Gaia the default limit
    is 1024). These ARP cache slots are shared by all interfaces (both untagged and
    tagged) of the firewall. If the ARP cache table fills up (let’s say the limit
    in our example is 1024), the firewall will not be able to cache an IP address
    to MAC address mapping for the 1025th workstation. Successful communication between
    that workstation and the firewall will be impossible until ARP cache slot becomes
    available. Once the mapping is finally formed and cached in the firewall’s ARP
    table, communication with that workstation will now succeed, but some other workstation’s
    to IP address mapping will now be “odd man out”. The process continues with firewall
    connectivity issues that seem to roam through the entire network randomly, severely
    impacting performance.


