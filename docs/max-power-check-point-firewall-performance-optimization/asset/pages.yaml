    RX-DRP as:


    > The RX-DRP counter is incremented when the NIC driver is unable or unwilling
    to place a descriptor in the RX ring buffer pointing to the frame it just received
    from the NIC’s hardware buffer.


    We covered the “unable” part of the equation thoroughly earlier in this chapter;
    a full RX ring buffer not getting fast enough by SoftIRQ processing. Now it is
