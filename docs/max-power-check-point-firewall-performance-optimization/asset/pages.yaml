    for subsequent allocation. So for example on a 16-core R77.30 firewall with 12
    Firewall Workers, for each Firewall Worker core only 4166 source ports per external
    Hide NAT address are available for source port remapping. With SMT enabled there
    are now 24 Firewall Workers and only 2083 ports available per core for remapping
    per external Hide NAT address. This is a rather low value, and new Hide NAT connections
    that fail to obtain a source port for remapping are simply dropped by the firewall,
    regardless of whether a security policy accepted them.


    However R77.30 has an available built-in for the Hide NAT port allocation failures
    that are much more likely to occur when SMT/Hyperthreading is enabled. Ports used
    for Hide NAT source port reallocation can be dynamically pooled among the Firewall
    Worker cores, instead of being statically assigned. This new feature is not enabled
    by default in R77.30 and earlier. It involves the **fwx_nat_dynamic_port_allocation**
    variable from 0 to 1, which will dynamically pool source ports among all Firewall
    Worker cores. sk103656: Dynamic NAT port allocation feature for instructions to
    set this variable on an R77.30 firewall.


    In R80.10 gateway (whether upgraded from R77.XX or loaded from scratch) there
    are 6 or more Firewall Worker cores configured, by the default **fwx_nat_dynamic_port_allocation**
    variable will be automatically set to 1, otherwise it will remain set to 0. Statistics
    can be dumped for the Dynamic Port Allocation feature by running this command:'
