  md: 'Specific Recommendations by Number of Cores


    # Specific Recommendations by Number of Cores


    The following table contains the default core allocations “out of the box” when
    CoreXL is enabled, along with general guidelines that I use when deploying a new
    Check Point firewall. In cases where tuning adjustments are being made on an existing
    Check Point firewall, minimum idle percentages for the Firewall Worker cores are
    provided along with the same recommendations. There are always exceptions to the
    figures listed here, but in the vast majority of cases they have served me well
    as an initial starting point. Note that on open firewall hardware (such as a Dell
    or HP server), if the total number of cores exceeds the licensed number of cores,
    for purposes of CoreXL it will only “see” the licensed number of cores, and the
    remaining cores will be unusable. This behavior is covered in more detail in the
    upcoming “CoreXL Licensing” section.'
