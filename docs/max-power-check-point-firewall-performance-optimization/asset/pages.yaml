    # CoreXL Unsupported VPN Features


    CoreXL is not supported with the “Traditional” VPN setup mode on either R77.30
    or R80.10+. The default mode for setting up Check Point VPNs is “Simplified” VPN
    Mode, which is fully compatible with CoreXL. Simplified mode utilizes objects
    called VPN Communities, and the “VPN” column will be present in the Security Policy
    Rule Base. Traditional Mode uses the “Encrypt” and “Client Encrypt” actions in
    the security policy rule to build tunnels, and the VPN column will be absent in
    the policy.


    Fortunately the R77.30 SmartDashboard provides a wizard to convert Traditional
    VPN Policies to Simplified under the menu “Policy...Convert...to Simplified”.
    If you have a Traditional Mode VPN, you must convert it to Simplified or you will
    be stuck having to disable CoreXL on your R77.30 firewall; as a result 100% of
    all Firewall Worker operations will be crammed on a single overloaded core, regardless
    of how many physical cores the firewall has. Also note that the wizard to convert
    Traditional VPN policies to Simplified is not present in R80+ management. If you
    are planning to convert your VPN policies from Traditional to Simplified using
    the wizard, do it before upgrading to R80+ management.


    CoreXL cannot be enabled at if a route-based VPN is in use on R77.30 firewall;
    use of IKE2 with route-based VPNs on an R77.30 firewall is also not supported.
    Both these limitations were resolved on the firewall in release R80.10.'
