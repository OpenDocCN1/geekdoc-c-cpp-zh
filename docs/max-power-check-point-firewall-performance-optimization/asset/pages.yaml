  md: 'Firewall Worker core will dramatically impact performance in a negative way.
    Setting “any” for a manual interface affinity can also have a dramatically negative
    performance impact for the same reason, and should be avoided. Changes made here
    take effect immediately and will survive a reboot; the modified settings are stored
    in $PPKDIR/boot/modules/sim_aff.conf file on the firewall. Run sim affinity -1
