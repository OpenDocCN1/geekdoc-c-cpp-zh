  md: '# SecureXL Throughput Acceleration


    One other wrinkle to keep in mind though: What about multiple Threat Prevention
    layers for R80.10+ firewalls? In most configurations I’ve seen, there is only
    one Threat Prevention policy layer in a policy package, or at least there is a
    typical Threat Prevention policy layer and a “special” separate IPS policy layer
    for R77.30 and earlier gateways. The previous example assumes that only one Threat
    Prevention policy layer exists, but what happens if there is more than one?


    If there are multiple Threat Prevention policy layers present, they are all evaluated
    simultaneously, with no more than one rule matched per individual TP policy layer.
    Multiple matches will always choose the most restrictive action. In our example,
    if traffic to and from the Behemoth matches a rule in more than one TP policy
    layer, the Disable_All_TP profile will probably not be applied, as it is almost
    certainly less restrictive than the match in the other TP policy layer. On the
    other hand, Global Exceptions are just that: applied globally across all TP policy
    layers. So as long as there is only one TP policy layer (not including the “special”
    IPS layer for R77.30 gateways) the Disable_All_TP profile will be applied as expected
    to the Behemoth’s traffic. Watch out though when you first add a second TP policy
    layer, as it may start overriding null profiles that were defined in your original
    TP policy layer!


