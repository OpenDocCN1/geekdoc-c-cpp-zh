    # ## Background


    In this chapter we will discuss optimization strategies for the Access Control
    policy layers in the R80+ SmartConsole. While the screenshots and overall tone
    of this chapter will assume you are utilizing R80+ management, the recommendations
    have been carefully crafted to be applicable to R77.30 management as well, and
    “future-proofed” for when you eventually upgrade to R80.10+ firewall code. The
    recommendations made in this chapter will improve firewall performance regardless
    of the state and/or configuration of CoreXL/SecureXL on your firewall; tuning
    these critical acceleration technologies is covered in later chapters. We will
    eschew the command-line discovery phase in this chapter since the policy layers
    configuration is performed from the SmartDashboard/SmartConsole GUI. As we proceed
    it is assumed that you are following along your own policy configurations and
    making adjustments as we go.


    This chapter is not intended as an introduction to how policy layers are handled
    in R80+ management; it is assumed that you are already working with policy layers
