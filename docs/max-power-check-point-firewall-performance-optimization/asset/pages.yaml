  md: '# Manual Affinities & SecureXL


    The procedure for configuring manual interface affinities will heavily depend
    on the answer to one key question: SecureXL (also called Performance Pack) enabled
    or not? If SecureXL is enabled (which hopefully it is based on our discussion
    at the beginning of Chapter 9), the command sim affinity will be the primary technique
    used to set manual interface affinities. If SecureXL is disabled, the fw ctl affinity
    command must be used instead. In the following sections we will also examine the
    $FWDIR/conf/fwaffinity.conf file and its applicability to setting permanent manual
    affinities.


    # Manual Interface Affinity with SecureXL Enabled


    The sim affinity command is used to set manual interface affinities when SecureXL
    is enabled. Attempts to set manual interface affinity via the $FWDIR/conf/fwaffinity.conf
    file will be thoroughly ignored when SecureXL is enabled. First check the current
    interface affinities with the command affinity -l:


    ```

    [Expert@firewall:0]# sim affinity -l

    eth0 : 0

    eth1 : 1

    eth2 : 0

    eth3 : 1

    [Expert@firewall:0]#

    ```


    Figure A-1: Checking Automatic Interface Affinities'
