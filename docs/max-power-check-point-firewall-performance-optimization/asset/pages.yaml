    # Special Case: 2 Cores


    Firewalls that have only 2 cores present, to some degree, are between a rock and
    a hard place when it comes to CoreXL. Use of 10Gbps interfaces (even if available)
    with a 2 core system is definitely not recommended. As shown in the table above,
    by default there are 2 cores allocated to Firewall Worker/INSPECT processing,
    and those same cores are allocated to SND/IRQ processing as well when CoreXL is
    enabled. This lack of specialization in core functions will cause massive CPU
    fast thrashing as the two available cores switch back and forth from SND/IRQ functions
    to Firewall Worker/INSPECT functions. We have two possibilities available to us
    in this case:


    +   - Default: CoreXL on, 2 SND/IRQ, 2 Firewall Workers


    +   - Option: CoreXL off, 1 SND/IRQ, 1 Firewall Worker


    It is not possible to leave CoreXL enabled yet reduce the number of Firewall Worker
    instances from 2 to 1 on a 2-core system. Your only choices on a 2-core system
    in regards to CoreXL are having CoreXL on or off (SecureXL is controlled separately).
    However if RX-DRP is0.1% on any interfaces, and your firewall is configured with
    the default 2 SND/IRQ instances and 2 Firewall Worker/INSPECT instances, take
    some good performance and CPU utilization measurements, disable CoreXL using the
    `cpconfig` command, reboot the firewall, and measure performance again. When'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# CoreXL Tuning


    CoreXL is disabled, all SND/IRQ processing is concentrated on Core 0, and a single
    Firewall Worker instance is placed on Core 1. In some environments this will provide
    a significant performance boost as the RX-DRP rate dips well below 0.1%, due to
    the massive increase in CPU fast cache hits on Core #0, since it is specialized
    for SND/IRQ processing. However the clean delivery of packets may now throw a
    much higher load on the single remaining Firewall Worker instance, even though
    it has been relieved of the additional overhead of CoreXL. Contrary to what Check
    Point’s documentation states, disabling CoreXL completely does not preclude the
    use of Medium Path processing (the Medium Path is discussed in Chapter 9).


    If the RX-DRP percentage is below 0.1% on all interfaces, but the Firewall Worker
    idle time is less than 50% during the firewall’s busiest period, proceed to the
    SecureXL chapters to commence optimizations that will hopefully increase idle
    time on the Firewall Worker before making any further CoreXL tuning attempts.


    If RX-DRP is still in excess of 0.1% after disabling CoreXL, and SecureXL optimizations
    in later chapters have already been performed, this is one of the situations where
    the problematic interface’s ring buffer size may be helpful, and is worth the
    potential trade-offs. By doubling the ring buffer size from its default of 256/512
    on the problematic interface(s) using the clish command set interface eth0 rx-
    Oldize X. Do not blindly crank it to the maximum allowed value.


    The goal is to tune the ring buffer size to be just big enough to handle the network
    load with an RX-DRP rate of <0.1% during the firewall’s busiest period; arbitrarily
    cranking the buffer to maximum can cause additional overhead in the SND/IRQ core,
    and hurt overall throughput due to winds in jitter. If increasing the ring buffer
    the RX-DRP rate is still >0.1%, double it again, and so on until the maximum is'
