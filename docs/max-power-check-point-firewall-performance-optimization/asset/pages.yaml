  md: '# Troubleshooting “Slow” Failovers


    **Question:** Whenever a failover occurs, all network traffic trying to pass through
    the firewall cluster comes to a screeching halt for about 15 seconds, and then
    resumes. When we experience multiple failovers in short time period this absolutely
    kills our network performance. What is going on?


    Answer: There are several situations that can cause these “slow” failovers:


    +   1. The default “dead” timer for ClusterXL is approximately 3 seconds. If the
    active member suffers a catastrophic failure (such as the power cord being pulled
    or a Gaia system crash/panic), the standby member must wait the dead interval
    before concluding the active member has failed and taking over. During waiting
    period no traffic will pass through the cluster. However for administrative failovers
    using `clusterXL_admin` or other partial failures (such as a single network interface
    getting unplugged, or running a service-impacting command such as `fw unloadlocal`
    failover to the standby should happen almost instantly with minimal packet loss.


    +   2. If the active cluster member’s CPUs are running at 80% utilization or higher,
    by default in R77.30 gateway and the Cluster Under Load (CUL) mechanism is invoked,
    *which extends the ClusterXL dead timer from 3 seconds to 12 seconds*. The purpose
    of CUL is to avoid spurious and unnecessary failovers due to transient high CPU
    loads on the active cluster member. Needless to say if a catastrophic failure
    occurs on the active member while CUL is active, the standby member will have
    to wait four times as long before taking over. To determine if the CUL mechanism
    is currently (or previously) active on your cluster, run `grep cul_load_freeze
    /var/log/messages*` as CUL logs all information about'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# ClusterXL HA Performance Tuning


    its operation to the gateway''s syslog. Making sure your cluster members are properly
    tuned and optimized as outlined throughout this book can keep your active cluster
    member well below 80% CPU utilization and avoid invoking CUL. More information
    about the CUL mechanism is here: sk92723: Cluster flapping prevention.


    +   3. In some cases, the Spanning Tree Protocol (STP) algorithm on the switches
    adjacent to the firewall cluster may incorrectly sense a bridging loop when a
    failover occurs. As first mentioned in Chapter 2, by default the STP algorithm
    on the switch will block all forwarding to the problematic port for approximately
    10-15 seconds in an attempt to break the bridging loop. On some Cisco switches,
    the LED for the switchport will visually glow instead of the usual green during
    this blocking period. This situation is much more likely to happen if the “Use
    Virtual MAC” option is set in the cluster object properties (it is disabled by
    default). Setting “portfast” mode on all switch ports attached to the firewall
    cluster will help avoid this situation and ensure a timely failover.


    +   4. If the firewall cluster members themselves are participating in a dynamic
    routing protocol such as OSPF or BGP (and not using static routes only), a slow
    failover could be indicative of routing table convergence problems in the network.
    In particular the Gaia option “Wait for Clustering” should be enabled on both
    cluster members, to ensure that any dynamic routing protocols on the firewall
    cluster members wait for the cluster to completely stabilize before commencing
    operation. The “Wait for Cluster” setting is enabled by default starting in R77.30,
    but if your firewall was upgraded from an earlier version it may not be enabled.
    See the following for more information about the “Wait for'
  merge: -1
