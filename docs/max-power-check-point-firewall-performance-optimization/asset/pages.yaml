  md: '# Access Control Policy Tuning


    # The NAT Cache


    The first packet of a new connection accepted by the Network Access layer that
    involves NAT will always make a trip to the Firewall Path (F2F) by default, unless
    NAT Templates are enabled. Even if the firewall has a very large NAT rulebase,
    most of the firewall doesn''t even have to evaluate it to the NAT Cache Table
    **fwx_cache** which is enabled by default. Essentially the most common NAT rulebase
    hits are cached in a special table that can determine the required NAT operation
    quite efficiently during future NAT lookups. The presence of this NAT caching
    mechanism is probably why hit counts are not available for NAT rules. Once the
    first packet of an accepted connection has NATted, and its **fwx_cache** table
    is never consulted again for that particular connection, and as such the NAT applied
    to a connection''s packets cannot ever change after the connection''s first packet.


    By default this NAT cache can contain up to 10,000 NAT entries (the cached entries
    are expired from the table after 30 minutes by default). Whenever an “Original
    Packet” NAT rule match occurs in the NAT rule base, the source, destination, and
    service port number associated with the NAT rule are cached in the **fwx_cache**
    table, along with the necessary NAT operation to be performed under “Translated
    Packet”. If the same source, destination, and service port number show up for
    a new allowed connection, the NAT rulebase itself is never consulted, and the
    cached NAT operation is performed instead saving the overhead of a full NAT rulebase
    lookup.


    So how many of the potential 10,000 NAT entries are in use on your firewall? Run
    the command `fw tab -t fwx_cache -s:`'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# NAT Policy Optimization


    ```

    [Expert@firewall:0]# fw tab -t fwx cache -s

    HOST            NAME ID #VALS #PEAK #SLINKS

    localhost fwx_cache 8116 455 4518 0

    [Expert@firewall:0]#

    ```


    Figure 5-18: Displaying NAT Cache Statistics


    #VALS indicates the number of current cached NAT entries and #PEAK indicates the
    peak number of entries in the table used since the firewall was last booted. If
    both #VALS and #PEAK are substantially less than 10,000, either you are not doing
    much NAT on your firewall, or a maximal level of NAT caching is already occurring
    in the Firewall Path and there is nothing to do.


    However, what if #PEAK shows 10,000 exactly? First off, fear not. Using all the
    entries in the NAT cache table does not cause an outage or otherwise impede traffic;
    it just results in more NAT rule lookups than there would be, which does impact
    performance. So how can we assess whether the NAT cache size should be increased?


    As mentioned earlier, hit counts are not available for NAT rules. However you
    can poke around directly in the fwx_cache table on the line gateway to get an
    idea of which NAT rules are being used. The fwx_cache table does track the NAT
    rule of cached entries; this lengthy command will show the top 20 most commonly
    cached/hit rules


    ```

    fw tab -ut fwx_cache|awk ''{ print $3 }''|cut -c5-8|sort -n|uniq -c | \

    sort -nr|head -20

    ```


    (Note the ''\'' at the end of line 1 of this command is a backslash and allows
    us to continue the same command on a new line)'
  merge: -1
