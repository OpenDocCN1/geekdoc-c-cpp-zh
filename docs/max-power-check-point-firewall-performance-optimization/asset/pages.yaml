    one is preferable from a performance tuning perspective?


    When a Threat Prevention exception is defined as shown in the latter screenshot,
    it is this traffic only impacts the decision rendered by the various Threat Prevention
    blades: this hostile or not? Using an exception as shown in our example still
    calls the Behemoth’s traffic to traverse at least the Medium Path, and does not
    make the traffic eligible for handling in the Accelerated Path at all. This stated
    behavior is not a hard and fast rule for all TP blades in every situation and
    on every firewall code version, but should be assumed in the majority of real-world
    situations.


    In the former screenshot a Threat Prevention ruled the Behemoth’s traffic as a
    Protected Scope, and invoked a profile called “Disable_All_TP” which had all five
    Threat Prevention blades unchecked (a “null” TP profile). On an R80.10+ firewall,
    this technique signals to SecureXL that absolutely zero handling by Threat Prevention
    is necessary, and SecureXL may be able to handle the traffic in the Accelerated
    Path. Even if the example traffic to and from the Behemoth still requires the
    Medium Path because it is being inspected by other features such as APCL/URLF,
    significant CPU time is saved in the Medium Path as a result of skipping all Threat
    Prevention inspection completely. The amount of traffic that can potentially be
    handled in the Accelerated Path using this null profile technique is far higher
