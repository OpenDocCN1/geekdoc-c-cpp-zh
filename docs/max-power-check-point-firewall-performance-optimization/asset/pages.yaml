  md: '# CoreXL Tuning


    Stage 3: The NIC kernel driver begins processing the hardware interrupt, retrieves
    the frame from the NIC’s hardware buffer, and does various sanity checks on the
    frame. If the frame checks out, it places the frame into a reserved area in the
    host’s RAM memory, called a “receive socket buffer”.


    You are possibly suspecting that the so-called “ check” on the frame failed for
    some reason and RX-DRP got increased as a result. Exactly what constitutes a “sanity
    check” in this context? You might guess that the packet itself was corrupt with
    a CRC or framing error, but no! That situation is reflected in the RX-ERR counter
    discussed in Chapter 2, not RX-DRP. There are two main causes for a sanity check
    failure leading to an RX-DRP: a frame was received carrying an unknown or undesired
    protocol type, or VLAN-tagged traffic is being received from the network in an
    inappropriate manner. Let’s examine each of these in detail, and how we can determine
    if these situations are present in your network.


    # RX-DRP Culprit 1: Unknown or Undired Protocol Type


    In every Ethernet frame is a header field called “EtherType”. This field specifies
    the OSI Layer 3 protocol that the Ethernet frame is carrying. A common value for
    this header field is 0x0800, which indicates that the frame is carrying an Internet
    Protocol version 4 (IPv4) packet. Look at this excerpt from Stage 6 of “A Millisecond
    in the life of a frame":


    +   Stage 6: At a later time, the CPU begins SoftIRQ processing and looks in the
    ring buffer. If a descriptor is present, the CPU retrieves the frame from the
    associated socket buffer, clears the descriptor referencing the frame in the ring
    buffer, and sends the frame to all “registered receivers”, which will either be
    the'
