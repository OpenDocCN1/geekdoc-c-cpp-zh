  md: '# Introduction & Concepts


    In general it is recommended to implement only the changes for a particular chapter
    and then re-assess how your system is behaving before moving onto the next chapter
    (or OSI Layer) of your configuration for tuning. As you adjust the lower layers
    of your firewall, the now proper functioning of those lower layers may actually
    exacerbate any performance problems experienced in higher layers. The methodology
    in this book seeks to avoid pushing problems back into a lower layer underneath
    where you are working. Should this unfortunate situation occur, tuning changes
    made at higher layers will seem to have no meaningful effect on performance due
    to the actual problem somewhere lower. For the same reason I don''t recommend
    trying to skip ahead; if a network-level issue is hampering performance you can
    tune CoreXL and SecureXL until you turn blue in the face and nothing will seem
    to help. To say this situation can be frustrating is a gross understatement. Follow
    the procedures and chapters in order, these techniques have served me well.


    # Background: Check Point History & Architecture


    Check Point began shipping firewall products in 1993, and until five years later
    in 1998 the end user of Check Point firewalls was required to provide both the
    hardware and operating system on which to run the Check Point software. This led
    to Check Point’s solution dubbed a “software-based” firewall compared to firewalls
    offered by Cisco and Juniper which are sold all-in-one as hardware, OS, and firewall
    software in a single integrated bundle.


    While Nokia and Check Point themselves began shipping turnkey hardware solutions
    in 1998 and 2007 respectively, at their heart Check Point is still a software-based
    firewall in many respects. Check Point sells a wide variety of firewall appliances
    from very small'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Your Best Friend: GA Jumbo Hotfix Accumulators 3


    SOHO appliances all the way up to chassis-based systems capable of passing hundreds
    of Gbps of data. The use of so-called“open hardware” such as the Dell or HP server
    for the firewall is also supported, the vast majority of new Check Point installations
    today consist of firewall appliances. There is still a clear delineation between
    the operating system of the firewall (Gaia – based on RedHat Enterprise Linux
    5) and the actual Check Point firewall inspection code (CPShared, INSPECT driver,
    SecureXL driver). This delineation is much less on solutions such as Cisco and
