- img_proc: true
  md: '# RX-DRP Analysis & Discussion 205


    The main counters we want to inspect are RX-OK and RX-DRP. The netstat -ni command
    shows the values of these counters when the firewall was booted (recall you can
    also use the sar -n EDEV command to get an idea of when the counters were actually
    incremented). Are they slowly but consistently accumulating over time, or do they
    burst suddenly during certain times of day?


    In our example RX-OK is 3701, while RX-DRP is 93 on the eth0 interface. To compute
    the drop rate, the calculation is (RX-DRP/RX-OK)*100. In our example: (93/3701)
    * 100 = 2.51%. Keep in mind that the drops we examine here have nothing to do
    with traffic being blocked by a Drop or Rejection in our firewall security policy.
    A more accurate term for these would be a “network buffering miss”. You can view
    misses on a Cisco router with the show buffers command; it is exactly the same
    concept.


    One other somewhat unlikely to look for in a netstat -ni output when SecureXL
    is enabled a nonzero TX-DRP counter. While rare, this can indicate that packets
    are being lost during the transmit operation. sk75100: Drops on interface under
    load with SecureXL enabled for instructions to use the sim_requeue_enabled kernel
    variable. Complete all the SecureXL tuning adjustments covered later in this book
    before attempting to make this modification.


    Generally speaking the RX-DRP rate is greater than 0.1%, you should take action
    to mitigate the statistic from a performance perspective. In my experience the
    drop rate reaches 0.1% or higher, a noticeable impact on throughput is encountered.
    0.1% (1 in 1,000 packets are dropped) may seem to a trivial amount of loss that
    would not substantially impact overall throughput. If the drops were evenly distributed
    (i.e. every 1,000th packet was dropped in a consistent fashion), it probably wouldn’t
    have much of an impact at all. However in the real world these drops are almost
    never even'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 206 CoreXL Tuning


    distributed, and typically come in clumps that seriously damage overall network
    throughput. Unlike the RX-OVR and RX-ERR counters discussed earlier, a zero RX-DRP
    rate is not our goal, and may not even be possible in most environments. You are
    probably more likely to hurt overall performance trying to tune the RX-DRP counters
    substantially lower than 0.1%.


    If no firewall interfaces are showing more than 0.1% RX-DRP (make sure the firewall
    has been up and running for at least 1 week to ensure good numbers - run the command
    uptime to check this), great! The rest of this section concerning RX-DRP tuning
    will mostly just be informational for you.


