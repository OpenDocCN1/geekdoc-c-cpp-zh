  md: '# 32 Layers 1&2 Performance Optimization


    Alternatively, Gigabit Ethernet and higher provides a flow control capability
    between a NIC and the switch; generally speaking this feature is on by default
    in the firewall’s NIC but off by default on most switches. Essentially when the
    NIC is starting to run low RAM buffering, it sends a special control frame called
    a “pause frame” to the switch basically saying “I can’t keep up, stopping me traffic
    for a bit (XOFF)”. Once the NIC has sufficient buffering capacity available again
    it sends an XON to the switch telling it to restart the sending of frames.


    This feature is controversial and may well hurt overall performance than this
    helps; more in this moment. Let’s take a look to see if the firewall’s NIC has
    attempted flow control with the switch.


