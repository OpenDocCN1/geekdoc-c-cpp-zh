    # ## Introduction


    Performance tuning is not an exact science. In fact the process is frequently
    referred to as the “Art and Science” of performance tuning. In each chapter the
    background of what is about to be examined will be visited first. I promise to
    only provide the amount of background you need for the task at hand and not venture
    into obscure or esoteric areas. This background information is critical should
    you encounter a situation not covered by this book. By having the necessary foundation
    and background you should hopefully be able to make an informed decision about
    how to handle your findings.


    In many chapters, the next section “Discovery and Analysis” will always start
    with a quick series of commands we will run from an expert mode prompt on your
    firewall. Unless noted these commands should be safe to run during production.
    Ideally you should run most of them during the times when your firewall is at
    its busiest and from the active cluster member in a High Availability (HA) setup;
    we discuss how to determine your firewall’s busiest periods later in this chapter.'
