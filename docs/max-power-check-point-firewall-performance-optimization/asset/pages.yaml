  md: '# SecureXL Throughput Acceleration


    Use the fwaccel stat command to check whether SecureXL is enabled on your firewall.
    When attempting to re-enable SecureXL and retest your organization’s critical
    applications, keep these other commands at the ready; FYI “SIM” stands for “SecureXL
    Implementation Module":


    sim vpn on|off – By default SecureXL attempts to process some VPN traffic in the
    Accelerated Path to increase VPN performance whenever possible.


    Unfortunately in some older releases this could break VPN functionality; in particular,
    traffic that was required to be NATed before being placed into a VPN tunnel (not
    common but sometimes necessary due to RFC1918 private addressing overlaps between
    the two sites) would sometimes function correctly when SecureXL was enabled. Disabling
    SecureXL would resolve the problem. The sim vpn off command tells SecureXL to
    stop attempting acceleration of any VPN traffic, but still allows automatic interface
    affinity and all the other advantages of SecureXL. After running this command,
    SecureXL must be gracefully restarted with the fwaccel;fwaccel commands in order
    for it to take. To make this permanent change across firewall reboots, the line
    sim_is_vpn_disabled=1 to file


    ```

