  md: '# Throughput Acceleration


    Accelerated Path), or if the packet needs to continue on to a Firewall Worker
    core for additional security processing via the Medium Path or Firewall Path.
    In some cases, packets must be sent into process space for special handling; I
    have dubbed this performance-affecting situation the “Fourth Path” which will
    be covered in Chapter 10. Packets that can be handled exclusively by the Acceleration
    Layer will require much less CPU processing in order to be inspected and forwarded.
    Let’s step through an example which does not assume that SecureXL Session Rate
    Acceleration (also called “templating”), which is covered in Chapter 11) is occurring.


    +   1. An IP packet carrying a TCP segment with the SYN flag arrives at the firewall.
    A new connection is attempting to start.


    +   2. The packet is received by the SecureXL Acceleration Layer on a SND/IRQ
    core. This is a brand new connection, and as much it needs to be forwarded to
    the Firewall Worker/INSPECT layer for full processing; however the Acceleration
    Layer makes a note in its state table about the properties of the packet, and
    on which interface arrived.


    +   3. The Firewall Worker/INSPECT driver receives the packet starting the new
    connection on the inbound side and evaluates it against the Security Policy. Let’s
    suppose a rule is present matching the packet and the action is Accept; an evaluation
    is also performed against the NAT policy to determine if NAT needs to be applied
    to the packet.


    +   4. The Firewall Worker/INSPECT driver forwards the packet to the Gaia IP driver
    for a forwarding decision.


    +   5. The Gaia IP driver performs a routing table lookup and determines the packet’s
    egress interface. The IP driver routes the packet towards that interface, and
    the packet is once again in the possession of the Firewall Worker/INSPECT driver
    on the outbound side.'
