  md: '# 346 The Fourth Path: Process Space Trips


    Why is being aware of Check Point firewall functions that cause trips up into
    process space (sometimes referred to as “folding”) of such importance from a performance
    tuning perspective? There are three reasons:


    The first reason is related to a fundamental tenet of any operating system: to
    interact with the underlying system hardware, code that executes in process space
    must interface with the kernel layer to do so. The big advantage is that process
    code needs no direct knowledge of the underlying system hardware components, and
    can run on just about any combination of hardware without needing to be recompiled.
    Another advantage is that the process can horribly screw up or otherwise crash,
    the kernel will automatically clean up the big mess left behind, and overall system
    stability is ensured.


    The second reason is that this interfacing between processes and the kernel imposes
    significant overhead, much more than is caused by kernel drivers/modules accessing
    the underlying hardware themselves. This overhead becomes much more pronounced
    on smaller firewalls with less than 8 cores, and even on larger firewalls that
    are overloaded.


    The third and final reason to be aware of firewall process space trips: kernel
    code always has the power of CPU preemption caused to a process; if both a process
    and kernel module have work to do and both want to use the same CPU to do it,
    the process will lose every time and have to wait for the kernel code to finish.
    The amount of time the process will have to wait for the CPU could be an arbitrarily
    long time (relatively speaking) if overall CPU utilization by kernel modules is
    very high due to an overloaded or improperly tuned firewall.


    The vast majority of Check Point firewall processing takes place in the Gaia kernel
    utilizing custom kernel code developed by Check Point. Most traffic is entirely
    inspected within the kernel by Check Point’s kernel code, and also handled by
    other drivers entirely within the kernel well, such as IP and the various Ethernet
    NIC'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Background 347


    drivers. When no trips to process space are required, processing traffic completely
    within the kernel in the SXL, PXL, and F2F paths can be done at truly incredible
    speeds. So why does a Check Point firewall perform some of its inspection operations
    in processes instead of the kernel?


    Many new Check Point firewall features, when first introduced, are initially implemented
    as processes. Over time, some or all of these functions are moved down into the
    Check Point kernel code for more efficient handling. The main reason this is done
    to ensure stability of the firewall: if new code implemented as a process happens
    to crash, the kernel cleans up the mess and the process is automatically restarted.
    However if that new code was to crash inside the kernel, the entire Gaia operating
    system would crash and the whole firewall would reboot.


    Some features are never migrated into the kernel and remain implemented in a process
    indefinitely. A classic example is the handling of IKE Phase 1 and Phase 2 negotiations
    with a VPN peer gateway. While mainline IPSec encryption and decryption is fully
    handled in the kernel, IKE negotiations are still handled by a daemon called vpd
    on the firewall though the IKE VPN features have been around since the 1990s.
    Why?


    A quirk of the IKE negotiation protocol is that a significant amount of processing
    (including a very computationally expensive Diffie-Hellman key calculation) occurs
    in IKE Phase 1 before the VPN peer is even authenticated. This is what I would
    term a “potentially unsafe” operation undertaken by the firewall. Could the unauthenticated
    peer we are negotiating with hostile intent, and sending us maliciously crafted
    packets with the intent of causing a DoS or even flat-crashing us? Yes! If the
    crash occurs in a process, the kernel cleans up the carnage and the process is
    restarted. However if this “potentially unsafe” operation causes a DoS or'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# 348 The Fourth Path: Process Space Trips


    unexpected failure down in the kernel, the entire firewall could be slowed or
    even crashed completely.


    One use case for executing a firewall function in a process instead of the kernel:
    firewall interaction with outside servers including the Check Point ThreatCloud.
    A process is well-suited to “waiting around” for a response from an external server,
    while it is generally counterproductive to have kernel code do so. So for example
    a URL needs to be categorized and the needed information is not already cached,
    the kernel can put the subject connection on hold and pass the site categorization
    request to a process (rad), and the kernel can then resume processing of other
    network traffic. When the categorization result is finally returned, the kernel
    is notified with the results and takes the appropriate action on the held connection.
    This is much more efficient than having kernel code “waiting around” for this
    categorization response, as we want the kernel code to immediately get back to
    what it is supposed to do: inspect and move packets through the firewall in an
    expeditious fashion.


    To summarize, be aware of the following in regards to process space trips occurring
    on the firewall before proceeding to the next section:


    +   - On a firewall that has been properly sized and tuned, trips up into process
    space are not a big deal and cause a noticeable degradation of performance

    - The kernel provides an abstraction layer between a process and the underlying
    hardware, and can clean up the mess left behind by a crashed process

    - Extra processing overhead is incurred by trips to process space while inspecting
    traffic, and the effect can be more noticeable on smaller firewalls (<8 cores)

    - If a CPU is heavily loaded and executing in most system/kernel space, processes
    trying to use that same CPU can experience delays of an indeterminate length


    maxpowerfirewalls.com

