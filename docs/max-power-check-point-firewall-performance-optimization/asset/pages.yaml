  md: '# Access Control Policy Tuning: Key Points


    +   - Properly defining your firewall’s interface topology is crucial to proper
    application of the “Internet” network object and any Security Zone objects in
    use.


    +   - Geo Policy is a highly underrated feature that can be used to drop large
    amounts of undesirable traffic with minimal processing overhead, based on a source
    or destination geographic country.


    +   - When employing policy layers under R80+ management, a “cleanup” rule does
    not necessarily drop traffic.


    +   - From a performance tuning perspective, there are minimal differences between
    utilizing Ordered or Unified/Inline layers in a security policy under R80+ management.


    +   - Avoid the use of object “Any” in as many columns of your policy layers as
    possible, but especially the Destination column to help maximize the performance
    gains provided by Column-based Matching and Early Drop.


    +   - Utilize object “Internet” in APCL/URLF policies and try to avoid using “Any”.


    +   - A “many to fewer” manual Hide NAT can be configured to permit more than
    50,000 concurrent connections in a single Hide NAT rule.


    +   - Application connections that are timed out by the firewall can optionally
    receive a TCP RST notice from the firewall.


    +   - Enhanced logging of TCP connections being idled out of the firewall’s state
    table is available.


    +   - Specifying “Accounting” in the Track column of a rule provides additional
    statistics about the matched connection, and can be used to infer how much data
    was sent (if any) in the connection and how the connection was routed.'
  merge: -1
