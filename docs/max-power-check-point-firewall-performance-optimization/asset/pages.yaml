    # Geo Policy: Your Secret Weapon


    Geo Policy is an incredibly underrated feature for firewall performance improvement
    that is almost certainly not being utilized to its full potential in your environment.
    In R77.30 and earlier, Geo Policy (formerly called Geo Protection) blade was an
    inseparable part of the Intrusion Prevention System (IPS) blade, and as a result
    required a valid IPS license/contract to be present on the firewall.


    However in a major shift for R80.10, Geo Policy has been extricated from the IPS
    blade and is now just another part of the main Access Control policy. As a result,
    changes to the Geo Policy will take effect upon an Access Policy installation;
    a Threat Prevention policy installation is not necessary. In addition, the IPS
    blade does not even need to be enabled (or licensed) on an R80.10+ gateway at
    all to take advantage of Geo Policy.


    Customers that have implemented a well-crafted Geo Policy report a firewall CPU
    utilization drop of at 10%, and sometimes much more depending on the size of their
    Internet-routable address space. A big part of the “background noise” of the Internet
    is automated probes and scans from compromised systems seeking other systems to
    infect.'
