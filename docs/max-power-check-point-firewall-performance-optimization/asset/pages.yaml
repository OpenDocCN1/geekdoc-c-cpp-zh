  md: '# Policy Tuning to Maximize SecureXL Templating 377


    If you have Anti-Bot enabled on the firewall, all traffic subject to inspection
    by that blade will be ineligible for SecureXL templating (but Throughput Acceleration
    will be unaffected). If you are seeing a template rate of zero in this case, you
    are probably applying the Anti-Bot blade to all traffic crossing the firewall
    with a Protected Scope of “Any” in the relevant Threat Prevention policy rule.
    In Chapter 9 there were numerous warnings about avoiding the use of “Any” in the
    Protected Scope field for this reason (among many others).


    The cause of this issue is a key component of Anti-Bot IP address reputation.
    However if a connection is fully templated by SecureXL and a rulebase lookup never
    occurs in the Firewall Path, the Anti-Bot feature (which lives in the Medium and
    Firewall Paths) will never see the start of the connection and be able to determine
    the reputation of the IP addresses involved. If Anti-Bot cannot see the connection
    start, it cannot stop it until it reaches the Medium or Firewall Path when data
    begins to flow in the connection, assuming it ever does due to the possibility
    of being fully throughput accelerated in the SXL Path. As of R80.10, there does
    not appear to be a notification mechanism between SecureXL and the Anti-Bot feature,
    so as result templating cannot be allowed at all for new connections subject to
    Anti-Bot inspection. This limitation does not appear to be documented anywhere
    that I find, but certainly confused the heck out of the first time I encountered
    it.


    Obviously the solution is to be a bit more careful with how Anti-Bot is applied
    in your Threat Prevention policy; details are located in Chapter 9.


