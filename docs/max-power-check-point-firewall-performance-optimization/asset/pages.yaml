    Question: I''ve followed all the recommendations through this book and performance
    through my ClusterXL firewall cluster is still unacceptable! I''m suspecting something
    is wrong with my ClusterXL setup, or perhaps how the cluster is interacting with
    the surrounding network components. Is there any way to exonerate or incriminate
    ClusterXL itself as the source of the problem?


    Answer: Sure! During a maintenance window, gracefully power off the standby member
    of the cluster. Doing so creates a “cluster of one” and relieves the surviving
    firewall of a significant amount of performance-saving duties such as synchronization.
    If performance improves substantially during this period, it strongly indicates
    that some element of your ClusterXL setup is to blame, or how the cluster members
    are attached to your network and simultaneously interacting with it could be the
    culprit. If performance is still unacceptable, some element of your firewall’s
    configuration other than ClusterXL or a problem in the surrounding network is
    causing the performance issue. If you''ve gone through all the recommendations
    in this entire book, the performance problem is much more likely to be somewhere
    in the surrounding network rather than the firewall cluster itself.'
