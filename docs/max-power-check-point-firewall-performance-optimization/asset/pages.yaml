    # Threat Prevention Policy Rule Optimization


    The optimization procedure for the Threat Prevention policy (which specifies Anti-Virus,
    Anti-Bot, Threat Emulation, & Threat Extraction operations regardless of gateway
    version) is very similar to APCL/URLF policy optimization covered in Chapter 5.
    For R80.10+ firewalls being managed by an R80.10+ SMS, IPS is also controlled
    directly from the same Threat Prevention policy as all the other Threat Prevention
    blades, and provide many useful avenues for IPS optimization. If your firewall
    is still running version R77.30 or earlier, your ability to improve IPS performance
    by limiting its enforcement to only certain traffic will be severely restricted.


    R80.10+ firewalls are allowed to have more than one Threat policy layer active
    at the same time. If this is the case, all separate Threat Prevention policy layers
    are evaluated simultaneously, the first rule matching the traffic is selected
    in each layer, and then the most restrictive action based on the match(es) are
    performed. To clear, the order of most restrictive action to least restrictive
    is: Prevent, Ask, Detect, and finally Inactive. Only one rule (the first one found)
    from each individual Threat Prevention policy layer can be matched.


