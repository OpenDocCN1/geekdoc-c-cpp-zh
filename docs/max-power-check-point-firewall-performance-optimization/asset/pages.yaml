  md: '# Multi-Queue & SMT/Hyperthreading: Key Points


    +   - It is not quite a “no brainer” to always enable SMT/Hyperthreading; doing
    so indiscriminately can actually hurt firewall performance and increase complexity.


    +   - Multi-Queue allows more than one SND/IRQ core to process SoftIRQ interrupts
    for an interface and is particularly useful for 10Gbps+ interfaces.


    +   - When enabled, Hyperthreading leverages the SMT function of Intel processor
    architectures to double the total number of cores available.


    +   - Traditional firewall processing performance is not enhanced by enabling
    SMT/Hyperthreading.


    +   - So-called “next-generation firewall” features that are heavily dependent
    on Medium Path processing benefit the most from Hyperthreading.


    +   - Numerous memory and hardware requirements must be met for the firewall to
    be eligible to use SMT/Hyperthreading.


    +   - R77.30 firewalls that process large amounts of IPSec VPN traffic and plan
    to enable SMT/Hyperthreading should be upgraded to R80.10+.'
