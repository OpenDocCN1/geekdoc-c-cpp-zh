  md: '# CHAPTER 2

    LAYERS 1&2 PERFORMANCE

    OPTIMIZATION


    There is a construct in computer programming called the ''infinite loop'' which
    enables a computer to do what no other physical machine can do - to operate in
    perpetuity without tiring. In the same way it doesn''t know exhaustion, it doesn''t
    know when it''s wrong and it can keep doing the wrong thing over and over without
    tiring.


    - John Maeda


    # Background


    In this chapter we will examine elements associated with the physical (OSI Layer
    1) and Data Link (OSI Layer 2) parts of your network (including the firewall).
    But wait a minute you say, isn''t this book supposed to be about firewall performance
    optimization? Well of it is, but if the underlying physical network is losing
    or mangling frames the performance of the firewall will most certainly suffer.
    You may be 100% positive that your network is running cleanly. But is it really?
    Perhaps you inherited the firewall and associated networks from a former employee
    that is long gone. Perhaps another team of employees manages the network themselves,
    and you''re only allowed to touch the firewall. Perhaps major changes have been
    made to the network architecture and no'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'one has checked up on how the various components of your network are performing
    since the change.


    We will perform as much discovery from the firewall and testing workstation as
    possible, but depending on the complexity of your network you will almost certainly
    need command-line access to the manageable switches and routers in your network
    to ensure they are running cleanly. Or alternatively, if another person or team
    manages your network infrastructure, you may need them to run the listed commands
    for you and provide the output.


    # Discovery


    Log in to your firewall in expert mode.


