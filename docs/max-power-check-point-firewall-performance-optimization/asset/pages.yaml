    If there is itself hard limit set on your firewall object (let’s suppose it is
    the

    SecurePlatform/IPSO default of 25,000), you can check if the firewall has run
    up against

    t limit by executing the command fw tab -t connections -s on the firewall. If

    the value for PEAK is 25,000, at some point since being booted the firewall ran
    out of

    space in the state table to track new connections. In that case, any new connections

    ted in excess of 25,000 were dropped regardless of what rule the security policy

    matched, since there was no way for the firewall to keep track of the connection.
    This

    situation will result in dismal firewall performance when it occurs, as some connections

    will succeed (when there are a few connection table slots free) and some connections

    fail (when the limit is reached). If using Gaia always make sure this is set to


    “Automatically”! For more information about the other options on this screen consult:

    sk39555: Capacity Optimization and Connections Table.


    Question: My connection table has a very large number of connections it is tracking,

    far beyond what it is and impacting firewall performance. How can I see

    what source IP addresses are consuming the connection table slots?


    Answer: Run this command on the firewall:


    ```

    fw tab -u -t connections |awk ''{ print $2 }|sort -n |uniq -c|sort -nr|head -10

    This hand command will provide an output something like this:

    ```


    ```

    12322 0a1e0b53

    212 0a1e0b50

    ```


    The first number in the output will be the number of connection table slots consumed,

    and the second value will be the source IP address of the offender in hexadecimal.
    The'
