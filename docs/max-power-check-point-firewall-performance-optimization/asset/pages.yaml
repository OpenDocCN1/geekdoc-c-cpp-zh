  md: 'Policies: R77.30 vs. R80+ Management 111


    Due to their heavy impact on how traffic can be (or not be) potentially accelerated
    by SecureXL, optimization of Threat Prevention policies is covered in Chapter
    9. Threat Prevention consists of the IPS, Anti-Bot, Anti-Virus, Threat Emulation
    and Threat Extraction features.


    Optimization of HTTPS Inspection and its policy is covered in Chapter 10.


    # Policies: R77.30 vs. R80+ Management


