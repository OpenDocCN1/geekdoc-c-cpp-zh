  md: '# 290 SecureXL Throughput Acceleration


    not completely handled by the Acceleration Layer, but not take the complete Firewall
    Path either; however Medium Path processing does take place on a Firewall Worker
    core. The features that do not prevent traffic from the Accelerated Path and pull
    it into the Medium Path (PXL) are: IPS, Application Control/URL Filtering and
    the various Threat Prevention blades. Note that any traffic subject to the HTTPS
    Inspection feature will always be handled in the Firewall Path (F2F); we will
    cover HTTPS Inspection tuning in Chapter 10.


    On almost all hardware, SecureXL is implemented as a highly optimized kernel driver
    executing on all SND/IRQ cores. However on 21000 series appliances equipped with
    an optional Security Acceleration Module [SAM] card, traffic processed in the
    SecureXL Accelerated Path is completely handled in the dedicated SAM hardware,
    without ever touching the main processor cores (or the system bus) at all. For
    example, if traffic eligible for SecureXL arrives on one NIC port of the 21000
    SAM card and needs to be sent out another NIC port on the 21000 SAM card, the
    embedded hardware in the SAM card performs all the necessary inspection and forwards
    it out the destination NIC port, without ever tapping any CPU or system bus resources
    at all. Near-speed, highly predictable latencies can be achieved in this scenario,
    but only if SecureXL is enabled and tuned properly. If utilizing a SAM card, the
    following SKs are required for proper optimization:


    +   - sk107157: ATRG: Security Acceleration Module (SAM) card

    - sk93036: Known Limitations of Security Acceleration Module (SAM) on 21000 Appliance

    - sk94484: Accelerating traffic with the Security Acceleration Module (SAM) while
    also using non-accelerated blades.'
