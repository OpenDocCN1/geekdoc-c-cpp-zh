  md: '# CoreXL Tuning: Key Points


    +   * CoreXL and SecureXL should both be enabled for maximum firewall performance.

    * The number of Firewall Worker cores you choose to allocate is one of the most
    important firewall tuning decisions you will make.

    * An interface RX-DRP rate of <0.1% (not necessarily zero) should be targeted
    for all firewall interfaces.

    * Network interface ring buffer size should only be increased in very specific
    cases to avoid BufferBloat.

    * Allocating core functions in pairs (adjacent cores) helps maximize CPU fast
    caching.

    * On R80.10+ gateway, by default firewall processes may only execute on cores
    assigned as Firewall Worker cores; processes may not execute on the cores assigned
    to SND/IRQ functions, which significantly increases SND/IRQ CPU fast cache utilization
    and overall firewall performance.

    * Default core allocations will almost always need to be changed in the real world
    on larger firewalls, especially if numerous 10Gbps+ interfaces are present.

    * The Dynamic Dispatcher and Priority Queuing features are enabled by default
    starting in R80.10, and should both be enabled on an R77.30 firewall assuming
    the latest GA HFA has been installed.

    * The RX-DRP counter can be incremented due to a misconfigured surrounding network,
    typically involving improper reception of 802.1q VLAN-tagged traffic or unknown
    Layer 3 protocols.'
