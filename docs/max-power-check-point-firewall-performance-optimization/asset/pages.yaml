  md: '# APCL/URLF Policy Layer Tips 145


    Your compliance officer has noted that by default when they visit a new, extremely
    obscure URL that no one in your company would ever visit, sometimes the site will
    come up the very first time they try it, even though it should be blocked. However
    if the page is refreshed after a few seconds it is then properly blocked, and
    remains blocked for everyone. Your compliance officer has indicated this is unacceptable
    and wants to ensure URL filtering is always enforced absolutely the first time,
    even if it causes additional browsing latency. How can you ensure this?


    Due to the inherent nature of cloud-based lookups for URL categorization, there
    would normally be a delay when a user tries to visit a website whose categorization
    result is not already contained within the firewall’s cache. However by default
    the “Website Categorization Mode” is set to “Background – Requests are allowed
    until categorization is complete”. This allows the user to always bring up a not-yet-categorized
    site quickly, without delay, even if it shouldn’t have been allowed in the first
    place. Once the website categorization result has been received from the Check
    Point ThreatCloud, if the website is not allowed it will immediately start blocked,
    and all users (including the original requester) will no longer be able to access
    it. But it came up very first time, and the initial user could still see it (at
    least briefly).


    This is one case where I feel security needs to trump performance, and all organizations
    should set “Website Categorization Mode” to “Hold-Requests are blocked until categorization
    is complete”. Users will see a short delay when first attempting to connect to
    a non-cached site; but as long as your firewall is properly configured with good,
    quickly responding DNS servers and fast Internet connectivity, the delay is usually
    less than 1 second. Once the site is categorized and populated in the firewall’s
    cache, there will be no further user delays accessing the site.'
