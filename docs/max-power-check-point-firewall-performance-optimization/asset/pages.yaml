    # Gaia OS Monitoring with cpview


    An incredible wealth of monitoring information concerning the firewall’s Gaia
    OS available through the cpview tool. Even more exciting is that the great statistics
    available from cpview can not only be examined in real-time, but past statistics
    are available as well. By default Check Point firewall stores 30 days of historical
    statistics accessible through cpview; a daemon process called historyd makes this
    happen. The historical mode of cpview can be accessed by passing the -t option;
    once active you can “step forward” or “step back” in increments of 60 seconds
    on almost all available screens in cpview is absolutely invaluable for performing
    a post-mortem performance issues, or intermittent issues after they have occurred.
    This historical mode of cpview is explored thoroughly in Chapter 14.


    For now we will concern ourselves with using cpview in real-time to monitor the
    health and utilization of the Gaia operating system; let’s jump right in with
    some screenshots showing what are probably four most useful Gaia-related screens.
    These are presented with no commentary and should be pretty self-explanatory.'
