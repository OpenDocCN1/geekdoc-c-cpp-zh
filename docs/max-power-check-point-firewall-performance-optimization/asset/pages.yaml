  md: '# Multi-Queue & SMT/Hyperthreading


    untagged traffic, another interface trunking 500 VLANs via 802.1q, both look exactly
    the same from an interface buffering perspective: one queue. Multi-Queue allows
    more than one queue per physical interface for up to 5 separate physical interfaces
    at once; bonded/aggregate interfaces are supported as well.


    When Multi-Queue is enabled for an interface, by default multiple SND/IRQ cores
    may now process packets from that interface instead of just one. This is accomplished
    by creating parallel queues for the same interface; the number of queues created
    is equal to the total number of SND/IRQ cores allocated (subject to some limits
    discussed below). So if you have a 16-core system with a 4/2 split, enabling Multi-Queue
    on an interface creates 4 parallel queues for that single interface, one per SND/IRQ
    core. As traffic arrives on the Multi-Queue-enabled interface, a hashing algorithm
    runs in the NIC driver to decide which of the 4 available queues should receive
    the packet for processing. It is always desirable to “stick” packets associated
    with a certain connection (or network stream) to the same queue every time. Failure
    to do so could result in out-of-order delivery of packets, which is an unmitigated
    disaster for a performance perspective when TCP is involved.


    The hashing algorithm that “sticks” a single connection’s packets to the same
    queue every time imposes some slight additional overhead on the SND/IRQ cores.
    In most cases this is more made than up for relieving the single-processing bottleneck
    on a very busy 10Gbps interface. However if all the SND/IRQ cores are already
    overloaded, enabling Multi-Queue (with its additional hashing mechanism overhead)
    can actually make overall firewall performance worse.


    By default enabling Multi-Queue will create as many parallel queues for an interface
    as there are SND/IRQ cores. However if the interface in question is using the
    Intel igb driver (typically associated with older Intel 1Gbps NICs), there is
    a maximum limit of 4'
