  md: '# The “top” & “free” Gaia/Linux Commands 85


    the security inspection functions on the firewall. Firewall Path and Medium Path
    processing typically shows up as CPU usage in sy space; Accelerated Path and SoftIRQ
    processing typically shows up as CPU usage in si space (the various paths are
    covered in Chapter 9). Unlike processes running in process space, visibility into
    what service or function is consuming CPU in system space is limited. However
    some insight can be gained by running cpview and selecting CPU...Top Connections
    to see the top individual connections by CPU consumption. This usage data can
    be summarized for all Firewall Worker cores or even viewed for individual cores
    if needed.


    # Top Output: “wa” – Waiting for I/O Operation


    This value should be between 0 and 5% at most. This field specifies the amount
    of time a CPU is blocked (unable to do anything else) while waiting for an I/O
    operation of some kind to complete. The most common culprit is waiting for the
    hard drive of the firewall to respond to a request. This may occur a fair amount
    right after the firewall is booted up, as the needed executable code is paged
    from the hard disk and cached in RAM. This number will also spike for a few moments
    during a policy load which is completely normal. However this activity should
    eventually die down to practically zero on a properly configured firewall. If
    more than 5% of CPU is consistently being wasted in a waiting state, your firewall
    almost certainly does not have enough RAM or is experiencing problems with some
    kind of hardware peripheral.


