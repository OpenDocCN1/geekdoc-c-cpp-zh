  md: '# SecureXL Throughput Acceleration


    +   6. The Firewall Worker/INSPECT driver performs any final processing required
    and releases the packet to the Acceleration Layer associated with the egress interface.


    +   7. The SecureXL Acceleration Layer associated with the egress interface makes
    a note of where the packet was routed for egress, and simply forwards the packet
    to the egress network interface for transmission.


    The second packet of the TCP three-way handshake (SYN-ACK) arrives at the firewall.
    The following occurs:


    +   1. The SYN-ACK packet is received by the Acceleration Layer on an SND/IRQ
    core. It notes that the initial TCP SYN associated with this packet was seen earlier.
    if the connection is eligible for acceleration, after minimal security processing
    the packet is sent directly to the Acceleration Layer associated with the proper
    egress interface, this skipping the Firewall Worker/INSPECT driver and Gaia IP
    routing completely.


    +   2. The Acceleration Layer on the SND/IRQ core associated with the egress interface
    performs any final inspection operations and sends the packet to the egress interface
    for transmission.


    All subsequent packets of this accelerated TCP connection will be handled solely
    by the Acceleration Layer and will not traverse the inbound Firewall Worker/INSPECT
    layer, the Gaia IP driver, or the outbound Firewall Worker/INSPECT layer. The
    optimized inspection operations required for this connection are performed exclusively
    by the Acceleration Layer (which runs on a SND/IRQ core in the kernel), thus saving
    valuable CPU processing time on the Firewall cores. This is the essence of SecureXL
    Throughput Acceleration, and is quite desirable.


    One important note: ICMP traffic (as ping) and traffic to or from the firewall
    itself is never accelerated by SecureXL! To test for the presence of Throughput
    Acceleration you must use a stateful protocol such as TCP and the traffic must
    transit the'
