    Figure 2-4: netstat -ni Command Example


    Notice the three fields RX-ERR, RX-DRP, and RX-OVR listed for each interface.
    I affectionately refer to these three counters as the “Dark Triad of lousy network'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'performance”. If any of these counters are nonzero the Linux OS is not cleanly
    delivering packets to Check Point’s firewall code for processing. These counters
    are not part of Check Point’s software but are embedded in the Red Hot Linux OS
    upon which Gaia is based. “Dark Triad” is an academic term I appropriated from
    the Psychology field that describes conniving and psychopathic behavior. I associate
    the three RX counters with these traits:


    +   - RX-OVR – (Overrun) Narcissism, Pride, & Egotism: I can handle my monstrous
    network load at full line speed, oh wait no I can’t arghhhhh drop drop drop

    - RX-ERR – (Error) Psychopathy: I’m a corrupt frame tainting all of network society

    - RX-DRP – (Drop) Machiavellianism and overwhelming self-interest, no morality:
    I don’t care if your stupid frames dropped or not, I have more important things
    to do – Covered in Chapter 7


    We must ensure clean delivery of packets to Check Point’s firewall code prior
    to attempting any tuning of Check Point software elements such as CoreXL and SecureXL.


    # Network Interface Stability and Error Counters


