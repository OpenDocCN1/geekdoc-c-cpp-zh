  md: '# SecureXL Session Rate Acceleration: Key Points


    +   - SecureXL Session Rate Acceleration is a completely separate function from
    Throughput Acceleration via the three kernel paths.


    +   - Session Rate Acceleration uses Accept Templates to accelerate the start
    of a new connection and avoid computationally expensive security policy rule base
    lookup in the Network policy layer.


    +   - Traffic subject to inspection by the Anti-Bot blade cannot be Session Rate
    Accelerated (templated) at all.


    +   - The R80.10+ firewall code includes numerous Session Rate Acceleration improvements
    that make all rules in a Network policy layer far more likely to be completely
    eligible for templating.


    +   - Security policy rule base optimization in the Network Access policy layer
    may be required to get the most out of Session Rate Acceleration.


    +   - NAT Templates can be enabled to permit SecureXL templating of NATed connections;
    however the performance gains will be minimal if most packets are processed in
    the Medium and/or Firewall Paths on the firewall.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# CHAPTER 12

    MULTI-QUEUE & SMT/HYPERTHREADING


    > The more real people I get to know, the more I am convinced the simpler solution,
    the better the solution.


    - William J. Bernstein


    # Introduction: Multi-Queue


    In Chapter 7, there was an extended discussion about the most insidious member
    of the so called RX “Dark Triad”: the RX-DRP counter. All too frequently, an unacceptable
    large number of incoming packets would be dropped by the firewall. Not because
    they violated a security policy, but because there was an insufficient amount
    of CPU resources allocated for timely servicing of network interface ring buffers.
    After thoroughly dissect the network buffering mechanism and how the RX-DRP counter
    indicated a problem was occurring, we saw that it was a “no-brainer” to reallocate
    more CPU cores for SND/IRQ processing to ensure timely servicing of network buffers,
    with an RX-DRP rate of less than 0.1% as our goal.


    Enabling Multi-Queue and/or SMT/Hyperthreading is NOT a no-brainer!'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# 390 Multi-Queue & SMT/Hyperthreading


    Neither of these features is enabled by default, and for good reason. If these
    features are enabled indiscriminately, the complexity of the firewall configuration
    can be increased for no tangible benefit. Inevitably this complexity will come
    back to bite you at the most inconvenient (and potentially career-limiting) moment
    possible. Complexity is the enemy of security, and networks in general. Few things
    make my blood boil more as a consultant seeing unnecessary complexity introduced
    into a design that provides no measurable, tangible benefit. Just because you
    *can* do something and it “sounds cool” doesn’t mean you *should.*.


    Enabling these features inappropriately can do much more than just increase complexity;
    *they can actually degrade firewall performance.*


    With all that said, Multi-Queue and SMT/Hyperthreading are great features that
    can significantly boost firewall performance, under the right set of circumstances.
    In this chapter we will explore which set of circumstances lend themselves to
    activating these features, and how best to do so in your network. If one or both
    of these features are enabled but no tangible gains are achieved, my overwhelming
    recommendation is to turn them off!


    Note: The procedure described in sk63128: How to assign RX and TX of 10 Gb interface,
    which uses IXGBE driver, to different CPU cores was a primitive way to spread
    interface buffer processing overhead across more than one core, and a precursor
    to the introduction of the Multi-Queue feature. Don’t use this primitive workaround,
    use Multi-Queue instead.'
  merge: -1
  pgno: 418
- img_proc: true
  md: "# Discovery: Multi-Queue\n\nRecall a key component of our stated goal for performance\
    \ optimization stipulating a network interface RX-DRP rate of less than 0.1%,\
    \ and that all cores are at least 50% idle during the firewall's busiest period.\
    \ If your firewall has already reached that goal, there will probably be no tangible\
    \ benefit to enabling Multi-Queue other than possibly increasing the processing\
    \ “headroom” available to the firewall for weathering a Denial of Service attack.\
    \ Proceed if you wish, but please heed the earlier warnings about increasing the\
    \ complexity of the firewall unnecessarily.\n\n+   * Question: Is Multi-Queue\
    \ already enabled on any interfaces of my firewall?\n  Run cpmq get\n* Question:\
    \ Is SecureXL enabled?\n  Run fwaccel stat\n* Question: Do I have any interfaces\
    \ using the igb/ixgbe/mlx5_core drivers that are eligible for Multi-Queue?\n \
    \ (Note: The option after the ls command is a numeric 1)\n  ls -1 /sys/class/net\
    \ | grep -v ^lo | xargs -i ettool {}\n* Question: Do all my interfaces have an\
    \ RX-DRP rate less than 0.1%?\n  Run netstat -ni. Divide RX-DRP by RX-OK and multiply\
    \ by 100 to obtain the RX-DRP percentage.\n* Question: How many cores does the\
    \ firewall have?\n  cpstat -f cp os | grep -i CPUs"
  merge: -1
  pgno: 419
- img_proc: true
  md: '# 392 Multi-Queue & SMT/Hyperthreading


    Your firewall must have at least 2 cores to use Multi-Queue, and the underlying
    hardware must support IRQ Swizzling; however enabling Multi-Queue on a 2-core
    firewall is virtually unheard of, and on a 4-core firewall it will probably provide
    minimal performance benefits. Multi-Queue is primarily employed on firewalls with
    6 or more cores.


    # Analysis: Multi-Queue


    If you have skipped to this chapter to enable Multi-Queue without performing the
    steps laid out in all the earlier chapters, it is very important to tune the firewall
    as described in all prior chapters before evaluating the need for Multi-Queue.
    After performing those optimizations you realize you don''t need Multi-Queue at
    all! Keep the firewall configuration as simple as possible!


    If you have reached this point, the firewall has probably been tuned to the best
    of your abilities, however you are still suffering an RX-DRP rate of >0.1% on
    one or more of your interfaces, or you were not able to obtain our stated goal
    of 50% idle on all cores during the firewall’s busiest period. This is generally
    indicative of three situations:


    +   1. There are plenty of cores allocated to the SND/IRQ function, the interface
    in question may even been allocated its own dedicated core for SoftIRQ processing
    (sim affinity -1), and that core’s job is to do nothing but that single interface’s
    RX ring buffer. However the single dedicated core either has substantially less
    than 50% idle time available during the firewall’s busiest period, and/or the
    RX-DRP rate is still >0.1%. This situation is not too common with 1Gbps interfaces
    (if it is, there is probably else wrong such as the firewall being severely overloaded),
    but this situation can easily occur'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# Analysis: Multi-Queue 393


    on a busy 10Gbps+ interface. Multi-Queue will definitely help in this scenario,
    and the performance gains can be impressive.


    +   You’ve gone through all the tuning procedures in the earlier chapters, but
    you just don’t seem to have enough cores available to allocate for SND/IRQ processing.
    Ideally each of the 10Gbps+ interfaces has its own dedicated core for SoftIRQ
    processing, but trying to allocate enough SND/IRQ cores to accomplish this subsequently
    overloads the remaining number of Firewall Worker cores. There may even be 1Gbps
    interfaces ranking up to many RX-DRP errors in this case. Examine the processor
    utilization of the SND/IRQ cores (sim affinity -1 followed by “top...1!”). If
    the firewall’s busiest period the SND/IRQ cores are averaging 25-50% idle (or
    you see large disparities in idle percentage amongst the SND/IRQ cores), Multi-Queue
    can definitely provide some tangible gains in this scenario, but keep in mind
    that the firewall is moderately overloaded, so be sure to temper your expectations.


    +   If all the SND/IRQ cores have less than 25% idle time available during the
    firewall’s busiest period and you can’t re cores to SND/IRQ due to high Firewall
    Worker core utilization, the firewall is severely overloaded and Multi-Queue is
    not likely to make much of a difference; overall performance will probably get
    worse if you turn it on. Proceed in this case of your risk.


    When Multi-Queue is disabled (which is the default), there is only one queue and
    associated ring buffer for each active network interface, and only one SND/IRQ
    core is allowed to process that particular ring buffer. Note that there is only
    one queue per physical interface. An interface with only one IP address assigned
