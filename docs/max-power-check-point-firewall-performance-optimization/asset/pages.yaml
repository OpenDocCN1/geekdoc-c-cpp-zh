    # Methodology


    We will employ a bottom-up approach and ensure the lower OSI layers of the firewall
    are delivering packets cleanly and efficiently before attempting any tuning operations
    on higher layers.


    # Latency vs. Loss


    During the tuning process there is one key element that must always be determined:
    is the unacceptable performance caused by excessive (or highly variable) latency
    of packet delivery, or is it flat-out packet loss? Packet loss tends to be the
    most destructive from a performance perspective but do not underestimate the impact
    of inconsistent delivery latency (called jitter) on network performance. Traditionally
    jitter impacts real-time streaming applications such as voice and video, but excessive
    jitter can confuse TCP''s congestion control mechanism and degrade network performance
    for non-streaming protocols such as HTTP and FTP as well. As an example, the Common
    Internet File System (CIFS) protocol used in Microsoft Windows environments is
    particularly vulnerable to dismal performance caused by high latency; more on
    this effect in Chapter 8.


    A great trick to help you determine whether a particular network path is experiencing
    latency or loss is to send extra-large test packets with the ping command, which
    have a'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# 6 Introduction & Concepts


    knack for irritating any underlying network problems thus making them more pronounced
    and easier to identify:


    ```

    Gaia/Linux: **ping -s 1400 129.82.102.32**

    Windows: **ping -l 1400 129.82.102.32**

    ```


