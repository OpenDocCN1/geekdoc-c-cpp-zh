  md: '# 446 Appendix A – Manual Affinity


    Manual Affinities allow you to take very granular control of how cores are assigned
    to three basic Check Point firewall functions:


    +   1. Interface Affinity – What SND/IRQ cores are assigned to process SoftIRQs
    and the Accelerated Path for an interface’s inbound frames as described earlier
    in “A Millisecond in the Life of a Frame”.

    2. Process Affinity – What cores are assigned to run various daemon processes
    on the firewall? Examples include the Check Point fwd, vpnd, rad, and cpd daemons.
    This also includes various Gaia/Linux processes.

    3. Kernel Affinity – Which specific cores will be designated as SND/IRQ cores
    and which specific cores will be designated as Firewall Worker cores?


    Both interface affinity and kernel affinity have been discussed previously in
    this book, while process affinity has not (other than the “R80.10 Taskset Process
    Affinities”) section in Chapter 7). Manual process affinity is generally the least
    important affinity from a performance perspective in most. In some cases it may
    be necessary to assign manual process affinities to the daemon processes associated
    with various firewall features in order to ensure adequate performance.


    # Discovery


    Question: Is SecureXL enabled?


    Answer: Run command: fwaccel stat


    Question: What are my current interface, process, and kernel affinities right
    now?


    Answer: fw ctl affinity -l -a -v and sim affinity -l'
  merge: -1
  pgno: 474
- img_proc: true
  md: 'The kernel and interface affinities listed should not be a surprise if you''ve
    gone through this entire book; but what about the process affinities? You probably
    see a long list of firewall processes with any after them on R77.30. “Any” means
    that if process wakes up and needs to use a CPU, a core that is not currently
    busy will be assigned to handle the process. It could be a SND/IRQ core or it
    could be a Firewall Worker core; however on R80.10+ firewalls a process can only
    utilize cores allocated for Firewall functions. But doesn’t violate one of our
    key principles about trying to prevent CPU fast cache thrashing?


    Technically yes does it, however one you may have noticed when running top on
    your firewall is that the vast majority of traffic processing via the Accelerated,
    Medium and Firewall Paths occurs in the kernel of the Firewall. On the third line
    of the top output, kernel processing includes the sy, wa, hi, si, and st percentage
    variables. The us and ni variables represent process daemon processing, while
    id is of course the CPU idle time left over.


    On a typical firewall, most processing occurs in the kernel, with very little
    going on process space other than the fwd daemon receiving logs from the kernel
    and forwarding them to the Security Management Server over the network. Exceptions
    to this were explored in Chapter 10. Certain features such as DLP, Anti-Virus,
    Threat Emulation, Identity Awareness, and Anti-spam/Email are partially or fully
    handled by processes (in lieu of the kernel) to maintain the stability of the
    firewall. If these features are active, process daemon processing may be more
    prevalent than stated. One common optimization made with manual affinities in
    the path on R77.30 is to put all busy daemon processes on their own dedicated
    single core (or 2 cores), so that they won’t occasionally step in on the SND/IRQ
    and/or Firewall Worker cores, avoiding CPU fast cache misses.'
  merge: -1
  pgno: 475
