- img_proc: true
  md: '# Manual Daemon Process & Kernel Affinity 455


    **Method 1:** Add following lines to $FWDIR/conf/fwaffinity.conf then run

    $FWDIR/scripts/fwaffinity_apply:


    ```

    i eth0 0

    i eth1 0

    i eth2 1

    i eth3 1

    n in.geod 2 3

    n cpca 2 3

    n status_proxy 2 3

    n in.asessedion 2 3

    n fwd 2 3

    n mpdadaemon 2 3

    n vpnd 2 3

    n rtmd 2 3

    n cpd 2 3

    ```


    Notice how we specified more than one core (2 and 3) for the process affinities;
    either core is eligible to process activity from the named daemon in that case.
    Generally you should not specify more 1 core with manual interface affinities,
    as it will not balance SoftIRQ processing between the two nominated cores as you
    would expect; one core will be chosen and it will process 100% of the SoftIRQ
    load. Use Multi-Queue instead (covered in Chapter 12), if you wish to balance
    SoftIRQ processing between 2 or more SND/IRQ cores for a single interface. Notice
    we did not specify any kernel instances with a k operand; specifying the number
    of Firewall Worker instances with cpconfig and letting them occupy the highest-numbered
    cores while divvying up the lowest-numbered cores without overlap or fwaffinity.conf
    or fw ctrl affinity'
  merge: -1
  pgno: 483
- img_proc: true
  md: '# 456 Appendix A – Manual Affinity


    should be sufficient for almost all environments. I have never had a need to assign
    a

    kernel instance to a very specific core; simply adjust the total number using
    the

    cpconfig command.


    **Method 2**: Run the following commands. They will take effect immediately, but
    not

    survive a reboot (ideal for lab experimentation!):


    ```

    fw ctl affinity -s -i eth0 0

    fw ctl affinity -s -f -i eth1 0

    fw ctl affinity -s -f -i eth2 1

    fw ctl affinity -s -f -n in.geod 2 3

    fw ctl affinity -s -f -n cpca 2 3

    fw ctl affinity -s -f -n status_proxy 2 3

    fw ctl affinity -s -f -n in.asession 2 3

    fw ctl affinity -s -f -n fwd 2 3

    fw ctl affinity -s -f -n mpdaemon 2 3

    fw ctl affinity -s -f -n vpnd 2 3

    fw ctl affinity -s -f -n rmtd 2 3

    fw ctl affinity -s -f -n cpd 2 3

    ```


    Run fw ctl affinity -a -v and we see the following:


    ```

    Interface eth0 (irq 75): CPU 0

    Interface eth1 (irq 83): CPU 0

    Interface eth2 (irq 88): CPU 1

    Interface eth3 (irq 97): CPU 1

    Kernel fw_0: CPU 4

    Kernel fw_1: CPU 5

    Kernel fw_2: CPU 6

    ```'
  merge: -1
  pgno: 484
- img_proc: true
  md: '# Atrocious Affinity Archetype 457


    ```

    Kernel fw_3: CPU 7

    Daemon in.geod: CPU 2 3

    Daemon cpca: CPU 2 3

    Daemon status_proxy: CPU 2 3

    Daemon in.asessiond: CPU 2 3

    Daemon fwd: CPU 2 3

    Daemon mpdaemon: CPU 2 3

    Daemon vpnd: CPU 2 3

    Daemon rtmd: CPU 2 3

    Daemon cpd: CPU 2 3

    ```


    # Atrocious Affinity Archetype


    A great way to understand something like manual affinity is to look at an absolutely
    atrocious example of how it can be abused. A customer complained of terrible firewall
    performance. They had SecureXL turned off for legitimate application compatibility
    concerns, so they configured manual interface affinities. The firewall had 1Gbps
    network interfaces in use and eight physical cores. CoreXL was configured with
    8 Firewall Worker cores (alarm bells should be ringing in your head if you''ve
    read this whole book). I had to choose my words carefully to keep the engagement
    professional when I saw their fwaffinity.conf file:


    ```

    i eth0 0

    i eth1 1

    i eth2 2

    i eth3 3

    ni eth4 4

    ```'
  merge: -1
  pgno: 485
- img_proc: true
  md: '# Appendix A – Manual Affinity


    +   - eth5 5

    - eth6 6

    - eth7 7


    Needless to say they were having a few performance problems due to CPU cache thrashing
    and non-specialization amongst the cores (as every single one of them was handling
    both SND/IRQ tasks and Firewall Worker tasks). To add insult to injury, RX-DRP
    was well above 0.1% on their busiest network interfaces. After running `netstat
    -ni` command, we determined that the busiest interfaces descending order were:
    `eth7`, `eth6`, `eth0`, `eth1`, `eth2`, `eth4`, `eth3`, `eth5`. We reduced the
    number of Firewall Worker cores from 8 to 4 with `cpconfig` (thus allocating 4
    dedicated SND/IRQ cores on cores 0-3, and 4 Firewall Workers on cores 4-7) and
    modified `fwaffinity.conf` as follows:


    +   - eth7 0

    - eth6 1

    - eth0 2

    - eth1 3

    - eth2 3

    - eth4 2

    - eth3 1

    - eth5 0


    (Note: Interfaces were listed in `fwaffinity.conf` file in decreasing order of
    utilization for illustration purposes, but the actual order of entries in the
    file itself does not influence the final applied configuration)'
  merge: -1
  pgno: 486
- img_proc: true
  md: 'The four busiest interfaces were assigned first to Cores #0 -3 in order by
    utilization.

    Next the least busy interface (eth5) was paired with the busiest interface (eth7)
    on Core #0, the second busiest interface (eth6) was paired with the second least-busy
    interface (eth3) and so on. After booting the firewall to make the new number
    of Firewall worker cores take effect and having the new configuration in the **fwaffinity.conf**
    file get applied, overall firewall performance was greatly improved with RX-DRP
    well below 0.1% on all interfaces.'
  merge: -1
  pgno: 487
