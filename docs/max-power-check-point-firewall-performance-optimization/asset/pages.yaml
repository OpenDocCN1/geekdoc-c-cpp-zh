    # Layers 1&2 Performance Optimization: Key Points


    +   - Using firewall NICs manufactured by Intel or Mellanox only is strongly recommended.


    +   - RX-ERR and RX-OVR counters should be zero on all firewall interfaces.


    +   - Check that the firewall''s network interfaces (and those on surrounding
    network devices such as switches) are stable by ensuring the “carrier” counter
    is zero.


    +   - NIC interfaces are being overrun (nonzero RX-OVR counter) consider interface
    bonding.


    +   - Implementing Ethernet flow control is generally not recommended but may
    be helpful in some scenarios where protocols lacking their own congestion control
    mechanisms comprise the majority of network traffic.


    +   - Ensure that all firewall interfaces are running at their maximum supported
    line speed (ideally 1Gbps or higher).


    +   - Check the hardware sensor reports for your firewall to determine if cooling
    fans have failed or voltages are out of spec; on open hardware ensure the BIOS
    settings are tuned appropriately.


    +   - Spanning Tree Protocol issues on network switches can kill network performance,
    but the firewall will almost certainly be blamed for.


    +   - The most common STP issues are: turning off the algorithm completely, a
    constantly shifting root bridge, or a flapping link somewhere in the network.


    +   - Portfast mode should be enabled on all switch ports attached to the firewall,
    especially if it is part of a firewall cluster.


    +   - Watch out for duplex mismatches at Fast Ethernet (100Mbps) speeds.'
