- img_proc: true
  md: '# Default Core Allocations & CPU Fast Caching 219


    speed has advanced much faster than RAM access speeds; a core may end up spending
    a great deal of its time in a blocked state waiting for access to the much slower
    RAM. The answer to this blocking problem is the use of fast memory caches located
    very close to the core itself. To take maximum advantage of the fast memory caches,
    we can have an even number of adjacent cores performing the same function, if
    at all possible.


    In some Intel architectures adjacent cores (i.e. Cores 0&1, Cores 2&3, etc) share
    Level 2 fast cache with each other, and sizable performance gains can be realized
    if the adjacent cores are serving the same function. The adjacent cores can more
    frequently pull their needed data from speedy Layer 2 cache, instead of waiting
    longer for them to be retrieved from RAM or Level 3 cache (if present). Following
    this “adjacent cores” recommendation also maximizes the gains provided by a function
    called “prefetching” which is inherent in all modern processor architectures,
    which helps ensure that cores spend as little time as possible in a blocked state
    waiting for access to memory.


    To underscore the gains that can be achieved with this adjacent cores technique
    and also trying to keep the core fast caches “hot” (i.e. continuously populated
    with the code and the data needs to perform its useful work without waiting) as
    much as possible, consider the following: The CPU must retrieve executable code
    and the associated dataset into its Layer 1 (L1) cache for execution before it
    can begin processing. The following approximations showing the difference between
    various access times for the different levels of memory storage on a system. Just
    for reference, a 2GHz processor has 2 billion (2,000,000,000) clock cycles per
    second:


    +   - If data is in the L1 cache, the CPU can access it in about 1-2 clock cycles

    - If data is in the L2 cache, the CPU can access it in about 10 clock cycles

    - If data is in the L3 cache, the CPU can access it in about 50 clock cycles

    - If data is in RAM, the CPU can get to it in about 100 clock cycles


    ![](img/f71ded7ff9665818f413a53bb0d5a4bb_247_0.png)'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# CoreXL Tuning


    +   - If the data must be retrieved from fixed disk storage, it will take between
    100,000 and 10,000,000 clock cycles


    Notice that accessing to RAM takes many times longer than if the needed data was
    available from the core''s L2 or L3 fast cache. Needless to say, it is desirable
    to have a pair of cores dedicated to one purpose (either SND/IRQ processing or
    a Firewall Worker instance) to maximize the chance that the various fast caches
    are “hot”, instead of waiting up to 10 times longer for RAM access. If a single
    core is configured to perform both SND/IRQ and Firewall Worker functions, numerous
    L2/L3 cache—“misses” will occur every time the processor switches to execute the
    other function. The CPU must wait many times longer for the needed code and data
    to be retrieved from RAM before it can begin execution in the case of a cache
    miss. The amount of L1/L2 (and L3 if present) fast CPU cache on your firewall
    can be determined by running dmidecode -t cache command on the firewall.


    In quite a few tuning and deployment scenarios I''ve faced, there are not enough
    CPU cores allocated to SND/IRQ functions by default. These cores max out under
    heavy load, causing RX-DRPs to occur, thus constraining the amount of traffic
    that can reach the Firewall Worker cores, which as a result are almost never busy
    as the SND/IRQ cores.


