  md: '# CoreXL Firewall Worker Load Distribution 243


    R77.30 firewall by default, when a SND/IRQ core receives a new connection request
    and needs to select an eligible Firewall Worker core to handle it, the SND/IRQ
    core runs a simple hash calculation involving only the source IP address and destination
    IP address of the new connection. Because there are thousands of connections going
    between the two IP addresses, the SND/IRQ will always select the same Firewall
    Worker core for all the scanning connection attempts. This can severely degrade
    performance on the unlucky Firewall Worker core selected to handle this onslaught
    of connection requests arriving at LAN speeds.


    # The Dynamic Dispatcher (R77.30+)


    R77.30 added the option to substantially improve Firewall Worker core load distribution
    via the Dynamic Dispatcher feature. This new Firewall Worker load balancing feature
    is disabled by default in R77.30 but enabled by default on R80.10 gateway. Use
    the command `fw ctl multik dynamic_dispatching get_mode` to check the status of
    the Dynamic Dispatcher on R80.10+. On R77.30 the gateway command to check the
    Dynamic Dispatcher status is `fw ctl multik get_mode`.


    Instead of using just a hash of the source and destination IP address (and optionally
    the destination port number as well via the `fwmultik_hash_use_dport` kernel variable)
    as described above, the Dynamic Dispatcher constantly measures the CPU load of
    all Firewall Worker cores and allocates new connections to the most lightly loaded
    Firewall Worker cores. Note that the Dynamic Dispatcher only balances load among
    the Firewall Worker cores; this feature does *not* balance load between the various
    SND/IRQ cores. There is a very slight overhead imposed on the SND/IRQ cores by'
