  md: 'interface. On the basis of the Young–Laplace equation, $\Delta P_{\mathrm{Laplace}}$
    is estimated as follows:


    $$\Delta P_{\mathrm{Laplace}}=\gamma\left(\frac{1}{R_1}+\frac{1}{R_2}\right) \tag{22}$$


    where $R_1$ and $R_2$ are the curvature radii of the liquid–liquid interface in
    direction vertical and parallel to the liquid stream. For parallel multiphase
    microflows, the equation is simplified as follows.


    $$\Delta P_{\mathrm{Laplace}}=\gamma\left(\frac{1}{R_1}\right)=\frac{2\gamma\sin(\theta-90^\circ)}{d}
    \tag{23}$$


    where $\theta$ and $d$ are the contact angle and depth of the microchannels. The
    contact angle is restricted to the values between the advancing contact angle
    of the aqueous phase $\theta_{\mathrm{aq}}$ and that of the organic phase $\theta_{\mathrm{org}}$.
    Therefore, $\Delta P_{\mathrm{Laplace}}$ is restricted as follows:


    $$\frac{2\gamma\sin(\theta_{\mathrm{aq}}-90^\circ)}{d}<\Delta P_{\mathrm{Laplace}}<\frac{2\gamma\sin(\theta_{\mathrm{org}}-90^\circ)}{d}
    \tag{24}$$


    When $\Delta P_{\mathrm{flow}}$ exceeds the maximum $\Delta P_{\mathrm{Laplace}}$,
    the organic phase flows toward the aqueous phase (Figure 13b). When $\Delta P_{\mathrm{flow}}$
    is lower than the minimum $\Delta P_{\mathrm{Laplace}}$, the aqueous phase flows
    toward the organic phase (Figure 13c). When the flow rate ratio is changed, the
    pressure balance is maintained by changing the position of the liquid–liquid interface.
    This model indicates that the important parameters for microfluidic control are
    the interfacial tension, the dynamic contact angle, and the depth of the microchannel.
    This model can also be applied to gas–liquid microflows.


    Considering the interfacial pressure model, the flow rates should be between the
    higher and lower limits. $\Delta P_{\mathrm{flow}}$ can be evaluated by considering
    the pressure loss in the microchannels. Assuming that the pressure at the opened
    outlet is atmospheric pressure, $P_{\mathrm{atm}}$, then the pressure $P$ of each
    phase from the pressure loss $\Delta P$ is expressed as follows:


    $$P=P_{\mathrm{atm}}+\Delta P_{\mathrm{tube}}+\Delta P_{\mathrm{channel}}$$

    $$=P_{\mathrm{atm}}+\frac{2f\rho v_{\mathrm{tube}}^2L_{\mathrm{tube}}}{d_{h,\mathrm{tube}}}+\frac{2f\rho
    v_{\mathrm{channel}}^2L_{\mathrm{channel}}}{d_{h,\mathrm{channel}}} \tag{25}$$


    where $f$, $\rho$, $v$, and $L$ are the friction factor, the density, the mean
    velocity of the fluid, and the length of the tube and channel correspond to the
    parts of the outlet tube and the microchannel. When the gas–liquid and liquid–liquid
    microflows are considered to be laminar flow, $f$ is expressed as follows:


    $$f=\frac{16}{\mathrm{Re}}=\frac{16\mu}{\rho v d_h} \tag{26}$$'
