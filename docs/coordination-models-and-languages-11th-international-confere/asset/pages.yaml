    # 4. DISCUSSION AND CONCLUSIONS


    The basic methodologies and applications for microfluidics were introduced. In
    Chapter 2, the general concepts (MUO and CFCP) for microintegration and applications
    based on CFCP will be discussed. CFCP approach can be applied to develop more
    complicated chemical processing system. If CAD for microchemical processing, which
    includes microfluid simulation, reaction time analysis, extraction time analysis,
    and microchannel structure design, the time of development for microchemical systems
    would be drastically shortened. In Chapter 3, fluid control methods will be discussed.
    The viscous force and the interfacial tension are effective forces in microspaces.
    In order to control these forces, surface chemistry and microchannel structures
    play important roles. Since the basic methodologies have already been developed,
    development of microfluidic systems for practical applications is required in
    the next stage.


