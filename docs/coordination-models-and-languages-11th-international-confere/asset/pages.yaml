  img_proc: true
- pgno: 228
  md: 'reflections in the general direction of improvement—there is no guarantee it
    will find the global optimum, which may be located in a distant unexplored region
    of the parameter space. To stand a better chance of finding the global optimum,
    different optimization routines are required that work by sampling at discrete
    locations throughout the parameter space. The search process is divided into two
    phases: (1) local searching (i.e., solution refinement) in the vicinity of identified
    optima and (2) global searching in hitherto unexplored regions of the parameter
    space where superior optima might potentially exist. The interested reader is
    referred to Krishnadasan et al. (2007) for a discussion of how global optimizers
    can be applied to nanoparticle synthesis.


    # 5. PROCESS CONTROL


    There are two key steps to any practical optimization procedure: firstly, as described
    in the previous section, the optimal reaction conditions should be identified
    as efficiently as possible to enable swift production of the desired product,
    and secondly, having found the (initially) optimal conditions, the reaction conditions
    should then be regularly updated to compensate for any changes (drift) in the
    system due, for example, to degradation of the precursor materials or the fouling
    of the channel walls. The effects of drift are essentially due to progressive
    changes in hidden variables over which the user has no control. To compensate
    for these changes, the active variables must be adjusted accordingly. Hence if,
    for example, aggressive furring of the channels were to occur, this might significantly
    reduce the cross-sectional area of the channels and so reduce the residence time
    for a given flow rate. This could be mitigated either by reducing the total flow
    rate (to increase the residence time) or increasing the temperature (to increase
    the reaction rate) or by making appropriate changes to both.


    In most cases, the detailed effects of system drift are unpredictable, and it
    is again important to use black-box algorithms that are able to make adjustments
    to the reaction conditions on the basis of measured data only without the need
    for any underlying process model. In order for such a black-box algorithm to determine
    how to update the reaction conditions, it must constantly dither the reaction
    conditions about (what it perceives to be) the current optimum. In other words,
    the algorithm must constantly switch between similar, but slightly different,
    reaction conditions that yield end products of marginally varying quality. The
    algorithm can then compare the quality of the particles so obtained and use this
    information to update the reaction conditions in an appropriate manner. The constant
    perturbing of the reaction conditions is a necessary activity for tracking the
    system drift but unavoidably compromises the instantaneous quality of the product
    since the system frequently finds itself operating at (slightly) non-optimal conditions.'
