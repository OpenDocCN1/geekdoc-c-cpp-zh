    inlets and mixed using a T-mixer, prior to entering the reaction channel, where
    a solution of sat. NaHCO₃ (aq.) was then introduced, after the BPR to quench the
    reaction mixture prior to collection of the reaction products. Upon investigating
    the deoxyfluorination conditions in a range of solvents, including toluene and
    THF, the authors rapidly identified dichloromethane (DCM) as the best solvent
    to use. Employing a reactor temperature of 70 °C, coupled with 1.0 eq. of DAST
    64, for the deoxyfluorination of alcohols and 2.0 eq. when using substrates containing
    a carbonyl moiety; the effect of reactant residence time was evaluated (8–32 min).


