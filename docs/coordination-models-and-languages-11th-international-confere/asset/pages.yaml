    # **4. ELECTROKINETIC CONTROL OF CHEMICAL REACTIONS**


    Instead of directly using the charged or otherwise electrically activated species
    in a chemical reaction, the option exists to use charges to *enhance mass transport*.
    This can be achieved by transporting the chemical species, if charged, themselves,
    or by transporting the medium in which the chemical species are contained. This
    *electrokinetic transport* exists in different forms, which will be highlighted
    below.


    # **4.1 Electrophoresis and electroosmosis**


    In case an electric field is applied on an electrolyte in, for example, a glass
    tube, two different responses to the electric field will occur:


    +   1. *Electrophoresis*: the positive ions in the electrolyte will move in the
    direction of the electric field **E**, while the negative ions will move in the
    opposite direction. The velocity vₑₚ by which the ions move is proportional to
    their electrophoretic mobility, μₑₚ:


    $v_{EF} = μ_{EF}E$ \hfill (1)


    Electrophoretic mobilities are typically in the range of 3–8 × 10⁻⁴ cm² V⁻¹ s⁻¹,
    exceptions being the H⁺ and OH⁻ ions, with mobilities of 36.25 × 10⁻⁴ and 20.50
    × 10⁻⁴ cm² V⁻¹ s⁻¹, respectively.


    +   2. *Electroosmotic flow* (EOF), consisting of the motion of the liquid along
    the surfaces of the electrolyte container. This EOF is based on the drag force
