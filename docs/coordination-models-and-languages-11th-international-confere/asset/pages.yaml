    # ## 2.1 Multiphase microflow network


    For many chemical processing applications, microchemical systems should include
    solvent extraction and interfacial reaction components utilizing both aqueous
    and organic (or gas and liquid) solutions. Both solutions must be controlled to
    realize general chemistry in a microchip. In 1990s, electroosmotic flow was used
    in microchip electrophoresis (Auroux et al., 2002; Reyes et al., 2002); however,
    the electroosmotic flow is restricted to the flow control of only one type solution
    (aqueous buffer). Therefore, electroosmotic flow is not suitable for a flow-control
    method to'
  merge: -1
  img_proc: true
- pgno: 12
  md: '![](img/5c3cdcd9b21d4d4e9da6d42180679a02_12_0.png)


    integrate various chemical processes that require other types of solvents. Simple
    pressure-driven flow has been used by many researchers as a nonelectrical pumping
    method (Brody and Yager, 1997; Kopp et al., 1998; Weigl and Yager, 1999).


    Recently, microsegmented flows of immiscible solutions were used for microchemical
    processes (Burns and Ramshaw, 2001; Kralj et al., 2005; Sahoo et al., 2007; Song
    et al., 2003). Although the microsegmented flows are advantageous in mixing and
    rapid molecular transport, phase separation and more than three-phase contact
    are difficult. Furthermore, controlling the microsegmented flows in the wide range
    of the flow rates is difficult because the size of the segments changes along
    with the flow rate ratio. Kitamori et al. have developed parallel multiphase microflows,
    which flow side-by-side along the microchannels (Hibara et al., 2001). Parallel
    multiphase microflows in laminar flow regime allow better design and control of
    microchemical processes because the parallel multiphase microflows are stable
    in a wide range of the flow rates and can create more than three-phase contact.


    # 2.2 Example of microchemical processes


    # 2.2.1 Molecular transport in microspace


    Microfluidic chemical processes are based on transverse molecular diffusion to
    the microchannel. In microspace, because the diffusion distance is short, rapid
    chemical processes are expected there. In order to clarify the time required for
    chemical processes in microspace, diffusion time t in one'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'dimension is considered for a simple discussion. *t* in one dimension is characterized
    as follows:


    $$t = \frac{l_d^2}{K}$$  (1)


    where $l_d$ and $K$ are the diffusion length and the diffusion coefficient. Figure
    4 shows the diffusion time dependence on the diffusion length. Solid and dashed
    lines correspond to the diffusion time when the respective diffusion coefficients
    are $1 \times 10^{-9}$ and $1 \times 10^{-10}\ \mathrm{m^2\ s^{-1}}$. In 100-μm-wide
    microchannels, diffusion time is just 10 s for a sampling having a diffusion coefficient
    of $1 \times 10^{-9}\ \mathrm{m^2\ s^{-1}}$. Therefore, samples of high diffusion
    coefficients, for example, metal chelates, are rapidly transported in microspace.
    However, diffusion time is 100 s for a sample having a diffusion coefficient of
    samples of $1 \times 10^{-10}\ \mathrm{m^2\ s^{-1}}$. Samples of low diffusion
    coefficient, for example, DNA and proteins, cannot be quickly transported in microspace.


    # 2.2.2  Co wet analysis


    Micro cobalt wet analysis is an example of CFCP that has been demonstrated (Figure
    5) (Tokeshi et al., 2002). Conventional procedures for such analysis consist of
    a chelating reaction, a solvent extraction of the complex, and a decomposition
    and removal of coexisting metal complex. These procedures are analogous to the
    conventional unit operations; mixing and reaction, phase confluence, solvent extraction,
    phase separation, phase confluence, and solvent extraction. These unit operations,
    in the same way, are analogous to the MUOs. CFCP is designed by combining the
    MUOs in series and in parallel, as shown in Figure 3.


    ![](img/5c3cdcd9b21d4d4e9da6d42180679a02_13_0.png)


    **Figure 4**  Diffusion time dependence on the diffusion length. Solid and dashed
    lines correspond to the diffusion time when the respective diffusion coefficients
    are $1 \times 10^{-9}$ and $1 \times 10^{-10}\ \mathrm{m^2\ s^{-1}}$.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/5c3cdcd9b21d4d4e9da6d42180679a02_14_0.png)


    **Figure 5** Designing of Co wet analysis systems based on CFCP.


    The microchip consists of two different areas, one for reaction and extraction
    and the other for purification (i.e., decomposition, extraction, and removing
    impure chelates). In the reaction area, the sample solution containing Co(II),
    2-nitroso-1-naphthol (NN), and *m*-xylene were introduced at a constant flow rate
    through three inlets using microsyringe pumps. These three flows converge at the
    intersection point, and parallel two-phase microflows, consisting of an organic–aqueous
    interface, forms in the microchannel. The chemical reaction of Co(II) and NN,
    and extraction of the Co–NN chelates proceed as the reacting mixture flows along
    the microchannel. Because NN reacts with coexisting metal ions, such as Co(II),
    Ni(II), and Fe(II), these coexisting metal chelates are also extracted into the
    *m*-xylene microflow. Therefore, purification is needed after extraction.


    The coexisting metal chelates are decomposed when they make contact at the HCl–*m*-xylene
    interface, and the metal ions are dissolved in the HCl solution phase. The decomposed
    fragment of NN is dissolved in NaOH solution, and the Co–NN chelate is stable
    in concentrated HCl and NaOH solutions, where it remains. Finally, the target
    chelates in *m*-xylene are detected by a thermal lens microscope downstream, where
    the Co(II) in aqueous solutions was successfully determined. The limit of detection
    (2σ) was 0.13 zmol or 78 chelate molecules. The analysis time in this system is
    only 50 s versus 6 h for conventional devices. Micro chemical processing through
    use of CFCP has been demonstrated on numerous occasions (Table 1).'
  merge: -1
  img_proc: true
