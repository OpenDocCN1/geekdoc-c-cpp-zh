  md: '# 4. THE AUTOMATED PRODUCTION OF NANOPARTICLES


    As noted in the introduction, a major aim of the current research is the development
    of “black-box” automated reactors that can produce particles with desired physicochemical
    properties on demand and *without any user intervention*. In operation, an ideal
    reactor would behave in the manner of Figure 12. The user would first specify
    the required particle properties. The reactor would then evaluate multiple reaction
    conditions until it eventually identified an appropriate set of reaction conditions
    that yield particles with the specified properties, and it would then continue
    to produce particles with exactly these properties until instructed to stop. There
    are three essential parts to any automated system—(1) physical machinery to perform
    the process at hand, (2) online detectors for monitoring the output of the process,
    and (3) decision-making software that repeatedly updates the process parameters
    until a product with the desired properties is obtained. The effectiveness of
    the automation procedure is critically dependent on the performance of these three
    subsystems, each of which must satisfy a number of key criteria: the machinery
    should provide precise reproducible control of the physical process and should
    carry out the individual process steps as rapidly as possible to enable fast screening;
    the online detectors should provide real-time low-noise information about the
    end product; and the decision-making software should search for the optimal conditions
    in a way that is both parsimonious in terms of experimental measurements (in order
    to ensure a fast time-to-solution) and tolerant of noise in the experimental system.


    The microfluidic system described above has two key features that make it especially
    amenable to creating such automated reactors: firstly, the reaction conditions
    can be precisely and rapidly manipulated (which in turn means that it is possible
    to finely tune the physical properties of the reaction product), and secondly,
    the inline spectrometer provides immediate real-time information about the product.
    The only remaining element


    ![](img/5c3cdcd9b21d4d4e9da6d42180679a02_217_0.png)


    **Figure 12**  Schematic illustrating the desired behavior of an automated chemical
    reactor. The user enters the desired particle properties, the “black-box reactor
    then evaluates multiple reaction conditions until it identifies an appropriate
    set that yield particles with the desired properties; the reactor then continues
    to produce particles with these properties until instructed to stop.'
