    [determined by off-line high-performance liquid chromatography (HPLC) analysis].


    The ease of method transfer was subsequently demonstrated via substitution of
    acetyl chloride 19 with acetyl [D3]chloride 22, whereby operating the reactor
    under the aforementioned conditions, the authors obtained comparable results (98%
    conversion). This investigation provided important results for those in the area
