  md: '# 2. MICROPLASMA REACTORS


    # 2.1 Atmospheric pressure microplasmas


    The plasma state is referred to as the fourth state of matter. It is used to describe
    a partially or completely ionized gas consisting of positive and negative ions,
    electrons, and excited and neutral species. The ionization degree of plasma can
    vary from partially ionized to fully ionized. Plasma exhibits quasinatural which
    is referred to as a balance of positive and negative charges. Local charges can
    be balanced by electrostatic forces which restore the quasineutrality. Plasmas
    are classified by the number density (particles cm⁻³) and average kinetic energy
    (eV), mostly expressed in terms of temperature (K), of the different charged species.
    The average kinetic energy of electrons, ions, and excited and neutral species
    depends on the plasma conditions. In equilibrium or thermal plasmas, all constituents
    (ions, electrons, and neutrals) have the same average temperature, which can vary
    from a few thousand Kelvin (e.g., in plasma torches) to a few million Kelvin (in
    fusion plasmas). In a nonthermal low-temperature plasma, the temperature of the
    ions and neutral species can be close to ambient temperature, while in that same
    plasma the temperature of the electrons can exceed several thousand Kelvin. The
    temperature of plasma components (e.g., electrons and species in an excited state)
    can exceed the temperatures applied in conventional thermal chemical processes
    and these exceptional conditions of the plasma can generate a thermodynamic nonequilibrium
    state with a high concentration of energetic and reactive species (Roth, Lichtenberg,
    1994; Raizer, 1991; von Engel, 1955).


    Atmospheric pressure nonthermal discharges may become of great importance for
    chemical industry because they create a highly reactive environment at cold temperatures
    and therewith open up alternative, highly flexible, environmentally friendly,
    and energy-saving processing routes. Characteristics and properties of nonequilibrium
    atmospheric pressure plasmas can be found in many review articles and books (Becker
    et al., 2004, 2005, 2006; Foest et al., 2006; Lieberman and Lichtenberg, 1994;
    Raizer, 1991; Tachibana, 2006; von Engel, 1955).


    Atmospheric pressure plasmas, just like most other plasmas, are generated by a
    high electric field in a gas volume. The few free electrons which are always present
    in the gas, due to, for example, cosmic radiation or radioactive decay of certain
    isotopes, will, after a critical electric field strength has been exceeded, develop
    an avalanche with ionization and excitation of species. Energy gained by the hot
    electrons is efficiently transferred and used in the excitation and dissociation
    of gas molecules. In a nonequilibrium atmospheric pressure plasma, collisions
    and radiative processes are dominated by energy transfer by stepwise processes
    and three-body collisions. The dominance of these processes has allowed many'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'novel applications, for example, in medical sterilization, biological decontamination,
    remediation of pollutants, excimer lamps, and light sources (Foest et al., 2006).
    However, high-pressure plasmas have a tendency to become unstable due to the rapid
    transition to arcs and filamentation. To avoid instability problems and maintain
    a self-sustaining discharge for practical applications, a solution was found in
    the confinement of the high-pressure plasma to *dimensions below about 1 mm*.
    Such a plasma is often referred to as a *microplasma*. The current and energy
    density in this type of plasma is found to be high and results in effective gas
    heating and momentum transfer from electrons to gas molecules.


    Chemistry in reactors with dimensions below 1 mm leads us into the field of *microreactors*.
    Implementation of microplasmas in microreactors offers the potential to exploit
    the advantages of atmospheric pressure nonequilibrium chemical processes for efficient
    synthesis of valuable chemicals and nanostructures as well as the decomposition
    of hazardous compounds. As mentioned before, microplasmas can be generated at
    low gas temperatures and possess an electron energy distribution containing large
    fractions of high-energy electrons, and reactive species deriving from these electrons.
    In addition, the increased surface area-to-volume ratio in microreactor channels
    leads to enhanced plasma-surface interactions, which is very useful in cases where
    active coatings are present on the channel walls. The combination of the reactive
    species and the additional plasma activation of the surface may be exploited to
    produce chemical products in an energy efficient manner.


    A number of configurations of microplasma reactors will be described here. Classification
    will be based on the power sources, the electric field switching frequency ranging
    from DC to GHz, and electrode geometries and materials, extending from DBDs to
    micro hollow cathodes and microcavity discharges.


    # 2.1.1 DC glow discharges


    Atmospheric pressure DC glow discharges can be generated between two electrodes
    when the current through the discharge is limited to low values by a large resistor
    (Grotrian, 1915). The microplasma can be stabilized when the electrode separation
    is kept below 1 mm and the transition to an unstable arc discharge can be avoided
    when the spatial dimensions of the discharge are kept small enough (Staeck et
    al., 2005). Figure 1 shows a picture of such a discharge in air. Spectroscopic
    temperature measurements show that the discharge is nonthermal with a gas temperature
    above room temperature. The nonequilibrium nature of glow discharges for small
    dimensions may find applications in microreactors for gas reforming, material
    deposition and the destruction of environmentally harmful substances.'
