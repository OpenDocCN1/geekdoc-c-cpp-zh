    2002b; Schwalbe et al., 2002, 2004). In a recent example by Hooper and Watts (2007),
    the atom efficiency of reactions conducted within microfluidic systems was demonstrated
    via the incorporation of deuterium labels into an array of small organic compounds.
    Employing the base-mediated acylation of primary amines as a model reaction, see
    Scheme 5, the authors demonstrated the ease by which reactions could first be
    conducted using unlabeled precursors and once the optimal reaction conditions
    were identified, substitution with the labeled reagent enabled the rapid and efficient
    synthesis of the deuterated analog.


    To conduct the model reaction illustrated, two borosilicate glass reactors were
    employed in series [Reactor 1 = 201 µm (wide) × 75 µm (deep) × 2 cm (long), Reactor
    2 = 158 µm (wide) × 60 µm (deep) × 1.5 cm (long)] and reagents delivered to the
    reaction channels using a syringe pump. To ensure long-term operation of the reactor
    setup, the authors found it necessary to employ a mixed solvent in order to obtain
    a balance between by-product solubility (Et3N·HCl) and stability of the acylating
    agent 19. With this in mind, solutions of benzylamine 20 and triethylamine 14
    in MeCN (0.1 M, respectively) were introduced into the reactor from separate inlets
    and mixed using a T-mixer, prior to the addition of the acyl halide (0.05 M) as
