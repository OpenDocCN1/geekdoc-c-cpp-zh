  md: '# 2.4.1 Base-promoted microreactions


    Wiles et al. (2004a, 2007a) demonstrated the incorporation of a series of silica-supported
    bases into an EOF-based capillary reactor, as a means of increasing the efficiency
    of the Knoevenagel condensation (cf. conventional batchwise protocols). To conduct
    a reaction, the solid-supported base was packed into a borosilicate glass capillary
    [500 μm (i.d.) × 3.0 cm (long)] and held in place by two microporous silica frits.
    A premixed solution of the aldehyde and ethyl cyanoacetate 109/malonitrile 110
    (1.00 M in MeCN, respectively) was then mobilized through the packed bed, where
    the base-catalyzed condensation reaction occurred, and the reaction products collected
    at the reactor outlet in MeCN, prior to off-line analysis by GC–MS. Using this
    approach, the authors investigated the reactivity of a range of substituted aromatic
    aldehydes, obtaining conversions in the range of 99–100% and solid-supported catalysts
    111–114 (Scheme 28). Compared to traditional stirred or shaken reactors, the use
    of a continuous flow system proved advantageous as it led to reduced degradation
    of the solid-supported catalyst, leading to enhanced reagent lifetimes and between
    run reproducibility.


    Having demonstrated the principle using small quantities of catalytic material,
    typically 5 mg, the authors later demonstrated the ability to generate the aforementioned
    materials with a throughput ranging from 0.57 to 0.94 g h⁻¹ by simply increasing
    the size of the packed bed employed [3,000 μm (i.d.) × 3 cm (long)].


    Employing silica-supported piperazine 113 (0.10 g, 1.70 mmol N g⁻¹), the authors
    demonstrated the use of EOF for the semipreparative scale synthesis of a series
    of α,β-unsaturated compounds and as previously observed in the capillary-based
    reactor, the compounds were obtained in excellent isolated yield and product purity
    (Table 13).


    ![](img/5c3cdcd9b21d4d4e9da6d42180679a02_142_0.png)


    **Scheme 28**  General reaction scheme illustrating the Knoevenagel condensation
    conducted using EOF as a pumping mechanism.'
