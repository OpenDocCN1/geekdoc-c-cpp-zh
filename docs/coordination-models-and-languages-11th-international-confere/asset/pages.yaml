  md: 'to guide the automation. This differs from the usual situation in chemical
    engineering where mathematical models of the chemical plant are normally available
    to supplement measured data. In the case of nanoparticle synthesis, the only information
    available to the algorithm is the measured data. The utility function in effect
    behaves like a black box that converts the process conditions to a final figure
    of merit in a manner that is entirely unknown to the minimization routine.


    +   2. The same nominal reaction conditions may on different occasions give rise
    to slightly different products due to mechanical or chemical imperfections in
    the reactor. The utility function is therefore said to be noisy. The vast majority
    of minimization routines are designed for handling noise-free mathematical functions
    and only a very small subset of algorithms can cope with appreciable noise.


    +   3. Owing to the slow nature of nanoparticle formation, there is typically
    a delay of several minutes between setting new reaction conditions and the figure
    of merit reaching a new stable value. The utility function is said to be expensive
    to evaluate and, from a practical perspective, this means only a small number
    of reaction conditions can be tested during the search for the optimum process
    conditions. This restricts the choice of algorithm severely since conventional
    minimization routines often require thousands of measurements to find the optimum
    conditions. If each measurement takes on average 5 min, one thousand measurements
    would correspond to a full week of searching, which is clearly excessive for many
    applications. Ideally, the control algorithm should be able to find the optimum
    reaction conditions in one hundred measurements or less.


    +   4. The reaction conditions are constrained. In other words, there is usually
    a strict upper and lower limit for each reaction parameter. In the case of the
    synthesis described above, for example, the lower temperature is set by the need
    to provide sufficient thermal energy to initiate the reaction and the upper temperature
    by the need to remain below the decomposition temperature of the glue (see Section
    2). The lower and upper limits on the total flow rate meanwhile are determined,
    respectively, by the maximum length of time one is prepared to allow for a single
    reaction and the minimum reaction time needed to produce crystals of nanometer
    dimensions. In this work, we select minimum and maximum total flow rates of 2
    and 40 μl min⁻¹ which, for the typical chip volumes we use (~16.6 μl), correspond
    to average residence times of about 500 and 25 s, respectively.


    +   5. The majority of minimization routines are designed for unconstrained optimization,
    in which the control algorithm is free to select any parameters it wishes. Only
    a minority can handle constrained optimization.'
