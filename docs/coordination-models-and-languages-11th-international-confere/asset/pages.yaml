    In a second example, Sato et al. (2007) demonstrated the highly selective, hydrolysis
    free O-acylation of alcohols using subcritical water (Scheme 10). Employing a
    reaction temperature of 200 °C, a pressure of 5 MPa, the acylation of benzyl alcohol
    35 was achieved in <10 s, using acetic anhydride 37 as the acylating agent, and
    afforded the target benzyl acetate 36 in 99% yield, compared to 17% in a batch
    process. The use of subcritical water coupled with the microflow reactor has great
    synthetic potential as it removes the need for organic solvents enabling reactions
    to be performed in an environmentally benign solvent system, whilst affording
    a facile means of isolating the reaction products, facilitating reuse of the solvent.


    In addition to providing heat to a reaction vessel through the use of a thermal
    jacket, oil bath, or convective heater, the past 5 years have seen numerous authors
    successfully combine the emerging technologies of microwave chemistry and microreaction
    technology, noting an array of advantages including reduced reaction times and
    increased product selectivity. Comer and Organ (2005a) recently demonstrated the
    use of microwave irradiation as an alternative heating source for a series of
    Suzuki–Miyaura reactions conducted in glass capillary reactors [200 μm (i.d.)].
    To perform a reaction, the authors introduced reactants into the flow reactor
    through a stainless-steel mixing chamber, under pressure-driven flow, and investigated
    the coupling of 4-iodo-4-ene 38 (0.20 M) and 4-methoxyboronic acid 39 (0.24 M)
    using THF as the reaction solvent and palladium tetrakis(triphenylphosphine) 40
    as the catalyst (Scheme 11). Under 100 W, the authors obtained 100% conversion
    to 1-methoxy-4-(1-propylpent-1-enyl) benzene 41 with a residence time of 28 min.


    The reaction was subsequently repeated using an array of aryl halides and boronic
    acids, affording the target compounds in 37% to quantitative yield. Compared to
    conventional batch reactions, these results illustrate dramatic improvements in
    yield largely due to the suppression of competing side reactions.


