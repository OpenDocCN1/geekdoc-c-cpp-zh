    TiO₂ and CeO₂), have led to the discovery of *non-Faradaic electrochemical modification
    of catalytic activity* (NEMCA, Stoukides and Vayenas, 1981), in which catalytic
    activity and selectivity were both found to depend strongly on the electric potential
    of the catalyst potential, with an increase in catalytic rate exceeding the rate
    expected on the basis of Faradaic ion flux by up to five orders of'
