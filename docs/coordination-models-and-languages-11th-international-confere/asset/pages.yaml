    # #### 4.4.3 Pulsed electric fields


    Pulsed electric fields are used in food preservation to inhibit microorganisms
    in foods without significant loss of flavor, color, taste, and nutrients. The
    treatment generates a very short (microseconds) but high electric current pulse
    through the food. The topic has recently been reviewed, including the fundamental
    mechanisms of food preservation (Min et al., 2007). The main mechanisms for microbial
    inhibition are structural damaging of cells, in particular cell membranes, due
    to a number of mechanisms related to cell stress and fatigue, and inactivation
    of enzymes due to association or dissociation of functional groups, movement of
    charged chains, and changes in the alignment of helices.


    A peculiar recent report is that in which the application of an AC high voltage
    to accelerate wine aging is discussed (Zeng et al., 2008). The optimum treatment
    was found to be with an electric field of 600 V cm⁻¹ for 3 min. Several analysis
    techniques were used to clarify the differences between treated and untreated
    wine samples, and it was found that the amount of higher alcohols and aldehydes
    in volatile compounds decreased significantly while the amount of some of the
    esters and free amino acids slightly increased. A mechanism that may be responsible
    for the formation of the free amino acids is protein degradation, but otherwise
    no explanations have been given for the effect of the AC electric field.


    # #### 4.4.4 Electrospray


    Electrospraying is a concept in which an electric field is applied between a liquid
    outlet and an object at some distance from the outlet. The liquid becomes dispersed
    and develops into a very fine aerosol because droplets break up due to a Rayleigh
    instability, that is, the phenomenon that a thin beam of a liquid in a gas becomes
    unstable at a certain length and breaks up into droplets, which effect is enhanced
    by an electric field on the liquid (Rayleigh, 1882). A related concept that is
    used very frequently to generate ions that can be separated in a mass spectrometer
    is electrospray ionization (ESI). Here a high voltage is applied to a liquid supplied
    through a nozzle (e.g., a small glass capillary). The liquid forms a so-called
    Taylor cone, at which apex droplets break up into a fine spray with smaller and
    smaller droplets because of radial dispersion due to Coulomb repulsion in combination
    with solvent evaporation, until finally all the solvent is evaporated and all
    the solutes have become ionized and can enter the'
