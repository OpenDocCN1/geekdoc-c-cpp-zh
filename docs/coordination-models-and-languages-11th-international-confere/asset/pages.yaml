  md: 'research and development (Glasnov and Kappe, 2007; Mason et al., 2007); with
    interest in the technology stemming from the perceived ease with which reaction
    conditions can be optimized and subsequently employed across a range of substrates
    in order to generate compound libraries (Kirschning et al., 2006; Wiles and Watts,
    2007a; Wiles and Watts 2008a). The rapid translation of reaction methodology from
    the microreactors employed within an R&D facility to production, achieved by a
    process referred to as scale-out, numbering-up, or upscaling, also has the potential
    to reduce the time taken to take a compound to market (Yoshida, 2008).


    Based on this notion, research into the use of microreactors as tools for high-throughput
    organic synthesis has grown in popularity, with the last 5 years seeing an emerging
    trend in the types of compounds prepared changing from proof of concept reactions,
    to the synthesis of molecules of direct relevance to the pharmaceutical industry.
    With this in mind, the chapter begins with an overview of the seminal examples
    that helped to foster interest in microreactors as high-throughput tools, illustrating
    liquid phase (Sections 2.1–2.3), catalytic (Section 2.4) and photochemical (Section
    2.6) reactions, and concludes with a selection of current examples in the synthesis
    of industrially relevant molecules using MRT (Section 3).


    # 1. INTRODUCTION


    When considering the use of microreaction technology, from the perspective of
    high-throughput organic synthesis, the main benefit that this technique offers
    is increased reaction control, which in itself affords many practical advantages
    to the user. As a result of the small reactor dimensions, rapid mixing of reactants,
    and an even temperature of reaction are observed, which not only increase the
    uniformity of reaction conditions, but also afford increased reaction safety,
    selectivity, reproducibility, and efficiency when compared to conventional batch
    reactors; where hot spot formation can lead to the formation of by-products and
    the risk of thermal runaway.


    From a screening perspective, the rapid mixing and equilibration of reaction conditions
    is advantageous as parameters such as time, temperature, pressure, and stoichiometry
    can be varied with ease and have an immediate effect on the microreaction, compared
    to batch vessels where changes take time to have an effect on the whole of the
    reaction mixture. As such, reaction screening can be performed in a shorter time
    frame, using less raw materials than a conventional reaction evaluation; whilst
    enabling the reaction conditions identified to be employed in the production of
    larger quantities of the material for clinical trials and subsequent production
    campaigns if required. With these factors in mind, the following sections provide
    practical examples of the advantages associated with microreaction technology
    (MRT), starting with liquid-phase'
