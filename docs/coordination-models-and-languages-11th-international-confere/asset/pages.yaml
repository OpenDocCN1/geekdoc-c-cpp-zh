    # 2. THE USE OF MICROREACTORS FOR HIGH-THROUGHPUT ORGANIC SYNTHESIS


    # 2.1 Enhanced reaction control


    An early example that illustrated the ability to reduce reaction times as a consequence
    of conducting reactions in miniaturized, continuous flow reactors was reported
    by Fernandez-Suarez et al. (2002) who investigated a series of Domino reactions
    within a soda-lime glass microreactor. As Scheme 1 illustrates, the reactions
    involved a base-catalyzed Knoevenagel condensation followed by an intramolecular
    hetero-Diels–Alder reaction. To synthesize cycloadduct 1 under continuous flow,
    a solution of *rac*-citronellal 2 (0.10 M) and a premixed solution containing
    barbituric acid 3 (0.12 M) and ethylenediamine diacetate (EDDA) 4 (0.17 M), in
    MeOH:H₂O (80:20), were introduced into the reaction channels from inlets A and
    B, respectively. Reagents were mobilized within the reactor using a series of
    computer-controlled pumps, with reactions performed over a period of 30 min prior
    to analysis of the reaction products off-line by liquid chromatography–mass spectrometry
    (LC–MS). Employing an initial residence time of 2 min, the authors reported 60%
    conversion to cycloadduct 1, which was further increased to 68% conversion by
    extending the residence time to 6 min. With this information in hand, the authors
    synthesized a series of cycloadducts under the aforementioned conditions, affording
    the respective compounds in yields ranging from 59 to 75%.


    In another glass (borosilicate) microreactor [channel dimensions = 350 μm (wide)
    × 52 μm (deep) × 2.5 cm (long)], Wiles et al. (2004b) prepared a series of 1,2-azoles,
    illustrating the synthesis of a pharmaceutically relevant core motif. Reactions
    were performed using electroosmotic flow (EOF) as the pumping mechanism and employed
    separate


