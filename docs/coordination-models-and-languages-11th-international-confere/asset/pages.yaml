  md: 'electrophoresis on a chip (Harrison et al., 1993). This concept has also been
    exploited in microreactors, in particular by researchers at Hull University in
    the United Kingdom (for literature references see below).


    Spatial and temporal control of chemical reactions by electrokinetic principles
    relies on the possibility to direct reagents and products to or from selected
    points in a microchannel network, at specific times. An electrokinetic microfluidic
    network may be modeled as an electrical resistance network, using the well-known
    Kirchhoff voltage and current laws (Cummings et al., 2000; Fletcher et al., 1999,
    2001, 2002; Qiao and Aluru, 2002), in which the flow rates are directly proportional
    to the electric currents. A pressure-driven microchannel network can be modeled
    with the same laws if they are rewritten in terms of hydraulic resistances and
    pressures and volume flows (Bula, 2009; Chatterjee and Aluru, 2005), but the electrokinetic
    case can be more complex if the local resistivity (and therewith the local electric
    field) changes due to electrophoretic separation and a phenomenon called *electromigration
    dispersion*. Such effects require the inclusion of the Kohlrausch''s regulating
    function (Kohlrausch, 1897) in the model (Mikkers, 1999). We refer to the literature
    for more details about these phenomena and related effects like "stacking" which
    is often used in capillary electrophoresis to enhance separation. Deviations from
    the "ideal" uniform-resistivity-based network typically occur when a plug of an
    electrolyte with a resistivity largely different from the background electrolyte
    is injected in that background electrolyte. This would be analogous to a local
    variation in viscosity in pressure-driven flow, for example, gas-liquid flow in
    a microchannel, or for injection of a highly viscous sample into a liquid chromatography
    column, leading to an instability called "viscous fingering" (De Malsche et al.,
    2009). That clean "switching" of flows in a simple Y-type microreactor inlet,
    using electrokinetic principles, is not as simple as it may seem, has recently
    been discussed in detail by MacInnes et al., who have shown that clean switching
    is difficult to achieve in practice, and that there is considerable contamination
    of each reagent supply channel with the other reagents (MacInnes et al., 2003).
    It has also been shown that the conductivity of the surface may play a significant
    role in electrokinetic flow principles (Fletcher et al., 2001) and that for extremely
    small channels, *nanochannels*, the situation becomes even more complex due to
