  md: 'wastewater treatment (Locke et al., 2006). Electric fields applied to water,
    called *electrohydraulic discharge*, initiate both chemical and physical processes,
    with two basic discharge types, differing by the amount of energy deposited in
    the system. The corona system uses discharges of ~1 J per pulse and operates at
    high frequency, 100–1000 Hz, with a peak current below 100 A and nanosecond voltage
    rise times. The pulsed arc discharge uses energy of ~1 kJ per pulse and larger,
    and operates at low frequency, 10⁻²–10⁻³ Hz, with a peak current above 1 kA and
    microsecond voltage rise. The pulsed arc generates strong shock waves accompanied
    with cavitation and bubbles with ionized gas inside, leading to chemical reactions
    that have been suggested to be similar to those that occur in sonochemistry. In
    the corona discharge a streamer is generated, relatively weak shock waves are
    formed and a moderate amount of bubbles is observed. Radicals and reactive species
    are formed in the narrow region near the corona discharge electrodes: Generation
    of H, O, and OH radicals were observed by emission optical spectroscopy (Locke
    et al., 2006).


    Corona discharges in liquids can be generated in many different reactor configurations
    (Locke et al., 2006), but principally they fall into two categories (Figure 20),
    one in which both electrodes are immersed in the liquid, and one in which one
    of the electrodes is above the liquid. For the second configuration, ions, radicals,
    and neutral species produced by the discharge, which partially occurs in the gas
    phase, may transfer into the liquid phase through action of the electric field,
    and react there to form other reactive species. It was suggested that the average
    energy of the positive gaseous ions entering the liquid phase may be more than
    100 eV.


