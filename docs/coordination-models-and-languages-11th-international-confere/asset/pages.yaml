  md: 'straightforwardly incorporated into a simplex scheme (in which all decisions
    are based solely on the ranking of the vertices in the current simplex). This
    problem was solved in 2006 by Martinez (2005), who, building on earlier work by
    Anderson et al. (2000), proposed a statistical means of ranking the vertices.
    The detailed mathematical foundations need not concern us here, and it will suffice
    to say that the approach uses a statistical figure of merit—known as an optimality
    coefficient—whose value decreases monotonically from zero to minus one as the
    minimum is approached. In the scheme proposed by Martinez, the simplex optimization
    is implemented in the usual way, subject to the one change that vertices are ranked
    according to their relative optimality coefficients (instead of their relative
    function values). Importantly, the optimality coefficient is calculated using
    both the function values at the vertices and all historical data, and so the algorithm
    gains a more global view of the terrain. The statistical simplex approach is far
    less sensitive to the effects of noise and is therefore in turn less susceptible
    to becoming trapped at fictitious minima.


    The application of the statistical simplex to nanoparticle synthesis is illustrated
    in Figure 18 using a simple one-dimensional example, in which the statistical
    simplex algorithm aimed to control the emission wavelength by varying the total
    flow rate (F<sub>tot</sub> = F<sub>A</sub> + F<sub>B</sub>) of the injected precursors.
    (The ratio of the injection rates of the Cd and Se precursors was set equal, that
    is, F<sub>A</sub> = F<sub>B</sub>, to ensure a constant ratio of Cd : Se in the
    reaction mixture.) The target wavelength was set to 540 nm, and the vertices of
