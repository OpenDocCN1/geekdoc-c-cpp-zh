    least one dielectric layer, being an insulator, between electrode and plasma,
    to prevent arc formation. Dielectric barriers can be glass, ceramic, or polymer
    coatings. In a DBD configuration, the plasma has a capacitive nature and consists
    of a large number of microdischarges in the gap between the insulator and the
    opposite (often uncovered) electrode, where the duration of the filamentary microdischarges
    is limited to a few nanoseconds (Kogelschatz, 2002). In this way, excess gas heating
    is minimized, although activation of molecules and atoms in the gas volume is
    ensured by high-energy electrons created in the microdischarges. The incorporation
    of a DBD in a microreactor as a miniature source of ions, excited species and
    radicals can generate a highly reactive and quenching environment which is difficult
    to obtain in thermochemical processes.


    # 2.1.3 Micro hollow cathode discharges


    Micro hollow cathode discharges (MHCDs) were first reported as stable atmospheric
    pressure microdischarges in cylindrical hollow cathode geometry (Schoenbach, 1996).
    In a typical hollow cathode structure, there is a cylindrical hole in the cathode,
    with a ring-shaped anode separated by an insulator (Figure 3a), or a cylindrical
    opening in a thin solid cathode layer (Figure 3b) (Schoenbach et al., 2003). Because
    of the relatively simple fabrication process of these electrode configurations,
    manufacturing of large area arrays of microplasma devices with parallel operation
    becomes feasible. Flowing gas through the plasma volume inside the hollow part
    allows the use of these discharges as microreactors. It is also possible to apply
    a third electrode placed at the anode side to achieve a stable glow discharge
    with dimensions of up to centimeters in


