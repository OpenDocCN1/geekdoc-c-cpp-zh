    # ### 3.2 Methods of stabilization of multiphase microflows


    Disturbances in the flow rates of pumps can destabilize multiphase microflows.
    However, the control method utilizing the microchannel structure and surface energy
    is effective for maintaining robust control over microfluidics. Researchers have
    suggested that multiphase microflows can be stabilized by altering the structure
    or adding features to the microchannels, specifically by including a guide structure
    (Fokeshi et al., 2002) or a pillar structure (Maruyama et al., 2004) along the
    microchannel, which permit a wider range of contact angle for the fluid interface
    than a flat surface. Researchers can design various microfluidic chemical processes
    using liquid-liquid microflows.


    Other groups have proposed selective chemical surface modification for stabilization
    of the multiphase microflows (Aota et al., 2007a, 2007b; Hibara et al., 2002,
    2003, 2005, 2008; van der Linden et al., 2006; Zhao et al., 2001, 2002a, 2002b,
    2003) Figure 16 illustrates the shape of the liquid-liquid interface in a microchannel
    with chemically patterned surfaces. The contact angle of water on a hydrophobic
    surface can be larger than 90°. Therefore, multiphase microflows in microchannels
    with patterned surfaces can form under a wider range of conditions compared to
    microchannels with a guide structure or pillar structure.'
