- pgno: 233
  md: 'than a few discrete cases as is usually sufficient for toxicological studies
    of macroscale particles). Furthermore, a number of other factors are likely to
    influence toxicity, including crystallinity, surface functionalization, surface
    charge (zeta potential), hydrophilicity, and propensity for aggregation or agglomeration.
    The diverse range of factors that can influence the toxicity of nanomaterials
    presents a formidable challenge for toxicologists, and there is a growing need
    for new tools and techniques that can be used to analyze the toxicity of nanomaterials.


    Conventional macroscale toxicology makes heavy use of libraries of reference materials
    (RMs)—that is, standard materials with stable well-defined properties that are
    prepared and handled according to precise protocols. RMs may be investigated by
    multiple researchers in the confidence that they are all looking at essentially
    the same materials, enabling meaningful comparisons to be made between their research
    findings. There is now an urgent need to develop similar libraries for nanotoxicology,
    in which commonly used nanomaterials are provided in as wide a variety of sizes,
    shapes, and surface functionalizations as possible. A number of recent studies
    have investigated the feasibility of developing such libraries, and there is an
    emerging consensus about the requirements of such libraries. Firstly, RMs should
    be available for all the most commonly used nanomaterials, namely, metals, metal
    alloys, metal oxides, quantum dots, and fullerenes. Secondly, the RMs should be
    provided in a range of monodisperse sizes and shapes. Thirdly, the RMs should
    be of verifiable quality with minimal batch-to-batch variation between nominally
    identical materials. And finally, the RMs should be available in kilogram quantities
    to ensure sufficient material is available for worldwide studies. In addition,
    the studies drew attention to one issue of particular concern, namely, the significant
    differences in reactivity (and hence potential toxicity) that frequently exist
    between freshly prepared and stored particles. This question introduces two serious
    doubts about the viability of the conventional RM approach—in which standardized
    materials are prepared in centralized facilities and then transported to their
    intended location of use—since the particles are liable to “age” substantially
    in transit. Ideally, the nanomaterials should be prepared on demand at the point
    of use, but this is inconvenient, potentially dangerous, and requires a level
    of synthetic expertise that the typical practicing toxicologist does not have.
    The method outlined in this chapter, however, offers a possible solution. The
    automated systems described above could be readily integrated into a simple self-contained
    desktop machine that produces nanomaterials on demand to a well-defined and verifiable
    specification. In this way, nanomaterials could be prepared as and when required,
    enabling reliable toxicological studies to be undertaken on both fresh and aged
    samples. Moreover, the high levels of process control afforded by the microfluidic
    format enable systematic studies in which key nanomaterials'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'properties—size, shape, chemical composition, zeta potential, etc.—may be varied
    with ease. At the time of writing, a wide variety of nanomaterials have been successfully
    prepared in microreactors, including CdSe, CdS TiO2, Ag, Au, and Co to name but
    a few. In fact, of the key families of nanomaterials identified above, only fullerenes
    have yet to be successfully synthesized in a microfluidic format (due to the normal
    use of combustion-based preparation routes). The automated microfluidic route
    is therefore an attractive means of making most of the commonly used families
    of nanomaterials. Importantly, it satisfies most of the other requirements of
    RMs noted above: the high levels of process control enable the preparation of
    size-monodisperse series of nanomaterials and the use of online monitoring allows
    quality assurance and minimizes batch-to-batch variation.


    The major objection to using the microfluidic approach might seem to be inadequate
    materials throughput. In fact, despite the small size of the reaction channels,
    surprisingly large quantities of materials can be prepared using microfluidic
    devices. In the case of CdSe quantum dots, for example, the nanoparticles can
    be prepared using flow rates of several hundred microliters per minute which,
    for typical precursor concentrations of 10 μg μl−1 implies production rates of
    order 1 mg min−1. Moreover, due to the small size of the channels, it is possible
    to integrate multiple channels onto a single microchip, enabling the syntheses
    to be carried out in parallel. This approach is called “scale-out” in contrast
    to the usual process of “scale-up” and has the important advantage that all channels
    can be fabricated with identical dimensions, and the increased throughput can
    therefore be achieved without the need to reformulate the chemical reactions in
    any way (as is invariably necessary for scale-up). In a small multichannel system
    containing just twenty parallel reactors, production rates of about 1 g h−1 are
    easily achievable which is sufficient for most practical applications. Hence,
    despite the small size of the microreactors, an appreciable amount of material
    can be produced in a relatively short period of time.


    In our current work, we are aiming to develop parallel systems of this nature
    for a variety of applications where on-demand production of high-quality nanoparticles
    is required.


    # ## 7. CONCLUSIONS


    It is fair to say that over the last 8 years there has been a significant growth
    in microfluidic-based methods for synthesizing nanoscale materials. Significantly,
    such materials are of a quality that matches or exceeds materials produced using
    traditional bulk methods. Furthermore, the continued development of integrated
    multicomponent systems will create invaluable tools for improving both the properties
    and yields of this important class of materials.'
