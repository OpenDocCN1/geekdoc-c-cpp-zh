    # 2.3 The use of toxic or hazardous reagents


    In addition to reactant/intermediate instability preventing the use of certain
    synthetic routes on a large scale, the toxicity of reagents can also preclude
    the use of certain transformations on a production scale. On the grounds of safety,
    the use of toxic or hazardous reagents and radical-based reactions are avoided
    due to problems associated with reaction control. As such, to date, the industry
    has overcome these problems through the use of alternative reagents and reaction
    pathways; however, via the novel reaction methodology these reagents and techniques
    can be used safely and efficiently.


    With this in mind, Odedra et al. (2008) evaluated the use of tris(trimethylsilyl)silane
    61 as an effective reducing agent, replacing the highly toxic reagent tin hydride,
