    # Abstract


    The difficulty of preparing nanomaterials in a controlled, reproducible manner
    is a key obstacle to the proper exploitation of many nanoscale phenomena. An automated
    chemical reactor capable of producing (on demand and at the point of need) high-quality
    nanomaterials, with optimized physicochemical properties, would find numerous
    applications in nanoscale science and technology, especially in the areas of photonics,
    optoelectronics, bio-analysis, and targeted drug-delivery. In addition such a
    device would find immediate and important applications in toxicology, where it
    is essential to characterize the physiological effects of nanoparticles not only
    in terms of chemical composition but also in terms of size, shape, and surface
    functionalization. In this chapter, we describe recent advances in the development
    of microfluidic reactors for


