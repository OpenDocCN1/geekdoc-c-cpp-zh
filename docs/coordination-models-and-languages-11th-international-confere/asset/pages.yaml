    # ## 2.2 Applications of microplasma reaction technology


    Novel applications have been developed from the combination of microreactor technology
    and nonequilibrium microplasma chemistry. Here we discuss a selection from the
    recent literature on this topic to illustrate several main trends. We will focus
    on microplasmas in confined microchannels for the purpose of chemical synthesis
    and environmental applications.


    # ### 2.2.1 Nanostructure synthesis in microplasma reactors


    Synthesis of nanostructures using microplasma reactors is an attractive method
    since decomposition of the source material and subsequent crystal nucleation can
    be performed in the high-density nonequilibrium plasma within time intervals on
    the order of milliseconds. For example, Sankaran et al. (2005) synthesized silicon
    nanoparticles, 1–3 nm in diameter, from a mixture of argon/silane in a continuous
    flow atmospheric pressure microplasma reactor. Their technique is based on high
    pressure microdischarges with very short operation time (μs–ms). Microdischarges
    were created in a hollow cathode, which consists of a stainless-steel capillary
    tube with 180 μm ID (inner diameter) and extended toward an anode, a metal tube
    with 1 mm ID, as shown in Figure 7. Using a direct current microplasma which was
    sustained at 300–500 V and 3–10 mA, silicon nanoparticles were produced as an
    aerosol around atmospheric pressure. Since this microreactor operates at low powers
    (5–10 W) in plasma volumes less than 1 μl, resulting power densities were as high
    as 10 kW cm−3. Such a high-density plasma allows fast plasma processing for the
    synthesis of blue luminescent silicon nanoparticles. The high density of energetic
    electrons in the microdischarges efficiently decomposed the gaseous precursor
    to produce radicals in the reaction zone. At a radical concentration high enough
    for nucleation, nanoparticles can start to grow in the microplasma. When the particles
    are removed by the gas flow from the discharge zone to a zone with a low concentration
    of radicals, particle growth will stop. An additional feature of the system is
    that particle charging in the microplasma reduces coagulation downstream of the
    reaction zone. Using the'
