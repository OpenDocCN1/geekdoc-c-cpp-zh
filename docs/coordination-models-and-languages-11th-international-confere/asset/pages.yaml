    # ## 2.2 Thermal control


    Through the examples discussed thus far it can be seen that reaction times can
    be dramatically reduced as a result of moving from a batch vessel to a microreactor,
    typically seconds or minutes, a feature that can be attributed to the increased
    mixing efficiency and excellent thermal control obtained through the efficient
    dissipation of heat generated during a reaction. This makes microreactors ideal
    vessels to perform reactions that are temperature sensitive, along with those
    that are highly exothermic and would prove too hazardous to be performed batchwise.
    In addition, in the case of those reactions that require activation, thermal control
    is required in order to heat the microreactors and as the following section illustrates,
    this has been achieved by the use of thermal jackets, baths, and microwave irradiation.


    # ### 2.2.1 Increased reaction temperature and pressure


    van Meene et al. (2006) demonstrated the ability to conduct reactions above room
    temperature within a microreactor, reporting the synthesis of α-aminophosphonates
    via the Kabachnik–Fields reaction (Scheme 6). Using a stainless-steel flow reactor,
    maintained at 50°C, the authors found that employing a residence time of 78 min
    (600 μl min−1) afforded quantitative conversion of the aldimine 23 to the respective
    α-aminophosphonate 24 and after subjecting the reaction products to an off-line
    acid-base extraction, an isolated yield of 94% 24 was obtained. Under the aforementioned
    reaction conditions, a further four derivatives were synthesized, with isolated
    yields ranging from 68 to 91%.


    Compared to conventional batch protocols, where catalysts such as LiClO4 and InCl3
    are frequently employed, the continuous flow approach proved advantageous as the
    reaction was conducted in the absence of a catalyst and without the need for lengthy
    reaction times, maintained at reflux.


    ![](img/5c3cdcd9b21d4d4e9da6d42180679a02_117_0.png)'
