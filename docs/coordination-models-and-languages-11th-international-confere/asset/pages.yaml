- pgno: 8
  md: 'operations and continuous-flow chemical processing. The general methodology
    has enabled analysis, synthesis, and construction of biochemical systems on microchips,
    and these microsystems have demonstrated superior performance (i.e., rapid, simple,
    and highly efficient processing). Microchemical technology has now entered the
    phase of practical application. In this chapter, we discuss general methods, and
    applications of micromixical systems on microchips.


    # 1. **INTRODUCTION**


    Integrated microchemical systems are essential tools for high-speed, functional,
    and compact instrumentation used for analysis and synthesis, biological sciences,
    and technologies. In the 1990s, most microchip-based systems were used for gene
    or protein analysis and employed electrophoretic separation with laser-induced
    fluorescence detection (Auroux et al., 2002; Reyes et al., 2002). However, other
    analytical and synthesis methods were required for more general analytical, combinatorial,
    physical, and biochemical applications that involve complicated chemical processes,
    organic solvents, neutral species, and nonfluorescent molecule detection. For
    these applications, general microintegration methods on microchips became quite
    important.


    General methods for microintegration of chemical systems that are similar to systems
    used in electronics have been developed (Figure 1). Instead of the resistor, capacitor,
    and diode, mixing, extraction, phase separation, and other unit operations of
    chemical processes are integrated as components. These unit operations are known
    as microunit operations (MUOs), and like the parts of an electric circuit. They
    can combine with one another in parallel and in serial by continuous-flow chemical
    processing (CFCP). The function of the microchemical chip is analogous to that
    of a chemical central processing unit. In order to realize these basic concepts,
    fluidic control methods are quite important, and parallel multiphase microflows
    were realized by partial surface modification and channel structures which enabled
    various MUOs and flexible integration of the MUOs connected by CFCP. This technique
    has demonstrated superior performance in shorter processing times (from days or
    hours to minutes or seconds), smaller sample and reagent volumes (down to a single
    drop of blood), easier operation (from professional to personal), and smaller
    system sizes (from 10 m chemical plants to desktop plants to mobile systems) compared
    to conventional analysis, diagnosis, and global synthesis systems. Practical prototype
    systems have also been realized in environmental analysis, clinical diagnosis,
    cell analysis, gas analysis, medicine synthesis, microparticle synthesis, and
    so on. For example, a'
  merge: -1
  img_proc: true
- pgno: 9
  md: '![](img/5c3cdcd9b21d4d4e9da6d42180679a02_9_0.png)


    **Figure 1**  A microchemical chip system compared with an electronic system.


    portable microELISA (enzyme-linked immunosorbent assay) system was recently constructed
    where the analysis time was several minutes, rather than several hours as in the
    conventional technique. The sample volume (5 μl) was also considerably smaller
    than the volume (several milliliters) required for conventional diagnosis. In
    addition, the operation itself was much easier, and its correlation with conventional
    methods was confirmed with real blood samples. These features are promising for
    point-of-care (POC) clinical diagnosis.


    Microtechnology is moving in two directions. The first is the practical application.
    Although some practical prototype systems have been realized, attaining long-term
    stability in parallel liquid/liquid and liquid/gas microflows can be sometimes
    problematic, and the interfaces are distorted. For robust fluidic control, methods
    for stabilizing or recovering parallel multiphase microflows are essential. For
    microfluidic devices, the ability to process small (nanoliter to microliter volume)
    samples and to interface with microchips is important. In addition, smart fluidic
    devices (valves or pumps) for flexible and reliable liquid handling on microchips
    are required for more complex and high-throughput chemical processing on microchip.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'The second direction involves new science in nanoscale (10–1,000 nm) space,
    called as extended nanospace. The extended nanospace is an important region in
    bridging the gap between single molecules and the condensed phase. Recently, general
    methodologies in microspace were applied to extended nanospace demonstrating that
    the basic methodologies in microspace are applicable to extended nanospace. Water
    displays remarkably different properties in the extended nanospace channel. A
    model fundamentally related to the surface chemistry of the nanospace was proposed.
    This model was applied to protein analysis of a countable number of molecules,
    and the same type of integrated approach (extended nanospace channels embedded
    in microfluidic systems) was applied to control and analysis of cell immobilization
    and culture.


    Here, we introduce these basic methodologies and applications. Firstly, the general
    concepts (MUO and CFCP) for microintegration in Chapter 2, and fluid control methods
    to support the MUO and CFCP in Chapter 3 are discussed.


    # 2. DESIGN AND CONSTRUCTION METHODOLOGY FOR INTEGRATION OF MICROCHEMICAL SYSTEMS


    Integrated microchemical systems are expected to be applied in various fields.
    In order to realize general analytical, combinatorial, physical, and biological
    applications, general microintegration methods on microchips are quite important.
    Conventional macroscale chemical plants or analytical systems are constructed
    combining unit operations such as mixer, reactors, and separators. Similar methodology
    can be applied to the microchemical systems. By combining MUOs with different
    functions in series and in parallel, various chemical processes can be integrated
    into microchips through use of a multiphase microflow network such as that shown
    in Figure 2. This methodology is termed CFCP (Tokeshi et al., 2002). Miniaturizing
    conventional unit operations is often not effective and sometimes does not work
    at all, because many physical properties (e.g., heat and mass transfer efficiency,
    specific interfacial area, and vanishingly small gravity force) are significantly
    different in microspace. Therefore, novel MUOs taking these issues into account
    are needed. Kitamori and colleagues have developed MUOs for various purposes,
    such as mixing and reaction (Sato et al., 1999; Sorourdadin et al., 2000, 2001),
    phase confluence and separation (Aota et al., 2007a, 2007b; Hibara et al., 2002,
    2003; Hisamoto et al., 2001a, 2001b, 2003; Hotokezaka et al., 2005; Kikutani et
    al., 2004; Minagawa et al., 2001; Miyaguchi et al., 2006; Sato et al., 2006b;
    Smirnova et al., 2006, 2007; Surmeian et al., 2001, 2002; Tokeshi et al., 2000a,
    2000b), solvent extraction (Aota et al., 2007a, 2007b; Hibara et al., 2001, 2003;
    Hisamoto et al., 2001a, 2001b; Hotokezaka'
