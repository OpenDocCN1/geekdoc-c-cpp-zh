    # 2.3.2 Trimethylaluminum


    The pyrophoric nature of trimethylaluminum (AlMe<sub>3</sub>) 71 and the instability
    associated with the aluminum–amide intermediates make AlMe<sub>3</sub> 71 difficult
    to handle safely at scale, as such its use is precluded for the large-scale synthesis
    of amides. The ease of reactant manipulation obtained through the use of microreactors,
    however, affords the potential to use such reagents for the continuous flow synthesis
    of amides, providing a practical route to their use in large-scale production.
    Performing reactions on an 8.0 mmol scale, later increased to 0.2 mol, Ponten
    et al. (2008) demonstrated the continuous flow synthesis of an array of amides,
    derived from a series of methyl or ether esters and benzylamine 20; attaining
    excellent isolated yields as illustrated in Table 9.


    In addition to the examples provided, the authors also demonstrated the use of
    anilines and aliphatic amines as substrates, reporting isolated yields ranging
    from 65 to 98% (see Section 3), whereby this methodology is demonstrated for the
    synthesis of the pharmaceutically important molecules rimonabant (72) and epavopraxil
    (73) (Schemes 65 and 66, respectively).


    # 2.3.3 The use of butyllithium in microreactors


    The reaction of organolithium compounds with carbon-based electrophiles represents
    one of the most useful synthetic methodologies for the formation of C–C bonds;
    as such, several groups have investigated these reactions in microstructured devices.'
