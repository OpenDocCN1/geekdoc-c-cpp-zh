    # ## Abstract


    The use of electric fields in chemistry is considered an important concept of
    process intensification. The combination of electricity with chemistry becomes
    particularly valuable at smaller scales, as they are exploited in microreaction
    technology. Microreactor systems with integrated electrodes provide excellent
    platforms to'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'investigate and exploit electric principles as a means to control, activate,
    or modify chemical reactions, but also preparative separations. One example which
    is discussed in detail in this chapter is a microplasma, which allows chemistry
    at moderate temperatures with species which have a reactivity comparable to that
    at very high temperatures, with potential advantages in energy efficiency. Another
    highlighted topic is electrokinetic control of chemical reactions, which requires
    the small scale to operate efficiently. Electrokinetic concepts can be used to
    control fluid flow, but also to transport or trap particles and molecules. Several
    less known concepts like electric wind, electric swing adsorption, electrospray,
    and pulsed electric fields, are discussed, as well as examples of their application.
    Novel principles to control adsorption and desorption, as well as activity and
    orientation of adsorbed molecules are described, and the relevance of these principles
    for the development of new reactor concepts and new chemistry are discussed.


    # 1. INTRODUCTION


    # 1.1 Where chemistry meets electricity


    The combination of chemistry and electricity is best known in the form of *electrochemistry*,
    in which chemical reactions take place in a solution in contact with electrodes
    that together constitute an electrical circuit. Electrochemistry involves the
    transfer of electrons between an electrode and the electrolyte or species in solution.
    It has been in use for the storage of electrical energy (in a galvanic cell or
    battery), the generation of electrical energy (in fuel cells), the analysis of
    species in solution (in pH glass electrodes or in ion-selective electrodes), or
    the synthesis of species from solution (in electrolysis cells).


    However, there are many other options to combine electricity with chemistry. One
    that has been studied intensively for a variety of different applications is *plasma
    chemistry* (see Fridman, 2008 for a recent overview). A plasma is a partially
    ionized gas, in which a certain percentage of the electrons is free instead of
    bound to an atom or molecule. Because the charge neutrality of a plasma requires
    that plasma currents close on themselves in electric circuits, a plasma reactor
    shows resemblance to an electrochemical cell, although due to the much lower ionization
    degree and conductivity, a plasma discharge will typically be operated in the
    range of hundreds of volts, compared to a few volts in the case of an aqueous
    electrochemical cell.


    An increasing number of industrial and commercial examples of plasma technology
    exist. Typical *low-pressure* discharge examples are certain types of light sources,
    including plasma display panels, and microfabrication processes for integrated
    circuit manufacturing, like sputtering, reactive ion etching and plasma-enhanced
    chemical vapor'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'deposition (CVD). Arc discharges, in which a high power thermal discharge of
    very high temperature (~10,000 K) is generated, are typical examples of *atmospheric
    pressure plasmas*. Arc discharges are applied in metallurgical processing and
    welding. Another example of atmospheric plasma is a corona discharge, which is
    a non-thermal discharge generated by the application of a high voltage to sharp
    electrode tips. This discharge is used in ozone generators and particle precipitators.


    Of particular interest is a dielectric barrier discharge (DBD). This is a nonthermal
    atmospheric pressure discharge generated by the application of high voltages,
    in which an *insulator coating* prevents the transition of the plasma discharge
    into an arc. The process uses a high voltage alternating at kHz to GHz frequencies.
    Operation at atmospheric pressure is made possible by a *small gap between the
    electrodes*, from 0.1 mm in plasma displays and 1 mm in ozone generators to several
    cm in CO2 lasers. Thus, although DBD is applied at large scale, for example, in
    the surface functionalization of synthetic fabrics and plastics to improve adhesion
    of paints and glues (Leroux, 2006, 2008), due to the small gap required it is
    typically performed in *microsystems*. Furthermore, DBD, besides the possibility
    to work without the vacuum which is needed for most other plasma processes, operates
    at *low gas temperatures*, which is the reason why it has become a relevant technique
    for synthetic purposes. Chemistry in *microplasma devices* will be the main topic
    elaborated in this chapter.


    The above combinations of electricity with chemistry deal with the generation
    of charged species in either a gas or a liquid medium. This requires ionization,
    which occurs by electron transfer and transport of charged species in a closed
    electrical circuit. The charged species themselves, or the radicals generated
    by them (e.g., radicals generated by electron impact in the gas phase, in a plasma)
    can be used as activated species taking part in chemical reactions.


    On the other hand, one may also use the charges to *enhance mass transport*, either
    by transporting the chemical species themselves (if they carry a charge), or by
    transporting the medium in which the chemical species are contained. This *electrokinetic
    transport* exists in different forms: *electrophoresis* is the movement of charged
    particles in an electric field due to an electrostatic Coulomb force which drags
    them through the medium toward an oppositely charged surface, *electroosmosis*
    is the motion of a polar liquid along charged surfaces under the influence of
    an electric field, and *dielectrophoresis* (DEP) is based on a force exerted on
    a (not necessarily charged) dielectric particle subjected to a non-uniform electric
    field. *Electrowetting-on-dielectric*, or EWOD, can be used to induce a flow of
    liquid droplets on a surface or in a channel, where the droplets are pulled toward
    the region with high electric field. All these'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'electrokinetic principles work best in microsystems, and will be discussed
    in this chapter for cases in which they are combined with synthetic chemistry.


    Finally, one may use charging or polarization of *surfaces*, induced by external
    electric fields, to control the adsorption and desorption of molecules and the
    state of these adsorbed molecules, in order to control their chemical reactivity.
    This is an upcoming field that has not yet been explored to its fullest potential.
    It involves aspects of *nanotechnology* and *nanoscience*, like the fabrication
    of structures of several nanometers and stimuli generated by scanning tunneling
    microscopic probes. The outcome of the research in this field is generally of
    a fundamental nature. The topic of electronic control of reactions at surfaces
    will be discussed in the last section of this chapter.


    # ## 1.2 When chemistry and electricity meet in a narrow alley


    The advantages of *microreaction technology* and its establishment as a concept
    of process intensification have been highlighted many times before in literature,
    and instead of repeating that matter here, we would like to refer the reader to
    the many excellent reviews and monographs that have appeared over the last decade
    (Hessel et al., 2004, 2009; Jähnisch et al., 2004; Jensen, 2001; Kolb et al.,
    2007; Yoshida, 2008). In cases where microreaction technology involves electricity
    as a mechanism of activation or manipulation of chemical species (the use of electric
    fields in chemistry on its own is already considered a valuable process intensification
    concept, see Stankiewicz and Moulijn, 2000), the advantages of the small scale
    lie mainly in the shorter distances for mass transport or in the smaller gaps
    over which electrical fields can be applied. A typical example is, as mentioned
    before, a microplasma device, in which the small electrode gap allows atmospheric
    plasma chemistry, which is a result of the fact that although the lifetime of
    electrons in the gap space is limited because of the dense gas, they still live
    long enough to excite a significant amount of species. In addition to that, a
    small gap allows the use of lower voltages to obtain the same electric field strength.
    Other advantages of the combination of microreaction technology with electrical
    fields are the large surface-to-volume ratio and the possibility to integrate
    electrodes at relevant positions in the microreactor device.


    In this chapter the focus will be on the application of electrical fields in microreactors,
    and the potential of such systems for chemical synthesis will be outlined. The
    end of the chapter will give an overview of less-studied concepts, like electronic
    control of surface chemistry, and will discuss the opportunities offered by nanotechnology
    for achieving such control.'
