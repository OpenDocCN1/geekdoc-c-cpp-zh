    achieved through the use of microreaction technology.


    # ### 2.3.5 Exothermic reactions


    Along with the challenges associated with the handling and use of large volumes
    of hazardous or toxic materials, the scale-up of exothermic reactions can also
    be problematic due to the difficulties associated with the efficient removal of
    heat generated. With this in mind, Schwalbe et al. (2004) evaluated the Paal–Knorr
    synthesis under continuous flow (Scheme 27). Due to the exothermic nature of the
    reaction, when adding ethanolamine 106 to acetoacetone 107 in batch, it was necessary
    to add the reagents over an extended period of time; consequently, even though
    the reaction was rapid, the dropwise addition of the reactants increased the reaction
    time considerably. In comparison, performing the reaction in a stainless-steel
    continuous flow reactor, with a residence time of 5.2 min, the authors were able
    to employ neat reactants to afford the target pyrrole 108 in 91% yield in a throughput
    of 260.0 g h−1.


    # ## 2.4 The incorporation of catalysts into microreactors


    Having demonstrated the many practical advantages associated with the use of miniaturized
    continuous flow reactors for catalyst free, or homogeneous reactions, the following
    section focuses on the additional advantages that can be obtained through the
    use of heterogeneous catalysts, biocatalysts, reagents, and scavengers within
    such devices.


    ![](img/5c3cdcd9b21d4d4e9da6d42180679a02_141_0.png)


    **Scheme 27** Exothermic Paal-Knorr reaction conducted in a CYTOS flow reactor.'
