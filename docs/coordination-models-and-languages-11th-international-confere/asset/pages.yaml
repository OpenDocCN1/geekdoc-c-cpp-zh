  md: '![](img/5c3cdcd9b21d4d4e9da6d42180679a02_23_0.png)


    **Figure 11** Illustration of two-phase microflows. Phases I and II have viscosities
    of \(\mu^I\) and \(\mu^{II}\), and widths of \(a\) and \(b\), respectively.


    In order to obtain the stress for phases I and II, integral calculus of Equation
    (4) is expressed as


    $$

    \tau_{zx}^I = \frac{\Delta P}{L} x + C_1^I \\

    \tau_{zx}^{II} = \frac{\Delta P}{L} x + C_1^{II}

    \tag{6}

    $$


    where \(C_1\) is constant and superscripts I and II mean phases I and II. Here,
    continuity of shear stress is assumed as a boundary condition. Namely,


    $$

    \tau_{zx}^I = \tau_{zx}^{II} \text{ at } x = 0

    \tag{7}

    $$


    By substituting Equation (6) with Equation (7), the following relationship is
    obtained.


    $$

    C_1^I = C_1^{II} = C_1

    \tag{8}

    $$


    Here, Newton''s law of viscosity is used,


    $$

    \tau_{zx} = \mu \frac{dv_z^{II}}{dx}

    \tag{9}

    $$


    where \(v_z\) is flow velocity in the z-direction. By using Equations (6)–(9),
    the velocities of phases I and II, \(v^I\) and \(v^{II}\), are expressed as


    $$

    \begin{aligned}

    v_z^I &= \frac{\Delta P}{2\mu^I}x^2 + \frac{C_1}{\mu^I}x + C_2^I \\

    v_z^{II} &= \frac{\Delta P}{2\mu^{II}}x^2 + \frac{C_1}{\mu^{II}}x + C_2^{II}

    \end{aligned}

    \tag{10}

    $$'
