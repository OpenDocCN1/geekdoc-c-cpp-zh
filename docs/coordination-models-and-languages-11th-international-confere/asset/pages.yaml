    Multiphase microflows are dominated by pressures (Aota et al., 2007a, 2009a).
    One important parameter needed to describe the multiphase microflows is the pressure
    that drives the fluids. The pressure decreases in the downstream part of the flow
    because of the fluids’ viscosity. When two fluids in contact with one another
    have different viscosities, the pressure difference (ΔP_Flow) between the two
    phases is a function of the contact length and the flow velocity. Another important
    parameter is the Laplace pressure (ΔP_Laplace) caused by the interfacial tension
    between two phases. The position of the interface is fixed within a point in the
    microchannel by the balance established between the ΔP_Laplace and ΔP_Flow.


    Figure 13a illustrates the pressure balance at the liquid–liquid interface of
    the two-phase microflows. The liquid–liquid interface curves toward the organic
    phase on a glass surface because of the hydrophilicity of the glass. ΔP_Laplace
    is generated at the curved liquid–liquid


