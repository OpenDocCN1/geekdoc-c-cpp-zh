    # ### 4.3 Electrowetting-on-dielectric


    The use of droplets as microreactors has been discussed already many years ago
    (Fjäll, 1993), but the combination with microfluidic networks which give control
    over individual droplets and their composition has brought upon a completely new
    field of research, which, since it works with discrete liquid packets, may also
    be referred to as *digital microfluidics*. Digital microfluidics shows a clear
    analogy with traditional benchtop protocols, and a wide range of established chemical
    protocols can seamlessly be transferred to a picoliter to nanoliter droplet format.
    *Electrowetting*, that is, the change in surface tension caused by an electric
    field (Berge, 1993), DEP, and immiscible liquids in pressure-driven flow are the
    three most commonly used principles used to generate and manipulate the droplets
    in a digital microfluidic device.


    EWOD is used to control the flow of liquid droplets on a surface or in a channel
    and works both with droplets in air, with droplets of a liquid immiscible with
    the surrounding liquid (e.g., water-oil combinations), and even with air bubbles
    in a liquid (Zhao and Cho, 2007). Typically, in an electrowetting device, a voltage
    of 50–100 V is applied across a 1-μm-thick insulator, which causes the contact
    angle of an aqueous solution on a hydrophobic surface to decrease from ~115° to
    ~75°. But by using a very thin (70 nm) and high dielectric constant (~180) material,
    only 15 V are needed to give about the same contact angle change (Moon, 2002).
    The theory of EWOD has been discussed in detail in recent reviews (Mugele, 2009;
    Mugele and Baret, 2005), and for an overview of applications of droplet microfluidics,
    including EWOD, we refer to another recent review (Teh et al., 2008).'
