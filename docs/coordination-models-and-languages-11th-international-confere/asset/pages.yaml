- pgno: 235
  md: 'More specifically, the described approaches for reaction automation represent
    an important first step toward both simplifying and automating the process of
    nanoparticle production, but there is still considerable scope for improvement.
    To date, we have applied our approaches to a relatively small number of nanoparticle
    syntheses using very simple chemical routes. However, some extremely sophisticated
    chemical syntheses have been developed in recent years that are capable of producing
    near defect-free nanoparticles of extremely high monodispersity, and it will be
    important to adapt and apply our automation procedures to these synthesis routes
    also. In addition, although in this chapter we have focused on the synthesis of
    fluorescent quantum dots, the general strategy we describe has wider applicability
    to any particles whose properties can be monitored (directly or indirectly) inline.
    In the case of nonfluorescent dots and rods, dynamic light scattering is likely
    to provide an especially effective tool for controlling the size, shapes, and
    dispersity of the particles. As mentioned above, careful design of the control
    algorithms is crucial to achieving effective automation, and considerable scope
    exists for achieving further efficiency and control through improved algorithm
    design. Notwithstanding these challenges, we consider the general approach outlined
    above to offer a powerful route to the automated production of optimized nanoparticles
    which has the potential to transform the efficacy of nanoparticle synthesis in
    terms of control, yield, and ease-of-use.


