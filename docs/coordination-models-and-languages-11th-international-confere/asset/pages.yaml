  md: '![](img/5c3cdcd9b21d4d4e9da6d42180679a02_118_0.png)


    Tanaka et al. (2007) recently demonstrated the use of an IMM micromixer for an
    investigation into the development of a continuous flow method for the dehydration
    of β-hydroxyketones to the target unsaturated products, as depicted in Scheme
    7. A typical protocol involved the introduction of 4-hydroxy-5-methylhexan-2-one
    25 (1 × 10−2 M) and p-TsOH·H2O 12 (1 × 10−2 M) in dioxane into the micromixer,
    the reaction mixture was then heated in a microchannel prior to quenching the
    resulting reaction mixture with aq. NaOH 26 (1.0 M). Using this approach, the
    authors found the optimal reaction conditions to be a residence time of 47 s (200
    μl min−1) and a reaction temperature of 110 °C, which afforded the target alkene
    27 in quantitative yield. In comparison, batch reactions typically afforded a
    respectable 71% yield; however, the product 27 was accompanied by a large proportion
    of by-products. Compared to previous batch methodology, the continuous flow approach
    provides a facile approach for the dehydration of β-hydroxyketones and as discussed
    in Section 3. (Scheme 7), enables production quantities of synthetically useful
    material to be generated with ease.


    One approach that is becoming more common within research laboratories, and proves
    impractical when considering the need to scale a process, is the activation of
    reactions by employing high temperatures and pressure. However through the use
    of microreaction technology, such reaction conditions can be employed safely and
    with ease, as the high-temperature/pressure regime recently employed by Hessel
    et al. (2005) for the Kolbe–Schmitt reaction of resorcinol 28, to afford 2,4-dihydroxybenzoic
    acid 29 (Scheme 8) demonstrates. As the reaction is industrially relevant, potassium
    hydrogen carbonate 30 was selected as it is a cheap, readily available raw material
    making it feasible to use in the large-scale synthesis of 29 (100–1,000 h−1);
    furthermore, water was selected as the reaction medium as it is a safe and inexpensive
    solvent.


