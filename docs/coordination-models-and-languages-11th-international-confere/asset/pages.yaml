  md: '![](img/5c3cdcd9b21d4d4e9da6d42180679a02_221_0.png)


    **Figure 15** Schematic illustrating the concept of a simplex. A simplex is a
    geometric shape formed from N + 1 vertices in an N-dimensional space. Hence, for
    one-, two- and three-dimensional spaces, the simplex points comprise the vertices
    of a line, triangle, and tetrahedron, respectively. The simplices can move through
    their respective spaces by undergoing repeated reflections and/or changes of shape
    (see main text).


    There are very few minimization routines that satisfy all of these conditions
    (i.e. that can perform constrained optimisation of expensive noisy black-box functions),
    and it is only in the past few years that effective algorithms have started to
    emerge. One promising technique, developed originally for noise-free optimization,
    is the simplex method (Kolda et al., 2003). A simplex is a geometric shape formed
    from N + 1 distinct points (vertices) in an N-dimensional space. This is shown
    in Figure 15a–c for one-, two-, and three-dimensional spaces, where it can be
    seen that the simplex points comprise the vertices of a line, triangle, and tetrahedron,
    respectively. In the most basic form of simplex optimization, the value of the
    function is evaluated at each of the vertices and the simplex is repeatedly reflected
    away from the worst vertex. This is illustrated in Figure 16 for the illustrative
    two-dimensional function f(x,y) = x^2 − 4x + y^2 − y − xy. With each successive
    reflection, the simplex moves progressively closer to the minimum at (3,2). The
    simplex ceases to make progress at the 28th iteration (T28). The reason is straightforward.
    Vertex A has a larger function value than B and C and is therefore reflected to
    D. The new vertex D also has a larger value than B and C and at the next reflection
    is reflected back to A. The simplex therefore oscillates between ABC and BCD and
    makes no further progress toward the minimum. The premature “stalling” of the
    search is a limitation of the simple “reflective-simplex” approach, and the procedure
    can be improved substantially by using an “adaptive-simplex” that changes its
    size and shape according to the shape of the local terrain. This has two key advantages
    as illustrated in Figure 17: (1) the simplex can expand in size when moving through
    flat uninteresting terrain, which improves the efficiency of optimization, and
    (2) once it is close to the location of the optimum, it can start to contract,
    which improves the accuracy of the final solution. For the situation considered
    in Figures 16 and 17, after just 10 iterations the adaptive simplex is closer
    to the minimum than the reflective simplex was after 28.'
