    The above results confirm the feasibility of automating the process of nanoparticle
    synthesis using simplex-based optimization routines. The approach we outline provides
    a promising starting point for developing more sophisticated systems that can
    be used to control a whole variety of nanoparticle properties, including shape,
    chemical composition, crystal structure, optical properties, and chemical reactivity.
    In passing, we note that—since the simplex converges on the optimum though a series
    of'
