    # 2.2.3 Microimmunoassay


    Immunoassay is one of the most important analytical methods for clinical diagnosis.
    Heterogeneous immunoassay is a particularly popular approach, wherein captured
    antibodies or antigens fixed on a solid surface react with serum target antigens
    or antibodies. Labeled secondary antibodies then capture the targets, and the
    target amounts are quantified by detecting the labels. Heterogeneous immunoassay
    features easy and accurate bound-free separation, which is important for improving
    limit of detection (LOD). Shortening analysis time is necessary when dealing with
    smaller samples and reagent volumes, given increasing demand in POC diagnosis.
    In conventional methods, a microtiter plate well (typically 0.65 mm in diameter)
    is used, and the specific interfacial area for 50 μl volumes is 13 cm⁻¹. However,
    when a microchannel (200 μm deep and 200 μm wide) is utilized for immobilizing
    the antibodies (antigens), the interfacial area, which affects the reaction time
    and efficiency, increases to 200 cm⁻¹.


    Kitamori et al. have reported the first successful integration of ELISA into a
    microchip (Kakuta et al., 2006; Sato et al., 2000a, 2001, 2003, 2004). They developed
    a new MUO for the heterogeneous reaction through the use of bead-packed microchannels
    (Figure 6). They immobilized antibodies (antigens) on the bead surface via physisorption
    or chemisorption. After immobilization, the authors applied a bovine serum albumin
    or MPC (2-methylacryloyloxyethyl phosphorylcholine) polymer coating to minimize
    nonspecific adsorption. A microbead suspension with captured antibodies was introduced
    and stopped at a microchannel dam structure (with a 10 μm gap), and a 5–10-mm-long
    area of packed beads area was formed. The target sample solution was introduced
