    for the synthesis of ascaridole 196 (Scheme 58). To perform the reaction, a methanolic
    solution of α-terpinene 197 and Rose Bengal (198) (photosensitizer) was introduced
    into the reactor at a flow rate of 1 mL min⁻¹, where it was mixed with a constant
    stream of oxygen (15 μL min⁻¹), prior to irradiation with a 20 W tungsten lamp.
    As a safety precaution, the reaction products were degassed with nitrogen in order
    to prevent the accumulation of oxygenated solvents. Using the aforementioned protocol,
    the authors report 85% conversion of α-terpinene 197 to ascaridole 196, demonstrating
    efficient photon transfer using a commercially available light source.


    Another interesting photochemical transformation conducted in a microfabricated
    reactor, was the photochemical chlorination of toluene-2,4-diisocyanate reported
    by Ehrich et al. (2002). Employing a falling film microreactor [channel dimensions
    ≈ 600 μm (wide) × 300 μm (deep) × 6.6 cm (long)], consisting of 32 parallel microchannels,
    the authors investigated the photochemical generation of chloride radicals from
    gaseous chlorine using tetrachloroethane as the reaction solvent. By varying the
    flow rate of chlorine (14–56 mL min⁻¹) and toluene-2,4-diisocyanate (0.1–0.6 mL
    min⁻¹) feeds and the reactor temperature, the authors were able to optimize the
    production of benzyl chloride-2,4-diisocyanate. Employing a residence time of
    just 9 s and a reactor temperature of 130 °C, afforded benzyl chloride-2,4-diisocyanate
    in 81% yield with a space time yield of 401 mol h⁻¹, which far exceeds the throughput
    of 1.3 mol h⁻¹ attained in a conventional batch reactor.


