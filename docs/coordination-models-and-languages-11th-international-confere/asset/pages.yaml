    many times in literature, and has become a very valuable concept for coupling
    microreactors and other (analytical) microdevices to a mass spectrometer (Le Gac
    and van den Berg, 2009).


    Electrospray has been used for many different applications, such as the deposition
    of paints and coatings on metal surfaces and the deposition of metal nanoparticles
    and biomolecules on biosensor surfaces, and in a miniaturized version also as
    a propulsion mechanism in microsatellites (see also the section on electric wind).
    One particularly interesting application is in *fuel atomization*, that is, a
    finer fuel aerosol and atomization will give a higher combustion efficiency and
    less pollutant emission, which is caused by the effect that finer droplets increase
    the total surface area on which combustion can start (Lehr and Hiller, 1993).


    There has been a claim of another useful effect of electric fields on fuels, that
    is, an electric charge on a fuel tube is said to reduce fuel viscosity, so that
    fuel injectors will create smaller droplets, which enables cleaner and more efficient
    combustion. The principle is that molecules in the fuel become charged and aggregate,
    reducing their overall surface area, thereby decreasing the viscosity (Tao et
    al., 2008). The paper by Tao et al. received serious criticism, where the criticism
    is that, although the application of an electric field might indeed reduce fuel
    viscosity and lead to finer atomization, there is no proof that finer atomization
    would improve combustion efficiency by 20%, while it is also stated that the earlier
    “claims and conclusions violate the first law of thermodynamics” (Gulder, 2009).
    This, as might be expected, is rebutted by the authors of the first paper (Tao
    et al., 2009). Nevertheless, this idea may become a topic with a high impact,
    and surely deserves further research.


