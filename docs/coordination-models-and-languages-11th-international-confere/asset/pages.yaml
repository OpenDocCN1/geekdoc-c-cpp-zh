- pgno: 98
  md: 'solvent as a continuum dielectric medium. A typical example of the latter is
    the Derjaguin–Landau–Verwey–Overbeek theory, which includes screened Coulombic
    repulsions and van der Waals attractions between proteins and surfaces. This theory
    describes most of the essential features of protein adsorption (see also the work
    of Roth et al. described in the previous section), but due to the assumption of
    a spherical protein with a charged shell inherently is unable to describe orientation
    effects. Therefore a compromise is often taken between the two types of models,
    by considering, for example, an immunoglobulin protein as a Y-shaped object with
    located charge centers on its branches and Monte Carlo modeling it at the mesoscopic
    scale (Sheng et al., 2002). In accordance with experimental data on oriented adsorption,
    Sheng et al. have shown that orientation of the adsorbed protein is based on a
    balance of van der Waals and electrostatic interactions. Van der Waals attraction
    leads to molecules lying flat on the surface, while in electrostatically dominated
    adsorption the orientation is determined by the dipole of the molecule which generally
    leads to alignment perpendicular to the surface. Experimental methods to probe
    protein orientation on charged surfaces are SIMS (Secondary Ion Mass Spectrometry)
    (Wang et al., 2004) and, more directly, atomic force microscopy (Wang et al.,
    2006). The latter work is particularly interesting because it reports that carbonic
    anhydrase is oriented with the majority of its active sites facing upward on a
    positively charged surface, and downward on a negatively charged surface, which
    shows that in principle the activity (or at least the accessibility of active
    sites on the enzyme) is controllable by the charge on the surface, which can be
    controlled by setting a specific voltage to the electrode.


    An interesting effect of external electric fields on the selectivity of a homogeneous
    catalyst (an iron-oxo porphyrin compound) has recently been theoretically predicted
    (Shaik et al., 2004). The effect consists in changing the electronic structure
    of the catalyst in a field-direction-dependent manner. In doing so, the catalyst
    can be tuned either to epoxidation or to hydroxylation of propene. The electric
    field should be aligned along the SH–Fe–O axis of the molecule, which is in the
    direction perpendicular to the porphyrin ring. If the field is positive (i.e.,
    pointing from S to O) the catalyst will acquire a thiolate radical character,
    thereby favoring the hydroxylation process by 6–10 kcal mol⁻¹, while a negative
    field, turning the compound into a porphine radical cationic species, favors epoxidation
    by 2–6 kcal mol⁻¹. Although a very interesting concept, experimental proof for
    the validity of this work has not yet been presented. An important issue to solve
    for practical evaluation of this idea is that one needs to fix the molecule in
    some way with respect to the electric field, for example, by immobilizing it on
    a surface, but in such a way that the porphyrin ring is still accessible from
    both sides and also with such a link to the surface that the activity is not affected.
    This is not an easy'
