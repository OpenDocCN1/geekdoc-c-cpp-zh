  md: 'material, and in that sense it relates to the metal–support interaction discussed
    earlier. The configuration envisioned is that of Figure 27c, but with a counter
    electrode at some distance from the metal particle, and an electrode on the backside
    of the support, to create an electric field over the particle–support interface.
    The idea relies on literature reports stating that the metal–support interaction
    on oxides involves a change in the electronic properties of the metal particle,
    correlated to the electron richness of the oxygen atoms in the support (Mojet
    et al., 1999), which is determined primarily by the ionic character of the cations
    in the oxide. In basic supports with alkaline cations, oxygen atoms are electron-rich,
    while they are electron poor on acidic supports. Density functional theory calculations
    for supported platinum particles furthermore revealed that for higher electron
    richness of the support oxygen atoms the complete Pt density of states shifts
    to higher energy, that is, lower binding energy, while the location of the interstitial
    bonding orbital moves from the metal–support interface to the surface of the Pt
    particle, and that the insulator-to-metal transition, which occurs with increasing
    Pt nanoparticle size, shifts to lower particle size on basic supports (Oudenhuijzen
    et al., 2004). The latter implies that the proposed field effect should be more
    proficient for smaller metal particles, where it also has to be taken into account
    that both the crystal habit (i.e., which crystal faces are present on the metal
    nanoparticle; this may be different on a different support; Somorjai et al., 2006)
    and the possible presence of oxygen (surface or subsurface; Schalow et al., 2006)
    on the particle may play a role.


    Recent work demonstrates the feasibility of a somewhat similar concept as just
    described, based on a *semiconducting* SnO2 catalyst, fabricated in the shape
    of a *nanowire*, and configured as FETs (Zhang et al., 2004b, 2005). The electron
    density in the nanowire was adjusted electrically, and in this way oxidation and
    reduction reactions at the surface of the SnO2 wire could be modified by tuning
    the density of oxygen vacancies in the surface layer. This work is a very nice
    demonstration of the merger of different fields, that is, catalysis, nanotechnology,
    and microelectronics, and it would be quite feasible to combine this with microfluidics.
    It is quite possible that this is the direction in which the field of microreaction
    technology in future will develop.


    # ## 6. CONCLUSION


    In this chapter the use of electric fields as a means to control, activate, or
    modify chemistry in microreactor systems, and in some cases also in downstream
    work-up microsystems, was discussed. Particular attention was paid to microplasmas,
    in its many different configurations, because this is an upcoming field which
    allows us to perform chemistry at low'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'temperatures, which normally can only be performed at high temperatures, with
    possible advantages in energy efficiency. Novel configurations for plasma generation,
    based on nanostructured electrodes, were also highlighted. Special attention was
    also given to electrokinetic control of chemical reactions, a concept which only
    works efficiently in microsystems, because of the required localization of electric
    fields, and in some cases also the desired local high density of electric field
    lines. Electrokinetic concepts can be used to enhance or decrease fluid flow,
    or to transport and position or trap particles and molecules. A number of less
    known concepts (electric wind, electric swing adsorption, electrospray, and pulsed
    electric fields) were discussed, for which it remains to be seen if they will
    have relevance for microreaction technology. In the final section of this chapter
    some interesting principles to control the activity and orientation of adsorbed
    molecules, as well as the adsorption and desorption itself, were described. We
    predict that these principles will become very relevant in future microreaction
    technology, where the continuous progress in microsystems integration and in nanotechnology
    will allow us to combine new activation concepts with the beneficial high surface-to-volume
    ratio of microstructured systems to develop novel reactor and reaction concepts.


