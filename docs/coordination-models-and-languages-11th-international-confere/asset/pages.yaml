    is balanced with Laplace pressure when the two phases are separated. (b) When
    the pressure difference between the two phases is larger than the maximum Laplace
    pressure, the organic phase moves toward the aqueous phase. (c) When the pressure
    difference is lower than the minimum Laplace pressure, the aqueous phase moves
    toward the organic phase. Abbreviation: Aq., aqueous phase, Org., organic phase
