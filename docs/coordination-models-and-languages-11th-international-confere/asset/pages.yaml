    Because of the current great interest in alternative energy in general and artificial
    photosynthesis in particular, and possible future developments of microreactors
    designed to perform photosynthesis, the following work is also worth mentioning.
    Protein-mediated electron transfer plays a key role in photosynthetic or metabolic
    reactions in living organisms, where such reactions generate electrons with a
    relatively low reduction potential. It has been established that several electron
    transfer reactions are rate limited by conformational changes at interfaces, for
    example, at a protein–protein interface or across an electrode–protein interface.
    In a study on *cytochrome c* which was electrostatically bound on Ag electrodes
    coated with a self-assembled monolayer of carboxyl-terminated alkanethiols the
    effect of the electric field strength on the activation energy of interfacial
    redox process was determined (Murgida and Hildebrandt, 2002). By varying the alkyl
    chain length and therewith the protein–electrode distance, the field strength
    was controlled. A high electric field increases the activation barrier for the
    structural reorganization of the protein, and rearrangement of the hydrogen bond
    network becomes the rate-limiting process in the interfacial redox process. It
    is concluded that this *electric-field-induced change in the activation barrier*
    which controls interfacial electron transfer dynamics in the case of *cytochrome
    c* might represent the modulation of biological charge-transfer dynamics at cell
    membranes. In a more recent publication (Kranth et al., 2008) two-color, time-resolved,
    surface-enhanced resonance Raman spectroelectrochemistry was used to monitor simultaneously
    and in real time the structure, electron-transfer kinetics, and configurational
    fluctuations of cytochrome c electrostatically adsorbed to electrodes in the same
    manner as described above. It is found that the interfacial electric field controls
    protein dynamics, which in turn control the overall electron transfer.


    A controlled modification of the rate and selectivity of surface reactions on
    heterogeneous metal or metal oxide catalysts is a well-studied topic. Dopants
    and metal–support interactions have frequently been applied to improve catalytic
    performance. Studies on the electric control of catalytic activity, in which reactants
    were fed over a catalyst interfaced with ClO₂⁻, Na⁺, or H⁺-conducting solid electrolytes
