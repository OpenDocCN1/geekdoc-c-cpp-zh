    in the size and shape of the particles may lead to large variations in their properties
    and, by implication, their toxicity. Hence, in order to develop a detailed understanding
    of the toxic effects of a particular nanomaterial, it is important to study its
    toxicological behavior over the full range of sizes and shapes that are likely
    to be encountered in practical situations (rather'
  merge: -1
