- pgno: 229
  md: 'To be effective, the perturbations should be sufficiently small that the product
    is always of an acceptable quality yet sufficiently large that meaningful comparisons
    can be made between the different conditions.


    Xiong and Jutan have recently reported a real-time algorithm for tracking system
    drift using a simple adaptation of the reflective simplex approach outlined above
    (Xiong and Jutan, 2003). In essence, the simplex undergoes repeated reflections
    that allow it to track the moving optimum. If the optimum is static, the simplex
    reflects backward and forward and hence remains more or less anchored to the optimum.
    If the optimum starts to move, however, the repeated reflections drive the simplex
    in the direction of the drifting optimum.


    As noted above, the effects of system drift may be attributed to hidden variables
    over which the algorithm has no control. In reality, for CdSe nanoparticles synthesized
    in the manner described above, system drift is a very slow process that occurs
    over timescales of days. In order to accelerate the effects of drift and to pose
    a challenging test for our algorithm, we engineered an artificial situation in
    which the reaction temperature was programmed to drift linearly with time from
    180 to 230°C over a period of 6 h. (In ordinary circumstances, this would be expected
    to induce a significant red-shift in the peak emission wavelength.) The system
    was set to an initial total flow rate of 12 µl min⁻¹, corresponding to particles
    that initially emitted at 510 nm. The evolution of spectra under fixed and dynamically
    updated flow-rate conditions was then compared. The upper line in Figure 20 indicates
    the progressive change in peak wavelength observed over the 6-h period when the
    flow rate was fixed at 12 µl min⁻¹. The peak wavelength increases almost linearly
    with time, indicating the formation of larger particles with red-shifted emission
    (due to the increased temperature-dependent reaction rate, c.f. Figure 10). The
    peak wavelength shifts by almost 30 nm by the end of the 6-h period. The lower
    line indicates the variation in the peak wavelength when the flow rate was dynamically
    updated by the drift-compensating algorithm. The peak wavelength shows an increased
    volatility due to the constant dithering of the reaction conditions and exhibits
    a few undesirable outliers in the early stages of the optimization (see circled
    data points). However, the baseline is effectively static, which indicates that
    the algorithm is successfully tracking the drifting optimum, and after 6 h the
    peak wavelength is still approximately 510 nm. The evolution of the flow rate
    is shown in Figure 21. The flow rate tracks (albeit in a somewhat hap-hazard fashion)
    the temperature, ensuring that the reaction time decreases sufficiently to offset
    the increase in temperature. The evolution of the emission spectra with time are
    shown in Figure 19a and b. The non-stabilized system gives rise to a progressive
    red shift in the particle emission with time, accompanied by a progressive reduction
    in the intensity of the defect emission (due to the larger size of the particles).
    The dynamically stabilized system'
