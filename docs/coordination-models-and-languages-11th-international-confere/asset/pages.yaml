    typical temperature uniformity achievable in a conventional macroscale reactor.


    An additional advantage of using microfluidic devices, which we do not have the
    space to discuss in detail here, is the absence of turbulence (Koo and Kleinstreuer,
    2003). In the context of nanoparticle synthesis, turbulence gives rise to unpredictable
    variations in physical conditions inside the reactor that can influence the nature
    of the chemical product and in particular affect the size, shape, and chemical
    composition. In microfluidic devices, turbulence is suppressed (due to the dominance
    of viscous over inertial forces) and fluid streams mix by diffusion only. This
    leads to a more reproducible reaction environment that may in principle allow
    for improved size and shape control.


    These improvements in control do not come without cost since the transferral of
    chemical reactions from the macroscale to the microscale frequently requires compromises
