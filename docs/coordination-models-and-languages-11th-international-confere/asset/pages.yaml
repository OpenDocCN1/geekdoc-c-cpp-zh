  md: 'adsorbed species and surface. This can be thought to occur as follows: In a
    nonequilibrium plasma, molecules are excited by electron impact. Among the characteristic
    species (electrons, ions, molecular fragments and excited species such as electronic,
    vibrational, rotational/translational excitations), only radicals and vibrationally
    excited species will be relevant for surface reactions in an atmospheric pressure
    nonequilibrium plasmas, due to the fact that radicals have long relaxation times
    compared to the time needed for chemical reactions, plus that they have a high
    sticking probability on surfaces. Vibrational activation in the dissociation degree
    of freedom can lower the activation barrier for dissociative adsorption (Tas,
    1995).


    In addition to the above, in a microplasma reactor a more intensive interaction
    of plasma and catalyst surface can be achieved in a confined environment. Li/MgO
    catalysts in the presence of oxygen at high temperatures have [Li⁺O⁻] defect sites
    which activate C–H bonds in alkanes (Wang and Lunsford, 1986). Propane activation
    starts with hydrogen abstraction by oxygen ions, forming propyl radicals (Balint
    and Aika, 1997). C–C and C–H bond cleavage happens at high temperatures (T > 823
    K) in the presence of [Li⁺O⁻] centers. At these temperatures, a loss of catalyst
    area was observed, which results in less heterogeneous formation of propene (Tronfetti
    et al., 2006). A microplasma reactor may allow initial propane activation at lower
    temperatures by enhanced radical surface interactions in the confinement of a
