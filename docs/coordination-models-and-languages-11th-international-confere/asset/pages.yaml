  md: '2003; Dushkin et al., 2000; Rao et al., 2006; Yordanov et al., 2006). Indeed
    the formidable difficulty of preparing high-quality nanoparticles in a controlled
    and reproducible manner is recognized to be the foremost obstacle to the full
    exploitation of many nanoscale phenomena. In this chapter, we consider the utility
    of microfluidic systems in providing a controlled environment in which to synthesize
    nanomaterials and also the feasibility of automating the synthesis procedure,
    with a view to creating “blackbox” chemical reactors that in response to appropriate
    instructions—and without any human intervention—can produce high-quality nanomaterials
    with optimized physicochemical properties. The provision of such automated tools
    would significantly advance the field of nanoscience, allowing high-quality nanomaterials
    to be produced on-demand and at the point of need for a host of applications in
    nanotechnology.


    # ## 2. MICROFLUIDIC ROUTES TO THE SYNTHESIS OF NANOPARTICLES


    The approach described later on in this chapter builds upon a report in 2002,
    in which we proposed microfluidic reactors as favourable systems for nanoparticle
    synthesis, and showed that nanocrystalline cadmium sulfide prepared in such reactors
    exhibited improved monodispersity compared with particles prepared in conventional
    bulk-scale vessels (Edel et al., 2002).


    In simple terms nanoparticles are formed via a two-stage process in which an initial
    nucleation stage (in which seed particles spontaneously precipitate from solution)
    is followed by a more gradual growth phase in which diffusion of solutes from
    the solution to the seed surface proceeds until the final particle size is attained.
    This classical model was first proposed by LaMer and Dinegar to explain the mechanism
    of formation of sulfur colloids (La Mer and Dinegar, 1950) and can be represented
    by a simple cartoon of the kind shown in Figure 1 which shows the variation in
    solute concentration as a function of time. The solute is formed by a chemical
    reaction (e.g., hydrolysis of a metal alkoxide, hydration of metal ions, and decomposition
    of organic compounds). As the reaction proceeds, the solute concentration will
    at some point exceed a “supersaturation” concentration, eventually reaching a
    “critical” concentration at which point nucleation occurs (ideally) in a short
    burst. This nucleation process—and the ensuing growth of these nuclei—lowers the
    solute concentration to a value below the critical nucleation concentration, thereby
    preventing further nucleation, but still allowing particle growth. The formed
    particles then grow at a rate that merely consumes all further solutes that are
    generated by the chemical reaction. The process of particle growth will lower
    the overall free energy of the system so, in the absence of any other competing
    processes, growth will'
