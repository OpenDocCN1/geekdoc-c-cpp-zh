    # 4.2 Positioning and trapping of particles and molecules


    AC electroosmosis as discussed in the previous section has not been used much
    as a pumping mechanism in microreactors, but the effect has been shown to be useful
    in (bio)particle manipulation, for example, in the work on an electrokinetic bioprocessor
    used for concentrating cells and molecules in a microfluidic system (Wong et al.,
    2004). In this device, the flow field generated by AC electroosmosis transports
    particles to regions near the electrode surface, where electrophoretic and dielectrophoretic
    forces, which are effective in short range, take over, and trap the cells and
    molecules. The concentration of biological objects in a large range of sizes,
    including bacteria, λ-phage DNA, and single-stranded DNA fragments with a radius
    of gyration of 3 nm, was demonstrated.


