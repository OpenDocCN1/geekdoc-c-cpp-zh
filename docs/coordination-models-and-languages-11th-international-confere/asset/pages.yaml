    Re is defined as


    Re = ρ u d_h / μ = 2ρ u d_h w / [μ(w + 2d)]    (4)


    where ρ, u, and μ are the density, the mean velocity, and the viscosity, respectively.
    When water flows in the microchannel at the flow rate of 1 μl min⁻¹, Re becomes
    only 0.05 in microscale with a d_h of 100 μm. Therefore, multiphase microflows
    are considered as laminar flow.


    When physical and properties of the multiphase microflows such as viscosity and
    interfacial tension can be regarded as constant, the flow can be divided in two
    parts. One is a transient part where the flow profile is gradually approaching
    an equilibrium state after confluence, and the other is an equilibrium part. The
    flow vector profile of the latter can be expressed analytically with simple assumptions.
    At first, two-phase microflows in the equilibrium state is considered. The two-phase
    microflows are illustrated in Figure 11. Phase I and II have viscosities of μ^I
    and μ^II and widths of a and b, respectively. As driving force of the flow, pressure
    difference of P_I − P_0 ≡ ΔP is assumed for a channel length of L. The x- and
    z-axes are defined as directions along and across the channel, respectively. The
    origin of the x-axis is assumed at the interface of phases I and II. Under these
    conditions, shear stress τ_xz can be expressed based on momentum balance as


    dτ_xz/dx = ΔP / L    (5)'
