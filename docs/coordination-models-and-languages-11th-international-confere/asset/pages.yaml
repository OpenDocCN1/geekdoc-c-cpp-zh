    needed to create a fully automated reactor is the addition of a suitable control
    algorithm that is able to repeatedly update the reaction conditions until particles
    with the desired properties are obtained (see Figure 13).


    The intention of the remaining part of this chapter is to explain in simple terms
    how the process of nanoparticle synthesis can be automated, and we will not dwell
    excessively on mathematical details. Instead, to illustrate our general approach,
    we will start by considering a very simple example in which we will design an
    automated system capable of producing particles that emit at a specified wavelength.
    We will then show how this approach can be generalized to enable the automated
    production of particles whose emission characteristics are specified in more complex
    ways. The key to automating the process of nanoparticle synthesis is to use a
    so-called *utility function* that reduces all of the known information about the
    particles to a single figure of merit that characterizes the particle quality.
    The utility function is usually defined in such a way that the figure of merit
    decreases steadily (from a large positive number) to zero as the measured properties
    get progressively closer to the desired properties. For example, let us suppose
    that one wishes to produce particles that emit at a certain target wavelength
    $\lambda_t$ and that for the current reaction conditions the measured wavelength
    is $\lambda_c$. In this case, a sensible utility function $u(\lambda_c)$ would
    be


    $$u(\lambda_c) = (\lambda_c - \lambda_t)^2 \tag{3}$$'
