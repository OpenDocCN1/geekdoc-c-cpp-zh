    simply tweaking the flow rate manually. The automated approach is more useful
    for higher dimensional problems where the product can be controlled by multiple
    reaction conditions, for example, by varying the two injection rates of the precursors
    together with the temperature. In this case, multiple combinations of reaction
    conditions may yield the same emission wavelength since a faster flow rate (which
    reduces the reaction time) can, for example, be compensated by a higher reaction
    temperature (which increases the reaction rate). However, although multiple reaction
    conditions may yield particles with the same emission wavelength, the emission
    spectra are liable to have different line widths and intensities. In general one
    prefers nanoparticles that exhibit sharp intense emission, and it is interesting
    to ask whether one could optimize the peak wavelength subject to an additional
    requirement that the particles should, say, emit as brightly as possible. The
    optimization of multiple properties is known variously as multi-attribute optimization,
    multi-objective optimization, and decision theory, and is a subject of intense
    practical interest. There are various ways in which multi-attribute optimization
    can be carried out, but we will consider here the use of multi-attribute utility
    functions (MAUFs), that is, utility functions that combine multiple attribute
    values into a single figure of merit that can then be optimized in the usual way.
    MAUFs are most straightforwardly created by combining a number of single attribute
    utility functions (SAUFs) using, for example, a weighted sum. Again, we will not
    dwell on the mathematical details but simply note that the MAUFs are typically
    defined to have a value of unity when the multiple attributes all have their worst
    possible values which reduce to zero if and when they all have their best possible
