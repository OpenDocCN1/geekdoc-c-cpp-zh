    # ### 3. ELECTROCHEMICAL MICROREACTORS


    Electrochemistry, to distinguish it from the topics discussed in previous sections,
    is concerned with *low-energy charge transfer in solution*. The electron transfer
    typically occurs on the surface of a charged (usually metal) electrode. Possible
    chemical reactions that may occur, and that may be of importance in chemical synthesis,
    are the generation or annihilation of gases (in an electrolysis or a fuel cell,
    respectively) and the generation or neutralization of ions, which may be accompanied
    with the dissolution or deposition of a solid material.


    The reasons to perform electrochemistry, in particular, *electrosynthesis*, *in
    a microfluidic system* are the following (Rode et al., 2009): (1) reduction of
    ohmic resistance in the electrochemical cell, by decreasing the distance between
    anode and cathode, (2) enhancement of mass transport by increase of electrode
    surface to cell volume ratio, also realized by small interelectrode gaps, (3)
    performing flow chemistry to establish single-pass conversion, and (4) coupling
    of cathode and anode processes, permitting simultaneous formation of products
    at both electrodes. The latter'
