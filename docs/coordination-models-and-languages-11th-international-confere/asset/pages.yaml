  md: '# ### 3. COMPOUNDS OF INTEREST AND INDUSTRIAL APPLICATIONS OF MICROREACTION
    TECHNOLOGY


    Having discussed some of the advantages associated with the use of microreaction
    technology as a tool to conduct high-throughput organic synthesis, the final section
    of this chapter focuses on some of the compounds generated under continuous flow
    that are of synthetic and/or industrial interest.


    Along with the halogen–lithium exchange reactions detailed in Section 2.3.3, numerous
    hydrogen–lithium exchange reactions have been reported to benefit from being conducted
    under continuous flow conditions. Such reactions are typically performed at low
    temperatures, that is, −78 °C, owing to the exothermic nature of the transformation
    and to prevent decomposition of unstable intermediates. The use of cryogenic reaction
    temperatures is however disadvantageous when considering employing reactions on
    a production scale. With this in mind, examples have featured within the literature
    that demonstrates the ability to increase reaction temperature, by conducting
    the reactions within miniaturized, continuous flow reactors. One such example
    of this is the synthesis of a spiro lactone 201 which is a fragment of neuropeptide
    Y, a receptor antagonist for the treatment of obesity (Takasuga et al., 2006).


    As Scheme 59 illustrates, the reaction involves the hydrogen–lithium exchange
    of phenyl isonicotinamide 202, in the presence of n-BuLi 74/LiBr 203, followed
    by a reaction with ethyl-4-oxocyclohexanecarboxylate 204 to afford the target
    spiro lactone 201 as a mixture of *cis/trans* isomers. In the presence of any
    residual dilithiated intermediate 205, the spiro lactone 201 can undergo a second
    reaction to afford the by-product 206. Conducting the reaction in a microflow
    reactor, comprising of static mixers and


    ![](img/5c3cdcd9b21d4d4e9da6d42180679a02_180_0.png)


    **Scheme 59**  Selective synthesis of a spiro lactone derivative 201 achieved
    using continuous flow methodology.'
