    # 5.2  Control of the activity of adsorbed molecules


    Besides the control of the adsorption and desorption of molecules on a surface,
    an exciting topic is turning of the *orientation* and the *activity of adsorbed
    molecules* by an electric field. For organic molecular layers adsorbed on electrodes,
    it was found that after the initial adsorption, a sufficiently high (positive)
    potential leads to orientation of the molecules, where the molecular dipoles align
    with the electric field so that adsorbate–adsorbate interactions are increased
    (Han et al., 2004; Pronkin and Wandlowski, 2003). For the zwitterionic molecule
    *p*-aminobenzoic acid (PABA) on an Ag(111) electrode surface also a potential-dependent
    orientation effect was observed, using infrared–visible sum frequency generation
    spectroscopy and electrochemical capacitance and CV measurements (Schultz and
    Gewirth, 2005). It was found that PABA switches orientation with the charge on
    the electrode surface, orienting one way for potentials above the potential of
    zero charge, and the other way below that potential, an effect that depends on
    pH.


    While in the mentioned work on PABA on a charged silver electrode also the adsorption
    degree of the molecules was controlled by surface charge, Lahann et al. showed
    a concept in which molecules immobilized as a low-density self-assembled monolayer
    on a gold surface were electrically stimulated to undergo conformational transitions
    between a hydrophilic and a hydrophobic state (Lahann et al., 2003). Such a surface
    wetting switch may then be used to immobilize, for example, enzymes, as was discussed
    in the previous section. This is an example of switching both the orientation
    and the activity of adsorbed molecules.


    Adsorbing proteins in the correct orientation on a surface is very relevant for
    immunoassays, in which antibodies are immobilized on a surface and used to detect
    the presence and concentration of specific antigens in a biological sample, but
    also for enzymatic microreactors, where the orientation (and folding state) of
    the enzyme determines its biocatalytic activity. Many reports have appeared in
    literature on the orientation of proteins on charged surfaces, both on theoretical
    and experimental work. Theoretical studies are based on two different types of
    models (Sheng et al., 2002): molecular models based on Molecular Dynamics or Monte
    Carlo simulations, which are very detailed at the atomic level but also very demanding
    in terms of computing power, and continuum models which treat proteins as colloidal
    particles with a (mostly uniform) charge distribution over its spherical surface
    and the'
