    as a function of measurement number in Figures 18a and b. In the initial stages
    of the optimization, the algorithm has no historical data on which to base its
    decisions and the flow rate oscillates wildly as the simplex reflects backward
    and forward. The algorithm gradually builds up a picture of the terrain, however,
    and as it does so the flow rate gradually converges to 5.75 μl min<sup>−1</sup>,
    causing the figure of merit to reduce in magnitude toward zero and the peak wavelength
    to “home-in” on the target of 540 nm. The target is reached after approximately
    forty measurements. The data in Figure 18b reveal an approximate mirror symmetry
    between the flow rate F and the peak wavelength λ<sub>max</sub>. This arises because
    slower flow rates imply longer reaction times which result in larger particles
    with longer peak emission wavelengths (and vice versa). In Figure 18c, we show
    the emission spectra corresponding to the first and last measurements, together
    with an interim spectrum obtained at measurement ten. The convergence on the target
    wavelength is clear. (The increase in intensity with measurement number is due
    to the increasing size of the particles as the emission moves to longer wavelengths,
    which reduces the quenching effects of surface defects.)'
