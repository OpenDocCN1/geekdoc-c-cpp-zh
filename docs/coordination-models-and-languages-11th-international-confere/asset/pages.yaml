    silicon dioxide, one of the most reliable insulators available in microelectronics,
    is ~1 V nm⁻¹, and breakdown of zeolites or MOFs will most likely occur at lower
    fields than this. This is why in our laboratory we are studying configurations
    based on insulated nanoneedles, at the tips of which the electric field will be
    significantly enhanced.


    The field of fine and pharmaceutical chemistry, where the desired production amounts
    are in kilograms rather than in tons, would benefit considerably from the development
    of versatile process chemistries, carried out in relatively small generic production
    units that can be tuned to a range of different products. An example of a versatile
    “microreactor” is a microorganism of which the product can be tuned by engineered
    genetic changes that alter the metabolic processes of the organism in such a way
    that it produces a desired chemical. The key actors in this are the different
    enzymes which are expressed by the microorganism and which perform the required
    biocatalysis on very specific feed molecules to deliver the desired product molecules
    with extremely high selectivity, for example, as a single enantiomer. Enzymes
    in living cells are often not present free in solution but immobilized in the
    lipid membranes of cell organelles or of the cell outer membrane. It is difficult
    to replicate membrane immobilization outside of a cell, in a technical device,
    which is why for industrially relevant enzymes immobilization strategies have
    been developed based either on support binding (usually involving covalent bonds,
    for example, to a resin, a biopolymer or a mesoporous silica), entrapment (in
    a gel lattice), or cross-linking of enzyme aggregates or crystals to prepare carrierless
    particles (Sheldon, 2007).


    For reasons of fouling or deactivation, it may be desirable to be able to replace
    immobilized enzymes in time, and for this a programmable way of adsorption and
    release of enzymes would be very welcome. An example of this is the use of a 4
    nm thin polymer film that can be thermally switched between a hydrophilic (swollen)
    state at 20 °C and a more hydrophobic protein-adsorbing (collapsed) state at 48
    °C, integrated into a micro hotplate with fast heating options so that a protein
    monolayer can be adsorbed and released within 1 s (Huber et al., 2003).


    The application of heat to enzymes is not always desired; furthermore, it may
    turn out to be difficult to localize the heat. Electric fields have an advantage
    in this respect, since they can be locally applied by design of'
