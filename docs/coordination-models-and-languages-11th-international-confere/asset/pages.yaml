    # ### 2.1.4 Microcavity discharges


    Microcavity plasma devices have cavities with precisely controlled cross sections.
    Large arrays of these devices have been fabricated in different materials such
    as ceramics (Allmen et al., 2003), photodefinable glass (Kim and Eden, 2005),
    alumina structures (Park et al., 2005), and plastic substrates (Anderson et al.,
    2008). An example with inverted square pyramid microcavities fabricated in silicon
    is represented in Figure 4. Physical and chemical isolation between the electrodes
    and the discharge is maintained by the dielectric. The advantage of using silicon
    as the host material in these microplasma devices is the wide range of microfabrication
    techniques which are available for this material, which allows production of large
    arrays of microcavity discharge devices at reasonable expense. As an application
    example, parallel linear arrays of interconnected cylindrical microcavity plasma
    elements integrated in microreactors, based on disposable plastic substrates,
    have been demonstrated (Anderson et al., 2008).


