    In the case of conventional macroscale materials, toxicity is determined primarily
    by chemical composition. The particle dimensions do not strongly influence the
    physicochemical properties of the materials themselves, and hence they tend to
    influence toxicity only indirectly by *in essence* determining how easily a given
    particle can reach a susceptible location in the body. In the case of asbestos,
    for example, the diameter of the fibers determines their ability to penetrate
    the lung and reach the alveoli where they provoke an inflammatory response that
    causes deposition of fibrous tissue (and in so doing reduces lung capacity). The
    thin linear “amphibole” fibers pictured in Figure 23a are able to penetrate the
    lungs more readily than the curved “serpentine” fibers pictured in Figure 23b
    and so typically cause more damage. In the case of nanoscale materials, however,
    the situation is more complex because the particle dimensions also have a strong
    influence on the physicochemical properties of the particles. In principle, even
    small variations'
