  md: '# ### 3. THE AUTOMATED PRODUCTION OF CdSe NANOPARTICLES


    The synthetic route we use in this work is a simple adaptation of a method by
    Peng et al., in which CdO and elemental Se are reacted together at high temperature
    in the presence of oleic acid to form CdSe nanocrystals (Peng and Peng, 2001).
    In brief, a precursor Se solution is prepared by combining 30 mg of Se with 10
    ml of 1-octadecene and 0.4 ml of trioctylphosphine and warming over a hot plate.
    A Cd precursor solution is prepared by combining 13 mg of CdO and 0.6 ml of oleic
    acid in 10 ml of 1-octadecene and heating at 180 °C until clear. The reaction
    is performed in a glass y-shaped microfluidic chip with channels of width 330
    μm and depth 160 μm. The reaction channel is 40 cm long and arranged in a serpentine
    architecture for compactness. The chip is placed on a stabilized hot plate with
    high spatial uniformity. The reaction can be performed at temperatures in the
    range 160–255 °C. Two syringe pumps are used to inject the precursor solutions
    into the inlet channels at rates up to 40 μl min⁻¹. The solutions mix rapidly
    at the point of confluence, and nucleation and growth of the CdSe nanoparticles
    occurs along the reaction channel. The emergent particles can then be monitored
    at ambient temperature at an observation zone downstream of the reaction zone.
    Here, the particles are excited using a 355-nm solid-state laser excitation source
    and emission is detected using a fiber-optic CCD spectrometer. A fraction of the
    incident laser light is redirected to a Si photodiode using a beam-splitter, allowing
    the emission spectrum to be corrected for variations in the laser intensity. The
