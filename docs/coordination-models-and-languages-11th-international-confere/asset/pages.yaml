  md: 'electrode configurations. Besides the concepts which were already mentioned
    earlier in which electric fields are applied to transport molecules or particles
    to a desired location, or trap them at a specific location, there are also ways
    to control the adsorption of molecules from solution on a specific surface.


    Two principles exist by which electric fields can control molecular adsorption
    on a surface. The first is based on a change in surface wetting properties, as
    was discussed in a previous section, where EWOD was applied to switch from a hydrophilic
    to a hydrophobic state and vice versa. The second relies on changing the surface
    charge density, for example, on a metal electrode in contact with an electrolyte,
    or changing the ζ potential, by applying an external electric field on electrodes
    embedded in an insulator surface on which one desires to change the affinity.
    Experiments involving the adsorption of organic molecules at a solid surface have
    shown strong capacitance changes in the electric system in which the solid surface
    was included, which changes are associated with phase transitions in the adsorbed
    layer between gas-like layers, disordered and ordered physisorbed layers, and
    chemisorbed layers (Van Krieken and Buess-Herman, 1999). The concept of changing
    the ζ potential on a surface arranged in a field-effect transistor (FET) configuration
    by a gate potential was discussed in the section on EOF as a method to control
    that flow, but it should also be possible to control in similar manner the (reversible)
    adsorption of molecules, especially of molecules which have a charge or a dipole.
    The effect is very sensitive to the pH of the electrolyte with which the surface
    is in contact, and typically the largest effect of the field-effect flow control
    principle occurs close to the pK value of the surface of interest (Schafoort et
    al., 1999; van der Wouden et al., 2005). This may prohibit the use of the concept
    for enzyme immobilization because also the mobility and solubility of proteins
    is very much pH dependent. Attempts in our laboratory (Nichols and Gardeniers,
    2006) to use field-effect control of protein adsorption were unsuccessful, which
    may have been due to the problem of balancing the charge on the surface (controlled
    by the pH, ionic strength, and both the electric fields along and perpendicular
    to the surface) with the charge on the protein (controlled mainly by pH and the
    choice of protein). Furthermore, in a theoretical study on electrostatic contributions
    to the entropy and energy of protein adsorption (Roth et al., 1998) it was shown
    that the attractive free energy is very strong at short range. The protein was
    modeled as a colloidal particle, with an electric double layer that starts to
    overlap with the electric double layer of the surface at short range, leading
    to a significant entropic effect due to ion transport from the double layers to
    the bulk of the solution. This (positive) entropic effect is said to dominate
    the free energy of adsorption. However, this effect very much depends on the matching
    of charges on the protein and on the wall, and in some cases this may even lead
    to a'
