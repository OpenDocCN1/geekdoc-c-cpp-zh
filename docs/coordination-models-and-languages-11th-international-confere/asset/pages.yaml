    “cation flow” process (Suga et al., 2001; Yoshida, 2008). Finally, a sixth reason
    for performing electrochemistry in a microfluidic system may be the desire to
    efficiently remove reaction heat (or joule heat due to high currents in combination
    with a high ohmic resistance) in fast electrochemical reactions (Yoshida, 2008).


    The research on electrochemistry in microreactors has been reviewed in a number
    of recent publications (Hessel et al., 2004; Rode et al., 2009; Yoshida, 2008;
    Yoshida et al., 2008); therefore, we do not want to go into too much detail here.
    But since these reviews almost exclusively concern electroorganic synthesis, a
    number of other applications will be highlighted here.


    A specific type of electrochemical microsystem, although not directly a synthetic
    microreactor, is a *microfluidic fuel cell*. In a recent review (Kjeang et al.,
    2009), the developments and challenges in this field have been analyzed. Kjeang
    et al. define a microfluidic fuel cell as a fuel cell with fluid delivery and
    removal, reaction sites, and electrode structures all confined to a microfluidic
    channel. Most microfluidic fuel cells use colaminar flow, without a physical separation
    (like a membrane) between anode and cathode. The laminar flow characteristic is
    utilized to delay mixing of fuel (the anolyte) and oxidant (the catholyte), which
    occurs by diffusion only and is restricted to a small zone close to the anolyte–catholyte
    interface at the center of the channel. Electrodes are positioned on the walls
    of the channel, at sufficient distance from the diffusion zone in order to prevent
    fuel crossover. Both anolyte and catholyte contain supporting electrolyte which
    facilitates ionic transport. Figure 23 shows a specific example of a microfluidic
    fuel cell, namely one in which an air breathing cathode is used to eliminate one
    of the main problems with microfluidic fuel cells, that is, the mass transport
    limitation at the cathode in cases where dissolved oxygen is used as the oxidant.


    The colaminar configuration has a number of advantages over other fuel cell designs:
    (1) mixed media operation, (2) operation at room temperature, and (3) no auxiliary
