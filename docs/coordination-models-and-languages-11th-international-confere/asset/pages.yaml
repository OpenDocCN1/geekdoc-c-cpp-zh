  md: '(Paschen, 1889). Breakdown occurs when ions in the gas are accelerated across
    the gap so that a Townsend avalanche results (Townsend, 1925). For gaps greater
    than ~10 μm, breakdown has been well studied and occurs when the electric field
    becomes higher than ~3 V μm−1. However, for air at atmospheric pressure an increase
    in breakdown voltage was observed for a gap spacing below ~5 μm (Schaffert, 1975).
    Under these conditions, electrons can tunnel through the surface potential barrier,
    a phenomenon called field emission. The field emission current is described by
    the Fowler–Nordheim equation (Fowler and Nordheim, 1928). Figure 5 shows the modified
    Paschen curve for air at 1 atm (Zhang et al., 2004a), in which the minimum and
    rise in breakdown voltage at small gap spacing is replaced with a plateau (the
    unmodified Paschen curve would have a minimum at ~5 μm gap spacing) and steep
    decline to zero. At the “knee” where the steep decline starts, field emission
    takes over completely from Townsend avalanche. The exact location of plateau and
    knee depends on the geometry, roughness, and composition of the metal electrodes.
    Finally, for ultrathin gaps smaller than ~2 nm, there is a finite probability
    that electrons can tunnel across an insulating barrier and result in a significant
    tunneling current.


    Figure 5 indicates that breakdown in atmospheric pressure in very narrow gaps
    can occur at relatively low voltages, of a few tens of volts, which makes practical
    applications attractive. The situation becomes more favorable if one of the electrodes
    has a needle shape: The electrical field at the tip of the needle is intensified,
    and this leads to field emission at lower voltages than observed for the two planar
    electrodes of Figure 5. Work in our lab resulted in a factor 10 higher current
    density for a forest of


