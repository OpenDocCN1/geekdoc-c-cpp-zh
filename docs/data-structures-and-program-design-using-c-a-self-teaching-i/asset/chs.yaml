  \ 章\n\n## 文件\n\n### 本章内容\n\n• 引言\n• 术语\n• 文件操作\n• 文件分类\n• 文件组织\n• 顺序文件组织\n• 索引顺序文件组织\n\
  • 相对文件组织\n• 倒排文件组织\n• 总结\n• 练习题\n\n### 11.1 引言\n\n我们都知道，如今在大多数机构中，数据都以某种形式被大量收集。一些机构使用各种类型的数据收集应用程序来收集数据。当我们谈论机构时，不仅包括学校、学院和公司这样的大型机构，也包括街角的小面包店；可以观察到数据的收集和交换无处不在。例如，当我们进入学校时，学校会收集大量数据，如姓名、年龄、地址、父母姓名、血型等。在过去，我们都知道，数据是以纸质文档的形式收集的，这些文档非常难以处理和存储。因此，为了高效、分析分析收集的数据，使用计算机以文件的形式存储数据。在计算机术语中，文件被定义为持久性存储介质中的块有用数据；也就是说，该文件可供未来使用。数据在文件中以分级顺序组织。这种分级顺序包括记录、字段等项，其定义如下。\n\
  \n### 11.2 术语\n\n• **数据字段（Data Field）–** 数据字段是存储单元事实的单位。它通常以其类型和大小为特征。例如，“员工姓名”是一个存储员工名字的数据字段。\n\
  \n• **记录（Record）–** 相关数据字段的集合称为记录。例如，一个员工记录可能包含各种数据字段，如姓名、编号、地址、电话等。\n\n• **文件（File）–**\
  \ 相关的记录的集合称为文件。\n\n• **目录（Directory）–** 相关的记录的集合称为文件。\n\n• **文件名（File Name）–** 相关的记录的集合称为文件。\n\
  \n• **只读（Read-only）–** 相关的记录的集合称为文件。\n\n• **隐藏（Hidden）–** 相关的记录的集合称为文件。\n\n### 11.3\
  \ 文件操作\n\n对文件可以执行各种操作。\n\n1. **文件创建（File Creation）–** 这是对文件执行的首要操作。通过指定其名称和模式创建一个文件。\n\
  \n2. **更新文件（Updating a File）–** 意味着更改文件内容。通常通过以下方式实现：\n\na. **插入文件（Inserting into\
  \ a File）–** 向文件中插入记录。例如，如果有一个新员工加入机构，将其插入文件。\n\nb. **修改文件（Modifying a File）–**\
  \ 修改文件中的记录。例如，如果员工的地址发生变化，必须在文件中修改。\n\nc. **删除文件（Deleting from a File）–** 从文件中删除现有记录。例如，如果一个员工辞职，将其从文件中删除。\n\
  \n3. **检索文件（Retrieving from a File）–** 指从文件中提取有用数据的过程。通常通过以下方式实现：\n\na. **查询（Enquiring）–**\
  \ 从文件中检索少量数据。\n\nb. **生成报告（Generating a Report）–** 从文件中检索大量数据。\n\n![figure](img/0318.jpeg)\n\
  \n***图 11.1 文件操作***\n\n### 11.4 文件分类\n\n文件分为两类，：\n\n1. **文本文件（Text Files）–** 文本文件（也称为扁平文件）是使用相应的\
  \ ASCII 值存储所有数值或非数值数据的文件。数据可以是字母、数字或特殊符号的字符串。因此，它也被称为 ASCII 文件。通常，文本文件有一个特殊的标记称为文件结束，表示文件的结束。\n\
  \n2. **二进制文件（Binary Files）–** 二进制文件是以 1 和 0 的二进制形式包含所有数据的文件。它以与主内存相同的的形式存储数据。因此，人类无法读取二进制文件。二进制文件由计算机程序读取，程序将将其解码为有意义的内容。数据高效地存储在二进制文件中。\n\
  \n### 11.5 文件组织\n\n文件组织是指记录在存储设备上的物理排列方式。此外，它可能关联有单个键或多个键。因此，在选择特定的文件组织类型时，需要考虑各种因素，包括：\n\
  \n1. 记录检索的易用性。\n\n2. 存储经济性。\n\n3. 可靠性，即某种文件组织是否可靠。\n\n\n\n\n\n# 4. 安全性，即文件组织是否安全。\n\
  \n现在，我们将讨论一些常用于文件组织的技术。\n\n## 11.6 顺序文件组织 (Sequence File Organization)\n\n顺序文件组织是在文件中组织一组记录的最基本方法。顺序文件组织是在文件创建时，记录按照顺序一个接一个写入的，并且当文件用于输入时，只能按照写入的顺序进行访问。所有记录都从零开始编号。因此，如果文件中有\
  \ `N` 条记录，那么第一条记录的编号为 0，最后一条记录的编号为 `N-1`。在某些情况下，顺序文件的记录根据每个记录中某个字段的值进行排序。用于对记录排序的字段被称为排序键（sort\
  \ key）。如果文件是按名为 `key field` 的字段的值进行排序，那么当且仅当记录 `i` 中的 `key field` 值小于或等于记录 `j` 中的\
  \ `key field` 值时，记录 `i` 紧位于记录 `j` 之前。此外，文件还可以根据由一个或多个字段组成的排序键按升序或降序排序。由于顺序文件中的记录只能按顺序访问，这些文件在批处理中的应用比交互式处理更常见。例如，顺序文件的记录用于生成电话簿的白页，这些白页将按用户的姓氏进行排序。\n\
  \n![figure](img/00319.jpeg)\n\n***图 11.2*** 顺序文件组织的结构。\n\n### 顺序文件组织的优点\n\n1. 易于处理。\n\
  2. 它不涉及额外的开销/问题。\n3. 在这种组织方式中，记录可以是变长的。\n4. 它可以存储在磁磁盘和磁带上。\n\n### 顺序文件组织的缺点\n\n\
  1. 记录只能按顺序访问。\n2. 它不支持文件中间的更新操作。\n3. 它不支持交互式应用程序。\n\n## 11.7 索引顺序文件组织 (Indexed Sequence\
  \ File Organization)\n\n索引顺序文件组织是在既需要通过某些键值按顺序访问，又需要通过相同的键值单独访问记录时，一种组织记录的有效方法。它提供了顺序文件或相对文件所支持的访问类型组合。索引被结构化为二叉搜索树。该索引用于作为访问特定记录的请求，而顺序数据文件本身仅用于对整个记录集进行顺序访问。由于其支持顺序访问和直接访问的能力，索引顺序文件组织被用于支持需要批处理和交互式处理的应用程序。\n\
  \n### 索引顺序文件组织的优点\n\n1. 记录可以按顺序和随机访问。\n2. 它支持面向批处理和交互式的应用程序。\n3. 它支持文件内部记录之间的更新操作。\n\
  \n### 索引顺序文件组织的缺点\n\n1. 在这种组织中，文件只能存储在磁磁盘上。\n2. 它涉及维护形式的额外开销。\n3. 记录只能是固定长度，因为我们维护了类似链表的每个节点结构。\n\
  \n![figure](img/00320.jpeg)\n\n***图 11.3*** 使用 BST 和顺序文件提供索引顺序访问。\n\n## 11.8 相对文件组织\
  \ (Relative File Organization)\n\n相对文件组织提供了一种直接访问单个记录的有效方法。在相对文件组织中，键与记录在文件中的位置之间存在一种可预测的关系。记录并不一定按其键的物理顺序排列。那么，如何找到给定的记录呢？用于在键值和物理地址之间进行转换的关系被指定，例如\
  \ `R(Key value → address)`。当要把记录写入相对文件时，使用映射函数 `R` 将记录的键转换为地址，该地址指示了记录要存储的位置。用于映射函数\
  \ `R` 的基本技术是目录查找和地址计算（哈希）。\n\n- **目录查找技术 –** 这是实现映射函数 `R` 最简单的技术。该技术的基本思想是维护一个键值：地址对的目录。若要在相对文件中找到一条记录，首先在目录中定位其键值，然后使用指示的地址在存储设备上找到该记录。目录可以组织为二叉搜索树。\n\
  - **地址计算技术 –** 实现映射函数 `R` 的另一种常见技术是对键值进行计算（哈希），使结果为一相对地址。\n\n### 相对文件组织的优点\n\n1.\
  \ 记录可以乱序顺序访问。\n2. 它非常适合交互式应用程序。\n3. 它支持文件之间的更新操作。\n\n### 相对文件组织的缺点\n\n1. 它只能存储在磁磁盘上。\n\
  2. 它还涉及维护索引形式的额外开销。\n\n## 11.9 倒排文件组织 (Inverted File Organization)\n\n提供索引与文件之间链接的基本方法之一称为倒排。键的倒排索引包含了该键在文件记录中当前拥的所有值。倒排索引中的每个键值条目指向所有具有相应值的数据记录。那么，该文件就被认为在该键上是倒排的。提供多键访问的倒排方法已成为商用关系型\
  \ DBMS（如 Oracle、DB2 等）中物理数据结构的基础。这些系统设计用于通过设计者感兴趣的多个倒排键来快速访问记录。它们具有用户友好的类自然语言查询语言，以帮助用户制定查询。一个完整的倒排文件为每个数据字段都有一个倒排索引。如果一个文件没有完全倒排，但至少有一个倒排索引，则称为部分倒排文件。\n\
  \n### 倒排文件组织的优点\n\n1. 布尔查询每条满足查询的记录只需要访问一次，外加上一些处理索引的访问。\n2. 记录可以以任何方式存储；例如，按主键顺序排序、按主键随机链接排序等。\n\
  3. 与其他文件结构相比，它还能节省空间。\n\n### 倒排文件组织的缺点\n\n由于索引条目是变长的，索引维护变得更加复杂。\n\n### 11.10 总结\n\
  \n- 文件是记录的集合。它通常存储在次级存储设备上。\n- 数据在文件中按分级顺序组织。分级顺序包括记录、字段等项。\n- 如果文件尚未创建，则文件创建是对文件执行的首要操作。通过指定其名称和模式来创建文件。\n\
  - 文件分为两类，即文本文件和二进制文件。\n- 文本文件（通常称为平面文件）是使用其对应的 ASCII 值存储所有数值或非数值的文件。数据可以是字母、数字或特殊符号的字符串。\n\
  - 二进制文件是以 1 和 0 的二进制形式包含所有数据的文件。它存储数据的形式与主内存的形式相同。\n- 文件组织是指记录在存储设备上的物理排列方式。\n\n\
  \n\n\n\n- 顺序文件组织是在文件中组织一组记录的最基本方法。在顺序文件组织中，文件在记录被写入时创建，记录按顺序一个接一个写入，且当文件用于输入时，只能按照写入的顺序进行访问。所有记录从零开始编号。\n\
  - 索引顺序文件组织是在当既需要通过某些键值进行顺序访问，又需要通过相同的键值单独访问记录时，一种组织记录的有效方法。它提供了由顺序文件或相对文件所支持的访问类型组合。\n\
  - 相对文件组织提供了一种直接访问单个记录的有效方法。在相对文件组织中，键与记录在文件中的位置之间存在一种可预测的关系。\n- 提供索引与文件之间链接的一种基本方法称为“倒排”（inversion）。用于提供多键访问的倒排方法已成为物理数据结构的基础。\n\
