  9. 编写一个读取包含 50 个整数数组的程序。显示所有和为 25 的元素对。\n10. 编写一个程序将普通矩阵转换为稀疏矩阵。\n11. 编写一个读取 10\
  \ 个整数数组的程序，然后找到数组中的最小值和最大值。\n12. 编写一个两个稀疏矩阵相加的程序。\n\n### 3.19.3 单选题\n\n1. 如果数组声明为\
  \ `intarray[20][20]`，那么它可以存储多少个元素？\n    A. 20\n    B. 40\n    C. 400\n    D. 以上均不是\n\
  2. 数组的元素始终存储在 ________ 位置。\n    A. 随机的（Random）\n    B. 连续的（Sequential）\n    C. 两者皆有\n\
  \    D. 以上均不是\n3. 下列代码的输出将是什么？\n```\n#include<stdio.h>\nmain()\n{\n    int arr[5]\
  \ = {5, 1, 15, 20, 25} ;\n    int a, b, c;\n    a = arr ;\n    b = arr ;\n    c\
  \ = arr ;\n    printf(\"%d, %d, %d\", a, b, c) \n    return 0;\n}\n```\n    A. 1,\
  \ 2, 5\n    B. 15\n    C. 以上都不是\n4. 执行后的输出是什么？\n```\n void main()\n{\n     int array[5]\
  \ = {2, 4, 6, 8, 10}\n     printf(\"%d\", array[6]);\n}\n```\n    A. 0\n    B. 10\n\
  \    C. 垃圾值\n    D. 以上不是\n5. 如果数组声明为 `array[]`，则可以通过以下方式访问第 个元素：\n    A. `array[n]`\n\
  \    B. `array + n`\n    C. `n + array`\n    D. 以上\n    E. 以上都是\n6. `Array[5] =\
  \ 19` 将数组的 元素初始化为 19。\n    A. 第 4 个\n    B. 第 5 个\n    C. 第 6 个\n    D. 第 7 个\n\
  7. 默认情况下，数组的第一个下标是 _____\n    A. 2\n    B. 1\n    C. -1\n    D. 0\n8. 多维数组（简单来说）是\n\
  \    A. 数组的数组\n    B. 指针的数组\n    C. 地址的数组\n9. 循环用于访问数组的所有元素。\n    A. 错误\n    B.\
  \ 正确\n    C. 以上都不是\n10. 声明数组意味着指定 ________、________ 和 ________。\n    A. 数据类型、名称、大小\n\
  \    B. 数据元素、名称、数据类型\n    C. 名称、大小、地址\n    D. 以上均是\n\n\n\n\n链表是数据元素的线性集合。这些数据元素被称为节点，它们通过指针指向下一个节点。链表是一种用于实现其他数据结构（如栈、队列、树等）的数据结构。链表是一个节点序列，其中每个节点包含一个或多个数据字段和一个指向下一个节点的指针。此外，链表在本质上是动态的；也就是说，内存是根据需要分配的。不需要像数组那样知道元素的确切大小或精确数量。以下是一个包含五个节点的简单链表示例：\n\
  \n![figure](img/00064.jpeg)\n\n***图 4.1*** 链表。\n\n在上一幅图中，我们创建了一个链表，其中每个节点被分为两个部分：\n\
  \n1. 第一部分包含信息/数据。\n2. 第二部分包含下一个节点的地址。\n\n最后一个节点不会连接到任何后续节点，因此它将存储一个名为 `NULL` 的特殊值。通常\
  \ `NULL` 定义为 `-1`。因此，`NULL` 指针代表链表的结束。此外，还有另一个特殊的指针 `START`，它存储链表第一个节点的地址。因此，`START`\
  \ 指针代表链表的开始。如果 `START = NULL`，则意味着链表是空的。由于链表的每个节点都指向另一个相同类型的节点，因此被称为自引用数据类型或自引用结构。\n\
  \n链表中的自引用结构如下：\n\n```\n struct node\n{\n int info ;\n struct node *next ;\n} ;\n\
  ```\n\n### 实际应用：\n\n- 一个简单的生活中的例子是火车上的每节车厢是如何与其前后的车厢连接的（第一节和最后一节除外）。在编程方面，将车厢体视为一个节点，将连接器视为指向前后结的链接。\n\
  - 大脑也是链表的很好的例子。在背记某内容的初始阶段，自然过程是将一个项目与另一个项目联系起来。这是一个无意识的行为。此外，当我们忘记某些事情并尝试记忆时，大脑会遵循关联并试图将一个记忆另一个记忆联系起来，以此类推，直到我们最终回想起丢失的记忆。\n\
  \n## 常见问题\n\n**Q1. 定义链表。**\n\n**答案。**\n\n链表是数据元素的线性集合，称为节点，其线性顺序通过指针给出。它是一种动态数据结构。对于链表中的每个数据项，都有一个关联的指针提供链表中下一个数据项的内存位置。链表中的数据项不在连续的内存位置。\n\
  \n**Q2. 列出链表的优缺点。**\n\n**答案。**\n\n**链表的优点**\n\n1. 链表是动态数据结构；这意味着它们在程序执行期间可以增长或缩小。\n\
  2. 链表具有高效的内存利用率。在需要时分配内存，不再需要时释放内存。\n3. 插入和删除更加简单且高效。\n4. 许多复杂应用可以通过链表轻松实现。\n\n\
  **链表的缺点**\n1. 它们消耗更多空间，因为每个节点都需要一个额外的指针来存储下一个节点的地址。\n2. 在列表中查找特定元素是困难且耗费时间的。\n\n\
  ### 4.3 链表中的内存分配\n\n链表的原理或概念支持动态内存分配。现在，动态内存分配什么意思？这个简单问题的答案是：在程序执行期间分配内存的过程或在运行时为变量分配内存的过程被称为动态内存分配。到目前为止我们学习了数组，其中我们最初声明数组的大小，例如\
  \ `array[50]`。该语句在执行后为 50 个整数分配内存。但如果我们只使用 30% 的内存，而其余分配的内存被浪费或未使用，就会出现问题。因此，为了克服内存空间浪费的问题，或者说为了高效利用内存，使用了动态内存分配，它允许我们分配/保留实际所需的内存。因此，它将克服数组那样的内存空间浪费问题。当我们提前不知道内存需求时，动态内存分配是最好的。C\
  \ 语言提供了一些用于动态分配内存的函数，如下表所示：\n\n| 函数 | 用途 | 语法 |\n| :--- | :--- | :--- |\n| `malloc()`\
  \ | 分配请求内存空间并返回分配内存空间第一个字节的指针。 | `ptr = (cast-type *) malloc(byte-size) ;` |\n|\
  \ `calloc()` | 为数组元素分配内存空间，初始化为零并返回内存的指针。 | `ptr = (cast-type *) calloc(n, elem-size)\
  \ ;` |\n| `free()` | 释放之前分配的内存空间。 | `free(ptr) ;` |\n| `realloc()` | 修改之前分配的内存的大小。\
  \ | `ptr = realloc (ptr, newsize) ;` |\n\n### 4.4 链表的类型\n\n有不同类型的链表我们将在本节中讨论。这些包括：\n\
  \n1. 单链表 (Singly Linked List)\n2. 循环链表 (Circular Linked List)\n3. 双向链表 (Doubly Linked\
  \ List)\n4. 头链表 (Header Linked List)\n\n现在我们将详细讨论所有它们。\n\n### 4.4.1 单链表\n\n单链表是链表中最简单的类型，其中每个节点包含一些信息/数据，且只有一个指向链表中下一个节点的指针。单链表中数据元素的遍历只能以一种方式进行。\n\
  \n![figure](img/00065.jpeg)\n\n***图 4.2*** 单链表。\n\n### 4.4.2 单链表上的操作\n\n在单链表上可以执行各种操作，包括：\n\
  \n- 遍历链表\n- 在链表中查找给定值\n- 在链表中插入新节点\n- 从链表中删除节点\n- 两个链表的合并\n- 链链的排序\n- 反转链表\n\n现在让我们详细讨论所有这些操作。\n\
  \n#### a) 遍历链表\n\n遍历链表意味着恰好访问链表的所有节点。链表始终包含一个 `START` 指针，它存储链表第一个节点的地址并也代表链表的开始，以及一个代表链表结束的\
  \ `NULL` 指针。为了遍历链表，我们将使用另一个指针指针变量 `PTR`，它指向当前正在访问的节点。遍历链表的算法如下：\n\n##### 遍历链表的算法\n\
  \n```\n Step 1: Set PTR = START\nStep 2: Repeat Steps 3 & 4 while PTR != NULL\n\
  Step 3: Print PTR -> INFO\nStep 4: Set PTR = PTR -> NEXT\n            [End of Loop]\n\
  Step 5: Exit\n```\n\n##### b) 在链表中查找给定值\n\n\n\n\n\n在链表中查找值意味着在链表中找到某个特定的元素/值。正如我们之前讨论过的，链表中的节点包含两个部分：一部分是信息部分，另一部分是地址部分。因此，搜索是指查找给定值是否存在于任何节点的信息部分的过程。如果该值存在，则返回该特定值的地址，并认为搜索成功；否则，搜索失败。链表始终包含一个\
  \ `START` 指针，它存储链表第一个节点的地址，并代表链表的开始；以及一个 `NULL` 指针，它代表链表的末尾。此外，还有另一个变量 `PTR`，它将指向当前访问的节点。`SEARCH_VAL`\
  \ 是要在链表中查找的值，而 `POS` 是找到该值时节点的位置/地址。在链表中查找一个值的算法如下：\n\n### 在链表中查找一个值的算法\n\n```\n\
  \ Step 1: Set PTR = START\nStep 2: Repeat Step 3 while PTR != NULL\nStep 3: IF SEARCH_VAL\
  \ = PTR -> INFO\n            Set POS = PTR \n            Print Successful Search!!\n\
  \            Go to Step 5\n            [End of If]\n            ELSE\n         \
  \   Set PTR = PTR -> NEXT\n            [End of Loop]\nStep 4: Print Unsuccessful\
  \ Search!!\nStep 5: Exit\n```\n\n例如，如果我们有一个链表并且我们要在列表中查找 15，那么步骤所示：\n\n![figure](img/00066.jpeg)\n\
  \n***图 4.3*** 查找链表的示例。\n\n### c) 在链表中插入新节点\n\n在这里，我们将学习如何向现有的链表中插入一个新节点。我们将讨论插入过程中的三种情况，包括：\n\
  \n1. 新节点插入在链表的开头。\n2. 新节点插入在链表的末尾。\n3. 新节点插入在链表中给定节点之后。\n\n现在让我们详细地讨论所有这些情况。\n\n\
  #### 1. 在链表的开头插入新节点\n\n在向链表开头插入新节点的情况下，我们首先会检查溢出条件（overflow condition），即是否有足够的内存分配给新节点。如果内存不可用，则显示溢出信息；否则，则为新节点分配内存。现在，我们将用其信息部分初始化节点，其地址部分将包含链表第一个节点的地址，即\
  \ `START` 指针。因此，新节点作为链表中的第一个节点添加，且 `START` 指针将指向链表的第一个节点。为了更好地理解，让我们来看一个例子。考虑如下所示的链表，它有五个节点；一个新节点将插入到链表的开头。\n\
  \n![figure](img/00067.jpeg)\n\n***图 4.4*** 在链表开头插入新节点。\n\n从上一个例子中，可以清楚地看到新节点如何插入到已经存在的链表中。现在让我们来理解它的算法：\n\
  \n#### 在链表开头插入新节点的算法\n\n```\n Step 1: START\nStep 2: IF PTR = NULL\n           \
  \ Print OVERFLOW\n            Go to Step 8\n            [End of If]\nStep 3: Set\
  \ NEW NODE = PTR\nStep 4: Set PTR = PTR -> NEXT\nStep 5: Set NEW NODE -> INFO =\
  \ VALUE\nStep 6: Set NEW NODE -> NEXT = START\nStep 7: Set START = NEW NODE\nStep\
  \ 8: EXIT\n```\n\n#### 2. 在链表的末尾插入新节点\n\n为了在链表的末尾插入新节点，我们首先会检查溢出条件，即是否有足够的内存分配给新节点。如果内存不可用，则显示溢出信息；否则，则为新节点分配内存。然后，创建一个\
  \ `PTR` 变量，它初始指向 `START`，并被用于遍历链表直到到达最后一个节点。当它到达最后一个节点时，最后一个节点的 `NEXT` 部分将存储新节点的地址，而\
  \ `NEW NODE` 的 `NEXT` 部分将包含 `NULL`，这表示链表的末尾。让我们通过算法来理解这一点：\n\n#### 在链表末尾插入新节点的算法\n\
  \n```\n Step 1: START\nStep 2: IF PTR = NULL\n            Print OVERFLOW\n     \
  \       Go to Step 10\n            [End of If]\nStep 3: Set NEW NODE = PTR\nStep\
  \ 4: Set PTR = PTR -> NEXT\nStep 5: Set NEW NODE -> INFO = VALUE\nStep 6: Set NEW\
  \ NODE -> NEXT = NULL\nStep 7: Set PTR = START\nStep 8: Repeat Step 8 while PTR\
  \ -> NEXT != NULL\n            Set PTR = PTR -> NEXT\n            [End of Loop]\n\
  Step 9: Set PTR -> NEXT = NEW NODE\nStep 10: EXIT\n```\n\n从上一个算法中，我们理解了如何在已经存在的链表末尾插入新节点。现在我们将通过一个例子进一步学习。考虑如下所示的链表，它有四个节点，一个新节点将插入到链表的末尾：\n\
  \n![figure](img/00068.jpeg)\n\n***图 4.5*** 在链表末尾插入新节点。\n\n#### 3. 在给定节点之后插入新节点\n\
  \n在这种情况下，新节点插入在给定节点之后。与其它情况一样，我们将再次检查溢出条件。如果新节点的内存可用，则进行分配；否则，打印溢出信息。然后创建一个 `PTR`\
  \ 变量，它初始指向 `START`，并用于遍历链表直到到达要插入新节点的节点。当它到达该节点时，该节点的 `NEXT` 部分将存储新节点的地址，而 `NEW\
  \ NODE` 的 `NEXT` 部分将包含链表中的下一个节点。让我们通过例子来理解这一点。考虑一个有四个节点的链表，新节点将插入到给定节点之后：\n\n![figure](img/00069.jpeg)\n\
  \n***图 4.6*** 在给定节点之后插入新节点。\n\n\n\n\n从上一个例子中，我们可以清楚地看到如何从已存在的链表中删除节点。现在让我们来理解它的算法：\n\
  \n### 从链表头部删除节点的算法\n\n```\n Step 1: START\nStep 2: IF START = NULL\n           \
  \ Print UNDERFLOW\n            [End Of If]\nStep 3: Set PTR = START\nStep 4: Set\
  \ START = START -> NEXT\nStep 5: FREE PTR\nStep 6: EXIT\n```\n\n![figure](img/00070.jpeg)\n\
  \n图 4.7 从链表头部删除节点。\n\n\n\n在在上一个算法中，我们首先检查上溢（underflow）条件，即链表中是否存在任何节点。如果没有节点，则将打印上溢信息；否则，我们移动到第\
  \ 3 步，在这一步中我们将 `PTR` 初始化为 `START`，即 `PTR` 现在将存储第一个节点的地址。在下一步中，`START` 移动到第二个节点，因为现在\
  \ `START` 将存储第二个节点的地址。因此，第一个节点被删除了，由 `PTR` 占据的内存（最初为链表的第一个节点）被释放了。\n\n### 从链表尾部删除节点\n\
  \n在从链表尾部删除节点的情况下，我们首先检查上溢条件。当 `START` 指针等于 `NULL` 时存在这种情况。因此，如果条件为真，则在屏幕上打印上溢信息；否则，从链表中删除该节点。考虑如下所示具有五个节点的链表；该节点将从链表的尾部被删除。\n\
  \n![figure](img/00071.jpeg)\n\n图 4.8 从链表尾部删除节点。\n\n现在让我们来理解从链表尾部删除节点的算法。\n\n###\
  \ 从链表尾部删除节点的算法\n\n```\n Step 1: START\nStep 2: IF START = NULL\n            Print\
  \ UNDERFLOW\n            [End Of If]\nStep 3: Set PTR = START\nStep 4: Repeat while\
  \ PTR -> NEXT != NULL\n            Set PREV = PTR\n            Set PTR = PTR ->\
  \ NEXT\n            [End of Loop]\nStep 5: Set PREV -> NEXT = NULL\nStep 6: FREE\
  \ PTR\nStep 7: EXIT\n```\n\n在上一个算法中，我们再次检查上溢条件。如果条件为真，则打印上溢信息；否则，将 `PTR` 初始化为指针\
  \ `START`，即 `PTR` 指向链表的第一个节点。在循环中，我们取了另一个指针变量 `PREV`，它将始终指向 `PTR` 节点的前一个节点。在到达链表的倒数第二个节点和最后一个节点后，我们将\
  \ `PREV` 的下一个部分设置为 `NULL`。因此，最后一个节点被删除了，`PTR` 节点占据的内存现在变为空闲了。\n\n### 在链表给定节点之后删除节点\n\
  \n在从链表给定节点之后删除节点的情况下，我们将再次像在其他两种情况那样检查上溢条件。当 `START` 指针等于 `NULL` 时存在这种情况。因此，如果条件为真，则打印上溢信息；否则，从链表中删除该节点。考虑如下所示最初具有五个节点的链表；该节点将从链表的给定节点之后被删除。\n\
  \n![figure](img/00072.jpeg)\n\n图 4.9 在链表给定节点之后删除节点。\n\n现在让我们通过算法的帮助来理解上一个情况。\n\n\
  ### 在链表给定节点之后删除节点的算法\n\n```\n Step 1: START\nStep 2: IF START = NULL\n         \
  \   Print UNDERFLOW\n            [End Of If]  \nStep 3: Set PTR = START\nStep 4:\
  \ Set PREV = START\nStep 5: Repeat while PREV  -> INFO != GIVEN_VAL\n          \
  \  Set PREV = PTR\n            Set PTR = PTR -> NEXT\n            [End of Loop]\n\
  Step 6: Set PREV -> NEXT = PTR -> NEXT\nStep 7: FREE PTR\nStep 8: EXIT\n```\n\n\
  在上一个算法中，我们首先检查上溢条件。如果条件为真，则打印上溢信息；否则，将 `PTR` 初始化为指针 `START`，即 `PTR` 指向链表的第一个节点。在循环中，我们取了另一个指针变量\
  \ `PREV`，它将始终指向 `PTR` 节点的前一个节点。在到达包含要删除的给定值的节点，我们将包含给定值的节点的下一个指针设置为后续节点下一个部分所包含的地址。因此，节点被删除了，`PTR`\
  \ 占据的内存现在变为空闲了。\n\n### 两个链表的合并\n\n合并的链表是通过将两个不同大小的链表合并成一个链表的过程创建的。让我们通过一个 C 函数来理解合并的概念：\n\
  \n```c\n void concatenate(struct node *head1, struct node\n*head2)\n{\n struct node\
  \ *ptr;\n ptr = head1;\n while(ptrnext!= NULL)\n  {\n    ptr = ptrnext;\n  }\n ptrnext\
  \ = head2 ;\n}\n```\n\n### 链表排序\n\n排序是将数据元素按顺序排列的过程，可以是升序或降序。在这里我们对链表的信息进行排序。让我们通过一个\
  \ C 函数来理解它：\n\n```c\n void sorting()\n{\n int new;\n struct node *ptr, *temp;\n\
  \ ptr = start;\n while(ptrnext!= NULL)\n  {\n    temp = ptrnext;\n    while(temp!=NULL)\n\
  \     {\n       if(ptrinfo > tempinfo)\n         {\n          temp = ptrinfo;\n\
  \          ptrinfo = tempinfo;\n          tempinfo = new;\n         }\n       temp\
  \ = tempnext;\n     }\n    ptr = ptrnext;\n  }\n}\n```\n\n### 反转链表\n\n在线性链表反转过程中，我们将三个指针变量，即\
  \ `PREV`、`PTR` 和 `NEW`，它们分别持有链向前一个节点、当前节点和下一个节点的地址。我们将从第一个节点的地址开始，该地址由另一个指针变量 `START`\
  \ 持并赋值给 `PTR`，而 `PREV` 被赋值为 `NULL`。现在，让我们通过一个 C 函数来理解：\n\n```c\n void reverse_list()\n\
  {\n ptr = start;\n prev = NULL;\n while(ptr != NULL)\n  {\n    new = ptrnext;\n\
  \    ptrnext = prev;\n    prev = ptr;\n    ptr = new;\n  }\n}\n```\n\n编写一个单链表的菜单驱动程序，执行所有情况的插入和删除。\n\
