  \ 8 ![figure](img/00011.jpeg)\n\n# 第 8 章 树\n\n### 引言\n\n在之前的章节中，我们学习了线性数据结构，如数组、链表、栈和队列。然而，某些现实世界的数据无法以线性方式表示。例如，计算机的文件系统或家谱树自然地是分层表示的。\n\
  \n树是一种非线性数据结构，用于以分层的方式表示数据。树由一组节点和连接它们的边组成。树最顶部的节点称为根。没有子节点的称为叶节点。\n\n### 8.1 定义\n\
  \n树是某种由边连接的节点集合，使得任意两个节点之间有且一条路径。根节点是没有父节点的节点。除了根节点外的每个节点都有一个父节点。节点的儿子是指直接位于其下方的节点。节点的高度是从节点到叶节点的最长上的边数。节点的深度是从根到该节点的边数。树的高度是根节点的高度。\n\
  \n二叉树是每个节点最多有两个子节点的树，通常称为左孩子和右孩子。满二叉树是指每个节点要么有零子节点要么有两个子节点的二叉树。完全二叉树是指除了最后一层外，所有层都是完全满的，且最后一层从左到右填充的二叉树。平衡二叉树是指任意节点的左右子树高度差不超过\
  \ 1 的二叉树。\n\n二叉搜索树 (BST) 是一种二叉树，对于每个节点，左子树的所有节点小于该节点的值，右子树的所有节点大于该节点的值。\n\n### 8.2\
  \ 应用\n\n树用于许多应用程序，包括：\n- 文件系统：目录和文件按树结构组织。\n- 数据库索引：B 树和 B+树用于高效数据检索。\n- 网络协议：路由表使用树来确定数据包的最佳路径。\n\
  - HTML 中的 DOM：文档对象模型 (DOM) 是 HTML 文档的树表示。\n\n### 总结\n\n- 树是用于表示分层数据的数据结构。\n- 树由节点和边组成。\n\
  - 根是最顶部的节点。\n- 叶节点是没有子节点的节点。\n- 二叉树每个节点最多有两个孩子。\n- 二叉搜索树用于高效搜索和插入。\n\n\n\n\n\n-\
  \   **兄弟节点 (Siblings)** – 给定父节点的子节点被称为兄弟节点。在图 8.8 中，`X` 和 `Y` 是 `B` 的兄弟节点。\n\n![figure](img/00184.jpeg)\n\
  \n*图 8.8*. 兄弟节点。\n\n- **节点度 (Degree of a node)** – 等于节点节点拥有的节点数量。\n\n- **出度 (Out-degree\
  \ of a node)** – 等于离开该节点的边数。\n\n- **入度 (In-degree of a node)** – 等于到达该节点的边数。\n\n\
  - **深度 (Depth)** – 给出为从根节点到目标节点的路径长度。\n\n### 8.3 二叉树\n\n二叉树是节点集合，其中每个节点包含三个部分，即左指针、右指针和数据项。左指针指向左子树，右指针指向右子树。二叉树最顶部的元素被称为根节点。根指针指向根节点。正如其名，二叉树最多有两个孩子，即一个父节点可以有零、一个或最多两个孩子。此外，如果\
  \ `root = NULL`，则意味着树是空的。图 8.9 表示了一棵二叉树。\n\n在接下来的图中，`A` 代表树的根节点。`B` 和 `C` 是根节点 `A`\
  \ 的孩子。节点 `B`、`D`、`E`、`F` 和 `G` 构成左子树。同样，节点 `C`、`H`、`I` 和 `J` 构成右子树。现在，节点 `G`、`E`、`F`、`I`\
  \ 和 `J` 是二叉树的终端/叶子节点，因为它们没有孩子。因此，节点 `A` 有两个后继 `B` 和 `C`。节点 `B` 有两个后继 `D` 和 `G`。同样，节点\
  \ `D` 也有两个后继 `E` 和 `F`。节点 `G` 没有后继。节点 `C` 只有一个后继 `H`。节点 `H` 有两个后继 `I` 和 `J`。由于节点\
  \ `E`、`F`、`G`、`I` 和 `J` 没有后继，它们被认为具有空子树。\n\n![figure](img/00185.jpeg)\n\n*图 8.9*.\
  \ 一棵二叉树。\n\n### 8.3.1 二叉树的类型\n\n二叉树有两种：\n\n1. **完全二叉树 (Complete Binary Trees)**\
  \ – 完全二叉树是满足/符合两个属性的二叉树：\n\na. 第一，完全二叉树中除最后一层外，每一层必须完全填满。\n\nb. 第二，完全二叉树中的所有节点必须尽可能地向左出现。\n\
  \n在完全二叉树中，第 `n` 层的节点数为 `2^n`。此外，深度为 `d` 的完全二叉树的节点总数等于 `0` 到 `d` 之间每层所有节点数之和。\n\n\
  ![figure](img/00186.jpeg)\n\n*图 8.10*. 完全二叉树。\n\n2. **扩展二叉树 (Extended Binary Trees)**\
  \ – 扩展二叉树也称为 2T-树。当且仅当二叉树中的每个节点要么有零孩子要么有两个孩子时，该二叉树被认为是扩展二叉树。在扩展二叉树中，拥有两个孩子的节点被称为内部节点。相反，没有孩子的节点被称为外部节点。在接下来的图中，内部节点由\
  \ `I` 表示，外部节点由 `E` 表示。\n\n![figure](img/00187.jpeg)\n\n*图 8.11*. 扩展二叉树。\n\n### 8.3.2\
  \ 二叉树的内存表示\n\n二叉树可以通过以下两种方式之一在计算机内存中表示：\n\n1. 二叉树的数组表示\n\n2. 二叉树的链表表示\n\n现在，让我们详细讨论这两种方式。\n\
  \n#### 二叉树的数组表示\n\n二叉树使用计算机内存中的数组来表示。它也被称为顺序表示法。二叉树的顺序表示是使用一维（1-D）数组完成的。这种表示法是静态的，因此是低效的，因为必须提前知道大小，因此需要大量的内存空间。使用以下规则来决定每个节点在内存中的位置：\n\
  \na. 树的根节点存储在第一个位置。\n\nb. 如果父节点位于位置 `k`，则左孩子存储在位置 `2k`，右孩子存储在位置 `(2k + 1)`。\n\n\
  c. 数组的最大尺寸给出为 `(2^h – 1)`，其中 `h` 是树的高度。\n\n**举例** – 给定如下的二叉树。给出它在内存中的数组表示。\n\n![figure](img/00188.jpeg)\n\
  \n*图 8.12*. 二叉树及其数组表示。\n\n#### 二叉树的链表表示\n\n二叉树也可以使用计算机内存中的链表来表示。这种表示法是动态的，因为内存是按需分配的，即在需要时），因此是高效的并避免了内存空间的浪费。在链表表示中，每个节点都有三个部分：\n\
  \n1. `1^(st` 部分被称为左指针，包含左子树的地址。\n\n2. `2^(nd` 部分被称为数据部分，包含节点的信息。\n\n3. `3^(rd` 部分被称为右指针，包含右子树的地址。\n\
  \n节点的结构定义如下：\n\n```\nstruct node\n{\nstruct node *leftchild;\nint information;\n\
  struct node *rightchild;\n}\n```\n\n当节点没有孩子时，情况下指针字段为 NULL。\n\n**举例** – 给定如下的二叉树。给出它在内存中的链表表示。\n\
  \n![figure](img/00189.jpeg)\n\n![figure](img/00190.jpeg)\n\n*图 8.13*. 二叉树及其链表表示。\n\
  \n### 8.4 二搜索树\n\n二搜索树（BST）是二叉树的一种变体。二搜索树的特殊属性是左子树中的所有节点都小于根节点。同样，右子树中的所有节点都大于根节点。因此，二搜索树也被称为有序二叉树，因为二搜索树中的所有节点都是有序的。此外，左、子树也是二叉树，因此相同的属性适用于每个子树。图\
  \ 8.14 表示了一棵键值有序的二叉树。\n\n![figure](img/00191.jpeg)\n\n*图 8.14*. 二搜索树。\n\n现在，在之前的图中，根节点是\
  \ `50`。根节点的左子树由节点 `19`、`7`、`32`、`25` 和 `43`组成。我们可以看到所有节点的值都小于根节点，因此构成了左子树。同样，根节点的右子树由节点\
  \ `75`、`87`、`80` 和 `99`组成。在这里我们也可以看到所有节点的值都大于根节点，因此构成了右子树。\n\n### 8.4.1 二搜索树的操作\n\
  \n在本节中，我们将讨论在二搜索树上进行的不同操作，包括：\n\n- 在二搜索树中查找节点/键\n\n- 在二搜索树中插入节点/键\n\n- 从二搜索树中删除节点/键\n\
  \n- 删除整个二搜索树\n\n- 寻找二搜索树的镜像\n\n- 寻找二搜索树中最小的节点\n\n- 寻找二搜索树中最大的节点\n\n- 确定二搜索树的高度\n\
  \n现在，让我们详细讨论所有这些操作。\n\n\n\n\n\n# 1. 在二叉搜索树中查找节点/键\n\n查找操作是二叉搜索树中执行常见的操作之一。执行此操作是为了查找给定的键是否存在于树中。查找操作从根节点开始。首先，它会检查树是否为空。如果树为空，则说明我们要查找的节点/键在树中不存在，算法在此处终止并显示适当的消息。如果树不为空且其中存在节点，则查找函数将检查要查找的节点/值，并将其与当前节点的键值进行比较。如果要查找的节点/键小于当前节点的键值，那么在这种情况下，我们将递归调用左子节点。另一方面，如果要查找的节点/键大于当前节点的键值，则我们递归调用右子节点。现在，让我们来看在二叉搜索树中查找键的算法。\n\
  \n## 在二叉搜索树中查找节点/键的算法\n\n```\n SEARCH(ROOT, VALUE)\nStep 1: START\nStep 2: IF(ROOT\
  \ == NULL)\n            Return NULL\n            Print “Empty Tree”\n          \
  \  ELSE IF(ROOT -> INFO == VALUE)\n            Return ROOT\n            ELSE IF(ROOT\
  \ -> INFO > VALUE)\n            SEARCH(ROOT -> LCHILD, VALUE)\n            ELSE\
  \ IF(ROOT -> INFO < VALUE)\n            SEARCH(ROOT -> RCHILD, VALUE)\n        \
  \    ELSE\n            Print “Value not found”\n            [End of IF]\n      \
  \      [End of IF]\n            [End of IF]\n            [End of IF]\nStep 3: END\n\
  ```\n\n在前面的算法中，我们首先检查树是否为空。如果树为空，我们返回 `NULL`。如果树不为空，我们检查存储在当前节点（`ROOT`）的值是否等于我们要查找的节点/键。如果\
  \ `ROOT` 节点的值等于要查找的键值，我们返回树的当前节点，即 `ROOT` 节点。否则，如果要查找的键值小于当前节点存储的值，我们递归调用左子树。如果要查找的键值大于当前节点存储的值，则我们递归调用右子树。最后，如果没有找到该值，则会在屏幕上打印一条适当的消息。\n\
  \n#### 示例\n\n我们被给了一个二叉搜索树。现在，在二叉搜索树中查找值为 20 的节点。\n\n初始二叉搜索树如下：\n\n![figure](img/00192.jpeg)\n\
  \n**图 8.15(a)**\n\n**步骤 1：** 首先，检查根节点，即 41。\n\n![figure](img/00193.jpeg)\n\n**图\
  \ 8.15(b)**\n\n**步骤 2：** 第二，由于存储在根节点的值不等于要查找的值，但我们知道 20 < 41，因此我们将遍历左子树。\n\n![figure](img/00194.jpeg)\n\
  \n**图 8.15(c)**\n\n**步骤 3：** 我们知道 10 不是要查找的值，但 20 > 10；因此，我们现在针对 10 遍历右子树。\n\n![figure](img/00195.jpeg)\n\
  \n**图 8.15(d)**\n\n**步骤 4：** 再次 25 不是要查找的值，但 20 < 25；因此，我们现在针对 25 遍历左子树。\n\n![figure](img/00196.jpeg)\n\
  \n**图 8.15.** 在二叉搜索树中查找值为 20 的节点。\n\n最后，在二叉搜索树中成功找到了值为 20 的节点。\n\n# 2. 在二叉搜索树中插入节点/键\n\
  \n插入操作是为了在二叉搜索树中插入一个带有给定值的新节点。新节点按照二叉搜索树的约束插入在正确的位置。它不应违反二叉搜索树的属性。插入操作也从根节点开始。首先，它会检查树是否为空。如果树为空，我们将为新节点分配内存。如果树不为空，我们将要插入的键值与当前节点中存储的值进行比较。如果要插入的节点/键小于当前节点的键值，则将新节点插入左子树。另一方面，如果要插入的节点/键大于当前节点的键值，则将新节点插入右子树。现在，让我们讨论在二叉搜索树中插入节点的算法。\n\
  \n```\n INSERT(ROOT, VALUE)\nStep 1: START\nStep 2: IF(ROOT == NULL)\n         \
  \   Allocate memory for ROOT node\n            Set ROOT -> INFO = VALUE\n      \
  \      Set ROOT -> LCHILD = ROOT -> RCHILD = NULL\n            [End of IF]\nStep\
  \ 3: IF(ROOT -> INFO > VALUE)\n            INSERT(ROOT -> LCHILD, VALUE)\n     \
  \       ELSE\n            INSERT(ROOT -> RCHILD, VALUE)\n            [End of IF]\n\
  Step 4: END\n```\n\n在前面的算法中，我们首先检查树是否为空。如果树为空，我们返回 `NULL`。如果树不为空，我们检查存储在当前节点（`ROOT`）的值是否等于我们要查找的节点/键。如果\
  \ `ROOT` 节点的值等于要查找的键值，我们返回树的当前节点，即 `ROOT` 节点。否则，如果要查找的键值小于当前节点存储的值，我们递归调用左子树。如果要查找的键值大于当前节点存储的值，则我们递归调用右子树。最后，如果没有找到该值，则会在屏幕上打印一条适当的消息。\n\
  \n#### 示例\n\n我们被给了一个二叉搜索树。现在，在二叉搜索树中查找值为 20 的节点。\n\n初始二叉搜索树如下：\n\n![figure](img/00197.jpeg)\n\
  \n**图 8.16(a)**\n\n**步骤 1：** 首先，检查根节点，即 41。如果树不为空，我们将要插入的键值与当前节点存储的值进行比较。\n\n![figure](img/00198.jpeg)\n\
  \n**图 8.16(b)**\n\n**步骤 2：** 第二，由于存储在根节点的值不等于要查找的值，但我们知道 20 < 41，因此我们将遍历左子树。\n\n\
  ![figure](img/00199.jpeg)\n\n**图 8.16(c)**\n\n**步骤 3：** 我们知道 10 不是要查找的值，但 20 > 10；因此，我们现在针对\
  \ 10 遍历右子树。\n\n![figure](img/00200.jpeg)\n\n**图 8.16(d)**\n\n**步骤 4：** 再次 25 不是要查找的值，但\
  \ 20 < 25；因此，我们现在针对 25 遍历左子树。\n\n![figure](img/00201.jpeg)\n\n**图 8.16.** 在二叉搜索树中插入值为\
  \ 7 的节点。\n\n最后，值为 7 的节点被插入到二叉搜索树。\n\n# 3. 从二叉搜索树中删除节点/键\n\n从二叉搜索树中删除节点/键是一个关键的过程。在执行删除操作时必须小心；在删除节点时，我们必须确保不违反二叉搜索树的属性，以免在在此过程中丢失必要的节点。删除操作分为以下三种情况：\n\
  \n## 情况 1：删除没有子节点的节点\n\n这是删除最简单的情况，因为我们可以直接移除没有子节点的节点。查看图 8.17 中的二叉搜索树，看看这种情况下是如何删除的。\n\
  \n#### 示例\n\n我们被给了一个二叉搜索树。现在，从二叉搜索树中删除值为 61 的节点。\n\n初始二叉搜索树如下：\n\n![figure](img/00202.jpeg)\n\
  \n**图 8.17(a)**\n\n**步骤 1：** 首先，通过检查根节点检查树是否为空。\n\n![figure](img/00203.jpeg)\n\n\
  **图 8.17(b)**\n\n**步骤 2：** 第二，由于根节点存在，我们将待删除的值与当前节点存储的值进行比较。由于 61 > 24，因此我们将递归遍历右子树。\n\
  \n![figure](img/00204.jpeg)\n\n**图 8.17(c)**\n\n**步骤 3：** 再次，我们将待删除的值与当前节点存储的值进行比较。由于\
  \ 61 > 42，因此我们将递归遍历右子树。\n\n![figure](img/00205.jpeg)\n\n**图 8.17(d)**\n\n\n\n\n\n\
  ## 第 4 步：最后，从二叉搜索树中删除值为 61 的节点。\n\n![figure](img/00206.jpeg)\n\n图 8.17。从二叉搜索树中删除值为\
  \ 61 的节点。\n\n### 情况 2：删除有一个子节点的节点\n\n在这种删除情况下，要删除的节点（即父节点）简单地被其子节点替换。查看图 8.18 所示的二叉搜索树，并在这种情况下是如何进行删除的。\n\
  \n**示例** – 我们被给了一个二叉搜索树。现在，从二叉搜索树中删除值为 10 的节点。\n\n初始给定的二叉搜索树如下：\n\n![figure](img/00207.jpeg)\n\
  \n图 8.18(a)\n\n**步骤 1：** 首先，我们将通过检查根节点来检查树是否为空。\n\n![figure](img/00208.jpeg)\n\n\
  图 8.18(b)\n\n**步骤 2：** 其次，由于根节点存在，我们将待删除的值与当前节点中存储的值进行比较。由于 `10 < 24`，因此我们将递归地遍历左子树。\n\
  \n![figure](img/00209.jpeg)\n\n图 8.18(c)\n\n**步骤 3：** 现在，由于找到了要删除的节点且它有一个子节点，因此要删除的节点现在被其子节点替换，并删除该实际节点。\n\
  \n![figure](img/00210.jpeg)\n\n图 8.18。从二叉搜索树中删除值为 10 的节点。\n\n### 情况 3：删除有两个子节点的节点\n\
  \n在这种情况下，要删除的节点简单地被其中序前驱节点（即左子树中的最大值）或其中序后继节点（即右子树中的最小值）替换。此外，中序前驱或中序后继可以使用上述两种情况中的任何一种来删除。现在，查看图\
  \ 8.19 所示的二叉搜索树，看看在这种情况下删除将如何发生。\n\n现在，让我们讨论从二叉搜索树中删除节点的算法。\n\n**示例** – 我们被给了一个二叉搜索树。现在，从二叉搜索树中删除值为\
  \ 42 的节点。\n\n初始给定的二叉搜索树如下：\n\n![figure](img/00211.jpeg)\n\n图 8.19(a)\n\n**步骤 1：**\
  \ 首先，我们将通过检查根节点来检查树是否为空。\n\n![figure](img/00212.jpeg)\n\n图 8.19(b)\n\n**步骤 2：**\
  \ 其次，由于根节点存在，我们将待删除的值与当前节点中存储的值进行比较。由于 `42 <> 24`，因此我们将递归地遍历右子树。\n\n![figure](img/00213.jpeg)\n\
  \n图 8.19(c)\n\n**步骤 3：** 由于找到了要删除的节点且它有两个子节点，现在现在找到找到当前节点（`42`）的中序前驱，并用其中序前驱替换当前节点，从而删除实际节点\
  \ 42。\n\n![figure](img/00214.jpeg)\n\n图 8.19。从二叉搜索树中删除值为 42 的节点。\n\n### 从二叉搜索树中删除节点/键的算法\n\
  \n```\n DELETE_NODE(ROOT, VALUE)\nStep 1: START\nStep 2: IF(ROOT == NULL)\n    \
  \        Print “Error”\n            [End of IF]\nStep 3: IF(ROOT -> INFO > VALUE)\n\
  \            DELETE_NODE(ROOT -> LCHILD, VALUE)\n            ELSE IF(ROOT -> INFO\
  \ < VALUE)\n            DELETE_NODE(ROOT -> RCHILD, VALUE)\n            ELSE\n \
  \           IF(ROOT -> LCHILD = NULL & ROOT -> RCHILD =\n            NULL)\n   \
  \         FREE(ROOT)\n            ELSE IF(ROOT -> LCHILD & ROOT -> RCHILD)\n   \
  \         TEMP = FIND_LARGEST(ROOT -> LCHILD)\n            OR\n            TEMP\
  \ = FIND_SMALLEST(ROOT -> RCHILD)\n            Set ROOT -> INFO = TEMP -> INFO\n\
  \            FREE(TEMP)\n            ELSE\n            IF(ROOT -> LCHILD != NULL)\n\
  \            Set TEMP = ROOT -> LCHILD\n            Set ROOT -> INFO = TEMP -> INFO\n\
  \            FREE(TEMP)\n            ELSE\n            Set TEMP = ROOT -> RCHILD\n\
  \            Set ROOT -> INFO = TEMP -> INFO\n            FREE(TEMP)\n         \
  \   [End of IF]\n            [End of IF]\n            [End of IF]\nStep 4: END\n\
  ```\n\n在之前的算法中，我们首先检查树是否为空。如果树为空，则不存在要删除的节点。否则，如果树不为空，我们将检查要删除的节点/值是否小于当前节点中存储的值。如果待删除的值较小，我们将递归调用左子树。如果待删除的值大于当前节点中存储的值，则我们递归调用右子树。\n\
  \n### 4. 删除整个二叉搜索树\n\n删除整棵树非常简单。首先，我们将删除左子树中的所有节点，然后删除右子树中的所有节点。最后，删除根节点。\n\n**删除整个二叉搜索树的算法**\n\
  \n```\n DELETE_BST(ROOT)\nStep 1: START\nStep 2: IF(ROOT != NULL)\n            DELETE_BST(ROOT\
  \ -> LCHILD)\n            DELETE_BST(ROOT -> RCHILD)\n            FREE(ROOT)\n \
  \           [End of IF]\nStep 3: END\n```\n\n### 5. 二叉搜索树的镜像\n\n这是二叉搜索树中执行的一项令人兴奋的操作。二叉搜索树的镜像意味着在每个节点交换右子树和左子树。\n\
  \n![figure](img/00215.jpeg)\n\n图 8.20。二叉搜索树及其镜像。\n\n**寻找二叉搜索树镜像的算法**\n\n```\n MIRROR_IMAGE(ROOT)\n\
  Step 1: START\nStep 2: IF(ROOT != NULL)\n            MIRROR_IMAGE(ROOT -> LCHILD)\n\
  \            MIRROR_IMAGE(ROOT -> RCHILD)\n            Set TEMP = ROOT -> LEFT\n\
  \            ROOT -> LEFT = ROOT -> RIGHT\n            Set ROOT -> RIGHT = TEMP\n\
  \            [End of IF]\nStep 3: END\n```\n\n### 6. Find 二叉搜索树中的最小值\n\n我们知道二叉搜索树的基本特性是最小值位于左子树的最左侧。如果没有左子树，则根节点的值最小。因此，要在二叉搜索树中找到最小值，我们只需找到位于左子树最左侧的节点的值。\n\
  \n**在二叉搜索树中寻找最小值的算法**\n\n```\n SMALLEST_VALUE(ROOT)\nStep 1: START\nStep 2: IF(ROOT\
  \ == NULL OR ROOT -> LCHILD == NULL)\n            Return ROOT\n            ELSE\n\
  \            Return SMALLEST_VALUE(ROOT -> LCHILD)\nStep 3: END\n```\n\n### 7. Find\
  \ 二叉搜索树中的最大值\n\n我们知道二叉搜索树的基本特性是最大值总是位于右子树的最右侧。如果没有右子树，根节点的值就是最大的。因此，要在二叉搜索树中找到最大值，我们只需找到位于右子树最右侧的节点的值。\n\
  \n**在二叉搜索树中寻找最大值的算法**\n\n```\n LARGEST_VALUE(ROOT)\nStep 1: START\nStep 2: IF(ROOT\
  \ == NULL OR ROOT -> RCHILD == NULL)\n            Return ROOT\n            ELSE\n\
  \            Return LARGEST_VALUE(ROOT -> RCHILD)\nStep 3: END\n```\n\n\n\n\n\n\
  # 8. 确定二叉搜索树的高度\n\n二叉搜索树的高度可以很容易确定。我们首先计算左子树和右子树的高度。哪一个高度较大，就在该高度上加 1；也就是说，如果左子树的高度较高，则在左子树的高度上加\
  \ 1。同样，如果右子树的高度较高，则在右子树的高度上加 1。\n\n### 确定二叉搜索树高度的算法\n\n```\n CALCULATE_HEIGHT(ROOT)\n\
  Step 1: START\nStep 2: IF ROOT = NULL\n            Print “Can’t find height of the\
  \ tree.”\n            ELSE\n            Set LHEIGHT = CALCULATE_HEIGHT(ROOT -> LCHILD)\n\
  \            Set RHEIGHT = CALCULATE_HEIGHT(ROOT -> RCHILD)\n            IF(LHEIGHT\
  \ < RHEIGHT)\n            Return (RHEIGHT) + 1\n            ELSE\n            Return\
  \ (LHEIGHT) + 1\n            [End of IF]\n            [End of IF]\nStep 3: END\n\
  ```\n\n### 8.4.2 二叉树遍历方法\n\n遍历按照特定顺序访问树中每个节点的过程。我们都知道树是非线性数据结构，因此树可以用多种方式进行遍历。共有三种类型的遍历，分别是：\n\
  \n• 前序遍历\n• 中序遍历\n• 后序遍历\n\n现在，我们将详细讨论所有这些遍历。\n\n### 前序遍历\n\n在前序遍历中，在每个节点上递归地执行以下操作：\n\
  \n1. 访问根节点。\n2. 遍历左子树。\n3. 遍历右子树。\n\n前序中的“前（pre）”字决定了根节点在访问树中任何其他节点之前访问。因此，它也被称为\
  \ DLR 遍历，即数据-左-右（Data Left Right）。因此，在 DLR 遍历中，首先访问根节点，然后是左子树和右子树。现在，让我们来看前序遍历的示例。\n\
  \n**示例** – 给定单词 EDUCATION 的二叉树的前序遍历结果。\n\n![figure](img/00216.jpeg)\n\n上一个二叉树的前序遍历为：\n\
  \n![figure](img/00217.jpeg)\n\n现在，让我们来看前序遍历的函数。\n\n```\n void pre-order(struct BST\
  \ * root)\n{\n if(root != NULL)\n  {\n    printf(“%d”, root -> info) ;\n    pre-order(root\
  \ ->lchild) ;\n    pre-order(root ->rchild) ;\n  }\n}\n```\n\n### 中序遍历\n\n在中序遍历中，在每个节点上递归地执行以下操作：\n\
  \n1. 遍历左子树。\n2. 访问根节点。\n3. 遍历右子树。\n\n中序中的“中（in）”字决定了根节点在左子树和右子树之间访问。因此，它也被称为 LDR\
  \ 遍历，即左-数据-右（Left Data Right）。因此，在 LDR 遍历中，首先遍历左子树，然后是根节点和右子树。现在，让我们来看中序遍历的示例。\n\
  \n**示例** – 给定单词 EDUCATION 的二叉树的中序遍历结果。\n\n![figure](img/00218.jpeg)\n\n上一个二叉树的中序遍历为：\n\
  \n![figure](img/00219.jpeg)\n\n现在，让我们来看中序遍历的函数。\n\n```\n void in-order(struct BST\
  \ * root)\n{\n if(root != NULL)\n  {\n    in-order(root ->lchild) ;\n    printf(“%d”,\
  \ root -> info) ;\n    in-order(root ->rchild) ;\n  }\n}\n```\n\n### 后序遍历\n\n在后序遍历中，在每个节点上递归地执行以下操作：\n\
  \n1. 遍历左子树。\n2. 遍历右子树。\n3. 访问根节点。\n\n后序中的“后（post）”字决定了根节点将在左子树和右子树之后最后访问。因此，它也被称为\
  \ LRD 遍历，即左-右-数据（Left Right Data）。因此，在 LRD 遍历中，首先遍历左子树，然后是右子树和根节点。现在，让我们来看后序遍历的示例。\n\
  \n**示例** – 给定单词 EDUCATION 的二叉树的后序遍历结果。\n\n![figure](img/00220.jpeg)\n\n上一个二叉树的后序遍历为：\n\
  \n![figure](img/00221.jpeg)\n\n现在，让我们来看后序遍历的函数。\n\n```\n void post-order(struct\
  \ BST * root)\n{\n if(root != NULL)\n  {\n    post-order(root ->lchild) ;\n    post-order(root\
  \ ->rchild) ;\n    printf(“%d”, root -> info) ;\n  }\n}\n```\n\n编写一个程序来创建二叉搜索树并对其进行不同的操作。\n\
  \n\n\n\n\n```c\n #include<stdio.h>\n#include<malloc.h>\n#include<conio.h>\nstruct\
  \ node\n{\n int info;\n struct node *lchild;\n struct node *rchild;\n};\nstruct\
