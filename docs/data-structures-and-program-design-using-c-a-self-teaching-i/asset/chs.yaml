  \n#### 7.6.4 后缀表达式的求值\n\n借助栈，任何后缀表达式都可以被地求值。后缀表达式中的每个字符都从左到右扫描。求后缀表达式的步骤在算法所示。\n\
  \n**求后缀表达式的算法**\n\n```\n 步骤 1:开始\n步骤 2:如果遇到操作数，将其推入栈中。\n步骤 3:如果遇到运算符“op1”，则执行以下步骤\
  \ –\n            a) 从栈中弹出两个栈元素，其中 X 是栈顶元素，\n               Y 是 X 下方的栈顶元素。\n    \
  \        b) 计算 X op1 Y。\n            c) 将结果推入栈。\n步骤 4:将结果赋值为栈顶顶元素。\n步骤 5:退出\n```\n\
