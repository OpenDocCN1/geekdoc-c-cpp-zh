  ## 6.6 外部排序\n\n`外部排序`（External Sorting）是一种用于数据量极其巨大的排序技术。当需要对大量数据进行排序时，无法将它们全部带入主内存（`RAM`）。因此，在这种情况下需要使用辅助存储器。同时，根据主内存存储空间的可用性，将部分数据从辅助存储器调入主内存进行排序。数据排序完成后，将其送回辅助存储器。现在，将下一部分数据调入主内存，排序后再送回辅助存储器。此过程重复直到所有数据排序完毕。在这里，每一部分被称为一个段。排序所需的时间更多，因为在数据从辅助存储器传输到主内存的过程中花费时间。已经讨论过的归并算法广泛应用于外部排序。\n\
  \n外部排序用于数据库应用程序，以执行连接（join）、并（union）、投影（projection）等多种操作。它还用于从事务文件更新主文件。例如，如果我们根据新员工、现有员工、位置等信息更新公司文件。外部排序也可以删除重复的记录或数据。\n\
  \n## 6.7 总结\n\n- 在列表或数组中查找特定值的过程称为“搜索”。如果该特定值存在于数组中，则认为搜索成功，并通过搜索过程检索出该特定值的位置。\n\
  - `线性查找`（Linear search）、`二分查找`（binary search）和`插值查找`（interpolation search）是常用的搜索技术。\n\
  - `线性查找`通过将待查找的值与数组中的每个元素按线性顺序进行比较，直到找到匹配项为止。\n- `二分查找`在列表已排序时工作效率最高。在二分查找中，我们首先将值\
  \ `VAL`与数组中间位置的数据元素进行比较。\n- `插值查找`也称为外推查找（extrapolation search），是一种在有序数组中查找特定值的技术。在这项搜索技术的每一步中，都会计算待查找值的剩余搜索区域。计算是基于搜索区域边界的值和待查的值进行的。\n\
  - `排序`（Sorting）指的是按照指定的顺序（即升序或降序）排列数组数据元素的技术。\n- `选择排序`（Selection sort）是一种通过找到数组中的最小值并将其放在第一个位置来工作的排序技术。之后，它再次找到次小值并将其放在第二个位置。此过程重复直到完成。\n\
