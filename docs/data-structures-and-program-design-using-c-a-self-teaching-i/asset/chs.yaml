  \n![figure](img/00274.jpeg)\n\n**图 9.4 (b)**\n\n2. 删除 R。\n\n![figure](img/00275.jpeg)\n\
  \n**图 9.4 (c)**\n\n3. 删除 T。\n\n![figure](img/00276.jpeg)\n\n**图 9.4 (d)**\n\n4.\
  \ 删除 E。\n\n![figure](img/00277.jpeg)\n\n**图 9.4 (e)**\n\n5. 删除 L。\n\n![figure](img/00278.jpeg)\n\
  \n**图 9.4 (f)**\n\n### 9.4 B 树的应用\n\nB 树的主要应用是将大量数据或海量记录集合组织成文件结构。B 树应该能够非常高效地搜索记录，并且所有操作（如插入、删除、搜索等）应该非常高效地执行；因此，记录的组织应该非常好。\n\
  \n### 9.5 B+ 树\n\n\n\n\n\n# B+树\n\n`A B+ tree` 是 `B-tree` 的变体，它像 `B-tree` 一样也存储排序的数据。`B-tree`\
  \ 的结构是数据库系统中索引的标准组织方式。`B+ tree` 实现了多级索引，即叶节点构成密集索引，而非叶子节点构成稀疏索引。`B+ tree` 是一种略有不同的数据结构，它允许对数据进行顺序处理并将所有数据存储在树的最底层。`B-tree`\
  \ 可以在内部节点中同时存储记录和键，而 `B+ tree` 将所有记录存储在树的叶节点中，并将键存储在内部节点中。在 `B+ tree` 中，叶节点像链表一样相互连接。这有助于使查询更加简单高效。`B+\
  \ tree` 通常用于存储无法存在主内存中的大量数据。因此，在 `B+ tree` 中，叶节点存储在辅助存储器，而内部节点存储在主内存中。\n\n在 `B+\
  \ tree` 中，所有的内部节点被称为索引节点，因为它们存储了索引值。同样，所有的外部节点被称为数据节点，因为它们存储了键。`B+ tree` 始终是平衡的，由于所有数据都存储在叶节点中，因此对于数据搜索非常高效。`B+\
  \ tree` 的各种优点如下：\n\n* **a.** `B+ tree` 始终保持平衡，且树的高度始终保持较小。\n* **b.** 所有的叶节点相互连接，这使其非常高效。\n\
  * **c.** 叶节点也与上层节点连接；因此，它可以轻松地用于广泛的搜索查询。\n* **d.** 记录可以在等量的磁盘访问次数被提取。\n* **e.**\
  \ 记录可以按顺序或随机方式进行访问。\n* **f.** 由于所有数据只存储在叶节点中，数据搜索变得非常简单。\n* **g.** 同样，删除操作也非常简单，因为它只会在叶节点中发生。\n\
  \n![figure](img/00288.jpeg)\n\n***图 9.7*.** 3 阶 `B+ tree`。\n\n## 9.6 总结\n\n* 一个\
  \ M 路搜索树中，每个节点有 `M` – `1` 个值和 `M` 个子树。`M` 称为节点的度。\n* `B-tree` 是一种专门的多路树，广泛用于磁盘访问。`B-tree`\
  \ 在 1970 年由 Rudolf Bayer 和 Ed McCreight 开发。\n* 阶数为 `m` 的 `B-tree` 具有多路搜索树的所有属性。\n\
  * `B-tree` 的主要应用是将大量数据或海量记录组织成文件结构。\n* `B+ tree` 是 `B-tree` 的变体，它像 `B-tree` 一样也存储排序的数据。`B-tree`\
  \ 的结构是数据库系统中索引的标准组织方式。`B+ tree` 是一种略有不同的数据结构，它允许对数据进行顺序处理并将所有数据存储在树的最底层。\n\n## 9.7\
