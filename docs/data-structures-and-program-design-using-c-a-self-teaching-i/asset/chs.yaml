  • 稀疏矩阵的表示法\n• 总结\n• 练习题\n\n\n\n\n### 3.1 引言\n\n在上一章中，我们已经学习了数据结构和 C 语言编程的基础，我们的目标是设计良好的程序。所谓良好的程序是指能够正确且高效运行的程序，它占用内存更少，且运行执行时间更短。无疑，当一个程序以较少的内存空间和最短的时间执行时，就说它是高效的。在本章中，我们将学习数组的概念。数组是一种用于存储相关信息的用户定义数据类型。接下来的章节将详细讨论数组。\n\
  \n### 3.2 数组的定义\n\n数组是存储在连续内存中的同质（相似）类型数据元素的集合。数组是一种线性数据结构，因为数组的所有元素都是线性顺序存储的。让我们举个例子，假设一个班级有十个学生，要求我们存储这十个学生的分数；那么我们需要一种名为数组的数据结构。\n\
  \n![figure](img/00025.jpeg)\n\n**图 3.1.** 10 个元素数组的表示。\n\n在以前的例子中，数据元素存储在连续的内存位置上，并通过索引号（也称为下标）标识，即\
  \ `A[i]` 或 `A_i`。下标是一个用于标识数组元素的序数。数组的元素具有相同的数据类型，数组中的每个元素都可以使用相同的名称进行访问。\n\n## 常见问题\n\
  \n**Q. 什么是数组？我们如何标识数组中的元素？**\n\n**答案。**\n\n数组是存储在连续内存中的同质（相似）类型数据元素的集合。数组中的元素可以通过其索引号（也称为下标）来标识。\n\
  \n### 3.3 数组的声明\n\n我们知道所有变量在程序中使用之前必须先声明。因此，相同的概念也适用于数组变量。数组在使用之前必须声明。在声明数组期间，必须指定数组的大小。声明数组涉及以下规范：\n\
  \n- **数据类型 (Data Type)**：数据类型意味着它所存储的不同类型的值。数据类型可以是 `integer (int)`、`float`、`char`\
  \ 或任何其他有效的数据类型。\n- **数组名 (Array Name)**：指的是数组的名称，用于标识数组。\n- **大小 (Size)**：数组的大小是指数组可以包含的最大值数量。\n\
  \n```\nSyntax – data_typearray_name [size] ;\n```\n\n![figure](img/00026.jpeg)\n\
  \n上一个例子声明 `salary` 为一个具有十个元素的数组。在 C 语言中，数组索引从零开始。该数组的第一个元素存储在 `salary[0]` 中，第二个元素存储在\
  \ `salary[1]` 中，以此此类推。同样，最后一个元素将存储在 `salary[9]` 中。在内存中，数组将如图所示。\n\n![figure](img/00027.jpeg)\n\
  \n**图 3.2.** 数组的内存表示。\n\n这里方括号中的 `0`, `1`, `2`, `. . . ` `9` 表示我们用于标识数组中特定元素的下标。\n\
  \n### 3.4 数组初始化\n\n数组的初始化可以通过以下方式完成：\n\n**1. 编译时初始化 (Initialization at Compile Time)**\
  \ – 在编译时对数组元素进行初始化，与我们在声明普通时初始化普通变量的方式相同。当数组被初始化时，需要为数组中的每个元素提供特定的值。\n\n初始化数组的通用形式如下：\n\
  \n```\ndata_typearray_name[size] = { list of values } ;\n```\n\n编译时初始化数组的示例例如：\n\
  \n![figure](img/00028.jpeg)\n\n在初始化数组期间，我们可以省略数组的大小。例如，\n\n```\nint age[ ] = { 25\
  \ , 28, 34 } ;\n```\n\n在以前的例子中，编译器将自动为数组的所有已初始化元素分配内存。如果值的数量少于提供的大小，则这些元素将零作为它们的赋值值。例如，\n\
  \n```\nint marks[10] = { 56, 69, 40, 99, 82, 96, 72 } ;\n```\n\n这里数组的大小为 10，但只有七个元素；因此，剩余的元素将被视为零。\n\
  \n![figure](img/00029.jpeg)\n\n**图 3.3.** 数组 `marks[10]` 的初始化。\n\n**2. 运行时初始化 (Initialization\
  \ at Runtime)** – 在运行时对数组元素进行初始化是指从键盘输入值的方法。在这种方法中，使用 `while`、`do-while` 或 `for`\
  \ 循环来输入数组的值。\n\n![figure](img/00030.jpeg)\n\n**图 3.4.** 输入值的代码。\n\n在以前的代码中，索引 `i`\
