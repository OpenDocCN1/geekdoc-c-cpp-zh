  \ 总结\n\n- 栈数据元素的线性集合，最后插入的元素最先取出（即栈是 LIFO 后进先出的结构）。栈是一种线性数据结构，元素的插入和删除只在称为 TOP 的末端进行。\n\
  - 在计算机内存中，可以使用数组或链表来实现栈。\n- 栈溢出是指尝试向栈中插入元素但栈已满的情况。\n- 栈下溢是指尝试从栈中移除元素但栈已空的情况。\n-\
  \ 栈可以执行的三个基本操作是 push（入栈）、pop（弹出）和 peek（查看栈顶）。\n- push 操作是向栈中添加新元素的过程。\n- pop 操作是从栈中移除元素的过程。\n\
  - peek 操作是返回栈顶元素值的过程。\n- 波兰表示法（Polish notation）是指操作符放在操作数之前的表示法。\n- 中缀、前缀和后缀表示法是表示代数表达式的三种不同但等的方式。\n\
