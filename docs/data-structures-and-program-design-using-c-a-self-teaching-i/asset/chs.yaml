  \n# 第 5 章\n## 队列\n\n### 本章内容\n• 简介\n• 队列的定义\n• 队列的实现\n• 队列的操作\n• 队列的类型、队列的应用\n•\
  \ 总结\n• 练习题\n\n### 5.1 简介\n队列是一种重要的数据结构，广泛应用于许多计算机应用中。可以通过日常生活中我们熟悉的许多例子来直观地理解队列。队列的一个非常简单的例子是站在电影院外进入的人队。排在队伍中的第一个人将先进入电影院。同样，日常生活中有很多例子我们可以看到队列的实现。因此，我们观察到每当我们谈论队列时，第一个位置的元素将被先处理。因此，队列可以被描述为\
  \ FIFO（先进先出）数据结构；也就是说，先插入的元素将是先取出的元素。现在，让我们详细讨论一下队列。\n\n### 5.2 队列的定义\n队列是数据元素的线性集合，其中先插入的元素是先取出的元素（即队列是一个\
  \ FIFO 数据结构）。队列是一种抽象数据结构，与栈相似。与栈不同，队列在两端都是开放的。队列是一个线性数据结构，其中第一个元素从称为 `REAR` 端（也称为尾部）的一端插入，而元素的删除在另一个称为\
  \ `FRONT` 端（也称为头部）的端进行。一端始终用于插入数据，另一端用于移除数据。\n\n队列可以使用数组或链表来实现队列。我们将在本节中讨论如何使用数组和链表实现队列。\n\
  \n**实际应用：**\n• 队列在现实生活中的一个例子是扶梯上移动的人。先上扶梯的人将先走下来。\n• 队列的另一个例子是站在公交站等公交车的人队。因此，排在队伍中的第一个人将先上车。\n\
  \n### 5.3 队列的实现\n队列可以用两种数据结构表示：\n1. 使用数组表示队列。\n2. 使用链表表示队列。\n\n现在，让我们详细讨论一下这两者。\n\
  \n### 5.3.1 使用数组实现队列\n队列可以使用数组轻松实现。最初，队列的头部（head）和尾部（tail）指向第一个位置。当我们向队列插入新元素时，尾部会不断增加，指向将插入元素的位置，而头部保持在第一个位置。数组表示队列所示：\n\
  \n![figure](img/0091.jpeg)\n***FIGURE 5.1*. 数组表示。\n\n### 5.3.2 使用链表实现队列\n我们已经学习了如何使用数组实现队列。现在让我们讨论使用链表。我们已经知道在链表中是动态内存分配，也就是说内存是在运行时分配的。而在数组的情况下，内存是在开始分配的。如果我们预先知道队列的最大尺寸，那么使用数组实现队列将是有效的。但如果无法预知大小，我们将使用链表的概念，其中链表是动态内存分配。正如我们所知，链表有两个部分，第一部分包含节点信息，第二部分存储链表中下一个元素的地址。同样，我们也可以实现链式队列。现在，链表的\
  \ `START` 指针将成为链队列的 `FRONT` 指针，队列的末尾由 `REAR` 表示。所有的插入操作都在尾部进行。同样，所有的删除操作都从前端进行。\n\
  \n![figure](img/0092.jpeg)\n***FIGURE 5.4*. 链队列。\n\n#### 5.3.2.1 链队列的插入\n*插入是在向现有队列中添加新元素的过程*。队列中的新元素总是从尾部插入。最初，*我们将检查\
  \ `FRONT` = `NULL`*。如果条件成立，则队列为空；否则，为新节点分配新内存。我们将通过算法帮助进一步理解：\n\n**在链队列中插入新元素的算法**\n\
  \n```\n Step 1: START\n Step 2: Set NEW NODE -> INFO = VAL\n            IF FRONT\
  \ = NULL\n            Set FRONT = REAR = NEW NODE\n            Set FRONT -> NEXT\
  \ = REAR -> NEXT = NEW NODE\n            ELSE\n            Set REAR -> NEXT = NEW\
  \ NODE\n            Set NEW NODE -> NEXT = NULL\n            Set REAR  = NEW NODE\n\
  \            [End of If]\n Step 3: EXIT\n```\n\n\n\n\n在上的算法中，我们首先为新节点分配内存。然后，用要存储的信息对其进行初始化。接下来，我们检查新节点是否为队列的第一个节点。如果新节点是队列的第一个节点，则在新节点的地址部分存储\
  \ `NULL`。在这种情况下，新节点被同时标记为 `FRONT`（队头）和 `REAR`（尾部）。然而，如果新节点不是队列的第一个节点，则将其插入到队列的 `REAR`\
  \ 终端。\n\n**示例** – 假设有一个包含五个元素的链表队列；现在要在队列中插入一个新元素。\n\n![figure](img/00093.jpeg)\n\
  \n**图 5.5.** 插入前的链表队列。\n\n在队列中插入新元素后，更新后的队列如图所示：\n\n![figure](img/00094.jpeg)\n\n\
  **图 5.6.** 插入后的链表队列。\n\n#### 5.3.2.2 链表队列的删除\n\n删除是从现有队列中移除元素的过程。队列中的元素始终从前端删除。起初，我们将检查下溢条件（underflow），即\
  \ `FRONT` = `NULL`。如果该条件为真，则队列为空，这意味着我们无法从中删除任何元素。因此，在 particular 情况下，屏幕上会显示下溢错误消息。我们将通过算法来进一步理解：\n\
  \n**从队列中删除元素的算法**\n\n```\n Step 1: START\nStep 2: IF FRONT = NULL\n            Print\
  \ UNDERFLOW ERROR\n            [End of If]\nStep 3: Set TEMP = FRONT \nStep 4: Set\
  \ FRONT = FRONT -> NEXT \nStep 5: FREE TEMP\nStep 6: EXIT\n```\n\n在上的算法中，我们首先检查下溢条件，即队列是否为空。如果该条件为真，将显示下溢错误消息；否则，我们将使用指针变量\
  \ `TEMP`，它将指向 `FRONT`。在下一步，`FRONT` 现在指向队列中的第二个节点。最后，第一个节点从队列中被删除。\n\n**示例** – 假设有一个包含五个元素的链表队列；现在从队列中删除一个元素。\n\
  \n![figure](img/00095.jpeg)\n\n**图 5.7.** 删除前的链表队列。\n\n从队列中删除一个元素后，更新后的队列如图所示：\n\
  \n![figure](img/00096.jpeg)\n\n**图 5.7.** 删除后的链表队列。\n\n编写一个菜单驱动的程序，实现具有插入和删除操作的链表队列。\n\
  \n```\n # include<stdio.h>\n# include<conio.h>\nstruct node\n{\n int info ;\n struct\
  \ node *next ;\n}\n*front = NULL, *rear = NULL ;\nvoid insertion(int val) ; \nvoid\
  \ deletion() ; \nvoid display() ; \nvoid main()\n{\n int val, choice ;  \n while(1)\n\
  \  {\n   clrscr() ;\n   printf(“\\n***MENU***”) ; \n   printf(“\\n1\\. INSERTION\
  \ IN QUEUE”) ; \n   printf(“\\n2\\. DELETION IN QUEUE”) ; \n   printf(“\\n3\\. DISPLAY”)\
  \ ; \n   printf(“\\n4\\. EXIT”) ; \n   printf(“\\nenter your choice: ”) ;  \n  \
  \ scanf(“%d”, &choice) ;   \n   switch(choice)\n    {\n     case 1 :\n     printf(“enter\
  \ value to insert: ”) ; \n     scanf(“%d”, &val) ; \n     insertion(queue, val)\
  \ ; \n     break ;\n\n     case 2 :\n     deletion(queue, val) ;\n     break ;\n\
  \n     case 3 :\n     display(queue) ; \n     break ; \n\n     case 4 :\n     printf(“!!Exit!!”)\
  \ ; \n     exit(0) ;\n\n     default :\n     printf(“wrong choice”) ;\n    }\n \
  \ }\n}\n\nvoid insertion(int val) \n{\n struct node *Newnode ;\n //Case 1 用于向链表队列中插入元素\n\
  \ Newnode = (struct node*)malloc(sizeof(struct node)) ; \n Newnode -> info = val\
  \ ; \n Newnode -> next = NULL ;\n if(front == NULL)\n  {\n    front = rear = Newnode\n\
  \  }\n else\n  {\n   rear -> next = Newnode ; \n   rear = Newnode ;\n  }\n printf(“Success!!”)\
  \ ; \n getch() ;\n}\n\nvoid deletion()\n {\n struct node *temp ;\n //Case 2 用于从链表队列中删除元素\n\
  \ if(front == NULL)\n  { \n    printf(“\\nEmpty queue”) ;\n  } else\n  {\n   temp\
  \ = front ; \n   front = front -> next ; \n   printf(“deleted value is %d”, n) ;\
  \ \n   free(temp) ;\n  }\n getch() ;\n}\n\nvoid display()\n{\n struct node *ptr\
  \ ;\n //Case 3 用于显示链表队列中的元素\n if(front == NULL)\n  {\n    printf(“\\nEmpty queue”)\
  \ ;\n  }\n ptr = front ;\n while(ptr -> next != NULL)\n  {\n   printf(“%d”, ptr\
  \ -> info) ;\n  }\n```\n\n\n\n\n## 图 5.3. 删除元素后的队列。\n\n### 从队列中删除元素的算法\n\n```\n\
  \ Step 1: START\nStep 2: IF FRONT > REAR or FRONT = -1\n            Print UNDERFLOW\
  \ ERROR\n            [If 结构结束]\nStep 3: Set ITEM = QUEUE[FRONT]\nStep 4: Set FRONT\
  \ = FRONT + 1\nStep 5: EXIT\n```\n\n在之前的算法中，我们首先检查上溢（underflow）条件，即队列是否为空。如果队列为空，则不进行删除；否则，`FRONT`\
  \ 增加到队列中的下一个位置。最后，从队列中删除元素。\n\n编写一个菜单驱动的程序，用于线性队列的插入和删除操作。\n\n```\n # include<stdio.h>\n\
  # include<conio.h>\n# define SIZE 10\nvoid insertion(int queue[], int n) ;\nvoid\
  \ deletion(int queue[], int n) ;\nvoid display(int queue[]) ;\nint front = -1, rear\
  \ = -1 ;\nvoid main()\n{\n int queue[SIZE], n, ch ;\n while(1) \n  {\n   clrscr()\
  \ ;\n   printf(“\\n***菜单***”) ; \n   printf(“\\n1\\. 队列插入”) ;\n   printf(“\\n2\\\
  . 队列删除”) ; \n   printf(“\\n3\\. 显示”) ; \n   printf(“\\n4\\. 退出”) ; \n   printf(“\\\
  n 输入您的选择： ”) ; \n   scanf(“%d”, &ch) ; \n   switch(ch)\n     {\n\n        case 1\
  \ :\n        printf(“输入要插入的值： ”) ; \n        scanf(“%d”, &n) ; \n        insertion(queue,\
  \ n) ; \n        break ;\n\n        case 2 :\n        deletion(queue, n) ; \n  \
  \      break ;\n\n        case 3 : \n        display(queue) ; \n        break ;\n\
  \n        case 4 :\n        printf(“!!退出!!”) ; \n        exit(0) ;\n\n        default\
  \ :\n        printf(“选择错误”) ;\n      }\n   }\n}\n\nvoid insertion(int queue[], int\
  \ n)\n{\n // 情况 1 用于在队列中插入元素 \n if(front == 0 || rear == SIZE-1\n  {\n    printf(“\\\
  n 溢出错误”) ;\n  }\n else\n  {\n    rear = rear + 1 ; \n    queue[rear] = n ; \n  \
  \  printf(“成功!!”) ; \n    getch() ;\n  }\n}\nvoid deletion(int queue[], int n)\n\
  {\n int i ;   // 情况 2 用于从\n              队列中删除元素\n if(front == -1 && rear == -1)\n\
  \  {\n    printf(“\\n 上溢错误”) ;\n  }\n else\n  {\n    for(i = front ; i<rear ; i++)\n\
  \      {\n        queue[i] = queue[i+1] ;\n      }\n    rear -- ;\n    printf(“删除的值为\
  \ %d”, n) ;\n   }\n  getch();\n}\n\nvoid display(int queue[])\n{\n int i ;\n //\
  \ 情况 3 用于显示队列中的元素\n front = front + 1 ;\n for(i = rear ; i > front ; i--)\n  {\n\
  \    printf(“\\n%d”, queue[i]) ;\n  }\n getch() ;\n}\n```\n\n**输出** –\n\n![](img/00097.jpeg)菜单![](img/00097.jpeg)\n\
  \n1: 队列插入\n\n2: 队列删除\n\n3: 显示\n\n4: 退出\n\n输入您的选择：1\n\n输入要插入的值：56\n\n成功!!\n\n###\
  \ 5.5 队列的类型\n\n本节讨论了各种类型的队列，包括：\n\n1. 环形队列\n2. 优先级队列\n3. 双端队列 (De-Queue)\n\n让我们逐一详细讨论它们。\n\
  \n### 5.5.1 环形队列\n\n环形队列是一种特殊的队列，以环形方式而非直线实现。环形队列是一种线性数据结构，其操作根据先进先出（FIFO）原则进行，最后一个位置与第一个位置连接形成一个圆。它也被称为“环形缓冲区”。\n\
  \n#### 5.5.1.1 线性队列的局限性\n\n在线性队列中，我们学习了插入和删除是如何发生的。我们讨论了在队列中插入新元素时，只在尾部进行。同样，从队列中删除元素时，只在头部进行。现在让我们考虑一个包含\
  \ 10 个元素的队列如下：\n\n![figure](img/00102.jpeg)\n\n队列现在是满了，所以我们不能向其中插入更多元素。如果从队列中删除三个元素，现在队列将是：\n\
  \n![figure](img/00103.jpeg)\n\n因此，我们可以看到即使从队列中删除了三个元素，队列仍然是满的，因为 `REAR = MAX – 1`。我们仍然无法向其中插入任何新元素，因为没有空间存储新元素。因此，这是线性队列的一个缺点。\n\
  \n为了解决这个问题，我们可以将所有元素向左移动，以便插入新元素。\n\n![figure](img/00104.jpeg)\n\n队列现在是满的，所以我们不能向其中插入更多元素。如果从队列中删除三个元素，现在队列将是：\n\
  \n![figure](img/00103.jpeg)\n\n因此我们可以看到即使从队列中删除了三个元素，队列仍然是满的，因为 `REAR = MAX – 1`。我们仍然无法向其中插入任何新元素，因为没有空间存储新元素。因此，这是线性队列的一个缺点。\n\
  \n为了解决这个问题，我们可以将所有元素向左移动，以便插入新元素。\n\n![figure](img/00104.jpeg)\n\n队列现在是满的，所以我们不能向其中插入更多元素。如果从队列中删除三个元素，现在队列将是：\n\
  \n[此处为原文重复内容，已提取核心逻辑]\n\n因此我们可以看到即使从队列中删除了三个元素，队列仍然是满的，因为 `REAR = MAX – 1`。我们仍然无法向其中插入任何新元素，因为没有空间存储新元素。因此，这是线性队列的一个缺点。\n\
  \n[注：原文后半部分存在大量重复占位符文本，已根据核心技术内容进行处理。]\n\n#### 5.5.1.2 在环形队列中插入元素\n\n在现有的队列中插入新元素时，我们首先检查溢出条件，该条件发生在尝试向满队列中插入元素时。要插入的新元素的位置可以使用以下公式计算：\n\
  \n`REAR = (REAR + 1) % MAX`\n\n**示例** – 考虑一个包含 3 个元素的环形队列。假设我们向其中插入元素 56。让我们看看如何在环形队列中进行插入。\n\
  \n步骤 1：初始队列包含 3 个元素。`FRONT` 表示环形队列的起点，`REAR` 表示环形队列的终点。\n\n![figure](img/00105.jpeg)\n\
  \n图 5.9. 插入前的初始环形队列。\n\n步骤 2：现在要在队列中插入新元素。因此，`REAR = REAR + 1`，即 `REAR` 将增加 1，使其指向队列中的下一个位置。\n\
  \n![figure](img/00106.jpeg)\n\n图 5.10. REAR 增加 1 以指向下一个位置。\n\n步骤 3：最后，在这一步中，将新元素插入到\
  \ `REAR` 指向的位置。因此，插入后的队列所示：\n\n![figure](img/00107.jpeg)\n\n图 5.11. 插入新元素后的最终队列。\n\
  \n\n\n\n\n```\n Step 1: START\nStep 2: IF (FRONT = 0 && REAR = MAX – 1) OR (FRONT\
  \ = \n        REAR + 1)\n            Print OVERFLOW ERROR\nStep 3: ELSE \n     \
  \       IF (FRONT = -1)\n            Set FRONT = 0\n            Set REAR = 0\nStep\
  \ 4: ELSE \n            IF (REAR = MAX - 1)\n            Set REAR = 0\n        \
  \    ELSE\n            REAR = REAR + 1\n            [End of If]\n            [End\
  \ of If]\nStep 5: Set CQUEUE[REAR] = ITEM\nStep 6: EXIT\n```\n\n在上一个算法中，我们首先检查溢出条件。其次，检查队列是否为空。如果队列为空，则将\
  \ `FRONT` 和 `REAR` 设置为零。在步骤 4 中，如果 `REAR` 达到了其最大容量，则设置 `REAR = 0`；否则，`REAR` 递 1，使其指向要插入新元素的的下一个位置。最后，将新元素插入队列中。\n\
  \n#### 5.5.1.3 从循环队列中删除元素\n\n从已存在的队列中删除元素时，我们首先检查下空条件，即当我们尝试从空队列中删除元素时发生。从循环队列中删除元素后，可以通过以下公式计算\
  \ `FRONT` 端的位置：\n\n`FRONT = (FRONT +1) % MAX`，其中 `MAX` 等于队列的大小。\n\n**示例** – 让我们考虑一个包含\
  \ 7 个元素的循环队列。假设我们要从中删除元素 45。让我们看看在循环队列中是如何执行删除的。\n\n**步骤 1：** 初始队列包含 7 个元素。`FRONT`\
  \ 表示循环队列的起始，`REAR` 表示循环队列的末尾。\n\n![figure](img/00108.jpeg)\n\n*图 5.12.* 未删除前的初始循环队列。\n\
  \n**步骤 2：** 现在，要从队列中删除元素。因此，`FRONT = FRONT + 1`，即 `FRONT` 将增加 1，使其指向队列中的下一个位置。同时，该值已从队列中删除。因此，删除后的队列所示：\n\
  \n![figure](img/00109.jpeg)\n\n*图 5.13.* 删除元素后的最终队列。\n\n**从循环队列中删除元素的算法**\n\n这里\
  \ `CQUEUE` 是一个具有 N 个元素的数组。`FRONT` 和 `REAR` 指向队列的头部和尾部元素。`ITEM` 是要删除的值。\n\n```\n\
  \ Step 1: START\nStep 2: IF (FRONT = -1)\n            Print UNDERFLOW ERROR\nStep\
  \ 3: ELSE \n           Set ITEM = CQUEUE[FRONT]\nStep 4: IF (FRONT = REAR) \n  \
  \         Set FRONT = -1             \n           Set REAR = -1\nStep 5: ELSE IF\
  \ (FRONT = MAX – 1)\n           Set FRONT = 0\n           ELSE             \n  \
  \         FRONT = FRONT + 1\n           [End of If]\n           [End of If]\nStep\
  \ 6: EXIT\n\n```\n\n在上一个算法中，我们首先检查下空条件。其次，我们将要删除的元素存储在 `ITEM` 中。第三，我们检查删除后队列是否为空。此外，如果\
  \ `FRONT` 达到了其最大容量，则设置 `FRONT = 0`；否则，`FRONT` 递 1，使其指向下一个位置。最后，元素从队列中删除。\n\n编写一个执行插入和删除操作的线性队列菜单驱动程序。\n\
  \n```\n # include <stdio.h>\n# define MAX 10\nint cqueue[MAX], front = -1, rear\
  \ = -1 ; \nint item ; \nvoid main() \n{\n int choice ; \n clrscr() ; \n while(1)\n\
  \  {\n    printf(“\\n MENU OF CIRCULAR QUEUE”) ; \n    printf(“\\n 1\\. Insertion\
  \ in Circular Queue”) ; \n    printf(“\\n 2\\. Deletion in Circular Queue”) ; \n\
  \    printf(“\\n 3\\. Display”) ; \n    printf(“\\n 4\\. Exit”); \n    printf(“\\\
  n enter your choice”) ; \n    scanf(“%d”, &choice); \n    switch(choice)\n     \
  \ {\n       case 1 :\n       printf(“ \\n enter item”) ; \n       //Case 1 is for\
  \ inserting an element in the \n       circular queue \n       scanf(“%d”, &item)\
  \ ;\n       if((front == 0 && rear == MAX - 1) || (front ==\n       rear + 1))\n\
  \         {\n          printf(“\\ncircular queue overflow”) ; \n          getch()\
  \ ;\n          exit(0) ;\n         }\n          if((front == -1) && (rear == -1))\
  \ \n           {\n             front = 0 ; \n             rear = 0 ;\n         \
  \  }\n        else\n           {\n             rear = (rear + 1) % MAX ; \n    \
  \         cqueue[rear] = item ; \n             printf(“success”) ;\n           \
  \ }\n        getch() ;\n        break ;\n\n        case 2 :\n        if(front ==\
  \ -1 && rear == -1)\n        //Case 2 is for deleting an element from the\n    \
  \    circular queue\n          {\n            printf(“\\ncircular queue underflow”)\
  \ ; \n            getch() ;\n          }\n        else if (front == rear)\n    \
  \      {\n            item = cqueue[front];\n            front = -1            \
  \ \n            rear = -1\n          }\n          else\n          {\n          \
  \  item = cqueue[front];\n            front = (front + 1) % MAX ;\n          }\n\
  \          getch() ;\n          break ;\n\n        case 3 :\n        //Case 3 is\
  \ for displaying the elements of the\n        circular queue\n        int i = \n\
  \        for(i = front; i <= rear; i++)\n           {\n               printf(“%d\
  \ ”, cqueue[i])\n           }\n        break ;\n\n        case 4 : \n        exit(0)\
  \ ;\n\n        default:\n           printf(“wrong choice”) ;\n      }\n  }\n}\n\
  ```\n\n**输出** –\n\nMENU OF CIRCULAR QUEUE\n\n1: Insertion in Circular Queue\n\n\
  2: Deletion in Circular Queue\n\n3: Display\n\n4: Exit\n\nEnter your choice\n\n\
  1\n\nEnter item\n\n8\n\nSuccess!!\n\n### 5.5.2 优先级队列\n\n*优先级队列是另一种根据优先级处理元素的变体，此外每个元素都关联有一个优先级*。优先级队列中的每个元素都被分配一个特殊值，称为优先级。优先级队列根据以下规则处理：\n\
  \n**1.** 高较高的元素先被处理，然后是优先级较低的元素。\n\n**2.** 如果两个元素具有相同的优先级，则按照先来顺序处理。元素的优先级通过其值选择称为隐式优先级，而赋予每个元素对应的优先级编号称为显式优先级。\n\
  \n优先级队列类似于队列或栈数据结构，但每个元素都有额外的优先级。\n\n**实际应用：**\n\n在操作系统中，如果有进程要执行，第一个进程需要 3 ns 完成，第二个进程需要\
  \ 5 ns 完成，第三个进程需要 9 ns 完成，第四个进程需要 8 ns 完成，那么第一个进程将被赋予最高优先级，并成为所有进程中第一个执行的。\n\n现在优先级队列进一步分为两种类型：\n\
  \n**1. 升序优先级队列** – 在这种优先级队列中，元素可以任意顺序插入，但在从队列中删除元素时，最小元素会被搜索并首先删除。\n\n**2. 降序优先级队列**\
  \ – 在这种优先级队列中，元素可以任意顺序插入。但在从队列中删除元素时，最大的元素会被搜索并首先删除。\n\n**常见问题**\n\n**Q. 定义优先级队列。**\n\
  \n**答。**\n\n\n\n\n优先队列是一个元素集合，其中每个元素都被分配了一个优先级，并且元素被删除和处理的顺序遵循以下规则：\n\na. 高优先级的元素会在任何低优先级元素之前被处理。\n\
  \nb. 两个相同优先级的元素按照它们加入队列的顺序进行处理。\n\n优先队列中的数组元素可以具有以下结构：\n\n```c\n struct data\n{\n\
  \     int item ; \n     int priority ; \n     int order ;\n} ;\n```\n\n#### 5.5.2.1\
  \ 优先队列的实现\n\n优先队列可以通过两种方式实现：\n\n1. 优先队列的数组表示\n\n2. 优先队列的链表表示\n\n现在让我们详细讨论这两种实现方式。\n\
  \n#### a. 使用数组实现优先队列\n\n在使用数组实现优先队列时，必须考虑以下几点：\n\n• 为每个优先级级别或优先级数字维护一个独立的队列。\n•\
  \ 每个队列将出现在它自己的循环数组中，并且必须有自己的一对指针，即 `FRONT` 和 `REAR`。\n• 如果为每个队列分配相同量的内存，可以使用二维数组代替线性数组。\n\
  \n**例如** – `FRONT [K]` 和 `REAR [K]` 是包含队列第“K”行头部和尾部值的指针，其中 `K` 是优先级数字。假设我们要插入一个优先级为\
  \ `K` 的元素，那么我们在第 `K` 行的 `REAR` 处添加该元素；`K` 既是该元素的行号也是优先级数字。如果我们添加优先级数为 4 的 `F`，则队列所示：\n\
  \n| FRONT | REAR |\n| 2 | 2 |\n| 1 | 3 |\n| 0 | 0 |\n| 5 | 1 |\n| 4 | 4 |\n\n![figure](img/00110.jpeg)\n\
  \n**图 5.14. ** 插入新元素后的优先队列。\n\n#### b. 使用链表实现优先队列\n\n优先队列可以使用链表实现。在使用链表实现优先队列时，每个节点将包含三个部分：\n\
  \na. 信息部分\nb. 元素的优先级数字\nc. 下一个元素的地址\n\n高优先级的元素将位于低优先级元素之前。此外，优先级数字和优先级是相反的，也就是说，优先级数字越小的元素意味着它的优先级越高。例如，如果两个优先级数字分别为\
  \ 2 和 7 的元素 `X` 和 `Y`，那么 `X` 将先处理，因为它的优先级更高。\n\n![figure](img/00111.jpeg)\n\n**图\
  \ 5.15. ** 链表优先队列。\n\n### 5.5.2.2 链表优先队列的插入\n\n在链表优先队列中插入新元素时，我们首先遍历整个队列直到找到一个优先级低于新元素的节点。因此，新元素将插入到低优先级元素之前。此外，如果队列中有与新元素优先级相同的元素，则新元素将插入在该元素之后。\n\
  \n**示例** – 考虑所示包含四个元素的优先队列：\n\n![figure](img/00112.jpeg)\n\n**图 5.16. ** 插入前的链表优先队列。\n\
  \n现在要插入一个信息为 `A` 优先级数为 3 的新元素；因此，该元素将插入到优先级数为 4 的元素 `R` 之前，因为它低于新元素。插入新元素后的优先队列所示：\n\
  \n![figure](img/00113.jpeg)\n\n**图 5.17. ** 插入新元素后的链表优先队列。\n\n### 5.5.2.3 链表优先队列的删除\n\
  \n从链表优先队列中删除元素是一个非常简单的过程。在这种情况下，删除优先队列中的第一个节点并优先处理该节点的信息。\n\n**示例** – 考虑所示包含五个元素的优先队列：\n\
  \n![figure](img/00114.jpeg)\n\n**图 5.18. ** 删除前的链表优先队列。**\n\n现在删除队列中的第一个节点。因此，删除后的优先队列所示：\n\
  \n![figure](img/00115.jpeg)\n\n**图 5.19. ** 删除第一个节点后的链表优先队列。**\n\n编写一个菜单驱动的优先队列程序，执行插入和删除操作。\n\
  \n```c\n # include <stdio.h>\n # include <conio.h>\n # define MAX 5\nvoid insert_by_priority(int);\n\
  void delete_by_priority(int);\nvoid create();\nvoid check(int);\nvoid display_pqueue();\n\
  int p_queue[MAX];\nint front, rear;\nvoid main()\n{\n int n, choice; \n printf(\"\
  \\n***MENU***\"); \n printf(\"\\n1 - Insert an element into priority queue\"); \n\
  \ printf(\"\\n2 - Delete an element from priority queue\"); \n printf(\"\\n3 - Display\
  \ priority queue\"); \n printf(\"\\n4 - Exit\"); \n create(); \n while (1) \n  {\n\
  \    printf(\"\\nEnter your choice: \"); \n    scanf(\"%d\", &choice); \n    switch\
  \ (choice)\n      {\n       case 1:\n          insert_by_priority(n);\n        \
  \  break;\n       case 2:\n          delete_by_priority(n);\n          break;\n\
  \       case 3:\n          display_pqueue();\n          break;\n       case 4:\n\
  \          exit(0);\n       default:\n          printf(\"\\nChoice is incorrect\"\
  );\n      }\n  }\n}\n// ... remaining functions ...\n```\n\n\n\n\n### 1. 输入受限队列\
