  \n![figure](img/00129.jpeg)\n\n### 选择排序算法的复杂度\n\n选择排序是一种简单的排序技术。在这种方法中，如果数组中有 `n`\
  \ 个元素，则会进行 `(n-1)` 次比较或迭代。因此，选择排序技术的复杂度为 `O(n²)`。\n\n编写一个程序，使用选择排序方法对数组进行排序。\n\n\
