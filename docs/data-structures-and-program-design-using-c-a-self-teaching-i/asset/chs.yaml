  #### 7.6.6 括号匹配\n\n栈可以用于检查任何算术或代数表达式中括号的有效性。我们已经知道，在有效表达式中，括号或中括号成对出现，也就是说，如果是一个左括号，那么它在表达式中必须被关闭。否则，表达式是无效的。例如，(X\
  \ + Y – Z 是无效的。但 (X + Y – Z) 看起来是一个有效的表达式。因此，有一些关键点需要记住：\n\n- 每当遇到一个 `(` 括号时，应将其入栈。\n\
  - 每当遇到一个 `)` 括号时，都检查栈。\n- 如果栈已经为空，说明 `)` 括号没有对应的 `(` 括号，因此表达式无效。\n- 如果栈不为空，则弹出栈并检查元素是否与\
  \ `)` 括号对应。\n- 当到达栈底时，栈必须为空。否则，一个或多个 `(` 括号没有对应的 `)` 括号，表达式将无效。\n\n示例 – 检查给定表达式是否有效。\n\
  \na)`((A – B) ![figure](img/00011.jpeg) Y`\nb)`(A + B) – {X + Y} ![figure C – D]]`\n\
