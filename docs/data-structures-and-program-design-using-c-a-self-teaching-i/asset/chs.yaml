  \  设置 SMALLEST = ARR[J]\n            设置 POS = J\n            [IF 结束]\n         \
  \   [循环结束]\nStep 5: 返回 POS\n```\n\n### 示例 – 使用选择排序对给定数组进行排序。\n\n![figure](img/00127.jpeg)\n\
