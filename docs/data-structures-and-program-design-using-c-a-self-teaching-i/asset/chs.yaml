  \ 0, n-1) ;\n  printf(“nafter sort new array is:”) ;\n  for(i=0; i<n++)\n   {\n\
  \     printf(\"\\t%d”, arr[i]) ;\n  }\n  return 0 ;\n}\n```\n\n**输出 -**\n\n输入元素数量：8\n\
