  \ ARR[IND] = ARR[IND]\n            Set IND = IND + 1\n            [End of Loop]\n\
  Step 8: EXIT\n```\n\n# 示例 – 使用归并排序对以下数组。\n\n```\nint array[] = { 40, 10, 86, 44,\
