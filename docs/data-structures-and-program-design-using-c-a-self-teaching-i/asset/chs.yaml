  );\n    printf(\"\\n 2 : 在指定节点后插入\");\n    printf(\"\\n 3 : 在指定节点前插入\");\n    printf(\"\
  \\n 4 : 在尾部插入\");\n    printf(\"\\n 5 : 在头部删除\");\n    printf(\"\\n 6 : 在中间删除\"\
  );\n    printf(\"\\n 7 : 在尾部删除\");\n    printf(\"\\nEnter 您的选择: \");\n    scanf(\"\
  %d\", &choice);\n    switch(choice)\n    {\n      case 1:\n        // 情况 1 用于在头部插入\n\
  \        add_at_beg();\n        break;\n      case 2:\n        // 情况 2 用于在指定节点后插入\n\
  \        printf(\"\\n 输入新节点\");\n        scanf(\" %d\", &item);\n        add_after(item);\n\
  \        break;\n      case 3:\n        // 情况 3 用于在指定节点前插入\n        printf(\"\\\
  n 输入新节点\");\n        scanf(\" %d\", &item);\n        add_before(item);\n       \
  \ break;\n      case 4:\n        add_at_end(); // 情况 4 用于在尾部插入\n        break;\n\
  \      case 5:\n        delete_at_beg(); // 情况 5 用于在头部删除\n        break;\n     \
  \ case 6:\n        // 情况 6 用于在中间删除\n        printf(\"\\n 输入要项\\n\");\n        scanf(\"\
