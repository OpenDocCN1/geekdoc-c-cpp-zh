  **输出**\nEnter the elements of the matrix:\n10 30 50\n70 90 11\n13 15 17\nThe elements\
  \ of matrix are \n10 30 50\n70 90 11\n13 15 17\nElements of transposed matrix are\
  \ \n10 70 13\n30 90 11\n13 15 17\n\n### 3.10 多维数组/ N 维数组\n\n多维数组也称为 n 维数组。它是数组的数组。它内部有\
  \ n 个索引，这也解释了它 n 维数组的名字。n 维数组是一个 `m[1] X m[2] X m[3] . . X m[n]` 数组，因为它包含了 `m[1]\
  \ X m[2] X m[3] . . X m[n]` 个元素。多维数组的存储方式与一维、二维数组类似。\n\n### 3.11 计算三维数组的的地址\n\n\
  和二维数组一样，我们可以以两种方式存储三维数组：行主序和列主序。\n\n### 1. 行主序中的元素\n\n`Address(A[i][j][k]) = Base\
  \ address(BA) + w( n( i-1 ) + m( j-1 ) + ( k-1 ) )`\n\n### 2. 列主序中的元素\n\n`Address(\
  \ A[i][j][k] ) = Base address(BA) + w ( l( k-1 ) + n( j-1 ) + ( i-1 ) )`\n\n其中 `w`\
  \ 是存储一个元素所需的字节数。\n\n### 常见问题解答\n\n**Q. 考虑一个 4 X 5 X 6 的学生三维数组，其基地址为 500，每个元素的大小为\
  \ 2。现在计算元素 `student[3][2][1]` 的地址，假设元素按以下方式存储：**\n\n**a)行主序**\n\n**b)列主序**\n\n**答案。**\n\
  \n**a)行主序**\n\n这里给出 `w = 2`，`base address = 500`，`n = 5`，`m = 6`，`i = 3`，`j = 2`，`k\
  \ = 1`。\n\n`Address( A[i][j][k] ) = Base address(BA) + w ( n( i-1 ) + m( j-1 ) +\
  \ ( k-1 ) )`\n\n`Address( student[3][2][1] ) = 500 + 2 ( 5( 3-1 ) + 6( 2-1 ) + (\
  \ 1-1 ) )`\n`= 500 + 2 ( 5( 2 ) + 6( 1 ) + 0 )`\n`= 500 + 2 ( 10 + 6 )`\n`= 500\
  \ + 2 ( 16 )`\n`= 500 + 32`\n\n`Address( student[3][2][1] ) = 532`\n\n**b)列主序**\n\
  \n这里给出 `w = 2`，`base address = 500`，`l = 4`，`n = 5`，`i = 3`，`j = 2`，`k = 1`。\n\n\
  `Address( A[i][j][k] ) = Base address(BA) + w ( l( k-1 ) + n( j-1 ) + ( i-1 ) )`\n\
  \n`Address( student[3][2][1] ) = 500 + 2 ( 4( 1-1 ) + 5( 2-1 ) + ( 3-1 ) )`\n`=\
  \ 500 + 2 ( 4( 0 ) + 5( 1 ) + 2 )`\n`= 500 + 2 ( 0 + 5 + 2 )`\n`= 500 + 2 ( 7 )`\n\
  \n`Address( student[3][2][1] ) = 500 + 14 = 514`\n\n\n\n\n\n```c\n #include<stdio.h>\
  \ \n #include<conio.h> \n void main()\n {\n  int array[2][2][2], i, j, k ;\n  clrscr()\
  \ ;\n  printf(“Enter the elements of array ”) ;\n  for( i=0 ; i<2 ; i++ )\n   {\n\
  \    for( j=0 ; j<2 ; j++ ) \n     { \n      for( k=0 ; k<2 ; k++ )\n       {\n\
  \        scanf(“%d”, &array[i][j][k]) ;\n       }\n     }\n   }\n  printf(“ The\
  \ array is : ”) ;\n  for( i=0 ; i<2 ; i++ )\n   {\n printf(“ \\n ”) ;\n for( j=0\
  \ ; j<2 ; j++ )\n\n   {\n    printf(“ \\n ”) ;\n    for( k=0 ; k<2 ; k++ )\n   \
  \  {\n      printf(“ array[%d][%d][%d] = %d”, i, j, k,\n      array[i][j][k] ) ;\n\
  \     }\n   }\n  }\n getch() ;\n}\n```\n\n#### 输出\n输入数组的元素\n4\n23\n9\n8\n6\n2\n\
  1\n7\n数组是： \narray[0][0][0] = 4\narray[0][0][1] = 23\narray[0][1][0] = 9\narray[0][1][1]\
  \ = 8\narray[1][0][0] = 6\narray[1][0][1] = 2\narray[1][1][0] = 1\narray[1][1][1]\
  \ = 7\n\n### 3.12 数组与指针\n\n指针是一种特殊的变量类型，用于存储地址。指针可以访问和操作存储在内存中的数据。指针在数组中被频繁使用，因为指针在处理数组和数据表时效率更高。指针可以被比作人的家的地址，它可以帮助我们轻松地到达目的地。数组的概念与指针的概念紧密相连。现在让我们来看一个例子：假设我们有一个声明为\
  \ 10 个元素的数组：\n\n```c\n int array[10] = { 10, 20 ,32, 7, 19, 89, 60, 54,\n   12,\
  \ 77 }\n```\n\n上述数组存储在内存中的形式如图所示：\n\n![figure](img/00056.jpeg)\n\n图 3.6. `array[]`\
  \ 的内存表示。\n\n数组的起始地址 (100) 是数组的基地址。基地址是数组中第一个元素的地址。现在我们将使用一个指针变量来存储第一个元素的地址；换句话说，`ptr`指向数组的第一个元素。\n\
  \n```c\n int * ptr ;\n\n       ptr = &array[0] ;\n```\n\n我们也可以存储其他元素的地址。如果指针变量持有数组中第一个元素的地址，那么可以通过\
  \ `ptr++` 计算出后续元素的地址。\n\n```c\n int * ptr ;\n       ptr = &array[0] ;\n       ptr++\
  \ ;\n       printf(“ 第二个元素的值是 %d”,*ptr);\n```\n\n指针变量可以在前或后加上递增或递减运算符。递增或递减取决于数据类型，例如\
  \ `int` – 2 字节，`float` – 4 字节，`char` – 1 字节等。\n\n### 3.13 指针数组\n\n指针数组声明为 `int *\
  \ ptr[10]`。\n\n因此，根据上一个语句，声明了一个包含 10 个指针的数组，其中每个指针指向一个变量。指针数组的代码如下：\n\n```c\n #include<stdio.h>\
  \ \nvoid main()\n{\n int i, j, k, l, m ;\n int * arr[4] ;\n i = 25\n j = 50\n k\
  \ = 75\n l = 100\n arr[0] = &i\n arr[1] = &j\n arr[2] = &k\n arr[3] = &l\n for(\
  \ m=0 ; m<4 ; m++ )\n  {\n    printf“%u\\n”, arr[m]) ;\n  }\n }\n```\n\n#### 输出\n\
  32012\n35260\n31010\n30058\n\n注意：这里的地址在内存中是随机的。\n\n### 3.14 数组及其应用\n\n数组在 C 语言中被频繁使用，因为它们有很多各种应用。这些应用包括：\n\
  \n- 数组用于按升序或降序排序元素。\n- 数组还用于实现栈、队列、哈希表等其他各种数据结构。\n- 数组广泛用于实现矩阵、向量以及各种矩形表。\n- 在数组上可以执行各种其他操作，包括搜索、合并、排序等。\n\
  \n## 常见问题\n\n**Q. 列举数组的一些应用。**\n\n**答案：**\n\n1. 数组在连续内存位置中存储数据方面非常有用。\n2. 数组用于实现栈、队列等其他各种数据结构。\n\
  3. 数组对于执行各种操作非常有用\n\n### 3.15 稀疏矩阵\n\n数组在 C 语言中被频繁使用，因为它们有许多非常有用的应用。稀疏矩阵是指其中零元素比例较高的矩阵。由于稀疏矩阵的元素存储会浪费内存，因此我们通过只存储非零元素来节省空间。\n\
  \n**例如：**\n\n![figure](img/00057.jpeg)\n\n图 3.7. 稀疏矩阵的表示。\n\n### 3.16 稀疏矩阵的类型\n\n\
  稀疏矩阵有三种类型，其类型如下：\n\n1. **下三角矩阵**：在此类稀疏矩阵中，对角线以上的元素均为零，我们称之为下三角矩阵。\n\n![figure](img/00058.jpeg)\n\
  \n图 3.8. 下三角矩阵。\n\n2. **上三角矩阵**：在此类稀疏矩阵中，对角线以下的元素均为零，我们称之为上三角矩阵。\n\n![figure](img/00059.jpeg)\n\
  \n图 3.9. 上三角矩阵。\n\n3. **对角矩阵**：在此类型中，非零元素只出现在对角线上或相邻对角线上。这种类型被称为对角矩阵。\n\n![figure](img/00060.jpeg)\n\
  \n图 3.10. 对角矩阵。\n\n### 3.17 稀疏矩阵的表示\n\n稀疏矩阵有两种表示方法如下：\n\n1. **数组表示法/三元组表示法**：这种表示包含行、列和非零元素/值，用于稀疏矩阵。非零元素的位置和值。\n\
  \n让我们考虑一个稀疏矩阵：\n\n![figure](img/00061.jpeg)\n\n图 3.11. 稀疏矩阵。\n\n该稀疏矩阵的数组表示为：\n\n\
  | 行 | 列 | 非零值 |\n| :--- | :--- | :--- |\n| 0 | 4 | 1 |\n| 2 | 2 | 3 |\n| 3 | 1 |\
  \ 5 |\n\n2. **链表示法**：稀疏矩阵也可以用链表示。在这种表示中我们将行、列和非零元素存储在一个节点中，并有一个指针指向下一个位置。为了更清楚地理解，让我们考虑一个例子。\n\
  \n让我们考虑稀疏矩阵：\n\n![figure](img/00062.jpeg)\n\n稀疏矩阵的链表示如下：\n\n![figure](img/00063.jpeg)\n\
  \n图 3.12. 稀疏矩阵的链表示。\n\n## 常见问题\n\n**Q. 解释什么是稀疏矩阵。**\n\n**答案：**\n\n零元素远多非零元素的矩阵被称为稀疏矩阵。以二维数组作为内存中矩阵的自然方法可能不适用于稀疏矩阵。通过存储非零元素可以节省空间。我们可以使用三元组存储法来表示稀疏矩阵：\n\
  \n1. 行优先方法\n2. 列优先方法\n\n### 3.18 总结\n\n- 数组是连续内存中同类类型数据元素的集合。数组是一种线性数据结构，因为数组的所有元素都是按线性顺序存储的。\n\
  - 数组在使用前必须声明。\n- 编译时对数组元素的初始化与我们在声明时初始化普通或普通变量相同。\n- 运行时数组元素的初始化是指从键盘输入值的方法。\n-\
  \ 一维数组元素的地址可以很容易地计算，因为数组将所有数据元素存储在连续内存位置，并存储了基地址。\n\n\n\n\n\n*   遍历数组（Traversing）意味着访问数组中的每一个元素一次，以便对其进行处理。\n\
  *   在数组中插入元素（Insertion）是指向数组中添加元素的操作。它可以通过三种方式实现。\n*   从数组中删除元素（Deleting）是指从数组中移除元素的操作。删除操作也可以通过三种方式完成。\n\
  *   在数组中查找元素（Searching）意味着查找某个值是否存在于数组中。如果找到了该特定值，则认为搜索成功，并返回该特定值的位置/地址。如果未找到该值，则认为搜索不成功。\n\
  *   线性查找（Linear search）是一种用于在数组中查找特定值的非常简单的技术。\n*   合并两个数组（Merging）意味着将第一个和第二个数组的元素复制到第三个数组中。\n\
  *   排序（Sorting）是指按照指定的顺序（升序或降序）排列数据结构中的数据元素。\n*   选择排序（Selection Sort）是一种排序技术，通过寻找数组中的最小值并将其放在第一个位置来工作。之后，它找到第二个最小值并将其放在第二个位置。重复此过程，直到整个数组排序完成。\n\
  *   与一维数组不同，二维数组（2-D arrays）以网格或表格的形式组织。它们是一维数组的集合。\n*   声明二维数组时，我们必须知道数组的名称、每个元素的数据类型以及每个维度的大小（行和列的大小）。\n\
  *   多维数组（Multidimensional array）也称为 n 维数组。它是数组的数组。它内部有 n 个索引，这也解释了它作为 n 维数组的名字。\n\
  *   指针（Pointer）是一种特殊的变量，用于存储地址。指针可以访问和操作存储在内存的数据。\n*   稀疏矩阵（Sparse matrix）是一种零元素比例较高的矩阵。使用稀疏矩阵是因为它能够有效地利用内存空间。\n\
