  \ `Merge()` 函数将所有子数组合并成单一的有序数组。\n\n## 归并排序的复杂度\n\n归并排序算法的运行时间为 `O(n log[10]n)`。这种运行时间在归并排序的平均最坏情况下保持不变。尽管它具有最优的时间复杂度，但有时这种运行时间可能是\
  \ `O(n)`。\n\n编写一个程序使用归并排序方法对数组排序。\n\n```\n # include<stdio.h>\n# include<conio.h>\n\
  void merge(intarr[], int i1, int j1, i2, int j2) ;\nvoid merge_sort(intarr[], int\
  \ beg, int end)\n{\n  int mid ;\n  if(beg < end)\n   {\n     mid=(beg+end)/2;\n\
  \     merge_sort(arr, beg, mid) ;\n     merge_sort(arr, mid+1, end) ;\n     merge(arr,\
  \ beg, mid, mid+1, end) ;\n   }\n}\nvoid merge(intarr[], int i1, int j1, int i2,\
  \ int j2)\n{\n  int temp[20] ;\n  int i, j, k ;\n  i = i1 ;\n  j = i2 ;\n  k = 0\
  \ ;\n  while(i < j1 && j < j2)\n   {\n     if(arr[i] <arr[j])\n      {\n       \
  \ temp[k] = arr[i] ;\n        k++ ;\n        i++ ;\n      }\n     else if(arr[i]\
