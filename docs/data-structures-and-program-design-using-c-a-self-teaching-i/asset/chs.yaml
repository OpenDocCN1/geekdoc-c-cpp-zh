  C. 目录\nD. 系统\n\n## 第 12 章\n\n## 图\n\n**本章内容**\n\n- 引言\n- 定义\n- 图的表示\n- 图的遍历技术\n\
  - 拓扑排序\n- 最小生成树\n- 总结\n- 练习题\n\n### 12.1 引言\n\n到为止，我们已经学习了广泛应用于各种应用程序的不同类型的线性数据结构。但我们目前为止学习的唯一非线性数据结构是树。在树中，我们讨论了父子关系，一个父节点可以有多个孩子。但在图中，这种父子关系的限制较少，也就是说，任何复杂的关系都可以存在。因此，树可以被泛化为一种特殊的图。因此，图是一种具有广泛现实应用的非线性数据结构。*图是一些顶点（节点）和连接这些顶点的边的集合*。\
  \ [#part0019.html_fig12-1] 表示一个图。\n\n![figure](img/00321.jpeg)\n\n**图 12.1**。一个图。\n\
  \n因此，*图 `G` 可以定义为顶点和边的一个有序集合 `(V, E)`，其中 `V(G)` 表示顶点集，`E(G)` 表示连接这些顶点的边集*。在之前的图中，`V(G)\
  \ = {A, B, C, D, P, Q}` 表示顶点集，`E(G) = {(A, B), (B, D), (D, C), (C, A), (C, Q), (Q,\
  \ D), (A, P), (P, C)}` 表示边集。\n\n**实际应用：**\n\n图的一个简单说明是，当我们在社交媒体（例如 Facebook）上建立朋友时，每个用户都是一个顶点，两个用户相互连接就形成了一条边。\n\
  \n现在，图有两种类型：\n\n1. **无向图** – 在无向图中，边没有与之关联的方向。如如下图所示，节点 A 和 B 是连接的。\n\n![figure](img/00322.jpeg)\n\
  \n**图 12.2**。一个无向图。\n\n2. **有向图** – 在有向图中，边带有关联的方向。如如下所示，节点 A 和 B 带有箭头。\n\n![figure](img/00323.jpeg)\n\
  \n**图 12.3**。有向图。\n\n### 12.2 定义\n\n- **度（Degree）** – 节点的度是与之相关的边的总数。\n- **入度（In-degree）**\
  \ – 节点的入度等于进入节点的边的数量。\n- **出度（Out-degree）** – 节点的出度等于离开该节点的边的数量。\n\n![figure](img/00324.jpeg)\n\
  \n**图 12.4**。显示入出的图。\n\n- **孤立节点（Isolated Node）** – 零边的节点被称为孤立节点。\n\n![figure](img/00325.jpeg)\n\
  \n**图 12.5**。两个孤立节点。\n\n- **悬挂节点（Pendant Node）** – 有一条节点的被称为悬挂节点。\n\n![figure](img/00326.jpeg)\n\
  \n**图 12.6**。两个悬挂节点。\n\n- **相邻（Adjacent Nodes）** – 对于连接节点 A 和 B 的每条边 `(A, B)`，节点\
  \ A 和 B 被称为相邻。\n- **平行边（Parallel Edges）** – 如果一对节点之间有多条边，它们被称为平行边。\n\n![figure](img/00327.jpeg)\n\
  \n**图 12.7**。A 和 B 之间的平行边。\n\n- **自环（Loop）** – 如果一条边的起点和终点是同一个节点，即 `e = (A, A)`，那么它被称为自环。\n\
  \n![figure](img/00328.jpeg)\n\n**图 12.8**。一个自环。\n\n- **简单图（Simple Graph）** – 如果图\
  \ `G(V, E)` 不包含任何自环或平行边，则它被称为简单图。\n- **完全图（Complete Graph）** – 当且仅当图中的每个节点都连接到另一个节点，且任何节点上都没有自环时，图\
  \ `G(V, E)` 被称为完全图。\n\n![figure](img/00329.jpeg)\n\n**图 12.9**。完全图。\n\n- **正则图（Regular\
  \ Graph）** – 正则图是指每个节点度相同的图。如果每个节点的度为 `r`，则该图称为 `r`阶正则图。在给定的图中，所有节点的度都相同，即为 2；因此，它被称为\
  \ 2 阶正则图。\n\n![figure](img/00330.jpeg)\n\n**图 12.10**。2 阶正则图。\n\n- **多图（Multi-graph）**\
  \ - 如果图 `G(V, E)` 包含自环、平行边或两者兼有，则它被称为多图。\n\n![figure](img/00331.jpeg)\n\n**图 12.11**。多图。\n\
  \n\n\n\n\n- **环 (Cycle)** – 它是一条包含一条或多条边的路径，从特定节点开始并终止于同一个节点。\n\n- **环图 (Cyclic\
  \ Graph)** – 包含环的图被称为环图。\n\n- **无环图 (Acyclic Graph)** – 不包含任何环的图被称为无环图。\n\n- **连通图\
  \ (Connected Graph)** – 如果图 `G(V, E)` 中的任意一个节点到图中另一个节点之间都存在路径，使得对于每一对不同的节点都必须存在路径，则称该图为连通图。\n\
  \n![figure](img/00333.jpeg)\n\n*图 12.13*. 连通图。\n\n- **强连通图 (Strongly Connected Graph)**\
  \ – 如果有向图中每对节点之间都存在特定的路径，则该有向图为强连通图。例如，如果有两个节点（`P` 和 `Q`，且存在从 `P` 到 `Q` 的专用路径，那么从\
  \ `Q` 到 `P` 也必须存在路径。\n\n![figure](img/00334.jpeg)\n\n*图 12.14*. 强连通图。\n\n- **图的大小\
  \ (Size of a graph)** – 图的大小等于图中存在的边总数。\n\n- **加权图 (Weighted Graph)** – 如果图 `G(V,\
  \ E)` 中的所有边都被分配了某些数据，则称该图为加权图。这些数据表示遍历边的代价。\n\n![figure](img/00335.jpeg)\n\n*图 12.15*.\
  \ 加权图。\n\n### 12.3 图的表示\n\n图可以通过以下两种方式存储在计算机内存中：\n\n1. 使用邻接矩阵对图进行顺序表示\n2. 使用邻接表对图进行链表示\n\
  \n现在，让我们详细讨论这两种方法。\n\n### 12.3.1 邻接矩阵表示\n\n邻接矩阵用于表示相互相邻的节点的信息。只有当两个节点之间存在连接边时，这两个节点才是相邻的。对于任何具有\
  \ `n` 个节点的图 `G`，邻接矩阵的维度为 `(n X n)`。设 `G(V, E)` 是一个顶点集合 `V = {V[1], V[2], V[3]………V[n]}`\
  \ 的图，则邻接矩阵表示 `(n X n)` 如下：\n\n![figure](img/00336.jpeg)\n\n邻接矩阵也被称为位矩阵或布尔矩阵，因为它只包含\
  \ `0` 和 `1`。现在，让我们通过几个例子来更清楚地讨论和理解它。\n\n**示例 1** – 考虑给定的有向图并找到它的邻接矩阵。\n\n![figure](img/00337.jpeg)\n\
  \n*图 12.16*. 一个有向图。\n\n该图的邻接矩阵为：\n\n![figure](img/00338.jpeg)\n\n**示例 2** – 现在，考虑给定的无向图并找到它的邻接矩阵。\n\
  \n![figure](img/00339.jpeg)\n\n*图 12.17*. 一个无向图。\n\n该图的邻接矩阵为：\n\n![figure](img/00340.jpeg)\n\
  \n**示例 3** – 现在，考虑给定的加权图并找到它的邻接矩阵。\n\n![figure](img/00331.jpeg)\n\n*图 12.18*. 一个有向加权图。\n\
  \n该图的邻接矩阵为：\n\n![figure](img/00342.jpeg)\n\n**示例 4** – 考虑给定的无向多向图并找到它的邻接矩阵。\n\n\
  ![figure](img/00343.jpeg)\n\n*图 12.19*. 一个无向多向图。\n\n该图的邻接矩阵为：\n\n![figure](img/00344.jpeg)\n\
  \n从上述示例中，我们可以得出：\n\n- 使用邻接矩阵表示图所需的内存空间为 `n²` 位。\n- 无向图的邻接矩阵始终是对称的。\n- 有向图的邻接矩阵不一定是对称的。\n\
  - 没有自环或并边的简单图，其邻接矩阵的对角线上始终包含 `0`。\n- 加权图的邻接矩阵始终包含连接节点的的边权重，而不是 `0` 和 `1`。\n- 无向多向图的邻接矩阵将包含连接顶点的边数，而不是\
  \ `1`。\n\n### 12.3.2 邻接表表示\n\n邻接矩阵表示存在一些缺点。首先，在图中插入或删除节点非常困难，因为矩阵的大小需要相应改变，这是一个非常耗时的过程。此外，矩阵有时包含许多零（稀疏矩阵）。因此，这不是一种健康的表示方式。因此，在内存中表示稀疏图时优先使用邻接表表示。在这种表示中，每个节点都与其所有相邻节点的列表链接。邻接表表示使得添加或删除节点变得更容易。此外，它还能显示特定节点的相邻节点。现在，让我们通过几个例子来更清楚地讨论和理解它。\n\
  \n**示例 1** – 考虑给定的无向图并找到它的邻接表表示。\n\n![figure](img/00345.jpeg)\n\n*图 12.20*. 一个无向图。\n\
  \n该图的邻接表表示为：\n\n![figure](img/00346.jpeg)\n\n**示例 2** – 考虑给定的有向图并找到它的邻接表表示。\n\n\
  ![figure](img/00347.jpeg)\n\n*图 12.21*. 一个有向图。\n\n该图的邻接表表示为：\n\n![figure](img/00348.jpeg)\n\
  \n**示例 3** – 现在，考虑给定的加权图并找到它的邻接表表示。\n\n![figure](img/00349.jpeg)\n\n*图 12.22*. 一个加权图。\n\
  \n该图的邻接表表示为：\n\n![figure](img/00350.jpeg)\n\n### 12.4 图的遍历技术\n\n在本节中，我们将讨论各种类型的图遍历技术。众所周知，图是节点和边的集合。因此，在图中的遍历是以某种系统化方法访问每个节点和每条边的过程。因此，有两种标准的遍历技术，分别是：\n\
  \n1. 广度优先搜索 (BFS)\n2. 深度优先搜索 (DFS)\n\n现在，我们将详细讨论这两种技术。\n\n### 12.4.1 广度优先搜索\n\n\
  广度优先搜索是一种使用队列作为辅助数据结构来遍历图中所有节点的遍历技术。在这种技术中，我们首先选择图中任意一个节点作为起始节点，然后取出与起始节点相邻的所有节点。对所有其他节点也采用相同的方法。此外，我们在队列中维护所有已遍历节点的状态，以确保节点不再重复遍历。现在让我们取一个图并应用\
  \ BFS 来遍历该图。\n\n![figure](img/00351.jpeg)\n\n*图 12.23*. 一个示例图。\n\n现在，我们以节点 `A` 为起始节点开始遍历图。然后我们将遍历与起始节点\
  \ `A` 相的所有节点。可以看到，`B`、`C` 和 `E` 是 `A` 的相邻节点。因此我们以任意顺序遍历这些节点，例如 `E`、`C`、`B`。遍历为：\n\
  \n![figure](img/00352.jpeg)\n\n现在，我们将遍历与 `E` 相的所有节点。节点 `C` 与节点 `E` 相。但节点 `C` 已经遍历过了，所以我们忽略它并移动到下一步。现在，我们将遍历与节点\
  \ `C` 相的所有节点。可以看到，`D` 是 `C` 的相邻节点。因此我们遍历节点 `D`，遍历过程为：\n\n![figure](img/00353.jpeg)\n\
  \n现在，我们可以看到所有节点都已经被遍历，因此这就是以节点 `A` 为起始节点的广度优先搜索。\n\n现在，我们将借助队列来实现广度优先遍历技术。在此过程中，我们维护一个数组来存储当前考虑节点的所有未访问的邻居节点。初始时，`front`\
  \ 和 `rear` 设置为 `-1`。我们还会在布尔数组中维护已访问节点的状态，如果节点已访问则值为 `1`，否则则为 `0`。\n\n- 首先，将起始节点入队。\n\
  \n\n\n\n\n-   其次，从队列中删除第一个节点/元素，并将所有相邻的未访问节点插入队列中。重复此过程，直到队列为空。\n\n**举例** – 考虑以下示例图，并使用广度优先搜索（BFS）技术对该图进行遍历。\n\
  \n![figure](img/00354.jpeg)\n\n***图 12.24*** 一幅示例图。\n\n图的适当邻接列表表示给所示：\n\n| 节点 |\
  \ 邻接列表 |\n| :--- | :--- |\n| A | B, C |\n| B | C |\n| C | D |\n| D | B |\n\n在这个示例中，我们取\
  \ A 作为起始节点。\n\n**第 1 步：** 首先，将节点 `A` 插入队列。\n\n![figure](img/00355.jpeg)\n\n**第 2\
  \ 步：** 从队列中删除节点 `A` 并将 `FRONT` 加 1。现在，通过增加 `REAR` 插入所有与 `A` 的节点，即节点 `B` 和 `C`。同时，节点\
  \ `A` 已被访问。\n\n![figure](img/00356.jpeg)\n\n**第 3 步：** 同样，从队列中删除节点 `B` 并将 `FRONT`\
  \ 加 1。现在，通过增加 `REAR` 插入所有与 `B`相邻的节点，即节点 `C`。但 `C` 已经已经在队列中了。因此在这种情况下，现在通过将 `FRONT`\
  \ 加 1 也删除节点 `C`，并将 `C` 的相邻节点（即 `D`）插入队列。因此，节点 `A`、`B` 和 `C` 均已访问。\n\n![figure](img/00357.jpeg)\n\
  \n**第 4 步：** 现在，我们再次从队列中删除头部元素 `D`。我们将插入 `D` 的相邻节点，即 `B`。但它已经被访问过了。最后，当我们删除头部元素\
  \ `D` 时，我们发现 `FRONT > REAR`，这是不成立的。因此，我们已经遍历了图中所有的节点。\n\n![figure](img/00358.jpeg)\n\
  \n因此，该图的广度优先搜索遍历结果如下：\n\n![figure](img/00359.jpeg)\n\n现在，让我们来看广度优先搜索遍历的函数。\n\n#####\
  \ 广度优先搜索遍历函数\n\n```c\n Breadth_First_Search(int node)\n{\n int i , front, rear;\n\
  \ int queue[SIZE];\n front=rear= -1;\n printf(“%d”, node);\n visited[node]= 1;\n\
  \ rear++;\n front++;\n queue[rear]= node ;\n while(front<=rear)\n  {\n    node =\
  \ queue[front];\n    front++;\n    for(i=1; i<=n; i++)\n      {\n       if(adjacent[node][i]==1)\
  \ && visited[node]==0)\n        {\n          printf(“%d”, node);\n          visited[i]=1;\n\
  \          rear++;\n          queue[rear]= i ;\n        }\n      }\n   }\n}\n```\n\
  \n### 12.4.2 深度优先搜索\n\n深度优先搜索是另一种遍历技术，它使用栈作为辅助数据结构来遍历图的所有成员节点。在该技术中，我们首先选择图中的任何一个节点作为起始节点，然后沿着从起始节点开始的路径移动。我们将访问起始节点的相邻节点，再次访问上一个节点的相邻节点，以此此类推。我们将对所有其他节点保持相同的方法。现在，让我们取一个图并应用\
  \ DFS 来遍历该图。\n\n![figure](img/00360.jpeg)\n\n***图 12.25*** 一幅示例图。\n\n现在，我们将以节点 `A`\
  \ 为起始节点开始图的遍历。然后，我们将遍历起始节点 `A` 的任何相邻节点。我们可以看到，`B`、`C` 和 `E` 是 `A` 的相邻节点。如果我们遍历节点\
  \ `E`，那么我们将遍历 `E` 的相邻节点，即 `C`。在遍历 `C` 后，我们将遍历 `C` 的相邻节点，即 `D`。现在，`D` 没有相邻节点，因此我们到达了死胡同。因此，到目前为止的遍历为：\n\
  \n![figure](img/00361.jpeg)\n\n由于死胡同，我们将向后移动。现在，我们到达节点 `C`。我们将检查是否有其他与 `C`相邻的节点。没有这样的节点，因此我们再次向后移动。现在，我们到达\
  \ `E`。我们将再次检查是否有其他与 `E`相邻的节点。没有这样的节点，因此我们再次向后移动。现在，我们到达 `A`。我们将检查是否有其他与 `A`相邻的节点。有两个节点，`B`\
  \ 和 `C`，与节点 `A` 相邻。由于 `C` 已经访问过，它将被跳过。现在，我们将遍历节点 `B`。在遍历 `B` 后，我们将遍历 `B` 的相邻节点，即\
  \ `D`，但 `D` 已经访问过了。因此，我们既不能向后移动也不能向前移动。因此，我们完成了遍历。最终的遍历结果如下：\n\n![figure](img/00362.jpeg)\n\
  \n现在，我们将借助栈来实现深度优先搜索遍历技术。在这里，我们将维护一个数组，该数组将存储所有节点的访问状态。在此过程中，我们将维护一个数组，该数组将存储所有节点的访问状态。初始，`top`\
  \ 设置为 `-1`。如果节点已被访问，则将其跳过；如果未被访问，则重复此过程，直到栈为空。\n\n-   首先，将起始节点入栈。\n-   其次，从栈中弹出第一个节点/元素并访问它。\n\
  -   第三，将弹出节点的所有相邻的未访问节点入栈。\n-   重复此过程，直到栈为空。\n\n**举例** – 考虑以下示例图，并使用深度优先搜索（DFS）技术对该图进行遍历。\n\
  \n![figure](img/00363.jpeg)\n\n***图 12.26*** 一幅示例图。\n\n图的适当邻接列表表示所示：\n\n| 节点 | 邻接列表\
  \ |\n| :--- | :--- |\n| A | B, C |\n| B | C |\n| C | D |\n| D | B |\n\n在这个示例中，我们取\
  \ A 作为起始节点。\n\n**第 1 步：** 首先，将节点 `A` 插入栈。\n\n![figure](img/00364.jpeg)\n\n**第 2\
  \ 步：** 从栈中弹出节点 `A` 并将 `top` 加 1。现在，通过增加 `top` 插入所有与 `A`相邻的节点，即节点 `B` 和 `C`。同时，节点\
  \ `A` 已被访问。\n\n![figure](img/00365.jpeg)\n\n**第 3 步：** 同样，从栈中弹出节点 `B` 并将 `top` 加\
  \ 1。现在，通过增加 `top` 插入所有与 `B`相邻的节点，即节点 `C`。但 `C` 已经已经在栈中了。因此在这种情况下，现在通过将 `top` 加 1\
  \ 也弹出节点 `C`，并将 `C` 的相邻节点（即 `D`）插入栈。因此，节点 `A`、`B` 和 `C` 均已访问。\n\n![figure](img/00366.jpeg)\n\
  \n**第 4 步：** 现在，我们再次从栈中删除头部元素 `D`。我们将插入 `D` 的相邻节点，即 `B`。但它已经被访问过了。最后，当我们删除头部元素 `D`\
  \ 时，我们发现 `top < 0`，这是不可能的。因此，我们已经遍历了图中所有的节点。\n\n![figure](img/00367.jpeg)\n\n因此，该图的深度优先搜索遍历结果如下：\n\
  \n![figure](img/00368.jpeg)\n\n现在，让我们来看深度优先搜索遍历的函数。\n\n##### 深度优先搜索遍历函数\n\n```c\n\
  \ Depth_First_Search(int node)\n{\n int i, stack[SIZE], top = -1, pop ;\n top++\
  \ ;\n stack[top] = node ;\n while(top >= 0)\n  {\n    pop = stack[top] ;\n    top--\
  \ ;\n    if(visited[pop] == 0)\n      {\n       printf(“%d”, pop);\n       visited[pop]\
  \ = 1;\n      }\n     else\n     continue\n     for(i=n; i>=1 ;i--)\n       {\n\
  \        if(adjacent[pop][node] == 1 && visited[node] == 0)\n         {\n      \
  \    top++ ;\n          stack[top] = node ;\n         }\n       }\n   }\n}\n```\n\
  \n**记忆辅助:**\n\n为了记住哪些数据结构用于实现广度优先搜索和深度优先搜索，我们可以使用这种记忆辅助。广度优先搜索使用队列数据结构实现，而深度优先搜索使用栈数据结构实现，因为可以通过字母顺序来记忆。B\
  \ (Breadth First Search) 和 Q (Queue) 在字母顺序在 D (Depth First Search) 和 S (Stack) 之前。\n\
  \n\n\n\n拓扑排序是一种确定无环有向图（也称为 DAG）节点线性顺序的程序，其中每个节点都位于所有入度为非 0 的节点之前。DAG 的拓扑排序是图 `G(V,\
  \ E)` 顶点的线性排序，使得如果 `(a, b)`是一条边，那么 `a` 在拓扑排序中必须出现在 `b` 之前。其背的核心思想是：在图中，如果一个顶点的入度为\
  \ 0，则该顶点应该被选择为拓扑排序中的第一个元素。此外，拓扑排序仅在无环有向图中可能。无环图是指不包含任何环的图。拓扑排序广泛应用于任务调度、应用程序等。现在，让我们来看拓扑排序算法。\n\
  \n### 拓扑排序算法\n\n```Step 1: START\nStep 2: Find 每个节点的入度。\nStep 3: 将所有入度为 0 的节点/元素插入队列。\n\
  Step 4: 重复步骤 5 和步骤 6，直到队列为空。\nStep 5: 通过将 FRONT 加 1，从队列中删除第一个节点。\nStep 6: 对节点 N\
  \ 的每个邻居 P 重复操作——\n    a. 通过将入度减 1，删除从 P 到 M 的边。\n    b. 如果 P 的入度为 0，则将 P 添加到队列队尾。\
  \ \nStep 7: END```\n\n### 示例——考虑一个给定的无环有向图并找到它的拓扑排序。\n\n![figure](img/00369.jpeg)\n\
  \n***图 12.27*.** 无环有向图。\n\n上述图的适当邻接表表示如下：\n\n| 节点 | 邻接列表 |\n| :--- | :--- |\n| A\
  \ | B,C |\n| B | E |\n| C | B,D |\n| D | - |\n| E | - |\n\n**步骤 1:** 所有节点的入度 -\n\
  \n入度 `(A)` – 0\n\n入度 `(B)` – 2\n\n入度 `(C)` – 1\n\n入度 `(D)` – 1\n\n入度 `(E)` – 1\n\
  \n现在，我们有一个入度为 0 的节点 `A`；因此 `A` 将被添加到队列中。\n\n**步骤 2:** 现在，将节点 `A` 插入队列。\n\n`FRONT\
  \ = 1`, `REAR = 1`, `QUEUE = A`\n\n**步骤 3:** 现在，从队列中删除节点 `A`。同时，删除所有从 `A` 出发的边。\n\
  \n`FRONT = 0`, `REAR = 0`, `TOPOLOGICAL SORT = A`\n\n因此，图变为：\n\n![figure](img/00370.jpeg)\n\
  \n现在，所有节点的入度 -\n\n入度 `(B)` – 1\n\n入度 `(C)` – 0\n\n入度 `(D)` – 1\n\n入度 `(E)` – 1\n\
  \n现在，我们有一个入度为 0 的节点 `C`；因此，`C` 将被添加到队列中。\n\n**步骤 4:** 现在，将节点 `C` 插入队列。\n\n`FRONT\
  \ = 1`, `REAR = 1`, `QUEUE = C`\n\n**步骤 5:** 现在，从队列中删除节点 `C`。同时，删除所有从 `C` 出发的边。\n\
  \n`FRONT = 0`, `REAR = 0`, `TOPOLOGICAL SORT = A, C`\n\n因此，图变为：\n\n![figure](img/00371.jpeg)\n\
  \n现在，所有节点的入度 -\n\n入度 `(B)` – 0\n\n入度 `(D)` – 0\n\n入度 `(E)` – 1\n\n现在，我们有两个入度为 0\
  \ 的节点 `B` 和 `D`；因此，`B` 和 `D` 将被添加到队列中。\n\n**步骤 6:** 现在，将节点 `B` 和 `D` 插入队列。\n\n`FRONT\
  \ = 1`, `REAR = 2`, `QUEUE = B, D`\n\n**步骤 7:** 现在，从队列中删除节点 `B`。同时，删除所有从 `B` 出发的边。节点的入度不会发生变化。\n\
  \n`FRONT = 1`, `REAR = 1`, `TOPOLOGICAL SORT = A, C, B, QUEUE = D`\n\n**步骤 8:**\
  \ 现在，从队列中删除节点 `D`。同时，删除所有从 `D` 出发的边。\n\n`FRONT = 0`, `REAR = 0`, `TOPOLOGICAL SORT\
  \ = A, C, B, D`\n\n因此，图变为：\n\n![figure](img/00372.jpeg)\n\n现在，所有节点的入度 -\n\n入度 `(E)`\
  \ – 0\n\n现在，我们有一个入度为 0 的节点 `E`。因此 `E` 将被添加到队列中。\n\n**步骤 9:** 现在，将节点 `E` 插入队列。\n\n\
  `FRONT = 1`, `REAR = 1`, `QUEUE = E`\n\n**步骤 10:** 现在，从队列中删除节点 `E`。同时，删除所有从 `E`\
  \ 出发的边。\n\n`FRONT = 0`, `REAR = 0`, `TOPOLOGICAL SORT = A, C, B, D, E`\n\n现在，图中没有剩余节点了。因此，该图的拓扑排序为\n\
  \n![figure](img/00373.jpeg)\n\n### 12.6 最小生成树\n\n无无向连通图 `G` 的生成树是包含所有顶点以及连接这些顶点的边的子图，并且它是一棵树。\n\
  \n\n\n\n\n[content]\n\n- 在邻接表表示法中，每个节点都与其所有相邻节点的列表相连。\n- 图的遍历是以某种系统方法访问图中每个节点和每条边的过程。\n\
  - 广度优先搜索（BFS）是一种遍历技术，它使用`queue` 作为辅助数据结构来遍历图中所有的成员节点。在这种技术中，我们首先选择图中的任意节点作为起始节点，然后获取与起始节点相邻的所有节点。对所有其他节点也保持相同的方法。\n\
  - 深度优先搜索（DFS）是另一种遍历技术，它使用`stack` 作为辅助数据结构来遍历图中所有的成员节点。同样，我们首先选择图中的任意节点作为起始节点，然后沿着从起始节点开始的路径进行旅行。我们将访问起始节点的相邻节点，再次访问上一个节点的相邻节点，依此类推。\n\
  - 拓扑排序是一种确定无环有向图（也称为 DAG）节点线性顺序的程序，其中每个节点都位于所有前驱为零的节点之前。\n- 最小生成树（MST）定义为一种其边带有权重/成本的生成树，使得该生成树的总权重/成本最小。\n\
