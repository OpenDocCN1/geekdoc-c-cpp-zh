  \n### 本章内容\n- 引言\n- 栈的定义\n- 栈的溢出与下溢\n- 栈的操作\n- 栈的实现\n- 栈的应用\n- 总结\n- 练习题\n\n###\
  \ 7.1 引言\n栈是一种重要的数据结构，广泛应用于许多计算机应用中。可以通过我们日常生活中已经熟悉的许多例子来直观地展示栈。栈的一个非常简单的插图是一堆书，其中一本书放在另一本书的上面，如图\
  \ 7.1 所示。现在，当我们想要移除一本书时，首先移除最顶部的书。因此，我们只能在一个位置（即顶端位置）添加或删除元素（即书）。同样，日常生活中也有许多例子可以看到栈是如何实现的。因此，我们观察到，每当我们谈论栈时，最后一个位置的元素将被首先处理。因此，栈可以被描述为一种\
  \ LIFO（后入先出）数据结构，即最后插入的元素将是第一个取出的。现在，让我们详细讨论栈。\n\n![figure](img/00163.jpeg)\n\n\
  ***图 7.1*** 书堆。\n\n### 7.2 栈的定义\n栈（Stack）是数据元素的线性集合，最后插入的元素将是第一个取出的元素（即栈是一种 LIFO\
  \ 数据结构）。栈是一种抽象数据结构，与队列相似。与队列不同，栈只从一端开放。栈是一种线性数据结构，元素的插入和删除都只在称为 TOP 的末端进行。一端始终关闭的，另一端则用于插入和删除数据。\n\
  \n栈可以使用数组或链表来实现。我们将在本节中讨论如何使用数组和链表来实现栈。\n\n![figure](img/00164.jpeg)\n\n***图 7.2***\
  \ 栈的表示方法。\n\n**实际应用：**\n1. 栈的一个现实生活例子是一堆盘子，一个盘子放在另一个盘子上面。现在，当我们想要移除一个盘子时，首先移除最顶部的盘子。\n\
  2. 栈的另一个现实生活例子是一叠盘片，一个盘片放在另一个盘片上面。现在，当我们想要移除一个盘片时，首先移除最顶部的盘片。\n\n### 7.3 栈的溢出与下溢\n\
  让我们详细讨论栈中的溢出和下溢：\n\n**1. 栈的溢出 (Overflow)** – 栈溢出条件是指当我们尝试向栈中插入元素，但栈已经满的情况。因此，在这种情况下，新元素无法插入栈中。这被称为栈的溢出条件。如果尝试向已经满的栈中插入值，则会打印溢出信息。可以通过以下公式检查：\n\
  \n如果 `TOP = MAX - 1`，其中 `MAX` 是栈的大小。\n\n**2. 栈的下溢 (Underflow)** – 栈下溢条件是指当我们尝试从栈中移除元素，但栈已经为空的情况。因此，在这种情况下，无法从栈中进行任何删除。这被称为栈的下溢条件。如果尝试从已经为空的栈中删除值，则会打印下溢信息。可以通过以下公式检查：\n\
  \n如果 `TOP = NULL`，其中 `MAX` 是栈的大小。\n\n**常见问题解答**\n**Q. 定义栈以及栈上可以执行哪些操作？**\n\n**答案。**\n\
  栈是一种线性数据结构，元素的插入和删除都只在称为 TOP 的末端进行。它本质上是 LIFO 的（即后入先出）。可以在栈上执行的不同操作有：\na. Push（入栈）操作\n\
  b. Pop（弹出）操作\nc. Peek（查看）操作\n\n### 7.4 栈的操作\n可以在栈上执行的三个基本操作是：\n\n### 1. PUSH 入栈\n\
  Push 操作是向栈中添加元素的过程。然而，在向栈插入任何元素之前，我们必须检查溢出情况，即栈是否已经满。\n\n**示例** – 假设有一个五个元素的栈。假设我们要向其中插入另一个元素\
  \ 10；那么 TOP 将增加 1。因此，新元素插入到 TOP 指向的位置。现在，让我们通过下图看到 Push 操作如何在栈中发生：\n\n![figure](img/00165.jpeg)\n\
  \n在插入 10 之后，栈将变为：\n\n![figure](img/0016.jpeg)\n\n***图 7.3*** 插入元素后的栈。\n\n**栈的 Push\
  \ 操作算法**\n```\nStep 1: START\nStep 2: IF TOP = MAX – 1\n            Print OVERFLOW\
  \ ERROR\n            Go to Step 5\n            [End of If]\nStep 3: Set TOP = TOP\
  \ + 1\nStep 4: Set STACK[TOP] = ITEM\nStep 5: EXIT\n```\n在上述算法中，首先检查溢出情况。在步骤 3 中，TOP\
  \ 增加以便指向下一个位置。最后，元素插入栈中。\n\n### 2. POP 出栈\nPop 操作是从栈中移除元素的过程。然而，在从栈删除任何元素之前，我们必须检查下溢情况，即栈是否为空。\n\
  \n**示例** – 假设有一个五个元素的栈。假设我们要从其中删除元素 35；那么 TOP 将减少 1。因此，元素从 TOP 指向的位置被删除。现在，让我们通过下图看到\
  \ Pop 操作如何在栈中发生：\n\n![figure](img/00167.jpeg)\n\n从其中删除 35 之后，栈将变为：\n\n![figure](img/00168.jpeg)\n\
  \n***图 7.4*** 删除元素后的栈。\n\n**栈的 Pop 操作算法**\n```\nStep 1: START\nStep 2: IF TOP =\
  \ NULL\n            Print UNDERFLOW ERROR\n            Go to Step 5\n          \
  \  [End of If]\nStep 3: Set ITEM = STACK[TOP]\nStep 4: Set TOP = TOP – 1\nStep 5:\
  \ EXIT\n```\n在上述算法中，首先检查下溢情况，即栈是否为空。如果栈为空，则不进行删除；否则，TOP 减少到栈的前一个位置。最后，元素从栈中被删除。\n\
  \n### 3. PEEK 查看\n\n\n\n\n\n`Peek` 是一个返回栈顶元素值的操作。它在执行操作时不会删除数组中的栈顶元素。然而，`peek` 操作会首先检查下溢条件。可以通过以下方式检查下溢条件：如果\
  \ `TOP = NULL`。因此，如果下溢条件为真，则屏幕上将显示下溢信息；否则，返回元素的值。\n\n![figure](img/00169.jpeg)\n\
  \n图 7.5 返回栈顶值的栈。\n\n### 栈的 pop 操作算法\n\n```\n Step 1: START\nStep 2: IF TOP = NULL\n\
  \            Print UNDERFLOW ERROR\n            Go to Step 4\n            [End of\
  \ If]\nStep 3: Return STACK[TOP]\nStep 4: EXIT\n```\n\n编写一个执行所有操作的栈的菜单驱动程序。\n\n\
  ```c\n # include<stdio.h>\n # include<conio.h>\n # define MAX 10\nvoid push(int\
  \ stack[], int item) ;\nvoid pop(int stack[], int item) ;\nint peek(int stack[])\
  \ ;\nvoid display(int stack[]) ;\nint top = -1 ;\nvoid main()\n{\n int stack[MAX],\
  \ item, ch ;\n while(1)\n   {\n    clrscr() ;\n\n     printf(“\\nMENU”) ;\n    \
  \ printf(“\\n1\\. PUSH”) ;\n     printf(“\\n2\\. POP”) ;\n     printf(“\\n2\\. PEEK”)\
  \ ;\n     printf(“\\n4\\. DISPLAY”) ;\n     printf(“\\n5\\. EXIT”) ;\n     printf(“\\\
  nenter your choice: ”) ;\n     scanf(“%d”, &ch) ;\n     switch(ch)\n       {\n \
  \       case 1 :\n        printf(“enter value to push: ”) ;\n        scanf(“%d”,\
  \ &item) ;\n        push(stack, item) ;\n        break ;\n\n        case 2 :\n \
  \       pop(stack) ;\n        break ;\n\n        case 3 :\n        item = peek(stack)\
  \ ;\n        if(item != 1)\n        printf(“The value at the top of stack is %d”,\n\
  \        item) ;\n        break ;\n\n        case 4 :\n        display(stack) ;\n\
  \        break ;\n\n        case 5 :\n        printf(“!!Exit!!”) ;\n        exit(0)\
  \ ;\n\n        default :\n        printf(“wrong choice”) ;\n       }\n    }\n }\n\
  \nvoid push(int stack[], int item)\n{\n  //Case 1 用于向栈中插入一个元素\n  if(top == MAX -\
  \ 1)\n   {\n    printf(“\\noverflow error”) ;\n   }\n  else\n   {\n    top++ ;\n\
  \    stack[top] = item ;\n    printf(“Success!!”) ;\n    getch() ;\n   }\n}\n\n\
  void pop(int stack[], int item)\n{\n  //Case 2 用于从栈中删除一个元素\n  if(top == -1)\n  \
  \ {\n    printf(“\\nunderflow error”) ;\n   }\n  else\n   {\n    item = stack[top]\
  \ ;\n    top -- ;\n    printf(“deleted value is %d”, item) ;\n   }\n  getch();\n\
  \ }\n\nint peek(int stack[])\n{\n  //Case 3 用于显示栈的栈顶元素\n  if(top == -1)\n   {\n\
  \    printf(“Empty Stack”) ;\n   }\n  else\n  return(stack[top]) ;\n\n}\nvoid display(int\
  \ stack[]) {\n  int i ;\n  //Case 4 用于显示栈的元素\n  front = front + 1 ;\n  for(i = rear\
  \ ; i > front ; i--)\n   {\n    printf(“\\n%d”, stack[i]) ;\n   }\n  getch() ;\n\
  \ }\n```\n\n### 输出 –\n\n![figure](img/00097.jpeg)MENU![figure](img/00097.jpeg)\n\
