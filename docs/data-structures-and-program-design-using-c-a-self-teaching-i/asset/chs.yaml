  \nEnter value to insert: 125\n\nSuccess!!\n\n### 7.5 栈的实现\n\n栈可以用两种数据结构来表示：\n\n\
  1. 使用数组表示栈。\n2. 使用链表表示栈。\n\n现在，让我们详细讨论这两种。\n\n### 7.5.1 使用数组实现栈\n\n栈可以使用数组轻松实现。初始，栈的\
  \ `TOP` 指针指向数组的第一个位置或位置。当我们向栈中插入新元素时，`TOP` 会不断增加，始终指向下一个元素将要插入的位置。使用数组表示栈所示：\n\n\
  ![figure](img/00170.jpeg)\n\n图 7.6 栈的数组表示。\n\n### 7.5.2 使用链表实现栈\n\n我们已经学习了如何使用数组实现栈。现在让我们讨论一下使用链表实现相同的方法。我们已经知道，在链表中，会进行动态内存分配，即内是在运行时分配的。但在数组的情况下，内存是在程序开始时分配的。如果我们预先知道栈的最大尺寸，那么使用数组实现栈将是高效的。但如果提前不知道大小，那么使用数组实现栈将是高效的（注：此处原文可能逻辑有误，已按原意翻译）。\n\
  \n![figure](img/00171.jpeg)\n\n图 7.7 栈的链表表示。\n\n#### 7.5.2.1 栈中的 Push 操作\n\n`push`\
  \ 操作是向已存在的栈添加新元素的过程。元素将始终插入在栈顶位置。初始，我们将检查 `TOP = NULL`。如果条件为真，则栈是空的。我们将通过算法进一步理解：\n\
  \n**在链栈中插入新元素的算法**\n\n```\n Step 1: START\nStep 2: Set NEW NODE -> INFO = VAL\n\
  \            IF TOP = NULL\n            Set NEW NODE -> NEXT = NULL\n          \
  \  Set TOP = NEW NODE\n            ELSE\n            Set NEW NODE -> NEXT = TOP\n\
  \            Set TOP = NEW NODE\n            [End of If]\nStep 3: EXIT\n```\n\n\
  示例 – 考虑一个具有四个元素的栈；要在栈中插入新元素。\n\n![figure](img/00172.jpeg)\n\n图 7.8 插入前的栈。\n\n在栈中插入元素后，更新后的栈所示：\n\
  \n![figure](img/00173.jpeg)\n\n图 7.9 插入节点后的栈。\n\n#### 7.5.2.2 栈中的 Pop 操作\n\n`pop`\
  \ 操作是从存在的栈中移除元素的过程。元素将始终从 `TOP` 指向的节点删除。初始，我们将检查 `TOP = NULL`。如果条件为真，则栈是空的，这意味着我们无法从中删除任何元素。因此，在这种情况下，屏幕上将显示下溢信息。我们将通过算法进一步理解：\n\
  \n**从链栈中删除元素的算法**\n\n```\n Step 1: START\nStep 2: IF TOP = NULL\n            Print\
  \ UNDERFLOW ERROR\n            [End of If]\nStep 3: Set TEMP = TOP\nStep 4: Set\
  \ TOP = TOP -> NEXT\nStep 5: FREE TEMP\nStep 6: EXIT\n```\n\n示例 – 考虑一个具有五个元素的栈；要从栈中删除元素。\n\
  \n![figure](img/00174.jpeg)\n\n图 7.10 删除前的栈。\n\n从栈中删除元素后，更新后的栈所示：\n\n![figure](img/00175.jpeg)\n\
  \n图 7.11 删除栈顶节点/元素后的栈。\n\n\n\n\n\n```c\n # include<stdio.h>\n# include<conio.h>\
  \ \nstruct node\n{\n  int info ;\n  struct node *next ;\n} *top = NULL ;\nvoid push(int\
  \ item) ;\nvoid pop() ;\nvoid display() ;\nvoid main()\n{\n  int item, choice ;\n\
  \  while(1)\n   {\n    clrscr() ;\n    printf(“\\n***MENU***”) ;\n    printf(“\\\
