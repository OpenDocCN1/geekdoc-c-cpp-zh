  \nA. 链表表示\nB. 数组表示\nC. 都是\nD. 以上都不是\n\n# 第 6 章\n\n# 搜索与排序\n\n### 本章内容\n- 搜索简介\n\
  - 线性查找或顺序查找\n- 二分查找\n- 间值查找\n- 排序简介\n- 外部排序\n- 总结\n- 练习题\n\n### 6.1 搜索简介\n\n众所周知，计算机系统通常用于存储大量数据。我们需要一些搜索机制来从计算机系统存储的大量数据中检索特定的记录。搜索意味着查找某个特定数据项是否存在于数组/列表中。*在列表或数组中查找特定值的过程被称为搜索*。如果数组中存在该特定值，则认为搜索成功，并且搜索过程会返回该特定值的位置。然而，如果该值不存在，或者说如果该值不在数组中，则认为搜索不成功。这里有许多不同的搜索算法，但其中三种流行的搜索技术如下：\n\
  \n- 线性查找或顺序查找\n- 二分查找\n- 间值查找\n\n因此，我们将详细讨论所有这些方法。\n\n### 6.2 线性查找或顺序查找\n\n线性查找也称为顺序查找。这是一种在数组中查找特定值的非常简单的技术。*线性查找的工作原理是将待搜索的键值与数组中的每个元素按线性顺序进行比较，直到找到匹配项为止*。如果读取了所有数据元素仍未找到所需的元素，则搜索将失败。以下是一些重要点：\n\
  \n- 它是列表中查找元素最简单的方法。\n- 无论数组是排序的还是未排序，它都会顺序搜索数据元素。\n\n**例如** – 让我们取一个声明如下的包含 10\
  \ 个元素的数组：\n\n```\nint array[10] = {87, 25, 14, 39, 74, 1, 99, 12,\n            \
  \    30, 67};\n```\n\n在数组中要搜索的值为 `VALUE = 74`，则搜索查找 74 是否存在数组中。如果该值存在，则返回它的位置。这里\
  \ `VAL = 74` 的位置是 `POS = 4`（索引从零开始），如下图所示：\n\n**第 1 轮 –** 将 87 与 74 比较。由于 87 不等于\
  \ 74，我们将移动到下一轮。\n\n![figure](img/00119.jpeg)\n\n**第 2 轮 –** 将 25 与 74 比较。由于 25 不等于\
  \ 74，我们将移动到下一轮。\n\n![figure](img/00120.jpeg)\n\n**第 3 轮 –** 将 14 与 74 比较。由于 14 不等于\
  \ 74，我们将移动到下一轮。\n\n![figure](img/00121.jpeg)\n\n**第 4 轮 –** 将 39 与 74 比较。由于 39 不等于\
  \ 74，我们将移动到下一轮。\n\n![figure](img/00122.jpeg)\n\n**第 5 轮 –** 将 74 与 74 比较。由于 74 等于\
  \ 74，我们将返回 74 所在的位置，在这种情况下位置为 4。\n\n![figure](img/00123.jpeg)\n\n***图 6.1*** 线性查找的工作原理。\n\
  \n通过这种方式，线性查找被用于在数组中查找特定值。现在让我们通过算法来进一步理解它。\n\n**实际应用：**\n\n线性查找的一个简单且现实的例子是人在电话簿中查找另一个人的电话号码。所以，如果这个人不知道那个人的准确名字，但知道名字是以\
  \ A 开头的，那么他/她将从电话簿的开始开始查找。\n\n#### 线性查找算法\n\n假设 `ARR` 是一个包含 n 个元素的数组 `ARR[1]`、`ARR[2]`、`ARR[3]`、\
  \ . . . `ARR[n]`，其中 `VAL` 是待搜索的元素。那么算法将找到 `VAL` 在数组 `ARR` 中的位置 `POS`。\n\n```\n Step\
  \ 1: 开始\nStep 2: 设置 I = 0, POS = -1\nStep 3: 重复直到 I<N\n            IF (ARR[I] =\
  \ VAL)\n            POS = I 输出 POS\n            跳转到步骤 5\n            [IF 结束]\n \
  \           [循环 结束]\nStep 4: IF (POS = -1)\n            打印 “未找到值，搜索\n          \
  \  不成功”\n            [IF 结束]\nStep 5: 退出\n```\n\n在第 2 步中，我们初始化 `I` 和 `POS`。在第 3\
  \ 步中，通过循环检查 `ARR[I] = VAL`，如果相等，则设置 `POS = I` 并打印 `POS`，然后跳转到步骤 5。在第 4 步中，如果 `POS\
  \ = -1`，则打印未找到值。\n\n#### 搜索的复杂度\n\n*在列表或数组中查找特定值的过程被称为搜索*。如果数组中存在该特定值，则认为搜索成功，并且搜索过程会返回该特定值的位置。然而，如果该值不存在，或者说如果该值不在数组中，则认为搜索不成功。这里有许多不同的搜索算法，但其中三种流行的搜索技术如下：\n\
  \n- 线性查找或顺序查找\n- 二分查找\n- 间值查找\n\n因此，我们将详细讨论所有这些方法。\n\n#### 线性查找的复杂度\n\n线性查找的时间复杂度表示为\
  \ `O(n)`，其中 n 是数组中元素的数量。在最坏的情况下（元素位于数组的末尾或不在数组中），需要 n 次比较。在最好的情况下（元素位于数组的开头），只需要一次比较。\n\
  \n#### 6.2.1 线性查找的缺点\n\n- 它是非常耗时的，因为它是顺序执行的。\n- 它仅适用于小量数据。\n- 当数据元素位于末尾时，它的速度非常慢。\n\
  \n编写一个使用线性查找技术在数组中搜索元素的程序\n\n```\n # include <stdio.h>\n# include <conio.h>\nintlinear_search(\
  \ intarr[], int n, int value )\nvoid main()\n{\n  intarr[10], n, i, value ;\n  clrscr()\
  \ ;\n  printf(\"***线性查找***\") ;\n  printf(\"\\n 输入元素个数\") ;\n  scanf(\"%d\", &n)\
  \ ;\n  printf(\"输入数组元素\") ;\n  for( i=0 ; i<n ; i++ )\n   {\n     printf(\"\\n 输入元素\
  \ %d\", i+1) ;\n     scanf(\"%d\", &arr[i]) ;\n   }\n  printf(\"\\nent 要搜索的值\")\
  \ ;\n  scanf(\"%d\", &value) ;\n  r = linear_search(arr, n, value) ;\n  if(r ==\
  \ -1)\n  printf(\"未找到值\") ;\n  else\n  printf(\"%d 位于第 %d 位置\", value, r+1) ;\n\
  \  getch() ;\n}\nintlinear_search( intarr[], int n, int value )\n{\n  int i;\n \
  \ for( i=0 ; i<n ; i++ )\n   {\n     if(arr[i] == value)\n     return i ;\n   }\n\
  \  return (-1);\n}\n```\n\n**输出**\n\n***线性查找***\n\n输入元素个数 9\n\n输入数组元素\n\n输入元素 1\n\
  \n输入元素 2\n\n输入元素 3\n\n输入元素 4\n\n输入元素 5\n\n输入元素 6\n\n输入元素 7\n\n输入元素 8\n\n输入元素 9\n\
  \n输入要搜索的值 23\n\n23 位于第 7 位置\n\n### 常见问题解答\n\n**问：解释如何使用线性查找技术来搜索元素。**\n\n**答：**\
  \ \n\n假设 `ARR` 是一个包含 N 个元素的数组。`ITEM` 是待搜索的值。那么我们有以下情况：\n\n**情况 1：未排序列表** – 将 `ITEM`\
  \ 与数组中的每个元素进行比较。如果找到了元素，则不需要进行进一步比较。如果比较并检查了所有元素，则 `ITEM` 未找到。\n\n**情况 2：排序列表**\
  \ – `ITEM` 大于列表的第一个元素且小于最后一个元素，因此通过将列表中的每个元素与 `ITEM` 进行比较来进行搜索；否则报告 `ITEM` 为“未找到”。\n\
  \n\n\n\n\n### 6.3 二分查找\n\n与线性查找相比，二分查找是一种极其高效的搜索算法。*二分查找仅在数组/列表已排序时才有效。*在二分查找中，我们首先将值\
  \ `VAL` 与数组中间位置的数据元素进行比较。如果找到找到匹配项，则返回该元素的位置 `POS`；否则，如果该值小于中间元素的值，我们从数组的下半部分开始搜索，反之亦然。因此，我们在数组的上半部分和下半部分重复此过程。\n\
  \n### 6.3.1 二分查找算法\n\n现在让我们了解二分查找算法在数组中是如何工作的。\n\n**1.** 找到数组的中间元素，即对于一个包含 `n` 个元素的数组，`n/2`\
  \ 是其中间元素。\n\n**2.** 现在，将数组的中间元素与要查找的数据元素进行比较。\n\n**a)** 如果中间元素就是目标元素，则搜索成功。\n\n\
  **b)** 如果要查找元素小于数组的中间元素，则只搜索数组的下半部分，即中间元素左侧的元素。\n\n**c)** 如果要查找元素大于数组的中间元素，则只搜索数组的上半部分，即中间元素右侧的元素。\n\
  \n重复这些步骤直到找到匹配项。\n\n**实际应用：**\n\n二分查找的现实应用是，当我们在字典中查找特定单词时，首先从字典的中间某处打开。现在，我们将目标单词与该页的第一个单词进行比较。如果目标单词出现在该页第一个单词之后，我们将查找字典的后半部分；否则，查找前半部分。现在，我们再次打开后半部分的页，并将目标单词与该页的第一个单词比较，重复相同的过程直到找到目标单词为止。\n\
  \n### 二分查找算法\n\n`Binary_Search(ARR, Lower_bound, Upper_bound, VAL)`\n\n```\nStep\
  \ 1: START\nStep 2: Set BEG = lower_bound, END = upper_bound, POS = -1\nStep 3:\
  \ Repeat Steps 4 & 5 while BEG <= END\nStep 4: Set MID = (BEG+END)/2\nStep 5: IF\
  \ (ARR[MID] = VAL)\n            POS = MID\n            PRINT POS\n            Go\
  \ to Step 7\n            ELSE IF (ARR[MID] > VAL)\n            Set END = MID – 1\n\
  \            ELSE\n            Set BEG = MID + 1\n            [End of If]\n    \
  \        [End of Loop]\nStep 6: IF (POS = -1)\n            PRINT “VALUE NOT FOUND,\
  \ SEARCH\n            UNSUCCESSFUL”\n            [End of IF]\nStep 7: EXIT\n```\n\
  \n在算法的第 2 步中，我们初始化 `BEG`、`END` 和 `POS` 的值。在第 3 步执行一个 while 循环。在步骤 3 中计算 `MID` 的值。在步骤\
  \ 4 中，我们将检查要查找的值是否等于数组 `MID` 处的值。如果找到匹配项，则打印该元素的位置。如果没有找到匹配项且要查找的值小于 `MID` 处的数组值，则修改\
  \ `END`；否则，如果要查找的值大于 `MID` 处的数组值，则修改 `BEG`。在最后一步，如果所有元素都已比较过且没有找到匹配项，则搜索失败，即该值不在数组中。\n\
  \n**示例说明：**\n\n现在让我们考虑一个在排序数组中查找特定值的例子。\n\n考虑一个有 10 个元素的数组，声明如下：\n\n```\nint array[10]\
  \ = {0, 10, 20, 30, 40, 50, 60, 80,\n                     90, 100};\n```\n\n要查找的值为\
  \ `VAL = 20`。那么算法将如下进行：\n\n**解**\n\n**第 1 轮 –**\n\n`BEG = 0`, `END = 10`\n\n`MID\
  \ = (BEG + END)/2`\n`= (0 + 10)/2 = 5`\n\n现在，`VAL = 20` 且 `ARR[MID] = ARR[5] = 50`\n\
  \n![figure](img/00124.jpeg)\n\n由于 `ARR[5] = 50 > VAL = 20`，因此现在我们在数组的下半部分搜索该值。现在\
  \ `END` 和 `MID` 的值被修改，我们进入下一轮。\n\n**第 2 轮 –**\n\n现在 `END = MID – 1 = 4`\n\n`MID\
  \ = (0 + 4)/2 = 2`\n\n现在，`VAL = 20` 且 `ARR[MID] = ARR[2] = 20`。\n\n![figure](img/00125.jpeg)\n\
  \n**图 6.2.** 二分查找的工作原理。\n\n因此，搜索成功，在 `POS = 2` 处找到了 `VAL = 20`。\n\n### 6.3.2 二分查找算法的复杂度\n\
  \n在二分查找算法中，我们可以看到每次比较搜索区域的大小都会减半。因此，我们可以说二分查找的最佳情况是 `O(1)`，最坏情况是 `O(log n)`。\n\n\
  ### 6.4 插值查找\n\n*插值查找（Interpolation search，也称为外推查找）* 是一种在有序数组中查找特定值的技术。如果数组中的元素是排序的，那么这种搜索技术比二分查找更高效。插值查找的技术类似于我们在电话簿中查找“Abhishek”时；我们不会从中间开始，因为我们知道它会在极左侧，所以我们从前面开始并从那里处理。这就是插值查找的核心思想，即不是将列表固定地对半，而是根据最可能成功的位置进行划分。\n\
  \n### 6.3.3 二分查找的缺点\n\n- 二分查找要求元素是排序的。\n- 最坏情况复杂度为 `O(n)`。\n\n### 6.3.4 常见问题\n\n\
  **Q. 什么是二分查找？请解释。**\n\n**答.** 二分查找是一种用于在数组中查找元素的搜索技术。它对于排序列表非常高效。在二分查找中，要查找的值与数组的中间元素进行比较。如果要查找的值小于中间元素，将在数组的下半部分搜索，反之亦然。\n\
  \n### 6.3.5 写一个程序使用二分查找在数组中的元素。\n\n```c\n # include<stdio.h>\n# include<conio.h>\n\
  int binary_search(intarr[], int n, intval);\nvoid main()\n{\n  intarr[10], n, i,\
  \ r, val;\n  clrscr() ;\n  printf(\"***BINARY SEARCH***\") ;\n  printf(\"\\nenter\
  \ no of elements\") ;\n  scanf(\"%d\", &n) ;\n  printf(\"enter elements of array\"\
  ) ;\n  for( i=0; i<n; i++)\n   {\n     printf(\"\\nenter %d\", i+1) ;\n     scanf(\"\
  %d\", &arr[i]) ;\n  }\n  printf(\"\\nenter value to search\") ;\n  scanf(\"%d\"\
  , &val) ;\n  r = binary_search(arr, n, val) ;\n  if(r == -1)\n  printf(\"value not\
  \ found\") ;\n  else\n  printf(\"%d value found at %d\", val, r+1) ;\n  getch()\
  \ ;\n}\nintbinary_search(intarr[], int n, intval)\n{\n  int start = 0, end = n-1,\
  \ mid ;\n  while(start <= end)\n   {\n     mid = (start+end)/2 ;\n     if(arr[mid]\
  \ == val)\n     return mid;\n     else if(arr[mid] < val)\n     start=mid+1 ;\n\
  \     else\n     end=mid-1 ;\n   }\n  return (-1);\n}\n```\n\n**输出**\n\n***BINARY\
  \ SEARCH***\n\n输入元素个数 8\n\n输入数组元素\n\n输入 1:1\n\n输入 2:5\n\n输入 3:9\n\n输入 4:15\n\n输入\
  \ 5:27\n\n输入 6:35\n\n输入 7:43\n\n输入 8:60\n\n输入要查找的值:35\n\n35 值在第 6 个位置找到\n\n\n\n\n\
  \n在该搜索技术的每一步中，都会计算待搜索数值的剩余搜索区域。计算是基于搜索区域边界上的值以及待搜索的值完成的。因此，在该位置找到的值现在将与待搜索的值进行比较。如果两个值相等，则认为搜索成功。如果两个值不相等，则根据比较的结果，剩余的搜索区域将缩小为初始位置之前或之后的部分。\n\
  \n考虑一个包含 $n$ 个元素的数组 `ARR`，其中元素按排序方式排列。初始将 `low` 设置为 0，`high` 设置为 $n-1$。现在我们要在 `ARR`\
  \ 中 `ARR[LOW]` 和 `ARR[HIGH]` 之间搜索值 `VAL`。那么在这种情况下，`MID` 将通过以下公式计算：\n\n`MID = LOW\
  \ + (HIGH - LOW) X ((VAL – ARR[LOW]) / (ARR[HIGH] – ARR[LOW]))`\n\n如果在 `MID` 处找到了值\
  \ `VAL`，则搜索完成；否则，如果该值低于 `ARR[MID]`，则重置 `HIGH = MID – 1`；如果该值大于 `ARR[MID]`，则重置 `LOW\
  \ = MID + 1`。重复这些步骤直到找到该值。\n\n因此，我们可以说插值查找与二分查找技术非常相似。这些技术的主要区别在于，二分查找中选定的值总是列表的中间值，它根据待搜索值与估计位置值之间的比较来丢弃一半的值。让我们通过算法来理解插值查找：\n\
  \n### 插值查找算法\n\n`INTERPOLATION_SEARCH(ARR, Lower_bound, Upper_bound, VAL)`\n\n```\n\
  Step 1: START\nStep 2: Set LOW = lower_bound, HIGH = upper_bound, POS = -1\nStep\
  \ 3: Repeat Steps 4 & 5 while LOW <= HIGH\nStep 4: Set MID = LOW + (HIGH - LOW)\
  \ X ((VAL – ARR[LOW]) / (ARR[HIGH] – ARR[LOW]))\nStep 5: IF (ARR[MID] = VAL)\n \
  \           POS = MID\n            PRINT POS\n            Go to Step 7\n       \
  \     ELSE IF (ARR[MID] > VAL)\n            Set HIGH = MID – 1\n            ELSE\n\
  \            Set LOW = MID + 1\n            [End of If]\n            [End of Loop]\n\
  Step 6: IF (POS = -1)\n            PRINT “VALUE NOT FOUND, SEARCH UNSUCCESSFUL”\n\
  \            [End of IF]\nStep 7: EXIT\n```\n\n**示例：** 考虑一个声明为 7 个数字的数组：\n\n```\n\
  int array[] = {5, 16, 23, 34, 45, 56, 65} ;\n```\n\n待搜索的值为 45。\n\n**解决方案 –**\n\n\
  **第 1 次通过 –**\n\n`LOW = 0, HIGH = 7 - 1 = 6, VAL = 45`\n\n`ARR[LOW] = ARR[0] = 5,\
  \ ARR[HIGH] = ARR[6] = 65`\n\n现在 `MID = LOW + (HIGH - LOW) X ((VAL – ARR[LOW]) /\
  \ (ARR[HIGH] – ARR[LOW]))`\n\n`= 0 + (6 – 0) X ((45 – 5) / (65 – 5)`\n\n`= 0 + 6\
  \ X (40 / 60) = 4`\n\n![figure](img/00126.jpeg)\n\n`If( VAL == ARR[MID])` 即使 `45\
  \ == ARR[4] = 45, 45 = 45`\n\n**图 6.3.** 插值查找的原理。\n\n因此，找到了该值。\n\n#### 6.4.2 插值查找算法的复杂度\n\
  \n当列表中有 $n$ 个元素且元素分布均匀时，插值查找大约进行 `log10` 次比较。显然，当元素数量呈指数级增加时，会发生最坏情况；在这种情况下，算法可能需要\
  \ `O(n)` 次比较。\n\n编写一个程序使用插值查找技术在数组中搜索元素。\n\n```c\n# include<stdio.h>\n include<conio.h>\n\
  intinterpolation_search (intarr[], int n, intval) ;\nvoid main()\n{\n  intarr[10],\
  \ n, i, r, val ;\n  clrscr() ;\n  printf(“***INTERPOLATION SEARCH***”) ;\n  printf(“\\\
  nenter no of elements”) ;\n  scanf(“%d”, &n) ;\n  printf(“enter the elements of\
  \ array”) ;\n  for( i=0; i<n ; i++)\n   {\n     printf(“\\nenter element %d”, i+1)\
  \ ;\n     scanf(“%d”, &arr[i]) ;\n   }\n  printf(“\\nenter value to search”) ;\n\
  \  scanf(“%d”, &val) ;\n  r = interpolation_search(arr, n, val) ;\n  if(r == -1)\n\
  \  printf(“value not found”) ;\n  else\n  printf(\"%%d value found at %d”, val,\
  \ r+1) ;\n  getch() ;\n}\nintinterpolation_search(intarr[], int n, intval)\n{\n\
  \  // implementation\n}\n```\n\n\n\n\n\n**Pass N-1** – 找到 `ARR[N-2]` 和 `ARR[N-1]`\
  \ 之间较小元素的位置 `POS`，并交换 `ARR[POS]` 与 `ARR[N-2]`。因此，`ARR[0]`、`ARR[1]`、. . . `ARR[N-1]`\
  \ 已经完成排序。\n\n让我们通过详细的算法来讨论一下它。\n\n### 选择排序算法\n\n考虑一个具有从 `ARR[0]` 到 `ARR[N-1]` 的\
  \ `N` 个元素的数组 `ARR`。`I` 和 `J` 是循环变量，`POS` 是交换变量。\n\n`选择排序 SELECTION SORT(ARR, N)`\n\
  \n```\n Step 1: 开始\nStep 2: 对于 I = 1 到 N - 1 重复步骤 3 & 4\nStep 3: 调用 MIN(ARR, I,\
  \ N, POS)\nStep 4: 交换 ARR[I] 与 ARR[POS]\n            [循环结束]\nStep 5: 退出\n```\n\n\
  `MIN(ARR, I, N, POS)`\n\n```\n Step 1: 设置 SMALLEST = ARR[I]\nStep 2: 设置 POS = I\n\
