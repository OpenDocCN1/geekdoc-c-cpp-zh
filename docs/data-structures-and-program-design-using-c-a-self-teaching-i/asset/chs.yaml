  \n在向链表末尾插入新节点的情况下，我们将首先检查溢出条件，即内存是否有空间用于新节点。如果内存不可用，则打印溢出信息；否则，将为新节点分配内存。然后创建一个\
  \ `PTR` 变量，它初始指向 `START`，并将使用 `PTR` 变量遍历链表，直到到达最后一个节点。当到达最后一个节点时，最后一个节点的 `NEXT`\
  \ 部分将存储新节点的节点的地址，而 `NEW NODE` 的 `NEXT` 部分将包含 `NULL`，这表示链表的结束。`NEW NODE` 的 `PREV`\
  \ 部分将存储 `PTR` 所指节点的地址。让我们通过算法来理解它：\n\n### 在链表末尾插入新节点的算法\n\n```\n Step 1: START\n\
  Step 2: IF PTR = NULL\n            Print OVERFLOW\n            [End of If] \nStep\
  \ 3: Set NEW NODE = PTR\nStep 4: Set PTR = PTR -> NEXT\nStep 5: Set NEW NODE ->\
  \ INFO = VALUE\nStep 6: Set NEW NODE -> NEXT = NULL\nStep 7: Set PTR = START\nStep\
  \ 8: Repeat while PTR -> NEXT != NULL\n            Set PTR = PTR -> NEXT\n     \
  \       [End of Loop]\nStep 9: Set PTR -> NEXT = NEW NODE\nStep 10: Set NEW NODE\
  \ -> PREV = PTR \nStep 11: EXIT\n```\n\n因此，通过上一个算法，我们理解了如何在双向链表的末尾插入新节点。现在，我们将通过示例来进一步研究。考虑如下图所示的具有四个节点的链表；新节点将插入到双向链表的末尾：\n\
  \n![figure](img/00081.jpeg)\n\n***图 4.17*** 在双向链表的末尾插入一个新节点。\n\n### 3. 在双向链表的给定节点之后插入一个新节点\n\
  \n在这种情况下，新节点被插入到双向链表的给定节点之后。与其它情况一样，我们再次在其中检查溢出条件。如果用于新节点的内存可用，则将对其进行分配；否则，显示溢出信息。然后创建一个\
  \ `PTR` 变量，它初始指向 `START`，并使用 `PTR` 变量遍历链表，直到其值等于要插入新节点之前的值。当到达该节点/值时，该节点的 `NEXT`\
  \ 部分将存储新节点的地址，而 `NEW NODE` 的 `PREV` 部分将存储其前一个节点的地址。让我们通过以下算法来理解它：\n\n### 在链表中给定节点之后插入一个新节点的算法\n\
  \n```\n Step 1: START\nStep 2: IF PTR = NULL\n            Print OVERFLOW\n     \
  \       Go to Step 10\n            [End of If]\nStep 3: Set NEW NODE = PTR\nStep\
  \ 4: Set NEW NODE -> INFO = VALUE\nStep 5: Set PTR = START\nStep 6: Repeat while\
  \ PTR -> INFO != GIVEN_VAL\n            Set PTR = PTR -> NEXT\n            [End\
  \ of Loop]\nStep 7: Set NEW NODE -> NEXT = PTR -> NEXT\nStep 8: Set NEW NODE ->\
  \ PREV = PTR\nStep 9: Set PTR -> NEXT = NEW NODE\nStep 10: EXIT\n```\n\n现在，我们将通过示例了解更多相关内容。考虑如下图所示的具有四个节点的双向链表；新节点将插入到链表中给定节点之后：\n\
  \n![figure](img/00082.jpeg)\n\n***图 4.18*** 在双向链表的末尾插入一个新节点。（注：此处原文描述可能有误，实际应为在给定节点后插入）\n\
  \n### 4. 在双向链表的给定节点之前插入一个新节点\n\n在这种情况下，新节点被插入到双向链表的给定节点之前。与其它情况一样，我们再次在其中检查溢出条件。如果用于新节点的内存可用，则将对其进行分配；否则，显示溢出信息。然后创建一个\
  \ `PTR` 变量，它初始指向 `START`，并使用 `PTR` 变量遍历链表，直到其值等于要插入新节点之前的值。当到达该节点/值时，该节点的 `PREV`\
  \ 部分将存储 `NEW NODE` 的地址，而 `NEW NODE` 的 `NEXT` 部分将存储其后一个节点的地址。现在为了更好地理解，让我们举一个例子。考虑如下所示的具有四个节点的链表；新节点将插入到链表中给定节点之前：\n\
  \n![figure](img/00083.jpeg)\n\n***图 4.19*** 在双向链表的给定节点之前插入一个新节点。\n\n从上面的示例中可以清楚地看到新节点如何插入到已存在的双向链表中。现在让我们来理解它的算法：\n\
  \n### 在链表中给定节点之前插入新节点的算法\n\n```\n Step 1: START\nStep 2: IF PTR = NULL\n       \
  \     Print OVERFLOW\n            Go to Step 10\n            [End of If]\nStep 3:\
  \ Set NEW NODE = PTR\nStep 4: Set NEW NODE -> INFO = VALUE\nStep 5: Set PTR = START\n\
  Step 6: Repeat while PTR -> INFO != GIVEN_VAL\n            Set PTR = PTR -> NEXT\n\
  \            [End of Loop]\nStep 7: Set NEW NODE -> NEXT = PTR\nStep 8: Set NEW\
  \ NODE -> PREV = PTR ->V\nStep 9: Set PTR -> NEXT = NEW NODE\nStep 10: EXIT\n```\n\
  \n### b) 从双向链表中删除节点\n\n在本节中，我们将学习如何从已存在的双向链表中删除节点。我们将考虑双向链表删除的四种情况：\n\n1. 从链表的头部删除节点。\n\
  2. 从链表的末尾删除节点。\n3. 从链表的给定节点之后删除节点。\n4. 从链表的给定节点之前删除节点。\n\n现在让我们详细讨论所有之前的情况。\n\n\
  #### 1. 从双向链表的头部删除节点\n\n在从双向链头部删除节点的情况下，我们将首先检查上空条件，该条件发生在我们尝试从空链表中删除节点时。这种情况发生在\
  \ `START` 指针等于 `NULL` 时。因此，如果条件成立，则显示上空信息；否则，从链表中删除节点。考虑如下所示的具有五个节点的链表；节点将从链表的头部删除。\n\
  \n![figure](img/00084.jpeg)\n\n***图 4.20*** 从双向链表的头部删除节点。\n\n### 从双向链表头部删除节点的算法\n\
  \n```\n Step 1: START\nStep 2: IF START = NULL\n            Print UNDERFLOW\n  \
  \          [End Of If]  \nStep 3: Set PTR = START\nStep 4: Set START = START ->\
  \ NEXT\nStep 5: Set START -> PREV = NULL\nStep 6: FREE PTR\nStep 7: EXIT\n```\n\n\
  \n\n\n在在上一个算法中，我们首先检查溢出条件（underflow condition），即链表中是否存在节点。如果没有节点，则将打印溢出信息；否则，我们移动到第\
  \ 3 步，将 `PTR` 初始化为 `START`，即 `PTR` 现在将存储第一个节点的地址。在下一步中，`START` 移动到第二个节点，因为现在 `START`\
  \ 将存储第二个节点的地址。同时，第二个节点的 `PREV` 部分现在将包含值 `NULL`。因此，第一个节点被删除，且被 `PTR` 占据的内存被释放（该内存最初是链表的第一个节点）。\n\
  \n## 2. 从双向链表的末尾删除一个节点\n\n在从链表末尾删除节点的情况下，我们首先检查溢出条件。当 `START` 指针等于 `NULL` 时就会出现这种情况。因此，如果条件为真，则在屏幕上打印溢出信息；否则，从链表中删除该节点。考虑下图所示具有五个节点的链表；节点将从链表的末尾被删除。\n\
  \n![figure](img/00085.jpeg)\n\n***图 4.21*** 从双向链表的末尾删除一个节点。\n\n从上一个例子中，可以清楚地看到如何从已存在的双向链表中删除节点。让我们现在理解它的算法：\n\
  \n删除 在双向链表末尾删除节点的算法\n\n```\n Step 1: START\nStep 2: IF START = NULL\n          \
  \  Print UNDERFLOW\n            [End Of If]  \nStep 3: Set PTR = START\nStep 4:\
  \ Repeat while PTR -> NEXT != NULL\n            Set PTR = PTR -> NEXT\n        \
  \    [End of Loop]\nStep 5: Set PTR -> PREV -> NEXT= NULL\nStep 6: FREE PTR\nStep\
  \ 7: EXIT\n```\n\n在在上一个算法中，我们再次检查溢出条件。如果条件为真，则打印溢出信息；否则，将 `PTR` 初始化为 `START` 指针，即\
  \ `PTR` 指向链表的第一个节点。在循环中，`PTR` 一直遍历直到到达链表的最后一个节点。到达链表的最后一个节点后，我们也可以通过从最后一个节点的 `PREV`\
  \ 部分获取地址来访问倒数第二个节点。因此，最后一个节点被删除，被 `PTR` 占据的内存现在被释放。\n\n## 3. 在双向链表中给定节点之后删除一个节点\n\
  \n在从链表中给定节点之后删除节点的情况下，我们将再次检查溢出条件，就像我们在其他两种情况中检查的那样。当 `START` 指针等于 `NULL` 时就会出现这种情况。因此，如果条件为真，则显示溢出信息；否则，从链表中删除该节点。考虑如下所示具有五个节点的链表；节点将在链表的给定节点之后被删除。\n\
  \n![figure](img/00086.jpeg)\n\n***图 4.22*** 在双向链表中给定节点之后删除一个节点。\n\n现在让我们通过算法来理解上一个情况。\n\
  \n在链表中给定节点之后删除节点的算法\n\n```\n Step 1: START\nStep 2: IF START = NULL\n          \
  \  Print UNDERFLOW\n            [End Of If]  \nStep 3: Set PTR = START\nStep 4:\
  \ Repeat while PTR  -> INFO != GIVEN_VAL\n            Set PTR = PTR -> NEXT\n  \
  \          [End of Loop]\nStep 5: Set TEMP = PTR -> NEXT\nStep 6: Set PTR -> NEXT\
  \ = TEMP -> NEXT\nStep 7: Set LAST -> PREV = PTR\nStep 8: FREE TEMP\nStep 9: EXIT\n\
  ```\n\n在上一个算法中，我们首先检查溢出条件。如果条件为真，则打印溢出信息；否则，将 `PTR` 初始化为 `START` 指针，即 `PTR` 指向链表的第一个节点。在循环中，`PTR`\
  \ 一直移动，直到其 info 部分等于要删除节点之前的节点。到达链表中的该节点后，我们也可以通过从该节点的 `NEXT` 部分获取地址来访问后继节点。因此，该节点被删除，被\
  \ `TEMP` 占据的内存现在被释放。\n\n## 4. 在双向链表中给定节点之前删除一个节点\n\n在从链表中给定节点之前删除节点的情况下，我们将再次检查溢出条件，就像我们在其他两种情况中检查的那样。当\
  \ `START` 指针等于 `NULL` 时就会发生这种情况。因此，如果条件为真，则打印溢出信息；否则，从链表中删除该节点。考虑如下所示具有五个节点的链表；节点将在链表的给定节点之前被删除。\n\
  \n![figure](img/00087.jpeg)\n\n***图 4.23*** 在双向链表中给定节点之前删除一个节点。\n\n从上一个例子中，可以清楚地看到如何从已存在的双向链表中删除节点。让我们现在理解它的算法：\n\
  \n在双向链表中给定节点之前删除节点的算法\n\n```\n Step 1: START\nStep 2: IF START = NULL\n        \
  \    Print UNDERFLOW\n            [End Of If]  \nStep 3: Set PTR = START\nStep 4:\
  \ Repeat while PTR  -> INFO != GIVEN_VAL\n            Set PTR = PTR -> NEXT\n  \
  \          [End of Loop]\nStep 5: Set TEMP = PTR -> PREV\nStep 6: Set TEMP -> PREV\
  \ -> NEXT = PTR\nStep 7: Set PTR -> PREV = TEMP -> PREV\nStep 8: FREE TEMP\nStep\
  \ 9: EXIT\n```\n\n在上面的算法中，我们首先检查溢出条件。如果条件为真，则打印溢出信息；否则，将 `PTR` 初始化为 `START` 指针，即\
  \ `PTR` 指向链表的第一个节点。在循环中，`PTR` 一直移动，直到其 info 部分等于要删除节点之后的节点。到达链表中的该节点后，我们也可以通过从该节点的\
  \ `PREV` 部分获取地址来访问前驱节点。因此，该节点被删除，被 `TEMP` 占据的内存现在被释放。\n\n编写一个双向链表的菜单驱动程序，执行所有情况的插入和删除操作。\n\
  \n\n\n\n```c\n#include <stdio.h>\n#include <conio.h>\n#include <alloc.h>\nstruct\
  \ node //自引用结构\n{\n  struct node *prev;\n  int data;\n  struct node *next;\n}* start;\n\
  void add_at_beg();\nvoid add_after(int item);\nvoid add_before(int item);\nvoid\
