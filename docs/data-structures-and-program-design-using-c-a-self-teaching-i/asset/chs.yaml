  \   printf(“\\n4\\. EXIT”) ;\n    printf(“\\nenter your choice: ”) ;\n    scanf(“%d”,\
  \ &choice) ;\n    switch(choice)\n      {\n       case 1 :\n       printf(“enter\
  \ value to insert: ”) ;\n       scanf(“%d”, &item) ;\n       push(item) ;\n    \
  \   break ;\n\n       case 2 :\n       pop() ;\n       break ;\n\n       case 3\
  \ :\n       display() ;\n       break ;\n\n       case 4 :\n       printf(“!!Exit!!”)\
  \ ;\n       exit(0) ;\n\n       default :\n       printf(“wrong choice”) ;\n   \
  \  }\n   }\n}\nvoid push(int item)\n{\n  struct node *Newnode ;\n  //Case 1 is for\
  \ inserting an element in the linked\n  //stack\n  Newnode = (struct node*)malloc(sizeof(struct\
  \ node)) ;\n  Newnode -> info = item ;\n  if(top == NULL)\n   {\n    Newnode ->\
  \ next = NULL ;\n    top = Newnode\n   }\n  else\n   {\n    Newnode -> next = top\
  \ ;\n    top = Newnode ;\n   }\n  printf(“Success!!”) ;\n  getch() ;\n}\nvoid pop()\n\
  {\n  struct node *temp ;\n  //Case 2 is for deleting an element from the linked\n\
  \  //stack\n  temp = top ;\n  if(top == NULL)\n   {\n    printf(“\\nEmpty stack”)\
  \ ;\n   }\n\n  else\n   {\n    top = top -> next ;\n    printf(“deleted value is\
  \ %d”, temp -> info) ;\n    free(temp) ;\n   }\n  getch() ;\n}\n\nvoid display()\n\
  {\n  struct node *ptr ;\n  //Case 3 is for displaying the elements in the linked\n\
  \  //stack\n  if(top == NULL)\n   {\n    printf(“\\nEmpty stack”) ;\n   }\n  ptr\
  \ = top ;\n  while(ptr != NULL)\n   {\n    printf(“%d”, ptr -> info) ;\n    ptr\
  \ = ptr -> next ;\n   }\n  getch() ;\n}\n```\n\n**输出 –**\n\n![figure](img/00097.jpeg)菜单![figure](img/00097.jpeg)\n\
