  \ )\n {\n  for( j=0 ; j<3 ; j++ )\n   {\n    c[i][j] = A[i][j] + B[i][j];\n   }\n\
  \ }\nprintf(\"Resultant matrix is : \");\nfor( i=0 ; i<3 ; i++ )\n {\n  for( j=0\
  \ ; j<3 ; j++ )\n   {\n     printf(\"%d\", c[i][j]);\n   }\n  }\n }\n```\n**输出**\n\
  Enter the elements of A matrix:\n1 2 3\n4 5 6\n7 8 9\nEnter the elements of B matrix:\n\
  9 8 7\n6 5 4\nResultant matrix is : 10 10 10\n10 10 10\n10 10 10\n\n编写一个程序求 3 X\
  \ 3 矩阵的转置。\n\n```c\n #include<stdio.h> \n #include<conio.h> \nvoid main()\n{\n int\
  \ i, j ;\n int matrix[3][3], transpose[3][3] ; clrscr() ;\n printf(\"Enter the elements\
  \ of the matrix:\");\nfor( i=0 ; i<3 ; i++ )\n  {\n   for( j=0 ; j<3 ; j++ )\n \
