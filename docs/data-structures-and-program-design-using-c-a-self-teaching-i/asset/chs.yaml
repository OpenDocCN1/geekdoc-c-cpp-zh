  \ insert_value(BST, item);\n       break;\n\n       case 2:\n       printf(“\\n\
  \ 树的中序遍历结果为： ”);\n       in-order_traversal(BST);\n       break;\n\n       case\
  \ 3:\n       printf(“\\n 树的后序遍历结果为： ”);\n       post-order_traversal( BST);\n  \
  \     break;\n\n       case 4:\n       printf(“\\n 二叉树的前序遍历结果为： ”);\n       pre-order_traversal(BST);\n\
  \       break;\n\n       case 5:\n       printf(“\\n 输入要删除的值： ”);\n       scanf(“\
  \ %d”,&item);\n       BST=delete_value(BST,item);\n       break;\n\n       case\
  \ 6:\n       printf(“\\n 树的高度为 %d”,calculate_\n       height(BST);\n       break;\n\
  \n       case 7;\n       BST = delete_BST(BST);\n       break;\n\n       case 8:\n\
  \       printf(“选择错误!!!”);\n       exit(0);\n      }\n  }\n getch();\n return0;\n\
  }\n\nvoid create_BST(struct node*BST)\n{\n BST = NULL:\n}\n\nstruct node *insert_value(struct\
  \ node *BST, int item)\n{\n struct node *root , *node_root , *parent_root;\n root=(struct\
  \ node*)malloc(sizeof(struct node));\n root->info = item;\n root->lchild = NULL;\n\
  \ root->rchild= NULL;\n if(BST == NULL)\n  {\n    BST = root;\n    BST->lchild ==\
  \ NULL;\n    BST->rchild == NULL;\n  }\n else\n  {\n    parent_root = NULL:\n  \
  \  node_root = BST;\n    while(node_root!=NULL)\n     {\n       parent_root= node_root;\n\
  \       if(item < (node_root->info))\n       node_root=node_root->lchild;\n    \
  \   else\n       node_root=parent_root->rchild;\n     }\n    if(item < (parent_root->info))\n\
  \    parent_root->lchild = root;\n    else\n    parent_root->rchild = root;\n  }\n\
  \ return BST;\n}\n\nvoid in-order_traversal(struct node *BST)\n{\n if(BST != NULL)\n\
  \  {\n    in-order_traversal(BST->lchild);\n    printf(“%d\\t”,BST->info);\n   \
  \ in-order_traversal(BST->rchild);\n  }\n}\n\nvoid post-order_traversal(struct node\
  \ *BST)\n{\n if( BST!= NULL)\n  {\n   post-order_traversal(BST->lchild);\n   post-order_traversal(BST->rchild);\n\
  \   printf(“%d\\t”, BST ->info);\n  }\n}\n\nvoid pre-order_traversal(struct node\
  \ *BST)\n{\n if(BST!= NULL)\n  {\n    printf(“%d\\t”,BST->info);\n    pre-order_traversal(BST->lchild);\n\
  \    pre-order_traversal(BST->rchild);\n  }\n}\n\nstruct tree *delete_value(struct\
  \ node*BST,int item)\n{\n struct node *current,*parent,*succ,*psucc,*ptr;\n if(BST->lchild==NULL)\n\
  \  {\n    printf(“\\n 树是空的”);\n    return(BST);\n  }\n parent = BST;\n current =\
  \ BST->lchild;\nwhile(current !=NULL && item!= current->info)\n  {\n    parent =\
  \ current;\n    current = (item<current -> info) ? current ->lchild:\n    current\
  \ ->rchild);\n  }\n if(current == NULL)\n  {\n    printf(“\\n 树中没有该值”);\n    return(BST);\n\
  \  }\n if(current->lchild==NULL)\n  {\n    parent->lchild = NULL;\n  }\nelse if(current->rchild==NULL)\n\
  \  {\n    parent->rchild = NULL;\n  }\nelse\n  {\n    succ = current->rchild;\n\
  \    while(succ->lchild!=NULL)\n    {\n      succ = succ->lchild;\n    }\n    current->info\
  \ = succ->info;\n    current->rchild = delete_value(current->rchild, succ->info);\n\
  \  }\n return BST;\n}\n```\n\n\n\n\n6. 现在，前序序列中的后续元素是 T 和 I。同时，在中序序列中，T 和 I 位于 U\
  \ 的左侧。因此，T 和 I 将形成 U 的左子树。\n\n![figure](img/00227.jpeg)\n\n7. 前序序列中的下一个元素是 O。在中序序列中，O\
  \ 位于 I 的右侧。因此，O 将形成 I 的右子树。前序序列中的最后一个元素是 N。在中序序列中，N 位于 O 的左侧。因此，N 将形成 O 的左子树。\n\n\
  ![figure](img/00228.jpeg)\n\n最后，根据给定的遍历序列创建二叉树。\n\n### 常见问题解答\n\n**Q. 根据给定的遍历序列创建一个二叉树。**\n\
  \n**中序 – d b e a f c g**\n\n**前序 – a b d e c f g**\n\n**答案。**\n\n**步骤 1：** `a` 是二叉树的根节点。\n\
  \n![figure](img/00229.jpeg)\n\n**步骤 2：** `d`、`b` 和 `e` 位于中序序列中 `a` 节点的左侧。因此，`d`、`b`\
  \ 和 `e` 是根节点 `a` 的左子树。同时，`d` 是 `b` 的左子树，`e` 是 `b` 的右子树。\n\n![figure](img/00230.jpeg)\n\
  \n**步骤 3：** `f`、`c` 和 `g` 位于中序序列中根节点 `a` 的右侧。因此，`f`、`c` 和 `g` 是根节点 `a` 的右子树。同时，`f`\
  \ 是 `c` 的左子树，`g` 是 `c` 的右子树。\n\n![figure](img/00231.jpeg)\n\n### 8.5 AVL 树\n\nAVL\
  \ 树由 Adelson-Velski 和 Landis 于 1962 年发明。以其发明者的名字命名。AVL 树是第一个平衡二叉搜索树。它是一种自平衡二叉搜索树。AVL\
  \ 树也被称为高度平衡树，因为它具有这样一个特性：一个节点的两个子树的高度差最多为 1。AVL 树在执行搜索、插入和删除操作时非常高效，因为执行所有这些操作需要`O(log\
  \ n)` 时间。\n\n### 8.5.1 高度平衡树的需求\n\nAVL 树与二叉搜索树非常相似，但有一个细小的差别。AVL 树有一个特殊的变量，被称为与其关联的平衡因子。AVL\
  \ 树中的每个节点都关联一个平衡因子。平衡因子通过用左子树的高度减去右子树的高度得出。因此，平衡因子为 -1、0 或 1 的节点被称为高度平衡树。高度平衡树的主要需求是使搜索过程变得非常快。这种平衡条件也确保了树的深度为\
  \ `O(log n)`。平衡因子的计算公式如下：\n\n`Balance Factor = Height(左子树) – Height(右子树)`\n\n- 如果树的平衡因子为\
  \ -1，意味着该节点右子树的高度比该节点左子树的高度 1。\n- 如果树的平衡因子为 0，意味着一个节点的左子树和右子树的高度相等。\n- 如果树的平衡因子为\
  \ 1，意味着该节点左子树的高度比其右子树的高度 1。\n\n因此，高度平衡树的整体优势是辅助快速搜索。\n\n![figure](img/00232.jpeg)\n\
  \n***图 8.21*.** 平衡 AVL 树。\n\n### 8.5.2 AVL 树上的操作\n\n在本节中，我们将讨论在 AVL 树上执行的各种操作。这些包括：\n\
  \n- 在 AVL 树中搜索节点\n- 在 AVL 树中插入新节点\n\n现在，让我们详细讨论这两项操作。\n\n#### 1. 在 AVL 树中搜索节点\n\n\
  在 AVL 树中搜索节点的过程与二叉搜索树相同。\n\n#### 2. 在 AVL 树中插入新节点\n\n在 AVL 树中插入新节点的过程与二叉搜索树非常相似。新节点总是作为终端/叶子节点插入到\
  \ AVL 树中。但新节点的插入可能会破坏 AVL 树的平衡，因为平衡因子可能会受到干扰。因此，为了保持树平衡，插入过程之后会跟着旋转过程。旋转过程通常用于恢复树的平衡因子。如果插入过程完成后，每个节点的平衡因子为\
  \ -1、0 或 1，则不需要旋转，因为树已经平衡了；否则，需要旋转。现在，让我们看看给出的示例，看看如何在没有旋转的情况下进行插入。\n\n**示例** –\
  \ 在给定的 AVL 树中，插入一个值为 `60` 的新节点。\n\n初始给出的 AVL 树如下：\n\n![figure](img/00233.jpeg)\n\
  \n***图 8.22*.** 插入前的 AVL 树。\n\n现在，我们将 `60` 插入到 AVL 树中。\n\n![figure](img/00234.jpeg)\n\
  \n***图 8.23*.** 插入 60 后的 AVL 树。\n\n#### 旋转\n\n当插入新节点后平衡因子被破坏时，就会进行旋转。因此，执行旋转是为了恢复树的平衡因子。如果插入过程后每个节点的平衡因子为\
  \ -1、0 或 1，则不需要旋转；否则需要旋转。旋转类型有四种：\n\n- **左左旋转 (LL 旋转)** —— 新节点插入在关键节点的左子树的左子树中。\n\
  - **右右旋转 (RR 旋转)** —— 新节点插入在关键节点右子树的右子树中。\n- **右左旋转 (RL 旋转)** —— 新节点插入在关键节点右子树的左子树中。\n\
  - **左右旋转 (LR 旋转)** —— 新节点插入在关键节点左子树的右子树中。\n\n现在，让我们详细讨论所有这些旋转。\n\n##### LL 旋转\n\n\
  LL 旋转也称为左左旋转，因为新节点插入在关键节点的左子树的左子树中。这是一个单次旋转。让我们举一个例子并对其进行 LL 旋转。\n\n**示例** –\n\n\
  初始给出的 AVL 树如下：\n\n![figure](img/00237.jpeg)\n\n***图 8.25(a)***\n\n在 AVL 树中插入新节点\
  \ `5`。\n\n![figure](img/00238.jpeg)\n\n***图 8.25(b)***\n\n在 AVL 树中插入 `5` 后，节点 `25`\
  \ 的平衡因子被破坏。因此，`25` 是关键节点。于是我们应用 LL 旋转来恢复树的平衡因子。旋转后，节点 `12` 根节点，节点 `5` 和 `25` 分别成为树的左右孩子。\n\
  \n![figure](img/00239.jpeg)\n\n***图 8.25*.** 展示 AVL 树中的 LL 旋转。\n\n\n\n\n因此，执行了 LL\
  \ 旋转，每个节点的平衡因子也得到了恢复。\n\n#### RR 旋转\n\nRR 旋转也称为右右旋转，因为新节点被插入到关键节点右子树的右子树中。它也是一种单旋转。让我们通过一个例子来执行\
  \ RR 旋转。\n\n**举例** –\n\n初始 AVL 树如下：\n\n![figure](img/00240.jpeg)\n图 8.26(a)\n\n\
  在 AVL 树中插入新节点 25。\n\n![figure](img/00241.jpeg)\n图 8.26(b)\n\n在 AVL 树中插入 25 后，节点\
  \ 5 的平衡因子被破坏。因此，5 是关键节点。因此，我们将应用 RR 旋转来恢复树的平衡因子。旋转后，节点 12 成为根节点，节点 5 和节点 25 分别成为树的左孩子和右孩子。\n\
  \n![figure](img/00242.jpeg)\n图 8.26 显示 AVL 树中的 RR 旋转。\n\n因此，执行了 RR 旋转，每个节点的平衡因子也得到了恢复。\n\
  \n#### RL 旋转\n\nRL 旋转也称为右左旋转，因为新节点被插入到关键节点右子树的左子树中。这是一种双重旋转。让我们通过一个例子来执行 RL 旋转。\n\
  \n**举例** –\n\n初始，AVL 树如下：\n\n![figure](img/00243.jpeg)\n图 8.27(a)\n\n在 AVL 树中插入新节点\
  \ 15。\n\n![figure](img/00244.jpeg)\n图 8.27(b)\n\n在 AVL 树中插入 15 后，节点 12 的平衡因子被破坏。因此，12\
  \ 是关键节点。因此，我们将应用 RL 旋转来恢复树的平衡因子。旋转后，节点 15 成为根节点，节点 12 和节点 25 分别成为树的左孩子和右孩子。\n\n\
  ![figure](img/00245.jpeg)\n图 8.27 显示 AVL 树中的 RL 旋转。\n\n因此，执行了 RL 旋转，每个节点的平衡因子也得到了恢复。\n\
  \n#### LR 旋转\n\nLR 旋转也称为左右旋转，因为新节点被插入到关键节点左子树的右子树中。这也是双重旋转。让我们通过一个例子来执行 LR 旋转。\n\
  \n**举例** –\n\n初始，AVL 树如下：\n\n![figure](img/00246.jpeg)\n图 8.28(a)\n\n在 AVL 树中插入新节点\
  \ 15。\n\n![figure](img/00247.jpeg)\n图 8.28(b)\n\n在 AVL 树中插入 15 后，节点 25 的平衡因子被破坏。因此，25\
  \ 是关键节点。因此，我们将应用 LR 旋转来恢复树的平衡因子。旋转后，节点 15 成为根节点，节点 12 和节点 25 分别成为树的左孩子和右孩子。\n\n\
  ![figure](img/00248.jpeg)\n图 8.28 显示 AVL 树中的 LR 旋转。\n\n因此，执行了 LR 旋转，每个节点的平衡因子也得到了恢复。\n\
  \n**常见问题**\n\n**Q. 通过插入以下元素创建一个 AVL 树。**\n\n**60, 10, 20, 30, 19, 120, 100, 80,\
  \ 19**\n\n**答案。**\n\n**步骤 1：** 插入 60。\n![figure](img/00249.jpeg)\n\n**步骤 2：** 插入\
  \ 10。此外，不需要重新平衡。\n![figure](img/00250.jpeg)\n\n**步骤 3：** 插入 20。现在，需要重新平衡。我们将执行 LR\
  \ 旋转。\n![figure](img/00251.jpeg)\n\n**步骤 4：** 执行 LR 旋转后，AVL 树如下 –\n![figure](img/00252.jpeg)\n\
  \n**步骤 5：** 插入 30。不需要重新平衡。\n![figure](img/00253.jpeg)\n\n**步骤 6：** 插入 19。此外，不需要重新平衡。\n\
  ![figure](img/00254.jpeg)\n\n**步骤 7：** 插入 120。不需要重新平衡。\n![figure](img/00255.jpeg)\n\
  \n**步骤 8：** 插入 100。不需要重新平衡。\n![figure](img/00256.jpeg)\n\n**步骤 9：** 插入 80。现在，需要重新平衡。我们将执行\
  \ LL 旋转。\n![figure](img/00257.jpeg)\n\n**步骤 10：** 执行 LL 旋转后，AVL 树如下 –\n![figure](img/00258.jpeg)\n\
  \n**步骤 10：** 插入 19。现在，需要重新平衡。我们将执行 RR 旋转。\n![figure](img/00259.jpeg)\n\n**步骤 11：**\
  \ 执行 RR 旋转后，AVL 树如下 –\n![figure](img/00260.jpeg)\n\n###8.6 总结\n\n- 树定义为一组节点的集合，其中根节点由左子树和右子树组成。它用于存储数据。\n\
  - 根节点是树的顶端。如果根节点为空，树也是空的。叶子节点是指没有子节点的节点。\n- 路径是通往目的地的唯一序列。\n- 节点的度等于它拥有的子节点数量。\n\
  - 二叉树包含三个部分，即左指针、右指针和数据项。二叉树最多有 2 个孩子。\n- 二叉树有两种类型：完全二叉树和扩展二叉树。\n- 在完全二叉树中，除了最后一层外，每一层都必须填满。只有当二叉树中的每个节点都有\
  \ 0 或 2 个孩子时，被称为扩展二叉树（2T 树）。\n- 二叉树在内存中可以用两种表示：数组表示和链表表示。数组表示（也称为顺序表示）使用一维数组实现。链表表示使用链表实现。\n\
  - 二搜索树（BST）是二叉树的一种变体，其中左子树的所有节点都小于根节点。同样，右子树的所有节点都大于根节点。它也被称为有序二叉树。\n- 搜索操作是二搜索树中最常用的操作之一。该操作用于查找树中是否存在特定的键。\n\
  - 插入操作用于在二搜索树中插入具有给定值的新节点。\n- 二搜索树的镜像意味着交换树中每个节点的右子树和左子树。\n- 遍历是按照特定顺序访问树中每个节点一次的过程。树可以通过多种方式进行遍历，即前序遍历、中序遍历和后序遍历。\n\
  - 前序遍历中的“pre”意味着在访问树中的任何其他节点之前访问根节点。因此，它也被称为 DLR 遍历，即数据、左、右。\n- 中序遍历中的“in”意味着在左子树和右子树之间访问根节点。因此，它也被称为\
  \ LDR 遍历，即左、数据、右。\n- 后序遍历中的“post”意味着在访问左子树和右子树之后最后访问根节点。因此，它也被称为 LRD 遍历，即左、右、数据。\n\
  - 如果给出了至少两种遍历结果，就可以构建二叉树，前提是其中一种遍历必须中序遍历，而另一种可以是前序遍历或后序遍历。\n\n\n\n\n• AVL 树是一种自平衡二叉搜索树。AVL\
  \ 树中的每个节点都关联着一个平衡因子。平衡因子的计算方法是用左子树的高度减去右子树的高度。因此，平衡因子为 -1、0 或 1 的节点被称为高度平衡树。\n\n\
