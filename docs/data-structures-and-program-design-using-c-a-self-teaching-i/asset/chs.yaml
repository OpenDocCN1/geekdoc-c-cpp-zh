  \n**图 6.7.** 冒泡排序的工作。\n\n### 冒泡排序的复杂度\n\n冒泡排序是效率最低的排序算法，因此并不常用。在最好的情况下，冒泡排序的运行时间为\
  \ `O(n)`，即数组已经排序。否则，它在平均和最坏情况下的复杂度极差，即 `O(n²)`。\n\n编写一个程序使用冒泡排序法对数组进行排序。\n\n```\n\
