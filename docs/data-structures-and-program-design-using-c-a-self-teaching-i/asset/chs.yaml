  \ ”) ;\n   //Accepting the elements of array\n   for( i=0 ; i<n ; i++ )\n    {\n\
  \     scanf(“%d”, &arr[i]) ;\n    }\n   printf(“***MENU***”) ;\n   printf(“1\\.\
  \ Deletion from beginning ”) ; \n   printf(“2\\. Deletion from specified location\
  \ ”) ;\n   printf(“3\\. Deletion from end ”) ;\n   printf(“Enter your choice: ”)\
  \ ;\n   scanf(“%d”, &choice) ;\n   if(n==10)\n    {\n     printf (“Overflow error\
  \ ”) ;\n     exit(0);\n    }\n   else\n   switch(ch)\n    {\n\n   case 1:\n   for(\
  \ i=0 ; i<n-1 ; i++ )\n    {\n     arr[i] = arr[i+1] ;\n    }\n   case 2:\n   for(\
  \ i=0 ; i<n-1 ; i++ )\n   {\n     arr[i] = arr[i+1] ;\n   }\n   case 3:\n   for(\
  \ i=0 ; i<n-1 ; i++ )\n    {\n     arr[i] = arr[i+1] ;\n    }\n```\n\n\n\n\n\n在第\
  \ 4 个位置找到 99\n\n## 5. 数组的合并\n\n两个数组的合并意味着将第一个和第二个数组的元素复制到第三个数组中。在这里，我们将两个排序的数组，结果合并数组也将是排序的。合并的概念解释如下：\n\
  \n让我们考虑两个排序的数组 `Array 1` 和 `Array 2`，以及一个用于在排序后放置元素的 `Array 3`。\n\n### 数组 – 1\n\
  ![figure](img/00047.jpeg)\n\n### 数组 – 2\n![figure](img/00048.jpeg)\n\n### 数组 – 3\n\
  ![figure](img/00049.jpeg)\n\n`Array 3` 显示了如何使用排序后的 `Arrays 1` 和 `2`形成合并数组。在这里，我们比较两个数组的元素。首先，将\
  \ `Array 1` 的第一个元素与 `Array 2` 的第一个元素比较，由于 6 小于 7 (`6 < 7`)，因此 6 将成为合并数组中的第一个元素。现在，将\
  \ `Array 1` 的第二个元素与 `Array 2` 的第一个元素比较，由于 7 小于 12 (`7 < 12`)，因此 7 将成为合并数组中的第二个元素。现在，将\
  \ `Array 1` 的第二个元素与 `Array 2` 的第二个元素比较，由于 12 小于 14 (`12 < 14`)，因此 12 将成为 `Array\
  \ 3` 中的第三个元素。重复此过程，直到 `Arrays 1` 和 `2` 的元素都放置在合并数组的正确位置上，即 `Array 3`。\n\n**实际应用：**\n\
  \n合并的一个现实生活例子是，如果有两个不同的队伍，并且这两支队伍都需要根据站在队伍中的人的高度进行合并，那么合并将在一个新队伍中进行，新队伍将由两支队伍的人组成，人们将按照身高顺序排列。\n\
  \n写一个程序来合并两个排序的数组。\n\n```c\n #include<stdio.h> \n#include<conio.h> \nvoid main()\
  \ \n {\n int arr1[5], arr2[5], arr3[10] ;\n int m1, m2, s ;\n int i=0, j=0 , k=0\
  \ ;\n clrscr();\n printf(“Enter number of elements in array 1: ”) ;\n scanf(“%d”,\
  \ &m1) ;\n printf(“Enter elements of array 1: ”) ; \n for( s=0 ; s<m1 ; s++)\n \
  \ {\n   printf(“Enter element %d”, s ) ; \n   scanf(“%d”, &arr1[s]) ;\n  }\n printf(“Enter\
  \ number of elements in array 2: ”) ;\n scanf(“%d”, &m2) ;\n printf(“Enter elements\
  \ of array 2: ”) ;\n for( s=0 ; s<m2 ; s++)\n  {\n   printf(“Enter element %d”,\
  \ s) ;\n\n   scanf(“%d”, &arr2[s]) ;\n  } while( i<m1 && j<m2)\n  {\n   if( arr1[i]<arr2[j]\
  \ )\n    {\n     arr3[k]=arr[i] ; \n     k++ ; \n     i++ ;\n    }\n  else if( arr2[j]\
  \ < arr1[i] )\n    {\n     arr3[k] = arr2[j] ;\n     j++ ;\n     k++ ;\n    }\n\
  \   else\n    {\n     arr3[k] = arr[i] ;\n     k++ ; i++ ;\n     arr3[k] = arr[j]\
  \ ;\n     k++ ;\n     j++ ;\n    }\n  }// End of \nwhile loop while( i<m1 )\n  {\n\
  \   arr3[k] = arr1[i] ;\n   k++ ;\n   i++ ;\n  }\n while( j<m2 )\n  {\n   arr3[k]\
  \ = arr2[j] ;\n   k++ ;\n   j++ ;\n  }\n printf(“After merging new array is: ”)\
  \ ;\n for( s=0 ; s<(m1 + m2) ; s++)\n\n  {\n   printf(“%d” , arr3[s]) ;\n  }\n getch()\
  \ ;\n} // End of main\n```\n\n**输出**\n\nEnter number of elements in array 1:\n5\n\
  \nEnter number of elements in array 1:\narr[0] = 6\n\narr[1] = 12\n\narr[2] = 18\n\
  \narr[3] = 24\n\narr[4] = 30\n\nEnter number of elements in array 2:\n5\n\nEnter\
  \ number of elements in array 2:\narr[0] = 7\n\narr[1] = 14\n\narr[2] = 21\n\narr[3]\
  \ = 28\n\narr[4] = 35\n\nAfter merging new array is:\narr[0] = 6\n\narr[1] = 7\n\
  \narr[2] = 12\n\narr[3] = 14\n\narr[4] = 18\n\narr[5] = 21\n\narr[6] = 24\n\narr[7]\
  \ = 28\n\narr[8] = 30\n\narr[9] = 35\n\n## 6. 数组排序\n\n数组排序意味着按照升序或降序排列数据结构中的元素。排序是一个过程，例如，在一个有\
  \ 60 名学生考试的班级中，现在学生的名字将根据他们的成绩按升序或降序打印。\n\n**示例**——假设我们有一个有 10 个元素的数组：\n```c\n array[10]\
  \ = { 78, 12, 47, 55, 61, 99, 84, 32, 10 }\n```\n排序后，新数组将变为：\n```c\n array[10] =\
  \ { 10, 12, 32, 47, 55, 61, 78, 84, 99 }\n```\n有多种排序技术，包括选择排序、插入排序和合并排序；我们将学习选择排序。\n\
  \n### 选择排序\n\n选择排序是一种通过找到数组中的最小值并将其放在第一个位置的技术。之后，它找到第二小值并放在第二个位置。重复此过程直到整个数组排序完成。这是一种非常简单的技术，比其他排序技术更容易实现。选择排序通常用于记录。\n\
  \n### 选择排序技术\n\n考虑一个有 `N` 个元素的数组。\n\n**第 1 趟 (Pass 1)** – 找到 `N` 个元素数组中的最小值，并与 `ARR[0]`\
  \ 交换。因此，`A[0]` 排序完成。\n\n**第 2 趟 (Pass 2)** – 找到 `N-1` 个元素数组中的最小值，并与 `ARR[1]` 交换。因此，`A[1]`\
  \ 排序完成。\n\n**第 N-1 趟 (Pass N-1)** – 找到 `N-2` 和 `N-1` 之间的较小元素，并与 `ARR[N-2]` 交换。因此，`A[0]A[N-1]`\
  \ 排序完成。\n\n**示例**——使用选择排序对给定数组排序。\n\n![figure](img/00050.jpeg)\n\n![figure](img/00051.jpeg)\n\
  \n选择排序技术这样工作的。下面是选择排序的程序。写一个使用选择排序技术对数组排序的程序。\n\n```c\n # include <stdio.h>\n #\
  \ include <conio.h> \n void main()\n {\n  int i, j, pos, arr[10], n, temp;\n  clrscr();\n\
  \n  printf(“enter no of elements in the array”) ;\n  scanf(“%d”, &n) ;\n  printf(“lements\
  \ in the array are ”) ;\n  for( i=0 ; i<n ; i++ )\n   {\n    printf(“nelement %d”,\
  \ i+1) ;\n    scanf(“%d”, &arr[i]);\n   }\n  printf(“Selection Sort”) ;\n  for(\
  \ i=1 ; i<n ; i++ )\n   {\n    min = arr[i-1] ; \n    pos = i-1;\n    for( j=i ;\
  \ j<n ; j++ ) \n     {\n      if( arr[j] < min )\n       {\n        min = arr[j]\
  \ ; \n        pos = j ;\n       }\n   }\n  if( pos != i-1 )\n   {\n    temp = arr[pos]\
  \ ; \n    arr[pos] = arr[i-1] ; \n    arr[i-1] = temp ;\n   }\n  }\n printf(“after\
  \ sorting new array is”) ; \n for( i=0 ; i<n ; i++ )\n  {\n    printf(“ \\t%d”,\
  \ arr[i]) ;\n  }\n getch() ;\n}\n```\n\n**输出**\n\nEnter number of elements 5\nEnter\
  \ elements of array\nelement 1 80\nelement 2 47\nelement 3 51\nelement 4 12\nelement\
  \ 5 67\n\nSelection Sort\nAfter sorting new array is\n12  47  51  67  80\n\n###\
  \ 3.7 2D 数组/二维数组\n\n我们已经讨论了 1D 数组/一维数组及其各种类型和操作。现在，我们将学习二维数组。与一维数组不同，二维数组是以网格或表格的形式组织的。它们是\
  \ 1D 数组的集合。一维数组在内存中是线性组织的。二维数组由两个下标组成：\n\n1. 第一个下标——表示行\n2. 第二个下标——表示列\n\n二维数组的表示如图所示：\n\
  \n![figure](img/00052.jpeg)\n\n**图 3.5.** 二维数组的表示。\n\n### 3.8 二维数组的声明\n\n正如我们声明\
  \ 1D 数组一样，我们也可以声明二维数组。声明二维数组，我们必须知道数组的名称、每个元素的数据类型以及每个维度的大小（行的大小和列的大小）。\n\n```\n\
  语法– data_type array_name [row_size][column_size] ;\n```\n\n二维数组也称为 m X n 数组，因为它包含\
  \ m X n 个元素，数组中的每个元素都可以通过 `i` 和 `j` 访问，其中 `i<=m` 且 `j<=n`，且 `i`、`j`、`m`、`n` 定义如下：\n\
  \ni, j = 元素的下标，\n\nm = 行数，\n\nn = 列数。\n\n**示例**——让我们取一个 3x3 个元素的数组。因此，该数组声明为：\n\n\
  \n\n\n\n```\n int marks [3][3] ;\n```\n\n![figure](img/00053.jpeg)\n\n在之前的图中，该数组有\
  \ 3 行 3 列。数组中的第一个元素用 `marks[0][0]` 表示。同样，第二个元素将用 `marks[0][1]` 表示，依此类推。此外，数组中的数据元素可以通过两种方式存储在内存中：**\n\
  \n### 1. 行主序 (Row Major Order)\n\n在行主序中，第一行的元素存储在第二行、第三行和第 n 行元素之前。在这里，数据元素是按行存储的：\n\
  \n![figure](img/00054.jpeg)\n\n### 2. 列主序 (Column Major Order)\n\n在列主序中，第一列的元素存储在第二列、第三列和第\
  \ n 列元素之前。在这里，数据元素是按列存储的：\n\n![figure](img/00055.jpeg)\n\n现在，我们将计算二维数组中元素的基地址，因为计算机并不存储每个元素的地址。它只存储第一个元素的地址，并根据数组第一个元素的基地址计算其他元素的地址。因此，其他元素的地址可以从给定的基地址计算。\n\
  \n### 1. 行主序中的元素\n\n`Address(A[i][j]) = Base address(BA) + w( n( i-1 ) + ( j-1 )\
  \ )`\n\n### 2. 列主序中的元素\n\n`Address( A[i][j] ) = Base address(BA) + w ( m( j-1 )\
  \ + ( i-1 ) )`\n\n其中 `w` 是存储一个元素所需的字节数。\n\n### 常见问题解答\n\n**Q. 考虑一个 25 X 5 的学生二维数组，其基地址为\
  \ 500，每个元素的大小为 2。现在计算元素 `student[15][3]` 的地址，假设元素按以下方式存储：**\n\n**a)行主序**\n\n**b)列主序**\n\
  \n**答案。**\n\n**a)行主序**\n\n这里给出 `w = 2`，`base address = 500`，`n = 5`，`i = 15`，`j\
  \ = 3`。\n\n`Address( A[i][j] ) = Base address(BA) + w ( n( i-1 ) + ( j-1 ) )`\n\n\
  `Address( student[15][3] ) = 500 + 2 ( 5( 15-1 ) + ( 3-1 ) )`\n`= 500 + 2 (5( 14\
  \ ) + 2 )`\n`= 500 +2 ( 72 )`\n`= 500 + 144`\n\n`Address( student[15][3] ) = 644`\n\
  \n**b)列主序**\n\n这里给出 `w = 2`，`base address = 500`，`m = 25`，`i = 15`，`j = 3`。\n\n\
  `Address( A[i][j] ) = Base address(BA) + w ( m( j-1 ) + ( i-1 ) )`\n\n`Address(\
  \ student[15][3] ) = 500 + 2 ( 25( 3-1 ) + ( 15-1 ) )`\n`= 500 + 2 ( 25( 2 ) + 14\
  \ )`\n`= 500 +2 ( 64 )`\n\n`Address( student[15][3] ) = 500 + 128 = 628`\n\n###\
  \ 3.9 二维数组上的操作\n\n在二维数组上执行着各种操作，包括：\n\n* **求和 (Sum)** – 设 `A[ij]` 和 `B[ij]` 为要相加的矩阵，将结果存储在第三个矩阵\
  \ `C[ij]` 中。当两个矩阵相互兼容时可以进行加法；即它们具有相同的行数和列数。\n\n```\n Cij = Aij + Bij\n```\n\n* **求差\
  \ (Difference)** – 设 `A[ij]` 和 `B[ij]` 为要相减的矩阵，将结果存储在第三个矩阵 `C[ij]` 中。当两个矩阵相互兼容时可以进行减法；即它们具有相同的行数和列数。\n\
  \n```\n Cij = Aij - Bij\n```\n\n* **乘积 (Product)** – 设 `A[ij]` 和 `B[ij]` 为要相乘的矩阵，将结果存储在第三个矩阵\
  \ `C[ij]` 中。如果第一个矩阵的列数等于第二个矩阵的行数，则两个矩阵可以相乘。因此，如果 `n=p`，`m X n` 矩阵 `A` 可以与 `p X q`\
  \ 矩阵 `B` 相乘。\n\n```\n Cij = Aik X Bkj for k=1 to n\n```\n\n* **转置 (Transpose)**\
  \ – `m X n` 矩阵 `A` 的转置等于 `n X m` 矩阵 `B`，其中：\n\n```\n Bij = Aij.\n```\n\n编写一个程序读取并显示一个\
  \ 3 X 3 数组。\n\n```\n #include<stdio.h> \n #include<conio.h> \nvoid main() \n{\n\
  \ int array[3][3], i, j ; \n clrscr() ;\n printf(\"Enter the elements of array \"\
  );\nfor( i=0 ; i<3 ; i++ )\n  {\n   for( j=0 ; j<3 ; j++ )\n    {\n     scanf(\"\
  %d\", &array[i][j]);\n    }\n  }\n printf(\" The array is : \");\n for( i=0 ; i<3\
  \ ; i++ )\n  {\n   printf(\"\\n \");\n   for( j=0 ; j<3 ; j++ )\n    {\n     printf(\"\
  \ array[%d][%d] = %d\", i, j, array[i][j]);\n    }\n  }\n getch()\n}\n```\n**输出**\n\
  Enter the elements of array\n41\n63\n78\n68\n99\nThe array is:\narray[0][0] = 41\n\
  array[0][1] = 63\narray[0][2] = 78\narray[1][0] = 68\narray[1][1] = 36\narray[1][2]\
  \ = 99\n\n编写一个程序求两个矩阵的和。\n\n```c\n #include<stdio.h> \n #include<conio.h> \nvoid\
  \ main()\n{\n int i, j ;\n int A[3][3], B[3][3], c[3][3] ;\n clrscr() ;\n printf(\"\
  Enter the elements of A matrix:\");\nfor( i=0 ; i<3 ; i++ )\n  {\n   for( j=0 ;\
  \ j<3 ; j++ )\n    {\n     scanf(\"%d\", &A[i][j]);\n    }\n  }\n printf(\"Enter\
  \ the elements of B matrix:\");\n for( i=0 ; i<3 ; i++ )\n  {\n   for( j=0 ; j<3\
