  输入元素 8：17\n排序后的新数组为：\n10 17 26 40 44 69 86 93\n\n# 4. 泡排序\n\n泡排序，也称为交换排序，是一种非常简单的排序方法。它通过重复将最大元素移动到数组的最后来实现。在泡排序中，我们每次比较两个元素，如果低索引处的元素大于高索引元素，则交换它们，使得较小的元素逐渐移动。这个过程一直持续直到列表有序。泡排序的名字来源于较大的元素“泡”到数组顶部。这种排序技术只对元素进行比较。因此，我们也可以称为比较排序。\n\
  \n## 泡排序技术\n\n泡排序的基本思想是假设数组 `ARR` 包含 `n` 个元素，那么排序数组所需的迭代次数为 `(n – 1)`。\n\n**第 1\
  \ 轮 –** 在第一次迭代中，数组中的最大值被放在最后一个。\n\n**第 2 轮 –** 在第二次迭代中，数组的第二大值被放在倒第二个位置。\n\n**第\
  \ 3 轮 –** 在第三次迭代中，数组的第三大值被放在倒第三个位置，以此此类推。此过程一直持续直到数组中的所有元素扫描并放在正确的位置，这意味着数组已经排序。\n\
  \n# 泡排序算法\n\n`BUBB SORT(ARR, N)`\n\n```\n Step 1: START\nStep 2: Repeat Step 3 for\
  \ I = 0 to N - 1\nStep 3: Repeat for J = 0 to N - 1\nStep 4: IF (ARR[J] > ARR[J+1])\n\
  \            INTERCHANGE ARR[J] & ARR[J + 1]\n            [End of Inner Loop]\n\
  \            [End of Outer Loop]\nStep 5: EXIT\n```\n\n# 示例 – 使用泡排序技术对以下数组排序。\n\n\
