  \ `0`, `1`, `2`, `. . . ` `9` 写在方括号中表示我们用于标识数组中特定元素的下标。\n\n### 3.6 数组操作\n\n本节讨论了可以在数组上执行的各种操作。这些操作包括：\n\
  \n- 遍历数组\n- 在数组中插入元素\n- 在数组中删除元素\n- 在数组中查找元素\n- 合并两个数组\n- 排序数组\n\n**1. 遍历数组 (Traversing\
  \ an Array)**\n\n遍历数组意味着访问数组中的每个元素以便进行处理。例如打印所有数据元素、对这些元素进行任何处理等。遍历数组元素是非常简单的过程，因为数组具有线性结构（所有元素都存储在连续的内存中）。\n\
  \n**实际应用：**\n\n如果有一排人一个一个站着，一个男孩向排中的中的每个人分发传单。\n\n```\n #include<stdio.h> \n#include<conio.h>\
  \ \nvoid main()\n{\n int i, num[5] ;\n for( i=0 ; i<15 ; i++ )\n  {\n    printf(\"\
  \\n arr[%d] = \", i);\n    scanf(\"%d\", &num[i]) ;\n\n  }//End of for loop 1 \n\
  \ printf(\" The elements of the array are \")) ;\n for( i=0 ; i<5 ; i++ )\n  {\n\
  \    printf(\"\\t%d\", arr[i]) ; \n\n  }//End of for loop 2 \n }//End of main\n\
  ```\n\n**输出**\n\narr[0] = 5\n\narr[1] = 8\n\narr[2] = 16\n\narr[3] = 1\n\narr[4]\
  \ = 7\n\nThe elements of array are 5    8    16    1    7\n\n\n\n\n\n*向数组中插入元素是指向数组中添加元素的操作*。在插入的情况下，我们假设数组中仍有足够的内存空间。例如，如果我们有一个可以容纳\
  \ 20 个元素的数组，而数组中只包含 15 个元素，那么就有空间容纳另外 5 个元素。然而，如果数组只能容纳 15 个元素，那么我们就无法向数组中插入其他元素了。数组插入可以通过三种方式实现：\n\
  \n****a.** 在开头插入\n\n**b.** 在指定位置插入\n\n**c.** 在末尾插入\n\n现在，让我们详细讨论所有这些情况。\n\n### a.\
  \ 在开头插入 – \n在这种情况下，要插入的新元素将插入到数组的开头。为了在开头插入元素，数组中存储的所有元素都必须向前移动一位，以空出数组的第一个位置。例如，如果声明一个数组可以容纳\
  \ 10 个元素，且它只包含 7 个元素，并且规定新元素要插入数组的开头，那么所有存储的元素必须向前移动一位，如下所示：\n\n![figure](img/00032.jpeg)\n\
  \n在交换所有元素并将新元素 10 插入数组后，新数组将是：\n\n![figure](img/00033.jpeg)\n\n#### 在开头插入的算法\n\n\
  我们假设 `ARR` 是一个包含 `N` 个元素的数组。数组中可以存储的最大元素数量由 `SIZE` 定义。我们应该首先检查数组是否有可用空间来存储任何元素，然后进行插入过程。\n\
  \n```\n Step 1: START\nStep 2: IF N = SIZE,\n            PRINT OVERFLOW\n      \
  \      ELSE\n            N = N + 1 \nStep 3: SET I = N\nStep 4: Repeat Step 5 while\
  \ I>=0 \nStep 5: SET ARR[I+1] = ARR[I]\n            [ END OF LOOP ] \nStep 6: SET\
  \ ARR[0] = New_Element \nStep 7: EXIT\n```\n\n### b. 在指定位置插入 – \n在这种情况下，要插入的新元素将插入到用户指定的位置/位置。为了在数组中插入新元素，数组中之前存储的元素必须从其当前位置向前移动一位，直到到达指定位置的元素。例如，如果声明一个数组可以容纳\
  \ 10 个元素，且它只包含 8 个元素，并且规定新元素要插入数组的第五个位置，那么存储的元素必须向前移动一位，如下所示：\n\n![figure](img/00034.jpeg)\n\
  \n在交换元素并将新元素 10 插入数组中间后，新数组将是：\n\n![figure](img/00035.jpeg)\n\n**实际应用：**\n这就像有一群人在排队，其中一个人从中间加入队伍，现在每个人都必须向后移动一位，以便那个人能够进入队伍；因此，这就是在中间插入。\n\
  \n#### 在指定位置插入的算法\n\n我们假设 `ARR` 是一个包含 `N` 个元素的数组。数组中可以存储的最大元素数量由 `SIZE` 定义。让 `POS`\
  \ 定义新元素插入的位置。我们应该首先检查数组是否有可用空间来存储任何元素，然后进行插入过程。\n\n```\n Step 1: START\nStep 2:\
  \ IF N = SIZE,\n            PRINT OVERFLOW\n            ELSE\n            N = N\
  \ + 1 \nStep 3: SET I = N\nStep 4: Repeat Step 5 while I>=POS \nStep 5: SET ARR[I+1]\
  \ = ARR[I]\n            [ END OF LOOP ] \nStep 6: SET ARR[POS] = New_Element \n\
  Step 7: EXIT\n```\n\n### c. 在末尾插入 – \n在这种情况下，要插入的新元素将插入到数组的末尾。因此，在这种情况下没有需要交换元素。我们只需要检查数组是否有足够的可用空间。例如，如果声明一个数组可以容纳\
  \ 10 个元素，且它只包含 9 个元素，那么就可以进行插入。\n\n![figure](img/00036.jpeg)\n\n现在，最后一个元素将插入到最后一个位置，即\
  \ `arr[9]`，且该位置是空的。因此，插入后的新数组将是：\n\n![figure](img/00037.jpeg)\n\n**实际应用：**\n这就像一个普通的队伍，某人来并从末尾加入队伍；因此，在这个过程中不需要任何移动。\n\
  \n#### 在末尾插入的算法\n\n我们假设 `ARR` 是一个包含 `N` 个元素的数组。数组中可以存储的最大元素数量由 `SIZE` 定义。我们应该首先检查数组是否有可用空间来存储任何元素，然后进行插入过程。\n\
  \n```\n Step 1: START\nStep 2: IF N = SIZE,\n            PRINT OVERFLOW\n      \
  \      ELSE\n            N = N + 1 \nStep 3: SET ARR[N] = New_Element \nStep 4:\
  \ EXIT\n```\n\n编写一个 C 程序来实现一维数组中的插入。\n\n```c\n#include <stdio.h>\n#include <conio.h>\
  \ \n\nvoid main()\n{\n  int arr[10], i, n, pos, value, choice;\n  // 根据文本初始化\n \
  \ arr[0] = 10; arr[1] = 20; arr[2] = 30; arr[3] = 40; arr[4] = 50; arr[5] = 60;\
  \ arr[6] = 70;\n  n = 7; \n\n  printf(\"MENU\\n\");\n  printf(\"1.在开头插入\\n\");\n\
  \  printf(\"2.在指定位置插入\\n\");\n  printf(\"3.在末尾插入\\n\");\n  printf(\"Enter your choice:\
  \ \");\n  scanf(\"%d\", &choice);\n\n  if(n == 10) {\n    printf(\"OVERFLOW\\n\"\
  );\n    exit(0);\n  }\n\n  switch(choice) {\n    case 1:\n      printf(\"Enter new\
  \ element: \");\n      scanf(\"%d\", &value);\n      for(i = n; i >= 0; i--) {\n\
  \        arr[i+1] = arr[i];\n      }\n      arr[0] = value;\n      n++;\n      break;\n\
  \    case 2:\n      printf(\"Enter position: \");\n      scanf(\"%d\", &pos);\n\
  \      printf(\"Enter new element: \");\n      scanf(\"%d\", &value);\n      for(i\
  \ = n; i >= pos; i--) {\n        arr[i+1] = arr[i];\n      }\n      arr[pos] = value;\n\
  \      n++;\n      break;\n    case 3:\n      printf(\"Enter new element: \");\n\
  \      scanf(\"%d\", &value);\n      arr[n] = value;\n      n++;\n      break;\n\
  \    default:\n      printf(\"Wrong Choice\\n\");\n      exit(0);\n  }\n\n  printf(\"\
  Resulting array: \");\n  for(i = 0; i < n; i++) {\n    printf(\"%d \", arr[i]);\n\
  \  }\n  getch();\n}\n```\n\n\n\n\n\n## a. 从开头删除 – 在这种情况下，被删除的元素从数组的开头删除。为了从开头删除一个元素，数组中存储的所有元素必须在数组中向前移动一位。例如，如果声明一个数组容纳\
  \ 10 个元素，而它只包含 7 个元素，并且给定要从数组的开头删除元素，那么所有存储的元素必须像下面所示向前移动一位：\n\n![figure](img/00039.jpeg)\n\
  \n为了从数组中删除第一个元素 `23`，我们必须将所有存储的元素后移，以便第一个元素被删除，如所示。从数组中删除 `23` 后，新数组将是：\n\n![figure](img/00040.jpeg)\n\
  \n### 实际应用：\n\n这就像有一堆书，一个人直接从末尾取走一本书，那么现在所有的书都会相对于它们之前的位置向前移动一位；因此，这就是从开头删除。\n\n\
  ### 从开头删除的算法\n\n假设 `ARR` 是一个包含 `N` 个元素的数组。\n\n```\n Step 1: START \nStep 2: SET\
  \ I = 0\nStep 3: Repeat Step 4 while I<N-1 \nStep 4: SET ARR[I] = ARR[I+1] \n  \
  \          [END OF LOOP]\nStep 5: EXIT\n```\n\n## b. 从指定位置删除 – 在这种情况下，被删除的元素从用户输入的数组指定位置/位置删除。为了从指定位置删除一个元素，数组中存储的元素必须在数组的现有位置上向前移动一位，直到指定位置的元素被删除。例如，如果声明一个数组容纳\
  \ 10 个元素，而它只包含 8 个元素，并且给定要从数组的指定位置（即第四的位置）删除元素，那么存储的元素必须像下面所示向前移动一位：\n\n![figure](img/00041.jpeg)\n\
  \n为了从数组中删除第四个元素 `7`，我们必须将存储的元素后移，以便指定的元素被删除，如所示。从数组中删除 `7` 后，新数组将是：\n\n![figure](img/00042.jpeg)\n\
  \n### 从指定位置删除的算法\n\n假设 `ARR` 是一个包含 `N` 个元素的数组。让 `POS` 定义为删除元素的位置。\n\n```\n Step\
  \ 1: START\nStep 2: SET I = POS\nStep 3: Repeat Step 4 while I<=N-1 \nStep 4: SET\
  \ ARR[I+1] = ARR[I] \n            [ END OF LOOP ]\nStep 5: EXIT\n```\n\n## c. 从末尾删除\
  \ – 在这种情况下，删除非常简单。这里我们只需要打印除最后一个之外的所有元素，因为我们要删除最后一个元素。例如，如果声明一个数组容纳 10 个元素，而它只包含\
  \ 6 个元素，并且给定要从数组末尾删除元素，那么删除操作如下：\n\n![figure](img/00043.jpeg)\n\n从数组中删除 `11` 后，新数组将是：\n\
  \n![figure](img/00044.jpeg)\n\n### 实际应用：\n\n这就像有一堆书，一个人直接从书堆中拿走第一本书；因此，我们可以说从堆中删除或移除了一本书，因此这就是从末尾删除。\n\
  \n### 从末尾删除的算法\n\n假设 `ARR` 是一个包含 `N` 个元素的数组。\n\n```\n Step 1: START\nStep 2: SET\
  \ N = N-1\nStep 3: Repeat Step 4 for I=0 to N\nStep 4: Print ARR[I]\n          \
  \  [ END OF LOOP ]\nStep 5: EXIT\n```\n\n编写一个菜单驱动的程序来实现一维数组中的删除，并讨论所有三种情况。\n\n```\n\
  \ #include<stdio.h> \n  #include<conio.h> \n  void main()\n  {\n   int i, n, pos,\
