  \ 94\n\n输入元素 5 10\n\n选择排序\n\n排序后的新数组为\n\n1012367894\n\n### 常见问题解答\n\n**Q. 定义选择排序技术。**\n\
  \n**答。**\n\n选择排序是一种排序技术，它通过从数组中找到最小元素并将其放在第一个位置来工作。然后它找到第二个最小元素并将其放在第二个位置。因此，重复此过程直到整个数组完成排序为止。\n\
  \n### 2. 插入排序\n\n插入排序是另一种非常简单的排序算法，其工作原理正如其名称所示，即将每个元素插入到最终列表的正确位置。为了限制内存浪费，或者说节省内存，大多数插入排序的实现都是通过移动当前元素越过已排序的元素，并反复与前一个元素交换或交替，直到它被放置在正确的位置。\n\
  \n**实际应用：**\n\n我们在玩名为“桥牌”的游戏时，通常在整理牌中使用这种技术。\n\n### 插入排序技术\n\n**第 1 轮** – 初始列表中只有一个元素，该元素已经是排序状态的。因此，我们继续后续步骤。\n\
  \n**第 2 轮** – 在第一次迭代中，比较列表的第一个和第二个元素。较小的值占据列表的位置。\n\n**第 3 轮** – 在第二次迭代中，比较列表的前三个元素。较小的值将占据列表的第一位置。第二个位置将由第二个元素占据，依此类推。此过程对数组的所有元素重复，直到完成\
  \ `(n-1)` 次迭代。\n\n### 插入排序算法\n\n`INSERTION SORT(ARR, N)`\n\n```\n Step 1: 开始\nStep\
  \ 2: 对于 I = 1 到 N – 1 重复步骤 3 & 4\nStep 3: 设置 SMALLEST = ARR[I]\nStep 4: 设置 POS =\
  \ I\nStep 5: 对于 J = I + 1 到 N – 1 重复步骤 6\nStep 6: IF (ARR[J] < SMALLEST)\n     \
  \       设置 SMALLEST = ARR[J]\n            设置 POS = J\n            [IF 结束]\n    \
  \        [循环结束]\nStep 7: 返回 POS\n```\n\n```\n Step 1: 开始\nStep 2: 对于 I = 1 到 N –\
