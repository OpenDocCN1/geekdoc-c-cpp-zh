  \ F | 弹出 (T AND F = F) |\n| T | T, F, T | 入栈 |\n| F | T, F, T, F | 入栈 |\n| XOR |\
  \ T, T | 弹出 (F XOR T = T) |\n| OR | T, T | 弹出 (T OR F = T) |\n| AND | F | 弹出 (F\
