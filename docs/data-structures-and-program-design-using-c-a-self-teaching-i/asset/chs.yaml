  - B 树\n- B 树的操作\n- B 树的应用\n- B+ 树\n- 总结\n- 习题\n\n### 9.1 引言\n我们学习了二叉搜索树，其中讨论了二叉搜索树的每个节点包含三个部分，即一个信息部分和两个分别指向左右子树的指针\
  \ `LEFT` 和 `RIGHT`。相同的概念也适用于多叉搜索树。`M`-叉搜索树是每个节点包含 `(M – 1)` 个值的树。它也有 `M` 个子树。在多叉搜索树中，`M`称为度。例如，如果多叉搜索树的\
  \ `M = 3`，那么该树每个节点包含两个值，并且有三个子树。当多叉搜索树非空时，它具有以下属性：\n\n1. 多叉搜索树中的每个节点具有以下结构：\n![figure](img/00264.jpeg)\n\
  其中 `P[0]`、`P[1]`、`P[2]`、..., `P[n]` 是指向子树的指针，`K[0]`、`K[1]`、`K[2]`、..., `K[n]` 是存储在节点中的键值。\n\
  2. 节点中的键值按升序排列的，即 `K[i] < K[i+1]`，其中 `i = 0, 1, 2, ... n-2`。\n3. 左子树中存储的所有键值始终小于根节点。\n\
  \n\n\n\n4. 右子树中存储的所有键值始终大于根节点。\n\n5. 对于 `i = 0, 1, 2, . . . n`，`P[i]` 指向的子树也是 M\
  \ 路搜索树。\n\n![figure](img/00265.jpeg)\n\n**图 9.1.** 阶为 4 的 M 路搜索树。\n\n### 9.2 B 树\n\
  \nB 树是一种特殊的多路树，广泛用于磁盘访问。B 树由 Rudolf Bayer 和 Ed McCreight 在 1970 年开发。在 B 树中，每个节点可能包含大量的数量键（keys）。B\
  \ 树的设计初衷是为了在单个节点中存储大量键，以保持树的高度处于较小水平。阶为 `m` 的 B 树具有多路搜索树的所有属性。此外，它还具有以下属性：\n\n1.\
  \ 所有叶子节点都位于底部或处于同一层。\n\n2. B 树中的每个节点最多有 `m` 个孩子。\n3. 如果根节点不是叶子节点，则它至少有两个孩子；如果是叶子节点，它显然可以没有孩子。\n\
  4. 除了根节点和叶子节点外，B 树中的每个节点至少有 `(m/2)` 个孩子。\n5. 每个叶子节点必须包含至少 `ceil [(m/2) – 1]` 个键。\n\
  \n**例如 –** 阶为 5 的 B 树至少有 `ceil [5/2] = 3` 个孩子和 `ceil [(5/2) – 1] = 2` 个键。显然，一个节点可以拥有的最大数为\
  \ 5。每个叶子节点必须包含至少 2 个键。\n\n![figure](img/00266.jpeg)\n\n**图 9.2.** 阶为 4 的 B 树。\n\n\
  **实际应用：**\n\n在数据库程序中，数据大到无法放入内存；因此，它们被存储在辅助存储器中，即磁带或磁盘。\n\n### 9.3 B 树的操作\n\nB 树存储排序后的数据，我们可以对其执行各种操作，包括：\n\
  \n* 在 B 树中插入新元素\n* 从 B 树中删除元素\n\n因此，让我们详细讨论这两种操作。\n\n#### 9.3.1 B 树的插入\n\n首先，B 树的插入是在叶子节点层完成的。在\
  \ B 树中插入元素的步骤如下：\n\n**步骤 1 –** 在步骤 1 中，我们将搜索 B 树以找到要插入新值或新键的叶子节点。\n\n**步骤 2 –**\
  \ 现在，如果叶子节点已满（即它已经包含了 `(m – 1)` 个键），则按照以下步骤操作：\n\ni. 按顺序将新键插入现有的键集中。\nii. 现在，节点被分成两半。\n\
  iii. 最后，将中间（中位数）元素向上推到父节点。同样，如果父节点满了，则按照以下步骤拆分父节点。\n\n**步骤 3 –** 如果叶子节点未满（即它包含 `(m\
  \ – 1)` 个键），则将新键插入节点中，保持节点内元素的顺序。\n\n**常见问题解答**\n\n**Q. 构建一个阶为 5 的 B 树并向插入以下值：**\n\
  \n**待插入的值 – B, N, G, A, H, E, J, Q, M, D, V, L, T, Z**\n\n**答案。**\n\n1. 因为阶 = 5，因此我们可以在单个节点中存储至少\
  \ 3 个值，最多 4 个值。因此，我们按排序顺序将 B, N, G, A 插入 B 树中。\n\n![figure](img/00267.jpeg)\n\n\
  **图 9.3 (a)**\n\n2. 现在要将 H 插入到 G 和 N 之间，所以顺序将是 A B G H N，这是可能的，因为单个节点最多只能容纳 4 个值。因此现在我们将拆分节点，中间元素\
  \ G 将成为根节点。\n\n![figure](img/00268.jpeg)\n\n**图 9.3 (b)**\n\n3. 现在我们将 E, J 和 Q 插入到\
  \ B 树中。\n\n![figure](img/00269.jpeg)\n\n**图 9.3 (c)**\n\n4. M 要插入到右子树中。但节点最多只能存储\
  \ 4 个值，因此现在我们将中间元素（即 M）推入根节点。因此，该节点被分成两半。\n\n![figure](img/00270.jpeg)\n\n**图 9.3\
  \ (d)**\n\n5. 现在我们将 D, V, L, T 插入树中。\n\n![figure](img/00271.jpeg)\n\n**图 9.3 (e)**\n\
  \n6. 最后，要插入 Z。它将被插入到右子树中。因此，最后一个节点将拆分成两半，中间元素（即 T）将向上推到根节点。\n\n![figure](img/00272.jpeg)\n\
  \n**图 9.3 (e)**\n\n### 9.3.2 B 树的删除\n\n现在我们想从 B 树中删除元素。B 树的删除需要对 B 树进行各种操作，包括：\n\
  \n* 从叶子节点中删除元素\n* 从内部节点中删除元素\n\n因此，让我们详细讨论这两种操作。\n\n**a. 叶子节点**\n\nB 树的删除需要对 B 树进行遍历，如下：\n\
  \n如果是叶子节点，则遵循以下步骤：\n\n1. 从叶子节点中删除。\n2. 从兄弟节点借用。\n3. 如果兄弟节点也不够，则与兄弟合并。\n\n**b. 内部节点**\n\
  \n如果是内部节点，则遵循以下步骤：\n\n1. 从内部节点中删除。\n2. 用前驱或后继替换。\n3. 从孩子节点借用。\n4. 如果孩子节点也不够，则与孩子合并。\n\
