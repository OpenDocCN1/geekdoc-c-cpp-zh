  \ 47 63 78\n\n## 5. 快速排序\n\n快速排序，也称为分区交换排序，由 C. A. R. Hoare 开发，是一种广泛使用的排序算法，它也使用了我们在合并排序中讨论过的分治法。在这里，我们同样将一个未排序的数组划分为两个较小的子数组。分治法意味着将大问题分为两个较小的问题，然后将这两个小问题进一步分成更小的问题，以此此类推。与合并排序一样，如果数组中没有元素或数组只有一个一个元素，则它已经是排序的。快速排序算法比其他其他算法都快，其时间复杂度为\
  \ `O(n log[10]n)`。\n\n### 快速排序的工作原理\n\n1. 从数组元素中选择一个称为 `pivot`（基准）的元素。\n\n2. 选择\
  \ `pivot` 元素后，重新排列数组的所有元素，使得所有小于 `pivot` 的元素位于左侧，所有大于 `pivot` 的元素位于 `pivot` 元素的右侧。重新排列所有元素后，`pivot`\
  \ 现在被放置在最终位置。因此，这个过程被称为分区（partitioning）。\n\n3. 现在递归递归排序得到的两个子数组。\n\n### 快速排序技术\n\
  \n1. 最初将第一个元素的索引设置为 `LEFT` 和 `POS`。同样，将最后一个元素的索引设置为 `RIGHT`。现在，`LEFT = 0`，`POS =\
  \ 0`，`RIGHT = N – 1`（假设数组中有 `n` 个元素）。\n\n2. 我们从 `RIGHT` 指向的最后一个元素开始，从右到左遍历数组中的每个元素，将每个元素与\
  \ `POS` 指向的元素进行比较。`ARR[POS]` 应该始终小于 `ARR[RIGHT]`。\n\n如果 `ARR[POS]` 小于 `ARR[RIGHT]`，则继续比较直到\
  \ `RIGHT = POS`。如果 `RIGHT = POS`，则意味着 `pivot` 已放置在正确的位置上。\n\n如果 `ARR[RIGHT] < ARR[POS]`，则交换这两个值并进入下一步。\n\
  \n设置 `POS = RIGHT`。\n\n3. 我们从 `LEFT` 指向的第一个元素开始，从左到右遍历数组中的每个元素，将每个元素与 `POS` 指向的元素进行比较。`ARR[POS]`\
  \ 应该始终大于 `ARR[LEFT]`。\n\n如果 `ARR[POS]` 大于 `ARR[RIGHT]`，则继续比较直到 `LEFT = POS`。如果 `LEFT\
  \ = POS`，则意味着 `pivot` 已放置在正确的位置上。\n\n如果 `ARR[LEFT] > ARR[POS]`，则交换这两个值并回到上一步。\n\n\
  设置 `POS = LEFT`。\n\n### 快速排序算法\n\n`QUICK SORT(ARR, BEG, END)`\n\n```\n Step 1: START\n\
  Step 2: IF (BEG < END)\nStep 3: PARTITION(ARR, BEG, END)\nStep 4: QUICK SORT(ARR,\
  \ BEG, POS - 1)\nStep 5: QUICK SORT(POS + 1, END)\nStep 6: END\n```\n\n\n\n\n\n\
  ```c\n # include <stdio.h>\n# include <conio.h>\n# define size 100\nint part(intarr[],\
  \ int beg , int end) ;\nvoid quick_sort( intarr[ ] , int beg , int end) ;\nvoid\
  \ main()\n{\n  intarr[size], i, n ;\n  printf(“\\n enter the number of elements:\
  \ ”) ;\n  scanf (“%d”, &n) ;\n  printf (“\\ n enter the elements of array :”) ;\n\
  \  for(i=0 ; i<n ; i++)\n   {\n     printf(“\\n enter element %d”, i+1) ;\n    \
  \ scanf(“%d” , &arr[i]) ;\n   }\n  quick_sort(arr , 0 , n-1) ;\n  printf(“\\nThe\
  \ sorted array is :\\n”) ;\n  for (i=0 ; i<n ; i++)\n   {\n     printf(“ %d \\t\
  \ ”, arr[i]) ;\n   }\n  getch() ;\n}\n\nint part (int arr[], int beg, int end)\n\
  {\n  int left , right , temp , pos , flag ;\n  pos = left = beg ;\n  right = end\
  \ ;\n  flag = 0 ;\n  while( flag ! = 1)\n   {\n     while ( ( a[pos] < = arr[right\
  \ ] && (loc != right ))\n     right-- ;\n     if(pos == right)\n     flag = 1 ;\n\
  \     else if (arr[pos] >arr[right])\n      {\n        temp = arr[pos] ;\n     \
  \   arr[pos] = arr[right] ;\n        arr[right] = temp ;\n        pos = right ;\n\
  \      }\n    if ( flag != 1)\n      {\n        while (( arr[pos] >= arr[left] &&\
  \ (pos != left))\n        left ++ ;\n        if( pos == left )\n        flag = 1\
  \ ;\n        else if (arr[pos] <arr[left])\n         {    \n           temp = arr[pos]\
  \ ;\n           arr[pos]= arr[left] ;\n           arr[left]= temp ;\n          \
  \ pos = left ;\n         }\n      }\n   }\n  return pos ;\n}\nvoid quick sort (int\
  \ arr[], int beg, int end)\n{\n  int pos ;\n  if(beg < end)\n   {\n     pos = part(arr,\
