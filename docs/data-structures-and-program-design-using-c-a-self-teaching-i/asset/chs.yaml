  \n`h'(35) = (0 + 2 + 12) % 5`\n\n`h'(35) = 14 % 5 = 4`\n\n现在，由于位置 `T[4]` 是空闲的，`14`\
  \ 插入到位置 `T[4]`。\n\n因此，哈希表所示：\n\n![figure](img/0311.jpeg)\n\n编写一个程序展示二次探测冲突解决方法。\n\
  \n\n\n\n\n正如之前讨论过的，二次线性探测法最大的优点之一是它消除了初级聚集现象。相反，该方法的主要缺点之一是，连续的探测序列可能只覆盖哈希表的一部分，而这部分可能很小。因此，如果发生这种情况，尽管哈希表未满，我们也很难在哈希表中找到一个空位置。因此，二次线性探测遇到了一个被称为次级聚集的问题。在这种方法中，随着哈希表的变满，多次冲突的概率会增加。这种情况可以通过双散列来克服。\n\
  \n## 双散列\n\n双散列是开放地址法中最好的方法之一。顾如其名，该方法使用两个哈函数进行操作，而不是单个哈函数。哈函数公式如下：\n\n`h’(k) =\
  \ (h1 + ih2) mod m`,\n\n其中 `h1 = k mod m` 和 `h2 = k mod m'` 是两个哈函数，`m` 是哈希表的大小，`m'`\
  \ 小于 `m`（可以是 `(m – 1)` 或 `(m – 2)`），而 `i` 是从 `0` 到 `(m – 1)` 变化的探测次数。\n\n现在，让我们理解这项技术的工作。对于给定的键\
  \ `k`，首先探测由 `(h1 mod m)` 生成的位置，因为第一次 `i = 0`。如果生成的位置是空闲，则将键存储在其中。否则，后续的探测产生的位置相对于较上一个位置具有\
  \ `(h2 mod m)` 的偏移量。此外，偏移量可能会随着每次探测而变化，取决于第二个哈函数生成的值，即 `(h2 mod m)`。结果是，双散列的性能非常接近均匀散列的“理想”方案的性能。\n\
  \n## 常见问题\n\n**Q. 给定键 `k = 71, 29, 38, 61, 和 100`，使用双散列将这些键映射到大小为 `m = 5` 的哈希表中。取\
  \ `h[1] = (k mod 5)` 和 `h[2] = (k mod 4)`。**\n\n**答案。**\n\n最初，哈希表如下：\n\n![figure](img/00312.jpeg)\n\
  \n**步骤 1：**\n\n`i = 0`\n\n待插入的键 = `71`\n\n`h’(k) = (h1 + ih2) mod m`\n`h’(k) = (k\
  \ mod m + (i k mod m’)) mod m`\n`h’(71) = (71 % 5 + (0 X 71 % 4)) % 5`\n`h’(71)\
  \ = (1 + (0 X 3)) % 5`\n`h’(71) = 1 % 5 = 1`\n\n现在，由于位置 `T[1]` 是空闲的，`71` 被插入到位置\
  \ `T[1]`。\n\n![figure](img/00313.jpeg)\n\n**步骤 2：**\n\n`i = 0`\n\n待插入的键 = `29`\n\
  \n`h’(k) = (k mod m + (i k mod m’)) mod m`\n`h’(29) = (29 % 5 + (0 X 29 % 4)) %\
  \ 5`\n`h’(29) = (4 + (0 X 1)) % 5`\n`h’(29) = 4 % 5 = 4`\n\n现在，由于位置 `T[4]` 是空闲的，`29`\
  \ 被插入到位置 `T[4]`。\n\n![figure](img/00314.jpeg)\n\n**步骤 3：**\n\n`i = 0`\n\n待插入的键 =\
  \ `38`\n\n`h’(k) = (k mod m + (i k mod m’)) mod m`\n`h’(38) = (38 % 5 + (0 X 38\
  \ % 4)) % 5`\n`h’(38) = (3 + (0 X 2)) % 5`\n`h’(38) = 3 % 5 = 3`\n\n现在，由于位置 `T[3]`\
  \ 是空闲的，`38` 被插入到位置 `T[3]`。\n\n![figure](img/00315.jpeg)\n\n**步骤 4：**\n\n`i = 0`\n\
  \n待插入的键 = `61`\n\n`h’(k) = (k mod m + (i k mod m’)) mod m`\n`h’(61) = (61 % 5 +\
  \ (0 X 61 % 4)) % 5`\n`h’(61) = (1 + (0 X 1)) % 5`\n`h’(61) = 1 % 5 = 1`\n\n现在，由于位置\
  \ `T[1]` 不是空闲的，计算下一个探测序列，即 `i = 1`：\n\n`i = 1`\n\n`h’(61) = (61 % 5 + (1 X 61 %\
  \ 4)) % 5`\n`h’(61) = (1 + (1 X 1)) % 5`\n`h’(61) = (1 + 1) % 5`\n`h’(61) = 2% 5\
  \ = 2`\n\n现在，由于位置 `T[2]` 是空闲的，`61` 被插入到位置 `T[2]`。\n\n![figure](img/00316.jpeg)\n\
  \n**步骤 5：**\n\n`i = 0`\n\n待插入的键 = `100`\n\n`h’(k) = (k mod m + (i k mod m’)) mod\
  \ m`\n`h’(100) = (100 % 5 + (0 X 100 % 4)) % 5`\n`h’(100) = (0 + (0 X 0)) % 5`\n\
  `h’(100) = 0 % 5 = 0`\n\n现在，由于位置 `T[0]` 是空闲的，`100` 被插入到位置 `T[0]`。\n\n因此，最终的哈希表所示：\n\
  \n![figure](img/00317.jpeg)\n\n## 双散列的优缺点\n\n双散列方法没有所有的初级聚集和次级聚集的问题。它还减少了重复冲突。\n\
  \n## 10.2 总结\n\n- 哈希表是一个数组，通过一个特殊的索引称为 `key` 来访问数据。在哈希表中，键通过哈希函数映射到数组位置。\n- 哈希函数是一个数学公式，当应用于键时会产生一个索引。\n\
