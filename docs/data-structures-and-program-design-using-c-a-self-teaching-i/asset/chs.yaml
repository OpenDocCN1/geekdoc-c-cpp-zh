  \ 位与 |\n| | | 位或 |\n| ^ | 位异异 |\n\n### 逗号运算符\n\n逗号运算符用于连接某些表达式。首先，它求值第一个表达式并丢弃其值。然后它求值第二个表达式，并将该表达式的计算结果作为最终输出返回。由逗号运算符分隔的表达式按照从左到右的顺序求值。它是\
