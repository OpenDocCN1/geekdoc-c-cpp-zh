  \  exit(0);\n        break;\n      default:\n        printf(\"选择错误\");\n       \
  \ break;\n    }\n  }\n  while(ch != 0);\n  getch();\n}\n\nvoid add_at_beg()\n{\n\
  \  struct node *ptr = (struct node*) malloc(sizeof(struct node));\n  printf(\" 输入新节点\"\
  );\n  scanf(\"%d\", &ptr->data);\n  if(start == NULL)\n  {\n    printf(\" 列表为空，正在创建新的\"\
