  \n• 波兰表示法与逆波兰表示法及其需求\n• 中缀表达式到后缀表达式的转换\n• 中缀表达式到前缀表达式的转换\n• 后缀表达式的求值\n• 前缀表达式的求值\n\
  • 括号平衡\n\n现在，让我们详细了解每一个项目。\n\n#### 7.6.1 波兰表示法与逆波兰表示法及其需求\n\n##### a. 波兰表示法\n\n\
  波兰表示法是指运算符放在操作数之前的符号。波兰表示法以波兰数学家扬·卢卡西维奇（Jan Lukasiewicz）的名字命名。我们也可以说表达式转换为某种的形式称为波兰表示法。代数表达式可以用三种形式表示。所有这些形式取决于运算符相对于操作数的相对位置。\n\
  \n1. **前缀形式** – 在表达式中，如果运算符放在操作数之前，例如 `+XY`，则它被称为前缀形式。\n2. **中缀形式** – 在表达式中，如果运算符放在两个操作数之间，例如\
  \ `X + Y`，则被称为中缀形式。\n3. **后缀形式** – 在表达式中，如果运算符放在操作数之后，例如 `XY+`，则被称为后缀形式。\n\n#####\
  \ b. 逆波兰表示法\n\n这种表示法通常指后缀表示法或后缀符号。它指的是运算符放在其两个操作数之后的符号，例如 `XY + AF BC![figure](img/00011.jpeg)。\n\
  \n##### c. 波兰表示法与逆波兰表示法的需求\n\n计算机系统评估波兰表示法中的表达式要相对容易，因为系统不需要检查各种运算符的执行优先级（例如 `BODMAS`\
