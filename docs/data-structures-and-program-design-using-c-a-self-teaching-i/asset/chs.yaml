  \n## 2. 在循环链表的末尾插入新节点\n\n在这种情况下，我们首先检查溢出条件，即内存是否有可用空间用于新节点。如果内存不可用，则打印溢出信息；否则，为新节点分配内存。然后创建一个\
  \ `PTR` 变量，它初始指向 `START`，并将使用 `PTR` 变量遍历链表，直到到达最后一个节点。当到达最后一个节点时，最后一个节点的 `NEXT`\
  \ 部分将存储新节点的地址，而 `NEW NODE` 的 `NEXT` 部分将包含链表第一个节点的地址，即由 `START` 表示的节点。让我们通过算法来理解它：\n\
  \n### 在循环链表末尾插入新节点的算法\n\n```\nStep 1: START\nStep 2: IF TEMP = NULL\n          \
  \  Print OVERFLOW\n            [End Of If]  \nStep 3: Set NEW NODE = TEMP\nStep\
  \ 4: Set NEW NODE -> INFO = VAL\nStep 5: Set NEW NODE -> NEXT = START\nStep 6: Set\
  \ PTR = START\nStep 7: Repeat while PTR -> NEXT != START\n            Set PTR =\
  \ PTR -> NEXT\n            [End of Loop]\nStep 8: Set PTR -> NEXT = NEW NODE\nStep\
  \ 9: EXIT\n```\n\n让我们通过一个例子来理解。考虑如下所示所示的具有四个节点的链表；现在要在该循环链表的末尾插入一个新节点。\n\n![figure](img/00076.jpeg)\n\
  \n***图 4.12*** 在循环链表末尾插入新节点。\n\n## b) 从循环链表中删除节点\n\n在这一节中，我们将学习如何从已存在的循环链表中删除节点。我们讨论讨论删除过程中的三类情况，包括：\n\
  \n1. 从循环链表的头部删除节点。\n2. 从循环链表的末尾删除节点。\n3. 在给定节点之后删除节点（与单链表的操作相同）。\n\n### 1. 从循环链表的头部删除节点\n\
  \n在从链表头部删除节点的情况下，我们首先检查链表是否为空（即 `START` 指针是否为 `NULL`）。如果为空，则显示溢出信息；否则，从链表头部删除节点。考虑如下所示具有四个节点的链表；我们要从链表头部删除节点。\n\
  \n![figure](img/00077.jpeg)\n\n从前面的例子中，如如图所示，可以清楚地看到如何从已存在的循环链表中删除节点。让我们现在理解其算法：\n\
  \n### 从循环链表头部删除节点的算法\n\n```\nStep 1: START\nStep 2: IF START = NULL\n          \
  \  Print OVERFLOW\n            [End Of If]  \nStep 3: Set PTR = START\nStep 4: Repeat\
  \ while PTR -> NEXT != START\n            Set PTR = PTR -> NEXT\n            [End\
  \ of Loop]\nStep 5: Set PTR -> NEXT = START\nStep 6: FREE START\nStep 7: Set START\
  \ = START -> NEXT\nStep 8: EXIT\n```\n\n上述算法展示了如何从链表头部删除节点。首先我们检查溢出条件。使用 `PTR` 变量遍历整个链表直到到达最后一个节点。现在我们修改\
  \ `PTR` 的 `NEXT` 部分以指向第二个节点。因此，释放头部节点占用的内存。最后，第二个节点成为链表的头部节点。\n\n### 2. 从循环链表的末尾删除节点\n\
  \n在这种情况下，我们首先检查溢出条件，即尝试从链表删除节点时链表是否为空。这种情况发生在 `START` 指针等于 `NULL`。因此，如果条件成立，则打印溢出信息；否则，从链表末尾删除节点。考虑如下所示具有四个节点的链表；我们要从该循环链表的末尾删除节点。\n\
  \n![figure](img/00078.jpeg)\n\n***图 4.14*** 从循环链表末尾删除节点。\n\n让我们现在理解其算法：\n\n### 从循环链表末尾删除节点的算法\n\
  \n```\nStep 1: START\nStep 2: IF START = NULL\n            Print OVERFLOW\n    \
  \        [End Of If]  \nStep 3: Set PTR = START\nStep 4: Repeat while PTR -> NEXT\
  \ != START\n            Set PREV = PTR\n            Set PTR = PTR -> NEXT\n    \
  \        [End of Loop]\nStep 5: Set PREV -> NEXT = START \nStep 6: FREE PTR\nStep\
  \ 7: EXIT\n```\n\n上述算法展示了如何从链表末尾删除节点。首先我们检查溢出条件。使用 `PTR` 变量遍历整个链表直到到达最后一个节点。在循环中，我们将使用另一个指针变量\
  \ `PREV`，它始终指向 `PTR` 的前驱节点。当我们到达最后一个节点及其前驱节点（即倒数第二个节点）时，我们现在修改 `PREV` 的 `NEXT` 部分以存储\
  \ `START` 的地址。因此，释放最后一个节点占用的内存。最后，倒数第二个节点成为链表的最后一个节点。通过这种方式，完成了循环链表末尾的删除操作。\n\n\
