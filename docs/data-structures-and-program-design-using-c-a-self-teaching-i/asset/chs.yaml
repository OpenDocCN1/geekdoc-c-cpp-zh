  \      }\n     else\n      {\n        temp[k] = arr[j] ;\n        k++ ;\n      \
  \  j++ ;\n        temp[k] = arr[i] ;\n        k++ ;\n        i++ ;\n      }\n  \
  \ }\n  while(i < j1)\n   {\n     temp[k] = arr[i] ;\n     k++ ;\n     i++ ;\n  \
  \ }\n  while(j < j2)\n   {\n     temp[k] = arr[j] ;\n     k++ ;\n     j++ ;\n  \
  \ }\n  for(i = i1 ; i <= j2 ;\n   {\n     arr[i] = temp[j] ;\n   }\n }\nint main()\n\
  {\n  int i, n, arr[10] ;\n  clrscr() ;\n  printf(“enter no of elements: ” ;\n  scanf(“%d”,\
