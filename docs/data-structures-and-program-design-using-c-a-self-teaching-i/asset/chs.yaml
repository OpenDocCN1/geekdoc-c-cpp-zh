  \n## 常见问题\n\n**Q.请解释哈希（Hashing）这个术语。**\n\n**答。**\n\n哈希是将键映射到其在哈希表中适当位置的过程。它是在数组或哈希表中查找值最有效的技术。\n\
  \n### 10.1.1 哈希与直接寻址的区别\n\n在直接寻址法中，我们将键存储在与键值相同的地址上，如图图 10.3\n\n*图 10.3*。使用直接寻址方法的键的映射。\n\
  \n### 10.1.2 哈希表\n\n哈希表是一种支持高效搜索技术之一（即哈希）的数据结构。哈希表是一个数组，通过称为“键”（key）的特殊索引来访问数据。在哈希表中，键通过哈希函数映射到数组位置。哈希函数是一个函数，或者说它是一个数学公式，当它应用于键时，会产生一个整数，该整数被用作索引在哈希表中查找键。因此，在哈希函数的帮助下，可以在`O(1)`\
  \ 时间内搜索存储在哈希表中的值。哈希表背后的核心思想是键与数组索引之间建立直接映射。\n\n![figure](img/00292.jpeg)\n\n*图 10.4*。使用哈希法将键映射到哈希表。\n\
  \n### 10.1.3 哈希函数\n\n哈希函数是一个数学公式，当它应用于键时，会产生一个整数，该整数被用作索引在哈希表中查找键。\n\n#### 哈希函数的特征\n\
  \n哈希函数有四个主要特征：\n\n1. 哈希函数使用了所有的输入数据。\n2. 哈希函数必须生成不同的哈希值。\n3. 哈希值完全由被哈希的数据决定。\n4.\
  \ 哈希函数必须将键均匀地分布在整个哈希表中。\n\n#### 不同类型的哈希函数\n\n在本节中，我们将讨论一些常见的哈希函数：\n\n1. **除法法（Division\
  \ Method）–** 在除法法中，通过取 `k` 除以 `m` 的余数，将键 `k` 映射到 `m` 个槽位之一。简单来说，我们可以说这种方法是将一个整数（例如\
  \ `x`）除以 `m`，然后使用得到的余数。这是最简单的哈希方法。哈希函数公式如下：\n\n![figure](img/00293.jpeg)\n\n例如，如果\
  \ `m = 5` 且键 `k = 10`，则 `h(k) = 2`。因此，除法法运行非常快，因为只需要一次除法操作。虽然这种方法对于任何 `m` 值都是很好的，但请考虑，如果\
  \ `m` 是偶数，那么当 `k` 的值为偶数时，`h(k)` 为偶数；同样地，当 `k` 的值为奇数时，`h(k)` 为奇数。因此，如果偶奇键的数量几乎相等，则没有问题。但如果偶键较多，那么除法法就不好，因为它不会在哈希表中均匀地分布键。此外，我们避免某些\
  \ `m` 的值；即 `m` 不应该是 2 的幂，因为如果 `h(k) = k mod 2^x`，那么 `h(k)` 将提取 `k` 的低 `x` 位。除法法的主要缺点是许多连续的键分别映射到连续的哈希值，这意味着连续的数组位置将被占用，从而对性能产生影响。\n\
  \n**常见问题**\n\n**Q.给定一个具有 50 个内存位置的哈希表，使用除法法计算键 20 和 75 的哈希值。**\n\n**答。**\n\n`m =\
  \ 50`，`k1 = 10`，`k2 = 75` 的哈希值计算如下：\n\n`h(10) = 10 % 50 = 10`\n\n`h(75) = 75 % 50\
  \ = 25`\n\n2. **中间平方法（Mid Square Method）–** 在中间平方法中，我们将计算给定键的平方。得到该数字后，我们将从该数字的中间提取一些数字作为地址。\n\
  \n例如，如果键 `k = 5025`，则 `k² = 25250625`。因此，`h(5025) = 50`。\n\n这种方法效果非常好，因为键的所有数字都对输出做出了贡献，即所有数字在产生中间数字时都有贡献。此外，在该方法中，必须从所有键中选择相同的\
  \ `r` 位。\n\n**常见问题**\n\n**Q.给定一个具有 100 个内存位置的哈希表，使用中间平方法计算键 2045 和 1357 的哈希值。**\n\
  \n**答。**\n\n现在，这里有 100 个内存位置，使用中间平方法处理 `2045` 和 `1357`。\n\n3. **折叠法（Folding Method）–**\
  \ 在折叠法中，我们将键拆分为部分，使得每个部分具有相同的位数。现在，将这些部分相加。如果存在进位则将其忽略。因此，形成了哈希值。\n\n例如，如果 `m =\
  \ 100` 且键 `k = 12345678`，则键被拆分。然后计算哈希值。\n\n**常见问题**\n\n**Q.给定一个具有 100 个内存位置的哈希表，使用折叠法计算键\
  \ 2486 和 179 的哈希值。**\n\n**答。**\n\n现在，这里有 100 个内存位置，索引从 0 到 99。因此，键的每个部分必须有 2 位。\n\
  \n`h(2486) = 24 + 86 = 110` -> `h(2486) = 10`\n\n`h(179) = 17 + 9 = 26`\n\n### 10.1.4\
  \ 冲突（Collision）\n\n当哈希函数将不同的键映射到哈希表的同一个位置时，就会发生冲突。假设我们要在某个位置存储一条记录。现在，另一个记录不能存储在同一个位置，因为显然两个记录不能存储在同一个位置。因此，有解决此问题的方法，称为冲突解决技术。\n\
  \n### 10.1.5 冲突解决技术\n\n如所述，冲突解决技术用于克服哈希中的冲突问题。有两种流行的方法用于解决冲突：\n\n1. 链地址法（Chaining\
  \ Method）\n2. 开放寻址法（Open Addressing Method）\n\n现在，我们将详细讨论这些方法。\n\n#### 10.1.5.1\
  \ 链地址法\n\n在链地址法中，维护具有相同哈希地址的元素链。哈希表在这里类似于指针数组。哈希表的每个位置存储一个指向链表的指针，链表包含所有哈希到该位置的键元素。例如，哈希表的位置\
  \ 5 指向哈希到位置 5 的键值。如果没有键值哈希到位置 5，那么在这种情况下位置 5 将包含 NULL。所示如图显示了键值是如何映射到哈希表的，以及它们是如何存储在链表中的。\n\
  \n![figure](img/00294.jpeg)\n\n*图 10.5*。使用链地址法进行哈希的键。\n\n\n\n\n\n# 1. 链法哈散表的插入\n\
  插入元素的过程非常简单。首先，我们通过哈希函数获取哈希值，该值将映射到哈希表。映射后，元素被插入到链表中。在链法哈散表中插入元素的运行时间复杂度为 $O(1)$。\n\
  \n# 2. 链法哈散表中的删除\n从链法哈散表中删除元素的过程与我们在单链表中的操作相同。首先，我们将执行搜索操作，然后按照单链表的情况执行删除操作。从链法哈散表中删除元素的运行时间复杂度为\
  \ $O(m)$，其中 $m$ 是该位置链表中存在的元素数量。\n\n# 3. 链法哈散表中的查找\n在链法哈散表中查找元素也非常简单。首先，我们通过哈希表中的哈希函数获取键的哈希值。然后我们在链表中查找该元素。在链法哈散表中查找元素的运行时间复杂度为\
  \ $O(m)$，其中 $m$ 是该位置链表中存在的元素数量。\n\n## 常见问题\n\n**Q. 将键 4, 9, 20, 35 和 49 插入到具有 10\
  \ 个内存位置的链法哈散表中。使用哈希函数 `h(k) = k mod m`。**\n\n**答案。**\n\n初始哈希表给如下：\n\n| 0 | NULL\
  \ |\n| :--- | :--- |\n| 1 | NULL |\n| 2 | NULL |\n| 3 | NULL |\n| 4 | NULL |\n|\
  \ 5 | NULL |\n| 6 | NULL |\n| 7 | NULL |\n| 8 | NULL |\n| 9 | NULL |\n\n现在，我们将 `4`\
  \ 插入哈希表。\n\n**步骤 1：**\n要插入的键 = `4`\n`h(4) = 4 mod 10`\n`h(4) = 4`\n现在，为位置 `4` 创建链表，并将键元素\
  \ `4` 存储其中。\n\n![figure](img/00295.jpeg)\n\n**步骤 2：**\n要插入的键 = `9`\n`h(9) = 9 mod\
  \ 10`\n`h(9) = 9`\n现在，我们为位置 `9` 创建链表，并将键元素 `9` 存储其中。\n\n![figure](img/00296.jpeg)\n\
  \n**步骤 3：**\n要插入的键 = `20`\n`h(20) = 20 mod 10`\n`h(20) = 2`\n现在，我们为位置 `2` 创建链表，并将键元素\
  \ `20` 存储其中。\n\n![figure](img/00297.jpeg)\n\n**步骤 4：**\n要插入的键 = `35`\n`h(35) = 35\
  \ mod 10`\n`h(35) = 5`\n现在，我们为位置 `5` 创建链表，并将键元素 `35` 存储其中。\n\n![figure](img/00298.jpeg)\n\
  \n**步骤 5：**\n要插入的键 = `49`\n`h(49) = 49 mod 10`\n`h(49) = 9`\n现在，我们将 `49` 插入到位置 `9`\
  \ 链表的末尾。\n\n![figure](img/00299.jpeg)\n\n### 链法的优缺点\n该方法的主要优点是它完全解决了冲突问题。即使要存储在哈希表中的键元素多于哈希表的位置数，它仍然有效。然而显而易见，随着键元素数量的增加，该方法的性能将会降低。\n\
  \n该方法的缺点是存储空间的浪费，因为键元素存储在链表中；此外，每个元素都需要指针来访问，这反过来消耗了更多空间。\n\n#### 10.1.5.2 开放地址法\n\
  在开放地址法中，所有元素都存储在哈希表本身。这种方法不需要提供指针，这是它最大的优势。一旦发生冲突，开放地址法将使用探测序列计算新位置，并将下一个元素或下一个记录存储在该位置上。探测是检查哈希表中内存位置的过程。当我们在开放地址法中执行插入操作时，我们首先连续探测/检查哈希表，直到找到一个可以插入新键的空槽位。开放地址法可以通过以下方式实现：\n\
  - 线性探测\n- 二次探测\n- 双重哈散\n\n现在，让我们详细讨论所有它们。\n\n### 线性探测\n线性探测是解决哈散冲突问题最简单的方法。在该方法中，如果一个键已经存储在哈希函数\
  \ `h(k)` 生成的位置上，则可以通过以下哈函数解决该情况：\n\n![figure](img/00300.jpeg)\n\n现在，让我们理解这项技术的工作原理。对于给定的键\
  \ `k`，首先探测 `(h(k) + 0) mod m` 生成的位置，因为第一次 `i = 0`。如果生成的位置是空闲的，则存储其中。如果不是，则生成的位置是\
  \ `(h(k) + 1) mod m`。如果该位置是空闲，则存储其中。如果不是，则为 `(h(k) + 2) mod m`，以此类推。\n\n**Q. 将键\
  \ 13, 25, 14 和 35 插入大小为 m=5 的哈希表，使用线性探测。**\n\n**答案。**\n\n初始哈希表给如下：\n\n![figure](img/00301.jpeg)\n\
  \n**步骤 1：**\n要插入的键 = `13`\n`h(13) = 13 mod 5`\n`h(13) = 3`\n现在，由于位置 `T[3]` 是空闲的，将\
  \ `13` 存储其中。\n\n![figure](img/00302.jpeg)\n\n**步骤 2：**\n要插入的键 = `25`\n`h(25) = 25\
  \ mod 5`\n`h(25) = 0`\n现在，由于位置 `T[0]` 是空闲的，将 `25` 存储其中。\n\n![figure](img/00303.jpeg)\n\
  \n**步骤 3：**\n要插入的键 = `14`\n`h(14) = 14 mod 5`\n`h(14) = 4`\n现在，由于位置 `T[4]` 是空闲的，将\
  \ `14` 存储其中。\n\n![figure](img/00304.jpeg)\n\n**步骤 4：**\n要插入的键 = `35`\n`h(35) = 35\
  \ mod 5`\n`h(35) = 0`\n现在，由于位置 `T[0]` 不是空闲的，计算下一个探测序列，即 `i = 1`：\n`i = 1`\n`h'(35)\
  \ = (0 + 1) mod 5 = 1`\n现在，由于位置 `T[1]` 是空闲的，将 `35` 存储其中。\n\n因此，最终的哈希表所示：\n\n![figure](img/00305.jpeg)\n\
  \n编写一个程序显示冲突解决方法的线性探测技术。\n\n\n\n\n\n```c\n # include<stdio.h>\n# include<conio.h>\n\
  \ # define SIZE 50\n\nintarr[SIZE];\nvoid linear( int,int[]);\nvoid lprob(int k,\
  \ intarr[SIZE]);\nvoid disp(intarr[SIZE);\nvoid main( )\n{\n  int i, k , choice\
  \ ;\n  clrscr();\n  for (i=0; i<SIZE; i++)\n   {\n     arr[i]= ‘\\0’;\n     do\n\
  \       {\n         printf(“\\n\\t MENU”);\n         printf(“\\n 1\\. Insert Keys”);\n\
  \         printf(“\\n 2\\. Search Keys”);\n         printf(“\\n 3\\. Display Keys”);\n\
  \         printf(“\\n 4\\. Exit ”);\n         printf(“\\n Select Operation ”);\n\
  \         scanf(“%d” ,&choice);\n         switch(choice)\n          {\n        \
  \    Case1: do\n              {\n                printf(“\\n Enter values of key\
  \ ”);\n                scanf( “%d”, &k);\n                if(k!=-1)\n          \
  \       {\n                   linear(k,arr);\n                 }\n             \
  \   while(k!=1);\n                disp(arr);\n                break;\n\n       \
  \         case2:\n                printf(“ \\n enter key value to search ”);\n \
  \               scanf(“%d”,&k);\n                lprob(k, arr);\n              \
  \  break;\n\n                case3:\n                disp(arr);\n              \
  \  break;\n              }\n          }\n        while(choice!=4);\n       }\n \
  \  }\n}\n\nvoid linear(int k, intarr[SIZE])\n{\n  int position ;\n  position = k%SIZE;\n\
  \  while(arr[position]!= ‘\\0’)\n   {\n    position = ++ position %SIZE;\n    arr[position]\
  \ = k;\n   }\n}\n\nvoid lprob(int k, intarr[SIZE])\n{\n  int position ;\n  position\
  \ = k%SIZE;\n  while ((arr[position] != k)&& (arr[position] != ‘\\0’))\n  position\
  \ = ++ position %SIZE;\n  if(arr[position]!= ‘\\0’)\n  printf(“\\n successfully\
  \ searched at %d”, position);\n  else\n  printf(“\\n unsuccessfull search”);\n}\n\
  \nvoid disp(intarr[SIZE])\n{\n  int i ;\n  printf(“\\n List of keys :\\n”);\n  for(i=0;\
  \ i<SIZE; i++)\n  printf(“%d” , arr[i]);\n}\n```\n\n### 线性探测法的优缺点\n\n线性探测是一种非常好的技术，因为该算法通过良好的地址局部性提供了良好的内存缓存。但这种方法的主要缺点是会导致聚类（clustering）。由于聚类的现象，发生冲突的风险更高。此外，搜索所需的时间也会随着簇的大小而增加。现在，我们可以说，冲突次数越高，找到空闲位置所需的探测次数就越多，性能就会降低。这被称为初级聚类（primary\
  \ clustering）。我们可以通过使用二次探测和双哈希（double hashing）等其他技术来避免这种聚类。\n\n### 二次探测法\n\n二次探测是解决哈希冲突问题的另一种方法。在这种方法中，如果一个键已经存储在哈希函数\
  \ `h(k)` 生成的位置，则可以通过以下哈希函数解决该问题：\n\n![figure](img/00306.jpeg)\n\n二次探测法优于线性探测，因为它通过搜索速度终止了初级聚类现象；也就是说，它正在进行二次搜索。对于给定的键\
  \ `k`，首先探测由 `(h(k) + 0 + 0) mod m` 生成的位置，因为第一次 `i = 0`。如果生成的位置是空闲的，则将键存储在其中。否则，后续探测的位置将根据与探测次数\
  \ `i` 二次相关的量/因子进行偏移。二次探测法的工作效果比线性探测更好，但为了最大化地利用哈希表，`m`、`c[1]` 和 `c[2]` 的值受到限制。\n\
  \n## 常见问题\n\n**Q. 给定键 `k = 25, 13, 14, and 35`，使用二次探测法 `c[1] = 1 和 c[2] = 3` 将这些键映射到大小为\
