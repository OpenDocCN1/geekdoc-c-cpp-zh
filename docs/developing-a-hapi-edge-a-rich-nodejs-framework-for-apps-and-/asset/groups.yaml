    \ Joi.object().keys({\n});\n\n// Get plugin data\nexports.get = {\n  description:\
    \ 'get plugin data for a specific plugin id',\n  response: {\n    schema: internals.pluginSchema\n\
    \  },\n  handler: function (request, reply) {\n    //\n    ...\n  }\n};\n```\n\
    \n# Validation for hapi-plugins.com\n\nLet's take a look at the search function\
