  mdcn: "\n\n当我们希望在整个应用程序中访问某些数据但又不想重复加载它时，就会使用 `plugin.bind`。这可以是初始化或实例化某些数据，且我们只需要执行一次，例如设置会话（session）或其他针对整个应用程序生命周期的特定内容。\n\
