  md: "\n# CHAPTER 1: Introduction to hapi\n\n- 13. Appendix\n\nThis chapter stores\
    \ the appendix with descriptions and code examples for other selected databases,\
    \ and templating engines.\n\n## hapi-plugins.com\n\n![](img/79450811086e2fc8749ec4d309ea2b79_17_0.png)\n\
    \nIn this book, we will walk through how to use hapi to create the backend services\
    \ for a real (but basic) web application, hapi-plugins. hapi-plugins (hapi-plugins.com)\
    \ is a search-repository for hapi-related modules available on NPM.\n\nThis book\
    \ will NOT cover how to build the client-side JavaScript portion of the application.\
    \ However, the complete source code is available on GitHub.\n\n## Style\n\nWe\
    \ will be following hapi style-guidelines throughout this book. To find more about\
    \ what they are, you can see them at the hapi Style Guide.\n\nWe may not agree\
    \ with everything in the styles, but it's worth noting that just having this style\
    \ guide to follow prevents time taken up by discussion. It's 99 percent good.\
    \ Some practices may look odd, but it really helps with the visualization of the\
    \ code. We recommend choosing this style not for projects related to hapi, but\
    \ for node development in general.\n\nWe are relentlessly strict about our guidelines\
    \ when it comes to style. Style is something that should be one of the simplest\
    \ concepts in programming to actually follow, yet we've found many get sloppy.\
    \ If you follow the simple things, then it shows you're not paying attention to\
    \ what you're doing. Therefore, we've taken to the idea that the further away\
    \ the code is from the style, the closer the code needs to be scrutinized during\
    \ code review.\n\nIn addition to ending up with clear and concise code throughout\
    \ the programs (which is a blessing on its own), we also pay close attention during\
    \ code reviews trying to find anything that's out of place. That forces us to\
    \ scan every single line. This is a good thing because it helps catch oddities\
    \ not just on a large scale, but smaller bugs as well.\n\n## Summary\n\nWithout\
    \ further ado, let us begin in the next chapter with the hapi server.\n\n## Server\
    \ 2\n\nhapi is a framework used for building applications and services. Behind\
    \ every service, there is a server; something that serves the client needs. hapi\
    \ is at its core a superset of an HTTP server. Everything around hapi is tied\
    \ to this fact, so we kick off this book talking about the main functionality.\
    \ It's from this everything else is configured and makes a difference. We're going\
    \ to be talking about lot of concepts that are related to the server, plugins,\
    \ handlers, testing, and more.\n\nIn this chapter we look at how to set up a server\
    \ and how we've set up the server for our hapi-plugins.com example. We're going\
    \ to teach you the ins and outs of the server in the hapi framework. You'll know\
    \ how to set up caching. You'll get a first glimpse into plugins and how to add\
    \ methods that will be available throughout your application. Finally you will\
    \ learn about the request lifecycle and how to add custom functions for your application.\n\
    \n### Setting up a simple server\n\nOf course we can't start a book without first\
    \ having a hello world example. Well, yes we can actually, but we're not going\
    \ to. It's important to know how to set up a server in its simplest configuration\
    \ before advancing to more complex setups.\n\n```javascript\nvar Hapi = require('hapi');\n\
    var server = new Hapi.Server();\nserver.connection();\nserver.route({\n    method:\
    \ 'GET',\n    path: '/',\n    handler: function (request, reply) {\n        return\
    \ reply('hello hapi');\n    }\n});\n\nserver.start(function (err) {\n  console.log(server.info.uri);\n\
    });\n```\n\nWe created an instance of a hapi server. We don't actually have to\
    \ do anything at all to configure it. The next step is to get a connection to\
    \ the server. The connection is the host and port that the server is listening\
    \ to. By default, the host is set to localhost and the port is generated randomly\
    \ on ports that don't require system administrator access, and that are available.\
    \ Since we don't know what the port is, we print the URI out at the end so we\
    \ can see where our server is listening.\n\nWe add a route so that we have somewhere\
    \ we can actually send a request. We'll go a lot further into routes in Chapter\
    \ 3, but for now, think of a route as a configured path that the request from\
    \ the client (browser) can take in order to have a particular response served.\n\
    \nAt this point we start the server, and log the server URI so that we know what\
    \ the server started on.\nThe next logical steps would be to set a port for our\
    \ server to start on so that we know it's the same each time. This can be accomplished\
    \ by using the options for the connection: `server.connection({ port: 8088 });`\n\
    \n### Setting up the server for hapi-plugins\n\nNow we have a basic understanding\
    \ of how to set up a server, let's examine what we'll need to do up the server\
    \ for hapi-plugins.\n\nA typical architecture for a Single Page Application (SPA)\
    \ is to have some HTML templates served through a front-end framework such as\
    \ Ember, AngularJS, React or others. We've chosen to use React for our front-end.\
    \ The information served through back-end methods of API serving to the data,\
    \ but a cleaner approach is to have a separate API server handle the data and\
    \ this is the approach we have decided to use.\n\n```javascript\nvar internals\
    \ = {\n  servers: {\n    http: 8080,\n    host: '0.0.0.0',\n    labels: ['http']\n\
    \  },\n  api: {\n    port: 8088,\n    host: '0.0.0.0',\n    labels: ['api']\n\
    \  },\n  options: {\n    files: {\n      relativeTo: __dirname\n    }\n  }\n};\n\
    ```\n\nWe're putting the main HTTP server on port 8080 and the API server on port\
    \ 8088. They're both running and listening on 0.0.0.0 which is used for binding\
    \ to all ip addresses for the connections. When the server starts up, this will\
    \ only be running one process. The labels in the configuration are for labeling\
    \ the connection so that the appropriate plugins can be loaded. Hapi is a framework\
    \ that's plugin-centric, meaning that everything is designed to be architected\
    \ around plugins. You can find more details about plugins in Chapter 6, but for\
    \ now, let's realize an important concept. All of the methods available on the\
    \ server are also available on anything passed to the plugin. It's the first argument\
    \ to a plugin register object. Sometimes the argument name is plugin and other\
    \ times it's server. We will call it a plugin.\n\nFor hapi.com we are setting\
    \ up two connections for our server. One is for HTML content, and the other is\
    \ for our API.\n\n```javascript\nvar Async = require('async');\nvar Bell = require('bell');\n\
    var Blipp = require('blipp');\nvar Hapi = require('hapi');\nvar HapiAuthCookie\
    \ = require('hapi-auth-cookie');\nvar Hook = require('hoek');\nvar Api = require('./api');\n\
    var Authentication = require('./authentication');\nvar Controllers = require('./controllers');\n\
    var Models = require('./models');\nvar Routes = require('./routes');\n```\n\n\
    ```javascript\nvar internals = {\n  servers: {\n    port: 8080,\n    host: '0.0.0.0',\n\
    \    labels: ['http']\n  },\n  api: {\n    port: 8088,\n    host: '0.0.0.0',\n\
    \    labels: ['api']\n  }\n}\n```\n\n## CHAPTER 2: Server\n\n```javascript\nexports.init\
    \ = function (callback) {\n  var server = new Hapi.Server();\n  server.connection(internals.servers.http);\n\
    \  server.connection(internals.api);\n  //...\n};\n```\n\nWe begin by loading\
    \ our libraries that we're going to. We've organized our code as Models, Routers,\
    \ and Controllers. We also have code specifically for our API.\nWhat's new here\
    \ are the labels. They serve as an indicator for the system that can be used to\
    \ decide which plugins listen for each connection. We are likely to have only\
    \ some plugins listen to one connection and not the other. Some may listen to\
    \ both, such as a /heartbeat type call, but in general unless one is using SSL/TLS\
    \ and the other encrypted there should be little duplication. You can read more\
    \ about how to select plugins and how to manage plugins in Chapter 6. This is\
    \ done using the server.register().\n\n```javascript\nserver.path(internals.options.files.redirectTo);\n\
    server.on('request-error', function (request, response) {\n  console.log('request-error:');\n\
    \  console.dir(response);\n});\n```\n\nserver.path indicates to have a path prefix\
    \ so we can use relative paths to locate files and templates.\nWe also set an\
    \ event for handling errors that happen on requests.\n\n```javascript\nvar registerHttpPlugins\
    \ = function (next) {\n  server.register([\n    Bell,\n    Blipp,\n    HapiAuthCookie,\n\
    \    Authentication,\n```\n"
  mdcn: "\n\n# 第 1 章：hapi 简介\n\n- 13. 附录\n\n本章存储了针对其他选定数据库和模板引擎的描述及代码示例。\n\n## hapi-plugins.com\n\
