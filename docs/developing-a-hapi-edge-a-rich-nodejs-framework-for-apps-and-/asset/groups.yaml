    # Foreword


    # A framework that makes you happy


    From the very beginning, hapi was built around a simple philosophy-- development
    should be fun. The role of a framework is to increase your productivity and step
    in when you want it, but step aside when you don''t. It should not mess around
    with your environment, nor should it take away any of the power available from
    the underlying platform. But importantly, the role of a framework is to establish
    a foundation for collaboration.


    Enterprise software development has earned the notoriety of a painful, bureaucratic,
    stale, and complicated process. What''s worse is that we have learned to accept
    it as the status quo. At the center of the problem is the fact that enterprise
    software development happens in large teams, often distributed organizationally
    and geographically, and require a significant amount of process to prevent one
    mistake from affecting the productivity of hundreds of developers, or worse affecting
    the business operations.


    When I course building hapi, I knew the framework had to be the best at handling
    the typical web application activities, such as authentication, state, and caching,
    but those are all prerequisites for being a contender. The real core of the framework
    is its functionality making large scale development easy, and fun. It means attention
    to small details like protecting the developer from creating conflicts in routes,
    or other named properties, and to bit details like how allow teams to work on
    the same application without constant coordination.


    As the project matured, hapi itself became a large scale development process.
    With dozens of contributes from many companies and a growing code base, we had
    to extend the reach of our hapi-centric philosophy to the full development process.
    We greatly value code quality and consistency, since writing tests was usually
    a painful part of software development, we worked to make that better, streamlined,
    and enjoyable. We wrote new testing tools, for coding style, and automated much
    of the tedious parts. We did the same for documentation, automating the process
    as much as possible to free developers to focus on functionality.


    Four years in the project, the satisfaction of its community is still the greatest
    motivator and guide in moving the work forward. As it continues to mature, we
    learn more every day about how it is being used and how we can continue to evolve
    it; hapi is a dynamic'
