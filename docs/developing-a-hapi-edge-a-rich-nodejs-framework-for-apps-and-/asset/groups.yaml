    # Debugging 11


    A debugged program is one for which you have not yet found the conditions that
    make it fail.


    -- Jerry Ogdin


    In the last chapter, we learned a lot about how to test hapi applications and
    how to write unit tests. In this chapter, we''ll discover how to debug our hapi
    applications using some advanced tools.


    Debugging in Node.js has always been a source of pain for many developers. There
    is still a lack of great tooling to help developers with debugging Node.js across
    platforms and throughout an applications full lifecycle. While tools like DTrace
    exist, not all Node.js deployments have the opportunity to use it. Joyent and
    other companies have done a great job at documenting how to debug a Node.js application.
    In the hapi world, we have created modules to help make debugging a hapi application
    even easier. This chapter will cover specific hapi modules that can help with
    debugging a hapi server in different environments. Additionally, this chapter
    covers how to setup reporting that can help diagnose issues.


    # Chapter Overview


    The following chapter will cover many details on debugging hapi and Node.js in
    general. These topics are:


    +   * console.log

    * debug mode

    * TV

    * Good

    * REPL

    * Heap Snapshots

    * Core Files'
  - "[PAGE 141]\n\n# console.log\n\nWhile many developers may look down on console.log\
