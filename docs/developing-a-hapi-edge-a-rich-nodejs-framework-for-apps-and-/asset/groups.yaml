  - "[PAGE 36]\n\n# Routes 3\n\nIn most places, the term route is associated with\
    \ a certain path you can take to get to your destination. When driving from point\
    \ A to B, for instance, you may have the option of several different routes. A\
    \ route is a very specific path between the two points.\n\nIn hapi and other frameworks,\
    \ a route is a specific path that a request takes. On a website, the number of\
    \ characters you can write after the address hapi-plugins.com are only limited\
    \ to the number of characters your browser will support. But in order to send\
    \ a request and actually get a response for what you're looking for, you need\
    \ to know the route of where to send the request. The query then travels through\
    \ a known path within the framework, and a response is returned back on several\
    \ parameters as part of the request. The actual route you told the query to take\
    \ is key for knowing how to handle this request. It's the server's first indication\
    \ of what the client is expecting it to do with the request.\n\nIn its simplest\
    \ form, a route looks like the following:\n\n```\nserver.route({\n  method: 'GET',\n\
    \  path: '/',\n  handler: function (request, reply) {\n    reply.view('index');\n\
    \  }\n});\n```\n\nThis is a great and obvious form for short and simple routes,\
    \ but when the project gets larger we separate out the behavior to use config\
    \ instead of supplying the handler like we see here.\n\nWe typically store the\
    \ config in their own file. Before we look at what we've done for this project,\
    \ we will simply even further.\n\nIn lib/routes.js file, we have the following:\n\
    \n```\nvar Welcome = require('./controllers/welcome');\nserver.route({\n  method:\
    \ 'GET',\n});\n```"
  md: "\nbind sets the context for the method and defaults to the context when the\
    \ method was created. If you want some other content, this is the place to do\
    \ it. cache has the same configuration which will be discussed in Configuring\
    \ for caching. Finally generateKey is a function used to create a unique key for\
    \ caching.\n\n## Decorating the server\n\nUsing server.decorate, you can add functions\
    \ directly to the server. This is different from method where you add methods\
    \ to access via server. In addition to decorating the server object, you can also\
    \ decorate reply object, and we'll cover that in Chapter 4.\n\n```\nserver.decorate('server',\
    \ 'success', function () {\n    return this.response({ success: true });\n});\n\
    ```\n\n## Configuring for caching\n\nWe can use server.cache to setup cache. hapi\
    \ has a built-in server cache facility and relies on memory but other types of\
    \ engines are supported like redis, memcached and others. Please refer to the\
    \ cache documentation for details. Here is a simple example of how to use server.cache.\n\
    \n```\nvar cache = server.cache({\n    segment: 'plugins',\n    expiresIn: 60\
    \ * 60 * 1000\n});\n\ncache.set('pluginName', { author: 'hapi' }, null, function\
    \ (err) {\n    cache.get('pluginName', function (err, value, log) {\n        //\
    \ value === { author: 'hapi' };\n    });\n});\n```\n\nWe have setup cache with\
    \ segment of plugins. Segments are used to isolate cached items within the cache.\
    \ When you call this within plugin, it defaults to name.\n\n## CHAPTER 2: Server\n\
    \nWe also have an expiresIn setting which is set to expire the cached item in\
    \ one hour. There is an interesting setting called staleIn where you can mark\
    \ the item stored in cache as stale. This setting must be less than expiresIn.\
    \ Using this feature, you can have the cache ready by the time expiresIn comes\
    \ along. If staleIn doesn't have sufficient time before expiresIn hits, it will\
    \ work like the usual. Finally you can see use cache.set() to set pluginName with\
    \ the value and can retrieve that value using cache.get() method.\n\n## Request\
    \ lifecycle\n\nUnderstanding how handles an HTTP request is fundamental in developing\
    \ secure, efficient applications. Node.js doesn't provide much in this regard,\
    \ although creating a server is fairly simple:\n\n```javascript\nvar server =\
    \ require('http');\n\nserver.on('request', function (request, response) {\n  //\
    \ do something\n});\n\nserver.listen(80);\n```\n\nThat's just it, the request\
    \ has all information from the origin of the request, and the reply is a writable\
    \ stream that needs to have headers set, information written to it, and then the\
    \ connection closed. At first this can be exciting for those who haven't dealt\
    \ with it. The way in which hapi deals with the requests is by having a reliable\
    \ series of events each time a request is received by the server. Here's the full\
    \ lifecycle:\n\n- 'onRequest' extension point: always called. The request object\
    \ passed to extension functions is decorated with request.URL() and request.getMethod().\
    \ Calls to these methods will impact how the request is routed and can be used\
    \ for these rules. request.route is not yet populated at this point.\n\nJSON configuration\
    \ is ignored for any response returned from the extension point since no route\
    \ is matched yet and JSON configuration is unavailable.\n\n- Lookup route using\
    \ path\n- Parse cookies\n- 'onPreAuth' extension point: Authenticate request\n\
    - Read and parse payload\n- Authenticate request payload\n- 'onPostAuth' extension\
    \ point\n- Validate path parameters\n- Process query (e.g. JSON)\n- Validate query\n\
    - Validate payload\n- 'onPreHandler' extension point: Route prerequisites - configured\
    \ in the Handler\n- Route handler\n- 'onPostHandler' extension point\n\n> The\
    \ response object contained in request.response may be modified (but not assigned\
    \ a new value). To return a different response type (for example, replace an error\
    \ with an HTML response), return a new response via reply(response).\n\n## Validate\
    \ response payload\n\n- 'onPreResponse' extension point: always called (except\
    \ when reply.close() is called or the client terminates prematurely).\n\n> The\
    \ response in request.response may be modified (but not assigned a new value).\
    \ To return a different response type (for example, return an error with an HTML\
    \ response), return a new response via reply(response). Note that any errors generated\
    \ after reply(response) will not be passed back to the 'onPreResponse' extension\
    \ method to prevent an infinite loop.\n\n- Send response (may emit 'request-error'\
    \ event)\n- Emits 'response' event\n- Wait for tails\n- Emits 'tail' event\n\n\
    ## Extension points\n\nNow that we've discussed the lifecycle, we can utilize\
    \ 'extension points' in hapi. These extension points expose streams in the lifecycle\
    \ where other functions can be inserted. They can easily be tied to a server to\
    \ augment the existing hapi lifecycle. We use the server.ext functionality to\
    \ accomplish this. Let's look at a couple of examples. These next examples are\
    \ also shown in Chapter 9 around how to do shared context. It's important to know\
    \ what this means now, but let's take a look at how server.ext is used. There's\
    \ first the onResponse event:\n\n```javascript\nserver.ext('onResponse', function\
    \ (request, reply) {\n  var response = request.response;\n  if (!response.isBoom)\
    \ {\n    if (response.source && response.source.context) {\n      response.source.context.title\
    \ = \"hapi-plugins\";\n    }\n  }\n  return reply();\n})\n```\n\nYou can see that\
    \ we called server.ext. Recall in the request lifecycle, the onResponse towards\
    \ the end, right before the response is given. We add a function here, which we\
    \ add the title context and return back the reply() object. The alternative example\
    \ in Chapter 9 is:\n\nThis time we are using the onRequest. When you need to add\
    \ some functionality to the server, you could utilize onAuth or onPostAuth. Keep\
    \ in mind that this can always be the, the number of characters you can write\
    \ after the address hapi-plugins.com are only limited to the hapi-plugins.\n"
  mdcn: "\n\nbind 为方法设置上下文，默认情况下使用方法创建时的所在上下文。如果你想设置其他内容，可以在此处进行操作。cache 具有相同的配置，将在“配置缓存”章节中讨论。最后，generateKey\
    \ 是一个用于为缓存创建唯一键的函数。\n\n## 装饰服务器\n\n使用 `server.decorate`，你可以直接向服务器添加函数。这与通过 server\
    \ 访问添加的方法（method）有所不同。除了装饰服务器对象外，你还可以装饰 reply 对象，我们将在第 4 章介绍这一内容。\n\n```\nserver.decorate('server',\
    \ 'success', function () {\n    return this.response({ success: true });\n});\n\
    ```\n\n## 配置缓存\n\n我们可以使用 `server.cache` 来设置缓存。hapi 内置了服务器缓存机制，并依赖于内存，但也支持其他类型的引擎，如\
    \ redis、memcached 等。详细信息请参阅缓存文档。以下是如何使用 `server.cache` 的简单示例。\n\n```\nvar cache\
    \ = server.cache({\n    segment: 'plugins',\n    expiresIn: 60 * 60 * 1000\n});\n\
    \ncache.set('pluginName', { author: 'hapi' }, null, function (err) {\n    cache.get('pluginName',\
    \ function (err, value, log) {\n        // value === { author: 'hapi' };\n   \
    \ });\n});\n```\n\n我们已经设置了带有 plugins 段的缓存。分段用于隔离缓存中的缓存项。当你在插件内部调用它时，默认使用插件名称。\n\
    \n## 第 2 章：服务器\n\n我们还有一个 `expiresIn` 设置，用于设置缓存项在一小时后过期。有一个有趣的设置叫做 `staleIn`，你可以将缓存中的项标记为过期（stale）。该设置必须小于\
    \ `expiresIn`。使用此功能，你可以在 `expiresIn` 到达准备好缓存。如果 `staleIn` 在 `expiresIn` 触发之前没有足够的时间，它将像通常一样工作。最后，你可以看到使用\
    \ `cache.set()` 设置带有值的 pluginName，并可以使用 `cache.get()` 方法检索该值。\n\n## 请求生命周期\n\n\
    理解如何处理 HTTP 请求是开发安全、高效应用程序的基础。Node.js 在这方面提供的不多，尽管创建一个服务器相当简单：\n\n```javascript\n\
    var server = require('http');\n\nserver.on('request', function (request, response)\
    \ {\n  // do something\n});\n\nserver.listen(80);\n```\n\n就是这样，请求包含了从请求源开始的所有信息，而响应是一个可写流，需要设置头、向其写入信息，然后关闭连接。对于那些还没有处理过的人来说，起初可能会让他们很兴奋。hapi\
    \ 处理请求的方式是在服务器每次接收请求时拥一组可靠的事件序列。以下是完整的生命周期：\n\n- 'onRequest' 扩展点：始终被调用。传递给扩展函数的请求对象被装饰了\
    \ `request.URL()` 和 `request.getMethod()`。对这些方法的调用将影响请求的路由方式，并可用于这些规则。此时 `request.route`\
    \ 尚未填充。\n\n对于从扩展点返回的任何响应，JSON 配置都会被忽略，因为尚未匹配到路由，且 JSON 配置不可用。\n\n- 使用路径查找路由\n\
    - 解析 cookies\n- 'onPreAuth' 扩展点：身份验证请求\n- 读取并解析负载\n- 身份验证请求负载\n- 'onPostAuth'\
    \ 扩展点\n- 验证路径参数\n- 处理查询（例如 JSON）\n- 验证查询\n- 验证负载\n- 'onPreHandler' 扩展点：路由前提条件\
    \ - 在 Handler 中配置\n- 路由处理器\n- 'onPostHandler' 扩展点\n\n> 包含在 `request.response`\
    \ 中的响应对象可以被修改（但不能赋予新值）。要返回不同的响应类型（例如，用 HTML 响应替换错误），请通过 `reply(response)` 返回一个新的响应。\n\
    \n## 验证响应负载\n\n- 'onPreResponse' 扩展点：始终被调用（除非调用了 `reply.close()` 或客户端提前终止）。\n\n\
    > `request.response` 中的响应可以被修改（但不能赋予新值）。要返回不同的响应类型（例如，通过 HTML 响应返回错误），请通过 `reply(response)`\
    \ 返回一个新的响应。注意，在调用 `reply(response)` 之后生成的任何错误将不会传回 'onPreResponse' 扩展方法，以防止无限循环。\n\
    \n- 发送响应（可能会触发 'request-error' 事件）\n-  'response' 事件\n- 等待尾部\n-  'tail' 事件\n\n\
    ## 扩展点\n\n现在我们已经讨论了生命周期，可以利用 hapi 中的“扩展点”。这些扩展点暴露了生命周期中的流，其他函数可以在其中插入。它们可以轻松地绑定到服务器以增强现有的\
    \ hapi 生命周期。我们使用 `server.ext` 功能来实现这一点。让我们来看几个示例。接下来的示例在第 9 章中也有关于如何做共享上下文的内容。现在知道这意味着什么很重要，但让我们来看看\
    \ `server.ext` 是如何使用的。首先是 `onResponse` 事件：\n\n```javascript\nserver.ext('onResponse',\
    \ function (request, reply) {\n  var response = request.response;\n  if (!response.isBoom)\
    \ {\n    if (response.source && response.source.context) {\n      response.source.context.title\
    \ = \"hapi-plugins\";\n    }\n  }\n  return reply();\n})\n```\n\n你可以看到我们调用了 `server.ext`。回想请求生命周期，`onResponse`\
    \ 位于最后，在响应给出之前。我们在这里添加了一个函数，我们添加了标题上下文并返回了 `reply()` 对象。第 9 章中的另一种示例是：\n\n这次我们正在使用\
    \ `onRequest`。当你需要为服务器添加某些功能时，可以利用 `onAuth` 或 `onPostAuth`。请记住，这始终可以是，在地址 hapi-plugins.com\
    \ 之后可以写的字符数仅限于 hapi-plugins。\n\n"
