    \ 在哪里找到助手函数。\n\n```\nvar Hapi = require('hapi');\n\nvar server = new Hapi.Server();\n\
    server.views({\n  engines: {\n    html: require('handlebars') // .html 是 hapi\
    \ 将查找的后缀\n  },\n  path: dirname + '/views',\n  helpersPath: dirname + '/views/helpers'\n\
    });\n```\n\n# 助手文件\n\n助手文件应该用所需的调用名称命名。如果你想创建一个像 `toMoney` 这样的助手函数，文件应该命名为 `toMoney.js`，并且应该导出单个函数（可以接受参数）。\n\
    \n```\nmodule.exports = function (val) {\n  return \"$\" + val.toFixed(2);\n};\n\
    ```\n\n然后，在模板内部，就可以带参数调用 `toMoney`（参数可以是变量）。\n\n```\n{{toMoney 25}}\n{{toMoney\
    \ cost?}}\n```\n\n# 共享上下文\n\n通常希望在每个视图的每个上下文对象中包含一些数据。例如，在一个地方维护 HTML 页面标题并将其附加到每个视图，比将其包含在每个视图上下要容易得多。\n\
    \n下面的示例 `shared-context.js` 将添加（或覆盖）具有新值的 `context.title`。如果调用 handler 时没有 views，则\
    \ `.context` 将被定义且不会受到影响。\n\n```\nserver.ext('onPreResponse', function (request,\
    \ reply) {\n  var response = request.response;\n  if (!response.isBoom) {\n  \
    \  if (response.source && response.source.context) {\n      response.source.context.title\
    \ = \"Hapi-Plugins\";\n    }\n  }\n  return reply();\n});\n```\n\n上面的示例使用了 `onPreResponse`，这是我们在第\
    \ 2 章 Server 请求生命周期中学习到的。我们正在使用 `server.ext` 来扩展此函数，在提供响应之前，我们添加了这个标题上下文。\n\n\
    另一种方法是将共享对象合并到视图上下：\n\n```\n// 在 server.js 内部\nserver.ext('onRequest', function\
    \ (request, next) {\n  // 这可以从数据库异步加载\n  request._sharedContext = {\n    title:\
    \ 'Hapi-Plugins'\n  };\n  next();\n});\n```\n\n在这里我们使用了请求生命周期的 `onRequest` 部分。与上一个示例一样，我们正在使用\
    \ `server.ext` 函数扩展请求生命周期的这部分。在下文中，我们使用 handler 在回复模板之前合并 `sharedContext`。\n\n\
    ```\n// 在 handler 内部\nvar Hoek = require('hoek');\n/* ... */\nhandler: function\
    \ (request, reply) {\n  var ctx = {\n    content: 'Hello world!'\n  };\n  var\
    \ context = Hoek.applyDefaults(request._sharedContext, ctx);\n  return reply.view('/path/'\
    \ + 'templateName', context);\n}\n```\n\n通过像上面那样使用共享上下文，可以将模板和视图之间共享的常用值分组并将它们放置在单个位置（而不是在每个\
    \ handler 和视图中重复它们）。如果你需要反复传递服务器范围的设置（如功能标记、网站信息或翻译），这将非常有帮助。\n\n# 总结\n\n现在你已经知道如何在给定数据上下文的情况下向最终用户渲染\
    \ HTML，你现在可以使用 hapi 创建完整、功能完网站。视图和模板化系统通过提取共享数据、共享局部模板以及整个模板，可以节省大量的开发时间并让你的生活变得简单。\n\
    \n利用你到为止学到的知识，你现在可以使用 hapi 创建功能完整的网站。但是，正如你在第 10 章测试中将看到的，仅仅能够创建一个网站是不够的。我们将向你展示如何测试应用程序。\n\
    \n# 测试 10\n\n在上一章（第 9 章模板化）中，我们发现了如何用 HTML 响应请求。有了这最后一部分，你就可以创建自己的完整、功能完 Web 应用程序。然而，这还不够！为了构建真实的、达到生产标准的应用程序，你需要测试你的代码。\n\
    \n在 hapi 世界中，测试极其重要。测试对于 hapi 模块维护者来说非常重要，以至于他们开发了名为 `lab` 的测试库来确保测试正确。在拉请求合并到核心模块之前，它必须拥有工作的测试，并且对模块中的代码具有\
    \ 100% 的测试覆盖。因此，如果你计划向社区贡献，理解 hapi 测试是如何编写和执行的至关重要。\n\n# 章节概述\n\n后续章节将涵盖许多基本测试原理以及列出的主题：\n\
    \n- lab 的历史\n- 安装 lab\n- 编写一个简单的测试\n- lab 的原理\n- 编写 hapi 测试\n- 代码覆盖率\n- 报告器\n\
    - 代码检查 (Linting)\n- 插件测试\n\n# lab 的历史\n\n为了获得最佳结果，hapi 与 lab 运行器配合。lab 是为了用于 hapi\
    \ 和 hapi 插件而开发的测试框架。hapi 最初使用 mocha 和 chai 来执行测试。然而，当 Node.js 0.10 发布时，hapi 增加了对新版本的支持并引入了\
    \ domains。Domains 自发布以来一直存在缺乏测试支持的问题。当 0.10 发布时，mocha 在适配充分测试 domains 方面进展缓慢。由于\
    \ hapi 使用 domains 的需求，必须采取某些行动。结果就是 lab 被创建了。最初，lab 是 mocha 的分支。不需要的功能被精简了，并添加了更多功能。\n\
    \n代码覆盖率是确保高质量代码提交到仓库的关键因素。因此，代码覆盖支持需要作为一种简单的标志被内置在测试框架中。\n\n在 lab 出现之前，hapi 的\
    \ mocha 测试是通过 blanket coverage 模块运行的。Blanket 本身依赖 esprima 创建代码的抽象语法树 (AST)，以帮助识别要插入用于代码覆盖的语句。Blanket\
    \ 被继承到了 lab 创建中。然而，随着时间的推移，代码覆盖被集成到了 lab 内部，而不是通过第三方提供。\n\n由于在内部集成了分析，代码报告也发生了演变。这有助于代码覆盖在\
    \ lab 报告中成为一等公民。结果是，HTML 报告现在向开发者指示代码中无法到达的行。\n\n"
