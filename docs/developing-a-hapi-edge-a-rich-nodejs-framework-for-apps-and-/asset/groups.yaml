    \      \"heapTotal\": 32171264,\n      \"heapUsed\": 17638880\n    }\n  }\n}\n\
    ```\n\n```\n\"delay\": 0.2207310050725937,\n\"load\": {\n  \"requests\": {\n \
    \   \"concurrents\": {\"62778\": 0},\n    \"responseTimes\": {},\n    \"sockets\"\
    : {\n      \"http\": {\n        \"total\":0\n      },\n      \"https\": {\n  \
    \      \"total\":0\n      }\n    }\n  }\n}\n```\n\nIn the previous example, you\
    \ can see that there is a lot of useful information that is logged. It makes it\
    \ possible to correlate higher than usual memory usage with network activity or\
    \ the event loop being slow. In version 6 there is still support for logging request\
    \ data with wreck. This is useful for tracking issues that may exist between your\
    \ hapi server and downstream streams. Therefore, the proxy data can be logged\
    \ using good.\n\nAn example of how you use wreck might look like the following:\n\
    \n```\n\"event\":\"wreck\",\"timestamp\":143149615889,\"timeSpent\":581,\"request\"\
    :{\"method\":\"GET\",\"path\":\"/api/route\",\"url\":\"http://localhost:8081/api/route\"\
    ,\"protocol\":\"http\",\"host\":\"localhost:8081\"},\"response\":{\"statusCode\"\
    :200,\"message\":\"OK\",\"headers\":{\"content-type\":\"application/json\",\"\
    charset\":\"utf-8\",\"cache-control\":\"no-cache\",\"content-length\":4198,\"\
    accept-ranges\":\"bytes\"},\"date\":\"Tue, 12 May 2015 22:26:55 GMT\",\"connection\"\
    :\"close\"}\n```\n\nYou can see some great information here. How much time is\
    \ spent can also be useful to look at your headers to make sure they are getting\
    \ properly. There is a great deal of power available from the data that good collects\
    \ and reports, as well as operations. Sending the data to log aggregator like\
    \ splunk or logstash and creating dashboards for different stakeholders is a good\
    \ way to leverage the data available. In the case of the hapi application, good\
    \ is used to log operations to the console. This was accomplished by the index.js\
    \ file of the hapi-plugins by registering good with the good-console reporter.\
    \ An example of this registration is found below.\n\n```\nvar goodOptions = {\n\
    \  opsInterval: 5000,\n  reporters: {\n    reporter: 'good-console',\n    events:\
    \ { log: '*', ops: '*' }\n  }\n};\n```\n\n```\nvar registerPlugins = function\
    \ (next) {\n  server.register([\n    Bell,\n    Blipp,\n    HapiAuth,\n    Controllers,\n\
    \    Models,\n    Routes,\n    { register: require('good'), options: goodOptions\
    \ },\n    { select: 'http' },\n    function (err) {\n      return next(err);\n\
    \    }\n  ]);\n};\n```\n\nThe events that the good-console reporter will send\
    \ to the console are indicated by the events property. The * value indicates that\
    \ the reporter will not filter out any events based on tags. If you are concerned\
    \ with only events related to a certain tag, you can indicate that by replacing\
    \ * with a single string named as the tag you care about or with an array of strings\
    \ representing the event tags you care about. The reporting from good is observed\
    \ after you start the server and look at the output to stdout. Below shows an\
    \ example output from the ops event after 10 seconds of the server running. As\
    \ you can see, the memory consumed, uptime, and loads can be reported.\n\n```\n\
    150418/175554.526, [ops], memory: 64Mb, uptime (seconds): 5,\nload: 1.646484375,2.1015625,1.7680664065\n\
    150418/175559.531, [ops], memory: 65Mb, uptime (seconds): 10,\nload: 1.67431640625,2.099609375,1.7690429687\n\
    ```\n\n## CHAPTER 11: Debugging\n\n## REPL\n\nIn order to make it easier to debug\
    \ running applications on remote servers the hapi plugin reptile was created.\n\
    \nThis plugin creates a REPL that listens on a port for TCP connections that have\
    \ access to the running hapi server object. A REPL is a read execute print loop,\
    \ and is a great way to modify a running server or simply inspect what is happening\
    \ on it. By default, the REPL is only accessible from the localhost. This is done\
    \ by design, to prevent anyone from gaining access to the REPL, which has the\
    \ potential to cause issues on the application.\n\nThe REPL that is accessible\
    \ on the port is the same as when you type node without any arguments. By using\
    \ the REPL module that ships with node core. The only difference is that server\
    \ is added to the global context.\n\nIn order to create a connection to the REPL\
    \ port, you can use netcat or telnet. When you run the server in /example folder\
    \ inside of reptile, it will create a dummy server and create the reptile plugin.\
    \ The example server listens on port 9000. Below is how you connect using netcat\
    \ to the local port 9000.\n\n```\n$ nc localhost 9000\n```\n\nAfter a connection\
    \ is established you should see what objects are available on the global object.\
    \ To do this, simply type global and press Enter. From this point, you can navigate\
    \ through existing objects or create handlers for events. This should provide\
    \ a nice hook into the running server that you can use for debugging purposes.\n\
    \n## Heap Snapshots\n\nSome of the most difficult problems to debug are those\
    \ that cause your process to crash. A common method for debugging these issues\
    \ is to simply look at the stack output when the exception occurs. Another useful\
    \ tool is to use v8 in the world of v8 to create a snapshot of the heap at the\
    \ moment the exception takes place and analyze it. To address both of these issues\
    \ use the poop module. The poop is a hapi plugin that listens for the process\
    \ uncaughtException event to fire. When an uncaught exception occurs, a heap snapshot\
    \ file is created and the exception details are logged to a file. Poop will also\
    \ rethrow the exception so that the exception can propagate and be handled by\
    \ other subscribers.\n"
  mdcn: "\n\n如你在上一个示例所示，当发生错误时，错误和堆栈跟踪会被记录到控制台，并带有 `Debug:` 前缀日志。\n\n## TV\n\n在开发过程中，调试\
    \ hapi 服务器的另一个有用选项是使用 `tv` 模块。`tv` 主要设计为 hapi 应用的前端消费者设计。其目标是提供一个易于使用的仪表板，显示服务器请求活动的信息。这对于前端开发者来说，能够追踪其代码向\
    \ hapi 服务器发送的请求的生命周期是特别用的。这里展示了 `tv` 的截图：\n\n![](img/79450811086e2fc8749ec4d309ea2b79_142_0.png)\n\
    \n为了向服务器添加 `tv`，你像注册任何其他 hapi 插件一样注册它。下面显示了如何使用默认设置注册 `tv`。在服务器上注册 `tv` 后，你可以通过服务器\
    \ URL `/debug/console` 访问它。\n\n```\nvar Hapi = require('hapi');\nvar Tv = require('tv');\n\
    \nvar server = new Hapi.Server();\nserver.connection();\n\nserver.register(Tv,\
    \ function (err) {\n\n  if (!err) {\n    server.start();\n  }\n});\n```\n\n通过这种方式，你可以通过选择不同的事件标签来订阅你关心的请求事件。请求详情会在它们产生时实时发送到\
    \ `tv` 页面。如果任何请求作为有用信息脱颖而出，你也可以对其进行星标并进行调查。\n\n## 第 11 章：调试\n\n## Good\n\n在 `tv`\
    \ 中记录请求详情对于本地开发是有用的。然而，当你处于 QA 或生产环境时，你将可能希望使用一个专门为该场景设计的模块。对于这些情况，以及本地开发，`good`\
    \ 插件都是极其用的。\n\n`good` 更加适用于 QA 和生产环境的原因是，它被设计为还可以记录操作数据。在多年来，它的功能已经扩展到不仅包含典型的内存或\
    \ CPU 详细信息，现在还包含了事件循环延迟和网络活动。\n要向 hapi 服务器添加它，你像注册任何其他插件一样注册它。主要的区别在于，使用 `good`\
    \ 时，你需要为你关心的事件类型以及记录这些事件的地方指定选项。`good` 事件包括以下内容：\n\n- ops\n- response\n- log\n\
    - error\n- request\n- wreck\n\n事件数据可以存储的地方非常广泛。如果你需要不同的报告器（reporter），可以通过查看许多示例之一构建一个。目前\
    \ `good` 可用的报告器包括以下类型：\n\n- UDP\n- HTTP\n- Files\n- Console\n- InfluxDB\n- Winston\n\
    - Loggly\n- Logstash\n\n这个列表将继续增长。你可以通过查看 `good` 页面获取最新列表。下面的代码显示了如何注册 `good`\
    \ 并每秒将所有 `ops` 数据记录文件 `/var/log/example/ops.json`。\n\n```\nvar Hapi = require('hapi');\n\
    var Good = require('good');\n```\n\n```\nvar server = new Hapi.Server();\nserver.connection();\n\
    \nvar options = {\n  opsInterval: 1000,\n  reporters: {\n    reporter: 'good-file',\n\
    \    events: { ops: '+' },\n    config: '/var/log/example/ops.json'\n  }\n};\n\
    \nserver.register({\n  register: Good,\n  options: options,\n}, function (err)\
    \ {\n\n  if (err) {\n    console.error(err);\n    return;\n  }\n\n  server.start();\n\
    });\n```\n\n当你查看 `ops` 日志文件时，你会发现每个条目都是 JSON 解析的，且每个条目都用换行符分隔。下面是事件数据的示例。\n\n\
    ```\n{\n  \"event\": \"ops\",\n  \"timestamp\": 1527940993174,\n  \"host\": \"\
    mac.local\",\n  \"pid\": 35503,\n  \"os\": {\n    \"load\": [2.1342773475, 2.44287109375,\
    \ 2.487046875],\n  },\n  \"mem\": {\n    \"total\": 1717986184,\n    \"free\"\
    : 5757075456,\n    \"uptime\": 459461\n  },\n  \"proc\": {\n    \"uptime\": 4,\n\
    \    \"mem\": {\n      \"rss\": 46538752,\n      \"heapTotal\": 32171264,\n  \
    \    \"heapUsed\": 17638880\n    }\n  }\n}\n```\n\n```\n\"delay\": 0.2207310050725937,\n\
    \"load\": {\n  \"requests\": {\n    \"concurrents\": {\"62778\": 0},\n    \"responseTimes\"\
    : {},\n    \"sockets\": {\n      \"http\": {\n        \"total\":0\n      },\n\
    \      \"https\": {\n        \"total\":0\n      }\n    }\n  }\n}\n```\n\n在在上的示例中，你可以看到记录了许多有用信息。这使得将比通常更高的内存占用与网络活动或事件循环缓慢关联成为可能。在版本\
    \ 6 中，仍然支持使用 `wreck` 记录请求数据。这对于追踪你的 hapi 服务器和下游流之间可能存在的问题非常有用。\n"
