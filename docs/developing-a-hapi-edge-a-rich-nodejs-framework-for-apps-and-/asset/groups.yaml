    server.route({\n  method: 'GET',\n  path: '/',\n  handler: function (request,\
    \ reply) {\n    var publishTail = request.tail('publish the book in the\nbackground\
    \ for download');\n\n    HapiBook.publishForDownload({ format: 'pdf' }, function\n\
    (downloadUri) {\n      var mail = Mail({ to: user });\n      mail.publishNotification(downloadUri,\
    \ function () {\n        publishTail();\n      });\n    });\n```\n\n56"
