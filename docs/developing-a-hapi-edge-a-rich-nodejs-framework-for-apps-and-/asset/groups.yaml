    # The handler 4


    The handler at its core, is what handles the incoming request for a specific route.
    It determines how the request will be “handled.” The configuration for the route
    plays a critical part in how the handler needs to behave, and since it''s tightly
    coupled, some configuration for the route needs to be taken into consideration.


    When we specify a route for a request, for example, if you''re going to download
    a file from /downloads/<filename> then it is the handler that has all of the logic
    in it for finding the file in question in order to send it to the connecting client.
    The handler may also do other things, like counting how many times the file has
    been downloaded, access control making sure not just anyone has access to download
    the file, and so on.


    The handler function “handles” all of the decisions and logic between accepting
    a request from the client and returning a response to the user. haki has some
    nice features to offload some work automatically, such as validation. We will
    look at this in more detail in Chapter 5 (why would we dream of doing that though?)


    The handler is generally a callback function that is comprised of two arguments:
    the request and the reply. There are multiple other-built-in handlers that we
    will also go over and discover.


    This chapter will cover the various use-cases for the handler. We''re going to
    delve into the arguments of the handlers and various methods for making life in
    the handler easier for ourselves.


    # The request


    The request object contains all of the information pertaining to the incoming
    request to the server whether it be from a browser, or some other tool using the
    API. Since the routing already determines which request will be handled depending
    on the method, the request received will be limited to whatever is specified.
    At the end of the day, the full request is available here, which contains the
    headers and all of the data content sent.


    Refer back to the request object to find out how the request travels through the
    framework.'
  - "[PAGE 45]\n\n# CHAPTER 4: The handler\n\nAttached to the requests is a whole\
    \ slew of important and useful information that gets used in the handler in order\
    \ to fulfill a request. In the rest of this section we're going to take a look\
    \ at how to find this data and what you can do with it.\n\nBear in mind that there\
    \ are other functions in the request lifecycle (see Chapter 2) that can add data\
    \ to the request along the way. We're going to take a look at a few common ones.\n\
    \n# parameters\n\nSome of the request object data is set as part of direct configuration\
    \ of the route. For instance, if the route has defined a path that contains an\
    \ id of a hapi plugin to download, then that will be part of the parameters access\
    \ the request object.\n\n```\nserver.route([\n  //\n  {\n    method: 'GET',\n\
    \    path: '/plugins/{name}',\n    config: Controllers.Plugin.get\n  }\n  //\n\
    ]);\n```\n\nThe name is the identifier in our case, and this will be accessed\
    \ via request.params.name. In the above example we have a GET method. Assuming\
    \ port 8080, if we did a:\n\n```\ncurl -XGET http://localhost:8080/plugins/pluginName\n\
    ```\n\nWe'd get the back with what is returned in Controllers.Plugin.get. We will\
    \ be contrasting this with other methods when we talk about payload.\n\n# query\n\
    \nIt can be confusing for new people to hapi, what is the difference between a\
    \ param and a query. The query of the URL in https://hapi-plugins.com/search?q-pluginName\
    \ is the after ?. Take a look at the previous example for /plugins/{name} to contrast\
    \ this. The name param was strictly part of the path.\n\n\nThe request object\
    \ contains all of the key value pairs that are sent along a query in the URL.\n\
    \nFor example, we could be a bit crazy with the URL to get the information about\
    \ a particular plugin on hapi-plugins.com and request something like:\n\n```\n\
    http://localhost:8080/plugins/blipp?hello=hi\n```"
  - "[PAGE 46]\n\n# The request\n\nIf we log the output with console.log(request.query)\
    \ then the result we'll\n printed to the console would show as:\n\n```\n{ hello:\
    \ 'hi' }\n```\n\nIt's worth noting that sometimes the value can be an array.hapi\
    \ handles multiple query\nkeys automatically for you, you do have to be aware\
    \ that the result can be a different\ntype than expected.\nIf the URL looks like\
    \ the following:\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi&hello=hey\n\
    ```\n\nWe now see the value as an array:\n\n```\n{ hello: ['hi', 'hey'] }\n```\n\
    \n# payload\n\nrequest.payload contains information that has been transmitted\
    \ as part of the request\nthat's not suitable as a query. This may be a file,\
    \ or a blob of JSON or XML. While it's cer-\ntain possible to send payload for\
    \ all of the request methods (GET, POST, DELETE, PUT,\nPATCH, etc), it's typically\
    \ used for GET. If you do end up seeing payload for GET,\ny should probably rethink\
    \ your design.\nLet's start with a simple example for a handler where we'd utilize\
    \ the POST method\nof creating a new user.\n\n```\nhandler: function (request,\
    \ reply) {\n  console.log(name is: ' + request.payload.name);\n  console.log(email\
    \ is: ' + request.payload.email);\n  return reply('success');\n}\n```\n\nIf you\
    \ recall when we talked about params earlier and the GET method, we wanted to\n\
    contrast this with payload. For the handler, we setup a route as below.\n\n```\n\
    server.route({\n  method: 'POST',\n  path: '/user',\n  config: {\n    handler:\
    \ handler\n  }\n});\n```"
