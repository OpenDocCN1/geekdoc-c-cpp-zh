    \ an idea how Eran feels about quality and making sure that all data is validated\
    \ and in a state where we're safe to operate on.\n\nIn this chapter, we will cover\
    \ the various places to validation with and without joi.\n\n# Types of validations\n\
    \nhapi provides validations for the following inputs: query, payload, headers\
    \ and params. Recall that we learned about this in Chapter 4. Additionally, hapi\
    \ allows us to do validation on the response.\n\nThe formats for validation are\
    \ always the following:\n\n- true - no validation is performed.\n\n# Joi validation\n\
    \n- false - no variables are allowed at for this section\n- Joi validation object.\
    \ This is what we've discussed so far.\n- a validation function.\n\nThe most typical\
    \ one that we end up working with is using a joi validation object, we'll be focusing\
    \ on that most. Validation functions can also be used for things which don't fit\
    \ regular joi validation.\n\nValidation is configured as part of the route options\
    \ that get passed to a route. Let's say you want to change the password for a\
    \ user. You want to send a JSON object password to the endpoint, and change the\
    \ password to the one you specified. The JSON object would look like:\n\n```json\n\
    {\n  \"password\": \"somepass\"\n}\n```\n\nThen you can set up the route to look\
