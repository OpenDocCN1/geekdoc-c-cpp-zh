  - '[PAGE 173]


    # CHAPTER 13: Appendix


    # MUSTACHE.JS / HOGAN.JS


    Mustache was created by Chris Wanstrat (of GitHub fame) as a “framework-agnostic
    way to render logic-free views”. It strictly separates logic from presentation
    - it is impossible to include any logic in the templates themselves.


    It is supported in practically every programming language. Thus, Mustache templates
    are highly portable and can be easily shared between projects of different programming
    languages.


    As of 2014, the most popular Node.js Mustache compiler is Mu. But Hogan.js is
    gaining popularity. Hogan is a blazing fast JavaScript (supported by Node.js and
    JavaScript within browsers) compiler for Mustache templates.


    # HANDLEBARS.JS


    Handlebars was created by Yehuda Katz (of Ruby on Rails, Ember.js, and jQuery
    fame) as an extension to Mustache. It is also actively maintained by Kevin Decker
    (of WalmartLabs).


    Handlebars is designed to simplify writing templates by supporting expressions
    within tags (directly subkeys of objects), partials (reuses of a template), and
    helpers (JavaScript functions that can be used anywhere inside a template). These
    features make it easier to maintain large JavaScript applications with many templates.
    How-ever, as such, Handlebars templates are not nearly as portable.


    But, for applications, Handlebars is, by far, the most popular templating engine.


    # JADE


    Jade was created by T.J. Holowaychuk (of Express.js fame and was one of the most
    prolific Node.js module authors before retiring from Node.js). It was designed
    to be a “robust, elegant, feature rich” templating engine that borrows many concepts
    from Ruby on Rail’s engine.


    Jade is designed specifically to template HTML content. Unlike the other templating
    engines, it requires the use of custom syntax that differs from the output format
    (HTML). Thus, it has a bigger learning curve and effectively locks applications
    in using Jade.


    # DUST


    Dust was created by Aleksander Williams. It was designed to avoid the limitations
    of Mustache variants. It is asynchronous by default and composable. It has a similar
    syntax to Mustache and is highly customizable. Dust.js is used frequently by Netflix.'
  - '[PAGE 174]


    # ECT


    ECT was created by Vadim Baryshev. It claims to be the "fastest JavaScript templating
    engine with embedded CoffeeScript syntax". ECT focuses on performance and quality-of-life
    development features such as automatic reload, JavaScript & CoffeeScript logic
    support- in templates, multi-line expressions, and tag customization.'
