    \ host）。服务器可以监听多个虚拟主机，但为了让路由为某个特定主机触发，可以指定要监听的主机。通过这样，服务器可以根据定义的 vhost 提供相应的路由。vhost\
    \ 可以定义为字符串或字符串数组。默认允许任何主机使用该路由。\n\n### handler\n\nhandler 是一个函数，用于返回被调用路由的输出。它取决于先于其执行的验证和任何身份验证。如果\
