  - "[PAGE 108]\n\n# Templating 9\n\nIn the last chapter (Chapter 8 Models), we saw\
    \ how easy it was to obtain and store data. Now, we will see how to present the\
    \ data back to the user.\n\nhapi supports most templating engines out of the box.\
    \ This chapter will include working examples for six of the most popular engines:\
    \ Handlebars.js, Mustache.js, Jade, Dust, eco, and ECT. For an overview of them,\
    \ please see the Appendix at the end of the book.\n\nIn a typical web application,\
    \ the end-user uses a URL, the URL maps to a handler in a web server, the handler\
    \ does some business logic to prepare some data, and finally, the web server responds\
    \ with data to the end-user in HTML format.\n\nThere are many different ways to\
    \ respond with HTML. The two primary methods are concatenation and templating\
    \ systems. In the old days of development, HTML was generated by concatenation\
    \ or adding HTML strings with various variants, like as:\n\n```\nvar html = '<html><title>'\
    \ + \npage_title + \n'</title></head><body>' + \ncontent + \n</body></html>';\n\
    return reply(html);\n```\n\nThankfully, this tedious and inflexible method has\
    \ gone out of style and has been replaced by modern templating systems. However,\
    \ this concatenation method is still possible, and some teams may use it for the\
    \ sake of efficiency in the case of one-line responses.\n\nMeanwhile, with respect\
    \ to modern web applications, a templating system merges a template responsible\
    \ for output formatting data into a consistent format - like HTML. For example,\
    \ a Handlebars (or Mustache) template like this:"
  - "[PAGE 109]\n\n```\n<html>\n<head>\n  <title>{{page_title}}</title>\n</head>\n\
    <body>\n  {content}\n</body>\n</html>\n```\n\ncombined with context data like\
    \ this:\n\n```\nvar context = {\n  page_title: 'Templating is fun!',\n  content:\
    \ '<h1>Hello world!</h1>'\n}\nreturn reply.view('index', context);\n```\n\nwill\
    \ return HTML output like this:\n\n```\n<html>\n<head>\n  <title>Templating is\
    \ fun!</title>\n</head>\n<body>\n  <h1>Hello world!</h1>\n</body>\n</html>\n```\n\
    \nUsing a template, data can quickly be added, moved around, or removed entirely.\
    \ The work can be split up - designers work on templates while developers supply\
    \ contexts. Templates can easily be swapped out as part of a redesign or conditionally\
    \ (show user X design if their settings specify a preference; otherwise, V).\n\
    \nSo, a template system is less tedious and far more flexible to use than the\
    \ alternative.\n\n# Configuration\n\nIn hapi, views must be configured before\
    \ they can be used. Views must know what engine(s) to run and where to find files\
