  md: "\n# poop\n\nIn line with hapi's goal of being silly, poop is a plugin for doing\
    \ a process dump on exceptions. It provides a heapdump (https://www.npmjs.com/package/heapdump)\
    \ and a log file will also be provided containing additional details for debugging.\n\
    \n# More plugins\n\nYou can find a large list of plugins at hapijs.com under Plugins.\n\
    \n# Summary\n\nOften hapi plugins started as being part of the core project. As\
    \ the project grew, many sections of hapi were broken into their own plugins.\
    \ This happened for a variety of reasons. It helps keep things small and manageable.\
    \ It can be useful to reuse for other applications. It can also be useful to separate\
    \ out responsibilities between large teams.\n\nWriting plugins can also drive\
    \ the design in hapi applications. They keep it easy to manage the application\
    \ and allow for configuration-driven servers. We've shown you how they are and\
    \ how to use options to keep your configurations manageable and flexible.\n\n\
    Next, we will utilize some of the hapi authentication plugins described above\
    \ and explain how to utilize hapi for your authentication needs.\n\nFrom the beginning,\
    \ authentication has been front and center in hapi. A robust application framework\
    \ must consider authentication for any useful adoption to take place. There are\
    \ a large number of authentication strategies that now exist for hapi. One of\
    \ the nice things about the approach that hapi takes to authentication is that\
    \ while it's central to the framework itself, the strategies are expected to be\
    \ provided by external modules. Even to support basic authentication, an external\
    \ module needs to be installed. As a result, there are many options, some competing,\
    \ which are available to hapi developers.\n\n# Chapter Overview\n\nThe following\
    \ chapter will cover many details on authentication in hapi. Specifically, the\
    \ following plugins will be covered.\n\n- hapi-auth-basic\n- hapi-auth-cookie\n\
    - bell (with hapi-auth-cookie)\n\n# Scheme vs strategy\n\nIt can be a bit confusing\
    \ when talking about authentication on what the difference is between a scheme\
    \ and a strategy.\n\nYou can think of a scheme as a general auth type like basic\
    \ or digest. A strategy is a preconfigured and named instance of the scheme. Another\
    \ way to think about it is an authentication strategy sets how to authenticate\
    \ technically/mechanically. The strategy can be third party OAuth strategy, a\
    \ db, cookies, basic, or any custom one you can think of. We rely on authentication.\
    \ An authentication scheme sets up who is authenticating. The scheme could be\
    \ an admin, user, or custom thing.\n\nComing up, we will talk about the hapi-auth-basic\
    \ plugin. The strategy for this is simple and it uses the basic scheme to implement\
    \ it. It is simple because it is just a simple object. When you register the hapi-auth-basic\
