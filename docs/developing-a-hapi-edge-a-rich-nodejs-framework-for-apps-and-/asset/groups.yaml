  - "[PAGE 48]\n\n# Organizing handlers\n\nThere are many ways to organize code. For\
    \ simple routes, perhaps it makes sense to throw everything in a route. Here is\
    \ the simplest example:\n\n```\nserver.route({\n  method: 'GET',\n  path: '/',\n\
    \  handler: function (request, reply) {\n    reply.view('index');\n  }\n});\n\
    ```\n\nHowever, when working on large projects, we have found that it can get\
    \ cluttered to do this way. This is where we use the route configuration (see\
    \ Chapter 3) to make life easier for us.\n\nWe have organized the code into /lib/routes.js,\
    \ which is our destination for all of our routes. Whenever we add a new route,\
    \ or need to see the routes, we have all in this one simple location. A nice convention\
    \ to follow. It doesn't have to be a routes.js file, we could also put them in\
    \ lib/index.js. This clearly named file, however, makes it obvious to everyone\
    \ where it is.\n\nA typical setup has the config for the route living in a completely\
    \ different file instead, and in that file is where the handler resides.\nour\
    \ hapi-plugins.com example, has only this in the routes file:\n\n```\nserver.route({\n\
    {\n  method: 'GET',\n  path: '/',\n  config: Controllers.Home.get\n},\n// ...\n\
    });\n```\n\nWhen architected correctly the handlers are large, putting each route\
    \ in their own file can really make the code easier to read. Starting a new route,\
    \ a file with conventions can be copied over and the handler itself modified.\
    \ It makes for a very clear and easy to read structure.\n\nMore discussion on\
    \ the above example can be found in Chapter 6 if you want more details."
  - "[PAGE 49]\n\n# Built-in handlers\n\n# File\n\nFile handlers are used to generate\
    \ static endpoints for serving up files. You are likely to use this with single\
    \ files that don't fit in the directory handler explained shortly.\n\nWe are using\
    \ the file handler to serve up the favicon, or the little specific icon that browsers\
    \ use to associate a website.\n\nWe add the favicon to our lib/routes.js file\
    \ as follows:\n\n```\n```javascript{\n  method: 'GET',\n  path: '/favicon.ico',\n\
    \  handler: Controllers.Static.favicon\n}\n```\n```\n\nThere are multiple ways\
    \ of using the file handler, all of which involve modifying lib/controllers/handlers/static.js\
    \ in our particular setup.\n\n# STRING\n\nThis is how we're using the handler\
    \ for hapi-plugins.com and is the most straight-forward approach.\n\n```\n```javascript{\n\
    exports.favicon = {\n  file: dirname + '../../public/favicon.ico'\n};\n```\n```\n\
    \n# CALLBACK\n\nA callback takes the request object as an argument that returns\
    \ the absolute or relative path.\n\n```\n```javascript{\nexports.favicon = {\n\
    \  file: function (request) {\n    return dirname + '../../public/favicon.ico'\n\
    \  }\n};\n```\n```\n\n# OBJECT\n\nAn object with several options."
  - "[PAGE 50]\n\n```\nexports.favicon = {\n  file: {\n    // a path string or function\
    \ as described above\n    path: __dirname + '/../../public/favicon.ico',\n   \
    \ filename: '??',\n    mode: false,\n    lookupCompressed: false\n  }\n};\n```\n\
    \nOur path indicates where to find the file to serve up. This can also be set\
    \ to the callback function as discussed above.\n\nThe filename is an optional\
    \ filename to specify if spending a \"Content-Disposition\" header. This defaults\
    \ to the basename of the path.\n\nMode specifies whether or not the \"Content-Disposition\"\
    \ will be included. By default this is set to false, which means it's not included.\n\
    \nlookupCompressed, if true, looks for the same filename with the '.gz' suffix\
    \ for a precompressed version of the file to serve if the request supports content\
    \ encoding. It defaults to false.\n\n# DIRECTORY\n\nA more likely use-case than\
    \ the file handler is the directory to serve up multiple files. It is common in\
    \ order to serve files as images, CSS or JavaScript files used for the front-end.\n\
    \nSimilar to our file handler, the route is set up in lib/routes.js and in this\
    \ case, we're doing images and CSS as follows:\n\n```\n{ method: 'GET', path:\
    \ '/css/{path}', handler: Controllers.Static.css },\n{ method: 'GET', path: '/img/{path}',\
    \ handler: Controllers.Static.img },\n{ method: 'GET', path: '/js/{path}', handler:\
    \ Controllers.Static.js },\n// ...\n```\n\nThe handler is defined in a way that's\
    \ so similar that we're only going to look at the first one as an example:\n\n\
    ```\nexports.css = {\n  directory: {\n    path: __dirname + '/../../public/css',\n\
    \    index: false\n  }\n};\n```"
  - "[PAGE 51]\n\n# CHAPTER 4: The handler\n\nThe path is where the actual data is\
    \ we'd like to retrieve and display. There's a num-ber of options that can be\
    \ set here as well.\n\nWe're first and foremost setting index to false. There\
    \ shouldn't be any need to serve up any index.html in a CSS folder.\n\nThe options\
    \ for directory are as follows:\n\n+   - path - See handler for an explanation\
    \ of the various ways of setting this.\n- index - Can be true, false, or a string\
    \ representing the name of the index file to look for the default index file is\
    \ index.html and it is set to true.\n- listing - Determines whether a directory\
    \ should show in the absence of an index. Defaults to false.\n- showHidden - Determines\
    \ if hidden files should be displayed by the listing. Defaults to false.\n- redirectToSlash\
    \ - if there's a trailing slash, this will be redirected to the path without the\
    \ slash.\n- lookupCompressed - If true, it for the same filename with the '.gz'\
    \ suffix for a pre-compressed version of the file to serve if the request supports\
    \ content en-coding. Defaults to false.\n- defaultExtension - A string that is\
    \ appended to file requests if the requested file is not found. Defaults to empty\
    \ string.\n\n# VIEWS HANDLER\n\nThe views handler displays information using templates.\
    \ In practice, this option isn't very commonly used. The more common approach\
    \ is configuring the server with the views op-tion, and then using the regular\
    \ handler for reply.views().\n\nBecause hapi supports both, we'll take a look\
    \ at the views handler, and focus more on how to configure the server to directly\
    \ support views with reply.views().\n\nFor our hapi-plugins project, we're not\
    \ using a views handler, but it should be men-tioned how it can use. This may\
    \ serve as a case for whatever reason, the regular views.views to be overridden.\n\
    \nIn both cases, the server is configured with a views manager.\n\n```\nplugin.views({\n\
    \  engines: {\n    module: require('handlebars')\n  },\n  path: __dirname + '/views'\n\
    });\n```\n\n52"
  - "[PAGE 52]\n\nWe're setting the rendering engine and specifying the relative path\
    \ from which we will be reading the templates. The property in the engines configuration\
    \ sets the file extension that will be used for that particular rendering engine.\n\
    A very basic use-case world would look like the following:\n\n```\nexports.terms_of_service\
    \ = {\n  view: 'terms_of_service'\n}\n```\n\nHere view just takes a string with\
    \ the template filename.\nWhere we'd want to override the server's views configuration,\
    \ it would be more elaborate-rate with the view taking an object:\n\n```\nexports.terms_of_service\
    \ = {\n  view: {\n    template: 'terms_of_service',\n    context: {\n      serviceType:\
    \ 'provider'\n    }\n  }\n}\n```\n\nFor a quick point of clarity, context is the\
    \ json object with the actual data that is sent to your template. In this case,\
    \ your template terms_of_service can refer to serviceType in your template and\
    \ it will fill in the value provider. More discussion on templating is in Chapter\
    \ 9, and depending on the templating engine, this syntax will differ.\n\nIf there's\
    \ no context passed to the object, then it's set to a context object with the\
    \ following properties:\n\n+   - payload - containing request.payload\n- params\
    \ - containing request.params\n- query - containing request.query\n- pre - containing\
    \ request.pre\n\nThe view object can also contain an options property, which can\
    \ serve to override the server view settings.\n\n# REGULAR HANDLER USING SERVER.VIEWS\n\
    \nUsing reply.view() is the most common way to render a template.\nFor the main\
    \ page of hapi-plugins, we're rendering just an index file and we're displaying\
    \ a random quote on the page."
  - "[PAGE 53]\n\n# CHAPTER 4: The handler\n\n```\nmodule.exports.get = {\n  handler:\
    \ function (request, reply) {\n\n    reply.view('index', {\n      finalmsg: internals.quotes[Math.floor(Math.random()\
    \ *internals.quotes.length)]\n    });\n  }\n};\n```\n\nAnd in the template we\
    \ see the following:\n\n```\n<div id=\"finalfrontier\" class=\"col-md-12\">\n\
    \  {{finalmsg}}\n</div>\n```\n\nIf you would like to know more about handlebars,\
    \ you can read more at: handlebarsjs.com.\n\n# proxy\n\nMany starting out with\
    \ a proxy can be an easy way to start in a project. You have some legacy service\
    \ that you want to replace, and a proxy can be a good way to start. In fact, the\
    \ proxy feature was the most heavily used feature of hapi. This is precisely how\
    \ we started to use hapi at WalmartLabs. Below is an example of how you could\
    \ proxy Google.\n\n```\nserver.route({\n  method: '*',\n  path: '/path*',\n  config:\
    \ {\n    handler: {\n      proxy: {\n        host: 'google.com',\n        port:\
    \ 80,\n        protocol: 'http',\n        // 6th redirect get a 300 redirect\n\
    \        redirects: 5,\n        passThrough: true,\n        xforward: true\n \
    \     }\n    }\n  }\n});\n```\n\nWe use a * wildcard for the method. This will\
    \ match any method that comes in. The path setting simply says to route everything.\
    \ Finally, in the config section under handler, we have our proxy. You can see\
    \ we are setting the proxy up for google.com. The re-"
  md: "\n# Organizing handlers\n\nThere are many ways to organize code. For simple\
    \ routes, perhaps it makes sense to throw everything in a route. Here is the simplest\
    \ example:\n\n```javascript\nserver.route({\n  method: 'GET',\n  path: '/',\n\
    \  handler: function (request, reply) {\n    reply.view('index');\n  }\n});\n\
    ```\n\nHowever, when working on large projects, we have found that it can get\
    \ cluttered to do this way. This is where we use the route configuration (see\
    \ Chapter 3) to make life easier for us.\n\nWe have organized the code into /lib/routes.js,\
    \ which is our destination for all of our routes. Whenever we add a new route,\
    \ or need to see the routes, we have all in this one simple location. A nice convention\
    \ to follow. It doesn't have to be a routes.js file, we could also put them in\
    \ lib/index.js. This clearly named file, however, makes it obvious to everyone\
    \ where it is.\n\nA typical setup has the config for the route living in a completely\
    \ different file instead, and in that file is where the handler resides. Our hapi-plugins.com\
    \ example, has only this in the routes file:\n\n```javascript\nserver.route({\n\
    \  method: 'GET',\n  path: '/',\n  config: Controllers.Home.get\n},\n// ...\n\
    });\n```\n\nWhen architected correctly the handlers are large, putting each route\
    \ in their own file can really make the code easier to read. Starting a new route,\
    \ a file with conventions, can be copied over and the handler itself modified.\
    \ It makes for a very clear and easy to read structure.\n\nMore discussion on\
    \ the above example can be found in Chapter 6 if you want more details.\n\n# Built-in\
    \ handlers\n\n## File\n\nFile handlers are used to generate static endpoints for\
    \ serving up files. You are likely to use this with single files that don't fit\
    \ in the directory handler explained shortly.\n\nWe are using the file handler\
    \ to serve up the favicon, or the little specific icon that browsers use to associate\
    \ a website.\n\nWe add the favicon to our lib/routes.js file as follows:\n\n```javascript\n\
    {\n  method: 'GET',\n  path: '/favicon.ico',\n  handler: Controllers.Static.favicon\n\
    }\n```\n\nThere are multiple ways of using the file handler, all of which involve\
    \ modifying lib/controllers/handlers/static.js in our particular setup.\n\n###\
    \ STRING\n\nThis is how we're using the handler for hapi-plugins.com and is the\
    \ most straight forward approach.\n\n```javascript\nexports.favicon = {\n  file:\
    \ dirname + '../../public/favicon.ico'\n};\n```\n\n### CALLBACK\n\nA callback\
    \ takes the request object as an argument that returns the absolute or relative\
    \ path.\n\n```javascript\nexports.favicon = {\n  file: function (request) {\n\
    \    return dirname + '../../public/favicon.ico'\n  }\n};\n```\n\n### OBJECT\n\
    \nAn object with several options.\n\n```javascript\nexports.favicon = {\n  file:\
    \ {\n    // a path string or function as described above\n    path: __dirname\
    \ + '/../../public/favicon.ico',\n    filename: '??',\n    mode: false,\n    lookupCompressed:\
    \ false\n  }\n};\n```\n\nOur path indicates where to find the file to serve up.\
    \ This can also be set to the callback function as discussed above.\n\nThe filename\
    \ is an optional filename to specify if sending a \"Content-Disposition\" header.\
    \ This defaults to the basename of the path.\n\nMode specifies whether or not\
    \ the \"Content-Disposition\" will be included. By default this is set to false,\
    \ which means it's not included.\n\nlookupCompressed, if true, looks for the same\
    \ filename with the '.gz' suffix for a precompressed version of the file to serve\
    \ if the request supports content encoding. It defaults to false.\n\n### DIRECTORY\n\
    \nA more likely use-case than the file handler is the directory to serve up multiple\
    \ files. It is common in order to serve files as images, CSS or JavaScript files\
    \ used for the front-end. Similar to our file handler, the route is set up in\
    \ lib/routes.js and in this case, we are doing images and CSS as follows:\n\n\
    ```javascript\n{ method: 'GET', path: '/css/{path}', handler: Controllers.Static.css\
    \ },\n{ method: 'GET', path: '/img/{path}', handler: Controllers.Static.img },\n\
    { method: 'GET', path: '/js/{path}', handler: Controllers.Static.js },\n// ...\n\
    ```\n\nThe handler is defined in a way that we are only going to look at the first\
    \ one as an example:\n\n```javascript\nexports.css = {\n  directory: {\n    path:\
    \ __dirname + '/../../public/css',\n    index: false\n  }\n};\n```\n\nThe path\
    \ is where the actual data we would like to retrieve and display. There is a number\
    \ of options that can be set here as well. We are first foremost setting index\
    \ to false. In the folder, the options for directory are as follows:\n\n- path\
    \ - See handler for an explanation of the various ways of setting this\n- index\
    \ - Can be true, false, or a string representing the name of the index file and\
    \ it is set to true.\n- listing - Determines whether a directory should show in\
    \ the absence of an index. Defaults to false.\n- showHidden - Determines if hidden\
    \ files should be displayed by listing. Defaults to false.\n- redirectToSlash\
    \ - if there's a trailing slash, this will be redirected without the slash.\n\
    - lookupCompressed - If true, looks for the same filename with the '.gz' suffix\
    \ for a precompressed version of the file to serve if the request supports content\
    \ encoding. Defaults to false.\n- defaultExtension - a string that is appended\
    \ to the file if the requested file is not found. Defaults to empty string.\n\n\
    # VIEWS HANDLER\n\nThe views handler displays templates. In practice, this option\
    \ isn't very used. The more common approach is configuring the server with the\
    \ views option, and then using the regular handler for reply.views(). Because\
    \ hapi supports both, we'll take a look at the views handler and focus more on\
    \ how to configure the server directly with reply.views(). For our hapi-plugins\
    \ project, we are not using a views handler, but it should be mentioned how it\
    \ can use. In both cases, the server is configured with views:\n\n```javascript\n\
    plugin.views({\n  engines: {\n    module: require('handlebars')\n  },\n  path:\
    \ __dirname + '/views'\n});\n```\n\nWe are setting the rendering engine and specifying\
    \ the relative path from which we will be reading the templates. The property\
    \ in engines configuration sets the file extension that will be used for that\
    \ particular rendering engine. A very basic use-case would look like the following:\n\
    \n```javascript\nexports.terms_of_service = {\n  view: 'terms_of_service'\n}\n\
    ```\n\nHere view just takes a string with the template filename. Where we would\
    \ want to override the server's views configuration, it would be more elaborate\
    \ with the view taking an object:\n\n```javascript\nexports.terms_of_service =\
    \ {\n  view: {\n    template: 'terms_of_service',\n    context: {\n      serviceType:\
    \ 'provider'\n    }\n  }\n}\n```\n\nFor a quick point of clarity, context is the\
    \ json object with the actual data that is sent to your template. In this case,\
    \ your template terms_of_service can refer to serviceType in your template and\
    \ it will fill in the value. More discussion on templating is in Chapter 9, and\
    \ depending on the templating engine, this syntax will differ.\n\nIf there's no\
    \ context passed to the object, then it is set to a context object with the following\
    \ properties:\n\n- payload - containing request.payload\n- params - containing\
    \ request.params\n- query - containing request.query\n- pre - containing request.pre\n\
    \nThe view object can also contain an options property, which can serve to override\
    \ the server view settings.\n\n# REGULAR HANDLER USING SERVER.VIEWS\n\nUsing reply.view()\
    \ is the most common way to render a template. For the main page of hapi-plugins,\
    \ we are rendering just an index file and we're displaying a random quote on the\
    \ page.\n\n```javascript\nmodule.exports.get = {\n  handler: function (request,\
    \ reply) {\n    reply.view('index', {\n      finalmsg: internals.quotes[Math.floor(Math.random()\
    \ * internals.quotes.length)]\n    });\n  }\n};\n```\n\nAnd in the template we\
    \ see the following:\n\n```html\n<div id=\"finalfrontier\" class=\"col-md-12\"\
    >\n  {{finalmsg}}\n</div>\n```\n\nIf you would like to know more about handlebars,\
    \ you can read more at: handlebarsjs.com.\n\n# proxy\n\nMany starting out with\
    \ a proxy can be an easy way to start in a project. You have some legacy service\
    \ that you want to replace, and a proxy can be a good way to start. In fact, the\
    \ proxy feature was the most heavily used feature of hapi. This is precisely how\
    \ we started to use hapi at WalmartLabs. Below is an example of how you could\
    \ proxy Google.\n\n```javascript\nserver.route({\n  method: '*',\n  path: '/path*',\n\
    \  config: {\n    handler: {\n      proxy: {\n        host: 'google.com',\n  \
    \      port: 80,\n        protocol: 'http',\n        // 6th redirect get a 300\
    \ redirect\n        redirects: 5,\n        passThrough: true,\n        xforward:\
    \ true\n      }\n    }\n  }\n});\n```\n"
  mdcn: "\n\n# 组织处理器 (handlers)\n\n组织代码有许多方法。对于简单的路由，或许将所有内容都写在路由中是合理的。这里有一个最简单的示例：\n\
    \n```javascript\nserver.route({\n  method: 'GET',\n  path: '/',\n  handler: function\
    \ (request, reply) {\n    reply.view('index');\n  }\n});\n```\n\n然而，在开发大型项目时，我们发现这种方法会让代码变得杂乱。这时，我们使用路由配置（参见第\
    \ 3 章）来让工作变得更轻松。\n\n我们将代码组织在 `/lib/routes.js` 中，这是我们所有路由的汇集地。每当我们添加新路由或需要查看路由时，都可以在这一个简单的地方找到所有内容。这是一个很好的遵循的约定。它不非得是一个\
    \ `routes.js` 文件，我们也可以将其放在 `lib/index.js` 中。不过，这个命名清晰的文件让每个人一目了然知道它的位置。\n\n典型的设置是将路由配置放在一个完全不同的文件中，而处理器则位于该文件中。我们的\
    \ hapi-plugins.com 示例中，路由文件中仅包含以下内容：\n\n```javascript\nserver.route({\n  method:\
    \ 'GET',\n  path: '/',\n  config: Controllers.Home.get\n},\n// ...\n});\n```\n\
    \n当架构设计合理且如果处理器很大时，将每个路由放在单独的文件中确实可以让代码更易读。开始一个新路由时，可以复制一个符合约定的文件并修改处理器本身。这形成了一个非常清晰且易读的结构。\n\
    \n如果你想了解更多细节，可以在第 6 章找到关于上述示例的更多讨论。\n\n# 内置处理器 (Built-in handlers)\n\n## 文件 (File)\n\
    \n文件处理器用于生成静态端点以提供文件。你可能会将它用于不适合后文介绍的目录处理器的单个文件。\n\n我们正在使用文件处理器来提供 favicon，即浏览器用于关联网站的特定小图标。\n\
    \n我们按照如下方式将 favicon 添加到 `lib/routes.js` 文件中：\n\n```javascript\n{\n  method: 'GET',\n\
    \  path: '/favicon.ico',\n  handler: Controllers.Static.favicon\n}\n```\n\n使用文件处理器有多种方法，在我们特定的设置中，所有方法都涉及修改\
    \ `lib/controllers/handlers/static.js`。\n\n### 字符串 (STRING)\n\n这是我们在 hapi-plugins.com\
    \ 中使用处理器的方式，也是最直接的方法。\n\n```javascript\nexports.favicon = {\n  file: dirname +\
    \ '../../public/favicon.ico'\n};\n```\n\n### 回调 (CALLBACK)\n\n回调函数接受请求对象作为参数，并返回绝对或相对路径。\n\
    \n```javascript\nexports.favicon = {\n  file: function (request) {\n    return\
    \ dirname + '../../public/favicon.ico'\n  }\n};\n```\n\n### 对象 (OBJECT)\n\n包含多个选项的对象。\n\
    \n```javascript\nexports.favicon = {\n  file: {\n    // 如上所述的路径字符串或函数\n    path:\
    \ __dirname + '/../../public/favicon.ico',\n    filename: '??',\n    mode: false,\n\
    \    lookupCompressed: false\n  }\n};\n```\n\n我们的路径指示了要提供文件的位置。也可以如上所述，设置为回调函数。\n\
    \nfilename 是可选的文件名，用于指定是否发送 \"Content-Disposition\" 头部。默认是路径的基名 (basename)。\n\n\
    mode 指定是否包含 \"Content-Disposition\"。默认设置为 false，意味着不包含。\n\nlookupCompressed 如果为\
    \ true，则在请求支持内容编码时，会查找带有 '.gz' 后缀的相同文件名，以提供预压缩的文件。默认为 false。\n\n### 目录 (DIRECTORY)\n\
    \n相比文件处理器，更常见的用例是使用目录来提供多个文件。这通常用于提供作为前端使用的图像、CSS 或 JavaScript 文件。与我们的文件处理器类似，路由设置在\
    \ `lib/routes.js` 中，在这种情况下，我们如下所示处理图像和 CSS：\n\n```javascript\n{ method: 'GET',\
    \ path: '/css/{path}', handler: Controllers.Static.css },\n{ method: 'GET', path:\
    \ '/img/{path}', handler: Controllers.Static.img },\n{ method: 'GET', path: '/js/{path}',\
    \ handler: Controllers.Static.js },\n// ...\n```\n\n处理器的定义方式如下，我们只看第一个作为示例：\n\n\
    ```javascript\nexports.css = {\n  directory: {\n    path: __dirname + '/../../public/css',\n\
    \    index: false\n  }\n};\n```\n\npath 是我们想要检索并显示的实际数据所在。这里也可以设置许多选项。我们首先将 `index`\
    \ 设置为 false。在文件夹中，目录的选项如下：\n\n- path - 参见处理器以了解设置此内容的各种方式\n- index - 可以是 true、false，或者表示索引文件名的字符串，且被设置为\
    \ true。\n- listing - 决定在缺少索引的情况下是否应该显示目录。默认为 false。\n- showHidden - 决定是否通过列出显示隐藏文件。默认为\
    \ false。\n- redirectToSlash - 如果有尾部斜杠，将重定向到不带斜杠的。\n- lookupCompressed - 如果为 true，则在请求支持内容编码时，会查找带有\
    \ '.gz' 后缀的相同文件名，以提供预压缩的文件。默认为 false。\n- defaultExtension - 如果未找到请求的文件，则附加到文件末后的字符串。默认为空字符串。\n\
    \n# 视图处理器 (VIEWS HANDLER)\n\n视图处理器用于显示模板。在实践中，此选项并不常用。更常见的方法是使用 `views` 选项配置服务器，然后使用普通的处理器处理\
    \ `reply.views()`。由于 hapi 支持这两种，我们将查看视图处理器，并更多地关注如何通过 `reply.views()` 直接配置服务器。对于我们的\
    \ hapi-plugins 项目，我们没有使用视图处理器，但应该提到它是如何使用的。在两种情况下，服务器都配置了 views：\n\n```javascript\n\
    plugin.views({\n  engines: {\n    module: require('handlebars')\n  },\n  path:\
    \ __dirname + '/views'\n});\n```\n\n我们正在设置渲染引擎，并指定从哪里读取模板的相对路径。`engines` 配置中的属性设置了用于该特定渲染引擎的文件扩展名。一个非常基础的用例如下：\n\
    \n```javascript\nexports.terms_of_service = {\n  view: 'terms_of_service'\n}\n\
    ```\n\n在这里，`view` 接受一个带有模板文件名的字符串。当我们想要覆盖服务器的视图配置时，`view` 接收一个对象会更加复杂：\n\n```javascript\n\
    exports.terms_of_service = {\n  view: {\n    template: 'terms_of_service',\n \
    \   context: {\n      serviceType: 'provider'\n    }\n  }\n}\n```\n\n为了快速说明，`context`\
    \ 是发送到你的模板中包含实际数据的 JSON 对象。在这种情况下，你的模板 `terms_of_service` 可以引用模板中的 `serviceType`，并将将填充该值。关于模板的更多讨论在第\
    \ 9 章，并且取决于模板引擎，这种语法会有所不同。\n\n如果没有向对象传递 context，则它被设置为具有以下属性的 context 对象：\n\n\
    - payload - 包含 `request.payload`\n- params - 包含 `request.params`\n- query - 包含\
    \ `request.query`\n- pre - 包含 `request.pre`\n\n视图对象还可以包含一个 `options` 属性，用于覆盖服务器的视图设置。\n\
    \n# 使用 SERVER.VIEWS 的普通处理器 (REGULAR HANDLER)\n\n使用 `reply.view()` 是渲染模板的最常用方法。对于\
    \ hapi-plugins 的主页，我们正在渲染一个索引文件并在页面上显示随机引言。\n\n```javascript\nmodule.exports.get\
    \ = {\n  handler: function (request, reply) {\n    reply.view('index', {\n   \
    \   finalmsg: internals.quotes[Math.floor(Math.random() * internals.quotes.length)]\n\
    \    });\n  }\n};\n```\n\n在模板中我们看到内容：\n\n```html\n<div id=\"finalfrontier\" class=\"\
    col-md-12\">\n  {{finalmsg}}\n</div>\n```\n\n如果你想了解更多关于 handlebars 的信息，可以在这里阅读：handlebarsjs.com。\n\
    \n# 代理 (proxy)\n\n许多人从代理开始是启动项目的一种简单方式。你有一些想要替换的遗留服务，代理可以是一个很好的开始。事实上，代理功能是 hapi\
    \ 使用最频繁的功能。这正是我们在 WalmartLabs 开始使用 hapi 的方式。下面是一个关于你如何代理 Google 的示例：\n\n```javascript\n\
    server.route({\n  method: '*',\n  path: '/path*',\n  config: {\n    handler: {\n\
    \      proxy: {\n        host: 'google.com',\n        port: 80,\n        protocol:\
    \ 'http',\n        // 第 6 次重定向将获得 300 重定向\n        redirects: 5,\n        passThrough:\
    \ true,\n        xforward: true\n      }\n    }\n  }\n});\n```\n\n"
