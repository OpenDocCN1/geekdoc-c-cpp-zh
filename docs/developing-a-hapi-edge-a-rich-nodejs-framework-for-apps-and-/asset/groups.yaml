  mdcn: "\n\n# 选项\n\n在配置视图时，有三个主要的选项可以配置：引擎（engines）、编译模式（compileMode）和路径（paths）。在下一节中，我们将发现可能让您的视图正常工作所需的各种子选项。\n\
    \n## ENGINES\n\n`engines` 配置对象告诉视图要查找哪些扩展名以及应该使用哪种模板引擎。\n\n`engines` 对象期望将扩展名（不包含点\
    \ `.`）作为键，并将模板系统编译器作为值。下面的示例（\"engines-breakdown.js\"）将匹配任何 `filename.extension`\
    \ 并使用 `some_compiler` 引擎。\n\n```javascript\nengines: {\n  \"extension\": require('some_compiler')\n\
    },\n/* ... */\n```\n\n使用该系统，只要使用不同的文件扩展名，就可以混合使用不同的模板系统：\n\n```javascript\nvar\
    \ Hapi = require('hapi');\n\nvar server = new Hapi.Server();\nserver.views({\n\
    \  engines: {\n    html: require('mu'),\n    jade: require('jade'),\n    hbs:\
    \ require('handlebars')\n  },\n  defaultExtension: 'hbs',\n  path: __dirname +\
    \ '/views'\n});\n```\n\n如果您出于某种原因没有匹配模板引擎，您应该注意几点。如果您想使用 `reply.view('templateName',\
    \ context)` 语法，它需要理解默认扩展名是什么。在上面的示例中，您可以看到我们如何选择 `hbs` 作为该默认扩展名。此设置不是必须的。您可以直接添加扩展名，如\
    \ `reply.view('templateName', context)`。如果文件的扩展名不是您的 `defaultExtension`，则您需要为它提供扩展名。\n\
    \n# 第9 章：模板\n\n## COMPILEMODE 选项\n\n`compileMode` 选项用于告诉 hapi 期望一个同步模板引擎还是异步引擎。hapi\
    \ 期望引擎对象包含一个 `compile` 方法，该方法可以是格式化的的，但不能两者兼得。默认情况下，hapi 期望同步引擎。这是一个同步编译函数。\n\n\
    ```javascript\n{\n  compile: function (template, options) {\n    return function\
    \ (context, optionsOverride) {\n      // 返回与 context 整合的字符串模板\n    }\n  }\n}\n\
    ```\n\n接下来我们将以异步的方式执行相同的操作。\n\n```javascript\n{\n  compile: function (template,\
    \ options, callback) {\n    var error = null;\n    return callback(error, function\
    \ (context, optionsOverride, internalCallback) {\n      var output = ''; /* 设置与\
    \ context 整合的字符串模板 */\n      return internalCallback(null, output);\n    });\n\
    \  }\n}\n```\n\n根据模板引擎，您稍后会看到默认的 `compileMode` 可能需要覆盖为 `'async'`。\n\n## PATHS\n\
    \nhapi 视图需要知道去哪里查找模板文件。根据您的项目需求，有多种路径配置。\n\n- path：指向查找模板文件的主目录\n- partialsPath：指向查找部分模板（parts）的目录（如果引擎支持\
    \ Partials）\n- helpersPath：指向定义模板辅助函数的目录（如果引擎支持 Helpers）\n- layoutPath：包含布局模板的目录（通常为\
    \ `layout.{extension}` 或 `layout.html`）\n- relativeTo：用作其他目录的前缀路径（允许在其他路径中使用相对路径）\n\
    \n此外，还有两个可能重要的路径相关设置：\n\n- allowAbsolutePaths:（布尔值）允许在路径设置中使用绝对路径（默认：false）\n\
    - allowInsecureAccess:（布尔值）允许支持向上移动目录（使用 '..'）\n\n`allowInsecureAccess` 变量应极谨慎地使用。它允许用户访问服务器操作系统上的其他安全文件，例如带有敏感数据的密码文件等。\n\
    \n## 全局 VS 特定（GLOBAL VS SPECIFIC）\n\n所有的全局视图设置都可以应用于特定的单个模板引擎，该引擎将覆盖任何全局设置。这通常需要移动编译器对象：\n\
    \n```\nengines: {\n  compileMode: 'async',\n  engines: {\n    html:\n      module:\
    \ require('handlebars'),\n      compileMode: 'sync'\n    }\n  }\n  path: '/path'\n\
    }\n```\n\n## 更多选项\n\n更多选项在 API 文档中有详细说明。\n\n## 示例示例\n\n让我们从 Mustache.js 开始。\n\n\
