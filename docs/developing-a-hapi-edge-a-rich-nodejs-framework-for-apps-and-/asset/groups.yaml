    # Foreword


    # A framework that makes you happy


    From the very beginning, hapi was built around a simple philosophy—development
    should be fun. The role of a framework is to increase your productivity and step
    in when you want it, but step aside when you don''t. It should not mess around
    with your environment, nor should it take away any of the power available from
    the underlying platform. But importantly, the role of a framework is to establish
    a foundation for collaboration.


    Enterprise software development has earned the notoriety of a painful, bureaucratic,
    stale, and complicated process. What''s worse is that we have learned to accept
    it as the status quo. At the center of the problem is the fact that enterprise
    software development happens in large teams, often distributed organizationally
    and geographically, and require a significant amount of process to prevent one
    mistake from affecting the productivity of hundreds of developers, or worse affecting
    the business.


    When I started building hapi, I knew it had to be simple and easy to use, but
    hapi also includes a lot of features out-of-the-box that typically come from third-party
    tools, features like authentication, caching, etc.


    Four years in the project, the satisfaction of its community is still the greatest
    motivator and guide in moving the work forward. As it continues to mature, we
    learn more every day about how it is used and how we can evolve it; hapi is a
    dynamic.


    community and the project has a history of not being afraid to break things in
    order to make them better. We refuse to accept the status quo.


    I am excited you are taking the time to learn about hapi and consider it for your
    next project; hapi is a community and you are now part of.


    Eran Hammer


    July 2015


    # Preface


    # Why use hapi?


    "A rich framework for building applications and services hapi enables developers
    to focus on writing reusable logic instead of spending time building infrastructure."


    -- hapijs.com


    hapi is a web development framework designed for the rapid development of RESTful
    services APIs using JavaScript. While it is also simple and easy to use, hapi
    also includes a lot of features out-of-the-box that typically come from third-party
    tools, features like input validation, authentication, etc.


    Developers use hapi because it is easy to use, stable, robust, well-tested (and
    battled by WalmartLabs during Black Friday), and powerful. It is specifically
    designed to work in enterprise environments where multiple teams work on individual
    or overlapping pieces that connect together. hapi does this by enabling developers
    to focus on writing reusable, modular code without forcing them to do so in a
    narrowly defined way.


    # What should you know prior to reading this book?


    Readers should be comfortable with JavaScript, Node.js, and the design and implementation
    of basic websites and web applications.


    # Source code/sample app


    Throughout the book, we will be referencing code from our sample application:
    hapi-plugins.com. hapi-plugins.com is a searchable repository of hapi-related
    modules available on NPM. You can view the complete source code at https://github.com/hapijs-edge/hapi-plugins.com.
    You can see the completed application at https://hapi-plugins.com.

