  mdcn: "\n\n# 验证 5\n\n[hapi] 让我们的开发过程变得异常高效，并且是一个真正的“joi”。\n\n-- https://github.com/hapijs/hapi/issues/1613#issuecomment-46332030\n\
    Eran 在一条推文中提到，他对 hapi 在数据验证产生的影响感到自豪。它能够验证你的输入数据和输出数据是一件了不起的事情，而让这变得简单并成为框架中不可或缺的一部分，更是一件了不起。如果你在问为什么这是一件了不起，希望不是因为你是个怀疑论者，而是因为你单纯想知道。我们所使用的计算机在处理数据方面极其高效的。如果我们最终得到了错误的数据，无论你的计算机处理工作有多高效，或者它执行了什么计算，其实都不重要。从拥有正确数据的角度来看，这不仅很重要，对于由于缺少正确数据而产生的\
    \ bug 和其他错误也很重要；在动态语言中比任何其他语言都更为如此。预期一个数字却得到了一个字符串？那可能非常糟糕。\n\nhapi 最常用于验证的库被称为\
    \ joi。当第一个作者 Eran 在 WalmartLabs 使用 hapi 进行演示时，Eran 以一首关于 hapi 的歌曲开始了演示。事实上，如果你在\
    \ YouTube 上看，你可以找到这个演示（https://www.youtube.com/watch?v=Recv7v8RZIA）。那首歌是 hapi\
    \ joi 之歌。鉴于 hapi 和 joi 都在这首歌中，这可能让你了解 Eran 对质量以及确保所有数据都经过验证并处于我们可以安全操作的状态有何种感受。\n\
    \n在本章中，我们将介绍使用 joi 和不使用 joi 进行验证的各种位置。\n\n# 验证的类型\n\nhapi 为以下输入提供了验证：query（查询）、payload（负载）、headers（请求头）和\
    \ params（参数）。记得我们在第 4 章中学习过这些。此外，hapi 还允许我们对响应（response）进行验证。\n\n验证的格式始终如下：\n\n\
    - true - 不执行验证。\n\n# Joi 验证\n\n- false - 此部分不允许任何变量\n- Joi 验证对象。这是我们目前为止讨论的内容。\n\
    - 一个验证函数。\n\n我们最终工作时最典型的一种是使用 joi 验证对象，我们将重点关注它。验证函数也可以用于不符合常规 joi 验证的内容。\n\n\
    验证是作为传递给路由（route）的选项的一部分配置的。假设你想更改用户的密码。你想向端点发送一个包含 `password` 的 JSON 对象，并将密码更改为你指定的密码。该\
    \ JSON 对象看起来如下：\n\n```json\n{\n  \"password\": \"somepass\"\n}\n```\n\n然后你可以这样设置路由：\n\
    \n```javascript\nvar routeOptions = {\n  validate: Joi.object().keys({\n    params:\
    \ Joi.object().keys({\n      id: Joi.number()\n    }),\n    payload: Joi.object().required().keys({\n\
    \      password: Joi.string().min(8).required()\n    })\n  }),\n  response: {\n\
    \    schema: Joi.object().keys({\n      success: Joi.boolean().required()\n  \
    \  });\n  },\n  handler: handler\n}\nserver.route({\n  method: 'POST',\n  path:\
    \ '/user/(id)/password',\n  config: routeOptions\n});\n```\n\n我们在这里看到的是非常典型的用法。这确保了路径\
    \ URL 中的 id 将是一个数值。使用了 `params` 键，在我们的 `server.route` 中，`{id}` 被变成了这个参数。我们在服务器路由中的方法是\
    \ POST，这个 JSON 对象被翻译为 `payload` 对象。\n\n你可以看到验证是在 `payload` 上完成的。在 payload 中传递的密码是一个至少包含八个字符的字符串，并且是一个必填字段。此外，我们还告诉\
    \ hapi 预期响应是一个 `success` 值为 true 或 false 的 JSON 结构。\n\n你可能在问自己，为什么 `response`\
    \ 不在 `validate` 部分？`validate` 部分严格用于输入。当你配合 joi 使用 hapi 时，这可能并不明显。如果你的工作依赖于另一个\
    \ API，那么输出（响应）验证可能非常重要。输出验证让你有信心你正从那里获取正确的内容。\n\n正如你到为止在我们的代码中看到的，我们喜欢将一切拆分，并广泛使用\
    \ `config`。因为验证 schema 可能会变得很长，我们通常将验证规则放在 `internals` 变量中。\n\n`internals` 变量是存放文件中顶层变量的地方。这可以防止该作用范围的污染。在我们必须在多个不同的地方访问\
    \ schema 来处理验证时，这特别有用。下面的示例演示了这一点。\n\n```javascript\nvar internals = {\n  pluginSchema:\
    \ Joi.object().keys({\n});\n\n// 获取插件数据\nexports.get = {\n  description: 'get\
    \ plugin data for a specific plugin id',\n  response: {\n    schema: internals.pluginSchema\n\
    \  },\n  handler: function (request, reply) {\n    //\n    ...\n  }\n};\n```\n\
    \n# 为 hapi-plugins.com 的验证\n\n让我们来看看 hapi-plugins.com 的搜索函数。\n\n```javascript\n\
    module.exports.search = {\n  validate: {\n    query: {\n      q: Joi.string(),\n\
    \      sort: Joi.string().optional(),\n    }\n  },\n  fields: Joi.string().optional()\n\
    }\nresponse: {\n  schema: Joi.array().includes(Joi.object().keys({\n    name:\
    \ Joi.string().required(),\n    authors: Joi.array(),\n    keywords: Joi.array(),\n\
    \    dependencies: Joi.array(),\n    dependents: Joi.array(),\n    homepage: Joi.string().allow('\n\
    \    version: Joi.string(),\n    license: Joi.string(),\n    description: Joi.string(),\n\
    \  }))\n}\nhandler: function (request, reply) {\n  var query = null;\n  var sort\
    \ = null;\n  if (request.query.q) {\n    query = Xss(request.query.q);\n  }\n\
    \  if (request.query.sort) {\n    sort = Xss(request.query.sort);\n  }\n  DB.plugin.search(query,\
    \ sort, function (err, results) {\n    var converted = internals.convert(results);\n\
    \    return reply(converted);\n  });\n};\n```\n\n你在这里看到输入验证是在 `query` 上进行的。它期望\
    \ `q` 是字符串，`sort` 是可选的字符串。`fields` 也是可选的。在 `response` 中，通过 schema 确保数组中的每一项都符合要求：`name`\
    \ 是必填字符串，`authors`、`keywords`、`dependencies`、`dependents` 是数组，`homepage` 允许为空字符串，其他都是字符串。\n\
    \n我们可以安心地睡个好觉。\n\n# 使用 joi 进行通用数据验证\n\n我们不仅使用 joi 验证输入和输出，还在内部使用它来验证各种数据。假设我们正在调用外部服务，或者只是调用数据库。虽然我们的数据希望不会被导致错误的部分数据污染，但如果你依赖下游环节，谨慎并验证数据百无一害。\n\
    \n我们在这里花一些时间看看 joi 还提供什么。应该记住的一个属性是 joi 是可链的，这意味着你可以为自己创建快捷方式。\n\n假设你正在验证一个特定的字符串，可能是邮件\
    \ Joi.string().email() 或者更复杂的长字符串。你可以将 email 赋值一个较短的变量：\n\n```javascript\nvar\
    \ email = Joi.string().email() 并在到处使用它代替较长的版本。\n```\n\n作者正在处理列表：婚礼登记、烘焙登记等，并且必须确保每次发送的都是列表类型。这是所使用的验证：\n\
    \n```javascript\nJoi.string().insensitive().required().valid(['BR', 'SFL', 'WR',\
    \ 'WL']),\n```\n\n在这种情况下，我们不在乎大小写，但我们关心该字符串必须是不同的列表类型之一。否则，它是无效的。\n\n# 使用验证函数\n\
    \nJoi 是 hapi 验证的核心，但完全可以不使用 joi 进行验证。我们不再在路由选项中针对想要验证的特定部分使用 joi 签名，而是使用一个验证函数。\n\
    \n"
