  - "[PAGE 37]\n\n# CHAPTER 3: Routes\n\n```\npath: '/'\nconfig: Welcome.index\n);\n\
    ```\n\nThen the actual config for the route is in a corresponding file called\
    \ 'lib/controllers/welcome.js'.\n\n```\nmodules.export.index = {\n  description:\
    \ 'Show the main page for our welcome page',\n  handler: function (request, reply)\
    \ {\n    reply.view('index');\n  }\n};\n```\n\nThis keeps the code logically separated,\
    \ which is typical of a MVC (Model-View-Controller) framework. The logic in the\
    \ code can get quite extensive, and with this separation, it can be easily organized\
    \ so that all logic for a particular route is all in one file. You may decide\
    \ to go that route, which would be as simple as keeping that logic in a file lib/controllers/welcome/index.js\
    \ instead. Perhaps terms of service would be in lib/controllers/welcome/tos.js\
    \ under this structure. Of course, there has be some sense to how large a function\
    \ splits out into its own file. But the idea is that the code, when broken up\
    \ into smaller pieces, is far easier to manage and read.\n\n# Path processing\n\
    \nRoutes are unique. Several issues on GitHub have been opened asking about regular\
    \ expressions, or other types of globbing. It can be difficult to figure out when\
    \ routes overlap. One of the early design goals of hapi was to ensure that the\
    \ routing table would be identical each time it loaded. There would be no surprises.\
    \ When starting up, hapi will complain about any conflicts and protect you from\
    \ these types of issues.\n\nHow path processing works in hapi, the router iterates\
    \ through the routing table on each incoming request and executes the first (and\
    \ only matching) route. Route matching is done on the request path only (excluding\
    \ query and other URI components). The requests are matched in a deterministic\
    \ order, so it doesn't matter where you add them. Finally, the routes are sorted\
    \ from the most specific to the most generic. If you want further details, see\
    \ Path Matching Order.\n\n# Parts of the route\n\nA route object, the argument\
    \ to server.route() consists of just a few easy properties."
  - "[PAGE 38]\n\n# method\n\nThis determines the HTTP request method to be performed\
    \ on the resource. The method will be one of the following: GET HEAD POST PUT\
    \ DELETE TRACE OPTIONS CONNECT PATCH. In practice, it will likely be one of GET,\
    \ POST, PUT, DELETE or PATCH, and HEAD is not allowed. hapi allows wildcard methods\
    \ to be used, which means that when the exact match isn't found, it will use the\
    \ wildcard instead. The wildcard string is *.\n\n# vhost\n\nSpecify, this is a\
    \ virtual host for this route to listen to. A server can be listening to more\
    \ than one virtual host, but in order the route to be triggered for one particular\
    \ host, it can specify the host to listen to. This way, the server can serve up\
    \ the route depending on the vhost defined. The vhost can be defined as either\
    \ a string or an array of strings. The default is to allow any host to use the\
    \ route.\n\n# handler\n\nThe handler is a function that returns the output from\
    \ the route that has been called. It is contingent on the validation and any authentication\
    \ that precedes it. If the handler is defined via the server, then an object with\
    \ the property for the name of the handler, as well as any options, can be passed.\
    \ For a deep dive into the intricacies of the handler, see Chapter 4.\n\n# config\n\
    \nIf need additional configuration for your route, you can use the config section\
    \ to define those. For a simple app, you may not need to specify additional configuration,\
    \ this isn't strictly required. However, for more complex configurations, it is\
    \ better to organize your code under this structure. You move your handler to\
    \ this section so that your configuration is all organized in the same location.\
    \ An example of a more complex configuration is if you want to add validation\
    \ or caching.\n\nIt is important to note that caching here is different than the\
    \ server.cache that was discussed in Chapter 2. That functionality caches actual\
    \ response objects. Caching in this section, is strictly caching. It will set\
    \ the Cache-Control header. Below is a trivial example where it will set a cache\
    \ header for our hour or /hello route.\n\n```\nserver.route({\n  method: 'GET',\n\
    \  path: '/hello',\n  config: {\n    handler: handler,\n});\n```"
