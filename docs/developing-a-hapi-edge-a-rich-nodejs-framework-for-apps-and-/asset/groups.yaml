    \ username and password is basic authentication. It's not much more secure than\
    \ a username and password being passed in the clear, but it does serve a purpose\
    \ for some internal applications. Aside from that usefulness that may or not exist,\
    \ it make for a simple starting point in understanding hapi authentication.\n\n\
    In the early days of Chapter 6, the basic authentication scheme was baked into\
    \ the module itself. Hapi has evolved and as authentication grew, so we needed\
    \ to split hapi up into plugins. You will need to install the hapi-auth-basic\
    \ plugin in hapi to get any basic authentication support in hapi.\n\nFor any authentication\
    \ to support it, you must first have a scheme registered with the server. The\
    \ scheme is the heart of authentication that will take place. In the case of hapi-auth-basic\
    \ the scheme is registered when the plugin itself is registered. The only thing\
    \ to do is to declare an authentication strategy that will use the scheme. It\
    \ will become more obvious later, when bell is discussed, but strategies help\
    \ hapi be an extremely flexible framework because it can support multiple strategies.\n\
    \nBelow demonstrates how to register the hapi-auth-basic plugin and set it up\
    \ as a strategy:\n\n```\nvar Hapi = require('hapi');\nvar Basic = require('hapi-auth-basic');\n\
    \nvar server = new Hapi.Server();\nserver.connection({ port: 3000 });\n\nserver.register(Basic,\
    \ function (err) {\n  server.auth.strategy('simple', 'basic', { validateFunc:\
    \ validateId });\n});\n```\n\nAfter an authentication strategy is in place, it\
    \ can be used by individual routes that expect authentication. If you expect all\
    \ routes to have a certain strategy, you can pass an option when declaring the\
    \ strategy for mode and set the mode to required.\n\n# hapi-auth-basic\n\nAnother\
    \ option is to try, which means to try to authenticate if credentials are provided,\
