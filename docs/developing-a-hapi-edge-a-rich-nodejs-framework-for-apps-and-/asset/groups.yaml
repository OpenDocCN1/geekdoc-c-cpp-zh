  mdcn: "\n\n# 第8 章：模型\n\n```javascript\ninternals.plugin.statics = function (queryString,\
    \ sortString, callback) {\n  var query = {};\n  if (queryString && queryString.length\
    \ > 0) {\n    var pattern = new RegExp(queryString, 'ig');\n    query = {\n  \
    \    '$or': [\n        ('name': pattern),\n        ('description': pattern),\n\
    \        ('author': pattern),\n        ('authors': {\n          '$regex': pattern\n\
    \        }),\n        ('keywords': {\n          '$regex': pattern\n        })\n\
    \      ]\n    };\n  }\n  var sortOrder = 1;\n  var sortBy = sortString || 'name';\n\
    \  if (sortBy[0] === '-') {\n    sortOrder = -1;\n    sortBy = sortBy.slice(1);\n\
    \  }\n  var sort = {};\n  sort[sortBy] = sortOrder;\n  return this.find(query).sort(sort).exec(callback);\n\
    }\n```\n\n上面的搜索函数包含了许多操作。第一个函数接受两个重要的参数和一个用于发送结果的回调函数。\n第一个参数是用户输入的查询。我们获取该查询并与所有相关字段进行匹配：名称、描述、作者、作者和关键词。\n\
    第二个参数决定排序顺序。当我们从数据库获取结果时，它必须知道返回什么（按升序还是降序，以及按什么字段排序）。我们使用的约定是 \"-name\" 表示按名称降序，使用减号\
    \ \"-\" 表示升序。如果 `sortString` 为 `null`，我们默认按名称升序。\n我们获取这两个参数并在数据库上执行 `find` 查询。\n\
    现在，回到控制器中，我们定义了一个搜索处理程序来使用我们新的数据库搜索方法。在这个处理器中，我们还将对输入进行验证和清理，以确保没有输入无效或恶意的输入。\n\
    \n```javascript\nmodule.exports.search = {\n  validate: {\n    query: {\n    \
    \  q: Joi.string(),\n      sort: Joi.string().optional(),\n      fields: Joi.string().optional(),\n\
    \    },\n\n    handler: function (request, reply) {\n      var query = null;\n\
    \      var sort = null;\n      if (request.query.q) {\n        query = Xss(request.query.q);\n\
    \      }\n      if (request.query.sort) {\n        sort = Xss(request.query.sort);\n\
    \      }\n      DB.plugin.search(query, sort, function (err, results) {\n    \
    \    if (err) {\n          return reply({status:-1, error: err}).code(500);\n\
    \        }\n        return reply(JSON.stringify(results, null, 2));\n      });\n\
    \    },\n};\n```\n\n在搜索处理程序中，我们像在第5章“验证”中所示那样对查询参数设置了验证规则。上面显示的新约定涉及 `Xss` 模块。该模块通过转义\
    \ HTML 实体和其他潜在的恶意手段来清理输入。你将在后的第12章“安全”中学习更多内容。\n在对输入进行验证和清理后，我们将此请求传递给模型的搜索函数。在回调内部，如果返回了错误，我们将返回一个良好的\
    \ JSON 错误消息。但如果成功，我们将返回一个格式化的 JSON 响应。\n这就是我们允许用户搜索我们的插件仓库的方法。但里面现在什么都没有！\n\n\
    # 添加插件\n\n为了搜索插件，我们需要一个包含实际插件及其数据的数据库。获取匹配的 NPM 模块列表之前已经介绍过。现在，我们需要向数据库中添加单个插件的能力。\n\
    \n```javascript\ninternals.plugin.statics.createOrUpdate = function (pluginJS,\
    \ callback) {\n  var self = this;\n  var pluginObj = internals.pluginJSToObj(pluginJS);\n\
    \  self.update({ name: pluginObj.name }), pluginObj, function\n  (err, numberAffected,\
    \ raw) {\n    if (numberAffected === 0) {\n      var plugin = new self(pluginObj);\n\
    \      return plugin.save(callback);\n    }\n    return callback(err);\n  });\n\
    };\n```\n\nMongoDB 的行为与其他数据库不同。通过对插件进行“更新”来添加新插件更安全。这样，如果它已经存在，就可以同时进行更新。但如果它不存在，就会被创建。\n\
    \n此外，在 `createOrUpdate` 函数内部，我们使用了一个尚未定义的函数 `internals.pluginToObject`。我们将在第9章“模板化”中定义它，那时我们将从\
    \ NPM 接收数据并将其映射到我们的模式。\n\n此外，为了方便开发人员工作，我们还添加了一个用于异步批量添加插件的函数。在这个函数内部，我们还添加了一些代码以防止未发布的\
    \ NPM 模块注册到我们的数据库中。\n\n```javascript\ninternals.plugin.statics.batchCreate = function\
    \ (pluginsJS, callback) {\n  var self = this;\n  var addPlugin = function (pluginJS)\
    \ {\n    return function (next) {\n      self.createOrUpdate(pluginJS, next);\n\
    \    }\n  };\n  var batch = [];\n  for (var i = 0, il = pluginsJS.length; i <\
    \ il; ++i) {\n    var pluginJS = pluginsJS[i];\n    var unpublished = Hoek.reach(pluginJS,\
    \ 'time.unpublished');\n    if (!unpublished) {\n      batch.push(addPlugin(pluginJS));\n\
    \    }\n  }\n  Async.parallel(batch, callback);\n};\n```\n\n这使得一次性向数据库添加多个条目变得更容易，而不是多次调用。\n\
    \n# 总结\n\n在本章中，我们学习了如何通过查询参数过滤数据，并展示了如何添加插件。现在用户可以搜索我们的插件仓库了。\n\n# 模板化 9\n\n在上一章（第8\
    \ 章 模型）中，我们看到了如何获取和存储数据。现在，我们将学习如何向用户展示数据。\n\nhapi 支持大多数模板引擎。本章将包含这些示例：Handlebars.js、Mustache.js、Jade、Dust、eco\
    \ 和 ECT。关于它们的概述，请参见附录。\n\n在典型的 Web 应用中，用户使用 URL，URL 映射到处理器，处理器执行业务逻辑以准备数据，最后，Web\
    \ 服务器向用户响应数据。\n\n响应 HTML 有多种方法。两种主要方法是拼接和模板系统。在开发的早期，HTML 是通过拼接生成的，例如如下：\n\n```javascript\n\
    var html = '<<html><title>' + \npage_title + \n'</title></head><body>' + \ncontent\
    \ + \n'</body></html>';\nreturn reply(html);\n```\n\n幸运的是，这种笨且且灵活的方法已经过时，并被现代模板系统所取代。然而，拼接方法仍然可行，某些团队为了单行响应的效率可能会使用它。\n\
    \n同时，对于现代 Web 应用程序，模板系统将负责格式化数据的模板合并到一致格式中（如 HTML）。例如，一个 Handlebars（或 Mustache）模板如下：\n\
    \n```html\n<html>\n<head>\n  <title>{{page_title}}</title>\n</head>\n<body>\n\
    \  {content}\n</body>\n</html>\n```\n\n结合如下上下文数据：\n\n```javascript\nvar context\
    \ = {\n  page_title: '模板化很有趣!',\n  content: '<h1>Hello world!</h1>'\n}\nreturn\
    \ reply.view('index', context);\n```\n\n将返回如下 HTML 输出：\n\n```html\n<html>\n<head>\n\
    \  <title>模板化很有趣!</title>\n</head>\n<body>\n  <h1>Hello world!</h1>\n</body>\n\
    </html>\n```\n\n使用模板，数据可以快速地添加、移动或删除。工作可以分工——设计师处理模板，而开发人员提供上下文。模板可以作为重新设计的一部分或根据条件显示（如果用户的设置指定了偏好，则显示\
    \ X 设计；否则显示 V）。\n\n因此，模板系统比替代方案不笨且灵活得多。\n\n# 配置\n\n在 hapi 中，必须在使用视图之前对其配置。视图必须知道运行哪些引擎以及在哪里找到文件——这些是必需的。其他选项不是必需的。\n\
    \n"
