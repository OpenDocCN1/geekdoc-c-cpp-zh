    \ }\n};\n```\n\n这种方式使代码在逻辑上保持分离，这是 MVC（模型-视图-控制器）框架的典型特征。代码逻辑可能会非常复杂，通过这种分离，可以很容易地组织，使得特定路由的所有逻辑都位于一个文件中。你可能决定采用这种方案，只需将该逻辑保留在\
    \ `lib/controllers/welcome/index.js` 文件中即可。也许在这种结构下，服务条款会放在 `lib/controllers/welcome/tos.js`\
    \ 中。当然，函数拆分到独立文件的大小应该有一个合理的衡量。但核心思想是，当代码被拆分成更小的部分时，会更容易管理和阅读。\n\n## 路径处理\n\n路由是唯一的。GitHub\
    \ 上开启了几个关于正则表达式或其他通配符匹配（globbing）类型的问题。确定路由何时重叠可能是困难的。hapi 的早期设计目标之一是确保路由表每次加载时都是完全相同的。不会有意外。在启动时，hapi\
    \ 会对任何冲突报错并保护你免受此类问题的影响。\n\nhapi 中路径处理的工作原理是：路由器在每次收到请求时遍历路由表并执行第一个（也是唯一匹配的）路由。路由匹配仅针对请求路径进行（排除查询参数和其他\
    \ URI 组件）。请求按照确定的顺序进行匹配，因此你将它们添加哪里并不重要。最后，路由按照从具体到通顺序进行排序。如果你需要更多细节，请参见“路径匹配顺序”（Path\
    \ Matching Order）。\n\n## 路由的组成部分\n\n`server.route()` 的参数路由对象由几个简单的属性组成。\n\n###\
