  mdcn: "\n\n## 第5 章：验证\n\n该函数接受三个参数：`value`（即待验证的值）、`options`（服务器验证选项）以及一个签名格式为 `call-back(err,\
    \ value)` 的回调函数。\n\n```javascript\nvar internals = {};\n\ninternals.validationFunction\
    \ = function (value, options, next) {\n  // do something\n};\n\nvar routeOptions\
    \ = {\n  validate: {\n    payload: internals.validationFunction\n  }\n}\n```\n\
    \n## 总结\n\n到目前，你已经了解了数据验证是什么、如何使用它，以及 happy-plugins.com 是如何使用它的。joi 支持多种数据类型，我们建议你查阅文档以获取更多细节。需要注意的是，joi\
    \ 并不一定专门用于 hapi 项目。虽然 `validate` 方便地被内置在 hapi 中，但 joi 也可以用于其他框架。接下来，你将看到 hapi\
    \ 的插件架构如何让一个应用程序变得不仅仅是各个部分之总和。\n\n## 插件 (Plugins)\n\n现在我们已经理解了如何验证输入和输出，接下来我们想讨论如何在\
    \ hapi 中利用插件来更好地管理代码。将软件作为单体代码块发布，并不比编写跨越数千行的代码好在哪里。通过将软件编写成承担特定角色的小型函数，我们可以更容易地测试函数、更容易地调试问题，并且更容易理解架构。插件也遵循这种模型，但它们面向主软件的功能，而不是代码片段。插件允许你扩展现有功能，同时它们又将代码进行了模块化处理，以便进行划分并使其易于维护和测试。\n\
    \n将代码拆分为插件的益处不仅限于你自己的代码，它轻松允许用户分享对大家都有益的代码。例如，你可能编写了专门用于 Facebook 身份验证的代码（`bell`）或用于在启动时显示路由等简单操作的插件（`blipp`）。\n\
    \n在在此之后，我们将探索如何编写一个插件以及如何围绕它组织你的代码。此外，我们将查看一些我们使用过的热门插件，以及我们曾经作为代码项目一部分的插件。\n\n\
    插件模型以及在 hapi 中拥有可替换部分的用处在于，你不会受限于某种特定的处理方式。如果以后出现了比你目前正在使用的更好的插件，切换它要比让该部分代码与你想保留的代码紧密耦合容易得多。这不仅适用于第三方插件，也适用于你系统中的任何内容。\n\
    \n当大公司跨多个团队开发插件时，缓存等内容可以根据插件为基础进行决定。团队之间不需要通信，尽管插件作为同一台服务器的一部分运行，不同服务器中的路由也可以通过插件进行配置，例如使用适用于该特定代码段执行的不同缓存机制。\n\
    \n## 创建你自己的插件\n\n注意看我们 hapi-plugins 项目中的一切是如何架构设计成插件的。我们有针对路由器的插件，也有针对模型的插件。甚至身份验证也是一个插件。让我们从查看\
    \ `lib/index.js` 文件开始，所有的插件都在那里加载。\n\n```javascript\nserver.register([\n  Bell,\n\
    \  Blipp,\n  HapiAuthCookie,\n  Controllers,\n  Models,\n  Routes\n],\nfunction\
    \ (err) {\n  if (err) {\n    console.log('server.register err:', err);\n    return\
    \ callback(err);\n  }\n  server.start(function () {\n    console.log('server started\
    \ on port: ', server.info.port);\n    return callback(null, server);\n  });\n\
    });\n```\n\n任何使用 Async 的人可能认出这种模式，因为它允许你轻松运行许多函数。我们是 async 方法的忠实粉丝，这里的模式非常相似。在内部，hapi\
    \ 使用 `items`（即纯基础的 async 方法）来实现这些目标。`register` 函数的签名是 `server.register(plugins,\
    \ [options], callback)`。\n\n传递插件有几种不同的方式，但并不是我们所有项目的组织方式（而且我们有很多项目）。`register`\
    \ 函数最棒的地方在于，它们可以轻松地转换为单独的 npm 包进行加载。它们也可以作为各自的仓库在 git-hub 上共享。我们发现，当许多人在一个较大的项目上工作，且该项目具有特定的组件，使每个逻辑划分部分都在各自的仓库中，这种方法非常有效。例如，如果你有一个博客系统，你可以将所有处理帖子的路由作为一个独立的插件，将所有处理评论的路由也作为一个插件。这样你就有为每个单独的部分设置了单独的所有者，这倾向于减少代码中的冲突。这并不总是奏有效。例如，你可能会有紧密耦合的服务。在涉及自己的代码时，你才是专家。由你决定什么对你的项目最好，而\
    \ hapi 是灵活的，你可以按照你偏好的方式组织项目。\n\n另一种代码分离的方法是保持控制器（controllers）精简，并将尽可能多的逻辑放入模型（models）中。你可以将它们包含代码的库。\n\
    \n将代码分成更小的原子部分后，代码复用变得变得容易得多。理解架构也变得更容易。例如，你可能会发现你的某些测试设置为通用测试创建了另一个仓库。你最终可能会像我们所做的那样，创建另一个仓库，但即使在一个项目内部这也是一种非常好的方法，并且可以在多个项目之间进行复用。让我们通过观察处理器是如何加载的来查看其中一个部分。\n\
    \n```javascript\nvar load = function (options, callback) {\n  options = options\
    \ || {};\n  options.extension = options.extension || '.js';\n  var controllers\
    \ = {};\n\n  var files = glob.sync('*' + options.extension, { cwd: options.path\
    \ || __dirname });\n  for (var i in files) {\n    if (files[i] != path.basename(__filename))\
    \ {\n      var key = path.basename(files[i], options.extension);\n      key =\
    \ key.charAt(0).toUpperCase() + key.slice(1);\n      controllers[key] = require(options.path\
    \ || __dirname) + '/' + files[i];\n    }\n  }\n\n  if (callback) {\n    return\
    \ callback(null, controllers);\n  }\n\n  return controllers;\n};\n\nexports.register\
    \ = function (plugin, options, next) {\n  load({path: __dirname + '/handlers'},\
    \ function (err, handlers) {\n    if (err) {\n      throw err;\n    }\n    if\
    \ (process.env.DEV) {\n      console.log('handlers');\n    }\n    plugin.expose('handlers',\
    \ handlers);\n    next();\n  });\n};\n\nexports.register.attributes = {\n  pkg:\
    \ require('./package.json')\n};\n```\n\n## 第6 章：插件\n\n我们从一个名为 `load()` 的便利函数开始。`load`\
    \ 的目的是遍历目录并引入这些文件。此外，我们将这些文件暴露为 handler 名称。这些将在 `handlers.js` 中使用。\n\n传递给 `register`\
    \ 函数的插件对象就是它本身。在上下文中被称为 `plugin`。`plugin.expose` 是一个让通过 `server.plugins[name]`\
    \ 使用插件可用的函数。在这一特定情况下，由于我们将在路由文件中使用处理器，可能不需要它，但暴露插件以便在应用程序中使用是一个良好的做法。\n\n插件还被设置了一些属性。通常，这可以设置为\
    \ `package.json`，但如果你想保持精简，或者出于某些原因不想使用 `package.json`，那么你可以通过一个包含 `name` 和 `version`\
    \ 属性的对象来设置：\n\n```javascript\nexports.register.attributes = {\n  name: 'handlers',\n\
    \  version: '1.0.0'\n};\n```\n\n这就是大多数插件的全部。不过，关于我们使用的插件还有一些可以说的。\n\n除了 `expose`\
    \ 之外，我们还倾向于使用 `plugin.dependency` 以及 `plugin.bind`。\n\n例如，假设你依赖其他第三方插件来实现你自己插件中的某些设置。这时\
    \ `plugin.dependency` 就派上了用场。依赖是根据连接检查的。因此，即使在一个连接中加载了依赖，如果在另一个使用的连接中没有，hapi 将抛出错误：Plugin\
    \ *api* missing dependency controllers in connection: http://0.0.0.0:8088。\n\n"
