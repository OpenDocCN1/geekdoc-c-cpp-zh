    \n# hapi-auth-basic\n\n从硬编码用户名和密码提升的下一步是基础身份验证（basic authentication）。它比明文传递用户名和密码安全性稍微高一点，但对于某些内部应用程序来说确实有作用。除了这种可能存在也可能不存在用处外，它也是理解\
