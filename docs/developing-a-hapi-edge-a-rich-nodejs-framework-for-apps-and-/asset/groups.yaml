    ```\n\n# 使用数据库\n\n在上面的 Schema 中，我们定义了每个文档中的所有相关字段以及一些数据类型要求。在某些情况下，还有默认值，以防我们没有为这些提供值。\n\
    \nMongoDB 会在已索引的字段上快速找到项目。如果我们最终搜索某个未被索引的内容，MongoDB 必须遍历整个文档列表。由于我们必须能够在不同字段之间快速搜索，我们必须使用索引。\n\
    \n```javascript\n//\ninternals.plugin.index({\n  name: 1,\n  description: 1,\n\
