    We are relentlessly strict about our guidelines when it comes to style. Style
    is something that should be one of the simplest concepts in programming to actually
    follow, yet we''ve found many get sloppy. If you follow the simple things, then
    it shows you''re not paying attention to what you''re doing. Therefore, we''ve
    taken to the idea that the further away the code is from the style, the closer
    the code needs to be scrutinized during code review.


    In addition to ending up with clear and concise code throughout the programs (which
    is a blessing on its own), we also pay close attention during code reviews trying
    to find anything that''s out of place. That forces us to scan every single line.
    This is a good thing because it helps catch oddities not just on a large scale,
