    \ and outs）。你将学会如何设置缓存。你将初次接触插件以及如何添加可以在整个应用程序中可用的方法。最后，你将学习请求生命周期以及如何为应用程序添加自定义函数。\n\
    \n注：此处处处处处，，，，，，， `server.info.。` \n\n"
