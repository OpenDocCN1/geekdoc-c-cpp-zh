    \ to define those. For a simple app, you may not need to specify additional configuration,\
    \ this isn't strictly required. However, for more complex configurations, it is\
    \ better to organize your code under this structure. You move your handler to\
    \ this section so that your configuration is all organized in the same location.\
    \ An example of a more complex configuration is if you want to add validation\
    \ or caching.\n\nIt is important to note that caching here is different than the\
    \ server.cache that was discussed in Chapter 2. That functionality caches actual\
    \ response objects. Caching in this section, is strictly caching. It will set\
    \ the Cache-Control header. Below is a trivial example where it will set a cache\
    \ header for our hour or /hello route.\n\n```javascript\nserver.route({\n  method:\
    \ 'GET',\n  path: '/hello',\n  config: {\n    handler: handler,\n});\n```\n\n\
    ```javascript\ncache: {\n  expiresIn: 60 * 60 * 1000\n}\nn);\n```\n\nThere are\
    \ so many options in the config section, we feel it's better to refer you to the\
    \ documentation. One that we will cover next, however, is route prerequisites.\n\
    \n## ROUTE PREREQUISITES\n\nYou may need to initialize a database connection and\
    \ return it for every single endpoint that you're using. This is a task's perfectly\
    \ suitable for route prerequisites. There are of course other things you could\
    \ need to set up, but this is probably the most common. The argument for pre is\
    \ a mixed array. It can contain either other arrays or other objects. That which\
    \ is assigned an array will be executed in parallel, while all the other items\
    \ are executed in series, e:g:\n\n```javascript\nserver.route({\n  method: 'GET',\n\
    \  path: '/',\n  config: {\n    handler: function (request, reply) {\n      reply.view('index');\n\
    \    },\n    pre: [\n      series,\n      series,\n      [\n        parallel,\n\
    \        parallel\n      ],\n      series\n    ]\n  }\n});\n```\n\nEach series\
    \ and parallel item in the pre array are objects with two properties method and\
    \ assign.\n\n```javascript\nvar dbSetup = function (request, reply) {\n\nDB.getConnection(function\
    \ (err, reply) {\n```\n\n```javascript\n);\nserver.route({\n  // ...\n  config:\
    \ {\n    handler: {\n      assign: 'connection'\n    },\n    pre: [\n      { method:\
    \ dbSetup, assign: 'connection' }\n    ],\n    handler: function (request, reply)\
    \ {\n      var conn = request.params.connection;\n      conn.exec('select * from',\
    \ function (err, result) {\n        if (err) {\n          var msg = 'query failed';\n\
    \          return reply(Boom.internal(msg));\n        }\n        return reply(result);\n\
    \      });\n    }\n  }\n});\n```\n\n## path\n\nThe route paths contain the parameter\
    \ name which is then checked for validation to be sure it's a string and nothing\
    \ else. For more validation, see Chapter 5.\nWe access the parameter through `request.params`\
    \ to get the name.\n\n## SIMPLE PATH\n\nThe paths are divided into segments by\
    \ /. The named parameterized are identified using curly brackets as {name}. In\
    \ the handler, the request object will have params. We will cover more details\
    \ on the request object in Chapter 4.\nTo illustrate:\n\n```javascript\nvar internals\
    \ = {};\n\nserver.route({\n  method: 'GET',\n  path: '/plugins/{name}',\n  config:\
    \ internals.config\n});\n\ninternals.config = {\n  description: 'A path to get\
    \ info for a specific plugin',\n  validate: {\n    params: {\n      name: Joi.string().required()\n\
    \    },\n  },\n  handler: function (request, reply) {\n    var msg = 'The name\
    \ of the plugin that was passed is: ';\n    return reply(msg + request.params.name);\n\
    \  }\n};\n```\n\n## OPTIONAL PARAMETERS\n\nIn order to specify an optional parameter\
    \ we use a question mark ?. In regular expressions, this also denotes optional\
    \ matches and captures so this may already be familiar to you.\n/plugins/{name?}\n\
    in this case it may be unclear what to serve up if the name is missing, but you\
    \ may use it to serve up a list of plugins.\n\n## WILDCARDS\n\nIf we need to accept\
    \ any number of segments in order to, for example, proxy a query for a particular\
    \ route, then a wildcard (*) is a life saver. Anything using the wildcard character\
    \ will be stored as an array in the named parameter of the request object. Perhaps\
    \ if we allowed a query to retrieve all and results from npm directly we could\
    \ allow for the path below:\n/npm/*\nBecause of the nature of the capture here,\
    \ similar to programming languages that allow any number of arguments to a function\
    \ (EcmaScript 6 offers the rest parameter using ...), you can only have the rest\
    \ of the parameter wildcard at the end of a path.\n"
  mdcn: "\n\n## 第 3 章：路由\n\n```javascript\npath: '/'\nconfig: Welcome.index\n);\n\
