  mdcn: "\n\n# 第 13 章：附录\n\n同时表现出极高性能。它还关注线性可扩展性，这意味着扩展系统就像向集群中添加机器一样简单（不需要稍微复杂的复制系统，一切都是自动的）。\n\
    \nCassandra 是一个列式数据库。数据库中的每条记录都可以有任意数量的列作为字段。单独的记录可以有不同数量的列。一个 Person 对象可能有 name，而另一个\
    \ Person 则有 name、address 和 phone number。在读取时，Person 的每一个列都会被检索到。列式数据库可能没有文档数据库那样直观，但它们有很多意想不到的益处（例如非常擅长存储和管理数据结构）。\n\
    \nCassandra 的主要缺点是学习曲线相对陡峭。上手 Cassandra 并不容易。然而，一旦配置正确，Cassandra 的功能和优势是难以比拟的。\n\
    \n# Apollo\n\nApollo 由 3logic 开发，是一款新兴的 Cassandra ORM。尽管 Apollo 的开发在不久前（2014年中）才开始，但它已经完全功能并兼容\
    \ Cassandra 的 CQL 接口。从技术上讲，作者在他们的 README.md 中确实指出 Apollo 是“不完全的”，可能尚未准备好投入生产。然而，Apollo\
    \ 远优于现有的替代 ORM。\n\n# cassandra-driver\n\nCassandra-driver 是 DataStax 官方提供的 node.js\
    \ Cassandra 驱动程序。它支持所有最新功能并由活跃维护。然而，它提供的高级功能很少甚至完全没有，因此需要一些开发工作来创建有效的模型。\n\n#\
    \ POSTGRES\n\nPostgreSQL 是一个非常流行的开源关系型数据库系统，是 MySQL 或 Oracle SQL 的替代方案。尽管它是免费使用的，但它提供了许多商用数据库的功能。\n\
    \n与 MongoDB 或 Cassandra 不同，PostgreSQL 遵循关系数据模型。这在配置数据模式和索引时需要相当长的时间。但是，这意味着数据验证在数据库端是免费的（而不是像所有\
    \ NoSQL 数据库那样在驱动/客户端端进行）。\n\nPostgreSQL 的主要缺点是学习曲线。关系数据模型可能很难快速掌握，并且在索引、数据分组等方面有许多特殊之处。\n\
    \n# PG\n\n与 'mongodb' 驱动一样，pg 模块（也称为 node-postgres）更像是一个驱动程序而不是一个全功能的 ORM。\n\n\
    # Sequelize\n\nSequelize 是一个全功能的 ORM，支持许多不同的 SQL 数据库，包括 MySQL、MariaDB、SQLite、MSSQL\
    \ 显然还有 PostgreSQL。它支持完整的模式定义及同步/迁移、关系、承诺、事务、预取等许多功能。它在生产环境中也非常健壮且经过了充分测试。\n\n\
    # 连接\n\n# MONGODB:MONGODB\n\n```javascript\nvar mongodbOptions = {\n  'connection':\
