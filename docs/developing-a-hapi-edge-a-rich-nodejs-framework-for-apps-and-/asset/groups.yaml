    }\n```\n\n在启动配置中，我们将 `options` 设置为 `{ colors: false }`。我们将这些选项传递给插件，插件就知道要关闭颜色。我们在第\
    \ 2 章中见过返回 `options` 的情况。如果你查看 `rejoice` 和 `glue` 部分，将看到插件的选项是如何传递给插件的。一个例子是 `good`\
