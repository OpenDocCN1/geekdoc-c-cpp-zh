    \ Code of Conduct），这样我们就能继续拥有一个良好的社区。\n\n一旦你掌握了一些技能，我们鼓励你成为活跃的参与者，指导他人，通过贡献代码来帮助解决问题，或以任何你所提供的支持继续加强社区。\n\
    \n你还有额外的资源可供使用以提高你的 hapi 技能。node school 有一个自引导课程叫做 `makemehapi`。此外还有教程和其他资源。\n\
    \n我们希望通过阅读这本书，我们已经帮助你开启了第一个 hapi 项目。你可以使用 hapi 让你的梦想成真，构建各种有趣的 Web 应用程序。\n\n#\
    \ 附录 13\n\n# 模型\n\n# 历史\n\n可扩展的应用程序通常遵循 n 层架构，其中应用程序服务连接到正交数据库（这意味着它与应用程序服务没有紧密耦合，可以独立管理甚至完全更换）。\n\
    \n今天，有很多数据库可供使用。数据库主要分为三类：\n\n- 关系型 (RDBMS)\n- NoSQL\n- 其他\n\n关系型数据库是数据库中的骨干。它们已经有效工作了数十年，并证明了性能特性。然而，它们具有学习曲线，并且并不总是适用于处理顺序数据、反规范化数据或极高的性能需求。\n\
    \nNoSQL 数据库是较新的。通常，它们具有非常短的学习曲线和高性能特性。然而，由于权衡，它们不具备通常与关系型数据库相关的所有功能（如事务、原子性、数据持久性等）。\n\
    \n其他数据库可能包括图数据结构数据库或任何不符合上述两种分类的内容。\n\n# HTTP 客户端概述\n\n# 历史\n\n当互联网完全处于 Web 1.0\
    \ 时时，大多数网站和公司并没有提供对开发者友好的 API。从网站获取数据需要开发者爬取网站、处理 HTML 并搜索提取数据（有时是手动的）。有些公司开始提供\
    \ SOAP API，但（谢天地）它们已经消失了。\n\nWeb 2.0 应用在 2004 年左右成为新常，支持带有 XML 和 JSON 响应的 API。Java\
    \ 强耦合并纳了 XML。随着 JavaScript 无处不在以及带有 AJAX 的惊人的开源库（如 jQuery、Dojo、Prototype）出现，JSON\
    \ 基本上赢了。JavaScript 和 Node.js 与 JSON 配合得非常好。\n\n今天大多数 API 主要支持 JSON。我们的示例展示了交互\
    \ JSON 的代码。\n\n要从 HTTP API 获取数据，我们有几种选择。我们将涵盖最流行的两个选项：Wreck 和 Request。\n\n# Wreck\n\
    \nWreck 是 hapi 官方模块之一，由本书的共同作者之一 Wyatt Preul 编写。\n\n它的创建是为了响应新的臭名昭著的 4 字节内存泄漏问题。罪祸首之一是流行的\
    \ Request 模块所使用的底层代码。\n\n此外，Request 设计用于完成广泛的用例。Wreck 采取了极简方法，仅提供最少的功能集，以确保高性能且无内存泄漏。\n\
    \n# REQUEST\n\nRequest 是 Node.js 中最著名的 HTTP 模块。它最初由 Mikael Rogers 创建，他是 Node.js\
    \ 社区中一位非常有名的人物，但现在该项目已经有了自己的生命。由于其简单、直观的界面，它获得了大量的追随（这比以前手动创建 HTTP 套接字那种冗长的方式要好得多）。\n\
    \n# 数据库客户端概述\n\nhapi-plugins.com 通过 Mongoose 驱动程序使用 MongoDB，因此主要示例将反映这一选择。\n\n\
    然而，为了获得最大收益，本书将展示 Node.js 项目中最常用的三个数据库的独立示例：MongoDB、Cassandra 和 Postgres。\n\n\
    # 模型\n\n# MONGODB\n\nMongoDB 是一个极其受欢迎的数据库。它是首批采用 NoSQL 运动以及开源开发模型的数据库之一。它在 GNU\
    \ 许可证下免费提供。\n\n与 MySQL 或 PostgreSQL 不同，MongoDB 是一个面向文档的数据库。在 MongoDB 中，不需要分开存储一个人的数据（如姓名、地址等），这些字段可以存储在针对单个系统的单个文档中。这对于操作来说是直观的。\n\
    \nMongoDB 支持简单但强大的 JavaScript 语法来执行查询，并且学习曲线非常短。这使得 MongoDB 成为快速启动项目、黑客松以及已经熟悉\
    \ JavaScript 的团队的流行选择。\n\nMongoDB 有两个主要缺点。扩展性不是线性的，需要建立复制系统。由于数据库范围锁定，写入性能可能会成为问题，且默认设置可能会导致数据丢失。\n\
    \n从实际角度考虑，在编写时，使用哪个 MongoDB ORM/驱动程序的选择具有很大争议。\n\n一方面，Mongoose 非常流行并有很多实用的功能，然而在编写时，Mongoose\
    \ 的 GitHub 仓库报告了超过 400 个开放 issue，关闭了近 2000 个。由于许多 bug，它可能并不总是最佳选择。\n\nmongodb\
    \ driver\n\nmongodb driver（也称为 node-mongodb-native）是访问 MongoDB 数据库实例的最流行的库。它相当准确地模拟了真实的\
    \ MongoDB 语法，并根据需要进行了一些异步修改。因此，与其说是一个 ORM，不如说是一个手动数据库驱动程序。因此，需要对 MongoDB 查询语法有深入了解。\n\
    \nMongoose\n\nMongoose ODM 是一个用于 MongoDB 的高级资源映射器。由 LearnBoost（Automattic 的一部分）创建，Mongoose\
    \ 抽象了纯 MongoDB 语法，通过增加对队列操作、模式、模式验证器、默认值、方法等的支持，使使用 MongoDB 进行开发更快更简单。\n\n# CASSANDRA\n\
    \nCassandra 是另一个流行的开源 NoSQL 数据库。不像 MongoDB 那样关注开发者的易用性，Cassandra 侧重于利用数学和科学为开发者提供扩展性和高可用性（可以从多台机器的故障中生存下来）。\n\
    \n"
