    \ the {id} gets made into this parameter. Our method in the server route is a\
    \ POST and this JSON object gets translated to the payload object.\n\nYou can\
    \ see that validation is done on the payload. The password passed in the payload\
    \ is a string of at least eight characters and is a required field. In addition,\
