  mdcn: "\n\n编写一个 hapi 测试\n\n测试耗时：6 ms\n未检测到变量泄露\n\n你在这里可以看到，在详细模式（verbose mode）下，你还可以看到每个测试的耗时。\n\
    \n## 编写一个 hapi 测试\n\nhapi 在设计时就考虑了测试。为了发布版本，每一行代码和每一个代码路径都必须有相应的测试。因此，hapi 及其依赖项存在大量的测试。为了帮助缩短运行测试的时间，并避免文件描述符限制的问题，hapi\
    \ 内置了对模拟请求（mock request）的支持。这是通过 `shot` 模块提供的名为 `inject` 的函数实现的。下面的测试用来说说明 `shot`\
    \ 的威力。请注意，该测试没有使用实验性风格，而是使用 BDD 风格的测试快捷方式编写的。\n\n```javascript\n// 加载模块\nvar Code\
    \ = require('code');\nvar Hapi = require('hapi');\nvar Lab = require('lab');\n\
    ```\n\n```javascript\nvar lab = exports.lab.script();\nvar describe = lab.describe;\n\
    var it = lab.it;\nvar expect = Code.expect;\n```\n\n```javascript\ndescribe('inject',\
    \ function () {\n  it('returns the response result', function (done) {\n    var\
    \ handler = function (request, reply) {\n      return reply('hello');\n    }\n\
    \n    var server = new Hapi.Server();\n    server.connection();\n    server.route({\n\
    \      method: 'GET',\n      path: '/',\n      config: { handler: handler }\n\
    \    });\n\n    server.inject('/', function (res) {\n      expect(res.statusCode).to.equal(200);\n\
    \      expect(res.result).to.equal('hello');\n      done();\n    });\n  });\n\
    });\n```\n\n在以前的示例中，`server.start` 函数没有被执行。结果是没有任何创建或挂载到服务器的 socket。然而，向服务器发送了请求并收到了响应。请求对象包含了服务器关心的所有属性。同样，传递给\
    \ `inject` 回调的响应对象包含了响应正文以及相关的响应头和状态码。\n\n除非你正在从 socket 创建信息，否则最佳解决方案是使用 `inject`。如果你采用这种方法，测试的执行速度将比依赖真实\
    \ socket 快得多。此外，这使得更容易避免与 socket 相关的设置和清理工作。说到这里，如果你需要使用 socket，请向 `connection`\
    \ 函数传递 0 作为端口，以确保端口被占用。注意，在服务器启动后可以从 `server.info.port` 属性获取实际使用的端口。\n\n```javascript\n\
    // 加载模块\n\nvar Code = require('code');\nvar Hapi = require('hapi');\nvar Lab =\
    \ require('lab');\nvar Wreck = require('wreck');\n```\n\n```javascript\nvar lab\
