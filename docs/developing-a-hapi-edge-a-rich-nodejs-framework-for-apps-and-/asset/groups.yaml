    \ hapi 风格指南。\n\n我们可能并不同意风格指南中的所有内容，但值得注意的是，仅仅有这套可以遵循的风格指南就能避免在讨论上花费时间。它是 99% 完美的。某些做法看起来可能很奇怪，但它们确实有助于代码的可视化。我们建议选择这种风格不仅是为了与\
    \ hapi 相关的项目，而是为了通用的 Node 开发。\n\n在风格问题上，我们的指南是近乎严苛的。风格本应该是编程中最容易遵循的简单概念之一，但我们发现许多人变得很马虎。如果你不遵守这些简单的规则，说明你没有注意自己在做什么。因此，我们采纳了这样一个观点：代码偏离风格越远，在代码审查期间对其进行的审查就越需要仔细。\n\
    \n除了让整个程序都拥有清晰、简洁的代码（这本身就是一种幸运）之外，我们在代码审查期间也非常关注，试图发现任何不协调的地方。这迫使我们扫描每一行代码。这是一件好事，因为它能帮助我们不仅捕捉到大范围的异常，还能发现更细小的\
    \ Bug。\n\n## 总结\n\n话话不再说，让我们在下一章开始学习 hapi 服务器。\n\n## 服务器 2\n\nhapi 是一个用于构建应用程序和服务的框架。在每个服务的背后都有服务器；一个满足客户端需求的服务器。hapi\
    \ 的核心是一个 HTTP 服务器的超集。hapi 的所有内容都与这一事实相关，因此我们从讨论主要功能开始本书。其他所有配置都是基于此并产生差异的。我们将讨论许多与服务器、插件、处理器、测试等相关的概念。\n\
    \n在本章中，我们查看了如何设置服务器，以及我们是如何为我们的 hapi-plugins.com 示例设置服务器的。我们将教你 hapi 框架中服务器的方方面里面。你将学会如何设置缓存。你将初次接触插件以及如何添加可以在整个应用程序中可用的方法。最后，你将学习请求生命周期以及如何为应用程序添加自定义函数。\n\
    \n### 设置简单的服务器\n\n当然，我们不能在没有先有一个“hello world”示例的情况下开始写书。嗯，实际上我们可以这样做，但我们不会这样做。在进行到更复杂的设置之前，知道如何在最简单的配置中设置服务器是非常重要的。\n\
    \n```javascript\nvar Hapi = require('hapi');\nvar server = new Hapi.Server();\n\
