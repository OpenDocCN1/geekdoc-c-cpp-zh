  - '[PAGE 13]


    # What will this book teach you?


    This book will teach you how to build awesome web applications using hapi. It
    covers many aspects of how and why hapi works the way it does. You will see helpful
    and ad-v features such as authentication, validation, caching, templating, testing,
    and de-ging. In this book, you will also walk through the creation of a fully
    operational hapi web application.


    # Authors


    Daniel Bretoi is a contractor @WalmartLabs where he worked on Eran Hammer''s team,
    which developed the hapi framework. He has worked in the industry for 15 years
    and fa-vors languages. In 2002 he was an early adopter of Ruby and generally embr-ces
    new technologies.


    # Wyatt Preul


    Wyatt Preul is a software developer for Walmart. He is one of the core maintainers
    of the haki node.js framework. At Walmart, Wyatt was one of the investigators
    of the now ifa mous node.js memory leak. In addition to this, he has helped deliver
    many node.js projects within Walmart. Apart from his day job Wyatt loves all things
    node, web app secu-rity, archery, coffee roasting, and beer brewing.


    # Van Nguyen


    Van Nguyen is a Senior Software Engineer, Full-Stack, IDEA (Big Data) at Intuit.
    He is cur-rently hacking on JavaScript Uis for managing and visualizing Big Data.


    # Lloyd Benson


    Lloyd Benson is a consultant at Walmart. He is also the owner of Open Source Infra-structure
    LLC.


    # Technical reviewers


    We would like to thank the following technical reviewers for their early feedback
    and careful critiques: Doron Pagot, Troy Whiteley, Jeffrey Jagada, Colin Inhir,
    Daniel Barnes, Michael Caputo, James Butler, Alvin Teh, Josh Mock, Michael Parks,
    Jonathan Holmlund, Glenn Jones, and Jesse Newcomer.'
