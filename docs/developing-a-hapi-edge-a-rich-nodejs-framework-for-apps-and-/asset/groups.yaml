    # 本书将教你什么？


    本书将教你如何使用 hapi 构建出色的 Web 应用。它涵盖了 hapi 工作原理的许多方面。你将看到如身份验证、验证、模板渲染和调试等有用功能。在书中，你还将学习如何创建一个完全标准的
    hapi 应用。


    # 作者


    Daniel Breito 是 WalmartLabs 的一名承包商，他在 Eran Hammer 的团队开发了 hapi 框架。他已经在行业工作了 15
    年，并在 2002 年成为 Ruby 的早期采用者，并接受新新技术。


    # Wyatt Preul


    Wyatt Preul 是 Walmart 的软件开发人员。他是 node.js 框架的核心维护者之一。在 Walmart 工作期间，他曾帮助交付了许多 node.js
    项目。此外，他热爱所有 Node、Web 应用、安全以及咖啡冲泡。


    # Van Nguyen


    Van Nguyen 是 Intuit 的高级全栈工程师，他目前负责大数据的管理和可视化。


    # Lloyd Benson


    Lloyd Benson 是 Walmart 的一名顾问。他也是 Open Source Infrastructure LLC 的所有者。


    # 技术评审


    感谢以下技术评审人员提供的早期反馈和批评：Doron Pagot、Troy Whiteley、Jeffrey Jagada、Colin Inhir、Daniel
    Barnes、James Butler、Alvin Teh、Josh Mock、Jonathan Holmlund、Glenn Jones 和 Newcomer。


    # hapi 简介


    ![](img/79450811086e2fc749ec4d309ea140.png)


    # 历史


    hapi 的起源始于 2010 年底 Yahoo! 一个名为 Sled 的项目。Sled 是一个为了实验而写的协作工具，由 Eran Hammer 使用 node
    编写。Eran 爱上了这项技术。随后在 2011 年 8 月，Eran 离开了 Walmart，决定继续开发 hapi。在 2011 年 8 月，hapi
    被慷慨地开源。虽然 Express 非常棒，但它缺少很多功能，无法满足特定的需求。因此，hapi 演变成了一个独立的框架。hapi 的名字来源于 HTTP，“Happy
    Joy”（快乐之歌）。考虑到 hapi 的主题，hapi.js 框架以另一种方式启动，目标是让编写代码变得有趣。


    # 本书概述


    本书将带你了解如何使用 hapi 开发基础 Web 应用的过程。我们将构建一个 hapi 插件的可搜索仓库。可以在 hapi-plugins.com 查看在线演示。


    前七章都是关于创建和配置 hapi 服务器。接下来的两章（8、9 章）涵盖了如何获取、处理和格式化数据。最后三章（10、11、12 章）涵盖了更高级的主题，包括一些常用的最佳实践。


    ## 1. 引言

    第一章介绍了 hapi、本书概述、代码风格指南以及演示应用的简要介绍。


    ## 2. 服务器

    本章关注 hapi 服务器的配置。它还涵盖了常用的最佳实践、示例以及如何在请求生命周期内进行自定义。


    ## 3. 路由

    路由映射到 URL。在本章中，你将深入理解如何匹配复杂的模式。


    ## 4. 处理器

    处理器负责接收用户请求并返回响应的函数。在本章中，你将看到 hapi 响应的不同方式。


    ## 5. 验证

    验证（通过 Joi 实现）是 hapi 的另一个非常有用的功能。本章说明了验证是多么强大，以及它是如何让开发者的生活变得简单的。


    ## 6. 插件

    插件是“正确实现”的中间件。本章向你展示插件如何让跨功能远程团队协作，而不会引起任何通常与中间件相关的问题。


    ## 7. 身份验证

    本章提供了如何启用身份验证和设置 Cookie 的详细步骤指南。


    ## 8. 模型

    本章介绍了如何为你的 hapi Web 应用连接第三方 RESTful API。然后，它介绍了如何为你的 hapi Web 应用连接 MongoDB 数据库。它还展示了如何在另外两个流行的数据库（Cassandra
    & PostgreSQL）中操作的示例。


    ## 9. 模板渲染

    在本章中，你将看到如何将响应中的数据与呈现分离。


    ## 10. 测试

    测试通常被误解或难以学习。本章将赋予你为 Web 应用添加测试的能力，从而提高健壮性和代码质量。


    ## 11. 调试

    通过极少的资源，通过 https://github.com/hapi/issues/1326 展示了我们在运行全球最大的 Node.js 部署之一时总结的宝贵调试技巧。


    ## 12. 安全

    本章涵盖了关于 Web 应用安全的的一些行业最佳实践。

    '
