    \  method: 'GET',\n  path: '/',\n  config: {\n    handler: function (request,\
    \ reply) {\n      reply.view('index');\n    },\n    pre: [\n      series,\n  \
    \    series,\n      [\n        parallel,\n        parallel\n      ],\n      series\n\
    \    ]\n  }\n});\n```\n\nEach series and parallel item in the pre array are objects\
    \ with two properties method and assign.\n\n```\nvar dbSetup = function (request,\
