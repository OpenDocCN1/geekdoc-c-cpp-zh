    \ 将自己的插件添加到列表中。\n- 点赞或取消点赞插件。\n\n在后台，我们还需要能够：\n\n- 向列表中添加插件\n- 从列表中移除插件\n\n因此，我们知道插件必须具有名称、描述、作者（们）和关键词。NPM\
    \ 防止模块名称重复，所以我们知道名称将是唯一的，因此可以使用名称作为主键。此外，通过查看 NPM 模块，我们还拥有版本、许可证、仓库 URL、主页、依赖项、依赖者以及大量的统计数据。它还包含关于模块如何创建和更新的时间信息。从这里，我们可以为我们的\
    \ hapi-plugins 应用定义第一个 Schema。\n\n```\nvar internals = {};\n\ninternals.plugin\
