    We will be following hapi style-guidelines throughout this book. To find more
    about what they are, you can see them at the hapi Style Guide.


    We may not agree with everything in the styles, but it''s worth noting that just
    having this style guide to follow prevents time taken up by discussion. It''s
    99 percent good. Some practices may look odd, but it really helps with the visualization
    of the code. We recommend choosing this style not for projects related to hapi,
    but for node development in general.'
