    \ expects file extensions (without the dot '.') as keys and templating system\
    \ compilers as values. The below example (\"engines-breakdown.js\") would match\
    \ anyfilename.extension and use the some_compiler engine.\n\n```\nengines: {\n\
    \  \"extension\": require('some_compiler')\n},\n/* ... */\n```\n\nUsing this system,\
    \ it is possible to mix and match templating systems as long as they use all different\
    \ file extensions:\n\n```\nvar Hapi = require('hapi');\n\nvar server = new Hapi.Server();\n\
    server.views({\n  engines: {\n    html: require('mu'),\n    jade: require('jade'),\n\
    \    hbs: require('handlebars')\n  },\n  defaultExtension: 'hbs',\n  path: __dirname\
    \ + '/views'\n});\n```\n\nIf you do not match templating engines for whatever\
    \ reason, you should be aware of a couple of things. If you want to use the reply.view('templateName',\
    \ context) syntax, it needs to understand what the default extension is. In the\
    \ above example, you can see how we pick hbs as that default extension. This setting\
    \ isn't required. You can just add the extension like reply.view('templateName',\
    \ context). If the file has an extension that isn't your defaultExtension then\
    \ you need to give it that extension."
