    \ One function can only apply plugins to one connection at a time. Therefore,\
    \ we need to distinguish these two functions because we have hapi for two connections.\n\
    \nWe're using Async.auto to complete this asynchronously, which we can get away\
    \ with because it doesn't matter in what order we register plugins. If you're\
    \ not familiar with the Async library, it's a great tool, and we use it everywhere\
    \ for cleaner code. It's worth noting here and taking a break to look at the documentation\
    \ for Async to get familiarized with it. We'll wait.\n\nIf there are errors, we\
    \ print the error to the console and If there are no errors, we go ahead and start\
    \ the server.\n\nNote that server.register can take an array of plugins. This\
    \ behavior is similar to [Async].series.in fact, hapi is internally using a lightweight\
    \ version of Async called items. If you're not finding yourself using all of the\
    \ features of Async, this may be a good alternative for you.\n\nAs you can see,\
    \ setting up the server can be quite an ordeal. There's a lot to keep track of.\
    \ If however, a much cleaner approach. Next up, we're going to have a look at\
    \ the glue, rejoice, and confidence modules.\n\n# Glue\n\nGlue is a way to compose\
    \ server settings. It's desired to have server configuration stay out of code\
