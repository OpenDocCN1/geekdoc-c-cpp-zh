    \ function () {\n    return this.response({ success: true });\n});\n```\n\n# Configuring\
    \ for caching\n\nWe can use server.cache to setup a cache. hapi has a built-in\
    \ server cache facility and it relies on the hapi plugin cache. By default, there\
    \ is a built-in memory cache catbox-memory but other types of cache engines are\
    \ supported like redis, mongoDB, memcached and others. Please refer to the cache\
    \ documentation for more details on these strategies. Here is a simple example\
    \ of how to use server.cache.\n\n```\nvar cache = server.cache({\n    segment:\
    \ 'plugins',\n    expiresIn: 60 * 60 * 1000\n});\n\ncache.set('pluginName', {\
    \ author: 'mindy' }, null, function (err) {\n    cache.get('pluginName', function\
    \ (err, value, cached, log) {\n        // value === { author: 'mindy' };\n   \
    \ });\n});\n```\n\nWe have setup a cache, with a segment of plugins. Segments\
    \ are used to isolate cached items within the cache partition. When you call this\
    \ within a plugin, it defaults to ! name where name is the name of the plugin."
  - "[PAGE 31]\n\n# CHAPTER 2: Server\n\nWe also have an expiresIn setting, which\
    \ is set to expire the cached item in one hour.\nThere is an interesting setting\
    \ called staleIn where you can mark the item stored in cache as stale. This setting\
    \ must be less than expiresIn. Using this feature, you can have the cache ready\
    \ by the time expiresIn comes along. If staleIn doesn't have sufficient time before\
    \ expiresIn hits, it will work like the usual expiresIn. This is like warming\
    \ up your cache.\n\nFinally, you can see that use cache.set() to set the pluginName\
    \ with the value of the author object and we can retrieve that value using the\
    \ cache.get() method.\n\nThere are more options to server.cache and get more details\
    \ visit the hapis.js documentation.\n\n# Request lifecycle\n\nUnderstanding how\
    \ a technology handles an HTTP request is fundamental in developing secure, efficient\
    \ applications using that technology. Node.js itself doesn't provide much in this\
    \ regard, although creating a server is fairly simple in Node.js:\n\n```\nvar\
    \ server = require('http');\n\nserver.on('request', function (request, response)\
    \ {\n  // do something\n});\n\nserver.listen(80);\n```\n\nThat's just it, the\
    \ request has all information from the origin of the request, and the reply is\
    \ a writeable stream that needs to have headers set, information written to it,\
    \ and then have the connection closed. At first this can be exciting, especially\
    \ for those who haven't dealt with it in past. Once an application needs routing\
    \ table however, it becomes a lot taxing to deal with.\n\nThe way in whichhapi\
    \ deals with the requests is by having a reliable series of events each time a\
    \ request is received by the server. Here's the full lifecycle:\n\n+   * 'onRequest'\
    \ extension point\n  * always called\n  * the request object passed to the extension\
    \ functions is decorated with the request.URL() and request.getMethod() methods.\
    \ Calls to these methods will impact how the request is routed and can be used\
    \ for these rules.\n  * request.route is not yet populated at this point.\n\n\
