    \      { method: dbSetup, assign: 'connection' }\n    ],\n    handler: function\
    \ (request, reply) {\n      var conn = request.pre.connection;\n      conn.exec('select\
    \ * from blah', function (err, result) {\n        if (err) {\n          var msg\
    \ = 'DB call failed';\n          return reply(Boom.internal(msg));\n        }\n\
    \        return reply(result);\n      });\n    }\n  }\n});\n```\n\n# path\n\n\
    Paths are divided into segments by the / character. That means that anything not\
    \ part of is a segment.\nIt's important to note early that parameters per segment\
    \ are not allowed. Because of the hapi rule to always have the routes in a predictable\
    \ order, hapi does not support any sort of regular expression syntax because it\
    \ becomes difficult to tell when paths overlap. But what hapi allows is using\
    \ both optional parameters, wildcard parameters and match multiple segments of\
    \ a path.\n\n# SIMPLE PATH\n\nThe named parameterized by parts of the path are\
    \ identified using curly brackets as shown: /fixed/:name. In the handler, the\
    \ request object will have a params object. You should use the name parameter\
    \ in the handler with request.params.name. We will cover more details on the request\
    \ object in Chapter 4.\nThere are many options for constructing the path. They\
    \ are later accessed via request.path in the handler, which is also discussed\
    \ in more detail in Chapter 4.\nTo illustrate:"
  - "[PAGE 41]\n\n# CHAPTER 3: Routes\n\n```\nvar internals = {};\n\nserver.route({\n\
    \  method: 'GET',\n  path: '/plugins/{name}',\n  config: internals.config\n});\n\
    \ninternals.config = {\n  description: 'A path to get info for a specific plugin',\n\
    \  validate: {\n    params: {\n      name: Joi.string().required()\n    },\n \
    \ handler: function (request, reply) {\n    var msg = 'The name of the plugin\
    \ that was passed is: ';n    return reply(msg + request.params.name);\n  }\n};\n\
    ```\n\nThe route paths contain the parameter name which is then checked for validation\
    \ to be sure it's a string and nothing else. For more validation, see Chapter\
    \ 5.\nWe access the parameter through `request.params` to get the name.\n\n# OPTIONAL\
    \ PARAMETERS\n\nIn order to specify an optional parameter we use a question mark\
    \ ?. In regular expressions, this also denotes optional matches and captures so\
    \ this may already be familiar to you.\n/plugins/{name?}\nin this case it may\
    \ be unclear what to serve up if the name is missing, but you may use it to serve\
    \ up a list of plugins.\n\n# WILDCARDS\n\nIf we need to accept any number of segments\
    \ in order to, for example, proxy a query for a particular route, then a wildcard\
    \ (*) is a life-saver. Anything using the wildcard character will be stored as\
    \ an array in the named parameter of the request object. Perhaps if we allowed\
    \ a query to retrieve all and results from npm directly we could allow for the\
    \ path below:\n/npm/*\nBecause of the nature of the capture here, similar to programming\
    \ languages that allow any number of arguments to a function (EcmaScript 6 offers\
    \ the \"rest parameter using ......), you can only have the rest of the parameter\
    \ wildcard at the end of a path.\n\n42"
