    ```\n\nWe have an option to decorate the reply object or the server object and\
    \ the first argu-\\gment where we specify which one. The second argument specifies\
    \ the name of the meth-\nd and the third is the call back.\nIn our handler, we\
    \ can simply call:\n\n```\nreply.success();\n```\n\nThis is a very nice shortcut\
    \ and saves from changing in multiple places if the JSON ob-\njerted changes.\
    \ It's also a nice means to make sure the replies for success are consist-\nent\
    \ it eliminates types.\nnYou can find more about decorating the server object\
    \ in Chapter 2.\n\n# Tails\n\nCertain actions do not require immediate completion.\
    \ The type of calls may be a back-\\ground of some sort, which is not necessary\
    \ for the return of the page served to the\nclient. It may be a database call\
