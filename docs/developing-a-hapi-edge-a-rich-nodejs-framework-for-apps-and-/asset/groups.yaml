    # # Appendix 13


    # # Models


    # History


    Scalable applications typically follow an n-tiered architecture where the application
    service connects to an orthogonal database (meaning it is not tightly coupled
    with the application service and can be managed independently or even swapped
    out completely).


    Today, there are many databases available for use. There are three main classifications
    for databases:


    +   - Relational (RDBMS)

    - NoSQL

    - Other


    Relational databases are the horsehorse of databases. They''ve worked effectively
    for decades and proven performance characteristics. However, they do have a learning
    curve and are not always suited for handling sequential data, denormalized data,
    or seriously high performance requirements.


    NoSQL databases are relatively new. Typically, these have a very short learning
    curve and high performance characteristics. However, due to trade offs, they do
    not have all of the features typically associated with Relational databases (like
    transactions, atomicity, data durability, etc.).


    Other databases may include graph data structure databases or anything else that
    does not fit the two above classifications.


