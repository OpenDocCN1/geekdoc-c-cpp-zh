    # Validation 5


    [hapi] made our development process insanely productive and a true "joi."


    -- https://github.com/hapijs/hapi/issues/1613#issuecomment-46332030

    Eran mentioned in a tweet being proud of the impact that hapi is having on data
    validation. And he should be able to validate your input data and your output
    data is a big deal, and to actually have this made easy and an integral part of
    a framework is a big deal. If you''re asking why this is a big deal, hopefully
    it''s not because you''re a skeptic, and it''s because you simply want to know.
    We''re all working with computers that are extremely efficient at handling data.
    If we end up with the wrong data, it doesn''t really matter how efficiently your
    computer handles the work or what calculations it does up. Not only is it important
    from the perspective of having the correct data, but it''s also important for
    bugs and other errors that arise from not having it; more so in a dynamic language
    than anything else. Expected a number and got a string? That could be very bad.


    The library that is most often to validation hapi is called joi. When the first
    author Eran used a presentation of hapi at WalmartLabs, Eran started the presentation
    with a song about hapi. In fact, if you look on youtube, you can find just a presentation
    (https://www.youtube.com/watch?v=Recv7v8RZIA). The song was the hapi joi song.
    Given that hapi and joi are both in the song, it may give you an idea how Eran
    feels about quality and making sure that all data is validated and in a state
    where we''re safe to operate on.


    In this chapter, we will cover the various places to validation with and without
    joi.


    # Types of validations


    hapi provides validations for the following inputs: query, payload, headers and
    params. Recall that we learned about this in Chapter 4. Additionally, hapi allows
    us to do validation on the response.


    The formats for validation are always the following:


    +   - true - no validation is performed.'
