    \n# 使用数据库\n\n通常情况下，开发者在使用 hapi 数据库时具有完全的灵活性——可以使用任何数据库、任何 ORM 或任何库。你可以为一个项目使用一个数据库，为第二个项目使用另一个，或者为第三个项目使用十个数据库。hapi\
    \ 试图通过不设阻碍来让开发者感到满意。\n\n对于 github.com/hapi-edge/hapi-plugins 应用，我们选择了流行的 MongoDB\
    \ 作为数据库，并将使用 Mongoose 驱动程序来连接到数据库。关于其他数据库选项以及我们为何选择 MongoDB 的信息，请参阅第 13 章附录中的\
    \ Models 部分。\n\n# 设置数据库\n\n在 mongodb.org 上关于应用程序设置 MongoDB 有非常的文档。然而，为了快速开发，在本地开发或使用\
    \ Compose（又称 MongoHQ）来为你生成一个免费数据库实例会更快。\n\n一旦设置好实例，就需要创建一个数据库名称。我们选择了实例名称 'hapi-plugins'\
    \ 和数据库名称 'hapi-plugins'。如果你更改了这些名称，请记住在下方示例连接字符串中替换它们。如果你使用用户名和密码设置了身份验证（就像我们在生产数据库中设置的那样），请将其添加到连接字符串中。\n\
    \n集合（Collections）是文档列表。Mongoose 会在你使用时自动为你创建它们，除非你想强制设定大小和最大文档限制，否则不需要手动创建。\n\n\
    # 连接数据库\n\nMongoose 提供了一个用于连接 MongoDB 实例的高级 API。它只接受 mongodb 连接字符串，该字符串可以包含主机、用户名、密码、数据库等。对数据库的后续调用和查询会自动队列，直到连接完成。因此，没有必要在等待连接时在异步块中嵌套代码。\n\
    \n在 hapi-plugins.com 应用中，我们希望在开发时连接到本地运行的 MongoDB 实例，但在部署时也希望连接到生产数据库。我们使用环境变量来决定运行什么环境。Node.js\
    \ 全局进程级变量 `process.env` 包含了应用程序可用的所有环境变量。\n\n要启用生产环境，我们通过 `PRODUCTION=1 node index.js`\
    \ 运行应用程序。\n\n注意：本章中的数据库凭据已删除密码。请将这些凭据替换为你创建的数据库的正确凭据。\n\n```\nvar databases =\
    \ {\n  development: 'mongodb://localhost/hapi_plugins',\n  production: 'mongodb://hapi:({PASSWORD})@c278.lighthouse.0.mongodbayer.com:10278,c278.lighthouse.1.mongodbayer.com:10278/hapi-plugins?replicaSet=set-54ebe6966d607dala000f09'\n\
    };\n```\n\n```\nif (process.env.PRODUCTION) {\n  Mongoose.connect(databases.production);\n\
    } else {\n  Mongoose.connect(databases.development);\n}\n```\n\n使用这种模式，我们可以轻松区分环境。在本地开发时，我们使用本地数据库。然后，生产环境使用在线、可扩展的托管数据库。另一种模式是将连接字符串本身包含在环境变量中，如下所示：\n\
    \n```\n// MONGO_STR='mongodb://localhost/hapi_plugins' node index.js\nMongoose.connect(process.env.MONGGO_STR);\n\
    ```\n\n这种方式的额外好处是不在代码的任何地方存储你的连接字符串。如果你计划公开源代码，或者在应用程序服务器被入侵的情况下，黑客在读取代码后将直接访问你的数据库，这可能是极关重要的。\n\
    \n# Schema 设计 (Schema Design)\n\n在对数据库进行任何查询之前，预先设计一个粗略的 Schema 通常很有帮助。尽管 MongoDB\
    \ 不要求或强制执行 Schema，但 Schema 定义了数据的结构方式，并可以帮助你强制数据类型。首先了解你计划如何访问和使用数据是有帮助的。\n\n\
