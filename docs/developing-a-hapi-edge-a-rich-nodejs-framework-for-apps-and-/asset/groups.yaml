    \ easier for ourselves.\n\n## The request\n\nThe request object contains all of\
    \ the information pertaining to the incoming request to the server whether it\
    \ be from a browser, or some other tool using the API. Since the routing already\
    \ determines which request will be handled depending on the method, the request\
    \ received will be limited to whatever is specified. At the end of the day, the\
    \ full request is available here, which contains the headers and all of the data\
    \ content sent.\n\nRefer back to the request object to find out how the request\
    \ travels through the framework.\n\n## CHAPTER 4: The handler\n\nAttached to the\
    \ requests is a whole slew of important and useful information that gets used\
    \ in the handler in order to fulfill a request. In the rest of this section we're\
    \ going to take a look at how to find this data and what you can do with it.\n\
    \nBear in mind that there are other functions in the request lifecycle (see Chapter\
    \ 2) that can add data to the request along the way. We're going to take a look\
    \ at a few common ones.\n\n## parameters\n\nSome of the request object data is\
    \ set as part of direct configuration of the route. For instance, if the route\
    \ has defined a path that contains an id of a hapi plugin to download, then that\
    \ will be part of the parameters access the request object.\n\n```\nserver.route([\n\
    \  //\n  {\n    method: 'GET',\n    path: '/plugins/{name}',\n    config: Controllers.Plugin.get\n\
    \  }\n  //\n]);\n```\n\nThe name is the identifier in our case, and this will\
    \ be accessed via request.params.name. In the above example we have a GET method.\
    \ Assuming port 8080, if we did a:\n\n```\ncurl -XGET http://localhost:8080/plugins/pluginName\n\
    ```\n\nWe'd get the back with what is returned in Controllers.Plugin.get. We will\
    \ be contrasting this with other methods when we talk about payload.\n\n## query\n\
    \nIt can be confusing for new people to hapi, what is the difference between a\
    \ param and a query. The query of the URL in https://hapi-plugins.com/search?q=pluginName\
    \ is the after ?. Take a look at the previous example for /plugins/{name} to contrast\
    \ this. The name param was strictly part of the path.\n\nThe request object contains\
    \ all of the key value pairs that are sent along a query in the URL.\n\nFor example,\
    \ we could be a bit crazy with the URL to get the information about a particular\
    \ plugin on hapi-plugins.com and request something like:\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi\n\
    ```\n\n## The request\n\nIf we log the output with console.log(request.query)\
    \ then the result we'll be printed to the console would show as:\n\n```\n{ hello:\
    \ 'hi' }\n```\n\nIt's worth noting that sometimes the value can be an array. hapi\
    \ handles multiple query keys automatically for you, you do have to be aware that\
    \ the result can be a different type than expected.\nIf the URL looks like the\
    \ following:\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi&hello=hey\n\
    ```\n\nWe now see the value as an array:\n\n```\n{ hello: ['hi', 'hey'] }\n```\n\
    \n## payload\n\nrequest.payload contains information that has been transmitted\
    \ as part of the request that's not suitable as a query. This may be a file, or\
    \ a blob of JSON or XML. While it's certain possible to send payload for all of\
    \ the request methods (GET, POST, DELETE, PUT, PATCH, etc), it's typically used\
    \ for POST. If you do end up seeing payload for GET, you should probably rethink\
    \ your design. Let's start with a simple example for a handler where we'd utilize\
    \ the POST method of creating a new user.\n\n```\nhandler: function (request,\
    \ reply) {\n  console.log(name is: ' + request.payload.name);\n  console.log(email\
    \ is: ' + request.payload.email);\n  return reply('success');\n}\n```\n\nIf you\
    \ recall when we talked about params earlier and the GET method, we wanted to\
    \ contrast this with payload. For the handler, we setup a route as below.\n\n\
    ```\nserver.route({\n  method: 'POST',\n  path: '/user',\n  config: {\n    handler:\
    \ handler\n  }\n});\n```\n\nWait, I missed a section in the text above, let me\
    \ re-align the flow:\n\nHere you can see the method is POST. In the handler we\
    \ defined previously, you can refer to your payload request.payload. In this case\
    \ the payload has two keys, name and email. We send a POST on the user path. Once\
    \ this server was up, in curl could do something like:\n\n```\ncurl -XPOST -H\
    \ \"Content-Type: application/json\" -d '\"name\":\"Author Name\",\"email\": \"\
    author@hapi-plugins.com\" ' https://hapi-plugins.com/user\n```\n\nWe could also\
    \ PUT it and it would work the same way.\n\n## headers\n\nrequest.headers is where\
    \ all of the request headers are stored. Using our previous curl, we would see\
    \ that in your handler, you could refer to request.headers.Content-Type and that\
    \ value would be application/json.\n\n## reply\n\nThe reply function in the handler\
    \ serves as a callback and as a way to return control to the framework. The reply\
    \ function is in charge of replying back to the request to give the result of\
    \ whatever it is that it has been requested. Reply takes two arguments in order\
    \ to comply with the regular callback convention where both an err, and result\
    \ object, result is passed back. In practice only one of the two will be used.\n\
    If the first argument is an error object, this will be wrapped in a Boom object.\n\
    The argument type of reply can be a wide range of different types:\n\n- null\n\
    - undefined\n- string\n- number\n- boolean\n- Buffer object\n- Error object\n\
    - Stream object (Stream objects must be compatible with the \"streams2\" API and\
    \ not be in objectMode)\n- Promise object (hapi's testing uses the bluebird promise\
    \ lib)\n- any other object or array\n"
  mdcn: "\n然而，如果你显式定义了路径中允许的段数，你可以在其之后放置其他段。为了定义这些段，你可以在 `*` 之后添加一个数值，以表示你允许的数量。\n\
    \n```\n/npm/{search*2}/go\n```\n\n上述语法将捕获两个段，并将它们作为数组存储在 `request.params.search`\
    \ 中。\n\n## 服务器路由配置选项\n\n只有两个选项可以作为服务器本身的一部分。\n`stripTrailingSlash` 是一个非常实用的选项，但默认为\
    \ `false`。该路由的作用是：如果有一个类似于 `/plugins/like` 的路由，而请求发送到 `/plugins/like/`，实际上会产生\
    \ 404 错误，因为没有匹配到路由。设置此选项后，服务器将删除末尾斜杠，以便路由正常工作。\n\n`isCaseSensitive` 默认值为 `true`，这意味着路由对大小写敏感。如果有一个名为\
    \ `/blah` 的路由和另一个名为 `/Blah` 的路由执行不同的操作，那是糟糕的设计。此设置意味着两者被视为相同。\n\n## 总结\n\n路由是请求通过我们系统的路径。它定义了请求如何被处理，并定义了处理请求时的处理方式以及我们可以访问的变量。hapi\
    \ 中的路由是唯一的，没有重叠的可能性。它们是可预测的。路由可以配置缓存设置，也可以为特定的虚拟主机（域名）进行定义。\n\n接下来我们将查看定义为路由一部分的处理器（handlers）。\n\
    \n## 处理器 (The handler)\n\n处理器的核心是处理特定路由的传入请求。它决定了请求将如何被“处理”。路由的配置对处理器需要的行为起着至关重要的作用，由于它们是紧耦合的，需要考虑路由的某些配置。\n\
    \n当我们为请求指定路由时，例如，如果你要从 `/downloads/<filename>` 下载文件，那么是处理器中包含了所有的逻辑，用于找到相关文件并发送给连接的客户端。处理器还可能执行其他操作，例如统计文件的下载次数、访问控制（以确保不是每个人都能下载该文件）等。\n\
    \n处理器函数“处理”了从客户端接受请求到向用户返回响应之间的所有决策和逻辑。hapi 有一些很棒的功能可以自动承担某些工作，例如验证。我们将在第 5 章中详细介绍这一点（不过，我们怎么会梦想做那样的呢？）。\n\
    \n处理器通常是一个回调函数，由两个参数组成：`request` 和 `reply`。我们还将介绍并发现其他多个内置处理器。\n\n本章将涵盖处理器的各种用例。我们将深入研究处理器的参数，以及为了让我们在处理器中的工作变得更轻松的各种方法。\n\
    \n## 请求 (The request)\n\n`request` 对象包含了所有与传入服务器请求相关的信息，无论它是来自浏览器或其他使用 API 的工具。由于路由已经根据方法确定了将处理哪个请求，因此收到的请求将局限于指定的范围。归结底，这里提供了完整的请求，包含标头和发送的所有数据内容。\n\
    \n参考 `request` 对象以了解请求是如何通过框架的。\n\n## 第 4 章：处理器 (The handler)\n\n请求附带了大量重要且有用的信息，这些信息在处理器中使用以满足请求。在本节的剩余部分，我们将查看如何查找这些数据以及你可以对它们做什么。\n\
    \n请记住，请求生命周期中还有其他函数（见第 2 章）可以在途中向请求添加数据。我们将查看几个常见的函数。\n\n## 参数 (parameters)\n\n\
    请求对象的一些数据是作为路由直接配置的一部分的。例如，如果路由定义的路径包含要下载的 hapi 插件的 `id`，那么该 id 将是访问 `request`\
    \ 对象参数的一部分。\n\n```\nserver.route([\n  //\n  {\n    method: 'GET',\n    path: '/plugins/{name}',\n\
    \    config: Controllers.Plugin.get\n  }\n  //\n]);\n```\n\n在我们的案例中，`name` 是标识符，将通过\
    \ `request.params.name` 访问。在上面的示例中，我们有一个 `GET` 方法。假设端口为 8080，如果我们执行了：\n\n```\n\
    curl -XGET http://localhost:8080/plugins/pluginName\n```\n\n我们将得到 `Controllers.Plugin.get`\
    \ 返回的内容。我们将在讨论有效负载（payload）时将此与其他方法进行对比。\n\n## 查询 (query)\n\n对于 hapi 的新手来说，参数（param）和查询（query）之间的区别可能会让他们感到困惑。https://hapi-plugins.com/search?q=pluginName\
    \ 中 URL 的查询是 `?` 之后的内容。查看之前的 `/plugins/{name}` 示例进行对比。`name` 参数严格是路径的一部分。\n\n\
    `request` 对象包含了所有通过 URL 查询发送的键值对。\n\n例如，我们可以对 URL 设置得非常疯狂，以获取 hapi-plugins.com\
    \ 上特定插件的信息，并请求如下内容：\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi\n```\n\
    \n## 请求 (request)\n\n如果我们用 `console.log(request.query)` 记录输出，打印到控制台的结果将显示为：\n\n\
    ```\n{ hello: 'hi' }\n```\n\n值得注意的是，有时值可以是数组。hapi 会自动处理多个查询键。如果我们在使用 `console.log(request.query)`\
    \ 时输出，结果可能与预期的类型不同。如果 URL 如下所示：\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi&hello=hey\n\
    ```\n\n现在看到值为数组：\n\n```\n{ hello: ['hi', 'hey'] }\n```\n\n## 有效负载 (payload)\n\n\
    `request.payload` 包含了传输的信息，可能是文件、JSON 或 XML 数据。在所有的请求方法（GET、POST、DELETE、PUT、PATCH\
    \ 等）中，通常用于 POST。如果你在 GET 中看到有效负载，可能应该重新考虑你的设计。让我们从一个创建一个新用户的简单示例开始：\n\n```\nhandler:\
    \ function (request, reply) {\n  console.log(name is: ' + request.payload.name);\n\
    \  console.log(email is: ' + request.payload.email);\n  return reply('success');\n\
    }\n```\n\n如果你记得我们之前讨论过参数和 GET 方法，我们要对比。对于处理器，我们设置了如下路由：\n\n```\nserver.route({\n\
    \  method: 'POST',\n  path: '/user',\n  config: {\n    handler: handler\n  }\n\
    });\n```\n\n等等，上面的文中漏掉部分，让我重新对齐流程：\n\n在这里可以看到方法是 POST。在我们之前定义的处理器中，你可以引用 `request.payload`。在这种情况下，payload\
    \ 有两个键：`name` 和 `email`。我们在 `/user` 路径上发送 POST。一旦服务器启动，curl 可以执行如下操作：\n\n```\n\
    curl -XPOST -H \"Content-Type: application/json\" -d '\"name\":\"Author Name\"\
    ,\"email\": \"author@hapi-plugins.com\" ' https://hapi-plugins.com/user\n```\n\
    \n我们也可以使用 PUT，工作方式相同。\n\n## 标头 (headers)\n\n`request.headers` 是存储所有请求标头的地方。使用我们之前的\
    \ curl，你会发现在处理器中可以引用 `request.headers.Content-Type`，其值将是 `application/json`。\n\
    \n## 回复 (reply)\n\n处理器中的 `reply` 函数既作为回调，又作为向框架返回控制权。`reply` 函数负责响应请求，给出它请求的结果。`reply`\
    \ 接受两个参数以符合常规回调规范，即返回错误 `err` 和结果对象。在实践中只会使用其中一个。\n如果第一个参数是错误对象，它将被封装在 Boom 对象中。\n\
    `reply` 的参数类型可以是许多不同的类型：\n\n- null\n- undefined\n- 字符串\n- 数字\n- 布尔值\n- Buffer\
    \ 对象\n- Error 对象\n- Stream 对象（流对象必须兼容 \"streams2\" API 且不是对象模式）\n- Promise 对象（hapi\
    \ 的测试使用 bluebird promise 库）\n- 任何其他对象或数组\n"
