- raw:
  - '[PAGE 75]


    # poop


    In line with hapi''s goal of being silly, poop is a plugin for doing a process
    dump on exceptions. It provides a heapdump (https://www.npmjs.com/package/heapdump)
    and a log file will also be provided containing additional details for debugging.


    # More plugins


    You can find a large list of plugins at hapijs.com under Plugins.


    # Summary


    Often hapi plugins started as being part of the core project. As the project grew,
    many sections of hapi were broken into their own plugins. This happened for a
    variety of reasons. It helps keep things small and manageable. It can be useful
    to reuse for other applications. It can also be useful to separate out responsibilities
    between large teams.


    Writing plugins can also drive the design in hapi applications. They keep it easy
    to manage the application and allow for configuration-driven servers. We''ve shown
    you how they are and how to use options to keep your configurations manageable
    and flexible.


    Next, we will utilize some of the hapi authentication plugins described above
    and explain how to utilize hapi for your authentication needs.'
  - '[PAGE 76]


    From the beginning, authentication has been front and center in hapi. A robust
    application framework must consider authentication for any useful adoption to
    take place. There are a large number of authentication strategies that now exist
    for hapi. One of the nice things about the approach that hapi takes to authentication
    is that while it''s central to the framework itself, the strategies are expected
    to be provided by external modules. Even to support basic authentication, an external
    module needs to be installed. As a result, there are many options, some competing,
    which are available to hapi developers.


    # Chapter Overview


    The following chapter will cover many details on authentication in hapi. Specifically,
    the following plugins will be covered.


    +   - hapi-auth-basic

    - hapi-auth-cookie

    - bell (with hapi-auth-cookie)


    # Scheme vs strategy


    It can be a bit confusing when talking about authentication on what the difference
    is between a scheme and a strategy.


    You can think of a scheme as a general auth type like basic or digest. A strategy
    is a preconfigured and named instance of the scheme. Another way to think about
    it is an authentication strategy sets how to authenticate technically/mechanically.
    The strategy can be third party OAuth strategy, a db, cookies, basic, or any custom
    one you can think of. We rely on authentication. An authentication scheme sets
    up who is authenticating. The scheme could be an admin, user, or custom thing.


    Coming up, we will talk about the hapi-auth-basic plugin. The strategy for this
    is simple and it uses the basic scheme to implement it. It is simple because it
    is just a simple object. When you register the hapi-auth-basic plugin, it creates
    a scheme with'
  - "[PAGE 77]\n\n# CHAPTER 7: Authentication\n\nthe name of basic. This is done with\
    \ the server.auth.scheme() method. Once the hapi-auth-basic plugin has been registered,\
    \ you use the server.auth.strategy() function to create a strategy with the name\
    \ of simple, which refers to our scheme named basic. Finally, you tell a route\
    \ to use the strategy named simple for authentication.\n\nAs you go through this\
    \ chapter and see specific examples, these concepts should make more sense.\n\n\
    # hapi-auth-basic\n\nThe next step up from a hard-coded username and password\
    \ is basic authentication. It's not much more secure than a username and password\
    \ being passed in the clear, but it does serve a purpose for some internal applications.\
    \ Aside from that usefulness that may or not exist, it make for a simple starting\
    \ point in understanding hapi authentication.\n\nIn the early days of Chapter\
    \ 6, the basic authentication scheme was baked into the module itself. Hapi has\
    \ evolved and as authentication grew, so we needed to split hapi up into plugins.\
    \ You will need to install the hapi-auth-basic plugin in hapi to get any basic\
    \ authentication support in hapi.\n\nFor any authentication to support it, you\
    \ must first have a scheme registered with the server. The scheme is the heart\
    \ of authentication that will take place. In the case of hapi-auth-basic the scheme\
