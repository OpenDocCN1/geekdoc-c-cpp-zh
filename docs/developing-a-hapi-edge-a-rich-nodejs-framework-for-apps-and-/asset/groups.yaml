    \ throw err;\n    }\n    if (process.env.DEV) {\n      console.log('handlers:');\n\
    \    }\n    plugin.expose('handlers', handlers);\n    next();\n  });\n}\n```\n\
    \n你可以看到 `options` 没有在任何地方使用。然而，`options` 可以用来配置插件。假设我们想为 `blipp` 插件传递一些选项。记得这个插件只是在启动时列出路由。虽然目前路由还不支持此功能，\n\
    \n# 第 6 章：插件\n\n可以想象，你并不希望 `blipp` 在启动时实际上用颜色打印路由表，因此你可能想给它传递一个标志，说明只进行不带 ANSI\
    \ 颜色的打印。我们应该看到类似下面的内容而不是原始代码：\n\n```javascript\nserver.register([\n  { register:\
    \ Blipp, options: { colors: false } },\n  HapiAuthCookie,\n  Authentication,\n\
    \  Controllers,\n  Models,\n  Routes\n], function (err) {\n  if (err) {\n    console.log('server.register\
    \ err:', err);\n    return callback(err);\n  }\n\n  server.start(function () {\n\
    \    console.log('server started on port: ', server.info.port);\n    return callback(null,\
