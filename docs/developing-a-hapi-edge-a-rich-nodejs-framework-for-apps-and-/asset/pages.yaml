- pgno: 14
  md: '# Introduction to hapi 1


    ![](img/79450811086e2fc8749ec4d309ea2b79_14_0.png)


    # History


    hapi''s origin would start at Yahoo! late in the year of 2010 on a project called
    Sled. Sled was a collaborative list-making tool written as an experiment to explore
    empowerment through restrictions by Eran Hammer. Sled was written in node and
    Eran fell in love with the technology. Sled was eventually shut down and was generously
    open-sourced by Yahoo! as Postmile in August of 2011. Wanting to continue with
    node, Eran left for Walmart where he took the good parts of Postmile and hapi
    was born on the 5th of August, 2011. Tasked with working on a web services layer,
    the development of hapi continued at Walmart. The original versions in hapi used
    the Express framework. However, it was eventually realized that there were limitations
    with Express that made it not suitable for the particular requirements faced at
    Walmart. While Express was great, it was missing a lot of things and hapi evolved
    to its own standalone framework.


    The name hapi comes from HTTP API server, and once the name was repeated, the
    connection to Ren & Stimpy was made, a cult cartoon from cartoon network. The
    “Happy Happy Joy Song” was featured in many of the early presentations of hapi.


    With the Ren and Stimpy theme in mind, other tools in the hapi.js framework started
    referencing the show in one way or another, with the ultimate goal is that coding
    could be'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'fun as coders can be a bit silly when we write code even though we''re put
    in large enterprise environments. Relax, and have a bit of fun.


    Feature-wise, hapi was designed to prevent recurring problems experienced by other
    frameworks at the time. That included problems like middleware ordering problems,
    lack of isolation, slot path matching, testability, and lack of commonly used
    built-features. Middleware ordering problems are solved by the hapi Lifecycle,
    which provides controlled, dependency-mapped hook throughout the life of a request
    when it hits the server, after a response is returned to the user. The lack of
    isolation was solved by domains and last replaced with an even better service.
    Path matching in hapi is built for speed and flexibility. hapi code is testable
    from finish (and is well-tested, itself!). Finally, via the hapi universe (https://github.com/hapi),
    there are dozens of official plugins that are as robust, well-tested, and flexible
    as hapi itself. This is addition to the hundreds of community modules available
    on NPM.


    Designed and built entirely in open-source, hapi has also set a very high bar
    for source projects. From the thoroughly complete code coverage (a process ingrained
    from the beginning thanks to Wyatt Preault) to incredibly detailed release notes
    and well-organization, using hapi and related modules can trust that it works
    reliably and behaves as expected.


    hapi has an incredibly long list of satisfied users - not least of which is WalmartLabs
    itself, who has prided itself on having the Node.js deployment in the world thanks
    to Black Friday.


    There are a lot of reasons to use hapi. Try it and you will see what a pleasant
    developing web applications in Node.js can be.


    > hapi was able to handle all of Walmart mobile Black Friday traffic with about
    10 CPU cores and 28Gb RAM (of we used more but they were sitting idle at 0.75%
    load most of the time). This is mind blowing traffic through VERY little resources.
    — Er Hammer, https://github.com/hapi/hapi/issues/1326


    # Book overview


    This book will walk you through the process of developing a basic web application
    with hapi. We will be building a searchable repository of hapi plugins. A live
    demo is available at hapi-plugins.com.


    The first seven chapters are all about creating and configuring a hapi server.
    These chapters also cover a lot more tangential information in case you need to
    build in or a feature not found in hapi-plugins.com. The next two chapters (8,
    9) cover how to obtain data, process, and format it. The last three chapters (10,
    11, 12) cover some more advanced topics including some very useful industry best
    practices.


    +   1. Introduction

    This first chapter introduces hapi, the book overview, coding style guidelines,
    and a short walkthrough of the demo application.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   2. Server


    This chapter focuses on the configuration of a hapi server. It also covers commonly
    used best practices, examples, and how to customize within the request lifecycle.


    +   3. Routes


    Routes map URLs to this chapter, you will gain a thorough understanding of how
    to match complicated patterns.


    +   4. Handlers


    Handlers are functions responsible for receiving a request from users and returning
    a response. In this chapter, you will see all of the different ways hapi can respond
    to requests.


    +   5. Validation


    Validation (through Joi) is another amazingly helpful feature of hapi. This chapter
    illustrates just how powerful validation is and how it can make developers'' lives
    easier.


    +   6. Plugins


    Plugins are middleware done "right." This chapter shows you how plugins enable
    cross-functional, remote teams to work together without causing any of the problems
    typically associated with middleware.


    +   7. Authentication


    This chapter provides a thorough step-by-step walkthrough of how to enable authentication
    and set cookies.


    +   8. Models


    This chapter walks through connecting to a third-party RESTful API for your hapi
    web application. Then, it also walks through connecting to a MongoDB database
    for your hapi web application. It also showcases examples of how to operate in
    two other popular databases (Cassandra & PostgreSQL).


    +   9. Templating


    In this chapter, you will see how to separate data from presentation in the handlers''
    responses.


    +   10. Testing


    Testing is often misunderstood or difficult to learn. This chapter will empower
    you to add tests to your web application, which improves robustness and code quality.


    +   11. Debugging


    This chapter walks through some of the hard-earned debugging tricks we''ve learned
    running one of the largest Node.js deployments in the world. In this chapter,
    you will learn how to inspect a running service, track statistics, trace memory
    leaks, and identify other problems.


    +   12. Security


    This chapter covers some industry best practices regarding securing your web application.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# CHAPTER 1: Introduction to hapi


    +   13. Appendix


    This chapter stores the appendix with descriptions and code examples for other
    selected databases, and templating engines.


    # hapi-plugins.com


    ![](img/79450811086e2fc8749ec4d309ea2b79_17_0.png)


    In this book, we will walk through how to use hapi to create the backend services
    for a real (but basic) web application, hapi-plugins. hapi-plugins (hapi-plugins.com)
    is a search-repository for hapi-related modules available on NPM.


    This book will NOT cover how to build the client-side JavaScript portion of the
    application. However, the complete source code is available on GitHub.


    # Style


    We will be following hapi style-guidelines throughout this book. To find more
    about what they are, you can see them at the hapi Style Guide.


    We may not agree with everything in the styles, but it''s worth noting that just
    having this style guide to follow prevents time taken up by discussion. It''s
    99 percent good. Some practices may look odd, but it really helps with the visualization
    of the code. We recommend choosing this style not for projects related to hapi,
    but for node development in general.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'We are relentlessly strict about our guidelines when it comes to style. Style
    is something that should be one of the simplest concepts in programming to actually
    follow, yet we''ve found many get sloppy. If you follow the simple things, then
    it shows you''re not paying attention to what you''re doing. Therefore, we''ve
    taken to the idea that the further away the code is from the style, the closer
    the code needs to be scrutinized during code review.


    In addition to ending up with clear and concise code throughout the programs (which
    is a blessing on its own), we also pay close attention during code reviews trying
    to find anything that''s out of place. That forces us to scan every single line.
    This is a good thing because it helps catch oddities not just on a large scale,
    but smaller bugs as well.


    # Summary


    Without further ado, let us begin in the next chapter with the happi server.'
  merge: -1
