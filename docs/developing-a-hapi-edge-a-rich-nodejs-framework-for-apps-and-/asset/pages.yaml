- pgno: 70
  md: "plugin.bind is used when we want to be able to access some piece of data throughout\
    \ the application but we don't want to keep loading it. This can be initializing\
    \ or reinstating some piece of data and we only need to do it one time, perhaps\
    \ setting up a session, or something else specific to the whole lifecycle of the\
    \ app.\nOur lib/routes.js has examples of both use-cases.\n\n```\nplugin.dependency('controllers');\n\
    plugin.dependency('models');\nvar Controllers = plugin.plugins.controllers.handlers;\n\
    var Models = plugin.plugins.models.models;\nplugin.bind({\n  models: Models\n\
    });\n```\n\nThe routes require the controllers to be set up first since they contain\
    \ the handlers that uses routes. The models will be used in the routes route.\
    \ In addition, because of the bind, the database models will now be accessible\
    \ anywhere in the handlers as simple this.models.\n\n# Plugin configuration\n\n\
    Previously, you may not have noticed that there was an arguments that was passed\
    \ when registering a plugin via the register function. To show you again:\n\n\
    ```\nexports.register = function (plugin, options, next) {\n  load({path: __dirname\
    \ + '/handlers'}, function (err, handlers) {\n    if (err) {\n      throw err;\n\
    \    }\n    if (process.env.DEV) {\n      console.log('handlers:');\n    }\n \
    \   plugin.expose('handlers', handlers);\n    next();\n  });\n}\n```\n\nYou can\
    \ see that options wasn't used anywhere. However, options can be used to configure\
    \ the plugin. Let's suppose we wanted to pass some options for the blipp plugin.\
    \ Recall this plugin just lists the routes on startup. While routes don't currently\
    \ support this,"
