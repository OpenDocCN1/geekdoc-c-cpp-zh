- pgno: 36
  md: "# Routes 3\n\nIn most places, the term route is associated with a certain path\
    \ you can take to get to your destination. When driving from point A to B, for\
    \ instance, you may have the option of several different routes. A route is a\
    \ very specific path between the two points.\n\nIn hapi and other frameworks,\
    \ a route is a specific path that a request takes. On a website, the number of\
    \ characters you can write after the address hapi-plugins.com are only limited\
    \ to the number of characters your browser will support. But in order to send\
    \ a request and actually get a response for what you're looking for, you need\
    \ to know the route of where to send the request. The query then travels through\
    \ a known path within the framework, and a response is returned back on several\
    \ parameters as part of the request. The actual route you told the query to take\
    \ is key for knowing how to handle this request. It's the server's first indication\
    \ of what the client is expecting it to do with the request.\n\nIn its simplest\
    \ form, a route looks like the following:\n\n```\nserver.route({\n  method: 'GET',\n\
    \  path: '/',\n  handler: function (request, reply) {\n    reply.view('index');\n\
    \  }\n});\n```\n\nThis is a great and obvious form for short and simple routes,\
    \ but when the project gets larger we separate out the behavior to use config\
    \ instead of supplying the handler like we see here.\n\nWe typically store the\
    \ config in their own file. Before we look at what we've done for this project,\
    \ we will simply even further.\n\nIn lib/routes.js file, we have the following:\n\
    \n```\nvar Welcome = require('./controllers/welcome');\nserver.route({\n  method:\
    \ 'GET',\n});\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: "# CHAPTER 3: Routes\n\n```\npath: '/'\nconfig: Welcome.index\n);\n```\n\nThen\
    \ the actual config for the route is in a corresponding file called 'lib/controllers/welcome.js'.\n\
    \n```\nmodules.export.index = {\n  description: 'Show the main page for our welcome\
    \ page',\n  handler: function (request, reply) {\n    reply.view('index');\n \
    \ }\n};\n```\n\nThis keeps the code logically separated, which is typical of a\
    \ MVC (Model-View-Controller) framework. The logic in the code can get quite extensive,\
    \ and with this separation, it can be easily organized so that all logic for a\
    \ particular route is all in one file. You may decide to go that route, which\
    \ would be as simple as keeping that logic in a file lib/controllers/welcome/index.js\
    \ instead. Perhaps terms of service would be in lib/controllers/welcome/tos.js\
    \ under this structure. Of course, there has be some sense to how large a function\
    \ splits out into its own file. But the idea is that the code, when broken up\
    \ into smaller pieces, is far easier to manage and read.\n\n# Path processing\n\
    \nRoutes are unique. Several issues on GitHub have been opened asking about regular\
    \ expressions, or other types of globbing. It can be difficult to figure out when\
    \ routes overlap. One of the early design goals of hapi was to ensure that the\
    \ routing table would be identical each time it loaded. There would be no surprises.\
    \ When starting up, hapi will complain about any conflicts and protect you from\
    \ these types of issues.\n\nHow path processing works in hapi, the router iterates\
    \ through the routing table on each incoming request and executes the first (and\
    \ only matching) route. Route matching is done on the request path only (excluding\
    \ query and other URI components). The requests are matched in a deterministic\
    \ order, so it doesn't matter where you add them. Finally, the routes are sorted\
    \ from the most specific to the most generic. If you want further details, see\
    \ Path Matching Order.\n\n# Parts of the route\n\nA route object, the argument\
    \ to server.route() consists of just a few easy properties."
  merge: -1
  img_proc: true
- pgno: 38
  md: "# method\n\nThis determines the HTTP request method to be performed on the\
    \ resource. The method will be one of the following: GET HEAD POST PUT DELETE\
    \ TRACE OPTIONS CONNECT PATCH. In practice, it will likely be one of GET, POST,\
    \ PUT, DELETE or PATCH, and HEAD is not allowed. hapi allows wildcard methods\
    \ to be used, which means that when the exact match isn't found, it will use the\
    \ wildcard instead. The wildcard string is *.\n\n# vhost\n\nSpecify, this is a\
    \ virtual host for this route to listen to. A server can be listening to more\
    \ than one virtual host, but in order the route to be triggered for one particular\
    \ host, it can specify the host to listen to. This way, the server can serve up\
    \ the route depending on the vhost defined. The vhost can be defined as either\
    \ a string or an array of strings. The default is to allow any host to use the\
    \ route.\n\n# handler\n\nThe handler is a function that returns the output from\
    \ the route that has been called. It is contingent on the validation and any authentication\
    \ that precedes it. If the handler is defined via the server, then an object with\
    \ the property for the name of the handler, as well as any options, can be passed.\
    \ For a deep dive into the intricacies of the handler, see Chapter 4.\n\n# config\n\
    \nIf need additional configuration for your route, you can use the config section\
    \ to define those. For a simple app, you may not need to specify additional configuration,\
    \ this isn't strictly required. However, for more complex configurations, it is\
    \ better to organize your code under this structure. You move your handler to\
    \ this section so that your configuration is all organized in the same location.\
    \ An example of a more complex configuration is if you want to add validation\
    \ or caching.\n\nIt is important to note that caching here is different than the\
    \ server.cache that was discussed in Chapter 2. That functionality caches actual\
    \ response objects. Caching in this section, is strictly caching. It will set\
    \ the Cache-Control header. Below is a trivial example where it will set a cache\
    \ header for our hour or /hello route.\n\n```\nserver.route({\n  method: 'GET',\n\
    \  path: '/hello',\n  config: {\n    handler: handler,\n});\n```"
  merge: -1
  img_proc: true
- pgno: 39
  md: "# CHAPTER 3: Routes\n\n```\ncache: {\n  expiresIn: 60 * 60 * 1000\n}\nn);\n\
    ```\n\nThere are so many options in the config section, we feel it's better to\
    \ refer you to the documentation. One that we will cover next, however, is route\
    \ prerequisites.\n\n# ROUTE PREREQUISITES\n\nYou may need to initialize a database\
    \ connection and return it for every single endpoint that you're using. This is\
    \ a task's perfectly suitable for route prerequisites. There are of course other\
    \ things you could need to set up, but this is probably the most common. The argument\
    \ for pre is a mixed array. It can contain either other arrays or other objects.\
    \ That which is assigned an array will be executed in parallel, while all the\
    \ other items are executed in series, e:g:\n\n```\nserver.route({\n  method: 'GET',\n\
    \  path: '/',\n  config: {\n    handler: function (request, reply) {\n      reply.view('index');\n\
    \    },\n    pre: [\n      series,\n      series,\n      [\n        parallel,\n\
    \        parallel\n      ],\n      series\n    ]\n  }\n});\n```\n\nEach series\
    \ and parallel item in the pre array are objects with two properties method and\
    \ assign.\n\n```\nvar dbSetup = function (request, reply) {\n\nDB.getConnection(function\
    \ (err, connection) {\n\n  return reply(connection);\n\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: "```\n);));\nserver.route({\n  // ...\n  config: {\n    pre: [\n      { method:\
    \ dbSetup, assign: 'connection' }\n    ],\n    handler: function (request, reply)\
    \ {\n      var conn = request.pre.connection;\n      conn.exec('select * from\
    \ blah', function (err, result) {\n        if (err) {\n          var msg = 'DB\
    \ call failed';\n          return reply(Boom.internal(msg));\n        }\n    \
    \    return reply(result);\n      });\n    }\n  }\n});\n```\n\n# path\n\nPaths\
    \ are divided into segments by the / character. That means that anything not part\
    \ of is a segment.\nIt's important to note early that parameters per segment are\
    \ not allowed. Because of the hapi rule to always have the routes in a predictable\
    \ order, hapi does not support any sort of regular expression syntax because it\
    \ becomes difficult to tell when paths overlap. But what hapi allows is using\
    \ both optional parameters, wildcard parameters and match multiple segments of\
    \ a path.\n\n# SIMPLE PATH\n\nThe named parameterized by parts of the path are\
    \ identified using curly brackets as shown: /fixed/:name. In the handler, the\
    \ request object will have a params object. You should use the name parameter\
    \ in the handler with request.params.name. We will cover more details on the request\
    \ object in Chapter 4.\nThere are many options for constructing the path. They\
    \ are later accessed via request.path in the handler, which is also discussed\
    \ in more detail in Chapter 4.\nTo illustrate:"
