- pgno: 147
  md: '# CHAPTER 11: Debugging


    # REPL


    In order to make it easier to debug running applications on remote servers the
    hapi plugin reptile was created.


    This plugin creates a REPL that listens on a port for TCP connections that have
    access to the running hapi server object. A REPL is a read execute print loop,
    and is a great way to modify a running server or simply inspect what is happening
    on it. By default, the REPL is only accessible from the localhost. This is done
    by design, to prevent anyone from gaining access to the REPL, which has the potential
    to cause issues on the application.


    The REPL that is accessible on the port is the same as that when you type node
    without any arguments. By using the REPL module that ships with node core. The
    only difference is that server is added to the global context.


    In order to create a connection to the REPL port, you can use netcat or telnet.
    When you run the server in /example folder inside of reptile, it will create a
    dummy server and create the reptile plugin. The example server listens on port
    9000. Below is how you connect using netcat to the local port 9000.


    ```

    $ nc localhost 9000

    ```


    After a connection is established you should see what objects are available on
    the global object. To do this, simply type global and press Enter. From this point,
    you can navigate through existing objects or create handlers for events. This
    should provide a nice hook into the running server that you can use for debugging
    purposes.


    # Heap Snapshots


    Some of the most difficult problems to debug are those that cause your process
    to crash. A common method for debugging these issues is to simply look at the
    stack output when the exception occurs. Another useful tool is to use v8 in the
    world of v8 to create a snapshot of the heap at the moment the exception takes
    place and analyze it. To address both of these issues use the poop module. The
    poop is a hapi plugin that listens for the process uncaughtException event to
    fire. When an uncaught exception occurs, a heap snapshot file is created and the
    exception details are logged to a file. Poop will also rethrow the exception so
    that the exception can propagate and be handled by other subscribers.


    The heap snapshot ends with the extension .heapsapshot. These files can be opened
    with the chrome v8 web inspector. To open a file, launch the web inspector and
    select the "Profiles" tab, then click the "Load" button to open a snapshot file.
    The screenshot shows how this tab looks in the inspector.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Core Files


    ![](img/79450811086e2fc8749ec4d309ea2b79_148_0.png)


    After you select the heap snapshot in the profile tab, you can drill into the
    objects on the heap. Not only, but the profile tab also lists the size of each
    of the objects on the heap. This is useful for helping to identify memory leaks
    in an application, as you can find large numbers of objects consuming a large
    percentage of the servers'' memory. A screen-shot of the heap snapshot in the
    profile tab is shown here.


    # Core Files


    One of the more powerful tools to use when debugging an issue with a Node process
    is to drop a core file of the running process and investigate it with the modular
    debugging (mdb) tool in SmartOS. Core files are now able to be created on Linux
    and analyzed in SmartOS. To create a core on Linux you will need to have a newer
    version of node and the ulimit set to unlimited. Many of the process analysis
    tools like pmap and pfiles


    149'
