- pgno: 20
  md: "# Server 2\n\nhapi is a framework used for building applications and services.\
    \ Behind every service, there is a server; something that serves the client needs.\
    \ hapi is at its core a superset of an HTTP server. Everything around hapi is\
    \ tied to this fact, so we kick off this book talking about the main functionality.\
    \ It's from this everything else is configured and makes a difference. We're going\
    \ to be talking about lot of concepts that are related to the server, plugins,\
    \ handlers, testing, and more.\n\nIn this chapter we look at how to set up a server\
    \ and how we've set up the server for our hapi-plugins.com example. We're going\
    \ to teach you the ins and outs of the server in the hapi framework. You'll know\
    \ to know how to set up caching. You'll get a first glimpse into plugins and how\
    \ to add methods that will be available throughout your application. Finally you\
    \ will learn about the request lifecycle and how to add custom functions for your\
    \ application.\n\n# Setting up a simple server\n\nOf course we can't start a book\
    \ without first having a hello world example. Well, yes we can actually, but we're\
    \ not going to. It's important to know how to set up a server in its simplest\
    \ configuration before advancing to more complex setups.\n\n```\nvar Hapi = require('hapi');\n\
    var server = new Hapi.Server();\nserver.connection();\nserver.route({\n    method:\
    \ 'GET',\n    path: '/',\n    handler: function (request, reply) {\n        return\
    \ reply('hello hapi');\n});\n```"
  merge: -1
  img_proc: true
- pgno: 21
  md: "```\n));\n\nserver.start(function (err) {\n  console.log(server.info.uri);\n\
    });\n```\n\nWe created an instance of a hapi server. We don't actually have to\
    \ do anything at all to configure it. The next step is to get a connection to\
    \ the server. The connection is the host and port that the server is listening\
    \ to. By default, the host is set to localhost and the port is generated randomly\
    \ on ports that don't require system administrator access, and that are available.\
    \ Since we don't know what the port is, we print the URI out at the end so we\
    \ can see where our server is listening.\n\nWe add a route so that we have somewhere\
    \ we can actually send a request. We'll go a lot further into routes in Chapter\
    \ 3, but for now, think of a route as a configured path that the request from\
    \ the client (browser) can take in order to have a particular response served.\n\
    \nAt this point we start the server, and log the server URI so that we know what\
    \ the server started on.\nThe next logical steps would be to set a port for our\
    \ server to start on so that we know it's the same each time. This can be accomplished\
    \ by using the options for the connection: `server.connection({ port: 8088 });`\n\
    \n# Setting up the server for hapi-plugins\n\nNow we have a basic understanding\
    \ of how to set up a server, let's examine what we'll need to do up the server\
    \ for hapi-plugins.\n\nA typical architecture for a Single Page Application (SPA)\
    \ is to have some HTML templates served through a front-end framework such as\
    \ Ember, AngularJS, React or others. We've chosen to use React for our front-end.\
    \ The information served through back-end methods of API serving to the data,\
    \ but a cleaner approach is to have a separate API server handle the data and\
    \ this is the approach we have decided to use.\n\n```\nvar internals = {\n  servers:\
    \ {\n    http: 8080,\n    host: '0.0.0.0',\n    labels: ['http']\n  },\n  api:\
    \ {\n    port: 8088,\n    host: '0.0.0.0',\n  },\n```"
