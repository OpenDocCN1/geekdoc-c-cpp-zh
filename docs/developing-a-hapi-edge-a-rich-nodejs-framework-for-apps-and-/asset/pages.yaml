- pgno: 75
  md: '# poop


    In line with hapi''s goal of being silly, poop is a plugin for doing a process
    dump on exceptions. It provides a heapdump (https://www.npmjs.com/package/heapdump)
    and a log file will also be provided containing additional details for debugging.


    # More plugins


    You can find a large list of plugins at hapijs.com under Plugins.


    # Summary


    Often hapi plugins started as being part of the core project. As the project grew,
    many sections of hapi were broken into their own plugins. This happened for a
    variety of reasons. It helps keep things small and manageable. It can be useful
    to reuse for other applications. It can also be useful to separate out responsibilities
    between large teams.


    Writing plugins can also drive the design in hapi applications. They keep it easy
    to manage the application and allow for configuration-driven servers. We''ve shown
    you how they are and how to use options to keep your configurations manageable
    and flexible.


    Next, we will utilize some of the hapi authentication plugins described above
    and explain how to utilize hapi for your authentication needs.'
