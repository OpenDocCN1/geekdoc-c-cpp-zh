    \ The additional sort and fields inputs are optional. However, if they are provided,\
    \ they must be a valid string. If the request to the API fails to give this, the\
    \ error for the front-end will be very obvious and makes it easy to debug for\
    \ the consumer.\n\nYou may notice that Xss is used. This is explained in more\
    \ detail in Chapter 12, but helps prevent cross site scripting attacks.\n\nAnother\
    \ important thing to notice with this example, is that for homepage you can see\
