  md: '# CHAPTER 11: Debugging


    are SmartOS only. This may be enough of a reason for people to stay strictly SmartOS
    dumping on Linux only to have to analyze it on SmartOS later. But the option for
    Linux cores does exist.


    Joyent has made an effort to improve the debugging node.js on SmartOS by adding
    commands to mdb that can be loaded after a Node core is loaded. In Node 0.12.0
    and later there are also commands, such as dcms, which include nodebuffer, jfunctions,
