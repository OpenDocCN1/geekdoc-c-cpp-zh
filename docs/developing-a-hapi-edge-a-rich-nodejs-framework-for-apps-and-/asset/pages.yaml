- pgno: 59
  md: "```\nrequest.payload.datafile.pipe(FS.createWriteStream(\"out\"));\n  reply(\\\
    'yeah, so... done.');\n});\n```\n\nRecall in the payload section of this chapter,\
    \ we can utilize the request.payload object for methods such as POST. Notice that\
    \ we're giving specific options on how to handle payload. A default payload is\
    \ limited to 1mb. This is to prevent malicious/or incompetent users from bringing\
    \ down your app, and is one of many features that separatehapi from other frameworks\
    \ that pay less attention to security features. Users send very large files, the\
    \ server can run out of memory. This can be used as an attack to take your services\
    \ down. In this case we have raised the size of the upload to handle larger files\
    \ by changing the default maxBytes value to something more practical.\n\nBecause\
    \ we're receiving a file, we have chosen to create readStream so that we can pipe\
    \ the output directly to a file, database, or whatever storage method that's preferred.\
    \ By moving the file's contents in chunks from the request into the readstream\
    \ as we receive them, avoiding needing to store the entire file in our apps memory\
    \ before storing it somewhere else. This saves precious time and memory.\n\nAlthough\
    \ the default for parsing is raw, we have chosen to include it here. This field\
    \ tells whether the data will need to be processed gunzipped (compressde) or raw.\
    \ true gunzip means the file will be processed.\n\nA few mime-types are supported\
    \ and looking at the \"encrypt\" at our form above, we can see that we're using\
    \ \"multipart/form-data\". hapi supports the following:\n\n+   * application/json\n\
    * application/x-www-form-urlencoded\n* application/octet-stream\n* text/*\n* multipart/form-data\n\
    \nIn the handler, we create a writeStream for the file and piping the data to\
    \ it. Done and done!\n\n# Summary\n\nIn this chapter, we learned all the ways\
    \ to use handlers to process and return different types of responses. Next, you\
    \ will see how you can validate inputs and outputs from handlers and save yourself\
    \ a lot of time dealing with improper data."
