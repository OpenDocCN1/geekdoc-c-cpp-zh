    \ {\n    if (response.source && response.source.context) {\n      response.source.context.title\
    \ = \"Hapi-Plugins\";n    }\n  }\n  return reply();\n});\n```\n\nThe above example\
    \ using onPreResponse, which we learned in Chapter 2\nServer, the request lifecycle\
    \ cycle. We are using the server.ext to extend this func-\nsion, right before\
    \ the response is given, we are adding this title context.\nAn alternative method\
    \ is to merge a shared object into the view context:\n\n```\n// Inside the server.js\n\
    server.ext('onRequest', function (request, next) {\n  // This could be loaded\
    \ asynchronously from the database\n  request._sharedContext = {\n    title: 'Hapi-Plugins'\n\
    \  };\n  next();\n});\n```\n\nHere we are using the onRequest part of the request\
    \ lifecycle instead. Like the previ-\nous example, we are extending this part\
    \ of the request lifecycle by using the serv-"
