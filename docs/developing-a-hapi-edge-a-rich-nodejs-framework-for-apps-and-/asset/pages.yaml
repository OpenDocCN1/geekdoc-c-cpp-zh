    \    name: Joi.string().required(),\n    authors: Joi.array(),\n    keywords:\
    \ Joi.array(),\n    dependencies: Joi.array(),\n    dependents: Joi.array(),\n\
    \    homepage: Joi.string().allow('\n    version: Joi.string(),\n    license:\
    \ Joi.string(),\n    description: Joi.string(),\n  }))\n}\nhandler: function (request,\
    \ reply) {\n  var query = null;\n  var sort = null;\n  if (request.query.q) {\n\
    \    query = Xss(request.query.q);\n  }\n  if (request.query.sort) {\n    sort\
    \ = Xss(request.query.sort);\n  }\n  DB.plugin.search(query, sort, function (err,\
