  md: "# Liking a plugin example\n\nAs a large example, we're going to take a look\
    \ at what is happening behind the scenes when we use a plugin on the site. Below\
    \ is the example.\n\n```\nmodule.exports.like = {\n  auth: 'session',\n  handler:\
    \ function (request, reply) {\n    var pluginName = request.params.name;\n   \
    \ var username = request.auth.credentials.username;\n\n    if (!username) {\n\
    \      return reply (Boom.unauthorized);\n    }\n\n    var getPlugin = function\
    \ (user, next) {\n      DB.plugin.get(pluginName, function (err, plugin) {\n \
    \       if (err || !plugin) {\n          var msg = 'no such plugin found';\n \
    \         return next (Boom.notFound(msg));\n        }\n        return next (null,\
    \ plugin, user);\n      });\n    };\n\n    var addLike = function (plugin, user,\
    \ next) {\n      user.like(plugin, function (err) {\n        return next (err);\n\
    \      });\n    };\n\n    Async.waterfall([\n      getOrCreateUser,\n      getPlugin,\n\
    \      addLike\n    ], function (err, result) {\n      if (err) {\n        return\
    \ reply(err);\n      }\n      return reply({success: true});\n    });\n  }\n};\n\
    ```"
