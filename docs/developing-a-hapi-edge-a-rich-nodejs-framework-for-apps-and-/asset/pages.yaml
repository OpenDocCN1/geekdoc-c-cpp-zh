  md: "# CHAPTER 9: Templating\n\ner.ext function. Below we use a handler to merge\
    \ the sharedContext before we-reply with the template.\n\n```\n// Inside the handler\n\
    var Hoek = require('hoek');\n/* ... */\nhandler: function (request, reply) {\n\
