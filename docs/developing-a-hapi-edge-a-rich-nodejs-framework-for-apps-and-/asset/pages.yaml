  md: '# # Appendix 13


    # # Models


    # History


    Scalable applications typically follow an n-tiered architecture where the application
    service connects to an orthogonal database (meaning it is not tightly coupled
    with the application service and can be managed independently or even swapped
    out completely).


    Today, there are many databases available for use. There are three main classifications
    for databases:


    +   - Relational (RDBMS)

    - NoSQL

    - Other


    Relational databases are the horsehorse of databases. They''ve worked effectively
    for decades and proven performance characteristics. However, they do have a learning
    curve and are not always suited for handling sequential data, denormalized data,
    or seriously high performance requirements.


    NoSQL databases are relatively new. Typically, these have a very short learning
    curve and high performance characteristics. However, due to trade offs, they do
    not have all of the features typically associated with Relational databases (like
    transactions, atomicity, data durability, etc.).


    Other databases may include graph data structure databases or anything else that
    does not fit the two above classifications.


    # # Overview of HTTP Clients


    # HISTORY


    When the Internet was completely Web 1.0, most websites and companies did not
    provide developer-friendly APIs. To grab data from a website required developers
    to scrape'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# CHAPTER 13: Appendix


    the website, process the HTML, and search extract data (sometimes manually). Some
    companies started offering SOAP APIs, which (thankfully) died out.


    Web 2.0 applications became the new normal around 2004, which supported APIs with
    XML and JSON responses. Java strongly coupled and adopted XML. With the ubiquity
    of JavaScript being everywhere and amazing open source libraries with AJAX that
    came like jQuery, Dojo, Prototype, JSON basically won. JavaScript &Node.js play
    great with JSON.


    Most APIs today support primarily JSON. Our examples show code for interacting
    JSON.


    To fetch data from HTTP APIs, we have a few options. We will cover two of the
    most popular options: Wreck and Request.


    # WCK


    Wreck is one of the official hip modules written by our very own Wyatt Preul,
    a co-author of this book.


    It was created in response to the new infamous 4 byte memory leak. One of the
    culprits was an underlying piece of code used by the popular Request module.


    Additionally, Request was designed to accomplish a wide range of use cases. Wreck
    takes the minimalist approach and provides only the bare minimum feature set to
    ensure high performance and no memory leaks.


    # REQUEST


    Request is the most well known HTTP module for Node.js. It was originally created
    by Mikael Rogers, a very well known figure in the Node.js community at large,
    but now the project has grown a life of its own. It gained a huge following due
    to its simple, intuitive interface (it is lightyears better than the previous
    long-winded way of manually creating HTTP sockets).


    # Overview of database clients


    hapi-plugins.com uses MongoDB through Mongoose driver so primary examples will
    reflect this choice.


    However, for maximum benefit, this book will showcase separate examples for three
    of the most popular databases used in Node.js projects: MongoDB, Cassandra, and
    Postgres.'
