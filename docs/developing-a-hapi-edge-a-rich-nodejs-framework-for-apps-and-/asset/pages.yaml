    jstack, and jsprint among others.


    You can use mdb by attaching to a process or by passing a file in the core argument.
    Generally, you will find that you are looking at an existing core file. If you
    are attaching to a process you need to pass the p argument to mdb. If you are
    attached or a core is loaded you should load the v8 support into mdb by typing
    :load v8. If you need to load a specific v8.so you can point to the full file
    path. Here is what this process looks like:


