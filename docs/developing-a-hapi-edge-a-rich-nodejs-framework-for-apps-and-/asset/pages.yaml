    \ plugin and set it up as a strategy:\n\n```\nvar Hapi = require('hapi');\nvar\
    \ Basic = require('hapi-auth-basic');\n\nvar server = new Hapi.Server();\nserver.connection({\
    \ port: 3000 });\n\nserver.register(Basic, function (err) {\n  server.auth.strategy('simple',\
    \ 'basic', { validateFunc: validateId });\n});\n```\n\nAfter an authentication\
