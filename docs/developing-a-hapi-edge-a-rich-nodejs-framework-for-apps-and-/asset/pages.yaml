- pgno: 58
  md: "# Uploading files\n\nBeing able to directly upload a file to a website is one\
    \ of the most basic features that we face as developers, however, it's often quite\
    \ difficult to find out how to do this. This section takes you through how to\
    \ handle uploading files and some different options you can take with it.\n\n\
    For our website, we will need to be able to upload packages in order to publish\
    \ them. This allows us to register packages for the plugin site, and the npm becomes\
    \ optional with the user' credentials.\n\nLet's begin with the view. Templates\
    \ will be discussed in Chapter 9, so to refer to how to make the serving up of\
    \ the upload page suit your needs. For now, let's take a look at the HTML code\
    \ required to upload a file.\n\n```\n<!DOCTYPE html>\n<html>\n  <form action=\"\
    /plugin/upload\"\n    encrypt=\"multipart/form-data\" method=\"post\">\n    <p>\n\
    \      Choose a file for upload:\n      <input type=\"file\" name=\"datafile\"\
    \ size=\"40\">\n    </p>\n    <div>\n      <input type=\"submit\" value=\"Send\"\
    \n    </div>\n  </form>\n</html>\n```\n\nThis is a generic upload form that will\
    \ work with whatever back end system you may have at your disposal. Simply it\
    \ will make a file POST to /plugin/upload where the payload for the file is named\
    \ datafile.\n\nOn the receiving side we will have to set up our handler to process\
    \ the data. The code looks like the following:\n\n```\nmodule.exports.postUpload\
    \ = {\n  description: 'Post a file for upload',\n  payload{\n    maxBytes: 209715200,\n\
    \    output: 'stream',\n    parse: true\n  },\n  handler: function (request, reply)\
    \ {\n```"
