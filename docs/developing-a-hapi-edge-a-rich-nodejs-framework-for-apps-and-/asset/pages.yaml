  md: "# CHAPTER 9: Templating\n\n# View Loading\n\nViews are called and loaded from\
    \ inside handlers as part of the reply step. The reply.view function accepts three\
    \ parameters (the last one is optional): the relative path to the desired template\
    \ file, the context to apply to the template, and an options object to override\
    \ global engine specific settings.\n\n```\nhandler: function (request, reply)\
    \ {\n  var context = {\n    content: 'hello world'\n  };\n  // assumes file can\
    \ be found in views.path + '/path/index'\n  reply.view('/path/index', context,\
    \ {compileMode: 'sync' });\n}\n```\n\nAs a reminder, we do not need 'index.html'\
    \ here because we have already defined the extension in the engines portion of\
    \ the server.views function.\n\n# Layouts\n\nLayouts enable you to wrap all templates\
    \ inside another one. This is useful if your website has the same general appearance\
    \ (logo, header, and footer, for example). Then, you only need to design the HTML\
    \ for a general layout and nest the normal template inside the {{content}} context\
    \ variable.\n\n# Configuration\n\nThe most important step in enabling layouts\
    \ is the configuration. Only two additional configuration fields are required:\
    \ layoutPath and layout. The layoutPath tells hapi where to look for layout.{ext},\
    \ where the extension is defined under the engines option.\n\nConfiguration does\
    \ not really change between the different templating systems.\n\n```\nvar Hapi\
    \ = require('hapi');\n\nvar server = new Hapi.Server(\nserver.views({\n  engines:\
    \ {\n    html: require('handlebars') // .html is the suffix hapi\n    will look\
    \ for,\n    path: __dirname + '/views',\n    layoutPath: __dirname + '/views'\n\
    ```\n\n116"
  merge: -1
  img_proc: true
- pgno: 116
  md: "```\nlayout: true\n));\n```\n\n# Usage\n\nUsage is actually very simple after\
    \ a proper configuration. Nothing changes on the handler side:\n\n```\nhandler:\
    \ function (request, reply) {\n  var ctx = {\n    msg: 'Hello world!'\n  };\n\
    \  return reply.view('/path/' + 'templateName', ctx);\n}\n```\n\nThe template\
    \ will be loaded through the content variable in the layout.\n\n# Exclusion\n\n\
    Sometimes you want to apply layouts to all templates, except for certain ones.\
    \ This is exceptionally easy to do. You just need to include a third optional\
    \ configuration parameter to reply.view that sets layout to false.\n\n```\n//\
    \ Inside a handler\nreturn reply.view(template_name, context, { layout: false\
    \ });\n```\n\n# Partials\n\nPartials are great. Partial templates allow you to\
    \ factor out shared snippets of templates to use between other templates. This\
    \ prevents you from being forced to modify code in multi-places; you can edit\
    \ once and reflect in all templates.\n\n# Configuration\n\nTo enable partials,\
    \ you need to add only a single view option, partialsPath, which tellshapi where\
    \ to look for partials. When you reference partials, the paths will be relative\
    \ to this path.\n\nConfiguration does not really change between the different\
    \ templating systems. Some engines, however, may require small tweaks to work\
    \ with hapi's partial system. For example, for Hogan.js mustache templates, there\
    \ is a convenient pre-tweaked version at hapihogan."
