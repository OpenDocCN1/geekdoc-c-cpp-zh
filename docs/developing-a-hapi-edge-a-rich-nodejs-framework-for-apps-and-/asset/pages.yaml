  md: "# CHAP 6: Plugins\n\nWe've already touched on some cases of when to use a plugin,\
    \ let's go over them again and be more specific. Using plugins correctly can help\
    \ you architect your code well.\nYou'll want to create a plugin if there's anything\
    \ that you can do to separate the work from the rest and reuse across different\
    \ projects. You may have started looking at the various plugins for a project,\
    \ and not found one that suits your needs. It's possible to create your own plugin.\
    \ One of the authors found unlike popular frameworks like Ruby on Rails, there\
    \ was no way to have hapi list the different routes that were available from the\
    \ start of the app. A plugin was created just to show some information.\n\nA project\
    \ may be, as mentioned earlier, also based on the routes available. A plugin may\
    \ be completely dedicated to serving up the routes for a specific path. We may\
    \ have all of the routes in the plugin.\n\n```\nplugin.route({\n  { method: 'GET',\
    \ path: '/plugins/upload', config: Controllers.Plugin.GetUpload },\n  { method:\
    \ 'POST', path: '/plugins/upload', config: Controllers.Plugin.PostUpload },\n\
    \  { method: 'GET', path: '/plugins/{name}/download', config: Controllers.Plugin.download\
    \ }\n})\n```\n\nAnd we may have another plugin to handle user information.\n\n\
    ```\nplugin.route({\n  { method: 'GET', path: '/user', config: Controllers.User.get\
    \ },\n  { method: 'PUT', path: '/user/profile', config: Controllers.User.updateProfile\
    \ }\n})\n```\n\nThis will make more sense if you have a large project and you\
    \ need to divide the work because routes take a lot of logic.\n\n# The hapi plugin\
    \ ecosystem: some common plugins\n\nLet's look at some of the popular plugins\
    \ in the hapi ecosystem. You can find more plugins on hapi-plugins.com (of course)\
    \ but we've taken the liberty to show some of the major ones.\n\n# hapi-auth-basic\n\
    \nThis plugin provides basic authentication for logging into the application,\
    \ or just basic authentication in general. Most web-based systems require some\
    \ form of authentication to"
