- pgno: 108
  md: "# Templating 9\n\nIn the last chapter (Chapter 8 Models), we saw how easy it\
    \ was to obtain and store data. Now, we will see how to present the data back\
    \ to the user.\n\nhapi supports most templating engines out of the box. This chapter\
    \ will include working examples for six of the most popular engines: Handlebars.js,\
    \ Mustache.js, Jade, Dust, eco, and ECT. For an overview of them, please see the\
    \ Appendix at the end of the book.\n\nIn a typical web application, the end-user\
    \ uses a URL, the URL maps to a handler in a web server, the handler does some\
    \ business logic to prepare some data, and finally, the web server responds with\
    \ data to the end-user in HTML format.\n\nThere are many different ways to respond\
    \ with HTML. The two primary methods are concatenation and templating systems.\
    \ In the old days of development, HTML was generated by concatenation or adding\
    \ HTML strings with various variants, like as:\n\n```\nvar html = '<html><title>'\
    \ + \npage_title + \n'</title></head><body>' + \ncontent + \n</body></html>';\n\
    return reply(html);\n```\n\nThankfully, this tedious and inflexible method has\
    \ gone out of style and has been replaced by modern templating systems. However,\
    \ this concatenation method is still possible, and some teams may use it for the\
    \ sake of efficiency in the case of one-line responses.\n\nMeanwhile, with respect\
    \ to modern web applications, a templating system merges a template responsible\
    \ for output formatting data into a consistent format - like HTML. For example,\
    \ a Handlebars (or Mustache) template like this:"
  merge: -1
  img_proc: true
- pgno: 109
  md: "```\n<html>\n<head>\n  <title>{{page_title}}</title>\n</head>\n<body>\n  {content}\n\
    </body>\n</html>\n```\n\ncombined with context data like this:\n\n```\nvar context\
    \ = {\n  page_title: 'Templating is fun!',\n  content: '<h1>Hello world!</h1>'\n\
    }\nreturn reply.view('index', context);\n```\n\nwill return HTML output like this:\n\
    \n```\n<html>\n<head>\n  <title>Templating is fun!</title>\n</head>\n<body>\n\
    \  <h1>Hello world!</h1>\n</body>\n</html>\n```\n\nUsing a template, data can\
    \ quickly be added, moved around, or removed entirely. The work can be split up\
    \ - designers work on templates while developers supply contexts. Templates can\
    \ easily be swapped out as part of a redesign or conditionally (show user X design\
    \ if their settings specify a preference; otherwise, V).\n\nSo, a template system\
    \ is less tedious and far more flexible to use than the alternative.\n\n# Configuration\n\
    \nIn hapi, views must be configured before they can be used. Views must know what\
    \ engine(s) to run and where to find files - those are required. The other options\
    \ are not required."
  merge: -1
  img_proc: true
- pgno: 110
  md: "# Options\n\nWhen configuring views, there are three main options to configure:\
    \ engines, compileMode, paths. In the next section, we'll discover the various\
    \ sub-options you may need to make your views work properly.\n\n# ENGINES\n\n\
    The engines configuration object tells views what file extensions to look for\
    \ and what templating engine should be used.\n\nThe engines object expects file\
    \ extensions (without the dot '.') as keys and templating system compilers as\
    \ values. The below example (\"engines-breakdown.js\") would match anyfilename.extension\
    \ and use the some_compiler engine.\n\n```\nengines: {\n  \"extension\": require('some_compiler')\n\
    },\n/* ... */\n```\n\nUsing this system, it is possible to mix and match templating\
    \ systems as long as they use all different file extensions:\n\n```\nvar Hapi\
    \ = require('hapi');\n\nvar server = new Hapi.Server();\nserver.views({\n  engines:\
    \ {\n    html: require('mu'),\n    jade: require('jade'),\n    hbs: require('handlebars')\n\
    \  },\n  defaultExtension: 'hbs',\n  path: __dirname + '/views'\n});\n```\n\n\
    If you do not match templating engines for whatever reason, you should be aware\
    \ of a couple of things. If you want to use the reply.view('templateName', context)\
    \ syntax, it needs to understand what the default extension is. In the above example,\
    \ you can see how we pick hbs as that default extension. This setting isn't required.\
    \ You can just add the extension like reply.view('templateName', context). If\
    \ the file has an extension that isn't your defaultExtension then you need to\
    \ give it that extension."
  merge: -1
  img_proc: true
- pgno: 111
  md: "# CHAPTER 9: Templating\n\n# COMPILEMODE OPTION\n\nThe compileMode option is\
    \ used to tell hapi whether to expect a synchronous templating engine or an asynchronous\
    \ one.hapi expects the engine object to contain a compile method that can either\
    \ be format, but not both. By default, hapi expects synchronous engines. Here\
    \ is a synchronous compile function.\n\n```\n{\n  compile: function (template,\
    \ options) {\n    return function (context, optionsOverride) {\n      // return\
    \ string template integrated with context\n    }\n  }\n}\n```\n\nNext we are doing\
    \ the same asynchronously.\n\n```\n{\n  compile: function (template, options,\
    \ callback) {\n    var error = null;\n    return callback(error, function (context,\
    \ optionsOverride, internalCallback) {\n      var output = ''; /* set with string\
    \ template integrated with context */\n      return internalCallback(null, output);\n\
    \    });\n  }\n}\n```\n\nDepending on the templating engine, you will see later\
    \ on that the default compileMode may need to be overridden to 'async'.\n\n# PATHS\n\
    \nhapi views need to know where to look for template files. There are multiple\
    \ path configurations depending on your project's needs.\n\n+   * path: points\
    \ to the main directory to look for template files\n* partialsPath: points to\
    \ the directory to look for partials (if the engine supports Partials)\n* helpersPath\
    \ points to directory where template helper functions are defined (if the engine\
    \ supports Helpers)"
  merge: -1
  img_proc: true
- pgno: 112
  md: "+   - layoutPath: the directory that contains the layout template (usually\
    \ layout.\\{extension}) or layout.html\n\n+   - relativeTo: path used as a prefix\
    \ to other directories (enables relative paths in the other paths)\n\nAdditionally,\
    \ there are two potentially important path-related settings:\n\n+   - allowAbsolutePaths:\
    \ (boolean) that enables the use of absolute paths in path settings (default:\
    \ false)\n\n+   - allowInsecureAccess: (boolean) that enables support for moving\
    \ up directories (using '..')\n\nThe allowInsecureAccess variable should be used\
    \ with extreme caution. It potentially enable users to access other secure files\
    \ on the server's operating system such as password files, with sensitive data,\
    \ and more.\n\n# GLOBAL VS SPECIFIC\n\nAll of the global view settings can be\
    \ applied to a specific individual templating engine that will override any global\
    \ settings. This requires moving the compiler object (typically\n\n```\nengines:\
    \ {\n  compileMode: 'async',\n  engines: {\n    html:\n      module: require('handlebars'),\n\
    \      compileMode: 'sync'\n    }\n  }\n  path: '/path'\n}\n```\n\n# MORE OPTIONS\n\
    \nMore options are detailed in the API documentation.\n\n# STARTER EXAMPLES\n\n\
    Let's start out with Mustache.js.\n\n```\nvar Hapi = require('hapi');\n```"
  merge: -1
  img_proc: true
