- pgno: 44
  md: '# The handler 4


    The handler at its core, is what handles the incoming request for a specific route.
    It determines how the request will be “handled.” The configuration for the route
    plays a critical part in how the handler needs to behave, and since it''s tightly
    coupled, some configuration for the route needs to be taken into consideration.


    When we specify a route for a request, for example, if you''re going to download
    a file from /downloads/<filename> then it is the handler that has all of the logic
    in it for finding the file in question in order to send it to the connecting client.
    The handler may also do other things, like counting how many times the file has
    been downloaded, access control making sure not just anyone has access to download
    the file, and so on.


    The handler function “handles” all of the decisions and logic between accepting
    a request from the client and returning a response to the user. haki has some
    nice features to offload some work automatically, such as validation. We will
    look at this in more detail in Chapter 5 (why would we dream of doing that though?)


    The handler is generally a callback function that is comprised of two arguments:
    the request and the reply. There are multiple other-built-in handlers that we
    will also go over and discover.


    This chapter will cover the various use-cases for the handler. We''re going to
    delve into the arguments of the handlers and various methods for making life in
    the handler easier for ourselves.


    # The request


    The request object contains all of the information pertaining to the incoming
    request to the server whether it be from a browser, or some other tool using the
    API. Since the routing already determines which request will be handled depending
    on the method, the request received will be limited to whatever is specified.
    At the end of the day, the full request is available here, which contains the
    headers and all of the data content sent.


    Refer back to the request object to find out how the request travels through the
    framework.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "# CHAPTER 4: The handler\n\nAttached to the requests is a whole slew of important\
    \ and useful information that gets used in the handler in order to fulfill a request.\
    \ In the rest of this section we're going to take a look at how to find this data\
    \ and what you can do with it.\n\nBear in mind that there are other functions\
    \ in the request lifecycle (see Chapter 2) that can add data to the request along\
    \ the way. We're going to take a look at a few common ones.\n\n# parameters\n\n\
    Some of the request object data is set as part of direct configuration of the\
    \ route. For instance, if the route has defined a path that contains an id of\
    \ a hapi plugin to download, then that will be part of the parameters access the\
    \ request object.\n\n```\nserver.route([\n  //\n  {\n    method: 'GET',\n    path:\
    \ '/plugins/{name}',\n    config: Controllers.Plugin.get\n  }\n  //\n]);\n```\n\
    \nThe name is the identifier in our case, and this will be accessed via request.params.name.\
    \ In the above example we have a GET method. Assuming port 8080, if we did a:\n\
    \n```\ncurl -XGET http://localhost:8080/plugins/pluginName\n```\n\nWe'd get the\
    \ back with what is returned in Controllers.Plugin.get. We will be contrasting\
    \ this with other methods when we talk about payload.\n\n# query\n\nIt can be\
    \ confusing for new people to hapi, what is the difference between a param and\
    \ a query. The query of the URL in https://hapi-plugins.com/search?q-pluginName\
    \ is the after ?. Take a look at the previous example for /plugins/{name} to contrast\
    \ this. The name param was strictly part of the path.\n\n\nThe request object\
    \ contains all of the key value pairs that are sent along a query in the URL.\n\
    \nFor example, we could be a bit crazy with the URL to get the information about\
    \ a particular plugin on hapi-plugins.com and request something like:\n\n```\n\
    http://localhost:8080/plugins/blipp?hello=hi\n```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "# The request\n\nIf we log the output with console.log(request.query) then\
    \ the result we'll\n printed to the console would show as:\n\n```\n{ hello: 'hi'\
    \ }\n```\n\nIt's worth noting that sometimes the value can be an array.hapi handles\
    \ multiple query\nkeys automatically for you, you do have to be aware that the\
    \ result can be a different\ntype than expected.\nIf the URL looks like the following:\n\
    \n```\nhttp://localhost:8080/plugins/blipp?hello=hi&hello=hey\n```\n\nWe now see\
    \ the value as an array:\n\n```\n{ hello: ['hi', 'hey'] }\n```\n\n# payload\n\n\
    request.payload contains information that has been transmitted as part of the\
    \ request\nthat's not suitable as a query. This may be a file, or a blob of JSON\
    \ or XML. While it's cer-\ntain possible to send payload for all of the request\
    \ methods (GET, POST, DELETE, PUT,\nPATCH, etc), it's typically used for GET.\
    \ If you do end up seeing payload for GET,\ny should probably rethink your design.\n\
    Let's start with a simple example for a handler where we'd utilize the POST method\n\
    of creating a new user.\n\n```\nhandler: function (request, reply) {\n  console.log(name\
    \ is: ' + request.payload.name);\n  console.log(email is: ' + request.payload.email);\n\
    \  return reply('success');\n}\n```\n\nIf you recall when we talked about params\
    \ earlier and the GET method, we wanted to\ncontrast this with payload. For the\
    \ handler, we setup a route as below.\n\n```\nserver.route({\n  method: 'POST',\n\
    \  path: '/user',\n  config: {\n    handler: handler\n  }\n});\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Here you can see the method is POST. In the handler we defined previously,
    you can refer to your payload request.payload. In this case the payload has two
    keys, name and email. We send aPOST on the user'' path. Once this server was up,
    in curl could do something like:


    ```

    curl -XPOST -H "Content-Type: application/json" -d ''"name":

    "Author Name","email": "author@hapi-plugins.com" '' https://

    hapi-plugins.com/user

    ```


    We could also PUT it and it would work the same way.


    # headers


    request.headers is where all of the request headers are stored. Using our previous
    curl, we would see that in your handler, you could refer to request.headers.Content-Type
    and that value would be application/json.


    # The reply


    The reply function in the handler serves as a callback and as a way to return
    control to the framework. The reply function is in charge of replying back to
    the request to give the result of whatever it is that it has been requested.


    Reply takes two arguments in order to comply with the regular callback convention
    where both an err, and result object, result is passed back. In practice only
    one of the two will be used.

    If the first argument is an error object, this will be wrapped in a Boom object.

    The argument type of reply can be a wide range of different types:


    +   - null

    - undefined

    - string

    - number

    - boolean

    - Buffer object

    - Error object

    - Stream object (Stream objects must be compatible with the "streams2" API and
    not be in objectMode)

    - Promise object (hapi''s testing uses the bluebird promise lib)

    - any other object or array'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# Organizing handlers\n\nThere are many ways to organize code. For simple routes,\
    \ perhaps it makes sense to throw everything in a route. Here is the simplest\
    \ example:\n\n```\nserver.route({\n  method: 'GET',\n  path: '/',\n  handler:\
    \ function (request, reply) {\n    reply.view('index');\n  }\n});\n```\n\nHowever,\
    \ when working on large projects, we have found that it can get cluttered to do\
    \ this way. This is where we use the route configuration (see Chapter 3) to make\
    \ life easier for us.\n\nWe have organized the code into /lib/routes.js, which\
    \ is our destination for all of our routes. Whenever we add a new route, or need\
    \ to see the routes, we have all in this one simple location. A nice convention\
    \ to follow. It doesn't have to be a routes.js file, we could also put them in\
    \ lib/index.js. This clearly named file, however, makes it obvious to everyone\
    \ where it is.\n\nA typical setup has the config for the route living in a completely\
    \ different file instead, and in that file is where the handler resides.\nour\
    \ hapi-plugins.com example, has only this in the routes file:\n\n```\nserver.route({\n\
    {\n  method: 'GET',\n  path: '/',\n  config: Controllers.Home.get\n},\n// ...\n\
    });\n```\n\nWhen architected correctly the handlers are large, putting each route\
    \ in their own file can really make the code easier to read. Starting a new route,\
    \ a file with conventions can be copied over and the handler itself modified.\
    \ It makes for a very clear and easy to read structure.\n\nMore discussion on\
    \ the above example can be found in Chapter 6 if you want more details."
  merge: -1
  img_proc: true
- pgno: 49
  md: "# Built-in handlers\n\n# File\n\nFile handlers are used to generate static\
    \ endpoints for serving up files. You are likely to use this with single files\
    \ that don't fit in the directory handler explained shortly.\n\nWe are using the\
    \ file handler to serve up the favicon, or the little specific icon that browsers\
    \ use to associate a website.\n\nWe add the favicon to our lib/routes.js file\
    \ as follows:\n\n```\n```javascript{\n  method: 'GET',\n  path: '/favicon.ico',\n\
    \  handler: Controllers.Static.favicon\n}\n```\n```\n\nThere are multiple ways\
    \ of using the file handler, all of which involve modifying lib/controllers/handlers/static.js\
    \ in our particular setup.\n\n# STRING\n\nThis is how we're using the handler\
    \ for hapi-plugins.com and is the most straight-forward approach.\n\n```\n```javascript{\n\
    exports.favicon = {\n  file: dirname + '../../public/favicon.ico'\n};\n```\n```\n\
    \n# CALLBACK\n\nA callback takes the request object as an argument that returns\
    \ the absolute or relative path.\n\n```\n```javascript{\nexports.favicon = {\n\
    \  file: function (request) {\n    return dirname + '../../public/favicon.ico'\n\
    \  }\n};\n```\n```\n\n# OBJECT\n\nAn object with several options."
  merge: -1
  img_proc: true
- pgno: 50
  md: "```\nexports.favicon = {\n  file: {\n    // a path string or function as described\
    \ above\n    path: __dirname + '/../../public/favicon.ico',\n    filename: '??',\n\
    \    mode: false,\n    lookupCompressed: false\n  }\n};\n```\n\nOur path indicates\
    \ where to find the file to serve up. This can also be set to the callback function\
    \ as discussed above.\n\nThe filename is an optional filename to specify if spending\
    \ a \"Content-Disposition\" header. This defaults to the basename of the path.\n\
    \nMode specifies whether or not the \"Content-Disposition\" will be included.\
    \ By default this is set to false, which means it's not included.\n\nlookupCompressed,\
    \ if true, looks for the same filename with the '.gz' suffix for a precompressed\
    \ version of the file to serve if the request supports content encoding. It defaults\
    \ to false.\n\n# DIRECTORY\n\nA more likely use-case than the file handler is\
    \ the directory to serve up multiple files. It is common in order to serve files\
    \ as images, CSS or JavaScript files used for the front-end.\n\nSimilar to our\
    \ file handler, the route is set up in lib/routes.js and in this case, we're doing\
    \ images and CSS as follows:\n\n```\n{ method: 'GET', path: '/css/{path}', handler:\
    \ Controllers.Static.css },\n{ method: 'GET', path: '/img/{path}', handler: Controllers.Static.img\
    \ },\n{ method: 'GET', path: '/js/{path}', handler: Controllers.Static.js },\n\
    // ...\n```\n\nThe handler is defined in a way that's so similar that we're only\
    \ going to look at the first one as an example:\n\n```\nexports.css = {\n  directory:\
    \ {\n    path: __dirname + '/../../public/css',\n    index: false\n  }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 51
  md: "# CHAPTER 4: The handler\n\nThe path is where the actual data is we'd like\
    \ to retrieve and display. There's a num-ber of options that can be set here as\
    \ well.\n\nWe're first and foremost setting index to false. There shouldn't be\
    \ any need to serve up any index.html in a CSS folder.\n\nThe options for directory\
    \ are as follows:\n\n+   - path - See handler for an explanation of the various\
    \ ways of setting this.\n- index - Can be true, false, or a string representing\
    \ the name of the index file to look for the default index file is index.html\
    \ and it is set to true.\n- listing - Determines whether a directory should show\
    \ in the absence of an index. Defaults to false.\n- showHidden - Determines if\
    \ hidden files should be displayed by the listing. Defaults to false.\n- redirectToSlash\
    \ - if there's a trailing slash, this will be redirected to the path without the\
    \ slash.\n- lookupCompressed - If true, it for the same filename with the '.gz'\
    \ suffix for a pre-compressed version of the file to serve if the request supports\
    \ content en-coding. Defaults to false.\n- defaultExtension - A string that is\
    \ appended to file requests if the requested file is not found. Defaults to empty\
    \ string.\n\n# VIEWS HANDLER\n\nThe views handler displays information using templates.\
    \ In practice, this option isn't very commonly used. The more common approach\
    \ is configuring the server with the views op-tion, and then using the regular\
    \ handler for reply.views().\n\nBecause hapi supports both, we'll take a look\
    \ at the views handler, and focus more on how to configure the server to directly\
    \ support views with reply.views().\n\nFor our hapi-plugins project, we're not\
    \ using a views handler, but it should be men-tioned how it can use. This may\
    \ serve as a case for whatever reason, the regular views.views to be overridden.\n\
    \nIn both cases, the server is configured with a views manager.\n\n```\nplugin.views({\n\
    \  engines: {\n    module: require('handlebars')\n  },\n  path: __dirname + '/views'\n\
    });\n```\n\n52"
  merge: -1
  img_proc: true
- pgno: 52
  md: "We're setting the rendering engine and specifying the relative path from which\
    \ we will be reading the templates. The property in the engines configuration\
    \ sets the file extension that will be used for that particular rendering engine.\n\
    A very basic use-case world would look like the following:\n\n```\nexports.terms_of_service\
    \ = {\n  view: 'terms_of_service'\n}\n```\n\nHere view just takes a string with\
    \ the template filename.\nWhere we'd want to override the server's views configuration,\
    \ it would be more elaborate-rate with the view taking an object:\n\n```\nexports.terms_of_service\
    \ = {\n  view: {\n    template: 'terms_of_service',\n    context: {\n      serviceType:\
    \ 'provider'\n    }\n  }\n}\n```\n\nFor a quick point of clarity, context is the\
    \ json object with the actual data that is sent to your template. In this case,\
    \ your template terms_of_service can refer to serviceType in your template and\
    \ it will fill in the value provider. More discussion on templating is in Chapter\
    \ 9, and depending on the templating engine, this syntax will differ.\n\nIf there's\
    \ no context passed to the object, then it's set to a context object with the\
    \ following properties:\n\n+   - payload - containing request.payload\n- params\
    \ - containing request.params\n- query - containing request.query\n- pre - containing\
    \ request.pre\n\nThe view object can also contain an options property, which can\
    \ serve to override the server view settings.\n\n# REGULAR HANDLER USING SERVER.VIEWS\n\
    \nUsing reply.view() is the most common way to render a template.\nFor the main\
    \ page of hapi-plugins, we're rendering just an index file and we're displaying\
    \ a random quote on the page."
  merge: -1
  img_proc: true
- pgno: 53
  md: "# CHAPTER 4: The handler\n\n```\nmodule.exports.get = {\n  handler: function\
    \ (request, reply) {\n\n    reply.view('index', {\n      finalmsg: internals.quotes[Math.floor(Math.random()\
    \ *internals.quotes.length)]\n    });\n  }\n};\n```\n\nAnd in the template we\
    \ see the following:\n\n```\n<div id=\"finalfrontier\" class=\"col-md-12\">\n\
    \  {{finalmsg}}\n</div>\n```\n\nIf you would like to know more about handlebars,\
    \ you can read more at: handlebarsjs.com.\n\n# proxy\n\nMany starting out with\
    \ a proxy can be an easy way to start in a project. You have some legacy service\
    \ that you want to replace, and a proxy can be a good way to start. In fact, the\
    \ proxy feature was the most heavily used feature of hapi. This is precisely how\
    \ we started to use hapi at WalmartLabs. Below is an example of how you could\
    \ proxy Google.\n\n```\nserver.route({\n  method: '*',\n  path: '/path*',\n  config:\
    \ {\n    handler: {\n      proxy: {\n        host: 'google.com',\n        port:\
    \ 80,\n        protocol: 'http',\n        // 6th redirect get a 300 redirect\n\
    \        redirects: 5,\n        passThrough: true,\n        xforward: true\n \
    \     }\n    }\n  }\n});\n```\n\nWe use a * wildcard for the method. This will\
    \ match any method that comes in. The path setting simply says to route everything.\
    \ Finally, in the config section under handler, we have our proxy. You can see\
    \ we are setting the proxy up for google.com. The re-"
  merge: -1
  img_proc: true
- pgno: 54
  md: "directs says that we should only redirect five times as a max. The pass-Through\
    \ setting specifies whether or not to preserve headers on the original request.\
    \ Finally, the xforward setting tellshapi to add (or append) an 'x-forwarded-for'\
    \ header to the request.\n\nYou can do other powerful things with the proxy handler.\
    \ You can rewrite the request using mapUri, pass local-state from the happen instance\
    \ using localStatePassThrough, reject unauthorized requests with rejectUnauthorized,\
    \ and you can even use a custom function with onResponse to do whatever you want.\
    \ Refer to documentation for more details.\n\nInstead of proxying Google, you\
    \ can proxy your own service here. Proxying is an easy way to get started with\
    \ something simple. As time permits, you can add routes to your application to\
    \ take over that downstream functionality. This approach leads to easier troubleshooting\
    \ due to the smaller change sets.\n\n# Adding common methods to the handler\n\n\
    Sometimes there are functions that will need to be accessed multiple times. When\
    \ that's the case, we can use convenience functions. One way of accessing these\
    \ is to put all such functions in a common library and draw on them.\nhapi, however,\
    \ has a few other solutions up its sleeve to make this process easier.\n\n# Binding\
    \ to server\n\nThrough a binding in the global context, any variable or function\
    \ can be made available on this within the handler function. This can be useful\
    \ if you need shared functionality.\nThe context can be set in a plugin or in\
    \ the top server level.\n\nWe typically use this for some service that we'll need\
    \ to access throughout the application. Some personal insight can be used when\
    \ server methods are used vs the server bind, but in general something that's\
    \ accessible on the server bind would be something that initialized for the duration\
    \ of the app that you don't want initialized each time, as opposed to some convenience\
    \ function that is self contained.\n\n```\nserver.bind(\n  service: new Service()\n\
    );\n```\n\nThis function will be accessible from any of the handlers as simply\
    \ this.service(). This can serve as a useful shortcut.\nFor more information on\
    \ binding see hapis.com/api#serverbindcontext"
  merge: -1
  img_proc: true
- pgno: 55
  md: "CHAPTER 4: The handler\n\n# Decorating the reply\n\nSimilar to server.bind\
    \ this function lends itself to use reply. Decorate is more narrow\nin the scope\
    \ that it can be used, but it's perfect for canned replies.\n\n```\nserver.decorate('reply',\
    \ 'success', function () {\n  return this.response({ success: true });\n});\n\
    ```\n\nWe have an option to decorate the reply object or the server object and\
    \ the first argu-\\gment where we specify which one. The second argument specifies\
    \ the name of the meth-\nd and the third is the call back.\nIn our handler, we\
    \ can simply call:\n\n```\nreply.success();\n```\n\nThis is a very nice shortcut\
    \ and saves from changing in multiple places if the JSON ob-\njerted changes.\
    \ It's also a nice means to make sure the replies for success are consist-\nent\
    \ it eliminates types.\nnYou can find more about decorating the server object\
    \ in Chapter 2.\n\n# Tails\n\nCertain actions do not require immediate completion.\
    \ The type of calls may be a back-\\ground of some sort, which is not necessary\
    \ for the return of the page served to the\nclient. It may be a database call\
    \ for some update, or it may be any number of things. When\nnot necessary to capture\
    \ this, we are still likely to capture this for logging purpos-\nes. When the\
    \ tails are completed for the request, the server emits a tail event.\n\n```\n\
    server.route({\n  method: 'GET',\n  path: '/',\n  handler: function (request,\
    \ reply) {\n    var publishTail = request.tail('publish the book in the\nbackground\
    \ for download');\n\n    HapiBook.publishForDownload({ format: 'pdf' }, function\n\
    (downloadUri) {\n      var mail = Mail({ to: user });\n      mail.publishNotification(downloadUri,\
    \ function () {\n        publishTail();\n      });\n    });\n```\n\n56"
  merge: -1
  img_proc: true
