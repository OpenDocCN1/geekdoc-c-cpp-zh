- pgno: 61
  md: "# Joi validation\n\n+   - false - no variables are allowed at for this section\n\
    - Joi validation object. This is what we've discussed so far.\n- a validation\
    \ function.\n\nThe most typical one that we end up working with is using a joi\
    \ validation object, we'll be focusing on that most. Validation functions can\
    \ also be used for things which don't fit regular joi validation.\n\nValidation\
    \ is configured as part of the route options that get passed to a route. Let's\
    \ say you want to change the password for a user. You want to send a JSON object\
    \ password to the endpoint, and change the password to the one you specified.\
    \ The JSON object would look like:\n\n```\n{\n  \"password\": \"somepass\"\n}\n\
    ```\n\nThen you can set up the route to look like this:\n\n```\nvar routeOptions\
    \ = {\n  validate: Joi.object().keys({\n    params: Joi.object().keys({\n    \
    \  id: Joi.number()\n    }),\n    payload: Joi.object().required().keys({\n  \
    \    password: Joi.string().min(8).required()\n    })\n  }),\n  response: {\n\
    \    schema: Joi.object().keys({\n      success: Joi.boolean().required()\n  \
    \  });\n  },\n  handler: handler\n}\nserver.route({\n  method: 'POST',\n  path:\
    \ '/user/(id)/password',\n  config: routeOptions\n});\n```\n\nWhat we see here\
    \ is pretty typical. This makes sure that the id in the path URL is going to be\
    \ a numeric value. The params key is used and in our server.route, the {id} gets"
