- pgno: 41
  md: "# CHAPTER 3: Routes\n\n```\nvar internals = {};\n\nserver.route({\n  method:\
    \ 'GET',\n  path: '/plugins/{name}',\n  config: internals.config\n});\n\ninternals.config\
    \ = {\n  description: 'A path to get info for a specific plugin',\n  validate:\
    \ {\n    params: {\n      name: Joi.string().required()\n    },\n  handler: function\
    \ (request, reply) {\n    var msg = 'The name of the plugin that was passed is:\
    \ ';n    return reply(msg + request.params.name);\n  }\n};\n```\n\nThe route paths\
    \ contain the parameter name which is then checked for validation to be sure it's\
    \ a string and nothing else. For more validation, see Chapter 5.\nWe access the\
    \ parameter through `request.params` to get the name.\n\n# OPTIONAL PARAMETERS\n\
    \nIn order to specify an optional parameter we use a question mark ?. In regular\
    \ expressions, this also denotes optional matches and captures so this may already\
    \ be familiar to you.\n/plugins/{name?}\nin this case it may be unclear what to\
    \ serve up if the name is missing, but you may use it to serve up a list of plugins.\n\
    \n# WILDCARDS\n\nIf we need to accept any number of segments in order to, for\
    \ example, proxy a query for a particular route, then a wildcard (*) is a life-saver.\
    \ Anything using the wildcard character will be stored as an array in the named\
    \ parameter of the request object. Perhaps if we allowed a query to retrieve all\
    \ and results from npm directly we could allow for the path below:\n/npm/*\nBecause\
    \ of the nature of the capture here, similar to programming languages that allow\
    \ any number of arguments to a function (EcmaScript 6 offers the \"rest parameter\
    \ using ......), you can only have the rest of the parameter wildcard at the end\
    \ of a path.\n\n42"
  merge: -1
  img_proc: true
- pgno: 42
  md: "However, if you explicitly define the number of segments that you're allowing\
    \ on your\npath, you can put other segments after. In order to define the segments,\
    \ you add a numeric\nvalue after the * to indicate how many you allow.\n\n```\n\
    /npm/{search*2}/go\n```\n\nThe above syntax will capture two segments and store\
    \ them in the request.par-\\ams.search name as an array.\n\n# Server router config\
    \ options\n\nThere are just two options that can be set as part of the server\
    \ itself.\nstripTrailingSlash is quite a useful one, but it's false by default.\
    \ The pur-\npose of this route is if there's a route that looks like /plugins/like\
    \ and the re-\n goes to /plugins/like/ then there will actually be a 404 error\
    \ since it didn't\nmatch the route. With this option set, the server will strip\
    \ the trailing slash so that the route\nwill work.\n\nisCaseSensitive defaults\
    \ to true, which means the routes are case sensitive. It\nwould be poor design\
    \ to have a route called /blah and another called /Blah that do\ndifferent things.\
    \ This setting means both are treated the same.\n\n# Summary\n\nRoutes are the\
    \ path that requests go through in our system. It defines how the requests go\n\
    handled, and defines how, and the variables we have access to when processing\
    \ the re-\nquest. Routes in hapi are unique and have no overlapping possibilities.\
    \ They are predict-\ble. Routes can be configured with cache settings as well\
    \ as defined for a specific virtual\nhost (domain name).\n\nNext're going to look\
    \ at the handlers that are defined as part of a route."
  merge: -1
  img_proc: true
