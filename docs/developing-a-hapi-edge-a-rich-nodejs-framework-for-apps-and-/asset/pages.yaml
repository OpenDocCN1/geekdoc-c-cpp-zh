- pgno: 122
  md: 'Next you can see our code example for doing the same thing. Notice that true
    and exist are functions in code.


    ```

    expect(foo).to.exist();

    expect(bar).to.be.true();

    ```


    In addition to the inconsistencies described earlier, we wanted an assertion library
    that was small, simple, and intuitive. lab was stripped out that was dealing with
    plugins, extensions, and the overhead of supporting testing the browser. This
    resulted in much of the functionality we needed, but it resulted in about 300
    lines that is trivial to read and understand.


    Finally, code allowed deeper integration between the test runner and the assertion
    library. This allowed us to get total assertion counts to measure the tests''
    comprehensive and to verify that every assertion created is indeed executed.


    Lab has over other ways as well. For example, transpiler support has been added
    to support CoffeeScript or JSX code. Additionally, lab now has support baked in,
    so that requests to haki follow the same coding style. This has been useful for
    developers to know ahead of time if they are violating any style rules ahead of
    asking for a commit to be merged. One of the drawbacks of lab, however, is that
    it''s designed and runs only on the server at this point. However, this will likely
    change as its popularity grows and more developers desire to use it for client-side
    testing.


    # Installing lab


    Lab may be useful to install globally in your environment. Similarly to other
    node.js modules, the installation of lab can be accomplished using npm. This is
    shown below.


    ```

    $ npm install -g lab

    ```


    While you can install lab globally, you don''t need to. Instead, all of the hapi
    core modules include lab in the devDependencies section of the package.json. Any
    recent version of lab is fine to install globally and locally, as the two won''t
    conflict when running tests. The next example shows how to install lab only locally
    and save it to the devDependencies section of the package.json.


    ```

    $ npm install lab --save-dev

    ```


    After you have installed lab you should verify that it''s working correctly. If
    installed globally, lab will be available in the PATH environment variable. Otherwise,
    you will need to run the lab binary from the node_modules/.bin folder. To verify
    a global lab install, simply run lab -h. If you want to verify a local install,
    then you'
