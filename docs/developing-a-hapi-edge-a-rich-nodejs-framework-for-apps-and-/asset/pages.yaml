- pgno: 126
  md: "# Test scripts\n\nLab also doesn't assume that a JavaScript file in the test\
    \ folder is necessarily a test. Therefore, in order to tell lab that a script\
    \ file is a test script, you must execute Lab.script() and assign the result to\
    \ the lab property of the module.exports object. In order to help catch developer\
    \ mistakes with this style, lab will report any instances script() was executed\
    \ but a lab property wasn't exported. An example of this code is shown here:\n\
    \n```\n// Load modules\n\nvar Code = require('code');\nvar Lab = require('lab');\n\
    \nvar lab = Lab.script();\n\nlab.test('lab exists', function (done) {\n  Code.expect(lab).to.exist();\n\
    \  done();\n});\n```\n\nWith this test, if you run lab, the error message for\
    \ this mistake would look like:\n\n```\n$ lab\nThe file: test/index.js includes\
    \ a lab script that is not exported via exports.lab\n```\n\n# Safe globals\n\n\
    Another assumption of lab is that the global object shouldn't be polluted with\
    \ test features. Whereas other frameworks will attach a describe or it to the\
    \ global object, lab tries a different approach of trying to isolate each experiment.\
    \ Each of the experiment or test functions is only available on a lab object that's\
    \ returned by executing script().Lab takes the global issue a step further and\
    \ checks the global object for new properties that exist after running tests.\
    \ This is usually a sign of a missing var when declaring a variable. However,\
    \ this feature can be disabled by passing -l or --leaks to the lab binary. Similarly,\
    \ if there is a known global that should exist you can pass it as an argument\
    \ to -I or --ignore. For example, if you want to ignore a property named foo,\
    \ set on the global object, you would execute lab as follows:\n\n```\n$ lab --ignore\
    \ foo\n```"
  merge: -1
  img_proc: true
- pgno: 127
  md: "# Experiments\n\nWhile lab tests can be made to look like mocha and jasmine\
    \ behavior driven-BDD style tests, they can also be named something entirely.\
    \ Whereas BDD styles to use describe and it, lab also offers the options to experiment\
    \ and test instead. The functions describe and experiment are interchangeable,\
    \ just as it is and test are. The style you choose is entirely up to you, and\
    \ there isn't a wrong answer. One of the things is nice about using the experiments\
    \ style, however, it does reinforce the notion that an engineer is creating the\
    \ tests and there is some attempt to be scientific about them.\n\nAn experiment\
    \ is useful for wrapping a group of similar tests. For example, if you are testing\
    \ lab itself, you may write experiment tests that are wrapped in an experiment\
    \ demonstrated below.\n\n```\n// Load modules\nvar Code = require('code');\nvar\
    \ Lab = require('lab');\n\nvar lab = exports.lab = Lab.script();\nlab.experiment('lab',\
    \ function () {\n  lab.test('exists', function (done) {\n    Code.expect(lab).to.exist();\n\
    \    done();\n  });\nlab.test('has properties', function (done) {\n    Code.expect(Object.keys(lab)).to.not.have.length(0);\n\
    \    done();\n  });\n});\n```\n\nThen if you run these tests in verbose mode,\
    \ you will get the following:\n\n```\n$ lab -v\nlab\n1) exists (3 ms)\n2) has\
    \ properties (1 ms)\n```\n\n2 tests complete"
