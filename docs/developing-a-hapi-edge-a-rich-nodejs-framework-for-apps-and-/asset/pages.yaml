- pgno: 152
  md: '# Security 12


    In Chapter 11, we learned about the various ways to debug our apps. Now that our
    application behaves as expected, we need to ensure it continues to behave despite
    any malicious actions from hackers.


    Security is a vital part of web development. But since it may often be complex
    or scary for new developers, it is not often included in typical beginner tutorials
    or documentation. As such, new web applications do not normally include any protection
    and become ripe targets for hackers (malicious or otherwise).


    Large websites are not immune by default. One of the more famous (yet more prankish
    than devastating) exploits Facebook. In fact, there are some companies whose employees
    may or not have accidentally harmed a competitor''s product through XSS. By covering
    your bases early, you can prevent the most common attack vectors and give yourself
    peace of mind.


    This chapter exposes some of the more common problems and vulnerabilities, as
    well as solutions.


    # Best practices


    Follow along to learn about best security practices to implement when using hapi.


    # Password hashing: BCrypt


    When storing user login passwords in the database, it is very bad practice to
    store passwords in plain text. Should a malicious hacker gain access to the database,
    they can directly use those credentials immediately to create great harm. Employees
    would also be able to view or manipulate sensitive user data. It is better to
    use a one-way hashing algorithm to securely store passwords in a hash that can
    be verified using the same hashing algorithm.


    However, there are many different one-way hashing algorithms available and are
    significantly better than others. In his famous blog post about password schemes,
    Thomas Ptacek walks through the typical simple hashing systems that naive engineers
    implement and how terribly bad they are. He even links to a super cheap FPGA implementation'
  merge: -1
  img_proc: true
- pgno: 153
  md: "# CHAPTER 12: Security\n\ncan break even the most complicated MD5, DES, SHA1,\
    \ and SHA256 hashes in no time at all. Thomas calls it \"game-over\" hack.\n\n\
    # SOLUTION\n\nBCrypt was designed specifically for hashing sensitive strings like\
    \ passwords.\nThe Node.js BCrypt implementation has been around since 2010. It\
    \ has gone through numerous security and code reviews over the years (including\
    \ our very own Van Nguyen). Node-bcrypt makes it easy to hash your passwords in\
    \ a comparatively secure method:\n\n```\nvar bcrypt = require('bcrypt');\n\n//\
    \ goes through 2^rounds iterations to generate salt\n// higher numbers require\
    \ SIGNIFICANTLY more time to calculate\nvar rounds = 12;\n\nvar salt = bcrypt.genSaltSync(rounds);\n\
    var hash = bcrypt.hashSync(user_input, salt);\n// Store hash in your password\
    \ DB.\n```\n\n# XSS\n\nCross-site scripting (XSS) is one of the most common vulnerabilities\
    \ where a web page with a text form blindly accepts arbitrary inputs from users\
    \ and displays this input unescaped on another page. Attackers can use this to\
    \ inject malicious-side JavaScript that gets executed by anyone viewing the page.\n\
    Use the OWASP XSS webpage for a more detailed breakdown of the many ways an attacker\
    \ can take advantage of XSS.\n\n# SOLUTION\n\nUse leizongmin's popular joi-xss\
