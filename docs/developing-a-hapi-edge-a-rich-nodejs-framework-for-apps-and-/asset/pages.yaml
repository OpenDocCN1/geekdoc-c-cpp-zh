- pgno: 164
  md: '# Models


    # MONGODB


    MongoDB is an explosively popular database. It was one of the first databases
    to embrace the NoSQL movement well as the open-source development model. It is
    available for free under the GNU license.


    Unlike MySQL or PostgreSQL, MongoDB is a document-oriented database. Instead of
    storing a Person''s data like names, addresses, etc separately, in MongoDB, these
    fields can be stored in a single document for individual systems. This is intuitive
    to work with.


    MongoDB supports a simple but powerful JavaScript-syntax for queries and has a
    very short learning curve. This makes MongoDB a popular choice for rapidly starting
    projects, for hackathons, and for teams already comfortable with JavaScript.


    There are two primaries downsides to MongoDB. Scalability is not linear and requires
    setting up complicated replication systems. Write performance can be a problem
    due to database-wide locking and the default setting can potentially lead to data
    loss when writes are not persisted.


    For practical purposes, at the time of writing, the choice of MongoDB ORM/driver
    to use is highly controversial.


    On the one hand, Mongose is popular and has a lot of helpful features, however,
    at the time of writing, the Mongose GitHub repository has over 400 open issues
    reported and almost 2000 closed issues. With many bugs, it may not always be the
    best choice.


    The mongodb driver is simple and effective but provides very little high functionality
    for some development work is required.


    mongodb


    The mongodb driver, also known as node-mongodb-native, is the most popular library
    for accessing MongoDB database instances. It fairly accurately mimics actual MongoDB
    syntax with some asynchronous modifications made as necessary. As such, it is
    less an ORM and more of a manual database driver. Therefore, intimate knowledge
    of MongoDB query syntax is required. Fortunately, MongoDB syntax is very simple
    and easy to pick up.


    Mongoose


    Mongoose ODM is a high level resource mapper for use with MongoDB. Created by
    LearnBoost (part of Automattic), Mongoose provides abstractions away pure MongoDB
    syntax in an attempt to make development using MongoDB faster and easier by adding
    support for queued operations, schemas, schema validators, defaults, methods,
    etc.


    # CASSANDRA


    Cassandra is another popular, open-source NoSQL database. Instead of focusing
    on ease-of-use for developers, like MongoDB, Cassandra focuses on using mathematics
    and science to give developers scalability and high availability (can survive
    multiple machine failures)'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# CHAPTER 13: Appendix


    all while exhibiting extremely high performance. It also focuses on linear scalability
    means scaling up systems is as simple as adding machines to the cluster (no mildly
    complicated replication systems, everything is automatic).


    Cassandra is a column-oriented database. Every record in the database can have
    any number of columns as fields. Individual records can have a different number
    of columns. A Person object could have name while another Person has name, address,
    and phone number. Every one of a Person''s columns is retrieved when read. Column
    databases may not be as intuitive as document databases but they have a lot of
    unexpected benefits (like being good with storing and managing data structures).


    The primary downside with Cassandra is it''s relatively large learning curve.
    It is hard to get started with Cassandra. However, once they are configured correctly,
    Cassandra''s features and benefits are hard to match.


    # Apollo


    Apollo, by 3logic, is an up and coming Cassandra ORM. When development of Apollo
    started relatively recently (mid 2014), it is already completely functional and
    compatible with Cassandra''s CQL interface. Technically, the authors do point
    out in their README.md that Apollo is ''incomplete'' and probably not production
    ready. However, Apollo is far better than the existing alternative ORMs out there.


    cassandra-driver


    Cassandra-driver is the official DataStax node.js to Cassandra driver. It supports
    all of the latest features and is actively maintained. However, it offers little
    to no high-level features so some development will be required to create effective
    models.


    # POSTGRES


    PostgreSQL is a very popular, open-source RDBMS alternative to MySQL or Oracle
    SQL. It offers many of the features of commercial relational databases despite
    being free-to-use.


    Unlike MongoDB or Cassandra, PostgreSQL follows the relational data model. This
    requires relatively significant setup time for configuring data schemas and indexes.
    However, this means data validation is free on the database-side (instead of on
    the driver/client side for all NoSQL databases).


    The primary downside of PostgreSQL is the learning curve. The relational data
    model may be difficult to pick up quickly and has a lot of idiosyncrasies regarding
    indexing, grouping data, etc.


    # PG


    Like the ''mongodb'' driver, the pg module, also known as node-postgres, is more
    of a driver than a full-fledged ORM.


    # Sequelize


    Sequelize is a full-fledged ORM that supports many different SQL based databases
    including MySQL, MariaDB, SQLite, MSSQL, and obviously PostgreSQL. It supports
    full sche'
