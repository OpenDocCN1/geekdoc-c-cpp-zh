    \ named basic. Finally, you tell a route to use the strategy named simple for\
    \ authentication.\n\nAs you go through this chapter and see specific examples,\
    \ these concepts should make more sense.\n\n# hapi-auth-basic\n\nThe next step\
    \ up from a hard-coded username and password is basic authentication. It's not\
