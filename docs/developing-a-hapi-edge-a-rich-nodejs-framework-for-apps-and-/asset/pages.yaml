- pgno: 22
  md: "```\nlabels: ['api']\n\noptions: {\n  files: {\n    relativeTo: __dirname\n\
    \  }\n};\n```\n\nWe're putting the main HTTP server on port 8080 and the API server\
    \ on port 8088. They're both running and listening on 0.0.0.0 which is used for\
    \ binding to all ip addresses for the connections. When the server starts up,\
    \ this will only be running one process. The labels in the configuration are for\
    \ labeling the connection so that the appropriate plugins can be loaded. Hapi\
    \ is a framework that's plugin-centric, meaning that everything is designed to\
    \ be architected around plugins. You can find more details about plugins in Chapter\
    \ 6, but for now, let's realize an important concept. All of the methods available\
    \ on the server are also available on anything passed to the plugin. It's the\
    \ first argument to a plugin register object. Sometimes the argument name is plugin\
    \ and other times it's server. We will call it a plugin.\n\nFor hapi.com we are\
    \ setting up two connections for our server. One is for HTML content, and the\
    \ other is for our API.\n\n```\nvar Async = require('async');\nvar Bell = require('bell');\n\
    var Blipp = require('blipp');\nvar Hapi = require('hapi');\nvar HapiAuthCookie\
    \ = require('hapi-auth-cookie');\nvar Hook = require('hoek');\nvar Api = require('./api');\n\
    var Authentication = require('./authentication');\nvar Controllers = require('./controllers');\n\
    var Models = require('./models');\nvar Routes = require('./routes');\n```\n\n\
    ```\nvar internals = {\n  servers: {\n    port: 8080,\n    host: '0.0.0.0',\n\
    \    labels: ['http']\n  },\n  api: {\n    port: 8088,\n    host: '0.0.0.0',\n\
    \    labels: ['api']\n  }\n}\n```"
