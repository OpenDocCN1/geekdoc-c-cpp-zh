- pgno: 66
  md: '# Plugins 6


    Now that we understand how to validate our inputs and outputs, next we want to
    talk about how to utilize plugins in hapi to better manage our code. Releasing
    software as monolithic-ic pieces of code is no better than writing functions that
    span thousands of lines of code. By writing software as smaller functions that
    serve a specific role, we can test the functions easier, we can debug things easier,
    and it''s easier to understand the architecture. Plugins follow this model as
    well, but they are oriented towards functionality of the main software instead
    of being snppets. Plugins allow you to extend current functionality, yet they
    have the the code compartmentalized to divide it and make it easier to maintain
    and test.


    The benefits of splitting code into plugins reaches beyond your own code, but
    easily allows users to share code that is beneficial to everybody. For example,
    you may have written code specific to Facebook authentication (bell) or a plugin
    to do something simple as displaying the routes on startup (blipp).


    In this we''re going to explore how to write a plugin and how to organize your
    code around it. In addition, we''re going to take a look at some of the more popular
    plugins that we use, and the plugins that we used to be part of the code project.


    A benefit of the plugin model and having replaceable parts in hapi is that you''re
    not bound to a particular way of doing things. If there later comes along a better
    plugin than the one you''re currently using, switching it out is far easier than
    that part of code is tightly coupled with the code you want to keep. This applies
    not just to third-party plugins but anything within your own system as well.


    When large companies work on plugins across multiple teams, things like caching
    can be determined on a per-plugin basis. The teams don''t have to communicate
    with each other, and even though the plugins run as part of the same server, routes
    in the different servers can be configured via the plugin to use, for example,
    different caching mechanisms that are suitable for that particular piece of code
    is doing.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Creating your own plugin\n\nNote how everything in our hapi-plugins project\
    \ is architected to be a plugin. We have plugins for the router and we have plugins\
    \ for the models. Even authentication is a plugin.\nLet's start by taking a look\
    \ at our `lib/index.js` file where all of our plugins are loaded.\n\n```\nserver.register([\n\
    Bell,\nBlipp,\nHapiAuthCookie,\nControllers,\nModels,\nRoutes\n],\nfunction (err)\
    \ {\n  if (err) {\n    console.log('server.register err:', err);\n    return callback(err);\n\
    \  }\n  server.start(function () {\n    console.log('server started on port: ',\
    \ server.info.port);\n    return callback(null, server);\n  });\n});\n```\n\n\
    Anyone using Async may recognize this pattern, since it allows you to easily run\
    \ many functions. We are big fans of async methods and this pattern here is very\
    \ similar. Internally, hapi uses items, which are barebones async methods to accomplish\
    \ this goals.\nThe register functions signature is `server.register(plugins, [options],\
    \ callback)`.\nThere are a few different ways to pass plugins, but not how all\
    \ of our projects are organized, and we have many. The best part about the register\
    \ function is that they can easily be made into their own separate npm packages\
    \ that can be loaded. They can also be shared as their own repositories in git-hub.\n\
    What we have found really works when there are many people working on a bigger\
    \ project that is having specific components that have some logical divider be\
    \ each in their own repo. For example, if you have a blogging system, you could\
    \ put all routes that have to deal with posts as their own plugin, and all the\
    \ routes that deal with comments"
  merge: -1
  img_proc: true
- pgno: 68
  md: "# Creating your own plugin\n\nas your plugin as well. Then you have separate\
    \ owners for each individual piece and this tends to lead to less conflicts in\
    \ the code. This may not always work well. For example, you may have tightly coupled\
    \ services. You are the expert when it comes to your own code. It is up to you\
    \ to decide what's best for your project, and high is flexible so you can organize\
    \ your project how you prefer.\n\nAnother separation for code can be to keep your\
    \ controllers slim and as much logic into models as possible. You can turn in\
    \ their have libraries with the code in them.\n\nWith the code separated into\
    \ smaller atomic parts, code reuse becomes far easier. It is also easier to understanding\
    \ the architecture. As an example, you may find that some of your testing setup\
    \ was creating another repo for common testing. You may end up doing what we did,\
    \ which is creating another repo but this is a very nice approach even within\
    \ a project but can also be reused across multiple projects.\nLet's take a look\
    \ at one of the pieces by looking at how our handlers are loaded.\n\n```\nvar\
    \ load = function (options, callback) {\n  options = options || {};\n  options.extension\
    \ = options.extension || '.js';\n  var controllers = {};\n\n  var files = glob.sync('*'\
    \ + options.extension, { cwd: options.path || __dirname });\n  for (var i in files)\
    \ {\n    if (files[i] != path.basename(__filename)) {\n      var key = path.basename(files[i],\
    \ options.extension);\n      key = key.charAt(0).toUpperCase() + key.slice(1);\n\
    \      controllers[key] = require(options.path || __dirname) + '/' + files[i]);\n\
    \    }\n  }\n\n  if (callback) {\n    return callback(null, controllers);\n  }\n\
    \n  return controllers;\n};\n\nexports.register = function (plugin, options, next)\
    \ {\n  load({path: __dirname + '/handlers'}, function (err, handlers) {\n    if\
    \ (err) {\n      throw err;\n    }\n});\n```\n\n69"
