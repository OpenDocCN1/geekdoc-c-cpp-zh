- pgno: 74
  md: 'gain access to the data. Many frameworks as part of the framework, but by using
    this mod-ular approach, any authentication form is possible.

    More information on hapi-auth-basic is provided in Chapter 7.


    # blipp


    While blipp isn''t a core plugin, it''s nevertheless very useful. It simply displays
    the routes and the server:port combination when the hapi server is started. It
    gives a quick indi-cation of what routes are available and that they''re available
    on the correct server connec-tion.


    # bell


    Bell is much like hapi-auth-basic except that it''s using third-party logins such
    as Facebook, GitHub, Instagram, Twitter, Foursquare, VK, ArcGIS Online and Windows
    Live. If you''re looking for logins for this, this is the plugin to use. Third-party
    plugins are getting added continually. Bell is usually used with hapi-auth-cookie
    so that isn''t explicitly called out on its own.

    More information on bell and hapi-auth-cookie is provided in Chapter 7.


    # good


    If you''re running a service in production, you''d almost certainly want to use
    good. You get to see how your service is performing with cpu usage, memory, etc.
    There are many report-ers you can use with this program, you can have reports
    sent to a file logger, to console, or any custom program you write your own reporter
    for.

    More information on good is provided in Chapter 11.


    # tv


    TV is an interactive module used for debugging. It becomes easy to see what requests
    are received by your service and what it does to handle it.

    More information on tv is provided in Chapter 11.


    # lout / hapi-swagger


    Lout and hapi-swagger are documentation tools for your routes and setup. It provides
    api documentation for you, so you don''t have to this. This can save you some
    serious time for something that you need to have anyway.'
