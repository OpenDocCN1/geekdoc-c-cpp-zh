    \ grew, so we needed to split hapi up into plugins. You will need to install the\
    \ hapi-auth-basic plugin in hapi to get any basic authentication support in hapi.\n\
    \nFor any authentication to support it, you must first have a scheme registered\
    \ with the server. The scheme is the heart of authentication that will take place.\
    \ In the case of hapi-auth-basic the scheme is registered when the plugin itself\
    \ is registered. The only thing to do is to declare an authentication strategy\
    \ that will use the scheme. It will become more obvious later, when bell is discussed,\
    \ but strategies help hapi be an extremely flexible framework because it can support\
