- pgno: 140
  md: '# Debugging 11


    A debugged program is one for which you have not yet found the conditions that
    make it fail.


    -- Jerry Ogdin


    In the last chapter, we learned a lot about how to test hapi applications and
    how to write unit tests. In this chapter, we''ll discover how to debug our hapi
    applications using some advanced tools.


    Debugging in Node.js has always been a source of pain for many developers. There
    is still a lack of great tooling to help developers with debugging Node.js across
    platforms and throughout an applications full lifecycle. While tools like DTrace
    exist, not all Node.js deployments have the opportunity to use it. Joyent and
    other companies have done a great job at documenting how to debug a Node.js application.
    In the hapi world, we have created modules to help make debugging a hapi application
    even easier. This chapter will cover specific hapi modules that can help with
    debugging a hapi server in different environments. Additionally, this chapter
    covers how to setup reporting that can help diagnose issues.


    # Chapter Overview


    The following chapter will cover many details on debugging hapi and Node.js in
    general. These topics are:


    +   * console.log

    * debug mode

    * TV

    * Good

    * REPL

    * Heap Snapshots

    * Core Files'
  merge: -1
  img_proc: true
- pgno: 141
  md: "# console.log\n\nWhile many developers may look down on console.log as a viable\
    \ debugging option, it serves a purpose and can be quite useful. There are many\
    \ instances where you simply need to know the value of a variable at a certain\
    \ point in a remote deployment. For situations like this, a REPL or a remote debugging\
    \ session is overkill, don't look down on using console.log. When it comes to\
    \ the scripting nature of node.js and how quickly a process can be started is\
    \ simple to ssh into a server and add a log statement. While not the most elegant,\
    \ it can help identify state at different points in your application.\n\n# debug\
    \ mode\n\nFortunately, in hapi there is also the concept of a debug mode. Instead\
    \ of manually going in and typing a bunch of console.log statements within hapi,\
    \ you can start a server in debug mode and have console access to different server\
    \ events and error details. This mode can be verbose and not necessary for production,\
    \ it is recommended that you only enable debug mode for development. Below is\
    \ an example of starting a server in debug mode and logging all errors to the\
    \ console.\n\n```\nvar Hapi = require('hapi');\nvar options = {\n  debug: {\n\
    \    log: ['error']\n  }\n}\nvar server = new Hapi.Server(options);\nserver.connection({\
    \ port: 8000 });\nserver.route({ method: 'GET', path: '/', handler: function (request,\
    \ reply) {\n\n  throw new Error('Tribbles');\n}});\n\nserver.start(function ()\
    \ {\n\n  console.log('server started');\n});\n```\n\nDebug: internal, implementation,\
    \ error\nError: Uncaught error: Tribbles"
  merge: -1
  img_proc: true
- pgno: 142
  md: "As you can see in the previous example, when an error occurs, the error and\
    \ the stack trace is logged to the console with `Debug:` prefixing the log.\n\n\
    # TV\n\nAnother useful option for debugging hapi servers, in development, is with\
    \ the use of the tv module. Tv was designed primarily for front-end consumers\
    \ of a hapi application. The goal is to provide an easy to use dashboard that\
    \ displays information about server request activity. This is especially useful\
    \ for a front-end developer to be able to trace the lifecycle of a request that\
    \ their code makes to a hapi server. A screenshot of tv is shown here:\n\n![](img/79450811086e2fc8749ec4d309ea2b79_142_0.png)\n\
    \nIn order to add tv to a server, you register it like any other hapi plugin.\
    \ Below shows how to register tv with the default settings. After tv is registered\
    \ on a server you can access it at your server URL `/debug/console`.\n\n```\n\
    var Hapi = require('hapi');\nvar Tv = require('tv');\n\nvar server = new Hapi.Server();\n\
    server.connection();\n\nserver.register(Tv, function (err) {\n\n  if (!err) {\n\
    \    server.start();\n  }\n});\n```\n\nWith this you can subscribe to request\
    \ events that you care by selecting the different tags for events. The request\
    \ details are sent in real-time to the tv page as they are"
  merge: -1
  img_proc: true
- pgno: 143
  md: '# CHAPTER 11: Debugging


    made. If any requests stand out as something that is useful you can also star
    and investi-gate them.


    # Good


    Logging request details in tv is useful for local development. However, when you
    are in QA or production you will want to use a module designed specifically for
    that scenario. For these situations, as well as for local development, the good
    plugin is extremely useful.

    What good is even more appropriate for QA and production that it is designed to
    also log operations data. Over the years this has expanded to not only include
    the typical memory or CPU details, but also it now includes event loop delay and
    network acivity.

    To add to a hapi server you register it like any other plugin. The major difference
    is that with good you will need to specify options for the types of events you
    care about and where to log those events. good events include the following:


    +   - ops

    - response

    - log

    - error

    - request

    - wreck


    Where event data can be stored is quite extensive. If you need a different reporter,
    you can build one by looking at one of the many examples. The available reporters
    for good currently includes the following types:


    +   - UDP

    - HTTP

    - Files

    - Console

    - InfluxDB

    - Winston

    - Loggly

    - Logstash


    This list will continue to grow. You get the latest list by looking at the good
    page. The code below shows how to register good and log all ops data to a file
    /var/log/example/ops.json every second.


    ```

    var Hapi = require(''hapi'');

    var Good = require(''good'');

    ```


    144'
