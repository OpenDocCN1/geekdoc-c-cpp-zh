- img_proc: true
  md: '# Figure 5.6.7: Overlaid Ellipses


    In this example, three ellipses with different alpha values are overlaid and associated
    with a legend. The legend reflects the information about the ellipses.


    In addition, the cholesterol values for the outlying points are colored by a column
    named "outlier" and displayed using the DATALABEL option.


    ```

    title "Heart Study Cholesterol Analysis";nproc sgplot data=sgbook.heartlabel2
    noautlegend;

    where agestart <= 30;

    nelipse x=weight=cholesterol / alpha=.05 name="e1";

    elipse x=weight=cholesterol / alpha=.25 name="e2";

    elipse x=weight=cholesterol / alpha=.50 name="e3";

    scatter x=weight=cholesterol / datalabel=outlier;

    keylegend "e1" "e2" "e3";

    xaxis grid;

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_168_0.png)


    # Figure 5.6.8: Overlaid Filled Ellipses


    This example is similar to Figure 5.6.7, except that the ellipses are filled,
    creating a backdrop for the scatterplot.


    The ellipse representation in the legend also changes with the presence of the
    FILL option.


    Ellipses are ordered in the program so that the smaller ones are drawn on top.


    ```

    title "Heart Study Cholesterol Analysis";

    proc sgplot data=sgbook.heartlabel2 noautlegend;

    where agestart <= 30;

    elipse x=weight=cholesterol / fill alpha=.05 name="e1";

    elipse x=weight=cholesterol / fill alpha=.25 name="e2";

    elipse x=weight=cholesterol / fill alpha=.50 name="e3";

    scatter x=weight=cholesterol / datalabel=outlier;

    keylegend "e1" "e2" "e3";

    xaxis grid;

    yun;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_168_1.png)


    * Matange, Sanjay and Heath, Dan. Statistical Graphics by Example: Effective Graphs
    Using SAS®. Copyright of 2011, SAS Institute Inc., Cary, North Carolina, USA.
    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
