  md: '# Figure 6.3.3: Normal Density Curve


    The normal density function can be customized by specifying the Mu and Sigma parameters.


    In this graph SIGMA=30, as shown in the inset.


    ![](img/0c09161c0be53934e5708cffbdcc441f_180_0.png)


    ```

    odescapechar ''*'';

    title ''Normal Density for Horsepower'';

    proc sgglot data=sashelp.cars noautolegend;

    density horsepower / scale=percent type=Normal(sigma=30);

    inset ("(unicode Sigma) = 30" / position=topright;

    yaxis grid;

    xaxis display=(nolabel);

    run;

    ```


    # Figure 6.3.4: Kernel Density Estimate


    This graph shows the kernel density estimate for horsepower.


    TYPE=Kernel supports options for C and weight.


    ![](img/0c09161c0be53934e5708cffbdcc441f_180_1.png)


    ```

    title ''Kernel Density for Horsepower'';

    proc sgglot data=sashelp.cars noautolegend;

    density horsepower / scale=percent type=Kernel;

    yaxis grid;

    xaxis display=(nolabel);

    run;

    ```


