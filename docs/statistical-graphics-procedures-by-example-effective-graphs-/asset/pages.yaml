- img_proc: true
  md: 'Figure 2.2 displays a classification panel with a Lattice layout, which supports
    two class variables, one for row and one for column. Each row and column has a
    header that displays the value of the classification variables.


    Figure 2.3 displays a classification panel with a Panel layout, which supports
    multiple class variables. Each cell in the panel has multiple headers, and for
    each class variable.


    Classification panels are created using the SPANEL procedure.


    # 2.1.3 Multi-Cell Comparative Scatter Plots (SGCATTER Procedure)


    While Classification Panels provide a convenient way to compare the same data
    across classifiers, it is often desirable to make side-by-side comparisons.


    ![](img/0c09161c0be53934e5708cffbdcc441f_33_0.png)


    Figure 2.4


    Figure 2.5


    Figure 2.4 displays a comparative graph for Mileage and Price by Weight and Horse
    Power. This graph has common axis for comparison of the variables. Figure 2.5
    shows a Scatter Plot Matrix for three variables, MPG, Horsepower, and MSRP. Such
    a matrix can provide preliminary visual indication of direct or inverse associations
    between the variables.


    Comparative and Matrix graphs are created using the SGSCATTER procedure.


    # 2.1.4 Automatic Features


    +   The SG Procedures examine the procedure syntax and apply built-in heuristics
    to enhance the graph graphically. These actions include the following:

    * Add a legend when appropriate for overlays and classifiers.

    * Create custom legend labels as needed for certain plot types.

    * Assign different visual attributes to overload plot statements.

    * Paginate large classification panels automatically.


    If the results of the built-in heuristics are not desirable, they can be turned
    off.'
  merge: -1
