  md: '# ## 4.9 Needle Plot


    The needle plot draws a vertical needle for each observation from the (x,y) coordinate
    to the x-axis. The syntax is:


    ```

    needle x=column y=num-column < options>;

    ```


    A vertical line (needle) is drawn from each observation to the baseline. For Interval
    x-axis, the GROUP role affects only the display attributes of the needle. Cluster
    groups are used for discrete axis.


    # ### Required Data Roles:


    | X | Position along the horizontal axis |

    | --- | = | =column |

    | Position along the vertical axis | =num-column |


    # ### Optional Data Roles:


    | DATABEL | Label String for each observation |

    | =text-attrs | =column |

    | GROUP | Classification for multiple series |

    | URL | URL for each observation |

    | =column |


    # ### Appearance Options:


    | DATABELATTRS | Appearance attributes for labels |

    | LINEATTRS | Appearance attributes for the needles |

    | MARKERTRS | Appearance attributes for markers |

    | =text-attrs | =line-attrs | =marker-attrs |


    # ### Other Options:


    | BASELINE | Y-intercept for the baseline |

    | =number |


    # ### Boolean Options:


    | DATABEL | Display Y value as data label |

    | MARKERS | Display the markers


    # ### Standard common options are supported


    ATTRID, OFFSETDISPLAY, GROUPORDER, LEGENDLABEL, NAME, NOMISSINGGROUP, TRANSPARENCY,
    URL, X2AXIS, Y2AXIS


    Related Style Elements: The GraphDataDefault element is used to draw the plot
    elements. When a GROUP variable is present, or when multiple plot statements are
    overlaid, the GraphData1-GraphData12 elements are used, for each group or plot
    statement.


    ![](img/0c09161c0be53934e5708cffbdcc441f_106_0.png)'
  merge: -1
  pgno: 106
