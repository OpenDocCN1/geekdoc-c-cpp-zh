  md: '# 11.5 MATRIX Statement


    The MATRIX statement creates regular grids of scatter plots of pair-wise combinations
    of all the variables in the list. Diagonals are used to label the variable name.
    Diagonals can alternatively be used to display the distribution of each individual
    variable itself:


    ```

    matrix var var <var> <var> ... </options>;

    ```


    Required Plot Request:


    | Plot Request | Var list |


    Options:


    | ATTRID | =variable | Associated Attr Map for visual attributes |

    | DATALABEL | =variable | Variable for labeling scatter points |

    | ELLIPSE | <=(options) | Fit a confidence ellipse to the data |

    | GROUP | =variable | Grouping variable |

    | JOIN | <=<options> | Connect the data points |

    | LEGEND | =(options) | Controls legend characteristics |

    | MARKERATTRS | =attrs | Specify marker attributes |

    | START | =keyword | Specify the starting position - TOPLEFT | BOTTOMLEFT |

    | TRANSPARENCY | =value | Specify the transparency for the markers |


    Boolean Options:


    | NOLEGEND | Suppress display of legend |'
