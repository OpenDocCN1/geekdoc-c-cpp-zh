  md: 'As mentioned above, the supported plot statements are grouped in four categories.
    Plots

    within each category can be combined in a procedure step. Plots from the "Basic
    Plots"

    group and "Fit and Confidence Plots" group can also be combined.


    INSET, REFLINE, and KEYLEGEND statements can be used as necessary to add these
