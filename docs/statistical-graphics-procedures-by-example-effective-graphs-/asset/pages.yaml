  md: '#  13.3 Financial Trend and Bond Maturity Graph (9.3)


    This graph shows the financial trend over time and bond yields by maturity. The
    features of the graphs are:


    +   * X-X2 and Y-Y2 split technique is used to display the financial trend and
    yield in the same graph.

    * The trend is drawn in the X-Y space using two series, one bond and HighLow plot.

    * The bond yields are drawn in the X2-Y space using a HighLow plot.


