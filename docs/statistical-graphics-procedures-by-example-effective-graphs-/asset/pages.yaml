  md: '# 7.5 Vertical Line Charts


    The VLINE plot shows the summarization of the response by category or the frequency
    count of the category. The syntax is:


    ```

    vline column </options>;

    ```


    By default, the data is summarized for each unique category; however, user-defined
    formats can be used to create categorical ranges for summarization. One line is
    drawn connecting all results categories. If a group value is specified, one line
    is drawn for each group value, either overlay or offset from the tick value to
    create a cluster effect (see the GROUPDISPLAY).


    ![](img/0c09161c0be53934e5708cffbdcc441f_210_0.png)


    Required Data Roles:


    | CATEGORY | Category variable |

    | --- | --- |

    | FREQ =num-column | Frequency count for each observation |

    | GROUP =column | Group variable for each observation |

    | RESPONSE =column | Response values for the chart |


    Optional Data Roles:


    | | |

    | --- | --- |

    | CURVELATTRIBUTES =text-attrs | Appearance attributes for the line labels |

    | LINEATTRIBUTES =line | Appearance attributes for the line |

    | MARKERATTRS =marker-attrs | Appearance attributes for the markers |


    Appearance Options:


    Other Options:


    | | |

    | --- | --- |

    | CURVELABEL ="string" | Label(s) for the line(s) |

    | CURVELABELOC =keyword | INSIDE | OUTSIDE |

    | CURVELABELPOS =keyword | AUTO | MIN | MAX | START | END |

    | DATALELPOS =keyword | TOP | BOTTOM |

    | GROUPDISPLAY =keyword | OVERLAY | CLUSTER |


    Boolean Options:


    | | |

    | --- | --- |

    | BREAK | Break the line at missing response values |

    | MARKERS | Display markers on the data points |

    | XAXIS | Assign the plot to the secondary x-axis |

    | YAXIS | Assign the plot to the secondary y-axis |


    Standard common options are supported


    Related Style Elements: Same as VBA and HBAR.'
