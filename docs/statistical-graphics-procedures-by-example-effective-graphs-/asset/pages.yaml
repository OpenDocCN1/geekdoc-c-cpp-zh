  md: '# 6.3 Density Plot


    The density plot shows the fitted distribution of a numeric variable.

    The syntax is:


    ```

    density column </options>

    ```


    The distribution of the observations is shown as a curve. The plot

    supports normal density and a kernel density estimate.


    ![](img/0c09161c0be53934e5708cffbdcc441f_178_0.png)


    Required Data Roles:


    | num-column | Position along the horizontal axis |


    Optional Data Roles:


    | FREQ =num-column | Frequency count for each observation |


    Appearance Options:


    | LINEATTRS =line-attrs | Appearance attributes for line |


    Other Options:


    | TYPE =keyword (opts) | NORMAL (options) | KENNEL (options) |

    SCALE =keyword | PERCENT | COUNT | PROPORTION for y-axis

    scaling |


    Type=Normal Options:


    | MU =value | Mean value to be used |

    SIGMA =value | Standard deviation to be used |


    Type=Kernel Options:


    | C =value | Band Width |

    WEIGHT =keyword | NORMAL | QUADRATIC | TRIANGULAR |


    Standard common options are supported


    | LEGENDLABEL, NAME, TRANSPARENCY, X2AXIS, Y2AXIS |


    Related Style Elements: The GraphDataDefault style element is used to draw the
    plot elements.'
  merge: -1
  pgno: 178
