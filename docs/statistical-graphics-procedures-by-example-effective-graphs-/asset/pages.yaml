  md: '# Figure 7.5.1: Basic Line Chart


    This example shows a basic line chart using a MEAN statistic. The visual attributes
    of the line can be controlled using the LINEATTRS option.


    The axis LABEL option is used to override the column label from the data set.


    ![](img/0c09161c0be53934e5708cffbdcc441f_211_0.png)


    ```

    title "Avg. Number of Electrical Workers";

    proc sgplot data=sashelp.workers;

    format date year;

    yaxis label="workers (in thousands)";

    vline date / response=electric stat=mean

    lineattrs=(color=gray thickness=2);

    run;

    ```


    # Figure 7.5.2: Line Chart with Markers


    The MARKERS option displays markers on the data points along the line.


    The MARKERATTR option is used to control the attributes of the markers independently
    from the line.


    ![](img/0c09161c0be53934e5708cffbdcc441f_211_1.png)


    ```

    title "Avg. Number of Electrical Workers";

    proc sgplot data=sashelp.workers;

    format date year;

    yaxis label="workers (in thousands)";

    vline date / response=electric stat=mean markers

    lineattrs=(color=gray thickness=2);

    markerattrs=(color=gray symbol=circlefilled);

    run;

    ```


