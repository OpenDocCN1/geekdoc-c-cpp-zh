  md: '# Figure 6.4.5: Box Plot on Linear Axis


    This is a graph of a VBOX the x-axis data is set to linear (SAS 9.3) and is not
    so categorical. Format is MONNAME3.


    This is a common use in the health and life sciences industry, where the data
    is distributed unevenly over the time axis.


    AXIS TYPE=linear. The box spacing is determined by the smallest interval in data.


    ![](img/0c09161c0be53934e5708cffbdcc441f_184_0.png)


    ```

    title Lab Results over Time;

    proc sgpglot datasbook.intervalBoxMulti;

    vbox DrugA / category date=\naxis grid type=linear displays=(nodelabel) tickvalueformat=monname3.

    values=(''01Jan2009''d to ''01Dec2009''d by month);

    axis grid display=(nodelabel);

    run;

    ```


    # Figure 6.4.6: Box Plot over Linear Axis


    This is an overlay of two VBOX plots on a date axis with uneven values.


    Here we want to view the lab results over time and by type. A VBOX overlay must
    have the same X variable, so we have to jitter the date values appropriately.
    Use the code for generating this data set.


    AXIS TYPE=linear.


    ![](img/0c09161c0be53934e5708cffbdcc441f_184_1.png)


    ```

    title Lab Results over Time and Treatment;

    proc sgpglot datasbook.intervalBoxMulti;

    vbox DrugA / category date=2 meanattrs(size=5) outliers(size=5);

    vbox DrugB / category date=2 meanattrs(size=5) outliers(size=5);

    axis grid type=linear displays=(nodelabel) offsetmin=0.05 offsetmax=0.05

    values=(''01Jan2009''d to ''01Dec2009''d by month)

    tickvalueformat=monname;

    axis grid display=(nodelabel);

    run;

    ```'
