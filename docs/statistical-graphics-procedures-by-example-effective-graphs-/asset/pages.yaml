  md: '# 4.13HighLow Plot (9.3)


    The HIGHLOW statement has the following syntax:


    ```

    highlow x=column low=num-column high=num-column <opts>

    highlow y=column low=num-column high=num-column <opts>;

    ```


    This is a versatile plot that displays a vertical or horizontal-low plot, using
    either a "bar" or "visual" line. The line version is used to create traditional
    stock plots. The bar version is useful for event timelines.


    ![](img/0c09161c0be53934e5708cffbdcc441f_120_0.png)


    # Required Data Rows:


    | | Position along the vertical or horizontal axis |

    | X or Y | column | End point of bar or line segment |

    | HIGH | num-column | Start point of bar or line segment |

    | LOW | num-column | |


    # Optional Data Rows:


    | | Close value for bar or line |

    | CLOSE | =num-column | Classification for multiple series |

    | GROUP | =column | Caps (NONE, OPENARROW, etc.) |

    | HIGCAP | =keyword | Label for the upper or lower end |

    | HIGHLABEL | =column string | Open value for bar or line |

    | OPEN | =num-column | URL for each observation |

    | URL | =column |


    # Appearance Options:


    | | Appearance of bar interior |

    | FILLATTRS | =fill-attr | Appearance of bar labels |

    | DATABELATTRS | =text-attr | |

    | LINEATTRS | =line-attr | Appearance of line or outline |


    # Other Options:


    | | Width of bar as fraction of ticking spacing |

    | BARWIDTH | =value | Cluster or Overlay |

    | GROUPDISPLAY | =keyword | DATA | ASCENDING | DESCENDING |

    | GROUPORDER | =value | Width of bar in pixels |

    | INTERVALBARWIDTH | =value | BAR | LINE |

    | TYPE | =keyword | |


    # Boolean Options:


    | | Display filled bars or not for Type=Bar |

    | FILL | NOFILL | Display outline or not for Type=Bar |

    | OUTLINE | NOUTLINE | |


    Standard options are supported


    ```

    ATRID, CLUSTERWIDTH, DISCRETEOFFSET, GROUPDISPLAY, GROUPORDER, TRANSPARENCY, LEGENDLABEL,
    NAME, MISSINGGROUP, X2AXIS, Y2AXIS

    ```


    Related Style Elements: as same for the VBarPlot plot statement.'
