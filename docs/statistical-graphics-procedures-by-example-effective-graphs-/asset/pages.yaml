  md: "# 2.2 SGPLOT Procedure\n\nSGPLOT is a versatile procedure, providing the ability\
    \ to create a wide variety of single-cell graphs by combining the supported statements\
    \ in creative ways. The SGPLOT procedure supports over twenty different plot statements,\
    \ along with statements for customization of legends, axes, and inserts.\n\nThe\
    \ syntax for the SGPLOT procedure is as follows:\n\n```\n1. PROC SGPLOT < DATA=\
    \ data-set > < options >;\n2. plot-statement(s) required-parameters < / options\
    \ >;\n3. < refine-statement(s) >;n   < inset-statement(s) >;n   < axis-statement(s)\
    \ >;\n   < keylegend-statement(s) %>\nRUN;\n```\n\n+   1. The procedure supports\
    \ multiple options. Use of these options will be demonstrated in the examples\
    \ shown in later chapters.\n\n+   2. One or more plot statements are used to represent\
    \ the data. Each plot statement has its set of required data and options. These\
    \ are described in detail in later chapters. Many plot statements are supported\
    \ and can be grouped as shown below. Plot statements from compatible groups can\
    \ be combined in one procedure step:\na. Basic Plots: These include scatter, series,\
    \ etc.\nb. Fit and Confidence Plots: These include regression and Loess plots.\n\
    c. Distribution plots: These include histograms and box plots.\nd. Categorization\
    \ Plots: These include bar charts and dot plots.\n\n+   3. Supporting statements\
    \ can be used to customize the graph:\n\n+   a. Reference Lines\nb. Insets\nc.\
