  md: '# Figure 3.2.7: Histogram


    This graph displays a basic distribution of mileage for all cars using a histogram.


    The y-axis grid lines are enabled. The x-axis label is suppressed.


    By default the histogram shows a LINEAR axis, as shown here. To show a binned
    axis, use the SHOWBINS option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_53_0.png)


