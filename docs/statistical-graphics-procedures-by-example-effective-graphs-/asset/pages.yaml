  md: '# ## 4.14 Reference Lines


    X and Y reference lines have the following syntax:


    refine value <value> />


    One or more vertical or horizontal reference lines can be added to a graph using
    the above syntax. Refines can be aligned to any one of the four axes X, Y, X2
    or Y2. The GraphReference style element is used.


    **Required Data Roles:**


    | Value-list | Position along the x-axis or y-axis |

    |---|---||

    | LINEATTRS | =line-attrs | Appearance attributes for the reference lines |


    **Appearance Options:**


    | | | |

    |---|---||

    | AXIS | = axis | The axis X, X2, Y, Y2 for the values |

    | LABEL | = string | Labels for the reference line(s) |

    | LABELLOC | = string | Location of the label (Inside | Outside) |

    | LABELPOS | = string | Position of the label (Start | End) |


    **Other Options:**


    | | |

    |---|--|

    | NOCCLIP | Refine is included to determine axis range |


    **Common options supported**


    | | |

    |---|--|

    | DISCRETEOFFSET, LEGENDLABEL, NAME, TRANSPARENCY |


    **Related Style Elements:** The GraphReference style element is used to draw these
    lines.


    ![](img/0c09161c0be53934e5708cffbdcc441f_124_0.png)'
