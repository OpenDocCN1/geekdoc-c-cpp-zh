  md: "# 12.11 QTc Change from Baseline over Time by Treatment\n\nThis graph displays\
    \ the hazard function over time by treatment. The features of the graph are:\n\
    \n+   - The Y-Y2 Split technique is used to display the axis aligned at risk table\
    \ at the bottom.\n- We could have refined the Y2 labels, but that takes up extra\
    \ space. We want all labels on one side.\n- So, we used the RESTATE refine, with\
    \ 'DrugLabel' as the variable. This has only two values, and these are displayed.\
