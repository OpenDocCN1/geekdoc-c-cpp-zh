  md: '# 12.9 QTc Change from Baseline over Time by Treatment (9.3)


    This graph displays the change in corrected QT (QTc) interval time for heartbeats.
    The visits are irregularly spaced, with higher frequency in the beginning, so
    it is desirable to have a linear axis for time. This graph has the following features:


    +   - An overlap of two VBOX statements is used for the data.

    - The x-axis values are jittered by 0.25 for each treatment to get adjacent overlays.

    - A user-defined format is used to label the last value as "Max".

    - A reference line is added to separate the last value.

    - Ideally, we would like to display the "atRisk" values for each week of the study.
    To so, we will use the Annotation feature for SGLPLOT as shown in Figure 12.10.


    | Week |2 | atRisk | atRisk | valueB |

    |---|---|---|---|

    | 1 | 0.75 | 209 | 72.1929 |

    | 2 | 0.75 | 209 | -3.1966 |

    | 4 | 1.25 | 405 | -29.5119 |

    | 8 | 1.25 | 405 | -10.0056 |

    | 12 | 1.75 | 206 | -52.2286 |

    | 16 | 1.75 | 206 | 57.0051 |


    ![](img/0c09161c0be53934e5708cffbdcc441f_307_0.png)


    ```

    title ''*QTc Change from Baseline by Week*'';

    scpglot data=sgbook,QTcChange;

    vbox valueA = category/week2 line2innatrs=(pattern=solid) meanattrs=graphdata1

    whiskerrattrs=(pattern=solid) medianattrs=(pattern=solid);

    vbox valueB = category/week2 line2innatrs=(pattern=solid) meanattrs=graphdata2

    whiskerrattrs=(pattern=solid) medianattrs=(pattern=solid);

    refline 26 / axis1;

    axis type=linear values=(1 2 4 8 12 16 20 24) display=(nolabel)

    ticklabelvalueformat=myweek; offsetmin=0.03 offsetmax=0.03;

    yaxis values=(-120 to 90 by 30) grid Iabel="QTc Change";

    run;

    ```'
  merge: -1
