  md: '# Figure 4.6.1: Basic Series Plot


    This graph shows patient response to a drug over time.


    The x-axis label is suppressed, YAXIS

    MIN is set to zero.


    ![](img/0c09161c0be53934e5708cffbdcc441f_91_0.png)


    ```

    title ''Response over Time'';

    proc sgplot data=sgbook.series0group;

    where drug=''A'';

    series x=date y=val lineattrs=(thickness=2);

    axis display=(nolabel);

    saxis2 min=0 integer grid label=''Efficacy'';

    run;

    ```


    # Figure 4.6.2: Grouped Series Plot withnLegend


    This graph shows response over time by drug. A legend is generated by default.
    We have used the KEYLEGEND statement to suppress the legend title.


    Since the number of observations in the data exceeds the limit for antialiasing,
    set ANTIALIASMAX=1100 to

    restore anti-aliasing.


    ![](img/0c09161c0be53934e5708cffbdcc441f_91_1.png)


    ```

    ods graphics / reset antialias=1100;

    title ''Response over Time by Drug'';

    proc sgplot data=sgbook.series0group;

    series x=date y=val lineattrs=(thickness=2);

    axis display=(nolabel);

    yaxis2 min=0 integer grid label=''Efficacy'';

    keylegend / title=''*'' valueattrs=(size=7);

    run;

    ```


    > 9.3'
