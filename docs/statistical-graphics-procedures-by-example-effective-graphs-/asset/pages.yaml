- img_proc: true
  md: '# # Chapter 13: Business Graphs


    # ## 13.1 Introduction


    The graphs commonly used in the banking, financial, and insurance industries have
    different requirements than graphs used for the statistical analysis of data.
    These graphs are more “creative” in nature. While the principles of effective
    graphs continue to be applicable for these graphs, they also generally need more
    visual aesthetics.


    The graphs shown in this book have been customized for gray-scale rendering. However,
    color graphs are particularly useful for business, and the visual appearance of
    these graphs can be further enhanced by the use of color styles.


    The techniques described in the earlier chapters of this book can be leveraged
    in creative ways to create graphs. Here we have used the axis-splitting technique
    to display multiple graphs in one cell, like we have used combinations of HighLow
    and VBar to do the “Product Sales and targets” graph, and we used a bubble plot
    to draw the “Social Graph”.


    In this chapter, we will examine how you can create some common graphs used in
    this industry. Some examples are shown in Figure 13.1. Detailed code for creating
    graphs is shown in the following pages.:


    ![](img/0c09161c0be53934e5708cffbdcc441f_323_0.png)


    **Stock Plot**


    **Bond Yield**


    ![](img/0c09161c0be53934e5708cffbdcc441f_323_1.png)


    **Product Sales and targets**


    **Social Graph**


    Figure 13.1


