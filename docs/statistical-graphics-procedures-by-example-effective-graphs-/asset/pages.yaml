  md: '# Figure 7.3.13: Bullet Chart


    This bullet chart is drawn using two overlaid bar charts. The first chart is drawn
    using the default bar width (0.85). The overlaid bar chart is drawn with a bar
    width of 0.3.


    This example can be enhanced by adding transparency to the charts, enabling you
    to see the top of the first bars through the second bars.


    ![](img/0c09161c0be53934e5708cffbdcc441f_202_0.png)


    # title "Product Sales":


    ```

    proc sgplot data=sgbook,product_sales;

    yaxis label="Sales (in millions)"

    vbar product / response=actual;

    vbar product / response=predict bandwidth=0.3;

    run;

    ```


    # Figure 7.3.14: Overlaid Bar Charts with Discrete Offsets


    Overlaid bars can be placed side by side by using the DISCRETEOFFSET options.
    Bar widths have to be adjusted as shown.


    A negative discrete offset moves the bars to the left; a positive value moves
    the bars to the right. The axis REVERSE option reverses this behavior.


    ![](img/0c09161c0be53934e5708cffbdcc441f_202_1.png)


    # title "Product Sales":


    ```

    proc sgplot data=sgbook,product_sales;

    yaxis label="Sales (in millions)"

    vbar product / response=actual bandwidth=0.4 discreteoffset=-0.2;

    vbar product / response=predict bandwidth=0.4 discreteoffset=0.2;

    run;

    ```


    9.3'
