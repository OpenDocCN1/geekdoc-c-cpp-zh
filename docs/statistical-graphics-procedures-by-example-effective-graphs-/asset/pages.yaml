  md: '# **Figure 5.6.3: Ellipse Clipping**


    The CLIP option prevents the ellipse data from contributing to the axis range,
    causing the ellipse to clip if it extends beyond the other data.


    ![](img/0c09161c0be53934e5708cffbdcc441f_166_0.png)


    ```

    title = "Heart Study Cholesterol Analysis";

    proc sgplot data=sashelp.heart noautolegend;

    where ageatstart <= 30;

    elipse x=weight y=cholesterol / clip;

    scatter x=weight y=cholesterol;

    axis grid;

    yaxis grid;

    run;

    ```


    # **Figure 5.6.4: Ellipse with Confidence Level**


    The ALPHA option sets the confidence level for the computation. By default, the
    alpha value is .05.


    Compare this output with Figure 5.6.1 to see the effect of the alpha change.


    ![](img/0c09161c0be53934e5708cffbdcc441f_166_1.png)


    ```

    title = "heart Study Cholesterol Analysis";

    proc sgplot data=sashelp.heart noautolegend;

    where ageatstart <= 30;

    elipse x=weight y=cholesterol / alpha=.35;

    scatter x=weight y=cholesterol;

    axis grid;

    yaxis grid;

    run;

