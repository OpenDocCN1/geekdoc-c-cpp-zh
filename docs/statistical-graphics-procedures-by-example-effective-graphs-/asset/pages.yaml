- img_proc: true
  md: '# Figure 7.4.9: Bar Chart with Groups and Pattern Fills


    The JOURNAL2 style is designed to be a black-and-white style. When this style
    is used with bar charts, fill patterns (SAS 9.3) are used in situations that need
    unique colors.


    The MONOCHROMEPRINTER style is also a black-and-white style, but uses serif fonts
    instead of sans-serif fonts.


    ```

    title "Product Sales";nproc sgplot data=sgbook.product_sales;

    axis label="Sales (in millions)"

    hbar product / response=actual region=region groupdisplay=cluster;

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_208_0.png)


    # Figure 7.4.10: Grouped Bar Chart using PROC SGPANEL


    In the previous grouping examples, the group values are clustered around a category
    value. In this example, the category values are clustered around a group value.


    The NOBORDER option is used to remove the border between panel cells, and the
    LAYOUT=ROWLICE option ensures cells are in one column.


    ```

    title "Product Sales";

    proc sganel data=sgbook.product_sales;

    panelby region / layout=rowlattice noborder varname onepanel;

    hbar product / response=actual;

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_208_1.png)'
