  md: '# ## 1.1.6 Short-Term Memory


    Generally, people find it difficult to absorb and retain a large number of data
    values at one time. Short-term memory is limited. Arranging the data in smaller
    chunks can aid in the processing of information. Research in this field shows:


    +   - An average person can easily remember 3-5 chunks of information.

    - An average person can mentally calculate with 2-digit numbers.

    - Excessive eye movement reduces efficiency of decoding a graph.


    ![](img/0c09161c0be53934e5708cffbdcc441f_21_0.png)


    Figure 1.14


    Both of the graphs above display revenues by product over time. The data are grouped
    by product, each representing one product. Figure 1.14 uses a traditional legend
    at the bottom of the graph to identify each product.


    To compare revenues for desks and chairs, you have to move your eyes to the legend
    and then back up to the plot. Figure 1.15 uses direct labeling for each series.
    This eliminates eye movement and thus facilitates easier comparisons of the data.


    Figure 1.15


    # ## 1.1.7 Summary


    You can use the above-mentioned guidelines to create graphs that convey information
    with maximum effectiveness and minimum distractions. In summary, we suggest that
    you:


    +   - Use distances from a common baseline to represent magnitude.

    - Use marker or line patterns for grouping.

    - Simplify the appearance of the plot and reduce unnecessary ink.

    - Increase proximity of data for better comparisons.

    - Reduce eye movement needed to decode the data.


    The SG Procedures provide the features you need to implement the above guidelines.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 1.2 Automatic Graphs from SAS Procedures


    Now let us see how you can get effective graphs using SAS. Starting with SAS 9.2,
    many SAS analytical procedures use the Output Delivery System (ODS) Graphics system
    to automatically produce graphs. When the ODS Graphics system is enabled, such
    graphs are produced along with data tables in the right order, and included in
    the output file such as a PDF document.


    To create the graphs from SAS 9.2 analytical procedures, you only need to switch
    on the ODS Graphics system before running the procedure. This is done by including
    the following statements in your program. No additional graph code is required.


    ```

    ods graphics / < options >;

    < procedure statements;

    ods graphics off;

    ```


    ```

    proc reg data=sashelp.class;

    model Weight = Height;

    quit;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_22_0.png)


    Figure 1.16


    Figure 1.16 shows the usage of ODS Graphics with an example of the REG procedure.
    In this example, we have specifically requested the Analysis of Variance table
    and the Fit Plot by using the ODS SELECT statements. The resulting HTML output
    is shown in Figure 1.17. The Analysis of Variance table and the Fit Plot are produced
    in the output HTML file.


    ![](img/0c09161c0be53934e5708cffbdcc441f_22_1.png)


    Figure 1.17


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    using SAS®: Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'It is worth repeating that the Fit Plot is produced automatically, without
    any graph coding required by the part of the user. It is useful to note that the
    procedures have to run additional processing processing steps to create these
    graphs. Some procedures may create a large set

    of graphs, which is something to consider when using this option.


    With SAS 9.3, running in DMS mode, the default output destination is HTML, and
    ODS Graphics is by default. For line mode, the default output destination is LISTING,
    and ODS Graphics is off by default. This is a change from SAS 9.2, where the default
    output destination is LISTING, and ODS Graphics is off by default.


    # 1.3 Graph Template Language


    The graphs mentioned in section 1.2 are created automatically by the procedure
    and do not require any additional programming by user. This is done by using predefined
    templates that use the Graph Template Language (GTL). All templates needed to
    create these graphs have been supplied with the software. The graph shown in Figure
    1.17 is created by the REG procedure using one of the predefined templates with
    SAS.


    GTL can also be used directly by, the SAS user, to create your own custom graph
    template. Then, you can use the SGRENDER procedure to associate this template
    with the appropriate data to produce the resultant graph.


    A detailed description of GTL and the SGRERENDER procedure is beyond the scope
    of this book. However, it should be noted that all graphs created by ODS Graphics
    system are done using the GTL syntax at some level. This is also true of the graphs
    produced by the Statistical Graphics (SG) procedures, which is the topic of this
    book.


    # 1.4 Statistical Graphics Procedures


    The SG procedures are a set of procedures that work within the ODS Graphics system.
    These procedures are designed to provide the familiar procedure syntax for creation
    of graphs that are most commonly used in various industries such as health and
    life sciences, finance, banking, quality control, and more.


    The graphs are created using GTL behind the scene. So, these graphs have the same
    look and feel as the automatic graphs created from the SAS analytical procedures.
    These graphs are useful for visualization of the raw data or for custom graphs
    of analysis results.


    +   1. Pre-analysis Data Exploration

    When you receive the data from a survey or a study, you may want to get multiple
    graphical views of the raw data before the analysis phase. Viewing the data using
    simple scatter plots, histograms, and scatter plot matrices can provide valuable
    insights into the data which can help in the analysis phase of the project.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# 2. Analysis of Data


    This phase of the project involves the analysis of the data using analytical procedures
    and/or your own data steps. Automatic graphs can be obtained from individual procedures
    as mentioned in section 1.2. In this phase you may also need to create specialized
    graphs that are not currently supported by the procedure itself.


    # 3. Post-analysis Data Presentation


    After the phase of the project, you may need to present the results of the analysis
    in form that is easily consumed by your audience. This goal is best achieved by
    presenting the results in the form of graphs that include the original data along
    with the analytical results. If the analysis requires multiple-procedure steps
    or custom data steps, it may be necessary to create custom graphs from the results.


    For all steps in the process above, you need to create graphs from the raw data
    or from the results of your custom analysis. You may also want to use the graphs
    that are automatically created by individual procedures in the report for the
    project. In this case, the SG procedures are the ideal tools for this job for
    the following reasons:


    +   - Graphs created by the SG procedures are identical in look and feel to the
    automatic graphs created by the analytical procedures. Mixing and matching the
    output from the SG procedures and the analytical procedures is seamless.

    - SG procedure steps can run with the analytical procedures and data steps to
    produce a sequential output in the open destination.

    - SG procedures provide a simple and concise syntax to create many types of graphs,
    classification panels, and scatter plot matrices.

    - With SAS 9.3, SG procedures also provide the ability to annotate the graph with
    Annotate-like functionality using a data set. Additionally, attribute maps can
    be used to control the usage of visual attributes like color or marker symbols
    in the graph. These topics will be discussed in detail in Chapter 9.


    # 1.5 Organization of This Book


    The approach taken for this book is to present the results of the SG procedures
    via an example. A textbook on this topic would normally take you through all the
    features of the procedures, and you would have to know how many of the procedures
    to be able to generate a useful graph.


    Instead of listing all the options and features of the procedures, we take the
    reverse approach. If you have an idea of the graph you want to make, you can just
    flip through this book and find the graph closest to what you need. Then, right
    alongside, you will find the code necessary to create the graph. From there, you
    can build on the graph by borrowing from other examples in the book.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'SG procedures utilize a building-block approach to creating a graph. If you
    see two graphs that individually include elements that you want in one graph,
    it is highly likely that you can combine the statements in one procedure step
    and get the combined graph you need.


    For example, you can combine a scatter plot, a series plot, and various regression
    plot statements from different examples into one procedure step. Some common combinations
    are as follows:


    +   - Scatter, Series, Step, Band, Regression, Ellipse, VBarParm, and HBarParm

    - Histogram and Density

    - Bar Chart, Line Chart, and Dot Plot


    This book is organized as follows:


    +   - In Chapter 2, we start with a general description of each procedure. This
    will show the structure of the syntax and the main features with a few examples.
    From there on, we focus on examples, starting with single-cell graphs, and then
    moving to more complex cases.

    - In Chapter 3, we review graphs that are commonly used in various domains. This
    section covers the different graph types you can create. We defer the discussion
    of the plot options to subsequent chapters.

    - In Chapters 4-7, we cover the main groups of single-cell graphs using SGPLOT
    procedure. Plot statements used in these graphs can be combined within the groups
    to create the graph you need. Various supported options are used to demonstrate
    the features.

    - In Chapter 8, we cover common customizations for axes, legends, and inside.

    - In Chapter 9, we cover the topics of annotation and attribute maps. Annotations
    allow you to add custom graphical elements to a graph that may not be data driven.
    Attribute maps provide the ability to tie plot attributes like color, symbols,
    and line patterns to data values. These powerful features for detailed customization
    of graphs are included with SAS 9.3.

    - In Chapter 10, we cover classification panels using the SGPanel procedure. This
    procedure leverages all you have learned about single-cell graphs to produce graphs
    that are classified by multiple class variables.

    - In Chapter 11, we cover comparative scatter plots and scatter matrices using
    SGATTER procedure.

    - In Chapter 12, we cover graphs commonly used in the health and life sciences
    industry.

    - In Chapter 13, we cover some special business graphs. Here you will find detailed
    examples that combine features from previous chapters to create the graph.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '+   In Chapter 14, we cover the topic of styles. Here you will see the inner
    workings of styles and the association between style elements and graph features.
    We will cover the basics of creating your own custom style for graphs.


    +   In Chapter 15, we cover the options on the ODS DESTINATION statement that
    have a direct bearing on the rendering of the graphs. We also review the options
    you can set on the ODS GRAPH statement to control aspects of graph rendering.


    +   In Chapter 16, we cover how to create graphs appropriate for different use
    cases. Often, graphs are created for inclusion in a full slide of a Microsoft
    PowerPoint presentation, or in 3-1/4" of a Microsoft Word document for a printed
    journal. We will provide some tips on how to create graphs that are suitable for
    such cases.


    # ## 1.6 Data Sets and Custom Styles


    Most of the examples in this book use the pre-defined SAS data sets available
    in the SASHELP library. These include CARS, HEART, and a few others. Often, to
    reduce the number of classifiers, so that graph will fit in the restricted space,
    modified data sets are used that contain a sample of the data from these sets.
    In other cases, custom data sets are needed that are suitable for the example
    graph.


    Custom styles are sometimes used to render some of the graphs in this book. Primarily,
    these are necessary to reduce the font sizes to fit the graphs into the small
    space available. The results you may vary based on the active style for an ODS
    destination.


    # ## 1.7 Color and Gray-Scale Graphs


    The graphs created by the SG procedures, and by the ODS Graphics system in general,
    use the active style of the open destination. Often, these are optimized for full
    color output. This works well when the graph is consumed in a color medium.


    However, when color graphs are printed in gray scale, there is a significant loss
    of fidelity in the representation of distinct categories in the graph. For example,
    a graph with two series plots, one for Drug A and one for Drug B can be well represented
    in color with two distinct colors; say red and blue. These colors are often designed
    to have equal weight to avoid unintentional bias.


    When such a graph is printed in gray scale, these two plots look very similar
    unless they have other distinguishing features as line patterns and marker shapes
    to facilitate discrimination between groups. Bar charts can benefit from use of
    fills to facilitate discrimination.


    This book is printed in gray scale, so it is important to create the graphs that
    will print well in a gray-scale format. To ensure this, it is best to create the
    original graph in the gray-scale format that maximizes the discriminability of
    the different categories and groups. All of the'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'graphs included in this book are created using gray-scale styles such as Journal,
    Journal2 or Journal3, or styles derived from these styles.


    When you run a program from this book, or one of your own, the graph will be rendered
    using the active style of the open destination. For SAS 9.2, this is the LISTING
    destination. For SAS 9.3 in DMS session, this is the HTML destination. Since both
    of these destinations use a default color style, you will get a graph rendered
    in full color. To get a gray-scale graph, use one of the styles mentioned above.


    The WIDTH or HEIGHT options of the ODS GRAPHICS statement have been used to render
    the graphs for this book. However, these options are not used in the sample code.
    When you run the same code without these options, the graphs will render in the
    default size.


    # 1.8 Effective Graphics and the Use of Decorative Skins


    As alluded earlier, the SG procedures specifically, and ODS Graphics in general,
    are designed with the principles of effective graphics in mind. By default, the
    procedures always strive to create a graph that delivers the information with
    maximum clarity and minimum cluster or distraction.


    Though initially designed with the statistical user in mind, these procedures
    are finding increasing usage in non-statistical domains. In these use cases, there
    is often a desire for a flashier graph, even at the expense of effectiveness.


    In the SG procedures, the chart statements support an option to apply a decorative
    skin to a bar. This does not change the style of the bar but provides a "flashier"
    rendering. Some examples in this book can be used at the discretion of the user
    to demonstrate this feature. The intention is primarily to expose these available
    features.


    # 1.9 SAS 9.2 and SAS 9.3 Features


    This book assumes the user has the SAS 9.2 (TS2M0) or higher release. The examples
    in this book include the usage of SAS 9.2 (TS2M0) and SAS 9.3 features. Examples
    that use the features added in SAS 9.3 are marked with the 9.3 icon, the specific
    statement or option in **bold italics**.


    In some cases you can remove the new option and run the same code using SAS 9.2.


    Note: When running SAS 9.3 in DMS mode, the default open destination is HTML.
    For DMS mode, the default open destination is LISTING. The ODS GRAPHICS feature
    is automatically enabled for the execution of the SG procedures.'
