- img_proc: true
  md: '# Chapter 12: Health and Life Sciences Graphs


    # 12.1 Introduction


    The health and life sciences industry is an ideal candidate for use of graphs.
    Data is collected for many different applications such as clinical trials, demographics,
    vital signs, laboratory test results for chemistry and hematology, patient profiles,
    and adverse events. Data is initially collected in tabular format, and often consumed
    in the same form.


    Evaluation of such data can be significantly enhanced by the graphical displays
    of data in the form of dot plots, box plots, and lattice and matrix displays.
    Graphical display of data provides insights into trends and correlations that
    are not possible through tabular analysis. Often, combining the data and summary
    statistics on a single display allows for improved analysis and interpretation
    of the results.


    The examples include lab results over time, distribution of tests by treatment,
    lattice and matrix displays of liver function tests (LFT), patient profiles, adverse
    event plots sorted by relative risk, hazard function plots, and displays for evaluation
    of blood chemistry and hematology.


    SG procedures are very well suited for the creation of such displays using the
    techniques described in the previous chapters of this book. In this chapter, we
    will examine how you can create some common graphs used in this industry. Some
    examples are shown in Figure 12.1. Detailed code for creating such graphs is shown
    in the following pages.


    ![](img/0c09161c0be53934e5708cffbdcc441f_299_0.png)


    Figure 12.1'
  merge: -1
  pgno: 299
