  md: '# 4.5 Scatter Plots with Data Labels


    The SCATTER statement supports two ways to display data labels with each character
    strings:


    +   - MARKERCHAR = column

    - DATALABEL <= column >


    ![](img/0c09161c0be53934e5708cffbdcc441f_86_0.png)


    # 4.5.1 DATALABEL Option


    The scatter plot displays a marker at the (x, y) location for each observation.
    The SCATTER statement supports display of data labels with each marker using the
    DATALABEL option. In this case, the associated data label is displayed near the
    marker:


    +   - DATALABEL displays the Y value.

    - DATALABEL=column displays the values from the specified column.


    By default, a data collision avoidance algorithm is used to minimize collisions
    between labels and other markers in the plot. Plots with data labels can get busy
    quickly. When using data labels we recommend the following:


    +   - Use data labels.

    - Restrict the number of markers.

    - For moderately large number of markers, restrict the number of data labels.
    This can be done by selectively setting data labels to missing for some of the
    observations.


    The data collision avoidance algorithm attempts to move the labels to avoid collision
    with markers or other labels. This can sometimes move a label away from the marker.
    One technique to retain context is to use group colors as shown.


    # 4.5.2 MARKERCHAR Option


    It is desirable to display a character string at the (x, y) position for each
    observation instead of a marker. The MARKERCHAR=column draws a character string
    for the value from the column for each observation at the (x, y) location in the
    plot area.


    Figure 4.5.5 extends the example in Figure 4.4.14 to display the temperature value
    for each observation. This makes it easier to see both the trend and the actual
    value.'
  merge: -1
  pgno: 86
