  md: '# # Chapter 6: Distribution Plots


    In this chapter, we examine the distribution plots that are supported by the SGPLOT
    and SGPANEL procedures. The basic syntax for each plot and the options will be
    covered in detail in this chapter. Plots within this group can be mixed and matched
    with each other and with many X-Y plots from the basic plots group.


    # ## 6.1 Introduction


    The SGPLOT and SGPANEL procedures support multiple distribution plots as listed
    below. These plots normally not display the raw data. These plots can be combined
    only in specific ways with other plots in this category or the basic plots.


    | HISTOGRAM | DENSITY |

    | --- | --- |

    | VBOX | HBOX |


    ![](img/0c09161c0be53934e5708cffbdcc441f_173_0.png)


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 6,2 Histogram


    The histogram shows the distribution of a numeric variable. The syntax is: `histogram
    column <options>`;


    The observations are binned into N number of bins determined by the statement.
    The counts in the bin are shown as percentage by default. Alternatively, frequency
    counts can be displayed.


    ![](img/0c09161c0be53934e5708cffbdcc441f_174_0.png)


    Required Data Roles:


    | X | num-column | Position along the horizontal axis |


    Optional Data Roles:


    | FREQ | Frequency count for each observation |


    Appearance Options:


    | FILLATTRS | =fill-attrs | Appearance attributes for bins |


    Other Options:


    | BINSTART | =value | X coordinate of the first bin. |

    | BINWIDTH | =value | Width of the bin |

    | BOUNDARY | =keyword | Location of boundary values - UPPER | LOWER |

    | NBINS | =value | Number of bins |

    | SCALE | =keyword | PERCENT | COUNT | PROPORTION for Y axis scaling |


    Boolean Options:


    | NOFILL | Whether or not the bins are filled |

    | OUTLINE | NOUTLINE | Whether or not the bins have outlines |

    | SHOWWINS | Tickmark on the X axis is shown at the midpoint of the bin |


    Standard common options are supported


    | LEGENDABEL, NAME, TRANSPARENC, X2AXIS, Y2AXIS |


    Related Style Elements: The GraphData style element is used to draw the plot elements.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Figure 6.2.1: Basic Histogram


