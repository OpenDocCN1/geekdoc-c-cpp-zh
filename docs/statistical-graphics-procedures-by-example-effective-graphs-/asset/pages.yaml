  md: '# Chapter 3: Common Graphs


    In this chapter, we review some graphs commonly used in many domains, from the
    basic scatter plot to complex comparative graphs and classification panels. We
    will defer the detailed discussion of various plot options to subsequent chapters.


    # 3.1 Introduction


    All the graphs have a common structure:


    +   - one or more titles at the top and one more footnotes at the bottom

    - one or more graphical representations of the data in the middle

    - one or more legends, inside or outside the data area

    - insets or statistics table inside or outside the data area


    ![](img/0c09161c0be53934e5708cffbdcc441f_49_0.png)


    **Single-Cell Graphs:** In section 3.2, we will use the SGPLOT procedure to create
    single-cell graphs. We will put together the needed syntax to create graphs like
    the one shown above in Figure 3.1.1.


    **Classification Panels:** In section 3.3, we will use the SGPanel procedure to
    create classification panels. Once you know how to mix and match statements for
    PROC SGPLOT, all you need a PANELBY statement to set up the classification variables.


    **Comparative and Matrix Graphs:** In section 3.4, we will use the SGSCATTER procedure
    to create comparative and matrix graphs.


    In the rest of this chapter, we provide a broad coverage of the different types
    of graphs you can create using the SG Procedures. The goal is to expose you the
    different types of graphs, without going deep into the features of each plot.
    We will cover that in subsequent chapters.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# 3.2 Single-Cell Graphs


    # ### 3.2.1: Basic Scatter Plot


    This is a basic scatter plot of mileage by horsepower for sedans and sports cars.


    Default option settings are used, and the appearance settings are derived from
    the active style.


    Axes are thinned, and “optimal” tick values are displayed.


    ![](img/0c09161c0be53934e5708cffbdcc441f_50_0.png)


    ```

    *MPG by Horsepower for Cars:

    proc sgplot data=sasashelp,cars;

    where type=''Sedan'' or type=''Sports'';

    scatter x=horsepower ymg=city;

    run;

    ```


    # ### 3.2.2: Grouped Scatter Plot with Grid Lines


    This is a grouped scatter plot of mileage by car type. The visual attributes for
    each marker are based on the unique value of the group variable.


    The legend is positioned in the upper right corner of the data area using the
    KEYLEGEND statement.


    ![](img/0c09161c0be53934e5708cffbdcc441f_50_1.png)


    ```

    *MPG by Horsepower for Cars by Type:

    proc sgplot data=sasashelp,cars;

    where type=''Sedan'' or type=''Sports'';

    scatter x=horsepower ymg=city/ group=type;

    keylegend / title=''Type'': location=inside position=topright;\xaxis grid;

    yaxis grid;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS®. Copyright ©2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Figure 3.2.3: Fit Plot


    This is a fit plot of mileage by horsepower.

    The REG statement displays both the original data and the fit line. The large
    number of observations can obscure the fit line and clutter up the graph.


    The thickness of the fit line is set using the LINEATTRS option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_51_0.png)


    # Figure 3.2.4: Fit Plot with Transparent Markers


    In this fit plot, the clutter is reduced by suppressing the markers on the REG
    statement and using a SCATTER statement to display the markers with transparency.


    Using transparency can provide a better feel for the distribution of the data.


    ![](img/0c09161c0be53934e5708cffbdcc441f_51_1.png)


    ```

    MPG by Horsepower with Regression Fit;

    proc sgplot data=sashelp.cars;

    where type=''Sedan'' or type=''Sports'';

    reg x=horsepower y=mpg_city lineattrs=(thickness=2);

    keylegend / location=inside position=topright;

    axis grid;

    yaxis grid;

    run;

    ```


    ```

    Mileage by Horsepower with Marker Transparency;

    proc sgplot data=sashelp.cars;

    where type=''Sedan'' or type=''Sports'';

    scatter x=horsepower y=mpg_city transparency=0.9

    markers=(symbol=circlefilled);

    reg x=horsepower y=mpg_city lineattrs=(thickness=3);

    keylegend / location=inside position=topright across=1;

    axis grid;

    yaxis grid;

    run;

    ```'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Figure 3.2.5: Fit Plot with Confidence Limits


    This fit plot uses a regression plot with 2nd order fit using the DEGREE option
    on the REG statement. Confidence limits are requested by the CLI and CLM.


    The default line is positioned in the top right corner of the graph.


    ![](img/0c09161c0be53934e5708cffbdcc441f_52_0.png)


    # Figure 3.2.6: Grouped Fit Plot with Limits


    This shows a grouped regression plot with confidence limits and 2nd order fit.
    CLMTRANSPARENCY is set on the REG statement.


    To customize the plot, we have a name for the REG plot, and included it in the
    KEYLEGEND.


    ![](img/0c09161c0be53934e5708cffbdcc441f_52_1.png)


    ```

    * Mileage by Horsepower and Type;

    proc sgplot data=sashelpcars;

    where type=''Sedan'' or type=''Sports'';

    marker x=horsepower y=mpg_city group=type transparency=0.9

    markerattrs=(symbol=circlefilled);

    reg x=horsepower y=mpg_city group=type markers=''a''

    lineattrs=(thickness=2) degree=2 clmtransparency=0.6;

    keylegend ''a'' / location=inside positiontoprightacross=1;

    xaxis grid; y grid; run;

    ```'
  merge: -1
