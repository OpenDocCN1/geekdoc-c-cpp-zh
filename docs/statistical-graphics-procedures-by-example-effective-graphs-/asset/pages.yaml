  md: '# 6.4 Vertical Box Plot


    The vertical box (VBOX) plot shows the distribution of the analysis by category.
    The syntax is:


    ```

    bbox num-column < options>;

    ```


    A box is displayed for each unique category value. The default display includes
    the Q1-Q3 interval, mean, median, whiskers, and outliers.


    ![](img/0c09161c0be53934e5708cffbdcc441f_181_0.png)


    Required Data Roles:


    | num-column | Analysis variable. |

    | --- | --- |


    Optional Data Roles:


    | CATEGORY | =column | For category values along x-axis |

    | FREQ | =num-column | Frequency count for each observation |

    | GROUP | =column | Group variable for each observation |


    Appearance Options:


    | CONNECTATTRS | =line-attrs | Appearance for connect line |

    | DATABELATTRS | =text-attrs | Appearance for data labels |

    | FILLATTRS | =fill-attrs | Appearance of box interior |

    | LINEATTRS | =line-attrs | Appearance of box outliers |

    | MEANATTRS OUTLIERATTRS | =marker-attrs | Appearance of mean and outliers |

    | MEDIANATTRS | =line-attrs | Appearance of median |

    | WHISKERATTRS | =line-attrs | Appearance of whiskers |


    Other Options:


    | BOXWIDTH | =value | Width of the box as a fraction of spacing |

    | CAPSHAPE | =keyword | SERIF | LINE | [BRACKET] |

    | CONNECT | =keyword | The statistic to connect – MEAN, MEDIAN, etc. |


    Boolean Options:


    | DATABEL | Label the outliers |

    | EXTREME | Whiskers are drawn to the extreme values |

    | FILL | NOCAPS | Specifies whether the boxes are filled or not |

    | LABELFAR | Display labels for far outliers |

    | MISSING NOCAPS NOMAN | Various options |

    | NOMEDIAN NOUTLIERS NOTCHES | Various options |


    Standard options that are supported


    | CLUSTERWIDTH, DISCRETEOFFSET, GROUPORDER, LEGENDLABEL, NAME, NOMISSGROUP, TRANSPARENCY,
    X2AXIS, Y2AXIS |


    Related Style Elements: Same as for Scatter, Series, VBar, and HBar.'
  merge: -1
  pgno: 181
