  md: '# ## 4.7 Step Plot


    The step plot is similar to the series plot with a step join for each value. The
    syntax is:


    ```

    step=column y=column <options>;

    ```


    A step plot draws a horizontal line through the Y value, with a step change at
    the next observation.


    ![](img/0c09161c0be53934e5708cffbdcc441f_96_0.png)


    # ### Required Data Roles:


    | X | =column | Position along the axis |

    | Y | =num-column | Position along the vertical axis |


    # ### Optional Data Roles:


    | DATALABEL | =column | Label String for each observation |

    | GROUP | =column | Classification for multiple series |

    | URL | =column | URL for each observation |

    | YERRORLOW | =num-column | Lower value for Y Error Bar |

    | YERRORUPPER | =num-column | Upper value for Y Error Bar |


    # ### Appearance Options:


    | ERRORATTRIBUTES | =line-attributes | Appearance attributes for error bars |

    | LINEATTRIBUTES | =line-attributes | Appearance attributes for lines |

    | MARKERATTRIBUTES | =marker-attributes | Appearance attributes for markers |


    # ### Other Options:


    | CURABEL | =string | Curve label for non-grouped case |

    | CURABELLOCATION | =keyword | Curve label (INSIDE | OUTSIDE) |

    | CURABELPOSITION | =keyword | Curve position (TOP, BOTTOM, etc...) |

    | JUSTIFY | =value | Location of point relative to step |


    # ### Boolean Options:


    | BREAK | Break the series at meeting values |

    | CURVELABEL | Display curve labels from group role |

    | DATALABEL | Display Y value as data label |

    | MARKERS | Display the markers |


    **Standard common options are supported**


    ATRID, CLUSTERWIDTH, DISCRETEOFFSET, GROUPDISPLAY, GROUPORDER, LEGENDABLE, NAME,
    NAMINGGROUP, TRANSPARENCY, URL, XAXIS, YAXIS


    **Related Style Elements:** The GraphDefault style element is used to draw the
    plot elements. When a GROUP variable is present, or when multiple plot statements
    are overlaid, the GraphData1-GraphData12 elements are used, for each group or
    plot statements.'
