  md: '# Figure 6.2.3: Histogram with NBINS


    For this histogram, the NBINS=25. This is a hint for the plot; the actual bins
    may be different.


    Default scale for y-axis is percent. The x-axis label is suppressed. Transparency
    is to 40%.


    By default, the x-axis is linear.


    ```

