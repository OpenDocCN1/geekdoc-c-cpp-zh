- img_proc: true
  md: 'SG Procedures are designed with the principles of effective graphics built-in
    to convey the information with maximum clarity and minimum clutter. By default,
    these procedures will create graphs that are free of unnecessary clutter in the
    graph elements, legends, and axes.


    These procedures are designed to create graphs that are suitable for the statistical
    and analytical use cases. These graphs emphasize the maximization of ''chart ink''
    and removal of elements that are not clearly necessary for the delivery of the
    information. It will be evident that you have to do very little to get aesthetically
    pleasing graphs for these use cases.


    Visual aesthetics, however, are in the eye of the beholder. In non-statistical
    use case, the expectation of the consumer is for flashy graphs, even at the cost
    of effectiveness. One person''s ''chart junk'' is another person''s ''cool''.
    These procedures are finding increasing usage for the creation of graphs they
    support some options to add ''flash'' to these graphs. These options are mainly
    available for the bar charts and can be used when necessary.


    SG Procedures support full-color graphics. Many styles wished with SAS are optimized
    for creation of color graphs. However, printing color graphs in gray scale sometimes
    lead to undesirable results. This is important, because many technical journals
    are printed in gray scale. This book is printed in gray scale we have used the
    appropriate gray scale styles.


    The examples and techniques discussed in this book will be relevant and useful
    for all SAS users. This is particularly for statisticians and other analysts in
    the pharmaceutical, clinical trials, health care, financial, and other domains.
    This book is focused on how to create the required graph given the data. Techniques
    for modeling and analysis of the data itself are beyond the scope of this book.


    # # Acknowledgements


    Many people have contributed in many ways to make this book possible. We would
    like to thank Bob Rodriguez, Senior Director in Advanced Analytics at SAS, for
    supporting the concept behind this book and for his detailed review of the contents.
    His insightful suggestions have significantly improved the quality of the materials
    and the presentation of the book.


    On the contents of the book and accuracy of the information, we received invaluable
    support from Melissa Turner and Susan Schwartz, ''our eagle eye'' Both Melissa
    and Susan invested many days reviewing the code and improving the contents. We
    also thank our reviewers Leah McConnell, David Schlothauer, Peter Christine, and
    Rebecca Ottesen for their valuable suggestions. Our heartfelt thanks to Susan
    Slaughter for her review, moral support, and guidance on this project. The table
    of Set Combinations in section 2.4 is modeled after a similar table from Susan
    and Lora Deliche''s recent paper, ''Using PROC SGPLOT for Quick High-Quality Graphics'''
