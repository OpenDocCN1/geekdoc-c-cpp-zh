  md: '# Figure 4.14.3: REFLINE on Discrete Axis


    This is a bar chart of mean MPG (City) for all cars by Type. We want to place
    a vertical reference line between ''Sports'' and ''Truck'' on the x-axis.


    We do this by providing the category value, AXIS=X and DISCRETEOFFSET=-0.5. This
    places the reference line midway between the specified and previous midpoint value.


    ![](img/0c09161c0be53934e5708cffbdcc441f_126_0.png)


    # Figure 4.14.4: Multiple Reference Lines


    In this example, we have added Y reference lines with inside labels positioned
    at the lower side of the axis. We have set XAXIS OFFSET to create some room.


    We have added an X reference line at x=425. Since this value is beyond the data
    range, this refine would normally get clipped. To retain it, we have specified
    the NoClip option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_126_1.png)


    ```

    title *Vehicle Profile*;

    proc sgplot data=sgbook.cleans;;

    where _type = 1;

    vbarpar category type response=mean_mpg_city / dataskin=sheen;

    refine ''Truck'' / axis=x discreteoffset=-0.5;

    yaxis grid;

    run;

    ```


    ```

    title *Vehicle Profile*;

    proc sgplot data=sgbook.cars;;

    sphere type=''Sedan'' and (origin=''USA'' or origin=''Asia'');

    scatter x=hp ympg transparency=0.5;

    refine 18 24 / label=(''18'' ''24'') labeloc=inside labelpos=min;

    refine 425 / axis=x label=''425'' labeloc=inside noclip;

    axis offset=0.1 grid; xaxis grid;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Graphs Procedures by Example: Effective
