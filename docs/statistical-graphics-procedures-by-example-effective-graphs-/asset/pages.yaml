    lineattrs=(thickness=2);

    line date /response=masonry stat=mean markerattrs=(color=gray\nsymbol=square)
    lineattrs=(pattern=solid thickness=2);

    ```


    # Figure 7.6.12: Overlaid Line Charts with Discrete Offset


    Normally, response values of overlaid lines are drawn at the tick positions along
    the category axis, which can overlap.


    To move the values off of the ticks, use the DISCRETEOFFSET option. Negative values
    down to -0.5 the points. Positive values up to 0.5 the units.


    ![](img/0c09161c0be53934e5708cffbdcc441f_223_1.png)


    ```

    title "Avg. Number of Electrical Workers"

    proc sgplot datassash=workers;

    format date=year;

    axis label="Workers (in thousands)" offset=0.05 offsetmax=0.05;

    line date /response=electric stat=mean markers discreteoffset=-0.1 markerattrs=(color=black
    symbol=circle) lineattrs=(thickness=2);

    line date /response=masonry stat=mean markers discreteoffset=0.1 markerattrs=(color=gray
    symbol=circle) lineattrs=(pattern=solid thickness);

    ```'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# 7.7 Dot Plots


    The dot plot shows the summarization of the response by category or the frequency
    count of the category. The syntax is:


    ```

    dot column / options;

    ```


    By default, the data is summarized for each unique category value; however, user-defined
    formats can be used to create categorical ranges for summar. One marker is drawn
    for resulting category. If a group variable is specified, one marker is drawn
    for each group value, either overlaid on the tick value or offset from the tick
    value to create a cluster effect (see the GROUPDISPLAY option).


    ![](img/0c09161c0be53934e5708cffbdcc441f_224_0.png)


    Required Data Roles:


    | CATEGORY | column | Category variable |

    |---|---|---|


    Optional Data Roles:


    | FREQ =num-column | Frequency count for each observation |

    | GROUP =column | Group variable for each observation |

    | RESPONSE =column | Response values for the chart |


    Appearance Options:


    | MARKERATTR =marker-attr | Appearance attributes for the markers |

    |---|---|


    Other Options:


    | GROUPDISPLAY =keyword | OVERLAY | CLUSTER |

    |---|---|---|


    Boolean Options:


    | X2AXIS | Assign the plot to the secondary x-axis |

    | Y2AXIS | Assign the plot to the secondary y-axis |


    Standard common options are supported


    Related Style Elements: Same as VBAR and HBAR.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Figure 7.7.1: Basic Dot Plot


    Dot plots are highly effective plots for comparing a large number of category
    values.


    This example shows a basic dot plot using a MEAN statistic. The axis LABEL option
    is used to override the column label from the data set.


    ![](img/0c09161c0be53934e5708cffbdcc441f_225_0.png)


    ```

    title "Avg. Number of Electrical Workers";nproc sgplot data=sashelp.workers;

    format date year;

    axis label="workers (in thousands)"

    dot date / response=electric stat=mean;

    run;

    ```


    # Figure 7.7.2: Dot Plot with Marker Attributes


    The MARKERATTRS option is used to control the attributes of the markers in the
    plot.


    In this example, the marker shape and the marker size are modified.


    ![](img/0c09161c0be53934e5708cffbdcc441f_225_1.png)


    ```

    title "Avg. Number of Electrical Workers";nproc sgplot data=sashelp.workers;

    format date year;

    axis label="workers (in thousands)"

    dot date / response=electric stat=mean

    markerattrs=(symbol=diamondfilled size=11px);

    run;

    ```'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Figure 7.7.3: Dot Plot with Data Labels


    This example displays the dot plot response values by using the DATALABEL option.
    This option can be specified with a variable to display information other than
    the plot response values.


    The DATALABELATTRs can be used to override the default text attributes of the
    labels.


    ![](img/0c09161c0be53934e5708cffbdcc441f_226_0.png)


    ```

    title "Avg. Number of Electrical Workers";nproc sgplot data=esgbook.workers_missing;

    format date year;

    axis label="Workers (in thousands)";

    date / response=electric stat=mean

    datalabelattrs=(weight=style=italic);

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_226_1.png)


    # Figure 7.7.4: Dot Plot with a Reference Line


    Reference lines can be added to the dot plot by specifying a REFLINE statement.


    The order of the statements is significant. If the REFLINE statement is specified
    before the DOT statement, the line is drawn behind the dot plot. REFLINE statements
    specified after the DOT statement are drawn in front of the dot plot.


    ![](img/0c09161c0be53934e5708cffbdcc441f_226_2.png)


    ```

    title "Avg. Number of Electrical Workers";

    proc sgplot data=sashelp.workers;

    format date year;

    axis label="Workers (in thousands)";

    date / response=electric stat=mean;

    refine 300 / axis=X;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
