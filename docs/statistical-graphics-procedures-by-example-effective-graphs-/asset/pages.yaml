  md: '# 2.6 Styles and Their Usage


    Graphs created by the SG procedures use pre-defined visual attributes for various
    elements that make up a graph. This information is defined in ODS Styles that
    have been carefully designed with aesthetics and effectiveness in mind. This ensures
    these graphs have an aesthetically pleasing appearance by default. This also ensures
    various elements of the graph are balanced and distinct from each other. This
    is achieved through the usage of ODS Styles.


    A style is a collection of named elements. Each element is a bundle of visual
    attributes such as color, font, marker symbol, and so on. Any output to an ODS
    destination derive the necessary visual information from the active style. For
    example, output tables derive visual attributes for fonts and background colors
    for the headers, size, and color of titles, from the style.


    Graphs also derive the visual attributes for plot colors, marker symbols, line
    thickness, axis label fonts, from specific named elements of the style. The association
    between the element of the graph and the style element is well defined and described
    in detail in the ODS product documentation. Some relevant information is included
    in Chapter 14.


    You can control the visual appearance of the graphs in different ways:


    +   1. Use a pre-defined SAS style.

    2. Use a custom style.

    3. Use appearance options.


    **1. Use a pre-defined SAS style:** Every ODS output destination has a default
    style. All graphs written to this destination use this style by default. You can
    change the active style for an ODS output destination by setting the STYLE option
    for the destination. All graphs written to that destination use that style.


    ```

    destination style=style-name;

    ```


    **2. Use a custom style:** If you like one of the pre-defined SAS styles, but
    would prefer to change a few of the appearance settings, you can derive a new
    style from one of the SAS styles using the TEMPLATE procedure. For more information
    on this topic, see the ODS product documentation for PROC TEMPLATE.


    **3. Use appearance options:** A style set on the ODS destination affects all
    features of the graph rendered to the destination. You can customize the appearance
    of specific features of a graph by setting specific appearance options in the
    procedure syntax. This overrides the settings derived from the style only for
    that one case.


    Usage of these options will be apparent through many examples in this book. More
    information on this topic is covered in Chapter 14.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# 2.7 Template-Based Graphics vs. Device-Based Graphics


    The SG procedures work within the ODS Graphics system and use GTL to do the work
    of rendering the graph output. For this reason, we will refer to these procedures
    as "template-based graphics". The other SAS/GRAPH® procedures, such as GPLOT and
    GCHART, will be referred to as "device-based graphics".


    Often, users ask what is different about these procedures from the other SAS/GRAPH®
    procedures. While we cannot cover every difference here, the key differences in
    philosophy, process, and technology are listed below:


    +   1. SG procedures create output directly in industry standard formats, such
    as PNG, JPG, PDF, PS, and so on. SG procedures do not create SG output.


    +   2. SG procedures do not honor traditional global statements such as GOPTIONS,
    PATTERN, SYMBOL, AXIS or LEGEND. However, equivalent or similar functionality
    is provided through other procedures, ODS Graphics, or ODS destination options.


    +   a. The GOPTIONS statement is not supported (except for the RESET option to
    reset titles and footnotes). Global options that control the output are specified
    on the ODS graphics statement.


    +   b. TITLE and FOOTNOTE statements are supported, with the exception of a few
    options.


    +   c. PATTERN and SYMBOL statements are not supported. However, plot types and
    attributes are specified directly on the plots, which make the application of
    these attributes clearer.


    +   d. AXIS statements are not supported. However, PROC SGPLOT supports four axis
    statements (XAXIS, YAXIS, XAXIS, and YAXIS) to control the axes around the cell.
    PROC SGPanel supports the ROWAXIS and COLAXIS statements to control its axes.
    PROC SGATTER does not have axis statements, but there are techniques that will
    be described later for controlling some of these attributes.


    +   e. LEGEND statements are not supported. PROC SGPLOT and SGPanel support a
    KEYLEGEND statement to control the contents of the legend, its layout, and position.
    PROC SGATTER has a LEGEND option to give some legend control.'
  merge: -1
  pgno: 45
