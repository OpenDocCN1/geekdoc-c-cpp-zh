- img_proc: true
  md: '# Chapter 8: Axes, Legends, and Insets


    In this chapter, we examine the options for controlling the axes, legends, and
    insets. You have seen many of these options used throughout the examples in this
    book. This chapter will focus on the capabilities you have not yet seen.


    # 8.1 Introduction


    The SGPLOT procedure supports up to four axes (XAXIS, YAXIS, X2AXIS, and Y2AXIS),
    while the SGPanel procedure supports only two (ROWAX and COLAX). The axis statements
    are contained within the procedure code and can be specified in any order. For
    the secondary axes to appear in SGPLOT, a plot must be assigned to them using
    the X2AXIS or Y2AXIS options.


    The SGPLOT and SGPanel procedures support four types of axes: LINEAR, LOG, TIME,
    and DISCRETE. The axis type is chosen automatically by the chart type, the data,
    and the formats used; however, the LOG type is never chosen automatically. If
    you override the default axis type, be sure you do not specify an axis type that
    is incompatible with your chart type; otherwise, your chart will not draw. For
    example if you request a vertical chart, the x-axis is automatically set to DISCRETE.
    If you attempt to set the x-axis type to any other value, you will get a note
    in the chart and the chart will not draw.


    The following options can be used regardless of axis type. Axis options that apply
    to a specific type will be addressed in the following sections.


    # Common Options:


    | DISPLAY | =display-value |

    | --- | --- |

    | GRID | | Control the display of grid lines |

    | LABEL | =string | The label of the axis |

    | LABELATTRS | =text-attrs | Text attributes for the axis label |

    | OFFSET | =number | Tick offset preceding the lowest value on the axis |

    | OFFSETMAX | =number | Tick offset following the highest value on the axis |

    | REFTICKS | | Mirrors the ticks on the opposite axis |

    | REVERSE | | Reverses the order of the tick marks |

    | TYPE | =keyword | LINEAR | LOG | TIME | DISCRETE |

    | VALUEATTRS | =text-attrs | Text attributes for the axis tick values |


    The KEYLEG statement is used to specify the content and attributes of custom legends,
    as well as the attributes of automatic legends. This statement works the same
    way in both the SGPLOT and SGPanel procedures, with the exception of the LOCATION
    option. The LOCATION option is not available in the SGPanel procedure because
    internal legends are not'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'supported. The SGCATTER procedure has a LEGEND option that supports a subset
    of the options in the following legend table. See the documentation for more details.


    If the legend is located inside, and the POSITION option is not specified, the
    legend will automatically position itself in an area with the least amount of
    data collision. This feature is very useful for batch programs. If the plot data
    varies significantly from one to the next, the legend will move to the best possible
    position without any program change.


    # Legend Options:


    | ACROSS | =integer | Specifies the number of columns in the legend |

    | BORDER / NOBORDER | | Controls the display of the legend border |

    | DOWN | =keyword | Specifies the number of rows in the legend |

    | LOCATION | | INSIDE | OUTSIDE |

    | POSITION | =keyword | Specifies the legend position within the legend location
    (TOP, BOTTOM, etc.) |

    | TITLE | =string | Specifies a title for the legend |

    | TITLEATTRS | =text-attrs | Text attributes for the legend title |

    | VALUEATTRS | =text-attrs | Text attributes for the legend values |


    The INSET statement is used to add additional text or small tables to an SGPLOT
    graph. As the statement name suggests, the inset is always drawn within the plot
    area of the graph. The information in the inset is specified by the statement.
    See the examples for more details.


    If the POSITION option is not specified, the inset will automatically position
    itself in an area with the least amount of data collision. This feature is very
    useful for batch programs. If the plot data varies significantly from one to the
    next, the inset will move to the best possible position without any program change.


    # Inset Options:


    | BORDER / NOBORDER | =keyword | Controls the display of the inset border |

    | LABELALIGN | | LEFT | RIGHT | CENTER |

    | POSITION | =keyword | Specifies the inset position within the data area (TOP,
    BOTTOM, etc.) |

    | TEXTATTRS | =text-attrs | Text attributes for the inset text |

    | TITLE | =string | Specifies a title for the inset |

    | TITLEATTRS | =text-attrs | Text attributes for the inset title |

    | VALUEALIGN | =keyword | LEFT | RIGHT | CENTER |'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 8.2 Linear Axis


    In this example, the MIN and MAX options are used to set the data range of the
    x-axis. These options set the extent of the data range but not necessarily the
    first and last tick values.


    # Figure 8.2.1: Specifying Min/Max


    ![](img/0c09161c0be53934e5708cffbdcc441f_235_0.png)


    Appropriate tick values are automatically calculated to fit within the requested
    range. These options are available on all axis types except Discrete.


    ```

    **Class Statistics:**

    proc sgplot data=sashelp.class;

    xaxis xmin=75 max=125;

    loess x=weight y=height / clm;

    run;

    ```


    # Figure 8.2.2: Specifying a Tick List


    In this example, the VALUES option is used to set both the extent of the axis
    and the tick values to display. The tick values can be specified as a list, a
    sequence, or both.


    ![](img/0c09161c0be53934e5708cffbdcc441f_235_1.png)


    If the values do not have equal intervals, the values will still be placed in
    the correct numerical location along the axis. This option is supported by LINEAR
    and TIME axes.


    ```

    **Class Statistics:**

    proc sgplot data=sashelp.class;

    axis values=(70 to 120 by 10);

    loess x=weight y=height / clm;

    run;

    ```'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# ### Figure 8.2.3: The VALESHINT Option


    By default, the low and high values on the VALUES option set the extent of the
    axes.


    The VALESHINT option can be used to show the full data extent is displayed, and
    the tick values in the list are drawn on the axis if they fall within the data
    extent. This option is supported on LINEAR and TIME axes.


    ![](img/0c09161c0be53934e5708cffbdcc441f_236_0.png)


    ```

    title "Class Statistics";

    proc sgplot data=sashelp.class;

    axis values=(70 to 120) valueshint;

    loess x=weight y=height / clim;

    run;

    ```


    # ### Figure 8.2.4: The INTEGER Option


    ![](img/0c09161c0be53934e5708cffbdcc441f_236_1.png)


    If an axis displays a small data range, it is possible that tick values with decimal
    values appear.


    To prevent this, you can use the INTEGER option to force the axis to display only
    integer values.


    ```

    title "Low Response Values";

    proc sgplot data=sgbook.random;

    yaxis integer;

    vbar x / response=y dataskinned=pressed;

    run;

    ```'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 8.3 Log Axis


    Figure 8.3.1: Log Expand Style


    In this example, the log axis shows the expanded form of the log exponent.


    The MINOR option is specified to display the minor tick marks on the axis.


    ![](img/0c09161c0be53934e5708cffbdcc441f_237_0.png)


    ```

    title "Plot of Y by X";

    proc sgplot data=sgbook.logdata;

    xaxis integer;

    yaxis type=log logstyles=LogExpand label="log(y)" minor;

    series x=x y=y / markers;

    run;

    ```


    Figure 8.3.2: Log Exponent Style


    In this example, the log axis displays the exponent instead of the expanded form.


    ![](img/0c09161c0be53934e5708cffbdcc441f_237_1.png)


    ```

    title "Plot of Y by X";

    proc sgplot data=sgbook.logdata;

    xaxis integer;

    yaxis type=log logstyle=LogExponent label="log(y)";

    series x=x y=y / markers;

    run;

    ```'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Figure 8.3.3: Log Linear Style


    With the LINEAR style of log axis, the major tick marks are placed at non-uniform
    locations covering the range of the axis.


    ![](img/0c09161c0be53934e5708cffbdcc441f_238_0.png)


    ```

    title "Plot of Y by X";nproc sgplot data=sgbook.logdata;

    xaxis integer;

    nyaxis type=log logstyle=Linear label="log(y)";

    series x=x y=y / markers;

    ```


    # Figure 8.3.4: The LOGBASE Option


    This option sets the base for the log calculations. The three valid values are
    2, and e.


    ![](img/0c09161c0be53934e5708cffbdcc441f_238_1.png)


    ```

    title "Plot of Y by X";nproc sgplot data=sgbook.logdata;

    xaxis integer;

    nyaxis type=log logstyle=LogExpand label="log(y)" logbase=e;

    series x=x y=y / markers;

    ```'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# ## 8.4 Time Axis


    Figure 8.4.1: The INTERVAL Option


    By default, the time axis calculates the best time interval and format. You can
    use the INTERVAL option to override the default interval.


    ![](img/0c09161c0be53934e5708cffbdcc441f_239_0.png)


    ```

    title "Air Travel";

    proc sgplot data=sashelp.air;

    where date >= ''*01jan1959''d and date <= ''*01jan1961''d;

    xaxis offsetmin=0 interval=semiyearly;

    yaxis offsetmin=0 label="Int. Air Travel";

    band x=date upper=air lower=300;

    run;

    ```


    Figure 8.4.2: The NOTIMESPLIT Option


    By default, the horizontal time axis extracts the highest time order and displays
    it on a second line to save space.


    The NOTIMESPLIT option prevents the extraction. Compare this example with Figure
    8.4.1. In this example, the year is kept with each tick value.


    ![](img/0c09161c0be53934e5708cffbdcc441f_239_1.png)


    ```

    title "Air Travel";

    proc sgplot data=sashelp.air;

    where date >= ''*01jan1959''d and date <= ''*01jan1961''d;

    axis offsetmin=0 interval=semiyearly notimesplit;

    yaxis offsetmin=0 label="Int. Air Travel";

    band x=date upper=air lower=300;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit.sas.com/publishing.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Figure 8.4.3: The TICKVALUEFORMAT Option


    By default, the time axis determines the best format to use based on the interval.


    You can override this behavior by specifying a format using the TICKVALUEFORMAT
    option. This option is also supported by the LINEAR axis.


    ![](img/0c09161c0be53934e5708cffbdcc441f_240_0.png)


    ```

    title "Air Travel";

    proc sgplot datasashelp.air;

    where date >==''01jan1959''d and date <==''01jan1961''d;

    yaxis offsetmin=0 label="Int. Air Travel"

    xaxis offsetmin=0 interval=semiyear tickvalueformat=monony5.;

    band x upper=air lower=300;

    run;

    ```


    # Figure 8.4.4: The MINOR Option


    By default, minor tick marks are not drawn on the axis.


    The MINOR option turns them on for TIME axes and LOG axes.


    ![](img/0c09161c0be53934e5708cffbdcc441f_240_1.png)


    ```

    title "Air Travel";

    proc sgplot datasashelp.air;

    where date >==''01jan1959''d and date <==''01jan1961''d;

    yaxis offsetmin=0 label="Int. Air Travel"

    xaxis offsetmin=0 interval=semiyear tickvalueformat=monony5. minor;

    band x upper=air lower=300;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# 8.5 Discrete Axis


    Figure 8.5.1: Fit Policy


    When collisions occur on a horizontal discrete axis, the FITPOLICY option can
    be used to control which policy or sequence of policies are used to resolve the
    collision.


    In this example, the STAGGER policy was used instead of the default.


    ![](img/0c09161c0be53934e5708cffbdcc441f_241_0.png)


    ```

    title "Class Statistics";

    proc sgplot data=sashelp.class (obs=10);

    xaxis fitpolicy=stagger;

    vbar name / response=height dataskin=pressed;

    ```


    Figure 8.5.2: Discrete Order


    By default, the ticks of categorical charts and box plots are sorted by ascending
    unformatted value. The DISCRETE order can be used to change the sort order.


    In this example, the bars are drawn in DATA order. For bar charts, line charts,
    and dots, the CATEGORYORDER option can be used to sort response values.


    ![](img/0c09161c0be53934e5708cffbdcc441f_241_1.png)


    ```

    title "Product Sales";

    proc sgplot data=sashelp.prdsale;

    xaxis discreteorder=data;

    vbar product / response=actual dataskin=pressed;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Graphs Procedures by Example: Effective
    Graphs Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 241
- img_proc: true
  md: "# 8.6 Legends\n\nFigure 8.6.1: Automatic Legends\n\nWhen grouped plots or multiple\
    \ plots are specified, the SG procedures evaluate the request to determine the\
    \ best legend to display.\n\nOnly one automatic legend is drawn. If more legends\
    \ are needed, you need to create custom legends (see Figure 8.6.2).\n\n![](img/0c09161c0be53934e5708cffbdcc441f_242_0.png)\n\
    \nTitle \"Class Statistics\":\n\n```\nproc sgplot data=sashelp.class;\n  scatter\
    \ x=weight y=height / group=sex;\nrun;\n```\n\nFigure 8.6.2: Custom Legends\n\n\
    To customize the default legend or create your own, use the KEYLEGEND statement.\n\
    \nAssign names to the plots to be included in the legend(s) and list their names\
    \ in the order which you want them displayed. The LABEL option can be used to\
    \ customize the legend label for a plot without groups.\n\n![](img/0c09161c0be53934e5708cffbdcc441f_242_1.png)\n\
    \n```\nproc sgplot data=sashelp.class;\n  scatter x=weight y=height / group=sex\
    \ name=\"\";\n  ellipse x=weight y=height / name=\"1\";\n  ellipse x=weight y=height\
    \ / alpha=0.2 name=\"2\";\n  keylegend \"1\" \"2\";\n  keylegend \"a\" / location=inside\
    \ title=\"Sex\";\nrun;\n```"
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Figure 8.6.3: The LOCATION and POSITION Options


    The LOCATION option specifies whether a legend is inside or outside of the data
    area. The POSITION option specifies one of eight positions in the legend''s location.


    If the legend is inside the data area, and POSITION is not specified, the legend
    will automatically position itself in an area with the least amount of data collision.


    ```

    Title "Class Statistics";

    proc sgplot datasashelp.class;

    scatter x=weight / group=sex name="s"

    elipse x=weight / name="e1"

    elipse x=weight / alpha=0.2 name="e2"

    keylegend="e1", "e2"

    keylegend="s" / locationinside positionbottomright title="Sex"

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_243_0.png)


    # Figure 8.6.4: The ACROSS and DOWN Options


    The ACROSS and DOWN options control the layout of the legend entries. The ACROSS
    option limits how many entries are drawn across.


    In this example, setting ACROSS=1 forces the legend entries to be drawn in one
    column.


    ```

    Title "Class Statistics";

    proc sgplot datasashelp.class;

    scatter x=weight / group=sex name="s"

    elipse x=weight / name="e1"

    elipse x=weight / alpha=0.2 name="e2"

    keylegend="e1", "e2"

    keylegend="s" / locationinside across l1 title="Sex"

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_243_1.png)


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS®. Copyright © 2011,

    SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional
    SAS resources, visit support.sas.com/publishing.'
  merge: -1
