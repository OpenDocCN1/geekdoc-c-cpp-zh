    the frequency for each observation. The data set itself only has observations
    where type=''Sedan''.


    In this graph the y-axis is ''Count''. The x-axis is suppressed.


    By default, the x-axis is linear.


    ![](img/0c09161c0be53934e5708cffbdcc441f_175_1.png)


    ```

