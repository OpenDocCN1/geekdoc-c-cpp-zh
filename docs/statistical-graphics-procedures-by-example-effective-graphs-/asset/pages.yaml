- img_proc: true
  md: '# Figure 9.1.10: Background Images in the Graph


    In this example, the IMAGESCALE column is used to tile the texture image. The
    WIDTH and HEIGHT columns define the size of the area in which to tile the image.
    The ANCHOR, X1, and Y1 columns determine where the tiling area is positioned.
    The LAYER column is used to push the image to the back of the graph, ever behind
    the wall of the plot area.


    ![](img/0c09161c0be53934e5708cffbdcc441f_256_0.png)


    | function | anchor | x1 | y1 | width | height | widthunit | heightunit | imagescale
    | drawspace | transparency | layer | Image |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---
    |

    | Image | bottomright | 100 | 0.5 | 640 | 480 | pixel | pixel | tile | graphpercent
    | | 0.5 | back | graywood.jpg |


    ```

    data anno:

    retain function "Image" "bottomright" x1 100 y1 0.5 width 640

    height 480 widthunit "pixel" heightunit "pixel" imagescale "tile"

    drawspace "graphpercent" layer "back" transparency 0.5

    Image "graywood.png";

    nrun;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS© © 2011,

    SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional
    SAS resources, visit support.sas.com/publishing.'
