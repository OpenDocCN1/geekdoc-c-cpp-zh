    # Figure 10.4.10: Grouped Bar Chart


    SG procedures with SAS 9.2 do not support adjacent ''cluster'' grouped bar charts.
    This graph type can be simulated using the Layout-ColumnLattice option and other
    appropriate options as shown here.


    SAS 9.3 does support ''cluster'' grouped bar charts as discussed.


    ```

    title ''Vehicle Mileage by Origin ...'';

    proc sgpanel data=sashelp.cars;

    where type = ''Hybrid'';

    panelby origin / onepanel variable

    layout=columnlattice noborder

    colheadborder=bottom;

    vbar type / response=mpg_city

    statmean dataskloss=gloss type=;

    colaxis grid=none

    offsetmin=0.2 offsetmax=0.2;

    rowaxis grid;

