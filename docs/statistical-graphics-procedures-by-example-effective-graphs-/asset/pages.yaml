- img_proc: true
  md: '# # Chapter 1: Introduction


    Graphs are an essential part of modern data analysis. From clinical trials to
    quality control, effective graphs are integral to the analysis process. Large
    quantities of data are collected for clinical drug trials for safety, retail sales,
    warranty claims, medical lab results, and financial transactions. This data analysis
    often relies on review of the data in tabular form. Viewing the data in the form
    of a graph along with results of the statistical analysis of the data on the same
    graph can significantly enhance the understanding of the data and the results.


    A key aspect of this process is the ability to create an effective graph that
    can communicate the raw data along with the statistical results in a clear and
    concise form. These graphs can help the analyst to visualize the trends and patterns
    in the data and the associations between variables that are not evident in tabular
    form. Such insights can guide the direction of further questions and formulation
    of additional testing methods and gathering of more focused data.


    # ## 1.1 Principles of Effective Graphics


    Research in the field of visual perception has guided the formulation of the principles
    for creation of effective graphs. The Visual Display of Quantitative Information
    (2001) by Edward Tufte, Visualizing Data (1993) by William S. Cieleland, and Creating
    Effective Graphs (2004) by Naomi Robbins provide an in-depth coverage of the topic.
    Some of these principles are reviewed here.


    A graph is considered if it conveys the intended information in a way that can
    be understood quickly and without ambiguity by most consumers. Figure 1 shows
    an interesting graph of the use of text on cell phones. The font sizes are increased
    for readability.


    In Figure 1, the consumer would be hard pressed to discern the differences (if
    any) between individual pie slices such as the second and third slice from the
    top. The pie chart does not facilitate comparison of magnitude between individual
    categories.


    ![](img/0c09161c0be53934e5708cffbdcc441f_15_0.png)


    This graph is further complicated by addition of the cumulative strips along the
    outside of the pie chart. One reason why a pie chart is not an effective graph
    is the difficulty of making magnitude comparisons when the data is plotted as
    an angle from a common (or noncommon) base. This applies to the strips and the
    slices.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Teenager Phone Usage


    ![](img/0c09161c0be53934e5708cffbdcc441f_16_0.png)


    Figure 1.2


    Comparison of magnitude along a linear scale from a common base is very reliable.
    The same data rendered as a bar chart is much easier to decode de novo as shown
    above in Figure 1.2. In this graph, the comparisons between the 2nd, 3rd and 4th
    bars for the % case are much easier and more reliable.


    The pie chart can be a useful visual for some use cases as shown in Figure 1.3.
    This graph shows the portion of sales for Auto as a fraction of a total sales.
    The pie chart can help visualizing "part-to-whole" comparisons.


    # 1.1.1 Visual Perception


    ![](img/0c09161c0be53934e5708cffbdcc441f_16_1.png)


    The concepts of attentive and pre-attentive vision are summarized by Daniel Carr
    in *Information Visualization: Perception for Design** (2004) by Colin Ware. Attentive
    vision requires scrutiny of the object and an active participation on the part
    of the observer.


    On the other hand, pre-attentive vision processing to be done prior to conscious
    attention. Usage of pre-attentive features helps in rapid discrimination between
    various artifacts of a graph.


    Figure 1.3


    Differentiation of length of lines is pre-attentive regardless of a common baseline.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'In Figure 1.4, it is relatively easy to compare the magnitudes of the responses
    for all drugs. The line segments in Figure 1.5 are plotted from different baselines,
    but still it is possible to compare the magnitudes of each line segment for the
    drugs.


    ![](img/0c09161c0be53934e5708cffbdcc441f_17_0.png)


    Figure 1.4


    Figure 1.5


    Differentiation of marker shapes and line patterns are pre-attractive. Groups
    can be easily differentiated when marker shapes or line patterns are used as grouping
    indicators as shown in Figure 1.6 and 1.7.


    ![](img/0c09161c0be53934e5708cffbdcc441f_17_1.png)


    Figure 1.6


    Figure 1.7


    Based on their pre-attractive nature (ease of decoding) we conclude the following:


    +   - Distances from a common baseline are effective for magnitude comparisons.

    - Marker shape is effective for classification.

    - Line pattern is effective for classification.

    - Color is also an effective tool for classification, but since this book is published
    in gray scale, we have not utilized that feature.


