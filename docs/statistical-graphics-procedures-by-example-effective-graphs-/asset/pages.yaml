- img_proc: true
  md: '# # Chapter 2: Statistical Graphics Procedures


    In this chapter we introduce the key concepts for the SG procedures and the general
    syntax.


    The SG procedures provide a direct procedure interface into the ODS Graphics system.
    These procedures create graphs with very little code. The SGPLOT and SGPANEL procedure
    syntax allows you to build complex graphs by use of plot statements and other
    features. The SSCATTER procedure syntax is designed to give single-statement access
    to a variety of scatter plot panels and matrices.


    # ## 2.1 Key Concepts


    The graphs created by these procedures can be grouped into three broad categories:
    single-cell graph, multi-cell classification panels, and multi-cell comparative
    scatter plots. These categories are discussed in the following sections.


    # ### 2.1.1 Single-Cell Graph (SGPLOT Procedure)


    ![](img/0c09161c0be53934e5708cffbdcc441f_31_0.png)


    Figure 2.1


    +   Figure 2.1 shows a typical single-cell graph built using the following components:

    - one or more titles at the top of the graph.

    - one or more footnotes at the bottom of the graph

    - one region in the middle displaying the data

    - one or more plots in the data area

    - one or more legends or inserts inside the data area or outside


    Note: All statements are referred to as “plot", regardless of whether it is a
    series plot, scatter plot, bar chart, histogram, and so on.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Graph: Refers to the individual output created by the procedure. In most of
    common cases, each execution of the procedure creates one graph output file. Often
    these procedures produce multiple output files (BY variable usage, or paging of
    large panels), each of which is referred to as a “Graph".


    Cell: Each graph can have one or more data areas where the data is plotted as
    shown in Figure 2.2. Each of these is referred to as a “Cell”. A cell may or not
    include axes.


    Plot statements: Each plot statement is responsible for drawing its own data representation.
    It is told by the container where to draw itself and how to scale its data.


    Axes: The X and Y axes are shared by all the plots in the graph. The data range
    for each axis is determined by the graph and is based on all the plots placed
    in it. Each graph can have a second set of axes, called X2 (at the top) and Y2
    (on the right). Each plot can specify which axes it wants to use.


    Legends: A graph can have one or more legends, and each be placed in any part
    of the graph. Each legend can specify the information to be displayed in it.


    Single-class graphs are generated using the SGPLOT procedure.


    # 2.1.2 Multi-Class Classification Panels (SPANEL Procedure)


    ![](img/0c09161c0be53934e5708cffbdcc441f_32_0.png)


    ![](img/0c09161c0be53934e5708cffbdcc441f_32_1.png)


    Figure 2.2


    Figure 2.3


    Classification panels are very useful to visualize the distribution of data classified
    by one or more class variables in one display. Figures 2.2 and 2.3 both display
    the association between MPG andpower for vehicles of origin and type of car. From
    both graphs, one can gain some information:


    +   - For both Asian and US cars, "Sedan" outnumbers "Sports" cars.

    - Figure 2.2 shows that US sports cars provide higher horsepower choices.

    - Figure 2.3 shows that Asian cars offer higher MPG choices.


    Matange, Sanjay and Heath, Dan. Statistical Graphics by Example: Effective Graphs
    Using SAS© Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
