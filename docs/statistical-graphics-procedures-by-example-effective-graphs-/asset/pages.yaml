  md: '# Figure 7.3.7: Bar Chart with Limits and Label Positioning


    This example shows the display of the bar and limits data.


    The position of the data labels can be controlled by using the DATALABELPOS option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_199_0.png)


    ```

    title "Average Cholesterol by Age Group";nproc sgplot data=sashelp.heart;

    format AgeStart=agefit;

