    ![](img/0c09161c0be53934e5708cffbdcc441f_37_0.png)


    Figure 2.10


    Figure 2.11


    The program code in Figure 2.10 has the following items:

    The PANELBY statement is required, and must come before any plot, axes, reference
    line, or legend statements.

    The two plot statements, HISTOGRAM and DENSITY, define the "Prototype" that is
