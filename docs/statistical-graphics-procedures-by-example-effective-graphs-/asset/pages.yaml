  md: '# 12.5 Adverse Event Timeline


    This graph shows adverse events by time and severity. The data is extracted from
    Clinical Data Interchange Standards (CDISC) data and is as shown in the table
    below. The key features of the graph are:


    +   - Vector plots are used to display the events.

    - Scatter plots are used to show the start and end events.

    - Scatter plot with MARKERchar is used to display the event name.

    - Note: X position (xc) for the label needs to be computed. See detailed program.


    | Obs | asteate | aeseacd | adecded | aesev | xc | aesevy | startday | endday
    | endnday |

    |---|---|---|---|---|---|---|---|---||

    | 1 | 06MAR13 | 06MAR13 | 1 | DUMMY | MILD | -100 | -4.4 | 0 | 0 | 0 |

    | 2 | 06MAR13 | 06MAR13 | 1 | DUMMY | MODERATE | -100 | -4.4 | 0 | 0 | 0 |

    | 3 | 06MAR13 | 06MAR13 | 1 | SEVERE | -100 | -4.4 | 0 | 0 | 0 |

    | 4 | 06MAR13 | 06MAR13 | 1 | DIZZINESS | MODERATE | -1 | -6.6 | 0 | 0 | 0 |

    | 5 | 20MAR13 | | 2 | COUGH | MILD | 2 | 9.57 | 14 | 14 | 104 |


    ```

    title "Adverse Events for Patient Id = xx-xxx-xxxx"

    proc sgplot data=sgbook,acat nootelaage nocycleattr;

    refine(axis=(thickness=1)color=black);

    vector xendesy ysy / markerchartay vertortgny noarrowheads

    lineatrs=(thickness=9);

    vector xendesy ysy / markerchartay vertortgny group=aesev noarrowheads

    lineatrs=(thickness=9)pattern(transparency=0)name=''sev'';

    scatter xendesy ysy / markerchar=(size=5px) symbol=triangledfilled group=aesev;

    scatter xendesy ysy / markerchar=(size=5px) symbol=triangledfilled group=aesev;

    lineatrs=(thickness=9)pattern;

    scatter xendesy ysy / markerchar=(size=5px) symbol=triangledfilled group=aesev;

    scatter xsc xcy / markerchar=none;

    scatter xasteate ysy / markerchar=(size=0) x2axis;

    axis display=(label Study days novabels) min=0;

    axis grid label="Days" offsetsmin=0.02 offsetmax=0.02;

    values(from=0 by=22);

    x2axis notetimes display=(nolabel) offsetmin=0.02 offsetmax=0.02;

    keylegend "sev" title="";

    run;

    ```


