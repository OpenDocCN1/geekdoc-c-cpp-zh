- img_proc: true
  md: '# Figure 7.3.3: Bar Chart with Data Labels


    This example displays the bar response values above the bars using the DATALABEL
    option. This option can be specified with a variable to display information other
    than the bar response values.


    The DATALABELATTR can be used to override the default text attributes of the labels.


    ![](img/0c09161c0be53934e5708cffbdcc441f_197_0.png)


    ```

    title "Product Sales";

    proc sgplot data=sgbook.product_sales;

    vbar product / response=actualdatalabel

    datalabelattrs(weight=bold style=italic);

    run;

    ```


    # Figure 7.3.4: Bar Chart with Reference Line


    Reference lines can be added to the bar chart by specifying a REFLINE statement.
    The order of the statements is significant.


    If the REFLINE statement is specified before the VBAR statement, the line is drawn
    behind the bar chart. REFLINE statements specified after the VBAR statement appear
    in front of the bar chart as shown.


    ![](img/0c09161c0be53934e5708cffbdcc441f_197_1.png)


    ```

    title "Product Sales";

    proc sgplot data=sgbook.product_sales;

    vbar product / response=actual1;

    refine 80;

    run;

    ```'
