- img_proc: true
  md: '# Figure 5.3.9: Grouped Fits


    When a GROUP column is specified on a REG statement, both the scatter points and
    the fit lines are grouped.


    Two statements are used to control the transparency of the markers. The NOMARKER
    option used to disable the default scatter points.


    ![](img/0c09161c0be53934e5708cffbdcc441f_148_0.png)


    ```

    title "The Impact of Horsepower on MPG"

    proc sglplot datasashelp.cars;

    where type="Sedan";nscatter x=horsepower=ympg_city / group=origin transparency=0.85

    reg x=horsepower=ympg_city / group=origin nomarkers name="reg"

    keylegend="scat" / titles="origin"

    keylegend="reg" / location=inside across=1

    xaxis grid;

    run;

    ```


    # Figure 5.3.10: Single Fit with a Group


    To create a fit through all of your grouped scatter data, use a SCATTER statement
    to plot the grouped data and a REG statement without a group column and the NOMARKER
    option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_148_1.png)


    ```

    title "The Impact of Horsepower on MPG"

    proc sglplot datasashelp.cars;

    where type="Sedan"

    scatter x=horsepower=ympg_city / group=origin transparency=0.85

    name="scat"

    reg x=horsepower=ympg_city / nomarkers degree=3 name="reg"

    keylegend="scat" / location=inside across=1 title="origin"

    xaxis grid;

    run;

    ```'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Figure 5.3.11: Overlaid Fits


    You can overlay fits for comparison by using the NOMARKER option on all REG statements
    but, one, you can use a separate SCATTER statement for control over the scatter
    plot.


    Notice that the REG statements are assigned to a custom legend. The LEGENDLABEL
    option overrides the default label for each


    ![](img/0c09161c0be53934e5708cffbdcc441f_149_0.png)


    ```

    title "The Impact of Horsepower on MPG";

    proc sgplot data=sashelp.cars;

    where type="Sedan";

    scatter x=horsepower y=mpg_city / transparency=0.85;

    legendlabel1="degree=2";

    reg x=horsepower y=mpg_city / nomarkers degree=2 name="reg1"

    reg x=horsepower y=mpg_city / nomarkers degree=3 name="reg2"

    legendlabel1="degree=3";

    keylegend="reg2" location=inside=1;

    xaxis grid; yaxis grid;

    run;

    ```


    # Figure 5.3.12: Curve Fits


    Instead of using a legend to identify each fit, you can use the CURVELABEL option
    to directly label the fit lines. This approach works well when the lines are not
    too crowded.


    ![](img/0c09161c0be53934e5708cffbdcc441f_149_1.png)


    ```

    title "The Impact of Horsepower on MPG";

    proc sgplot data=sashelp.cars oautlegend;

    where type="Sedan";

    scatter x=horsepower y=mpg_city / transparency=0.85;

    reg x=horsepower y=mpg_city / nomarkers degree=2 legendlabel1="degree=2"

    reg x=horsepower y=mpg_city / nomarkers degree=3 legendlabel1="degree=3"

    xaxis grid;

    yaxis grid;

    run;

    ```'
  merge: -1
