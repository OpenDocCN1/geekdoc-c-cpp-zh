  md: '# Chapter 14: Styles


    A brief introduction to usage of styles with ODS Graphics was included in Section
    2.5. Let us review that information and expand on the topic of styles and their
    usage.


    # 14.1 Introduction


    Graphs created by the SG procedures derive their visual look and feel from the
    active style for the output destination. Each ODS destination has a default outlined
    style. Styles supplied by SAS are designed to ensure effectiveness and an aesthetically
    pleasing appearance by default. Default styles for common destinations are shown
    in Figure 14.1.


    You can create your own style to suit the look you prefer or present a consistent
    corporate look using the TEMPLATE procedure. The description of PROC TEMPLATE
    is beyond the scope of this book. However, since styles are intimately related
    to the topic of graphs, we will cover the related relevant topics here.


    | ODS Destination | Style Name |

    |---|---|n| LISTING | Listing |

    | HTML | HtmlBlue |

    | RTF | RTF |

    | PDF | PRINTER |n| Figure 14.1 | |


    For a discussion of styles and the TEMPLATE procedure, see the SAS documentation.


    # 14.2 Using Styles


    To change the overall visual appearance of the graphs, you can assign a different
    style by using the STYLE option on the ODS destination statement.


    ```

    ods destination style=name;

    ```


    When you do, all subsequent output sent to the destination will use this assigned
    style until the destination is closed or the style is changed.


    # 14.3 Style Elements


    A style is a collection of named elements. Each element is a bundle of named visual
    attributes such as color, font, marker symbols, and so on. Output tables derive
    visual attributes such as from, background colors for the headers, size, color
    of titles, etc. from the style.


    The default attributes of various graph elements are also derived from the style.
    Plot colors, marker symbols, line thickness, axis label fonts, etc. are derived
    from specific elements of the style. The association between the element of graph
    and the style element is well defined and described in detail in the product documentation.
    Some common style element names and their associated graph elements are shown
    in Figures 14.2 and 14.3.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '![](img/0c09161c0be53934e5708cffbdcc441f_334_0.png)


    Figure 14.2: Graph and Text Elements


    Figure 14.2 above lists some elements that are commonly used for various elements
    in the graph. These elements are used to determine the visual attributes for the
    graph background, walls, and the various text statements such as titles, footnotes,
    etc. The elements are listed below. This graph was created with SAS 9.9 PROC SGLOT.


    | Element Name | Usage |

    | --- | --- |

    | Graph | Graph background fill and border |

    | GraphWalls | Wall background fill and border |

    | GraphTitleText | Title font, size, color, etc. |

    | GraphFootnoteText | Footnote font, size, color, etc. |

    | GraphLabelText | Axis font, size, color, etc. Also Legend Title |

    | GraphValueText | Axis tick value and Legend entry font, size, color, etc. |

    | GraphDataText | Data labels font, size, color, etc. |


    If you want to create a new style that has smaller fonts for the ticks, you can
    customize the GraphValueText element appropriately. Then, all the graphs using
    this style will display the new style you have found.


    A new style can be created using the TEMPLATE procedure. It is generally good
    practice to derive a new style from a parent style. In this way, you only need
    to customize the elements that you need to change. For details on how to create
    a new style, see the SAS documentation for the TEMPLATE procedure.


    Matange, Sanjay and Heath, Dan. Statistical Graphics by Example: Effective Graphs
    Using SAS®. Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
