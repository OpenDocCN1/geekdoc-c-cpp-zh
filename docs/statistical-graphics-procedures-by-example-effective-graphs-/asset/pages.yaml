  md: '# 4.15 Parametric Line Plot (9.3)


    This parametric line plot statements has the following syntax:


    ```

    lineparm x=column y=column slope=num-column < opts>;

    ```


    The LINEPARM statement draws an infinitely long line given a point and slope.
    The plot cannot be drawn by itself as it is unbounded. Graph data extents are
    set by other data driven plots in the graph.


    Required Data Roles:


    | column | X coordinate of point |

    | --- | --- |

    | column | Y coordinate of point |

    | column | Slope of the line. Missing implies a vertical line. |


    Optional Data Roles:


    | CURVELABEL =column | Label for the line |

    | --- | --- |

    | GROUP =column | Classification for multiple series |

    | INDEX =num-column | Index for visual attributes |


    Appearance Options:


    | CURVELABELATTRS =text-attr | Appearance of the label |

    | --- | --- |

    | CURVELABELOC =keyword | OUTSIDE | INSIDE |

    | CURVELINEPOS =keyword | AUTO | MAX | MIN |

    | LINEATTRS =line-attr | Appearance of the line |


    Other Options:


    | CLIP =boolean | Include data for this plot in the range |

    | --- | --- |

    | LEGENDLABEL =string | Label that appears in legend |

    | NAME =string | Name for this statement |


    Boolean Options:


    | NOEXTEND | Line is not drawn to the axes |

    | --- | --- |

    | X2AXIS | Assigns X values to the X2 (top) axis |

    | Y2AXIS | Assigns Y values to the Y2 (right) axis |


    Common options are supported


    ```

    ATRID, LEGENDLABEL, NAME, MISSINGGROUP, TRANSPARENCY, X2AXIS, Y2AXIS

    ```


    Related Style Elements: The GraphData style element is used to draw the plot.
    When a Group variable is present, or multiple plot statements are overlaid, the
    GraphData1-GraphData12 elements are used, one for each group or plot statement.


    ![](img/0c09161c0be53934e5708cffbdcc441f_127_0.png)'
  merge: -1
  pgno: 127
