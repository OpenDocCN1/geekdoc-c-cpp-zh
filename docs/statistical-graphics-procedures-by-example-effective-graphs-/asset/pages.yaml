  md: '# # Chapter 15: ODS Destination and ODS Graphics Options


    # ## 15.1 Introduction


    All graph output from SG procedures is open, output is sent to each destination
    using the various options that are in effect for each destination.


    Global options that apply to the graphs are specified on the ODS GRAPHICS statement.
    In Chapter 2, we discussed the use of the ODS GRAPHICS statement to switch to
    the creation of automatic graphs from the SAS procedures. With SAS 9.3, ODS Graphic
    is ON by default for all procedures including the SG Procedures. Global options
    that control certain aspects of the graphs can be provided on this statement.


    # ## 15.2 ODS Destination Options


    The options relevant to the graphs are discussed in Figure 15.1. For complete
    details on all options for ODS destination, see the SAS documentation for ODS
    Language Statements.


    | Option | Values | Description |

    | --- | --- | --- |

    | DPI | Location | DPI for generated document |

    | GPATH | | The location for all graph output for this destination. |

    | IMAGE_DPI | | DPI for generated image. |

    | PATH | Location | The location for the output file for this destination. |

    | SGE | OFF | ON | Enable / disable creation of editable graph output |

    | STYLE | Style name | The ODS Style to be used for this destination. |

    | Figure 15.1 | |


    SGE: option is used to enable or disable the editable graph output in the format
    used by the ODS Graphics Editor. For SAS 9.2, the LISTING destination supports
    this option. For SAS 9.3 this option is available on all ODS destinations.


    By default, the SGE option is OFF. When SGE-ON, an editable graph is created along
    with the image file. Output is listed in the Results window. You can open this
    file to launch the ODS Graphics Editor to make non-persistent changes to the ODS
    Graphics output.


    DPI and Image_DPI: Graphs are rendered at default DPI for the output destination.
    For some destinations, the DPI applies only to the graph image. The size of the
    graph is based on the active DPI. If the size is specified in pixels (the default
    is pixels), then the baseline for scaling is the active DPI for the destination.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# 15.3 ODS Graphics Options


    Certain attributes of the ODS graphics output are controlled by options on the
    ODS GRAPHICS statement. These options stay in until reset or the ODS Graphics
    system is turned off. The syntax for the statement is as follows:


    ```

    ods graphics <on | off>; options;

    ```


    The options are listed in Figure 15.2.


    | Option | Values | Description |

    | --- | --- | --- |

    | ANTIALIAS | ON | OFF | Enable or disable anti-aliasing of lines and markers
    |

    | ANTIALIASMAX | | Maximum number of observations for anti-aliasing |

    | BORDER | ON | OFF | Display or hide the graph border |

    | DISCRETMAX | | Maximum number of discrete values |

    | GROUPMAX | | Maximum number of group values |

    | HEIGHT | | Height of the graph in px, cm, etc. |

    | OUTPUTFORMAT | PNG, GIF, etc. | Any one of the supported formats for the destination
    |

    | IMAGEMAP | ON | OFF | Enable or disable of image map for HTML |

    | IMENAME | string | Name for the output file |

    | LABELMAX | Value | Maximum number of labels displayed |

    | MAXLENGENDA | Value | Maximum % of the height occupied by legends |

    | PANELCELLMAX | Value | Maximum number of cells in a panel |

    | RESET | | Reset all (or individual) options to default |

    | SCALE | ON | OFF | Enable or disable scaling of graph elements |

    | TIPMAX | Value | Maximum number of tips displayed |

    | WIDTH | Value | Width of the graph in px, cm, etc.


    Figure 15.2


    For complete details on each option ODS see the SAS documentation for ODS Language
    Statements.


    **Anti-aliasing:** This is a technique used to improve the rendering of various
    elements in the graph such as markers, lines, text, and so on. Anti-aliasing improves
    the visual appearance of the elements which consumes more computing resources.
    Text elements in the graph are antialiased for high quality. When there are too
    many observations in the data, anti-aliasing becomes less effective and more costly.
    By default, anti-aliasing is turned off for markers and when the number of observations
    exceeds 600. The ANTIALIAS option can be used to enable or disable anti-aliasing.
    The ANTIALIASMAX option can be used to change the level when anti-aliasing is
    turned off.


    **DISCRETMAX, GROUPMAX:** If the number of discrete values in a graph, as number
    of categories on the axis or the number of group values becomes large, the procedure
    can'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'down or run out of memory. This can happen if the user inadvertently selects
    a variable that has a large number of discrete values for a discrete role, such
    as zip code, etc. In normal usage, variables used for such roles have < 1000 unique
    values. In this case, the procedure will stop processing and log a message. If
    you really need to run such a case, you can set these settings to a larger value
    to run your use case.


    **OUTPUTFMT:** The default output format is determined by the ODS destination.
    For many destinations using LISTING, HTML, etc., the graph is created in industry-standard
    image formats. You can specify the format you want by using this option. The value
    will only be honored if the output destination supports the format.


    **IMAGEMAP:** For the HTML destination, tool tips can be displayed for the data
    values in the graph. By default, this setting is OFF since it consumes computing
    resources. You can enable the creation of the image map for display of tool for
    HTML destinations


    **FILENAME:** The default name for the graph output file is "sgplot.xxx" or "sgpan.xxx"
    based on the procedure used. File names are automatically appended with an incremented
    counter to avoid overwriting of the files from multiple executions. You can provide
    your preferred name for the filename prefix.


    **LABELMAX:** Often you can request the display of data labels with markers, with
    minimal collision between labels. The procedures will attempt to place the data
    labels on the markers. At some point, there are too many labels in the graph,
    and the graph becomes ineffective. By default, the display of labels is disabled
    when the number of labels exceeds 200. You can use this limit to control this
    feature.


    **MAXLEGENDARE:** By default, the legends for the graph are dropped if the area
    occupied by them exceeds 20% of the total area of the graph. This is to prevent
    cases where the legend is so big that there is not much space left for the display
    of the data itself. You can control this limit by using this option.


    **RESET:** You can reset all options to the default settings by using this option.
    You can also use `reset=option-name` to reset one or more specific options. You
    can use `reset=index` to reset the counter that is used to postfix an index to
    the output file.


    **SCALE:** The output graph size is determined by the procedure. See the WIDTH
    and HEIGHT option. If you require a different height of the graph, the internal
    details of the graph are scaled using a nonlinear algorithm to render graphs with
    reasonable font sizes. In such a case, the actual font size may be different from
    what was specified for the text in the graph. You can enable or disable this scaling
    by using this option.'
  merge: -1
