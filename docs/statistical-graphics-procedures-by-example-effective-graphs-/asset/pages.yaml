  md: '# ### Figure 7.5.11:Overlaid Line Charts


    This example plots two response variables by overlaying a line chart for each
    variable.


    Each element has its own set of visual attributes and can be assigned to different
    axes. Also, the legend label can be changed for each chart using the LEGENDLABEL
    option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_216_0.png)


    ```

    title "Avg. Number of Electrical Workers";

    proc ggplot data=sasashhelp.workers;

    format date year;

    yaxis y_label="workers (in thousands)";

    vline date / response=electrical stat=mean markers markerattrs=(color=black)

    symbol=circle lineattrs=(black thickness=2);

    vline date / response=masonry stat=mean markers markerattrs=(color=gray)

    symbol=circle lineattrs=(color=gray pattern=solid thickness=2);

    ```


    # ### Figure 7.5.12: Overlaid Line Charts for Discrete Offset


    Normally, response values of lines are drawn at the tick positions along the category
    axis, which can cause overlap. To move the values off of the tick positions, use
    the DISOFFSET option.


    Negative values down -0.5 move the points to the left. Positive values move up
    to 0.5 to the right.


    ![](img/0c09161c0be53934e5708cffbdcc441f_216_1.png)


    ```

    title "Avg. Number of Electrical Workers";

    proc ggplot data=sasashhelp.workers nolegend;

    format date year;

    yaxis y_label="workers (in thousands)"; xaxis offset=0.05 offset=0.5;

    vline date / response=electrical stat=mean markers limitat=discreteoffset=0.1

    markerattrs=(color=black) symbol=circle lineattrs=(black thickness=2);

    vline date / response=masonry stat=mean markers discreteoffset=0.1 limitat=1

    markerattrs=(color=gray) symbol=circle lineattrs=(color=gray pattern=solid thickness=2);

    ```


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS(); Copyright © 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
