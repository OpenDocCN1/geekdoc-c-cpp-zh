- img_proc: true
  md: '# 4.2 SGPLOT Procedure


    The SGPLOT procedure supports the following syntax:


    ```

    proc sgplot data=dataset <options>;

    ```


    Options:


    | CYCLEATTRS | boolean | Cycle through style elements for each plot |

    | DATA | =sas-data-set | Optional data set |

    | DATTRMAP | =sas-data-set | Data defining an attribute map |

    | DESCRIPTION | =string | Description string |

    | NOAUTLEGEND | | Do not show the automatic legend |

    | NOCYCLEATTRS | | Do not cycle style elements for each plot |

    | PAD | =value | Padding around the outside of the graph |

    | SGANNO | =sas-data-set | Data set containing the annotations |

    | TMPLOUT | | File name for generated graph template code |

    | UNIFORM | =keyword | Uniform axis and legends across BY variables |


    The procedure supports the following statements:


    +   - Basic Plots: BAND, NEEDLE, SCATTER, STEP, SERIES, VECTOR, BUBBLE, HIGHLOW,
    HBARM, VBARM

    - Fits Plots: LOESS, POBSLINE, REG, LINEPARM

    - Distribution Plots: DENSITY, ELLIPSE HISTOGRAM, HBOX, VBOX

    - Categorical Plots: DOT, HBAR, HLINE, VBAR, VLINE, WATERFALL

    - Other: KEYLEGEND, INSET, REFLINE, XAXIS, YAXIS, X2AXIS, Y2AXIS


    The procedure has the following syntax:


    ```

    PROC SGPLOT DATA=data-set < options >;

    plot-statement(s) required-parameters < / options >;

    < refine-statement(s) >;

    < inset-statement(s) >;

    < keylegend-statement(s) >;

    < axis-statement(s) >;

    RUN;

    ```


    As in the examples in Chapter 3, one or more plot statements can be provided that
    will work together to create the graph. See the table of permissible combinations
    shown in section 2.4.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# 4.3 Plot Roles and Options


    All of the plot statements have the following syntax:


    ```

    PlotName required-data-roles </options>;

    ```


    All plot statements have required and optional parameters necessary to create
    the plot. These parameters fall in the following broad categories:


    +   1. required data roles

    2. optional data roles

    3. options

    4. common options


    Categories 1-3 above include role and option names that are specific to each plot.
    These role and option names are used consistently and only as needed. We will
    discuss these with each specific plot statement.


    Category 4 includes the set of options that are common to all plot statements
    as shown in the table below. Some plots may not support one or more of these common
    options.


    # Common Options:


    | | | |

    |---|---||

    | ATTRID | =string | The attribute ID (See Chapter 9). |

    | CLUSTERWIDTH | =value | Fraction of the mid-point spacing to be used for drawing
    the cluster. |

    | DISCRETEOFFSET | =value | Fractional shift within midpoint spacing |

    | GROUPDISPLAY | =keyword | OVER CLUSTER. Default values varies. |

    | GROUPORDER | =keyword | DATA ASCENDING DESCENDING |

    | LEGENDLABEL | =string | The label that appears in the legend to represent this
    (non-group) plot. |

    | NAME | =string | Specifies a name for this statement. Other statements, such
    as KEYLEGEND, can refer to it by its name. |

    | TRANSPARENCY | =value | Specifies transparency for the visual elements. |

    | URL | =string-column | URL link used in HTML output |


    Common Boolean options are available for each plot statement, and can be used
    exactly as described above. To avoid duplication, we will not list the above common
    options for the individual plots that are discussed in this chapter.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# 4.4 Scatter Plot


    The basic scatter plot is a key plot type for visualization of the raw data. The
    syntax is: scatter x=column y=column <options>;


    A marker is displayed at (x, y) location. Group, Data Labels, Marker Character,
    and X and Error Bars are supported. Discrete axes can have cluster grouping and
    discrete offsets.


    ![](img/0c09161c0be53934e5708cffbdcc441f_76_0.png)


    # Required Data Rules:


    | X | =column | Position along the horizontal axis |

    | Y | =column | Position along the vertical axis |


    # Optional Data Rules:


    | DATALABEL | =num-column | Label String for each observation |

    | FREQ | =num-column | Frequency count for each observation |

    | GROUP | =column | Classification variable for each observation |

    | MARKER | =column | String to be shown for the observation |

    | URL | =column | URL for each observation |

    | XERRORLOW | =num-column | Lower value for X Error Bar |

    | XERRORUPPER | =num-column | Upper value for X Error Bar |

    | YERRORLOW | =num-column | Lower value for Y Error Bar |

    | YERRORUPPER | =num-column | Upper value for Y Error Bar |


    # Appearance Options:


    | ERRORBATTRS | =line-attrs | Appearance attributes for error bars |

    | MARKERATTRS | =marker-attrs | Appearance attributes for markers |

    | MARKERCHARTRS | =text-attrs | Appearance attributes for char markers |


    # Boolean Options:


    | DATALABEL | Display Y value as data label |


    Standard common options are supported

    ATTRID, CLUSTERWIDTH, DISCRETEOFFSET, GROUPDISPLAY, GROUPORDER, LEGENDLABEL, NAME,
    MISSINGGROUP, TRANSPARENCY, URL, X2AXIS, Y2AXIS


    Related Style Elements: The GraphData style element is used to draw the plot.
    When a GROUP variable is present, or when multiple plot statements are overlaid,
    GraphData1-GraphData2 elements are used, one for each group or plot statement.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Figure 4.4.1: Basic Scatter Plot


    This is a basic scatter plot of mileage by horsepower. Marker attributes are customized
    to use the 2nd data element with filled markers.


    Marker transparency is set to 80%. This reduces clutter and helps to view the
    regions of higher density.


    ![](img/0c09161c0be53934e5708cffbdcc441f_77_0.png)


    ```

    title ''MPG by Horsepower for Cars'';

    proc sgplot data=sashelp.cars;

    where type=''Sedan'' or type=''Sports'';

    scatter x=horsepower y=mpg_city /

    yaxis grid;

    markerrattrs=graphdata2(symbol=circlelefilled) transparency=0.8;

    axis grid;

    run;

    ```


    # Figure 4.4.2: Grouped Scatter Plot


    When a GROUP variable is set, the marker attributes of each group are derived
    from the GraphData (1-N) style elements.


    An automatic legend is created for group values. We have used the KEYLEGEND statement
    to position the legend inside the area in the upper right.


    ![](img/0c09161c0be53934e5708cffbdcc441f_77_1.png)


    ```

    title ''MPG by Horsepower for Cars by Type'';

    proc sgplot data=sashelp.cars;

    where type=''Sedan'' or type=''Sports'';

    scatter x=horsepower y=mpg_city / group=type;

    keylegend / title="Type:" location=inside across=1;

    yaxis grid;

    run;

