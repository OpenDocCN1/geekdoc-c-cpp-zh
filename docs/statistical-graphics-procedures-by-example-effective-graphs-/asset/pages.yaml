- img_proc: true
  md: '# 5.5 Penalized B-Spline Plot


    The penalized B-spline plot shows a smoothed fit of the raw data

    created with a penalized B-Spline:


    A marker is displayed at each (x, y). A line is computed and displayed. Optionally,

    confidence limits and/or confidence limits of the means can be displayed.


    # Required Data Roles:


    | X | =num-column | Position along the horizontal axis |

    | Y | =num-column | Position along the vertical axis |


    # Optional Data Roles:


    | FREQ | =num-column | Frequency of the current observation |

    | WEIGHT | =num-column | Priority weights for a regression fit |


    # Appearance Options:


    | ALPHA | =positive-number | Confidence level to compute |

    | CLIATRS | =cli-attrs | Appearance attributes for CLI |

    | CLMMATRS | =cli-matrs | Appearance attributes for CLM |

    | DEGREE | =positive-integer | The degree of the polynomial |

    | KNOTS | =positive-number | Number of evenly spaced knots |


    # Other Options:


    | CLI | =string | Display limits for individual predicted values using the string
    for the legend label. |

    | CLM | =string | Display limits for mean predicted values using the string for
    the legend label. |

    | CLMTRANSPARENC | =value | Transparency for the CLM band. |


    # Boolean Options:


    | CLI | Display limits for individual predicted values. |

    | CLM | Display limits for mean predicted values. |

    | NOGLECLI, NOLEGLCM | Exclude the CLI or CLM from the legend. |

    | NOGEFIT | Exclude the fit line from the legend. |


    Standard common options supported by fits


    ATTRID, CURVABEL, CURVELLABELOC, CURVABELPOS, DATALABELS, GROUP, LEGLABEL, LINEATTRS,
    MARKETERS, MAXPOINTS, NAME, NOMARKERS, XAXIS, YAXIS


    Related Elements: The GraphDataDefault element is used to draw the plot elements.
    When a GROUP variable is present, or when multiple statements are overlaid, the
    GraphData1-GraphData12 elements are used, one for each group or statement.'
  merge: -1
