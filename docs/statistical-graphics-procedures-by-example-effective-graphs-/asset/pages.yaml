  md: '# Figure 4.7.1: Basic Step Plot


    This is a basic step plot of a response over time for Drug B.


    An INSET statement is used to indicate the data is for one of the drugs (B) in
    the data.


    ![](img/0c09161c0be53934e5708cffbdcc441f_97_0.png)


    ```

    title ''Response over Time'';

