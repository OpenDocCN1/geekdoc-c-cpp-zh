  md: "# Figure 4.6.3: Grouped Series Plot with Curve Labels\n\nIn this graph the\
    \ KEYLEG statement is used to move the legend closer to the data. This reduces\
    \ the amount of eye movement needed to decode which series represents which.\n\
    \nSee Figure 4.6.4 for an alternative arrangement.\n\n![](img/0c09161c0be53934e5708cffbdcc441f_92_0.png)\n\
    \n```\ntitle 'Response over Time by Drug';\nproc sgplot data=sgroup.series=group;\n\
    \ x=date=val / group=drug lineattrs=(thickness=2);\nxaxis display=(nolabel);\n\
    nyaxis min=0 integer grid label='Efficacy';\nkeylegend title=\"\" Location=inside\
    \ position=bottom across=1;\nrun;\n```\n\n# Figure 4.6.4: Grouped Series Plot\
    \ with Markers\n\nIn this graph the legend is eliminated by labeling each series\
    \ with the name of the drug. This eliminates eye movement required to decode the\
    \ information, thus the effectiveness of the graph.\n\nThe procedure detects the\
    \ presence of the CURVELABEL option, and suppresses the legend automatically.\n\
    \n![](img/0c09161c0be53934e5708cffbdcc441f_92_1.png)\n\n```\ntitle 'Response over\
    \ Time by Drug';\nproc sgplot data=sgroup.series=group;\n x=date=val / group=drug\n\
    lineattrs=(thickness=2) curvelabel;\nxaxis display=(nolabel);\nnyaxis min=0 integer\
    \ grid label='Efficacy';\nrun;\n```\n\n* Matange, Sanjay and Heath, Dan. Statistical\
    \ Procedures by Example: Effective Graphs Using SAS®. © 2011, SAS Institute Inc.,\
    \ Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/publishing."
