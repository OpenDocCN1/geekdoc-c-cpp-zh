- img_proc: true
  md: '# Figure 10.4.7: Panel by Type


    This is a graph of the vital signs for a patient in a clinical study. The vital
    signs are plotted by day of visit.


    The range of values for each vital sign is different, from blood pressure, to
    weight (kg), to temperature (C). In a use case, it is useful for each row to have
    its own data range. To get this, we set UNISCALE=Column.


    ```

    title ''Vital Signs''

    proc sgpanel data=sgbook_vitalsigns;

    where vstested < "HEIGHT"

    panelby vstested / layout=rowcolattice onepanel

    vornamame uniscale=column

    series x=visitid y=vysssstren

    colaxis grid; rowaxis grid display=(nolabel);

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_276_0.png)


    # Figure 10.4.8: Row Lattice by Type


    We have added the display of the normal ranges for some of the vital signs. These
    bands are different for each cell. This is a common feature to indicate if the
    measurements are within normal range.


    To do this, we have added two columns in the data with values for systolic and
    diastolic pressure. A band plot is added to display the normal range. If needed,
    data driven REFLINES can be added.


    ```

    title ''Vital Signs''

    proc sgpanel data=sgbook_vitalsigns;

    where vstested < "HEIGHT"

    panelby vstested / layout=rowcolattice onepanel

    vornamame uniscale=column

    band x=visitid lower=upper // fill

    outline transparency=0.6;

    series x=visitid y=vysssstren

    colaxis grid; rowaxis grid display=(nolabel);

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_276_1.png)'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Figure 10.4.9: Column Lattice


    This graph shows a column lattice, which is a lattice of multiple columns in one
    row.


    ```

    title ''Vehicle Mileage by Origin ...'';

    proc sgpanel data=sashelp.cars

    noautolegend;

    where type = ''Hybrid'';

    panelby origin / layout=columnlattice

    onepanel variable=name;

    vbar type / response=mpg_city

