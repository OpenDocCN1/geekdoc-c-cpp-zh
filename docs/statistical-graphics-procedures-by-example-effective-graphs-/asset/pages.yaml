- img_proc: true
  md: "# 8.7 Insets\n\n# #### 8.7.1: Inset Types\n\nThis example shows two kinds of\
    \ in: a text inset and a table inset. Each quoted string in a text inset creates\
    \ a new line. Each label/value pair in a table inset creates a new entry in the\
    \ table.\n\nInsets can be positioned in any of eight positions. However, if no\
    \ position is specified, the inset automatically positions itself in an area with\
    \ the least amount of data collision.\n\n![](img/0c09161c0be53934e5708cffbdcc441f_244_0.png)\n\
    \n# ### \"Class Statistics\":\n\n```\nproc sgplot data=sashelp.class;\n reg xweight=height\
    \ / cl;\n inset(\"Date=\"02/15/11\" nobs=\"19\") / title=\"Survey #1\" border\n\
    \ textattrs=(size=7pt) textattrs=(size=8 weight=bold);\n inset(\"The size survey\
    \ will be for the next 6 months\")\n```\n\n```\nrun;\n```\n\n# ### 8.7.2: Rich-Text\
    \ Inset\n\n![](img/0c09161c0be53934e5708cffbdcc441f_244_1.png)\n\nNot only do\
    \ insets support characters like others in the SG procedures, but they also support\
    \ superscripts and subscripts.\n\nUse the ESCESCAPE option to insert text into\
    \ your inset strings.\n\n```\nods escapechar=\"*\";nproc sgplot data=sashelp.class;\n\
    \ reg xweight=height / cl;\n inset (\"Y-(unicode bar)\\=\"62.34\" / R-(sup 2*\"\
    )=\"0.94\"\n~\"(unicode alpha)\\=\".05\") / border textattrs=(size=7pt);\n```\n\
    \n```\nrun;\n```"
  merge: -1
