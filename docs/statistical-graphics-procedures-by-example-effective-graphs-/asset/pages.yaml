  md: '# 4.8 Band Plot


    The band plot draws a band between two response values. The syntax can come from
    one of the following:


    ```

    band x=column|column|value upper=column value

    <options>

    band y=column|column|value upper=column value

    </options>

    ```


    For each of the X (or Y) value, a band is drawn between the lower and upper response
    values. Responses can come from a column in the data or be a constant value.


    Required Data Roles:


    | X Y | =column | Position along horizontal or vertical axis |

    |---|---|---|

    | LOWER | =num-column | value | Lower response |

    | UPPER | =num-column | value | Upper response |


    Optional Data Roles:


    | GROUP | =column | Classification for multiple series |

    |---|---|---|


    Appearance Options:


    | CURVELABELATTRS | =text-attrs | Appearance of curve label |

    |---|---|---|

    | FILLATTERS | =fill | Appearance of fill between values |

    | LINEATTRS | =line-attr | Appearance of the lines |


    Other Options:


    | CURVELBELOC | =keyword | Location of label – INSIDE | OUTSIDE |

    |---|---|---|---|

    | CURVELPOS | =keyword | Name of label - START | END |

    | CURVELBELOWER | =string | Name of lower band curve |

    | CURVELUPPER | =string | Name of upper band curve |

    | MODELNAME | =plotname | Name of the plot for interpolation info. |

    | NAME | =string | Name for this statement |

    | TRANSPARENCY | =value | Transparency for the line and markers |

    | TYPE | =value | Series or Set |


    Boolean Options:


    | FILL | NOFILL | Display fill between lower and upper values |

    |---|---|---|

    | OUTLINE | NOUTLINE | Display outline at lower and upper values |

    | NOEXTEND | |


    Standard common options are supported


    | ATTRID, LEGENDLABEL, NAME, NOMISSINGGROUP, TRANSPARENCY, X2AXIS, Y2AXIS |


    ![](img/0c09161c0be53934e5708cffbdcc441f_101_0.png)'
