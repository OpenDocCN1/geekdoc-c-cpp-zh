  md: '# Figure 4.14.1: Scatter with Reference Line


    In this example, we have added a Y reference line with default settings. The associated
    label is displayed outside the graph, on the right side.


    ![](img/0c09161c0be53934e5708cffbdcc441f_125_0.png)


    ```

    title ''Vehicle Profile'':

    proc sgplot data=sgbook.cars2;

    where type=''Sedan'' and (origin=''USA'' or origin=''Asia'');

    scatter x=hp y=mpg / transparency=0.5;

    refline 24 / label="24";

    xaxis grid; yaxis grid;

    ;

    ```


    # Figure 4.14.2: Scatter with Reference Line


    In this graph the scatter plot response is plotted on the Y2 axis (right side).
    By default, the reference line label would have been shown on the right side,
    colliding with the Y2 axis.


    Here we set LABELPOS=MIN, to place the label on the left side.


    ![](img/0c09161c0be53934e5708cffbdcc441f_125_1.png)


    ```

    title ''Vehicle Profile'':

    proc sgplot data=sgbook.cars2;

    where type=''Sedan'' and (origin=''USA'' or origin=''Asia'');

    scatter xhp y=mpg / group=origin transparency=0.5;

    markerattrs=(symbol=circlefilled) y2;

    keylegend / location=inside position=topright across=1;

    refline 25 / axis=y2 label="25" labelpos=min;

    xaxis grid; yaxis grid;

    ;

    ```


