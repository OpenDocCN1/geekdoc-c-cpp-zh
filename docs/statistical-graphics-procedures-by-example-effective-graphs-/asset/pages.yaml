  md: '# 5.4 Loess Plot


    The Loess plot shows a smoothed fit of the raw data with a Loess fit.

    The syntax is:


    ```

    loess x=column y=column </options>;

    ```


    A marker is displayed at each (x, y) location. A fit line is computed and displayed.
    Optionally, confidence levels of the means can be displayed.


    ![](img/0c09161c0be53934e5708cffbdcc441f_150_0.png)


    Required Data Roles:


    | | | |

    |---|---||

    | X | =num-column | Position along the horizontal axis |

    | Y | =num-column | Position along the vertical axis |


    Optional Options:


    | | | |

    |---|---||

    | WEIGHT | =num-column | Priority weights for a regression fit. |


    Appearance Options:


    | | | |

    |---|---||

    | ALPHA | =positive-number | Confidence level to compute.

    | CLMATTRS | =clim-attrs | Appearance attributes for CLM.

    | DEGREE | =positive-integer | The degree of the polynomial.

    | INTERPOLATION | =keyword | The degree of the interpolating polynomials used
    for blending local polynomial fits at the kd tree vertices — LINEAR | CUBIC.

    | REWEIGHT | =positive-integer | The number of iterative weighting steps.

    | SMOOTH | =positive-integer | Specifies a smoothing parameter. |


    Other Options:


    | | | |

    |---|---||

    | CLM | =string | Display confidence limits for mean predicted values using the
    string for the legend label. |


    Boolean Options:


    | | | |

    |---|---||

    | CLM | Display confidence limits for mean predicted values.

    | NOLEGCM | Exclude the CLM from the legend.

    | NOLEGFIT | Exclude the fit line from the legend. |


    Standard options are supported by fit


    ATTRID, CURVELABEL, CURVELABELLOC, CURVELABELOS, DATALABEL, DATALATTRS, GROUP,
    LEGENDLABEL, LINEATTRS, MARKERATTRS, MAXPOINTS, NAME, NOMARKERS, TRANSPARENC,
    X2AXIS, Y2AXIS


    Related Elements: The GraphData default element is used to draw the plot elements.
    When a GROUP is present, or multiple plot statements are overlaid, GraphData1-GraphData12
    are used, for each group or plot statement.'
  merge: -1
