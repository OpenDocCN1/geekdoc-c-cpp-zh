  md: '# Figure 7.4.7: Bar Chart with Groups


    The GROUP option is used to specify an additional level of classification in a
    bar chart. By default, the group values are represented as stacked bar segments.


    The bar segments are automatically assigned unique attributes for each group value.
    These attributes can be modified using an attribute map (see Chapter 9) or by
    modifying an ODS style.


    ```

    title "Product Sales";

    proc sgplot data=sgbook.product_sales;

    axis xlabel="Sales (in millions)";

    hbar product / response=actual group=region;

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_207_0.png)


    # Figure 7.4.8: Bar Chart with Adjacent Groups


    Instead of stacking the group values, GROUPDISPLAY option can be used to CLUSTER
    the bars.


    ```

    title "Product Sales";

    proc sgplot data=sgbook.product_sales;

    axis xlabel="Sales (in millions)";

    hbar product / response=actual group=region groupdisplay=cluster;

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_207_1.png)


    ![](img/0c09161c0be53934e5708cffbdcc441f_207_2.png)'
