- img_proc: true
  md: '# 1.1.2 Accuracy of Magnitude Perception


    Stevens'' power law proposes a relationship between the magnitude of a physical
    stimulus and its perceived intensity or strength. The law proposes that the accuracy
    of magnitude perception for visual length is linear. Magnitude of a line twice
    as long is perceived almost as twice as long. However, the accuracy of perception
    of magnitude is reduced for other representations. For example, it is only about
    1.6. That is, an area twice as large only seems 1.6 times as large, so we underestimate
    areas.


    For representation of magnitude, we can conclude the following:


    +   - Linear distance on a common scale and base line is most effective.

    - Linear distance on a common but non-aligned scale is effective.

    - Areas are only about 70% as effective as linear distance.

    - Volumes are about 60% as effective as linear distance.

    - Angular distance from a common base is not very effective.

    - Angular distance from non-common base is ineffective.

    - Color in general is not an effective representation of magnitude.

    - Color intensity can be used as a relative measure of magnitude.

    - Color hue is not a good representation of magnitude.

    - 3-D plots distort the perception of absolute magnitude.


    ![](img/0c09161c0be53934e5708cffbdcc441f_18_0.png)


    ![](img/0c09161c0be53934e5708cffbdcc441f_18_1.png)


    Figure 1.8 and Figure 1.9 both display the MPG by type of car. Figure 1.8 uses
    the dot plot where the response values are plotted as a linear distance from a
    common base. It is very easy for the eye to decode the relative values of each
    car type. Grid lines help to line the values.


    Figure 1.9 displays the same data using a pie chart. Clearly, it is much harder
    to decode the relative values since it is difficult to make good magnitude comparisons
    using angular distances, especially from different baselines.


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS®. Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA.
    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.1.3 Usage of 3-D Graphs


    Figure 1.10 and Figure 1.11 both display the mean MPG by type of car. Figure 1.10
    uses a vertical bar chart to display the data. It is very easy for the eye to
    decode the relative values for each car type. A format is applied to the response
    column to reduce the clutter for the data label.


    ![](img/0c09161c0be53934e5708cffbdcc441f_19_0.png)


    Figure 1.10


    ![](img/0c09161c0be53934e5708cffbdcc441f_19_1.png)


    Figure 1.11


    Figure 1.11 displays the same data using extruded 3-D bars. This is often referred
    to as a 2.5-graph, since the data has only two dimensions. The third dimension
    is artificially added to make the bars appear like 3-D blocks. Usage of such aesthetic
    features can sometimes inhibit the process of decoding the data accurately.


    There are several potential pitfalls in the 2.5-D representation of the data.
    The axis values are displayed on the left at the "front" face of the bars. The
    grid lines are drawn on the side and back of the face. So to measure the value
    for each bar, one has to line up the correct face (front or back).


    Often in such representations, the bars do not occupy the full depth of the walls,
    leaving room for comfort. Even though the bar values are displayed in the 2.5-D
    case, some values, such as for the Truck category, can become partially hidden
    behind other bars.


    In general the following conclusions can be drawn:


    +   * Dot plots, needle plots and bar charts are good for representations of magnitude.

    * Pie charts and area plots are not ideal for representations of magnitude.

    * Color intensity is not an effective representation of magnitude.

    * 3-D representations are not effective when the data are 2-D.

    * Unobtrusive grid lines can help in the decoding of the data.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# ## 1.1.4 Proximity Increases the Accuracy of Comparisons


    When you compare magnitude between categories, closer proximity increases the
    accuracy of comparison. For an effective graph, it helps to bring the items that
    are to be compared close to each other as possible.


    | Comparing MPG by Type | | Comparing MPG by Origin |

    | :--- | :--- | :--- | :--- |

    | Asia | USA | Sedan | Sports |

    | 22.8 | 20.2 | 22.8 | 20.6 |

    | | | | 16.9 |


    Figure 1.12


    Figure 1.12 is suitable for comparison of MPG for sedans and sports cars manufactured
    in different regions (origin). The comparison between car types is facilitated
    by bringing these categories closer in proximity. In this graph it is harder to
    compare "Sedan" from USA Figure 1.13 is more suitable for such a comparison where
    "Origin" is used as the category role.


    # ## 1.1.5 Simplify and Reduce Clutter


    Edward Tte''s principles for the creation of effective graphics include the following
    recommendations:


    +   1. Eliminate "chart junk."

    2. Maximize "data ink."


    When creating graphs for marketing and sales presentations, there is a desire
    to make the graph visually "compelling". To add this "Wow" factor, visual elements
    may be added to the graph to make it more aesthetically appealing. If one is not
    careful, these artifacts may introduce distractions or, worse, actually distort
    the graph, making it harder to decode the data accurately.


    Effectiveness of a graph can be enhanced by removing unnecessary artifacts from
    the graph. Avoid usage of gradient background and images. Inclusion of embellishments
    like drop shadows for data markers can increase the visual appeal of the graph
    but can reduce the effectiveness of the graph.'
  merge: -1
