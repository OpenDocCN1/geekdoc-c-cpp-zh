  md: '# 4.6 Series Plot


    The basic series plot is a key plot type for visualization of raw data. This plot
    does not summarize the data. The syntax is:


    ```

    series x=column y=column <options>;

    ```


    A series is drawn through each (x, y) location in order. The GROUP role is used
    to create multiple series plots, one for each unique value.


    ![](img/0c09161c0be53934e5708cffbdcc441f_90_0.png)


    # Required Data Roles:


    | X | =column | Position along the horizontal axis |

    | Y | =column | Position along the vertical axis |


    # Optional Data Roles:


    | DATALABEL | =column | Label String for each observation |

    | GROUP | =column | Classification for multiple series |

    | URL | =column | URL for each observation |


    # Appearance Options:


    | LINEATTRS | =line-attrs | Appearance attributes for lines |

    | MARKERATTR | =marker-attrs | Appearance attributes for markers |


    # Other Options:


    | CURVELABEL | =string | Curve label for non-grouped case |

    | CURVABELELOCATION | =keyword | Curve location (INSIDE | OUTSIDE) |

    | CURVELABELPOSITION | =keyword | Curve position (TOP, BOTTOM, ...) |


    # Boolean Options:


    | BREAK | Break the series plot at missing values |

    | CURVELABEL | Display curve labels from group role |

    | DATALABEL | Display Y value as data label |

    | MARKERS | Display the markers |


    # Standard common options can be supported


    | ATTRID, CLUSTERWIDTH, DISCRETEOFFSET, GROUPDISPLAY, GROUPORDER, LEGENDLABEL,
    NAME, MISSINGGROUP, TRANSPARENC, URL, XAXIS, Y2Axis |


    Related Series Elements: The GraphDataDefault element is used to draw the plot
    elements. When a multiple plot statements are overlaid, the GraphData1-GraphData12
    elements are used, one for each group or plot statement.


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS© Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 90
