- img_proc: true
  md: '# 10.4 Classification Panels


    Figure 10.4.1: Mileage by Horsepower and Type


    This graph shows mileage by horsepower for vehicles classified by type. Having
    separate cells for each class allows us to plot the regression and confidence
    bands.


    ![](img/0c09161c0be53934e5708cffbdcc441f_273_0.png)


    ```

    title ''Vehicle Mileage by Type'';

    proc sgpanel data=sashelp.cars;

    where (type=''Sedan'' or type=''Sports'' or type=''SUV'' or type=''Wagon'');

    panel type;

    reg x=horsepower y=mpg_city degree=2;

    scatter x=horsepower y=mpg_city transparency=0.7;

    ;

    ```


    Figure 10.4.2: Mileage by Type


    This graph shows the city highway mileage for vehicles by type and origin.


    The number of columns is set to 3, or else the procedure will attempt to create
    a balanced 2x2 grid.


    The reference line at Y=20 is shown in all the cells. NOVARNAME suppresses the
    display of column labels in the cell headers.


    ![](img/0c09161c0be53934e5708cffbdcc441f_273_1.png)


    ```

    title ''Vehicle Mileage'';

    proc sgpanel data=sashelp.cars;

    where (type=''Sedan'' or type=''Sports'');

    panel origin / novarname columns=3;

    bar type / response=mpg_city stat=mean fillattrs=graph7;

    bar type / response=mpg_highway width=0.5 stat=mean

    fillattrs=graphdataall1;

    refine 20;

    colaxis grid display=(nolabel); rowaxis grid label=''Mileage'';

    run;

    ```


    Matange, Sananjay and Heath, D. Statistical Procedures by Example: Effective Graphs
    Using SAS©. Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Figure 10.4.3: Panel by Origin and Type


    This graph shows a panel with two class variables, Origin and Type. Each cell
    has a cell header for each of the class variables.


    The space available for display of the data is quickly consumed by the cell headers.


    This layout (panel) allows multiple class variables; however, the space is quickly
    consumed by the cell headers.


    ```

    title *Vehicle Mileage*;

    proc sgpanel data=sgbook.cars;

    where origin=USA or origin=Asia*;

    panel origin type / novarname;

    histogram mpc;

    colaxis grid; rowaxis grid;

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_274_0.png)


    # Figure 10.4.4: Lattice by Origin and Type


    This graph also displays a panel with two class variables, Origin and Type. Here
    we have used LAYOUT=Lattice, so Origin is used as the column variable and Type
    is used as the row variable.


    Each row has a header, with the value of the class variable. This layout uses
    less space for headers.


    ```

    title *Vehicle Mileage*;

    proc sgpanel data=sgbook.cars;

    where origin=USA or origin=Asia*;

    panel origin type / layout=lattice novarname;

    histogram mpc;

    colaxis grid; rowaxis grid;

    run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_274_1.png)'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Figure 10.4.5: Panel by Type


    To create a one-column panel of horsepower by type, we can use the default layout
    (panel). To ensure one column, set COLUMNS=1. We used option ONEPANEL novlename
    to prevent paging of the graph into multiple images.


    Each cell gets a cell header at the top, taking up a significant amount of the
    available space. See Figure 10.4.6 for an alternative layout.


    ```

    ```

    ''Vehicle horsepower'';

    proc spanpanel data=horsehp.cars;

    panelby type / onepanel

    columns=1;

    histogram horsepower;

    colaxis grid; rowaxis grid;

    run;

    ```

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_275_0.png)


    # Figure 10.4.6: Row Lattice by Type


    In this graph, we use LAYOUT=RowLattice. This creates a lattice of rows (with
    one column). Each row has a row header on one side (similar to the lattice layout).


    Sometimes this layout is preferred when there are many short cells. The cell header
    gets on the side and results in an efficient use of the graph space.


    Note: All y-axis ranges are uniform.


    ```

    ```

    ''Vehicle horsepower'';

    proc spanpanel data=horsehp.cars;

    panelby type / layout=rowlattice

    novariate;

    nhistogram horsepower;

    colaxis grid; rowaxis grid;

    run;

    ```

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_275_1.png)


