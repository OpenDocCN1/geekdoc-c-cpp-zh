- img_proc: true
  md: '# Chapter 10: Classification Panels


    In this chapter, we step into the world of multi-cell classification panels using
    the SGPanel procedure. These graphs are valuable tools for understanding the data
    by displaying the data classified by one or more class variables.


    Classification panel graphs allow us to examine the relationship between variables
    for all crossings of the class. Therefore, we can examine effects of a drug over
    time classified by the gender of the person in the study.


    # 10.1 Introduction


    In addition to the plots supported by the SGPLOT procedure, the SGPanel procedure
    supports a PANELBY statement. This is the key difference between the two procedures.
    As mentioned in Section 2.3, the PANELBY statement allows us to specify the LAYOUT
    type, and the classification variables. The graph space is subdivided into smaller
    "cells" based on the number of levels for each class variable(s).


    Each cell is populated with a subset of the data that corresponds to the class
    variable(s). The plots in the PROC step after the PANELBY statement define the
    "prototype" or "rubber stamp" that is used to populate each cell, as shown in
    Figures 10.1.1 and 10.1.2.


    | ''Distribution of Cholesterol'': | Distribution of Cholesterol by Sex |

    |---|---|

    | proc sgpanel data=sashelp.heart; | | Sex = Female | Sex = Male |

    | panelby sex; | |

    | histogram cholesterol; | | density cholesterol: |

    | colaxis display=(nolabel) run; | | Normal


    Figure 10.1.1 Figure 10.1.2


    The key features as shown in Figures 10.1.1 and 10.1.2 are:


    +   - The PANELBY variable is "Sex". Since the data has two values for sex, this
    results in two cells in the graph.

    - Each cell is populated with a HISTOGRAM and a DENSITY statement for the associated
    data.

    - Options on other statements such as COLAXIS apply to the whole graph.'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'Note: Each cell essentially contains a graph of the type created by the SGPLOT
    procedure. So, all the techniques we have learned in the previous chapters apply
    here, with just a few exceptions.


    # 10.2 SGPanel Procedure


    The SGPanel procedure supports the following syntax:


    ```

    PROC SGPANEL data=dataset <options>;

    ```


    Options:


    | | | |

    |---|---|---|

    | CYCLEATTHRS | boolean | Cycle through style elements for each plot |

    | DATA | =sas-data-set | Optional data set |

    | DESCRIPTION | =string | Description string |

    | DATTRMAP | =sas-data-set | Data defining an attribute map |

    | NOAUTOLEGEN | boolean | Do not cycle style elements for each plot |

    | NOCYCLEATTHRS | boolean | Do not cycle style elements for each plot |

    | PAD | =value | Padding, around the outside of the graph |

    | SGANNO | =sas-data-set | Data set containing the annotations |

    | TMPLOUT | =string | File name for generated graph template code |


    The procedure supports the following statements:


    +   - PANELBY

    - Basic Plots: BAND, NEEDLE, SCATTER, STEP, SERIES, VECTOR, BUBBLE, HIGLOW, HBARMAP,
    VBARMAP LOESS, PLB, REG, LINEMAP

    - Fit Plots:

    - Distribution Plots: DENSITY, HISTOGRAM, HBOX, VBOX

    - Categorical Plots: DOT, HBAR, HLINE, VBAR, VLINE KEYLEGEND, REFLINE, COLAXIS,
    ROWAXIS

    - Other:


    The procedure has the following syntax:


    ```

    PROC SGPANEL data=data-set < options >;

    PANELBY classvar1 classvar2 ... classvarN > / options >;

    < plot-statement(s) >;

    < refine-statement(s) >;

    < axis-statement(s) >;

    < keylegend-statement(s) >;

    RUN;

    ```'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'As seen in the examples in Chapter 3, one or more plot statements can be provided
    that will work together to create the graph. See the table of permissible combinations
    shown in 2.4.


    The syntax and features of some of these plots are very similar to the same statements
    in the SGPLOT procedure, with a few deviations related to positioning of data
    and curve labels. The syntax for these plot statements has been discussed in the
    preceding chapters as listed below, we need not discuss them again here.


    +   - Basic Plots : Chapter 4

    - Fit and Confidence Plots : Chapter 5

    - Distribution Plots : Chapter 6

    - Categorization Plots : Chapter 7


    The following statements are new to the SGPANEL procedure, or they behave differently
    than in the SGPLOT procedure. We will discuss these statements in detail in this
    chapter:


    +   - PANELBY : Defines the paneling structure of the graph

    - KEYLEGEND : Customizes the external legend

    - REFLINE : Adds common reference lines

    - COLAXIS : Customizes the common external column axis

    - ROWAXIS : Customizes the common external row axis


    **Uniform Data Ranges:** For a panel graph, the axis ranges are always uniform
    unless as follows:


    +   - All axes in one row always have a uniform data range.

    - Horizontal axes in any one column always have a uniform data range.

    - Vertical (horizontal) data ranges may or not be uniform between rows (or columns).

    - A Y reference line is drawn at the same Y value in all cells of a row.

    - An X reference line is drawn at the same X value in all cells of a column.


    # 10.3 PANELBY


    The PANELBY statement is required and must be provided before any other plot,
    class, or refine statements. The syntax is:


    ```

    panelby classvar1 <classvar2...classvarN> <options>;

    ```


    The space provided for the graph is subdivided into an even grid of cells based
    on the number of crossings for the class variables.


    Four different types of layouts are available. These are panel (default), lattice,
    collattice and rowrowattice as described below.


    An example of the lattice layout is shown in figure 10.3.1, where the first class
    variable is used as the column variable and the second as the row variable.


    ![](img/0c09161c0be53934e5708cffbdcc441f_271_0.png)


    Figure 10.3.1'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Required Data Roles:


    | | |

    |--- |--- |

    | column-list | classification variable(s) |


    # Options:


    | | | |

    |--- | --- | --- |

    | COLHEDERPOS | =keyword | TOP | BOTTOM | BOTH |

    | COLUMNS | =value | Number of columns |

    | LAYOUT | =keyword | PANEL, LATTICE, ROWATTICE, etc. |

    | ROWHEADERPOS | =keyword | LEFT | RIGHT | BOTH |

    | ROWS | =value | Number of rows |

    | SPACING | =value | Spacing between cells |

    | START | =value | TOPLEFT | BOTTOMLEFT |

    | UNSCALE | =keyword | ALL | COLUMN | ROW |


    # Boolean Options:


    | | | |

    |--- | --- | --- |

    | BORDER | NOBORDER | Displays borders |

    | MISSING | | Includes missing as a separate level |

    | NOVENAME | | Displays only the class value in the header |

    | ONEPANEL | | Prevents paging of the panel |


    Layout Types – PROC SGANEL supports four layouts. Each layout subdivides the available
    graph region into a regular grid of cells. The layout of the cells and the location
    of the headers are different for each layout type as shown in Figure 10.3.2.


    Each layout has its strengths follows:


    +   - Panel (Default) :Supports multiple class and is optimal for sparse data.

    - Lattice : Supports column and variables and similar layout.

    - ColumnLattice : Supports one class variable to create a Lattice of columns (one
    row).

    - RowLattice : Supports one class variable to create aLattice of rows (one column).


    ![](img/0c09161c0be53934e5708cffbdcc441f_272_0.png)


    Figure 10.3.2


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.
    **'
