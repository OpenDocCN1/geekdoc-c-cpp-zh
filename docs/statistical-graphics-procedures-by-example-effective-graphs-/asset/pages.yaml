  md: '# 4.11 VBarParm and HBarParm Plots (9.3)


    These pre-summarized bar chart statements have the following syntax:


    ```

    vbarpar column < / responses=column <options>;

    hbarpar column < / response=column <options>;

    ```


    The VBARPARM and HBARPARM statements create specialized bar charts in when the
    response and limit values are displayed as provided by the user.


    **Related Style Elements:** The GraphDataDefault style element is used to draw
    or when multiple plot statements are overlaid, the GraphData12 elements are used,
    for each group or plot statement.


    ![](img/0c09161c0be53934e5708cffbdcc441f_112_0.png)


    **Required Data**


    | Category | =column | Position along the category axis |

    | Response | =num-column | Response variable |


    **Optional Data:**


    | DATALABEL | =column | Label String for each observation |

    | GROUP | =column | Classification for multiple series |

    | URL | =column | URL for each observation |

    | LIMITOWER | =column | Lower limit value |

    | LIMITUPPER | =column | Upper limit value |


    **Appearance Options:**


    | FILLATRS | =fil-attrs | Appearance of bar interior |

    | LIMITATRS | =line-attrs | Appearance of limit bars |


    **Other Options:**


    | BARWIDTH | = value | Width of bar as fraction of tick spacing |

    | DATASKIN | = skin-value | One of the predefined skin types |


    **Boolean Options:**


    | DATABEL | Display default bar labels |

    | FILL | NOFILL | Display filled / unfilled bars |

    | OUTLINE | NOUTLINE | Display bar outlines or not. |

    | MISSING | Accept as category value |


    **Standard common options are supported**


    ATRID, CLUSTERWIDTH, DISCRETEOFFSET, GROUPDISPLAY, GROUPORDER, LEGENDLABEL, NAME,
    MISSINGGROUP, TRANSPARENCY, URL'
