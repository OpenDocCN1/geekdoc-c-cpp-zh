  md: '# Figure 9.1.6: Creating a Simple Forest Plot with Annotation


    This example combines the techniques of data alignment and text width in the previous
    examples to create a simple forest plot. Notice how the effect labels on the bottom
    axis are positioned based on wall position, and the width keeps long labels from
    colliding. If you know you are going to have long effect labels, you may want
    to specify more bottom padding in the SGPLOT procedure. Also see Figure 12.2 for
    an alternate way to create a forest plot without annotation.


