  md: '# 9.2 Attribute Maps (9.3)


    Attribute maps are used to assign visual attributes to specific group data values.
    Like annotations this feature uses a data set to define the content of the feature;
    however, the definition is much smaller.


    | Required Column(s): | |

    |---|---|

    | ID | Char | The ID of the attrmap value is referenced from the ATTRID option
    on the plot statements. |

    | VALUE | Char | The data value to be assigned to the attributes. The keyword
    _OTHER_ in the column can be used to define the attributes of any values that
    are not explicitly defined in the map. Numeric values should represent their final
    formatted form.|


    | Optional Column(s): | |

    |---|---|

    | MARKERSTYLE | Char | A style element reference for marker attributes (e.g. GraphData1).
    |

    | MARKERSMBOL | Char | Either a literal symbol (circle, plus, etc.) or an attribute
    style reference (GraphData1:markersymbol). |

    | MARKERCOLOR | Char | Either a literal color (red, cff0000, etc.) or an attribute
    style reference (GraphData1:contrastcolor). |

    | LINESTYLE | Char | A style element reference for line attributes (GraphData1,GraphData2,
    etc.). |

    | LINEPATTERN | Char | Either a literal pattern (solid, dash, etc.) or an attribute
    style reference (GraphData1:linepattern). |

    | LINECOLOR | Char | Either a literal color (red, cff0000, etc.) or an attribute
    style reference (GraphData1:contrastcolor). |

    | FILLSTYLE | Char | A style element reference for fill attributes (e.g. GraphData1,GraphData2,
    etc.). |

    | FILLCOLOR | Char | Either a literal fill color (red, cff0000, etc.) or an attribute
    style reference (GraphData1:color).|


    You can define multiple maps within the same data set; make sure that the data
    set stays sorted by the ID column. The ID is referenced from the procedure''s
    PLOT statement and the attributes applied to the GROUP variable. If there is not
    a GROUP variable on the PLOT statement, the attribute map is ignored. Also note
    that values in the attribute map are case-sensitive.


    The optional columns are applied to the plot only if the attributes can be applied
    to the plot. Otherwise, if a group value is not found in the map, the attributes
    for that group will come from the ODS style.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Figure 9.2.1: Controlling the Appearance of Plot Lines


    In this example, the attribute map is defined to control the appearance of both
    the plot lines and the markers for each group value.


