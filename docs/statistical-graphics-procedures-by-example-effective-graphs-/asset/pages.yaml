- img_proc: true
  md: '# Figure 7.7.5: Dot Plot with Confidence Limits


    This example shows a dot plot showing the confidence limit of the mean (CLM).
    The standard error and standard deviation statistics are also available.


    The ALPHA option can be used to specify the confidence for the CLM calculation.
    The default is 0.05.


    ![](img/0c09161c0be53934e5708cffbdcc441f_227_0.png)


    ```

    /* Avg. Number of Electrical Workers*

    proc sgplot data=help.workers noautolegend;

    format date year;

    xaxis label="Workers (in thousands)" grid;

    dot date / response=electric stat=mean limitstat=clm;

    run;

    ```


    # Figure 7.7.6: Dot Plot with Upper Limits


    You can use the LIMITS option to control which side of the limits are displayed.


    This example uses the STDERR statistic with a NUMSTD multiplier to display two
    standard errors instead of one.


    ![](img/0c09161c0be53934e5708cffbdcc441f_227_1.png)


    ```

    /* Avg. Number of Electrical Workers*

    proc sgplot data=help.workers noautolegend;

    format date year;

    xaxis label="Workers (in thousands)" grid;

    dot date / response=electric stat=mean upper

    limitstat=stderr numstd=2;

    run;

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Figure 7.7.7: Dot Plot with Response Sorting


    Use the CATEGORYORDER option to order your category values based on ascending
    or descending response values.


    In this example, the products with the highest sales are sorted to the top of
    the axis.


    ![](img/0c09161c0be53934e5708cffbdcc441f_228_0.png)


    ```

    title "Product Sales for 1993";

    proc sgplot data=sashelp.prdsale(where=(year=1993));

    dot product / response=actual categoryorder=respdesc;

    ```


    # Figure 7.7.8: Group Dot Plot


    The GROUP option is used to specify an additional level of classification in a
    dot plot. The plot markers are automatically assigned unique attributes for each
    group value.


    These marker attributes can be modified by using an attribute map (see Chapter
    9) or by modifying an ODS style.


    ![](img/0c09161c0be53934e5708cffbdcc441f_228_1.png)


    ```

    title "Avg. Number of Electrical Workers";

    proc sgplot data=sasbook.workers_group;

    format date year;

    label_name="Type of Work";

    xaxis label1="workers";

    dot date / response=col1 group=name_ stat=mean;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS®. Copyright © 2011, SAS Institute, Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Figure 7.7.9: Overlaid Dot Plots


    This example plots two response variables by overlaying a dot plot for each variable.
    Each statement has its own visual attributes and can be assigned to different
    axes.


    The legend can be changed for each plot by using the LEGENDLABEL option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_229_0.png)


    ```

    title="Avg. Number of Electrical Workers"

    procplot data=sashelper.workers;

    format date=;

    axis label="workers (in thousands)"

    dot date / response=electric stat=mean;

    dot date / response=masonry stat=mean;

    run;

    ```


    # Figure 7.7.10: Dot Plot with Discrete Offsets


    ![](img/0c09161c0be53934e5708cffbdcc441f_229_1.png)


    Normally, response values of overlaid dot plots are drawn at the tick positions
    along the category axis, which can cause overlap.


    To move the values off of the ticks, use the DISCRETEOFFSET option. Negative values
    down to -0.5 move the points down. Positive values up to 0.5 move them up.


    ```

    title="Avg. Number of Electrical Workers"

    procplot data=sashelper.workers;

    format date=;

    axis label="workers (in thousands)"

    yaxis offsetmin=0.075 offsetmax=0.5

    dot date / response=electric stat=mean limitstat=clm

    discreteoffset=-0.15 markerattrs=(symbol=circle);

    dot date / response=masonry stat=mean discreteoffset=0.15

    limitstat=clm markerattrs=(symbol=circlefilled);

    ```


    ```

    run;

    ```


    Matange, Sanjay, and Heath, Dan. Statistical Procedures by Example: Effective
    Graphs Using SAS(). Copyright © 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
