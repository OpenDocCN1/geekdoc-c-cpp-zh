  md: '# # Chapter 5: Fit and Confidence Plots


    In this chapter, we examine the fit and confidence plots for SGPLOT and SGPANEL
    procedures. The basic syntax for each plot and related options will be covered
    in detail in this chapter. Plots within this group can be mixed and matched with
    each other and with many X-Y plots from the "Basic Plots" group.


    # ## 5.1 Introduction


    The SGPLOT and SGPANEL procedures support multiple fit and confidence plots as
    listed below. These plots normally also display the raw data as a scatter plot,
    and also support of confidence bands. These plots can be combined with many basic
    X-Y plots, most commonly with the scatter plot.


    | REG | LOESS |

    |---|---|

    | PBSPLINE | ELLIPSE |


    ![](img/0c09161c0be53934e5708cffbdcc441f_141_0.png)'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# 5.2 Fit Plot Roles and Options


    All of the fit plot statements have the following syntax:


    ```

    FitPlotName required-data-roles </options>;

    ```


    All plot statements have required and optional parameters necessary to create
    the visual. These parameters fall into the following broad categories:


    +   1. required data roles

    2. optional data roles

    3. options

    4. common options


    Here is a list of common options for:


    # Common Options:


    | ATTRID | =string | The attribute map ID used for the group variable. |

    | CURVELABELATTRS | =line-attrs | Appearance attributes for the label. |

    | CURVELBELLOC | =keyword | Curve label location - INSIDE | OUTSIDE |

    | CURVELABELPOS | =keyword | Curve label position - AUTO | MAX | MIN Display a
    label for the Y variable or from an optional value. |

    | DATABEL | <<column> | Appearance attributes for DataLabel. |

    | DATALATTRIBUTES | =text-attrs | Classification variable for fit calculations.
    |

    | GROUP | =column | The label appears in the legend to represent this (non-group)
    plot. |

    | LEGEND | | Appearance attributes for the fit. |

    | LINEARTS | =line-attrs | Appearance attributes for the markers. |

    | MARKERATTRS | =marker-attrs | Minimum number of prediction points. |

    | MAXPOINTS | =positive-integer | Specifies a name for this statement. Other statements,
    as a KEYLEGEND, can refer to a plot by its name. |

    | NAME | =string TRANSPARENCY | =value | Specifies the transparency for the visual
    elements. |


    # Common Boolean Options:


    | NOMARKERS | Do not show the scatter markers with the fit line. |

    | X2AXIS | Assigns X values to the X2 (top) axis. |

    | Y2AXIS | Assigns Y values to the Y2 (right) axis. |


    These common options are available for each plot statement, and can be used exactly
    as above. To avoid duplication, we will not list all common options for the individual
    plots that are discussed in this chapter.'
  merge: -1
  pgno: 142
- img_proc: true
  md: "# 5.3 Regression Plot\n\nThe Regression plot shows a linear or nonlinear fit\
    \ of the raw data.\nThe syntax is:\n\n```\nreg x=column y=column </options>\n\
    ```\n\nA marker is displayed at each (x, y) location. A fit line is computed\n\
    and displayed. Optionally, different confidence limits can also be\ndisplayed.\n\
    \n![](img/0c09161c0be53934e5708cffbdcc441f_143_0.png)\n\nRequired Data Roles:\n\
    \n| X =num-column Position along the horizontal axis |\n| Y =num-column Position\
    \ along the vertical axis |\n\nOptional Data Roles:\n\n| FREQ =num-column Frequency\
    \ of the current observation |\n| WEIGHT =num-column Priority weights for a regression\
    \ fit |\n\nAppearance Options:\n\n| ALPHA =positive-number Confidence level |\n\
    | CLIATTRS =cli-attr Appearance attributes for CLI |\n| CLMATTRS =cli-attr Appearance\
    \ attributes for CLM |\n| DEGREE =positive-integer The degree of the polynomial\
    \ |\n\nOther Options:\n\n| CLI =string Display confidence limits for individual\
    \ predicted\nusing the legend label. |\n| CLM =string Display confidence limits\
    \ for mean predicted values\nusing the legend label. |\n\nBoolean Options:\n\n\
    | CLI Display confidence limits for individual predicted values. |\n| CLM Display\
    \ confidence limits for mean predicted values. |\n| NOLEGCLI Exclude the CLI from\
    \ the legend. |, \n| NOLECLM Exclude the CLM from the legend. |\n| NOLEGFIT Exclude\
    \ the fit line from the legend. |\n\nStandard options are supported by fit\n\n\
    ATTRID, CURVELABEL, CURVEABELOC, CURVEABELPOS, DATALABEL,\nDATALABELTRS, GROUP,\
    \ LEGENDABEL, LINEATTRS, MARKERATTRS,\nMAXPOINTS, NAME, NOMARKERS, TRANSPARENCY,\
    \ X2AXIS, Y2AXIS\n\nRelated Style Elements: The GraphData default element is used\
    \ to draw the plot elements.\nWhen a GROUP variable is present, or multiple plot\
    \ statements are overlaid, the GraphData1-Graph12 elements are used, for each\
    \ group or plot statement."
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Figure 5.3.1: Basic Linear Fit


    This plot contains a basic linear regression fit. By default, the REG statement
    produces both the line and the scatter points. This behavior can be controlled
    by the NOMARKERS option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_144_0.png)


    ```

    title "The Impact of Horsepower on MPG"

    proc sgplot data=sashelpcar, noautolegend;

    where type="Sedan" and origin="USA";

    reg x=horsepower y=mpg_city;

    axis grid;

    yaxis grid;

    run;

    ```


    # Figure 5.3.2: CLM Band


    In addition to the linear fit and scatter points, this plot displays a computed
    confidence limit for the mean (CLM).


    By default, the alpha value for the computation is .05 (95% confidence). This
    value can be adjusted by the ALPHA option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_144_1.png)


    ```

    title "The Impact of Horsepower on MPG"

    proc sgplot data=sashelpcar, noautolegend;

    where type="Sedan" and origin="USA";

    reg x=horsepower y=mpg_city / clm;

    axis grid;

    yaxis grid;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Figure 5.3.3: CLI Band


    In addition to the linear fit, scatter points, and CLM band, this plot displays
    the prediction limits for individual values (CLI).


    By default, the alpha value for computation is .05 (95% confidence). This value
    can be adjusted using the ALPHA option, which affects both CLM and CLI.


    ![](img/0c09161c0be53934e5708cffbdcc441f_145_0.png)


    ```

    title "The Impact of Horsepower on MPG"; proc sgplot data=sashelp.cars noautolegend;
    where type=''Sedan'' and origin=''USA''; reg x=horsepower y=mpg_city / clm cli;
    xaxis grid; yaxis grid; run;

    ```


    # Figure 5.3.4: Automatic Legend


    This plot displays a legend containing information about the fit. This legend
    appears by default and can be disabled by using the NOAUTLEG option or by specifying
    a custom legend.


    ![](img/0c09161c0be53934e5708cffbdcc441f_145_1.png)


    The NOLEGFIT option prevents the fit line information from being displayed in
    the legend.


    ```

    title "The Impact of Horsepower on MPG"; proc sgplot data=sashelp.cars; where
    type=''Sedan'' and origin=''USA''; reg x=horsepower y=mpg_city / clm nolegeffit;
    xaxis grid; yaxis grid; run;

    ```


