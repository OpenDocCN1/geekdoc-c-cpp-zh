  md: '# 2.5 SGSCATTER Procedure


    The SGSCATTER procedure is optimized for the creation of comparative scatter plots
    and scatter plot matrices. PROC SGSCATTER does not use a layered architecture
    like the SGPLOT and SGPAN procedures. Instead, PROC SGSCATTER supports three distinct
    statements as shown. The examples shown earlier in Figure 2.4 and Figure 2.5 are
    created using the SGSCATTER procedure.


    The syntax for the SGSCATTER procedure is as follows:


    ```

    1 PROC SGSCATTER < DATA= data-set < options >;

    2. PLOT < options >;

    3. COMPARE X=(variable(s)) Y=(variable(s)) < options >;

    4. MATRIX variable(s) < options >;

    5. RUN;

    ```


    +   1. The procedure statement supports multiple options that will be demonstrated
    in the examples shown in later chapters.


    +   2. The PLOT statement creates a set of cells arranged in a uniform grid in
    the graph based on the plot request. Each cell includes an independent scatter
    plot with optional fit and ellipses. Axes can be made uniform across all plots,
    if needed. Figures 2.17 and 2.18 show an example of the PLOT statement. The two
    Y axes are not uniform.


    ![](img/0c09161c0be53934e5708cffbdcc441f_42_0.png)


    Figure 2.17


    Figure 2.18


