  md: '# Figure 3.2.15: Grouped Step Plot


    This graph shows a traditional stock plot of closing price by month for three
    companies using a grouped step plot.


    This is similar to Figure 3.2.13, with use of a step plot instead of a series
    plot.


    ![](img/0c09161c0be53934e5708cffbdcc441f_57_0.png)


    ```

    title ''Stock Plot by Company'';

    proc sgplot datashelp.stocks;

    where date > ''01Jan99'' and date < ''01Jan00'';

    format close dollar$1.0;

    step update yelse=group/step lineattrs=(thickness=2);

    axis grid display=(noigabel);

