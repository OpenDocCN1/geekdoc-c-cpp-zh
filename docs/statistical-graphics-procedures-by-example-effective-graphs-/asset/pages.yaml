- img_proc: true
  md: '# # Chapter 16: Tips for Graph Output


    # ## 16.1 Introduction


    After completing the data analysis, the analyst needs to share the results of
    the analysis, along with graphs, with various consumers. This means the graphs
    will be inserted into Web pages, publications, documents and overhead presentations.
    It is critical that these graphs look their best and deliver the information effectively
    in the final form.


    For the LISTING destination, the default graph size is 640 pixels x 480 pixels
    at 96 DPI. These default settings work well for viewing the graphs on the computer
    screen. For inclusion of such graphs in various documents, some customization
    is useful.


    # ## 16.2 Creating Small Graphs for Use in Documents


    You will need to insert a graph into a document where the graph must fit into
    a small inset or in one-column of a two-column layout. Figures 16.1 and 16.2 show
    two graphs, both with a width of 2.875 inches. For Figure 16.1, we have inserted
    the default output from the SGPLOT procedure into the available region. This default
    output is rendered as a 640px by 480px image. The publication software linearly
    scales the image to fit the box, thus thinning all graph elements, including the
    fonts, making the font size less optimal.


    ![](img/0c09161c0be53934e5708cffbdcc441f_345_0.png)


    ![](img/0c09161c0be53934e5708cffbdcc441f_345_1.png)


    Figure 16.1


    Figure 16.2


    For the graph in Figure 16.2, we need to fit the graph into a 2.875-inch-wide
    box. We have created the graph of the correct size by using the ODS Graphics WIDTH
    option. When this graph is inserted into the document, no image scaling is required.


    The graph in Figure 16.2 has fonts that are easy to read. The line thickness is
    also bolder. If the graph had markers, they would be bigger. Here the graph is
    showing the scaling, and it uses a font-friendly way to scale these items, resulting
    in a more readable graph.


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS© Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Design and Render Size: Each graph has a default "design" size. For most
    cases, this is 640px x480px. This size cannot be changed directly in SG procedures,
    but it can be changed if you are using GTL. A different "render" size can be specified
    by using the WIDTH and HEIGHT options on the ODS GRAPHICS statement.


    When the render is different from the design size, the graph is scaled to fit
    the new size. All individual elements inside the graph are scaled in a sub-linear
    fashion. The scale is:


    ```

    Scale-Factor = (Render-Height / Design-Height) 0.25

    ```


    This is done specifically to the shrinking or growing of the font sizes. Therefore,
    as the graph height shrinks, the font size shrinks too, but at a slower rate.
    Similarly, as the graph height grows, the font size grows too, but at a slower
    rate.


    For our case shown above, Design-Height=480px. The Render-Width is 2.875. If we
    retain the aspect ratio, the render width is 2.875 *0.75 = 2.16in in a graph width
    of 207 pixels. The linear scale for the image is 207 / 480 = 0.43. However, the
    Scale-Factor shown above is 0.43 *0.25 = 0.81.


    In Figure 16.1, the scale factor for the image and the fonts is 0.43. Therefore,
    a ten-point font effectively shows as a 4-point font, which is quite small. For
    the graph in Figure 16.2, the scale factor for image is 0.43, but the scale factor
    for the fonts is 0.81. So, a ten-point font is drawn at 8 point, which is still
    quite readable.


    Recommendation for Creating Small Graphs: Always render the graph at a size close
    to its final usage. Using the default size in a document will be fine if the graph
    grows a width of 6 to 7 inches. However, if it is to fit a smaller size, do not
    use the default graph size.


    Caveat: This does mean that the final rendered sizes may differ from those specified
    in the code or the style. If it is important that the font size be exactly as
    specified, then you can use the NOSCALE option on the ODS GRAPHICS statement.
    Even if the render height is different from the default design height, the fonts,
    lines, and markers will not scale.


    # 16.3 Creating Large Graphs for Use in Presentations


    The dimensions of the output image are also controlled by the DPI or IMAGE_DPI
    for the destination. Each destination has its own DPI used by the user or device.
    Some default values are shown in Figure 16.3.


    | ODS Destination | Default DPI |

    |---|---|

    | LISTING | 96 |

    | HTML | 96 |

    | RTF | 150 |

    | PDF | 150 |

    | Figure 16.3 |


    For LISTING and HTML destinations, the graph image is created as a separate file.
    In this case, the default image format is PNG, and the DPI information is included
    in the file.


    Matange, Sanjay and Han, Dan. Statistical Graphics by Example: Effective Graphs
    using SAS© Copyright © 2011, SAS Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.
    For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'If you want to create graph output that can be embedded in another document
    or presentation, it is convenient to create a separate file using the LISTING
    destination. With SAS 9.2, all graph output is in image format. Even for PDF and
    RTF output, the graph is essentially an image embedded into the document.


    With SAS 9.3, support for vector graphics output has been added. You can now generate
    EMF, PDF, SVG, and PCL output, depending on the ODS destination you use. In special
    cases, the graphs use data skins or gradient legends. In such cases, the output
    is in image formats. This is also the case when using transparency for EMF and
    PS.


    Graph size is controlled by setting the WIDTH and HEIGHT options on the ODS GRAPHICS
    statement and DPI, as seen in section 16.2. When creating smaller graphs for embedding
    into documents, it is useful to change the graph size when creating a graph that
    is more detailed and needs more space for rendering all the details.


    **Recommendations for Creating Large Graphs:** When presenting a graph to a large
    audience using a projection system, it is necessary that the details of the graphs
    are visible from a distance. The graph that looks on the screen from two feet
    away should be viewable on the large screen from 50 to 100 feet. To achieve this,
    you need to "scale up" the graph so that all the elements are made bigger and
    bigger linearly.


    Vector output is inherently scalable and ideal for use in some cases. You can
    use the default output in EMF or PDF formats for such cases. You can enlarge the
    graph on the computer screen to fill the window, and vector-based graphs will
    scale up.


    Image-based output created at a low (or default) resolution or DPI does not scale
    up well. When scaled, you sees "jaggies" on the edges of the lines, markers and
    fonts. To include such graphs in a presentation using a projection system to a
    large audience, you should increase the DPI of the graph. This will make the graph
    larger and also make all of the elements of the graph (markers, line thickness,
    and fonts) linearly bigger. Therefore, this graph, when viewed from afar, will
    look readable.


    Creating a graph with a size of 6.4in x 4.8in at 200 DPI will generate an image
    that is 1280 x 960px. The PNG file will include the DPI information in the file;
    therefore when you include this graph in a document, it will occupy a region 6.4in
    x 4.8in by default. However, if you view this file in some image viewers or Internet
    Explorer, you may see the image in the full 1280 x 960 size because these viewers
    do not honor the DPI setting in the PNG file.


    **Recommendations for Graphs in Web Pages:** Some browsers do not honor the DPI
    setting in the PNG file. A graph intended to be 6in x 4in (200 DPI) may be shown
    as 12in x 8in in the browser. Other browsers do scale, poorly. So, it is best
    to use the ODS HTML destination, or create graphs at 96 DPI for usage in Web pages.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# 16.4 Combining Graph Size and DPI


    As discussed in sections 16.2 and 16.3, scaling of the graph for height and DPI
    are done differently. Each is useful for different use cases. You can also mix
    the two judiciously to achieve the custom look you need. High DPI is also useful
    for documents since they are usually printed at a higher resolution (300 to 600).


    In this book, we have used a size of 3in x 2in at 300 DPI for most of the graphs.
    Specifying the size shrinks the fonts a little. Using high DPI gives us graphs
    that will scale well when printed on a high-resolution printer. For graphs that
    occupy a larger area, like those in Chapters 12 and 13, we have used a larger
    size of 6in x 3in at 200 DPI.


    # 16.5 Impact of Graph Size on System Resources


    When creating graphs as image output, higher system resources are consumed to
    create larger graphs with high DPI.


    +   - More system memory is needed to create the graph. The rendering system is
    Java based. SAS system settings for Java specify the amount of memory that can
    be used by Java. Using higher size and DPI requires a higher amount of memory.
    If the graph cannot be rendered, a warning is logged. If you need the higher resolution
    graph, you can change the memory settings using the JREOPTIONS option specified
    in the SAS system options. See the SAS documentation for details.


    ```

    -jreoptions (''-Xmx512m'')

    ```


    +   - If sufficient memory resources are available, the graph will be rendered.
    However, it will likely consume more system and CPU time to render the graph.


    +   - If the graph is successfully rendered, the output file size will be bigger.'
  merge: -1
