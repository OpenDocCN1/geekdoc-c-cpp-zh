    The non-plot statements such as the ROWAXIS and COLAXIS are used to customize
    the common axes. A legend is automatically created based on inspection of the
    syntax.


    All of the graphs created by this procedure have common external axes:


    +   - The x-axes for all columns are uniform.

    - The y-axes for all rows are uniform.

    - Uniform option may be set within rows or columns.


    The SPANEL procedure supports a number of layout types, which will be described
    in the following sections.


    # 2.3.1 Layout PANEL


    This is the default layout type. This layout supports one or more (N) class variables.
    A cell is created for each crossing of the unique values of all class variables.
    Figure 2.12 shows a graph with two class variables, each with 2 levels, resulting
    in a graph with 4 cells.


