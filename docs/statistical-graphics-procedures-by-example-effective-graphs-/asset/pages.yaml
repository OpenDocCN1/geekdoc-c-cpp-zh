  md: '# Figure 5.3.7: Scatter Data Labels


    By default, the DATALABEL option displays the non-missing Y values of the scatter
    points. You can assign a column to the option to display alternate values.


    In this example, the Y values of only the outlying points are copied to a column
    called "outlier". The missing values in that column are not displayed.


    ![](img/0c09161c0be53934e5708cffbdcc441f_147_0.png)


    ```

    /* The Impact of Horsepower on MPG*

    proc sgplot data=dataset.carlabel noutelegend;

    where type=''Sedan'' and origin=''USA'';

    reg x=horsepower y=mpg_city / clm datalabel=outlier;

    xaxis grid;

    yaxis grid;

    run;

    ```


    # Figure 5.3.8: Polynomial Regression Fit


    The DEGREE option can be used to change the polynomial for the regression fit.


    In this example, a quadratic fit is made through the scatter points by setting
    the DEGREE option to 2.


    ![](img/0c09161c0be53934e5708cffbdcc441f_147_1.png)


    ```

    /* The Impact of Horsepower on MPG*

    proc sgplot data=dataset.car noutelegend;

    where type=''Sedan'' and origin=''USA'';

    reg x=horsepower y=mpg_city / degree=2;

    xaxis grid;

    yaxis grid;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
