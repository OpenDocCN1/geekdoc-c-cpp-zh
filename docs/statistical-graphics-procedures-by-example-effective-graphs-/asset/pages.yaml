  md: "# ### 4.5.5: Scatter with Marker Characters\n\nThe MARKERCHAR option can be\
    \ used to display a character string for the data in the column at the (x, y)\
    \ location in the plot. Here we have displayed the high and low temperature values\
    \ for each observation within the marker.\n\nA Refine for y=32 is displayed.\n\
    \n```\ntitle \"Average Temperatures in [unicode \\u00B0xC] and [unicode \\u00B0xF]\"\
    \nproc sgplot data=weather noautolegend;\n  refine 32 / label=\"*32\" labelinside\
    \ labelpos=min;\n  scatter x=month y=high / marker=(symbol=circle size=15);\n\
    \  scatter x=month y=high / markerchar=;\n  scatter x=month y=low / marker=(symbol=circle\
    \ size=12) y2;\n  xaxis offset=0;\n  xaxis grid=14-max=14;\nyaxis min=10-max=40;\
    \ run;\n```\n\n![](img/0c09161c0be53934e5708cffbdcc441f_89_0.png)\n\n# ### 4.5.6:\
    \ Scatter with Axis Aligned Statistics\n\nThe MARKERCHAR option is used to create\
    \ a table of statistics that is aligned with a categorical-axis.\n\nREFINEMENT\
    \ statements with DISCRETEOFFSET are used to create the vertical column headers.\
    \ X2 axis is used with DISPLAY option to simulate column headers.\n\n```\ntitle\
    \ \"Average Temperatures for Raleigh\"\nproc sgplot data=weatherTable noautolegend;\n\
    \  scatter x=month y=high / markerchar=x2axis;\n  scatter x=month y=low / markerchar=x2axis;\n\
    \  scatter x=month y=high / markerchar=high x2axis;\n  scatter x=month y=low /\
    \ markerchar=prec x2axis;\n  scatter x=month y=low / marker=prec x2axis;\nrefine\
    \ \"High(F)\\ \"Low(F)\\ \"High(C)\\ \"Low(C)\" / axis=2 discreteoffset=0.5;\n\
    x2axis display=(noticks nolabel) valueattrs=(size=7);\nyaxis display=(noticks)\
    \ reverse valueattrs=(size=7); run;\n```\n\n![](img/0c09161c0be53934e5708cffbdcc441f_89_1.png)\n\
    \n> 9.3\n\nMatange, Sanjay and Heath, Dan. Statistical Procedures by Example:\
    \ Effective Examples Using SAS*. Copyright 2011, SAS Institute Inc., Cary, North\
    \ Carolina, USA. ALL RIGHTS RESERVED. For additional resources, visit support.sas.com/publishing."
