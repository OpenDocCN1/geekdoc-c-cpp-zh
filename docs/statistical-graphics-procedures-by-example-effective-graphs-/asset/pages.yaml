  md: "# Figure 4.6.9: Series Plot with Group Overlay\n\nThis is a graph with a grouped\
    \ series plot overlaid with a scatter plot that has error bars on a discrete x-axis.\
    \ The groups are overlaid on the same midpoint values along the x-axis.\n\nThis\
    \ can obscure the data. See alternative arrangement in Figure 4.6.10.\n\n![](img/0c09161c0be53934e5708cffbdcc441f_95_0.png)\n\
    \n```\ntitle 'Sales by Quarter';\nproc sgplot data=sgbook.salesDiscreteGroup;\n\
    \  scatter x=qtr y=sales / yerrorrorper=higherrorlower=low group=drug;\n  series\
    \ x=qtr y=sales / group=drug;\n  xaxis grid display=(nolabel);\n  yaxis grid;\n\
    run;\n```\n\n# Figure 4.6.10: Series Plot with Group Cluster\n\n![](img/0c09161c0be53934e5708cffbdcc441f_95_1.png)\n\
    \nThis graph is the same as in Figure 4.6.9, with GROUPDISPLAY=cluster. In this\
    \ case, the scatter and series plots use the same settings.\n\nThis causes the\
    \ groups to be displayed with an offset along the x-axis, making the data for\
    \ each drug more readable. CLUSTERWIDTH determines the offsets.\n\n```\ntitle\
    \ 'Sales by Quarter';\nproc sgplot data=sgbook.salesDiscreteGroup;\n  scatter\
    \ x=qtr y=sales / group=drug yerrorrorper=higherrorlower=low groupdisplay=cluster\
    \ clusterwidth=0.6;\n  series x=qtr y=sales / group=drug lineattrs=(thickness=1)\
    \ groupdisplay=cluster clustersidth=0.6;\n  xaxis grid display=(nolabel);\n  yaxis\
    \ grid;\nrun;\n```\n\n> 9.3"
