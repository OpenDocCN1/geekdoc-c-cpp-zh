- img_proc: true
  md: '# ## 5.7 Combining the Plots


    Figure 5.7.1: Comparing Fits


    Different types of fits with various parameters can be overlaid on the raw plot
    data for comparison.


    ![](img/0c09161c0be53934e5708cffbdcc441f_169_0.png)


    ```

    title "The Impact of Horsepower on MPG";

    proc sgplot data=sashelp_cars;

    where type="Sedan" and origin="USA";

    reg x=horsepower y=mpg_city;

    loess x=horsepower y=mpg_city / markers smooth=0.4;

    xaxis grid;

    yaxis grid;

    run;

    ```


    ### Figure 5.7.2: Comparing Fits with CLM


    To prevent the CLM bands from overlapping the fit lines, the statements are ordered
    to draw the CLM bands first, then the fit lines.


    The first two statements represent the fit lines by specifying a zero-thickness
    line attribute. The legend is assigned to the statements that draw the lines.


    ![](img/0c09161c0be53934e5708cffbdcc441f_169_1.png)


    ```

    proc sgplot data=sashelp_cars;

    where type="Sedan" and origin="USA";

    reg x=horsepower y=mpg_city / clm lineattribut=(thickness=0);

    loess x=horsepower y=mpg_city / clm lineattribut=(thickness=0.4);

    reg x=horsepower y=mpg_city / markers name="reg";

    loess x=horsepower y=mpg_city / name="loess" smooth=0.4;

    pattern=solid;

    keylegend="reg" "loess";

    axis grid; yaxis grid; run;

    ```'
  merge: -1
