    # Figure 3.2.16: Step Plot with Limits


    This plot shows the predicted weight by height for students in a classroom using
    a step plot.


    Confidence values are shown as Y error bars. LINEATTRS is used to set the thickness
    of the step plot line, and ERRORBARATTRS is used to set the pattern for the error
    bars.


    ![](img/0c09161c0be53934e5708cffbdcc441f_57_1.png)


    ```

    title ''Predicted Weight by Height'';

    proc sgplot data=sashelp.classfit noautlegend;

    step xheight=predict y ylower=lower yerrorupper=upper

    lineattrs=(thickness=2) errorbarattrs=(pattern=dash);

    axis grid;

    axis grid label="Weight";

    run;

    ```


