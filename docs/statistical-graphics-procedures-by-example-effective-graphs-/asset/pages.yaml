  md: "# 13.2 Stock Price and Volume Chart\n\nThis is a common stock chart from the\
    \ data shown below with the following features:\n\n+   - Y-Y2 split technique\
    \ is used to draw price data above the volume data.\n- Price data is an overlay\
    \ of the Bollinger, 25 and 50 event moving average, and price.\n- Volume data\
    \ includes volume and moving average.\n- The key legend is placed in the empty\
    \ upper right corner with all the details.\n\n| Stock | Date | High | Low | Close\
    \ | Volume | avg25 | avg50 | vavg |\n|---|---|---|---|---|---|---|---|-|\n| IBM\
    \ | 01AUG88 | $66.00 | $126.87 | $110.30 | $112 | 5,256,886 | $23 | $29 | $16550307.56\
    \ |\n| IBM | 01SEP88 | $111.12 | $116.50 | $109.50 | $115 | 5,433,352 | $22 |\
    \ $29 | $16752677.08 |\n| IBM | 03OCT88 | $115.12 | $124.87 | $112.75 | $123 |\
    \ 5,790,742 | $22 | $29 | $16746219.84 |\n\n![](img/0c09161c0be53934e5708cffbdcc441f_324_0.png)\n\
    \n```\ntitle \"Stock Plot of Price and Volume*\";\nproc sgplot data=Stock_IBM_Stats;\n\
    \  where date > '01Jan2000';\n  band x upper lower transparency=0.5 label1=Bolll_;\n\
    \  band x upper high low transparency=$0 / yaxis transparency=openclose=close\n\
    \  series x y=close(color=black thickness=1) label=Value;\n  series x y=y225(label=25\
    \ Moving Avg.);\n  series x y=y250(label=50 Moving Avg.);\n  needle x y=volume/data=3(pattern=solid);\n\
    \  series x y=vavg/data=4(opts) label='Avg Volume';\n  keylegend / location=topright\
