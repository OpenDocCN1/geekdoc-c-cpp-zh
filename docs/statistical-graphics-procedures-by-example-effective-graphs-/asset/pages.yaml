  md: '# Figure 9.1.7: Creating an Axis-aligned Statistics Table


    This graph contains an axis-aligned statistics table of class weight and height.
    The Y-coordinates and the table values are extracted from the bar chart''s input
    data set. After the last value is processed (_last_ is set), we add the column
    headers for the table. The PROC SGPLOT call to make the bar chart uses the new
    PAD option to provide space for the table.


    ![](img/0c09161c0be53934e5708cffbdcc441f_252_0.png)


    | Class Statistics | Weight | Height |

    |---|---|--|

    | Alfred | 113 | 69 |

    | Carol | 103 | 63 |

    | Henry | 103 | 64 |

    | Barbara | 98 | 65 |

    | Alice | 84 | 57 |


    | Name | Height | Weight | x1space | y1space | datavalue | anchor | label | function
    | y1 | x1 |

    |---|---|---|---|---|---|---|---|---|---|--|

    | Alfred | 69.0 | 112.5 | wallpercent | | | | Right | 113 | text | Alfred | 112.0
    |

    | Alfred | 69.0 | 112.5 | wallpercent | | | Right | 69 | text | | 122.0 |


    ```

    title "Class Statistics";

    proc sgplot data=ashelp.class(obs=5) sganno-anno

    pad(right=40);

    axis displays(nolabel);

    hbar number=weight categoryorder=resdesc

