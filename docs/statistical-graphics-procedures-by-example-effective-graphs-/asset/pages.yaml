- img_proc: true
  md: '# Figure 9.1.9: Adding a Company Logo


    You can create a small annotate data set to add a company logo to all of the graphs
    in your report, assuming you want the logo in the same location. A typical place
    to put this logo is in one of the extreme corners of the graph. The key to using
    the data set is to specify the proper padding in the SG procedure to prevent collisions
    with the plot axes or other graph features.


    ![](img/0c09161c0be53934e5708cffbdcc441f_255_0.png)


    ```

    function anchor x1 y1 width datasource image

    Image bottomright 100 0.5 20 graphpercent logo.png

    ndata anno;

    retain "Image" anchor "bottomright" x1 100 y1 0.5

    width 20 datasource "graphpercent" image "logo.png";

    run;


    title "Milk Production for 2007";

    proc sgplot data=sgbook.milk_production pads=(bottom=5%%) sganno=anno;

    axis discreteorder=data;

    hbar month / response=production dataskin=pressed;

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS©. Copyright © 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
