- img_proc: true
  md: '# Chapter 9: Annotation and Attribute Maps (SAS 9.3)


    In SAS 9.3, two new features were added to the SG procedures that are driven by
    auxiliary data columns. The first feature is an annotation facility that enables
    you to draw text and other graphical primitives on your graph output to supplement
    or enhance the plot information. The second feature is called an *attribute map*,
    which enables you to define the visual attributes of particular group values.


    #  9.1 Annotation


    The basic idea for annotation is that you can define a data set that contains
    the custom drawing actions you want to perform on a graph (see Figure 9.1.1).
    The data set has reserved column names, each providing the specific information
    needed to create the primitives. The name of this data set is provided on the
    procedure statement using the SGANN option.


    Each observation draws one graphical primitive on the graph as defined by the
    FUNCTION column. If the function is a POLYGON or a POLYLINE, then this observation,
    together with subsequent POLYCOUNT values, defines the vertices of the figure.
    The information needed for each function is provided in the other named columns
    of the data set. Figure 9.1.2 shows the program code to create the graph in Figure
    9.1.3.


    | Function workspace | xc2 | yc2 |

    |---|---|---|

    | Polyline dataval | 2.3 | Chrysler |

    | Polyline dataval | 3.5 | Chrysler |

    | Polyline dataval | 3.5 | Fiat |

    | Polyline dataval | 2.8 | Fiat |

    | Polyline dataval | 3.5 | Suzuki |

    | Polyline dataval | 4.5 | Suzuki |

    | Arrow dataval | 4.5 | Suzuki Hyundai |


    ```

    /* Top Global Automakers... */

    proc sgplot data=sganno anno=;

    hbarparm category=Automokers

    response=hmillion_units/<options>

    yaxis display=(nabel) reverse;

    run;

    ```


    Figure 9.1.1


    ![](img/0c09161c0be53934e5708cffbdcc441f_247_0.png)


    Figure 9.1.3'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'When you create the annotation data set using DATA step code, be sure to check
    the length of your columns. This annotation definition uses a number of keywords
    of varying lengths. You might start with an attribute that is four characters
    wide and change it to something eight characters wide later in the DATA step.
    The eight-character value will be truncated to four characters unless you use
    the LENGTH statement or set a column range in the INPUT statement. If you see
    odd results in your graph, be sure to check the log to see if invalid attributes
    were specified due truncation.


    Many SAS users will be familiar with the annotation concepts described in this
    chapter, as they are based on the SAS/GRAPH annotation facility. However, this
    new facility has been redesigned to take advantage of the capabilities of the
    ODS Graphics system, such as transparency and rich text support. The data set
    column names and values have been defined in a way to make them more memorable
    and self-documenting. The facility uses various drawing spaces in non-paneled
    plots to help simplify the placement of graphics primitives.


    For the SAS 9.3 release, the following functions are supported in the FUNCTION
    column:


    +   - TEXT — Used to draw a text string in the graph.

    - TEXTCONTENT — Used to continue a text string from a previous TEXT or TEXTCONTENT
    function. This function is typically to perform rich text operations, such as
    changing color or attributes.

    - IMAGE — Used to place an image into the graph.

    - LINE — Used to draw a line segment in the graph.

    - ARROW — Used to draw an arrow in the graph.

    - RECTANGLE — Used to draw rectangles or squares in the graph.

    - OVAL — Used to draw circles in the graph.

    - POLYGON — Used to draw a closed line figure in the graph. Because this is a
    closed figure, the poly may be filled. This operation specifies the starting point
    of the polygon. Each subsequent POLYCOUNT operation is used to draw one line segment
    from the previous ending point.

    - POLYLINE — Used to draw an open line figure in the graph. This operation specifies
    the starting point of the polygon. Each subsequent POLYCOUNT operation is used
    to draw one segment from the previous ending point.

    - POLYCOUNT — Used to specify the next drawing point for a POLYGON or POLYLINE
    figure. All visual attributes for the figure must be specified on the initial
    POLYGON or POLYLINE statement.


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'An important concept to understand when working with annotations is the concept
    of drawspace. The drawspace specification is a combination of both an area and
    a unit. Not all areas are supported by all SG procedures. The SGPLOT procedure
    supports all areas, while the SGPanel and SGSCATTER procedures support only the
    graph and layout areas. The graph below shows where these areas are located in
    a typical SGPLOT output (Figure 9.1.4).


    # This is a Title


    ![](img/0c09161c0be53934e5708cffbdcc441f_249_0.png)


    Figure 9.1.4


    The units are either PERCENT or PIXEL, except the DATA area which also supports
    a VALUE unit. As an example, if you wanted to draw an annotation in the wall area
    using percentages, you could use the WALLPERCENT drawspace. Currently, annotations
    may be drawn with absolute coordinates; there is not a relative drawing mode.


    Annotations do not reserve space in the graph. If you need to reserve space in
    the graph for an annotation, there are two techniques you can use. The SG procedures
    support a new option called PAD that gives you the ability to padding to any of
    the four edges of the graph. To reserve space within the plot area, use the OFFSETMIN
    and OFFSETMAX options on the axis statements.


    Matange, Sanjay and Heath, Dan. Statistical Graphics by Example: Effective Graphs
    Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Figure 9.1.5: Creating Axis Values with Unicode


    This example uses a user-defined format to create age ranges for each box. To
    show these ranges in the most compact way, you can use a Unicode "s" in the tick
    value. To add these characters, you can turn off the tick values and use annotation
    to create the tick values. The ODS ESCAPECHAR functionality can be used to add
    Unicode, superscripts, or subscribe to your annotation strings. The data set contains
    a value for each range so that the values can be positioned in data space. The
    label uses the Unicode function to create the "s" (2284 x). The new PAD option
    is isused to reserve space for the annotated axis values.


    ![](img/0c09161c0be53934e5708cffbdcc441f_250_0.png)


    | function | yspace | y1 | width | x1 | label |

    |---|---|---|---|---|--|

    | text | graphpercent | datvalue | 7 | 15 | 21 | 20 ≤ 30 |

    | text | graphpercent | datvalue | 7 | 15 | 31 | 30 ≤ 40 |


    ```

    data anno;

    retain function ''x1'' ''yspace'' ''graphpercent'' ''xspace'' ''datvalue'' y 7
    with 15;

    cards;

    input x1 label 4-33;

    21 20 (*ESC*)[unicode ''2264*x''] 30

    31 30 (*ESC*)[unicode ''2264*x''] 40

    41 40 (*ESC*)[unicode ''2264*x''] 50

    51 50 (*ESC*)[unicode ''2264*x''] 60

    61 60 (*ESC*)[unicode ''2264*x''] 70;

    run;

    \ods graphics / reset=index width=min height=3in;

    title "Cholesterol Level by Age Range";nproc sgplot data=sashleep,heart sganno=anno
    pad=(bottom=8);

    format AgeAtStart ageAtmt;

    axis xaxis display=(nolabel values);

    vbox cholesterol / category=ageAtStart;

    run;

    ```'
  merge: -1
  pgno: 250
- img_proc: true
  md: "# Figure 9.1.6: Creating Multi-line Axis Tick Values\n\nWhen tick values contain\
    \ multiple words, it is sometimes more space-efficient to split the value into\
    \ multiple lines. There is a technique using annotation that can help you create\
    \ these multi-line values. The key is using the WIDTH column to specify a text\
    \ width. When a text string reaches the specified width, the system will automatically\
    \ try to wrap the string. By combining the correct width with the \"center\" value\
    \ on the JUSTIFY column, you can create center-justified, multi-line tick values.\n\
    \n![](img/0c09161c0be53934e5708cffbdcc441f_251_0.png)\n\n| xc1 | x1space | y1space\
    \ | anchor | function | width | justify | y1 | label |\n|---|---|---|---|---|---|---|---|-|\n\
    | North Carolina | datavue | wordpress | top | text | | 15 | center | -0.5 | North\
    \ Carolina |\n| South Carolina | datavue | wordpress | top | text | | 15 | center\
    \ | -0.5 | South Carolina |\n\n```\ndata ano;\nset sgbook.rainfall(keep=state)=last_;\n\
    length xspace = 11 y1space = 13 anchor $ 6;\nrename state=x50;\nretain function\
    \ \"top\" xspace \"datavue\" y1space \"wordpress\" width 15\njustify \"center\"\
    \ -0.5 anchor=\"top\";\noutput;\nif (_last_) then do;\nxpace = \"wordpress\";\n\
    y1space = \"graphcenter\";\nanchor=\"bottom\";\ntitle \"maximum Rainfall Caused\
    \ by a Tropical Cyclone\";\nproc sgplot data=rainfall sganno=anno\nnpade=(bottom=15)\
    \ nolegend;\naxis displays=(nolabel novales);\nbar stat=rainfall / response=rainfall\
    \ dataskin=pressed\ndatalabel; \nrun;\nend;\n```\n\nMatange, Sanjay and Heath,\
    \ Dan. Statistical Graphics Procedures by Example: Effective Graphs Using SAS©\
    \ Copyright 2011,\nSAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ For additional SAS resources, visit support.sas.com/publishing."
  merge: -1
