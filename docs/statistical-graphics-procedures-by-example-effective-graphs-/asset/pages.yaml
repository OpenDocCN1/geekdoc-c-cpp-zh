- img_proc: true
  md: '# ## 7.8 Combining the Plots


    # ### 7.8.1: Bar-Line Overlay


    In this example, a line chart is overlaid on a bar chart. The line chart is assigned
    to the Y2 axis to display the weight independent from the cholesterol range.


    The data labels are displayed for each chart and positioned above and below the
    chart. The Y2 axis explicitly set to zero synchronize with the y-axis.


    ![](img/0c09161c0be53934e5708cffbdcc441f_230_0.png)


    ```

    title "Average Cholesterol and Weight by Age Group";

    proc sgplot data=sashelp.heart=autolelegend;

    format AgeStart=agefirst;

    yaxis label="Cholesterol";

    y2axis label="Weight" axis=0;

    bar AgeStart / response=cholesterol stat=mean databel

    dabelposbottom;

    line AgeStart / response=weight stat=mean yaxis markers;

    dataabel databeltop=;

    run;

    ```


    # ### 7.8.2: HLINE-Dot Overlay


    ![](img/0c09161c0be53934e5708cffbdcc441f_230_1.png)


    In this example, the HLINE draws the actual values in descending order. The line
    creates a visual representation for evaluating the predicted values.


    Predicted values to the left of the line mean that exceeds the predicted value.
    Predicted values to the right of the line mean that sales short of the predicted
    value.


    ```

    title "Product Sales for 1993";

    proc sgplot data=sashelp.prdsale where=(year=1993));

    hline product / response=actual categoryorder=resp markers;

    dot product / response=predict;

    run;

    ```'
  merge: -1
