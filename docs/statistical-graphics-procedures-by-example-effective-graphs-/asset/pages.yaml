    two responses are displayed side by side using DISCRETEOFFSET and BARWIDTH options.
    The y axis label is used.


    This graph uses DATASKIN=Gloss to apply a decorative finish to the bars.


    ```

    title "City and Highway Mileage by Country";

    proc sgplot data=sashelp.car;

    where type=''Sedan'' or type=''Sports'';

