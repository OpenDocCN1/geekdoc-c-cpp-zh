- img_proc: true
  md: '# Figure 5.4.11: Overlaid Fits


    You can overlay fits for comparison by using the NOMARKERS option on all LOESS
    statements but one, you can use a separate SCATTER statement for more control
    over the scatter plot.


    Notice that the LOESS statements are assigned to a custom legend. The default
    legend label reflects the type used and the smoothing parameter specified.


    ![](img/0c09161c0be53934e5708cffbdcc441f_156_0.png)


    # Figure 5.4.12: Curve Labels


    Instead of using a legend to identify each fit, you can use the CURVELABEL option
    to directly label the fit lines. This approach works well when the lines are not
    crowded.


    Here the labels are moved to the MIN side of the fits and outside of the data
    area. The plots are assigned to the secondary y-axis to give space to the fit
    labels on the left.


    ```

    title "The Impact of Horsepower on MPG"

    proc sgplot datashelp.cars;

    autolelegend;

    where horsepower <= 300;

    scatter xhorsepower=mpg_city / transparency=0.8 y2axis;

    loess xhorsepower=mpg_city / markers smooth=0.8

    curabel1="Smooth=0.8" curabelpos=min curabellloc=outside y2axis;

    loess xhorsepower=mpg_city / markers smooth=0.3

    keylegend="Smooth=0.3 name=Loess2" / locationinside inside=1;

    curabel2="Smooth=0.3" curabelpos=min curabellloc=outside y2axis;

    yaxis grid; run;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_156_1.png)'
