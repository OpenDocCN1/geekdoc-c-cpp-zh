  md: 'Related Style Elements: The GraphDefault style element is used to draw the
    plot elements. When a GROUP variable is present, or when multiple plot statements
    are overlaid, the GraphData1-GraphData12 elements are used, one for each group
    or plot statement.


    The band may be filled, with or without an outline. The GROUP role is used to
    create multiple bands, one for each unique value. When used with a series or plot
    to display a confidence or prediction band, the MODELNAME option can be used to
    create an association with the fit plot.


    Note: The band plot is optimal for the display of confidence and prediction bands,
    where the X (or Y) values are sorted. The band is drawn in data order, and if
    the data are not sorted by X (or Y), then the results may be unpredictable.


    # Figure 4.8.1: Basic Band Plot


    This is a basic band plot along the x-axis, with upper and lower limits in the
    y-direction.


