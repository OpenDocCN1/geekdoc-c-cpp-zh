  md: '# 12.8 Median of Lipid Profile over Time by Treatment (9.3)


    In this graph we are displaying the lipid profile over time by treatment group.
    Here again, we have used the "Y-Y2 Split" technique to split the group region
    into two parts:


    +   - The upper region is used to display the graph.

    - The lower region is used to display the statistics.

    - A cluster grouped scatter plot is used for the values.

    - A cluster grouped series plot is used for the lines.

    - The cluster width is reduced to lighten the clusters.

    - A scatter plot with y-Drug and MARKERCHAR option is used to display the statistics.

    - A reference line on the Y2 axis, with DISCRETEOFFSET, is used to separate the
    two regions.


    | X | Drug | Median | Lcl | Ucl |

    |---|---|---|---||

    | Baseline | Drug A | 5.21 | 5.04 | 5.52 |

    | Baseline | Drug B | 5.17 | 4.94 | 5.47 |

    | Baseline | Drug C | 5.24 | 4.97 | 5.53 |

    | Baseline | Placebo | 5.23 | 4.95 | 5.50 |

    | Day 14 | Drug A | 4.90 | 4.60 | 5.79 |

    | Day 14 | Drug B | 6.65 | 4.81 | 7.51 |


    ![](img/0c09161c0be53934e5708cffbdcc441f_306_0.png)


    ```

    title Median of Lipid Profile over Time by Treatment";

    proc sgplot datagroup.lipid_grp;

    where by test=1;

    scatter x=y /group=drug yrorupper=ucl yrorlower=lcl

    groupdisplay=cluster clusterswidth=0.5 markerattrs=(size=9);

    series x=y /group=markerchar groupdisplay=cluster clusterswidth=0.5;

    scatter x=y /group=marker-median y2axis;

    refine "Placebo" /discreteoffset=0.5 axis=y2;

    axis grid off offsetmin=0.30;

    y2axis offsetmax=0.8 display=(noticks nolabel)

    run;

    ```'
