  md: '# 4.12 Bubble Plot (9.3)


    The BUBBLE statement has the following syntax:


    ```

    bubble x=column y=column size=num-column </ options>;

    ```


    Bubble plot draws circular bubbles sized by the Size role at the X and Y locations
    in the plot. Radius of the bubbles is scaled linearly by the SIZE variable.


    ![](img/0c09161c0be53934e5708cffbdcc441f_117_0.png)


    | Required Data Roles: | | |

    |---|---||

    | | column | Position along the horizontal axis |

    | | Y | Position along the vertical axis |

    | SIZE | num-column | Size of the bubble |


    | Optional Data Roles: | | |

    |---|---||

    | DATABEL | =column | Label String for each observation |

    | GROUP | =column | Classification for bubble color |

    | URL | =column | URL for each observation |


    | Appearance Options: | | |

    |---|---||

    | DATABELATTRS | =ext-attr | Appearance attributes of the labels |

    | FILLATTRS | =fill-attr | Appearance attributes of bubble interior |

    | LINEATTRS | =line-attr | Appearance attributes for bubble outline |


    | Other Options: | | |

    |---|---||

    | BRADIUSMAX | =value | Radius in pixels of the largest bubble |

    | BRADIUSMIN | =value | Radius in pixels of the smallest bubble |


    | Boolean Options: | | |

    |---|---||

    | FILL | =NOFILL | Display filled bubbles or not |

    | OUTLINE | =NOUTLINE | Display bubble outline or not |


    | Standard common options: | |

    |---||

    | ATTRID, LEGENDLABEL, NAME, NOMISSGROUP, TRANSPARENCY, URL, X2AXIS, Y2AXIS |


    Required Style Elements: The GraphDefault style element is used to draw the plot
    elements. When a GROUP variable is present, or when multiple plot statements are
    overlaid, the GraphData1-GraphData12 elements are used, for each group or plot
    statement.


