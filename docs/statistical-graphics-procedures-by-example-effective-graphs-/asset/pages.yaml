  md: '# ## 6.5 Horizontal Box Plot


    The horizontal box (HBOX) plot shows the distribution of the analysis variable
    by category. The syntax is:


    ```

    hbox column / options>;

    ```


    A box is displayed for each unique category value. The default display includes
    the Q1-Q3 interval, mean, median, and whiskers, outliers.


    ![](img/0c09161c0be53934e5708cffbdcc441f_186_0.png)


    # ## Required Data Roles:


    | num-column | Analysis variable |


    # ## Optional Data Roles:


    | CATEGORY | =column | For category values along x-axis |

    | FREQ | =num-column | Frequency count for each observation |

    | GROUP | =column | Group variable for each observation |

    | CONNECTATTRS | =line-attrs | Appearance for connect line |

    | DATALABELATTRS | =text-attrs | Appearance for data labels |

    | FILLATTRS | =attrs | Appearance of box interior |

    | LINEATTRS | =attrs | Appearance of box outlines |

    | MEANATTRS OUTLIERATTRS | =marker-attrs | Appearance of mean and outliers |

    | MEDIANATTRS | =line-attrs | Appearance of median |

