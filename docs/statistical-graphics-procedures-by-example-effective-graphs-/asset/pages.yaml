  md: '# 4.17 Combining the Plots


    Basic plots can be combined (overlayed) in unlimited ways as long as the data
    types on each axis are consistent. In some of the preceding examples, we have
    seen various combinations of scatter series, step, step, and band plots. These
    plot types tend to have numeric interval variables on both axes, but sometimes
    have categorical variables on one or both axes.


    The order of the plot statements determines if certain combinations are allowed.
    The axis type of type (linear, discrete, etc.) is decided by the first plot in
    the list. Subsequent plots must have compatible type of data on the same axis
    for the combination to be acceptable.


    Compatibility:


    +   1. If the axis is of type LINEAR, it is compatible with only LINEAR variables.

    2. If the axis is of type DISCRETE, then it is compatible with both DISCRETE and
    LINEAR variables. Subsequent LINEAR data are treated as DISCRETE.


    Axis and Data Compatibility:


    +   1. If the first plot is a SCATTER, with x-axis having linear variables, then
    the default axis type is LINEAR. Now, subsequent overlay plots must have linear
    variables for the combination to work. A plot with an x-axis that has a categorical
    variable will not be accepted, unless the axis type is explicitly set as DISCRETE.

    2. If the first plot has a DISCRETE on the y-axis, then the subsequent overlay
    plot can have a Y variable that is either linear or discrete. The linear data
    will be treated as DISCRETE.


    Common Combinations of Basic Plots:


    +   1. Any plot with one or more plots of the same kind – Multi-Response

    2. Scatter with Series and Step

    3. Series and Step plots with Band plots

    4. Scatter, Series, and Bands

    5. Scatter, Step, Band, and BarPlot with Reference Lines

    6. Scatter, Step, Band, and BarPlot with LineParm Lines

    7. Bar-Line using VBarPlot, and Series

    8. Scatter with Marker for overlay annotated data labels

    9. Scatter and Vector Plots

    10. HighLowType=Line with Series and Bands – Stock Plot

    11. HighLowType=Bar with Scatter – Adverse Event Plot


    Note: Basic plots can be combined with:


    +   - Fit and Confidence plots – We will see these examples in Chapter 5.

    - Distribution plots – We will see these examples in Chapter 6.

    - Categorization plots – We will see these examples in Chapter 7.


    Let us look at some examples in the following pages.'
  merge: -1
