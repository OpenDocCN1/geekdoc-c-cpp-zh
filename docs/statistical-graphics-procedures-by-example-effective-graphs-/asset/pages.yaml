  md: "# Figure 7.3.11: Bar Chart with Groups and Pattern Fills\n\nThe JOURNAL2 style\
    \ is designed to be a black-and-white style. When this style is used with bar\
    \ charts, fill patterns (SAS 9.3) are used in situations that need unique colors.\n\
    \nThe MONOCHROMEPRINTER style is also a black-and-white style, which uses serif\
    \ fonts instead of sans-serif fonts.\n\n```\nods listingstyle=journal2;\ntitle\
    \ \"Product Sales\";\nproc sgplot data=sgbook.product_sales;\n  yaxis label=\"\
    Sales (in millions)\"\n  vbar product / response=actual group=region groupdisplay=cluster;\n\
    run;\n```\n\n![](img/0c09161c0be53934e5708cffbdcc441f_201_0.png)\n\n# Figure 7.3.12:\
    \ Grouped Bar Chart using PROC SGPANEL\n\nIn the previous grouping, the group\
    \ values are clustered around a category value. In this example, the category\
    \ values are clustered around a group value.\n\nThe NOORDER option is used to\
    \ remove the border between cells. The LAYOUT=COLUMNLATTICE option displays all\
    \ in one row.\n\n```\ntitle \"Product Sales\";\nproc sgpanel data=sgbook.product_sales;\n\
    \  panelby region / layout=columnlattice novarname onpanel;\n  vbar product /\
    \ response=actual;\nrun;\n```\n\n![](img/0c09161c0be53934e5708cffbdcc441f_201_1.png)"
