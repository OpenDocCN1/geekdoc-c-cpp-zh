  md: '# ### Figure 6.4.1: Box Plot


    This is a basic plot of mileage by type. Default display includes the Q1-Q3 interval,
    mean marker, median line, whiskers, and outliers.


    ![](img/0c09161c0be53934e5708cffbdcc441f_182_0.png)


    ```

    title *Distribution of Mileage by Type*;

    proc sgplot data=sashelp.cars nolegend;

    where type=''Sedan'' or type=''Sports'' or type=''SUV'';

    vbox mpg_city / category=type;

    yaxis grid;

    xaxis grid; display=(nolabel1);

    run;

    ```


    # ### Figure 6.4.2: Grouped Box Plot


    This is a grouped plot of mileage by type and drivetrain. For consistency with
    other graphs like scatter, others, etc., the default GROUPDISPLAY is Overlay.


    Set GROUPDISPLAY=cluster to get side-by-side display of group values.


    A legend is displayed by default.


    ![](img/0c09161c0be53934e5708cffbdcc441f_182_1.png)


    ```

    title *Distribution of Mileage by Type*;

    proc sgplot data=sashelp.cars;

    where type=''Sedan'' or type=''Sports'' or type=''SUV'';

    vbox mpg_city / category=type group=driv

    groupdisplay=cluster;

    yaxis grid;

    xaxis display=(nolabel1);

    run;

    ```


    Matange, Sanjay and Heath, Dan. Statistical Graphs Procedures by Example: Effective
    Graphs Using SAS®. Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA.
    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
