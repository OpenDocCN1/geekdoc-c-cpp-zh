- img_proc: true
  md: '# 7.4 Horizontal Bar Charts


    The HBAR plot shows the summarization of the response variable by category or
    the frequency count of the category. The syntax is:


    ```

    hbar column <options>;

    ```


    By default, the data is summarized for each unique category value; user-defined
    formats can be used to create categorical ranges for summarization. One bar is
    drawn for each resulting category. If a group variable is specified, this bar
    can be subdivided by each group value, or the bar can be drawn as a cluster of
    smaller group bars (the GROUPDISPLAY option).


    ![](img/0c09161c0be53934e5708cffbdcc441f_203_0.png)


    # Required Data Roles:


    | CATEGORY | column | Category variable. |


    # Optional Data Roles:


    | FREQ =num-column | Frequency count for each observation |

    | GROUP =column | Group variable for each observation |

    | RESPONSE =num-column | Response values for the chart |


    # Appearance Options:


    | FILLATTARS =fill-attr | Appearance attributes for fill |


    # Other Options:


    | BARWIDTH =value | Width of bar a fraction of tick spacing |

    | DATASKIN =keyword | Quasi-3d effect for the bars (GLOSS, etc.) |

    | GROUPDISPLAY =keyword | STACK | CLUSTER |


    # Boolean Options:


    | FILL |NOFILL | Controls fill |

    | OUTLINE |NOUTLINE | Controls bar outline |


    Standard count options are supported


    Related Style Elements: The GraphDefault style element is used to draw the plot
    elements. When a GROUP variable is present, or when multiple plot statements are
    overlaid, the Graph1-GraphData12 elements are used, one for each group or plot
    statement.'
