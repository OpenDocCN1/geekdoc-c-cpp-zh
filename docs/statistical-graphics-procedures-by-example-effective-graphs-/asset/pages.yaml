  md: '# Figure 3.2.13: Grouped Series Plot


    This graph shows a plot of closing stock price by month for three companies.


    Patterned lines are hard to follow when the data fluctuates rapidly. This is a
    case where a color style would be more effective.


    ANTIALIASMAX is set to 1000 to prevent disabling of antialasing for a large number
    of observations.


    ![](img/0c09161c0be53934e5708cffbdcc441f_56_0.png)


    ```

    ods graphics / antialiasmax=1000;

    title ''Stock Plot by Company'';

    proc sgplot data=sashelp.stocks;

    series x=date y=close/group=stock;

    keylegend/location=outside across=3;

    axis grid display=(nolabel);

    axis grid;

    run;

    ```


    # Figure 3.2.14: Multi-Response Series


    This graph shows the efficacy of medication over time for different treatment
    groups using multiple series plots. Each plot is labeled directly, making a legend
    unnecessary.


    The procedure automatically assigns visual attributes to each plot. By default,
    the axis displays the year value when needed.


    ![](img/0c09161c0be53934e5708cffbdcc441f_56_1.png)


    ```

    title ''Efficacy Over Time by Treatment Group'';

    proc sgplot data=sasbook.series noatelend;

    series x=date y=a lineattype=(thickness=2) label=''Drug A'';

    series x=date y=b lineattype=(thickness=2) label=''Drug B'';

    series x=date y=c lineattype=(thickness=2) label=''Drug C'';

    axis grid display=(nolabel);

    yaxis y min=0 max=15 integer grid label1=''Efficacy'';

    run;

    ```'
