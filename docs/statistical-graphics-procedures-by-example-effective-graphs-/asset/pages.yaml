    # 2.3 SGPANE Procedure


    The SGPANE procedure extends the features of the SGPLOT procedure to a classification

    panel, using one or more classification variables. The examples shown earlier
    in Figure 1.12

    and Figure 1.13 are classification panels created using the SGPANE procedure.


    The syntax for the SGPANE procedure is as follows:


    ```

    1. PROC SGPAN DATA=data-set < options >;

    2. PANELB classvar < classvar2 < classvarN > / options >;

    3. < plot-statement (s) >;

    4. < refine-statement (s) >;

    < inset-statement (s) >;

    < axis-statement (s) >;

    < keylegend-statement (s) >;

    RUN;

    ```


    +   1. The procedure statement supports multiple options that will be demonstrated
    in the

    examples shown in later chapters.

    2. The PANELB statement is required and must be placed before of any of the plot,
    refine,

    inset, axis, or legend statements. This statement is used to set the layout type
    and other

    options that control the overall paneling of the cells.'
