- img_proc: true
  md: '# 14.4 Using Style Elements


    If you customize and use your own style, this new style is used for all procedure
    output to the ODS destination, until the destination is closed, or the style is
    changed again. Often you do not want to change the style setting of a destination,
    but only want to make a specific change for one graph.


    For example, the default font size for the x-axis tick values may be a little
    too big to fit the space available. Shrinking the font just will do fine. One
    way to do this would be to change the size of the currently used font:


    ```

    xaxis valueattrs=(size=7);

    ```


    You will likely have seen such syntax in many places in the examples. This works
    fine, but in others you want to set the visual properties of one plot to the same
    as another item in the graph. You can use the Data Label for the Axis Tick Values
    as follows:


    ```

    xaxis valueattrs=GraphDataText;

    ```


    This technique is especially useful when using color output. If you have two separate
    measures plotted on one graph, to the y-axis and to the Y2 axis, can be useful
    to set the color of the axis tick values to the same color as the plot line. You
    can do that as follows:


    ```

    yaxis valueattrs=GraphData1;

    yaxis valueattrs=GraphData2;

    ```


    # 14.5 Element Usage Precedence


    When you use a style, hard-coded colors are not recommended. This is because the
    value specified on the plot option wins over the visual attributes derived from
    the ODS style. You may set the color of a line to "Black" because the wall color
    of the current style is white. But if the same graph runs with a style that has
    a dark color, "Black" will blend into the white color, resulting in a bad color
    choice for the graph.


    The precedence for usage of visual attributes is:


    +   1. The first procedure derives the visual attributes from Active style.

    2. This is replaced by attributes from Discrete Attribute Map (if applicable).

    3. This is replaced by visual attributes on the statement option.


    For the reason above, and to ensure your graph works well for all cases, it is
    recommended you always use "relative style" settings. If you do not use a color
    in the graph, try one of the other colors defined in the style. Hard-coded colors
    are best for one-off graphs that are likely to be used with different style settings
    (see Figure 13.6).'
  merge: -1
  pgno: 336
