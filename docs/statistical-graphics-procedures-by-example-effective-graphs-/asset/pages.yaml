  md: '# Figure 7.3.1: Bar Chart with Fill Attributes and Data Skins


    This basic bar chart has been enhanced by specifying a particular color for the
    bar fill. In addition, the DATASKIN option is used to give the bars a modern,
    three-dimensional appearance while maintaining the visual accuracy of a two-dimensional
    bar chart. See the documentation for the different skins.


    ![](img/0c09161c0be53934e5708cffbdcc441f_196_0.png)


    ```

    title "Product Sales";

    proc sgplot data=sgbook.product_sales;

    vbar product / response=actual fillattrs=(color=grayee)

    dataskn=pressed;

    run;

    ```


    # Figure 7.3.2: Bar Chart with No Fill


    This example uses the NOFILL option to create a "minimal ink" appearance that
    reproduces well in black and white publications.


    There is also a NOOUT option to remove the bar outlines when you only want the
    fill color.


    ![](img/0c09161c0be53934e5708cffbdcc441f_196_1.png)


    ```

    title "Product Sales";

    proc sgplot data=sgbook.product_sales;

    vbar product / response=actual nofill;

    run;

    ```'
  merge: -1
