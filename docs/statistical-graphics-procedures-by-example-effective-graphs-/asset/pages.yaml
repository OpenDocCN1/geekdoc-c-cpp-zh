- img_proc: true
  md: "# Figure 4.6.5: Grouped Series Plot with Markers\n\nIn this graph we have displayed\
    \ only some of the markers. This is done using an overlaid scatter plot with the\
    \ FREQ option. With this option, a marker is plotted only when the value of the\
    \ FREQ variable is > 0.\n\nWe did this instead of using markers on the series\
    \ plot as that would display a marker at each point on the line.\n\n```\nproc\
    \ sgplot data=datasbook.seriesogroup noautlegend;\n  series x=date / group=drug\n\
    \  lineattrs=(thickness=2) curvelabel;\n  scatter x=date / group=drug marker=freq\
    \ markerattrs=(size=5);\n  yaxis min=0 label=1 integer grid label='Efficacy';\n\
    run;\n```\n\n![](img/0c09161c0be53934e5708cffbdcc441f_93_0.png)\n\n# Figure 4.6.6:\
    \ Series Plot with Data Labels\n\nIn this graph, only some data labels are displayed\
    \ using an overlaid scatter plot. We could display data labels using the DATABEL\
    \ option of the series plot. However, that would display a label for every observation,\
    \ clutter them.\n\nOn the scatter plot, we use Y=Label which has non-missing values\
    \ for every 50th obs, thus reducing the markers and labels.\n\n```\nproc sgplot\
    \ data=datasbook.series noautlegend;\n  series x=date y / lineattrs=(thickness=2)\
    \ databel=labelA;\n  scatter x=date y=labelA / markerattrs=(size=5);\n  yaxis\
    \ display=(nolabel) min=0 max=15 integer grid label='Efficacy';\nrun;\n```\n\n\
    ![](img/0c09161c0be53934e5708cffbdcc441f_93_1.png)"
  merge: -1
  pgno: 93
- img_proc: true
  md: "# Figure 4.6.7: Series Plot with Breaks\n\nIn this graph, some values of the\
    \ response variable are missing. By default, the series plot would be drawn with\
    \ a straight line over the missing data.\n\nUsing the BREAK option causes the\
    \ series plot to be drawn with a break at the missing data.\n\n![](img/0c09161c0be53934e5708cffbdcc441f_94_0.png)\n\
    \ntitle 'Response over Time with break*;\n\n```\nproc sgplot data=sasbook.seriesBreak;\n\
    \ series x=date / lineattrs=(thickness=2) break;\n xaxis display=(nolabel);\n\
    yaxis min=0 max=15 grid label='Efficacy';\n run;\n```\n\n# Figure 4.6.8: Series\
    \ Plot Overlay with Discrete Offset\n\nThis graph overlays three series of sales\
    \ by quarter on a discrete x-axis. The DISCRETEOFFSET option is set for each curve\
    \ to create a horizontal separation between the curves.\n\n![](img/0c09161c0be53934e5708cffbdcc441f_94_1.png)\n\
    \ntitle 'Sales by Quarter*;\n\n```\nproc sgplot data=sasbook.seriesDiscrete;\n\
    \ series x=sales / discreteoffset=0.2;\n series x=yalesb / discreteoffset=0.0;\n\
    \ series x=yalesc / discreteoffset=0.2;\n xaxis grid display=(nolabel) offsetmin=0.1\
    \ offsetmax=0.1;\nyaxis grid label='Sales';\n keylegend / title='Drug: *';\n run;\n\
    ```\n\n9.3\n\nMatange, Sanjay and Heath, Dan. Statistical Procedures by Example:\
    \ Effective Graphs Using SAS®. Copyright © 2011, SAS Institute Inc., Cary, North\
    \ Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.\n\
    \n*"
