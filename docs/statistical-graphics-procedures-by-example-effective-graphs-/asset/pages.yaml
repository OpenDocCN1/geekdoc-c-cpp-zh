    The ROWAXIS and COLAXIS statements are used to customize the row and column axes.


    The PANELBY statement must provide one or more class variables. The procedure
    automatically subdivides the graph region into multiple cells based on all crossings
    of the unique values of the class variables. In Figure 2.10, we have specified
    class variables "Origin" and "Type", each having two unique values. Hence, we
    get a graph with four cells, as shown in Figure 2.11. Each cell has two headers.


    Each cell in the graph is populated with the same set of plot statements as specified
    in the procedure syntax. In this case, each cell gets a HISTOGRAM and a DENSITY
    plot.'
