- img_proc: true
  md: '# Chapter 11: Comparative and Matrix Plots


    In this chapter, we continue our journey through the world of multi-cell graphs.
    However, instead of creating graphs classified by one or more class variables,
    we will look into grids of plots that provide quick comparative views of the data.


    # 11.1 Introduction


    Comparative and matrix graphs primarily consist of scatter plots of multiple response
    variables or measures in the data set. These graphs are especially valuable for
    understanding the raw data received from the field. Often the analyst would like
    to get a feel for the data and find relationships between a data set using “visual”
    means. This can be a valuable tool in the pre-analysis phase of the project.


    The SGATTER procedure is specifically designed for the creation of scatter plots
    in the form of comparative or matrix graphs. Now, you can certainly use the SGATTER
    procedure to create the single-cell scatter plot with fit curves and confidence
    bands. However, you will be better off using the SGPLOT procedure to create the
    single-cell graph as seen in the many previous chapters. The SGATTER procedure
    is better suited for creation of grids of scatter plots with a few fit and confidence
    plots.


    # 11.2 SGATTER Procedure


    This procedure is very different from the SGPLOT and SGPANEL procedures. The syntax
    for this procedure is much more like the GPLOT procedure and is as follows:


    ```

    proc sgcatter <options>;nplot or compare or matrix statement;

    run;

    ```


    | DATA =sas-data-set Optional data set |

    | DESCRIPTION =string Description string |

    | DATTRMAP =sas-data-set Data defining an attribute map |

    | PAD =value Padding around the outside of the graph |

    | SGANNO =sas-data-set Data set containing the annotations |

    | TMPLOUT =string File name for generated graph template code |


    The SGATTER procedure supports the following three independent statements:


    +   * PLOT–Creates multi-plot panels

    * COMPARE–Creates comparative panels

    * MATRIX–Creates square scatter plot matrices'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# 11.3 PLOT Statement


    The PLOT statement creates regular grids of scatter plots based on the "plot request".
    The syntax for this statement is as follows:


    ```

    plot plot-request < options>

    ```


    Plot request is in one of the forms listed below. A regular grid of scatter plots
    is created based on the plot request:


    +   * y * : creates a single scatter plot.

    * y1 * x1 y2 * x2 : creates a graph with two scatter plots as defined.

    * (y1 y2) * x : creates a graph with two separate plots y1 * x and y2 * x.

    * y * (x1 x2) : creates a graph with two separate plots y * x1 and y * x2.

    * (y1 y2) (x1 x2) : creates a graph with four scatter plots.


    # Required Plot Request:


    | Plot Request | y * x or (y1 y2) * x or (x1 x2) or (y1 y2) * (x1 x2) |

    |---|---||

    | ATTRID | =variable | Associated Attr Map for visual attributes |

    | COLUMNS | =value | Number of columns in panel |

    | DATABEL | =variable | Variable for labeling scatter points |

    | ELLIPSE | <=options> | Fit a confidence ellipse to the data |

    | GROUP | = value | Grouping variable |

    | JOIN | <=options> | Connect the data points |

    | LEGEND | =(options) | Controls legend characteristics |

    | LOESS | =(options) | Fit a curve to the data |

    | MARKERATTRS | =marker-attr | Specify marker attributes |

    | PBSLINE | =(options) | Fit a penalized B-Spline to the data |

    | REG | =(options) | Fit a regression line to the data |

    | ROWS | =value | Number of rows in panel |

    | SPACING | =value | Spacing between rows and columns |

    | TRANSPARENCY | =value | Transparency value |

    | UNISECAL | =keyword | Uniform scaling for X / Y / ALL. Default is NONE |


    # Boolean Options:


    | | |

    |---|---|

    | GRID | Display borders |

    | NOLEGEND | Suppress display of legend |

    | REFTICK | Display reference tick marks |'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Figure 11.3.1: Basic Scatter Plots


    This is a basic two-cell scatter plot of height by weight and cholesterol at start.
    Each plot is specified as a separate request.


    Each cell has its own set of axes with independent data ranges.


    ![](img/0c09161c0be53934e5708cffbdcc441f_283_0.png)


    ```

    title "Blood Pressure by Age";

    proc sgscatter data=sashelp.heart;

    plot height*cholesterol*agestart;

    ```


    # Figure 11.3.2: Scatter Plots with Attributes


    This is the same graph as shown in 11.3.1 with the addition of marker attributes
    and transparency.


    The high transparency allows us to see where the observations are clustered.


    ![](img/0c09161c0be53934e5708cffbdcc441f_283_1.png)


    ```

    title "Blood Pressure by Age";

    proc sgscatter data=sashelp.heart;

    plot height*cholesterol*agestart/

    markerattrs=(symbol=circlefilled) transparency=0.96;

    run;

    ```


