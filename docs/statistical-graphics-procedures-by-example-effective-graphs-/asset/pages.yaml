  md: "# 3.4 Comparative and Matrix Graphs\n\nFigure 3.4.1: Comparative Scatter Plot\n\
    \nThis is a grid of scatter plots comparing systolic and diastolic blood pressure\
    \ by cholesterol and weight.\n\nThe graph uses common external axes, so the data\
    \ is uniform across rows and columns.\n\n![](img/0c09161c0be53934e5708cffbdcc441f_69_0.png)\n\
    \n```\ntitle 'Comparative Graph';\nproc sgscatter data=sashelp.heart;\nwhere ageatstart\
    \ > 58;\ncompare x=(cholesterol weight) y=(diastolic systolic) /\ntransparency=0.8\
    \ markerattrs=(symbol=circlefilled);\nrun;\n```\n\nFigure 3.4.2: Scatter Plot\
    \ Matrix\n\nThis is a scatter plot matrix, showing the association between variables\
    \ for patients over the age of 58.\n\nTransparency can be used to see the distribution\
    \ of the data. The diagonals display the distribution of each variable by itself.\n\
    \n![](img/0c09161c0be53934e5708cffbdcc441f_69_1.png)\n\n```\ntitle 'Variable Association';\n\
    proc sgscatter data=sashelp.heart;\nlabel weight='weight' cholesterol='Cholstrl'\n\
    diastolic='Diastolic' systolic='Systolic';\nwhere ageatstart > 58;\nmatrix cholesterol\
    \ diastolic systolic weight / diagonal=(histogram)\ntransparency=0.8 markerattrs=(symbol=circlefilled);\n\
    run;\n```\n\n* Matange, Sanjay and Heath, Dan. Statistical Procedures by Example:\
