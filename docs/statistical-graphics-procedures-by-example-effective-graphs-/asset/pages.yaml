  md: "# 12.4 Survival Plot\n\nThis graph shows the survival estimates for multiple\
    \ groups of patients by severity of disease. The data is obtained using the \"\
    ods output\" from the \"SurvivalPlot\" object of Sample 49.2.1 of the LIFETEST\
    \ procedure as shown below. The key features of the graph are:\n\n+   * Plot curves\
    \ on the X-Y axis (numeric), restricted to the upper 75% of the Y axis.\n* Plot\
    \ at risk data on the X-Y2 axis (character), restricted to the lower of the Y2\
    \ axis.\n* Survival curves are labeled using curve labels for clarity. Legend\
    \ words for color style.\n\n| Obs Time AtRisk Event Censored ITRisk Stratum Risk\
    \ StratumNum |\n|---|---|---|---|---|---|---||\n| 1 | 0 | 1.00000 | 38 | 0 | 1:\
    \ ALL | | 1 |\n| 2 | 0 | | 38 | 0 | 1: ALL | | 1 |\n\n![](img/0c09161c0be53934e5708cffbdcc441f_302_0.png)\n\
    \n```\nods survivalplot=sgbook.SurvivalPlot49_2;\nproc LIFETEST data=test plots=survival(atrisk=0\
    \ to 2500);\n  title Status=;\n  strata Group / testagroup adjust=id; run;\n \
    \ proc format; value a1 1=\"Low\" 2=\"High\"; run;\n\ntitle1 \"Product-Limit Survival\
    \ Estimates\";\ntitle2 hp=\"With Number of AML Subjects at Risk\";\nproc sgplot\
    \ data=sgbook.SurvivalPlot49_2;\n  stratum stratum=all;\n  step y=censored / group=stratum\
    \ curve lineattrs=(pattern=solid);\n  scatter x=atrisk markerattrs=(symbol=plus)\
    \ name=\"censored\";\n  scatter x=atrisk y=stratum markerattrs(marker=xcross)\
    \ group=stratum;\n  keylegend \"censored\" location=positiontopright;\n  refine\
    \ 0;\n  yaxis offsetmin=0,2;\n  yaxis offsetmax=0.83 display=(nolabel ticks) valueatrs=(size=8);\n\
    \  run;\n```"
