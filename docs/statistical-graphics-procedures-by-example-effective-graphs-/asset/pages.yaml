- img_proc: true
  md: 'A graph with a panel layout has the following features:


    +   - Each cell has N cell headers, one for each class variable, displaying the
    value for each cell.

    - By default, only the cells that have data are displayed. Cells without any data
    are dropped from the graph. An option can be used to display all cells.

    - The procedure automatically decides the number of rows and columns for the grid.
    When a graph has many cells, the procedure will automatically break up the graph
    into multiple ''pages'', to prevent the cells from getting too small.

    - Options are available to allow the user to control the ''paging'' of the graph.


    # 2.3.2 Lattice


    This layout requires two class variables. The first class variable is treated
    as the Column variable, and the second as the Row variable. See Figure 2.13.


    +   - Each unique value of the Column variable creates a column in the grid.

    - Each unique value of the Row variable creates a row in the grid.

    - Each cell gets a column header, by default at the top.

    - Each row gets a row header, by default on the right.

    - Common row and column axes are used.

    - Every crossing of the unique values of the column and row variables is displayed
    as a cell, regardless of whether it has data or not.


    | Vehicle Mileage |

    |---|---|

    | Asia | USA |

    | Sedan | |

    | Sports | |

    | 10 20 30 40 10 20 30 40 |


