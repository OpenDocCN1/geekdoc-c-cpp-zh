  md: '# 4.16 Waterfall Chart (9.3)


    The WATERFALL statement has the following syntax:


    ```

    waterfall category=column response=column <options/>

    ```


    The waterfall chart draws segments positioned relative to the cumulative sum of
    the preceding observations. The response value for each observation is expected
    to be a delta that is accumulated along the axis. The initial value for the accumulation
    can be specified. The final bar value is computed from data.


    ![](img/0c09161c0be53934e5708cffbdcc441f_129_0.png)


    # Required Data Roles:


    | CATEGORY | Position along the horizontal axis |

    |---|---||

    | RESPONSE | num-column | Delta for bar along the vertical axis |


    # Optional Data Roles:


    | COLORGROUP | Classification for bar color |

    |---|---|

    | DATABEL | =column | Label string for each observation |

    | URL | =column | URL for each observation |


    # Appearance Options:


    | DATABELATTRS | =text-attrs | Appearance attributes of the labels |

    |---|---|

    | FILLATATTRS | =fill-attrs | Appearance attributes of bubble interior |

    | FINALBARATTRS | =line-attrs | Appearance attributes for bubble outline |

    | INITIBARATTRS | =line-attrs | Appearance attributes for bubble outline |


    # Other Options:


    | BARWIDTH | =value | Radius in pixels of the largest bubble |

    |---|---|---|

    | DATASKIN | =string-value | One of the predefined types |

    | FINALBARVALUE | =string | String for labeling final bar on axis |

    | INITIALBARVALUE | =string | String for labeling initial bar on axis |

    | INITIALBARVALUE | =value | Response value for initial bar |

    | STAT | =keyword | MEAN | SUM |


    # Boolean Options:


    | FILL | =NOFILL | Display filled bar or not |

    |---|---|---|

    | OUTLINE | =NOLINE | Display bar outline or not |

    | MISSING | | Show missing category values |


    Standard common options are supported


    ATTRID, LEGENDLABEL, NAME, NOMISSINGGROUP, TRANSPARENCY, URL, X2AXIS, Y2AXIS


    Related Style Elements: The GraphDefault style element is used to draw the plot
    elements.


    When a group variable is present, the GraphData1-GraphData12 elements are used,
    one for each group.'
  merge: -1
