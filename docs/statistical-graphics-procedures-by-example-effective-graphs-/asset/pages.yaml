  md: '# Chapter 7: Categorization Plots


    In this chapter, we examine the categorization plots for SGPLOT and SGPanel procedures.
    The unique feature of this class of plots is that the data is summarized by using
    a specified or default statistic. The basic syntax for each plot and the options
    will be covered in detail in this chapter. Plots within this group can be overlaid
    with another plot in this group of the same orientation.


    #  7.1 Introduction


    SGPLOT and SGPanel procedures support the categorization plots listed below. Each
    of these plots support sum, mean, and frequency statistics. In addition, these
    plots support limit calculations for mean statistics (CLM), standard error (STDERR),
    and standard deviation (STDDEV). The confidence of the CLM statistic can be adjusted
    using the ALPHA option, and the number of STDERRs or STDDEVs can be specified
    using the NUMSTD5 option.


    These plots cannot be used to draw pre-calculated limits. To draw custom limits
    on a bar chart, you should use VBARMARK or HBARMARK plot (see Figure 4.11.1).
    For line charts, use a SERIES plot overlaid with a SCATTER plot (see Figure 4.6.10).
    For dot plot, simply use a scatter plot (see Figure 4.4.7).


    | VBAR VLINE | HBAR HLINE | DOT |

    |---|---|---|


    ![](img/0c09161c0be53934e5708cffbdcc441f_193_0.png)


    Matange, Sanjay and Heath, Dan. Statistical Procedures by Example: Effective Graphs
    Using SAS®. Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL
    RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# 7.2 Categorization Plot Rules and Common Options


    All of the categorization plot statements have the following syntax:


    ```

    CategorizationPlotName required-data-roles <options>;

    ```


    All plot statements have required and optional parameters necessary to create
    the visual. Here is a list of common options for categorization plots:


    Common Options:


    | | | |

    |---|---||

    | ALPHA | =value | Confidence level of CLM statistic |

    | ATTRID | | The attribute map used for the group variable |

    | CATEGORYORDER | =keyword | RESPASC | RESDESC |

    | CLUSTERWIDTH | =number | Cluster width as a ratio of midpoint spacing |

    | DATABEL | =column | Display a scatter label for the Y variable or from an optional
    variable |

    | DATABELATTRS | =flex-attr | Appearance attributes for DataLabel Amount to offset
    all primitives from the category midpoints |

    | DISCRETEOFFSET | =number | DATA | ASCENDING | DESCENDING |

    | GROUPORDER | =keyword | The label that appears in the legend to represent this
    (non-group) plot |

    | LEGENDLABEL | =line-attr | Appearance attributes for the limits |

    | LIMITATTRS | | BOTH | UPPER | LOWER |

    | LIMITSTAT | =keyword | CLM/STDDEV | STDERR |

    | NAME | =string | Specifies a name for this statement, such as a KEYLEGEND, can
    refer to a plot by its name |

    | NUMSTD | =positive-integer | Number of standard units to compute STAT =keyword
    FREQ | MEAN | SUM |

    | TRANSPARENC | =value | Specifies the transparency for the visual elements |

    | URL | =string-column | Contains URLs for drilldown |

    | WEIGHT | =num-column | Used to weight observations |


    Common Boolean Options:


    | | |

    |---|--|

    | MISSING | Show missing category values |

    | NOSTATABEL | Suppress statistic on the axis label |'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# 7.3 Vertical Bar Charts


    The VBAR plot shows the summarization of the response variable by category or
    the frequency count of the category. The syntax is:


    ```

    vbar column <options>; for each unique category value; however, user-defined formats
    can be used to create categorical ranges for summarization. One bar is drawn for
    each resulting category. If a group is specified, this bar can be subdivided by
    each group value, or the bar can be drawn as a cluster of smaller bars (see the
    GROUPDISPLAY option).

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_195_0.png)


    Required Data Roles:


    | CATEGORY | column | Category variable |


    Optional Data Roles:


    | FREQ | =num-column | Frequency count for each observation |

    | GROUP | =column | Group variable for each observation |

    | RESPONSE | =num-column | Response values for the chart |


    Appearance Options:


    | FILLATTRS | =fill-attrs | Appearance attributes for Fill |


    Other Options:


    | BARWIDTH | =value | Width of bar a fraction of tick spacing |

    | DATALABELPOS | =keyword | DATA | TOP | BOTTOM |

    | DATASKIN | =keyword | Quasi-3-D effect for the bars (GLOSS, etc.) |

    | GROUPDISPLAY | =keyword | STACK | CLUSTER |


    Boolean Options:


    | FILL | NOFILL | Controls bar fill |

    | OUTLINE | NOUTLINE | Controls outline |


    Standard common options are supported


    Related Style Elements: The GraphData style element is used to draw the plot elements.
    When a GROUP variable is present, or when multiple plot statements are overlaid,
    GraphData1-GraphData12 elements are used, one for each group or plot statement.


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS®. Copyright 2011, SAS Institute Inc., Cary, North Carolina, USA.
    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
