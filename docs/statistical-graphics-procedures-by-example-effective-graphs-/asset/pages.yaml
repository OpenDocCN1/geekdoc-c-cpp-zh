- img_proc: true
  md: '# Figure 9.1.11: Images as Curve Labels


    In this example, an image is used to label each curve instead of a text label.
    All images are positioned just outside of the x-axis data area. The Y position
    of the images comes from the Y value of the plot points at the year 2000. The
    ability to position images in data space also opens the possibility of using images
    as plot points. Note that annotations do not reserve space; therefore, you must
    provide an axis offset enough to contain the images within the wall area.


    In addition to the image labels, the company logo and the footnote text are also
    annotated. The text is annotated because the text from a FOOTNOTE statement would
    have been raised up with plot when adding padding for the company logo.


    ![](img/0c09161c0be53934e5708cffbdcc441f_257_0.png)


    Matange, Sanjay and Heath, Dan. Statistical Graphics Procedures by Example: Effective
    Graphs Using SAS(). Copyright 2011, SAS Institute Inc., Cary, North Carolina,
    USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
