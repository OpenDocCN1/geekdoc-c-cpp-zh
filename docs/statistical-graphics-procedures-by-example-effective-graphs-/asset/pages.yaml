  md: '# 12.21 Creating a 2 x 2 Cell Graph Using PROC GPLOT


    Previously, we have used either X-X2 or Y-Y split to create two-cell graphs. Here
    we take the next step and use the X-X2 and Y-Y split technique together to create
    a four-cell (2 x 2) graph using the SGPLOT procedure. Important features of the
    graph are as follows:


    +   - X and Y axes are restricted to the lower 75% of the space (OffsetMax=0.25).

    - X2 and Y2 axes are restricted to the upper 15% of the space (OffsetMin=0.85).

    - Each graph is drawn using the appropriate combinations of X, Y, X2, and Y2 axes.

    - Reference lines are used to demarcate the cells.


    ![](img/0c09161c0be53934e5708cffbdcc441f_319_0.png)


    title "Patient Profile":

    proc sgplot data systolic=weight / group=sex,heart3 noceattrs=0.8 name="scat";

    reg systolic=weight / cl degrees=0.95 markers;

    nhigh deasystolic=weight / highmap=yaxis transparency=0.4;

    scatter deasystolic=weight / xaxis valueattrs=(symbol=diamondfilled)

    names="bp" label="BP";

    high x=sex=mean / highmap=yaxis group=sex type=bar

    transparency=0.4;

    scatter y=mean / xset=xset group=sex type=bar

    scatter sex=systatolic / x2=x2 group=sex;

    refine "Female" / discreteoff=0.5 axis=x2 lineattrs=(thickness=2);

    refine "Cancer" / discreteoff=0.5 axis=y2 lineattrs=(thickness=2);

    yaxis offsetmin=0.5 offsetmax=0.25 label="Systolic BP";

    xais offsetmin=0.85 offsetmax=0.95 grid valueattrs=(size=7);

    yaxis offsetmin=0.5 offsetmax=0.25 grid label="weight";

    y2 offsetmin=0.85 offsetmax=0.03 display=(nolabel) grid valueattrs=(size=7);

    legend "scat" "bp";

    run;


