  md: '# 5.6 Ellipse Plot


    The Ellipse plot shows a confidence ellipse of the raw data. The syntax is:

    `ellipse x=column y=column <options>`;


    A marker is displayed at each (x, y) location. An ellipse is computed and displayed.


    # Required Data Roles:


    | X | =num-column | Position along the horizontal axis |

    | Y | =num-column | Position along the vertical axis |


    # Optional Data Roles:


    | FRE | =num-column | Frequency of the current observation |


    # Appearance Options:


    | ALPHA | =positive-number | Confidence level to compute |

    | FILLATTRS | =fill-attrs | Attributes for the ellipse fill |

    | LINEATTRS | =line-attrs | Attributes for the ellipse outline |

    | TYPE | =keyword | Type of the confidence ellipse PREDICTED | MEAN |


    # Boolean Options:


    | CLIP | Exclude the ellipse from the axis data range calculation |

    | FILL / NOFILL | Enable/Disable display of a fill color in the ellipse |

    | OUTLINE/NOOUTLINE | Enable/Disable display of an outline over the ellipse |


    Standard options are supported by fits


    | LEGENDLABEL, NAME, TRANSPARENCY, X2AXIS, Y2AXIS |


    Related Style Elements: The GraphData style element is used to draw the plot elements.
    When a GROUP variable is present, or when multiple plot statements are overlaid,
    the GraphData1-GraphData12 elements are used, for each group or plot statement.


    ![](img/0c09161c0be53934e5708cffbdcc441f_164_0.png)'
