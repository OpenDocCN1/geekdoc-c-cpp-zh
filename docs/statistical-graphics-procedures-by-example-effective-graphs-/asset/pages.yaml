  md: '# ## 4.10 Vector Plot


    The vector plot draws directional vectors. The syntax is:


    ```

    vector x=column y=column < / options>;

    ```


    A vector is drawn to each observation from the origin (0.0) by default. The origin
    may be set using the XORIGIN and YORIGIN roles that can have data columns or constants.


    ![](img/0c09161c0be53934e5708cffbdcc441f_109_0.png)


    # ### Required Data Roles:


    | X | =num-column | Position of arrow head along the x-axis |

    | Y | =num-column | Position of arrow tail along the y-axis |


    # ### Optional Data Roles:


    | DATABEL | =-column | Label string for each vector |

    | GROUP | =column | Classification variable |

    | XORIGIN | =num-column | value | Position of arrow tail along the x-axis |

    | YORIGIN | =num-column | value | Position of arrow tail along the y-axis |


    # ### Appearance Options:


    | DATABELATTRS | =text-attrs | Appearance attributes for data labels |

    | LINEATTRS | =line-attrs | Appearance attributes for lines |


    # ### Other Options:


    | ARROWHEADDIRECTION | =keyword OUT IN | BOTH |

    | ARROWHEADSHAPE | =keyword OPEN | CLOSED | FILLED | BARBED |


    # ### Boolean Options:


    | DATABEL | Display curve labels from group role |

    | NOARROWHEADS | Suppress display of arrow heads |


    # ### Standard common options are supported


    ATTRID, LEGENDLABEL, NAME, MISSINGGROUP, TRANSPARENCY, X2AXIS, Y2AXIS


    Related Style Elements: The GraphData style element is used to draw the plots.
    When a GROUP variable is present, or when multiple statements are overlaid, the
    Graph1-GraphData12 elements are used, one for each group or plot statement.'
