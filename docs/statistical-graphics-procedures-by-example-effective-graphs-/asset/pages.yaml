  md: '# Figure 7.3.9: Bar Chart with Stacked Groups


    The GROUP option is used to specify an additional level of classification in a
    bar chart. By default, the group values are represented as stacked bar segments.
    The data labels can be displayed above or over the chart.


    The grouped bar attributes can be modified by using an attribute (see Chapter
    9) or by modifying an ODS style.


    ![](img/0c09161c0be53934e5708cffbdcc441f_200_0.png)


    ```

    title "Product Sales";

    proc sgplot data=sgbook.product_sales;

    yaxis xaxis label="Sales (in millions)"

    vbar product / response=actual group=region databel

    dataLabelpos=top;

    run;

    ```


    9.3


