    # Figure 6.2.4: Histogram with BINSTART AND BINWIDTH


    For this histogram the BINSTART=0 and the BINWIDTH=20. Bins are created starting
    from zero with a width of 20 until the max value is crossed.


    Default scale for y-axis is percent. The x-axis label is suppressed. Transparency
    is to 40%.


    ```

    *distribution of Horsepower*:

    proc sgplot data=sashelpcars;

    histogram horsepower / binstart=0 binwidth=20 transparency=0.4;

    yaxis grid;

    xaxis display=(nolabel1);

    run;

    ```'
