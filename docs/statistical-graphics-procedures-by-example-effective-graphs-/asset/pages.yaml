  md: '# # Chapter 4: Basic Plots


    In this chapter, we examine the basic plots for SGPLOT and SGPanel procedures.
    These plots have an extensive set of options that will be covered in detail in
    this chapter. Plots within this group can be mixed and matched with each other
    in a myriad of ways to build complex graphs as shown in Figure 3.2.5.


    # ## 4.1 Introduction


    Basic plots used in both SGPLOT and SGPanel procedure are the workhorse plots
    for visualization of raw data, or of summary statistics that have been computed
    prior to creation of the graph. These plots do not process the data in any way,
    but they plot the raw data values in the graph. The plots included in this group
    are:


    +   * SCATTER

    * NEEDLE

    * BUBBLE

    * WATERFALL

    * SERIES

    * VECTOR

    * HIGHL

    * STEP

    * VBARPARM

    * REFLINE

    * BAND

    * HBARPARM

