  md: '# # Preface


    As we looked with anticipation to the first release of the Statistical Graphics
    Procedures in SAS 9.2, it became evident that these procedures truly represented
    a new way of creating analytical graphs. We started thinking about the best ways
    to communicate the features and capabilities of these new procedures. While we
    discussed different approaches, we found ourselves receiving a lot of questions
    from users about the procedures. Our answer to these was to present them in the
    form of examples. As we created more examples in areas such as clinical safety,
    pharmaceuticals, health care, and finance, we soon realized that the best way
    to communicate the features of these procedures was through such examples.


    The question we got from users was simply, "How do I make this graph?" The best
    way for us to answer that question was to show the code needed to create it. If
    a book could answer that question, what would it look like? Why not create a book
    that starts from the end result and backward to what is needed to create the graph?
    That led to the idea of writing this book.


    The primary audience for this book is the SAS user who wants to visualize data
    or create a graph from a custom analysis. Often, you already have a mental image
    of the graph you want to create; you just need to find the correct syntax. Product
    documentation and books on the topic take a procedure-centric approach and describe
    the features one at a time; figuring out what is needed to create a graph from
    such resources requires a solid understanding of the procedures to obtain the
    right results. It would be much easier if you start with the graph and show you
    the code instead.


    This book addresses this situation by examples to document the procedure options.
    Users can look through the large number of graphs and find the type of graph they
    want to create. Each of the examples includes the code needed to generate the
    graph, along with a brief comment on key features of the graph.


    The reason why this approach works well for the SG procedures is because these
    procedures take a building-block approach. You start with the basic plot, and
    simply add the features you need one at a time. The procedures support a wide
    array of plots, so the combinations possibilities grow rapidly. For example, if
    you know how to build a simple series plot, then creating a plot with three series
    plots becomes straightforward. You simply add two more series statements, and
    the procedure automatically does the work. The same principle also applies to
    combinations of disparate, but compatible, plot types, such as a bar chart and
    a line graph.


    The book also describes, by example, other important features of the procedures
    such as axes, inserts and legends. For example, you can create a sample graph
    with a linear axis, and change it to log. You can also create a custom axis displaying
    only the values you want, add inserts and customize the legends.


    For an overview of the organization of this book, see section 1.5.'
