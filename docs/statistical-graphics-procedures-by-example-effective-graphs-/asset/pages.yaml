  md: '# Figure 5.4.9: Grouped Fits


    When a GROUP column is specified on a LOESS statement, then the scatter points
    and the fit lines are grouped.


    Two statements are used to control the transparency of the markers. The NOMARKERS
    on the LOESS statement is used to disable the default scatter points.


    ![](img/0c09161c0be53934e5708cffbdcc441f_155_0.png)


    ```

    title "The Impact of Horsepower on MPG";

    proc sgplot data=help.cars;


    where types="Sedan" and drivetrain="AII";

    scatter x=horsepower y=mpg_city / group=Drivetrain transparency=0.8;

    loess x=horsepower y=mpg_city / group=Drivetrain smooth=0.4;

    nomarkers name="loess"

    legend keylegend="loess" location=inside across=1 title="Drivetrain"

    yaxis;

    run;

    ```


    # Figure 5.4.10: Single Fit with a Group


    To create a single fit through all your grouped scatter data, use a SCATTER statement
    to plot the grouped data and a LOESS statement without a group column and the
    NOMARKERS option.


    ![](img/0c09161c0be53934e5708cffbdcc441f_155_1.png)


    ```

    title "The Impact of Horsepower on MPG";

    proc sgplot data=help.cars;


    where types="Sedan" and drivetrain="AII";

    scatter x=horsepower y=mpg_city / group=Drivetrain

    transparency=0.8 name="scat";nloess x=horsepower y=mpg_city / smooth=0.4 nomarkers;

    legend keylegend="scat" location=inside across=1;

    yaxis;

    run;

    ```'
