  md: '# ### Figure 7.3.5: Bar Chart with Confidence Limits


    This example shows a bar chart showing the confidence limit of the mean (CLM).
    The standard error and deviation statistics are also available.


    The ALPHA option can be used to specify the confidence for the CLM calculation.
    The default is 0.05. The default legend includes the limit statistic information.


    ```

    proc sgplot data=sashelp.heart;

    format AgeAtStart agefmt.;

    yaxis label1="Avg. Cholesterol";

    vbar AgeAtStart / response=cholesterol stat=mean limitstat=clm

    =0.05;

    ```


    ![](img/0c09161c0be53934e5708cffbdcc441f_198_0.png)


    # ### Figure 7.3.6: Bar Chart with an Upper Limit


    You can use the LIMITS option to control which side of the limits are displayed.


    This example uses the STDERR statistic with a NUMSTD multiplier to display two
    standard errors instead of one.


    ![](img/0c09161c0be53934e5708cffbdcc441f_198_1.png)


    ```

    proc sgplot data=sashelp.heart;

    format AgeAtStart agefmt.;

    yaxis label1="Avg. Cholesterol";

    vbar AgeAtStart / response=cholesterol stat=mean limits=upper

    limitstat=stderr numstd=2;

    ```'
