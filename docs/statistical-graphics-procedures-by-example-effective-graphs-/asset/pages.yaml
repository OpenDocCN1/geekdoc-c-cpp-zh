  md: '# 2.3.3 Layout COLUMNATTICE


    This is a special case of the LATTICE layout, where only one variable is provided
    in the list of class variables. This layout produces a panel of columns in one
    row. Each cell has a header as shown in Figure 2.14.


    ![](img/0c09161c0be53934e5708cffbdcc441f_40_0.png)


    Figure 2.14


    # 2.3.4 Layout ROWLATTICE


    This is a special case of the LATTICE layout, where only one variable is provided
    in the list of class variables. This layout produces a panel of rows stacked in
    one column. Each cell has a row header as shown in Figure 2.15.


    # 2.3.5 Automatic Paging


    Classification panels provide a convenient way to visualize data by multiple class
    variables. This works well when the number of cells in a panel is small, less
    than ten. It is possible to display a grid of 3 by 3 cells in a graph on a page.


    However, as the number of cells grows, the individual cell size shrinks. At some
    point, each cell becomes too small to reasonably display the data contents. The
    SPANEL procedure automatically manages the number of cells in a graph to keep
    reasonable cell sizes. If needed, the graph is “paged” into multiple images, each
    showing a subset of the full panel.


    Options are available for user control of paging, as is shown in some examples
    later in the book.


    ![](img/0c09161c0be53934e5708cffbdcc441f_40_1.png)


    Figure 2.15'
