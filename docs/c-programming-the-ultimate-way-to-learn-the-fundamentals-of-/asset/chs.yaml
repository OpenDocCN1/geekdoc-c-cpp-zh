  %d\",a);\n}\nint a=20;\n```\n**输出：** 20\n\n## 判断对错\n\n1. `extern` 存储类变量在在其定义之前的函数中不可用，除非该变量在这些函数中显式声明。\n\
  2. 自动存储类变量的值在不同函数调用之间持续有效。\n3. 如果 CPU 寄存器不可用，则寄存器存储变量被视为静态存储变量。\n4. `register` 类变量不能持有\
  \ `float` 值。\n5. 如果我们尝试对 `float` 变量使用 `register` 类，编译器将报错。\n6. 如果变量 `x` 定义在所有函数之外，且变量\
  \ `x` 也定义为某些函数的局部变量，则全局变量将覆盖局部变量。\n7. 自动变量的默认值为零。\n8. 静态变量的生命周期持续到它定义的块。\n9. 如果要定义全局变量，则在它的声明中需要\
  \ `extern` 关键字。\n10. 寄存器变量的地址是可以访问的。\n\n**答案：**\n1. 正确\n2. 错误\n3. 错误\n4. 正确\n5.\
