  \n### 一些已解题:-\n\n1. 编写一个比较两个给定日期的程序。使用包含三个成员（`date`、`month` 和 `year`）的结构体来存储日期。如果日期相等，则显示消息“Equal”（相等），否则显示“Unequal”（不相等）。\n\
  \n```c\nstruct date {\n    int day, month, year;\n};\n\nint check_date(struct date\
  \ *dt)\nmain() {\n    int chkdt;\n    /*要比较的日期*/\n    struct date d1, d2;\n    /*输入要比较的日期*/\n\
  \    printf(\"\\nEnter the dates to be compared:\"););\n    chkdt = check_date(&d1);\n\
  \    if(chkdt == 0)\n        exit();\n    fflush(stdin);\n    chkdt = check_date(&d2);\n\
  \    if(chkdt == 0)\n        exit();\n    /*比较两个结构体*/\n    if((d1.day == d2.day)&&\
  \ (d1.month == d2.month)&&(d1.year == d2.year))\n        printf(\"\\nDate are Equal\"\
  );\n    else\n        printf(\"\\nDate are Unequal\");\n    getch();\n}\n\n/*检查输入日期的函数*/\n\
  int check_date(struct date *dt) {\n    printf(\"\\nEnter date(dd)\");\n    scanf(\"\
  %d\",&dt->day);\n    printf(\"\\nEnter month(mm)\");\n    scanf(\"%d\",&dt->month);\n\
  \    printf(\"\\nEnter date(yyyy)\");\n    scanf(\"%d\",&dt->year);\n    if((dt->day\
  \ >31 || dt->day<0) || (dt->month >12 || dt->month < 0) ||\n    (dt->year > 9999\
  \ || dt->year < 1000)) {\n        printf(\"\\nImproper date entered\");\n      \
  \  return(0);\n    }\n    else\n        return(1);\n}\n```\n\n以下程序的输出结果是什么？\n\n\
  1)\n```c\nmain() {\n    struct message {\n        int n;\n        char mess1[50];\n\
  \        char mess2[50];\n    } m;\n    m.n = 1;\n    strcpy(m.mess1,\"you can win\"\
  );\n    strcpy(m.mess2, “If you believe”);\n    /*假设结构体位于地址 2005*/\n    printf(\"\
  \\n%u %u %u\",&m.num,m.mess1,m.mess2);\n}\n```\n输出：打印每个结构体变量的地址。\n\n2)\n```c\nstruct\
  \ gos {\n    int n;\n    char mess1[50];\n    char mess2[50];\n} m1={2, “If you\
  \ are driven by success,”make sure it is a quality drive” };\nmain() {\n    struct\
  \ gos m2,m3;\n    m2 = m1;\n    m3 = m2;\n    printf(\"\\n%d %s %s\",m1.n,m2.mess1,m3.mess2);\n\
  }\n```\n输出：2 If you are driven to success make sure it is quality drive. 因为对象 `m1`\
  \ 在结构体创建时已初始化。在主程序中创建了两个对象 `m2` 和 `m3`，`m1` 被复制到 `m2`，然后 `m2` 被复制到 `m3`，因此 `m1`\
  \ 被复制到 `m2` 和 `m3`，输出与打印 `m1` 相同。在 `printf()` 中更改成员对输出没有影响。对象可以赋值给另一个，但不能用于其他操作。\n\
  \n3\n```c\nmain(){\n    union a {\n        int i;\n        char ch[2];\n    };\n\
  \    union a z=52;\n    printf(\"%d %d\",z.ch[0],z.ch[1]);\n}\n```\n输出：0 2 52 的二进制为\
  \ (0000010 0000000)\n\n4)\n```c\nmain() {\n    struct emp {\n        char name[20];\n\
  \        int age;\n        float sal;\n    }\n```\n（注：原文此处中断，翻译已按要求保留现有部分）\n\n\n\
  \n\n答案：结构体 `emp` 在定义结构之前的函数 `modify()` 中就被提到了。要解决这个问题，只需在结构体声明之前或之后声明该函数，或者在原型之前添加\
  \ `struct emp` 语句。\n\n### 问题- 下面代码可以运行吗：\n\n```c\n#include<alloc.h>\n\nstruct emp\n\
  {\n    int len;\n    char name[1];\n};\n\nmain()\n{\n    char newname[]= “Rahul”;\n\
  \    struct emp *p= (struct emp *) malloc(sizeof(struct emp) – 1 + strlen(newname)+1);\n\
  \    p->len=strlen(newname);\n    strcpy(p->name, newname);\n    printf(\"%d %s\"\
  ,p->len, p->name);\n}\n```\n\n答案：是的，程序为结构体分配了空间并调整了大小，使得 name 字段能够容纳请求的名称（而不像结构体声明暗示的那样只有一个字符）。\n\
  \n### 问题- 有没有更好的方法编写上面的程序？\n\n答案：实现该问题的最佳方法是使用字符指针而不是数组，如下所示：\n\n```c\n#include<alloc.h>\n\
  \nstruct emp\n{\n    int len;\n    char *name;\n};\n\nmain()\n{\n    char newname[]=\
  \ “Rahul”;\n    struct emp *p= (struct emp *) malloc(sizeof(struct emp));\n    p->len=strlen(newname);\n\
  \    p->name= malloc(p->len)+1;\n    strcpy(p->name, newname);\n    printf(\"%d\
  \ %s\",p->len, p->name);\n}\n```\n\n显然，将长度和字符串存储在同一块内存中的“便利性”现在消失了，释放此结构体的实例需要调用两次\
  \ `free()` 函数。\n\n### 问题- 你如何释放上面问题中分配的内存？\n\n答案：\n`free(p->name);`\n`free(p);`\n\
  \n### 问题- 下面程序的输出是什么？\n\n```c\nmain()\n{\n    struct emp\n    {\n        char *n;\n\
  \        int age;\n    };\n    struct emp e1= {David”, 23};\n    struct emp e2=e1;\n\
  \    strupr(e2,n);\n    printf(\"%s”,e1.n);\n}\n```\n\n答案：David\n\n当结构体被赋值、传递或返回时，拷贝是整体完成的。这意味着任何指针字段的副本将指向与原始指针相同的位置。换句话说，所指向的内容并没有被复制。因此，通过\
  \ `e2.n` 更改名称会自动更改 `e1.n`。\n\n### 问题- 指出以下代码中的错误（如果有）：\n\n```c\nmain()\n{\n    struct\
  \ emp\n    {\n        char n[20];\n        int age;\n    };\n    struct emp e1=\
  \ {David”, 23};\n    struct emp e2=e1;\n    if(e1 ==e2)\n        printf(“The structures\
  \ are equal”);\n}\n```\n\n答案：结构体不能使用内置的 `==` 和 `!=` 运算符进行比较。这是因为编译器没有一种单一、良好的方法来实现结构体比较。逐字节的比较会包含结构体中未使用的填充位中的位（（这种填充被用于保持后续字段的对齐正确）。逐字段的比较对于大型结构体来说可能需要大量不可接受的重复代码。此外，任何编译器生成的比较都无法期望在所有情况下恰恰地比较指针字段；例如，对于\
  \ `char *` 字段通常使用 `strcmp()` 而不是 `==` 来进行比较。\n\n### 问题- 你如何检查两个结构体变量的内容是否相同？\n\n\
  ```c\nstruct emp\n{\n    char n[20];\n    int age;\n};\n\nmain()\n{\n    struct\
  \ emp e1= {David”, 23};\n    struct emp e2;\n    scanf(\"%s %d”,e2.n, &e2.age);\n\
  \    if(cmp(e1, e2) == 0)\n        printf(“The structures are equal”);\n    else\n\
  \        printf(“Structures are unequal”);\n}\n\ncmp(struct emp x, struct emp y)\n\
  {\n    if(strcmp(x.n, y.n) == 0)\n        if(x.age == y.age)\n            return(0);\n\
  \    return(1);\n}\n```\n\n简而言之，如果你需要比较两个结构体，你必须编写自己的函数来通过逐字段执行比较。\n\n### 问题-编译器是如何实现结构体传递和返回的？\n\
  \n答案：当结构体作为参数传递给函数时，整个结构体通常被推入栈中。为了避免这种开销，许多程序员倾向于传递结构体的指针而不是实际结构体。结构体通常通过一个额外的、由编译器提供的“隐藏”参数指向的位置从函数返回。\n\
  \n### 问题- 我如何从/向数据文件读写结构体？\n\n答案：为了写出结构体，我们可以使用如下所示的 `fwrite()`\n`fwrite(&e, sizeof(e),1,fp);`\n\
  其中 `e` 是结构体变量。相应的 `fread()` 调用可以从文件中读回结构体。调用 `fwrite()` 时，它从地址 `&e` 写入 `sizeof(e)`\
  \ 字节。然而，使用 `fwrite()` 以内存镜像写入的数据文件将不可移植，特别是当它们包含浮点字段或指针时。这是因为结构体的内存布局取决于机器和编译器。不同的编译器可能使用不同数量的填充，基本类型的大小和字节顺序在不同机器之间异。因此，作为内存镜像写入的结构体不一定能被在其他机器上运行（或由编译器编译）的程序读回，如果你写入的数据文件将来会在机器之间交换，这是一个重要的考虑。\n\
  \n### 问题- 如果使用 `fwrite()` 将以下结构体写入文件，`fread()` 能成功读回它吗？\n\n```c\nstruct emp\n{\n\
  \    char *n;\n    int age;\n};\nstruct emp e = {Sujay”, 15};\nFILE *fp;\nfwrite(&e,\
  \ sizeof(e), 1,fp);\n```\n\n答案：不能，因为结构体包含一个字符指针，当使用 `fwrite()` 将结构体写入磁盘时，只有存储在指针\
  \ `n` 中的值会被写入（而不是它指向的字符串）。当读回此结构体时，地址会被读回，但内存中的该地址不太可能存在所需的字符串。\n\n### 问题- 下面程序会总是输出结构体大小为\
  \ 7 字节吗？\n\n```c\nstruct ex\n{\n    char ch;\n    int i;\n    long int a;\n};\n\
  ```\n\n答案：不是，编译器可能会在结构体中留空，通过在结构中的第一个 `char` 填充另一个字节，以确保随后的整数存储在偶数位置。此外，整数之后可能有两个额外的字节，以确保长整型存储在\
  \ 4 的倍数的地址上。这样做是因为许多机器在值对齐时处理内存中的值效率更高。某些机器根本无法执行未对齐的访问。你的编译器可能提供一种扩展来让你控制结构体的紧凑性（即是否进行填充），也许使用\
  \ `#pragma`，但没有标准方法。如果你担心浪费空间，可以通过将结构体成员按从大到小的顺序排列来最小化填充的影响。你有时可以使用位域来获得对大小和对齐的更多控制，尽管它们也有自己的缺点。\n\
  \n```c\nmain()\n{\n    struct a;\n}\n```\n\n\n\n\n```c\n{\n    category:5;\n   \
  \ scheme: 4;\n};\nprintf(\"size = %d\", sizeof(struct a));\n```\n（注：此处代码中使用了 struct\
  \ a，但上方定义未完全给出，此处按原文逻辑翻译）\n```\n答案：size= 2\n\n由于我们在结构体中使用了位域，且总位数超过了 8 位（准确说是 9\
  \ 位），因此结构体的大小报告为 2 字节。\n\n## 实验练习 – (WAP- 编写程序)\n\n1. 编写一个程序存储 10 名员工的信息，并根据用户输入的员工编号显示相应员工的信息。\n\
  2. 编写一个程序使用结构体接受并打印学生的成绩。\n3. 编写一个函数，该函数接收两个日期（日、月、年）结构体对象作为参数，并返回日期较大的结构体。\n4.\
  \ 编写一个程序，使用名为 `point(x, y 坐标)` 的结构体对点建模。定义三个点，并让用户输入其中两个点的值。然后将第三个点设置为另外两个点的和，并显示新点的值。程序的交互可能如下所示：输入\
  \ p1 的坐标：2 3 输入 p2 的坐标：6 8 p1+p2 的坐标为：8 11\n5. 编写一个程序，给指定的日期增加指定的天数。尽可能使用结构体。\n\
  6. 为一个包含 20 条选民记录的数组提供必要的声明，每个记录由四个数据值组成，即 ID 号、姓名、地址、年龄。利用上述声明编写一个程序段，打印所有年龄超过\
  \ 60 岁的选民的 ID 号和姓名。（假设使用合适的数据类型。）\n\n# 第 11 章（C 语言中的控制台输入输出）\n\n# 引言\n\n### getchar\
  \ 函数（单字符输入）\n\n`getchar()` 用于向计算机输入单个字符。`getchar` 函数是标准 C 输入/输出库的一部分。它从标准输入设备（通常是键盘）返回一个单字符。该函数不需要任何参数。\n\
  \n语法：\n`字符类型变量 = getchar();`\n\n### putchar 函数（单字符输出）\n\n此函数用于将单个字符传输到标准输出设备（通常是显示器）。它也是标准\
  \ C I/O 库的一部分。正在传输的字符通常表示为字符类型变量。它必须作为参数传递函数，放在括号内并跟在 `putchar` 之后。\n\n语法：\n`putchar(字符类型变量);`\n\
  \n### scanf 函数（输入数据）\n\n此函数可用于输入数值、单字符和字符串的任意组合。`scanf()` 从标准输入设备读取数据并将其存储在计算机内存中。该函数返回成功输入的数据项数。\n\
  \n语法：\n`cnt=scanf(\"控制字符串\", arg1,arg2,arg3……argn);`\n\n其中 `cnt` 的值将成功输入的数量，`控制字符串`\
  \ 是用于格式控制的字符串，而 `arg1,arg2…..argn` 是代表各个输入数据项的参数。参数以变量或数组的形式编写，其类型必须与控制字符串中相应的字符组匹配。每个变量名之前必须有一个取地址符（`&`）。\n\
  \n### printf 函数（写入输出数据）\n\n此函数可用于输出数值、单字符和字符串的任意组合。它的目的是显示数据。`printf()` 将数据从计算机内存移动到标准输出设备。\n\
  \n语法：\n`printf(\"控制字符串\",arg1,arg2………argn);`\n\n在此处，`控制字符串` 指一个包含格式信息的字符串，而 `arg1,arg2\\\
  .` 是代表各个输出数据项的参数。\n\n控制字符串可以包含标志，标志会影响输出的外观。标志必须紧跟百分号（`%`）之后。常用的标志包括：\n\n- `-`：数据项在字段内左对齐（用于填充最小字段宽的空白区域将添加在数据项之后，而不是之前）。\n\
  - `+`：每个带符号的数值项前都会有一个符号（`+` 或 `-`）。如果没有这个标志，则只有负数数据项前会有一个符号。\n- `0`：导致前导零代替前导空格。仅适用于在字段内右对齐且字段最小尺寸大于数据项的数据项。\n\
  - `' '`：每个正符号的带符号的数值项前会有一个空格。如果两个标志都存在，此标志会被 `+` 标志覆盖。\n- `#`：导致所有浮点数都包含小数点，即使该数据项是一个整数。\n\
  - ` -ox`：导致八进制和十六进制数据项前分别加上 `o` 和 `x`。\n\n#### 可选格式说明符\n\n1. 字段宽度告诉 `printf()` 在打印值时应使用多少列。例如：`int\
  \ a=5; printf(\"%10d\",a);` 将给整数 `a` 的字段宽度设为 10。由于该值无法占据全部 10 列，它将右对齐并在左侧留出空格。因此输出将为：`5`\n\
  2. 如果在格式说明符中给出减号：`int a=5; printf(\"%-10d\",a);` 意味着输出应该左对齐，在右侧留空。\n\n如果声明为 `float\
  \ a=2.5, b=0.00005, c=3000`，显示以下每个 `printf` 语句产生的输出：\n\n- (i) `printf(\"%f %f %f\"\
  , a, b, c);` 输出：`2.500000 0.000050 3000.000000`\n- (ii) `printf(\"%f %f %f\", a,\
  \ b, c);` （此处原文重复，此处按逻辑翻译）\n- (iii) `printf(\"%f %f %f\", a, b, c);`\n- (iv) `printf(\"\
  %f %f %f\", a, b, c);`\n- (v) `printf(\"%f %f %f\", a, b, c);`\n- (vi) `printf(\"\
  %f %f %f\", a, b, c);`\n- (vii) `printf(\"%f %f %f\", a, b, c);`\n- (viii) `printf(\"\
  %f %f %f\", a, b, c);`\n（注：由于原文中 (i)-(viii) 的代码完全一致，此处翻译保持格式，实际输出取决于具体说明符，但原文示例中未给出具体的说明符差异，仅翻译了结构）\n\
  \n*纠正：观察原文发现 (i) 到 (viii) 的代码完全相同 `printf(\"%f %f %f\", a, b, c);`，这通常是教材的笔误，我将严格按照原文翻译。*\n\
  \n- (i) `printf(\"%f %f %f\", a, b, c);` 输出：`2.500000 0.000050 3000.000000`\n- (ii)\
  \ `printf(\"%f %f %f\", a, b, c);` 输出：\n- (iii) `printf(\"%f %f %f\", a, b, c);`\
  \ 输出：\n- (iv) `printf(\"%f %f %f\", a, b, c);` 输出：\n- (v) `printf(\"%f %f %f\",\
  \ a, b, c);` 输出：\n- (vi) `printf(\"%f %f %f\", a, b, c);` 输出：\n- (vii) `printf(\"\
  %f %f %f\", a, b, c);` 输出：\n- (viii) `printf(\"%f %f %f\", a, b, c);` 输出\n\n####\
  \ 示例：\n这里是一个定义了整数、八进制和十六进制数字标志使用的简单程序：\n\n```c\n#include<stdio.h>\nmain()\n{\n \
  \   int i =123;\n    float x=12.0, y=-3.3;\n    int p=1234,q = 0777, r=0xa08c;\n\
  \    printf(\":%6d %7.0f  %10.1e:\\n\\n\",i,x,y);\n    printf(\":%6d %-7.0f %-10.1e:\\\
  n\\n\",i,x,y);\n    printf(\":%8u %8o %8x\\n\",p,q,r);\n    printf(\":%8u %-8o %-8x\\\
  n\",p,q,r);\n}\n```\n输出：\n```\n:   123      12 -3.3e+01\n\n:123     12 -3.3e+01\n\
  \n:   1234 777     a0\n1234    777       a0\n```\n\n### gets( ) 函数和 puts( ) 函数\n\
  \n这些函数用于方便计算机与标准输入/输出设备之间的字符串传输。每个函数都接受一个参数。该参数必须是一个代表字符串的数据项。字符串可以包含空白字符。\n\n`gets(\
  \ )` 用于从键盘（标准输入）获取字符串。\n\n`puts( )` 用于将字符串输出到标准输出。\n\n语法：\n`gets(字符字符串 变量);`\n`puts(字符字符串\
  \ 变量);`\n\n```c\n#include<stdio.h>\nmain()\n{\n    char line[20];\ngets(line);\n\
  puts(line);\n}\n```\n\n以下程序的输出是什么？\n\n\n\n\n\n\n### 1. 大小写转换\n```c\nmain() {\n \
  \   char ch;\n    ch = getchar();\n    if(islower(ch))\n        putchar(toupper(ch));\n\
  \    else\n        putchar(tolower(ch));\n}\n```\n**输出：** 它会将小写字母转换为大写，大写字母转换为小写。这意味着如果你输入‘a’，输出将是‘A’；如果你输入‘A’，输出将是‘a’。\n\
  \n### 2. 输出宽度格式\n```c\nmain() {\n    int i = 2;\n    float f = 2.5367;\n    char\
  \ str[] = \"Life is like that\";\n    printf(\"\\n%4d\\n3.3f\\n%4s\", i, f, str);\n\
  }\n```\n**输出：**\n- `2` (2 前面有 3 个空格，因为这里 `i` 在 4 列的宽度内打印)\n- `2.537` (数字前面有 2 个空格，且数字将保留\
  \ 3 位小数打印)\n- `is like that.` (因为 `str` 包含超过 4 个字符，所以它会忽略最大长度并打印整个字符串)\n\n### 3.\
  \ 整数格式化\n```c\nmain() {\n    int a = 250;\n    printf(\"%1d\", a);\n}\n```\n**输出：**\
  \ `250`\n\n### 4. 浮点数精度\n```c\nmain() {\n    float a = 3.15529;\n    printf(\"%6.2f\"\
  , a);\n    printf(\"%6.3f\", a);\n    printf(\"%5.4f\", a);\n    printf(\"%2.1f\"\
  , a);\n    printf(\"%0.0f\", a);\n}\n```\n**输出：**\n- `  3.16`\n- `  3.155`\n- `\
  \ 3.1553`\n- `  3.2`\n- `35.`\n\n### 5. 输入缓冲区与错误处理\n**指出以下程序中的任何错误（如有）：**\n```c\n\
  char ch;\nint i;\nscanf(\"%c\", &i);\nscanf(\"%d\", &ch);\nprintf(\"%c %d\", ch,\
  \ i);\n```\n**输出：** 你将没有机会为第二个 `scanf()` 语句输入字符。\n解决此问题的方法是在第二个 `scanf()` 之前加上以下语句：`fflush(stdin);`。这将把上一个\
  \ `scanf()` 留下的回车符从输入流（即键盘）中冲掉。\n\n### 6. 退格符与回车符\n```c\nmain() {\n    printf(\"\
  More than\\b\\b \\r the person who \\bwins the one who thinks he can!\");\n}\n```\n\
  **输出：** `the person who`\n因为控制符 `printf` 从左到右打印消息，当遇到 `\\b` 时，光标向左移动一个字符；当遇到 `\\\
  r` 时，光标移动到当前行的开头，下一条消息将覆盖之前的消息。\n\n### 7. 字符串迭代\n```c\nchar p[] = \"The sixth sick\
  \ she’s sixth ship is sick\";\nmain() {\n    int i = 0;\n    while(p[i] != '\\0')\
  \ {\n        putch(p[i]);\n        i++;\n    }\n}\n```\n**输出：** `The sixth sick\
  \ she’s sixth ship is sick`\n因为循环从 0 开始，并成功执行直到遇到空字符（Null character），所以字符串的每个字符都从头开始打印。\n\
  \n### 8. 百分号转义\n```c\nprintf(\"%%%%\");\n```\n**输出：** `%%`\n\n### 9. 变量字段宽度\n```c\n\
  int n=5;\nprintf(\"n=%*d\", n, n);\n```\n**输出：** 是的。`n=5*` 表示参数列表中的 `int` 值将用于字段宽度。在参数列表中，宽度位于要打印的值的值之前。在这种情况下，格式说明符变成了\
  \ `%5d`。\n\n### 10. Scanf 抑制\n**我们可以在 `scanf()` 格式字符串中指定变量字段宽度吗？**\n**输出：** 不能。`scanf()`\
  \ 格式字符串中 `%` 符号后的 `*` 用于抑制赋值。也就是说，当前的输入字段会被扫描但不会被存储。\n\n### 11. 缓冲区安全\n**在 `fgets()`\
  \ 和 `gets()` 之间，哪一个函数是安全的？**\n**输出：** `fgets()`，因为与 `fgets()` 不同，`gets()` 无法被告知存储提供字符串的缓冲区大小。因此始终存在缓冲区溢溢的可能性。\n\
  \n---\n\n### 段落分析：指出以下程序段落中的错误（如有）：\n\n**1.**\n```c\nmain() {\n    int i;\n    char\
  \ a[] = \"Hello\";\n    while(a != '\\0') {\n        printf(\"%c\", *a);\n     \
  \   a++;\n    }\n}\n```\n**输出：** 错误。数组作为左值（Lvalue）不能进行自增操作。\n\n**2.**\n```c\nmain()\
  \ {\n    double dual;\n    scanf(\"%f\", &dual);\n    printf(\"\\nDouble Value =\
  \ %lf\", dual);\n}\n```\n**输出：** 无错误，但输出将是 -0.000000。因为 `double` 占用 8 字节，而 `float`\
  \ 占用 4 字节。\n\n**3.**\n```c\nmain() {\n    int evel;\n    scanf(\"%d\\n\", &n);\n\
  \    printf(\"\\nInterger Value = %d\", evel);\n}\n```\n**输出：** 错误。未定义的符号 `n`。\n\
  \n**4.**\n```c\nmain() {\n    char *mess[5];\n    for(i = 0; i<5; i++)\n       \
  \ scanf(\"%s\", mess[i]);\n}\n```\n**输出：** 错误。未定义的符号 `i`；此外当我们讨论指针数组时，它不应该接收字符串，而应该接收字符串的地址。\n\
  \n**5.**\n```c\nmain() {\n    int dd, mm, yy;\n    printf(\"\\n Enter day,m and\
  \ year\\n\");\n    scanf(\"%d %c%d %c%d\", &dd, &mm, &yy);\n    printf(\"The date:%d-%d-%d\"\
  , dd, mm, yy);\n}\n```\n**输出：** 无错误。\n\n**6.**\n```c\nmain() {\n    char buffer[5];\n\
  \    int no = 97;\n    double val = 2.3174;\n    char name[10] = \"Sheta\";\n  \
  \  sprintf(buffer, \"%d %lf %s\", no, val, name);\n    printf(\"\\n%d %lf %s\",\
  \ no, val, name);\n    sscanf(buffer, \"%4d %2.lf %s\", &no, &val, name);\n    printf(\"\
  \\n%s\", buffer);\n    printf(\"\\n%d %lf %s\", no, val, name);\n}\n```\n**输出：**\
  \ 错误。`sprintf()` 将变量打印到指定的字符串（例如上面示例中的 buffer），而不是将变量打印到屏幕。同样，`sscanf()` 从字符串读取字符并根据指定格式转换并存储。因此，在上面的程序中，首先所有变量的值都被复制到缓冲区数组中，当我们打印缓冲区时会得到所有复制的值。然后通过\
  \ `sscanf()` 从缓冲区字符串读取所有值并存储到变量中，当变量被打印时，它会显示所有赋值的值。\n\n\n\n\n\n\n## 复习题\n\n1. 若要在字符数组\
  \ `str[100]` 中接收字符串 “We have got the guts, you get the glory!!”，你将使用以下函数中的哪一个？\n\
  \   a) `scanf(\"%s\",str)`\n   b) `gets(str)`\n   c) `getche(str)`\n   d) `fgetchar(str)`\n\
  \   **输出：** `gets(str)`\n\n2. 如果要通过键盘接收单个按键，你会使用哪一个函数？\n   a) `scanf()`\n   b) `gets()`\n\
  \   c) `getche()`\n   d) `getchar()`\n   **输出：** `getche()`\n\n3. 如果通过键盘输入一个整数，你会使用哪一个函数？\n\
  \   a) `scanf()`\n   b) `gets()`\n   c) `getch()`\n   d) `getche()`\n   **输出：**\
  \ `scanf()`\n\n4. 如果通过键盘接收一个字符字符串，哪个函数运行速度更快？\n   a) `scanf()`\n   b) `gets()`\n\
  \   **输出：** `gets()`\n\n5. `getchar()`、`fgetchar()`、`getch()` 和 `getche()` 之间有什么区别？\n\
  \   **输出：** 它们都从键盘接收字符。它们之间的细微差异：\n   - `getchar()`：从键盘接收一个字符，但在输入字符后必须按下回车键。\n\
  \   - `fgetchar()`：与 `getchar()` 相同。`getchar()` 是宏，而 `fgetchar()` 是函数。\n   - `getch()`：从键盘接收一个字符且不在屏幕上回显（显示）它。\n\
  \   - `getche()`：从键盘接收一个字符并在屏幕上回显它。\n\n6. `printf()` 的格式字符串可以包含：\n   a) 字符、格式规范和转义序列\n\
  \   b) 字符、整数和浮点数\n   c) 字符串、整数和转义序列\n   d) 引号、百分号和反斜杠字符\n   **输出：** a) 字符、格式规范和转义序列\n\
