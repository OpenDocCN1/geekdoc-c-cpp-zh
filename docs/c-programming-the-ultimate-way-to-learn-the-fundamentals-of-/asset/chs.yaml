  \ `atoi` 也可以将字符串转换为整数。\n\n\n\n\n\n### 1. 数组初始化与打印\n```c\nchar c[2] = \"A\";\nprintf(\"\
  %c\",c[0]);\nprintf(\"%s\",c);\n```\n**输出：** `A A`\n通过第一个 `printf()`，打印了 `'A'`，因为数组大小为\
  \ 2，所以 `'A'` 存储在第 0 个位置，而 `'\\0'`（空字符）被存储在第一个位置。通过使用第二个 `printf()`，输出将是 `'A'`，因为整个字符串\
  \ `\"A\"` 会被打印出来。\n\n### 2. 字符串偏移\n```c\nchar s[] = \"Get organized! learn c!!\"\
  ;\nprintf(\"\\n%s\",&s[2]);\nprintf(\"\\n%s\",s);\nprintf(\"\\n%s\",&s);\nprintf(\"\
  \\n%c\",s[2]);\n```\n**输出：**\n```\nt organized! learn c!!\nGet organized! learn\
  \ c!!\nGet organized! learn c!!\nt\n```\n通过第一个 `printf()`，打印了 `\"t organized! learn\
  \ c!!\"`，因为我们使用了 `&s[2]` 来打印字符串，所以打印从字符串的第 3 个字符开始；因为当我们只使用字符串名时，它包含基地址，字符串打印将从基字符开始。\n\
  通过第二个 `printf()`，打印了整个字符串，因为那里使用了字符串名。\n通过第三个 `printf()`，打印了整个字符串，因为传递的是字符串的地址（由于没有使用下标或索引，所以是基地址），这与第二个\
  \ `printf()` 相同。\n通过最后一个 `printf()`，只打印了第三个字符，因为这里使用了 `%c` 格式说明符，并且打印列表中使用了指向第三个字符的\
  \ `s[2]`。\n\n### 3. 字符串字面量\n```c\nprintf(\"%c\",\"Harry\"[4]);\n```\n**输出：** `y`\n\
  因为当我们打印 `s[4]` 时，打印的是字符串的第 5 个字符；在这里我们在 `s` 的位置使用了字符串 `\"matrix\"`，同样地，它会打印字符串的第\
  \ 5 个字符，即 `r`。\n\n### 4. 数组遍历\n```c\nchar a[] = {'M','A','T','R','I','X'};\nint\
  \ i;\nfor(i = 0; i<=5;i++)\n    printf(\"\\n%c\",a[i]);\n```\n**输出：** 无错误。\n只要条件为真，数组的第\
  \ `i` 个元素就会被打印，因为计数器从 0 开始，所以打印从第 0 个元素开始，一直到第 5，因此字符串 `\"MATRIX\"` 的每个字符都被打印并换行显示。\n\
  \n### 5. 缓冲区溢出\n```c\nmain(){\n    char s[7] = \"Strings\";\n    printf(\"%s\",s);\n\
  }\n```\n**输出：** 不可预测。\n在这里 `s[]` 被声明为 7 个字符的数组，但在其中存储了一个 8 个字符的字符串。这将导致数组保留的第 7\
  \ 个字节之外的字节被 `'\\0'` 覆盖。始终存在重要信息被覆盖的可能性，这将是不安全的。\n\n### 6. 转义序列\n如何在屏幕上输出 `\\n`？\n\
  **输出：** `\"\\\\n\"`\n\n### 7. 空终止符 vs 字符串字面量\n```c\nchar str1[] = {'H','e','l','l','o',0};\n\
  char str2[] = \"Hello\";\nprintf(\"\\n%s\",str1);\nprintf(\"\\n%s\",str2);\n```\n\
  **输出：**\n```\nHello\nHello\n```\n在第一个字符串中，最后一个字符是 0，即 NULL(\\0) 的 ASCII 值，当打印 `str1`\
  \ 时，会打印整个字符串 `\"Hello\"`，`str2` 也是如此。\n\n### 8. 字符串指针算术\n```c\nprintf(5+\"Good Morning\"\
  );\n```\n**输出：** `Morning`\n编译器将理解上面的 `printf`，字符串应该从第 5 个字符开始打印。\n\n### 9. sizeof\
  \ 运算符\n```c\nprintf(\"\\n%d %d\",sizeof('3'),sizeof(3));\n```\n**输出：** `2 2`\n第一个\
  \ `sizeof('3')`，但在 C 语言中字符会转换为 ASCII 值，编译器将其理解为 `int`，因此它占用 2 个字节。第二个 `sizeof` 是一个只包含字符的字符串，但\
  \ C 会自动在每个字符串末尾加上空字符，因此上面的字符串将包含 2 个字节。第三个 `sizeof` 是一个整数值，占用 2 个字节。\n\n### 10.\
  \ 数组递增\n```c\nchar a[8] = \"Rhombus\";\nint i;\nfor(i = 0; i<=7; i++)\n    printf(\"\
