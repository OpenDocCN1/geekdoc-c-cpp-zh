  \ | 2,3,4,5,6 |\n| 7. `for(i=1;i=5;i++)printf (“%d”,i);` | 5,5,5,5……. |\n| 8. `for(i=1;i=0;i++)printf(“%d”,i);`\
  \ | 条件将被视为假，因为在条件的位置上有一个 0 的赋值。 |\n| 9. `for( ; :)` | 将生成一个空白屏幕。 |\n| 10. `for(i=1;i++<=5;i++)printf(“%d”,--i);`\
