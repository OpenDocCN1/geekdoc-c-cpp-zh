  *\");\n```\n\n## 4. 编写一个程序，将类似“24”的字符串转换为整数 24\n\n```c\nchar str[6];\nint num=0,i;\n\
  printf(\"Enter a number: \");\nscanf(\"%s\",str);\nfor(i=0; str[i]\\0'; i++)\n{\n\
