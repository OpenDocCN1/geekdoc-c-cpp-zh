  ![](img/image00853.jpeg)\n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 ∞ 8 章\n\
  ## (函数中的大脑)\n\n# 引言\n函数是一个接收某些输入并产生输出的小程序。函数允许将一个大型程序分解为若干个更小的自包含的组件，每个组件都有明确的目的。它避免了重复编写代码。将逻辑拆分为独立的函数可以使整个编写和调试过程变得更加简单。\n\
  \n另一方面，你可以说函数是一个自包含的语句块，用于执行某些任务。函数一旦被分配了某项工作，就可以为了该任务被调用多次。每个 C 程序都会使用一些函数，常用的函数有\
  \ `printf`、`scanf`、`main` 等。\n\n函数可以是库函数或用户定义函数。库函数是随编译器一起提供并存在磁盘上的函数。用户定义函数是程序员为了使程序更容易调试、追踪而自己编写的函数。\n\
  \n### 练习笔记\n`printf()`、`scanf()`、`exit()`、`pow()` 是库函数。每个库函数都有一个头文件。C 语言总共有 15 个头文件。`main()`\
  \ 是用户定义函数。\n\n每个程序必须有一个 `main` 函数。这个 `main` 函数用于标记执行的开始。可以使用仅 `main` 程序来编写任何程序，但这会导致很多问题。程序会变得过于庞大和复杂，从而难以追踪、调试和测试。\n\
  \n但如果将同一个程序拆分成独立编码的小模块，然后将它们组合成一个单元，那么这些问题就可以被轻松解决。这些模块被称为函数。因此，函数可以定义为接收某些输入并产生某些输出的小程序。\n\
  \n**练习笔记**：我不再反复输入头文件了，所以写写程序时，请不要忘记用头文件开始你的程序。\n\n### 计算两个数和的函数：\n```c\nint sum(int,\
  \ int); /* 函数原型或声明*/\n\nmain()\n{\n    int a,b,ans;\n    printf(“Enter two numbers:\
  \ “);\n    scanf(“%d %d”,&a,&b);\n    ans= sum(a,b);             /* 函数调用*/\n   \
  \ printf(“ sum is %d”, ans);\n    getch();\n}\n\nint sum( int x, int y) /* 函数定义或过程*/\n\
  {\n    int z;\n    z = x + y;\n    return(z);\n}\n```\n\n现在让我们来看看这个程序的一些特性：\n1.\
  \ 第一条语句是函数的声明，它告诉编译器函数的名称以及传递的参数的数据类型。\n2. 声明也称为原型。\n3. 如果输出类型是整数值，则不需要对函数进行声明。在某些\
  \ C 编译器中，并不是所有函数都要求声明。\n4. 函数调用是使用函数的方法。函数声明一次，定义一次，但在同一个程序中可以使用多次。\n5. 当编译器遇到函数调用时，程序的控制权将转移到函数定义处，然后按行执行函数并返回一个值。\n\
  6. `main` 程序的末尾是函数的定义，它可以作为过程被调用。\n7. 函数定义不以分号结束。\n8. 函数可以返回也可以不返回任何值。因此，`return`\
  \ 语句并不是必须的。当遇到 `return` 语句时，控制权会立即传回调用函数。\n9. 虽然可以向函数传递任意数量的参数，但被调用函数每次调用时只返回一个值。`return`\
  \ 可以使用：\n   - `return;`\n   - `return(value);`\n   不带任何值的 `return` 作用类似于关闭函数的大括号。\n\
  10. 一个函数可以有多个 `return` 语句。可以这样使用：\n    ```c\n    if (a!=0)\n        return(a);\n\
  \    else\n        return(1);\n    ```\n11. 所有函数默认返回 `int`。但如果函数必须返回特定类型的数据，可以使用类型说明符配合函数，例如\
  \ `long int fact(n)`。\n12. 如果函数 `main()` 调用函数 `sum()`，那么 `main()` 是调用函数，`sum()`\
  \ 是被调用函数。没有参数且没有返回值：某些函数不从调用函数接收任何值。因此，函数原型将是 `prn()`，即不传递任何参数。这也可以通过 `prn(void)`\
  \ 实现。同样，调用函数也不会从函数处获得任何值。这是通过在函数名之前使用关键字 `void` 实现的。为了说明这一点，让我们考虑以下程序：\n\n```c\n\
  void prn(); /*声明可以写为 prn(void)\n\nmain()\n{\n    prn();\n    prn();\n    prn();\n\
  }\n\nvoid prn()\n{\n    printf(“Hello”);\n}\n```\n\n### 参数传递机制\n\n### (i) 值传递 (Call\
  \ by value)\n当按值传递参数时，实际参数的副本将从调用函数传输到调用函数定义中的形式参数中。现在，在调用函数定义中对形式参数进行的任何更改都不会反映在调用函数的实际参数中。例如在上面的计算两个数和的函数中，调用语句写为：\n\
  `ans = sum(a,b);`\n这里变量 `a, b` 的值从 `main` 函数传递到被调用函数的定义处。在定义中，变量 `x, y` 分别接收 `a,\
  \ b` 的值。在这里，`a, b` 被称为实际参数，而 `x, y` 被称为形式参数。实际参数和形式参数的作用域不同，因此在形式参数上做的任何更改都不会出现在实际参数中。\n\
  \n```c\nvoid swap(int, int);\nmain()\n{\n    int a,b;\n    printf(“Enter two numbers”);\n\
  \    scanf(“%d %d”,&a,&b);\n    swap(a,b); /*在此调用语句中 a,b 是实际参数*/\n    printf(“%d\\\
  t%d”a,b);\n}\n\nvoid swap(int x,int y) /*在此函数定义中 x & y 是形式参数 */\n{\n    int t;\n\
  \    t=x; y=t;\n}\n```\n**练习笔记**：在上面的例子中：对 `x, y` 的更改不会反映在 `a, b` 中。\n\n### (ii)\
  \ 引用传递 (Call by reference)\n当按引用传递参数时，实际参数的地址将从调用函数传输到调用函数定义的形式参数中。现在，调用函数定义中对形式参数进行的任何更改都会反映在调用函数的实际参数中。有时无法传递变量的值，例如使用数组时，无法通过值传递传递的所有的值。因此，使用了另一种函数调用机制引用传递，即传递变量的地址。在这里，定义通过访问特定地址工作。这种方法通常用于数组和指针。\n\
  \n```c\nmain()\n{\n    int a,b;\n    printf(“Enter 2 numbers”);\n    scanf(“%d%d”,&a,&b);\n\
  \    swap(&a, &b); /*在此调用语句中 a, b 的地址被传输*/\n    printf(“%d\\t%d”a,b);\n}\n```\n\n\
  \n\n\n\n```c\nvoid swap(int *p1, int *p2) /*在此函数定义中 p1 & p2 是接收 a, b 地址的指针*/\n{\n\
  \    int t;\n    t=*p1; *p1=*p2; *p2=t;\n}\n```\n\n### 练习笔记\n在上面的示例中：`p1`、`p2` 中的更改将自动反映在\
  \ `a`、`b` 中。\n\n### 练习笔记\n数组也是通过引用传递的。当我们传递数组名时，在函数定义中仅传递基地址。\n\n## 函数类型\n\n###\
