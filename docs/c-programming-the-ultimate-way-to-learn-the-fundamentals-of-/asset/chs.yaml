  );\n  scanf(\"%d\",&a);\n  fact=rec(a);\n  printf(\"Factorial value=%d\",fact);\n\
  \  getch();\n}\nint rec(int x)\n{\n  if(x==1)\n    return(1);\n  else\n    return\
  \ rec(x-1);\n}\n```\n\n### 120. 编写程序使用函数构建计算器。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  int addi(int,int);\nint subt(int,int);\nint multi(int,int);\nfloat div(int,int);\n\
