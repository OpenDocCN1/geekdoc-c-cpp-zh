  2. 将控制权返回给调用函数必须使用关键字 `return`。相同的变量名可以在不同函数中使用而不产生冲突。\n3. 每个调用的函数必须包含 `return`\
  \ 语句。\n4. 一个函数可以包含多个 `return` 语句。\n5. 函数中的每个 `return` 语句可以返回不同的值。\n6. 即使你不向函数传递任何参数且函数不返回任何值，它仍然是有用的。\n\
  7. 相同的名称可以在不同函数中使用而不产生冲突。\n8. 一个函数可以从任何其他函数被调用多次。\n9. 函数必须返回某个值。\n10. 一个函数可以有多个声明，但只有一个定义。\n\
  11. 函数不能定义在另一个函数内部。\n12. 下述函数是否可以工作：\n```c\nmain()\n{\n    f1(int a, int b);\n{\n\
  \    return(f2(20));\n}\nf2 (int a)\n{\n    return(a*a);\n}\n```\n\n\n\n\n\n## 判断对错\n\
  \n13. 在函数中永远不应该出现两个 return 语句。\n14. 在函数中两个 return 语句永远不应该连续出现。\n15. 在 C 语言中，除 `main()`\
  \ 外的所有函数都可以被递归调用。\n16. 通常情况下，递归的运行速度比循环慢。\n17. 过多的递归调用可能会导致栈溢出。\n\n## 答案\n| 1. 错误\
  \ | 2. 错误 | 3.正确 | 4. 错误 | 5.正确 | 6.正确 | 7.正确 | 8. 错误 | 9. 错误 | 10.正确 | 11.正确 |\
  \ 12.正确 | 13. 错误 | 14.正确 | 15. 错误 | 16.正确 | 17.正确 |\n\n# 回答以下问题\n\n1. 当我们提到函数的原型时，我们是在定义函数还是声明函数？\n\
  **输出：** `declaring`（声明）\n\n2. 以下代码中有一个错误，请添加一条语句将其移除。\n\n```c\nmain()\n{\n    int\
  \ a;\n    a=f(10,3,14);\n    printf(\"%d\",a);\n}\n\nf(int aa, float bb)\n{\n  \
  \  return((float)aa+bb);\n}\n```\n\n**输出：**\n缺少函数 `f` 的声明，请在 `main()` 之上添加以下：\n\
  ```c\nfloat f(int,float);\n```\n\n3. 定义函数的两种表示法通常被称为：\n\n```c\nint f( int a, float\
