  \ 用于分配连续字节的内存。如果内存空间不足以满足请求，则分配可能会失败。如果失败，它将返回 `NULL`。\n\n### 分配多个块 (calloc)\n\n\
  `calloc` 也是一种内存分配函数，通常用于为数组和结构体分配内存。`malloc` 用于分配单个存储空间块，而 `calloc` 分配多个存储块，每个块的大小相同，并将它们初始化为零。`calloc`\
  \ 的通用语法如下：\n\n`P= (cast type*) calloc(n, array size);`\n\n现在让我们来看一个例子：\n\n```c\n\
  P=(int*)calloc (10 , sizeof(int));\n```\n\n上述语句为 10 个块分配了连续空间，每个块的大小为 2 字节（因为 `int`\
  \ 占用两个字节）。所有字节都将初始化为零，并且指针获得了所分配块的起始地址。与 `malloc` 一样，在这里如果无法满足内存请求，则会返回一个 `NULL`。\n\
  \n### 修改块的大小\n\n我们后来可能会发现，之前分配的内存不再足够，需要额外的空间，或者分配的内存比需要的要大。在这两种情况下，都必须修改块的大小，可以通过函数\
  \ `realloc`（重新分配内存）来实现。`realloc` 的通用语法为：\n\n`P= realloc(P, new size);`\n\n#### 逻辑洗练练习\n\
  \n新尺寸可以比之前的大，也可以小。现在让我们来看一个例子，假设使用 `malloc` 分配了存储 10 个整数的块：\n\n```c\nP=(int*)malloc\
  \ (10 * sizeof(int));\n```\n\n现在要修改大小以便多存储 5 个数字，语句应为：\n\n```c\nP= realloc(P, 15);\n\
  ```\n\n该函数为指针 `P` 分配了一个大小为 15 的新内存空间，并返回指向新块第一个字节的指针。\n\n#### 逻辑洗练练习\n\n还要记住，新的内存块可能在旧块相同的位置开始，也可能不在。在这种情况下，它会在其他地方创建一个新的内存空间，将所有旧数据复制到那里，并将块地址返回给指针。\n\
