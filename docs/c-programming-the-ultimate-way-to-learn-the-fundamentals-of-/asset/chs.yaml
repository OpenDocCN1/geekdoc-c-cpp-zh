  \ 常见错误\n\n1. `while` 语句不包含 `do` 单词。因此，写 `while(condition) do` 在逻辑上是不正确的。\n2. `break`\
  \ 和 `continue` 语句只影响最内层的循环。\n\n以下程序的输出是什么。\n\n![](img/image00841.jpeg)\n\n\n\n\n\
  \n### 1. 无限循环示例\n```c\nint i =1;while( i<= 10);{\n    printf(\"\\n%d\",i);\n   \
  \ i++;\n}\n```\n**输出：** 因为无限循环没有输出。\n在上面的程序中，`while` 之后遇到了一个 `\";\"`，因此编译器将其理解为：\n\
  ```c\nwhile(i<=10){\n    ;\n}\n```\n显然，在循环体内没有自增操作，只有一个空语句，因此条件始终为真，导致无限循环，并且由于是空语句，没有产生输出。\n\
  \n### 2. 语法错误\n```c\nchar ch;while(ch =0; ch<=255;ch++)            \n    printf(\"\
  \\n %d-%c\",ch,ch);\n```\n**输出：** 错误。\n在上面的程序中，在应该使用 `for` 的使用了 `while`，由于语法不同导致了错误。\n\
  \n### 3. 开始时为假的条件\n```c\nint a =4;while( a = =1){\n    a = a-1;\n    printf(\"%d\"\
  ,a);\n    --a;\n}\n```\n**输出：** 无输出\n因为条件第一次判断为假，控制立即离开循环体，不执行任何操作。\n\n### 4. 前置和后置递减\n\
  ```c\nint a =4,b,c;b = --a;c = a--;\nprintf(\"\\n%d %d %d\",a,b,c);\n```\n**输出：**\
  \ 2 3 3 \n在上面的程序中，`a = 4`，现在我们理解了前置和后置递增/减。\n- `b = --a` -> (1) `a = a-1` [-> `a\
  \ =3`]; (2) `b=a` -> [`b =3`];即在前置递减中先减 1 后赋值。\n- `c=a--` -> (1) `c = a` [`c = 3`];\
  \ (2) `a = a-1` [`a = 2`];即在后置递减中先赋值后减 1。\n所以最终 `a = 2`，`b = 3`，`c = 3`，并通过 `printf()`\
  \ 打印。\n\n### 5. 后置递减表达式\n```c\nint a =4,b =3,c;c = a-- -b;\nprintf(\"\\n%d%d%d\"\
  ,a,b,c);\n```\n**输出：** 3 3 1 \n这里首先 `a = 4`；在表达式 `c = a-- -b;` 中使用了后置递减操作，意味着先将\
  \ `a` 用于表达式，然后减 1，即 ->\n(1) `c = a-b;` [`c = 4-3]` -> [`c = 1]` (2) `a = a-1;` [`a\
  \ = 4-1]` -> `[3]`，`b` 保持不变，所以最终 `a = 3`，`b = 3`，`c = 1`，并通过 `printf()` 打印。\n\n\
  ### 6. 常真条件\n```c\nwhile(‘a’<’b’)printf(\"\\n malyalam is a palindrome”);\n```\n\
  **输出：** 无限打印“malyalam is a palindrome”。\n因为条件 `‘a’<’b’` 永远不会为假，每次执行都会运行循环体，打印出上述消息“malazepam\
  \ is a palindrome”。\n\n### 7. 条件中的赋值\n```c\nint i;while(i =15){\n    printf(\"\\\
  n%d\",i);\n    i++;\n}\n```\n**输出：** 无限打印 15。\n因为在 `while(i = 15)` 语句中，`i` 没有与 `15`\
  \ 比较。在这里 `i` 被赋值为 `15`，这是一个非零值，因此每次检查条件时，`i` 都会变成 `15`，条件为真并执行循环体：首先打印 `i` 的值（即\
  \ `15`），然后加 1，`i` 变为 `16`；但当再次遇到条件检查时，`i` 再次变为 `15`，并再次执行循环体，导致 15 被无限打印。\n\n###\
  \ 8. 浮点数比较\n```c\nfloat a = 1.1;while( a = =1.1){\n    printf(\"\\n%d\",x);\n  \
  \  x=x-0.1;\n}\n```\n**输出：** 无输出\n因为在条件中 `float` 变量与 `double` 值进行了比较，控制跳出了循环。\n\
  **注意笔记：** 每当我们使用浮点数常量时，它被视为 `double` 类型值。\n\n### 10. 带有 Continue 的循环\n```c\nint\
  \ a =4, b =0, c;while(a>=0){\n    a--;\n    b++;\n    if( a =b)\n        continue;\n\
  \    else\n        printf(\"\\n %d  %d\",a,b);\n}\n```\n**输出：** 3 1 1 3 0 4 -1 5\n\
  在上面的程序中，首先 `a = 4`, `b = 0`，检查条件时为真并执行循环体，`a` 减 1，`b` 加 1，所以 `a = 3`，`b = 1`。现在再次检查条件\
  \ `a = b` 为假，控制跳转到 `else` 块并打印 `a` 和 `b` 的值，分别为 3 和 1。现在当重复检查循环条件时为真，控制再次执行循环体，结果为\
  \ `a = 2`, `b = 2`；当检查条件 `a = b` 时为真，使用 `continue` 语句继续循环，控制跳转到循环条件，由于 `a = 2` 大于\
  \ 0 条件为真，再次执行循环体，`a = 1`, `b = 3` 并打印（因为 `if` 条件为假），从循环末尾控制跳转到为真的条件，此时 `a = 0` 且\
  \ `b = 4` 不相等，当检查条件时为真并执行 `a = -1` 和 `b = 5`，仍不相等并通过 `else` 块，此时当检查条件时变为假，因为 `a\
  \ = -1` 不大于或等于 0，从而跳出循环。\n\n### 9. Break 语句\n```c\nint a = 4, b = 0,c;while( a>=0){\n\
  \    if(a =b)\n        break;\n    else\n        printf(\"\\n%d  %d\",a,b);\n  \
  \  a--;\n    b++;\n```\n**输出：** 4 0 3 1\n在上面的程序中，首先 `a = 4`, `b = 0`，检查条件时为真并执行循环体。`if(a\
  \ = b)` 为假，执行 `else` 块打印 `a` 和 `b` 的值，分别为 4 和 0。然后 `a` 减 1，`b` 加 1。当重复检查循环条件时为真，再次执行循环体，结果为\
  \ `a = 3`, `b = 1`；当检查条件 `a = b` 时为真，通过 `break` 语句退出循环。\n\n### 12. 分号错误\n```c\n\
  int i;for(i = 1;i<=5;);\nprintf(i);\n```\n**输出：** 无限打印 1。\n在这里 `for` 后面遇到了一个 `\"\
  ;\"`，编译器将其理解为：\n\n### 13. 无限 For 循环\n```c\nint i = 1,j = 1;for(; ;){\n    if(i>5)\n\
  \        break;\n    else\n        printf(\"\\n%d  %d\",i,j);\n    i++;\n}\n```\n\
  （注：原文此处文本较为混乱，已根据代码逻辑进行了整理翻译）\n\n## 实验题\n打印以下序列的 n 项。\n\n1. 1, 3, 5, 7, 9, .........\n\
