  \ | 将字符串的所有字符设置为给定字符 |\n| `strnset()` | 将字符串的前 n 个字符设置为给定字符 |\n\n### 2. 用户定义函数\n\
  由我们定义的称为用户定义函数。`main()` 函数也是用户定义函数，因为 `main()` 的定义是由我们定义的。\n\n例如：\n```c\nint power(int,\
  \ int);\nmain()\n{\n    int n, p, ans;\n    printf(\"Enter number and its power\"\
  );\n    scanf(\"%d%d\",&n,&p);\n    ans = power(n,p);\n    printf(\"%d\",ans);\n\
  \    getch();\n}\nint power(int n, int p)\n{\n    int ans=1, i;\n    for(i=1;i<=p;i++)\n\
  \    {\n        ans = ans * n;\n    }\n    return(ans);\n}\n```\n\n### 参数为二维数组的函数：\n\
  ```c\nvoid mat_sum(int m1[10], int r1, int c1, int m2[10], int r2, int c2, int m3[][10])\n\
  {\n    int i,j;\n    if(r1 != c1 && r2 != c2)\n    {\n        printf(\"Can’t sum\"\
  );\n        exit();\n    }\n    for(i=0;i<r1;i++)\n        for(j=0;j<c1;j++)\n \
  \           m3[i][j] = m1[i][j] + m2[i][j];\n}\n```\n上述函数可以在 `main()` 中通过 `mat_sum(m1,r1,c1,m2,r2,c2,m3);`\
  \ 调用。\n\n# 递归\n如果函数体语句调用了自身，则该函数是递归的。有时被称为“循环定义”，递归是函数调用自身。递归函数应该包含两个部分：递归语句和终止条件。\n\
  \n\n\n\n假设我们要计算一个整数的阶乘。如我们所知，一个数字的阶乘是从 1 到该数字之间所有整数的乘积。4 的阶乘可以表示为 `4! = 4 * 3!`\
  \ 其中 `!` 代表阶乘。因此，一个数字的阶乘可以用自身的形式表示。由此，这可以通过递归来实现。\n\n例如：\n\n```c\nint fact (int);\
  \                   /*函数定义 */\n\nmain()\n{\n    int n,ans;\n    printf(\"Enter a\
  \ number: \");\n    scanf(\"%d\",&n);\n    ans = fact(n);               /*函数调用 */\n\
  \    printf(\"factorial = %d\",ans);\n    getch();\n}\n\nint fact(int n)\n{\n  \
  \  if(n ==0)                    /*终止条件*/\n    return (1);\n    return (n*fact(n-1));\
  \        /*递归语句*/\n}\n```\n\n现在让我们评估这个程序：\n\n假设当程序控制权从 `main()` 函数传递给函数 `fact` 时，`n`\
  \ 的值为 3。由于 `n` 不等于 0，因此条件为假，执行递归语句。\n\n`3*fact(2)`\n\n现在 `fact(2)` 是调用函数，因此程序的控制权再次到达定义的开头。终止条件仍然为假，执行递归语句。\n\
  \n`2*fact(1)`\n\n再次 `fact(1)` 是调用函数，因此程序的控制权再次到达定义的开头。终止条件仍然为假，执行递归语句。\n\n`1 * fact(0)`\n\
  \n现在条件为真，因此调用函数(`fact(0))` 的答案将是 1，依此类推。因此，操作的序列将是：\n\n`fact(3)=3 * fact(2)`\n`fact(2)=2\
  \ * fact(1)`\n`fact(1)=1 * fact(0)`\n\n当我们使用递归程序时，会使用栈来组织数据。栈是一种后进先出（LIFO）数据结构。这意味着存储在栈中的最后一个被存储（`push`\
  \ 操作）的项将是第一个出来（`pop` 操作）的项。\n\n在上面的程序中，当调用 `fact(2)` 时，值 3 将存储在栈中。同样，当调用 `fact(1)`\
  \ 时，值 2 将存储在栈中 3 之上。\n\n现在当 `fact(0)` 返回 1 时，它将与栈中的第一个值相乘，即\n1。此结果将与栈中的第二个等待值相乘，即\
  \ 2，依此类推。\n\n当一个函数在它的定义中调用另一个函数时，这被称为链式。递归是一种特殊的链式，其中函数调用自己。\n\n例如：\n\n```c\nmain()\n\
  {\n    printf(\"Harry\\n\");\n    main();\n}\n```\n执行时，程序将给出如下输出：\nHarry\nHarry\n\
  \n任何递归函数的执行都可以无限进行，因此为了将执行引导到终点，应用了终止条件。使用递归函数是为了解决那些解决方案可以表示为子集上连续相同解决方案的问题。\n\n\
  但递归函数也有一些缺点：\n1. 这些函数更耗时，因此程序的执行速度较慢。\n2. 由于需要形成栈来保存等待值，会占用更多的空间。\n\n填空题 -\n1. 函数在\
  \ `__` 上将控制权返回给调用函数。\n2. 要向调用函数返回任何内容，可以使用 `_____________`。\n3. 函数的参数列表使用 `______`\
  \ 分隔。\n4. C 语言中函数的默认返回类型是 `_____________`。\n5. 在 C 语言中，传递函数的所有参数都是通过 `______` 传递的。\n\
  6. 引用传递可以通过 `_____________` 实现。\n7. `main` 是一个 `__________________________` 函数。\n\
  8. `_______________________________` 在函数中是强制性的。\n9. `__________________` 是函数调用自己的能力。\n\
  10. 程序停止的点被称为 `________________`。\n11. 递归使用的比迭代方法消耗更多的 `___________` 内存。\n\n已解程序（Images/0854.jpeg）\n\
  \n1. 编写一个程序通过用户定义的函数计算数字 `n` 的幂 `p`。\n```c\nint pow(int,int);/*声明*/\nmain()\n{\n\
  \    int n,i,ans,p;\n    printf(\"Enter numbers: \");\n    scanf(\"%d %d\",&n,&p);\n\
  \    ans=pow(n,p);/*调用*/\n    printf(\"%d to the power %d is %d\",n,p,ans);\n}\n\
  int pow(int n,int p)/*定义*/\n{\n    int i,ans=1;\n    for(i=1;i<=p;i++)\n       \
  \ ans=ans*n;\n    return(ans);\n}\n```\n\n2. 编写一个程序使用递归函数计算两个数字的最大公约数。\n```c\nint\
  \ gcd(int, int);\nmain()\n{\n    int n,m;\n    int ans;\n    printf(\"\\n Enter\
  \ two integer numbers\");\n    scanf(\"%d %d\",&n,&m);\n    ans = gcd(n,m);\n  \
  \  printf(\"GCD of %d and %d is %d\",n,m,ans);\n}\nint gcd(int n, int m)\n{\n  \
