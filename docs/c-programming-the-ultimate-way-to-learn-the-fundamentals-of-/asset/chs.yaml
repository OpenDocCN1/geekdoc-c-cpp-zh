  \ ![11](img/image00822.jpeg)\n\n## 关于作者\n\nHarry, H. Chaudhary 是一位印度计算机编程专家、畅销 Java\
  \ 教程以及科学黑客专业人士，在计算机编程、黑客和网络安全领域拥有独特经验。\n\n他曾帮助全球许多国家的政府和许多跨国软件公司保护其网络和安全。他编写了多本关于各种编程语言以及计算机安全与黑客的书籍。他因其国际畅销的编程书籍《核心\
  \ Java 专业》（Core Java Professional）而闻名。\n\n他是一位技术毕业的软件工程师硕士。他是 C 编程、C++ 编程以及核心 Java、数据结构和算法领域的领先权威。他编写过广受赞誉的\
  \ C 和 C++、`C#` 及 `Java` 书。他拥有 5 年以上的软件方法论经验。他的教学和研究兴趣领域在人工智能、编程语言。\n\n他过着两种生活。一种生活中，他是一家正直软件公司的计算机程序编写员；另一种生活在计算机中，他以黑客代名“Harry”行事，并涉及几乎所有的计算机犯罪。目前，他在著名的\
  \ Anonymous International 社区担任线下 IT 经理。\n\n## 作者自述\n\n你可能注意到这里漏掉了一些东西：没有令人印象深刻的资历。我没有在某所著名大学担任过四分之一世纪的教授；我也不是硅谷巨头的高管。在某些方面，我只是一个技术的学生，就像你一样。\n\
  \n我多年的经验告诉我，许多最了解技术工作原理的人，在解释他们所知知识时，能够让我理解的方式，其成功率往往相当有限。我的兴趣，我相信我的技能，并不在于成为专家，而在于成为一名教育工作者，以一种合理、易于理解且读起来有趣的形式呈现复杂信息，这就是我的书籍。\n\
  \n“什么是真实？你如何定义真实？如果你谈论的是你能感觉到的、能闻到的、能尝到的和看到的，那么真实仅仅是是由……解释的电信号……”\n\n\n## 前言\n\n\
  ∞ 核心 C 编程技能——轻松学会！∞\n\n从畅销编程书籍 Harry. H. Chaudhary 手中，在短时间内掌握 C 编程的所有基础和高级特性。本书从基础开始；我保证这本书将让你成为\
  \ 100% 的 C 编程专家冠军。\n\n任何人都可以通过本书以专家水平学习 C 编程。工程学生和新开发者也可以本书。在软件开发章节，我解释了一个现场软件项目。\n\
  \n\n\n\n\n本书涵盖了 BCA、MCA、B.TECH、M.TECH、BS (CS)、MS (CS)、BSC-IT (CS)、MSC-IT (CS) 以及计算机科学专业人士和黑客的核心大纲。书中包含了\
  \ 1000 多个实时 C 程序代码示例、500 多个实验练习、200 多个主题洗脑代码书，以及 20 多个实时软件开发项目。这就是你需要的一切！不是吗？\n\n\
  这本书是一本非常严肃的 C 语言书籍：C 语言的完整介绍。你将学习从基础知识到高级主题的所有内容。如果你读过这本书，你就知道该期待什么——一种视觉丰富的格式，专为你大脑的工作方式而设计。如果你没读过，那你大有福了。你会发现为什么人们说它和你读过的任何其他\
  \ C 书都不同。\n\n学习一种新语言并非易事。你可能会认为问题出在大脑上。它似乎有自己的主意，并不总是愿意接受你被迫学习的那些枯燥、技术的内容。\n\n事实是，你的大脑渴望新奇感。它不断地寻找、扫描，等待不常的事情发生。毕竟，它是这样被设计的，为了帮助你生存。它将所有常规、普通、无味的内容过滤到背景中，这样它们就不会干扰大脑的真正工作——记录重要的事情。大脑是如何知道什么是重要的呢？\n\
  \n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 ∞ 1 章\n## (C 语言简介)\n\n# 引言\n\n###\
  \ 关于语言层次你需要了解的\n\n编程语言有不同的层次，取决于它们与人类语言的相似程度。使用常用单词且对大多数人来说容易阅读和学习的编程语言被称为高级语言。相反是低级语言，它们并不容易阅读或学习。\n\
  \n高级语言包括流行的 `BASIC` 编程语言，以及其他已不再流行的语言。`BASIC` 读起来几乎像英语，所有的命令和指令都是英语单词——或者至少是缺少几个元音或严重违背拼写规则的英语单词。\n\
  \n低级编程语言中最低级的是机器语言。那种语言是微处理器本身真实的原始咕声和呻吟。机器语言由微处理器能够理解并执行的数字和代码组成。\n\n因此，没有人真正用机器语言编写程序；相反，他们使用汇编语言，汇编语言比低级机器语言高一级，因为咕声和呻吟是被拼写出来的，而不是以原始数字输入的。\n\
  \n既然有了高级语言，为什么还要使用低级语言呢？速度！用低级语言编写的程序运行速度达到了计算机能运行的最快速度，通常比它们的高级语言快得多。此外，程序体积更小。\n\
  \n用 `Visual Basic` 编写的程序大小可能是 34K，但用汇编语言编写的程序可能只有 896 字节。另一方面，开发一个汇编语言程序的时间比用更高级语言编写相同程序要长得多。这是一种权衡。\n\
  \n`C` 编程语言被认为是一种中级语言。它既有低级的“咕声”和“叫声”，也有许多高级部分，读起来像迈克尔·克莱顿小说小说中的任何句子，但有更丰富的角色刻画。\n\
  \n在 `C` 中，你既获得了高级编程语言的优点和它们提供的开发速度，也获得了低级语言的紧凑程序大小和速度。这就是为什么 `C` 如此酷炫。\n\n注意：不，我不是在开玩笑。`C`\
  \ 是在 20 世纪 70-72 年初于 `AT&T Bell Labs` 开发的。当时，`Bell Labs` 有一种名为 `B` 的编程语言（代表 Bell）。他们创建的下一种语言是\
  \ `C` —— 比 `B` 高一级。\n\n*   `C` 是 `B` 编程语言和一种名为 `BCPL`（代表 Basic Combined Programming\
  \ Language）的语言的后代。但你必须承认，`B` 的故事本身已经足够可爱了。\n*   你可能认为 `C` 的下一个改进版本会被称为 `D` 语言。但不；它被命名为\
  \ `C++`。\n*   `C` 被认为是一种中级语言。关于无聊的细节，请旁边的侧栏“关于语言层次你不需要了解”。\n*   在 `Bell Labs` 创建\
  \ `C` 编程语言的家伙是 `Dennis Ritchie`。我提到他是以防你某天在街上走时恰好遇到 Ritchie 先生。在这种情况下，你可以说：“嘿，你不是\
  \ Dennis Ritchie 吗？那个发明 `C` 的家伙？”他会说：“为什么——为什么，是的我是。”然后你可以说：“酷。”\n\n### C 语言的历史\n\
  \n`C` 编程语言也许是最流行的编程语言。`C` 是于 1972 年由 `Dennis Ritchie` 在美国的 `Bell Labs` 创建的，作为 `UNIX`\
  \ 操作系统的一部分。`C` 也被用于开发该操作系统的部分部分。20 世纪 60 年代，名为 `B` 语言的 `Basic Combined Programming\
  \ Language (BCPL)` 在剑桥大学开发。\n\n它并不是一种完全满意的语言。`B` 语言经过 `Dennis Ritchie` 修改后，于 1972\
  \ 年在 `bell laboratory` 实现。`C` 通常被大多数编译器支持。`C` 是系统程序员 `Dennis Ritchie` 在 1972 年在\
  \ `美国电话电公司 (AT & T) 贝尔实验室` 开发的。\n\n本课程你可以使用以下编译器或编程环境：\n\n*   `UNIX` 和 `Linux` 操作系统中的\
  \ `G` 和 `cc`。\n*   `DOS` 操作系统中的 `Borland C` 或 `Turbo C`。\n*   `Bloshed Dev-Cpp`\
  \ 集成开发环境 (IDE) 为你提供了一个完整且紧凑的编程环境。\n*   它带有 `MinGW` 和 `GCC` 编译器。\n\n\n\n\n\n# 程序员的工作就是编写一些代码！编写执行什么的代码？你使用什么种类型的代码？密码？摩斯电码？邮政编码？\n\
  \n计算机程序的目的是让计算机执行某些操作。\n\n编程的目标是“让它实现”。`C` 语言只是与个人电脑（PC）通信的工具。\n\n作为程序员，你的工作是将计算机用户的意图翻译成计算机能理解的内容，然后给用户他们想要的东西。如果你不能给他们想要的东西，至少让它足够接近，这样他们就不会不断抱怨，或者——更糟——要求退款。\n\
  \n你所选择的实现这一目标的工具是 `C` 编程语言。这就是你用来与个人电脑通信的代码。接下来的章节将描述这一过程是如何运作的。毕竟，你完全可以拿起鼠标说：“你好，计算机！”\n\
  \n*   编程是电视网络高管所做的事情。计算机程序员编写代码（`Code`）。\n*   你使用编程语言与计算机通信，确切地告诉它该做什么。\n\n## 源代码\
  \ -（文本文件）\n\n由于计算机无法听懂语言，而且，嗯，猛打电脑——无论这对你的情感上有多大的宣泄作用——对个人电脑几乎毫无帮助，所以你最好的通信方式是给电脑写字条，即磁盘上的一个文件。\n\
  \n要创建一个个人电脑信函，你使用一个名为文本编辑器的程序。这个程序是文字处理器的原始版本，去掉了所有花哨的格式和打印控制。文本编辑器让你输入文本——仅此而已。\n\
  \n使用你的文本编辑器，你创建了所谓的源代码文件。这个文件唯一的特殊之处在于它包含了告诉计算机该做什么的指令。\n\n尽管如果能写像“发一个好笑的声音”这样的指令会很好，但事实是，你必须用计算机能理解的语言编写指令。在这种情况下，指令是用\
  \ `C` 语言编写的。\n\n*   源代码文件是磁盘上的文本文件。该文件包含了用 `C` 编程语言编写的计算机指令。\n*   你使用文本编辑器来创建源代码文件。有关文本编辑器的更多信息，请参见附录\
  \ A。\n\n### 创建 GoodbyeHarry.C 源代码文件：\n\n使用你的文本编辑器创建以下源代码。仔细按照原文逐行准确输入；你在下方看到的所有内容都是重要且必要的。不要遗漏任何内容——\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{printf(\"Goodbye Harry, cruel world!\\\
  n\");\n\nreturn(0);\n}\n```\n\n当你检查你输入的内容时，注意其中有多少对你来说是熟悉的。你识别了一些单词（`include`、`main`、“GoodbyeHarry,\
  \ cruel world!” 和 `return`），有些单词对你来说很陌生（`stdio.h`、`printf` 和那个 `\\n` 东西）。\n\n当你写完指令后，将它们保存到磁盘上的文件中。将文件命名为\
  \ `GOODBYEHARRY.C`。使用你文本编辑器中的命令保存此文件，然后返回命令行提示符将你的指令编译成程序。\n\n### 你需要记住的 -\n\n*\
  \   在 Windows 记事本中，你必须确保文件以 `.C` 结尾而不是 `.TXT`。找找一本关于 Windows 的书来获取关于显示文件名扩展名的说明，这使得以\
  \ `.C` 扩展名将文本文件保存到磁盘变得更容易。\n*   注意文本大部分是小写。（此处重复了大量次数“Note that the text is mostly\
  \ in lowercase.”，在翻译中已按原文逻辑处理）。\n\n\n\n\n\n典型的编译器由几个主要组件组成。第一个组件是 `scanner`（也称为词法分析器）。`Scanner`\
  \ 读取程序并将其转换为标记（tokens）字符串串。\n\n第二个组件是 `parser`（解析器）。它将标记字符串转换为解析树（或抽象语法树），该树捕获了程序的语法结构。下一个组件是语义例程，用于解释语法结构的语义。随之后的是代码优化和最终的代码生成。\n\
  \n# 什么是汇编器？\n\n`Assembler` 是一种将汇编语言翻译为机器码的软件或工具。因此，汇编器是一种编译器，其源代码是用汇编语言编写的。\n\n\
  `Assembly` 是一种人类可读的语言，但它通常与对应的机器码是一一对应的关系。因此，汇编器被认为执行的是同构（一对一映射）翻译。高级汇编器提供了支持程序开发和调试过程的额外功能。例如，被称为\
  \ `macro assemblers`（宏汇编器）的汇编器提供了宏功能。\n\n# 汇编器和编译器有什么区别？\n\n`Compiler`（编译器）是一种读取用一种语言编写并并翻译成另一种语言的计算机程序，而汇编器可以被视为一种特殊的编译器，它只将汇编语言翻译为机器码。`Compilers`\
  \ 通常直接从高级语言生成机器可执行代码。\n\n但汇编器产生的是目标代码，这可能需要使用 `linker`（链接器）程序进行链接才能在机器上运行。因为 `Assembly`\
  \ 语言与机器码是一一对应的，所以汇编器可用于在性能极其重要的场合产生运行高效的代码（例如图形引擎、与个人电脑相比硬件资源有限的嵌入式系统，如微波炉、洗衣机等）。\n\
  \n## 区别：\n\n| | 汇编器 (Assembler) | 编译器 (Compiler) |\n| :--- | :--- | :--- |\n| 1.\
  \ | 它将如 `PRN`、`ADD` 和 `SUB` 等助记码翻译为机器语言代码。 | 它将高级语言翻译为汇编语言。 |\n| 2. | 使用汇编器执行程序更快，因为它直接将源代码转换为机器语言。\
  \ | 执行程序需要时间，因为它首先将源代码翻译成另一种编译器的语言，然后使用汇编器将其转换为机器语言。 |\n\n## 编译器和解释器之间的区别\n\n`interpreter`（解释器）类似于逐句翻译，而\
  \ `compiler` 类似于对整篇文章进行翻译。\n\n| | 编译器 (Compiler) | 解释器 (Interpreter) |\n| :--- |\
  \ :--- | :--- |\n| 1. | `Compiler` 在执行之前将整个高级语言程序一次性翻译成机器语言程序。这优化了翻译程序中使用机器语言指令。因此，通常编译程序的运行速度比解释程序快。原始高级语言程序称为源程序。编译器翻译后生成的程序（即机器语言程序）称为目标程序。\
  \ | `Interpreter` 在执行程序时逐指令地将用高级语言编写的程序翻译成机器语言。也就是说，它读取程序中编写的第一条指令并将其转换为等效的机器语言指令。然后\
  \ CPU 执行这些机器语言指令。之后，`Interpreter` 读取并翻译下一条指令，依此类推。 |\n| 2. | `Compiler` 以整个程序作为输入。\
  \ | `Interpreter` 以单条指令作为输入。 |\n| 3. | 目标代码被永久保存供以后使用。 | 不保存目标代码供以后使用。 |\n| 4. |\
  \ 非耗时的翻译方法。 | 耗时的翻译方法。 |\n| 5. | 在计算机中需要大量空间。 | `Interpreter` 易编写且不需要大量的内存空间。 |\n\
  | 6. | `compiler` 的速度非常快。 | 速度非常慢。 |\n| 7. | 编译后源程序的任何更改都需要重新编译整个代码。 | 翻译过程中源程序的任何更改不需要重新翻译整个代码。\
  \ |\n| 8. | 生成中间目标代码。 | 不生成中间目标代码。 |\n| 9. | 条件控制语句执行较快。 | 条件控制语句执行较慢。 |\n| 10.\
  \ | 内存需求：更多（因为生成了目标代码）。 | 内存需求较少。 |\n| 11. | 程序不需要每次都编译。 | 每次都将高级程序转换为低级程序。 |\n\
  | 12. | 在检查完整个程序后显示错误。 | 每解释每条指令时都会显示错误（如果有）。 |\n| 13. | 示例：`C Compiler`。 | 示例：`BASIC`。\
  \ |\n\n# 解析：编译器 VS 解释器\n\n只需理解编译器和解释器的概念——\n\n1. 我们将完整程序作为输入交给 `compiler`。我们的程序是人类可读的格式。\n\
  2. 人类可读格式经过许多[编译器的阶段和过程](http://www.c4learn.com/c-programming/what-is-compiler/)，最终转换为机器可读格式。\n\
  3. 然而，`interpreter` 每次读取一行代码作为输入并执行该行。它一旦发现错误就会停止代码的执行。\n4. 在[解释器的情况下](http://www.c4learn.com/c-programming/what-is-interpreter/)，内存需求较少，因为解释器不会创建目标代码。\n\
  \n**学习笔记** – 大多数学生真的并不知道 `Compiler` 和 `Interpreter` 之间的区别。学习一种新语言并不容易。你可能认为问题出在大脑上。这就是为什么我尝试用许多形式来解释差异。\n\
  \n`Compiler` 和 `Interpreter` 都实现相同的目的——将高级语言转换为计算机硬件可以理解的二进制形式。它们是用于执行高级程序和代码以完成各种任务的软件。特定的编译器/解释器为不同的高级语言设计。\n\
  \n然而，`compiler` 和 `interpreter` 具有相同的目标，但它们完成任务的方式（即将高级语言转换为机器语言）不同。请仔细查看下方内容。\n\
  \n### 编译器\n\n[compiler](https://www.engineersgarage.com/articles/what-is-compiler-tutorial)\
  \ 是将高级语言翻译成机器语言的代码。当用户用 `Java` 等高级语言编写代码并希望执行它时，在执行之前会使用专为 `Java` 设计的编译器。`compiler`\
  \ 首先扫描整个程序，然后将其翻译成机器码，由计算机处理器执行并完成相应的任务。\n\n```\n![Compiler working](img/image00825.jpeg)\n\
  ```\n\n图中显示了编译过程的基本概述，这里用高级语言编写的程序称为源程序，转换后的称为目标程序。\n\n### 解释器\n\n解释器与编译器没有太大区别。它们将高级语言转换为机器可读的二进制等效物。每当解释器获取要执行的高级语言代码时，它在转换为机器码之前会将代码转换为中间代码。代码的每个部分被解释并按顺序单独执行，如果在代码某部分发现错误，它将停止解释代码而不翻译下一组代码。\n\
  \n```\n![Interpreter working](img/image00826.jpeg)\n```\n\n\n\n\n\n# 1. C 是一种通用编程语言。你可以生成游戏、业务软件、实用程序、数学模型、文字处理器、电子表格和其他种类的软件。\n\
  2. C 是一种结构化编程语言。它使用结构化语句（如 `while`、`for` 循环）来代替会导致程序错误（bug）的 `goto` 语句。\n3. 系统独立性-C\
  \ 不需要操作系统的服务，它可以独立运行。C 可以运行在任何操作系统上。\n4. 高效率-C 编译器通常能够将源代码翻译成高效的机器指令。C 语言的数据和控制机制与大多数小型计算机和微型计算机非常匹配。\n\
  5. 系统编程-C 用于系统编程，即编写操作系统。UNIX 操作系统也是用 C 语言重写的。\n\n## 语法与语义的区别\n\n| 语义 (Semantics)\
  \ | 语法 (Syntax) |\n| :--- | :--- |\n| 它是程序的逻辑或规划。语义可以用以下任何方式编写：1. 流程图。2. 算法。3. 伪代码。\
  \ | 它是使用特定编程语言编写程序的方法。语法随语言而变化。 |\n\n## 流程图 (FLOWCHART)\n\n它是程序逻辑的符号表示法。逻辑中使用一些预定义的符号。流程图显示了程序逻辑的实际流。\n\
  \n流程图无非解决问题所涉及的各种步骤的图示表示。流程图指示了过程流的方向、相关操作和计算、决策点以及解决方案的其他信息。一旦开发并经过适当检查，流程图为编写程序提供了极佳的指导。\n\
  \n![](img/image00827.jpeg)\n\n## 算法 (ALGORITHMS)\n\n一旦定义的问题，就必须开发一个详细的、有限的、分步的程序来解决它。这种程序被称为算法。算法可以用普通语言编写，也可以介于普通语言和编程语言之间的正式过程。\n\
  \n### 两个数相加的算法 –\n\n1. 读取 `A`, `B`。\n2. 设置 `SUM := A+B`。\n3. 写入 `SUM`。\n4. 退出。\n\
  \n## 伪代码 (PSEUDOCODE)\n\n有时，将算法翻译成流程图和源代码之间的中间形式是有必要的。伪代码是源代码的英语近似，它遵循语言的规则、风格和格式，但忽略了大多数标点符号。\n\
  \n```\nmain()\n{\n    integer a,b,sum;\n    read in a and b;\n    add a & b and\
  \ set it to sum;\n    write sum;\n}\n```\n\n## C 程序的结构（源代码）\n\n让我们通过一个例子来讨论 C 程序的结构：\n\
  \n```c\n/*sum of two numbers*/\n#include<stdio.h>                           /* 用于\
  \ printf() & scanf() */\n#include<conio.h>                           /* 用于 clrscr()\
  \ & getch() */\nmain()                                      /* 程序执行的起点*/\n{\n  \
  \  int a,b,sum;                            /* 变量声明 */\n    clrscr();           \
  \                    /* 清屏 */\n    printf(\"enter two numbers\");             /*\
  \ 请求输入 */\n    scanf(\"%d %d\",&a,&b);                   /* 从用户输入 */\n    sum=a+b;\
  \                                /* 两个数相加 */\n    printf(\"sum=%d\",sum);      \
  \              /* 输出 */\n    getch();                                /* 保持输出 */\n\
  }                                           /* main 结束 */\n```\n\n## C 程序的解释\n\n\
  ### 头文件故事 (STORY OF HEADER FILES)\n\n头文件包含函数和变量的定义，可以通过预处理器语句 `#include` 将其整合到任何\
  \ C 程序中。每个编译器都提供了标准头文件，涵盖了字符串处理、数学、数据转换、打印和读取变量等多个领域。\n\n要使用任何标准函数，都应该包含相应的头文件。这在\
  \ C 文件的开头完成。例如，在程序中使用 `printf()` 函数，行代码 --\n`#include <stdio.h>`\n\n应该位于源文件的开头，因为\
  \ `printf()` 的定义可以在 `stdio.h` 文件找到。所有头文件都有 `.h` 扩展名，通常位于 `/include` 子目录下。\n\n`#include\
  \ <stdio.h>`\n`#include \"mydecls.h\"`\n\n使用角括号 `<>` 告诉编译器在编译器的包含目录中搜索指定的文件。在文件名周围使用双引号\
  \ `\"\"` 则告诉编译器在当前目录搜索指定的文件。\n\n### 键盘输入 (KEYBOARD INPUT)\n\nC 语言中有一个函数允许程序员接受键盘输入。以下程序说明了该函数的使用：\n\
  \n```c\n#include <stdio.h>\nmain()                                  /* 引入键盘输入的程序\
  \ */\n{\n    int number;\n    printf(\"Type in a number \\n\");\n    scanf(\"%d\"\
  , &number);\n    printf(\"The number you typed was %d\\n\", number);\n}\n```\n\n\
  定义了一个名为 `number` 的整数。然后使用语句\n`printf(\"Type in a number \\n:\");` 打印输入数字的提示。\n\n\
  `scanf` 例程接受响应，它有两个参数。第一个参数 `\"%d\"` 指定了预期的数据类型（例如 `char`、`int` 或 `float`）。\n\n\
  第二个参数 `&number` 指定了将输入的响应放置于哪个变量。在这种情况下，`&` 字符意味着“……的地址”。\n\n\n\n\n\n“%i %i”中两个“%i”之间的空格是重要的：它告诉\
  \ `scanf` 键盘上键入的两个之间可能用空格隔开。如果使用的是“%i,%i”，则用户将被强制在两个数字之间输入一个逗号。\n\n字符 `\\` 后紧跟 `\\\
  n` 的序列是 C 处理换行的方式。打印时，它会导致光标移动到下一行的开头。\n\n### 返回 (Return)\n`Return` 导致值（此处为 `0`）传回给操作系统。操作系统如何处理此信息取决于它。例如，MS-DOS\
  \ 将其存储在 `ERRORLEVEL` 变量中。UNIX 的 Bourne 和 Korn shell 将其存储在临时变量 `$?` 中，该变量可以在 shell\
  \ 脚本中使用。“传统”上认为 `0` 表示成功。\n\n值 `1`、`2`、`3` 等表示失败。所有的操作系统都支持高达 `255` 的值。某些支持高达 `65535`\
  \ 的值，尽管如果你对可移植性很重要，应该只使用 `0` 到 `255` 之间的值。\n\n### &\n`&` 对于 `scanf` 来说非常重要。它允许修改涉及的变量，这也被称为取地址符（Ampersand）。因此在--\n\
  \n```c\nscanf(\"%i\", &j)\n```\n\n`&` 允许变量 `j` 发生改变。没有这个看似神秘的字符，C 会阻止 `scanf` 修改\
  \ `j`，它将保留保留之前拥有的随机值（除非你记得初始化了它）。由于 `printf` 不需要更改它所打印的任何变量的值，因此它不需要任何 `&` 符号。因此，如果\
  \ `j` 包含 `15`，在执行语句后：\n\n```c\nprintf(\"%i\", j);\n```\n\n我们很有信地预期变量中是 `15`，因为 `printf`\
  \ 无法修改它。\n\n### C 的格式\n*   语句以分号结束。\n*   编译器忽略缩进。\n*   C 是大小写敏感的 - 所有的关键字和标准。\n\
  *   库函数均为全小写。\n*   字符串放置在双引号中。\n*   换行通过 `\\n` 处理。\n*   程序能够标记成功或错误，那些忘记这么做的程序只能随机选择一种！\n\
  \n### 分号\n分号在 C 中非常重要。它们构成了语句终止符，告诉编译器一个语句在哪里结束，另一个语句在哪里开始。如果你没有在每个语句后放置分号，你将得到编译错误。\n\
  \n### 自由格式 (Free Format)\nC 是一种自由格式的语言。这就是在处处使用分号的优点。将一个语句跨两行写并没有问题 - 你只需要不要在语句中间放置分号即可（反正你在那里也不会放分号）。\n\
  \n在示例程序中被仔细放置的空格和制表符会被编译器忽略。缩进完全是可选的，但应该用来提高程序的可读性。\n\n### 大小写敏感\nC 是一种大小写敏感的语言。虽然\
  \ `int` 可以编译，但 “Int”、“INT” 或任何其他变体都不行。所有 40 个左右的 C 关键字都是小写的。标准库中所有的数百个函数都是小写的。\n\
  \n### 随机行为\n既然说明了 `main` 要向操作系统返回一个整数，如果忘记这样做（通过只写 `return` 或完全省略返回语句）将导致向操作系统返回一个随机整数。\n\
  \n这个随机值可能是 0（成功），在这种情况下，你的程序可能会随机成功。更有可能是一个非零值，它将随机指示失败。\n\n练习笔记 - WAP 意味着“编写程序”（Write\
  \ a Program），关于主题的编程示例请参见此书的最后章节。\n\n![](img/image00828.jpeg)\n\n#### 上述 C 程序的的重要特征：\n\
  1. C 程序的指令用小写字母，但变量和用户定义的项可以用大写字母。\n2. 该程序的第一行是注释。每个注释都以斜杠和星号 (`/*`) 开始，并以星号和斜杠\
  \ (`*/`) 结束。注释帮助程序员解释程序的逻辑。它提高了程序的可读性。\n   这些注释可以放置在程序的任何位置。编译器不读取这些注释。不允许嵌套注释。注释是对程序中语句的解释，以提高程序的可读性。\n\
  3. 注释不是必须的；但良好的做法是在程序开始时写一条注释，说明程序的目的、作者以及编写程序的日期。\n在程序的任何地方都可以编写任意数量的注释，例如，可以在\
  \ --- 语句之前、语句之后或语句内部编写注释。注释可以跨越多行编写，这被称为多行注释。\n4. 程序的第二和第三行被称为头文件 (`stdio.h` 和 `conio.h`)，它们包含了在编译之前必须包含在程序中的信息。#`\
  \ 是预处理器指令或编译器指令。该语句指示编译器在编译程序之前包含头文件。我们也可以把 `<stdio.h>` 写为 “stdio.h”。\n5. 每个 C 程序都由一个或多个称为函数的模块组成。其中一个函数被称为\
  \ `main()`。程序的执行从 `main` 函数开始，它可能会调用其他函数。整个程序写在花括号括起来的 `main` 函数中。使用多一个 `main()`\
  \ 是非法的。\n6. 变量的声明紧接程序左括号之后完成。我们不能在程序的中间声明变量。\n7. 注意 main 函数中的每个语句都以分号 (`;`) 结束。\n\
  8. 下一个是 `printf()` 语句：`printf(\"Enter numbers\");` `printf` 是一个输出命令，要求输入数字。此消息被称为“提示消息”，并打印在屏幕上。\n\
  9. 通过下一个语句 `scanf(\"%d %d\",&a,&b);` 从用户处获取值。`scanf` 是一个输入命令，根据指定的格式符获取值并存储在目标变量中。`&`\
  \ 被称为地址符。\n10. 下一个是赋值语句 `sum=a+b;` 将变量 `a` 和 `b` 的值相加并赋值给变量 `sum`。\n11. 最后一个 `printf()`\
  \ 用于在屏幕上显示计算值 `sum`。\n12. 最后 `getch()` 函数用于显示屏幕。\n13. `main()` 内部的所有语句相对于 `main()`\
  \ 偏移。这被称为缩进。这显示所有语句都在 `main()` 函数内部。\n\n![](img/image829.jpeg)\n\n### 单选题：\n1. C\
  \ 是一种：a. 高级语言。b. 低级语言。c. 中级语言。d. 汇编语言。\n2. 程序的逻辑被称为：a. 语法。b. 语义。c. 流程图。d. 调试。\n\
  3. C 语言由 a. Ken Thompson。b. Dennis Ritchie。c. Patrick Naughton。d. Ed Frank 开发。\n\
  4. 流程图用于决定：a. 解决涉及涉及步骤。b. 制作算法的辅助。c. 准备决策表。d. 调试程序。\n5. C 程序借助 - 转换为机器语言：a. 编辑器。b.\
  \ 编译器。c. 操作系统。d. 以上都不是。\n6. C 可以用于：a. 仅 MS-DOS 操作系统。b. 仅 Linux 操作系统。c. 仅 Windows\
  \ 操作系统。d. 以上都是。\n\n| 答案：1(c) 2(b) 3(b) 4(a) 5(b) 6(d) |\n\n\n\n\n\n![very-small-rose](img/image00819.jpeg)\
