  \ ![11](img/image00863.jpeg)\n\n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 12\
  \ 章 ∞\n## (C 语言文件处理)\n\n# 引言\n到目前，我们一直使用 `scanf` 和 `printf` 函数来读写数据。这些是面向控制台的输入输出函数，始终使用键盘和屏幕作为目标。在数据量较小时这很好。但在现实问题中涉及大量数据，在这种情况下面向控制台的输入输出操作有两个主要问题：\n\
  \nA. 处理大量数据非常耗时。\nB. 程序一关闭或计算机关闭，所有数据都会丢失。\n\n为了克服这些问题，我们使用文件处理。文件可以用于将数据存储在硬盘上，这样就可以永久保存，即使计算机关闭也不会被删除。\n\
  \n文件可以定义为磁盘上存储一组相关数据的地方。对文件可以执行许多操作：\n* 命名文件。\n* 打开文件。\n* 从文件中读取数据。\n* 向文件中写入数据。\n\
  * 关闭文件。\n\n让我们来看看文件的一些函数：\n\n| 函数名 | 操作 |\n| :--- | :--- |\n| `fopen()` | 创建一个新文件或打开一个现有文件使用。\
  \ |\n| `fclose()` | 关闭文件。 |\n| `fgetc()` | 从文件中读取一个字符。 |\n| `fputc()` | 向文件中写入一个字符。\
  \ |\n| `fprintf()` | 向文件中写入数据。 |\n| `fscanf()` | 从文件中读取数据。 |\n| `fgetw()` | 读取一个整数。\
  \ |\n| `fputw()` | 写入一个整数。 |\n| `fseek()` | 将位置设置到文件中指定的点。 |\n| `ftell()` | 给文件中当前的位置（即从开始计算的字节数）。\
  \ |\n| `rewind()` | 将位置设置到文件的开头。 |\n| `fwrite()` | 向文件中写入数据。 |\n| `fread()` | 从文件中读取数据。\
  \ |\n| `feof()` | 测试是否已到达文件结束。 |\n| `fflush()` | 刷新流。 |\n| `remove()` | 删除指定的文件。\
  \ |\n| `rename()` | 更改文件名或路径。 |\n| `perror()` | 测试文件中是否发生了错误。 |\n\n### 打开文件\n在我们从硬盘上的文件读取或向其写入信息之前，我们必须打开文件。使用\
  \ `fopen()` 函数并指定一个模式，告诉编译器我们将写入、读取或修改文件。此 `fopen()` 函数执行三个任务：\n* 在磁盘上搜索文件。\n* 然后它将文件从磁盘加载到名为\
  \ `buffer`（缓冲区）的地方。\n* 它设置一个字符指针，该指针指向缓冲区中的第一个字符。\n\n#### 缓冲区的需要\n`buffer` 是计算机内存中的临时区域，文件在该处保留一段时间，以便快速访问进行读写。如果每次都去硬盘读取一个字符并打印到屏幕上，效率将会很低。（此处注：由于原文中存在大量重复段落，已根据指令去重处理）\n\
  \n`buffer` 是计算机内存中的临时区域，文件在该处保留一段时间，以便快速访问进行读写。如果每次都去硬盘读取一个字符并打印到屏幕上，效率将会很低。\n\n\
  （此处省略重复段落翻译）\n\nIt sets a character pointer which will point the first character\
  \ in the buffer.\n\n\n\n\n\n要关闭文件，我们不需要文件名。`fclose()` 函数执行以下三个主要任务：\n\n- 缓冲区中的字符将被写入磁盘上的文件。\n\
  - 在文件末尾将写入一个 ASCII 值为 26 的字符。\n- 缓冲区将从文件中被消除（释放）。\n\n### 1. 写一个程序来统计文件中字符、空格、制表符、换行符的数量。\n\
  \n```c\n#include<stdio.h>\n\nmain( )\n{\n    FILE *fp;\n    char ch;\n    int lines=0,tab=0,space=0,\
  \ characters=0;\n    fp=fopen(“text.c”,”r”);\n    while(1) /* infinite loop*/\n\
  \    {\n        ch = fgetc(fp);\n        if(ch ==EOF)\n            break;\n    \
  \    characters++;\n        if(ch == 32)\n            space++;\n        if(ch ==\
  \ ‘\\n’)\n            lines++;\n        if(ch == ‘\\t ’)\n            tab++;\n \
  \   }\n    fclose(fp);\n    printf(“number of lines = %d\\ntabs = %d\\ncharacters\
  \ = %d\\nspaces = %d”,lines,characters,spaces);\n    getch( );\n}\n```\n\n### 2.\
  \ 写一个程序从键盘接收一些字符串并将其打印到文件中\n\n```c\n#include<stdio.h>\nmain( )\n{\n    FILE *fp;\n\
  \    char s[0];\n    fp=fopen(“text.c”,”w”); /*opening file*/\n    if(fp ==NULL)\
  \ /*to opening errors*/\n    {\n        puts(“file opening”);\n        exit();\n\
  \    }\n    printf(“Enter some text”);\n    while(strlen(s))>0)\n    {\n       \
  \ fputs(s,fp);\n        fputs(“\\n”,fp);\n    }\n    fclose(fp);\n}\n```\n\n###\
  \ 3. 写一个程序从文件中读取所有字符串并将其打印到屏幕上\n\n```c\n#include<stdio.h>\nmain( )\n{\n    FILE\
  \ *fp;\n    char s[50];\n    fp=fopen(“text.c”,”r”); /*opening file*/\n    if(fp\
  \ ==NULL) /*to opening errors*/\n    {\n        puts(“file opening error”);\n  \
  \      exit();\n    }\n    while(fgets(s,49,fp)!= NULL)\n        printf(“%s”,s);\n\
  \    fclose(fp);\n    getch( );\n}\n```\n\n### 单选题\n\n| 序号 | 题目 |\n| :--- | :---\
  \ |\n| 1. 如果文件正确关闭，`fclose` 返回什么值： | a. 零 | b. 一 | c. -1 | d. 无 |\n| 2. 用于查看发生错误的函数是\
  \ | a. `perror` | b. `iota` | c. `fseek` | d. 无 |\n| 3. 种模式以读写方式打开文件 | a. `r` |\
  \ b. `i` | c. `w` | d. 无 |\n| 4. 在以下代码中：`FILE *fp;fp = fopen(“trial”, “r”);` `fp`\
  \ 指向 | a. 文件中的第一个字符。 | b. 一个包含字符指针的结构体，该指针指向文件的第一个字符。 | c. 文件名。 | d. 以上均不是。 |\n\
  | 5. 给定：`FILE file_p; file_p=fopen(“text.dat”,”a+”)` 上述错误是 | a. `FILE FILE_p` |\
  \ b. `FILE *file_p` | c. `FILE *file_p` | d. 无 |\n| 6. 关闭文件，我们使用 | a. `fexit(file_p)`\
  \ | b. `fclose` | c. `break` | d. `fclose(file_p)` |\n| 7. 使用哪种条件来测试文件结束条件 | a.\
  \ `eof` | b. `ferror` | c. `feof` | d. 无 |\n| 8. 哪个函数接受文件指针并将位置重置到文件开头 | a. `fseek`\
  \ | b. `rewind` | c. `ftell` | d. 以上都是 |\n\n**答案：** 1(a), 2(a), 3(d), 4(b), 5(c),\
  \ 6(b), 7(c), 8(b)\n\n\n\n\n\n# 定义符号常量\n\n我们已经知道 `#define` 语句可以用于定义常量。因此，常量提供了一种简写形式。`#define`\
  \ 语句可以用于定义宏，即它们可以用于替换这些表达式或语句组。\n\n## 使用宏寻找两个数最大值的程序：\n\n```c\n#include \"stdio.h\"\
  \nmain( ) {\n    FILE *fp;\n    openfile(\"Myfile.txt\",&fp);\n    if(fp == NULL)\n\
  \    printf(\"Unable to open file…);\n}\nopenfile( char *fn, FILE **f)\n{\n    *f\
  \ = fopen( fn, \"r\");\n}\n```\n\n**输出：** 无错误。\n\n在上述打开文件的程序，使用了函数 `openfile()`\
  \ 并传递了两个参数：第一个是文件名，第二个是文件指针。由于文件名是一个字符串，因此一个`character` 类型的指针将接收它，而文件指针 `f` 被声明为\
  \ `FILE` 类型。其中 `FILE` 是一个预定义的结构，由于 `f` 接收的是指针地址，因此它被声明为双级指针。\n\n```c\n#include \"\
  stdio.h\"\n#include \"stdlib.h\"\nmain( ) {\n    FILE *fp;\n    char c;\n    fp\
  \ = fopen( \"Try.c\",\"r\");\n    if(fp == null)\n    {\n        puts(\"Cannot open\
  \ file\");\n        exit( );\n    }\n    while((c = getc(fp))!=EOF);\n    putch(c);\n\
  \    fclose( fp);\n}\n```\n\n**输出：** `null` 必须大写，因为它在 `stdio.h` 中被预定义为 `#define\
  \ NULL 0`。\n\n```c\nmain( ) {\n    char fname[] = \"c:\\\\students.dat\";\n    FILE\
  \ *fp;\n    fp = fopen( fname ,\"r\");\n    if (fp == NULL)printf(\"\\nUnable to\
  \ open file…);\n}\n```\n**输出：** 无错误，但必须包含 `\"stdio.h\"`。\n\n```c\nmain( ) {\n  \
  \  FILE *fp;\n    char str[80];\n    fp = fopen(\"Try.c\",\"r\");\n    while(fgets(str,80,fp)!=\
  \ EOF)\n    fputs(str);\n    fclose(fp);\n}\n```\n**输出：** 错误，因为 `fputs()` 需要两个参数，应写为\
  \ `fputs(str,fp)`，并且由于我们在循环中使用字符串，所以 EOF 的地方应该是 `NULL`。\n\n```c\nunsigned char ch;\n\
  FILE *fp;\nfp=fopen(\"matrix\", \"r\");\nwhile((ch=getc(fp))!=EOF)\n    printf(\"\
  %c\",ch);\nfclose(fp);\n```\n**输出：** `EOF` 在 `\"stdio.h\"` 文件中定义为 `#define EOF -1`，而\
  \ `unsigned char` 的范围是 0 到 255，因此当从文件中读取 `EOF` 时，它无法容纳在 `ch` 中。解决方案是将 `ch` 声明为 `int`。\n\
  \n```c\nunsigned char ch;\nFILE *fp;\nfp=fopen(\"matrix\", \"r\");\nif(!fp)\n{\n\
  \    printf(\"file error\");\n    exit();\n}\nfclose(fp);\n```\n**输出：** 无错误。\n\n\
  ```c\n#include \"stdio.h\"\nmain( ) {\n    unsigned char ch;\n    FILE *fp;\n  \
  \  fp = fopen(\"trial\",'r');\n    while((ch = getc(fp))!=EOF)\n    printf(\"%c\"\
  ,ch);\n    fclose(*fp);\n}\n```\n**输出：** 错误。调用 `fopen` 时的参数 `_mode` 类型不匹配。因为模式必须包含在双引号中。未定义的符号\
  \ `ch`。错误。调用 `fclose` 时的参数 `_stream` 类型不匹配。因为不需要在 `fp` 处使用 `*`。\n\n```c\nmain( )\
  \ {\n    FILE *fp;\n    char name[25];\n    int age;\n    fp = fopen(\"yours\",\"\
  r\");\n    while(fscanf(fp,\"%s %d\",name,&age) !=NULL)\n    printf(\"%s %d\\n\"\
  ,name,age);\n    fclose(fp);\n}\n```\n**输出：** 错误。`fscanf` 中使用了 `NULL` 而非 `EOF`，它将从文件中读取记录，当遇到最后一条记录时会遇到\
  \ `EOF`。\n\n```c\nmain( ) {\n    FILE *fp;\n    char names[20];\n    int i;\n  \
  \  fp = fopen(\"student.dat\",wb);\n    for(i = 0; i<0; i++)\n    {\n        puts(\"\
  \\enter name\");\n        gets(name);\n        fwrite(name,sizeof(name),1,fp);\n\
  \    }\n    close(fp);\n}\n```\n**输出：** 错误。因为 `sizeof` 应该是一个字，且 `fclose` 应该用于关闭文件。\n\
  \n```c\nFILE *fp;\nfp=fopen(\"matrix\",\"r\");\nfseek(fp,20,SEEK_SET);\nfclose(fp);\n\
  ```\n**输出：** 应使用 `20L` 代替 20，因为 `fseek()` 需要一个 long 类型的偏移值。\n\n```c\nFILE *fp;\n\
  char s[80];\nfp=fopen(\"matrix\", \"r\");\nwhile(!feof(fp))\n{\n    fgets(s, 80,fp);\n\
  \    puts(s);\n}\n```\n**输出：** 最后一行 `\"matrix\"` 将读取两次。为了避免这种情况，请使用 `fgets(s,80,fp)`。\n\
  \n## 杂杂话题\n\n# 引言\n\n我们已经知道 `#define` 语句可以用于定义常量。因此，常量提供了一种简写形式。`#define` 语句可以用于定义宏，即它们可以用于替换这些表达式或语句组。\n\
  \n### 使用宏寻找两个数最大值的程序：\n\n```c\n#define max (a,b) a>b?a:b\nmain( ) {\n    int a,b,ans;\n\
  \    printf(\"Enter numbers\");\n    scanf(\"%d %d\",&a,&b);\n    ans = max(a,b);\n\
  \    printf(\"max = %d\",ans);\n}\n```\n\n程序包含一个宏 `max`，它代表 `a>b?a:b`。当程序编译时，表达式\
  \ `a>b?a:b` 会替换标识符 `max`。宏定义通常放在文件的开头，第一个函数定义之前。宏的作用域是全局的。\n\n多行宏也可以通过在除最后一行外的每行末放置反斜杠来定义。这种特性允许将宏表示为复合语句。\n\
  \n### 将变量声明为常量：\n\n我们可能希望某些变量的值在程序执行过程中不改变。这可以通过初始化时使用 `const` 关键字声明变量来实现。\n\n例如\
  \ `const float PI= 3.14;`\n\n该声明告诉编译器，变量 `pi` 的值在程序执行过程中不能改变。\n\n### 将变量声明为 volatile：\n\
  \nANSI 标准定义了另一个限定符 `volatile`，它可以显式地告诉编译器变量的值可能会被某些外部源（程序外部）改变。\n\n`volatile int\
  \ date;`\n\n即使 `data` 没有出现在赋值语句的左侧，它的值也可能被某些外部因素改变。当我们把变量声明为 `volatile` 时，编译器在每次遇到该变量时都会检查其值，以查看是否有外部更改改变了它。\n\
  \n\n\n\n我们经常在程序中使用一些常量。这些常量在程序中可能会出现多次。例如 `pi` 的值应该始终为 `3.14`。因此，它可以这样在程序中使用：\n\n\
  ```c\n#define PI 3.14\n```\n\n这被称为预处理器指令或编译器指令。\n\n正如我们所知道的 `PI` 是一个常量，因此它的值在整个程序中必须保持相同。符号常量也称为常量标识符。以下规则适用于\
  \ `#define` 语句：\n\n*   为了区分变量和符号常量，符号常量使用大写字母。\n*   `#` 和 `define` 单词之间不留空格。\n*\
  \   `define` 单词和符号常量之间需要留一个空格。\n*   符号名称不与数据类型声明。\n*   `#define` 语句不以分号结束。\n*  \
  \ `#define` 语句可以出现在程序的任何地方，但在使用它们之前。但通常它们用在 `main( )` 之前。\n\n## 预处理器指令:-\n\n预处理器正如其名所示，是一个在源代码传递给编译器之前对其进行处理的程序。\n\
  \n### C 预处理器：\n\n预处理器是一系列特殊的语句，它们在编译过程开始时执行。这些语句被称为指令。\n\n一些预处理器包括：\n\n1.  `#include.`:-\
  \ 这用于包含头文件。\n2.  `#define`:- 这条语句用于定义符号常量和宏：即等于表达式的单个标识符。\n\n例如：\n\n```c\n#include<stdio.h>\n\
  #define area length*width\n\nmain()\n{\n    int length, width;\n    printf(\"enter\
  \ length and width\");\n    scanf(\" %d %d\",&length,&width);\n    printf(\"\\n\
  \ area is %d\",area);\n}\n```\n\n3.  `#if`, `#elif`, `#else` 和 `#endif` 允许对源程序进行条件编译，这取决于一个或多个真/假条件的值。它们也与定义运算符结合使用。\n\
  \n例如：\n\n```c\n#if defined(FOREGROUND)\n    #define BACKGROUND 0\n#else\n    #define\
  \ FOREGROUND 0\n    #define BACKGROUND 7\n#endif\n```\n\n4.  `#elif`:- `#elif` 类似于控制语句中使用的\
  \ `else – if` 子句。\n5.  `#else`:-\n6.  `#endif`\n7.  `#ifdef`:- `#ifdef` 等于 `#if\
  \ defined( )`。\n8.  `#ifndef`:- `#ifndef` 等于 `#if!defined`。即“如果未定义”。\n9.  `#undef`:-\
  \ `#undef` 指令用于“取消定义”符号常量或宏标识符；即，它会抵消 `#define` 指令的效果。\n\n例如：\n\n```c\n#define FOREGROUND\
  \ 7\n#define BACKGROUND 0\nmain()\n{\n    ………\n    #undef FOREGROUND\n    #undef\
  \ BACKGROUND\n}\n```\n\nMind Drill 笔记-：`#if`, `#ifdef`, `#ifndef` 必须以 `#endif` 结束。\n\
  \n## 运算符:-\n\n预处理器还包括两个特殊运算符：`defined #` 和 `##`。\n\n### 字符串化运算符 (#):\n\n它允许将宏定义中的形式参数转换为字符串。如果宏定义中的形式参数前面紧跟有此运算符，则相应的实际参数将自动包含在双引号中。\n\
  \n### 标记粘贴运算符 (##):\n\n它会导致宏定义中的各个项目被连接，从而形成单个项目。\n\n示例：\n\n```c\n#define display(i)\
  \ printf(\" x\" #i \"= %f\\n\",x##i)\n```\n\n假设通过编写 `display(3);` 来访问此宏。\n结果将是：`printf(\"\
  x3= %f\\n\", x3);`。\n因此，表达式 `x##i` 变成了变量 `x3`，因为 `3` 是 `i` 的当前值。\n\n## 单选题\n\n1.\
  \ **什么是预处理器指令？**\n   1. 从编译器到程序员的消息。\n   2. 从编译器到链接器的消息。\n   3. 从程序员到预处理器的消息。\n\
  \   4. 从程序员到微处理器的消息。\n   答案：3 从程序员到预处理器\n\n2. **哪些 #define 语句是正确的？**\n   1. `#define\
  \ INCH FEET 12`\n   2. `#define SQR(X) (X);`\n   3. `#define SQR(X) (X)`\n   答案：3\
  \ `#define SQR(X) (X)`\n\n3. **以下哪个不是预处理器指令？**\n   1. `#if`\n   2. `#elseif`\n \
  \  3. `#undef`\n   4. `#pragma`\n   答案：2 #elseif\n\n4. **头文件是：**\n   1. 包含标准库的文件。\n\
  \   2. 包含定义和宏的文件。\n   3. 包含用户定义的文件。\n   4. 位于当前目录的文件。\n   答案：2 包含定义和宏\n\n5. **程序中所有的宏替换都在：**\n\
  \   1. 编译之前\n   2. 编译之后\n   3. 执行期间\n   4. 以上都不是\n   答案：1 编译之前\n\n6. **以下程序的输出是什么：**\n\
  \   ```c\n   #define sqr(x) (x*x)\n   main(){\n       int a,b=3;\n       a=sqr(b+2);\n\
  \       printf(\"%d\",a);\n   }\n   ```\n   输出：预处理时表达式变为 `a=(3+2*3)`。如何定义上面的 sqr\
  \ 宏使得 a 的结果为 25？\n   答案：`#define sqr(x) ((x)*(x))`\n\n7.\n   ```c\n   #define cube(x)\
  \ (x*x*x)\n   main()\n   {\n       int a,b=3;\n       a=cube(b++);\n       printf(\"\
  %d %d\",a,b);\n   }\n   ```\n   输出：27\n\n4.\n   ```c\n   #define MESS junk\n   main(){\n\
  \       printf(\"MESS\");\n   }\n   ```\n   输出：MESS\n\n5. \n   ```c\n   #define\
  \ PRINT(int) printf(\"%d\",int)\n   main(){\n       int x=2,y=3, z=4;\n       PRINT(x);\n\
  \       PRINT(y);\n       PRINT(z);\n   }\n   ```\n   输出：2 3 4\n\n6. **如何定义上面的宏使其输出：x=2\
  \ y=3 z=4**\n   答案：`#define PRINT(int) printf(#int \"= %d\", int)`\n   ```c\n  \
  \ main(){\n       int x=2,y=3, z=4;\n       PRINT(x);\n       PRINT(y);\n      \
  \ PRINT(z);\n   }\n   ```\n   规则是：如果在宏展开中参数名字前面有 `#`，则 `#` 和参数的组合将展开为由实际参数替换的引号字符串。这可以与字符串拼接，以打印程序所需的输出。在展开时，宏变为\
  \ `printf(“x”=%d”,x);`。两个字符串连接，所以效果是 `printf(“x =%d”,x);`。\n\n7.\n   ```c\n   main(){\n\
  \       #ifdef NOTE\n           /*未结束的注释 */\n           int a=10;\n           printf(\"\
  %d\",a);\n       #else\n           int a=20;\n           printf(\"%d\",a);\n   \
  \    #endif\n   }\n   ```\n   输出：20。即使在这种情况下 #ifdef 因为未定义而失败，块是不允许。\n\n8. **以下 typedef\
  \ 有效吗？**\n   答案：无效，因为 typedef 只有在预处理器完成后才起。\n\n9.\n   ```c\n   #define max(a,b)\
  \ (a>b?a:b)\n   main()\n   {\n       int x;\n       x=max(3+2,2+7);\n       printf(\"\
  %d\",x);\n   }\n   ```\n   输出：9\n\n10. **为以下程序写一个宏 PRINT，使其输出：x=4 y=4 z=5**\n  \
  \  ```c\n    main(){\n        int x=4, y=4, z=5;\n        a=1, b=2, c=3;\n     \
  \   PRINT(x,y,z);\n    }\n    ```\n    答案：`#define PRINT(var1, var2, var3) printf(\"\
  \\n\" #var1 \"=%d\" #var2 \"=%d\" #var3 \"=%d\", var1, var2, var3)`\n\n11. **定义宏，使得以下程序输出：DEBUG:\
  \ x=4DEBUG: y=3.140000DEBUG: ch=A**\n    ```c\n    main(){\n        int x=4;\n \
  \       float a=3.14;\n        char ch='A';\n        DEBUG(x, %d);\n        DEBUG(a,\
  \ %f);\n        DEBUG(ch, %c);\n    }\n    ```\n    答案：`#define DEBUG(var,fmt) printf(\"\
  DEBUG\" #var \"=\"+fmt \"\\n\",var)`\n\n12.\n    ```c\n    #define str(x) #x\n \
  \   #define Xstr(x) str(x)\n    #define oper multiply\n    main(){\n        char\
  \ *opername=Xstr(oper);\n        printf(\"%s\",opername);\n    }\n    ```\n    输出：multiply\n\
  \n\n\n\n\n# `#include<conio.h>`: 此命令仅会在指定的目录列表中查找 `conio.h` 文件。\n\n## 2. 说明在预处理阶段\
  \ `swap` 宏会被展开成什么。\n代码可以编译吗？\n\n```c\n#define swap (a, b, c) (c t; t=a; a=b; b=t)\n\
  \nmain()\n{\n    int x=10,y=20;\n    swap (x, y, int);\n    printf(\"%d %d\",x,y);\n\
  }\n```\n\n答案：`(int t;t=a,a=b,b=t;)`\n\n这段代码将无法工作，因为 `t` 的声明不能发生在括号内。\n\n## 3. 你将如何修改上述问题中的\
  \ `swap` 宏，使其能够交换两个整数？\n\n答案：`#define swap(a,b,c) ct;t=a, a=b, b=t;`\n\n## 4. 下面程序的哪一行会报告错误？\n\
  \n1. `#define area( r ) (3.14*r *r);`\n2. `main()`\n3. `{`\n4. `float r=1.0, c;`\n\
  5. `c=area(r);`\n6. `printf(\"%f\",c);`\n7. `if(area(r)= =6.28)`\n8. `printf(\"\
  Matrix\");`\n9. `}`\n\n答案：第 7 行，但真正的罪魁祸首是第 1 行中的分号。展开后，第 7 行变成了 `if((3.14*1.0*1.0);=\
  \ =6.28)`。因此产生错误。\n\n## 5. 在以下声明中变量 `b` 的类型是什么？\n\n`#define floatptr float*`\n`floatptr\
  \ a,b;`\n\n答案：`float` 而不是指向浮点数的指针，因为展开后的声明变为：`float *a,b;`\n\n## 6. 头文件必须以 `.h`\
  \ 结尾吗？\n\n答案：不是，但传统上它们被赋予 `.h` 扩展名，以区别于 `.c` 程序文件。\n\n## 7. 头文件通常包含什么？\n\n答案：预处理器指令，如\
  \ `#define`、`structure`、`union` 和 `enum` 声明、`typedef` 声明、全局变量和外部函数声明。不应在头文件中编写实际代码（即函数体）或全局变量定义。应该使用\
  \ `#include` 指令来引入头文件，而不是引入其他 `.c` 文件。\n\n## 8. 头文件如何确保自己不被包含多次？\n\n答案：所有声明必须按照所示的方式编写。假设头文件名为\
  \ `FUNCS.H`。\n\n```\n#ifndef FUNCS\n#define FUNCS\n#endif\n```\n\n现在如果像下面所示两次包含该文件，它会被包含一次。\n\
  \n## 9. 在包含时，会在哪里搜索头文件？\n\n答案：如果使用 `< >` 包含头文件，将在预定义的包含路径中搜索（该路径也可以更改）。如果在预定义路径之外还使用\
  \ `\" \"` 语法，还会在当前目录（通常是调用编译器的目录）中搜索该文件。\n\n## 判断对错：\n\na. 如果要包含的文件不存在，预处理器会抛出错误信息。\n\
  b. 预处理器可以捕捉简单的错误，如缺少声明、嵌套注释或括号不匹配。\nc. 如果头文件被包含两次会导致错误吗。\nd. 下面程序会无限次打印该信息吗？\n```c\n\
  #define INFINITELOOP while (1)\nmain()\n{\n    INFINITELOOP\n    printf(\"\\nMatrix\"\
  );\n}\n```\ne. 下面程序可以编译吗？\n```c\nmain()\n{\n    printf(\"computers\");\n}\n```\n\
  答案：a. 正，b. 错，c. 错，d. 正，e. 正\n\n---\n\n# 存储类 (Storage Class)\n\n# 引言\n存储类决定变量的内存位置。内存位置可以是：\n\
  1. 主内存 (RAM)。\n2. CPU 寄存器。\n\n它决定变量的默认值（零值或垃圾值）。它还决定变量的作用域和寿命。作用域表示变量声明有效的区域，也就是说该变量可以使用。\n\
  \n四种不同的作用域是全局、函数和块。\n有 4 种存储类：\n1. 自动存储类 (`auto`)\n2. 静态存储类 (`static`)\n3. 外部存储类\
  \ (`extern`)\n4. 寄存器存储类 (`register`)\n\n### 自动存储类\n在函数内部定义的变量默认具有自动存储类。它由垃圾值初始化。声明方式为：`int\
  \ a` 或 `auto int a`。\n\n```c\nvoid prn();\nmain()\n{\n    int a=5;\n    printf(\"\
  %d \", a);\n    prn();\n    prn();\n}\n```\n\n### 静态存储类\n当需要值在函数调用之间持久时，应使用静态存储类。它们是函数的局部的。\n\
  \n```c\nvoid prn();\nmain()\n{\n    int a=5;\n    printf(\"%d \", a);\n    prn();\n\
  \    prn();\n}\n\nvoid prn()\n{\n    static int a=10;\n    a++;\n    printf(\"%d\
  \ \", a);\n}\n```\n输出：5 11 12\n\n### 外部存储类\n在所有函数之外定义的变量具有外部存储类。外部存储类仅适用于程序中所有函数使用的变量，现在不需要在所有函数中传递变量了。但不建议将所有变量存储为\
  \ `extern`，因为它们将在整个程序生命周期内保持活跃，从而浪费大量内存。例如：\n\n**File1.c**\n```c\n#include \"File2.c\"\
  \nint a; /* 变量定义 */\nmain(){\n    a= 5;\n    func();\n    printf(\"%d\",a);\n}\n\
  ```\n\n**File2.c**\n```c\nextern int a; /* 变量声明 */\nvoid func(){\n    a=10;\n}\n\
  ```\n输出：10\n\n\n\n\n可用的 CPU 寄存器 只有 14 个，而我们能使用的寄存器甚至更少，因为微处理器正在使用它们。但计算机访问 CPU 寄存器的速度非常快，因此程序执行得也非常快。所以，它们最适合用于需要多次使用的循环计数器。然而，如果寄存器空闲，则使用\
  \ `auto` 自动存储类并继续执行。CPU 寄存器的长度为 2 字节。因此它们的最大范围等于 `int`。`float` 值不能存储在寄存器中。即使我们写下\
  \ `register float x`，`x` 也会被假定为 `auto`。该类的变量声明如下：\n\n```c\nregister int d;\n```\n\
  \n### 总结\n\n| 存储类 | 内存 | 默认值 | 作用域 | 生命周期 |\n\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| Auto | 主内存 (RAM) | 随机值 | 局部 | 局部 |\n| Static | 主内存 (RAM) | 0 | 局部 | 全局 |\n\
  | Extern | 主内存 (RAM) | 0 | 全局 | 全局 |\n| Register | CPU 寄存器 | 随机值 | 局部 | 局部 |\n\n\
