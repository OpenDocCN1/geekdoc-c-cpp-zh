  \ 短路逻辑或运算符 (`||`)\n```c\nint i =4, z =12;\nif( i = 5 || z>50) printf(\"\\nwelcome\
  \ in matrix\");\nelse printf(\"\\n you may go now\");\n```\n**输出：** `welcome in\
  \ matrix`\n首先 `i` 被赋值为 `5`，这是一个非零值，在此时被视为真。该值涉及 `||` 逻辑或运算。在 `||` 运算符中，如果第一个条件为真，它将不会检查下一个条件并直接带真值跳出；这被称为“短路”。\n\
  \n### 2. 逻辑与运算符 (`&&`)\n```c\nint i=4,z=12;\nif(i = 5 && z>5) printf(\"hello\");\n\
  else printf(\"bye\");\n```\n**输出：** `hello`\n首先 `i` 被赋值为 `5`，它非零且被视为真。现在检查第二个条件\
  \ `(z>5)`，其结果为真，因此两个条件均为真并最终生成真值，所以执行 `if` 下的语句并打印消息 \"hello\"。\n\n### 3. 多重逻辑运算\n\
  ```c\nint i =4,j = -1,k =0,w,x,y,z;\nw = i||j||k;\nx = i&&j&&k;\ny = i||j&&k;\n\
  z = i&&j||k;\nprintf(\"\\nw=%d x=%d y=%d z=%d\",w,x,y,z);\n```\n**输出：** `w =1 x\
  \ =0 y =1 z =1`\n`i=4` 是非零值（真条件）。`j=-1` 也是非零值（真条件）。`k=0` 表示假条件。\n\n### 4. 运算符优先级（算术\
  \ vs 逻辑）\n```c\nint i =4,j =-1,k =0,y,z;\ny = j+5&&j+1||k+2;\nz = i+5||j+1&&k+2;\n\
  printf(\"\\n y =%d z =%d\",y,z);\n```\n**输出：** `1 1`\n在第一个语句中，`j+5=4(T)`，`j+1=0(F)`，`k+2=2(T)`。现在\
  \ `(j+5 && j+1)` $\\rightarrow$ `(4 && 0)` 得到 `0 (F)`，第二个比较是 `(0|| k+2)` $\\rightarrow$\
  \ `(0||2)` $\\rightarrow$ `1(T)`，所以 `y=1`。\n在第二个语句中 `i+5=9`。在表达式 `(i+5||j+1&&k+2)`\
  \ $\\rightarrow$ `(9||j+1&&k+2)` 中，我们知道对于 `||` 运算符，如果第一个条件为真，控制就不会进入下一个条件；它带真结果\
  \ `1` 跳出，所以 `z=1`。\n\n### 5. 逻辑非、乘法与加法\n```c\nint i = -3, j = 3;\nif (!i+!j*1) printf(\"\
  Hello\");\nelse printf(\"Bye\");\n```\n**输出：** `Bye`\n这里我们考虑所有使用运算符的优先级：`!`（非）优先级高于\
  \ `*`（乘法），然后是 `+`（加法）。`i=-3(T)`，则 `!i` $\\rightarrow$ `(!T)` $\\rightarrow$ `F(0)`。同样\
  \ `!j` 得到 `F(0)`，`0*1` 得到 `0`。现在表达式转换为 `(0+0)` $\\rightarrow$ `0`，因此条件为假，控制跳转到 `else`\
  \ 块，结果 \"Bye\"。\n\n### 6. 短路逻辑与运算符 (`&&`)\n```c\nint a= 40;\nif(a>40 && a<45) printf(\"\
  a is between 40 and 45\");\nelse printf(\"%d\",a);\n```\n**输出：** `40`\n这里 `a>40`\
  \ 是第一个比较，结果为假。表达式中包含 `&&` 运算符。在 `&&` 的情况下，如果第一个条件为假，控制将带假条件跳出。由于 `if` 条件为假，控制跳转到\
  \ `else` 块并打印 `a` 的值，即 `40`。\n\n### 7. 三目运算符\n```c\nint a = 65;\nprintf(\"\\n a>=65\
  \ ? %d: %c\",a);\n```\n**输出：** `65`\n\n### 8. 浮点数比较\n```c\nfloat a= 0.7;\nif(a<0.7)\
