  \n![](img/image00857.jpeg)\n\n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 章节：∞ 9\
  \ ∞\n(指针)\n\n# 引言\n指针是一个特殊的变量，用于存储其他变量的地址。指针可以用于存储单个变量、数组、结构体、联合体甚至指针的地址。\n\n##\
  \ 指针 - 为什么？\n使用指针允许我们：\n- 实现引用传递（即编写修改其参数的函数）。\n- 高效处理数组。\n- 高效处理结构体（记录）。\n- 创建链表、树、图等。\n\
  - 将数据存放在堆上。\n- 创建函数指针表来处理窗口事件、信号等。\n- 在 `scanf()` 中已经在使用指针。\n- 使用指针时必须小心，因为没有安全防护机制。\n\
  \n由于 C 语言是一种非常底层的语言，没有指针就很难做任何事情。我们已经看到，无法编写一个可以修改其任何参数的函数。\n\n## 脑洗练习\n指针还可以编写链表及其他类似的数据结构。\n\
  标准库连同 Windows、Windows 95 和 Windows NT 编程环境广泛地使用了函数指针。\n\n## 指针的问题\n一个问题是指针名誉不佳。它们被认为难以使用且难以理解。\n\
  \n## 指针的概念\n每个变量都存储在内存中，每个内存位置都有一个数字地址。变量的声明如下：\n\n```c\nint a = 5;\n```\n\n在这里\
  \ `a` 是变量名，变量的值是 `5`，而变量的地址是 `100`（假设）。\n\n![](img/image00858.jpeg)\n![](img/image00859.jpeg)\n\
  \n### 脑洗练习表\n| 声明指针 |\n| :--- |\n| 1. 指针通过星号“*”来声明 |\n| 2. 声明一个整数：`int I;` |\n|\
  \ 3. 声明一个指向整数的指针：`int *p;` |\n| 4. 关于“*”的位置 `int* p;` 存在一些争议 |\n\n第一步是知道如何声明指针。这是通过使用\
  \ C 语言的乘法字符“*”实现的（它显然没有执行乘法操作）。\n“*”被放置在关键字 `int` 和变量名之间的某个位置。它不是创建了一个整数，而是创建了一个指向整数的指针。\n\
  \n### 脑洗练习表\n上述和下面的表都将帮助你信指地掌握指针的概念。\n\n| 类型 | 声明 | 注释 |\n| :--- | :--- | :--- |\n\
  | `int` | `*pi;` | /* pi 是一个指向 int 的指针 */ |\n| `long int` | `*p;` | /* p 是一个指向 long\
  \ int 的指针 */ |\n| `Float*` | `pf;` | /* pf 是一个指向 float 的指针 */ |\n| `char` | `c,\
  \ d, *pc;` | /* c 和 d 是 char，pc 是指向 char 的指针 */ |\n| `double*` | `pd, e, f;` | /*\
  \ pd 是指向 double 的指针，e 和 f 是 double */ |\n| `char*` | `start;` | /* start 是指向 char\
  \ 的指针 */ |\n| `char*` | `end;` | /* end 是 ... */ |\n\n变量的声明告诉编译器：\n1. 在内存中留出空间存储整数值。\n\
  2. 将名称“a”与此内存位置关联。\n3. 在此位置存储值 5。\n\n## 指针和间接运算符\n用于指针的两个基本运算符是：\n1. 地址运算符 `&`\n\
  2. 间接运算符 `*`\n\n```c\nmain()\n{\n    int a = 5;\n    int *p; /*指针声明*/\n    p= &a;\
  \ /*将变量 a 的地址拷贝给指针 p*/\n    *p = 10; /*通过间接或使用指针改变变量 a 的值*/\n    printf(\"%d\",\
  \ a);\n    printf(\"%d\",*p);\n    printf(\"%d\",(&a));\n}\n```\n脑洗练习 - 上程序中的所有\
  \ `printf` 语句将输出 10。因为变量 `p` 不是像变量一样的普通变量，它存储其他变量的地址（在本例中为 a）。由于 `p` 是变量，编译器必须为该变量提供内存。任何类型的指针在内存中都获得两个字节（注：在现代系统中指针通常为\
  \ 4 或 8 字节）。\n\n## 内存与指针\n```c\nint *p1;\n\n存储在内存中，每个内存位置都有一个数字地址。假设 `int`, `float`,\
  \ `char` 声明的三个指针占用内存从 0 到 65536。由于 `int`, `float`, `char` 声明，占用两个字节。\n\n```c\nmain()\n\
  \n{\n    int a = 5;\n    float b = 2;\n    char c = 'a';\n    p1 = &a;\n    p2 =\
  \ &b;\n    p3 = &c;\n    printf(\"%d\",sizeof(p1));\n    printf(\"%d\",sizeof(p2));\n\
  \    printf(\"%d\",sizeof(p3));\n} // 输出：2 2\n```\n\n## 指针表达式\n与任何其他变量一样，指针变量可以在表达式中使用。在程序中，以下操作都是有效的：\n\
  1. C 允许我们对指针加减整数：`sum= sum +*p1;`\n2. 允许使用快捷运算符：`sum+=*p1;` 和 `ans = *p1++;`\n这会导致指针\
  \ `p1` 指向其类型的下一个值并解引用该值。\n\n让我们用例子来说明这一点：\n```c\nmain( )\n{\n    int a[5]={10,20,30,40,50},*p;\n\
  \    p=a; /*数组的地址可以直接指向指针，无需使用 & 运算符*/\n    printf(\"%d,*++p); /*解引用下一个地址，即索引 1*/\n\
  \    printf(\"%d\",++*p); /*解引用地址并对元素加 1 */\n} // 输出：20, 21\n```\n3. 还可以从一个指针减去另一个指针。\n\
  \n\n\n\n\n```c\nprintf(\"%d\",*p); /*对指针解引用*/\n```\noutput: 20, 20, 10\n\n4. 如果\
  \ `p1` 和 `p2` 都是指向同一个数组的指针，那么 `p2-p1` 给出了 `p1` 和 `p2` 之间的元素个数\n```c\n*p3 = *p2 -\
  \ *p1;\n```\n\n5. 两个指针也可以进行比较，例如 --\n`p1>p2`\n`p1 == p2`\n`p1 != p2`。\n\n这些比较仅在在使用字符串或数组时有用。\n\
  \n6. 两个指针不能进行乘法、除法或加法。\n\n## 脑操训练 (Mind Wash Drill)\n\n空指针是一个特殊的指针值，已知它不指向任何地方。这意味着任何其他有效指针（指向任何其他变量、数组单元或任何内容）永远不会与空指针相等。\n\
  \n使用空指针的另一种方法是使用任何标准头文件，包括 `<stdio.h>`、`<stdlib.h>` 和 `<string.h>`。要将指针初始化为空指针，你可以使用如下代码-\n\
  ```c\n#include <stdio.h>\nint *p = NULL;\n```\n在检查指针所指向的值之前，测试它是否为空指针，你可能使用如下代码\
  \ -\n```c\nif(p != NULL)\n    printf(\"%d\\n\", *p);\n```\n也可以通过常量 `0` 来引用空指针，你会看到一些通过简单操作设置空指针的代码：\n\
  ```c\nint *p = 0;\n```\n此外，由于 C 语言中“真”的定义是不等于 0 的值，你会看到使用简略代码测试非空指针的代码，例如 -\n```c\n\
  if(p)\n    printf(\"%d\\n\", *p);\n```\n这与我们之前的示例含义相同；`if(p)` 等同于 `if(p != 0)` 同于\
  \ `if(p != NULL)`。\n\n## 指针的指针 (Pointers to pointers)\n\n指针存储变量的地址，同样，指针的地址也可以存储在其他指针中。\n\
  \n```c\nmain ()\n{\n    int a=5;\n    int *p1;                   /*指向整数的指针*/\n \
  \   int **p2;                  /*指向指针整数的指针*/\n    int ***p3;                 /*指向指向指针指向整数的指针*/\n\
  \    p1= &a;\n    p2= &p1;\n    p3 =&p2;\n    printf(\"%d\",a);           /*输出 =\
  \ 5*/\n    printf(\"%d\",*p1);          /*输出 = 5*/\n    printf(\"%d\",**p2);   \
  \      /*输出 = 5*/\n    printf(\"%d\",***p3);       /*输出 = 5*/\n    printf(\"%u\"\
  ,*p2);          /*将打印 p1 的地址*/\n}\n```\n\n## 指针与数组 (Pointers and Array)\n\n当声明数组时，编译器会分配一个基地址和足够的存储空间，以在连续的位置包含数组中的所有元素。\n\
  \n基地址是数组第一个元素（索引 0）的位置。假设我们如下所示声明数组 `a`：\n`static int a[5]={10,20,30,40,50};`\n\n\
  假设数组 `a` 的基地址为 100，因为每个整数需要两个字节。\n\n| [0] | [1] | [2] | [3] | [4] |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 10 | 20 | 30 | 40 | 50 |\n| 100 | 102 | 104 | 106 |\
  \ 108 |\n\n名称 `a` 被定义为指向第一个元素 `a[0]` 的常量指针，因此 `a` 的值是 100，即存储 `a[0]` 的位置。\n也就是说\
  \ `a` 等于 `&a[0]` 等于 100。\n\n如果我们将指针 `p` 为整数指针，那么我们可以让指针 `p` 指向数组 `a` –\n`p= a;`\n\
  或者\n`p = &a[0];`\n\n现在我们可以使用 `p++` 从一个元素移动到另一个元素，从而访问此数组 `a` 的每一个值。`p` 和 `a` 之间的关系所示：\n\
  - `p` 等于 `&a[0];` (=100)\n- `p+1` 等于 `&a[1];` (=102)\n- `p+2` 等于 `&a[2];` (=104)\n\
