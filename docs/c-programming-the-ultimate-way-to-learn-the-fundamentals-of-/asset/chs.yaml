  11. 编写程序获取矩阵的行列式值。\n\n# 第 7 章 字符串（字符数组）\n\n# 引言\n字符串是字符数组。任何包含在双引号之间的字符组（双引号除外）被称为字符串常量。字符串是以空字符（`\\\
  0`）终止的一维字符数组。\n\n例如 `char s[10] = {'s','h','i','v','a','m','\\0'};`\n\n| S | H |\
  \ I | V | A | M | \\0 | p | o | H |\n\n数组中的每个字符占用一个字节的内存，最后一个字符始终是 `\\0`。这个 `\\\
  0` 被称为空字符（null）。它定义了字符串的结束。因为这个字符的存在，处理字符串的各种函数能够知道字符串的结束。因此可以说，给字符串的输入在空字符 `\\\
  0` 处终止。剩余数组包含垃圾值。\n\n要点：空字符 `\\0` 看起来像输入了两个字符，但编译器将其视为单个字符。它是一个转义序列。还要记住 '0' 和 '\\\
  0' 是不同的。'0' 的 ASCII 值为 48，而 '\\0' 的 ASCII 值为 0。\n\n### 字符数组初始化\n1. `char s[10];`\n\
  2. `char s[7] = {'s','h','i','v','a','m','\\0'};`\n3. `char s[7] = {'s','h','i','v','a','m'};`\n\
  4. `char s[7] = \"shivam\";`\n5. `char s[] = {'s','h','i','v','a','m','\\0'};`\n\
  \n让我们观察字符串的几个重要方面——\n1. 在初始化时，如果缺少空字符，编译器会自动添加空字符。\n2. 字符串的大小应该是最大字符数加一。\n3. 在初始化字符串数组时不指定大小也是允许的。\n\
  \n### 字符串输入\n用于输入的常用函数是 `scanf`。该函数也可以使用格式控制 `%s` 输入字符串。例如 `scanf(\"%s\",name);`。输入字符串时不需要\
  \ `&` 地址运算符。\n\n`scanf` 函数的问题是它遇到第一个空白字符就会结束输入（空白字符包括空格、制表符、回车、换页）。因此如果输入以下行——Shivam\
  \ Kumar\n变量只会获取 \"Shivam\"，因为单词后面的空格会结束字符串。\n\n很多时候需要读取整行文本，使用 `scanf` 是可能的。可以通过\
  \ `getchar` 实现。该函数每次读取一个字符并存储在数组中。因此我们需要使用循环重复调用此函数，直到用户输入空字符或换行符。\n\n另一个可以输入字符串的函数是\
  \ `gets()`。用法如下：\n```c\nchar name[10];\ngets(name);\n```\n该函数还可以读取空格，从而一次性读取整行输入。\n\
  \n### 字符串输出\n常用的输出函数 `printf()` 也可以使用格式控制 `%s` 用于字符串并在屏幕上显示字符串。`printf(\"%s\",name);`\n\
  \n要点——也可以使用函数 `puts()`。`puts(name);`\n\n字符串的精度也可以指定，例如 `%10.3`。表示将前三个字符打印在 10 列的字段范围内。字符串前面会打印\
  \ 7 个空格。但如果指定为 (`%-10.4`)，则字符串将左对齐，所有的 7 个空格将向右打印。\n\n1. 记住如果字段宽度小于字符串长度，则将打印长度长度的字符串。`printf(\"\
  %3.4s\",name);` 会打印 4 个字符而不是 3 个。\n2. 小数右侧的整数值指定了要打印的字符数。\n\n\n\n\n\n```c\nprintf(\"\
  %s\",name);\nprintf(\"%6s\",name);\nprintf(\"%12.6s\",name);\nprintf(\"%-12.6s\"\
  ,name);\nprintf(\"%.2s\",name);\n```\n\n# 求解程序\n\n### 1. 编写一个程序对给定列表中的名称按升序排序。\n\
  \n```c\n#include<string.h>\n\nmain()\n{\n    char names[10][20], t[20];\n    int\
  \ i=0,j=0,n;\n    printf(\"Enter how many names\");\n    scanf(\"%d\",&n);\n   \
  \ /*输入名称*/\n    for(i=0;i<n;i++)\n    {\n        printf(\"Enter name %d \",i+1);\n\
  \        gets(names[i]);\n    }\n    /*Sorting*/\n    for(i=0;i<n-1;i++)\n    {\n\
  \        for(j=i+1;j<n;j++)\n        {\n            if(strcmp(names[i],names[j])\
  \ > 0)\n            {\n                strcpy(t,names[i]);\n                strcpy(names[i],names[j]);\n\
  \                strcpy(names[j],t);\n            }\n        }\n    }\n    /*输出*/\n\
  \    for(i=0;i<n;i++)\n    {\n        printf(\"%s\\n\",names[i]);\n    }\n    getch();\n\
  }\n```\n\n## 2. 通过键盘输入一个字符串，编写一个程序按单词反序打印字符串：例如：How Are You = You Are How\n\n```c\n\
  main()\n{\n    char s1[50],t1[50],t2[50]=\"\";\n    int i=0,j=0;\n    printf(\"\
  Enter a string\");\n    gets(s1);\n    strcat(s1,\" \");\n    while(s1[i]!='0')\n\
  \    {\n        if(s1[i] == ' ')\n        {\n            t1[j++] = ' ';\n      \
  \      t1[j] = '\\0';\n            strcat(t1,t2);\n            strcpy(t2,t1);\n\
  \            j = 0;\n        }\n        else\n            t1[j++] = s1[i];\n   \
  \     i++;\n    }\n    puts(t1);\n    getch();\n}\n```\n\n## 3. 编写一个程序输入文本，并将文本中输入的字符串替换为相应数量的\
