  第一个 `s` 将为 6 并传递给 `f()`，由 `a` 接收，处理后 `a` 将变为 1，`t` 将变为 4。因为 `t` 是全局变量，所以在整个程序中都是可。当调用\
  \ `g()` 时，`a` 再次接收到 6 并被 1 覆盖，所以 `a=1` 且 `t = t+a` 因此 `t = 5`，该函数返回 `a+t`，因此 `x`\
  \ 将是 6，最后 `s = 6`, `x = 6`, `y = 5`，将通过 `printf()` 输出。\n\n2.\n```c\nmain(){\n  \
