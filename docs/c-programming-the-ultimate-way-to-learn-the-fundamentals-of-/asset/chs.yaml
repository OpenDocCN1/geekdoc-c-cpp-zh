  # C 语言循环\n\nC 语言有循环，`while` 是其中最简单的一种。它接收一个条件（放在括号内，就像 `if` 语句一样），并对其进行求值。如果条件结果为真（如之前所示，非零），则执行循环体。条件会再次求值，如果仍然为真，则再次执行循环体。此过程一直持续，直到条件最终结果为假。然后执行流将跳转到循环之后的第一个语句。\n\
  \n## `while` 循环\n\n`while` 循环由一个条件和一个必须在循环中运行的单个命令或命令块组成。正如我们之前提到的，命令块是一系列被一对起始和结束括号括的命令。\n\
  \n在 `while` 循环中，会对条件进行求值，如果为真，则执行循环语句。在执行语句以及递增或递减之后，会再次测试循环条件。这种重复执行语句、递增或递减以及测试条件的过程持续持续，直到条件最终变为假，循环的控制权转移到下一个语句。\n\
  \n再次强调，如果循环体需要多条语句，必须使用起始和结束括号。\n\n它是所有循环中最简单的一种。该循环的用法如下：\n\n```c\ninitialize;\n\
  while(condition)\n{\n    statement;\n    increment or decrement;\n}\n```\n\n`while`\
  \ 循环是一种进入控制循环。对条件进行求值，如果为真，则执行循环语句。在执行语句以及递增或递减之后，会再次测试循环条件。这种重复执行语句、递增或递减以及测试条件的过程持续持续，直到条件最终变为假，循环的控制权转移到下一个语句。\n\
  \n### 语法\n```c\ninitialization;\nwhile(condition)\n{\n    statement;\n    incrementation\
  \ or decrementation;\n}\n```\n\n### 自由语法\n```c\nwhile( condition )\ncommand;\n\n\
  while( condition )\n{\n    block of commands\n}\n```\n\n循环条件是一个布尔表达式。布尔表达式是一个逻辑正确或错误的逻辑语句。如果逻辑语句有效，其值为\
  \ 1；如果无效，则其值为 0。例如，布尔语句 `(3>4)` 是无效的，因此其值为 0。而语句 `(10==10)` 是一个有效的逻辑语句，因此其值为 1。\n\
  \n### 分号警告！\n避免在 `while` 之后使用分号。我们已经看到，如果在 `if` 语句之后放置分号可能会出现问题。循环也存在类似的问题，尽管情况更严重。对于\
  \ `if`，空操作可能只执行一次；而对于循环，它可能会被执行无限次。\n\n### 示例\n```c\n#include<stdio.h>\n\nmain()\n\
  {\n    int i=0;\n    while( i<100 )\n    {\n        printf(\"\\ni=%d\",i);\n   \
  \     i=i+1;\n    }\n    system(\"pause\");\n}\n```\n在上面的示例中，`i=i+1` 意味着：给 `i` 加\
  \ 1，然后将其赋值给 `i`，或者简单地增加它的值。正如我们之前看到的，C 语言语言中有一个特殊运算符可以执行相同的操作。我们可以使用表达式 `i++` 代替\
  \ `i=i+1`。\n\n## 类型转换\n\n你可能偶尔需要转换值或变量的类型，以便将其赋值给另一个类型的变量。这种类型转换在不同情况下可能有用，例如，当你想要转换变量的类型以与具有不同类型参数的函数兼容时。\n\
  \nC 编程语言为此目的实现了一些规则。在某些情况下会发生自动类型转换。`Char` 会自动转换为 `int`。`signed int` 将自动转换为 `int`。\n\
  \n如果表达式中存在两种不同的类型，那么两者都将转换为更好的类型。在赋值语句中，计算的最终结果将转换为存储计算结果的变量的类型（例如赋值语句 `count=i+1;`\
  \ 中的变量 `count`）。\n\n例如，如果你将两个来自 `int` 和 `float` 类型的值相加并将其赋值给一个 `double` 类型变量，结果将是\
  \ `double`。\n\n## 在示例中使用循环\n\n编写一个程序 —— 接收一个人的分数并计算它们的总和以及平均分，并打印出来。\n\n```c\n#include<stdio.h>\n\
  #include<conio.h>\n\nmain()\n{\n    int count=0;\n    float sum=0, avg=0, num;\n\
  \    printf(\"Enter score: \");\n    scanf(\"%f\",&num);\n    while(num>=0)\n  \
  \  {\n        sum=sum+num;\n        count++;\n    }\n    avg=sum/count;\n    printf(\"\
  \\nAverage=%f\",avg);\n    printf(\"\\nSum=%f\",sum);\n    system(\"pause\");\n\
  }\n```\n（注：提供的文本在示例部分包含一些破碎的逻辑；已将其清理为功能性程序结构，同时保留了源代码提到的核心变量和逻辑，如 `sum`、`avg`、`num`\
  \ 和 `count`。）\n\n## `do-while` 循环\n\n`do-while` 循环是 `while` 循环的“倒置”版本。`while` 是先条件后体，而\
  \ `do while` 是先体后条件。这意味着在到达条件之前必须执行循环体。因此，即使初始条件为假，语句也会执行一次。\n\n`do-while` 循环的用法如下：\n\
  \n```c\ninitialize;\ndo\n{\n    statement;\n    increment or decrement;\n}\nwhile(condition);\n\
  ```\n在这里，在执行语句和递增或递减之后测试条件。\n\n### 示例\n```c\nint j = 5;\nprintf(\"start\\n\");\n\
  do\nprintf(\"j = %d\\n\", j--);\nwhile(j > 0);\nprintf(\"stop\\n\");\n```\n输出：\n\
  ```\nstart\nj = 5\nj = 4\nj = 3\nj = 2\nj = 1\nstop\n```\n\n## `for` 循环\n\n`for`\
  \ 循环与 `while` 循环相似，但它更复杂。`for` 循环由一个决定循环运行次数的控制语句和一个命令部分组成。命令部分可以是单个命令或一个命令块。\n\n\
  `for` 循环也是一种进入控制循环，提供了更简洁的循环控制结构。\n\n```c\nfor (initialize; condition; increment\
  \ or decrement)\n{\n    statement;\n}\n```\n\n\n\n\n初始化部分仅在“for 循环”开始时执行一次。我们可以在这里初始化循环变量。\n\
  \n测试条件是循环最重要的部分。如果该条件为真（True），循环将继续运行。如果条件无效（false），则循环将终止。\n\n“每次执行命令”部分将在每个循环周期中执行。我们使用这部分来达到终止循环的最终条件。\n\
  \n例如，我们可以增加或减少循环变量的值，使得在指定次数的循环后，循环条件失效，从而“for 循环”可以终止。\n\n在这一步，我们用 for 循环重写了示例\
  \ 3-1。只需注意我们不再需要用 `I=I+1` 来增加循环变量。它现在被包含在“for 循环”条件语句中（`i++`）。\n\n### 示例 –\n\n```c\n\
  #include<stdio.h>\n#include<conio.h>\n\nmain()\n{\nint i=0;\n\nfor(i=0;i<100;i++\
  \ )\nprintf(\"\\ni=%d\",i);\n\nsystem(\"pause\");\n}\n```\n\n**练习笔记**：`stdio.h`\
  \ – 标准输入输出。\n**练习笔记**：`conio.h` – 控制台输入输出。\n**练习笔记**：本质上你只需要记住必须分隔该结构三个部分的两个分号字符。\n\
  \n### 示例 –\n\n编写一个程序，获取工作日的温度并计算该周的平均温度。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  \nmain()\n{\nint count=0;\nfloat num=0,sum=0,avg=0;\n\nfor(count=0;count<7;count\
  \ ++)\n{\nprintf(\"Enter temperature : \");\nscanf(\"%f\",&num);\nsum=sum+num;\n\
  }\n\navg=sum/7;\nprintf(\"\\nAverage=%f\\n\",avg);\nsystem(\"pause\");\n}\n```\n\
  \n### 示例 -\n\n下面的示例将打印一个乘法表（从 `1*1` 到 `9*9`）。运行程序并查看结果。\n\n```c\n#include<stdio.h>\n\
  \nmain()\n{\nint i,j;\n\nfor(i=1;i<10;i++)\n{\nfor(j=1;j<10;j++)\nprintf(\"%3d\"\
  ,i*j);\nprintf(\"\\n\");\n}\n\nsystem(\"pause\");\n}\n```\n\n### For 和 while 的比较\n\
  \n该结构：\n`For (初始化部分; 循环条件; 更新部分)`\n`循环体`\n\n等同于：\n`初始化部分;`\n`While (循环条件)`\n{\n\
  `循环体;`\n`更新部分;`\n}\n\n在这里，首先执行初始化，然后评估条件；如果条件为真，则首先执行语句，然后进行变量的递增或递减；再次测试条件，此过程一直持续，直到循环条件变为假。\n\
  \n初始化通过某些赋值运算符完成。如果需要初始化多个变量，则赋值用逗号分隔。\n\n写完所有赋值后，使用分号将它们与条件分隔。如果有多个条件，则用逻辑与 (`&&`)\
  \ 或逻辑或 (`||`) 分隔。\n\n在给出所有条件后，在给出递增或递减之前使用分号。\n\n如果循环体中有多个语句，则强制使用圆括号。\n\nfor 循环的一个独特方面是，如果不需要，可以省略\
  \ for 循环的一个或多个部分。然而，分隔循环不同部分的分号是必要的。\n\n可以使用空语句设置延迟循环：`for(i=100;i>0;i--);`\n\n\
  在这个循环中没有语句，因此首先将变量 `i` 初始化为 `100`，测试条件，然后进行递减，再次测试条件，`i` 再次减少，并重复直到条件变为假。\n\nfor\
  \ 循环的另一个独特特性是嵌套，即将一个循环作为另一个循环的语句。在 ANSI C 中，允许嵌套最多 15 层，但某些编译器允许更多。\n\n### 跳转语句（新主题）\n\
  \n循环执行一组语句，直到条件变为假。循环的次数是预先决定的并设置了条件。但有时需要跳过循环的某些部分或在特定条件为真时终止循环，这时跳转语句派上了用：\n\n\
  C 支持四个跳转语句：\ni. `break`。\nii. `continue`。\niii. `goto`。\niv. `return`。\n\n### break\n\
  `break` 语句用于循环内部，直接跳出循环。我们已经在 `switch` 语句中使用过 `break`。它用于跳过循环的后续执行，并将程序的控制权转移到循环后的语句。\n\
  \n### continue\n有时在特定条件为真时跳过语句的执行。`continue` 不会终止循环，而是直接跳转到下次迭代。在 `for` 循环中，`continue`\
  \ 将控制带到下一次增或减，但在 `while` 或 `do while` 循环中，`continue` 导致循环控制直接跳转到条件。\n\n### goto\n\
  它也用于从程序的某部分跳转到另一部分或退出深度嵌套的循环。但使用 `goto` 不是良好做法，因为它会让逻辑变得复杂并使长程序变得不可读。\n\n#### return\n\
  用于函数返回某些值，并从被调用函数的定义跳转到调用函数的定义。\n\n#### exit()\n用于函数返回某些值并从被调用函数的定义跳转到调用函数的定义。\n\
  \n#### 讨论跳转语句\n\n循环执行一组语句，直到条件变为假。循环的次数是预先决定的并设置了条件。但有时需要跳过循环的某些部分或在特定条件为真时终止循环，这时跳转语句派上了用：\n\
  \n#### break 语句\n`break` 语句用于循环内部，直接跳出循环。 #### 跳转语句：\nC 支持四个跳转语句：\ni. `break`。\n\
  ii. `continue`。\niii. `goto`。\niv. `return`。\n\n### break\n`break` 语句用于循环内部，直接跳出循环。我们已经在\
