  ![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 3 章：控制语句（条件）\n\n# 引言\n如果程序能够对需要执行的任务做出决策，将会有用得多。在\
  \ C 程序中做出决策通常涉及测试一个或多个变量的值，例如，“如果 X 大于 Y 则执行任务 1，否则执行任务 2”。\n\nC 程序可以使用一系列测试来满足许多不同的情况。上面的示例使用了\
  \ `if-else` 结构，这只是 C 程序能执行的最简单的测试。\n\n然而，不难想象，做出此决策后，任务 1 或任务 2 也可能是一种 `ifelse`\
  \ 类型的测试，导致执行其他更专门的任务（可能包括更多测试）。这在 C 中可以通过使用任意数量的嵌套 `if-else` 结构来实现。\n\n`switch`\
  \ 结构与嵌套的 `if-else` 类似，但当需要根据变量的值选择（切换到）不同的任务时，它更为合适。\n\n1. 条件语句或选择语句或决策控制语句\n2.\
  \ Switch case 控制语句\n\n## 1. 选择语句（决策控制结构）\n选择语句允许程序根据表达式的结果或变量的状态，从不同的执行路径集合中选择任意一条路径。\n\
  \n### 1.1. `if`\n2. `if else`\n3. `嵌套 if else`\n4. `if-else-if`\n\n![](img/image00838.jpeg)\n\
  ![](img/image00839.jpeg)\n\n### 1.2. Switch Case\n```c\nswitch(expression)\n{\n\
  \    case 1:\n        statement 1;\n        break;\n    case 2:\n        statement\
  \ 2;\n        break;\n    case 3:\n        statement 3;\n        break;\n    case\
  \ n:\n        break;\n    default:\n        default statement;\n}\n```\n决策语句和 Switch\
  \ Case 语句允许计算机决定下一个执行哪条语句。\n\n### 常见的编程错误：\n1. `if` 语句不包含 `then` 单词。因此，写 `if(condition)\
  \ then statement;` 是错误的。\n2. 在 `if` 语句中，条件必须包含在括号内。因此，写 `if condition statement;`\
  \ 是错误的。\n3. 在 `if` 语句中，`else` 单词后面没有分号。因此，写成下面这样是逻辑错误。现在假 语句将始终执行：`if(condition)\
  \ true statement; else; false statement;`。\n4. 使用单等号 `=`（用于比较）而不是双等号 `==` 被视为逻辑错误。\n\
  5. 在 `switch` 中，跟随 switch 后的整数必须包含在括号内。因此，写 `switch i { ... }` 是错误的。\n\n## 一些已解题\n\
  \n### 1. 计算二次方程的实根\n```c\n#include<math.h>\nfloat a,b,c,d,r1,r2;\nprintf(\"enter\
  \ three numbers: \");\nscanf(\"%f %f %f\",&a,&b,&c);\nd=b*b-(4*a*c);\nif(d<0)\n\
  \    printf(\"roots are imaginary\");\nelse\n{\n    r1=(-b+sqrt(d))/(2*a);\n   \
  \ r2=(-b-sqrt(d))/(2*a);\n    printf(\"The roots are %f %f\",r1,r2);\n}\n```\n\n\
  ### 2. 如果通过键盘输入商品的成本价格和售价，编写一个程序判断销售者是盈利还是亏损。同时确定他盈利了多少或亏损了多少。\n```c\nfloat cp,sp;\n\
  printf(\"Enter the cost price and the seling price of the item: \");\nscanf(\"%f\
  \ %f\",&cp,&sp);\nif(sp>cp)\n    printf(\"profit is Rs. %.2f\",sp-cp);\nelse if(cp\
  \ > sp)\n    printf(\"loss is Rs %.2f\",cp-sp);\nelse\n    printf(\"No Profit No\
  \ Loss\");\n```\n\n### 3. 编写一个计算器，可以进行加、减、乘、除和取模（余数）。\n```c\nint a,b,ch;\nprintf(\"\
  Enter two nos. \");\nscanf(\"%d%d\",&a,&b);\nprintf(\"1:\\tAdd\\n2:\\tSubtract\\\
  n3:\\tMultiply\\n4:\\tDivide\\n5:\\tModulus\\nEnter choice: \");\nscanf(\"%d\",&ch);\n\
  switch(ch)\n{\n    case 1:\n        printf(\"%d\\n\",a+b);\n        break;\n   \
  \ case 2:\n        printf(\"%d\\n\",a-b);\n        break;\n    case 3:\n       \
  \ printf(\"%d\\n\",a*b);\n        break;\n    case 4:\n        printf(\"%f\\n\"\
  ,(float)a/b);\n        break;\n    case 5:\n        printf(\"%d\\n\",a%b);\n   \
  \     break;\n    default:\n        printf(\"Invalid Input\");\n}\ngetch();\n```\n\
