  \n# 章 ∞ 21- 第二部分 ∞\n\n(编程指南)\n\n引言-\n\n本章将解释如何\n\n## 1.1 思考编程.-\n\n编程时最常见的错误类型有：\n\
  \n1. 不思考就编程。\n2. 以无结构化的方式编写代码。\n\n让我们按顺序来看\n\n\n\n\n# 算法分析\n\n1. 检查算法以查看它是否真的能解决给定的问题。（如果不起作用，你可以立即开始寻找其他算法。注意，如果你立即开始编码，可能在输入了许多行代码后才会发现算法是不可行的！）\n\
  2. 确保你理解算法实际上是如何运行的！（如果你无法通过手动推演该算法，你就无法编写程序来实现它！）\n3. 为你提供算法简短、简单运行的详细过程，这些过程在稍后调试代码时可以使用。\n\
  \n只有当你确定自己理解了整个程序的结构后，才应该开始编写代码。\n\n## 1.2 结构化编程.-\n\n当一个程序是结构化的时，它被分为若干可以单独测试的子单元。这在调试时是一个巨大的优势！子单元中的代码可以与程序的其余部分分开调试。我发现，编写每个子单元时对其进行调试是非常有用的。如果在编写整个程序之前不进行调试，调试将变得困难得多。\n\
  \n必须在整个程序的源代码中搜索 bug。如果对子单元进行单独调试，需要搜索 bug 的源代码就会少得多！将程序的各个子单元存储在[单独的源文件](http://www.drpaulcarter.com/cs/module.php)中可以更容易对它们进行单独调试。\n\
  \nADT（抽象数据类型）和 OOP（面向对象）范式也将程序分为子单元。通常使用这些方法时，子单元比普通的结构化代码更加独立。这有两个主要优势：\n\n1. 子单元更容易进行单独调试。\n\
  2. 子单元通常可以在其他程序中重用。（因此，新程序可以使用之前某个程序中已调试过的子单元！）\n\n子单元通常通过编写一个小型驱动程序（driver program）来单独调试。驱动程序为子单元应该解决的子任务准备数据，调用该子单元执行其子任务，然后显示结果以便进行检查。\n\
  \n当然，所有这些调试方法都可以用于调试子单元，就像它们可以用于调试整个程序一样。再次，子单元的优势在于它们只是程序的一部分，因此比同时调试整个程序要容易！\n\
  \n## 2. 编译程序\n\n在输入程序（或仅是程序的[子单元](http://www.drpaulcarter.com/cs/debug.php#structured)）之后，第一步是编译程序。编译过程将你编写的源代码文件转换为机器语言，并存储在目标文件中。这被称为编译。\n\
  \n在大多数系统中，目标文件会自动与系统库链接。这些库包含了语言库中包含的函数代码。（例如，C 库包含了 `printf()` 函数的代码。）\n\n### 2.1\
  \ 编译器错误-\n\n每种语言都有语法规则。这些规则决定了哪些语句在对应语言中是合法的，哪些不是。编译器程序的设计旨在强制执行这些规则。当规则被违反时，编译器会打印错误且不会创建目标文件。\n\
  \n### 编译器错误的第一规则\n\n每种语言都有语法规则。这些规则决定了哪些语句在对应语言中是合法的，哪些不是。编译器程序的设计旨在强制执行这些规则。当规则被违反时，编译器会打印错误且不会创建目标文件。大多数系统中，目标文件会自动与系统库链接。这些库包含了语言库中包含的函数代码。（例如，C\
  \ 库包含了 `printf()` 函数的代码。）\n\n每种语言都有语法规则。这些规则决定了哪些语句在对应语言中是合法的，哪些不是。编译器程序的设计旨在强制执行这些规则。当规则被违反时，编译器会打印错误且不会创建目标文件。\n\
  \n（注：原文此处存在大量重复的段落，翻译已按要求保留逻辑并避免重复输出）\n\n...（省略重复段落的翻译）...\n\n每种语言都有语法规则。这些规则决定了哪些语句在对应语言中是合法的，哪些不是。编译器程序的设计旨在强制执行这些规则。当规则被违反时，编译器会打印错误且不会创建目标文件。\n\
  \n### 编译器错误的第二规则\n\n每种语言都有语法规则。这些规则决定了哪些语句在对应语言中是合法的，哪些不是。编译器程序的设计旨在强制执行这些规则。当规则被违反时，编译器会打印错误且不会创建目标文件。\n\
  \n在 C（和 C++）中，不要忘记 `#include` 语句。\n\n每种语言都有语法规则。这些规则决定了哪些语句在对应语言中是合法的，哪些不是。编译器程序的设计旨在强制执行这些规则。当规则被违反时，编译器会打印错误且不会创建目标文件。\n\
  \n### 2.2 链接错误-\n\n`linker`（链接器）程序将目标文件（包含单个源文件的编译后机器码）和库（目标文件的集合）链接在一起，以创建一个可执行程序。\n\
  \n链接器匹配目标文件中使用的函数和全局变量到其他目标文件中的定义。链接器使用函数或全局变量的名称（通常使用符号 `symbol`）来执行匹配。\n\n最常见的链接器错误类型是未解析的符号或名称。当使用了函数或全局变量但链接器找不到名称项时，就会发生这种错误。例如，在\
  \ IBM AIX 系统上，错误信息如下：\n\n```\n0706-317 ERROR: 检测到未解析或未定义的符号:\n\n错误中的符号（后跟引用）将转储到加载映射（load\
  \ map）。\n```\n\n`-bloadmap:<filename>` 选项将创建一个加载映射..fun\n\n\n\n\n此信息意味着程序中引用了一个名为\
  \ `fun`（忽略点）的函数（或全局变量），但从未对其进行定义。这些错误通常有两种常见原因：\n\n### 1. 函数名拼写错误\n\n在上面的示例中，有一个名为\
  \ `func` 的函数。这**不是**编译器错误。一个源文件中的代码可以使用另一个文件中定义的函数。编译器假设任何在引用它的文件中被引用但未在该文件中定义的函数都将在另一个文件中定义并链接。\n\
  \n只有在链接阶段才能对这一假设进行检查。（注意，C++ 编译器通常会针对这种情况生成编译器错误，因为 C++ 要求对**所有**（all）被引用的函数都具有原型声明！）\n\
  \n### 2. 未链接正确的库或对象文件\n\n链接器必须知道形成可执行程序需要哪些库和对象文件。标准 C 库会自动链接。但 UNIX 系统（如 AIX 系统）**不会**（not）自动链接标准\
  \ C 数学库！要在 AIX 系统上链接数学库，请在编译命令中使用 `-lm` 标记。例如，要编译一个使用 `sqrt` 的 C 程序，输入：`cc prog.c\
  \ –lm`\n\n记住，`#include` 语句仅将文本插入到源文件中。认为它也会链接相应的库是一个常见的误区！链接器**永远不会**（never）看到这条语句！\n\
  \n此外还存在与链接器相关的 Bug。一种难以发现的 Bug 发生在函数或全局变量有两个定义时。链接器将选择它找到的第一个定义并忽略另一个。发生这种情况时，某些链接器会显示警告信息（AIX\
  \ 链接器则**不会**显示！）\n\n另一个与链接相关的 Bug 发生在使用错误的参数调用函数时。链接器在匹配时只查看函数名。它不进行参数检查。这里有一个例子：\n\
  \n文件：`x.c`\n```c\nint f( int x, int y)\n{\n    return x + y;\n}\n```\n\n文件：`y.c`\n\
  ```c\nint main()\n{\n    int s = f(3);\n    return 0;\n}\n```\n\n使用原型声明可以防止此类类型的\
  \ Bug。例如，如果向 `y.c` 中添加原型声明：`int f( int, int);`，编译器就会捕获这个错误。实际上，最好的办法是将原型放在头文件中，并在\
  \ `x.c` 和 `y.c` 中包含它。为什么要使用头文件呢？\n\n为了让所有文件都使用的原型只有一个实例。如果在每个源文件中都手动输入一个独立的实例，就无法保证每个实例都是相同的。\n\
  \n如果只有一个实例，它就不可能与其自身不一致！为什么要将其包含在 `x.c`（定义函数的文件）中呢？以便编译器可以检查原型声明，并确保它与函数的定义一致。（补充说明：C++\
  \ 使用了一种名为 `name mangling`（名称修饰）的技术来捕获此类错误。）\n\n### 3. 运行时错误\n\n运行时错误发生在程序运行时，通常会导致程序中止。在\
  \ UNIX/Linux 系统上，中止的程序会创建一个 `coredump`（核心转储）。\n\n`coredump` 是一个名为 `core` 的二进制文件，包含了程序崩溃时的状态信息。像\
  \ `gdb` 和 `dbx` 这样的调试器可以读取此文件，并告诉你程序在崩溃时正在做什么有用信息。运行时错误有几种类型：\n\n### 非法内存访问\n\n\
  可能是最常见的错误类型。在 UNIX/Linux 下，程序将带有 `Segmentation fault(coredump)` 消息生成核心转储。\n\n使用\
  \ Win95 或 NT 时，程序也会中止。然而，传统的 DOS 不检查非法内存访问；程序会继续运行，但结果是不可预测的。\n\nDOS Borland/Turbo\
  \ C/C++ 编译器会检查写入 `NULL` 地址的数据。然而，在程序终止之前，不会显示 `NULL pointer assignment`（空指针赋值）错误消息。\n\
  \n### 除以零\n\n所有操作系统都会检测到此错误并中止程序。\n\n### 4. 调试工具\n\n许多调试程序的方法是详尽地将程序的行为与正确行为进行比较。通常，程序的正常输出不会显示所需的详细信息。调试工具允许你更详细地检查程序的行为。\n\
  \n### 4.1 `assert` 宏\n\n`assert` 宏是在 C/C++ 中放置测试的一种快速且简便的方法。要使用此宏，你必须在文件顶部包含 `assert.h`\
  \ 头文件。其格式为：\n\n`assert(boolean or int expression);`\n\n如果 `expression` 求值结果为真（即非零），`assert`\
  \ 什么都不做。但是，如果求值结果为假（零），`assert` 会打印错误信息并中止程序。例如，考虑：\n\n```c\nassert( x != 0 );\n\
  ```\n\n如果 `x` 为零，将显示如下：\n`Assertion failed: x != 0, file err.c, line 6`\n\n`assert`\
  \ 宏对于那些在正常工作时应该为真的合理检查（sanity checks）非常有用。它不应用于用户错误检查（例如文件不存在时）。这种情况应使用 `if` 语句。\n\
  \n当然，检查断言会使程序运行比不检查时慢一点。幸运的是，可以在不删除它的禁用 `assert`。如果定义了 NDEBUG（在包含 `assert.h` 的语句上方），该宏完全什么都不做。如果使用了这种技术，请确保\
  \ `assert` 语句没有执行运行所需的代码。\n\n### 4.2 打印语句\n\n这种传统的调试方法涉及在程序中大量插入打印语句。打印语句的设计是为了显示程序正在执行的代码以及变量的值。\n\
  \n### 4.3 调试器\n\n通过添加打印语句进行调试的方法有两个缺点：\n1. 添加新的打印语句时必须重新编译程序。\n2. 信息输出是固定的，在运行时无法更改。\n\
  \n源码级调试器提供了一种更简单的方法来跟踪程序的执行。它们允许人们：\n1. 在程序运行时查看任何变量的值。\n2. 在程序到达任何所需的语句暂停执行。（程序中的该位置被称为`断点`）。\n\
  3. 逐语句单步执行程序。\n\n我**强烈**建议你在任何使用的编程系统上学习使用调试器。调试器可以在调试程序时节省大量时间！\n\n### 4.4 Lint\n\
  \n`lint` 程序检查 C 程序是否存在常见的 Bug。它会扫描你的 C 源代码并列出可能的问题。警告一下，`lint` **非常**挑剔！例如，这一行：\n\
  \n```c\nprintf(\"Hello, World \");\n```\n\n会产生警告信息，因为 `printf` 返回的整数值没有被存储。`printf`\
  \ 的返回值通常被忽略，但 `lint` 仍然产生警告。有几种方法可以让 `lint` 对此语句满意，一种是：\n\n```c\n(void) printf(\"\
  Hello, World \");\n```\n\n### 4.5 走读\n\n`walk through` 是一种手动检查程序逻辑的过程。程序员和另一个人坐在一起（最好是另一个程序员，但任何人都可以），并一起走一遍程序\n\
  \n\n\n\n\n-   示例案例。通常是程序员本身在解释程序本应如何工作以及仔细检查其代码的过程中发现了 bug。\n\n然而，程序员很容易“主认为”程序应该在做什么，却对程序实际在做什么视而不见。\n\
  \n学生在与其他学生一起使用这种方法时需要非常小心。同一个班级的两个学生不应该一起运行同一个程序。\n\n## 5. 通用技巧\n\n### 5.1 寻找 bug\n\
  \n在移除 bug 之前，必须先发现它们！\n\n-   积极地测试程序！\n-   从易于手工检查的小问题开始。（你应该已经从[规划阶段](http://www.drpaulcarter.com/cs/debug.php#thinking)解决了其中一个问题了！）\n\
  -   至少对程序的每个功能测试一次！仅仅一次真的足够吗？如果可能，请以不同的方式测试功能。\n-   不要忘记测试琐微的问题。\n-   不要对输入数据做出无效假设。\n\
  \n### 5.2 确定 bug 的原因\n\nbug 只能由程序中已经执行的代码引起。确保你不要浪费时间去搜索尚未运行的代码。可以使用调试器或打印语句来确定哪些代码已经执行，哪些尚未执行。\n\
  \n不要通过盲目地修改代码直到它看起来可以工作来修复 bug。你需要弄清楚为什么一条语句有效而另一条无效。你应该为每一行代码提供充分的理由。“没有这一行就不行了”并不是一个好的理由！\n\
  \n![STAR-LOGO-2013](img/image00824.jpeg)\n\n## 章节：∞ 22 - 第二部分（常见 C 语言编程错误）\n\n#\
  \ 引言\n\n### Bug\n\n软件 bug 是计算机程序或系统中的错误、缺陷、故障或失效，会导致其产生错误或意外的结果，或以非预期的的方式运行。大多数\
  \ bug 源于人在程序源代码或设计中的疏忽和错误，或者源于此类程序使用的框架和操作系统，少数 bug 是由编译器产生错误代码引起的。\n\n包含大量 bug\
  \ 和/或 bug 严重干扰其功能的程序被称为 buggy（多 bug 的）。详细说明程序中 bug 的报告通常被称为 bug 报告、缺陷报告、故障报告、问题报告、麻烦报告、变更请求等。\n\
  \n### bug 如何进入软件\n\n在软件开发项目中，开发过程的任何阶段都可能引入“错误”或“故障”。bug 是编程任务中人为因素性质的后果。它们源于软件团队在规范、设计、编码、数据输入和文档编制期间产生的疏忽或相互误解。\n\
  \n例如，在创建一个相对简单的程序来按字母顺序对单词列表时，人的设计可能没有考虑当单词包含连字符时会发生什么。也许，当将抽象设计转换为所选的编程语言时，\n\n\
  ### 预防\n\n软件行业付出了大量精力寻找防止程序员在编写软件时无意引入 bug 方法。这些包括：\n\n#### 编程风格\n\n虽然程序代码中的拼写错误通常会被编译器捕获，但当程序员犯逻辑错误时，bug\
  \ 通常就会出现。编程风格和防御性编程的各种创新旨在降低这些 bug 概率或使其更容易发现。\n\n在某些编程语言中，所谓的拼写错误（尤其是符号或逻辑/数学运算符）实际上代表了逻辑错误，因为拼写错误的结构被编译器接受时，其含义并非程序员意图的含义。\n\
  \n#### 编程技术\n\nbug 经常会在运行中程序的内部数据中产生不一致性。程序可以写成在运行时检查其内部数据的一致性。如果遇到不一致性，程序可以立即停止，以便定位并修复\
  \ bug。或者，程序可以简单地通知用户，尝试修正不一致性并继续运行。\n\n#### 开发方法\n\n有几种方案可以管理程序员的活动，以便产生更少的 bug。其中许多属于软件工程范畴（它也处理软件设计问题）。例如，使用正式程序规范来描述程序的精确行为，以便消除设计\
  \ bug。\n\n遗憾的是，由于组合爆炸和不确定性问题，正式规范对于除极短程序以外的任何内容都是不实际或或可能的[需要引用]。\n\n在现代，流行的方法包括自动化单元测试和自动化验收测试（有时甚至达到测试驱动开发的极端程度），以及敏捷软件开发（这通常与自动化测试结合，在某些情况下强制要求自动化测试）。\n\
  \n所有这些方法都应该在 bug 和规范不当的需求引入后不久捕获它们，这应该使修复变得更容易、更廉价，并在它们进入生产使用之前至少捕获一部分。\n\n####\
  \ 编程语言支持\n\n编程语言通常包含有助于防止 bug 的功能，例如静态类型系统、限制的命名空间和模块化编程等。例如，当程序员编写（伪代码）\n`LET REAL_VALUE\
  \ = \"THREE AND A BIT\"` 时，尽管这在语法上可能是正确的，但代码未能通过类型检查。根据语言和实现，这可能在编译时或运行时被捕获。\n\n\
  此外，许多最近发明的语言故意排除了容易导致 bug 的功能，代价是让代码比所需的运行慢：通用原则是，由于摩尔定律，计算机变得越来越快，而软件工程师变得越来越慢；例如，`Java`\
  \ 编程语言不支持指针算术；某些语言（如 `Pascal`）的实现以及脚本语言通常具有数组运行时边界检查，至少在调试版本中是。\n\n### 代码分析\n\n\
  代码分析工具通过检查编译器能力之外的程序文本来帮助开发者发现潜在问题。尽管通常情况下，给定规范寻找所有编程错误的问题是不可解决的（参见`停机问题`），但这些工具利用了人类程序员在编写软件时倾向于犯同类错误的事实。\n\
  \n### \n\n监控软件运行性能的工具（无论是专门为了寻找瓶颈等问题，还是为了确保运行正确）可以显式地嵌入代码中（可能仅仅是简单的 `PRINT \"I AM\
  \ HERE\"` 语句），也可以作为工具提供。发现某段代码占据了大部分时间往往令人惊讶，而这种对假设的消除可能会导致代码重写。\n\n### 调试\n\n调试是一个系统化的过程，旨在发现并减少计算机程序中的\
  \ bug 或缺陷数量，使其按照预期行为。寻找和修复 bug（即“调试”）一直是计算机编程的重要组成部分。\n\n莫里斯·威尔克斯（Maurice Wilkes）这位早期计算先驱描述他在\
  \ 20 世纪 40 年代后期意识到他余下生命的大部分时间将花在发现自己程序中犯的错误上。\n\n\n\n\n程序员通常花费在寻找和修复 bug 上的时间和精力比编写新代码要多。软件测试人员是专业的，他们的首要任务是寻找\
  \ bug，或者编写代码来支持测试。在某些项目中，花费在测试上的资源可能比开发程序还要多。\n\n通常，调试最困难的部分是在源代码中找到 bug。一旦找到它，修复它通常相对容易。存在一些被称为调试器（debuggers）的程序，它们通过逐行执行代码、监控变量值以及其他观察程序行为的功能来帮助程序员定位\
  \ bug。\n\n在没有调试器的情况下，可以向代码中，将消息或值写入控制台（例如在 C 语言中使用 `printf`）或写入窗口或日志文件，以跟踪程序的执行情况或显示值。\n\
  \n然而，即使有调试器的帮助，定位 bug 也是一种门问。程序中某个部分的 bug 导致完全不同的另一个部分失败的情况并不少见，这使得追踪它变得特别困难（例如，图形渲染例程中的错误导致文件\
  \ I/O 例程失败），且发生在系统的一个看似不相关的部分。\n\n# 引言\n\n本章列出了作者反复看到的常见 C 语言错误，同时也提供了这些错误的解决方案。\n\
  \n# 2. 初学者错误\n\n这些是 C 语言初学生经常犯的错误。然而，专业人士有时也会犯这些错误！\n\n## 2.1 忘记在 `switch` 语句中放入\
  \ `break`。\n\n记住，当遇到 `case` 时，C 不跳出 `switch` 语句。例如：\n\n```c\nint x = 2;\n\nswitch(x)\
  \ {\ncase 2:\n  printf(\"Two\\n\");\ncase 3:\n  printf(\"Three\\n\");\n}\n```\n\n\
  输出：\nTwo\nThree\n\n放入 `break` 来跳出 `switch`：\n\n```c\nint x = 2;\n\nswitch(x) {\n\
  case 2:\n  printf(\"Two\\n\");\n  break;\ncase 3:\n  printf(\"Three\\n\");\n  break;\
  \  /* 没有必要，但如果以后添加额外的 case，这样更好 */\n}\n```\n\n## 2.2 使用 `=` 代替 `==`\n\nC 的 `=` 运算符专门用于赋值并返回被赋值的值。`==`\
  \ 运算符专门用于比较并返回一个整数值（0 为 `false`，非 0 为 `true`）。由于这些返回值，当人们本想用 `==` 却使用了 `=`，C 编译器通常不会标记错误。\n\
  \n例如：\n\n```c\nint x = 5;\nif ( x = 6 )\n  printf(\"x equals 6\\n\");\n```\n\n这段代码输出了\
  \ `x equals 6`！为什么？`if` 内部的赋值将 `x` 设置为 6 并向 `if` 返回值 6。由于 6 不是 0，这被解释为 `true`。\n\
  \n让编译器发现这种类型错误的一种方法是将任何常量（或任何右值表达式）放在左侧。这样如果使用了 `=`，就会是一个错误：\n\n```c\nif ( 6 = x)\n\
  ```\n\n## 2.3 `scanf()` 错误\n\n有两种常见的 `scanf()` 错误：\n\n### 2.3.1 忘记在参数上放入取地址符 (`&`）\n\
  \n`scanf()` 必须有变量的地址来存储输入的内容。这意味着通常需要使用取地址运算符 & 来计算地址。\n\n这里有一个例子：\n\n```c\nint\
  \ x;\nchar * st = malloc(31);\nscanf(\"%d\", &x);                    /* 需要 & 向 scanf()\
  \ 传递地址 */\nscanf(\"%30s\", st);                 /* 这里不需要 &，st 本身就指向变量！ */\n```\n\
  \n如上面最后一行所示，有时不加 & 是正确的！\n\n## 2.3.2 对操作数使用了错误的格式\n\nC 编译器不会检查 `scanf()` 调用的参数是否使用了正确的格式。最常见的错误是使用\
  \ `%f` 格式处理 double（必须使用 `%lf` 格式），以及在处理字符和字符串时混淆 `%c` 和 `%s`。\n\n## 2.4 数组的大小\n\n\
  C 中的数组始终从索引 0 开始。这意味着一个定义如下的 10 个整数的数组：\n\n```c\nint a[10];\n```\n\n其有效索引是从 0 到\
  \ 9，而不是 10！学生在数组中越界一位是非常常见的。这可能导致程序出现不可预测的行为。\n\n## 2.5 整数除法\n\n与 Pascal 不同，C 使用\
  \ `/` 运算符同时用于实数除法和整数除。理解 C 如何决定执行哪种除法非常重要。如果两个操作数都是整数类型，则使用整数除法，否则使用实数除法。例如：\n\n\
  ```c\ndouble half = 1/2;\n```\n\n这段代码将 `half` 设置为 0 而不是 0.5！为什么？因为 1 和 2 是整数常量。要修复此问题，将其中至少一个改为实数常量。\n\
  \n```c\ndouble half = 1.0/2;\n```\n\n如果两个操作数都是整数变量且需要实数除法，请将其中一个变量转换为 `double`（或\
  \ `float`）。\n\n```c\nint x = 5, y = 2;\ndouble d = ((double) x)/y;\n```\n\n## 2.6\
  \ 循环错误\n\n在 C 中，循环重复下一条语句。代码：\n\n```c\nint x = 5;\nwhile( x > 0 );\n```\n\n是一个无限循环。为什么？`while`\
  \ 后面的分号导致了这一点。\n\n## 2.7 未使用原型\n\n每次你使用指针，你都应该回答这个问题：`它指向哪里？` 如果你无法这个问题，它很可能没有指向任何变量。这种类型的错误在\
  \ UNIX/Linux 上经常会导致 `Segmentation fault/coredump` 错误，在 Windows 下会导致通用保护错误。（在旧的 DOS\
  \ 下（哎！什么都可能发生！）\n\n这里有一个这种类型错误的例子：\n\n```c\n#include <string.h>\nint main() {\n\
  \  char * st;        /* 定义指向字符或数组的指针 */\n  strcpy(st, \"abc\"); /* st 指向哪个字符数组？？\
  \ */\n  return 0;\n}\n```\n\n如何正确这样做？要么使用数组，要么动态分配数组。\n\n```c\n#include <string.h>\n\
  int main() {\n  char st[20];      /* 定义一个字符数组 */\n  strcpy(st, \"abc\"); /* st 指向字符数组\
  \ */\n  return 0;\n}\n```\n\n或者\n\n```c\n#include <string.h>\n#include <stdlib.h>\n\
  int main() {\n  char *st = malloc(20); /* st 指向分配的数组*/\n  strcpy(st, \"abc\"); \
  \    /* st 指向字符数组 */\n  free(st);               /* 完成后忘记释放！ */\n  return 0;\n}\n\
  ```\n\n实际上，对于这段代码所的功能，第一种解决方案要好得多。为什么？动态分配应该在需要时才使用。它比直接定义一个普通数组更慢且更容易出错。\n\n# 3.\
  \ 字符串错误\n\n## 3.1 混淆字符常量和字符串常量\n\nC 将字符常量和字符串常量视为完全不同的东西。字符常量用单引号包含，字符串常量用双引号包含。字符串常量作为指向实际字符串的指针。考虑以下代码：\n\
  \n```c\nchar ch = 'A'; /* 正确 */\n```\n\n\n\n\n```c\nchar ch = \"A\";    /* error\
  \ */\n```\n\n第二行将字符变量 `ch` 赋值为字符串常量的地址。这应该产生一个编译器错误。如果将字符串指针赋值给字符常量，也会发生这种情况：\n\n\
  ```c\nconst char * st = \"A\";    /* correct */\n\nconst char * st = 'A';    /*\
  \ error */\n```\n\n## 3.2 使用 == 比较字符串\n\n永远不要使用 `==` 运算符来比较字符串的值！字符串是 `char` 数组。`char`\
  \ 数组的名称就像指向字符串的指针（就像 C 语言中其他类型的数组一样）。那又怎样？考虑以下代码：\n\n```c\nchar st1[] = \"abc\"\
  ;\nchar st2[] = \"abc\";\nif ( st1 == st2 )\n    printf(\"Yes\");\nelse\n    printf(\"\
  No\");\n```\n\n这段代码输出 `No`。为什么？因为 `==` 运算符比较的是 `st1` 和 `st2` 的**指针值**，而不是它们所指向的数据。比较字符串值的正确方法是使用\
  \ `strcmp()` 库函数。（请务必包含 `string.h`）如果将上面的 `if` 语句替换为以下：\n\n```c\nif ( strcmp(st1,st2)\
  \ == 0 )\n  printf(\"Yes\");\nelse\n  printf(\"No\");\n```\n\n代码将输出 `Yes`。出于类似的原因，也不要对字符串使用其他关系运算符（`<`、`>`\
  \ 等）。在这里也要使用 `strcmp()`。\n\n## 3.3 未以空字符终止的字符串\n\nC 语言假设字符串是一个带有终止性空字符的字符数组。这个空字符的\
  \ ASCII 值为 0，可以简单表示为 0 或 `'\\0'`。这个值被用于标记字符串中有效数据的结束。如果缺少此值，许多 C 字符串函数将继续处理有效数据之后的数据，并且通常会越过字符数组本身的结尾，直到在内存中偶然找到一个零字节为止！\n\
  \n大多数创建字符串的 C 库函数始终会正确地对它们进行空终止。有些不会（例如 `strncpy()`）。请务必仔细阅读它们的描述。\n\n## 3.4 未为空终止符留出空间\n\
  \nC 字符串在字符串有效数据的末尾必须有一个空终止符。一个常见的错误是为这个额外的字符留留空间。例如，下面定义的字符串——\n\n```c\nchar str[30];\n\
  ```\n\n实际上只能容纳 29 个（而不是 30 个）实际数据字符，因为空字符必须出现在最后一个数据字符之后。这在动态分配中也是一个问题。以下是分配精确大小字符串以存放另一个字符串拷贝的正确方法：\n\
  \n```c\nchar * copy_str = malloc(strlen(orig_str) + 1);\nstrcpy(copy_str, orig_str);\n\
  ```\n\n常见的错误是忘记给 `strlen()` 的返回值加 1。`strlen()` 函数返回数据字符计数，不包括空终止符。这类错误非常很难检测。它可能不会引起任何问题，或者只在极端情况下产生问题。在动态分配的情况下，它可能会损坏\
  \ `heap`（程序用于动态分配的内存区域）并导致下一次堆操作（`malloc()`、`free()` 等）失败。\n\n## 4. 输入/输出错误\n\n\
  ### 4.1 错误地使用 fgetc() 等\n\n`fgetc()`、`getc()` 和 `getchar()` 函数都返回一个 `integer` 值。例如，`fgetc()`\
  \ 的原型是：\n\n```c\nint fgetc( FILE * );\n```\n\n有时这个整数确实是一个简单的字符，但有一个重要的情况，其返回值不是字符！这个值是什么呢？`EOF`。学生中一个常见的误解是文件末尾有一个特殊字符。文件末尾没有特殊字符。`EOF`\
  \ 是函数返回的整数错误代码。以下是使用 `fgetc()` 的错误方法：\n\n```c\nint count_line_size( FILE * fp )\n\
  {\n  char ch;\n  int cnt = 0;\n  while (ch = fgetc(fp)) != '\\n')\n    cnt++;\n\
  \  return cnt;\n}\n```\n\n这有什么问题？问题发生在 `while` 循环的条件中。为了说明，这里是重写后的循环，展示了 C 在背后会执行什么。\n\
  \n```c\nwhile( (int) (ch = (char) fgetc(fp) ) != '\\n')\n  cnt++;\n```\n\n`fgetc(fp)`\
  \ 的返回值被强制转换为 `char` 以将结果存储在 `ch` 中。然后必须将 `ch` 的值强制转换回 `int` 以与 `EOF` 比较。那又怎样？将一个\
  \ `int` 值转换为 `char` 再转换回 `int` 可能无法返回原始的 `int` 值。这意味着在上面的示例中，如果 `fgetc()` 返回 `EOF`\
  \ 值，强制转换可能会改变该值，导致与 `EOF` 的比较为假。解决方案是什么？如下所示将 `ch` 变量变为 `int`：\n\n```c\nint count_line_size(\
  \ FILE * fp )\n{\n  int ch;\n  int cnt = 0;\n  while (ch = fgetc(fp)) != EOF &&\
  \ ch != '\\n')\n    cnt++;\n  return cnt;\n}\n```\n\n现在唯一的隐藏强制转换是在这里：\n\n```c\n\
  while (ch = fgetc(fp)) != EOF && ch != '\\n') )\n```\n\n这种强制转换没有有害影响！所以，这一切的教训是：使用\
  \ `int` 变量来存储 `fgetc()`、`getc()` 和 `getchar()` 的结果。\n\n### 4.2 错误使用 feof()\n\n`feof()`\
  \ 的工作方式存在广泛误解。许多程序员像使用 Pascal 的 `eof()` 函数一样使用它。然而，C 的函数工作方式不同！区别是什么？C 的函数在由于文件结束读取失败时返回真。这里有一个误用\
  \ `feof()` 的示例：\n\n```c\n#include <stdio.h>\nint main()\n{\n  FILE * fp = fopen(\"\
  test.txt\", \"r\");\n  char line[100];\n  while( ! feof(fp) ) {\n    fgets(line,\
  \ sizeof(line), fp);\n    fputs(line, stdout);\n  }\n  fclose(fp);\n  return 0;\n\
  }\n```\n\n这段程序会两次打印文件的最后一行。为什么？在读取并打印最后一行后，`feof()` 仍然返回 0（假），循环继续。下次 `fgets()`\
  \ 失败导致持有内容的 `line` 再次打印。之后，`feof()` 返回真（因为 `fgets()` 失败了），循环结束。应该如何修复？一种方法是：\n\n\
  ```c\n#include <stdio.h>\nint main()\n{\n  FILE * fp = fopen(\"test.txt\", \"r\"\
  );\n  char line[100];\n  while( 1 )\n  {\n    fgets(line, sizeof(line), fp);\n \
  \   if ( feof(fp) ) /* 在 fgets() 之后检查 EOF */\n      break;\n    fputs(line, stdout);\n\
  \  }\n  fclose(fp);\n  return 0;\n}\n```\n\n然而，这并不是最好的方法。实际上没有理由使用 `feof()`。C 输入函数的返回值可以用于检查\
  \ EOF。例如，`fgets` 在遇到 EOF 时返回 `NULL` 指针。这里是程序的更好版本：\n\n```c\n#include <stdio.h>\n\
  int main()\n{\n  FILE * fp = fopen(\"test.txt\", \"r\");\n  char line[100];\n  while(\
  \ fgets(line, sizeof(line), fp) != NULL )\n    fputs(line, stdout);\n  fclose(fp);\n\
  \  return 0;\n}\n```\n\n### 4.3 输入缓冲区中留下字符\n\nC 输入（和输出）函数会对数据进行缓冲。缓冲将数据存储在内存中，仅在需要时从（或写入）I/O\
  \ 设备读取（或写入）数据。大块读取和写入数据比逐个字节（或字符）处理要高效得多。通常缓冲对编程没有影响。\n\n\n\n\n缓冲区现象可见的一个地方是使用 `scanf()`\
  \ 进行输入。键盘通常是行缓冲的。这意味着每一行输入都存储在一个缓冲区中。当程序在处理下一行输入之前，没有处理行中的所有数据时，就会出现问题。例如，考虑以下代码：\n\
  \n```c\nint x;\nchar st[31];\nprintf(\"Enter an integer: \");\nscanf(\"%d\", &x);\n\
  printf(\"Enter a line of text: \");\nfgets(st, 31, stdin);\n```\n\n`fgets()` 不会读取输入的文本行。相反，它可能只是读取了一个空行。事实上，程序甚至不会为\
  \ `fgets()` 调用等待输入。为什么呢？`scanf()` 调用读取了表示所读数字所需的字符，但它将 `'\\n'` 留在了输入缓冲区中。接着 `fgets()`\
  \ 开始从输入缓冲区读取数据。它发现一个 `'\\n'` 并停止，不需要额外的键盘输入。\n\n解决方案是什么？一种简单的方法是在 `scanf()` 调用后，读取并丢弃输入缓冲区中的所有字符，直到遇到\
  \ `'\\n'` 为止。由于此操作可能在很多地方使用，将其封装成函数是有意义的。这里有一个实现此功能的函数：\n\n```c\n/* function dump_line\n\
  *  此函数读取并丢弃文件当前输入行上上剩余的任何字符。\n*  参数 (Parameter):\n*     fp - 指向 FILE 的指针，用于从中读取字符\n\
  *  前置条件 (Precondition):\n*     fp 指向已打开的文件\n*  后置条件 (Postcondition):\n*  fp 引的文件定位在下一行的末尾\n\
  *  或者文件的末尾。\n*/\nvoid dump_line(FILE *fp)\n{\n  int ch;\n  while ((ch = fgetc(fp))\
  \ != EOF && ch != '\\n');\n}\n```\n\n这是使用上述函数修复后的代码：\n\n```c\nint x;\nchar st[31];\n\
  printf(\"Enter an integer: \");\nscanf(\"%d\", &x);\ndump_line(stdin);\nprintf(\"\
  Enter a line of text: \");\nfgets(st, 31, stdin);\n```\n\n一种错误的解决方案是使用：`fflush(stdin);`。这虽然可以通过编译，但其行为在\
  \ ANSI C 标准中是未定义的。`fflush()` 函数仅旨在用于输出流，而不是输入流。这种方法在某些编译器上似乎有效，但完全不具备移植性！因此，不应该使用它。\n\
  \n### 使用 gets() 函数\n不要使用此函数！它不知道传递给它的字符串中可以存储多少字符。因此，如果读取的字符过多，内存将会被损坏。互联网上有许多安全漏洞是利用这一点被利用的！请改用\
  \ `fgets()` 函数，但要记住，与 `gets()` 不同，`fgets()` 不丢弃输入中的终止符 `\\n`。`scanf()` 函数也可以以危险的方式使用。`%s`\
  \ 格式可能会覆盖目标字符串。然而，可以通过指定宽度来安全地使用它。例如，格式 `%20s` 读取的字符不会超过 20 个。\n\n### 大脑操练\n如果你在任何代码中发现任何错误，不要为调试它们而烦恼。运用你大脑的每一次脉动，如果它能引导你找到剩余\
  \ 1% 中的至少 99%。\n\n### 编写程序打印文本文档中找到的电子邮件地址\n```c\n#include <stdio.h>\n#include <ctype.h>\n\
  #include <string.h>\n\nint main(void) {\n  char line[1024];\n  char address[256];\n\
  \  char *ptr1 = NULL;\n  char *ptr2 = NULL;\n  while ((fgets(line, 1024, stdin))\
  \ != NULL) {\n    if (strchr(line, '@') && strchr(line, '.')) {\n      for (ptr1\
  \ = line, ptr2 = address; *ptr1; ptr1++) {\n        if (isalpha(*ptr1) || isdigit(*ptr1)\
  \ || strchr(\".-_@\", *ptr1) != NULL)\n          *ptr2++ = *ptr1;\n        } else\
  \ {\n          *ptr2 = '\\0';\n          if (strlen(address) >= 6 && strchr(address,\
  \ '@') != NULL && strchr(address, '.') != NULL)\n            printf(\"%s\\n\", address);\n\
  \          ptr2 = address;\n        }\n      }\n    }\n  }\n  return 0;\n}\n```\n\
