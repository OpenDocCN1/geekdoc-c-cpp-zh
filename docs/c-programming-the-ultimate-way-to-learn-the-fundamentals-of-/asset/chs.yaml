  \ ![11](img/image00822.jpeg)\n\n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 10\
  \ 章\n## (结构与联合体中的大脑)\n(枚举、位域字段、类型定义)\n\n# 引言\n数组是存储相同数据类型对象的首选方法。除了数组，还有三种派生数据类型可以用于存储信息：结构（structure）、联合体（union）、位域字段（bit\
  \ fields），以及 typedef 和枚举器（enumerator）。与数组不同，这些类型可以存储相同或不同类型的数据。\n\n### 结构 (Structure)\n\
  结构可以被定义为一种派生数据类型，它可以在单个单元中表示多种不同类型的数据。结构中的每个单独数据项被称为成员（member）。\n\n结构是将不同类型的数据打包在一起，以一种更有意义的方式组织数据的方法。结构定义创建了一个格式，可以用于声明结构变量。\n\
  \n结构定义通过使用关键字 `struct` 来指定。后面跟着大括号，括号内包含成员及其数据类型。\n\n例如：\n```c\nstruct student /*结构定义*/\n\
  {\n    int roll;       /*成员*/\n    char name [10 ];\n    float per;\n} s1,s2;  \
  \         /*结构 student 的对象或变量*/\n```\n\n结构的成员不是变量，因此不会为它们分配内存。只有在声明对象时（例如 `s1` 和\
  \ `s2`），它们才会在内存中被允许空间。\n\n#### 强化记忆操练\n关键字 `struct` 声明了一个结构 `student`，它包含三个不同的细节，即\
  \ `roll`、`name` 和 `marks`。这些字段被称为结构的成员或元素。该结构命名为 `student`，该名称称为结构标签（tag）。\n\n####\
  \ 变量/对象声明\n```c\nstruct student s1,s2;\n```\n结构变量可以与定义一起声明如下：\n```c\nstruct student\n\
  {\n    int roll;\n    char name[50];\n    float marks;\n} s1,s2;\n```\n\n#### 关于结构的注意事项\n\
  1. 结构定义以分号结束。\n2. 虽然整个定义被视为一条语句，但每个成员都是在单独语句中根据其名称和类型进行独立声明的（也称为模板）。\n3. 标签名称可以在结构定义时声明，也可以在随后的\
  \ `main` 函数中声明。\n4. 内存分配给变量，而不是给结构的成员。\n\n在数组中，我们可以使用下标运算符 `[]` 访问单个元素。结构使用不同的方案。它使用点运算符（`.`）。因此，引用上述结构\
  \ `s1` 中的 `marks` 时使用 `s1.marks`，在这里变量名在点之前，成员名在之后。\n\n#### 强化记忆操练\n结构的元素始终存储在连续的位置上。\n\
  ```c\nstruct student\n{\n    int roll;\n    char grade;\n    int marks;\n};\n\n\
  main()\n{\n    struct student s1={2, 'A', 89};\n    printf(\"Address of roll=%u\"\
  ,&s1.roll);\n    printf(\"Address of grade=%u\",&s1.name);\n    printf(\"Address\
  \ of marks=%u\",&s1.marks);\n}\n```\n此处程序的输出输出为：\nAddress of roll=65518\nAddress\
  \ of grade=65520\nAddress of marks=65521\n| s1.roll | s1.grade | s1.marks |\n| 2\
  \ | A | 89 |\n| 65518 | 65520 | 65521 |\n\n#### 使用数组的结构\n```c\nstruct student\n\
  {\n    int roll;\n    char name[50];\n    int marks;\n};\n\nmain()\n{\n    struct\
  \ student s1;\n    printf(\"Enter the data for student:\");\n    scanf(\"%d %s %d\"\
  ,&s1.roll,s1.name,&s1.marks);\n    printf(\"Rollnumber=%d,\\nname=%s\\nmarks=%d\"\
  ,s1.roll, s1.name,s1.marks);\n}\n```\n在上面的结构定义中，使用数组来存储学生的名字。虽然 `scanf` 在变量名前名前总是包含\
  \ `&`，但字符串没有 `&` 运算符。\n\n#### 结构数组\n```c\nstruct student\n{\n    int roll;\n   \
  \ char name[0];\n    int marks;\n} s[10];\n```\n上面的定义使用对象数组来存储 10 个学生的数据。\n\n####\
  \ 初始化\n```c\nstruct student s1={1,\"aj\",75.5};\nstruct student s2[3]={{1,\"aj\"\
  ,75.5}, {2,\"vij\",75.5},{1,\"ak\",75.5}};\n```\n#### 强化记忆操练\n如果我们初始化了结构的某些成员，那么其他成员将被初始化为零。\n\
  \n#### 结构中的结构（嵌套结构）\n结构中的结构被称为结构嵌套。当一个结构对象是另一个结构的成员时。\n```c\nstruct date\n{\n  \
  \  int d;\n    int m;\n    int y;\n};\n\nstruct employee\n{\n    int id;\n    struct\
  \ date dob;\n    struct date doj;\n} e1;\n\nmain()\n{\n    printf(\"Enter id of\
  \ a employee\");\n    scanf(\"%d\",e1.id);\n    printf(\"Enter date of birth\");\n\
  \    scanf(\"%d%d%d\",&e1.dob.d, &e1.dob.m,e1.dob.y);\n}\n```\n#### 强化记忆操练\n在上面的例子中，我们可以在\
  \ `employee` 结构内部定义 `date` 结构。\n\n#### 结构与指针\n```c\nstruct student s1,*p;\np = &s1;\n\
  s1.roll = 5;\n(*p).roll = 7; // 或者 p->roll = 7;\nprintf(\"%d\",s1.roll); /* 将打印\
  \ 7.*/\n```\n#### 强化记忆操练\n当通过对象访问结构成员时，使用点运算符（`.`）。当通过指针访问结构成员时，使用箭头运算符（`->`）。\n\
  ```c\nstruct box\n{\n    int feet;\n    int inches;\n};\n\nvoid swap(struct box\
  \ *p1, struct box *p2);\n\nmain()\n{\n    struct box b1,b2;\n    clrscr(); /*输入对象*/\n\
  \    printf(\"Enter height in feet & inches of box 1\");\n    scanf(\"%d%d\",&b1.feet,&b1.inches);\
  \ /*输入第二个对象*/\n    printf(\"Enter height in feet & inches of box 2\");\n    scanf(\"\
  %d%d\",&b2.feet,&b2.inches);\n    swap(&b1,&b2);\n    printf(\"After swap height\
  \ of 1ST box- %d feet %d inches\\n\",b1.feet, b1.inches);\n    printf(\"After swap\
  \ height of 2ND box- %d feet %d inches\\n\",b2.feet, b2.inches);\n    getch();\n\
  }\n\nvoid swap(struct box *p1, struct box *p2)\n{\n    int t;\n    /*交换 feet*/\n\
  \    t = p1->feet;\n    p1->feet = p2->feet;\n    p2->feet = t;\n    /*交换 inches*/\n\
  \    t = p1->inches;\n    p1->inches = p2->inches;\n    p2->inches = t;\n}\n```\n\
  \n\n\n\n\n## 联合体 (Union)\n\n联合体也是一种派生数据类型。它们也被用于将变量组合在一起。但区别在于，联合体的所有成员共享相同的内存位置，因此联合体一次只有一个成员可以存储有效值。联合体是一种在不同时间存储不同类型数据的变量。\n\
  \n联合体与结构体（structure）非常相似。联合体内定义的不同变量被称为联合体的成员。它们不需要是相同的数据类型。如果一个成员包含一个值而另一个成员被赋值一个值，那么第一个值会被第二个值覆盖。编译器分配足够的内存来容纳联合体中最大的成员。由于内存空间是共享的，这是一种内存内存。\n\
  \n### 语法：\n\n```c\nunion <联合类型名称>\n{\n    <类型> <变量名> ;\n    ...\n} [<联合体变量>] ;\n\
  ```\n\n### 示例：\n\n```c\nunion data\n{\n    char c; /*成员声明*/\n    int i;\n    long\
  \ l;\n    float f;\n} d1,d2;\n```\n\n**大脑训练-** 在上面的示例中，`d1` 和 `d2` 将各获得 4 个字节，因为联合体中最大的成员是\
  \ 4 字节。如果有多个最大字节的成员，则只考虑其中一个。\n\n**大脑训练-** 在上面的声明中，`union` 是一个关键字。\n\n**大脑训练-**\
  \ 点运算符（dot operator）用于访问联合体的成员。例如，访问上述联合体的成员：\n\n```c\nd.c = 'a';\nd.i = 10;\nd.l\
  \ = 65534;\nd.f = 72.456;\n```\n\n如果你在这个联合体的 `f` 成员中存储某些内容，然后访问 `i` 成员，那么 `i` 的值是不可预测的。\n\
  \n## 结构体与联合体的区别\n\n| | 结构体 (Structure) | 联合体 (Union) |\n| :--- | :--- | :--- |\n\
  | 1. | 关键字是 `struct`。 | 关键字是 `union`。 |\n| 2. | 结构体对象的内存等于所有成员内存之和。 | 联合体对象的内存等于联合体中最大成员的内存。\
  \ |\n| 3. | 所有成员都可以同时使用。 | 只有一个成员可以存储有效值。 |\n\n## 枚举数据类型 (Enumerated Data Type)\n\
  \n枚举数据类型是一种带有用户指定常量值的数据类型。语法与结构体或联合体相似：它用于定义常量。关键字是 `enum`。其后面跟着枚举器类型。这是一个允许该数据类型取值的名称列表。值被括在大括号中，并用逗号分隔。\n\
  \n### 示例：\n\n1. `enum bool{FALSE ,TRUE};` /*false 和 true 是值为 0 和 1 的常量。这种编号是自动完成的*/\n\
  \   `enum bool b1,b2;` /*enum bool 的对象*/\n   `b1 = FALSE;` 或 `b1 = TRUE;`\n\n2.\
  \ `enum dow{SUN, MON, WED=5, THU, FRI, SAT};` /*数字将是 SUN=0,MON=1,WED=5 等此类推*/\n\n\
  3. `enum color{blue, red, yellow};`\n   `enum color c1,c2;`\n   `c1 = red;`\n  \
  \ `c2 = green;`\n\n4. `enum color{blue, red, yellow} c1,c2;`\n   `c1 = red;`\n \
  \  `c2 = green;`\n\n5. `enum color {blue=10, green=15, yellow=30};` 如果我们不需要默认值 0,1,2…，那么我们可以自己赋值。\n\
  \n声明枚举类型不分配存储空间，仅描述用户指定的数据类型以及与大括号中给定值相关的整数常量。默认情况下，第一个值赋值为 0，第二个值赋值为 1，依此类推。\n\n\
  **大脑训练-** 我们可以在联合体中提供重复的值。\n**大脑训练-** 我们可以在联合体中提供浮点数。\n\n## 位域 (Bit Fields)\n\n\
  如果程序中的一个变量只需要存储值 1 或 0，那么我们只需要一个位（bit）来存储它。同样，如果变量需要存储 0 到 3 之间的值，只需要两个位，因为 0 到\
  \ 3 所有数字的二进制表示都是两位。如果值从 0 到 7 变化，则需要四位。\n\n但如果我们存储一个整数，则将使用 2 字节，从而浪费了大量内存，因为没有处理位（bits）的数据类型。然而，当有多个变量的值可以被打包进单个内存位置时，我们可以使用\
  \ `bit fields`。\n\n假设我们想要存储关于俱乐部成员的以下数据。每个成员可以有：\n1. 男或女。\n2. 已婚、未婚、寡偶或离婚。\n3. 拥有八种爱好之一（板球、足球等）。\n\
  4. 可以从十六种方案中的任何一种中选择（年度方案、月度方案等）。\n\n如果我们在 `gender` 中存储 0 或 1 来代替 Male（男）或 Female（女），这将节省一些字节。同样，其他值也可以转换为数字。这意味着我们需要一个位来存储性别，两个位来存储婚姻状况，三个位来存储爱好，四个位来存储方案。因此，总共我们需要\
  \ 10 位，所以我们可以将上述所有信息打包在两个字节中。\n\n因此声明遵循如下：\n\n```c\nstruct employee\n{\n    int\
  \ gender:1;\n    int mar_status:2;\n    int hobbies:3;\n    int scheme:4;\n};\n\
  ```\n\n上述声明中的冒号告诉编译器我们正在讨论位域，后面的数字表示分配给每个变量的位数。\n\n## 类型别名 (typedef)\n\nC 提供了 `typedef`\
  \ 结构，它允许程序员为内置或用户定义的数据类型提供同义名。`typedef` 就像是给数据类型起昵号。程序变得更容易追踪和理解。`typedef` 的通用用法是\n\
  \n```c\ntypedef 旧类型 新类型;\n```\n\n例如：\n`typedef int age;`\n\n这里 `age` 成为 `int` 的同义名。因此我们可以用\
  \ `age` 代替 `int`。\n`age a1,a2;`\n\n`typedef` 不分配存储空间，仅描述用户指定的数据类型。使用 `typedef` 结合结构体：\n\
  \n```c\ntypedef struct\n{\n    int roll;\n    char name[50];\n    int marks;\n}\
  \ st;\n\nmain()\n{\n    st s1,s2;\n}\n```\n\ntypedef 名称可以与结构体的标签名相同。\n\n### typedef\
  \ 与代码可移植性\n\n`typedef` 可以提高代码的可移植性。假设我们有一个应用程序假设所有整数都由 16 位存储单元表示。在计算机系统 A 上，`int`\
  \ 可能使用 32 位，在另一个系统 B 上，`int` 可能使用 16 位。\n\n因此，\n\n```c\ntypedef int INTEGER;\n```\n\
  \n在整个程序中，我们可以在变量声明中使用 `INTEGER` 代替 `short int`。这个 `typedef` 可以放在诸如 `port.h` 的文件中，然后包含在需要整数变量的文件中。\n\
