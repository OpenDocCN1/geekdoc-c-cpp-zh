  \n\n众所周知，大多数时候我们使用标准的“C”库函数，或者有时使用自定义函数。但我在这里最想向你们展示的是，如何将我们编写的“C”函数添加到那个漂亮的“C”标准库中呢？\n\
  \n是的，这是可能的，这是“C”编程中的一种专家方法。在将自定义函数添加到标准 C 库后，我们可以随时轻松访问它们。操作步骤如下：\n\n### 步骤 1\n\
  大多数“C”编译器在编译器工具程序中提供一个特殊的选项菜单；通过使用该工具，我们可以轻松完成这项任务。我想 Turbo C/C++ 编译器提供了一个名为 `tlib.exe`（Turbo\
  \ Librarian）的工具。让我们使用这个工具并向“C”库添加函数。\n\n### 步骤 2\n在这里我将我的 `factorial` 函数添加到“C”库中：\n\
  \n(a) 在某个文件（可能是 `fact.c`）中编写 `factorial()` 函数的定义：\n\n```c\nint factorial(int num)\n\
  {\n    int i,f=1; own    for(i=1;i<=num;i++)\n        f=f*i;\n    return(f);\n}\n\
  ```\n\n(b) 使用 `Alt+F9` 编译此 `fact.c` 文件，现在会自动创建一个名为 `fact.obj` 的新文件，其中包含机器语言编译代码。\n\
  \n(c) 执行以下命令将函数添加到库 `maths.lib`：`c:\\>tlib maths.lib+c:\\fact.obj`。这里，`maths.lib`\
  \ 是库文件名，`+` 是开关，`c:\\fact.obj` 是要添加到 `maths.lib` 的文件路径。\n\n(d) 在头文件（例如 `fact.h`）中声明\
  \ `factorial()` 函数的原型。调用函数时应包含此文件，不要忘记了。\n\n(e) 例如，看这里我们如何在任何程序中使用或调用我们添加的函数：\n\n\
  ```c\n#include \"c:\\fact.h\"\n#include<stdio.h>\n#include<conio.h>\nvoid main()\n\
  {\n    int f;\n    f=factorial(5);\n    printf(\"%d\",f);\n    getch();\n}\n```\n\
  \n### 从 C 库中删除自定义函数\n步骤 - 只需在中间使用减号：\n(c) 执行以下命令将函数从库 `maths.lib` 删除：`c:\\>tlib\
  \ maths.lib-c:\\fact.obj`\n\n### 创建自己的 C 库\n假设你想创建一个库，其中包含三个或更多你自定义的函数，例如：\n1. `factorial()`\n\
  2. `prime()`\n3. `Fibonacci()`\n\n注意：我认为这仅在 Turbo C/C++ 编译器中有效。按照我的以下操作：\n\n###\
  \ 步骤 1\n在名为 `myfuncs.c` 的文件中定义函数 `factorial()`、`prime()`、`fibonacci()`。不要在这个文件中定义\
  \ `main()`。\n\n```c\nint factorial(int);\nint prime(int);\nvoid fibonacci(int);\n\
  ```\n\n### 步骤 2\n从编译器的选项菜单中选择“Application”选项，现在从弹出的对话框菜单中选择“library”选项。\n\n### 步骤\
  \ 3\n使用 `Alt+F9` 编译程序。这将创建一个名为 `myfuncs.lib` 的库文件。\n\n### 步骤 4\n完成了，哇！！你的库现在已经创建好了。现在你可以轻松地使用这些函数，我将为你展示如何使用之前创建的函数库：\n\
  \n```c\n#include<stdio.h>\n#include<conio.h>\n#include\"myfuncs.h\"\nvoid main()\n\
  {\n    int f,result;\n    f=factorial(5);\n    result=prime(13);\n    fibonacci(6);\n\
  \    printf(\"\\n %d %d\",f,result);\n    getch();\n}\n```\n注意：文件 `myfuncs.h` 应与文件\
  \ `sample.c` 同一目录下。否则，在包含 `myfuncs.h` 时请指定正确的路径。\n\n步骤：进入编译器菜单“project”并选择“open\
  \ project”，然后在弹出的界面给出项目名称例如 `sample.prj`，然后点确定。\n步骤：从项目菜单选择“Add”，此时会出现文件对话框，选择文件\
  \ `sample.c` 然后选择“Add”。同样的方法添加 `myfuncs.lib`。完成！\n步骤：使用 `Ctrl+F9` 编译并执行项目。\n\n##\
