  \n# 章节：∞ 第 20 部分 – 第二部分 ∞\n# （操作系统开发）\n\n## 操作系统开发介绍-\n1. 强大的 API 函数。\n2. 函数的共享。\n\
  3. 应用程序的外观与感受。\n4. 硬件无关编程。\n5. 事件驱动编程模型。\n6. Dos 模型。\n\n### 1. 强大的 API 函数。\nWindows\
  \ 内部提供了许多函数，这些函数可以被其他用户定义或库函数调用。这些 Windows 函数被称为 `API`，即“应用程序编程接口”。字面上，有数百个非常丰富的函数可供。\n\
  \n它们不仅可以帮助应用程序执行如创建窗口、绘制线条、执行文件 I/O 等简单任务，还能完成诸如连接端口、接入网络、修改位图、播放 mp3 文件等复杂任务。Windows\
  \ 编程的关键在于使用这些 `API` 函数并有效地利用它们来轻松易举地创建丰富的应用程序。\n\n### 2. 函数的共享。\n在运行 Windows 程序期间，会调用多个\
  \ `API` 函数。想象一下，如果每个函数都成为每个程序 `.Exe` 文件的一部分，将会浪费多少磁盘空间。为了避免这种情况，`API` 函数定义在具有特殊扩展名\
  \ `.DLL` 的特殊文件中，`.DLL` 代表动态链接库（Dynamic Link Library）。\n\n这些是二进制文件。`.dll` 文件中的函数可以在执行或安装期间进行链接。当多个程序在\
  \ Windows 下运行时，所有这些函数可以共享相互调用。\n\n这些函数之间的链接是动态完成的（在执行期间）。这些函数不会成为可执行文件的一部分。结果是 `Exe`\
  \ 文件的大小不会失控。你也可以创建自己的 `DLLs`。你这么做的原因有两个二：\n\n(a) 在不同文件之间共享通用代码。\n(b) 提供被称为“组件”的段。\n\
  \n### 3. 外观与感受。\n这意味着每个程序都提供一致的用户界面。结果是，用户不需要花费大量时间来掌握新窗口。大多数 Windows 窗口占据屏幕，并通过其标题栏进行识别。一旦你使用滚动条、用于用户输入的对话框。\n\
  \n### 4. 硬件无关编程：\n正如我告诉你的，窗口程序可以轻松地调用 `API`。假设我们有一个被选中显示的窗口项，键盘或鼠标由设备驱动程序感知。此时，事件的发生被通知操作系统。\n\
  \n### 5. 事件驱动模型。\n当用户与窗口交互时，会发生很多事件。对于每个事件，都会发送一条消息，程序对其做出反应。由于消息的顺序是预测的，因此，调用函数的顺序由事件的发生决定。因此，这种模型被称为\
  \ `Event Driven Model`。\n\n用户可能有数百种方式进行交互。此外，某些事件可能在没有用户交互的情况下发生。例如，当我们创建一个窗口时，内容需要被绘制。因此，字面上可能有数百条消息被发送到应用程序，从而导致混乱。自然地，这些消息将以什么顺序被应用程序处理呢？通过将所有消息放入\
  \ `Queue`（队列），为这种混乱带来了顺序。队列中的消息按 `FIFO`（先进先出）原则处理。事实上，操作系统维护着几个队列。有一个队列是所有应用程序通用的，这个队列被称为\
  \ `system Queue`（系统队列）。此外，每个应用程序有一个队列，此类队列被称为 `Application Queue`（应用程序队列）。让我们理解维护这么多队列。\n\
  \n当我们点击鼠标发生事件时，设备驱动程序向 `system message queue` 发送消息。操作系统检索此消息，找出消息是发送给哪个应用程序的。接下来，它将消息发送到被点击鼠标的应用程序的\
  \ `Application Queue`。这就是事件驱动编程的全部内容。你的工作是预测用户可能对应用程序对象做什么，并在适当的时间准备好一个函数。只是当那个时间到来时，除了用户没人真正知道。\n\
  \n你首先需要理解简单软件编程与 Windows 操作系统开发的区别，Windows 编程模型处于 `MACRO`（宏）级别，让我们深入探讨，看看在 Windows\
  \ 操作系统环境下开发程序时需要的一些明显问题。\n\n有以下问题：\n(A) `SIZE OF POINTERS`（指针大小）。\n(B) `SIZE OF\
  \ INTEGERS`（整数大小）。\n(C) `HEAVY USE OF typedef`（大量使用 typedef）。\n\n\n\n\n另外最重要的一点是，微处理器能够访问内存内存取决于\
  \ `cpu` 寄存器的大小。这意味着我们可以在不同时间内 `cpu` 寄存器中存储 $2^{32}$ 个唯一地址，结果就是我们可以使用 `32-bit` 寄存器访问\
  \ `4 GB` 的内存位置。在我们的程序中，`32 bit` 地址必须存储在指针中，不要忘记在 `32-bit` 环境下的每个指针都是一个 `4 byte`\
  \ 实体。\n\n## 2. 整数的大小\n\n我想告诉你们，在 `16 bit` 环境下，整数的大小为 `2` 字节；另一方面，在 `32 bit` 环境下，`integer`的大小为\
  \ `4` 字节。在 `32 bit` 之后，`integer` 的范围将是 `-2147483648` 到 `+2147483647`。借此你认为 `int`\
  \ 和 `long int` 之间没有区别，但如果我们想存储一个人的年龄呢？我们知道年龄很难超过 `100`，在这种情况下，使用 `short int` 是最好的。\n\
  \n## 3. typedef 的大量使用\n\n如果我写了以下声明——\n\n```c\nHANDLE h;\nWAPRAM w;\nLPARAM I;\n\
  ```\n\n这些是数据类型吗？\n\n不，它们是 `typedef`，好吧。\n\n为什么 Windows 下的 C 程序大量使用 `typedef` ？\n\
  \n它有两个原因！！\n\n### (A)\n一个典型的窗口程序需要执行几项复杂任务，例如：打印文档、发送邮件、执行 I/O、管理多线程、数据处理任务等，所有这些任务都需要整数。但如果我们使用普通的整数数据类型来表示持有不同实体的普通变量，我们很快就会忘记这些整数值实际代表的是什么，这通过使用\
  \ `typedef` 解决了，好吧！！\n\n### (B)\n在窗口编程中，在许多地方我们被要求收集并处理不同但相互相关的数据。这可以使用结构（structure）来实现。\n\
  \n注意事项-\n\n- 为窗口程序编程使用 `32 bit` 编译器，如 `visual c++`。\n 使用 使用头文件 `windows.h`。\n\n\
