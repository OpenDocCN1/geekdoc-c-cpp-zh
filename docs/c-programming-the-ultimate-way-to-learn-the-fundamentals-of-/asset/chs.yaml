  ellipse\");\n    getch();\n}\n```\n\n#### 131. 编写使用所有直线函数画矩形\n```c\n#include<stdio.h>\n\
  #include<conio.h>\n#include<graphics.h>\nvoid main()\n{\n    int gd,gm;\n    initgraph(&gd,&gm,\"\
  \");\n    line(100,100,200,100);\n    line(200,100,200,200);\n    line(200,200,100,200);\n\
  \    line(100,200,100,100);\n    outtextxy(150,150,\"rectangle\");\n    getch();\n\
  }\n```\n\n#### 132. 编写用不同线条画矩形\n```c\n#include<stdio.h>\n#include<conio.h>\n#include<graphics.h>\n\
  void main()\n{\n    int gd,gm;\n    initgraph(&gd,&gm,\"\");\n    setlinestyle(SOLID_LINE,0);\n\
  \    line(100,100,200,100);\n    line(200,100,200,200);\n    line(200,200,100,200);\n\
  \    line(100,200,100,100);\n    setlinestyle(DASHED_LINE,4,0);\n    line(100,250,200,250);\n\
  \    line(200,250,200,350);\n    line(200,350,100,350);\n    line(100,350,100,250);\n\
  \    outtextxy(150,300,\"rectangle\");\n    getch();\n}\n```\n\n其他你可以使用的图形命令或函数有：\n\
  - `bar()`：绘制填充矩形。语法：`bar(left, top, right, bottom)`\n- `bar3d()`：绘制三维矩形。语法：`bar3d(left,\
  \ top, right, bottom, depth, top)`\n- `cleardevice()`：清除图形屏幕。语法：`cleardevice()`\n\
  - `closegraph()`：关闭图形系统。语法：`closegraph()`\n- `drawpoly()`：绘制多边形轮廓。语法：`drawpoly(numpoints,\
  \ farpolypoints)`\n- `getbkcolor()`：返回背景颜色。语法：`int A= getbkcolor()`\n- `getcolor()`：返回当前绘制颜色。语法：`int\
  \ A= getcolor()`\n- `maxx()`：返回屏幕 x 轴最大值。语法：`int A= maxx()`\n- `getmaxy()`：返回屏幕\
  \ y 轴最大值。语法：`int A= getmaxy()`\n- `getpixel()`：获取指定像素的颜色。语法：`unsigned A= getpixel(x,\
  \ y)`\n- `getx()`：返回当前的 x 坐标。语法：`int A= getx()`\n- `gety()`：返回当前的 y 坐标。语法：`int A=\
