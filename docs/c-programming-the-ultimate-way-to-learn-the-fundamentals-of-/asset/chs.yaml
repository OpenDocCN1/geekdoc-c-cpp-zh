  \n# 二维数组\n\n### 简介\n二维数组通常被称为矩阵（matrix），可以形象地理解为行和列。矩阵可以被视为数组的数组。创建二维数组时要指定两个维度，即行和列。例如，以下声明创建一个\
  \ 4 行 5 列的矩阵：\n\n```c\nint mat[4][5];\n```\n或\n```c\n#define MAXROW 4\n#define MAXCOL\
  \ 5\nint mat[MAXROW][MAXCOL];\n```\n\n| 0 | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|\n\
  | 0 | | | | | |\n| 1 | | | | | |\n| 2 | | | | | |\n| 3 | | | | | |\n\n数组按行存储，因此表达式\
  \ `mat[0]` 代表第一行的 5 个值，`mat[1]` 代表第二行，依此类推。同样，表达式 `mat[0][0]` 指向矩阵左上角的值，`mat[2][3]`\
  \ 代表第三行的第四个数。\n\n### 矩阵初始化\n1. `int mat[4][3];`\n2. `int mat[4][3] = {{10,20,30},\
  \ {50,60,70}, {90,100,120}};`\n3. `int mat[4][3] = {10,20,30,50,60,70,90,100,120};`\n\
  4. `static int mat[4][3];`\n\n**练习**：`int mat[]` 是无效的，因为没有指定维度。\n**练习**：`int mat[]\
  \ = {1,2,3,4,5}` 是无效的，因为无法确定矩阵的行列。\n**练习**：`int mat[][3] = {1,2,3,4,5}` 是有效的。\n\
  **练习**：`int mat[2][] = {1,2,3,4,5}` 是无效的，因为矩阵声明中列是强制性的。\n\n### 多维数组的映射\n让我们看看二维数组中元素的布局：\n\
  \n| | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|\n| 0 | 10 | 5 | 6 | 7 |\n| 1 | 36 |\
  \ 94 | 56 | 29 |\n| 2 | 83 | 67 | 12 | 69 |\n| 3 | 39 | 55 | 13 | 29 |\n\n上图数组布局仅在概念上成立。这是因为内存并不包含行和列。在内存中，无论是一维数组还是多维数组，数组元素都存储在一个链中。给定二维数组在内存中的布局所示所示：\n\
  \n| [0][0] | [0][1] | [0][2] | [0][3] | [1][0] | [1][1] | [1][2] | [1][3] | [2][0]\
  \ | [2][1] | [2][2] | [2][3] | [3][0] | [3][1] |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
  | 10 | 5 | 6 | 7 | 36 | 94 | 56 | 29 | 83 | 67 | 12 | 69 | 86 | 39 |\n| 100 | 102\
  \ | 104 | 106 | 108 | 110 | 112 | 114 | 116 | 118 | 120 | 122 | 124 | 126 |\n\n\
  ## 部分已解程序\n\n### 1. 编写程序对二维数组进行转置。\n```c\n#define maxrow 10\n#define maxcol 10\n\
