  10. x - x2/2 + x3/3 - x4/4 + x5/5 .............. (log(1+x))\n11. 编写程序打印 n 的乘法表。\n\
  12. 编写程序计算 n 的阶乘。\n13. 编写程序计算数字 n 的 p 次方。\n\n\n\n\n\n# 第五章：一维数组\n\n# 引言\n\n### 数组\n\
  数组是相似数据项或元素的集合。或者说，数组是存储在单一名称下的连续存储的同质数据元素的集合。\n\n### 数组的必要性\n当相同类型和性质的变量数量很多时，处理起来非常困难。因此我们需要数组。让我们通过一个例子来理解数组的使用：\n\
  \n```c\nint i,a;\nfor(i=1;i<=5;i++) {\n    printf(\"Enter the no.\");\n    scanf(\"\
  %d\",&a);\n}\n```\n\n在上面的程序中，一旦将新值赋值给变量 `a`，旧值就会丢失。因此，我们到目前为止使用的所有变量都无法在一个时刻存储一个以上的值。但有时我们希望为一个变量存储多个值。\n\
  \n例如，如果我们希望将 10 个学生的成绩按升序排列。\n\n我们有两种方法可以实现：\n\n## 编程练习\n\n1. 编写一个程序（WAP）计算从输入读取的值的平均值。输入序列以\
  \ `-1` 结束。\n2. 编写一个程序（WAP）从 `n` 个数字序列中找到最大值、第二最大值、最大值的位置和第二最大值的位置。\n3. 编写一个程序（WAP）使用\
  \ `while` 循环打印所有的 ASCII 值及其对应的字符。ASCII 值在 `0` 到 `255` 之间。\n4. 编写一个程序（WAP）打印 1 到\
  \ 500 之间所有的阿斯特姆数（Armstrong numbers）。如果数字每个数字位的立方之和等于数字本身，则该数字被称为阿斯特姆数。例如，`153=(1*1*1)+(5*5*5)+(3*3*3)`。如果数字是两位，则对数字平方。\n\
  5. 编写一个程序（WAP）打印 1 到 300 之间所有的素数。\n6. 编写一个程序（WAP）用笑脸填充整个屏幕。笑脸的 ASCII 值为 `1`。\n7.\
  \ 编写一个程序（WAP）使用 `for` 循环计算以下序列的前七项：`1/1!+2/2!+3/3!+......`\n8. 编写一个程序（WAP）使用 `for`\
  \ 循环生成 `1`、`2` 和 `3` 的所有组合。\n9. 根据研究，人的近似智水平可以使用以下公式计算：`i=2+(y+0.5x)`，这将产生一个 `i`\
  \ 和 `x` 的值表，其中 `y` 从 `1` 变 `6`，对于每个 `y` 的值，`x` 从 `5.5` 到 `12.5`，步长为 `0.5`。\n10.\
  \ 编写一个程序（WAP）打印给定数字之间所有的素数。\n11. 编写一个程序（WAP）统计给定数字的位数。\n12. 编写一个程序（WAP）打印给定数字所有数位之和。\n\
  13. 编写一个程序（WAP）检查给定数字是否为回文数。\n14. 编写一个程序（WAP）从用户输入的文本（以回车键结束）中统计所有的元音、辅音、数字、空格和符号。\n\
  15. 编写一个程序（WAP）求前 `n` 个素数的和。\n16. 编写一个程序（WAP）确定给定的值序列中的特定值是否为素数。从输入读取的值序列以 `0` 结束。\n\
  17. 打印以下序列的和：`1*2 + 2*3 + 3*4 + 4*5 + ....... + (n-1)*n`。\n18. 打印以下序列的和：`e-x = 1\
  \ - x + x2/2! - x3/3! + x4/4! .....`。\n19. 编写一个程序（WAP）读取 `n` 个数字并统计偶数和奇数：`1+1/2+1/3+1/4......+1/n`。\n\
  20. 编写一个程序（WAP）计算任意半径 `r` 的球的体积 `(4/3pir³)` 和表面积 `(4pir²)`。\n21. 编写一个程序（WAP）计算边长\
  \ `a`、`b` 和 `c` 的三角形的周长 `p` 和面积 `a`，其中 `p = a+b+c`，`a = sqrt(s(s-a)(s-b)(s-c))`\
  \ 且 `2s = a+ b+ c`。\n22. 编写一个程序（WAP）读取一个正整数并打印其二进制等价值。\n23. 编写一个程序（WAP）打印 `n` 个数的和、前\
  \ `n` 个偶数的和前 `n` 个奇数的和。\n24. 编写一个程序（WAP）计算 `n` 名员工的净工资。净工资 = `da + hra - pf`（`da`\
  \ 是基本工资的 `39%`，`hra` 是基本工资小于等于 `8000` 的 `15%` 以及超过 `8000` 部分的 `30%`，`pf` 是固定的 `600`）。\n\
  25. 写一个程序计算员工的加班费。超过 `40` 小时的加班费按每小时 `12.00` 卢比的标准支付。假设员工不按小时工作。\n26. 在购买某些物品时，如果购买数量超过\
  \ `1000`，则提供 `10%` 的折扣。如果通过键盘输入数量和单价，写一个程序计算总费用。\n27. 编写一个程序（WAP）检查给定值序列是否按升序排列。该序列的哨兵值为\
  \ `-1`。\n28. 编写一个程序（WAP）找到给定的 `n` 个值序列中位置可被 3 整除的值的和和平均值。\n29. 编写一个程序（WAP）输入 `n`\
  \ 名学生的成绩并统计获得 `a`、`b`、`c`、`f` 等级的学生人数。根据以下标准授予等级：\n\n| 分数 | 等级 |\n| :--- | :---\
  \ |\n| >= 80 | A |\n| >= 70 | B |\n| >= 60 | C |\n| >= 50 | D |\n| < 50 | F |\n\
  30. 编写一个程序（WAP）打印回文：`a`、`aba`、`abcba`、`abcdba`、`abcdedcba`。\n\n\n\n\n\n- (i) 使用\
  \ 10 个不同的变量，以便每个变量可以存储一个学生的成绩。\n- (ii) 使用单个变量，其可以存储所有学生的成绩。\n\n显然，第二种方案看起来更好，因为它更容易处理。一个可以同时存储多个值的单变量被称为\
  \ `Array`（数组）。\n\n### 练习笔记-\n它是存储在一个名称下的连续存储的同类数据元素的集合。数组的声明如下：\n\n```c\nint a[6];\n\
  ```\n\n在这里，`a` 是数组名，`int` 是数组将存储的值的数据类型，`6` 是数组的大小，`[]` 称为下标运算符。数组的大小必须是一个常量。最重要的一点是数组中的所有值都应该是相同类型。\n\
  \n![](img/image00846.jpeg)\n\n`10`, `20`, `30`, `40`, `50` 是数组的元素。要使用数组的元素，我们引用索引。数组的索引从\
  \ `0` 开始，即如果数组的大小为 `6`，那么数组的索引将从 `0` 到 `5`。\n\n在定义中我们还提到数组元素是连续存储的，例如如果索引 `0` 处的元素地址为\
  \ `100`，那么如果数组是整数数组，后续元素的地址将为 `102`, `104`, `106`, `108`, `110`，因为一个整数只占用 `2` 字节。但如果是浮点数数组，地址将为\
  \ `100`, `104`, `108`, `112`, `116`, `120`，因为浮点数占用 `4` 字节。\n\n如果程序中使用需要多个相同大小的数组，可以使用另一种类型的声明。\n\
  \n### 示例，\n如果要计算一个级学生的百分比，并将所有学生的成绩输入到数组中。那么所有数组的大小应该是相同的。\n\n因此，可以使用这种类型的声明：\n\n\
  ```c\n#define SIZE 10\n\nmain()\n{\n    int maths[SIZE], hindi[SIZE], english[SIZE];\n\
  }\n```\n\n**练习笔记：** 这里 `SIZE` 是一个全局或符号常量。\n\n### 数组初始化：\n\n| 声明 | 注释 |\n| :--- |\
  \ :--- |\n| `int a[5];` | /*该数组将包含垃圾值*/ |\n| `int a[5]={10,20,30,40,50};` | /*该数组将包含\
  \ 10,20,30,40,50 值*/ |\n| `int a[5] = {0,0,0,0,0};` | /*该数组将包含 0,0,0,0,0 值*/ |\n\
  | `int a[5] = {0};` | /*该数组将包含 0,0,0,0,0 值*/ |\n| `int a[5] = {1};` | /*该数组将包含 1,0,0,0,0\
  \ 值*/ |\n| `int a[5] ={10, , 30};` | /*该数组将包含 10,0,30,0,0 值*/ |\n| `int a[ ] = {10,20,30};`\
  \ | /*该数组的大小将被假设为 3*/ |\n| `int a[3] = {10,20,30,40};` | /*初始化过多错误。*/ |\n| `static\
  \ int a[5];` | /*该数组将包含 0,0,0,0,0 值*/ |\n\n**练习笔记：** 如果缺少数组的大小但给出了值，那么形成的数组的大小将等于初始化的次数。\n\
  \n**练习笔记：** 如果初始化的次数超过数组的大小，则会给出初始化过多的错误。\n\n### 数组的局限性 -\n1. 形成的数组是同质的。也就是说，整数数组只能存储整数值，而浮点数组只能存储浮点值，字符数组只能包含字符。因此，没有任何数组可以包含两种数据类型的值。\n\
  2. 在声明数组时必须传递数组的大小，且大小必须是常量。因此会导致内存的短缺或浪费。\n3. 在数组中插入或删除元素需要移动。\n4. 数组不检查其边界：在 C\
  \ 语言中，没有检查来查看输入数组的值是否超过了数组的大小。使用超过数组大小的下标输入的数据将被简单放在数组之外，可能会放在数据或程序本身之上。\n\n这至少会导致不可预测的结果，而且不会有错误信息警告程序员越界数组大小。在某些情况下，程序可能会挂起。因此，以下程序可能会产生意外的结果：\n\
  \n```c\nint a[10],i;\nfor(i=0;i<=20;i++)\n    a[i]=i;\n```\n\n### 一些求解程序\n\n**1.\
  \ 写一个程序打印 n 个数字的平均值。**\n```c\nint a[5],n,i,sum=0;\nfloat avg;\nprintf(\"Enter the\
  \ number of elements in the array:\");\nscanf(\"%d\",&n); // 输入数组\nfor(i=0;i<n;i++)\
