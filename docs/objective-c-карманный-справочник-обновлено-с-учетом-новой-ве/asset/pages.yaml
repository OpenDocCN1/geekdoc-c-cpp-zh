  md: "# CHAPTER 1: The Objective-C Philosophy\n\n4\n\n\n\n\that pointer casting in\
    \ Objective-C and C++ have very different semantics. When you cast a pointer to\
    \ one object type to another in Objective-C, no code is generated. The cast is\
    \ just a hint to the compiler’s type checker. In C++, however, a pointer cast\
    \ performs some pointer arithmetic so that code that is passed the cast pointer\
    \ can find the vtable at the correct location. This means that you can cast any\
    \ object type to any other object type in Objective-C, whereas in C++ you need\
    \ to use a special kind of cast.\n\nThis distinction is very important. In Objective-C,\
    \ the only thing that affects the method lookup is the type of the object. In\
    \ C++ and other Simula-family languages, the lookup is also affected by what the\
    \ compiler thinks the type of the object is.\n\n# A Tale of Two Type Systems\n\
    \nOne of the things that can confuse people coming to Objective-C is that it has\
    \ two type systems. This makes sense if you consider the original implementation\
    \ as a preprocessor. The Objective-C preprocessor would perform Strongtalk-like¹\
    \ type checking and then the C\n\n> ¹StrongTalk is a dialect of Smalltalk that\
    \ adds optional static type checking. The team that created the language later\
    \ went to work on Java. StrongTalk was the fastest Smalltalk implementations,\
    \ but the compiler did not use static type information for optimization."
