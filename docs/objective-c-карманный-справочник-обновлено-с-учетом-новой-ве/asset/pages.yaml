- pgno: 18
  md: '# The Objective-C Philosophy


    To understand Objective-C, you need to understand the philosophy behind its creation.
    Unlike C++, D, or Java, which were designed to be new, C-like languages, Objective-C
    is a hybrid language. It is a pure superset of C, meaning that every valid C program
    is also a valid Objective-C program, but it also allows some Smalltalk-like syntax
    and semantics.


    One of the designers of Objective-C, Tom Love, described the square bracket syntax
    as a signpost reminding you that you were leaving C and entering “object land.”
    The original idea behind Objective-C was a way of packaging C libraries that encouraged
    loose coupling between components.


    One of the fundamental design decisions in Objective-C was that there should be
    no magic. All of the details of the implementation are'
  merge: -1
  img_proc: true
- pgno: 19
  md: '2 CHAPTER 1: The Objective-C Philosophy


    exposed to the programmer. Unlike C++, we the details of the vtable are private,
    Objective-C lets you inspect and modify everything about objects and classes.


    With older runtime libraries, Objective-C classes were represented by C structures
    with a public definition. You could modify them directly, or create new ones and
    register them with the runtime system. With newer ones, these structures are private
    and there is a set of public functions for manipulating them as opaque types.


    # Understanding the Object Model


    Objective-C has a Smalltalk-like object model. If you come from Java, you will
    find this very easy to understand. If you come from a Simula-family language,
    such as C++, you may find it a bit more difficult.


    Alan Kay described the idea of objects as a simple exercise in reduction. When
    solving a problem, you want to decompose it into simple parts. The simplest thing
    that can run a part of a program is the same thing that can run the whole of a
    program: a computer. Objects, in Alan Kay’s vision, are simple models of computers
    that communicate by exchanging messages.


    This is exactly how objects in Objective-C, and its parent Smalltalk, behave.
    They are'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Understanding the Object Model


    isolated parts of a program that pass messages between each other. Typically,
    these messages are delivered synchronously, so they behave a bit like a function
    call, but it''s important to realize that they are different.


    Messages are a higher level of abstraction than function calls. A function call
    is very simple. On many more RISC-like architectures, you push the return address
    onto the stack and then jump. In all cases, the destination address is fixed.


    When you send a message, it is entirely up to the receiver how to handle it. The
    most typical way is to invoke the method with the same name as the message, but
    there are other alternatives. Proxy objects may forward the message to another
    object, and they may perform some substitution on the message arguments before
    they do.


    Simula did not use the term “object orientation,” but a lot of Simula-like languages
    that postdate Smalltalk have adopted the term, leading to some confusion. Languages
    in this family, such as C++, use virtual function tables (vtables) to implement
    something that is superficially similar.


    A Simula-style object contains a pointer to its vtable, or vtables if it has superclasses.
    When you call a virtual function, the compiler creates an offset into the vtable
    and then a call to the function at this offset.


    One of the side effects of this difference is'
  merge: -1
  img_proc: true
