    From: NSFileHandle+Socket.m


    We looked briefly at the NSFileHandle class in Chapter 13 and I mentioned that
    it wrapped a file descriptor. The socket API was designed based on the UNIX everything-is-a-file-even-when-it-doesn’t-make-sense
    model, so sockets are also file descriptors. You can use the same function calls
    for reading from and writing to a socket that you can use with any other file
    descriptor.


    You can also use an NSFileHandle to wrap a socket. This lets you use the low-level
    APIs to create a socket to your exact specifications, then use a more abstract
    way of interacting with the created socket. If you need to use any parts of the
    low-level socket API that are not conveniently exposed by the higher-level APIs
    then this is the only solution that you can use. In other cases, it is still often
    the most convenient one.


    The biggest advantage of wrapping your socket in a file descriptor object is that
    you can easily integrate it with the run loop. This lets you very easily write
    event-driven socket code. The other'
