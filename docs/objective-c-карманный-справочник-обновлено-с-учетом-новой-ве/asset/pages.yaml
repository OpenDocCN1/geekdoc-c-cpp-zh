- pgno: 22
  md: '# C Is Objective-C 5


    compiler would perform C type checking.


    C has a structural type system. Type equivalence for primitive types is based
    on whether two types have the same representation. Complex types are never regarded
    as equivalent.

    Objective-C adds an algebraic type system. The type of an object is defined by
    its signature: the messages it claims it will respond to. You can implicitly cast
    an Objective-C object to its superclass, because it is guaranteed to respond to
    all of the messages that the superclass understands.


    You can explicitly cast objects to other types. You could, for example, cast a
    dictionary object to an array object. As long as you then only send it messages
    that are understood by both dictionaries and arrays, this will work.


    # C Is Objective-C


    One of the most important features of Objective-C is that it is a pure superset
    of C. You can think of C as a domain-specific language embedded in Objective-C
    for low-level tasks and a subset of Smalltalk as a domain-specific language embedded
    in Objective-C for high-level tasks.


    There is nothing wrong with solving a problem using pure C. One of the mistakes
    that a lot of people make when learning Objective-C is to assume that they must
    stop using C. For a lot of things, the C solution is the correct one.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# CHAPTER 1: The Objective-C Philosophy


    **Note:** Objective-C also has a sister language, Objective-C++, which has the
    same relationship to C++ that Objective-C has to C. Objective-C++ is a pure superset
    of C++ and allows you to call C++ code from Objective-C objects, and vice versa.
    Because they have very different object models, you cannot subclass an Objective-C
    class with C++, or the converse; however, you can use pointers to Objective-C
    objects as fields in C++ objects and pointers to C++ objects as instance variables
    in Objective-C objects.


    You can see this in the Cocoa frameworks. Not everything is an object. If you
    ask for a range of characters in a string, you will use NSRange structure. This
    is a C structure—not an Objective-C object—containing a location and a length.
    Points, rectangles, and several other things are represented in a similar way.
    If these were objects, then you would use more memory, make manipulating them
    slower, and not really gain any flexibility.


    The Ingalls test^2 says that you should be able to create a new kind of integer
    and use this in positioning a window on the screen. Objective-C fails this test,
    but it''s not a very useful example in the real world, because most of the time
    designing new kinds of


    > ^2Named after Dan Ingalls, one of the designers of Smalltalk, who proposed it.'
  merge: -1
