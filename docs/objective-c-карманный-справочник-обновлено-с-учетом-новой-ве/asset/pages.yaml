  md: '# Network Access


    The standard cross-platform way of writing network-aware applications is the Berkeley
    Sockets API. This was written as part of the same grant that developed the TCP/IP
    and is designed to be protocol-agnostic.


    Most languages have an implementation of this API. In Objective-C, you are, as
    always, free to use the C version, which provides all of the power of the low-level
    interfaces.


    Most of the time, however, this is a lot of effort for very little gain. The Foundation
    framework provides several classes that make it easier to write networked applications.
    Using these abstractions sometimes loses you some of the power of the lower-level
    APIs, but not much.'
