    Traditionally, there are two options for process termination. A process can exit
    gracefully, by reaching a safe place to stop and then calling exit() or reaching
    the return statement in the main() function. Alternatively, it can exit abruptly,
    by receiving an unhandled signal, including something like a segmentation fault.'
