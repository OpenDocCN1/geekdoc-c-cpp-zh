- pgno: 293
  md: 'control the priority of the current thread. When sent to an instance, they
    control the priority of the thread encapsulated by that object.

    The priority of a thread determines how much CPU time it will get and how long
    it has to wait between being given access to the CPU. With the lower-level POSIX
    APIs for controlling thread priority, you can also set the scheduler policy. The
    functions for doing this are all part of the POSIX realtime extensions, which
    also provide signal queues and so on. This is not exposed (yet) by the Objective-C
    APIs.

    Priorities set with this API are double-precision floating-point values between
    0 and 1. These will be scaled to some integer range that the scheduler understands,
    so you should remember that small differences will be rounded.

    The POSIX specification defines two contention scopes for threads. A thread''s
    priority defines a base value for whether it should be allowed CPU time, which
    is scaled based how much it has already had and how long since it last had any.
    The contention scope determines which threads compete for CPU time. With a system
    contention scope, the thread competes with all other threads in the system. With
    a process contention scope, it only competes with threads owned by the same process.

    OS X only implements the system scope, which means a high-priority thread will
    steal processor time away from threads in other'
