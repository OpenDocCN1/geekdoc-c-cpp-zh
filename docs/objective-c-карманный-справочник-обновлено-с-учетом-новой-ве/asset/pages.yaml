    It is common not to bother sending a -retain message to objects when you create
    a pointer to them on the stack. This means that an object may be referenced in
    two or more places, even though its retain count is only one.


    Pointers in Objective-C are divided into two categories: owning references and
    non-owning references. An owning reference is one that contributes towards the
    retain count of an object. When you call a method like +new or -retain, you get
    an owning reference to a new object. Most other methods return a non-owning reference.
    Instance variables and global variables are typically owning pointers, so you
    should assign owning references to them. You also need to ensure that you delete
    the existing owning reference (by sending a -release message) when performing
    an assignment.


    Temporary variables are typically non-owning references. Automatic reference counting
