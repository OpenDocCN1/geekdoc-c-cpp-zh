  md: '# Automatic Reference Counting


    It would be nice if life were that simple. Unfortunately, ARC does have some limitations.
    More specifically, it formalizes the fuzzy boundary between C memory and Objective-C
    objects. ARC divides pointers into three categories. Strong pointers follow the
    same retain/release semantics that we''ve looked at already. Weak pointers, which
    we''ll look at later, are non-owning references that are automatically zeroed
    when the object is destroyed. Unsafe unretained pointers are pointers that are
    ignored by ARC: You are responsible for tracking the lifetime of objects stored
    in them.


    By default, all object pointers in instance variables or on the stack are strong.
    Object pointers in structures have no default. They must be explicitly marked
    with the `__unsafe_unretained` ownership qualifier. Even though this is the only
    permitted ownership for these pointers, it must be explicitly stated to provide
    a reminder to people reading the code that ARC will ignore it.'
