  md: '# Acknowledgments


    When writing a book about Objective-C, the first person I should thank is Nicolas
    Road. I got my first Mac at around the same time I started my PhD and planned
    to use it to write Java code, not wanting to learn a proprietary language. When
    I started my PhD, I found myself working with Nicolas, who was an active GNUStep
    contributor. He convinced me that Objective-C and Cocoa were not just for Macs
    and that they were both worth learning. He was completely right: Objective-C is
    a wonderfully elegant language, and the accompanying frameworks make development
    incredibly easy.


    The next person to thank is Fred Kiefer. Fred is the maintainer of the GNUStep
    implementation of the AppKit framework. He did an incredibly thorough (read: pedantic)
    technical review of this book, finding several places where things were not explained
    as well as they could have been. If you enjoy reading this book, then Fred deserves
    a lot of the credit.


    Finally, I need to thank everyone who was involved in bringing this book from
    my text editor to your hands, especially Mark Taber who originally proposed the
    idea to me.'
