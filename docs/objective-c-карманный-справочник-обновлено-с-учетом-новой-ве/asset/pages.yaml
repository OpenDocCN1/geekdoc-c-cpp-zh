- pgno: 237
  md: '# CHAPTER 10: The Environment


    In both cases, the kernel will reclaim all of its shared resources, but in the
    case of abrupt termination some of these resources may have been left in an inconsistent
    state. A typical example of this is a file in the course of being modified.


    This used to be a big problem with complex applications, such as word processors.
    They would open the file for writing, start modifying it, then crash, leaving
    the file in a state where it was very difficult to recover the contents. You can
    avoid this by using the atomic writing facilities on most Foundation objects,
    which write to a temporary file and then rename it, so the writer either succeeds
    entirely or fails entirely—it doesn''t even half succeed.


    With OS X 10.6, Apple introduced the sudden termination mechanism. The theory
    behind this was that lot of programs spend a lot of time on exit running destructors
    for objects that have no effects other than to release memory that the operating
    system will reclaim anyway. With sudden termination, a process can advertise that
    it doesn''t have any unsaved data. The operating system is free to kill it abruptly,
    rather than request it to exit gracefully.


    This is particularly useful for long-running background tasks that are idle for
    a long time. They will generally be swapped out by the kernel. When you ask them
    to exit gracefully, a lot of code and data needs to be paged in to'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Supporting Sudden Termination


    handle the exit. With sudden termination, the pages in the swap file will just
    be flagged as available for reuse.


    Supporting sudden termination in your application is very easy. You call two methods
    on NSProcessInfo, one on either side of some action that can''t be interrupted.


    Note: If you use AppKit with NSDocument infrastructure, you don''t need to do
    anything. Your application will be marked as not supporting sudden termination
    when any documents have unsaved data.


    These methods are called -disableSuddenTermination and -enableSuddenTermination,
    but the names are slightly misleading. They don''t actually enable and disable
    sudden termination, they modify a counter. When the counter reaches 0, the application
    is marked as being killable.

    This means that you can use them in different threads or nest them without any
    problems. The counter starts set to one, so you must explicitly send an -enableSuddenTermination
    message to the process info object to enable it. If you are creating an application,
    you can avoid this by setting a key in the application bundle''s property list
    file.

    Cocoa applications, as opposed to commandline tools, are typically distributed
    as bundles.'
