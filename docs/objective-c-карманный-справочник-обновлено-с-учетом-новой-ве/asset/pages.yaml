  md: '# CHAPTER 4: Common Objective-C Patterns


    A class cluster is an abstract superclass that hides concrete subclasses. This
    is easier in Objective-C than many other languages, because there is no keyword
    for object creation. When you send a message to a class asking for a new instance,
    the class may return an instance of itself, but it may also return an instance
    of some subclass.


    If you create an NSArray using +arrayWithObjects:, you may get a subclass that
    wraps a simple C array. If you create one using +arrayWithArray:, you are likely
    to get one that just references the other array.


