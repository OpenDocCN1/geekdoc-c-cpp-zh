  md: '# CHAPTER 17: Network Access


    # Finding Network Peers


    From: netservice.m


    Over the years, lots of protocols have been used for finding services on the local
    network. Both NetBIOS and AppleTalk were common on local networks until the mid
    ''90s, until they started to be phased out in favor of TCP/IP.


    The TCP/IP protocol stack didn’t include anything for doing this. The closest
    it came was the broadcast address. If you send a packet to the broadcast address
    then it will be sent to everyone on the local segment. This has a lot of problems;
    it only works on the local physical segment, it’s inefficient on modern switched
    networks, and it’s a very low-level approach.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'IETF’s ZeroConf working group proposed multicast DNS (mDNS) as the solution
    to this. DNS is a scalable way of publishing mappings. It is most commonly used
    for mapping from host names to IP addresses, but it can be used for things like
    telephone numbers, geolocation information, and a host of other things.


    With mDNS, individual computers may publish DNS records in the .local domain.
    This is then used as the foundation for DNS service discovery (DNS-SD), which
    describes a way of advertising arbitrary services over DNS. You can use this standard
    with traditional hierarchical DNS too, but it is most useful with mDNS.


    The combination of the two standards is often referred to as Bonjour and is exposed
    to Objective-C via the NSNetService class. This allows applications to publish
    DNS-SD records and find all of the records for a particular service.


    Lots of applications use this on OS X. Safari uses it to share bookmarks; iChat
    uses it to find contacts for serverless messaging; iTunes uses it for sharing
    music; and the system uses it for finding shared folders and printers. If you
    are writing any kind of networked application, you may find it helpful to advertise
    to peers using NSNetService.


    When you advertise a service, you must specify a unique name. If you are using
    distributed objects, which we’ll look at the end of'
