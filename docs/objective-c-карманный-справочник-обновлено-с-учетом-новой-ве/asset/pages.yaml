    The most distressing limitation, however, is that they don’t make it easy to support
    SRV records. These are DNS records that advertise a service to port mapping, as
    well as a hostname to IP address mapping. They are used by DNS-SD, but the IP
    address shortage makes them increasingly common in hierarchical DNS on the public
    Internet.


    If you look up a server address on OS X using the POSIX getaddrinfo() function,
