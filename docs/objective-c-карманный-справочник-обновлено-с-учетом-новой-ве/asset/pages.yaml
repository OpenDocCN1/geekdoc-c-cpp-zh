    Floating-point values are made of two components: a mantissa and an exponent.

    Their value is two to the power of the exponent, multiplied by the mantissa.


    The problem with floating-point values is that they are binary. This means that
    their precision is defined in terms of binary digits, which is not always what
    you want. For a financial application, for example, you may need to store amounts
