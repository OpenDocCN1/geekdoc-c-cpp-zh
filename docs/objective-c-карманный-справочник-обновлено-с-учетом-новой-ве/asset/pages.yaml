    The Foundation framework includes a class, NSDistantObject, which makes use of
    this. A distant object is a proxy that forwards messages to a remote object. The
    remote objects can be in a different process, or even on a different computer.


    If you pass objects as arguments to a message sent to a distant object, then they
    may be copied, or a remote proxy may be created at the far end forwarding message
    back.


    Using distributed objects is very simple. There are two parts of any program that
    uses them: a client and a server. The server offers objects to other processes
    and the client connects to the server and accesses them.


    By default, objects are just shared on the local machine. To share them across
    the network, you must use the use NSSocketPortNameServer when registering the
