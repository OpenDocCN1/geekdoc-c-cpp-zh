    # The Language and the Library


    It''s difficult with very dynamic languages to draw the line between the language
    and the library. In Smalltalk, there is no equivalent of an if statement in the
    language. The standard library defines True and False singleton classes, which
    respond to -ifTrue: messages taking a closure as an argument. All complex flow
    control structures, such as loops or enumeration, are implemented in terms of
    this.


    Objective-C inherits flow control from C, but all of the dynamic behavior is supplied
    by the runtime library. This is different from C or C++. You can compile a freestanding
    C or C++ binary that doesn''t call any functions in libcstdc++. Every Objective-C
    program that isn''t a pure C program, however, must link against libobjc to work.


    This library traditionally provides three classes: a simple root class, a class
    for constant strings, and a class for protocols. The first of these provides functionality
    including object allocation that is part of the language in C++, Java, and similar
    environments. The other two are classes'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# CHAPTER 1: The Objective-C Philosophy


    that may be generated by the compiler.

    Most of the time, you will not use any of these classes. Almost all Objective-C
    code written in the last decade or two uses an implementation of the OpenStep
    Foundation framework. OpenStep was a specification jointly worked out by NeXT
    and Sun to provide a modern object-oriented framework for cross-platform application
    development NeXT implemented it on their OPENSTEP operating system and on Windows
    NT, whereas Sun shipped an implementation for Solaris. A little bit later, the
    GNU project shipped a third implementation: GNestep.


    OpenStep defined two frameworks: the Foundation Kit and Application Kit, typically
    shortened to Foundation and AppKit. The Foundation Kit provides the core functionality
    that developers need for all applications, such as collection classes, run loops,
    notification delivery, OS abstraction, and so on. The Application Kit is built
    on top of this and provides extra support for building graphical applications.


    Sun’s implementation didn’t see much development after the initial release. Apple
    bought NeXT a few years later and renamed the OpenStep environment Yellow Box,
    shipping it as a developer environment both in Rhapsody and on Windows. With the
    release of OS X, it was renamed yet again, this time to Cocoa.


    The GNestep project is still actively developed, but now tracks Apple’s enhancements
    to the'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The History of Objective-C 9


    OpenStep specification, as well as the core specification. This means that the
    Foundation framework is usable pretty much anywhere, although some of the newest
    classes and methods are missing with the GNUstep implementation. You can think
    of the Foundation framework as the Objective-C standard library. It provides a
    lot of features that are required for nontrivial programs. Several of the Objective-C
    2 features are designed specifically to work with Foundation. You can use them
    without Foundation, but only if you implement something equivalent.


    # # The History of Objective-C


    The term "object oriented" was coined by Alan Kay in the 1960s, and Smalltalk
    the language that he and others created to demonstrate this style of programming.
    Smalltalk was developed during the 1970s, with the most widespread version being
    released in 1980. Smalltalk, however, was very slow. To run it properly, you needed
    a powerful computer such as the Xerox Alto, with 512KB of RAM and ideally at least
    a 2MHz processor. Brad Cox liked the idea of Smalltalk, but wanted a language
    he could use on computers that people could afford. His idea was to marry Smalltalk,
    a high-level language encouraging encapsulation, loose coupling, and code reuse,
    with C. C was right at the other end of the'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# CHAPTER 1: The Objective-C Philosophy


