- pgno: 12
  md: '# About the Author


    David Chisnall a freelance writer and consultant. While studying for his PhD,
    he co-founded the Étoile project, which aims to produce an open-source desktop
    environment on top of GNUstep, an open-source implementation of the OpenStep and
    Cocoa APIs. He is an active contributor to GNUstep and is the original author
    and maintainer of the GNUstep Objective-C 2 runtime library and the associated
    compiler support in the Clang compiler. After completing his PhD, David hid in
    academia for a while, studying the history of programming languages. He finally
    escaped when he realized there were places off campus with an equally good view
    of the sea and without the requirement to complete quite so much paperwork. He
    occasionally returns to collaborate on projects involving modeling the semantics
    of dynamic languages.

    David has a great deal of familiarity with Objective-C, having worked both on
    projects using the language and on implementing the language itself. He has also
    worked on other languages, including dialects of Smalltalk and JavaScript, on
    top of an Objective-C runtime, allowing mixing code between all of these languages
    without bridging.

    When not writing or programming, David enjoys dancing Argentine Tango and Cuban
    Salsa, playing badminton and ultimate frisbee, and cooking.'
  merge: -1
  img_proc: true
