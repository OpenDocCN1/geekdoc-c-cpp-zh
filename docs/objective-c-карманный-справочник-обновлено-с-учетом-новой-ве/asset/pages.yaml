  md: '# 62 CHAPTER 2: An Objective-C Primer


    In the latest version of the Foundation framework, you will find a lot of methods
    that take blocks as arguments. You can, for example, iterate over an array with
    a block as an argument.


    Blocks don’t add any expressiveness to the C language. A block is just a function
    pointer and a data pointer hidden inside a single structure, with some extra logic
    in the compiler to insert the data pointer as a hidden argument to the function
    when it is called.


    This doesn’t mean that blocks are not useful. After all, the same is true of Objective-C;
    it doesn’t let you do anything that you can’t do in C, it just adds some syntactic
    sugar that makes some things easier.


    Like Objective-C objects, blocks have an isa pointer and can be sent messages.
    They are instances of the NSBlock private abstract class, which implements the
    NSCopying protocol.


    Most of the object-like behavior of blocks is undocumented. You can store them
    in Objective-C collections, but don’t depend on their ability to understand any
    specific messages. With the latest versions of Clang, blocks also support introspection,
    exposing their types as Objective-C type encodings.


    We’ll look at blocks in more detail in Chapter 15.'
