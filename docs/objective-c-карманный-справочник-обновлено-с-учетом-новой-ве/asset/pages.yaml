  md: 'one.


    Queues do not have a 1:1 mapping with threads.

    Concurrent queues may execute on several threads and one thread may run work units
    from several queues. The optimal number of threads to use is determined by the
    kernel based on the number of cores and the system load.

    Context switching between threads is relatively expensive. It obviously costs
    at least as much as setjmp(), because it needs to save the current CPU state and
    restore it later, but there are also some non-obvious costs. Different threads
    are likely to be accessing different bits of the program''s data at the same time,
    so switching threads also causes a lot of cache and TLB misses.


    With the work queue model, a single thread can run one work unit from one queue,
    then run from another, without constantly switching between the two working sets.
    If you have more cores, you can increase the degree of concurrency to take advantage
    of them without increasing the number of context switches. When the system is
    busy, you may reduce the number of threads that one application is using so that
    it can use one core effectively while another application uses another. This is
    all done automatically by libdispatch.


