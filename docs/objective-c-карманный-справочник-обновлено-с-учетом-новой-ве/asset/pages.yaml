  md: 'The name comes from Smalltalk, where the BlockClosure class encapsulates closures.
    The syntax for creating blocks is quite ugly. It is based on the C syntax for
    function pointers, but with a caret replacing the asterisk.


    Blocks can be used almost exactly like function pointers. You can call them just
    like functions, but you can''t cast them to function pointers because they have
    a different calling convention. Just like methods, a block has a hidden argument.


    In the example, the getCounter() function returns a new block that implements
    a counter. Every time you call this block, it returns a value one greater than
    the last time you called it. This works because the counter variable in the scope
    where the block was created is declared with the __block specifier.


    Any variables on the stack that blocks reference will be copied to the heap and
    reference counted. When you call Block_copy(), the block itself is copied to the
    heap if it''s on the stack, or has its reference count incremented if it is not.
    Block_copy() is actually a macro that wraps the _Block_copy() function and casts
    the return type from void* to the type of the argument.


    Each block returned by the getCounter() function in the example has a copy of
    the counter variable, because it is an automatic (stack) variable, and so subsequent
    calls to the function are creating a new version.'
