    ## 3. Projection contraction algorithm based on a new direction


    Based on some new methods to solve linear projection equations [10], reference
    [14] proposed a fast projection contraction algorithm for solving second-order
    cone programming. Similarly, according to the equivalence of the linear projection
    equation (7) and the optimal conditions of the semidefinite programming problem,
    this paper proposes a projection contraction algorithm to solve the semidefinite
    programming problem and improves it.


    Assuming that the equation (7) has solution, the set of solutions is denoted as
    $\Omega^u$.


    **Theorem 2** Let $u'' \in \Omega^u, \beta \in \{0,1\}$, then


    $$(u-u'')^T d(u, \beta) \geq \|e(u, \beta)\|^2, \forall u \in \mathbf{R}^{mn}
    \times \mathbf{R}^m$$


    where $d(u, \beta) = (I - \beta M)e(u, \beta)$.


    Proof By projection properties on closed convex sets, we get


    $$[P_{\Omega}(v)]^T[P_{\Omega}(v)-u^*] \geq 0, \forall v \in \mathbf{R}^{mn} \times
    \mathbf{R}^m. (8)$$


    Let $v = u-\beta(Mu+q)$ in (8), we have


    $$[e(u,\beta)-\beta(Mu+q)]^T[P_{\Omega}(u-\beta(Mu+q))-u^*] \geq 0. (9)$$


    Then let $v=P_{\Omega}(u-\beta(Mu+q))$, from (5) we get


    $$[\beta(Mu+q)]^T[P_{\Omega}(u-\beta(Mu+q))-u^*] \geq 0. (10)$$


    (9) and (10) are added together we have


    $$[e(u,\beta)-\beta M(u-u^*)]^T[P_{\Omega}(u-\beta(Mu+q))-u^*] \geq 0. (11)$$


    The above inequality gives

    $$(u-u^*)^T(I+\beta M)e(u,\beta) \geq \|e(u,\beta)\|^2+(u-u^*)^T\beta M(u-u^*).$$


    Finally, we end the proof since $M$ is the skew-symmetric,


    Define $F(u,\beta)=\frac{1}{2}\|u-u^*\|^2$, from Theorem 2, it is known that $d(u,\beta)$
    is the descending direction of $F(u,\beta)$ at $G=(I+\beta M)^T(I+\beta M)$, since
    $M$ is the skew-symmetric, we have

    $G=(I-\beta M)(I+\beta M)$. Obviously $G$ is positive, then $-G^{-1}d(u,\beta)=-(I+\beta
    M)^{-1}e(u,\beta)$ can also be a descending direction [9].


    ## Algorithm 1 Projection contraction algorithm is given below.


    Given $u_0 \in \mathbf{R}^{mn} \times \mathbf{R}^m, r \in (0,2), \beta \in \{0,1\}$.


    For $k=0,1,\dots,$ if $u_k^* \notin \Omega^u$,


    Step 1: Calculate $d(u_k,\beta)=(I+\beta M)^{-1}e(u_k,\beta)$,


    Step 2: Update $u_{k+1} = u_k - r\beta d(u_k, \beta)$.


    From Theorem 2, the global convergence proof of the projection contraction algorithm
    for solving semidefinite programming problems can be given.


    **Theorem 3** $G = (I + \beta M^T)$, $r \in (0,2), \beta \in [0,1]$, the sequence
    $\{u_k\}$ produced by Algorithm 1 satisfy


    $$\|u_{k+1}-u_k\|_G^2 \leq \|u_k-u_k^*\|_G^2 - r\beta(2-\beta)\|e(u_k, \beta)\|$$


    Proof $\|u_{k+1}-u_k\|_G^2 = \|(I + \beta M^T)(u_k - u_k^*) - r\beta I(I + \beta
    M^T)^{-1}e(u_k, \beta)\|_G^2$


    $= \|(I + \beta M^T)(u_k - u_k^*)\|_G^2 \neq \|u_k-u_k^*\|_G^2 - 2r\beta(u_k-u_k^*)(I
    + \beta M^T)e(u_k, \beta) + r^2\beta^2 \|e(u_k, \beta)\|_G^2$


    $\leq \|u_k-u_k^*\|_G^2 - 2r\beta\|e(u_k, \beta)\|$


    **Theorem 4** [9] the sequence $\{u_k\}$ produced by Algorithm 1 converges to
    $u_k^* \in \Omega^*$.


    In Algorithm 1, when calculating the descending direction $d(u_k, \beta) = (I
    + \beta M)^{-1}e(u_k, \beta)$, if the scale of problem is large, the computational
    cost of $(I + \beta M)^{-1}$ is too high, which will cause the algorithm to run
    slowly. The following equivalent is:


    $$d(u_k, \beta) = (I + \beta M)^{-1}e(u_k, \beta) \Leftrightarrow (I + \beta M)d(u_k,
    \beta) = e(u_k, \beta). (12)$$


    The specific form of equation on the right is a system of linear equations


    $$\begin{bmatrix} I_{n \times n} & -\beta A^T \\ \beta A & I_{m \times m} \end{bmatrix}
    \begin{bmatrix} d(X_k, \beta) \\ d(y_k, \beta) \end{bmatrix} = \begin{bmatrix}
    e(X_k, \beta) \\ e(y_k, \beta) \end{bmatrix}. (13)$$


    Solve the equations to get


    $$d(y_k, \beta) = (I_{m \times m} + \beta^2 A^T)^{-1}[e(y_k, \beta) - \beta e(X_k,
    \beta)]. (14)$$


    $$d(X_k, \beta) = \beta A^T d(y_k, \beta) + e(X_k, \beta). (15)$$


    It can be seen from (12) to (15) that with inversion operation $(I+\beta M)^{-1}$
    and $(I + \beta^2 A^T)^{-1}$, the dimension is reduced from $(n^2+m)$ to $m \times
    m$, and the amount of computation can be significantly reduced when $n$ is larger
    than $m$. So there is an projection contraction algorithm:


    ## Algorithm 2 Improved projection contraction algorithm


    Step 1: Given $u_k \in \mathbb{R}^n \times \mathbb{R}^m, r \in (0,2), \beta \in
    [0,1]$.


    Step 2: For $k=0, 1, \dots$, if $u_k \notin \Omega^*$,


    Step 3: Calculated $d(y_k, \beta), d(X_k, \beta)$ from equations (14) and (15)
    to get $d(u_k, \beta)$,


    Step 4: Update $u_{k+1} = u_k - r\beta d(u_k, \beta)$.


    ## 4. Numerical experiment


    Test platform and software: Intel Xeon2 CPU (3.3GHz), 8GB ram PC, Win 10 system,
    Matlab 2010b programming.


    **Example 1** Consider the following semidefinite programming problem:


    $$A_1 = \begin{pmatrix} 0 & 1 & 0 & 0 \\ 1 & 2 & 0 & 0 \\ 0 & 0 & 0 & 1 \\ 0 &
    0 & -2 & -1 \\ 0 & -1 & -1 & -2 \end{pmatrix}, A_2 = \begin{pmatrix} 0 & -2 &
    2 & 0 \\ 0 & 2 & 1 & 2 \\ -1 & -2 & 0 & 1 \\ 2 & 0 & 0 & 0 \\ 0 & 2 & 1 & 2 \end{pmatrix}$$


    $$A_3 = \begin{pmatrix} 2 & -1 & -1 & 0 \\ 2 & 0 & 2 & 1 \\ -1 & -1 & 2 & -1 \\
    1 & 1 & 0 & -2 \end{pmatrix}, C = \begin{pmatrix} 3 & -3 & 3 & 1 \\ 3 & 5 & 3
    & 2 \\ -3 & -1 & 1 & 2 \\ 1 & 1 & -3 & -1 \\ 1 & 2 & -1 & -1 \end{pmatrix}, b
    = \begin{pmatrix} -2 \\ 2 \end{pmatrix}$$


    $\beta = 0.7$, when the condition $\|e(u,\beta)\| \le 10^{-4}$ is satisfied, the
