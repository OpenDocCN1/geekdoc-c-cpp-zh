    and its dual problem


    (D) max $b^T y$ s.t. $\sum_{i=1}^m y_i A_i+S=C, S\geq 0$. (2)


    For simplicity, we denote the space of real and symmetric $n\times n$ matrices
    as $S^n$, and all semidefinite matrices in $S^n$ as $S^n_+$. In systems (1) and
    (2), matrices $C, A_i \in S^n, i=1,...,m$, vectors $b, y \in R^m$. $A\cdot B$
    means the inner product of $A, B \in S^n$ and defines by $A\cdot B=\text{trace}(AB)$.
    $X, S\geq 0$ means that $X, S \in S^n$.


    Under appropriate constraint qualification, the solution of primal and dual semidefinite
    programming problem satisfies the optimal condition:


    $$\begin{cases} A\cdot X=b\cdot i, i=1,2,...,m, X\geq 0 \\ \sum_{i=1}^m y_i A_i+S=C,
    S\geq 0 \\ XS=0 \end{cases}$$ (3)


    The basic idea of interior point algorithm to solve semidefinite programming problem
    is to change the complementary condition $XS=0$ with complementary relaxation
    $XS=\mu I$, where $I$ is the identity matrix and the parameter $\mu > 0$, and
    the central system is obtained:


    $$\begin{cases} A\cdot X=b\cdot i, i=1,2,...,m, X\geq 0 \\ \sum_{i=1}^m y_i A_i+S=C,
    S\geq 0 \\ XS=\mu I \end{cases}$$ (4)


    then Newton''s method is used to get a search direction, however the matrix product
    is generally not commutative, the obtained search direction is asymmetric. To
    get a symmetric search direction, the complementary relaxation needs to be symmetric
    [1]. In recent years, interior point methods for solving semidefinite programming
    problems have focused on the construction of new kernel functions, the design
    of wide neighborhoods, and a new search strategy—[2–4]. These algorithms require
    that the starting point must be strictly feasible, but strictly feasible starting
    points are not easy to find. A common approach is to use SDMM [6], SDP3 [7], another
    solution is to design infeasible algorithms, such as [8], which do not require
    the initial point to be feasible, but the theoretical analysis is more complicated.


    Projection algorithms originated from the study of solving variational inequalities
    earlier. Based on HeBing''s projection contraction for solving variational inequalities
    [9] and the projection contraction for solving variational inequalities [10],
    Han Qi extended the projection contraction for solving variational inequalities
    to semidefinite programming [11]. The method converts the compatibility condition
    in (3) into the projection equation, and then use the projection algorithm to
    solve variational inequalities [12]. Yu Zheng adopted the projection contraction
    for solving variational inequalities [13] to solve some projection problems [14].
    For the second-order programming, Mu and Zhang [15] combined the Euclidean geometry
    to solve the second-order programming. Further, Mu and Zhang gave the projection
    contraction algorithm for semidefinite programming. The second-order programming
    can be seen as a special case of semidefinite programming, and the theoretical
    analysis of the projection contraction algorithm is simple, and there is no requirement
    for the initial point. Based on [14], this paper proposes a new projection contraction
    algorithm to solve semidefinite programming problem. Compared with the interior
    point algorithm, the projection contraction algorithm has no requirement on the
    initial point, and the algorithm is much simpler. The optimal condition of the
    semidefinite programming problem can be rewritten as a projection equation, which
    is then solved by the projection contraction algorithm. We propose a new projection
    contraction algorithm based on descending directions to improve the algorithm
    by solving the linear equation, thus avoiding the high-dimensional inversion so
    that the algorithm can solve the large-scale semidefinite programming problem.
    Numerical experiments show that the algorithm is feasible and the improved algorithm
    coincides with the interior point algorithm.


