    As seen from Table 1, Algorithm 1 can solve small-scale problems, but the computation
    time increases dramatically when the problem increases. The improved algorithm,
    Algorithm 2 does not have such shortcomings and when using the same set of the
    parameters, in most cases, the computation time is smaller, and the number of
    iterations is lower than the Yu algorithm; it can be seen from Table 2 for medium-scale
    problems, the Algorithm 2 is still better than the Yu algorithm, although it is
    inferior to the interior point algorithm package SeDumi 1.3 in the number of iterations,
    Algorithm 2 spends less time in computation.


    # 5. Conclusion


    In this paper, the projection contraction algorithm for second-order programming
    is extended to solve semidefinite programming, and the algorithm is given by the
    equivalence between the optimal condition and the projection. In order to solve
    large-scale semidefinite programming, the solution of the descending direction
    is improved, and the original high-dimensional inversion operation is transformed
    into a low dimensional linear system to solve. Numerical experiments show that
    the algorithm is feasible, and the improved algorithms run faster. However, positive-definite
    cones are more computationally complex than projections on second-order cones,
    making solving large-scale problems challenging and requiring further research.


