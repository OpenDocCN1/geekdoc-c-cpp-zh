    ## 3. 基于新方向的投影收缩算法


    基于求解线性投影方程的一些新方法 [10]，文献 [14] 提出了一种用于二阶锥规划的快速投影收缩算法。同样，根据线性投影方程 (7) 与半正定规划问题最优条件的等价性，本文提出并改进了一种用于求解半正定规划问题的投影收缩算法。


    假设方程 (7) 有解，解集记为 $\Omega^u$。


    **定理 2** 令 $u'' \in \Omega^u, \beta \in \{0,1\}$，则


    $$(u-u'')^T d(u, \beta) \geq \|e(u, \beta)\|^2, \forall u \in \mathbf{R}^{mn}
    \times \mathbf{R}^m$$


    其中 $d(u, \beta) = (I - \beta M)e(u, \beta)$。


    证明：根据闭凸集上的投影性质，我们得到


    $$[P_{\Omega}(v)]^T[P_{\Omega}(v)-u^*] \geq 0, \forall v \in \mathbf{R}^{mn} \times
    \mathbf{R}^m. (8)$$


    在 (8) 中令 $v = u-\beta(Mu+q)$，有


    $$[e(u,\beta)-\beta(Mu+q)]^T[P_{\Omega}(u-\beta(Mu+q))-u^*] \geq 0. (9)$$


    然后令 $v=P_{\Omega}(u-\beta(Mu+q))$，从 (5) 得到


    $$[\beta(Mu+q)]^T[P_{\Omega}(u-\beta(Mu+q))-u^*] \geq 0. (10)$$


    将 (9) 和 (10) 相加得


    $$[e(u,\beta)-\beta M(u-u^*)]^T[P_{\Omega}(u-\beta(Mu+q))-u^*] \geq 0. (11)$$


    上述不等式给出

    $$(u-u^*)^T(I+\beta M)e(u,\beta) \geq \|e(u,\beta)\|^2+(u-u^*)^T\beta M(u-u^*).$$


    最后，由于 $M$ 是反对对称的，证明结束。


    定义 $F(u,\beta)=\frac{1}{2}\|u-u^*\|^2$，根据定理 2，可知 $d(u,\beta)$ 是 $F(u,\beta)$ 在
    $G=(I+\beta M)^T(I+\beta M)$ 处的下降方向。由于 $M$ 是反对对称的，有 $G=(I-\beta M)(I+\beta M)$。显然
    $G$ 是正的，则 $-G^{-1}d(u,\beta)=-(I+\beta M)^{-1}e(u,\beta)$ 也可以是一个下降方向 [9]。


    ## 算法 1 投影收缩算法如下。


    给定 $u_0 \in \mathbf{R}^{mn} \times \mathbf{R}^m, r \in (0,2), \beta \in \{0,1\}$。


    对于 $k=0,1,\dots,$，若 $u_k^* \notin \Omega^u$：


    步骤 1：计算 $d(u_k,\beta)=(I+\beta M)^{-1}e(u_k,\beta)$，


    步骤 2：更新 $u_{k+1} = u_k - r\beta d(u_k, \beta)$。


    根据定理 2，可以给出求解半正定规划问题的投影收缩算法的全局收敛性证明。


    **定理 3** $G = (I + \beta M^T)$，$r \in (0,2), \beta \in [0,1]$，算法 1 产生的序列 $\{u_k\}$
    满足


    $$\|u_{k+1}-u_k\|_G^2 \leq \|u_k-u_k^*\|_G^2 - r\beta(2-\beta)\|e(u_k, \beta)\|$$


    证明：$\|u_{k+1}-u_k\|_G^2 = \|(I + \beta M^T)(u_k - u_k^*) - r\beta I(I + \beta
    M^T)^{-1}e(u_k, \beta)\|_G^2$


    $= \|(I + \beta M^T)(u_k - u_k^*)\|_G^2 \neq \|u_k-u_k^*\|_G^2 - 2r\beta(u_k-u_k^*)(I
    + \beta M^T)e(u_k, \beta) + r^2\beta^2 \|e(u_k, \beta)\|_G^2$


    $\leq \|u_k-u_k^*\|_G^2 - 2r\beta\|e(u_k, \beta)\|$


    **定理 4** [9] 算法1 产生的序列 $\{u_k\}$ 收敛于 $u_k^* \in \Omega^*$。


    在算法 1 中，当计算下降方向 $d(u_k, \beta) = (I + \beta M)^{-1}e(u_k, \beta)$ 时，如果问题规模很大，$(I
    + \beta M)^{-1}$ 的计算成本过高，会导致算法运行缓慢。以下是等价形式：


    $$d(u_k, \beta) = (I + \beta M)^{-1}e(u_k, \beta) \Leftrightarrow (I + \beta M)d(u_k,
    \beta) = e(u_k, \beta). (12)$$


    右侧方程的特定形式为线性方程组


    $$\begin{bmatrix} I_{n \times n} & -\beta A^T \\ \beta A & I_{m \times m} \end{bmatrix}
    \begin{bmatrix} d(X_k, \beta) \\ d(y_k, \beta) \end{bmatrix} = \begin{bmatrix}
    e(X_k, \beta) \\ e(y_k, \beta) \end{bmatrix}. (13)$$


    求解方程得到：


    $$d(y_k, \beta) = (I_{m \times m} + \beta^2 A^T)^{-1}[e(y_k, \beta) - \beta e(X_k,
    \beta)]. (14)$$


    $$d(X_k, \beta) = \beta A^T d(y_k, \beta) + e(X_k, \beta). (15)$$


    从 (12) 到 (15) 可以看出，通过逆运算 $(I+\beta M)^{-1}$ 和 $(I + \beta^2 A^T)^{-1}$，维度从 $(n^2+m)$
    降低到 $m \times m$，当 $n$ 大于 $m$ 时，计算量可以显著减少。因此存在投影收缩算法：


    ## 算法 2 改进的投影收缩算法


    步骤 1：给定 $u_k \in \mathbb{R}^n \times \mathbb{R}^m, r \in (0,2), \beta \in [0,1]$。


    步骤 2：对于 $k=0, 1, \dots$，若 $u_k \notin \Omega^*$：


    步骤 3：从方程 (14) 和 (15) 计算 $d(y_k, \beta), d(X_k, \beta)$ 以得到 $d(u_k, \beta)$，


    步骤 4：更新 $u_{k+1} = u_k - r\beta d(u_k, \beta)$。


    ## 4. 数值实验


    测试平台和软件：Intel Xeon2 CPU (3.3GHz)，8GB内存 PC，Win 10 系统，Matlab 2010b 编程。


    **示例 1** 考虑以下半正定规划问题：


    $$A_1 = \begin{pmatrix} 0 & 1 & 0 & 0 \\ 1 & 2 & 0 & 0 \\ 0 & 0 & 0 & 1 \\ 0 &
    0 & -2 & -1 \\ 0 & -1 & -1 & -2 \end{pmatrix}, A_2 = \begin{pmatrix} 0 & -2 &
    2 & 0 \\ 0 & 2 & 1 & 2 \\ -1 & -2 & 0 & 1 \\ 2 & 0 & 0 & 0 \\ 0 & 2 & 1 & 2 \end{pmatrix}$$


    $$A_3 = \begin{pmatrix} 2 & -1 & -1 & 0 \\ 2 & 0 & 2 & 1 \\ -1 & -1 & 2 & -1 \\
    1 & 1 & 0 & -2 \end{pmatrix}, C = \begin{pmatrix} 3 & -3 & 3 & 1 \\ 3 & 5 & 3
    & 2 \\ -3 & 3 & 1 & -1 \\ 1 & 2 & -1 & -1 \end{pmatrix}, b = \begin{pmatrix} -2
    \end{pmatrix}$$


    当 $\beta = 0.7$ 时，满足 $\|e(u,\beta)\| \le 10^{-4}$，算法终止。算法 1 在 71 次迭代后获得原始最优解，对偶间隙为
    $9.305 \times 10^{-5}$。


    **示例 2** 考虑随机半正定规划：整数 $m,n$ 生成 $m$ 个矩阵 $R_i \in \mathbb{R}^{n \times n}, i=1,\dots,m$。令
    $A_i = (R_i + R_i^T)/2, b_i = \text{trace}(A_i)$。问题具有一个严格可行点 $(\mathbf{1})$，其中
    $e$ 是元素全为1的列向量。算法 1 和 2 采用参数 $r = \beta = 1$。


