    (P) min $C\cdot X$ s.t. $A\cdot X=b\cdot i, i=1,2,...,m, X\geq 0$。(1)


    以及其对偶问题


    (D) max $b^T y$ s.t. $\sum_{i=1}^m y_i A_i+S=C, S\geq 0$。(2)


    为了简单起见，我们将实数对称 $n\times n$ 矩阵空间记为 $S^n$，，$S^n$ 中所有半定矩阵记为 $S^n_+$。在系统 (1) 和 (2)
    中，矩阵 $C, A_i \in S^n, i=1,...,m$，向量 $b, y \in R^m$。$A\cdot B$ 表示 $A, B \in S^n$
    的内积，定义为 $A\cdot B=\text{trace}(AB)$。$X, S\geq 0$ 表示 $X, S \in S^n$。


    在适当的约束限定下，原问题和对偶问题半定规划问题的解满足最优条件：


    $$\begin{cases} A\cdot X=b\cdot i, i=1,2,...,m, X\geq 0 \\ \sum_{i=1}^m y_i A_i+S=C,
    S\geq 0 \\ XS=0 \end{cases}$$ (3)


    内点法求解半定规划问题的基本思想是将互补条件 $XS=0$ 替换为互补松弛 $XS=\mu I$，其中 $I$ 是单位矩阵，参数 $\mu > 0$，从而得到中心系统：


    $$\begin{cases} A\cdot X=b\cdot i, i=1,2,...,m, X\geq 0 \\ \sum_{i=1}^m y_i A_i+S=C,
    S\geq 0 \\ XS=\mu I \end{cases}$$ (4)


    然后使用牛顿法来获取搜索方向，然而矩阵乘积通常不是可交换的，得到的搜索方向是非对称的。为了获得对称的搜索方向，需要互补松弛是对称的 [1]。近年来，求解半定规划问题的内点法侧重于新核函数的构造、宽邻域的设计以及新的搜索策略——[2–4]。这些算法要求起始点必须是严格可行的，但严格可行起始点并不容易找到。常用方法是使用
    SDMM [6], SDP3 [7]，另一种方法是设计不可行算法，例如 [8]，它们不要求初始点可行，但理论分析更为复杂。


    投影算法源于早期对求解变分不等式的研究。基于何兵求解变分不等式的投影收缩算法 [9] 和求解变分不等式的投影收缩算法 [10]，韩其将求解变分不等式的投影收缩扩展到半定规划
