- pgno: 483
  md: '# Fully updated to reflect

    the new features of Java 8!


    If you''re a new programmer, or want to be, this unintimidating guide gets you
    on your way toward Java mastery. It explores what goes into creating a program,
    how to put the pieces together, debugging, and making it all work. Even if you''ve
    never written a line of code, this book will have you ordering your computer around
    in no time.


    +   - **Get started** — dive into the overall programming experience, from finding
    out what programming is all about to getting your computer ready for writing and
    testing programs

    +   - **Jump into Java** — discover the basic building blocks in any Java program,
    and get up to speed on how to represent data and get new values from existing
