  md: "I've put two runs of this code in Figure 11-3. In the first run, the randomNumber\
    \ is 7. The program executes cases 7 through 10, and the default. In the second\
    \ run, the randomNumber is 3. The program executes cases 3 and 4. Then, because\
    \ case 4 has a break statement, the program jumps out of the switch and displays\
    \ Goodbye.\n\n# Figure 11-3: Please make up your mind.\n\n```\nType your question,\
    \ my child: Do good things happen to good people?\nYes, but only if you're nice\
    \ to me.\nYes (as if I care).\nNo, not until Cromwell seizes Dover.\nNo, not until\
    \ Nell squeezes Rover.\nYou think you have problems? My random number generator\
    \ is broken!\nGoodbye\nType your question, my child: Is your switch statement\
    \ missing some breaks?\nYessir, yessir! Three bags full.\nWhat part of 'no' don't\
    \ you understand?\nGoodbye\n```\n\n![](img/f938eba5f15e231d828a6255e7ec5523_242_0.png)\n\
    \nThe switch statement in Listing 11-2 is missing some break statements. Even\
    \ without these break statements, the code compiles with no errors. But when you\
    \ run the code in Listing 11-2, you don't get the results that you want.\n\n#\
    \ Using Fall-Through to Your Advantage\n\nOften, when you're using a switch statement,\
    \ you don't want fall-through, so you pepper break statements throughout the switch.\
    \ But, sometimes, fall-through is just the thing you need.\n\nTake the number\
    \ of days in a month. Is there a simple rule for this? Months containing the letter\
    \ \"r\" have 31 days? Months in which \"i\" comes before \"e\" except after \"\
    c\" have 30 days?\n\nYou can fiddle with if conditions all you want. But to handle\
    \ all the possibilities, I prefer a switch statement. Listing 11-3 demonstrates\
    \ the idea.\n\n# Listing 11-3: Finding the Number of Days in a Month\n\n```\n\
    import java.util.Scanner;\n\nclass DaysInEachMonth {\n\n    public static void\
    \ main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
    \        int month, numberOfDays = 0;\n        boolean isLeapYear;\n```"
