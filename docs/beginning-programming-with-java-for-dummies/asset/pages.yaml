  md: "The program doesn't have to work this way. If I take Listing 9-4 and change\
    \ hankees > socks to hankees >= socks then, in case of a tie, the Hankees score\
    \ comes first.\n\nSuppose that you want a bit more control. When the scores are\
    \ equal, you want an It's a tie message. To do this, think in terms of a three-pronged\
    \ fork. You have a prong for a Hankees win, another prong for a Socks win, and\
    \ a third prong for a tie. You can write this code in several different ways,\
    \ but one way that makes lots of sense is in Listing 10-6. For three runs of the\
    \ code in Listing 10-6, see Figure 10-12.\n\n# Listing 10-6: In Case of a Tie...\n\
    \n```\nimport java.util.Scanner;\nimport static java.lang.System.out;\n\nclass\
    \ WinLoseOrTie {\n    public static void main(String args[]) {\n        Scanner\
    \ keyboard = new Scanner(System.in);\n        int hankees, socks;\n        out.print(\"\
    Hankees and Socks scores?  \");\n        hankees = keyboard.nextInt();\n     \
    \   socks = keyboard.nextInt();\n        out.println();\n        if (hankees >\
    \ socks) {\n            out.println(\"Hankees win...\");\n            out.print(\"\
    Hankees:  \");\n            out.println(hankees);\n            out.print(\"Socks:\
    \  \");\n            out.println(socks);\n        } else if (socks > hankees)\
    \ {\n            out.println(\"Socks win...\");\n            out.print(\"Socks:\
    \  \");\n            out.println(socks);\n            out.print(\"Hankees: \"\
    );\n            out.println(hankees);\n        } else {\n            out.println(\"\
    It's a tie...\");\n            out.print(\"Hankees: \");\n            out.println(hankees);\n\
