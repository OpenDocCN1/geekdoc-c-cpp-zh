    \ but in some situations, you need to be pickier about your input data. For example,\
    \ you may want to know if you can call nextInt (as opposed to nextDouble or nextLine).\
    \ Fortunately, Java has methods for your pickiest input needs. A method like if\
    \ (diskScanner.hasNextInt()) checks to see whether you can read an int value from\
    \ the disk file. Java also has methods like hasNextLine, hasNextDouble, and so\
    \ on. For more information on the plain old hasNext method, see Chapter 14.\n\n\
    Listing 16-3 has a big fat condition to keep the for loop going:\n\n```\nfor (int\
    \ roomNum = 0;\n    roomNum < whichRoom && diskScanner.hasNext();\n    roomNum++)\
    \ {\n```\n\nMany for loop conditions are simple “less-than” tests, but there’s\
    \ no rule saying that all for loop conditions have to be so simple. In fact, any\
    \ expression can be a for loop’s condition, as long as the expression has value\
    \ true or false. The condition in Listing 16-3 combines a “less than” with a call\
    \ to the Scanner class’s hasNext method.\n\n# Reader, Meet Arrays; Arrays,\nMeet\
    \ the Reader\n\nA weary traveler steps up to the Java Motel’s front desk. “I’d\
