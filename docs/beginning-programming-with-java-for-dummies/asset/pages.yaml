    and seventy-five hundredths.” If you live in a comma country, and you type 5.75
    exactly as it’s shown in Figure 6-7, you probably get an error message (an InputMismatchException).
    If so, change the number amounts in your file to match your country’s number format.
    When you do, you should be okay.


    # Though these be methods, yet there is madness in ’t


    Notice the call to the nextDouble method in Listing 6-2. Back in Listing 5-1,
    I use nextLine, but here in Listing 6-2, I use nextDouble.


    In Java, each type of input requires its own special method. If you’re getting
    a line of text, then nextLine works just fine. But if you’re reading stuff from
    the keyboard and you want that stuff to be interpreted as a number, you need a
    method like nextDouble.


    To go from Listing 6-1 to Listing 6-2, I added an import declaration and some
    stuff about new Scanner (System.in). You can find out more about these things
    by reading the section on input and output in Chapter 5. (You can find out even
    more about input and output by visiting Chapter 13.) And more examples (more keyboard.nextSomething
    methods) are in Chapters 7 and 8.


    # Methods and assignments


    Note how I use keyboard.nextDouble in Listing 6-2. The call to method keyboard.nextDouble
    is part of an assignment statement. If you look in Chapter 5 at the section on
    how the EchoLine program works, you see that'
