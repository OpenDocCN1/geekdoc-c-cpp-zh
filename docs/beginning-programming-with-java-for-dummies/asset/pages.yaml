  md: '# Chapter 15


    # The Old Runaround


    # In This Chapter


    +   - Creating repetitive actions

    +   - Improving your nesting techniques

    +   - Insisting on a valid response from the user

    +   - Looping through enumerated values


    I remember it distinctly—the sense of dread I would feel on the way to Aunt Edna’s
    house. She was a kind old woman, and her intentions were good. But visits to her
    house were always so agonizing.


    First, we’d sit in the living room and talk about other relatives. That was okay,
    as long as I understood what people were talking about. Sometimes, the gossip
    would be about adult topics, and I’d become very bored.


    After all the family chatter, my father would help Aunt Edna with her bills. That
    was fun to watch because Aunt Edna had a genetically inherited family ailment.
    Like me and many of my ancestors, Aunt Edna couldn’t keep track of paperwork to
    save her life. It was as if the paper had allergens that made Aunt Edna’s skin
    crawl. After ten minutes of useful bill paying, my father would find a mistake,
    an improper tally, or something else in the ledger that needed attention. He’d
    ask Aunt Edna about it, and she’d shrug her shoulders. He’d become agitated trying
    to track down the problem, while Aunt Edna rolled her eyes and smiled with ignorant
    satisfaction. It was great entertainment.


    Then, when the bill paying was done, we’d sit down to eat dinner. That’s when
    I would remember why I dreaded these visits. Dinner was unbearable. Aunt Edna
    believed in Fletcherism — a health movement whose followers chewed each mouthful
    of food 100 times. The more devoted followers used a chart, with a different number
    for the mastication of each kind of food. The minimal number of chews for any
    food was 32 — one chomp for each tooth in your mouth. People who did this said
    they were “Fletcherizing.”'
  merge: -1
  img_proc: true
- pgno: 301
  md: "Mom and Dad thought the whole Fletcher business was silly, but they respected\
    \ Aunt Edna and felt that people her age should be humored, not defied. As for\
    \ me, I thought I'd explode from the monotony. Each meal lasted forever. Each\
    \ mouthful was an ordeal. I can still remember my mantra — the words I'd say to\
    \ myself without meaning to do so:\n\n```\nI've chewed 0 times so far.\nHave I\
    \ chewed 100 times yet? If not, then\n    Chew!\n        Add 1 to the number of\
    \ times that I've chewed.\n        Go back to \"Have I chewed\"\n            to\
    \ find out if I'm done yet.\n```\n\n# Repeating Statements a Certain Number of\
    \ Times (Java for Statements)\n\nLife is filled with examples of counting loops.\
    \ And computer programming mirrors life (. . . or is it the other way around?).\
    \ When you tell a computer what to do, you're often telling the computer to print\
    \ three lines, process ten accounts, dial a million phone numbers, or whatever.\
    \ Because counting loops are so common in programming, the people who create programming\
    \ languages have developed statements just for loops of this kind. In Java, the\
    \ statement that repeats something a certain number of times is called a for statement.\
    \ An example of a for statement is in Listing 15-1.\n\n# Listing 15-1: Horace\
    \ Fletcher's Revenge\n\n```\nimport static java.lang.System.out;\n\nclass AuntEdnaSettlesForTen\
    \ {\n\n    public static void main(String args[]) {\n\n        for (int count\
    \ = 0; count < 10; count++) {\n            out.print(\"I've chewed \");\n    \
    \        out.print(count);\n            out.println(\" time(s).\");\n        }\n\
    \n        out.println(\"10 times! Hooray!\");\n        out.println(\"I can swallow!\"\
    );\n\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Figure 15-1 shows you what you get when you run the program of Listing 15-1:


    +   - The `for` statement in Listing 15-1 starts by setting the count variable
    equal to 0.

    +   - Then the `for` statement tests to make sure that count is less than 10 (which
    it certainly is).

    +   - Then the `for` statement dives ahead and executes the printing statements
    between the curly braces. At this early stage of the game, the computer prints
    `I''ve chewed 0 time(s).`

    +   - Then the `for` statement executes `count++` — that last thing inside the
    `for` statement''s parentheses. This last action adds 1 to the value of count.


    ![](img/f938eba5f15e231d828a6255e7ec5523_302_0.png)


    This ends the first iteration of the `for` statement in Listing 15-1. Of course,
    this loop has more to it than just one iteration:


    +   - With count now equal to 1, the `for` statement checks again to make sure
    that count is less than 10. (Yes, 1 is smaller than 10.)

    +   - Because the test turns out okay, the `for` statement marches back into the
    curly braces statements and prints `I''ve chewed 1 time(s)` on the screen.

    +   - Then the `for` statement executes that last `count++` inside its parentheses.
    The statement adds 1 to the value of count, increasing the value of count to 2.


    And so on. This whole thing keeps being repeated over and over again until, after
    ten iterations, the value of count finally reaches 10. When this happens, the
    check for count being less than 10 fails, and the loop''s execution ends.'
