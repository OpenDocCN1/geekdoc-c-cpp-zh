- pgno: 331
  md: '# # 第三章 磁场与测量


    # ## 3.1 磁场的产生


    磁场是一种看不见、摸不着的特殊物质，它由运动的电荷或变化的电场产生。磁场对位于其中的磁极、运动电荷以及载流导体都会产生力的作用。1820年，奥斯特发现通电导线会使附近的小磁针发生偏转，首次揭示了电流的磁效应，即电流能够产生磁场。


    实验表明，在真空中，一段长为 $\mathrm{d}l$ 的载流导线元中的电流 $I$ 在空间某点 $P$ 处所产生的磁感应强度为：


    $$\mathrm{d}\vec{B} = \frac{\mu_0 I}{4\pi} \cdot \frac{\mathrm{d}\vec{l} \times
    \vec{r}}{r^3}$$


    其中 $\mu_0 = 4\pi \times 10^{-7} \ \mathrm{T \cdot m/A}$ 称为真空磁导率，$\vec{r}$ 为从电流元指向场点
    $P$ 的径矢。上式即为毕奥—萨伐尔定律的微分形式。对任意形状的载流导线所产生的磁场，可通过积分求出：


    $$\vec{B} = \int \mathrm{d}\vec{B} = \frac{\mu_0}{4\pi} \int \frac{I \, \mathrm{d}\vec{l}
    \times \vec{r}}{r^3}$$


    对于一段载流直导线，若导线两端到场点的连线与导线方向的夹角分别为 $\theta_1$ 和 $\theta_2$，则其在真空中产生的磁感应强度为：


    $$B = \frac{\mu_0 I}{4\pi a} (\cos\theta_1 - \cos\theta_2)$$


    其中 $a$ 为场点到导线的垂直距离。若导线为无限长，则 $\theta_1 = 0$，$\theta_2 = \pi$，可得无限长直导线周围的磁感应强度为
    $B = \dfrac{\mu_0 I}{2\pi a}$。这一结果与实验事实相符，广泛应用于工程计算。'
  merge: -1
  img_proc: true
