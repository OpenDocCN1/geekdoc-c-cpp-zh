  md: 'So in Listing 18-6, you call the Scanner class''s nextLine method, allowing
    a user to enter any characters at all — not just digits. If the user types Not
    playing, you don''t give the killjoy any chips.


    If the user types some digits, you''re stuck holding these digits in the string
    variable named reply. You can''t add ten to a string like reply. So you call the
    Integer class''s parseInt method, which takes your string and hands you back a
    nice int value. From there, you can add ten to the int value.


    ![](img/f938eba5f15e231d828a6255e7ec5523_376_0.png)


    Java has a loophole that allows you to add a number to a string. The problem is,
    you don''t get real addition. Adding the number 10 to the string "30" gives you
    "3010", not 40.


    ![](img/f938eba5f15e231d828a6255e7ec5523_376_1.png)


    Don''t confuse Integer with int. In Java, int is the name of a primitive type
    (a type that I use throughout this book). But Integer is the name of a class.
    Java''s Integer class contains handy methods for dealing with int values. For
    example, in Listing 18-6, the Integer class''s parseInt method makes an int value
    from a string.


    # Turning numbers into strings


    In Chapter 17, Listing 17-1 adds tax to the amount of a purchase. But a run of
    the code in Listing 17-1 has an anomaly. Refer to Figure 17-1. With 5 percent
    tax on 20 dollars, the program displays a total of 21.0. That''s peculiar. Where
    I come from, currency amounts aren''t normally displayed with just one digit beyond
    the decimal point.


    If you don''t choose your purchase amount carefully, the situation is even worse.
    For example, in Figure 18-9, I run the same program (the code in Listing 17-1)
    with purchase amount 19.37. The resulting display looks very nasty.


    Figure 18-9: Do you have change for 20.3385000-00000003?


    ![](img/f938eba5f15e231d828a6255e7ec5523_376_2.png)


    With its internal zeros and ones, the computer doesn''t do arithmetic quite the
    way you and I are used to doing it. So how do you fix this problem?'
