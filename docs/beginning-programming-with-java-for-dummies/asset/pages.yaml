  md: "If the output in Figure 17-1 looks funny, it's because I do nothing in the\
    \ code to control the number of digits beyond the decimal point. So in the output,\
    \ the value $20.00 looks like 20.0. That's okay. I show you how to fix the problem\
    \ in Chapter 18.\n\n# Reference types and Java classes\n\nThe code in Listing\
    \ 17-1 involves a few simple values — amount, taxable, and total. So here's the\
    \ main point of this chapter: By combining several simple values, you can get\
    \ a single, more useful value. That's the way it works. You take some of Java's\
    \ primitive types, whip them together to make a primitive type stew, and what\
    \ do you get? You get a more useful type called a reference type. Listing 17-2\
    \ has an example.\n\n# Listing 17-2: What It Means to Be a Purchase\n\n```\n```java\n\
    class Purchase {\n    double amount;\n    boolean taxable;\n    double total;\n\
    }\n```\n```\n\nThe code in Listing 17-2 has no main method, so Eclipse can compile\
    \ the code, but you can't run it. When you choose Run→Run As in Eclipse's main\
    \ menu, the resulting context menu has no Java Application entry. You can click\
    \ the tiny Run As button in Eclipse's toolbar and then select Java Application.\
    \ But then you get the message box shown in Figure 17-2. Because Listing 17-2\
    \ has no main method, there's no place to start the executing. (In fact, the code\
    \ in Listing 17-2 has no statements at all. There's nothing to execute.)\n\nFigure\
    \ 17-2:\nThe code in Listing 17-2 has no main method.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_350_0.png)\n\
    \n# Using a newly defined class\n\nTo do something useful with the code in Listing\
    \ 17-2, you need a main method. You can put the main method in a separate file.\
    \ Listing 17-3 shows you such a file."
