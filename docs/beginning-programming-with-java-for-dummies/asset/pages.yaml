    \                (\" Delete the importantData file? \");\n            reply =\n\
    \                keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\n        }\
    \ while (reply != 'Y' && reply != 'N');\n\n        if (reply == 'Y') {\n     \
