  md: "# Figure 10-12:\nGo, team,\ngo!\n\n```\nHankees and Socks scores? 9 4\nHankees\
    \ win...\nHankees: 9\nSocks: 4\n\nHankees and Socks scores? 3 8\nSocks win...\n\
    Socks: 8\nHankees: 3\n\nHankees and Socks scores? 0 0\nIt's a tie...\nHankees:\
    \ 0\nSocks: 0\n```\n\nListing 10-6 illustrates a way of thinking about a problem.\
    \ You have one question with more than two answers. (In this section's baseball\
    \ problem, the question is \"Who wins?\" and the answers are \"Hankees,\" \"Socks,\"\
    \ or \"Neither.\") The problem begs for an if statement, but an if statement has\
    \ only two branches — the true branch and the false branch. So you combine alternatives\
    \ to form cascading if statements.\n\nIn Listing 10-6, the format for the cascading\
    \ if statements is\n\n```\nif (Condition1) {\n    SomeStatements\n} else if (Condition2)\
    \ {\n    OtherStatements\n} else {\n    EvenMoreStatements\n}\n```\n\nIn general,\
    \ you can use else if as many times as you want:\n\n```\nif (hankeesWin) {\n \
    \   out.println(\"Hankees win...\");\n    out.print(\"Hankees: \");\n    out.println(hankees);\n\
    \    out.print(\"Socks: \");\n    out.println(socks);\n} else if (socksWin) {\n\
    \    out.println(\"Socks win...\");\n    out.print(\"Socks: \");\n    out.println(socks);\n\
    \    out.print(\"Hankees: \");\n    out.println(hankees);\n} else if (isATie)\
    \ {\n    out.println(\"It's a tie...\");\n    out.print(\"Hankees: \");\n```"
