- pgno: 59
  md: '# Configuring Java in Eclipse


    Eclipse normally looks on your computer for Java installations and selects an
    installed version of Java to use for running your Java programs. Your computer
    may have more than one version of Java, so you may want to double-check Eclipse''s
    choice of the Java version. The following steps show you how:


    +   1. On Windows or Linux: In Eclipse''s main menu, select Window→ Preferences.
    On a Mac: In Eclipse''s main menu, select Eclipse→ Preferences.


    As a result, Eclipse''s Preferences dialog appears. (You can follow along with
    Figure 2-13.)


    ![](img/f938eba5f15e231d828a6255e7ec5523_59_0.png)


    Figure 2-13

    Eclipse''s Preferences dialog.


    +   2. In the tree on the left side of the Preferences dialog, expand the Java
    branch.

    +   3. Within the Java branch, select the Installed JREs sub-branch.

    +   4. Look at the list of Java versions (Installed JREs) in the main body of
    the Preferences dialog.


    In the list, each version of Java has a check box. Eclipse uses the version whose
    box is checked. If the checked version isn''t your preferred version (for example,
    if the checked version isn''t version 8 or higher), you can make some changes.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '5. If your preferred version of Java appears in the Installed JREs list, put
    a check mark in that version''s check box.


    6. If your preferred version of Java doesn''t appear in the Installed JREs list,
    click the Add button.


    When you click the Add button, a JRE Type dialog appears (see Figure 2-14).


    ![](img/f938eba5f15e231d828a6255e7ec5523_60_0.png)


    Figure 2-14:

    The JRE Type dialog.


    7. In the JRE Type dialog, double-click Standard VM.


    As a result, a JRE Definition dialog appears (see Figure 2-15). What you do next
    depends on a few different things.


    8. Fill in the dialog''s JRE Home field.


    How you do this depends on your operating system.


    +   - On Windows, browse to the directory in which you''ve installed your preferred
    Java version. On my many Windows computers, that directory is either `C:\Program
    Files\Java\jre8`, `C:\Program Files\Java\jdk1.8.0`, `C:\Program Files (x86)\Java\jre8`,
    or something of that sort.

    +   - On a Mac, use the Finder to browse to the directory in which you''ve installed
    your preferred Java version. Type the name of the directory in the dialog''s JRE
    Home field. My Mac has one Java directory named `/System/Library/Java/Java Virtual
    Machines/1.6.0.jdk/Contents/Home` and another Java directory named `/Library/Java/JavaVirtualMachines/jdk_1.8.0.jdk/Contents/Home`.
    (The first is for Apple''s old version of Java; the second is for Oracle''s new
    Java version.) You might also find Oracle''s Java in the `/Library/Internet Plug-Ins/JavaAppletPlugin.plugin/Contents/Home`
    directory.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/f938eba5f15e231d828a6255e7ec5523_61_0.png)


    Figure 2-15:

    The JRE Definition dialog (after you''ve followed Steps 8 and 9).


    ![](img/f938eba5f15e231d828a6255e7ec5523_61_1.png)


    ![](img/f938eba5f15e231d828a6255e7ec5523_61_2.png)


    Directories like /System and /Library don''t normally appear in the Finder window.
    To browse to one of these directories (to the /Library directory, for example),
    choose Go→Go to Folder in the Finder''s menu bar. In the resulting dialog, type
    /Library and then press Go.


    As you navigate to the directory containing your preferred Java version, you may
    encounter a JDK 1.8.0.jdk icon or some other item whose extension is .jdk. To
    see the contents of this item, control-click the item''s icon and then select
    Show Package Contents.


    +   - On Linux, browse to the directory in which you''ve installed your preferred
    Java version. When in doubt, search for a directory whose name starts with jre
