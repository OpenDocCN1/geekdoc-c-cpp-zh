    # Cascading if statements


    Here''s a riddle: You have two baseball teams — the Hankees and the Socks. You
    want to display the teams'' scores on two separate lines, with the winner''s score
    coming first. (On the computer screen, the winner''s score is displayed above
    the loser''s score.) What happens when the scores are tied?


    Do you give up? The answer is, there''s no right answer. What happens depends
    on the way you write the program. Take a look back at Listing 9-4 in Chapter 9.
    When the scores are equal, the condition hankees > socks is false. So the program''s
    flow of execution drops down to the else clause. That clause displays the Socks
    score first and the Hankees score second. (Refer to Figure 9-7 in Chapter 9.)'
