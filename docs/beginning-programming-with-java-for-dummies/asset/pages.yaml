    \ so on.\n\nA run of the code from Listing 19-3 is shown in Figure 19-3.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_391_0.png)\n\
    \n**Figure 19-3:** Running the code in Listing 19-3.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_391_1.png)\n\
    \nConcerning the code in Listing 19-3, your mileage may vary. You don’t see the\
    \ same values as the ones in Figure 19-3. In fact, if you run Listing 19-3 more\
    \ than once, you (almost certainly) get different three-letter names, different\
    \ ID numbers, and different account balances each time. That’s what happens when\
    \ a program generates values randomly.\n\n# The flow of control\n\nSuppose that\
    \ you’re running the code in Listing 19-3. The computer reaches the display method\
    \ call:\n\n```\nanAccount.display();\n```\n\nAt that point, the computer starts\
