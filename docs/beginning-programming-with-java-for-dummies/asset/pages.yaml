    \ */\nimport java.io.File;\nimport java.util.Scanner;\n\nclass IHopeYouKnowWhatYoureDoing\
    \ {\n\n    public static void main(String args[]) {\n\n        Scanner keyboard\
    \ = new Scanner(System.in);\n        char reply;\n\n        do {\n\n         \
