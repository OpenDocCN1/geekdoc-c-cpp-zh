  md: "# A complete program\n\nListing 9-2 contains a complete program with a simple\
    \ if statement. The listing's code behaves like an electronic oracle. Ask the\
    \ program a yes or no question, and the program answers you back. Of course, the\
    \ answer to your question is randomly generated. But who cares? It's fun to ask\
    \ anyway.\n\n# Listing 9-2: I Know Everything\n\n```\nimport java.util.Scanner;\n\
    import java.util.Random;\n\nclass AnswerYesOrNo {\n    public static void main(String\
    \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        Random\
    \ myRandom = new Random();\n        int randomNumber;\n\n        System.out.print(\"\
    Type your question, my child: \");\n        keyboard.nextLine();\n\n        randomNumber\
    \ = myRandom.nextInt(10) + 1;\n\n        if (randomNumber > 5) {\n           \
    \ System.out.println(\"Yes. Isn't it obvious?\");\n        } else {\n        \
    \    System.out.println(\"No, and don't ask again.\");\n        }\n\n        keyboard.close();\n\
    \    }\n}\n```\n\nFigure 9-4 shows several runs of the program in Listing 9-2.\
    \ The program's action has four parts:\n\n+   1. **Prompt the user.**\n+     \
    \ Call System.out.print, telling the user to type a question.\n+   2. **Get the\
    \ user's question from the keyboard.**\n+      In Figure 9-4, I run the AnswerYesOrNo\
    \ program four times, and I type a different question each time. Meanwhile, back\
    \ in Listing 9-2, the statement\n+      `keyboard.nextLine();`\n+      swallows\
    \ up my question and does absolutely nothing with it. This is an anomaly, but\
    \ you're smart, so you can handle it."
