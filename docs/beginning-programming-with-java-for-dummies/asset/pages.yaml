    ![](img/f938eba5f15e231d828a6255e7ec5523_47_0.png)


    Java''s versions aren''t like indoor cats. They can coexist on the same computer
    without fighting or hissing at one another. If you have more than one version
    of Java on your computer, you''re okay. You can even mix 32-bit versions and 64-bit
    versions on the same computer (as long as you have at least one Java version whose
    word length matches your Eclipse version). I have three versions of Java on my
    Windows 8 computer, and I never run into trouble. (Occasionally, I cause my own
    trouble by confusing one version of Java for another. But this chapter''s "Configuring
    Java in Eclipse" section helps me sort things out. What would I do without this
