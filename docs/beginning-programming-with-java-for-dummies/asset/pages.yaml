- pgno: 286
  md: "# Writing, Rewriting, and Re-rewriting\n\nGiven my mischievous ways, I tried\
    \ a little experiment. I asked myself what would happen if I ran the same file-writing\
    \ program more than once. So I created a tiny program (the program in Listing\
    \ 13-5), and I ran the program twice. Then I examined the program’s output file.\
    \ The output file (shown in Figure 13-8) contains only two letters.\n\n# Listing\
    \ 13-5: A Little Experiment\n\n```\n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    import java.io.PrintStream;\n\nclass WriteOK {\n\n    public static void main(String\
    \ args[])\n        throws FileNotFoundException {\n\n        PrintStream diskWriter\
    \ =\n            new PrintStream(new File(\"approval.txt\"));\n\n        diskWriter.print('O');\n\
    \        diskWriter.println('K');\n\n        diskWriter.close();\n    }\n}\n```\n\
    ```\n\n![](img/f938eba5f15e231d828a6255e7ec5523_286_0.png)\n\nHere’s the sequence\
    \ of events from the start to the end of the experiment:\n\n+   1. **Before I\
    \ run the code in Listing 13-5, my computer’s hard drive has no approval.txt file.**\n\
    +   \n+      That’s okay. Every experiment has to start somewhere."
