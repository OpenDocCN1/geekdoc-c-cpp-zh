- pgno: 221
  md: 'In Figure 10-8, notice that the y and Y inputs yield different ticket prices,
    even though the age is 85 in both runs. This happens because, without parentheses,
    any && operator gets evaluated before any || operator. (That''s the rule in the
    Java programming language — evaluate && before ||.) When reply is Y, the condition
    in the bad if statement takes the following form:


    ```

    reply == ''Y'' || some-other-stuff-that-doesn_t-matter

    ```


    Whenever reply == ''Y'' is true, the whole condition is automatically true, as
    illustrated in Figure 10-9.


    ![](img/f938eba5f15e231d828a6255e7ec5523_221_0.png)


    Figure 10-9:

    "True or false makes "true."


    # Building a Nest


    The year is 1968, and The Prisoner is on TV. In the last episode, the show''s
    hero meets his nemesis, "Number One." At first, Number One wears a spooky happy-face/sad-face
    mask, and when the mask comes off, there''s a monkey mask underneath. To find
    out what''s behind the monkey mask, you have to watch the series on DVD. But in
    the meantime, notice the layering: a mask within a mask. You can do the same kind
    of thing with if statements. This section''s example shows you how.'
