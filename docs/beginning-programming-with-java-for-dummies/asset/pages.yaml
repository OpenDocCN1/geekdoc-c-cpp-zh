  md: '# Do I see formatting in my Java program?


    When you use Eclipse''s editor to write a Java program, you see words in various
    colors. Certain words are always blue. Other words are always black. You even
    see some bold and italic phrases. You may think you see formatting, but you don''t.
    Instead, what you see is called syntax coloring or syntax highlighting.


    program file. Instead, the editor displays each word in a way that makes the Java
    program easy to read.


    For example, in a Java program, certain words (words like class, public, and void)
    have their own special meanings. So Eclipse''s editor displays class, public,
    and void in bold, reddish letters. When I save my Java program file, the computer
    stores nothing about bold, colored letters in my Java program file. But the editor
    uses its discretion to highlight special words with reddish coloring.


    No matter what you call it, the issue is as follows:


    +   - With Microsoft Word, things like bold formatting are marked inside a document.
    When you save myPersonalDiary.docx, the instructions to make the words “love”
    and “hate” bold are recorded inside the MyPersonalDiary.docx file.

    +   - With a Java program editor, things like bold and coloring aren’t marked
    inside the Java program file. Instead, the editor displays each word in a way
    that makes the Java program easy to read.


    Some other editors may display the same words in a blue font. Another editor (like
    Windows Notepad) displays all words in plain old black.


    ![](img/f938eba5f15e231d828a6255e7ec5523_79_0.png)


    Java is case-sensitive, which means that system.out.println isn''t the same as
    System.out.println. If you type system.out.println, your program won''t work.
    Be sure to capitalize your code exactly as it is in Listing 3-1.


    If you copy and paste code from an ebook, check to make sure that the quotation
    marks in the code are straight quotation marks (") , not curly quotation marks
    (“”). In a Java program, straight quotation marks are good; curly quotation marks
    are troublesome.


    If you typed everything correctly, you see the stuff in Figure 3-11.


    Figure 3-11:

    A Java program in the Eclipse editor.


    ![](img/f938eba5f15e231d828a6255e7ec5523_79_1.png)'
