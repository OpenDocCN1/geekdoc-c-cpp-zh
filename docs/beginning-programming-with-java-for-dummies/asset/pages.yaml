  md: "# Getting values for variables\n\nI almost have a working program. But if I\
    \ take the code that I’ve developed for a mental test run, I face a few problems.\
    \ To see what I mean, picture yourself in the computer’s shoes for a minute. (Well,\
    \ a computer doesn’t have shoes. Picture yourself in the computer’s boots.)\n\n\
    You start at the top of the code shown in the previous section (the code that\
    \ starts with the Preliminary draft comment). In the code’s first statement, you\
    \ display the words Card Total. So far, so good. But then you encounter the while\
    \ loop and test the condition total < 21. Well, is total less than 21, or isn’t\
    \ it? Honestly, I’m tempted to make up an answer because I’m embarrassed about\
    \ not knowing what the total variable’s value is. (I’m sure the computer is embarrassed,\
    \ too.)\n\nThe variable total must have a known value before the computer reaches\
    \ the top of the while loop. Because a player starts with no cards at all, the\
    \ initial total value should be 0. That settles it. I declare int total = 0 at\
    \ the top of the program.\n\nBut what about my friend, the card variable? Should\
    \ I set card to zero also? No. There’s no zero-valued card in a deck (at least,\
    \ not when I’m playing fair). Besides, card should get a new value several times\
    \ during the program’s run.\n\nWait! In the previous sentence, the phrase several\
    \ times tickles a neuron in my brain. It stimulates the inside a loop reflex.\
    \ So I place an assignment to the card variable inside my while loop:\n\n```\n\
    //This is a DRAFT - still NOT ready for prime time:\nint card, total = 0;\n\n\
    System.out.println(\"Card  Total\");\n\nwhile (total < 21) {\n    card = myRandom.nextInt(10)\
    \ + 1;\n\n    System.out.print(card);\n    System.out.print(\"\\t \");\n    System.out.println(total);\n\
    }\n\nif (total == 21) {\n    System.out.println(\"You win :-)\");\n} else {\n\
    \    System.out.println(\"You lose :-(\");\n}\n```"
