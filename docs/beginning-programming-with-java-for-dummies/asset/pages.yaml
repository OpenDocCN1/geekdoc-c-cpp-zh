- pgno: 29
  md: '# From Your Mind to the Computer''s Processor


    When you create a new computer program, you go through a multistep process. The
    process involves three important tools:


    +   ✔ **Compiler:** A compiler translates your code into computer-friendly (human-unfriendly)
    instructions.

    +   ✔ **Virtual machine:** A virtual machine steps through the computer-friendly
    instructions.

    +   ✔ **Application programming interface:** An application programming interface
    contains useful prewritten code.


    The next three sections describe each of the three tools.


    # Translating your code


    You may have heard that computers deal with zeros and ones. That''s certainly
    true, but what does it mean? Well, for starters, computer circuits don''t deal
    directly with letters of the alphabet. When you see the word Start on your computer
    screen, the computer stores the word internally as 01010011 01110100 01100001
    01110010 01110100. That feeling you get of seeing a friendly looking five-letter
    word is your interpretation of the computer screen''s pixels, and nothing more.
    Computers break everything down into very low-level, unfriendly sequences of zeros
    and ones and then put things back together so that humans can deal with the results.


    So what happens when you write a computer program? Well, the program has to get
    translated into zeros and ones. The official name for the translation process
    is compilation. Without compilation, the computer can''t run your program.


    I compiled the code in Listing 1-1. Then I did some harmless hacking to help me
    see the resulting zeros and ones. What I saw was the mishmash in Figure 1-1.


    The compiled mumbo jumbo in Figure 1-1 goes by many different names:


    +   ✔ Most Java programmers call it bytecode.

    +   ✔ I often call it a class file. That''s because, in Java, the bytecode gets
    stored in files named SomethingOrOther.class.

    +   ✔ To emphasize the difference, Java programmers call Listing 1-1 the source
    code and refer to the zeros and ones in Figure 1-1 as object code.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Figure 1-1:

    My computer understands these zeros and ones, but I don''t.


    ![](img/f938eba5f15e231d828a6255e7ec5523_30_0.png)


    To visualize the relationship between source code and object code, see Figure
    1-2. You can write source code and then get the computer to create object code
    from your source code. To create object code, the computer uses a special software
    tool called a compiler.


    Figure 1-2:

    The computer compiles source code to create object code.


    ![](img/f938eba5f15e231d828a6255e7ec5523_30_1.png)


    ![](img/f938eba5f15e231d828a6255e7ec5523_30_2.png)


    Your computer''s hard drive may have a file named javac or javac.exe. This file
    contains that special software tool — the compiler. (Hey, how about that? The
    word javac stands for "Java compiler") As a Java programmer, you often tell your
    computer to build some new object code. Your computer fulfills this wish by going
    behind the scenes and running the instructions in the javac file.


    # Running code


    Several years ago, I spent a week in Copenhagen. I hung out with a friend who
    spoke both Danish and English fluently. As we chatted in the public park, I vaguely
    noticed some kids orbiting around us. I don''t speak a word of Danish, so I assumed
    that the kids were talking about ordinary kid stuff.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# What is bytecode, anyway?


    Look at Listing 1-1 and at the listing''s translation into bytecode in Figure
    1-1. You may be tempted to think that a bytecode file is just a cryptogram — substituting
    zeros and ones for the letters in words like if and else. But it doesn''t work
    that way at all. In fact, the most important part of a bytecode file is the encoding
    of a program''s logic.


    The zeros and ones in Figure 1-1 describe the flow of data from one part of your
    computer to another. I illustrate this flow in the following figure. But remember,
    this figure is just an illustration. Your computer doesn''t look at this particular
    figure, or at anything like it. Instead, your computer reads a bunch of zeros
    and ones to decide what to do next.


    ![](img/f938eba5f15e231d828a6255e7ec5523_31_0.png)


    Don''t bother to absorb the details in my attempt at graphical representation
    in the figure. It''s not worth your time. The thing you should glean from my mix
    of text, boxes, and arrows is that bytecode (the stuff in a .class file) contains
    a complete description of the operations that the computer is to perform. When
    you write a


    computer program, your source code describes an overall strategy — a big picture.
    The compiled bytecode turns the overall strategy into hundreds of tiny, step-by-step
    details. When the computer "runs your program," the computer examines this bytecode
    and carries out each of the little step-by-step details.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Then my friend told me that the kids weren''t speaking Danish. “What language
    are they speaking?” I asked.


    “They’re talking gibberish,” she said. “It’s just nonsense syllables. They don’t
    understand English, so they’re imitating you.”


    Now to return to present-day matters. I look at the stuff in Figure 1-1, and I’m
    tempted to make fun of the way my computer talks. But then I’d be just like the
    kids in Copenhagen. What’s meaningless to me can make perfect sense to my computer.
    When the zeros and ones in Figure 1-1 percolate through my computer’s circuits,
    the computer “thinks” the thoughts shown in Figure 1-3.


    ![](img/f938eba5f15e231d828a6255e7ec5523_32_0.png)


    Everyone knows that computers don’t think, but a computer can carry out the instructions
    depicted in Figure 1-3. With many programming languages (languages like C++ and
    COBOL, for example), a computer does exactly what I’m describing. A computer gobbles
    up some object code and does whatever the object code says to do.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'That''s how it works in many programming languages, but that''s not how it
    works in Java. With Java, the computer executes a different set of instructions.
    The computer executes instructions like the ones in Figure 1-4.


    ![](img/f938eba5f15e231d828a6255e7ec5523_33_0.png)


    The instructions in Figure 1-4 tell the computer how to follow other instructions.
    Instead of starting with Get columnNumber from memory, the computer''s first instruction
    is, "Do what it says to do in the bytecode file." (Of course, in the bytecode
    file, the first instruction happens to be Get columnNumber from memory.)


    There''s a special piece of software that carries out the instructions in Figure
    1-4. That special piece of software is called the Java Virtual Machine (JVM).
    The JVM walks your computer through the execution of some bytecode instructions.
    When you run a Java program, your computer is really running the JVM. That JVM
    examines your bytecode, zero by zero, one by one, and carries out the instructions
    described in the bytecode.


    Many good metaphors can describe the JVM. Think of the JVM as a proxy, an errand
    boy, a go-between. One way or another, you have the situation shown in Figure
    1-5. On the (a) side is the story you get with most programming languages — the
    computer runs some object code. On the (b) side is the story with Java — the computer
    runs the JVM, and the JVM follows the bytecode''s instructions.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Figure 1-5:

    Two ways to run a computer program.


    ![](img/f938eba5f15e231d828a6255e7ec5523_34_0.png)


    ![](img/f938eba5f15e231d828a6255e7ec5523_34_1.png)


    Your computer''s hard drive may have files named javac and java (or javac.exe
    and java.exe). A java (or java.exe) file contains the instructions illustrated
    previously in Figure 1-4 — the instructions in the JVM. As a Java programmer,
    you often tell your computer to run a Java program. Your computer fulfills this
    wish by going behind the scenes and running the instructions in the java file.


    # Write once, run anywhere


    When Java first hit the tech scene in 1995, the language became popular almost
    immediately. This happened in part because of the JVM. The JVM is like a foreign
    language interpreter, turning Java bytecode into whatever native language a particular
    computer understands. So if you hand my Windows computer a Java bytecode file,
    then the computer''s JVM interprets the file for the Windows environment. If you
    hand the same Java bytecode file to my colleague''s Macintosh, then the Macintosh
    JVM interprets that same bytecode for the Mac environment.


    Look again at Figure 1-5. Without a virtual machine, you need a different kind
    of object code for each operating system. But with the JVM, just one piece of
    bytecode works on Windows machines, Unix boxes, Macs, or whatever. This is called
    *portability*, and in the computer-programming world, portability is a very precious
    commodity. Think about all the people using computers to browse the Internet.
    These people don''t all run Microsoft Windows, but each person''s computer can
    have its own bytecode interpreter — its own JVM.


    The marketing folks at Oracle call it the *Write Once, Run Anywhere* model of
    computing. I call it a great way to create software.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Code you can use


    During the early 1980s, my cousin-in-law Chris worked for a computer software
    firm. The firm wrote code for word-processing machines. (At the time, if you wanted
    to compose documents without a typewriter, you bought a “computer” that did nothing
    but word processing.) Chris complained about being asked to write the same old
    code over and over again. “First, I write a search-and-replace program. Then I
    write a spell checker. Then I write another search-and-replace program. Then,
    a different kind of spell checker. And then, a better search-and-replace.”


    How did Chris manage to stay interested in his work? And how did Chris’s employer
    manage to stay in business? Every few months, Chris had to reinvent the wheel.
    Toss out the old search-and-replace program and write a new program from scratch.
    That’s inefficient. What’s worse, it’s boring.


    For years, computer professionals were seeking the Holy Grail — a way to write
    software so that it’s easy to reuse. Don’t write and rewrite your search-and-replace
    code. Just break the task into tiny pieces. One piece searches for a single character,
    another piece looks for blank spaces, and a third piece substitutes one letter
    for another. When you have all the pieces, just assemble these pieces to form
    a search-and-replace program. Later on, when you think of a new feature for your
    word-processing software, you reassemble the pieces in a slightly different way.
    It’s sensible, it’s cost efficient, and it’s much more fun.


    The late 1980s saw several advances in software development, and by the early
    1990s, many large programming projects were being written from prefab components.
    Java came along in 1995, so it was natural for the language’s founders to create
    a library of reusable code. The library included about 250 programs, including
    code for dealing with disk files, code for creating windows, and code for passing
    information over the Internet. Since 1995, this library has grown to include more
    than 4,000 programs. This library is called the Application Programming Interface
    (API).


    Every Java program, even the simplest one, calls on code in the Java API. This
    Java API is both useful and formidable. It’s useful because of all the things
    you can do with the API’s programs. It’s formidable because the API is so extensive.
    No one memorizes all the features made available by the Java API. Programmers
    remember the features that they use often and look up the features that they need
    in a pinch. They look up these features in an online document called the API Specification
    (known affectionately to most Java programmers as the API documentation, or the
    Javadocs).'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'The API documentation (see http://docs.oracle.com/javase/8/docs/api/) describes
    the thousands of features in the Java API. As a Java programmer, you consult this
    API documentation on a daily basis. You can bookmark the documentation at the
    Oracle website and revisit the site whenever you need to look up something, or
    you can save time by downloading your own copy of the API docs using the links
    found at www.oracle.com/technetwork/java/javase/downloads/index.html.


    # Your Java Programming Toolset


    To write Java programs, you need the tools described previously in this chapter:


    +   - You need a Java compiler. (Refer to the section “Translating your code.”)

    +   - You need a JVM. (Refer to the section “Running code.”)

    +   - You need the Java API. (Refer to the section “Code you can use.”)

    +   - You need access to the Java API documentation. (Again, refer to the “Code
    you can use” section.)


    You also need some less exotic tools:


    +   - You need an editor to compose your Java programs. Listing 1-1 contains part
    of a computer program. When you come right down to it, a computer program is a
    big bunch of text. So to write a computer program, you need an editor — a tool
    for creating text documents.


    An editor is a lot like Microsoft Word, or like any other word-processing program.
    The big difference is that an editor adds no formatting to your text — no bold,
    italic, or distinctions among fonts. Computer programs have no formatting whatsoever.
    They have nothing except plain old letters, numbers, and other familiar keyboard
    characters.


    When you edit a program, you may see bold text, italic text, and text in several
    colors. But your program contains none of this formatting. If you see stuff that
    looks like formatting, it''s because the editor that you''re using does syntax
    highlighting. With syntax highlighting, an editor makes the text appear to be
    formatted in order to help you understand the structure of your program. Believe
    me, syntax highlighting is very helpful.


    +   - You need a way to issue commands. You need a way to say things like “compile
    this program” and “run the JVM.” Every computer provides ways of issuing commands.
    (You can double-click icons or type verbose commands in a Run dialog box.) But
    when you use your computer''s facilities, you jump from one window to another.
    You open one window to read Java documentation, another window to edit a Java
    program, and a third window to start up the Java compiler. The process can be
    very tedious.


    ![](img/f938eba5f15e231d828a6255e7ec5523_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'In the best of all possible worlds, you do all your program editing, documentation
    reading, and command issuing through one nice interface. This interface is called
    an integrated development environment (IDE).


    A typical IDE divides your screen''s work area into several panes — one pane for
    editing programs, another pane for listing the names of programs, a third pane
    for issuing commands, and other panes to help you compose and test programs. You
    can arrange the panes for quick access. Better yet, if you change the information
    in one pane, the IDE automatically updates the information in all the other panes.


    An IDE helps you move seamlessly from one part of the programming endeavor to
    another. With an IDE, you don''t have to worry about the mechanics of editing,
    compiling, and running a JVM. Instead, you can worry about the logic of writing
    programs. (Wouldn''t you know it? One way or another, you always have something
    to worry about!)


    # What''s already on your hard drive?


    You may already have some of the tools you need for creating Java programs. But,
    on an older computer, your tools may be obsolete. Most of this book''s examples
    run on all versions of Java. But some examples don''t run on versions earlier
    than Java 5.0. Other examples run only on Java 6, Java 7, Java 8, or later.


    The safest bet is to download tools afresh from java.com or from the Oracle website.
    To get detailed instructions on doing the download, see Chapter 2.


    # Eclipse


    The programs in this book work with any IDE that can run Java. This includes IDEs
    such as NetBeans, IntelliJ IDEA, JDeveloper, JCreator, and others. You can even
    run the programs without an IDE. But to illustrate the examples in this book,
    I use the Eclipse IDE. I chose Eclipse over other IDEs for several reasons:


    +   - Eclipse is free.

    +   - Among all the Java IDEs, Eclipse is the one most commonly used by professional
    programmers.

    +   - Eclipse has many bells and whistles, but you can ignore most of them and
    learn to repeat a few routine sequences of steps. After using Eclipse a few times,
    your brain automatically performs the routine steps. From then on, you can stop
    worrying about Eclipse and concentrate on Java programming.

    +   - Eclipse is free. (It''s worth mentioning twice.)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Chapter 2


    # Setting Up Your Computer


    # In This Chapter


    +   - Installing Java

    +   - Downloading and installing the Eclipse integrated development environment

    +   - Checking your Eclipse configuration

    +   - Getting the code in this book''s examples


    This book tells you how to write Java programs, and before you can write Java
    programs, you need some software. At the very least, you need the software that
    I describe in Chapter 1 — a Java compiler and a Java Virtual Machine (JVM, for
    short). You can also use a good integrated development environment (IDE) and some
    sample code to get you started.


    All the software you need for writing Java programs is free. The software comes
    as three downloads — one from this book''s website, another from Oracle, and a
    third from eclipse.org.


    ![](img/f938eba5f15e231d828a6255e7ec5523_38_0.png)


    The Oracle and Eclipse websites that I describe in this chapter are always changing.
    The software that you download from these sites changes, too. A specific instruction
    such as "click the button in the upper-right corner" becomes obsolete (and even
    misleading) in no time at all. So in this chapter, I provide long lists of steps,
    but I also describe the ideas behind the steps. Browse each of the suggested sites
    and look for ways to get the software that I describe. When a website offers you
    several options, check the instructions in this chapter for hints on choosing
    the best option. If your computer''s Eclipse window doesn''t look quite like the
    window in this chapter''s figures, scan your computer''s window for whatever options
