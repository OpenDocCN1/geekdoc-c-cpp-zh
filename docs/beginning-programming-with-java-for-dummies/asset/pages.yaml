  md: '5. Launch Eclipse and click the Welcome screen''s Workbench icon.


    Initially, the Welcome screen''s icons have no text labels. But when you hover
    over an icon, a tooltip appears. Select the icon whose tooltip has the title Workbench.


    6. In Eclipse, import the code that you downloaded in Step 1.


    For details about any of this stuff, see the next several sections.


    # Those pesky filename extensions


    The filenames displayed in Windows File Explorer or in a Finder window can be
    misleading. You may browse one of your directories and see the name Mortgage.
    The file''s real name might be Mortgage.java, Mortgage.class, Mortgage.somethingElse,
    or plain old Mortgage. Filename endings like .zip, .java, and .class are called
    filename extensions.


    The ugly truth is that, by default, Windows and Macs hide many filename extensions.
    This awful feature tends to confuse programmers. So, if you don''t want to be
    confused, change your computer''s system-wide settings. Here''s how you do it:


    +   - In Windows XP: Choose Start→Control Panel→Appearance and Themes→Folder Options.
    Then follow the instructions in the In All Versions of Windows bullet.

    +   - In Windows 7: Choose Start→Control Panel→Appearance and Personalization→Folder
    Options. Then follow the instructions in the In All Versions of Windows bullet.

    +   - In Windows 8: In the Start screen, hold down the Windows key while pressing
    Q.


    In the resulting search box, type Folder Options and then press Enter. Then follow
    the instructions in the In All Versions of Windows bullet.


    +   - In all versions of Windows (XP and newer): Follow the instructions in one
    of the preceding bullets. Then, in the Folder Options dialog box, click the View
    tab. Look for the Hide File Extensions for Known File Types option. Make sure
    that this check box is not selected.

    +   - In Mac OS X: In the Finder application''s menu, select Preferences. In the
    resulting dialog box, select the Advanced tab and look for the Show All File Extensions
    option. Make sure that this check box is selected.

    +   - In Linux: Linux distributions tend not to hide filename extensions. So,
    if you use Linux, you probably don''t have to worry about this. But I haven''t
    checked all Linux distributions. So, if your files are named Mortgage instead
    of Mortgage.java or Mortgage.class, check the documentation specific to your Linux
    distribution.'
