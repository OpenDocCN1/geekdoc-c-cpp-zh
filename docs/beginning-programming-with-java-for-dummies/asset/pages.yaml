  md: '# Chapter 20


    # Oooey GUI Was a Worm


    # In This Chapter


    +   ► Swinging into action

    +   ► Displaying an image

    +   ► Using buttons and text boxes


    There’s a wonderful old joke about a circus acrobat jumping over mice. Unfortunately,
    I’d get sued for copyright infringement if I included the joke in this book.


    Anyway, the joke is about starting small and working your way up to bigger things.
    That’s what you do when you read Beginning Programming with Java For Dummies,
    4th Edition.


    Most of the programs in this book are text-based. A text-based program has no
    windows, no dialog boxes, nothing of that kind. With a text-based program, the
    user types characters in the Console view, and the program displays output in
    the same Console view.


    These days, very few publicly available programs are text-based. Almost all programs
    use a GUI — a Graphical User Interface. So if you’ve read every word of this book
    up to now, you’re probably saying to yourself, “When am I going to find out how
    to create a GUI?”


    Well, now’s the time! This chapter introduces you to the world of GUI programming
    in Java.


    You can see GUI versions of many examples from this book by visiting the book’s
    website (allmycode.com/BeginProg).


