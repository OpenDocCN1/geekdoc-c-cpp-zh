  md: "Pause a moment to think about the flow of actions — what should and shouldn’t\
    \ happen when the computer executes the loop. A loop of this kind doesn’t need\
    \ to check anything before getting the user’s first response. Indeed, before the\
    \ user gives the first response, the loop has nothing to check. The loop shouldn’t\
    \ start with “as long as the user’s response is invalid, get another response\
    \ from the user.” Instead, the loop should just leap ahead, get a response from\
    \ the user and then check the response to see whether it made sense. The code\
    \ to do all this is in Listing 15-4.\n\n# Listing 15-4: Repeat Before You Delete\n\
    \n```\n```java\n/*\n * DISCLAIMER: Neither the author nor Wiley Publishing,\n\
    \ * Inc., nor anyone else ever remotely connected with the\n * creation of this\
