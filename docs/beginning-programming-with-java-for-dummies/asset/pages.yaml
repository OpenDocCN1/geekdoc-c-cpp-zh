  md: "# Reading from a file\n\nAll the Scanner methods can read from existing disk\
    \ files. For example, to read a word from a file named mySpeech, use code of the\
    \ following kind:\n\n```\n```java\nScanner diskScanner =\n    new Scanner(new\
    \ File(\"mySpeech\"));\n\nString oneWord = diskScanner.next();\n```\n```\n\nTo\
    \ read a character from a file named letters.dat and then display the character\
    \ on the screen, you can do something like this:\n\n```\n```java\nScanner diskScanner\
    \ =\n    new Scanner(new File(\"letters.dat\"));\n\nSystem.out.println(\n    diskScanner.findWithinHorizon(\"\
    .\", 0).charAt(0));\n```\n```\n\n![](img/f938eba5f15e231d828a6255e7ec5523_283_0.png)\n\
    \nNotice how I read from a file named mySpeech, not mySpeech.txt or mySpeech.doc.\
    \ Anything that you put after the dot is called a filename extension, and for\
    \ a file full of numbers and other data, the filename extension is optional. Sure,\
    \ a Java program must be called something.java, but a data file can be named mySpeech.txt,\
    \ mySpeech.reallymine.allmine, or just mySpeech. As long as the name in your new\
    \ File call is the same as the filename on your computer’s hard drive, everything\
    \ is okay.\n\n# Writing to a file\n\nThe print and println methods can write to\
    \ disk files. Here are some examples:\n\n+   - During a run of the code in Listing\
    \ 13-2, the variable `total` stores the number 99.75. To deposit 99.75 into the\
    \ `cookedData.txt` file, you execute:\n+   \n+     ```java\n+     diskWriter.println(total);\n\
    +     ```\n+   \n+     This `println` call writes to a disk file because of the\
    \ following line in Listing 13-2:\n+   \n+     ```java\n+     PrintStream diskWriter\
    \ =\n+         new PrintStream(\"cookedData.txt\");\n+     ```\n+   \n+   - In\
    \ another version of the program, you may decide not to use a `total` variable.\
    \ To write 99.75 to the `cookedData.txt` file, you can call:\n+   \n+     ```java\n\
    +     diskWriter.println(unitPrice * quantity);\n+     ```"
