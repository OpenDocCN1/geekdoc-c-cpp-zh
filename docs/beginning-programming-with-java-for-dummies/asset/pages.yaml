    Most people have no difficulties visiting the Oracle website http://oracle.com/
    and installing Java using the website''s menus. But if your situation is more
    ''interesting'' than most, you may have to make some decisions and perform some
    extra steps. The next few sections describe some of these ''interesting'' scenarios.


    # How many bits does your computer have?


    As you follow this chapter''s instructions, you may be prompted to choose between
    two versions of a piece of software — the 32-bit version and the 64-bit version.
    What''s the difference, and why should you care?


    A bit is the smallest piece of information that you can store on a computer. Most
    people think of a bit as either a zero or a one, and that depiction of ''bit''
    is quite useful. To represent almost any number, you pile several bits next to
    one another and do some fancy things with powers of two. The numbering system''s
    details aren''t show stoppers. The important thing to remember is that each piece
    of circuitry inside your computer stores the same number of bits. (Well, some
    circuits inside your computer are outliers with their own particular numbers of
    bits, but that''s not a big deal.)


    In an older computer, each piece of circuitry stores 32 bits. In a newer computer,
    each piece of circuitry stores 64 bits. This number of bits (either 32 or 64)
    is the computer''s word length. In a newer computer, a word is 64 bits long.


    ''Great!'' you say. ''I bought my computer last week. It must be a 64-bit computer.''
    Well, the story may not be that simple. In addition to your computer''s circuitry
    having a word length, the operating system on your computer also has a word length.
    An operating system''s instructions work with a particular number of bits. An
    operating system with 32-bit instructions can run on either a 32-bit computer
    or a 64-bit computer, but an operating system with 64-bit instructions can run
    only on a 64-bit computer. And to make things even more complicated, each program
    that you run (a web browser, a word'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'processor, or one of your own Java programs) is either a 32-bit program or
    a 64-bit program. You may run a 32-bit web browser on a 64-bit operating system
    running on a 64-bit computer. Alternatively, you may run a 32-bit browser on a
    32-bit operating system on a 64-bit computer. (See the figure that accompanies
    this sidebar.)


    +   - If you run a 32-bit operating system, you run only 32-bit software.

    +   - If you run a 64-bit operating system, you probably run some 32-bit software
    and some 64-bit software. Most 32-bit software runs fine on a 64-bit operating
    system.


    ![](img/f938eba5f15e231d828a6255e7ec5523_46_0.png)


    When a website makes you choose between 32-bit and 64-bit software versions, the
    main consideration is the word length of your operating system, not the word length
    of your computer''s circuitry. You can run a 32-bit word processor on a 64-bit
    operating system, but you can''t run a 64-bit word processor on a 32-bit operating
    system (no matter what word length your computer''s circuitry has). Choosing 64-bit
    software has one big advantage — namely, that 64-bit software can access more
    than three gigabytes of a computer''s fast random access memory. And in my experience,
    more memory means faster processing.


    How does all this stuff about word lengths affect your Java and Eclipse downloads?
    Here''s the story:


    +   - On a 64-bit operating system, you might have two versions of the same program.
    For example, on my Windows computer, I have two versions of Internet Explorer
    — a 32-bit version and a 64-bit version.

    +   - Normally, Windows puts 32-bit programs in its Program Files (x86) directory
    and puts 64-bit programs in its Program Files directory.

    +   - A chain of word lengths is as strong as its weakest link. For example, when
    I visit http://java.com and click the site''s Do I Have Java? link, the answer
    I get depends on the match between my computer''s Java version and the web browser
    that I''m running. With only 64-bit Java installed'
  merge: -1
  img_proc: true
