  md: "# A quick look at the Scanner\n\nIn this chapter, I advise you to ignore any\
    \ of the meanings behind the lines import java.util.Scanner and Scanner keyboard,\
    \ etc. Just paste these two lines mindlessly in your code and then move on.\n\n\
    Of course, you may not want to take my advice. You may not like ignoring things\
    \ in your code. If you happen to be such a stubborn person, I have a few quick\
    \ facts for you.\n\n✔ The word Scanner is defined in the Java API.\n\nA Scanner\
    \ is something you can use for getting input.\n\nThis Scanner class belongs to\
    \ Java versions 5.0 and higher. If you use version Java 1.4.2, you don't have\
    \ access to the Scanner class. (You see an error marker when you type Listing\
    \ 5-1.)\n\n✔ The words System and in are defined in the Java API.\n\nTaken together,\
    \ the words System.in stand for the computer keyboard.\n\nIn later chapters, you\
    \ see things like new Scanner(new File(\"myData.txt\")). In these chapters, I\
    \ replace System.in with the words new File(\"myData.txt\") because I'm not getting\
    \ input from the keyboard. Instead, I'm getting input from a file on the computer's\
    \ hard drive.\n\n✔ The word keyboard doesn't come from the Java API.\n\nThe word\
    \ keyboard is a Barry Burd creation. Instead of keyboard, you can\n\nuse readingThingie\
    \ (or any other name you want to use as long as you use the name consistently).\
    \ So, if you want to be creative, you can write\n\n```\nScanner readingThingie\
    \ =\n    new Scanner(System.in);\n\nSystem.out.println\n    (readingThingie.nextLine());\n\
    ```\n\nThe revised Listing 5-1 (with reading Thingie instead of keyboard) compiles\
    \ and runs without a hitch.\n\n✔ The line import java.util.Scanner is an example\
    \ of an import declaration.\n\nAn optional import declaration allows you to abbreviate\
    \ names in the rest of your program. You can remove the import declaration from\
    \ Listing 5-1. But if you do, you must use the Scanner class's fully qualified\
    \ name throughout your code. Here's how:\n\n```\nclass EchoLine {\n\n    public\
    \ static void main\n        (String args[]) {\n\n        java.util.Scanner keyboard\n\
    \            = new java.util.Scanner\n                (System.in);\n\n       \
    \ System.out.println\n            (keyboard.nextLine());\n\n        keyboard.close();\n\
