    Chapter 8 has code to reverse the letters in a four-letter word that the user
    enters. In case you haven’t read Chapter 8 or you just don’t want to flip to it,
    here’s a quick recap of the code:


    ```

    c1 = keyboard.findWithinHorizon(".", 0).charAt(0);

    c2 = keyboard.findWithinHorizon(".", 0).charAt(0);

    c3 = keyboard.findWithinHorizon(".", 0).charAt(0);

    c4 = keyboard.findWithinHorizon(".", 0).charAt(0);


    System.out.print(c4);

    System.out.print(c3);

    System.out.print(c2);

    System.out.print(c1);

    ```


    The code is just dandy for words with exactly four letters, but how do you reverse
    a five-letter word? As the code stands, you have to add two new statements:


    ```

    c1 = keyboard.findWithinHorizon(".", 0).charAt(0);

    c2 = keyboard.findWithinHorizon(".", 0).charAt(0);

    c3 = keyboard.findWithinHorizon(".", 0).charAt(0);

    c4 = keyboard.findWithinHorizon(".", 0).charAt(0);

    c5 = keyboard.findWithinHorizon(".", 0).charAt(0);


    System.out.print(c5);

    System.out.print(c4);

    System.out.print(c3);

    System.out.print(c2);

    System.out.print(c1);

    ```


    What a drag! You add statements to a program whenever the size of a word changes!
    You remove statements when the input shrinks? That can’t be the best way to solve
    the problem. Maybe you can command a computer to add statements automatically.
    (But then again, maybe you can’t.)'
