  md: '# 2. In Eclipse''s main menu, choose File→New→File.


    Eclipse''s New File dialog box opens.


    # 3. In the File Name field, type the name of your new data file.


    You can type any name that your computer considers to be a valid filename. For
    this section''s example, I used the name rawData.txt, but other names, such as
    rawData.dat, rawData, or raw123.01.dataFile, are fine. I try to avoid troublesome
    names (including short, uninformative names and names containing blank spaces),
    but the name you choose is entirely up to you (and your computer''s operating
    system, and your boss''s whims, and your customer''s specifications).


    # 4. Click Finish.


    The file''s name appears in Eclipse''s Package Explorer. An empty editor (with
    the new file''s name on its tab) appears in Eclipse''s editor area.


    # 5. Type text in the editor.


    To create this section''s example, I typed the text 19.95 5, as shown in Figure
    13-4. To create your own example, type whatever text your program needs during
    its run.


    # Figure 13-4: Editing an input file.


    ![](img/f938eba5f15e231d828a6255e7ec5523_277_0.png)


    ![](img/f938eba5f15e231d828a6255e7ec5523_277_1.png)


    This section''s steps apply when you use Eclipse to create an input file. You
    can use other programs to create input files, such as Windows Notepad or Macintosh
    TextEdit. But if you do, you have to be careful about file formats and file name
    extensions. For example, to create a file named raw123.01.dataFile using Windows
    Notepad, type "raw123.01.dataFile" (with quotation marks) in the File Name field
    of the Save As dialog box. If you don''t surround the name with quotation marks,
    then Notepad might add .txt to the file''s name (turning raw123.01.dataFile into
    raw123.01.dataFile.txt). A similar issue applies to the Macintosh''s TextEdit
    program. By default, TextEdit adds the .rtf extension to each new file. To override
    the .rtf default for a particular file, select Format→Make Plain Text before saving
    the file. Then, when you save the file, TextEdit offers to add the .txt extension
    to the name of the file. In the Save As dialog box, if you don''t want the file''s
    name to end in .txt, uncheck the checkbox labeled If no extension is provided,
    use ".txt".'
