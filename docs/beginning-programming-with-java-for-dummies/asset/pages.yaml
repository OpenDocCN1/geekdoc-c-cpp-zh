    \ Downloads folder. Instead, you’ll find either a .tar file (because your web\
    \ browser uncompressed the .gz part) or an eclipse folder (because your web browser\
    \ uncompressed both the .tar and .gz parts).\n+   \n+     If you find a new .tar\
    \ file or .tar.gz file in your Downloads folder, double-click the file until you\
