    \ whether the condition is true or false. |\n| Missing curly braces | if (randomNumber\
    \ > 5) System.out.println(\"Y\"); else System.out.println(\"N\"); | The program\
    \ sometimes compiles without errors, but the program's run may not do what you\
    \ expect it to do. (So the bottom line is, don't omit the curly braces.) |\n\n\
    As you compose your code, it helps to think of an if statement as one indivisible\
    \ unit. Instead of typing the whole first line (condition and all), try typing\
    \ the if statement's skeletal outline.\n\n```\nif () {    //To do: Fill in the\
    \ condition.\n            //To do: Fill in SomeStatements.\n} else {\n       \
    \     //To do: Fill in OtherStatements.\n}\n```\n\nWith the entire outline in\
    \ place, you can start working on the items on your to-do list. When you apply\
    \ this kind of thinking to a compound statement, it's harder to make a mistake."
