    By default, Java''s Scanner class looks for blank spaces between input values.
    So this example''s rawData.txt file should contain 19.95 5, not 19.955 and not
    19.95,5.


    The Scanner class looks for any kind of whitespace between the values. These whitespace
    characters may include blank spaces, tabs, and newlines. So, for example, the
    rawData.txt file may contain 19.95 5 (with several blank spaces between 19.95
    and 5), or it may have 19.95 and 5 on two separate lines.


