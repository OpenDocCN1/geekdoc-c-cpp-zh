- pgno: 339
  md: "Each time through the loop, the counter goes down by one:\n\n```\nfor (int\
    \ roomNum = 9; roomNum >= 0; roomNum--)\n```\n\nThe loop keeps going as long as\
    \ the counter is greater than or equal to 0:\n\n```\nfor (int roomNum = 9; roomNum\
    \ >= 0; roomNum--)\n```\n\nThink through each of these three items, and you'll\
    \ write a perfect for loop.\n\n# Working with Arrays\n\nEarlier in this chapter,\
    \ a busload of loners showed up at your motel. When they finally left, you were\
    \ glad to get rid them, even if it meant having all your rooms empty for a while.\
    \ But now, another bus pulls into the parking lot. This bus has a sign that says\
    \ \"Gregarian Club.\" Out of the bus come 50 people, each more gregarious than\
    \ the next. Now everybody in your parking lot is clamoring to meet everyone else.\
    \ While they meet and greet, they're all frolicking toward the front desk, singing\
    \ the club's theme song. (Oh no! It's the Gregarian Chant!)\n\nThe first five\
    \ Gregarians all want Room 7. It's a tight squeeze, but you were never big on\
    \ fire codes, anyway. Next comes a group of three with a yen for Room 0. (They're\
    \ computer programmers, and they think the room number is cute.) Then there's\
    \ a pack of four Gregarians who want Room 3. (The in-room pool sounds attractive\
    \ to them.)\n\nWith all this traffic, you better switch on your computer. You\
