  md: "If it helps, think of the loop as if its text is shifted all around:\n\n```\n\
    ```java\n//This is NOT real code\nint count = 0\nfor count < 0 {\n    out.print(\"\
    I've chewed \");\n    out.print(count);\n    out.println(\" time(s).\");\n   \
    \ count++;\n}\n```\n```\n\nYou can’t write a real for statement this way. (The\
    \ compiler would throw code like this right into the garbage can.) Even so, this\
    \ is the order in which the parts of the for statement are executed.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_304_0.png)\n\
    \nThe first line of a for statement (the word for followed by stuff in parentheses)\
    \ isn’t a complete statement. So you almost never put a semicolon after the stuff\
    \ in parentheses. If you make a mistake and type a semicolon,\n\n```\n```java\n\
    // DON'T DO THIS:\nfor (int count = 0; count < 10; count++) {\n```\n```\n\nyou\
    \ usually put the computer into a do-nothing loop. The computer counts to itself\
    \ from 0 to 9. After counting, the computer executes whatever statements come\
    \ immediately after the open curly brace. (The loop ends at the semicolon, so\
    \ the statements after the open curly brace aren’t inside the loop.)\n\n# Initializing\
    \ a for loop\n\nLook at the first line of the for loop in Listing 15-1 and notice\
    \ the declaration `int count = 0`. That’s something new. When you create a for\
    \ loop, you can declare a variable (like count) as part of the loop initialization.\n\
    \nIf you declare a variable in the initialization of a for loop, you can’t use\
    \ that variable outside the loop. For example, in Listing 15-1, try putting `out.println(count);`\
    \ after the end of the loop:\n\n```\n```java\n//This code does not compile.\n\
    for (int count = 0; count < 10; count++) {\n    out.print(\"I've chewed \");\n\
    \    out.print(count);\n    out.println(\" time(s).\");\n}\n\nout.print(count);\
    \   //The count variable doesn't\n                    // exist here.\n```\n```"
