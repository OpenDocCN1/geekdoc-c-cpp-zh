  md: "# Figure 16-4\nThe bad room number 10 gets no response.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_332_0.png)\n\
    \n![](img/f938eba5f15e231d828a6255e7ec5523_332_1.png)\n\nIn Listing 16-3, I want\
