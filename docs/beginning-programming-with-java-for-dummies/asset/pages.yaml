  img_proc: true
- pgno: 291
  md: "Listing 14-1 does almost the same thing as its forerunner in Listing 12-5.\
    \ The only difference is that the code in Listing 14-1 doesn’t interact with the\
    \ user. Instead, the code in Listing 14-1 interacts with disk files.\n\n# Running\
    \ your code\n\nHere’s how you run the code in Listing 14-1:\n\n+   1. **Create\
    \ a file named `email.txt` in your Eclipse project directory.**\n+      In the\
    \ `email.txt` file, put just one e-mail address. Any address will do, as long\
    \ as the address contains an @ sign.\n+   \n+   2. **Put the `ListOneUsername.java`\
    \ file (the code from Listing 14-1) in your project’s `src/` (default package)\
    \ directory.**\n+   \n+   3. **Run the code in Listing 14-1.**\n+      When you\
    \ run the code, you see nothing interesting in the Console view. What a pity!\n\
    +   \n+   4. **View the contents of the `usernames.txt` file.**\n+      If your\
    \ `email.txt` file contains John@BurdBrain.com, the `usernames.txt` file contains\
    \ John.\n\nFor more details on any of these steps, see the discussion accompanying\
    \ Listings 13-2, 13-3, and 13-4 in Chapter 13. (The discussion is especially useful\
    \ if you don’t know how to view the `usernames.txt` file’s contents.)\n\n# Creating\
    \ Useful Code\n\nThe previous section describes a network administrator’s problem\
    \ — creating a file filled with usernames from a file filled with e-mail addresses.\
    \ The code in Listing 14-1 solves part of the problem — it extracts just one e-mail\
    \ address. That’s a good start, but to get just one username, you don’t need a\
    \ computer program. A pencil and paper does the trick.\n\nSo don’t keep the network\
    \ administrator waiting any longer. In this section, you develop a program that\
    \ processes dozens, hundreds, and even thousands of e-mail addresses from a file\
    \ on your hard drive.\n\nFirst, you need a strategy to create the program. Take\
    \ the statements in Listing 14-1 and run them over and over again. Better yet,\
    \ have the statements run themselves over and over again. Fortunately, you already\
    \ know how to do something over and over again: You use a loop. (See Chapter 12\
    \ for the basics on loops.)"
  merge: -1
  img_proc: true
- pgno: 292
  md: "So here’s the strategy: Take the statements in Listing 14-1 and enclose them\
    \ in a larger loop:\n\n```\n```text\nwhile (not at the end of the email.txt file)\
    \ {\n    Execute the statements in Listing 14-1\n}\n```\n```\n\nLooking back at\
    \ the code in Listing 14-1, you see that the statements in that code have a while\
    \ loop of their own. So this strategy involves putting one loop inside another\
    \ loop:\n\n```\n```text\nwhile (not at the end of the email.txt file) {\n    //Blah-blah\n\
    \n    while (symbol != '@') {\n        //Blah-blah-blah\n    }\n\n    //Blah-blah-blah-blah\n\
    }\n```\n```\n\nBecause one loop is inside the other, they’re called nested loops.\
    \ The old loop (the symbol != '@' loop) is the inner loop. The new loop (the end-of-file\
    \ loop) is called the outer loop.\n\n# Checking for the end of a file\n\nNow all\
    \ you need is a way to test the loop’s condition. How do you know when you’re\
    \ at the end of the email.txt file?\n\n**The answer comes from Java’s Scanner\
    \ class.** This class’s hasNext method answers true or false to the following\
    \ question:\n\nDoes the email.txt file have anything to read in it (beyond what\
    \ you’ve already read)?\n\nIf the program’s findWithinHorizon calls haven’t gobbled\
    \ up all the characters in the email.txt file, the value of diskScanner.hasNext()\
    \ is true. So, to keep looping while you’re not at the end of the email.txt file,\
    \ you do the following:\n\n```\n```text\nwhile (diskScanner.hasNext()) {\n   \
    \ Execute the statements in Listing 14-1\n}\n```\n```"
