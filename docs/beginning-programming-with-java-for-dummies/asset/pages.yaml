- pgno: 303
  md: "The computer jumps to whatever statement comes immediately after the for statement.\
    \ In Listing 15-1, the computer prints 10 times! Hooray! I can swallow! The whole\
    \ process is illustrated in Figure 15-2.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_303_0.png)\n\
    \nFigure 15-2:\nThe action of the for loop in Listing 15-1.\n\n# The anatomy of\
    \ a for statement\n\nA typical for statement looks like this:\n\n```\nfor (Initialization;\
    \ Condition; Update) {\n    Statements\n}\n```\n\nAfter the word for, you put\
    \ three things in parentheses: an initialization, a condition, and an update.\n\
    \nEach of the three items in parentheses plays its own distinct role:\n\n+   -\
    \ Initialization: The initialization is executed once, when the run of your program\
    \ first reaches the for statement.\n+   - Condition: The condition is tested several\
    \ times (at the start of each iteration).\n+   - Update: The update is also evaluated\
    \ several times (at the end of each iteration)."
