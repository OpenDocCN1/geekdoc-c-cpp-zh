    \ 13-5. But in Figure 13-7, Windows Explorer shows the 13-02 folder, its src subfolder,\
    \ and its other subfolders named .settings and bin. (Mac users can see the same\
    \ subfolders in a Finder window.)\n\nThe src, bin and .settings folders contain\
    \ files of their own. But in Figure 13-7, the rawData.txt and cookedData.txt files\
    \ are immediately inside the 13-02 project folder. In other words, the rawData.txt\
    \ and cookedData.txt files live in the root of the 13-02 project folder.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_280_0.png)\n\
    \nWhen you run this section’s example, the rawData.txt file should be in the root\
    \ of the 13-02 project folder on your hard drive. That’s why, in Step 1 of the\
    \ “Creating an input file” section, I remind you to select the 13-02 project folder\
    \ and not the project’s src subfolder.\n\nFigure 13-7 shows input and output files\
    \ in the root of their Eclipse project. But in general, file locations can be\
    \ tricky, especially if you switch from Eclipse to an unfamiliar IDE. The general\
    \ rule (about putting input and output files immediately inside a project directory)\
    \ may not apply in other programming environments.\n\nSo here’s a trick you can\
    \ use: Whatever IDE you use (or even if you create Java programs without an IDE),\
    \ run this stripped-down version of the code in Listing 13-2:\n\n```\n```java\n\
    import java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\
    \nclass JustWrite {\n\n    public static void main(String args[])\n        throws\
    \ FileNotFoundException {\n\n        PrintStream diskWriter =\n            new\
