- pgno: 181
  md: 'Of course, the greater-than-or-equal-to comparison gets you only so far. Table
    8-1 shows you the operators you can use to compare things with one another.


    **Table 8-1 Comparison Operators**


    | Operator Symbol | Meaning | Example |

    |---|---|---|

    | == | is equal to | yourGuess == winningNumber |

    | != | is not equal to | 5 != numberOfCows |

    | < | is less than | strikes < 3 |

    | > | is greater than | numberOfBoxtops > 1000 |

    | <= | is less than or equal to | numberOfCows + numberOfBulls <= 5 |

    | >= | is greater than or equal to | gumballsPerKid >= 10 |


    With the operators in Table 8-1, you can compare both numbers and characters.


    ![](img/f938eba5f15e231d828a6255e7ec5523_181_0.png)


    Notice the double equal sign in the first row of Table 8-1. Don''t try to use
    a single equal sign to compare two values. The expression yourGuess = winningNumber
    (with a single equal sign) doesn''t compare yourGuess with winningNumber. Instead,
    yourGuess = winningNumber changes the value of yourGuess. (It assigns the value
    of winningNumber to the variable yourGuess.)


    You can compare other things (besides numbers and characters) with the == and
    != operators. But when you do, you have to be careful. For more information, see
    Chapter 18.


    # Comparing numbers


    Nothing is more humdrum than comparing numbers. "True or false? Five is greater
    than or equal to ten." False. Five is neither greater than nor equal to ten. See
    what I mean? Bo-ring.


    Comparing whole numbers is an open-and-shut case. But unfortunately, when you
    compare decimal numbers, there''s a wrinkle. Take a program for converting from
    Celsius to Fahrenheit. Wait! Don''t take just any such program; take the program
    in Listing 8-5.'
