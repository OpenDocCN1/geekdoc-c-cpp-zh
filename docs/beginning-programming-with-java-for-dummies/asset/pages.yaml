  md: "# Repeating Instructions Over and Over Again (Java while Statements)\n\nAs\
    \ luck would have it, you can do something that's even better. You can write a\
    \ statement once and tell the computer to execute the statement many times. How\
    \ many times? You can tell the computer to execute a statement as many times as\
    \ it needs to be executed.\n\nThat's the big idea. The rest of this chapter has\
    \ the details.\n\nHere's a simple dice game: Keep rolling two dice until you roll\
    \ 7 or 11. Listing 12-1 has a program that simulates the action in the game, and\
    \ Figure 12-1 shows two runs of the program.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_249_0.png)\n\
    \n# Listing 12-1: Roll 7 or 11\n\n```\nimport java.util.Random;\nimport static\
    \ java.lang.System.out;\n\nclass SimpleDiceGame {\n\n    public static void main(String\
    \ args[]) {\n        Random myRandom = new Random();\n        int die1 = 0, die2\
    \ = 0;\n\n        while (die1 + die2 != 7 && die1 + die2 != 11) {\n          \
    \  die1 = myRandom.nextInt(6) + 1;\n            die2 = myRandom.nextInt(6) + 1;\n\
    ```"
