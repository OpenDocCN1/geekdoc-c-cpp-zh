  md: "Using an array saves you from having to declare ten separate variables: `guestsIn0`,\
    \ `guestsIn1`, `guestsIn2`, and so on. To declare an array with ten values in\
    \ it, you can write two fairly short lines of code:\n\n```\nint guestsIn[];\n\
    guestsIn = new int[10];\n```\n\nYou can even squish these two lines into one longer\
    \ line:\n\n```\nint guestsIn[] = new int[10];\n```\n\nIn either of these code\
    \ snippets, notice the use of the number 10. This number tells the computer to\
    \ make the guestsIn array have ten components. Each component of the array has\
    \ a name of its own. The starting component is named guestsIn[0], the next is\
    \ named guestsIn[1], and so on. The last of the ten components is named guestsIn[9].\n\
    \n![](img/f938eba5f15e231d828a6255e7ec5523_336_0.png)\n\nIn creating an array,\
    \ you always specify the number of components. The array’s indices always start\
    \ with 0 and end with the number that’s one fewer than the total number of components.\
    \ For example, if your array has ten components (and you declare the array with\
    \ `new int[10]`), the array’s indices go from 0 to 9.\n\n# Storing values in an\
    \ array\n\nAfter you’ve created an array, you can put values into the array’s\
    \ components. For example, the guests in Room 6 are fed up with all those mint\
    \ candies that you put on peoples’ beds. So they check out, and Room 6 becomes\
    \ vacant. You should put the value 0 into the 6 component. You can do it with\
    \ this assignment statement:\n\n```\nguestsIn[6] = 0;\n```\n\nOn one weekday,\
    \ business is awful. No one’s staying at the motel. But then you get a lucky break.\
    \ A big bus pulls up to the motel. The side of the bus has a sign that says “Loners’\
    \ Convention.” Out of the bus come 25 people, each walking to the motel’s small\
    \ office, none paying attention to the others who were on the bus. Each person\
    \ wants a private room. Only 10 of them can stay at the Java Motel, but that’s\
    \ okay, because you can send the other 15 loners down the road to the old C-Side\
    \ Resort and Motor Lodge.\n\nAnyway, to register ten of the loners into the Java\
    \ Motel, you put one guest in each of your ten rooms. Having created an array,\
    \ you can take advantage of the array’s indexing and write a for loop, like this:\n\
    \n```\nfor (int roomNum = 0; roomNum < 10; roomNum++) {\n    guestsIn[roomNum]\
    \ = 1;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 337
  md: "This loop takes the place of ten assignment statements because the computer\
    \ executes the statement `guestsIn[roomNum] = 1` ten times. The first time around,\
    \ the value of roomNum is 0, so in effect, the computer executes\n\n```\nguestsIn[0]\
    \ = 1;\n```\n\nIn the next loop iteration, the value of roomNum is 1, so the computer\
    \ executes the equivalent of the following statement:\n\n```\nguestsIn[1] = 1;\n\
    ```\n\nDuring the next iteration, the computer behaves as if it’s executing\n\n\
    ```\nguestsIn[2] = 1;\n```\n\nAnd so on. When roomNum gets to be 9, the computer\
    \ executes the equivalent of the following statement:\n\n```\nguestsIn[9] = 1;\n\
    ```\n\nNotice that the loop’s counter goes from 0 to 9. Compare this with Figure\
    \ 16-6 and remember that the indices of an array go from 0 to one fewer than the\
    \ number of components in the array. Looping with room numbers from 0 to 9 covers\
    \ all the rooms in the Java Motel.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_337_0.png)\n\
    \nWhen you work with an array, and you step through the array’s components using\
    \ a `for` loop, you normally start the loop’s counter variable at 0. To form the\
    \ condition that tests for another iteration, you often write an expression like\
    \ `roomNum < arraySize`, where `arraySize` is the number of components in the\
    \ array.\n\n# Creating a report\n\nThe code to create the report in Figure 16-5\
    \ is shown in Listing 16-4. This new program uses the idea in the world’s ugliest\
    \ code (the code from several pages back with variables `guestsIn0`, `guestsIn1`,\
    \ and so on). But instead of having ten separate variables, Listing 16-4 uses\
    \ an array.\n\n# Listing 16-4:  Traveling Through Data Both Forward and Backward\n\
    \n```\nimport java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    \nclass VacanciesInReverse {\n\n    public static void main(String args[])\n \
    \       throws FileNotFoundException {\n```"
