- pgno: 188
  md: '![](img/f938eba5f15e231d828a6255e7ec5523_188_0.png)


    Under the hood, the letters A through Z are stored with numeric codes 65 through
    90. The letters a through z are stored with codes 97 through 122. That''s why
    each uppercase letter is "less than" any of the lowercase letters.


    # The Remaining Primitive Types


    In Chapter 7, I tell you that Java has eight primitive types, but Table 7-1 lists
    only six out of eight types. Table 8-2 describes the remaining two types — the
    types char and boolean. Table 8-2 isn''t too exciting, but I can''t just leave
    you with the incomplete story in Table 7-1.


    | Table 8-2 | Java''s Primitive Non-numeric Types |

    | Type Name | Range of Values |

    | Character Type | |

    | char | Thousands of characters, glyphs, and symbols |

    | Logical Type | |

    | boolean | Only true or false |


    ![](img/f938eba5f15e231d828a6255e7ec5523_188_1.png)


    If you dissect parts of the Java Virtual Machine, you find that Java considers
    char to be a numeric type. That''s because Java represents characters with something
    called Unicode — an international standard for representing alphabets of the world''s
    many languages. For example, the Unicode representation of an uppercase letter
    C is 67. The representation of a Hebrew letter aleph is 1488. And (to take a more
    obscure example) the representation for the voiced retroflex approximant in phonetics
    is 635. But don''t worry about all this. The only reason I''m writing about the
    char type''s being numeric is to save face among my techie friends.


    ![](img/f938eba5f15e231d828a6255e7ec5523_188_2.png)


    After looking at Table 8-2, you may be wondering what a glyph is. (In fact, I''m
    proud to be writing about this esoteric concept, whether you have any use for
    the information or not.) A glyph is a particular representation of a character.
    For example, a and a are two different glyphs, but both of these glyphs represent
    the same lowercase letter of the Roman alphabet. (Because these two glyphs have
    the same meaning, the glyphs are called allographs. If you want to sound smart,
    find a way to inject the words glyph and allograph into a casual conversation!)'
