    \ with nothing inside the parentheses, you get an object that can mold numbers\
    \ into U.S. currency amounts. Listing 18-7 has an example.\n\n# Listing 18-7:\
    \ The Right Way to Display a Dollar Amount\n\n```\n```java\nimport java.text.NumberFormat;\n\
