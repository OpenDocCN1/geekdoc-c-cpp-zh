  md: "You can try to imitate the following informal pattern:\n\n```\n```\nInput a\
    \ character.\nIs that character the same as an @ sign?\nIf not, perform a loop\
    \ iteration.\nPrint the character.\n```\n```\n\nThe problem is, you can't put\
    \ a while loop's test in the middle of the loop:\n\n```\n```\n//This code doesn't\
    \ work\n//  the way you want it to work:\n{\nsymbol = keyboard.findWithinHorizon(\"\
    .\",0).charAt(0);\nwhile (symbol != '@')\n    System.out.print(symbol);\n}\n```\n\
    ```\n\nYou can't sandwich a while statement's condition between two of the statements\
    \ that you intend to repeat. So what can you do? You need to follow the flow in\
    \ Figure 12-11. Because every while loop starts with a test, that's where you\
