  md: "Again, I ask myself where this statement belongs in the code. How many times\
    \ should the computer execute this assignment statement? Once at the start of\
    \ the program? Once at the end of the run? Repeatedly?\n\nThe computer should\
    \ repeatedly add a card’s value to the running total. In fact, the computer should\
    \ add to the total each time a card gets drawn. So the preceding assignment statement\
    \ should be inside the while loop, right alongside the statement that gets a new\
    \ card value:\n\n```\ncard = myRandom.nextInt(10) + 1;\ntotal += card;\n```\n\n\
    With this revelation, I’m ready to see the complete program. The code is in Listing\
    \ 12-2, and two runs of the code are shown in Figure 12-5.\n\n# Listing 12-2:\
    \ A Simplified Version of the Game Twenty-One\n\n```\nimport java.util.Random;\n\
    \nclass PlayTwentyOne {\n\n    public static void main(String args[]) {\n    \
    \    Random myRandom = new Random();\n        int card, total = 0;\n\n       \
    \ System.out.println(\"Card    Total\");\n\n        while (total < 21) {\n   \
    \         card = myRandom.nextInt(10) + 1;\n            total += card;\n\n   \
    \         System.out.print(card);\n            System.out.print(\"        \");\n\
    \            System.out.println(total);\n        }\n\n        if (total == 21)\
    \ {\n            System.out.println(\"You win :-)\");\n        } else {\n    \
    \        System.out.println(\"You lose :-(\");\n        }\n    }\n}\n```\n\nIf\
    \ you’ve read this whole section, you’re probably exhausted. Creating a loop can\
    \ be a lot of work. Fortunately, the more you practice, the easier it becomes."
