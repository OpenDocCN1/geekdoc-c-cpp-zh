  md: 'In Eclipse''s editor, you hover over the leftmost marker. You see the messages
    shown in Figure 5-10.


    Figure 5-10:

    Three error messages.


    ![](img/f938eba5f15e231d828a6255e7ec5523_130_0.png)


    Eclipse is confused because the call to System.out.println is completely out of
    place. Eclipse displays three messages — something about println, something about
    the parenthesis, and something very cryptic concerning misplaced constructs. None
    of these messages addresses the cause of the problem. Eclipse is trying to make
    the best of a bad situation, but at this point, you shouldn''t believe a word
    that Eclipse says.


    Computers aren''t smart animals, and if someone programs Eclipse to say misplaced
    construct(s), that''s exactly what Eclipse says. (Some people say that computers
    make them feel stupid. For me, it''s the opposite. A computer reminds me how dumb
    a machine can be and how smart a person can be. I like that.)


    So when you see a bunch of error messages, read each error message carefully.
    Ask yourself what you can learn from each message. But don''t take each message
    as the authoritative truth. When you''ve exhausted your efforts with Eclipse''s
    messages, return to your efforts to stare carefully at the code.


    ![](img/f938eba5f15e231d828a6255e7ec5523_130_1.png)


    If you get more than one error message, always look carefully at each message
    in the bunch. Sometimes a very helpful message hides among a bunch of not-so-helpful
    messages.


    # Misspelling words (and other missteps)


    You''ve found an old family recipe for deviled eggs (one of my favorites). You
    follow every step as carefully as you can, but you leave out the salt because
    of your grandmother''s high blood pressure. You hand your grandmother an egg (a
    finished masterpiece). "Not enough pepper," she says, and she walks away.


    The next course is beef bourguignon. You take an unsalted slice to dear old Granny.
    "Not sweet enough," she groans, and she leaves the room. "But that''s impossible,"
    you think. "There''s no sugar in beef bourguignon. I left out the salt." Even
    so, you go back to the kitchen and prepare mashed potatoes. You use unsalted butter,
    of course. "She''ll love it this time," you think.'
