- pgno: 192
  md: '# Chapter 9


    # Forks in the Road


    # In This Chapter


    +   - Writing statements that choose between alternatives

    +   - Putting statements inside one another

    +   - Writing several kinds of decision-making statements


    Here''s an excerpt from *Beginning Programming with Java For Dummies*, 4th Edition,
    Chapter 8:


    > If you''re trying to store words or sentences (not just single letters), then
    you need to use something called a String.


    This excerpt illustrates two important points: First, you may have to use something
    called a String. Second, your choice of action can depend on something being true
    or false.


    If it''s true that you''re trying to store words or sentences, you need to use
    something called a String.


    This chapter deals with decision-making, which plays a fundamental role in the
    creation of instructions. With the material in this chapter, you expand your programming
    power by leaps and bounds.


    # Decisions, Decisions!


    Picture yourself walking along a quiet country road. You''re enjoying a pleasant
    summer day. It''s not too hot, and a gentle breeze from the north makes you feel
    fresh and alert. You''re holding a copy of this book, opened to Chapter 9. You
    read the paragraph about storing words or sentences, and then you look up.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'You see a fork in the road. You see two signs — one pointing to the right;
    the other pointing to the left. One sign reads, “Storing words or sentences? True.”
    The other sign reads, “Storing words or sentences? False.” You evaluate the words-or-sentences
    situation and march on, veering right or left depending on your software situation.
    A diagram of this story is shown in Figure 9-1.


    ![](img/f938eba5f15e231d828a6255e7ec5523_193_0.png)


    # Figure 9-1:

    Which way to go?


    Life is filled with forks in the road. Take an ordinary set of directions for
    heating up a frozen snack:


    +   **Microwave cooking directions:**

    +   - Place on microwave-safe plate.

    +   - Microwave on high for 2 minutes.

    +   - Turn product.

    +   - Microwave on high for 2 more minutes.


    +   **Conventional oven directions:**

    +   - Preheat oven to 350 degrees.

    +   - Place product on baking sheet.

    +   - Bake for 25 minutes.


    Again, you choose between alternatives. If you use a microwave oven, do this.
    Otherwise, do that.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "In fact, it's hard to imagine useful instructions that don't involve choices.\
    \ If you're a homeowner with two dependents earning more than $30,000 per year,\
    \ check here. If you didn't remember how to use curly braces in Java programs,\
    \ see Chapter 4. Did the user correctly type his password? If yes, then let the\
    \ user log in; if no, then kick the bum out. If you think the market will go up,\
    \ then buy stocks; otherwise, buy bonds. And if you buy stocks, which should you\
    \ buy? And when should you sell?\n\n# Making Decisions (Java if Statements)\n\n\
    When you work with computer programs, you make one decision after another. Almost\
    \ every programming language has a way of branching in one of two directions.\
    \ In Java (and in many other languages), the branching feature is called an if\
    \ statement. Check out Listing 9-1 to see an if statement.\n\n# Listing 9-1: An\
    \ if Statement\n\n```\nif (randomNumber > 5) {\n    System.out.println(\"Yes.\
    \ Isn't it obvious?\");\n} else {\n    System.out.println(\"No, and don't ask\
    \ again.\");\n}\n```\n\nTo see a complete program containing the code from Listing\
    \ 9-1, skip to Listing 9-2 (or, if you prefer, walk, jump, or run to Listing 9-2).\n\
    \nThe if statement in Listing 9-1 represents a branch, a decision, two alternative\
    \ courses of action. In plain English, this statement has the following meaning:\n\
    \n> If the randomNumber variable's value is greater than 5,\n>     display \"\
    Yes. Isn't it obvious?\" on the screen.\n> Otherwise,\n>     display \"No, and\
    \ don't ask again.\" on the screen.\n\nPictorially, you get the fork shown in\
    \ Figure 9-2.\n\n# Looking carefully at if statements\n\nAn if statement can take\
    \ the following form:\n\n```\nif (Condition) {\n    SomeStatements\n} else {\n\
    \    OtherStatements\n}\n```"
