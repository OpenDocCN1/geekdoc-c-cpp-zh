  md: "**Figure 15-5:**  \nA readable display of the data in Figure 15-5.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_308_0.png)\n\
    \nAs in some other examples, you decide which statements go where by asking yourself\
    \ how many times each statement should be executed. For starters, the display\
    \ in Figure 15-5 has 9 lines, and each line has 20 numbers:\n\n```\nfor (each\
    \ of 9 floors)\n    for (each of 20 rooms on a floor)\n        get a number from\
    \ the file and\n        display the number on the screen.\n```\n\nSo your program\
    \ has a for loop within a for loop — a pair of nested for loops.\n\nNext, you\
    \ notice how each line begins in Figure 15-5. Each line contains the word Floor,\
    \ followed by the floor number. Because this Floor display occurs only 9 times\
    \ in Figure 15-5, the statements to print this display belong in the *for each\
    \ of 9 floors* loop (and not in the *for each of 20 rooms* loop). The statements\
    \ should be before the *for each of 20 rooms* loop because this Floor display\
    \ comes once before each line's 20-number display:\n\n```\nfor (each of 9 floors)\n\
    \    display \"Floor\" and the floor number,\n    for (each of 20 rooms on a floor)\n\
    \        get a number from the file and\n        display the number on the screen.\n\
    ```\n\nYou're almost ready to write the code. But there's one detail that's easy\
    \ to forget. (Well, it's a detail that I always forget.) After displaying 20 numbers,\
    \ the program advances to a new line. This new-line action happens only 9 times\
    \ during the run of the program, and it always happens after the program displays\
    \ 20 numbers:\n\n```\nfor (each of 9 floors)\n    display \"Floor\" and the floor\
    \ number,\n    for (each of 20 rooms on a floor)\n        get a number from the\
    \ file and\n        display the number on the screen,\n    Go to the next line.\n\
    ```"
