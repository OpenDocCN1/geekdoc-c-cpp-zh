- pgno: 105
  md: "# The declaration, the header, and the call\n\nIf you have a basic understanding\
    \ of what a method is and how it works (see preceding section), you can dig a\
    \ little deeper into some useful terminology:\n\n+   - If I'm being lazy, I refer\
    \ to the code in Listing 4-2 as a method. If I'm not being lazy, I refer to this\
    \ code as a method declaration.\n+   - The method declaration in Listing 4-2 has\
    \ two parts. The first line (the part with the name FixTheAlternator in it, up\
    \ to but not including the open curly brace) is called a method header. The rest\
    \ of Listing 4-2 (the part surrounded by curly braces) is a method body.\n+  \
    \ - The term method declaration distinguishes the list of instructions in Listing\
    \ 4-2 from the instruction in Listing 4-3, which is known as a method call.\n\n\
    For a handy illustration of all the method terminology, see Figure 4-5.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_105_0.png)\n\
    \nFigure 4-5:\nThe terminology describing methods.\n\n```\nvoid FixTheAlternator()\
    \ {\n  DriveInto(car, bay);\n  Lift(hood);\n  Get(wrench);\n  Loosen(alternatorBelt);\n\
    \  ...\n}\n```\n\n```\nFixTheAlternator(junkyOldFord);\n```\n\nA method's header\
    \ and body are like an entry in a dictionary. An entry doesn't really use the\
    \ word that it defines. Instead, an entry tells you what happens if and when you\
    \ use the word."
