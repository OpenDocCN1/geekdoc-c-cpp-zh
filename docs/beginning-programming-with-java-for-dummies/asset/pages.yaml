- pgno: 394
  md: "# Generating words randomly\n\nMost programs don't work correctly the first\
    \ time you run them, and some programs don't work without extensive trial and\
    \ error. This section's code is a case in point.\n\nTo write this section's code,\
    \ I needed a way to generate three-letter words randomly. After about a dozen\
    \ attempts, I got the code to work. But I didn't stop there. I kept working for\
    \ a few hours looking for a simple way to generate three-letter words randomly.\
    \ In the end, I settled on the following code (in Listing 19-3):\n\n```\nanAccount.lastName\
    \ = \"\" +\n    (char) (myRandom.nextInt(26) + 'A') +\n    (char) (myRandom.nextInt(26)\
    \ + 'a') +\n    (char) (myRandom.nextInt(26) + 'a');\n```\n\nThis code isn't simple,\
    \ but it's not nearly as bad as my original working version. Anyway, here's how\
    \ the code works:\n\n+   - **Each call to** `myRandom.nextInt(26)` **generates\
    \ a number from 0 to 25.**\n+   \n+   - **Adding 'A' gives you a number from 65\
    \ to 90.**\n\nTo store a letter 'A', the computer puts the number 65 in its memory.\
    \ That's why adding 'A' to 0 gives you 65 and why adding 'A' to 25 gives you 90.\
    \ (For more information on letters being stored as numbers, see the discussion\
    \ of Unicode characters at the end of Chapter 8.)\n\n+   - **Applying `(char)`\
    \ to a number turns the number into a char value.**\n\nTo store the letters 'A'\
    \ through 'Z', the computer puts the numbers 65 through 90 in its memory. So applying\
    \ `(char)` to a number from 65 to 90 turns the number into an uppercase letter.\
    \ For more information about applying things like `(char)`, see the discussion\
    \ of casting in Chapter 7.\n\nPause for a brief summary. The expression `(char)\
    \ (myRandom.nextInt(26) + 'A')` represents a randomly generated uppercase letter.\
    \ In a similar way, `(char) (myRandom.nextInt(26) + 'a')` represents a randomly\
    \ generated lowercase letter.\n\nWatch out! The next couple of steps can be tricky.\n\
    \n+   - **Java doesn't allow you to assign a char value to a string variable.**\n\
    \nSo in Listing 19-3, the following statement would lead to a compiler error:\n\
    \n```\n//Bad statement:\nanAccount.lastName = (char) (myRandom.nextInt(26) + 'A');\n\
    ```\n\n+   - **In Java, you can use a plus sign to add a char value to a string.\
    \ When you do, the result is a string.**\n\nSo `\"\" + (char) (myRandom.nextInt(26)\
    \ + 'A')` is a string containing one randomly generated uppercase character. And\
    \ when you add `(char) (myRandom.nextInt(26) + 'a')` onto the end of that string,\
    \ you get another string — a string containing two randomly generated characters.\
    \ Finally, when you add another `(char)`"
