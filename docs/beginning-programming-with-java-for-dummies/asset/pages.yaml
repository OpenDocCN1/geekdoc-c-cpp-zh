- pgno: 200
  md: 'No problem! None at all! You’ll display an answer randomly. The user won’t
    know the difference. (Dah, hah!) You can do this as long as you can generate random
    numbers. The numbers from 1 to 10 will do just fine.


    In Listing 9-2, the stuff about Random and myRandom looks very much like the familiar
    Scanner code. From a beginning programmer’s point of view, Random and Scanner
    work almost the same way. Of course, there’s an important difference. A call to
    the Random class’s `nextInt(10)` method doesn’t fetch anything from the keyboard.
    Instead, this `nextInt(10)` method gets a number out of the blue.


    The name Random is defined in the Java API. The call to `myRandom.nextInt(10)`
    in Listing 9-2 gets a number from 0 to 9. Then my code adds 1 (making a number
    from 1 to 10) and assigns that number to the variable `randomNumber`. When that’s
    done, you’re ready to answer the user’s question.


    In Java’s API, the word Random is the name of a Java class, and `nextInt` is the
    name of a Java method. For more information on the relationship between classes
    and methods, see Chapters 17, 18, and 19.


    # 4. Answer yes or no.


    Calling `myRandom.nextInt(10)` is like spinning a wheel on a TV game show. The
    wheel has slots numbered 1 to 10. The `if` statement in Listing 9-2 turns your
    number into a yes or no alternative. If you roll a number that’s greater than
    5, the program answers yes. Otherwise (if you roll a number that’s less than or
    equal to 5), the program answers no.


    You can trust me on this one. I’ve made lots of important decisions based on my
    AnswerYesOrNo program.


    # Indenting if statements in your code


    Notice how, in Listing 9-2, the `println` calls inside the `if` statement are
    indented. Strictly speaking, you don’t have to indent the statements that are
    inside an `if` statement. For all the compiler cares, you can write your whole
    program on a single line or place all your statements in an artful, misshapen
    zigzag. The problem is, if you don’t indent your statements in some logical fashion,
    then neither you nor anyone else can make sense of your code. In Listing 9-2,
    the indenting of the `println` calls helps your eyes (and brain) see quickly that
    these statements are subordinate to the overall `if/else` flow.


    In a small program, unindented or poorly indented code is barely tolerable. But
    in a complicated program, indentation that doesn’t follow a neat, logical pattern
    is a big, ugly nightmare.


    Always indent your code to make the program’s flow apparent at a glance.


    ![](img/f938eba5f15e231d828a6255e7ec5523_200_0.png)


    ![](img/f938eba5f15e231d828a6255e7ec5523_200_1.png)'
