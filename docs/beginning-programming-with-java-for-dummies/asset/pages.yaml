  md: "# Versatile looping statements\n\nIf you were stuck on a desert island with\
    \ only one kind of loop, what kind would you want to have? The answer is, you\
    \ can get along with any kind of loop. The choice between a while loop and a for\
    \ loop is about the code's style and efficiency. It's not about necessity.\n\n\
    Anything that you can do with a for loop, you can do with a while loop as well.\
    \ Consider, for example, the for loop in Listing 15-1. Here's how you can achieve\
    \ the same effect with a while loop:\n\n```\n```java\nint count = 0;\nwhile (count\
    \ < 10) {\n    out.print(\"I've chewed \");\n    out.print(count);\n    out.println(\"\
    \ time(s).\");\n    count++;\n}\n```\n```\n\nIn the while loop, you have explicit\
    \ statements to declare, initialize, and increment the count variable.\n\nThe\
    \ same kind of trick works in reverse. Anything that you can do with a while loop,\
    \ you can do with a for loop as well. But turning certain while loops into for\
    \ loops seems strained and unnatural. Consider a while loop from Listing 12-2:\n\
    \n```\n```java\nwhile (total < 21) {\n    card =\n        myRandom.nextInt(10)\
    \ + 1;\n```\n```\n\n```\n```java\n    total += card;\n    System.out.print(card);\n\
    \    System.out.print(\" \");\n    System.out.println(total);\n}\n```\n```\n\n\
    Turning this loop into a for loop means wasting most of the stuff inside the for\
    \ loop's parentheses:\n\n```\n```java\nfor ( ; total < 21 ; ) {\n    card =\n\
    \        myRandom.nextInt(10) + 1;\n    total += card;\n    System.out.print(card);\n\
    \    System.out.print(\" \");\n    System.out.println(total);\n}\n```\n```\n\n\
    The preceding for loop has a condition, but it has no initialization and no update.\
    \ That's okay. Without an initialization, nothing special happens when the computer\
    \ first enters the for loop. And without an update, nothing special happens at\
    \ the end of each iteration. It's strange, but it works.\n\nUsually, when you\
    \ write a for statement, you're counting how many times to repeat something. But,\
    \ in truth, you can do just about any kind of repetition with a for statement.\n\
    \nA run of the code in Listing 15-2 looks exactly like the run for Listing 15-1.\
    \ The run is pictured in Figure 15-1. Unlike its predecessor, Listing 15-2 enjoys\
    \ the luxury of using the count variable to display the number 10. It can do this\
    \ because in Listing 15-2, the count variable belongs to the entire main method,\
    \ and not to the for loop alone.\n\nNotice the words for (count = 0 in Listing\
    \ 15-2. Because count is declared before the for statement, you don't declare\
    \ count again in the for statement's initialization. I tried declaring count twice,\
    \ as in the following code:"
