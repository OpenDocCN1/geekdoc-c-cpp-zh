- pgno: 41
  md: '# Getting This Book''s Sample Programs


    To get copies of this book''s sample programs, visit http://allmycode.com/BeginProg
    and click the link to download the programs in this book. Save the download file
    (BeginProgJavaDummies4.zip) to your computer''s hard drive.


    ![](img/f938eba5f15e231d828a6255e7ec5523_41_0.png)


    In some cases, you click a download link, but your web browser doesn''t offer
    you the option to save a file. If this happens to you, right-click the link (or
    control-click on a Mac). In the resulting context menu, select Save Target As,
    Save Link As, Download Linked File As, or a similarly labeled menu item.


    Most web browsers save files to a Downloads directory on your computer''s hard
    drive. But your browser may be configured a bit differently. One way or another,
    make note of the folder containing the downloaded BeginProgJavaDummies4.zip file.


    # Compressed archive files


    When you visit http://allmycode.com/BeginProg and you download this book''s Java
    examples, you download a file named BeginProgJavaDummies4.zip. A .zip file is
    a single file that encodes a bunch of smaller files and folders. So, for example,
    my BeginProgJavaDummies4.zip file encodes folders named 06-01, 06-02, and so on.
    The 06-02 folder contains some subfolders, which in turn contain files. (The folder
    named 06-02 contains the code in Listing 6-2 — the second listing in Chapter 6.)


    BeginProgJavaDummies4.zip file, your hard drive has folders named 06-01, 06-02,
    with subfolders named src and bin, which in turn contain files named SnitSoft.java,
    SnitSoft.class, and so on.


    A .zip file is an example of a compressed archive file. Some other examples of
    compressed archives include .tar.gz files, .rar files, and .cab files. Uncompressing
    a file means extracting the original files stored inside the big archive file.
    (For a .zip file, another word for "uncompressing" is "unzipping.") Uncompressing
    normally recreates the folder structure encoded in the archive file. So, after
    uncompressing my


    When you download BeginProgJavaDummies4.zip, your web browser may uncompress the
    file automatically for you. If not, you can see the .zip file''s contents by double-clicking
    the file''s icon. (In fact, you can copy the file''s contents and perform some
    other file operations after double-clicking the file''s icon.) One way or another,
    don''t worry about uncompressing my BeginProgJavaDummies4.zip file. When you follow
    this chapter''s instructions, you import the contents of my BeginProgJavaDummies4.zip
    file into the Eclipse IDE. And behind the scenes, Eclipse''s import process uncompresses
    the .zip file.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Setting Up Java


    You can get the latest, greatest versions of Java by visiting www.oracle.com/technetwork/java/javase/downloads.
    Look for the newest available version of the JDK. Select a version that runs on
    your computer''s operating system. Figure 2-1 shows me clicking a Download JDK
    button (circa March 2014) at the Oracle website.


    ![](img/f938eba5f15e231d828a6255e7ec5523_42_0.png)


    Figure 2-1: Getting the Java JDK.


    If you can''t identify the most appropriate Java version or if you want to know
    what the acronyms JRE and JDK stand for, see the sidebar entitled "Eenie, meenie,
    miney mo."'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'After you accept a license agreement and click a link to a Java installation
    file, your computer does one of two things:


    +   - Downloads and installs Java on your system.

    +   - Downloads the Java installation file and saves the file on your computer''s
    hard drive.


    If the installation begins on its own, follow the instructions, answer "Yes" to
    any prompts, and (unless you have good reason to do otherwise) accept the defaults.
    If the installation doesn''t begin on its own, start the installation by double-clicking
    the downloaded installation file.


    # Eenie, meenie, miney mo


    The Java Standard Edition download page (www.oracle.com/technetwork/java/javase/downloads)
    has many options. If you''re not familiar with these options, the page can be
    intimidating. Here are some of the choices on the page:


    # Word length: 32-bit or 64-bit


    You may have to choose between links labeled for 32-bit systems and links labeled
    for 64-bit systems. If you don''t know which to choose, start by trying the 32-bit
    version. (For more information about 32-bit systems and 64-bit systems, see the
    "How many bits does your computer have?" sidebar.)


    # Java version number


    (J2SE 1.2). Yes, the "Java 2" numbering overlaps partially with the "1.x" numbering.
    Next come versions 1.3 and 1.4. After version 1.4.1 comes version 1.4.2 (with
    intermediate stops at versions like 1.4.1_02). After 1.4.2_06, the next version
    is version 1.5, which is also known as version 5.0. (That''s no misprint. Version
    5.0 comes immediately after the 1.4 versions.)


    # JDK versus JRE


    The download page offers you a choice between the JDK (Java Development Kit) and
    the JRE (Java Runtime Environment). The JDK download contains more stuff than
    the JRE download. The JRE includes'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'a Java Virtual Machine and the Application Programming Interface (refer to
    Chapter 1). The JDK includes everything in the JRE, and in addition, the JDK includes
    a Java compiler (again, refer to Chapter 1).


    The Eclipse IDE contains its own Java compiler. So, you can survive by downloading
    the smaller JRE (avoiding the big JDK download). But I recommend downloading the
    entire JDK. Why? Because you never know when another compiler (separate from Eclipse)
    will come in handy. Besides, the installation and configuration of Eclipse on
    a Mac is convoluted if you haven''t installed the full JDK. So, if you want to
    have a smooth ride, download the JDK instead of the JRE.


    By the way, another name for the JDK is the Java SDK — the Java Software Development
    Kit. Some people still use the SDK acronym, even though the folks at Oracle don''t
    use it anymore. (Actually, the original name was the JDK. Later, Sun Microsystems
    changed it to the SDK. A few years after that, the captains of Java changed back
    to the name JDK. This constant naming and renaming drives me crazy as an author.)


    # Java SE versus Java EE versus Java ME


    While you wander around, you may notice links labeled Java EE or Java ME. If you
    know what these are, and you know you need them, by all means, download these
    goodies. But if you''re not sure, bypass both the Java EE and the Java ME links.
    Instead, follow links to the Java SE (Java Standard Edition).


    The abbreviation Java EE stands for Java Enterprise Edition and Java ME stands
    for Java Micro Edition. The Enterprise Edition has software for large businesses,
    and the Micro Edition has software for handheld devices. (Google''s Android software
    bears


    a passing resemblance to Java''s Micro Edition, but in many ways, Android and
    Java ME are very different animals.)


    You don''t need the Java EE or the Java ME to run any of the examples in this
    book.


    # Additional Java-related software


    You can download Java alone, or you can download Java with Oracle''s NetBeans
    IDE. You can download a collection of demos and samples. You can probably even
    download Java with fries and a soft drink. You can download plenty of extra stuff,
    but in truth, all you need is the Java JDK.


    # Installation type


    You may be prompted to choose between online installation and offline installation.


    With the offline installation, you begin by downloading a large setup file. The
    file takes up lots of space on your hard drive (between 30MB and 150MB, depending
    on what you choose to download). If you ever need to install the JDK again, you
    have the file on your own computer. Until you want a newer version of the JDK,
    you don''t need to download the JDK again.


    Why would anyone want to install the same version of the JDK a second time? Typically,
    I have two reasons. Either I want to install the software on a second computer,
    or I mess something up and have to uninstall (and then reinstall) the software.


    With the online installation, you don''t download a big setup file. Instead, you
    download a teeny little setup file. Then you download (and discard) pieces of
    the big 30MB to 150MB file as you need them. Using online installation saves you
    many megabytes of hard drive space. But, if you want to install the same version
    of the JDK a second time, you have to redo the whole surf/click/download process.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/f938eba5f15e231d828a6255e7ec5523_45_0.png)


    If your computer runs Linux, the downloaded file might be a .tar.gz file. A .tar.gz
