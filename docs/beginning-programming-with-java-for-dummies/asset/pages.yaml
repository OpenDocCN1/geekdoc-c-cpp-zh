  md: '# # A quick look at Java’s disk access facilities


    Templates like the ones in Listings 13-3 and 13-4 are very nice. But knowing how
    the plates work is even better. Here are a few tid-bits describing the inner workings
    of Java’s disk access code.


    +   - A `PrintStream` is **something you can use for writing output.**


    A `PrintStream` is like a Scanner. The big difference is that a Scanner is for
    reading input and a `PrintStream` is for writing output. To see what I mean, look
    at Listing 13-2. Notice the similarity between the statements that use Scanner
    and the statements that use `PrintStream`.


    The word `PrintStream` is defined in the Java API.


    +   - In Listing 13-2, the expression `new File("rawData.txt")` **plays the same
    role that `System.in` plays in so many other programs.**


    Just as `System.in` stands for the computer’s keyboard, the expression `new File("rawData.txt")`
    stands for a file on your computer’s hard drive. When your computer calls `new
    File("rawData.txt")`, the computer creates something like `System.in`—something
    you can stuff inside the new `Scanner()` parentheses.


    The word `File` is defined in the Java API.


    +   - A `FileNotFoundException` is **something that may go wrong during an attempt
    to read input from a disk file (or an attempt to write output to a disk file).**


    Disk file access is loaded with pitfalls. Even the best programs run into disk
    access trouble occasionally. So to brace against such pitfalls, Java insists on
    your adding some extra words to your code.


    In Listing 13-2, the added words `throws FileNotFoundException` form a **throws
    clause**. A throws clause is a kind of disclaimer. Putting a throws clause in
    your code is like saying, “I realize that this code can run into trouble.”


    Of course, in the legal realm, you often have no choice about signing disclaimers.
    “If you don’t sign this disclaimer, then the surgeon won’t operate on you.” Okay,
    then I’ll sign it. The same is true with a Java throws clause. If you put things
    like `new PrintStream("cookedData.txt")` in your code, and you don’t add something
    like `throws FileNotFoundException`, then the Java compiler refuses to compile
    your code.


    So when do you need this `throws FileNotFoundException` clause, and when should
    you do without it? Well, having certain things in your code—things like `new PrintStream("cookedData.txt")`—forces
    you to create a throws clause. You can spend some time learning all about the
    kinds of things that demand throws clauses. But at this point, it’s better to
    concentrate on other programming issues. As a beginning Java programmer, the safest
    thing to do is to follow the templates in Listings 13-3 and 13-4.


    The word `FileNotFoundException` is . . . you guessed it . . . defined in the
    Java API.


    +   - **To create this chapter’s code, I made up the names** `diskScanner` **and**
    `diskWriter`.


    The words `diskScanner` and `diskWriter` don’t come from the Java API. In place
    of `diskScanner` and'
