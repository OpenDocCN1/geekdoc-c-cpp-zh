- pgno: 95
  md: '# The Elements in a Java Program


    That both English and Java are called languages is no coincidence. You use a language
    to express ideas. English expresses ideas to people, and Java expresses ideas
    to computers. What''s more, both English and Java have things like words, names,
    and punctuation. In fact, the biggest difference between the two languages is
    that Java is easier to learn than English. (If English were easy, then computers
    would understand English. Unfortunately, they can''t.)


    Take an ordinary English sentence and compare it with the code in Listing 4-1.
    Here''s the sentence:


    Suzanne says "eh" because, as you know, she lives in Canada.


    In your high school grammar class, you worried about verbs, adjectives, and other
    such things. But in this book, you''ll think in terms of keywords and identifiers,
    as summarized in Figure 4-2.


    ![](img/f938eba5f15e231d828a6255e7ec5523_95_0.png)


    Suzanne''s sentence has all kinds of things in it. They''re the same kinds of
    things that you find in a computer program. So here''s the plan: Compare the elements
    in Figure 4-1 with similar elements in Listing 4-1. You already understand English,
    so you use this understanding to figure out some new things about Java.


    But first, here''s a friendly reminder: In the next several paragraphs, I draw
    comparisons between English and Java. As you read these paragraphs, it''s important
    to keep an open mind. For example, in comparing Java with English, I may write
    that "names of things aren''t the same as dictionary words." Sure, you can argue
    that some dictionaries list proper nouns and that some people have first names
    like Hope, Prudence, and Spike, but please don''t. You''ll get more out of the
    reading if you avoid nitpicking. Okay? Are we still friends?'
  merge: -1
  img_proc: true
- pgno: 96
  md: "# Keywords\n\nA keyword is a dictionary word — a word that's built right into\
    \ a language.\n\nIn Figure 4-2, a word like \"says\" is a keyword because \"says\"\
    \ plays the same role whenever it's used in an English sentence. The other keywords\
    \ in the Suzanne sentence are \"because,\" \"as,\" \"you,\" \"know,\" \"she,\"\
    \ \"lives,\" and \"in.\"\n\nComputer programs have keywords, too. In fact, the\
    \ program in Listing 4-1 uses four of Java's keywords (shown in bold):\n\n```\n\
    class ThingsILike {\n    public static void main(String args[]) {\n```\n\nEach\
    \ Java keyword has a specific meaning — a meaning that remains unchanged from\
    \ one program to another. For example, whenever I write a Java program, the word\
    \ public always signals a part of the program that's accessible to any other piece\
    \ of code.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_96_0.png)\n\nThe java proGRAMMing\
    \ lanGUage is case-sensitive. ThIs MEans that if you change a lowerCASE LETTer\
    \ in a WORD TO AN UPPercase letter, you chANge the wORD's MEANing. ChangING CASE\
    \ CAN MakE the enTIRE WORD GO FROM BeiNG MEANINGFul to beING MEaningless. In Listing\
    \ 4-1, you can't replace public with Public. If you do, the WHOLE PROGRAM STOPS\
    \ WORKING.\n\nThis chapter has little or no detail about the meanings of the keywords\
    \ class, public, static, and void. You can peek ahead at the material in other\
    \ chapters, but you can also get along by cheating. When you write a program,\
    \ just start with\n\n```\nclass SomethingOrOther {\n```\n\nand then paste the\
    \ text\n\n```\npublic static void main(String args[]) {\n```\n\ninto your code.\
    \ In your first few programs, this strategy serves you well.\n\nTable 4-1 has\
    \ a complete list of Java keywords."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Table 4-1 Java Keywords


    | abstract | continue | for | new | switch |

    | assert | default | goto | package | synchronized |

    | boolean | do | if | private | this |

    | break | double | implements | protected | throw |

    | byte | else | import | public | throws |

    | case | enum | instanceof | return | transient |

    | catch | extends | int | short | try |

    | char | final | interface | static | void |

    | class | finally | long | strictfp | volatile |

    | const | float | native | super | while |


    ![](img/f938eba5f15e231d828a6255e7ec5523_97_0.png)


    In Java, the words true, false, and null have specific meanings. Like the keywords
    in Table 4-1, you can''t use true, false, and null to mean anything other than
    what they normally mean in a Java program. But for reasons that concern only the
    fussiest Java experts, true, false, and null are not called Java keywords. One
    way or another, if you scribble the words true, false, and null into Table 4-1,
    you''ll be okay.


    Here''s one thing to remember about keywords: In Java, each keyword has an official,
    predetermined meaning. The people at Oracle, who have the final say on what constitutes
    a Java program, created all of Java''s keywords. You can''t make up your own meaning
    for any of the Java keywords. For example, you can''t use the word public in a
    calculation:


    ```

    ```java

    //This is BAD, BAD CODE:

    public = 6;

    ```

    ```


    If you try to use a keyword this way, then the compiler displays an error message
    and refuses to translate your source code. It works the same way in English. Have
    a baby and name it "Because."


    > > “Let’s have a special round of applause for tonight’s master of ceremonies
    — Because O. Borel.”


    You can do it, but the kid will never lead a normal life.


    ![](img/f938eba5f15e231d828a6255e7ec5523_97_1.png)


    Despite my ardent claims in this section, two of Java''s keywords have no meaning
    in a Java program. Those keywords — const and goto — are reserved for non-use
    in Java. If you try to create a variable named goto, Eclipse displays an Invalid
    VariableDeclaratorId error message. The creators of Java figure that, if you use
    either of the words const or goto in your code, you should be told politely to
    move to the C++ programmers'' table.'
  merge: -1
  img_proc: true
- pgno: 98
  md: "# Identifiers that you or I can define\n\nI like the name Suzanne, but if you\
    \ don't like traditional names, then make up a brand new name. You're having a\
    \ new baby. Call her \"Deneen\" or \"Chrisanta.\" Name him \"Belton\" or \"Merk.\"\
    \n\nA name is a word that identifies something, so I'll stop calling these things\
    \ names and start calling them identifiers. In computer programming, an identifier\
    \ is a noun of some kind. An identifier refers to a value, a part of a program,\
    \ a certain kind structure, or any number of things.\n\nListing 4-1 has two identifiers\
    \ that you or I can define on our own. They're the made-up words ThingsILike and\
    \ args.\n\n```\nclass ThingsILike {\n    public static void main(String args[])\
    \ {\n```\n\nJust as the names Suzanne and Chrisanta have no special meaning in\
    \ English, so the names ThingsILike and args have no special meaning in Java.\
    \ In Listing 4-1, I use ThingsILike for the name of my program, but I could also\
    \ have used a name like GooseGrease, Enzyme, or Kalamazoo. I have to put (String\
    \ someName[]) in my program, but I could use (String args[]), (String commandLineArguments[]),\
    \ or (String cheese[]).\n\n![](img/f938eba5f15e231d828a6255e7ec5523_98_0.png)\n\
    \nDo as I say, not as I do. Make up sensible, informative names for the things\
    \ in your Java programs. Names like GooseGrease are cute, but they don't help\
    \ you keep track of your program-writing strategy.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_98_1.png)\n\
    \nWhen I name my Java program, I can use ThingsILike or GooseGrease, but I can't\
    \ use the word public. Words like class, public, static, and void are keywords\
    \ in Java.\n\nThe args in (String args[]) holds anything extra that you type when\
    \ you issue the command to run a Java program. For example, if you get the program\
    \ to run by typing java ThingsILike won too 3, then args stores the extra values\
    \ won, too, and 3. As a beginning programmer, you don't need to think about this\
    \ feature of Java. Just paste (String args[]) into each of your programs.\n\n\
    # Identifiers with agreed-upon meanings\n\nMany people are named Suzanne, but\
    \ only one country is named Canada. That's because there's a standard, well-known\
    \ meaning for the word \"Canada.\" It's the country with a red maple leaf on its\
    \ flag. If you start your own country, you should avoid naming it Canada because\
    \ naming it Canada would just confuse everyone. (I know, a town in Kentucky is\
    \ named Canada, but that doesn't count. Remember, you should ignore exceptions\
    \ like this.)"
  merge: -1
  img_proc: true
- pgno: 99
  md: "Most programming languages have identifiers with agreed-upon meanings. In Java,\
    \ almost all these identifiers are defined in the Java API. Listing 4-1 has five\
    \ such identifiers. They're the words main, String, System, out, and println:\n\
    \n```\npublic static void main(String args[]) {\n    System.out.println(\"Chocolate,\
    \ royalties, sleep\");\n}\n```\n\nHere's a quick rundown on the meaning of each\
    \ of these names (and more detailed descriptions appear throughout this book):\n\
    \n+   - **main:** The main starting point for execution in every Java program.\n\
    +   - **String:** A bunch of text; a row of characters, one after another.\n+\
    \   - **System:** A canned program in the Java API. This program accesses some\
    \ features of your computer that are outside the direct control of the Java Virtual\
    \ Machine (JVM).\n+   - **out:** The place where a text-based program displays\
    \ its text. (For a program running in Eclipse, the word out represents the Console\
    \ view. To read more about text-based programs, check the first several paragraphs\
    \ of Chapter 3.)\n+   - **println:** Display text on your computer screen.\n\n\
    ![](img/f938eba5f15e231d828a6255e7ec5523_99_0.png)\n\nThe name println comes from\
    \ the words \"print a line.\" If you were allowed to write the name in uppercase\
    \ letters, it would be PRINTLN, with a letter L near the end of the word. When\
    \ the computer executes println, the computer puts some text in Eclipse's Console\
    \ view and then immediately moves to the beginning of the next line in preparation\
    \ for whatever else will appear in the Console view.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_99_1.png)\n\
    \nStrictly speaking, the meanings of the identifiers in the Java API aren't cast\
    \ in stone. Although you can make up your own meanings for words like System or\
    \ println, doing so isn't a good idea — because you'd confuse the dickens out\
    \ of other programmers, who are used to the standard API meanings for these familiar\
    \ identifier names.\n\n# Literals\n\nA literal is a chunk of text that looks like\
    \ whatever value it represents. In Suzanne's sentence (refer to Figure 4-2), \"\
    eh\" is a literal because \"eh\" refers to the word \"eh.\"\n\nProgramming languages\
    \ have literals, too. For example, in Listing 4-1, the stuff in quotes is a literal:\n\
    \n```\nSystem.out.println(\"Chocolate, royalties, sleep\");\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: "When you run the ThingsILike program, you see the words Chocolate, royalties,\
    \ sleep on the screen. In Listing 4-1, the text \"Chocolate, royalties, sleep\"\
    \ refers to these words, exactly as they appear on the screen (minus the quotation\
    \ marks).\n\nMost of the numbers that you use in computer programs are literals.\
    \ If you put the statement\n\n```\nmySalary = 1000000.00;\n```\n\nin a computer\
    \ program, then 1000000.00 is a literal. It stands for the number 1000000.00 (one\
    \ million).\n\nIf you don't enjoy counting digits, you can put the following statement\
    \ in your Java 7 program:\n\n```\nmySalary = 1_000_000.00;\n```\n\nStarting with\
    \ Java 7, numbers with underscores are permissible as literals.\n\nIn versions\
    \ of Java before Java 7, you cannot use numbers such as 1_000_000.00 in your code.\n\
    \n![](img/f938eba5f15e231d828a6255e7ec5523_100_0.png)\n\n![](img/f938eba5f15e231d828a6255e7ec5523_100_1.png)\n\
    \nDifferent countries use different number separators and different number formats.\
    \ For example, in the United States, you write 1,234,567,890.55. In France, you\
    \ write 1234567890,55. In India, you group digits in sets of two and three. You\
    \ write 1,23,45,67,890.55. You can't put a statement like mySalary = 1,000,000.00\
    \ in your Java program. Java's numeric literals don't have any commas in them.\
    \ But you can write mySalary = 10_00_000.00 for easy-to-read programming in India.\
    \ And for a program's output, you can display numbers like 1234567890,55 using\
    \ Java's Locale and NumberFormat classes. (For more on Locale and NumberFormat,\
    \ check out Chapter 18.)\n\n# Punctuation\n\nA typical computer program has lots\
    \ of punctuation. For example, consider the program in Listing 4-1:\n\n```\nclass\
    \ ThingsILike {\n    public static void main(String args[]) {\n        System.out.println(\"\
    Chocolate, royalties, sleep\");\n    }\n}\n```\n\nEach bracket, each brace, each\
    \ squiggle of any kind plays a role in making the program meaningful."
  merge: -1
  img_proc: true
- pgno: 101
  md: "In English, you write all the way across one line and then you wrap your text\
    \ to the start of the next line. In programming, you seldom work this way. Instead,\
    \ the code's punctuation guides the indenting of certain lines. The indentation\
    \ shows which parts of the program are subordinate to which other parts. It's\
    \ as though, in English, you wrote Suzanne's sentence like this:\n\nSuzanne says\
    \ \"eh\" because\n,\n    as you know\n,\nshe lives in Canada.\n\nThe diagrams\
    \ in Figures 4-3 and 4-4 show you how parts of the ThingsILike program are contained\
    \ inside other parts. Notice how a pair of curly braces acts like a box. To make\
    \ the program's structure visible at a glance, you indent all the stuff inside\
    \ of each box.\n\n# Figure 4-3: A pair of curly braces acts like a box.\n\n```\n\
    class ThingsILike {\n  public static void main(String args[]) {\n    System.out.println(\"\
    Chocolate, royalties, sleep\");\n  }\n}\n```\n\n# Figure 4-4: The ideas in a computer\
    \ program are nested inside one another.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_101_0.png)\n\
    \n![](img/f938eba5f15e231d828a6255e7ec5523_101_1.png)\n\nI can't emphasize this\
    \ point enough. If you don't indent your code or if you indent but you don't do\
    \ it carefully, then your code still compiles and runs correctly. But this successful\
    \ run gives you a false sense of confidence. The minute you try to update some\
    \ poorly indented code, you become hopelessly confused. So take my advice: Keep\
    \ your code carefully indented at every step in the process. Make your indentation\
    \ precise, whether you're scratching out a quick test program or writing code\
    \ for a billionaire customer.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_101_2.png)\n\
    \nEclipse can indent your code automatically for you. Select the .java file whose\
    \ code you want to indent. Then, in Eclipse's main menu, choose Source>Format.\
    \ Eclipse rearranges your lines in the editor, indenting things that should be\
    \ indented and generally making your code look good."
  merge: -1
  img_proc: true
- pgno: 102
  md: "# Comments\n\nA comment is text that's outside the normal flow. In Figure 4-2,\
    \ the words \"A comment:\" aren't part of the Suzanne sentence. Instead, these\
    \ words are about the Suzanne sentence.\n\nThe same is true of comments in computer\
    \ programs. The first five lines in Listing 4-1 form one big comment. The computer\
    \ doesn't act on this comment. There are no instructions for the computer to perform\
    \ inside this comment. Instead, the comment tells other programmers something\
    \ about your code.\n\nComments are for your own benefit, too. Imagine that you\
    \ set aside your code for a while and work on something else. When you return\
    \ later to work on the code again, the comments help you remember what you were\
    \ doing.\n\nThe Java programming language has three kinds of comments:\n\n**Traditional\
    \ comments:** The comment in Listing 4-1 is a traditional comment. The comment\
    \ begins with /* and ends with */. Everything between the opening /* and the closing\
    \ */ is for human eyes only. Nothing between /* and */ gets translated by the\
    \ compiler.\n\nThe second, third, and fourth lines in Listing 4-1 have extra asterisks.\
    \ I call them \"extra\" because these asterisks aren't required when you create\
    \ a comment. They just make the comment look pretty. I include them in Listing\
    \ 4-1 because, for some reason that I don't entirely understand, most Java programmers\
    \ add these extra asterisks.\n\n**End-of-line comments:** Here's some code with\
    \ end-of-line comments:\n\n```\n```\nclass ThingsILike {    //Two things are missing\n\
    \    public static void main(String args[]) {\n        System.out.println(\"sleep\"\
    ); // Missing from here\n    }\n}\n```\n```\n\nAn end-of-line comment starts with\
    \ two slashes and goes to the end of a line of type.\n\nYou may hear programmers\
    \ talk about commenting out certain parts of their code. When you're writing a\
    \ program and something's not working correctly, it often helps to try removing\
    \ some of the code. If nothing else, you find out what happens when that suspicious\
    \ code is removed. Of course, you may not like what happens when the code is removed,\
    \ so you don't want to delete the code completely. Instead, you turn your ordinary\
    \ Java statements into comments. For example, turn System.out.println(\"Sleep\"\
    ); into /* System.out.println(\"Sleep\"); */. This keeps the Java compiler from\
    \ seeing the code while you try to figure out what's wrong with your program.\n\
    \n![](img/f938eba5f15e231d828a6255e7ec5523_102_0.png)"
  merge: -1
  img_proc: true
- pgno: 103
  md: "Javadoc comments: A special Javadoc comment is any traditional comment that\
    \ begins with an extra asterisk.\n\n```\n/**\n * Print a String and then terminate\
    \ the line.\n */\n```\n\nThis is a cool Java feature. The software that you can\
    \ download from java.sun.com includes a little program called javadoc. The javadoc\
    \ program looks for these special comments in your code. The program uses these\
    \ comments to create a brand new web page — a customized documentation page for\
    \ your code. To find out more about Javadoc comments into web pages, visit this\
    \ book's website (http://allmycode.com/BeginProg).\n\n# Understanding a Simple\
