    \ programming. Well, that’s true. Except that many programming languages had data-gathering\
    \ features before object-oriented programming became popular. Pascal had records.\
    \ C had structs.\n\nTo be painfully precise, the grouping of data into usable\
    \ chunks is only a prerequisite to object-oriented programming. You’re not really\
    \ doing object-oriented programming until you combine both data and methods in\
    \ your classes.\n\nThis chapter starts the “data and methods” ball rolling, and\
    \ Chapter 19 rounds out the picture.\n\n# The String Class\n\nThe String class\
