    ```\n\nThis casting notation turns the double value 138.0 into the int value 138,\
    \ and everybody’s happy. (See the second figure in this sidebar.)\n\n# The increment\
    \ and decrement operators\n\nJava has some neat little operators that make life\
    \ easier (for the computer’s processor, for your brain, and for your fingers).\
    \ Altogether, there are four such operators — two increment operators and two\
    \ decrement operators. The increment operators add one, and the decrement operators\
    \ subtract one. To see how they work, you need some examples.\n\n# Using preincrement\n\
