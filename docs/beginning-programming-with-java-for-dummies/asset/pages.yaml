  md: 'Runs of the Listing 10-3 code look like the stuff in Figure 10-5. The only
    difference between Listings 10-2 and 10-3 is the use of boolean variables. In
    Listing 10-3, you get past all the less-than signs and double equal signs before
    the start of any if statements. By the time you encounter the two if statements,
    the conditions can use simple words — words like isKid, isSenior, and hasCoupon.
    With all these boolean variables, expressing each if statement''s condition is
    a snap. You can read more about boolean variables in Chapter 8.


    Adding a boolean variable can make your code more manageable. But some programming
    languages don''t have boolean variables, so many programmers prefer to create
    if conditions on the fly. That''s why I mix the two techniques (conditions with
    and without boolean variables) in this book.


    # Mixing different logical operators together


    If you read about Listing 10-2, you know that my local movie theater offers discount
    coupons. The trouble is, I can''t use a coupon along with any other discount.
    I tried to convince the ticket taker that I''m under 12 years of age, but he didn''t
    buy it. When that didn''t work, I tried combining the coupon with the senior citizen
    discount. That didn''t work, either.


    The theater must use some software that checks for people like me. It looks something
    like the code in Listing 10-4. To watch the code run, take a look at Figure 10-6.


    Figure 10-6: Running the code in Listing 10-4.


