  md: "```\n```java\n//This does NOT work:\nint count;\n\nfor (int count = 0; count\
    \ < 10; count++) {\n    ...etc.\n}\n```\n```\n\nAnd Eclipse told me to clean up\
    \ my act:\n\n```\nDuplicate local variable count\n```\n\n# Using Nested for Loops\n\
    \nBecause you’re reading *Beginning Programming with Java For Dummies*, 4th Edition,\
    \ I assume that you manage a big hotel. The next chapter tells you everything\
    \ you need to know about hotel management. But before you begin reading that chapter,\
    \ you can get a little preview in this section.\n\nI happen to know that your\
    \ hotel has 9 floors, and each floor of your hotel has 20 rooms. On this sunny\
    \ afternoon, someone hands you a flash drive containing a file full of numbers.\
    \ You copy this hotelData file to your hard drive and then display the file in\
    \ Eclipse’s editor. You see the stuff shown in Figure 15-4.\n\n**Figure 15-4:**\
    \ A file containing hotel occupancy data.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_307_0.png)\n\
    \nThis file gives the number of guests in each room. For example, at the start\
    \ of the file, you see 2 1 2. This means that, on the first floor, Room 1 has\
    \ 2 guests, Room 2 has 1 guest, and Room 3 has 2 guests. After reading 20 of these\
    \ numbers, you see 0 2 2. So, on the second floor, Room 1 has 0 guests, Room 2\
    \ has 2 guests, and Room 3 has 2 guests. The story continues until the last number\
    \ in the file. According to that number, Room 20 on the ninth floor has 4 guests.\n\
    \nYou’d like a more orderly display of these numbers — a display of the kind in\
    \ Figure 15-5. So you whip out your keyboard to write a quick Java program."
