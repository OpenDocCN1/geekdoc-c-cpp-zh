  md: "# The versatile plus sign\n\nThe program in Listing 19-3 uses some cute tricks.\
    \ In Java, you can do two different things with a plus sign:\n\n+   - **You can\
    \ add numbers with a plus sign.**\n+     For example, you can write\n+     ```\n\
    +     numberOfSheep = 2 + 5;\n+     ```\n+   - **You can concatenate strings with\
    \ a plus sign.**\n+     When you concatenate strings, you scrunch them together,\
    \ one right after another. For example, the expression\n+     ```\n+     \"Barry\"\
    \ + \" \" + \"Burd\"\n+     ```\n+     scrunch together Barry, a blank space,\
    \ and Burd. The new scrunched-up string is (you guessed it) Barry Burd.\n\nIn\
    \ Listing 19-3, the statement\n\n```\nanAccount.lastName = \"\" +\n    (char)\
    \ (myRandom.nextInt(26) + 'A') +\n    (char) (myRandom.nextInt(26) + 'a') +\n\
    \    (char) (myRandom.nextInt(26) + 'a');\n```\n\nhas many plus signs, and some\
    \ of the plus signs concatenate things together. The first thing is a mysterious\
    \ empty string (\"\"). This empty string is invisible, so it never gets in the\
    \ way of your seeing the second, third, and fourth things.\n\nOnto the empty string,\
    \ the program concatenates a second thing. This second thing is the value of the\
    \ expression (char) (myRandom.nextInt(26) + 'A'). The expression may look complicated,\
    \ but it's really no big deal. This expression represents an uppercase letter\
    \ (any uppercase letter, generated randomly).\n\nOnto the empty string and the\
    \ uppercase letter, the program concatenates a third thing. This third thing is\
    \ the value of the expression (char) (myRandom.nextInt(26) + 'a'). This expression\
    \ represents a lowercase letter (any lowercase letter, generated randomly).\n\n\
    Onto all this stuff, the program concatenates another lowercase letter. So altogether,\
    \ you have a randomly generated three-letter name. For more details, see the upcoming\
    \ sidebar."
