  md: "> **A call to the close method ends the connection between your program and\
    \ the file.**\n> \n> `diskWriter`, you can use any names you want. All you have\
    \ to do is to use the names consistently within each of your Java programs. This\
    \ book’s examples are pretty simple. If you omit a `close` method call in one\
    \ of these examples, you might get a warning message from Eclipse, but the world\
    \ doesn’t end. (That is, your program still runs correctly.) However, in a serious,\
    \ make-it-or-break-it application, the proper placement of `close` calls is important.\
    \ These close calls ensure the proper completion of the program’s input and output\
    \ actions and help free up disk resources for use by other running programs.\n\
    > \n> In many of this book’s examples, you sever the connection between your program\
    \ and the computer keyboard by calling `keyboard.close()`. The same is true when\
    \ you call the `close` method for a disk file’s scanner or a disk file’s `PrintStream`\
    \ instance. Calling the `close` method reminds Java to finish all pending read\
    \ or write operations and to break the program’s connection to the disk file,\
    \ the keyboard, or to whatever else holds data for the program.\n\n# Running the\
    \ sample program\n\nTesting the code in Listing 13-2 is a three-step process.\
    \ Here’s an outline of the three steps:\n\n+   1. **Create** the `rawData.txt`\
    \ file.\n+   2. **Run** the code in Listing 13-2.\n+   3. **View the contents**\
