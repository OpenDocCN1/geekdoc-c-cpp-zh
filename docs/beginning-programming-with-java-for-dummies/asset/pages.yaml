  md: "# From Classes Come Objects\n\nThe code in Listing 17-2 defines a class. A\
    \ class is a design plan; it describes the way in which you intend to combine\
    \ and use pieces of data. For example, the code in Listing 17-2 announces your\
    \ intention to combine double, boolean, and double values to make new Purchase\
    \ values.\n\nClasses are central to all Java programming. But Java is called an\
    \ object-oriented language. Java isn’t called a class-oriented language. In fact,\
    \ no one uses the term class-oriented language. Why not?\n\nWell, you can’t put\
    \ your arms around a class. A class isn’t real. A class without an object is like\
    \ a day without chocolate. If you’re sitting in a room right now, glance at all\
    \ the chairs in the room. How many chairs are in the room? Two? Five? Twenty?\
    \ In a room with five chairs, you have five chair objects. Each chair (each object)\
    \ is something real, something you can use, something you can sit on.\n\nA language\
    \ like Java has classes and objects. So what’s the difference between a class\
    \ and an object?\n\n+   - An object is a thing.\n+   - A class is a design plan\
    \ for things of that kind.\n\nFor example, how would you describe what a chair\
    \ is? Well, a chair has a seat, a back, and legs. In Java, you may write the stuff\
    \ in Listing 17-4.\n\n# Listing 17-4: What It Means to Be a Chair\n\n```\n/*\n\
    \ * This is real Java code, but this code\n * cannot be compiled on its own:\n\
    \ */\n\nclass Chair {\n    FlatHorizontalPanel seat;\n    FlatVerticalPanel back;\n\
    \    LongSkinnyVerticalRods legs;\n}\n```\n\nThe preceding code is a design plan\
    \ for chairs. The code tells you that each chair has three things. The code names\
    \ the things (seat, back, and legs) and tells you a little bit about each thing.\
    \ (For example, a seat is a"
