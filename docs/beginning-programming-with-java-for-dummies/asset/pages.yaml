    # One character only, please


    A char variable stores only one character. So if you''re tempted to write the
    following statements


    ```

    char smallLetters;

    smallLetters = ''barry''; //Don''t do this

    ```


    please resist the temptation. You can''t store more than one letter at a time
    in a char variable, and you can''t put more than one letter between a pair of
    single quotes. If you''re trying to store words or sentences (not just single
    letters), then you need to use something called a String. For a look at Java''s
    String type, see Chapter 18.


    # Variables and recycling


    In Listing 8-2, I use smallLetter twice, and I use bigLetter twice. That''s why
    they call these things variables. First, the value of smallLetter is R. Later,
    I vary the value of smallLetter so that the value of smallLetter becomes 3.


    When I assign a new value to smallLetter, the old value of smallLetter gets obliterated.
    For example, in Figure 8-4, the second smallLetter assignment puts 3 into smallLetter.
    When the computer executes this second assignment statement, the old value R is
    gone.'
