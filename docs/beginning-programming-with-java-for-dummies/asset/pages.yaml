- pgno: 146
  md: '> > As the programmer, your job is to combine the prompting and the next-ing.
    You can combine prompting and next-ing in all kinds of ways. Some ways are helpful
    to the user, and some ways aren’t.

    > >

    > > - **If you don’t have a call to `print` or `println`, then the user sees no
    prompt.** A blinking cursor sits quietly and waits for the user to type something.
    The user has to guess what kind of input to type. Occasionally that’s okay, but
    usually it isn’t.

    > > - **If you call `print` or `println`, but you don’t call a `keyboard.next...`
    method, then the computer doesn’t wait for the user to type anything.** The program
    races to execute whatever statement comes immediately after the `print` or `println`.

    > > - **If your prompt displays a misleading message, then you mislead the user.**
    Java has no built-in feature that checks the appropriateness of a prompt. That’s
    not surprising. Most computer languages have no prompt-checking feature.

    > >

    > > So be careful with your prompts. Be nice to your user. Remember, you were
    once a humble computer user, too.


    # Variations on a Theme


    In Listing 6-1, it takes two lines to give the amount variable its first value:


    ```

    double amount;

    amount = 5.95;

    ```


    You can do the same thing with just one line:


    ```

    double amount = 5.95;

    ```


    When you do this, you don’t say that you’re “assigning” a value to the amount
    variable. The line `double amount = 5.95;` isn’t called an “assignment statement.”
    Instead, this line is called a declaration with an initialization. You’re initializing
    the amount variable. You can do all sorts of things with initializations, even
    arithmetic.


    ```

    double gasBill  = 174.59;

    double elecBill = 84.21;

    double H2OBill   = 22.88;

    double total     = gasBill + elecBill + H2OBill;

    ```


    # Moving variables from place to place


    It helps to remember the difference between initializations and assignments. For
    one thing, you can drag a declaration with its initialization outside a method.'
