  md: '# Deleting a file


    A run of the Listing 15-4 program is shown in Figure 15-6. Before deleting a file,
    the program asks the user if it''s okay to do the deletion. If the user gives
    one of the two expected answers (Y or N), the program proceeds according to the
    user''s wishes. But if the user enters any other letter (or any digit, punctuation
    symbol, or whatever), the program asks the user for another response.


    ![](img/f938eba5f15e231d828a6255e7ec5523_312_0.png)


    In Figure 15-6, the user hems and haws for a while, first with the letter U, then
    the digit 8, and then with lowercase letters. Finally, the user enters Y, and
    the program deletes the importantData.txt file. If you compare the files on your
    hard drive (before and after the run of the program), you''ll see that the program
    trashes the file named importantData.txt.


    If you use Eclipse, here''s how you can tell that a file is being deleted:


    +   1. Create a Java project containing the code in Listing 15-4.

    +      If you followed the steps in Chapter 2 for importing this book''s examples,
    you can skip this create-a-project step and use the existing 15-04 project.

    +   2. In the Package Explorer, select the project.

    +      Don''t select any of the project''s subfolders. (For example, don''t select
    the project''s src folder.) Instead, select the project''s root. For more info
    about a project''s root, see Chapter 13.

    +   3. In Eclipse''s main menu, choose File→New→File.

    +      Eclipse''s New File dialog box appears.

    +      In the New File dialog box, make sure that the name of your project''s
    root folder is in the box''s Enter Or Select The Parent Folder field. For example,
    if you followed the steps in Chapter 2 for importing this book''s examples, make
    sure that the 15-04 (and no other text) appears in the Enter Or Select The Parent
    Folder field.

    +   4. In the dialog box''s File Name field, type the name of your new file.

    +      Type importantData.txt.

    +   5. Click Finish.


    ![](img/f938eba5f15e231d828a6255e7ec5523_312_1.png)


    ![](img/f938eba5f15e231d828a6255e7ec5523_312_2.png)'
