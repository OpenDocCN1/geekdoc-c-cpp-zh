  md: "# Using Java's do statement\n\nTo write the program in Listing 15-4, you need\
    \ a loop — a loop that repeatedly asks the user whether the importantData.txt\
    \ file should be deleted. (The action of the loop in Listing 15-4 is illustrated\
    \ in Figure 15-7.) The loop continues to ask until the user gives a meaningful\
    \ response. The loop tests its condition at the end of each iteration, after each\
    \ of the user's responses.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_314_0.png)\n\
    \nFigure 15-7:\nHere we\ngo loop, do\nloop.\n\nThat's why the program in Listing\
    \ 15-4 has a do loop (also known as a do... while loop). With a do loop, the program\
    \ jumps right in, executes some statements, and then checks a condition. If the\
    \ condition is true, the program goes back to the top of the loop for another\
    \ go-around. If the condition is false, the computer leaves the loop (and jumps\
    \ to whatever code comes immediately after the loop).\n\n# A closer look at the\
    \ do statement\n\nThe format of a do loop is\n\n```\ndo {\n    Statements\n} while\
    \ (Condition)\n```"
  merge: -1
  img_proc: true
- pgno: 315
  md: "Writing the Condition at the end of the loop reminds me that the computer executes\
    \ the Statement inside the loop first. After the computer executes the Statement,\
    \ the computer goes on to check the Condition. If the Condition is true, the computer\
    \ goes back for another iteration of the Statement.\n\nWith a do loop, the computer\
    \ always executes the statements inside the loop at least once:\n\n```\n//This\
    \ code prints something:\nint twoPlusTwo = 2 + 2;\ndo {\n    System.out.println(\"\
    Are you kidding?\");\n    System.out.println(\"2+2 doesn't equal 5.\");\n    System.out.print\
    \ (\"Everyone knows that\");\n    System.out.println(\" 2+2 equals 3.\");\n} while\
    \ (twoPlusTwo == 5);\n```\n\nThis code displays Are you kidding? 2+2 doesn't equal\
    \ 5... and so on and then tests the condition twoPlusTwo == 5. Because twoPlusTwo\
    \ == 5 is false, the computer doesn't go back for another iteration. Instead,\
    \ the computer jumps to whatever code comes immediately after the loop.\n\n# Repeating\
    \ with Predetermined Values (Java's Enhanced for Statement)\n\nMost people say\
    \ that they “never win anything.” Other people win raffles, drawings, and contests,\
    \ but they don’t win things. Well, I have news for these people — other people\
    \ don’t win things, either. Nobody wins things. That’s how the laws of probability\
    \ work. Your chance of winning one of the popular U.S. lottery jackpots is roughly\
    \ 1 in 135,000,000. If you sell your quarter-million dollar house and use all\
    \ the money to buy lottery tickets, your chance of winning is still only 1 in\
    \ 540. If you play every day of the month (selling a house each day), your chance\
    \ of winning the jackpot is still less than 1 in 15.\n\nOf course, nothing in\
    \ the previous paragraph applies to me. I don’t buy lottery tickets, but I often\
    \ win things. My winning streak started a few years ago. I won some expensive\
    \ Java software at the end of an online seminar. Later that month, I won a microchip-enabled\
    \ pinky ring (a memento from a 1998 Java conference). The following year I won\
    \ a wireless PDA. Just last week, I won a fancy business-class printer."
  merge: -1
  img_proc: true
- pgno: 316
  md: "I never spend money to enter any contests. All these winnings are freebies.\
    \ When the national computer science educators' conference met in Reno, Nevada,\
    \ my colleagues convinced me to try the slot machines. I lost $23, and then I\
    \ won back $18. At that point, I stopped playing. I wanted to quit while I was\
    \ only $5 behind.\n\nThat's why my writing a Java program about slot machines\
    \ is such a strange occurrence. A typical slot machine has three reels, with each\
    \ reel having about 20 symbols. But to illustrate this section's ideas, I don't\
    \ need 20 symbols. Instead I use four symbols — a cherry, a lemon, a kumquat,\
    \ and a rutabaga.\n\n# Creating an enhanced for loop\n\nWhen you play my simplified\
    \ slot machine, you can spin any one of over 60 combinations — cherry•cherry•kumquat,\
    \ rutabaga•rutabaga•rutabaga, or whatever. This chapter's goal is to list all\
    \ possible combinations. But first, I show you another kind of loop. Listing 15-5\
    \ defines an enum type for a slot machine's symbols and displays a list of the\
    \ symbols. (For an introduction to enum types, see Chapter 10.)\n\n# Listing 15-5:\
    \ Slot Machine Symbols\n\n```\nimport static java.lang.System.out;\n\nclass ListSymbols\
    \ {\n\nenum Symbol {\n    cherry, lemon, kumquat, rutabaga\n}\n\npublic static\
    \ void main(String args[]) {\n    for (Symbol leftReel : Symbol.values()) {\n\
    \        out.println(leftReel);\n    }\n}\n}\n```\n\nListing 15-5 uses Java's\
    \ enhanced for loop. The word \"enhanced\" means \"enhanced compared with the\
    \ loops in earlier versions of Java.\" The enhanced for loop was introduced in\
    \ Java version 5.0. If you run Java version 1.4.2 (or something like that), you\
    \ can't use an enhanced for loop.\n\nHere's the format of the enhanced for loop:\n\
    \n```\nfor (TypeName variableName : RangeOfValues) {\n    Statements\n}\n```"
  merge: -1
  img_proc: true
- pgno: 317
  md: "Here’s how the loop in Listing 15-5 follows the format:\n\n+   - **In Listing\
    \ 15-5, the word `Symbol` is the name of a type.**\n+   \n+     The `int` type\
    \ describes values like −1, 0, 1, and 2. The `boolean` type describes the values\
    \ `true` and `false`. And because of the code in Listing 15-5, the `Symbol` type\
    \ describes the values cherry, lemon, kumquat, and rutabaga. For more information\
    \ on enum types like `Symbol`, see Chapter 10.\n\n+   - **In Listing 15-5, the\
    \ word `leftReel` is the name of a variable.**\n+   \n+     The loop in Listing\
    \ 15-1 defines `count` to be an `int` variable. Similarly, the loop in Listing\
    \ 15-5 defines `leftReel` to be a `Symbol` variable. So in theory, the variable\
    \ `leftReel` can take on any of the four `Symbol` values.\n+   \n+     By the\
    \ way, I call this variable `leftReel` because the code lists all the symbols\
    \ that can appear on the leftmost of the slot machine’s three reels. Because all\
    \ three of the slot machine’s reels have the same symbols, I may also have named\
    \ this variable `middleReel` or `rightReel`. But on second thought, I’ll save\
    \ the names `middleReel` and `rightReel` for a later example.\n\n+   - **In Listing\
    \ 15-5, the expression `Symbol.values()` stands for the four values in Listing\
    \ 15-5.**\n+   \n+     To quote myself in the previous bullet, “in theory, the\
    \ variable `leftReel` can take on any of the four `Symbol` values.” Well, the\
    \ `RangeOfValues` part of the `for` statement turns theory into practice. This\
    \ third item inside the parentheses says, “Have as many loop iterations as there\
    \ are `Symbol` values, and have the `leftReel` variable take on a different `Symbol`\
    \ value during each of the loop’s iterations.”\n+   \n+     So the loop in Listing\
    \ 15-5 undergoes four iterations — an iteration in which `leftReel` has value\
    \ cherry, another iteration in which `leftReel` has value lemon, a third iteration\
    \ in which `leftReel` has value kumquat, and a fourth iteration in which `leftReel`\
    \ has value rutabaga. During each iteration, the program prints the `leftReel`\
    \ variable’s value. The result is in Figure 15-8.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_317_0.png)\n\
    \n**Figure 15-8:** The output of the code in Listing 15-5."
