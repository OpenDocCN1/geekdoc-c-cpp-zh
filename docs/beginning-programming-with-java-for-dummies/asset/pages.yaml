    **Figure 12-8:** An incorrect run.


    Unfortunately, the run in Figure 12-8 doesn’t stop on its own. This kind of processing
    is called an *infinite loop*. The loop runs and runs until someone trips over
    the computer’s extension cord.


    ![](img/f938eba5f15e231d828a6255e7ec5523_258_1.png)


    You can stop a program’s run dead in its tracks. Look for the tiny red rectangle
    at the top of Eclipse’s Console view. When you hover over the rectangle, the tooltip
    says “Terminate.” When you click the rectangle, the active Java program stops
    running, and the rectangle turns gray.


    # From infinity to affinity


    For some problems, an infinite loop is normal and desirable. Consider, for example,
    a real-time mission-critical application — air traffic control, or the monitoring
    of a heart-lung machine. In these situations, a program should run and run and
    run.


    But a game of Twenty-One should end pretty quickly. In Figure 12-8, the game doesn’t
    end because the total never reaches 21 or higher. In fact, the total is always
    zero. The problem is that my code has no statement to change the total variable’s
    value. I should add each card’s value to the total:


    ```

    ```java

    total += card;

    ```

    ```'
