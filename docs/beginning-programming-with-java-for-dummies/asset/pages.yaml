- pgno: 297
  md: "# Solving the problem\n\nListing 14-3 has the solution to the problem described\
    \ with Figures 14-1 and 14-2. The code in this listing is almost identical to\
    \ the code in Listing 14-2. The only difference is the added call to nextLine.\
    \ When the computer reaches an @ sign, this nextLine call swallows the rest of\
    \ the input line without actually tasting it. (The nextLine call gets the rest\
    \ of the e-mail address, but doesn't output that part of the e-mail address. The\
    \ idea works because each e-mail address is on its own separate line.) After gulping\
    \ down @BurdBrain.com, the computer moves gracefully to the next line of input.\n\
    \n# Listing 14-3: That’s Much Better!\n\n```\n```java\n/*\n * This code is correct!!\n\
    \ */\n\nimport java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    import java.io.PrintStream;\n\nclass ListAllUsernames {\n\n    public static void\
    \ main(String args[])\n            throws FileNotFoundException {\n\n        Scanner\
    \ diskScanner =\n            new Scanner(new File(\"email.txt\"));\n        PrintStream\
    \ diskWriter =\n            new PrintStream(\"usernames.txt\");\n        char\
    \ symbol;\n\n        while (diskScanner.hasNext()) {\n            symbol = diskScanner.findWithinHorizon(\"\
    @\", 0)\n                    .charAt(0);\n\n            while (symbol != '@')\
    \ {\n                diskWriter.print(symbol);\n                symbol = diskScanner.findWithinHorizon(\"\
    .\", 0)\n                        .charAt(0);\n            }\n\n            diskScanner.nextLine();\n\
    \            diskWriter.println();\n        }\n\n        diskScanner.close();\n\
    \        diskWriter.close();\n    }\n}\n```\n```"
