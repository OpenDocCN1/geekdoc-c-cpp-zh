- pgno: 23
  md: '# 2. Use an automated build system.


    # Summary


    Push the (singular) button: Use a fully automatic (“one-action”) build system
    that builds the whole project without user intervention.


    # Discussion


    A one-action build process is essential. It must produce a dependable and repeatable
    translation of your source files into a deliverable package. There is a broad
    range of automated build tools available, and no excuse not to use one. Pick one.
    Use it.


    We’ve seen organizations that neglect the “one-action” requirement. Some consider
    that a few mouse clicks here and there, running some utilities to register COM/CORBA
    servers, and copying some files by hand constitute a reasonable build process.
    But you don’t have time and energy to waste on something a machine can do faster
    and better. You need a one-action build that is automated and dependable.


    Successful builds should be silent, warning-free (see Item 1). The ideal build
    produces no noise and only one log message: “Build succeeded.”


    Have two build modes: Incremental and full. An incremental build rebuilds only
    what has changed since the last incremental or full build. Corollary: The second
    of two successive incremental builds should not write any output files; if it
    does, you probably have a dependency cycle (see Item 22), or your build system
    performs unnecessary operations (e.g., writes spurious temporary files just to
    discard them).


    A project can have different forms of full build. Consider parameterizing your
    build by a number of essential features; likely candidates are target architecture,
    debug vs. release, and breadth (essential files vs. all files vs. full installer).
    One build setting can create the product’s essential executables and libraries,
    another might also create ancillary files, and a full-fledged build might create
    an installer that comprises all your files, third-party redistributables, and
    installation code.


    As projects grow over time, so does the cost of not having an automated build.
    If you don’t use one from the start, you will waste time and resources. Worse
    still, by the time the need for an automated build becomes overwhelming, you will
    be under more pressure than at the start of the project.


    Large projects might have a “build master” whose job is to care for the build
    system.


    # References


    [Brooks95] §13, §19 • [Dewhurst03] §1 • [GnuMake] • [Stroustrup00] §9.1'
  merge: -1
