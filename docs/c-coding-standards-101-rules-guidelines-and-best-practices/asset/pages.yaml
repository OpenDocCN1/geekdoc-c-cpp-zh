  md: "ommend in code that needs to be portable: You can make B’s copy constructor\
    \ **explicit**. This can help avoid implicit slicing, but it also prevents all\
    \ pass-by-value (this can be good for base classes, which shouldn’t be instantiable\
    \ anyway; see Item 35):\n\n```\n```cpp\n// Making the copy constructor explicit\
    \ (has side effects, needs improvement)\nclass B { // ...\npublic:\n    explicit\
    \ B( const B& rhs );\n};\n\nclass D : public B { /* ... */ };\n```\n```\n\nCalling\
    \ code can still slice if it really wants to, but has to be, well, explicit about\
    \ it:\n\n```\n```cpp\nvoid Transmogrify( B obj );             // note: now can’t\
    \ ever be called (!)\n\nvoid Transmogrify2( const B& obj ) {    // an idiom to\
    \ explicitly say “I want to take\n    B b( obj );                          //\
    \ obj by value anyway (and possibly slice it)”\n    // ...\n}\n\nB b;        \
