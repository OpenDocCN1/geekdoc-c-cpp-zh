  md: '# 80. Prefer push_back to other ways of expanding a sequence.


    # Summary


    **push_back** all you can: If you don’t need to care about the insert position,
    prefer using **push_back** to add an element to a sequence. Other means can be
    both vastly slower and less clear.


    # Discussion


    You can insert elements into sequences at different points using **insert**, and
    you can append elements to sequences in various ways including:


    ```

    vector<int> vec;                  // vec is empty

    vec.resize(vec.size() + 1, 1);    // vec contains { 1 }

    vec.insert(vec.end(), 2);          // vec contains { 1, 2 }

    vec.push_back(3);                  // vec contains { 1, 2, 3 }

    ```


    Of all forms, **push_back** alone takes *amortized constant time*. The other forms’
    performance can be as bad as quadratic. Needless to say, beyond small data volumes
    that makes those alternatives potential scalability barriers. (See Item 7.)


    **push_back**’s magic is simple: It expands capacity exponentially, not by a fixed
    increment. Hence the number of reallocations and copies decreases rapidly with
    size. For a container populated using only **push_back** calls, on average each
    element has been copied only once—regardless of the final size of the container.


    Of course, **resize** and **insert** could employ the same strategy, but that
    is dependent on the implementation; only **push_back** offers the guarantee.


    Algorithms can’t call **push_back** directly because they don’t have access to
    the container. You can ask algorithms to use **push_back** anyway by using a **back_inserter**.


    # Exceptions


    If you know you’re adding a range, even at the end of a container, prefer to use
    a range insertion function (see Item 81).


    Exponential growth is generous with memory allocation. To fine-tune growth, call
    **reserve** explicitly—**push_back**, **resize**, and the like never trigger reallocation
    if they have enough space. To “right-size” a **vector**, use the shrink-to-fit
    idiom (see Item 82).


    # References


    *[Stroustrup00] §3.7-8, §16.3.5, §17.1.4.1*'
