  md: "# # 13. Ensure resources are owned by objects. Use explicit RAII and smart\
    \ pointers.\n\n**Summary**\n\nDon't saw by hand when you have power tools: C++'s\
    \ \"resource acquisition is initialization\" (RAII) idiom is *the* power tool\
    \ for correct resource handling. RAII allows the compiler to provide strong and\
    \ automated guarantees that in other languages require fragile hand-coded idioms.\
    \ When allocating a raw resource, immediately pass it to an owning object. Never\
    \ allocate more than one resource in a single statement.\n\n**Discussion**\n\n\
    C++'s language-enforced constructor/destructor symmetry mirrors the symmetry inherent\
    \ in resource acquire/release function pairs such as `fopen`/`fclose`, `lock`/`unlock`,\
    \ and `new`/`delete`. This makes a stack-based (or reference-counted) object with\
    \ a resource-acquiring constructor and a resource-releasing destructor an excellent\
    \ tool for automating resource management and cleanup.\n\nThe automation is easy\
    \ to implement, elegant, low-cost, and inherently error-safe. If you choose not\
    \ to use it, you are choosing the nontrivial and attention-intensive task of pairing\
    \ the calls correctly by hand, including in the presence of branched control flows\
    \ and exceptions. Such C-style reliance on micromanaging resource deallocation\
    \ is unacceptable when C++ provides direct automation via easy-to-use RAII.\n\n\
    Whenever you deal with a resource that needs paired acquire/release function calls,\
    \ encapsulate that resource in an object that enforces pairing for you and performs\
    \ the resource release in its destructor. For example, instead of calling a pair\
    \ of `OpenPort`/`ClosePort` nonmember functions directly, consider:\n\n```\n```cpp\n\
    class Port {\n    public:\n    Port(const string& destination);    // call OpenPort\n\
    \    ~Port();                           // call ClosePort\n    // ... ports can't\
    \ usually be cloned, so disable copying and assignment ...\n};\n\nvoid DoSomething()\
    \ {\n    Port port1(\"server1:80\");\n    // ...\n} // can't forget to close port1;\
    \ it's closed automatically at the end of the scope\n\nshared_ptr<Port> port2\
    \ = /*...*/;    // port2 is closed automatically when the\n                  \
    \                   // last shared_ptr referring to it goes away\n```\n```\n\n\
    You can also use libraries that implement the pattern for you (see [Alexandrescu00c])."
