- pgno: 146
  md: '# 68. Assert liberally to document internal assumptions and invariants.


    # Summary


    Be assertive! Use **assert** or an equivalent liberally to document assumptions
    internal to a module (i.e., where the caller and callee are maintained by the
    same person or team) that must always be true and otherwise represent programming
    errors (e.g., violations of a function’s postconditions detected by the caller
    of the function). (See also Item 70.) Ensure that assertions don’t perform side
    effects.


    # Discussion


    > It’s hard enough to find an error in your code when you’re looking for it; it’s
    even harder when you’ve assumed your code is error-free. —Steve McConnell


    It is hard to overestimate the power of assertions. The **assert** macro and alternatives
    such as compile-time (and, less preferably, run-time) assertion templates are
    invaluable tools for detecting and debugging programming errors during a project’s
    development. Of all such tools, they arguably have the best complexity/effectiveness
    ratio. The success of a project can be conditioned at least in part by the effectiveness
    with which developers use assertions in their code.


    Assertions commonly generate code in debug mode only (when the **NDEBUG** macro
    is not defined), so they can be made “free” in release builds. Be generous with
    what you check. Never write expressions with side effects in **assert** statements.
    In release mode, when the **NDEBUG** macro is defined, **assert**s don’t generate
    any code at all:


    ```

    assert( ++i < limit );                    // bad: i is incremented in debug mode
    only

    ```


    According to information theory, the quantity of information in an event is inversely
    proportional to the likelihood of that event happening. Thus, the less likely
    some **assert** is to fire, the more information it will bring to you when it
    does fire.


    Avoid **assert(false)**, and prefer **assert( !”informational message” )**. Most
    compilers will helpfully emit the string in their error output. Also consider
    adding **&& “informational message”** to more complex assertions, especially instead
    of a comment.


    Consider defining your own assert. The standard **assert** macro unceremoniously
    aborts the program with a message to the standard output. Your environment likely
    offers enhanced debugging capabilities; for example, it might allow starting an
    interactive debugger automatically. If so, you may want to define your own **MYASSERT**
    macro and use it. It can also be useful to retain most assertions even in release
    builds (prefer not to disable checks for performance reasons unless there’s a
    proven need; see Item 8), and there is real benefit to having an assertion facility
    that can distinguish between “levels” of assertions, some of which stay on in
    release mode.'
