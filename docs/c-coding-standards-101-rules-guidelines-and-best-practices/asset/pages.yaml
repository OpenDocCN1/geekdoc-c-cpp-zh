    \ 2: Errors that work.* Say you provide **operator const char*** for a String\
    \ class:\n\n```\nclass String {\n  // ...\npublic:\n  operator const char*();\
    \               // deplorable form\n};\n```\n\nSuddenly, a lot of silly expressions\
    \ now compile. Assume **s1, s2** are Strings:\n\n```\nint x = s1 - s2;       \
    \                // compiles; undefined behavior\nconst char* p = s1 - 5;    \
    \             // compiles; undefined behavior\np = s1 + '0';                 \
    \          // compiles; doesn't do what you'd expect\nif( s1 == \"0\" ) { ...\
    \ }                 // compiles; doesn't do what you'd expect\n```\n\nThe standard\
    \ string wisely avoids an **operator const char*** for exactly this reason.\n\n\
    # Exceptions\n\nWhen used sparingly and with care, implicit conversions can make\
    \ calling code short and intuitive. The standard **std::string** defines an implicit\
    \ constructor that takes a **const char\\***. This works fine because the designers\
    \ took some precautions:\n\n+   - There is no automatic conversion *to* **const\
    \ char\\***; that conversion is provided through two named functions, **c_str**\
    \ and **data**.\n+   - All comparison operators defined for **std::string** (e.g.,\
    \ **==, !=, <**) are overloaded to compare a **const char\\*** and a **std::string**\
    \ in any order (see Item 29). This avoids the creation of hidden temporary variables.\n\
    \nEven so, there can still be some weirdness with overloaded functions:\n\n```\n\
    void Display( int );\nvoid Display( std::string );\n```\n\n```\nDisplay( NULL\
    \ );                         // calls Display(int)\n```\n\nThis result might be\
    \ surprising. (Incidentally, if it did call **Display( std::string )**, the code\
    \ would have exhibited undefined behavior because it’s illegal to construct a\
    \ **std::string** from a null pointer, but its constructor isn’t required to check\
    \ for the null.)\n\n# References\n\n[*Dewhurst03*] §36-37 • [*Lakos96*] §9.3.1\
