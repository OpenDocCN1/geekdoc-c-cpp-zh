- pgno: 34
  md: '# 9. Don’t pessimize prematurely.


    # Summary


    Easy on yourself, easy on the code: All other things being equal, notably code
    complexity and readability, certain efficient design patterns and coding idioms
    should just flow naturally from your fingertips and are no harder to write than
    the pessimized alternatives. This is not premature optimization; it is avoiding
    gratuitous pessimization.


    # Discussion


    Avoiding premature optimization does not imply gratuitously hurting efficiency.
    By premature pessimization we mean writing such gratuitous potential inefficiencies
    as:


    +   - Defining pass-by-value parameters when pass-by-reference is appropriate.
    (See Item 25.)

    +   - Using postfix ++ when the prefix version is just as good. (See Item 28.)

    +   - Using assignment inside constructors instead of the initializer list. (See
    Item 48.)


    It is not a premature optimization to reduce spurious temporary copies of objects,
    especially in inner loops, when doing so doesn’t impact code complexity. Item
    18 encourages variables that are declared as locally as possible, but includes
    the exception that it can be sometimes beneficial to hoist a variable out of a
    loop. Most of the time that won’t obfuscate the code’s intent at all, and it can
    actually help clarify what work is done inside the loop and what calculations
    are loop-invariant. And of course, prefer to use algorithms instead of explicit
    loops. (See Item 84.)


    Two important ways of crafting programs that are simultaneously clear and efficient
    are to use abstractions (see Items 11 and 36) and libraries (see Item 84). For
    example, using the standard library’s vector, list, map, find, sort and other
    facilities, which have been standardized and implemented by world-class experts,
    not only makes your code clearer and easier to understand, but it often makes
    it faster to boot.


    Avoiding premature pessimization becomes particularly important when you are writing
    a library. You typically can’t know all contexts in which your library will be
    used, so you will want to strike a balance that leans more toward efficiency and
    reusability in mind, while at the same time not exaggerating efficiency for the
    benefit of a small fraction of potential callers. Drawing the line is your task,
    but as Item 7 shows, the bigger fish to focus on is scalability and not a little
    cycle-squeezing.


    # References


    [Keffer95] pp.12-13 • [Stroustrup00] §6 introduction • [Sutter00] §6'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 10. Minimize global and shared data.


    # Summary


    Sharing causes contention: Avoid shared data, especially global data. Shared data
    increases coupling, which reduces maintainability and often performance.


    # Discussion


    This statement is more general than Item 18''s specific treatment.


    Avoid data with external linkage at namespace scope or as static class members.
    These complicate program logic and cause tighter coupling between different (and,
    worse, distant) parts of the program. Shared data weakens unit testing because
    the correctness of a piece of code that uses shared data is conditioned on the
    history of changes to the data, and further conditions the functioning of acres
    of yet-unknown code that subsequently uses the data further.


    Names of objects in the global namespace additionally pollute the global namespace.


    If you must have global, namespace-scope, or static class objects, be sure to
    initialize such objects carefully. The order of initialization of such objects
    in different compilation units is undefined, and special techniques are needed
    to handle it correctly (see References). The order-of-initialization rules are
    subtle; prefer to avoid them, but if you do have to use them then know them well
    and use them with great care.


    Objects that are at namespace scope, static members, or shared across threads
    or processes will reduce parallelism in multithreaded and multiprocessor environments
    and are a frequent source of performance and scalability bottlenecks. (See Item
    7.) Strive for "shared-nothing;" prefer communication (e.g., message queues) over
    data sharing.


    Prefer low coupling and minimized interactions between classes. (See [Cargill92].)


    # Exceptions


    The program-wide facilities cin, cout, and cerr are special and are implemented
    specially. A factory has to maintain a registry of what function to call to create
    a given type, and there is typically one registry for the whole program (but preferably
    it should be internal to the factory rather than a shared global object; see Item
    11).


    Code that does share objects across threads should always serialize all access
    to those shared objects. (See Item 12 and [Sutter04c].)


    # References


    [Cargill92] pp. 126,136, 169-173 • [Dewhurst03] §3 • [Lakos96] §2.3.1 • [McConnell93]
    §5.1-4 • [Stroustrup00] §C.10.1 • [Sutter00] §47 • [Sutter02] §16, Appendix A
    • [Sutter04c] • [SuttHysl03]'
  merge: -1
