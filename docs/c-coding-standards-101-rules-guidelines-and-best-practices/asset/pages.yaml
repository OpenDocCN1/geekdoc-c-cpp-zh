  md: 'ed inside **f** to render compilable code. This is called an “implicit interface,”
    in contrast to a base class’s explicit interface. It achieves the same goal of
    polymorphism—writing code that operates on multiple types—but in a very different
    way.


    Static polymorphism is best at:


    +   - *Uniform manipulation based on syntactic and semantic interface:* Types
    that obey a syntactic and semantic interface can be treated uniformly. Interfaces
    are syntactic and implicit (not signature-based and explicit), and so allow any
    type substitution that fits a given syntax. For example, given the statement `int
    i = p->f(5)`: If **p** is a pointer to a **Base** class type, this calls a specific
    interface function, such as perhaps a **virtual int f(int)**. But if **p** is
    of a generic type, this call can bind to a myriad of things, including that it
    might invoke an overloaded `operator->` that returns a type defining the function
    **X f(double)** where X is convertible to **int**.

    +   - *Static type checking:* All types are checked statically.

    +   - *Static binding (prevents separate compilation):* All types are bound statically.

    +   - *Efficiency:* Compile-time evaluation and static binding allow optimizations
    and efficiencies not available with dynamic binding.


    Decide on your priorities, and use each type of polymorphism for its strengths.


    Prefer to blend both kinds of polymorphism to combine their benefits while trying
    not to combine their drawbacks:


    +   - *Static helps dynamic:* Use static polymorphism to implement dynamically
    polymorphic interfaces. For example, you might have an abstract base class **Command**
    and define various implementations as `template</*...*/> class Concrete-Command
    : public Command`. Examples include implementing the Command and Visitor design
    patterns (see [Alexandrescu01] and [Sutter04]).

    +   - *Dynamic helps static:* Offer a generic, comfortable, statically bound interface,
    but internally dispatch dynamically, so you offer a uniform object layout. Good
    examples are discriminated union implementations (see [Alexandrescu02b] and [Boost])
    and **tr1::shared_ptr**’s **Deleter** parameter (see [C++TR104]).

    +   - *Any other blend:* A bad blend that combines the weaknesses of both is worse
    than either alone; a good blend that combines the benefits of both is better than
    either alone. For example, don’t put virtual functions into a class template unless
    you want all virtual functions to be instantiated every time (this is in sharp
    contrast to nonvirtual functions of templated types). The code size hit can be
    astronomical, and you may overconstrain your generic type by instantiating functionality
    that is never needed. The standard facets made this mistake. Don’t make it again.


