  md: '# # 71. Design and write error-safe code.


    # ## Summary


    Promise, but don''t punish: In each function, give the strongest safety guarantee
    that won''t penalize callers who don''t need it. Always give at least the basic
    guarantee.


    Ensure that errors always leave your program in a valid state. This is the basic
    guarantee. Beware of invariant-destroying errors (including but not limited to
    leaks), which are just plain bugs.


    Prefer to additionally guarantee that the final state is either the original state
    (if there was an error the operation was rolled back) or the intended target state
    (if there was no error the operation was committed). This is the strong guarantee.


    Prefer to additionally guarantee that the operation can never fail at all. Although
    this is not possible for most functions, it is required for functions like destructors
    and deallocation functions. This is the no-fail guarantee.


    # ## Discussion


    The basic, strong, and no-fail (then known as nothrow) guarantees were originally
    described in [Abrahams96] and publicized in [GotW], [Stroustrup00] §E.2, and [Sutter00]
    with respect to exception safety. They apply to all error handling regardless
    of the specific method used, and so we will use them to describe error handling
    safety in general. The no-fail guarantee is a strict superset of the strong guarantee,
    and the strong guarantee is a strict superset of the basic guarantee.


    In general, every function should provide the strongest guarantee that it can
    provide without needlessly penalizing calling code that doesn''t need the guarantee.
    Where possible, it should additionally provide enough functionality to allow calling
    code that needs a still stronger guarantee to achieve that (see the vector::insert
    case in the Examples).


    Ideally, we write functions that always succeed and therefore can provide the
    no-fail guarantee. Certain functions must always provide the no-fail guarantee,
    notably destructors, deallocation functions, and swap functions (see Item 51).


    Most functions, however, can fail. When errors are possible, the safest approach
    is to ensure that a function supports a transactional behavior: Either it totally
    succeeds and takes the program from the original valid state to the desired target
    valid state, or it fails and leaves the program in the state it was before the
    call—any object''s visible state before the failed call is the same after the
    failed call (e.g., a global int''s'
