- pgno: 105
  md: "No post-construction technique is perfect. The worst dodge the whole issue\
    \ by simply asking the caller to invoke the post-constructor manually. Even the\
    \ best require a different syntax for constructing objects (easy to check at compile\
    \ time) and/or cooperation from derived class authors (impossible to check at\
    \ compile time).\n\n# **Examples**\n\n*Example:* Using a factory function to insert\
    \ a post-constructor call. Consider:\n\n```\n~~~cpp\nclass B {               \
    \                          // hierarchy root\nprotected:\n    B() { /* ... */\
    \ }\n\n    virtual void PostInitialize() { /* ... */ }    // called right after\
    \ construction\n\npublic:\n    template<class T>\n    static shared_ptr<T> Create()\
    \ {                // interface for creating objects\n        shared_ptr<T> p(\
    \ new T );\n        p->PostInitialize();\n        return p;\n    }\n};\n\nclass\
    \ D : public B { /* ... */ };                  // some derived class\n\nshared_ptr<D>\
    \ p = D::Create<D>();                  // creating a D object\n~~~\n```\n\nThis\
    \ rather fragile design sports the following tradeoffs:\n\n+   - Derived classes\
    \ such as **D** must not expose a public constructor. Otherwise, **D**'s users\
    \ could create **D** objects that don't invoke **PostInitialize**.\n+   - Allocation\
    \ is limited to **operator new**. **B** can, however, override **new** (see Items\
    \ 45 and 46).\n+   - **D** must define a constructor with the same parameters\
    \ that **B** selected. Defining several overloads of **Create** can assuage this\
    \ problem, however; and the overloads can even be templated on the argument types.\n\
    +   - If the requirements above are met, the design guarantees that **PostInitialize**\
    \ has been called for any fully constructed **B**-derived object. **PostInitialize**\
    \ doesn't need to be virtual; it can, however, invoke virtual functions freely.\n\
    \n# **References**\n\n*[Alexandrescu01] §3 • [Boost] • [Dewhurst03] §75 • [Meyers97]\
    \ §46 • [Stroustrup00] §15.4.3 • [Taligent94]*"
