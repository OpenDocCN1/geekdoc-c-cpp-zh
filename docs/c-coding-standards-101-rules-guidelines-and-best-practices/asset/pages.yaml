- pgno: 18
  md: '# # 0. Don’t sweat the small stuff. (Or: Know what not to standardize.)


    # ## Summary


    Say only what needs saying: Don’t enforce personal tastes or obsolete practices.


    # ## Discussion


    Issues that are really just personal taste and don’t affect correctness or readability
    don’t belong in a coding standard. Any professional programmer can easily read
    and write code that is formatted a little differently than they’re used to.


    Do use consistent formatting within each source file or even each project, because
    it’s jarring to jump around among several styles in the same piece of code. But
    don’t try to enforce consistent formatting across multiple projects or across
    a company.


    Here are several common issues where the important thing is not to set a rule
    but just to be consistent with the style already in use within the file you’re
    maintaining:


    +   - Don’t specify how much to indent, but do indent to show structure: Use any
    number of spaces you like to indent, but be consistent within at least each file.

    +   - Don’t enforce a specific line length, but do keep line lengths readable:
    Use any length of line you like, but don’t be excessive. Studies show that up
    to ten-word text widths are optimal for eye tracking.

    +   - Don’t overlegislate naming, but do use a consistent naming convention: There
    are only two must-dos: a) never use “underhanded names,” ones that begin with
    an underscore or that contain a double underscore; and b) always use ONLY_UPPERCASE_NAMES
    for macros and never think about writing a macro that is a common word or abbreviation
    (including common template parameters, such as T and U; writing #define T anything
    is extremely disruptive). Otherwise, do use consistent and meaningful names and
    follow a file’s or module’s convention. (If you can’t decide on your own naming
    convention, try this one: Name classes, functions, and enums LikeThis; name variables
    likeThis; name private member variables likeThis_; and name macros LIKE_THIS.)

    +   - Don’t prescribe commenting styles (except where tools extract certain styles
    into documentation), but do write useful comments: Write code instead of comments
    where possible (e.g., see Item 16). Don’t write comments that repeat the code;
    they get out of sync. Do write illuminating comments that explain approach and
    rationale.


    Finally, don’t try to enforce antiquated rules (see Examples 3 and 4) even if
    they once appeared in older coding standards.


    # ## Examples


    *Example 1: Brace placement.* There is no readability difference among:'
