    +   - If s3.h comes before s2.h, B::g will call A::f(int).

    +   - Else if s1.h comes before s2.h, B::g will call A::f(double).

    +   - Else B::g won''t compile at all.


    This is worse because two implementation files can include the headers in *different
    orders*. Consider what happens if `client_code_1.cpp` includes `s1.h`, `s2.h`,
    and `s4.h` in that order, but `client_code_2.cpp` includes `s3.h`, `s2.h`, and
    `s4.h` in that order. Then, `B::g` violates the One Definition Rule (ODR) because
    it has two inconsistent and incompatible implementations that can''t both be right—one
    that tries to call `A::f(int)` and one that tries to call `A::f(double)`.


    So don''t write namespace `using` declarations or `using` directives in a header
    file, or before an `#include` directive in an implementation file. You are liable
    to affect the meaning of later code by causing namespace pollution, by taking
    an incomplete snapshot of the names that you want to import, or both. (Note the
    qualifier "*namespace* `using` declarations or `using` directives." This doesn''t
    apply to writing class member `using` declarations to bring in base class member
    names as needed.)


    In all headers, and in all implementation files before the last `#include`, always
    explicitly namespace-qualify all names. In implementation files after all `#includes`,
    you can and should write namespace `using` declarations and directives liberally.
    This is the right way to reconcile code brevity with modularity.


    # ### Exceptions


    Migrating a large project from an old, pre-ANSI/ISO implementation of the standard
    library (one that puts all of its symbols in the global namespace) to an updated
    one (where most everything is in namespace `std`) might force you to carefully
    put a `using` directive in a header file. The way to do that is described in [Sutter02].


    # ### References


    [*Stroustrup00*] §9.2.1 • [*Sutter02*] §39-40'
