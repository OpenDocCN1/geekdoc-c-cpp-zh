  md: "# # 97. Don’t use unions to reinterpret representation.\n\n# ## Summary\n\n\
    A deceit is still a lie: Unions can be abused into obtaining a “cast without a\
    \ cast” by writing one member and reading another. This is more insidious and\
    \ even less predictable than **reinterpret_cast** (see Item 92).\n\n# ## Discussion\n\
    \nDon’t read a field of a **union** unless it was the field that was last written.\
    \ Reading a different field of a **union** than the field that was last written\
    \ has undefined behavior, and is even worse than doing a **reinterpret_cast**\
    \ (see Item 92); at least with the latter the compiler has the fighting chance\
    \ to warn and repel an “impossible reinterpretation” such as pointer to **char**.\
    \ When abusing a **union**, no reinterpretation of bits will ever yield a compile-time\
    \ error or a reliable result.\n\nConsider this code that is intended to deposit\
    \ a value of one type (**char***) and extract the bits of that value as a different\
    \ type (**long**):\n\n```\n```cpp\nunion {\n    long intValue_;\n    char* pointerValue_;\n\
    };\n\npointerValue_ = somePointer;\nlong int gotcha = intValue_;\n```\n```\n\n\
    This has two problems:\n\n+   - It assumes too much: It assumes that **sizeof(long)**\
    \ and **sizeof(char*)** are equal, and that the bit representations are identical.\
    \ These things are not true on all implementations (see Item 91).\n+   - It obscures\
    \ your intent for both human readers and compilers: Playing **union** games makes\
    \ it harder for compilers to catch genuine type errors, and for humans to spot\
    \ logical errors, even than the infamous **reinterpret_cast** (see Item 92).\n\
    \n# ## Exceptions\n\nIf two POD **struct**s are members of a **union** and start\
    \ with the same field types, it is legal to write one such matching field and\
    \ read another.\n\n# ## References\n\n*[Alexandrescu02b]* • *[Stroustrup00]* §C.8.2\
    \ • *[Sutter04]* §36"
  merge: -1
