  md: "# 15. **Use const proactively.**\n\n# Summary\n\n**const** is your friend:\
    \ Immutable values are easier to understand, track, and reason about, so prefer\
    \ constants over variables wherever it is sensible and make **const** your default\
    \ choice when you define a value: It’s safe, it’s checked at compile time (see\
    \ Item 14), and it’s integrated with C++’s type system. Don’t cast away **const**\
    \ except to call a const-incorrect function (see Item 94).\n\n# Discussion\n\n\
    Constants simplify code because you only have to look at where the constant is\
    \ defined to know its value everywhere. Consider this code:\n\n```\nvoid Fun(\
    \ vector<int>& v) {\n    // ...\n\n    const size_t len = v.size();\n\n    //\
    \ ... 30 more lines ...\n}\n```\n\nWhen seeing **len**’s definition above, you\
    \ gain instant confidence about **len**’s semantics throughout its scope (assuming\
    \ the code doesn’t cast away **const**, which it should not do; see below): It’s\
    \ a snapshot of **v**’s length at a specific point. Just by looking up one line\
    \ of code, you know **len**’s semantics over its whole scope. Without the **const**,\
    \ **len** might be later modified, either directly or through an alias. Best of\
    \ all, the compiler will help you ensure that this truth remains true.\n\nNote\
    \ that **const** is not deep. For example, consider a class C that has a member\
    \ of type X*. In C’s objects that are **const**, the X* member is also **const**—but\
    \ the X object that is pointed to is not. (See [Saks99].)\n\nImplement logical\
    \ constness with **mutable** members. When a **const** member function of a class\
    \ legitimately needs to modify a member variable (i.e., when the variable does\
    \ not affect the object’s observable state, such as cached data), declare that\
    \ member variable **mutable**. Note that all private members are hidden using\
    \ the Pimpl idiom (see Item 43), **mutable** is not needed on either the cached\
    \ information or the unchanging pointer to it.\n\nYes, const is “viral”—add it\
    \ in one place, and it wants to propagate throughout your code as you call other\
    \ functions whose signatures aren’t yet const-correct. This is a"
