- pgno: 27
  md: '# # Design Style


    > *Fools ignore complexity. Pragmatists suffer it. Some can avoid it. Geniuses
    remove it.*

    > —Alan Perlis


    > *But I also knew, and forgot, Hoare''s dictum that premature optimization is
    the root of all evil in programming.*

    > —Donald Knuth,

    > *The Errors of TeX* [Knuth89]


    It''s difficult to fully separate Design Style and Coding Style. We have tried
    to leave to the next section those Items that generally crop up when actually
    writing code.


    This section focuses on principles and practices that apply more broadly than
    just to a particular class or function. A classic case in point is the balance
    among simplicity and clarity (Item 6), avoiding premature optimization (Item 8),
    and avoiding premature pessimization (Item 9). Those three Items apply, not just
    at the function-coding level, but to the larger areas of class and module design
    tradeoffs and to far-reaching application architecture decisions. (They also apply
    to all programmers. If you think otherwise, please reread the above Knuth quote
    and note its citation.)


    Following that, many of the other Items in this and the following section deal
    with aspects of dependency management—a cornerstone of software engineering and
    a recurring theme throughout the book. Stop and think of some random good software
    engineering technique—*any* good technique. Whichever one you picked, in one way
    or another it will be about reducing dependencies. Inheritance? Make code written
    to use the base class less dependent on the actual derived class. Minimize global
    variables? Reduce long-distance dependencies through widely visible data. Abstraction?
    Eliminate dependencies between code that manipulates concepts and code that implements
    them. Information hiding? Make client code less dependent on an entity''s implementation
    details. An appropriate concern for dependency management is reflected in avoiding
    shared state (Item 10), applying information hiding (Item 11), and much more.


    Our vote for the most valuable Item in this section goes to Item 6: Correctness,
    simplicity, and clarity come first. That they really, really must.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 5. Give one entity one cohesive responsibility.


    # Summary


    Focus on one thing at a time: Prefer to give each entity (variable, class, function,
    namespace, module, library) one well-defined responsibility. As an entity grows,
    its scope of responsibility naturally increases, but its responsibility should
    not diverge.


    # Discussion


    A good business idea, they say, can be explained in one sentence. Similarly, each
    program entity should have one clear purpose.


    An entity with several disparate purposes is generally disproportionately harder
    to use, because it carries more than the sum of the intellectual overhead, complexity,
    and bugs of its parts. Such an entity is larger (often without good reason) and
    harder to use and reuse. Also, such an entity often offers crippled interfaces
    for any of its specific purposes because the partial overlap among various areas
    of functionality blurs the vision needed for crisply implementing each.


    Entities with disparate responsibilities are typically hard to design and implement.
    “Multiple responsibilities” frequently implies “multiple personalities”—a combinatorial
    number of possible behaviors and states. Prefer brief single-purpose functions
    (see also Item 39), small single-purpose classes, and cohesive modules with clean
    boundaries.


    Prefer to build higher-level abstractions from smaller lower-level abstractions.
    Avoid collecting several low-level abstractions into a larger low-level conglomerate.
    Implementing a complex behavior out of several simple ones is easier than the
    reverse.


    # Examples


    *Example 1: realloc.* In Standard C, `realloc` is an infamous example of bad design.
    It has to do too many things: allocate memory if passed `NULL`, free it if passed
    a zero size, reallocate it in place if it can, or move memory around if it is
    not. It is not easily extensible. It is widely viewed as a shortsighted design
    failure.


    *Example 2: basic_string.* In Standard C++, `std::basic_string` is an equally
    infamous example of monolithic class design. Too many “nice-to-have” features
    were added to a bloated class that tries to be a container but isn’t quite, is
    undecided on iteration vs. indexing, and gratuitously duplicates many standard
    algorithms while leaving little space for extensibility. (See Item 44’s Example.)


    # References


    [Henney02a] • [Henney02b] • [McConnell93] §10.5 • [Stroustrup00] §3.8, §4.9.4,
    §23.4.3.1 • [Sutter00] §10, §12, §19, §23 • [Sutter02] §1 • [Sutter04] §37-40'
