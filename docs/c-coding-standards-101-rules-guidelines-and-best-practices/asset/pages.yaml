  md: "+   80. Prefer **push_back** to other ways of expanding a sequence.\n+   \n\
    +      *push_back* all you can: If you don’t need to care about the insert position,\
    \ prefer using *push_back* to add an element to a sequence. Other means can be\
    \ both vastly slower and less clear.\n\n+   81. Prefer range operations to single-element\
    \ operations.\n+   \n+      *Don’t use oars when the wind is fair* (based on a\
    \ Latin proverb): When adding elements to sequence containers, prefer to use range\
    \ operations (e.g., the form of *insert* that takes a pair of iterators) instead\
    \ of a series of calls to the single-element form of the operation. Calling the\
    \ range operation is generally easier to write, easier to read, and more efficient\
    \ than an explicit loop. (See also Item 84.)\n\n+   82. Use the accepted idioms\
    \ to really shrink capacity and really erase elements.\n+   \n+      Use a diet\
    \ that works: To really shed excess capacity from a container, use the “swap trick.”\
    \ To really erase elements from a container, use the erase-remove idiom.\n\n#\
    \ STL: Algorithms\n\n+   83. Use a checked STL implementation.\n+   \n+      *Safety\
    \ first* (see Item 6): Use a checked STL implementation, even if it’s only available\
    \ for one of your compiler platforms, and even if it’s only used during pre-release\
    \ testing.\n\n+   84. Prefer algorithm calls to handwritten loops.\n+   \n+  \
    \    Use function objects judiciously: For very simple loops, handwritten loops\
    \ can be the simplest and most efficient solution. But writing algorithm calls\
    \ instead of handwritten loops can be more expressive and maintainable, less error-prone,\
    \ and as efficient.\n+   \n+      When calling algorithms, consider writing your\
    \ own custom function object that encapsulates the logic you need. Avoid cobbling\
    \ together parameter-binders and simple function objects (e.g., *bind2nd*, *plus*),\
    \ which usually degrade clarity. Consider trying the [Boost] Lambda library, which\
    \ automates the task of writing function objects.\n\n+   85. Use the right STL\
    \ search algorithm.\n+   \n+      *Search “just enough”*—the right search may\
    \ be STL (slower than light), but it’ll still be pretty fast: This Item applies\
    \ to searching for a particular value in a range, or for the location where it\
    \ would be if it were in the range. To search an unsorted range, use *find/find_if*\
    \ or *count/count_if*. To search a sorted range, use *lower_bound*, *upper_bound*,\
    \ *equal_range*, or (rarely) *binary_search*. (Despite its common name, *binary_search*\
    \ is usually not the right choice.)\n\n+   86. Use the right STL sort algorithm.\n\
    +   \n+      *Sort “just enough”:* Understand what each of the sorting algorithms\
    \ does, and use the cheapest algorithm that does what you need.\n\n+   87. Make\
    \ predicates pure functions.\n+   \n+      Predicate purity: A predicate is a\
    \ function object that returns a yes/no answer, typically as a **bool** value.\
    \ A function is pure in the mathematical sense if its result depends only on its\
    \ arguments (note that this use of “pure” has nothing to do with pure virtual\
    \ functions).\n+   \n+      Don’t allow predicates to hold or access state that\
    \ affects the result of their *operator()*, including both member and global state.\
    \ Prefer to make *operator()* a **const** member function for predicates (see\
    \ Item 15)."
