- pgno: 198
  md: "# 96. Don’t memcpy or memcmp non-PODs.\n\n# Summary\n\nDon’t try to X-ray objects\
    \ (see Item 91): Don’t use **memcpy** and **memcmp** to copy or compare anything\
    \ more structured than raw memory.\n\n# Discussion\n\n**memcpy** and **memcmp**\
    \ violate the type system. Using **memcpy** to copy objects is like making money\
    \ using a photocopier. Using **memcmp** to compare objects is like comparing leopards\
    \ by counting their spots. The tools and methods might appear to do the job, but\
    \ they are too coarse to do it acceptably.\n\nC++ objects are all about information\
    \ hiding (arguably the most profitable principle in software engineering; see\
    \ Item 11): Objects hide data (see Item 41) and devise precise abstractions for\
    \ copying that data through constructors and assignment operators (see Items 52\
    \ through 55). Bulldozing over all that with **memcpy** is a serious violation\
    \ of information hiding, and often leads to memory and resource leaks (at best),\
    \ crashes (worse), or undefined behavior (worst). For example:\n\n```\n```cpp\n\
    {\n    shared_ptr<int> p1( new int ), p2( new int );    // create two ints on\
    \ the heap\n    memcpy( &p1, &p2, sizeof(p1) );                  // bad: a heinous\
    \ crime\n} // memory leak: p2’s int is never deleted\n  // memory corruption:\
    \ p1’s int is deleted twice\n```\n```\n\nAbusing **memcpy** can affect aspects\
    \ as fundamental as the type and the identity of an object. Compilers often embed\
    \ hidden data inside polymorphic objects (the so-called virtual table pointer,\
    \ or **vptr**) that give the object its run-time identity. In the case of multiple\
    \ inheritance, several such **vptrs** can coexist at various offsets inside the\
    \ object, and most implementations add yet more internal pointers when using virtual\
    \ inheritance. During normal use, the compiler takes care of managing all of these\
    \ hidden fields; **memcpy** can only wreak havoc.\n\nSimilarly, **memcmp** is\
    \ an inappropriate tool for comparing anything more elaborate than bits. Sometimes,\
    \ it does too little (e.g., comparing C-style strings is not the same as comparing\
    \ the pointers with which the strings are implemented). And sometimes, paradoxically,\
    \ **memcmp** does too much (e.g., **memcmp** will needlessly compare bytes that\
    \ are not part of an object’s state, such as padding inserted by the compiler\
    \ for alignment purposes). In both cases, the comparison’s result will be wrong.\n\
    \n# References\n\n[Dewhurst03] §50 • [Stroustrup94] §11.4.4"
