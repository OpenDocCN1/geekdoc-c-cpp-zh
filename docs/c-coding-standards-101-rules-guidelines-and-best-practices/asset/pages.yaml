  md: '# # 36. Prefer providing abstract interfaces.


    # **Summary**


    Love abstract art: Abstract interfaces help you focus on getting an abstraction
    right without muddling it with implementation or state management details. Prefer
    to design hierarchies that implement abstract interfaces that model abstract concepts.


    # **Discussion**


    Prefer to define and inherit from abstract interfaces. An abstract interface is
    an abstract class made up entirely of (pure) virtual functions and having no state
    (member data) and usually no member function implementations. Note that avoiding
    state in abstract interfaces simplifies the entire hierarchy design (see [Meyers96]
    for examples).


    Prefer to follow the Dependency Inversion Principle (DIP; see [Martin96a] and
    [Martin00]). The DIP states that:


    +   - High-level modules should not depend upon low-level modules. Rather, both
    should depend upon abstractions.

    +   - Abstractions should not depend upon details. Rather, details should depend
    upon abstractions.


    Respecting the DIP implies that hierarchies should be rooted in abstract classes,
    not concrete classes. (See Item 35.) The abstract base classes must worry about
    defining functionality, not about implementing it. Put another way: Push policy
    up and implementation down.


    The Dependency Inversion Principle has three fundamental design benefits:


    +   - *Improved robustness:* The less stable parts of a system (implementations)
    depend on more stable parts (abstractions). A robust design is one in which changes
    have localized effect. In a fragile system, on the other hand, a small change
    ripples in unfortunate ways through unexpected parts of the system. This is exactly
    what happens with designs that have concrete base classes.

    +   - *Greater flexibility:* Designs based on abstract interfaces are generally
    more flexible. If the abstractions are properly modeled, it is easy to devise
    new implementations for new requirements. On the contrary, a design that depends
    on many concrete details is rigid, in that new requirements lead to core changes.

    +   - *Good modularity:* A design relying on abstractions has good modularity
    because its dependencies are simple: Highly changeable parts depend on stable
    parts, not vice versa. At the other extreme, a design that has interfaces mixed
    with im-'
