- pgno: 37
  md: '# 12. Know when and how to code for concurrency.


    **Summary**


    The **rule**: If your application uses multiple threads or processes, know how
    to minimize sharing objects where possible (see Item 10) and share the right ones
    safely.


    **Discussion**


    Threading is a huge domain. This Item exists because that domain is important
    and needs to be explicitly acknowledged, but one Item can’t do it justice and
    we will only summarize a few essentials; see the References for many more details
    and techniques. Among the most important issues are to avoid deadlocks, livelocks,
    and malign race conditions (including corruption due to insufficient locking).


    The C++ Standard says not one word about threads. Nevertheless, C++ is routinely
    and widely used to write solid multithreaded code. If your application shares
    data across threads, do so safely:


    +   - *Consult your target platforms’ documentation for local synchronization
    primitives:* Typical ones range from lightweight atomic integer operations to
    memory barriers to in-process and cross-process mutexes.

    +   - *Prefer to wrap the platform’s primitives in your own abstractions:* This
    is a good idea especially if you need cross-platform portability. Alternatively,
    you can use a library (e.g., pthreads [Butenhof97]) that does it for you.

    +   - *Ensure that the types you are using are safe to use in a multithreaded
    program:* In particular, each type must at minimum:

    +     - *Guarantee that unshared objects are independent:* Two threads can freely
    use different objects without any special action on the caller’s part.

    +     - *Document what the caller needs to do to use the same object of that type
    in different threads:* Many types will require you to serialize access to such
    shared objects, but some types do not; the latter typically either design away
    the locking requirement, or they do the locking internally themselves, in which
    case, you still need to be aware of the limits of what the internal locking granularity
    will do.


