    \ compiler cannot detect: A further-derived class in the hierarchy can still forget\
    \ to implement Clone, and an override of Clone could implement it improperly so\
    \ that the copy is not the same type as the original. Clone should apply the Nonvirtual\
    \ Interface pattern (NVI; see Item 39), which separates Clone’s public and virtual\
    \ natures and lets you plant a valuable assertion:\n\n```\nclass B { // ...\n\
    public:\n  B* Clone() const {                         // nonvirtual\n    B* p\
    \ = DoClone();\n    assert( typeid(*p) == typeid(*this) && \"DoClone incorrectly\
    \ overridden\" );\n                                                // check DoClone’s\
    \ returned type\n    return p;\n  }\n\nprotected:\n  B( const B& );\n\nprivate:\n\
    \  virtual B* DoClone() const = 0;\n};\n```\n\nClone is now the nonvirtual interface\
    \ used by all calling code. Derived classes only need to override DoClone. The\
