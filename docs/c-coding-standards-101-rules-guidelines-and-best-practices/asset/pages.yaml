- pgno: 2
  md: '# # The C++ In-Depth Series


    Bjarne Stroustrup, Editor


    > > “I have made this letter longer than usual, because I lack the time to make
    it short.”

    > > —Blaise Pascal


    The advent of the ISO/ANSI C++ standard marked the beginning of a new era for
    C++ programmers. The standard offers many new facilities and opportunities, but
    how can a real-world programmer find the time to discover the key nuggets of wisdom
    within this mass of information? The **C++ In-Depth Series** minimizes learning
    time and confusion by giving programmers concise, focused guides to specific topics.


    Each book in this series presents a single topic, at a technical level appropriate
    to that topic. The Series'' practical approach is designed to lift professionals
    to their next level of programming skills. Written by experts in the field, these
    short, in-depth monographs can be read and referenced without the distraction
    of unrelated material. The books are cross-referenced within the Series, and also
    reference *The C++ Programming Language* by Bjarne Stroustrup.


    As you develop your skills in C++, it becomes increasingly important to separate
    essential information from hype and glitz, and to find the in-depth content you
    need in order to grow. The C++ In-Depth Series provides the tools, concepts, techniques,
    and new approaches to C++ that will give you a critical edge.


    # ## Titles in the Series


    +   - *Accelerated C++: Practical Programming by Example*, Andrew Koenig and Barbara
    E. Moo

    +   - *Applied C++: Practical Techniques for Building Better Software*, Philip
    Romanik and Amy Muntz

    +   - *The Boost Graph Library: User Guide and Reference Manual*, Jeremy G. Siek,
    Lie-Quan Lee, and Andrew Lumsdaine

    +   - *C++ Coding Standards: 101 Rules, Guidelines, and Best Practices*, Herb
    Sutter and Andrei Alexandrescu

    +   - *C++ In-Depth Box Set*, Bjarne Stroustrup, Andrei Alexandrescu, Andrew Koenig,
    Barbara E. Moo, Stanley B. Lippman, and Herb Sutter

    +   - *C++ Network Programming, Volume 1: Mastering Complexity with ACE and Patterns*,
    Douglas C. Schmidt and Stephen D. Huston

    +   - *C++ Network Programming, Volume 2: Systematic Reuse with ACE and Frameworks*,
    Douglas C. Schmidt and Stephen D. Huston

    +   - *C++ Template Metaprogramming: Concepts, Tools, and Techniques from Boost
    and Beyond*, David Abrahams and Aleksey Gurtovoy

    +   - *Essential C++*, Stanley B. Lippman

    +   - *Exceptional C++: 47 Engineering Puzzles, Programming Problems, and Solutions*,
    Herb Sutter

    +   - *Exceptional C++ Style: 40 New Engineering Puzzles, Programming Problems,
    and Solutions*, Herb Sutter

    +   - *Modern C++ Design: Generic Programming and Design Patterns Applied*, Andrei
    Alexandrescu

    +   - *More Exceptional C++: 40 New Engineering Puzzles, Programming Problems,
    and Solutions*, Herb Sutter


    For more information, check out the series web site at www.awprofessional.com/series/indepth/'
