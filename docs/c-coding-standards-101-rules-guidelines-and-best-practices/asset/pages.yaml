- pgno: 95
  md: "# # 44. Prefer writing nonmember nonfriend functions.\n\n# ## Summary\n\nAvoid\
    \ membership fees: Where possible, prefer making functions nonmember nonfriends.\n\
    \n# ## Discussion\n\nNonmember nonfriend functions improve encapsulation by minimizing\
    \ dependencies: The body of the function cannot come to depend on the nonpublic\
    \ members of the class (see Item 11). They also break apart monolithic classes\
    \ to liberate separable functionality, further reducing coupling (see Item 33).\
    \ They improve genericity, because it's hard to write templates that don't know\
    \ whether or not an operation is a member for a given type (see Item 67).\n\n\
    Use this algorithm to determine whether a function should be a member and/or friend:\n\
    \n```\n```cpp\n// If you have no choice then you have no choice; make it a member\
    \ if it must be:\nIf the function is one of the operators =, ->, [], or (), which\
    \ must be members:\n    Make it a member.\n// If it can be a nonmember nonfriend,\
    \ or benefits from being a nonmember friend, do it:\nElse if: a) the function\
    \ needs a different type as its left-hand argument (as do operators >> or <<,\
    \ for example); or b) it needs type conversions on its leftmost argument; or c)\
    \ it can be implemented using the class's public interface alone:\n    Make it\
    \ a nonmember (and friend if needed in cases a) and b) ).\n    If it needs to\
    \ behave virtually:\n        Add a virtual member function to provide the virtual\
    \ behavior, and implement the nonmember in terms of that.\nElse: Make it a member.\n\
    ```\n```\n\n# ## Examples\n\n*Example: **basic_string***. The standard **basic_string**\
    \ is a needlessly monolithic class with 103 member functions—of which 71 could\
    \ be written as nonmember nonfriends without loss of efficiency. Many of them\
    \ duplicate functionality already available as algorithms, or are themselves algorithms\
    \ that would be useful more widely if they weren't buried inside **basic_string**.\
    \ (See Items 5 and 32, and [Sutter04].)\n\n# ## References\n\n[Lakos96] §3.6.1,\
