  md: "# 43. Pimpl judiciously.\n\n# Summary\n\nOvercome the language’s separation\
    \ anxiety: C++ makes private members inaccessible, but not invisible. Where the\
    \ benefits warrant it, consider making private members truly invisible using the\
    \ Pimpl idiom to implement compiler firewalls and increase information hiding.\
    \ (See Items 11 and 41.)\n\n# Discussion\n\nWhen it makes sense to create a “compiler\
    \ firewall” that completely insulates calling code from a class’s private parts,\
    \ use the Pimpl idiom: Hide them behind an opaque pointer (a pointer, preferably\
    \ an appropriate smart pointer, to a class that is declared but not yet defined).\
    \ For example:\n\n```\nclass Map {\n  // ...\n  private:\n    struct Impl;\n \
    \   shared_ptr<Impl> pimpl_;\n};\n```\n\nThe eponymous Pimpl should be used to\
    \ store all private members, both member data and private member functions. This\
    \ allows you to make arbitrary changes to your class’s private implementation\
    \ details without any recompilation of calling code—an independence and liberty\
    \ that is the hallmark of the idiom. (See Item 41.)\n\nNote: Do declare the Pimpl\
    \ using two declarations as shown. It would be legal, but have a different meaning,\
    \ to combine the two lines and forward-declare the type and a pointer to it in\
    \ one statement with `struct Impl* pimpl;`—but then `Impl` is in the enclosing\
    \ namespace and not a nested type within your class.\n\nThere are at least three\
    \ reasons you might use Pimpl, and they all stem from C++’s distinction between\
    \ accessibility (whether you can call or use something) and visibility (whether\
    \ you can see it and therefore depend on its definition). In particular, all private\
    \ members of a class are inaccessible outside member functions and friends, but\
    \ are visible to the entire world—to all code that sees the class’s definition.\n\
    \nThe first consequence of this is potentially longer build times due to processing\
    \ unnecessary type definitions. For private data members held by value, and for\
    \ private member functions’ parameters taken by value or used in visible function\
    \ implementations, types must be defined even if they can never be needed in this\
    \ compilation unit. This can lead to longer build times. For example:"
