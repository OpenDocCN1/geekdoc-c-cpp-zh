- pgno: 109
  md: "+   - You can’t reliably create arrays of **Nefarious**: In short, the behavior\
    \ of arrays is undefined in the presence of destructors that throw because there\
    \ is no reasonable rollback behavior that could ever be devised. (Just think:\
    \ What code can the compiler generate for constructing an array of ten **Nefarious**\
    \ objects where, if the fourth object’s constructor throws, the code has to give\
    \ up and in its cleanup mode tries to call the destructors of the already-constructed\
    \ objects… and one or more of those destructors throws? There is no satisfactory\
    \ answer.)\n+   - You can’t use **Nefarious** objects in standard containers:\
    \ You can’t store **Nefarious** objects in standard containers or use them with\
    \ any other part of the standard library. The standard library forbids all destructors\
    \ used with it from throwing.\n\nDeallocation functions, including specifically\
    \ overloaded **operator delete** and **operator delete[]**, fall into the same\
    \ category, because they too are used during cleanup in general, and during exception\
    \ handling in particular, to back out of partial work that needs to be undone.\n\
    \nBesides destructors and deallocation functions, common error-safety techniques\
    \ rely also on swap operations never failing—in this case, not because they are\
    \ used to implement a guaranteed rollback, but because they are used to implement\
    \ a guaranteed commit. For example, here is an idiomatic implementation of **operator=**\
    \ for a type T that performs copy construction followed by a call to a no-fail\
    \ **Swap**:\n\n```\nT& T::operator=( const T& other ) {\n    T temp( other );\n\
    \    Swap( temp );\n}\n```\n\n(See also Item 56.)\n\nFortunately, when releasing\
    \ a resource, the scope for failure is definitely smaller. If using exceptions\
    \ as the error reporting mechanism, make sure such functions handle all exceptions\
    \ and other errors that their internal processing might generate. (For exceptions,\
    \ simply wrap everything sensitive that your destructor does in a **try/catch(...)**\
    \ block.) This is particularly important because a destructor might be called\
    \ in a crisis situation, such as failure to allocate a system resource (e.g.,\
    \ memory, files, locks, ports, windows, or other system objects).\n\nWhen using\
    \ exceptions as your error handling mechanism, prefer documenting this behavior\
    \ by declaring these functions with a commented empty exception specification\
    \ of **/* throw() */**. (See Item 75.)\n\n# References\n\n[C++03] §15.2(3), §17.4.4.8(3)\
    \ • [Meyers96] §11 • [Stroustrup00] §14.4.7, §E.2-4 • [Sutter00] §8, §16 • [Sutter02]\
    \ §18-19"
