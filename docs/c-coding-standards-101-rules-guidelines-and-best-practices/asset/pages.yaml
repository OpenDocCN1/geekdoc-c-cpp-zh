  md: '# # 60. Avoid allocating and deallocating memory in different modules.


    # ## Summary


    Put things back where you found them: Allocating memory in one module and deallocating
    it in a different module makes your program fragile by creating a subtle long-distance
    dependency between those modules. They must be compiled with the same compiler
    version and same flags (notably debug vs. NDEBUG) and the same standard library
    implementation, and in practice the module allocating the memory had better still
    be loaded when the deallocation happens.


    # ## Discussion


    Library writers want to improve the quality of their libraries, and as a direct
    consequence the internal data structures and algorithms used by the standard memory
    allocator can significantly vary from one version to the next. Furthermore, various
    compiler switches (e.g., turning debugging facilities on and off) can change the
    inner workings of the memory allocator significantly.


    Therefore, make very few assumptions about deallocation functions (e.g., ::operator
    delete or std::free) when you cross module boundaries—especially boundaries of
    modules that you can''t guarantee will be compiled with the same C++ compiler
    and the same build options. Often, it is the case that various modules are in
    the same makefile and compiled with the same options, but comfort often leads
    to forgetfulness. Especially when it comes to dynamically linked libraries, large
    projects distributed across large teams, or the challenging “hot swapping” of
    modules, you should pay maximum attention to allocate and deallocate within the
    same module or subsystem.


    A good way to ensure that deletion is performed by the appropriate function is
    to use the shared_ptr facility (see [C++TR104]). shared_ptr is a reference-counted
    smart pointer that can capture its “deleter” at construction time. The deleter
    is a function object (or a straight pointer to function) that performs deallocation.
    Because the said function object, or pointer to function, is part of the shared_ptr
    object’s state, the module allocating the object can at the same time specify
    the deallocation function, and that function will be called correctly even if
    the point of deallocation is somewhere within another module—admittedly at a slight
    cost. (Correctness is worth the cost; see also Items 5, 6, and 8.) Of course,
    the original module must remain loaded.


    # ## References


    > > [C++TR104]'
