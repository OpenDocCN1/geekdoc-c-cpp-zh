- pgno: 103
  md: "# # 48. Prefer initialization to assignment in constructors.\n\n# ## Summary\n\
    \nSet once, use everywhere: In constructors, using initialization instead of assignment\
    \ to set member variables prevents needless run-time work and takes the same amount\
    \ of typing.\n\n# ## Discussion\n\nConstructors generate initialization code under\
    \ the covers. Consider:\n\n```\n```cpp\nclass A {\n  string s1_, s2_;\npublic:\n\
    \  A() { s1_ = \"Hello, \"; s2_ = \"world\"; }\n};\n```\n```\n\nIn reality, constructor’s\
    \ code is generated as if you wrote:\n\n```\n```cpp\nA::A() : s1_(), s2_() { s1_\
    \ = \"Hello, \"; s2_ = \"world\"; }\n```\n```\n\nThat is, the objects not explicitly\
    \ initialized by you are automatically initialized using their default constructors,\
    \ and then assigned to using their assignment operators. Most often, the assignment\
    \ operator of a nontrivial object needs to do slightly more than a constructor\
    \ because it needs to deal with an already-constructed object.\n\nSay what you\
    \ mean: Initialize member variables in the initializer list, with code that better\
    \ expresses intent and in addition, as a perk, is usually smaller and faster:\n\
    \n```\n```cpp\nA::A() : s1_(\"Hello, \"), s2_(\"world\") {}\n```\n```\n\nThis\
    \ isn’t premature optimization; it’s avoiding premature pessimization. (See Item\
    \ 9.)\n\n# ## Exceptions\n\nAlways perform unmanaged resource acquisition, such\
    \ as a **new** expression whose result is not immediately passed to a smart pointer\
    \ constructor, in the constructor body and not in initializer lists (see [Sutter02]).\
    \ Of course, it’s better to not have such unsafe unowned resources in the first\
    \ place (see Item 13).\n\n# ## References\n\n*[Dewhurst03] §51, §59 • [Keffer95]\
    \ pp.13-14 • [Meyers97] §12 • [Murray93] §2.1.31 • [Sutter00] §8, §47 • [Sutter02]\
    \ §18*"
