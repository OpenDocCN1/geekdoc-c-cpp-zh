  md: "the compiler is concerned, returning **handle_** preserves constness just fine.\
    \ However, raw calls to system functions using **handle_**’s value can certainly\
    \ modify data that **handle_** refers to indirectly.\n\nThe following pointer\
    \ example is similar, although we’ll see that the situation is slightly better\
    \ because at least a **const** return type can reduce accidental misuses:\n\n\
    ```\nclass String {\n  char* buffer_;\npublic:\n  char* GetBuffer() const { return\
    \ buffer_; }  // bad: should return const char*\n  // ...\n};\n```\n\nEven though\
    \ **GetBuffer** is **const**, this code is technically valid and legal. Clearly,\
    \ a client can use this **GetBuffer** to change a **String** object in quite major\
    \ ways without explicit casting and therefore accidentally; for example, **strcpy(\
    \ s.GetBuffer(), “Very Long String...” )** is legal code; in practice, every compiler\
    \ we tried compiles it without a warning. Returning **const char*** instead from\
    \ this member function would at least cause a compile-time error for such misuses\
    \ so they could not occur accidentally; such calling code would have to write\
    \ an explicit cast (see Items 92 to 95).\n\nEven returning pointers to **const**\
    \ does not eliminate all accidental misuses, because another problem with giving\
    \ away object internals has to do with the internals’ validity. In the above **String**\
    \ example, calling code might store the pointer returned by **GetBuffer**, then\
    \ perform an operation that causes the **String** to grow (and move) its buffer,\
    \ and finally (and apocalyptically) try to use the saved-and-now-invalidated dangling\
    \ pointer to a buffer that no longer exists. Thus, if you do think you have a\
    \ good reason to yield such internal state, you must still document in detail\
    \ how long the returned value remains valid and what operations will invalidate\
    \ it (compare this with the standard library’s explicit iterator validity guarantees;\
    \ see [C++03]).\n\n# Exceptions\n\nSometimes classes must provide access to internal\
    \ handles for compatibility reasons, such as interfacing with legacy code or other\
    \ systems. For example, **std::basic_string** offers access to its internal handle\
    \ via the **data** and the **c_str** member functions for compatibility with functions\
    \ that expect C-style pointers—but that presumably do not store those pointers\
    \ or try to write through them! Such backdoor access functions are a necessary\
    \ evil that should be used rarely and cautiously, and the conditions under which\
    \ the handle remains valid must be carefully documented.\n\n# References\n\n*[C++03]\
    \ §23 • [Dewhurst03] §80 • [Meyers97] #29 • [Saks99] • [Stroustrup00] §7.3 • [Sutter02]\
    \ §9*"
