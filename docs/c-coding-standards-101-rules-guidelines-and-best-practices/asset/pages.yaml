    const double Widget::defaultPercent = 66.67; // value provided in definition\n\
    const int Widget::defaultWidth;              // definition required\n```\n```\n\
    \n# References\n\n*[Dewhurst03] §2 • [Kernighan99] §1.5 • [Stroustrup00] §4.8,\
    \ §5.4*"
