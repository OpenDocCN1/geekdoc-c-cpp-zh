  md: 'plementation details is likely to sport intricate webs of dependency that make
    it hard to reapply as a unit to plug into another system.


    The related Law of Second Chances states: “The most important thing to get right
    is the interface. Everything else can be fixed later. Get the interface wrong,
    and you may never be allowed to fix it.” [Sutter04]


    Typically, choose a public virtual destructor to enable polymorphic deletion (per
    Item 50), unless you use an object broker such as COM or CORBA that uses an alternate
    memory management mechanism.


    Be wary about using multiple inheritance of classes that are not abstract interfaces.
    Designs that use multiple inheritance can be very expressive, but are harder to
    get right and easier to get wrong. In particular, state management is particularly
    hard in designs using multiple inheritance.


    As noted in Item 34, inheriting from a type can also cause name lookup coupling:
    subtly pulling in functions from the namespace of that type. (See also Item 58.)


    # Examples


    *Example: Backup program.* In naïve designs, high-level components depend on low-level
    details. For example, an ill-designed backup program might have an archiving component
    that depends directly on types or routines that read the directory structure and
    others that write data on the tape. Adapting such a program to a new file system
    and backup hardware would incur significant redesign.


    If the logic of the backup system is designed around well-designed abstractions
    of a file system and backup device, no redesign is needed—only new implementations
    of the abstract interfaces must be added and plugged into the system. As should
    be natural, new requirements are met by new code; new requirements should not
    cause rework on existing code.


    # Exceptions


    The empty base optimization is one instance when inheritance (preferably nonpublic)
    is used for purely optimization purposes. (But see Item 8.)


    It would appear that policy-based designs have a high-level component depend on
    implementation details (the policies). However, that is only a use of static polymorphism.
    The abstract interfaces are there, except that they are implicit, not explicitly
    stated via pure virtual functions.


    # References


    *[Alexandrescu01]* • *[Cargill92] pp. 12-15, 215-218* • *[Cline99] §5.18-20, 21.13*
    • *[Lakos96] §6.4.1* • *[Martin96a]* • *[Martin00]* • *[Meyers96] §33* • *[Stroustrup00]
