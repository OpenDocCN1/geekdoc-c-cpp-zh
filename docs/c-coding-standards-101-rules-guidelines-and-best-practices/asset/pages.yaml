- pgno: 216
  md: "+   42. Don’t give away your internals.\n+   \n+      *Don’t volunteer too\
    \ much: Avoid returning handles to internal data managed by your class, so clients\
    \ won’t uncontrollably modify state that your object thinks it owns.*\n\n+   43.\
    \ Pimpl judiciously.\n+   \n+      *Overcome the language’s separation anxiety:\
    \ C++ makes private members inaccessible, but not invisible. Where the benefits\
    \ warrant it, consider making private members truly invisible using the Pimpl\
    \ idiom to implement compiler firewalls and increase information hiding. (See\
    \ Items 11 and 41.)*\n\n+   44. Prefer writing nonmember nonfriend functions.\n\
    +   \n+      *Avoid membership fees: Where possible, prefer making functions nonmember\
    \ nonfriends.*\n\n+   45. Always provide **new** and **delete** together.\n+ \
    \  \n+      *They’re a package deal: Every class-specific overload **void\\* operator\
    \ new(parms)** must be accompanied by a corresponding overload **void operator\
    \ delete(void\\*, parms)**, where parms is a list of extra parameter types (of\
    \ which the first is always **std::size_t**). The same goes for the array forms\
    \ **new[]** and **delete[]**.*\n\n+   46. If you provide any class-specific **new**,\
    \ provide all of the standard forms (plain, in-place, and nothrow).\n+   \n+ \
    \     *Don’t hide good news: If a class defines any overload of **operator new**,\
    \ it should provide overloads of all three of plain, in-place, and non-throwing\
    \ **operator new**. If you don’t, they’ll be hidden and unavailable to users of\
    \ your class.*\n\n# Construction, Destruction, and Copying\n\n+   47. Define and\
    \ initialize member variables in the same order.\n+   \n+      *Agree with your\
    \ compiler: Member variables are always initialized in the order they are declared\
    \ in the class definition; the order in which you write them in the constructor\
    \ initialization list is ignored. Make sure the constructor code doesn’t confusingly\
    \ specify a different order.*\n\n+   48. Prefer initialization to assignment in\
    \ constructors.\n+   \n+      *Set once, use everywhere: In constructors, using\
    \ initialization instead of assignment to set member variables prevents needless\
    \ run-time work and takes the same amount of typing.*\n\n+   49. Avoid calling\
    \ virtual functions in constructors and destructors.\n+   \n+      *Virtual functions\
    \ only “virtually” always behave virtually: Inside constructors and destructors,\
    \ they don’t. Worse, any direct or indirect call to an unimplemented pure virtual\
    \ function from a constructor or destructor results in undefined behavior. If\
    \ your design wants virtual dispatch into a derived class from a base class constructor\
    \ or destructor, you need other techniques such as post-constructors.*\n\n+  \
    \ 50. Make base class destructors public and virtual, or protected and nonvirtual.\n\
    +   \n+      *To delete, or not to delete; that is the question: If deletion through\
    \ a pointer to a base **Base** should be allowed, then **Base**’s destructor must\
    \ be public and virtual. Otherwise, it should be protected and nonvirtual.*"
