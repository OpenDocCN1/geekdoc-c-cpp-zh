    \ eliminates any advantage that having an exception specification might have had\
    \ in the first place).\n\nYou generally can’t write useful exception specifications\
    \ for function templates anyway, because you generally can’t tell what exceptions\
    \ the types they operate on might throw.\n\nPaying a performance overhead in exchange\
    \ for enforcements that are nearly always useless because they are fatal if they\
    \ ever fire is an excellent example of a premature pessimization (see Item 9).\n\
    \nThese is no easy fix for the problems described in this Item. In particular,\
    \ the problems are not easily solved by switching to static checking. People often\
    \ suggest switching from dynamically checked exception specifications to statically\
    \ checked ones, as provided in Java and other languages. In short, that just trades\
    \ one set of problems for another; users of languages with statically checked\
    \ exception specifications seem to equally often suggest switching to dynamically\
    \ checked ones.\n\n# Exceptions\n\nIf you have to override a base class virtual\
