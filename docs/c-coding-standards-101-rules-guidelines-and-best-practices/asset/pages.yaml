  md: "# # 95. Don't use C-style casts.\n\n# ## Summary\n\nAge doesn't always imply\
    \ wisdom: C-style casts have different (and often dangerous) semantics depending\
    \ on context, all disguised behind a single syntax. Replacing C-style casts with\
    \ C++-style casts helps guard against unexpected errors.\n\n# ## Discussion\n\n\
    One problem with C-style casts is that they provide one syntax to do subtly different\
    \ things, depending on such vagaries as the files that you `#include`. The C++\
    \ casts, while retaining some of the dangers inherent in casts, avoid such ambiguities,\
    \ clearly document their intent, are easy to search for, take longer to write\
    \ (which makes one think twice)—and don't silently inject evil `reinterpret_casts`\
    \ (see Item 92).\n\nConsider the following code, where *Derived* inherits from\
    \ *Base*:\n\n```\n```cpp\nextern void Fun( Derived* );\n\nvoid Gun( Base* pb )\
    \ {\n    // let's assume Gun knows for sure pb actually points to a Derived\n\
    \    // and wants to forward to Fun\n    Derived* pd = (Derived*)pb;         \
    \   // bad: C-style cast\n    Fun( pd );\n}\n```\n```\n\nIf *Gun* has access to\
    \ the definition of *Derived* (say by including “derived.h”), the compiler will\
    \ have the necessary object layout information to make any needed pointer adjustments\
    \ when casting from *Base* to *Derived*. But say *Gun*'s author forgets to `#include`\
    \ the appropriate definition file, and *Gun* only sees a forward declaration of\
    \ `class Derived;`. In that case, the compiler will just assume that *Base* and\
    \ *Derived* are unrelated types, and will reinterpret the bits that form *Base*\
    \ as a `Derived*`, without making any necessary adjustments dictated by object\
    \ layout!\n\nIn short, if you forget to `#include` the definition, your code crashes\
    \ mysteriously, even though it compiles without errors. Avoid the problem this\
    \ way:\n\n```\n```cpp\nextern void Fun( Derived* );\n\nvoid Gun( Base* pb ) {\n\
    \    // if we know for sure that pb actually points to a Derived, use:\n    Derived*\
    \ pd = static_cast<Derived*>(pb);  // good: C++-style cast\n    // otherwise:\
    \ = dynamic_cast<Derived*>(pb); // good: C++-style cast\n    Fun(pd);\n}\n```\n\
    ```"
