- pgno: 44
  md: '# 14. Prefer compile- and link-time errors to run-time errors.


    # Summary


    Don’t put off ’til run time what you can do at build time: Prefer to write code
    that uses the compiler to check for invariants during compilation, instead of
    checking them at run time. Run-time checks are control- and data-dependent, which
    means you’ll seldom know whether they are exhaustive. In contrast, compile-time
    checking is not control- or data-dependent and typically offers higher degrees
    of confidence.


    # Discussion


    The C++ language offers many opportunities to “accelerate” error detection by
    pushing it to compilation time. Exploiting these static checking capabilities
    offers you many advantages, including the following:


    +   - *Static checks are data- and flow-independent:* Static checking offers guarantees
    that are independent of the program inputs or execution flow. In contrast, to
    make sure that your run-time checking is strong enough, you need to test it for
    a representative sample of all inputs. This is a daunting task for all but the
    most trivial systems.

    +   - *Statically expressed models are stronger:* Oftentimes, a program that relies
    less on run-time checks and more on compile-time checks reflects a better design
    because the model the program creates is properly expressed using C++’s type system.
    This way, you and the compiler are partners having a consistent view of the program’s
    invariants; run-time checks are often a fallback to do checking that could be
    done statically but cannot be expressed precisely in the language. (See Item 68.)

    +   - *Static checks don’t incur run-time overhead:* With static checks replacing
    dynamic checks, the resulting executable will be faster without sacrificing correctness.


    One of C++’s most powerful static checking tools is its static type checking.
    The debate on whether types should be checked statically (C++, Java, ML, Haskell)
    or dynamically (Smalltalk, Ruby, Python, Lisp) is open and lively. There is no
    clear winner in the general case, and there are languages and development styles
    that favor either kind of checking with reportedly good results. The static checking
    crowd argues that a large category of run-time error handling can be thus easily
    eliminated, resulting in stronger programs. On the other hand, the dynamic checking
    camp says that com-'
