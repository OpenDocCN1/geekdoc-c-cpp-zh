- pgno: 218
  md: 'Corollary. In header files, don''t write namespace-level **using** directives
    or **using** declarations; instead, explicitly namespace-qualify all names. (The
    second rule follows from the first, because headers can never know what other
    header **#include**s might appear after them.)


    60. Avoid allocating and deallocating memory in different modules.


    *Put things back where you found them:* Allocating memory in one module and deallocating
    it in a different module makes your program fragile by creating a subtle long-distance
    dependency between those modules. They must be compiled with the same compiler
    version and same flags (notably debug vs. *NDEBUG*) and the same standard library
    implementation, and in practice the module allocating the memory had better still
    be loaded when the deallocation happens.


    61. Don''t define entities with linkage in a header file.


    *Repetition causes bloat:* Entities with linkage, including namespace-level variables
    or functions, have memory allocated for them. Defining such entities in header
    files results in either link-time errors or memory waste. Put all entities with
    linkage in implementation files.


    62. Don''t allow exceptions to propagate across module boundaries.


    *Don''t throw stones into your neighbor''s garden:* There is no ubiquitous binary
    standard for C++ exception handling. Don''t allow exceptions to propagate between
    two pieces of code unless you control the compiler and compiler options used to
    build both sides; otherwise, the modules might not support compatible implementations
    for exception propagation. Typically, this boils down to: Don''t let exceptions
    propagate across module/subsystem boundaries.


    63. Use sufficiently portable types in a module''s interface.


    *Take extra care when living on the edge (of a module):* Don''t allow a type to
    appear in a module''s external interface unless you can ensure that all clients
    understand the type correctly. Use the highest level of abstraction that clients
    can understand.


    # Templates and Genericity


    64. Blend static and dynamic polymorphism judiciously.


    *So much more than a mere sum of parts:* Static and dynamic polymorphism are complementary.
    Understand their tradeoffs, use each for what it''s best at, and mix them to get
    the best of both worlds.


    65. Customize intentionally and explicitly.


    *Intentional is better than accidental, and explicit is better than implicit:*
    When writing a template, provide points of customization knowingly and correctly,
    and document them clearly. When using a template, know how the template intends
    for you to customize it for use with your type, and customize it appropriately.


    66. Don''t specialize function templates.


    *Specialization is good only when it can be done correctly:* When extending someone
    else''s function template (including `std::swap`), avoid trying to write a specialization;
    instead, write an overload of the function template, and put it in the namespace
    of the type(s) the overload is designed to be used for. (See Item 57.) When you
    write your own function template, avoid encouraging direct specialization of the
    function template itself.'
  merge: -1
  img_proc: true
- pgno: 219
  md: "+   67. Don’t write unintentionally nongeneric code.\n+   \n+      *Commit\
    \ to abstractions, not to details: Use the most generic and abstract means to\
    \ implement a piece of functionality.*\n\n# Error Handling and Exceptions\n\n\
    +   68. Assert liberally to document internal assumptions and invariants.\n+ \
    \  \n+      *Be assertive! Use `assert` or an equivalent liberally to document\
    \ assumptions internal to a module (i.e., where the caller and callee are maintained\
    \ by the same person or team) that must always be true and otherwise represent\
    \ programming errors (e.g., violations of a function’s postconditions detected\
    \ by the caller of the function). (See also Item 70.) Ensure that assertions don’t\
    \ perform side effects.*\n\n+   69. Establish a rational error handling policy,\
    \ and follow it strictly.\n+   \n+      *Consciously specify, and conscientiously\
    \ apply, what so many projects leave to ad-hoc (mis)judgment: Develop a practical,\
    \ consistent, and rational error handling policy early in design, and then stick\
    \ to it. Ensure that it includes:*\n+   \n+      - *Identification: What conditions\
    \ are errors.*\n+      - *Severity: How important or urgent each error is.*\n\
    +      - *Detection: Which code is responsible for detecting the error.*\n+  \
    \    - *Propagation: What mechanisms are used to report and propagate error notifications\
    \ in each module.*\n+      - *Handling: What code is responsible for doing something\
    \ about the error.*\n+      - *Reporting: How the error will be logged or users\
    \ notified.*\n+   \n+      *Change error handling mechanisms only on module boundaries.*\n\
    \n+   70. Distinguish between errors and non-errors.\n+   \n+      *A breach of\
    \ contract is an error: A function is a unit of work. Thus, failures should be\
    \ viewed as errors or otherwise based on their impact on functions. Within a function\
    \ f, a failure is an error if and only if it violates one of f’s preconditions\
    \ or prevents f from meeting any of its callees’ preconditions, achieving any\
    \ of f’s own postconditions, or reestablishing any invariant that f shares responsibility\
    \ for maintaining.*\n+   \n+      *In particular, here we exclude internal programming\
    \ errors (i.e., where the caller and callee are the responsibility of the same\
    \ person or team, such as inside a module), which are a separate category normally\
    \ dealt with using assertions (see Item 68).*\n\n+   71. Design and write error-safe\
    \ code.\n+   \n+      *Promise, but don’t punish! In each function, give the strongest\
    \ safety guarantee that won’t penalize callers who don’t need it. Always give\
    \ at least the basic guarantee.*\n+   \n+      *Ensure that errors always leave\
    \ your program in a valid state. This is the basic guarantee. Beware of invariant-destroying\
    \ errors (including but not limited to leaks), which are just plain bugs.*\n+\
    \   \n+      *Prefer to additionally guarantee that the final state is either\
    \ the original state (if there was an error the operation was rolled back) or\
    \ the intended target state (if there was no error the operation was committed).\
    \ This is the strong guarantee.*"
