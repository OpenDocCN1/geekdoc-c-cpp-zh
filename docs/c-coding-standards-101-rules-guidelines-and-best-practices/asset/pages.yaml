- pgno: 220
  md: "Prefer to additionally guarantee that the operation can never fail at all.\
    \ Although this is not possible for most functions, it is required for functions\
    \ like destructors and deallocation functions. This is the no-fail guarantee.\n\
    \n+   72. Prefer to use exceptions to report errors.\n+   \n+      *When harmed,\
    \ take exception: Prefer using exceptions over error codes to report errors. Use\
    \ status codes (e.g., return codes, **errno**) for errors when exceptions cannot\
    \ be used (see Item 62), and for conditions that are not errors. Use other methods,\
    \ such as graceful or ungraceful termination, when recovery is impossible or not\
    \ required.*\n\n+   73. Throw by value, catch by reference.\n+   \n+      *Learn\
    \ to catch properly: Throw exceptions by value (not pointer) and catch them by\
    \ reference (usually to **const**). This is the combination that meshes best with\
    \ exception semantics. When rethrowing the same exception, prefer just **throw;**\
    \ to **throw e;**.*\n\n+   74. Report, handle, and translate errors appropriately.\n\
    +   \n+      *Know when to say when: Report errors at the point they are detected\
    \ and identified as errors. Handle or translate each error at the nearest level\
    \ that can do it correctly.*\n\n+   75. Avoid exception specifications.\n+   \n\
    +      *Take exception to these specifications: Don’t write exception specifications\
    \ on your functions unless you’re forced to (because other code you can’t change\
    \ has already introduced them; see Exceptions).*\n\n# STL: Containers\n\n+   76.\
    \ Use **vector** by default. Otherwise, choose an appropriate container.\n+  \
    \ \n+      *Using the “right container” is great: If you have a good reason to\
    \ use a specific container type, use that container type knowing that you did\
    \ the right thing.*\n+   \n+      *So is using **vector**: Otherwise, write **vector**\
    \ and keep going without breaking stride, also knowing you did the right thing.*\n\
    \n+   77. Use **vector** and **string** instead of arrays.\n+   \n+      *Why\
    \ juggle Ming vases? Avoid implementing array abstractions with C-style arrays,\
    \ pointer arithmetic, and memory management primitives. Using **vector** or **string**\
    \ not only makes your life easier, but also helps you write safer and more scalable\
    \ software.*\n\n+   78. Use **vector** (and **string::c_str**) to exchange data\
    \ with non-C++ APIs.\n+   \n+      ***vector** isn’t lost in translation: **vector**\
    \ and **string::c_str** are your gateway to communicate with non-C++ APIs. But\
    \ don’t assume iterators are pointers; to get the address of the element referred\
    \ to by a **vector<T>::iterator iter**, use **&*iter**.*\n\n+   79. Store only\
    \ values and smart pointers in containers.\n+   \n+      *Store objects of value\
    \ in containers: Containers assume they contain value-like types, including value\
    \ types (held directly), smart pointers, and iterators.*"
