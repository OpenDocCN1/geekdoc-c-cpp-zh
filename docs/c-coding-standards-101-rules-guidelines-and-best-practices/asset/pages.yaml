  md: 'want to use standard library components (e.g., `string`, `containers`) in a
    multithreaded program, consult your standard library implementation’s documentation
    to see whether that is supported, as described earlier.


    When authoring your own type that is intended to be usable in a multithreaded
    program, you must do the same two things: First, you must guarantee that different
    threads can use different objects of that type without locking (note: a type with
    modifiable static data typically can’t guarantee this). Second, you must document
    what users need to do in order to safely use the same object in different threads;
    the fundamental design issue is how to distribute the responsibility of correct
    execution (race- and deadlock-free) between the class and its client. The main
    options are:


    +   - **External locking:** Callers are responsible for locking. In this option,
    code that uses an object is responsible for knowing whether the object is shared
    across threads and, if so, for serializing all uses of the object. For example,
    `string` types typically use external locking (or immutability; see the third
    option on the next page).

    +   - **Internal locking:** Each object serializes all access to itself, typically
    by locking every public member function, so that callers may not need to serialize
    uses of the object. For example, producer/consumer queues typically use internal
    locking, because their whole *raison d’être* is to be shared across threads, and
    their interfaces are designed so that the appropriate level of locking is for
    the duration of individual member function calls (`Push`, `Pop`). More generally,
    note that this option is appropriate only when you know two things:


    First, you must know up front that objects of the type will nearly always be shared
    across threads, otherwise you’ll end up doing needless locking. Note that most
    types don’t meet this condition; the vast majority of objects even in a heavily
    multithreaded program are never shared across threads (and this is good; see Item
    10).


    Second, you must know up front that per-member-function locking is at the right
    granularity and will be sufficient for most callers. In particular, the type’s
    interface should be designed in favor of coarse-grained, self-sufficient operations.
    If the caller typically needs to lock several operations, rather than an operation,
    this is inappropriate; individually locked functions can only be assembled into
    a larger-scale locked unit of work by adding more (external) locking. For example,
    consider a container type that returns an iterator that could become invalid before
    you could use it, or provides a member algorithm like `find` that can return a
    correct answer that could become the wrong answer before you could use it, or
    has users who want to write `if (c.empty()) c.push_back(x);` (See [Sutter02] for
    additional examples). In such cases, the caller needs to perform external locking
    anyway in order to get a lock whose lifetime spans multiple individual member
    function calls, and so internal locking of each member function is needlessly
    wasteful.'
