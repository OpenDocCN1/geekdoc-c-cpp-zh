- pgno: 58
  md: '# # 23. Make header files self-sufficient.


    # ### Summary


    Behave responsibly: Ensure that each header you write is compilable standalone,
    by having it include any headers its contents depend upon.


    # ### Discussion


    If one header file won’t work unless the file that includes it also includes another
    header, that’s gauche and puts unnecessary burden on that header file’s users.


    Years ago, some experts advised that headers should not include other headers
    because of the cost of opening and parsing a guarded header multiple times. Fortunately,
    this is largely obsolete: Many modern C++ compilers recognize header guards automatically
    (see Item 24) and don’t even open the same header twice. Some also offer precompiled
    headers, which help to ensure that often-used, seldom-changed headers will not
    be parsed often.


    But don’t include headers that you don’t need; they just create stray dependencies.


    Consider this technique to help enforce header self-sufficiency: In your build,
    compile each header in isolation and validate that there are no errors or warnings.


    # ### Examples


    Some subtler issues arise in connection with templates.


    *Example 1: Dependent names.* Templates are compiled at the point where they are
    defined, except that any dependent names or types are not compiled until the point
    where the template is instantiated. This means that a `template<class T> class
    Widget` with a `std::deque<T>` member does not incur a compile-time error even
    when `<deque>` is not included, as long as nobody instantiates `Widget`. Given
    that `Widget` exists in order to be instantiated, its header clearly should `#include
    <deque>`.


    *Example 2: Member function templates, and member functions of templates, are
    instantiated only if used.* Suppose that `Widget` doesn’t have a member of type
    `std::deque<T>`, but `Widget`’s `Transmogrify` member function uses a `deque`.
    Then `Widget`’s callers can instantiate and use `Widget` just fine even if no
    one includes `<deque>`, as long as they don’t use `Transmogrify`. By default,
    the `Widget` header should still `#include <deque>` because it is necessary for
    at least some callers of `Widget`. In rare cases where an expensive header is
    being included for few rarely used functions of a template, consider refactoring
    those functions as nonmembers supplied in a separate header that does include
    the expensive one. (See Item 44.)


    # ### References


    [Lakos96] §3.2 • [Stroustrup00] §9.2.3 • [Sutter00] §26-30 • [Vandevoorde03] §9-10'
