- pgno: 173
  md: '# 82. Use the accepted idioms to really shrink capacity and really erase elements.


    # Summary


    Use a diet that works: To really shed excess capacity from a container, use the
    “swap trick.” To really erase elements from a container, use the erase-remove
    idiom.


    # Discussion


    Some containers (e.g., **vector, string, deque**) can end up carrying around extra
    capacity that’s no longer needed. Although the C++ standard library containers
    provide no guaranteed way to trim excess capacity, the following “swap trick”
    idiom works in practice to get rid of excess capacity for such a **container**:


    ```

    container<T>( c ).swap( c );  // the shrink-to-fit idiom to shed excess capacity

    ```


    Or, to empty c out completely, clearing all contained elements and shedding all
    possible capacity, the idiom is:


    ```

    container<T>().swap( c );  // the idiom to shed all contents and capacity

    ```


    In related news, a common surprise for new STL programmers is that the **remove**
    algorithm doesn’t really remove elements from a container. Of course, it can’t;
    an algorithm just works on an iterator range, and you can’t actually remove something
    from a container without calling a container member function, usually **erase**.
    All **remove** does is to shuffle values around so that the elements that shouldn’t
    be “removed” get shuffled up toward the beginning of the range, and return an
    iterator to one past the end of the unremoved elements. To really get rid of them,
    the call to **remove** needs to be followed by a call to **erase**—hence the “erase-remove”
    idiom. For example, to erase all elements equal to **value** from a container
    **c**, you can write:


    ```

    c.erase( remove( c.begin(), c.end(), value ), c.end() );

    ```


    Prefer to use a member version of **remove** or **remove_if** on a container that
    has it.


    # Exceptions


    The usual shrink-to-fit idiom won’t work on copy-on-write implementations of **std::string**.
    What usually does work is to call **s.reserve(0)** or to fake the string out by
    writing **string(s.begin(), s.end()).swap(s)**; to use the iterator range constructor.
    In practice, these work to shed excess capacity. (Better still, **std::string**
    implementations are abandoning copy-on-write, which is an outdated optimization;
    see [Sutter02].)


    # References


    [Josuttis99] §6.2.1 • [Meyers01] §17, §32, §44 • [Sutter00] §7 • [Sutter02] §7,
    §16'
