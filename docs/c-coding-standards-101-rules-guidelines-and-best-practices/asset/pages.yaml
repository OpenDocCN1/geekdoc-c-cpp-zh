  md: "```\n```cpp\nT* p = new(alloc) T;\n```\n```\n\nreally expands into something\
    \ like\n\n```\n```cpp\n// compiler-generated code for T* p = new(alloc) T;\n//\n\
    void* __compilerTemp = T::operator new(sizeof(T), alloc);\nT* p;\ntry {\n    p\
    \ = new (__compilerTemp) T;      // construct a T at address __compilerTemp\n\
    }\ncatch(...) {                          // constructor failed, attention here...\n\
    \    T::operator delete(__compilerTemp, sizeof(T), alloc);\n    throw;\n}\n```\n\
    ```\n\nSo, quite logically, the compiler automatically inserts code to call the\
    \ corresponding T::operator delete for the overloaded T::operator new if the allocation\
    \ succeeds but the constructor fails. The “corresponding” signature is void operator\
    \ delete(void*, whatever-parameters-new-takes).\n\nHere comes the fly-in-the-ointment\
    \ part. The C++ Standard (in [C++03] §5.3.4(17)) specifies that the code above\
    \ will be generated if and only if that overload of operator delete actually exists.\
    \ Otherwise, the code does not invoke any operator delete at all in the case of\
    \ a constructor failure. In other words: If the constructor fails, memory will\
    \ leak. Of six popular compilers tested at the time of this writing, only two\
    \ issued a warning in such situations.\n\nThat’s why every overload void* operator\
    \ new(params) must be accompanied by its corresponding overload void operator\
    \ delete(void*, params)—because the compiler wants to call them itself.\n\n# ##\
    \ Exceptions\n\nThe in-place form of operator new\n\n```\n```cpp\nvoid* T::operator\
    \ new(size_t, void* p) { return p; }\n```\n```\n\ndoes not need a corresponding\
    \ operator delete because there is no real allocation going on. All compilers\
    \ we tested issue no spurious warnings concerning the absence of void T::operator\
    \ delete(void*, size_t, void*).\n\n# ## References\n\n[C++03] §5.3.4 • [Stroustrup00]\
    \ §6.2.6, §15.6 • [Sutter00] §36"
