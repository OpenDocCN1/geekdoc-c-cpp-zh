  md: '# 64. Blend static and dynamic polymorphism judiciously.


    # Summary


    So much more than a mere sum of parts: Static and dynamic polymorphism are complementary.
    Understand their tradeoffs, use each for what it’s best at, and mix them to get
    the best of both worlds.


    # Discussion


    Dynamic polymorphism comes in the form of classes with virtual functions and instances
    manipulated indirectly (through pointers or references). Static polymorphism involves
    template classes and template functions.


    Polymorphism means that a given value can have more than one type, and a given
    function can accept arguments of types other than the exact types of its parameters.
    “Polymorphism is a way of gaining some of the freedom of dynamic type checking
    without giving up the benefits of static type checking.” —[Webber03]


    The strength of polymorphism is that the same piece of code can operate on different
    types, even types that were not known at the time the code was written. Such “post-hoc
    applicability” is the cornerstone of polymorphism because it amplifies the usefulness
    and reusability of code (see Item 37). (Contrast that with monomorphic code that
    rigidly operates only on the concrete types it was meant to work with.)


    Dynamic polymorphism via public inheritance lets a value have more than one type.
    For example, a **Derived** *p can be viewed as a pointer not only to a **Derived**,
    but to an object of any type **Base** that’s a direct or indirect base of **Derived**
    (the *subsumption* property). Dynamic polymorphism is also referred to as *inclusion
    polymorphism* because the set modeled by **Base** includes the specializations
    modeled by **Derived**.


    Due to its characteristics, dynamic polymorphism in C++ is best at:


    +   - *Uniform manipulation based on superset/subset relationships:* Different
    classes that hold a superset/subset (base/derived) relationship can be treated
    uniformly. A function that works on **Employee** objects works also on **Secretary**
    objects.

    +   - *Static type checking:* All types are checked statically in C++.

    +   - *Dynamic binding and separate compilation:* Code that uses classes in a
    hierarchy can be compiled apart from the code of the entire hierarchy. This is
    possible because of the indirection that pointers provide (both to objects and
    to functions).

    +   - *Binary interfacing:* Modules can be linked either statically or dynamically,
    as long as the linked modules lay out the virtual tables the same way.


    Static polymorphism via templates also lets a value have more than one type. Inside
    a template<class T> void f( T t ) { /**...*/ }, t can have any type that can be
    substitut-'
