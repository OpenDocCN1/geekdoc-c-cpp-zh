- pgno: 80
  md: '# **37. Public inheritance is substitutability.**

    **Inherit, not to reuse, but to be reused.**


    # **Summary**


    Know what: Public inheritance allows a pointer or reference to the base class
    to actually refer to an object of some derived class, without destroying code
    correctness and without needing to change existing code.


    Know why: Don''t inherit publicly to reuse code (that exists in the base class);
    inherit publicly in order to be reused (by existing code that already uses base
    objects polymorphically).


    # **Discussion**


    Despite two decades of object-oriented design knowledge, the purpose and practice
    of public inheritance are still frequently misunderstood, and many uses of inheritance
    are flawed.


    Public inheritance must always model “is-a” (“works-like-a”) according to the
    Liskov Substitution Principle (see [Liskov88]): All base contracts must be fulfilled,
    and so all overrides of virtual member functions must require no more and promise
    no less than their base versions if they are to successfully fulfill the base’s
    contract. Code using a pointer or reference to a **Base** must behave correctly
    even when that pointer or reference actually points to a **Derived**.


    Misuse of inheritance destroys correctness. Incorrectly implemented inheritance
    most typically goes astray by failing to obey the explicit or implicit contract
    that the base class establishes. Such contracts can be subtle, and when they cannot
    be expressed directly in code the programmer must take extra care. (Some patterns
    help to declare more intent in code; see Item 39.)


    To distill a frequently cited example: Consider that two classes **Square** and
    **Rectangle** each have virtual functions for setting their height and width.
    Then **Square** cannot correctly inherit from **Rectangle**, because code that
    uses a modifiable **Rectangle** will assume that **SetWidth** does not change
    the height (whether **Rectangle** explicitly documents that contract or not),
    whereas **Square::SetWidth** cannot preserve that contract and its own squareness
    invariant at the same time. But **Rectangle** cannot correctly inherit from **Square**
    either, if clients of **Square** assume for example that a **Square’s** area is
    its width squared, or if they rely on some other property that doesn’t hold for
    **Rectangles**.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'The “is-a” description of public inheritance is misunderstood when people use
    it to draw irrelevant real-world analogies: A square “is-a” rectangle (mathematically)
    but a **Square** is not a **Rectangle** (behaviorally). Consequently, instead
    of “is-a,” we prefer to say “works-like-a” (or, if you prefer, “usable-as-a”)
    to make the description less prone to misunderstanding.


    Public inheritance is indeed about reuse, but not the way many programmers seem
    to think. As already pointed out, the purpose of public inheritance is to implement
    substitutability (see [Liskov88]). The purpose of public inheritance is *not*
    for the derived class to reuse base class code to implement itself in terms of
    the base class’s code. Such an is-implemented-in-terms-of relationship can be
    entirely proper, but should be modeled by composition—or, in special cases only,
    by nonpublic inheritance (see Item 34).


    Put another way: When dynamic polymorphism is correct and appropriate, composition
    is selfish; inheritance is generous.


    A new derived class is a new special case of an existing general abstraction.
    Existing (dynamically) polymorphic code that uses a **Base&** or **Base*** by
    calling **Base**’s virtual functions should be able to seamlessly use objects
    of **MyNewDerivedType** that inherits from **Base**. The new derived type adds
    new functionality to the existing code, which does not need to be changed but
    can seamlessly increase its functionality when new derived objects are plugged
    in.


    New requirements should naturally be met by new code; new requirements should
    not cause rework on existing code. (See Item 36.)


    Before object orientation, it has always been easy for new code to call existing
    code. Public inheritance specifically makes it easier for existing code to seamlessly
    and safely call new code. (So do templates, which provide static polymorphism
    that can blend well with dynamic polymorphism; see Item 64.)


    # Exceptions


    Policy classes and mixins add behavior by public inheritance, but this is not
    abusing public inheritance to model is-implemented-in-terms-of.


    # References


    [Cargill92] pp. 19-20 • [Cline99] §5.13, §7.01-8.15 • [Devhurts03] §92 • [Liskov88]
    • [Meyers97] §35 • [Stroustrup00] §12.4.1, §23.4.3.1, §24.3.4 • [Sutter00] §22-24'
