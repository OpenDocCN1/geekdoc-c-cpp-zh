- pgno: 108
  md: '# ## 51. Destructors, deallocation, and swap never fail.


    # ### Summary


    Everything they attempt shall succeed: Never allow an error to be reported from
    a destructor, a resource deallocation function (e.g., **operator delete**), or
    a swap function. Specifically, types whose destructors may throw an exception
    are flatly forbidden from use with the C++ standard library.


    # ### Discussion


    These are key functions that must not fail because they are necessary for the
    two key operations in transactional programming: to back out work if problems
    are encountered during processing, and to commit work if no problems occur. If
    there’s no way to safely back out using no-fail operations, then no-fail rollback
    is impossible to implement. If there’s no way to safely commit state changes using
    a no-fail operation (notably, but not limited to, swap), then no-fail commit is
    impossible to implement.


    Consider the following advice and requirements found in the C++ Standard:


    > > If a destructor called during stack unwinding exits with an exception, **terminate**
    is called (15.5.1). So destructors should generally catch exceptions and not let
    them propagate out of the destructor.—[C++03] §15.2(3)


    > > No destructor operation defined in the C++ Standard Library [including the
    destructor of any type that is used to instantiate a standard library template]
    will throw an exception.—[C++03] §17.4.4.8(3)


    Destructors are special, and the compiler invokes them automatically in various
    contexts. If you write a class—let’s call it **Nefarious**—whose destructor might
    fail (usually by throwing an exception; see Item 72), you incur the following
    consequences:


    +   - **Nefarious objects are hard to use safely in normal functions:** You can’t
    reliably instantiate automatic **Nefarious** objects in a scope if that scope
    might be exited through an exception. If that happened, **Nefarious**’s destructor
    (automatically invoked) might attempt to throw an exception as well, which would
    result in sudden death of your entire program via **std::terminate**. (See also
    Item 75.)

    +   - **Classes with Nefarious members or bases are also hard to use safely:**
    **Nefarious**’ poor behavior extends to any class of which **Nefarious** is a
    member or a base class.

    +   - **You can’t reliably create global or static Nefarious objects either:**
    Any exception its destructor might throw can’t be caught.'
