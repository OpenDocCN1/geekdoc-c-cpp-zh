- pgno: 32
  md: '# 8. Don’t optimize prematurely.


    # Summary


    Spur not a willing horse (Latin proverb): Premature optimization is as addictive
    as it is unproductive. The first rule of optimization is: Don’t do it. The second
    rule of optimization (for experts only) is: Don’t do it yet. Measure twice, optimize
    once.


    # Discussion


    As [Stroustrup00] §6’s introduction quotes so deliciously:


    > > *Premature optimization is the root of all evil.* —Donald Knuth [quoting Hoare]

    > >

    > > *On the other hand, we cannot ignore efficiency.* —Jon Bentley


    Hoare and Knuth are, of course and as always, completely correct (see Item 6 and
    this Item). So is Bentley (see Item 9).


    We define premature optimization as making designs or code more complex, and so
    less readable, in the name of performance when the effort is not justified by
    a proven performance need (such as actual measurement and comparison against goals)
    and thus by definition adds no proven value to your program. All too often, unneeded
    and unmeasured optimization efforts don’t even make the program any faster.


    Always remember:


    > > It is, far, far easier to make a correct program fast

    > > than it is to make a fast program correct.


    So, by default, don’t focus on making code fast; focus first on making code as
    clear and readable as possible (see Item 6). Clear code is easier to write correctly,
    easier to understand, easier to refactor—and easier to optimize. Complications,
    including optimizations, can always be introduced later—and only if necessary.


    There are two major reasons why premature optimizations frequently don’t even
    make the program faster. First, we programmers are notoriously bad at estimating
    what code will be faster or smaller, and where the bottlenecks in our code will
    be. This includes the authors of this book, and it includes you. Consider: Modern
    computers feature an extremely complex computational model, often with several
    pipelined processing units working in parallel, a deep cache hierarchy, speculative
    execution, branch prediction… and that’s just the CPU chip. On top of the hardware,
    compilers take their best guess at transforming your source code into machine
    code that exploits the hardware at its best. And on top of all that complication,
    it’s… well, it’s your guess. So if you go with nothing but guesswork, there is
    little chance your ill-targeted micro-optimizations will significantly improve
    things. So, optimization must be preceded by measurement; and measurement must
    be preceded by optimi-'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'zation goals. Until the need is proven, your focus should be on priority #1—writing
    code for humans. (When someone asks you to optimize, do demand proof.)


    Second, in modern programs, increasingly many operations aren’t CPU-bound anyway.
    They may be memory-bound, network-bound, disk-bound, waiting on a web service,
    or waiting on a database. At best, tuning application code in such operations
    only make the operations wait faster. It also means that the programmer wasted
    valuable time improving what didn’t need improving instead of adding value by
    improving what did.


    Of course, the day will come when you do need to optimize some code. When you
    do so, look first for an algorithmic optimization (see Item 7) and try to encapsulate
    and modularize the optimization (e.g., in a function or class; see Items 5 and
    11), and clearly state in a comment the reason of the optimization and a reference
    to the algorithm used.


    A common beginner’s mistake is to write new code while obsessing—with pride!—over
    optimal execution at the cost of understandability. More often than not, this
    yields miles of spaghetti that, even if correct in the beginning, is hard to read
    and change. (See Item 6.)


    It is not premature optimization to pass by reference (see Item 25), to prefer
    calling prefix ++ and -- (see Item 28), and use similar idioms that should just
    naturally flow out of our fingertips. These are not premature optimizations; they
    are simply avoiding premature pessimizations (see Item 9).


    # Examples


    *Example: An inline irony.* Here is a simple demonstration of the hidden cost
    of a premature micro-optimization: Profilers are excellent at telling you, by
    function hit count, what functions you should have marked inline but didn’t; profilers
    are terrible at telling you what functions you did mark inline but shouldn’t have.
    Too many programmers “inline by default” in the name of optimization, nearly always
    trading higher coupling for at best dubious benefit. (This assumes that writing
    **inline** even matters on your compiler. See [Sutter00], [Sutter02], and [Sutter04].)


    # Exceptions


    When writing libraries, it’s harder to predict what operations will end up being
    used in performance-sensitive code. But even library authors run performance tests
    against a broad range of client code before committing to obfuscating optimizations.


    # References


    [Bentley00] §6 • [Cline99] §13.01–09 • [Kernighan99] §7 • [Lakos96] §9.1.14 •
    [Meyers97] §33 • [Murray93] §9-9-10, §9.13 • [Stroustrup00] §6 introduction •
    [Sutter00] §30, §46 • [Sutter02] §12 • [Sutter04] §25'
