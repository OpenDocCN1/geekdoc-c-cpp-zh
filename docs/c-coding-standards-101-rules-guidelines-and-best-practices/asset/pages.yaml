  md: "```\nDerived *pD = new Derived;\npD->Foo();                         // invokes\
    \ pD->Foo(1)\n\nBase *pB = pD;\npB->Foo();                         // invokes\
    \ pB->Foo(0)\n```\n\nIt can be surprising to callers that the same object’s member\
    \ function silently takes different arguments depending on the static type they\
    \ happen to access it through.\n\nPrefer to add the redundant **virtual** when\
    \ overriding a function. It makes the intent clearer to the reader.\n\nBeware\
    \ of inadvertently hiding overloads in the base class. For example:\n\n```\nclass\
    \ Base{ // ...\n  virtual void Foo( int );\n  virtual void Foo( int, int );\n\
    \  void Foo( int, int, int );\n};\n\nclass Derived : public Base { // ...\n  virtual\
    \ void Foo( int );       // overrides Base::Foo(int), but hides the others\n};\n\
    \nDerived d;\nd.Foo( 1 );                      // ok\nd.Foo( 1, 2 );         \
    \         // error (oops?)\nd.Foo( 1, 2, 3 );               // error (oops?)\n\
    ```\n\nIf the base class’s overloads should be visible, write a **using** declaration\
    \ to redeclare them in the derived class:\n\n```\nclass Derived : public Base\
    \ { // ...\n  virtual void Foo( int );       // overrides Base::Foo(int)\n  **using\
    \ Base::Foo;**           // bring the other Base::Foo overloads into scope\n};\n\
    ```\n\n# Examples\n\n*Example: Ostrich.* If class **Bird** defines the virtual\
    \ function **Fly** and you derive a new class **Ostrich** (a notoriously flightless\
    \ bird) from **Bird**, how do you implement **Ostrich::Fly**? The answer is, “It\
    \ depends.” If **Bird::Fly** guarantees success (i.e., provides the no-fail guarantee;\
    \ see Item 71) because flying is an essential part of the **Bird** model, then\
    \ **Ostrich** is not an adequate implementation of that model.\n\n# References\n\
    \n[Dewhurst03] §73-74, §78-79 • [Sutter00] §21 • [Keffer95] p. 18"
