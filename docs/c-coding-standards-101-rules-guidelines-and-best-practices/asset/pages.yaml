- pgno: 217
  md: "+   51. **Destructors, deallocation, and swap never fail.**\n+      *Everything\
    \ they attempt shall succeed: Never allow an error to be reported from a destructor,\
    \ a resource deallocation function (e.g., **operator delete**), or a swap function.\
    \ Specifically, types whose destructors may throw an exception are flatly forbidden\
    \ from use with the C++ standard library.*\n+   \n+   52. **Copy and destroy consistently.**\n\
    +      *What you create, also clean up: If you define any of the copy constructor,\
    \ copy assignment operator, or destructor, you might need to define one or both\
    \ of the others.*\n+   \n+   53. **Explicitly enable or disable copying.**\n+\
    \      *Copy consciously: Knowingly choose among using the compiler-generated\
    \ copy constructor and assignment operator, writing your own versions, or explicitly\
    \ disabling both if copying should not be allowed.*\n+   \n+   54. **Avoid slicing.\
    \ Consider Clone instead of copying in base classes.**\n+      *Sliced bread is\
    \ good; sliced objects aren't: Object slicing is automatic, invisible, and likely\
    \ to bring wonderful polymorphic designs to a screeching halt. In base classes,\
    \ consider disabling the copy constructor and copy assignment operator, and instead\
    \ supplying a virtual **Clone** member function if clients need to make polymorphic\
    \ (complete, deep) copies.*\n+   \n+   55. **Prefer the canonical form of assignment.**\n\
    +      *Your assignment: When implementing **operator=**, prefer the canonical\
    \ form—nonvirtual and with a specific signature.*\n+   \n+   56. **Whenever it\
    \ makes sense, provide a no-fail swap (and provide it correctly).**\n+      *swap\
    \ is both a lightweight and a workhorse: Consider providing a **swap** function\
    \ to efficiently and infallibly swap the internals of this object with another's.\
    \ Such a function can be handy for implementing a number of idioms, from smoothly\
    \ moving objects around to implementing assignment easily to providing a guaranteed\
    \ commit function that enables strongly error-safe calling code. (See also Item\
    \ 51.)*\n\n# ## Namespaces and Modules\n\n+   57. **Keep a type and its nonmember\
    \ function interface in the same namespace.**\n+      *Nonmembers are functions\
    \ too: Nonmember functions that are designed to be part of the interface of a\
    \ class **X** (notably operators and helper functions) must be defined in the\
    \ same namespace as the **X** in order to be called correctly.*\n+   \n+   58.\
    \ **Keep types and functions in separate namespaces unless they're specifically\
    \ intended to work together.**\n+      *Help prevent name lookup accidents: Isolate\
    \ types from unintentional argument-dependent lookup (ADL, also known as Koenig\
    \ lookup), and encourage intentional ADL, by putting them in their own namespaces\
    \ (along with their directly related nonmember functions; see Item 57). Avoid\
    \ putting a type into the same namespace as a templated function or operator.*\n\
    +   \n+   59. **Don't write namespace usings in a header file or before an #include.**\n\
    +      *Namespace usings: are for your convenience, not for you to inflict on\
    \ others: Never write a **using** declaration or a **using** directive before\
    \ an **#include** directive.*"
