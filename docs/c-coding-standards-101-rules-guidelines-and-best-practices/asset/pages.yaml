  md: '[Aside: Turning on exception handling can be implemented so that it increases
    the size of your executable image (this part is unavoidable) but incurs zero or
    near-zero performance overhead in the case where no exception is thrown, and some
    compilers do so. Other compilers do incur overhead, especially when providing
    secure modes to prevent malicious code from attacking the exception handling mechanism
    via buffer overruns. Whether there is overhead or not, at minimum do always at
    least turn on your compiler’s support for exception handling, because otherwise
    the language and standard library won’t report errors correctly. We mention this
    because we know of projects that turn off exception handling, which is a far-reaching
    fundamental decision and should never be done except as a last resort and with
    extreme care (see Exceptions).]


    Once your compiler’s support for exception handling is turned on, the performance
    difference between throwing an exception and returning an error code is typically
    negligible in normal processing (the case where no error occurs). You may notice
    a performance difference in the case where an error does occur, but if you’re
    throwing so frequently that the exception throwing/catching handling performance
    overhead is actually noticeable, you’re almost certainly using exceptions for
    conditions that are not true errors and therefore not correctly distinguishing
    between errors and non-errors (see Item 70). If they’re really errors that truly
    violate pre- and postconditions and invariants, and if they’re really happening
    *that* frequently, the application has far more serious problems.


    One symptom of error code overuse is when application code needs to check relentlessly
    for trivially true conditions, or (worse) fails to check error codes that it should
    check.


    One symptom of exception overuse is when application code throws and catches exceptions
    so frequently that a **try** block’s success count and failure count are within
    the same order of magnitude. Such a **catch** block is either not really handling
    a true error (one that violates preconditions, postconditions, or invariants),
    or the program is in serious trouble.


    # Examples


    *Example 1: Constructors (invariant error).* If a constructor cannot successfully
    create an object of its type, which is the same as saying that it cannot establish
    all of the new object’s invariants, it should throw an exception. Conversely,
    an exception thrown from a constructor always means that the object’s construction
    failed and the object’s lifetime never began; the language enforces this.


    *Example 2: Successful recursive tree search.* When searching a tree using a recursive
    algorithm, it can be tempting to return the result—and conveniently unwind the'
