- pgno: 172
  md: '# 81. Prefer range operations to single-element operations.


    **Summary**


    Don''t use oars when the wind is fair (based on a Latin proverb): When adding
    elements to sequence containers, prefer to use range operations (e.g., the form
    of **insert** that takes a pair of iterators) instead of a series of calls to
    the single-element form of the operation. Calling the range operation is generally
    easier to write, easier to read, and more efficient than an explicit loop. (See
    also Item 84.)


    **Discussion**


    The more context you can give a function, the better the chances that it can do
    something useful with the information. In particular, when you call a single function
    and pass it a pair of iterators **first** and **last** that delimit a range, it
    can perform optimizations based on knowing the number of objects that are going
    to be added, which it obtains by computing **distance(first,last)**.


    The same applies to “repeat *n* times” operations, such as the **vector** constructor
    that takes a repeat count and a value.


    **Examples**


    *Example 1: **vector::insert**.* Let''s say you want to add *n* elements into
    a **vector** *v*. Calling **v.insert(position,x)** repeatedly can cause multiple
    reallocations as *v* grows its storage to accommodate each new element. Worse,
    each single-element **insert** is a linear operation because it has to shuffle
    over enough elements to make room, and this makes inserting *n* elements with
    repeated calls to the single-element **insert** actually a quadratic operation!
    Of course, you could get around the multiple-reallocation problem by calling **reserve**,
    but that doesn''t reduce the shuffling and the quadratic nature of the operation.
    It''s faster and simpler to just say what you''re doing: **v.insert(position,first,last)**,
    where **first** and **last** are iterators delimiting the range of elements to
    be added into *v*. (If **first** and **last** are input iterators, there''s no
    way to determine the size of the range before actually traversing it, and therefore
    *v* might still need to perform multiple reallocations; but the range version
    is still likely to perform better than inserting elements individually.)


    *Example 2: Range construction and assignment.* Calling a constructor (or **assign**
    function) that takes an iterator range typically performs better than calling
    the default constructor (or **clear**) followed by individual insertions into
    the container.


    **References**


    [*Meyers01*] §5 • [*Stroustrup00*] §16.3.8'
