- pgno: 214
  md: "# Functions and Operators\n\n+   25. **Take parameters appropriately by value,\
    \ (smart) pointer, or reference.**  \n+   *Parameterize well:* Distinguish among\
    \ input, output, and input/output parameters, and between value and reference\
    \ parameters. Take them appropriately.\n\n+   26. **Preserve natural semantics\
    \ for overloaded operators.**  \n+   *Programmers hate surprises:* Overload operators\
    \ only for good reason, and preserve natural semantics; if that's difficult, you\
    \ might be misusing operator overloading.\n\n+   27. **Prefer the canonical forms\
    \ of arithmetic and assignment operators.**  \n+   *If you `a+b`, also `a+=b`:*\
    \ When defining binary arithmetic operators, provide their assignment versions\
    \ as well, and write to minimize duplication and maximize efficiency.\n\n+   28.\
    \ **Prefer the canonical form of `++` and `--`. Prefer calling the prefix forms.**\
    \  \n+   *If you `++c`, also `c++`:* The increment and decrement operators are\
    \ tricky because each has pre- and postfix forms, with slightly different semantics.\
    \ Define `operator++` and `operator--` that mimic the behavior of their built-in\
    \ counterparts. Prefer to call the prefix versions if you don't need the original\
    \ value.\n\n+   29. **Consider overloading to avoid implicit type conversions.**\
    \  \n+   *Do not multiply objects beyond necessity (Occam's Razor):* Implicit\
    \ type conversions provide syntactic convenience (but see Item 40). But when the\
    \ work of creating temporary objects is unnecessary and optimization is appropriate\
    \ (see Item 8), you can provide overloaded functions with signatures that match\
    \ common argument types exactly and won't cause conversions.\n\n+   30. **Avoid\
    \ overloading `&&`, `||`, or `,` (comma).**  \n+   *Wisdom means knowing when\
    \ to refrain:* The built-in `&&`, `||`, and `,` (comma) enjoy special treatment\
    \ from the compiler. If you overload them, they become ordinary functions with\
    \ very different semantics (you will violate Items 26 and 31), and this is a sure\
    \ way to introduce subtle bugs and fragilities. Don't overload these operators\
    \ natively.\n\n+   31. **Don't write code that depends on the order of evaluation\
    \ of function arguments.**  \n+   *Keep (evaluation) order:* The order in which\
    \ arguments of a function are evaluated is unspecified, so don't rely on a specific\
    \ ordering.\n\n# Class Design and Inheritance\n\n+   32. **Be clear what kind\
    \ of class you're writing.**  \n+   *Know thyself:* There are different kinds\
    \ of classes. Know which kind you are writing.\n\n+   33. **Prefer minimal classes\
    \ to monolithic classes.**  \n+   *Divide and conquer:* Small classes are easier\
    \ to write, get right, test, and use. They are also more likely to be usable in\
    \ a variety of situations. Prefer such small classes that embody simple concepts\
    \ instead of kitchen-sink classes that try to implement many and/or complex concepts\
    \ (see Items 5 and 6)."
