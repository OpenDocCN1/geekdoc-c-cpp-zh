  md: '# 75. Avoid exception specifications.


    # Summary


    Take exception to these specifications: Don’t write exception specifications on
    your functions unless you’re forced to (because other code you can’t change has
    already introduced them; see Exceptions).


    # Discussion


    In brief, don’t bother with exception specifications. Even experts don’t bother.
    The main problems with exception specifications are that they’re only “sort of”
    part of the type system, they don’t do what most people think, and you almost
    always don’t want what they actually do.


    Exception specifications aren’t part of a function’s type, except when they are.
    They form a shadow type system whereby writing an exception specification is variously:


    +   - *Illegal*: In a typedef for a pointer to function.

    +   - *Allowed*: In the identical code without the typedef.

    +   - *Required*: In the declaration of a virtual function that overrides a base
    class virtual function that has an exception specification.

    +   - *Implicit and automatic*: In the declaration of the constructors, assignment
    operators, and destructors when they are implicitly generated by the compiler.


    A common but nevertheless incorrect belief is that exception specifications statically
    guarantee that functions will throw only listed exceptions (possibly none), and
    enable compiler optimizations based on that knowledge.


    In fact, exception specifications actually do something slightly but fundamentally
    different: They cause the compiler to inject additional run-time overhead in the
    form of implicit try/catch blocks around the function body to enforce via run-time
    checking that the function does in fact emit only listed exceptions (possibly
    none), unless the compiler can statically prove that the exception specification
    can never be violated in which case it is free to optimize the checking away.
    And exception specifications can both enable and prevent further compiler optimizations
    (besides the inherent overhead already described); for example, some compilers
    refuse to inline functions that have exception specifications.


    Worst of all, however, is that exception specifications are a blunt instrument:
    When violated, by default they immediately terminate your program. You can register
    an unexpected_handler, but it’s highly unlikely to help you much because you get
    exactly one global handler and the only way the handler could avoid immediately
    calling terminate would be to rethrow an exception that is permissible—but because'
