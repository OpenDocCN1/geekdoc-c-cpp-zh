  md: "# 94. Avoid casting away const.\n\n# Summary\n\nSome f i bs are punishable:\
    \ Casting away **const** sometimes results in undefined behavior, and it is a\
    \ staple of poor programming style even when legal.\n\n# Discussion\n\nOnce you\
    \ go **const**, you (should) never go back. If you cast away **const** on an object\
    \ whose original definition really did define it to be **const**, all bets are\
    \ off and you are in undefined behavior land. For example, compilers can (and\
    \ do) put constant data into ROM or write-protected RAM pages. Casting away **const**\
    \ from such a truly **const** object is a punishable lie, and often manifests\
    \ as a memory fault.\n\nEven when it doesn’t crash your program, casting away\
    \ **const** is a broken promise and doesn’t do what many expect. For example,\
    \ this doesn’t allocate a variable-sized array:\n\n```\nvoid Foolish( unsigned\
    \ int n ) {\n    const unsigned int size = 1;\n    **const_cast<unsigned int&>(size)\
    \ = n;**    // bad: don’t do this\n    char buffer[size];                    \
    \     // will always have size 1\n    // ...\n}\n```\n\nC++ has one implicit **const_cast**,\
    \ the “conversion of death” from a string literal to **char\\***:\n\n```\nchar*\
    \ weird = “Trick or treat?”;\n```\n\nThe compiler performs a silent **const_cast**\
    \ from **const char[16]** to **char\\***. This was allowed for compatibility with\
    \ C APIs, but it’s a hole in C++’s type system. String literals are ROM-able,\
    \ and trying to modify the string is liable to cause a memory fault.\n\n# Exceptions\n\
    \nCasting away **const** can be necessary to call const-incorrect APIs (see Item\
    \ 15). It is also useful when a function that must take and return the same kind\
    \ of reference has **const** and non-**const** overloads, implemented by having\
    \ one call the other:\n\n```\nconst Object& f( const Object& );\n\nObject& f(\
    \ Object& obj ) {\n    const Object& ref = obj;\n    return **const_cast<Object&>**(\
    \ f(ref) );    // have to const_cast the return type\n}\n```\n\n# References\n\
    \n*[Dewhurst03] §32, §40 • [Sutter00] §44*"
