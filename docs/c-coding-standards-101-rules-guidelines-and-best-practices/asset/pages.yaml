- pgno: 55
  md: '# 21. Avoid initialization dependencies across compilation units.


    # Summary


    Keep (initialization) order: Namespace-level objects in different compilation
    units should never depend on each other for initialization, because their initialization
    order is undefined. Doing otherwise causes headaches ranging from mysterious crashes
    when you make small changes in your project to severe non-portability even to
    new releases of the same compiler.


    # Discussion


    When you define two namespace-level objects in different compilation units, which
    object’s constructor is called first is not defined. Often (but not always) your
    tools might happen to initialize them in the order in which the compilation units’
    object files are linked, but this assumption is usually not reliable; even when
    it does hold, you don’t want the correctness of your code to subtly depend on
    your makefile or project file. (For more on the evils of order dependencies, see
    also Item 59.)


    Therefore, inside the initialization code of any namespace-level object, you can’t
    assume that any other object defined in a different compilation unit has already
    been initialized. These considerations apply to dynamically initialized variables
    of primitive types, such as a namespace-level **bool reg_success = LibRegister("mylib");**


    Note that, even before they are ever constructed using a constructor, namespace-level
    objects are statically initialized with all zeroes (as opposed to, say, automatic
    objects that initially contain garbage). Paradoxically, this zero-initialization
    can make bugs harder to detect, because instead of crashing your program swiftly
    the static zero-initialization gives your yet-uninitialized object an appearance
    of legitimacy. You’d think that the string is empty, that pointer is null, and
    that integer is zero, when in fact no code of yours has bothered to initialize
    them yet.


    To avoid this problem, avoid namespace-level variables wherever possible; they
    are dangerous (see Item 10). When you do need such a variable that might depend
    upon another, consider the Singleton design pattern; used carefully, it might
    avoid implicit dependencies by ensuring that an object is initialized upon first
    access. Still, Singleton is a global variable in sheep’s clothing (see again Item
    10), and is broken by mutual or cyclic dependencies (again, zero-initialization
    only adds to the confusion).


    # References


    [Dewhurst03] §55 • [Gamma95] • [McConnell93] §5.1-4 • [Stroustrup00] §9.4.1, §10.4.9'
