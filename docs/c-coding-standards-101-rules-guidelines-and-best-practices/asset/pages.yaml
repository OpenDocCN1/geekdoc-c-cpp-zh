  md: '# 39. Consider making virtual functions nonpublic, and public functions nonvirtual.


    # Summary


    In base classes with a high cost of change (particularly ones in libraries and
    frameworks): Prefer to make public functions nonvirtual. Prefer to make virtual
    functions private, or protected if derived classes need to be able to call the
    base versions. (Note that this advice does not apply to destructors; see Item
    50.)


    # Discussion


    Most of us have learned through bitter experience to make class members private
    by default unless we really need to expose them. That’s just good encapsulation.
    This wisdom is applied most frequently to data members (see Item 41), but it applies
    equally to all members, including virtual functions.


    Particularly in OO hierarchies that are expensive to change, prefer full abstraction:
    Prefer to make public functions nonvirtual, and prefer to make virtual functions
    private (or protected if derived classes need to be able to call the base versions).
    This is the Nonvirtual Interface (NVI) pattern. (NVI is similar to other patterns,
    notably Template Method [Gamma95], but has a distinct motivation and purpose.)


    A public virtual function inherently has two different and competing responsibilities,
    aimed at two different and competing audiences:


    +   - *It specifies interface:* Being public, it is directly part of the interface
    the class presents to the rest of the world.

    +   - *It specifies implementation detail:* Being virtual, it provides a hook
    for derived classes to replace the base implementation of that function (if any);
    it is a customization point.


    Because these two responsibilities have different motives and audiences, they
    can be (and frequently are) in conflict, and then one function by definition cannot
    fulfill both responsibilities perfectly. That a public virtual function inherently
    has two significantly different jobs and two competing audiences is a sign that
    it’s not separating concerns well—including that it is inherently violating Items
    5 and 11—and that we should consider a different approach.


    By separating public functions from virtual functions, we achieve the following
    significant benefits:


    +   - *Each interface can take its natural shape:* When we separate the public
    interface from the customization interface, each can easily take the form it naturally'
