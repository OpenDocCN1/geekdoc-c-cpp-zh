- pgno: 63
  md: '# # 26. Preserve natural semantics for overloaded operators.


    # ### Summary


    Programmers hate surprises: Overload operators only for good reason, and preserve
    natural semantics; if that''s difficult, you might be misusing operator overloading.


    # ### Discussion


    Although anyone would agree (we hope) that one should not implement subtraction
    in an `operator+` implementation, other cases can be subtle. For example, does
    your `Tensor` class''s `operator*` mean the scalar product or the vector product?
    Does `operator+=(const T&, unsigned u)` add `u` to each of `t`''s elements, or
    will it resize `t`? In such ambiguous or counterintuitive cases, prefer using
    named functions instead of fostering cryptic code.


    For value types (but not all types; see Item 32): “When in doubt, do as the `int`s
    do.” [Meyers96] Mimicking the behavior of and relationships among operators on
    built-in types ensures that you don''t surprise anyone. If your semantics of choice
    are likely to raise eyebrows, maybe operator overloading is not a good idea.


    Programmers expect operators to come in bundles. If the expression `a @ b` is
    well formed for some operator `@` you define (possibly after conversions), ask:
    Can the caller also write `b @ a` without surprises? Can the caller write `a @=
    b`? (See Item 27.) If the operator has an inverse (e.g., `+` and `-`, or `*` and
    `/`), are both supported?


    Named functions are less likely to have such assumed relationships, and therefore
    should be preferred for clearer code if there can be any doubt about semantics.


    # ### Exceptions


    There are highly specialized libraries (e.g., parser generators and regular expression
    engines) that define domain-specific conventions for operators that are very different
    from their C++ meanings (e.g., a regular expression engine might use `operator*`
    to express “zero or more”). Prefer instead to find an alternative to unusual operator
    overloading (e.g., [C++TR04] regular expressions use strings, so that `*` can
    be used naturally without overloading operators). If after careful thought you
    choose to use operators anyway, make sure you define a coherent framework for
    your conventions and that you don''t step on the toes of any built-in operator.


    # ### References


    +   - [Cline99] §23.02-06

    +   - [C++TR104] §7

    +   - [Dewhurst03] §85-86

    +   - [Koenig97] §4

    +   - [Lakos96] §9.1.1

    +   - [Meyers96] §6

    +   - [Stroustrup00] §11.1

    +   - [Sutter00] §41'
  merge: -1
  img_proc: true
- pgno: 64
  md: "# # 27. Prefer the canonical forms of arithmetic and assignment operators.\n\
    \n# ## Summary\n\nIf you a+b, also a+=b: When defining binary arithmetic operators,\
    \ provide their assignment versions as well, and write to minimize duplication\
    \ and maximize efficiency.\n\n# ## Discussion\n\nIn general, for some binary operator\
    \ @ (be it +, -, *, and so on), you should define its assignment version such\
    \ that a @= b and a = a @ b have the same meaning (other than that the first form\
    \ might be more efficient and only evaluates a once). The canonical way of achieving\
    \ this goal is to define @ in terms of @=, as follows:\n\n```\n```cpp\nT& T::operator@=(\
    \ const T& ) {\n    // ... implementation ...\n    return *this;\n}\n\nT operator@(\
    \ const T& lhs, const T& rhs ) {\n    T temp( lhs );\n    return temp @= rhs;\n\
    }\n```\n```\n\nThe two functions work in tandem. The assignment form does the\
    \ actual work and returns its left-hand parameter. The non-assignment version\
    \ creates a temporary from lhs, modifies it by invoking the assignment form, and\
    \ returns it.\n\nNote that here operator@ is a nonmember function, so that it\
    \ will have the desirable property of accepting the same implicit conversions\
    \ on its left-hand side and right-hand side parameters. (See Item 44.) For example,\
    \ if you define a class String that has an implicit constructor taking a char,\
    \ making operator+( const String&, const String& ) a nonmember enables both char\
    \ + String and String + char to work; a member version String::operator+( const\
    \ String& ) would only accept the latter. An efficiency-minded implementation\
    \ might choose to define several nonmember overloads of operator@ to avoid proliferation\
    \ of temporaries resulting from conversions (see Item 29).\n\nWhere possible,\
    \ make operator@= a nonmember function as well (see Item 44). In any case, put\
    \ all nonmember operators in the same namespace as T so that they will be conveniently\
    \ available to callers as well as to avoid name lookup surprises (see Item 57)."
  merge: -1
  img_proc: true
- pgno: 65
  md: "A variation is to have **operator@** accept its first parameter by value. This\
    \ way, you arrange for the compiler itself to perform the copy for you implicitly,\
    \ and this can give the compiler more leeway in applying optimizations:\n\n```\n\
    T& operator@=( T& lhs, const T& rhs ) {\n  // ... implementation ...\n  return\
    \ lhs;\n}\n\nT operator@( T lhs, const T& rhs ) {          // lhs taken by value\n\
    \  return lhs @= rhs;\n}\n```\n\nAnother variation is to have **operator@** return\
    \ a **const** value. This technique has the advantage that it disables nonsensical\
    \ code such as **a + b = c**, but it does so at the cost of disabling some potentially\
    \ useful constructs such as **a = (b + c).replace(pos, n, d)**—expressive code\
    \ that, in one shot, concatenates strings **b** and **c**, replaces some characters,\
    \ and assigns the final result to **a**.\n\n# Examples\n\n*Example: An implementation\
    \ of += for strings.* When concatenating strings, it is useful to know the length\
    \ in advance so as to allocate memory only once.\n\n```\nString& String::operator+=\
    \ ( const String& rhs ) {\n  // ... implementation ...\n\n  return *this;\n}\n\
    \nString operator+ ( const String& lhs, const String& rhs ) {\n  String temp;\
    \                               // initially empty\n  temp.Reserve( lhs.size()\
    \ + rhs.size() );   // allocate enough memory\n  return (temp += lhs) += rhs;\
    \               // append the strings and return\n}\n```\n\n# Exceptions\n\nIn\
    \ some cases (e.g., **operator*=** on complex numbers), an operator might mutate\
    \ its left-hand side so significantly that it can be more advantageous to implement\
    \ **operator*=** in terms of **operator*** rather than the reverse.\n\n# References\n\
    \n[Alexandrescu03a] • [Cline99] §23.06 • [Meyers96] §22 • [Sutter00] §20"
  merge: -1
  img_proc: true
- pgno: 66
  md: "# 28. Prefer the canonical form of ++ and --. Prefer calling the prefix forms.\n\
    \n# Summary\n\nIf you ++c, also c++: The increment and decrement operators are\
    \ tricky because each has pre- and postfix forms, with slightly different semantics.\
    \ Define **operator++** and **operator--** such that they mimic the behavior of\
    \ their built-in counterparts. Prefer to call the prefix versions if you don’t\
    \ need the original value.\n\n# Discussion\n\nAn ancient joke about C++ was that\
    \ the language is called C++ and not ++C because the language is improved (incremented),\
    \ but many people still use it as C (the previous value). Fortunately, the joke\
    \ is now obsolete, but it’s a helpful illustration for understanding the difference\
    \ between the two operator forms.\n\nFor ++ and --, the postfix forms return the\
    \ original value, whereas the prefix forms return the new value. Prefer to implement\
    \ the postfix form in terms of the prefix form. The canonical form is:\n\n```\n\
    ```cpp\nT& T::operator++() {\n  // perform increment\n  return *this;\n}\n\nT&\
    \ T::operator--() {      // the prefix form:\n  // perform decrement    // - do\
    \ the work\n  return *this;           // - always return *this;\n}\n\nT T::operator++(int)\
    \ {    // the postfix form:\n  T old(*this);           // - remember old value\n\
    \  ++*this;                // - call the prefix version\n  return old;       \
    \      // - return the old value\n}\n\nT T::operator--(int) {\n  T old(*this);\n\
    \  --*this;\n  return old;\n}\n```\n```\n\nIn calling code, prefer using the prefix\
    \ form unless you actually need the original value returned by the postfix version.\
    \ The prefix form is semantically equivalent, just as much typing, and often slightly\
    \ more efficient by creating one less object. This is not premature optimization;\
    \ it is avoiding premature pessimization (see Item 9).\n\n# Exceptions\n\nExpression\
    \ template frameworks preserve the semantics via different means.\n\n# References\n\
    \n*[Cline99] §23.07-08  •  [Dewhurst03] §87  •  [Meyers96] §6  •  [Stroustrup00]\
    \ §19.3  •  [Sutter00] §6, §20"
  merge: -1
  img_proc: true
- pgno: 67
  md: "# 29. Consider overloading to avoid implicit type conversions.\n\n# Summary\n\
    \nDo not multiply objects beyond necessity (Occam’s Razor): Implicit type conversions\
    \ provide syntactic convenience (but see Item 40). But when the work of creating\
    \ temporary objects is unnecessary and optimization is appropriate (see Item 8),\
    \ you can provide overloaded functions with signatures that match common argument\
    \ types exactly and won’t cause conversions.\n\n# Discussion\n\nIf you’re in the\
    \ office and run out of paper, what do you do? Of course, you walk to your trusty\
    \ photocopier and make several copies of a white sheet of paper.\n\nAs silly as\
    \ it sounds, this is often what implicit conversions do: unnecessarily go through\
    \ the trouble of creating temporaries, just to perform some trivial operation\
    \ on them and toss them away (see Item 40). A common example is string comparison:\n\
    \n```\nclass String { // ...\n  String( const char* text );                 //\
    \ enables implicit conversion\n};\nbool operator==( const String&, const String&\
    \ );\n\n// ... somewhere in the code ...\nif( someString == \"Hello\" ) { ...\
    \ }\n```\n\nHaving seen the definitions above, the compiler will compile the comparison\
    \ as if you had written `someString == String(\"Hello\")`. This can be quite wasteful,\
    \ considering that you don’t need to copy the characters just to read them. The\
    \ solution to this problem is simple: define overloads that avoid the conversion.\
    \ For example:\n\n```\nbool operator==( const String& lhs, const String& rhs );\
    \       // #1\nbool operator==( const String& lhs, const char* rhs );        \
    \ // #2\nbool operator==( const char* lhs, const String& rhs );         // #3\n\
    ```\n\nThat looks like a lot of code duplication, but it really is only “signature\
    \ duplication” because all three typically use the same back-end function. You’re\
