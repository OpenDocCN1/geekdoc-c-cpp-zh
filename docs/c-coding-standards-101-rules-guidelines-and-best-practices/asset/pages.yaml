- pgno: 117
  md: "What if U does not implement a no-fail swap function, as is the case with many\
    \ legacy classes, and you still need T to support a swap function? All is not\
    \ lost:\n\n+   - If U’s copy constructor and copy assignment don’t fail (as, again,\
    \ might be the case with legacy classes), **std::swap** will work fine on U objects.\n\
    +   - If U’s copy constructor might fail, you can store a (smart) pointer to U\
    \ instead of a direct member. Pointers are easily swappable. They do incur the\
    \ additional overhead of one extra dynamic storage allocation and one extra access\
    \ indirection, but if you store all such members in a single Pimpl object you’ll\
    \ incur the overhead only once for all private members. (See Item 43.)\n\nNever\
    \ use the trick of implementing copy assignment in terms of copy construction\
    \ by using an explicit destructor followed by placement **new**, even though this\
    \ trick still crops up regularly in C++ forums. (See also Item 99.) That is, never\
    \ write:\n\n```\nT& T::operator=( const T& rhs ) {             // bad: an anti-idiom\n\
    \  if( this != &rhs ) {\n    **this->~T();**                               //\
    \ this technique is evil\n    **new (this) T( rhs );**                     //\
    \ (see [Sutter00] §41)\n  }\n  return *this;\n}\n```\n\nPrefer to provide a nonmember\
    \ swap function in the same namespace as your type when objects of your type have\
    \ a way to exchange their values more efficiently than via brute-force assignment,\
    \ such as if they have their own **swap** or equivalent function (see Item 57).\
    \ Additionally, consider specializing **std::swap** for your own nontemplate types:\n\
    \n```\nnamespace std {\n  template<> void swap( **MyType**& lhs, **MyType**& rhs\
    \ ) {   // for MyType objects,\n    lhs.swap( rhs );                         \
    \             // use MyType::swap\n  }\n}\n```\n\nThe standard does not allow\
    \ you to do this when **MyType** is itself a template class. Fortunately, this\
    \ specialization is just a nice-to-have; the primary technique is to provide a\
    \ type-customized swap as a nonmember in the same namespace as the type.\n\n#\
    \ Exceptions\n\nSwapping is valuable for classes with value semantics. It is less\
    \ often useful for base classes because you use those classes through pointers\
    \ anyway. (See Items 32 and 54.)\n\n# References\n\n*[C++03] §17.4.3.1(1) • [Stroustrup00]\
