- pgno: 187
  md: "More importantly, you need a function object, not a function, to specify comparers\
    \ for associative containers. This is because it's illegal to instantiate a template\
    \ type parameter with a function directly:\n\n```\nbool CompareThings( const Thing&,\
    \ const Thing& );\nset<Thing, CompareThings> s;                    // error\n\
    ```\n\nInstead, you need:\n\n```\nstruct CompareThings : public binary_function<Thing,Thing,bool>\
    \ {\n    bool operator()( const Thing&, const Thing& ) const;\n};\n\nset<Thing,\
    \ CompareThings> s;                    // ok\n```\n\nFinally, there is also an\
    \ efficiency benefit. Consider this familiar algorithm:\n\n```\ntemplate<typename\
    \ Iter, typename Compare>\nIter find_if( Iter first, Iter last, Compare comp );\n\
    ```\n\nIf we pass a function as the comparer to `find_if`\n\n```\ninline bool\
    \ Function( const Thing& ) { /*...*/ }\n\nfind_if( v.begin(), v.end(), Function\
    \ );\n```\n\nwe're actually passing a reference to `Function`. Compilers rarely\
    \ inline such function calls (except as part of whole-program analysis, which\
    \ is still a relatively recent feature on popular compilers), even when as above\
    \ the function is declared `inline` and is visible while compiling the `find_if`\
    \ call. And, as noted, functions aren't adaptable.\n\nIf we pass a function object\
    \ as the comparer to `find_if`\n\n```\nstruct FunctionObject : unary_function<Thing,\
    \ bool> {\n    bool operator()( const Thing& ) const { /*...*/ }\n};\n\nfind_if(\
    \ v.begin(), v.end(), FunctionObject() );\n```\n\nwe're passing an object that\
    \ typically has an (implicitly or explicitly) inline `operator()` function. Compilers\
    \ have routinely inlined such calls since C++'s Bronze Age.\n\nNote: This is not\
    \ to encourage premature optimization (see Item 8), but to discourage premature\
    \ pessimization (see Item 9). If you already have a function, go ahead and pass\
    \ a pointer to the function (unless you have to wrap it with `ptr_fun` or `mem_fun`\
    \ anyway). But if you're writing a new piece of code for use as an argument to\
    \ an algorithm, prefer writing the extra boilerplate to make it a function object.\n\
    \n# References\n\n[Austern99] §4, §8, §15 • [Josuttis99] §5.9 • [Meyers01] §46\
    \ • [Musser01] §8 • [Sutter04] §25"
  merge: -1
