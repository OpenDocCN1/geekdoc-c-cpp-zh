  md: "# 56. Whenever it makes sense, provide a no-fail swap (and provide it correctly).\n\
    \n# Summary\n\n**swap** is both a lightweight and a workhorse: Consider providing\
    \ a **swap** function to efficiently and infallibly swap the internals of this\
    \ object with another’s. Such a function can be handy for implementing a number\
    \ of idioms, from smoothly moving objects around to implementing assignment easily\
    \ to providing a guaranteed commit function that enables strongly error-safe calling\
    \ code. (See also Item 51.)\n\n# Discussion\n\nA **swap** function typically looks\
    \ like this, where **U** is some user-defined type:\n\n```\nclass T { // ...\n\
    public:\n  void swap( T& rhs ) {\n    member1_.swap( rhs.member1_ );\n    std::swap(\
    \ member2_, rhs.member2_ );\n  }\nprivate:\n  U member1_;\n  int member2_;\n};\n\
    ```\n\nFor primitive types and for standard containers, **std::swap** will do.\
    \ Other classes might implement swapping as a member function under various names.\n\
    \nConsider using **swap** to implement copy assignment in terms of copy construction.\
    \ The following implementation of **operator=** provides the strong guarantee\
    \ (see Item 71), although at the price of creating an extra object, which can\
    \ be inappropriate if there are more efficient ways to perform error-safe assignment\
    \ for T objects:\n\n```\nT& T::operator=( const T& other ) {  // good: Variant\
    \ #1 (traditional)\n  T temp( other );\n  swap( temp );\n  return *this;\n}\n\n\
    T& T::operator=( T temp ) {           // good: Variant #2 (see Item 27)\n  swap(\
    \ temp );                        // note: temp passed by value\n  return *this;\n\
    }\n```"
