- pgno: 167
  md: '+   - Guaranteed to have the lowest space overhead of any container (zero bytes
    per object).

    +   - Guaranteed to have the fastest access speed to contained elements of any
    container.

    +   - Guaranteed to have inherent locality of reference, meaning that objects
    near each other in the container are guaranteed to be near each other in memory,
    which is not guaranteed by any other standard container.

    +   - Guaranteed to be layout-compatible with C, unlike any other standard container.
    (See Items 77 and 78.)

    +   - Guaranteed to have the most flexible iterators (random access iterators)
    of any container.

    +   - Almost certain to have the fastest iterators (pointers, or classes with
    comparable performance that often compile away to the same speed as pointers when
    not in debug mode), faster than those of all other containers.


    *Do* you have a reason not to use that container by default? If you do have a
    reason, because of your answers to the first three bulleted questions in this
    Item, that’s just great and perfectly fine—use the other container knowing you
    did the right thing. If you don’t, write **vector** and keep going without breaking
    stride, again knowing you did the right thing.


    Finally, prefer to use standard library containers and algorithms over vendor-specific
    or handcrafted code.


    # ### Examples


    *Example:* **vector** for small lists. Is it a common fallacy to use **list**
    just because “list is obviously the right type for list operations,” such as insertion
    into the middle of a sequence. Using a **vector** for small lists is almost always
    superior to using **list**. Even though insertion in the middle of the sequence
    is a linear-time operation for **vector** and a constant-time operation for **list**,
    **vector** usually outperforms **list** when containers are relatively small because
    of its better constant factor, and **list**’s Big-Oh advantage doesn’t kick in
    until data sizes get larger.


    Here, use **vector** unless the data sizes warrant a different choice (see Item
    7), or because the strong safety guarantee is essential and the contained type’s
    copy constructor or copy assignment operator might fail (in which case, it can
    be important that **list** provides the strong guarantee for **insert** operations
    for collections of such types).


