- pgno: 98
  md: "# 46. If you provide any class-specific new, provide all of the standard forms\
    \ (plain, in-place, and nothrow).\n\n# Summary\n\nDon’t hide good **news**: If\
    \ a class defines any overload of **operator new**, it should provide overloads\
    \ of all three of plain, in-place, and non-throwing **operator new**. If you don’t,\
    \ they’ll be hidden and unavailable to users of your class.\n\n# Discussion\n\n\
    You rarely need to provide a custom **new** or **delete**, but if you need them\
    \ you usually don’t want to hide the built-in signatures.\n\nIn C++, after you\
    \ define a name in a scope (e.g., in a class scope), it will hide the same name\
    \ in all enclosing scopes (e.g., in base classes or enclosing namespaces), and\
    \ overloading never happens across scopes. And when said name is **operator new**,\
    \ you need to be extra cautious lest you make life hard for your class’s clients.\n\
    \nSay you define a class-specific **operator new**:\n\n```\nclass C {\n    //\
    \ ...\n    **static void* operator new(size_t, MemoryPool&);** // hides three\
    \ normal forms\n};\n```\n\nThen, if someone tries to write an expression as boring\
    \ as plain old **new C**, the compiler will reject it on grounds that it can’t\
    \ find plain old **operator new**. Declaring the **C::operator new** overload\
    \ that takes a **MemoryPool** hides all other overloads, including the familiar\
    \ built-in global versions that we all know and love, to wit:\n\n```\nvoid* operator\
    \ new(std::size_t);                         // plain new\nvoid* operator new(std::size_t,\
    \ std::nothrow_t) throw();   // nothrow new\nvoid* operator new(std::size_t, void*);\
    \                    // in-place new\n```\n\nAlternatively, perhaps your class\
    \ provides a class-specific version of one of these three operators **new**. In\
    \ that case, by declaring one of them your class will by default also mask the\
    \ other two:\n\n```\nclass C {\n    // ...\n    **static void* operator new(size_t,\
    \ void*);** // hides other two normal forms\n};\n```"
