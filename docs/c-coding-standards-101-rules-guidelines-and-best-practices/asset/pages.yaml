  md: "feature, not a bug, and this quality greatly increases **const**’s power even\
    \ though it was unjustly demeaned in the days when **const** wasn’t well understood\
    \ and appreciated. Retrofitting an existing code base to make it const-correct\
    \ takes effort, but it is worthwhile and likely to uncover latent bugs.\n\nConst-correctness\
    \ is worthwhile, proven, effective, and highly recommended. Understanding how\
    \ and where a program’s state changes is vital, and **const** documents that directly\
