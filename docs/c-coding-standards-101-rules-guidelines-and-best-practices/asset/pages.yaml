  md: 'search stack—by throwing the result as an exception. But don’t do it: An exception
    means an error, and finding the result is not an error (see [Stroustrup00]). (Note
    that, of course, failing to find the result is also not an error in the context
    of the search function; see the **find_first_of** example in Item 70.)


    See also Item 70’s examples, replacing “report an error” with “throw an exception.”


    # ### Exceptions


    In rare cases, consider using an error code if you are certain that both of the
    following are true:


    +   * *The benefits of exceptions don’t apply:* For example, you know that nearly
    always the immediate caller must directly handle the error and so propagation
    should happen either never or nearly never. This is very rare because usually
    the callee does not have this much information about the characteristics of all
    of its callers).

    +   * *The actual measured performance of throwing an exception over using an
    error code matters:* That is, the performance difference is measured empirically,
    so you’re probably in an inner loop and throwing often; the latter is rare because
    it usually means the condition is not really an error after all, but let’s assume
    that somehow it is.


    In very rare cases, some hard real-time projects may find themselves under pressure
    to consider turning off exception handling altogether because their compiler’s
    exception handling mechanism has worst-case time guarantees that make it difficult
    or impossible for key operations to meet deadline schedules. Of course, turning
    off exception handling means that the language and standard library will not report
    errors in a standard way (or in some cases at all; see your compiler’s documentation)
    and the project’s own error reporting mechanisms would have to be based on codes
    instead. It is difficult to exaggerate just how undesirable and how much of a
    last resort this should be; before making this choice, analyze in detail how you
    will report errors from constructors and operators and how that scheme will actually
    work on the compiler(s) you are using. If after serious and deep analysis you
    still feel that you are really forced to turn off exception handling, still don’t
    do it project-wide: Do so in as few modules as possible, and facilitate this by
    trying to group such deadline-sensitive operations together into the same module
    as much as possible.


