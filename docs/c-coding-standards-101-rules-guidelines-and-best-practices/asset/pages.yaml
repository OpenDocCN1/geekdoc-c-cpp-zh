  md: "Assertions often check conditions that could be verified at compile time if\
    \ the language were expressive enough. For example, your whole design might rely\
    \ on every `Employee` having a nonzero `id_`. Ideally, the compiler would analyze\
    \ `Employee`'s constructor and members and prove by static analysis that, indeed,\
    \ that condition is always true. Such omniscience, you can issue an `assert(id_\
    \ != 0)` inside the implementation of `Employee` whenever you need to make sure\
    \ an `Employee` is sane:\n\n```\n```cpp\nunsigned int Employee::GetID() {\n  \
    \  assert( id_ != 0 && \"Employee ID is invalid (must be nonzero)\" );\n    return\
    \ id_;\n}\n```\n```\n\nDon’t use assertions to report run-time errors (see Items\
    \ 70 and 72). For example, don’t use `assert` to make sure that `malloc` worked,\
    \ that a window creation succeeded, or that a thread was started. You can, however,\
    \ use `assert` to make sure that APIs work as documented. For example, if you\
    \ call some API function that is documented to always return a positive value,\
    \ but you suspect it might have a bug, plant an `assert` after the call to validate\
    \ its postcondition.\n\nIt is not recommended to throw an exception instead of\
    \ asserting, even though the standard `std::logic_error` exception class was originally\
    \ designed for this purpose. The primary disadvantage of using an exception to\
    \ report a programming error is that you don’t really want stack unwinding to\
    \ occur—you want the debugger to launch on the exact line where the violation\
    \ was detected, with the line’s state intact. In sum: There are errors that you\
    \ know might happen (see Items 69 to 75). For everything else that shouldn’t,\
    \ and it’s the programmer’s fault if it does, there is `assert`.\n\n# ## Examples\n\
    \n*Example:* **Do assert** on basic assumptions. We all have war stories about\
    \ assertions that “couldn’t possibly fire,” but did. Time and again, it’s: “This\
    \ value is certainly positive!” “That pointer is obviously not null!” **Do recheck**\
    \ tautologies: Software development is complex, change is the norm, and anything\
    \ can happen in a program that is changing. Assertions verify that what you believe\
    \ is “obviously true” today actually stays true. **Do assert** on tautologies\
    \ that the type system cannot enforce:\n\n```\n```cpp\nstring Date::DayOfWeek()\
    \ const {\n    assert( day_ > 0 && day_ <= 31 );             // invariant checks\n\
    \    assert( month_ > 0 && month_ <= 12 );\n    // ...\n}\n```\n```\n\n# ## References\n\
    \n[Abrams01b] • [Alexandrescu03b] • [Alexandrescu03c] • [Allison98] §13 • [Cargill92]\
    \ pp. 34–35 • [Cline99] §10.01–10 • [Dewhurst03] §28 • [Keffer95] pp. 24–25 •\
