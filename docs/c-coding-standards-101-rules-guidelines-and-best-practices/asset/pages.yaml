  md: "# ## 58. Keep types and functions in separate name-spaces unless they're specifically\
    \ intended to work together.\n\n**Summary**\n\nHelp prevent name lookup accidents:\
    \ Isolate types from unintentional argument-dependent lookup (ADL, also known\
    \ as Koenig lookup), and encourage intentional ADL, by putting them in their own\
    \ namespaces (along with their directly related nonmember functions; see Item\
    \ 57). Avoid putting a type into the same namespace as a templated function or\
    \ operator.\n\n**Discussion**\n\nBy following this advice, you will avoid having\
    \ to track down hard-to-diagnose errors in your code and avoid having to know\
    \ about excessively subtle language details that you, well, should never have\
    \ to know about.\n\nConsider this actual example that was posted publicly to a\
    \ newsgroup:\n\n```\n```cpp\n#include <vector>\n\nnamespace N {\n  struct X {\
    \ };\n\n  template<typename T>\n  int* operator+( T , unsigned ) { /* do something\
    \ */ }\n\n}\n\nint main() {\n  std::vector<N::X> v(5);\n  v[0] ;\n}\n```\n```\n\
    \nThe statement `v[0];` compiles on some standard library implementations but\
    \ not on others. To make a very long story moderately less long (take a deep breath):\
    \ The exceedingly subtle problem is that inside most implementations of `vector<T>::operator[]`\
    \ lurks code like `v.begin() + n`, and the name lookup for that `operator+` function\
    \ *might* reach out into the namespace (here N) of the type that `vector` is instantiated\
    \ with (here X). Whether it reaches out into N like that depends on how `vector<T>::iterator`\
    \ happens to be defined in that release of that standard library implementation—but\
    \ if it does look into N, then it will find `N::operator+`. Finally, depending\
    \ on the types involved, the compiler might just discover that `N::operator+`\
    \ is a better match than the `std::operator+` for `vector<T>::iterator`s that"
