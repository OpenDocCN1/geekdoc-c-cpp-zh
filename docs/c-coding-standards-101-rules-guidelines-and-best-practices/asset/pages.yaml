- pgno: 88
  md: '# # 41. Make data members private, except in behaviorless aggregates (C-style
    structs).


    # ## Summary


    They''re none of your caller''s business: Keep data members private. Only in the
    case of simple C-style **struct** types that aggregate a bunch of values but don''t
    pretend to encapsulate or provide behavior, make all data members public. Avoid
    mixes of public and nonpublic data, which almost always signal a muddled design.


    # ## Discussion


    Information hiding is key to good software engineering (see Item 11). Prefer making
    all data members private; private data is the best means that a class can use
    to preserve its invariants now, and to keep preserving them in the face of future
    changes.


    Public data is bad if a class models an abstraction and must therefore maintain
    invariants. Having public data means that part of your class''s state can vary
    uncontrollably, unpredictably, and asynchronously with the rest of its state.
    It means that an abstraction is sharing responsibility for maintaining one or
    more invariants with the unbounded set of all code that uses the abstraction,
    and that is obviously, fundamentally, and indefensibly flawed. Reject such designs
    outright.


    Protected data has all the drawbacks of public data, because protected data still
    means that an abstraction is sharing the responsibility of maintaining some invariant
    with an unbounded set of code—in this case, with the unbounded set of current
    and future derived classes. Further, any code can read and modify protected data
    as easily as public data by deriving a new class and using that to get at the
    data.


    Mixing public and nonpublic data members in the same class is confusing and inconsistent.
    Private data demonstrates that you have invariants and some intent to preserve
    them; mixing it with public data means a failure to decide clearly whether the
    class really is supposed to be an abstraction or not.


    Nonprivate data members are almost always inferior to even simple passthrough
    get/set functions, which allow for robust versioning.


    Consider hiding a class''s private members using the Pimpl idiom. (See Item 43.)


    # ## Examples


    *Example 1: Proper encapsulation.* Most classes (e.g., **Matrix**, **File**, **Date**,
    **BankAccount**, **Security**) should have all private data members and expose
    adequate interfaces. Allowing calling code to manipulate their internals directly
    would directly work against the abstraction they provide and the invariants they
    must sustain.'
