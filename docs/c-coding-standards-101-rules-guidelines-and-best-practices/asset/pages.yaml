- pgno: 180
  md: "An algorithm call is problematic. Absent lambdas, the two options are to write\
    \ a custom function object or to use the standard binders. Alas, with the binders\
    \ option we can’t use the standard binders alone but need to use the nonstandard\
    \ (although widely-available) **compose2** adapter, and even at that the code\
    \ is just impenetrable, and nobody would ever really write it:\n\n```\nvector<int>::iterator\
    \ i = find_if( v.begin(), v.end(),\n    compose2( logical_and<bool>(),\n     \
    \        bind2nd(greater<int>(), 0),\n             bind2nd(less<int>(),  y) )\
    \ );\n```\n\nThe other option, namely writing a custom function object, is viable.\
    \ It looks good at the call point, and its main drawback is that it requires writing\
    \ a **BetweenValues** function object that moves the body’s logic visually away\
    \ from the call point:\n\n```\ntemplate<typename T>\nclass BetweenValues : public\
    \ unary_function<T, bool> {\npublic:\n  BetweenValues( const T& low, const T&\
    \ high ) : low_(low), high_(high) {}\n  bool operator()( const T& val ) const\
    \ { return val > low_ && val < high_; }\n\nprivate:                          \
    \      // far away from the point of use\n  T low_, high_;\n};\n```\n\n```\nvector<int>::iterator\
    \ i = find_if( v.begin(), v.end(), BetweenValues<int>(x, y) );\n```\n\nLambda\
    \ functions, which generate the function object for us, let us write simply:\n\
    \n```\nvector<int>::iterator i = find_if( v.begin(), v.end(), _1 > x && _1 < y\
    \ );\n```\n\n# Exceptions\n\nWhen used with function objects, algorithm calls\
    \ place the body of the loop away from the call site, which can make the loop\
    \ harder to read. (Cobblling together simple objects with the standard and nonstandard\
    \ binders isn’t a realistic option.)\n\n[Boost] lambda functions solve these two\
    \ problems and work reliably on modern compilers, but they don’t work on older\
    \ compilers and they can generate dense error messages when they’re coded incorrectly.\
    \ Calling named functions, including member functions, still requires binder-like\
    \ syntax.\n\n# References\n\n[Allison98] §15 • [Austern99] §11-13 • [Boost] Lambda\
    \ library • [McConnell93] §15 • [Meyers01] §43 • [Musser01] §11 • [Stroustrup00]\
    \ §6.1.8, §18.5.1 • [Sutter00] §7"
