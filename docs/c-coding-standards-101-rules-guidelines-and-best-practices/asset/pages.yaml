  md: '# # 59. Don''t write namespace usings in a header file or before an #include.


    # ### Summary


    Namespace **using**s are for your convenience, not for you to inflict on others:
    Never write a **using** declaration or a **using** directive before an **#include**
    directive.


    Corollary: In header files, don''t write namespace-level **using** directives
    or **using** declarations; instead, explicitly namespace-qualify all names. (The
    second rule follows from the first, because headers can never know what other
    header **#include**s might appear after them.)


    # ### Discussion


    In short: You can and should use namespace **using** declarations and directives
    liberally *in your implementation files after **#include** directives* and feel
    good about it. Despite repeated assertions to the contrary, namespace **using**
    declarations and directives are not evil and they do not defeat the purpose of
    namespaces. Rather, they are what makes namespaces usable.


    Namespaces deliver the powerful advantage of unambiguous name management. Most
    of the time, different programmers don''t choose the very same name for a type
    or function; but on the off chance that they do so, and that the two pieces of
    code end up being used together, having those names in separate namespaces prevents
    them from colliding. (We don''t, after all, want the global namespace pollution
    experienced by default in languages like C.) In the rare case when there is such
    an actual ambiguity, calling code can explicitly qualify a name to say which one
    it wants. But the vast majority of the time there is no ambiguity: And that is
    why namespace **using** declarations and directives are what makes namespaces
    usable, because they greatly reduce code clutter by freeing you from having to
    tediously qualify every name every time (which would be onerous, and frankly people
    just won''t put up with it) and still letting you qualify names only in those
    rare cases when you need to resolve an actual ambiguity.


    But **using** declarations and directives are for your coding convenience, and
    you shouldn''t use them in a way that affects someone else''s code. In particular,
    don''t write them anywhere they could be followed by someone else''s code: Specifically,
    don''t write them in header files (which are meant to be included in an unbounded
    number of implementation files, and you shouldn''t mess with the meaning of that
    code) or before an **#include** (you really don''t want to mess with the meaning
    of code in someone else''s header).'
