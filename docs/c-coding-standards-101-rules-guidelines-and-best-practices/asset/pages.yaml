- pgno: 150
  md: '# 70. Distinguish between errors and non-errors.


    # Summary


    A breach of contract is an error: A function is a unit of work. Thus, failures
    should be viewed as errors or otherwise based on their impact on functions. Within
    a function f, a failure is an error if and only if it violates one of f’s preconditions
    or prevents f from meeting any of its callees’ preconditions, achieving any of
    f’s own postconditions, or reestablishing any invariant that f shares responsibility
    for maintaining.


    In particular, here we exclude internal programming errors (i.e., where the caller
    and callee are the responsibility of the same person or team, such as inside a
    module), which are a separate category normally dealt with using assertions (see
    Item 68).


    # Discussion


    It is crucial to crisply distinguish between errors and non-errors in terms of
    their effects on functions, especially for the purpose of defining safety guarantees
    (see Item 71). The key words in this Item are *precondition*, *postcondition*,
    and *invariant*.


    The function is the basic unit of work, no matter whether you are programming
    C++ in a structured style, an OO style, or a generic style. A function makes assumptions
    about its starting state (documented as its preconditions, which the caller is
    responsible for fulfilling and the callee is responsible for validating) and performs
    one or more actions (documented as its results or postconditions, which the function
    as callee is responsible for fulfilling). A function may share responsibility
    for maintaining one or more invariants. In particular, a nonprivate mutating member
    function is by definition a unit of work on its object, and must take the object
    from one valid invariant-preserving state to another; during the body of the member
    function, the object’s invariants can be (and nearly always must be) broken, and
    that is fine and normal as long as they are reestablished by the end of the member
    function. Higher-level functions compose lower-level functions into larger units
    of work.


    An error is any failure that prevents a function from succeeding. There are three
    kinds:


    +   - *Violation of, or failure to achieve, a precondition:* The function detects
    a violation of one of its own preconditions (e.g., a parameter or state restriction),
    or encounters a condition that prevents it from meeting a precondition of another
    essential function that must be called.

    +   - *Failure to achieve a postcondition:* The function encounters a condition
    that prevents it from establishing one of its own postconditions. If the function
    has a return value, producing a valid return value object is a postcondition.

    +   - *Failure to reestablish an invariant:* The function encounters a condition
    that prevents it from reestablishing an invariant that it is responsible for maintaining.'
