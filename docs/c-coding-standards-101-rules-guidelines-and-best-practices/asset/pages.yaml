    But this option is still relatively low-level, and thus open to errors that have
    to be checked for explicitly (e.g., the file might not exist).


    +   - Option 3: *istream or File*. If you’re going to jump to class types anyway,
    thereby requiring clients to be written in C++ using the same compiler and switches,
    use a strong abstraction: An *istream* (or custom *File* object that wraps *istream*
    to avoid a direct dependency on one standard library implementation) raises the
    level of abstraction and makes the API much more robust. The function knows that
    it’s getting a *File* or a suitable input stream, does not need to manage memory
    for string filenames, and is immune to many accidental and deliberate errors possible
    with the other options. Few checks remain: The *File* must be open, and the contents
    must be in the right format, but that’s about all that can go wrong.


    Even when you choose to use a lower-level abstraction in a module’s external interface,
    always use the highest level of abstraction internally and translate to the lower-level
    abstraction at the module’s boundary. For example, if you will have non-C++ clients,
    you might use opaque `void*` or `int` handles to client code, but still use objects
    internally, and cast only at the module’s interface to translate between the two.


    # Examples


    *Example:* Using `std::string` in a module interface. Say a module wants to provide
    this API:


    ```

    ```

    std::string Translate( const std::string& );

    ```

    ```


    For libraries used internally in one team or company, this is usually fine. But
    if you need to dynamically link this module together with a caller that has a
    different implementation of `std::string` (sporting a different memory layout),
    strange things will happen because the client and the module can’t understand
    each others’ strings.


    We have seen developers try to get around this by wrapping `std::string` with
    their own `CustomString`, only to be shocked when they continue to encounter the
    very same problem because they don’t control the build process of all callers.


    One solution is to rely on portable (probably built-in) types, either instead
    of or in addition to the function that takes a string. For example:


    ```

    ```

    void Translate( const char* src, char* dest, size_t destSize );

    ```

    ```


    Using a lower-level abstraction is more portable, but always adds complexity;
    e.g., here, both the caller and the callee have to explicitly deal with possible
    truncation if the buffer is not big enough. (Note that this version uses a caller-allocated
    buffer to avoid the pitfall of allocating and deallocating memory in different
    modules; see Item 60.)


