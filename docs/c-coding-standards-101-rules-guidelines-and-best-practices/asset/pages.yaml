- pgno: 68
  md: '# 30. Avoid overloading &&, ||, or , (comma).


    # Summary


    Wisdom means knowing when to refrain: The built-in &&, ||, and , (comma) enjoy
    special treatment from the compiler. If you overload them, they become ordinary
    functions with very different semantics (you *will* violate Items 26 and 31),
    and this is a sure way to introduce subtle bugs and fragilities. Don’t overload
    these operators naïvely.


    # Discussion


    The primary reason not to overload **operator&&, operator||, or operator,** (comma)
    is that you *cannot* implement the full semantics of the built-in operators in
    these three cases, and programmers commonly expect those semantics. In particular,
    the built-in versions evaluate left-to-right, and for && and || also use short-circuit
    evaluation.


    The built-in versions of && and || first evaluate their left-hand expression,
    and if that fully determines the result (false for &&, true for ||) then the right-hand
    expression doesn’t need to be evaluated—and is guaranteed not to be. We all get
    so used to this handy feature that we routinely allow the correctness of the right-hand
    side depend on the success of the left-hand side:


    ```

    ```cpp\nEmployee* e = TryToGetEmployee();\nif( e && e->Manager() )\n    // ...\n```

    ```


    This code’s correctness relies on the fact that e->Manager() will not be evaluated
    if e is null. This is perfectly usual and fine—unless the && used is an overloaded
    **operator&&**, because then the expression involving && will follow function
    rules instead:


    +   - Function calls always evaluate *all* arguments before execution.

    +   - *The order* of evaluation of function arguments is unspecified. (See also
    Item 31.)


    So let’s look at a modernized version of the snippet above that uses smart pointers:


    ```

    ```cpp\nsome_smart_ptr<Employee> e = TryToGetEmployee();\nif( e && e->Manager()
    )\n    // ...\n```

    ```


    Now, say this code happens to invoke an overloaded **operator&&** (provided by
    the author either of **some_smart_ptr** or of **Employee**). Then the code will
    still look fine to the reader, but will potentially (and disastrously) call **e->Manager()**
    when e is null.


    Some other code won’t dump core even in the presence of such eager evaluation,
    but becomes incorrect for a different reason if it depends on the order in which
    the two expressions are evaluated. The effects, of course, can be just as harmful.
    Consider:'
