- pgno: 102
  md: "# # 47. Define and initialize member variables in the same order.\n\n# ## Summary\n\
    \nAgree with your compiler: Member variables are always initialized in the order\
    \ they are declared in the class definition; the order in which you write them\
    \ in the constructor initialization list is ignored. Make sure the constructor\
    \ code doesn't confusingly specify a different order.\n\n# ## Discussion\n\nConsider\
    \ the code below:\n\n```\n```cpp\nclass Employee {\n  string email_, firstName_,\
    \ lastName_;\n\npublic:\n  Employee( const char* firstName, const char* lastName\
    \ )\n    : firstName_(firstName), lastName_(lastName)\n    , email_(firstName_\
    \ + \"_\" + lastName_ + \"@acme.com\") {}\n};\n```\n```\n\nThis code harbors a\
    \ bug that's as pernicious as it is hard to spot. Because email_ is declared before\
    \ first_ and last_ in the class definition, it will be initialized first and will\
    \ attempt to use the other not-yet-initialized fields. Worse, if the constructor's\
    \ definition is in a separate file, the long-distance influence that the order\
    \ of member variable declarations has over the constructor's correctness will\
    \ be even harder to spot.\n\nThe reason for this language design decision is to\
    \ ensure there is a unique order to destroy members; otherwise, the destructor\
    \ would have to destroy objects in different orders, depending on the constructor\
    \ that built the object. The bookkeeping overhead for that was deemed unacceptable.\n\
    \nThe solution is to always write member initializers in the same order in which\
    \ the members are declared. That way, any illegal dependency will become obvious.\
    \ Better yet, strive to not have one member's initialization depend on other members.\n\
    \nMany compilers (but not all) will issue a warning if you break this rule.\n\n\
    # ## References\n\n+   - [Cline99] §22.03-11\n+   - [Dewhurst03] §52-53\n+   -\
    \ [Koenig97] §4\n+   - [Lakos96] §10.3.5\n+   - [Meyers97] §13\n+   - [Murray93]\
    \ §2.1.3\n+   - [Sutter00] §47"
