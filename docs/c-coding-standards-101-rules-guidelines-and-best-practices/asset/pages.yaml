  md: "# 17. Avoid magic numbers.\n\n# Summary\n\nProgramming isn’t magic, so don’t\
    \ incant it: Avoid spelling literal constants like **42** or **3.14159** in code.\
    \ They are not self-explanatory and complicate maintenance by adding a hard-to-detect\
    \ form of duplication. Use symbolic names and expressions instead, such as **width\
    \ * aspectRatio**.\n\n# Discussion\n\nNames add information and introduce a single\
    \ point of maintenance; raw numbers duplicated throughout a program are anonymous\
    \ and a maintenance hassle. Constants should be enumerators or **const** values,\
    \ scoped and named appropriately.\n\nOne **42** may not be the same as another\
    \ **42**. Worse, “in-head” computations made by the programmer (e.g., “this **84**\
    \ comes from doubling the **42** used five lines ago”) make it tedious and error-prone\
    \ to later replace **42** with another constant.\n\nPrefer replacing hardcoded\
    \ strings with symbolic constants. Keeping strings separate from the code (e.g.,\
    \ in a dedicated **.cpp** or resource file) lets non-programmers review and update\
    \ them, reduces duplication, and helps internationalization.\n\n# Examples\n\n\
    *Example 1: Important domain-specific constants at namespace level.*\n\n```\n\
    ```cpp\nconst size_t PAGE_SIZE              = 8192;\n           WORDS_PER_PAGE\
    \           = PAGE_SIZE / sizeof(int),\n           INFO_BITS_PER_PAGE = 32 * CHAR_BIT;\n\
    ```\n```\n\n*Example 2: Class-specific constants.* You can define static integral\
    \ constants in the class definition; constants of other types need a separate\
    \ definition or a short function.\n\n```\n```cpp\n// File widget.h\nclass Widget\
    \ {\n  static const int defaultWidth = 400;          // value provided in declaration\n\
    \  static const double defaultPercent;           // value provided in definition\n\
