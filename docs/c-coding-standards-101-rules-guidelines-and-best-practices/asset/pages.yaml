  md: "# 54. Avoid slicing. Consider Clone instead of copying in base classes.\n\n\
    # Summary\n\nSliced bread is good; sliced objects aren’t: Object slicing is automatic,\
    \ invisible, and likely to bring wonderful polymorphic designs to a screeching\
    \ halt. In base classes, consider disabling the copy constructor and copy assignment\
    \ operator, and instead supplying a virtual **Clone** member function if clients\
    \ need to make polymorphic (complete, deep) copies.\n\n# Discussion\n\nWhen you\
    \ build class hierarchies, usually the intent is to get polymorphic behavior.\
    \ You want objects, once created, to preserve their type and identity. This goal\
    \ conflicts with C++’s usual object copy semantics because the copy constructor\
    \ is not virtual and cannot be made virtual. Consider:\n\n```\n```cpp\nclass B\
    \ { /* ... */ };\nclass D : public B { /* ... */ };\n\nvoid Transmogrify( B obj\
    \ );             // oops: takes an object by value\nvoid Transubstantiate( B&\
    \ obj ) {        // ok: takes a reference\n  Transmogrify( obj );            \
    \       // oops: slices the object\n  // ...\n}\n\nD d;\nTransubstantiate( d );\n\
    ```\n```\n\nThe programmer’s intent is to manipulate **B** and **B**-derived objects\
    \ polymorphically. However, by mistake (fatigue? too little caffeine?) the programmer\
    \ either forgot to write an **&** in **Transmogrify**’s signature, or intended\
    \ to create a copy but did it the wrong way. The code will compile fine, but when\
    \ **Transmogrify** is called the passed-in **B** object will, well, transmogrify\
    \ into a **B**. This is because a by-value pass involves a call to **B::B( const\
    \ B& )**, that is, B’s copy constructor, and the **const B&** passed in will be\
    \ automatically converted reference to d. Wiping away all the dynamic, polymorphic\
    \ behavior that prompted you to use inheritance in the first place is most likely\
    \ what you don’t want.\n\nIf as the author of **B** you do want to allow slicing,\
    \ but you don’t want callers to slice easily or by accident, here’s one option\
    \ we mention for completeness but do not rec-"
