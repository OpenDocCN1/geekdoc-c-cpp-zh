  md: "+   88. Prefer function objects over functions as algorithm and comparer arguments.\n\
    +   \n+      *Objects plug in better than functions: Prefer passing function objects,\
    \ not functions, to algorithms. Comparers for associative containers must be function\
    \ objects. Function objects are adaptable and, counterintuitively, they typically\
    \ produce faster code than functions.*\n\n+   89. Write function objects correctly.\n\
    +   \n+      *Be cheap, be adaptable: Design function objects to be values that\
    \ are cheap to copy. Where possible, make them adaptable by inheriting from **unary_**\
    \ or **binary_function**.*\n\n# Type Safety\n\n+   90. Avoid type switching; prefer\
    \ polymorphism.\n+   \n+      *Switch off: Avoid switching on the type of an object\
    \ to customize behavior. Use templates and virtual functions to let types (not\
    \ their calling code) decide their behavior.*\n\n+   91. Rely on types, not on\
    \ representations.\n+   \n+      *Don’t try to X-ray objects (see Item 96). Don’t\
    \ make assumptions about how objects are exactly represented in memory. Instead,\
    \ let types decide how their objects are written to and read from memory.*\n\n\
    +   92. Avoid using **reinterpret_cast**.\n+   \n+      *Lies have short legs\
    \ (German and Romanian proverb): Don’t try to use **reinterpret_cast** to force\
    \ the compiler to reinterpret the bits of an object of one type as being the bits\
    \ of an object of a different type. That’s the opposite of maintaining type safety,\
    \ and **reinterpret_cast** isn’t even guaranteed to do that or anything else in\
    \ particular.*\n\n+   93. Avoid using **static_cast** on pointers.\n+   \n+  \
    \    *Pointers to dynamic objects don’t **static_cast**: Safe alternatives range\
    \ from using **dynamic_cast** to refactoring to redesigning.*\n\n+   94. Avoid\
    \ casting away **const**.\n+   \n+      *Some fibs are punishable: Casting away\
    \ **const** sometimes results in undefined behavior, and it is a staple of poor\
    \ programming style even when legal.*\n\n+   95. Don’t use C-style casts.\n+ \
    \  \n+      *Age doesn’t always imply wisdom: C-style casts have different (and\
    \ often dangerous) semantics depending on context, all disguised behind a single\
    \ syntax. Replacing C-style casts with C++-style casts helps guard against unexpected\
    \ errors.*\n\n+   96. Don’t **memcpy** or **memcmp** non-PODs.\n+   \n+      *Don’t\
    \ try to X-ray objects (see Item 91): Don’t use **memcpy** and **memcmp** to copy\
    \ or compare anything more structured than raw memory.*\n\n+   97. Don’t use unions\
    \ to reinterpret representation.\n+   \n+      *A deceit is still a lie: Unions\
    \ can be abused into obtaining a “cast without a cast” by writing one member and\
    \ reading another. This is more insidious and even less predictable than **reinterpret_cast**\
    \ (see Item 92).*"
