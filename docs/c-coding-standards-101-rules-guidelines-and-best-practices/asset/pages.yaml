  md: '+   - *Less weirdness:* Inheriting from a type can cause name lookup to pull
    in functions and function templates defined in the same namespace as that type.
    This is very subtle and hard to debug. (See also Item 58.)

    +   - *Wider applicability:* Some classes were not designed to be bases in the
    first place (and see Item 35). Most classes, however, can fulfill the role of
    a member.

    +   - *Great robustness and safety:* The tighter coupling of inheritance makes
    it more difficult to write error-safe code. (See [Sutter02] §23.)

    +   - *Less complexity and fragility:* Inheritance exposes you to additional complications,
    such as name hiding and other complications that can arise in the presence of
    later changes to the base class.


    Of course, these are not arguments against inheritance *per se*. Inheritance affords
    a great deal of power, including substitutability and/or the ability to override
    virtual functions (see Items 36 through 39, and Exceptions below). But don’t pay
    for what you don’t need; unless you need inheritance’s power, don’t endure its
    drawbacks.


    # Exceptions


    Do use public inheritance to model substitutability. (See Item 37.)


    Even if you don’t need to provide a substitutability relationship to all callers,
    you do need *nonpublic* inheritance if you need any of the following, in rough
    order from most common (the first two points) to exceedingly rare (the rest):


    +   - If you need to override a virtual function.

    +   - If you need access to a protected member.

    +   - If you need to construct the used object before, or destroy it after, a
    base class.

    +   - If you need to worry about virtual base classes.

    +   - If you *know* you benefit from the empty base class optimization, including
    that it matters in this case and that your target compiler(s) actually perform
    it in this case. (See Item 8.)

    +   - If you need controlled polymorphism. That is, if you need a substitutability
    relationship, but that relationship should be visible only to selected code (via
    friendship).


    # References


    [Cargill92] pp. 49-65, 101-105 • [Cline99] §5.9-10, 8.11-12, 37.04 • [Devhurst03]
