- pgno: 52
  md: "# 19. Always initialize variables.\n\n# Summary\n\nStart with a clean slate:\
    \ Uninitialized variables are a common source of bugs in C and C++ programs. Avoid\
    \ such bugs by being disciplined about cleaning memory before you use it; initialize\
    \ variables upon definition.\n\n# Discussion\n\nIn the low-level efficiency tradition\
    \ of C and C++ alike, the compiler is often not required to initialize variables\
    \ unless you do it explicitly (e.g., local variables, forgotten members omitted\
    \ from constructor initializer lists). Do it explicitly.\n\nThere are few reasons\
    \ to ever leave a variable uninitialized. None is serious enough to justify the\
    \ hazard of undefined behavior.\n\nIf you’ve used a procedural language (e.g.,\
    \ Pascal, C, Fortran, or Cobol) you might be used to defining variables in separation\
    \ from the code that uses them, and then assigning them values later when they’re\
    \ about to be used. This approach is obsolete and not recommended (see Item 18).\n\
    \nA common misconception about uninitialized variables is that they will crash\
    \ the program, so that those few uninitialized variables lying around here and\
    \ there will be quickly revealed by simple testing. On the contrary, programs\
    \ with uninitialized variables can run flawlessly for years if the bits in the\
    \ memory happen to match the program’s needs. Later, a call from a different context,\
    \ a recompilation, or some change in another part of the program will cause failures\
    \ ranging from inexplicable behavior to intermittent crashes.\n\n# Examples\n\n\
    _Example 1: Using a default initial value or ?: to reduce mixing data flow with\
    \ control flow._\n\n```\n```cpp\n// Not recommended: Doesn't initialize variable\n\
    int speedupFactor;\nif( condition )\n  speedupFactor = 2;\nelse\n  speedupFactor\
    \ = -1;\n```\n```\n\n```\n```cpp\n// Better: Initializes variable\nint speedupFactor\
    \ = -1;\nif( condition )\n  speedupFactor = 2;\n```\n```"
  merge: -1
