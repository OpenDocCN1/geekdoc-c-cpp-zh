    # Summary


    Specialization is good only when it can be done correctly: When extending someone
    else’s function template (including **std::swap**), avoid trying to write a specialization;
    instead, write an overload of the function template, and put it in the namespace
    of the type(s) the overload is designed to be used for. (See Item 57.) When you
    write your own function template, avoid encouraging direct specialization of the
    function template itself.


    # Discussion


    It’s okay to overload function templates. Overload resolution considers all primary
    templates equally, and that’s why it works as you would naturally expect from
    your experience with normal C++ function overloading: Whatever templates are visible
    are considered for overload resolution, and the compiler simply picks the best
    match.


    Unfortunately, it’s a lot less intuitive to specialize function templates. There
    are two basic reasons:


    +   - *You can’t specialize function templates partially, only totally:* Code
    that looks like partial specialization is really just overloading instead.

    +   - *Function template specializations never participate in overloading:* Therefore,
    any specializations you write will not affect which template gets used, and this
    runs counter to what most people would intuitively expect. After all, if you had
    written a nontemplate function with the identical signature instead of a function
    template specialization, the nontemplate function would always be selected because
    it’s always considered to be a better match than a template.


    If you’re writing a function template, prefer to write it as a single function
    template that should never be specialized or overloaded, and implement the function
    template entirely in terms of a class template. This is the proverbial extra level
    of indirection that steers you well clear of the limitations and dark corners
    of function templates. This way, programmers using your template will be able
    to partially specialize and explicitly specialize the class template to their
    heart’s content without affecting the expected operation of the function template.
    This nicely avoids both the limitation that function templates can’t be partially
    specialized, as well as the sometimes surprising effect that function template
    specializations don’t overload. Problem solved.


    If you’re using someone else’s plain old function template that doesn’t use this
    technique (i.e., a function template that is not implemented in terms of a class
    template), and you want to write your own special-case version that should participate
    in over-'
