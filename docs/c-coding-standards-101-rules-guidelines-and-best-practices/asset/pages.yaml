- pgno: 45
  md: 'pilers can only check a fraction of potential bugs, so if you need to write
    unit tests anyway you might as well not bother with static checking at all and
    get a less restrictive programming environment.


    One thing is clear: Within the context of the statically typed language C++, which
    provides strong static checking and little automatic run-time checking, programmers
    should definitely use the type system to their advantage wherever possible (see
    also Items 90 through 100). At the same time, run-time checks are sensible for
    data- and flow-dependent checking (e.g., array bounds checking or input data validation)
    (see Items 70 and 71).


    # Examples


    There are several instances in which you can replace run-time checks with compile-time
    checks.


    *Example 1: Compile-time Boolean conditions.* If you are testing for compile-time
    Boolean conditions such as **sizeof(int) >= 8**, use static assertions instead
    of run-time tests. (But see also Item 91.)


    *Example 2: Compile-time polymorphism.* Consider replacing run-time polymorphism
    (virtual functions) with compile-time polymorphism (templates) when defining generic
    functions or types. The latter yields code that is better checked statically.
    (See also Item 64.)


    *Example 3: Enums.* Consider defining **enums** (or, better yet, full-fledged
    types) when you need to express symbolic constants or restricted integral values.


    *Example 4: Downcasting.* If you frequently use **dynamic_cast** (or, worse, an
    unchecked **static_cast**) to perform downcasting, it can be a sign that your
    base classes offer too little functionality. Consider redesigning your interfaces
    so that your program can express computation in terms of the base class.


    # Exceptions


    Some conditions cannot be checked at compile time and require run-time checks.
    For these, prefer to use assertions to detect internal programming errors (see
    Item 68) and follow the advice in the rest of the error handling section for other
    run-time errors such as data-dependent errors (see Items 69 through 75).


    # References


    [Alexandrescu01] §3 • [Boost] • [Meyers97] §46 • [Stroustrup00] §2.4.2 • [Sutter02]
    §4 • [Sutter04] §2, §19'
