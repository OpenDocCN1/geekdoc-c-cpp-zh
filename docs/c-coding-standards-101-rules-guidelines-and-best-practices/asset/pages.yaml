    \ and in a subtler and more insidious way. Consider:\n\n```\n    // snippet 1\n\
    \    namespace A {\n        int f(double);\n    }\n\n    // snippet 2\n    namespace\
    \ B {\n        using A::f;\n        void g();\n    }\n\n    // snippet 3\n   \
    \ namespace A {\n        int f(int);\n    }\n\n    // snippet 4\n    void B::g()\
    \ {\n        f(1);               // which overload is called?\n    }\n```\n\n\
    The dangerous thing happening here is that the *using* declaration takes a snapshot\
    \ of whatever entities named f in namespace A have been seen by the time the *using*\
    \ declaration is encountered. So, from within B, which overloads are visible depends\
    \ on where these code snippets exist and in what order they are combined. (At\
    \ this point, your internal “but order dependencies are evil!” klaxon should be\
    \ blaring.) The second overload, f(int), would be a better match for the call\
    \ f(1), but f(int) will be invisible to B::g if its declaration comes after the\
    \ *using* declaration.\n\nConsider two specific cases. First, let’s say that snippets\
    \ 1, 2, and 3 are in three distinct header files s1.h, s2.h, and s3.h, and snippet\
    \ 4 in an implementation file s4.cpp that includes those header files to pull\
