  md: "# # 42. Don’t give away your internals.\n\n# ## Summary\n\n**Don’t volunteer\
    \ too much:** Avoid returning handles to internal data managed by your class,\
    \ so clients won’t uncontrollably modify state that your object thinks it owns.\n\
    \n# ## Discussion\n\nConsider:\n\n```\n    class Socket {\n    public:\n     \
    \   // ... constructor that opens handle_, destructor that closes handle_, etc.\
    \ ...\n        int GetHandle() const { return handle_; }   // avoid this\n   \
    \ private:\n        int handle_;                                // perhaps an\
    \ OS resource handle\n    };\n```\n\nData hiding is a powerful abstraction and\
    \ modularity device (see Items 11 and 41). But hiding data and then giving away\
    \ handles to it is self-defeating, just like locking your house and leaving the\
    \ keys in the lock. This is because:\n\n+   - *Clients now have two ways to implement\
    \ functionality:* They can use your class’s abstraction (**Socket**) or directly\
    \ manipulate the implementation that your class relies on (the socket’s C-style\
    \ handle). In the latter case, the object is unaware of significant changes to\
    \ the resource it thinks it owns. Now the class cannot reliably enrich or embellish\
    \ functionality (e.g., proxying, logging, collecting statistics) because clients\
    \ can bypass the embellished, controlled implementation—and any of the invariants\
    \ it thinks it’s adding, which makes correct error handling next to impossible\
    \ (see Item 70).\n+   - *The class cannot change the underlying implementation\
    \ of its abstraction because clients depend on it:* If **Socket** is later upgraded\
    \ to support a different protocol with a different set of low-level primitives,\
    \ calling code that fetches the underlying `handle_` and manipulates it incorrectly\
    \ will be silently broken.\n+   - *The class cannot enforce its invariants because\
    \ calling code can alter state unbeknownst to the class:* For example, someone\
    \ could close the handle being used by a **Socket** object without going through\
    \ a **Socket** member function, thus rendering the object invalid.\n+   - *Client\
    \ code can store the handles that your class returns, and attempt to use them\
    \ after your class's code has invalidated them.*\n\nA common mistake is to forget\
    \ that **const** is shallow and doesn't propagate through pointers (see Item 15).\
    \ For example, **Socket::GetHandle** is a **const** member; as far as"
