  md: "# 40. Avoid providing implicit conversions.\n\n# Summary\n\nNot all change\
    \ is progress: Implicit conversions can often do more damage than good. Think\
    \ twice before providing implicit conversions to and from the types you define,\
    \ and prefer to rely on explicit conversions (**explicit** constructors and named\
    \ conversion functions).\n\n# Discussion\n\nImplicit conversions have two main\
    \ problems:\n\n+   - They can fire in the most unexpected places.\n+   - They\
    \ don’t always mesh well with the rest of the language.\n\nImplicitly converting\
    \ constructors (constructors that can be called with one argument and are not\
    \ declared **explicit**) interact poorly with overloading and foster invisible\
    \ temporary objects that pop up all over. Conversions defined as member functions\
    \ of the form **operator T** (where T is a type) are no better—they interact poorly\
    \ with implicit constructors and can allow all sorts of nonsensical code to compile.\
    \ Examples are embarrassingly numerous (see References). We mention only two (see\
    \ Examples).\n\nIn C++, a conversion sequence can include at most one user-defined\
    \ conversion. However, when built-in conversions are added to the mix, the results\
    \ can be extremely confusing. The solution is simple:\n\n+   - By default, write\
    \ **explicit** on single-argument constructors (see also Item 54):\n+   \n+  \
    \   ```cpp\n+     class Widget { // ...\n+         explicit Widget( unsigned int\
    \ widgetizationFactor );\n+         explicit Widget( const char* name, const Widget*\
    \ other = 0 );\n+     };\n+     ```\n\n+   - Use named functions that offer conversions\
    \ instead of conversion operators:\n+   \n+     ```cpp\n+     class String { //\
    \ ...\n+         const char* as_char_pointer() const;    // in the grand c_str\
    \ tradition\n+     };\n+     ```\n\nSee also the discussion of **explicit** copy\
    \ constructors in Item 54.\n\n# Examples\n\n*Example 1: Overloading.* Say you\
    \ have a **Widget::Widget( unsigned int )** that can be invoked implicitly, and\
    \ a **Display** function overloaded for **Widgets** and **doubles**. Consider\
    \ the following overload resolution surprise:"
