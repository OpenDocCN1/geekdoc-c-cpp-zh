    \ so on. If the headers are extensive, compilation times can be noticeably affected.\n\
    \nThe second consequence is creating ambiguity and name hiding for code that is\
    \ trying to call a function. Even though private member functions can never be\
    \ called from outside the class and its friends, they do participate in name lookup\
    \ and overload resolution and so can render calls invalid or ambiguous. C++ performs\
    \ name lookup and then overload resolution before accessibility checking. That’s\
    \ why visibility gets priority:\n\n```\n```cpp\nint Twice( int );            \
    \     // 1\n\nclass Calc {\npublic:\n  string Twice( string );          // 2\n\
    \nprivate:\n  char* Twice( char* );            // 3\n\n  int Test() {\n    return\
    \ Twice( 21 );            // A: error, 2 and 3 are unviable (1 would be viable,\n\
    \                                   // but it can't be considered because it's\
    \ hidden)\n  }\n};\n\nCalc c;\nc.Twice( “Hello” );                // B: error,\
    \ 3 is inaccessible (2 would be fine, but it\n                               \
    \    // can't be considered because 3 is a better match)\n```\n```\n\nOn line\
    \ A, the workaround is to explicitly qualify the call as **::Twice( 21 )** to\
    \ force lookup to select the global function. On line B, the workaround is to\
    \ add an explicit cast as **c.Twice( string(“Hello”) )** to force overload resolution\
    \ to select the intended function. Some of these calling issues can be worked\
    \ around in other ways than the Pimpl idiom, for example by never writing private\
    \ overloads for member functions, but not all of the issues resolved by Pimpl\
    \ have such alternative workarounds.\n\nThe third consequence is its impact on\
    \ error handling and safety. Consider Tom Cargill’s Widget example:"
