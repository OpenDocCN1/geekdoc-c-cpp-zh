  md: '# 61. Don’t define entities with linkage in a header file.


    # Summary


    Repetition causes bloat: Entities with linkage, including namespace-level variables
    or functions, have memory allocated for them. Defining such entities in header
    files results in either link-time errors or memory waste. Put all entities with
    linkage in implementation files.


    # Discussion


    While starting to use C++, we all learn quite quickly that header files like


    ```

    ```cpp

    // avoid defining entities with *external linkage* in a header

    int fudgeFactor;

    string hello(“Hello, world!”);

    void foo() { /* ... */ }

    ```

    ```


    are liable to cause link-time errors complaining of duplicate symbols as soon
    as such a header is included by more than one source file. The reason is simple:
    Each source file actually defines and allocates space for **fudgeFactor** and
    **hello** and **foo**’s body, and when the time comes to put it all together (linking),
    the linker is faced with several symbols bearing the same name and competing for
    visibility.


    The solution is simple—put just the declarations in the header:


    ```

    ```cpp

    extern int fudgeFactor;

    extern string hello;

    void foo();                 // “extern” is optional with function declarations

    ```

    ```


    The actual definitions go in a single implementation file:


    ```

    ```cpp

    int fudgeFactor;

    string hello(“Hello, world!”);

    void foo() { /* ... */ }

    ```

    ```


    Also, do not define namespace-level static entities in a header. For example:


    ```

    ```cpp

    // avoid defining entities with *static linkage* in a header

    static int fudgeFactor;

    static string hello(“Hello, world!”);

    static void foo() { /* ... */ }

    ```

    ```


    Such misuse of **static** is more dangerous than just defining global entities
    in the header. With global entities, at least the linker is liable to promptly
    uncover the du-'
