- pgno: 85
  md: 'wants to take instead of trying to find a compromise that forces them to look
    identical. Often, the two interfaces and numbers of functions and/or different
    parameters; for example, outside callers may call a single public Process function
    that performs a logical unit of work, whereas customizers may prefer to override
    only certain parts of the processing, which is naturally modeled by independently
    overridable virtual functions (e.g., DoProcessPhase1, DoProcessPhase2) so that
    derived classes aren’t forced to override everything. (This latter example specifically
    is the Template Method pattern arrived at from a different route.)


    +   - *The base class is in control:* The base class is now in complete control
    of its interface and policy and can enforce interface preconditions and postconditions
    (see Items 14 and 68), insert instrumentation, and do any similar work all in
    a single convenient reusable place—the nonvirtual interface function. This “prefactoring”
    separation thus promotes good class design.

    +   - *The base class is robust in the face of change:* We are free to change
    our minds later and add pre- and postcondition checking, or separate processing
    into more steps, or refactor, or implement a fuller interface/implementation separation
    using the Pimpl idiom (see Item 43), or make other modifications to the base class’s
    customizability, without affecting any of the code that uses or inherits from
    the class. Note that it is much easier to start with NVI (even if the public function
    is just a one-line passthrough to the virtual function) and then later add checking
    or instrumentation, because that can then be done without breaking any code that
    uses or inherits from the class. It is much harder to start with a public virtual
    function and later have to break it apart, which necessarily breaks either the
    code that uses the class or the code that inherits from the class, depending on
    whether we choose to keep the original function as the virtual function or as
    the public function, respectively.


    See also Item 54.


    # Exceptions


    NVI does not apply to destructors because of their special order of execution
    (see Item 50).


    NVI does not directly support covariant return types for callers. If you need
    covariance that is visible to calling code without using dynamic_cast downcasts
    (see also Item 93), it’s easier to make the virtual function public.


    # References


    [Allison98] §10 • [Deawstros03] §72 • [Gumma95] • [Keffner95 pp. 6–7] • [Koenig97]
    §11 • [Sutter00] §19, §23 • [Sutter04] §18'
