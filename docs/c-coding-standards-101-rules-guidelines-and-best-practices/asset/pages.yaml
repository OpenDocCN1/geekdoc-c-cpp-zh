  md: "```\n```cpp\nclass C {\n  // ...\n\nprivate:\n  AComplicatedType act_;\n};\n\
    ```\n```\n\nThe header file containing class C’s definition must also **#include**\
    \ the header containing the definition for **AComplicatedType**, which in turn\
