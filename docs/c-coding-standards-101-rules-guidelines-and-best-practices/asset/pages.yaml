    happen to hit the worst of all possible worlds where **N::operator+** is chosen
    but unfortunately turns out to be compilable, although completely unintended and
    wildly wrong.


    If you think you haven’t been bit by this, just think back: Can you remember a
    time when you wrote code that used the standard library (for example) and got
    mysterious and incomprehensible compiler errors? And you kept slightly rearranging
    your code and recompiling, and rearranging some more and compiling some more,
    until the mysterious compile errors went away, and then you happily continued
    on—with at best a faint nagging curiosity about why the compiler didn’t like the
    only-ever-so-slightly different arrangement of the code you wrote at first? We’ve
    all had those days, and the odds are decent that the mystery culprit was some
    form of the aforementioned problem, where ADL pulled in names from other namespaces
    inappropriately just because types from those namespaces were being used nearby.


    This problem is not unique to uses of the standard library. It can and does happen
    in C++ with the use of any type that is defined in the same namespace as functions—especially
    templated functions, and most especially operators—that aren’t specifically related
    to that type. Don’t do that.


    Bottom line: You shouldn’t have to know this stuff. The easiest way to avoid this
    whole category of problems is to in general avoid putting nonmember functions
    that are not part of the interface of a type **X** into the same namespace as
    **X**, and especially never ever put templated functions or operators into the
    same namespace as a user-defined type.


    Note: Yes, the C++ standard library puts algorithms and other function templates,
    such as **copy** and **distance**, into the same namespace as lots of types, such
    as **pair** and **vector**. It puts *everything* into a single namespace. That’s
    unfortunate, and it causes exactly these kinds of very subtle problems. We know
    better now. Learn from the past. Don’t do that.


    For the flip side of this issue, see Item 57.


