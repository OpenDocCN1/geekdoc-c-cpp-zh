- pgno: 39
  md: 'So, internal locking is tied to the type’s public interface: Internal locking
    becomes appropriate when the type’s individual operations are complete in themselves;
    in other words, the type’s level of abstraction is raised and expressed and encapsulated
    more precisely (e.g., as a producer-consumer queue rather than a plain **vector**).
    Combining primitive operations together to form coarser common operations is the
    approach needed to ensure meaningful but simple function calls. Where combinations
    of primitives can be arbitrary and you cannot capture the reasonable set of usage
    scenarios in one named operation, there are two alternatives: a) use a callback-based
    model (i.e., have the caller call a single-member function, but pass in the task
    they want performed as a command or function object: see Items 87 to 89); or b)
    expose locking in the interface in some way.


    +   - *Lock-free designs, including immutability (read-only objects): No locking
    needed.* It is possible to design types so that no locking at all is needed (see
    References). One common example is immutable objects, which do not need to be
    locked because they never change; for example, for an immutable string type, a
    string object is never modified once created, and every string operation results
    in the creation of a new string.


    Note that calling code should not need to know about your types’ implementation
    details (see Item 11). If your type uses under-the-covers data-sharing techniques
    (e.g., copy-on-write), you do not need to take responsibility for all possible
    thread safety issues, but you *must* take responsibility for restoring “just enough”
    thread safety to guarantee that calling code will be correct if it performs its
    usual duty of care: The type must be as safe to use as it would be if it didn’t
    use covert implementation-sharing. (See [Sutter04c].) As noted, all properly written
    types must allow manipulation of distinct visible objects in different threads
    without synchronization.


    Particularly if you are authoring a widely-used library, consider making your
    objects safe to use in a multithreaded program as described above, but without
    added overhead in a single-threaded program. For example, if you are writing a
    library containing a type that uses copy-on-write, and must therefore do at least
    some internal locking, prefer to arrange for the locking to disappear in single-threaded
    builds of your library (#ifdefs and no-op implementations are common strategies).


    When acquiring multiple locks, avoid deadlock situations by arranging for all
    code that acquires the same locks to acquire them in the same order. (Releasing
    the locks can be done in any order.) One solution is to acquire locks in increasing
    order by memory address; addresses provide a handy, unique, application-wide ordering.


    # References


    [Alexandrescu02a] • [Alexandrescu04] • [Butenhof97] • [Henney00] • [Henney01]
    • [Meyers04] • [Schmidt01] • [Stroustrup00] §14.9 • [Sutter02] §16 • [Sutter04c]'
