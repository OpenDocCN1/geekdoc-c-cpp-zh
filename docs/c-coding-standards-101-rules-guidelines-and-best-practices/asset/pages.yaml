- pgno: 31
  md: 'pit—we know it has happened to us, and we know it has happened or will happen
    to you. Sure, we go fix it and ship the fix to the customer, but it would be better
    to avoid such embarrassment and rework. So, all things being equal (including
    clarity and readability), do the following up front:


    +   - *Use flexible, dynamically-allocated data instead of fixed-size arrays:*
    Arrays “larger than the largest I’ll ever need” are a terrible correctness and
    security fallacy. (See Item 77.) Arrays are acceptable when sizes really are fixed
    at compile time.

    +   - *Know your algorithm’s actual complexity:* Beware subtle traps like linear-seeming
    algorithms that actually call other linear operations, making the algorithm actually
    quadratic. (See Item 81 for an example.)

    +   - *Prefer to use linear algorithms or faster wherever possible:* Constant-time
    complexity, such as `push_back`, and hash table lookup, is perfect (see Items
    76 and 80). O(log N) logarithmic complexity, such as `set/map` operations and
    `lower_bound` and `upper_bound` with random-access iterators, is good (see Items
    76, 85, and 86). O(N) linear complexity, such as `vector::insert` and `for_each`,
    is acceptable (see Items 76, 81, and 84).

    +   - *Try to avoid worse-than-linear algorithms where reasonable:* For example,
    by default spend some effort on finding a replacement if you’re facing a O(N log
    N) or O(N²) algorithm, so that your code won’t fall into a disproportionately
    deep performance pit in the event that data volumes grow significantly. For example,
    this is a major reason why Item 81 advises to prefer range member functions (which
    are generally linear) over repeated calls of their single-element counterparts
    (which easily becomes quadratic as one linear operation invokes another linear
    operation; see Example 1 of Item 81).

    +   - *Never use an exponential algorithm unless your back is against the wall
    and you really have no other option:* Search hard for an alternative before settling
    for an exponential algorithm, where even a modest increase in data volume means
    falling off a performance cliff.


    Second, after measurements show that optimization is necessary and important,
    and especially if it’s because data volumes are growing, focus on improving big-Oh
    complexity rather than on micro-optimizations like saving that one extra addition.


    In sum: Prefer to use linear (or better) algorithms wherever possible. Avoid worse-than-linear
    polynomial algorithms where reasonable. Avoid exponential algorithms with all
    your might.


    # References


    [Bentley00] §6, §8, Appendix 4 • [Cormen01] • [Kernighan99] §7 • [Knuth97a] •
    [Knuth97b] • [Knuth98] • [McConnell93] §5.1-4, §10.6 • [Murray93] §9.11 • [Sedgewick98]
    • [Stroustrup00] §17.1.2'
