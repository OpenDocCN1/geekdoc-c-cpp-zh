- pgno: 41
  md: 'When implementing RAII, be conscious of copy construction and assignment (see
    Item 49); the compiler-generated versions probably won''t be correct. If copying
    doesn''t make sense, explicitly disable both by making them private and not defined
    (see Item 53). Otherwise, have the copy constructor duplicate the resource or
    reference-count the number of uses, and have the assignment operator do the same
    and ensure that it frees its originally held resource if necessary. A classic
    oversight is to free the old resource before the new resource is successfully
    duplicated (see Item 71). Make sure that all resources are owned by objects. Prefer
    to hold dynamically allocated resources via smart pointers instead of raw pointers.
    Also, perform every explicit resource allocation (e.g., `new`) in its own statement
    that immediately gives the allocated resource to a manager object (e.g., `shared_ptr`);
    otherwise, you can leak resources because the order of evaluation of a function''s
    parameters is undefined. (See Item 31.) For example:


    ```

    ```cpp

    void Fun( shared_ptr<Widget> sp1, shared_ptr<Widget> sp2 );

    //...

    Fun( shared_ptr<Widget>(new Widget), shared_ptr<Widget>(new Widget) );

    ```

    ```


    Such code is unsafe. The C++ Standard gives compilers great leeway to reorder
    the two expressions building the function''s two arguments. In particular, the
    compiler can interleave execution of the two expressions: Memory allocation (by
    calling `operator new`) could be done first for both objects, followed by attempts
    to call the two Widget constructors. That very nicely sets things up for a leak
    because if one of the constructor calls throws an exception, then the other object''s
    memory will never be released! (See [Sutter02] for details.)


    This subtle problem has a simple solution: Follow the advice to never allocate
    more than one resource in a single statement, and perform every explicit resource
    allocation (e.g., `new`) in its own code statement that immediately gives the
    resource to an owning object (e.g., `shared_ptr`). For example:


    ```

    ```cpp

    shared_ptr<Widget> sp1(new Widget), sp2(new Widget);

    Fun( sp1, sp2 );

    ```

    ```


    See also Item 31 for other advantages to using this style.


    # ## Exceptions


    Smart pointers can be overused. Raw pointers are fine in code where the pointed-to
    object is visible to only a restricted quantity of code (e.g., purely internal
    to a class, such as a `Tree` class''s internal node navigation pointers).


