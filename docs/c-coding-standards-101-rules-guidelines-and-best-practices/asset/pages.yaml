- pgno: 20
  md: "# 1. **Compile cleanly at high warning levels.**\n\n# Summary\n\nTake warnings\
    \ to heart: Use your compiler’s highest warning level. Require clean (warning-free)\
    \ builds. Understand all warnings. Eliminate warnings by changing your code, not\
    \ by reducing the warning level.\n\n# Discussion\n\nYour compiler is your friend.\
    \ If it issues a warning for a certain construct, often there’s a potential problem\
    \ in your code.\n\nSuccessful builds should be silent (warning-free). If they\
    \ aren’t, you’ll quickly get into the habit of skimming the output, and you *will*\
    \ miss real problems. (See Item 2.)\n\nTo get rid of a warning: a) understand\
    \ it; and then b) rephrase your code to eliminate the warning and make it clearer\
    \ to both humans and compilers that the code does what you intended.\n\nDo this\
    \ even when the program seemed to run correctly in the first place. Do this even\
    \ when you are positive that the warning is benign. Even benign warnings can obscure\
    \ later warnings pointing to real dangers.\n\n# Examples\n\n*Example 1: A third-party\
    \ header file.* A library header file that you cannot change could contain a construct\
    \ that causes (probably benign) warnings. Then wrap the file with your own version\
    \ that **#include**s the original header and selectively turns off the noisy warnings\
    \ for that scope only, and then **#include** your wrapper throughout the rest\
    \ of your project. Example (note that the warning control syntax will vary from\
    \ compiler to compiler):\n\n```\n```cpp\n// File: myproj/mylambda.h -- wraps Boost's\
    \ lambda.hpp\n// Always include this file; don't use lambda.hpp directly.\n//\
    \ NOTE: Our build now automatically checks \"grep lambda.hpp <srcfile>\".\n//\
    \ Boost.Lambda produces noisy compiler warnings that we know are innocuous.\n\
    // When they fix it we'll remove the pragmas below, but this header will still\
    \ exist.\n//\n#pragma warning(push)     // disable for this header only\n    #pragma\
    \ warning(disable:4512)\n    #pragma warning(disable:4180)\n    #include <boost/lambda/lambda.hpp>\n\
    #pragma warning(pop)      // restore original warning level\n```\n```"
  merge: -1
  img_proc: true
- pgno: 21
  md: "*Example 2: “Unused function parameter.”* Check to make sure you really didn’t\
    \ mean to use the function parameter (e.g., it might be a placeholder for future\
    \ expansion, or a required part of a standardized signature that your code has\
    \ no use for). If it’s not needed, simply delete the name of a function parameter:\n\
    \n```\n```cpp\n// ... inside a user-defined allocator that has no use for the\
    \ hint ...\n\n// warning: “unused parameter ‘localityHint’”\npointer allocate(\
    \ size_type numObjects, const void *localityHint = 0 ) {\n  return static_cast<pointer>(\
    \ mallocShared( numObjects * sizeof(T) ) );\n}\n```\n```\n\n```\n```cpp\n// new\
    \ version: eliminates warning\npointer allocate( size_type numObjects, const void\
    \ * /* localityHint */ = 0 ) {\n  return static_cast<pointer>( mallocShared( numObjects\
    \ * sizeof(T) ) );\n}\n```\n```\n\n*Example 3: “Variable defined but never used.”*\
    \ Check to make sure you really didn’t mean to reference the variable. (An RAII\
    \ stack-based object often causes this warning spuriously; see Item 13.) If it’s\
    \ not needed, often you can silence the compiler by inserting an evaluation of\
    \ the variable itself as an expression (this evaluation won’t impact run-time\
    \ speed):\n\n```\n```cpp\n// warning: “variable ‘lock’ is defined but never used”\n\
    void Fun() {\n  Lock lock;\n  // ...\n}\n```\n```\n\n```\n```cpp\n// new version:\
