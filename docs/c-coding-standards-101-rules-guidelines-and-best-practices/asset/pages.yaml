- pgno: 188
  md: "# ## 89. Write function objects correctly.\n\n# ### Summary\n\nBe cheap, be\
    \ adaptable: Design function objects to be values that are cheap to copy. Where\
    \ possible, make them adaptable by inheriting from `unary_function` or `binary_function`.\n\
    \n# ### Discussion\n\nFunction objects are modeled on function pointers. Like\
    \ function pointers, the convention is to pass them by value. All of the standard\
    \ algorithms pass objects by value, and your algorithms should too. For example:\n\
    \n```\n    template<class Inputter, class Func>\n        Function for_each( Inputter\
    \ first, Inputter last, Function f );\n```\n\nTherefore, function objects must\
    \ be cheap to copy and monomorphic (immune to slicing, so avoid virtual functions;\
    \ see Item 54). But large and/or polymorphic objects are useful, and using them\
    \ is okay; just hide the size and richness using the Pimpl idiom (see Item 43),\
    \ which leaves the outer class as the required cheap-to-copy monomorphic type\
    \ that still accesses rich state. The outer class should:\n\n+   - Be adaptable:\
    \ Inherit from `unary_function` or `binary_function`. (See below.)\n+   - Have\
    \ a Pimpl: Store a pointer (e.g., `shared_ptr`) to a large/rich implementation.\n\
    +   - Have the function call operator(s): Pass these through to the implementation\
    \ object.\n\nThat should be all that’s needed in the outer class, other than possibly\
    \ providing non-default versions of construction, assignment, and/or destruction.\n\
    \nFunction objects should be adaptable. The standard binders and adapters rely\
    \ on certain typedefs, which are provided most conveniently when your function\
    \ object derives from `unary_function` or `binary_function`. Instantiate `unary_function`\
    \ or `binary_function` with the same types as your `operator()` takes and returns,\
    \ except that for each non-pointer type strip off any top-level `const`s and `&`s\
    \ from the type.\n\nAvoid providing multiple `operator()` functions, because that\
    \ makes adaptability difficult. It’s usually impossible to provide the right adaptability\
    \ typedefs because the same typedef would have different values for different\
    \ `operator()` functions.\n\nNot all function objects are predicates. Predicates\
    \ are a subset of function objects. (See Item 87.)\n\n# ### References\n\n[Allison98]\
    \ §15, §C • [Austern99] §4, §8, §15 • [Gamma95] Bridge • [Josuttis99] §8.2.4 •\
    \ [Koenig97] §21, §29 • [Meyers97] §34 • [Meyers01] §38, §40, §46 • [Musser01]\
    \ §2.4, §8, §23 • [Sutter00] §26-30 • [Vandevoorde03] §22"
  merge: -1
