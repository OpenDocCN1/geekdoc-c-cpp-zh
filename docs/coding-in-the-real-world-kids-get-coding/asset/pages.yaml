  md: '# Follow that robot!


    Robots are used for many things, from building cars to moving goods. Inside the
    robot, a computer is connected to sensors and motors. The motors make the robot
    move.


    One kind of robot that uses sensors and motors to move around is called a line-following
    robot. It can follow a line on the ground. This is because there is


    a sensor at the bottom of the robot that can find out where the line is. The computer
    makes sure the robot follows the line as it moves around.


    ![](img/e21802b3f4809ba10a603c190aef0236_21_0.png)


    # DATA DUCK


    We can program the computers inside these robots to do all sorts of amazing things.
    There are robots that can help doctors perform operations. Others can build cars
    or even play table tennis!


    ![](img/e21802b3f4809ba10a603c190aef0236_21_1.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Build a robot!


    Let''s build our own robot! To help it work, we need to make sure our robot has
    an input, a processor and an output. Look at the list below and pick one of each.
    What will your robot be able to do?


    Input:


    +   1. Distance sensor – this can find out how far away objects are from the robot

    2. Light sensor – this can find out whether it is light or dark around the robot


    Output:


    +   1. Motor attached to arms – this means our robot can do things such as flick
    a light switch

    2. Motor attached to wheels – this means our robot can move around


    ![](img/e21802b3f4809ba10a603c190aef0236_22_0.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# The future


    Computers are everywhere. They can be so tiny that we can barely see them. They
    can send information to each other and to devices, such as phones, without needing
    any wires.


    We can now wear computers, for example smart watches. These are watches with tiny
    computers in them that tell us things about ourselves. They can show us how fast
    we are breathing, and how long we slept last night.


    ![](img/e21802b3f4809ba10a603c190aef0236_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# A toast to friends!


    Someone has invented a toaster that sends a message to all your friends when you
    make a piece of toast! Now it''s your turn. Think about what your toaster of the
    future might be able to do. Write down or draw your design.


    # DATA DUCK


    We can put computers inside the machines we use every day, such as kettles and
    toasters! These machines can send and receive information from other computers.
    For example, we could use a phone to switch on the kettle!


    ![](img/e21802b3f4809ba10a603c190aef0236_24_0.png)'
