  md: '# Flying high


    Planes, helicopters and even small flying robots, called drones, all need sensors
    and computers to fly. Without them, these aircraft wouldn''t even be able to lift
    off the ground.


    One of the most important sensors is the distance sensor, which can measure the
    distance between the aircraft and the ground. The pilot needs to know this information
    so that she can make sure the aircraft doesn''t land too soon, or crash.


    ![](img/e21802b3f4809ba10a603c190aef0236_19_0.png)'
  merge: -1
  pgno: 19
- img_proc: true
