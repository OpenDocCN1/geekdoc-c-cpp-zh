    ![](img/e21802b3f4809ba10a603c190aef0236_22_0.png)


    # 未来


    计算机无处不在。它们可以小到我们几乎看不见。它们可以向其他设备发送信息，例如智能手表。它们告诉我们我们睡了多久。


