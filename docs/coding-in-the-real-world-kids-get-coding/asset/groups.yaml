    # 跟着机器人！


    机器人被用于许多领域，从制造汽车到移动货物。在机器人内部，计算机连接着传感器和电机。电机让机器人移动。


    一种使用传感器和电机移动的机器人被称为巡线机器人。它可以沿着地面上的线条移动。这是因为机器人底部有一个传感器，可以发现线条所在的位置。计算机确保机器人在移动时沿着线条走。


    ![](img/e21802b3f4809ba10a603c190aef0236_21_0.png)


    # 数据小鸭


    我们可以编写这些机器人内部计算机的程序来完成各种神奇的事情。有些机器人可以帮助医生进行手术。有些可以制造汽车，甚至可以打乒乓球！


    ![](img/e21802b3f4809ba10a603c190aef0236_21_1.png)


