    # 加法时间


    想象你是收银机的计算机。如果扫描仪传了以下信息，你会向收银机屏幕发送多少总金额？


    请翻到第23页查看答案。


    | 奶酪 | £2 |

    | --- | --- |

    | 鱼 | £3 |

    | 牛奶 | £1 |

    | 面包 | £1 |


    ![](img/e21802b3f4809ba10a603c190aef0236_16_0.png)


    # 金钱，金钱


    在商店收银台，我们使用扫描仪和计算机来告诉我们购物需要支付多少钱。当我们付款时，有时还会使用更多的计算机！


    人们可以使用银行卡甚至手机支付费用。他们通过将手机或卡片贴在一个名为“读卡器”的小型机器上来操作。


    在感应过程中，信息会在读卡器之间传输，这样资金就会从个人的银行账户转到商店。


    ![](img/e21802b3f4809ba10a603c190aef0236_17_0.png)


    # 数据小鸭


    所有的计算机都需要电池（或电力）才能工作。因此，读卡器向银行卡发送电。这意味着卡片获得了电源，现在可以发送和接收信息了。


    ![](img/e21802b3f4809ba10a603c190aef0236_17_1.png)


    # 触碰支付


    数据小鸭在商店想买一些 £1.50 的鸡蛋。他把卡片贴在读卡器上，但收到了错误信息和哔哔声。他无法用卡片支付。可能发生了什么？


    - A. 他的银行账户只剩 £1。

    - B. 机器无法连接到银行。

    - C. 他的卡片裂了。

    - D. 以上任何情况。


    请翻到第23页查看答案。


    ![](img/e21802b3f4809ba10a603c190aef0236_18_0.png)


    # 高飞


    飞机、直升机，甚至被称为无人机的小型飞行机器人，都需要传感器和计算机才能飞行。没有它们，这些飞行器甚至无法离地。


    最重要的传感器之一是距离传感器，它可以测量飞行器与地面之间的距离。飞行员需要这些信息，以确保飞机不会过早着陆或坠毁。


    ![](img/e21802b3f4809ba10a603c190aef0236_19_0.png)


    # 数据小鸭


    飞行器的传感器将其信息发送给处理器（计算机）。然后处理器将信息传递给仪表盘，飞行员可以在那里读取信息。


    # 继续努力！


