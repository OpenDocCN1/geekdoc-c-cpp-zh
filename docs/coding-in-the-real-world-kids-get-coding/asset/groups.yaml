    # # CODING IN THE REAL WORLD


    If you want to get ahead in today''s digital world, you need to understand computers.


    Computers are all around us - in our homes and on the streets. They control traffic
    lights, cars, smoke detectors, supermarket tills and much more. Learn how to write
    code that can keep traffic flowing safely or make sure a plane doesn''t crash.
    You can also discover how to program a car so the driver knows when to fill the
    tank! Then try out your new skills on the companion website. Let''s go!


