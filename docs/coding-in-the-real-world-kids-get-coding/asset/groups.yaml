    # Money, money


    At shop tills, we use scanners and computers to tell us how much we need to pay
    for our shopping. And when we pay, we sometimes use even more computers!


    People can pay for things by using a bank card or even their phone. They do this
    by tapping the phone or the card on a small machine, called a reader.


    During the tap, information is sent to and from the reader so that money goes
    from the person''s bank account to pay the shop.


    ![](img/e21802b3f4809ba10a603c190aef0236_17_0.png)


    # DATA DUCK


    All computers need a battery (or electricity) to work. So the reader sends electric
    power to the bank card. This means that the card is powered and can now send and
    receive information.


