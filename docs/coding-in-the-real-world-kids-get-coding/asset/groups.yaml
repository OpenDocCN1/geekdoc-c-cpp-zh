    ![](img/e21802b3f4809ba10a603c190aef0236_2_0.png)


    # KIDS GET CODING

    CODING IN THE REAL WORLD


    Heather Lyons


    ![](img/e21802b3f4809ba10a603c190aef0236_4_0.png)


    ## Contents


    - Getting started 3

    - Everyday computers 4

    - Car or computer? 6

    - Road safety 8

    - Home sweet home 10

    - Shopping 12

    - Money, money 14

    - Flying high 16

    - Follow that robot! 18

    - The future 20

    - Extension activities 22

    - Words to remember 22

    - Activity answers 23

    - Index 24


    Children will need access to the Internet for most of the activities in this book.
    Parents or teachers should supervise this and discuss staying safe online with
    children.


    ## Getting started


    Hi! I''m Data Duck. I''m going to tell you about the computers that are all around
    us. We can''t always see them, but they play a big part in our lives every day.


    All around us, there are computers that control machines, vehicles, robots, lights
    and many other things. They can do this because of the way they are programmed.
    When we program a computer, we tell it what to do using code.


    > DATA DUCK

    > Code is a set of instructions we use to tell computers what to do. In this book,
    we will be using coding blocks, like the one below. Coding blocks are instructions
    that we can combine to create code for a computer.


    > Change height by -10 m

    > Play duck call


    There are lots of activities in the book for you to try out. There are also some
    online activities for you to practise. For the online activities, go to www.blueshiftcoding.com/kidsgetcoding
    and look for the activity with the page number from the book.


    ## Everyday computers


    Did you know that computers aren''t just in our homes and schools? They are around
    us almost all the time. Computers control the street lights, our cars and things
    such as lights and alarms in and around our homes.


    Many of these computers around us include something called a ''sensor''. Sensors
    can pick up on certain things around them. Some can measure the temperature, others
    whether it is light or dark, and some can sense if there are any objects nearby.


    - Street lights: A street light uses a light sensor to find out when it''s getting
    dark. Once night-time falls, its light turns on.


    > House: Some houses have a motion sensor outside. It can find out if somebody
    is moving towards the house at night, and turn on a light.


    > Car: Some cars have distance sensors. These sensors can find how far away the
    car is from other objects, such as a wall. Drivers use these sensors when they
    are parking their car.


    ![](img/e21802b3f4809ba10a603c190aef0236_7_0.png)


    ## Lights on!


    Some cars turn on their headlights when it gets dark outside.

    Can you work out which kind of sensor a car uses to do this?

    A. A sensor that measures the distance between itself and the car in front.

    B. A sensor that measures how light or dark it is outside.

    C. A sensor that measures the temperature outside.


    Turn to page 23 to see the answers.


    ![](img/e21802b3f4809ba10a603c190aef0236_8_0.png)


    DATA DUCK

    Sensors are a bit like our senses! Do you remember what our senses are? Think
    of three senses and what they can do.


    ![](img/e21802b3f4809ba10a603c190aef0236_8_1.png)


    ## Car or computer?


    Cars have many computers in them - some have hundreds! These computers, or processors,
    all make sure the car works the way it should.


    There are computers that control the car''s heating, speed and its lights. Some
    computers can show maps of the area the car is in, while others can play music.
    Some cars have so clever computers they can even drive themselves!


    > DATA DUCK

    > In a car, the sensors pass the information they find out to the car''s computer.
    This is called input. Then, the computer passes on signals to other parts of the
    car to tell it to do certain things. This is called output.


    ![](img/e21802b3f4809ba10a603c190aef0236_9_0.png)


    ## Time for refill


    Drivers need to know in good time when their car''s petrol tank needs refilling,
    because they still need to be able to drive to the petrol station. Look at the
    inputs and outputs below, and pick which ones mean this car''s computer is doing
    its properly. Turn to page 23 to see the answers.


    ### Input:

    - 1. Tank sensor tells tank is full.

    - 2. Tank sensor tells tank is empty.

    - 3. Tank sensor tells tank is nearly empty.


    ### Output:

    - 1. Computer passes on signal to light: flashing.

    - 2. Computer passes on signal to radio: play music.

    - 3. Computer passes on signal to heating: switch on.


    ![](img/e21802b3f4809ba10a603c190aef0236_10_0.png)


    ## Road safety


    Traffic lights are very important. They keep people who are crossing the street
    safe. They also keep traffic moving, so that we can all get to where we need to
    go. And they all work with sensors!


    Traffic light sensors can detect when there is a lot of traffic or when someone
    is waiting to cross. The sensors pass this information to the computer. The computer
    then sends on signal to the lights, so they change to red, amber or green at the
    right time.


    ## Change the lights


    It''s very important for the traffic light''s computer, or processor, to change
    the lights at the right time. This helps everyone on the road stay safe.


    Traffic light computers are programmed to make sure they pass on the right information
    to the lights. Have a look at the information below, and choose which the computer
    needs to send to the lights. To pass page 23 to see the answers.


    ### Sensor information:

    - There are many people waiting to cross the road.

    - There are many cars waiting at a red light.

    - There are many people (pedestrians) crossing the road.


    ### Computer signal to lights:

    - A: Turn red for cars. Then turn green for people, so they can cross.

    - A: First, turn green for cars. Then, turn red for pedestrians.

    - B: Remain green for cars. Turn green for people, too.

    - B: First, turn red for pedestrians. Then, turn green for cars.


    ![](img/e21802b3f4809ba10a603c190aef0236_12_0.png)


    ## Home sweet home


    Computers in our home help keep us safe and comfortable. They make sure our rooms
    aren''t too cold, they tell us when there is a fire and they switch on lights
    when it''s dark outside.


    - Alarm system: Sensors tell a computer when a door or a window is opened. The
    computer sends a signal to switch to a loud alarm. Some computers even send a
    signal to the police, so they know there has been a break-in.

    - Smoke detector: Sensors tell a computer when there is smoke in the house. The
    computer sets off an alarm to warn people that something is burning.


    ![](img/e21802b3f4809ba10a603c190aef0236_13_0.png)

    - Automatic light: A movement sensor tells a computer when someone is moving outside
    the house. The computer switches on the outside light.

    - Thermostat: This computer uses a temperature sensor to check whether rooms are
    too cold or warm. The computer then passes on the right signal to the heating
    system.


    ## Invent it!


    Can you think of a computer you would like to invent for your house? What would
    it be able to do? Can you think of the sorts of sensors it might use? Draw your
    invention and explain how it would work.


    > DATA DUCK

    > There are many other great inventions that can help around the home: mini robots
    that vacuum the floor in any room when it gets dirty, and devices that make sure
    plants get watered at the right time. All of these inventions use computers!


    ![](img/e21802b3f4809ba10a603c190aef0236_14_0.png)


    ## Shopping


    When we go to a shop, computers keep track of what we buy and how much we pay.
    Most of the time, the computers find out all this information thanks to something
    called a ‘barcode’.


    A barcode is a picture made up of lots of lines and numbers. You can find a barcode
    on the back of this book! Computers can read barcodes with the help of a sensor
    called a scanner. The barcodes help computers to find out what the scanned item
    is and how much it costs.


    > DATA DUCK

    At a shop check-out till, all the items a customer would like to buy are scanned.
    The information on the barcode is passed on from the scanner to the till’s computer.
    The computer then adds up the cost of all the items and shows the amount on the
    till screen.

