    # 第 4 章 编码


    起初我打了很多错。到晚上结束时，我打得已经完美无缺了。在漫长的深夜里，我意识到盲打完全取决于信心。我的手指知道按键在哪里，我只需要获得自己没有犯错的信心。帮助建立这种信心的因素之一是，我可以感觉到自己何时犯了错误。到晚上结束时，如果我犯了错，我几乎能立即发现，并简单地不看弹出卡片。


    能够感知自己的错误很重要。不仅是在打字时，在万事万皆如此。拥有“错误感”意味着你能快速捕捉到反馈回路，并更快地从错误中学习。从在那台 029 上一天起，我学习并精通了几个学科。我发现，在每种情况下，精通的关键都是信心和错误感。


    这一章描述了我个人的编码规则和原则。这些规则和原则不是关于代码本身的；它们是关于在编写代码时的行为、情绪和态度。它们描述了我编写代码时自有的心理、道德和情感背景。这些是我信心和错误感的根源。


    你可能不会同意我在这里所说的一切。毕竟，这些是非常私人的东西。事实上，你可能会非常激烈地反对我的某些态度和原则。这没关系——它们并不是作为除我之外的任何人的绝对真理存在的。它们只是一个男人成为专业程序员的方法。


    也许，通过学习和思考我个人的编码环境，你可以学会从我手中夺走那块小石子。


    # 准备工作


    编码是一项智力上具有挑战性且耗能的活动。它所需的专注和投入程度是很少有其他学科所要求的。这是因为编码要求你同时处理许多竞争性因素。


    - 1. 首先，你的代码必须能够运行。你必须理解你正在解决什么问题，并理解如何解决该问题。你必须确保你写的代码是该解决方案的忠实体现。你必须管理该解决方案的每一个细节，同时在语言、平台、当前架构以及当前系统的所有缺陷中保持一致。


    - 2. 你的代码必须解决客户为你设定的问题集。通常，客户的需求并不真正解决了客户的问题。这取决于你发现这一点并与客户谈判，以确保满足客户真实的需求。


    - 3. 你的代码必须很好地融入现有系统。它不应该增加系统的僵性、脆弱性或不透明性。必须良好管理依赖。简而言之，你的代码需要遵循可靠的工程原则。


    - 4. 你的代码必须对其他程序员可读。这不仅仅是写漂亮注释的问题，而是要求你构建代码以揭示你的意图。这很难。事实上，这将是程序员最难掌握的事情之一。


    平衡所有这些考虑是非常的。在生理上，长时间保持必要的专注和投入是很困难。再加上在团队、组织中工作的各种和干扰，以及日常生活的忧虑和关注。底线是，分心的机会非常多。


    当你无法充分专注和投入时，你写的代码就是错误的。它会有 Bug。它会有错误的结构。它将变得不透明且复杂。简而言之，它将不得不重修或重做。分心时工作会产生浪费。


    如果你感到疲劳或分心，不要写代码。你只会重做已经做过的东西。相反，找一种方法消除干扰并静下心。


    # 凌晨 3 点的代码


    我写过的最糟糕的代码是在凌晨 3 点写的。那是 1988 年，我在一家名为 Clear Communications 的电信初创公司工作。我们都在加班加点以积累“汗水股”。当然，我们都在梦想着发财。


