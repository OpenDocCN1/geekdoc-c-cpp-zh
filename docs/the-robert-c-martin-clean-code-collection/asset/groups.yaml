    # 封面


    ![](img/499f221b8a09437d769a5954e5adb042_93_0.png)


    封面上那幅震撼的图像让人联想到索伦之眼，那是 M1，即蟹星云。M1 位于户座，位于牛座左角星（天牛座）右约一度处。蟹星云是一次超新星爆发的遗迹，它在公元 1054
    年 7 月 4 日这个相当吉祥的日子，将内脏喷洒了整个天空。在 6500 光年的距离，那次爆炸在中国观测者看来像是一颗新星，亮度与木星相当。事实上，它在白天是可见的！在接下来的六个月里，它逐渐消失在肉眼范围内。


    封面图像是可见光和 X 射光的复合。可见光部分由哈勃望远镜拍摄，构成了外壳。内部看起来像蓝色射箭靶的物体是由钱德 X 射线望远镜拍摄的。


    可见图像描绘了一个快速膨胀的尘和气体云，其中夹杂着超新星爆发留下的重元素。该云现在的直径为 11 光年，重量达 4.5 个太阳质量，并以每秒 1500 公里的猛烈速度扩张。那场古老爆炸的动能至少是令人印象深刻。


    靶心的正中心是一个亮蓝点。那是脉星所在的地方。正是脉星的形成导致了恒星的爆发。这颗注定毁灭的恒星核心接近太阳质量的物质坍缩成直径约 30 公里的中子球。这种坍缩产生的动能，加上所有这些中子形成时产生的惊人中微子流，撕裂了恒星，并将其炸成了碎片。


    脉星每秒旋转大约 30 次；并在旋转时会闪烁。我们可以在望远镜中看到它闪烁。那些光脉冲正是我们称之为脉星的原因，它是“脉冲星”（Pulsating Star）的缩写。


    ## 前提介绍


    （别跳过，你会用到的。）


    ![](img/499f221b8a09437d769a5954e5adb042_95_0.png)


    我推测你拿起这本书是因为你是一名程序员，并且对“专业化”这个概念感兴趣。你本应该的。专业化正是我们行业迫切需要的东西。


    我已经当了 42 年程序员了；在那段时间里——听我慢慢——我见过了一切。我被解雇过。我受到赞誉过。我当过团队领、经理、底层工人，甚至当过 CEO。我和才华的程序员共事过，也和庸才共事过。我做过高科技尖端的嵌入式软硬件系统，也做过企业薪资系统。我用过
    COBOL、FORTRAN、BAL、PDP-8-11、C++、Java、Ruby、Smalltalk 以及许多其他语言和系统进行编程。我和不可信的薪水小偷共事过，也和完美的专业人士共事过。最后一种分类正是本书的主题。


    在书页，我将尝试定义成为一名专业程序员的含义。我将描述我认为本质上专业的态度、纪律和行为。


    我如何知道这些态度、纪律和行为是什么？因为我必须通过惨痛的代价来学习它们。要知道，当我得到第一份程序员工作时，“专业”是你最不会用来描述我的词。


    那是 1969 年。我 17 岁。我父亲纠缠着一家名为 ASC 的本地公司聘用我当临时兼职程序员。（是的，我父亲能做到那种事。我曾看着他走出去手挥道“停！”，车停了。没有人对我父亲说“不”。）公司安排我在一个存放所有
    IBM 计算机手册的房间里工作。他们让我把多年来的更新内容放进手册里。我是在那里第一次看到了这句话：“此页特意留空。”


    在更新了几天手册后，我的主管要求我写一个简单的 Easycoder 程序。被要求这让我非常兴奋。我以前从未为一台真实的计算机写过程序。然而，我之前“吸入”了
    Autocoder 的书籍，对如何开始有一个模糊的构想。


    - 1. 一个来源不明的技术术语。

    - 2. Easycoder 是霍尼韦 H200 计算机的汇编，类似于 IBM 1401 计算机的 Autocoder。每条记录 1。带有新 ID 的记录将写入新的磁带。


    我的主管向我展示了一个架子，上面放着许多叠红蓝色的打孔卡。想象你买了 50 副扑克牌，25 副红牌和 25 副蓝牌。然后你将这些牌堆在一起。这些卡片看起来就是那样。它们是红蓝相间的条纹，每条纹超过
    200 张卡片。每个条纹都包含程序员通常使用的子程序库源代码。程序员只需从堆中取下最上方的一叠，确保没有拿错红色或蓝色的卡片，然后将其放在他们程序卡片堆的末尾。


    我在一些编码表上写了程序。编码表是长矩方形的纸，分为 25 行 80 列。每行代表一张卡片。你在每行上写内容。


