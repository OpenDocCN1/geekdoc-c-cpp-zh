    # 6A


    # 第 1 章：整洁的代码


    他们深度参与了项目的规划，并对任何失败承担巨大的责任；尤其是当这些失败与糟糕的代码有关时！


    “等一下！”你说，“如果我不知道经理在说什么，我会被解雇。”可能大多数经理都想要真相，即使他们表现得并不如此。大多数经理想要良好的代码，即使他们正痴迷于进度表。他们可能会充满激情地要求进度和需求；但那是他们的工作。而你的任务是以同样的热情来捍卫代码。


    为了说明这一点，如果你是一个医生，而一个病人要求你停止为了手术做准备的所有愚蠢洗手动作，因为这花费了太多时间？显然，病人是老板；你绝对应该拒绝遵守。为什么？因为医生对疾病和感染的风险比患者更了解。医生顺从患者的要求将是不专业的行为（更不用说是犯罪行为了）。


    因此，程序员屈从于那些不理解制造混乱之风险的经理的意愿，是不专业的。


    # 原始的困境


    程序员面临着一个基本价值观的困境。所有拥有多年经验的开发者都知道，之前的混乱会拖慢他们的速度。然而，所有开发者都感到为了满足期限而制造混乱的压力。简而言之，他们没有花时间来变快！


    真正的专业人士知道，困境的第二部分是错误的。你不会通过制造混乱来赶上期限。事实上，混乱会立即拖慢你的速度，并迫你错过期限。赶上期限的唯一方法——唯一的快速方法——就是始终保持代码尽可能整洁。


    # 整洁代码的艺术？


    假设你认为混乱的代码是一个障碍。假设你接受快速的唯一方法是保持代码整洁。那么你必须问自己：“我该如何写整洁的代码？”如果你不知道代码整洁意味着什么，那么尝试写整洁的代码是没用的！


    坏消息是，写整洁的代码非常像画画。我们大多数人都知道一幅画画得好或坏。但能识别艺术的好坏并不意味着我们知道如何画画。因此，能识别整洁代码和肮脏代码并不意味着我们知道如何写整洁的代码！


    - 2. 当 1847 年伊格纳斯·塞梅尔魏维斯（Ignaz Semmelweis）首次向医生建议洗手时，它遭到了拒绝，理由是医生太忙了，没有时间在看病人之间洗手。


    # 拥有混乱的总成本


    写整洁的代码需要自律地使用无数技术，这些技术通过苦心获得的“整洁感”来应用。这种“代码感”是关键。我们有些人天生就有这种感觉。我们有些人则必须努力才能获得它。它不仅能让我们看到代码的好坏，还展示了如何应用自律来将糟糕代码转化为整洁代码的策略。


    一个没有“代码感”的程序员看一个混乱的模块能识别出它的混乱，但不知道该怎么办。有“代码感”的程序员看一个混乱的模块会看到选项和变体。“代码感”将帮助该程序员选择最好的变体，并引导他或她执行一系列保持行为的转换，从这里到达那里。


    简而言之，写整洁代码的程序员是一个艺术家，他们可以通过一系列转换清理屏幕，直到它变成一个优雅的代码系统。


    # 什么是整洁的代码？


    定义的数量可能和程序员的数量一样多。因此，我问了一些知名且经验丰富的程序员他们的看法。


    比雅尼·斯特鲁斯特斯特普（Bjarne Stroustrup），C++ 发明者，《C++ 语言编程》作者


    ![](img/499f221b8a09437d769a5954e5adb042_39_0.png)


    我喜欢代码优雅且高效。逻辑应该是直观的，让漏洞难以隐藏；依赖关系尽可能少以便于维护；错误处理根据明确的策略是完整的；性能接近最优，以免诱导人们通过不审慎的优化让代码变得混乱。整洁的代码只把一件事做好。


    比雅尼使用了“优雅”这个词。那是一个世界！我的 MacBook 字典提供了以下定义：外观令人愉悦、优雅且有风格；令人愉悦、巧妙且简单。注意对“愉悦”一词的强调。显然比雅尼认为整洁的代码读起来是愉悦的。阅读它应该让你微笑，就像看到一个精美的音乐盒或设计良好的汽车。


    比雅尼还提到了效率——两次。这对于这位 C++ 发明者来说可能不应该让我们惊讶；但我认为这不仅仅是对速度的单纯渴望。浪费的周期是不优雅的，它们不愉悦。现在注意比雅尼使用的词


    # 8A


    # 第 1 章：整洁的代码


    来描述不优雅的后果。他使用了“诱惑”（tempt）这个词。这里有一个深刻的真理。糟糕的代码诱惑混乱增长！当其他人更改糟糕代码时，他们往往会让它变得糟糕。务实的大卫·托马斯（Dave
    Thomas）和安迪·亨特（Andy Hunt）用另一种说法。他们使用了破窗比喻。一栋窗户破碎的建筑看起来没有人关心它。所以其他人也停止关心。他们允许更多的窗户破碎。最终，他们主动打破它们。他们在外墙上涂鸦，让损害堆积。一扇破碎的窗户就开始了腐败的过程。


    比雅尼还提到应该处理错误处理。这是我们都同意的一点，但处理方式才是真正的错误所在。


    (注：此处根据要求去除了原文中重复且逻辑混乱的 OCR 错误文本)

