    # 10A


    ## Chapter 1: Clean Code


    ### Michael Feathers, author of Working Effectively with Legacy Code


    I would list all of the qualities that I notice in clean code, but there is one
    overarching quality that leads to all of them. Clean code always looks like it
    was written by someone who cares. There is nothing obvious that you can do to
    make it better. All of those things were thought about the code''s author, and
    if you try to imagine improvements, you''re led back to where you are, sitting
    in appreciation of the code someone left for you—code left by someone who cares
    deeply about the craft.


    ![](img/499f221b8a09437d769a5954e5adb042_42_0.png)


    One word: care. That''s really the topic of this book. Perhaps an appropriate
    subtitle would Be Care for Code.


    Michael hit it on the head. Clean code is code that has been taken the time to
    keep it simple and orderly. They have paid appropriate attention to details. They
    have cared.


    ## Ron Jeffries, author of Extreme Programming Installed and Extreme Programming
    Adventures in C#


    Ron began his career programming in Fortran The Strategic Air Command and has
    written code in almost every language and on almost every machine. It pays to
    consider his words carefully.


    ![](img/499f221b8a09437d769a5954e5adb042_42_1.png)


    In recent years I begin, and nearly end, with Beck''s rules of simple code. In
    priority order, simple code:


    - Runs all the tests;

    - Contains no duplication;

    - Expresses all design ideas that are in the system;

    - Minimizes the number of entities such as classes, methods, functions, and the
    like.


    Of these, I focus mostly on duplication. When the same thing is done over and
    over over, it''s a sign that there is an idea in my mind that is not well represented
    in the code. I try to figure out what it is. Then I try to express that idea clearly.


    Expressiveness to me includes meaningful names, and I am likely to change the
    names of things several times before I settle in. With modern coding tools such
    as Eclipse, renaming is quite inexpensive, so it doesn''t trouble me to change.
    Expressiveness goes names, however: I also look at whether an object or method
    is doing more than thing. If it''s an object, it probably needs to be broken into
    two or more objects. If it''s a method, I will always use the Extract Method refactoring
    on it, resulting in one method that says more clearly what it does, and some submethods
    saying how it is.


    Duplication and ever take me a very long way into what I consider clean code,
    and improving dirty code with just these two things in mind can make a huge difference.
    There is, however, one thing that I am aware of doing, which is a bit harder to
    explain.


    After years of doing this, it seems to me that all programs are made up of similar
    elements. One example is "finding things in a collection." Whether we have a database
    of records, or a hash map of keys and values, or an array of some kind, we find
    ourselves wanting a particular item from collection. When that happening, I often
    wrap the particular implementation in a more abstract method or class. That gives
    me a couple of adventures.


    I can implement the functionality now with something simple, say a hash map, but
    since now all the references to that are covered by my little abstraction, I can
    change the implementation any I want. I can go forward quickly while preserving
    my ability to change.


    In addition, the collection abstraction often calls my attention to what''s "really"
    going on, and keeps me running down the path of implementing arbitrary behavior
    when all I really need is a few simple ways of finding what I want.


    Reduced duplication, high expressiveness, and early building of simple abstractions.
    That''s what makes clean code for me.


    Here, in a few short paragraphs, Ron has summarized the contents of this book.
    In duplication, one thing, expressiveness, tiny abstractions. Everything is there.


    Ward Cunningham, inventor of Wiki, inventor of Fit, inventor of Extreme Programming.
    Motive force behind Design Patterns. Smalltalk and OO thought leader. The godfather
    of all who care about code.


    You know you are working on clean code when each routine turns out to be pretty
    much what you expected. You can call it beautiful code when the code also makes
    it look like the language was made for the problem.


    ![](img/499f221b8a09437d769a5954e5adb042_43_0.png)


    Statements like this are characteristic of Ward. You read it, nod your head, and
    then go on to the next topic. It sounds so reasonable, so obvious, that it barely
    registers as something profound. You might think it was pretty much what you expected.
    But let''s take a closer look.


    ## Chapter 1: Clean Code


    "... pretty much what you expected.” When was the last time you saw a module that
    was pretty much what you expected? Isn''t it more likely that the modules you
    look at will be puzzling, complicated, tangled? Isn''t misdirection the rule?
    Aren''t you to flailing about trying to grab and hold the heads of reasoning that
    spew forth the whole system and weave their way through the module you are reading?
    When was the last time you read some code and nodded the head you might have nodded
    your head at Ward''s statement?


    Ward expects that when you read clean code you won''t be surprised by all. Indeed,
    you won''t even spend effort. You will read it, and it will be pretty much what
    you expected. It will be obvious, simple, and compelling. Each module will set
    the stage for the next. Each tells you what the next will be written. Programs
    that are clean are so profoundly written that you don''t notice it. The designer
    makes it look ridiculously simple like all exceptional designs.


    And about Ward''s notion of beauty? We''ve all rallied against the fact that our
    languages weren''t designed for our problems. But Ward''s statement puts the onus
    on us. He says that beautiful code makes the language look like it was made for
    the problem! So it''s our responsibility to make the language simple! Language
    bigots everywhere, beware! It is not the language that makes programs appear simple.
    It is the programmer that makes the language appear simple!


    ## Schools of Thought


    What about me (Uncle Bob)? What do I think clean code is? This book will tell
    you, in hideous detail, what I and my compatriots think about clean code. We will
    tell you what we think makes a clean variable name, a clean function, a clean
    class, etc. We will present these opinions as absolutes, we will not apologize
    for our stridence. To us, at this point in our careers, they are absolutes. They
    are our school of thought about clean code.


    Martial artists do not all agree about the best martial art, or the technique
    within a martial art. Often master martial artists will find their own schools
    of thought and gather students to learn from them. We see Gracie Jiu Jitsu, founded
    and taught by the Gracie family in Brazil. We see Hakkoryu Jiu Jitsu, Ryuho in
    Tokyo. We see Jeet Kune Do, founded and taught by Bruce Lee in the United States.


    ![](img/499f221b8a09437d769a5954e5adb042_44_0.png)


    ## We Are Authors


    Students of these approaches immerse themselves in the teachings of the founder.
    They dedicate themselves to learn what particular master teaches, to the exclusion
    of any other master''s teaching. Later, as the students grow in their art, they
    may become the student of a different master so they can refine their knowledge
    and practice. Some eventually go on to refine their skills, discovering new techniques
    and finding their own schools.


    None of the different schools is absolutely right. Yet within a particular school
    act the teachings and techniques are right. After all, there is a right way to
    practice Hakkryu Jitsu, or Jeet Kune Do. But this rightness within a school does
    not invalidate the teachings of a different school.


    Consider this book description of the Object Mentor School of Clean Code. The
    techniques and teachings within are the way that we practice our art. We are willing
    to claim that if you follow these, you will enjoy the benefits that we have, and
    you will learn to write code that is clean and professional. But don''t make the
    mistake of thinking that we are "right" in any absolute sense. There are other
    schools and masters that have just as much claim to professionalism as we. It
    would behoove you to learn from them as well.


    Indeed, many of the recommendations in this book are controversial. You will probably
    not agree with all of them. You might violently disagree with some of them. That''s
    fine. We can''t claim final authority. On the other hand, the recommendations
    in this book are things that we thought long and hard about. We have learned through
    decades of experience and repeated trial and error. So whether you agree or disagree,
    it would be that you do not see, and respect, our point of view.


    The author field of a tells us who we are. We are authors. And one thing about
    authors is they have readers. Readers are responsible for communicating with their
    readers. The time you write a line of code, remember you are author, writing for
    readers who will judge your effort.

