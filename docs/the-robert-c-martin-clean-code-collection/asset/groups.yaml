    the reader that “Aha! Of course!” as the issues and tensions are resolved in the
    revelation of an obvious solution.


    I Find Grady’s use of the phrase “crisp abstraction to be a fascinating oxymoron!
    After all the word “crisp” is nearly a synonym for “concrete.” My MacBook’s dictionary
    holds the following definition of “crisp”: briskly decisive and matter-of-fact,
    without hesitation or unnecessary detail. Despite this juxtaposition of meaning,
    the words carry a powerful message. Our code should be matter-of-fact as opposed
    to speculative. It should contain only what is necessary. Our readers should perceive
    us as have been decisive.


    "Big” Dave Thomas, founder of OTI, godfather of the Eclipse strategy


    Clean code can be read, and enhanced by a developer other than its original author.
    It has meaningful names and acceptance tests. It provides one way rather than
    many ways for doing thing. It has minimal dependencies, which are explicitly defined,
    and provides a clear and minimal API. Code should be literate since depending
    on the language, not all necessary information can be expressed clearly in code
    alone.


    ![](img/499f221b8a09437d769a5954e5adb042_41_0.png)


    Dave shares Grady’s desire for readability, but with an important twist. Dave
    asserts that clean code makes it easy for other people to enhance it. This may
    seem obvious, but cannot be overemphasized. There is, after all, a difference
    between code that is easy to read and code that is easy to change.


    Dave ties cleanliness to tests! Ten years ago this would have raised a lot of
    eyebrows. But the discipline of Test Development has made a profound impact upon
    our industry and has become one of our most fundamental disciplines. Dave is right.
    Code, without tests, is not clean. No matter elegant it is, no matter how readable
    and accessible, if it has not tests, it is not clean.


    Dave uses minimal twice. Apparently he values code that is small, rather than
    code that is large. Indeed, this has been a common refrain throughout software
    literature since its inception. Smaller is better.


    Dave also says that code should be literate. This is a soft reference to Knuth’s
    literate programming. The upshot is that the code should be composed in such a
    form as to make readable by humans.


