    \ hope for the best. Rather, you have to carefully partition the system into small\
    \ understandable units that have as little to do with each other as possible—and\
    \ that's hard.\n\nProgramming is so hard, in fact, that it is beyond the capability\
    \ of one person to do it well. No matter how skilled you are, you will willingly\
    \ benefit from another programmer's thoughts and ideas.\n\n# HELPING OTHERS\n\n\
    Because of this, it is the responsibility of programmers to be available to help\
    \ each other. It is a violation of professional ethics to sequester yourself in\
    \ a cubicle or office and refuse the queries of others. Your work is not so important\
    \ that you cannot lend some of your time to help others. Indeed, as a professional\
    \ you are honor bound to offer help when it is needed.\n\nThis doesn't mean that\
    \ you don't need some alone. Of course you do. You have to be fair and polite\
    \ about it. For example, you can let it known that between the hours of 10 AM\
    \ and noon you should not be bothered, but from 1 PM to 3 PM your door is open.\n\
    \nYou should be conscious of the status of your teammates. If you see someone\
    \ who appears to be in trouble, you should offer your help. You will likely be\
    \ quite surprised at the profound effect your help can have. It's not that you\
    \ are so much smarter than the other person, it's just that a fresh perspective\
    \ can be a profound catalyst for solving problems.\n\nWhen you help someone, sit\
    \ down and write code together. Plan to spend the better part of an hour or more.\
    \ It may take less than that, but you don't want to be rushed. Resign yourself\
    \ to the task and give it a solid effort. You will likely come having learned\
    \ more than you gave.\n\n# BEING HELPED\n\nWhen someone offers to help you, be\
    \ gracious about it. Accept the help gratefully and give yourself to that help.\
    \ Do not protect your turf. Do not push the help away because you are under the\
    \ gun. Give it thirty minutes or so. If that time the person is not really helping\
    \ all that much, then politely excuse yourself and terminate the session with\
    \ thanks. Remember, just as you are honor bound to offer help, you are bound to\
    \ accept help.\n\nLearn how to ask for help. When you are stuck, befuddled, or\
    \ you can't wrap your mind around a problem, ask someone for help. If you are\
    \ sitting in a team room, you can just sit back and say, “I need some help.” Otherwise,\
    \ use yammer, or twitter, or email, or the phone on your desk. Call for help.\
    \ Again, this is a matter of professional ethics. It is unprofessional to remain\
    \ stuck when help is easily accessible.\n\nBy this time you may be expecting me\
    \ to burst into a chorus of Kumbaya while fuzzy bunnies leap onto the backs of\
    \ unicorns and we all happily fly rainbows of hope and change. Not, quite. You\
    \ see, programmers tend to be arrogant, self-absorbed introverts. We didn't get\
    \ into this business because we like people. Most of us got into programming because\
    \ we prefer to deeply focus on sterility, juggle lots of concepts simultaneously,\
    \ and in general prove to ourselves that we have the size of a planet, all not\
    \ having to interact with the messy complexities of other people.\n\nYes, this\
    \ is a stereotype. Yes, it is generalization with many exceptions. But the reality\
    \ is that programmers do not tend to be collaborators. And yet collaboration is\
    \ critical to effective programming. Therefore, since for many of us collaboration\
    \ is not an instinct, we require disciplines that drive us to collaborate.\n\n\
    # MENTORING\n\nI have a whole chapter on this topic later in the book. Now let\
    \ me simply say that the training of less experienced programmers is the responsibility\
    \ of those who have more experience. Training courses don't cut it. Books don't\
    \ cut it. Nothing can bring a young software developer to high performance quicker\
    \ than his own drive, and effective mentoring by his seniors. Therefore, once\
    \ again, it is a matter of professional ethics for senior programmers to spend\
    \ time taking younger programmers under their wing and mentoring them. By the\
    \ same token, those younger programmers have a professional duty to seek such\
    \ mentoring from their seniors.\n\n# BIBLIOGRAPHY\n\n- [Martin09]: Robert C. Martin,\
    \ Clean Code, Upper Saddle River, NJ: Prentice Hall, 2009.\n- [Martin03]: Robert\
    \ C. Martin, Agile Software Development: Principles, Patterns, and Practices,\
    \ Upper Saddle River, NJ: Prentice Hall, 2003.\n\n# INDEX\n\n# A\n\n- Acceptance\
