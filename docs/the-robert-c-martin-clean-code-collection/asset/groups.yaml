    # Bad Code


    # Bad Code


    I was recently reading the preface to Kent Beck''s book Implementation Patterns.¹
    He says, "..." this book is based on a rather fragile premise: that good code
    matters.\ ..." A fragile premise? I disagree! I think that premise is one of the
    most robust, supported, and overloaded of all the premises in our craft (and I
    think Kent knows it). We know good code matters because we''ve had to deal for
    so long with its lack.


    ![](img/499f221b8a09437d769a5954e5adb042_35_0.png)


    I know of one company that, in the late 80s, wrote a killer app. It was very popular,
    and lots of professionals bought and used it. But then the release cycles began
    to stretch. Bugs were not repaired from one to the next. Load times grew and crashes
    increased. I remember the day I shut the product down in frustration and never
    used it. The company went out of business a short time after that.


    Two decades later I met one of the early employees of that company and asked him
    what happened. The answer confirmed my fears. They had rushed the product to market
    and made a huge mess in the code. As they added more and more features, the code
    got worse and worse until they could not manage it any longer. It was the bad
    code that brought the company down.


    Have you been significantly impeded by bad code? If you are a programmer of any
    experience you''ve felt this impediment many times. Indeed, we have a name for
    it. We call it wading. We waded through bad code. We slog through a morass of
    tangled branches and hidden pitfalls. We struggle to find our way, hoping for
    some hint, of what is going on; but all we see is more and more senseless code.


    Of course you have been impeded by bad code. So then—why did you write it? Were
    you trying to go fast? Were you in a rush? Probably so. Perhaps you felt that
    you didn''t have time to do a good job;; that your boss would be angry with you
    if you took the time to clean up your code. Perhaps you just tired of working
    on this program and wanted it to be over. Or maybe you looked at the backlog of
    other stuff that you had promised to get done and realized that you needed to
    slam this module together so you could move on to the next. We''ve all done it.


    We''ve all looked at the mess we''ve just made and then chosen to leave it for
    another day. We''ve all felt the relief of seeing our messy program work and deciding
