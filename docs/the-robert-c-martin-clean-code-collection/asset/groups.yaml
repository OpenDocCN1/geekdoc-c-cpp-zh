    # Note from the Publisher


    The Robert C. Martin Clean Code Collection consists of two bestselling eBooks:


    +   - Clean Code:A Handbook of Agile Software Craftsmanship

    - The Clean Coder:A Code of Conduct for Professional Programmers


    In this collection, Robert C. Martin, also known as "Uncle Bob," provides a pragmatic
    method for writing better code from the start. He reveals the disciplines, techniques,
    tools, and practices that separate software craftsmen from mere "9-to-5" programmers.
    Within this collection are the tools and methods you need to become a true software
    professional.


    To simplify access to each book, we''ve appended "A" to the pages of Clean Code:A
    Handbook of Agile Software Craftsmanship,and "B" to pages of The Clean Coder:A
    Code of Conduct for Professional Programmers. This enabled us to produce a single,
    comprehensive table of contents and dedicated indexes.


    We hope you find this collection useful!


    The editorial and production teams at Prentice Hall'
