    我们花了几天时间写一个简单的实时（程序）。我们可以停止计算机，然后一个字一个字地查看内存。但我们不能这样做超过五分钟，因为卡车运会需要他们的系统恢复运行。


    该系统中的循环队列只是FIFO（先进先出）数据结构，即队列。


