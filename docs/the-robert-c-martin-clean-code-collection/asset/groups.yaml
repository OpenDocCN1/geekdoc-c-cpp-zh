    # 致谢


    Tim 和我学会了如何编写程序。这在 1968 年并不容易，但我们做到了。我们获得了关于 PDP-8、Fortran、PL/1 等书籍。我们痴迷于它们。我们写了一些当时根本没有希望执行的程序，因为我们无法接触到计算机。但出于纯粹的热爱，我们还是写了。


    我们的高中在大二时开始了计算机科学课程。他们接入了一台 ASR-33 电字机，以 110 波特的速度。这台电字机连接到了伊利诺伊理工学院的时间共享系统。没有人能比我们更接近它。连接是通过拨打电话建立的。当你听到电字机的应答声时，你只需按下电字机上的“orig”键，数据连接就建立了。Tim
    和我立即成为了这台系统的事实操作员。即使老师们并不知，他们也从未要求我们这样做。


    在计算机实验室，我们有两台电字机。一台是线线的，另一台是离线的。学生们使用它们来编写程序。通过输入纸带来打印程序。电字机一个接一个地打印页面。我们用纸刀将它们切开，并将输入纸带放入输出箱。


    Tim 和我是这个过程的大师和神。即使老师们在我们在房间里时也不打扰我们。我们正在做他们的工作，而他们也知道。他们从未要求我们这样做。他们从未告诉过我们我们可以。他们从未给过电字机的钥匙。我们刚搬进来，他们离开了——给了我们很长时间。我的数学老师们，McDermit
    先生、Fogel 先生和 Robien 先生：感谢你们！


    然后，在所有的作业完成后，我们开始编写。我们写了一个又一个程序来完成各种疯狂和奇怪的事情。我们写了用 ASCII 绘制圆和抛物线的程序。我们写了随机游走程序和随机单词生成器。我们计算了
    50 的阶乘直到最后一位。我们花费了大量的时间发明程序并让它们运行。


    两年后，Tim、我们的伙伴 Richard Lloyd 和我在伊利诺伊州湖景的 ASC Tabulating 公司被聘为程序员。当时 Tim 和我 18 岁。我们决定大学是浪费时间，应该立即开始职业生涯。在这里我们遇到了了
    Bill Hohri、Frank Ryder、Jim Carlin 和 John Miller。他们给了这些年轻人学习什么是专业编程的机会。这段经历并非全是正面的，也并非全是负面的。它确实具有教育意义。感谢他们所有人，感谢催化并推动了这一过程的
    Richard。


    大约一年后，我在 Outboard Marine Corporation 工作。那时我已经结婚了，并且正要着孩子出生。他们也把我解雇了。感谢 John、Ralph
    和 Tom！


    # 致谢


    然后我去 Teradyne 工作，在那里我结了 Russ Ashdown、Ken Finder、Bob Copithorne、Chuck Studee 和
    CK Srithran（现在是 Kris Iyer）。Ken 是我的老板。Chuck 和 CK 是我的伙伴。我从他们那里学到了很多。感谢，伙计们！


    还有 Mike Carew。在 Teradyne，他和我变成了黄金档。我们一起编写系统。如果你想完成某事，而且要快速完成，就找 Bob 和 Mike 来。我们在一起玩得非常开心。感谢，Mike！


    Jerry Fitzpatrick 也在 Teradyne 工作。我们通过一起玩《地下城与龙》相识，但很快建立了合作关系。我们在 Commodore 64
    上编写了软件来支持 D&D 用户。我们还在 Teradyne 启动了一个新项目“电子接待员”。我们工作了几年，他成了一个伟大的朋友。感谢，Jerry！


    在 Teradyne 工作期间，我在英国待了一年。我和 Mike Kergozou 结队。他和我一起计划各种事情，其中大多数我们用在了自行车和酒吧上。但他是一个专注的程序员，非常关注质量和纪律（尽管他可能不同意）。感谢，Mike！


    1987 年从英国返回后，我开始和 Jim Newkirk 一起计划。我们都离开了 Teradyne，加入了一家名为 Clear Communications
    的初创公司。我们花了几年时间在一起打拼。感谢， Jim！


    在最后，我们建立了 Object Mentor。其中一台机器机是 on-line machine，另一台是 off-line machine。


    # 关于作者


    自 1970 年以来，Robert C. Martin 一直是一名程序员。他是创始人 创始人 Robert C. Martin（Uncle Bob）。他编写并编辑了许多书籍，包括：


    - Designing Object Oriented C++ Applications Using the Booch Method

    - Patterns Languages of Program Design 3

    - More C++ Gems

    - Extreme Programming in Practice

    - Agile Software Development: Principles, Patterns, and Practices

    - UML for Java Programmers

    - Clean Code


    Martin 在各种贸易杂志上发表了数十篇文章，并是国际会议和贸易会的常驻演讲者。


    他是 Object Mentor, Inc. 的创始人兼总裁，这是一家由经验丰富的软件开发人员和经理组成的国际公司，专门为全球企业提供流程改进咨询、面向对象的软件设计咨询、培训和技能开发服务。


    作为软件开发领域的领军人物，Martin 曾担任《C++ Report》主编，并担任敏捷联盟（Agile Alliance）的首任主席。


    Robert 还是 Uncle Bob Consulting, LLC 的创始人，并与儿子 Micah Martin 共同创立了 The Clean Coders
    LLC。

