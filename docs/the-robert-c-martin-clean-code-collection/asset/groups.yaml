    Which door represents your code? Which door represents your team or your company?
    Why are we in that room? Is this a normal code review or have we found a stream
    of horrible problems shortly after going live? Are we debugging in a panic, poring
    over code that we thought worked? Are customers leaving in droves and managers
    breathing down our necks? How can we make sure we wind up the *right* door when
    the going gets tough? The answer is: *craftsmanship*.


    There are parts to learning craftsmanship: knowledge and work. You must gain the
    knowledge of principles, patterns, practices, and heuristics that a craftsman
    knows, and you must also grind that knowledge into your fingers, eyes, and by
    working hard and practicing.


    I can teach you the physics of riding a bicycle. Indeed, the classical mathematics
    is relatively straightforward. Gravity, friction, angular momentum, center of
    mass, and so forth, can be demonstrated with less than a page full of equations.
    Given those formulas I could prove to you bicycle riding is practical and give
    you all the knowledge needed to make it. And you''d fall down the first time you
    climbed on that bike.


    Coding is not forward. We could write down all the “feel good” principles of clean
    code and then trust you to do the work (in other words, let you fall down when
    you get on the bike), but then what kind of teachers would make you, and what
    kind of student would make you?


    No. That’s not the way this book is to work.


    Learning to write clean code is *hard work*. It requires more than just the knowledge
    of principles and patterns. You must *sweat over it*, and watch yourself fail.
    You must watch others practice it and you must see them stumble and retract their
    steps. You must see them agonize over decisions and see the price they pay for
    making decisions the wrong way.


    Be prepared to work hard while reading this book. This is not a “feel good” book
    that you can read on an airplane and finish before you load. This book will make
    you work, and *hard work*. What kind of work will you be doing? You will be reading
    code—lots of code. And you will be asked to follow along as we take modules apart
    and put them back together again. This will take time and effort; but we think
    it will be worth it.


    We have divided this book into three parts. The first chapters describe the principles,
    patterns, and practices of writing clean code. There is quite a bit of code in
    these chapters, and they will be challenging to read. They’ll prepare for the
    second section to come. If you put the book down after reading the first section,
    good luck to you!


    The third part of this book is the payoff. It is a single chapter containing a
    list of heuristics and smells while creating the case studies. As we walked and
    cleaned up the code in the case studies, we documented every reason for our actions
    as a heuristic or smell. We tried to understand our reactions to the code we were
    reading and changing, and worked hard to capture why we felt what we felt and
    what we did. The result is a knowledge base that describes the way we think when
    we write, read, and clean code.


    This knowledge base is of limited value if you don''t work of carefully reading
    through the case studies in the second part of this book. In those case studies
    we have forward annotated each change we make with forward references in square
    brackets like this: [H22]. This lets you the context in which those heuristics
    were applied and written! It is not the heuristics themselves that are so valuable,
    it is the relationship between these heuristics and the discrete decisions we
    made cleaning up the code in the case studies.


    To further help you with these relationships, we have placed a cross-reference
    at the end of the book that shows the page number for every forward reference.
    You can use it to look up each place where a first heuristic was used.


    If you read the first and third steps over the case studies, then you will have
    read another "feel good" about writing good software. But if you take the time
    to work through the case studies, following every tiny step, every minute—if you
    put yourself in our place, and force yourself to think along the same paths that
    you thought, then you will gain a much understanding of those principles, patterns,
    practices, and heuristics. They''ll be "feel good" knowledge any. They''ll have
    been ground into your gut, fingers, and heart. They''ll become...


    xii


    Acknowledgments


    Thanks to my wife, Susan, for her patience and support while I was buried in this
    book. Thanks to my children, for their joy and distractions. Thanks to my friends
    and colleagues, who have always challenged me and reminded me to take a break.


    A special thanks to the editors and design team, for their keen eyes and dedication.
    Thanks to the reviewers, for their insightful feedback and suggestions. And finally,
    thank you to the readers, for picking up this book. I hope it helps you write
    better code.


    # On the Cover


    The image on the cover is M104: The Sombrero Galaxy. M104 is located in Virgo
    and is just 30 million light-years from us. At it''s core is a supermassive black
    hole weighing in a billion solar masses.


    Does the image remind you of the explosion of the Kling moon *Praxis*? I vividly
    remember the scene in *Star Trek VI* that showed an equatorial ring of debris.
    Since that date, the equatorial ring has been a common artifact in sci-fi movie
    explosions. It was even added to the explosion of Alderaan in later iterations
    of the first *Star Wars* movie.


    What caused this ring to form around M104? Why does it have such a bulge and a
    tiny nucleus? It looks as though the central hole lost its cool and blew a 30,000
    light-year hole in the middle of the galaxy. Woe befell any civilizations that
    might have been in the path of that cosmic disruption.


    Supermassive black holes hollow stars for lunch, converting a sizable fraction
    of their mass to energy. $E = MC^2$ is leverage enough, when $M$ is a stellar
    mass: Look out! How many stars fell headlong into that maw before the monster
    was satiated? Could the size of the central void be a hint?


    The image of M104 on the cover is a combination of the famous light photograph
    from Hubble (right), and the recent infrared image from the Spitzer orbiting observatory
    (below, right). It''s the infrared image that clearly shows us ring nature of
    the galaxy. In visible light we only see the front edge of the ring in silhouette.
    The central bulge obscures the rest of the ring.


    But in the infrared, the hot particles in the ring shine through the central bulge.
    The two images combined give us a view we''ve not seen before and imply that long
    ago it was a raging inferno of activity.


