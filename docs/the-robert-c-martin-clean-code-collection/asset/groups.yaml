    \ me provide the final clean version.\n\n[content]\n## Chapter 1: Clean Code\n\
    \nOops, he is erasing what he typed!\nHe types it again,\nHe erases it again!\n\
    He types half of something else but then erases that!\nHe scrolls down to another\
    \ function that calls the function he’s changing to see how it is called.\nHe\
    \ scrolls back up and types the same code he erased.\nHe pauses.\nHe erases that\
    \ again!\nHe pops up another window and looks at a subclass. Is that function\
    \ overridden?\n\nYou get the drift. Indeed, the ratio of time spent reading vs.\
    \ writing is well over 10:1.\nWe are constantly reading old code as part of the\
    \ effort to write new code.\n\nBecause this ratio is high, we want the reading\
    \ of code to be easy, even if it makes writing harder. Of course there’s no way\
    \ to write code without reading it, making it easy to read makes it easier to\
    \ write.\n\nThere is no escape from this logic. You cannot write code if you cannot\
    \ read the surrounding code. The code you are trying to write today will be hard\
    \ or easy to write depending on how hard or easy the surrounding code is to read.\
    \ So if you want to go fast, and you want to get done quickly, if you want your\
    \ code to be easy to write, make it easy to read.\n\n## The Boy Scout Ruler\n\n\
    It’s not enough to write the code well. The code has to be kept over time. We’ve\
    \ all seen rot and degrade as time passes. So we must take an active role in preventing\
    \ this degradation.\n\nThe Boy Scouts of America have a simple rule that we can\
    \ apply to our profession.\n\nLeave the campground cleaner than you found it.³\n\
    \nIf we all checked-in our code a little cleaner than when we checked it out,\
    \ the code could not rot. The cleanup doesn’t have to be something. Change one\
    \ variable name for better, break up one function that’s a little too large, eliminate\
    \ one small bit of duplication, clean up one composite if statement.\n\nCan you\
    \ imagine working on a project where the code simply gets better as time passed?\
    \ Do you believe that any other option is professional? Indeed, isn’t continuous\
    \ improvement an intrinsic trait of professionalism?\n\n5. This was adapted from\
    \ Robert Stephenson Smyth Baden-Powell’s farewell message to the Scouts: “Try\
    \ and leave this a world little better than you found it. ...”\n\n## Bibliography\n\
    \n## Prequel and Principles\n\nIn many ways this book is a “prequel” to a book\
    \ I wrote in 2002 Agile Software Development: Principles, Patterns, and Practices\
    \ (PPP). The PPP book concerns itself with the principles of object-oriented design,\
    \ and many of the practices used by professional developers. If you have not read\
    \ PPP, then you may find that it continues the story by this book. If you have\
    \ already read it, then you'll find many of the sentiments of that book echoed\
    \ in this one at the level of code.\n\nIn this book you will find sporadic references\
    \ to various principles of design. These include the Single Responsibility Principle\
    \ (SRP), the Open Closed Principle (OCP), and the Dependency Inversion Principle\
    \ (DIP) among others. These principles are described in depth in PPP.\n\n## Conclusion\n\
    \nBooks on art don't promise to make you an artist. All they can give you some\
    \ of the tools, techniques, and thought processes that other artists have used.\
    \ So too this book cannot promise to give you “code-sense.” All it can do is show\
    \ you the thought processes of good programmers and the tricks, techniques, and\
    \ tools they use.\n\nJust like a book on art, this book will be full of details.\
    \ There will be lots of code. You'll see good code and you'll see bad code. You'll\
    \ see bad code transformed into good code. You'll see lists of heuristics, disciplines,\
    \ and techniques. You'll see example after example. After that, it's up to you.\n\
    \nRemember the old joke about the concert violinist who got lost on his way to\
    \ a performance? He stopped an old man on the corner and asked him how to get\
    \ to Carnegie Hall. The old man looked at the violinist and the violin tucked\
    \ under his arm, and said: “Practice, Practice!”\n\n## Bibliography\n\n[Beck07]:\
