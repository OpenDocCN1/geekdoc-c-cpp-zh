  mdcn: "\n\n# 第 4 章 编码\n\n重要的一点是：你不能只是把它们堆在一起并寄予希望。相反，你必须仔细地将系统划分为小的、可理解的单元，这些单元之间的相互关系越少越好——这非常困难。\n\
    \n事实上，编程是非常困难的，以至于一个人的能力无法胜任。无论你多么高练，你都会乐意从其他程序员的思想和想法中获益。\n\n# 帮助他人\n\n正因如此，程序员有责任随时准备好互相提供帮助。把自己隔绝在隔间或办公室里并拒绝他人的查询，是对职业伦理的违反。你的工作并不重要到以至于你无法抽出一些时间来帮助他人。事实上，作为一名专业人士，在需要需要时提供帮助是你的荣誉义务。\n\
    \n这并不意味着你不需要一些独处的时间。当然，你是需要的。但你必须对此保持公平和礼貌。例如，你可以让大家知道，在上午 10 点到中午之间你不应该被打扰，但在下午\
    \ 1 点到 3 点之间你的大门是开放的。\n\n你应该关注队友的状态。如果你看到有人似乎遇到了困难，你应该提供帮助。你可能会对你的帮助所产生的深远影响感到惊讶。这并不是因为你比别人聪明得多，而是因为新鲜视角可以成为解决问题的深远催化剂。\n\
    \n当你帮助某人时，坐下来一起写代码。计划花费一小时或更多时间。可能比这更短，但你不希望被催促。全身心投入任务并付出坚实的努力。你很可能会发现自己学到的比付出的多。\n\
    \n# 被帮助\n\n当有人提议帮助你时，要表现出感激。感激地接受帮助，并全注精力投入到这种帮助中。不要保护你的领地。不要因为压力大就推开帮助。给他们大约30分钟的时间。如果那段时间那个人并没有提供什么实质性的帮助，就礼貌地辞辞并表示感谢以结束会话。记住，正如你有义务提供帮助一样，你也有义务接受帮助。\n\
    \n学会如何寻求帮助。当你陷入困境、困惑或无法理解某个问题时，向某人寻求帮助。如果你坐在团队房间里，可以直接向后一靠说：“我需要一些帮助。”否则，使用 Yammer、Twitter、电子邮件或桌上的电话。呼叫帮助。再次强调，这是一个职业伦理问题。在帮助触手可及的情况下保持停滞是不专业的。\n\
    \n到此时，你可能正指望我突然唱起《Kumbaya》，而毛茸的小兔子跳到独角兽背上，我们都快乐地飞过希望与改变的彩虹。并非如此。你会发现，程序员往往是傲慢、自恋的内向者。我们进入这个行业并不是因为我们喜欢人类。我们大多数人进入编程是因为我们更倾向于深度关注无菌环境，同时处理许多概念，并通常向自己证明我们拥有行星般的规模，而无需与他人混乱的复杂性进行互动。\n\
    \n是的，这是一个刻板印象。是的，这是一个有很多例外的概括。但现实是，程序员往往并不协作。然而，协作对于有效的编程至关重要。因此，由于对我们许多人来说协作不是一种本能，我们需要推动我们协作的规范。\n\
    \n# 导师\n\n我在书的后面有一章专门讨论这个话题。现在让我简单说，培训经验较少的程序员是经验丰富人士的责任。培训课程是不够的。书籍也是。没有什么能比他自己的动力以及长辈有效的指导更快地让一个年轻的软件开发者达到高水平。因此，再次，高级程序员花时间将年轻程序员纳入门下并指导他们，是一个职业伦理问题。同样，那些年轻程序员有专业义务向他们的长辈寻求这种指导。\n\
    \n# 参考文献\n\n- [Martin09]: Robert C. Martin, Clean Code, Upper Saddle River, NJ:\
    \ Prentice Hall, 2009.\n- [Martin03]: Robert C. Martin, Agile Software Development:\
    \ Principles, Patterns, and Practices, Upper Saddle River, NJ: Prentice Hall,\
    \ 2003.\n\n# 索引\n\n# A\n\n- 验收测试 (Acceptance tests)\n 自动化的, 97B–99B\n- 沟通, 97B\n\
    - 持续集成和, 104B–105B\n- 定义的, 94B\n- 开发者在其中的角色, 100B–101B\n- 额外工作和, 99B\n- 与 GI 的,\
