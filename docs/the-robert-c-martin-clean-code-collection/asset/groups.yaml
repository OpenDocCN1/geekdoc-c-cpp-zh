    # The Total Cost of Owning a Mess


    working mess is better than nothing. We''ve all said we''d go back and clean it
    up later. of course, in those days we didn''t know LeBlanc''s law: Later equals
    never.


    If you have been a programmer for more than two or three years, you have probably
    been significantly slowed down by someone else''s messy code. If you have been
    a programmer for longer than two or three years, you have probably been slowed
    down by messy code. The degree of the slowdown can be significant. Over the span
    of a year or two, teams that were moving very fast at the beginning of a project
    can themselves moving at a snail''s pace. Every change they make to the code breaks
    two or three other parts of the code. No change is trivial. Every addition or
    modification to the system requires the tangles, twists, and knots to be “understood”
    so that more manages, twists, and knots can be added. Over time the mess becomes
    so big and deep that they cannot clean it up. There is no way at all.


    As the mess builds, the productivity of the team continues to decrease, asymptotically
    approaching zero. As productivity decreases, management does the only thing they
    can; they add more staff to the project in hopes of increasing productivity. But
    that new staff is not versed in the design of the system. They don''t know the
    difference between a change that matches the design intent and a change that thwarts
    the design intent. Furthermore, they, and everyone else on the team, under horrific
    pressure to increase productivity. So they all make more and more messes, driving
    the productivity ever further zero. (See Figure 1-1).


    ![](img/499f221b8a09437d769a5954e5adb042_36_0.png)'
