    # PREFACE


    ![](img/499f221b8a09437d769a5954e5adb042_81_0.png)


    At 11:39 AM EST on January 28, 1986, just 73.124 seconds after launch and at an
    altitude of 48,000 feet, the Space Shuttle Challenger was torn to smithereens
    by the failure of the right-hand solid rocket booster (SRB). Seven brave astronauts,
    including high school teacher Christa McAuliffe, were lost. The expression on
    the face of McAuliffe''s mother as she watched the demise of her daughter nine
    miles overhead haunts me to this day.


    The Challenger broke up because hot exhaust gasses in the failing SRB leaked out
    from between the segments of its hull, splashing across the body of the external
    fuel tank. The bottom of the main liquid hydrogen tank burst, igniting the fuel
    and driving the tank forward to smash into the liquid oxygen tank above it. At
    the same time the SRB detached from its aft strut and rotated around its forward
    strut. Its nose punctured the liquid oxygen tank. These aberrant forces forced
    the entire craft, moving well above mach 1.5, to rotate against the airstream.
    Aerodynamic forces quickly tore everything to shreds.


    Between the circular segments of the SRB there were two concentric synthetic rubber
    O-rings. When the segments were bolted together the O-rings were compressed, forming
    a tight seal that the exhaust gases should not have been able to penetrate.


    But on the evening before the launch, the temperature on the launch pad got down
    to 17°F, 23 degrees below the O-rings'' minimum specified temperature and 33 degrees
    lower than any previous launch. As a result, the O-rings grew too stiff to properly
    block the hot gases. Upon ignition of the SRB there was a pressure pulse as the
    hot gases rapidly accumulated. The segments of the booster ballooned and relaxed
    the compression on the O-rings. The stiffness of the O-rings prevented them from
    keeping the seal tight, so some of the hot gasses leaked through and vaporized
    the O-rings across 70 degrees of arc.


    The engineers at Morton Thiokol who designed the SRB had known that there were
    problems with the O-rings, and they had reported these problems to managers at
    Morton Thiokol and NASA seven years earlier. Indeed, the O-rings from previous
    launches had been damaged in similar ways, though not enough to be catastrophic.
    The coldest launch had experienced the most damage. The engineers had designed
    a repair for the problem, but implementation of that repair had long delayed.


    The engineers suspected that the O-rings stiffened when cold. They also knew that
    temperatures for the Challenger launch were colder than any previous launch and
    well below the red-line. In short, the engineers knew that the risk was too high.
    The engineers acted on that knowledge. They wrote memos raising giant red flags.
    They strongly urged Thiokol and NASA managers not to launch. In an eleventh-hour
    meeting held just hours before the launch, those engineers presented their best
    data. They raged, and cajoled, and protested. But in the end, the managers ignored
    them.


    When the time for launch came, some of the engineers refused to watch the broadcast
    because they feared an explosion on the pad. But as the Challenger climbed gracefully
    into the sky they began to relax. Moments before the destruction, as they watched
    the vehicle pass through Mach 1, one of them said they’d “dodged a bullet.”


    Despite all the protest and memos, and urgings of the engineers, the managers
    they knew better. They thought the engineers were overreacting. They didn’t trust
    the engineers’ data or their conclusions. They launched because they were under
    immense financial and political pressure. They *hoped* everything would be fine.


    These managers were not merely foolish, they were criminal. The lives of seven
    good men and women, and the hopes of a generation looking toward space travel,
    were dashed on cold morning because those managers set their own fears, hopes,
    and intuitions above the words of their own experts. They made a decision they
    had no right to make.


    # PREFACE


    ## ABOUT THIS BOOK


    This book is about professionalism. It contains a lot of pragmatic advice to answer
    questions such as:


    - What is a professional?

    - How does a professional behave?

    - How does a professional deal with conflict, tight schedules, and unreasonable
    managers?

    - When and how, should a professional say “no”?

    - How does a professional deal with pressure?


    But in the pragmatic advice in this book you will find an attitude struggling
    through. It is an attitude of honesty, of honor, of self-respect, and pride. It
    is a willingness to be a craftsman and an engineer. It includes working well and
    working clean. It includes communicating well and estimating. It includes managing
    your time and facing difficult decisions.


    # BIBLIOGRAPHY


    [McConnell87]: Malcolm McConnell, Challenger ''A Malfunction’, New York, NY: Simon
    & Schuster, 1987


    [Wiki-Challenger]: “Space Shuttle disaster,” http://en.wikipedia.org/wiki/Space_Challenger_disaster


    # ACKNOWLEDGMENTS


    My career has been a series of collaborations and schemes. Though Ive had many
    private dreams and aspirations, I always seemed to find someone to share with
    them. In that sense I feel a bit like the Sith, “Always two there are."


    The first collaboration that I could consider professional was with John Marchese
    at the age of 13. He and I schemed about building computers together. I was the
    brains and he was the brawn. I showed him where to solder a wire and he soldered
    it. I showed him where to mount a relay and he mounted it. It was a load of fun,
    and we spent hundreds of hours at it. In fact, we built quite a very impressive-looking
    objects with relays, buttons, lights, even Teletypes!


    .


    In my freshman year of high school I met Tim Conrad in my German class. Tim was
    smart. When we teamed up to build a computer, he was the brains and I the brawn.
    He taught me electronics and gave me my first introduction to a PDP-8. He and
    I actually built a working 18-bit binary calculator out of basic components. It
    took us a year of weekends and all of spring, summer, and Christmas breaks. We
    worked furiously on it. In the end, it worked nicely.

