    ## OVERTIME


    So your boss says, "What if you work extra hours? What if you work on Saturday?"
    Overtime can work, and sometimes it is necessary. But this is very risky. It will
    certainly fail if it goes for more than two weeks. Therefore you should not agree
    to overtime unless (1) you can personally afford it, (2) it is short term, and
    (3) your boss has a fall-back plan. That last criterion is a deal breaker. If
    your boss cannot articulate to you what if overtime fails, then you should not
    agree.


    ## FALSE DELIVERY


    All of the unprofessional behaviors that a programmer could indulge in, perhaps
    the worst of all is saying you are done when you know you aren’t. Sometimes this
    is just an overt lie, and that’s bad enough. But the far more insidious case is
    when we manage to rationalize a new definition of “done.” We convince ourselves
    that we are done enough, and move on to the next task. We rationalize that any
    work that remains can be dealt with later when we have time.


    This is a contagious practice. If one programmer does it, others will see and
    follow suit. One of them will stretch the definition of “done” even more, and
