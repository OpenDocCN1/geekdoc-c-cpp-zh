    I fixed the problem, of course, but never had the courage to turn off the automatic
    hack that inspected and fixed the counters. To this day I''m not convinced there
    wasn''t another hole.


    ## DEBUGGING TIME


    For some reason software developers don''t think of debugging time as coding time.
    They think of debugging time as a call of nature, something that just has to be
    done. Debugging time is just as expensive as the business as coding time is, and
    therefore anything we can do to avoid or diminish it is good.


    Nowadays I spend much less time debugging than I did ten years ago. I haven''t
    measured the difference, but I believe it''s about a factor of ten. I achieved
    this truly radical reduction in debugging time by adopting the practice of Test
    Driven Development (TDD), which we''ll be discussing in another chapter.


    Whether you adopt TDD or some other discipline of equal efficacy,¹ is incumbent
    upon you as a professional to reduce your debugging time as close to zero as you
    can get. Clearly zero is an asymptotic goal, but it is the goal nonetheless.


    Doctors don''t like to reopen patients to fix what they did wrong. Lawyers don''t
    like to retry cases that they fubbed up. A doctor or lawyer who had that often
    would not be considered professional. Likewise, a software developer who creates
    many bugs is acting unprofessionally.


    ## PACING YOURSELF


    Software development is a marathon, not a sprint. You can''t win the race trying
    to run as fast as you can from the outset. You win by conserving your resources
    and pacing yourself. A marathon runner takes care of her body before and during
    the race. Professional programmers conserve their energy and creativity with the
    same care.


    - 3. I don''t know of any discipline that is as effective as TDD, but perhaps
    you do.


    ## CHAPTER 4 CODING


    ## KNOW WHEN TO WALK AWAY


    Can''t go home till you solve this problem? Oh yes you can, and you probably should!
    Creativity and intelligence are fleeting states of mind. When you are tired, you
    will go away. If you pound your nonfunctioning brain for hour after late-night
    hour trying to solve a problem, you''ll simply make yourself more tired and reduce
    the chance that the shower, or the car, will help you solve the problem.


    When you are stuck, when you are tired, disengage for awhile. Give your creative
    subconscious a crack at the problem. You will get more done in less time and with
    less effort if you are careful to your resources. Pace yourself, and your team.
    Learn your patterns of creativity and brilliance, and take advantage of them rather
    than work against them.


    ## DRIVING HOME


    One place that I have solved a number of problems is my car on the way home from
    work. Driving requires a lot of noncreative mental resources. You must dedicate
    your eyes, hands, and portions of your mind to the task; therefore, you must disengage
    from the problems at work. There is something about disengagement that allows
    your mind to hunt for solutions in a different and more creative way.


    ## THE SHOWER


    I have solved an inordinate number of problems in the shower. Perhaps the spray
    of water early in the morning wakes me up and gets me to review all the solutions
    that my brain came up with while I was asleep.


    When you are working on a problem, you sometimes get so close to it that you can''t
    see all the options. You miss elegant solutions because the creative part of your
    mind is suppressed by the intensity of your focus. Sometimes the best way to solve
    a problem is to go home, eat dinner, watch TV, go to bed, and then wake up the
    next morning and take a shower.


    ## BEING LATE


    You will be late. It happens to the best of us. It happens to the most dedicated
    of us. Sometimes we just blow our estimates and wind up late.


    The trick to managing lateness is early detection and transparency. The worst
    case scenario occurs when you continue to tell everyone, up to the very end, that
    you will be on time—and then let them all down. Don''t do this. Instead, regularly
    measure your progress against your goal, and come up with three fact-based end
    dates: best case, nominal case, and worst case. Be as honest as you can be about
    all three dates. Do not incorporate hope into your estimates! Present all three
    numbers to your team and stakeholders. Update your numbers daily.


    ## HOPE


    If these numbers show that you might miss a deadline? For example, let''s say
    there''s a trade show in ten days, and we need to have our product ready. But
    let''s also say your three-number estimate for the feature you are working on
    is 8/12/20.


    > Do not hope that you can get it all done in ten days! Hope is the project killer.
    Hope destroys schedules and ruins reputations. Hope will get you into deep trouble.
    If the trade show is in ten days, and your nominal estimate is 12, you are not
    going to make it. Make sure that the team and the stakeholders understand the
    situation, and don''t let until there is a fall-back plan. Don''t let anyone else
    hope.


    ## RUSHING


    What if your manager sits you down and asks you to try to make the deadline? What
    if your manager insists that you “do what it takes”? Hold to your estimates! Your
    original estimates are more accurate than any changes you make while your boss
    is confronting you. Tell your boss that you''ve already considered the options
    (because you have) and that the only way to improve the schedule is to reduce
    scope. Do not be tempted to rush.


    Woe to the poor developer who buckles under pressure and agrees to try to make
    the deadline. This is a recipe for disaster. It allows everyone to slow down.


