    # Foreword


    Even in the auto industry, the bulk of the work lies in manufacturing but in maintenance—or
    its avoidance. In software, 80% or more of what we do is quaintly called “maintenance”:
    the act of repair. Rather than embracing the typical Western focus on producing
    software, we should be thinking more like home repair in the building industry,
    or auto mechanics in the automotive field. What does Japanese management have
    to say about that?


    In about 1951, a quality approach called Total Productive Maintenance (TPM) came
    onto the Japanese scene. It is maintenance rather than on production. One of the
    major pillars of TPM is the so-called 5S principles. 5S is a set of disciplines—and
    I use the term “discipline” instinctively. These 5S principles are in fact at
    the foundation of Lean—another buzzword on the Western scene, and an increasingly
    prominent buzzword in software circles. These principles are not an option. Uncle
    Bob relates in his front matter, software practice requires discipline: focus,
    presence, and thinking. It is not just about doing, but pushing the factory equipment
    to produce at the optimal velocity. The 5S philosophy comprises these concepts:


    - Seiri, or organization (think “sort” in English). Knowing things are—using approaches
    as suitable naming—is crucial. You naming identifiers isn''t important? Read on
    in the following chapters.

    - Seiton, or tidness (think “systematize” in English). There is an old American
    saying: A place for everything, and everything in its place. A piece of code should
    be where you expect to find it—and, if not, you should refactor to get it here.

    - Seiso, or cleaning (think “shine” in English): Keep the workplace free of hanging
    wires, gears, scraps, and waste. What do the authors say about littering your
    code with comments and commented-out code lines that capture history or wishes
    for the future? Get rid of them.

    - Seetsu, or standardization: The group agrees about how to keep the workplace
    clean. Do you think this says anything about having a consistent coding style
    and set of practices within the group? Where do these standards come from? Read
    on.

    - Shutuke, or discipline (self-discipline). This means having the discipline to
    follow the practices and frequently reflect on one’s work and be willing to change.


    If you take up the challenge—yes, the challenge—of reading and applying this book,
    you’ll come to understand and appreciate the last point. We are finally drawing
    to the level of responsible professionalism in a profession that should be concerned
    with the life cycle of a product. As we maintain automobiles and other machines
    under TPM, breakdown maintenance—waiting for bugs to surface—is the exception.
    Instead, we go up inspect the machines every day and fix wearing parts before
    they break, or do the equivalent of the proverbial 10,000-mile oil change to prevent
    wear and tear. In code, refactor mercilessly. You can improve yet one level further,
    as the TPM movement innovated over 50 years ago: build machines that are more
    maintainable in the first place. Making your code readable is as important as
    making it executable. The ultimate practice, introduced in TPM circles around
    1960 is to focus on introducing new machines or replacing old ones. As Fred Brooks
    admonishes us, we should probably re-do major software chunks from scratch every
    seven years or so to sweep away creeping rot. Perhaps we update Brooks’ time constant
    to an order of weeks, days or hours instead of years. That’s where detail lies.


    There is great power in detail, yet there is something humble and profound about
    the approach to life, as most stereotypically expect from any approach that claims
    Japanese roots. This is not only an Eastern outlook on life; English and American
    folk wisdom are full of such admonments. The Seiton quote from above flowed from
    the pen of an Ohio minister who viewed attentiveness “as a remedy for every degree
    of evil.” How about Seiso? Cleanliness is next to godliness. As beautiful as a
    house is, a messy desk ruins its splendor. Who is faithful in little is much.
    How about being eager to re-factor at the responsible time, strengthening one
    position for “big” decisions, rather than putting it off? A stitch in time saves
    nine. The early bird catches the worms. Don’t put off until tomorrow what you
    can do today (Such was the origin of the phrase “the last moment in Lean until
    it fills the hands of software consultants.”) How about calibrating the place
    of soul, individual efforts in a grand world? Mighty from little corners grow.
    Or about integrating preventive work into everyday life? An ounce of prevention
    is worth a pound of cure. An apple keeps the doctor away. Clean code honors the
    deep wisdom beneath our broader culture, or as it once was, or should be, and
    can be with attentiveness to detail.


    Even in the grand architecture we find that facts care back to these suggested
    details. Think of Mies van der Rohe knobs. That’s being attentive to every variable
    name. You should name a variable using the same care with which you name a first-born
    child.


    As every homeowner knows, such care and ongoing refinement never come to an end.
    The architect Alexander—father of patterns and pattern languages—views every act
    of design as a small, local act of repair. And we view the craftsmanship of fine
    structure to be the sole purview of the architect; larger forms can be left to
    patterns and their application by the inhabitants. Design is engaging not only
    as we add a new room to a house, but as we are attentive to repairing, replacing
    worn carpets, or upgrading the kitchen sink. Most arts echo sentiments. In our
    search for others who aspire God’s home as being in the details, we find ourselves
    in the good company of the 19th century French author Gustav Flaubert. The French
    poet Paul Valery advises us that a poem is never done and bears until rework,
    and to stop working on it is abandonment. Such preoccupation with detail is common
    to all endeavors of excellence. So maybe there is little new here, but by reading
    this book you will be challenged to take up good disciplines that long ago surrendered
    to apathy or a desire for spontaneity and “responding to change.”


    Unfortunately, we don’t see much concerns cornerstones of the art early, not because
    it is done, but because our value system focuses more on outward appearance than
    the substance of what we deliver.


    Inattentiveness costs us in the end: A bad penny always shows up. Research, neither
    in industry nor academia, humbles itself to the lowly station of keeping code
