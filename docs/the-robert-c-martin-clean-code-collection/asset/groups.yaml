    ### THE FLOW ZONE


    (Wait, the text repeats the chapter title, proceeding to the section)


    ### THE FLOW ZONE


    Much has been written about the hyper-productive state known as “flow.” Some programmers
    call it the “Zone.” Whatever it is called, you are probably familiar with it.
    It is the highly focused, tunnel-vision state of consciousness that programmers
    can get into while they write code. In this state they feel productive. In this
    state they feel infallible. And so they desire to attain that state, and often
    measure their self-worth by how much time they can spend there.


    Here’s a little hint from someone who''s been there and back: Avoid the Zone.
    This state of consciousness is not really hyper-productive and is certainly not
    infallible. It’s just a mild meditative state in which rational faculties are
    diminished in favor of a sense of speed.


    Let me be clear about this. You will write more code in the Zone. If you are practicing
    TDD, you will go around the red/green/refactor loop more quickly. And you will
    feel a mild euphoria or a sense of purpose. The problem is that you lose some
    of the big picture while you are in the Zone, so you will likely make decisions
    that you will later have to go back and revert. Code written in the Zone may come
    out faster, but you will be going back to visit it more.


    Nowadays one of the big benefits of pairing is that it is virtually impossible
    for a pair to enter the Zone. The Zone is an uncommunicative state, while pairing
    requires intense communication. Indeed, one of the complaints I often hear about
    pairing is that it blocks entry into the Zone. Good! The Zone is not where you
    want to be.


    Well, that’s not quite true. There are times when the Zone is exactly where you
    want to be. When you are practicing. But we’ll talk about that in another chapter.


    ### MUSIC


    At Teradyne, in the late ''70s, I had a private office. I was the system administrator
    of our PDP11/60, and so I was one of the few programmers allowed to have a private
    terminal. That terminal was a VT100 running at 9600 baud and connected to PDP11
    with 80 feet of RS232 cable I strung over the ceiling tiles from my office to
    the computer room.


    I had a stereo system in my office. It was an old turntable, amp, and floor speakers.
    I had a significant collection of vinyl, including Led Zeppelin, Pink Floyd, and...
    Well, you get the picture.


    I used to crank stereo and then write code. I thought it helped my concentration.
    But I was wrong.


    One day I went back into a module I had been editing while listening to the opening
    sequence of The Wall. The comments in that contained lyrics from the piece, and
    editorial notations about dive bombers and crying babies.


