    # ACKNOWLEDGMENTS


    Of course, the greatest collaborator of my life has been my lovely wife, Ann Marie.
    I married her when I was 20, three days after she turned 18. For 38 years she
    has been my steady companion, my rudder and sail, my love and my life. I look
    forward to another decades with her.


    And now, with my collaborators and scheming partners are my children. I work closely
    with my eldest daughter Angela, my lovely mother hen and intrepid assistant. She
    keeps me on the straight and narrow and never lets me forget a date or commitment.
    I scheme business plans with my son Micah, the founder of 8th Light. His head
    for business is far better than mine was. My younger son Justin has started working
    with Micah at 8th Light. My younger daughter Gina is a chemical engineer working
    for Honeywell. With those two, the serious scheming has just begun!


    No one in your life will teach you more than your children will. Thanks, kids!


    # ABOUT THE AUTHOR


    ![](img/499f221b8a09437d769a5954e5adb042_91_0.png)


    Robert C. Martin (“Uncle Bob”) has been a programmer since 1970. He is founder
    and president of Object Mentor, Inc., an international firm of highly experienced
    software developers and managers who specialize in helping get projects projects
    done.. offers process improvement consulting, object-oriented software design
    consulting, training, and skill development services to major corporations worldwide.


    Martin has published dozens of articles in various trade journals and is a regular
    speaker at international conferences and trade shows.


    He has authored and edited many books, including:


    - Designing Object Oriented C++ Applications Using the Booch Method

    - Patterns Languages of Program Design 3

    - More C++ Gems

    - Extreme Programming in Practice

    - Agile Software Development: Principles, Patterns, and Practices

    - UML for Java Programmers

    - Clean Code


    A leader in the industry of software development, Martin served for three years
    as editor-in-chief of the C++ Report, and he served as the first chairman of the
    Agile Alliance.


    Robert is also the founder of Uncle Bob Consulting, LLC, and cofounder with his
    son Micah Martin of The Clean Coders LLC.

