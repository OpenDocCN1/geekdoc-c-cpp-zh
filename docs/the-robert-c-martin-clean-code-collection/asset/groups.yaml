    # Clean Code


    ![](img/499f221b8a09437d769a5954e5adb042_33_0.png)


    You are reading this book for two reasons. First, you are a programmer. Second,
    you want to be a better programmer. Good. We need better programmers.


    # Chapter 1: Clean Code


    This is a book about good programming. It is filled with code. We are going to
    look at code from every different direction. We''ll look down at it from the top,
    up at it from the bottom, and through it from the inside. By the time we''re done,
    you''re going to know a lot about code. What''s more, we''ll be able to tell the
    difference between good code and bad code. We''ll know how to write good code.
    And we''ll know how to transform bad code into good code.


    # There Will Be Code


    One might argue that a book code is somehow behind the times—that code is no longer
    the issue; that we have suggested that we are close to the end of code. That soon
    all code will be generated instead of written. That programmers simply won''t
    be needed because business people will generate programs from specifications.


    Nonsense! We will never be rid of code, because code represents the details of
    the requirements. At some level these details cannot be ignored or abstracted;
    they have to be specified. Specifying requirements in detail that a machine can
    execute them is programming. Such a specification is code.


    I expect that the level of abstraction our languages will continue to increase.
    I also expect that the number of domain-specific languages will continue to grow.
    This will be a good thing. But it will not eliminate code. Indeed, all the specifications
    written in these higher level and domain-specific language will be code! It will
    still need to be rigorous, accurate, and so formal and detailed that a machine
    can understand and execute it.


    This will never happen. Not even humans, with all their intuition and creativity,
    have been able to create successful systems from vague feelings of their customers.
    Indeed, if the discipline of requirements specification has taught us anything,
    it is that well-specified requirements are as formal as code and can act as executable
    tests of that code!


    Remember that code is really the language in which we ultimately express the requirements.
    We may create languages that are closer to the requirements. We may create tools
    that help us parse and assemble those requirements into formal structures. But
    we will never eliminate necessary precision—so there will always be code.


    # Bad Code


    I was recently reading the preface to Kent Beck''s book Implementation Patterns.¹
    He says, "..." this book is based on a rather fragile premise: that good code
    matters.\ ..." A fragile premise? I disagree! I think that premise is one of the
    most robust, supported, and overloaded of all the premises in our craft (and I
    think Kent knows it). We know good code matters because we''ve had to deal for
    so long with its lack.


    ![](img/499f221b8a09437d769a5954e5adb042_35_0.png)


    I know of one company that, in the late 80s, wrote a killer app. It was very popular,
    and lots of professionals bought and used it. But then the release cycles began
    to stretch. Bugs were not repaired from one to the next. Load times grew and crashes
    increased. I remember the day I shut the product down in frustration and never
    used it. The company went out of business a short time after that.


    Two decades later I met one of the early employees of that company and asked him
    what happened. The answer confirmed my fears. They had rushed the product to market
    and made a huge mess in the code. As they added more and more features, the code
    got worse and worse until they could not manage it any longer. It was the bad
    code that brought the company down.


    Have you been significantly impeded by bad code? If you are a programmer of any
    experience you''ve felt this impediment many times. Indeed, we have a name for
    it. We call it wading. We waded through bad code. We slog through a morass of
    tangled branches and hidden pitfalls. We struggle to find our way, hoping for
    some hint, of what is going on; but all we see is more and more senseless code.


    Of course you have been impeded by bad code. So then—why did you write it? Were
    you trying to go fast? Were you in a rush? Probably so. Perhaps you felt that
    you didn''t have time to do a good job; that your boss would be angry with you
    if you took the time to clean up your code. Perhaps you just tired of working
    on this program and wanted it to be over. Or maybe you looked at the backlog of
    other stuff that you had promised to get done and realized that you needed to
    slam this module together so you could move on to the next. We''ve all done it.


    We''ve all looked at the mess we''ve just made and then chosen to leave it for
    another day. We''ve all felt the relief of seeing our messy program work and deciding
    that a working mess is better than nothing. We''ve all said we''d go back and
    clean it up later. Of course, in those days we didn''t know LeBlanc''s law: Later
    equals never.


    ¹ 1. [Beck07].


    If you have been a programmer for more than two or three years, you have probably
    been significantly slowed down by someone else''s messy code. If you have been
    a programmer for longer than two or three years, you have probably been slowed
    down by messy code. The degree of the slowdown can be significant. Over the span
    of a year or two, teams that were moving very fast at the beginning of a project
    can themselves moving at a snail''s pace. Every change they make to the code breaks
    two or three other parts of the code. No change is trivial. Every addition or
    modification to the system requires the tangles, twists, and knots to be “understood”
    so that more manages, twists, and knots can be added. Over time the mess becomes
    so big and deep that they cannot clean it up. There is no way at all.


    As the mess builds, the productivity of the team continues to decrease, asymptotically
    approaching zero. As productivity decreases, management does the only thing they
    can; they add more staff to the project in hopes of increasing productivity. But
    that new staff is not versed in the design of the system. They don''t know the
    difference between a change that matches the design intent and a change that thwarts
    the design intent. Furthermore, they, and everyone else on the team, under horrific
    pressure to increase productivity. So they all make more and more messes, driving
    the productivity ever further zero. (See Figure 1-1).


    ![](img/499f221b8a09437d769a5954e5adb042_36_0.png)


    # The Total Cost of Owning a Mess


    # The Grand Redesign in the Sky


    Eventually the team rebels. They inform management that they cannot continue to
    develop in odious code. They demand a redesign. Management does not want to expend
    the resources on a whole redesign of the project, but they cannot deny that productivity
    is terrible. Eventually they bend to the demands of the developers and authorize
    the grand redesign in the sky.


    A new tiger team seems. Everyone wants to be on this team because it''s a green-field
    project. They get to start and create something beautiful. But only the best and
    brightest are chosen for the tiger team. Everyone else must continue to maintain
    the current system.


    Now the two teams are in a race. The tiger team must build a new system that does
    everything the old system does. Not only, they have to keep up with the changes
    that are continuously made to the old system. Management will not replace the
    old system until the new system can do everything the old system does.


    This race goes on a very long time. I''ve seen it take 10 years. And by the time
    it''s done, the original members of the tiger team are long gone, and the current
    members are demanding that the new system be redesigned because it''s such a mess.


    If you have experienced even one small part of the story I told, then you already
    know that keeping your clean code is not cost effective; it''s a matter of professional
    survival.


    # Attitude


    Have you ever waded through a mess so great that it takes weeks to do what should
    have taken hours? Have you seen what should have been a one-line change, made
    instead in hundreds of different modules? These symptoms are all too common.


    Why does this happen to code? Why does good code so quickly into bad code? We
    have lots of explanations for it. We complain that the requirements changed in
    ways that thwart the original design. We bemoan the changes that were too tight
    to do things right. We blather about stupid managers and intolerant customers
    and useless marketing types and telephone supporters. But the fault, dear Dilbert,
    is not in stars, but in ourselves. We are unprofessional.


    This may be a bitter pill to swallow. How could this mess be our fault? What about
    the requirements? What about the schedule? What about the stupid managers and
    the useless marketing types? Don''t they bear some of the blame?


    No. The managers and marketers look to us for the information they need to make
    promises and commitments; and even when they don''t look to us, we should not
    be shy about telling them what we think. The users look to us to validate the
    way requirements fit into the system. The project managers look to us to help
    work out the schedule.

    '
