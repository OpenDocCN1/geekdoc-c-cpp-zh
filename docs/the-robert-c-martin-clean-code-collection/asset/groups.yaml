    \nPRENTICE HALL\nUpper Saddle River, NJ • Boston • Indianapolis • San Francisco\n\
    New York • Toronto • Montreal • London • Munich • Paris • Madrid\nCape Town •\
    \ Sydney • Tokyo • Singapore • Mexico City\n\n# Note from the Publisher\n\nThe\
    \ Robert C. Martin Clean Code Collection consists of two bestselling eBooks:\n\
    \n- Clean Code: A Handbook of Agile Software Craftsmanship\n- The Clean Coder:\
    \ A Code of Conduct for Professional Programmers\n\nIn this collection, Robert\
    \ C. Martin, also known as \"Uncle Bob,\" provides a pragmatic method for writing\
    \ better code from the start. He reveals the disciplines, techniques, tools, and\
    \ practices that separate software craftsmen from mere \"9-to-5\" programmers.\
    \ Within this collection are the tools and methods you need to become a true software\
    \ professional.\n\nTo simplify access to each book, we've appended \"A\" to the\
    \ pages of Clean Code: A Handbook of Agile Software Craftsmanship, and \"B\" to\
    \ pages of The Clean Coder: A Code of Conduct for Professional Programmers. This\
    \ enabled us to produce a single, comprehensive table of contents and dedicated\
    \ indexes.\n\nWe hope you find this collection useful!\n\nThe editorial and production\
    \ teams at Prentice Hall\n\nMany of the designations used by manufacturers and\
    \ sellers to distinguish their products are claimed trademarks. Where those designations\
    \ appear in this book, and the publisher was aware of a trademark claim, the designations\
    \ have been printed with initial capital letters or in all capitals.\n\nThe author\
    \ and publisher have taken care in the preparation of this book, but make no expressed\
    \ or implied warranty of any kind and assume responsibility for errors or omissions.\
    \ No liability is assumed for incidental or consequential damages in connection\
    \ with or arising out of the use of the information or programs herein.\n\nThe\
