    every detail of that solution while remaining consistent within the language,
    platform, current architecture, and all the warts of the current system.


    +   2. Your code must solve the problem set for you by the customer. Often the
    customer''s requirements do not actually solve the customer''s problems. It is
    up to you to see this and negotiate with the customer to ensure that the customer''s
    true needs are met.


    +   3. Your code must fit well into the existing system. It should not increase
    the rigidity, fragility, or opacity of that system. The dependencies must be well-managed.
    In short, your code needs to follow solid engineering principles.


    +   4. Your code must be readable by other programmers. It is not simply a matter
    of writing nice comments. Rather, it requires that you craft the code in such
    a way that reveals your intent. This is hard to do. Indeed, this will be the most
    difficult thing a programmer master.


