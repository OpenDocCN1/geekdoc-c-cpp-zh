- md: '

    Twelve months later I achieved that goal. I was promoted to a full-time programmer
    at ASC. I, and two of my good friends, Richard and Tim, also 19, worked with a
    team of three other programmers writing a real-time accounting system for a teamster''s
    union. The machine was a Varian 620i. It was a simple mini-computer similar in
    architecture to a PDP-8 except that it had a 16-bit word and two registers. The
    language was assembler.


    We wrote every line of code in that system. And I mean every line. We wrote the
    operating system, the interrupt handlers, the IO drivers, the file system for
    the disks, the overlay swapper, and even the relocatable linker. To not mention
    all the application code. We wrote all in this 8 months working 70 and 80 hours
    a week to meet a hellish deadline. My salary was $7,200 per year.


    We delivered that system. And then we quit.


    We quit suddenly, and with malice. You see, after all that work, and after having
    delivered a successful system, the company gave us a 2% raise. We felt cheated
    and abused. Several of us got jobs elsewhere and simply resigned.


    I, however, took a different, and very unfortunate, approach. I and a buddy stormed
    into the boss''s office and quit together rather loudly. This was emotionally
    very satisfying—for a day.


    The next day it hit me that I did not have a job. I was 19, unemployed, with no
    degree. I interviewed for a few programming positions, but those interviews did
    not go well. So I worked in my brother-in-law''s lawnmower repair shop for four
    months. Unfortunately I was a lousy lawnmower repairman. He eventually had to
    let me go. I fell into a nasty funk.


    I stayed up till 3 AM every night eating pizza and watching old monster movies
    on my parents'' old black-and-white, rabbit-ear TV. Only some of the ghosts were
    characters in the movies. I stayed in bed till 1 PM because I didn''t want to
    face my dreary days. I took a calculus course at a local community college and
    failed it. It was a wreck.


    # PRE-QUISITE INTRODUCTION


    My mother took me aside and told me that my life was a mess, and that I had been
    an idiot for quitting without having a new job, and for quitting emotionally,
    and for quitting together with my buddy. She told me that you never quit without
    having a new job, and you always quit calmly, coolly, and alone. She told me that
    I should call my old boss and beg for my old job back. She said, "You need to
    eat some humble pie."


    Nineteen-year-old boys are not known for their appetite for humble pie, and I
    was no exception. But the circumstances had taken their toll on my pride. In the
    end I called my boss and took a big bite of humble pie. And it worked. He was
    happy to re-hire me for $6,800 per year, and I was happy to take it.


    I spent another eighteen months working, watching the Ps and Qs and trying to
    be as valuable an employee as I could. I was rewarded with promotions and raises,
    and a regular paycheck. Life was good. When I left the company, it was on good
    terms, and with an offer for a better job in my pocket.


    You might think that I had learned my lesson; that I was now a professional. Far
    from it. That was just the first of many lessons I needed to learn. In the coming
    years I would be fired from still another for carelessly missing critical dates,
    and nearly fired from still another for inadvertently leaking confidential information
    to a customer. I would take the lead on a doomed project and ride it into the
    ground without calling for the help I knew I needed. I would aggressively defend
    my technical decisions even the though they flew in the face of the customers''
    needs. I would hire one wholly unqualified person, saddling my employer with a
    huge liability to deal with. And worst of all, I would get two other people fired
    because of my inability to lead.


    So think of this book as a catalog of my own errors, a blotter of my own crimes,
    and a set of guidelines for you to avoid walking in my early shoes.


    ![](img/499f221b8a09437d769a5954e5adb042_101_0.png)


    ![](img/499f221b8a09437d769a5954e5adb042_101_1.png)


    In a previous book¹ I wrote a great deal about the structure and nature of *Clean
    Code*. This chapter discusses the act of coding, and the context that surrounds
    that act.


    When I was 18 I could type reasonably well, but I had to look at the keys. I could
    not type blind. So one evening I spent a few hours at an IBM 029 keypunch refusing
    to look at my fingers as I typed a program that I had written on several coding
    forms. I examined each card after I had typed it and discarded those that were
    typed wrong.


    - 1. [Martin09]


    # CHAPTER 4 CODING


    At first I typed quite a few in error. By the end of the evening, I was typing
    them all with perfection. I realized, during long night, that typing blind is
    all about confidence. My fingers knew where the keys were, I just had to gain
    the confidence that I wasn''t making a mistake. One of the things that helped
    with that confidence is that I could feel when I was making an error. By the end
    of the evening, if I made a mistake, I knew it almost instantly and simply ejected
    the card without looking at it.


    Being able to sense your errors is important. Not just in typing, but in everything.
    Having error-sense means that you rapidly catch the feedback loop and learn from
    your errors all more quickly. I studied, and mastered, several disciplines since
    that day on the 029. I found that in each case the key to mastery is confidence
    and error-sense.


    This chapter describes my personal set of rules and principles for coding. These
    rules and principles are not about my code itself; they are about behavior, mood,
    and attitude while writing code. They describe my own mental, moral, and emotional
    context for writing code. These are the roots of my confidence and error-sense.


    You will likely not agree with everything I say here. After all, this is deeply
    personal stuff. In fact, you may violently disagree with some of my attitudes
    and principles. That''s OK—they are not intended to be absolute truths for anyone
    other than me. What they are is one man''s approach to being a professional coder.


    Perhaps, by studying and contemplating my own personal coding milieu you can learn
    to snatch the pebble from my hand.


    # PREPAREDNESS


    Coding is an intellectually challenging and exhausting activity. It requires a
    level of concentration and focus that few other disciplines require. The reason
    for this is that coding requires you to juggle many competing factors at once.


    - 1. First, your code must work. You must understand what problem you are solving
    and understand how to solve that problem. You must ensure that the code you write
    is a faithful representation of that solution. You must manage every detail of
    that solution while remaining consistent within the language, platform, current
    architecture, and all the warts of the current system.


    - 2. Your code must solve the problem set for you by the customer. Often the customer''s
    requirements do not actually solve the customer''s problems. It is up to you to
    see this and negotiate with the customer to ensure that the customer''s true needs
    are met.


    - 3. Your code must fit well into the existing system. It should not increase
    the rigidity, fragility, or opacity of that system. The dependencies must be well-managed.
    In short, your code needs to follow solid engineering principles.


    - 4. Your code must be readable by other programmers. It is not simply a matter
    of writing nice comments. Rather, it requires that you craft the code in such
    a way that reveals your intent. This is hard to do. Indeed, this will be the most
    difficult thing a programmer master.


    Juggling all these concerns is hard. It is physiologically difficult to maintain
    the necessary concentration and focus for long periods of time. Add to this the
    problems and distractions of working in a team, in an organization, and the cares
