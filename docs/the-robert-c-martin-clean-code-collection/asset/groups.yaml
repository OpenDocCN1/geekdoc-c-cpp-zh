    # ON THE COVER


    ![](img/499f221b8a09437d769a5954e5adb042_93_0.png)


    The stunning image on the cover, reminiscent of Sauron''s eye, is M1, the Crab
    Nebula. M1 is located in Taurus, about one degree to the right of Zeta Tauri,
    the star at the tip of the bull''s left horn. The crab nebula is the remnant of
    a supernova that blew its guts all over the sky on the rather auspicious date
    of July 4th, 1054 AD. At a distance of 6500 light years, that explosion appeared
    to Chinese observers as a new star, roughly as bright as Jupiter. Indeed, it was
    visible during the day! Over the next six months it slowly faded from naked-eye
    view.


    The cover image is a composite of visible and x-ray light. The visible image was
    taken by the Hubble telescope and forms the outer envelope. The inner object that
    looks like a blue archery target was taken by the Chandra x-ray telescope.


    The visible image depicts a rapidly expanding cloud of dust and gas laced with
    heavy elements left over from the supernova explosion. That cloud is now 11 light-years
    in diameter, weighs at 4.5 solar masses, and is expanding at the furious rate
    of 1500 kilometers per second. The kinetic energy of that old explosion is impressive
    to say the least.


    At the very center of the target is a bright blue dot. That''s where the pulsar
    is. It was the formation of the pulsar that caused the star to blow up in the
    first place. Nearly a solar mass of material in the core of the doomed star imploded
    into a sphere of neutrons about 30 kilometers in diameter. The kinetic energy
    of that implosion, coupled with the incredible barrage of neutrinos created when
    all those neutrons formed, ripped the star open, and blew it to kingdom.


    The pulsar is spinning about 30 times per second; and it flashes as it spins.
    We can see it blinking in our telescopes. Those pulses of light are the reason
    we call it a pulsar, which is short for Pulsating Star.


    ## PRE-REQUISITE INTRODUCTION


    (Don''t skip this, you''re going to need it.)


    ![](img/499f221b8a09437d769a5954e5adb042_95_0.png)


    I presume you just picked up this book because you are a computer programmer and
    are intrigued by the notion of professionalism. You should be. Professionalism
    is something that our profession is in dire need of.


    I''ve been a programmer for 42 years; and in that time—let me tell you—I''ve seen
    it all. I''ve been fired. I''ve been lauded. I''ve been a team leader, a manager,
    a grunt, and even a CEO. I''ve worked with brilliant programmers I''ve worked
    with slugs. I''ve worked on high-tech cutting-edge embedded software/hardware
    systems, and I''ve worked on corporate payroll systems. I''ve programmed in COBOL,
    FORTRAN, BAL, PDP-8-11, C++, Java, Ruby, Smalltalk, and a plethora of other languages
    and systems. I''ve worked with untrustworthy paycheck thieves, and I''ve worked
    with consummate professionals. It is that last classification that is the topic
    of this book.


    In the pages of this book I will try to define what it means to be a professional
    programmer. I will describe the attitudes, disciplines, and actions that I consider
    to be essentially professional.


    How do I know what these attitudes, disciplines, and actions are? Because I had
    to learn them the hard way. See, when I got my first job as a programmer, professional
    was the last word you would have used to describe me.


    The year was 1969. I was 17. My father had badgered a local business named ASC
    into hiring me as a temporary part-time programmer. (Yes, my father could do things
    like that. I once watched him walk out in hand commanding it to “Stop!” The car
    stopped. Nobody said “no” to my Dad.) The company put me to work in the room where
    all the IBM computer manuals were kept. They had me put years and years of updates
    into the manuals. It was here that I first saw the phrase: “This page intentionally
    left blank.


    After a couple of days of updating manuals, my supervisor asked me to write a
    simple Easycoder'' program. I was thrilled to be asked. I had never written a
    program for a real computer before. I had, however, inhaled the Autocoder books,
    and had a vague notion of how to begin.


    - 1. A technical term of unknown origins.

    - 2. Easycoder was the assembler for the Honeywell H200 computer, which was similar
    to Autocoder for the IBM 1401 computer. 1 for each record. The records with the
    new IDs were to be written to a new tape.


    My supervisor showed me a shelf that held many stacks of red and blue punched
    cards. Imagine that you bought 50 decks of playing cards, 25 red decks, and 25
    blue decks. Then you stacked those decks one on top of the other. That''s what
    these stacks of cards looked like. They were striped red and blue, and the stripes
    were over 200 cards each. Each one of stripes contained the source code for the
    subroutine library that programmers typically used. Programmers would simply take
    the top deck off the stack, making sure that they took nothing red or blue cards,
    and then put that at the end of their program deck.


    I wrote my program on some coding forms. Coding forms were large rectangular sheets
    of paper divided into 25 lines and 80 columns. Each line represented one card.
    You wrote your program on the coding form using capital letters and a #2 pencil.
    In the last 6 columns of each line you wrote a sequence number with #2 pencil.
    Typically you incremented the number by 10 so that you could insert cards later.


    The coding form went to the key punchers. This company had several dozen women
    who took coding forms from a big in-basket, and then “typed” them into key-punch
    machines. These machines were a lot like typewriters, except that the characters
    were punched into cards instead of printed on paper.


    The next day the keypunchers returned my program to me by inter-office mail. My
    small deck of punched cards was wrapped up by my coding forms and a rubber band.
    I looked over the cards for keypunch errors. There weren''t any. So I put the
    subroutine library deck on the end of my program deck, and then took the deck
    upstairs to the computer operators. The computers were behind locked doors in
    a raised floor (for all the cables). I knocked on the door and an operator austerely
    took my deck from me and put it into in-basket inside the computer room. When
    they got around to it, they would run my deck.


    The next day I got my deck back. It was wrapped in a listing of the results of
    the run and kept together with a rubber band. (We used *lots* of rubber bands
    in days!)


    I opened the listing and saw that my compile had failed. The error messages in
    the listing were very difficult for me to understand, so I took it to my supervisor.
    He looked over it, mumbled under his breath, made some notes on the listing, grabbed
    my deck and then told me to follow him.


    He took me up the keypunch room and sat at a vacant keypunch machine. By one one
    he corrected the cards that were in error, and added one or two cards. He quickly
    explained what he was doing, but it all went like a flash.


    He took the new deck up to the computer room and knocked the door. He said some
    magic words to the operators, and walked into the computer room behind him. He
    beckoned for me to follow. The operator set up the tape drives and loaded the
    deck while we watched. The tapes spins, the printer chattered, and then it was
    over. The program had worked.


    The next day my supervisor thanked me for my help, and terminated my employment.
    Apparently ASC didn''t feel they had the time to nurture a 17-year-old.


    But my connection with ASC was hardly over. A few months later I got a full-second
    shift job at ASC operating off-line printers. These printers printed junk mail
    from images that were stored on tape. My job was to load the printers with paper,
    load the tapes into the tape drives, fix paper jams, and otherwise just watch
    the machines work.


    The year was 1970. College was not an option for me, nor did it hold any particular
    entements. The Viet Nam was still raging, and the campuses were chaotic. I had
    continued to inhale books on COBOL, Fortran, PL/1, PDP-8, and IBM 360 Assembler.
    My intent was to bypass school and drive as hard as I could to get a job programming.

