    # CHAPTER 4 CODING


    One late evening—or rather, one very early morning, in order to solve a timing
    problem—I had my code send a message to itself through the event dispatch system
    we called this (“sending mail”). This was the wrong solution, but at 3 AM it looked
    pretty damned. Indeed, after 18 hours of solid coding (not to mention the 60–70
    hour weeks) it was all I could think of.


    I remember feeling good about myself for the long hours I was working. I remember
    feeling dedicated. I remember thinking that working at 3 AM is what serious professionals
    do. How wrong I was?


    That code came back to us over and over again. It instituted a faulty design structure
    that everyone used but consistently had to work around. It caused all kinds of
    strange timing errors and odd feedback loops. We''d get infinite mail loops or
    one message caused another to be sent, and then another, infinitely. We never
    had time to rewrite this (so we thought) but we always seemed to have time to
    add wart or patch to work around it. The craft grew and grew, surprising that
    3 AM with ever more baggage and side effects. Years later it had become a team
    joke. Whenever I was tired or frustrated they said, “Look out! Bob’s about to
    send mail to himself!


    The moral of this story is: Don’t write code when you are tired. Dedication and
    professionalism are more about discipline than hours. Make sure that your sleep,
    health, and lifestyle are tuned so that you can put in eight good hours per day.


    # WORRY CODE


    Have you ever gotten into a big fight with your spouse or friend, and then tried
    to code? Did you notice that there was a background process running in your mind
    trying to resolve, or at least review the fight? Sometimes you can feel the stress
    of that background process in your chest, or in the pit of your stomach. It can
    make you feel anxious, like when you''ve had too much coffee or diet. It''s distracting.


    When I was worried about an argument with my wife, or a customer crisis, or a
    sick child, I can''t maintain focus. My concentration wavers. I find myself with
    my eyes on the screen and my fingers on the keyboard, doing nothing. Catatonic.'
