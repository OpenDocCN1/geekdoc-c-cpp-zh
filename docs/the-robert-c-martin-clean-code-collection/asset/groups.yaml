    \nPRENTICE HALL\nUpper Saddle River, NJ • 波士顿 • 印第安波利斯 • 旧金山\n纽约 • 多伦多 • 蒙特利尔\
    \ • 伦敦 • 慕尼黑 • 巴黎 • 马德里\n开普敦 • 悉尼 • 东京 • 新加坡 • 墨西哥城\n\n# 出版者说明\n\n本系列包含两本畅销电子书：\n\
    \n- 《整洁代码：敏捷软件之道》\n- 《程序员程序员准则》\n\n在本书中，罗伯特·马丁（被称为“鲍伯叔叔”）提供了一种从一开始就编写更佳代码的实用方法。他揭示了区分软件工匠与仅仅是“朝九晚五”程序员的纪律、技术、工具和实践。本系列包含了你成为真正的软件专家所需的工具和方法。\n\
