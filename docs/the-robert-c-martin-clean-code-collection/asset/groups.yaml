    # 14A


    ## 第一章：整洁代码


    噢，他删掉了他刚刚输入的内容！

    他又重写了一遍，

    他又删掉了一遍！

    他输入了其他东西的一部分，然后又删掉了！

    他滚动到另一个调用他正在修改的函数，看看它是如何被调用的。

    他向上滚动，重新输入了刚才删除的代码。

    他停顿了一下。

    他又删掉了一遍！

    他弹出的另一个窗口查看一个子类。那个函数被重写了吗？


    你明白意思了。事实上，阅读代码与编写代码的时间比例远超 10:1。

    在编写新代码的过程中，我们不断地在阅读旧代码。


    由于这个比例很高，我们希望阅读代码变得容易，即使这会让编写变得更加困难。当然，不读代码是不可能编写代码的，而让代码易于阅读会让编写变得更容易。


    这种逻辑是无法回避的。如果你无法阅读周围的代码，就无法编写代码。你今天想要编写代码是难是易，取决于周围代码的阅读难易程度。所以，如果你想运行得快，想快速完成任务，如果你希望你的代码易于编写，就让它易于阅读。


    ## 童子军法则


    仅仅写好代码是不够的。代码必须随着时间的推移而维护。我们都见过代码随时间流逝而腐化和退化。因此，我们必须积极防止这种退化。


    美国童子军有一条简单的规则，我们可以将其应用于我们的职业：


    离开营地时比你发现时更干净。³


    如果我们每次提交代码时都比取出时稍微干净一点点，代码就不会腐化。这种清理工作并不非要做什么大动作。修改一个变量名使其更好，拆分一个稍大的函数，消除一小处重复，清理一个复合
    `if` 语句。


    你能想象在一个项目中工作，而代码随着时间的推移变得越来越好吗？你认为还有其他选择是职业的吗？事实上，持续改进难道不是职业精神的内在特质吗？


    5. 本节改编自罗伯特·斯蒂芬·斯密斯·巴登-鲍威尔对童军的告别信：“努力让这个世界比你发现它时更好一点点……”


    ## 参考文献


    ## 前传与原则


    在许多方面，这本书是我在 2002 年写的《敏捷软件开发：原则、模式与实践》(PPP) 一书的“前传”。PPP 一书关注面向对象的设计原则，以及专业开发人员使用的许多实践。如果你没有读过
    PPP，你可能会发现这本书延续了那个故事。如果你已经读过它，你会发现该书中的许多观点在本书的代码层面上得到了共鸣。


    在本书中，你会发现对各种设计原则的零星引用。这包括单一责任原则 (SRP)、开闭原则 (OCP) 和依赖倒置原则 (DIP) 等。这些原则在 PPP 中有非常深入的描述。


    ## 结语


    艺术书籍并不承诺让你成为艺术家。它们能给你的只是其他艺术家使用过的某些工具、技术和思维方式。同样，这本书无法承诺给你“代码感”。它能做的只是向你展示优秀程序员的思维方式，以及他们使用的技巧、技术和工具。


    就像艺术类书籍一样，这本书将充满细节。会有大量的代码。你会看到好代码，也会看到坏代码。你会看到坏代码转化为好代码。你会看到启发式方法、准则和技术的列表。你会看到一个又一个例子。之后，就取决于你了。


    记得那个关于在去演出路上迷路的音乐小提琴家的笑话吗？他在街角拦住一位老人，问他如何去卡内基音乐厅。老人看了看小提琴家以及他腋下的的小提琴，说道：“练习，练习！”


    ## 参考文献


    [Beck07]: Implementation Patterns, Kent Beck, Addison-Wesley, 2007.


    [Knuth92]: Literate Programming, Donald E. Knuth, Center for the Study of Language
    and Information, Leland Stanford Junior University, 1992.


