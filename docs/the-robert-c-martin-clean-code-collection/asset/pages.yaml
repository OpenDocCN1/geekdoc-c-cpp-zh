  md: '# The Total Cost of Owning a Mess


    Writing clean code requires the disciplined use of a myriad techniques applied
    through a painstakingly acquired sense of “cleanliness.” This “code-sense” is
    the key. Some of us are born with it. Some of us have to fight to acquire it.
    Not only does it let us see whether code is good or bad, but also shows the strategy
    for applying our discipline to transform bad code into clean code.


    A programmer without “code-sense” can look at a messy module and recognize the
    mess but will have no idea what to do about it. A programmer with “code-sense”
    will look at a messy module and see options and variations. The “code-sense” will
    help that programmer choose the best variation and guide him or her to post a
    sequence of behavior preserving transformations to get from here to there.


    In short, a programmer who writes clean code is an artist who can clean a screen
    through a series of transformations until it is an elegantly coded system.


    # What Is Clean Code?


    There are probably as many definitions as there are programmers. So I asked some
    well-known and deeply experienced programmers what they thought.


    Bjarne Stroustrup, inventor of C++ and author of The C++ Programming Language


    ![](img/499f221b8a09437d769a5954e5adb042_39_0.png)


    I like code to be elegant and efficient. The logic should be straightforward to
    make it hard for bugs to hide, the dependencies minimal to ease maintenance, error
    handling complete according to an articulated strategy, and performance close
    to optimal so as not to tempt people to make the code messy with unprudent optimizations.
    Clean code does only one thing well.


