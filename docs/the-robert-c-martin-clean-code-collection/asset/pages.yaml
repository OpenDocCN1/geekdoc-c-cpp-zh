  md: '# Introduction


    our necks? How can we make sure we wind up the *right* door when the going gets
    tough? The answer is: *craftsmanship*.


    There are parts to learning craftsmanship: knowledge and work. You must gain the
    knowledge of principles, patterns, practices, and heuristics that a craftsman
    knows, and you must also grind that knowledge into your fingers, eyes, and by
    working hard and practicing.


    I can teach you the physics of riding a bicycle. Indeed, the classical mathematics
    is relatively straightforward. Gravity, friction, angular momentum, center of
    mass, and so forth, can be demonstrated with less than a page full of equations.
    Given those formula I could prove to you bicycle riding is practical and give
    you all the knowledge needed to make it. And you''d fall down the first time you
    climbed on that bike.


    Coding is not forward. We could write down all the “feel good” principles of clean
    code and then trust you to do the work (in other words, let you fall down when
    you get on the bike), but then what kind of teachers would make you, and what
    kind of student would make you?


    No. That’s not the way this book is to work.


    Learning to write clean code is *hard work*. It requires more than just the knowledge
    of principles and patterns. You must *sweat over it*, and watch yourself fail.
    You must watch others practice it and You must see them stumble and retract their
    steps. You must see them agonize over decisions and see the price they pay for
    making decisions the wrong way.


    Be prepared to work hard while reading this book. This is not a “feel good” book
    that you can read on an airplane and finish before you load. This book will make
    you work, and *hard work*. What kind of work will you be doing? You will be reading
    code—lots of code. And you will be asked to follow along as we take modules apart
    and put them back together again. This will take time and effort; but we think
    it will be worth it.


    We have divided this book into three parts. The first chapters describe the principles,
    patterns, and practices of writing clean code. There is quite a bit of code in
    these chapters, and they will be challenging to read. They’ll prepare for the
    second section to come. If you put the book down after reading the first section,
    good luck to you!


