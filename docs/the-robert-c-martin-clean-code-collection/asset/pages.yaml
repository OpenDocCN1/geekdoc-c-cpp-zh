    you, your team, and your stakeholders false hope. It allows everyone to avoid
    facing the issue and delays the necessary tough decisions.


    There is no way to rush. You can''t make yourself code faster. You can''t make
    yourself solve problems faster. If you try, you''ll just slow yourself down and
    a mess that slows everyone else down, too.


    So you must answer your boss, your team, and your stakeholders by depriving them
    of hope.


    # OVERTIME


    So your boss says, "What if you work an extra two hours a day? What if you work
    on Saturday? Come on, there''s just got to be a way to squeeze enough hours in
    to get the feature done on time."


    Overtime can work, and sometimes it is necessary. You can make an otherwise impossible
    date by putting in some ten-hour days, and a Saturday or two. But this is very
    risky. You are not likely to get 20% more work done by working 20% more hours.
    What''s more, overtime will certainly fail if it goes for more than two or three
    weeks.


    Therefore you should not agree to work overtime unless (1) you can personally
    afford it, (2) it is short term, two weeks or less, and (3) your boss has a fall-back
    plan in case the overtime effort fails.


    That last criterion is a deal breaker. If your boss cannot articulate to you he''s
    going to do if the overtime effort fails, then you should not agree to work overtime.


    72B'
