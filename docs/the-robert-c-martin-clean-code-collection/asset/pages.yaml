  md: '# CHAPTER 4 CODING


    One late evening—or rather, one very early morning, in order to solve a timing
    problem—I had my code send a message to itself through the event dispatch system
    we called this (“sending mail”). This was the wrong solution, but at 3 AM it looked
    pretty damned. Indeed, after 18 hours of solid coding (not to mention the 60–70
    hour weeks) it was all I could think of.


    I remember feeling good about myself for the long hours I was working. I remember
    feeling dedicated. I remember thinking that working at 3 AM is what serious professionals
    do. How wrong I was?


    That code came back to us over and over again. It instituted a faulty design structure
    that everyone used but consistently had to work around. It caused all kinds of
    strange timing errors and odd feedback loops. We''d get infinite mail loops or
    one message caused another to be sent, and then another, infinitely. We never
    had time to rewrite this (so we thought) but we always seemed to have time to
    add wart or patch to work around it. The craft grew and grew, surprising that
    3 AM with ever more baggage and side effects. Years later it had become a team
    joke. Whenever I was tired or frustrated they said, “Look out! Bob’s about to
    send mail to himself!


    The moral of this story is: Don’t write code when you are tired. Dedication and
    professionalism are more about discipline than hours. Make sure that your sleep,
    health, and lifestyle are tuned so that you can put in eight good hours per day.


    # WORRY CODE


    Have you ever gotten into a big fight with your spouse or friend, and then tried
    to code? Did you notice that there was a background process running in your mind
    trying to resolve, or at least review the fight? Sometimes you can feel the stress
    of that background process in your chest, or in the pit of your stomach. It can
    make you feel anxious, like when you''ve had too much coffee or diet. It''s distracting.


    When I was worried about an argument with my wife, or a customer crisis, or a
    sick child, I can''t maintain focus. My concentration wavers. I find myself with
    my eyes on the screen and my fingers on the keyboard, doing nothing. Catatonic.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'Paralyzed. A million miles away working through the problem in the background
    rather than actually solving the coding problem in front of me.


    Sometimes I will force myself to think about the code. I might drive myself to
    write a line or two. I might push myself to get a test or two to pass. But I can''t
    keep it up. Inevitably I find myself descending into a stupefied insensitivity,
    sensing nothing through my open eyes, inwurnly churning on the background worry.


    I have learned that this is no time to code. Any code I produce will be trash.
    So instead of coding, I need to resolve the worry.


    Of course, there are many worries that simply cannot be resolved in an hour or
    two. Moreover, our employers are not likely to tolerate our inability to work
    as we resolve our personal issues. The trick is to learn how to shut down the
    background process, or at least reduce its priority so that it''s not a continuous
    distraction.


    I do this by partitioning my time. Rather than forcing myself to code while the
    background worry is nagging at me, I will spend a dedicated block of time, perhaps
    an hour, working on the issue that is creating the worry. If my child is sick,
    I will call home and check in. If I''ve had an argument with my wife, I''ll call
    her and talk through the issues. If I have money problems, I''ll spend time thinking
    about how I can deal with the financial issues. I know I''m not likely to solve
    the problems in this hour, but it is very likely that I can reduce the anxiety
    and quiet the background process.


    Ideally the time spent wrestling with personal issues would be personal time.
    It would be a shame to spend an hour at the office this way. Professional developers
    allocate their personal time in order to ensure that the time spent at the office
    is as productive as possible. That means you should specifically set aside time
    at home to settle your anxieties so that you don''t bring them to the office.


    On the other hand, if you find yourself at the office and the background anxieties
    are sapping your productivity, then it is better to spend an hour quieting them
    than to use brute force to write code that you''ll just have to throw away later
    (or worse, live with).'
