  md: '# CHAPTER 4 CODING


    important. You can''t just slather them together and hope for the best. Rather,
    you have to carefully partition the system into small understandable units that
    have as little to do with each other as possible—and that''s hard.


    Programming is so hard, in fact, that it is beyond the capability of one person
    to do it well. No matter how skilled you are, you will willingly benefit from
    another programmer''s thoughts and ideas.


    # HELPING OTHERS


    Because of this, it is the responsibility of programmers to be available to help
    each other. It is a violation of professional ethics to sequester yourself in
    a cubicle or office and refuse the queries of others. Your work is not so important
    that you cannot lend some of your time to help others. Indeed, as a professional
    you are honor bound to offer help when it is needed.


    This doesn''t mean that you don''t need some alone. Of course you do. You have
    to be fair and polite about it. For example, you can let it known that between
    the hours of 10 AM and noon you should not be bothered, but from 1 PM to 3 PM
    your door is open.


    You should be conscious of the status of your teammates. If you see someone who
    appears to be in trouble, you should offer your help. You will likely be quite
    surprised at the profound effect your help can have. It''s not that you are so
    much smarter than the other person, it''s just that a fresh perspective can be
    a profound catalyst for solving problems.


    When you help someone, sit down and write code together. Plan to spend the better
    part of an hour or more. It may take less than that, but you don''t want to be
    rushed. Resign yourself to the task and give it a solid effort. You will likely
    come having learned more than you gave.


    # BEING HELPED


    When someone offers to help you, be gracious about it. Accept the help gratefully
    and give yourself to that help. Do not protect your turf. Do not push'
