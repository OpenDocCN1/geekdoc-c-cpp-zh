- img_proc: true
  md: 'What causes such blockages? We''ve spoken about many of the factors already.
    For me, another major factor is sleep. If I''m not getting enough sleep, I simply
    can''t code. Others are worry, fear, and depression.


    Oddly enough there is a very simple solution. It works almost every time. It''s
    easy to do, and it can provide you with the momentum to get lots of code written.


    The solution: Find a pair partner.


    It''s uncanny how this works. As soon as you sit down to someone else, the issues
    that were blocking you melt away. There is a physiological change that takes place
    when you work with someone. I don''t know what it is, but I can definitely feel
    it. There''s some kind of chemical change in my brain or body that breaks me through
    the blockage and gets me going again.


    This is not a perfect solution. Sometimes the change lasts an hour or two, only
    to be followed by exhaustion so severe that I have to break away from my pair
    partner and find some hole to recover in. Sometimes, even sitting with someone,
    I can''t do more than just agree with what that person is doing. But for the typical
    reaction to pairing is a recovery of my momentum.


    # CREATIVE INPUT


    There are other things I do to prevent blockage. I learned a long time ago that
    creative output depends on creative input.


    I read a lot, and I read all kinds of material. I read material on software, politics,
    biology, astronomy, physics, chemistry, mathematics, and much more. However, I
    find that the best primes the pump of creative output is science fiction.


    For you, it might be something else. Perhaps a good mystery novel, or poetry,
    or even a romance novel. I think the real issue is that creativity breeds creativity.
    There''s an element of escapism. The hours I spend away from my usual problems,
    while being actively stimulated by challenging and creative ideas, results in
    an almost irresistible pressure to create something myself.'
