  md: '# 2A


    # Chapter 1: Clean Code


    This is a book about good programming. It is filled with code. We are going to
    look at code from every different direction. We''ll look down at it from the top,
    up at it from the bottom, and through it from the inside. By the time we''re done,
    you''re going to know a lot about code. What''s more, we''ll be able to tell the
    difference between good code and bad code. We''ll know how to write good code.
    And we''ll know how to transform bad code into good code.


    # There Will Be Code


    One might argue that a book code is somehow behind the times—that code is no longer
    the issue; that we have suggested that we are close to the end of code. That soon
    all code will be generated instead of written. That programmers simply won''t
    be needed because business people will generate programs from specifications.


    Nonsense! We will never be rid of code, because code represents the details of
    the requirements. At some level these details cannot be ignored or abstracted;
    they have to be specified. Specifying requirements in detail that that a machine
    can execute them is programming. Such a specification is code.


    I expect that the level of abstraction our languages will continue to increase.
    I also expect that the number of domain-specific languages will continue to grow.
    This will be a good thing. But it will not eliminate code. Indeed, all the specifications
    written in these higher level and domain-specific language will be code! It will
    still need to be rigorous, accurate, and so formal and detailed that a machine
    can understand and execute it.


    This will never happen. Not even humans, with all their intuition and creativity,
    have been able to create successful systems from vague feelings of their customers.
    Indeed, if the discipline of requirements specification has taught us anything,
    it is that well-specified requirements are as formal as code and can act as executable
    tests of that code!


    Remember that code is really the language in which we ultimately express the requirements.
    We may create languages that are closer to the requirements. We may create tools
    that help us parse and assemble those requirements into formal structures. But
    we will never eliminate necessary precision—so there will always be code.'
