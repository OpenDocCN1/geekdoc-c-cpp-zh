    "... pretty much what you expected.” When was the last time you saw a module that
    was pretty much what you expected? Isn''t it more likely that the modules you
    look at will be puzzling, complicated, tangled? Isn''t misdirection the rule?
    Aren''t you to flailing about trying to grab and hold the heads of reasoning that
    spew forth the whole system and weave their way through the module you are reading?
    When was the last time you read some code and nodded the head you might have nodded
    your head at Ward''s statement?


    Ward expects that when you read clean code you won''t be surprised by all. Indeed,
    you won''t even spend effort. You will read it, and it will be pretty much what
    you expected. It will be obvious, simple, and compelling. Each module will set
    the stage for the next. Each tells you what the next will be written. Programs
    that are clean are so profoundly written that you don''t notice it. The designer
    makes it look ridiculously simple like all exceptional designs.


    And about Ward''s notion of beauty? We''ve all rallied against the fact that our
    languages weren''t designed for our problems. But Ward''s statement puts the onus
    on us. He says that beautiful code makes the language look like it was made for
    the problem! So it''s our responsibility to make the language simple! Language
    bigots everywhere, beware! It is not the language that makes programs appear simple.
    It is the programmer that makes the language appear simple!


    # Schools of Thought


    What about me (Uncle Bob)? What do I think clean code is? This book will tell
    you, in hideous detail, what I and my compatriots think about clean code. We will
    tell you what we think makes a clean variable name, a clean function, a clean
    class, etc. We will present these opinions as absolutes, we will not apologize
    for our stridence. To us, at this point in our careers, they are absolutes. They
    are our school of thought about clean code.


    Martial artists do not all agree about the best martial art, or the technique
    within a martial art. Often master martial artists will find their own schools
    of thought and gather students to learn from them. We see Gracie Jiu Jitsu, founded
    and taught by the Gracie family in Brazil. We see Hakkoryu Jiu Jitsu, Ryuho in
    Tokyo. We see Jeet Kune Do, founded and taught by Bruce Lee in the United States.


