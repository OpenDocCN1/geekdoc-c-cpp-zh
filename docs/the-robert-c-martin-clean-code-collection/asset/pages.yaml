  md: '# MUSIC


    At Teradyne, in the late ''70s, I had a private office. I was the system administrator
    of our PDP 11/60, and so I was one of the few programmers allowed to have a private
    terminal. That terminal was a VT100 running at 9600 baud and connected to the
    PDP11 with 80 feet of RS232 cable that I strung over the ceiling tiles from my
    office to the computer room.


    I had a stereo system in my office. It was an old turntable, amp, and floor speakers.
    I had a significant collection of vinyl, including Led Zeppelin, Pink Floyd, and
    ..... Well, you get the picture.


    I used to crank stereo and then write code. I thought it helped my concentration.
    But I was wrong.


    One day I went back into a module that I had been editing while listening to the
    opening sequence of The Wall. The comments in that contained lyrics from the piece,
    and editorial notations about dive bombers and crying babies.


    That''s when it hit me. As a reader of the code, I was learning more about the
    music collection of the author (me) than I was learning about the problem that
    the code was trying to solve.


    I realized that I simply don''t code well while listening to music. The act of
    listening to music seems to consume some vital resource, indeed, my mind needs
    in order to write clean and well-designed code.


    Maybe it doesn''t work that way for you. Maybe music helps you write code. I know
    lots of people who code while wearing earphones. I accept that the music may help
    them, but I am also suspicious that what''s really happening is that the music
    is helping them enter the Zone.


    # INTERRUPIONS


    Visualize yourself as you are coding at your workstation. How do you respond when
    someone asks you a question? Do you snap at them? Do you glare? Your body-language
    tell them to go away because you are busy? In short, are you rude?'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'Or, do you stop what you are doing and politely help someone who is stuck?
    Do you treat them as you would have them treat you if you were stuck?


    The rude response often comes from the Zone. You may resent being dragged out
    of the Zone, or you may resent someone interfering with your attempt to enter
    the Zone. Either way, the rudeness often comes from your relationship to the Zone.


    Sometimes, however, it''s not the Zone''s at fault, it''s just that you are trying
    to understand something complicated that requires concentration. There are several
    solutions to this.


    Pairing can be very helpful as a way to deal with interruptions. Your pair partner
    can hold the context of the problem at hand, while you deal with a phone call,
    or a question from a coworker. When you return to your pair partner, he helps
    you reconstruct the mental context you had before the interruption.


    TDD is another big help. If you have a failing test, that test holds the context
    of where you are. You can return to it after an interruption and continue to make
    that failing test pass.


    In the end, of course, there will be interruptions that distract you and cause
    you to lose time. When they happen, remember that next time you may be the one
    who needs to interrupt someone else. So the professional attitude is a polite
    willingness to be helpful.


    # Writer’s Block


    Sometimes the code just doesn''t come. I''ve had this happen to me and I''ve seen
    it happen to others. You sit at your workstation and nothing happens.


    Often you will find other work to do. You''ll read email. You''ll read tweets.
    You''ll look through books, or schedules, or documents. You''ll call meetings.
    You''ll start up conversations with others. You''ll do anything so that you don''t
    have to face your workstation and watch as the code refuses to appear.'
