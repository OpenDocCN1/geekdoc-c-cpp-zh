  md: '# Foreword


    One of our favorite candies in Denmark is Ga-Jol, whose strange licorice vapors
    are a perfect complement to our damp and often chilly weather. Part of the charm
    of Ga-Jol to us Danes is the wise or witty sayings printed on the flap of every
    box top. I bought a two-pack of the delicacy and found that it bore old Danish
    saw:


    Ærlighed i små ting er ikke noget lille ting.


    “Honesty in small things is not a small thing.” It was a good omen consistent
    with what I already wanted to say. Small things matter. This is a book about humble
    concerns whose value is nonetheless from small.


    God is in the details, said the architect Mies van Rohe. This quote recalls contemporary
    arguments about the role of architecture in software development, and particularly
    in the Agile world. Bob and I occasionally found ourselves passionately engaged
    in this dialogue. And yet, Mies van Rohe was attentive to utility and to the timeless
    forms of building that underlie great architecture. On the other hand, he personally
    selected every doorknob for every house he designed. Why Because small things
    matter.


    In our ongoing “debate” on TDD, Bob and I have discovered that we agree that software
    architecture has an important place in development, though we likely have different
    visions of exactly what that means. Such quibbles are relatively unimportant,
    however, because we can accept for granted responsible professionals give time
    to thinking and planning at the outset of a project. The late-1990s notions of
    design driven by the tests and the code are long gone. Yet attentiveness to detail
    is an even more critical foundation of professionalism than any grand vision.
    First, it is through practice in the small that professionals gain proficiency
    and trust in the large. Second, the smallest sloppy construction, the door that
    does not close tightly or the slightly crooked tile on the floor, or the messy
    desk, completely dispels the charm of the larger whole. That is what clean code
    is.


    Still, architecture is just one metaphor for software development, and in particular
    that part of software delivers the initial product in the same sense that an architect
    delivers a pristine building. In these days of Scrum and Agile, the focus is on
    quickly bringing product to market. We want the factory running at top speed to
    produce software. These are human factories: thinking, feeling coders who are
    working from a backlog or user story to create product. The manufacturing metaphor
    looms ever strong in such thinking. The production aspects of Japanese auto manufacturing,
    of an assembly-line world, inspire much of Scrum.'
