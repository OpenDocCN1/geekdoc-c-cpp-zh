    pleasing ingenious and simple. Notice the emphasis on the word “pleasing.” Apparentlyjarne
    thinks that clean code is pleasing to read. Reading it should make you smile like
    a well-crafted music box or well-designed car.


    Bjarne also mentions efficiency—twice. Perhaps this should not surprise us from
    the inventor of C++; but I think there’s more to it than the sheer desire for
    speed. Wasted cycles are inelegant, they are not pleasing. And now note the word
    that Bjarne uses'
