  md: '# PREFACE


    # ABOUT THIS BOOK


    This book is about software professionalism. It contains a lot of pragmatic advice
    in an attempt to answer questions, such as


    +   - What is a software professional?

    - How does a professional behave?

    - How does a professional deal with conflict, tight schedules, and unreasonable
    managers?

    - When, and how, should a professional say “no”?

    - How does a professional deal with pressure?


    But hiding the pragmatic advice in this book you will find an attitude struggling
    to break through. It is an attitude of honesty, of honor, of self-respect, and
    pride. It is a willingness to accept the dire responsibility of being a craftsman
    and an engineer. Responsibility includes working well and working clean. It includes
    communicating well and estimating faithfully. It includes managing your time and
    facing difficult risk-reward decisions.


    But that responsibility includes one other thing—one thing.one frightening thing.
    As an engineer, you have a depth of knowledge about your systems and projects
    that no managers can possibly have. With that knowledge comes the responsibility
    to act.


