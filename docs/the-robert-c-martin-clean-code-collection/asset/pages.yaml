  md: '# 6A


    # Chapter 1: Clean Code


    are deeply complicit in the planning of the project and share a great deal of
    the responsibility for any failures; especially if those failures have to do with
    bad code!


    But wait!” you say. “If I don’t know what my managers say, I’ll be fired.” Probably
    Most managers want the truth, even when they don’t act like it. Most managers
    want good code, even when they are obsessing about the schedule. They may demand
    the schedule and requirements with passion; but that’s their job. It’s your job
    to defend the code with equal passion.


    To drive this point home, if you were a doctor and had a patient who demanded
    you stop all the silly hand-washing in preparation for surgery because it was
    taking too much time? Clearly the patient is the boss; and you should absolutely
    refuse to comply. Why? Because the doctor knows more than the patient about the
    risks of disease and infection. It would be unprofessional (never mind criminal)
    for the doctor to comply with the patient.


    So it is unprofessional for programmers to bend to the will of managers who don’t
    understand the risks of making messes.


    # The Primal Conundrum


    Programmers face a conundrum of basic values. All developers with more than a
    few years know that previous messes slow them down. And yet all developers feel
    the pressure to make messes in order to meet deadlines. In short, they don’t take
    the time to go fast!


    True professionals know that the second part of the conundrum is wrong. You will
    not make the deadline by making the mess. Indeed, the mess will slow you down
    instantly, and will force you to miss the deadline. The only way to make the deadline—the
    only way to go fast—is to keep the code as clean as possible at all times.


    # The Art of Clean Code?


    Let’s say believe messy code is a significant impediment. Let’s say that you accept
    the only way to go fast is to keep your code clean. Then you must ask yourself:
    “How do I write clean code?” It’s no good trying to write clean code if you don’t
    know what it means for code to be clean!


    The bad news is writing clean code is a lot like painting a picture. Most of us
    know when a picture is painted well or badly. But being able to recognize good
    art from bad does not mean we know how to paint. So being able to recognize clean
    code from dirty code does not mean that we know how to write clean code!


