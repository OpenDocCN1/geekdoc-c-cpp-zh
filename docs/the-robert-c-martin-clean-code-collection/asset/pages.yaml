  md: '# PRE-QUISITE INTRODUCTION


    My mother took me aside and told me that my life was a mess, and that I had been
    an idiot for quitting without having a new job, and for quitting emotionally,
    and for quitting together with my buddy. She told me that you never quit without
    having a new job, and you always quit calmly, coolly, and alone. She told me that
    I should call my old boss and beg for my old job back. She said, "You need to
    eat some humble pie."


    Nineteen-year-old boys are not known for their appetite for humble pie, and was
    no exception. But the circumstances had taken their toll on my pride. In the end
    I called my boss and took a big bite of humble pie. And it worked. I was happy
    to re-hire me for $6,800 per year, and I was happy to take it.


    I spent another eighteen months working, watching the Ps and Qs and trying to
    be as valuable an employee as I could. I was rewarded with promotions and raises,
    and a regular paycheck. Life was good. When I left the company, it was on good
    terms, and with an offer for a better job in my pocket.


    You might think that I had learned my lesson; that I was now a professional. Far
    from it. That was just the first of many lessons I needed to learn. In the coming
    years I would be fired from still another for carelessly missing critical dates,
    and nearly fired from still another for inadvertently leaking confidential information
    to a customer. I would take the lead on a doomed project and ride it into the
    ground without calling for the help I knew I needed. I would aggressively defend
    my technical decisions even the though they flew in the face of the customers''
