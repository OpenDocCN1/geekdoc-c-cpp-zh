  md: '# Foreword


    vii


    Inattentiveness costs us in the end: A bad penny always shows up. Research, neither
    in industry nor academia, humbles itself to the lowly station of keeping code
    clean. In my days working in the Bell Labs Software Production Research organization
    (Production, indeed!) we had some back-of-the-envelope findings that suggested
    consistent indentation style was one of the most statistically significant indicators
    of bug density. We want to be clear that architecture or programming language
    or some other high notion should be the cause of quality; as people whose professionalism
    overweighed the mastery of tools and lofty design methods, we felt insensitive
    to the value that those factory-floor machines, the coders, had through the simple
    application of an indentation style. To quote my own book of 17 years ago, such
    style distinguishes excellence from mere competence. The Japanese worldview understands
    the crucial value of the everyday worker and, so more, of the systems of development
    that owe to the simple, everyday actions of those workers. Quality is the result
    of many selfless acts of care—not just of any method that descends from the heavens.
    These acts are simple that they are simplistic, and it hardly makes that they
    are easy. They are nonetheless the fabric of greatness and more, so, by every
    human endeavor. To ignore them is not yet to be fully human.


    Of course, I am an advocate of thinking at broader scope, and particularly of
    the architectural approaches rooted in domain knowledge and software usability.
    The book isn''t about that—or, at least, isn''t obviously about that. This book
    has a subtler message whose foresight should not be underappreciated. It fits
    with the current sense of the really code-based people like Peter Sommerlad, Kelvin
    Henry and Giovanni Asproni. “The code is design” and “Simple code” are their mantras.
    While we must take care to remember that the interface is code, and that its structures
    have much to say about our program structure, it is crucial to constantly adopt
    the humble stance that the design lives in code. And while rework in the manufacturing
    metaphor leads to cost, rework in design leads to value. We should view code as
    the beautiful articulation of noble efforts of design—as a process, not a static
    endpoint. It''s in the code that the architectural merits of coupling and cohesion
