  md: '# Bibliography


    # Prequel and Principles


    In many ways this book is a “prequel” to a book I wrote in 2002 Agile Software
    Development: Principles, Patterns, and Practices (PPP). The PPP book concerns
    itself with the principles of object-oriented design, and many of the practices
    used by professional developers. If you have not read PPP, then you may find that
    it continues the story by this book. If you have already read it, then you''ll
    find many of the sentiments of that book echoed in this one at the level of code.


    In this book you will find sporadic references to various principles of design.
    These include the Single Responsibility Principle (SRP), the Open Closed Principle
    (OCP), and the Dependency Inversion Principle (DIP) among others. These principles
    are described in depth in PPP.


    # Conclusion


    Books art don''t promise to make you an artist. All they can give you some of
    the tools, techniques, and thought processes that other artists have used. So
    too this book can-not promise to promise to give you “code-sense.” All it can
    do is show you the thought processes of good programmers and the tricks, tech-niques,
    and tools they use.


    Just like a book on art, this book will be full of details. There will be lots
    of code. You''ll see good code and you''ll see bad code. You''ll see bad code
    transformed into good code. You''ll see lists of heuristics, disciplines, and
    techniques. You''ll see example after example. After that, it''s up to you.


    Remember the old joke about the concert violinist who got lost on his way to a
    performance? He stopped an old man on the corner and asked him how to get to Carnegie
    Hall. The old man looked at the violinist and the violin tucked under his arm,
    and said: “Prace-t, Practice!”


    # Bibliography


    [Beck07]: Implementation Patterns, Kent Beck, Addison-Wesley, 2007.


    [Knuth92]: Literate Programming, Donald E. Knuth, Center for the Study of Language
    and Information, Leland Stanford Junior University, 1992.'
