    # DEBUGGING


    One of the worst debugging sessions in my career happened in 1972. The terminals
    connected to the Teamsters’ accounting system used to freeze once or twice a day.
    There was no way to force this to happen. The error did not prefer any particular
    terminals or any particular applications. It didn''t matter what the user had
    been doing before the freeze. One minute the terminal was working fine, and the
    next minute it was hopelessly frozen.


    It took weeks to diagnose this problem. Meanwhile the Teamsters’ were getting
    more and more upset. Every time there was a freeze-up the person at that terminal
    had to stop working and wait until they could coordinate all the other users to
    finish their tasks. Then they''d call us and we''d reboot. It was a nightmare.


    We spent the first couple of weeks just gathering data by interviewing the people
    who experienced the lockups. We''d ask them what they were doing at the time,
    and what they had done previously. We asked other users if they noticed anything
    on their terminals at the time of the freeze-up. These interviews were all done
    over the phone because the terminals were located in downtown Chicago, while we
    worked 30 miles north in the cornfields.


    We had no logs, no counters, no debuggers. Our only access to the internals of
    the system were lights and toggle switches on the front panel. We could stop the
    computer, and then peek around memory one word at a time. But we couldn''t do
    this for more than five minutes because the Teamsters’ needed their system back
    up.


    We spent a few days writing a simple real-time inspector that could be operated
    from the ASR-33 teletype that served as our console. With this we could could
    peek'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'and poke around memory while the system was running. We added log messages
    that printed on the teletype at critical moments. We created in-memory counters
    that counted events and remembered state history that we could inspect with the
    inspector. And, of course, all this had been written from scratch in assembler
    and tested in the evenings when the system was not in use.


    The terminals were interrupt driven. The characters being sent to the terminals
    were held in circular buffers. Every time a serial port finished sending a character,
    an interrupt would fire and the next character in the circular buffer would be
    readied for sending.


    We eventually found that when a terminal froze it was because the three variables
    that managed the circular buffer were out of sync. We had no idea why this was
    happening, but at least it was a clue. Somewhere in the 5 KLOC of supervisory
    code there was a bug that mishandled one of those pointers.


    This new knowledge allowed us to un-freeze terminals manually! We could poke default
    values into those three variables using the inspector, and the terminals would
    magically start again. Eventually we wrote a little hack that would look through
    all the counters to see if they were misaligned and repair them. At first we invoked
    that hack by hitting a special user-interrupt switch on the front panel whenever
    the Teamsters called to report a freeze-up. Later we simply ran the repair utility
    once every second.


    A month or so later the freeze-up issue was dead, as far as the Teamsters were
    concerned. Occasionally one of their terminals would pause for a half second or,
    at a base rate of 30 characters per second, nobody seemed to notice.


    But why were the counters getting misaligned? I was nineteen and determined to
    find out.


    The supervisory code had been written by Richard, who had since gone off to college.
    None of the rest of us were familiar with that code because Richard had been quite
    possessive of it. That code was his, and we weren''t allowed to know it. But now
    Richard was gone, I got out the inches-thick listing and started to go over it
    by page.'
