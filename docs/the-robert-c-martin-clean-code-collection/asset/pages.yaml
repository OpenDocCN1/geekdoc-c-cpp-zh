  md: '# Foreword


    Even in the auto industry, the bulk of the work lies in manufacturing but in

    maintenance—or its avoidance. In software, 80% or more of what we do is quaintly
    called

    “maintenance”: the act of repair. Rather than embracing the typical Western focus
    on pro-

    ducing software, we should be thinking more like home repair in the building

    industry, or auto mechanics in the automotive field. What does Japanese management
    have

    to say about that?


    In about 1951, a quality approach called Total Productive Maintenance (TPM) came

    one the Japanese scene. It is maintenance rather than on production. One of

    major pillars of TPM is the so-called 5S principles. 5S is a set of disciplines—and

    I use the term “discipline” instinctively. These 5S principles are in fact at
    the funda-

    of Lean—another buzzword on the Western scene, and an increasingly prominent

    buzzword in software circles. These principles are not an option. Uncle Bob relates
    in

    his front matter, software practice requires discipline: focus, presence, and

    inking. It is not just about doing, but pushing the factory equipment to pro-

    duce at the optimal velocity. The 5S philosophy comprises these concepts:


    +   - Seiri, or organization (think “sort” in English). Knowing things are—using

    approaches as suitable naming—is crucial. You naming identifiers isn''t

    important? Read on in the following chapters.

    - Seiton, or tidness (think “systematize” in English). There is an old American
    saying:

    A place for everything, and everything in its place. A piece of code should be
    where

    y expect to find it—and, if not, you should re factor to get it here.

    - Seiso, or cleaning (think “shine” in English): Keep the workplace free of hanging

    wires, gears, scraps, and waste. What do the authors say about littering your

    code with comments and commented-out code lines that capture history or wishes
    for

    t future? Get rid of them.

    - Seetsu, or standardization: The group agrees about how to keep the workplace
    clean.

    Do you think this says anything about having a consistent coding style and set
    of

    practices within the group? Where do these standards come from? Read on.

    - Shutuke, or discipline (self-discipline). This means having the discipline to
    follow the

    practices and frequently reflect on one’s work and be willing to change.


    If you take up the challenge—yes, the challenge—of reading and applying this book,

    you’ll come to understand and appreciate the last point. We are finally drawing
    to the

    l of responsible professionalism in a profession that should be concerned with
    the life

    cycle of a product. As we maintain automobiles and other machines under TPM, break-

    down maintenance—waiting for bugs to surface—is the exception. Instead, we go
    up a

    inspect the machines every day and fix wearing parts before they break, or do
    the

    equ of the proverbial 10,000-mile oil change to forest wear and tear. In code,

    refactor mercilessly. You can improve yet one level further, as the TPM movement
    in-

    ovated over 50 years ago: build machines that are more maintainable in the first
    place. Mak-

    ing your code readable is as important as making it executable. The ultimate practice,

    introduced in TPM circles around 1960; is to focus on introducing new machines
    or'
