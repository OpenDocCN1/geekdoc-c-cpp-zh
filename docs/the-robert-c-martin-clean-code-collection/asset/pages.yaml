    names, however: I also look at whether an object or method is doing more than
    thing. If it''s an object, it probably needs to be broken into two or more objects.
    If it''s a method, I will always use the Extract Method refactoring on it, resulting
    in one method that says more clearly what it does, and some submethods saying
    how it is.


    Duplication and ever take me a very long way into what I consider clean code,
    and improving dirty code with just these two things in mind can make a huge difference.
    There is, however, one thing that I am aware of doing, which is a bit harder to
    explain.


    After years of doing this, it seems to me that all programs are made up of similar
    elements. One example is "finding things in a collection." Whether we have a database
    of records, or a hash map of keys and values, or an array of some kind, we find
    ourselves wanting a particular item from collection. When that happening, I often
    wrap the particular implementation in a more abstract method or class. That gives
    me a couple of adventures.


    I can implement the functionality now with something simple, say a hash map, but
    since now all the references to that are covered by my little abstraction, I can
    change the implementation any I want. I can go forward quickly while preserving
    my ability to change


    In addition, the collection abstraction often calls my attention to what''s "really"
    going on, and keeps me running down the path of implementing arbitrary behavior
    when all I really need is a few simple ways of finding what I want.


    Reduced duplication, high expressiveness, and early building of simple abstractions.
    That''s what makes clean code for me.


    Here, in a few short paragraphs, Ron has summarized the contents of this book.
    In duplication, one thing, expressiveness, tiny abstractions. Everything is there.


