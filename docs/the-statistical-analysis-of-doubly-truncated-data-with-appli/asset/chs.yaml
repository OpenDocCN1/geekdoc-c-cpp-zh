  \ K](img/c02-i0294) 的 NPMLE，且这两个估计量都可以通过同时求解 `(2.13)` 和\n\n```\n(2.16)![ModifyingAbove\
  \ phi With Ì‚ Subscript i Baseline equals left-parenthesis sigma-summation Underscript\
