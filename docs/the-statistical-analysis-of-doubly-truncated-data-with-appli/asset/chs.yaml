  \ NPMLE。左图：早期发病组。右图：晚期发病组。\n\n### 2.1.2 计算 NPMLE 的数值算法\n\n在接下来，我们回顾了计算 ![upper F](img/c02-i0250)\
  \ 的三种现有算法：Efron 和 Petrosian (1999) 提出的两种算法以及 Shen (2010) 提出的耦合算法。这些算法是迭代的，因此它们从\
  \ ![upper F](img/c02-i0253) 的初始解开始，然后通过不断改进达到一定的收敛。\n\n如命题 1.5 所确，![upper F](img/c02-i0254)\
  \ 的 NPMLE 由条件似然函数 `L(phi)` 的极大值给出，即 `phi_1, ..., phi_n`。该极大值满足 2.9：\n\n```\nphi_1,\
  \ ..., phi_n\n```\n其中 `sum_{m=1}^n J_j phi_m`。该表达式被 Efron 和 Petrosian (1999) 用于引入以下迭代算法。\n\
  \n前一种算法收敛缓慢，这是 Efron 和 Petrosian (1999) 已经注意到的，因此作者引入了另一种基于 Lynden-Bell (1971) 方法的左截断数据算法。Lynden-Bell\
  \ 方法在假设没有相同点的情况下通过以下方式估计时间 `X_j`(images/c02-i0266) 的风险率：\n\n```\nlambda_j = [sum_{i=1}^n\
  \ I(U_i <= X_j <= X_i)]^{-1}\n```\n然后它按照通常方式评估累积分布函数的跳跃：\n\n```\nphi_j = phi_{j-1}\
  \ exp(sum_{i=1}^{j-1} log(1 - lambda_i))\n```\n\n\n\n\n\n将 `(2.10)` 应用于双截断数据是不一致的，因为它忽略了右侧的截断。实际上，正如\
