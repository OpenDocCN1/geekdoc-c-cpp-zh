  \ 可以通过极大似然原理估计。细节见下。\n\n在 图 5.10 中，我们描绘了三种不同关联度的从 Clayton copula 模拟的 ![n equals\
  \ 1000](img/c05-i0457.png) 对 ![left-parenthesis s 1 comma s 2 right-parenthesis](img/c05-i0458.png)\
  \ 的散点图。当 ![tau Subscript theta equals 0.2](img/c05-i0459.png) 时很难看出依赖性，但当肯德尔系数为\
