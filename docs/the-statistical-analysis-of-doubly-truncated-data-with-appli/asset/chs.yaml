  \ 177\n\n# 前言\n\n本书是三个作者长期合作的成果，这种合作始于 Carla Moreira 在 Jacobo de Uña-Ávarez 的指导下读博士。Carla\
  \ 在维戈大学（Universidade de Vigo）完成了论文《双截断数据的统计分析：新方法、软件开发与生物医学应用》，并在 2010 年 7 月通过答辩。当时，似乎只有少数人意识到随机截断的重要性。2010\
  \ 年以前关于该主题的研究论文非常少，Bradley Efron 和 Vahe Petrosian 在 1999 年的贡献是最相关的。而且，当时没有任何软件可用。因此，对我们来说，开展这项倡议是一项充满风险又令人兴奋的研究。\n\
  \n我们在 2009 年 9 月发布了我们的 `R` 软件包 `DTDA` 的 1.1 版本。据我们所知，这是第一个实现 Efron–Petrosian 估计器的软件库。该包包含了\
  \ Efron 和 Petrosian 关于类星体光度的数据，我们非常感谢这两位科学家分享这些数据。截至目前，`DTDA` 已被下载超过 4 万次。我们利用撰写本书的机会更新并增强了\
  \ `DTDA`，为其提供了新的说明性真实数据集，并开启了新的功能和能力。我们相信，软件包的更新和本书提供的指导将指数级地增加双截断数据的应用，并提高人们对截断对推断过程影响的认识。尽管出版社和作者在准备本书时尽了努力，但不对内容的准确性或完整性发表任何陈述或保证。本书按原样销售，这意味着我们不提供专业服务。您可以根据自己的情况咨询专家。此外，读者应注意，书中列出的网站之间可能发生了变化或消失。出版社或作者对任何利润损失或其他商业损害不负责。\n\
