  \ F](img/c02-i0268.png) 的上界。Efron 和 Petrosian（`1999`）提出了一种基于他们的 `Hazard Rate Theorem`\
  \ 在双截断下迭代改进 `(2.10)` 的方法，该定理指出：\n\n```\n(2.12)![ModifyingAbove upper Q With Ì‚ Subscript\
