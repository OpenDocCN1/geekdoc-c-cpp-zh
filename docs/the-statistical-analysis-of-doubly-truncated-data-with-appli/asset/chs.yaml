  \ 第 4.2 节 和 第 4.3 节 中回顾的方法不同，后者分别是基于比例风险假设或加速失效时间结构的。\n\n非参数方法允许在建立任何合理的模型之前，先进行初步的或探索性的数据分析。从另一个角度来看，非参数程序用于在不假设可能损害推理的预设结构的情况下，获得目标总体的结论。存在多种非参数回归方法。在本节中，我们重点关注核平滑法，它已经在\
  \ 第 3 章 中用于非参数化估计 ![upper X](img/c04-i0312.png) 的概率密度函数 (pdf) 和风险函数，并且可以很容易扩展到估计\
