  ## 5.4 依赖截断\n\n在节一节中，我们讨论了如何评估独立截断假设。当独立截断被拒绝，或者当关于截断变量 ![left-parenthesis upper\
  \ U comma V right-parenthesis](img/c05-i0407.png) 与目标变量 ![upper X](img/c05-i0408.png)\
  \ 之间关联的外部信息时，需要替代 Efron–Petrosian NPMLE 的方法。在本节中，我们回顾了这种基于 copula 的最新方法，用于估计可能存在依赖截断的双重截断累积分布函数（cdf）。这把单侧截断下基于\
  \ copula 的估计（Emura 和 Wang, 2012）扩展到了截断设置。请参见 Chiou 等人 (2019)，了解通过变换模型处理依赖截断的替代方案。\n\
  \nCopula 函数（Nelsen, 2006)）统计学中常用于处理多种设置下的依赖性。特别是在生存分析中，copula 已用于建模依赖删失和依赖截断问题。基于\
  \ copula 的方法首先将感兴趣的多元分布分为两个部分：(i) 边缘分布，以及 (ii) 边缘之间的联系。如何估计这两个部分取决于所处理的特定设置。\n\n\
  类似于第 5.3 节 中的情况，为了演示方便，我们考虑区间抽样的情形，双重截断由单个截断变量 ![U](img/c05-i040.png) 引起，其中 `V =\
  \ U + sigma` 对于已知的 ![sigma](img/c05-i041.png)。这已被 Moreira 等人 (2021) 进行了仔细研究。对于 ![left-parenthesis\
  \ U V right-parenthesis](img/c05-i012.png) 不集中在直线上的替代方案，原则上采用类似的方法，但由于截断变量的多元性带来了额外的复杂性。\n\
  \nCopula 函数是单位正方形 `I squared = [0,1] x [0,1]`(images/c05-i013.png) 上的二元分布，具有均匀边缘。令\
  \ ![F Subscript X U](img/c05-i014.png) 为 ![left-parenthesis X U right-parenthesis](img/c05-i015.png)\
  \ 的二元 cdf，令 ![F](img/c05-i016.png) 和 ![K Subscript U](img/c05-i017.png) 为其边缘分布。在之前的章节中，我们用\
  \ ![left-parenthesis a Subscript X b Subscript X right-parenthesis](img/c05-i018.png)\
  \ 和 ![left-parenthesis a Subscript U b Subscript U right-parenthesis](img/c05-i019.png)\
  \ 表示 ![F](img/c05-i020.png) 和 ![K](img/c05-i021.png) 的相应支撑。根据 Sklar 定理（Nelsen, 2006），存在一个\
  \ copula 函数 ![C](img/c05-i022.png) 使得：\n\n```\nF(x, u) = C(F(x), K(u)) for (x, u)\
  \ in [a, b] x [a, b]\n```\n(images/c05-math-0012.png)\n\n此外，如果 ![F](img/c05-i023.png)\
  \ 和 ![K Subscript U](img/c05-i024.png) 是连续的，则 copula ![C](img/c05-i025.png) 是唯一的。当\
  \ `C(s1, s2) = s1 * s2`(images/c05-i026.png), `0 <= s1, s2 <= 1`(images/c05-i027.png)\
  \ 时，变量 ![X](img/c05-i028.png) 和 ![U](img/c05-i029.png) 是独立的，否则它们是依赖的。由给定 copula\
  \ 函数 ![C](img/c05-i030.png) 激发的 ![X](img/c05-i031.png) 和 ![U](img/c05-i032.png)\
  \ 之间的关联通常通过 Kendall's Tau 来衡量，其公式为：\n\n```\ntau_C = 4 * integral C(s1, s2) dC(s1,\
  \ s2)\n```\n(images/c05-math-0013.png)\n\n\n\n\n\n依赖截断可以通过一种相对简单的方法处理，即通过由单变量或多变量参数\
  \ ![theta](img/c05-i0434.png) 索引的 copula 模型 ![script upper C Subscript theta](img/c05-i0433.png)\
  \ 来处理。Nelsen (2006) 中给出了许多示例。在这里为了为了说明，我们仅引用了其中三个；在后续，我们用 ![tau Subscript theta](img/c05-i0435.png)\
  \ 代替 ![tau Subscript script upper C Sub Subscript theta](img/c05-i0436.png)：\n\n\
  1.  **C1. 克莱顿 copula (Clayton copula)**：![script upper C Subscript theta Baseline\
  \ left-parenthesis s 1 comma s 2 right-parenthesis equals left-bracket max left-parenthesis\
  \ s 1 Superscript negative 1 slash theta plus s 2 Superscript negative 1 slash theta\
  \ minus 1 comma 0 right-parenthesis) right-bracket Superscript negative 1 slash\
  \ theta](img/c05-i0437.png), ![theta element-of left-bracket negative 1 comma infinity\
  \ right-parenthesis reverse-solidus StartSet 0 EndSet](img/c05-i0438.png)。肯德尔系数：![tau\
  \ Subscript theta Baseline equals theta slash left-parenthesis theta plus 2 right-parenthesis](img/c05-i0439.png)。\n\
  \n2.  **C2. 弗兰克 copula (Frank copula)**：![script upper C Subscript theta Baseline\
