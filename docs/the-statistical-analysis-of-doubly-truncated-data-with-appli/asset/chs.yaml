  \ 16 家拥有导管设施。公立医院提供了大多数冠状动脉事件治疗，从 2009 年到 2013 年，接受经皮治疗的人数增加了 37.0%，尽管该程序的获取水平存在差异。`EPIHeart`\
  \ 研究 (Araújo 等人,2018) 是 2013 年 8 月至 2014 年 12 月由葡萄牙北部两家三级医院的心科部门进行的：覆盖波尔图地区的 São\
