  \ 年期间的活出生人数大致不变，假设在 15 岁前患癌的亚群的出生过程是由恒定速率的 `Poisson` 过程驱动的是合理的。这种外部信息如果可用，可以用于改进目标\
  \ ![upper F](img/c02-i0801.png) 的估计。在其他应用中，很难获得关于出生过程的信息。例如，对于第 1.4.2 中的 AIDS 输血数据，![upper\
