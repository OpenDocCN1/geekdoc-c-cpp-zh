  \ slash upper B Subscript n](img/flast01-i0134.png) 概率有界\n\n# 1 引言\n\n## 1.1 随机截断\n\
  \n随机截断通常指目标总体中的某些个体由于某种随机事件的排斥而无法被抽样的情况。当该随机事件与感兴趣的变量无关时，可以应用标准的统计方法，唯一的不便是样本量较小。然而，在许多实际情况下，截断事件与研究变量相关，必须考虑克服采样偏差的特定方法。\n\
  \n本书侧重于采样事件发生时间数据时（通常，但不限于）出现的随机截断现象。也就是说，感兴趣的变量是从一个定义的起点到另一个定义良好的终点所经过的时间 ![upper\
  \ X](img/c01-i0001.png)。在这种设定下，upper X](images/c01-i0002.png) 的截断样本是一组独立同分布的随机变量，其在给定\
  \ ![upper B](img/c01-i003.png) 时 ![upper X](img/c01-i0004.png) 的分布。由于截断事件 ![upper\
  \ B](img/c01-i005.png) 显然与 ![upper X](img/c01-i006.png) 相关，应用于截断样本的标准统计方法可能会产生系统性偏差。例如，![upper\
  \ X](img/c01-i0007.png) 在 ![x](img/c01-i0008.png) 处的普通经验累分布函数 (ecdf) ![upper F Subscript\
  \ n Superscript asterisk left-parenthesis x right-parenthesis](img/c01-i009.png)\
  \ 收敛于 ![upper F Superscript asterisk left-parenthesis x right-parenthesis equals\
  \ upper P left-parenthesis upper X less-than-equal-to x vertical-bar upper X-of\
  \ B right-parenthesis](img/c01-i10.png)，而非目标累分布函数 (cdf) ![upper F left-parenthesis\
  \ x right-parenthesis equals upper P left-parenthesis upper X less-than-equal-to\
  \ x right-parenthesis](img/c01-i11.png)。自 Turnbull (1976) 的开创性论文以来，这个问题引起了极大关注。采样事件发生时间数据时的特殊截断形式将在\
  \ 1.2 节 和 1.3 节 中讨论。\n\n事件发生时间数据与生存分析、可靠性工程等领域相关，这些领域经常出现随机截断。随机截断出现在出现在领域，其中 ![upper\
  \ X](img/c01-i14.png) 代表受观测限制的天体亮度。本书将在范围内介绍并分析这些领域的示例。\n\n## 1.2 单侧截断\n\n### 1.2.1\
  \ 左截断\n\n左截断是采样事件发生时间数据时的一种常见特征。目标 ![upper X](img/c01-i015.png) 的左截断时间定义为随机变量 ![upper\
  \ U](img/c01-i016.png)，只有当 ![upper U less-than-equal-to upper X](img/c01-i017.png)\
  \ 时才能观测到 ![upper X](img/c01-i018.png)，这决定了随机集合 ![upper B](img/c01-i019.png)。\n\n\
  \n\n\n左截断（Left‐truncation）发生在，例如横断面采样中，其中样本个体是在特定日历时间上处于起点和终点之间的个体，该时间即为横截面日期（Wang,\
  \ 1991）。这意味着，观察者在给定日期进入该过程，并允许观察在该日期“进行中”的个体的事件时间 ![upper X](img/c01-i0020.png)\
  \ 和左截断时间 ![upper U](img/c01-i0021.png)。在横断面采样中，变量 ![upper U](img/c01-i0022.png)\
  \ 被定义为从发病到横截面日期的时间。这种采样方法经常被应用，因为它达到预设样本量所需的精力较少。在医学研究中，这种设计会导致对“现患病例”（prevalent\
  \ cases）的采样：即已经诊断出某种感兴趣的疾病且生存时间超过横截面日期的患者。显然，这种采样设计意味着存在观测偏倚，因为生存时间较长的个体（![upper\
  \ X](img/c01-i0023.png) 值）被观测到的概率相对较大。目前已经过充分研究的建议可以克服这种偏倚，其基于考虑观测到的左截断时间以定义合适的风险集的简单想法。为此，传统上假设\
  \ ![upper X](img/c01-i0024.png) 和 ![upper U](img/c01-i0025.png) 之间相互独立。这种独立性假设认为，事件时间分布随时间保持不变，与发病日期无关。左截断的一个经典案例是钱宁大楼数据（Channing\
  \ House data），测量居住在该退休中心的人的死亡年龄；在这种情况下，目标变量被进入该住所的年龄所左截断（Klein and Moeschberger,\
  \ 2003）。\n\n另一个导致左截断的特征是延迟进入研究。这发生在个体仅在发病后的某个随机时间 ![upper U](img/c01-i0026.png)\
  \ 才进入研究时。例如，某种疾病的诊断可能直到第一次去医院时才能确定。如果“疾病结束”事件在潜在的访问日期之前发生，则此类患者的事件时间将永远未知，导致在观测较小的事件时间时存在困难。Beyersmann\
  \ 等人 (2012) 在流产时间的研究为该问题提供了一个说明性示例。\n\n### 1.2.2. 右截断（Right‐truncation）\n\n在某些特定设定下，最终目标变量\
  \ ![upper X](img/c01-i0027.png) 仅对在特定日历时间 ![d 1](img/c01-i0028.png)之前发生事件的个体可观测。这种情况的一个典型例子是艾滋病（AIDS）潜伏期（或诱导期）的研究；参见\
  \ Klein 和 Moeschberger (2003)）。潜伏期定义为 HIV 感染日期（例如 ![d Subscript normal upper I](img/c01-i0029.png)）与\
  \ AIDS 发作之间经过的时间。如果 ![upper X](img/c01-i0030.png) 代表潜伏期且 ![upper V equals d 1 minus\
  \ d Subscript normal upper I](img/c01-i0031.png)，那么在 ![d 1](img/c01-i0032.png) 之前发生\
  \ AIDS 的个体的潜伏期服从于 ![upper X less-than-or-equal-to upper V](img/c01-i0034.png) 的\
  \ ![upper X](img/c01-i0033.png) 分布。在这里，![upper V](img/c01-i0035.png) 被右截断时间。右截断的一个直接影响是\
  \ ![upper X](img/c01-i0036.png) 大值被采样的概率相对较小。\n\n### 1.2.3. 截断与删失（Truncation vs.\
  \ Censoring）\n\n此时，读者可能对截断（truncation）和删失（censoring）之间的区别感兴趣。右删失是生存分析和可靠性研究等领域中非常著名的现象。它发生在给定个体的随访在感兴趣的事件发生之前停止了。在这种情况下，观察者只知道目标变量大于记录的值，该值被称为删失时间。由真实值和删失值组成的样本通常由\
  \ Kaplan–Meier 估计量（Kaplan and Meier, 1958）进行分析，它修正了某些 ![upper X](img/c01-i0037.png)\
  \ 记录值小于真实值的事实。对于截断数据，样本中的每个值都对应 ![upper X](img/c01-i0038.png) 的真实观测；然而，由于截断的存在，观测值的分布相对于真实分布可能会发生偏移。截断与删失之间的这种差异表明应该使用特定方法来估计目标。事实上，Woodroofe\
  \ (1985) 对单侧截断提供了深度分析，引入了 Lynden–Bell (1971) 在该设定下的非参数似然估计量（NPMLE）。Woodroofe ([1985])\
  \ 中的估计量是双截断数据的一种特殊情况，本书正关注这一点。\n\n## 1.3 双截断（Double Truncation）\n\n变量 ![upper X](img/c01-i0039.png)\
  \ 被一对随机变量 ![left-parenthesis upper U comma upper V-parenthesis](img/c01-i0040.png)\
  \ 双截断，如果仅当 ![upper U less-than-or-equal-to upper X less-than-or-equal-to upper V](img/c01-i0041.png)\
  \ 发生时才能观测 ![upper X](img/c01-i0042.png)。在这种情况下，![upper U](img/c01-i0043.png) 和 ![upper\
  \ V](img/c01-i0044.png) 分别称为左截断和右截断。当 ![upper V](img/c01-i0045.png) 退化为无穷大时，双截断简化为左截断，而当\
  \ ![upper P left-parenthesis upper equals negative infinity right-parenthesis equals\
  \ 1](img/c01-i0047.png) 时，它对应于右截断。本书关注是从一组具有给定 ![upper U less-than-or-equal-to upper\
  \ X less-than-or-equal-to upper V](img/c01-i0050.png) 分布的 iid ![left-parenthesis\
  \ upper X comma upper U comma upper V] 三元组中，估计 ![upper X](img/c01-i0048.png) 的分布以及相关曲线。\n\
  \n实践中出现了几种双截断的场景。一种导致双截断的设定是区间采样，其中样本被限制在两个特定日期 ![d 0](img/c01-i0051.png) 和 ![d\
  \ 1](img/c01-i0052.png) 之间发生事件的个体（Zhu and Wang, 2012）。那么，右截断时间为 ![upper V equals\
  \ d 1 minus d Subscript normal upper I](img/c01-i0053.png)，其中 ![d Subscript normal\
  \ upper I](img/c01-i0054.png) 表示事件的发病日期，而左截断时间为 ![upper U equals d 0 minus d Subscript\
  \ normal upper I Baseline equals upper V minus final sigma](img/c01-i0055.png)，其中\
  \ ![final sigma equals d 1 minus d 0](img/c01-i0056.png) 是区间宽度。第 1.4.1 节 中的儿童癌症数据是通过区间采样获得的数据的一个示例。\n\
  \n\n\n\n通过区间采样，变量 ![upper V minus upper U](img/c01-i0057.png) 在 ![final sigma](img/c01-i0058.png)\
  \ 处发生退化。这种情况也出现在其他采样方案中，其中 ![upper U](img/c01-i0059.png) 和 ![upper V](img/c01-i0060.png)\
  \ 是某些特定事件的日期。帕金森病数据提供了一个说明性例子，参见第 1.4.5 节，其中 ![upper V](img/c01-i0061.png) 是采集血样时的个体年龄。当\
  \ ![upper V minus upper U](img/c01-i0062.png) 为常数时，元组 ![left-parenthesis upper U\
  \ comma upper V right-parenthesis](img/c01-i0063.png) 落在一条直线上，即使截断变量可能是连续的，其联合密度也不存在。\n\
  \n在其他情况下，截断变量 ![upper U](img/c01-i0064.png) 和 ![upper V](img/c01-i0065.png) 并不通过线性方程\
  \ ![upper V equals upper U plus final sigma](img/c01-i0066.png) 关联。例如，![upper U](img/c01-i0067.png)\
  \ 和 ![upper V](img/c01-i0068.png) 可能代表某些随机观测限制，超出感兴趣变量 ![upper X](img/c01-i0069.png)\
  \ 无法被采样或检测。这种情况例如出现在天文学中，如第 1.4.4 节 所示。\n\n在随机双截断的情况下，原则上 ![upper X](img/c01-i0070.png)\
  \ 的极大和最小值都以较小的概率被观测到。然而，![upper X](img/c01-i0071.png) 的真实观测偏差随应用而异，取决于 ![left-parenthesis\
  \ upper X comma upper U comma upper V right-parenthesis](img/c01-i0072.png) 的联合分布。我们将看到，例如采样值\
  \ ![x](img/c01-i0073.png) 的概率，即 ![upper G left-parenthesis x right-parenthesis equals\
  \ upper P left-parenthesis upper U less-than-or-equal-to x less-than-or-equal-to\
  \ upper V vertical-bar upper X equals x right-parenthesis](img/c01-i0074.png)，可能大致恒定，不产生观测偏差；或者它可能大致下降，表明右截断偏差相对于左截断偏差占据主导地位。\n\
  \n另一个相关问题是 ![upper X](img/c01-i0075.png) 分布的可识别性。直觉上很清楚，对于双截断数据，只有在给定 ![a Subscript\
  \ upper U Baseline less-than-or-equal-to upper X less-than-or-equal-to b Subscript\
  \ upper V](img/c01-i0077.png) 的条件下，才能估计 ![upper X](img/c01-i0076.png) 的分布，其中 ![a\
  \ Subscript upper U](img/c01-i0078.png) 和 ![b Subscript upper V](img/c01-i0079.png)\
  \ 分别代表 ![upper U](img/c01-i0080.png) 和 ![upper V](img/c01-i0081.png) 支持集的端点（详情见第\
  \ 2 章）。我们将看到，这可能具有重要的实践意义。另一方面，在双截断生存数据的应用中，估计值对应于感兴趣的终点事件必然发生的易感人群。这与生存时间的标准分析不同，在标准分析中，部分个体可能属于所谓的*治愈部分*（cured\
  \ fraction）或免疫者。在解释分析结果时，应当考虑到这一点。\n\n双截断与单侧截断相比的一个重要区别是，对于双截断数据，概率分布的非参数极大似估计（NPMLE）没有显式形式。事实上，NPMLE\
  \ 可能不是唯一的，甚至不存在（Xiao and Hudgens, 2019）；参见第 2 章。书中将回顾几种用于在实践中计算 NPMLE 的迭代算法（Efron\
  \ and Petrosian, 1999; Shen, 2010)），并使用现有的 `R` 软件库对模拟数据和真实数据示例进行分析。还将介绍 NPMLE 的半参数和参数替代方案；这些方法避免了上述某些\
  \ NPMLE 不唯一或不存在的潜在问题，以引入某些估计偏差为代价降低了方差。此外，还将介绍重采样程序、检验问题、平滑方法、回归模型和多状态数据。\n\n##\
  \ 1.4 真实数据\n\n本节介绍了贯书中使用的数据集。它们都存在双截断问题。这些示例可以在 `DTDA` 包的最新更新中获得（Moreira et al.,\
  \ 2021).\n\n### 1.4.1 儿童癌症\n\n儿童癌症数据收集自波尔图的 IPO（Instituto Português de Oncologia），由\
  \ RORE（Registro Oncológico do Norte）部门提供。信息对应于 1999 年 1 月 1 日（images/c01-i082）至\
  \ 2003 年 12 月 31 日（images/c01-i083）期间北部地区诊断癌症的所有儿童，该地区包括波尔图、布拉加、布甘萨、维拉雷阿尔和维亚纳卡斯特洛。感兴趣变量\
  \ ![upper X](img/c01-i084) 是诊断年龄，根据儿童癌症的定义，其支持范围在 ![left-bracket 0 comma 15 right-bracket](img/c01-i085)\
  \ 区间（时间为年）。病例数为 409 例。然而，有三个病例缺少 ![upper X](img/c01-i086) 的值，因此我们只考虑具有完整信息的 ![n\
  \ equals 406](img/c01-i087) 名。\n\n由于区间采样，诊断年龄 ![upper X](img/c01-i088) 被元组 ![left-parenthesis\
  \ upper U comma upper V right-parenthesis](img/c01-i089) 双截断，其中右截断变量 ![upper V](img/c01-i090)\
  \ 是从出生（发病日期 ![d Subscript normal I](img/c01-i091)）到 2003 年 12 月 31 日的年，而 ![upper\
  \ U equals upper V minus 5](img/c01-i092)。这 ![n equals 406](img/c01-i093) 三元组 ![left-parenthesis\
  \ upper X Subscript i Baseline, upper U Subscript i Baseline, upper V Subscript\
  \ i Baseline right-parenthesis](img/c01-i094)，![1 less-than-or-equal-to i less-than-or-equal-to\
  \ n](img/c01-i095) 的观测值 ![left-parenthesis upper X, upper U, upper V right-parenthesis](img/c01-i096)\
  \ 已在 Moreira and de Uña-Álvarez (2010) 中报告，而 de Uña-Álvarez (2020) 将癌症组纳入统计分析中。\n\
  \n\n\n\n有趣的是，![upper U](img/c01-i0097.png) 的观测值介于 ![negative 4.5](img/c01-i0098.png)\
  \ 和 14.5（年）之间；等价地，![upper V equals upper U plus 5](img/c01-i0099.png) 的观测值介于 0.5\
  \ 到 19.5 之间。这意味着 ![upper U](img/c01-i0100.png) 和 ![upper V](img/c01-i0101.png) 的下端和上限满足\
  \ ![a Subscript upper U Baseline less-than-or-equal-to 0](img/c01-i0102.png) 和 ![b\
  \ Subscript upper V Baseline greater-than-or-equal-to 15](img/c01-i0103.png)。因此，在这种情况下，目标变量\
  \ ![upper X](img/c01-i0104.png) 在其整个支撑集 ![left-bracket 0 comma 15 right-bracket](img/c01-i0105.png)\
  \ 上是可观测的，且 ![upper F](img/c01-i0106.png)，即 ![upper X](img/c01-i0107.png) 的累积分布函数不存在识别问题。关于\
