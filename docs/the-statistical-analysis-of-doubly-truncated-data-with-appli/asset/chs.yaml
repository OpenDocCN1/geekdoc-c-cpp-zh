  \ 1](img/c02-i0404.png)`，`![1 less-than-or-equal-to i less-than-or-equal-to n](img/c02-i0405.png)`，这作为一个练习留给读者。引入\
  \ `![a left-parenthesis x right-parenthesis equals alpha Superscript negative 1\
  \ Baseline upper left-parenthesis x right-parenthesis](img/c02-i0406.png)`，`![a\
  \ Subscript upper X less-than-or-equal-to x less-than-or-equal-to b Subscript upper\
  \ X](img/c02-i0407.png)`，并令 `![script l Superscript infinity left-bracket a Subscript\
  \ upper X comma b Subscript upper Baseline right-bracket](img/c02-i0408.png)` 为定义在\
  \ `![upper X](img/c02-i0409.png)` 支撑集上的有界函数空间，其范数具有 `![double-vertical-bar h double-vertical-bar\
  \ Subscript infinity equals sup Subscript a Sub Sub upper X Subscript less-than-or-equal-to\
  \ x less-than-or-equal-to b Subscript upper Baseline StartAbsoluteValue h left-parenthesis\
  \ x right-parenthesis EndAbsoluteValue](img/c02-i0410.png)`。\n\n根据 `Theorem 2.1`\
  \ 并结合一些技术性工作，以下结论说明了过程 `![upper F Subscript n left-parenthesis x right-parenthesis\
  \ minus upper F left-parenthesis u right-parenthesis](img/c02-i0415)` 在 `![a Subscript\
  \ upper X less-than-or-equal-to x less-than-or-equal-to b Subscript upper X](img/c02-i0416)`\
  \ 上的弱收敛（参见 de Uña‐Álvarez 和 Van Keilegom `(2021)`），`Theorem 2.1` 意味着 `![upper F\
  \ Subscript n left-parenthesis x right-parenthesis](img/c02-i020)` 渐近服从高斯分布。这很有趣，例如当目标是构建置信区间时。此时的一个重要问题是\
  \ `![upper F Subscript n left-parenthesis x right-parenthesis](img/c02-i0421)` 的标准估计，该主题将在下一节中讨论。遗憾的是，出现在\
  \ `Theorem 2.1` 中的线性算子 `![script A](img/c02-i023)` 没有显式形式；这增加了估计量设计的难度。为了说明 `![upper\
  \ F Subscript n left-parenthesis x right-parenthesis](img/c02-i024)` 的一致性和渐近正态性，我们现在引入两个模拟场景，这些场景将在全书中用于研究其他工具。具体而言，我们首先引入一个没有采样偏倚的\
  \ `![upper F](img/c02-i025)` 场景（c02-i25），第二个是具有观测偏倚的。\n\n### 模拟场景 I：无采样偏倚的 F (c02-i26)\n\
  \n在该场景中，感兴趣的变量 `![upper X](img/c02-i0427)` 在单位区间 `![upper left-parenthesis 0 comma\
  \ 1 right-parenthesis](img/c02-i0428)` 上服从均匀分布。左截断变量 `![upper U](img/c02-i0429)`\
  \ 抽自 `![upper left-parenthesis negative 1 slash 3 comma 1 right-parenthesis](img/c02-i0430)`\
  \ 模型，而右截断变量通过 `![upper U](img/c02-i0431)` 计算为 `![upper V equals upper U plus 1 slash\
  \ 3](img/c02-i0432)`。这代表了一个宽度为 `![1 slash 3](img/c02-i0433)` 的区间采样场景，并在某种程度上类似于\
  \ `Section 1.4.1` 中的儿童数据。可识别支撑条件得到了满足，因为 `![a Subscript upper U Baseline equals\
  \ negative 1 slash 3 less-than-or-equal-to 0 equals a Subscript upper X less-than-or-equal-to\
  \ 0 equals a Subscript upper V](img/c02-i0434)` 且 `![b Subscript upper U equals\
  \ 1 less-than-or-equal-to b Subscript upper Baseline equals 1 less-than-or-equal-to\
  \ 4 slash 3 equals b Subscript upper V](img/c02-i0435)`。请注意，在该模型中 `![upper X](img/c02-i0436)`\
  \ 没有观测偏倚；事实上，`![upper G left-parenthesis x right-parenthesis equals 1 slash 4](img/c02-i0437)`\
  \ 对于 `![0 less-than x less-than 1](img/c2-i0438)` 使得 `![a left-parenthesis x right-parenthesis\
  \ equals 1](img/c02-i0439)` 对于所有 `![x](img/c02-i0440)` 点都成立。\n\n\n\n\n## 模拟场景 II：![upper\
  \ F](img/c02-i0441.png) 的采样偏差。\n\n通过对左截断变量考虑非均匀分布，可以很容易引入 `![upper X](img/c02-i0442.png)`\
  \ 的采样偏差。例如，考虑感兴趣的变量 `![upper X](img/c02-i0443.png)` 在单位区间上服从均匀分布，即 `![upper X tilde\
  \ upper U left-parenthesis 0 comma 1 right-parenthesis](img/c02-i0444.png)`。左截断变量\
  \ `![upper U](img/c02-i0445.png)` 满足 `[(3/4)(upper U + 1/3)]^{1/2 ~upper U(0, 1)`\
  \ (images/c02-i0446.png)，而右截断变量由 `![upper U](img/c02-i0447.png)` 计算为 `![upper V\
  \ equals upper U plus 1 slash 3]` (images/c02-i0448.png)。在该模型中，`![upper X](img/c02-i0449.png)`\
  \ 值的采样概率由 `![upper G(x) = ((3(x + 1/3)/4)^{1/2} - (3x/4)^{1/2}]` (images/c02-i0450.png)，`0\
  \ <= x < 1` (images/c02-i0451.png)给出。该函数单调递，这意味着较大的 `![upper X](img/c02-i0452.png)`\
  \ 值的观测机会较小，从而对目标变量 `![upper X](img/c02-i0453.png)` 引入了观测偏差。\n\n通常，随机双截断可以通过实现拒绝-接受步骤来轻松模拟，因此舍弃不满足条件\
  \ `U_i <= X_i <= V_i` (images/c02-i0455.png) 的三元组 `(X_i, U_i, V_i)` (images/c02-i0454.png)。这种想法在实践中效果良好，尽管当截断率很高时，达到预设样本量\
