  \ Efron 和 Petrosian (1999) 指出的，当右截断不严重时，L1–L3 预计具有更快的收敛速度；这正是第 1.4.4 节中类星星数据（Quasar\
  \ Data）的情况。对于类星星数据示例，在使用 `DTDA` 包相同的默认收敛准则时，EP1–EP3（以及 S1–S4）需要 43 次迭代，而 L1–L3 在仅需\
  \ 7 次迭代后即停止。\n\n### 2.1.3 NPMLE 的理论属性\n\n在本节中，我们描述了针对双截断数据的 NPMLE ![upper F Subscript\
  \ n](img/c02-i0305.png) 的理论属性。这包括一致性结果，以及将 NPMLE 表示为独立同分布随机变量之和，从而允许对其采样分布进行检查。除了关于\
  \ ![upper F Subscript n](img/c02-i0306.png) 本身的结果外，我们还提供了如下形式泛函的属性：\n\n(2.17)![upper\
  \ S Subscript n Superscript phi Baseline equals integral phi normal d upper F Subscript\
  \ Baseline equals sigma-summation Underscript i equals 1 Overscript n Endscripts\
  \ ModifyingAbove phi With Ì‚ Subscript i Baseline phi left-parenthesis upper X Subscript\
  \ i right right-parenthesis equals alpha Subscript n Baseline StartFraction 1 Over\
  \ n EndFraction sigma-summation Underscript i equals 1 Overscript n Endscripts StartFraction\
  \ phi left-parenthesis upper X Subscript i right-parenthesis) Over upper G Subscript\
  \ n Baseline left-parenthesis upper X Subscript i right-parenthesis EndFraction\
  \ comma,](img/c02-math-0027.png)\n\n其中最后一个等式源自命题 2.1.7。在估计位置和离散参数时，自然会出现在 (2.17)\
  \ 中定义的 Efron–Petrosian 积分。例如，![phi 1 left-parenthesis x right-parenthesis equals\
  \ x](img/c02-i0307.png) 给出了 ![upper X](img/c02-i0308.png) 均值的估计量，而通过结合 ![phi 1](img/c02-i0309.png)\
  \ 和 ![phi 2 left-parenthesis x right-parenthesis equals x squared](img/c02-i0310.png)，可以估计\
  \ ![upper X](img/c02-i0311.png) 的方差。估计量 ![upper F Subscript n left-parenthesis x\
  \ right-parenthesis](img/c02-i0312.png) 本身可以通过从 (2.17) 中考虑 ![phi Subscript x left-parenthesis\
  \ t right-parenthesis equals upper I left-parenthesis t less-than-or-equal-to x\
  \ right-parenthesis](img/c02-i0313.png) 来恢复![upper S Subscript n Superscript phi](img/c02-i0314.png)\
  \ 向 ![upper S Superscript Baseline equals integral phi normal d upper F](img/c02-i0315.png)\
  \ 的收敛自然是预期的；我们将回顾这方面的可用结果。Stute (1995) 以及 Stute 和 Wang (1993) 提出并研究了适用于右删数据的 (2.17)\
  \ 的不同版本，而 Stute 和 Wang (2008) 考虑了单侧截断的情况。本节关于 ![upper S Subscript n Superscript\
  \ phi](img/c02-i0316.png) 的结果在某种程度上将后者扩展到了双截断设置。\n\n由于 ![upper G](img/c02-i0317.png)\
  \ 在描述采样偏差和修正双截断效应中起着重要作用，我们还涵盖了 NPMLE ![upper G Subscript n](img/c02-i0318.png)\
  \ 的结果。特别是，将给出归一化过程 ![a Subscript n left-parenthesis x right-parenthesis equals alpha\
  \ Subscript n Superscript negative 1 upper G Subscript n](img/c02-i0319.png),a Subscript\
  \ n less-than-or-equal-to x left-than-or-equal-to b Subscript n 的独立同分布表示。![upper\
  \ G Subscript n](img/c02-i0321.png) 的一个有趣应用是检查由于双截断导致的观测偏差。将给出说明示例。目前 ![upper F](img/c02-i0322.png)\
  \ 被认为具有凸支撑 ![left-bracket upper X comma b Subscript X right-bracket](img/c02-i0323.png)\
  \ 的连续累积分布，但理论结果适用于更广泛的分布类。具体而言，正如将指出的，这些结果仅 ![upper F](img/c02-i0324.png) 的间断点是有限的。同样，令\
  \ ![left-bracket upper U comma b Subscript U right-bracket](img/c02-i0325.png) 和\
  \ ![left-bracket upper V comma b Subscript V right-bracket](img/c02-i0326.png) 分别为\
  \ ![upper K Subscript U](img/c02-i0327.png) 和 ![upper K Subscript V](img/c02-i0328.png)\
  \ 的支撑。如第 1 章所述，在双截断下，我们只能在条件 ![a Subscript U less-than-or-equal-to upper X left-than-or-equal-to\
  \ b Subscript V](img/c02-i0329.png) 下识别 ![upper X] 的分布。换之，![upper F](img/c02-i0331.png)\
  \ 的估计只有在 ![a Subscript U less-than-or-equal-to a Subscript X](img/c02-i0332.png)\
  \ 且 ![b Subscript X less-than-or-equal-to b Subscript V](img/c02-i0333.png) 时才是可能的。注意，当\
  \ ![a Subscript X less-than a Subscript U](img/c02-i0334.png) 时，没有机会在 ![left-parenthesis\
  \ a Subscript X comma a Subscript U right-parenthesis](img/c02-i0335.png) 内采样 ![upper\
  \ X Subscript i](img/c02-i0336.png)，因此无法在该区间内恢复 ![upper F](img/c02-i0337.png)。当\
  \ ![b Subscript V less-than b Subscript X](img/c02-i0338.png) 时也会发生类似的问题。\n\n\n\n\
  \n在实践中，为了解释目的，必须考虑可能违反条件 ![U_a \\le X_b, b_b \\le V_b](img/c02-i0339.png) 的情况。例如，对于第\
  \ 1.4.2 节中的 AIDS 血液输血数据，可识别的潜伏期 `cdf` 取决于是否在感染 HIV 后 99.5 个月内患上 AIDS。同样，第 1.4.6\
  \ 节中急性冠心综合征的诊断年龄仅在 29.42 至 94.09 岁之间时才是可识别的。另一个例子是，设备 `S` 数据的 `cdf` 估计（参见第 1.4.3\
  \ 节）取决于是否在运行的前 34 年内发生故障。在帕金森病发病年龄研究（第 1.4.5 节）中，早期和晚期组的定义解决了这个问题，因为年龄限制是基于实际观测值\
  \ ![X_i^upper](img/c02-i0340.png) 的。第 1.4.1 节中的应用则有所不同，因为儿童癌症的临床定义将诊断年龄 ![X^upper](img/c02-i0341.png)\
  \ 限制在 ![0, 15](img/c02-i0342.png)(岁）范围内。在这种情况下，只需要验证 ![U_i^{min 1\\le i\\le n} \\\
  le 0](img/c02-i0343.png) 和 ![V_i^{max 1\\le i\\le n} \\ge 15](img/c02-i0344.png)，以排除观测\
  \ ![X^upper](img/c02-i0345.png) 时存在任何关键限制的可能性；这两个不等式均成立。最后，对于第 1.4.4 节中描述的类星体亮度数据集，观测分布受限于\
  \ ![-2.40 \\le X \\le 2.58](img/c02-i0346.png)。在所有这些讨论中，理论限制 ![U^upper](img/c02-i0347.png)\
  \ 和 ![V^upper](img/c02-i0348.png) 已被其经验对应值所取代。\n\n### 二元 cdf 的识别\n\n识别 ![U, V](img/c02-i0350.png)\
  \ 的二元 `cdf` ![K^upper](img/c02-i0349.png) 也值得几几句。从直觉上显然，出于实际目的，可以将 ![K^upper](img/c02-i0351.png)\
  \ 替换为在 ![U \\le V](img/c02-i0353.png)、![U \\le b_X](img/c02-i0354.png) 和 ![V \\\
  ge a_X](img/c02-i0355.png) 条件下 ![U, V](img/c02-i0352.png) 的条件分布。这仅仅是为了承认，由于采样机制，当\
  \ ![u > v](img/c02-i0357.png)、![u > b_X](img/c02-i0358.png) 或 ![v < a_X](img/c02-i0359.png)\
  \ 时，无法从现有数据得出关于 ![K(u, v)](img/c02-i0356.png) 的任何结论。对于 ![F^upper](img/c02-i0360.png)\
  \ 的估计，由于此类支持性限制，对 ![K^upper](img/c02-i0361.png) 的 NPMLE 解释需要谨慎。以第 1.4.1 节中的儿童癌症数据作为说明性。由于\
  \ ![[a_X, b_X] = 0, 15 且 ![V = U + U](img/c02-i0363.png)，在 ![U \\le b_X](img/c02-i0364.png)\
  \ 和 ![V \\ge a_X](img/c02-i0365.png) 时意味着 ![V] 的 `cdf` 在 20 年内是可估计的。\n\n根据前面的讨论，后续假设\
  \ ![U, V](img/c02-i0367.png) 是 ![X^upper](img/c02-i0368.png) 的截断限制。这特别意味着 ![a_X\
  \ \\le a_V](img/c02-i0369.png)、![U_1 \\le b_X](img/c02-i0370.png) 以及 ![P(V_1 - U_1\
  \ \\ge 0) = 1](img/c02-i0371.png)。令 ![K^*](img/c02-i0372.png) 为 ![U_1, V_1](img/c02-i0373.png)\
  \ 的 `cdf`，并令 ![a_U, b_U](img/c02-i0374.png) 和 ![a_V, b_V](img/c02-i0375.png) 分别为\
  \ ![U_1] 和 ![V_1] 的支持。在建立 NPMLE 的渐近性质时，我们将参考以下假设：\n\n1. (A1) ![F^upper](img/c02-i0379.png)\
  \ 只有有限个不断点且在其他地方连续；![a_X \\le a_V](img/c02-i0380.png)、![U_1 \\le b_X](img/c02-i0381.png)；![b_X\
  \ - a_X < \\infty](img/c02-i0382.png);以及 ![P(V_1 - U_1 \\ge \\gamma) = 1](img/c02-i0383.png)，对于某些\
  \ ![gamma > 0](img/c02-i0384.png)。\n\n2. (A2) ![(u, v) \\in \\text{supp}(K^*), [F(v)\
  \ - F(u)] > \\delta_1 > 0](images/c02-i0385.png)。\n\n3. (A3) ![a_X \\le x \\le b_X,\
  \ G(x) > \\delta_2 > 0](img/c02-i0386.png)。\n\n4. (A4) ![U_1] 和 ![V_1] 的边缘密度在 ![a_X,\
  \ b_X](img/c02-i0389.png) 上是有界的。\n\n\n\n条件 `(A1)–(A4)` 具有技术性质。它们可以被视为上述关于 `![upper\
  \ X](img/c02-i0392.png)`、`![upper U](img/c02-i0393.png)` 和 `![upper V](img/c02-i0394.png)`\
  \ 支撑集的可识别性条件的加强版本，外加一些允许在证明中使用特定数学工具的正则性条件。实际上，只要满足 `![a Subscript upper U 1 Baseline\
  \ less-than a Subscript upper X](img/c02-i0395.png)` 和 `![b Subscript upper X Baseline\
  \ less-than b Subscript upper V 1](img/c02-i0396.png)`，条件 `(A2)` 和 `(A3)` 就是多余的且可以移除。然而，它们清晰地说明了两个相关采样概率必须满足的有界条件。请注意，虽然\
  \ `(A3)` 中出现的函数 `![upper G](img/c02-i0397.png)` 代表目标变量特定值 `![upper X equals x](img/c02-i0398.png)`\
  \ 的采样概率，但 `(A2)` 中的差 `![upper F left-parenthesis v right-parenthesis minus upper\
  \ F left-parenthesis u minus right-parenthesis](img/c02-i0399.png)` 仅仅是截断结果数对 `![left-parenthesis\
  \ u comma v right-parenthesis](img/c02-i0400.png)` 的采样概率。为了使理论结果成立，两者都必须远离零。\n\n\
  下一个结果由 de Uña‐Álvarez 和 Van Keilegom `(2021)` 证明过，他们纠正并完善了由 Shen `(2010a)` 发起的理论。该结果实际上对于方程的任意解\
  \ `![upper F Subscript n](img/c02-i0401.png)` 成立：\n\n```\n(2.18)![upper F Subscript\
  \ n left-parenthesis x right-parenthesis equals integral Subscript a Subscript upper\
