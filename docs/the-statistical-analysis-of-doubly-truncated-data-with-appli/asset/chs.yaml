  \ upper U comma upper V right-parenthesis](img/c05-i0306.png)与目标变量 ![upper X](img/c05-i0307.png)是独立的。这种独立假设对于构建非参数极大似然估计（NPMLE）至关重要，对于建立\
  \ NPMLE 的渐近性质也同样重要。特别是，当 ![left-parenthesis upper U comma upper V right-parenthesis](img/c05-i0309.png)与\
  \ ![upper X](img/c05-i0310.png)相关时，![upper F Subscript n](img/c05-i0308.png) 的一致性无法无法。为了考虑到截断与目标变量之间可能存在的依赖性，第\
  \ 5.4 节中回顾了 ![upper F](img/c05-i0311.png) 的另一种估计量。\n\n严格来说，比独立截断更弱的条件就足以保证 NPMLE\
  \ 的一致性。这在单侧截断下已得到深入研究（Martin and Betensky, 2005；Vakulen-Lagun 等 2019），并且对双截断数据的某些扩展也已得到了研究（Martin\
  \ and Betensky, 2005；Shen, 2011；Austin et al., 2014）。实际上，由于对 ![left-parenthesis\
  \ upper X comma upper U comma upper V right-parenthesis](img/c05-i0312.png)的采样信息限制在区域\
  \ ![upper U less-than-or-equal-to upper X less-than-or-equal-to upper V](img/c05-i0313.png)\
  \ 内，无法在整个支撑范围内评估 ![left-parenthesis upper U comma upper V right-parenthesis](img/c05-i0314.png)与\
  \ ![upper X](img/c05-i0315.png)之间的独立性。最多，截断对和目标变量在观测区域内的表现就像它们在不可观测的世界中独立的一样。这在不可观测世界中被称为*准独立性*（quasi-independence）。对于单侧截断，Vakulen-Lagun\
  \ 等 2019 证明了 Lynden-Bell 估计量 1971 在准独立性下是一致的。此外，他们揭示并讨论了一个未被注意的准独立性方面，这是单侧设置的扩展。\n\
