  \ **99**, 345–361.\n\n# 2 单样本问题\n\n本章讨论了从同质总体中抽取的 ![n](img/c02-i0001.png) 个体随机样本估计累积分布函数（cdf）的问题。在双重截断下，采样信息包含了感兴趣的变量\
  \ ![upper X](img/c02-i0002.png) 以及左截断和右截断变量 ![upper U](img/c02-i0003.png) 和 ![upper\
  \ V](img/c02-i0004.png)，但可观测总体减少为满足 ![upper U less-than-or-equal-to upper X less-than-or-equal-to\
  \ upper V](img/c02-i0005.png) 的个体。因此，我们假设手中的数据 ![left-parenthesis upper X Subscript\
  \ i Baseline, upper U Subscript i Baseline, upper V Subscript i Baseline right-parenthesis](img/c02-i0006.png),\
  \ ![1 less-than-or-equal-to i less-than-or-equal-to n](img/c02-i0007.png) 是一个随机样本，其分布遵循在给定\
  \ ![upper U less-than-or-equal-to upper X less-than-or-equal-to upper V](img/c02-i0009.png)\
  \ 条件下 ![left-parenthesis upper X, upper U, upper V right-parenthesis](img/c02-i0008.png)\
  \ 的条件分布。当然，![upper U Subscript i less-than-or-equal-to upper X Subscript i less-than-or-equal-to\
  \ V](img/c02-i0010.png) 对于 ![1 less-than-or-equal-to i less-than-or-equal-to n](img/c02-i0011.png)\
  \ 都的。\n\n我们将样本量 ![n](img/c02-i0012.png) 视为非随机量。在另一种观点下，数据来自一个两步程序。第一步，获取一个 ![left-parenthesis\
  \ upper X, upper U, upper V right-parenthesis](img/c02-i013.png) 随机样本，其大小为 ![N](img/c02-i014.png)，![left-parenthesis\
  \ upper X Subscript i Baseline, upper U Subscript i Baseline, upper V Subscript\
  \ i Baseline right-parenthesis](img/c02-i0015.png)， ![1 less-than-or-equal-to i\
  \ less-than-or-equal-to n](img/c02-i0016.png)。第二步，不满足 ![upper U Subscript i less-than-or-equal-to\
  \ upper X Subscript i less-than-or-equal-to V](img/c02-i0017.png) 条件的三元组被丢弃。这意味着最终\
  \ ![n](img/c02-i018.png)的大小确实是随机的（参见 Woodroofe 1985)。我们将基于 ![n](img/c02-i0019.png)\
  \ 条件进行，这忽略了由于 ![n] 的随机性而产生的额外项。\n\n重点是沿 ![upper X](img/c02-i0020.png) 变量的支持集估计 ![upper\
  \ F left-parenthesis x right-parenthesis](img/c02-i0021.png) 进行。在 2.1 节中，我们从非参数的角度解决这个问题，而在\
  \ 2.2 节中，将考虑基于半参数和参数模型的替代估计。\n\n## 2.1 分布函数的非参数估计\n\n![upper F](img/c02-i0023.png)\
  \ 的朴素估计是 ![upper X Subscript i](img/c02-i0024.png) 的普通经验分布函数（ecdf），公式为：\n\n```\n\
  F_n*(x) = 1/n \\sum_{i=1}^n I(X_i <= x)\n```\n\n\n\n\n注意，`(2.2)` 中的第二个等式在当 `![upper\
  \ X](img/c02-i0034.png)` 和 `![left-parenthesis upper U comma upper V right-parenthesis](img/c02-i0035.png)`\
  \ 为独立随机变量时成立。在本书中，除非另有说明，否则我们假设满足这种独立性条件。\n\n当不存在截断 `![upper P left-parenthesis\
  \ upper U equals negative infinity right-parenthesis equals upper P left-parenthesis\
  \ upper V equals infinity right-parenthesis equals 1](img/c02-i0036.png))` 时，偏置函数\
  \ `![upper-upper G](img/c02-i0037.png)` 是常数。这意味着，一旦从总体中抽取到变量 `![upper X](img/c02-i0039.png)`\
  \ 的特定值 `![x](img/c02-i0038.png)`，其包含在最终样本中的概率不受 `![x](img/c02-i0040.png)` 的影响。在左截断\
  \ `![upper P left-parenthesis upper V equals infinity right-parenthesis equals 1](img/c02-i0041.png))`\
  \ 下，`![upper G](img/c02-i0042.png)` 简化为左截断变量的累分布函数（cdf），因此是单调不减的。偏置函数的这种非不减的形状表明，`![upper\
  \ X](img/c02-i0043.png)` 的较大值具有较高的观测概率。右截断的情况恰相反；在这种情况下，`![upper G](img/c02-i0044.png)`\
  \ 是 1 减去右截断变量的 cdf（即 `![upper V](img/c02-i0045.png)` 的生存函数）。在下一节中，我们将引入双截断一般设置下\
  \ `![upper F](img/c02-i0046.png)` 的非参数极大似然估计量（NPMLE）。如所述，NPMLE 没有显式形式，在实践中必须通过迭代算法计算。\n\
  \n相关文献中已经提出了 `Section 2.1.1` 中 NPMLE 的 `![upper F](img/c02-i0047.png)` 的非参数估计量。例如，Austin\
  \ 等人 `(2014)` 在假设 `![upper U](img/c02-i0048.png)` 和 `![upper V](img/c02-i0049.png)`\
  \ 独立的额外假设下，提出了一种非参数估计量。当截断限制相互独立时，`(2.2)` 可以通过两个 Lynden-Bell 估计量的乘积进行简单估计，并构造出 `![upper\
  \ F](img/c02-i0050.png)` 的显式形式估计量。遗憾的是，`![upper U](img/c02-i0051.png)` 和 `![upper\
  \ V](img/c02-i0052.png)` 独立假设通常是不现实的，特别是它排除了区间抽样的重要场景。另一种 `![upper F](img/c02-i0053.png)`\
  \ 的非迭代估计量是 de Uña-Álvarez `(2018)` 提出的，它通过使用受限样本 `![StartSet i colon upper X Subscript\
  \ i Baseline less-than-equal-to upper X Subscript j Baseline less-than-equal-to\
  \ V Subscript i Baseline EndSet](img/c02-i0055.png)`，`![1 less-than-or-equal-to\
  \ j less-than-or-equal-to n](img/c02-i0056.png)` 计算出的 Lynden-Bell 估计量族从左到右递归估计 `![upper\
  \ F](img/c02-i0054.png)`。这种非参数估计量非常适用于区间抽样；然而它并不有效。本手稿未涵盖这些替代性的非参数程序。\n\n### 2.1.1\
  \ NPMLE\n\n由于假设目标变量 `![upper X](img/c02-i0057.png)` 和截断变量 `![left-parenthesis upper\
  \ U comma upper V right-parenthesis](img/c02-i0058.png)` 是相互独立的，单次观测值 `![left-parenthesis\
  \ upper X Subscript i Baseline comma upper U Subscript i Baseline comma upper V\
  \ Subscript i Baseline right-parenthesis](img/c02-i0059.png)`，`![1 less-than-or-equal-to\
  \ i less-than-or-equal-to n](img/c02-i0060.png)` 的似然贡献由下给出\n\n```\n![StartLayout\
  \ 1st Row 1st Column script upper L Subscript i Baseline left-parenthesis phi, psi\
  \ right-parenthesis 2nd Column equals 3rd Column upper P left-parenthesis upper\
  \ X Subscript i Baseline, upper U Subscript i Baseline, upper V Subscript i Baseline\
  \ right-parenthesis less-than-equal-to X less-than-equal-to V Subscript i Baseline\
  \ right-parenthesis 2nd Row 1st Column 2nd Column equals 3rd Column upper P```其中\
  \ `![alpha equals upper P left-parenthesis upper U less-than-equal-to X less-than-equal-to\
  \ V right-parenthesis](img/i0061)` 是非截断概率，`![upper K](img/c02-i0062.png)` 是 `![left-parenthesis\
  \ upper U comma upper V right-parenthesis](img/c02-i0063.png)` 的联合累分布函数，`![alpha\
  \ equals left-parenthesis phi, ..., psi right-parenthesis](img/- t](i0064)` 和 `![psi\
  \ equals left-parenthesis psi, ..., psi right-parenthesis](img/- t](i0065)`，而 `![phi\
  \ i](img/c02-i0066.png)` 和 `![psi i](img/c02-i0067.png)` 分别表示 `![upper X](img/c02-i0068.png)`\
  \ 在 `![left-parenthesis upper U Subscript i Baseline comma upper V Subscript i Baseline\
  \ right-parenthesis](img/c02-i0069.png)` 处的质量。\n\n在此处，仅为了推导 NPMLE，假设目标变量和截断变量对都是离散的。重要的是，在观测数据类上搜索离散\
  \ `![upper F](img/c02-i0072.png)` 和 `![upper K](img/c02-i0073.png)`（其质量分别集中在 `![upper\
  \ Subscript i](img/c02-i0074.png)` 和 `![left-parenthesis upper U Subscript i Baseline\
  \ comma upper V Subscript i right-parenthesis](img/c02-i0075.png)` 上）并没有限制性。这在以下命题中给出。\n\
  \n命题 2.1.1` 允许我们将非参数似然极大化限制在集中于 `![upper Subscript i](img/c02-i0095.png)` 的经验累分布函数类。反之，这意味着\
  \ `![upper F](img/c02-i0096.png)` 的 NPMLE 在最小左截断值 `![upper U Subscript left-parenthesis\
  \ 1 right-parenthesis Baseline equals min 1 less-than-or-equal-to i less-than-or-equal-to\
  \ n Endscripts U Subscript i](img/c02-i0097.png)` 左侧为 0，在 `![upper V Subscript left-parenthesis\
  \ n right-parenthesis Baseline equals max 1 less-than-or-equal-to i less-than-or-equal-to\
  \ n Endscripts V Subscript i](img/c02-i0098.png)` 右侧为 1。这很重要，因为在缺乏 `![upper F Subscript\
