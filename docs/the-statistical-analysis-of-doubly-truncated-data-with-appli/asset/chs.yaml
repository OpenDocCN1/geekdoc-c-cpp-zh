  \ right-bracket Superscript negative 1 Baseline normal d upper K Subscript n Superscript\
  \ Baseline left-parenthesis u comma v right-parenthesis EndFraction comma a Subscript\
  \ upper X less-than-or-equal-to x less-than-or-equal-to b Subscript upper X](img/c02-math-0028.png)\
  \ \n```\n\n其中 `![upper K Subscript n Superscript asterisk](img/c02-i0402.png)` 是\
  \ `![left-parenthesis upper U Subscript i Baseline comma upper V Subscript i Baseline\
  \ right-parenthesis](img/c02-i0403.png)` 的普通经验积分布函数。NPMLE 求解 `(2.18)` 这一于 `Proposition\
  \ 2.1.7` 以及等式 `![ModifyingAbove psi With Ì‚ Subscript i Baseline equals alpha Subscript\
  \ n n Superscript negative 1 Baseline left-bracket upper F Subscript n left-parenthesis\
  \ upper V Subscript i right-parenthesis minus upper F Subscript n left-parenthesis\
