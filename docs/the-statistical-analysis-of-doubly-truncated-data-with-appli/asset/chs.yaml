  \ 1995; Härdle et al., 2004)。由于“维度灾难”（curse of dimensionality），这是非参数回归的主要缺点之一，我们关注一维（连续）协变量\
  \ ![upper Z](img/c04-i0314.png)的情况。具有高维协变量的非参数回归估计收敛速度可能缓慢，其应用需要谨慎。具有左截断响应变量的核回归方法在文献中已得到深入研究；例如\
