  \ Meira‐Machado 和 Roel Braekers。我们与他们共同撰写了许多研究论文。通过研究应用研究人员提出的真实数据问题，我们也对双截断有了深入了解；在此，感谢\
  \ María José Bento、David Keith Simon、Zhi‐Sheng Ye、Ana Cristina Santos 和 Henrique\
  \ Barros 提供的丰富讨论与合作。\n\n如今，有一个相当大的统计学界正从事双截断数据探索性和推断方法的研究，这部分源于生物医学、经济学和工程等领域新兴应用的推动。在写作期间，该研究领域的活动比以往任何时候都更加活跃，这从过去几年发表的关于该主题的论文数量可以看出。而且对双截断的兴趣正变得越来越大！\n\
  \n本书旨在为那些对学习双截断数据分析和推断感兴趣的读者提供参考，介绍了用于估计分布和回归模型的广泛工具。书中介绍的所有方法都配有真实数据和模拟示例，在每章的末尾，读者可以找到\
  \ `do‐it‐yourself` 代码，这些代码主要基于 `DTDA` 包。本书的编写不仅仅为了被阅读：其主要目的是邀请读者进行思考、探索和体验。\n\n\
  本书也是自包含，提供了主要结果的总体概述。进一步的技术细节和某些省略的证明可以参考原始参考文献。我们还打算留下几个核心信息：首先，纠正由双截断引起的潜在采样偏差在估计和推断中可能是至关重要的；其次，即使\
  \ Efron–Petrosian 估计在概念上很复杂，其渐近理论可能令人难以理解，但由于现有的软件包和重采样算法良好的性能，它的实际应用相对简单；第三，应尽可能利用关于采样偏差的外部信息，因为\
  \ Efron–Petrosian 估计可能噪声很大，甚至不存在，特别是在样本量较小时。\n\n我们诚诚地希望读者能享受（并体验！）这本书，就像我们享受写作过程一样！欢迎读者对本版提出意见和建议；请将其发送至\
  \ `jacobo@uvigo.es` 以帮助我们改进本书。\n\n本书部分内容是在作者受资助 MTM2017‐89422‐P（MINECO/AEI/FEDER,\
  \ UE）（第一作者）、UIDB/00013/2020 和 UIDP/00013/2020（第二作者）以及 MTM2016‐76969‐P（MINECO/AEI/FEDER,\
  \ UE）（第三作者）的支持下完成的。在此致谢。\n\n| 2021 年 5 月 | | Jacobo de Uña‐Álvarez, Carla Moreira\
  \ 和 Rosa M. Crujeiras Vigo, V. N. Famalicão 和 Santiago de Compostela |\n\n# 缩写表\n\
