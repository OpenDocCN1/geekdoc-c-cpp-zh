  \n## 4.2 比例风险回归\n\n生存分析中应用广泛的回归模型是 Cox 比例风险模型，它利用了 第 3.6 节 中引入的风险函数。Cox 模型（例如 Klein\
  \ 和 Moeschberger (2003)）表明不同协变量值对应的风险函数之间相互成比例。更具体地说，令 `images/c04-i0167.png` 为基准风险函数，令\
  \ `images/c04-i0168.png` 为回归系数向量。那么，在 Cox 模型下，给定 `images/c04-i0170.png` 时 `images/c04-i0169.png`\
