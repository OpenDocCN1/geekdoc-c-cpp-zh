  \ 置信区间的方法允许构建双重截断下累积分布函数（cdf）的点逐置信带。有人可能会认为，这些带无法保证目标曲线的全局覆盖。作为自助法的替代方案，Emura 等人\
  \ (2015) 为 NPMLE（非参数极大似估计）的渐近协方函数提出了一个闭形式估计量，从而能够构建全局（等精度和 Kolmogorov–Smirnov 型）置信带。通过使用自助重复进行的一些模拟实验，作者观察到等精度置信带的性能略好，且\
  \ Kolmogorov–Smirnov 带表现出符合预期的保守行为，这在非截断数据中也是如此。实际上，这两种方法的灵感都来源于删失数据的置信带（见 Klein\
  \ 和 Moeschberger (2003), 第 4.4 节），最初由 Nair (1984) 提出的等精度预测带，以及 Hall 和 Wellner (1980)\
  \ 提出的 Kolmogorov-Smirnov 带。\n\n标准误的估计和置信区间的构建对于其他目标同样重要。例如，人们可能均值的估计感兴趣，对于恒等函数 ![phi\
  \ left-parenthesis x right-parenthesis equals x](img/c02-i0766.png)，均值可以写为 ![mu\
  \ equals integral phi normal d upper F](img/c02-i0765.png)。推论 2.1.18 给出了经验均值 ![mu\
  \ Subscript n Baseline equals integral x normal d upper F Subscript n left-parenthesis\
