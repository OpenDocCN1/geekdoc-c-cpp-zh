  \ 由相应蒙特卡洛近似的最小化值近似。\n\n尽管由于性能较优可以推荐半参数估计器 (3.5)，但需要预先为截断变量选择参数模型。正如在第 2.2.1 节 中讨论的样，这是微妙的，因为不合适的截断模型会导致估计器产生巨大的系统偏差；请有关这方面的细节和插图。在接下来的两个例子中，我们考虑两个真实数据集的\
