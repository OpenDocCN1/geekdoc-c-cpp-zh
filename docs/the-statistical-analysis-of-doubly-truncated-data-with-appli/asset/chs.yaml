  \n标准误差可以被视为获取给定估计量变异信息最简单的方法。然而，通常通过置信区间可以更好地可视化这种变异性。对于双截断数据，可以使用 SB 和 OB 方法来实现这一目的，我们现在进行详细阐述。在双截断下产生置信区间的其他替代路径包括经验似然比率法（Shen,\
  \ 2011）。\n\n作为第一种方法，可以利用 ![upper F 下标 n 左(x)](img/c02-i0730.png) 的渐近正态性，并使用自助重采样算法计算自助标准误差\
