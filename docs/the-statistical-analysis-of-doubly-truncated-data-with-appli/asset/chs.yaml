  \ 3.4.1 节中的标准参考规则以及第 3.4.2 节中的插入法（plug-in）带宽选择程序是基于对 AMISE 的适当估计量的最小化。在接下来的节中，我们将通过对模拟数据和真实数据的分析，说明几种核密度带宽选择器的实际性能。\n\
  \n### 3.4.5 实践中的带宽选择器\n\nMoreira 和 Van Keilegom (2013) 通过仿真广泛研究了标准参考规则、插入法、最小二乘交叉验证和平滑自助法带宽的性能。他们考虑的样本量从\
  \ ![n equals 50](img/c03-i0271.png) 到 ![n equals 500](img/c03-i0272.png) 不等，并具有双截断的不同模型。与非参数估计器\
  \ ![f Subscript h](img/c03-i0274.png) 相比，选择器报告的半参数估计器 ![f Subscript h Baseline left-parenthesis\
  \ dot semicolon theta Subscript n Baseline-parenthesis](img/c03-i0273.png) 的带宽值通常更小。这与表\
  \ 3.1 一致。重要的是，发现随着样本量的增加，带宽选择器的表现越来越一致，趋近于 MISE 的最小化值 ![h Subscript MISE](img/c03-i0275.png)。有趣的是，即使在选择器并不接近最佳平滑程度的情况下，所得密度估计器的\
  \ MISE 也仅比最小 MISE 略大。关于选择器的相对行为，Moreira 和 Van Keilegom (2013) 发现 LSCV 与其他选择器相比存在过度离散；因此，在实践中应用\
  \ LSCV 准则可能存在风险。另一个发现是自助法带宽与插入规则相比存在过度平滑。在这里，我们通过对第 2.1.3 节中引入的场景 I 和 II 启动一组样本量为\
  \ ![n equals 100](img/c03-i0276.png) 和 ![n equals 500](img/c03-i0277.png) 的模拟实验来阐明这些问题。\n\
  \n在示例 3.3.5 和 3.4.2 中，我们已经看到忽略双截断的朴素估计量可能会产生巨大的偏差。在接下来的示例中，我们研究了朴素方法如何可能对修正后估计器所需的最佳平滑程度(3.4)做出错误决策。这说明了对双截断的修正在带宽选择中也同样重要。\n\
  \n从现有证据可以得出，插入法 DP![normal upper I 1](img/c03-i0362.png) 和 DP![normal upper I 2](img/c03-i0363.png)\
  \ 总体表现良好，而 LSCV 表现出合理，但方差大于其他方法。标准参考带宽的性能也很好，特别是考虑到它的简单性。最后，平滑自助法倾向于对密度估计进行过度平滑。\n\
  \n## 3.5 核密度估计中的进一步问题\n\n从实践角度来看，为从业者提供带宽选择方法无疑是有意义的，但目标的概率分布可能表现出更具挑战性的模式，例如在观测范围内呈现出相对不同的平滑程度。在这种情况下，旨在为整个密度提供最佳平滑程度的全局带宽选择器可能无法提供充分的估计曲线。\n\
  \n当底层密度在 ![upper X](img/c03-i0367.png) 的支撑上需要不同程度的平滑度时(3.4)中的核密度估计器可以使用局部带宽定义如下：\n\
  \n![f Subscript h left-parenthesis x right-parenthesis Baseline left-parenthesis\
  \ x right-parenthesis equals integral upper L Subscript h left-parenthesis x right-parenthesis\
  \ Baseline left-parenthesis x minus t right-parenthesis normal d upper F Subscript\
  \ n Baseline left-parenthesis t right-parenthesis equals alpha Subscript n Baseline\
  \ StartFraction 1 Over n EndFraction sigma-summation Underscript i equals 1 Overscript\
  \ n Endscripts upper L Subscript h left-parenthesis x right-parenthesis Baseline\
  \ left-parenthesis x minus upper X Subscript i Baseline right-parenthesis upper\
  \ G](img/c03-i0367.png)\n\n![f Subscript h left-parenthesis x right-parenthesis](img/c03-i0368.png)\
  \ 的渐近等效版本由给出\n\n![f Subscript h left-parenthesis x right-parenthesis equals alpha\
  \ Subscript n Baseline StartFraction 1 Over n EndFraction sigma-summation Underscript\
  \ i equals 1 Overscript n Endscripts upper L Subscript h left-parenthesis x right-parenthesis\
  \ Baseline left-parenthesis x minus upper X Subscript i Baseline right-parenthesis\
  \ upper G](img/c03-i0368.png)正如 Wand 和 Jones (1995) 在其第 2.10 节中所出的，使用局部带宽 ![h-parenthesis\
  \ x right-parenthesis](img/c03-i0369.png)相当于在每个位置考虑不同的核。局部平滑的另一种途径是最近邻带宽，当 ![h left-parenthesis\
  \ x right-parenthesis](img/c03-i0370.png) 定义为从 ![x](img/c03-i0371.png) 到第 ![k](img/c03-i0372.png)\
  \ 个最近样本点的距离时。在实际计算中，必须选择 ![k](img/c03-i0373.png)。对于半参数估计器 ![f Subscript h Baseline\
  \ left-parenthesis dot semicolon theta Subscript n Baseline right-parenthesis](img/c03-i0374.png)，也可以采取类似的方法。\n\
  \n核密度估计被经常用于数据探索。这里的一个相关问题是观察到的特征是来自底层真实的，还是仅仅由采样伪影造成的。为了回答这类问题，需要某种附加密度估计的不确定性度量。这里的一个问题是估计器的偏差以及方差取决于未知的底层密度\
  \ ![f](img/c03-i0375.png)，阻碍了概率密度点置信间的计算。尽管存在这些困难，可以使用量化估计器变异的方法。Simonoff (2012)\
  \ 建议构建基于自助法的变异图，通过在固定网格点上计算自助抽样的核密度估计。然后，对于网格中的每个值，计算 2.5%和 97.5%的自助位数以描绘变异包。这种自助方法在双截断数据上也是可能的。第\
  \ 2.1.4 节中提出的简单自助和明显自助是两种可用于此目的的适当重采样算法，类似于针对 CDF ![upper F](img/c03-i0376.png)\
  \ 所对应的密度 ![f](img/c03-i0377.png) 所做的做法。\n\n\n\n\n\n另一种方案是构建变异带（variability band），正如\
