  \n图 3.4（艾滋病输血数据，示例 3.3.5）。左图：潜伏期偏置函数的非参数（黑线）和半参数（红线）估计量。右图：潜伏期累积分布函数（cdf）的非参数（黑线）和半参数（红线）估计量。\n\
  \n在下一节中，我们将介绍一些数据驱动的带宽选择方法。其中一些建议将直接基于 (3.11)，而另一些则考虑一个待最小化的误差度量的近似值。\n\n## 3.4\
  \ 数据驱动的带宽选择\n\n表达式 (3.4) 和 (3.5) 需要适当的带宽值 `h`![images/c03-i0156.png)才能在实践中有效应用。如前节所述，带宽选择器可以从两个视角进行设计。一方面，可以采用最优全局带宽的表达式，例如\
  \ (3.11) 中的 `h` Subscript AMISE![images/c03-i0157.png)，并将其中的未知量替换为样本对应项。第一类带宽选择器被称为摄入法规则（plug-in\
  \ rules）。我们将引入一种正态参考带宽，它是 Silverman (1986) 在双侧截断情况下的经验法则（rule-of-thumb）的类似物；以及一种遵循\
  \ Sheather 和 Jones (1991) 思想的摄入法规则。另一方面，可以直接考虑一个（估计的）误差表达式，然后寻找使该误差准则最小化的 `h`![images/c03-i0158.png)。这是其他方法（如交叉验证规则和自助法带宽）的哲学基础。为了避免不必要的重复，我们将限制在半参数估计量\
  \ `f` Subscript h(dot theta Subscript n)![images/c03-i0159.png)。在后续节中的思想可以以明显的方式适用于非参数估计量\
  \ `f` Subscript h![images/c03-i0160.png)。\n\n### 3.4.1 正态参考带宽选择\n\n在最优带宽 (3.11)\
  \ 的表达式中出现了两个未知量：`R(f-prime)`![images/c03-i0161.png) 和 `alpha integral G(x) Superscript\
  \ -1 f(x) normal dx`![images/c03-i0162.png]。对于 `R(f-prime)`![images/c03-i0163.png)，遵循\
  \ Silverman 经验法则的思想，可以假设 `f`![images/c03-i0164.png) 服从具有特定方差 `sigma squared`![images/c03-i0165.png)\
  \ 的高斯分布。使用埃米特多项式的简单计算得出 `R(f-prime) equals three eighths pi Superscript -1/2 sigma\
  \ Superscript -5`![images/c03-i0166.png)。此外，如果使用高斯核，还可以计算 `R(L)`![images/c03-i0167.png)\
  \ 和 `mu 2(L)`![images/c03-i0168.png)，最优带宽由 (3.12) `h Subscript AMISE equals [bracket\
  \ four thirds alpha integral G(x) Superscript -1 f(x) normal dx [bracket] 1/5 sigma\
  \ Superscript -1/5]`![images/c03-math-0015.png)。\n\n如果总体是多峰的，(3.12) 中的带宽可能会导致过度平滑，因为\
  \ `R(f-prime)`![images/c03-i0169.png) 相对于标准差较大（Silverman, 1986；Wand and Jones, 1995）。使用稳健的变异量可以获得更好的结果；例如，通过考虑底层正态分布的分位数位距（IQR）作为更稳健的度量：`h\
  \ Subscript AMISE equals 0.79 IQR Superscript -1/5 [bracket alpha integral G(x)\
  \ Superscript -1 f(x) normal dx [bracket] 1/5]`![images/c03-math-0016.png)。\n\n\
  在经典语境下，Silverman (1986) 建议在计算 `h` Subscript AMISE 时使用 `sigma`![images/c03-i0170.png)\
  \ 和 IQR 之间的最小值，以减少过度平滑的风险。这引出了以下带宽参数：`h caret Subscript NR equals [bracket four\
  \ thirds alpha(theta Subscript n) integral G(x; theta Subscript n) Superscript -1\
  \ normal d F(x; theta Subscript n) [bracket] 1/5 min (sigma, 0.79 IQR) n Superscript\
  \ -1/5, 2nd Column 3rd Column End]`其中未知的 `alpha`![images/c03-i0172.png)、`G`![images/c03-i0173.png)\
  \ 和 `f`![images/c03-i0174.png) 已被替换为合适的估计量。在双侧截断下，`sigma squared`![images/c03-i0175.png)\
  \ 可以 (3.13)`sigma squared equals alpha(theta Subscript n) integral (x - M(theta\
  \ Subscript n))² G(x; theta Subscript n) Superscript -1 normal d F_n Supers asterisk\
  \ (x), comma]`![images/c03-math-0018.png) 进行估计，其中 `F_n Supers asterisk`![images/c03-i0176.png)\
  \ 是 `X Subscript i`![images/c03-i0177.png) 的普通经验分布函数，见 (2.1)，且 `M(theta Subscript\
  \ n) = alpha(theta Subscript n) integral G(x; theta Subscript n) Superscript -1\
  \ normal d F_n Supers asterisk (x), comma]`![images/c03-math-0019.png)，而 IQR 被替换为\
  \ `IQR equals F_n Superscript -1 (0.75; theta Subscript n) - F_n Superscript -1\
  \ (0.25; theta Subscript n)`![images/c03-i0178.png)。如果概率密度函数足够光滑，该选择器将提供合理的估计，否则由于对*曲率*项\
  \ `R(f-prime)`![images/c03-i0179.png) 的近似过于简化，会导致过度平滑。\n\n### 3.4.2 摄入法带宽选择\n\n\
  对该量更复杂的近似会产生其他摄入法选择器，如下一节所示。\n\n\n\n\n\n正态参考带宽的思路是通过假设 ![f](img/c03-i0181.png) 是方差为\
