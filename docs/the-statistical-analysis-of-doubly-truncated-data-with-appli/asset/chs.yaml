  \ 的 `cdf` ![upper K](img/c02-i0794.png)（累积分布）的外部信息。例如，在区间采样下，![upper K](img/c02-i0796.png)\
  \ 由出生过程的速率决定，该速率可能符合某种特定的已知模式。一个显著的例子是稳态情况，此时出生过程遵循齐次的 `Poisson` 模型。在这种情况下，左、右截断限在各自对应的支撑区间上呈均匀分布，因此\
  \ ![upper K Subscript upper U](img/c02-i0797.png) 和 ![upper K Subscript upper V](img/c02-i0798.png)\
