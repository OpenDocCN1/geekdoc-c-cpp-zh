  \n\n\n竞争风险数据经常出现在生存分析和可靠性工程等领域。竞争风险涉及存在两种以上事件类型的情况。例如，在生存分析中，这可能是由于识别出多种死亡原因导致的；在工程学中，对两种或更多类型的失败进行单独调查也会导致竞争风险设置的出现。在竞争风险下，事件时间\
  \ ![upper X](img/c05-i0139.png) 带有事件类型指示符 ![eta](img/c05-i0140.png)，其取值位于集合 ![StartSet\
  \ 1 comma ellipsis comma upper R EndSet](img/c05-i0141.png) 之中。这里，![upper R](img/c05-i0142.png)\
  \ 是不同事件类型的数量。事件类型指示符 ![eta](img/c05-i0143.png) 可以被视为第 4 章中向量 ![upper Z](img/c05-i0144.png)\
  \ 的一个协变量。这种识别方式非常方便，因为正如我们将看到的，通过应用上一章的思想和结果，可以获得构造估计量的大量直觉。然而，![eta](img/c05-i0145.png)\
