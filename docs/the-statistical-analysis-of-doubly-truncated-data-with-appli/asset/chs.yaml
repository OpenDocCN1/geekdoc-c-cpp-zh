  \n其中\n\n![eta_{\\tilde{X}_i, U_i, V_i}](img/c02-math-0043.png)\n\n\n\n\n# 自助法方法\
  \ (Bootstrap Methods)\n\n自助法传统上用于估计标准误差，更广泛地说，用于各种设定下的采样分布。对于随机截断数据，已经提出并研究了两种不同的自助采样方案：简单自助法\
  \ (`SB`) 和而易见的自助法 (`OB`)。\n\n虽然 `SB` 从 ![left-parenthesis upper X 1 comma upper\
  \ U 1 comma upper V 1 right-parenthesis comma ellipsis comma left-parenthesis upper\
  \ X Subscript n Baseline comma upper U Subscript n Baseline comma upper V Subscript\
  \ n Baseline right-parenthesis](img/c02-i0666.png) 进行放重采样，而 `OB` 则需要先对 ![upper F](img/c02-i0667.png)\
  \ 和 ![upper K](img/c02-i0668.png) 进行初步估计才能进行。具体来说，`OB` 从 ![upper F Subscript n Baseline\
  \ left-parenthesis x right-parenthesis equals n Superscript negative 1 Baseline\
  \ sigma-summation Underscript i equals 1 Overscript n Endscripts ModifyingAbove\
  \ phi With Ì‚ Subscript i Baseline upper I left-parenthesis upper X Subscript i\
  \ less-than-or-equal-to x right-parenthesis](img/c02-i0670.png) 获取 ![upper X](img/c02-i0669.png)\
  \ 值，![left-parenthesis upper U comma upper V right-parenthesis](img/c02-i0671.png)\
  \ 对独立地从 ![upper K Subscript n Baseline left-parenthesis u comma v right-parenthesis\
  \ equals n Superscript negative 1 Baseline sigma-summation Underscript i equals\
  \ 1 Overscript n Endscripts ModifyingAbove psi With Ì‚ Subscript i Baseline upper\
  \ I left-parenthesis upper U Subscript i less-than-or-equal-to u comma upper V Subscript\
  \ i less-than-or-equal-to v right-parenthesis](img/c02-i0672.png) 中抽取，最后，如果出现 ![upper\
  \ X less-than upper U](img/c02-i0674.png) 或 ![upper X greater-than upper V](img/c02-i0675.png)，则丢弃三元组\
  \ ![left-parenthesis upper X comma upper U comma upper V right-parenthesis](img/c02-i0673.png)。重复此过程直到获得满足\
  \ ![upper U less-than-or-equal-to upper X less-than-or-equal-to upper V](img/c02-i0676.png)\
  \ 的有效三元组。因此，`OB` 为满足 ![upper U Subscript j less-than-or-equal-to upper X Subscript\
  \ i less-than-or-equal-to upper V Subscript j](img/c02-i0678.png) 的三元组 ![left-parenthesis\
  \ upper X Subscript i Baseline comma upper U Subscript j Baseline comma upper V\
  \ Subscript j right-parenthesis](img/677.png) 赋予正权重，其中（与 `SB` 不同）![i not-equals\
  \ j](img/c02-i0679.png) 是可能的。为了清晰和方便参考，这些采样方案在以下两个定义中详细列出。\n\n## 理论背景\n\n在左截断设定下，Gross\
  \ 和 Lai (1996) 讨论了 `SB` 和 `OB` 方法之间的差异，他们利用 Edgeworth 展开研究了简单自助法对于左截断右删数据的理论有效性。在他们的设定中，`OB`\
  \ 的应用并不简单，因为涉及到截断变量与剩余右删变量之间的平滑处理或独立性条件。然而，在没有删的情况下，即使从两侧（左侧和右侧）发生截断，这些这些复杂性。双截断数据的自助法理论尚未开发。\n\
  \n## 之前的方法\n\n之前的自助方法可用于估计 ![upper F Subscript n Baseline left-parenthesis x right-parenthesis](img/c02-i0696.png)\
  \ 的标准误差，随后计算置信区间。具体而言，Emura 等 (2015) 和 de Uña-Álvarez (2020) 分析了基于 `SB` 的 ![upper\
  \ F Subscript n Baseline left-parenthesis x right-parenthesis](img/c02-i0697.png)\
  \ 标准误差的准确性。这些论文中的模拟研究表明该方法性能良好，对于样本量小到 ![n equals 50](img/c02-i0698.png) 的也是如此。因此，即使对\
  \ `SB` 在双截断设定下的理论属性认知有限且应当保持谨慎，我们通常在应用中推荐它。\n\n## 模拟结果\n\n为了说明并比较 定义 2.1.20 和 2.1.21\
  \ 中引入的两种自助方法的性能，我们报告了考虑 第 2.1.3 节 中描述的情景 I 和 II 的模拟结果，这些场景对应于没有/有采样偏的 ![upper F](img/c02-i099.png)\
  \ 情况。我们首先关注通过 `SB` 和 `OB` 对标准误差的估计，并以大量蒙特卡洛复制近似的*真实*标准误差为基准。在 表 2.2（情景 I）和 表 2.3（情景\
