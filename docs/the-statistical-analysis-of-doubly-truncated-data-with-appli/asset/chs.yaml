  \ **9**,521–533.\n\n# 4 回归分析\n\n双截断变量也可能涉及回归设置。在本章中，我们考虑了双截断响应变量 ![upper X](img/c04-i0001.png)\
  \ 和协变量向量 ![upper Z](img/c04-i0002.png)，这些协变量可以是分类或数值的、连续或离散的。首先，与经典回归模型的不同特征是，观测偏差（observational\
  \ bias）中随机双截断的影响将在第 4 节 中进行分析。文中还介绍了两种回归模型。一方面，第 4.2 节](#c04.xhtml_c04-sec-02) 致力于\
  \ Cox 比例风险模型，这是生存分析中最流行的模型。另一方面，第 4.3 节 考虑了广泛应用于可靠性工程的加速失效模型。之前的模型依赖于参数形式的，但与第 3\
  \ 章研究的密度一样，平滑方法可以作为回归函数的非参数考虑。这将在第 4.4 节](#c04-sec-04) 中完成。\n\n## 4.1 回归中的观测偏差\n\
