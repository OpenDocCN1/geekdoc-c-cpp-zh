  \ `DTDA` 包中的函数进行数据分析。然而，`R` 中还有其他包（`R` Core Team, 2020）也可以用于分析双截断数据；其中一些包已经在书的章节中提到过。在本附录中，我们将简要回顾包含在包\
  \ `DTDA.ni`（de Uña‐Álvarez and Soage, 2018）、`DTDA.cif`（de Uña‐Álvarez and Soage,\
  \ 2020）、`SurvTrunc`（Rennert, 2018）以及 `double.truncation`（Emura et al., 2019）中的函数，连同本书插图示例中使用的\
  \ `DTDA` 相关函数。请参考 Moreira et al. (2010) 了解 `DTDA` 的介绍，并参考 Moreira et al. (2021)\
  \ 了解其最新版本 3.0 中包含的新函数的描述。\n\n`DTDA` 包含了多种函数，允许通过不同的算法从双截断数据计算非参数极大似然估计（NPMLE），并结合自助法置信区间，以及在此设定下使用合适的带宽选择器获取密度函数和风险函数的核估计。`DTDA.ni`\
  \ 实现了一种避免迭代过程的 NPMLE 替代估计量；关于这种非迭代估计量的的细节，请参阅 de Uña‐Álvarez (2018)。`double.truncation`\
  \ 包包含一个用于获取带渐近标准误的 NPMLE 的函数（Emura et al., 2015）。`double.truncation` 中实现的基于似然的方法也允许计算参数估计。`SurvTrunc`\
  \ 允许通过自助法标准误获取 NPMLE。此外，通过 Rennert and Xie (2018) 提出的 Cox 回归也可以通过 `SurvTrunc` 实现。最后，可以使用\
  \ `DTDA.cif` 进行竞争性风险的累积发生率估计，它提供了 de Uña‐Álvarez (2020a) 中提出的两种不同估计量。`DTDA.cif`\
  \ 同样提供累积发生率的自助法标准误。\n\n下文将简要描述这些函数和包（记作 `function` (`package`))），并根据进行双截断数据分析时最相关的任务进行组织。在\
  \ de Uña‐Álvarez (2020b) 中可以找到对其中几个函数的比较研究。\n\n## A.1 计算 NPMLE 和标准误\n\n- `efron.petrosian`\
  \ (`DTDA`): 使用 Efron 和 Petrosian 的第一种算法计算 NPMLE 估计量。可以使用简单的自助方法计算逐点置信限。\n- `lynden`\
  \ (`DTDA`): 使用 Efron 和 Petrosian 的第二种算法计算 NPMLE 估计量。与上一个相同，也可以获得简单的自助（逐点）置信带。\n\
  - `shen` (`DTDA`): 使用 Shen 的算法计算 NPMLE 估计量，并结合截断变量的边缘分布。也可以计算自助法（使用简单或显而易见的方法）。\n\
  - `DTDAni` (`DTDA.ni`): 该函数针对区间宽度为 `tau` 的区间采样场景，产生双截断变量累积分布的非迭代估计量。该函数不提供置信带。\n\
  - `NPMLE` (`double.truncation`): 使用 Shen 的算法计算 NPMLE，并使用 Emura et al. (2015) 中的渐近方差公式获取标准误。\n\
  - `cdfDT` (`SurvTrunc`): 同样使用 Shen 的算法，该函数通过简单的自助法和正态近似法提供 95% 置信限。\n\n## A.2 评估\
  \ NPMLE 的存在性与唯一性\n\n可以通过以下方式检查 NPMLE 存在性和唯一性的必要条件：\n\n`min(c1)` 和 `min(c2)` 必须严格大于\
  \ 1，否则 NPMLE 不存在或唯一。`DTDA` 中的函数在 `min(c1)==1` 或 `min(c2)==1` 时会报告警告信息。\n\n正如 Xiao\
  \ 和 Hudgens (2019) 所提到的，可以使用 `igraph` 包来确定 NPMLE 存在且唯一的子样本。\n\n## A.3 半参数估计与参数估计\n\
  \n`PMLE.dist` (`double.truncation`): 一系列执行参数估计的函数。考虑的分布包括 `loglogistic`、`lognormal`、`Weibull`\
  \ 和指数族。估计通过极大似然法进行。\n\n关于半参数估计，需要注意的是，尽管没有特定的函数，但有许多函数允许包含权重。为了这一目的，建议在向量中保留估计结果。\n\
  \n## A.4 核估计\n\n- `densityDT` (`DTDA`): 该函数计算双截断下的核密度估计。参数 `bw` 允许不同的带宽选择器，具体为：正态参考规则\
  \ (`NR`)、单两阶段插件法 (`DPI1`, `DPI2`)、最小二交叉验证 (`LSCV`) 或平滑自助 (`SBoot`)。\n- `hazardDT`\
  \ (`DTDA`): 该函数计算双截断下的风险函数核估计，使用 LSCV 带宽。\n\n## A.5 回归分析\n\n- `coxDT` (`SurvTrunc`):\
  \ 该函数允许对双截断生存时间拟 Cox 比例回归模型。它还计算自助标准误和置信区间。它实现了 Rennert and Xie (2018) 的方法。\n\n\
  Mandel et al. (2018) 提出的 Cox 回归可以通过 `survival` 包中的 `coxph` 函数通过引入权重作为偏移量（offset）来实现。在这种情况下，`coxph`\
  \ 给出的标准误无效的，必须通过自助法重新计算。\n\n## A.6 竞争性风险\n\n- `DTDAcif` (`DTDA.cif`): 该函数非参数地估计双截断下竞争性风险的累积发生率。\n\
  \n## A.7 数据模拟\n\n- `rsim.DT` (`DTDA`): 生成具有两种不同观测偏差模式的双截断随机数据，由参数 `model` 和 `tau`（采样区间宽度）指定。实现的两个模型对应于\
  \ 第 2.1.3 节 中的模拟场景 I 和 II。\n\n\n\n\n\n`simu.Weibull` (`double.truncation`): 从 Weibull\
  \ 模型随机生成双截断数据。参数 `mu` 和 `sigma` 对应于 Weibull 参数，`delta` 控制包含概率。\n\n## A.8 准独立性检验\n\
  \n`indeptestDT` (`SurvTrunc`): 该函数基于条件 Kendall's Tau 计算准独立性检验结果。\n\n## A.9 依赖截断\n\
  \n`BiCopPDF` (`VineCopula`): 该函数评估给定二元拷贝函数（copula）的概率密度函数（pdf）。参数 `family`（数字）允许考虑\
  \ Clayton 和 FGM 拷贝函数等。\n\n## 参考文献\n\n1. de Uña‐Álvarez J 2018 A non‐iterative estimator\
