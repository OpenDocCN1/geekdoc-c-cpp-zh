  \ t Baseline minus 1 right-parenthesis) Superscript negative 1 Baseline normal d\
  \ t](img/c05-i0443.png) 是第一类德拜函数。\n\n3.  **C3. 法尔利-古姆贝尔-摩根斯特恩 copula (FGM copula)**：![script\
  \ upper C Subscript theta Baseline left-parenthesis s 1 comma s 2 right-parenthesis\
  \ equals s 1 s 2 plus theta s 1 s 2 left-parenthesis 1 minus s 1 right-parenthesis)\
  \ left-parenthesis 1 minus s 2 right-parenthesis](img/c05-i0444.png), ![theta element-of\
