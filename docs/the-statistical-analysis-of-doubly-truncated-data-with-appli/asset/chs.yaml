  \ **58**, 513–523.\n\n# 3\n\n## 平滑方法\n\n第 2 章 主要关注分布函数的估计，将 NPMLE（第 2.1 节)）以及半参数和参数变（第\
  \ 2.2 节)）作为刻画目标变量 ![upper X](img/c03-i0001.png) 行为的参考函数。虽然从理论角度来看这些估计量的有效性是毫无疑问的，但分布函数作为累积概率函数，可能无法揭示某些数据特征如偏度或多峰性。这些特征通常通过密度或风险函数的平滑估计能更好地揭示，而这些估计可以通过核方法获得。\n\
  \n本章的目标是描述在双截断设置下如何构造 pdf（第 3.2 节）和风险函数（第 3.6 节）的核估计。我们还分析了它们的渐近性质并通过示例说明了估计量。请注意，在我们的文中，截断模式必须反映在估计量的构造中。熟悉核密度估计的人都会注意到带宽问题，这是一个必须考虑的问题。在\
  \ 第 3.4 节 中，我们为双截断 ![upper X](img/c03-i0002.png) 了一些核密度估计程序。风险带宽也将进行讨论。\n\n### 3.1\
  \ 核估计背景\n\n参考 Silverman (1986) 或 Wand 和 Jones (1995) 关于核密度的全面综述，但让我们介绍一些有助于理解当 `X`\
  \ 为双截断时出现的基本概念。具体来说，在非截断场景下，考虑 `X_1, ..., X_n` (images/c03-i004.png) 为 `X` (images/c03-i005.png)\
  \ 的随机样本，其 pdf 为 `f`。用 `F_n*` (images/c03-i007.png) 表示从样本得到的经验累积分布函数。核密度估计量定义为：\n\
  \n(3.1\n```\nf_h(x) = 1/n \\sum_{i=1}^n L_h(x - X_i) = \\int L_h(x - t) dF_n^*(t)\n\
  ```\n其中 `L_h(t) = h^{-1}L(t/h)` (images/c03-i008.png) 是缩放后的核（`L` 这里的`L` 通常为对称密度函数），且\
  \ `h = h_n` (images/c03-i0010.png) 是确定性带宽序列，当 `n \\to \\infty` (images/c03-i0012.png)\
  \ 时 `h_n \\to 0` (images/c03-i0011.png)。对于固定的 `x` (images/c03-i0013.png)，可以看到：\n\
  \n[(3.2\n```\nE[f_h(x)] = f(x) + (h²/2)\\mu²(L)f''(x) + o(h²), \\mu²(L) = \\int\
  \ t² L(t) dt\n```\n(images/c03-math-0002.png)\n\n并且如果 `nh_n \\to \\infty` (images/c03-i0014.png)，则也可以获得方差：\n\
  \n\n\n\n\n(3.3)![Var left-parenthesis f Subscript h Baseline left-parenthesis x\
  \ right-parenthesis right-parenthesis equals StartFraction upper R left-parenthesis\
  \ upper L right-parenthesis Over n h EndFraction f left-parenthesis x right-parenthesis\
  \ plus o left-parenthesis left-parenthesis n h right-parenthesis Superscript negative\
  \ 1 Baseline right-parenthesis comma upper R left-parenthesis upper L right-parenthesis\
  \ equals integral upper L left-parenthesis t right-parenthesis squared normal d\
  \ t period](img/c03-math-0003.png) \n\n固定点![x](img/c03-i0015.png)处的均方误差（MSE）从(3.2)和(3.3)直接得到。从上述表达式可以明显看出，减小偏差的![h](img/c03-i0016.png)值必然会增大方差。因此，MSE\
  \ 作为偏差平方和方差之和，似乎是一个合适的误差度量，通过在![h](img/c03-i0017.png)上对其最小化（实际上是对 MSE 的近似值进行最小化），可以导致最优带宽值。然而，这种带宽将是局部的，因为它最小化的是固定![x](img/c03-i0018.png)处的误差。为了获得全局带宽，人们可以考虑\
  \ MSE 的积分版本，即均值积分平方误差（MISE），甚至可以以积分平方误差（ISE）作为最优带宽选择的起点。\n\n尽管上述想法看起来是合理的，但需要注意的是，待最小化的局部和全局误差测量涉及某些取决于目标密度![f](img/c03-i0019.png)的未知量。带宽选择器的目标是为![h](img/c03-i0020.png)提供数据驱动的值，以便在实践中使用。带宽选择器可以从两个角度构建。一方面，可以显式地推导出最优带宽的表达式，然后尝试近似其中的未知量；这些被称为代入规则（plug-in\
  \ rules）。另一方面，给定一个误差度量，可以直接近似误差表达式并获得达到最小值的带宽值，例如在交叉验证或自助法（bootstrap）程序中。\n\n在接下来，我们将调整(3.1)中的核估计器用于双截断变量，我们还将引入一些平滑选择器，如正态参考、代入、交叉验证和自助带宽。关于对于不同形式的不完整或偏偏数据的密度和风险函数进行核估计的现有文献，包括\
  \ Jones (1991)、Cai (1998)和 Zhou (1999)等。\n\n## 3.2 估计密度函数\n\n回想(3.1)给出的非截断场景下的核密度估计器表达式。如果现在目标变量![upper\
