    # Providing search suggestions using the SearchPane class


    When your app is used to search for content, Windows automatically provides a
    history of the user''s recent searches. You can enhance the user experience by
    providing query suggestions and result suggestions in your app. You might decide
    to support only one of them based on your app''s requirements and design decisions.
    Your app can obtain search suggestions from a variety of sources, such as:


    +   - From a remote web service, a local database, or a static list in the app


    +   - From a uniform resource locator (URL) that supports suggestions in the OpenSearch
    format


    +   - From a URL that supports suggestions in the XML search suggestions format


    > MORE INFO OPENSEARCH FORMAT AND XML SEARCH SUGGESTIONS


    You can learn about the OpenSearch format specification at http://www.opensearch.org/Specifications/OpenSearch/Extensions/Suggestions.
    The XML search suggestions specification is available at http://msdn.microsoft.com/library/cc89108.aspx.'
