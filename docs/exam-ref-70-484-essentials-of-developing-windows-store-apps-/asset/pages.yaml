  md: "Navigating event of the Frame has a property called Cancel that cancels the\
    \ navigation when set to True. If the navigation is not canceled by the user,\
    \ any one of the three events is raised in the Frame. If the navigation completes\
    \ successfully, the Navigated event is raised. If the navigation fails, the NavigationFailed\
    \ event is raised, and if Navigate is invoked before the current navigation completes,\
    \ the NavigationStopped event is raised. Within a page, the OnNavigatingFrom event\
    \ can be used to cancel the navigation by setting the Cancel property of the NavigatingCancelEventArgs\
    \ instance to True.\n\nWhile navigating pages, Page instances are created as the\
    \ user moves forward or backward in the navigation. If you need to maintain state\
    \ within a page in your app, you must remember to do it manually. The system provides\
    \ a way to change this behavior to suit your app's requirements via the NavigationCacheMode\
    \ property of the Page class. Caching is defined by page, and the default behavior\
    \ for a page is that it is never cached. You can change this behavior to either\
    \ Required or Enabled, which keeps the instance in the cache irrespective of the\
    \ size of the cache but it is discarded as soon as the size of the cache for the\
    \ page is exceeded. The default limit of the number of pages a Frame can cache\
    \ is 10; it can be changed by setting the CacheSize property to a different value.\
    \ You should note that increasing the CacheSize can cause the consumption of memory\
    \ to increase, and the system can shut down your app.\n\nPages in a Windows App\
    \ are added and removed from the history as the user navigates the app. The Frame\
    \ class provides two methods to navigate among pages in the navigation history.\
    \ The GoBack method navigates to the previous item in the navigation history;\
    \ the GoForward method navigates to the next item in the navigation history. The\
    \ following code checks the value of the properties CanGoBack and CanGoForward\
    \ to determine whether there are pages in the navigation history with respect\
    \ to the current position in the navigation history:\n\n```\nprivate void GoBack()\n\
    {\n    if (this.Frame != null && this.Frame.CanGoBack)\n    {\n        this.Frame.GoBack();\n\
    \    }\n}\n```\n\n```\nprivate void GoForward()\n{\n    if (this.Frame != null\
    \ && this.Frame.CanGoForward)\n    {\n        this.Frame.GoForward();\n    }\n\
    }\n```"
