  md: '# Program the user interaction


    The Windows 8 Start screen is a collection of tiles. Some tiles are updated regularly
    with new text or images, and they can contain a badge that informs the user of
    the status of an action or update. A tile on the Start screen launches an app.
    Your app''s tile is a way to communicate with the user when it is not running.
    Therefore, you should use your app''s tile to show fresh content and the latest
    status with badges. Users often like to bookmark items. Secondary tiles in Windows
    8 are used to pin a shortcut to an item or a page in your app on the Start screen.


    Your app might need to draw the user''s attention to perform a critical task by
    launching when it is not running. Live tiles are not adequate for this when the
    user is inside another app. In such cases, your app can send a notification that
    pops up on the top of the screen. Tapping the task launches your app. Toast notifications
    are initiated from your app or by a remote service. You can schedule notifications
    to be shown in the future, for example, to show a reminder for a task. A toast
    typically consists of text and an image, and you can optionally play a sound when
    it is displayed.


    A well-defined Windows Store app should work properly irrespective of the device
    on which it is running. Your app might be used with a touchscreen, a hardware
    or software keyboard, or a pen/stylus device (generally referred to as a "stylus"
    throughout the chapter). The behavior of your app when using gestures in your
    app manipulate content and interact in a variety of ways. Windows 8 apps support
    stylus device input, with inking support for drawing-capturing, rendering, selecting,
    and deleting ink strokes.


    Most Windows apps consist of multiple pages. Windows provides a navigation framework
    that is helpful for implementing navigation in an app. Microsoft Visual Studio
    developers with application templates that contain support for caching data for
    a page and integration between navigation and session state. Designing and implementing
    navigation is an important phase in the development of your app. Microsoft provides
    a set of guidelines to help developers implement navigation. In applications with
    grouped data, Semantic Zoom can be implemented to manage groups in a simple yet
    powerful way.


    # Objectives in this chapter:


    +   - Objective 4.1: Create and manage tiles.

    - Objective 4.2: Notify users by using toast.

    - Objective 4.3: Manage input devices.

    - Objective 4.4: Design and implement navigation in an app.'
