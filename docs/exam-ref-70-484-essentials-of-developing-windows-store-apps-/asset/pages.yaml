  md: '# Objective 2.3: Implement search


    While designing your Windows Store app, if you have planned to implement the Search
    contract, you should expose this feature via the Search charm. Adding the Search
    contract to your app through the Search charm enables the user to search within
    your app from anywhere within the system. Your app can provide search query suggestions
    and result suggestions while the user is searching through the Search charm.


    When the user enters a query string and selects your app from a list of apps that
    implement the Search contract, your app is activated by Windows if it is not running.
    The query string entered by the user is available through the OnSearchActivated
    method. You can implement a page in your app to display search results with a
    preview of each item. This page is shown whenever the OnSearchActivated method
    is invoked.


    +   This objective covers how:

    - Provide and constrain search within an app.

    - Provide search result previews.

    - Provide search suggestions using the SearchPane class.

    - Implement activation from within search.

    - Search for and launch other apps.


    # Providing and constraining search within an app


    Visual Studio makes it easy for developers to add the Search contract in your
    Windows Store apps. When you select the Search Contract template in Visual Studio,
    code is added to override the OnSearchActivated virtual method in the Application
    class in your Windows Store app, and the app manifest is updated with the correct
    permission, as shown in Figure 2-17.'
