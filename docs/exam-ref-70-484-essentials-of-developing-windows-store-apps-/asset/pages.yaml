  md: '# Thought experiment

    Building a Windows Store app manager


    In this thought experiment, apply what you''ve learned about this objective. You
    can find answers to these questions in the "Answers" section at the end of this
    chapter.


    Your manager has asked you to develop a Windows Store app that enables users to
    import contacts into the app from their preferred email provider or from files
    that contained archived data.


    One of the requirements of your app is to provide users with the ability to filter
    and select contacts during the import. In addition, your app is required to provide
    contacts to other Windows Store apps whenever required. The app should provide
    the ability to filter contacts with specific fields.


    Answer the following questions for your manager:


    +   1. Will your application be capable of importing contacts from remote web
    sources and files exported by devices while acting as a contact provider at the
    same time?

    2. How will you ensure the app works in all view states?

    3. Will users be able to select as many contacts as they want from the imported
    list?


    # Objective summary


    +   * The ContactPicker class provides Windows Store apps with the capability
    to select one or more contacts.

    * You can set using the ContactPicker class to select contacts with values in
    specific fields, such as those with email addresses and phone numbers.

    * The type and category of data in a contact can be used to select the information
    to be displayed in the app.

    * A Windows Store app can implement the contact picker extension and act as a
    provider of contacts for other apps.


    # Objective review


    Answer the following questions to test your knowledge of the information in this
    objective. You can find the answers to these questions and explanations of why
    each answer choice is correct or incorrect in the "Answers" section at the end
    of this chapter.'
