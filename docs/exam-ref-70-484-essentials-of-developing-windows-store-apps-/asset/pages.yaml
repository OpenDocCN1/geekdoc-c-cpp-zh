  md: '# Choosing and implementing data-bound controls


    Data binding is a method available for Windows Store apps to display and interact
    with data.

    It provides a connection between a binding source, usually a data source, and
    a binding target, which is a UI element in the presentation layer. The connection
    is made with an object of the type Binding, which implements the logic to move
    data between the target and source, and is modified with an optional converter.


    A binding source can be a simple common language runtime (CLR) object including
    the target element or other UI elements. Classes defined in C# and Visual Basic
    produce CLR objects, so they can act as the binding source. In, WinRT objects
    that implement the ICustomPropertyProvider or have a BindableAttribute can be
    a source for data binding.


    A binding target is a DependencyProperty of a FrameworkElement, a class that helps
    with the behavior and layout of UI elements. The dependency property framework
    provides a way to express the value of an object that depends on the value of
    one or more properties. In WinRT, classes that participate in the dependency property
    system must derive from the DependencyObject base class. Classes that derive from
    the DependencyObject class can define one or more dependency properties that help
    in data binding.


    The data binding framework obtains information from the Binding object about the
    source and target objects; the direction of the data flow between the source and
    target; and a converter, if used. Data binding is commonly set up in XAML or with
    the SetBinding method of the FrameworkElement class.


    The binding class provides a number of properties used to declare the data binding
    in a UI element through XAML:


    +   **ElementName** This property is used to set the source for the binding in
    the UI.

    **Source** This property is used to set the data source for the binding.

    **RelativeSource** This property is used to set the source for the binding, specifying
    a location that is relative to the location of the binding target.

    **Path** This property is used to specify a property in the data source as the
    binding’s source. For example, if the data source is specified with the Source
    property in the binding, the Path property can be used to refer to a property
    in the data source. You can omit this in the XAML declaration of the binding,
    as shown in Listing 5-19.

    **Converter** This property is used to specify a converter object that is used
    by the binding framework to modify the data as it flows between the target and
    the source.

    **ConverterParameter** This property is used to specify a parameter used by the
    converter specified for the binding.

    **ConverterLanguage** This property is used to specify a language for the converter
    object, if specified for the binding with the Converter property. The default
    value of this property is the current language of the application context.'
