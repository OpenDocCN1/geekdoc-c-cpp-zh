    # shared resources and themes


    While building a Windows Store app, you can reuse styles and control templates
    to customize the visual appearance of controls. Collections of styles and control
    templates can be defined in the resource dictionary. You can create a resource
    dictionary using Visual Studio with the Add New Item option for your project,
    as shown in Figure 3-31.


    ![](img/81d79ceb6883e2d24731f821954f3393_233_0.png)


    FIGURE 3-31 Adding a resource dictionary with Visual Studio'
