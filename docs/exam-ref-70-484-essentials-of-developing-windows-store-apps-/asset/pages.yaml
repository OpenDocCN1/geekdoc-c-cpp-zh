  md: '# CHAPTER 3


    # Create the user interface


    Windows RT (WinRT) and Windows 8 are operating systems installed on small handheld
    tablets to desktop PCs with large multi-touch displays. The resolution, pixel
    density, and aspect-ratio of screens vary greatly among different hardware. Users
    expect a Windows Store app to adapt to various screen sizes and orientations without
    changing the UI.


    The WinRT programming interface (API) enables developers to build Windows Store
    apps with dynamic user interfaces (UIs). The Canvas, StackPanel, and Grid controls,
    for example, let an app to change size and orientation. App bars provide users
    with easy access to commands without obstructing the UI.


    A well-designed Windows Store app presents data to users so they can select, zoom,
    and perform other operations easily. The Grid, ListView, and FlipView controls
    data in a Windows Store app and can be customized through data templates. Styles
    can be based on events and property changes that the UI is updated accordingly.


    # Objectives in this chapter:


    +   - Objective 3.1: Create layout aware apps to handle view states.

    - Objective 3.2: Implement layout controls.

    - Objective 3.3: Design and implement the app bar.

    - Objective 3.4: Design and implement data presentation.

    - Objective 3.5: Create and manage XAML styles and templates.


    # Objective 3.1: Create layout aware apps to handle view states


    A well-designed Windows Store app provides a smooth and pleasant user experience
    across a variety of view form factors, screen sizes, and application view states
    by employing a predictive behavior in the UI. The app should look great when users
    view it on a tablet, on a desktop PC, or on a large high-definition screen; when
    they change the orientation of their device; and when they change the view state
    of the app.


    Microsoft design guidelines specify Windows Store app layouts that help you arrange
    controls in the UI. The UI responds to changes in the size and orientation of
    the screen by raising events. You can support multiple view states in your app
    by applying styles to specific view states in these events. The content in your
    app is presented through controls'
  merge: -1
