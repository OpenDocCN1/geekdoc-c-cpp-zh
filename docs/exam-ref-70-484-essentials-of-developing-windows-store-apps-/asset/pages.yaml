  md: '# Objective 4.4: Design and implement navigation in an app


    In its simplest form, a Windows Store app consists of a single page with a number
    of controls. All the functionality is embedded within the single page. However,
    many Windows Store apps consist of multiple pages with well-defined navigation
    architecture. The user navigates through such shortcuts and buttons present in
    the pages, and in some cases, using a navigation control in the top app bar.


    Microsoft provides guidance for implementing navigation in Windows Store apps
    to ensure consistency in the experience as well as leverage the navigation framework
    built in the system. Developers can use the hub design to implement hierarchical
    navigation or use the flat system when there are no hierarchical levels in their
    app. The hub design is often combined with app bar to help the user navigate through
    sections in the hierarchy. Visual Studio provides application templates for the
    hierarchical pattern of navigation.


    In a hierarchical navigation design, the main page can contain a number of categories
    and a large number of items in every category. This makes browsing through the
    flat selecting an item of interest difficult for the user. To help with the navigation,
    Semantic Zoom can be implemented in the main page to navigate through categories,
    enabling the user to select a category of interest and browse to the category
    page.


    This objective covers how to:


    +   - Design navigation to meet requirements.

    - Handle navigation events, check navigation properties, and call navigation functions
    by using the navigation framework.

    - Use Semantic Zoom in your app.


    # Designing navigation to meet app requirements


    One of the key principles in the Microsoft design style is the importance of content
    in an app. Presentation of content using a clean layout and typography, animations,
    and carefully selected UI elements are key features of Windows Store apps. For
    apps that consist of multiple pages, it is very important to design and implement
    a navigation pattern that matches well with other important features of a great
    app.


    In most Windows Store apps, a hierarchical pattern with a number of levels is
    used to implement navigation. In this pattern, there is a main page with a set
    of groups, each containing a number of items. In the next level, there are number
    of pages, representing a group. Each page in this level contains a list of items
    belonging to a group. Finally, there is a page for an individual item. The user
    can navigate through the hierarchy of pages in an app by clicking the back button
    that appears in the top-left corner of the screen. An example of hierarchical
    navigation in the Store app in Windows 8 is shown in Figure 4-18.'
