  md: 'Figure 4-7 shows a badge update containing a number (set to 23) delivered to
    a Windows Store app using the code in Listing 4-5.


    ![](img/81d79ceb6883e2d24731f821954f3393_258_0.png)


    **Figure 4-7** Badge in the live tile of a Windows Store app in the Start screen
    (photo courtesy of Microsoft Office Imagery)


    Badges have many features in common with live tiles. You can periodically update
    badges, schedule a future update, and use push notifications to update the glyph
    or number displayed. You can set an *ExpirationTime* on a badge when you create
    it, and can clear badges programmatically.


    # **MORE INFO** BADGE CONTENT OPTIONS


    Microsoft provides a set of glyphs that can be used in a badge notification. For
    the full list of glyphs, refer to this page: http://msdn.microsoft.com/en-us/library/windows/apps/xaml/hh779719.aspx.


    # Responding to notification requests


    Tile notification and badge updates in a Windows Store app are delivered in one
    of the following ways:


    +   - **Local** The app creates local updates to a live tile and delivers them
    using the *Update* method of the *TileUpdater* class. These updates do not expire
    if the expiration time is not set in the app.


    +   - **Scheduled** The app can schedule an update to be delivered at a later
    date and time. Scheduled updates expire three days after they are delivered or
    at a time set by your app. After a tile update is scheduled, your app does not
    have to be running.


    +   - **Periodic** Periodic updates poll a remote URL and fetch the XML for the
    tile at intervals every half hour to every day. After it is configured, your app
    does not have to be running for the periodic updates to be delivered.


    +   - **Push** Push notifications, which are delivered through the WNS, can update
    tiles and badges.'
