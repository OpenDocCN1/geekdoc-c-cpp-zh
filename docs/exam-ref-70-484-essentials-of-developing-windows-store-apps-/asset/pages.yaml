    >\n    <ListView.ItemTemplate>\n      <StackPanel>\n        <TextBlock Text=\"\
    {Binding Path=Name}\" Mode=\"OneWay\"\n                   Style=\"StaticResource\
    \ BasicTextStyle\"\\n                   HorizontalAlignment=\"Center\" />\n  \
    \      <TextBlock Text=\"{Binding Path=DateOfBirth, Mode=OneWay,\n           \
    \        Converter={StaticResource birthFormatter},\n                   Parameter=\\\
    {0:d}}\"\n                   Style=\"StaticResource BasicTextStyle\"\\n      \
    \             HorizontalAlignment=\"Center\" />\n      </StackPanel>\n    </ListView.ItemTemplate>\n\
    \  </ListView>\n</Grid>\n```\n\nIn addition to a parameter, you can specify a\
    \ language for the conversion, which is important when the conversion is applicable\
    \ for a specific region and language. You can also specify the data type of the\
    \ target for the data being converted.\n\n# Creating and setting dependency properties\n\
    \nWinRT APIs provide a dependency property framework that helps in data binding\
    \ of a UI element with a data source. A dependency property is a special kind\
    \ of property that depends on multiple providers for determining its value at\
    \ any time. It provides a notification to interested parties whenever its value\
    \ changes. Consider a dependency property as an extension of the concept of a\
    \ class property.\n\nUnlike the traditional properties of a class that use a private\
    \ member as their backing store, dependency properties use a property store that\
    \ holds the back. A property store consists of a set of property identifiers and\
    \ associated values that exist for an object. A property is identified by an instance\
    \ of DependencyProperty instead of its name. A dependency property is registered\
    \ and owned by an object of the type DependencyObject. The DependencyObject class\
    \ is located high in the class hierarchy, and most classes that are used in the\
    \ UI of a Windows Store app inherit from the DependencyObject class."
