  md: '# Setting the appropriate HTTP verb for REST


    Representational State Transfer (REST) is an architectural style based on HTTP
    for exposing data in the web where it can be consumed by a variety of clients
    on different platforms. REST uses common HTTP verbs as GET, POST, PUT, and DELETE
    to access resources on a server and interact with them. An HTTP web service designed
    in a RESTful web consists of a collection of URLs, each representing a set of
    actions defined on them. actions are specified with an HTTP verb in the outgoing
    request. Unlike SOAP and other web services, a RESTful web service does not require
    XML in the message requests.


    The SendAsync method of the HttpClient can be used to send an HTTP request to
    a remote web service that implements a RESTful interface. This method requires
    an HttpRequestMessage object that specifies the HTTP verb to use with the request
    as well as the HTTP headers configured with various values, such as the user-agent.
    The verb used for preparing the HttpRequestMessage is specified as one of the
    static properties of the HttpClient class:


    +   - Get represents the HTTP GET verb and is used with HTTP requests to obtain
    an object from the remote service.


    +   - Head represents the HTTP HEAD verb and is used to obtain the details of
    an object with only the headers in the response.


    +   - Delete represents the HTTP DELETE verb and is used to delete an existing
    object in the remote service.


    +   - Post represents the HTTP POST verb and is used to create an object that
    does not exist in the remote service.


    +   - Put represents the HTTP PUT verb and is used to update an existing object
    in the remote service.


    +   - Options represents the HTTP OPTIONS verb and is used to obtain a list of
    methods the remote service supports.


    +   - Trace represents the HTTP TRACE verb and is used to echo the request received
    by the remote service so that a client can see any changes that have been made
    to the original request by servers on the path of the request.


    In most cases, you will be working with the GET, POST, PUT, and DELETE HTTP verbs.
    You should remember that RESTful interfaces define their API for resources. Therefore,
    if your app must obtain an object from the resource, it should use an HTTP request
    with the GET verb. If it needs to update an existing object, it has to issue an
    HTTP request with the PUT verb to a URI that is the location of the object on
    the server. Listing 5-14 shows an HTTP request with the GET verb used to obtain
