  md: '# Thought experiment

    Porting a legacy app to a Windows Store app


    In this thought experiment, apply what you''ve learned about this objective. You
    can find answers to these questions in the “Answers” section at the end of this
    chapter.


    You have been asked to port a legacy desktop application to a Windows Store app.
    You are expected to focus on the UI and use key features available for Windows
    Store developers.


    You determine that the ported app will appeal to users if you incorporate useful
    features such as searching the app for data and formatting, sending content via
    email, and connecting to printers.


    Briefly explain the three steps you must take to incorporate search, share, and
    the capability to print content from your ported app.


    # Objective summary


    +   - In your app’s design, consider using the Search, Share, Devices, and Settings
    charms to help users interact with your app.

    - You should provide query suggestions and result recommendation when you implement
    the Search contract and integrate it in your app through the Search charm.

    - The UI provided by your app while implementing the Share Target contract should
    be minimal and simple for the user to use. You should integrate the Share Target
    contract in your app through the Share charm.

    - The Settings charms provides an entry point for your application’s settings,
    permissions, privacy statement, user session management, and a command to rate
    and review your app in the Windows Store.

    - Contracts implemented in Windows Store apps must be declared in the app manifest;
    otherwise, exceptions will occur if the user tries to access the features implemented
    through the contract.'
