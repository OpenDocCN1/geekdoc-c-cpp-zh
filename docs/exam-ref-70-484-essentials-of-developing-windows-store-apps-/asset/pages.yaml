  md: '# Objective 1.5: Plan for an app deployment


    The Windows Store was originally launched to a restricted set of developers who
    had their apps evaluated by experienced Microsoft engineers. This process was
    implemented to ensure the application certification requirements were tested properly.
    During this phase, Microsoft used the feedback from developers around the world
    to refine requirements. Today, Microsoft provides a set of application certification
    requirements, guidance, and tools for developers to test and test their applications
    before submitting them to the Windows Store.


    +   This objective covers how to:

    * Plan a deployment based on Windows Store app certification requirements

    * Prepare an app manifest

    * Sign an app

    * Plan the requirements for an enterprise deployment


    # Planning a deployment based on Windows Store app certification requirements


    The Windows Store is the primary source from where applications are downloaded
    and installed on a Windows device or a PC. The Windows Store provides a unique
    way to sell and distribute your apps and their updates, interact with users of
    your apps, and make money with them. The Windows Store acts as an entity that
    maintains the quality and reliability of Windows Store apps for all users. Your
    application''s quality is evaluated by a testing process at Microsoft using a
    standard set of criteria, before the app is made available for download.


    Your application must satisfy a basic set of criteria, as follows:


    +   * **Application failures** Your app should not crash or become unresponsive
    while running. If your app crashes, it should gracefully exit without requiring
    users to restart their system. This provides your customers with a better user
    experience.

    * **Security** Your app must use Windows security features. It should not compromise
    the security of the system under any circumstances.

    * **Performance** Your app should have a fast and responsive startup and suspend
    experience. It should release resources when suspended and consume only a reasonable
    amount of system resources such as central processing unit (CPU), memory, and
    disk input/output (I/O).

    * **App packaging** Your manifest must contain all required attributes and must
    have valid resources defined as a Package Resource Index (PRI) file called Resources.pri.
    The app manifest is defined in the Package.appmanifest file.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '+   - Platform application programming interfaces (APIs) Your app must use
    APIs from the Windows 8 SDK. If you use an undocumented platform feature, your
    app will fail certification. Your app must use .NET 4.5 or later APIs.


    It is important for your app to follow the Microsoft design style guidelines and
    fundamental principles as well as the key features of Windows Store apps discussed
    previously. The Windows Store app certification requirements define a set of criteria
    your app should satisfy. To summarize, Windows Store apps:


    +   - Should be creative, unique and provide value to the customer.

    - Can display ads, but not display only ads. The ads in your app must conform
    to the content and age rating guidelines.

    - Should be responsive and perform reasonably well on any device, and updates
    not remove functionality from your app.

    - Should enable the customer to control data shared by the app, security, notifications,
    data transfers, and similar features.

    - Should not contain offensive content and must conform to the content and age
    rating guidelines.

    - Should have a unique name that helps with their identification in the Windows
    Store and their brand.


    # MORE INFO WINDOWS STORE APP CERTIFICATION REQUIREMENTS


    You can read the Windows Store app certification criteria at http://msdn.microsoft.com/en-us/library/windows/apps/hh694083.aspx.


    You can use Visual Studio to deploy your app on your local PC, on a remote PC
    on your network, or in the local simulator. The simulator is helpful when testing
    your app during development; however, it is not suitable for testing prior to
    distribution.


    When you are ready to distribute your app for testing among other developers and
    testers, you have the option of creating either an .appx file or an .appupload
    file. You can upload either file to the Windows Store when you are ready to submit
    your app. Theappupload file contains two files: .appx and .appsym. Theappsym file
    contains the public symbols from your app. It provides useful information if your
    application crashes when it is running.


    The app packages are ZIP-based container files that contain the app payload files
    with information needed to validate, deploy, manage, and update the app. There
    are two ways to create an app package:


    +   - Use Visual Studio In Visual Studio, the PROJECT menu, choose Store and Create
    App Packages. You can choose the location in which the app package will be created,
    set a version number for the package, and choose the solution configuration. You
    can also choose to include public symbols that help with analyzing crashes in
    your app.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '+   **Use the command prompt** You can build an app package by opening a Studio
    command prompt and then running MSBuild using Team Foundation Build. By default,
    the app package is created in the same location as other build. However, you can
    override this by specifying /p:GenerateProjectSpecificOutputPath=false as an argument
    for MSBuild.


    After your application''s app package is ready, you should review the app submission
    checklist, test your app with the Windows App Certification Kit (ACK), have your
    app tested by some volunteers, and take some screenshots to submit with your app.
    Make sure you have included a privacy statement or license terms if your app collects
    personal information.


    MORE INFO APP SUBMISSION CHECKLIST

    Information about the app submission checklist is at http://msdn.microsoft.com/en-us/library/windows/apps/hh694062.aspx.


    Windows ACK is a free tool download from Microsoft. Windows ACK ensures your application
    meets the basic requirements of a Windows Store app. Your app has to be installed
    on the PC where you run Windows ACK. The kit launches your app a few times; it
    tests for startup and suspends performance; and checks the build version of your
    package, its dependencies, app capabilities, and so on. At the end of the testing
    process, Windows ACK creates an XML file you can open in Microsoft Internet Explorer
    and examine the results. A snippet of the XML file is shown in Figure 1-10.


    MORE INFO WINDOWS APP CERTIFICATION KIT

    The Windows ACK download is at http://msdn.microsoft.com/en-US/windows/apps/jj572486.


