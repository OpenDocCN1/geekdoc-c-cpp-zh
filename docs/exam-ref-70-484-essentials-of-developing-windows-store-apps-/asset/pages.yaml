    \   // Custom processing for application logic\n        }\n    }\n}\nn// Route\
    \ the event to the gesture recognizer. Note that _gestureRecognizer is a\n// page\
    \ level variable of the type Windows.UI.Input.GestureRecognizer.\nthis._gestureRecognizer.ProcessDownEvent(args.GetCurrentPoint(parentElement));\n\
    \n// Capture the pointer associated with this event. _target is the element being\n\
