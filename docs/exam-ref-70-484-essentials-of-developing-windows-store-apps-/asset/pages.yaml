    When adding to settings and files stored in the application data stores, a Windows
    Store app can interact with files that are present on a device or PC and is managed
    by other Windows Store apps. For example, a photo viewer app should be able to
    access the user''s Pictures library, or an app might download videos from a remote
    location and save them in the user''s Videos library.


