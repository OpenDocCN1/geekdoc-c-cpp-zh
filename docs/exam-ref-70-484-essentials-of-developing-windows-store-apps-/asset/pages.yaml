    \    await WebSocket.ConnectAsync(\"wss://www.example.com\");\n}\n```\n\nThe MessageWebSocket\
    \ and StreamWebSocket classes have companion classes (MessageWebSocketControl\
    \ and StreamWebSocketControl, respectively) that provide properties for advanced\
    \ configuration of the WebSocket classes such as the size of the buffer to be\
    \ used for sending data, the credential to use for authentication with a proxy\
    \ and the credential to use for authentication with the server. You can use the\
    \ Control property in the WebSocket classes to access and set these properties\
    \ to values you require.\n\n# MORE INFO ADVANCED CONTROL OF THE WEBSOCKET CLASSES\n\
    \nYou can read more about advanced control of the WebSocket classes at http://msdn.microsoft.com/library/windows/apps/hh994400.\n\
    \nTo use either the MessageWebSocket class or the StreamWebSocket class in your\
    \ Windows Store app, you must ensure that the required set of capabilities is\
    \ declared in your manifest file. The capabilities required for WebSocket communications\
    \ are Internet (Client & Server) for bidirectional communications with servers\
    \ in the Internet, and Private Networks (Client & Server) for bidirectional communications\
    \ with servers located in the user's trusted places, such as home and home work.\n\
    \n# Handling the progress of data requests\n\nSome Windows Store apps need to\
