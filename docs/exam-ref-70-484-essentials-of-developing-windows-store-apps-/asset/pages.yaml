    # Designing a viewmodel to support the view based on your model


    The classic definition of the viewmodel is that it is the model for the view.
    However, this definition is an oversimplification of the role a viewmodel plays
    in. The main features of a viewmodel are:


    +   - It provides data that is represented in the view. This data can include
    properties that are required in the view but are not part of the model.


    +   - It provides commands that are connected to events of UI elements and are
    used to invoke an action. The commands implementations of the ICommand interface.


    +   - It implements the INotifyPropertyChanged interface, thereby keeping the
    UI in synchronization with the data model.


    +   - It optionally implements the INotifyDataError interface, which enables the
    viewModel to provide feedback through the UI on issues with the data entered by
    the user.


    You need to keep these features of a viewmodel while designing your model, and
    you might have to simplify the complex object model that represents the data returned
    from a remote service. You might also need to transform model properties to allow
    binding in the view; for example, transforming an enumeration into a Boolean that
    can be used to set the visibility of a UI element. Instead of implementing the
    logic to carry out the transformation in the viewmodel, you can implement it in
    a value converter and use the data binding.


    A single-page Windows Store app requires the following presentation logic implemented
    in the viewmodel:


    +   - A property that is a list of photographs for the search term.


    +   - A property that is the search term inserted by the user. It is bound to
    a text box in the UI.


    +   - A property that is a command to button the search in the user interface.


    # Developing a view to meet data-binding requirements


    In the MVVM pattern, the role of the view is to present the data and enable the
    user to interact with it. In a Windows Store app, the view can be a UserControl
    or a Page. The relationship between the view and its data is set up through data
    binding. The simplest way to set this up is to add a reference to the viewmodel
    in the DataContext of the view. You can bind the properties and commands of viewmodel
    to the corresponding UI elements in the view.


    For the single page discussed so far, there are five steps to carry out to set
    up data binding in the XAML:


    +   1. Setting up a TextBox to SearchTerm property in the viewmodel and a button''s
    command property to the SearchPhotosCommand in the viewmodel.'
