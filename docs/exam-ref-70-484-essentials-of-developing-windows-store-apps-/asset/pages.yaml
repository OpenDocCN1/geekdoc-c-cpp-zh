    # Objective summary


    +   - WinRT APIs provide a data binding framework for building Windows Store apps.
    Binding helps with the implementation of a presentation layer that is loosely
    coupled to its data model.

    - The UI of an app is composed of visual elements that provide dependency properties
    for binding with data sources. Data binding for a visual element can be configured
    in XAML using various properties of the Binding class.

    - Item controls such as ComboBox, ListBox, ListView, GridView, and FlipView are
    particularly useful for binding collections of items.

    - A value converter can modify the value of a binding between a source and target
    through a value converter. A value converter implements the IValue interface.

    - Dependency properties can be used in custom controls to create properties that
    can be bound with data.'
