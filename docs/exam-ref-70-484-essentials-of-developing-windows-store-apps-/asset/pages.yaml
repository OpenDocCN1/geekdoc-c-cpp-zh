    user action is to swipe the side of the screen (or use the Windows+H keyboard
    shortcut); display the charm; press the Share charm; and, using the Share window,
    share content from within the app. The app provides the content, and the metadata
    is presented in the content preview. The app that is used to share content implements
    the Share Target contract.'
