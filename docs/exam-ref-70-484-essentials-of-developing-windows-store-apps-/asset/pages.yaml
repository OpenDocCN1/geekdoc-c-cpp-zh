  md: 'When Windows terminates your app, all state information that has not been saved
    is lost. Users will be disappointed when they restart the application and find
    all unsaved work is gone. This is particularly relevant in applications that provide
    the user with multiple ways to interact, for example, navigating through a number
    of pages, allowing them to save data in forms, and so on.


    To provide users with an optimal experience while running your application, you
    need to implement a state management strategy. The key points while implementing
    such a strategy are:


    +   - If your application has multiple pages and a navigation scheme, save the
    navigation steps and visual artifacts of each page while the user navigates through
    the app. Consider a page that uses horizontal scrolling to display form fields
    for data entry. If the user decides to leave your application and return to it
    after checking email, for example, you need to preserve both the form content
    as well as the scroll position. When the user switches back to your application,
    he or she will be presented with the unsaved data and can carry on using your
    application.

    - Windows can terminate your application while in the Suspended state if it finds
    the device running on low resources. Therefore, as soon as your application is
    suspended, you should save the state of your application without waiting for your
    application to be terminated.

    - When your application is being suspended, it should release any resources and
    handles so that other apps can access them while your application is suspended.

    - You can provide the user with an option to resume from where they left your
    application or start fresh. This is relevant for applications such as games and
    media players.

    - You do not need to restore the state of your application if it is launched by
    a contract, such as the Search contract, or if your app is launched because of
    a file association.

    - If your application fetches data from a remote service on the Internet, you
    can check the time when it was suspended (and terminated if Windows ran out of
    resources) and refresh the UI instead of showing old content. This is relevant
    for applications that display the weather or news, for example.

    - If your app needs to run even when Windows suspends it, you can implement application
    logic as a background task. For example, if users start a file upload or download
    task from your application, expect the task to complete when they are back in
    your application.


    Windows provides a way for users to close an application if they want to. Therefore,
    you should not provide any options in the UI, such as a button, for the user to
    terminate your app. If your application terminates due to an exception or hardware
    failure, the app should not try to resume from a previous state and start fresh.
    In the event of abnormal termination, state saved by your app might be corrupt,
    and restoring your application from corrupt'
