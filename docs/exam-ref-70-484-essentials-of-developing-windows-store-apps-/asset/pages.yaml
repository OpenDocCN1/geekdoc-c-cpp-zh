  md: "The WebSocket protocol specifies a method to exchange data over a fast and\
    \ secure two-way communications channel in the network between a client and a\
    \ server. Data can be transferred between the client and server in real time over\
    \ a single socket in both directions. Examples of Windows apps that benefit from\
    \ WebSockets are dashboards displaying stock quotes or weather information.\n\n\
    In the setup of the connection between the client and a server, an HTTP-based\
    \ handshake is exchanged between the two parties. If the handshake is successful,\
    \ WebSockets are used as the application protocol instead of HTTP using the TCP\
    \ connection. After the WebSocket connection is no longer involved. Either party\
    \ can close the WebSockets connection at any time. To use WebSockets, the server\
    \ must support WebSockets.\n\nWinRT APIs provide two types of WebSocket classes:\
    \ the MessageWebSocket and Stream-WebSocket in the Windows.Networking.Sockets\
    \ namespace. The MessageWebSocket class is useful when the data exchange is not\
    \ long, and the message can be either in the UTF-8 or binary format. It provides\
    \ a notification that an entire WebSocket has been received. The StreamWebSocket\
    \ class is useful when a large amount of data, such as photos or movies, needs\
    \ to be transferred. It supports messages in the binary format only, and sections\
    \ of a message can be read with each operation.\n\nThe WebSocket protocol specifies\
    \ two URI schemes: ws: for all unencrypted communications, and wss: for all secure\
    \ communications that should be encrypted. The ConnectAsync method of the WebSocket\
    \ classes except the URI of the remote server to be specified with the ws: the\
    \ URL prefix for unencrypted connections and as wss: the URL prefix for encrypted\
    \ connections. The C# code in Listing 5-16 shows how the MessageWebSocket class\
    \ can be used to send data to the server and be notified that the message was\
