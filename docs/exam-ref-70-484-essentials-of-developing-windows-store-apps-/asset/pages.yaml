  md: "# Setting the number of rows/columns and size\n\nThe Grid control has a collection\
    \ of rows and columns that can create various control arrangements that compose\
    \ the UI. Some of the properties that are commonly specified for a Grid control\
    \ are the following:\n\n+   - ColumnDefinitions This property contains a collection\
    \ of one or more ColumnDefinition objects. A ColumnDefinition defines column-specific\
    \ properties that apply to Grid elements. The Width of ColumnDefinition specifies\
    \ the width of a column in a grid.\n- RowDefinitions This property contains a\
    \ collection of one or more RowDefinition objects. A RowDefinition object defines\
    \ row-specific properties that apply to Grid elements. The Height of RowDefinition\
    \ specifies the height of a row in a grid.\n- Background This property is used\
    \ to specify the Brush as the background of the control. A brush can be a solid\
    \ color or an image.\n- Height and Width These properties control the size of\
    \ the Grid control. In most scenarios, the height and width of the Grid control\
    \ is not specified and is allowed to occupy all available space in the frame.\n\
    \nThe following XAML code shows how you can use the RowDefinitions and ColumnDefinitions\
    \ to define a grid layout with two columns:\n\n```\n<Grid x:Name=\"PageLayout\"\
    >\n  <Grid.ColumnDefinitions>\n    <ColumnDefinition />\n    <ColumnDefinition\
    \ />\n  </Grid.ColumnDefinitions>\n  <Grid.RowDefinitions>\n    <RowDefinition\
    \ />\n    <RowDefinition />\n    <RowDefinition />\n  </Grid.RowDefinitions>\n\
    </Grid>\n```\n\nYou can place and position controls within the grid by specifying\
    \ their Grid.Row and Column properties relative to the respective row and column\
    \ of the grid. The rows and columns follow a zero-based index. For example, if\
    \ you want to place a colored rectangle in the first column, second row of the\
    \ control, use the following XAML code:\n\n```\n<Grid x:Name=\"PageLayout\">\n\
    \  <Grid.ColumnDefinitions>\n    <ColumnDefinition />\n    <ColumnDefinition />\n\
    \  </Grid.ColumnDefinitions>\n  <Grid.RowDefinitions>\n    <RowDefinition />\n\
    \    <RowDefinition />\n    <RowDefinition />\n  </Grid.RowDefinitions>\n  <Rectangle\
    \ Grid.Row=\"1\" Grid.Column=\"0\" Fill=\"Wheat\" />\n</Grid>\n```"
  merge: -1
