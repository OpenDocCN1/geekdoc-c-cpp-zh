    \ periodic updates fetch data at specific time intervals, to be effective, an\
    \ app should use push notifications to update its tile and badges. Microsoft provides\
    \ developers with the free WNS to help integrate push notifications in apps. The\
    \ service handles the communication with your application and can handle millions\
    \ of users. The following steps illustrate how to set up push notifications for\
    \ tile and badge updates and other notifications:\n\n+   1. The Windows Store\
    \ app requests a push notification channel from WNS. The service returns a channel\
    \ with a uniform resource identifier (URI) that is unique to the app and the device.\n\
    \n+   2. Your app sends this URI to a cloud service or a remote web service. It\
    \ is important to ensure that this URI is not compromised...\n\n+   3. When the\
