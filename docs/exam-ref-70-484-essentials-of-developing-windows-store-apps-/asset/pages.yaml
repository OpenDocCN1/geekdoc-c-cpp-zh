    # Objective 1.2: Design for separation of concerns (SOC)


    Separation of concerns (SOC) is a concept in software design and development that
    helps to remove dependencies between various parts of an application, allowing
    for maintainability and testability of the application. SOC involves planning
    the logical layers of your solution and designing them to be loosely coupled with
    interfaces. The implementation of any layer is independent of the implementation
    of others, allowing for loose coupling between them. It is often useful to develop
    layers of a solution as WinRT called Windows Metadata (WinMD) components so they
    can be used to develop Windows Store apps with C#, Visual Basic, C++, or JavaScript.'
