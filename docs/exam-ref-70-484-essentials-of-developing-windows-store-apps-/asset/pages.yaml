    world know about your level of expertise. Certification exams validate your on-the-job
    experience and product knowledge. While there is no substitution for on-the-job
    experience, preparation through study and hands-on practice can help you prepare
    for the exam. We recommend that you round out your exam preparation plan by using
    a combination of available study materials and courses. For example, you might
    use this Exam Ref and another study guide for your "at home" preparation, and
    take a Microsoft Official Curriculum course for the classroom experience. Choose
    the combination that you think works best for you.


