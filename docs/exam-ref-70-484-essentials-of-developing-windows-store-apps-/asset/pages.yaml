    If you decide to add a search box in your app query, remember to place it in the
    UI so it is not hidden by the charms bar or a flyout. You should not place the
    search box in the app bar.


    In Windows Store apps that are text-heavy, such as document viewers, consider
    incorporating a feature to enable users to search in the text. Such a feature
    usually provides a full-screen experience and helps users move through large bodies
    of text. You should not implement this feature through the Search char. Instead,
    add it to the app bar, paired with other commands such as Replace, at a page level.
    You should add the Ctrl+F shortcut, which is the default Find feature for Windows.


    When the user starts typing into the search box in the Search char, search suggestions
    appear below the search box. These suggestions are supplied by the app that is
    visible on the screen if it has implemented the Search contract. Search suggestions
    do not appear if the app has not implemented the Search contract. There are two
    types of suggestions an app can provide:


    +   **Query suggestions** These are auto-completions of the user''s query text
    and suggest queries the user might want to search for. If the user clicks a query
    suggestion, the app displays the search results for that query. Query suggestions
    are strings provided by the application.


    +   **Result recommendations** These are strong or exact matches to the user''s
    query that the user might want to view immediately. If the user clicks a recommendation,
    the app displays the page with the results. Result suggestions are strings provided
    by the application.'
