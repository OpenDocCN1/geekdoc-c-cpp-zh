    # Thought experiment


    # Creating an app for touch, gestures, and inking


    In this experiment, apply what you''ve learned about this objective. You can find
    answers to these questions in the "Answers" section at the end of this chapter.


    The mathematics curriculum of a primary school has a module in which children
    learn about geometric shapes and how to draw them. Students are often encouraged
    to identify a geometric shape and write their name next to it.


    Each classroom has several PCs with touch-enabled screens for students as well
    as a handheld tablet for the teacher. The school board supports the idea of implementing
    a Windows 8 application that fulfills the requirements of the mathematics curriculum.
    List three features of touch, gestures, and inking support in Windows 8 that you
    can use to build the app.


    # Objective summary


    +   - Windows Runtime APIs abstract input devices into pointers and provide events
    that do not depend on the type of input device. The Pointer class and its associated
    classes can be used by developers in a Windows Store app for gestures provided
    by the system.


    +   - Gesture and manipulation events should be used instead of low-level pointer
    events for a consistent experience across all applications.


    +   - Custom gesture recognizers can be created for implementing gestures that
    are not available in the standard set of gestures.


    +   - Pointer events can be used with touch gestures and a mouse to implement
    application logic.


    +   - Windows provides extensive inking support that includes drawing of geometric
    shapes and handwriting recognitions.


    # Objective review


    Answer the following questions to test your knowledge of the information in this
    objective. You can find the answers to these questions and explanations of why
    each answer choice is correct or incorrect in the "Answers" section at the end
    of this chapter.'
