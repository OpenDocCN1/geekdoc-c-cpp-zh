    \ channel URI obtained by your app. This is carried out by a HTTP POST operation\
    \ with the notification payload, which typically consists of the XML for the tile\
    \ or badge update.\n\n+   4. WNS receives the request and the notification to\
    \ the appropriate device. The remote service uses one of the standard templates\
