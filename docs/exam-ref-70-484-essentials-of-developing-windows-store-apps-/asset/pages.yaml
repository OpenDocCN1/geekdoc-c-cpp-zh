  md: 'group displayed vertically in columns. In such a scenario, the data in the
    columns might not fit in the screen and will not be visible to the user.


    The ScrollViewer is available for developers to lay out UI elements so they are
    visible within the available screen area. It provides a virtual surface adequate
    for rendering all UI elements placed within it. The ScrollViewer can handle horizontal
    and vertical scrolling, depending on the properties you set when configuring it.
    Content placed within the Viewer is displayed within the visible area of the control,
    called the viewport.


    The following are commonly used properties of ScrollViewer:


    +   **Height and Width** These properties are used to specify the height and width
    of the viewport. If the content placed within the ScrollViewer occupies more area
    than that specified by the Height and Width, it will be clipped or scrollbars
    will be added based on its visibility settings.


    +   **HorizontalScrollVisibility** This property controls whether the ScrollViewer
    should display a horizontal scrollbar. The values allowed for this property are
    Disabled, Auto, Hidden and Visible. The default value is Disabled.


    +   **VerticalScrollVisibility** This property controls whether the ScrollViewer
    should display a vertical scrollbar. The values allowed for this property are
    Disabled, Auto, Hidden and Visible. The default value is Visible.


    +   **Content** This property can be used to set the content of the ScrollViewer
    control. The child element specified through the Content property is then scrolled
    using the ScrollViewer.


    The HorizontalScrollVisibility and VerticalScrollVisibility properties of the
    ScrollViewer can be specified in a XAML of one or its code-behind. Their values
    belong to the ScrollBarVisibility enumeration as members


    # TABLE 3-2 ScrollVisibility


    | MEMBER | VALUE | DESCRIPTION |

    | --- | --- | --- |

    | Disabled | 0 | The scrollbar is not visible, and scrolling is not available
    for the content when the viewport cannot display it. The content is allowed to
    occupy the area in the parent UI element. |

    | Auto | 1 | The scrollbar appears when the content is large enough require require;
    that is, it does not fit within the viewport. |

    | Hidden | 2 | The scrollbar does not appear even when the content can be scrolled
    and the viewport cannot display all the content. This value should be avoided
    in Windows Store apps the user might not realize that the content in the ScrollViewer
    needs scrolling. |

    | Visible | 3 | The scrollbar always appears whenever there is focus on the ScrollViewer.
    If the content fits within the viewport; the scrollbar will be disabled and gray-out.
    |


    The Height and Width properties can be used to explicitly specify the height and
    width of a ScrollViewer control. When placed in a layout within a grid, the ScrollViewer
    occupies the'
