  md: "You add the newly created resource dictionary to your app by specifying it\
    \ in the list of application resources, as follows:\n\n```\n<Application.Resources>\n\
    <ResourceDictionary>\n  <ResourceDictionary.MergedDictionaries>\n    <ResourceDictionary\
    \ Source=\"Common/StandardStyles.xaml\" />\n    <ResourceDictionary Source=\"\
    MyDictionary.xaml\" />\n  </ResourceDictionary.MergedDictionaries>\n  <x:String\
    \ x:Key=\"Appname\">Grid App Sample</x:String>\n</ResourceDictionary>\n</Application.Resources>\n\
    ```\n\nWindows Store project templates built by Visual Studio define the default\
    \ styles of controls within a resource dictionary defined in the StandardStyles.xaml\
    \ file. The ResourceDictionary defines a dictionary of objects that are shareable\
    \ across your app. ResourceDictionary supports styles and templates, brushes and\
    \ colors, animations including StoryBoard, transforms, and other objects from\
    \ the ResourceDictionary are accessed with the StaticResource extension.\n\nYou\
    \ can merge multiple resource dictionaries into a single resource and use it in\
    \ your app. A theme can define a dictionary of objects depending on the theme\
    \ currently selected by the user. Each object in this dictionary is a ResourceDictionary\
    \ with a unique key. The following XML shows two themes with ResourceDictionary\
    \ objects included and within the ThemedDictionaries:\n\n```\n<Application.Resources>\n\
    <ResourceDictionary>\n  <ResourceDictionary.ThemedDictionaries>\n    <ResourceDictionary\
    \ x:Key=\"Default\">\n      <SolidColorBrush x:Key=\"Background\"=\"#FF00000/SolidColorBrush\
    \ />\n    </ResourceDictionary>\n    <ResourceDictionary x:Key=\"Light\">\n  \
    \    <SolidColorBrush x:Key=\"Background\"=\"#FFCDDCC/SolidColorBrush />\n   \
    \ </ResourceDictionary>\n  </ResourceDictionary.ThemedDictionaries>\n  <ResourceDictionary.MergedDictionaries>\n\
    \    <ResourceDictionary Source=\"Common/StandardStyles.xaml\" />\n    <ResourceDictionary\
    \ Source=\"MyDictionary.xaml\" />\n  </ResourceDictionary.MergedDictionaries>\n\
    \  <x:String x:Key=\"Appname\">Grid App Sample</x:String>\n</ResourceDictionary>\n\
    </Application.Resources>\n```\n\nA theme defined as a ResourceDictionary can be\
    \ applied in an application using the RequestedTheme property of the Application\
    \ class, as shown in the following XAML:\n\n```\n<Application x:Class=\"GridApps.App\"\
    \ RequestedTheme=\"Light\">\n</Application>\n```"
