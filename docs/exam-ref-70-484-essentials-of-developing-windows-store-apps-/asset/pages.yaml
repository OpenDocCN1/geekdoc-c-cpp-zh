  md: '# Thought experiment

    Designing an app that uses toast notifications


    In this thought experiment, apply what you''ve learned about this objective. You
    can find answers to these questions in the "Answers" section at the end of this
    chapter.


    Your personal fitness trainer is impressed by your new Windows 8 devices. After
    you show some apps and how you use them, she is interested in exploring the idea
    of building a Windows Store app that will be used by her customers.


    Armed with your experience of developing Windows 8 apps, you start working on
    the requirements of such an app. To engage the customers in the best way possible,
    the app needs to communicate regularly with users. How can you use toast notifications
    in your app to provide users with a nice experience and encourage them to train
    at the fitness center?


    # Objective summary


    +   - Windows 8 provides toast notifications for delivering transient messages
    to users. These messages are delivered even when the app is not running and can
    contain text (optionally) images.

    - Toast notifications can be scheduled for delivery at a future time. Up to five
    notifications can be shown, with a fixed interval between each toast notification
    ranging from 6 to 60 minutes. Scheduled notifications can be canceled by your
    app.

    - Toast notifications can be delivered through the WNS.

    - Toast notifications can be configured to be visible for a longer duration (25
    seconds instead of the default 7 seconds).

    - You can configure the sound played with a toast notification by choosing one
    of the options from the toast template audio catalog. The sound can be set up
    to loop for a long-duration toast notification.

    - When your app is running, it can respond to a toast notification''s *Activated*,
    *Dismissed*, and *Failed* events. It can invoke an action based on the content
    of the toast notification in the *Activated* event. The *Dismissed* event carries
    the reason for dismissal; the *Failed* event contains an *ErrorCode* that provides
    the reason for the error.

    - Your app is launched when it is not running and a toast notification arrives.
    You can add a payload in the XML template of the toast notification and parse
    the information in the payload in the *OnLaunched* event of your app.'
  merge: -1
