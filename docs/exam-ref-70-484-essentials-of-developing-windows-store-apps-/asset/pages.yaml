  md: 'items. The Selector derives from the ItemsControl class and adds the SelectionChanged
    event. It is raised whenever the user selects an item from the collection.


    There are a number of controls that bind to a collection and enable users to select
    one or more items from the collection:


    +   - ComboBox This control displays a list of items in a collection, with only
    one item visible at any time. The user can select a single item from the collection.


    +   - ListBox This control displays items in a collection to fill its dimensions.
    If all the items cannot be displayed within the bounds of the control, the user
    can scroll and view the collection. The ListBox control supports multiple selections
    of items from the displayed list. Users can use the Shift key on their keyboard
    to select multiple items in sequence or the Control key to select multiple items
    from anywhere within the list.


    +   - ListView This control is similar to the ListBox control. It is friendlier
    for touch-based devices with support for the cross-slide gesture as well as the
    right-to-left to select an item from the list. Items in a ListView are laid out
    vertically with a scrollbar visible in certain conditions.


    +   - GridView This control is identical to the ListView control, except it lays
    out items in horizontal direction. Both derive from the ListViewBase class.


    +   - FlipView This control is designed to show one item at a time from the collection.
    The FlipView control provides users with the effect of flipping through the collection,
    similar to reading a book or viewing a photo album.


    The ItemsControl provides a number of properties to customize the layout and display
    of items in the controls listed:


    +   - ItemContainerStyle This property sets the style for rendering an item in
    the collection. The value of this property is set to a style that is used to customize
    the visual properties of the item container. For example, the Style property of
    a GridView control is set through the ItemContainerStyle, which is meant to customize
    each GridButtonItem that displays an item from the collection.


    +   - ItemContainerSelector This property sets the logic to select a specific
    ItemContainerStyle based on the characteristics of the item being displayed from
    the collection.


    +   - ItemsPanel This property sets the panel that is used to lay out the items
    of the collection. The value of this property is an ItemsTemplate object, which
    can have one or more child elements that define the panel layout.


    +   - ItemTemplate This property sets the data template to display an item from
    the collection. A DataTemplate object has one or more child elements that are
    used to define the visual appearance of an item. For example, in a GridView that
    binds to a collection of movies, it contains an Image control for the thumbnail
    and a TextBlock control to display the title of the movie.


    +   - ItemTemplateSelector This property sets the logic to select a specific DataTemplate
    data based on the characteristics of the item being displayed.'
