  md: '# About the Author


    **INDRAJIT CHAKRABARTY, MCP**, is a software architect and developer living in
    Sydney, Australia. Indrajit started programming with Fortran 77 and assembly language
    in high school, and progressed to C and C++ in college. Since 1998, he has worked
    with various Microsoft technologies, most recently with Windows Phone, Windows
    8, and Windows Azure. Indrajit specializes in mobile application design and development
    on various platforms, as well as the architecture that powers mobile services,
    such as push notifications, data synchronization, and security.


    ![](img/81d79ceb6883e2d24731f821954f3393_444_0.png)


    Indrajit runs Liana Solutions (http://www.lianasolutions.com.au), a boutique software
    firm in Sydney that delivers professional software design and development services.
    You can learn more about Indrajit by visiting his personal website at http://www.indyfromoz.com
    and following him on Twitter (@indyfromoz).'
