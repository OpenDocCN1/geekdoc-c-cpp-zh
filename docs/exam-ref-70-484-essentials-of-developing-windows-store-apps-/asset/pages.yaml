    # Objective 5.3: Implement data binding


    Data binding is a powerful technique that simplifies the process of adding data
    to the presentation layer of a Windows Store. Traditionally, applications would
    iterate through a collection of data items and add each item to a control in the
    UI using code. This meant regular updates to code as requirements of the UI changed
    or the dataset itself changed. Data binding couples the data model from the view,
    enabling updates in the data to appear in the view and vice versa.'
