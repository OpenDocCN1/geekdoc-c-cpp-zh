  md: 'WinRT APIs support data binding in common controls through markup extensions
    in XAML. The connection between a control and its data source is expressed as
    a declaration in the XML of the user interface. Data binding enables data from
    controls within the same page to be bound to other controls. It also supports
    binding of a control to a specific property or path within a collection or data
    context. ItemsControl enable items to be bound so that they are displayed as a
    list in the user interface. ItemsControl can be used to bind collections and customize
    the data that is displayed in the user interface.


    Items data that are bound to a data control can be modified using value converters.
    In addition, values entered by a user in a data control can be converted to the
    format supported by the data source. Typically, a class is created by implementing
    the IValueConverter interface to convert the format of the data between source
    and the target. Value converters are handy for modifying data for specific source-target
    pairs, such as the visibility of a control based on the value of a Boolean.


    Dependency properties are central in the data binding mechanism. A dependency
    property is a special type of property, the value of which is obtained from other
    sources. These sources can include values of controls, user input, values from
    parent-child relationships in the user interface, and similar items. Dependency
    properties extend basic properties by providing a wrapper instead of a private
    field that usually backs a basic property. You can create your own dependency
    properties and use them in data binding of controls through XAML.


    Validation of data entered by the user is an important step before the data is
    used in the data model. Validation is typically implemented in the viewModel in
    the Model-View-View-Model (MVVM) architecture. The INotifyDataErrorInfo interface
    can be used to implement custom synchronous and asynchronous validation for user
    input. Filtering, grouping, and data sorting are implemented through the data
    control that is bound to a data collection in the user interface. The CollectionSource
    class supports filtering, grouping, and data sorting for presentation in the user
    interface.


    This objective covers:

    - Choose and implement data-bound controls.

    - Bind collections to items controls.

    - Implement the IValueConverter interface.

    - Create and set dependency properties.

    - Validate user input.

    - Enable filtering, grouping, and sorting data in the user interface.'
