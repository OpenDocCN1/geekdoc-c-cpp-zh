    await ContosoImageSearchService.SearchImagesAsync(searchTerm));\n```\n\nWhen set,\
    \ each property raises the PropertyChanged event. This event is raised for simple\
    \ properties such as the search term or for the collection that represents the\
    \ search results. You can use the code to implement the INotifyPropertyChanged\
    \ interface in viewmodels in an abstract class, which is used as the base class\
    \ for all viewmodels. The Grid App and Split App XAML templates in Visual Studio\
