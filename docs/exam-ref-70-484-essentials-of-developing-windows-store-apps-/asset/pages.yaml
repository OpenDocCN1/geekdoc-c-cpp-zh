    # Objective 3.3: Design and implement the app bar


    App bars in Windows Store apps provide users with a consistent way to access commands
    whenever they need them in the context of the current page (and even for the app)
    to navigate through various sections in an app. App bars (a bottom app bar and,
    optionally a top app bar) are hidden by default and are accessible with a swipe
    gesture from the bottom of the screen, with a right-click of the mouse, or with
    the Windows+Z keyboard shortcut. They are dismissed when the user makes an edge
    swipe or when the user interacts with user. App bars can also be shown and hidden
    programmatically.


    Windows app developers should consider using the app bar to place commands in
    the context of the page as well as navigation shortcuts. Commands that are relevant
    to a page'
