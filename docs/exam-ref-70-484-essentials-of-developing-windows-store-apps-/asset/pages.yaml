    # Objective 5.4: Manage Windows Authentication


    Windows Store apps often require user authorization before they can carry out
    an action or access resources. However, the currently authenticated user might
    belong to a certain group of users or a domain that does not grant access to features
    of the app. An app could be used in multiple locations, including an intranet
    or corporate environment, in a home or public network, and so on. Therefore, user
    authorization based on a user name and password is not adequate. The implementation
    of authorization in Windows Store apps provides a technology that provides the
    identity of a user and roles while on the public Internet. Claims-based identity
    provides a common way to obtain the identity information of users. The ClaimsPrincipal
    class provides methods to obtain users’ claims and check the roles they belong
    to.


    Windows Store apps require users to provide their user name and password for authentication
    without storing them using their implementation for storing credentials. The PasswordVault
    class can be used to securely store user credentials and retrieve them whenever
    required. These credentials can be removed at any time. User credentials stored
    with the PasswordVault class are available across multiple devices when the user
    logs into these devices using the same Microsoft account. The CredentialPicker
    class provides a simple way to show a dialog box to obtain a user’s credentials.
    The credentials can then be stored using the PasswordVault class. The dialog box
    provided by the CredentialPicker class can be customized to suit an application’s
    requirements.'
