  md: "Figure 2-20 shows the search suggestions from a Windows Store app as the user\
    \ starts typing a search query.\n\n![](img/81d79ceb6883e2d24731f821954f3393_125_0.png)\n\
    \n**FIGURE 2-20** Search pane with search suggestions from a Windows Store app\n\
    \nIn a Windows Store app that provides search suggestions, by default the Search\
    \ pane will add the user's previous searches and include them in the suggestions\
    \ as well. *SuggestionsRequested* event places search queries from previous searches\
    \ in the Search pane at a higher priority than the suggestions provided by your\
    \ app. You can turn off this behavior by setting *SearchPane::SearchHistoryEnabled*\
    \ to *False* when you set up the event handler for the *SuggestionsRequested*\
    \ event (within the *OnCreateWindow* method override in the *Application* class).\n\
    \nYou can add one or more recommendations in the suggestions based on the query\
    \ string entered by the user. You might want to add a separator with a heading\
    \ indicating this. Note that the maximum of five items in the list of search suggestions\
    \ rule still applies. Here, a separator counts as one item in the list.\n\nTo\
    \ provide recommendations within your search suggestions, you should use the *AppendSeparator*\
    \ and *AppendResultSuggestion* methods of the *SearchSuggestionCollection* member\
    \ in the *SearchPaneSuggestionsRequestedEventArgs* object. You can also add a\
    \ thumbnail for the recommendation (image size 40 x 40) using an *RandomAccessStream*.\
    \ The *AppendResultSuggestion* method accepts a tag in the third parameter for\
    \ the result recommendation. The tag is used for identifying the recommendation\
    \ when it is selected by the user in the Search charm. Listing 2-12 shows how\
    \ a result recommendation is added to the list of results.\n\n**LISTING 2-12**\
    \ Adding a recommendation to a list of results\n\n```\n// Event handler for the\
    \ SuggestionsRequested event\nprivate void OnSuggestionsRequested(object sender,\n\
    \    SearchPaneSuggestionsRequestedEventArgs args)\n```"
