    \ If you choose not to expose a C++ type or a class that is not sealed, you should\
    \ use the [WebHostHidden] to prevent it from being exposed to consuming JavaScript\
    \ applications. Note that an activatable class name and namespace must not contain\
    \ Unicode characters.\n\nWhen you call methods implemented in a WinMD component\
    \ developed in C++ in a JavaScript Store app, you may use camelCase in your JavaScript\
    \ code. For example, for a method CalculateAverageOfNumbers implemented in a WinMD\
    \ component, you will invoke it as calculateAverageNumberOf in JavaScript. When\
    \ you reference C++ namespaces and classes in JavaScript, you should use the same\
    \ casing as in the C++ implementation. C# and Visual Basic follow their normal\
    \ casing. The following code shows a C++ class definition in a WinMD component\
    \ and how it is used in JavaScript and C#:\n\nSample of C++ code\n\n```\n// ref\
    \ class definition in C++\npublic ref class multiplier sealed\n{\n    // members\n\
    \    public:\n        multiplyAndAdd(double inputA, double inputB)\n        {\n\
    \            return (inputA + inputB + (inputA * inputB));\n        }\n};\n```\n\
    \nSample of JavaScript code\n\n```\n// Create an instance of the WinMD class and\
    \ invoke the method\nvar nativeObject = new CComponent.Multiplier();\nvar result\
    \ = nativeObject.multiplyAndAdd(22.2, 30.1);\n```\n\nSample of C# code\n\n```\n\
    // Create an instance of the WinMD class and invoke the method\nvar nativeObject\
    \ = new CComponent.Multiplier();\nvar result = nativeObject.multiplyAndAdd(22.2,\
    \ 30.1);\n```\n\nIf you are creating a component that is meant for use in Windows\
    \ Store apps with Visual Basic or C#, and the component does not contain Windows\
    \ Store controls, you should consider developing your component as a class library\
    \ instead of a WinMD component because the former has fewer restrictions.\n\n\
    When you create a WinMD component in C#, you can return a managed type created\
    \ in managed code to JavaScript in a way similar to the corresponding WinRT type.\
    \ Note that when a managed type implements multiple interfaces, JavaScript uses\
    \ the interface that appears first in the list."
