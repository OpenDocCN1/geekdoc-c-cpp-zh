  md: 'might not be required in other pages of your app. To provide consistent user
    experience, you should ensure that commands like to be used most often are placed
    at the two edges of the app because these edges can be reached easily by the user’s
    fingers. The fundamental rule for creating commands that are placed in the bottom
    app bar is that they directly interact with the content presented in the page.
    The top app bar should be used for global commands and navigation within the app.
    This design helps the user to focus on the content in your app and prevents distraction
    from commands that are not frequently used.


    +   This objective covers how to:

    - Determine what to put on the app bar based on app requirements.

    - Design the placement of controls in the app bar.

    - Style and position app bar items.

    - Handle AppBar events.


    # Determining what to put on the app bar based on app requirements


    Designing the UI of your Windows Store with a consideration for the commands you
    will require to implement in every page is quite important. In your design, if
    you display the content in a page without including any distractions, such as
    buttons or drop-downs, the user will most likely find it easy to use your app.
    However, a dynamic, interactive app needs commands available for common operations
    throughout the app.


    You have the option to use the charms bar for implementing common commands such
    as search, share, and configuring settings. However, having page-specific commands
    in the charms bar is not a good UI and violates Microsoft design principles. Therefore,
    you should consider the app bars as placeholders for commands that help the user
    interact with your app.


    We can draw some conclusions about the design pattern followed in app bars by
    examining the Weather app shown in Figure 3-17:


    +   - Commands are placed in the app bar starting from the right edge.

    - The top app bar is used for navigation between various sections of an app.

    - The bottom app bar contains commands that invoke actions specific to the page.

    - Commands that are available in multiple pages of an app are placed separate
    from commands specific to a page.'
