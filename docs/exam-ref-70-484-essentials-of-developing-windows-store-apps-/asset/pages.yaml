  md: '# Objective summary


    +   - You should design a Windows Store app to adapt to changes in screen size,
    resolution, and orientation.


    +   - Use the *Grid* control to create flexible layouts in Windows Store apps.
    A *Grid* control has rows and columns with adjustable dimensions for creating
    fixed and fluid layouts.


    +   - The *ScrollView* control can be used to lay content that overflows a visible
    area in the screen. The control has built-in support for touch and zoom.


    +   - The *TextBlock* control can be used with the *ScrollView* control to display
    text in a Windows Store app. Text is wrapped within the *TextBlock*, and the *ScrollView*
    provides the virtual area to render the text.


    +   - Use the *RichTextBlock* control to display text embedded with photos or
