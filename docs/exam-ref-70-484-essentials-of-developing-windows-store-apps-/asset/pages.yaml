    # Setting up OAuth2 for authentication


    The WebAuthenticationBroker class is useful for Windows Store apps planning to
    use OpenID and OAuth-based online identity providers. The authentication mechanism
    in the app is delegated to a third-party service that the user already has access
    to and has a valid set of credentials with the service.


    The OAuth2 open standard provides a simple mechanism to authenticate with an identity
    provider and authorize the requesting application to gain access to resources
    such as social media updates and blog posts. An access token is provided at the
    end of a successful authentication to the app, which is used in all future requests
    from the app to the remote service. The OAuth2 standard does not provide backward
    compatibility with the OAuth1 standard, which implemented a complex mechanism
    of authenticating a user and authorizing the user for access to resources.


    You can use OAuth2 in your Windows Store app to authenticate users with an identity
    provider that implements the OAuth2 standard. Most modern web services implement
    the OAuth2 standard. The following steps are required to set up the WebAuthenticationBroker
    class for OAuth2 authentication.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '+   1. Register a new application with the remote web service that enables
    applications to authenticate users with the OAuth2 standard. Most services provide
    an application or client ID along with a client secret when you register a new
    application. The client secret key is not required during the authentication process.
    Some web services require you to register a redirect URI, which is used to redirect
    your application at the end of a successful authentication. The access token is
    added to the URI in a query parameter.


    +   2. Prepare a URI for authentication with the base URI from the remote service.
    This URI will specify the client ID as well as the redirect URI and, optionally,
    the requested scope of access for resources for the user logging on.


    +   3. Use the AuthenticateAsync method of the WebAuthenticationBroker class to
    prepare authentication with the redirect URI.


    +   4. If the response from the web service is successful (the user was authenticated
    successfully), the redirect URI can be retrieved using the GetCurrentApplicationCallbackUri
    method of the WebAuthenticationBroker class.


    +   5. The redirect URI contains the access token that should be used for accessing
    the user’s resources on the remote service.


    The access token issued by the remote service usually has a finite lifetime; the
    duration is dependent on the service implementing the OAuth2 standard. The user
    can revoke the rights granted by the remote service to your application, which
    will cancel all access tokens granted for your app.


    The remote service provides a URI that your application can use to determine if
    the access token can still be used. If the access token has expired, your app
    can request a new token without going through the authentication process again
    by sending a request to the remote service to refresh the token by providing the
    client ID and, in some cases, the client secret key.


    #  Setting up single-on (SSO)


    User authentication with OAuth and OpenID in Windows Store apps enables users
    to log on with an online identity provider. Users remain authenticated for a session
    or as long as the access token obtained from the remote service is valid. Users
    have to log on app in their PC or device whenever the apps require you to be authenticated.
    SSO enables a user to log on an app using an online identity provider and remain
    logged across multiple devices. It provides an option to the user through a check
    box in the login box to enable them to remain logged on the service.


    SSO requires cookies to be stored in an application. Although the default behavior
    of the WebAuthenticationBroker class does not allow cookie storage, for SSO, cookies
    received during the authentication steps can be stored in a special application
    container. To support SSO, the online identity provider must allow the registration
    of URLs with the format ms-app:///[Application SID]. The'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'application''s package ID (also called the SID) can be obtained from the application''s
    page in the Windows Store.


    The following steps are required to set up SSO with WebAuthenticationBroker in
    Windows Store apps:


    +   1. Register your application with the identity provider and obtain a client
    ID and secret key. Request the provider to register a redirect URL of the form
    ms-app://[Application SID].


    +   2. Use the SilentMode and HttpPost members of the WebAuthenticationOptions
    enumeration in the AuthenticateAsync method; do not specify the redirect URL.


    +   3. If authentication was successful, the identity provider redirects the app
    to the redirect URL configured with an access token as a query parameter.


    +   4. If the redirect URL matches with the application''s SID, the WebAuthenticationBroker
    returns the token to the app. The whole URL is kept in a cookie in a special app
    container so that future authentication requests do not require the user to log
    on with credentials.


    The cookies used for SSO in a Windows Store app are not shared with Internet Explorer,
    other browsers, or other apps. If an app attempts to misuse a cookie for an app
    in which the user is already logged in, it will fail authentication because the
    redirect URL of the two apps will never match.


    > MORE INFO SINGLE SIGN-ON WITH MICROSOFT LIVE SERVICES


    You can read more about implementing SSO with the Live Software Development Kit
    (SDK) for Microsoft accounts in the article at http://blogs.msdn.com/b/windowsappdev/archive/2012/03/14/bring-single-sign-on-and-skydrive-to-your-windows-8-apps-with-the-live-sdk.aspx.
    The Microsoft Live Services team provides an interactive portal in which you can
    explore the Live SDK at http://sdk.dev.com/isdk.aspx.


    # Implementing the CredentialPicker class


    Windows Store apps can use the CredentialPicker class in the Windows.Security.Credentials.UI
    namespace to implement a logon dialog box. The CredentialPicker class provides
    a consistent user experience for authentication of Windows Store apps with remote
    web services. The dialog box presented by the CredentialPicker class can be customized
    with the CredentialPickerOptions.


    > MORE INFO CREDENTIALPICKER CLASS


    For details about the implementation of the CredentialPicker class in Windows
    Store apps, refer to Objective 5.4.'
  merge: -1
