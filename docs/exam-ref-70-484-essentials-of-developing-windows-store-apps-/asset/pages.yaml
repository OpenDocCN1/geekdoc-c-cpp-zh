  md: 'This objective covers how to:


    +   - Implement the Grid control to structure the app layout.

    - Set the number of rows/columns and size.

    - Enable scroll and zoom capabilities in layout controls.

    - Manage text flow and presentation.


    # Implementing the Grid control to structure the app layout


    The layout of Windows Store apps differs from the layout of traditional desktop
    apps. You have a number of options in which place controls, such as the app window,
    flyouts, pickups, dialog boxes, and app bars. The app page forms the base surface
    of your app''s UI. Ideally, you should use this surface to integrate the UI elements.
    An error message, can appear as highlighted inline text with an animation and
    hidden after the user has viewed instead of using the traditional pop-up dialog
    box. A Windows Store app can have as many app pages as necessary to meet business
    requirements and user scenarios.


    In an app page, use layout control to build its structure along with the set of
    controls provided by Visual Studio. The Grid control is the most commonly used
    control for layouts in Windows Store apps. Similar to a HTML table, the Grid allows
    you to specify a number of rows and columns and their dimensions. The size of
    cells in a grid are specified in pixels, as a ratio relative to the size of other
    cells, or to automatically resize based on the size of the contents.


    Using a grid-based layout in a Windows Store app offers several benefits. A well-designed
    Windows Store app applies the Microsoft design style principles of being fast
    and fluid with an emphasis on content rather than UI elements such as whitespace,
    gradient, and color. This means your app follows a consistent pattern of page
    headers, margins, padding, gutter widths, and so on. A prominent feature of the
    grid-based layout is the silhouette, which consists of wide margin on the top,
    bottom, and left edges. This provides users with a visual guide to scroll or pan
    the content horizontally.


    Visual Studio provides a set of templates that use a grid layout to arrange controls
    with support for multiple view states. Figure 3-7 shows the layout of two Windows
    Store apps using the templates provided by Visual Studio.'
