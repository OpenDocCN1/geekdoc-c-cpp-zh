    # # Configuring the app manifest for correct permissions


    In your Windows Store app, you can consider implementing the Search contract and
    even add share target support. In both cases, you will need to declare these contracts
    in the app manifest that the permissions required in your app are set up correctly.
    Note that you are not required to add the Share Target if your app acts as a source
    only.


    Visual Studio provides developers with the templates for implementing the Search
    contract and Share contract. When an app is created with one of these templates,
    Visual Studio adds the appropriate declaration to the app manifest. When you right-click
    your Windows Store project in Visual Studio and then Add New Item, you are presented
    with the dialog box shown in Figure 2-16.'
