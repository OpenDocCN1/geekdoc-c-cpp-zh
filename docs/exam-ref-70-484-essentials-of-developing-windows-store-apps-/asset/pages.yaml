  md: 'In the simple application shown in Figure 4-17, the pointer is not captured
    by the application when the user draws the stroke on the canvas. In some apps,
    you might want to ensure that the pointer remains captured while the user executes
    the action (dragging a card in a game). If the user uses a finger very fast, the
    pointer can be separated from the element. You can use the CapturePointer method
    to capture the pointer in the PointerPressed event handler and call ReleasePointerCapture
    to release the pointer after the user completes the action in the PointerReleased
    event handler.


    # Managing stylus input and inking


    A Windows Store app can use the extensive support for stylus input through the
    pointer classes previously, such as Pointer, PointerDevice, PointerPoint, and
    PointerProperties. Your app can use a stylus to capture handwriting, diagrams,
    and annotations in existing documents. In devices with a screen that supports
    input from a stylus, a digitizer is embedded beneath the screen. The digitizer
    translates various actions of the stylus—such as pressure, angle, and velocity—into
    a data structure available in Windows Store apps.


    Although you can use the pointer events previously in applications that accept
    input from a stylus, some of the properties in PointerProperties class are specifically
    available for the stylus:


    +   - IsBarButtonPressed This property is True if the user presses the button
    along the side of the pen''s body. Some apps use this property to open a context
    menu as a pop-up.


    +   - IsEraser This property is True if the user uses the eraser at the base of
    the stylus on the screen.


    +   - IsRange This property is True if the stylus is close to the digitizer but
    has not touched the screen.


    +   - IsInverted This property is True if the rear of the stylus is used instead
    of the front.


    +   - Pressure This property is a float value (in the range 0.0 to 1.0) that indicates
    the force exerted by the stylus on the digitizer.


    +   - Twist This property is a float value that represents an angle in degrees
    that indicates the amount of rotation of the stylus in the clockwise direction
    along the major axis, for example, when the user is rotating it by spinning it
    in their fingers.


    +   - Orientation This property is a float value that represents the angle in
    degrees at which the stylus is being held perpendicular to the surface of the
    digitizer.


    +   - XTilt This property is a float value that represents the angle in degrees
    at which the stylus is tilted toward the left or right of the screen''s surface.


    +   - YTilt This property is a float value that represents the angle in degrees
    at which the stylus is tilted to the top or bottom of the screen''s surface.'
