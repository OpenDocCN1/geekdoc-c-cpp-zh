  md: '# Enabling data filtering, grouping, and sorting in the user interface


    When data-binding controls to collections, many Windows Store apps display data
    grouped into categories or types. For example, a collection of photos in a photo
    sharing app can be grouped by date taken, tags, or the location where the photos
    were taken. In addition, users can choose to filter their photos by a data range
    or by selecting one of tags. Filtering limits the data that is displayed on the
    screen, enabling users to easily select the items they are interested in. The
    user can choose to sort the data so that the items are displayed in a certain
    order (for example, the most recent photos are displayed first)


    In many cases, altering the format of the data obtained from a source to make
    it suitable for binding is not feasible. Creating a custom view of the data and
    using it between the data source and the target data-bound control is the best
    solution. The ICollectionView supports many of the data before it is presented
    to the


    MORE INFO THE ICOLLECTIONVIEW INTERFACE


    You can read more about the ICollectionView interface at http://msdn.microsoft.com/en-us/library/windows/apps/ui.xaml.data.collectionView.


    If your Windows Store apps needs to display data in groups with headers clearly
    highlighted, you can use the GridView because it supports data binding with collections
    that contain grouped data. WinRT APIs provide the CollectionSource class that
    wraps a data collection and presents it in a way suitable for binding with a data
    control as a GridView. In other words, it helps you to create a custom view for
    the data and have it available for binding. The main properties of the CollectionSource
    class are:


    +   - Source This property is used in the code-behind to set the collection that
    provides the data for the view. The collection can be a list of items retrieved
    from a remote web service or local database, for example.

    - IsSourceGrouped This property is used to indicate whether the data source is
    grouped.

    - ItemsPath This property specifies the path to follow in the data source to find
    groups within the CollectionSource.


    A CollectionSource is declared in XAML and is set as the ItemsSource of the data
    control. It provides a custom view of the original data, grouped per the requirements
    for the app. With the GroupStyle property of a data control such as the GridView,
    you can customize the header, the control used for laying out items of each group.
    Listing 5-26 shows an example of the CollectionSource and the GridView control
    in XAML code.'
