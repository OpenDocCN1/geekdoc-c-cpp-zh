    # Objective summary


    +   * The app bars in a Windows Store app provide a simple and intuitive surface
    for placing navigation and in-context commands. Use the app bar to add commands
    in your app for the design to be consistent with other apps.


    +   * Follow the design guidelines for app bars while designing them.


    +   * Actions as search, share, and settings should be performed using the charms
    bar; these commands should not be implemented in the app.


    +   * Group similar commands on the app bar. Separate commands that are critical
    to the app''s execution from other commands to prevent the critical commands from
    being accidentally invoked.


    +   * You should use the app button styles defined in the StandardStyles.xml file
    whenever possible. You can use standard fonts, your own images, or XAML paths
    to customize the appearance of the app buttons.


    +   * Consider various states your app can be in designing the app bars. The Opened
    and Closed events can be used to set up the app bar in different view states.


