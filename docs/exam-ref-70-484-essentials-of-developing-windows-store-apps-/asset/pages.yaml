    # Objective 5.2: Retrieve data remotely


    Many Windows Store apps require content from the web to be available for various
    features. A connected behavior is important in presenting regular updates from
    social networks, example, or for downloading new items from a subscription site.


    The HttpClient class is useful in implementing features that require data to be
    transferred in and out of a Windows Store app. The class supports web services
    that extend REST verbs to be used in the requests as well as the standard set
    of HTTP status codes. The HttpClient class can be used for secure connections
    to protect the data being transferred. Windows Communication Function (WCF) provides
    a runtime environment for web services that expose logic. Simple Object Access
    Protocol (SOAP) is often used with the communication protocols these support.
    WinRT APIs provide support to integrate with such services. WebSocket provide
    a mechanism for transporting messages and binary data over HTTP. The protocol
    implements a two-way handshake which makes it suitable for use in Windows Store
    apps. WebSocket can be used for server-application communication that involves
    a simple exchange of data. The HttpClient class provides methods for transfers
    as well as cancelling all ongoing transfers. For transferring large files and
    chunks of data that consume significant amount of time, background transfers can
    be used in Windows Store apps.'
