  md: 'Windows Store apps can act as contact providers by declaring the contact picker
    extension in the package manifest. These apps are available in the people picker
    drop-down menu when the user selects one or more contacts.


    The ContactPicker class is used to set up the user interface (UI). The ContactPickerUI
    class, provided by the Windows.ApplicationModel.Contacts.Provider namespace, is
    used to display selected contacts. You can filter the contacts to be displayed
    in your application by specifying which fields from the contacts to use when selecting
    them. You can create new contacts and update their properties, such as their thumbnail,
    from within your app.


    # This objective covers how to:


    +   - Call the ContactPicker class.

    - Filter which contacts to display.

    - Select specific contact data.

    - Display a set number of contacts.

    - Create and modify contact information.


    # Calling the ContactPicker class


