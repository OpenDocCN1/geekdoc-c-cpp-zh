    # # Signing an application


    When you create an app package using Visual Studio, it is signed with a test certificate.
    The app package resides in a folder called AppPackages within the package directory;
    this folder is created by Visual Studio. The certificate (.cer) file in the folder
    contains the public key used to sign the package. This key must be installed before
    the app package is installed.


    Visual Studio generates and adds the certificate (with a .fx extension) to your
    project. This certificate is valid for one year after creation. You can generate
    a new certificate using Visual Studio through the Packaging tab in the app manifest
    designer. Click the Choose Certificate button to open the Certificate dialog box.
    Expand the Configure Certificate list, choose Choose Create test certificate,
    and click OK. You will then add the Publisher Common Name and a password for the
    certificate file. Visual Studio regenerates the certificate with a new expiration
    date.'
