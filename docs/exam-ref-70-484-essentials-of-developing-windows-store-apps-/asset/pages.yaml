    When user has selected your app to share content, you should not force the user
    to remain with the share UI if your app takes time to parse the data to be shared.
    You should use the ReportStarted method of the ShareOperation object to inform
    the system that your app is processing the request to share content. This ensures
    the share operation continues to run in your app even after the user dismisses
    the share UI and returns to the source app.


    The user can dismiss the source app before you have finished acquiring data from
    the DataPackage object. you should notify the system with the ReportDataRetrieved
    method of the ShareOperation object when your app has all the data it expects
    from the source app. The system can then suspend or terminate the source app.


    In some apps, the operation can include instructions to retrieve the content to
    be shared from a remote location. For example, the URI of a resource is shared
    instead of the resource itself. The target application downloads the resource
    from the URI as part of the share operation. The target application typically
    uses background transfer to download the resource and notify the system that a
    background transfer is under way with the ReportBackgroundBackgroundTask method
    of the ShareOperation object.'
