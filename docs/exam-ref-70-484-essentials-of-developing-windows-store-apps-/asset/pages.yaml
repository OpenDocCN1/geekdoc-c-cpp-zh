    +   - Contacts can be filtered and sorted by specifying the fields used in the
    selection using the KnownFieldContext class. Selected fields of a contact can
    be displayed using the ProductCategory and ContactField classes.


    +   - Whenever possible, you should integrate your app with the charms bar and
    the Search, Share Target, Settings, and Devices controls. This helps your app
    to be popular among users as you find it easy to use your app for searching and
    sharing content.


    +   - You should configure your app''s manifest with the right permissions. This
    is important when you support various contracts in your app.


    +   - You should provide search result previews in your app. This helps users
    to easily select an item from the search result.


    +   - Query suggestions and result recommendations enrich the search experience
    for the user; you should consider implementing them in your app whenever possible.


    +   - Your app is discovered and used more often if you support activation by
    search. Users can pick your app to carry out their search even if your app is
    not running.


    +   - If your application has content, consider implementing the code to set up
    your app as a share source. You should consider supporting as many formats as
    possible so that the user has multiple choices of apps to use for sharing content
    from your app.


    +   - While accepting share requests from other apps, you should support as many
    formats as possible. This enables your app to be used in most scenarios. Add a
    QuickLink for a sharing action; this helps your app to be found in the list of
    suggested apps available for sharing content.


    +   - Use the DataPackage and DataView objects to share data and view shared data,
    respectively. If you require a custom format to share data, check the custom formats
