    # Planning the requirements for an enterprise deployment


    If you develop a Windows Store app and plan to make it available to a large number
    of Windows users, if you want to target business users, you can offer your app
    through the Windows Store with each user purchasing your application. Alternatively,
    you can offer your app for free to users through the Windows Store and manage
    licensing directly with the organization in which your app will be deployed.


    If you plan to make your app available for selected enterprises and users, IT
    administrators distribute your app within the enterprise without involving the
    Windows Store. This process is called sideloading. Although your app will be deployed
    for enterprise users does not need to go through the Windows Store certification
    process, it is expected that you have followed the Windows design UI guidelines
    and that your app has been tested with the Windows ACK.


    The following steps describe how to distribute a Windows Store app within your
    enterprise:


    +   1. Use the Windows ACK to test your application. You should also test your
    app Windows RT with the ACK for Windows RT if you can support Windows RT. Testing
    your app with the ACK helps identify issues before deployment to users.


    +   2. Your app must be signed with a certificate issued by a certificate authority
    (CA) trusted by the target PCs. The publisher name in your application''s manifest
    must match the publisher name in the certificate used to sign the app. If you
    use a certificate from one of many CAs trusted by Windows, you do not need to
    deploy and manage additional certificates on the targeted Windows 8 devices. If
    you choose to use your own CA to sign the app, IT administrators must ensure the
    certificate is installed in the targeted Windows 8 devices because your CA may
    be untrusted.


    +   3. When your app is tested and signed, give the signed app package and any
    dependencies to the IT administrators.


    +   4. IT administrators prepare the target Windows 8 PCs and deploy your app.
    Windows Server 2012 and Windows 8 Enterprise are enterprise sideloading ready,
    which means they are ready for your app to be installed. For such PCs, IT administrators
    should ensure they are joined in the domain and Group Policy is to Allow Trusted
    Apps To Install. IT administrators deploy your app to Windows 8 Pro, Windows RT,
    and Windows Enterprise devices should configure them by activating the product
    key for enterprise sideloading for each device and setting the Group Policy to
    Allow Trusted Apps To Install.


    Chapter 1 Design Windows Store apps'
