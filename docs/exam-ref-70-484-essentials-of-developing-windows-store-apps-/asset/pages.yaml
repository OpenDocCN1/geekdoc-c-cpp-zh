  md: 'A Windows Store app can be activated when the user carries out a search query
    through the Search charm because the user chooses an app to search for when entering
    the query string. When the app activates, the QueryText property of the SearchActivatedEventArgs
    (in the OnSearchActivated method) provides the string entered by the user. The
    string can be used to carry out the search in the app.


    It is possible for an app to be activated with an empty QueryText string. In such
    a case, the app''s last-viewed page if the app is running or suspended. If the
    app isn''t running or suspended, and is activated with an empty QueryText string,
    display the landing page for search results. In order to support scenarios in
    which your app is activated with an empty QueryText string, save the state of
    your app before the is suspended or closed by the user.


    If the app is snapped when it is activated by the user carrying out search using
    the Search charm, the app automatically snaps. Therefore, the app should adjust
    itself to be the main app on the screen. You can use the SizeChanged event to
    adjust the layout of the app''s search result page. Save the search results currently
    displayed in the app as well as the query string, in case the app is activated
    to search for that again. If the search results are prone to change over time,
    you should refresh the search results after displaying the saved search results.


