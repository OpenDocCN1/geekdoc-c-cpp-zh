    # Thought experiment

    Making design choices for a movie browser application


    In this thought experiment, apply what you''ve learned about this objective. You
    can\find answers to these questions in the "Answers" section at the end of this
    chapter.


    A popular movie database and search engine website is about to provide access
    to

    data through its public API. It expects developers to build applications on all

    major platforms, including Windows 8.


    Armed with your experience in implementing Windows Store apps, you start the

    process of drawing up the requirements and wireframes of your app. With your

    knowledge of working with common data controls in Windows 8, list the five

    features you will implement in your app that will enable it to have an edge over
    the

    competition.


    # Objective summary


    +   - GridLayout, ListView, and FlipView are controls with built-in support for
    interaction

    through touch and zoom. Visual Studio provides developers with application templates

    that are set up with these controls for displaying data.


    +   - The Grid control is used in Ul where data is laid out. It can be

    scrolled and panned in the horizontal direction, so it is the ideal choice for
    showing

    the fill and full screen landscape views.


    +   - The ListView control is used in Ul with horizontal space constraints. It
    can be scrolled

    panned in the vertical direction, so it is the ideal choice for supporting the

    sapped and full screen portrait view states.


    +   - The FlipView control should be used in distraction-free Uls as photo albums
    and

    news readers. It has built-in support for the swipe gesture and supports accessibility

    through the keyboard and mouse.


    +   - Data templates provide the flexibility in the usage of data controls. They
    are used to

    compose the UI independent of the underlying data model. Data binding is used
    to\connect the UI with view models with the data templates acting as the glue
    between

    two.


    +   - The DataTemplateSelector class provides the capability to switch between
    multiple data

    templates in data controls. Templates are applied based on one or more conditions

    that are applicable on an item in the dataset.'
