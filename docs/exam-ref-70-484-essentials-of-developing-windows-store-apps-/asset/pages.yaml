  md: 'Windows provides developers with a number of data controls for use in applications
    in which data plays a central role. The GridView and ListView are typically used
    in scenarios in which an individual item in the list has some details and needs
    to be viewed in a separate page. The FlipView control is useful in scenarios in
    which photos in an album or pages of text need to be displayed in sequence.


    +   This objective covers to:

    - Choose and implement data controls to meet app requirements.

    - Create data templates to meet app requirements.


    # # Choosing and implementing data controls to meet app requirements


    The ListView and GridView controls are useful in applications that display data
    in a list or grid, respectively. Users tap an item in a list and view the details
    of the item, pan or scroll through items, and use zooming to the data as categories
    or groups. Both these are derived from the ListViewBase base class, which provides
    all the methods, properties, and events available in these. Thus, a GridView is
    a grid of items, and a ListView is a list of items. The FlipView control displays
    a list of items as a sequence with a "flip" behavior to traverse the collection
    of items.


    # # The GridView control


    The GridView enables you to display a list of data that can be scrolled or panned
    horizontally. It can also handle grouped data. This means you can arrange categories
    of data in groups and add subheaders to mark categories present in the data. It
    provides you with a control template that you can use to customize the way individual
    items are arranged and a data template for individual items.


    You can customize the GridView to make individual items of variable height and
    width. In your Windows Store app, you may want to highlight a particular data
    by making the size of an item larger than the others in the same category. In
    applications in which a large dataset is displayed using a GridView, navigation
    among categories can pose a challenge to the user. The GridView supports Semantic
    Zoom, which provides an easy way to navigate categories or groups of data in the
    GridView. Semantic Zoom alters the visual appearance of content when you zoom
    in or out. For example, the zoomed-out view can be represented by thumbnails of
    categories or groups of data, and the zoomed-in view can contain a fixed number
    of data items.


    The GridView provides a layout to display data so that the user can drill down
    to the details of an item, through large sections of data, and respond to changes
    in the view state. The Windows Store App template provided by Visual Studio helps
    you build'
