    # Objective 2.2: Design for charms and contracts


    Microsoft design style emphasizes the "content over chrome" principle, which minimizes
    distractions for the user. A well-designed app should provide the user with an
    easy way to perform actions to interact with the app. Actions that are less frequently
    used, such as search and sharing the settings of the app, are placed in the charms
    bar.


    Windows Store apps can integrate actions provided by the charms bar such as search,
    share, connect to devices for printing or streaming media, or display application
    settings. The UI presented through the charms bar is placed on top of the app,
    so any UI elements below it will be hidden.'
