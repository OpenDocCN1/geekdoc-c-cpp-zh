  md: '# Objective summary


    +   You can use the HttpClient class to retrieve data from remote servers. You
    can set additional properties in the request to control its behavior.


    +   HTTP verbs such as GET, POST, PUT, and DELETE can be used to retrieve and
    update resources in a remote server.


    +   Windows Store apps can reference WCF services and use methods exposed by the
    services to carry out operations such as requesting data.


    +   WebSockets provide a simple yet powerful method of communication between a
    Windows Store app and a server that supports WebSockets.


    +   You can use MessageWebSockets in scenarios where relatively small messages
    in UTF-8 or binary format are exchanged between the client and the server.


    +   You can use StreamWebSockets for exchanging large messages in the binary format
    between the client and the server.


    The progress of data requests can be controlled by examining the HTTP headers
    and then reading the payload; requests can be canceled if necessary.


