  md: "It can often be challenging to load the XML template and prepare it for use\
    \ with the TileUpdater of your app. The NotificationExtensions library provides\
    \ strongly typed objects for preparing notifications.\n\n# MORE INFO NOTIFICATIONEXTENSIONS\
    \ LIBRARY\n\nMore information about the NotificationExtensions library is available\
