  md: "# MORE INFO CLAIMS-BASED IDENTITY AND ACCESS CONTROL\n\nYou can read more about\
    \ claims-based identity and access control at http://msdn.microsoft.com/en-us/library/ff423674.aspx.\n\
    \n# Storing and retrieving credentials with the PasswordVault class\n\nA Windows\
    \ App can obtain the user's name and password for authentication within the app\
    \ or for authentication with a remote web service. In some cases, the credentials\
    \ are required every time the user needs to access a resource or carry out an\
    \ action. The user can choose to run an app on multiple devices, so it is not\
    \ ideal for the app to force the user to enter credentials on multiple devices.\n\
    \nThe PasswordVault class in the Windows.Security.Credentials namespace enables\
    \ Windows Stores to securely store the credentials of a user and have them available\
    \ across all the devices where the app is installed and accessed with the user's\
    \ Microsoft account. You can add a credential with a resource name that your app\
    \ use later to retrieve the stored credential.\n\nThe PasswordVault class stores\
    \ the credentials of a user as a PasswordCredential object. An instance of the\
    \ PasswordCredential class is created with the user name and password provided\
    \ by the user along the resource name to identify the credentials. The following\
    \ example shows how the PasswordVault and PasswordCredential classes are used\
    \ to store user credentials:\n\nusing Windows.Security.Credentials;\n\n```\npublic\
    \ sealed partial class PasswordVaultSamplePage : LayoutAwarePage\n{\n    // Provide\
    \ a resource which will be used to access the credentials later\n    private void\
    \ SaveUserCredentials(string username, string password, string resource)\n   \
    \ {\n        try{\n            PasswordVault vault = new PasswordVault();\n  \
    \          PasswordCredential cred = new PasswordCredential(resource, username,\
    \ password);\n            vault.Add(cred);\n        }\n        catch (Exception\
    \ cred)\n        {\n            // Handle the error\n        }\n    }\n}\n```"
