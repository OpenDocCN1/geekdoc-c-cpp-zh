  md: "+   - Windows.UI.Xaml.Input This namespace provides classes, delegates, and\
    \ enumerations required for input support in apps and UI elements.\n\n+   - Windows.Devices.Input\
    \ This namespace provides the infrastructure for identifying the connected input\
    \ devices and their properties.\n\n+   - Windows.UI.Input.Linking This namespace\
    \ provides support for the Windows 8 inking system.\n\nBefore you proceed with\
    \ the development of a custom gesture recognizer, consider whether customizing\
    \ the commonly available input modes will lead to confusion and inconsistency\
    \ in the experience. For example, in a contacts manager app, you feel users want\
    \ to multi-select items in a GridView with a custom gesture. however, because\
    \ the Start screen and other Windows Store apps use the cross-slide gesture to\
    \ select an item individually and perform operations on them.\n\nIf you decide\
    \ to develop your own gesture recognizer, you should develop your own gesture\
    \ recognizer class from GestureRecognizer or use it to process the pointer and\
    \ other events. In the handler of the pointer events, you can carry out your own\
    \ processing and invoke one of the methods of the GestureRecognizer class to complete\
    \ an action. For example, when the pointer is pressed, your app can do some processing\
