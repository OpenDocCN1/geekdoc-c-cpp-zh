  md: "# Create Style Resource\n\n![](img/81d79ceb6883e2d24731f821954f3393_227_0.png)\n\
    \n**FIGURE 3-28** Visual Studio provides you with multiple options to apply the\
    \ Style resource in your application\n\nIf you plan to use the style in multiple\
    \ pages of your app, you should create it in App.xaml or StandardStyles.xaml.\
    \ If you plan to use the style within a single page, Visual Studio places the\
    \ newly created Style resource within the *Page.Resources* section.\n\nYou can\
    \ share the styles used for the TextBlock and TextBox controls in Figure 3-27\
    \ with other controls if their *Target* is set to Control. These can be defined\
    \ without the *Key*, which causes the style to apply to all controls of that Target.\
    \ This is called an *implicit style*, in contrast with the styles discussed earlier\
    \ that are *explicit styles*. For example, if you wanted all the TextBlocks in\
    \ a page to have some properties set to the same value, you can apply the following\
    \ style in XAML:\n\n```\n<Style TargetType=\"TextBlock\">\n  <Setter Property=\"\
    FontSize\" Value=\"24\" />\n  <Setter Property=\"Width\" Value=\"200\" />\n</Style>\n\
    ```\n\nThe implicit style will apply to all TextBlocks in a page if the style\
    \ is declared in the *Page.Resources* section or it will be applied to all TextBlocks\
    \ if it is added to the *ResourceDictionary* section in App.xaml. Any TextBlock\
    \ can override the appearance set by the implicit style by explicitly setting\
    \ individual properties of the Style. You can also apply the default style to\
    \ a TextBox in the app by setting its Style to *null*. An important property of\
    \ the Style class is *BasedOn*. This property allows you to create new styles\
    \ based on existing styles using the StaticResource XAML extension. For example,\
    \ the following code defines a style for the TextBox control:\n\n```\n<Style x:Key=\"\
    OptionalTextBlockStyle\" TargetType=\"TextBlock\"\n  BasedOn=\"StaticResource\
    \ MandatoryTextBlockStyle\">\n  <Setter Property=\"Foreground\" Value=\"White\"\
    \ />\n</Style>\n```\n\nThe Style property of any control is useful in customizing\
    \ its built-in appearance. You can change the built-in appearance of a control\
    \ by using the *ControlTemplate* class to create a"
