    \nThe consistency in the appearance of Windows Store apps using a grid to lay\
    \ out pages is an incentive for users to use your app. Microsoft prepared some\
    \ guidelines when designing the controls and the grid-based templates. These guidelines\
    \ should be followed by Windows Store app developers whenever possible; they are\
    \ summarized here:\n\n+   - The grid layout system is made up of units and subunits,\
    \ the unit being the basic unit of measurement. A unit is 20x20 pixels square.\
    \ It is divided into subunits of 5x5 pixels; therefore, there are 16 subunits\
    \ per unit. It is a good practice to compose your UI in multiples of units and\
    \ subunits.\n\n+   - The baseline of the app page header is 5 units, or 100 pixels\
    \ from the top. The left margin for the page header is 6 units, or 120 pixels.\
