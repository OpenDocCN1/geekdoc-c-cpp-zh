  md: '# Command specific to the page


    # Commands available in other pages of the page


    **FIGURE 3-17** The app bar showing content and the app bars


    The app bar in a Windows Store app can contain commands that are used to help
    the user find the right content to explore or share, such as by providing filters
    that can be selected at one time. The Bing app, which you saw in Chapter 2, provides
    this functionality. The app bar can contain commands that help the user select
    a specific view of the page while remaining in the page; for example, the day,
    week, and month views in a calendar app. Common guidelines for app bars are summarized
    as follows:


    +   - Use command groups to group distinct sets of commands and place them at
    opposite sides of the app bar. For example, if you have two sets of commands in
    a page, one for creating new content and the other for operating on existing content
    such as applying filters, place them on opposite sides of the app bar. If you
    have more than two sets of commands in use, use a separator to separate them.


    +   - If you need to implement app bars in multiple pages, make sure the commands
    in the app bars are in the same location or as close to the same location as possible.


    +   - Separate critical commands from other commands to avoid accidental execution.


    ![](img/81d79ceb6883e2d24731f821954f3393_201_0.png)'
  merge: -1
  pgno: 201
- img_proc: true
  md: '+   Show the app bars automatically whenever an item in the content is selected.
    Because most users are right-handed, contextual commands for the item should be
    placed in the left side of the app bar. This will prevent their arms or hands
    from blocking their view of the commands.


    +   When there are too many commands to fit in the app bar, consider using context
    menus and flyouts.


    +   Microsoft provides default styles for commands, menus, and flyouts. Use these
    default styles in your application to arrange commands in the app bar. The default
    layout is designed to support touch and fit up to 10 commands on all supported
    screen widths. You can change the color of the background, icons, and labels,
    but avoid changing the size or padding of the buttons.


    +   Design your app bar for snap and portrait views. The horizontal dimensions
    of these views are different, and special attention is required to lay out the
    commands in the app bar in these views. If you have up to 10 commands, Windows
    automatically hides labels and adjusts padding the app bar when the user snaps
    your app or rotates to the portrait orientation.


    +   You should provide tooltips for the commands in the app bar. This is helpful
    in states when the system hides the labels in the buttons.


    +   Use the top app bar for navigation and the bottom app bar for commands.


    +   Whenever there are contextual commands in the app bar, make the app bar sticky
    so it is dismissed when the user touches in the main area of the screen. For example,
    in a photo-editing program, the app bar should be visible as the user is editing
    the photo displayed on the screen.


    +   If your app requires horizontal scrolling, reduce the height of the scrollable
    area when the app bar appears in sticky mode to avoid content being hidden behind
    the app bar. You can set the Background property of the app bar to *Null* to prevent
    the app bar from blocking taps and clicks on content beneath the app bar.


    +   Whenever possible, use the built-in icons for commands to have a consistent
    appearance with other apps.


    +   Avoid putting critical commands in your app bar. For example, in a camera
    application, the button to take a photo should be placed in the main surface,
    not in the app bar.


    +   Do not put Clipboard commands such as cut, copy, and paste in the app bar;
    put them in a context menu in the app page inset.


    +   Do not put settings commands, search, and commands for sharing content in
    the app bar. The charms available for these operations.


    +   The background of the app bar can match your main color.


    You should also consider cases when the user is likely to use the right mouse
    button to interact with your app. In most applications, right-clicking the app
    displays the app bar. However, if your app depends on critical commands to be
    carried out with right-click, ignore the events that show the app bar. To provide
    a consistent user experience, consider'
