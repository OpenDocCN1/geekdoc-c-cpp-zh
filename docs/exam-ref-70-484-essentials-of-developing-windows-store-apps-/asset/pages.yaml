  md: "You can provide snap points in a Windows Store app to control zooming behavior.\
    \ Snap points are logical points at which manipulation of content is stopped,\
    \ and a subset of the content is visible in the page. It is recommended you use\
    \ snap points at common zoom resolutions, such as 100%, 75%, 50%, and 25%. You\
    \ can provide mandatory snap points for your app to continue the panning until\
    \ a snap point is reached, or can provide proximity snap points to continue snapping\
    \ only when the current location is close to a snap point. You can specify a list\
