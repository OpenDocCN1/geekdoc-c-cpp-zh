  md: '# Answers


    This section contains the solutions to the thought experiments and answers to
    the lesson review questions in this chapter.


    # Objective 5.1: Thought experiment


    A Windows Store app can use a number of options to store and retrieve data based
    on its requirements. For an app used in the field requiring access to a document
    repository, or data transferred in and out of removable USB flash devices, for
    example, there are a number of options that can be implemented:


    +   * **Windows Azure Storage for log files** When a technician copies a log file
    for diagnosis and analysis, it can be saved into Windows Azure Storage. These
    files can be accessed from any location at time by any technician.

    * **Temporary application data store for knowledge base** While in the field,
    the technician might need to refer to knowledge base articles several times. The
    technician can download these articles and save them in the temporary store for
    quick access.

    * **MRU and future access list for reports** The technician might spend a considerable
    amount of time writing a report, and refer to previously written reports frequently.
    Using the MRU list and future access list for the most recently accessed files
    improves the technicians'' productivity.

    * **Accessing removable devices** The app can be configured so that data can be
    copied and saved to a removable USB flash device.


    # Objective 5.1: Review


    +   1. Correct answers: B, C, D


    +   **A. Incorrect:** The roaming application data store has restrictions on the
    amount of data that can be stored in it. It means to be used for storing data
    that can be rapidly synchronized with other devices.


    +   **B. Correct:** The temporary application data store can be used to cache
    files while the application is running. The system periodically removes files
    from this store, so an app doesn''t need to manage the data stored in a temporary
    store.


    +   **C. Correct:** The photos modified and saved by the user need to be available
    across multiple devices. Therefore, the photos can be stored as blobs in Windows
    Azure and accessed from any device.


    +   **D. Correct:** The roaming application data store can be used to store a
    list of recently accessed files with the files stored in Windows Azure or any
    other remote store. Because this list is available across multiple devices, the
    app can use the list to access the files from a remote service from any device.'
  merge: -1
  pgno: 413
- img_proc: true
  md: 'E. Incorrect: Although the install location is available to all applications,
    when the app is removed by the user, all the files in the install location are
    deleted. Therefore, the install location is not suitable for storing files.


    2. Correct answer: B


    A. Incorrect: An app requires a custom implementation to use a local database
    to store the MRU list. It is better to use the WinRT APIs instead of using custom
    code for the feature.


    B. Correct: The MRU and future access lists can be easily used to implement the
    feature. The future access list can hold up to 1,000 items, which is adequate
    for such an app.


    C. Incorrect: The roaming application data store has limitations on its size,
    and the same file cannot be accessed by the user on multiple devices. Therefore,
    this is not a valid option.


    D. Incorrect: Files stored in the temporary data store can be removed by the system
    at time. There is a risk of the file with the most recently accessed items being
    deleted, so it is best not to use the temporary store for such data.


    3. Correct answer: C


    A. Incorrect: It is not a good practice to store the credentials of a user in
    any file or data store.


    B. Incorrect: An article saved in the roaming data store can cause issues with
    synchronization changes changes in the store are propagated across multiple devices.
    An article can be downloaded on any device if the user accesses it.


    C. Correct: The ID of the article can be used to download it and have it ready
    for viewing by the user. Therefore, the roaming ID of the last read article helps
    with improved usability.


    D. Incorrect: Using the roaming store to store data required by the app to function
    properly, such as the ID of the article being read or a list of IDs of the top
    news articles.


    # Objective 5.2: Thought experiment


    +   1. User authentication over a secure connection The Windows Store app can
    use HttpClient with a URL that has https://prefix to authenticate users of the
    organization over a secure connection.


    +   2. HTTP verbs for RESTful requests The app can use HTTP verbs such as GET
    to browse through various items in the system. When they need to upload a new
    piece of work, a new item can be created with an HTTP request with its verb set
    to POST. They can delete their work by sending an HTTP request with its verb set
    to DELETE and also update an item with an HTTP request in which the verb is set
    to PUT.'
  merge: -1
  pgno: 414
- img_proc: true
  md: '+   3. StreamWebSocket for uploading and downloading media StreamWebSockets
    help with the exchange of binary data between the client and server over a secure
    connection when the URL begins with a prefix wss:// Because the server supports
    WebSockets, the app should use StreamWebSockets for exchanging media created by
    the members of the organization.


    # Objective 5.2: Review


    +   1. Correct answer: C


    A. Incorrect: Although sockets can be used to create a client to exchange data
    with the server, it requires a fair amount of work to implement such a client.


    B. Incorrect: Similar to option A, encrypting the traffic manually requires effort
    and the server might not be able to decrypt the data.


    D. Correct: The DefaultRequestHeaders property is used to set up the HTTP headers,
    and a request is sent over SSL if the remote server supports it through https://
    prefix.


    D. Incorrect: A server supporting StreamWebSockets accepts only a ws:// or wss://
    prefix.


    +   2. Correct answers: A, B, D


    A. Correct: Your app can decide whether to use the payload or discard it without
    processing it. This helps to improve client performance.


    B. Correct: This helps with buffering content while the response is being read
    by the client. This helps to improve client performance.


    C. Incorrect: An always-on connection might be useful for receiving data continuously,
    the client has no control over the type of data it expects to parse and use.


    D. Correct: Setting a realistic timeout ensures that the app does not have to
    wait until the server times out the connection. This helps to improve client performance.


    E. Incorrect: MessageWebSockets are used to exchange small amounts of data between
    the client and the server. Because the data from the server can vary in size,
    MessageWebSockets is not a suitable option.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '+   3. **Correct answer:** C, D, E


    +   A. **Incorrect:** Although the `HttpClient` can be used for secure authentication
    using a URL with a https:// prefix, setting a long timeout to download all data
    will make the game unresponsive it waits for the data to arrive in scenarios where
    it takes long for the data to arrive.


    +   B. **Incorrect:** Sockets over TCP can be used to implement the requirements,
    but it will require fair amount of work to manually authenticate, control the
    download requests, and so on.


    +   C. **Correct:** The user can be securely authenticated using a URL with an
    https:// prefix before any data is exchanged between the client and the server.


    +   D. **Correct:** MessageWebSockets are useful in exchanging small amounts of
    data between the server and the client. The client can use a URL with a wss://
    prefix for security.


    +   E. **Correct:** StreamWebSockets are useful for downloading large amounts
    of binary data such as game content from a server. The client can use a URL with
    a wss:// prefix for SSL security.


    # Objective 5.3: Thought experiment


    WinRT APIs provide developers with a number of features that can be used to develop
    Windows Store apps that target multiple geographies, and they can be used in any
    location of the world. Windows Store apps can benefit from these features as follows:


    +   **1. Data controls** Tourists can view information about a destination or
    an attraction in various ways. If similar items are grouped together, data controls
    along with the *CollectionViewSource* can be used to group, sort, and filter them
    in such an app.


    +   **2. Multiple layout and language format support** Data controls support right-to-left
    layouts as well as right-to-left languages. This feature helps users from anywhere
    in the world to use the app.


    +   **3. Value converters** Value converters are very for for customizing presentation
    to a specific category of users. The language parameter available in the converter
    methods can be used to specify the language for the data conversion. This is useful
    when formatting data specific to the geography in which the app is being used.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Objective 5.3: Review


    +   1. Correct answer: C


    +   A. Incorrect: A StackPanel is used to arrange a list of items in a layout,
    Instead, it is not ideal to use for displaying a collection of items.


    +   B. Incorrect: A ListBox is used to show a list of items with a scrollbar visible
    exceeds its bounds. A ListBox is not ideal for displaying a small fixed list of
    items.


    +   C. Correct: A ComboBox is ideal for showing a fixed list of items with one
    item visible at any time. A GridView is suitable for displaying a collection.


    +   D. Incorrect: Although a StackPanel can be used to display a small fixed list
    of items, a ListBox is not ideal for a collection that the user can interact with,
    such as selecting a recipe.


    +   2. Correct answer: B


    +   A. Incorrect: The data binding framework does not provide support for validating
    data; you need to implement the INotifyDataErrorInfo interface in the data entity
    class.


    +   B. Correct: The INotifyPropertyChanged interface enables property notifications
    to update the target of data binding whenever the source changes. The INotifyDataErrorInfo
    interface adds support for validating user input.


    +   C. Incorrect: The INotifyDataErrorInfo interface is not supported by the WinRT
    APIs. Instead, you should use the INotifyDataErrorInfo interface.


    +   D. Correct: To update the target of data binding with any changes in the source,
    the INotifyPropertyChanged interface should be implemented.


    +   3. Correct answers: B, C, D


    +   A. Incorrect: Any updates in the collection are not visible in the GridView
    when it is bound to the collection. A CollectionViewSource or an ObservableCollection
    should be used.


    +   B. Correct: The GridView controls displaying grouped items present in the
    CollectionViewSource object. Therefore, the ItemsSource property of the GridView
    should be set to the CollectionViewSource object.


    +   C. Correct: You should group items from the data source using LINQ and use
    the view as source of data for the CollectionViewSource object.


    +   D. Correct: Setting the IsSourceGrouped to True indicates that the data in
    CollectionView is grouped and adequate for display in groups in a GridView.


    +   E. Incorrect: A DataTemplateSelector is useful for customizing individual
    items in a data control as a GridView; it is not adequate for displaying items
    in groups.'
