    In addition to providing support for a dynamic layout in pages, the ScrollViewController
    has built-in support for touch and zoom. By default, it enables the pinch-to-zoom
    gestures on the content. The properties of the ScrollView relevant for zooming
    are the following:


    +   - **ZoomMode** This is a Boolean that indicates whether zooming is available
    in the ScrollView. The values allowed for this property are Enabled and Disabled.

    - **ZoomFactor** This property sets the current value for scaling content. The
    default value of this property is 1.0, which indicates no scaling. Use the ZoomFactor
    method to change the value of this property at runtime.

    - **MinZoomFactor** and **MaxZoomFactor** These properties specify the minimum
    and maximum runtime values for ZoomFactor. The default value of MinZoomFactor
    is 0.1, and the default of MaxZoomFactor is 10.0.

    - **ZoomChainingEnabled** This property specifies whether zooming is enabled from
    this child to its parent. Zoom chaining the zooming action carried out by the
    user on a child element should be available on the parent ScrollView control.

    - **ZoomInertiaEnabled** This property specifies the zoom actions should include
    inertia in their behavior and value. Inertia in zooming action slows down the
    effect of zooming in or out of a UI element.'
