    # Objective 4.2: Notify users by using toast


    Toast notifications are transient notifications sent by Windows Store apps to
    inform the user of an event such as new email or a friend request. A toast notification
    appears in the top-right corner of the primary monitor (top-left corner for right-to-left
    languages) for a specific period of time with an optional audio tone that can
    be customized. Toasts contain text with images in some cases and their duration
    can be controlled when they are configured for delivery. Toasts can be created
    locally when your application is running, they can be scheduled for delivery at
    a specific date and time in the future, or they can delivered via push notifications.
    Users can turn off notifications from apps from the PC Settings for a specific
    period of time or they can turn off notifications for all the apps.


    +   This objective covers to:

    * Enable an app for toast notifications.

    * Populate toast notifications with images and text using the ToastUpdateManager
    class.

    * Control toast duration.

    * Play sounds with toast notifications.

    * Respond to toast events.


    # Enabling an app for toast notifications


    Toast notifications are messages that appear for a short duration from a Windows
    Store app. They can appear even when the app is not running. They invite the user
    to access your app and carry out an action or view content. Users are provided
    with an opportunity to opt out of toast notifications if they do not want to be
    notified by your app. Toast notifications are expected to be used with other notification
    methods such as tile notifications and badge updates.


    If you plan to implement toast notifications in your Windows Store app, you should
    configure your app''s package manifest with the option to show toast notifications.
    You can configure your app for toast notifications using the manifest editor in
    Visual Studio, as shown in Figure 4-12.'
