  md: 'In its simplest form, the PickAsync method accepts two parameters: a target
    name used to identify the application or service for which the credentials are
    required, and a message that is displayed in the dialog box. An overload of the
    PickAsync method accepts a third parameter that can be used to display a caption
    in the dialog box. A further overload of the PickAsync method can be used with
    an object of the type CredentialPickerOptions that enables additional customization
    of the dialog box. For example, the Save checkbox can be selected when the dialog
    box is shown. The properties of the CredentialPickerOptions class that you will
    typically use in Windows Store apps are as follows:


    +   - Caption This property is used to set the caption of the dialog box to be
    visible to the user.

    - Message This property is used to set a message to the user in the dialog box.

    - CredentialSaveOption This property is used to configure the Remember My Credentials
    option in the dialog box and is used to indicate whether the user wishes to save
    the credentials. The value of this property is set to a member of the CredentialSaveOption
    enumeration, as Hidden to hide the option, Selected to select the check box as,
    and Unselected to clear the checkbox.

    - CallavesCredential This property is used to specify whether the application
    will save the credentials of the user if they has opted through the Remember My
    Credentials dialog box. The default value of the CallavesCredential property is
    False.

    - AuthenticationProtocol This property is used to specify the type of authentication
    protocol that will be used with the credentials for user authentication. The value
    of this property is set to a member of the AuthenticationProtocol enumeration.
    The default for this property is Negotiate.

    - CustomAuthenticationProtocol This property is used to specify the name of the
    custom authentication protocol that will be used with the credentials for user
    authentication. To use a custom authentication protocol, you must set the value
    of the AuthenticationProtocol property to AuthenticationProtocol.Custom.

    - PreviousCredential This property is used to specify the credential of the user
    previously stored by the application and to prefill fields in the CredentialPicker
    dialog box.


    # MORE INFO AUTHENTICATIONPROTOCOL ENUMATION


    You can read about the AuthenticationProtocol enumeration at http://msdn.microsoft.com/en-us/library/windows/apps/windows.security.credentials.ui.credentialpickeroptions.authenticationprotocol.aspx.'
