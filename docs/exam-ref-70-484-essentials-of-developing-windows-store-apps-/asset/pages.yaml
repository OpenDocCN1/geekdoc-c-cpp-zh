    # Searching for launching other apps


    In a Windows Store app, you can provide the user with the option to search for
    within the app and include local content as files of specific types in the search
    results. Your app might be capable of opening these files for the user or it might
    launch another app that supports the file type or a URI scheme association.


    A Windows Store app can launch another app with the Launcher class (in the Windows.
    System namespace) using either of two methods:


    +   - LaunchFileSync Starts the default app associated with the specified file,
    optionally including the specified LauncherOptions.

    - LaunchUriAsync Starts the default app associated with the URI scheme name, optionally
    including the specified LauncherOptions.

    - ContentType Gets or sets the content type associated with the URI of a file
    on the network.

    - DisplayApplication Gets or sets a value for a flag that indicates whether the
    Open With dialog box should be shown.

    - FallbackUri Gets or sets a value of a URI that the browser should show if there
    is no app to handle the file type or URI.

    - PreferredApplicationDisplayName Gets or sets a value of the display name of
    the app in the Windows Store that the user should install if there is no app to
    handle the file type or URI.


