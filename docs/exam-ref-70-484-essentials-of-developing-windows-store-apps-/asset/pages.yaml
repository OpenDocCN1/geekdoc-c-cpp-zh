  md: '# Thought experiment

    Following best practices for app navigation


    In this thought experiment, apply what you''ve learned about this objective. You
    can find answers to these questions in the "Answers" section at the end of this
    chapter.


    You have been asked to build a Windows Store app as a reference for other apps
    that your colleagues will design and develop. What are the top three best practices
    you will highlight while implementing navigation in your reference app?


    # Objective summary


    +   A great Windows Store app provides a smooth, simple, and intuitive navigation
    experience. You should follow one of the navigation patterns recommended by Microsoft
    design style.


    +   Visual Studio provides Windows Store app templates that contain support for
    hierarchical navigation.


    +   The Frame class hosts one or more pages, and provides events and the Navigate
    method to help in navigation. The Page class provides methods that are useful
    in passing data during navigation.


    +   Pages in an app can be cached or recreated every time the app navigates to
    a page. The Frame class can cache a number of pages that can be configured in
    the app.


    +   In Windows Store apps with number of categories and items, the SemanticZoom
    control can be used to provide a summary view, making it easier for users to navigate
    among categories.'
