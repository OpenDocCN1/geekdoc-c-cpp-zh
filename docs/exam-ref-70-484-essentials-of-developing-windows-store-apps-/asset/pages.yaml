    # Planning the logical layers of your solution to meet app requirements


    You should design a Windows Store app with maintainability and extensibility in
    mind. After you finalize the conceptual design of your app, the next step is to
    plan the logical layers based on your app''s requirements. Traditional software
    applications employ logical grouping of components into separate layers that communicate
    with each other and with other applications. Layers can be considered as logical
    divisions of components and functionality; they do not take into account physical
    location of components. Layers help to identify different kinds of tasks performed
    by components, thereby making it easier to create a design that supports the reuse
    of components.


    In a logical design, a set of components performing similar tasks is grouped into
    a layer. Identifying logical layers in a design supports reusability of components
    as well as maintainability of your application. Figure 1-4 shows the architectural
    view of a logical layered system.


    ![](img/81d79ceb6883e2d24731f821954f3393_34_0.png)


    FIGURE 1-4 Logical layers of a solution'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'The three-layer architecture shown in Figure 1-4 consists of the following:


    +   - **Presentation layer** This layer is the UI of your application and is responsible
    for your application''s layout and formatting. You will use XAML with core controls,
    user controls, and custom controls to implement this layer.


    +   - **Business layer** This layer is where you implement your application''s
    core logic or business logic, and your application''s business rules. Other Windows
    Store apps interact with your application via this layer. For example, the business
    layer can use contracts provided by Windows for integration with the platform
    and other apps to share data.


    +   - **Data layer** This layer provides the data repository required by the business
    layer of your application for storage and retrieval of data. It defines the interface
    used by your application for accessing a database, local settings, or remote web
    services.


    These layers may be located in the same physical tier or they might be separated
    by defined interfaces that aid in the interaction between the layers. You should
    consider these layers as loosely coupled, with clearly defined interfaces. Loose
    coupling between the layers ensures your solution is maintainable and extensible,
    and is robust to any changes required in future updates. In addition, loose coupling
    helps with testing the different layers of a solution independent of each other.


    # Designing loosely coupled layers


    When you design the layers of your solution, you should start by focusing on identifying
    and grouping functionality into layers. At the same time, you should identify
    the interfaces that help in the interaction between the various layers. After
    you define the interfaces and interfaces of your solution, you should consider
    how your solution will be deployed. At the final stage, you should choose the
    communication mechanism between various layers of your solution.


    While designing loosely layers for a solution, you should have a clear plan to
    group related functionalities into layers. Having too many layers adds to the
    complexity of the design, whereas having too few layers affects maintainability
    and extensibility. You should find a balance between reusability and loose coupling,
    and consider their impact on performance and complexity.


    > IMPORTANT BENEFITS OF A LOOSELY COUPLED DESIGN

    In general, the benefits of a loosely coupled design outweigh any degradation
    of performance of your solution.


    You must define rules for the various layers to interact with each other. This
    helps eliminate dependencies and circular references among the layers. A common
    rule is to allow only one-way interaction between the presentation and business
    layers, thereby enforcing a strict separation of concerns. You can use events
    to notify other layers of any changes in a layer, avoiding dependencies between
    the layers.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'After you have defined the layers of your solution, you should identify the
    functionality that spans across layers. Logging, caching of data, data validation,
    authentication, and authorization are some crosscutting concerns that require
    implementation in separate components. Functionality implemented in such components
    must be available across multiple layers; therefore, you should ensure these components
    are available across different physical tiers.


    When you define the interface between various layers of your solution, your aim
    should be enforce loose coupling between layers. This means that a layer in the
    solution must not expose its internal implementation to any other layer. A public
    interface that hides the details of implementation of the layer should be sufficient
    for other layers to communicate with.


    Communication between various layers of your solution should consider how your
    solution is deployed. If all the layers of your solution reside in one physical
    tier, you should choose the communication protocol between the layers accordingly.
    If your solution interacts with remote web services for data or application logic,
    you should consider implementing security and encryption in the interfaces that
    are involved in such communication.


    ![](img/81d79ceb6883e2d24731f821954f3393_36_0.png)


    # EXAM TIP


    You should be comfortable with designing your application and implementing requirements
    in the various layers. You should understand the primary function of each layer
    and where a particular requirement can be implemented in an app.


    # Incorporating WinMD components


    The WinRT platform provides developers with a new way to build reusable software
    components—as WinRT types packaged in a WinRT component, also called a WinMD component.
    In traditional .NET application development, you could create a dynamic-link library
    (DLL) as a managed class library and use it in one or more applications. The output
    is still available in Visual Studio. However, you can change the output type of
    a library project from class library to WinRT component, and the output of such
    a project is a WinMD file. The main difference between the two types of libraries
    is that class library can be accessed only by (managed) C# and Visual Basic applications.
    A WinRT component can be additionally accessed from Windows Apps using C++ and
    JavaScript. Thus, a WinRT component allows for language-agnostic software development
    for Windows Apps.


    WinRT imposes some restrictions on the design and implementation of a WinMD component.
    For example, public classes must be sealed, public fields are not allowed, and
    public data members must be declared as properties. In addition, there are restrictions
    on the data types passed from the WinMD component to applications that use the
    component. You can only pass WinRT-compatible data types when returning values
    from methods defined in a WinMD component to a consuming application.


    You might want to develop a WinMD component in C++ to get the performance advantage
    of C++ in complex and computationally intensive operations such as image processing
    and transformations. Legacy code written in C++ can be reused in Windows Apps
    by'
