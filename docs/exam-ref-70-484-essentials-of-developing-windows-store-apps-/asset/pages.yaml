  md: '# Develop Windows Store apps


    One of the unique characteristics of a great Windows Store app is its capability
    to interact with other apps and Windows 8 through extensions and contracts. Extensions
    provide a way to extend or customize capabilities of Windows features within Windows
    Store apps. Contracts ensure that diverse apps present features, such as sharing
    an item through another app, using the same interface.


    An extension enables an app to integrate with Windows and extend features provided
    by the operating system. Developers can extend features such as picking contacts
    and associating specific file types with specific criteria within their own app
    and potentially make their implementation valuable to other apps and Windows.


    A contract implemented in an app indicates that it is prepared to interact with
    other apps without needing to know how they work. The contract is an agreement
    between multiple apps that defines the requirements they must implement to participate
    in the interaction. The Settings contract provides users with a clear, intuitive
    way to manage settings settings. The contract enables users to search content
    within an app as well as content from other apps. You can let users of your app
    share content with another app or service through the Share Target contract, or
    your app can act as a target for sharing from other apps.


    # Objectives in this chapter:


    +   - Objective 2.1: Access and display contacts


    +   - Objective 2.2: Design for charms and contracts


    +   - Objective 2.3: Implement search


    +   - Objective 2.4: Implement Share in an app


    +   - Objective 2.5: Manage app settings and preferences


    # Objective 2.1: Access and display contacts


    Store apps can use the contact picker to enable users to access their contacts
    to be able to share content from within the application. The Windows.ApplicationModel.Contacts
    namespaces provides the options for selecting contacts through a Windows Store
    app. An app can pick contacts from one or more Windows Store apps by selecting
    the provider of contacts from a drop-down list.'
  merge: -1
