    # Storing retrieving settings from the roaming data store


    Windows 8 provides three application data stores: local, roaming, and temporary.
    When designing your app''s data layer, you should consider one of these stores
    for a particular kind of application data.


    You can save an application''s settings and user preferences to a roaming app
    data store, which retains the information and makes it available across multiple
    devices. If a user has your app installed on one device and downloads and installs
    it another device, the data saved in the roaming data store in the first device
    will be available on the second device, and vice versa. Therefore, using the roaming
    app data store to save app settings will provide a uniform experience to the user
    across multiple devices.


    You should consider application data such as view preferences, background color
    or theme customization, and similar settings in your app to be in the roaming
    app data store. In addition, you can also save the last position in the app''s
    context, such as a news item being read, game level and score data, and navigation
    history.


    > IMPORTANT USAGE OF THE ROAMING DATA STORE

    You should not use the roaming app data store to save data relevant to a device,
    such as the path to a local file resource on a PC. Note that roaming data is not
    synchronized instantaneously and should not be used to store frequently changing
    information such as up to the second position in a movie or a song.'
