  pgno: 286
- img_proc: true
  md: '+   - IsCanceled Indicates whether the input canceled by the pointer device.
    Input can be canceled for various reasons; for example, the palm of the user or
    if the input device is removed.


    +   - ContactRect The bounding rectangle of the contact area in client window
    coordinates.


    +   - ContactRectRaw The bounding rectangle of the contact area as reported by
    the input device. In some cases, input prediction can be used to compensate for
    hardware latency, and the system can provide the correct value through the ContactRect
    property while providing the original value through the ContactRectRaw property.


    # Pointer events


    The standard set of controls provided by Windows supports multiple input devices
    and raise events based on user interaction. These events should be used to handle
    pointer input in your Windows Store app. In some circumstances, you might need
    to obtain the pointer input in your application and apply your own logic in the
    event. Pointer events are low-level routed events raised by UElement control:


    +   - PointerEntered This event is raised when a pointer enters a UElement''s
    bounding area. For example, this event is raised when the mouse cursor enters
    a rectangle.


    +   - PointerExited This event is raised when a pointer leaves a UElement''s bounding
    area, but only if the pointer was initiated in the UElement''s bounding area.
    For example, this event is raised when the mouse cursor leaves a rectangle.


    +   - PointerMoved This event is raised when a pointer has entered a UElement''s
    bounding area moves moves within it. For example, this event is raised when the
    mouse cursor moves within a rectangle.


    +   - PointerPressed This event is raised when the pointer makes its first contact
    with a UElement''s bounding area. For example, this event is raised when the user
    clicks within a rectangle using a mouse.


    +   - PointerReleased This event is raised when the pointer that previously initiated
    a PointerPressed event is released within the UElement. Note that other events
    such as PointerCanceled or PointerCaptureLost can fire instead of this event.


    +   - PointerCanceled This event is raised when the pointer that was previously
    in contact with the UElement loses contact abnormally (for example, if a mouse
    is detached while the left key is pressed on a Canvas).


    +   - PointerCaptureLost This event is raised when the pointer is lost from the
    UElement while the user is carrying an action (for example, in drag-and-drop operation,
    if users raise their finger when holding an element and moving it).


    +   - PointerWheelChanged This event is raised when a pointer wheel (for example,
    in a mouse) changes value.'
