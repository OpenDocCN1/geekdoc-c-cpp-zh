  md: '+   This objective covers how:

    * Retrieve a user''s roles and claims.

    * Store and retrieve credentials with the PasswordVault class.

    * Implement the CredentialPicker class.


    # Retrieving a user''s roles and claims


    User authentication and authorization in Windows Store apps can be implemented
    in several different ways. You can implement your own mechanism within your app
    or as a service hosted in the cloud, for example. The process of identifying the
    user is an important step before an app enables the user to use various features;
    this is the step of authenticating users with their credentials. Users then attempt
    to access a set of features restricted to a certain group of users, usually identified
    by a role; this is the step of authorizing users to one or more roles they belong
    to. An authenticated user belongs to one or more roles, with specific features
    assigned to each role.


    Role-based access to features in a Windows Store app, including the ability to
    interact with online services, requires users'' authorization after they are authenticated
    by the app. A custom method of authorization in an app is not flexible whenever
    it needs to be extended to include a new set of roles or a new set of features
    accessible by one or more roles. To make the process of authorizing a user easier,
    a user identified by an app or service can be identified with a set of claims.
    Claims can carry information about the authenticated user, such as email address
    and full name.


    A claims-based model of authorizing users is useful for decoupling user authentication
    and authorization for a set of roles. In addition, a user identified with a set
    of claims can grant access to resources across multiple domains, provided these
    domains trust each other. In such cases, the need for credential synchronization
    does not arise at. When the user needs to be removed from a domain, it does not
    require the user''s account to be deleted from the domain. It is sufficient to
    remove the claims of the user from the domain. This model of identifying a user
    based on a set of claims is useful for implementing SSO in Windows Store apps.
    A token created as part of the sign-on process can be used to authorize the user.


    A claims-based token can be obtained from a token issuer for a user providing
    valid credentials. During the authentication process, the token issuer determines
    the roles available to the user for authorization based on the user''s claims.
    In many cases, the token issuer delegates this process to a third-party service
    such as Windows Live Services. Users are required to provide their Windows Live
    credentials and to trust the application from which they are logging on. The token
    is then passed to the application. In all future authentication requests, this
    token is used by the application to recognize the user as genuine. The process
    of obtaining a token with a third-party provider is shown in Figure 5-8.'
  merge: -1
