    # Enabling scroll and zoom capabilities in layout controls


    In some Windows Store apps, the amount of data to display on the screen might
    not be known until the user starts using the app. Data might overflow the visible
    area on the screen, and the user might not be able to view a lot of the data.
    For example, the data returned from a remote web service consists of groups of
    data displayed horizontally, with the items in each'
