    # ## Objective 2.5: Manage app settings and preferences


    Windows Store apps can integrate with the Settings charm and provide their links
    to invoke commands, open their settings pane, and so on. The Settings pane is
    populated with commands from your app and displays various system functions at
    the bottom. Windows adds a Rate & Review command if the app was downloaded and
    installed from the Windows Store and a Permissions command if the app has capabilities
    declared in the manifest.


    The Settings charm is available from any page in a Windows Store app and provides
    a simple way to update its global settings. You can construct a Settings pane
    using the Popup, and provide standard Windows 8 controls as toggle buttons to
    configure app settings. The application settings can be saved in the roaming data
    store so users can access them after closing and restarting the app.


    > This objective covers how to:

    - Choose which features are accessed in AppSettings.

    - Add entry points for AppSettings in the Settings window.

    - Create settings flyouts using the Popup control.

    - Add settings to Popup.

    - Store and retrieve settings from the roaming data store.


    # ## Choosing which app features are accessed in AppSettings


    Windows Store apps can provide users with a consistent way to access app settings.
    You should use the Settings charm as the primary entry point of your app and put
    all your settings in the Settings pane. If your app has more than one category
    of settings, consider using settings flyouts for each category. Use as few settings
    as possible in your app and provide defaults for all of them. Your app should
    immediately implement settings change, such as changing the default font size,
    because a settings flyout can close immediately if the user touches or clicks
    outside the flyout.'
