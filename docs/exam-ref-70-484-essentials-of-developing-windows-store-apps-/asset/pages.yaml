  md: "If you look at Figure 3-10 closely, you will notice that the Visual Studio\
    \ designer has placed 1* against the rows and columns of the grid. This results\
    \ from the associated XAML—the members of the RowDefinitions and ColumnDefinitions\
    \ of the grid do not specify their dimensions. Therefore, the available screen\
    \ area is distributed equally among all rows and columns. Although this might\
    \ be adequate for arranging controls in a grid layout in many scenarios, you will\
    \ sometimes require more control over the dimensions of rows and columns.\n\n\
    The Grid control supports three ways of specifying the dimensions of RowDefinition\
    \ and ColumnDefinition:\n\n+   * Setting the Height or Width to Auto the child\
    \ elements defined by the rows and columns occupying as space as required to render.\
    \ The height of a row is the height of the tallest UI element in that row, and\
    \ the width of a column is the width of the widest UI element.\n\n+   * Fixed\
    \ Size You can specify the width or height in logical pixels, which results in\
    \ fixed sizes of the rows and columns.\n\n+   * Star S You can set the height\
    \ of a row or the width of column to *. This results in the available space distributed\
    \ equally among elements or based on ratios. Note that you can use either 1* and\
    \ * for sizing a column or row in a layout.\n\nThe option of using sizing to control\
    \ column width and row height in a grid is a powerful technique for arranging\
    \ controls that use available space in various sizes and resolutions. There are\
    \ some rules you need to follow to use sizing:\n\n+   * When you set a row's height\
    \ or column's width to *, the row or column occupies remaining space if the heights\
    \ of other rows and widths of others are fixed.\n\n+   * When you set the height\
    \ of multiple rows or width of multiple columns to *, the remaining space is equally\
    \ divided among the rows or columns.\n\n+   * You can apply a weight to rows and\
    \ columns by placing a coefficient in front of the *. The rows and columns with\
    \ the applied weight occupy more space than other rows and columns. For example,\
    \ a row with height set to 3* occupies three times the height of a row with height\
    \ set to *.\n\nIn your app, you will need to arrange controls so that the row\
    \ or column are placed in a proportion of the other rows or columns. The following\
