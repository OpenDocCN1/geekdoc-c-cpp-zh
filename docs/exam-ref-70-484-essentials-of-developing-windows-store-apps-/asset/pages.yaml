  md: "Freshly delivered content as the latest news headlines, traffic updates based\
    \ on the user's\\current location, or new movie releases making the user's tastes\
    \ make a live tile compelling.\n\n# INFO GUIDELINES FOR TILES AND BADGES\n\nMicrosoft\
    \ provides a set of guidelines for developers to use live tiles and badges in\
    \ their\napplications at http://msn.microsoft.com/en-us/library/windows/apps/hh465403.aspx.\n\
    \n# Working with secondary tiles\n\nIn a Windows Store app, users might open a\
    \ certain item more frequently, such as a page\nshowing a preferred category of\
    \ movies or a page showing the weather forecast of a city they\nwill visit soon.\
    \ In such cases, instead of letting the user navigate to the page in the traditional\n\
    way, you can provide secondary tiles that are pinned on the Start screen and as\
    \ shortcuts\nto these pages. A secondary tile enables direct access to a specific\
    \ page or experience within\nan app. When the user taps or clicks the secondary\
    \ tile, the app is launched with the pinned\ncontent visible on the screen. You\
    \ can create a secondary tile with the SecondaryTile class in\nthe Windows.UI.StartScreen\
    \ namespace.\n\nAlthough the content that can be pinned to a secondary tile is\
    \ controlled by an app, the\naction of pinning content is controlled by the user.\
    \ Your app cannot pin content on behalf\nof the user. The action to pin a page\
    \ to the Start screen is usually presented as a Pin to Start\ncontent menu when\
    \ the button in the app is clicked or tapped by the user. A secondary\ntile can\
    \ be removed either through deleting the Start screen or while the user is in\
    \ the parent app.\n\nSecondary tiles are similar to primary and live tiles. They\
    \ may include a 150 x 150 pixel\nlogo and, optionally, a wide 310 x 150 pixel\
    \ logo. Tile notifications can be delivered using live\ntemplates and they can\
    \ be rearranged on the Start screen. They are removed from the Start\nscreen when\
    \ the app is uninstalled. There are some differences between primary tiles and\n\
    secondary tiles. Secondary tiles can be deleted at any time without deleting the\
    \ parent app.\nThey can be created at runtime, unlike primary tiles, which can\
    \ be created only during\ninstallation.\n\nTo create a secondary tile for your\
    \ Windows Store app, start by adding the styles\nfor the app bar buttons and deleting\
    \ the bottom app bar, as shown in Listing 4-2.\n\n# LISTING 4-2 Creating a secondary\
    \ tile—XAML\n\n```\n&lt:Style x:Key=\"PinAppBarButtonStyle\" TargetType=\"Button\"\
    &gt;\n  BasedOn=\"StaticResource AppButtonStyle\"&gt;\n  &lt;Setter Property=\"\
    AutomationProperties.Id\" Value=\"PinAppBar/\"&gt;&lt;/Setter&gt;\n  &lt;Setter\
    \ Property=\"AutomationProperties.Name\" Value=\"Pin to Start/\"&gt;&lt;/Setter&gt;\n\
    &lt;/Style&gt;\n&lt:Style x:Key=\"UnpinAppBarStyle\" TargetType=\"Button\"&gt;\n\
    \  BasedOn=\"StaticResource AppButtonStyle\"&gt;\n  &lt;Setter Property=\"AutomationProperties.Id\"\
    \ Value=\"UnpinAppBar/\"&gt;&lt;/Setter&gt;\n  &lt;Setter Property=\"AutomationProperties.Name\"\
    \ Value=\"Unpin from Start/\"&gt;&lt;/Setter&gt;\n&lt;/Style&gt;\n```"
