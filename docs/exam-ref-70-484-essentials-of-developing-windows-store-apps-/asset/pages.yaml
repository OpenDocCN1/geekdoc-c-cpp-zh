  md: '# CHAPTER 1


    # Design Windows Store apps


    The launch of Windows 8 was accompanied by the introduction of Windows Runtime
    (WinRT), a new framework for building touch-friendly user interfaces (UIs) for
    Windows Store applications (apps). With WinRT, Windows Presentation Foundation
    (WPF) and Silver-light developers could leverage their existing XAML and #VB.NET
    skills to build Windows Store Apps. In addition to the new framework and an augmenting
    skillset, Microsoft introduced a new design language called "Microsoft design
    style."


    The conceptual design of an application is the first stage of designing an application.
    In the conceptual design, you focus on a set of ideas and concepts about what
    your app should do, how it will behave when users interact with it, and what it
    should look like. A well-designed application has logical layers loosely coupled
    with UI, which is used for presenting the data. Separating logic from presentation
    enables the application to be enhanced or updated without changing the conceptual
    design.


    You can use design patterns such as Model-View-ViewModel (MVVM) to develop main-table
    and extensible applications. Data and state preservation across various states
    of an application is important in providing a great user experience. After you
    build and test your application, you need to prepare the app for Windows Store
    certification. Microsoft provides a set of requirements to help you during the
    app certification process and deploy-ment the Windows Store.


    # Objectives in this chapter:


    +   - Objective 1.1: Design the UI layout and structure

    - Objective 1.2: Design for separation of concerns (SOC)

    - Objective 1.3: Apply the MVVM pattern to your app design

    - Objective 1.4: Design and implement Process Lifetime Management (PLM)

    - Objective 1.5: Plan for an app deployment


    # Objective 1.1: Design the UI layout and structure


    The primary form of interaction with a Windows Store app by its users is through
    the user interface (UI). Microsoft design style consists of a set of principles
    that provide a cons-tent, elegant, and compelling user experience in Windows Store
    apps. You should plan and design Windows Store app UIs with these principles as
    a reference. The UI should be'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'composed of visual elements and controls, with a clear hierarchy in their layout.
    You should also consider users with disabilities and preferences, and design your
    app for accessibility. Reusing UI in multiple applications will help you to rapidly
    build Windows Store apps; therefore, you should consider building custom controls
    and using them in your apps.


    +   This objective covers how to:

    - Evaluate the conceptual design and decide how the UI will be composed

    - Design for the inheritance and re-use of visual elements

    - Decide when custom controls are needed


    # Evaluating the conceptual design and deciding how the UI will be composed


    Windows Store apps provide Windows 8 users with a unique way of interacting with
    their PCs and devices. The apps are unique in their design and functionality;
    they share a set of important characteristics that are fundamental in their design.
    To design a compelling user experience in your app with an attractive user interface,
    it is important to plan your app well. Microsoft provides Store app developers
    with a set of guidelines to help them in planning their app. The steps you should
    follow to plan and design your Windows Store app are described in the following
    sections.


    # Decide which features will make your app great


    You might have an idea to create a blog reader or a weather app. When you check
    the Windows Store, you might find several dozen such apps, but none of satisfies
    your needs. Although some apps may be simple to use, they are lacking in fundamental
    features such as sharing data with friends. You need to decide which features
    will make your app great and make it stand out from the rest of the apps in the
    Windows Store. Because it''s sometimes difficult to incorporate every feature
    you want in the first release of your app, prepare a list of must-have features
