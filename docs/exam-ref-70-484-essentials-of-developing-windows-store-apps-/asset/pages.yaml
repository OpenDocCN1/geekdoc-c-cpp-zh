    be logged on the app and have access to messages from multiple devices. How should
    you implement this feature?


    +   A. Show a dialog box to request credentials every time the user needs to check
    the accounting for messaging.

    B. Authenticate the user when the app is installed and save the credentials in
    the roaming data store.'
