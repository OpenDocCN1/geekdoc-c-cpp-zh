  md: '# Implementing credential roaming


    After a user logs to a Windows Store app on a device, the user can access the
    same app on a different device. If the app expects the user to log on again with
    their credentials, it results in a poor user experience. The PasswordVault class
    provides support for credential roaming. One or more PasswordCredential objects
    with the user''s credentials can be stored in the PasswordVault of an app and
    the credentials of the user are synchronized for a user logged on multiple devices
    with the same Microsoft account.


    > > INFO CREDENTIAL ROAMING IN WINDOWS STORE APPS

    > For details on credential roaming in Windows Store apps, refer to Objective
    5.4.


    # Thought experiment


