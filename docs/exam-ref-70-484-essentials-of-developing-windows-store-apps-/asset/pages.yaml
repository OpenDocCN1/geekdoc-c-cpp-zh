  md: 'The binding target is created in the XAML using the (Binding...) syntax. The
    binding source is set in the code through the DataContext property of the TextBox
    in the code in Listing 1-1. You use the ElementName property or the RelativeSource
    property to specify the binding source. You need to bind a property of a UI element
    to a property of another UI element, the ElementName property is useful (for example,
    when you are changing the diameter of a circle using the slider). The RelativeSource
    property is commonly used to bind one property of an object to another property
    of the same object, or to define a binding in a style or template.


    # Design and implement the model


    The MVVM pattern is the entity responsible for moving data to and from the data
    store and implementing the business logic. Although implementation of the model
    can vary based on the app requirements, the interface from the model to the viewmodel
    does not change. In the case of a simple application, the model can contain the
    implementation for retrieval and storage of data from the file system, in plain
    text. If the application needs to retrieve data from a remote web service or data
    store, you can create a repository to implement the web service client. In that
    case, the model defines the data structures required to extract the data obtained
    from the remote web service. The repository can additionally support user authentication
    and authorization.


    Model objects are either exposed through viewmodels or defined in a viewmodel.
    When model objects are exposed via viewmodels, they need to implement the INotifyPropertyChanged
    interface and (optionally) the INotifyDataError interface if it supports validation.


    A single-page Windows Store app does not require more than one model class. For
    complex applications, multiple models are required to support the business logic.
    Consider the design of a Windows Store app that enables users to search for photographs
    from a popular website using their web service. Amateurs and enthusiasts upload
    photographs and use a simple rating to mark the photographs in order of popularity.
    A search term can be provided as a string to query the web service. The web service
    returns the result of such a query as XML or JavaScript Object Notation (JSON)
    items in an array. Therefore, the model in this case is a data structure that
    can be used to extract the data from the raw XML or JSON response from the web
    service.


    Listing 1-2 shows the C# code for a model class representing an individual item
    in the result of the query to the web service.'
