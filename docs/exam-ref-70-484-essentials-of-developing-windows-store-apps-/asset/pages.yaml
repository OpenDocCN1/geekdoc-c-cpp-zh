  md: "Dependency properties are important in controls where they are used to implement\
    \ features required in the user interface. The base class of a custom control\
    \ (such as the Control class) inherits from DependencyObject. The DependencyObject\
    \ class provides the following-wrapper methods that are used with dependency properties:\n\
    \n+   - **SetValue** This method is used to set the local value of a dependency\
    \ property to the value provided.\n\n+   - **GetValue** This method is used to\
    \ get the current value of a dependency property.\n\n+   - **ReadLocal** This\
    \ method is used to read the local value of a dependency property if a local value\
    \ is set.\n\n+   - **ClearValue** This method is used to clear the local value\
    \ of a dependency property.\n\nYou can set a local value for a dependency property\
    \ to an attribute or property element in XAML. When you set a current value to\
    \ a dependency property, it enables you to change the value of the property without\
    \ overwriting the source of a previous value; that, the binding is left as is.\n\
    \nTo create a DependencyProperty in a custom control, the property needs to be\
    \ registered with the dependency framework using the Register method. You can\
    \ provide metadata for the dependency property or specify it as null. A DependencyProperty\
    \ identifier as a static read-only member of the custom control is also required.\
    \ A wrapper property with the name to be set value using the Register method is\
    \ required. You can implement the get and set to connect the wrapper property\
    \ with the dependency property it wraps. Listing 5-23 shows code for a control\
    \ that uses an image with a label.\n\n# LISTING 5-23 Creating DependencyProperty\
    \ in a custom control\n\n```\nusing Windows.UI.Xaml;\nusing Windows.UI.Xaml.Controls;\n\
    using Windows.UI.Media;\n\npublic sealed class ImageWithLabelControl : Control\n\
    {\n    public ImageWithLabelControl()\n    {\n        this.DefaultStyleKey = typeof(ImageWithLabelControl);\n\
    \    }\n\n    // Wrapper property\n    public ImageSource GetImagePath()\n   \
    \ {\n        return (ImageSource)GetValue(ImagePathProperty);\n    }\n    set\
    \ { SetValue(ImagePathProperty, value); }\n}\n\n    // Using a DependencyProperty\
    \ as the backing store for ImagePath.\n    // This enables animation, styling,\
    \ binding, etc.\n    public static readonly DependencyProperty ImagePathProperty\
    \ =\n        DependencyProperty.Register(\"ImagePath\", typeof(ImageSource),\n\
    \        typeof(ImageWithLabelControl), null);\n```"
