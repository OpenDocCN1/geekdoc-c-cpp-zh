  md: '# Objective 1.3: Apply the MVVM pattern to your app design


    It is challenging to develop the UI of a modern application while considering
    code and visual element reuse, separation of concerns, and maintainability. UI
    design patterns are reusable solutions that can help developers build U. You can
    use the MVVM design pattern to develop Windows Store apps that are maintainable,
    testable, and extensible.


    This objective covers how to:


    +   - Design and implement the appropriate data model to support business entities

    - Design your viewmodel to support your view based on your model

    - Develop a view to meet data-binding requirements

    - Create viewmodels using INotifyPropertyChanged, ObservableCollection, and CollectionSource


    # Designing and implementing the appropriate data model to support business entities


    The data model in a Windows Store app implements the business logic and the mechanism
    for data access. It is responsible for notifying the viewmodel whenever data changes
    in the source and for persisting changes from the view in the data source. The
    model of the MVVM pattern is where the data model for the application is implemented.


    # Model-View-ViewModel pattern


    The Model-View-ViewModel (MVVM) design pattern was introduced by John Gossman
    in 2005 as a variation of the popular Model-View-Controller (MVC) design pattern.
    The MVVM pattern helps you build your application with a clean separation of the
    business and presentation logic from the UI. It provides opportunities for code
    reuse, and encourages developers and UI designers to collaborate on developing
    various parts of the application.


    MORE INFO MODEL-VIEW-VIEWMODEL PATTERN


    For an introduction to the Model-View-ViewModel pattern for building WPF apps,
    go to http://blogs.msdn.com/b/johoggman/archive/2005/10/08/478683.aspx.


    With the MVVM pattern, you can compose the design of your application using loosely
    coupled layers or classes: the view, viewmodel, and model. Business logic in a
    Windows Store app is encapsulated in the model, including any services to fetch
    and store data from local or remote storage (that is, the data layer). The viewmodel
    encapsulates the'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'presentation logic, and the view encapsulates the UI and UI logic. Figure 1-5
    illustrates the MVVM pattern and the function of its various layers.


    | View | User Interface |

    |--- | --- |

    | ViewModel | Presentation Logic |

    | Model | Business Logic and Data |


    FIGURE 1-5 MVVM layers and their functions


    # THE VIEW


    The view is the visual interface of the application. It comprises a visual element,
    such as a page or window, and controls provided by the framework. The layout and
    styling of the controls is defined in the view. In addition, the view can define
    animations that are triggered when there is a change in the state of the viewModel
    (for example, when there is new data) or when the user interacts with the view.
    The code-behind of the view can contain the UI logic to present data through the
    controls in the view or code to directly manipulate the visual elements in the
    view. In some situations, complex animations that are otherwise difficult to set
    up in XAML can be expressed in the code-behind. It is recommended that you not
    put business or presentation logic in the code-behind of the view; otherwise,
    UI testing becomes difficult.


    The view references the viewModel through a property called DataContext. This
    property can be set through XAML or the code-behind of the view. The controls
    in the view are data-bound to the properties and commands in the viewModel. For
    views that do not require any UI logic, data templates can be used to specify
    the UI elements that the viewModel. This enables visual designers to define and
    easily update the visual representation without changing the object bound to or
    the behavior of the control that is used to display the object.


    # THE VIEWMODEL


    The viewModel encapsulates the presentation logic of the application. It does
    not have any knowledge of the view''s design, layout, style, and so on. The viewModel
    implements the properties and commands that the view binds to and notifies the
    view of state change through events. Although the viewModel provides the properties
    and commands required by the view, the view determines how these properties will
    be rendered on the interface and how it will integrate the commands with actions
    for the user.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'The viewmodel acts as the glue between the view and one or more model classes.
    In a complex view, you can require more than one model class to provide data.
    The viewmodel can transform the data so that it can be represented in the view.
    The viewmodel can combine multiple fields from models in a property that is bound
    to a visual element in the view. This helps where a new requirement adds a new
    field in the data model that is be combined with an existing field. It requires
    an update in the viewmodel code, but the view does not require a change.


    Actions invoked by the user in a view such as tapping a button are typically defined
    as commands in the viewmodel. Commands provide a clean way to encapsulate user
    actions that are separate from the UI. The ICommand interface provides the mechanism
    to connect the UI with commands that are defined in the viewmodel.


    # THE MODEL


    Business logic and data are encapsulated in the model. A model class defines the
    data structures based on the application’s data model. The business logic as well
    as data validation rules are often implemented in the model, although a separate
    repository for data access, caching, and storage can be used. The model classes
    are often generated as part of the data access layer or remote service that provides
    the data for the application.


    The model usually implements the INotPropertyChanged interface that enables it
    to be bound to the view. The model can also implement the INotifyDataErrorInfo
    interface to provide support for data validation. In some cases, when the model
    does not implement these interfaces, the viewmodel defines the model and implements
    these interfaces.


    # Data binding


    Data binding is the mechanism that establishes a connection between the application’s
    UI and business logic. If the model implements the data binding interface, when
    the data changes its value, it is reflected in the UI element that is bound to
    the data. Data binding also implies that any changes in the representation of
    data in the UI can be used to update the underlying data.


    Data binding in the MVVM pattern provides a clean and simple way of connecting
    UI elements with data. A binding connects some of the following:


    +   - A binding source that provides the data for the visual element in the view.
    A binding source can be a common runtime (CLR) object or a class defined in C#
    or any WinRT object of a type that has BindableAttribute or implements the ICustomPropertyProvider
    interface. To meet the app requirements, you can bind a property of a UI element
    with the value of another UI element.

    - A binding target that is a visual element for presenting the data in the view.
    A visual element is an object of the type FrameworkElement. It provides one or
    more properties of the type DependencyProperty, which is used as the binding target.
    Most FrameworkElement properties (except the read-only properties) are dependency
    properties. FrameworkElement properties support data binding by default.

    - A binding object that defines the connection between the binding source and
    binding target and moves the data between them.'
