  md: '![](img/81d79ceb6883e2d24731f821954f3393_394_0.png)


    In traditional Windows applications, claims-based user authentication and authorization
    is performed using the Windows Identity Foundation (WIF), part of the .NET Framework
    since version 4.5. WinRT APIs provide a set of interfaces and an enumeration in
    the System.Security.Principal namespace help with tokens, user identification,
    roles, and more.


    The Identity interface is used in the implementation of an identity object that
    represents a user in an app. It has the following properties:


    +   - **Name** This property is used to obtain the name of the user as a string.
    Note that the name is not available if the user has not been authenticated.


    +   - **Authentication** This property is used to obtain the type of authentication
    used in the app as a string. For example, the app might use EncryptMessage(NTLM)
    or Kerberos for authenticating a user who belongs to a domain in a corporate network.


    +   - **Authenticated** This property is used to check whether the user is already
    authenticated.


    The identity of users, along the roles they are associated with an app, is available
    as a security principal. A security principal implements the IPrincipal interface.
    The Identity property of this interface provides the user''s identity through
    an identity object associated with the principal; the identity object implements
    the Identity interface. In addition, a Windows Store app can check whether the
    user represented by the principal belongs to a certain role with the IsRole method
    that expects a string for the role being queried. The method returns True if the
    user belongs to the role queried, otherwise, the result is False.


    FIGURE 5-8: Steps involved in authorizing a user-based authentication'
