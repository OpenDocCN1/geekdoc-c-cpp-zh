  md: "# MORE INFO DPI AND LOGICAL PIXELS\n\nYou can read more about dots per inch\
    \ (dpi), logical pixels, and device-independent pixels at mdn.microsoft.com/en-us/library/windows/ff684173(v=vs.85).aspx.\n\
    \nTo update your UI when the users change the view state, you should subscribe\
    \ to the SizeChanged or LayoutUpdated event. The SizeChanged event is fired whenever\
    \ the size of the UI element to which you attached the event handlers. The LayoutUpdated\
    \ event is fired when the layout updates. In the event handler, you should check\
    \ for the static Value property of the Windows.UI.ViewManagement.ApplicationView\
    \ class to obtain the current view state of the app. The value of this property\
    \ is one of the members of the Application-ViewState enumeration, described in\
    \ Table 3-1.\n\nTABLE 3-1 ApplicationViewState enumeration members\n\n| MEMBER\
    \ | VALUE | DESCRIPTION |\n|---|---|---|\n| FullLandscape | 0 | The app is in\
    \ full screen mode, in landscape orientation, with no snapped app next to it |\n\
    | Filled | 1 | The app is in the fill state, occupying part of the screen with\
    \ another app in the snapped state. |\n| Snapped | 2 | The app is in the snapped\
    \ state, occupying part of the screen with another app in the fill state. |\n\
    | FullScreenPortrait | 3 | The app is in full screen mode, in portrait orientation,\
    \ with no snapped app next to it. |\n\nIf a Windows Store supports all the view\
    \ states, it should respond to changes in the view state by updating the layout\
    \ of the UI. Windows provides the Visual State Manager (VSM) (VisualStateManager\
    \ class in Windows.UI.Xaml namespace) to help manage layouts for various states.\
    \ The VSM handles the logic of the view states and transitions for controls among\
    \ these states. The VSM can be used to manage the state of pages, custom and user\
    \ controls, and control templates.\n\nYou can use the VSM with any UI element\
    \ that derives from the Control class, for example, the Page element. The VSM\
    \ should be present at the root of the Control's template. The XAML code of a\
    \ page with this VSM is:\n\n```\n<Page>\n  <Grid xName=\"LayoutRoot\">\n    <VisualStateManager.StateGroups>\n\
    \      <VisualStateGroup xName=\"OrientationStates\">\n        <VisualState xName=\"\
    FullScreen\" />\n        <VisualState xName=\"Filled\" />\n        <VisualState\
    \ xName=\"Snapped\" />\n        <VisualState xName=\"Portrait\" />\n      </VisualStateGroup>\n\
    \    </VisualStateManager.StateGroups>\n  </Grid>\n</Page>\n```"
  merge: -1
  pgno: 168
- img_proc: true
  md: "A visual state (represented by the VisualState class) consists of XAML for\
    \ the UI elements in the page for that state. For example, you can display your\
    \ app's content in a grid when it is in the fill state in the landscape orientation,\
    \ and in a list when it is in the snapped view and portrait orientation.\n\nIn\
    \ the code-behind of the page that defines the visual state groups (represented\
    \ by the VisualState class and containing a group of visual states), you should\
    \ implement the logic to transition between visual states in the SizeChanged event.\
    \ See Listing 3-1.\n\n# LISTING 3-1 Transitioning between visual states in the\
    \ SizeChanged event\n\n```\nusing Windows.UI.Management;\n\npublic sealed partial\
    \ class VSMSamplePage: Page\n{\n    public VSMSamplePage()\n    {\n        this.InitializeComponent();\n\
    \        Window.Current.SizeChanged += OnSizeChanged;\n    }\n\n    // Handle\
    \ the SizeChanged event\n    private void OnSizeChanged(object sender, Windows.UI.Core.ChangedEventArgs\
    \ args)\n    {\n        switch (ApplicationView.Value)\n        {\n          \
    \  case ApplicationViewState.Filled:\n                VisualStateManager.GoState(this,\
    \ \"Filled\", false);\n                break;\n            case ApplicationViewState.FullScreen:\n\
    \                VisualStateManager.GotoState(this, \"FullScreen\", false);\n\
    \                break;\n            case ApplicationViewState.Snapped:\n    \
    \            VisualStateManager.GotoState(this, \"Snapped\", false);\n       \
    \         break;\n            case ApplicationViewState.FullScreenPortrait:\n\
    \                VisualStateManager.GotoState(this, \"Portrait\", false);\n  \
    \              break;\n            default:\n                break;\n        }\n\
    \    }\n}\n```\n\nThe GotoState method accepts a Boolean parameter that indicates\
    \ whether visual transitions should be used when transitioning between states.\
    \ Transitions are animations controlled by a StoryBoard object that occurs between\
    \ each visual state when the state changes. A StoryBoard can contain one or more\
    \ animations, which are associated with UI elements. Transitions are not used\
    \ in most control templates, and the transition between various states occurs\
    \ instantaneously."
  merge: -1
  pgno: 169
- img_proc: true
  md: 'If you decide to transitions between visual states, you can define them as
    a combination of the start state and end state in your control''s set of visual
    states. Transitions are defined by the Transitions property of VisualGroup in
    XAML. The Transition class represents the visual behavior when a control transitions
    from one state to another. A VisualTransition initiates a StoryBoard, which outlines
    the duration that animations between two visual states will run.


    A VisualTransition can reference a From state, a To state, or both from a From
    and a To state. The To value references the name of a state that is the new state
    requested by the GotoState method. The From value references the name of the previous
    state. TheStateManager uses the following logic to decide which transition to
    apply:


    +   - If a VisualTransition exists that uses a From state as the old state and
    the new state as To, use that transition.

    - If a VisualTransition exists that uses a To state as the new state but does
    not specify From, use that state.

    - If a VisualTransition exists that uses the From state as the old state but does
    not specify To, use that state.


    - If none of the above, the UserManager does not apply any transitions.

    The GeneratedDuration property of the VisualTransition sets the time for the transition
    to occur. A VisualTransition can have a StoryBoard value, a GeneratedDuration
    value, or both. If a VisualTransition does nothing for animations, even if the
    From and To values refer to points defined in the VisualStateGroup.


    An implicit transition is one that does not target a specific dependency property,
    although it can include a GeneratedDuration value to set the duration of the animation.
    Implicit transitions apply to properties with a Double, Color, or Point value;
    that is, the property must be possible to animate with an animation of DoubleAnimation,
    ColorAnimation. If you need to create a transition animation on any other value,
    you should put that animation in the StoryBoard and give it a Duration that you
    want it to run.


    Another category of animations is transition animations. A transition represents
    a change in the relationship between a UI element and the UI. For example, a change
    in the view state, you might want to move a UI element in the layout container
    of the page. A transition animation applies to various Transition properties of
    a UIElement class and its derived classes, not to a VisualStateGroup. Transition
    animations are usually built into the default behavior of a control. In Listing
    3-2 shows the Transitions property of VisualStateGroup used to define the transition
    for a control. The first three transitions are examples of implicit transitions,
    and the fourth is an explicit transition that targets a specific property.'
  merge: -1
  pgno: 170
- img_proc: true
  md: "# LISTING 3-2 Defining the transition state\n\n```\n<VisualState x:Name=\"\
    OrientationStates\">\n<VisualStateGroup.Transitions>\n  <!-- The following three\
    \ visual transitions are implicit transitions -->\n  <VisualTransition To=\"Snapped\"\
    \ GeneratedDuration=\"0:0:0.1\" />\n  <VisualTransition To=\"Filled\" GeneratedDuration=\"\
    0:0:0.5\" />\n  <VisualTransition From=\"Portrait\" To=\"FullScreen\" GeneratedDuration=\"\
    0:0:0.1\" />\n  <!-- The following visual transition is an explicit transition\
    \ ---->\n  <VisualTransition From=\"FullScreen\" To=\"Snapped\" GeneratedDuration=\"\
    0:0:1.5\" />\n</VisualStateGroup.Transitions>\n<Storyboard>\n  <DoubleAnimationUsingKeyFrames>\n\
    \  Storyboard.TargetProperty=\"X\"\n  Storyboard.TargetName=\"TopRect\"\n  FillBehavior=\"\
    Hold\"\n  <LinearDoubleKeyFrame Value=\"80\" KeyTime=\"0:0:0:1\" />\n</DoubleAnimationUsingKeyFrames>\n\
    </Storyboard>\n</VisualState>\n\n<VisualState x:Name=\"Snapped\" />\n<VisualState\
    \ x:Name=\"FullScreen\" />\n<VisualState x:Name=\"Filled\">\n<Storyboard>\n  <ColorAnimation\
    \ Storyboard.TargetName=\"BorderBrush\"\n  Storyboard.TargetProperty=\"Color\"\
    \ To=\"Green\" />\n</Storyboard>\n</VisualState>\n<VisualState x:Name=\"Portrait\"\
    >\n<Storyboard>\n  <ColorAnimation Storyboard.TargetName=\"BorderBrush\"\n  Storyboard.TargetProperty=\"\
    Color\" To=\"Transparent\" />\n</Storyboard>\n</VisualState>\n</VisualStateGroup>\n\
    </VisualState>\n```\n\nAlthough you might decide not to define the snapped view\
    \ in your Windows Store app, the user can still snap your app. This can result\
    \ in the addition of scrollbars in the controls of the page that is currently\
    \ visible, or the UI might be partially visible. If your app requires a lot of\
    \ space for the user to effectively utilize the features in your app, you can\
    \ include a button that unsn your app. In the event handler, call the TryUnsnap\
    \ method of the ApplicationView class, as follows:\n\nSample of C# code\n\n```\n\
    using Windows.UI.Xaml;\n\n// Try to unsnap the app\nprivate void UnsnapButton_Click(object\
    \ sender, RoutedEventArgs args)\n{\n  bool unsnapped = ApplicationView.TryUnsnap();\n\
    \n  // Check the value of unsnapped to see if the application unsnapped.\n  //\
    \ Respond with a message if the app must unsnap.\n}\n```"
