    # Using Semantic Zoom in your app


    In many Windows Store apps that employ hierarchical navigation, there are several
    categories with a variable number of items in each category. The user is expected
    to swipe horizontally to reveal more categories and items. This action is common
    in most apps and in the Start screen. When the number of categories and items
    is large, it can deter the user from swiping on the screen and finding items of
    interest. In such cases, Semantic Zoom can be used to combine a zoomed-out summary
    view of the hub page and a zoomed-in detailed view of the hub page. Windows supports
    pinch-to-zoom gestures, the Ctrl Plus Sign (+) and Minus Sign (-) keys in the
    keyboard to zoom in and out, Ctrl+scroll wheel to switch between the two views.
    For example, the zoomed-out view could be a list of categories with thumbnails
    of top-rated movies, whereas the zoomed-in view can contain top-rated movies as
    new tiles.


    Support for Semantic Zoom in Windows Store apps is available through the SemanticZoom
    control. To use it in your application, you need to provide a data control (for
    example, a Grid-View or a ListView) for the ZoomedOutView and one for the ZoomedInView.
    The data controls are bound to their CollectionViewSource. The following is XAML
    for the SemanticZoom control:


