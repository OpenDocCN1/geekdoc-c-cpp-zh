    \ used to display each item.\n\n# Creating data templates to meet app requirements\n\
    \nData controls such as GridView, ListView and FlipView use data binding to display\
    \ data in a collection. These controls require a \"template\" to specify the UI\
    \ of each element in the collection when rendered on the screen. A DataTemplate\
    \ is a section of the UI that is specified independent of the control it is used\
    \ in. You can use one or more data templates with a data control if elements in\
    \ your data collection cannot be represented by a single DataTemplate. Therefore,\
    \ you can support complex layouts with a loose coupling between the data and the\
    \ UI. It is a matter of updating the data template if the underlying data model\
    \ changes for any reason.\n\nIn your Windows app, you might need to display the\
    \ same data control in multiple pages, in the same or different data control.\
    \ Data templates are very helpful for reuse—you can define a DataTemplate within\
    \ a ResourceDictionary available to the entire app. When you apply a data template\
    \ to a control, a data context is implicitly associated with it. This is through\
    \ data binding. In many cases, raw data might not be adequate for displaying in\
    \ the screen with data templates. In cases, a viewmodel acts as the data source\
    \ can be used. Because a data template is unaware of the underlying data context,\
    \ whether it is a raw data source or a viewmodel, this technique helps with separation\
    \ of concerns and reusing data templates, exactly what we are meant.\n\nIn perhaps\
    \ the simplest form, data templates are defined inline within the data control,\
    \ such as the ListView shown in the XAML in Listing 3-16."
