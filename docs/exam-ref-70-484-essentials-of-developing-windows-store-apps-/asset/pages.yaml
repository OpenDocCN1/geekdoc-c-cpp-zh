    # Objective 4.3: Manage input devices


    Windows Store apps are installed and used on a variety of devices. Windows 8 and
    Windows RT support a number of input modes such as touch, mouse, keyboard, and
    stylus. A large portion of the user experience in Windows 8 and Windows RT is
    delivered through Windows Store apps. Therefore, you should interact with them
    consistently with all the input modes.


    Windows abstracts low-level events raised when users start their interaction with
    Windows app via touch. The gesture recognizer raises additional events when it
    recognizes standard gestures and complex manipulation events. The default behavior
    of these events can be overridden, and you can add new events to the gesture recognizer
    based on the manipulations performed by the users.


    Windows Store apps respond to a mouse attached to a PC with the same events used
    for touch and stylus input. Developers are not required to write separate code
    to handle mouse events and touch gestures, but they practically detect a mouse
    and use its special capabilities, to perform manipulations. In supporting touch,
    mouse, and keyboard input, a Windows Store app can support stylus input. The data
    that consists of pressure, angle, and velocity is used to represent geometric
    shapes on a device and save to storage. The ink manager also supports handwriting
    recognition and various modes such as draw and erase.


    +   This objective covers how to:

    - Capture gesture library events.

    - Create custom gesture recognizers.

    - Listen to mouse events or touch gestures.

    - Manage stylus input and inking.'
