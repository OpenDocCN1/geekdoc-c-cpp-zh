  md: '# Thought experiment

    Implementing credentials and role management in a Windows Store app


    In this thought experiment, apply what you''ve learned about this objective. You
    can find answers to these questions in the "Answers" section at the end of this
    chapter.


    A large organization has employees located in multiple offices around the world.
    To access the organization’s intranet, employees must use their credentials to
    log on. The organization is planning to invest in employee productivity by building
    a Windows Store app, and the app will require employees to use their intranet
    credentials to access the app.


    For confidential data, employees use smart card that contain their credentials.
    Access to various resources is usually based on the roles assigned to employees.
    What are your recommendations for the organization to implement credential and
    role management in its Windows Store app?


    # Objective summary


    +   - Windows Store apps can use identity providers such as Windows Live Services
    to authenticate and authorize users. A user identified with claims is issued a
    token whenever the user needs to be authenticated.

    - The PasswordVault class can be used to securely store the credentials of a user
    in an app and have roam across all devices for the same user. The PasswordVault
    contains PasswordCredential objects identified by their resource name.

    - Windows Store apps should use the CredentialPicker to retrieve user credentials.
    The CredentialPicker class provides a dialog box that is consistent with the user
    experience across Windows Store apps.


    # Objective review


    Answer the following questions to test your knowledge of the information in this
    objective. You can find answers to these questions and explanations of why each
    answer choice is correct or incorrect in the "Answers" section at the end of this
    chapter.


