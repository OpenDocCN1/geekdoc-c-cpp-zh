  md: "It is important to carefully consider the settings you want to make available\
    \ through the Settings charm. Here are some guidelines for adding settings to\
    \ your app:\n\n+   - Add settings that are occasionally changed by the user, for\
    \ example, the font size of text in an RSS reader app or the temperature units\
    \ in a weather app.\n\n+   - If your app logs in to a remote service, provide\
    \ a command to the user to log out and an option to remember your credentials\
    \ in the PC.\n\n+   - Add user preference options, such as color themes or data\
    \ refresh intervals.\n\n+   - Add information that you use is occasionally used,\
    \ such as the privacy policy, help, copyright, and your app version.\n\nIt is\
    \ recommended that you use up to four entry points (from a maximum of eight) for\
    \ grouping similar or related options together. These entry points should be visible\
    \ wherever the user is in your app. You can disable some settings in a certain\
    \ context. Each point in the Settings pane should use a single word as a label.\
    \ If a command opens a web page instead of a flyout, you should inform your users\
    \ with a visual clue.\n\n# Adding entry points for AppSettings in the Settings\
    \ window\n\nUnlike the Search target or the Share Target target, a Windows Store\
    \ app that provides access to its settings through the Settings charm does not\
    \ require a capability or a declaration in the package manifest. Entry points\
    \ for AppSettings are added in the CommandsRequested object, as shown in Listing\
    \ 2-19.\n\n> **LISTING 2-19** Adding entry points for AppSettings in the CommandsRequested\
    \ event\nusing Windows.UI.ApplicationSettings;\n// Other namespace usings for\
    \ brevity\npublic sealed partial class App : Application\n{\n    public override\
    \ OnInitialized()\n    {\n        SettingsPane.ForCurrentView().CommandsRequested\
    \ += OnCommandsRequested;\n    }\n    void OnCommandsRequested(SettingsPane sender,\
    \ CommandsRequestedEventArgs e)\n    {\n        e.Request.ApplicationCommands.Add(\n\
    \            new SettingsCommand(1, \"Account\", OnAccountCommand));\n       \
    \ e.Request.ApplicationCommands.Add(\n            new SettingsCommand(2, \"General\"\
    , OnGeneralCommand));\n        e.Request.ApplicationCommands.Add(\n          \
    \  new SettingsCommand(3, \"Theme\", OnThemeCommand));\n        e.Request.ApplicationCommands.Add(\n\
    \            new SettingsCommand(4, \"Credits\", OnCreditsCommand));\n    }\n}"
