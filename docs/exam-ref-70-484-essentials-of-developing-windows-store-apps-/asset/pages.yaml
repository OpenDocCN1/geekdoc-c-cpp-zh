  md: '# Manage security and data


    An important aspect of the design and implementation of a Windows Store app is
    how it handles data in various forms, such as its own settings, user-specific
    data, and data from remote services. Many apps depend on a remote source of data
    to be fully functional, whereas many apps require data to be persisted locally.
    Data access in a Windows Store app can be implemented based on its requirements.
    The WinRT programming interface (API) provides support for both local and remote
    data storage for Windows Store apps.


    Some Windows Store apps depend on data from remote web-based services. Such apps
    require a connection over the network to access the web services. Modern web services
    are designed using Representational State Transfer (REST) architecture, which
    requires apps to use the appropriate HTTP verb while sending a request for data
    or to invoke an operation on the data.


    Windows Store apps that display and manipulate data can utilize data binding,
    a flexible powerful technique. Data binding can connect a data model with the
    app''s presentation layer using declarations in XAML instead of code. Dependency
    properties can be used in the data model to support data binding.


    Securing data access by Windows Store apps is important to prevent data from being
    compromised by third parties. It is particularly important to protect the user''s
    credentials. The WinRT APIs provide methods to secure sensitive data within a
    Windows Store application. Windows Store apps should use single sign-on (SSO)
    whenever an authentication provider is available.


    # Objectives in this chapter:


    +   - Objective 5.1: Choose an appropriate data access strategy.

    - Objective 5.2: Retrieve data remotely.

    - Objective 5.3: Implement data binding.

    - Objective 5.4: Manage Windows authentication.

    - Objective 5.5: Manage web authentication.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# # Objective 5.1: Choose an appropriate data access strategy


    Choosing a data access strategy is an important step in the development of a Windows
    Store app. An app might need to store its own settings as well as settings configured
    by users. It might also need to connect to the Internet and download data to present
    to the user, or upload user information to a remote web service. If the user has
    app installed on multiple devices, each of the app might need to synchronize the
    data and present the settings updated by the user.


    You have a wide range of data access options available to help develop your app.
    You should consider extensibility of your app for enhancements in the future so
    that your app does not need to be modified to support new requirements. Your app
    can use the local, roaming, or temporary data store for settings and application-specific
    data; it can use file APIs for storing and retrieving files from the device; and
    it can connect to remote services for downloading and displaying it.


    This objective covers how to:


    +   - Choose the appropriate data access strategy (file based, web service, remote
    storage, including Windows Azure storage) based on app requirements.


    # # Choosing the appropriate data access strategy based on app requirements


    Storage and retrieval of data is a fundamental feature in most Windows Store apps.
    Windows Store apps can interact with data in a variety of ways. In some cases,
    the user is involved in this interaction; in other cases, the app stores and retrieves
    data. The choice of data access strategy depends on the type of data and data
    storage available to your app, and the way users create and access their data.


    When users interact with a Windows Store app, the app usually requires one or
    more of the following types of data:


    +   - Settings are created by the app and are not controlled by the user. These
    are often specific to the device (for example, the last time the app was launched).


    +   - Settings are created by the app and are not controlled by the user; however,
    these settings need to be synchronized across multiple devices.


    +   - Settings are configured by the user according to their preferences. Your
    application provides a set of default values, and the user has the option to change
    these values, usually through the Settings charm. These settings might need to
    be synchronized across multiple devices of the user.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '+   - Data created by the app on a device while it is being used. This includes
    cached data stored between application sessions to support situations when the
    device is not connected to the Internet.


    +   - Data created by the app and cached temporarily on a device to help with
    the performance of the application. This type of data usually has a lifetime of
    its own and can be deleted by the app.


    +   - Data created by the user and imported in your application and saved in the
    local device or a remote server. An example is an app used to manipulate photos
    and store them afterwards.


    WinRT APIs provide a number of options for developers to work with data in their
    Windows Store apps. These options relate to the pattern of interaction between
    the data and the app or the user, and can be broadly classified into the following
    types:


    +   **Local application data** This option should be used to store settings and
    device-specific temporary files—data that does not affect the app''s operations
    on other devices and will not be required by other devices. There is no restriction
    on the size of data that can be stored in the local application data store.


    +   **Roaming application data** When you configure your application''s settings
    to suit their preferences, they expect them to be available across all devices.
    The roaming application data store automatically synchronizes data across multiple
    devices for the same user account. There is a restriction on the size of data
    that can be stored in the roaming application store.


    +   **Temporary application data** The temporary application data store can be
    used to store transient data that can be deleted by the system at any time. This
    might include data created by the user or from a remote web service that is not
    likely to change frequently and does not affect the functionality of the app.


    +   **Local and remote files** Your app can store data in a file and save it in
    one of the folders it has access to. A folder in the user''s Microsoft SkyDrive
    account can also be used to save files. In addition, an app can access files in
    the device or from a remote server, manipulate them, and save them.


    The application data store is available to an app on a per-user base for storing
    settings and files. The Windows.Storage namespace provides a number of classes
    that are useful for data management in the application data store as well as for
    file storage. The ApplicationData class provides events, methods, and properties
    that Windows Store apps can use to incorporate the data store.


    # Local application data


    A Windows Store app should store information locally that is required when the
    application is running and not available across multiple devices. This includes
    settings internal to the app as well as any files created by the app. There is
    no size restriction on the local data store.'
