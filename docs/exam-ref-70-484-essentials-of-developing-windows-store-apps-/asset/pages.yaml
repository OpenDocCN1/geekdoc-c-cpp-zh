  md: '# Chapter summary


    +   Windows Store apps are unique in their appearance and behavior. The emphasis
    in these applications are on users and the way they interact with your application.
    You should following the principle of Microsoft design style and available guidance
    to design your app.


    +   Consider separation of concerns, reusability, and maintainability of your
    application when planning the logical layers of your solution. Divide your application
    into three loosely coupled layers: presentation layer, business layer, and data
    layer. Whenever you have the requirement to integrate legacy software, consider
    using WinMD components in your Windows Store app.


    +   Use the MVVM pattern to implement the logical layers of your solution. The
    MVVM pattern is helpful for defining the interfaces for communication among the
    layers of your solution. Use the INotifyPropertyChanged interface to implement
    your viewmodels and employ data binding in your views. Use native controls as
    GridView to render data collections in views using the CollectionSource and ObservableCollection
    classes.


    +   Plan and implement a sound state management strategy, one that preserves the
    state and data when your app is suspended. Use the OnLaunched and OnActivated
    events to provide the user with a way to resume your app. Check for the PreviousExecutionState
    and ActivationKind when your app is launched; restore the state and data if necessary.


    +   After development is complete, go through the Windows Store certification
    criteria to ensure your app meets all the requirements. Test your app with the
    Windows ACK and pay attention to the dependencies in your app. Prepare an app
    manifest ensuring all capabilities and declarations required by your app are included
    in the manifest. If you are planning to distribute your app directly, contact
    the IT administrators and give them the app package for deployment.'
