  md: 'By acting as a source of content, your application has the capability to share
    content with devices in its close proximity as enabled by tap and send. Many Windows
    8 devices have Near Field Communication (NFC) support and are capable of using
    tap and send with other Windows-8 devices and Windows Phone devices.


    # Design guidelines for the Settings charm


    The Settings charm provides a simple, universally accessible entry point to your
    application with a single swipe from the right edge of a touch device or through
    the Windows+I shortcut. Windows automatically adds a set of commands to the Settings
    page. These are the app name and publisher, a Rate and Review command that opens
    the app''s page in the Windows Store, and a Permissions command if the app has
    any capabilities declared in the manifest. Your app can provide up to eight additional
    commands. Ideally, the maximum number of commands added to an app''s Settings
    charm should be limited to four. If your app attempts to add more than eight commands
    to the charm, an exception occurs.


    The commands you add in the Settings charm are available throughout the app; that
    is, the commands are available through the Settings charm in all pages of the
    app. If a page requires commands specific to the page, implement these as menu
    items in the app bar.


    A command in the Settings charm of a Windows Store app can link to a web page
    or invoke a secondary flyout panel with specific settings controls. The Windows
    Store app certification requirements make it mandatory for apps that collect any
    kind of personal information to provide a privacy policy. This is typically included
    as a command in the Settings charm.


    Secondary flyout panels are limited to two sizes: narrow (346 pixels) or wide
    (646 pixels). In your Windows Store app, all the secondary panes should be the
    same size. The permissions flyout is provided by Windows, and the items listed
    in the flyout are configured according to the capabilities declared in your applications''
    manifest file.


    It is recommended that your app include account/profile management through the
    Settings charm because the user might want to update these settings from within
    any page in the app. When designing the flyout for a charm, you should minimize
    the number of controls. Use simple controls like toggle switches for on/off values,
    radio buttons for mutually exclusive items, list boxes for single/multiple value
    selection, and text input boxes where dynamic text input is required.


    You should minimize scrolling in a secondary flyout and avoid any hierarchy of
    settings. Place the controls in a secondary flyout in a single column and configure
    them so that any changes in the settings are committed instantaneously.


    The Settings charm is a great location for engaging the user with your app and
    providing them with the option to communicate with you by providing feedback about
    your app, bug reports and submit feature requests. Figure 2-15 shows a feedback
    form included in the Weather app in Windows 8 through the settings flyout.'
