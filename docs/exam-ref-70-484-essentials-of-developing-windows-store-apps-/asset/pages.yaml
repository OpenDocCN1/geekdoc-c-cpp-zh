  md: 'There is no support for data when navigating backward or forward through the
    navigation history using the GoBack or GoForward methods. You should implement
    your own solution to store data in a shared place so that both pages can access
    this data.


    The EventArgs instance available in the OnNavigatedTo and OnNavigatedFrom virtual
    methods of the Page class has a property NavigationMode that tells you the direction
    of movement during navigation. NavigationMode has one of the values from the NavigationMode
    enumeration, as described in Table 4-1.


    # TABLE 4-1 NavigationMode enumeration members


    | MEMBER | VALUE | DESCRIPTION |

    |---|---|---|n| New | 0 | Navigation is carried out to a new instance of a page.
    |

    | Back | 1 | Navigation is carried out toward the back of the navigation stack.
    |

    | Forward | 2 | Navigation is carried out toward the front of the navigation stack.
    |

    | Refresh | 3 | Navigation is carried out to the current page, perhaps with a
    different set of data. |


    In Windows Studio, if you choose the Grid app or the Split app to create a Windows
    Store app, the pages use the LayoutAwarePage class as their base class. This class
    extends the Page class, which is the default class that a page in a Windows Store
    app extends to override the virtual methods. The LayoutAwarePage provides developers
    with the following features:


    +   - It provides a GoHome method that a page can use to return to the first item
    in the navigation stack while traversing backward.

    - It implements the GoBack and GoForward methods with the logic to check CanGoBack
    and CanGoForward, respectively.

    - It overrides the OnNavigatedTo method to check the value of the NavigationMode
    property of the page being navigated. If a new page is loading, the LayoutPage
    class clears any session state stored by the SuspensionManager and adds the new
    page to the navigation stack.

    - It overrides the OnNavigatedFrom method to save the session state for the page
    being navigated away.


    In Windows Store apps, you should implement utility functions, such as GoBack
    and Go-Forward, in a base class for every page. When you add a new page to a Windows
    Store app using Visual Studio, the page automatically derives from the LayoutAwarePage
    class. These pages are highlighted in the Add Item dialog box of Visual Studio,
    shown in Figure 4-25.'
