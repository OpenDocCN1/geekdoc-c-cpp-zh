  md: '# Objective 5.5: Manage web authentication


    Windows Store apps can implement a custom authentication and authorization mechanism
    for users to log on and access resources as well as to interact with specific
    content. With the popularity of online services users access every day—such as
    Windows Live, Twitter, Facebook, Flickr, and others—Windows Store apps can authenticate
    users using these services. This is more relevant when the content from these
    services is being accessed by the Windows Store app. An app should be able to
    log on the user without requiring them to provide their credentials in the app
    itself.


    WinRT APIs provide the Windows.Security.Authentication.Web namespace for supporting
    authentication of Windows Store apps with remote web services. The WebAuthenticationBroker
    class helps with the authentication of a Windows Store app with a remote service
    without requiring the user to leave the application.


    The WebAuthenticationBroker class can be used to identify providers on the web
    using protocols such as OAuth and OpenID. Most modern web services use the OAuth2
    protocol for authenticating applications. The class can be used to implement SSO,
    a process of authenticating the user within multiple Windows Store apps without
    having to enter their credentials for the remote web service.


    The CredentialPicker class can be used to retrieve the credentials with a consistent
    user experience across Windows Store apps. It provides a number of options for
    the developer to configure the standard dialog box in which users insert their
    credentials. When used with the PasswordVault class, the user credentials can
    be roared across multiple devices for the Microsoft account.


    +   This objective covers how to:

    - Use the Windows.Security.Authentication.Web namespace.

    - Implement the WebAuthenticationBroker class.

    - Set up OAuth2 for authentication.

    - Set up sign-on (SSO).

    - Implement the CredentialPicker class.

    - Implement credential roaming.


    # Using the Windows.Security.Authentication.Web namespace


    Windows Store apps that require content from remote web services often require
    the user to be authenticated. Instead of implementing authentication using traditional
    methods, apps can utilize authentication protocols such as OAuth, which in many
    cases is the only acceptable option. Most web services expect the user to enter
    their credentials in an area that is provided'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'by the service itself. The user authentication process might consist of a number
    of steps the user needs to perform before access is granted to the Windows Store
    app.


    The Windows.Security.Authentication.Web namespace provides the WebAuthenticationBroker
    class that sets up the authentication of a Windows Store app with a remote web
    service. This class provides two methods for carrying out authentication in a
    Windows Store app with a remote web service:


    +   * **AuthenticateAsync** This method sets up the authentication process with
    the remote web service specified with a URI. In its simplest form, this method
    accepts a set of options specified through a WebAuthenticationOptions object and
    the URI of the web service. An overload of this method accepts a third parameter,
    which is the callback URI used to extract the access token returned by the remote
    service as a result of successful authentication. The URI for the AuthenticateAsync
    method should use the https:// prefix; otherwise, the method fails to start the
    authentication process with an invalid parameter.

    * **GetCurrentApplicationCallbackUri** This method is used to obtain the implicit
    callback URI and register with the remote web service for SSO support. The URI
    is of the form ms-app://[application SID].


    The response from the AuthenticateAsync method is an object of type WebAuthenticationResult.
    It has the following read-only properties:


    +   * **ResponseData** This property contains the data, including the entire URL
    returned by the remote web service after the authentication completes.

    * **StatusCode** This property contains the result of the authentication operation.
    The value is a member of the WebAuthenticationStatus enumeration.

    * **ErrorMessage** This property contains the HTTP status code if the authentication
    failed with the remote service.


    The status of the authentication process with the AuthenticateAsync method is
    represented in the WebAuthenticationResult ResponseStatus property with the WebAuthenticationStatus
    enumeration. Table 5-3 describes WebAuthenticationStatus enumeration members.


    TABLE 5-3 WebAuthenticationStatus enumeration members

    | Member | Value | Description |

    | --- | --- | --- |

    | Success | 0 | The authentication was successful, and the result is available
    in the ResponseData property. |

    | UserCancel | 1 | The user canceled the authentication. |

    | ErrorHttp | 2 | The authentication failed because an HTTP error was encountered.
    The ResponseDetail property contains the HTTP status code indicating the type
    of error. |'
  merge: -1
  pgno: 404
- img_proc: true
  md: 'The AuthenticateAsync method carries out the authentication with the remote
    web service can be configured using the WebAuthenticationOptions enumeration.
    Table 5-4 describes WebAuthenticationOptions enumeration members.


    # **TABLE 5-4** WebAuthenticationOptions enumeration members


    | Member | Value | Description |

    |---|---|---|

    | None | 0 | There are no options specified for the method. |

    | SilentMode | 1 | This option is used to set up the WebAuthenticationBroker without
    showing the UI. It is used in apps where SSO is implemented. |

    | UseTitle | 2 | This option is used to specify that WebAuthenticationBroker should
    return the title of the webpage at the end of the authentication process in ResponseData
    property. |

    | UseHttpPost | 4 | This option is used to specify that WebAuthenticationBroker
    should return the body of the webpage at the end of the authentication process
    in ResponseData property. It is used in apps where SSO is implemented. |

    | UseCorporateNetwork | 8 | This option is used to specify processing an authentication
    provider within a corporate network. The app should be set up with the Internet
    (Client & Server), Enterprise Authentication, and Shared User Certificates capabilities
    in the package manifest.|


    # # Implementing the WebAuthenticationBroker class


    A Windows Store app can incorporate authentication with a remote web service with
    the WebAuthenticationBroker class. The following steps are required to use the
    WebAuthenticationBroker class for authenticating a user in a Windows Store app:


    +   1. Register your app for a client ID and, redirect a URL where the remote
    web service will redirect your app at the end of a successful authentication process.

    2. Use the WebAuthenticationOptions to provide any options to the WebAuthenticationBroker
    based on your app’s requirements.

    3. Set up the URI for the AuthenticateAsync method to send the authentication
    request.

    4. When the AuthenticateAsync method returns a WebAuthenticationResult object,
    examine its ResponseStatus property to check whether the authentication was successful.

    5. If authentication was successful, use the ResponseData property of the WebAuthentication
    object to obtain the access token.

    6. Requests to access content from the remote service should contain the access
    token obtained as a result of the authentication.'
  merge: -1
  pgno: 405
