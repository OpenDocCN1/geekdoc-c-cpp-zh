  md: 'The Search, Share Target, and Play To contracts are exposed in a Windows Store
    app through a declaration in the app''s manifest and an implementation in the
    app. Each contract implemented in an app is available to the user through the
    respective charm, for example, if an app implements the Search contract, it is
    invoked in the Search charm. Windows provides the Settings charm as a universally
    accessible entry point in context to your app for the user to update settings
    that the app as well as settings exposed by the system. A Windows Store app can
    implement the Settings contract and include settings the user can update while
    using the app.


    This objective covers how to:

    - Choose the appropriate charm based on app requirements.

    - Design your app in a charm- and contract-aware manner.

    - Configure the app manifest for correct permissions.


    # Choosing the appropriate charm based on app requirements


    The charms appear when users swipe from the right side of the screen, when they
    hover the mouse on the top-right side of their monitor, or when they press the
    Windows+C keyboard shortcut. The charms bar with various charms is shown in Figure
    2-5.


    ![](img/81d79ceb6883e2d24731f821954f3393_99_0.png)'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'The contracts available through the charms enable your app to interact with
    others. Some charms, as Search, drives users from other apps or the system, others
    provide entry points for common requirements such as application settings. The
    contracts you can integrate in your app through the charms are the following:


    +   - **Search** The Search contract enables the user to search for anything within
    your app, another app, or even the entire PC. Your app can be activated if it
    participates in the Search contract and has results to show for the search term.


    +   - **Share Target** The Share Target contract provides users with the content
    from your app with another app to perform an action such as sending an email without
    leaving your app.


    +   - **Devices** Wired and wireless devices can be accessed via the Devices contract.
    You can print content from your app to a printer, sync content with another device
    such a Windows Phone, or stream media to your TV.


    +   - **Settings** The Settings charm is used to change common settings of the
    PC and for your app. While app settings differ with apps, PC settings are the
    same in every app. You can implement the Settings contract to manage your application''s
    settings through the Settings charm.


    > EXAM TIP

    You should be familiar with the contracts and extensions available for Windows
    Store apps. You can read more about contracts and extensions at http://msdn.microsoft.com/en-gb/library/windows/apps/hh464906.aspx.


    The Search contract enables users to search your app through the Search charm
    from anywhere in the system. Users can search for content in your app through
    the Search charm if your app is running, as shown on the left in Figure 2-6. Otherwise,
    users can enter the search term and select your app from the list of apps in the
    Search pane, as shown on the right in Figure 2-6.'
  merge: -1
