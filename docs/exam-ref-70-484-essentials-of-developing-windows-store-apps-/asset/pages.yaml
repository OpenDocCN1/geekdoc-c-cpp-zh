    +   **CharacterSpacing** This property sets the spacing between characters in
    units of a thousand of an em. Note that the em is equal to the size of the element.
    You can use a negative value to reduce spacing between letters.


    +   **FlowDirection** This property sets the direction of text and other UI elements
    within the TextBlock. The property can be set to LeftToRight (the default) or
    RightToLeft.


    +   **Font properties** The FontFamily, FontSize, FontStretch, FontStyle, and
    FontWeight properties customize the look and feel of the font in the TextBlock.


    +   **IsSelectionEnabled** This property specifies whether selection is enabled
    in the TextBlock. It can be False (the default value) or True.


    +   **LineHeight** This property sets the height of each line in the TextBlock,
    specified in device-independent pixels. A value of zero (the default value) indicates
    the line height is automatically determined from the characteristics of the font
    used in the TextBlock. A nonzero value sets the height specified in pixels.


    +   **LineStackingStrategy** This property specifies how a line box will be determined
    for each line. The default is MaxHeight, which is the smallest value that contains
    all the inline elements on that line when elements are properly aligned. It can
    be set to BlockLineHeight and in conjunction with the LineHeight property to set
    the height. Finally, it can be set to Baseline, which sets the distance between
    text baselines.


    +   **Alignment** This property specifies the horizontal alignment of the text
    content. It has four of values: Center, Left, Right, or Justify. The default value
    is Left.


    +   **Trimming** This property sets the behavior of the text in it doesn''t fit
    within the available area. You can set it to None (the default value) so that
    the text is clipped when it overflows, or Ellipsis, which places an ellipsis in
    the end.


    +   **Wrapping** This property specifies whether text can wrap into additional
    lines. You can set it to NoWrap (the default value) or Wrap.


