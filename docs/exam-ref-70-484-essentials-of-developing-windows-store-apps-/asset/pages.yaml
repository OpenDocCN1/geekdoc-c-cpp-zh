  md: '# Answers


    This section contains the solutions to the thought experiments and the answers
    to the lesson review questions in this chapter.


    # Objective 3.1: Thought experiment


    +   1. **Use layout controls** The layout controls provided by Microsoft, such
    as Grid, build a fluid layout, which helps provide a consistent user experience
    across various devices and screens.

    2. **Design for touch, touch keyboard and mouse** The app must support users with
    touch-enabled devices as well as input from a keyboard and mouse.

    3. **Support multiple orientation and screen sizes** To improve the user experience,
    your app should support multiple orientations and various screen sizes.


    # Objective 3.1: Review


    +   1. **Correct answers**: A, B, C

    A. **Correct**: Windows supports the full screen view state in landscape orientation.

    B. **Correct**: Windows supports the fill view state in landscape orientation.

    C. **Correct**: Windows supports the snapped view state in landscape orientation.

    D. **Incorrect**: Windows supports the snapped view state in the landscape orientation
    only; the snapped view state is not supported in the portrait orientation.

    . **Incorrect**: Windows supports the fill view state in the landscape orientation
    only; the fill view state is not supported in the portrait orientation.

    2. **Correct answer**: C

    A. **Incorrect**: Implicit transitions update properties that are a *Double*,
    *Color*, or *Point* value, with animations. Using implicit transitions is not
    enough to meet the requirement.

    B. **Incorrect**: Explicit transitions are applied on properties as *Length* and
    *Width*, usually with animations.

    C. **Correct**: The *StateManager* with *VisualStates* for the supported view
    states is the preferred way to implement this requirement. Properties of individual
    UI elements are not altered; instead, they are invisible after the transition
    to a different orientation.

    D. **Incorrect**: The constructor is invoked when the page is created, so the
    app will not respond to changes in its orientation after it is visible. The *StateManager*
    should be used in the *OnSizeChanged* event of the page to update its layout.'
