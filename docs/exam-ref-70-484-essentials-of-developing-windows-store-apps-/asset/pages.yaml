  md: '# Preparing an application manifest


    A Windows Store app needs to be packaged before it is submitted to the Windows
    Store. When you create a new Windows Store project or item using Visual Studio,
    your application is set up for an app package to be created at a later stage of
    development. Visual Studio creates a source file for the app package (Package.appmanifest)
    and adds it to your solution. When you build your project for the first time,
    Visual Studio transforms this file into the manifest file (AppxManifest.xml) and
    puts it in the output folder of the app. This is shown in Figure 1-11.


    ![](img/81d79ceb6883e2d24731f821954f3393_69_0.png)


    Figure 1-11 The application manifest file in Visual Studio


    Your application file describes your app, including its name, description, start
    page, splash screen, and logos. In addition, you can use the manifest file to
    add capabilities and declarations, such as the ability to access a webcam or a
    microphone, and if your app supports search or acts as a share target, for example.


    You can create the package manifest file manually using a text editor. Listing
    1-13 shows the code for a package manifest.'
