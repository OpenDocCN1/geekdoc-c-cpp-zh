    \ on the right\n\n# Modifying styles based on event and property triggers\n\n\
    The values of various properties of a control set through a style or a control\
    \ template may require updates when certain conditions are met. For example, when\
    \ a button is pressed, you want the color of the foreground to change.\n\nUnlike\
    \ technologies such as Windows Presentation Foundation (WPF) and Silverlight,\
    \ which triggers can be used to modify styles and control templates, Windows 8\
    \ provides the VisualStateManager to manage these changes. The VisualStateManager\
    \ is responsible for managing visual states and the transitions between these\
    \ states for controls. The VisualGroups element is used to define the visual states\
    \ of a control in XAML. Alternatively, the GoState method of the VisualStateManager\
    \ class is used to transition between the visual states of a control in the code-behind\
    \ of the page that contains the control.\n\nListing 3-24 shows the XAML for VisualGroups\
    \ and the VisualStates of a button defined in its ControlTemplate."
