    # Accepting sharing requests by implementing activation within the Share cham


    A Windows Store app can act as both a source and share target. In the latter case,
    it must implement the Share Target contract. This contract ensures your Windows
    Store app to be presented as an option when the user invokes the Share cham, and
    the data from the source app is supported by your app. Your app has the option
    to support a definite number of formats, and you should register only the formats
    your app can handle.


    If you want your app to receive content shared by other apps, you should configure
    your app''s manifest file to indicate that it supports the Share Target contract.
    This step ensures Windows includes your app as an option when the user invokes
    the Share cham when data formatted by your app are shared. Windows shows only
    those target apps that support the data format used for sharing the content.


    In a WindowsOperation that acts as a share target, most of the work during a share
    operation is handled by the ShareOperation class in the Windows.ApplicationModel.DataTransfer.ShareTarget
    namespace. In addition, the QuickLink class is used to represent shortcuts that
    help users share content with apps they use. Your app can optionally return a
    QuickLink created after the sharing operation is completed. The QuickLink appears
    in a list when the cham is opened for sharing content. QuickLinks make it easier
    and simpler for users to frequently share content with the same person or group.


    Visual Studio provides developers with a template for adding the Share Target
    contract in a Windows Store app. When you click the Add|New Item menu option in
    your Visual Studio Store project, you have an option to add Share Target Contract
    to your app (Figure 2-23). This step adds the appropriate declaration to the package
    manifest and adds a new page, which is used by other apps to share content with
    your app.'
