- img_proc: true
  md: 'embedded in views. A view responds to changes in size and orientation of the
    screen; application view states; use actions as panning, zooming, scaling, and
    resizing; and manipulation of UI elements by the user.


    A Windows Store app can support one or more view states in the UI. Your app receives
    notifications whenever the view state changes and, it can query for the current
    view state to help with the arrangement of controls in views for a certain layout.
    To support multiple view states, you should use styles for each view state, which
    are applied to the view whenever the view state changes.


    The users of your app can change the orientation of their device to suit their
    convenience. For example, if your app is a news or blog reader, the user might
    find it convenient to hold their tablet in the portrait orientation. Therefore,
    it is important to consider various orientations of a device and support them
    in your app.


    +   This objective covers how:

    - Handle view state events from ViewStateManager.

    - Choose between style patterns for different view states.

    - Set up app orientation in the manifest.


    # Handling view state events from ViewStateManager


    In traditional desktop applications, a developer must incorporate tools for a
    user to change the app''s orientation and screen size. However, Windows Store
    apps can occupy the entire screen, so developers must also consider an app''s
    view state. View states, shown in Figure 3-1, represent the various modes in which
    a user can use an app.'
