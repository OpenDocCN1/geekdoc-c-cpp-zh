    The source of an item control can change over time. The user expects the UI to
    update automatically instead of clicking a refresh button on the app bar or on
    screen. In such cases, instead of binding to a collection that implements the
    IEnumerable interface, the item control should bind to an ObservableCollection
    or an object that implements the IList and INotifyCollectionChanged event of the
    Collection class can be used to inform the user when an item is added, removed,
    changed, or moved; if the collection is refreshed.


    In some data sources, items can be added progressively or, or to optimize the
    loading process, the business logic of a Windows Store app requests data to be
    loaded the collection incrementally. In such cases, the ObservableCollection class
    can be extended with your own class that implements the ISupportIncrementalLoading
    interface. For example, the response from a remote web service can contain a certain
    number of items as well as a flag to indicate whether there are more items available.
    In addition, you have to implement the HasMoreItems property that returns a Boolean
    to indicate whether there are more items to load and the LoadMoreItemsAsync method
    to load the specified number of items from the source, for the ISupportIncrementalLoading
    interface find out there are more items to be loaded. If this property is False,
    it does not invoke the LoadMoreItemsAsync method to load more data.'
