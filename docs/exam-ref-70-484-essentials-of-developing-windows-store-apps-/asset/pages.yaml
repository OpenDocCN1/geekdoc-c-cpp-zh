    ```\npublic void ClearTileNotifications() {\n    // Clear all notification and\
    \ set the tile to display default content\n    TileUpdaterManager.CreateTileUpdaterForApplication().Clear();\n\
    }\n```\n\nUsers can choose to turn off the tile of your application or they can\
    \ choose the square tile instead of the wide tile. The system provides this option\
    \ when your application's tile is selected by the user, as shown in Figure 4-4.\n\
    \n![](img/81d79ceb6883e2d24731f821954f3393_251_0.png)\n\n**FIGURE 4-4** Users\
    \ choose to turn live tiles on or off for an application and select the square\
    \ tile instead of the wide tile (Photo courtesy of Microsoft Office Imagery)\n\
    \n# EXAM TIP\n\nYou are not expected to know the names of common tile templates\
    \ for the exam. You should be familiar with setting up a tile notification, delivering\
    \ it through the TileUpdater, and clearing tile notifications.\n\nIf you choose\
