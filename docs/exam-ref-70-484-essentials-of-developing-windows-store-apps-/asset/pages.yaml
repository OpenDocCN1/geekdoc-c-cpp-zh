  md: '# MORE INFO LAYOUT AND NAVIGATION IN APPS


    There are articles prepared by Microsoft for developers requiring guidance and
    inspiration in developing Windows Store apps. You can read these articles on designing
    great productivity apps (http://msdn.microsoft.com/en-us/windows/apps/hh868273.aspx)
    and designing new apps (http://msdn.microsoft.com/en-au/library/windows/apps/hh868273.aspx)
    to understand how you can build Windows Apps using the templates provided by Visual
    Studio.


    # Working with navigation events, properties, and functions


    When building a Windows Store app, you have the option to add any number of pages
    necessary to implement your business requirements. An app is composed of a frame
    to hold multiple pages and help with the navigation between these pages. A page
    consists of XAML used to define its layout and code-behind for implementing logic.
    A page derives from the Page control that derives from a UIElement (they belong
    to the Windows.UI.Xaml namespace). When an app is launched, an instance of the
    Frame is created, which is then used to navigate to one or more pages.


    The Frame has a number of properties and methods that are useful for navigation
    among pages in a Windows Store app. The CanGoBack and CanGoForward properties
    are commonly used with navigation buttons to enable them (through the Button''s
    Enabled property) based on whether a page is available in the requested direction
    of navigation. The Navigate method of the Frame class is used to navigate to a
    specific page in an app. You can optionally provide a parameter to this method,
    which is passed to the page being navigated to. This is helpful in cases when
    your app is launched through a toast notification or a search result. You can
    use the Background property to specify the brush to set an image, a pattern or
    solid color as the background of the Frame. In Windows Store apps, a page is created
    every time you navigate to it and destroyed when you navigate away from it. In
    some cases, you might need to use the same instance of a page multiple times.
    The Frame class has the capability to cache a number of pages set via the CacheSize
    property. The CacheSize property indicates the total number of pages that will
    be cached by the class.


    Use the Page class to compose a Windows Store app that supports for navigation
    among the pages. You can create a number of pages in your application and navigate
    to those pages from the frame. The Page class has a number of properties and methods
    you can use in your app. If you expect users to navigate to the same instance
    multiple times, you should set the NavigationCacheMode property of the Page object
    to either Enabled or Required. The NavigationCacheMode property is set to Required,
    the page is cached even if the cache size of the Frame specified through its CacheSize
    property is exceeded. Figure 4-23 shows how three pages are hosted in a single
    frame and navigation is carried out between them.


    286 CHAPTER 4 Program the user interaction'
