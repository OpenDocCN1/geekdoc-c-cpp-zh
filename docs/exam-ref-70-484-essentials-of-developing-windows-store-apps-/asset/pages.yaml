  md: 'When the Navigate method of the Frame class is used to navigate between pages
    in a Windows Store app, a series of events is raised by the Frame class and by
    the page being navigated to. The Frame class raises two events:


    +   **Navigating** This event is raised when a new navigation is initiated by
    the system or user.


    +   **Navigated** This event is raised when the page being navigated to is available,
    although the page might not have finished loading.


    The Page class provides a set of virtual methods that can be used to implement
    application logic when the page is being navigated and when the user is navigating
    away from the page. These methods are useful for initializing the page or performing
    operations to save data when the user navigates away from it. The three virtual
    methods of the Page class that are useful for navigation are the following:


    +   **OnNavigatedFrom** This method is invoked when the user has navigated away
    from the page and the page is no longer visible in the screen.


    +   **OnNavigatingFrom** This method is invoked when the user has initiated an
    action to navigate away from the page, but the page is still visible in the screen.


    +   **OnNavigatedTo** This method is invoked when the page is loaded and is visible
    in the screen.


    The events raised by the Frame object in a Windows Store app and the methods invoked
    by a Page object when it participates in navigation are all arranged in a certain
    order. Figure 4-24 shows the events raised in an app with two pages with the user
    clicking a navigation link in Page 1 that leads her to Page 2.'
