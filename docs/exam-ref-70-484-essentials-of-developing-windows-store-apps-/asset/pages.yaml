  md: "# Creating updating badges using the TileUpdateManager class\n\nThe live tile\
    \ of a Windows Store app is commonly used to deliver new content to the user.\
    \ In some cases, you want to notify the user with a status or summary of new items\
    \ that are ready for viewing. Badges display the status at the bottom-right corner\
    \ of the application (on the bottom-left corner on a computer set to right-to-left\
    \ language). A badge is either a glyph, which indicates status as an alert or\
    \ attention (available as a fixed set of glyphs) or a number between 1 and 99.\
    \ Badges can display on both square and wide tiles.\n\nTo send a badge update\
    \ to the title of your app, you need to select the type of badge the title should\
    \ display. This is one of the two values of the BadgeTemplate enumeration, which\
    \ has the following members:\n\n+   - Glyph A glyph image provided by the system.\n\
    - Number A numerical value between 1 and 99. Values greater than 99 are displayed\
    \ as +99.\n\nYou can update the value of the badge element in the XML template\
    \ of a badge and use the Update method of the BadgeUpdater class to update the\
    \ badge in tile. An instance of BadgeUpdater class is obtained from the BadgeUpdateManager\
    \ static class with CreateBadgeUpdaterForApplication method for the life of the\
    \ app and CreateBadgeUpdater-SecondaryTile for the secondary tile. The code in\
    \ Listing 4-5 shows how to send a badge update for the primary tile as a number\
    \ or a glyph to clear all badge updates.\n\nLISTING 4-5 Sending badge updates\
    \ for the primary tile and clearing badge updates\n\n```\nprivate void SendBadgeUpdateAsNumber(\n\
    \    XmlDocument badgeXml =\n        BadgeUpdateManager.GetTemplateContent(BadgeTemplateType.BadgeNumber);\n\
    \        XmlElement badgeElement = (XmlElement)badgeXml.SelectSingleNode(\"/badge\"\
    );\n        badgeElement.SetAttribute(\"value\", \"2\");\n        BadgeNotification\
    \ badge = new BadgeNotification(badgeXml);\n        BadgeUpdateManager.CreateBadgeUpdaterForApplication().Update(badge);\n\
    );\n```\n\n```\nprivate void SendBadgeUpdateAsGlyph(\n    XmlDocument badgeXml\
    \ =\n        BadgeUpdateManager.GetTemplateContent(BadgeTemplateType.BadgeGlyph);\n\
    \        XmlElement badgeElement = (XmlElement)badgeXml.SelectSingleNode(\"/badge\"\
    );\n        badgeElement.SetAttribute(\"value\", \"attention\");\n        BadgeNotification\
    \ badge = new BadgeNotification(badgeXml);\n        BadgeUpdateManager.CreateBadgeUpdaterForApplication().Update(badge);\n\
    );\n```\n\n```\nprivate void ClearBadgeUpdates()(\n    BadgeUpdateManager.CreateBadgeUpdaterForApplication().Clear();\n\
    );\n```"
