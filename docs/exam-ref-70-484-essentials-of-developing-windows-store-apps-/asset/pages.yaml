    # Objective 3.2: Implement layout controls


    The layout of a Windows Store app is an important feature that designers and developers
    should pay attention to. Unlike other platforms, Windows 8 screens can range from
    small handheld tablets to large wall-mounted displays. Expect Windows Store apps
    to smoothly handle multiple screen sizes and orientations and use the available
    area on the. Microsoft provides developers with layout controls that help with
    the arrangement of content in a scale-free way as well as adapting to multiple
    view states and orientations.


    A Windows Store app consists of a root UI element (called Frame) that represents
    the area occupied by the application on a Windows 8 PC or device. The Frame acts
    as a container of the content in the app and supports navigation in multiple pages.
    Each page is represented by the Page element. A Page consists of a set of controls
    that provide the layout you decide to implement. Layout controls such as Canvas,
    Grid, WrapGrid, VariableSizedWrapGrid, and StackPanel make it very easy for developers
    to position content within their apps.


    The Grid provides a flexible yet powerful way of arranging UI elements in a page
    of a Windows Store app. It helps with the layout of controls in multiple rows
    and columns, and provides many ways to control their height and width. Using a
    grid in a page is similar to using <table> elements in an HTML page to arrange
    items in rows and columns. You can use a mix of fixed and proportional dimensions
    for rows and columns in a grid, allowing your app to adjust to variations in the
    screen size, resolution, and view states.'
