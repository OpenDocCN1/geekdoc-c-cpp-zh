  md: "The code in Listing 4-17 shows a page in a Windows Store app configured to\
    \ handle the Tapped, RightTapped, Holding, CrossSliding, and Dragging events of\
    \ the GestureRecognizer class.\n\n# LISTING 4-17 Handling events raised by the\
    \ GestureRecognizer class\n\n```\nusing Windows.UI.Input;\nusing Windows.UI.Xaml.Controls;\n\
    using Windows.UI.Xaml.Input;\n\npublic sealed partial class GestureSamplePage\
    \ : LayoutAware\n{\n    public GestureSamplePage(Windows.UI.Xaml.Shapes.Rectangle\
    \ target, Windows.UI.Xaml.UIElement parent)\n    {\n        this.InitializeComponent();\n\
    \n        // Configure gesture recognizer\n        GestureRecognizer gestureRecognizer\
    \ = new GestureRecognizer();\n        gestureRecognizer.GestureSettings = GestureSettings.HoldWithMouse\
    \ |\n        gestureRecognizer.Settings.RightTap |= \n        gestureRecognizer.Settings.Tap\
    \ |= \n        gestureRecognizer.Settings.CrossSliding | GestureSettings.Drag;\n\
    \        // Register event handlers for gesture\n        gestureRecognizer.Holding\
    \ += OnHolding;\n        gestureRecognizer.RightTapped += OnRightTapped;\n   \
    \     gestureRecognizer.Tapped += OnTapped;\n        gestureRecognizer.CrossSliding\
    \ += OnCrossSliding;\n        gestureRecognizer.Dragging += OnDragging;\n    }\n\
    }\n```\n\nIn each of these event handlers, you can find out the input\n// by checking\
    \ the PointerDevice type of the event arguments.\n// This event is raised for\
