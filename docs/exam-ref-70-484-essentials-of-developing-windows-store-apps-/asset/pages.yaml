    When a Windows Store app declares the contact picker extension is activated by
    another Windows Store app, an instance of the ContactPickerUI class is available
    through the ContactPickerActivatedEvents argument as a property. The ContactPickerUI
    object represents the section that lists the contacts the user wants to select
