    instead. Place commands you expect to be used frequently toward the edges of the
    app bar.


    +   - To display lists of data, use the GridView, ListView, and FlipView controls.
    These controls have built-in touch support and should be used based on the type
    of data to be displayed.


    +   - Data templates provide flexibility with data controls in displaying data
    without the detailed knowledge of the underlying data model. The DataTemplateSelector
    class applies templates selectively.


    +   - Styles and control templates can be used to customize the visual appearance
    of controls. Gradients are helpful in drawing the attention of users towards certain
    actions.


    +   - The VisualStateManager class can be used with VisualStateGroups element
    in XAML to define various states a control can exist. The GoToState method can
    be used to change between various states.


    +   - You can create resource dictionaries and use them in your app to customize
    the appearance of various controls. With one or more resource dictionaries can
    be used to provide a consistent look and feel in your app.'
