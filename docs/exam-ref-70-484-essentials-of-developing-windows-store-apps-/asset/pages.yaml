    You can use the ControlTemplate to define the visual structure of a button. The
    default template of a control specifies the visual behavior of the control, that
    is, the appearance of the control in various states. For example, a button can
    be in the PointerOver, Pressed, Disabled, Unfocused, and PointerFocused states.
    A visual state is represented by the VisualState class; thus, a ControlTemplate
    contains a number of VisualState objects, representing a visual state. A VisualState
    contains a StoryBoard animation that changes the appearance of elements in the
    ControlTemplate. The StoryBoard of a VisualState begins when the control enters
    the state specified by the Name property of the VisualState. One or more VisualState
    objects belong to a VisualStateGroup, and one or more VisualStateGroup objects
    are added to the VisualStateManager.VisualGroups element, which is set at the
    root element of the ControlTemplate.


    # Implementing gradients


    The controls provided by Windows and used in Windows Store apps have a Background
    or Fill property to create a solid color. This gives the UI a flat look. In some
    cases, you might want to add a soft gradient in the controls to improve the user
    experience of your app. For example you add a three-dimensional look to or all
    the buttons in a page. It is possible to use bitmap images to achieve this; however,
    there are advantages of using gradients:


    +   - Animations are supported by gradients. Therefore, you can change a gradient
    for a certain user action; for example, when you press a button with a gradient
    as the background.

    - A gradient is not prone to loss of quality with scale because it is used on
    vector graphics, unlike an image.

    - Gradients use hardware acceleration when it is available.

    - The size of your application is less because you do not have to embed bitmap
    images for the background.


    Thus, gradients provide better performance than images. However, carefully consider
    the use of gradients can be distracting when used often on a page. It''s better
    to use a gradient to highlight a particular control, which draws the attention
    of the user.


    You can define gradients in the XAML for a control and use them for setting the
    value of the Background or Fill property of the control. The XAML in Listing 3-23
    shows a LinearGradientBrush defined as a resource for the page and later used
    in a Rectangle control.'
