    \ exception\n}\n}\n```\n\n# Roaming application data\n\nIn Windows Store apps,\
    \ data created by the app or by the user while interacting with the apps needs\
    \ to be available on all the devices where the app is installed. Windows provides\
    \ support for synchronizing this data across multiple devices of the user without\
    \ the need of building an online data synchronization service. Windows provides\
    \ a roaming application data store that is synchronized across all devices. If\
    \ your app relies on a critical setting that is roamed, you can receive a notification\
    \ of changes to this data by creating an event handler for the DataChanged event\
    \ of the ApplicationData class and refreshing the data in your app. You can signal\
    \ a change to the data stored in the roaming store by invoking the SignalDataChanged\
    \ method of the ApplicationData class.\n\nThe roaming data store makes it easy\
    \ for developers to implement synchronization of important data across all user's\
    \ devices, the system does not guarantee that this data is synchronized instantaneously.\
    \ When the user is offline or on an unreliable Internet connection, synchronization\
    \ of roaming data can be delayed. Windows provides a setting that can be configured\
    \ with a key of HighPriority and set the value so it is not larger than 8 kilobytes\
    \ (KB). You can add a composite setting with that key so that more than one setting\
    \ is available across all devices.\n\nWindows limits the amount of data that can\
    \ be stored in the roaming data store by an app. This is to ensure synchronization\
    \ is quick and does not fail unless there is a loss of Internet connectivity.\
    \ After a Windows Store app reaches the limit on the amount of data that can be\
    \ stored in the roaming data store, synchronization of data is halted until the\
    \ total size of the roaming data is less than the limit. Therefore, you should\
    \ use the roaming application data store to store user preferences and small files.\
    \ Only using the RoamingStorageQuota property of the ApplicationData class to\
    \ obtain the maximum size of data that can be synchronized to the cloud from the\
    \ roaming data store.\n\nThe system preserves the roaming data of an app for a\
    \ specific period of time. If the user does not launch the app or reinstalls the\
    \ app within this period of time, the data is preserved. If the user reinstalls\
    \ the app within this period, the roaming data is synchronized from the cloud.\
    \ This period is set to 30 days by the system."
