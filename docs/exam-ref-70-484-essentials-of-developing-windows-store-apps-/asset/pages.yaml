  md: '# Capturing gesture library events


    Touch is a primary mode of interaction with Windows and Windows Store apps. Modern
    PCs and devices feature a touch screen, and users find it comfortable to use touch
    gestures for interactions. Therefore, supporting touch interactions in your app
    is likely to greatly enhance the user experience. Traditional input modes such
    as mouse, keyboard, and stylus are fully supported and functionally consistent
    with the user experience.


    The built-in controls provided by Windows are optimized for touch interactions
    while providing consistent interaction experience with other input modes. Touch
    gestures such as press and hold, tap, slide, swipe, pinch, stretch, and tilt;
    and direct manipulations such as pan, zoom, rotate, and drag are provided by these
    built-in controls. Windows 8 provides the Pointer class in the Windows.UI.XamlInput
    namespace for representing low-level input devices such as mouse, stylus, and
    touch contact. Pointer events are the lowest-level events raised by these devices.
    Gestures are events representing action as press and hold, whereas manipulation
    events are higher-level events representing swipe, rotate, and pinch to zoom.
    These events are managed by the UElement class, and the gesture recognizer.


    # MORE INFO TOUCH INTERACTION DESIGN


    You can read more about touch interaction design at http://msdn.microsoft.com/en-US/library/windows/apps/xaml/ih465425.


    To effectively use events managed by the gesture recognizer of UElement, you should
    understand the role of the Pointer class and its associated classes:


    +   * Pointer This class represents a single, unique input contact from an input
    device such as a mouse, stylus, or single/multiple fingers; in other words, a
    coordinate on the screen. This class is defined in the Windows.UI.Xaml.Input namespace.


    +   * PointerDevice This class is used to obtain low-level properties of the hardware
    attached to a device. This class is defined in the Windows.Devices.Input namespace.


    +   * PointerPoint This class represents a single contact area and provides its
    extended information. This class is defined in the Windows.UI.Input namespace.


    +   * PointerProperties This class represents extended properties of the PointerClass
    such as the bounding rectangle of the contact area from touch input, and the pressure
    exerted by a pointer device. This class is defined in the Windows.UI.Input namespaces.


    The Pointer class exposes four properties: PointerId, PointerDeviceType, IsRange,
    and IsInContact. In most cases, you will use the PointerId (a uint data type)
    to obtain the unique identifier for the input contact. It is useful when you need
    to detect and track multiple fingers on the screen, for example. The PointerDevice
    property with the same information available in the PointerDevice class. The Pointer
    class provides basic properties for the input device, for example, it provides
    the IsInContact property, which is used to determine'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'whether the input device is pressed down on the screen. The PointerPointProperties
    class provides extended properties for the input device; it provides the IsInRange
    property, which indicates whether the input device is in close proximity to the
    screen or digitizer.


    The PointerDevice class provides details of the hardware that are connected to
    the device and its low-level properties. You can get a list of all the PointerDevices
    connected to the system with the GetPointerDevices method. Alternatively, you
    can obtain information about a specific PointerDevice attached to the system with
    the GetPointerDevice method provided by the input pointer ID for the specific
    Pointer. The MaxContacts property is useful for determining the maximum of simultaneous
    pointers supported by the device (for example, MaxContacts is 1 for a mouse and
    5 for touch screens). The PointerDeviceType has one of three values: Touch, Mouse,
    or Pen.


    The PointerClass provides the GetCurrentPoint static method that is useful for
    determining the CurrentPoint for a specific pointer ID. The GetIntermediatePoints
    method retrieves a collection of PointerObjects for a Pointer as the input device
    moves around the screen. This is used for high-resolution input devices such as
    touch screens and digitizers. The PointerClass has the following properties:


    +   - **Position** The location of the pointer input in coordinates.

    - **RawPosition** The raw location of the pointer input as reported by the input
    device in client coordinates. Input prediction can be used to compensate for hardware
    latency and set the value of the location of the pointer in the Position property
    correctly. For example, while reading a news article, you want to click a link,
    but your fingers may not hit the link precisely. In such cases, the system will
    set the correct value of the location of the pointer input in the Position property
    while providing the original value in the RawPosition property.

    - **IsInContact** Boolean flag that indicates whether the input device is pressed
    down on the screen.

    - **Properties** An instance of the PointerPointProperties class with extra information
    about the input pointer.

    - **PointerDevice** An instance of the PointerDevice class containing information
    about the device associated with the input device.

    - **PointerId** The unique identifier for the pointer.


    The PointerPointProperties class, which is available through the Properties property
    of the PointerClass, provides detailed information about input devices. Some properties
    of this class are specific to a stylus, whereas others are relevant for the mouse,
    attached to the device. Some of the important properties of this class are:


    +   - **IsInRange** Indicates whether the pointer device is in close proximity
    to a sensor in the device or digitizer. Set to True if it is within the detection
    range.

    - **IsPrimary** Indicates whether the input is from the primary pointer. This
    property is useful when multiple input devices are attached to the device; for
    example, a mouse attached to a touch-enabled PC.'
