  md: "# Implementing the IValueConverter interface\n\nThink of data binding as the\
    \ glue that binds the source of data to a target. In some cases, there is a need\
    \ to control the connection between the source and the target (for example, when\
    \ the value of a data member crosses a threshold, the control bound to the data\
    \ member can show a different color). Although it seems that the connection between\
    \ the source and the data is very rigid, there is a way to control this connection.\n\
    \nWinRT APIs provide the IValueConverter interface that, when implemented in a\
    \ class, enables the Convert of data between the source and the target. The IValueConverter\
    \ interface defines two methods that must be implemented in a converter class:\n\
    \n+   * Convert This method is called before the data from the source is passed\
    \ to the target for displaying it in the user interface.\n* ConvertBack This method\
    \ is called before the data from the UI is passed to the bindings for storage\
    \ or updates. This method is called only in TwoWay data bindings.\n\nUsing the\
    \ ConverterParameter XAML binding property for a converter, you can provide a\
    \ parameter for both the Convert and ConvertBack methods. This parameter is useful\
    \ when the conversion requires an additional value such as the format of a date\
    \ for the target or a value such as a threshold to compare with the source.\n\n\
    Listing 5-21 shows a converter class that converts a DateTime object to a value\
    \ displayed in the user interface.\n\n**5-21** Using a converter class to implement\
    \ the IValueConverter interface\n\n```\npublic class BirthDateFormatter : IValueConverter\n\
    {\n    // This method converts the date of birth of the user to\n    // a format\
    \ specified by the ConverterParameter in XAML.\n    public object Convert(object\
    \ value, Type targetType,\n                          object parameter, string\
    \ language)\n    {\n        // Retrieve the format string and use it to format\
    \ the value.\n        string formatString = parameter as string;\n        if (!string.IsNullOrEmpty(formatString))\n\
    \        {\n            return new CultureInfo(language).Format(formatString,\
    \ value);\n        }\n        // If the format string is null or empty, simply\
    \ call ToString()\n        // on the value.\n        return value.ToString();\n\
    \    }\n\n    // Implementing one-way binding, no need to implement this method\n\
    \    public object ConvertBack(object value, Type targetType,\n              \
    \                object parameter, string language)\n    {\n        throw new\
    \ NotImplementedException();\n    }\nn\n```"
  merge: -1
