  md: 'The pointer events namespace that PointerRoutedEventArgs object (defined in
    the Windows.Xaml.Input namespace) provides information about the pointer that
    raised the event (through the Pointer property). You can retrieve the PointerPoint
    object for the event by using the GetIntermediatePoints method. The GetIntermediatePoints
    method provides a collection of PointerPoint objects that represent the history
    of pointer from the last pointer event to the current pointer event. If you handle
    a pointer event for a UElement and do not expect it to be passed to its parents,
    you should set the Handled property of the PointerRoutedEventArgs object to True.


    # Gesture events


    The set of pointer events in UElement can be used to implement actions in Windows
    Store apps using the pointer input. However, to detect gestures in a Windows Store
    app, you might need to implement complex logic in the pointer event handlers.
    In addition, there is a chance that your implementation for detecting gesture
    is inconsistent with other apps.


    Windows has a gesture recognizer that abstracts low-level pointer events and raises
    high-level events when it recognizes them after users finish their interaction
    with the device. For example, when the user taps a UElement, PointerPressed and
    PointerReleased are raised in quick succession. Windows provides a Tapped event
    when the user taps a UElement; you should use this instead of implementing your
    own logic through pointer events. The GestureRecognizer class provides the following
    gesture events:


    +   * Tapped This event is raised for the user taps the screen.

    * RightTapped This event is raised for the user right-taps an item in the screen;
    this is the press and hold gesture for selecting an item.

    * Holding This event is raised when the user presses and holds an item in the
    screen while in the process of moving it or selecting it. Note that this event
    is fired twice: once when the holding starts, and once when the holding ends.

    * CrossSliding This event is raised when the user swipes on a UElement in a direction
    perpendicular to the scroll direction.

    * Dragging This event is raised when the user is sliding or swiping on a UElement.


    The events raised by the GestureRecognizer class contain an argument which has
    a PointerType property that indicates if the input device is a touch device, stylus,
    or mouse. It also contains the current location of the pointer contact in the
    Position property of the argument.


    > MORE INFO HANDLING GESTURERECOGNIZER EVENTS


    To handle events raised by the gesture recognizer, you should set the Settings
    property of the GestureRecognizer object to one or a combination of values provided
    by the Gesture-Settings enumeration (object whose members of this enumeration
    is listed here: http://microsoft.com/en-us/library/windows/apps/windows.ui.input.gesturessettings.aspx).'
