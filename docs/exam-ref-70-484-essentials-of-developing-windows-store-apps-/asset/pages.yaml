    \ }\n        set\n        {\n            if (_userName != value)\n           \
    \ {\n                _userName = value;\n                // Call NotifyChanged\
    \ when the source property\n                // is updated.\n                PropertyChanged(\"\
    UserNameBrush\");\n            }\n        }\n    }\n\n    // NotifyChanged will\
    \ raise the PropertyChanged event,\n    // passing the source property\n    private\
