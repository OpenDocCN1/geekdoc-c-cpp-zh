  md: 'Table 1-1 lists members for ActivationKind enumeration.


    # TABLE 1-1 ActivationKind enumeration members


    | MEMBER | VALUE | DESCRIPTION |

    |---|---|---|

    | Launch | 0 | The user launched the app or tapped a content tile. |

    | Search | 1 | The user is about to search with the app. |

    | ShareTarget | 2 | The app is activated as a target for share operations. |

    | File | 3 | An app launched a whose file type the current app is registered to
    handle. |

    | Protocol | 4 | An app launched a URL whose protocol the current app is registered
    to handle. |

    | FileOpenPicker | 5 | The user wants to pick files that are provided by the app.
    |

    | FileSavePicker | 6 | The user wants to save a file and selected the app as the
    location. |

    | CachedFileUpdater | 7 | The user wants to save a file that the app provides
    content management. |

    | ContactPicker | 8 | The user wants to pick contacts using the app. |

    | Device | 9 | The app handles AutoPlay. |

    | PrintTaskSettings | 10 | The app handles print tasks. |

    | CameraSettings | 11 | The app captures photos or videos from an attached camera.
    |


    > * Source: Adapted from http://msdn.microsoft.com/en-au/library/windows/apps/windows.applicationmodel.activation.activationkind


    When an app is activated, the PreviousExecutionState property is Running, the
    application failed to save its application data successfully and the app should
    start as if it launched for the first time. In the Launched event handler of your
    application, you can check the PreviousExecutionState property of the LaunchActivatedEventArgs
    parameter. The value of the PreviousExecutionState property is a member of the
    ApplicationExecutionState enumeration as listed in Table 1-2.


    # TABLE 1-2 ExecutionState enumeration members


    | MEMBER | VALUE | DESCRIPTION |

    |---|---|---|

    | NotRunning | 0 | The app is not running. |

    | Running | 1 | The app is running. |

    | Suspended | 2 | The app is suspended. |

    | Terminated | 3 | The app was terminated after being suspended. |

    | ClosedByUser | 4 | The app was closed by the user. |


