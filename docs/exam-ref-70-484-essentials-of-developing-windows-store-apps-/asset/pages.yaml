    FIGURE 1-3 Creating a user control with Visual Studio


    When you add a new user control to your project, a XAML file is added to your
    project along with a C# code-behind file. The visual representation of the user
    control is defined in the XAML, and the code-behind file is used to implement
    the functionality of the control.


    A custom control is a reusable UI component you can use in multiple Windows Store
    projects. You can style and retemplate a custom control as needed, and pack it
    into its own assembly that can be distributed as a NuGet package, for example.
    Using custom controls enables the flexibility to create a new visual element with
    custom code that implements various features of the element. Custom controls are
    derived from either core controls such as Button or control primitives such as
    Control and Panel.


    In Visual Studio, you can add a custom control to your project using the Templated
    Control item template in the Add New Item dialog. This will create an XAML file—generic.xaml—and
    a class file. The XAML file contains the default styles and templates for your
    custom control. The location of Generic.xaml is important because the XAML framework
    loads your custom control automatically.


    You implement your control logic in the class file. You must set the DefaultStyleKey
    to the Type of your control in the constructor of the class; this tells the framework
    which style and template to apply to this Type when it is used in your application.
    A custom control is used in a way similar to how you use a user control: You declare
    a namespace and put it in the XAML wherever you need it.


