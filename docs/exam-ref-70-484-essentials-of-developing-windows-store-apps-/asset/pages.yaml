  md: '# Thought experiment

    Applying the MVVM pattern to a Windows Store app


    In this thought experiment, apply what you’ve learned about this objective. You
    can find answers to these questions in the “Answers” section at the end of this
    chapter.


    You have been handed over a set of requirements and code of a Windows Store app
    used as a prototype for a client demonstration. The prototype has a fully functional
    set of classes that work with the remote web service provided by the client. Branding
    of the app is also available and implemented in the prototype.


    How can you apply the MVVM pattern to develop an app based on the prototype while
    reusing code that is already developed and tested?


    # Objective summary


    +   - A loosely coupled design for a Windows Store app can be prepared with the
    MVVM pattern.


    +   - The view contains UI elements, the view model contains presentation logic,
    and the model contains business logic and is responsible for moving data to and
    from the store.


    +   - When designing an application, try to place as much code as possible in
    the business logic properly implemented in the model class and often in a repository
    class.


    +   - The viewmodel should contain the presentation logic and be designed based
    on the model. Its design should not be influenced by the view and UI requirements.


    # Objective review


    Answer the following questions to test your knowledge of the information in this
    objective. You can find the answers to these questions and explanations of why
    each answer choice is correct or incorrect in the “Answers” section at the end
    of this chapter.


    +   1. You are designing your Windows Store app with the MVVM design pattern.
    In the data access layer, you use an XML file to store and retrieve data. To maximize
    reuse of code across Windows Store, WPF, and Silverlight applications, how should
    you implement data access layer in your application?


    +   A. Implement the logic to read the XML file when the page loads and display
    data from the XML file.


    +   B. Create a viewmodel and populate its properties from the XML file in your
    constructor. Data-bind the viewmodel to the page.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '+   C. Create a helper class to read the XML file. Use this file to populate
    the data model. Data-bind the viewmodel with the page.


    +   D. Implement the logic to read the XML file when the page loads and populate
    the viewmodel. After the data is loaded, data-bind the viewmodel with the page.


    +   2. You are creating an application that enables the user to review data in
    a database and save changes to a separate file, but not to save changes to the
    database. What is the correct way to implement this requirement?


    +   A. Set the Mode property of binding to OneTime.


    +   B. Set the Mode property of binding to OneWay.


    +   C. Set the Mode property of binding to TwoWay.


    +   D. Create a new command to save the changes.


    +   3. You are developing an application in which a collection of objects is returned
    by a web service when the user carries out a search. You need to bind a GridView
    control with the results from the web service. How should you set the data source
    of the GridView so that when the UI is updated, the result from the search is
    returned?


    +   A. Enumerate the members of the collection of objects from the search result.
    Add these members to a list and set the DataContext of the GridView to this list.


    +   B. Create a CollectionSource and set its source to the collection returned
    by the web service. Set the ItemsSource property of the GridView to the CollectionView.


    +   C. Set the ItemsSource property of the GridView to the collection returned
    by the web service.


    +   D. Create a custom control and data-bind the custom control with the collection
    returned by the web service.


    # Objective 1.4: Design and implement Process Lifetime Management (PLM)


    One of the key features of Windows Store apps are their fast and fluid behavior.
    The user has the ability to switch between multiple Windows Store apps. At any
    time, the focus is on a single application that occupies the full screen. (Apps
    in a snapped state are considered to be in the foreground.) A Store app is running
    only when it is visible on the screen. All other times, it is suspended or not
    running. It is the application''s responsibility to preserve its state, as the
    scroll position in a page, when it is suspended and use this information when
    it is resumed. Process Lifetime Management (PLM) is the mechanism of managing
    the state of Windows Store apps.'
