    You can use the ItemsSource property of the ItemsControl to set a collection of
    data as the data source for the control. The collection is an instance of a class
    that implements the IEnumerable interface. Note that you can use either the Items
    property or the ItemsSource property only. If you use the ItemsSource property,
    you cannot modify the collection using the Items property. When you bind a control
    to a object in the code-behind, there is no need to specify a value for the Path
    property. A simple example of an ItemsControl used to display a list of persons
    is in the following XAML code:


    ```

    <ItemsControl x:Name="PersonsList" ItemsSource="{Binding}"/>

