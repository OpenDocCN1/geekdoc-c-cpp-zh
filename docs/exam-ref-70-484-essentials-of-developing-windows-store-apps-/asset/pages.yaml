  md: "# Choosing an appropriate tile update schedule based on app requirements\n\n\
    Windows Store apps can deliver local notifications through live tiles and badges\
    \ when they are running. Push notifications enable remote servers to communicate\
    \ with Windows Store apps and update their tiles and badges. Both options are\
    \ powerful and are often adequate to meet your app's requirements. Sometimes,\
    \ your app might need to update its tile at a specific time or regularly poll\
    \ a remote URL for data that can be delivered to the user through a tile or badge\
    \ update.\n\nA Windows Store app can display up to five notifications in a cycle.\
    \ The default behavior of a live tile on the Start screen is to display a single\
    \ notification until the next notification arrives when the tile's contents are\
    \ updated. Windows provides the option to enable a notification queue that can\
    \ maintain up to five notifications, and the tile cycles until they expire. The\
    \ notification queue can cycle tiles locally from the app via push notifications,\
    \ via a schedule, or periodically.\n\nThe amount of each notification in the queue\
    \ displayed and the order in which it appears on the tile is determined by the\
    \ system. When the queue reaches its capacity of five notifications, the new notification\
    \ replaces the oldest one in the queue. You can control this by specifying a tag\
    \ with the notification delivered. Windows examines the tag on a new notification,\
    \ looks for a notification in the queue with a matching tag, and if one is found,\
    \ replaces that notification in the queue. If no notification with the tag is\
    \ found, it uses the first-in,first-out (FIFO) rule to replace notifications with\
    \ new ones. It is easy to enable the notification queue and use it in your app,\
    \ as follows:\n\n```\npublic void SendLocalTileNotification()\n{\n    // The following\
    \ code is an addition to the code\n    // shown previously for creating and updating\
    \ tiles.\n\n    TileNotification notification = new TileNotification(wideImageAndTextXml);\n\
    tileNotification.Tag = \"FirstTile\";\n\n    // Enable notification queue\n  \
    \  TileUpdater.CreateTileUpdaterForApplication().EnableNotificationQueue();\n\n\
    \    // Send the local tile notification\n    TileUpdater.CreateTileUpdaterForApplication().Update(tileNotification);\n\
    }\n```\n\nPeriodic notifications in Windows Store apps update tiles and badges\
    \ at a fixed interval by downloading content from a remote server or a cloud service.\
    \ You need the following to set up periodic notifications in an app:\n\n+   -\
    \ A URI of a cloud service that provides the content of a notification as correctly\
    \ formatted XML of the tile to be shown.\n- The frequency at which the URI should\
    \ be polled and the tile or badge updated with new content."
  merge: -1
  pgno: 265
- img_proc: true
  md: "■ Optionally, you can specify the time at which the periodic updates will commence.\n\
    You do not specify this value, the updates will begin immediately.\n\nPeriodic\
    \ updates can be used to deliver content among a large number of users without\
    \ a\nsificant investment in the infrastructure. The StartPeriodicUpdate method\
    \ is provided with\na URI and a time interval specified by the PeriodicUpdateRecurrence,\
    \ which has\nthe following members:\n\n+   ■ HalfHour Poll the URI every 30 minutes.\n\
    ■ Hour Poll the URI every hour.\n■ SixHours Poll the URI every 6 hours.\n■ TwelveHours\
    \ Poll the URI every 12 hours.\n■ Daily Poll the URI once per day.\n\nThe StartPeriodicUpdate\
    \ method is available for both the TileUpdater and BadgeUpdater\n, deliver updates\
    \ for tiles and badges, respectively. The content returned from\nthe URI should\
    \ contain both wide and square versions of the tile. The following code shows\n\
    how periodic updates are created for tiles (the same approach can be used for\
    \ badges):\n\n```\nprivate void StartPeriodicUpdatesForUri(Uri uriToPoll)\n{\n\
    \    // Code removed for brevity\n\n    // Poll every hour\n    PeriodicUpdateRecurrence\
    \ recurrence = PeriodicUpdateRecurrence.Hour;\n\n    // Start the periodic updates\n\
    \    TileUpdater.CreateTileUpdaterForApplication().StartPeriodicUpdate(\n    \
    \    uriToPoll, recurrence);\n}\n```\n\nWhen used with the notification queue,\
    \ you can provide an array of up to five URIs,\nfor each notification. The content\
    \ from each URI should contain the expiration time for\nthe notification and a\
    \ unique tag, which is a string of up to 16 characters. The StartPe-\niodicUpdateBatch\
    \ method is available in the TileUpdater class for updating the tile of an app\\\
    sand is used as follows:\n\n```\nprivate void StartPeriodicUpdatesForUri(IEnumerable<Uri>\
    \ uriToPoll)\n{\n    // Code removed for brevity\n\n    // Poll every hour\n \
    \   PeriodicUpdateRecurrence recurrence = PeriodicUpdateRecurrence.SixHours;\n\
    \n    // Enable notification queue\n    TileUpdater.CreateTileUpdaterForApplication().EnableNotificationQueue(true);\n\
    \n    // Send the local tile notification\n    TileUpdater.CreateTileUpdaterForApplication().StartPeriodicUpdateBatch(\n\
    \        uriToPoll, recurrence);\n}\n```"
