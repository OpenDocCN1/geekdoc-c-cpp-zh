  md: '# Chapter summary


    +   - WinRT APIs provide developers with local, roaming, and temporary data stores
    for data storage and manipulation. In addition, when configured with the appropriate
    capabilities and declarations, apps can access files and folders on users'' devices.

    - Windows Azure can be used to store files as documents and as well as structured,
    nonrelational data tables. Windows Azure Mobile Services provides a simple way
    to integrate Azure storage in Windows Store apps.

    - The HttpClient can be used to retrieve data from remote servers. Common HTTP
    verbs are used in these requests to perform operations such as create, restore,
    update, and delete resources on the remote server.

    - Windows Store apps use WebSockets to exchange short messages and stream large
    messages with a server that supports WebSockets.

    - WinRT APIs provide a data binding framework that is used to data-bind UI elements
    with their data source. Most controls support data binding with item controls
    providing support for binding with collections.

    - Value converters are used to modify the data exchanged between the source and
    the target to modify the data format.

    - Dependency properties are used in custom controls for data binding with data
    sources.

    - The NotifyErrorInfo interface can be used to implement input validation in a
    data entity class.

    - The CollectionViewSource class provides a view for a data source that can be
    bound with item controls such as the ListView and GridView. Data in the view can
    be sorted, filtered, and grouped with LINQ.

    - Windows Store apps use identity providers to authenticate users based on their
    claims. User role provides the authorization required to access various resources
    and carry out actions.

    - The PasswordVault class can be used to secure a user''s credentials and have
    them available across multiple devices where the user is logged on with the same
    Microsoft account.

    - The Windows.Security.Authentication.Web namespace provides developers with APIs
    to implement authentication via OpenID and OAuth identity providers.

    - The WebAuthenticationBroker class can be used to implement OAuth2 authentication
    along with SSO in Windows Store apps.'
  merge: -1
