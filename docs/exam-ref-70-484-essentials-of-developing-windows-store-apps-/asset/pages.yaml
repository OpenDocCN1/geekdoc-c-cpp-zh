  md: "When a Windows Store app needs to call the periodic updates for the tile or\
    \ badge the updater, it should call the StopPeriodicUpdate method (available in\
    \ both the TileUpdater and BadgeUpdater classes).\n\nWindows Store apps that use\
    \ live tiles update users with information leading to a future event by scheduling\
    \ tile notifications in advance. Scheduled tile notifications are similar to local\
    \ notifications that are created by an app which can be specified with a precise\
    \ time when they should update the tile. The content for the future event is specified.\
    \ Your app can schedule up to 4,096 notifications in advance. Scheduled notifications\
    \ do not expire by default; however, it is a good practice to set their expiration\
    \ time using the ExpirationTime property of the ScheduledTileNotification class.\
    \ The code in Listing 4-9 shows how to create a scheduled notification and cancel\
    \ it.\n\n# LISTING 4-9 Creating and cancelling a scheduled notification\n\n```\n\
    // Create a new scheduled notification\nprivate void CreateScheduledNotificationForEvent(string\
    \ eventName)\n{\n    // Prepare notification\n    // Code removed for brevity\n\
    \n    // Schedule tile update three hours from now\n    DateTime dateTime = DateTime.Now.AddHours(3);\n\
    \n    // Create a scheduled tile update and assign a unique ID\n    ScheduledTileNotification\
    \ notification = new ScheduledTileNotification(\n        tileContent, dateTime);\n\
    \    notification.Id = eventName;\n\n    // Schedule the notification\n    TileUpdater.CreateTileUpdaterForApplication().AddToSchedule(notification);\n\
    }\n\n// Remove a scheduled notification from the schedule\nprivate void RemoveScheduledNotificationForEvent(string\
    \ eventName)\n{\n    TileUpdater updater = TileUpdater.CreateTileUpdaterForApplication();\n\
    \    var scheduledNotifications = updater.GetScheduledTileNotifications();\n \
    \   for (int i = 0; i < scheduledNotifications.Length; i++)\n    {\n        if\
    \ (scheduledNotifications[i].Id == eventName)\n        {\n            updater.RemoveFromSchedule(scheduledNotifications[i]);\n\
    \        }\n    }\n}\n```"
