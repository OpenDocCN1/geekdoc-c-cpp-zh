  md: '# Storing and retrieving data from a remote location


    Application data of a Windows Store app is removed whenever it is uninstalled
    by the user. Therefore, your app should not use the application data store for
    storing valuable and irreplaceable information. This includes the roaming store,
    which is also removed after a period of time when the user removes the app from
    all his devices. A web service or remote data store can be one of the following:


    +   - The user''s SkyDrive account

    - Windows Azure blob storage

    - Windows Azure Mobile Services

    - Any other service that provides an API or your own application that stores data
    from the Windows Store app


    When you use file pickers in your application, users are given the option to open
    files from their SkyDrive account and select a location in SkyDrive to save files
    with your application. The files accessed by your app and saved in the user''s
    SkyDrive account are not deleted after the app is removed.


    # MORE INFO SKYDRIVE API AND SOFTWARE DEVELOPMENT KIT (SDK)


    You can read more about the SkyDrive API at http://msn.microsoft.com/en-us/library/live/hh826521.
    Learn how to receive the Live Connect APIs at http://msn.microsoft.com/en-us/library/live/hh826523.aspx.
    Download the sample Windows 8 application published by the Microsoft Live Services
    at https://github.com/liveservices/LiveSDK/tree/master/Samples/Windows8/XAML.


    Windows app developers can use Windows Azure to build their own data storage and
    retrieval service. Windows Azure provides blob storage for apps to store files
    of any type and size. Blob storage can be programmatically accessed using classes
    in the Microsoft.WindowsAzure.Storage namespace.


    # MORE INFO WINDOWS AZURE BLOB STORAGE


    A walkthrough of how you can create, download, and delete blobs is available at
    http://www.windowsazure.com/en-us/develop/net/how-to-guides/blob-storage/


    Windows Azure supports storage and manipulation of structured nonrelational data
    with its table storage service. If your app needs to store large amounts of structured
    data, you should consider using Windows Azure table. A table consists of one or
    more entities represent a row in a relational database, that does not enforce
    a schema on'
