  md: "# Objective summary\n\n+   - A well-planned data access strategy implemented\
    \ in a Windows Store app helps with the overall quality and usability of the app.\n\
    - Windows Store apps use local and roaming application data stores for storing\
    \ settings and the temporary data store for caching files.\n- WinRT provides APIs\
    \ for creating and accessing files on the users' devices and their OneDrive accounts.\
    \ Windows Store apps can use folder and pickers to select the location where files\
    \ can be stored and accessed.\n- A set of capabilities and declaration must be\
    \ configured in the package manifest for an application to access the folders\
    \ in the user's device.\n- Windows Azure provides blob storage for various types\
    \ of files and table storage for structured, nonrelational data. Windows Store\
    \ apps can use Windows Azure APIs to store data in the cloud storage.\n- Windows\
    \ Azure Mobile Services can be used to easily integrate table storage, notifications,\
