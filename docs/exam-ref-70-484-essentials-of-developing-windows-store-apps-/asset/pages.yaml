  md: "The LoadState method for your search results page is invoked with the search\
    \ query string passed through navigation arguments in the OnSearchActivated method\
    \ or the QuerySubmitted event. You should initialize the search, and query your\
    \ web service or local data source within this event.\n\nAfter you have the search\
    \ results, cache them until the user carries out the search again. At that point,\
    \ process the results to set up the filters and the data collection that binds\
    \ with the data control in the page, as shown in Listing 2-10.\n\n# LISTING 2-10\
    \ Setting up filters and the data collection for search results\n\n```\n// Populates\
    \ the page with content passed during navigation.\nprotected override void LoadState(object\
    \ navigationParameter, Dictionary<string, object> pageState)\n{\n var queryString\
    \ = navigationParameter as string;\n List<SearchSearchResult> SearchCollection\
    \ = new List<SearchSearchResult>();\n\n // Carry out the search using your web\
    \ service or local data source and populate\n this.SearchResult;\n\n // Prepare\
    \ filters based on the categories in the search result.\n var filters = new List<Filter>();\n\
    \ filters.Add(new Filter(\"All\", this.SearchResultCollection.Count(item =>\n\
    item.Category == \"Recipes\", false))); // Default\n filters.Add(new Filter(\"\
    Items\", this.SearchResultCollection.Count(item =>\nitem.Category == \"Items\"\
    , false)));\n\n this.DefaultViewModel[\"QueryText\"] = \"\\u201c\" + queryString\
    \ + \"\\u201c\";\n this.DefaultViewModel[\"Filters\"] = filters;\n\n // Prepare\
    \ the results for the \"All\" filter\n this.DefaultViewModel[\"Results\"] = this.SearchResultCollection.Select(item\
    \ =>\n{\n SearchResultItem = new\n Image = item.ImageUri,\n Title = item.Title,\n\
    \ Description = item.Description\n}).ToList();\n}\n```\n\nThe result of a search\
    \ carried out with a Windows Store app is shown in Figure 2-19."
