    # Chapter summary


    +   * Live tiles and badges in a Windows Store app helps with the popularity of
    the application. Live tiles can be updated regularly by your app or by using push
    notifications to deliver fresh content.


    +   * Secondary tiles enable users to launch your app for a specific purpose;
    they can be enhanced by live tile updates, making them very attractive and useful.


    +   * Badges provide a summary of new items available or the status from an app.
