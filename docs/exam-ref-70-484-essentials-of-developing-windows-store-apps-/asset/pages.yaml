  md: 'The Windows.UI.Input namespace provides inking support for Windows Store apps.
    It provides the infrastructure for managing data structures while an app is using
    the stylus of a device for tasks such as drawing or handwriting recognition.


    The InkStroke represents a single ink stroke, the fundamental unit represented
    on the screen when the stylus is in touch with the digitizer and the user is drawing
    on the screen. The InkStringBuilder class is used to build ink strokes from the
    raw input of a stylus. It provides methods such as BeginStroke, CreateStroke,
    AppendToStroke, and EndStroke to create InkStroke objects from the user''s actions
    with the stylus. The InkContainer class provides support for input, processing,
    and manipulation of one or more InkStroke objects.


    Inking in Windows supports handwriting recognition through the InkRecognizer class.
    The InkRecognitionResult class provides properties and manage one or more InkStroke
    objects used for handwriting recognition. The GetStrokes method of the InkRecognitionResult
    retrieves the stroke collection for handwriting recognition; the GetTextCandidates
    method retrieves the potential matches for each word returned by handwriting recognition.


    TheManager class provides the core features for inking support in Windows Store
    apps that are used for obtaining input from the digitizer and their manipulation
    and processing. It also provides methods for handwriting recognition. Some methods
    that are important for inking support in Windows Store apps are:


    +   - AddStroke: This method adds one or more InkStroke objects to a collection
    managed by InkManager.

    - DeleteSelected: This method deletes a selected InkStroke from a collection managed
    by the InkManager.

    - MoveSelected: This method moves one or selected ink strokes in a bounding rectangle
    to a new position.

    - ProcessPointerUp and ProcessPointerDown: These methods process information about
    the position and features of the contact point of the stylus with the digitizer,
    as pressure and tilt when the stylus is taken up after an initial contact and
    when the stylus is placed on the digitizer, respectively.

    - SaveAsync: This method is used to asynchronously save all InkStroke objects
    managed by the InkManager in a specified stream.

    - LoadAsync: This method is used to asynchronously load all InkStroke objects
    from a specified stream to a collection of InkStroke objects by the InkManager.


    TheManager class has an important property called Mode. The value of this property
    determines whether the InkManager is doing the following:


    +   - Appending InkStroke objects to its collection

    - Checking for InkStroke objects to be removed from its collection or an InkStrokeContainer

    - Checking whether all points are being selected for the creation of a polyline'
