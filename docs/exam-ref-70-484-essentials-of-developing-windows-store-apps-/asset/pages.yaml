  md: '# Thought experiment

    Using notifications in a board game


    In this thought experiment, apply what you’ve learned about this objective. You
    can find answers to these questions in the “Answers” section at the end of this
    chapter.


    You have developed a Windows Store app that enables users to select a board game
    and play with opponents they can invite from their list of contacts or via email.
    What are three ways to use notifications and tile updates in your app to make
    it compelling for the user to buy a game and play it?


    # Objective summary


    +   - A Windows Store app can use tiles and badges to communicate with the user
    when the app is not running. Live tiles encourage users to launch your app and
    interact with it.

    - You can enable users to create shortcuts to specific pages within your app using
    secondary tiles. Secondary tiles help users bookmark their favorite content or
    experience from your app on the Start screen.

    - Live tiles can be updated locally by app when it is running by periodically
    polling one or more remote URIs for tile content, via a scheduled update, or push
    notifications. Updates deliver fresh content to the tiles.

    - Badges provide a number or a glyph on the tile when a status or a summary of
    items need to be displayed. When used with live tiles, badges provide the user
    with a concise picture of various events or updates your app is receiving.

    - Badges and text of tiles can be shown in the lock screen of the user’s device
    to allow your app to access the lock screen. Your app needs to be configured with
    at least one background task declared in the manifest.

    - Tiles and badges be updated periodically by polling a remote server or a cloud
    service. Periodic updates are useful for delivering updates to a large number
    of users without significant investment in the infrastructure.

    - You can schedule an update to be delivered in the future when the content for
    the date is known. This helps when the user needs to be informed of an event date
    and time.

    - A Windows Store app can display up to five notifications in a cycle if the notifications
    contain a unique tag. Notifications can use this feature to continuously deliver
    fresh content that is displayed in a cycle by Windows.'
