  md: '# Thought experiment

    Supporting themes in a Windows Store app


    In this thought experiment, apply what you''ve learned about this objective. You
    can find answers to these questions in the "Answers" section at the end of this
    chapter.


    You have developed an app used for educating children in primary school. The app
    has received one good feedback as well as feature requests.


    One feature request is to enable users to choose a theme based on a movie, fable,
    or fairy tale. You decide to enhance your app and implement support for themes.
    Which Windows 8 features will you use to implement the feature request?


    # Objective summary


    +   - Windows provides styles and templates for customizing the visual appearance
    and behavior of controls. They can be reused across multiple pages in an application.
    Windows Studio can be used to edit a copy of the style or template of a control.


    +   - In some applications, a gradient applied to a control can draw the attention
    of the user for a particular task. Gradients have a number of advantages over
    images, mainly in performance and scaling to multiple screen resolutions.


    +   - The visual states of a control are managed with the VisualStateManager class.
    Visual-StateGroups are used to define the states in which a control can exist.
    The GoToMethod of the VisualStateManager can be used to change between different
    states of a control based on events of the control.


    +   - Resource dictionaries can be used to define sets of styles and templates.
    Dictionaries can then be included in the application. ThemedDictionaries are used
    to define themes that can be selected based on user preferences.


