  md: '# Choosing between style patterns for different views


    The usability of a well-designed Windows Store app does not vary between view
    states although the layout can change between the various states. You can implement
    your app’s UI layout based on view states, window dimensions (that is, the size
    of your app), a combination of view states and window dimensions, or none of them.
    The presentation of content in your app depends on the type of content as well
    as your app’s usage pattern. For example, for an app that displays news articles,
    users might want to use portrait and landscape modes, where laptop or desktop
    users will use only landscape orientation.


    When a device is in landscape orientation, the available area in the vertical
    direction is limited. The elements should be laid out in the horizontal direction.
    When the device is in portrait orientation, the available area in the horizontal
    direction is limited and the layout of UI elements is horizontally constrained.


    The design of the UI of your app in the snapped and fill views requires special
    attention. In well-designed applications, the UI in the snapped adapts to a vertical
    layout with vertical arrangement of content. Although the fill view state provides
    a fair amount of window size, important content should appear on the left side
    of the window to ensure that it is visible.


    A Windows Store app with well-designed snapped and fill views as well as for the
    portrait orientation is likely to be used with other apps. For example, a tourist
    visit to a distant city might open the Maps app and the Weather app and use them
    together. Porting all the view states in such apps allows users to regularly use
    them, thereby increasing the usability of these states.


    You can use the VSM, along with the application view states, styles, and control
    templates, to build Windows Store apps with adaptive layouts. The VSM defines
    groups that consist of mutually exclusive states and, optionally, transitions
    between states. The states are mutually exclusive the VSM allows only one state
    to be visible at a time. The GetState method of the VisualStateManager initiates
    the transition between states. The VSM or the system does not expect you to write
    code that updates the layout and controls of the UI. This helps decouple the details
    of the UI and controls in a state and the state itself.


    Visual Studio provides developers with Windows Store app templates that include
    support for using the VSM with an adaptive layout. An example of an app built
    with the Grid App template showing various states, as shown in Figure 3-4.'
