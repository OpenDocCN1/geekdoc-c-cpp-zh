    \ enumeration values.\n- The value converter, if the data used in the binding\
    \ needs to be formatted or modified before it is presented in the UI. A value\
    \ converter is specified by setting the Converter property of the FrameworkElement\
    \ to an instance of a class that implements the IValueConverter interface.\n\n\
    ![](img/81d79ceb6883e2d24731f821954f3393_43_0.png)\n\n**FIGURE 1-6** Data binding\
    \ between source and target\n\nThe BindingMode enumeration describes how the data\
    \ propagates in a binding. Its members are OneWay, OneTime, and TwoWay. In a TwoWay\
    \ binding, changes to the target propagate to the source, except if the binding\
    \ target is the Text property of a FrameworkElement. In such a case, the change\
    \ is propagated only when the TextBox loses focus. In OneWay binding, the target\
    \ is updated when data is available in the binding source and changes are propagated\
    \ to the target. In OneTime binding, the target is updated only once when the\
    \ binding is created.\n\nListing 1-1 shows how to set up binding in XAML and set\
    \ up the DataContext property for the target in the code-behind file.\n\n# LISTING\
