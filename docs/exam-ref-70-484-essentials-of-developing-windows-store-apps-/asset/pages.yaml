    # Consuming SOAP/WCF services


    WCF is a framework for developing web services that can be located in the Internet
    or within an intranet. WCF services use SOAP to exchange messages usually formatted
    in XML over HTTP or Transmission Control Protocol (TCP) with their interface described
    in a Web Services Description Language (WSDL) file. Windows Store apps can send
    asynchronous requests over HTTP to WCF service endpoints.


    Visual Studio makes it simple to consume WCF services in Windows Store apps. You
    can right-click your app, select Add Service Reference from the menu, and add
    the location of the WCF service, as shown in Figure 5-4.


