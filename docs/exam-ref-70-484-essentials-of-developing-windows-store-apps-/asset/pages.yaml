  md: '# Chapter summary


    +   - Any Windows Store app can be used in a variety of devices with different
    screen sizes and resolutions. You should develop your app so that it renders well
    on all screens. Based on your app''s core features, you can restrict the orientations
    supported in the app by selecting a specific orientation in the package manifest.


