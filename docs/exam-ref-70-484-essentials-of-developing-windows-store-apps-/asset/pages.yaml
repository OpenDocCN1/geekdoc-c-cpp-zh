  md: '# The ListView control


    The ListView control is often used to display a list of data that can be scrolled
    or panned vertically. This control shares the same base class as the GridView
    control: ListViewBase. Other than their constructors, the GridView and ListView
    controls do not extend the features of the ListViewBase class. Items in the ListView
    control are arranged similarly to the GridView control except that the default
    direction of scrolling is vertical.


    A good example of the ListView control used in app layouts is the full screen
    portrait and snapped view states of a Windows Store app. Visual Studio''s Grid
    App template uses a GridView control for fill and full screen landscape view states,
    and a ListView control for the other view states. Figure 3-25 shows an app in
