  md: '+   - Mode This property is used to specify the direction of the data flow
    in the binding. The value of the property is set to one of the members of the
    BindingMode enumeration.


    Setting up the data binding in the UI of a Windows Store app requires the details
    of the data source as well as the direction of the flow of data. In some UI elements,
    you expect the data to be presented as a read-only value; in other elements, you
    expect the user to interact with the data and update it. The direction of data
    flow in binding is specified with the BindingMode enumeration, which has the following
    members:


    +   - OneWay In this mode, the target property is set with the value from the
    source when the source changes. This is the default value for the property of
    a Binding object.


    +   - OneTime In this mode, the target property is set with the value from the
    source when the binding is created. The target property is not updated after the
    binding is created.


    +   - TwoWay In this mode, the target property is set with the value from the
    source when the binding is created. Data binding updates the target or the source
    when either the source or target updates.


    The XAML code in Listing 5-19 shows the Text property of a TextBlock control set
    to the FirstName of a binding object in the OneWay binding mode. It also shows
    the Foreground property set to the UserName of a Binding object with the mode
    set to OneTime.


    LISTING 5-19 Using the default OneWay and OneTime binding modes


    ```

    <TextBlock x:Name="TextBlock" Text="Binding FirstName" Foreground="Binding UserNameBrush,
    Mode=OneTime"/>

    ```


    An important concept in data binding is data context. If the data is set as the
    context of a UI element, all its children inherit the context. In Listing 5-19,
    the Binding object is set in the code-behind through the data context. The data
    context of a FrameworkElement is specified using an object of the type DataContext.
    The children and descendants of the FrameworkElement inherit the value of the
    DataContext. For example, in a grid with a number of controls, their DataContext
    property is set to the data context of the grid. Setting a value in the DataContext
    is particularly useful when a collection of objects needs to be bound.


    Changes in the source of a data-bound are propagated to the target if the direction
    of data flow is either OneWay or TwoWay. For the changes in the source to propagate
    to the target, the source must implement the INotifyPropertyChanged interface.
    INotifyPropertyChanged interface has a single event: PropertyChanged. This event
    is raised by the source to notify targets that the value of the property has changed.
    Listing 5-20 shows a sample implementation of the INotifyPropertyChanged interface.'
