    # Objective 3.4: Design and implement data presentation


    Windows Store apps follow the Microsoft design style and use the basic set of
    controls to provide a consistent user experience. Similarities among apps are
    seen in the layout of controls, presentation of content, and patterns of interaction
    through gestures and commands. This helps users to rapidly adopt the user experience
    of these applications. Whenever there is a list of data that needs to be displayed
    along with navigation to the details of each item, controls play an important
    role.'
