    # # Validating user input


    Data entered by the user through the UI of a Windows Store app requires validation
    before its current value is updated. Data binding does not carry out the validation
    on behalf of the user. As a developer, you should implement user input validation
    of the data entered by the user. The `INotifyDataErrorInfo` interface is used
    to implement synchronous and asynchronous validation support in data classes.


    In the class, validation is carried when the value of a property is being set.
    If there is an error in validating the input data, the property name is used with
    the `ErrorsChanged` event to notify the target about the error, and it is up to
    the target to display them correctly to the user. The data framework uses the
    `GetErrors` method to obtain a list of errors encountered during the validation
    for a specific property or the entire entity. The `HasErrors` property indicates
