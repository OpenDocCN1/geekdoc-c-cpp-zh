    The HttpClient class provides the Timeout property, which can be used to set a
    timeout on the outgoing HTTP request, the default being 100 seconds. An instance
    of HttpClient can cancel pending requests with the CancelPendingRequests method,
    and the same instance can still create and send new HTTP requests. The GetAsync,
    DeleteAsync, PostAsync, PutAsync, and SendAsync methods can be provided with a
    CancellationToken that enables calling objects to receive a notification if an
    HTTP request is canceled.


