    The ContactField class used to represent members in a ContactInformation object
    consists of the following properties:


    +   * Category The category specified by the ContactFieldCategory enumeration
    that belongs to


    +   * Name The name of the field


    +   * Type The type of data data specified by the ContactField enumeration


    +   * Value The value of the field


    A ContactField object must contain a string value and a value for the Type property
    from the enumeration ContactFieldType, at minimum. The Type property specifies
    whether the data in the ContactField object is a phone number, email address,
    location, or something else. Optionally, a ContactField object can contain a value
    in the Category property to distinguish between home, work, mobile, or other data.


    # Filtering contacts to display


    In your Windows Store app, you might need the email addresses of the contacts
    you select for a feature. When you invoke the PickSingleContactAsync or the PickMultipleContactsAsync
    method using the ContactPicker, the default behavior is to show the contact as
    a complete entity. You can set the SelectionMode property of the ContactPicker
    to one of the values of the ContactSelectionMode enumeration. Table 2-1 describes
    the SelectionMode enumeration members.


    TABLE 2-1: ContactSelectionMode enumeration members


    | MEMBER | VALUE | DESCRIPTION |

    | Contacts | 0 | Specifies that the user wants to select the entire contact. This
    is the default behavior. |

    | Fields | 1 | Specifies that the user wants to select only certain fields. |


    To filter the contacts you want to display, you need to set the SelectionMode
    property to populate SelectionMode.Fields (property of the ContactPicker class)
    to members of the KnownContact class. If you add only one field to the DesiredFields
    array, a contact will be considered a match if it has that field. If you add multiple
    fields to the DesiredFields array, a contact is considered a match if it has any
    of the fields. The KnownContact class has the following properties:


    +   * Email The name of the field used for email addresses


    +   * InstantMessage Contains the name of the field used for instant messaging
    accounts


    +   * Location Contains the name of the field used for the contact''s location


    +   * PhoneNumber Contains the name of the field used for phone numbers'
