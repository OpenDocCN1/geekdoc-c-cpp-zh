    # Objective 3.5: Create and manage XAML styles and templates


    In a Windows Store app, the UI is built with standard controls, and a set of custom
    and user controls is also used whenever necessary. XAML is used to declare various
    controls and define their properties in a page. To customize the look and feel
    of the controls in a page, the properties of various controls are set to meet
    the app''s requirements. This approach of composing a UI is powerful because it
    separates the UI from the underlying data model.


    In a complex UI with a large number of controls, customizing the look and feel
    of each control becomes very tedious. In such scenarios, you want to define a
    set of styles that enable you to set the values of properties of an element itself.
    This approach is similar to using Cascading Sheets (CSS) to customize HTML elements
    in webpages. In Windows, the visual representation of a control is completely
    decoupled from its code. A control''s template defines the look and feel of the
    control, so in a Windows Store app, styles and templates are used to customize
    the appearance of controls.


    This objective covers how to:


    +   - Implement and extend styles and templates.

    - Implement gradients.

    - Modify styles based on event and property triggers.

    - Create shared resources and themes.'
