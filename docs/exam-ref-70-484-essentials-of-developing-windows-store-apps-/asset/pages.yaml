  md: '# # Introduction


    The Microsoft 70-484 certification exam tests your knowledge of designing and
    develop- Windows Store apps. Readers are assumed to be experienced Microsoft Windows-based
    application developers, including two or more years creating and modifying touch-enabled
    interfaces.


    The exam expects you to be familiar with the high-level concepts required to build
    such apps, including C# and the Microsoft Visual Studio 2012 environment. Therefore,
    this book adopts a high-level approach to teaching application design, and provides
    numerous code samples that illustrate concepts without step-by-step details of
    building a Windows Store app in Visual Studio. You should be able to design and
    build Windows Store apps on your own, while using this book to study for the exam.


    Success on the 70-484 exam will prove your knowledge and experience in designing
    and developing Windows Store apps using Microsoft technologies. This exam guide
    reviews the concepts described in the exam objectives, as:


    +   * Designing Windows Store apps

    * Developing Windows Store apps

    * Creating the user interface

    * Programming the user interaction

    * Managing security and data


    This book covers every exam objective, but it does not cover every exam question.
    Only the Microsoft exam team has access to the exam questions themselves and Microsoft
    regu adds new questions to the exam, making it impossible to cover specific questions.
    You should consider this book a supplement to your relevant real-world experience
    and other study materials. If you encounter a topic in this book that do not feel
    completely comfortable with, use the links you''ll find in text to find more information
    and take the time to research and study the topic. Great information is available
    on MSDN, TechNet, and in blogs and forums.


    # # Microsoft certifications


    Microsoft certifications distinguish you by proving your command of a broad set
    of skills and experience with current Microsoft products and technologies. The
    exams and corresponding certifications are developed to validate your mastery
    of critical competencies as you design and develop, or implement and support,
    solutions with Microsoft products and technologies'
