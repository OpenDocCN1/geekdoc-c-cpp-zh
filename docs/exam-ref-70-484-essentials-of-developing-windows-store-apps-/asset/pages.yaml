    FIGURE 3-1 Some view states and orientations of a Windows Store app


    The minimum width of a Windows Store app in full screen landscape and full screen-portrait
    modes is related to the minimum resolution of 1024 × 768, which all apps must
    support. Microsoft recommends 1366 × 768 as the optimum resolution that designers
    and developers should target.


    Windows 8 enables users to use two apps simultaneously in the screen when their
    device is in snapped orientation. An app can be in the snapped view state if the
    horizontal resolution of the screen is at least 1366 pixels. The minimum horizontal
    resolution of an app is 1024 pixels, and the width of a snapped view is 320 pixels,
    or the width of the splitter separating the two apps is 22 pixels. If the horizontal
    resolution of the screen is less than 1366 pixels, only one app can be displayed
    at a time.


    Width specifications for various view states are in logical pixels. Therefore,
    an app in the snapped state will look different on screens with the same display
    resolution but different physical sizes. You can test your application in the
    Windows Simulator for various screen sizes and resolutions, which are shown in
    Figure 3-2.'
