    You have the option to support all formats represented by the StandardDataFormats
    class in your app a share target. If all the formats are in the content being
    shared, it is recommended you process the format most relevant for the sharing
    operation. For example, if your app shares images and receives content that contains
    the image and URI of the location of the images, your app should process the image.


    In some cases you may choose to define a custom format and use it to share content
    from your app. For example if your app is movie browsers, users choose to share
    the title, rating, director, and cast of movie. Because the data to be shared
    is more specific than the standard formats supported, you could support one of
    the many schemas at http://www.schema.org and prepare the data package accordingly.
    If you cannot find a schema at Schema.org, consider using a format ID as Windows8-Preview-<schema>.
    In your app, you can collect information about the content to be shared, package
    the content in the JavaScript Object Notation (JSON) format, and use SetData to
    add the content to the DataPackage. In the SetData method, the schema name is
    used as the key for the JSON data being shared. The target application uses the
    schema name to extract the JSON data.


    If your app share and supports one or more custom formats, you could add a data
    format that identifies the format supported by your app''s manifest. In the package
    manifest, use Windows-Preview-<schema> as the data format, where <schema> is the
    name of the schema your app supports. If you cannot find a schema at Schema.org
    you can create your own custom format. In this case, you should choose a name
    and use it in both the source and target app as well considering publishing the
    format so that other developers can benefit from it.


    In some Windows Store apps, preparing data when sharing content with other apps
    can take significant time. For example, if your app takes images before sharing
    them with the target app, the resizing operation can take a significant amount
    of time before the data is ready for sharing. You should use the SetDataProvider
    method of the DataPackage class with a format from the StandardData class and
    a DataProviderHandler that puts the SetData method when invoked.


    When your app receives data as a share target, a read-only version of the DataPackage
    called DataPackageView is used. The DataPackageView object has a property called
    AvailableFormats that is a read-only list of all the formats that the DataPackageView
    contains. Alternatively, you can see whether a specific format is present in the
    DataPackageView object by using the Contains method with the format ID from the
    StandardData class. The Contains method returns True if the format is present
    in the shared content; otherwise it returns False.'
