    your app with the users.


    +   * Toast notifications deliver transient messages to the user, even when your
    app is not running. Toast notifications can be configured for the duration in
    which they are visible and the sound played when they arrive.


    +   * Windows Runtime provides a combination of low-level pointer events and higher-level
    gesture and manipulation events that can be used in Windows Store apps.


    +   * Inking and handwriting support is available for Windows Store apps.


    +   * Microsoft provides design guidelines for implementing a great navigation
    experience in Windows Store apps. Windows Store project templates provided by
    Visual Studio have built-in hierarchical navigation.


    +   * Navigation events can be used to implement features that help with the user
