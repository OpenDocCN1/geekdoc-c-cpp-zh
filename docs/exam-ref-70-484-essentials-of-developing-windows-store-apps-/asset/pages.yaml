  md: '# Objective 5.4: Thought experiment


    WinRT APIs support credential storage, credential roaming, and claims-based authentication.
    The CredentialPicker and PasswordVault classes can be used along with claims-based
    authentication to implement these:


    +   - Use the CredentialPicker class for a consistent user experience Because
    employees of an organization can use the app on a desktop PC or a handheld device,
    it is important that a consistent user experience is considered for retrieving
    the users'' credentials. The CredentialPicker class should be used to show the
    dialog box in which users can enter their credentials.

    - Support multiple sources of credentials Users need their smart cards to provide
    their credentials for accessing specific resources, and the CredentialPicker class
    can be used for this feature. When a removable device is available in the device,
    the CredentialPicker class shows a list of options available for obtaining the
    credentials including the smart card.

    - Consider using claims-based authentication If the infrastructure enables identity
    provider to be available, the app should consider using claims-based authentication
    for the user wherever possible. Users can be authorized for a set of roles based
    on their claims available through a token issued by the identity provider. These
    roles can be used to grant user access to resources and sections of the intranet.


    # Objective 5.4: Review


    +   1. Correct answer: C

    - A. Incorrect: If users often access your app, requesting their credentials results
    in a poor user experience. In addition, incorporating a custom dialog box in a
    Windows Store app does not provide a consistent experience with other apps.

    - B. Incorrect: Although the roaming data is restricted for access and tampering,
    it is not a good option when security and data synchronization are considered.
    Roaming might stop if the quota for the roaming storage available for the app
    exceeds the limit.

    - C. Correct: The CredentialPicker class provides a consistent user experience
    for retrieving a user''s credentials when compared with other apps. The PasswordVault
    class can be used to save the user credentials and have them roamed.

    - D. Incorrect: The temporary app data store can be cleared at any time by the
    system, so credentials saved in the temporary store can be deleted.'
  merge: -1
  pgno: 418
- img_proc: true
  md: '2. Correct answers: C, D, E


    +   A. **Incorrect:** A custom control with a dialog box used for entering credentials
    does not provide consistent user experience compared with other apps. Custom controls
    are created for readability across apps.


    +   B. **Incorrect:** Using a Settings pane accessible via the Settings charm
    is not the correct way to obtain the user''s credentials. The Settings charm should
    be used with default values for most settings, but it is not the case for logging
    on the user. The Settings charm can be used for providing a link to log off the
    user.


    +   C. **Correct:** The *CredentialPicker* class provides a consistent user experience
    for retrieving the credentials of the user. Users can opt for their credentials
    to be saved.


    +   D. **Correct:** The *PasswordVault* class provides a secure way of storing
    a user''s credentials and having them roam across multiple devices.


    +   E. **Correct:** The Settings charm can be used for actions that require minimal
    user interaction, such as clicking a button. The user can log off of the app through
    a button placed in the Settings charm.


    3. Correct answers: C, D, E


    +   A. **Incorrect:** Users probably not provide their Facebook account credentials
    for your app because they might not trust your app to use their credentials properly.
    Therefore, the app should not request their Facebook credentials.


    +   B. **Incorrect:** The *PasswordVault* class should be used to save the credentials
    of the user


    +   C. **Correct:** A token obtained from an online identity provider identifies
    the user and provides the rules. The app does not have to authorize the user separately
    to obtain these roles.


    +   D. **Correct:** Moderating forum posts requires users to belong to a specific
    role. By examining the roles of the user, the app should be able to grant the
    user access to various features.


    +   E. **Correct:** The Settings charm should be used to provide an option for
    the user to revoke access to the app.


    # Objective 5.5: Thought experiment


    WinRT APIs help easily incorporate authentication with online identity providers
    through APIs in the *Windows.Security.Authentication.Web* namespace. Several features
    of the app can be enhanced with these APIs:


    +   **Improve the authentication experience** The *WebAuthenticationBroker* class
    can be used with an online identity provider to authenticate users in your app.
    The dialog box presented for authentication provides a consistent user experience
    among other Windows Store apps.'
  merge: -1
  pgno: 419
- img_proc: true
  md: '+   Request the correct set of permissions from the remote service Your app
    can request a set of permissions in the scope during the authentication process.
    These permissions are attached to the access token obtained at the end of authentication
    process. Your app can use these permissions to access the remote service and post
    on behalf of the user.


    +   Implement SSO in your app WebAuthenticationBroker can be used to implement
    SSO if the remote identity provider supports SSO. With SSO, users do not need
    to authenticate your app every time they use various devices. This improves the
    authentication experience of your app.


    # Objective 5.5: Review


    +   1. Correct answers: B, C, D


    +   A. Incorrect: Users might never enter their user names and passwords from
    third-party sites into an app''s custom dialog box to lack of trust and the fear
    of having their credentials compromised.


    +   B. Correct: Registration of a new app with a remote service provides your
    app with a client ID, secret key, and option to set the redirect URL.


    +   C. Correct: The URL used by the WebAuthenticationBroker class needs to contain
    the client ID, redirect URI, and in most cases the scope for the permissions requested.


    +   D. Correct: If the AuthenticateAsync is successful in authenticating the user,
    the response contains the access token. The app is expected to use the access
    token with all future requests.


    +   E. Incorrect: An app is expected to use well-defined APIs for accessing resources
    on the user''s behalf and carrying out actions as posting photos. These require
    an access token that is available only through authentication using OAuth2.


    +   2. Correct answer: B


    +   A. Incorrect: The WebAuthenticationBroker supports identity providers that
    implement the OAuth2 standard and are located on an intranet or the Internet.


    +   B. Correct: The WebAuthenticationBroker can be configured for SSO with OAuth2
    providers. SSO requires a redirect URL containing the app''s SID to be up with
    the identity provider.


    +   C. Incorrect: The WebAuthenticationBroker supports SSO for Windows Store apps.


    +   D. Incorrect: The WebAuthenticationBroker can only be used with URLs that
    support the https:// prefix.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '+   3. Correct answer: A


    +   A. Correct: The WebAuthenticationBroker class uses a custom URL that contains
    the SID of the app to ensure the access token contained in a cookie in the SSO
    app container belongs to the app.


    +   B. Incorrect: The SID of an application does not change with updates, so the
    user will be automatically signed in after the app has been updated.


    +   C. Incorrect: The WebAuthenticationBroker can be used only with URLs that
    support the https:// prefix.


    +   D. Incorrect: SSO enables users to log on to an app on a device and automatically
    log on to the same app on different devices, provided they are logged on to the
    device with the same Microsoft account.'
