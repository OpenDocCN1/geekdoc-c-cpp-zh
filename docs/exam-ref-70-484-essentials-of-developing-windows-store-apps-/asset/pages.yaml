  md: 'The NotRunning execution state of a Windows Store app is seen in the following
    scenarios:

    * After the app is installed from the Windows Store.

    * When the app is closed with the Task Manager when it is running.

    * After rebooting the device.

    * After logging off a user logging back on.

    * After the user closes through the closure gesture or Alt+F4 and activates within
    about 10 seconds of closing. Note that if the user closes the app and launches
    it after 10 seconds of closing, the system sets the execution state to ClosedByUser.


    The Suspended state of the app is seen when the app is activated by a secondary
    tile or using a contract or extension it is registered for Windows is suspending
    it or over Windows has suspended it.


    # EXAM TIP


    You are not expected to remember the various enumerations for the exam. However,
    you should be familiar with the values of properties commonly used for finding
    out the previous execution state, activation kind, and so on.


    > Thought experiment

    Enhancing a photo editor Windows Store app

    In this thought experiment, apply what you''ve learned about this objective. You
    can find answers to these questions in the "Answers" section at the end of this
    chapter.

    Your organization has developed a photo editor app as a prototype for obtaining
    feedback and exploring interest among users of other apps developed previously.
    The three most common problems reported by the users of the prototype app are
    listed below. Suggest a solution for each problem with the concepts you have learned
    in this chapter.

    1. Users have reported they cannot search for photos they have edited and saved
    previously.

    2. Users have reported that after bringing another app to the foreground, the
    prototype app lost all their changes in photos that were open and being edited.

