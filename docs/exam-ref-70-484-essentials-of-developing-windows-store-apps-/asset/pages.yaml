  md: 'The content region has a top margin of 7 units, or 140 pixels. The left margin
    is 6 units, or 120 pixels. there is a 2-unit, or 40-pixel, separation between
    the top of the content area and the baseline of the page header.


    Horizontal padding between content items varies with the type of item. Items with
    hard edges such as images and user tiles are separated from accompanying text
    by 2 subunits, hard-edged items are separated by 2 units, or 10 pixels of padding.
    Lists in columns are separated by 2 units, or 40 pixels of padding.


    The horizontal padding between groups of items is 4 units. Whitespace helps users
    distinguish between groups while panning or scrolling across many groups horizontally.


    Vertical padding between content items varies with the type of item. Tile and
    text lists have 1 unit, or 20 pixels, of vertical padding between items in a row.
    Hard-edged items placed in rows have 2 subunits, or 10 pixels, of padding between
    items in a row.


    # PAGE LAYOUT AND TYPOGRAPHY GUIDELINES


    Microsoft provides designers of Windows Store apps with page layout and typography
    guidelines. Page layout guidelines are available at http://msdn.microsoft.com/en-au/library/windows/apps/hh872191.aspx,
    and typography guidelines are available at http://msdn.microsoft.com/en-au/library/windows/apps/hh700394.aspx.


    Using a grid layout for app pages enables automatic scaling at different screen
