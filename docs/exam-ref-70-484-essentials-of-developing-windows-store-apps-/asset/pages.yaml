  md: '+   - Accessible visual experience Visually impaired users require sufficient
    contrast in the UI. You should use high-contrast themes to accommodate users.
    You should also consider colorbind users when using colors to convey information
    through the UI of your application. The Windows Store requires accessible UIs
    to have a minimum text contrast ratio of 4.5:1 against the background.


    Considering options for your users to select themes that suit their preferences,
    adjust the font size and control, and adjust the dots per inch (dpi) setting.
    You can also allow users to select alternative controls and turn off nonessential
    elements and animations. Keep in mind the Narrator, Magnifier, and Touch Keyboard
    accessibility features that enable users to interact more comfortably with apps.
    If you use a custom control in your app, you should provide basic accessibility
    information for the control. You need to ensure that the control is fully accessible
    by keyboard, and that the UI meets requirements for visual accessibility.


    The Microsoft Automation framework is an accessibility framework for Windows.
    It is integrated within the base classes and the built-in behavior of UI controls
    in Windows Store apps built with C#, C++, and Visual Basic. The Windows Store
    app is treated as a top-level UI by Automation, and all the content within the
    app window is reported and available to a UI Automation client. This enables Automation
    to obtain information about the UI and send input to controls. For example, UI
    Automation enables screen readers to provide information about the UI to the users,
    and enables users to manipulate the UI through ways other than standard input.


    Before you submit your app to the Windows Store, you should test your app for
    accessibility. A good test for keyboard accessibility is to disconnect the mouse
    from your PC and test your app with only the keyboard. You should be able to cycle
    through all UI elements using the Tab key. Composite UI elements should be navigable
    with the arrow keys. You should ensure that interactive UI elements can be invoked
    by pressing the Enter or Space key. You should also verify that your app uses
    the contrast ratio properly, and when a high-contrast theme is used, all the UI
    elements clearly visible. Users can make the brightness setting in PC Settings,
    Ease of Access. In such a case, you should ensure that all the controls are accessible,
    and there are no UI overlays.


    The screen reading of your application can be tested using Narrator. You can start
    Narrator while your app is running by pressing the Windows logo key and Enter
    button. Narrator automatically detects touch mode on devices that support more
    than four contacts. You can navigate through your UI using single finger gesture
    focus, a three-finger swipe to the right or left to navigate using Tab and Shift+Tab,
    and a three-finger swipe to read the contents of the windows. Narrator reads items
    under your finger, drag a single finger up and down and right.


    The Windows Software Development Kit (SDK) for Windows 8 provides accessibility
    tools such as Inspect and UI Accessibility Checker to test your app for accessibility.
    Inspect enables you to select any UI element and view the element''s accessibility
    data. Figure 1-1 shows the tool being used to check an element''s accessibility
    information.'
