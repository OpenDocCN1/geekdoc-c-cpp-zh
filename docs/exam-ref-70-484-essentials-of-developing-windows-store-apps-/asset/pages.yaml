    +   **Application data locations** Whenever an app is installed, the system creates
    the local, roaming, and temporary application stores and folders in these locations
    using the properties of the ApplicationData class. The methods provided by the
    StorageFolder object returned for the app''s folders can be used to work with
    folders and files. Alternatively, your app can access a file in its data folders
    using the ms-appdata:/// prefix in the URI and the GetFileFromApplicationUriAsync
    method of the Storagefile. The prefix of the LocalFolder URI is **ms-appdata://**,
    the prefix for the RoamingFolder URI is **ms-appdata://**, and the prefix for
    the TemporaryFolder URI is **ms-appdata:///temp**. Your app does not have access
    to the data folders for Windows Store apps.


    +   **Application install location** Your app can access its install location
    and obtain a StorageFolder object using the Windows.ApplicationModel.Package.Current.InstalledLocation
    property. It can access files and folders with methods and properties provided
    by the StorageFolder object. Alternatively, your app can access a file using the
    ms-app:/// prefix in the URI, which refers to the app''s install directory, and
    the GetFileFromApplicationUriAsync method of the Storagefile. The app''s install
    location provides read-only access to your app file picker cannot be used to access
    this location. In addition, your app cannot access the install location of other
    Windows Store apps.


    A Windows Store app can access folders and files on removable devices, such as
    a USB drive or a camera, using a file picker. If your app uses the AutoPlay extension,
    it can be launched whenever an external device is connected. An app is restricted
    to file types that are specified through the File Type association declaration
    in its package manifest.


    +   **DocumentsLibrary** This is used to access the Documents library in the user''s
    device. The app must be configured with the Documents Library capability in the
    package manifest.


    +   **PicturesLibrary** This is used to access the Pictures library in the user''s
    device. The app must be configured with the Pictures Library capability in the
    package manifest.


    +   **MusicLibrary** This is used to access the Music library in the user''s device.
    The app must be configured with the Music Library capability in the package manifest.


    +   **VideosLibrary** This is used to access the Videos library in the user''s
    device. The app must be configured with the Videos Library capability in the package
    manifest.


    +   **HomeGroup** This is used to access the HomeGroup folder on the user''s device.
