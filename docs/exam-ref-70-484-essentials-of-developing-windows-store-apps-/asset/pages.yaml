  md: '# Objective 4.1: Create and manage tiles


    When a Windows Store app is installed on a Windows 8 PC or device, a tile is created
    on the Start screen. An app''s tile is like an icon in a list of programs, but
    it is lot more powerful than a simple icon. A tile is useful for communicating
    with the user when the associated app is not visible on the screen. A tile can
    display the latest content from a news website, weather updates, or the latest
    stock prices. In addition, badges convey status information from apps (for example,
    whether a remote service is available or the number of unread news articles in
    a newsreader application). Notifications can be delivered through an app''s tile
    itself, or the app can add the notification to be delivered according to a schedule
    or periodically with an expiry date. Remote services can send push notifications
    to apps for communicating status and other data.


    This objective covers how:


    +   - Create and update tiles and contents.

    - Create and update badges using the TileUpdateManager class.

    - Respond to notification requests.

    - Choose an appropriate tile update schedule based on app requirements.


    # Creating and updating tiles and tile contents


    Every Windows Store app displays on the Start screen as a tile. This, which is
    a shortcut for launching the app, is known as the primary tile. The tile appears
    on the Start screen as soon as an app finishes installing. A sample of Windows
    Store apps and their tiles are shown in Figure 4-1.


    ![](img/81d79ceb6883e2d24731f821954f3393_247_0.png)


    FIGURE 4-1 Primary tiles of some Windows Store apps in the Windows 8 Start screen'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'Some of the tiles shown in Figure 4-1 are static; others display updates such
    as the Weather app. The default static tile in Visual Studio is a 150 × 150 pixel
    logo. In addition, you can create a 310 × 150 pixel logo for the wide static tile.
    A wider tile provides more area to display content. Users can select between the
    square tile and the wide tile of your application to be displayed on the Start
    screen if you specify a logo for the wide tile.


    # Working with primary tiles


    You set logos in the package manifest file of the app. Using Visual Studio, you
    specify the 150 × 150 pixel logo in the "Logo" section on the Application UI tab,
    and the 310 × 150 pixel logo in the "Wide logo" section. See Figure 4-2.


    ![](img/81d79ceb6883e2d24731f821954f3393_248_0.png)


    FIGURE 4-2 Visual Studio configuration for the logos of a Windows Store app


    The primary tile for your application defined in the package manifest is visible
    until it is updated through a tile notification. It changes back to its default
    specification when there is no notification to display. A notification expires
    after a period of time, after which it is no longer visible on the tile.'
