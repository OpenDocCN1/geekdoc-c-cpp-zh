    Button\"\nBasedOn=\"StaticResource AppBarButtonStyle\">\n  <Setter Property=\"\
    AutomationProperties.AutomationId\" Value=\"EditAppBarButton\"/>\n  <Setter Property=\"\
    AutomationProperties.Name\" Value=\"Edit\"/>\n  <Setter Property=\"Content\" Value=\"\
    &#xE104;\"/>\n</Style>\n```\n\nThe style of an app bar is designed to hold the\
