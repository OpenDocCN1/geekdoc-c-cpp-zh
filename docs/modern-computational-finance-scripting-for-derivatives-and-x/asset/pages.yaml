    # 25.2 MULTI-THREADING AND AAD


    Our code correctly templates active numbers so it is ready for AAD instrumentation.
    In fact, the code has been successfully tested with AAD.


    It is also thread-safe so simulations can be multi-threaded across simulations.
    Of course, each thread must use its own copy of the evaluator, since the evaluator''s
    state changes during simulations. But the evaluator (and its derived versions)
    is the only object that writes into its state during simulations. The rest of
    the scripting library is safe.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Closing Remarks


    # 229


    Of course, the model must be thread-safe itself. For instance, the simple implementation
    of Black-Scholes we used in part I, chapter 4 to test run our library is not thread-safe.
    We can still multi-thread simulations but each thread needs its own copy of the
    model.


    # 25.3 ADVANCED LSM OPTIMIZATIONS


    Finally, it was mentioned in part III, chapter 15 that the support for LSM could
    be massively optimized by the selective evaluation of the events that affect the
    regressed variable, directly or indirectly. In order to implement important optimization,
    a complete dependency graph of variables to other variables must be established.
    That may be conducted with a dedicated visitor that provides the list of all variables
    on which the regressed variable depends directly or not, including itself. Once
    we have that list, it is easy to evaluate only statements that write into variables
    and ignore the others. The performance impact may be very significant, literally
    from hours to less than a minute for CVAs.


    In addition, that dependency information may materially speed up AAD risk. AAD
    complexity is constant in the number of inputs, but linear in the number of outputs.
    Therefore we typically not compute risks for all variables in a script, but for
    one or a limited number of variables that we specify. There is no need to evaluate
    events that don''t affect those variables, directly or not, especially in the
    context of AAD where computations typically take four to eight times longer (see
    one of the numerous publications or lectures on AAD, such as Naumann).


    The dependency processor makes a significant difference in the performance of
    LSM and AAD. Its implementation is not covered in this book (just because we can''t
    cover everything). It has been implemented by Savine in Danske Bank''s award-winning
    systems (the In House System of the Year 2015 Risk award was awarded to Danske
    Bank for its CVA system, and received by Andreasen and Savine on behalf of the
    Bank).'
  merge: -1
  img_proc: true
