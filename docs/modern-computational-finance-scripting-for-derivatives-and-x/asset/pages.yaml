- pgno: 172
  md: "# Introduction\n\nWe have so far covered the valuation of scripted transactions.\
    \ In this section, we focus on risk sensitivities. These are traditionally computed\
    \ with finite differences by bumping model parameters one by one and repeating\
    \ valuation. Recently, the financial community widely adopted adjoint differentiation,\
    \ a much more efficient differentiation algorithm that computes derivatives of\
    \ some calculation analytically in one single sweep through the reverse sequence\
    \ of the calculations. The valuation code must be instrumented to use a custom\
    \ number type, which operators are overloaded so that all mathematical calculations\
    \ involved in the valuation are recorded on a tape, after all derivative sensitivities\
    \ are computed with a chain rule backwards through the tape. Hence, adjoint differentiation\
    \ or (AAD) computes any number of derivatives in constant time. AAD is discussed\
    \ in numerous textbooks, papers, and presentations, including Giles and Glassmann's\
    \ [14], who first introduced AAD technology to finance, Uwe Naumann's textbook\
    \ [24], and the first volume of these [27].\n\nAAD is not further investigated\
    \ in this section. In what follows, we focus on the differentiation of discontinuous\
    \ cash-flows, which is a problem both with finite differences and AAD, resolved\
    \ in the same manner in both cases. Whether derivative sensitivities are computed\
    \ with brute force differences or adjoint propagation, the differentiation of\
    \ discontinuous profiles combined with Monte-Carlo simulations produces unstable,\
    \ unreliable results. This is a well-known problem, and a number of solutions\
    \ were developed in the academy and the industry. The two main ones are the elegant\
