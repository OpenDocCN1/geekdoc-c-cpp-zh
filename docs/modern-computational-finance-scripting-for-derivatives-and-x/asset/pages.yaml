- pgno: 128
  md: '# Support for Vectors


    The improvements considered so far are high level in the sense that they consist
    essentially of the pre-treatment of the scripts with very little changes in them.
    We now look into an improvement that requires a deeper development: the support
    for vectors.


    # 11.1 BASIC FUNCTIONALITY


    Vectors simplify in a vast number of cases of practical relevance. Let us start
    with the example of an Asian option, which is an option on the average spot price
    across a number of fixings. We could write the script as follows:


    | 01Jun2020 | vAverage = spot() vN = 1 |

    |---|--- |

    | start: 01Jul2020 end: 01Jun2021 freq: 1m fixing: end | vAverage = vAverage +
    spot() vN = vN + 1 |

    | 01Jun2021 | opt pays CALL( vAverage / vN , STRIKE) |


    That script is somewhat low level. With vectors, we can write it in the clearer
    and more expressive (some would call it functional) form:


    | 01Jun2020 | append (vFixings, spot()) |

    |---|--- |

    | start: 01Jul2020 end: 1y freq: 1m fixing: end | append (vFixings, spot()) |

    | 01Jun2021 | opt pays CALL( average(vFixings) , STRIKE) |'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Let us discuss a basic implementation of vectors with only the function append
    that adds an entry to a vector, and some functions like average, maximum, minimum,
    and so on that take a vector as an argument and return a numerical result based
    on its size and entries.


    We need a new leaf node type for vectors, similar to the variable node, that holds
    the name of the vector and its index among all the vectors in the script. We also
    need nodes for the function append and the likes of average. We must add support
    for these functions in the parser. The parsing of these functions differs from
    the parsing of other functions in their argument is not an expression but a name
    and nothing else. We generally find that the support for functions and operators
    that return vectors is not useful and we do not implement it. Hence, a vector
    argument has to be named vector, and that name is the name of the vector, for
    which a vector node must be created as a child to the function node.


    At processing time, we must count and index vectors we do for variables. We may
    either the variable indexer or develop a similar dedicated indexer size of each
    vector so we can reserve their memory before simulations take place to ensure
    that no costly allocations occur during simulations.


    Finally, we need to develop support for vectors in the evaluator. We must extend
    the evaluator''s visitors to vector and vector functions nodes, but more fundamentally,
    we must extend the state of the evaluator to include vectors along with variables.
    Vectors live as a collection of pointers to STL vectors. These STL vectors have
    memory reserved for their maximum size before simulations take place. They are
    resized to 0 (but not de-allocated) before each simulation. The visitor to the
    vector node accesses the corresponding STL vector by a pointer that lives in the
    evaluator (just like we access the variables by pointer when we write into them—vectors
    are always accessed by reference, even for reading) so parent nodes know to find
    the target vector. The visitor to the append node makes a call to push_back()
    on the corresponding STL vector (accessed by its index), which increases its size
    but does not provide memory which was previously correctly reserved. The visitors
    to the likes of average read access from its state (size and entries), and push
    the result onto the stack.


    Just like variables, vectors live in the evaluator''s state and are accessed by
    their index, set by the indexer. The only difference is that the maximum size
    of vectors is also pre-computed and reserved at processing time.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 11.2 ADVANCED FUNCTIONALITY


    There is another use for vectors. Say we are scripting multiple European options
    in a single script. We could do that as follows:


    | STRIKE1 | 100 |

    | STRIKE2 | 120 |

    | STRIKE3 | 150 |

    | MATURITY | 01Jun2021 |

    | CALL | max(0, S-K) |


    | MATURITY | s = spot() |

    | opt1 pays CALL( s, STRIKE1) |

    | opt2 pays CALL( s, STRIKE2) |

    | opt3 pays CALL( s, STRIKE3) |


    Such scripts may end up a maintenance nightmare with more options, so, clearly,
    we would rather script this with vectors. The script would look like this:


    | NOPT | 3 |

    | MATURITY | s = spot()\nloop (ii, 1, NOPT)

    opt[ii] pays CALL( s, STRIKES[ii])\nendLoop |


    using the predefined vector STRIKES:


    | 100 |

    | 120 |

    | 150 |


    We used a few new features here:


    **Random** access to vector entries for writing and reading entries with the C/C++
    style [] operator counting from 0: *opt[ii]*. We must extend assignment and pays
    to write into vector entries just like variables. We also need a “vector entry”
    node type so vector entries may be'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'read as part of the expressions (again, same as variables). Note that we don''t
    need full-fledged random access, where the index could be itself a variable or
    an expression. Constant indices are good enough for us. That means that v[expression]
    or v[variable] is forbidden. Only v[constant] is allowed, which both simplifies
    implementation and reduces overhead at run time.


    Predefined vectors like STRIKES, similar to predefined schedules from chapter
    10.


    Loops in `loop` (ii, firstIndex, lastIndex) ... endLoop.` We may restrict support
    to constant startIndex and lastIndex. It is necessary to support nested loops.
    Note that ii is not a variable but a keyword that stands for the current index
    in the loop.


    Use of vectors to reference products, not only ancillary variables.


    The implementation of these functionalities requires work on various parts of
    the code, specifically new node types, support in the parser, processing, and
    evaluation.


    # 11.2.1 New node types


    We need nodes types for vector entries. These nodes must store the name and index
    of the vector and the index of the entry. Because of loops, the index of the entry
    (in `opt(ii)`) must be an argument and not just a number stored on the node. Vector
    entries are otherwise identical to vector functions `average, maximum`, and so
    on. Indeed, `v[ii]` is “syntactic sugar” for something like `entry(v, ii).`


    We also need node types for predefined vector entries. Contrary to predefined
    schedules, these cannot be resolved at parsing time because of loops. Predefined
    vector entries should store the predefined vector objects, preferably by reference,
    and refer to the index of the entry as an argument.


    Finally, we need a loop node type, which holds its inner statements as arguments,
    and stores its first and last index on the node. We also need a counter node for
    the counter ii.


    # 11.2.2 Support in the parser


    The parser needs to be extended so it correctly builds the new node types. These
    extensions are relatively straightforward. The parsing of loops is similar to
    the parsing of `if` statements. Hierarchically, the `loop` node sits along with
    `=`, pays, and if.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# 11.2.3 Processing


    The vector indexer must go through vector entry nodes to identify and list vectors
    and determine their maximum size. When vector entries are accessed in loops, the
    last index for the counter must be considered. This is not necessary for predefined
    vectors, but we should still check that we don''t attempt to read non-existing
    entries.


    # 11.2.4 Evaluation


    The evaluation of a vector entry starts with the evaluation of the index argument,
    and after that it is identical to the evaluation of a variable. When a vector
    entry is on the LHS of an assignment or a payment, the address of the entry on
    the target STL vector should be set on the evaluator''s LHS pointer so it is written
    into. Otherwise, that entry is read and its value is put on the stack.


    The evaluation of a predefined vector entry also starts with the evaluation of
    the index argument, followed by a direct read of the corresponding entry in the
    vector that is put on the stack.


    The evaluation of a loop node consists of the repeated evaluation of its arguments,
    and the counter (that must sit on the evaluator as a new data member) being set
    to different values every time. The evaluation of the counter node simply reads
    that and puts it onto the stack.


    Finally, we will all or some of the vectors in the script to be considered as
    products. This simply means that we return their values from the call to the high-level
    valuation function.


    In the section dedicated to multiple underlying assets, we will also need support
    for predefined vectors of strings. This is a simple development that is best conducted
    at the same time as to unroll the loop for vectors of numbers.


    An alternative for loops is to clone the whole argument tree as many times as
    the loop repeats and then traverse the trees to pre-compute the counters. We can
    store entry indices directly on the vector entry nodes. Furthermore, predefined
    vector entries can be pre-calculated and stored in constant nodes. The loop node
    becomes a collector node that collects statement trees that are executed at run
    time. Such implementation may optimize performance.


    We have discussed basic improvements that make it easier to use the scripting
    language. But for real-life production use, we also need support for multiple
    underlying assets, currencies, and interest rates. These developments are more
    involved and will be covered in the next section.'
  merge: -1
  img_proc: true
