- pgno: 226
  md: '# The Smoothing Factor


    # 22.2 AUTOMATIC DETERMINATION


    What is a sensible way to determine the smoothing spread for expression > 0?


    One natural lead is to relate it to the standard deviation of expression. In practice,
    using EPS = .05 std(expression) generally produces satisfactory results with expressions
    about the money (which is expected to be close to 0).


    It has been argued that out-of-the-money expressions should use a larger spread
    so that more paths fall into the fuzzy region, improving smoothing. This means
    we could choose the spread so that the proportion of paths landing in the fuzzy
    region P(ε ≤ ε < EPS/2) is some target number, like 0.04 for consistency .5 standard
    deviations at the money. We would need to evaluate the probability distribution
    for expression to implement this and that may be a costly or unstable procedure.
    Instead, we can only estimate the first two moments of expression and use a Gaussian
    approximation for the calculation.


    This is all fine as long as we can estimate the moments of expressions involved
    in all elementary conditions. For this kind of computation, we would typically
    use pre-simulations. They consist of running a small number of Monte-Carlo simulations
    to pre-compute some quantities that are necessary for the main simulation before
    it takes place. It is typically used in modern implementations of the LSM algorithm
    to determine the coefficients used in the main simulation for the regression of
    a number of different purposes, in case we need pre-simulations and reuse the
    pre-simulations to compute all the quantities we need.


    For our purpose, we need pre-simulations to compute the moments of all elementary
    conditions and set the spread on their node accordingly. The generation of scenarios
    is not different from the main simulation. To evaluate them, however, we need
    a derived evaluator, that in addition to doing everything the evaluator does,
    keeps track of the realized values of the LHS expressions involved in all conditions
    for all scenarios. What we need to do is decorate the visitors to the elementary
    condition nodes so that (in addition to what they normally do) they write the
    values of their RHS expressions into the state of the derived evaluator. A pre-processor
    would also need to count and index conditions to start with and allocate space
    to hold the LHS expression values. When pre-simulations are complete, we would
    have all the realized values for the expressions involved in all scenarios in
    the pre-simulation, so we can compute their moments, calculate the related spreads,
    and fire another visitor to write them on the condition nodes.


    This logic has not been implemented in the code in the online repository. That
    code does not include pre-simulations.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'This concludes our investigation of risk sensitivities for scripted transactions.
    We showed how to implement industry-standard smoothing in the language. We designed
    an algorithm that automatically smooths risks with a fuzzy logic evaluation of
    the script rather than a modification of the script. We designed a visitor that
    calculates the value domains of all conditions, necessary for the evaluation with
    fuzzy logic of discrete conditions. As a side benefit, the processor identifies
    conditions that are always true or always false and expressions that turn out
    to be constants. We investigated limitations to this approach and provided guidelines
    to deal with them. And, finally, we discussed the implementation of an automatic
    setting of smoothing spreads, introducing the important technique of pre-simulations.
    Putting it all together, we generalized market practice into new algorithms, which,
    combined, provide an automated, reliable, efficient smoothing for scripted transactions
    without the need to modify scripts or intervene manually in any way.


    The identification of industry-wide smoothing for digits, barriers, and other
    products as a particular use fuzzy logic is in itself a very remarkable result.
    It is this realization that leads us to produce our algorithm, based on a derived
    evaluator that evaluates scripts in light of fuzzy logic in place of conventional
    logic.


    The full source code can be found in our online repository.'
  merge: -1
  img_proc: true
