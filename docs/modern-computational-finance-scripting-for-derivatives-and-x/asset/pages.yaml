- pgno: 108
  md: '# Introduction


    In this section, we discuss some cosmetic improvements to our scripting language
    that in some cases can make major differences for the users. For now, we do not
    deal with support for multiple underlying assets or interest rates. We stick to
    a single underlying of equity, forex, or commodity type and describe additional
    features in the scripting language that make it more relevant and practical in
    a production context.


    The source code for the improvements discussed here is not provided, either in
    the text or in the online repository. Their implementation is, however, discussed
    in depth. For the features discussed here, the implementation mostly consists
    of high-level developments that modify the script before it is parsed and only
    occasionally need minor changes in the parsing code, definition of expression
    tree nodes, and visitors. We show that only light developments are required to
    turn our basic scripting library into a professional tool suitable for production.
    Support for interest rates and multiple underlying assets is more involved and
    considered in part III.'
