- pgno: 213
  md: 'strictly negative $e_i$ or -EPS if none, $e_i$, the smallest strictly positive
    $e_i$, or +EPS if none, apply the butterfly formula:


    ```

    $e \le e_{i-1} \rightarrow DT(e=0) = 0\ne e \ge e_{i-1} \rightarrow DT(e=0) =
    1\ne e_{i-1} < e < 0 \rightarrow DT(e=0) = \frac{e-e_{i-1}}{-e_{i-1}}\n0 < e <
    e_i \rightarrow DT(e=0) = \frac{e}{e_i}$

    ```


    These formulas compute the DT of all types of elementary elements given their
    domain and always true/false status. Everything else, including the computation
    of the DT of combined conditions and the propagation of fuzziness to affected
    variables, does not depend on condition domains. The DT of elementary conditions
    remains correct as long as the DTS of all elementaries are computed with these
    formulas.


    In order to complete the implementation, we need to compute the domains and check
    the true/false status of all elementary conditions. That is conducted with a dedicated
    visitor (actually two) at processing time.


    # 2.2 IDENTIFICATION OF CONDITION DOMAINS


    We develop a pre-processor to compute all domains and store them on the condition
    nodes (equality and inequality nodes) before simulations take place. Once the
    domains of all conditions are known, the visitor or one can trivially identify
    the conditions that are always true or always false and flick the flags on their
    nodes accordingly. During simulations, the fuzzy evaluator on the condition nodes
    the information it needs to correctly evaluate the DTS so the FCE can evaluate
    conditional statements accordingly.


    Note that there is no need to store the whole domain on the node. The only information
    the fuzzy evaluator needs is as follows:


    +   1. Whether the condition is always true or always false

    2. If not, whether the expression is continuous or discrete domain

    3. If the domain is discrete, the two singletons surrounding 0 in the expression''s
    domain, with strictness depending on the strictness of the condition


    In order to compute this information, the domain processor must traverse in order
    all statements in the script and keep track of the domain of all variables as
    a state. The starting domain for all variables is the singleton {0}.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Condition Domains 199


    To avoid unnecessary complexity, we work under the assumption that some expression''s
    domain is either continuous or discrete. In reality, an expression''s domain may
    be the union of continuous intervals and singletons, as in the script:


    ```

    if spot() > 100

    then z = spot() - 100

    elelse if spot() > 8010 then z = -2 else z = -1 endlf

    ```


    The final domain for z is the union of {-2, -1} and the positive real domain.
    This is, however, a twisted example. We may either call it practically irrelevant
    and ignore it as in what follows or handle it with a (substantially) more complicated
    visitor.


    So domains are either represented as a discrete set of known numbers or marked
    as continuous. The visitor keeps a vector of domains for all variables as a state.
    It also maintains a stack of domains for the domains of sub-expressions/trees.
    As usual, the computation takes advantage of the recursive nature of expression
    trees and the visitor framework. To compute the domain of an expression, we compute
    the domain of its arguments and push them onto its domain stack. We then pull
    the argument''s domains from the stack, apply the node''s operation on domains
    to produce the node''s domain, and push it back onto the stack. Operations on
    domains are conducted in the exactly same way that the evaluator conducts operations
    on numbers.


    When the node being visited is an elementary condition, the domain of its LHS
    expression is used to store the necessary information on the condition''s node—always
    true/false flags, and whether the domain is continuous and if not, the two singletons
    from the discrete domain that round 0, and a strictness flag depending on the
    strictness of the condition. We remind that at this stage, elementary conditions
    are of the form expression > 0 or expression ≥0 or expression = 0. The domain
    of expression is recursively computed from the expression''s tree and the result
    is stored in the condition''s top node, which is either a >, a ≥, or a node.


    When we visit an assignment, the LHS variable''s domain on the visitor state is
    overwritten by the RHS expression''s domain.


    When we visit a parent, the LHS variable''s domain is set to continuous, since
    the RHS expression is discounted by the numeraire, which may be valued in the
    positive real domain. Hence, anything that makes payment necessarily has a continuous
    domain.'
