- pgno: 115
  md: 'The problem is evident. And what if monitoring was weekly? Or daily?

    The solution is evident, too: we repeated cash-flows on a schedule:


    # Barrier script 2


    | 01Jun2020 | vAlive = 1 |

    |---|---|

    | start: 01Jun2020 | |

    | end: 01Jun2021 | |

    | freq: 1m | if spot() > BARRIER then vAlive = 0 endIf

    | fixing: | |

    | 01Jun2021 | opt pays vAlive * CALL( spot(), STRIKE )


    A schedule consists of a start date, an end date, and a frequency. Another parameter
    to the schedule is the fixing. In this case, we set the fixing in the end. This
    means that the event date (or fixing date) for each period is at the end of the
    period. For instance, the first period on the schedule starts on 01Jun2020 and
    ends on 01Jul2020. We put the event date for that period on July, at the end of
    the period. The first event date is not on the start date (June), but on the second
    (July) on the schedule. The last event date is on the end of the schedule: 01Jun2021.


    An alternative is to fix at the start of the period. In this case, event dates
    are put on the start dates of the periods. For the first period running from 01Jun2020
    to 01Jul2020, the event date is then on 01Jun. The first event date is the date
    for the schedule, but the last event date is not the end date of the schedule;
    it is the date that immediately precedes the end date in the schedule: 01May2021.


    Similar to macros, the manipulation takes place before the scripting library is
    invoked. The user writes 2, but the scripting library receives script 1 on its
    highest level. The transformation is trivial: all scripts are copied for each
    event date in the schedule. Whenever that results in multiple scripts with the
    same event date, they are merged into a single script for that event date. At
    that point, events are strings and so by merged we really mean script, the last
    date on the monitoring schedule corresponds to the date of the payment of the
    payoff, resulting in two scripts for 01Jun2021:


    ```

    if spot() > BARRIER then vAlive = 0 endIf

    ```'
