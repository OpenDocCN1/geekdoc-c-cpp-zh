    Finally, fuzzy logic propagates fuzziness to affected variables. Consider the
    following statement similar to the autocallable script at maturity:


    ```

    li(spot) > 100 then vDigPays = 130 else vDigPays = 50 endIf

    ```


    With sharp logic, vDigPays is a binary variable that is evaluated to either 50
    or 130 depending on the condition. Its (discrete) value domain is {50,130}. But
    this statement is evaluated in light of fuzzy logic, vDigPays is interpolated
    between 50 and 130 according to the DT of the condition. Implicitly, the statement
    has been


    ```

    vDigPays = dt(spot) - 100) * 130 + [1 - dt(spot) - 100)] * 50

    ```


    vDigPays becomes a continuous value valued in the real interval (50,130). Fuzzy
    logic applied to the condition propagated into vDigPays. We say that vDigPays
    has been fuz. This matters, because a later statement in the script may test vDigPays:


    ```

    If vDigPays = 50 then pr [payoff1] else pr [payoff2] endIf

    ```


    The condition vDigPays = 50 no longer makes sense after vDigPays has been made
    continuous. Furthermore, two tests, such as IfvDigPays > 100 and IfvDigPays >
    120, which were equivalent in light of conditional logic, are longer equivalent.
    Chapter 22 deals with domains and the propagation of fuzziness and resolves most
    of the difficulties.


    For now we take note of the three characteristics of fuzzy logic in our evaluation
    of scripts:


    +   1. The evaluation of the DT of elementary conditions expression > 0 as continuous
    non-decreasing functions valued in (0, 1), for example, call spreads with size
    EPS.'
