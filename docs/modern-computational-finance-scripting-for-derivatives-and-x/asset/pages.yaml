- pgno: 124
  md: '# Predefined Schedules and Functions


    Predefined schedules are very convenient whenever some feature of a transaction,
    say a barrier for an option, or the notional for a swap, is meant to change on
    a schedule, which is very frequent in financial transactions. For example, consider
    a 3y barrier option where the barrier is 110 the first year, 120 the second year,
    and 130 the third year. We monitor the barrier monthly. We could write the script
    as follows:


    | 01Jun2020 | vAlive = 1 |

    |---||

    | start: 01Jul2020 end: 01Jun2021 freq: 1m fixing: end | if spot() > 110 then
    vAlive = 0 endif |

    | start: 01Jul2021 end: 01Jun2022 freq: 1m fixing: end | if spot() > 120 then
    vAlive = 0 endif |

    | start: 01Jul2022 end: 01Jun2023 freq: 1m fixing: end | if spot() > 130 then
    vAlive = 0 endif |

    | 01Jun2023 | opt pays vAlive * CALL( spot(), STRIKE) |'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 110 MODERN COMPUTATIONAL FINANCE


    This is not satisfactory: the script is longer than it should be because monitor
    the barrier on three different schedules. What if the barrier changed every month?
    In addition, the script is not expressive and does not make it obvious at first
    sight that the barrier is on a schedule.


    Predefined schedules resolve such situations. First, we create a schedule object
    (consisting of a collection of dates and corresponding values, called knots, stored
    for instance in an STL map, together with an interpolation/extrapolation method),
    give it a name “barrier”, specify its knots:


    | 01Jun2021 | 110 |

    | 01Jun2022 | 120 |

    | 01Jun2023 | 130 |


    We also specify that the interpolation is piece-wise constant, let continuous,
    that the extrapolation is on both sides, and pass the schedule to the scripting
    library along with the script. The script can now be written in a crisp, expressive
    form:


    | 01Jun2020 | vAlive = 1 |

    | start: 01Jul2020 | if (spot) > barrier(EndPeriod) |

    | end: 01Jul2023 | then vAlive = 0 endif |

    | freq: 1m |

    | fixing: | |

    | 01Jun2023 | opt pays vAlive * CALL(spot), STRIKE) |


    The parser identifies the “barrier” token as a predefined schedule, parse its
    argument as a date expression that is evaluated at parsing time, access the schedule
    object by name, interpolate the result, and put it on a constant node.


    Hence, there is still no need to design new node types or modify visitors. This
    is another light development that considerably simplifies the scripting of any
    transaction with schedules, which would otherwise result in unnecessarily long
    and clumsy scripts.


    As with the macros we considered earlier: if we wish to differentiate values with
    respect to the schedule knot levels using AAD, we need to create a dedicated schedule
    node.


    Note that a predefined schedule is in fact nothing or less than a user-defined
    function, in which the argument happens to be a date. We can easily define it
    in exactly the same way as user-defined functions of numbers. These are less frequently
    used than the schedules, yet occasionally'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'appear and cannot be scripted neatly without user-defined functions. As an

    illustration, consider an asymmetric kind of butterfly:


    ![](img/3887ab6b5277fb99d77002948fa19470_126_0.png)


    The script for this payoff would involve the awkward set of nested ifs.

    Instead, we create a user-defined function object, call it “butterfly,” specify

    it knots:


    | 70 | 0 |

    |---|-|

    | 100 | 30 |

    | 110 | 20 |

    | 150 | 0 |


    We also specify that the interpolation is linear and that the extrapolation

    is constant on both sides, and pass the function (interpolation object) to our

    scripting library along with it. The script is now written in a crisp,

    expansive form:


    ```

    01Jun2021    opt pays butterfly(spot)(

    ```


    Contrarily to predefined schedules, which argument is a date and there

    fore to be a constant, user-defined functions are full expresion-

    trees. Hence, user-defined functions cannot be evaluated at parsing or

    pre-processing time. We must create a node type for user-defined functions.

    This node holds a reference to the related interpolation object, or a copy of

    the object itself. This can be arranged at parsing time. The visitor for the

    user function node in the evaluator evaluates the argument, interpolates it

    on the function object, and puts the result on the evaluation stack.'
  merge: -1
