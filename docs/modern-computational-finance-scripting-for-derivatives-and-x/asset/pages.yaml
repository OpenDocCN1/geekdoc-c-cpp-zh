    # 1.4 PRE-PROCESSING


    Pre-processing is the key optimization that makes the valuation of scripts (almost)
    as fast as hard-coded payoffs. Where performance matters most is in the code repeated
    for a large number of simulations. Monte-Carlo developers know that maximum performance
    is achieved by moving as much work as possible before simulations take place:
    pre-allocation of working memory, transfer of data, pre-calculation of quantities
    that don''t directly depend on the simulated variables. We want to perform as
    much work as possible once, before simulations start, so that the subsequent work
    conducted repeatedly over scenarios is as limited and as efficient as possible.


    Pre-processing is not only about pre-computing parts of subsequent evaluations.
    It is not much about the optimization of the arithmetic calculations performed
    during simulations. It is mainly moving over the administrative, logistic overhead
    to processing time. CPUs perform mathematical calculations incredibly fast, but
    the access of data in memory may be slow if not carefully dealt with. With hard-coded
    payoffs (payoffs coded in C++), it is the compiler that optimizes the code, putting
    all the right data in the right places in the interest of performance. With scripting,
    the payoff, as a function of script, is built at runtime. The compiler cannot
    optimize this function for you. This is our responsibility. This is where the
    pre-processors come into play.


    A special breed of pre-processors indexers arrange data for the fastest possible
    access during simulations, with a massive performance impact. For instance, when
    cash-flow is related to a Libor rate of a given maturity, the index “forms” the
    evaluator before simulations start, where pre-allocated memory that Libor will
    live during simulations, so that at that point, the evaluator reads the simulated
    Libor, directly, without any kind of expensive lookup.


    Most noticeable benefits are achieved in the context of interest rates (and multiple
    assets) de discussed in section III. The dates when coupons are fixed or pays
    such as discount factors and Libors are independent of scenarios. The value of
    these simulated variables may be different in every scenario, their specification,
    including maturity, is fixed. Pre-processors identify what rates are required
    for what event dates, and perform memory allocation, indexing, and other logistics
    before simulations start. During simulations, where performance matters most,
    the model communicates the values of the simulated data in a pre-indexed array
    for a fast, rapid access.


    This is covered and clarified in part III, but we introduce an example straight
    away. Consider a script for caplet:


    ```

    caplet 0.25 *

    01Jun2021 max(0, libor(03Jun2021, 3m, act/360, L3) - STRIKE) on 03Sep2021

    ```'
