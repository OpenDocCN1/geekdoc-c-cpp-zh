- pgno: 218
  md: '# CHAPTER 21

    Limitations


    We now have a fully working fuzzy evaluator that overrides the evaluation of conditional
    blocks resulting in an automatic smoothing that stabilizes the calculation of
    risk sensitivities with negligible impact on valuation and performance. As a necessary
    preamble, we implemented a domain processor that computes the domains of all elementary
    conditions and doubles up as a constant expression/trimmer.


    The implementation has been tested in many cases of practical relevance and provides,
    a substantial stabilization of risk sensitivities without a measurable performance
    impact or valuation bias. We can finally automatically smooth our autocollable
    script, with the exact same results we achieved previously.


    There are limitations, however, and we are investigating them now.


    During extensive testing, we identified two families of limitations. Both relate
    to characteristics in the scripts that may be inconsistent with fuzzy logic, potentially
    causing a valuation bias or a crash. This is serious enough so that, at the very
    least, these limitations must be clearly identified and understood.


    # 21.1 DEAD AND ALIVE


