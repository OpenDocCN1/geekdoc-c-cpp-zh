- pgno: 18
  md: '# Introduction


    This his part leads readers through the development steps of the scripting library
    provided in our source repository.


    A transaction consists of a number of events occurring on given dates in the future.
    This is where a payment or coupon is fixed, a discrete barrier is monitored, or
    an exercise takes place. This is also where a path-dependency is updated with
    reference to the simulated variables on that future date.¹ Future dates when such
    events take are called event dates.


    As an illustration, we consider a simplified version of the popular autocallable
    transaction. It pays a high coupon (say 10%) if some index (say S&P500) increases
    during the first year of its life. In this case, it pays the notional redemption
    together with the coupon of 10% and terminates at the end of year 1. Otherwise,
    it may deliver a 20% coupon (10% per annum) at the end of year 2 provided the
    underlying index increased over the two years. In this case, it repays the notional
    together with the 20% coupon and terminates at the end of year 2. If not, it is
    given a last chance on year 3, provided the underlying index increased + 30% at
    the end of year 3. If not, only 50% of the notional is repaid. If this is the
    case, the investor receives the redemption. It is easy to see that the investor
    implicitly sells a (somewhat exotic) option on what may appear as a low probability
    event (index decreasing over one, two, and three years) in exchange for a high
    coupon in a low-yield environment, which explains the success of this structure.²


    > ¹Continuous barriers are somehow outside of this logic and require specific
    support that is not discussed. Support for early exercises is discussed in chapter
    15.\²This is an overly simplified version of the autocallable product and one
    that is purposely structured to illustrate the implementation and application
    of scripting. It is significantly different from actual autocallable transactions,
    which can also be scripted with our language, but in a more complicated manner.'
  merge: -1
  img_proc: true
