- pgno: 40
  md: '# CHAPTER 2


    # Expression Trees


    A scripted product consists of a number of event dates together with corresponding
    events, initially represented with text. Text is not convenient for evaluation
    (or any kind of visit), so our first step is to turn them into appropriate data
    structures. The process that turns text into our internal representation of events
    is called parsing and covered in the appendix. Our internal representation of
    events is a sequence of expression trees. We have one expression tree per statement.


    In our autocable example, today''s event


    ```

    vRef = spot()

    vAlive = 1

    ```


    has two statements. We represent each one as a separate expression tree.

    A script is a sequence of events, an event is a sequence of statements, and each
    statement is represented by exactly one expression tree. Visitors visit all the
    trees of a script in sequence, accumulating information from the previously visited
    trees that they reuse when visiting subsequent trees.

    We define and illustrate expression trees in what follows, first, in words, then,
    in code.


    # 2.1 IN THEORY


    # Anatomy of an expression


    An expression represents a calculation or an action and consists of a collection
    of items that represent the elementary operations involved in that calculation
    or action. An expression that represents an action is called a statement. A statement
    is like a full sentence. An expression that is not a statement is a piece of sentence
    missing a verb. An event is a sequence of complete sentences, hence, statements.'
  merge: -1
  img_proc: true
