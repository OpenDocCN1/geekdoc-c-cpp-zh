    ```

    $DT(e > 0) = 1_{-0.5 \le e < 0.5}(e + 0.5) + 1_{e \ge 0.5}$

    ```


    So, if the spent spent a week or less in the range, then $vCount <= 1$ where $e
    = -0.5$, and $DT=0$. If it spent two weeks or more in the range, $e > 0.5$, and
    $DT=1$. Remember that $vCount$ is fuzzy, here continuous, when the script is evaluated
    with fuzzy logic. The fuzzed $vCount$ belongs to $(0,4)$, and our formula correctly
    interpolates $DT$ when $vCount$ is between 1 and 2. We find that $vCount > 1$
    produces the same result in all cases the conditions evaluate consistently.


    What if we have a non-strict condition, as in $vCount >= 2$, resolving in $vCount
    - 2 >= 0$? Well, the formulas apply, except that in this case, we pick $e_i$ as
    the largest strictly negative $e$. We can check if we apply this formula with
    the previous script rewritten with $vCount > 2$, we produces the same result in
    all scenarios.


    Finally, equality conditions make sense with discretely valued conditions. In
    this case, we compute $\{e_{i-1}, 0, e_i\}$:


    ```

    $e \le e_{i-1} \rightarrow DT(e = 0) = 0\ne \ge e_i \rightarrow DT(e = 0) = 1\ne_{i-1}
    < e < 0 \rightarrow DT(e = 0) = \frac{e-e_{i-1}}{-e_{i-1}}\n0 < e < e_i \rightarrow
    DT(e = 0) = \frac{e_i-e}{e_i}$

    ```


    where:


    +   - $e_{i-1}$ is the largest strictly negative singleton, or -EPS when all singletons
    are positive.

    - $e_i$ is the smallest strictly positive singleton, or +EPS when all singletons
    are negative.

    - The singleton $\{0\}$ must be part of the value domain of $e$, otherwise the
    condition is always false. The case $dom(e) = (0)$ is also a particular case when
