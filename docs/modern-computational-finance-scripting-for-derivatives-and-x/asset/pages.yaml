- pgno: 238
  md: '# CHAPTER 25


    # Closing Remarks


    We described all the steps involved in the production and use of professional
    scripting language in modern C++. We provided a structure based on visitable expression
    trees, so that visitors access the scripted cashflows for evaluation against simulations
    and much more. We insisted on the development of specialized visitors, like pre-processors
    and indexers, which improve the efficiency of evaluation so its run time is similar
    to optimized, hard-coded evaluation code. As an example for what may be done with
    scripting aside from valuation, we showed how this lends itself to evaluation
    with fuzzy logic to automatically stabilize risk sensitivities. Visitors can “peek”
    into the “source code” for the cash-flows, so they can do an amazing number of
    things, ranging from optimizations to automatic aggregation and compression of
    transactions and much more.


    It is not our purpose to deliver a finalized software, but to demonstrate how
    it can be implemented. For that reason, we exposed C++ source code in the body
    of the document for the fundamental components of the scripting library. The entire
    source is available in our repository:


    ```

    https://github.com/asavine/Scripting/tree/Book-V1

    ```


    (branch Book V1, not master). We also provide the source code fuzzy logic there.
    We do not provide source for the professional improvements and extensions discussed
    in parts II and III. This is for the readers to implement in accordance to their
    needs and the constraints of their infrastructure and environment. The explanations
    given in the book should hopefully enable them to perform these developments seamlessly
    over the backbone developed in part I.


    # 25.1 SCRIPT EXAMPLES


    We collect here a few examples of scripts that demonstrate the finalized version
    of the scripting language.'
  merge: -1
  img_proc: true
