  md: "# Parsing\n\n# 235\n\n```\nstruct script_error : public runtime_error {\n \
    \ script_error(const char msg[]) : runtime_error(msg) {}\n};\n\n// Statement =\
    \ ExprTree = unique_ptr<Node>\nstatic Statement parseStatement(Tokit& cur, const\
    \ Tokit end) {\n  // Check for instructions of type 1, so far only 'if'\n  if\
    \ (cur == \"IF\") return parseIf(cur, end);\n\n  // Parse cur as a variable\n\
    \  auto lhs = parseVar(cur);\n\n  // Check for end\n  if (cur == end) throw script_error(\"\
    Unexpected end of statement\");\n\n  // Check for instructions of type 2, so far\
    \ only assignment\n  if (cur == \"=\") return parseAssign(cur, end, lhs);\n\n\
    \  // No instruction, error\n  throw script_error(\"Statement without an instruction\"\
    );\n  return Statement();\n}\n```\n\nWe now implement three parsers to cover all\
    \ cases: one for instructions, one for variables, and one for assignments. We\
    \ start with parseIf().). In an instruction, the \"if\" token is followed by a\
    \ condition, itself followed by the \"then\" token, followed by a number of statements,\
    \ followed by either \"endif\" or \"else\"; and in case it is \"else\", we have\
    \ another series of statements and finally \"endif.\\ The statements following\
    \ \"then\" and \"else\" are parsed with recursive calls to parseStatement(), because\
    \ they are full statements themselves; in particular they may contain nested if\
    \ instructions. We remind that the if node holds the index of the first statement\
    \ that follows \"else\" or -1 if we have no \"else.\" Implementation\n\n```\n\
    static ExprTree parseIf(Tokit& cur, const Tokit end) {\n  // Advance to token\
    \ immediately following \"if\"\n  ++cur;\n\n  // Check for end\n  if (cur == end)\
    \ throw script_error(\"'IF' is not followed by 'then'\");\n\n  // Parse the condition\n\
    \  auto cond = parseCond(cur, end);\n\n  // Check that the next token is \"then\"\
    \n  if (cur == end || cur != \"THEN\") {\n    throw script_error(\"'IF' is not\
    \ followed by 'then'\");\n  }\n```"
