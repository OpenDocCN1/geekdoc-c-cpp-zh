  md: 'the block, including nested blocks. For instance, in our earlier toy example,
    x is not affected and does not need to be recorded or restored.


    Hence, in order to optimize our algorithm, we must identify the affected variables
    for every conditional block. This can be implemented without difficulty in a dedicated
    pre-processor. Then, a small modification is sufficient to restore our algorithm''s
    efficacy:


    +   1. Compute the degree of truth degTrue of the condition. Denote


