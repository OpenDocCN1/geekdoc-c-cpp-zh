- pgno: 158
  md: '# CHAPTER 15


    # American Monte-Carlo


    We need support for handling early exercise features in our scripting language.
    This is necessary for European and Bermudan options as well as for calculating
    xVA and regulatory quantities.


    Traditionally, solving early exercise problems was done with backward recursive
    methods such as finite difference methods. However, in the late 1990s and early
    2000s a number of methods emerged that allowed the approximate pricing of early
    exercise options through the use of Monte-Carlo. Of these methods the most versatile
    and flexible is the Least Squares Method (LSM) by Carriere (1996), publicized
    by Longstaff and Schwartz (2001). This is the method that we will concentrate
    on implementing in our scripting library.


    # 15.1 LEAST SQUA METHOD


    The LSM algorithm provides a way of approximating the future PV within Monte-Carlo
    simulations of subsequent sequences of cash-flows. LSM was initially developed
    for callable exotics. At the time, interest rate models had grown in complexity
    and dimension and could no longer be implemented in terms of finite differences
    or other backward induction algorithms. They had to be implemented with Monte-Carlo
    simulations, which, as well known, run forward and simulate the state variables
    of the model, not the PV of the transactions. But the decision whether to exercise
    the option at the exercise date depends on the PV at that date of the subsequent
    cash-flows. The party who holds the option exercises it when the PV of the subsequent
    cash-flows is positive from that point''s point of view. Within a Monte-Carlo
    simulation, PV is not available. The PV of a sequence of cash-flows is the expectation
    of the sum of the discounted cash-flows, conditional to the filtration at the
    exercise date; hence, it is a function of the state variables at the exercise
    dates and before, because that filtration is generated by


    143'
