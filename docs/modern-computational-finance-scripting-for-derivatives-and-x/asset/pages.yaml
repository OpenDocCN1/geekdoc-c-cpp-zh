- pgno: 74
  md: "# Visitors 59\n\nreplace the template T> doubles. AAD is covered in volume\
    \ 1 of this series [27].\n\nThe evaluation of expressions and conditions is similar\
    \ to the debugger. For all nodes other than leaves (variables and constants),\
    \ spot (this one we look into later), and instructions (if and assign nodes),\
    \ evaluation consists of the same steps. First, evaluate the arguments (ensuring\
    \ we tree traversal), then fetch the results for the arguments, perform the operation\
    \ according to the concrete type of the current node, and finally store the result\
    \ so that a parent node may use it. By the recursive nature of trees and visits,\
    \ it is convenient to use stacks to store intermediary results. We have a stack\
    \ of numbers for expressions and a stack of booleans for conditions. The nature\
    \ of the stack means that the arguments are picked and processed in the reverse\
    \ order they are on the stack. In order process arguments first to last, we put\
    \ them on the stack to last.\n\n```\ntemplate <class T> class Evaluator : public\
    \ constVisitor\n{\n    // State\n    vector<T> myVariables;\n\n    // Stacks\n\
    \    quickStack<T> myStack;\n    quickStack<bool> myStack;\n    // ...\n\n   \
    \ // Visit arguments, right to left\n    void evalArgs(const Node& node)\n   \
    \ {\n        for(auto i = node.arguments.rbegin(); i != node.arguments.rend();\
    \ ++i)\n            (*i)->acceptVisitor(*this);\n    }\n\npublic:\n    // ...\n\
    };\n```\n\nVisits to all nodes except leaves start with a visit to arguments with\
    \ a call to evalArgs(), then pick the values resulting from the evaluation of\
    \ the arguments from the relevant stack (left to right), evaluate the current\
    \ node, and push the result onto the stack so that the parent node can pop it.\
    \ The add visitor, for instance, as follows:\n\n```\nvoid visitAdd(const NodeAdd&\
    \ node) override\n{\n    evalArgs(node);\n    auto args=pop2();\n    myStack.push(args.first+args.second);\n\
    }\n```"
