- pgno: 22
  md: '# CHAPTER 1


    # Opening Remarks


    # INTRODUCTION


    In the early stages of derivative markets, dedicated models were typically put
    together to value and risk manage new transaction types as they emerged. After
    Black and Scholes [5] published in 1973 a closed-form formula for European options
    under a constant volatility assumption, alternative models—like the Cox-Ross-Rubinstein
    binomial tree [7] in 1979, later replaced by more efficient finite difference
    grids—were developed to value American options under the same assumptions.


    As trading in derivatives matured, the range of complex transactions expanded
    and models increased in complexity so that numerical methods became necessary
    for all but the simplest vanilla products. Models were typically implemented in
    terms of finite difference grids for transactions with early exercise and Monte-Carlo
    simulations for products with path-dependency. Notably, models increased in dimension
    as they grew in complexity, making grids impractical in most cases, and Monte-Carlo
    simulations became the norm, with early exercises typically supported by a version
    of the Longstaff-Schwartz regression-based algorithm [22]. Sophisticated models
    also had to be calibrated before they were used to value and risk manage exotics:
    their parameters were set to match the market prices of less complex, more liquid
    derivatives, European calls and puts.


    Most of the steps involved—calibration, Monte-Carlo path generation, backward
    induction through finite difference grids—were independent of the transactions
    being valued; therefore, it became best practice to implement models in terms
    of generic numerical algorithms, independently of products. Practitioners developed
    modular libraries, like the simulation library of our publication [27], where
    transactions were represented in separate code that interacted with models to
    produce values and risk sensitivities.'
  merge: -1
  img_proc: true
