  md: '# CHAPTER 3 Visitors


    # 3.1 THE VISITOR PATTERN


    Visitors are objects that manipulate expression trees. Visitors traverse the trees
    in a given order (often depth-first postorder) to extract information and/or perform
    actions, while maintaining internal state. Once again, in order to convey the
    principal ideas with simple code, we present the classic OO visitor pattern based
    on double virtual dispatch; what code is executed when a visitor visits a node
    in the tree depends on the concrete class of the visitor and the concrete class
    of the node. A more efficient implementation could lift virtual dispatch overhead
    in place of a virtual hierarchy. Visitors also do not have to constitute a virtual
    hierarchy; they could be implemented as template arguments in general visitation
    procedures. The C++17 variant construct has built-in support for visitors. In
    practice, these optimizations make code harder to understand for readers unfamiliar
    with modern C++ constructs, and the improvement in performance is rather limited.
    Readers who wish to modernize our code will not meet significant difficulties
    once the central ideals are well understood.


    Let us warm up with a particularly easy visitor, the Debugger, which prints out
    a parsed expression tree. Once parsing is implemented, we may want to throw hundreds
    of event strings at it and check that they parse correctly. Unfortunately, to
    check the structure of trees in a debugger is less than ideal. Debuggers are not
    built to easily visualize composite patterns. Therefore, we want some functionality
    to traverse trees bottom-up and write their functional form. We want a tree like'
