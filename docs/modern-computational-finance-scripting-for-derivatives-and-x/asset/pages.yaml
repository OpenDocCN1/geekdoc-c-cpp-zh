    {\n    randomgen_error(const char msg[]) : runtime_error(msg) {}\n};\nclass RandomGen\n\
    {\npublic:\n    // Initialise for a given dimension\n    virtual void init(const\
    \ size_t dim) = 0;\n\n    // Generate the next random norm point\n    virtual\
    \ void genNextNormVec() = 0;\n```"
