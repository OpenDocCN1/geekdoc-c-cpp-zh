  md: 'with the schedule of cash-flows with the remaining notional, which in turn
    is susceptible to knocked-out in part or in full on the next barrier fixing. Like
    Schrodinger’s cat, our transaction is partly alive or alive to a degree. The natural
    interpretation for this “degree of aliveness,” however, is not the probability
    of being alive, but the fraction of the notional remains. This extension of call
    spread smoothing to barriers is an industry standard that is sometimes referred
    to as “smooth barriers.”


    # 16.4 SMOOTHING FOR SCRIPTED TRANSACTIONS


    The smoothing of digits and barriers is widely used in the industry. This is a
    standard that a professional scripting language must incorporate and support.
    With scripted products, it is always the conditional blocks starting with “if”
    statements that produce discontinuities. According to the condition, different
    statements are executed and different, potentially discontinuous values, are assigned
    to variables and paid by products. Scripts typically involve frequent conditional
    statements, and each one is the source of a potential discontinuity that breaks
    risk sensitivities with progress for valuation, the risk management of scripted
    transactions has As a consequence, and while scripting has been a major progress
    often been unstable and untrustworthy unless some form of smoothing is performed.
    When a scripted transaction with conditional statements is booked in view of risk
    management, the script has typically been manually modified to incorporate smoothing.
    However, this manual approach to smoothing discussed next is somewhat unsatisfactory
    and we subsequently investigate automatic solutions.'
