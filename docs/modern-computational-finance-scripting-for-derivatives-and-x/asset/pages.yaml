  md: '# Support for Smoothing


    We first discuss support for manual smoothing in the scripting syntax. This is
    easily implemented with an additional function that we may call “functional if,”
    or flf, similar to Excel’s if but with a smoothing factor that can be used to
    replace if statements. The signature of the function is:


    ```

    flf(x, value if x positive, value if x negative, smoothing factor)

    ```


    It is formally defined as:


    ```

    $flf(x,a,b,\varepsilon) = b + \frac{a-b}{\varepsilon}max(0,\min(\varepsilon,x+\frac{\varepsilon}{2}))$$

    ```


    and drawn here:


