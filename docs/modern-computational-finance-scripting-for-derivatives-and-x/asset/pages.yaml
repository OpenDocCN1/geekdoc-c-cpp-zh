- pgno: 230
  md: 'We insisted many times that scripting supports xVA in a particularly practical
    and efficient manner. Looking into CVA without loss of generality, it is defined
    as follows (ignoring discounting):


    ```

    $CVA = E \left[ \sum_i (1 - R_{T_i}) 1_{\{T_i \le \tau < T_{i+1}\}} \max(0, V_{T_i})
    \right]$

    ```


    where $\tau$ is the default time, $R$ the recovery rate, and $V_{T_i}$ is the
    PV of the netting set at exposure time $i_i$, that is, the PV at all future cash-flows
    from all the transactions in the netting set. We see that the language needs to
    cover credit so we can script default and recovery. This may be implemented in
    a way that is identical to how we implemented asset prices: we may implement a
    forward survival probability keyword/node/request/data in a way identical to spots.
    In addition, $fwd$ for equities/commodities and recovery in a way that is often
    computed ignoring wrong-way risk, that is, with credit assumed independent from
    the drivers of the PV of the netting set. In this case, the formula simplifies
    into:


    ```

    $CVA = E \left[ \sum_i [1 - R(0, V_{T_i})] |S(0, T_i) - S(0, T_{i+1})| \max(0,
    V_{T_i}) \right]$

    ```


    where $R$ and $S$ and deterministic recoveries and survival probabilities are
    read from today''s credit markets. Since these quantities are deterministic in
    that case, they can simply put on a predefined schedule—see part II, chapter 10—and
    xVA is supported without further developments. Huge and Savine [18] report Andreasen''s
    demonstration that CVA can also be written:


    ```

    $CVA = E \left[ \sum_k \eta_{T_k} CF_k \right]$

    ```'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'where $CF_k$ is the cash-flow from the netting set paid on date $T_k$ and


    $$\eta_{T_k} = \sum_{T_i < T_k} (1 - R_{T_i})1_{\{T_{i-1}\leq r<T_i\{V_{T_i}>0\}}$


    In other terms, to value a CVA means to value the underlying payments, discounted
    by a single path-dependent process:


    $$\eta_0 = 0, \eta_{T_{i+1}} = \eta_{T_i} + (1 - R_{T_i})1_{\{T_{i-1}\leq r<T_i\{V_{T_i}>0\}}$


    Or in the case of imperfect credit::


    $$\eta_{T_{i+1}} = \eta_{T_i} + [1 - R (0, T_i)] [S (0, T_i) - S (0, T_{i+1})]1_{\{V_{T_i}>0\}}$


    Hence, provided that all the transactions in the netting set are correctly scripted,
    aggregated, and compressed,$1$ we have all cash-flows in the netting paid on a
    variable $ns$ in a single (generally long) script:


    | | ns pays ... |

    | CFDate1 | ns pays ... |

    | | ... |

    | | ns pays ... |

    | | ns pays ... |

    | CFDate2 | ns pays ... |

    | | ns pays ... |

    | | ... |

    | | ns pays ... |

    | | ... |

    | CFDateN | ns pays ... |

    | | ns pays ... |

    | | ... |

    | | ns pays ... |


    $1$Which is also done by a dedicated visitor; Andreasen’s CVA on an iPad Mini
    Part 3 [1], slides 26 and up.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# xVA 217


    All we need in order to compute the CVA (or any other xVA) is to decorate this
    script, that is, keep it as is but add the following:


    +   1. A duplicate of all payments on a variable called cva, but multiplied by
    nu. This is conducted by a dedicated visitor:


    | ... |

    | ns pays ... |

    | ns pays ... |

    | ... |

    | ns pays ... |

    | CFDatel | cva pays nu * ... |

    | cva pays nu * ... |

    | ... |

    | ns pays nu * ... |

    | ... |


    +   2. The script for


    $\eta_{T_{i+1}} = \eta_{T_i} + [1 - R(0, T_i)] [S(0, T_i) - S(0, T_{i+1})] \{V_{T_i}>0\}$


    ```

    Start: TODAY          if PV(ns) > 0 then

    End: FINALDATE       nu = nu + ( 1 - rec( StartPeriod) )

    Freq: CFAVREQ        * = ( surv(StartPeriod) - surv( EndPeriod) )

    Fixing: end           endIf

    ```


    And just like that, we have a script for the CVA (or any other xVA) in a similar
    manner). Of course, we need a hybrid model to properly execute this script.'
