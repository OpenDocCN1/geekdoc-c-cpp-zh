  md: '# # CHAPTER 7 Macros


    First cosmetic pricing improvement is the support for C/C++ like macros. Say we
    are pricing a 3y clique with strike at 5% annual performance (today is 1 June
    2020):


    | 01Jun2020 | vRef = spot() |

    | 01Jun2021 | vPerf = (spot() - vRef) / vRef <br> prd pays max(vPerf - 0.05, 0)
    <br> vRef = spot() |

    | 01Jun2022 | vPerf = (spot() - vRef) / vRef <br> prd pays max(vPerf - 0.05, 0)
    <br> vRef = spot() |

    | 01Jun2023 | vPerf = (spot() - vRef) / vRef <br> prd pays max(vPerf - 0.05, 0)
    |


    If we want to change the strike to 2.5%, we need to replace 0.05 with 0.025 in
    three different places in the script. This is inconvenient and error prone. It
    is much neater to define a macro:


    > STRIKE 0.05


    Then the script becomes:


    | 01Jun2020 | vRef = spot() |

    | 01Jun2021 | vPerf = (spot() - vRef) / vRef <br> prd pays max(vPerf - STRIKE,
    0) <br> vRef = spot() |'
  merge: -1
