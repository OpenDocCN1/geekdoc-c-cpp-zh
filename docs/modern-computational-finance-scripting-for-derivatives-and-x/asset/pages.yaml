    has a discrete domain $\{e_0, e_1, \dots, e_n\}$, then fuzzy logic turns its domain
    into $(e_0, e_n)$ and we compute the DT of $e > 0$ by interpolation:


    ```

    $$\begin{aligned} e \le e_{i_0} \to DT(e > 0) = 0 \ e \ge e_{i_1} \to DT(e > 0)
    = 1 \ e_{i_0} < e < e_{i_1} \to DT(e > 0) = \frac{e-e_{i_0}}{e_{i_1}-e_{i_0}}
    \end{aligned}$

    ```


    where $e_{i_0}$ is the largest non-positive $e_i$, and $i_1 = i_0 + 1$. When we
    can''t find such pair $\{e_{i_0}, e_{i_1}\}$ in $\{e_0, e_1, \dots, e_n\}$, that
    means the condition is always true or always false.


