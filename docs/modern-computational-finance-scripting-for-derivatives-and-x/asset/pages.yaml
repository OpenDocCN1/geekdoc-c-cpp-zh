    \ its dimension (the number of random numbers required to generate one path).\
    \ Note that the dimension is not necessarily the number of event dates. In a stochastic\
    \ volatility model, for instance, the dimension is at least twice the number of\
    \ event dates, since random increments are needed for the path of the volatility,\
    \ too. In addition, the simulation timeline of the model may include more dates\
