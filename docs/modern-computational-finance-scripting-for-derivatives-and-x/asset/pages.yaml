- pgno: 199
  md: '# MODERN COMPUTATIONAL FINANCE


    conditions and condition combinators and, or, and not to compute degrees of truth
    (DTs) and evaluate conditions to a number between 0 and 1, instead of true or
    false. Then we used the derived evaluator to evaluate the script in every scenario,
    effectively implementing FCE without any modification to the script.


    It is clear that what is the logic at play in the evaluation of conditions and
    conditional blocks. Interestingly, such overriding exactly consists of the application
    of fuzzy logic in place of conventional logic. Hence, our derived evaluator smooths
    scripts at evaluation time and is fuzzy evaluator, an evaluator that applies fuzzy
    logic to conditions and conditional statements. This should not come as a complete
    surprise, since we had already noted the interpretation in terms of fuzzy logic
    of the classical smoothing of digits and barriers.


    Fuzzy logic is an extension of conventional logic which was invented in the 1960s
    by Lotfi Zadeh, spent the following 30 years developing and promoting it. His
    major publications are compiled in [29]. The initial goal was an attempt to model
    expert opinions for the development of the first expert systems. Fuzzy logic extends
    conventional logic, where conditions are either true or false, with the notion
    that a condition could be to some extent. The extent to which a condition is a
    number between 0 and 1 called its degree of truth (we write DT in short). The
    DT of some expression > 0 is a function of the expression: DT = dt(expression)
    = f(expression). We choose to calculate DTs with call spreads for efficiency and
    consistency with industry standards. Alternatively, we could use any non-decreasing
    function valued into (0,1). It is desirable to parameterize the function to control
    how it increases from 0 to 1 as the expression increases from very negative values
    resulting in a DT of 0 to very positive values resulting in a DT of 1. In the
    case of call spreads, the parameter is the size of the spread EPS. Examples of
    valid, relevant forms for DT include call-centered Gaussian distributions by a
    standard deviation s or a logic function parameterized by its steepness k. Such
    offers additional smoothness, but they deviate from market practice and more importantly
    produce a significant performance overhead. Hence, we stick with a call spread
    specification, but point out that the FCE works with any sensible specification.
    In practice, the computation of the DTs are implemented in the overridden visitor
    to the > node (elementary conditions) in the derived evaluator.


    Fuzzy logic also provides computations for the DT of combined conditions. We choose
    probabilistic style computations


    ```

    dt(A and B) = dt(A) * dt(B)

    dt(A or B) = dt(A) + dt(B) - dt(A) * dt(B)

    dt(not A) = 1 - dt(A)

    ```'
