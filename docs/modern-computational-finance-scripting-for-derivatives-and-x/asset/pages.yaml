- pgno: 138
  md: '# Linear Products


    Linear products are products that can be priced with discount factors and forwards
    (prices or rates) only, hence, without knowledge of their future stochastic evolution.
    Such products include interest rate swaps, forwards on interest rates, equities,
    foreign exchange and commodities, and cross-currency swaps.


    There are many products that are essentially derivatives on linear products, particularly
    in the space of interest rate derivatives, for example, swaps and caps, which
    are respectively on swaps and strips of options on one-period swaps (deposits).
    For these products it is generally convenient to have direct or indirect access
    to discount factors and forwards in the scripting language.


    Another feature that we need to support is the payout is delayed after the fixing
    date and pay in another currency. We need the language to be able to supply forwards
    and discount factors, either directly or through interest rates or values of swaps
    or values of a delayed payment.


    This chapter summarizes some general and theoretical considerations about the
    pricing of linear products under different collateral rules and gives a general
    recipe for efficient support of linear products in scripting languages: processing
    and indexing.


    # 12.1 INTEREST RATES AND SWAPS


    Natural interest rate primitives are discount factors and forward Libor rates.
    Let P(t, T) be the time value of a discount factor maturing at time T, that is
    the time t present value of one currency at time T. And let L(t, T1, T2) be the
    time t discrete forward rate for deposit over the interval [T1, T2].


    For simplicity, we will use the academic daycount basis cv(T1, T2) = T2 - T1 rather
    than the typical “ACT/360.” We will also assume that each interest rate period’s
    end date is the start date of the next interest rate period and that the end date
    is exactly the payment date as.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "This is never the case in practice. Details of this type are important for\
    \ deployment but not really for the discussion here. All formulas in this section\
    \ are easily modified to include more realistic day count and date schedule generation.\n\
    \nConventionally, Libors and discount factors are linked by\n\n```\n$L(t, T_1,\
    \ T_2) = \\frac{1}{T_2 - T_1} \\left[ \\frac{P(t, T_1)}{P(t, T_2)} - 1 \right]$\n\
    ```\n\nThis is still true, but it is important to note that it is only the case\
    \ if the Libor and the product in question are under the same collateral rules,\
    \ which is typically not the case. Standard interest rates are generally daily\
    \ collateralized, whereas the forward Libor $L(t, T_1, T_2)$ refers to an uncollateralized\
    \ interbank deposit between $[t, T_2]$.\n\nFor the discount factor $P(t, T, I)$\
    \ we include one extra argument for the collateral $I$ in $[t, T]$. We can relate\
    \ $P$ to the instantaneous discount rate for collateral $I$, $r$, by the formula\n\
    \n```\n$P(t, T, I) = E_t \\left[ e^{-\\int_t^T r(u, I) du} \right]$\n```\n\nwhere\
    \ $E_t[\\cdot]$ denotes risk neutral expectation on time $t$ information.\n\n\
    For the forward Libor $L(t, T_1, T_2, I, J)$ we include two arguments, $I$, which\
    \ specifies the collateral over the period to payment $[t, T_2]$, and $J$, which\
    \ specifies the collateral for the underlying interbank deposit over the period\
    \ $[T_1, T_2]$. We have\n\n```\n$L(t, T_1, T_2, I, J) = \\frac{1}{T_2 - T_1} \\\
    left[ \\frac{1}{P(T_1, T_2, J)} - 1 \right]$\n```\n\nand\n\n```\n$L(t, T_1, T_2,\
    \ I, J) = P(t, T_2, I)^{-1} E_t \\left[ e^{-\\int_t^{T_1} r(u, I) du} L(t, T_1,\
    \ T_2, I, J) \right]$\n```\n\n```\n$= \\frac{1}{T_2 - T_1} \\left[ P(t, T_2, I)\
    \ E_t \\left[ e^{-\\int_t^{T_1} r(u, I) du} \\frac{P(T_1, T_2, I)}{P(T_1, T_2,\
    \ J)} \right] - 1 \right]$\n```\n\n```\n$= \\frac{1}{T_2 - T_1} \\left[ \\frac{P(t,\
    \ T_1, I)}{P(t, T_2, I)} E_t \\left[ e^{-\\int_t^{T_1} r(u, I) du} \\frac{P(T_1,\
    \ T_2, I)}{P(T_1, T_2, J)} \right] - 1 \right]$\n```"
  merge: -1
  img_proc: true
- pgno: 140
  md: 'This shows the effect of the discount collateral on the Libfor reward rate
    is linked to the covariance between the discount rate r(·, I) and the spread r(·,
    I) - r(·, j). For moderate maturity effect of changing collateral on the Libor
    forward may be modest but not necessarily negligible.

    After these considerations, we arrive at the following pricing formula for a floating
    rate over the periods {$T_0, \dots, T_K$}:


    ```

    $B(t) = \sum_{k=0}^{K-1} (T_{k+1} - T_k) P(t, T_{k+1}, I) L(t, T_k, T_{k+1}, I,
    J_k)$

    ```


    where $I$ is the index of the collateral of the swap and $J_k$ is the index of
    collateral-the rate for period $k$. For a vanilla swap we typically have $I$ being
    the overnight deposit and $J_k$ being the Libor deposit over {$U_0, \dots, U_N\}$,
    an annuity, we

    For a fixed rate for period given as $S(t) = B(t)/A(t)$.


    ```

    $A(t) = \sum_{n=0}^{N-1} (U_{n+1} - U_n) P(t, U_{n+1}, I)$

    ```


    We see that support for linear interest rate products requires communication between
    model and script evaluator of discount factors with four dimensions (fix date,
    maturity date, collateral, currency) and forward Libor rates with six dimensions
    (fix date, start date, end date, discount collateral, rate collateral, currency).


    # 12.2 EQUITIES, FOREIGN EXCHANGE, AND COMMODITIES


    Equity, foreign exchange, and commodities forwards are generally given by


    ```

    $F(t, I) = P(t, T, I)^{-1} E_t e^{-\int_t^T r(u, I) du} S(T)$

    ```


    where $t$ is the fix date, $T$ is the maturity date, specifies the collateral
    of the forward, and $S(t)$ is the spot price at time $t$.

    We see that supporting equities, foreign exchange, and commodities will require
    four dimensions (fix date, maturity date, collateral, extra) where the "extra"
    is additional information to specify the index that we consider, that is, the
    name of the stock for the equity, the currency pair for foreign exchange, and
    the type of commodity.'
