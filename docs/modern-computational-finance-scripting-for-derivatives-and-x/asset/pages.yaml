- pgno: 204
  md: '# CHAPTER 20

    Condition Domains


    We designed in the previous chapters a general smoothing algorithm (FCE) that
    works as long as all conditions have continuous domains. This is not good enough.
    We cannot smooth our autocollable script because it contains conditions on discretely
    valued expressions. We now address this problem and complete our algorithm.


    First, we discuss the evaluation of the DT of conditions other than continuous,
    provided their domain is known. Then, we discuss how we practically identify the
    domain with dedicated pre-processors.


    # 20.1 FUZZY EVALUATION OF DISCRETE CONDITIONS


    # 20.1.1 Condition domains


    Consider a condition of the type e > 0, e >= 0, or e = 0 where e is some expression
    that evaluates to a number. These three forms cover all elementary conditions
    provided we perform necessary transformations at parsing or pre-processing time.


    We call domain of the condition, or domain of the expression, and denote dom(e)
    the set of all possible values for expression when the script is analyzed in light
    of conventional logic.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 190 MODERN COMPUTATIONAL FINANCE


    When dom(e) is the real space, or at least includes a continuous interval that
    contains 0, we call the condition domain continuous. In this case, equalities
    don''t make sense and inequalities are necessarily strict. The fuzzy evaluator
    as designed in chapter 19 works with all continuous conditions.


    We now explore how we compute the DT of other types of conditions, starting with
    the simplest kind, the constant conditions, where dom(e) is a single number, and
    then making our way toward general ones.


    # 20.1.2 Constant conditions


    dom(e) is the singleton {c}, we call the condition constant. Equities make sense
    and inequalities are not necessarily strict. Our fuzzy evaluator fails to correctly
    evaluate constant conditions. Consider the following example:


    | Date | vCst = 1 |

    |---|---|

    | Date | if vCst > 1 then x = 1 else x = 0 endIf |


    This script may seem irrelevant at first sight, but in practice tests are frequently
    used to quickly switch on and off cash-flows or features in the script. If we
    were to fire our fuzzy evaluator on vCst >= 1, it would (implicitly) evaluate
    a call spread around 0 in vCst - 1, which always evaluates to 0, hence, the call
    spread always evaluates to 0.5, resulting in a DT of 0.5 and a final result of
    x = 0.5. This is obviously wrong, the correct result trivially being x = 1.


    The right thing to do with constant conditions is immediately attempt to true
    or false (DT = 1 or 0) and skip the evaluation altogether. When dom(e) = {c},
    we know that dt(e)=[0] if c=[j]0, otherwise, independently of the scenario.


    The correct fuzzy evaluation of the DT of elementary conditions depends on each
    condition domain. When the domain is continuous, the FCE applies unmodified. When
    the domain is discrete, we need to proceed with a different calculation. When
    it is constant, in particular, the condition must be marked as alwaystrue or alwaysfalse
    so its evaluation reads its pre-calculated DT and skips the evaluation of the
    condition.'
  merge: -1
  img_proc: true
