    \ And on the leaf 10, it stores into R10 the variable y, not its name. The evaluator\
    \ acts on nodes differently to the debugger, the only common action being visiting\
    \ arguments to ensure the whole tree is traversed in the correct order.\n\nSo,\
    \ what happens when a visitor hits a node depends on the concrete types of both\
    \ the node and the visitor. C++ classically provides virtual method overriding\
    \ as a native mechanism for subordinating an action to the concrete type of one\
    \ object. C++ does not provide a mechanism for the subordination of a task to\
    \ the concrete types of two objects, also called double dispatch. In order to\
    \ overcome this limitation, GOF produced the influential visitor design pattern,\
    \ which is explained next in the context of our expressions. We refer to GOF (see\
    \ [12]) or one of the numerous textbooks on design patterns for a more general\
    \ discussion.\n\nFirst, we need a Visitor base class with virtual functions for\
    \ visiting the different node types. Instead of pure virtual functions, we default\
    \ all visits to traversing the node into its arguments. We visitors do not need\
    \ to override the visit methods for nodes that are not of interest to them (for\
    \ instance, a visitor that only looks into variables only needs to override the\
    \ method for visiting variables), the default node traversal method ensuring the\
    \ whole tree is traversed in the correct order.\n\n```\nclass Visitor {\nprotected:\n\
    \    // Protected constructor so the base class cannot be instantiated\n    Visitor()\
    \ {}\n\npublic:\n    virtual -Visitor() {}\n\nprotected:\n    // Default visit\
    \ just visits arguments so as to ensure that\n    // the whole sub-tree is visited\n\
    \    virtual void visitArguments(Node& node);\n```"
