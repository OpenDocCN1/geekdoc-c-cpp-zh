- pgno: 113
  md: '# MODERN COMPUTATIONAL FINANCE


    | | | |

    |---|---||

    | 01Jun2022 | vPerf = (spot() - vRef) / vRef<br>prd pays max(vPerf - STRIKE, 0)<br>vRef
    = spot() | |

    | 01Jun2023 | vPerf = (spot() - vRef) / vRef<br>prd = pays max(vPerf - STRIKE,
    0) | |


    This is a very simple improvement that affects the clarity and maintainability
    of the scripts. The parameters of a product are held in one place, where macros
    are defined under an explicit name that refers to what the parameter stands for:
    STRIKE, BARRIER, THRESHOLD, and so on. The script uses these names rather than
    magic numbers, making it tidier and more understandable. We can change parameters
    without any modification to the core of the script. That means that we can build
    script templates for families of transactions.


    The simplest implementation consists of a replacement of all macros by their definitions,
    before parsing takes place. This means that the strings that initially represent
    events are modified, with macros replaced by their definitions, before these are
    sent to our parser. This is similar to C/C++ macros, which are replaced by their
    definitions before the code is compiled. This means that there is no modification
    necessary to our scripting code. A call to a new function is made before we invoke
    the inputs to the parser.


    This function performs work similar to ctrl + h in Microsoft Office: find macros
    in the script and replace them with their definitions. Such work the raison d''etre
    of the C++11 regex library, which provides a regex_replace algorithm that does
    just that. In addition, the regex library also has necessary functionality to
    implement macros with arguments, similarly to C/C++ macros. This way, we can write
    a script as follows:


    | | |

    |---|--|

    | STRIKE | 120 |

    | CALL(S, K) | max(0, S-K) |

    | 01Jun2021 | opt pays CALL(spot(), STRIKE) |


    However, after regex has done this, our parser receives a single event string
    "opt pays max(0, spot) - 120)." We refer to numerous textbooks and online tutorials
    for the C++11''s regex library.


    However, if we wish to differentiate the product value with respect to any of
    the macro-defined constants, for example, to strike or notional, the replacement
    approach is not sufficient and a dedicated macro or definition node has to be
    implemented.'
