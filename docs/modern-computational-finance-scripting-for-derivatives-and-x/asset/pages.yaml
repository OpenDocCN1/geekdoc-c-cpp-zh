- pgno: 136
  md: '# Introduction


    The previous section discussed improvements in the structure of the scripting
    language. Most of the implementation work took place in the parser or ever string
    transformations prior to parsing. Only support for user-defined functions and
    vectors required (rather light) extensions for nodes and visitors. We did not
    need to discuss models in any way, and in particular, the communication channels
    with models were not altered.


    In this section, we discuss important missing functionality, which is support
    for interest rates, multiple underlying assets, multiple currencies, and the Least
    Squares Method (LSM) for pricing Bermuda options with Monte-Carlo.¹ The implementation
    of such features does not only require the creation and extension of nodes and
    visitors but also considerably complicates the communication with the models.
    So far, we have only communicated the collection of event dates to the models
    before simulations, and models only communicated back the spot and the numeraire
    for all event dates during each simulation. With interest rates and multiple underlying
    assets, when we communicate event dates, we must also specify exactly what it
    is we need from the model on those event dates, and that information needs to
    be figured out exe by a dedicated visitor. For maximal performance during simulations,
    the model needs to write simulated data in prescribed regions of pre-allocated
    memory so that no allocation occurs at runtime. Likewise, the evaluator needs
    to be able to random access simulated data without any type of lookup. This is
    achieved by the indexing of simulated data, similarly to how we index variables
    and vectors, in this case, affects the model, too.


    To correctly implement such extensions takes work. There is considerable implementation
    effort on the extension of our SimulData object (which so far has only held two
    numbers, the spot and the numeraire), the design of a new SimulRequest object
    to represent the information required from the model on different event dates,
    the creation of a new visitor to identify that information from the script and
    index it so it is quickly accessible during scenarios, and accordingly, a profound
    redesign of our ScriptModelAPI


    > ¹See [6], [22], and [18].


    121'
  merge: -1
  img_proc: true
