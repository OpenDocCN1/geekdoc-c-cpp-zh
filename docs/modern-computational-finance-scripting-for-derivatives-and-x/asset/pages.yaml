    # 15.3 ADDITIONAL REGRESSION VARIABLES


    If the callable transaction is itself path-dependent, for example, if its coupons
    depend on some accumulated variance, a proxy to its PV that only depends on the
    state variables may be very inaccurate, in reality, that PV also depends on the
    path dependency, in our example, on the average up to the exercise date. This
    is discussed in Havine and Savage by treating the path-dependency as an additional
    regression variable. That means that the LSM library must accept, in each pre-simulation
    scenario, a collection of regression variables additional to the ones it computes
    out of the state variables by the model. We must support this functionality in
    the language. We do so by adding arguments to the PV keyword as follows:


    ```

    PV(regressedVar, regressionVar1, regressionVar2, ...)

    ```


    These arguments are optional and each is one expression tree.During the LSM step,
    these arguments are evaluated and their result is sent to the LSM library so it
    incorporates them among regression variables.


    # 15.4 FEEDBACK AND EXERCISE


    One question we have so ignored is this: in every pre-simulation, we start with
    the evaluation of all event dates up to and including the proxy date. That includes
    the evaluation of the PV node itself:


    ```

    if PV(swap) > 0

    then vExercised = 1

    else vExercised = 0

    endif

    ```


    > $^2$Note that a optimization may be used. We only need to evaluate the statements
    that, directly or indirectly, affect the coupons of the regressed variable. For
    instance, in our script, the regressed variable is swap, and it does not depend
    on swap any way. Hence, the statements for the payments of the swap don''t need
    to be evaluated. It is actually possible, if not trivial, to identify all the
    chain of dependencies of variables on variables and variables on statements with
    a dedicated visitor, and then use that information to optimize LSM by evaluating
    only events that affect the regressed variable.'
  merge: -1
  img_proc: true
