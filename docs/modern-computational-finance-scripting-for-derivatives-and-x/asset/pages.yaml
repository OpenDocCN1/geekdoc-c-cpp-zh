- pgno: 267
  md: "```\n// Should not stop straight after operator\nif( cur == end)\n    throw\
    \ script_error(\"Unexpected end of statement\");\n\n// Exhaust all L4 (unaries)\n\
    // and above expressions on the rhs\nauto rhs = parseExprL4(cur, end);\n\n// Build\
    \ node and assign lhs and rhs as its arguments,\n// store in lhs\nlhs = buildBinary<NodePow>(lhs,\
    \ rhs);\n\n// No more match, return lhs\nreturn lhs;\n```\n\nThe recursive logic\
    \ is identical to conditions,² and it has been extensively explained in parsing\
    \ of conditions. On each level, the recursion consumes all higher level expressions\
    \ on the left and right of the operator, until no higher level operator is found,\
    \ which it builds a new node depending on the matched operator, sets its arguments\
    \ to the higher level LHS and RHS, makes it the new LHS, and loops for long as\
    \ we keep hitting operators for this level. When it is no longer the case, the\
    \ LHS from the last iteration is returned. At this point, exactly one expression\
    \ has been fully parsed into a tree.\n\n# A.5 PERFORMANCE\n\nWe never found parsing\
    \ to be a bottleneck, even with large sets of long scripts for complex transactions.\
    \ This is especially the case parsing is only performed once, hence its cost is\
    \ typically negligible with respect to the generation and evaluation of scenarios.\
    \ It is in the evaluation that performance must be optimized to the limit, since\
    \ it is performed repeatedly in a potentially large number of scenarios. Parsing\
    \ and visits outside of simulations do not require the same attention.\n\nIf however\
    \ you need for some reason to further improve the performance of the parser, note\
    \ that a very substantial speedup can be achieved without difficulty with multi-threading\
    \ and memory pools.\n\n> ²Actually, one difficulty specific to operators ‘−’ and\
    \ ‘/’ requires extra care. These operators used in sequence are conventionally\
    \ subject to an extra precedence rule, the LHS precedence. For example, “a-b-c”\
    \ must be read “(a-b)-c” not “a-(b-c).” Readers can check that our code respects\
    \ LHS precedence."
