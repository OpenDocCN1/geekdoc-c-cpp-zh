    ```\n// Event = vector<Statement> = vector<ExprTree>\nEvent parse(const string&\
    \ eventString)\n{\nEvent e;\nauto tokens = tokenize(eventString);\nauto it = tokens.begin();\n\
    while (it != tokens.end()) {\n  e.push_back(Parser<decltype(it)>()());\n  parseStatement(it,\
    \ tokens.end()));\n}\n// C++11 --> vectors are moved, not copied\nreturn e;\n\
    }\n```\n\nThis event first tokenizes the event string, then initializes a iterator\
    \ it to the first token and calls the statement parser in a loop. The statement\
    \ parser parses exactly one statement that begins with the it token. It returns\
    \ the (top node of) the resulting expression (sub-)tree and advances it to the\
    \ token that immediately follows the last token in the statement. We record the\
