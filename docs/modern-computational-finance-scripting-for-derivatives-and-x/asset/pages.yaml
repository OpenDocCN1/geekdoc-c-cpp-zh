  md: "# INTRODUCTION\n\nThis product may be scripted as follows (say today is 1 June\
    \ 2020)³:\n\n| | vRef=spot() |\n|---|---|\n| 01Jun2020 | vAlive=1 |\n| 01Jun2021\
    \ | if spot() > vRef then\n prd=110\n vAlive=0\n endlf |\n| 01Jun2022 | if spot()\
    \ > vRef then\n vAlive=1 then prd=120 endlf\n endlf |\n| 01Jun2023 | if vAlive=1\
    \ then\n if spot() > vRef then prd=130 else prd=50 endlf\n endlf |\n\nWe have\
    \ four events on four event dates:\n\n+   1. Today, we set the reference to the\
    \ current spot level and initialize the alive status to 1.\n2. Year 1, we check\
    \ whether the spot increased, in which case we pay redemption + 10% and die.\n\
    3. Year 2, we check that the spot overall increased over two years. In this case,\
    \ we survived year 1, we pay redemption + 20% and die.\n4. Year 3, provided we\
    \ survived the first two, we check if the spot overall increased. In this case\
    \ we pay redemption + 30%. If not, we repay 50% of the notional.\n\nWe see that\
    \ our language must at the very minimum support numbers, arithmetic operations,\
    \ and conditional statements. We also know some mathematical functions like log\
    \ or sqrt and some financial functions such as a multi-argument min and max. Critically,\
    \ we must be able to read, write, and compare variables and access the simulated\
    \ market with a spot() keyword that references the fixing of the underlying asset\
    \ on the correspond-ing date. This is a simple language, similar to Python, that\
    \ supports\n\n> ³We make some arbitrary choices regarding the syntax of our scripting\
    \ language. Readers can easily implement their own preferred grammar once they\
    \ are comfortable with the idioms explained here."
