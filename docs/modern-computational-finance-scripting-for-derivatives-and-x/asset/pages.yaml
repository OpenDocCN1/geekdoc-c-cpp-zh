    \ library, which is self-contained and features its own API that is not related\
    \ in any way to our scripting library. We then show how to connect the two.\n\n\
    The three main pieces of a simulation library are the random number generator,\
    \ the model, and the simulation engine.\n\n# 4.1.1 Random number generators\n\n\
    The random number generator produces the random numbers used for the generation\
    \ of Monte-Carlo paths:\n\n```\n#include <random>\n#include <vector>\n#include\
