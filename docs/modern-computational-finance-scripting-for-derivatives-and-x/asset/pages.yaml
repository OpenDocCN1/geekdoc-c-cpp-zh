    # 14.2 MULTIPLE CURRENCIES


    Financial transactions that depend on assets and rates from multiple currencies
    require a special class of models generally called quanto models or hybrid models.
    They are of course again a collection of correlated single asset or yield curves
    brought together, but this is significantly complicated with multiple currencies.
    First, the model must acknowledge which currency is its domestic currency, and
    all assets and rates denominated in a different currency carry an additional risk
    in their risk-neutral drift, which corresponds to their covariance with the domestic
    currency and is called quanto adjustment. Second, the global correlation matrix
    takes hard work when the individual yield curve models for each currency are themselves
    multi-factor. Third, the (potentially stochastic) rates are (part of) the risk-neutral
    drifts of the assets denominated in that currency and foreign rates, the RN drift
    of a forex includes the difference of domestic and foreign rates, where at least
    one of the rates is itself subject to quantum. Finally, these models are notoriously
    hard to calibrate. A vast amount of effort has been put in the development of
    such models in the early 2000s among academics and Wall Street practitioners to
    correctly manage hybrid products like Callable Reverse Duals. Nowadays, these
    models are reused in the context of xVA, which is an even more complicated option,
    but also depends on multiple assets belonging to different class and currencies.


    We assume such a model is available to us and is able to provide arbitrage-free
    values for the numeraire (in the domestic currency), with asset prices, discounts,
    and Libors belonging to various currencies. A script also needs a notion of what
    is its domestic currency, ideally the same as the model''s, which is the currency
    in which all payments are made unless explicitly stated otherwise. This is also
    the currency in which the evaluation is conducted, hence in which final values
    and risk sensitivities are expressed. Further, we assume the model knows in what
    currency assets and Libors are denominated and is able to find information from'
