  md: '# CHAPTER 5


    # # Core Extensions and the "Pays" Keyword


    Before we close this section, we implement support for basic interest rates and
    cash-flow discounting. Support for payments that depend on interest rate fixings
    is discussed later; for now we only consider the discounting of payments. We however
    consider discounting in a very general way so as to include stochastic discounting,
    coming from example from a Black-Scholes or Dupire model with stochastic interest
    rates. In addition to being an important extension in itself, this paragraph may
    be used as a reference on the necessary steps for the implementation of a core
    extension to the scripting language.


    # 5.1 IN THEORY


    In the absence of interest rates, a product that pays $n$ event-cashflows $C_1,
    \dots, C_n$ on dates $T_1, \dots, T_n$ has value $V = E^{RN}[\sum C_i]$, where
    the expectation is computed under the risk-neutral probability measure. Asset
    prices are martingales under this measure unless they pay dividends or other benefits.


    When models support interest rates, they are often written under the so-called
    risk-neutral probability measure or, equivalently, under the bank account numeraire.
    In this case, we simulate the bank account $B(t) = \exp(\int_0^t r ds)$ together
    with the spot, where $r$ is the instantaneous


    rate, and products with $V = E^{RN}[\sum_{i=1}^n C_i]$. Then, the riskneutral
    drift of assets that do not pay dividends is the rate $r$. Note that it is the
    responsibility of the model to correctly implement drifts. This is not scripting
    anything to worry about.


    Model developers may opt for a diffusion under a different numeraire N. In this
    case, we have $V = N_0 E[\sum_{i=1}^n C_i]$, or, $N_0 = 1$ without loss of


    81'
