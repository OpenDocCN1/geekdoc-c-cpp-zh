- pgno: 236
  md: '# Branching


    which was carried in full by Savine in Danske Bank, is not covered in this

    book. Its result is the ability to script collateralized xVA is follows:


    ```

    Start: TODAY

    End: FINALDATE

    Freq: CFAREQ

    Fixing: end-MPR

    ```


    ```

    collat = PV( ns)

    branchOut( 1)


    V0 = PV( ns)

    onBranch 1 VB = PV( ns) endBranch

    if V0 > VB < collat then

    = nu + ( 1 - rec( StartPeriod ) )

    = * ( surv( StartPeriod) - surv( EndPeriod ) )

    endif

    ```


    ```

    Start: TODAY

    End: FINALDATE

    Freq: CFAREQ

    Fixing: end

    ```


    The keyword branchOut is a marker that tells the simulator to start a

    hair at that event date and give it some name or index. The statements within

    onBranchidx and endBranch evaluate the hair idx. That means that the

    evaluator works as usual, except the simulated values: spot, fwd, and so

    on, including state variables, are picked on that branch. A dedicated branch

    visitor identifies what date a branch is no longer used, so there is no

    need to manually end a branch with a keyword like terminateBranchidx.'
