- pgno: 224
  md: '# CHAPTER 22


    # The Smoothing Factor


    n all that precedes, we consider as given the size EPS of the call spread we use
    for smoothing continuous conditions. In practice, the size of the call spread
    is generally set at a reasonable level by trial and error, from commercial considerations
    (in which case the call spread is one-sided, not centered, so as to produce a
    positive bias as trading margin and a hedge buffer). This is not satisfactory.
    We know that the spread should be set low enough so to minimize the valuation
    bias and large enough to produce sufficient smoothing. It should be determined
    automatically. As using call spreads for commercial purpose, we disagree with
    this (very common) practice. We believe that the spread should be set for maximum
    efficacy and that the trading margin should be coupled endogenously.


    We did not succeed in producing an algorithm that would find the optimal spread
    in all cases, in the sense that it minimizes bias for a given simulation error
    or minimizes error for a given bias. Actually, we proved that it cannot be done,
    since such optimal spread depends on the context. For example, in the condition
    spot > 100, the optimal spread is different if condition is used to determine
    the payoff of a digital or to discretely monitor a barrier. Since it is perfectly
    reasonable that this condition could both in the same script, the notional of
    an optimal spread does not even make sense.


    That does not mean that we cannot do better to use some arbitrary spread for all
    conditions. This chapter investigates what can be done.


    # 22.1 SCRIPTING SUPPORT


    Before we move on to attempting the automatic determination of the spread, let
    us look at exactly how we can set it manually. We could pass a single spread as
    a parameter to the valuation function that the fuzzy evaluator uses it to compute
    the DT of all continuous conditions. To value a script like:


    ```

    01Jun2021 if spot() > 100 then dig pays 1 endIf

    ```'
  merge: -1
  img_proc: true
