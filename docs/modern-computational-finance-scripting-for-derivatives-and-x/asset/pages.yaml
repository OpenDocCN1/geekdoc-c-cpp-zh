  md: '# Expression Trees


    | postorder | node | evaluation | number stack | variable stack |

    |---|---|---|---|--|

    | 0 | | | | opt |

    | 1 | opt | push (address of) opt on variable stack | opt | opt |

    | 2 | 0 | push 0 on number stack | spot | opt |

    | 3 | spot() | push spot on number stack | spot | opt |

    | 4 | 100 | push 100 on number stack | 100 spot | opt |

    | 5 | | pop 2 top elements from number stack subtract 1st from 2nd push result
    on number stack | spot-100 0 | opt |

    | 6 | max | pop 2 top elements from number stack push largest on number stack
    | | |

    | 7 | = | pop top elements from both stacks assign number to variable | | |


