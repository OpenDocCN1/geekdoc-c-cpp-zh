  md: '# An Automated Smoothing Algorithm


    # 18.2 NESTED AND COMBINED CONDITIONS


    We may also verify that our algorithm correctly deals with nested conditions.
    For instance, with an inner conditional block among the ifftrue statements of
    the outer block, the inner block''s true statements are weighted by the product
    of the degrees of truth (DTs) of the outer and inner conditions. Our algorithm
    implicitly processes nested conditions by multiplying the DT of the inner condition
    by the DT of the outer condition. And since nested conditions correspond to an
    and or operator, this means that the algorithm implicitly applies:


    ```

    $$dt ( A and B) = dt ( A ) * dt ( B)$$

    ```


    For consistency, we should apply the same for conditions explicitly combined with
    and. We also used degFalse = 1 - degTrue, so we applied:


    ```

    $$$dt ( not A ) = 1 - dt ( A)$$

    ```


    We see that DTs combine like probabilities, so for consistency we also use:


    ```

    $$$dt ( A or B ) = dt ( A ) + dt ( B ) - dt ( A ) * dt ( B)$$

    ```


    Formulas (1), (2), and (3) provide the computation of the DT of combined conditions
    as a function of the DTs of their elementary conditions, which completes our algorithm.


    # 18.3 AFFECTED VARIABLES


    We now have a fully working smoothing algorithm for continuous conditions, but
    it may be terribly inefficient. We are storing intermediate values of all variables
    involved in the script, twice, for every conditional block. Scripts for xVA or
    other portfolio-based risk calculations may have hundreds of thousands of variables.
    We should copy them all (twice!) for the evaluation of every conditional block,
    where some may modify the value of one variable only?


    The only variables that should be recorded and restored as part of our algorithm
    are the variables that are affected in the condition block, meaning variables
    that are assigned or paid into the ifftrue or iffalse statements of'
