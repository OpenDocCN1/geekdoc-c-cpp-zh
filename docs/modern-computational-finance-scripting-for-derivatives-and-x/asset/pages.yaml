  md: '# Condition Domains


    # 20.1.6 Putting it together


    We finally know the formulas for the DT of all types of elementary conditions.
    The FCE algorithm correctly evaluates all conditional blocks provided that the
    correct formulas are used for DTs. These formulas also provide DTs of combined
    conditions (by the application of probabilistic style combinations) and nested
    conditions (the FCE automatically and implicitly multiplies the DTs of outer and
    inner conditions, consistently with how the and combinator evaluates.


    In order to implement our formulas in the derived evaluator, we need to know,
    for all elementary conditions, their domains and whether they are always true
    or always false. This is to be determined by a visitor that pre-processes the
    script before simulations take place and stores domains and flags true/false on
    the elementary condition nodes. We design this visitor next. First, we summarize
    the correct formulas for the DT of all expressions knowing their domain and always
    true/false status.


    +   1. If the condition is marked as alwaystrue, dt = 1.

    2. If the condition is marked as alwaysfalse, dt = 0.

    3. If the condition''s domain is continuous, its dt = flf(e, 1, 0, EPS).

    Note that with continuous domains, equalities don''t make sense and inequalities
    are all deemed strict.


    +   4. If the condition domain is a discrete {e_0,e_1,...,e_n} such that the condition
    is not always true or false (otherwise it would have been caught earlier):

    (a) If the condition is a strict inequality of the form e > 0, find the pair {e_{i},e_{j}}
    in {e_0,e_1,...,e_n} such that e_{i} is the largest non-positive e_{i}, and i_{j}
    = i_i + 1, and apply:


    ```

    e \leq e_i → DT(e > 0) = 0

    e \geq e_i → DT(e > 0) = 1

    e_i < e < e_j → DT(e > 0) = \frac{e-e_{i}}{e_{j-1}-e_{i}}

    ```


    +   (b) If the condition is a non-strict inequality of the form e >= 0, apply
    the same formula except that e_i is the largest strictly negative e_{i}.

    (c) If the condition is an equality of the form e = 0, then one of the e_i is
    0 and there is at least another e_i that is not 0, otherwise the condition would
    have been caught as constant. e_{i-1} the largest'
