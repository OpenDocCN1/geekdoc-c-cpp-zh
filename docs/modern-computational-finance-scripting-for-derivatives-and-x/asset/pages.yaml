  md: "# Visitors\n\nWhen a statement x = y is executed during simulations, the evaluator\
    \ must look up a variable named y and read its value, then look up the address\
    \ of another variable named x, and write the value of y into it. These lookups\
    \ occur every statement with variables, in all the simulated scenarios, causing\
    \ an unacceptable performance drain. We evaluation of scripted products to match\
    \ the performance of efficient hard-coded pricers. This is not going to happen\
    \ if we look up names repeatedly at runtime. We need the evaluator to pick directly\
    \ the values and addresses of variables in memory. Hence, variables must be pre-indexed,\
    \ so that, if, x index 3 and y index 7, x = y is read by the evaluator as var[3]\
    \ = var[7] with a direct, random access.\n\nTo perform indexing before simulations\
    \ take place, we use a visitor that we call variable indexer. This particular\
    \ visitor traverses all the trees like all the visitors, while visiting variables,\
    \ it counts them and sets their unique index on node. Not only is indexing strong\
    \ performance requirement, it also highlights some desirable features of visitors\
    \ that did not appear clearly in the debugger:\n\n+   1. Visitors only overriding\
    \ methods for the nodes they are interested in, in this case, variable nodes.\
    \ The whole trees will still be traversed, courtesy of the default visit methods\
    \ in the base visitor class. Here, some visitors' code may be compact.\n2. Visitors\
    \ hold a state that they carry over as they visit sequences of trees and iterate\
    \ through statements and events, updating their state accounting to the nodes\
    \ they visit, and using the information gathered on post nodes as they visit the\
    \ current ones. In this case, our indexer keeps a map of all the variables encountered.\n\
    3. Visitors are not limited to reading information stored in expression trees.\
    \ The variable indexer writes the index of variables in the variable nodes. Other\
    \ visitors may even modify the structure of the trees.\n\nFirst, we need to add\
    \ an index to the variable nodes:\n\n```\nstruct NodeVar : Node\n{\n    string\
    \ name;\n    unsigned index;\n\nvoid acceptVisitor(Visitor& visitor) override;\n\
    };\n```\n\nThen, we develop the visitor. This particular stops only for variables,\
    \ so it overrides every visitVar() method, making its code very compact. Furthermore,\
    \ it carries a state coming from all the variables it has visited since its construction\
    \ as a map from variable names to their index."
  merge: -1
  img_proc: true
