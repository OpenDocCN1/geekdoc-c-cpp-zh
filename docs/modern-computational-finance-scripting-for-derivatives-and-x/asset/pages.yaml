  img_proc: true
- pgno: 159
  md: "# 144 MODERN COMPUTATIONAL FINANCE\n\nthese state variables, but that function\
    \ is not known. To compute it would normally require nested simulations (Monte-Carlo\
    \ within Monte-Carlo), which is obviously inefficient. LSM resolves the problem\
    \ by use of regression proxies that approximate the PV on the exercise date as\
    \ a more precisely a linear function of regression variables, themselves functions\
    \ of state variables. The regression proxies are produced during an LSM step that\
    \ occurs before the Monte-Carlo simulations. The LSM step uses some pre-simulations,\
    \ typically a reduced number of simulations, where the PV at the exercise date\
    \ of the subsequent cash-flows is regressed onto the value of the regression variables\
    \ at the exercise date across several scenarios. The regression coefficients are\
    \ stored and reused during the main Monte-Carlo simulations to estimate the PV\
    \ knowing the simulated regression variables. The efficiency of the LSM algorithm\
    \ crucially depends on how well the chosen of basis functions spans the value\
    \ of the product. It also requires the number of pre-simulations to be sufficiently\
    \ large to accurately estimate the regression coefficients.\n\nWhen a transaction\
    \ is callable on multiple exercise dates, what we call a Bermuda option, regression\
    \ proxies must be computed recursively, to first, since the PV of the cash-flows\
    \ subsequent to some exercise date depends on the exercise strategy for the future\
    \ exercise dates.\n\nThe LSM algorithm has been a golden standard for callable\
    \ transactions in the context of Monte-Carlo since it emerged in the early 2000s.\
    \ More recently, it has been widely adopted for the counterparty value adjustment\
    \ (CVA) and various regulatory calculations. We remind that a CVA is a complicated\
    \ option written on the entire set of transactions against some counterparty,\
    \ or netting set, with payoff:\n\n$$\\sum_{i} (1 - R(T_i)) 1_{\\{T_i \\le \\tau\
    \ < T_{i+1}}} \\max(0, V(T_i))$$\n\nwhere $\tau$ is the default time, $R$ the\
    \ recovery rate, and $V_{T_i}$ is the PV of the setting set at exposure time $T_i$,\
    \ that is, the PV at that time of all future cash-flows from all the transactions\
    \ in the netting set. In the context of CVA, we need an estimate of the future\
    \ PVs not to make a decision on exercise, but because those PVs are part of the\
    \ payoff.\n\nLSM is a key part of a modern quantitative library, and we must support\
    \ it in our scripting language. Otherwise, we could not script callable transactions\
    \ or CVA and the language would be limited in scope and use.\n\nIMPORTANT for\
    \ our purpose, LSM, unlike the scripting library itself, is model agnostic and\
    \ should be implemented model independently in such"
