- pgno: 110
  md: '# CHAPTER 6


    # Past Evaluator


    Once development needed for production is the support for past events. Once a
    product like a barrier option is booked, the script is meant to remain unchanged
    throughout its life cycle. When its value and risk sensitivities are recalculated
    at a later date, some events, like barrier monitoring, occur in the event. Simulations
    always start at the valuation date. To evaluate past events, we need another visitor,
    a dedicated pre-processor that evaluates past events before simulations take place.
    This pre-processor is actually an evaluator, and works exactly like the ordinary
    evaluator, except it picks market data on a historical database instead of simulated
    scenarios. In other words, this is a “past evaluator” that derives from the evaluator
    and overrides the visits to nodes that pick market data (so far, only the spot
    node). The final state of the evaluator after all past events are evaluated is
    the initial state to which the actual evaluator is reset on each simulation. The
    state of an evaluator consists of the value for all variables. Hence, the starting
    value for all the variables in the simulations are their final values from the
    evaluation of past events by the derived evaluator. For instance, consider a barrier
    script that uses vAlive, a variable that starts at 1 the trade date and changes
    to 0 when the barrier is hit. In evaluating past events, the past evaluator produces
    a final value for vValue at the valuation date of 1 if the barrier was not hit,
    or 0 if it was. Let''s call vValue0 the value of vValue after past event evaluation.
    During simulations, the value of vValue is reset to vValue0 before each simulation
    starts. In addition, the cashflows paid in the past must be disregarded. So the
    pays visitor must also be derived in the past evaluator to flag the payment and
    instantiate it being sent to the client, rather than adding it to the variable
    in question. The variables in the main evaluator are no longer reset to 0 before
    each simulation, but to the output of the past evaluator.'
