    We know that no change is necessary for unconditional endifs. We transform only
    conditional blocks “if... then ... [else]... endif,” including conditional statements
    and nested conditional blocks if. In our toy script, only the event for Date2
    needs work. Intuitively, it could be smoothed with the somewhat simplistic (but
    flawed) algorithm (where EPS is our smoothing factor):


    +   1. Replace elementary conditions by functional equivalents to compute the
    degree of truth degTrue of the condition. Denote


