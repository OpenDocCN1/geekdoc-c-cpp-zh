  md: "# Visitors 55\n\nWe will also see exceptions to this rule in section II on\
    \ basic improvements, where a lot of small operations can effectively be conducted\
    \ at parsing time, or even before that, as string manipulations, where the development\
    \ of dedicated visitors would be overkill.\n\n# 3.5 CONST VISITORS\n\nThe variable\
    \ index modifies the trees it visits when it sets indices on the variable nodes.\
    \ Our debugger, on the other hand, only traverses trees to pick information and\
    \ does not modify trees however as it visits them. The debugger is a *const visitor*.\n\
    \nWhile the distinction is not a major concern in the case of the debugger, which\
    \ is essentially a development tool, it does matter a lot in the case of the evaluator,\
    \ described next, which is also a const visitor.\n\nThe evaluator is not meant\
    \ to modify trees on visits. It only reads information stored inside the nodes\
    \ it traverses and uses this information to perform calculations and store results\
    \ inside its data members. The evaluator is a const visitor, and it is important\
    \ to keep it this way for the sake of thread safety.\n\nWhen we multi-threaded\
    \ Monte-Carlo simulations over scenarios with scripted transactions, we use different\
    \ evaluators on each thread, and all evaluators visit the same trees in parallel.\
    \ To avoid race conditions, evaluators must absolutely refrain from modifying\
    \ the visited trees in any way. And it is advisable to structure the code to guarantee\
    \ the constness of the visited trees during evaluations.\n\nWe therefore declare\
    \ a *constVisitor* class, along the *Visitor class*, that essentially does the\
    \ same thing, except it ensures the correctness of the visited nodes. There is\
    \ some code duplication here, so we essentially need to duplicate the definition\
    \ of the *Visitor* class and the `acceptVisitor()` methods in all concrete *Node*\
    \ classes. This operation could be templated, but the resulting code would end\
    \ up esoteric, so we settled for an old-fashioned duplication.\n\nWe have the\
    \ declaration of the *constVisitor* class along Visitor:\n\n```\nclass constVisitor\
    \ {\nprotected:\n  // Protected constructor so the base class cannot be instantiated\n\
    \  constVisitor()\npublic:\n  virtual -constVisitor() {}\nprotected:\n  // Default\
    \ visit just visits arguments\n  // so as to ensure that the whole sub-tree is\
    \ visited\n```"
