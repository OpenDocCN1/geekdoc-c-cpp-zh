- pgno: 38
  md: '# Opening Remarks


    For these frequently traded products, it is practical to use templates, implemented
    on spreadsheets or higher level languages, that generate the script automatically
    out of a small number of inputs.


    Templates are typically used for vanilla swaps, European options or first-generation
    exotics (short-term forex barrier options). They combine the practicality of hard-coded
    transactions with the benefits of scripting. Many transactions are also regarded
    as “almost” vanilla swaps, “almost” European, or “almost” standard barriers. In
    these cases, it is most practical to start with a template and modify the auto-generated
    script by hand. Templates are also useful when some transactions are booked in
    a separate system, which is often the case for, say, vanilla swaps. To aggregate
    these transactions with the rest of a netting set for the calculation of an xVA,
    for example, those transactions can be scripted on the fly with template code.


    This logic may be pushed a step higher, with the design of GUIs, programmed in
    a language like C#, so that finance professionals without programming expertise,
    or customers, may build transactions by assembling blocks on a graphical representation
    of the transaction. This graphical representation is then automatically turned
    into the corresponding script.


    Writing templates is trivial and a template can be implemented directly in a spreadsheet
    without code. To write a GUI platform for the design of transactions and translate
    that graphical representation into a script is perhaps more advanced. It certainly
    requires an expertise in GUI design, something out of the scope of this publication
    but covered in many recent C# or Python textbooks.'
