- pgno: 42
  md: 'We broke the entire statement down into a hierarchical representation of its
    items, where each item represents an elementary calculation or action, which may
    depend on a number of arguments, which are themselves expressions broken down
    into a hierarchical representation of its items, and so far, down to special,
    self-contained items that represent operations without arguments:


    ![](img/3887ab6b5277fb99d77002948fa19470_42_0.png)


    # A recursive definition


    This recursive, hierarchical representation of the items in an expression, which
    we just performed manually, is called an expression tree. The process of establishing
    the tree for an expression is called *parsing*. We just pasted a statement manually,
    as a pedagogical exercise, although parsing, thankfully, can be fully automated.
    Our appendix explains the parsing process in words and code.


    The items in an expression tree are called *nodes* and represent elementary operations,
    those “atomic” operations that cannot be further broken down. Expression trees
    are always identified by their top node. The arguments to an operation are themselves
    expression trees, identified by their own top nodes, which we call the *child
    nodes* to the parent operation. Operations without arguments like constants or
    variables are *leaves*. The definition of an expression tree is a recursive one.
    An expression tree is identified by a top node. A node represents an operation
    and may have children, themselves expression trees identified by their top nodes.
    Expression trees without children are leaves. For now, we have three types of
    leaves: constants, variables, and simulated data.


    Readers familiar with GOF design patterns recognize the so-called *composite pattern*
    where a whole is a collection of parts all identical in nature (in the sense of
    a virtual base class) to the whole, see [12]. In the composite pattern, it is
    the nature of a node (in the sense of a concrete class)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 28 MODERN COMPUTATIONAL FINANCE


    not the data it stores, that represents a particular operation. The top node in
    our statement is an assignment node. The data it holds are a pair of references
    to its kids, the top nodes of its LHS and RHS (sub-)trees, base class pointers
    to the top nodes of those trees, in accordance with the composite pattern. An
    expression tree is therefore a recursive structure, and a peculiar one, that it
    represents an expression in its DNA, and not its contents.


    Expression trees are designed so they can be visited. For now, let focus on one
    particular form of visit, that is, the execution of the statement, also called
    the evaluation of the tree, given a scenario for the simulated data.


    Evaluate an expression tree means evaluate its top node, in our example, perform
    an assignment. The assignment cannot be performed before the variable being assigned
    is identified and the assigned amount computed. Hence, the evaluation of the assignment
    node starts with the evaluation of child nodes. Only then can the assignment be
    executed. Hence, the opt node is evaluated first so the assigned variable is known,
    followed by the evaluation of the RHS tree to calculate the assigned amount. In
    the recursive manner, to evaluate that tree means evaluate its max node, which
    requires first, an evaluation of its arguments (then, we keep the largest). The
    first argument to max is a constant leaf that evaluates to 0, while the second
    argument is another (sub-)tree with a top node - Hence, the evaluation of - triggers
    the evaluation of max, which triggers the evaluation of -, which triggers the
    evaluation of spot() (which evaluates to the underlying asset price) and the constant
    100. The evaluation order is fired on the node, but because the arguments to an
    operation evaluate before that operation, the effective evaluation always and
    automatically proceeds bottom-up, leaves to top.


    It is a general property of expression trees that fired on the top node, always
    proceeds bottom-up. This is an immediate consequence of the rule, hard-coded in
    the evaluator, and many other visitors, that the visit of every node begins with
    a visit to its arguments. Hence, a visit to the top node recursively visits the
    whole tree, bottom-up, starting with leaves and ending with the top node. Each
    node is visited exactly once. Such traversal is called depth first (because it
    starts with the leaves), or postorder (because kids are visited before their parents).


    Notice also that, in order to evaluate the sequence opt, 0, Spot(), 100, -, max,
    = into a given scenario for the top node, intermediate results must be stored
    while the tree is being visited. The data structure most appropriate to hold these
    results is a stack, also called LIFO (Last In First Out) container, that returns
    its contents in the reverse order from their acquisition. The following figure
    shows the state of the stack after the evaluation of the nodes in the postorder
    sequence:'
