- pgno: 24
  md: '# Opening Remarks


    for the same call with a 120 (weekly monitored) knock-out barrier.¹


    The scripts are parsed into expression trees, and visited by an evaluator, a particular
    breed of visitor, who traverses the trees, while maintaining the internal state,
    to compute payoffs over the scenarios generated by a model:


    | Model | Product |

    | --- | --- |

    | | Call |

    | | Date Event |

    | | expiry opt pays max (0, spot) - strike) |

    | Evaluator -depth first visitor |

    | Visit | Node | Stack |

    | 1 | spot | spot |

    | 2 | const strike, spot | spot |

    | 3 | | strike, spot |

    | 4 | const D | strike - spot |

    | 5 | max | max(0, strike - spot) |

    | 6 | var | &spot, max(0, strike - spot) |

