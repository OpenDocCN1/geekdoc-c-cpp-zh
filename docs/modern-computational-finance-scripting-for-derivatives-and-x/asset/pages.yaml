- pgno: 162
  md: '# American Monte-Carlo


    # 15.2 ONE PROXY


    We start the discussion with a single proxy at a single date, as in our swaption
    script.


    During simulations, PV are estimated, in the evaluator''s visitor for the PV node,
    with the formula:


    ```

    PV = \sum_{i=0}^{n} \beta_i X_i

    ```


    where:


    +   - n is the number of regression variables, excluding the unit variable, and
    must be provided by a function from the LSM library, giving the number of state
    variables, which is exposed by the model.

    - X_i are the regression variables simulated in this scenario for that date. They
    are computed by a function from the LSM library, given the stated variables, which
    are communicated by the model through the SimulData object.

    - β_i are the regression coefficients that are produced by the LSM algorithm for
    that proxy (the LSM algorithm runs before Monte-Carlo simulations and does nothing
    else than computing these). They are stored on the PV node.


    Note that during simulations, the PV node does not use its argument, the variable
    for which it however obviously used in the LSM step. By construction, the child
    node to PV is the variable node and holds its index.


    During the LSM step, the LSM library conducts a regression of the PVs of subsequent
    cash-flows on that variable over the regression variables simulated for that event
    date. If the LSM library performs a standard regression, that calculation consists
    of the well-known matrix computation:¹


    ```

    \beta = (X''X'')^{-1}(X''Y)

    ```


    > ¹A better alternative is to use a Tikhonov-regularized SVD regression, as explained
    in Huge and Savine [18].'
  merge: -1
  img_proc: true
