- pgno: 12
  md: '# # My Life in Script by Jesper Andreasen


    Antoine came to General Financial Products in London in 1998 with a lot of youthful
    spirit and many refreshing ideas. One of them was a financial payoff language
    called SynTech (Syntactic interpreter). I am not sure that I was immediately convinced
    but when he connected it to a real model and priced some structures that we made
    up on the fly, I was hooked. I learned SynTech in hours but it took me months
    to figure out how it was put together, a process that forced me to learn structured
    programming in general and C++ in particular.


    As always, it was a general struggle to keep up with the financial innovation,
    constant re-coding of new payoffs was a painful and error prone process. We had
    been trying with a cocktail of Visual Basic for scripting of the payoffs and scenarios
    of features generated by C programs. However, the implementation was slow, model
    specific, hard to use, and generally more than elegant.


    SynTech, however, was easy to use with a readable Basic-like syntax and thoroughly
    built for speed and versatility. Scripts were pre-processed to cache and index
    static information for maximum pricing speed, and its API allowed a seamless hook-up
    with any dynamic model in our library. In fact, it took Antoine very little time
    to hook up SynTech to our newly developed Libor Market Model.


    Further, it was clear that SynTech could be extended to perform various life cycles
    with such fixings and payments to limit the manual burden on the back office in
    the handling of exotic trades. SynTech implemented a clear separation between
    instrument and model.


    From then on, I have only used scripting languages as the interfaces for all the
    models I have developed. And when I need to price something I rarely use anything
    else naked scripting. The scripting languages that I have used and developed have
    all had a syntax very close to the original SynTech. The developments that I have
    done have been underneath. Remarkably, SynTech''s original 50 keywords still cover
    the ground.


    SynTech was inspired by developments Antoine had at previous occupations, most
    notably the GRFN system at Paribas. Other quants spread out from Paribas and seeded
    ideas and developments of scripting'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'languages at other institutions, for example, at UBS, Commerzbank, Nikko-Salomon,
    Citi, and Reech Capital.


    Paribas''s GRFN developed by Guillaume Amblard and Societe Generale''s Optl by
    Jean-Marc Eber were as far as we know the scripting languages that were used on
    an industrial scale. Jean-Marc Eber went on set up the company Lexifi, which by
    date supplies the industry with scripting technology.


    GRFN and Optl emerged in the mid-1990s. There were, for sure, earlier attempts
    to develop scripting languages, most notably various of the LEX-YACC suite of
    tools for creating languages. Emmanuel Derman mentions such efforts in passing
    in My Life as a Quant and I have heard of similar experiments at JP Morgan. However,
    to know myself, none of these made it to large-scale production.


    In 2001, I went to Bank of America in London, where I hanged with James Pfeiffer
    and developed Thor. The main innovation of Thor was the use of the visitor pattern
    technology that was instrumental in using scripting as the backbone for xVA and
    regulatory calculations. The main idea of the visitor pattern is to have visitors
    visit the cash flows for different purposes: pre-processing, valuation, dependency
    graph generation, compression, decoration, and so on. The diverse use of visitors
    shows that development of your own scripting language is necessary. Python or
    C# can not be visited.


    In 2002–2005 I worked for Nordea in Copenhagen where we developed a scripting
    language called Loke. The main innovation during this period was the integration
    of American Monte-Carlo techniques with Loke, including upper-bound techniques
    implemented by Oe Scavenius.


    In 2005–2008 I was with Bank of America, however, I found the Thor language be
    heavily used by the structured interest rate and equity desks. Often they used
    a marco language called Sif, developed by Mohan Namamasivam, to generate Thor
    scripts.


    At Danske Bank, which I joined in 2008 and in 2018, the scripting language is
    called Jive. From vanilla swaps to mortgage bonds to equities to regulatory capital.
    Jive is even used in the yield curve calibration. This is the only bank that I
    know of uses a scripting language consistently. Developments have mainly concentrated
    on aggregation, compression, and decoration used for xVA and regulatory calculations.
    Here, we have heavily leveraged the visitor pattern technology. But we also have
    done significant work on Automatic Adjoint Differentiation (AAD), multi-threading,
    branching simulations, and fuzzy logic to stabilize risk calculations. Antoine
    joined Danske in 2013, and then he played a key role in these develop-ments. In
    2015, we received Risk Magazine''s In-House Risk System of the Year award for
    our xVA system. The AAD and the speed of the calculations'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# My Life in Script by Jesper Andreasen


    achieved by the xVA system have received a lot of attention in the quant community,
    the scripting and visitor pattern technologies are actually the unsung heroes
    who have made all of this possible.


    To document how we did xVA on an iPad Mini without thoroughly describing our approach
    to scripting would be wrong and not give the reader the full picture. I was therefore
    very happy when Antoine told me he was going to write a book on scripting. This
    would give us the opportunity to finally get our work on scripting languages documented
    and pave the way for fully documenting our xVA system.


    There are a number of reasons why the story of scripting has not been told before.
    Among these:


    +   - It''s not mathematics, but software design, which is actually something
    that we do every day but not something that we usually write about.

    - It''s a complex and relatively long winding story that cannot easily be summoned
    in a few punchlines. On top of this contains subjects that most people haven''t
    even heard about, such as visitors and pre-processors.

    - It''s a hard and has no conventional wisdom that scripting is only for exotics
    and has no relevance in post-crisis finance. Actually, scripting is more relevant
    now than ever, because banks are under tough regulatory and cost pressures.

    - It''s very C++ and as not following the current trend of lighter languages such
    as Matlab and Python backed by GPUs running parallel instructions in C.


    +   - The subject is still very much alive: whenever we start documenting our
    efforts, we always get new ideas that we can do with scripting, which in turn
    tends to take away focus from documenting past glories.


    My next employer is Saxo Bank and the scripting language there be Jife.


    Jesper Andreasen, June 2018'
  merge: -1
  img_proc: true
