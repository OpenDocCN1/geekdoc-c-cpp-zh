- pgno: 220
  md: '# Limitations


    is trivially verified in conventional logic A or not A = true but that does not
    hold with fuzzy logic. Unfortunately, sharp logic is hard-wired in our DNA, and
    such assumptions come naturally to us and may lead us to write scripts implicitly
    based on them that produce fuzzy results with fuzzy logic.


    Another example comes from our simplified autocallable. Recall the line:


    ```

    if spot() > vRef then

    vAlive = 1 then prd pays 120 endIf

    vAlive = 0

    endif

    ```


    This works with fuzzy logic. But we could have written instead:


    ```

    if vAlive = 1 and spot() > vRef

    then prd pays 120

    vAlive = 0

    endif

    ```


    This is more compact and at first sight identical. In both cases, we provide 120
    that vAlive = 1 and spot() > vRef. The difference is in the second script, the
    assignment vAlive = 0 is subject to vAlive being 1 to start with. This is not
    correct in principle. The rule is that the transaction dies if the spot fixes
    above the reference. But if the transaction was to start with, then it was already
    dead, and there is no need to kill it, right? Wrong. With fuzzy logic. If the
    transaction is partly dead from a former fixing the fuzzy region, it still needs
    further killing in part or when the spot fixes above the reference or in a fuzzy
    region around it. Again, the implicit reasoning behind the second script is that
    the deal has to be either alive or dead when we evaluate the event, in case vAlive
    is not I, then it is 0, and we can skip the assignment vAlive = 0. Such reasoning
    does not hold with fuzzy logic and produces wrong results.


    We should stick to hard rules when writing scripts and absolutely refrain from
    introducing additional logic like “if spot did not fix above 100 then for sure
    it fixes below 100” or “if the transaction is not alive then it is dead.” Never
    subordinates to the implicit assumption that (A and not A) is necessarily false,
    or (A or not A) is necessarily true. That is no longer correct with fuzzy logic.
    Stick to the hard description of cash-flows and do not introduce logic that may
    no longer hold during fuzzy evaluation.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 21.2 NON-LINEAR USE OF FUZZY VARIABLES


    The second limitation we identified is more problematic. The rule is: fuzzed variables
    may not be safely used in non-linear expressions.


    Fuzzed variables are those variables that are affected (assigned or paid into)
    in conditional blocks. For example, the following script fuzzes x into domain
    (–1, 1):


    ```

    Date1 if spot() > 100 then x = 1 else x = -1 endif

    ```


    After a fuzzy evaluation of the conditional block, it is okay to test these variables
    in conditions. We designed fuzzy evaluation accordingly. For example, say we receive
    a share if we fixed above 100, pay it if we fixed below:


    ```

    Date2 if x = 1 then prd pays spot() else prd pays -spot() endif

    ```


    It is also OK to assign or pay an expression that involves fuzzed variables linearly.
    Remember that fuzzed variables are aggregates of their crisp values weighted by
    the partial of the crisp value assigned. To use them to multiply an expression
    means to apply the expression to the combined notional, which is perfectly valid.
    For example, we could have written:


    ```

    Date2 prd pays x * spot()

    ```


    Note that those variables that are assigned an expression involving fuzzed variables
    are themselves fuzzed in the process, which means that the same rules apply to
    them thereafter.


    It is not okay to use fuzzed variables in a non-linear expression, either for
    test, assignment, or payment. For example:


    ```

    Date2 prd pays spot() / x

    ```


    This script works (miraculously) with sharp logic. When the spot fixed close to
    100, x is fuzzed to 0 and the system crashes. While nobody in their mind would
    write this line, this limitation is quite restrictive in practice. Consider a
    European call where their strike depends on a previous fixing:


    ```

    Date1 if spot() > 100 then k = 100 else k = 90 endifnDate2 prd pays max(0, spot())
    - k

    ```'
  merge: -1
  img_proc: true
