- pgno: 180
  md: '# Risk Sensitivities with Monte-Carlo


    # 16.2 TWO APPROACHES TOWARD A SOLUTION


    The problem with Monte-Carlo and discontinuities is well known and the financial
    community has been dealing with it for decades. Two families of solutions have
    emerged. One works on the distribution $\varphi_a$ of the scenario. The other
    focuses on the payoff $f$ that is applied to the generated scenarios.


    The first solution differentiates the general formula for the theoretical value
    of a transaction (possibly modulo discretization in time): $V = E^a[f(\hat{X})
    = \int f(\hat{X}) \varphi_a d\tilde{X}]$ where $\varphi_a$ is the joint (risk-neutral)
    distribution, parameterized by $a$, of all the components of the scenario: all
    the market variables on all the event dates. Therefore


    ```

    $$\frac{\partial V}{\partial a}=\int f(\hat{X}) \frac{\partial \varphi_a(\hat{X})}{\partial
    a} d\tilde{X} = \int f(\hat{X}) \frac{\partial \log \varphi_a(\hat{X})}{\partial
    a} \varphi_a(\hat{X}) d\tilde{X} = E^a[f(\hat{X}) \frac{\partial \log \varphi_a(\hat{X})}{\partial
    a}]$

    ```


    In other terms, $\frac{\partial V}{\partial a}=E^a[g(\hat{X})]$ where $g(\hat{X})=f(\hat{X})\frac{\partial
    \log \varphi_a(\hat{X})}{\partial a}$


    To compute a sensitivity we calculate the value of another payoff in the same
    model. The new payoff is the original payoff multiplied by the derivative of the
    path-dependent derivative of the scenario. This is like pricing a (somewhat twisted)
    path-dependent derivative transaction, and it can be done with standard Monte-Carlo
    simulations. Crucially, we end up differentiating (generally differentiable) joint
    distribution instead of a non-differentiable payoff. Unfortunately, the practical
    implementation of this highly elegant solution is not general or practical. The
    path-wise calculation


    $$\frac{\log \varphi_a(\hat{X})}{\partial a}$ with Malliavin''s calculus is intractable
    or unstable depending on the model. We refer to Andreasen''s summary of 2007 [2]
    for details. How this calculation is conducted depends the model and its implementation,
    and it must be repeated for all models. For these reasons, the industry generally
    settled for the much simpler solution


    of approximating the payoff $f$ with a "close enough" continuous function $\hat{f}$.
    The value is estimated with $E^a[\hat{f}(\hat{X})] \approx E^a[f(\hat{X})]$, which
    effectively removes discontinuities and resolves the problem. This solution performs
    remarkably well in practice, despite its simplicity, and is implemented in a model
    agnostic manner, hence its success.'
  merge: -1
  img_proc: true
