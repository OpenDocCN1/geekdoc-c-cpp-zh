- pgno: 141
  md: '# 12.3 LINEAR MODEL IMPLEMENTATION


    The most efficient way of implementing support for linear products is if the model
    is only required to produce exactly the discount factors and forwards that are
    needed at each event date, and if any node that requires a forward and discount
    factor knows exactly where in memory these quantities sit.


    This avoids expensive calculations, for example, in the case where the discount
    factors are not known in closed form for the particular interest rate model used,
    and it avoids costly lookups when the node needs to search for a specific maturity
    discount factor or forward in an ordered table. This thus requires two visitors:


    +   * *A processor* for each event date identifies exactly what maturity discount
    factors and forwards are needed for all the nodes in the expression trees

    * *An indexer* for each node identifies where in the aggregated collection of
    market data the required piece of information is located


    Use of these visitors runs in two steps: first, the processor visits all nodes
    to gather information about what linear price data is required at what date. These
    data are ordered for subsequent lookup.


    Second, the indexer visits the expression trees and for each node it identifies
    exactly at what slot in memory the required data are located. The position is
    recorded on each node and this is used during evaluators for direct access. This
    way, lookup is performed only once, at the indexer stage, and not by the evaluator.


    In the processor stage, information is aggregated from the nodes of the expression
    trees. In the indexer stage, information is set on the nodes of the expression
    trees.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Fixed Income Instruments\n\nIn this chapter we draw on the theoretical considerations\
    \ of chapter 12 and implement support for linear interest rate products in a number\
    \ of steps.\n\n# 13.1 DELAYED PAYMENTS\n\nLet us start with the support for delayed\
    \ payments. We already provided basic support for the discounting of payments\
    \ using the pays keyword. However, as the language stands, we can only deal with\
    \ payments that occur immediately on the fixing date. The floating leg of a swap\
    \ typically fixes Libor (2b before) the start date but only pays it on the end\
    \ date of period. Hence, the following script is wrong:\n\n```\nstart: 01Jun2020\
    \          floatLeg pays pays\nend: 01Jun2030           libor(StartPeriod, EndPeriod,\
    \ act/360, L3M)\nfreq: 3m                   * cvg(StartPeriod, EndPeriod, act/360)\n\
    fixing: end               \n```\n\nbecause the Libor for each period is fixed\
    \ on (2b) before, but paid at the end. If we set the event date on the start,\
