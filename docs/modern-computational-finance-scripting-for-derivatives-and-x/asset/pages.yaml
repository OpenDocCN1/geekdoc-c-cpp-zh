- pgno: 249
  md: '# A.2 PARSING STATEMENTS


    A statement is characterized by an instruction. We have two instructions far in
    our simplified syntax: the form


    ```

    if condition then statements [else statements] endIf

    ```


    (that itself has nested statements) and the assignment


    ```

    var = expression

    ```


    We will add more as we extend the syntax. For now, we note that every statement
    is built around an instruction. An expression without instruction, say “x,y,”
    is not a fully formed statement and we cannot work with it. The first task of
    the statement parser is to identify the instruction. Instructions come in two
    flavors: the ones that start with their identifier, like “...,” and the ones that
    start with their left-hand side (LHS) assignment, like “LHS = RHS” assignment
    with their identifier (in this case “=”) somewhere in the core of the statement.


    Operators that take LHS and RHS arguments, and the precedence rules, are the only
    reason parsers are somewhat hard. If the language was made only of functions,
    for instance, if we wrote


    ```

    sup(a,b),assign(c,add(d,e))

    ```


    instead of


    ```

    if a>b then c=d+e endlf

    ```


    then we would be done in half a page. But the result would not be very attractive,
    and scripting languages would probably not have such success with derivatives
    professionals.


    A simplifying rule may not hold in more sophisticated languages like C++, but
    is good enough for financial scripting, is that the LHS in instruction of the
    second token is always a variable.


    The first instruction type is easily identified by its first token. If we have
    a match, we call a dedicated parsing function for the corresponding instruction.
    If not, we parse the first token as a variable and identify the instruction with
    the second token. If we still don''t have a match, then our statement is not well
    formed and we have an error.'
