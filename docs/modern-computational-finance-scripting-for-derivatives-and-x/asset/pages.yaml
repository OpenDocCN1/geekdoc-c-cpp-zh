- pgno: 121
  md: '# 106 MODERN COMPUTATIONAL FINANCE


    Of course the same can be done with the date arguments, but with a twist. It is
    useful to allow date expressions, like “01Jun2021+1y” or “StartPeriod-3m”. Note
    that these are not expressions in the sense that “Spot)-100” is an. Dates are
    not stochastic. They are not allowed to depend on scenarios and cannot be assigned
    to variables. Thus, any date expression is necessarily a constant expression,
    one that is evaluated before simulations take place. We could consider building
    a dedicated date to preprocess the results of date expressions, but that would
    be overkill. We may assume that all date expressions are of type date, date +
    tenor, or date - tenor (support for expressions like “01Jun2021+1y-3m” does not
    add much value). Given that this is, it is easy to evaluate the expression directly
    at parsing time and store the result on the node. In this case, parseDateExpr()
    does not only parse the expression but also evaluates it.


    As a general rule, it is our philosophy to limit parsing and use visitors for
    anything else. To some extent that would be a better development. In this particular
    case, we believe that adding/subtracting a fixed number of years/months/weeks/days
    to a constant date is not worth the effort of building new node types and new
    pre-processors. To do this directly at parsing time is a quick and easy development.


    This means that the nodes for the arguments of cvg are never built. The arguments
    are directly evaluated at parsing time and stored on the node for the function.
    In fact, the result of cvg will therefore also be known at parsing time and can
    be stored on the cvg node.


    Wait a minute. The function cvg does not take any other arguments. From the moment
    that all its arguments are known, cvg can be evaluated straight away. So it can
    be directly evaluated at parsing time and resolved into a constant node. This
    is however Other functions that take date or string as arguments, generally take
    additional non-deterministic arguments, and so they may not be evaluated at parsing
    or pre-processing time. However, their date and string arguments would still be
    evaluated at parsing time by parseDateExpr() and the likes of parseBasis() so
    that the results are stored on the node for the function for an efficient subsequent
    evaluation of the function at run time.


    In summary, for supports does not take place before parsing, but during parsing,
    yet it still doesn’t involve the creation of nodes, the development of visitors
    or any change in our code outside of a minor development in the parser. Date expressions
    leave parsing as constant dates on the node of the function; the likes of basis,
    frequencies, and tenors leave parsing as codes also stored on the function node.
    The function cvg is evaluated at parsing time and leaves parsing as a constant
    node that holds its result.'
