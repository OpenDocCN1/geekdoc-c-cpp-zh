    we want the domain of the affected variable v to be the union of its domain before
    the condition and the domain of expression. The domain of unaffected variables
    is obviously unchanged. If the domain of v was continuous, it remains continuous.
    If the domain of expression is continuous, the domain of v becomes continuous.

    Domains of variables change throughout the script, which is why the domain processor
    must maintain the current domain of all variables as a state.

