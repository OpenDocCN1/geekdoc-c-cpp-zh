  md: '# Risk Sensitivities with Monte-Carlo


    $D_{100}(S) = 1_{[S>100]}$


    A European profile with discontinuities can be written as the sum of a continuous
    profile and a combination of digitals. A European profile at maturity is $50+80D_{100}$.
    Our autocallable''s profile with discontinuities can be written as $c(S) + \sum_{i=0}^{n-1}
    \alpha_i D_{K_i}(S)$ where $c$ is a continuous function and we have $n$ discontinuities
    on the points $(K_i)$ with jump sizes $(\alpha_i)$. The PV of such profile is
    $V_c + \sum_{i=0}^{n-1} \alpha_i V_{D_i}$, and its sensitivity to the initial
    spot or its volatility) is $\frac{\partial V_c}{\partial a} + \sum_{i=0}^{n-1}
    \alpha_i \frac{\partial V_{D_i}}{\da}$


    In this expression, the Monte-Carlo estimation of $\frac{\partial V_c}{\partial
    a}$ does not raise particular issues, it is the estimation of $\frac{\partial
    V_{D_i}}{\partial a}$ that is problematic. The value of a digital (ignoring discounting)
    is its risk-neutral probability of ending in the value: $V_{D_i} = \int K_i d\varphi_a
    = 1 - \varphi_a(K_i)$ and is generally different with respect to $a$, even though
    the integrand $D_i$ is discontinuous. The Monte-Carlo estimation of the value
    from a number $N$ scenarios,


    however, is $\tilde{V}_{D_i} = \frac{1}{N} \sum_j [\varphi_a^{-1}(u_j)]$, where
    the $(u_j)$ belong in $(0,1)$, and this expression is clearly not differentiable
    in $a$. As a result, an attempt


    to compute $\frac{\partial \tilde{V}_{D_i}}{\da}$ in this context leads to unstable,
    inaccurate results.

    nIntuitively, if $a$ is bumped by a small amount, the paths that ended out of
    the money before the bump end out of the money, and the paths that ended in the
    money end in the money, producing the same value after the bump, hence a sensitivity
    of 0. AAD analytically computes the limit of the finite difference when the bump
    size goes to 0, hence producing a sensitivity. With finite differences sensitivity
    depends on the proportion of paths that cross the money when the bump is applied,
    and this is a highly unstable number.


    The risk of transactions with exotic discontinuities, such as barrier options,
    suffers from similar problems in the context of simulations. In this case, the
    estimate from $N$ simulations is $\hat{\hat{V}} = \frac{1}{N} \sum_j (\hat{X}_j^a)$
    where the scenario number $j$-the vector of all the market variables sampled by
    the model for all event dates from their joint risk-neutral distribution parameterized
    by $a$ on simulation $j$-and and $f$ is the payoff of a scenario. $\hat{X}_j^a$
    is produced from a uniform sample of the hypercube $(0,1)^D$ (where $D$ is the
    dimension of the Monte-Carlo, the number of random'
