- pgno: 20
  md: '# Introduction


    only the constructs necessary for the description of financial cash-flows, for
    which it provides specific keywords.


    The language considers as variable anything that starts with a letter and is not
    otherwise a keyword. We used the variables vRef, vAlive, and prd in our example.
    Evidently, ancillary variable names don''t have to start with the letter V; this
    is only for clarity.


    Products are variables. The language makes no difference between products and
    ancillary variables; only users do. Our example actually scripts three: prd obviously;
    vRef, which pays spot fixing today and is worth today''s underlying asset price;
    and vAlive, which is 1 at maturity if the product survived the first two years,
    0 otherwise. Its value is the (risk-neutral) probability of surviving to year
    3. All variables may be seen as products, although in general, the values of ancillary
    variables are disregarded in the end. In chapter 5, we will implement other means
    of distinguishing products from helper variables, and actual payments from assignments,
    with the keyword pays.


    To value a script in the context of path-wise Monte-Carlo simulations means to
    evaluate against a number of scenarios, each scenario generating different values
    for spot on the event dates in 1y, 2y, and 3y. For every scenario generated by
    the model, we evaluate the script and record the final value of all its attributes.
    In the end, we average these final values'' across scenarios to estimate the values
    of the corresponding products. If we also require sensitivity, we compute the
    derivatives of the final variable to changes in the model parameters. Evidently,
    the derivatives of prices are averages of the path-wise derivatives, which permits
    an efficient path-wise computations of sensitivities, in particular with adjoint
    propagation. See for instance Giles and Glassman''s “Smoking Adjoints,” which
    introduced adjoint techniques to finance [14], and our publication [27], which
    explains automatic adjoint differentiation (AAD) and provides professional differentiation
    code.


    We remind the reader, however, that evaluation (including sensitivities) is only
    one thing we can do with script. The purpose of this library is to parse scripts
    into viable data structures and implement a framework that enables all types of
    visitors, not only the evaluator, to traverse and manipulate scripts in many ways.


    We split the implementation in five steps.


    First, we describe in chapter 2 the data structure for the internal representation
    of the script, ready for evaluation and other forms of visits. We will use expression
    trees as a data structure, and we describe these in detail. The discussion and
    code for the actual parsing (that turns a text script into a collection of expression
    trees) is left to the appendix.


    Then, we introduce in chapter 3 the evaluator that values expression trees during
    simulations, pre-processors that optimize evaluation before'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'simulations, and other visitors, objects that traverse expression trees and
    perform calculations and actions depending on the visited node, while maintaining
    internal state. We explain the visitor pattern, a common framework for all types
    of visitors, which encapsulates traversal logic and makes the development of specific
    visitors particularly simple.


    Third, in chapter 4, we bring the pieces together and develop a (very) basic model
    to test the scripting library.


    Fourth, we improve our framework with the addition of the keyword pays in chapter
    5 and take this opportunity to illustrate how a core extension is made to the
    language.'
