- pgno: 234
  md: '# CHAPTER 24

    Branching


    Perhaps surprisingly, Andreasen''s CVA reformulation does not extend itself to
    the collateralized case, where the CVA is defined as:


    ```

    $CVA = E \sum (1 - R_{T_i}) 1_{\{T_i \le r < T_{i+1}}\}} \max(0, V_{T_i} - V_{T_i-T})$

    ```


    where T is the margin period of risk (MPR). Huge and Savine [18] show that this
    case cannot be resolved in the context of standard Monte-Carlo simulations. It
    is necessary to recourse to so-called branching simulations. Branching Monte-Carlo
    simulations were recently produced by Henry-Labordere [17], under the inspiration
    of 40-year-old work by McKean [23]. Andreasen and Huge successfully applied this
    technique to resolve the problem of the collateralized CVA. Subsequently, systematic
    support for branching was implemented in Danske Bank''s CVA systems by Savine
    and extended to produce RWA and KVA without nested simulation by Flyer, as demonstrated
    live in Global Derivatives in 2015 and 2016 by computing full-risk sensitivities
    for an RWA on a large netting set locally on MacBook Pro within a couple of minutes
    [11].


    Branching Monte-Carlo consist of the simulation, in every scenario, of not only
    one evolution of the world but also a number of “branches”, where each branch
    sticks out of the main simulation at a particular point of time (for our purpose,
    the collateral fixing dates) and starts a parallel simulation that follows the
    same dynamics as the “main branch” independently from it:


    ![](img/3887ab6b5277fb99d77002948fa19470_234_0.png)'
  merge: -1
  img_proc: true
- pgno: 235
  md: "Given that our Monte-Carlo simulates some multidimensional diffusion\nfor the\
    \ state variables of the model\n\n```\n$d\\tilde{S} = a\\left(\\tilde{S}, t\\\
    right)dt + b\\left(\\tilde{S}, t\\right)dW$$\n```\n\na secondary branch sticking\
    \ out at time $T_B$ $\tilde{S}^{T_B}$, is part of the same\nscenario and simulated\
    \ in such a way that:\n\n+   1. For $t \\le T_B$ $\tilde{S}^{T_B} = \\tilde{S}^{T_B}$.$\n\
    2. For $t > T_B$ $\tilde{S}^{T_B} = a\\left(\\tilde{S}, t\\right)dt + b\\left(\\\
    tilde{S}, t\\right)dW^B$ where $W^B$ is a standard mul-\ndimensional Brownian\
    \ Motion independent from $W$.\n\nThose \"hairy simulations\" are different from\
    \ \"nested\" simulations. We\nsulate only one hair for every branch, and the hairs\
    \ are part of the scenario\nalong with the central branch. Then, if we denote\
    \ $B^{V_T}$ the PV at time T\nsimulated on the branch, B, Huge and Savine show\
    \ that the formula for the\nuncollateralized CVA holds:\n\n```\n$CVA = E \\left[\
    \ \\sum_{k} \\eta_{T_k} CF_k \\right]$$\n```\n\nexcept now:\n\n```\n$$\\eta_{T_k}^{T_i\
    \ < T_k} = \\sum \\left(1 - R_{T_i}\\right)_1 \\left\\{T_{T_i-1} \\le r < T_i\\\
    right\\}_1 \\left(1 - \\left\\{V_{T_i} > V_{T_i-1}\\right\\)^{-1} \\left\\{B_{VT_i}\
    \ > B_{VT_i-1}}\right}\\right)$\n```\n\nIn other terms:\n\n```\n$$\\eta_0 = 0,\
    \ \\eta_{T_{i+1}} = \\eta_{T_i} + \\left(1 - R_{T_i}\\right)_1 \\left\\{T_{T_i-1}\
    \ \\le r < T_i\\right\\}_1 \\left(1 - \\left\\{V_{T_i} > V_{T_i-1}\\right\\)^{-1}\
    \ \\left\\{B_{VT_i} > B_{VT_i-1}}\right\\}\\right)$$$\n```\n\nIn the case of independent\
