  md: '# Risk Sensitivities with Monte-Carlo 167


    Let us discuss further this industry standard “call-spread” smoothing technique,
    and in particular provide three distinct interpretations that will be very useful
    in what follows.


    Fuzzy logic with Conventional—sharp or crisp—logic, the digital either ends in
    the money and pays $1, or ends out of the money and pays 0, hence the discontinuity.
    Reasoning with the so-called fuzzy logic instead, we reward a fixing above 110
    as decided in the money, a fixing below 90 as decided out of the money, and any
    fixing in between as partly in the money, a bit like Schrödinger’s cat who is
    dead in its capsule, with a “degree of moneyness” that is interpolated between
    0% and 90 and 100% at 110. The call spread smoothing corresponds to a transaction
    that pays $1 over the fraction of the notional that ends up in the money. We investigate
    fuzzy logic further in subsequent chapters, where it leads to an efficient, elegant
    smoothing algorithm.


    Finite difference A digital profile is the derivative (in the sense of distributions)
    of European call profiles with respect to strikes: $D_K(S)\equiv I_{(S>K)} = -\frac{\partial}{\partial
    K}(S-K)^+ = \frac{\partial}{\partial K}C(S, K)$. The call spread smoothing is
    nothing else than a finite difference approximation of the derivative. At the
    limit, the derivative is discontinuous, but before the limit, all finite difference
    approximations are continuous, hence the validity and efficacy of the technique.


    Smoothing of normal We invert the previous equation into $C(S, K-\epsilon)$-

    C(S, K+\epsilon) = \int_{K-\epsilon}^K D_k(S)dk$. A call spread is a collection
    of digits


    with strikes evenly distributed within the spread. Donc, to apply call smoothing
    also corresponds to booking a collection of digits of different strikes instead
    of one digital with a given strike. The notional of the original transaction is
    evenly spread over strikes within the spread, hence the smoothing.


    The industry generally applies the same approach to discontinuous exotics, in
    particular transactions with an up-and-out barrier, for instance, a schedule of
    cash-flows that stops as soon as the spot fixes above a level B, causing a discontinuity
    in the profile. To resolve the problem, as for digits, we spread the notional
    of the transaction across barriers in a region around B. On all barrier-fixing
    dates, we potentially knock out only a fraction of the notional interpolated between
    0 or below $B-\epsilon$ and on or above $B+\epsilon$. We carry on'
