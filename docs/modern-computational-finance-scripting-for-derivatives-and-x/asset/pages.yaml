  md: "# Parsing 247\n\nIf we don't have a match for a function, all pattern matching\
    \ has failed, meaning we have a variable. In this case, we call our variable parser\
    \ parseVar(), implemented earlier.\n\nOur L6 parser is complete once we have the\
    \ argument parser. It parses all arguments between parentheses following the following,\
    \ separated by commas, as an intro to trees.\n\n```\nstatic vector<ExprTree> parseFuncArg(TokIt&\
    \ cur, const TokIt end) {\n// Check that we have a '(' and something after that\n\
    if (cur[0] != '(') {\n    throw script_error(\"No opening (following function\
    \ name)\");\n}\n// Find matching ')'\nTokit closeIt = findMatch(')', cur, end);\n\
    // Parse expressions between parentheses\nvector<ExprTree> args;\n++cur;\nwhile\
    \ (cur != closeIt) {\n    args.push_back(parseExpr(cur, end));\n    if (cur[0]\
    \ != ',') ++cur;\n    else if (cur != closeIt) {\n        throw script_error(\"\
    Arguments must be separated by commas\");\n    }\n}\n```\n\nWe check that we start\
    \ with a '', find the matching ')' with our helper findMatch() that skips over\
    \ nested '}', and advance the token iterator over '.'. Each argument consists\
    \ of exactly one expression, we iterate recursive calls to the parser parseExpr()\
    \ to parse them until we hit the matching ')'. Between calls to parseExpr(), we\
    \ check that we have a comma, and skip over. Once we have parsed all expressions\
    \ separated by commas in the parentheses that follow the function, we return them\
    \ in a vector. C+11 moves the returned vector so no copies are made.\n\nJust below\
    \ constants, variables, and functions, we have parentheses. The code for parenthesized\
    \ expressions is identical to parenthesized conditions, except the two functions\
    \ to call are parseExpr(the lowest level expression parser) instead of parseCond(the\
    \ lowest level parser) if\n\n> ¹Efficient compilers are most likely to perform\
    \ the Return Value Optimization, or RVO, meaning that the vector will be created\
    \ on the stack of the caller, instead of being created inside the function or\
    \ moved to the caller."
