- pgno: 120
  md: '# CHAPTER 9


    # # Support for Dates


    The function cvg, introduced in chapter 8, is unlike any function we have implemented
    so far in our scripting language. Its arguments are not expressions that evaluate
    a number. The arguments are two dates and a basis.


    Our basic parser (precisely its method parseVarConstFunc()), which deals with
    functions) hits the name of a function, like log or sqrt, it calls parseFuncArg(),
    which sends all arguments to parseExpr() and parseExpr(). In particular, it would
    parse the basis "act/360" as the division of the variable act by the constant
    360. It should be clear that a function cvg requires a special treatment in parseVarConstFunc().
    Instead of sending its arguments to parseExpr(), the first two arguments should
    be sent to a new function parseExpr() and the three to another function named
    parseBasis(). The same applies to other functions that take arguments or things
    like basis, tokens, or frequencies. We will meet a few of these in the next section,
    so we now discuss support for dates in the language and illustrate our discussion
    with the example of cvg.


    We start with parseBasis(). All it needs to do is read the basis code from the
    tokens so that the basis code is stored on the cvg node. There is no need to create
    a constant string type to hold the argument as a string, or a basis type to hold
    the basis code on a separate node. The basis argument cannot be anything else
    a string that represents a valid basis code, and that interpretation can be conducted
    on the fly at parsing time in parseBasis(). So, parseBasis() reads the basis code
    from the tokens of the third argument and returns it so it can be stored on the
    node for the function. The exact same pattern applies to functions like parseTenor()
    and parseFreq.


    The event string is tokenized before parsing, so that something like "act/360"
    becomes "act," "/," "360," which simplifies the work of parseBasis().


    > ¹The event string is tokenized before parsing, so that something like "act/360"
    becomes "act," "/," "360," which simplifies the work of parseBasis().


    105'
