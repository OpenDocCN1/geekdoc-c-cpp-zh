    domain. If f is a function of three variables, for instance, its domain is the
    list comprehension, that is (in pseudo-code):


    ```

    dom( arg1, arg2, arg3)

    ={ f(x,y,z) }

    for x in dom(arg1), y in dom(arg2), z in dom(arg3)

