  md: "# Core Extensions and the “Pays” Keyword\n\nSince all variables are initialized\
    \ to 0, this is a general syntax that works with single payments, too. This new\
    \ keyword pays encapsulates the counting logic so that users never need to worry\
    \ about it. It also elegantly resolves the scripting of products with multiple\
    \ payments. Assignment is no longer used for payments, only for ancillary variables.\
    \ Payments and coupons always use pays instead.\n\nThis syntax offers benefits\
    \ beyond user-friendliness. A visitor stopping on the pays nodes can figure what\
    \ variables are products and what are helpers. Crucially for xVA, it can pick\
    \ all payments and the corresponding payment dates. This would allow visitors\
    \ to compress cash-flows, and analyze associated credit risks. The credit risk\
    \ of a coupon does not stop on its fixing; it runs all the way to payment. For\
    \ instance,\n\n| FixingDate vCpn = ... |\n| PayDate pays vCpn |\n\nthere would\
    \ be no way to determine the exact maturity of the credit risk without the pays\
    \ keyword, a dedicated visitor can figure the actual payment dates and let a model\
    \ analyze credit risk accordingly.\n\nThe ability of visitors to traverse scripts\
    \ and pick payments may also help with back-office processing and the management\
    \ of the life cycle of the product. Such particular visitors for payments would\
    \ need to visit only the pays nodes.\n\n# 5.2 IN CODE\n\nThe addition of keyword\
    \ pays is a fundamental modification of our language because it adds a third type\
    \ of instruction, hence, a third type of statement. Hopefully, however, the designs\
    \ we put in place may accommodate without major difficulty. Let us discuss the\
    \ steps involved in this development.\n\nFirst, we need a model that supports\
    \ discount rates and communicates numeraires. We need the numeraire to be part\
    \ of our simulated data:\n\n```\ntemplate <class T>\nstruct SimulData {\n    T\
    \ spot;\n    T numeraire;\n};\n```\n\nModels must provide numeraires (or 1 if\
    \ they cannot, this is all of their specific API wrapper). We support discounting\
    \ in a fully general"
