  md: '# CHAPTER 19

    Fuzzy Logic


    Our simple algorithm (FCE) effectively turns a natural script into a well-smoothed
    one, provided all conditions are continuous. With a well-chosen smoothing factor,
    the impact on the price is immaterial, and risk sensitivities converge nicely
    with Monte-Carlo. Performance is virtually unchanged.


    How are we going to implement the FCE? Are we really going to traverse scripts
    and turn them into equivalent smooth ones like we did in chapter 18? The new script
    would be harder to read, similar to anything that is written by computers. In
    practice, we would have to keep the original script and store it along the modified
    one. Or, the modification could occur on demand, when risk sensitivities are being
    computed, but this would produce an overhead. To modify scripts for computational
    purposes violates the modularity of our code and the principle of a loose coupling
    between the cash flows and their evaluation. We would much rather apply smoothing
    without *modification of the script*, using a modification in the evaluator instead.


    Reviewing the steps involved in the FCE, we can see them as a different *evaluation*
    of the *same script* rather than a *modification* of the script. Further, it is
    only the conditional blocks that are evaluated in a different way, the rest of
    the script being evaluated identically. Here, the script does not need to change
    provided we modify the evaluator to implement a different *logic* for the evaluation
    and conditional blocks. In practice, this means that we *derive* the evaluator
    and *override* its methods related to visits to *if* nodes.


    We developed visits to *if* nodes in our base evaluator to perform the following
    steps:


    +   1. Evaluate the condition.

    2. If the condition is true, evaluate the *if true* statements.

    3. Otherwise, evaluate the *if false* statements if any.


    In our derived evaluator, we override the visit to the *if* nodes so that we implement
    the steps of the FCE inside. We also override the visits to'
