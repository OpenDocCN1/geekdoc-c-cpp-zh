  md: '# 26 MODERN COMPUTATIONAL FINANCE


    For example, the statement that described the payoff of a call option:


    ```

    opt = max(0, spot()) - 100

    ```


    collects the seven items opt, =, max, 0, spot, –, and 100 into a statement that
    represents the assignment of the (sub)-expression “max(0, spot()) – 100” into
    the (sub)-expression “opt":


    ![](img/3887ab6b5277fb99d77002948fa19470_41_0.png)


    It transpires from that an expression is really a hierarchy of (sub)-expressions
    and a fundamentally recursive thing. An expression is identified by its higher-level
    item, = in our example, the operation evaluated last in the expression, which
    depends on the other items, without itself being an argument to any other option.
    The assignment operation has two arguments: the assigned variable, “opt” in our
    example, and the assigned amount, “max(0, Spot() – 100).” The left-hand side (LHS)
    “opt” is an expression that consists of the single item opt, which represents
    the assigned variable. The right-hand side (RHS) “max(0, Spot() – 100” is itself
    an expression (but not a statement), which represents the assigned amount and
    is identified by its higher level item max:


    ![](img/3887ab6b5277fb99d77002948fa19470_41_1.png)


    The binary max operation depends on two (sub)-expressions: the constant “0” (constant
    item 0) and the (sub)-expression “Spot() – 100,” which is a subtraction expression
    identified by – top item, itself depending on its LHS “Spot()” (the item spot()
    representing the underlying asset’s simulated value) and its RHS “100” (the constant
    item 100), both of which are single item expressions without dependencies, hence,
    ending the recursion:


    ![](img/3887ab6b5277fb99d77002948fa19470_41_2.png)'
