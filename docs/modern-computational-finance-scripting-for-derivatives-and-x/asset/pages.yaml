    ```

    eDate if spot() > 100 then x = 1 else x= 0 endIf

    ```


    Assume the variable x was used previously in the script so on eDate it has some
    value, say 100.


    ```

    eDate x = 100

    if spot() > 100 then x = 1 else x= 0 endIf

    ```'
