    Evidently, affected variables do not need any modification.


    # 18.4 FURTHER OPTIMIZATION


    Finally, we note an important optimization that reduces the performance penalty
    of smoothing to virtually nothing in cases. The evaluation of the modified script
    may take substantially longer than the original, because both the iftrue and iffalse
    blocks of statements must be evaluated unconditionally, in all scenarios, where
