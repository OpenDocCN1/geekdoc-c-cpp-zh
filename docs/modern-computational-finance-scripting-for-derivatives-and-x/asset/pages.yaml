    \ and Piterbergs [20]. Support in the scripting library is similar to that of\
    \ Libors, because each basis curve is a curve just like individual assets are\
    \ named assets. In practice, this means that the fwd and spot keywords take an\
    \ additional parameter that is the code for the asset (typically a string) and\
