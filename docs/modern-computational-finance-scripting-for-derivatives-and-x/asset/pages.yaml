  md: "# 3.4 PRE-PROCESSORS\n\nThe variable indexer is one of the many particular\
    \ visitors we call preprocessors. Preprocessors analyze the trees before simulations\
    \ take place, anticipate the subsequent work of run-time visitors, and perform\
    \ actions before simulations start so to minimize the computational effort of\
    \ those visitors that work repeatedly during simulations. Preprocessors pre-allocate\
    \ working memory, index things so they can be directly accessed in memory, and\
    \ perform some of the forthcoming calculations that don't depend on the simulated\
    \ data. Preprocessors typically store some results on the nodes of the expression\
    \ trees, while the variable indexer stores the indices on the variable nodes.\n\
    \nAnother example is described in part IV on Fuzzy Logic, where our algorithm\
    \ identifies the variables affected in if... then... else... endlf statements\
    \ and allocates space for their temporary storage.\n\nOur section III, chapter\
    \ 13, dedicated to interest rates, discusses a major performance improvement due\
    \ to a simulated data pre-processor, which identifies what data must be simulated\
    \ for what date, pre-allocates memory for that date, and indexes so it is directly\
    \ accessed in memory during simulations, like the variables in the script.\n\n\
    Note that variable indexing could have been performed at parsing time, the parser\
    \ indexing the variables on the fly as it parses and keeping a map of previously\
    \ parsed variables as a state. This is the case for most pre-processing we want\
    \ to carry out. However, given the large amount of pre-processing we may want\
    \ we will eventually perform, to do so at parsing time would cause the parsing\
    \ to unnecessarily grow in size and complexity and quickly become hard to read\
    \ and maintain. It is better practice to parse events into expression trees first\
    \ and then have a (potentially large) number of specialized pre-processors, each\
    \ performing a specific job after parsing and before simulations. All the pre-processors\
    \ may be called in sequence in a preProcess() method of the Product class. At\
    \ the moment, we have:\n\n```\nclass Product {\n  // ...\n\n  // Fire all pre-processors\n\
