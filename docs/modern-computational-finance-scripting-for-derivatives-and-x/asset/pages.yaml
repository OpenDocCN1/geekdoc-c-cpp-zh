  md: '# 158


    # INTRODUCTION


    so we may differentiate the generally continuous log-likelihood of the risk-neutral
    distribution of the state variables instead of attempting to differentiate the
    potentially discontinuous payoff f. The so-called Malliavin weights can be computed
    path-wise as a function of the derivatives of the drift and the diffusion coefficient
    of the state variables using known results from Malliavin''s calculus. This computation
    can be made very efficient with reverse adjoint propagation. Unfortunately, the
    computation of Malliavin weights is not modelic. It is dependent on the model
    and numerical implementations in a library. In addition, depending on the model,
    the computation of Malliavin weights may or not be tractable.


    For these reasons, likelihood ratio, despite its formal appeal, is not widely
    applied on trading desks. An alternative, widely applied practice, is cash-flow
    smoothing (also called payoff smoothing), whereby discontinuous cash-flows are
    replaced by approximate continuous. For example, digital cash-flows are approximated
    by tight spreads. Knock-out products are approximated by so-called soft barriers,
    whereby only a part of the notional knocks out, depending on how the barrier index
    lands in the KO region, the simulation continues with whatever remains. Payoff
    smoothing works no on the models or their implementation, only on the payoffs.
    Therefore we do not discuss Malliavin''s calculus further in what follows and
    on smoothing and its implementation for structured products.


    One question we want to investigate is smoothing can be nicely implemented for
    structured products in such a way that it doesn''t break the natural, readable
    script syntax or our requirement that it is the raw cashflows that are meant to
    be scripted, without any reference to a solution like smoothing. This is a problem
    that, to our knowledge, has not been addressed satisfactorily far. We offer a
    solution based on specific application of the so-called fuzzy logic, a framework
    developed in the 1960s for very different purposes. We will demonstrate that standards
    smoothing techniques for digits and barriers are particular. More importantly,
    we will demonstrate that a systematic application of fuzzy logic leads to a general,
    automated algorithm to identify and correct discontinuities of structured cash-flows
    in an elegant, efficient, and practical manner. In particular, our algorithm does
    not modify scripts in any way; rather, it evaluates the unmodified scripts in
    a different manner, with a systematic application of fuzzy logic that effectively
    corrects instabilities and biases in the resulting risk sensitivities.


    We identify some limitations to the methodology, but conclude that it performs
    remarkably well in cases of practical relevance.


    We should point out, once again, that an implementation of fuzzy logic would not
    be feasible if the payoff was a black box. The algorithm needs'
