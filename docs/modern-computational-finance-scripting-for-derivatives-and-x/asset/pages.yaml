  md: '166


    We shall not discuss the Malliavin solution any further and focus on smoothing.


    # 16.3 SMOOTHING FOR DIGITALS AND BARRIERS


    Discontinuities in European profiles are digital options, it suffices to approximate
    digital payoffs with continuous functions. Classically, digitals are approximated
    with tight call spreads. The following chat shows how a digital call (blue line)
    can be approximated by a call spread (red line) that has roughly the same value
    (subject to the spread size) and a continuous profile. The error in the approximation
    is related to the spread size and the profiles coincide at the limit as the spread
    size decreases to 0. Obviously, the spread size is a trade-off between the bias
    (on the value) introduced by the approximation when it is too large and the instability
    (on the risk) when it is too tight, causing the profile to revert toward discontinuity.


    ![](img/3887ab6b5277fb99d77002948fa19470_181_0.png)


    Call spread smoothing is very effective in practice in stabilizing risk sensitivities,
    both with finite differences and adjoint propagation. When the smoothing factor
    (or spread size) is well chosen (20 on the chart for clarity, in practice of order
    1 in this case), the impact on the price is immaterial while risk sensitivities
    are stabilized. This is to our knowledge industry-wide standard for smoothing
    risk sensitivities with Monte-Carlo simulations.'
