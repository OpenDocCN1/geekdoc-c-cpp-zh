- pgno: 75
  md: "# MODERN COMPUTATIONAL FINANCE\n\nSo as to make the code more compact, we use\
    \ a helper function pop2() that pops two numbers from the stack and returns them\
    \ in a pair. We expect compilers to inline the function and/or use RVO so it clarifies\
    \ the code without a run-time penalty.\n\n```\npair<T,T> pop2()\n{\n    pair<T>\
    \ res;\n    res.first = myStack.pop();\n    res.second = myStack.pop();\n    return\
    \ res;\n}\n```\n\nThen all the visitors for binary operators take three lines:\n\
    \n```\nvoid visitSubtract( const NodeSubtract& node ) override\n{\n    evalArgs(\
    \ node);\n    auto args=pop2();\n    myStack.push(args.first-args.second);\n}\n\
    nvoid visitMult( const NodeMult& node ) override\n{\n    evalArgs( node);\n  \
    \  auto args=pop2();\n    myStack.push(args.first*args.second);\n}\nnvoid visitDiv(\
    \ const NodeDiv& node ) override\n{\n    evalArgs( node);\n    auto args=pop2();\n\
    \    myStack.push(args.first/args.second);\n}\nnvoid visitPow( const NodePow&\
    \ node ) override\n{\n    evalArgs( node);\n    auto args=pop2();\n    myStack.push(args.first,\
    \ args.second);\n}\n```\n\nUnaries are even simpler. The unary + leaves its RHS\
    \ on the stack, the unary - turns it into its opposite.\n\n```\nvoid visitUPlus(\
    \ const NodeUPlus& node ) override\n{ evalArgs( node ); }\nvoid visitUMinus( const\
    \ NodeUMinus& node ) override\n{ evalArgs( node ); myStack.top() *= -1; }\n```"
