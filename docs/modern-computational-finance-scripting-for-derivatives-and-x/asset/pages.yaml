    # 13.5 UPGRADING “PAYS” TO SUPPORT DELAYED PAYMENTS


    Dealing with payments with multiplication by discount factors does not qualify
    as natural language. In addition, case counterparty default is considered, a payment
    on the fixing date multiplied by the discount factor is no longer economically
    identical to a payment on the payment date because a default could hit in. For
    these reasons, it is best refrain from using discount factors directly in the
    script and instead to encapsulate them in the pays functionality. That means we
    use the syntax:


    ```

    product pays amount on maturity

    ```


    as a shortcut for


    ```

    product pays amount * df( maturity)

    ```


    This is more than syntactic sugar. We store delayed payment information in the
    pays node, which can be retrieved by a visitor in order, for example, to deal
    with credit risk between the fixing and the payment date.


    The pays node must be extended to store a payment date (defaulting on the event
    date “on maturity” is omitted) and of course the index for the discount factor;
    the processor must visit and index pays in addition to df nodes, and the evaluation
    of the pays node must multiply the amount by the discount discount picked on the
    simulated data.'
