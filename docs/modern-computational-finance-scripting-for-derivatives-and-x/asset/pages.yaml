    This script does not produce the correct results. For instance, the final

    value of y in this case is correctly degTrue * x0 + degFalse * y0, but z ends\up
    at degTrue³ * x0 + degTrue² * degFalse * y0 + degTrue * degFalse * z0,\when we
    should expect degTrue * x0.


    The dependencies on the variables in the conditional statements,

    and the assignments to the same variables in the iftrue and iffalse statements,

    interfere with our simplistic logic and cause the algorithm to fail.


    We fix the algorithm by recording the X0 of all the variables

