    \ [S \\left(0, T_i\\right) - S \\left(0, T_{i+1}\\right)]$$\n```\n\n```\n$$\\\
    left(1-\\left\\{V_{T_i} > V_{T_i-1}\\right\\)^{-1} \\left\\{B_{VT_i} > B_{VT_i-1}}\r\
    ight\\}\\right)$$$\n```\n\nThe support for branching in the simulation library\
    \ may be implemented\nin a model-agnostic way, provided all models satisfy an\
    \ API for producing\npartial paths given an initial set of state variables. The\
    \ scripting library must\nalso be extended to support branching. This rather advanced\
    \ development,"
