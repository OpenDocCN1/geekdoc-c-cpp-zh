  md: '# Condition Domains


    must have been previously identified by the affected variables'' processor.

    Then:


    +   1. Record the initial domains ($D_0$) of all affected variables.

    2. Process if statements and record resulting domains into ($D_1$).

    3. Reset the domain of all affected variables to ($D_0$).

    4. Process "if false" statements if any.

    5. Record the domains resulting from the two previous steps into ($D_2$).

    6. Set the final domains of all affected variables to the union of ($D_1$) and
    ($D_2$).


    The visitor is not particularly fast; however, it runs only once, and in our tests,
    the time spent determining domains is always negligible compared to evaluation,
    including with large netting sets containing thousands of variables.


    # 20.3 CONSTANT EXPRESSIONS


    One side with the domain processor is that it implicitly identifies constant expressions.
    Whenever the domain of an expression or sub-expression turns out to be a singleton
    $\{c\}$, this means that the expression is a constant, even when its expression
    tree is not a constant leaf, as in "100+10".


    When a branch in an expression tree that is not already a constant leaf is identified
    as a constant expression, it is safe, and desirable to trim the branch by deleting
    its node in the expression tree and replacing it with a constant value. "100+10"
    is replaced by "110," although that replacement is not conducted in the text,
    but in the tree, using a visitor.


    We have implemented the trimming of constants. If we had, we would have added
    a boolean $isConst$ and a double $myConstVal$ on the base Node, initialized to
    false and 0. Whenever a constant domain $\{singleton\}$ is identified on the top
    of the domain stack during domain processing, the processor would flag the node
    by setting its $isConst$ and setting its $myConstVal$ to $c$. Later, another processor
    (the "constant trimmer") would visit the trees, deleting all nodes flagged as
    constants and replacing them by constant leaves that contain their values.


    What we have implemented is a "constant condition trimmer" that replaces all nodes
    marked alwaystrue by the collection of its itrue statements and all if nodes market
    alwaysfalse by the collection of its iffalse statements.'
