    \ = spot()\n if spot(spot) > 100 : 1 then pays 1 endif\n vPerf = (spot) - vRef)\
    \ / vRef\nD2 if vPerf > 1 : 0.1 then pays 1 endif\n vRef2 = spot()\n vPerf2 =\
    \ (spot) - vRef2) / vRef2\nD3 if vRef > 1 : 0.1 and spot() > vRef : 2 then pays\
    \ 1 endif\n\nWe persist a semicolon following each elementary condition with the\
    \ spread to be used for smoothing. This syntax is omitted on a particular condition,\
    \ a default passed to the entry valuation function is used. This allows us to\
    \ manually specify spreads if we wish to do so or for testing our automatic algorithm.\
    \ It is necessary to implement it in our scripting language but automatic determination\
    \ is preferable. Note that even with automatic determination, we may want some\
    \ specific conditions to use a user-defined spread instead. Our syntax may support\
    \ such cases. We can write the code so that the spread is determined by the algorithm\
    \ for conditions where the semicolon syntax is omitted and use the user-provided\
    \ spread for conditions where it is explicitly present.\n\nOur code in the online\
    \ repository supports this syntax."
