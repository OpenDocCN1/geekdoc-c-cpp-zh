- pgno: 268
  md: "# Parsing\n\n# 253\n\n```\n// Build events out of event strings\ntemplate<class\
    \ EvtIt>\n// Takes begin and iterators on pairs of dates\n// and corresponding\
    \ event strings\n// as from map<Date, string>\nvoid parseEvents(EvtIt begin, EvtIt\
    \ end)\n{\n    // Copy dates and parse event strings sequentially\n    for(EvtIt\
    \ evt = begin; evt != end; ++evt)\n    {\n        // Copy event date\n       \
    \ myEventDates.push_back(evt->first);\n        // Parse event string\n       \
    \ myEvents.push_back(evt->second);\n    }\n}\n```\n\n\n\n\nThis is what parallel\
    \ programmers call an \"embarrassingly parallel\" problem, which means a problem\
    \ that can be trivially parallelized over events. This is even simpler with the\
    \ addition of a standard threading library in C++11, so you can dispatch the parsing\
    \ of event strings across the multiple processors and cores in your computer,\
    \ without the need to link to any third-party library.\n\nWe refer to the excellent\
    \ C++ Concurrency in Action textbook by Anthony Williams [28] for multi-threaded\
    \ programming in C++11.\n\nIn addition, our algorithm keeps allocating small bits\
    \ of memory on every elementary operation for the node and for its vector of arguments.\
    \ The default allocators behind the new operator and the STL's vector are not\
    \ optimally suited for the allocation of a large number of small bits of memory.\
    \ For maximum performance, you may want to use a memory pool instead. Memory pools\
    \ pre-allocate large chunks of memory, fill them with small objects as they come,\
    \ and free all memory at once when it is no longer needed. Memory pools can speed\
    \ up the Monte-Carlo simulations with memory pools, nodes are not scattered throughout\
    \ memory; they remain localized together, improving the efficiency of the CPU\
    \ cache."
