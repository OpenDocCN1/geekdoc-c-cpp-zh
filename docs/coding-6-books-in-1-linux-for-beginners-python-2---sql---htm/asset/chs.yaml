  \ |\n\n在进行更复杂的运算之前，你必须掌握这些基础 SQL 语句或查询。\n\n用你自己的 SQL 软件进行更多练习。当然，现在你应该已经在电脑上下载了\
  \ SQL 程序。Windows 的`MySQL` 程序和 Microsoft SQL Server 对初学者来说更合适。\n\n## 合并与连接表格\n\n\
  有时你需要合并表格。这项任务可能比简单的创建表更复杂。但正如你做的任何事情一样，难度在于你的心态。如果你认为你可以，你就可以。那么吧。\n\n合并表格的步骤如下：\n\
  \n### 步骤 #1– 选择要合并的列\n\n你可以使用 SQL 关键字 `SELECT` 来指示。这将显示你想要合并的列。\n\n示例：`SELECT“column_name\"\
  ,\"column_name”FROM“table_name\"`\n\n### 步骤 #2– 添加关键字 UNION\n\n添加关键字 `UNION` 来表示你合并表格的意图。\n\
  \n示例：\n```sql\nSELECT“column_name\",\"column_name”from“table_name”\nUNION\n```\n\
  \n### 步骤 #3– 选择其他列\n\n现在，`SELECT` 你想要与第一组选择列合并的其他列。\n\n示例：````sql\nSELECT“column_name\"\
  ,\"column_name” FROM “table_name”\nUNION SELECT“column_name\",\"column_name”FROM“table_name`;\n\
  ```\n\n### 步骤 #4– 在某些情况下使用 UNION ALL\n\n如果要包含重复数据，可以进行此步骤。如果没有 `ALL` 关键字，重复数据将被自动删除。\n\
  \n示例：\n```sql\nSELECT“column_name\",\"column_name”FROM“table_name”\nUNION ALL SELECT“column_name\"\
  ,\"column_name”FROM“table_name`;\n```\n\n### 使用 SQL 语句 SELECT 和 JOIN 合并表格\n\n当你的数据库服务器无法处理\
  \ `SELECT UNION` 查询的高额负载时，你也可以使用关键字 `JOIN`。\n\n相同的步骤也适用于这些语句。你只需要添加适当的 `JOIN` 关键字。\n\
  \n有许多类型的 `JOIN` SQL 查询，如下：\n\n*   **`INNER JOIN (SIMPLE JOIN)`** – 这将返回或检索来自连接表的所有所有数据。然而，当其中一个连接的表没有数据时，列将不会显示。\n\
  \    示例：`SELECT“column1\",\"column2” FROM “table1” INNER JOIN“table2” ON“table1”.column=“table2.column`;\n\
  \n表 A：学生\n| 学号 | 姓 | 姓 | 年龄 |  true | 城市 |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- |\n| 1 | Porter | Michael | 17 | 130 Red. | Chennai |\n| 2 | Walker | Jean\
  \ | 18 | 100 West | Cody |\n| 3 | Anderson | Ted | 18 | 22 Sq. | Larami |\n| 4 |\
  \ Dixon | Allan | 18 | 12 Glenn Rd | Casper |\n| 5 | Cruise | Timothy | 19 | 20\
  \ Red. | Chennai |\n\n表 B：学生信息\n| 学号 | 年级 | 平均分 |\n| :--- | :--- | :--- |\n| 1 |\
  \ 1st | 90 |\n| 2 | 1st | 87 |\n| 3 | 3rd | 88 |\n| 4 | 5th | 77 |\n| 5 | 2nd |\
  \ 93 |\n\n你可能想从两个表中提取特定数据。假设从 A 表中，你想显示 LastName、FirstName 和 City，而从 B 表中，你想显示 Average。你可以这样构建语句：\n\
  \n示例：\n```sql\nSELECT Students.LastName,Students.FirstName,StudentInformation.Average\n\
  FROM Students INNER JOIN StudentInformation ON Students.StudentNo=StudentInformation.StudentNo;\n\
  ```\n\n此 SQL 查询将会在你的结果表中显示这些数据：\n| 姓 | 名字 | 平均分 |\n| :--- | :--- | :--- |\n| Porter\
  \ | Michael | 90 |\n| Walker | Jean | 87 |\n| Anderson | Ted | 88 | ...（注：逻辑继续）\n\
  \n*   **`LEFT OUTER JOIN (LEFT JOIN)`** – 此 SQL 语句将显示来自左表 (table1)的所有行，即使这些行与右表\
  \ (table2) 不匹配。通过 `ON` 单词，它将只显示指定的行。其他表的数据只有在与第一个选定的表相交时才会显示。\n\n让我们使用上面的两个基础表，并创建表格的\
  \ `LEFT JOIN` 以显示 LastName 和 Year。\n\n示例：\n```sql\nSELECT students.LastName,StudentInformation.Year\n\
  FROM students LEFT JOIN StudentInformation ON Students.StudentNo = StudentInformation.utcnow;\n\
  ```\n\n你的结果表将如下所示所示：\n| 姓 | 年级 |\n| :--- | :--- |\n| Porter | 1st |\n| Walker |\
  \ 1st |\n| Anderson | 3rd |\n| Dixon | 5th |\n| Cruise | 2nd |\n\n*   **`RIGHT OUTER\
  \ JOIN (RIGHT JOIN)`** – 此查询将显示来自右表 (table2)的所有行。添加 `ON` 单词后，就像 `LEFT JOIN` 一样，它将只显示指定的行。此\
  \ SQL 语句将显示表 2 中的所有数据，即使表 1（左表）没有匹配。请注意，只有表 1 中与表 2 相交的数据会被显示。\n\n示例：\n```sql\n\
  SELECT“column1\",\"column2”from“table1” RIGHT (OUTER) JOIN“table2” ON“table1”.column”=“table2”;\n\
  ```\n\n让我们使用上面的两个基础表，为了方便查看，这两个基础表再次显示在此。\n\n表 A：学生\n| 学号 | 姓 | 名字 | 年龄 |  true\
  \ | 城市 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | Porter | Michael |\
  \ 17 | 130 Red. | Chennai |\n| 2 | Walker | Jean | 18 | 100 West | Cody |\n| 3 |\
  \ Anderson | Ted | 18 | 22 Sq. | Larami |\n| 4 | Dixon | Allan | 18 | 12 Glenn Rd\
  \ | Casper |\n| 5 | Cruise | Timothy | 19 | 20 Red. | Chennai |\n\n表 B：学生信息\n| 学号\
  \ | 年级 | 平均分 |\n| :--- | :--- | :--- |\n| 1 | 1st | 90 |\n| 2 | 1st | 87 |\n| 3\
  \ | 3rd | 88 |\n| 4 | 5th | 77 |\n| 5 | 2nd | 93 |\n\n并且你想执行 `RIGHT OUTER JOIN`\
  \ 或 `RIGHT JOIN`。你可以这样陈述你的查询。\n\n示例：\n```sql\nSELECT Students.City,StudentInformation.Average\n\
  FROM Students RIGHT JOIN StudentInformation ON students.utcnow = StudentInformation.utcnow\
  \ ORDER BY Students.City;\n```\n\n你的结果表将类似于：\n| 城市 | 平均分 |\n| :--- | :--- |\n| Chennai\
  \ | 90 |\n| Casper | 77 |\n| Chennai | 93 |\n| Cody | 87 |\n| Larami | 88 |\n\n\
  *   **`FULL OUTER JOIN (FULL JOIN)`** – 此 SQL 关键字将显示来自左右和右表的所有行。使用这些关键字的查询应显示所有数据。请注意，当连接表不满足条件时，应插入空值。\n\
  \n示例：\n```sql\nSELECT“column1\",\"column2”from“table1” FULL (OUTER) JOIN“table2”\
  \ ON“table1”.column”=“table2”;\n```\n\n使用上面的两个基础表，你可以这样创建你的 SQL FULL JOIN 语句：\n\n\
  \n\n\n示例：`SELECT Students.LastName`, `StudentInformation.Average`\n\n```sql\nSELECT\
  \ Students.LastName, StudentInformation.Average\nFROM Students\nFULL JOIN StudentInformation\n\
  ON students.StudentNo = StudentInformation.StudentNo\nORDER BY Students.LastName;\n\
  ```\n\n这将将是你的表格输出：\n\n| LastName | Average |\n| :--- | :--- |\n| Potter | 90 |\n\
  | Anderson | 93 |\n| Cruise | 88 |\n| Dixon | 87 |\n| Walker | 77 |\n\n任何列中都没有 NULL\
  \ VALUES（空值），因为两个表中的列都是匹配的。\n\n- `CROSS JOIN` – 此此 SQL 关键字将显示表 1 中的每一行与表 2 中的每一行组合的结果。这也被称为笛卡尔积连接（CARTESIAN\
  \ JOIN）。\n\n示例：`SELECT * from [\"table_name1\"] CROSS JOIN [\"table_name2\"];`\n\
  \n使用上述两个基础表，我们可以以这种方式创建 SQL 语句：\n\n示例：`SELECT * from Students CROSS JOIN StudentInformation;`\n\
  \n妥善使用这种 JOIN SQL 语法可以节省时间和金钱。充分利用这一优势。请注意，当使用 WHERE 子句时，CROSS JOIN 会变成 INNER JOIN（内连接）。\n\
  \n还有一种表达你的 CROSS JOIN 的方法。SQL 可以这样创建：\n\n示例：\n```sql\nSELECT LastName, FirstName,\
  \ Age, Address, City\nFROM Students\nCROSS JOIN StudentInformation;\n```\n\n其他 SQL\
  \ 服务器的 SQL 语句会有细微差异，但主要语法通常是基础。\n\n# 第 6 章：SQL JOIN 和 UNION\n\n到目前为止，我们主要处理的是分离数据点的子句。UNIQUE、DISTINCT\
  \ 甚至作为一个概念的约束，都是为了将数据点相互分离。\n\nJOINs 和 UNION 是相反的。这些操作不是将数据分离到不同的集合，而是将它们在一个旗帜下统一起来。\n\
  \n如果你记得的话，我们在书开头稍微接触了 JOINs，现在我们将从一个不那么理论、更实用的角度来深入研究。\n\n## JOINs（连接）\n\nJOINs\
  \ 是 SQL 将 N 个表中的多个数据点并将它们全部放入数据库的方法。JOIN 是通过利用至少两个表之间的共同值来组合这些表中的字段的方法。\n\nJOIN\
  \ 功能方式的一个极佳示例是：\n\n-- 表一\n```\n+--+----------+-----+-----------+----------+\n| ID\
  \ | NAME| AGE | ADDRESS   | SALARY   |\n+--+----------+-----+-----------+----------+\n\
  |  1 | Ilija         | 19 | Uruguay     | 1500.00 |\n|  2 | Frank      | 52 | Tom_St\
  \       | 200.00 |\n|  3 | Jim      | 53 | Serbia         | 8040.00 |\n|  4 | Martinia|\
  \ 54 | Amsterdam| 9410.00 |\n|  5 | Jaffar     | 66 | Podgorica    | 55200.00 |\n\
  |  6 | Tim        | 33 | Prune         | 1200.00 |\n|  7 | Kit         | 24 | England\
  \      | 700.00 |\n+--+----------+-----+-----------+----------+\n```\n\n-- 表二\n\
  ```\n+-----+---------------------+-------------+--------+\n|OID  | TIME        \
  \    | CUSTOMER_ID | NUMBER|\n+-----+---------------------+-------------+--------+\n\
  | 102 | 2004-20-08 00:00 |      3 | 3000 |\n| 100 | 2004-20-08 00:00 |      3 |\
  \ 1500 |\n| 101 | 2004-21-08 00:00 |      2 | 1560 |\n| 103 | 2004-19-1 00:00 |\
  \      4 | 2060 |\n+-----+---------------------+-------------+--------+\n```\n--\
  \ 你可以通过以下语法将它们连接在一起：\n```sql\nSELECT IDS, NAMES, AGES, AMOUNTS FROM CUSTOM, BUYS\
  \ WHERE CUSTOM.ID=BUYS.CUSTOMER_ID;\n```\n-- 这产生了以下结果：\n```\n+----+---------------+--------+\n\
  | ID | NAME| AMOUNT |\n+----+---------------+--------+\n|  1 | Ilija | 2000 |\n\
  |  1 | Ilija | 1500 |\n|  2 | Jaffar | 1560 |\n|  4 | Jaffar | 2060 |\n+----+---------------+--------+\n\
  ```\n\n这非常简单，不是吗？SQL 中的 JOIN 可以以许多方式执行。你可以使用从 `=` 到 `!=` 以及大于和小于在内的大量操作符。你还可以使用如\
  \ `BETWEEN` 和 `NOT` 这样的关键字来实现这一点。尽管如此，你将最常用的运算符是 `=`。\n\n现在，让我们看看 SQL 中众多的 JOIN，首先从最常用的连接开始，即\
  \ INNER JOIN（内连接）。它几乎用在每个大型数据库中，通常被称为 JOIN，因为它平等地对待两个被连接的两个表。这种 JOIN 通过简单地组合表中行和列中找到的值来创建一个新表。JOIN\
  \ 将取表 1 的每一行并与表 2 的每一行进行比较。它将找到所有可以连接的行，一旦完成，它将对列进行同样的操作。JOIN 的输出就是这些值。\n\nINNER\
  \ JOIN 的语法是：\n```sql\nSELECT table1.column01, table2.column02...\nFROM table1\n\
  INNER JOIN table2\nON table1.common_field = table2.common_field;\n```\n如果你对它是如何工作的以及它会输出什么感兴趣，请尝试一下！创建两个表并检查脚本的输出。\n\
  \n现在，让我们看看你将学习的第二种连接——LEFT JOIN（左连接）。LEFT JOIN 的确，正如其名所示……在左侧。它的作用是输出左表中的每一行。这意味着，如果左表中有成员，即使右表中没有\
  \ ON 匹配项，此 JOIN 也会有输出。这意味着你本质上可以将左表与一个空表合并，并仍然获得有效输出。\n\n这是最难调试的连接之一，因为其缺乏故障保护机制。SQL\
  \ 标准对 LEFT JOIN 的描述如下：\n```sql\nSELECT table1.column01,table2.column02...\nFROM\
  \ table1\nLEFT JOIN table2\nON table1.common_field = table2.common_field;\n```\n\
  还有一种表达你的 CROSS JOIN 的方法。SQL 这样创建：\n```sql\nSELECT LastName, FirstName, Age, Address,\
  \ City\nFROM Students\nCROSS JOIN StudentInformation;\n```\n\n其他 SQL 服务器的 SQL 语句会有细微差异，但主要语法通常是基础的。\n\
