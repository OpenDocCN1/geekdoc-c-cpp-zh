  \n……那么你就学了一个重要的概念。你刚刚学会了程序员如何将复杂的东西封装进一个可以运行的容器中。在我们开始做某些决定之前，让我们看看如何使用变量来引用数据，这包含了命令的输出。\n\
  \n### Bash 变量与命令替换\n\n变量是内存块的符号名称，可以对其赋值值，并对其内容进行读取和操作。至少，这些名称有助于使代码更具可读性。尽管如此，在高级编程中，变量变得更加实用或易用，在那种情况下，你会发现实际值在程序执行之前是未知的。变量更像是一个在执行时解决的占位符。让我们举个例子：假设\
  \ `urls.txt` 有一个地址列表。下面的例程通过 `cat`（虽然这不是最好的，但目前够用）将每一行读入 `for loop`，该循环随后下载所有的 URL（在下一章中查找关于\
  \ for loop 的详情）。\n\n![Description: 0047.jpeg](img/00104.jpeg)\n\n如果你开始感到困惑，让我带你简单介绍一下变量的基本用法和语法。\n\
  \n### 设置变量\n\n下面的命令将“Hello world”赋值给 `var_a`，并将 `42` 赋值给 `other_var`\n\n![Description:\
  \ 0048.jpeg](img/00105.jpeg)\n\n与你熟悉的大多数语言不同，bash 对变量设置非常挑剔。具体来说，在变量名、等号和值之间不允许任何空格。这些示例会触发错误：\n\
  \n![Description: 0049.jpeg](img/00106.jpeg)\n\n### 引用变量的值\n\n有时这被称为参数替换或变量扩展。\n\n\
  ![Description: 0050.jpeg](img/00107.jpeg)\n\n### 字符串拼接\n\n当涉及到反复使用的文本模式时，你会发现变量非常有用：\n\
  \n![Description: 0051.jpeg](img/00108.jpeg)\n\n如果你的变量名紧邻字面字符，这种涉及大括号的冗长格式对于引用变量的值很有帮助：\n\
  \n![Description: 0052.jpeg](img/00109.jpeg)\n\n### 变量变量命名\n\n变量名可以包含下划线和字母数字序列。你创建的所有变量都应该以下划线或字母开头；而不是数字。这里是一些合法的变量名称：\n\
  \n![Description: 0053.jpeg](img/00110.jpeg)\n\n当你编写函数和脚本并传入参数进行处理时，这些参数将自动传递给命名为数字的变量，例如\
  \ `$2` 和 `$3`。一个很好的例子是：\n\n![Description: 0054.jpeg](img/00111.jpeg)\n\n命令将在 `hello.sh`\
  \ 中使用 `$1` 引用‘Hello’，使用 `$2` 引用‘42’，使用 `$3` 引用‘world’。查看下面的变量引用：\n\n`$0`\n\n###\
  \ 它将展开为脚本的当前名称-例如 `hello.sh`\n\n### 接下来对 Linux 做什么？\n\n我们将继续导航 Ubuntu 发行版，概述如何安装和设置你的操作系统。记住，任何\
  \ Linux 操作系统的优势之一在于你可以对其进行定制以适应你的需求。\n\n桌面版本\n\n在桌面版本中，你将发现大部分是即插即用的。图形和文本将引导你。应用程序允许你导航你需要执行和拥有的功能，就像\
  \ Windows 或 macOS 一样。再次，你会看到熟悉的图标、任务栏和菜单。\n\n### 图形界面与命令行？\n\n\n\n\n如前所述，尽管你依赖桌面版本提供的图形化用户界面（GUI），但当你需要时，你仍然拥有使用命令行界面（`CLI`）的能力。不同的\
  \ Linux 发行版进入这些提示符的方法各不相同。对于各种版本的 Ubuntu，可能需要通过点击“应用程序”菜单、“辅助工具”，最后点击“终端”来实现，在终端中你就可以获得输入命令的提示符。\n\
  \n你可能会觉得选择 GUI 版本是为了完全避免使用 `CLI`。然而，有些人其实非常喜欢这种图形界面与提示符的结合。你以后观看或阅读的任何教程都可能包含一些你即使在桌面版本中可以在提示符下使用的命令。这些命令可能依然适用。关于这一点需要注意的几点是：如果你经常执行相同的操作，那么通过命令行自动化任务会非常有用。在\
  \ GUI 崩溃等情况下，它也非常方便。学习一些基础知识是很有好的，因为你永远不知道什么时候会需要它们！\n\n## 应用与软件\n\n安装后，你的 Ubuntu\
  \ 发行版已经自带了许多预装的应用程序和程序。这些可能包括：Firefox、OpenOffice、音乐和视频播放器、社交媒体和即时通讯工具，以及一些让事情变得实用或风趣的常用应用。\n\
  \nLinux 最棒的部分在于定制化。如果你不确定应该安装什么，应该在 Google 上搜索最适合你需求的应用程序、程序或软件，但它的美之处在于你可以进行定制，而不像我们大多数人习惯的带有大量第三方或专有内容的预装系统。其中许多来自仓库。Linux\
  \ 仓库（Linux Repositories）是存放你可以随时调用的许多程序和应用的地方。其中大多数都是开源的，但有些可能不是。\n\n通过 Ubuntu，你可以轻松点击鼠标访问新闻应用和软件，快速检索并安装你需要的任何内容。\n\
  \n![Description: 00016.jpeg](img/00113.jpeg)\n\n访问仓库的一种快速简便的方法是通过所谓的“Syn 软件包管理器”（Synaptic\
  \ Package Manager）。通过它你可以访问从游戏到 MS Office 的各种内容。进入系统文件，然后在“管理”（Administration）下点击\
  \ `Synaptic Package Manager`。寻找 `ubuntu-restricted-extras` 并通过软件包管理器安装它。这将允许访问某些专有应用程序。通常情况下，你可以从该管理器检查并安装你想要的程序。\n\
  \n在桌面版本中访问仓库的另一种方法是使用 `CLI` 命令。这将在“服务器”部分进行更多介绍，在那里由于缺少 GUI，`CLI` 是至关重要的。你将使用如 `apt-get-install`\
  \ 等命令从相同的仓库获取应用程序，但这将通过 `CLI` 界面以文本形式进行。再次，指南末尾会有列表。你将看到一个初学者基础命令列表，这对于导航 `CLI`（即使在桌面层面）将非常有帮助。你还会看到一个更全面的列表，它不仅能帮助新手，还能引导你进入中级学习阶段。\n\
  \n桌面版本的魅力之一就是这种多功能性。\n\n## 安全、更新与效率\n\n每位 Linux 用户或开发者都会建议你在开始深度折腾安装你的版本之前做一些非常特定的事情。安全和稳定性也是维护\
  \ Linux 的关键，这将让你享用多年。以下是 Linux 用户建议在安装后要做的前 10 件事：\n\n1. 立即安装并更新 Ubuntu 版本（尽管如果你是第一次使用系统，听起来可能没必要）。这是以防开发者自版本发布以来已发布补丁并修复了任何问题。\n\
  2. 根据你的需求调整设置、外观和行为。\n3. 确保调整任何隐私设置以提高安全性。\n4. 按你的喜好调整主题、壁纸和菜单。调整工具可以提供更多选项。\n5.\
  \ 安装 `AppGrid` 和 `Synaptic Package Manager` 来帮助查找和安装内容。\n6. 安装 `GetDeb` 和 Play 仓库，以及软件个人存档\
  \ (`PPAs`) 的更新源，并确保启用仓库（以访问授权软件）。\n7. 关闭广告。\n8. 现在就安装任何媒体解码器、音频播放器和驱动程序。\n9. 安装如\
  \ Google Chrome、Skype、GIMP 等免费应用。\n10. 设置即时通讯、社交媒体账户和云连接。\n\n## 为桌面创建多个工作区\n\n你还可以使用工作区（workspaces）来真正最大化你的\
  \ Ubuntu Ubuntu，充分利用它，并为了乐趣或享受进行多任务处理。某些版本不会显著显示这些选项，但它们可以在不同的发行版通过不同的方式启用。你应该检查你的发行版，并在网上搜索如何激活你所在版本的工作区。这通常只需要点击几次。\n\
  \n取决于 Ubuntu 的版本，例如，在每个环境中，你可能需要点击启用或管理工作区、添加应用程序或添加小部件来使用这些功能。很快，你就拥有了多个工作区，这可以帮助组织和分离你的活动，假设你同时处理多项任务，这将非常有用。你应该尝试激活并测试它们。\n\
  \n![Description: 00017.jpeg](img/00114.jpeg)\n\nUbuntu Linux 中的多工作工作区\n\n## CLI\n\
  \n你可能也应该学习一些可以在提示符下使用的基础命令，以防万一（是的，这已经被建议过几次了！）。指南的最后一章节有命令列表。你会发现进入“应用程序”、“辅助工具”，然后到达“终端”后，你就可以访问\
  \ `CLI` 并看到一个提示符。这正是命令大显身手的地方。有些用户非常喜欢这种额外的方式来定制他们希望系统执行的操作、自动化任务以及使用快捷键。\n\n此外，如果你在以后某个时刻切换到服务器版本，你已经对命令有了一些了解和知识，并且对系统文件的结构和位置有了更好的理解。正如你之后将读到的，Linux\
  \ 中的一切都是文件。它们的结构与 Windows 等不同。通过使用 GUI，你将从一个角度来看待。当你使用 `CLI` 时，你将真正更好地理解文件树和目录如何与硬件和软件协同工作，构成所谓的操作系统。这也是\
  \ Linux 爱好者获得自由感的地方，这种自由不仅来自于应用程序和其他其他系统资源的开源，还源于让你的计算机真正为你服务的自由和灵活性。\n\n### 在服务器版本中进行\n\
  \n然而，你可能需要花时间在服务器版本上。它并不那么直观，在以这种方式探索 Linux 之前和期间，了解某些细节非常有用的。如果你熟悉 DOS，这只是学习命令和代码的问题。如果你不熟悉，你将面临相当长的学习曲线。\n\
  \n\n\n\n首先，你将使用你提供的信息登录你的新服务器版本。你将看到一个带有 Shell 提示符的纯 DOS 界面。你不会像在桌面版本那样看到图形用户界面\
  \ (GUI)。现在你需要使用命令在这一新的操作系统中移动到任何地方。你应该设置一个非常安全的密码和 root（用户）名称。务必完全按照原样记录这些信息。在 Linux\
  \ 中，标点符号非常重要。不同的拼写意味着完全不同的结果。你将再次看到这个提醒。\n\n# 万物之根 (The Root)\n\n在 Linux 中，“Root”这个词有几个含义。Root\
  \ 用户（Root User）是计算机的管理员（用户名为 `root`），它是权限最高的用户，拥有全特权限。\n\nRoot 也是 Linux 中任何事物的最高层或核心。它还是软件安装的位置，相当于\
  \ Windows 中的 `C:/Homе`。从文件的角度上说，它是文件的最高层。Linux 中的所有内容要么目录，或者是目录内的文件，而它们都在 Root 目录下。\n\
  \n命令 `sudo` 的意思是“Super User Do（超级用户执行）”。这意味着你，作为 Root 用户（即管理员），拥有访问文件和程序的完全权限。在某些发行版中，你需要使用它作为某些命令的前缀。\n\
  \n![Description: 00018.jpeg](img/00115.jpeg)\n\nwww.ubuntusеrverguide.com\n\n# 掌握你的命令\
  \ (Get Command over Your Commands)\n\n与现在的大多数事情一样，你可以在 Google 上进行一些简单的搜索，以获取大量的\
  \ Linux 命令列表。通过这些命令，你可以在 Linux 中导航任何地方。本书的最后一章包含了一个详尽（但并非完整）的 Linux 命令词表。你不应该期望记住这个列表，但你应该开始熟悉\
  \ Linux 的语言。\n\n一些最重要和实用的命令将带你进入、退出和穿梭。为了强调和补充早的观点，你在命令中使用大小写至关重要。命令的拼写非常具体，因此请注意使用正确的大小写。空格和单词顺序也很重要。你可能无法到达任何地方，或者可能会来到一个你无打算去的地方。\n\
  \n在 Linux 长长的命令和命令组合列表中，还有一些“内置”（builtin）命令。正如其名，内置命令已经包含在 `Bash` shell 内部。当一个简单命令的第一个单词是内置命令时，shell\
  \ 会执行该命令而不需要运行其他程序。\n\n如前所述，每个发行版都有自己的优势和挑战。需要注意的是，每个发行版的命令可能相同也可能不同。鉴于命令是导航此版本\
  \ Linux 的唯一方式，这一点是关键。你绝对应该对你选择的发行版的兼容性和用法做一些研究，现在你还想研究该特定发行版的特定命令。\n\n你会发现许多命令有一些共同的根源，你可以通过其他命令、关键词、文件名或程序名对其中一些命令进行扩展。有一些初学者需要立即使用的命令。跟随操作并尝试一下。\n\
  \n# 需要时获取帮助 (Get Help When You Need It)\n\n这里有几个刚开始就要知道的简单事情。这些可能是你的救生圈。“Man”页面是手册（说明性）页面。你也会像\
  \ `sudo` 命令一样，用这个命令作为另一个命令的前缀。使用 `man` 会打开一个包含你所需的所有屏幕，就像一个数字手册页。需要时尝试不同的变。知道如何到达某处、如何退出以及如何寻求帮助可能很重要，但当你学习系统时，这些可能会让你非常沮丧。\n\
  \n*   `man –k`：搜索包含某个术语的所有命令。你也可以使用 `apropos`。\n*   `man`：显示帮助信息。\n*   `info`：显示帮助信息（以不同形式）。\n\
  *   `whatis`：显示 man 页的描述。\n*   `whеreris`：告知 man 页的位置。\n\n要退出 man 页，输入 `Q` 即可。这是退出手册页的唯一方法。要退出大多数其他地方，只需输入\
  \ `Exit`。命令 `more` 和 `less` 也用于显示超出当前屏幕内容的文件。你可能需要阅读帮助页上看到的更多信息。这对于系统的初学者来说尤为重要。在输入命令后，只需使用空格键向下滚动。要退出，输入\
  \ `q` 退出。\n\n# 移动 (Moving around)\n\n你很快就会学会 Linux 中有很多目录，你应该熟悉它们。虽然万物皆为文件，但目录是一种特殊类型的文件。目录出现在列表中，并以树的形式关联。与使用\
  \ GUI 的操作系统不同，你不会看到扩展名。你需要了解如何导航、查找它们。正如命令一样，目录的大小写和符号也很重要。正如前面提到的，空格键在设置文件名时很有用。这些小事情会产生影响。这些小错误可能会导致你死锁。在最坏的情况下，Linux\
  \ 中的错误可能会造成严重损害，如删除文件。你应该设置时使用划线代替空格。\n\n初学者应该熟悉的几个目录和功能有：\n\n*   `/home`：这是你的根，文件存储。\n\
  *   `/dev`：存放设备文件。\n*   `/cd`：切换目录。\n*   `/etc`：类似于控制面板。\n\n## 使用目录 (Using directoris)\n\
  \n`pwd` 命令将打印工作目录。这也是查看你所在位置的好地方。\n\n要查看目录（从主目录开始以及之后的其他目录），你可以输入 `ls` 列出目录内容。注意，主目录配置时会有一些隐藏文件。要看到它们，你必须使用点。例如，你不会只输入\
  \ `ls`，而是输入 `ls -b`。\n\n要移动到名为 `xyz` 的子文件夹，你需要将 xyz 如下所示：`cd xyz`。\n\n返回主目录，输入 `cd~`。进入根目录，输入\
  \ `cd /`。回到父目录，你应该输入 `cd ..`。\n\n# 安装程序 (How to Install Programs)\n\n`apt-get` 命令获取并安装独立的视觉软件包。这就是你创建服务器的方式。你将使用特定的命令手动获取任何你需要个性化\
  \ Linux 服务器的内容。\n\n存储库包含许多你可以随时调用的 Linux 程序。这些程序也是开源的。如果你此时不知道自己需要什么，应该在 Google\
  \ 上搜索最适合你需求的软件。\n\n然后访问存储库，例如，你会输入 `sudo apt-get install (program name)` 来获取副本并自动安装。`tasksel`\
  \ 命令在 Ubuntu 中意味着 **task-select**。如果你运行它，将出现一个屏幕给出常见的服务器类型、软件包和任务列表。你可以选择并安装服务器所需的任何内容。\n\
  \n\n\n\n例如，你可以输入 `sudo apt-get install tasksel` 来获取 `tasksel` 功能，然后通过 `sudo apt-get\
  \ install (后面跟着你想要的任务名称、服务器名称等)` 来使用它。\n\n如果你想安装 LAMP 服务器，可以输入命令 `sudo apt-get install\
  \ lamp-server` 来自动完成此操作。\n\n![Description: 00019.jpeg](img/00116.jpeg)\n\n`apt-get\
  \ install` 的示例 ([www.en.flossmanuals.net](http://www.en.flossmanuals.net))。\n\n\
  如果你任何时候需要帮助，既然你已经知道了 `man` 页命令，你可以输入：`man tasksel`。你将看到帮助页出现以满足你的需求。\n\n## 如何卸载\n\
  \n若要卸载，你只需输入 `apt-get remove (在此情况下为服务器的名称)`。使用此命令获取你的的大部分软件，并从免费的开源软件开始。\n\n##\
  \ 更新\n\n安装软件后，你可以使用升级命令 `sudo apt-get upgrade`。通过仓库进行轻松更新。手动更新它们比设置自动更新要简单。由于 Linux\
  \ 的高效性，你不需要频繁更新。它也更安全。\n\n**任务管理器：** `top` 提示命令类似于“任务管理器”，用于查看进程以及每个进程占用的空间，或停止程序运行。\n\
  \n使用命令 `h` 获取你随时可能需要的命令列表。\n\n输入命令 `sudo top`（访问任务管理器或 top 界面），然后输入命令 `K`（kill，杀死），然后输入你想杀掉的进程旁显示的进程\
  \ ID（称为 `PID`）。\n\n## 停止/启动/重启服务\n\nLinux 服务器极少重启，但在某些时刻你可能需要重启软件或服务。\n\n要启动/停止或重启，你将输入命令：`sudo/etc/init.d/(程序名称)\
  \ start`（或 stop 或 restart），以进行更改，并在处理更改时离线，例如在发生崩溃或重新配置文件时。\n\n现在你已经有了一些关于身处何处、要去哪里、以及如何获取、安装或删除东西的基础知识，请花些时间测试这些内容。后面是一份常用命令列表，以及一个更详尽（但不是全部）的列表。这并非无穷尽尽，但它展示了你现在就可以执行的一些任务，或者你可能期待学习的任务。\n\
  \nLinux 是一个不断演化的操作系统，考虑到发行版和环境的多样性，情况将继续不断变化。随着我们技术的进步，改进和利用 Linux 系统的机会越来越多。\n\n\
  ## 初学者前 35 常用常用命令列表\n\n如果你必须记住它们：\n\n1. `apt-get`: 搜索并安装软件软件包\n2. `bzip2`: 压缩/解压文件\n\
  3. `cd`: 切换目录\n4. `chmod`: 更改文件的访问权限\n5. `cp`: 复制一个或多个文件或目录到位置\n6. `date`: 显示或设置日期与时间\n\
  7. `df`: 显示磁盘可用和已用空间\n8. `emacs`: 文本编辑器\n9. `exit`: 退出 shell\n10. `find`: 搜索符合特定模式的文件\n\
  11. `hostname`: 打印或更改系统名称\n12. `install`: 复制文件，设置/更改属性\n13. `locate`: 搜索并查找文件\n\
  14. `ls`: 列出目录内容信息\n15. `man`: 显示特定命令的帮助信息\n16. `mkdir`: 创建新文件夹/目录\n17. `mv`: 移动或重命名目录和文件\n\
  18. `nano`: 带有菜单快捷键文本编辑器\n19. `open`: 在原始应用程序中打开文件\n20. `ps`: 显示当前进程状态\n21. `pwd`:\
  \ 显示/打印工作目录\n22. `quota`: 显示磁盘使用情况、限制\n23. `reboot`: 重启系统\n24. `rm`: 删除目录或文件\n25.\
  \ `rmdir`: 删除、清空空目录或文件夹\n26. `shutdown`: 关机或重启\n27. `sftp`: 安全文件传输程序\n28. `sudo`:\
  \ 以特定权限的用户身份执行命令\n29. `tar`: 从 tar 包/归档中存储、列出或提取文件\n30. `top`: 列出当前运行的资源和进程\n31.\
  \ `uptime`: 显示系统运行时间\n32. `wget`: 获取文件或网页 (HTTP, FTP)\n33. `yum`: 从仓库安装的包管理器\n34.\
  \ `zip`: 归档文件\n35. `zip / unzip`: 创建 .zip 归档或从 .zip 提取\n\n# 第 7 章 从外部驱动器运行 Linux\
  \ Live 及更多\n\n![penguin-8640_64](img/00117.jpeg)\n\n运行 Kali Linux 最简单的方法是从 USB 盘以“Live”（现场）模式运行。这种方法也有很多优点。\n\
  \n### 可启动 USB 盘的优点\n\n**无破坏性**：由于是直接从 USB 盘运行，它不会对你的机器或机器上现有的操作系统进行任何更改。要回到没有 Kali\
  \ 的现有设置，你只需拔掉 USB 盘并重启系统即可。\n\n**便携性**：你可以将 Kali Linux 操作系统带在口袋里的任何 USB 盘上，并在任何可用机器上运行。\n\
  \n**可定制性**：如前一章所述，你可以使用脚本。\n\n**持久化**：通过一些自定义，你可以让 Kali Live 存储在重启后仍保留的数据。\n\n###\
  \ 创建可启动 USB 盘的需求\n\n1. 适用于你要运行或安装的系统的 Kali Kali ISO。\n2. 如果你使用 Windows，需要 Win32\
  \ Imager 软件来创建 Kali USB。\n3. 一个容量大于 4GB 的 USB 盘。如果你的系统支持 SD 卡槽，也可以使用 SD 卡。\n\n###\
  \ 安装\n\n让我们通过创建 Kali Linux USB 盘的过程。过程会根据创建 USB 的主机系统而异。\n\n### Windows\n\n1. 将\
  \ USB 插入机器并注意对应的驱动器号。启动之前下载的 Win32 Imager 程序。\n2. 选择 Kali 安装文件，并确保选择了要写入的 USB 盘。点击写入。\n\
  3. 写入 USB 盘完成后，你可以弹出驱动器并将其作为可启动 USB 启动 Kali Live 或在机器上安装 Kali。\n\n### Linux\n\n\
  在 Linux 操作系统创建可启动 USB 非常简单。一旦你下载并验证了 Kali ISO 文件，就可以在终端中使用 `dd` 命令将文件写入 USB 盘。你需要\
  \ root 或 `sudo` 权限来运行 `dd` 命令。\n\n警告：如果你不确定如何使用 `dd` 命令，你可能会将 Kali Linux 镜像写入你并非意意的磁盘驱动器。因此，在使用\
  \ `dd` 命令时保持警惕很重要。\n\n第一步\n\n你需要知道用于将 Kali Linux 镜像写入 USB 盘的设备路径。在不将 USB 盘插入插槽的情况下，在终端命令提示符中执行以下命令。\n\
  \n```bash\nsudo fdisk -l\n```\n\n你将看到显示系统中所有挂载设备的输出，它将显示分区为\n\n```\n/dev/sda1\n\
  /dev/sda2\n```\n\n第二步\n\n现在，插入 USB 盘并再次运行相同的命令 `sudo fdisk -l`。这次你会看到额外的设备，即你的 USB\
  \ 盘。它会显示为\n\n```\n/dev/sdb\n```\n\n你的 USB 盘的大小将写在旁边。\n\n第三步\n\n\n\n\n使用下面所示的命令仔细地将镜像写入\
  \ USB 驱动器。在上面的示例中，我们假设你的 Kali Linux ISO 文件名为“kali-linux-2019.1-amd64.iso”且它位于你当前的工作目录中。块大小参数\
  \ `bs` 可以增大，但理想值为 `bs=512k`。\n\n写入 USB 驱动器需要几分钟时间，完成写入所需的时间略多于 10 分钟属于正常现象。\n\n\
  `dd` 命令在过程完成之前不会显示任何输出。如果你的 USB 驱动器有 LED 指示灯，你会看到它闪烁，这表明磁盘正在被写入。一旦 `dd` 命令完成，输出将类似于：\n\
  \n```\n5823+1 records in\n5823+1 records out\n3053371392 bytes (3.1 GB) copied,\
  \ 746.211 s, 4.1 MB/s\n```\n\n这将结束对公式的处理。你现在可以使用该 USB 驱动器启动进入 Kali Linux Live 系统，或者在机器上开始安装\
  \ Kali Linux。\n\n### 在 OS X 上创建可启动 Kali USB 驱动器\n\nApple OS X 是基于 UNIX 的操作系统。因此，在\
  \ OS X 上创建 Kali Linux 可启动 USB 驱动器与在 Linux 上的操作相似。下载并验证你的 Kali Linux ISO 副本后，只需使用\
  \ `dd` 命令将 ISO 写入你的 USB 驱动器。\n\n**警告：** 如果你不确定如何使用 `dd` 命令，你可能会将 Kali Linux 镜像写入你并非希望的磁盘驱动器中。因此，在使用\
  \ `dd` 命令时保持警惕极其重要。你可以按照以下步骤将 ISO 写入 USB 驱动器。\n\n### 第一步\n\n在不将 USB 驱动器插入 MAC 桌面电脑或笔记本电脑的情况下，在终端窗口的命令提示符中输入以下命令：\n\
  \n```\ndiskutil list\n```\n\n### 第二步\n\n系统将显示所有挂载在系统上的磁盘路径列表，以及分区数据：\n\n`/dev/disk1`\n\
  `/dev/disk2`\n\n### 第三步\n\n现在插入 USB 并再次运行 `diskutil list` 命令。你会发现列表现在显示了你的 USB 驱动器。它应该是第一次没有出现的那一个。让我们假设它是：\n\
  \n`/dev/disk6`\n\n### 第四步\n\n你可以使用以下命令从系统卸载 USB 磁盘：\n\n```\n/dev/disk6\ndiskutil\
  \ unmount /dev/disk6\n```\n\n### 第五步\n\n继续使用以下命令仔细地将 Kali Linux ISO 写入你的 USB 驱动器。这假设你当前的工作目录与保存\
  \ ISO 文件的目录相同。块大小参数 `bs` 可以增大，理想值为 `bs=1m`。\n\n写入 USB 驱动器需要几分钟时间，完成写入所需的时间略多于 10\
  \ 分钟属于正常现象。\n\n`dd` 命令在过程完成之前不会显示任何输出。如果你的 USB 驱动器有 LED 指示灯，你会看到它闪烁，这表明磁盘正在被写入。一旦\
  \ `dd` 命令完成，输出将类似于上面的示例。\n\n这将结束公式的处理。你现在可以使用该 USB 驱动器启动进入 Kali Linux Live 系统，或者在机器上开始安装\
  \ Kali Linux。\n\n要在 OS X 机器上从目标驱动器启动，在电脑启动后立即按下“Option”键并选择你想要使用的驱动器。\n\n### 安装与设置\n\
  \n一旦你可以选择你喜欢的发行版，就可以下载安装包或获取 Live CD 发行版来让 Linux 运行在你的电脑中。\n\n### 为硬盘留出空间\n\n如果你要在\
  \ PC 电脑上安装 Linux，你可能需要缩小 Windows 操作系统占据的分区以为 Linux 留出空间。要做到这一点，你需要创建一个电脑在设置后可以启动的分区。这适用于需要安装在硬盘上的发行版，例如\
  \ Debian 和 Fedora。你可以使用 Windows 创建分区，也可以简单地启动你拥有的发行版，然后使用分区编辑器 GParted。该程序能够对磁盘进行重新分区，通常在后续版本中使用。\n\
  \n**提示：** 如果你打算使用带有 Live CD 的发行版（如 Ubuntu），你就不需要为 Linux 创建分区。你只需从 CD 启动，然后安装程序将对你的\
  \ Windows 分区执行收缩操作。\n\n**警告：** 分区硬盘时存在丢失所有数据的风险。请确保你已经备份了所有文件。\n\n### 使用 Live CD\
  \ 和可启动 USB 发行版\n\n许多发行版都能够从优盘盘或 Live CD 运行，不需要你承诺必须将其安装到驱动器中。这意味着你可以先尝试它们的功能，甚至在其中保存程序。然而，你可能会发现下次启动电脑时需要更多空间，或者希望操作速度更快。如果你认为你已经有了想要的发行版，双击显示“安装”的图标并按照安装向导操作。安装向导通常会引导你完成以下过程：\n\
  \n1. **准备**：确保你正在符合硬件要求的机器上安装 Linux 发行版。在安装的此阶段，你可能会被问及是否包含某些第三方软件，例如 MP3 播放插件。\n\
  2. **无线设置**：如果你想下载更新或任何第三方软件，此部分将引导你设置连接。\n3. **硬盘分配**：此步骤将允许你选择如何安装 Linux。你可以选择重装\
  \ Linux、在有另一个操作系统的情况下进行双启动安装 Linux、替换现有的操作系统或升级之前安装的 Linux 发行版。\n4. **位置**：这设置你的电脑在地图上的位置。这对于与其他\
  \ Linux 用户交流以及与 Linux 社区互动非常有帮助。\n5. **键盘布局**：这允许你选择用于操作系统的键盘。\n6. **用户设置**：这允许你选择你的用户名和密码。\n\
  \n# 总结\n\n希望这本书能够帮助你学会如何地使用 Linux，从将其安装到电脑到使用该操作系统创建你自己的程序。我希望这本书也能作为指南，帮助你选择适合你需求的\
  \ Linux 发行版以及用于日常计算任务的应用程序。在书结束时，你应该已经学会了如何在 Linux 环境中使用命令行进行操作，并成功学习了一些增强系统安全的步骤。下一步是学习更多关于创建和编辑\
  \ Shell 脚本，并创建自动化脚本以让你能够更高效地使用 Linux。\n\n### 学习 Python 编程\n\n学习 Python 语言、数据分析和算法，提升你的计算机编程技能，成为一名\
  \ Python 专家\n\n\n\n\n首先，这种语言并不是以名为 Python 的巨蛇命名的。不是的！Rossum 的爱好之一是看喜剧片。他是 70 年代后期一部喜剧剧的忠实粉丝。因此，这种语言的名字借用自《蒙提派的飞行马团》（Monty\
  \ Python’s Flying Circus）。\n\n# Python 的特性\n\n- **易于学习** – Python 的语法简单而优。此外，Python\
  \ 程序员比编写其他语言更喜欢编写它的语法。Python 简化了编程艺术，允许开发者专注于解决方案而不是语法。对于新手来说，这是开启 Python 职业生涯的绝佳选择。\n\
  - **可移植性** – 提到 Python 的可移植性，它让你可以在不进行任何更改的情况下在不同平台上运行 Python。\n- **Python 被描述为高阶语言**\
  \ – 换句话说，你不需要担心内存管理等繁琐的任务。或者，每当你执行 Python 代码时，它会自动将语言转换为计算机能够理解的语言。无需担心任何低级操作。\n\
  - **面向对象** – 由于它是一门面向对象的语言，它将允许你为最困难的问题计算解决方案。面向对象编程通过构建对象，将大问题分解成较小部分成为可能。\n- **拥有巨大的标准库来完成常见任务**\
  \ – Python 提供了不同的标准库供程序员使用。因此，你不需要自己编写所有的代码。相反，你只需要导入相关代码的库。\n\nPython 是由 Guido\
  \ van Rossum 创建的一种多用途语言。该语言以简单的语法著称，让新学者容易理解和使用。本章将介绍 Python 语言的基础知识。请关注。\n\nPython\
  \ 被描述为一种通用语言。它有许多应用，因此，你可以用它来完成许多不同的功能。\n\nPython 语言的语法整洁，代码长度很短。在某个阶段用过 Python\
  \ 的开发者都会表达用 Python 编写代码有多有趣。Python 给你了一个机会更多地思考眼下的任务，而不是语言语法。\n\n# Python 的部分历史\n\
  \nPython 语言的设计始于 20 世纪 80 年代，并于 1991 年 2 月首次发布。\n\n## Python 的应用\n\n### Web 应用\n\
  你使用基于 Python 创建的 CMS 和框架开发可扩展的 Web 应用。开发 Web 应用的热门环境包括 Pyramid、Django、Django CMS\
  \ 和 Phone。\n\nInstagram、Mozilla 和 Reddit 等其他流行网站也是用 Python 语言编写的。\n\n### 科学和数值计算\n\
  有不同的 Python 库用于科学和数值计算。`Numpy` 和 `Scipy` 等库使用 Python 用于通用计算。此外，还有专门为天文学设计的 `AstroPy`\
  \ 等库。\n\n此外，Python 语言在数据挖掘、机器学习和深度学习中被应用。\n\n### 技术程序员的优秀语言\n\nPython 语言是向新手和儿童演示编程的重要工具。这是一门具有重要能力和特性的优秀语言。然而，它是容易学习的语言之一，因为它的语法简单。\n\
  \n### 构建软件原型\n与 Java 和 C++ 相比，Python 稍微慢。在资源受限且强制效率的情况下，它可能不是一个很好的选择。\n\n但 Python\
  \ 是一种构建型的强大语言。例如：你可以应用 `Pygame` 库先开发原型。如果你喜欢这个原型，可以决定使用 C++ 开发正式版本。\n\n# 为什么你应该选择\
  \ Python 作为你的语言\n\n### 简单、美丽的语法\n可以说，在 Python 中编程很有趣。理解一行代码和编写代码变得更容易。语法看起来很自然。例如：\n\
  \n```\nb = 4\nc = 3\nsum = b + c\nPrint(sum)\n```\n即使是你第一次编程，你也可以掌握这个简单的功能。\n\n\
  ### 不是一种非常严格的语言\n不需要在语言中定义变量类型。此外，不需要在行末尾加分号。然而，Python 要求你遵守良好的实践，例如正确的缩进。这些小细节简化了初学者的学习。\n\
  \n### 语言具有表现力\nPython 让你用更少的代码行编写出具有许多功能的强大程序。\n\n### 可爱的社区和支持\n有一个巨大的 Python 开发者社区。你会遇到不同的在线论坛，它们在学习编程时会有帮助。\n\
  \n# 你应该考虑使用 Python 编写软件的理由\n\n### 易于阅读和维护\n在创建应用程序时，你需要专注于源代码的卓越本质，使更新和维护代码的过程变得简单。Python\
  \ 语法允许你在不编写额外代码的情况下演示概念。此外，Python 提供了使用英语术语而不是标点符号的机会。因此，可以使用 Python 构建自定义应用程序而无需编写额外代码。当你编写易于阅读的代码时，它简化了软件更新的过程。\n\
  \n### 与关键平台和系统兼容\n如前所述，Python 可以在不同的操作系统上运行。你甚至可以决定使用 Python 解释器在定义平台上运行代码。此外，Python\
  \ 是一种解释型编程语言。换句话说，你可以在不同平台上运行相同的代码而无需重新编译。因此，一旦你做了任何更改，就不需要重新编译代码。事实上，你可以运行更改后的代码而不重新编译，并立即确认更改的效果。这一特性允许开发者更改代码而不增加构建时间。\n\
  \n### 许多开源技术和框架\n由于 Python 是一种开源语言，它有助于节省软件成本。为什么？你可以包含不同的开源 Python 框架、开发工具和库来缩短开发时间，而不会增加开发成本。\n\
  \n## 分解复杂的软件开发\n\n你可以使用 Python 构建 Web 和桌面应用程序。尽管如此，你仍然它可以开发复杂的科学程序。Python 的设计具有支持数据分析和可视化的属性。你可以使用\
  \ Python 的数据分析属性构建大型自定义解决方案而无需花费额外的精力和时间。或者，Python 语言提供的数据库和可视化允许你以友好且有效的方式可视化和展示数据。应用测试驱动开发（TDD）使用\
  \ Python，可以快速开发软件原型应用。此外，可以通过重构 Python 代码直接从原型开发软件应用。\n\n\n\n\n尽管如此，Python 通过使用\
  \ TDD（测试驱动开发）方法简化了编码和测试。你可以在编写代码之前快速编写相关测试，并采用这些测试来检查应用程序代码。此外，测试还可以根据源代码帮助确认应用程序是否满足预定义的需求。然而，Python\
  \ 也有自己的缺点。例如，它不具备其他现代编程语言中内置的功能。因此，你只需要使用 Python 库和框架来增加自定义软件开发。此外，Python 的运行速度比\
  \ Java 和 C++ 等语言慢。这意味着你需要通过修改应用程序代码来提升 Python 程序的性能。但尽管如此，仍然可以使用 Python 来简化软件维护并加速软件开发过程。\n\
  \n# 第一章 什么是 Python 编程\n\n学习一门新的编程语言是一次很棒的体验。你可能想学习了解更多关于计算机的知识，了解它的工作原理、网站是如何运行的，或者你可能想学习是为了创建自己的应用程序和程序。但如果你以前从未以这种方式操作过计算机，或者没有过编程经验，那么要弄从何开始是很的。通过简单的搜索，你会发现除了\
  \ Python 之外，还有很多编程语言可以使用。从 Java 到 C++ 等等，很难判断哪种编程语言最适合你。\n\n作为一个初学者以及以前从未接触过编程的人，Python\
  \ 是最适合入门的编程语言之一。框架的使用加速了开发，因此开发变得更快、更快捷、更高效。大多数 Web 框架的成本都很低。框架具有强大的安全实现。使用框架最大的好处实际上归功于背后的社区。\n\
  \nPython 长期以来一直被认为是初学者语言，因为它太容易学习了，你从一开始就能理解它。这只是你应该选择学习 Python 的众多原因之一。你也会喜欢这一点：有一个庞大的活跃社区致力于这门编程语言，而且很好的是它是开源的，所以你完全不需要支付任何费用就可以开始。这门语言还可以运行在任何操作系统上，所以无论你想在什么种计算机上使用这种语言都没有关系。\n\
  \n如果你正在预览版或类似的地方浏览这本书的介绍页面，对于是否想学习 Python 犹豫不决，那么，我可以告诉你，你可能应该学。\n\n嗯，Python 基本上是一门极其有用且功能强大的语言。它几乎无处不在。从视频游戏的脚本端（或游戏本身）到密集的服务器端\
  \ Web 应用程序，再到用它构建的大量深度且响应式的桌面应用程序，无一不包。\n\n你应该什么时候使用 Python？答案取决于你具体要做什么。但既然你是一个初学者，我想你还是应该学。\n\
  \n在你读完这本书并继续作为一个程序员成长后，你将通过直觉知道什么时候该以及不该使用 Python。Python 是一门绝对棒的语言，但它的失败之处在于你需要极其接近计算机硬件或编写极其高效的程序时。在这些领域，Python\
  \ 并不擅长。\n\n然而，这并不是说它没有优点。事实上，我认为这是 Python 表现平的少数地方之一。它在那个方面缺失的，在其他领域得到了弥补。例如，与其他语言相比，Python\
  \ 的开发时间通常非常短。这非常容易说明。请比较以下代码片段，第一段来自 C++，第二段来自 Java，最后一段来自 Python。\n\n尽管 Python\
  \ 是初学者喜欢的编程语言，但这并不意味着它没有很多优势。框架的使用加速了开发，因此开发变得更快、更快捷、更高效。大多数 Web 框架的成本都很低。框架具有强大的安全实现。使用框架最大的好处实际上归功于背后的社区。\n\
  \nPython 本身能够创建许多东西，你也可以配合其他几种语言使用这些东西。现在，让我们花点时间来看一下为了帮助你入门你需要了解的所有内容。\n\n## 我为什么应该学习\
  \ Python？\n\nPython 长期以来一直被认为是初学者语言，因为它太容易学习了，你从一开始就能理解它。这只是你应该选择学习 Python 的众多原因之一。你也会喜欢这一点：有一个庞大的活跃社区致力于这门编程语言，而且很好的是它是开源的，所以你完全不需要支付任何费用就可以开始。这门语言还可以运行在任何操作系统上，所以无论你想在什么种计算机上使用这种语言都没有关系。\n\
  \n## Python 的优点\n\n### 于学习\nPython 长期以来一直被认为是初学者语言，因为它太容易学习了，你从一开始就能理解它。这只是你应该选择学习\
  \ Python 的众多原因之一。你也会喜欢这一点：有一个庞大的活跃社区致力于这门编程语言，而且很好的是它是开源的，所以你完全不需要支付任何费用就可以开始。这门语言还可以运行在任何操作系统上，所以无论你想在什么种计算机上使用这种语言都没有关系。\n\
  \n你会发现 Python 易于阅读，而且与其他语言相比，它能够做很多事情。\n\n### 执行快速\n尽管 Python 是初学者喜欢的编程语言，但这并不意味着它没有很多优势。框架的使用加速了开发，因此开发变得更快、更快捷、更高效。大多数\
  \ Web 框架的成本都很低。框架具有强大的安全实现。使用框架最大的好处实际上归功于背后的社区。\n\n### 丰富的库\n一旦你熟悉了 Python，你会发现它带有一个庞大的库。这对于初学者来说是一个好消息，因为库包含了让该语言运行所需的所有函数、代码和其他内容。\n\
  \n### 多平台支持\n无论你喜欢使用哪种平台，你都可以使用 Python。Linux 是很多人会选择的操作系统，但即使你在 Windows 或 Mac 上，你仍然可以使用\
  \ Python。\n\n### 庞大的社区\n无论你以前是否接触过编程语言，知道有一个庞大的 Python 用户社区在你遇到困难时提供帮助将是一件很棒的事。每当你需要想法（比如新项目），或者只是有一个疑问，或者你想学习一些新东西时，都有信息库可以为你提供帮助入门所需的信息。\n\
  \n\n\n\n## 下载 Python\n\n你已经准备好开始用 Python 编写自己的代码了。你想下载该程序，以便学习如何编写你自己的奇妙代码。但在此之前，你需要确保电脑上已经下载了所有正确的组件。好消息是，由于\
  \ Python 与目前正在使用的所有操作系统兼容，你只需要从开启你的个人电脑开始，然后进入下一步即可。\n\n由于这种编程语言是开源且完全免费的，你所做的就是访问\
  \ Python 官方网站 [www.python.com](http://www.python.com) 来开始。有几个不同的版本供选择，所以你应该挑选一个你认为可以使用的版本。每个操作系统都有相应的版本，因此在选择你想要使用的版本之前，请确保也查看一下这一点。一旦你决定哪个版本最适合你的电脑，你只需要点击出现的提示并按照指示操作即可将其下载到你的电脑上。\n\
  \n在你等待 Python 程序完成下载时，你还需要其他一些可以帮助编写这些代码的工具。文本编辑器是你用来编写想要创建的代码的工具。你还需要一个 IDE（或“集成开发环境”），可以使用它来读取和执行你想要的代码。\n\
  \n让我们从文本编辑器开始。你不需要选择一个过于复杂的程序来完成这项工作。Windows 电脑上的记事本文本编辑器或其他程序都可以很好运行。这里有很多选项供你选择，但记事本或类似的程序是免费的，因此对你来说是一个很好的选择。\n\
  \n然后，你还需要花一些时间研究 IDE。如果你不将它添加到电脑中，将无法编写或执行你想要运行的代码。在 IDE 方面有几个不同的选择，所以去对比一下，看看哪种能提供你所需的所有功能。目前有一个可用的\
  \ IDE，你可以通过 Python 获取它以保持简单，但如果你需要更多选择，也有其他选项可用。\n\n一旦你下载了 Python 程序以及你想要使用的 IDE\
  \ 和文本编辑器，就是时候开始编写自己的代码了。这个过程非常简单，但我们确实需要先查看几件事并学习一些基础知识，以便你能够很快开始编写自己的 Python 代码。\n\
  \n## 你应该了解的 Python 基础知识\n\n当你开始用这种语言编写自己的代码时，你会发现代码中会伴随着许多部分。能够理解这些基础部分是如何工作的，将帮助你编写程序所需的代码。本节将快速回顾在你开始使用\
  \ Python 之前需要了解的一些基础知识。\n\n### 关键字\n\n首先，我们需要看看 Python 语言中这些重要的关键字。类似于你在其他编程语言中发现的，Python\
  \ 中有一组关键字列表，用于告诉你的文本编辑器执行什么。这些关键字是保留的，如果你想避免编写代码时出现任何问题，就应该只按照它们的预期用途使用它们。它们基本上是告诉编译器如何运行的命令，并且它们必须保持保留状态，以便你能够在产生不必要问题的情况下执行代码。\n\
  \n## 如何命名标识符\n\n当你准备好在 Python 中编写自己的代码时，你会遇到代码的几个部分，它们被称为 `identifiers`（标识符）。这些\
  \ `identifiers` 有很多不同的名称，可能会让你有点困惑，但它们将帮助你的代码按照你想要的方式运行。你会注意到，在本指南中用于标识符的一些名称包括函数、类和实体。命名标识符时有一些规则需要遵循，但无论你当前处理的是什么类型的标识符，这些规则都是相同的。\n\
  \n命名标识符很简单。你可以随时使用小写字母和大写字母。数字和下划线符号 `_` 也是允许的。上述任何组合都是允许的，只需确保不要在该名称中添加空格。所以你会将其命名为\
  \ `MyProgram` 而不是 `My Program`。\n\n标识符不能与数字开头。在名称中使用数字是没问题的，但你不应该让数字出现在名称的开头或第一个字符处。当你将其输入编译器时，这将导致错误，所以如果你不确定看到错误的原因，请务必双检查是否为此原因。\n\
  \n标识符不应该是我们之前讨论过的关键字之一。这样做会混淆你的编译器，所以请完全避免这样做。\n\n### 语句\n\n在编写写 Python 代码时，你会使用大量的\
  \ `statements`（语句）。这些对你的代码很有用，因为它们只是代码的字符串，其中包含了我们提到过的你将发送给编译器执行的一些其他部分。你可以在代码中编写任何类型的语句，只要它是以编译器能够理解的方式编写的即可。你可以选择让语句简短（例如只占几行），也可以让它变长；对于你应该如何这样做，并没有太多的规定。\n\
  \n### 注释\n\n在编写自己的代码时，你将经常使用的另一个组件是注释。如果其他人正在查看你编写的代码，并且他们对你具体在讨论什么需要说明，那么这些注释就会很有。你可以编写注释，让其他想要阅读或使用代码的人知道正在发生什么。它们基本上是代码内部的小笔记，可以帮助你和其他程序员了解在应用程序运行期间发生了什么。\n\
  \n编写你想添加到代码中的注释非常简单。你只需要在你想要写的注释前面使用 `#` 符号即可。所以你可以写出类似 `#this is my Python code`\
  \ 的内容。注释完成后，你只需按回车键并在下一行开始编写其余的代码。只要你在注释前面有那个符号，你的编译器就可以跳过它，而不会读取你在注释中放入的内容。\n\n\
  \n\n\n\n### 函数\n\n“函数”是 Python 编程语言的另一个重要部分。这基本上是一部分可以重复使用的代码，它通常用于完成代码中的某项操作。函数非常出色，因为它们比其他选项更有效，这意味着你编写代码时不需要浪费大量时间。Python\
  \ 语言中有很多内置函数，你可以从中获益，此外，你还可以编写一些自己的函数。\n\n在编写代码时，你必须确保你正在定义该函数。一旦你能够定义函数并且它被视为最终确定，那么就是时候执行它使其在代码中运行了。你可以选择从\
  \ Python 提示符中调用它，也可以从另一个函数中调用它。\n\n当你将其放入编译器时，你将看到我们在代码内部编写的两个语句将像消息一样显示出来。你可以调用一个函数，并且随时更改代码内部的语句，以确定你以后想要如何执行它们。\n\
  \n## 使用变量\n\n最后，花些时间关注变量是非常重要的。变量之所以重要，是因为它们会在你的计算机内存中开辟空间来存储代码的片段。在创建新变量时，你实际上是在确保计算机上的某些空间被预留。在某些情况下（例如当你处理数据类型时），你的解释器将决定这些信息应该存储在何处，有助于加速过程。\n\
  \n在处理变量时，你的工作仅仅是确保正确的变量与正确的值对齐。这将确保正确的部分在正确的时间出现在你的代码中。好消息是，你可以给变量任何你想要的值，但先检查它在代码中是否真实有效。当你准备好为变量分配新值时，可以使用\
  \ `=` 来实现这一点。\n\n# 第 2 章 如何安装 Python\n\n在 Windows、Linux 和 Mac OS X 上安装 Python 的指南。\n\
