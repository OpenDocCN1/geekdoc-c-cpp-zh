  3. 导航到 Run > module 并查看输出。\n\n# Python 交互\n\n正如第一章所述，Python 语言之所以流行，是因为开发者可以使用其灵活性动态性来实现不同的目标。例如，当你想要逐行测试某个语句或正在学习新属性时，可以使用交互式使用\
  \ Python。当你有一整文件的语句想要解释时，也可以在脚本模式下使用它。\n\nPython 拥有命令行窗口或 IDE，允许程序员交互式使用它。\n\n##\
  \ 让我们看看命令行交互\n\n如前所述，命令行是操作 Python 的最简单方法。通过这个工具，人们可以可视化 Python 的工作方式。它可能不是使用 Python\
  \ 的最佳工具，但仍然学习 Python 如何工作的最简单手段。\n\n### 如何启动 Python\n\n根据你运行的操作系统，有不同的方法可以访问 Python\
  \ 命令行：\n\n* 同时，Windows 用户可以进入快捷方式文件夹并点击 命令行。\n* 对于使用 Linux 和 Mac 系统的用户，你需要运行终端工具并输入\
  \ Python 命令来启动。\n\n计算机命令用于指示机器做什么。因此，如果你想让 Python 执行给定的任务，你必须输入它将解释的命令。\n\n为了理解\
  \ Python 如何工作，你可以使用打印命令打印一条简单的消息：欢迎 Python。\n\n1. 首先，打开你的命令行工具。\n2. 然后在 `>>>` 提示符输入以下代码：\n\
  ```python\nPrint (\"Welcome to Python!\")\n```\n1. 现在按回车指示 Python 你已写完命令。\n2. 接下来，你将在命令行窗口看到消息\
  \ Welcome to Python!\n\n在上面的示例中，Python 以正确的方式做出了，因为你以正确的格式输入了正确的命令。假设你输入的错误的命令；那么\
  \ Python 将返回以下消息：语法错误：Invalid syntax（无效语法）。\n\n\n\n\n\n当你首次打开 IDLE 时，它会在 Shell 窗口中启动。Shell\
  \ 是一个交互式窗口，你可以在其中输入 Python 代码并在同一窗口中监控输出。\n\n**注意：** 在 Windows 系统上，当你点击桌面上的 Python\
