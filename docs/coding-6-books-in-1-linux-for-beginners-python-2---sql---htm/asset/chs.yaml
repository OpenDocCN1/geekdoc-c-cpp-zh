- "# 编程：6本合1：Linux 初学者指南 - Python (2) - SQL - HTML – C++ 编程\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n这是与其他环境不同的另一种环境。当你开始启动这个环境时，你会开始注意到变化。它非常不同，因为它没有启动面板和菜单，而是有一个桌面菜单和独特的元素。然而，这个\
  \ Linux 系统的环境显然不是为所有人设计的。那些想要独特且即插即用的简单环境的人可以选择 Enlightenment。显然，所有的独特性都是带有代价的。这个桌面环境希望你在安装之前先了解它，这样你掌握它时就不会觉得很困难。喜欢钻研独特事物的人会喜欢这个\
  \ Linux 桌面环境。Enlightenment 带有许多主题。这些主题不仅改变了桌面的颜色，还改变了一些细节。它对于热爱变化并经常想更改桌面屏幕的用户来说是完美的。\n\
  \n## Deepin\n\n\n\n\nLinux 操作系统领域的最新成员是 Deepin。在进入市场后，这一布局已成功吸引了许多人。它为桌面带来了令人惊叹的现代视觉效果和体验。这种布局最大的特点是它将所有优秀的桌面特性整合在了一起。它拥有一个非常有吸引力且独特的控制面板。用户会喜欢探索这种新布局，他们会对发现以现代方式实现的令人惊喜的功能感到高兴。对于寻找独特且简单布局的人来说，使用它可以获得最佳体验。\n\
  \n## Linux 系统的组成部分\n\n与其他 Mac OS X 和 Windows 10 一样，Linux 也是一个操作系统。它由以下部分组成：\n\n\
  **引导加载程序（The bootloader）**：这是管理计算机启动过程的软件。简单来说，它就是弹出后消失的启动界面，用于进入操作系统。\n\n**内核（The\
  \ kernel）**：如果你之前对 Linux 做过一些研究，你应该已经无数次遇到这个词了。它指的是整个系统中被称为 `Linux` 的部分。它是系统的核心；管理外围设备、CPU\
  \ 和内存。\n\n**守护进程（Daemons）**：这些是后台服务，如调度、音频和打印，它们会在你登录计算机时或在启动过程中启动。\n\n**外壳（Shell）**：你可能也听过这个词很多次，或者叫\
  \ `Linux 命令行`，它曾让许多人对 Linux 望而却步（可能是因为他们认为必须学习一些枯燥的命令行结构才能使用该操作系统）。`shell` 是一个命令进程，允许你通过在文本界面中输入命令来控制计算机。今天，你可以在甚至不碰命令行的情况下使用\
  \ Linux，但正如我们很快将看到的，与命令行配合工作是重要的。\n\n**图形化服务器（Graphical server）**：这简单来说是在在你的显示器上显示图形界面的子系统。它通常被称为\
  \ `x` 或 `x server`。\n\n**桌面环境（The desktop environment）**：这是“桌面”这一比喻的实际实现，由运行在操作系统可见表面的程序组成，你将直接与之交互。你有许多桌面环境可以选择，包括\
  \ `gnome`、`enlightenment`、`xfce`、`utility` 和 `cinnamon`。桌面环境带有一内置应用程序，其中包括配置工具、文件管理器、游戏和网络浏览器等。\n\
  \n**应用程序（Applications）**：如你可能已经知道的，桌面环境通常并不提供全套应用。Linux 提供了数千种软件，你可以轻松地访问和安装，Windows\
  \ 和 Mac 也是如此。\n\n上述描述将帮助你轻松阅读完书的其余部分。现在让我们进入使用程序的部分。第一步是选择发行版，你接下来就会发现这一点。\n\n##\
  \ 选择你的发行版（Distro）\n\n在我们开始使用命令行之前，我们必须确保你已经准备就绪。因此，你需要做的第一件事是选择你的发行版。与 Windows 不同，Linux\
  \ 没有单一版本，这就是为什么我们有很多 Linux “发行版”。\n\n这些发行版获取 `kernel` 并将其与其他软件（如桌面环境、图形化服务器、网络浏览器等）结合在一起。因此，发行版将所有这些元素统一成一个你可以安装和使用的操作系统。\n\
  \n从适合初者的版本到适合即时和高级用户的版本，有适合任何所需级别的版本。你只需要将你偏好的版本下载到 USB 闪盘中，并将其安装到你喜欢的任何数量机器上。\n\
  \n你应该选择哪种发行版？你需要一个易于安装的发行版，它需要拥有优秀的应用程序，并且对于日常活动易于使用。此外，发行版在需要时需要易于调整。正出于这些原因，我推荐这个重量约为\
  \ 1GB 的微型发行版。介绍……tiny！除了这些参数外，tiny 节省了大量空间，且在初始设置期间只需要你有有线网络连接。所需的内存内存仅为 128MB。嗯，在选择发行版时你可以考虑其他因素，但这完全取决于你想用它做什么。你将使用的发行版显然非常适合没有任何经验、刚开始接触\
  \ Linux 的人。它也被称为 TCL，Tiny 是一个非常特殊的发行版，专为移动而设计。与其他发行版一样，你可以带上它并从 USB 闪盘、CD 或硬盘运行它。在本节中，我们将使用\
  \ TCL 作为示例，演示如何下载和安装 Linux 发行版。\n\n## 关于 Linux 的神话\n\n尽管比其他操作系统更有优势，许多人仍然不愿意切换到\
  \ Linux，因为他们听过许多关于它的神话。本章将探索围绕 Linux 的一些神话，并提供真实信息。\n\n### 神话 #1：Linux 很难用\n\n事实是，所有的操作系统都是不同的，需要一些时间来适应。如果你曾在\
  \ Windows 和 Mac 之间切换，你就完全了解这个问题。在 Windows 操作系统中导航与在 Mac 上摸索完全不同。然而，你不会直接放弃并说它太难学了，尤其是当你刚刚投入大量资金购买了一个新操作系统时！不，你会学习如何使用它并逐渐调整。几周后，它就会变成你的本能，你甚至不需要思考自己在做什么。同样的原理也适用于\
  \ Linux。它并不一定比 Windows、Mac 或任何其他操作系统更难。相反，它只是不同。你需要给自己一些时间来适应界面以及桌面程序的工作方式。给自己几周时间，你可能会发现\
  \ Linux 实际上比许多其他操作系统都要易用。\n\n### 神话 #2：Linux 只有命令行\n\n当 Linux 最初被创建时，GUI 技术还处于婴儿阶段。结果是几乎所有的操作系统都使用命令行界面，而不是你熟悉和喜爱的图形界面。直到\
  \ 20 世纪 90 年代，微软使用的是 `MS-DOS`，这是一个命令行界面。这是 Linux 开始兴起的时期，因此许多人将其与命令行界面联系起来。今天的 Linux\
  \ 系统使用 GUI 界面，所以你仍然可以获得可以点击的图标图形桌面。你也可以完全通过命令行使用 Linux，一些人发现这是充分利用 Linux 性的最佳方式。然而，对于大多数用户来说，GUI\
  \ 界面在满足他们的计算需求方面已经绰绰有余。你使用 Linux 时完全不需要学习任何命令行。\n\n### 神话 #3：Linux 缺乏其他操作系统的应用程序多样性\n\
  \n确实，Linux 的应用程序没有 Windows 和 Mac 那么多。然而，想一下对于例如列出每周购物清单，你可以下载多少不同的应用程序。实际上，你只需要一个应用程序就够！虽然\
  \ Linux 的应用程序较少（允许你创建每周购物清单的程序较少），但它有足够的变体来满足你的所有需求（仍然有用于购物清单的应用，只是没那么多）。此外考虑到在\
  \ Mac 和 Windows 之间，并不是所有的应用程序都兼容这两个平台。你通常需要为 Mac 下载一个版本，为 Windows 下载另一个版本。有些应用程序在\
  \ Mac 上无法运行，或者在 Windows 上无法运行。这一原则同样适用于 Linux 的事实不应该阻碍你使用它。\n\n\n\n\n大多数主流应用程序（如\
  \ Skype）都兼容 Linux。你仍然可以使用它们来充分利用你的 Linux 体验。\n\n### 误区 #4：你无法在 Linux 上成为一名游戏玩家。\n\
  \n确实，如果你是一个住在父母地下室、只顾玩游戏而不顾工作生计的硬核玩家，你可能会发现 Linux 的性能还不够强大。然而，对于休闲玩家来说，例如那些喜欢在周末玩幻想橄榄球的人，有许多\
  \ Linux 发行版可以支持这种生活方式。游戏网站 `Steam` 拥有超过 3000 种兼容 Linux 的游戏，甚至还有它自己的基于 Linux 的游戏机台。作为额外奖励，如果你是一个\
  \ 90 年代的怀旧少年，你可以使用 Linux 终端来玩街机游戏！\n\n如果你是一名玩家并想使用 Linux，Ubuntu 是一个非常棒的发行版。虽然同样的游戏可能不像在\
  \ Windows 上那样立即可用，但你应该能够足够快地访问它们。\n\n### 误区 #5：Linux 不适用于计算机桌面电脑。\n\n如今，包括 NASA\
  \ 在内的许多大型公司都使用 Linux 来运行它们的服务器。它在物联网中也发展迅速（物联网是指不同设备之间的连接，如汽车、冰箱、咖啡壶和家庭安系统）。这导致了一个误区，认为\
  \ Linux 最适合服务器，而不是适合大多数人用于个人和工作计算的桌面电脑。\n\n事实是，虽然 Linux 足够强大可以帮助构建物联网并运行 NASA 服务器，但它也足够普及，供人们在桌面端日常使用。你可以用它浏览网页、编辑图片、上传文件、进行文字处理、创建电子表格，以及你通常在桌面上做的任何其他事情。\n\
  \n### 误区 #6：Linux 不安全。\n\nLinux 的源代码对任何想要查看它的人公开开放，这一事实导致了 Linux 不安全的误区。然而，这与事实大相径庭。下一章将更详细地介绍\
  \ Linux 如何如何由于其基础结构和用户拥有的访问类型而比其他操作系统更安全。现在，请理解，虽然代码是公开的，但这并不意味着任何人都可以进入并用病毒渗透。代码的更改经过审核的并且必须获得批准。\n\
  \n### 误区 #7：Linux 太不受欢迎了，不值得学习它。\n\n确实，大多数公司和企业都使用 Windows 作为他们的首选操作系统。然而，许多政府机构使用\
  \ Linux 的事实应该让你意识到它极具价值。事实上，接受过 Linux 培训的人（特别是技术支持角色的人）能够赚到多多的钱。这部分是因为这是一项稀缺的技能，另一部分是因为使用它的组织知名度很高。阻碍\
  \ Linux 进一步增长的最大障碍可能在于接受过其培训的人员不足。\n\n### 误区 #8：Linux 软件是被盗版的。\n\n这完全不是 true 事实。人们自愿创建用于\
  \ Linux 的源代码并对其进行捐赠。事实是，许多市售的软件（例如微软的软件）是基于公共用途设计的代码创建的。\n\n### 误区 #9：Linux 摧毁了知识产权。\n\
  \nLinux 免费提供的这一事实导致了一种观点，认为人们无法拥有自己知识产权的权利；相反，它必须以一种社会主义的形式免费分发。虽然基于对 Linux 的浅层理解，这种观点是可以理解的，但事实恰恰相反。垄断（如\
  \ 1990 年代的微软）会破坏知识产权和创造性开发。他们经常获取个人创建的想法并将其纳入自己的产品，从而剥夺了创造者的权利。Linux 免费意味着人们可以自愿分发他们的知识产权，而不是放弃它。事实上，当你提交代码并被接受时，你会在上面签名！\n\
  \n### 误区 #10：Linux 正在走向终结。\n\n毕竟，免费的开源软件如何持续？人们需要为自己的工作获得报酬。而且，一分钱分货。如果你下载一个免费的东西，它的质量可能很差。\n\
  \n完全不是这样。Linux 免费意味着任何人都可以使用它；这是创作者认为的计算基本权利的实践：它应该对任何人开放。这一事实意味着有一个庞大的贡献者群体，他们可以将自己的创造力用于改进它。正如第\
  \ 7 章将解释的那样，代码通过的过程非常复杂。Linux 基金会的团队采用了高标准的卓越标准。\n\n这些仅仅是围绕 Linux 的一些误区以及它们背后的事实。如果你发现自己除了本章解释的内容之外还有其他疑虑，鼓励你上网进行自己的研究。亲自发现真相，以便判断\
  \ Linux 是否适合你。\n\n# 第 2 章\n\n## 学习基础知识与技术概述\n\n![linux-154544_960_720](img/00038.jpeg)\n\
  \n事故可能在任何时间发生，没有任何预警。因此，使用其他主机、磁带、软磁盘以及 CD 来提供一个安全存储的地方是极关重要的。\n\n可靠的备份工具绝对不是可选的，每个人都应该拥有一个。这绝对并不意味着你需要花一笔钱来购买一套备份方案。备份费用是你需要随时准备好的费用之一，因为你永远不知道何时会产生需求。\n\
  \n没有备份操作，行政职责就无法完成，因为它是行政功能的不可或缺的一部分。传统的 `dump/restore` 工具可以帮助你完善备份过程，因为它们可以检测自上次备份以来的数据变化。\n\
  \n\n\n\n在为 Linux 系统选择备份方案时，考虑如自动更换器、备份介质、开源软件、数据格式、跨平台支持、卷影复制、报告和告警、商业支持、去重、多卷备份、加密数据流等内容非常重要。\n\
  \n## 选择合适的备份工具\n\n选择合适的备份方案是一个重要的问题。有很多选项可供选择。你应该能够找到最适合你需求的方案。为了帮助你做出选择，我们将查看一些流行的备份方案及其优缺点。\n\
  \n### Amanda\n\n缺点包括 Amanda 备份系统的中心化。如果你的备份需求不包含磁带或介质，那么 Amanda 并不是合适的选择，因为它涉及持续的填满和更换；此外，你必须依赖中央服务器来管理一切。选择更简单的解决方案更好，因为你的需求可能对\
  \ Amanda 来说大过其实。如果你的工作需要介质和中央系统，你将发现 Amanda 凭借其高效的备份以及同时写入磁带和磁盘的能力是最佳选择。\n\n###\
  \ Bacula\n\nBacula 被认为是 Amanda 的良好替代方案，但同样取决于你的需求。和 Amanda 一样，Bacula 是开源且免费免费的。要使用\
  \ Bacula，你需要在每个想要备份的机器上安装客户端程序。它通过中央服务器进行控制。Bacula 使用自己的文件格式，而不是标准的 Unix 工具进行备份。\n\
  \n当你使用多个带有不同磁带驱动器的服务器时，Bacula 是更好的替代方案，因为它支持增量和全量常规备份。Amanda 支持加密和 RAIT，而 Bacula\
  \ 则有一个用于自定义的脚本语言。你可以寻求这种语言的帮助创建加密。\n\n在决定这两个备份系统中哪一个最适用时，取决于你的需求和架构。也应该考虑你员工的偏好。如果你使用带有一个磁带驱动器的中央备份服务器，Amanda\
  \ 将最适合你；如果你使用分布在网络中的磁带驱动器，Bacula 将是正确的选择。\n\n### BackupPC\n\nBackupPC 设计用于将 Linux\
  \ 或 WinXX 笔记本电脑和桌面电脑备份到文件服务器；它也是免费开源的。它以高性能著称，被高效地用于较小规模的操作中。\n\n它提供的功能包括长期存储和保留小型公司桌面快照的能力。用户可以恢复自己的备份，并检测到特定计算机（漫游笔记本电脑）的存在。如果你一段时间没有进行备份，系统会自动发出提醒。\n\
  \n用户和管理员可以使用 Web 界面来启动备份。每个文件都存储在指定的独立存档中，这允许于访问并快速恢复单个文件或一组文件。\n\n使用 BackupPC 的缺点是在进行大容量恢复时性能缓慢。如果你有大量数据，它对于远程使用来说并不是一个可行方案。你压缩的存档只能通过\
  \ BackupPC 的工具读取，这使得你产生了依赖。积极的一面是，由于它是开源的，你可以始终保留源代码，从而确保对程序的持续访问。\n\n### Rsync\n\
  \n不同的 Linux 备份解决方案在后端都使用了 `rsync`。这是一个很好的工具，可以结合脚本来创建远程镜像和其他备份方案。那些认为自己（无论是个人还是商业上）不需要特殊备份工具的人会更倾向于这种方法。\n\
  \n`rsync` 可以作为服务器守护进程运行。它将允许远程用户将文件副本同步到你的系统，同时保留整个目录并仅传输更改的文件。你可以在不下载完整版本的情况下更新文件，如镜像站和软件\
  \ FTP 站点都可以充当 `rsync` 服务器。\n\n`rsync` 可用于从一个主机到另一个主机远程复制文件或目录，实现智能且特定的备份。`rsync`\
  \ 设计为仅复制那些被修改过的文件，而不是整个目录。存档保存了所有权和权限，允许相关用户通过主机系统访问。该工具的简单设置使其成为执行临时备份的良好选择。当你需要以复制形式进行更多备份（这可以包括将文件、目录和内容复制到不同位置）时，`rsync`\
  \ 效果最好。\n\n### 商业 Linux 备份产品\n\n如果你正在寻找商业备份产品，赛门康（Symantec Corp.）的 Veritas Net Enterprise\
  \ 是一个很好的选择。它是一个企业级服务器，支持 Windows、许多 Unix 和 Linux。它还对 VMware 等各种环境提供特殊支持。NetBackup\
  \ 维护着一个仪表板，提供对容量、趋势、恢复和备份服务的费用与成本、合规性等方面的洞察。如果你不想维护自己的报告，或者没有找到你正在使用的其他解决方案，这就是你的最佳选择。赛门康带有\
  \ Linux 代理的 Backup Exec 以及 BackupZone 的 NetVault 也是其他流行的商业解决方案。\n\n在寻找 Linux 工具时，一个稳健的备份和恢复计划是必不可少的。在你测试过恢复数据的能力之前，该方案是无效的。在选择软件时，你必须从大局来看。这将确保你获得真正的保护。\n\
  \n## 什么是 Linux 发行版？\n\n当你为电脑获取 Linux 时，你本质上获取的是 Linux 发行版。就像其他流行的操作系统一样，你会获得一个安装程序，它由内核、图形用户界面、桌面以及在在电脑上安装\
  \ Linux 后即可直接使用的应用程序组成。额外的奖励是，你还有机会获得内核以及你所获得应用程序的源代码，这允许你按照未来希望它们运行的方式对它们进行调整。到目前为止有多种可用的\
  \ Linux 发行版，你可以在 distrowatch.com 查看。在该网站上，你可以阅读有关特定发行版的更多信息，并找到安装磁盘或下载文件的链接。\n\n\
  虽然你可以添加发行版未提供的桌面环境、应用程序和驱动程序，但你仍然需要找到提供你理想设置的发行版。这样做可以节省你寻找与已安装 Linux 匹配的应用程序和其他程序时可能花费的时间。\n\
  \n## 发行版带有什么？\n\n### GNU 软件\n\n大多数你使用 Linux 执行的任务都涉及 GNU 软件。这些是你可以通过文本终端（或类似于 Windows\
  \ 命令提示符的输入命令的界面）访问的工具。你使用的 GNU 软件包括命令解释器（也称为 `bash` shell）和 Gnome GUI。\n\n如果你是一个开发者，你将能够\
  \ C++ 编译器（这已随你的 Linux 发行版自带的 GNU 软件）和 Gnu C 修改内核或为 Linux 创建你自己的软件。如果你使用 `emacs`\
  \ 或 `ed` 编辑器编辑代码或文本文件，你也将使用 GNU 软件。\n\n以下是你探索 Linux 工具时可能会遇到的一些流行的 GNU 软件包：\n\n\
  ![Description: 00001.jpeg](img/00039.jpeg)\n\n![Description: 00002.jpeg](img/00040.jpeg)\n\
  \n![Description: 00003.jpeg](img/00041.jpeg)\n\n\n\n\n\n![Description: 00004.jpeg](img/00042.jpeg)\n\
  \n# 1. 应用与图形用户界面\n\n由于你不想为了让电脑执行某些操作而在命令行终端中输入一连串命令，因此你可能希望使用 GUI（图形用户界面）来导航和使用计算机中的程序。GUI\
  \ 允许你点击图标并弹出窗口，这将帮助你更轻松地使用程序。\n\n大多数发行版使用 KDE 桌面环境（K Desktop Environment）或 GNU 对象模型环境（GNOME）。如果你在电脑上同时安装了这两个环境，你可以选择哪一个桌面作为默认，或者随时在它们之间进行切换。这两个桌面环境的体验与\
  \ Mac OS 和 Windows 桌面都很相似。值得注意的是，GNOME 自带一个名为 Nautilus 的图形外壳，这使得 Linux 的配置、文件搜索和应用程序加载变得更容易。如果你需要使用命令行提示符，只需点击两个桌面环境中的终端窗口图标即可。\n\
  \n除了 GUI 之外，任何普通电脑用户还需要使用应用程序，即你可以用来执行基础计算需求的程序。虽然你可能无法访问在 Mac 或 Windows 电脑用过的那些流行程序，但\
  \ Linux 可以提供你可以尝试的开源替代方案。例如，你不需要购买 Adobe Photoshop，可以尝试 The GIMP，该程序在处理图像方面运行同样出色。\n\
  \nLinux 还提供了生产力软件软件包，满足普通电脑用户的大部分需求。你可以从 Libreoffice.org 或 OpenOffice.org 获取办公生产力应用，允许你进行文字处理、创建数据库或制作电子表格。\n\
  \n提示：如果你想在 Linux 上安装 MS 应用（例如 Microsoft office），可以使用 CrossOffice。你可以从 [www.codeweavers.com/products/crossover-linux/download](http://www.codeweavers.com/products/crossover-linux/download)\
  \ 下载此应用。\n\n# 2. 网络\n\nLinux 允许你通过网络与其他计算机交换信息，并找到你需要的一切。Linux 通过允许使用 TCP/IP（传输控制协议/网络协议）来实现这一点，这让你能够上网并与任何服务器或计算机通信。\n\
  \n### 2.1 互联网服务器\n\nLinux 支持互联网服务，例如：\n\n*   电子邮件\n*   新闻服务\n*   文件传输工具\n*   万维网\n\
  *   远程登录\n\n只要有互联网连接并且计算机配置了互联网服务器（一种允许 Linux 计算机向另一台计算机发送信息的特殊服务器软件），任何 Linux 发行版都可以提供这些服务。以下是你\
  \ Linux 中会遇到的常见服务器：\n\n*   `inetd` – 允许你通过名为 `TELNET` 的协议通过互联网登录不同的系统。\n*   `sendmail`\
  \ – 作为邮件服务器，允许使用简单邮件传输协议 (`SMTP`) 在两个系统之间交换电子邮件。\n*   `inn` – 允许你使用网络新闻传输协议 (`NNTP`)\
  \ 查看新闻，这使你能够以存储和转发的方式访问新闻服务器。\n*   `Apache httpd` – 允许你使用超文本传输协议 (`HTTP`) 将文档发送到另一个系统。\n\
  *   `vsftpd` – 允许你使用文件传输协议 (`FTP`) 向另一台计算机发送文件。\n*   `sshd` – 允许你使用安全 Shell (`SSH`)\
  \ 协议通过互联网安全地登录计算机。\n\n### 2.2 软件开发\n\nLinux 是开发者的操作系统，这意味着它是适合开发软件的环境。开箱即用的这种操作系统拥有丰富的软件开发工具，例如用于构建程序的代码库和编译器。如果你有\
  \ C 语言和 Unix 的背景，Linux 应该让你感觉如归家一样。\n\nLinux 为你提供了可能在 Unix 工作站（如 Sun Systems、HP\
  \ (惠尔浦) 和 IBM）上体验过的基础工具。\n\n### 2.3 在线文档\n\n一段时间后，你可能想要查找更多关于 Linux 的信息，而无需翻阅这本书。幸运的是，Linux\
  \ 在线发布了足够的信息，可以在某些提供帮助，例如回忆命令语法。为了快速获取这些信息，你只需要在命令行中输入 `man` 即可获取 Linux 命令的手页。你也可以从桌面获取帮助，使用帮助选项或图标。\n\
  \n## 选择发行版时需要考虑的因素\n\n什么是最适合你的 Linux 发行版（简称 distribution）？以下是你可能需要记住的事项：\n\n###\
  \ 1.1 软件包管理器\n\n区分不同发行版的主要因素之一是它们自带的软件包管理器。正如你可能预期的那样，某些发行版带有的功能可以让你在安装其自带功能时，更容易从命令行进行操作。\n\
  \n除了易用性之外，你需要考虑的另一点是发行版提供的软件包可用性。例如，某些发行版不像其他那样流行，这意味着为这些特定发行版开发的应用程序较少。如果你刚开始学习\
  \ Linux，安装一个不仅承诺从一开始就易于导航，而且提供你未来可能想要安装的广泛应用的发行版可能是一个好主意。\n\n### 1.2 桌面环境\n\n你希望桌面能够良好地配合你的需求。虽然将来你可以放置另一个环境，但你仍然希望使用发行版自带的桌面，以确保你拥有良好的自定义选项并且易于查找。你还希望桌面使用高效且集成性良好。这样，你就不需要花费太多精力来设置每一个你想要的程序了。\n\
  \n### 1.3 硬件兼容性\n\n不同的发行版在其提供的软件包中包含不同的驱动程序，这意味着它们有一套推荐的硬件才能无缝运行。当然，你可以查看其他与你现有硬件最匹配的驱动源，但在要立即运行一切方面这只会增加更多工作。为了避免这种麻烦，请检查发行版的兼容性页面，查看你的电脑外设是否都能工作。\n\
  \n### 1.4 稳定性与领先性\n\n不同的发行版在稳定性和获取最新应用程序和软件包更新方面有不同的优先级。例如，Debian 发行版倾向于延迟某些应用程序更新，以确保你的操作系统保持稳定。这对于某些倾向于始终获取最新版本应用程序的用户可能并不适用。\n\
  \n相反，Fedora 恰恰相反——它专注于让你所有的程序和功能保持最新，并确保你始终拥有 Linux 最先进、强大的工具。然而，这可能是以应用程序的稳定性为代价的，可能会促使你回滚之前的版本。\n\
  \n### 1.5 社区支持\n\n\n\n\nLinux 的核心在于社区，该社区持续为该操作系统提供支持，从文档到故障排除。这意味着，如果你管理的某个特定发行版拥有庞大的社区，那么你很可能获得所需的资源。\n\
  \n## 值得尝试的优秀发行版\n\n现在你已经了解了优秀 Linux 发行版的标准，并且正准备挑选要安装的发行版，你可能想要检查这些可能非常适合你的发行版：\n\
  \n1. **Ubuntu**\n   Ubuntu 的设计很大是为了让普通电脑用户能够轻松使用 Linux，这使得它是初学者的良好选择。该发行版简单、每六个月更新一次，并具有\
  \ Unity 界面，允许你使用如 dock 栏、软件包管理器的类商店界面以及可以让你在操作系统中轻松找到任何内容的仪表板等功能。此外，它还带有一套大多数用户的标准应用程序，例如种子下载下载器、Firefox\
  \ 网页浏览器以及即时消息应用程序。你还可以从其庞大的社区获得极佳的支持。\n\n2. **Linux Mint**\n   该发行版基于 Ubuntu，但设计目的是为任何从未用过\
  \ Linux 的用户让操作变得更加简单——它具有熟悉的菜单，并且不仅局限于让你运行开源程序。这意味着你可以获得流行操作系统中的标准程序，例如 `.mp3` 支持和\
  \ Adobe Flash，以及许多私有驱动程序。\n\n3. **Debian**\n   如果你想谨慎一点，并希望始终运行一个无 bug 且稳定的计算机，那么这可能是最适合你的发行版。它的主要目标是让\
  \ Linux 成为完全可靠的系统，但这可能有一些缺点——Debian 不优先考虑获取你所拥应用程序的最新更新，这意味着你可能需要手动搜索你大部分软件的最新版本。优点是，你可以在许多处理器架构上运行\
  \ Debian，而且它很可能在旧设备上运行。然而，这并不意味着使用 Debian 就必须保持过时——在线和 Linux 仓库中有大量的程序可用。\n\n4.\
  \ **OpenSUSE**\n   OpenSUSE 是一个非常好的发行版，你可以考虑尝试，因为它允许你在无需处理命令行的情况下配置操作系统。它通常带有默认\
  \ KDE 桌面，但在安装发行版包时允许你在 LXDE、KDE、XFCE 和 GNOME 之间进行选择。它还提供了良好的文档、`YaST` 软件包管理器以及来自社区\
  \ Great 支持。使用该发行版可能遇到的一个缺点是它可以消耗大量资源，这意味着在旧款处理器型号和笔记本电脑上使用并不理想。\n\n5. **Arch Linux**\n\
  \   Arch Linux 是为那些想要从零开始构建操作系统的用户设计的。从安装包开始，你得到的只有命令行，你将用它来获取应用程序、桌面环境、驱动程序等。这意味着你可以根据需求将目标设定为尽可能精简或功能尽可能完全。\n\
  \n   如果你想完全了解操作系统内部的内容，那么 Arch Linux 可能是你开始尝试的最佳发行版。你将被迫处理可能遇到的任何错误，这可以是学习操作 Linux\
  \ 的绝佳方法。\n\n   另一个让该发行版特殊的特殊之处是它使用了 `Pacman`，它以强大的软件包管理器而闻名。Pacman 采用滚动更新（rolling\
  \ release）模式，这意味着必须安装包含的每个包的最新版本——这确保了你能够为 Linux 获取最前沿的应用和功能。除了这个软件包管理器，你还可以享受 AUR（Arch\
  \ 用户仓库），它允许你创建程序的可用版本。这意味着如果你需要的某个程序在仓库中可用，你可以使用 AUR 助手来安装应用程序和其他功能。\n\n# 第 3 章\
  \ 命令的使用\n\n![linux-15169_1280](img/0043.jpeg)\n\n当你按下键盘上的 Enter 键运行命令时，你会获得文本形式的反馈。系统通过行向你展示提示符（prompt）。这意味着当你输入命令时，它将显示在提示符之后。在大多数情况下，你正在发布命令。例如：\n\
  \n```\nuser@bash:ls -l /home\ntotal 3\ndrwxr-xr-x 2 users 4096 Mar 23 13:34 bin\n\
  drwxr-xr-x 18 users 4096 Feb 17 09:12 Documents\ndrwxr-xr-x 2 users 4096 May 05\
  \ 17:25 public\nuser@bash:\n```\n\n将此内容拆解：\n\n- **第 1 行**：这向我们用户展示了 bash 提示符。一旦有了提示符，我们就应该输入一个命令，在本例中为\
  \ `ls`。这意味着通常情况下，命令是我们必须输入的第一个内容。之后，我们应该在命令行中输入一个参数（`-l /home`）。在这种情况下，首先需要记住的是这些内容是用空格隔开的。也就是说，在输入命令后，在输入参数之前需要输入一个空格。我们在本例中使用的第一个参数\
  \ `-l` 也称为选项（option）。选项在修改命令行为方面起着至关的作用。它们通常列在其他参数之前，并以横杠（-）开头。\n- **第 2-5 行**：这些代表了我们在运行键入命令后获得的输出。我们输入终端的大部分命令运行后都会产生输出。\n\
  - **第 6 行**：这再次显示了提示符。一旦我们运行了输入终端的命令并获得结果后，我们会得到一个提示符。这意味着如果在运行命令后没有显示提示符，则说明该命令仍在运行。我想让你们知道另一个重要点是，在终端中我们可能没有行号。这些数字只是为了让我解释每一行代表什么。\n\
  \n## 那么我们如何打开终端？\n\n![Description: 00002.gif](img/00044.gif)\n\n在处理 Linux 时，首先需要学习的是如何打开终端。这相当简单。由于每个系统都不同，很难告诉你具体的操作方法。然而，你可以从以下几个地方开始：\n\
  \n如果你使用的是 Mac，首要任务是进入“应用程序”，然后点击“实用工具”。在“实用工具”下，你有一个“终端”选项，选择它，你就有了一个可以输入命令的运行终端。或者，打开\
  \ Linux 终端最好最简单的快捷键组合是 `command + space`。这个组合会调出 Spotlight，你在其中输入 terminal，它就会出现在屏幕上。你也可以下载\
  \ MobaXterm 并在 Mac 上使用 ([`macdownload.informer.com/macterm/download/`](http://macdownload.informer.com/macterm/download/))\
  \ 作为本地终端。\n\n如果你正在使用 Linux，可以通过点击“系统”然后“应用程序”来访问终端。在“应用程序”下，选择“实用工具”并选择“终端”选项。或者，你也可以简单地右键点击桌面空白处，弹出一个下拉菜单。选择“在终端中打开”选项。\n\
  \n\n\n\n如果你正在使用 Windows，有一些方法可以可以使用终端。最好的方法是使用 SSH 客户端访问 Linux 终端，你可以在那里运行命令。一些可以让你实现此操作的应用程序示例有\
  \ MobaXterm ([`download.cnet.com/MobaXterm/3000-7240_4-10890137.html`](http://download.cnet.com/MobaXterm/3000-7240_4-10890137.html))\
  \ 和 Putty ([`www.putty.org/`](http://www.putty.org/))。使用这些软件的第一步是在网上下载并安装到你的电脑上。在桌面上，你有一个快捷方式，每次需要终端时点击即可。\n\
  \n在大多数情况下，使用 root 账户执行普通任务并不是一个好主意。换句话说，当用户运行权限命令或维护系统时，通常是 root 账户起着重要作用。因此，创建用户账户的首要步骤是登录\
  \ root 并使用 `useradd` 或 `adduser` 命令。当使用 Windows 的 MobaXterm 或 Putty 应用程序时，你只需点击桌面上的快捷方式，一个终端窗口就会出现。然后系统会提示你进行登录：\n\
  \n1. `user@bash`: `ssh Gary@hpc.ucdavis.edu.uk`\n2. 禁止未经授权的访问\n3. `sshGary@hpc.ucdavis.edu.uk`\
  \ 的**密码:**\n4. 上次登录：Fri Feb 17 14:34:27 2017 来自 40.290.160.11\n\n一旦你输入账户用户名，系统将像上面所示提示你输入该账户的密码。当你输入密码时，你输入的字符不会显示在屏幕上。这意味着你必须非常小心。主要原因是，当你输错密码时，会收到“登录错误”的消息，这意味着你必须重试。一旦你正确输入了账户密码，就可以访问该账户中的文件和目录了。\n\
  \n### Shell，Bash\n\n在终端内部有一个 shell（外壳）。它是操作系统的一部分，在定义终端行为方式方面起着重要作用。它还负责为你执行命令。有很多种\
  \ shell 可用，但最常见的是被称为 bash。这代表“Bourne again shell”。本 Linux 教程假设你使用 bash 作为你的 shell。然而，如果你想知道自己正在使用哪种\
  \ shell，最好的办法是使用 `echo` 命令。该命令在显示表示当前使用的 shell 系统变量方面起着重要作用。换句话说，`echo` 命令用于显示消息。只要它在屏幕上打印的所有内容都以\
  \ bash 一词结尾，你就知道一切正常。\n\n1. `user@bash`: `echo $SHELL`\n2. `/bin/bash`\n3. `user@bash`:\n\
  \n### 快捷键\n\n最重要的快捷键之一是使用键盘上的向上和向下方向键。当你在 Linux 上输入命令时，这些命令会被记录在历史中。遍历这些历史最简单的方法是使用这两个键。这意味着你以前使用过的命令不需要重新输入。你只需按几次向上箭头即可找到你需要的命令。此外，要编辑以前使用的命令，可以使用左、右方向键将光标移动到你需要进行编辑的地方。\n\
  \n有时你会发现在 GUI 桌面环境中某些功能运行不正常——有时程序会崩溃，整个系统拒绝响应鼠标点击。甚至会出现 GUI 根本无法启动的情况。当你遇到故障时，你仍然可以告诉你的操作系统该做什么，但你必须使用文本屏幕或\
  \ shell 来操作，shell 是 Linux 的命令解释器。\n\n由于 Linux 本质上是一个 Unix 程序，你将使用文本终端完成许多任务。虽然桌面的工作是提供通过鼠标点击访问任何内容的便利性，但在某些情况下你需要访问终端。\n\
  \n学习如何输入命令可以在你遇到 X Window 系统错误时为你规避很多麻烦，X Window 系统是控制你在桌面 GUI 中看到的所有菜单和窗口的程序。要修复此错误，或防止它阻止你访问所需的程序或文件，你可以调出终端并输入用命令。在将来，你可能想在桌面上保持一个终端开启，因为这可以让你比点点更快地控制计算机。\n\
  \n### Bash Shell\n\n如果你过去用过 MS-DOS 操作系统，那么你对 command.com 非常熟悉，它是 DOS 的命令解释器。在 Linux\
  \ 中，这被称为 shell。所有不同发行版的默认 shell 都称为 bash。\n\nBourne-Again Shell（或 bash）能够运行你存储在计算机中作为可执行文件的任何程序。它还可以运行\
  \ shell 脚本，或者由 Linux 命令组成的文本文件。简而言之，这个 shell 充当命令解释器，或者说将你输入的任何内容解释为命令并执行该输入应该执行的操作。\n\
  \n调出终端窗口可以只需点击桌面上一个像显示器的图标即可。如果你找不到它，只需搜索即可。提示：你始终可以通过输入 `chsh` 命令来更改你正在使用的 shell。\n\
  \n### Shell 命令\n\n每个 shell 命令都遵循此格式：\n\n```\ncommand [options] [arguments]\n```\n\
  \n命令行（如上面的命令）后面通常紧跟着参数（也称为参数）。在输入命令时，你需要一个空格来将命令与选项以及另一个命令隔开。然而，如果你想使用包含空格的选项，你需要将其包含在引号中。例如，你可以选择为\
  \ `ls` 命令使用 `-l` 选项，这将列出目录的内容。\n\n`grep` 命令允许你在文件中查找特定文本。一旦你按下回车键，就会得到结果。如果你想读取特定文件，可以使用\
  \ `more` 命令。尝试输入以下内容：\n\n要查看计算机上运行的所有程序，请使用 `ps` 命令。选项 `ax`（选项 a 列出所有进程，而选项 x 显示其他进程）允许你看到系统中的所有可用进程。\n\
  \n命令行选项的数量及其相应的格式取决于具体的命令。这些选项看起来像 `-X`，其中 X 代表一个字符。\n\n如果你输入的命令太长，单行无法容，按下 `\\\
  `（反斜杠）键然后按回车。之后，在下一行继续输入命令的剩余部分。\n\n\n\n\n\n![Description: 00019.jpeg](img/00053.jpeg)\n\
  \n这将显示 `/etc/passwd` 文件中的所有内容。\n\n你也可以通过分号 `;`（分号）符号将不同的短命令在同一行中，将它们串联起来（也称为拼接）。看看这个命令：\n\
  \n![Description: 00020.gif](img/00054.gif)\n\n这条命令将带你跳转到用户的家目录，显示你进入的目录的内容，然后显示当前目录的名称。\n\
  \n### 组合你的 Shell 命令\n\n如果你目标是创建一个更复杂的命令，例如检查 `/dev` 目录中是否存在一个名为 `sbpcd` 的文件（因为你的\
  \ CD 驱动器需要该文件），你可以选择组合不同的命令来缩短整个过程。你可以做的是输入 `ls /dev` 命令来显示 `/dev` 目录的内容，并查看它是否包含你想要的文件。\n\
  \n然而，当命令返回结果时，`/dev` 目录中可能会出现过多的条目。不过，你可以将之前学过的 `grep` 命令与 `ls` 命令结合，搜索你正在寻找的精确文件。现在，输入以下命令：\n\
  \n![Description: 00021.jpeg](img/00055.jpeg)\n\n这将向你显示目录列表（`ls` 命令的结果），同时 `grep`\
  \ 命令会搜索字符串“sbpcd”。管道 `|` 充当你所使用的两个独立命令之间的连接，第一个命令的输出将作为第二个命令的输入。\n\n### 命令替换\n\n\
  命令标准的输出可以被封装，这与将一个值存储在另一个值中的方式非常相似，然后由 shell 进行扩展。这个概念被称为命令替换。\n\n根据 bash 文档，命令替换基本上允许命令的输出替换命令本身。在\
  \ bash 中，扩展是通过执行命令并让命令替换占据命令的标准输出来完成的，同时擦除所有末尾的换行符。嵌入的换行符不会被删除，但在单词拆分期间，它们可能会被删除。\n\
  \n让我们来看一个例子：\n\n考虑 `seq` 命令。它将打印一个从第一个参数到第二个参数的数字序列，如下所示：\n\n![Description: 00056.jpeg](img/00056.jpeg)\n\
  \n命令替换可以帮助你将 `seq 1 5` 的结果封装到变量中。这是通过将命令括在 `$()` 中，并将其参数传递给不同的命令来实现。\n\n![Description:\
  \ 00057.jpeg](img/00057.jpeg)\n\n### 变量与命令扩展\n\n有时命令会被其标准输出所替换；因此，该输出（假设只是文本）可以像任何其他值一样赋值给变量：\n\
  \n![Description: 00058.jpeg](img/00058.jpeg)\n\n### 当换行符被省略时\n\n我之前提到了 bash 文档中的一些内容。\n\
  \n让我给你提供该摘录更深层次的版本：\n\n通过命令替换，命令输出能够替换命令本身。Bash 执行命令并将命令替换为命令的标准输出——这就是它执行扩展的方式。注意，同时，任何末尾的换行符都会被删除。嵌入的换行符不会被删除，但如之前所述，它们在单词拆分期间可能会被删除。\n\
  \n如果你在想这意味着什么，考虑像往常一样调用 `seq 1 5`，然后通过命令替换调用，并注意格式发生了变化。\n\n![Description: 00059.jpeg](img/00059.jpeg)\n\
  \n但为什么换行符在扩展期间被删除了？这是你以后会经历的；这关乎 bash 解释空格和换行符的方式。无论如何，如果你特别来自不同的语言，你可能想要注意这种行为。\n\
  \n### 实际应用中的单词拆分\n\n这是一段关于 bash 在执行扩展时如何处理字符的简短章节。鉴于许多人习惯直接从互联网复制和粘贴代码，了解你可能在不经意间伤害自己的各种方式是值得的。这是由于\
  \ bash 处理空格和换行符的方式。\n\n### 内部字段分隔符\n\n内部字段分隔符 `IFS` 被 bash 用于将字符串拆分为不同的单词。你可以将其想象为\
  \ Excel 将逗号分隔值 (CSV) 文本拆分为表格的方式；根据它，逗号分隔列。\n\n我们假设 `IFS` 被设置为某个任意值，例如 `Z`。当 bash\
  \ 扩展一个包含 `Z` 的变量时，该变量的变量将被拆分为不同的单词（在那种情况下，字面上的 Z 消失了）：\n\n![Description: 00062.jpeg](img/00060.jpeg)\n\
  \n`IFS` 变量默认设置为字符，包括空格、制表符和换行符。如果你执行 `echo $IFS`，你将看不到任何内容，因为显然，没有任何可见字符是不可能看到空格字符。那么结果是什么？很简单，你可能会在网上看到代码片段，其中变量\
  \ `IFS` 被更改为 `$\\n`（这代表换行符）或类似的内容。\n\n想象有一个文本文件，其中有一行文本，例如，它们可能如下引用文件名：\n\n![Description:\
  \ 00063.jpeg](img/00061.jpeg)\n\n当 `IFS` 设置为空格字符时，在读取文件的每一行时，bash 将 `rough draft.txt`\
  \ 视为两个文件 `rough` 和 `draft.txt`。当 `IFS` 设置为换行符时，`rough draft.txt` 被视为一个文件名。\n\n\n\
  \n\n\n你可能在想：“世界上到底谁会在文件名中使用星号字符？”首先，我们确实有喜欢星形符号的人；此外，我们还有带有恶意的黑客和讨厌的恶作剧星，他们并不介意使用星号字符。请注意，变量通常不是由于人工输入而赋值的；如你所知的，有时命令的结果会存储在变量中。当原始数据由此类命令处理时，该类数据可能包含会破坏某些\
  \ bash 程序的特殊字符。\n\n你必须时刻记住，直接粘贴看似安全的代码是有危险的。bash 在处理字符串时的语法和行为非常难以理解，这也就是为什么开发者在开发时会转向其他语言来处理更复杂的应用程序。\n\
  \n读完这些内容，我认为你需要休息一下了。通过学习 bash 的基础方面来休息一下，这些内容将在下一章对你有帮助，即数值比较和字符串比较。\n\n# 第 4 章\
  \ 掌握基本函数和操作\n\n![internet-1593448_1280](img/00066.jpeg)\n\nLinux 允许你使用不同的命令，以及连接这些命令的能力（这在之前的章节中讨论过）。你还学习了如何使用\
  \ I/O 重定向和管道。Bourne-Again Shell 或 `bash` 允许你使用 `IF` 条件，这意味着你只有在满足某些条件时才能运行程序。bash\
  \ 的所有功能都可以用于创建你自己的程序或 shell 脚本。shell 脚本被称为执行任务的 shell 命令集合，这些命令存储在文件中。\n\n在本章中，你将学习如何创建简单的\
  \ shell 脚本，这对于自动执行 Linux 中的各种任务极其有用。\n\n## 创建你的第一个脚本\n\nshell 脚本（也称为编程）对于过去没有尝试过任何编程语言的人来说，可能是令人生畏的。然而，如果你已经在本书的早期章节中尝试过不同的命令，你可能会发现学习编程其实很容易。\n\
  \n如果你是一名系统管理员，你实际上可以创建一个整个自定义脚本集合，它们将帮助你更轻松地完成任务。例如，如果硬盘即将写满，你可能想要自动找到所有超过特定大小且一个月内没有被任何用户访问的文件。你可能还想创建一个脚本，自动发送给所有拥有大文件的用户，以便他们需要设置归档并从你的网络共享资源中删除这些文件。所有这些任务实际上可以通过一个脚本完成。\n\
