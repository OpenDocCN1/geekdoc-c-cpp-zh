  \ \"banana\"\nprint(a, b, c, \"I want to get\")\n```\n写完代码后，我们需要做的就是将文件保存到某处。要这样做，遵循\
  \ `File` 路径并将文件保存到桌面为 `trial.py`。保存文件后，我们可以通过 `Run` 路径或直接按 `F5` 键运行编写好的程序。在这种情况下，得到类似这样的图像：\n\
  \n如果你想运行你的程序，请执行以下操作：\n1.  `Start / Run`，在弹出窗口中输入 `cmd` 并按 `ENTER`。\n2. 导航到保存文件的桌面，通过输入以下命令：`cd\
  \ Desktop`。在 Windows 中第一次打开命令行时，你将处于类似 `C:\\Documents and Settings\\user_namе` 的目录中。\n\
  \n因此，上面显示的 `cd Desktop` 命令将带你进入桌面目录。当然，如果你在不同的目录打开命令行，该命令将带你进入桌面。在这种情况下，你应该输入类似的命令：`cd\
  \ C:\\Documents and Settings\\user_name\\Desktop`。到达桌面后，你可以运行 `python.py` 来运行程序。当然我假设你已经按照这里的方法将\
  \ Python 添加到了 PATH。如果你没有将 Python 添加到 PATH，你也可以使用以下方法运行你的程序：`c:\\python26\\python\
  \ trial.py`。如果一切顺利，我们将得到以下输出：一个苹果，一个梨和一个香蕉。在此期间，你已经讨论了 ROAD 几次了。\n\n在上一节中，我们甚至学习了如何将\
  \ Python 添加到 PATH。但这个 ROAD 是什么？让我们简单看一下。如果你想写一个 Python 程序并向你的用户展示它：`py`。如果一切顺利，我们将得到以下输出：我想买一个苹果，一个梨和一个香蕉。在此期间，你已经讨论了\
  \ ROAD 几次了。\n\n程序或文件的路径大致是该程序或文件所在的目录。例如，Internet Explorer 的路径是 `C:\\Program Files\\\
  Internet Explorer\\explorer.exe`。所以你可以通过以下命令启动 IE：`\"C:\\Program Files\\Internet\
  \ Explorer\\explorer.exe\"`。再举一个例子，hosts 文件的路径是 `C:\\WINDOWS\\system32\\drivers\\\
  etc\\hosts`。所以你可以执行命令查看此文件的内容：`notepad \"C:\\WINDOWS\\system32\\drivers\\etc\\hosts\"\
  `。Python 的路径是 `C:\\python26\\python.exe`。所以我们可以通过以下命令运行：`C:\\python26\\python.exe`。\n\
  \n\n\n注意：`PATH` 目录是用分号分隔的！因此，如果你想向 `PATH` 添加新目录，你必须用分号将其与上一个目录隔开。例如，`notepad.exe`\
  \ 是一个位于 `C:\\Windows` 目录下的程序。由于该目录位于 `PATH` 中，我们可以直接通过名称调用 `notepad`。你也可以通过在命令行中输入\
  \ `notepad` 命令来亲自测试。同样的，`calc.exe` 程序位于 `\\Windows\\System32` 文件夹。由于该文件夹在 `PATH`\
  \ 中，我们可以直接通过名称调用 `Calc` 程序……现在如果我们想直接通过名称调用程序，我们需要将程序复制到 `echo%PATH%` 输出的某个目录中。让我们把程序复制到\
  \ `C:\\Windows` 目录。现在在命令行中：输入 `experiment.py`，我们应该看到我们的程序正在运行。\n\n与其将我们的程序文件添加到\
  \ `PATH` 上的某个目录，将该路径添加到我们的 `PATH` 中也是可行的。要这样做，我们需要在 MS-DOS 中执行如下命令：\n`PATH=%PATH%;%USERPROFILE%\\\
  Desktop`\n如果你需要的话；可以使用 `echo%PATH%` 检查你的桌面应用是否出现在 `PATH` 中。这样一来，桌面上的可执行文件现在就可以通过自己的名称进行调用。然而，当你将桌面添加到\
  \ `PATH` 时，你的桌面并不会一直留在 `PATH` 中，且所有更改会在当前 MS-DOS 会话关闭时恢复。如果你想永久地将桌面目录添加到 `PATH`，你必须像我们之前展示的那样，将其写入系统变量中的\
  \ `PATH` 列表。\n\n问题随之而来：我们能够直接通过名称调用像 Notepad 和 `Calc` 这样的程序而无需指定扩展名 `.exe`。但例如，为了运行我们名为\
  \ `trial.py` 的程序，我们必须指定扩展名。原因是什么？Windows 有一个名为 `PATHEXT` 的特殊变量。该变量包含了系统认为是可执行的扩展名。`echo%PATHEXT%`\
  \ 在这里我们得到以下输出：`.com; .exe; .bat; .cmd; .vbs; .vbe; .js; .j; .wsf; .wsh`，如果有其中之一，它将被视为可执行文件。如你所见，`.exe`\
  \ 是这些扩展名之一。因此，我们可以无需指定扩展名即可调用具有此扩展名的文件。如果你愿意，也可以将扩展名添加到此列表中。这样做，你可以：\n\n1. 双击控制面板中的\
  \ `System`（系统）图标。\n2. 进入 `Advanced`（高级）选项卡并点击 `Environment Variables`（环境变量）按钮。\n\
  3. 在系统变量部分找到并双击 `PATHEXT`。\n4. 在最后一个项目 `wsh` 之后添加项目 `.PY`。\n5. 点击 OK 退出。\n\n现在你也可以运行带有\
  \ `.py` 扩展的文件而无需指定扩展名了……Python 在 Windows 注册表中注册了自己。因此 Windows 知道如何运行 Python 程序。事实上，通过这种方式我们在\
  \ Windows 上编写 Python 程序，也可以在程序所在的目录中仅通过名称来运行它。假设我们把程序保存在了面上，并且认为我们通过以下命令进入了桌面：`cd\
  \ C:\\Documents and Settings\\User_name\\Desktop` 在通过以下命令进入桌面后，我们有机会运行你的程序：\n\n\
  然而，为了让此命令生效，我们需要在当前目录的 MS-DOS 环境中。这意味着，如果你的程序在 `My Documents`（我的文档）目录中，而你处于 MS-DOS\
  \ 中的 `C:\\Documents and Settings\\User_name\\Desktop` 目录，那么此命令将不起。要在任何地方调用你的程序，无论你在哪里，都应该像刚才解释的那样将你的程序添加到\
  \ PATH 中……总之，让我们现在回到主题。我们在说什么？是的，我们难道不能双击编写好的程序吗？当然可以。由于 Python 在 Windows 上安装时会注册自己，因此当我们双击带有扩展名的文件时，我们的程序就会运行。但有一个问题。当我们双击文件运行程序时，这个过程太快了，以至于我们只看到黑窗口以瞬间打开并关闭……事实上，我们的程序正在运行，但因为它运行得太快，我们看不到程序正在运行。\n\
  \n为了看到我们的程序正在运行，我们需要阻止黑窗口关闭。我们通过在程序中添加以下行代码来实现：`raw_input()`。所以我们的代码看起来应该是这样：\n\
  ```python\na = \"apple\"\nb = \"pear\"\nc = \"banana\"\nprint \"a\", a, b, \"in\
  \ \", c\nraw_input()\n```\n几节之后，我们将检查这个在最后一行添加的 `raw_input()` 语句是什么，以及它具体做了什么。现在，只需知道这一行正在阻止\
  \ MS-DOS 关闭。有了这条命令，MS-DOS 将保持打开，直到你按下 ENTER……此处需要给出一个非常重要的警告。在用 Python 开发程序时，永远不要使用这种双击方法运行你的程序。始终从命令行运行你的程序。这样如果你的程序中有错误，你就可以理解错误源于何。但如果你通过双击运行程序，你没有机会看到错误。让我们举个例子。三角形的面积公式是：`area\
  \ = base * (height / 2)` 我们的代码应该是：\n```python\nheight = 4\nbase = 6\narea = base\
  \ * (height / 2)\n```\n在这里我们：\n1. 首先我们定义了一个变量叫 `height`。该变量的值是 `4`。但此处需要给出一个非常重要的警告。在用\
  \ Python 开发程序时，永远不要使用这种双击方法运行你的程序。始终从命令行运行你的程序。这样如果你的程序中有错误，你就可以理解错误源于何。但如果你通过双击运行程序，你没有机会看到错误。\n\
  2. 接着我们定义了另一个名为 `base` 的变量。该变量的值是 `6`。\n3. 我们写下了允许我们计算面积的公式：`field = base * (height\
  \ / 2)`\n4. 最后，我们借助 `print` 命令打印名为 `field` 的变量的值。\n5. 当我们运行这个程序时，结果将是 `12` ……现在思考。假设我们在编写此程序时犯了一个小错误，写成了这样的：\n\
  ```python\nheight = 4\nbase = 6\nala = base * (height / 2)\nprint field\n```\n因为\
  \ MS-DOS 屏幕会瞬间开启关闭。此外，在最后一行添加 `raw_input()` 是没用的。这一行允许无错误的程序通过双击运行。\n\n为了避免此类错误消息，我们需要在代码之间添加以下行：\n\
  `# -*- coding: utf-8 -*-\nWindows 用户可能喜欢使用字符编码 `cp1254` 而不是 `utf-8`：\n`# -*- coding:\
  \ cp1254 -*-\n通过这种方式，我们向 Python 介绍了我们使用的字符类型。以后我们将检查 Python 在处理 Unicode 时是如何处理土耳其字符的。但现在不要过度担心这些。我们程序的最新版本看起来像这样：\n\
  ```python\n# -*- coding: utf-8 -*-\ncelsius = 22\nfahrenheit = celsius * (9.0 /\
  \ 5.0) + 32\nprint \"%s corresponds to %s degrees fahrenheit\" % (celsius, fahrenheit)\n\
  ```\n如你所见，这次我们的程序能够正确显示土耳其字符。同时，让我们看看上面的代码。\n\n\n\n然后我们定义了一个名为 `Celsius` 的变量，并将其值设置为\
  \ `22`。在这里，我们首先编写：\n\n```python\n# - - coding: utf-8 - * -\n```\n\n得益于这一行，我们引入了将在\
  \ Python 中使用的编码格式。因此，我们就能在代码中使用土耳其字符。这行 Windows 标签：\n\n```python\n# - - coding:\
  \ cp1254 - * -\n```\n\n然后我们写了将华氏度转换为摄氏度的公式。注意，公式中使用的是 `9.0 / 5.0` 而不是 `9/5`。因此，我们能够将数字\
  \ 9 精确地除以数字 5，否则我们的公式将计算错误的结果。最后，我们向用户展示了 22 摄度对应多少华氏度。注意我们在这里是如何格式化字符串的。当运行 Idle\
  \ 的 Windows 用户尝试注册此程序而没有输入\n\n```python\n# - - coding: cp1254 - * -\n```\n\n他们将看到一个这样的警告窗口：因此，我们能够将数字\
  \ 9 精确地除以数字\n\n# 第 8 章：数据分析简介\n\n数据分析包含了从原始数据中提取信息的所有技术和过程。由于原始数据通常是无结构形式，且几乎不包含信息，组织此类数据的必要性变得更加重要。虽然有很多额外的工具可以用于数据分析，例如\
  \ Microsoft Excel、R 语言、SQL 等，但大多数数据科学家更倾向于使用 Python，因为它拥有用于数据分析的广泛库和支持包。在本章中我们将探索的最流行的包/框架是\
  \ NumPy 和 Pandas。\n\n冒着过度简化的风险，数据科学只是各种技术的应用——通常利用计算机程序或软件进行快速高效的数据组织、可视化和解释，将原始数据转换为用于决策的信息。广告更有针对性地面向消费者，公司对自身的经济表现以及生产中可能的趋势或选择更加关注，等等。如果你正在预览页或类似的地方浏览本书的介绍页面，对于是否想学习\
  \ Python 犹豫不决，那么，我可以告诉你，你可能应该学一下。\n\n在读完这本书之后，当你继续作为一个程序员成长时，你将像直觉一样学习什么时候该以及不该使用\
  \ Python。Python 是一门非常出色的语言，但它的失败之处在于你需要极其接近计算机硬件或编写极其高效的程序。在这些领域，Python 并不擅长。\n\n\
  然而，这并不是说它没有优点。事实上，可以说那是 Python 表现平平的少数地方之一。它在那里缺乏的东西，在其他领域弥补了。例如，与其他语言相比，Python\
  \ 的开发时间通常非常短。\n\n然而，如果没有正确的工具、指导和奉献，掌握数据分析所需的技能将是一项非常枯燥且漫长的任务。这就是写这本书的原因；让你在技能和工具上跟上节奏，开启通往兴奋且回报丰厚的数据科学世界之旅。\n\
  \n到此时，你可能对数据分析以及它提供的秘密感到非常兴奋，然而，你可能会问“Python 与此有什么关系？”\n\n记住，数据分析利用了计算机卓越的处理和数据操纵能力？为了做到这一点，数据科学家必须以清晰且逻辑的方式向计算机传递任务。此外，Python\
  \ 拥有丰富的工具和应用程序库，使得数据对于初学者或即时程序员来说不那么技术化。因此，大多数数据科学家将 Python 作为处理大数据、数据分析等的主要工具。\n\
  \n# 第 9 章：初学者的算法\n\n首先，我们将开始观察 Python 运算符：Python 运算符可以被描述为不是特定操作的特殊符号。运算符作用的值被称为操作数。在示例中：\n\
  \n`x + y`\n\n在这个示例中，`+` 运算符计算了 `x` 和 `y` 的和。操作数可以是一个字面量，甚至是一个引用对象的变量。当你有一系列像 `x\
  \ + y - z` 这样的运算符时，这被称为表达式。Python 允许许多运算符将数据对象组合成表达式。所示：\n\n### 算术运算符\n\n算术运算符包括\
  \ `+`、`-`、`//`、`%` 和 `/`。程序中显示这些运算符的示例包括：\n\n![images/00131.jpeg\n\n标准除法 `/` 的输出是一个浮点数，即使除数被除数整除。如果整除\
  \ `//` 的结果为正，小数部分将被截断，留下整数部分。当结果为负时，它必须向下取整到下一个最小整数：\n\n![images/00131.jpeg\n\n\
  ### 比较运算符\n\n这些运算符包括 `==`、`<=`、`>`、`!=`、`<` 和 `>=`。比较运算符的示例包括：\n\n![images/00132.jpeg\n\
  \n通常，比较运算符常用于布尔上下文中，如条件语句和循环语句，以引导程序流。\n\n### 浮点值的等值比较\n\n内部存储的浮点对象的值可能并不像你认为的那样准确。因此，比较浮点值的等值性是浪费时间。例如：\n\
  \n![images/00133.jpeg\n\n加法操作数的内部表示并不完全地反映为 1.1 和 2.2，因此你不能依赖 `x` 与 3.3 进行比较。检查两个浮点值是否“相等”的正确方法是判断它们是否接近。例如：\n\
  \n![images/00134.jpeg\n\n`abs()` 显示绝对值。如果两个数字之间的绝对值小于某个容差，它们被认为是等的。\n\n### 逻辑运算符\n\
  \n逻辑运算符如 `or`、`not` 和 `and` 在布尔上下文中改变组合表达式以计算更复杂的操作。\n\n###包含布尔操作数的逻辑表达式\n\nPython\
  \ 中某些特定的对象和表达式是布尔类型。换句话说，它们等于 Python 对象 `False` 或 `True`。例如：包含 `or`、`not` 和 `and`\
  \ 的逻辑表达式当操作数是布尔值时是简单的。看它们在程序中的工作：\n\n![images/00135.jpeg\n\n| 操作数 | 值 | 逻辑表达式 |\
  \ 值 |\n| :--- | :--- | :--- | :--- |\n| `x < 10` | True | `not x < 10` | False |\n\
  | `Callable(x)` | False | `not callable(x)` | True |\n\n### 布尔上下文中的非布尔值\n\n大多数表达式和对象并不等于\
  \ True 或 False。尽管如此，它们在布尔上下文中可以确定“假”或“真”。那么，什么是真，什么不是？在 Python 中，以下情况被视为假：\n\n*\
  \   布尔值 `False`。\n*   空字符串。\n*   由 `None` 关键字表示的唯一值。\n*   任何数值零。\n\nPython 中定义的几乎所有其他对象都被视为真。你可以使用内置函数\
  \ `bool()` 来判断表达式或对象的“真值”。`bool()` 在参数为真时返回 `True`，为假时返回 `False`。\n\n### 复合“或”表达式\n\
  \n看这个表达式：\n\n![images/00136.jpeg\n\n如果其中一个 `xi` 为真，则该表达式为真。在这个表达式中，Python 采用了一种被称为短路求值的方法。`xi`\
  \ 操作数从左到右计算。一旦被验证为真，整个表达式就会被视为真。在这个阶段，Python 就会停止，不再确定更多项。整个表达式的值是完成评估的那个 `xi`。\n\
  \n例如：\n\n![images/00137.jpeg\n\n\n\n\n`f()` 将返回传递给它的参数，它可以通过定义为真（truthy）或假（falsy）的\
  \ `arg` 值使表达式变为真假。此外，`f()`将其将其输出到控制台，这可以证明它是否被调用过。\n\n现在，来看下面的复合逻辑表达式：\n\n![Image](img/00138.jpeg)\n\
  \nPython 解释器将首先确定 `f(0)`；结果为 0。数值 0 为假。该表达式目前尚为真，因此计算从左到右开始。下一个操作数 `f(False)` 将返回\
  \ `False`。这同样为假，评估继续进行。\n\n# 结论\n\n首先，Python 是开源的、跨平台的，并且几乎无处不在。事实上，如果你正在使用 Mac\
  \ 或 Linux 系统，那么很有可能你的电脑上已经安装了它。要进行检查，请打开终端窗口并执行以下命令：\n\n```bash\npython –V\n```\n\
  \n如果安装了 python，你应该会得到类似下面的响应：\n\n```\nPython 2.6.1\n```\n\n这会告诉你系统当前安装的 Python 版本是什么？如果没有安装，快速访问\
  \ http://www.python.org/downloads 即可获得各种操作系统的 Python 安装程序下载。\n\n对于高级用户，在该位置还可以获取\
  \ Python 源代码，这允许对 Python 进行修改和/或自定义编译以适应特定的应用程序。除了安装 Python 之外，开始编程只需要一个文本编辑器。使用支持\
  \ Python 的 IDE 可以简化并改进这一过程，但并不是必须的。\n\n其次，Python 非常易用且功能极其强大。虽然 Python 代码可以编译并打包成可执行文件，但它通常被用作解释型脚本语言。因此，内存管理等杂务工作由解释器处理，让程序员能够专注于功能。此外，解释器是针对其安装的操作系统进行编译的，因此\
  \ Python 程序具有良好的系统独立性。换句话说，在 Mac 上编写的代码在很多情况下可以在 Windows 电脑甚至树莓派上正常运行。\n\nPython\
  \ 认为使用了非常简单的“可读性”高的语法，其格式与其他语言相似。编程初学者可以在几分钟内创建简单的程序。具有其他现代语言（如 C/C++）编程经验的人会发现这种语法非常熟悉，有助于快速过渡到更复杂的任务。\n\
  \n最后，Python 提供的所有优势使其成为当今最流行的编程语言之一。这种广泛的用户群结合其开源特性转化为了巨大的、易于获取的资源池。从特定应用程序库到在线教程、在线论坛，甚至是大学课程，资源触手可及。这种级别的社区支持对于从新手到顶尖专家的用户来说都是无价的。\n\
  \n无论你的任务是排序服务器上收到的邮件，还是为革命性的深海无人机构建控制系统，Python 都能提供一种易于学习的开源解决方案，并带有无与伦比的社区支持，帮助快速高效地完成工作。\n\
  \n# HTML\n\n# 编程\n\n## HTML 编程语言、网页设计及其他入门指南……\n\n## HTML 简介\n\n除了基本内容外，HTML 和 XHTML\
  \ 为你提供了一种方法来显示异常的内容字符，这些字符你可能无法选择在源记录中记住，或者它们有不同的用途。一个真正的模型并不完全是或打开部分图像。在 HTML 中，它通常意味着标签的开始，因此如果你基本上将其作为内容的一部分嵌入，程序将变得困惑并可能会误读你的文档。\n\
  \n![PRINCIPIOS BÁSICOS DE PROGRAMACIÓN.4 - Empresa de Diseño web](img/00139.jpeg)\n\
  \n对于 HTML 和 XHTML，符号字符 `&` 告诉程序使用一种特殊字符，正式称为字符实体。例如，顺序嵌入了在交付文本中不那么重要的图像。此外，它嵌入了比图像更重要的，而\
  \ `&` 嵌入了比图像更重要的，且 `&;` 嵌入了更多。在符号、实体名称和所需的分号之间不能有空格。（如果你使用符号本身，则不需要分号）。\n\n# 第 1\
  \ 章\n\n### 注释\n\n注释是另一种出现在源代码中但不被浏览器处理的打印。注释位于 `<!--` 和 `-->` 之间。注释最大的局限性是 HTML\
  \ 标准不允许在注释中嵌套注释。\n\n```html\n<!-- This is a comment -->\n```\n\n![PRINCIPIOS BÁSICOS\
  \ DE PROGRAMACIÓN.4 - Empresa de Diseño web](img/00139.jpeg)\n\n### 元素\n\n元素是 HTML\
  \ 的构建基石。一个元素通常由一个起始标签、内容和一个一个结束标签组成。例如，`<p>This is a paragraph</p>` 是一个元素。然而，某些元素是“空元素”，这意味着它们没有结束标签，例如\
  \ `<img>` 或 `<br>`。\n\n```html\n<p>This is a paragraph</p>\n<br>\n<img src=\"image.jpg\"\
  \ alt=\"Description\">\n```\n\n### 属性\n\n属性提供了关于元素的额外信息。它们始终在起始标签中指定，通常以 `name=\"\
  value\"` 对的形式出现。例如，`<a href=\"https://www.google.com\">Link</a>` 使用了 `href` 属性。\n\
  \n```html\n<a href=\"https://www.google.com\">Visit Google</a>\n```\n\n### 链接\n\n\
  链接用于将一个网页连接到另一个网页。`<a>` 标签用于链接，`href` 属性指定链接的目标地。\n\n```html\n<a href=\"https://www.wikipedia.org\"\
  >Visit Wikipedia</a>\n```\n\n### 图像\n\n图像用于在网页上显示视觉内容。`<img>` 标签用于图像，`src` 属性指定图像的路径。`alt`\
  \ 属性为图像提供替代文本。\n\n```html\n<img src=\"image.jpg\" alt=\"Description of image\">\n\
  ```\n\n### 列表\n\n列表用于将项目分组在一起。列表有两种主要类型：有序列表 (`<ol>`) 和无序列表 (`<ul>`)。两者都使用 `<li>`\
  \ 标签作为列表项。\n\n```html\n<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n</ul>\n<ol>\n\
  \  <li>First item</li>\n  <li>Second item</li>\n</ol>\n```\n\n### 表格\n\n表格用于按行和列排列数据。`<table>`\
  \ 标签定义表格，`<tr>` 定义行，`<th>` 定义表头单元，`<td>` 定义数据单元。\n\n```html\n<table>\n  <tr>\n \
  \   <th>Name</th>\n    <th>Age</th>\n  </tr>\n  <tr>\n    <td>Alice</td>\n    <td>25</td>\n\
  \  </tr>\n  <tr>\n    <td>Bob</td>\n    <td>30</td>\n  </tr>\n</table>\n```\n\n\n\
  \n正如我们之前看到的，html 标签用于界定记录的开始和结束。由于普通程序可以毫不费力地从封装的源代码推断出这是一个 HTML 存档，因此你实际上并不需要记住你的\
  \ HTML 存档记录的标签。\n\n总而言之，整合此标签被视为一种极佳的结构，这样不同的设备（特别是那些准备内容不那么引人目的设备）就可以将你的记录识别为一份\
  \ HTML 报告。至少，开始和结束 html 标签的存在保证了存档的开始或结束不会被意外删除。此外，XHTML 要求必须有 html 标签。\n\nhtml\
  \ 标签及其结束标签内部是存档的 `head`（头部）和 `body`（主体）。在 `head` 内部，你会发现用于区分存档并刻画其在报告集合中位置的标签。`body`\
  \ 内部是真正的存档内容，其由决定报告文本设计和存在的标签所特征。正如你预期的那样，存档头部位于 `head` 标签内，而主体位于 `body` 标签内，这两者稍后会进行描述。\n\
  \n`body` 标签可能会被 `frames` 标签取代，其特征是至少包含一个包含，从而包含了真实的报告内容。从长远来看，HTML 记录中最广泛认可的 html\
  \ 标签类型本质上就是。\n\n当 `html` 标签出现但没有 `type` 属性时，HTML 存档工作程序和程序期望记录中使用的 HTML 版本由工作程序提供。\n\
  \n### dir 属性\n\n`dir` 属性指示程序应该在包含组件内以什么方向交付文本。在 `html` 标签内部使用时，它决定了文本如何在整个存档中引入。在另一个标签内部使用时，它控制该标签本身内容的标题方向。\n\
  \n自然地，该标签的默认值是 `ltr`，表示文本从左到右呈现给客户端。使用另一个值 `rtl` 来为中文或希伯来语等语言提供从右显示的文本选项。当然，结果取决于你的内容以及程序对\
  \ HTML 的支持；HTML 4、Netscape 和 Internet Explorer 4 及之前的版本忽略 `dir` 属性。符合 HTML 4 标准的\
  \ Internet Explorer 5 基本上赋予了 `dir=rtl` 文本合法性，尽管你可能会看到程序将重音（时间帧）移动到句子的另一侧：\n\n###\
  \ lang 属性\n\n当包含在 `html` 标签内部时，`lang` 属性指示你在记录中通常使用的语言。在不同标签内部使用时，`lang` 属性指示你在该标签内容使用的语言。理想情况下，程序将利用\
  \ `lang` 来更有可能地为客户端渲染内容。\n\n将 `lang` 属性的默认值设置为 ISO-639 标准双字符语言代码。你也可以通过在 ISO 语言代码后加上连字符和子代码名称来表示方言。例如，“en”是英语的\
  \ ISO 语言代码；“en-US”是美国英语的代码。其他常见的语言代码包括“fr”（法语）、“de”（德语）、“it”（意大利语）、“nl”（荷兰语）、“el”（希腊语）、“es”（西班牙语）、“pt”（葡萄牙语）、“ar”（阿拉伯语）、“he”（希伯来语）、“ru”（俄语）、“zh”（中文）和“ja”（日语）。\n\
  \n### 版本属性\n\n`variant` 属性刻画了创建存档时使用的 HTML 标准渲染。对于 HTML 版本 4.01，其值应该是：作为规则，`html`\
  \ 标签内部的 `variant` 数据比其价值更复杂，且这一特性在 HTML 4 中已被废弃。真正的创建者应该在记录开始处使用 SGML `doctype`\
  \ 标签：\n\n### 文档头部 (Document Header)\n\n记录头部描述了报告的不同属性，包括标题、在 Web 中的位置以及与不同存档的关系。报告头部内部大部分信息从未真正以明显的方式传递给客户端。\n\
  \n### head 标签\n\n`head` 标签用于汇总其他头部标签。它出现在你记录的开头，紧随 `html` 标签之后，`body` 或 `frames`\
  \ 标签之前。`head` 标签及其对应的结束标签可以被程序推导出来，因此可以从存档中安全地忽略。在任何情况下，我们都建议你在记录中记住它们，因为它们增加了意义性并支持报告自动化。\n\
  \n### dir 和 lang 属性\n\n`dir` 和 `lang` 属性将 HTML 和 XHTML 扩展到了全球观众。\n\n### profile\
  \ 属性\n\n通常，记录头部包含各种 Meta 标签，用于向程序传递有关报告的额外数据。后来，创建者可以使用标准记录元数据的预定义配置来更有可能地描述他们的报告。`profile`\
  \ 特性提供了与当前存档相关的配置 URL。\n\n配置的安排以及程序如何很好利用它尚未被刻画；这一特性基本上是为未来发展的预留位。\n\n程序通常不会处理标题开始和结束标签内文本之外的元素。例如，它们将忽略任何图片或指向不同报告的链接。这里有一个实质性\
  \ HTML 存档的简单示例，展示了头部和标题标签；看看 Netscape 显示它时会发生什么。\n\n### 标题（title）里有什么？\n\n选择正确的标题对于刻画存档并确保它在万网范围内被成功使用至关重要。\n\
  \n记住，客户端可以在几乎任何请求中以各种方式访问你的每份报告，且彼此相互独立。每个存档的标题应该在你的不同记录的背景下刻画报告，正如其自身具有价值一样。\n\n\
  包含记录顺序引用的标题通常是不雅眼的。简单的标题，例如“第 2 节”或“第六部分”，对客户理解存档可能包含的内容帮助不大。更明确的标题，如“高级广场舞”或“丘吉尔的青少年与成年期”，传达了在更大安排中的位置感。我们必须尽可能强调这一点，在你的不同记录的背景下利用报告，正如其自身具有价值一样。\n\
  \n\n\n\n正文是文档的核心；它是你放置报告内容的地方。`body` 标签定义了文档主体。\n\n### body 标签\n\n在 HTML 4 和 XHTML\
  \ 中，`body` 标签具有各种属性，可以控制报告的语调和基础。不同的程序扩展了该标签，以便对你的文档的外观提供显著更多的控制力。\n\n`body` 标签内部及其结束伙伴\
  \ `</body>` 之间的任何内容被称为正文内容。最简单的文档可能在 `body` 标签内只有一段文本节。更复杂的报告将包含组织严密的内容、图表、表格以及各种增强元素。\n\
  \n由于 `body` 和 `body` 标签的状态可以被程序获取，因此可以被安全地从报告中排除。尽管如此，类似于 `html` 和 `head` 标签，我们建议在文档中包含\
  \ `body` 标签，以使它们更具意义和可行性。\n\n`body` 标签的不同属性大致归纳为几类：赋予你对报告外观一定权限的属性、将编程能力与实际文档结合的属性，以及为了后期引用标记并区分正体的属性。我们涵盖了外观属性（`link`、`background`、`bgcolor`、`bgproperties`、`leftmargin`、`connect`、`text`、`topmargin`\
  \ 和 `vlink`）；用于模板的 `class` 和 `style` 属性；JavaScript 模板和自动属性（“有时”属性）；语言属性（`dir` 和\
  \ `lang`）以及 ID 属性（`id` 和 `title`）。\n\n### 框架\n\nHTML 和 XHTML 标准规定了一种特殊的报告，其中你用至少一个\
  \ `frame` 标签替换 `body` 标签。这种框架记录将展示窗口隔离到至少一个独立的窗口中，每个窗口显示另一个文档。我们完整地描述这一发展。\n\n###\
  \ 编辑标记\n\nHTML 4.0 提供了两个新标签，可以帮助创作者团队合作改进文档，并保持与出版和版本控制的相似性。`ins`（插入）和 `del`（删除）标签允许你将文档正文的部分指定为新内容或添加的内容，或者指定应当被替换的旧内容。此外，通过特殊属性，你可以显示何时发布了改进（`datetime`）以及指向可能阐明更改的报告的引用（`ref`）。\n\
  \n### ins 和 del 标签\n\n`ins` 和 `del` 标签允许创作者设置他们期望在当前报告形式中添加或删除的正文部分。符合 HTML 4/XHTML\
  \ 的程序会以某种特殊方式显示 `ins` 或 `del` 标签的内容，以便用户快速过滤报告中的更改。\n\nNetscape 4 及之前的版本会忽略这些标签，Internet\
  \ Explorer 4 及之前的版本也是如此。Internet Explorer（版本 5）和 Netscape（版本 6）的最新版本通过对嵌入内容加下划线和删除删除文本来使用标准的出版标记。\n\
  \n### ref 属性\n\n该 `ref` 属性允许你报告添加或取消背后的目的。它的值应该是指向另一个阐明嵌入内容的文档的 URL。`ref` 如何被程序处理将是后文的问题。\n\
  \n### datetime 属性\n\n尽管更改的理由很重要，但知道更改何时发生通常更为重要。`ins` 和 `del` 标签的 `datetime` 属性取一个单一值：一个特殊编码的日期时间戳。\n\
  \n`datetime` 的详细格式为 `YYYY-MM-DDThh:mm:ssTZD`。各部分如下：\n\n• YYYY 是年份，例如 2020 或 2021。\n\
  \n• MM 是月份；02 代表 2 月，12 代表 12 月。\n\n• DD 是日期；01 到 31。\n\n• T 是一个必要的字符，指定标记中时间部分的开始。\n\
  \n• hh 是 24 小时制中的小时；00 (12 PM) 到 23 (11 PM)。（如果包含了分钟，请在后面添加一个冒号。）\n\n• mm 是整点开始的分钟；00\
  \ 到 59。（如果包含了秒，请在后面添加一个冒号。）\n\n• ss 是秒；00 到 59。\n\n• TZD 是时区标识符。它通常是以下几个特征之一：Z，表示格林威治标准时间；或者是协调世界时\
  \ (UTC) 之前的 (-) 或之后 (+) 的的小时、分钟和秒，此处时间与英国格林威治的时间进行比较。\n\n### class, dir, lang, id,\
  \ style, 和 title 属性\n\n`body` 标签的不同属性大致归纳为几类：赋予你对报告外观一定权限的属性、将编程能力与实际文档结合的属性，以及为了后期引用标记并区分正体的属性。\n\
  \nclass, dir, lang, id, style, 和 title 属性\n\n`body` 标签的不同属性大致归纳为几类：赋予你对报告外观一定权限的属性、将编程能力与实际文档结合的属性，以及为了后期引用标记并区分正体的属性。\n\
  \n\n\n\n任何富有成果的介绍，即使是一本明智的书，都应该将其内容协调成一个引人注目、具有吸引力的档案。将内容协调成吸引人的报告是 HTML 和 XHTML\
  \ 的强项。这些方言为你提供了各种工具，帮助你塑造内容并清晰地表达自己。它们还帮助构建你的文档，使你的目标读者群体能够轻松访问你的文字。\n\n在规划文档时，请始终记住（老话重说，不过不同）：标记标签（尤其是关于消息的）只是提示——而不是指令——程序将如何呈现报告。呈现方式会随着程序的不同而发生变化。尽量力不要过度纠结于追求完美的视觉和格式。你的努力可能且极有可能会被程序所破坏。\n\
  \n### 分段与段落\n\n与大多数内容处理器一样，程序会对它找到的文字进行包装，以适应其查看窗口的平直宽度。放大程序窗口，文字自然会向上流动以填充更宽的行。缩小窗口，文字则向下折行。\n\
  \n然而，与大多数内容处理器不同，HTML 和 XHTML 使用明确的划分（`div`）、段落（`p`）和换行（`br`）标签来控制文本的布局和流。回车字符虽然对源文档的可读性非常有帮助，但通常会被程序忽略——创作者应该使用\
  \ `br` 标签来明确实现普通的书籍换行。`p` 标签在执行相同任务的同时，还传达了超出基本换行的意义（语义）和影响。\n\n`div` 标签有些独特。它最初在\
  \ HTML 3.2 标准中系统化，`div` 被记忆为语言中的一种简单权威工具——将报告划分成离散的段——这在某种程度上这种冷酷的意义意味着并没有多少创作者使用它。无论如何，持续的开发——布局、样式以及用于文档引用的\
  \ `id` 属性和自动化——现在让你能够清晰地标记并相应地刻画文档的各个部分，同时控制这些部分的布局和呈现方式。这些特性为 `div` 标签注入了真正的生命力和意义。\n\
  \n通过在文档的不同区域配对 `id` 和类名（class name），每个区域都由标签和属性界定（你也可以对 `p` 等不同标签这样做），你不仅可以标记这些划分以供以后超链接引用、机器人处理和画板（例如收集所有的书籍索引部分），你还可以为报告的这些部分描述独特的、与众不同的样式。例如，你可以为文档的理论部分定义一个划分类，为正文定义另一个，为结论定义第三个，并将第四个划分类用于参考文献列表。\n\
  \n每个类（class）随后可以在文档级别或远程相关的模板中被赋予另一种呈现定义：理论部分采用缩进并使用斜体字体（例如 `div.abstract {left-edge:\
  \ +0.5in; text-style: italic};`）；正文采用左对齐的罗马字体；结尾与理论部分相似；书籍索引则相应地编号并整齐排列。\n\n我们对模板、类及其应用提供了逐条描述。\n\
  \n### div 标签\n\n正如 HTML 4.01 和 XHTML 1.0 标准中所述的，`div` 标签将你的文档划分为离散的、明确的部分。它可以被谨慎地用作分级工具，并具有如下设计相关性；如果添加了\
  \ `id` 和 `class` 来标记划分，它的效果会更成功。`div` 标签还可以与 `align` 属性以及许多 \"on\" 描述符（事件处理器）结合，以便在演示中控制报告整个区域的布局。\n\
  \n### div 标签中的 align 属性\n\n`div` 的 `align` 属性将包含的内容定位在显示窗口的左侧（默认）、中心或右侧。此外，你可以指定对齐方式以调整内容的左右边缘。`div`\
  \ 标签可以是固定的，且固定 `div` 的布局优于其包含标签。此外，其他固定的布局，例如居中、调整后的区域或特殊调整的单元格，也会受到 div 的影响。与不同标签的\
  \ `align` 属性类似，在 HTML 和 XHTML 参考中，基于模板的控制较少。\n\n### no wrap 属性\n\n由解释器简单支持的 `nowrap`\
  \ 属性会抑制划分内部内容的自动文字折行。换行只会在源报告中有回车的地方发生。\n\n虽然 `nowrap` 属性对于将以某种方式在页面上流动的长段文本可能并不理想，但在创建具有多个明确换行的文本块（例如：地址）时，它可以让事情变得简单：你不需要在内部内容流中嵌入每一个显式标签。\n\
  \n### dir, lang 和 nowrap 属性\n\n一个 `div nowrap` 标签。同样，任何剩余的程序都会忽略 `nowrap` 特性，并无论如何都会将你的内容合并流动。如果你你的文档针对特定的解释器，请在需要的地方使用\
  \ `nowrap`，否则我们不建议对通用用途使用此属性。\n\n### id 属性\n\n`dir` 属性允许你提示程序内容应该以哪个方向显示，而 `lang`\
  \ 属性允许你指定划分内部使用的语言。使用 `id` 属性为文档划分命名唯一的名称，以便以后由超链接、模板、应用程序或其他机器人测量引用。一个良好的 `id`\
  \ 项是任何被包含在内的字符串，它能独特地区分该划分，并且以后可以被明确地引用该部分。尽管我们在 `div` 标签的上下文中介绍它，但该属性几乎可以用于任何标签。\n\
  \n当用作组件名称使用时，`id` 属性可以添加到 URL 中，以定位文档内部被标记的组件。你可以标记大型内容部分（通过 `div` 等标签），也可以标记较小的文本片段（使用\
  \ `i` 或 `span` 等标签）。例如，你可以使用 `div id=\"abstract\"` 来标记特定报告的理论部分。URL 可以通过引用直接跳转到该理论部分。当这样使用时，`id`\
  \ 属性的估计对于文档内的任何剩余 ID 应该是独无二的。\n\n当作为模板选择器使用时，`id` 属性的含义是与当前标签关联的样式规则名称。这提供了另一层确定的样式规则排列，就像你可以创建的不同样式类一样。一个标签可以同时利用\
  \ `class` 和 `id` 属性来为单一标签应用两种独特的规则。\n\n### title 属性\n\n利用可选的 `title` 属性和包含的字符串值，为该划分连接一个引人注目的表达。\n\
  \n\n\n\n`title` 属性的估计并没有特定的用途，许多程序只是直接忽略了它。尽管如此，Web Explorer 在鼠标悬停在某个组件上时，会显示与组件相关的标题。这很聪明。如果利用得当，`title`\
  \ 属性可以这样用于为你文档内部不同的组件提供即时帮助。\n\n### class 和 style 属性\n\n利用 `div` 标签的 `style` 属性可以为标签内封装的内容创建内联样式。`class`\
  \ 属性允许你将 `div` 标签的预定义类的样式应用到此分区域的内容。`class` 属性的估计是在某些文档级或远程定义的模板中定义的样式名称。此外，通过类识别的分区域还非常便于计算机对你的报告进行处理，例如，提取所有类名为\
  \ \"biblio\" 的分区域，以便用于机械化收集专家目录。\n\n### HTML 中的事件属性\n\n在 `div` 内部及周围可能会发生许多客户端相关事件（例如，当用户在其显示区域内点击或双击鼠标时），如果程序遵循当前的\
  \ HTML 或 XHTML 原则，它就能感知到这些事件。通过单独的 \"on\" 属性和值，你可以通过显示客户端交互框或执行某些媒体操作来响应该事件。\n\n\
  ### p 标签\n\n`p` 标签标记了一个段落的开始。即使对于一些资深网站管理员来说，这一点并不显著，因为它的运行方式与我们通常预期的大相相同。大多数文字处理器习惯于只使用一个特殊字符（通常是回车符）来标记段落的结束。在\
  \ HTML 和 XHTML 中，每个段落都应该以 `p` 开始，并以相应的 `p` 标签结束。请记住，内容处理器显示的报告中连续的换行符会所有人创建一个空白段落，因此程序通常会忽略主段落标签之外的所有内容。\n\
  \n随着时间的推移，在 HTML 中你可以忽略正文开始处的 `p` 标签以及段落结束处的 `p` 标签：它们可以从报告中的其他标签推断出来，因此被安全排除。\n\
  \n注意，我们在 HTML 模型中排除了主区域的段落开始标签 (`p`) 或任何结束区域标签；程序可以明确地推导出它们，因此是多余的。\n\n总的来说，你会发现人类文档创建者会在任何可能的情况下丢弃建议的标签，而程序化的报告生成器通常会嵌入它们。这可能是因为产品制定者不希望承担产品因不遵守\
  \ HTML 标准而被竞争对手指责的风险，尽管我们在这里是在钻牛角尖。你可以放宽要求：排除第一个段落的 `p` 标签，并且不要真正考虑段落结束的 `p` 标签，前提是显然你的报告的设计和清晰度不会受到影响。也就是说，你知道\
  \ XHTML 对这种松散行为是非常严肃的。\n\n# 第二章\n\n### 段落渲染\n\n当遇到另一个段落 (`p`) 标签时，程序通常会为标签封装的内容嵌入一个内联样式。`class`\
  \ 属性允许你将 `div` 标签的预定义类的样式应用到此分区域的内容。`class` 属性的估计是在某些文档级或远程定义的模板中定义的样式名称。此外，通过类识别的分区域还非常便于计算机对你的报告进行处理，例如，提取所有类名为\
  \ \"biblio\" 的分区域，以便用于机械化收集专家目录。\n\n当遇到另一个段落 (`p`) 标签时，程序通常会为标签封装的内容嵌入一个内联样式。`class`\
  \ 属性允许你将 `div` 标签的预定义类的样式应用到此分区域的内容。`class` 属性的估计是在某些文档级或远程定义的模板中定义的样式名称。此外，通过类识别的分区域还非常便于计算机对你的报告进行处理，例如，提取所有类名为\
  \ \"biblio\" 的分区域，以便用于机械化收集专家目录。\n\n\n\n\n你可能可以在方框内部指示一个章节，并伴有不同的段落、记录、结构和格式化文本。总而言之，这意味着章节可以出现在文本流合适的地方，例如在报告正文、提览中的组件等处。事实上，章节不能出现在标题、锚点或其他实质上是仔细定义的“文本形式”的组件内部。在实践中，大多数程序都忽略了这一局限性，并将段落视为包含组件的一部分来处理。\n\
  \n### 标题\n\n客户阅读屏幕上显示的内容已经足够困难了。一段由标题、说明和不同头部完全组成的长文本流会让人视眼疲劳、大脑麻木，这种方式也使得检查特定点的内变得几乎困难。\n\
  \n你应当在至少一个标题内部，将文本流一致地分成几个更适中的段落。你可以使用六级标题来将书籍内容流结构化为更易于理解、更有逻辑的记录。此外，还有各种图形和文本样式设备可以帮助划分你的文档，并使其内容对客户来说更加开放且清晰。\n\
  \n### 标题标签\n\n标题内部的包含内容通常由程序根据其可显示技术进行呈现。程序可能会决定通过加粗、倾斜、放大、强调、下划线或更改标题的颜色，使文档中的每个标题都脱颖而出。此外，为了避免最单调的视觉效果，客户也可以经常调整程序呈现各种标题的方式。\n\
  \n最后，记住在你的文档中包含正确的标题结束标签。程序不会自动为你嵌入它，忽略标题的结束标签可能会对你的报告产生严重后果。\n\n### 标题标签中的 align\
  \ 属性\n\n大多数程序的默认标题排列方式是左对齐。与 `div` 和 `p` 标签一样，你可以通过 `align` 属性以及左、居中、右或两端对齐的属性来更改这种排列方式。\n\
  \n目前没有任何程序支持 `align` 的合法激励值，不要抱太大希望。在 HTML 4 和 XHTML 中，`align` 属性由于基于模板的控制而被废弃。\n\
  \n### dir 和 lang 属性\n\n`dir` 属性允许你提示程序该章节的内容应该以何种方向显示，而 `lang` 允许你指定标题内部使用的语言。\n\
  \n### class, id, style 和 title 属性\n\n利用 `id` 属性为标题做一个标记，稍后可在超链接锚点、机器人外观、模板选择器以及大量不同的应用程序中唯一地引用该标题。\n\
  \n利用可选的 `title` 属性和带引号的字符串值来为标题提供一个明确的表达式。\n\n利用 `style` 属性为标题内容创建一个内联样式的基础。`class`\
  \ 属性允许你用一个名称命名标题，该名称引用了某些报告级或远程字符模板中预定义的类。\n\n### 事件属性\n\n标题内部和周围可能发生的每个客户端启动事件，都会在它符合\
  \ HTML 或 XHTML 的情况下被程序感知。通过单独的 \"on\" 属性和值，你可以通过显示一段执行某些交互操作的客户端脚本来响应该事件。\n\n###\
  \ 标题的恰当使用\n\n在主标题中重复你的文档标题是可以接受的结构，因为你在记录开头指定的标题不会显示在客户端的主界面中。标题应当与文档头部中的标题保持一致。下文节是一个在页眉和文档正文中重复记录标题的真实示例：\n\
  \n虽然程序可能会将标题放在文档的某处并可能用它创建书签或热点章节（所有这些在客户端工作区随机地出现在某处），模型中的级标题将始终出现在记录的最早引用。它为记录提供了一个明显的标题，而不太关心程序如何处理标题。此外，与文本不同，如果客户选择打印记录，标题标题将出现在主页开头。\n\
  \n在模型中，我们决定使用一个级标题，其呈现文本通常比标准文本略大。你应该选择你认为有用且具有吸引力的标题级别，并在整个文档中一致地使用该级别。\n\n当你为记录设置了高级标题后，在整个文档中使用非常相似或更低级别的额外标题，为文档添加结构和“可读性”。如果你使用三级标题作为记录标题，请使用四级标题将文档划分为几部分。如果你希望进一步划分内容，考虑使用二级标题作为标题，三级标题作为章节分隔符，四级标题作为子章节。\n\
  \n### 将标题用于小型文本\n\n作者经常将最后两种尺寸用于标准文本，类似于免责声明或版权声明。在目录或显示网站内容的首页中使用较小的内容已变得非常流行。通过标题进行检查以获得所需的效果。观察普通程序在随后的\
  \ HTML 中是如何处理版权引用的。\n\n### 允许的标题内容\n\n在实践中，尽管如此，文本样式或样式更改可能在标题内部不起作用，因为实际的标题会在程序内部建议文本样式更改。\n\
  \n标题标签作为系统的误用是不可避免的。事实上，章节、记录和其他正方形组件不允许出现在标题内部，并可能会被程序混淆以显示建议的标题结束。最终，大多数程序会将当前的样式应用到每一个包含的段落。我们不鼓励这种做法，因为这不仅违反了\
  \ HTML 和 XHTML 规则，而且通常看起来糟糕。想象一下如果你的报纸打印了标题文本中所有的重复内容！\n\n将大量文本分配为标题内容会使标签的作用失去意义。如果你确实需要更改报告的文本样式或大小，请考虑为你的记录标签定义一种新样式。这种样式将应用于内部的所有内容，并将后对记录的调整变得简单得多。\n\
  \n此外，我们明确建议你使用多个程序和几个不同的目标来仔细测试你的页面。通常情况下，你的文本在 320x480 目标上可能是清晰的，但在 600x800 的显示上可能会消失。\n\
  \n### 在标题中添加图像\n\n\n\n\n\n在标题中嵌入至少一张图片是可行的，从小的图标或符号到全尺寸的标志。然而，在一组报告中将可的标题排列与相关符号相结合，不仅在视觉上具有吸引力，而且是支持客户审查文档汇集的一种有效方法。\n\
  \n在标题中添加图片非常简单。例如，随后的内容在“更多信息”标题中放置了一个“数据”符号。\n\n通常情况下，标题中的图片倾向于位于标题的开头，与标题文字底部或居中对齐。\n\
  \n## 更改文本外观\n\n各种标签会改变文本的呈现方式以及与其相关的语义意义。总的来说，这些标签可以归为两类：基于内容的样式和实际样式。\n\n此外，`W3C`\
  \ 级联样式表标准目前受到了主流程序的广泛支持，为作者提供了另一种更详尽的途径来控制其文档文本的外观和格式。Netscape 还通过 `JavaScript`\
  \ 实现了模板。我们在本节中将描述基于标签的 en 样式。\n\n## 基于内容的样式\n\n基于内容的样式标签告知程序包含的内容具有特定的含义、设置或用途。程序随后将符合该含义、设置或用途的方式来组织内容。\n\
  \n由于文本样式是通过语义提示确定的，因此程序可以选择适合客户端的呈现样式。由于此类样式随区域而变化，使用基于内容的样式可以确保您的文档对更广泛的用户群具有意义。当程序针对视障或残障用户时（他们的偏好与普通内容本质上不同，或者在某些方面受到极大限制），这一点尤为重要。\n\
  \n当前的 `HTML` 和 `XHTML` 规范没有为每一种基于内容的样式定义组织，除非它们的呈现方式与文档中的标准内容不完全相同。标准并没有要求基于内容的样式彼此之间以独特的方式呈现。实际上上，你会发现许多此类标签与普通打印具有非常明确的关联，具有相似的含义和呈现方式，并被大多数程序以类似的样式和文本样式呈现。\n\
  \n## 实际样式\n\n当我们讨论基于内容的样式标签时，经常使用“计划”一词。这是因为标签所传递的含义优先级高于程序显示内容的方式。尽管如此，你可能需要内容明确以某些特定方式显示——例如，*斜体*或**粗体**——可能是出于法律或版权原因。在这些情况下，请为内容使用实际样式。\n\
  \n虽然其他内容处理框架倾向于明确地控制样式和外观，但在 `HTML` 或 `XHTML` 中，除非发生罕见事件，否则你应该避免使用明确的实际标签。为程序提供尽可能符合预期的上下文数据。使用基于内容的样式。尽管当前的程序可能简单地以斜体或粗体显示其内容，但未来的程序和不同的文档工具可能会在很多情况下基于内容的样式。\n\
  \n## 基于内容的标签\n\n使用基于内容的样式需要控制，因为只需考虑你的内容应该看起来什么样，而不是它真正意味着什么。当你开始使用基于内容的样式时，你的文档将更具可预测性，并更好地适应自动化的视觉布局。\n\
  \n## HTML 的扩展字体\n\nHTML 在此节中为了一个明显的情况而记住这部分，或者尽可能将其推后。它之所以出现在这里是因为与 `HTML` 全局文本模型相关的不同标签是标准做法。此外，除了受到每个主流程序的广泛支持外，它们在\
  \ HTML 作者中也保持流行。然而，它们已经在 `HTML4` 和 `XHTML1.0` 规范中被弃用，将整个部分推向了部分的隐含极值。\n\n设想 `W3C`\
  \ 要求作者使用模板而不是粗体，来对内容的样式、颜色和大小进行精确控制。这就是为什么这些全局文本标签和相关项落伍的原因。我们将此部分放在这里是因为我们不认为大多数\
  \ HTML 作者会放弃，也不认为主流程序会永远支持这些如此广泛使用的标签。只需了解它们在语言中尴尬的处境即可。\n\n## 扩展字体大小模型\n\n而不是绝对点，主流程序支持的\
  \ `HTML3.2` 扩展字体模型使用通用模型来估计文本样式。尺寸从 1（最小）到 7（最大）；默认（基础样式）文本尺寸是 3。\n\n要准确地说明不同虚拟尺寸所使用的实际文本尺寸是非常困难的。大多数程序允许客户端更改实际文本尺寸，且默认尺寸在程序之间有所不同。无论如何，知道每个虚拟尺寸比默认文本尺寸\
  \ 3 逐渐大 20% 或小会有帮助。这样，文本尺寸 4 大 20%，文本尺寸 5 大 40%，以此此类推，而文本尺寸 2 比文本尺寸 3 小 20%，文本尺寸\
  \ 1 比文本尺寸 3 小 40%。\n\n与某些程序不同，令人惊讶的是 Netscape Navigator 和 Internet Explorer 不认为标签是换行机会。想象一下，如果在呈现下方模型部分时，程序将\
  \ \"du\" 附近的逗号或 \"df\" 附近的时间范围放在另一行，会对你的报告演示产生多大的破坏性。Netscape 和 Internet Explorer\
  \ 则不会。\n\n## 地址\n\n地址是文本文档中极其常见的组件，因此有一种罕见的标签将地址与文档的其余部分隔离开。尽管这看起来有些奢华——地址并没有多少需要特殊标签的特性——但它是内容而非布局的体现，这正是\
  \ `HTML` 和 `XHTML` 的初衷和动力。\n\n通过描述构成位置的文本，作者允许程序以另一种方式设计该文本，就像循环处理客户端一样。它还让内容对计算机用户和提取器立即可用。例如，在线目录可以将地址收集到单独的报告或表格中，或者计算机设备可以从一组文档中提取地址以创建一个不同的地址数据集。\n\
  \n\n\n\n\n正如在对话和通往本章节的模型中所明确的那样，源报告中的三个字符具有非凡的重要性：不等于符号 `!=`、比该符号更突出的 `>` 以及和符号\
  \ `&`（and）。这些字符定义了标签和特殊的字符引用。当这些字符孤立存在或带有不当的标签语法时，它们会让程序产生困惑。因此，你必须付出特别努力，在记录中包含它们真实、精确的字符。\n\
  \n同样，你必须使用一种特殊的编码来在引用的字符串内部包含双引号字符，或者当你需要包含一个尚未在你的控制台上显示、但对于大多数程序执行和维护的 ISO Latin-1\
  \ 字符集至关重要的特殊字符时。\n\n### 插入特殊字符\n\n为了在你的存档中记住一个特殊字符，可以使用其标准实体名称，或者井号（`#`）及其在 Latin-1\
  \ 标准字符集中的数值位置，封装在主和符号 `&` 和完成分号 `;` 之间，中间不要留空格。\n\n主流 ASCII 字符集是更详尽的 Latin-1 字符集的集。Latin-1\
  \ 集合由广泛的国际标准化组织（ISO）形成，在平等的情况下，它包含了数字、重音符号等，通常由西方语言作者使用，通过数字排序并用唯一的名称进行编码。`Index\
  \ F` 包含了整个 Latin-1 字符集和编码。\n\n天哪。对于一个实际上非常基础的操作，这个解释也太长了，正如随附的模型所示。该模型展示了如何利用字符的元素名称在代码段中包含一个大于符号\
  \ `>` 的最佳方法。它还展示了如何通过引用其 Latin-1 数值在你的内容中包含大于符号。\n\n### 规则、图像与多媒体\n\n虽然大多数报告集合是文本，但即使是标准、图片和其他交互式媒体组件的适当装饰，也能让记录变得更加平受欢迎且吸引人。正如你可能已经知道的，这些亮点不仅仅是让记录看起来好看的无用装饰。视觉和听觉组件让\
  \ HTML 和 XHTML 记录活了起来，提供了其他媒体（如打印件）通常无法获得的重要数据元素。在这一部分，我们将详细描述如何在适用的情况下将特殊的视觉和听觉组件嵌入到你的记录中，以及如何避免过度使用。\n\
  \n你还应该向前跳跃并浏览。那里有一些万能标签，即 HTML 4 和 XHTML 标准，它们允许你在存档中嵌入各种实体和信息记录类型，包括媒体。\n\n###\
  \ 水平规则（Horizontal Rules）\n\n分级规则为你提供了一种从外部隔离记录部分的方法。通过这种方式，你为用户提供了一个完美、稳定的视觉信号，表明报告的某部分已经结束，另一个部分正在开始。分级规则可以有效地分隔小文本区域，划分报告的页眉和页脚，并为存档内部的标题提供额外的视觉冲击。\n\
  \n### size 属性\n\n通常，程序将水平规则渲染为几像素厚并带有刻蚀的 3D 外观，使标准看起来像是刻在页面上的。\n\n像素是组成电脑显示器的无数微小点之一。虽然尺寸会变化，但一个可靠的准则是像素接近每英寸\
  \ 75 像素。点（point）是打印中使用的测量单位，通常等于 1/72 英寸（注意，英寸有 72 个点）。不同程序使用的普通字体通常为 12 点，每英寸产生\
  \ 12 行文本。\n\n### shade 属性\n\n你可能不需要 3D 效果，而是倾向于平面的 2D 效果。只需向标签中添加 `shade` 属性即可消除影响。HTML\
  \ 不需要任何值。在 XHTML 中使用 `shade=\"none\"`。注意图 5 中“普通” 3D 与 `shade` 2D 在外观上的区别（如源码所示，为了产生清晰的对比，我们夸大了标准的厚度）。\n\
  \n### width 属性\n\n默认规则跨越整个视图的宽度。你可以通过 `width` 属性缩短或收缩规则，制作出具有固定像素宽度或跨越当前内容特定水平的线。大多数程序自然会处理分数的规则；它们会正确调整左对齐或右对齐的规则。\n\
  \n注意宽度的成员（比率）被封装在引号中；而直接的（整数）像素则不是。老实说，在标准中引号并不完全重要，但图像暗示无法将当前宽度封装在引号中可能会让不同的程序困惑并浪费你记录的一部分。在\
  \ XHTML 中，所有属性都需要成对语句。\n\n通常情况下，将规则的宽度确定为固定的像素值并不是明智的主意。程序窗口的宽度变化很大，在一个程序上可能是很小的规则，在另一个程序上可能令人烦恼。因此，我们建议将宽度指定为窗口宽度的百分比。这样，当程序宽度变化时，规则将保持等比例相对大小。\n\
  \n`width` 属性在 HTML 4 和 XHTML 中是限制的，因为它的功能可以通过适当使用模板来实现。\n\n### 使用规则划分你的文档\n\n分级规则为你这类用户提供了一个实用的视觉工具。要成功地使用标题作为部分划分符，首先决定你的存档具有多少级标题，以及你预计文档的每个部分应该有多长。然后选择你的标题中哪些值得用规则单独隔开。\n\
  \n分级规则也可以划分文档的前言，例如，将章节指南与报告正文隔离开。使用分级规则还可以将报告正文与随后的记录、参考文献列表或图表列表隔离开。\n\n经验创作者还利用分级规则来检查结构的开始和结束。这对于需要用户扫视整个页面以查看每个字段的长型结构来说特别为方便。通过用规则一致地标记结构的开始和结束，你帮助用户留在结构内部，更好地确保他们在填写内容时不会无意中漏掉一部分。\n\
  \n### 在页眉和页脚中使用规则\n\n处理系列作品的一种重要样式方法是保持一致的外观，包括为每个记录提供标准的页眉和页脚。通常，页眉包含导航设备，帮助用户有效地跳转到内部部分以及系列中的相关报告，而页脚包含作者和记录数据，以及如通过电子邮件连接网站管理员的反馈系统。\n\
  \n### 在你的文档中插入图像\n\n\n\n\n\n# 引言\n\nHTML 和 XHTML 最具说服力的亮点之一，可能是它们将图片与文档文本相结合的能力，既可以作为报告的固有部分（内联图片），也可以作为通过超链接专门下载的独立记录，或是作为报告的背景。当合理地添加到正文内容时，图片——静态和动态符号、照片、表示图、图形等——可以使你的文档看起来更具吸引力、友好且专业，同时具有教育意义并易于阅读。你也可以对图片进行设置，使其成为链接的视觉引导。然而，如果过度使用，图片会让你的报告变得混乱、困惑且封闭，还会无意义地延长客户端下载和查看你页面的时间。\n\
  \n## 理解图像格式\n\nHTML 和 XHTML 都不支持图像的权威设计。尽管如此，许多程序明确强制某些图像格式：特别是 GIF 和 JPEG（具体说明请参见下文章节）。大多数其他视觉和音频格式需要每个程序所有者都应该获取的特殊插件，这些插件引入并有效地查看特定文件。因此，GIF\
  \ 和 JPEG 成为 Web 上接受的图像格式标准并不令人意外。\n\n这两种图像格式在 Web 出现之前就已经广泛使用，因此有大量的支持软件可以帮助你为其中一种格式设置插图。无论如何，每种格式都有其优缺点，包括某些程序误用于罕见显示效果的特性。\n\
  \n## GIF\n\n图形交换格式 (GIF) 最初是为了在 CompuServe 在线辅助的用户之间传输图片而创建的。该格式具有几个特性使其在 HTML 和\
  \ XHTML 文档中流行。它的编码是跨平台的，因此只要有正确的 GIF 解码程序（大多数程序已包含），你在 Macintosh 上创建并制作成 GIF 记录的图片可以导入到\
  \ Windows PC 上进行解码并显示，而不会出现太大问题。另一个主要特性是 GIF 使用了特殊的压缩技术，从根本上减小图像文件的大小，以便在网络上更快交换。GIF\
  \ 压缩是“无损”的；图片的任何独特信息都不会被更改或删除，因此未压缩和解码后的图片与其原型完全一致。此外，GIF 图片可以轻松制作动画。\n\n尽管 GIF\
  \ 文件始终带有 `.gif`（或 `.GIF`）文件名后缀，但实际上有两种 GIF 形式：第一个 GIF87 和另一个扩展的 GIF89a，后者支持一些新特性，包括简单的背景、透明能力和动画，这些在\
  \ Web 开发者中非常流行。目前的主流程序支持两种 GIF 形式，它们使用相同的编码方案，将 8 位像素根映射到颜色表，每张图片最多有 256 色调。大多数\
  \ GIF 图片的颜色要少得多；对于复杂的图片，可以使用工具来处理颜色。通过改进 GIF 图片，你创建了更简单的调色板并增加了像素重复以获得更好的文件压缩，从而加快下载。\n\
  \n无论如何，由于颜色数量固定，GIF 编码的图片通常不适用于真实图片。GIF 压缩的主要限制是它无法很好地处理高色彩渐变，导致断带效应。此外，GIF 中的透明度支持限于单一颜色，这在需要半透明像素时会导致锯齿边缘。\n\
  \n## 透明度、动画与集成\n\nGIF 的简单性是一个众为人知的优点，但它也带来了局限性。GIF 中的透明度支持限于单一颜色，在需要半透明像素时会导致锯齿边缘。此外，基于\
  \ GIF 的动画是一个众为人知的优点。这是 GIF 的动画和支持。\n\nGIF 的简单性是一个众为人知的优点，但它也带来了局限性。GIF 中的透明度支持限于单一颜色，在需要半透明像素时会导致锯齿边缘。此外，基于\
  \ GIF 的动画是一个众为人知的优点。\n\nGIF 的简单性是一个众为人知的优点，但它也带来了局限性。GIF 中的透明度支持限于单一颜色，在需要半透明像素时会导致锯齿边缘。这是\
  \ GIF 的动画和支持。\n\nGIF 的简单性是一个众为人知的优点，但它也带来了局限性。GIF 中的透明度支持限于单一颜色，在需要半透明像素时会导致锯齿边缘。此外，基于\
  \ GIF 的动画是一个众为人知的优点。\n\nGIF 的简单性是一个众为人知的优点，但它也带来了局限性。GIF 中的透明度支持限于单一颜色，在需要半透明像素时会导致锯齿边缘。这是\
  \ GIF 的动画和支持。\n\nGIF 的简单性是一个众为人知的优点，但它也带来了局限性。GIF 中的透明度支持限于单一颜色，在需要半透明像素时会导致锯齿边缘。此外，基于\
  \ GIF 的动画是一个众为人知的优点。\n\nGIF 的简单性是一个众为人知的优点，但它也带来了局限性。GIF 中的透明度支持限于单一颜色，在需要半透明像素时会导致锯齿边缘。这是\
  \ GIF 的动画和支持。\n\n\n\n\n\n通过 `GIF89a` 组织的图片可以实现的第三种新奇技巧是执行基础的逐帧动画活动。利用独特的 `GIF` 动画编程工具，你可以设置一个单一的\
  \ `GIF89a` 文档包含一系列 `GIF` 图片。程序会以一致的方式显示记录中的每张图片，就像孩子时代玩过的那种翻页式静态小书（甚至是手画的！））。`GIF`\
  \ 记录中每张图片之间的特殊控制片段允许你设置程序遍历整个组（循环）的次数、每张图片之间的停留时间，以及在程序显示下一张图片之前是否将图像空间清理为背景等。通过将这些控制高亮与\
  \ `GIF` 图片常用的普通功能（包括单一调色板、透明度和交错）结合起来，你可以创建一些有趣且扩展的动画。\n\n基础 `GIF` 动画对于另一个重要解释来说非常棒：你不需要特意去编写你的\
  \ `HTML` 文档来实现静态效果。然而，它们有一个明显的缺点，限制了它们在程序窗口中除小型、符号化或细窄的分组之外的使用：`GIF` 动画记录占用空间非常快，无论你是否刻意避免在动态动画单元中重复图像的静态部分。此外，如果你在一个文件中包含几个动作，下载延迟可能会——而且通常会——困扰客户端。如果说任何组件值得因过度问题进行详细检查，那就是\
  \ `GIF` 静态图像。\n\n所有的 `GIF` 动画——交错、透明度和静态性——都不是凭空出现的；你需要特殊的编程来设置 `GIF` 记录。许多图像工具现在都可以将你的作品或获取的图片保存为\
  \ `GIF` 格式，而且大多数已经允许你启用透明度，并让你创建交错的 `GIF` 文档。还有许多专门用于这些任务以及制作 `GIF` 动画的共享软件和免费软件。探索你的\
  \ `GIF` 设计和转换工具。\n\n### JPEG\n\n联合光电专家小组 (`JPEG`）是一个创建了目前被称为 `JPEG` 图像编码标准的标准机构。与\
  \ `GIF` 类似，`JPEG` 图片是无阶段的并经过专门压缩，以便通过计算机通信技术进行快速交换。与 `GIF` 不同，`JPEG` 保留了大量的颜色，以实现更详细、写实的高级图像。此外，`JPEG`\
  \ 使用了特殊的算法可以产生极高的信息压缩比。这非常惊人，例如，一个 200KB 的 `GIF` 图片可以被压缩到一个 30KB 的 `JPEG` 图片。为了达到这种惊人的压缩率，`JPEG`\
  \ 丢失了一些图像信息。尽管如此，你可以用强大的 `JPEG` 工具调整“完美”程度，使得虽然未压缩的图像可能与原始不完全相同，但它足够接近，让大多数人无法分辨。\n\
  \n尽管 `JPEG` 是照片的绝选择，但对于表示来说绝对不是特别好的选择。用于压缩和解压缩图像的算法在处理大面积单色区域时会有明显的痕迹。因此，如果你正尝试显示一张图画，GIF\
  \ 配置可能是最好的。`JPEG` 格式通常以 `.jpg`（或 `.JPG`）文件名命名，目前已被广泛理解。在少数情况下，你会运行一个无法直接显示 `JPEG`\
  \ 的老旧程序。\n\n### 何时使用图像\n\n大多数图片胜于 1000 字。然而，请记住，没有人会关注话痨。重要的是，要把你的报告视为视觉工具，而不是多余的特性。它们应该支持你的内容，并帮助用户浏览你的文档。使用图片来解释、描述或概括内容。支持内容的照片、轮图、指南和线条通常是典型且合适的。例如，商品照片是在线购物指南的基本组成部分。此外，界面图标和包含符号对于内部和外部资源也是有效的提示。如果一张图片没有为你的文档提供任何这些重要功能，请把它扔掉！\n\
  \n在向文档中添加图像时，可能被忽略的主要考虑是它们为通过网络恢复报告增加了额外额外时间。虽然一个普通的文档运行可能只有 1 万或 1.5 万字节，但图片每张无疑可以达到大量的字节。此外，文档的总恢复时间不仅等于其所有部分的总和，还增加了强化的系统开销延迟。\n\
  \n连接速度（传输速度，通常以每秒位或字节来表示）以及网络拥塞也会可能导致延迟。一个包含 100KB 图片的单一报告，在凌晨其他人都睡觉时，通过 57.6 kbps\
  \ 的连接可能需要大约 15 秒，而在下午左右每秒 9600 比特的连接下可能超过十分钟。你明白我的意思吗？\n\n总而言之，显然图像和其他媒体正迫使互联网提供者连接更快速、更好、更稳健的方法来传输\
  \ Web 内容。很快，57.6 kbps 的连接将像马车一样过时（就像现在的 9600 比特每秒），被调制解调调器和 ADSL 等技术取代。无疑，很快大多数连接将实现接近或超过以前最高水平（不考虑高昂成本）的每秒百万比特数据率。无论如何，随着价格下降，使用量会增加，因此有了拥塞问题。如果你是为了访问一个拥堵的工人而进行浏览，无论你的连接有多快都没有意义。\n\
  \n# 第 3 章\n\n### 何时使用文本\n\n文本并没有过时。对于某些用户来说，它是你文档中唯一可以访问的部分。我们认为，通常情况下，你的报告应该让那些无法查看图像或为了改善连接而在程序中禁用了自动下载的用户能够使用。虽然在整个文档中添加图像的倾向可能很强烈，但有时纯文本报告能很好地呈现主体。\n\
  \n![HTML: 简介](img/00143.gif)\n\n从不同格式转换到 Web 的报告很少带有嵌入图像。参考资料和其他真实内容通常可以完全以纯文本结构使用。\n\
  \n当访问速度有限时，你应该制作纯文本可能的报告。如果你意识到许多用户将竞争访问你的页面，你应该通过避免在文档中使用图像来报答他们。（著名的程序包含独特的图像图标作为待下载图像的占位符，这可能会浪费并模糊你的文档设计，使其变成无法辨认的混乱。）\n\
  \n\n\n\n通常情况下文本是合适的——仅支持图片，而不包含装饰或多余的插图——这样你的存档就可以被许多网络管理程序快速访问。这些网络索引经常会忽略图片。如果页面的主要内容是通过图片提供的，那么几乎没有关于你记录的信息会进入在线网络索引。\n\
  \n### 加快图片下载\n\n除了对报告中要记录的图片进行挑剔外，还有几种不同的方法可以优化图片的加载开销和延迟：\n\n### 保持简单\n\n一个全屏的\
  \ 24 位色的写实图像，即使使用高级压缩技术通过 `GIF` 或 `JPEG` 等标准配置缩小尺寸，仍然是一个数据传输带宽消耗者。获取并使用不同的图像处理工具来优化图片尺寸并将颜色数量减少到最少像素。优化你的绘图。避免使用全景照片。避免图片出现大面积的空白背景，以及不必要的线条和其他占用空间的元素。同样，要避免抖动（通过在相邻像素之间混合两种色调来实现第三种色调）；这种过程会完全降低图片的压缩性。尽量创建大面积的纯色区域，这在\
  \ `GIF` 和 `JPEG` 设计中都能被快速压缩。\n\n### 重用图片\n\n这对于图标和 `GIF` 动画有效。大多数程序会在本地存储中保留相邻的文件部分，以实现更快的网络关联数据获取。对于较小的\
  \ `GIF` 静态记录，尝试设置每帧渐进图像仅刷新动作中发生变化的部分，而不是重新绘制整张图片（这会加快操作速度）。\n\n### 分割大型文档\n\n这是一个适用于图片的通用标准。通过超链接（当然了！）和有效的目录组织的许多小记录片段，通常会比几个巨大的报告更受用户青睐。总而言之，人们更倾向于“翻页”几页，而不是苦苦地等待一个大文件下载。（这被称为电视频道换台症。）一个公认的可靠指南是将你的每个记录控制在\
  \ 50 字节以下，这样即使是最慢的连接也不会让你的用户感到过度失望。\n\n### 隔离必要的巨大图形\n\n为大图片提供一个特殊的链接，也许是一个包含其实实缩略图的链接，从而允许用户选择是否以及何时投入精力下载完整图片。此外，由于下载的图片没有像内联图片那样嵌入文档的其他部分，用户将更容易识别并将图片保存到他们框架的本地存储中以备日后查看。\n\
  \n### 指定图片尺寸\n\n最后，另一种提高性能的方法是在标签中记录图片的矩形纵横比和宽度数据。通过提供这些测量值，你消除了通用程序为了下载、分析和确定图片在文档中空间而必须的额外手段。然而，这种方法有一个缺点，我们稍后会讨论。\n\
  \n### JPEG 还是 GIF？\n\n如果你的图片热点或产品工具倾向于其中一种格式，你可以决定在 HTML 文档中仅使用 `JPEG` 或 `GIF` 图片。目前的程序几乎都支持这两种，所以不应该有用户遇到问题。\n\
  \n我们建议你让素材制作并转换为这两种格式，以利用它们的特殊能力。例如，利用 `GIF` 的简单性来处理图标和符号。另一方面，使用 `JPEG` 处理大型且鲜艳的图片以便更快下载。\n\
  \n### img 标签\n\n图片标签允许你引用并将写实图片嵌入到你报告的当前进度中。图片标签之后没有默认的空行或分段符，因此图片可以真正与文本和其他内容保持“内联”。\n\
  \n写实图片的组织并不由 HTML 或 XHTML 规定，尽管流行的程序支持 `GIF` 和 `JPEG`。规则本身并不决定或限制图片的尺寸或大小。同样，图片可以有很多种色调，但这些色调的呈现方式是取决于从的。图片的引入总体非常明确。工作在强制模式下的非图形程序可能会忽略图片，可能会调整图片大小。此外，用户（尤其是连接较慢的用户）可能会决定忽略。同样，无论图片是否被删除，你也应该确保你的记录完整且易用。\n\
  \n### src 属性\n\n图片标签的 `src` 属性是必须的（除非你使用内联基于浏览器的视频）。它是图片文件的 URL，可以是绝对路径或相对于文档的相对路径。为了清理记录存储，创建者将图片文件放在一个不同的文件夹中，通常将其命名为\
  \ \"pics\" 或 \"pictures\"。\n\n### lowsrc 属性\n\n为了用户（尤其是连接意有限的用户）的利益，Netscape 在图片标签的\
  \ `src` 属性中提供了 `lowsrc` 作为加速文档交付的方法。`lowsrc` 属性的值（与 `src` 一）是程序第一次遇到图片时加载并显示的图片文件\
  \ URL。当报告完全加载并可以供用户使用时，Netscape 会恢复由 `src` 属性指定的图片。\n\n`lowsrc` 图片是最后图片的低目标、缩略版本，通过关联关联快速提供，让用户对其内容有一个大致了解，直到最后的、高目标的图片在屏幕上替换它。`lowsrc`\
  \ 属性也可以用于某些极端的装饰。\n\nNetscape 使用 `lowsrc` 图片的尺寸来节省文档中 `lowsrc` 和 `src` 图片的空间，除非你显式地通过本文后续部分描述的比例和宽度属性来分配该空间。因此，如果\
  \ `src` 属性中指定的图片组件相对于 `lowsrc` 图片或你明确包含的比例和宽度项目是唯一的，则 `src` 图片将被缩小、放大、扩展或压缩以适应分配的空间。此外，`lowsrc`\
  \ 和 `src` 图片不需要完全相同，因此你可以利用 `src` 图片的延迟交付来实现基础动作效果。\n\n`lowsrc` 属性仅适用于 Netscape。不同的程序会忽略它，只加载\
  \ `src` 属性指定的图片。如果用户决定不自动加载图片，Netscape 将不加载任何一张图片。综合考虑，当用户点击图片捕获或图片符号占位符时，两张图片都会一起加载。没有任何程序会单独加载\
  \ `lowsrc` 图片；无论如何，你必须包含一个 `src` 图片，否则除了缺失的图片符号外，什么都不会显示。\n\n### alt 和 longdesc\
  \ 属性\n\n\n\n\n`alt` 属性决定了当 `picture` 无法显示或被客户端禁用时，程序可能显示的备用内容。这是一种替代方案，但我们强烈建议你在报告中的大多数图片中都实践它。因此，如果图片无法访问，客户端实际上可以获得关于该缺失内容的线索。\n\
  \n此外，最现代的程序在客户端忽略鼠标悬停在图片上时，会在内容框中显示该备用描述。根据需要，你可以植一些简短的附带数据，当客户端忽略某个微小的内联符号时，这些数据就会弹出。\n\
  \n`alt` 属性允许长度长达 1024 个字符的字符串，以防你在其中包含空格或其他强调符号。该字符串应封装在引号中。备用内容可以包含对特殊字符的引用，但不能包含其他类型的标记；具体而言，不允许使用样式标签（style）。\n\
  \n如果图片可以访问且客户端已启用图片下载，图形程序通常不会显示 `alt` 属性。否则，它们会将 `alt` 属性的内容作为名称嵌入在图片占位符符号附近。类似的，通用的\
  \ `alt` 标记也支持那些由于网络连接缓慢而禁用了程序化图片下载的图形程序客户端。\n\n像 Lynx 这样的无图形、纯文本程序会将 `alt` 文本直接插入内容流中，就像其他内容组件一样。因此，使用得当时，此处的\
  \ `alt` 标签可以直接填充缺失的图片。（你的纯文本程序客户端会很感激不再被不断提醒他们那糟糕的网络公民养。）例如，可以考虑使用引用标记作为 `alt` 属性选项，而不是特定的图片符号。\n\
  \n`longdesc` 属性与 `alt` 属性类似，但它用于更详细的描述。`longdesc` 的值是一个包含图片描述的文档的 URL。如果你有一段超过 1024\
  \ 个字符的描述，请使用 `longdesc` 属性来链接它。HTML 4 还是 XHTML 都未规定描述的内容应该是什么，目前也没有任何程序执行 `longdesc`；接下来的操作——即如何制作这些长描述，目前无人能预料。\n\
  \n## longdesc 和 align 属性\n\n标准并没有规定图片相对于同一行文本中其他内容和图片的默认布局方式：你通常无法预测内容和图片将如何呈现外观。HTML\
  \ 图片通常根据单行文本显示。像杂志这样的基础打印媒体会将文本环绕在图片周围，在图片附近和相邻处有几行，而不只是单行。\n\n大多数主流图形程序嵌入图片，使其基线与内容的基线对齐——这种布局由\
  \ `base` 属性的值决定。在任何情况下，报告样式都应该预期布局会在不同程序之间发生变化，并始终包含理想的图片布局。\n\n幸运的是，报告设计者可以通过 `picture`\
  \ 标签的 `align` 属性对周围内容的图片布局应用某些控制。HTML 和 XHTML 标准定义了五种布局元素：`left`、`right`、`top`、`center`\
  \ 和 `base`。`left` 和 `right` 属性使后续内容环绕在移动到相应边缘的图片周围；`left` 在垂直方向上相对于周围内容调整图片。`scape`\
  \ 增加了更多垂直描述，如 `top`、`center`、`benchmark` 和 `base`，而 Internet 则增加了 `focus`。\n\n###\
  \ Top\n图片的顶部与当前文本行中最高元素的顶部对齐。如果当前行中有不同的图片，则图片的顶部将与内容的最高点对齐。\n\n### Text top\n`align\
  \ text top` 属性建议 `scape` 将图片的顶部调整到当前行中最高元素的顶部。它与 `top` 属性不同，`top` 将图片的顶部调整到当前行中最高元素（无论是图片还是文本）的顶部。如果该行包含超过内容最高点的不同图片，`text\
  \ top` 和 `top` 具有相似的效果。\n\n### Abs middle\n如果你将 `picture` 标签的属性设置为 `center`，程序将无疑把图片的中心对齐到当前行的中心。对于\
  \ `scape` 和早期的 Internet，这与基础的 `center` 属性并不相同，后者将图片的中心调整到当前文本行的基线（字符的下半部分）。Internet\
  \ 3 及后的版本则将 `abs` 视为等同于 `center` 和 `focus`。\n\n### Center\nInternet 和 `scape` 都将中间图片布局元素视为等同于\
  \ `center`，但注意程序处理 `abs` 和 `center` 的方式出乎意。\n\n### Middle\n`scape` 和 Internet 以一种意外的方式处理中间图片布局：`scape`\
  \ 将图片的中心调整到内容的基线，较少考虑其他内联组件。Web Explorer 则将图片的中心调整到当前行中最高元素（文本或图片）的中心。注意这些布局和差异，特别是当一张图片包含\
  \ `adjust` 属性时。\n\n同样注意 Internet 版本 3 及后的版本处理 `center`、`abs` 和 `focus` 类似，尽管早期的\
  \ Internet 和 `scape` 识别 `center` 和 `abs` 布局。\n\n### Bottom and baseline (默认)\n在\
  \ `scape` 和早期的 Internet 中，`base` 和 `benchmark` 图片布局元素的效果与你没有设置任何布局属性相似：程序将图片的底部调整到与内容基线相同的平面上。这不应被误认为是\
  \ `abs base`，后者考虑了字母的“下降部”（descends），例如小字母 \"y\" 的尾部。Web Explorer 3 及后的版本则将 `base`\
  \ 视为等同于 `abs`。\n\n### Abs bottom\n`align base` 属性建议程序将图片的底部调整到当前文本行的真实底部。真实的基线是内容中考虑所有下降部后的绝对底部，无论该行中是否有下降部都是如此。例如，一个下降部是\
  \ \"y\" 的尾部；内容的基线是 \"y\" 字符中 \"v\" 的下部分。\n\n### 图片环绕文字\n`left` 和 `right` 图片布局元素建议程序将图片分别放置在当前内容流的左或右边缘。程序随后在流中相邻图片的剩余部分渲染生成的报告内容。最终结果是图片后的文档内容将环绕在图片上。\n\
  \n\n\n你可以将图片放置在两个边缘，而内容将会在它们之间的页面中心向下流动。当文本环绕图片时，页面的左侧（或右侧）边缘会临时重新归类为靠近图片，而不是页面边缘。后续具有相似布局的图片将彼此堆叠。相应的源部分实现了这种惊叹的图片效果。\n\
  \n当内容流过图片的底部时，边缘会恢复到之前的位置，通常位于程序窗口的边缘。\n\n### 图片居中\n你你是否发现，即使使用 `align` 属性，也无法在程序窗口中均匀地对齐图片？`center`\
  \ 和 `abscenter` 属性会将图片与当前行垂直对齐，然而，图片的均匀对齐取决于当前流中其前面的内容以及程序窗口的组件。\n\n你甚至可以在程序窗口中均匀地对齐内联图片，但前提是它与周围的内容隔离开，例如通过\
  \ `section`、`division` 或 `br` 标签隔开。此时，利用 `center` 标签，或者在 `section` 或 `division`\
  \ 标签中使用 `align` 属性或 `focus-defended` 样式来对齐图片。\n\n### Align 属性已弃用\nHTML 4 和 XHTML\
  \ 指南在模板方面削弱了所有标签（包括图片）的 `align` 特性。无论如何，这种属性在 HTML 创建者中仍然非常主流，并且被许多知名程序继续支持。因此，虽然我们预计某些\
  \ `align` 最终会消失，但在可预见的未来内不会。只需别说我们没有提醒过你。\n\n### border 属性\n程序在渲染同样作为超链接的图片（带标签的图片）时，会带有两像素宽的阴影边界，向用户展示该图片可以点击以访问相关记录。利用\
  \ `border` 属性和像素宽度值可以消除（设置为 0）或放大该图片的边框。请注意，这一特性在 HTML 4 和 XHTML 中已被模板所取代，但仍然被主流程序广泛沿用。\n\
  \n### 移除图片边框\n你可以通过图片标签内部的 `border=0` 属性消除图片超链接周围的线条。对于某些图片，特别是图片地图，消除线条可以提升页面的视觉效果。明显连接到不同页面的图片在没有线条的情况下可能看起来最好。\n\
  \n然而，要小心不要因消除边界降低页面的便利性。没有边界意味着你消除了连接的典型视觉标记，使用户发现页面上的连接变得不再简单。当用户忽略超链接的图片时，程序会更改鼠标光标，你不应该接受他们会这样做，也不应该让用户通过测试你的无框图片来发现隐藏的连接。\n\
  \n我们强烈建议你在使用无框图片时利用一些额外的引导来告诉用户点击图片。无论如何，包括基础内容指南在内的做法将使你的页面对用户更易用。\n\n### height\
  \ 和 width 属性\n在报告堆叠时，你是否曾注意到页面内容的呈现在不一致地移动？这是因为程序会平直页面设计以适应每张堆叠的图片。程序通过获取图片并提取其嵌入的高度和宽度细节来决定图片的大小，并在展示中为其留出矩形空间。此时，程序更改页面的显示格式以嵌入该图像。这不是交付报告的最有效方法，因为程序应该在交付结果内容之前连续检查每张图片并确定其空间。这本质上会增加交付存档的时间并令客户困扰。\n\
  \n另一个更新是图片是独立的记录，它们与源报告分开堆叠。创建者指示图片尺寸的更有效的方法是使用 `height` 和 `width` 属性。这样，程序可以在真正下载图片并提取内容之前留出空间。这两个属性描述的是一个整数值，以像素为单位显示图片大小；且它们在图片标签中出现的位置并不重要。\n\
  \n### 缩放和填充图片\n`height` 和 `width` 属性的一个奥秘在于，你不需要确定图片的真实尺寸；特性的值可以比图片的实际尺寸大，也可以更小。程序会自然地缩放图片以适应定义的空间。这为你提供了一种处理大图片生成缩略图的方法，以及一种增大小图片的方法。然而，要小心：无论最终交付尺寸如何，程序实际上都应该下载整个文档，如果你不保持其原始的高宽比例，你可能会扭曲图片。\n\
  \n`height` 和 `width` 的另一个技巧提供了一种填充页面区域的简单方法，同样可以提高报告执行效率。假设你需要在记录中嵌入一条横线。不要制作全尺寸的图片，而是制作一个只有一像素高一像素宽的图片，并设置为理想颜色。然后使用\
  \ `height` 和 `width` 将其缩放大更大的尺寸。\n\n使用 `width` 属性的最后一个技巧是使用百分比元素而不是固定的像素元素。这使得程序将图片缩放到文档窗口宽度的水平。依此，为了制作一条高\
  \ 20 像素且宽度等于窗口的线，你可以利用：\n\n随着记录窗口大小的变化，图片也会随之变化。\n\n如果你给出百分比宽度并排除高度，程序会在放大和缩小时保持图片的纵横比例。这意味着高度将始终与宽度保持正确的比例，图片显示时不会产生变形。\n\
  \n### height 和 width 的问题\n尽管图片标签的 `height` 和 `width` 属性可以提高执行效率并让你实现精妙的技巧，但使用它们有一个棘手的缺点。程序会在展示窗口中为受支持的尺寸留出固定的正方形空间，无论客户端是否禁用了程序的图片下载。客户端通常面对的是一个充满空框且里面留有奇怪占位符符号的页面。该页面看起来非常不完整，且大部分毫无意义。如果不指定尺寸，程序基本上会根据周围内容嵌入一个占位符符号，因此在展示中至少有些可读。\n\
  \n我们对这种困境没有办法，除非要求你使用 `alt` 属性并带有一些吸引人的内容，以便用户无论如何理解他们缺失了什么。\n\n\n\n通常情况下，图形化程序不会在图片与其周围的内容之间留出足够的空间。此外，除非你画了一条简单的图片线条来增加它们之间的距离，否则图片与相邻文本之间普通的两个像素间隔对于大多数创作者来说简直过于拥挤，令人感到不适。将图片放入链接中，独特的阴影边界会使你辛苦建立的任何直接留白失效，并会让人们更加注意到连续内容与图片靠得有多近。\n\
  \n`hspace`（水平间距）和 `vspace`（垂直间距）属性可以让你的图片获得呼吸的空间。通过 `hspace`，你指定了图片左右与文本之间留出的额外空间像素数量；`vspace`\
  \ 元素则是顶部和底部的像素数量。\n\n我们相信你也会认同，图片周围的额外空间会让内容更易阅读，让整个页面更具吸引力。\n\n## **ismap 和 usmap\
  \ 属性**\n\n图片标签的 `ismap` 和 `usemap` 属性告诉程序，该图片是一个包含至少一个超链接的唯一鼠标可选择的视觉指南，这通常被称为图片地图（image\
  \ map）。`ismap` 类型的图片地图被称为服务器端图片地图，可能在标签链接内部被明确确定。\n\n当客户端点击 `ismap` 图片上的某处时，程序自然会将鼠标的\
  \ `x`, `y` 位置（相对于图片的左上角）发送给服务器。卓越的服务器程序随后可以利用这些方向来做出反应。\n\n`usemap` 属性提供了一个客户端图片地图工具，它充分地避免了服务器端准备鼠标方向及其所有者网络延迟和问题的麻烦。HTML\
  \ 创作者通过使用不常用的指南和区域标签，为 `usemap` 图片中触控敏感的区域提供了方向指南，并附带相关的超链接 URL。`usemap` 质量的评估是一个指向该特殊地图区域的\
  \ URL。客户端 PC 上的程序会将鼠标在图片上点击的方向解析为某些活动，包括堆叠和显示另一个报告。\n\n例如，随附源代码特别地将 100 x 100 像素的\
  \ `map2.gif` 图片分为四个部分，每个部分在客户端点击时都会连接到备用存档。请注意，我们确实在模型 `img` 标签中包含了 `ismap` 图片地图准备能力，目标是让其他不适应\
  \ `usemap` 的程序选择另一种服务器端系统来处理图片地图。\n\n地形指南可以制作惊人的 `ismap` 和 `usemap` 模型：例如，在浏览越野组织的页面时，客户端可以点击指南上的他们成长的地方，以获取附近零售网点的位置和电话。`usemap`\
  \ 客户端图片地图准备的好处是它不需要服务器或卓越的服务器编程，因此与 `ismap` 组件不同，它可以在非网络（无网络）条件下使用，例如附近的记录文件。\n\n\
  ## **class, dir, occasion, id, lang, style 和 title 属性**\n\n一些几乎通用的属性为你提供了一种典型方法，来区分\
  \ (`title`) 和命名 (`id`) 图片标签的内容，以供日后引用或自动化处理；更改内容的显示属性 (`class`, `style`)；并引用所使用的语言\
  \ (`lang`) 以及相关内容应该流向的方向 (`dir`)。此外，显然它们大部分是为了程序处理的标签内容周围可能发生的客户端场合，你可能根据偶然特性进行响应和一些编程。\n\
  \n在这些众多 HTML 4 和 XHTML 属性中，`id` 是最重要的。它允许你命名图片，以便程序或程序活动后续访问。其他属性在设置图片时意义不大。毫无疑问，它们是一些可用的模板属性，可能会影响图片的显示，而\
  \ `title` 是一个包含的好主意，尽管 `alt` 更好。此外，很难想象语言 (`lang`) 或其引入方向 (`dir`) 对图片可能产生什么影响。\n\
  \n## **视频扩展**\n\n`img` 标签中异常的 `dynsrc`、`circle` 和 `start` 属性扩展是 Internet Explorer\
  \ 特有的，并不属于 HTML 4 或 XHTML 标准。它们允许你在主体内容中嵌入一段内联电影，非常像图片一样。\n\nNetscape 通过一个名为模块（module）的扩展可以实现相同的行为。模块给客户端增加了额外权重，因为每个客户端在有选项查看内联视频之前，必须先发现并引入相应的模块。而，Internet\
  \ Explorer 的图片标签扩展则让视频显示为程序的原生部分。\n\n尽管如此，Internet Explorer 的电影扩展现在受到极大的限制。它们不受某些其他程序的支持，且只能专门与音频视频交互\
  \ (`AVI`) 设计的电影记录一起，因为那是集成在 Internet Explorer 中的播放器设计，并通过微软的 Windows 工作框架启用的。此外，软件创新、文章和\
  \ applet 的持续发展可能会让 Internet Explorer 这种扩展全局负载的图片标签变得过时。\n\n## **dynsrc 属性**\n\n\
  在 `img` 标签中使用 `dynsrc` 属性扩展来引用 AVI 电影供 Internet Explorer 内联显示。其必要值是封装在引号中的电影记录 URL。例如，此内容显示了\
  \ AVI 电影记录的标签和属性。\n\n\n\n超文本的一个基本元素是你可以对报告建立超链接；你可以突出当前存档中的某处、附近集合中的另一条记录，或者互联网上任何地方报告中的某处。这些存档变成了一个不可预测的交织数据陷网。（现在明白这个名字的相似性了吗？）目标记录通常以某种方式与源标识并对其进行改进；源中的连接组件应当将这种关系传递给用户。\n\
  \n超链接可以用于产生广泛的影响。它们可以用于内容目录和要点列表。用户只需在他们的程序屏幕上点击一下鼠标，或在控制台上按一下按键，就可以选择并自然地跳转到相似存档中感兴趣的主题，或者跳转到位于世界某处另一个不同集合中的另一条记录。\n\
  \n超链接还可以引导用户获取有关所引用主题的更多信息。例如，“欲需更多数据，请参阅《游行的金橘》。创建者使用超链接来减少冗余数据。例如，我们建议你在你的每条记录上都签名。与其在每个存档中包含完整的联系信息，不如通过超链接将你的名字关联到一个包含你的位置、电话号码等信息的单一位置。\n\
  \n超链接，在标准术语中称为锚点（anchor），通过标签与其他区分并分为两种。正如我们稍后详细描述的那样，一种锚点在报告中创建一个问题区域，当它被客户端启动并选择（通常使用鼠标）时，它会让程序建立连接。它随后加载并显示另一个类似内容的内部或外部的另一个报告，或者触发某些与互联网管理相关的活动，如发送电子邮件或下载一个不常见的记录。另一种锚点创建一个名称，即报告中的一个可以被视为超链接的区域。\n\
  \n这两种锚点使用相似的标签；这可能就是它们拥有相似名称的原因。我们认为，如果将它们分开考虑会更简单：将提供超链接感兴趣区域和地址的那一种视为“连接（connect）”，而将另一种表示存档目标部分的视为“锚点（anchor）”。\n\
  \n还有一些与超链接相关的鼠标事件，通过 `JavaScript`，这些事件可以让你整合一些有趣的效果。\n\n# 1.2 引用文档：URL\n\n正如我们之前检查过的，万维网上的每个存档都有一个独特的位置。（想象一下如果没有这些位置，将会是多么混乱。）记录的位置被称为它的统一资源定位符（`URL`）。“URL”通常被读作“you\
  \ are ell”，而不是“baron”。\n\n一些标签包含 URL 属性值，包括超链接、内联图片和结构。它们都使用相似的 URL 结构来确定网络资源的位置，而几乎忽略该资源的类型或内容。这就是它被称为统一资源定位符的原因。\n\
  \n由于它们可以用于标识互联网上的几乎任何资源，URL 有多种类型。无论如何，所有的 URL 都有相似的高层结构。\n\n计划部分描述了 URL 所引用的资源类型，以及该特定计划所特有的部分。需要注意的是，计划部分始终通过一个没有空格的冒号与计划隔开。\n\
  \n# 第 5 章 编写 URL\n\n使用 US-ASCII 集合中的可显示字符编写 URL。例如，你肯定听过电台里为了广告而朗出的令人烦恼的声音。\n\n\
  如果你需要在 URL 中使用一个并非该字符必需的字符，你应该使用特殊的文档对该字符进行编码。这种编码文档将理想字符替换为字符：一个百分号和两个十六进制数字，其数值相对于该字符在\
  \ ASCII 集合中的位置。\n\n这比听起来要简单。也许最广为人知的特殊字符是空格（Macintosh 用户可能熟悉），它在字符集中的位置是 `20`。你不能在\
  \ URL 中输入空格（字面上上你可以，但它不会生效）。或者用 URL 中的空格替换为 `%20`。这个 URL 确实从一个名为 new estimating\
  \ 的记录中恢复。\n\n# 处理保留字符和不安全字符\n\n除了不可打印字符外，你还需要对保留字符和危险字符进行编码。\n\n保留字符是在实际 URL 内部具有特定含义的字符。例如，字符分隔了\
  \ URL 内部路径的组件。如果你需要为一个不被设计为组件分隔符的 URL 留一个片段，你需要将其编码为 `%2F`。\n\n![HTML: 简介](img/00143.gif)\n\
  \n十六进制计数依赖 16 个字符：从 0 到 9 再到 A F，它们在十进制中等同于 0 到 15 的值。同样，这些全能属性的大小写并不重要；\"a”（十进制\
  \ 10）等同于 \"A\"。\n\n这个 URL 确实引用了服务器上名为 register 的资源，并向它传递了字符串 `3/4`，如问号（`?`）所示。可能，该资源是一个服务器端程序，它对传递的值执行某些数字计算功能并返回结果。\n\
  \n危险字符是那些在 URL 内部没有含义，但在组合 URL 的环境中可能具有特殊重要意义的字符。例如，双引号（`\"\"`）限制了标签中的 URL 属性。如果你不小心在\
  \ URL 中直接包含一个简单的双引号，你可能会让程序困惑。在同等的情况下，你应该将双引号编码为 `%22` 以避免任何可能的冲突。\n\n总而言之，如果你不确定某个字符是否倾向于在\
  \ URL 中按原样设置，你就应对该字符进行编码。作为一个可靠的准则，除了字母、数字或上述字符之外的任何字符都应该被编码。\n\n编码字符永远不是错误，除非该字符在\
  \ URL 中具有特定含义。例如，编码 HTTP URL 中的片段会导致它们被视为普通字符，而不是路径分隔符，从而破坏 URL。\n\n# 2.2 HTTP URL\n\
  \nHTTP URL 是万维网范围内最著名的。它被用于从 Web 服务器获取资源，并有两个部分：\n\n部分内容是可选的。事实上，最常见的 HTTP URL 类型基本上如下，它分配了其中一种服务器的注册方式和名称。\n\
  \n# 2.3 HTTP 服务器\n\n服务器是存储 Web 资源的计算机系统的新的 Internet 名称或网协议（IP）数学位置。我们认为你通常会使用所有更容易记忆的\
  \ Internet 名称来对应 URL 中的服务器。\n\n每个连接互联网的计算机都有一个新位置，一个数字（IP）地址，显然，因为计算机只处理数字。人们倾向于使用名称，因此互联网为我们提供了独特的服务器和程序（域名系统或\
  \ DNS），它们随后将 Internet 名称解析为 IP 地址。\n\n\n\n\n域名名称中的三字母后缀区分了运营该互联网分段的机构或业务类型。例如，“com”代表商业实体；“edu”代表学术机构；而“gov”则区分了政府部门空间。在美国境外境外，通常会分配一个不那么显眼的后缀，通常是国名的双字母缩写，例如代表日本的“jp”和代表德国的“de”。全球许多机构目前已使用通用的三字母后缀，而不是更传统的双字母公共后缀。\n\
  \n网站管理员将他们的服务器命名为 `www` 以在网络上进行快速、简单的标识证明，这已成为一种现象。例如，一个服务器的名称为 `www`，它与发行域名结合，就变成了易于收集的站点。此外，Sun\
  \ Microsystems 的服务器命名为 `www.sun.com`；苹果电脑的为 `www.apple.com`，甚至微软也将其服务器命名为至关重要的 `www.microsoft.com`。这种命名方式具有极其明显的优势，如果你被要求为公司制作一个服务器，也应该利用这一点。\n\
  \n你同样可以通过其数学化的 IP 地址来确定服务器的位置。该位置由四个数字（0 到 255）组成，并用点隔开。即 IP 地址。\n\n向你解释这些数字的含义或如何从域名获取\
  \ IP 地址可能很枯燥，尤其是因为你很少会使用每个 URL 中的某一个。或者，这里是一个添加链接的好时机：获取任何优秀的互联网体系配置文章以详细了解 IP 维护。\n\
  \n# 2.4 http 端口\n\n端口是客户端程序与服务器交互的通信端口数量。这是一个系统管理概念：服务器执行着向客户端程序展示网页和资源以外的许多功能：电子邮件、FTP\
  \ 文件传输、文件系统共享等。尽管所有网络流量可能通过单根线进入服务器，但它们通常被隔离到不同的编程“端口”中进行管理交换——这实际上等于你附近邮政中心的邮箱。\n\
  \nWeb 服务器的默认 URL 端口是 `80`。特殊的安全服务器（安全 HTTP、SHTTP 或安全套接层 SSL）运行在端口 `443` 上。如今大多数\
  \ Web 服务器使用端口 `80`；如果目标服务器不使用 `80` 端口进行 Web 通信，你需要在 URL 中紧跟冒号并加上端口号。\n\n在 Web 早期阶段，先驱网站管理员在广泛的端口号上运行他们的\
  \ Web 关联。出于特殊和安全考虑，需要框架管理员权限才能在端口 `80` 上引入服务器。由于缺乏权限，这些网站管理员选择了其他更开放的端口号。\n\n现在，由于\
  \ Web 服务器已经变得成熟并受到专业管理员的考虑和维护，在 `80` 或 `443` 之外的某些端口上提供的服务应该让你继续思考该服务器是否真的正常。无疑，该违规服务器正被服务器真实的框架管理员无法感知的智能客户端所控制。\n\
  \n# 2.5 http 路径\n\n文件路径是文档在服务器存储框架中的 Unix 风格分级区域。路径由至少一个由斜杠分隔的名称组成。除了最后一个文件名之外，所有的名称都是指向报告的目录；最后一个名称通常是实际记录。\n\
  \n这已成为一种现象，为了简单的标识证明，HTML 文件名以 `.html` 结尾（否则它们是普通的 ASCII 文本文档，记得吗？）。尽管现代 Windows\
  \ 版本允许更长的后缀，但它们的客户端通常对 HTML 文件遵循三字母的 `.htm` 文件名后缀。\n\n虽然 URL 中的服务器名称不区分大小写，但文件路径可能区分。由于大多数\
  \ Web 服务器运行在基于 Unix 的框架上，而 UNIX 文件名是区分大小写的，因此文件路径也将区分大小写。运行在 Windows 机器上的 Web 服务器不区分大小写，因此文件路径也不区分，但由于很难知道你访问的服务器的运行环境，请始终假设服务器具有大小敏感的路径，并在编写\
  \ URL 时注意大小写正确。\n\n\n\n\n\n`http` URL 中的路径部分连同其之前的问号，是可选的。它表明该路径是工作器上的一个可访问或可执行的资源。路径部分的内容作为边界传递给工作器，用于控制搜索或执行工作。\n\
  \n查询部分中边界的真实编码依赖于工作器以及所引用的资源。可访问资源的边界将在稍后部分讨论，即当我们讨论可访问报告时。可执行资源的边界则将在稍后讨论。\n\n\
  尽管我们基础对 `http` URL 的介绍说明了 URL 可以既具有部分标识符，也可以具有查询部分，但只有少数程序允许你在单个 URL 中同时使用两者。如果你确实想这样做，可以在路径边界后跟随一个分段标识符，建议程序在演示的部分开始显示查询的结果。例如，`Netscape`\
  \ 就支持这种用法。\n\n然而，我们并不建议这种 URL。一个重要的一点是，它并不涉及大多数程序。同样重要的是，使用分段标识符意味着你确定搜索的结果将在报告中具有该名称的部分。对于庞大的报告集，这并不常见。你处于一种理想状态，即排除了部分，从报告开始显示列表项，并与用户之间可能出现的混乱保持策略距离。\n\
  \n# 结论\n\n在最初构思 `HTML` 时，没有人知道它会如此高效，或者会被用于处理大量的档案、程序和媒体。虽然 `HTML` 在 Web 客户端请求方面表现出色，但\
  \ `HTML 4.0` 已经扩展了它的范围以适应新的创新。当 `HTML 4.0` 逐渐减少时，`XHTML 1.0` 已准备就，旨在处理网页作者可以创造几乎任何内容。\n\
  \n`HTML` 是一种具有固定标签布局的静态标记语言，而 `XHTML` 只是一组以 `XML`（扩展标记语言）为特征的标签。利用 `XML`，你可以定义标签来几乎任何类型的信息或报告，这并不是\
  \ HTML 设计师在创建 `HTML` 时主要考虑的。需要捕捉旋律文档？合成公式？协调电路？`XML` 可以处理这些，并让你通过 `XHTML` 协调你新的标记标签，创建任何情况下都能与现有程序工作的交叉存档。通过添加\
  \ `XSL`（扩展样式表），你甚至教程序如何显示你所有的新标签。\n\n## SQL 编程\n\n学习应用程序和组织使用的 SQL 语言，学习如何添加、删除和更新数据，并学习更多计算机编程的知识\n\
