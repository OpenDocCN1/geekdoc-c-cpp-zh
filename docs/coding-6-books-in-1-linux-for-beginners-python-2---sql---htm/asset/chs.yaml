  \n# 第 5 章：熟悉 Linux 文件系统和进程\n\n![internet-1593292_1280](img/0088.jpeg)\n\nLinux 文件系统在灵活性方面非常出色。它的设计允许它支持普通文件以及特殊类型的文件格式。它可以支持文本、程序、服务、输出和设备。因此，由于它支持多种文件格式，它可以与其他操作系统共存。此外，在系统中，文件和目录之间几乎没有可区分的因素。因此，目录仅仅是文件的位置。\n\
  \n## 文件的分类\n\n为了更好地理解 Linux 文件系统，对文件进行了分类。虽然可以认为这样做是安全的，但了解更多关于特定文件的知识可以让程序员和系统管理员避免使用\
  \ Linux 的复杂性。这防止了他们执行长时间的列表操作。\n\n文件分类：\n* 目录 (`d`) – 一个作为文件列表的文件\n* 链接 (`l`) –\
  \ 一种允许在多个部分显示特定文件的系统\n* 管道 (`p`) – 一种允许进程间通信的系统\n* 普通文件 (`-`) – 正常文件\n* 套接字 (`s`)\
  \ – 提供进程网络服务的特殊文件\n* 特殊文件 (`c`) – 用于输出和输出的机制\n\n## 分区的艺术\n\nLinux 分区是从威胁到大多数 Linux\
  \ 用户开始的。这曾对系统造成过严重的损坏。此外，分区的一个主要首目的是实现更高的数据安全性。硬盘的划分允许分组和保护。由于成功的分区，你可以对数据组进行优先级排序。由于分区部分受损，其他部分将不受影响。\n\
  \nLinux 中的两个主要分区：\n1. `Swap` – 指额外的内存\n2. `Data` – 指普通数据\n\n建议的分区：\n* 用于必要数据的分区\n\
  * 用于程序和配置数据的分区\n* 用于用户邮件、存档和数据库表的分区\n* 用于特定文件的分区\n* 用于虚拟内存的分区\n\n常见分区：\n* 包含数据的分区\n\
  * 存储临时文件的分区\n* 存储第三方数据的分区\n* 专门用于程序的分区\n\n## 文件系统\n\n在 Linux 中，有一个被称为根目录的目录。它是主目录，程序员和系统管理员引用它，它是所有目录的目录。根目录下子目录。这些目录根据分配的任务管理文件。\n\
  \n子目录及其内容：\n* `/home` – 目录\n* `/boot` – 内核和启动文件；尝试消除不必要的引导程序的文件\n* `/initrd` – 关于启动的数据\n\
  * `/dev` – 包含所有 CPU 硬件的引用\n* `/bin` – 常用共享系统程序\n* `/etc` – 系统配置数据\n* `/lib` – 库文件\n\
  * `/lost+found` – 从失败中恢复的数据\n* `/opt` – 来自第三方来源的文件\n* `/net` – 远程文件系统的挂载点\n* `/misc`\
  \ – 杂项\n* `/proc` – 关于系统资源的信息\n* `/mnt` – 外部文件系统的挂载点\n\n## Inode 的作用\n\n在文件系统中，inode\
  \ 代表一个文件。inode 是一个包含重要信息的序列号类型。它的主要作用是定义分区中的数量。\n\ninode 包含的信息：\n* 文件类型\n* 文件大小\n\
  * 所有者或组所有者\n* 创建日期\n* 最后修改日期\n* 权限\n* 链接数\n* 数据地址\n\n\n\n\n\n在 Linux 文件系统中，关于基本文件大小和形状的信息被称为\
  \ `Superblock`（超级块）。它允许文件管理器浏览和维护文件系统的质量。\n\nSuperblock 中的信息：\n\n* 空闲数据块（Free blocks）——显示系统空闲块的数量\n\
  * 空闲 inode（Free inode）——显示原始 inode 分配\n* 空闲 inode（Free inodes）——显示系统空闲 inode 的数量\n\
  * 组编号（Block group number）——分配给超级块的编号\n* 每组块数（Blocks per group）——显示一组块的数量\n* 块大小（Block\
  \ size）——系统的块大小；信息以字节为显示\n* 魔数（Magic number）——授予挂载软件进行评估的权限\n* 挂载计数（Mount count）——系统对评估的允许次数\n\
  * 修订级别（Revision level）——系统对修订确认的允许级别\n\n### 什么是组描述符？\n\n`group descriptor`（组描述符）负责标记文件的数据结构。它包含了避免数据重复的细节。由于它的作用，系统损坏的可能性极低。\n\
  \n组描述符中的信息：\n\n* 块位图（Blocks bitmap）\n* 空闲块计数（Free blocks count）\n* 空闲 inode 计数（Free\
  \ inodes count）\n* inode 位图（Inode bitmap）\n* inode 表（Inode table）\n* 已用目录计数（Used\
  \ directory count）\n\n### 文件修改：查找、挂载与更改大小\n\nLinux 文件通常很容易定位。只需搜索目录，紧跟在 `/` 或正斜杠后面的名称可能就是你首选的文件。\n\
  \n然后你可以开始挂载。在挂载文件时，需要 Linux 内核的可用来检查标准。它的存在允许验证系统所有通过的参数。\n\n如示例所示，你正在挂载三种信息：`iso898`、`/dev/rom`\
  \ 和 `/dev/cdrom`。\n\n除了查找和挂载文件，你还可以更改文件的大小。这是由于文件的碎片产生。\n\n由于文件在碎片期间会变得无效，更改文件大小允许文件的分配。因此，系统变得更加稳定。\n\
  \n你将接触到 `truncate` 和 `fallocate` 命令。这两个命令都允许你创建一个指定大小的文件。\n\n### 进程\n\n尽管 Linux\
  \ 相当优秀，但偶尔也会遇到错误。系统管理员对此了如指掌。特别是如果他们根据偏好设计修改和管理程序，他们对意外故障就不再陌生了。\n\nLinux 系统的程序管理被称为进程（process）。\n\
  \n### 什么是进程？\n\n如所述，进程是 Linux 的程序管理。它指的是程序的运行实例。\n\n由于 Linux 能够处理多个任务，因此许多进程同时运行是常有的。除了当前运行的初始进程外，操作系统还设计为运行另一批进程进行常规管理。\n\
  \n### 进程的元素：\n\n* 标识符（Identifiers）\n    标识符为系统中的每个进程分配了数字。有时，它们被误认为是任务向量中的索引，但它们只是数字。它们的目的是让用户轻松识别特定进程。\n\
  * 进程间通信（Inter-process communication）\n    对 Linux 经典机制信号量（信号）、信号和管道（pipes）的支持被称为进程间通信。\n\
  * 链接（Links）\n    链接表示进程之间的依赖关系。除了初始进程外，Linux 系统中的每个进程都有父进程。\n* 调度信息（Scheduling information）\n\
  \    调度信息是指关于进程优先级公平决策的信息。\n* 状态（Stat）\n    状态是指进程执行的变化：\n    * 等待（Waiting）\n  \
  \  * 运行（Running）\n    * 僵尸（Zombie）\n    * 停止（Stopped）\n\n### 什么是信号？\n\n在 Linux 中，某些进程需要处理。处理进程的机制被称为信号（signals）。信号作为传递给进程的特殊消息。它们是异步的。一旦进程接收到信号，信号几乎立即被解释。对于运行中的进程，它们具有优先级。\n\
  \n它们是信号未指定行为时的实例。它们被分配值，这些值决定了响应。在给信号分配值时要小心，因为当递送另一个信号时，这些值可能会被损坏。\n\n值：\n* `SIG_IGN`\
  \ —— 表示应该忽略信号\n* `SIG_DFL` —— 定义默认处理\n* 信号指针（指向信号处理函数的指针）——接收一个参数，获取信号号并返回 void\n\
  \n### 进程的创建\n\n在 Linux 中，创建进程是可能的。内核是必要的，并被分配 `1` 作为进程标识符。它从选择一个旧进程开始，然后这个旧进程被克隆（clone）。\n\
  \n由于进程创建需要内核，克隆发生在内核模式下。它允许两个进程合并或使用资源，而不是让进程成为两个相似的副本。\n\n### 所有运行中的进程：如何查看它们？\n\
  \n在 Linux 中，所有运行的进程都是可见的。要做到这一点，请学习进程状态或 `ps` 命令。\n\n`ps` 命令显示所有运行进程的信息。它作为信息的重复更新。它提供了关于\
  \ PID（进程标识符）。PID 是自动分配的数字。查看运行进程，只需输入 `ps` 命令。\n\n`ps` 的选项：\n\n* `-A` 或 `-e` ——\
  \ 查看所有进程\n输入：\n```\n### ps -A\n```\n或\n```\n### ps -e\n```\n* `-u (用户名)` —— 查看特定用户的所有进程\n\
  输入（用户名 `mikal307`）：\n```\n### ps -u mikal307\n```\n* `top` —— 查看 top 程序\n输入：\n```\n\
  ### ps top\n```\n如输出所示，初始进程是 `pid`。下方是 `apache`，有一个有一个进程 `gnome`。`apache` 下方是 `tree`\
  \ 以及 `devkit`。`devkit` 拥有子进程 `sys` 和 `dev`。`dev` 下是进程 `run` 和 `eno`。然后，继续初始 `pid`\
  \ 进程的是 `ff` 和 `log`。\n\n### 杀死进程\n\n杀死进程是一个选项。你可以立即杀死任何进程以消除系统的巨大负荷。当你拒绝等待执行时就会这样做。\n\
  \n在操作系统之外，`kill` 命令是杀死运行进程的必要的。\n\n当使用非 Linux 操作系统时，注销或重启计算机是杀死进程的必要的。\n\n`kill`\
  \ 是向进程递送信号的 Linux 命令。它可以是内部的或外部的。如果命令没有递送信号，信号是替代方案。\n\n### Fork & Exec 函数的作用\n\n\
  `fork` 是用于描述复制进程的术语。它是父进程的副本。它的作用是模拟进程，但运行不同的程序。\n\n\n\n\n\n`exec` 是一个函数，它用其他程序替换进程中正在运行的程序。当进程调用\
  \ `exec` 时，当前程序会立即终止。在原始程序终止后，替换程序会被启动。只要 `exec` 没有遇到错误，替换的程序将继续运行。\n\n### 使用 exec\
  \ 时的注意事项：\n\n*   名称中包含“p”的函数（例如 `execlp` 和 `execvp`）设计用于在当前路径中接受并搜索其他程序。\n*   名称中包含“e”的函数（例如\
  \ `execle` 和 `execve`）设计用于接受额外的参数。\n*   名称中包含“v”的函数（例如 `execlv` 和 `execvp`）设计用于接受新程序的参数列表。\n\
  \n当一起使用时，`fork` 和 `exec` 可以支持一个长时间进程。首先，执行一个进程。然后，子程序继续运行。这意味着执行可以持续下去，而不是终止一个进程来替换一个新进程。\n\
  \n# 第 6 章 大多数 Linux 发行版的通用语法\n\n你接下来需要做的另一件事是选择你自己的 Linux 发行版。基本上，这些只是你可以选择的不同版本的\
  \ Linux。是的，在作为操作系统方面，它们都是相同的，但在美学和它们“工作”的方式上它们是不同的。\n\n基本上，有很多发行版供你选择，但还有一些是最受信任的，这些是：\n\
  \n### Ubuntu\n\n![Description: 00002.jpeg](img/00089.jpeg)\n\nUbuntu 可能是最流行的 Linux\
  \ 发行版之一，如果你是 Linux 新手或者以前尝试过，它无疑是最好的选择。Ubuntu 拥有非常易于安装的仓库，而且非常具有定制性——非常适合艺术和媒体从业者，或者那些对屏幕上显示的内容极其谨慎的人。Ubuntu\
  \ 的问题是，与其他发行版相比，它在移动设备上的运行并不理想——这可能是一个问题，特别是如果你是那种一直盯着手机的人类型。\n\n### Souls\n\n![Description:\
  \ 00003.jpeg](img/00090.jpeg)\n\nSouls 具有现代感，事实上，它是很新的，因为它只在 2012 年发布——那时 Ubuntu\
  \ 主要在学校和企业中使用。有人说 Souls 最棒的地方在于它的美学感觉，因为它确实有那种优雅、悦目的感。不过，有一点是目前还没有太多的“Soul 社区”，所以如果你在这个发行版上遇到问题，你可能需要自己寻找解决方案。\n\
  \n### Mint Cinnamon\n\n![Description: 00004.jpeg](img/00091.jpeg)\n\n这个名字听起来很清新，不是吗？嗯，Mint\
  \ Cinnamon 确实有那种清新轻盈的感觉，因为它美学上主要使用白色和灰色。它是一个非常极简的 Linux 发行版——非常适合不喜欢在屏幕上看到太多装饰和过度色彩的人。最棒的是它的仓库和\
  \ Ubuntu 相同，所以你在尝试理解它们时不会很困难，它的 UI 需求也较低——所以它对你的电脑以及对使用的你来说都不会负担太大。Mint Cinnamon\
  \ 对初学者来说也很棒，正如前面提到的，它没什么难理解的——你真的不需要为它为难。\n\n### Ubuntu Studio\n\n![Description:\
  \ 00005.jpeg](img/00092.jpeg)\n\n正如名称所示，这个变体适合音乐人、音频工作者以及那些需要多媒体创作的人。事实上，它自 2007\
  \ 年以来就被许多音乐人所使用。它最棒的地方是它的仓库和 Ubuntu 相同，所以你在尝试理解它们时不会很困难，它的 UI 需求也较低——所以它对你的电脑以及对使用的你来说都不会负担太大。\n\
  \n### Arch Linux\n\n![Description: 00006.jpeg](img/00093.jpeg)\n\nArch Linux 是那些想要从底层开始构建\
  \ Linux 的人的选择。它以“简单、快速、实用”（KISS）原则著称，但这里的“简单”是指对系统而言的，而不是对用户。它是一个滚动更新发行版，这意味着你总是获得最新的软件版本。对于\
  \ Linux 新手来说，它可能非常有挑战性，因为它要求你手动配置很多东西。\n\n### Debian\n\n![Description: 0007.jpeg](img/00094.jpeg)\n\
  \nDebian 是最老牌且稳定的 Linux 发行版之一。它以极其稳定和开源标准闻名，许多其他发行版（如 Ubuntu）都是基于 Debian 的。如果你需要一个极其可靠的系统，那么\
  \ Debian 是不错的选择。\n\n### Fedora\n\n![Description: 0008.jpeg](img/00095.jpeg)\n\n\
  Fedora 是由红帽社区支持的发行版。它通常处于许多新技术的前沿，如果你想尝试最新的 Linux 特性，Fedora 是一个非常好的选择。\n\n\n\n\n\
  \n`Nano` 是一个文本编辑器。它在几乎所有的 Linux 发行版中都预装了。新用户喜欢它主要是因为它的简单，与 `emacs` 和 `vi/vim` 等其他命令行文本编辑器相比，这种简单非常脱颖。它基本上包含了许多其他有用功能，如行号、语法高亮和方便搜索等。\n\
  \n让我们继续。\n\n我们将创建一个名为 `hello.sh` 的 shell 脚本。按照以下步骤操作：\n\n输入 `nano hello.sh` 并运行。\n\
  \n`Nano` 将打开并提供一个空白文件供你编辑。现在输入以下 shell 命令。\n\n```bash\necho 'hello world'\n```\n\
  \n在键盘上，按下 `ctrl+x` 退出编辑器。当询问你是否想保存文件时，按下 `yes (y)`。\n\n`Nano` 然后将确认你是否想保存文件。按下 `enter`\
  \ 确认该操作。\n\n现在使用以下命令运行脚本 `hello.sh`：\n\n```bash\nbash hello.sh\n```\n\n当你把它看作一个\
  \ gif 图时，这些步骤看起来[像这样](http://www.compciv.org/files/images/cli/cli-bash-script-hello-world.gif)。\n\
  \n[`bit.ly/2piclinux`](http://bit.ly/2piclinux)\n\n因此，`hello.sh` 并不特别有趣，但它至少捕捉到了你想要做的本质，即将一系列命令封装到一个文件中（即脚本），这样你就可以根据需要反复运行该脚本。这可以帮助你避免在重输命令时可能出现的拼写错误，并允许你在各种语境下复用该脚本。\n\
