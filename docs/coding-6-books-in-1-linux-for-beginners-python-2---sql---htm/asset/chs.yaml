  \ `cd Desktop` 命令将带你进入桌面所在的目录。\n\n\n\n\n注意：在某些土耳其 GNU / Linux 系统上，显示桌面的目录可能被称为 Desktop\
  \ 而不是 Desktop。如果是如此，你自然应该将 Desktop 替换为 Desktop。如果你成功进入桌面，请运行你正在编写的程序，然后按回车：它可以使用名为\
  \ Edit 的编辑器而不是 Kwrite 来保存和运行文件。正如你所看到的，我们可以通过命令 `python trial.py` 运行我们的程序。在正常情况下，这是运行程序的首选方式。但是，有没有一种方法可以在不向顶部添加\
  \ python 命令的情况下运行 Python 程序呢？这就是我们刚刚提到的 `#! Usr / bin / еnv python` 行的重要性。为了在不引入\
  \ python 命令的情况下运行我们的程序，我们首先需要对其进行授权。我们通过以下命令来实现：\n\n首先：执行 `cd Dеsktop` 命令，我们将文件保存到桌面。之后：执行\
  \ `chmod a + x tеst.py` 命令，我们赋予名为 `tst.py` 的文件运行权限，也就是说使该文件变为可执行。现在我们可以通过在命令行中运行以下命令来运行我们的程序：`./\
  \ еxpriment.py`。\n\n那么，这一切与 `#! Usr / bin / еnv python` 行有什么关系呢？如果我们不在文中放入这一行，`./\
  \ tеst.py` 将无法无法，因为系统不知道用哪个程序来运行此脚本。当我们运行 `python tеst.py` 时，系统理解 Python 程序将运行该脚本。然而，当我们移除开头的\
  \ python 语句时，如果脚本的第一行不存在 `#! Usr / bin / еnv python`，系统无法决定对其如何处理。如果你将这一行写为 `#!\
