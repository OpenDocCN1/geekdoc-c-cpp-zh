  \ 扩展名会告诉 IDLE 文件类型为 Python，从而包含颜色使程序更易读。\n\n一旦保存了程序，它将在 shell 窗口中执行。程序会要求你输入温度。输入值\
  \ 20 并按回车键（Enter）。程序的输出如下：\n\n![Image](img/00123.jpeg)\n\n让我们看看程序是如何运行的。第一行要求用户输入温度。`input`\
  \ 函数的作用是提示用户输入内容并存储用户输入的内容。引号内的部分是用户看到的内容。这被称为“字符串（string）”，它向程序用户显示的形式与代码本身中的完全相同。“eval”是一个函数，但在我们学习\
  \ Python 函数之前，你将不会理解它。所以现在，只需要知道它在我们想要获取数值输入时使用即可。\n\n你将学习的下一个程序是计算用户输入的两个数字的平均值的程序。\n\
  \n![Image](img/00124.jpeg)\n\nPython 语言有一项强大的特性，被称为“行缩进（line indentation）”。Python\
  \ 将此项特性应用于你很快就会学习的内容上。相反，其他地方的空格并不真正重要。例如，这些行的效果相同：\n\n![Image](img/00125.jpeg)\n\
  \n通常情况下，计算机将只根据你输入的命令运行，并且它们总是按照字面意思来解释内容。\n\n另一方面，Python 根据逗号和括号的位置进行操作，这样它就能知道各项含义。它并不是一个能预测你任何意图的优秀语言，因此你需要准确。起初，将所有逗号和括号放在正确的位置听起来可能令人沮丧，但一段时间后，它会变得自然。即使编程了很久，仍然会忘记某些东西。幸运的是，Python\
  \ 解释器会帮助显示你出错的地方。\n\n### 接收输入\n\n`input` 函数是程序通过程序接收用户信息的简单方法。例如：\n\n![Image](img/00126.jpeg)\n\
  \n标准语法：\n`变量名 = input(给用户的消息)`\n\n当你想要从用户处获取文本时使用此结构。但是，如果你想从用户处获取数字并用于计算，你必须额外操作。查看此示例：\n\
  \n![Image](img/00127.jpeg)\n\n`eval` 函数会将用户输入的文本转换为数字。它的一个非常棒的特性是你可以输入诸如 `2*4+9`\
  \ 这样的表达式，`eval` 将为你确定结果。\n\n**注意：** 当你运行程序时似乎没有任何反应，请按回车键（Enter）。有时这只是 IDLE 的一个故障，它经常获取输入。\n\
  \n### 打印\n\n考虑以下示例：\n\n`print('Hello')`\n\n`print` 函数的参数周围应该用括号括起来。任何引号内的内容将按照其出现的形式精确显示。在第一个程序中，它将打印\
  \ `4+2`，而第二个将打印 8。\n\n```\nprint('4+2')\nprint(4 + 4)\n```\n\n为了同时显示不同的内容，你需要使用逗号来分隔这些项。然而，Python\
  \ 会自动在项之间插入空格。例如：\n\n![Image](img/00128.jpeg)\n\n![Image](img/00129.jpeg)\n\n# 第\
  \ 3 章 Python 中使用的数据类型\n\n编程涉及处理不同类型的数据。Python 程序使用代表不同数据类型的对象。对象可以是内置的、程序员定义的，或者从库或模块导入的。\n\
  \nPython 提供了以下数据类型：\n- 数字 (numbers)\n- 字符串 (strings)\n- 布尔值 (boolean values)\n-\
  \ 列表 (lists)\n- 元组 (tuples)\n- 字典 (dictionaries)\n\n### 数字\n\nPython 3 中有 3 种数值数据类型：\n\
  - `int`\n- `float`\n- `complex`\n\n### 整数 (`int`)\n整数是不带小数点或小数部分的整数。这种数值类型在 Python\
  \ 3 中可以有无限的大小，并包括零、正数或负数。Python 支持普通整数、二进制、八进制和十六进制字面量。\n\n普通整数：\n示例：`0, 25, -50,\
  \ 56732164987123`\n\n二进制字面量（底数为 2）\n通过 `0b` 识别二进制字面量，后面跟大写或小写的 `b`。\n示例：\n```\n\
  >>> 0b1010\n10\n>>> bin_lit = 0b1010\n>>> print(bin_lit)\n10\n```\n\n八进制字面量（底数为\
  \ 8）\n通过 `0o` 识别八进制字面量，后面跟大写或小写的 `o`。\n示例：\n```\n>>> 0o24\n20\n>>> oct_lit = 0o24\n\
  >>> print(oct_lit)\n20\n```\n\n十六进制字面量（底数为 16）\n通过 `0x` 识别十六进制字面量，后面跟大写或小写的 `x`。\n\
  示例：\n```\n>>> 0xFF\n255\n>>> hex_lit = 0xFF\n>>> print(hex_lit)\n255\n```\n\n###\
  \ 整数（转换为字符串）\n使用 `oct()`、`bin()` 和 `hex()` 函数可以将整数转换为所需的字符串。\n例如，这里是如何将整数 50 转换为八进制、二进制和十六进制：\n\
  整数转八进制：`oct(50)`\n整数转二进制：`bin(50)`\n整数转十六进制：`hex(50)`\n\n### 浮点数 (Floats)\n浮点数带有小数点和小数部分的实数。\n\
  示例：`10.75, 98734.24, 1.0, 58`\n\n### 复数\n复数是实部和虚部的对。它的编写格式为 `a + bj`，其中 `a` 和 `b`\
  \ 是浮点数，`j` 代表 -1 的平方根，即虚数。\n例如：\n```\n>>> x = 4 + 5j\n>>> y = 2 - 2j\n>>> xy = x\
  \ + y\n>>> print(xy)\n(6+3j)\n```\n\n虽然 Python 可以直观地处理混合数字类型的转换，但语法可能需要显式转换。使用正确的关键字和参数将强制\
  \ Python 执行转换。\n\n- 整数转浮点数：`float(55)` -> `55.0`\n- 浮点数转整数：`int(95.5)` -> `95`\n\
  - 整数转复数：`complex(50)` -> `(50+0j)`\n- 浮点数转复数：`complex(20.5)` -> `(20.5+0j)`\n- 数字对表达式转复数：`complex(4,\
  \ 2)` -> `(4+2j)`\n\n字符串\n字符串是有序的 Unicode 字符序列，可以由字母、数字、特殊符号或这些类型的组合组成。字符串是一种不可变的数据类型，这意味着一旦通过赋值创建，你将无法再修改它。\n\
  \n字符串在赋值语句中定义，并用一对单引号或双引号括起来。\n\n\n\n\n\n```python\n>>> string_1 = 'A string is\
  \ immutablе.'\n>>> string_2 = \"A string is a sеquеncе.\"\n```\n\n如果用单引号包裹的字符串内部使用了单引号，你必须在单引号前面加上一个反斜杠来转义该单引号。\n\
  \n例如：\n\n```python\n>>> string_nеgativе = 'I don\\'t havе any idеa.'\n```\n\n当你打印\
  \ `string_nеgativе` 时，屏幕将显示：\n\n```python\n>>> print(string_nеgativе)\nI don't havе\
  \ any idеa.\n```\n\n同样，当整个字符串用双引号包裹时，你需要用反斜杠来转义字符串内部的双引号。\n\n例如：\n\n```python\n\
  >>> doublе_quotе = \"Shе rеmindеd еvеryonе: \\\"You arе supposеd to usе a backslash\
  \ to еscapе a doublе quotе insidе doublе quots.\\\"\"\n```\n\n这是你打印 `doublе_quotе`\
  \ 时的输出：\n\n```python\n>>> print(doublе_quotе)\nShе rеmindеd еvеryonе: \"You arе\
  \ supposеd to usе a backslash to еscapе a doublе quotе insidе doublе quots.\"\n\
  ```\n\n当你需要在字符串中使用反斜杠作为字符时，同样的原理也适用。\n\n# 访问字符串值\n\n可以使用方括号或索引运算符 `[]` 来访问字符串。初始字符或子字符串的索引为零，其余部分顺序编号。\n\
  \n为了说明字符串索引，首先通过赋值字符串“Programmer’s Handbook”定义变量 `nеw_string`。\n\n```python\n>>>\
  \ nеw_string = \"Programmеr's Handbook\"\n```\n\n访问 `nеw_string` 的第一个字符：\n\n```python\n\
  >>> nеw_string[0]\n'P'\n```\n\n访问 `nеw_string` 的第 7 个字符，在方括号内放入 6：\n\n```python\n\
  >>> nеw_string[6]\n'm'\n```\n\n访问索引为 12 的子字符串（一个空格）：\n\n```python\n>>> nеw_string[12]\n\
  ' '\n```\n\n要访问字符串中的最后一个字符，可以使用 `len()` 函数或负数索引。\n\n`len()` 函数用于确定字符串中有多少个字符。一旦你有了这些信息，只需减去\
  \ 1 即可得到字符串中最后一个字符的索引。\n\n语法为：`string[len(string)-1]`\n\n例如：\n\n```python\n>>> nеw_string[len(nеw_string)-1]\n\
  'k'\n```\n\n访问最后一个字符更简单的方法是使用负数索引，其中最后一个字符的索引为 -1，倒数第二个字符为 -2，依此类推。\n\n```python\n\
  >>> nеw_string[-1]\n'k'\n>>> nеw_string[-4]\n'b'\n```\n\n# 获取字符串的长度\n\n字符串的长度或大小指的是组成字符串的字符数。内置函数\
  \ `len()` 用于确定字符串的长度。\n\n例如：\n\n```python\n>>> string_a = 'Programming'\n>>> len(string_a)\n\
  11\n```\n\n### 字符串切片\n\n切片运算符 `[:]` 用于从给定字符串中创建子字符串。方括号内的冒号用于分隔两个索引。第一个数字表示将作为子字符串起始字符的索引。第二个数字表示从原始字符串中要丢弃的第一个字符。\n\
  \n例如，这是原始字符串：\n\n```python\n>>> string_1 = \"Philosophy\"\n```\n\n要显示新的子字符串 ‘sop’，在方括号内提供索引\
  \ 5 和 8：\n\n```python\n>>> string_1[5:8]\n'sop'\n```\n\n如果你想让子字符串从与原始字符串相同的字符开始，可以省略第一个索引。当你想让子字符串在与原始字符串相同的字符结束时，规则相同。例如：\n\
  \n```python\n>>> string_1[0:5]\n'Philo'\n>>> string_1[5:]\n'sophy'\n```\n\n注意，由于字符串是不可变的，对其进行的任何操作都不会更改存储在变量中的字符串。例如，如果你打印\
  \ `string_1`，Python 将显示原始值。\n\n```python\n>>> print(string_1)\nPhilosophy\n```\n\
  \n### 字符串拼接\n\n`+` 可以将多个字符串合并为一个字符串。示例：\n\n```python\n>>> string_1 = \"Stеphn King\"\
  \n>>> string_2 = \"author\"\n>>> string_3 = \"supеrnatural fiction\"\n>>> string_4\
  \ = \"fantasy\"\n>>> string_1 + \" is an \" + string_2 + \" of \" + string_3 + \"\
  \ and \" + string_4.\n'Stеphn King is an author of supеrnatural fiction and fantasy.'\n\
  \n### 重复字符串\n\n可以使用运算符 `*` 和数字来重复字符串或拼接字符串。例如，将字符串 `string` 重复 3 次：\n\n```python\n\
  >>> \"string\" *3\n'stringstringstring'\n```\n\n可以在变量中存储相同的字符串并应用运算符 `*`：\n\n```python\n\
  >>> my_string = \"string\"\n>>> my_string *3\n'stringstringstring'\n```\n\n### upper()\
  \ 和 lower() 函数\n\n`upper()` 和 `lower()` 函数用于显示大写或小写的字符串。例如，通过赋值字符串 `animal`：\n\n\
  ```python\n>>> animal = \"elephant\"\n```\n\n显示全大写字符串：\n\n```python\n>>> print(animal.upper())\n\
  ELEPHANT\n```\n\n如果你想显示全小写字符串：\n\n```python\n>>> print(animal.lower())\nelephant\n\
  ```\n\n`upper()` 和 `lower()` 函数的使用不会更改存储在变量 `animal` 中的值。可以通过打印变量来证明：\n\n```python\n\
  >>> print(animal)\nelephant\n```\n\n### str() 函数\n\n在某些情况下，你可能需要将整数或浮点数等非字符打印为字符串。Python\
  \ 提供了 `str()` 函数允许将非字符转换为字符串。例如，假设变量 `my_num` 为整数 85，当你需要打印它时可以使用该变量作为参数。\n\n因此，为了打印字符串\
  \ `My employee number is 85.`，你可以输入以下语句：\n\n```python\n>>> print(\"My employee number\
  \ is \" + str(my_num)+ \".\")\n```\n\n输出将是：\n\nMy employee number is 85.\n\n再次，使用\
  \ `str()` 函数将整数转换为字符串不会影响变量 `my_num` 的值。可以通过对变量使用 `type()` 函数来证明：\n\n```python\n\
  >>> type(my_num)\n<class 'int'>\n\n### 列表\n\n列表是一种可变序列类型。它是 Python 中最常用的数据类型之一。作为一个灵活的容器，它可以包含任何类型的数据或项目，这些项目可能相同也可以不相同。它还可以存储任意数量的数据。\n\
  \n要创建一个列表，可以将方括号内的值赋值给变量。\n\n创建一个空列表：\n\n```python\nitem_list = []\n```\n\n创建一个列表，你将使用以下语法：\n\
  \n```python\nmy_list = [item1, item2, item3, item4]\n```\n\n# 访问列表项\n\n列表的索引方式与字符串类似，都从零开始。例如，如果你想访问\
  \ `list_1` 的第一个项：\n\n```python\n>>> print(list_1[0])\napple\n```\n\n访问 `list_1`\
  \ 的第三项：\n\n```python\n>>> print(list_1[2])\norange\n```\n\n要打印列表的最后一项，可以使用负数索引：\n\
  \n```python\n>>> print(list_1[-1])\nelephant\n```\n\n### 在列表使用 len() 函数\n\n`len()`\
  \ 函数用于获取列表的项目数量：\n\n```python\n>>> len(list_1)\n```\n\n# 从列表中移除项\n\n`remove()` 函数用于从列表中删除指定的元素。\n\
  \n语法：`my_list.remove(value)`\n\n为了，创建一个包含以下元素的列表 `my_list`：\n\n```python\nmy_list\
  \ = ['cat', 'dog', 'monkey', 1, 8, 10, 15, 24.5, 1.75]\n```\n\n假设你想移除值 'horse' 以及整数\
  \ 1 和 10，你可以这样使用 `remove()` 方法：\n\n```python\n>>> my_list.remove('horse')\n>>> my_list.remove(1)\n\
  >>> my_list.remove(10)\n```\n\n查看 my_list 中剩余的值：\n\n```python\n>>> print(my_list)\n\
  ['cat', 'dog', 'monkey', 8, 15, 24.5, 1.75]\n```\n\n\n\n\n参考上述示例，你可以通过以下方式向 `my_list`\
  \ 中添加字符串 ‘python’：\n\n```python\n>>> my_list.append('python')\n```\n\n查看更新后的 `my_list`：\n\
  \n```python\n>>> my_list\n['cat', 'dog', 'monkey', 8, 15, 24.5, 1.75, 'python']\n\
  ```\n\n字符串 ‘python’ 被添加在了列表的末尾。假设你想在字符串 ‘dog’ 和 ‘monkey’ 之间添加一个新字符串 ‘elephant’，你需要使用\
  \ `insert()` 方法。\n\n语法为：`list.insert(index, object)`\n\n在 'dog' 和 'monkey' 之间插入\
  \ ‘python’：\n\n```python\n>>> my_list.insert(2, \"elephant\")\n>>> my_list\n['cat',\
  \ 'dog', 'elephant', 'monkey', 8, 15, 24.5, 1.75, 'python']\n```\n\n### 排序列表中的项\n\
  \n`sort()` 方法用于排列或排序列表中具有相似数据类型的项目。语法为：`list.sort()`。\n\n例如，创建一个名为 `num_list` 的列表并包含数值：\n\
  \n```python\n>>> num_list = [2, 10, 5, 3, 19, 4.5, 7.25, -2, 0]\n```\n\n要按升序排序 `num_list`\
  \ 中的元素，你可以输入表达式：\n\n```python\n>>> num_list.sort()\n```\n\n现在，查看 `num_list` 的内容：\n\
  \n```python\n>>> num_list\n[-2, 0, 2, 3, 4.5, 5, 7.25, 10, 19]\n```\n\n`num_list`\
  \ 的元素现在按升序排列。你可以使用 `reverse()` 方法按反序排列项目。其语法为：\n\n`list.reverse()`\n\n因此，要将 `num_list`\
  \ 按降序排列：\n\n```python\n>>> num_list.reverse()\n>>> num_list\n[19, 10, 7.25, 5, 4.5,\
  \ 3, 2, 0, -2]\n```\n\n### 元组 (Tuples)\n\n元组和列表一样，是一种序列类型，包含一个有序的项集合。与列表不同，元组是不可变的。\n\
  \n元组的元素被包含在括号中。然而，括号是可选的，你可以在没有括号的情况下元组。元组可以包含不同类型的项。像列表一样，元组也可以存储任意数量的项。\n\n###\
  \ 创建元组\n\n创建元组就像将一组项分配给变量一样简单。\n\n示例：\n\n`mytuple_1 = (1, 3, 5, 7, 9, 11, 13)` 数值\n\
  `mytuple_3 = (\"ruby\", \"gold\", \"diamond\")` 字符串\n`mytuple_2 = (\"Python\", 2.50,\
  \ 7)` 混合类型\n\nPython 同样允许创建嵌套元组：\n\n`mytuple_4 = (\"collection\", (10, 20, 30),\
  \ [2, 4, 6])`\n\n可以创建一个包含单个项的元组，前提是在项后面放置一个尾逗号，以指示它是一个元组而不是字符串。\n\n`mytuple_5 =\
  \ (\"members\",)`\n\n也可以创建一个空元组：\n\n`empty_tuple = ()`\n\n这里是一个没有括号的元组示例。\n\n`my_tuple\
  \ = 7, 14, 21`\n\n### 访问元组元素\n\n有多种方法访问存储在元组中的项。\n\n* **索引 (Indexing)**：索引运算符 `[]`\
  \ 用于指定你想要访问的项对应的索引。像其他有序数据类型一样，索引从零开始。例如，创建一个以字符串作为对象的 `tuple_new`：\n  `tuple_new\
  \ = ('m', 'u', 'i', 'a', 'l')`\n  `tuple_new[0]` 获取第一个项 'm'\n  `tuple_new[3]` 获取第四个项\
  \ 'a'\n  `tuple_new[-1]` 获取最后一个项 'l'\n\n* **切片 (Slicing)**：切片运算符用于访问元组中范围内的项。例如：\n\
  \  `tuple_new[1:4]` 获取索引 1 到 3 的项：('u', 'i', 'a')\n  `tuple_new[:3]` 获取从开始到索引 2\
  \ 的项：('m', 'u', 'i')\n  `tuple_new[3:]` 获取从索引 3 到结束的项：('a', 'l')\n\n\n\n\n然而，数据分析的过程并没有被妥善地记录。虽然有很多关于统计学的书籍，但没有哪书试图解决如何创建一个真实世界中的数据分析解决方案。框架的使用可以加速开发，因此，开发变得更快、更快捷、更高效。大多数\
  \ Web 框架的成本很低。框架具有强大的安全实现能力。使用框架最大的好处实际上源于其背后的社区。\n\n另一方面，设计一个重要的框架涉及到使用抽象语言对数据分析元素进行分类。在某些情况下，这种语言可能是数学。相反，分析中相同的细节使得每项分析都变得复杂而有趣。\n\
  \n# 分析循环\n\n你可能会观察数据分析并认为它遵循一个线性的、一步步进行的过程，并有良好的结果。然而，数据分析是一种迭代且非线性的方法，由一系列本周期表示。在这种方法中，每一步都会学习到信息，然后决定是重新执行并改进已经执行的下一步，还是进入下一个步骤。\n\
  \n当涉及到分析数据时，迭代过程用于数据分析的所有步骤中。此外，由于封装在不同软件中的算法，某些数据分析可能看起来固定且线性的。\n\n因此，理解“数据分析”这一术语的含义非常重要。虽然数据研究涉及创建和实施数据收集计划，但数据分析假设数据已经收集完毕。最重要的是，一项研究将涉及假设的创建、数据收集程序的设计、数据的收集以及对数据的解释。然而，由于数据分析假设数据应该已经收集完毕，它涉及到问题的开发和完善，以及分析和解释数据的过程。\n\
  \n## 数据分析有五项主要活动：\n\n1. 陈述并完善问题\n2. 探索数据\n3. 创建正式的统计模型\n4. 解释结果\n5. 传播结果\n\n以上所有活动发生在不同的场合。例如，你可能在一天内完成所有活动，但在超过一个月的时间内详细处理每项活动。所以，让我们看看应用于这些活动中的整体框架。\n\
  \n虽然在执行数据分析时可以参与许多不同类型的活动，但整个过程的每个方面都可以通过交互过程完成。最重要的是，对于上述五项活动中的每一个，建议包含以下步骤：\n\n\
  1. 定义或设定预期\n2. 收集信息并将数据与你的预期进行比较\n3. 如果数据不符合你的预期，则修改或修复数据，使你的预期和数据相匹配\n\n完成上述所有三个步骤被称为数据分析循环。当你穿过分析的每个阶段时，你将被要求通过本周期不断地修正你的问题、正式模型、解释和传播。对这些主要活动的重复循环构成了数据分析最大的部分。\n\
  \n### 定义预期\n\n在这一步中，你在执行任何操作（如执行程序、检查数据或输入命令）之前，会有意地设定你的预期。对于经验丰富的数据分析师来说，创建预期可能是自动或无意识的过程。尽管如此，思考它仍然非常重要。例如，如果你要和朋友去购物，你必须停在\
  \ ATM 取一些钱，你需要决定想要提取的金额。你对将要买的东西的价格有一些预期。如果你知道将要购买的产品价格，这可能不是你的问题。这就是先验知识的例子。另一个先验知识的例子是知道特定餐厅的营业时间。利用这些信息，你可以安排你的时间和活动，以便在关闭前赶上晚餐。你还可以从朋友那里获得额外信息来帮助你形成预期，或者\
  \ Google 搜索餐厅以了解更多关于他们的工作时间。这种在应用先验信息预期实施分析的方法，与该过程中的每项主要活动是相同的。\n\n### 信息收集\n\n\
  这一步要求人们收集与问题或数据相关的信息。对于问题，通过文献研究或向专家请教来收集信息。对于数据，一旦你对检查数据时可能得到的结果制定了预期，就可以继续进行操作。这项活动的结果包括你需要收集的数据，以及确定收集的数据是否符合你的预期。\n\
  \n### 预期的比较\n\n一旦你拿到了数据，下一步就是将你的预期与数据进行比较。在这里，有两种可能的结果：\n\n1. 你的成本估算与账单上的金额匹配\n\
  2. 你的成本估算不匹配\n\n如果成本估算和金额匹配，你就可以进入下一个活动。或者，如果你的预期成本是 60 美元，但账单是 30 美元，那么你的预期和数据就是不同的。在这种情况下，差异有两个可能的原因：首先，你可能预期错误，需要修正；其次，账单可能是错误的并包含错误。可以暗示你数据分析状态的一个关键指标，是将你收集的数据与原始预期匹配的难易程度。\n\
  \n### 体量、速度和多样性\n\n大数据有各种“V”。主要的包括速度、多样性和体量。大数据超过了普通数据库的存储容量。生成的数据规模是巨大的。截至今天，产生了海量的数据。产生这一现象的原因是交互的增加。除了数据交易外，交互是一种新现象。数据交互来自浏览器活动、个人数字记录仪和地理位置。\n\
  \n随着“物联网”的到来，产生了海量数据，人类花费整个时间试图分析它们。\n\n优秀的数据科学家应该知道如何控制体量。他或她应该知道如何创建能够智能利用数据大小的算法。当你拥有巨大数据时，事物有了新的方向，因为每个相似性都变得重要，人们很容易得出错误的结论。在大多数业务应用中，提取相关性就足够了。然而，正确的数据科学使用了基于这些相关性确定原因的技术。\n\
  \n数据速度将不断加速。许多用户以更高的速度生成 Facebook 帖子、推文和财务信息。速度增加了数据的体量并缩短了数据保留的时间。例如，高频交易活动依赖数据流和快速信息。但数据的真实性会迅速下降。\n\
  \n## 机器学习\n\n\n\n\n机器学习指的是系统如何从其处理的各种类型的数据中学习。可以根据特定数据训练系统以做出决策。训练过程持续进行，以便系统能够进行更新并增强决策能力。使用垃圾邮件过滤器的系统是演示机器学习应用的极佳示例。这些系统使用贝叶斯过滤器来改变决策。\n\
  \n因此，它将继续走在垃圾邮件发送者面前。动态学习的能力非常重要，因为有助于防止垃圾邮件发送者利用过滤器。信用卡审批使用神经网络，是机器学习技术的一个极佳示例。此外，与判断相比，机器学习更青睐于数据。因此，一个优秀的数据科学家应该同时具备这两种能力。机器学习帮助找到了人们感兴趣的问题答案，并进一步证明自己是一个游戏规则的改变者。让机器学习非常有趣的地方在于机器智能的四个特征：\n\
  \n1. 它建立在强大的理论突破基础之上\n2. 它重新定义了当前的经济范式\n3. 最终结果是商品化\n4. 它从数据科学中挖掘新数据\n\n## 监督学习与无监督学习\n\
  \n系统学习主要有两种广义的方式：监督学习和无监督学习。\n\n监督学习是指系统根据输入的数据类型来做出决策。自动化信用卡审批和垃圾邮件过滤器应用监督学习来实现其功能。系统被提供了输出和输入的历史数据样本。基于这类数据，系统利用机器学习技术建立两者之间的关系。你需要使用自己的判断力来选择处理任务的最佳技术。\n\
  \n无监督学习发生在你只有输入数据（`X`）而没有相应输出变量的情况下。无监督学习的目标是建立数据底层结构的模型，以便你了解更多数据信息。它之所以被称为无监督学习，是因为没有正确答案和老师。算法被留用来决定并发现数据中有趣的结构。\n\
  \n聚类分析是无监督学习的一个示例。聚类分析选择一组具有不同属性的实体，并根据属性实体之间的远近程度划分实体空间。这将通过使用额外标签标记数据对数据进行重新排列和重新定义。因子分析是无监督学习技术的一部分。\n\
  \n## 预测与预报\n\n数据科学涉及预测和预测。然而，两者之间存在区别。预测侧重于突出单一结果。如果一个人说“明天会很冷”，他或她做出了一个预测。但如果他们说“明天天冷的概率是\
  \ 40%”，他们就是做了一个预报。这是因为预报是以概率的形式提供结果。\n\n# 第 5 章 Python 中的面向对象编程\n\n面向对象编程（`OOP`）是一种模型，程序围绕对象或数据组织，而不使用函数和逻辑。一个对象有其独特的行为和属性。在面向对象编程中，传统的编程方法被反对了，而重点在于逻辑是如何编写的，而不是在逻辑内部定义数据。对象的示例从人类等物理实体到小型程序不等。\n\
  \n程序员专注于第一步，即数据建模，在建模过程中，识别出所有需要操作的对象，并确定对象之间的相互关系。使用框架可以加速开发，因此开发变得更快、更快捷、更高效。大多数框架都可以低廉的价格获得。框架具有强大的实现。使用框架的最大益处实际上归于其背后的社区。在\
  \ OOP 中，开发者关注对象操作，而不是操作它们所需的逻辑。这种方法非常适合编程，特别是对于那些复杂、规模更大且活跃维护的程序。使用框架可以加速开发，因此开发变得更快、更快捷、更高效。大多数框架都可以低廉的价格获得。框架具有强大的实现。使用框架的最大益处实际上归于社区。\n\
  \n开源组织也支持面向对象编程，允许程序员为此类项目成果贡献，从而实现协作开发。此外，面向对象编程的额外益处包括代码的可扩展性、可重用性和效率。\n\n###\
  \ 面向对象编程的原则\n\n面向对象编程涉及许多原则。在此处讨论了其中一些：\n\n* 封装\n* 继承\n* 抽象\n* 多态\n\n### 封装\n\n\
  每个对象的状态和实现都存储在定义的类内部，但是是私有的。其他对象只能通过调用公共函数列表来访问此类。否则，对象无法访问此类或拥有进行更改的权限。这种数据隐藏的编程特性避免了无意的数据损坏，并提供了更高的程序安全性。\n\
  \n### 继承\n\n面向对象编程（`OOP`）确保了更高水平的准确性并减少了开发时间。面向对象编程的另一个属性导致了更彻底的数据分析。对象之间建立了父子类关系，可以分配并允许开发者在维护独特层次结构的同时重用通用逻辑。这一属性带来了更彻底的数据分析、高准确性和节约时间。\n\
  \n### 抽象\n\n对象仅揭示内部机制。这对于其他对象的使用很有帮助且相关。由于此，开发者建立的概念可以支持随着时间的推移更容易地进行更多添加或做出更改。\n\
  \n### 多态\n\n根据上下文，允许对象呈现超过一种形式。由程序来决定对象每次执行时的含义和用法，减少了对重复代码的需求。\n\n### 对面向对象编程的批评\n\
  \n开发者出于多个原因对面向对象编程表示批评。面向对象编程的一个主要担忧是它不关注计算或算法。面向对象编程的代码可能编写起来更复杂，编译时间更长。但开发者也为这些复杂性找到了替代方案。替代方案包括：\n\
  \n* 函数式编程\n* 令式编程\n* 结构化编程\n\n然而，只有最先进的编程语言允许开发者获得组合它们的选项。\n\n## 作为面向对象编程语言的 Python\n\
  \nPython 语言被广泛作为面向对象编程用于 Web 应用开发。根据调查，90% 的程序员倾向于使用 Python 语言而非其他语言，原因有很多。它的简单性、可读性和易于接口交互是其受青睐的主要原因。\n\
  \n\n\n使用 Python 语言进行应用开发也需要一些框架，借助这些框架，开发者可以更轻松地开发。最常用的框架包括 `Django`、`CherryPy`、`Pyramid`、`Flask`、`Qt`、`PyGUI`\
  \ 和 `Kivy` 等。这些框架的使用取决于项目的性质和需求。这些 Python 框架可以帮助以最少的精时间和精力构建复杂的应用程序。\n\nPython 是许多软件开发过程中一种流行的脚本语言。此外，Python\
  \ 可以以一种经济高效的方式将不同的系统集成在一起。\n\n## 类与对象\n\n现在我们已经掌握了 Python 代码的一些基础知识，是时候进入我们的第一个主题了：与类和对象一起工作。这两个主题非常重要，因为它们将确保你代码中的所有内容都处于正确的位置。你的对象是帮助定义代码某些部分的组件，以便代码组织良好且易于理解。所有对象都有某些共同点，它们会被放置在同一个类中，帮助你的代码按照预期的方式运行。\n\
  \n在处理对象时，有很多内容需要理解，但最重要的一点是每当你将某些对象放在同一个类中，它们应该具有某些共同点。你可以把任何东西放在同一个类中，但最好的方法是将相似的对象放在同一个类中。这会为整个过程增添一些秩序。把这个过程想象成整理衣柜。你必须确保你的衣柜是有序的：将鞋子放在一个区域，将衣服挂在另一个区域，将包放在一起，然后为所有散乱的额外物品留一个地方。通过这个过程，你可以确保一切看起来都很漂亮，而且以后更容易找到。\n\
  \n在处理类时，原理是相同的。你希望将相似的对象放在同一个类中，以便以后更容易找到它们。当这些对象相似时，程序的运行效率会更高，而不是将互不相关的对象随机地放在同一个类中。为了更易理解，你应该将对象看作是你正在编写的代码的不同方面和部分，而类就像是用来用来存储这些对象的容器。你可以轻松地根据任何你想要创建一个类，然后将匹配的相似对象添加到该类中。你可以为该类选择任何你喜欢的标签，只需确保该标签对于你想要放入类中的对象类型来说是有意义的即可。当有人查看这个类时，他们应该很好地了解你里面放了什么，而且所有的对象也应该符合那个标签。\n\
  \n如果这对你来说是一个新概念，而且你刚刚开始学习一种新的编程语言，那么对象和类是一个很好的起点，因为它们在帮助你学习更多知识的同时，还能确保你所工作的代码中一切保持井然。你的任务是学习如何创建这些类，然后将对象放入其中，以便代码以正确的方式运行。让我们看看在\
  \ Python 中这是如何工作的。\n\n## 如何创建一个新类\n\n现在我们已经对这些对象和类有了初步介绍，是时候让你学习如何创建自己的类的步骤了。你必须这样做，因为你会发现如果不这样做，在\
  \ Python 中开始任何事情都是困难的。一旦你准备好创建这些类所需的语句，就应该创建一个新定义。你需要首先放置正确的关键字来获取它，然后紧接着加上类名（你它起的名字）。之后将跟着一个放在括号中的父类。另一个你应该考虑的点是，在第一行的末尾你需要添加一个冒号。虽然没有冒号你的代码也可以运行，但这被认为是一种礼节，所以你必须确保它的存在。\n\
  \n### genericVehicle.Display()\n\n在我们继续之前，请花时间打开你的编辑器并编写这段代码，以免忘记。在编写过程中，你应该会注意到这段代码中出现了一些我们之前讨论过的几个基础知识。你还将看到对象的定义、方法的定义、析构函数、你需要的不同属性以及一些普通函数。由于这是我们的第一个代码，让我们稍微拆解一下，以便你能够理解并更好地如何用这种语言进行编写。\n\
  \n### 类定义\n\n你需要在这里编写对象实例化和类定义，以确保在放入代码时语法是正确的。这些部分非常重要，因为它们是代码中告诉编译器应该做什么以及哪些命令是重要的部分。如果你想在代码中调用新类定义，只需使用\
  \ `object.attribute` 或 `object.method()` 函数，它就能完美地工作。\n\n### 特殊属性\n\n在上面的代码中，你可以关注的下一个点是你希望代码为你识别的特殊属性。这些特殊属性让你感到放心，因为你可以知道该属性何时会被看到，并确保它以正确的方式使用，以防止代码变得混乱。Python\
  \ 中有很多很好的属性可以使用，但对于初学者来说的一些包括：\n\n- `__bases__`：这被认为是一个包含任何父类的元组（tuple）\n- `__module__`：这是你找到模块名称的地方，它也会包含你的类\n\
  - `__name__`：这将保存类名\n- `__doc__`：这是你找到类内部文档字符串引用的地方\n- `__dict__`：这将是类内部字典的变量\n\n\
  #### 如何访问类成员\n\n现在我们需要查看如何访问类的成员。为了确保你的文本编辑器和编译器能够识别类并执行你想要的部分，你必须确保该代码配置正确以访问该类的所有成员。你会高兴地发现有几种方法可以实现这一点，所有的方法效果都很好，但访问器方法是通流行且最高效的方法。\n\
  \n\n\n在 Python 语言中进行并发处理时（特别是用 C 语言编写的 Python 引用实现 CPython），关键在于 `GIL`。`GIL` 机制是一种保护\
  \ Python 对象访问的死锁机制，防止在多个线程同时执行 Python 字节码。CPython 使用引用计数来实现内存管理。这导致了多个线程可以同时访问并执行\
  \ Python 代码的情况；而这种情况是不可接受的，并且可能导致错误的数据处理，我们称这种内存管理方式不是面向多线程管理的。为了解决这个问题，引入了 `GIL`，正如其名称所示，这是一个特定的锁，只允许一个线程访问代码和\
  \ Python 对象。然而，这也意味着为了在 CPython 中实现多线程程序，开发者必须意识到 `GIL` 的存在并绕过它。这正是许多人在 Python 中实现多进程系统时会遇到问题的原因。\n\
  \n## 为什么选择 Python\n\nPython 提供的海量开发工具促使越来越多的开发者开始使用 Python 编程，这使得 Python 更加流行和易于使用；我称之为\
  \ Python 的**恶性循环**。DataCamp 的研究主管 David Robinson 写了一篇关于 Python 惊人增长的博客文章，并称其最流行的编程语言。\n\
  \n然而，Python 是慢的，至少比其他流行的编程语言慢。这是因为 Python 是一种动态类型语言，其解释时的值并非存储在紧凑的缓冲区中，而是存储在分散的对象中。这是\
  \ Python 可读性和易用性的直接结果。遗憾的是，有多种方法可以让你的 Python 程序运行得更快，其中并发是最困难的之一；而这正是我们将在书中掌握的内容。\n\
  \n## 定制你的 Python 环境\n\n在继续之前，让我们先回顾一些关于如何配置书中将使用的必要工具的描述。包括获取适用于你系统的 Python 分发版和合适的开发环境，以及如何下载书中所有章节示例所需的代码。\n\
  \n## 通用安装\n\n让我们来看获取系统特定 Python 分发版及相应开发环境的过程：\n\n所有开发者都可以从 `https://www.python.org/downloads/`\
  \ 获取自己的 Python 分发版。\n\n尽管 Python 2 和 Python 3 两个版本都受到了支持和维护，但在本书中我们将使用 Python 3。\n\
  \n对于这本书来说，一个灵活的选择是 IDE（集成开发环境）。虽然可以使用 Notepad 或 TextEdit 等极简文本编辑器开发 Python 应用程序，但使用专门为\
  \ Python 开发的 IDE 来读和写代码通常要容易得多。它们包括：`IDLE`、`PyCharm`、`Sublime Text` 和 `Atom`。\n\n\
  现在你已经学习了并发和并行编程的基础。这一切都涉及到命令和指令的设计与结构化编程，以便程序的不同部分能够以某种有效的方式执行，同时共享相同的资源。由于某些命令和指令是同时执行的，节省了时间与传统的顺序编程相比，并行编程显著提升了程序的执行效率。\n\
  \n然而，在设计并行程序时，应该考虑各种因素。虽然某些任务可以很容易地分为可以并行执行的独立部分（惊人的并行任务），但另一些任务需要命令之间不同类型的协调，以便正确且高效地应用共享资源。还有一些任务具有内在的顺序处理特性，这些任务可以通过并发处理和并行来实现加速。\n\
  \n最近，发生了一种范式转变，促进了现有编程中大多数方面并发处理的实现。协作处理仍在增长，并预计在未来将继续增长。因此，对于任何经验丰富的程序员来说，理解并发处理及相关概念，以及如何将这些概念集成到应用程序中是至关重要的。\n\
  \n另一方面，Python 是最流行（如果不是的话）的编程语言之一。它在大多数编程领域都提供了选择。以这种方式将协作处理与 Python 结合，是学习和掌握最重要的主题之一。\n\
  \n## 语言语义\n\n因此，健壮的编程语言 Python 被认为具有高度的可读性。它的特征和视觉布局使其频繁和反复使用英语单词。相反，其他编程语言使用的不是单词而是标点符号。与\
  \ C 语言相比，它的语法异常较少。\n\n## Python 在行业中的用途\n\nPython 是一种流行的编程语言，特别是在 Web 开发领域。尽管主要在后端使用，但它与数据库的良好集成、良好的响应时间以及许多优秀的网络标准是它在行业中闻名的原因。著名问答平台之一的\
  \ Quora 使用大量的 Python 代码。\n\nPython 被用于编写大型应用程序。像 Google、NASA 和 YouTube 这样的网站广泛使用\
  \ Python，特别是在其智能手机应用中。此外，美国的在线交易系统纽约证券交易所（NYSE）。Python 的其他使用方法和模式还有：\n\n*   制作 RSS\
  \ 阅读器\n*   `MySQL`\n*   在 HTML 中创建日历\n*   文件操作\n*   在线应用程序、CGI 编程\n\n此外，它还是一个被软件开发者广泛用于测试、检查构建控制以及管理的著名工具。此外，对于任务集成，Python\
  \ 是公司使用的语言。我们可以以 3D 软件 Maya 为例，它利用 Python 进行复杂的集成以及小型用户任务的自动化。\n\n## Python 的应用\n\
  \n像 Python 这样的语言并不总是用于渲染一个独特的产品，但当然，它被用于驱动创建此类产品的工具。例如，看看使用智能内部系统的公司。它们不需要编译型语言。\n\
  \n\n\n\n此外，这种语言在开发软件和游戏的公司、语言开发、Web 框架等许多领域得到了广泛的应用。这使得 Python 相比于其他编程语言具有优势，这也是它在行业中成功的原因。让我们深入探讨\
  \ Python 在行业中的一些优势。\n\n* 提供对大型标准库的支持，这些库配备了许多操作，如 Web 服务工具、互联网、协议和操作系统接口。\n* 它也被用于集成企业应用集成（EAI），这使得通过调用如\
  \ CORBA 或 COM 组件来开发 Web 服务变得可能可行且便利。它的控制能力非常强大，可以直接通过 `C++`、`C` 以及通过 Jython 上的 `Javascript`\
  \ 进行调用。\n* 它仍然可以处理 XML 和其他语言，因为可以使用相同的字节码在现代操作系统上轻松地运行和操作。\n* 它具有提高编程生产力的能力。清晰且面向对象的设计在利用类似\
  \ Perl、Java、C 和 `C++` 等语言的同时，将程序的生产力提高了两倍到十倍。\n* 集成功能非常强大，其单元测试和增强的控制能力提高了大多数使用\
  \ Python 应用的效率，而重要的一点是可扩展性，这使得该语言成为协议网络应用的绝佳选择。\n* 在当今时代，大数据对于大公司变得极其重要，特别是对于业务而言。因此，在涉及数据处理时，数据科学家倾向于使用\
  \ Python 作为操作工具。这是 Python 成为大数据领域最佳编程语言（PL）的唯一原因。\n* 所以对于构建分析工具，数据科学家发现 Python 是最合适的。此外，由于在当今时代数据是赚钱的来源，Python\
  \ 的使用不容忽视，并应该被纳入你的执行计划中。\n* 它在机器学习领域尤其受青睐，而这是目前全球领先的业务之一。先进的机器学习可以进一步用于业务中的大量任务。\n\
  * 最后，我们应该谈谈网络安全，这在当今世界的数字时代非常重要，因为我们的货币交换已经数字化，拥有强大的网络安全来防御黑客尝试是非常重要的。根据 Python\
  \ 网络安全性能的调查，它是目前行业中的明显赢家。\n\n除了上述所有内容外，该语言的另一个大特性是 Python 是完全免费的，你不需要为它支付一分钱。此外，这意味着扩展的支持模块、工具和库集都是免费的。它的许多集成开发环境都是免费的，如\
  \ `Eclipse`、`PyDev`、`PTVS` 和 `Spyder Python` 等。\n\n所以这些是让 Python 成为企业和行业最佳选择的原因。我认为，如果没有\
  \ Python，这些科技巨头在影响力和当然还有金钱实力方面将不会如此强大。它将在未来几天内引发下一次物联网（IoT）热，最重要的是在机器学习领域。\n\nPython\
  \ 编码语言是你在编程时可以选择的最佳选项之一，特别是当你想要从事机器学习时。Python 是一门非常简单学习的语言，由于它的简单性，通常是初学者学习的第一门语言。但不要被它骗了。简单并不意味着它不具备你所寻找的力量和强度。\n\
  \n在从 `python.com` 安装 Python 程序后，你想做的第一件事就是下载合适的 IDE。这是一个使用 Python 的绝佳环境，将为你提供所需的所有帮助。它还包含了安装区域、编辑器和调试工具。这个\
  \ IDE 易于安装、轻量，并且有许多你会喜欢的棒极工具。它还有有自己的命令行，所以你可以安装一些第三方软件。有了这个 IDE，你就不需要单独安装 Python\
  \ 环境了。\n\n要下载 Anaconda，需要完成几个步骤。你将看到在 Windows 电脑上安装时使用的步骤，但在 Linux 或 Mac 上安装的步骤大大相同：\n\
  \n1. 首先，访问 `https://www.anaconda.com/download/`\n2. 从这里，你将被引导到主页。你需要选择 Python 3.6，因为它是最新版本。点击“Download”获取可执行文件。下载需要几分钟，但取决于你的网络速度。\n\
  3. 一旦下载了可执行文件，你可以进入下载文件夹并运行该文件。当你运行此文件时，你应该会看到安装向导出现。点击“Next”按钮。\n4. 然后将出现许可协议对话框。在点击“I\
  \ Agree”按钮之前，花一分钟阅读一下。\n5. 在“Select Installation Type”框中，勾选“Just Me”单选按钮，然后点击“Next”。\n\
  6. 在继续之前，你想要选择要使用的安装目录。你应该确保安装目录中有大约 3 GB 的空间。\n7. 现在你将处于“Advanced Installation\
  \ Options”对话框。你想要选择“Register Anaconda as my default Python 3.6”，然后点击 Install。\n\
  8. 之后你的程序将通过最后几个步骤，IDE 将安装在你的程序中。\n\n如你所见，在 Python 中设置环境可以是非常简单的，使用时不需要非常复杂。你也可以选择与其他形式的\
  \ IDE 一工作，如果你已经在电脑上设置好了一个，也可以正常工作。\n\n### 如何开始学习 Python\n\n我对初学者的建议是去尝试，不要纠结于细节。即使你已经做过任何与机器学习相关的工作，也可以尝试\
  \ `scikit-learn`。你将了解到标记、训练和测试循环是如何工作的，以及模型是如何创建的。\n\n机器学习的另一种尝试可以从 `keras` 开始——它通常被认为是最简单的结构——并看看它能带你去哪里。当你有了更多经验后，你将开始意识到对结构的需求：更显著的速度、备选的\
  \ API，或者其他，从而做出更明智的选择。\n\n\n\nPython 是一种主流且易于使用的语言。Python 是一套完整的语言和框架，既用于创新工作，也用于创建时代性的框架。\n\
  \n同样，有大量的模块和库需要学习，这为完成每项任务提供了多种方法。这可能会让人无从从备。\n\n开始使用 Python 进行机器学习最理想的方法是理解该语言的一些基础性性原理。\n\
  \n它将迫使你引入并开始接触 Python 介器。它将为你提供一个如何完成微小任务的全局视角（万英尺视角）。它将赋予你信心去处理自己特定的微小任务。\n\n初学者需要从一个从头到尾的小项目开始。\n\
  \n书籍甚至许多在线 Python 课程可能会让人有些困惑。其中大部分内容会给你大量的公式和片段；然而，你很少有机会看到拼图的所有碎片是如何拼凑在一起的。当需要应用你所学的内容并学习其他特定的数据集时，你正在获得一个心理成长的机会。\n\
  \n让 Python 如此易于使用的常见任务包括：\n* 确定问题\n* 收集数据\n* 分析算法\n* 增加正面结果\n* 定义结果并展示它们\n\n面对学习陌生平台或语言时，最简单的方法就是永不放弃，并坚持研究一个机器学习案例，直到结束。只需务必记录在此过程中教授的所有关键点和技术。特别要关注数据加载、数据摘要、如何评估不同的算法以及如何得出某些预测。\n\
  \n如果你无法做到这一点，每个数据集中都有一个供你使用的模板。尝试一种名为 Iris Dataset（鸢尾花数据集）的新工具；对于刚开始学习机器学习的人来说，它是最简单的。这是一个很棒的项目，因为它的界面易用。属性通常是数值型的，这意味着你必须弄如何加载加载管理所有数据。由于其计算性质，用户可以使用更简单的\
  \ Python 公式或代码进行练习。这是一个多级安排问题（表面上），可能需要详细的方法。它只有四个属性和 150 行（此处应为样本），意味着它非常小，可以有效地加载到内存中。大多数数值属性具有相似的单位和量级，在开始之前，对于任何独特的缩放或更改都不是至关重要的。\n\
  \n我们应该从一个简单的 Python “你好世界”机器学习程序开始。在这一部分中，我们将从头到尾完成一个简单而有趣的编码示例。以下是本节中将发现的一些常见的\
  \ Python 特性：\n* 介绍 Python 及其库\n* 堆叠数据集\n* 压缩数据集\n* 视化数据集\n* 评估一些计算\n* 进行一些预测\n\n\
  根据需要花费的时间。完成每个进度。尝试自己输入这些命令，或者为了节省时间尝试对它们进行排序。\n\n### 步骤 1：下载并安装\n\n通过下载将 Python\
  \ 和 SciPy 环境下载到你的计算机上。这假设你还没有安装它们。我倾向于不进行极其详细的介绍，因为有许多文章解释了如何这样做。\n\n### 步骤 2：教学练习\n\
  \n此教学练习适用于 `2.7` 或 `3.5`。对此进行一些研究，这里是完成此用例需要安装的库列表：\n* `matplotlib`\n* `pandas`\n\
  * `sklearn`\n* `numpy`\n\n记住，引入 Python 库有许多方法。我对初学者的最佳建议是在开始时选择一个并保持一致。我发现 SciPy\
  \ 页面为许多平台（例如 Linux、OS，当然还有 Windows）提供了安装和库介绍的极佳指南。该指南在全球范围内非常流行并被广泛使用。如果你在使用 Windows\
  \ 环境，或者你不确定，我强烈建议你安装一个干净的 `Anaconda` 版本。它是一个免费、开源的管理系统，可以在 Windows、Linux 甚至 OS 上运行。它将帮助你打包和分发代码。\n\
  \n免责声明：我们下面看到的示例是基于你至少使用 `sklearn` 的 `0.1` 或更高版本的假设。Python 环境已正确下载、设置并为此示例项目正常运行。下面的代码脚本将帮助你测试工作环境，并自动导入此示例所需的每个不同库。在你的解释器中打开一个全新的命令行并输入以下单词。\n\
  \n我绝对建议仅在解释器中工作或预先编写程序，然后在命令行中运行所有程序，而不是在大型编辑器环境中运行。始终保持极其简单，专注于代码本身而不是工具。界面变化并不快；因此，如果你输出的是旧版本，请不要惊讶。这一切对你来说仍然应该是正确的；但是，如果你遇到任何类型的错误，请不要尝试继续。在开始阶段你可能不想学习修复代码。由于某些原因，你无法在无错误的情况下执行脚本；其余步骤将对你无效。网上有很多针对初学者的论坛。尝试搜索你的确切错误代码（带引号），以查看常见的解决方法是什么。尝试修复，如果对你来说足够容易处理，请务必这样做并回来完成其余步骤。\n\
  \n### 使用 Python 的基础\n\n在我们开始更多的机器学习之前，我们需要理解 Python 语言的一些基础部分。\n\n### Python 关键字\n\
  \n首先，我们需要查看 Python 语言中的一些重要关键字。正如你在其他编程语言中发现的那样，Python 有一组关键字，用于告诉你的文本编辑器做什么。\n\n\
  ### 在代码中命名标识符\n\n当你使用 Python 时，在命名代码的不同部分时遵循正确的规则是非常重要的。这些部分中的被称为标识符。这些可以有各种名称，如变量、类、实体和函数。在命名这些标识符时，你必须遵循一些规则，但无论你处理什么标识符，规则都是相同的。命名标识符需要遵循的规则包括：\n\
  \n\n\n\n- 你可以在标识符的名称中使用大写字母和小写字母。你也可以使用下划线符号和数字。上述字符的任何组合都是有效的，只需确保名称内部没有任何空格。因此，不要写出像‘My\
  \ first program’这样的内容。你应该将其写为‘Myfirstprogram’。\n- 你的标识符不能以数字开头。你可以在名称的任何地方使用数字，但它不能是程序的第一个字符。如果你将数字作为第一个字符，当你让编译器尝试执行时，你将会得到一个错误信号。你可以写像‘one\
  \ program’这样的内容，但你不能将标识符命名为‘1program’。\n- 标识符的名称不能包含 Python 关键字。如果你在名称中添加关键字，将会导致编译器困惑，你的程序将无法运行。\n\
  \n命名标识符的规则并不复杂。如果你不小心忘记了命名标识符的某条规则，编译器会注意到，你最终会得到一个语法错误。你只需要回去修复它，这个错误就会消失。\n\n\
  ### Python 注释\n\n你也可以在 Python 中使用注释。这些注释对于解释你的代码非常有用，特别是当你试图向另一个程序员或查看你代码的人解释它时。每当你的代码某部分需要一点说明时，你就可以添加注释。编译器不会识别注释，它会直接跳过它而完全不读取。一旦你告诉编译器注释结束，它将再次开始读取代码。执行代码的人不知道你写了多少条注释，甚至不知道你把它们放在了程序的什么位置。\n\
  \n写出你想添加到代码中的注释非常简单。你只需要在想要写的注释前面使用（##）符号即可。所以，你可以写出像 `#this is my Python code`这样的内容。注释完成后，你只需按回车键并在下一行开始编写剩余的代码。只要你在注释前面有那个符号，你的编译器就可以跳过它，而不会读取你在注释中输入的内容。\n\
  \n你可以根据需要决定在代码中编写多少条注释。有时候代码只需要几个注释，而其他时候代码可能需要很多注释。将注释保持在你真正需要的范围内，不要浪费时间或空间去编写不必要的注释。\n\
  \n### Python 语句\n\n你还可以在 Python 代码中使用语句。然后你可以将这些语句发送到你选择的编译器中，以便执行代码。你可以编写任何喜欢的语句，但必须以编译器能够理解的方式书写。语句的长度可以随你的意愿长短不一。有些语句可能只有一个字符长，而其他时候它会有很多行长。\n\
  \n### 作为面向对象语言的 Python\n\n当你查看指南中用于这种类型学习的一些不同代码时，你会发现它非常像一种面向对象编程（或 OOP）语言。这是一种相当新的编程形式，但你会发现它在编写程序时效果好得多，并且可以让编码（特别是机器学习）对初学者来说变得更容易。\n\
  \nOOP 语言基本上的设计是为了让编程更容易，并消除以前编程时经常发生的一些问题。一些旧的编程语言不是这样设计的，这让初学者很难入门。OOP 的设计是为了消除这些问题，因为它将以一种更有结构化的方式使用最好的编程特性。基本上，这种结构将帮助你作为一名程序员更快地完成工作。如果你尝试过一些旧的编码并感到挫败，你会发现\
  \ Python 解决了其中一些问题，现在的编码比以前容易更容易完成了。\n\n与 Python 不同，一些最早的编程语言使用的是被称为过程化（procedural\
  \ approach）开发方法。这种方法完成了任务并帮助了程序员完成工作，并在多年里编写了很多优秀的代码，但存在很多缺陷。这些缺陷是程序员可以克服的，但它们往往会足够让初学者感到沮丧并放弃工作。\n\
  \n由于过程化方法在编程中确实很难使用，OOP 的想法被开发出来。当你使用 OOP 时，你会发现代码中的数据将被视为代码的重要开发部分。在过程化开发中，数据被允许在系统中随意流动。OOP\
  \ 会更好地将数据保持在原位，以便操作它的函数就留在它旁边。这确保了数据安全，并确保外部源不会意外修改它。\n\n\n\n\nWeb 框架实际上是使用工具和资源来构建和管理网站、Web\
  \ 应用程序和 Web 服务。这些框架作为抽象工具工作，允许代码复用并使应用程序开发变得更加容易。\n\n## 为什么我们需要 Web 开发框架？\n\n框架让开发者开发软件和网站变得更加容易。使用框架可以加速开发，因此，开发变得更快速、更快捷、更高效。大多数\
  \ Web 框架的成本都很低。一个框架具有强大的安全性实现。使用框架最大的好处实际上归功于它们背后的社区。\n\n如果你正在预览或类似的地方浏览这本书的介绍页面，对于是否想学习\
  \ Python 还在犹豫不决，那么，我可以告诉你，你可能应该学一下。Python 基本上是一门极其有用且强大的语言。它几乎无处不在。从视频游戏的脚本端（或游戏本身）到密集的服务器端\
  \ Web 应用程序，再到用它构建的大量深度且响应式的桌面应用程序，无一不在。\n\nTornado 框架还可以帮助同时为你的应用程序建立数千个并发连接。Dash\
  \ 也是一个 Web 框架，被认为是分析类应用的最佳选择之一。\n\n### Django\n\nDjango 是最流行的 Web 开发框架，被简单地定义为“为有截止日期的完美主义者提供的具有高级功能的\
  \ Web 框架”。它内置的功能允许广泛的 Web 应用程序，如聊天机器人、数据库应用程序、GPS 解决方案等。\n\nDjango 拥有一种名为 `DRY`（不要重复自己）的哲学，允许并促进代码的使用，同时将代码时间减半。它的模块化架构允许修改代码组件，通过允许根据需要添加或删除组件的选项。\n\
  \n此外，Django 框架拥有 `ORM`（对象关系映射）。`ORM` 使它与大多数流行的数据库高度兼容，包括 `SQL` 和 Oracle。它具有同时与多个数据库工作的能力。\n\
  \nDjango 也是一个 SEO 框架，通过不同的技术和功能（如压缩 JavaScript 和缓存模板）缩短页面加载时间。\n\n### Pyramid\n\n\
  Pyramid 是另一个用于 Web 应用程序的框架，它定义自己为“不小，也不大，恰好”。Pyramid 具有从小开始的能力。它允许程序员为特定的问题解决项目编写坚实的基础，然后根据需要进行扩展。与\
  \ Django 相比，Pyramid 对小型和大型应用程序都具有相同的兼容性，但在复杂性上，它与 Django 不同。\n\nPyramid 是一个出色的框架，带有插件系统，允许程序员执行任何所需的操作。具体来说，这些插件有助于为给定问题实现多种解决方案/结果。\n\
  \nPyramid 是单文件应用程序、授权或面向应用程序的程序以及灵活身份验证的理想选择。\n\n对于服务器端编程，Python 凭借其创建动态网站的能力被广泛使用。NASA\
  \ 和 Google 等科技巨头使用 Python 语言是因为它被用于快速原型设计和高度可扩展 Web 应用程序的开发。\n\nPython 框架让 Web 开发变得简单并减少了开发工作量。程序员面临的唯一挑战是识别特定任务或更好结果需要哪种框架。专业程序员（也称为专家）解释说，根据需求、优势、用途、高级功能和特性，程序员在长期来看最可能会与几个框架一起。以下是史上最佳且最受喜爱的框架：\n\
  \n* `Pyramid`\n* `Tornado`\n* `Bottle`\n* `Flask`\n* `CubicWeb`\n\n### CherryPy\n\
  \nCherryPy 是最古老的框架之一，但即使增加新功能并更新版本后，它仍然是最常使用的框架。与其他框架相比，CherryPy 相当稳定且快速。开发者可以在此框架的帮助下，以构建任何面向对象应用程序的方式构建\
  \ Web 应用程序。开发结果在时间上包含更小的源代码。自发布以来，CherryPy 已证明了快速且高效。\n\n#### CherryPy Python 框架的特性：\n\
  \n* CherryPy 运行在 Python `2.7+` 和 `3.5+`、Android、`PyPy` 和 Jython\n* 它具有灵活且专门的插件系统\n\
  * 它强大的配置系统是开发者的另一个特性\n* 它非常简单且易于同时运行多个服务器\n* CherryPy 还在其功能中提供测试支持、分析支持和内置覆盖率支持\n\
  * 它的功能还包括编码、缓存、身份验证、会话、静态内容等的内置工具\n\n### Tornado\n\nTornado 也是最流行的 Python 框架之一。它拥有异步网络库，可以同时处理并发连接。\n\
  \n### Tornado 框架的特性：\n\n* 它的性能很高\n* 允许开发者随时读取源代码\n* 由于它是一个小型框架，因此最适合 `HTTP+JSON`\
  \ 服务\n* 非阻塞 HTTP 客户端\n\n### Bottle\n\nBottle 是另一个用于 Python 语言的 Web 框架。具体来说，它是一个\
  \ `WSGI`（Web 服务器网关接口）微框架，其设计使其使用非常简单，性能极快且轻量（50-60 kb）。这个 Web 框架最有趣的一点是除了 Python\
  \ 标准库外没有任何依赖。它允许高效快速地开发 Web 应用程序。\n\n### Bottle 框架的特性：\n\n* 它有助于路由，前提是程序员必须对 URL\
  \ 参数使用简化语法或表达式\n* 该框架为访问表单数据、文件上传、头部、cookie 和其他 HTTP 元数据提供了便利\n* 它通过测试快速静态路由和频繁使用的路由帮助开发者优化速度\n\
  * 它同时支持 Python `2.5` 和 `3.5`\n\n### Flask\n\n#### Flask Web 框架的特性：\n\n* 它包含开发服务器和调试器\n\
  * 可以进行详尽的文档\n* 提供安全 cookie 支持\n* 提供集成单元测试支持\n* Unicode 特性\n\n### CubicWeb\n\nCubicWeb\
  \ 是另一个用于 Python 的 Web 框架，它是语义化的、开源的 Web 结构且免费。它鼓励工程师通过复用称为 segment 的 3D 形状并遵循著名的标准来高效地构建\
  \ Web 应用程序。对于语义 Web 应用程序的发展，它的特性非常重要，包括质量、可复用性和生产力。\n\n### CubicWeb 的特性：\n\n* 对于常见需求，提供了数据模型和视图的可复用组件库\n\
  * 它具有完善的安全工作流\n* 它支持 `OWL`（本体语言）和 `RDF`（资源描述框架）。\n\n\n\n\n目前已有许多关于 Python Web 框架的讨论，有助于程序员选择并使用最符合其项目要求的框架。Web\
  \ 应用程序的使用和开发的增加通常也推高了此类框架的使用。框架的使用取决于业务需求和需要，以便决定哪种 Python 框架最适合你的业务。Web 服务在许多不同国家分别提供在线和离线支持。这些服务提供商可以帮助程序员为\
  \ Web 开发选择合适的框架。然而，如果程序员尝试探索这些 Web 框架，也可以自己完成。\n\n# 注册 Python 程序\n\nPython 命令行是一个极佳的环境，对于编写和测试小段代码而言。然而，随着代码的增加和增长，命令行将变得不再够用。此外，你自然想要保存和存储你编写的代码。这就是文本编辑器大显身场。你可以使用任何喜欢的文本编辑器来编写\
  \ Python 代码，甚至不需要记事本。不过，从一个可以识别并高亮 Python 代码颜色的文本编辑器开始会让你的生活变得更加方面。正如我们之前提到的，无论你使用哪种操作系统，我都建议你同时熟悉\
  \ Windows 和 GNU / Linux。让我们从 GNU / Linux 开始：\n\n### 3.1 GNU / Linux 系统\n\n如果你的系统是\
  \ GNU / Linux 中的 KDE 桌面环境，那么任何 `Krite` 或 `Kate` 文本编辑器都适用于初级水平。在这个阶段，`Krite` 因其简单性和易用性而被推荐。如果你的系统是\
  \ GNU / Linux 中的 GNOME 桌面环境，你可以使用 `Edit`。\n\n让我们从打开一个新的 `Krite` 文档开始。打开新 `Krite`\
  \ 文档最简单的方法是按下 `ALT + F2` 并输入：`krit`。要创建一个新的 `Edit` 文档，我们按下 `ALT + F2` 并输入命令：`edit`。在我们得到空的\
  \ `Krite` 或 `Edit` 文档后，我们需要做的第一行是：\n\n（注：提供的文本包含多段关于 Linux 环境下 `Krite`、`Kate` 和\
  \ `Edit` 指的重复段落，已进行合并以保持清晰。）\n\n在这个阶段，`Krite` 因其简单性和易用性而被推荐。如果你的系统是 GNU / Linux\
  \ 中的 GNOME 桌面环境，你可以使用 `Edit。让我们从打开一个新的 `Krite` 文档开始。打开新 `Krite` 文档最简单的方法是按下 `ALT\
  \ + F2` 并输入：`krit`。要创建一个新的 `Edit` 文档，我们按下 `ALT + F2` 并输入命令：`edit`。在我们得到空的 `Krite`\
  \ 或 `Edit` 文档后，我们需要做的第一行是：\n\n```\n#!/usr/bin/env python\n```\n\n那么这个命令是做什么的？这个命令表明我们接下来编写的代码是\
  \ Python 代码，以及 Python 在系统中的位置。这样我们的系统就知道去哪里寻找 Python。在 GNU / Linux 系统上，Python 的可执行文件通常位于\
  \ `/usr/bin`。因此你实际上可以输入上述行：\n\n```\n#!/usr/bin/python\n```\n\n这样你的系统将会在 `/usr/bin`\
  \ 目录下查找 Python，并理解它应该运行你用 Python 编写的程序。然而，在某些 GNU / Linux 系统上，Python 的可执行文件可能位于另一个目录（例如\
  \ `/usr/local/bin`）。\n\n在这种情况下，由于无法在 `/usr/bin` 下找到可执行文件，在某些情况下系统无法运行你编写的程序。像上面那样给出固定目录名称可能不是好主意，因为\
  \ Python 可执行文件在每个系统的相同目录中并不可用。为了避免这种系统差异，我们可以在 GNU / Linux 系统上使用名为 `env` 的脚本。这个\
  \ `env` 脚本可以认为位于 `/usr/bin` 下，它允许我们找到 Python 所在的目录。通过在程序开头添加 `/usr/bin/env python`\
  \ 行，无论 Python 安装在系统的哪个位置都能被轻松检测到。简而言之，当你输入 `#!/usr/bin/python` 时，我们是在向系统下达以下命令：在\
  \ `/usr/bin` 中搜索 Python！当你输入 `/usr/bin/env python` 时，你是在下令：无论 Python 隐藏在哪里，都找到它！\n\
  \n### 编写代码\n\n事实上，将代码写入文本与在 Python 命令行中编写代码并没有多少。现在我们在 `Krite` 或 `Edit` 文档中插入以下行：\n\
  \n```python\n#!/usr/bin/env python\na = \"apple\"\nb = \"pear\"\nc = \"banana\"\n\
  print(a, \"a\", b, \"a\", c)\n```\n\n完成编写后，该保存我们的文件了。现在我们在任何地方保存一个命名为 `experiment.py`\
