  \n\n\n\n\n为了说明这是如何运作的，请想象一个允许搜索的简单在线目录。搜索页面通常会包含一个只有一个文本框的表单。你可以使用表单输入想要搜索的物品名称，然后只需点击搜索按钮即可。你一点击搜索按钮，网络服务器就会遍历并搜索数据库，查找与该搜索词相关的所有内容。它会将这些内容带回来，创建一个以响应你特定请求的新网页。\n\
  \n对于那些完全没有花太多时间学习编程语言、且不认为自己是程序员的人来说，在 `SQL` 中使用的命令并不难学习。`SQL` 命令的设计初衷都是符合英语语言习惯的语法。\n\
  \n起初，这看起来会非常复杂，你可能会担心设置它需要耗费多少精力。但当你开始编写一些代码时，你会发现实际操作起来并没有那么困难。通常，只需大声读出 `SQL`\
  \ 语句就能帮助你理解该命令的作用。请看下面的代码：\n\n### 它是如何在你的数据库中运行运行的\n\n如果你决定使用 `SQL` 作为管理数据库的语言，你可以查看一下数据库。你会发现，当你查看这些内容时，你基本上是在看一组组信息。有些人认为这些是组织机制，用于存储你作为用户以后可以查看的信息，并且能够尽可能有效地做到这一点。在管理数据库方面，`SQL`\
  \ 可以帮助你完成很多事情，你将看到一些非常棒的结果。\n\n当你和公司一起某个项目时，你可能会使用某种与 `SQL` 非常相似的数据库，而你可能甚至没有意识到自己在这样做。例如，你经常使用的一种数据库就是电话簿。它包含了大量关于你所在地区人员的信息，包括他们的姓名、从事行业、地址和电话号码。所有这些信息都存储在一个地方，所以你不需要到处寻找。\n\
  \n这与 `SQL` 数据库的工作原理也是类似的。它通过查看你公司数据库中提供的信息来实现此。它会对这些信息进行排序，让你能够更好地找到最需要的内容，而不会造成混乱或浪费时间。\n\
  \n### 客户端与服务器技术\n\n现在，这些系统已经运行并完成了很长时间的任务。如果你的公司使用这些系统，而且你最习惯使用它们，那么它们确实可以完成工作。但市场上也有一些表现更好的选项。这些选项可以在客户端-服务器系统中找到。\n\
  \n这些系统使用不同的流程来帮助你获得所需的结果。在这种系统中，你正在使用的主计算机（被称为“服务器”）是网络上的任何用户都可以访问的。现在，这些用户必须拥有正确的凭据才能进行操作，这有助于保持系统安全。但如果用户拥有正确的信息并在你的网络上，他们就可以毫不费力且几乎不费努力地获取信息。用户可以从其他服务器或他们的桌面电脑获取服务器，然后该用户将被称为“客户端”，这样客户端和服务器就可以通过数据库轻松地交互。\n\
  \n### 如何与在线数据库协作\n\n许多企业主会发现客户端和服务器技术最适合他们。这种系统对很多公司来说非常棒，但由于最近技术的变化，你有时可能需要添加或删除一些东西。有些公司喜欢他们的数据库在互联网上运行得更好的想法，这样他们可以在任何地方操作该数据库，无论是在家里还是在办公室。你甚至会拥有一个数据库账户并可以使用\
  \ `SQL`。例如，如果你在亚马逊上有一个账户，你就需要访问它。\n\n随着公司趋势的持续，使用在线 `SQL` 变得越来越普遍，获取数据是非常棒的。你可以找到许多在线运行的\
  \ `SQL` 数据库，你需要使用一些密码来保持系统安全。当然，虽然 `SQL` 很容易学习，但你不需要成为编码专家就能完成工作。我们将查看一些有帮助的代码，但即使是初学者也能掌握这些代码并在\
  \ `SQL` 中良好运行。\n\n### 为什么 SQL 这么棒？\n\n在查看你可以使用的各种类型管理系统时，是时候讨论为什么你想要选择 `SQL` 而不是其他了。使用\
  \ `SQL` 可以获得的好处包括：\n\n### 极其快速\n如果你想选择一个可以排序信息并立即返回结果的管理系统，那么 `SQL` 是最好的之一。事实上，在所有选项中，这是你可以使用的效率最高的一种。\n\
  \n#### 定义良好的标准\n带有 `SQL` 的数据库已经运行了很长时间。此外，它已经能够开发出良好的标准来确保数据库的稳健性。你可能想要使用的其他数据库可能会缺少这些标准，这可能会令人沮丧。\n\
  \n#### 你不需要大量的编码\n如果你正在研究 `SQL` 数据库，你不需要成为编码专家就能完成工作。我们将查看一些有帮助的代码，但即使是初学者也能掌握这些代码并在\
  \ `SQL` 中良好运行。\n\n#### 保持你的东西组织有序\n在经营业务时，保持你的信息安全、可靠且井然有序非常重要。虽然有很多优秀的数据库可以选择，但没有哪一个在完成这一切方面做得像\
  \ `SQL` 语言那样好。\n\n#### 对象型 DBMS\n`SQL` 数据库依赖于之前提到的 DBMS 系统，因为这会更容易找到你正在搜索的信息、存储正确的项目，并在数据库中执行更多操作。\n\
  \n\n\n\n选择使用 SQL 程序工作可以获得许多益处。虽然有些人刚开始时会对这个界面感到困惑，但总的来说，SQL 有许多优秀功能可以使用，你将非常喜欢使用这种语言及其数据库的快速与便捷。\n\
  \n# 第 1 章：什么是 SQL 编程与编码？\n\n![图片描述自动生成](img/00145.jpeg)\n\n在本章中，你将学习 SQL 历史的概述，它为什么以及是如何产生的。理解这种计算机语言的背景将帮助你意识到它对于大多数致力于专注于数据管理领域的\
  \ IT 专业人士的重要性。这些知识将进一步指导你如何最大限度地发挥 SQL 语言作为编程工具的潜力。\n\n投资于能够高效地收集、分析、处理和将原始数据转换为有意义的信息的技术，是今天几乎所有企业（从小型到大型企业）的首要任务。强大的数据管理技术无疑能为公司提供保持竞争力甚至领先竞争对手所需的专业知识。这就是为什么结构化查询语言（Structured\
  \ Query Language，或广为人知的 SQL，读作 \"ess-que-el\" 或 “see’qwl”）被制定为数据库管理员、开发人员或分析师与数据库通信的标准工具。\n\
  \n### SQL 历史\n\n一家名为国际商业机器公司（International Business Machines Corporation，简称 `IBM`）的美国跨国技术咨询公司在\
  \ 20 世纪 70 年代发明了计算机数据库语言。该程序的主要功能是收集、组织和处理数据库。计算机软件还包含了增强功能，例如实施和管理数据库安全。当 `IBM`\
  \ 研究人员发现相同的“Sequel”商标被另一公司使用时，它最终被更名为 `SQL`，代表结构化查询语言。\n\nSQL 自首次发布以来已经经历了许多版本。每种数据库软件类型或版本可以使用创建该程序的开发人员来识别。1979\
  \ 年，以前名为关系软件公司（Relational Software, Incorporated）的 Oracle 公司推出了第一个名为 `ORACLE` 的\
  \ SQL 产品。随着数据管理应用需求的增加，SQL 已成为信息技术（IT）领域的行业标准。这一正式标准由国际标准组织（International Standards\
  \ Organization，简称 `ISO`）进一步维护。由 `IBM` 实现的 SQL 于 1986 年确立为数据库通信基准。另一个名为美国国家标准协会（`ANSI`）的组织（授权美国许多行业的某些标准）开发了另一个名为\
  \ `ANSI SQL` 的数据库应用。这最终于 1987 年被 `ISO` 采用为国际标准之一。随后是标准的进一步修订，例如 `SQL-92` 和 `SQL-99`，分别于\
  \ 1992 年和 1999 年发布。最新版本现在被称为 `SQL-2011`，于 2011 年 12 月正式发布。总结来说，`ANSI` 和 `ISO` 是守护和维护各种\
  \ SQL 标准的两个国际委员会。\n\n## SQL 特\n\n正如之前提到的，SQL 是一种 ISO 和 ANSI 标准数据库计算机语言，允许用户以有意义的方式创建、更新、删除、检索和展示数据。人们可以轻松理解并学习该程序使用的命令，这些命令使用的是英语。常用的语句有\
  \ `select`、`add`、`update`、`delete`、`create` 和 `alter`。由于程序的简单性，管理数据库不再复杂，无需编写复杂的代码。此外，SQL\
  \ 是一种综合工具，可以高效快速地从数据库中检索大量信息。\n\n以下是 SQL 变为几乎任何类型标准计算机管理工具的某些因素：\n\n- **计算机系统可移植性**：SQL\
  \ 可以运行在大型机、个人电脑（PC）、笔记本电脑甚至连接或未连接的手机等手持设备上。这意味着你可以将数据库从一个传输到另一个而不会面临任何问题。\n- **易于理解的语句**：SQL\
  \ 特性是声明性语言，主要由英语语句组成，因此新手用户可以轻松开始编程。\n- **交互式编程环境**：SQL 可以立即用于与数据库交互并快速处理指令。\n-\
  \ **多重数据视图**：SQL 为不同的用户提供数据库内容和结构的视图。\n- **带连接的动态数据库访问和定义**：SQL 允许在分层架构（客户端、应用服务器和数据库）中动态更改数据库结构，即使该数据库同时被不同的用户访问。\n\
  - **完整语言**：SQL 包含了操作数据库所需的所有命令和函数。\n- **Java 集成**：SQL 设计用于通过名为 Java 数据库连接（`JDBC`）的应用程序编程接口（API）与\
  \ Java 集成。\n\n### SQL 应用\n\n通常情况下，你在下载数据库应用程序时需要付费。然而，有一些开源的 SQL 版本是免费使用的，任何人都可以修改原始程序。尽管如此，这些众多版本并不完全相同，并且需要数据库程序或服务器来访问和操作数据。就此，大多数软件供应商已为此类数据库应用开发了自己的服务器。\n\
  \n随着目前从仅仅生产产品和提供服务的转变，企业界正在发现创新方法来投资于能够处理海量数据的强大 SQL 数据库应用。主要目标是将原始数据转换为有意义的信息片段，从而改进公司流程。这种对数据操作的增强将进一步产生盈利的业务洞察。人们可能认为只有计算机专业人员（如数据库管理员和开发人员）才能从使用这种强大的工具中获益。请注意，了解一点\
  \ SQL 对于各种角色的人来说（从简单的数据编码员到数据库科学家）可能是一个优势。SQL 不仅适用于编程极客，因为它的语义可以让非 IT 人员理解驱动每家公司的数据流和操作。此外，使用这种语言提升计算机编程技能可以开启多个职业机会，无论是在管理、分析、研究还是\
  \ IT 领域。\n\n## SQL 环境基础\n\n### 数据库结构\n\n在学习 SQL 作为编程语言的技术方面之前，你首先需要理解什么是数据库及其元素。定义和描述数据库的方法有许多，但基本上它是存在于一段时间内的项目集合。设想一下一个名片盒就像数据库，它组织了你所有的名片，这些名片包含不同人的各种信息（例如：全名、职位名称、公司名称和联系方式），而你可能认识也可能不认识这些人。更专业的定义是，数据库是一种组织工具，能够将相互相关的数据或信息存储在一起，并在需要时进行高效的检索。\n\
  \n\n\n\n当此类概念性信息以数字或物理形式表示时，就会创建一个 `record`（记录）。根据之前的名片持有者示例，如果你想跟踪你的业务联系人，那么每张名片将分配给一个特定的\
  \ `record`，该记录包含了针对特定联系人的若干条信息。这些信息现在被称为该记录的 `attributs`（属性）。另一个元素是 `metadata`（元数据），它包含了定义或描述数据库中所包含的数据结构的信息。所有这些信息将存储在一个名为\
  \ `data dictionary`（数据字典）的单一区域中，以增强数据检索和组织。\n\n![描述: 00002.jpeg](img/00146.jpeg)\n\
  \n上面的插图展示了数据库元素是如何相互集成的。数据库包含了组织各种用户所需的数据。从这些数据集中，创建了不同的 `objеcts`（对象），例如表和视图，它们以更易读的方式呈现信息。接下来是针对数据库的\
  \ `quеriеs`（查询）或询问，它们将提取数据并根据用户的要求呈现。最后，我们还有处理其他用户请求的数据库进程。\n\n数据库根据大小、运行的机器以及管理它的组织规模还分为三类：\n\
  \n* **个人数据库（Personal Database）** – 由单人概念化并设计，这种数据库在独立计算机上实现。它的结构简单，规模较小。例如，你的电子个人地址录。\n\
  * **工作组/部门数据库（Workgroup/Departmental Database）** – 由组织内特定工作组或部门的个人开发，与个人类型相比，这种数据库更大、更复杂。它也可以被多个用户同时访问。\n\
  * **企业数据库（Enterprise Database）** – 这种数据库能够处理大型组织所需的的海量信息系统的整个流程。因此，它的设计涉及许多复杂的结构。\n\
  \n## SQL 程序组件\n\n在开始编写 SQL 代码之前，必须首先理解它的编程组件。这些组件包括在执行各种数据库功能时使用的基本命令。\n\n### 数据操纵语言\
  \ (DML)\n\n该组件由处理数据操纵和维护功能的 SQL 命令组成。这意味着用户能够在表内选择、输入、更改或删除数据。这些是四个主要的 DML 命令：\n\
  \n* `SЕLECT` – 该命令从特定表中选择数据行。\n* `INSЕRT` – 该命令向特定表中插入新的数据值或数据行。\n* `UPDATE` – 该命令修改或更改表中已存在的数据值或数据行。在数据库中更新一个表或特定表的多个行/列。\n\
  * `DЕLЕTЕ` – 该命令用于从表中删除某些记录或数据行（甚至是整个表本身）。\n\n### 数据控制语言 (DCL)\n\n此 SQL 组件由允许用户通过用户权限管理数据库数据访问的命令组成。此外，还可以防止数据库用户对信息的意外或故意误用。所有执行任何数据库操作的\
  \ SQL 语句都会被捕获并保存在日志文件中。这些是主要的 DCL 命令：\n\n* `GRANT` – 该命令通过授予访问权限为用户提供某些权限。\n* `RЕVOKE`\
  \ – 该命令移除用户访问数据库的权限。\n\n现在你已经熟悉了常用的 SQL 命令，下一步是如何将该软件成功安装到你的电脑或笔记本电脑上。首先，在设置适用于设备的\
  \ SQL 版本之前，你必须确定目的，即**为什么**需要一个数据库。设计细节过多会导致非常复杂的数据库。反之，规范不足会导致性能低且效率低的工作。一旦你确定了设计，就可以决定使用哪种\
  \ SQL。\n\n\n\n\n最初由 IBM 使用的 SQL 版本在当时被称为 ORACLE，它非常成功，以至于其后的团队最终离开了 IBM 并成立了了自己的公司。ORACLE\
  \ 得益于它与 SQL 的工作方式，仍然是编程语言的领导者之一，并且不断变化，以跟上编程和数据库管理领域的所有需求。\n\nSQL 是一组指令，你可以使用它来与关系型数据库进行交互。虽然有很多种语言可以实现此功能，但\
  \ SQL 是大多数数据库都能理解的唯一语言。每当你准备好与这些数据库之一进行交互时，软件就会进入并翻译你提供的命令，无论你是通过输入还是鼠标点击提供的。这些命令将被翻译成数据库能够解释的\
  \ SQL 语句。\n\n主要有三个组成部分，我们将在下一章进行深入讨论。但这些主要部分是“数据控制语言（DCL）”、“数据定义语言（DDL）”和“数据操纵语言（DML）”。\n\
  \n如果你用过由数据库驱动的软件程序，那么你过去可能用过某种形式的 SQL。不过，你可能甚至不知道自己正在这样做。例如，有很多动态网页是数据库驱动的。这些网页会从你的表单和点击中获取一些用户输入，然后使用这些信息来构建\
  \ SQL 查询。该查询将通过从数据库中检索信息来执行操作，例如切换到新页面。为了说明其工作原理，请想象一个允许你搜索的简单在线目录。搜索页面通常包含一个表单，其中只有一个文本框。你可以使用表单输入想要搜索的项目名称，然后只需点击搜索按钮。只要你一点击搜索按钮，Web\
  \ 服务器就会遍历数据库，寻找与该搜索词相关的所有内容。它会将这些内容带回来，创建一个符合你请求的新页面。对于那些没有花费太多时间学习语言且不认为自己是程序员的人来说，你在\
  \ SQL 中使用的命令并不难学习。SQL 中的命令设计都采用了符合英语习惯的语法。\n\n起初，这看起来可能非常复杂，你可能担心启动它需要多少工作。但当你开始编写一些代码时，你会发现操作起来并没有那么困难。通常，只需阅读\
  \ SQL 语句就能帮你理解该命令将做什么。看看下面的代码：\n\n```sql\nDELETE FROM students WHERE graduation_year\
  \ = 2014\n```\n\n大声读出这段代码，你可能就能猜到执行代码时会发生什么。SQL 中展示的大部分代码都是这样工作的，因此你不需要成为专家程序员也能让\
  \ SQL 语言为你服务。考虑到这是一种允许授权用户查看数据库并找到他们所需信息的语言，SQL 语言非常易用是有情合理的。SQL 听起来可能是一门很难学习的复杂语言，但实际上非常容易理解。我们将花时间看看当你决定使用\
  \ SQL 语言来帮助管理公司使用的数据库时可以做的所有不同事情。它的设计初衷是简单，并在你处理数据库或尝试让用户更方便地找到信息时让事情变得更简单，而 SQL\
  \ 确实做到了这一点。\n\n如果你决定 SQL 是你将用于管理数据库的语言，你可以查看一下数据库。你会发现，当你查看它时，基本上是在看一组组一组的信息。有些人会认为这些是组织机制，用于存储你作为用户以后可以查看的信息，而且它能尽可能有效地做到这一点。在管理数据库方面，SQL\
  \ 可以帮助你做很多事情，你将看到一些非常棒的结果。\n\n有时当你与公司一起开展项目时，你可能正在使用某种与 SQL 非常相似的数据库，你可能甚至没有意识到自己正在这样做。例如，你常用的一种数据库就是电话簿。它将包含了大量关于你所在地区的人的信息，包括他们的姓名、从事行业、地址和电话号码。所有这些信息都可以在一个地方找到，所以你不需要到处寻找。\n\
  \nSQL 数据库的工作原理也是这样。它通过查看你公司数据库中提供的可用信息来实现这一点。它会对这些信息进行排序，让你在不杂乱的情况下找到你需要的内容。\n\n\
  ## 关系型数据库\n\n首先，我们需要看看关系型数据库。这是你想使用的，因为它允许你将信息分组为逻辑单元或表格。这些表格在数据库内部以一种更易于使用方式连接。对于你想使用的部分，系统能够将其拆分为更小的部分以使其效果更好。\n\
  \n关系型数据库非常好用，因为它们允许你以更有于理解的方式操纵信息。虽然你可能对所有信息以及如何拆分它们感到困惑，但系统能够遍历并检索你需要的信息。如果你将客户的个人信息放入该数据库，你可以将其与他人隔离，换句话说，它可以保护这些信息免受想要窃取的人侵害。\n\
  \n\n\n许多企业主会发现，客户端/服务器技术非常适合他们。该系统对很多公司来说非常棒，但由于最近技术的变化，你有时可能需要添加或删除一些东西。有些公司喜欢让数据库在互联网上运行得更好，这样他们无论是在家里还是在办公室，都可以在任何地方操作该数据库。有时客户在公司开有账户，他们也需要能够在线访问数据库。例如，如果你在亚马逊开有账户，你就是他们数据库的一部分，并可以通过此访问某些部分。\n\
  \n随着公司向线化的趋势持续，数据库也向在线迁移的情况变得越来越常见，你必须拥有一个网站和一个良好的网络浏览器，以便客户可以进来查看它们。你可以随时添加用户名和密码来提高安全性，并确保只有正确的用户才能访问其信息。这是保护客户个人和支付信息的绝佳主意。大多数公司会要求用户选择安全凭据来登录账户，但他们会免费提供账户。\n\
  \n当然，这是一个非常易使用的系统，但在后台会有大量工作在进行，以确保程序能够正常运行。客户可以轻松地进入系统查看信息，但服务器端需要完成大量工作来确保信息以正确的方式显示在屏幕上，并确保用户拥有良好的体验，并且实际上能在屏幕上看到自己的账户信息。\n\
  \n例如，你可能会看到你使用的网络浏览器使用了 SQL 或类似的程序，来确定你的数据想要查看的用户。一旦客户输入他们正在寻找的内容，SQL 系统将被用于访问你的数据库。\n\
  \n# 为什么 SQL 这么棒？\n\n现在我们已经花了一些时间讨论了你可以使用的各种数据库管理系统，现在是时候讨论一下你为什么选择 SQL 而不是其他选项了。你不仅可以选择与其他数据库合作，还可以与其他编程语言合作，每种选择都有其优势。那么，你为什么要专门用\
  \ SQL 呢？使用 SQL 作为你的数据库管理系统可以获得的一些巨大优势包括：\n\n*   极快\n\n如果你想选择一个可以快速筛选信息并立即返回结果的管理系统，那么\
  \ SQL 是此类使用的的程序之一。只需尝试一下，你会对获得的信息量以及它返回给你的速度感到惊讶。事实上，在所有选项中，这是你可以选择的效率最高的一个。\n\n\
  定义良好的标准\n\nSQL 自带的数据库已经良好运行了很长时间。此外，它还开发出了一些良好的标准，以确保数据库健壮并按照你的意愿运行。你可能想要使用的其他数据库可能会缺少这些标准，当你使用它们时这可能会让你感到沮丧。\n\
  \n不需要大量编码\n\n如果你正在研究 SQL 数据库，你不需要成为编码专家就能完成工作。我们将查看一些可以帮助的代码，但即使是初学者在在 SQL 工作时也能掌握这些代码并表现良好。\n\
  \n保持内容井然有序\n\n当涉及到经营业务时，保持你的信息安全、可靠且井然有序非常重要。虽然有很多很棒的数据库可以选择，但没有哪个在完成这些任务方面像 SQL\
  \ 语言那样好用。\n\n面向对象的 DBMS\n\nSQL 数据库依赖于我们之前讨论过的 DBMS 系统，因为这将更容易找到你正在搜索的信息、存储正确的项目，并在数据库内执行更多操作。这些只是当你选择使用\
  \ SQL 程序时可以获得的几个优势。虽然有些人在最初会对这个界面感到挣扎，但总的来说，SQL 有很多很好的功能可以操作，你会非常喜欢使用这种语言及其数据库的快速和方便之处。\n\
  \n# 第 2 章 数据定义语言\n\n数据是 SQL 的核心。毕竟，SQL 的创建是为了更容易地操作存储在数据库内部的数据。它确保你不需要手动搜索大块的数据。现在，根据平台有不同类型的数据。\n\
  \n## 数据类型：简介\n\n数据指定了可以存储的数据类型。在创建表时，为每列决定数据类型非常重要。此外，必须考虑输入和输出的数据类型。选择正确的数据类型将同时提高性能和数据完整性。因此，你需要学习\
  \ SQL 中可用的数据类型。\n\n### 精度和标度\n\n在开始之前，你应该花一点时间理解什么是精度（Precision）和标度（Scale）。精度是一个数字的总位数。标度是位于小数点右侧数字的总位数。对于像\
  \ `123.4567` 这样的数字，精度是 7，标度是 4。\n\n### 平台之间的差异\n\n上述数据类型是所有数据库共。然而，某些类型在不同的数据库平台中有不同的名称。这可能会是困惑的来源。因此，请查看下表中的差异。\n\
  \n## 不同数据库的数据类型\n\n每个数据库平台往往有自己的数据类型范围。因此，你需要知道这些数据类型是什么，以便有效地使用这些平台。在这里，我们将关注最流行的数据库平台：MySQL、SQL\
  \ Server 和 Microsoft Access。每种数据类型都提供了简短描述。\n\n### Microsoft Access 数据类型\n\n###\
  \ MySQL 数据类型\n\n在 MySQL 中，可用的数据类型可以广泛地分为三类：文本、日期/时间和数字。我们将在接下来的表格中查看每个类别中可用的数据类型。\n\
  \n**整数：**\n\n\n\n\n在 MySQL 中，整数数据类型有一个名为 `UNSIGNED`（无符号）的额外选项。通常，整数会从负值变为正值。然而，添加\
  \ `UNSIGNED` 属性将向上移动该范围。结果是整数将从零开始，而不是负数。\n\n![Description: 00010.jpeg](img/00152.jpeg)\n\
  \n### 日期/时间\n\n`TIMESTAMP` 和 `DATETIME` 这两个数据类型可能返回相同的格式。然而，它们的工作方式不同。`TIMESTAMP`会在\
  \ `UPDATE` 或 `INSERT` 查询中自动设置为当前时间和日期。`TIMESTAMP` 同样接受不同的格式。\n\n![Description: 00011.jpeg](img/00153.jpeg)\n\
  \n### SQL Server 中的数据类型\n\n与 MySQL 类似，SQL Server 中的数据类型也可以分为不同的类别。我们将在下表中查看每一个类型。\n\
  \n#### 字符串\n\n![Description: 00012.jpeg](img/00154.jpeg)\n\n### 数字\n\n![Description:\
  \ 00013.jpeg](img/00155.jpeg)\n![Description: 00014.jpeg](img/00156.jpeg)\n\n####\
  \ 日期/时间\n\n![Description: 00015.jpeg](img/00157.jpeg)\n\n上面的表格无疑对你的工作提供巨大的帮助。你应该多次阅读它们，以确保你对不同数据库平台中\
  \ SQL 使用的数据类型有彻底的了解。事实上，标记这个章节是一个好主意，这样当你需要刷新知识时就可以快速查阅。\n\n# SQL 中使用的不同数据类型\n\n\
  现在我们已经花时间查看了一些在 SQL 语言中想要使用的命令，现在是时候查看一些你在创建新代码时可以使用以让这些 SQL 语言运行良好的数据类型了。这些数据类型将根据你想要在数据库中执行的操作，以及你想要提供或卖给客户的不同项目而变化。\n\
  \n这个 SQL 系统中最常见的各种数据类型将与内部信息关联的属性，然后这些特定特征将被放置在表中，你可以在任何需要的时候读取并检索它们。\n\n让我们来看看它是如何运作的。一个很好的例子是你要求你想要处理的字段只能包含数值。你会发现可以使用\
  \ SQL 来设置它，使用户只能在那个数据库中（或至少在表的特定单元格中）放入一个数字。因此，如果你在表中有一个单元格，你只想让他们能够放置电话号码或信用卡号，你可以添加此限制。通过为你想要在表中显示的字段分配正确的数据类型，你确保了客户端出现的错误更少。\n\
  \n你在处理 SQL 系统时应该考虑的一点是，你可以使用的所有版本都会略有不同，当你挑选要使用的数据时，可能需要添加一些不同的选项。你必须检查正在使用的 SQL\
  \ 版本自带的规则，以确保一切井然。对于大多数情况，你可以使用所选特定特定数据点，以确保数据库按照你的预期运行。\n\n无论你使用哪个版本的 SQL，在处理 SQL\
  \ 时都可以使用一些基本数据类型。你可以使用的数据类型包括：\n\n*   **时间和日期值**\n*   **数字字符串**\n*   **字符字符串**\n\
  \n### 固定长度字符\n\n现在是时候查看你在 SQL 中可以处理的一些数据类型了。你可能想使用的第一个是固定长度字符。如果你想处理常量字符甚至是始终保持不变的字符串，你需要确保以正确的方式将它们保存到系统中。在选择这些字符时，你想要使用的典型数据类型是：\n\
  \n`CHARACTER(n)`\n\n仔细查看上面的示例，我们放在括号内的 ‘n’ 是你允许特定字段的最大长度或分配长度。例如，你可以将此用于电话号码字段。你希望将其保持在十个字符，这样客户就会在里面输入电话号码，而不包含其他内容。你也可以对代码的其他部分这样做，但你需要非常小心。例如，如果你在客户姓名上设置这些限制，如果他们的名字超过了你允许的字符，他们可能会遇到问题。\n\
  \n根据 SQL 的版本，你可能会发现使用 `CHAR` 数据类型来保存你需要的固定长度信息。当你想要处理任何数字信息时，使用这种数据类型是一个好主意。因此，如果你想设置一部分允许用户输入他们的州名，但你希望确保他们使用所属的缩写而不是全称，你可以使用字符限制并将其设置为二，这样每个人都知道应该如何做。\n\
  \n当你处理数据的字符时，你的用户不会添加超过你设置的限制的信息。假设你住在达科他州（Dakota），但你想确保用户只能输入两个。如果用户尝试输入超过两个，将无法运行。\n\
  \n在处理数据库时，有很多时候你想要对字符添加限制。但在处理用户允许使用的密码和用户名时，最好不要使用固定长度。\n\n### 可变字符\n\n你也可以处理可变字符，而不是我们上面提到的固定长度字符。与其告诉用户允许使用多少个字符，不如允许用户选择这应该有多长。当你处理诸如姓名等字段时（根据人的不同，很容易产生变化的长度），以及用户名或用户想要使用以使其唯一的密码时，这是一个很好的选择。如果你有一个想要这种方式使用的字段，你使用的记法包括：\n\
  \n`CHARACTER VARCHAR (n)`\n\n对于这种特定数据类型，在为用户填充空间时你没有必须满足的限制。如果你分配了 15 个字符的长度，用户如果他们愿意，可以添加较少的内容，你不会遇到像在使用固定长度时可能遇到的问题。\n\
  \n\n\n\n\n每当你处理某些在你的语言中可以被视为变量的字符串时，你都应该确保尽可能使用不同的数据类型。之所以这样做是因为这可以让你最大限度地利用数据库空间，并让用户更容易输入信息，而不会在此过程中干扰数据库。\n\
  \n### 数值类型 (NUMERIC VALUES)\n\n现在我们将看看这些数值值在 SQL 代码中是如何工作的。在 SQL 系统中，你可以随随地使用数值值。这些值是你直接使用数字而不是字母存储在字段中的值。根据你想要在代码中使用的数值类型，这些值会有不同的名称。不过，有一些是比较常用的，其中包括：\n\
  \n* `Bit varying(n)`\n* `Double precision`\n* `Integer`\n* `Float`\n* `Bit`\n* `Real`\n\
  * `Decimal`\n\n### 字面量字符串 (LITERAL STRINGS)\n\n当你使用 SQL 时，还可以查看并处理的另一项内容是“字面量字符串”。这些字符串由一系列字符组成，例如名称列表和电话号码列表，由用户或数据库指定。在大多数情况下，你会发现这些字符串包含许多具有相似特征的数据。\n\
  \n每当你处理字面量字符串时，有时会遇到难以指定想要使用什么类型数据的问题。因此，你会花费时间指定你想要使用的字符串类型，以确保一切运行正常。很好的一点是，当你努力创建这些字符串时（特别是当字符串最终是字母数字组合时），你需要确保使用可以包裹这些内容的引号。你可以选择使用单引号或双引号，只需确保在单词的两侧使用相同的引号以帮助编译器识别即可。\n\
  \n### 布尔值 (BOOLEAN VALUES)\n\n你还能够处理所谓的布尔值（Boolean values）。这些布尔值非常重要，因为它们在 SQL 系统内部会执行许多不同的功能，这可以让你你想要执行的某些搜索工作变得更简单。当你处理布尔值时，会有三个选项。这三个选项别是\
  \ `true`、`false` 和 `null`。\n\n在处理布尔值时，你还会发现当你想要比较表中的多个数据单元时，使用这些值是有帮助的。你可以使用这些单元并判断它们是否匹配，然后根据布尔值获得正确的答案。例如，你可以在\
  \ SQL 中使用它来指定搜索参数，而返回给你的所有条件将根据你尝试比较的内容表现为 `true`、`false` 或 `null`。\n\n使用这类值时，你应该注意，只有当答案为\
  \ `true` 时它才会给你结果。如果这些值的答案结果是 `null` 或 `false`，则不会从数据库中为你或用户检索数据。然而，如果你最终得到值为 `true`，你会发现所有信息都是\
  \ `true` 并向你显示。\n\n观察此问题的好方法是：当用户在数据库中并想要查找某些东西时。如果产品关键词与用户在搜索栏中输入的内容匹配，就会显示 `true`\
  \ 答案，而其他所有内容都将被排除。\n\n如果你有自己的网站并在网上销售商品，你会发现你将花费大量时间处理这些布尔值。这些值将确保你能够在程序中显示正确的结果。因此，如果用户浏览并输入了他们想要在代码中找到的关键词，布尔值将检查该关键词并找到符合的结果。\n\
  \n不要担心这听起来很复杂，SQL 系统能够以简单的方式帮助你完成工作，让你的客户能够找到他们想要的东西，而无需担心或与网站作斗。\n\n在许多不同的应用程序中你可以使用\
  \ SQL 中的布尔表达式，但作为初学者，这可能是你使用最频繁的方法。当你想要查看数据库并为问题寻找特定答案，或者当你正在浏览商店或程序并想要查找特定信息时，也可以使用它。当你将其中的一些信息添加到\
  \ SQL 表格中时，你可以比以前任何时候都加快这个过程。\n\n记住这些布尔结果如何工作是非常重要的。它们负责决定某物是否与你搜索的内容匹配。如果某物与你放入系统的关键词匹配，它们就会显示。但如果其他对象或项目与此不匹配，它们将显示为\
  \ `false` 或 `null` 且不会显示。\n\n假设你正在使用一个网站销售某些产品，例如服装。有人进入你的网站，想要寻找可以在特殊场合穿的连衣裙。如果他们在搜索栏中输入“dress”（连衣裙）一词，你希望确保他们能看到他们想要产品，而不是其他的。\n\
  \n通过这些布尔值，这种情况就会发生。如果用户在系统中输入‘dress’，布尔值将遍历每个项目并检查它们是否为 `true`。如果项目与此不匹配，它们将显示为\
  \ `false` 或 `null` 且不会显示。\n\n这对于任何在线销售商品的人来说都可能非常有用，特别是当他们有大量的库存可供选择，并且像 SQL 这样的程序筛选大量数据来解决问题时。布尔值将为你完成所有工作。\n\
  \n正如你在本章中看到的，有很多数据类型供你处理。每种数据类型的工作方式都不同，以便为你提供正确的结果并获得比你需要的更多的。\n\n# 第 3 章：什么是数据定义语言\
  \ (DATA DEFINITION LANGUAGE)\n\n\n\n\n\n这一类别被称为“DDL”（数据定义语言），它是你需要学习 SQL 内部知识的内容之一。它允许你在按照最适合你的方式安排对象之前，在数据库中生成对象。例如，每当你想要对表进行更改时（例如添加或删除对象），都应该使用\
  \ SQL 系统的这一部分。你可以使用一些命令来帮助查看这些更改。这些命令包括：\n\n*   `Create a table`\n*   `Alter a table`\n\
  *   `Drop a table`\n*   `Create index`\n*   `Alter an index`\n*   `Drop view`\n\
  *   `Drop index`\n\n## 数据操作语言 (DATA MANIPULATION LANGUAGE)\n\n你在 SQL 语言内部处理的下一步是数据操作语言。在处理\
  \ SQL 时，它被称为“DML”，当你尝试修改数据库内部的对象时就可以使用这部分。这将让你的用户和你自己在查看数据库中的信息时拥有更大的自由度，并允许你添加新内容以帮助数据库运行得更好。\n\
  \n## 数据查询语言 (DATA QUERY LANGUAGE)\n\n当你使用数据查询语言或“DQL”时，你将处理许多专家认为 SQL 系统所能实现的功能中最强大的部分。如果你想在该程序中使用\
  \ DQL，你只需要一个命令即可让其运行。你需要使用的以实现此功能的命令是 `Select`。这是一个易于使用的命令，可以为你提供多种处理事务的方法，包括在关系型数据库内部运行查询。如果你感兴趣查看更详细详细的结果，你需要确保你正在通过\
  \ DQL 使用这个 `select` 命令。\n\n## 数据控制语言 (DATA CONTROL LANGUAGE)\n\n数据控制语言是 SQL 的另一部分，当你想要为你编写的代码添加更多功能时，应该学习如何使用它。当你想要更进一步控制谁可以访问数据库时，这效果非常好。如果你的公司能够处理客户的个人信息（例如信用卡信息），使用数据控制语言是一个好主意，这样你就可以对谁可以使用这些数据库并访问信息设置限制。DCL\
  \ 命令将用于帮助生成控制谁访问数据库信息的对象，以确保只有正确的人进入数据库。你可以控制谁可以进入数据库、谁可以分发数据库中的信息等。在 DCL 内部可以使用的一些命令包括：\n\
  \n*   `revoke`\n*   `alter password`\n*   `Grant`\n*   `create synonym`\n\n## 数据管理命令\
  \ (DATA ADMINISTRATION COMMANDS)\n\n当你使用在 SQL 系统内运行良好的命令时，你也能找到一些可以分析和审计数据库内部操作的命令。有时某些，你也可以通过这些命令访问数据库的整体性能。如果你想修复数据库内部不按你预期工作的内容，或者你想确保消除影响系统的漏洞，可以使用这些命令。虽然有不同的选项供你选择，但你最可能使用的两个选项是：\n\
  \n*   `Start audit`\n*   `Stop audit`\n\n你在处理 SQL 系统时需要考虑的一点是，在该系统中工作时，数据库管理员（DBA）和数据管理员（DA）是两个不同的概念。因此，数据库管理员是管理你数据库所有部分的代码部分，例如你在\
  \ SQL 内部设置的命令，这些命令在 SQL 的具体实现上会更针对性。\n\n## 事务命令 (TRANSACTIONAL COMMANDS)\n\n很多时候，你可能想要管理和跟踪数据库内部的事务。如果你尝试在数据库中执行此操作，应该使用事务控制命令来让其运行。如果你是一家拥有自己网站销售产品的公司，你会发现这些命令将帮助你保持一切井有条。你可以使用这些事务控制命令的用途有很多：\n\
  \n*   `Commit`: 当你想要保存与数据库中出现的不同事务相关的信息时，可以使用此命令。\n*   `Savepoint`: 每当你想要在事务组内部生成不同的点时，你将需要使用此命令。你还需要配合我们稍后会提到的\
  \ `rollback` 命令一起使用。\n*   `Rollback command`: `rollback` 命令是你想要查看数据库并想看看哪些内容可以撤销时将使用的命令。\n\
  *   `Set transactions`: 当你尝试获取数据库中的事务并给它们命名时，可以使用此命令。如果你想对事物进行标记以便更于组织，就会使用 `set\
  \ transaction`。\n\n当你想要在 SQL 内部工作时，学习如何操作所有六类类别是非常重要的。它们将帮助你从搜索中获得更多收获，使数据库为你提供你正在寻找的信息。我们将在本指南中花时间进一步探索这些内容，以便你更好地使用它们。理解\
  \ SQL 系统自带的一些基础知识将帮助你在使用它时获得最佳结果。\n\n# 第 4 章节：学习如何添加、删除和更新数据\n\n## 创建数据库\n\n在 SQL\
  \ 中，我们使用 `CREATE DATABASE` 创建新数据库。该命令的语法如下：\n\n```\nCREATE DATABASE DatabaseName\n\
  ```\n\n假设我们需要创建一个名为 `Company1` 的数据库。我们可以执行以下命令：\n\n```\nCREATE DATABASE Company1;\n\
  ```\n\n数据库应该创建成功。现在数据库已经创建，你可以运行 `SHOW DATABASES` 命令来检查操作是否成功：\n\n```\nSHOW DATABASES;\n\
  ```\n\n## NOT EXISTS\n\n你可以在服务器上拥有多个数据库。你可能不是唯一访问 SQL 服务器的人员。在这种情况下，你可能会尝试创建一个已经存在的数据库`IF\
  \ NOT EXISTS` 子句允许你在创建之前检查是否存在同名的数据库。\n\n只有当指定的数据库不存在时，才会创建它。如果数据库已存在，则不会发生任何变化。如果你在没有\
  \ `IF NOT EXISTS` 子句的情况下尝试重建已存在的数据库，MySQL 将抛出错误。让我们尝试重新创建 `Company1` 数据库：\n\n```\n\
  CREATE DATABASE Company1;\n```\n\n\n\n\n语法显示 `CREATE TABLE` 命令后跟的是要创建的表名，然后是列。你可以使用\
  \ `PRIMARY KEY` 关键字指定某一列为主键。\n\n然而，在创建表之前，你必须选择你想要创建表的数据库。请注意，表是在数据库中创建的。使用 `USE`\
  \ 命令选择数据库。在案例中，我们需要在 `Company1` 数据库中创建表。我们可以通过运行以下命令来选择数据库：\n\n```\nUSE Company1;\n\
  ```\n\n![Description: 00005.gif](img/00162.gif)\n\n数据库已选择。现在让我们创建表：\n\n![Description:\
  \ 00006.gif](img/00163.gif)\n\n表已成功创建。`NOT NULL` 参数意味着该列必须有值，因此表中的每条记录其 `ID` 列都必须有一个值。\n\
  \n要查看表的详情，我们可以使用 `DESC` 命令。它是 `DESCRIBE` 的缩写，后面跟着表名：\n\n![Description: 00007.gif](img/00164.gif)\n\
  ```\nDESC EMPYEES;\n```\n\n上面的内容显示表已成功创建。\n\n### IF NOT EXISTS\n\n该子句帮助我们在表不存在时创建它。如果表已经在数据库中存在，它将不会被创建。让我们尝试重新创建一个已经存在的表。我们已经有一个\
  \ `EMPLOYEE` 表。让我们尝试在不使用此子句的情况下重新创建它：\n\n```sql\nCREATE TABLE EMPLOYEE(\n  ID INT\
  \ NOT NULL,\n  NAME VARCHAR (15) NOT NULL,\n  ADDRESS CHAR (20) ,\n  AGE INT NOT\
  \ NULL,\n  SALARY DECIMAL (16, 2),\n  PRIMARY KEY (ID)\n);\n```\n\n![Description:\
  \ 00008.jpeg](img/00165.jpeg)\n\n命令返回一个表已存在的错误。为了避免在表存在时报错，我们可以像下面一样使用 `IF NOT EXISTS`\
  \ 子句：\n\n```sql\nCREATE TABLE IF NOT EXISTS EMPLOYEE(\n  ID INT NOT NULL,\n  NAME\
  \ VARCHAR (15) NOT NULL,\n  ADDRESS CHAR (20) ,\n  AGE INT NOT NULL,\n  SALARY DECIMAL\
  \ (16, 2),\n  PRIMARY KEY (ID)\n);\n```\n\n![Description: 00009.gif](img/00166.gif)\n\
  \n命令将返回如下：这一次，命令没有返回错误。\n\n### 插入数据\n\n数据库系统的目的是在表中存储数据。这些数据由运行在数据库之上的应用程序提供。SQL\
  \ 拥有 `INSERT` 命令，帮助我们将数据输入到表中进行存储。该命令在表中创建新行。\n\n该命令的语法如下：\n\n```sql\nINSERT INTO\
  \ tableName(column_1,column_2,...)\nVALUES (value1, value2, ...);\n```\n\n请注意，我们指定了要插入数据的表名，后面接着是需要插入数据的列名，然后是待插入的数据值。如果你需要将数据插入到表的所有列，则不需要指定列名。然而，如果我们只需要向某些列插入数据而跳过其他列，请指定需要插入数据的列。以下命令显示了如何向表的所有列插入数据：\n\
  \n```sql\nINSERT INTO EMPLOYEE VALUES (1, 'John1', 26, 3000 );\n```\n\n![Description:\
  \ 00010.jpeg](img/00167.jpeg)\n\n如上所示，命令执行成功。这意味着表中创建了一行数据。然而，你可能只需要向某些列插入数据。这时，你必须指定需要插入数据的列名。假设我们不知道员工的工资。我们可以像下面所示向其他列插入数据：\n\
  \n```sql\nINSERT INTO EMPLOYEE (ID, NAME, AGE) VALUES (2, 'Mercy', 25);\n```\n\n\
  ![Description: 00011.jpeg](img/00168.jpeg)\n\n工资列未受上述命令影响。\n\n## 查看表\n\n数据库的工作是存储可以检索的数据。数据的检索通过运行\
  \ `SELECT` 命令完成。以下是该命令的语法：\n\n```sql\nSELECT column_1, column_2, …, column_N FROM\
  \ tableName;\n```\n\n`column_1, column_2, …, column_N` 表示需要查看数值的表列名。如果你需要从所有列/字段中查询数据，请使用以下语法的命令：\n\
  \n```sql\nSELECT * FROM tableName;\n```\n\n到目前为止，我们的 `EMPLOYEE` 具有所示的数据：\n\n![Description:\
  \ 00012.gif](img/00169.gif)\n\n假设我们需要查看 `ID`、`NAME` 和 `SALARY`。我们可以运行以下命令来查询：\n\n\
  ```sql\nSELECT ID, NAME, SALARY FROM EMPLOYEE;\n```\n\n![Description: 00013.gif](img/00170.gif)\n\
  \n命令返回指定的列。如果我们需要从所有列查询数据，运行以下语法的命令：\n\n```sql\nSELECT * FROM EMPLOYEE;\n```\n\n\
  ![Description: 00014.gif](img/00171.gif)\n\n### WHERE 子句\n\nWHERE 子句帮助我们在从表中检索时指定条件。当使用\
  \ `WHERE` 子句时，只返回符合条件的记录。注意 `WHERE` 子句不仅用于 `SELECT` 语句，还可以用于其他 SQL 语句。语法如下：\n\n\
  ```sql\nSELECT column_1, column_2, …,\nFROM\nWHERE condition\n```\n\n有多种比较运算符可以指定条件，包括\
  \ `=`, `NOT`, `LIKE` 等。\n\n假设我们需要选择 `EMPLOYEE` 表 `AGE` 为 25 的行。我们可以运行以下命令：\n\n```sql\n\
  SELECT *\nFROM EMPLOYEE\nWHERE AGE = 25;\n```\n\n这返回 `AGE` 为 25 的行。\n\n假设我们需要查询\
  \ `SALARY` 大于 1000 的所有员工姓名。运行以下命令：\n\n```sql\nSELECT NAME\nFROM EMPLOYEE\nWHERE\
  \ SALARY > 1000;\n```\n\n返回工资大于 1000 的员工。\n\n假设我们需要查看名为 \"Mercy\" 的员工详情，我们可以运行以下命令：\n\
  \n```sql\nSELECT *\nFROM EMPLOYEE\nWHERE NAME = \"Mercy\";\n```\n\n这返回结果：\n\n###\
  \ 逻辑操作符\n\n逻辑操作符在查询数据库时帮助我们组合多个条件。它们为我们提供在一个 SQL 语句中进行多次比较的方法。我们将讨论逻辑 `AND`、`OR`。\n\
  \n### AND 运算符\n\n`AND` 运算符用于 `WHERE` 子句，允许我们指定多个条件。为了让 SQL 语句返回结果，由 `AND` 运算符连接的所有条件必须为真。\n\
  \n假设 `EMPLOYEE` 表具有所示的数据：\n\n![Description: 00018.gif](img/00175.gif)\n\n假设我们需要查看\
  \ `age` 低于 30 且 `SALARY` 高于 2500 的员工详情，我们可以运行以下命令：\n\n```sql\nSELECT *\nFROM EMPLOYEE\n\
  WHERE age < 30 AND SALARY > 2500;\n```\n\n该命令返回两条记录。这两条记录了 `WHERE` 子句指定的所有条件。\n\n\
  ### OR 运算符\n\n`OR` 运算符同样帮助我们在 SQL 的 `WHERE` 子句中组合多个条件。为了查询返回结果，由 `OR` 运算符连接的条件之一必须为真。\n\
  \n\n\n我们将使用包含以下数据的 `EMPLOYEES` 表：\n\n假设我们需要查看 `AGE` 等于或大于 30，或者 `SALARY` 等于或大于 3000\
  \ 的员工 `Name`、`Age` 和 `Salary`。我们运行以下命令：\n\n```sql\nSELECT NAME, AGE, SALARY\nFROM\
  \ EMPLOYEES\nWHERE age <= 30 OR SALARY >= 3000;\n```\n\n![Description: 00021.gif](img/00178.gif)\n\
  \n有 5 条记录满足条件。请注意，记录只需要满足条件之一，而不是两个条件都满足。\n\n## 删除记录\n\n有时，你可能需要从表中删除某些记录。可以使用 `DELETE`\
  \ 子句成功完成此操作。\n\n如果你只需要从表中删除某些特定的记录，请将 `DELETE` 子句与 `WHERE` 子句结合。否则，表中的所有记录将被删除。\n\
  \n`DELETE` 命令采用语法如下所示：\n\n```sql\nDELETE FROM tableName\nWHERE [condition];\n```\n\
  \n如果你有多个条件，请使用 `AND` 或 `OR` 子句将它们组合起来。\n\n我们的 `EMPLOYEES` 表具有以下数据：\n\n![Description:\
  \ 00025.gif](img/00179.gif)\n\n让我们根据名称“jOHN”从表中删除员工：\n\n```sql\nDelete from Employee\n\
  WHERE NAME = \"jOHN\";\n```\n\n![Description: 00026.gif](img/00180.gif)\n\n你可以运行\
  \ `SELECT` 命令来检查记录是否成功删除。\n\nSQL 的用处在于它对大小写不敏感，这意味着即使你输入的名称大小写与数据库中存储的不匹配，删除也会成功完成。\n\
  \n如果你的目标是删除表中包含的所有记录，不需要将 `DELETE` 语句与 `WHERE` 子句结合。你只需要运行如下命令：\n\n```sql\nDELETE\
  \ * FROM EMPLOYEES;\n```\n\n该命令将删除 `EMPLOYEES` 表中包含的所有记录。\n\n# 第 5 章 如何从 SQL 表中选择数据\n\
  \n从数据库中选择数据可以通过 `SELECT` 关键字来实现。你只需要指定你想要选择的数据。\n\n### 步骤 #1– 选择 `SELECT` 语句\n\n\
  选择 `SELECT` 来识别你的 SQL 命令。\n\n### 步骤 #2– 选择列\n\n选择你想要检索数据的特定列。\n\n示例：`SELECT\"column_name\"\
  `\n\n### 步骤 #3– 使用星号 * 选定所有列\n\n如果你想选择所有列，请使用 `*`，你也可以选择任意数量的列。\n\n示例：``SELECT\"\
  column_name1\" [\"column_name2\",\"column_name3\"]`\n\n### 步骤 #4– 添加 FROM 和数据来源的表名\n\
  \n你可以使用用左方括号和右方括号 `[ ]` 将确定的列和条件条件括起来，但这是可选的。\n\n示例：\n```sql\nSELECT\"column_name\"\
  \ [\"column_name\",\"column_name\"]\nFROM 'table_name\"\nWHERE \"column_name\";\n\
  ```\n\n你也可以以这种方式编写上面的示例：\n\n```sql\nselect column_name, column_name, column_name\n\
  from table_name\nwhere column_name;\n```\n\n### 步骤 #5– 指定“条件”\n\n你可以通过第 4 章介绍的常用操作符指定条件。\n\
  \n示例 #1:\n```sql\nSELECT\"column_name\" [\"column_name\",\"column_name\"]\nFROM\
  \ 'table_name\"\nWHERE\"column_name\" \"condition\";\n```\n你也可以以这种方式编写上面的示例（不使用方括号）：\n\
  \n示例 #2:\n```sql\nselect column_name, column_name, column_name\nfrom table_name\n\
  where column_name condition;\n```\n\n示例 #3:\n```sql\nSELECT\"column_name\" [\"column_name\"\
  ,\"column_name\"]\nFROM \"table_name\"\nWHERE column_name LIKE'Am';\n```\n在上面的示例中，所有以‘Am’开头或匹配‘Am’的条目将被显示。\n\
  \n示例：\n```sql\nSELECT\"column_name\"\nFROM \"table_name\"\nWHERE \"column_name\"\
  ='America’;\n```\n在上面的示例中，只有完全匹配‘America’的行会被选中。\n\n记住：在使用实际表名列列时可以去掉双引号。\n\n##\
