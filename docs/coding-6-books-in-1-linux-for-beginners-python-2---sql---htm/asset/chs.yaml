  \n在这种情况下，`WHERE` 子句可以分配任何类型的 SQL 表达式。无论你想要基于什么进行连接，都是一个条件，你可以将其理解为对值的临时限制。\n\n```sql\n\
  SELECT a.A, b.B, a.A\nFROM A a, A b\nWHERE a.B < b.B;\n```\n\n接下来，让我们来看看笛卡尔积连接（CARTESSIAN\
  \ or CROSS JOIN）。这是一种连接类型，会输出两个数据点集的笛卡尔积。这些数据必须来自 2 张表，最多可达 N 张表。这等同于一种内连接（INNER\
  \ JOIN），其连接条件始终为真，或者从根本没有连接条件。它的语法非常简单：\n\n```sql\nSELECT table01.column01,table02.column02...column0N\n\
  FROM table01,table02,table03...table0N\n```\n\n就是这样！笛卡尔连接听起来真的比实际上要复杂得多。\n\n## UNIONS（并集）\n\
  \nSQL 中的 Unions 是子句用于组合至少两个但最多 N 个不同 SELECT 语句的输出，同时忽略任何可能的重复行。\n\n现在，你不能对每个 SELECT\
  \ 语句使用 UNION 子句，它们有几个需要满足的条件：\n\n- 两个 SELECT 语句必须具有相同数量的选择列\n- SELECT 语句中的每一列必须与其内部的表达式计数具有完全相同的数值值\n\
  - SELECT 语句中的所有列必须包含相同的数据类型\n- SELECT 语句中的每一列其数据点必须以相同的顺序。注意，它们的长度不需要完全相同。这意味着你可以将一个\
  \ 0.02 的浮点数与一个 20 的浮点数进行 UNION。\n\nUNION 操作有一个通用语法，如下所示：\n\n```sql\nSELECT column01\
  \ [, column02 ]\nFROM table01 [, table02 ]\n[WHERE your_ condition]\n```\n这里的 `your_condition`\
  \ 指你为这两个 SELECT 语句进行 UNION 而设置的条件。\n\n```sql\nUNION\nSELECT column01 [, column02\
  \ ]\nFROM table01 [, table02 ]\n[WHERE your_condition]\n```\n\n现在让我们看看其中一个在实际操作中是什么样子，将\
  \ A、B 等替换为列和表。\n\n```sql\nSELECT A, B, C, D\nFROM TABLEA\nLEFT JOIN TABLEB\nON A.ID\
  \ = B.B_ID\nUNION\n  SELECT A, B, C, D\n    FROM TABLEA\n  LEFT JOIN TABLEB\nON\
  \ A.ID = B.B_ID\n```\n\n好了，这就是大意！希望这能帮你更好地记住 UNION 语句。接下来，让我们看看 UNION ALL 子句。该运算符用于组合两个\
  \ SELECT 语句的结果，与之前的子句非常，但它也包含重复行。\n\n适用于 UNION ALL 子句的规则与 UNION 子句的相同：\n\n- 两个 SELECT\
  \ 语句必须具有相同数量的选择列\n- SELECT 语句中的每一列必须与其内部的表达式计数具有完全相同的数值值\n- SELECT 语句中的所有列必须包含相同的数据类型\n\
  - SELECT 语句中的每一列其数据点必须以相同的顺序。注意，它们的长度不需要完全相同。这意味着你可以 UNION ALL 一个 0.02 的浮点数与一个 20\
  \ 的浮点数\n\nUNION ALL 的基础语法加上示例如下：\n\n```sql\nSELECT column01 [, column02 ]\nFROM\
  \ table01 [, table02 ]\n[WHERE your_condition]\nUNION ALL\nSELECT column01 [, column02\
  \ ]\nFROM table01 [, table02 ]\n[WHERE your_condition]\n```\n\n```sql\nSELECT A,\
  \ B, C, D\nFROM A\n  LEFT JOIN B\nON A.ID = B.A_ID\nSELECT A, B, C, D\nFROM A\n\
  \  RIGHT JOIN B\nON A.ID = B.A_ID\n```\n\n还有两个运算符的行为与 UNION 子句非常相似，它们是 INTERSECT（交集）和\
  \ EXCEPT（差集）运算符。\n\n理解这些最简单的方法是从集合论的角度。两个 UNION 是集合论中的集合并，而 INTERSECT 和 EXCEPT 的作用也与集合论中的操作完全一致。INTERSECT\
  \ 运算符将返回第一个和第二个 SELECT 语句中相同的元素。将其想象为显示两张表的共同点。\n\nINTERSECT 语句的通用语法为：\n\n```sql\n\
  SELECT column01 [, column02 ]\nFROM table01 [, table02 ]\n[WHERE your_ condition]\n\
  ```\n这里的 `your_condition` 指你为这两个 SELECT 语句进行 UNION 而设置的条件（注：此处原文应为 INTERSECT 条件）。\n\
  \n```sql\nINTERSECT\nSELECT column01 [, column02 ]\nFROM table01 [, table02 ]\n\
  [WHERE your_condition]\n```\n\n```sql\nSELECT A, B, C, D\nFROM TABLEA\n  LEFT JOIN\
  \ TABLEB\nON A.ID = B.B_ID\nINTERSECT\n  SELECT A, B, C, D\nFROM TABLEA\n  LEFT\
  \ JOIN TABLEB\nON A.ID = B.B_ID\n```\n\nEXCEPT 运算符与 INTERSECT 完全相反。INTERSECT 运算符输出两个\
  \ SELECT 语句的共同点，而 EXCEPT 运算符输出它们的差异。它同样遵循 UNION 运算符的规则，并且 MySQL 不支持。它的语法为：\n\n```sql\n\
  SELECT column01 [, column02 ]\nFROM table01 [, table02 ]\n[WHERE your_ condition]\n\
  EXCEPT\nSELECT column01 [, column02 ]\nFROM table01 [, table02 ]\n[WHERE your_condition]\n\
  ```\n\n```sql\nSELECT A, B, C, D\nFROM TABLEA\n  LEFT JOIN TABLEB\nON A.ID = B.B_ID\n\
  EXCEPT\n  SELECT A, B, C, D\nFROM TABLEA\n  LEFT JOIN TABLEB\nON A.ID = B.B_ID\n\
  ```\n\n最后，我们需要看一个特殊情况。SQL 的 NULL 值用于表示未声明的值。表中的任何 NULL 值都会出现并显示为空。如果一个字段的值为 null，意味着它没有值，但与\
  \ 0 的意义不同。例如，你拥有的额外额头数量是 0，但独角兽的数量可能是 0，但也可能是 null。\n\n\n\n\n在本章，你将学习如何使用 SQLiteStudio\
  \ 使用三种常用的 SQL 事务命令：`COMMIT`、`ROLLBACK` 和 `SAVEPOINT`。控制此类事务需要用户管理某些由 DML 命令（`insert`、`update`\
  \ 和 `delete`）引起的数据库更改。\n\n当数据库事务成功执行后，表的数据或结构将会被更改。在事务执行期间，信息将存储在临时数据库空间或所谓的 `rollback\
  \ area`（回滚区域）中。完成这些事务并永久保存对数据库的更改，请执行相应的事务命令。只有在此过程之后，`rollback area` 才会被清空。\n\n\
  ## COMMIT\n\nSQL `COMMIT` 语句负责将所有事务保存到数据库中。你已经在第 6 章通过 `COMMIT CHANGES STRUCTURE`\
  \ 按钮遇到过此命令（在创建 `Customer_TBL` 表的副本时）。现在，使用 SQLiteStudio，你将在 `GRID VIEW` 视图模式下添加新记录来操作\
  \ `Customer_TBL` 表的结构。\n\n点击 ![Description: 00042.gif](img/00181.gif) 选项进入 `SQL\
  \ EDITOR`。要结束数据库中当前运行的所有事务，在 `QUERY` 标签页中输入以下编程行，并点击 `EXECUTE QUERY` 按钮 ![Description:\
  \ 00124.jpeg](img/00182.jpeg) ：\n\n```\nEND TRANSACTION;\n```\n\n![Description:\
  \ 00125.jpeg](img/00183.jpeg)\n\n在 `DATABASE NAVIGATOR` 面板的 `TABLES` 列表中双击 `Customer_TBL`\
  \ 表。点击右侧的 `DATA` 标签，确保显示的是 `GRID` 视图。`Customer_TBL` 表的所有记录现在都显示出来了。\n\n![Description:\
  \ 00126.jpeg](img/00184.jpeg)\n\n点击包含 `CustomerID = 5` 的单元格，它是表中第一列的最后一行。\n\n![Description:\
  \ 00127.jpeg](img/00185.jpeg)\n\n从 `INSERT ROW (INS)` 按钮旁边的下拉箭头中选择 `PLACE NEW ROWS\
  \ BELOW SELECTED ROW` 选项。\n\n![Description: 00128.jpeg](img/00186.jpeg)\n\n要查看添加到表的新空行，请点击\
  \ `INSERT ROW (INS)` 按钮。\n\n![Description: 00129.jpeg](img/00187.jpeg)\n\n在新的表记录中添加以下数据值：\n\
  \n![Description: 00130.jpeg](img/00188.jpeg)\n\n![Description: 00131.jpeg](img/00189.jpeg)\n\
  \n为了永久存储添加的新数据值，点击 `COMMIT` 按钮 ![Description: 00132.jpeg](img/00190.jpeg)。\n\n##\
  \ ROLLBACK\n\nSQL `ROLLBACK` 语句是 `COMMIT` 命令的反操作，所有未保存的更改都将被丢弃。然而，事务只能撤销自上次执行 `COMMIT`\
  \ 或 `ROLLBACK` 语句。\n\n语法：\n\n```\nROLLBACK [WORK];\n```\n\n此外，在执行 `ROLLBACK` 命令之前，确保事务已经开始。\n\
  \n语法：\n\n```\nBEGIN TRANSACTION;\n```\n\n为了在 SQLiteStudio 中演示 `ROLLBACK` 语句的工作原理，你将修改\
  \ `DROP TABLE` 命令：\n\n点击 ![Description: 00133.jpeg](img/00191.jpeg) 选项进入 `QUERY`\
  \ 标签页。输入以下编程行，然后点击 `EXECUTE QUERY` 按钮 ![Description: 00134.jpeg](img/00192.jpeg)\
  \ ：\n\n```\nBEGIN TRANSACTION;\n```\n\n![Description: 00135.jpeg](img/00193.jpeg)\n\
  \n返回 `SQL EDITOR` 并清空 `QUERY` 标签页。这次，输入以下代码，然后点击 `EXECUTE QUERY` 按钮 ![Description:\
  \ 00136.jpeg](img/00192.jpeg)。这将会从 `TABLES` 列表中删除 `Customer_TBL` 表。\n\n```\nDROP\
  \ TABLE Customer_TBL;\n```\n\n![Description: 00137.jpeg](img/00194.jpeg)\n\n再次删除\
  \ `QUERY` 标签页的内容并输入以下命令语句。点击 `EXECUTE QUERY` 按钮 ![Description: 00138.jpeg](img/00192.jpeg)。这将撤销对\
  \ `Customer_TBL` 表的删除。\n\n```\nROLLBACK;\n```\n\n![Description: 00139.jpeg](img/00195.jpeg)\n\
  \n要检查 `ROLLBACK` 命令执行是否成功，右键点击 `DATABASE NAVIGATOR` 面板内的任意位置，然后选择 `REFRESH ALL DATABASE\
  \ SCHEMAS` 选项。\n\n![Description: 00140.jpeg](img/00196.jpeg)\n\n现在，点击左侧面板上的 `TABLE`\
  \ 列表，发现 `Customer_TBL` 表回来了。\n\n![Description: 00141.jpeg](img/00197.jpeg)\n\n##\
  \ SAVEPOINT 命令\n\n当你只想将特定的事务撤销到某个点而不是整个数据库事务时，会执行 SQL `SAVEPOINT` 语句。这在 `ROLLBACK`\
  \ 操作之前执行。通过这种方式，你可以将事务分成小组小组。\n\n语法：\n\n```\nSAVEPOINT name;\n```\n\n你也可以使用 `SAVEPOINT`\
  \ 和 `ROLLBACK` 命令。\n\n语法：\n\n```\nROLLBACK TO name;\n```\n\n对象的名称（你想要拆分的对象）可以作为名称使用。然而，为了演示\
  \ `SAVEPOINT` 与 `ROLLBACK` 如何配合，请先从数据库中删除一些记录。\n\n点击 ![Description: 00142.jpeg](img/00198.jpeg)\
  \ 选项并清空 `QUERY` 标签页。输入以下行并点击 `EXECUTE QUERY` 按钮 ![Description: 00143.jpeg](img/00199.jpeg)\
  \ ：\n\n```\nBEGIN TRANSACTION;\n```\n\n![Description: 00144.jpeg](img/00200.jpeg)\n\
  \n清空 `QUERY` 标签页，输入以下代码并点击 `EXECUTE QUERY` 按钮 ![Description: 00145.jpeg](img/0202.jpeg)。这将创建一个保存点。\n\
  \n```\nSAVEPOINT SP1;\n```\n\n![Description: 00146.jpeg](img/00201.jpeg)\n\n要从数据库中删除最后记录，清空\
  \ `QUERY` 标签页。输入以下行并点击 `EXECUTE QUERY` 按钮 ![Description: 00147.jpeg](img/00192.jpeg)\
  \ ：\n\n```\nDELETE FROM Customer_TBL WHERE CustomerID = 6;\n```\n\n![Description:\
  \ 00148.jpeg](img/00203.jpeg)\n\n要检查记录是否已删除，双击 `DATABASE NAVIGATOR` 面板中 `TABLES`\
  \ 列表下的 `Customer_TBL` 表。点击右侧的 `DATA` 标签并点击 `REFRESH TABLE DATA` 按钮 ![Description:\
  \ 00149.jpeg](img/00210.jpeg)（按下键盘 F5）。你看到的表如下：\n\n![Description: 00150.jpeg](img/00211.jpeg)\n\
  \n现在，再次点击 ![Description: 00151.jpeg](img/00191.jpeg) 选项并清空 `QUERY` 标签页。输入以下行并点击\
  \ `EXECUTE QUERY` 按钮 ![Description: 00152.jpeg](img/00206.jpeg)，创建第二个保存点。\n\n```\n\
  SAVEPOINT SP2;\n```\n\n![Description: 00153.jpeg](img/00207.jpeg)\n\n通过清空 `QUERY`\
  \ 标签页并输入以下行来删除 `CustomerID = 5` 的记录。点击 `EXECUTE QUERY` 按钮 ![Description: 00154.jpeg](img/00182.jpeg)\
  \ ：\n\n```\nDELETE FROM Customer_TBL WHERE CustomerID = 5;\n```\n\n![Description:\
  \ 00155.jpeg](img/00208.jpeg)\n\n要检查记录是否已删除，点击屏幕左下角的 ![Description: 00156.jpeg](img/00209.jpeg)\
  \ 选项。点击右侧的 `DATA` 标签，并在 `GRID VIEW` 标签下，点击 `REFRESH TABLE DATA` 按钮 ![Description:\
  \ 00069.jpeg](img/00210.jpeg)（按下键盘 F5）。你看到的表应该与所示：\n\n![Description: 00157.jpeg](img/00211.jpeg)\n\
  \n\n\n\n现在，要撤销上一次事务，请再次点击 ![Description: 00158.jpeg](img/00198.jpeg)选项并清除 `QUERY`标签页中的所有内容。输入以下代码行后，点击`EXECUTE\
  \ QUERY`按钮 ![Description: 00159.jpeg](img/00212.jpeg) ：\n\n```\nROLLBACK TO Customеr_SP2;\n\
  ```\n\n![Description: 00160.jpeg](img/00213.jpeg)\n\n要查看已删除的记录是否已撤销，点击 ![Description:\
  \ 00161.jpeg](img/00209.jpeg)选项，然后点击右侧的`DATA`标签页。点击`GRID VIEW`标签页和`REFRESH TABLE\
