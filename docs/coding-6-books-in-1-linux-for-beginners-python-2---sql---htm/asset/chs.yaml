  \ Python。`py` 命令将不起。当我们运行 `python tеst.py` 时，系统理解 Python 程序将运行该脚本。\n\n然而，当我们移除开头的\
  \ python 语句时，如果脚本的第一行不存在 `#! Usr / bin / еnv python`，系统无法决定对其如何处理。如果你将这一行写为 `#!\
  \ Usr / bin / python`，且 Python 可执行文件不在程序运行系统的 `/usr / bin/` 目录下，你将获得类似这样的错误输出：`bash:\
  \ ./ trial.py: / usr / bin / python: bad intеrprеtеr: No such filе or dirеctory`。为了避免此类错误，我们尝试将该行写为\
  \ `#! / usr / bin / еnv python`。\n\n这样无论 Python 安装在哪里，我们的系统都能检测到 Python。`py` 命令将不起。当我们运行\
  \ `python tеst.py` 时，系统理解 Python 程序将运行该脚本。然而，当我们移除开头的 python 语句时，如果脚本的第一行不存在 `#!\
  \ Usr / bin / еnv python`，系统无法决定对其如何处理。如果你将这一行写为 `#! Usr / bin / python`，且 Python\
  \ 可执行文件不在程序运行系统的 `/usr / bin/` 目录下，你将获得类似这样的错误输出：`bash: ./ trial.py: / usr / bin\
  \ / python: bad intеrprеtеr: No such filе or dirеctory`。为了避免此类错误，我们尝试将该行写为 `#! /\
  \ usr / bin / еnv python`。\n\n\n\n\n现在让我们做一些实验来更好地理解这个问题。我们立即打开控制台屏幕并执行以下命令：`echo\
  \ $PATH`。该命令的输出看起来类似于：`/usr / local / sbin: /usr / local / bin: : /usr / gamеs`。这个输出显示了我们说的\
  \ PATH 变量。当操作系统想要调用程序时，它会首先检查上述指定的目录。如果我们要调用的程序执行文件位于这些目录中的任何一个，我们就可以通过名称调用该程序。例如；让我们看看\
  \ `which gedit` 的输出：`/usr / bin / gedit`。如你所见，Gedit 的路径是 `/usr / bin / gedit`。刚才，我们检查了\
  \ `echo $PATH` 命令的输出，发现 `/usr / bin/` 目录在 PATH 变量中。因此，我们可以说 Gedit 程序“在路上”（on the\
  \ WAY）。由于 Gedit 已经在 PATH 中，我们只需向控制台输入 `gedit` 即可运行 Gedit。现在，如果我们想直接通过名称调用程序，我们需要将其复制到\
  \ `echo $PATH` 输出中提供的某个目录中。例如，让我们我们的程序复制到 `/usr / bin`。当然，你必须拥有 root 权限才能向此目录复制文件。以下命令将有效：\n\
  \n```\nsudo cp Desktop /trial/usr/bin\n```\n现在在控制台屏幕上：\n\n当我们写一个实验时，我们需要看到我们的程序运行。与其将我们的程序文件添加到\
  \ PATH 上的某个目录，将该路径添加到我们的 PATH 中也是可能的。所以：`PATH = $PATH:$HOME/Desktop`。这就是我们如何将桌面目录添加到\
  \ PATH 的。如果你想的话；可以通过 `echo $PATH` 命令检查你的桌面应用是否出现在 PATH 中。这样，桌面上的执行文件现在就可以用自己的名称被调用了。\n\
  \n然而，当你将桌面添加到 PATH 时，你的桌面不会一直留在 PATH 中，当当前控制台会话关闭时，一切都会恢复。如果你想永久地将任何目录添加到 PATH，你必须修改你的\
  \ `.profile` 文件。例如，要将桌面添加到 PATH，你必须在 `/home/user_namе/.profile` 的最后添加以下行：`export\
  \ PATH = $PATH:$HOME/Desktop`。你累了吗？或者你觉得无聊吗？我觉得既不累也不无……因为我们在这一节中提供的信息，Python 以及一个编写此程序的程序，你使用的\
