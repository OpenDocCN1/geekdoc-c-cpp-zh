    # SHELL HISTORY


    # Run the Last Command as Root


    ```

    ```sh

    $ sudo !!

    $ su -c "!!"

    ```

    ```


    If you ever forget to run a command with root privileges, you can simply repeat
    it by using sudo !! or su -c "!!".


    ```

    ```sh

    $ adduser sam

    -bash: /usr/sbin/adduser: Permission denied

    $ sudo !!

    sudo: adduser sam

    $ id sam

    uid=1007(sam) gid=1007(sam) groups=1007(sam)

    $ userdel -r sam

    -bash: /usr/sbin/userdel: Permission denied

    $ sudo !!

    ```

    ```'
  - '[PAGE 15]


    ```

    ```bash

    sudo userdel -r sam

    $ id sam

    id: sam: No such user

    $ useradd jim

    -bash: /usr/sbin/useradd: Permission denied

    $ su -c "useradd jim"

    Password:

    $ id jim

    uid=1007(jim) gid=1007(jim) groups=1007(jim)

    ```

    ```


    This exclamation mark syntax is called an event designator. An event designator
    references a command in your shell history. Bang-Bang (!!) repeats the most recent
    command, but one of my favorite uses of the event designator is to run the most
    recent command that starts with a given string. Here’s an example.


    ```

    ```bash

    $ whoami

    jason

    $ uptime

    12:33:15 up 35 min, 1 user, load average: 0.00, 0.00, 0.00

    $ df -hT /boot

    Filesystem Type Size Used Avail Use% Mounted on

    /dev/vda1 ext4 485M 55M 406M 12% /boot

    $ !u

    uptime

    12:33:29 up 35 min, 1 user, load average: 0.00, 0.00, 0.00

    ```

    ```'
  - '[PAGE 16]


    ```

    ```bash

    $ sudo !w

    sudo whoami

    root

    ```

    ```


    # Repeat the Last Command That Started with a given String


    ```

    ```bash

    $ !<string>

    ```

    ```


    This is another example of an event designator. To recall the most recent command
    that begins with `<string>`, run "!<string>". You can simply specify the first
    letter, or as much of the string to make it unique. This example demonstrates
    that concept.


    ```

    ```text

    $ who

    jason       pts/1   2014-04-06 21:04 (192.168.1.117)

    $ w

    jason       pts/1       192.168.1.117 21:04 0.00s

    0.33s 0.00s w

    $ !w

    w

    jason       pts/1       192.168.1.117 21:04 0.00s

    0.33s 0.00s w

    $ !wh

    who

    jason       pts/1   2014-04-06 21:04 (192.168.1.117)

    ```

    ```


    Here is a practical example where you check to see if a process is running, kill
    it, and confirm that it did indeed stop.


    ```

    ```bash

    $ ps -fu apache

    ```

    ```'
