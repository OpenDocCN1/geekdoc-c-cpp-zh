    ### 清空正在被写入的文件


    ```bash

    $ > file

    $ cat /dev/null > file

    ```


    要快速将文件清零，你可以将“无内容”重定向到该文件。为什么不直接删除文件再重新创建呢？因为如果一个进程在文件被删除时仍打开着它，该进程会保持文件句柄打开并继续写入该文件。只有当进程关闭文件句柄时，该文件占用的磁盘空间才会被释放。如果应用程序把
    /var 填满了，而你删除了正在打开的日志文件，/var 仍然会是满的。如果你将“无内容”重定向到文件，文件会被截断，应用程序也能继续写入该文件。


    ```bash

    $ sudo -s

    # > /var/log/maillog

    # ls -l maillog


    -rw-------. 1 root root 0 Apr 9 18:55 maillog

    ```


