    # Create an SSH Tunnel to Access Remote Resources


    ```

    $ ssh -N -L local-port:host:remote-port remote-host

    ```


    To create an SSH tunnel, use the -L option. The first port is the port that will
    be opened on your local machine. Connections to this port will be tunneled through
    remote-host and sent to the host and remote port specified in the -L option. The
    -N option tells SSH not to execute a command -- your shell -- on the remote host.


    Let''s say you want to access a website that isn''t available on the internet,
    but is accessible from a server that you have SSH access to. You can create a
    tunnel that allows you to browse that website like you were behind the company''s
    firewall. This command will forward any connections from your local machine on
    port 8000 through the jump server to the intranet server on port 80. Point your
    web browser to http://localhost:8000 and start surfing.


    ```

    $ ssh -N -L 8000:intranet.acme.com:80 jump-server &

    [1] 23253

    $ firefox http://localhost:8000

    ```


    Another use case is to access a service that is running on a server that you have
    SSH access to. If you need access to a mysql server that only allows database
    connections from specific hosts, you can create an SSH tunnel for your connection.
    Since the mysql service is running on localhost:3306 of the remote machine, the
    -L option would look like this: -L 3306:localhost:3306. You can use the mysql
    command line client on your local machine to connect to the database, but what''s
    even more interesting is to use graphical desktop applications that aren''t available
    on the server. For example, you could use this tunnel and connect to the database
    with MySQL Workbench, Navicat, or some'
