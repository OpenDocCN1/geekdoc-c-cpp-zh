    \         75\nThreadsPerChild         25\nMaxRequestsPerChild      0\n</IfModule>\n\
    $\n```\n\n### 删除两个字符串之间的一段文本\n\n```shell\n$ sed '/start-pattern/,/stop-pattern/d'\
    \ file\n\n$ command | sed '/start-pattern/,/stop-pattern/d'\nfile\n```\n\n通过为\
    \ sed 命令提供起始和停止模式，并让它删除整个范围，你可以删除一段文本。模式可以是字符串或正则表达式。此示例删除前七行，因为 \"#\" 匹配第一行，而\
    \ \"^$\" 匹配第七行。\n\n```shell\n$ cat ports.conf\n\n# If you just change the port\
    \ or add more ports here,\nyou will likely also\n# have to change the VirtualHost\
    \ statement in\n# /etc/apache2/sites-enabled/000-default\n\n# This is also true\
