    \ : \"f1585f096d3f3985e73456dcc\",\n    \"build_timestamp\" : \"2014-04-16T14:27:12Z\"\
    ,\n    \"build_snapshot\" : false,\n```\n\n## 在命令行使用 for 循环\n\n```bash\n$ for\
    \ VAR in LIST\n> do\n>   # use $VAR\n> done\n```\n\n当你需要对一组元素执行相同操作时，可以直接在 shell\
    \ 中使用 for 循环。\n\n```text\n$ for USER in bob jill fred\n> do\n>   sudo passwd -l\
    \ $USER\n>   logger -t naughty-user $USER\n> done\nLocking password for user bob.\n\
    passwd: Success\nLocking password for user jill.\npasswd: Success\nLocking password\
    \ for user fred.\npasswd: Success\n$ sudo tail -3 /var/log/messages\nApr  8 19:29:03\
    \ linuxserver naughty-user: bob\nApr  8 19:29:03 linuxserver naughty-user: jill\n\
    Apr  8 19:29:03 linuxserver naughty-user: fred\n```\n\n你也可以在一行命令行中写完整个循环。\n\n\
    ```text\n$ for USER in bob jill fred; do sudo passwd -l $USER; logger -t naughty-user\
    \ $USER; done\n...\n```\n\n## 命令替换\n\n```bash\n$ VAR=`command`\n$ VAR=$(command)\n\
    ```\n\n命令替换有两种形式。第一种形式使用反引号（\\`）将命令括起来，第二种形式使用美元符号后跟括号将命令括起来。它们在功能上是等价的，反引号形式是较旧的风格。命令的输出可以用作另一个命令的参数、设置变量，或用于生成\
    \ for 循环的参数列表。\n\n```text\n$ EXT_FILESYSTEMS=$(grep ext fstab | awk '{print $2}')\n\
    $ echo $EXT_FILESYSTEMS\n/ /boot\n$ cp file.txt file.txt.`date +%F`\n$ ls file.txt*\n\
    file.txt file.txt.2014-04-08\n$ ps -pf $(cat /var/run/ntpd.pid)\nUID        PID\
    \  PPID  C STIME TTY          TIME CMD\nntp       1210     1  0 Apr06 ?      \
    \  00:00:05 ntpd -u ntp:ntp -p /var/run/ntpd\n$ sudo kill -9 $(cat /var/run/ntpd.pid)\n\
    $ for x in $(cut -d: -f1 /etc/passwd); do groups $x; done\njason : jason sales\n\
    bobdjr : sales\njim : jim\n```\n\n## 将命令行输出存储为变量以供后续使用\n\n```bash\n$ for VAR in\
    \ LIST\n> do\n>   VAR2=$(command)\n>   VAR3=$(command)\n>   echo \"$VAR2 $VAR3\"\
    \n> done\n```\n\n命令替换可用于为变量赋值。如果你需要多次复用某条命令的输出，可以将其一次性赋值给一个变量，然后重复使用该变量。以下示例演示了如何在同一个脚本中多次使用\
    \ id 命令的输出。\n\n```text\n$ for USER in $(cut -f1 -d: /etc/passwd)\n> do\n>   UID_MIN=$(grep\
    \ ^UID_MIN /etc/login.defs | awk '{print $NF}')\n>   USERID=$(id -u $USER)\n>\
    \   [ $USERID -lt $UID_MIN ] || {\n>     echo \"Forcing password expiration for\
    \ $USER with UID of $USERID.\"\n>     sudo passwd -e $USER\n> }\n> done\nForcing\
    \ password expiration for bob with UID of 1000.\nForcing password expiration for\
    \ bobdjr with UID of 1001.\nForcing password expiration for bobbi with UID of\
    \ 1002.\n```\n\n## 逐行读取输入\n\n```bash\n$ while read LINE\n> do\n>   # Do something\
    \ with $LINE\n> done < file.txt\n\n$ command | while read LINE\n> do\n>   # Do\
    \ something with $LINE\n> done\n```\n\n如果要遍历单词列表，请使用 for 循环。如果要逐行遍历，请将 while 循环与\
    \ read 语句和重定向结合使用。\n\n让我们查找已使用超过 90% 的文件系统。如果我们尝试使用 if 语句，它会将输出拆分为单词块，如下所示。\n\n\
    ```text\n$ df | head -1\nFilesystem 1K-blocks Used Available Use% Mounted on\n\
    $ for x in $(df)\n> do\n> echo $x\n> done\nFilesystem\n1K-blocks\nUsed\nAvailable\n\
    Use%\nMounted\non\n>...\n```\n\n我们需要像这样一次读取整行。\n\n```text\n$ df | while read LINE\n\
    > do\n> echo $LINE\n> done\nFilesystem 1K-blocks Used Available Use% Mounted on\n\
    >...\n```\n\n下面是一种查找已使用超过 90% 的文件系统的方法。\n\n## 命令行功夫\n\n```bash\n$ read -n 1 VAR\n\
    $ read -p \"Prompt text\" VAR\n```\n\n要接受用户输入，请使用 read 命令。read 会接受一整行输入并将其存储到变量中。你可以使用\
    \ -n 选项强制 read 只读取有限数量的字符。与其在 read 命令之前使用 echo 语句，不如使用 -p 选项提供提示符。下面是一个使用这些技术的示例脚本。\n\
    \nbackup.sh 的内容：\n\n```bash\n#!/bin/bash\nwhile true\ndo\n    read -p \"What server\
    \ would you like to backup? \" SERVER\n    echo \"Backing up $SERVER\"\n    /usr/local/bin/backup\
    \ $SERVER\n    read -p \"Backup another server? (Y/n) \" -n 1 BACKUP_AGAIN\n \
    \   echo\n    [ \"$BACKUP_AGAIN\" = \"y\" ] || break\ndone\n```\n\n```text\n$\
    \ ./backup.sh\nWhat server would you like to backup? thor\nBacking up thor\nBackup\
    \ another server? (Y/n) y\n```\n\n"
