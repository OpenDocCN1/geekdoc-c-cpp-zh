    ```\n\n## 避免在通过 SSH 连接时输入用户名\n\n将以下内容放入 `~/.ssh/config` 文件中。\n\n```\nHost remote-host\n\
    User username\n```\n\n如果你本地 Linux 机器上的用户名与远程 Linux 机器上的用户名不同，则在通过 SSH 连接时必须指定用户名。如下所示：\n\
    \n```\n$ ssh jim@server1.example.com\n```\n\n为了避免每次都输入 “username@”，请在你的 `~/.ssh/config`\
    \ 文件中添加一个主机条目。\n\n```\nHost server1.example.com\n        User jim\n```\n\n配置好主机条目后，你就可以直接通过\
    \ ssh 连接远程主机了。\n\n```\n$ whoami\njames\n$ ssh server1.example.com\n$ whoami\n\
    jim\n$\n```\n\n## 简化多跳 SSH 连接并透明代理 SSH 连接\n\n将以下内容放入 ~/.ssh/config 文件中。\n\n```\n\
    Host jumphost.example.com\n    ProxyCommand none\nHost *.example.com\n    ProxyCommand\
    \ ssh -W %h:%p jumphost.example.com\n```\n\n如果你需要访问位于 SSH 网关服务器或跳板服务器后面的主机，你可以通过让\
    \ SSH 在连接最终远程主机时自动使用该 SSH 网关来让生活更轻松。无需先连接网关，再输入另一条 ssh 命令来连接目标主机，你只需在本地机器上输入 “ssh\
    \ destination-host”。使用上述配置，此命令会将你对 server1 的 ssh 连接通过 jumphost 进行代理。\n\n```\n\
    $ ssh server1.example.com\n$ uname -n\nserver1\n$\n```\n\n## 断开远程会话并稍后重新连接，接续之前的工作\n\
    \n```\n$ ssh remote-host\n$ screen\nctrl-a d\n$ exit\n```\n\n```bash\n$ ssh remote-host\n\
    $ screen -r\n```\n\n当我在远程主机上需要完成一个长时间运行的进程时，我总是在启动该进程之前先启动一个 screen 会话。我不希望网络连接中的任何小故障打断远程主机上正在执行的工作。有时我会启动一个进程，从会话中分离，稍后再重新连接以查看我离开期间产生的所有输出。\n\
    \n首先，通过 ssh 连接到远程主机。接下来，启动一个 screen 会话。开始在远程主机上执行你的工作。通过输入 ctrl-a 然后按 d 来从 screen\
    \ 会话中分离。你启动的进程在你离开期间仍会在 screen 会话中继续运行。此外，产生的任何输出都可以在之后供你查看。\n\n```text\n$ ssh\
    \ remote-host\n$ screen\n$ /usr/local/bin/migrate-db\n\nStarting DB migration\
    \ at Sun Apr 13 21:02:50 EDT 2014\n<ctrl-a,d>\n[detached]\n$ exit\n```\n\n要重新连接到你的\
    \ screen 会话，请连接到远程主机并输入 screen -r。如果有任何输出滚过了屏幕顶部，你可以通过输入 ctrl-a 然后按 Esc 键来查看。现在使用\
    \ vi 导航键绑定来查看输出历史。例如，你可以按 k 向上移动一行，或按 ctrl-b 向上翻页。查看完输出历史后，按 Esc 键返回到实时会话。要退出你的\
    \ screen 会话，输入 exit。\n\n```shell\n$ ssh remote-host\n$ screen -r\nStarting DB\
    \ migration at 21:02\ntable1 migrated at 21:34\ntable2 migrated at 22:11\ntable3\
    \ migrated at 22:54\nDB migration completed at 23:04\n$ exit\n[screen is terminating]\n\
    $ exit\n```\n\nScreen 是使用最广泛、最容易获得的屏幕复用器之一。不过，也有其他替代品，如 tmux、dtach 和 byobu。\n\n\
    ## 配置 SSH 根据模式将域名附加到主机名\n\n~/.ssh/config 的内容：\n\n```ssh\nhost-prefix* !*.domain.com\n\
    \        HostName %h.domain.com\n```\n\n如果你通过 ssh 连接到多个域中的主机，每次都输入完全限定域名会变得很烦人。解决这个问题的一种方法是将每个域添加到\
    \ /etc/resolv.conf 的搜索列表中。解析器会尝试在搜索列表中的每个域中解析指定的主机名，直到找到能够解析的域为止。\n\n```shell\n\
    $ cat /etc/resolv.conf\nnameserver 8.8.8.8\nnameserver 8.8.4.4\nsearch domain1.com\
    \ domain2.com domain3.com domain4.com domain5.com domain6.com domain7.com\n```\n\
    \n使用上述 resolv.conf，当你输入 “ssh remote-host” 时，解析器将尝试将 remote-host.domain1.com 转换为\
    \ IP 地址。如果失败，则会尝试解析 remote-host.domain2.com，依此类推。上述 resolv.conf 的问题在于搜索列表仅限于六个域。因此，remote-host.domain7.com\
    \ 永远不会被尝试。此外，搜索列表长度限制为 256 个字符，无论域的数量有多少。\n\n如何绕过六个域的搜索列表限制？如果你足够幸运，主机名与域名之间存在某种关联模式，你可以配置\
    \ ssh 来执行解析。例如，对于像 “ny-www1.newyork.company.com” 和 “ny-mysql-07.newyork.company.com”\
    \ 这样的完全限定域名，你可以创建一条规则，将 “.newyork.company.com” 附加到任何以 “ny” 开头的主机名上。你还需要告诉 ssh\
    \ 忽略那些以 “ny” 开头但已经带有 “.newyork.company.com” 后缀的主机。下面是一个实现此功能的 ~/.ssh/config 示例文件。\n\
    \n```text\n$ cat ~/.ssh/config\n\nny* !*.newyork.company.com\n        HostName\
    \ %h.newyork.company.com\n\ndb* !*.databases.company.com\n        HostName %h.databases.company.com\n\
    \njump* !*.company.com\n        HostName %h.company.com\n```\n\n现在，当你输入 “ssh ny-test”\
    \ 时，ssh 将尝试连接到 “ny-test.newyork.company.com”。对于以 “db” 开头的主机，ssh 会将 “.databases.company.com”\
    \ 附加到主机名上。以 “jump” 开头的主机，则会在其后附加 “.company.com” 域名。\n\n```shell\n$ ssh ny-www1\n\
    $ hostname -f\nny-www1.newyork.company.com\n$ exit\n$ ssh jump-ny-01\n$ hostname\
    \ -f\njump-ny-01.company.com\n$ exit\n$\n```\n\n## 运行不受挂断影响的命令，让你断开连接后任务仍能继续运行\n\
    \n```shell\n$ nohup command &\n```\n\n通常，当你在后台启动一个任务并注销会话时，该任务会被终止。确保命令在你断开与主机的连接后继续运行的一种方法是使用\
    \ nohup 命令。Nohup 代表 no hang up（不挂断）。默认情况下，命令的输出会存储在程序启动目录下的一个名为 “nohup.out” 的文件中。你可以在之后查看该文件的内容来了解命令的输出。如果想使用不同的文件名，可以使用重定向。\n\
    \n```shell\n$ ssh db-server\n$ nohup /usr/local/bin/upgradedb.sh &\n[1] 13370\n\
    \n$ exit\n$ ssh db-server\n$ cat nohup.out\nStarting database upgrade.\n...\n\
    Database upgrade complete.\n$ nohup /usr/local/bin/post-upgrade.sh > /tmp/post.log\
    \ &\n[1] 16711\n\n$ exit\n$ ssh db-server\n$ cat /tmp/post.log\nPost processing\
    \ completed.\n$\n```\n\n## 使用 SSH SOCKS 代理加密你的网页浏览数据\n\n```shell\n$ ssh -D PORT\
    \ remote-host\n```\n\n如果你正在使用开放的无线热点，并希望确保网页浏览数据被加密，你可以通过 SSH 将网页浏览流量重定向到另一台主机。使用\
    \ ssh 的 “-D” 选项，并提供一个在你本地计算机上打开的端口用于代理连接。如果你只想进行端口转发而不实际登录远程主机的 shell，请使用 ssh\
    \ 的 “-N” 选项。将你的 Web 浏览器配置为使用 SOCKS 5 代理，主机名使用 localhost，端口使用你提供给 ssh 的端口。\n\n"
