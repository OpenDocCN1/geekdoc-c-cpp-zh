    \ named access.log. To do this, print out the ninth item in the log file with\
    \ the awk command.\n\n```sh\n$ tail -1 access.log\n18.19.20.21 - - [19/Apr/2014:19:51:20\
    \ -0400] \"GET / HTTP/1.1\" 200 7136 \"-\" \"Mozilla/5.0 (Windows NT 6.1; WOW64)\
    \ AppleWebKit/537.36 (KHTML, like Gecko) Chrome/33.0.1750.154 Safari/537.36\"\n\
    $ tail -1 access.log | awk '{print $9}'\n200\n$ awk '{print $9}' access.log |\
    \ sort | uniq\n200\n301\n302\n404\n$\n```\n\nLet's take it another step forward\
    \ and count how many of each status code we have.\n\n```sh\n$ awk '{print $9}'\
    \ access.log | sort | uniq -c | sort -nr\n5641 200\n207 301\n86 404\n18 302\n\
    2 304\n```\n\nNow let's extract the status code and hour from the access.log file\
    \ and count the unique occurrences of those combinations. Next, let's sort them\
    \ by number of occurrences. This will show us the hours during which the website\
    \ was most active.\n\n```bash\n$ cat access.log | awk '{print $9, $4}' | cut -c\
    \ 14,18-19 | uniq -c | sort -n | tail\n\n      72 200 09\n      75 200 06\n  \
    \    81 200 06\n      82 200 06\n      83 200 06\n      83 200 06\n      84 200\
    \ 06\n     109 200 20\n     122 200 20\n     383 200 10\n```\n\n## NETWORKING\
    \ AND SSH\n\n### Serve Files in the Current Directory via a Web Interface\n\n\
    ```sh\n    $ python -m SimpleHTTPServer\n    $ python3 -m http.server\n```\n\n\
    By default, this command starts a web server and serves up the content in the\
    \ current directory on port 8000. You can change the port by specifying it at\
    \ the end of the line. If no index.html file exists in the current directory,\
    \ then the directory listing is shown. Start the web server and use a web browser\
    \ to navigate to it. (firefox http://localhost:8000)\n\nThis can come in handy\
    \ when you are working on HTML content and you want to see how it looks in a web\
    \ browser without installing and configuring a full blown web server.\n\n```sh\n\
    \    $ python -m SimpleHTTPServer\n    Serving HTTP on 0.0.0.0 port 8000 ...\n\
    \    localhost.localdomain - - [06/Apr/2014 21:49:20] \"GET / HTTP/1.1\" 200 -\n\
    ```\n"
  mdcn: "\n## 使用编辑器\n\n```bash\n$ cat > file\n<ctrl-d>\n```\n\n如果你需要快速记一笔，而不需要功能完备的文本编辑器，可以直接使用\
    \ cat 并将输出重定向到文件。完成后按 <ctrl-d> 即可创建该文件。\n\n```bash\n$ cat > shopping.list\neggs\n\
    bacon\ncoffee\n<ctrl-d>\n$ cat shopping.list\neggs\nbacon\ncoffee\n$\n```\n\n\
    ### 显示两个字符串之间的一段文本\n\n```bash\n$ awk '/start-pattern/,/stop-pattern/' file.txt\n\
    $ command | awk '/start-pattern/,/stop-pattern/'\n```\n\ngrep 命令非常适合提取单行文本。但如果你需要捕获整块文本呢？使用\
    \ awk 并为其提供起始和停止模式。模式可以只是一个字符串，甚至可以是正则表达式。\n\n```bash\n$ sudo dmidecode | awk\
    \ '/Processor/,/Manual/'\nProcessor Information\n        Socket Designation: SOCKET\
    \ 0\n        Type: Central Processor\n        Family: Core i5\n        Manufacturer:\
    \ Intel\n$ awk '/worker.c/,/^$/' httpd.conf\n<IfModule worker.c>\nStartServers\
