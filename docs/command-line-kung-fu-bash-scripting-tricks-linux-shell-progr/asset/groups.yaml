    # Transform the Directory Structure

    of a Tar File When Extracting It


    ```

    $ tar xf tarfile.tar --strip-components=$NUMBER

    ```


    If you want to extract a tar file starting at a subdirectory, use the --strip-components
    option. For example, if you download a release from github.com the name and version
    of the project is the top directory in the tar file. To extract the files below
    that directory use --strip-components=1.


