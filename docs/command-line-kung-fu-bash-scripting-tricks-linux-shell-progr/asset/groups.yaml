    \ 12:48:32\n```\n\n## 删除空目录\n\n```bash\n$ find . -type d -empty -delete\n```\n\
    \n如果你发现自己需要清理空目录，find 可以让这项任务变得轻而易举。使用 -type d 选项查找所有目录，使用 -empty 选项仅包含空目录，最后使用\
    \ -delete 选项删除这些目录。\n\n```bash\n$ mkdir -p testing/{1..4}\n$ ls testing/\n1  2\
    \  3  4\n$ find . -type d -empty -delete\n$ ls testing/\nls: cannot access testing/:\
    \ No such file or directory\n$\n```\n\n## 打印包含给定字符串的文件列表\n\n```bash\n$ grep -rl\
    \ string .\n```\n\n要获取包含给定字符串的文件列表，请使用 grep 的 -r（递归）和 -l（列出匹配文件）选项。\n\n```bash\n\
    $ sudo grep -lr jim /var/log\n/var/log/audit/audit.log.1\n/var/log/secure-20140406\n\
    /var/log/secure\n```\n\n## 易于阅读的递归文件列表\n\n```bash\n$ find . -type f -ls\n```\n\
    \nls 命令有一个递归选项，但我发现 find 命令的输出更易于理解，尤其是在文件和目录数量很多时。使用 find 的优势在于它会显示每个文件的完整路径，而\
    \ ls 不会。\n\n```text\n$ ls -lR Music/\nMusic/:\ntotal 4\ndrwxr-xr-x. 2 jason jason\
    \ 4096 Feb 22 12:40 jazz\nMusic/jazz:\ntotal 20932\n-rw-r--r--. 1 jason jason\
    \       79496 Feb 22 12:40 giant-steps.mp3\n-rw-r--r--. 1 jason jason 21267371\
    \ Feb 16 11:12 jazz-album-1.mp3\n-rw-r--r--. 1 jason jason       79496 Feb  3\
    \ 18:13 john-coltrane.mp3\n$ find Music/ -type f -ls\n397966 20772 -rw-r--r--\
    \   1 jason jason 21267371 Feb\n16 11:12 Music/jazz/jazz-album-1.mp3\n396787 \
    \   80 -rw-r--r--   1 jason jason    79496 Feb 22\n12:40 Music/jazz/giant-steps.mp3\n\
    132464    80 -rw-r--r--   1 jason jason    79496 Feb  3\n18:13 Music/jazz/john-coltrane.mp3\n\
    $\n```\n\n## 以树形格式查看文件和目录\n\n```bash\n$ tree\n$ tree -d\n$ tree -L number\n```\n\
    \ntree 命令以类似树形的格式显示文件和目录。如果你只想查看目录结构，请使用 -d 选项。要限制树的深度，请使用 -L 选项，后跟一个数字。\n\n```text\n\
    $ tree Music/\nMusic/\n└── jazz\n    ├── giant-steps.mp3\n    ├── jazz-album-1.mp3\n\
    \    └── john-coltrane.mp3\n1 directory, 3 files\n$ tree -d Music/\nMusic/\n└──\
    \ jazz\n1 directory\n$ tree -d /var | head\n/var\n├── account\n├── cache\n│  \
    \ ├── fontconfig\n│   ├── gdm\n│   │   ├── adminuser\n│   │   └── jason\n├── hald\n\
    ├── ldconfig\n├── man\n$ tree -dL 1 /var\n/var\n├── account\n├── cache\n├── crash\n\
    ├── db\n├── empty\n├── ftp\n├── games\n├── gdm\n├── lib\n├── local\n├── lock\n\
    ├── log\n├── mail -> spool/mail\n├── nis\n├── opt\n├── preserve\n├── run\n├──\
    \ spool\n├── tmp\n├── www\n└── yp\n$\n```\n\n## 在多个文件中替换字符串\n\n```bash\n$ find\
    \ /path -type f -exec sed -i.bak 's/string/replacement/g' {} \\;\n```\n\n如果你有一些信息嵌入在多个文件中，并且需要更改它，请将\
    \ find 命令与 sed 结合使用。sed 的 -i 选项告诉它执行原地编辑。你可以为 -i 提供一个扩展名，以便在编辑之前创建文件备份。传递给 sed\
    \ 的命令告诉它全局用 \"replacement\" 替换 \"string\"。全局替换会在所有位置执行替换。普通替换只替换一行中的第一个匹配项。\n\n\
    在此示例中，托管软件仓库的服务器正在被替换。使用下面的一行命令，所有出现的 \"thor\" 都会被替换为 \"loki\"。\n\n```text\n$\
    \ grep -r thor .\n./deploy-il.sh:REPO_SERVER=\"thor.company.com\"\n./deploy-ca.sh:REPO_SERVER=\"\
    thor.company.com\"\n./deploy-fl.sh:REPO_SERVER=\"thor.company.com\"\n./deploy-ny.sh:REPO_SERVER=\"\
    thor.company.com\"\n\n$ find . -type f -exec sed -i.bak 's/thor/loki/g' {} \\\
    ;\n$ grep -r thor .\n./deploy-fl.sh.bak:REPO_SERVER=\"thor.company.com\"\n./deploy-il.sh.bak:REPO_SERVER=\"\
    thor.company.com\"\n./deploy-ny.sh.bak:REPO_SERVER=\"thor.company.com\"\n./deploy-ca.sh.bak:REPO_SERVER=\"\
    thor.company.com\"\n$ grep -r loki .\n./deploy-il.sh:REPO_SERVER=\"loki.company.com\"\
    \n./deploy-ca.sh:REPO_SERVER=\"loki.company.com\"\n./deploy-fl.sh:REPO_SERVER=\"\
    loki.company.com\"\n./deploy-ny.sh:REPO_SERVER=\"loki.company.com\"\n$\n```\n\n\
    ## 从文件中提取第 N 行\n\n```bash\n$ awk 'NR==N'\n```\n\n要从文件中提取特定行，请告诉 awk 打印与行号匹配的行。一个有用的场景是当你在脚本中遇到错误时。要确切查看脚本在该行执行什么，请使用\
    \ awk。\n\n```text\n$ ./deploy.sh\n./deploy.sh: line 74: /usr/local/bin/patch:\
    \ No such\nfile or directory\n$ awk 'NR==74' deploy.sh\n/usr/local/bin/patch $NEW_HOST\n\
    $\n```\n\n## 将文本文件从 Windows 格式转换为 Linux 格式，反之亦然\n\n```bash\n$ dos2unix\n$ unix2dos\n\
    ```\n\n迟早你会收到或下载一个使用 CR（回车）和 LF（换行）字符对来终止文件中各行的文件。这类文件是 Windows/DOS 格式的。类 Unix\
    \ 操作系统仅使用 LF 字符来终止一行。有时这会导致问题。要将文件转换为类 Unix 格式，请使用 dos2unix。要检查行终止字符，请使用 \"cat\
    \ -A\" 或 \"file\" 命令。\n\n```text\n$ cat -A from-my-windows-buddy.pl\n#!/usr/bin/perl^M$\n\
    print \"This is a cross-platform perl script!\\n\"^M$\n$ ./from-my-windows-buddy.pl\n\
    -bash: ./from-my-windows-buddy.pl: /usr/bin/perl^M:\nbad interpreter: No such\
    \ file or directory\n$ dos2unix from-my-windows-buddy.pl\ndos2unix: converting\
    \ file from-my-windows-buddy.pl to\nUNIX format ...\n$ cat -A from-my-windows-buddy.pl\n\
    #!/usr/bin/perl$\nprint \"This is a cross-platform perl script!\\n\"$\n$ ./from-my-windows-buddy.pl\n\
    This is a cross-platform perl script!\n$ file other-file.txt\nother-file.txt:\
    \ ASCII text, with CRLF line\nterminators\n$ dos2unix other-file.txt\ndos2unix:\
    \ converting file other-file.txt to UNIX\nformat ...\n$ file other-file.txt\n\
    other-file.txt: ASCII text\n$\n```\n\n另一方面，如果你将在 Linux 主机上创建的文件发送给在 Windows 的记事本中打开它的人，他们只会看到一整行很长的文本。使用\
    \ unix2dos 命令将文件转换为 Windows/DOS 格式。\n\n```text\n$ file report-for-ceo.txt\nreport-for-ceo.txt:\
    \ ASCII text\n\n$ unix2dos report-for-ceo.txt\nunix2dos: converting file report-for-ceo.txt\
    \ to DOS\nformat ...\n\n$ file report-for-ceo.txt\nreport-for-ceo.txt: ASCII text,\
    \ with CRLF line\nterminators\n$\n```\n\n## 杂项\n\n### 切换到上一个工作目录\n\n```bash\n\
    $ cd -\n```\n\n如果你想返回上一个工作目录，请使用 \"cd -\"。OLDPWD 环境变量保存你最近一次目录位置的路径。\"cd -\" 与\
    \ \"cd $OLDPWD\" 相同。\n\n```text\n$ cd /etc/httpd/conf.d\n$ grep ^SSLCert ssl.conf\n\
    SSLCertificateFile /etc/pki/tls/certs/localhost.crt\nSSLCertificateKeyFile\n/etc/pki/tls/private/localhost.key\n\
    $ cd /etc/pki/tls/certs/\n$ ls\nca-bundle.crt  ca-bundle.trust.crt  localhost.crt\n\
    make-dummy-cert  Makefile  renew-dummy-cert\n$ cd -\n/etc/httpd/conf.d\n```\n\n\
    ### 重置终端模拟器显示\n\n```text\n$ reset\n```\n\n将二进制文件显示到屏幕上可能会导致终端变得不可用。要尝试恢复，请输入 \"\
    reset\" 并按回车。你的终端可能处于这样一种状态：你看不到自己正在输入的内容，但 shell 仍会接受输入。\n\n```text\n$ cat blue-train.mp3\n\
    F...A....h...reset\n$ \n```\n\n### 从命令行搜索 Wikipedia\n\n```bash\n$ dig +short txt\
    \ <string>.wp.dg.cx\n$ host -t txt <string>.wp.dg.cx\n```\n\n如果你需要快速查找某个主题的一些信息，可以使用\
    \ DNS 搜索 Wikipedia。名称服务器会以 TXT 记录的形式返回 Wikipedia 文章摘要。\n\n```text\n$ dig +short\
    \ txt linux.wp.dg.cx\n\"Linux is a Unix-like computer operating system\nassembled\
    \ under the model of free and open source\nsoftware development and distribution.\
    \ The defining\ncomponent of Linux is the Linux kernel, an operating\nsystem kernel\
    \ first released 5 October 1991 by Linus\nTorvalds, http://en.wikipedia.org/wiki/Linux\"\
    \n$ host -t txt bash_shell.wp.dg.cx\nbash_shell.wp.dg.cx descriptive text \"Bash\
    \ is a Unix\n```\n\n"
