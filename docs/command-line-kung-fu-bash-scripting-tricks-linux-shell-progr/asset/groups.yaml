    \ ~/.ssh/config\nHost *.example.com\n    IdentityFile ~/.ssh/id_rsa-%h\n$ ls -l\
    \ ~/.ssh/id_rsa-*\nid_rsa-lax-db-01.example.com\nid_rsa-lax-db-01.example.com.pub\n\
    id_rsa-lax-web-01.example.com\nid_rsa-lax-web-01.example.com.pub\n$ ssh lax-db-01.example.com\n\
    ```\n\n## Avoid Having to Type Your Username When Connecting via SSH\n\nPut the\
    \ following in the `~/.ssh/config` file.\n\n```\nHost remote-host\nUser username\n\
    ```\n\nIf you have a different username on your local Linux machine than you do\
    \ on the remote Linux machine, you have to specify it when connecting via SSH.\
    \ It looks like this.\n\n```\n$ ssh jim@server1.example.com\n```\n\nTo avoid having\
    \ to type \"username@\" each time, add a host entry to your `~/.ssh/config` file.\n\
    \n```\nHost server1.example.com\n        User jim\n```\n\nOnce you have configured\
    \ the host entry, you can simply ssh into the remote host.\n\n```\n$ whoami\n\
    james\n$ ssh server1.example.com\n$ whoami\njim\n$\n```\n\n## Simplify Multi-Hop\
    \ SSH Connections and Transparently Proxy SSH Connections\n\nPut the following\
