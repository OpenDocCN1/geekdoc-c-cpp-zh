    \ that you use to manipulate files. Instead of downloading the file from the server,\
    \ modifying it, and uploading it back to the server, you can mount the remote\
    \ directory on your local workstation. Here is an example of updating a website\
    \ over SSH.\n\n```shell\n$ mkdir web-files\n$ sshfs www.example.com:/home/jason/public_html\
    \ web-files\n$ bluefish web-files/index.html\n$ fusermount -u web-files\n```\n\
    \nJust like the ssh command, you can use the user@host format if your remote username\
    \ is different from your local username. Also, if no directory is specified after\
    \ the colon, then your home directory is assumed.\n\n## Get Your Public IP from\
    \ the Command Line Using Curl\n\n```shell\n$ curl ifconfig.me\n```\n\nIf you ever\
    \ need to determine your public (Internet) IP address you can use the ifconfig.me\
    \ website.\n\n```shell\n$ curl ifconfig.me\n198.145.20.140\n\n$ curl ifconfig.me/ip\n\
    198.145.20.140\n\n$ curl ifconfig.me/host\npub2.kernel.org\n```\n\n## SSH into\
    \ a Remote System without a Password\n\nIn order to SSH into a remote host without\
    \ a password you'll need an SSH key pair consisting of a private and public key.\
    \ On the remote host the contents of the public key need to be in ~/.ssh/authorized_keys.\
    \ The ssh-copy-id script performs that work.\n\nIf you want to generate a key\
    \ without a password, simply hit enter when prompted for a passphrase. You can\
    \ optionally supply a blank string to the -N option. (ssh-keygen -N '')\n\n```shell\n\
    $ ssh-keygen\nGenerating public/private rsa key pair.\nEnter file in which to\
    \ save the key (/home/jason/.ssh/id_rsa):\nEnter passphrase (empty for no passphrase):\n\
    Enter same passphrase again:\nYour identification has been saved in /home/jason/.ssh/id_rsa.\n\
    Your public key has been saved in /home/jason/.ssh/id_rsa.pub.\nThe key fingerprint\
    \ is:\n0d:2e:e4:32:dd:da:60:a5:2e:0f:c5:89:d5:78:30:ad jason@laptop.localdomain\n\
    \nThe key's randomart image is:\n+---[ RSA 2048]----+\n|        o.       |\n|\
    \        =.       |\n|        +.=      |\n|        BEB o    |\n|        + @ S\
    \ .  |\n|        * =      |\n|      o o .      |\n|        +        |\n|     \
    \   .        |\n+-----------------+\n$ ssh-copy-id linuxserver\njason@192.168.122.60's\
    \ password:\nNow try logging into the machine, with \"ssh 'linuxserver'\", and\
    \ check in:\n    .ssh/authorized_keys\nto make sure we haven't added extra keys\
    \ that you weren't expecting.\n$ ssh linuxserver\n$ hostname\nlinuxserver\n$\n\
    ```\n\n## Show Open Network Connections\n\nThe lsof command can not only be used\
    \ to display open files, but open network ports, and network connections. The\
    \ -P option prevents the conversion of port numbers to port names. The -n option\
    \ prevents the conversion of IP addresses to host names. The -i option tells lsof\
    \ to display network connections.\n\n```shell\n$ sudo lsof -Pni\nCOMMAND     PID\
    \ USER   FD   TYPE DEVICE SIZE/OFF NODE NAME\ndhclient    989 root    6u  IPv4\
    \  11522      0t0  UDP *:68\nsshd       1202 root    3u  IPv4  12418      0t0\
    \  TCP *:22 (LISTEN)\nsshd       1202 root    4u  IPv6  12423      0t0  TCP *:22\
    \ (LISTEN)\nntpd       1210  ntp   16u  IPv4  12464      0t0  UDP *:123\nntpd\
    \       1210  ntp   17u  IPv6  12465      0t0  UDP *:123\nntpd       1210  ntp\
    \   18u  IPv4  12476      0t0  UDP 127.0.0.1:123\nntpd       1210  ntp   19u \
    \ IPv4  12477      0t0  UDP 192.168.122.60:123\nntpd       1210  ntp   20u  IPv6\
    \  12478      0t0  UDP [::1]:123\nntpd       1210  ntp   21u  IPv6  12479    \
    \  0t0  UDP [fe80::5054:ff:fe52:d858]:123\nmaster      1364  root   12u  IPv4\
    \  12761      0t0  TCP 127.0.0.1:25 (LISTEN)\nclockd-app  1247  jason 21u  IPv4\
    \  78889      0t0  TCP 192.168.122.60:39021->184.25.102.40:80 (ESTABLISHED)\n\
    sshd       12339 root   3r  IPv4  74023      0t0  TCP 192.168.122.60:22->192.168.122.1:34483\
    \ (ESTABLISHED)\nsshd       12342 jason  3u  IPv4  74023      0t0  TCP 192.168.122.60:22->192.168.122.1:34483\
    \ (ESTABLISHED)\n$\n```\n\n## Compare the Differences between a Remote and Local\
    \ File\n\n```shell\n$ ssh remote-host cat /path/to/remotefile | diff /path/to/localfile\
    \ -\n```\n\nTo display the differences between a local and remote file, cat a\
    \ file over ssh and pipe the output into a diff or sdiff command. The diff and\
    \ sdiff commands can accept standard input in lieu of a file by supplying it a\
    \ dash for one of the file names.\n\n```shell\n$ ssh linuxsrv cat /etc/passwd\
    \ | diff /etc/passwd -\n32c32\n< terry:x:503:1000::/home/terry:/bin/ksh\n---\n\
    > terry:x:503:1000::/home/terry:/bin/bash\n```\n\n## Create an SSH Tunnel to Access\
    \ Remote Resources\n\n```shell\n$ ssh -N -L local-port:host:remote-port remote-host\n\
    ```\n\nTo create an SSH tunnel, use the -L option. The first port is the port\
    \ that will be opened on your local machine. Connections to this port will be\
    \ tunneled through remote-host and sent to the host and remote port specified\
    \ in the -L option. The -N option tells SSH not to execute a command -- your shell\
    \ -- on the remote host.\n\nLet's say you want to access a website that isn't\
    \ available on the internet, but is accessible from a server that you have SSH\
    \ access to. You can create a tunnel that allows you to browse that website like\
    \ you were behind the company's firewall. This command will forward any connections\
    \ from your local machine on port 8000 through the jump server to the intranet\
    \ server on port 80. Point your web browser to http://localhost:8000 and start\
    \ surfing.\n\n```shell\n$ ssh -N -L 8000:intranet.acme.com:80 jump-server &\n\
    [1] 23253\n$ firefox http://localhost:8000\n```\n\nAnother use case is to access\
    \ a service that is running on a server that you have SSH access to. If you need\
    \ access to a mysql server that only allows database connections from specific\
    \ hosts, you can create an SSH tunnel for your connection. Since the mysql service\
    \ is running on localhost:3306 of the remote machine, the -L option would look\
    \ like this: -L 3306:localhost:3306. You can use the mysql command line client\
    \ on your local machine to connect to the database, but what's even more interesting\
    \ is to use graphical desktop applications that aren't available on the server.\
    \ For example, you could use this tunnel and connect to the database with MySQL\
    \ Workbench, Navicat, or some other application.\n\n```shell\n$ ssh -N -L 3306:localhost:3306\
    \ db01 &\n[1] 13455\n\n$ mysql -h 127.0.0.1\nWelcome to the MySQL monitor. Commands\
    \ end with ; or \\g.\nYour MySQL connection id is 9\nServer version: 5.1.73 Source\
    \ distribution\nCopyright (c) 2000, 2013, Oracle and/or its affiliates. All rights\
    \ reserved.\nOracle is a registered trademark of Oracle Corporation and/or its\
    \ affiliates. Other names may be trademarks of their respective owners.\nType\
    \ 'help;' or '\\h' for help. Type '\\c' to clear the current input statement.\n\
    mysql>\n```\n\n## Find out Which Programs Are Listening on Which Ports\n\n```shell\n\
    $ sudo netstat -nutlp\n```\n\nHere are the descriptions of the netstat options\
    \ used in order to get a list of programs and the ports that they are listening\
    \ on.\n\n- `-n` show numerical addresses instead of determining symbolic names\n\
    - `-u` include the UDP protocol\n- `-t` include the TCP protocol\n- `-l` show\
    \ only listening sockets\n- `-p` show the PID and program name\n\n```shell\n$\
    \ sudo netstat -nutlp\nActive Internet connections (only servers)\n\nProto Recv-Q\
    \ Send-Q Local Address Foreign Address State PID/Program name\ntcp        0  \
    \    0 0.0.0.0:3306         0.0.0.0:*        LISTEN 4546/mysqld\ntcp        0\
    \      0 0.0.0.0:22           0.0.0.0:*        LISTEN 1161/sshd\ntcp        0\
    \      0 127.0.0.1:25         0.0.0.0:*        LISTEN 1325/master\ntcp       \
    \ 0      0 :::80                :::*             LISTEN 4576/httpd\ntcp      \
    \  0      0 :::22                :::*             LISTEN 1161/sshd\nudp      \
    \  0      0 0.0.0.0:68           0.0.0.0:*        1008/dhclient\n$\n```\n\n##\
    \ Use a Different SSH Key for a given Remote Host\n\nPut the following in the\
    \ ~/.ssh/config file.\n\n```text\nHost remote-host\nIdentityFile ~/.ssh/id_rsa-remote-host\n\
    ```\n\nIf you need or want to use different SSH keys for different hosts, you\
    \ can explicitly specify them on the command line with the -i option to ssh.\n\
    \n```shell\n$ ssh -i ~/.ssh/id_rsa-db1 db1.example.com\n```\n\nIf you want to\
    \ forego specifying the key each time you can create an entry in your ~/.ssh/config\
    \ file and specify the key there.\n\n```shell\n$ cat ~/.ssh/config\n```\n"
