    \n```bash\n$ alias ct='column -t'\n$ command | ct\n```\n\n使用 column 命令将文本格式化为多列。通过使用\
    \ -t 选项，column 会统计输入包含的列数，并创建具有该列数的表格。这确实可以让许多命令的输出更易读。我发现自己经常使用它，因此为该命令创建了一个别名。\n\
    \n```bash\n$ alias ct='column -t'\n$ echo -e 'one two\\nthree four'\none two\n\
    three four\n$ echo -e 'one two\\nthree four' | ct\none    two\nthree four\n$ mount\
    \ -t ext4\n/dev/vda2 on / type ext4 (rw)\n/dev/vda1 on /boot type ext4 (rw)\n\
    $ mount -t ext4 | cat\n/dev/vda2 on / type ext4 (rw)\n/dev/vda1 on /boot type\
    \ ext4 (rw)\n$\n```\n\n### 获取输出行中的最后一个词\n\n```bash\n$ awk '{print $NF}' file\n\
    $ cat file | awk '{print $NF}'\n```\n\n可以使用 $FIELD_NUMBER 表示法让 awk 打印字段。要打印第一个字段，使用\
    \ $1；打印第二个字段，使用 $2，依此类推。但是，如果你不知道字段数，或者不想数它们，请使用 $NF，它表示字段总数。Awk 以空格分隔字段，但你可以使用\
    \ -F 参数改变该行为。以下是如何打印系统上正在使用的所有 shell。使用冒号作为字段分隔符，然后打印最后一个字段。\n\n```bash\n$ awk\
    \ -F: '{print $NF}' /etc/passwd | sort -u\n```\n\n如果要显示系统上每个用户的 shell，可以这样做。\n\
    \n```bash\n$ awk -F: '{print $1,$NF}' /etc/passwd | sort | column -t\nadm    \
    \                /sbin/nologin\napache              /sbin/nologin\navahi-autoipd\
    \       /sbin/nologin\nbin                 /sbin/nologin\nbobb               \
    \ /bin/bash\n...\n```\n\n### 使用 Less 查看彩色输出\n\n```bash\n$ ls --color=always |\
    \ less -R\n$ grep --color=always file | less -R\n```\n\n某些 Linux 发行版会为 ls 和 grep\
    \ 创建带有 --color=auto 选项的别名。这会导致仅在输出到终端时才使用颜色。当你通过管道传输 ls 或 grep 的输出时，不会发出颜色代码。可以通过\
    \ ls 或 grep 的 --color=always 强制始终显示颜色。要让 less 命令显示创建颜色的原始控制字符，请使用 -R 选项。\n\n```bash\n\
    $ grep --color=always -i bob /etc/passwd | less -R\n$ ls --color=always -i /etc\
    \ | less -R\n```\n\n### 管道传输到 Grep 时保留颜色\n\n```bash\n$ ls -l --color=always |\
    \ grep --color=never string\n```\n\n如果将彩色输入通过管道传输到 grep，并且 grep 是带有 --color=auto\
    \ 选项的别名，grep 会丢弃输入中的颜色，并高亮显示所搜索的字符串。为了保留彩色输入，请使用 --color=never 选项强制 grep 不使用颜色。\n\
    \n```bash\n$ ls -l --color=always *.mp3 | grep --color=never jazz\n-rw-r--r--\
    \ 1 jason jason 21267371 Feb 16 11:12 jazz-album-1.mp3\n```\n\n### 使用 Sudo 向文件追加文本\n\
    \n```bash\necho text | sudo tee -a file\n```\n\n如果你曾经尝试在“sudo echo”命令之后使用重定向向文件追加文本，你很快会发现那行不通。发生的情况是，echo\
    \ 语句以 root 身份执行，但重定向以你自己的身份发生。\n\n```bash\nsudo echo \"PRODUCTION Environment\"\
    \ >> /etc/motd\n-bash: /etc/motd: Permission denied\n```\n\n幸运的是，可以将 sudo 与 tee\
    \ 命令结合使用来向文件追加文本。\n\n```bash\necho \"PRODUCTION Environment\" | sudo tee -a /etc/motd\n\
    PRODUCTION Environment\n```\n\n### 更改字符串大小写\n\n```bash\ntr [:upper:] [:lower:]\n\
    tr [:lower:] [:upper:]\n```\n\n当需要更改字符串的大小写时，请使用 tr 命令。可以向 tr 提供范围，如“tr a-z A-Z”，或使用“tr\
    \ [:lower:] [:upper:]”。\n\n```bash\nENVIRONMENT=PRODUCTION\n$ DIRECTORY=$(echo\
    \ $ENVIRONMENT | tr [:upper:] [:lower:])\n$ echo $ENVIRONMENT | sudo tee -a /etc/motd\n\
    $ tail -1 /etc/motd\nPRODUCTION\n$ sudo mkdir /var/www/$DIRECTORY\n$ sudo tar\
    \ zxf wwwfiles.tgz -C /var/www/$DIRECTORY\n```\n\n### 以人类可读格式显示命令搜索路径\n\n```bash\n\
    $ echo $PATH | tr ':' '\\n'\n```\n\n阅读冒号分隔的项列表对人类来说不如对计算机那么容易。要用换行符替换冒号，请使用 tr\
    \ 命令。\n\n```bash\n$ echo $PATH\n/usr/bin:/bin:/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/sbin\n\
    $ echo $PATH | tr ':' '\\n'\n/usr/bin\n/bin\n/usr/local/bin\n/bin\n/usr/bin\n\
    /usr/local/sbin\n/usr/sbin\n/sbin\n```\n\n"
