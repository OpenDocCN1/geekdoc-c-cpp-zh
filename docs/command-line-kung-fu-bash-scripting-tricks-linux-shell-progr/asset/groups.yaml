    \ Linux 之旅。请访问 [http://www.linuxtrainingacademy.com/linux-apps](http://www.linuxtrainingacademy.com/linux-apps)\
    \ 下载你的免费礼物。\n\n## 简介\n\n自 20 世纪 90 年代以来，我一直在 Unix 和 Linux 系统的命令行上工作。不用说，只要有一个美元符号和一个闪烁的光标盯着我，我就感到非常自在。多年来，我掌握了一些命令行“技巧”，它们为我节省了时间，也减少了挫败感。\n\
    \n其中一些技巧源于必要——我实在有太多工作要完成，而完成它们的时间又太少。另一些则模仿了计算机编程和应用程序开发中常见的模式。其余的是我的命令行偶像和导师直接或间接分享给我的。通过观察、模仿并听取一位经验丰富的\
    \ Unix 和 Linux 专业人士的建议，你能学到的东西令人惊叹。\n\n尽管书名为*命令行功夫*，你并不需要成为 Linux 忍者才能使用本书介绍的策略。这些技巧按书中呈现的方式即可奏效。你无需完全理解所有细节和细微之处，就可以立即开始使用它们。不过，如果你想要或需要更多信息，每个技巧后面都附有解释和实际应用示例。\n\
    \n此外，如果你想看其中一些命令的实际运行，请访问 [http://www.linuxtrainingacademy.com/fu](http://www.linuxtrainingacademy.com/fu)。在那里你会找到一系列视频，演示本书涵盖的一些命令。\n\
    \n最后，如果你想概览 Linux 命令行和操作系统，请阅读我的另一本书*Linux 入门*。它将为你打下坚实的基础，让你在此基础上提升 Linux 技能。\n\
    \n让我们开始吧。\n\n## Shell 历史\n\n### 以 root 身份运行最后一条命令\n\n```sh\n$ sudo !!\n$ su -c\
    \ \"!!\"\n```\n\n如果你忘了用 root 权限运行某条命令，只需使用 sudo !! 或 su -c \"!!\" 重复执行它即可。\n\n\
    ```sh\n$ adduser sam\n-bash: /usr/sbin/adduser: Permission denied\n$ sudo !!\n\
    sudo adduser sam\n$ id sam\nuid=1007(sam) gid=1007(sam) groups=1007(sam)\n$ userdel\
    \ -r sam\n-bash: /usr/sbin/userdel: Permission denied\n$ sudo !!\nsudo userdel\
    \ -r sam\n$ id sam\nid: sam: No such user\n$ useradd jim\n-bash: /usr/sbin/useradd:\
    \ Permission denied\n$ su -c \"useradd jim\"\nPassword:\n$ id jim\nuid=1007(jim)\
    \ gid=1007(jim) groups=1007(jim)\n```\n\n这种感叹号语法称为事件指示符。事件指示符引用 shell 历史中的某条命令。Bang-Bang（!!）会重复最近一条命令，但我最喜欢的事件指示符用法之一，是运行最近一条以给定字符串开头的命令。下面是一个示例。\n\
    \n```bash\n$ whoami\njason\n$ uptime\n12:33:15 up 35 min, 1 user, load average:\
    \ 0.00, 0.00, 0.00\n$ df -hT /boot\nFilesystem Type Size Used Avail Use% Mounted\
    \ on\n/dev/vda1 ext4 485M 55M 406M 12% /boot\n$ !u\nuptime\n12:33:29 up 35 min,\
    \ 1 user, load average: 0.00, 0.00, 0.00\n```\n\n```bash\n$ sudo !w\nsudo whoami\n\
    root\n```\n\n### 重复上一条以给定字符串开头的命令\n\n```bash\n$ !<string>\n```\n\n这是事件指示符的另一个示例。要调出最近一条以\
    \ `<string>` 开头的命令，请运行“!<string>”。你可以只指定首字母，也可以指定足以使其唯一的字符串部分。这个示例演示了这一概念。\n\n\
    ```text\n$ who\njason       pts/1   2014-04-06 21:04 (192.168.1.117)\n$ w\njason\
    \       pts/1       192.168.1.117 21:04 0.00s\n0.33s 0.00s w\n$ !w\nw\njason \
    \      pts/1       192.168.1.117 21:04 0.00s\n0.33s 0.00s w\n$ !wh\nwho\njason\
    \       pts/1   2014-04-06 21:04 (192.168.1.117)\n```\n\n下面是一个实际示例：你检查某个进程是否正在运行，将其终止，然后确认它确实已停止。\n\
    \n```text\n$ ps -fu apache\nUID   PID  PPID  C STIME TTY  TIME     CMD\napache\
    \ 1877 1879 0 21:32 ?    00:00:00\n/usr/sbin/httpd\napache 2879 1    0 21:32 ?\
    \    00:00:00\n/usr/sbin/httpd\n$ sudo service httpd stop\nStopping httpd:   \
    \     [  OK  ]\n$ !p\nps -fu apache\n\nUID   PID  PPID  C STIME TTY  TIME    \
    \ CMD\n$\n```\n\n### 复用上一条命令中的第二个单词（第一个参数）\n\n```text\n$ !^\n```\n\n如果你需要取用上一条命令中的第二个单词，可以使用“!^”单词指示符。无论你在哪里使用“!^”，它都会被替换为上一条命令中的第二个单词。你也可以把它理解为上一条命令的第一个参数。\n\
    \n```text\n$ host www.google.com 8.8.8.8\nUsing domain server:\nName: 8.8.8.8\n\
    Address: 8.8.8.8#53\nAliases:\nwww.google.com has address 173.194.46.83\nwww.google.com\
    \ has address 173.194.46.81\nwww.google.com has address 173.194.46.84\nwww.google.com\
    \ has address 173.194.46.82\nwww.google.com has address 173.194.46.80\nwww.google.com\
    \ has IPv6 address\n2607:f8b0:4009:805::1013\n$ ping -c1 !^\nping -c1 www.google.com\n\
    PING www.google.com (173.194.46.80) 56(84) bytes of data.\n\n64 bytes from ord08s11-in-f16.1e100.net\n\
    (173.194.46.80): icmp_seq=1 ttl=51 time=17.0 ms\n\n--- www.google.com ping statistics\
    \ ---\n1 packets transmitted, 1 received, 0% packet loss,\ntime 49ms\n\nrtt min/avg/max/mdev\
    \ = 17.071/17.071/17.071/0.000 ms\n$\n```\n\n### 复用上一条命令中的最后一个单词（最后一个参数）\n\n```text\n\
    $ !$\n```\n\n我常常发现自己需要对上一条命令行中的最后一项执行另一项操作。要在当前命令中访问该项，请使用“!$”。\n\n```text\n$\
    \ unzip tpsreport.zip\nArchive: tpsreport.zip\n  inflating: cover-sheet.doc\n\
    $ rm !$\nrm tpsreport.zip\n$ mv cover-sheet.doc reports/\n$ du -sh !$\ndu -sh\
    \ reports/\n4.7G  reports/\n$\n```\n\n### 复用之前某条命令中的第 N 个单词\n\n```bash\n$ !!:N\n\
    $ <event_designator>:<number>\n```\n\n要访问上一条命令中的某个单词，请使用“!!:N”，其中 N 是你想取用的单词编号。第一个单词是\
    \ 0，第二个单词是 1，依此类推。你可以把 0 看作命令本身，把 1 看作命令的第一个参数，把 2 看作第二个参数，以此类推。\n\n你可以将任何事件指示符与单词指示符结合使用。在下面的示例中，“!!”是最近一条命令行：avconv\
    \ -i screencast.mp4 podcast.mp3。“!a”事件指示符会展开为同一条命令，因为它是最近一条以字母“a”开头的命令。\n\n```bash\n\
    $ avconv -i screencast.mp4 podcast.mp3\n$ mv !!:2 converted/\nmv screencast.mp4\
    \ converted/\n$ mv !a:3 podcasts/\nmv podcast.mp3 podcasts/\n$\n```\n\n### 在替换字符串的同时重复上一条命令\n\
    \n```bash\n$ ^<string1>^<string2>^\n```\n\n这个小技巧非常适合快速纠正输入错误。如果省略 ^<string2>，那么\
    \ <string1> 将从上一命令中删除。通过\n"
