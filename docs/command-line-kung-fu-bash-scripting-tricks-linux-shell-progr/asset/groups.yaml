    # common/NEWS.Debian.gz and\n# README.Debian.gz\nNameVirtualHost *:80\nListen\
    \ 80\n<IfModule mod_ssl.c>\n        # If you add NameVirtualHost *:443 here, you\n\
    will also have to change\n        # the VirtualHost statement in\n/etc/apache2/sites-available/default-ssl\n\
    \        # to <VirtualHost *:443>\n        # Server Name Indication for SSL named\n\
    virtual hosts is currently not\n        # supported by MSIE on Windows XP.\n \
    \       Listen 443\n</IfModule>\n<IfModule mod_gnutls.c>\n        Listen 443\n\
    </IfModule>\n$ sed '/^#\\|^$/d' ports.conf\nNameVirtualHost *:80\nListen 80\n\
    <IfModule mod_ssl.c>\n<IfModule mod_gnutls.c>\n        Listen 443\n</IfModule>\n\
    </IfModule>\n```\n\n### 使用别名修复常见拼写错误\n\n```bash\n$ alias typo='correct spelling'\n\
    ```\n\n如果你发现自己一遍又一遍地犯同样的输入错误，可以用别名来修正它。\n\n```bash\n$ grep root /etc/passwd\n\
    bash: grep: command not found\n$ echo \"alias grep='grep'\" >> ~/.bash_profile\n\
    $ ~/.bash_profile\n$ grep root /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
    $\n```\n\n### 在保持首行表头完整的同时对输出正文排序\n\n将此函数添加到你的个人初始化文件中，例如 `~/.bash_profile`：\n\
    \n```bash\nbody() {\n    IFS= read -r header\n    printf '%s\\n' \"$header\"\n\
    \    \"$@\"\n}\n$ command | body sort\n$ cat file | body sort\n```\n\n我常常希望对包含表头的命令输出进行排序。执行排序后，表头会和其余内容一起被排序。这个函数会保持表头行不变，并允许对输出的其余行进行排序。下面是一些示例，用于说明该函数的用法。\n\
    \n```sh\n$ df -h | sort -k 5\n/dev/vda2   28G   3.2G  25G       12%  /\ntmpfs\
    \             504M  68K   504M   1%       /dev/shm\n/dev/vda1   485M  444M  17M\
    \       97%  /boot\nFilesystem  Size  Used  Avail  Use%  Mounted  on\n$ df -h\
    \ | body sort -k 5\nFilesystem  Size  Used  Avail  Use%  Mounted  on\n/dev/vda2\
    \   28G   3.2G  25G       12%  /\ntmpfs             504M  68K   504M   1%    \
    \   /dev/shm\n/dev/vda1   485M  444M  17M       97%  /boot\n$ ps -eo pid,%cpu,cmd\
    \ | head -1\n  PID %CPU CMD\n$ ps -eo pid,%cpu,cmd | sort -nrk2 | head\n  675\
    \ 12.5 mysqld\n  PID %CPU CMD\n  994  0.0 /usr/sbin/acpid\n  963  0.0 /usr/sbin/modem-manager\n\
    \  958  0.0 NetworkManager\n  946  0.0 dbus-daemon\n  934  0.0 /usr/sbin/fcoemon\
    \ --syslog\n  931  0.0 [bnx2fc_thread/0]\n  930  0.0 [bnx2fc_12_threa]\n  929\
    \  0.0 [bnx2fc]\n$ ps -eo pid,%cpu,cmd | body sort -nrk2 | head\n  PID %CPU CMD\n\
    \  675 12.5 mysqld\n  994  0.0 /usr/sbin/acpid\n  963  0.0 /usr/sbin/modem-manager\n\
    \  958  0.0 NetworkManager\n  946  0.0 dbus-daemon\n  934  0.0 /usr/sbin/fcoemon\
    \ --syslog\n  931  0.0 [bnx2fc_thread/0]\n  930  0.0 [bnx2fc_12_threa]\n  929\
    \  0.0 [bnx2fc]\n$\n```\n\n### 从字符串或输出行中删除一个字符或一组字符\n\n```sh\n$ command | tr -d\
    \ \"X\"\n$ command | tr -d [SET]\n$ cat file | tr -d \"X\"\n$ cat file | tr -d\
    \ {SET}\n```\n\ntr 命令通常用于转换字符，但使用 -d 选项时，它会删除字符。此示例展示了如何去掉引号。\n\n```sh\n$ cat\
    \ cities.csv\n1,\"Chicago\",\"USA\",\"IL\"\n2,\"Austin\",\"USA\",\"TX\"\n3,\"\
    Santa Cruz\",\"USA\",\"CA\"\n$ cat cities.csv | cut -d, -f2\n\"Chicago\"\n\"Austin\"\
    \n\"Santa Cruz\"\n\n$ cat cities.csv | cut -d, -f2 | tr -d '\"'\nChicago\nAustin\n\
    Santa Cruz\n$\n```\n\n你也可以让 tr 删除一组字符。此示例会从输出中删除所有元音字母。\n\n```sh\n$ cat cities.csv\
    \ | cut -d, -f2 | tr -d [aeiou]\n\"Chcgo\"\n\"Astn\"\n\"Snt Crz\"\n$\n```\n\n\
    ### 统计字符串出现次数\n\n```sh\n$ uniq -c file\n$ command | uniq -c\n```\n\nuniq 命令会省略文件中相邻的重复行。由于\
    \ uniq 不会检查整个文件或输入流中的唯一行，而只检查相邻的唯一行，因此通常通过管道在其前面接上 sort 命令。你可以使用 \"-c\" 选项让 uniq\
    \ 命令统计字符串的唯一出现次数。当你试图在日志文件中查找相同消息、PID、状态码、用户名等的出现次数时，这会很有用。\n\n让我们在名为 access.log\
    \ 的 Apache Web 服务器日志文件中找出所有唯一的 HTTP 状态码。为此，使用 awk 命令打印日志文件中的第九项。\n\n```sh\n$ tail\
    \ -1 access.log\n18.19.20.21 - - [19/Apr/2014:19:51:20 -0400] \"GET / HTTP/1.1\"\
    \ 200 7136 \"-\" \"Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML,\
    \ like Gecko) Chrome/33.0.1750.154 Safari/537.36\"\n$ tail -1 access.log | awk\
    \ '{print $9}'\n200\n$ awk '{print $9}' access.log | sort | uniq\n200\n301\n302\n\
    404\n$\n```\n\n我们再进一步，统计每种状态码各有多少。\n\n```sh\n$ awk '{print $9}' access.log | sort\
    \ | uniq -c | sort -nr\n5641 200\n207 301\n86 404\n18 302\n2 304\n```\n\n现在，让我们从\
    \ access.log 文件中提取状态码和小时，并统计这些组合的唯一出现次数。接下来，按出现次数对它们排序。这将显示网站最活跃的时段。\n\n```bash\n\
    $ cat access.log | awk '{print $9, $4}' | cut -c 14,18-19 | uniq -c | sort -n\
    \ | tail\n\n      72 200 09\n      75 200 06\n      81 200 06\n      82 200 06\n\
    \      83 200 06\n      83 200 06\n      84 200 06\n     109 200 20\n     122\
    \ 200 20\n     383 200 10\n```\n\n## 网络与 SSH\n\n### 通过 Web 界面提供当前目录中的文件\n\n```sh\n\
