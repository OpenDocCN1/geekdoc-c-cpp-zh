    \ Web 服务器，并使用 Web 浏览器访问它。（firefox http://localhost:8000）\n\n当你处理 HTML 内容，并且想在不安装和配置完整\
    \ Web 服务器的情况下查看它在 Web 浏览器中的效果时，这会很方便。\n\n```sh\n    $ python -m SimpleHTTPServer\n\
    \    Serving HTTP on 0.0.0.0 port 8000 ...\n    localhost.localdomain - - [06/Apr/2014\
    \ 21:49:20] \"GET / HTTP/1.1\" 200 -\n```\n\n"
