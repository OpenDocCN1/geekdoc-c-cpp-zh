    你可以使用花括号展开（brace expansion）快速创建文件的备份副本。花括号展开允许你从单个参数创建多个命令行参数。该单个参数会与花括号内给出的所有字符串组合，并生成与花括号字符串数量相同的新参数。花括号中的值可以是逗号分隔的字符串，也可以是序列表达式。序列表达式的例子包括
