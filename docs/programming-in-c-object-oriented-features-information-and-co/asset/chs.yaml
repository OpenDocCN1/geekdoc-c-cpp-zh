  \ 关键字\n\n正如第 3 章 中提到的，C++ 允许程序员通过 `typedef` 关键字重命名数据类型。例如：\n\n```cpp\ntypedef unsigned\
  \ int Uint;\nUint price;\n```\n\n在这里我们将无符号整数定义为 `Uint`，以便我们可以像使用原生类型一样在程序中使用它，并用该类型声明变量。我们可以如下所示应用于结构体：\n\
  \n```cpp\ntypedef struct item {\n    char item_name[10];\n    float price;\n   \
  \ char manufacturer[40];\n    int item_no;\n} Food_item;\n```\n\n新定义的数据类型可以如下例所示使用：\n\
  \n```cpp\nFood_item Biscuit;\nFood_item Candy;\n```\n\n程序 11.2 显示了一个 typedef 语句的示例。\n\
  \n## 11.6 嵌套结构体\n\n在程序 11.1 中，`item` 结构体只有四个成员。让我们使用 `expiry_date` 变量考虑该项目的另一个成员。通常日期包含日、月、年，这包含了三个额外的成员。在这种情况下，我们可以定义一个结构体，其内部包含另一个结构体。以下示例描述了一个嵌套结构体的示例：\n\
  \n```cpp\nstruct item {\n    char item_name[10];\n    float price;\n    char manufacturer[40];\n\
  \    int item_no;\n    item_date expiry_date;\n};\n```\n\n`expiry_date` 结构体的定义需要编译器预先定义\
  \ `item_date` 结构体，否则会产生编译器错误。因此，我们可以如下定义 `item_date` 结构体：\n\n\n\n\n```cpp\ntypedef\
  \ struct date{\n    int day;\n    int month;\n    int year;\n}item_date;\n```\n\n\
  程序 11.2 展示了使用之前描述结构进行嵌套结构的示例。\n\n```cpp\n// Program 11.2 // 嵌套结构体示例\n#include <iostream>\n\
  #include <cstring>\nusing namespace std;\nint main() {\n    typedef struct date\n\
  \    {\n        int day;\n        int month;\n        int year;\n    }item_date;\n\
  \    struct item\n    {\n        char item_name[10];\n        float price;\n   \
  \     char manufacturer[40];\n        int item_no;\n        item_date expiry_date;\n\
  \    } Biscuit;\n    // 初始化结构体 Biscuit 的前三个成员\n    strcpy(Biscuit.item_name, \"\
  SweetBest\");\n    Biscuit.price = 7.5;\n    strcpy(Biscuit.manufacturer,\"Qingdao\
  \ Biscuits Ltd\");\n    Biscuit.item_no = 9341;\n    // 初始化嵌套结构体 expiry_date\n \
  \   Biscuit.expiry_date.day = 11;\n    Biscuit.expiry_date.month = 8;\n    Biscuit.expiry_date.year\
  \ = 2019;\n    // 向屏幕显示 Biscuit 信息，包括过期日期\n    cout << endl << \"Biscuit Information\
  \ \" << endl;\n    cout << \"Biscuit Name: \" << Biscuit.item_name << endl;\n  \
  \  cout << \"Biscuit Price: \" << Biscuit.price << endl;\n    cout << \"Biscuit\
  \ Manufacturer: \" << Biscuit.manufacturer << endl;\n    cout << \"Biscuit Item\
  \ Number: \" << Biscuit.item_no << endl;\n    cout << \"Biscuit Expiry Date: \"\
  \ \n    << Biscuit.expiry_date.day << \"/\"\n    << Biscuit.expiry_date.month <<\
  \ \"/\"\n    << Biscuit.expiry_date.year << endl;\n    return 0;\n}\n```\n\n程序 11.2\
  \ 的结果如下所示：\n\n`Biscuit Information Biscuit Name: SweetBest Biscuit Price: 7.5 Biscuit\
  \ Manufacturer: Qingdao Biscuits Ltd Biscuit Item Number: 9341 Biscuit Expiry Date:\
  \ 11/8/2019`\n\n此示例演示了 `typedef` 关键字与结构结合使用。最初，使用成员运算符或点操作法逐个对 `struct item` 类型的\
  \ `Biscuit` 结构的前四个成员进行了了初始化。由于第一个成员 `item_name` 和第三个成员 `manufacturer` 是字符数组，我们使用了\
  \ `strcpy()` 函数将字符串赋值给它们。第四个成员 `expiry_date` 是 `item_date` 类型的嵌套结构。由于 `expiry_date`\
  \ 结构位于 `Biscuit` 结构内部，我们应该使用点号，如后续语句所示。\n\n`Biscuit.expiry_date.day = 11; Biscuit.expiry_date.month\
  \ = 8; Biscuit.expiry_date.year = 2019;`\n\n## 11.7 包含数组的结构\n\n在程序 11.2 定义的结构 `item`\
  \ 中，成员 `item_name` 和 `manufacturer` 都是字符数组。因此，结构中完全可能包含包含数组作为元素的结构，尽管在初始化它们时需要格外注意。让我们考虑一个同时包含字符数组和整数数组的结构示例。\n\
