  \n1. 输入两个数字并计算它们的和、平均值以及平方和。\n2. 写一个程序读取一个 `float` 类型的摄氏度，并以 `float` 类型打印等值的华氏度温度。按以下格式打印结果：`100.0\
  \ degrees Celsius converts to 212.0 degrees Fahrenheit`。\n3. 如果输入的是整数秒数，请输出等值的小时、分钟和秒。推荐的输出格式如下：`7322\
  \ seconds is equivalent to 2 hours 2 minutes 2 seconds`。\n4. 写一个程序打印几行内容（例如，你的名字和地址）。你可以使用多个带有换行符的\
  \ `cout` 指令，也可以使用一个在字符串中包含多个换行符的 `cout`。\n5. 写一个程序使用三元运算符找到三个数的最大值。\n6. （全局地）声明一个枚举类型\
  \ `rainbow`，由红、蓝、绿、紫组成。在 `main` 函数中，声明一个类型为 `rainbow` 的变量 `color`。将 `color` 初始化为常量\
  \ `blue`。然后将常量 `purple` 赋值给变量 `color`。\n7. 设计、开发并执行一个 C++ 程序，寻找并输出给定二次方程（系数非零）的所有根。\n\
  8. 写一个 C++ 程序，使用 `for` 循环生成 `n` 个斐波那契数。\n9. 写一个程序，输出一个高度为 `n`、宽度为 `2n-1` 的右三角形；`n\
  \ = 6` 的输出如下（graphic/22_book_fig_01.png）：\n10. 设计、开发并执行一个 C++ 程序，实现欧几里得算法以找到两个整数的\
  \ `GCD`（最大 LCM）和 `LCM`，并输出结果以及这两个整数。\n11. 设计、开发并执行一个 C++ 程序，反转一个指定的四位数并检查它是否为回文。带有适当的消息输出该数字。\n\
  12. 设计、开发并执行一个 C++ 程序，使用秦纳法（Horner’s method）对给定的 `x` 值和系数计算 `f(x) = a4x4 + a3x3\
  \ + a2x2 + a1x + a0`。\n13. 写一个程序提示用户输入字符串，并在不使用库的情况下打印其反转字符串。\n14. 写一个程序提示用户输入句子，并将每个单词单独打印在一行。\n\
  15. 写一个函数计算一个数字是否为质数。如果是质数返回 `1`，否则返回 `0`。\n16. 写一个函数确定 `n` 以下质数的个数。\n17. 写一个函数使用牛顿法求一个数的平方根。\n\
  18. 写一个程序求出给定序列中偶数和奇数的个数。\n19. 设计、开发并执行一个 C++ 程序，将输入复制到输出中，并将每组一个或多个空格的字符串替换为一个空白格。\n\
  20. 设计、开发并执行一个 C++ 程序，按升序输入 `N` 个数字到一个一维数组中，对给定的键值进行二分查找，并以适当的消息形式报告成功或失败。\n21.\
  \ 设计、开发并执行一个 C++ 程序，将 `N` 个数字输入到一个维数组中，进行升序排序（使用冒泡排序），并输出排序结果和适当的消息。\n22. 设计、开发并执行一个\
  \ C++ 程序，读取两个矩阵 `A (M × N)` 和 `B (P × Q)`，如果矩阵兼容则计算它们的乘积，并输出结果，输出适当的消息。\n23. 设计、开发并执行一个\
  \ C++ 程序，反转一个指定的四位数并检查它是否为回文。带有适当的消息输出该数字。\n24. （全局地）声明一个枚举类型，由 `int`、`float` 和\
  \ `char` 变量组成。在 `main` 函数中，声明一个类型为该枚举的变量 `a`。将 `a` 初始化为常量 `b`。然后将常量 `c` 赋值给变量 `a`。\n\
  25. 写一个程序，调用函数 `a`、函数 `b`、调用函数 `c`。\n26. 写一个 C++ 程序，使用递归演示汉诺塔。\n27. 写一个 C++ 程序，使用递归生成\
  \ `n` 个斐波那契数。\n\n## 附录 C\n\n## C++ OOP 练习列表\n\n1. 定义类 `student`，包含两个数据成员（`age` 和\
  \ `number`）和两个方法成员（`readValues()` 和 `printValues()`）。`readValues()` 方法从键盘读取数据，`printValues()`\
  \ 方法打印到屏幕。创建一个类型 `student` 的对象 `TOM`，并理解类和对象的使用。（完整程序写在此处供参考。）\n\n```cpp\n//Program\
  \ by Liu Shan //Date: January 20,2018 //C++ Programming@ SDU\n#include<iostream>\n\
  using namespace std;\nclass student {\npublic:\n    int age;\n    int number;\n\
  \    void readValues() {\n        cout << \"Enter age of student \" << endl;\n \
  \       cin >> age;\n        cout << \"Enter student number \" << endl;\n      \
  \  cin >> number;\n    }\n    void printValues() {\n        cout << \"Student Age\
  \ :\" << age << endl;\n        cout << \"Student Number :\" << number << endl;\n\
  \    }\n};\nint main() {\n    student TOM;\n    TOM.readValues();\n    TOM.printValues();\n\
  \    return 0;\n}\n```\n\n2. 重复之前的练习，并将数据成员设置为 `public`、`private` 和 `protected`。查看变化，并记录编译期间出现的错误（如有）。尝试所有访问修饰符组合：(a)\
  \ 将所有数据和方法成员设为 `public`，(b) 将所有数据和方法成员设为 `private`，(c) 将所有数据和方法成员设为 `protected`，(d)\
  \ 将部分成员设为 `private` 部分为 `public`，(e) 将部分成员设为 `private` 部分为 `protected`，以及 (f) 将部分成员设为\
  \ `public` 部分为 `protected`。\n\n3. 重复练习 1，并为 `student` 类创建两个对象（`TOM` 和 `JACK`），测试这两个对象的\
