  9.9 的结果如下：\n\n`The Student's names in ascending order: Ann Devi Jack Liu Mary Rai\
  \ Shiela Zhang`\n\n## 10 复习题\n\n1. 什么是搜索？解释 `linear search`（线性搜索）和 `binary search`（二分查找）方法。\n\
