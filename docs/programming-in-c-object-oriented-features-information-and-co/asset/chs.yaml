  }\n```\n\n## 8.2 字符串库函数\n\n在本节中，我们将简要描述 C++ 中一些常用的字符串函数。`cstring` 库定义了各种用于对字符串执行操作的函数。但为了使用表\
  \ 8.1 中提到的任何函数，都需要 `#include <cstring>`。\n\n表 8.1：字符串函数及其描述。\n\n| 函数 | 描述 |\n| :---\
  \ | :--- |\n| `strlen(str)` | 该函数返回字符串 `str` 的长度。字符串长度是指不包含终止字符 `\\0` 的字符数 |\n|\
  \ `strcpy(dest, src)` | 字符串拷贝函数。第一个参数是目标字符串，第二个参数是源字符串。`strcpy` 将源字符串的内容拷贝到目标字符串，包括空字符\
  \ `'\\\\0'` |\n| `strcat(dest, src)` | 字符串拼接函数。第一个参数是目标字符串，第二个参数是源字符串。`strcat()`\
  \ 将源数组的内容附加到目标数组。目标数组的终止空字符会被源数组的第一个字符覆盖，并在新字符串末尾引入空字符 |\n| `strcmp(str1, str2)`\
  \ | 该函数比较两个字符串。第一个参数是 `str1`，第二个参数是将被比较的 `str2`。它从比较两个字符串的第一个字符开始，一直直到找到非匹配字符或终止空字符。该函数返回一个整数。当两个字符串相等时返回\
  \ 0。当发现的非匹配字符在 `str1` 中的值小于 `str2` 时，返回负值。当发现的非匹配字符在 `str1` 中的值大于 `str2` 时，返回正值\
  \ |\n| `strchr(str, ch)` | 该函数返回字符串 `str` 中字符 `ch` 第一次出现的指针。该函数用于定位字符串中字符的首次出现。也可以以此定位以获取字符串末尾的指针\
  \ |\n| `strstr(str1, str2)` | 该函数用于查找子字符串，并返回字符串 `str2` 在字符串 `str1` 中第一次出现的指针；如果\
  \ `str2` 不是 `str1` 的一部分，则返回空指针 |\n\n\n\n\n程序 8.6 展示了一个演示 C++ 中一些字符串函数的示例。\n\n```cpp\n\
  // Program 8.6 // 处理字符串的函数\n#include <iostream>\n#include <cstring>\nusing namespace\
  \ std;\nint main () {\n    char str1 [20] = \"Great\";\n    char str2 [20] = \"\
  Wall\";\n    char str3 [20];\n    // 查找 str1 的长度\n    cout << \"strlen(str1) : \"\
  \ << strlen(str1) << endl;\n    // 将 str1 拷贝到 str3\n    strcpy( str3, str1);\n \
  \   cout << \"strcpy( str3, str1) : \" << str3 << endl;\n    // 拼接 str1 和 str2\n\
  \    strcat( str1, str2);\n    cout << \"strcat( str1, str2) : \" << str1 << endl;\n\
  \    return 0;\n}\n```\n\n程序 8.6 的结果如下：\n\n`strlen(str1) : 5` `strcpy(str3, str1)\
  \ : Great` `strcat(str1, str2) : GreatWall`\n\n## 8.3 字符串数组\n\n正如我们之前提到的，字符的集合被称为字符串。例如，地名、人名和植物名都是字符串。然而，在许多应用程序中，处理数千个字符串是非常重要的。例如，一个级管理程序需要读取所有学生的名字，换句话说，需要读取字符串数组。字符串数组可以通过使用二维字符数组的方法声明数组来创建。字符串数组是多维数组，即字符串的数组或字符的数组。考虑以下表达式：\n\
  \n`char names [10][40];`\n\n上述变量是一个字符串数组，包含 10 个名称，每个名称最多有 39 个字符。C++ 允许定义任何维度的数组，数组的第一个索引表示行数，第二个索引表示列数。二维数组的初始化方式与一维数组相同。程序\
  \ 8.7 展示了一个从键盘读取五个名称并将它们显示在屏幕上的示例。\n\n```cpp\n// Program 8.7 // 字符串数组\n#include\
  \ <iostream>\n#include <cstring>\nusing namespace std;\nint main () {\n    char\
  \ names [10][40];\n    int i = 0;\n    cout << \" Enter five names one by one :\
  \ \" << endl;\n    for(i = 0; i<5; i ++)\n        cin >> names [i];\n    cout <<\
  \ endl<<\"Entered names are :\" << endl;\n    for(i = 0; i<5; i++)\n        cout\
  \ << names [i] << endl;\n    return 0;\n}\n```\n\n程序 8.7 的示例结果如下：\n\n`Enter five\
  \ names one by one : Linda Jessica Ashan Cicely Amila` `Entered names are : Linda\
  \ Jessica Ashan Cicely Amila`\n\n## 8.4 指针引言\n\n指针是 C++（或 C）中指向内存位置的变量。它不直接包含如 `int`\
  \ 或 `float` 这样的值。人们可以通过指针变量间接地访问该值。指针的声明如下：\n\n`int *ptr1; int i; ptr1 = &i;`\n\n\
  在这里，我们必须理解变量前的字符 `*` 和 `&` 起的作用。变量前的字符 `*` 用于声明指针变量，它也用于指针变量前面以访问并检索指针变量包含的值，而不是地址。然而，字符\
  \ `&` 用于访问指针指向的整数变量的地址。在上面的示例中，我们声明了一个整数指针 `ptr1` 和整数变量 `i`。然后我们让指针 `ptr1` 指向变量\
  \ `i` 的地址。考虑程序 8.8 来理解指针的概念。\n\n```cpp\n// Program 8.8 // 理解指针的程序\n#include <iostream>\n\
  using namespace std;\nint main () {\n    int *ptr;\n    int i = 18;\n    ptr = &i;\n\
  \    cout << \" The value of i is \" << i << endl;\n    cout << \" The pointer ptr\
  \ (*ptr) contains the value \" \n        << *ptr << endl;\n    return 0;\n}\n```\n\
