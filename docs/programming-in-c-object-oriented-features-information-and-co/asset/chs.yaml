  ,\"Liu\",\"Bai\",\"Devi\",\"Shiela\"};\n```\n\n在这个例子中，`list[10][10]` 是一个二维字符数组。程序\
  \ 9.9 展示了如何使用泡排序技术对上述字符串进行排序。\n\n```cpp\n// 程序 9.9 // 排序字符串数组程序\n#include <iostream>\n\
  #include <cstring>\nusing namespace std;\n#define Array_Length 10\nint main() {\n\
  \    char list[10][10] =\n    {\"Mary\",\"Jack\",\"Zhang\",\"Rai\",\"Ann\",\"Lee\"\
