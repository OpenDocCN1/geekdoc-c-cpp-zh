  \ 18`\n\n与其他存储值的普通变量不同，指针是存储存储变量地址的特殊变量。由于它们存储变量的内存地址，因此指针通常被称为“指向变量”。如程序 8.8 所示，普通变量\
  \ `i` 可能有一个地址，例如 `5060`，并持有值 `18`。然而，指针变量 `ptr` 有自己的地址，但存储的是 `5060`，即变量 `i` 的地址。\n\
