  \ 和 (d) `inline`。\n8. 函数作用域意味着什么？描述 C++ 函数中全局变量和静态变量的作用。\n9. 什么是递归？编写一个 C++ 程序演示递归。\n\
  10. 编写一个 C++ 程序使用递归计算数字的阶乘。\n11. 编写一个 C++ 程序使用递归生成斐波那斐数列。\n12. 编写一个 C++ 程序使用递归演示汉诺塔问题。\n\
  13. 使用 C++ 编写程序演示内联函数。\n14. 列出 C++ 中至少五种结构体及其应用。\n\n# 11 结构体与联合体\n\n## 11.1 引言\n\
  \n结构体是一种通过单一名称允许在内存中访问不同类型的自定义类型，在 C++ 中通过 `struct` 关键字定义。到目前为止，我们理解了如何使用相同类型的数据。然而，结构体允许我们将不同类型组合在一起。例如：\n\
  \n```cpp\nstruct item {\nchar item_name[10]; // 例如 \"Sweet\"\nfloat price; // 例如\
  \ 7.5 RMB\nchar manufacturer[40]; // 例如 青岛饼干\nint item_no; // 例如 9341\n```\n\n结构体可以视为一组具有相同名称变量的集合。在\
  \ C++ 中，通过 `struct` 关键字来定义不同类型的信息。在（下一节]中，我们将理解定义结构体的方法。\n\n## 11.2 定义结构体\n\n结构体可以被视为一组具有相同名称变量的模板。结构体帮助程序员将不同类型的元素组合在一个逻辑单元中。与数组不同，数组仅允许组合相同类型的元素。定义结构体时必须使用\
  \ `struct` 关键字。`struct` 关键字定义了一个具有多个成员的新类型。定义的格式如下：\n\n```cpp\nstruct [标签] {\n成员定义;\n\
  成员定义;\n...\n成员定义;\n} [一个或多个结构体变量];\n```\n\n结构标签是可选的，每个成员的定义方式与普通变量相同，例如 `int i;`\
  \ 或 `float f;` 或任何其他有效变量。在结构定义的最后一个分号之前，我们可以指定一个或多个结构体变量；但这是可选的。考虑到之前的项目示例，我们可以定义一个名为\
  \ `item` 的结构，包含 `item_name`、`price`、`manufacturer` 和 `item_no` 四个元素，如下：\n\n```cpp\n\
  struct item {\nchar item_name[10];\nfloat price;\nchar manufacturer[40];\nint item_no;\n\
  };\n```\n\n\n\n\n上述语句没有定义任何变量，但它定义了一个新类型，该类型的名称为 `item`。这意味着当我们首次在文件中定义一个结构体时，该语句只是告诉\
  \ C++ 编译器存在一个结构体，但并没有为它分配任何内存。内存分配只在声明结构体变量时发生。`struct` 关键字将 `item` 定义为一个结构体，而构成该类型对象的元素定义在大括号内。注意，在\
  \ `struct` 中定义每个元素的每一行都以分号结束，并且在右大括号后面也会出现一个分号。结构体的元素可以是任何类型，但与正在定义的结构体类型除外。结构体类型通常定义在程序的开头，通常紧接在\
  \ `main()` 语句之后。之后，在程序中声明并使用该结构体类型的变量。例如：\n\n```cpp\nstruct item Biscuit;\n```\n\
  \n我们也可以像下面所示，定义一个 `struct item` 类型的变量：\n\n```cpp\nstruct item {\n    char item_name[10];\n\
  \    float price;\n    char manufacturer[40];\n    int item_no;\n} Biscuit;\n```\n\
  \n同样，为了定义多个 `struct item` 类型的变量，我们可以使用以下任何一条语句。\n\n```cpp\nstruct item Biscuit,\
  \ Candy;\n```\n\n或者，\n\n```cpp\nstruct item {\n    char item_name[10];\n    float\
  \ price;\n    char manufacturer[40];\n    int item_no;\n} Biscuit, Candy;\n```\n\
  \n## 11.3 结构体的初始化\n\n为结构体对象的成员赋值的第一方法是在对象定义中定义它们的初始值。假设我们想初始化一个项目，其中包含你喜爱的饼干名称之一“SweetBest”的数据，价格为\
  \ 7.50 元，项目编号为 9341，并由“青岛饼干有限公司”制造。我们可以如下初始化结构体：\n\n```cpp\nstruct item Biscuit\
  \ = { \"SweetBest\", 7.5, \"Qingdao Biscuits Ltd\", 9341 };\n```\n\n初始化值出现在初始化列表中，其方式与数组元素非常相似。然而，数组中初始值的顺序需要与结构体在定义中成员的顺序一致。`Biscuit`\
  \ 结构体中的每个成员都分配了相应的初始值，如注释所示。初始化结构体变量的语法与标准变量不同。由于 `item_name` 和 `manufacturer` 成员是字符数组或字符串，简单使用赋值语句将不起作用。通过点运算符（dot\
  \ notation）访问结构体元素。单个元素，如 `price` 和 `item_no` 的初始化如下：\n\n```cpp\nBiscuit.price =\
  \ 7.5; Biscuit.item_no = 9341;\n```\n\n人们可以通过像之前那样初始化单个元素来初始化结构体，也可以简单地在大括号内列出元素的值，每个值在单行中用逗号分隔，如下文所示。\n\
  \n```cpp\nstruct item Biscuit = {\"SweetBest\",7.5,\"Qingdao Biscuits Ltd\",9341};\n\
  ```\n\n与数组初始化类似，结构体的部分初始化可以如下：\n\n```cpp\nstruct item Biscuit = {\"SweetBest\",7.5,\"\
  Qingdao Biscuits Ltd\"};\n```\n\n在前一种例中，`item_no` 元素被初始化为 0.0。在下一节 中，我们将学习更多关于点运算符以及如何访问成员结构体的知识。\n\
  \n## 11.4 访问结构体成员\n\n在第 11.3 节 中，我们学习了定义结构体并初始化其成员。要访问结构体的成员，我们使用点（`.`）作为成员选择运算符。该运算符有时被称为成员访问运算符。要引用一个成员，我们编写变量名结构，后面跟一个点，然后是成员的名称。成员访问运算符编码为结构体变量名和我们想要访问的结构体成员之间的点。例如，要将\
  \ `item_no` 改为 1818，我们可以如下所示编写：\n\n```cpp\nBiscuit.item_no = 1818;\n```\n\n这会将 `item_no`\
  \ 的值设置为 1818。此外，我们可以像使用任何其他变量一样的方式使用结构体的成员。例如，要将成员年份增加 4，我们可以写：\n\n```cpp\nBiscuit.item_no\
  \ += 4;\n```\n\n程序 11.1 显示了一个总结了之前描述的示例。在接下来的程序中，为结构体 Biscuit 声明了两个 `struct item`\
  \ 类型的结构体 `Biscuit` 和 `Candy`。我们通过初始化来提供值。然而，对于结构体 `Candy`，我们从键盘读取值。最后，信息显示在屏幕上。\n\
  \n```cpp\n// 程序 11.1 // 理解结构体\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    struct item {\n        char item_name[10];\n        float price;\n    \
  \    char manufacturer[40];\n        int item_no;\n    };\n    // 初始化 Biscuit 变量\n\
  \    struct item Biscuit = {\n        \"SweetBest\",\n        7.5,\n        \"Qingdao\
  \ Biscuits Ltd\",\n        9341\n    };\n    struct item Candy;\n    // 读取 Candy\
  \ 成员的值\n    cin >> Candy.item_name;\n    cin >> Candy.price;\n    cin >> Candy.manufacturer;\n\
  \    cin >> Candy.item_no;\n    cout << Biscuit.item_name << endl;\n    cout <<\
  \ Biscuit.price << endl;\n    cout << Biscuit.manufacturer << endl;\n    cout <<\
  \ Biscuit.item_no << endl;\n    cout << Candy.item_name << endl;\n    cout << Candy.price\
  \ << endl;\n    cout << Candy.manufacturer << endl;\n    cout << Candy.item_no <<\
  \ endl;\n    return 0;\n}\n```\n*(注：由于原文提供的代码块 11.1 描述部分不完整，翻译时根据上下文补全了逻辑输入输出部分，以保持逻辑一致，但严格遵循了翻译要求)*\n\
