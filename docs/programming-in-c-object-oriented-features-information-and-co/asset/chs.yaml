  \n`char names [10][40];`\n\n上述变量是一个字符串数组，包含 10 个名称，每个名称最多有 39 个字符。C++ 允许定义任何维度的数组，数组的第一个索引表示行数，第二个索引表示列数。二维数组的初始化方式与一维数组相同。程序\
  \ 8.7 展示了一个从键盘读取五个名称并将它们显示在屏幕上的示例。\n\n```cpp\n// Program 8.7 // 字符串数组\n#include\
  \ <iostream>\n#include <cstring>\nusing namespace std;\nint main () {\n    char\
  \ names [10][40];\n    int i = 0;\n    cout << \" Enter five names one by one :\
  \ \" << endl;\n    for(i = 0; i<5; i ++)\n        cin >> names [i];\n    cout <<\
  \ endl<<\"Entered names are :\" << endl;\n    for(i = 0; i<5; i++)\n        cout\
  \ << names [i] << endl;\n    return 0;\n}\n```\n\n程序 8.7 的示例结果如下：\n\n`Enter five\
  \ names one by one : Linda Jessica Ashan Cicely Amila` `Entered names are : Linda\
  \ Jessica Ashan Cicely Amila`\n\n## 8.4 指针引言\n\n指针是 C++（或 C）中指向内存位置的变量。它不直接包含如 `int`\
  \ 或 `float` 这样的值。人们可以通过指针变量间接地访问该值。指针的声明如下：\n\n`int *ptr1; int i; ptr1 = &i;`\n\n\
  在这里，我们必须理解变量前的字符 `*` 和 `&` 起的作用。变量前的字符 `*` 用于声明指针变量，它也用于指针变量前面以访问并检索指针变量包含的值，而不是地址。然而，字符\
  \ `&` 用于访问指针指向的整数变量的地址。在上面的示例中，我们声明了一个整数指针 `ptr1` 和整数变量 `i`。然后我们让指针 `ptr1` 指向变量\
  \ `i` 的地址。考虑程序 8.8 来理解指针的概念。\n\n```cpp\n// Program 8.8 // 理解指针的程序\n#include <iostream>\n\
  using namespace std;\nint main () {\n    int *ptr;\n    int i = 18;\n    ptr = &i;\n\
  \    cout << \" The value of i is \" << i << endl;\n    cout << \" The pointer ptr\
  \ (*ptr) contains the value \" \n        << *ptr << endl;\n    return 0;\n}\n```\n\
  \n程序 8.8 的结果如下：\n\n`The value of i is 18` `The pointer ptr (*ptr) contains the value\
  \ 18`\n\n与其他存储值的普通变量不同，指针是存储变量地址的特殊变量。由于它们存储变量的内存地址，因此指针通常被称为“指向变量”。如程序 8.8 所示，普通变量\
  \ `i` 可能有一个地址，例如 `5060`，并持有值 `18`。然而，指针变量 `ptr` 有自己的地址，但存储的是 `5060`，即变量 `i` 的地址。\n\
  \n### 理解指针\n\n指针可以声明为：\n\n`pointer-type *pointer-name;` 或\n`pointer-type *pointer-name;`\n\
  \n`pointer-type` 指定了指针的类型。它可以是 `int`、`char`、`float` 等。这种类型指定了该指针可以存储地址的变量类型。`pointer-name`\
  \ 可以是用户指定的任何变量名。\n\n\n\n\n程序 8.10 展示了一个涵盖所有常用指针的示例。`int`、`char` 和 `float` 指针很容易理解，它们非常直观。然而，字符串指针就完全不同。正如语句\
  \ `char *sptr = \"Hello World!\";` 所示，字符指针 `*sptr` 指向一个字符串。可以看出，该语句包含一个字符串而不是单个字符。这表明字符指针和字符串指针的使用方式相同，尽管它们的应用不同。当我们让指针指向一个字符串时，默认情况下它持有该字符串第一个字符的地址。因此，当我们尝试打印\
  \ `*sptr` 时，它只显示第一个字符‘H’。这意味着任何指向字符串的字符指针都存储了该字符串第一个字符的地址。在上面的代码中，`sptr` 持有字符‘H’的地址。因此，当我们对\
  \ `sptr` 应用“取值”运算符 `*` 时，‘H’ 将作为输出显示。然而，如果我们尝试显示 `sptr`，编译器将打印出整个字符串。\n\n## 8.5\
  \ 指针的指针\n\n到为止，我们已经学习了指针是存储另一个变量地址的特殊变量。这里可能会出现一个问题：是否可能存储指针本身的地址？答案是肯定的。在 C 和 C++\
  \ 中，指针指向另一个指针是完全合法的。让我们在这里考虑一个有趣的假设。\n\n有一天，在北京寻找一个门牌号时，你发现了一个 A 人，他同意引导你。不幸的是，A\
  \ 人无法找到你正在寻找的那条街道；于是他叫了他的朋友 B 来引导他。朋友 B 也未能找到那条街道，又叫了他的朋友 C 来寻找。让我们假设 C 最终能够引导 B，然后\
  \ B 能够将信息传给 A。最后，你从 A 那里收到了定位该街道的所需信息。\n\n现在，在这种场景中，让我们假设你寻找的信息只是一个整数（例如门牌号）。那么，我们可以让你作为\
  \ A 的指针（因为你向他索要信息），并将 A 作为指向 B 的指针，将 B 作为指向 C 的指针；最后 C 拥有正确的门牌号。程序 8.13 展示了一个示例，我们可以通过指向其他指针的指针来演示上述场景。\n\
  \n```cpp\n// Program 8.11 // 指针的指针\n#include <iostream>\nusing namespace std;\n\
  int main () {\n    int stNo = 1818; //门牌号\n    int *C; //指针 C 用于存储 stNo 的地址\n  \
  \  int **B; // 指针的指针，存储 C 的地址\n    int ***A; // 指针的指针，存储 B 的地址\n    int ****meptr;//指针针的指针，存储\
  \ A 的地址\n    C = &stNo;\n    B = &C;\n    A = &B;\n    meptr = &A;\n    cout <<\
  \ \" Value of meptr = : \" << meptr << endl;\n    cout << \" Value of *meptr = :\
  \ \" << *meptr << endl;\n    cout << \" Value of **meptr = : \" << **meptr << endl;\n\
  \    cout << \" Value of **meptr = : \" << **meptr << endl;\n    cout << \" Value\
  \ of ***meptr = : \" << ***meptr << endl;\n    cout << \" Value of ****meptr = :\
  \ \" << ****meptr << endl << endl;\n    cout << \" Value of A = : \" << A << endl;\n\
  \    cout << \" Value of *A = : \" << *A << endl;\n    cout << \" Value of **A =\
  \ :\" << **A << endl;\n    cout << \" Value of ***A = : \" << ***A << endl << endl;\n\
  \    cout << \" Value of B = : \" << B << endl;\n    cout << \" Value of *B = :\
  \ \" << *B << endl;\n    cout << \" Value of **B = : \" << **B << endl << endl;\n\
  \    cout << \" Value of C = : \" << C << endl;\n    cout << \" Value of *C = :\
  \ \" << *C << endl;\n    return 0;\n}\n```\n\n程序 8.11 的结果如下：\n\n`Value of meptr\
  \ = :0018FF38 Value of *meptr = :0018FF3C Value of **meptr = :0018FF40 Value of\
  \ **meptr = :0018FF40 Value of ***meptr = :0018FF44 Value of ****meptr = :0018FF18\
  \ Value of A = :0018FF3C Value of *A = :0018FF40 Value of **A = :0018FF44 Value\
  \ of ***A = :0018FF18 Value of B = :0018FF40 Value of *B = :0018FF44 Value of **B\
  \ = :0018FF18 Value of C = :0018FF44 Value of *C = :0018FF18`\n\n然而，地址值可能会随计算机的不同而改变。图\
  \ 8.3 展示了这种场景，并描述了地址是如何存储在不同变量中的。从结果中可以看出，`****meptr`、`***A`、`**B` 和 `*C` 的值都等于\
  \ `18118`。\n\n## 8.6 指针与数组\n\n在 C 和 C++ 中，指针和数组密切相关。在 C 和 C++ 中，指针和数组密切相关。指针在数组的操作中非常有用。\n\
  \n```cpp\nint *ptr;\nint arr[5];\nptr = &arr[0];\n```\n\n在 C 和 C++ 中，指针和数组密切相关。指针在数组的操作中非常有用。通过`*ptr`访问`arr[0]`，通过`*(ptr+1)`访问`arr[1]`，依此类推。使用`++`或`--`运算符可以方便指针移动：\n\
  \n```cpp\nptr++; // 指针指向下一个元素\nptr--; // 指针指向上一个元素\n```\n\n这种方法在处理数组时非常高效。\n\n\n\
  \n\n\n```cpp\n// Program 8.13 // Arrays and pointers\n#include <iostream>\nusing\
  \ namespace std;\nint main () {\n    int a[5] = {11, 8, 45, 47, 9};\n    *a = *(a\
  \ + 2) + (*a)++;\n    cout << \" The value of *a = \" << a[0] << endl;\n    return\
  \ 0;\n}\n```\n\n程序 8.13 的结果如下：\n\n`The value of *a = 57`\n\n## 8.7 指针数组\n\n除了数组和指针之间的紧密关系外，我们还可以拥有类似于整数数组或字符数组的指针数组。指针数组可以如下所示声明：\n\
  \n`<type> *<name> [<number-of-elements];`\n\n例如：`char *ptr[3];`\n\n上述行声明了一个包含三个字符指针的数组。程序\
  \ 8.14 显示了使用字符指针数组的示例。我们特意选取了字符指针数组，是因为它们在处理字符串时有许多优势，因为数组存储的是字符串的地址，我们可以使用指针名称轻松地显示字符串。在这个程序中，我们最初创建了三个字符指针，然后将它们赋值给一个指针数组。因此，现在数组持有字符串的地址。\n\
  \n```cpp\n// Program 8.14 // Array of pointers example\n#include <iostream>\nusing\
  \ namespace std;\nint main(void) {\n    char *p1 = \"Liu\";\n    char *p2 = \"Shan\"\
  ;\n    char *p3 = \"Jinan\";\n    char *arr[3];\n    arr [0] = p1;\n    arr [1]\
  \ = p2;\n    arr [2] = p3;\n    cout << \" p1 = \" << p1 << endl;\n    cout << \"\
  \ p2 = \" << p2 << endl;\n    cout << \" p3 = \" << p3 << endl;\n    cout << \"\
  \ arr[0] = \" << arr[0] << endl;\n    cout << \" arr[1] = \" << arr[1] << endl;\n\
  \    cout << \" arr[2] = \" << arr[2] << endl;\n    return 0;\n}\n```\n\n在程序 8.14\
  \ 中，我们取了指向三个字符串的三个指针。然后我们声明了一个可以包含三个指针的数组。我们将指针 `p1`、`p2` 和 `p3` 分别赋值给数组的索引 0、1\
  \ 和 2。程序 8.14 的结果如下：\n\n`p1 = Liu p2 = Shan p3 = Jinan arr [0] = Liu arr [1] = Shan\
  \ arr [2] = Jinan`\n\n## 8.8 复习题\n\n1. 用一个示例说明 C++ 中的字符串。\n2. 写一个程序，使用字符数组将一个字符串复制到另一个字符串，且不使用如\
  \ `strcpy` 等标准字符串库函数。\n3. `NULL` 终止符在字符串中起什么作用？请用示例进行说明。\n4. 列出 C++ 中至少五个内置的字符串函数。\n\
  5. 写一个 C++ 程序来理解以下字符串函数：`strcmps`、`strcpy`、`strcat`、`strtev` 和 `strlen`。\n6. 写一个\
  \ C++ 程序将小写字符串转换为大写字符串。\n7. 什么是指针？如何在 C++ 中声明整数指针？\n8. 写一个 C++ 程序来理解指针。\n9. 写一个\
  \ C++ 程序来演示使用指针的函数。\n10. 用一个示例程序描述指针和数组之间的关系。\n11. 用示例列出 C++ 中数组和指针之间的区别。\n12. 写一个程序演示指向另一个指针的指针。\n\
  \n# 9 搜索与排序\n\n知而不行，非不知。\n– 王阳明\n\n## 9.1 引言\n\n在本章中，我们将学习不同的排序和搜索方法。排序和搜索方法在当今的计算环境中非常有用，被用于几乎所有的应用程序，例如学生数据库、电话簿、员工数据库信息和旅游数据库应用程序。排序用于按照特定顺序排列不同类型的数据（例如数字、名称和图片），而搜索则用于在给定的列表中查找项目。\n\
  \n## 9.2 搜索\n\n有许多种搜索方法，但我们将关注最常见的方法。在搜索中，目标是从给定的列表项集中搜索一个项目。列表可以是数字、值或字符串。搜索对于从大型数据库中检索信息非常有用。数据库可能包含海量数据，从这样的数据库中检索需要的数据可能需要时间。为了解决这些问题，我们使用最常用的搜索算法，如线性搜索和二分搜索。\n\
  \n## 9.3 线性搜索\n\n线性搜索是最简单易懂的搜索方法。它也被称为顺序搜索。它有一个前提条件（即搜索前的条件），即不应该有相同数据的重复项。为了理解这一点，让我们考虑以下数字列表：`23,45,67,89,45,99`。\n\
  \n在上面的列表中七个数字，但数字 `45` 重复了。因此，线性搜索方法不适用于此列表，因为有多个相同的条目。让我们考虑以下数字列表：`1,34,67,18,78`。\n\
  \n这里共有五个数字。假设我们想在列表中搜索数字 `18`。我们如何手动搜索？正如我们所知，我们从第一个元素 `1` 开始并与搜索值 `18` 进行比较。如果它们相同，我们就停止搜索，否则我们将比较列表中的下一个元素；我们将继续此操作直到到达列表末尾。这就是线性搜索的工作方式。在这里，我们从头到尾搜索，直到找到搜索值的匹配项。程序\
  \ 9.1 在假设列表中存在重复项的情况下说明了线性搜索的操作。\n\n在这里，`list[]` 是一个整数数组\n`searchValue` 是列表中要搜索的数据项\n\
  `location` 返回数据的位置\n\n```cpp\n//Program 9.1 // Linear Search program\n#include<iostream>\n\
  using namespace std;\n#define Array_Length 6\nint main() {\n    int list[6] = {1,34,67,18,11,78};\n\
  \    int searchValue = 18;\n    int i=0,location = -1;\n    bool found = false;\n\
  \    for (i = 0; i < Array_Length && !found ; i )\n    {\n        if (list[i] ==\
  \ searchValue)\n        {\n            found = true;\n            location = i;\n\
  \        }\n    }\n    if (found)\n        cout << \"The number is Found at Location\
  \ \" << location + 1 << endl;\n    else\n        cout << \"The number is Not Found\"\
  \ << endl;\n    return 0;\n}\n```\n\n程序 9.1 的结果如下：\n\n`The number is Found at Location\
  \ 4`\n\n理解程序 9.1 执行流程的列表如下。`list[6]` 是包含 6 个元素的数组名称：1、34、67、18、11 和 78。`Array_Length`\
  \ 是数组 `list[6]` 中的元素总数。表 9.1 显示了程序 9.1 的执行顺序。注意 `searchValue` 的实际位置是 `location+1`，因为数组从\
  \ 0 开始。\n\n表 9.1：线性搜索程序的执行步骤。\n\n![](img/tab6.png)\n\n## 9.4 二分搜索\n\n在第 9.3 节中，我们学习了线性搜索。在本节中，我们将学习一种改进的线性搜索方法，称为二分搜索。它也用于从列表中搜索项目。二分搜索比线性搜索快，但前提是列表必须是有序的。这意味着列表成员必须按照升序（从小数据项到大）或降序（从大数据项到小）排列。\n\
  \n在二分搜索方法中，我们首先将要搜索的项目与列表中间位置的项目进行比较。在这种情况下，结果可能是以下类型：\n\n1. 要搜索的项目与数组中间位置的项相同。这意味着找到了该项目，位置是中间位置加\
  \ 1。\n2. 要搜索的项目小于数组中间位置的项。这意味着该项目必须在数组的前半部分。\n3. 要搜索的项目大于数组中间位置的项。这意味着该项目必须在数组的后半部分。\n\
  \n\n\n\n\n`1,11,18,34,67,78,118,121`\n\n这可以声明为数组 `list[8]`。\n\n```cpp\nint list[8]={1,11,18,34,67,78,118,121};\n\
  ```\n\n要查找的项是 118。\n\n`i.e., int searchValue=118;`\n\n图 9.1 演示了在上述列表中查找项 118。\n\n\
  ![](img/12_Chapter09_fig_01.png)\n\n**图 9.1：说明二分查找程序的步骤。**\n\n在这里，\n- `list[8]`\
  \ 是一个整数型数组\n- `searchValue` 是列表中要查找的数据项\n- `location` 返回数据项的位置\n\n```cpp\n// 程序\
  \ 9.2 // 二分查找程序 \n#include<iostream> \nusing namespace std; \n#define Array_Length\
  \ 8 \nint main() { \n    int list[8]={1,11,18,34,67,78,118,121}; \n    int searchValue\
  \ = 118; \n    int low = 0, high = Array_Length-1,mid = (low + high)/2; \n    while(low\
  \ <= high && list[mid] != searchValue) \n    { \n        if(list[mid] < searchValue)\
  \ \n        { \n            low = mid + 1; \n        } \n        else \n       \
  \ { \n            high = mid–1; \n        } \n        mid = (low + high)/2; \n \
  \   } \n    if(low > high) \n        cout << \"The number is Not Found\" << endl;\
  \ \n    else \n        cout<< \"The number is Found at Location \" << mid + 1 <<\
  \ endl; \n    return 0; \n}\n```\n\n程序 9.2 的结果如下：\n\n`The number is Found in location\
  \ 7`\n\n结果的分析如下。`list[8]` 是一个包含值 1, 11, 18, 34, 67, 78, 118 和 121 的数组。它们都是按升序排列的。`Array_Length`\
  \ 等 8。执行步骤和变量的值总结在 表 9.2 中。\n\n**表 9.2：理解二分查找程序的执行步骤。**\n\n![](img/tab7.png)\n\n\
  ## 9.5 排序\n\n在之前的章节中，我们学习了各种搜索方法。正如我们在二分查找法看到的，在列表中查找项的先决条件是列表必须是有序的，即升序或降序。在本节中，我们将学习常用的排序技术，如插入排序、选择排序和冒泡排序。排序是将数字按顺序的方式排列。它可以是升序、降序，或者升序和降序混合。例如，如果我们想知道\
  \ 20 个学生班级中谁最高，那么我们就把所有 20 名学生的高度输入到一个数字数组中，并按升序排序，以找到班级最高的学生。\n\n让我们来看以下无序的学生身高列表（厘米）：\n\
  \n`156,190,163,145,178,167,155,176,154,191,169,175,187,173,165`\n\n如果按升序排序上述列表，它看起来如下：\n\
  \n`145 154 155 156 163 165 167 169 173 175 176 178 187 190 191`\n\n如果按降序排序上述列表，它看起来如下：\n\
  \n`191 190 187 178 176 175 173 169 167 165 163 156 155 154 145`\n\n在接下来的章节中，我们将学习各种常用的方法\n\
  \n## 9.6 插入排序\n\n本节描述插入排序，其中选取列表中的第一个项或数字，并与之前的项进行比较，然后插入到它的位置。在项放置于其位置后，算法尝试放置下一个项。在过程结束时，我们将看到所有项都已排序。这类似于整理扑牌。我们先取一张牌并将其插入到正确的位置。然后我们尝试插入列表中的下一个项。插入排序原理相同。以下代码说明了用于按升序排序的插入排序：\n\
  \n```cpp\nfor(i = 1; i < Array_Length; i++) { \n    temp = list[i]; \n    j = i;\
  \ \n    while (list[j-1] > temp ) { \n        list[j] = list[j-1]; \n        j =\
  \ j–1; \n        if(j <= 0)break; \n    } \n    list[j] = temp; \n}\n```\n\n程序 9.3\
  \ 说明了插入排序。该程序将整数按升序排列。图 9.2 演示了理解插入排序的执行步骤。\n\n```cpp\n// 程序 9.3 // 插入排序\n#include<iostream>\
  \ \nusing namespace std; \n#define Array_Length 7 \nint main() { \n    int list[7]={62,45,38,11,27,77,59};\
  \ \n    int i, j, temp; \n    for(i = 1; i < Array_Length; i++) { \n        temp\
  \ = list[i]; \n        j = i; \n        while (list[j-1] > temp ) { \n         \
  \   list[j] = list[j-1]; \n            j = j–1; \n            if(j <= 0)break; \n\
  \        } \n        list[j] = temp; \n    } \n    cout << \"The list of items in\
  \ ascending order\" << endl; \n    for(i = 0; i < Array_Length; i++) { \n      \
  \  cout << list[i] << \" \"; \n    } \n    return 0; \n}\n```\n\n程序 9.3 的结果如下：\n\
  \n`The list of items in ascending order 11 27 38 45 59 62 77`\n\n在这里，`list[]` 是一个包含\
  \ 62, 45, 38, 11, 27, 77 和 59 的整数数组。`Array_Length` 是数组长度，等于 7。结果的分析见 表 9.3 和 图 9.2。\n\
  \n## 9.7 选择排序\n\n在选择排序中，目标是找到列表中的最小元素并移动到第一个位置。然后，我们在剩余列表中找到最小元素并将其移动到第二个位置。这个过程一直持续，直到整个列表排序。以下代码说明了用于升序排序的选择排序：\n\
  \n```cpp\n// 程序 9.4 // 选择排序\n#include<iostream> \nusing namespace std; \n#define\
  \ Array_Length 7 \nint main() { \n    int list[7]={62,45,38,11,27,77,59}; \n   \
  \ int i, j, min, temp; \n    for(i = 0; i < Array_Length-1; i++) { \n        min\
  \ = i; \n        for(j = i + 1; j < Array_Length; j++) { \n            if(list[j]\
  \ < list[min]) { \n                min = j; \n            } \n        } \n     \
  \   temp = list[i]; \n        list[i] = list[min]; \n        list[min] = temp; \n\
  \    } \n    cout << \"The list of items in ascending order\" << endl; \n    for(i\
  \ = 0; i < Array_Length; i++) { \n        cout << list[i] << \" \"; \n    } \n \
  \   return 0; \n}\n```\n\n程序 9.4 的结果如下：\n\n`The list of items in ascending order\
  \ 11 27 38 45 59 62 77`\n\n\n\n\n\n在这里，`list[]` 是一个整数数组 `62, 45, 38, 11, 27, 77`\
  \ 和 `59`。`Array_Length` 是数组的长度，等于 `7`。结果的分析如所示表 9.4 和图 9.3。表 9.4 显示了变量在不同迭代中的值，而图\
  \ 9.3 显示了数组在不同迭代中的值。可以看出，`list[]` 数组的所有元素都已按升序排列。\n\n表 9.4：用于理解选择排序的执行步骤。\n![](img/tab9.png)\n\
  \n图 9.3：用于说明选择排序的执行步骤。\n\n## 9.8 冒泡排序\n\n冒泡排序是一种常用的算法，且易于理解。这种方法可以通过以下方式来解释：\n\n\
  1. 起时比较数组中的第一个和第二个元素；如果它们是有序的（可能是升序），则继续比较数组中的第二个和第三个元素，直到最后一个元素。如果它们的顺序错误，则交换这两个相邻元素并按要求的顺序排列。此过程一直持续到数组末尾。\n\
  2. 在第一次迭代后，最大的元素会像泡一样（交换）到数组的末尾并按升序排列。如果是降序，最小的元素将交换到数组的第一个索引。\n3. 重复上述方法直到数组末尾，使最后一个元素保持不变，因为它已经按升序排序好了。在降序排序的情况下，重复第\
  \ 1 和第 2 步，使数组中的第一个元素保持不变，因为它已经有序了。\n4. 排序过程结束，所有元素都已按所需的顺序排列。\n\n遗憾的是，这种方法比其他方法需要更多的迭代，因此执行速度较。以下代码演示了用于升序排序的冒泡排序算法。\n\
  \n```cpp\nfor (i = 0; i < Array_Length-1; i++) {\n    for (j = 0; j < Array_Length-1-i;\
  \ j++) {\n        // 比较相邻元素所需的顺序\n        if (list[j+1] < list[j]) {\n         \
  \   // 如果它们无序，则交换元素\n            temp = list[j];\n            list[j] = list[j+1];\n\
  \            list[j+1] = temp;\n        }\n    }\n}\n```\n\n程序 9.5 显示了冒泡排序算法的实现。\n\
  \n```cpp\n// 程序 9.5 冒泡排序程序\n#include<iostream>\nusing namespace std;\n#define Array_Length\
  \ 7\nint main() {\n    int list[7] = {62, 45, 38, 11, 27, 77, 59};\n    int i,j,temp;\n\
  \    for (i = 0; i < Array_Length-1; i++) {\n        for (j = 0; j < Array_Length-1-i;\
  \ j++) {\n            if (list[j+1] < list[j]) {\n                temp = list[j];\n\
  \                list[j] = list[j+1];\n                list[j+1] = temp;\n     \
  \       }\n        }\n    }\n    cout << \"The list of items in ascending order\"\
  \ << endl;\n    for(i = 0; i < Array_Length; i++) {\n        cout << list[i] <<\
  \ \" \";\n    }\n    return 0;\n}\n```\n\n程序 9.5 的结果如下：\nThe list of items in ascending\
  \ order 11 27 38 45 62 77\n\n在这里，`list[]` 是一个整数数组 `62, 45, 38, 11, 27, 77` 和 `59`。`Array_Length`\
  \ 是数组的长度，等于 `7`。结果的分析如所示表 9.5 和图 9.4。表 9.4 显示了变量在不同迭代中的值，而图 9.4 显示了数组在不同迭代中的值。可以看出，`list[]`\
  \ 数组的所有元素都已按升序排列。\n\n表 9.5：用于理解冒泡排序的执行步骤。\n![](img/tab10.png)\n\n图 9.4：用于说明冒泡排序的执行步骤。\n\
  \n## 9.9 字符和字符串排序\n\n在之前的章节中，我们学习了各种排序和搜索方法，示例程序处理数字。在本节中，我们将专注于字符串和字符。字符串排序适用于许多应用程序，例如对班或大学的学生姓名排序。如果大学有\
  \ 1000 名学生，手动排序所有名字可能需要几小时到几天，但一个 C++ 程序执行此类任务只需要几毫秒或微秒。在本节中，我们将专注于字符串和字符。\n\n###\
  \ 字符排序\n\n在之前的章节中，我们学习了各种排序和搜索方法，示例程序处理数字。在本节中，我们将专注于字符串和字符。字符串排序适用于许多应用程序，例如对班或大学的学生姓名排序。如果大学有\
  \ 1000 名学生，手动排序所有名字可能需要几小时到几天，但一个 C++ 程序执行此类任务只需要几毫秒或微秒。在本节中，我们将专注于字符串和字符。\n\n###\
  \ 字符排序\n\n在之前的章节中，我们学习了各种排序和搜索方法，示例程序处理数字。\n\n正如我们知道，`>=`、`<=` 和 `==` 等运算符可以应用于字符。另一种方式，这些运算符不能应用于字符串，因为字符串是字符数组。在继续深入学习字符串排序之前，让我们先通过以下示例理解比较两个字符串：\n\
  \n```cpp\nchar a[] = \"CHINA\";\nchar b[] = \"china\";\nif(strcmp(a, b) < 0) {\n\
  \    cout<<\"String \" << a<<\" is smaller than String \" << b<<endl;\n} else {\n\
  \    cout<<\"String \" << b<<\" is smaller than String \" << a<<endl;\n}\n```\n\n\
  理解 `strcmp()` 方法的示例在程序 9.7 中所示。\n\n```cpp\n// 程序 9.7 比较两个字符串的程序\n#include <iostream>\n\
  #include <cstring>\nusing namespace std;\nint main() {\n    char a[] = \"CHINA\"\
  ;\n    char b[] = \"china\";\n    if(strcmp(a, b) < 0) {\n        cout<<\"String\
  \ \" << a<<\" is smaller than String \" << b<<endl;\n    } else {\n        cout<<\"\
  String \" << b<<\" is smaller than String \" << a<<endl;\n    }\n    return 0;\n\
  }\n```\n\n### 字符串\n\n字符串对大小写敏感，所以字符串 china 大于字符串 CHINA。`strcmp()` 方法在两个字符串相等时返回\
  \ 0。如果字符串 a 小于字符串 b，它返回一个小于 0 的值；如果字符串 a 大于字符串 b，则返回一个大于 0 的值。程序 9.8 演示了 `strcmp()`\
  \ 方法的使用。\n\n\n\n\n\n```cpp\n// 程序 9.8 // 理解 strcmp() 方法程序\n#include <iostream>\n\
  #include <cstring>\nusing namespace std;\nint main() {\n    char a[] = \"hello\"\
  ;\n    char b[] = \"Hello\";\n    int code;\n    if(strcmp(a, b) < 0) // 如果字符串 a\
  \ 小于字符串 b\n        code = 1;\n    else if(strcmp(a, b) == 0) // 如果字符串 a 等于字符串 b\n\
  \        code = 2;\n    else code = 3; // 如果字符串 a 大于字符串 b\n    switch(code)\n  \
  \  {\n        case 1: cout << \"String a is less than string b\" << endl;\n    \
  \            break;\n        case 2: cout << \"String a is equal to string b\" <<\
  \ endl;\n                break;\n        case 3: cout << \"String a is greater than\
  \ string b\" << endl;\n                break;\n        default: cout << \"invalid\
  \ string comparison\" << endl;\n    }\n    return 0;\n}\n```\n\n程序 9.8 的结果如下：\n\n\
  `String a is greater than String b`\n\n让我们来看下面的示例以理解字符串排序。在这个例子中，列出了班级学生的名字以进行排序。\n\
  \n`Mary, Jack, Zhang, Rai, Ann, Lee, Liu, Bai, Devi, Shiela`\n\n现在对上述十个名字进行排序，我们将使用字符串数组，即：\n\
