  ## 11.9 结构体与指针\n\n正如我们在第 8 章 中讨论过的，指针是一个保存另一个变量地址的变量。我们可以像定义其他任何变量指针一样定义结构体的指针。我们可以声明一个结构体指针，并将结构体的起始地址赋值给它。以下代码解释了这一概念。\n\
  \n```cpp\nstruct item {\n    char item_name[10];\n    float price;\n    char manufacturer[40];\n\
  \    int item_no;\n};\n```\n\n然后，指针可以如下定义指向一个变量：\n\n```cpp\nstruct item *ptrBiscuit;\n\
  ```\n\n\n\n\n我们可以将结构体变量的地址存储在之前定义的指针变量中，如下：\n\n```\nptrBiscuit=&Biscuit;\n```\n\n\
  在 `*ptrBiscuit` 之前使用字符 `*` 是为了指定 `ptrBiscuit` 是一个指针，而在 `Biscuit` 之前使用字符 `&` 是为了将它的地址传递给\
  \ `ptrBiscuit` 而不是它的值。\n\n另一个必须学习的重要概念是与指向结构体的指针变量结合使用的 `->` 运算符。该运算符用于通过指向结构体的指针访问结构体的成员。如下所示：\n\
  \n```\nptrBiscuit->item_name\n```\n\n程序 11.6 展示了如何将指针与结构体结合使用。在这个示例程序中，我们分别使用成员运算符（`.`）和\
  \ `->` 运算符显示了结果。在使用句点运算符访问成员时，我们使用的是结构体变量；然而，在使用 `->` 运算符时，我们使用的是指针变量。程序 11.6 通过这两种方式显示了成员值。\n\
  \n```cpp\n// Program 11.6 // Structures and pointers \n#include <iostream> \nusing\
  \ namespace std; \nint main() { \n    struct item { \n        char item_name[10];\
  \ \n        float price; \n        char manufacturer[40]; \n        int item_no;\
  \ \n    }; \n    //Declaration and initilization of the strucure \n    struct item\
  \ Biscuit = {\"SweetBest\",7.5,\"Qingdao Biscuits Ltd\",9341}; \n    //Pointer to\
  \ structure \n    struct item *ptrBiscuit; \n    ptrBiscuit = &Biscuit; \n    //Displaying\
  \ Biscuit information \n    cout << endl << \"Biscuit Information \" << endl; \n\
  \    cout << \"Biscuit Name: \" << Biscuit.item_name << endl; \n    cout << \"Biscuit\
  \ Price: \" << Biscuit.price << endl; \n    cout << \"Biscuit Manufacturer: \" <<\
  \ Biscuit.manufacturer<< endl; \n    cout << \"Biscuit Item Number: \" << Biscuit.item_no\
  \ << endl; \n    //Displaying Biscuit information using pointer \n    cout << endl\
  \ << \"Biscuit Information (using pointer) \" << endl; \n    cout << \"Biscuit Name:\
  \ \" << ptrBiscuit->item_name << endl; \n    cout << \"Biscuit Price: \"<< << ptrBiscuit->price\
  \ << endl; \n    cout << \"Biscuit Manufacturer: \" << ptrBiscuit->manufacturer\
  \ << endl; \n    cout << \"Biscuit Item Number: \" << ptrBiscuit->item_no << endl;\
  \ \n    return 0; \n}\n```\n\n程序 11.6 的结果如下：\n\n`Biscuit Information Biscuit Name:\
  \ SweetBest Biscuit Price: 7.5 Biscuit Manufacturer: Qingdao Biscuits Ltd Biscuit\
  \ Item Number: 9341 Biscuit Information (using pointer) Biscuit Name: SweetBest\
  \ Biscuit Price: 7.5 Biscuit Manufacturer: Qingdao Biscuits Ltd Biscuit Item Number:\
  \ 9341`\n\n## 11.10 结构体与函数\n\n结构体可以与其他数据类型一样配合函数使用。通常，函数使用结构体作为参数，结构体可以作为整个结构或结构体的地址传递给函数。我们可以以传递任何其他变量或指针的方式将结构体作为函数参数传递。我们可以像在本章之前的示例中那样的访问结构体变量。在程序\
  \ 11.7 中，结构体被作为参数传递。\n\n```cpp\n// Program 11.7 // Functions using structures \n\
  #include <iostream> \nusing namespace std; \nstruct item { \n    char item_name[10];\
  \ \n    float price; \n    char manufacturer[40]; \n    int item_no; \n}; \n//The\
  \ function accept structure as parameter \nvoid printItem( struct item Temp) { \n\
  \    cout << \"Biscuit Name: \" << Temp.item_name << endl; \n    cout << \"Biscuit\
  \ Price: \" << Temp.price << endl; \n    cout << \"Biscuit Manufacturer: \" << Temp.manufacturer\
  \ << endl; \n    cout << \"Biscuit Item Number: \" << Temp.item_no << endl; \n}\
  \ \nint main() { \n    //Declaration and initilization of the structure \n    struct\
  \ item Biscuit = {\"SweetBest\",7.5,\"Qingdao Biscuits Ltd\",9341}; \n    //Passing\
  \ a structure as an argument \n    printItem(Biscuit); \n    return 0; \n}\n```\n\
  \n程序 11.7 的结果如下：\n\n`Biscuit Name: SweetBest Biscuit Price: 7.5 Biscuit Manufacturer:\
  \ Qingdao Biscuits Ltd Biscuit Item Number: 9341`\n\n如程序 11.7 所示，结构体 `Biscuit` 被参数传递给函数\
  \ `printItem()`。在函数 `printItem()` 中，`temp` 是一个形式参数（注意：原文说是 `temp` 但代码中使用了 `Temp`）。\n\
  \n等待，原文中程序 11.8 的代码块很乱。让我们根据提供文本中的混乱字符串重新格式化该特定部分，假设它本是一个独立的程序 11.8：\n\n```cpp\n\
  // Program 11.8 // Functions using structures \n#include <iostream> \nusing namespace\
  \ std; \nstruct item { \n    char item_name[10]; \n    float price; \n    char manufacturer[40];\
  \ \n    int item_no; \n}; \n//The function accept structure as parameter \nvoid\
  \ printItem( struct item *Temp) { \n    //Printing Biscuit information\n    cout\
  \ << \"Biscuit Name: \" << Temp->item_name << endl; \n    cout << \"Biscuit Price:\
  \ \" << Temp->price << endl; \n    cout << \"Biscuit Manufacturer: \" << Temp->manufacturer\
  \ << endl; \n    cout << \"Biscuit Item Number: \" << Temp->item_no << endl; \n\
  } \nint main() { \n    //Declaration and initilization of the structure \n    struct\
  \ item Biscuit = {\"SweetBest\",7.5,\"Qingdao Biscuits Ltd\",9341}; \n    //Passing\
  \ a structure as an argument \n    printItem(&Biscuit); \n    return 0; \n}\n```\n\
  （自纠：用户提供的程序 11.8 字符串非常混乱，我从该字符串中提取了逻辑以提供整洁的代码块）。\n\n## 11.11 联合体\n\n联合体与结构体非常相似，不同之处在于联合体使用同一个内存位置来存储多个变量。联合体是具有不同大小成员的用户定义变量。让我们考虑一些联合体优于结构体的情况：\n\
  \n1. 一个具有两个不同类型（例如 `var1` 和 `var2`）的程序可以在一段时间内使用 `var1`，当其用途结束后，可以将 `var1` 的内存位置分配给\
  \ `var2`。\n2. 有时，无法确定传递给函数什么类型的数据。在这种情况下，我们可以传递一个包含所有可能类型的联合体。\n\n因此，联合体是一种用户定义类型，其所有成员共享同一个内存位置，并且在任何给定时间联合体只能包含成员列表中的一个对象。这意味着无论联合体有多少个成员，它使用的内存始终足够存储最大的成员。然而，这需要额外的小心以确保我们始终访问最后写入的成员。声明联合体的语法与结构体相似；唯一的区别是使用关键字\
  \ `union` 代替 `struct`。联合体标签是联合体成员定义的统称。联合体定义的通用格式如下：\n\n```cpp\nunion [联合体标签] {\
  \ \n    成员定义; \n    成员定义; ... \n    成员定义; \n} [一个或多个联合体变量];\n```\n\n以下示例定义了一个名为\
  \ `tempNum` 的联合体和一个名为 `intDouble` 的变量。在这里，`tempNum` 是变量名，它的作用与结构体的标签相同。访问联合体的方式与访问结构体的方式相同。\n\
  \n```cpp\nunion tempNum { \n    int number; \n    double floatnumber; \n} intDouble;\n\
  ```\n\n\n\n当联合体为单成员变量分配内存时，分配总是根据需要最大内存的变量进行的。在上一个示例中，由于 `floatnumber` 需要的内存比 `number`\
  \ 多，因此内存分配是针对存储 `double` 所需的空间，而不是 `int`。程序 11.9 总结了联合体和结构体的区别，并演示了联合体在 C++ 中的用法。\n\
  \n```cpp\n// Program 11.9 // Understanding 联合体和结构\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    union tempNum1\n    {\n        int number1;\n        double\
  \ floatnumber1;\n    };\n    struct tempNum2\n    {\n        int number2;\n    \
  \    double floatnumber2;\n    };\n    union tempNum1 TN1 = {3.00};\n    struct\
  \ tempNum2 TN2 = {24,3.14};\n    cout << \"Size of union TN1 = \" << sizeof(TN1)\
  \ << endl;\n    cout << \"Size of structure TN2 = \" << sizeof(TN2) << endl;\n \
  \   cout << \"Union member number1 = \" << TN1.number1 << endl;\n    cout << \"\
  Union member floatnumber1 = \" << TN1.floatnumber1 << endl;\n    cout << \"Structure\
  \ member number1 = \" << TN2.number2 << endl;\n    cout << \"Structure member floatnumber1\
  \ = \" << TN2.floatnumber2 << endl;\n    return 0;\n}\n```\n\n程序 11.9 的结果如下：\n\n\
  `Size of union TN1 = 8 Size of structure TN2 = 16 Union member number1 = 3 Union\
  \ member floatnumber1 = 1.4822e-323 Structure member number1 = 24 Structure member\
  \ floatnumber1 = 3.14`\n\n在程序 11.9 中，有一个结构体和一个联合体，它们的数据成员数量和类型相同。最初，程序使用 `sizeof()`\
  \ 运算符来查找为联合体和结构体分配的内存地址长度。如结果所示，联合体只分配了 8 字节，而结构体分配了 16 字节。由于联合体一次只能存储一个值，因此不可能同时初始化它的两个成员。因此，只初始化了一个联合成员。另一方面，我们可以同时初始化结构体的所有成员。联合体用一个浮点数初始化；由于我们先显示整数成员值，所以浮点数的对应整数值被成功显示。然而，如果我们尝试打印在与\
  \ `double` 相同内存位置存储的值，就会显示出一个奇怪的值。联合体也可以作为结构体的成员使用。程序 11.10 演示了将双成员联合体作为结构体成员的示例。\n\
  \n```cpp\n// Program 11.10 // 作为结构成员的联合体\n#include <iostream>\n#include <cstring>\n\
  using namespace std;\nint main() {\n    union id\n    {\n        char name[40];\n\
  \        int number;\n    };\n    struct {\n        float salary;\n        union\
  \ id description;\n    } employee;\n    strcpy (employee.description.name,\"Jessica\"\
  );\n    cout<< \"Employee Name :\" << employee.description.name << endl;\n    employee.description.number\
  \ = 1729;\n    cout<< \"Employee Number :\" << employee.description.number << endl;\n\
  \    employee.salary = 18700.25;\n    cout<< \"Employee Salary :\" << employee.salary\
  \ << endl;\n    return 0;\n}\n```\n\n程序 11.10 的结果如下：\n\n`Employee Name :Jessica\
  \ Employee Number :1729 Employee Salary :18700.3`\n\n在上一个示例中，值得注意的是联合体分配了 40 字节的内存，因为最大的成员是一个字符数组。一个字符占用\
  \ 1 字节，但对于 40 个字符来说就是 40 字节。联合体的第二个成员是一个大小小于 40 字节的整数，它并没有增加尺寸。程序仔细地通过在不同时间赋值值并在屏幕上显示它们来使用了这两种成员。\n\
  \n## 11.12 复习题\n\n1. 什么是结构体？结构体与数组有什么区别？请举例说明。\n2. 写一个程序来解释 C++ 中的结构体。\n3. 定义并初始化一个结构体？请举例说明。\n\
  4. 点符号（dot notation）的含义是什么？请解释两种初始化成员的方法并给出示例。\n5. `typedef` 关键字的用途是什么？请结合结构体解释。\n\
  6. 写一个可执行的 C++ 程序来演示嵌套结构体。\n7. 写一个 C++ 程序来演示包含数组的结构体。\n8. 什么是联合体？联合体与结构体有什么区别？请解释。\n\
  9. 写一个程序来演示 C++ 中的联合体。\n\n# 异常处理\n\n异常处理是 C++ 语言中最有特性之一。程序在执行时可能会遇到问题，例如运行时错误。这些问题可能在程序员编码期间不知情的情况下发生，并停止正常的执行流。程序可以在无任何错误的情况下编译，但执行可能会在某些代码段停止而不再继续执行。这些问题被称为异常。异常是程序运行时发生的问题或错误。这些问题不受程序的控制。在这种情况下，异常提供了称为异常处理程序（exception\
  \ handlers）的特殊函数作为响应此类情况的方法。C++ 提供了强大的机制来处理这些异常。本章重点关注异常处理方法。为了理解异常的重要性，让我们考虑程序\
  \ 12.1。\n\n```cpp\n// Program 12.1 // 无异常机制程序\n#include<iostream>\nusing namespace\
  \ std;\nint main() {\n    int a = 1,b = 0;\n    cout << a/b << endl;\n    return\
  \ 0;\n}\n```\n\n即使我们在编译程序时没有任何错误，在执行程序时结果也是不可预测的。事实上，之前的程序会强制你停止。这是因为 `a` 非零而 `b`\
  \ 为零。理论上 `a/b` 等于无穷大，然而它无法以固定值表示。我们将通过程序 12.2 考虑另一个简单的示例，用户可以选择 `a` 和 `b` 的不同值。\n\
  \n```cpp\n// Program 12.2 // 无异常机制程序\n#include<iostream>\nusing namespace std;\n\
  int main() {\n    int a, b;\n    cout << \"Enter two integers for division\" <<\
  \ endl;\n    cin >> a >> b;\n    cout << a << \" divided by \" << b << \" = \" <<\
  \ a/b << endl;\n    return 0;\n}\n```\n\n程序 12.2 中，如果我们输入非零整数，程序将无问题地提供输出。例如，考虑这些结果。\n\
  \n情况 1：\n`Enter two integers for division 4 2 4 divided by 2 = 2`\n\n情况 2：\n`Enter\
  \ two integers for division 4 8 4 divided by 8 = 0`\n\n在两种情况下，结果都符合整数除法的预期。情况 2\
  \ 的结果为 0，是因为 4 和 8 都是整数，在整数除法中结果被截断为 0 而不是 0.5。然而在同一个程序中，如果我们输入的 `a` 非零而 `b` 为零，结果将如程序\
  \ 12.1 所示。在这种情况下，我们使用 C++ 中的异常语句来避免 `b` 值意外变为零。程序 12.3 显示了使用异常机制处理之前提到的情况的方法。程序\
  \ 12.2 在这里被修改，以便用异常处理机制处理“除零”问题。\n\n```cpp\n// Program 12.3 // 异常机制的程序\n#include<iostream>\n\
  using namespace std;\nint main() {\n    int a, b;\n    cout << \"Enter two integers\
  \ for division\" << endl;\n    cin >> a >> b;\n    try\n    {\n        if(b == 0)\n\
  \            throw \"There is an exception\";\n        else\n            cout <<\
  \ a << \" divided by \" << b << \" = \" << a/b << endl;\n    }\n    catch (const\
  \ char* msg)\n    {\n        cout << msg << endl;\n    }\n    return 0;\n}\n```\n\
  \n程序 12.3 的示例结果如下：\n\n情况 1：\n`Enter two integers for division 18 2 18 divided by\
  \ 2 = 9`\n\n\n\n\n\n`输入两个整数进行除法 0 1 除以 1 = 0`\n\n情况 3：\n`输入两个整数进行除法 0 0 发生异常`\n\n\
  情况 4：\n`输入两个整数进行除法 2 0 发生异常`\n\n因此，从上一个示例可以看出，正常的执行流可能会停止，也可能会产生异常。如程序 12.3 所示，`try`、`catch`\
  \ 和 `throw` 等关键字被用于处理“除零”异常。在下一节中，我们将学习如何使用 C++ 中的异常处理机制来处理异常。\n\n## 12.2 处理异常\n\
  \n异常处理机制的目标是提供检测和报告“异常情况”的方法，以便在适当的时间采取适当措施。通常，异常处理机制处理这些任务：(a) 寻找可能异常的问题，(b) 通知已发生或抛出异常，(c)\
  \ 接收错误信息或捕获异常，最后 (d) 采取修正措施或处理异常。当块内部出现异常情况时，会抛出一个异常并将控制权转移到异常处理程序。如果没有抛出异常，代码将正常继续并忽略所有的处理程序。异常是通过在\
  \ `try` 块内部使用 `throw` 关键字抛出的。异常处理程序用关键字 `catch` 声明，必须紧跟在 `try` 块之后。因此，在 C++ 中，异常处理机制通过使用三个关键字即\
  \ `try`、`catch` 和 `throw` 来实现。下面是对这三个关键字的简要描述。\n\n*   `try`：`try` 块包含了可能产生异常的程序或代码部分，后面跟着\
  \ `catch` 块。该块由大括号（`{}`）括起来。当块内产生异常时，异常会被抛出，控制权转移到异常处理程序。如果没有抛出异常，程序代码正常执行并忽略所有处理程序。\n\
  *   `catch`：`catch` 关键字的目的是捕获异常，其中 `catch` 参数的数据类型与异常类型匹配。`catch` 块必须紧跟在 `try` 块之后。当捕获到异常时，将执行\
  \ `catch` 块中的代码。`catch` 块捕获由 `try` 块中的 `throw` 语句“抛出”的异常。\n*   `throw`：如前所述，程序在异常情况下会抛出异常。异常是通过\
  \ `throw` 关键字抛出的，并且可以在代码的任何地方抛出。异常的类型也由 `throw` 语句决定。C++ 中处理异常的一般格式如下：\n\n```cpp\n\
  try {\n    // 可能抛出异常的语句\n} catch (type argument) {\n    // 处理异常 Type 的语句\n}\n```\n\
  \n程序 12.4 展示了一个使用 `try-catch` 块的简单示例，其中抛出了一个整数并由 `catch` 块处理。\n\n```cpp\n// 程序 12.4\
  \ // Try-catch 示例\n#include<iostream>\nusing namespace std;\nint main() {\n    int\
  \ a = 100;\n    try\n    {\n        throw a;\n    }\n    catch (int temp)\n    {\n\
  \        cout << \"Exception Example :caught integer number \"\n               <<\
  \ temp << endl;\n    }\n    return 0;\n}\n```\n\n程序 12.4 的示例结果如下：\n\n`Exception\
  \ Example: caught integer number 100`\n\n## 12.3 多 catch 语句\n\n在程序 12.4 中，`throw`\
  \ 语句使用一个整数（在这种情况下等于 100），该整数用 `catch` 关键字声明并作为参数传递给异常处理程序。从示例可以看出，抛出的参数类型（此处是 `int`）应该与\
  \ `catch` 块中的数据类型匹配。在异常处理期间我们也可以有多个 catch 语句。这在程序段具有多个抛出异常的条件时非常重要。一般格式如下：\n\n```cpp\n\
  try {\n    // 可能抛出异常的语句\n} catch (type1 argument) {\n    // 处理异常 Type 1 的语句\n} catch\
  \ (type2 argument) {\n    // 处理异常 Type 2 的语句\n} …. catch (typeN argument) {\n  \
  \  // 处理异常 Type N 的语句\n}\n```\n\n程序 12.5 展示了一个带有两个 `throw` 语句的多个 catch 语句的示例。\n\n\
  ```cpp\n// 程序 12.5 // 多 catch 语句\n#include<iostream>\nusing namespace std;\nint\
  \ main() {\n    int a =100;\n    float b = 3.14f;\n    try\n    {\n        throw\
  \ a;\n        throw b;\n    }\n    catch (int temp1)\n    {\n        cout << \"\
  Exception Example :caught integer number \"\n             << temp1 << endl;\n  \
  \  }\n    catch (float temp2)\n    {\n        cout << \"Exception Example :caught\
  \ floating point number \"\n             << temp2 << endl;\n    }\n    return 0;\n\
  }\n```\n\n程序 12.5 的结果如下：\n\n`Exception Example: caught integer number 100`\n\n在程序\
  \ 12.5 中，执行了第一个 `throw`，第二个 `throw` 语句保持不可达。然而，程序 12.6 显示了程序 12.5 的修改版本，其中多个 catch\
  \ 语句是有效的。\n\n```cpp\n// 程序 12.6 // 多 catch 语句\n#include<iostream>\nusing namespace\
  \ std;\nint main() {\n    int a;\n    float b;\n    cout << \"Enter the values of\
  \ a and b\" << endl;\n    cin >> a >> b;\n    try\n    {\n        if (a == 100)\
  \ throw a;\n        else if(b == 3.14f) throw b;\n        cout << \"No exception\
  \ is thrown!\" << endl;\n    }\n    catch (int temp1)\n    {\n        cout << \"\
  Exception Example :caught integer number \"\n             << temp1 << endl;\n  \
  \  }\n    catch (float temp2)\n    {\n        cout << \"Exception Example :caught\
  \ floating point number \"\n             << temp2 << endl;\n    }\n    return 0;\n\
  }\n```\n\n程序 12.6 的示例结果如下：\n\n情况 1：\n`Enter the values of a and b 1 2 No exception\
  \ is thrown!`\n\n情况 2：\n`Enter the values of a and b 100 200 Exception Example :caught\
  \ integer number 100`\n\n情况 3：\n`Enter the values of a and b 1 3.14 Exception Example\
  \ :caught floating point number 3.14`\n\n情况 4：\n`Enter the values of a and b 100\
  \ 3.14 Exception Example :caught integer number 100`\n\n## 12.4 函数内部异常\n\n在之前显示的所有编程示例中，异常是在函数内部抛出的。然而，当程序规模增大时情况并非如此。通常，会创建多个函数来编写规模更大的程序。因此，某些函数可能会抛出异常而不是\
  \ `main` 函数。程序 12.7 显示，每当函数 `fun()`抛出一个异常，相应的异常块会在 `main()` 中执行。\n\n```cpp\n// 程序\
  \ 12.7 // 函数调用异常\n#include<iostream>\nusing namespace std;\nvoid fun() {\n    int\
  \ a;\n    float b;\n    cout << \"Enter the values of a and b\" << endl;\n    cin\
  \ >> a >> b;\n    if (a == 100) throw a;\n    else if(b == 3.14f) throw b;\n   \
  \ cout << \"No exception is thrown!\" << endl;\n}\nint main() {\n    try\n    {\n\
  \        fun();\n    }\n    catch (int temp1)\n    {\n        cout << \"Exception\
  \ Example :caught integer number \"\n             << temp1 << endl;\n    }\n   \
  \ catch (float temp2)\n    {\n        cout << \"Exception Example :caught floating\
  \ point number \"\n             << temp2 << endl;\n    }\n    return 0;\n}\n```\n\
  \n程序 12.7 的典型结果如下所示：\n\n`Enter the values of a and b 23 3.14 Exception Example :caught\
  \ floating point number 3.14`\n\n## 12.5 C++ 标准异常\n\n\n\n\nC++ 标准库提供了一系列在 `<exception>`\
  \ 头文件中定义的标准异常。这些标准异常可以在程序中使用，并按照基类类和派生类的层次结构进行排列。标准库的基类被设计用于声明要作为异常抛出的对象。C++ 标准异常的层次结构图如图图\
  \ 12.1 所示。头文件 `<exception>` 定义了两个通用异常类型，自定义异常可以继承这两种类型来报告错误：`logic_error` 和 `runtime_error`。C++\
  \ 标准库组件抛出的所有异常都属于此类异常类。`logic_error` 和 `runtime_error` 是标准异常类。我们可以使用这些基类来派生自己的异常类型。派生自\
  \ `logic_error` 的异常类有：`domain_error`、`invalid_argument`、`length_error`、`out_of_range`、`bad_cast`\
  \ 和 `bad_typeid`；而派生自 `runtime_error` 的异常类有：`range_error`、`overflow_error` 和 `bad_alloc`。\n\
  \n![](img/15_Chapter12_fig_01.png)\n\n图 12.1：C++ 标准异常的层次结构。\n\n表 12.1](#15_Chapter12.xhtml_Chapter12_20)\
  \ 列出了部分 C++ 标准异常及其简要描述。\n\n表 12.1：标准 C++ 异常及其描述。\n\n| exception | 它是所有标准 C++ 异常的父类。它是\
  \ C++ 标准库抛出的所有异常的基类。函数 `what()` 可用于获取异常初始化时使用的可选字符串。 |\n| `bad_alloc` | 报告存储分配失败。\
  \ |\n| `bad_cast` | 可由 `dynamic_cast` 抛出，用于在运行时类型识别中执行无效的 `dynamic_cast` 表达式。 |\n\
  | `bad_exception` | 这是一个处理 C++ 程序中意外异常的有用设备。 |\n| `bad_typeid` | 可由 `typeid` 抛出。它报告表达式\
  \ `typeid(*p)` 中的空指针 `p`。 |\n| `logic_error` | 是一种理论上可以通过读取代码检测到的异常。它派生自 `exception`，报告推测可以通过检查检测到的程序逻辑错误。\
  \ |\n| `domain_error` | 当使用数学上无效的域时抛出此异常。它报告违反前置条件。 |\n| `invalid_argument` | 由于无效参数抛出此异常，表示抛出该异常的函数接收了无效参数。\
  \ |\n| `length_error` | 创建过大的 `std:string` 时抛出此异常，表示尝试产生长度大于或等于 `npos`（上下文大小类型的最大可表示值，通常为\
  \ `std:size_t`）的对象。 |\n| `out_of_range` | 可由方法抛出，例如 `std:vector` 和 `std:bitset<>:operator[]()`。它报告超出范围的参数。\
  \ |\n| `runtime_error` | 是一种理论上无法通过读取代码检测到的异常。它报告推测只有在程序执行时才能被检测到的运行时错误。 |\n| `overflow_error`\
  \ | 如果发生数学溢出则抛出此异常。它报告算术溢出。 |\n| `range_error` | 当尝试存储超出范围的值时发生此异常。它报告违反后置条件。 |\n\
  | `underflow_error` | 如果发生数学下溢则抛出此异常。 |\n\n拥有标准 C++ 异常知识的优势之一是我们可以通过继承和重写异常类功能来定义我们自己的异常。程序\
  \ 12.8 使用异常类来实现程序员自己的异常。在程序程序中，`what()` 是 `exception` 类提供的公共方法，已被所有子异常类重写。\n\n```cpp\n\
  // Program 12.8 // Defining our own exceptions\n#include <iostream>\nusing namespace\
  \ std;\nstruct NewException : public exception {\n    const char * what () const\
  \ throw ()\n    {\n        return \"C++ Exception\";\n    }\n};\nint main() {\n\
  \    try\n    {\n        throw NewException();\n    }\n    catch(NewException& EX)\n\
  \    {\n        cout << \"New Exception caught\" << endl;\n        cout<< EX.what()\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n程序 12.8 的结果所示：\n\n`New Exception caught\
  \ C++ Exception`\n\n## 12.6 复习题\n\n1. “除以零”问题的含义是什么？请讨论。\n2. 什么是异常？它与错误有什么区别？\n\
  3. 使用 `try`、`catch` 和 `throw` 关键字 编写一个 C++ 程序。\n4. 异常处理程序在 C++ 中的主要作用是什么？\n5. 关于与异常相关的\
