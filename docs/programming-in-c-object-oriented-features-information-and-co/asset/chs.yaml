  8. 关于 C++ 标准异常的层次结构写一篇笔记。\n9. C++ 中标准异常的含义是什么？请用示例描述它们。\n10. 编写一个定义新异常的程序。\n\n#\
  \ 13 基础 I/O 和文件处理\n\n君子专注于自己的工作，而不是他人的。——曾子\n\n## 13.1 引言\n\n本章描述了 C++ 中的基础输入输出以及\
  \ I/O 流。它还关注文件处理操作和一些流类。输入是进入程序的数据，输出是离开程序的数据，如图 13.1 所示。流是从源移动到目的的数据序列。输入流是源，输出流是目的。这些流处理从源或到目的的数据。缓冲区是流使用的内存块。其思想是数据从计算机的一个部分流到另一个部分。如图\
  \ 13.1 所示，键盘输入由程序读取，结果将显示在计算机屏幕上。\n\n![](img/16_Chapter13_fig_01.png)\n\n图 13.1：带有输入输出数据为源和目的的程序。\n\
  \n\n\n\n我们在之前的程序中广泛地使用了 `cin` 和 `cout`。为了使用 `cin` 和 `cout`，我们必须包含 `iostream`。在 C++\
  \ 中，有三个库头文件对于管理 I/O 操作非常重要：`iostream`、`iomanip` 和 `fstream`。`iostream` 文件定义了 `cin`、`cout`、`cerr`\
  \ 和 `clog` 对象，分别对应标准输入流、标准输出流、无缓冲的标准错误流和缓冲的标准错误流。`iomanip` 文件声明了用于格式化 I/O 或参数化流操纵符的各种，例如\
  \ `setw()` 和 `setprecision()`。`fstream` 文件声明了用于用户控制文件处理的函数。\n\n### 标准输出流 (cout)\n\
  C++ 中 I/O 的基本数据类型是流（streams）。C++ 中有很多流类型，最常见的流类型是标准 I/O 流。`cin` 是内置的输入流变量，默认连接到键盘。同样，`cout`\
  \ 是另一个内置的输出流变量，默认连接到控制台。此外，C++ 还支持 C 语言中包含的所有 I/O 机制。此外，C++ 流提供了 C 的所有 I/O 能力，并有了大幅改进。\n\
  \n为了从文件或程序中获取信息，我们需要显式地指示计算机输出所需的信息。在 C++ 中实现这一点的方法是使用输出流。为了使用标准 I/O 流，我们必须在程序中包含预处理器指令\
  \ `#include <iostream>`。为了在屏幕上输出，我们只需要使用一个语句，例如：\n\n```\ncout << \" Value = \" <<\
  \ value;\n```\n\n其中，`value` 是我们想要写入屏幕的变量或常量的名称。`<<` 被称为插入运算符，指向数据流的方向。\n\n预定义对象\
  \ `cout` 是 `ostream` 类的实例。`cout` 对象被认为“连接到”标准输出设备（通常是显示器）。`cout` 与写为 `<<`（两个小于号）的流插入运算符结合使用。C++\
  \ 编译器还会确定确定要输出的变量的数据类型，并选择合适的流插入运算符来显示该值。`<<` 运算符被重载，用于输出内置类型 `integer`、`float`、`double`、`strings`\
  \ 和指针值的数据项。如前所示，插入运算符 `<<` 可以在单个语句中使用多次，而 `endl` 用于在行尾添加新行符。\n\n### 标准输入流 (cin)\n\
  为了将信息输入到文件或程序，我们需要显式地指示计算机获取所需的信息。在 C++ 中实现这一点的方法是使用输入流。与 `cout` 类似，程序 `cin` 必须使用预处理器指令\
  \ `#include <iostream>`。为了输入，我们使用一个语句，例如：\n\n```\ncin >> value;\n```\n\n其中，`value`\
  \ 是变量的名称，其值将从键盘读取。`>>` 运算符被称为提取运算符；它指向数据流的方向。\n\n预定义对象 `cin` 是 `istream` 类的实例。`cin`\
  \ 对象被认为附加到标准输入设备（通常是键盘）。如接例所示，`cin` 与写为 `>>`（两个大于号）的流提取运算符结合使用。C++ 编译器还会确定输入值的数据类型，并选择合适的流提取运算符来提取该值并存储在给定的变量中。流提取运算符\
  \ `>>` 可以在单个语句中使用多次。\n\n### 标准错误流 (cerr)\n预定义对象 `cerr` 是 `ostream` 类的实例。它被认为附加到标准错误设备（也是显示器），但对象\
  \ `cerr` 是无缓冲的，每次向 `cerr` 插入都会导致其输出立即出现。它也与流插入运算符结合使用。\n\n### 标准日志流 (clog)\n预定义对象\
  \ `clog` 是 `ostream` 类的实例。它被认为附加到标准错误设备（也是显示器），但对象 `clog` 是缓冲的。这意味着每次向 `clog` 插入可能导致其输出保持在缓冲区中，直到缓冲区填充或刷新。`clog`\
  \ 也与流插入运算符结合使用。通常，使用 `cerr` 流显示错误信息，使用 `clog` 流显示其他日志信息是一种良好的做法。程序 13.1 展示了 `cout`、`cin`、`err`\
  \ 和 `clog` 的示例。\n\n```cpp\n// Program 13.1 // Input and output \n#include<iostream>\n\
  using namespace std;\nint main( ) {\n    char st_err[] = \"Error in the Program!\"\
  ;\n    char st_log[] = \"Log Details!\";\n    char st_input[50];\n    cout << \"\
  Enter a String :\" << endl;\n    cin >> st_input;\n    cout << \"Entered String\
  \ = :\" << st_input<<endl;\n    cerr << \"Displaying Error Message : \" << st_err\
  \ << endl;\n    clog << \"Displaying Log Message : \" << st_log << endl;\n    return\
  \ 0;\n}\n```\n\n程序 13.1 的结果所示：\n\n```\nEnter a String : Qingdao\nEntered String\
  \ = :Qingdao\nDisplaying Error Message : Error in the Program!\nDisplaying Log Message\
  \ : Log Details!\n```\n\n## 13.3 文件 I/O\n在许多与文本相关的开发过程中，从文件读取和写入文件是非常实用的。到为止，我们一直在使用\
  \ `iostream` 标准库，它提供了 `cin` 和 `cout` 方法分别从标准输入读取和写入标准输出。在本节中，我们将学习如何从文件读取和写入文件。这需要另一个名为\
  \ `fstream` 的标准 C++ 库，它定义了三个数据类型：`ofstream`、`ifstream` 和 `fstream`。在 C++ 中执行文件处理，必须在\
  \ C++ 源文件中包含头文件 `<iostream>` 和 `<fstream>`。C++ 提供了以下类来执行字符对文件的输入和输出：\n\n- `ofstream`:\
  \ 这是一个用于向文件写入的流类。该数据类型表示输出文件流，用于创建文件并向其中写入信息。\n- `ifstream`: 这是一个用于从文件读取的流类。该数据类型表示输入文件流，用于从文件中读取信息。\n\
  - `fstream`: 这是一个既能从文件读取又能向文件写入的流类。该数据类型通常表示文件流，具备 `ofstream` 和 `ifstream` 的功能。这意味着它可以创建文件、向其中写入信息，并从其中读取信息。\n\
  \n这些类直接或间接地继承自 `istream` 和 `ostream` 类。我们已经使用过类型为这些类的对象：(a) `cin` 是 `istream` 类的对象，(b)\
  \ `cout` 是 `ostream` 类的对象。因此，我们一直在使用与文件流相关的类了。我们可以像使用 `cin` 和 `cout` 一样使用我们的文件流，区别在于我们必须将这些流与物理文件关联。程序\
  \ 13.2 创建了一个名为 `output.txt` 的文件，并使用文件流 `myfile` 插入了一句“Hello!, This is how we use\
  \ file in C++!”。\n\n```cpp\n// Program 13.2 // Basic file operations example\n#include\
  \ <iostream>\n#include <fstream>\nusing namespace std;\nint main () {\n    ofstream\
  \ myfile;\n    myfile.open (\"output.txt\");\n    myfile << \"Hello!, This is how\
  \ we use file in C++!\"<<endl;\n    myfile.close();\n    return 0;\n}\n```\n\n一旦程序成功编译，即可在程序的相同文件夹中找到\
  \ `output.txt` 文件，该文件的内容所示：\n\n![](img/16_Chapter13_fig_02.png):\n\n\n\n\n\nC++\
  \ 提供了用于从磁盘存储的文件中读取和写入数据的流类型。在大多数情况下，这些流的操作方式与标准 I/O 流 `cin` 和 `cout` 完全相同。对于基础的文件\
  \ I/O 操作，我们必须包含 `#include <fstream>` 语句。并没有预定义的文件流变量，因此需要使用文件流的程序员必须声明文件流变量：\n\n\
  ```cpp\nifstream inFile; // 输入文件流对象\nofstream outFile; // 输出文件流对象\n```\n\n文件流对象\
  \ `ifstream` 和 `ofstream` 是 C++ 流类，设计用于连接输入或输出文件。文件流对象拥有标准流 `cin` 和 `cout` 的所有成员函数和操作符。\n\
  \n### 将流连接到文件\n\n文件流默认没有连接到任何内容。为了使用文件流，程序员必须在文件流和文件之间建立连接。这可以通过两种实现：(1) 使用 `open()`\
  \ 成员函数，(2) 使用 `ifstream` 和 `ofstream` 类。我们可以如下使用与每个流对象关联 `open()` 成员函数：\n\n```cpp\n\
  inFile.open(\"input.data\"); outFile.open(\"output.data\");\n```\n\n这设置了文件流以从名为\
  \ `\"input.data\"` 的文件读取数据，并将输出写入名为 `\"output.data.\"` 的文件。对于输入流，如果指定的文件不存在，操作系统将不会创建它，且输入流变量将包含一个错误标志。可以使用成员函数\
  \ `fail()` 进行此检查。对于输出流，如果指定的文件不存在，操作系统将创建它。我们也可以在声明流变量时如下所示将文件流变量连接到文件：\n\n```cpp\n\
  ifstream inFile(\"input.data\"); ofstream outFile(\"output.data\");\n```\n\n这同样设置了文件流以从名为\
  \ `\"input.data\"` 的文件读取数据，并将输出写入名为 `\"output.data.\"` 的文件。这种方法与使用 `open()` 函数的唯一区别在于简洁性。如果我们要使用字符串常量（或变量）来存储文件名，则在连接流时必须添加一个特殊的转换：\n\
  \n```cpp\nstring inputFileName = \"input.data\"; ifstream inFile(inputFileName.c_str());\n\
  ```\n\n### 打开文件\n\n打开的文件在程序中通过流来表示，即这些类中的一个类的对象。在程序 13.2 中，它是 `myfile`，对该流对象执行的任何输入或输出操作都将应用于与其关联的物理文件。为了使用流对象打开文件，我们如下使用其成员函数\
  \ `open`：\n\n```cpp\nopen (filename, mode);\n```\n\n其中 `filename` 是一个表示要打开的文件名的字符串，`mode`\
  \ 是一个可选参数，带有如表 13.1 所示的标志组合。在从文件中读取或写入之前，必须先打开文件。可以使用 `ofstream` 或 `fstream` 对象打开文件进行写入，并使用\
  \ `ifstream` 对象打开文件进行读取。\n\n| 标志 |  |\n| :--- | :--- |\n| `ios::app` | 将所有输出追加到文件末尾。\
  \ |\n| `ios::ate` | 打开时移动到文件末尾。 |\n| `ios::binary` | 以二进制模式打开文件。 |\n| `ios::in`\
  \ | 以读取模式打开文件。 |\n| `ios::out` | 以写入模式打开文件。 |\n| `ios::out` | 丢弃现有内容并为了写入打开。 |\n\
  | `ios::trunc` | 如果文件已存在，则截断文件。 |\n\n对于 `ifstream` 和 `ofstream`，`ios::in` 和 `ios::out`\
  \ 分别被自动假设，即使作为第二个参数传递了不包含它们的模式。对于 `fstream`，只有在不带任何参数调用函数时，才会应用默认值。如果调用函数时带了任何值，默认模式将被覆盖，而不是合并。\n\
  \n`void open(const char *filename, int mode);`\n\n### 关闭文件\n\n当 C++ 程序终止时，它会自动刷新所有流，释放所有内存并关闭所有已打开的文件。但程序员在程序终止之前关闭所有打开的文件始终是一个良好的习惯。以下是\
  \ `fstream`、`ifstream` 和 `ofstream` 对象的成员 `close()` 函数的标准语法：\n\n```cpp\nvoid close();\n\
  ```\n\n如前提到的，当程序不再需要某个文件时，必须使用与每个文件流变量关联的 `close()` 成员函数来关闭文件：\n\n```cpp\ninStream.close();\n\
  outStream.close();\n```\n\n当我们完成对文件的输入和输出操作后，应该关闭它，以便通知操作系统并使其资源再次可用。出于此目的，我们调用流的成员函数\
  \ `close()`。该成员函数会刷新关联缓冲区并关闭文件。一旦调用此成员函数，流对象就可以重用以打开另一个文件，且该文件将再次被其他进程打开。如果对象在仍关联于打开的文件时被销毁，析构函数会自动调用成员函数\
  \ `close()`。\n\n\n\n\n文本文件流是指在打开模式中不包含 `ios:binary` 标志的流。这些文件设计用于存储文本。因此，所有输入或输出到这些文件的值都可能经过某些格式转换，这些转换并不一定对应于它们的字面二进制值。对文本文件的写入操作方式与我们操作\
  \ `cout` 的方式相同。\n\n### 写入文件\n\n在 C++ 编程中，我们使用流插入运算符（`<<`）从程序向文件写入信息，就像我们使用该运算符向屏幕输出信息一样。唯一的区别是，我们使用\
  \ `ofstream` 或 `fstream` 对象代替 `cout` 对象。\n\n```cpp\n// Program 13.3 // 在文本文件上写入\n\
  #include <iostream>\n#include <fstream>\nusing namespace std;\nint main () {\n \
  \   ofstream myFile(\"output.txt\");\n    if (myFile.is_open())\n    {\n       \
  \ myFile << \"This is a first line.\"<< endl;\n        myFile << \"This is second\
  \ line line.\" << endl;\n        myFile << \"This is the last line in this file\
  \ \" << endl;\n        myFile.close();\n    }\n    else\n        cout << \"Unable\
  \ to open file\";\n    return 0;\n}\n```\n\n一旦程序成功编译，就可以在程序相同的文件夹中找到 `output.txt`\
  \ 文件。`output.txt` 文件的内容所示所示：\n\n![](img/16_Chapter13_fig_03.png):\n\n### 从文件中读取\n\
  \n我们可以使用流提取运算符（`>>`）从文件中将信息读取到我们的程序中，就像我们使用该运算符从键盘输入信息一样。唯一的区别是，我们使用 `ifstream`\
  \ 或 `fstream` 对象代替 `cin` 对象。程序 13.4 显示了如何读取文本文件 `input.txt` 的内容并显示在屏幕上，前提是 `input.txt`\
  \ 文件与程序文件位于同一个文件夹。我们创建了一个 `while` 循环，通过 `getline()` 函数逐行读取文件。`getline()` 返回的值是流对象本身的引用，当它在这个\
  \ `while` 循环中被求值为布尔表达式时：(a) 如果流准备好进行更多操作，则为真；(b) 如果到达文件末尾或发生其他错误，则为假。\n\n```cpp\n\
  // Program 13.4 // 读取文本文件\n#include <iostream>\n#include <fstream>\n#include <string>\n\
  using namespace std;\nint main () {\n    string readline;\n    ifstream myFile (\"\
  input.txt\");\n    if (myFile.is_open())\n    {\n        while ( getline (myFile,readline)\
  \ )\n        {\n            cout << readline << endl;\n        }\n        myFile.close();\n\
  \    }\n    else\n        cout << \"Unable to open file\" << endl;\n    return 0;\n\
  }\n```\n\n程序 13.4 的结果所示：\n\n`Hello, this is input.txt file. This is a text file.\
  \ The contents will be displayed to screen! Happy Programming!`\n\n### 检查状态标志\n\n\
  存在多个成员函数用于检查流的特定状态，它们都返回一个 bool 值，如 表 13.3 所示。\n\n表 13.3：检查流状态的函数及其描述。\n\n| 函数 |\
  \ 描述 |\n| --- | --- |\n| `bad()` | 如果读取或写入操作失败，则返回真。例如，当我们尝试向一个未打开写入的文件写入，或者我们尝试写入的设备没有剩余空间时。\
  \ |\n| `fail()` | 不仅在与 `bad()`相同的情况下返回真，在发生格式错误时也返回真，例如，当我们尝试读取整数时提取出了字母字符。 |\n\
  | `eof()` | 如果一个打开用于读取的文件已到达末尾，则返回真。 |\n| `good()` | 这是最通用的状态标志。在上述任何一个函数返回真的情况下，它返回假。\
  \ |\n| `clear()` | 此函数可用于重置状态标志。 |\n\n程序 13.5 展示了一个以读写模式打开的文件的示例。在执行过程中，程序要求用户输入信息并将其存储在\
  \ `input.txt` 中。然后，程序从文件中读取信息并输出到屏幕上。\n\n```cpp\n// Program 13.5 // 在文件中读取和写入\n\
  #include <fstream>\n#include <iostream>\nusing namespace std;\nint main() {\n  \
  \  char indata[100];\n    // 以写入模式打开文件。\n    ofstream outfile;\n    outfile.open(\"\
  input.dat\");\n    cout << \"Writing to the file:input.dat\" << endl;\n    cout\
  \ << \"Enter the name of your city: \";\n    cin.getline(indata, 100);\n    // 将输入的数据写入文件。\n\
  \    outfile << indata << endl;\n    outfile.close();\n    // 以读取模式打开文件。\n    ifstream\
  \ infile;\n    infile.open(\"input.dat\");\n    cout << endl << \"Reading from the\
  \ file:input.dat\" << endl;\n    infile >> indata;\n    // 将数据写到屏幕。\n    cout <<\
  \ indata << endl;\n    // 关闭打开的文件。\n    infile.close();\n    return 0;\n}\n```\n\
  \n程序 13.5 的结果所示：\n\n`Writing to the file:input.dat Enter the name of your city:\
  \ Beijing Reading from the file:input.dat`\n\n## 13.4 复习题\n\n1. 解释以下内容：a) 输入流 (b)\
  \ 输出流 (c) 缓冲区。\n2. 简述 (a) `cin`, (b) `cout`, (c) `cerr`。\n3. 讨论与相关的类：a) `ofstream`,\
  \ (b) `ifstream`, (c) `fstream`。\n4. 说明二进制文件和文本文件之间的区别。\n5. 编写一个程序从文件 `input.txt`\
  \ 读取信息并写入 `output.txt`。\n6. 编写一个程序读取两个文件并合并到一个文件中。\n\n![](img/16_Chapter13_fig_04.png):\n\
  \n# 类与对象\n\n如果一个人能将知识扩展到极致，就会拥有智慧。拥有智慧就可以做出选择。\n– 成毅\n\n## 14.1 引言\n\n在本章中，我们将学习面向对象编程最重要的部分，即类和对象。常见的面向对象编程（OOP）语言有\
  \ C++ 和 Java。\n\n\n\n\n我们可能会思考一个问题：对象的概念在软件开发中有什么用？为了回答这个问题，我们必须理解软件的应用。今天，软件被设计用于各种应用，例如学生数据管理、银行应用程序、客户交易、铁路预订等。所有这些软件都使用了实体，如客户、银行、交易、预订等。所有这些实时实体都被表示为对象。因此，对于程序员和客户来说，编写易理解的程序变得简单。\n\
  \n## 14.3 类定义\n\n### 什么是类？\n\n在第 14.2 节中，我们分析了对象的含义。类（class）是一个用于创建对象的通用术语。在面向对象编程（OOP）中，类通过单一名称下的数据和行为来表示现实世界的实体。例如，陈先生是一个学生，这意味着陈先生属于`student`类。在这个例子中，`Mr.\
  \ Chen`是一个对象，而`student`是一个类。一个类可以有很多对象。让我们来看下面这句话：\n\n陈先生、方女士和布鲁斯先生都是学生。\n\n我们从上述陈述中推断出什么？它表明陈、方、布鲁斯都属于`student`类。这清楚地表明一个类负责创建一个或多个对象。现在，让我们比较以下语句：\n\
  \n```\nint Chen_Weight, Fang_Weight, Bruce_weight; Student Chen, Fang, Bruce;\n\
  ```\n\n如果我们比较之前的两个语句，它们看起来相似。在第一个语句中，所有三个变量都是整数。在第二个语句中，所有三个对象都属于`Student`类。因此，类就像是创建许多对象的模板或模型。通常，对象被称为类的实例（instance）。在第\
  \ 14.2 节中，我们学习了对象具有数据和方法或行为。类被用于定义数据和方法。我们知道陈、方和布鲁斯都是学生，他们共享许多特征，这些特征表示为数据和方法并在类中定义。因此，类被用于定义所有对象共有的数据和方法。所以，C++类是数据和方法（函数）的集合，它创建一个一个新的数据类型，用于创建该类的对象。通常，类定义的语法所示：\n\
  \n```cpp\nclass class_name {\n    public:\n        <variable declaration>// 用于数据成员\n\
  \        <method declaration>//成员函数\n    private:\n        <variable declaration>//\
  \ 用于数据成员\n        <method declaration>//成员函数\n    protected:\n        <variable\
  \ declaration>// 用于数据成员\n        <method declaration>//成员函数\n};\n```\n\n如语法所示，C++\
  \ 中使用了三种不同的关键字作为访问修符（access specifiers）：`public`、`private`和`protected`。它们指导了在类外部和程序内部访问类成员（如函数（方法）或数据）的规则。`private`访问修符支持实现\
  \ OOP 的数据隐藏功能。类的`private`成员只能在类内部访问。另一方面，`public`成员也可以在类外部访问。这些访问修符后面跟着一个冒号。如果没有提到访问修符，则默认情况下所有成员函数或数据将变为私有。关于这的更多细节请参阅第\
  \ 14.7 节。类定义以分号结束。为了理解类和对象，让我们定义一个`Student`类。\n\n```cpp\nclass Student {\n    public:\n\
  \        int student_number;\n        char name[20];\n        int marks;\n     \
  \   char university_name[40];\n        void get_name_number() {\n            cout\
  \ << \"Student Number=\" << student_number << endl;\n            cout << \"Student\
  \ Name=\" << name << endl;\n        }\n        void get_marks() {\n            cout\
  \ << \"Student Marks=\" << marks << endl;\n        }\n};\n```\n\n在创建对象之前必须定义该类。这意味着类定义充当了创建对象的模板。例如，以下语句创建了一个`Student`类型的对象。正如所解释的，每个对象都是类的实例。这意味着\n\
  \n```cpp\nStudent Fang;\n```\n\n`Student`声明了一个类型为`Student`的对象。在这里，`Fang`是`Student`类的实例。我们也可以如下所示创建多个`Student`类型的对象：\n\
  \n```cpp\nStudent Fang, Wang;\n```\n\n每个对象为成员分配了独立的内存。因此，我们可以为每个对象存储不同的值。\n\n###\
  \ 如何访问数据和方法\n\n在之前的示例中，类`Student`的`student_number`、`marks`是类的数据成员，而`get_name_number()`和`get_marks()`是类的方法成员。要使用这些数据和方法，我们使用`.`（点）运算符。以下语句将`1897658`赋值给`Fang`的`student_number`数据：\n\
  \n```cpp\nFang.student_number = 1897658;\n```\n\n同样，我们可以调用`Fang`的方法：\n\n```cpp\n\
  Fang.get_marks();\n```\n\n上一语句调用了`Fang`的`get_marks()`方法。\n\n程序 14.1 完整地总结了之前的描述、类和对象，并同时使用了数据和方法。类定义总是写在`main()`函数的定义之前。这是因为对象必须在被使用之前定义。\n\
  \n\n\n\n\n一个类可以有多个方法，每个方法都有零个或多个参数。是否可以编写多个同名的方法？答案是肯定的。一个类可以拥有多个同名的方法。这种概念被称为方法重载。要重载一个方法，必须满足以下条件：\n\
  \n1. 方法名应保持相同。\n2. 方法应该具有不同的参数列表或签名。\n3. 方法可以在同一个类中，也可以在子类中。\n\n方法的签名由方法名和数据类型参数的数量决定。以下三个方法具有三个不同的签名：\n\
  \n`void oneMethod(int a, int b); void oneMethod(int a, float b); void oneMethod(int\
  \ a, float b,long c);`\n\n如果多个方法的名称相同但签名不同，我们称该方法被重载了，并称这些方法为重载方法。程序 14.4 阐述了这一示例。\n\
  \n```cpp\n// Program 14.4 // 用于理解重载方法的程序 \n#include<iostream> \nusing namespace\
  \ std; \nclass Overload { \n    public: \n        int add(int a,int b) \n      \
  \  { \n            return (a+b); \n        } \n        float add(float a,float b)\
  \ \n        { \n            return (a+b); \n        } \n        double add(double\
  \ a,double b) \n        { \n            return (a+b); \n        } \n};\n\nint main()\
  \ { \n    Overload SAME; \n    int a = 10; \n    int b = 20; \n    float c = 23.75F;\
  \ \n    float d = 78.987F; \n    double e = 23456.879; \n    double f = 33445.789645;\
  \ \n    cout << \"Integer Addition : a + b = \" << SAME.add(a,b) << endl; \n   \
  \ cout << \"Float Addition : a + b = \" << SAME.add(c,d) << endl; \n    cout <<\
  \ \"Double Addition : a + b = \" << SAME.add(e,f) << endl; \n    return 0; \n}\n\
  ```\n\n程序 14.4 的结果所示：\n\n`Integer Addition: a + b = 30 Float Addition: a + b = 102.737\
  \ Double Addition: a + b = 56902.7`\n\n## 14.5 多对象\n\n到目前为止，我们学习了如何创建一个对象并使用它。通常，一个面向对象的程序可能有很多对象和类。程序\
  \ 14.5 展示了如何编写一个包含多个对象的程序。\n\n```cpp\n// Program 14.5 // 带有多个对象的程序 \n#include<iostream>\
  \ \nusing namespace std; \nclass Student { \n    public: \n        int rollNumber;\
  \ \n        int marks; \n        char grade; \n        void printRollNo() \n   \
  \     { \n            cout << \"rollNumber = \" << rollNumber << endl; \n      \
  \  } \n        void printMarks() \n        { \n            cout << \"Marks = \"\
  \ << marks << endl; \n        } \n        void printGrade() \n        { \n     \
  \       cout << \"Grade = \" << grade << endl; \n        } \n}; \nint main() { \n\
  \    Student s1,s2; \n    s1.rollNumber = 9; \n    s1.marks = 90; \n    s1.grade\
  \ = 'A'; \n    s1.printRollNo(); \n    s1.printMarks(); \n    s1.printGrade(); \n\
  \    s2.rollNumber = 10; \n    s2.marks = 99; \n    s2.grade = 'A'; \n    s2.printRollNo();\
  \ \n    s2.printMarks(); \n    s2.printGrade(); \n    return 0; \n}\n```\n\n程序 14.5\
  \ 的结果所示：\n\n`rollNumber = 9 Marks = 90 Grade = A rollNumber = 10 Marks = 99 Grade\
  \ = A`\n\n## 14.6 对象数组\n\n在许多软件应用中，我们可能需要创建一个包含许多相同类型对象的程序。在这种情况下，我们将使用对象数组，即只用一个类和一个数组，用于创建相似的实例。在本节中，我们将进一步探索对象数组。为了说明对象数组的处理，我们将在下面的示例中使用\
