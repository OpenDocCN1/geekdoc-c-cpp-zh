  \ (i = 0; i < Array_Length-1; i++)\n    {\n        for (j = 0; j < Array_Length-1-i;\
  \ j++)\n        {\n            if (strcmp(list[j+1], list[j]) < 0)\n           \
  \ {\n                strcpy(temp,list[j]);\n                strcpy(list[j],list[j+1]);\n\
  \                strcpy(list[j+1],temp);\n            }\n        }\n    }\n    cout\
  \ << \"The Student's names in ascending order: \" << endl;\n    for(i = 0; i < Array_Length;\
