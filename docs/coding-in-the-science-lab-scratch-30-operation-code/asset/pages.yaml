    # About the Authors


    Kristin Fontichiaro teaches at the University of Michigan School of Information.
    She likes working with kids on creative projects from coding to sewing to junk
    box inventions. She has written or edited almost 100 books for kids.


    Colleen van Lent teaches coding and Web design at the University of Michigan School
    of Information. She has three cool kids and a dog named Bacon. She wishes she
    could touch her toes.'
