- pgno: 20
  md: '# Adding Sound


    What’s an explosion without sound? Let’s add some!


    We **uploaded** a **custom** sound called “boom sound.” In your Boom sprite code,
    add [play sound boom sound]. You can find this block in the Sounds category.


    Code this block in different places. What happens if you put it inside the repeat
    Control block?


    # Pro Tip!


    Ask an adult to help you explore Scratch’s many sound tools at https://en.scratch-wiki.info/wiki/Sound.
    You can record your own sound, edit how much sound you use, use Scratch''s sounds,
    and more.'
  merge: -1
