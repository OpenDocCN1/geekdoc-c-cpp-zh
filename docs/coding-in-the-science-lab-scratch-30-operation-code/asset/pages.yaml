- pgno: 18
  md: '# Making the

    Explosion Grow


    The code works … but the **explosion** doesn''t have much pizzazz. What if the
    Boom sprite started small, then it got bigger and changed colors?


    Click on the Boom sprite and add the code shown here. This will give you more
    practice with the *repeat*, *wait*, and *change color effect* blocks. Then test
    your code at least twice.


    # Pro Tip!


    "Color" is just one way to use the *change effect* looks block. You can also try
    "fisheye," "whirl," "pixelate," "ghost," and more!'
