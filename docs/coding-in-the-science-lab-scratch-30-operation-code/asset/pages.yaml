- pgno: 27
  md: '# Learn to code with Scratch 3.0!


    Scratch is a simple block-based programming language designed to teach you the
    basics of coding. You’ll learn about sequencing, conditionals, coordinates, and
    more. Code an interactive story, game, or animation and share your work with others.
    This series will help you improve and gain the necessary skills that will get
    you coding in no time. Get ready to think creatively and problem solve. What will
    you code?


    # Read all of the Operation Code books


    +   - Coding in the Cafeteria

    +   - Coding in the City

    +   - Coding at the Grocery Store

    +   - Coding Onstage

    +   - Coding on the Playground

    +   - Coding in the Science Lab

    +   - Coding at the Water Park

    +   - Coding at the Zoo'
