  - '[PAGE 6]


    # Robot in the Lab!


    Rudy the Robot is loose in the science lab. Help Rudy make a big mess.


    To copy our starter code, go to https://scratch.mit.edu/projects/319254293.


    This project has five sprites. The lab bench and group of beakers are decorative
    sprites. We will use layers to keep the sprites in the right order.


    # Pro Tip!


    Scratch lets you see other people’s projects. You can even copy the code to make
    them your own. Our code contains the sprites and sounds we will use in this book.'
  - '[PAGE 7]


    Beginning of the program


    Resets the Green Beaker to be in front of the other sprites


    Resets the Green Beaker upright


    Tells the Green Beaker sprite to wait 2 seconds before doing anything


    Turns the Green Beaker right (“90 degrees” means “right” in Scratch)


    ```

    when green flag clicked

    ```


    ```

    go to front layer

    ```


    ```

    point in direction 90

    ```


    ```

    wait 2 seconds

    ```


    ```

    turn 90 degrees

    ```


    ![](img/7f7ec57920f852b9f08403fe6bf2aab3_7_0.png)'
  - '[PAGE 8]


    # Pouring the Beaker


    Rudy wants to mix the liquid in the Green and Yellow Beaker sprites.


    Click on the Green Beaker sprite.

    Add the code and test it. Did you see the Green Beaker turn?


    # Pro Tip!


    After testing your program, you might need to **reset** your sprite. This means
    putting it back in the right position, pointing the right way, or making sure
    it is in the front (so no other sprite is blocking it). Layers tell Scratch which
    sprites to put in front or back.'
  - '[PAGE 9]


    We replaced the turn [90] degrees Motion block with three 30-degree turns.'
  - '[PAGE 10]


    # Slow Down

    That Beaker!


    The Green Beaker moves, but it doesn’t look like it is pouring. Let’s make it
    turn by coding three small turns, 30 degrees for each. The Green Beaker will still
    turn 90 degrees because 30 + 30 + 30 = 90. This means the Green Beaker will end
    up in the same place, but the animation will look better.


    # Pro Tip!


    When we use a repeat Command block, we''re making a loop. Loops are sets of computer
    code that repeat. Loops are one way that coders can use fewer blocks and save
    time when building programs.'
  - "[PAGE 11]\n\n```\nwhen flag clicked\n\ngo to front layer\n\npoint in direction\
    \ 90\n\nwait 2 seconds\n\nrepeat 3\n  turn 30 degrees\nend\n\nbroadcast pour\n\
    ```"
  - '[PAGE 12]


    # Sending a Signal


    Let’s change the color of the Yellow Beaker sprite when the Green Beaker sprite
    is poured into it.


    One way is to have the Green Beaker sprite send out a special signal, called a
    broadcast. You can find the block in the Events category.


    Click “message1.” Choose “New message.” Name it “pour.”


    # Pro Tip!


    Broadcasts don’t appear to the viewer. They are invisible, or impossible to see.
    After a message is broadcast, it can be received by the other sprites.'
