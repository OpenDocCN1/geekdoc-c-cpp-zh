  md: '# # Comprehensive Debugging

    ## Chapter 19


    # In This Chapter


    +   - Logging messages with LogCat

    - Debugging code in Eclipse

    - Using the debug and DDMS perspectives

    - Analyzing execution data with Traceview


    If you have ever written a research paper, a company memo, or just an e-mail to
    a friend, you have probably thanked your spell-checker for catching the mistake
    with “thier,” corrected to “their” and only later discovered you really intended
    “there.” Just like your word processor, Eclipse catches your syntax and spelling
    errors. In the same way, just because your app compiles and runs, it does not
    mean you have not written a bug.


    Unlike humans who can mentally “fix” language as they hear it, apps sees a mistake
    and fail or worse—they do something completely unexpected. This chapter introduces
    the tools you need to output your app’s actions to logs, and troubleshoot your
    app using the available debugging tools.


    # # Logging


    As a developer working with a new platform or language, you are likely to see
    a few or fatal error screens. These are easy to do, from forgetting to define
    an null reference to be passed, to an Activity, Service, or ContentProvider in
    the manifest, allowing to to instance an object. These are also easy to track
    back to their source and fix by by reviewing the output of the LogCat view in
    Eclipse.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 336 Part 5: Taking Your App to Market


    In Eclipse, open the LogCat view from the menu by selecting Window > Show View
    > Other > Android > LogCat. When you run your app in the Emulator or on your device,
    the LogCat view quickly fills with system messages as the OS runs. In addition,
    you can see the entire stack trace of each error that the Emulator throws. See
    Figure 19.1.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_349_0.png)


    Figure 19.1: The classic Android fatal error pop-up.


    > DEFINITION

    A stack trace lists each dependent method call in descending order from the last
    method called. In an error context, the stack trace begins with the error, followed
    by the method (A) which generated the error, followed by the method (B), which
    called method (A), and so on.


    Fatal errors can usually be identified and fixed by viewing the stack trace in
    LogCat and looking back at the code. Some obvious omission might become evident;
    this is not always the case, of course, and sometimes you will be faced with less
    obvious errors; clicking a button does not launch an Intent, and no error is generated
    in LogCat.'
  merge: -1
