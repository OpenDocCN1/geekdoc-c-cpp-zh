    # # Model Objects


    Much of your 3D modeling will likely take place in a dedicated design application,
    where you can create the environments, models, and textures. You then import these
    objects into your Android project for rendering through OpenGL. In the meantime,
    you can render simple shapes to work experience some of the possibilities of 3D
    design in Android.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_243_0.png)


    # # Google IT


    Many development resources and engines have already been built to help you rapidly
    develop 3D environments. OpenIntents references a number of free and open source
    projects at http://www.openintents.org/en/libraries. Subscription offerings such
    as Unity3 are also available at http://unity3d.com. Blender and AndCAD also offer
    Android compatible 3D modeling solutions.


