  md: 'Dear Reader,


    When it comes to getting information, you have more options than ever. Many of
    them are online, which is great when you need a little information right away.
    But when you want detail and depth, a successful outcome, or a rich learning experience,
    you turn to the source you''re holding now—a book. And not just any book: Complete
    Idiot''s Guide.


    We designed this Complete Idiot''s Guide for you, because you''re the kind of
    information seeker we understand and value. You''re smart, competent, and willing
    to tackle something new no matter daunting it seems—even when the learning curve
    is high and you feel like a complete idiot. After all, today''s complete idiot
    is your expert.


    So dive right and let us guide you past the pain of “beginner brain” and on to
    the pleasure of discovery and achievement. You''ll get the results you want because
    our authors are credentialed experts who stick with you every step of the way.
    You''ll enjoy the process because our editors know what makes learning easy and
    what just gets in the way. And if we ever fall short, we''ll count on you to let
    us know so we can fix the problem.


    And the next time you need information right away, check in with our online experts
    at idiotsguides.com. Our commitment to intelligent, accurate information carries
    through everything we do—in print or online.


    Happy learning!


