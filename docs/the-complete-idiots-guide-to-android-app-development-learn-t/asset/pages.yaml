    # Welcome to the Android Market


    Google''s marketplace is likely your first stop as a developer with a shiny new
    app. The Market provides a well-planned path to publish your app, providing updates
    and collecting and responding to user feedback. Most of this chapter focuses on
    the specific requirements of the Market, but similar guidelines apply to the other
    storefronts.


    Before you begin the process of registering for accounts and submitting your app,
    you will want to complete the app prepublication checklist.


    +   - You have done a thorough test of your app.


    +   - Your app has an icon and label defined in its AndroidManifest.xml.


    +   - You have turned off debuggable mode and cleaned up your project''s file
    system.


    # Registering Your Accounts


    Signing up for an account and paying the developer''s fee is the first step to
    publishing your app. You need a Google account to register for an Android Market
    Developer account.


    +   1. Visit http://market.android.com/publish. If you do not have a Google account,
    you will be prompted to create one.


    +   2. Google charges a small, one-time application fee ($25 U.S. as of Spring
    2011). You will be prompted to register a credit card with Google Checkout to
    complete the payment.


    > ANDROID DOES


    Developer accounts used to be free, but some less honest users abused the privilege.
    The fee is designed to be as inexpensive as possible while discouraging developers
    from "spamming" the Market with dummy accounts.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_370_0.png)'
