    Most of the core components of Android development have been referenced, at least
    in passing. This chapter focuses on Android development in more generic terms.
    Specifically, this chapter reviews the relationship between Java and the Android
    SDK.


    # ## What Is Java?


    You already know that programs for Android are written using a combination of
    Java and XML. So what is Java and how does it fit into the Android OS? Java is
    a programming language like C or C++ that was developed by Sun Microsystems in
    the early 1990s. Sun, now Oracle, designed Java to enable developers to write
    applications which could run on any platform or OS with little or no modification.'
