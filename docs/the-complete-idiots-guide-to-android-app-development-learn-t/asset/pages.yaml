    # The Least You Need to Know


    +   * 3D graphics in Android are rendered through OpenGL ES.

    * GLSurfaceView and GLSurfaceView.Renderer are the two core classes needed to
    implement 3D models.

    * Android renders 3D objects in a separate thread, which is separate from your
    application’s threads.

    * All 3D objects in OpenGL are composed of vertices and primitives.

    * The ApiDemos in the Android SDK are a great way to learn more about OpenGL.'
