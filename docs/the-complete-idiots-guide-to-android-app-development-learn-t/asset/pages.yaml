  md: '# Chapter 19: Comprehensive Debugging 343


    +   * The File Explorer View provides complete access to the Android file system.
    You can upload or download files to your package''s directory, explore the system
    folder structure, or delete files.


    You have already worked with the Emulator Control View to simulate GPS coordinates
    and incoming calls and messages.


    Defects in your code do not always generate errors that you would expect. Perhaps
    you implemented a ContentProvider that allows read/write access to other apps
    and you have an undiagnosed memory leak. The views in the DDMS perspective allow
    you to watch processor and memory utilization, which might be as important as
    debugging your app as stepping through code in the Debug perspective.


    # Debugging with Dev Tools


    The last tool in your developer''s debugging tool kit is the Dev Tools app, which
    is part of the Android SDK and installed by default in the emulator. The Dev Tools
    app displays diagnostic information overlaid onto your app as you run it. launch
    the emulator and select Apps > Dev Tools > Development Settings.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_356_0.png)


