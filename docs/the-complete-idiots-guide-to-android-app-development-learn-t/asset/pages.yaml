  md: "# Chapter 16: Threads and the Background 291\n\nThread management in Android\
    \ begins with the Thread class. A thread can be instantiated from the Thread class,\
    \ in which case you provide a Runnable object that can execute your task. You\
    \ can also create a new class that extends Thread, in which you need to override\
    \ the run() method. Both are initiated by calling the start() method.\n\nThe whole\
    \ scope of thread management is encompassed in these classes:\n\n+   * Thread.\
    \ A unit of execution. Each thread has a priority, which can be set by calling\
    \ setPriority().\n\n+   * MessageQueue. Holds the list of messages dispatched,\
    \ normally managed by the Handler.\n\n+   * Handler. A mechanism for sending Messages\
    \ and processing Runnables. Each Handler is tied to a single Thread and a single\
    \ MessageQueue.\n\n+   * Runnable. A command to be executed on a Thread.\n\n+\
