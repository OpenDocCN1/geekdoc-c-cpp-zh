  md: '# Chapter 4: Finding More Activities


    DEFINITION


    **Refactoring** is the process of improving source without changing its expected
    behavior. Reasons to refactor can include improving readability, decreasing complexity,
    or improving maintainability of code.


    Here''s how we will refactor our recipe program:


    +   1. In Package Explorer, click `RecipesActivity.java`.

    2. Select `Refactor` > `Rename`.

    3. Enter `MainMenu` as the new name (see Figure 4.2) and click `Finish`.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_68_0.png)


    Figure 4.2: Renaming a section of your program, which is called “refactoring.”


    +   4. Eclipse has now updated all uses of the name, except in the Android Manifest.
    See Figure 4.3.


    If you run the app now, you will find that it behaves exactly as it did before.
    Only you, the designer, will ever know that you successfully refactored your app.'
