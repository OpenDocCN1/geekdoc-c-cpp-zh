  md: '# Sensor Data


    Sensors do not have to wait on external receivers to communicate data. They process
    information much faster, because the data is immediately available. Therefore,
    sensors can more quickly return much more information than location providers.
    Different Android devices process sensor data differently, so it is important
    to test your app as many different devices as possible.


    TheSensorChanged method receives a SensorEvent object. Like a Location object,
    the SensorEvent contains all of the information you need to work with the data
    including properties for accuracy, time, the sensor itself, and the data values.


    The values property is an array of floating point values. The contents and their
    meaning by sensor type. You can assume that the array positions will always be
    the same, but be sure to review the SensorEvent class at the Android developer
    site with new release of the Android SDK.


    +   * TYPE_ACCELEROMETER. Values measure the acceleration applied to the phone
    minus the force of gravity.

    * values[0]: Acceleration Gx on the x-axis

    * values[1]: Acceleration minus Gy on the y-axis

    * values[2]: Acceleration minus Gz on the z-axis


    +   * TYPE_MAGNETIC_FIELD. Values measure the ambient magnetic field on the x,
    y, and z axes.


    +   * TYPE_LIGHT. Single value, values[0], represents the ambient light level.


    +   * TYPE_PROXIMITY. Single value, values[0] representing distance in meters.
    Some devices report only a binary value for "near" or "far."


    # GOOGLE IT


    The OpenIntent group provides an Android sensor test utility which mimics Various
    Android sensors using the computer''s mouse. Their SensorSimulator project is
    hosted at http://code.google.com/p/openintent/wiki/SensorSimulator.


    Google did not attempt to implement any sensor simulation in the Android emulator,
    you will not be able to test any of your sensor code without third-party software
    tools or a physical device. The available software tools can certainly eliminate
    computational bugs in your code, but you will not be able to escape buying at
    least a few different Android devices to fully test a Sensor app.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_231_0.png)'
