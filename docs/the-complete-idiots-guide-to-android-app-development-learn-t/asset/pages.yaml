    needs to save the recipe when the Save button is clicked. Second, you need to
    implement a List Recipes screen to navigate stored recipes.


    Before beginning to design the interfaces, you need to decide how to store this
    data. Ironically, Android has not implemented a reliable way to work with XML
    files generated by individual apps. This is unfortunate, as XML is an ideal way
    to work with data sets. Given this limitation, it quickly becomes a parsing nightmare
    to read and write data from individual files on the filesystem.


    You learn how to use Structured Query Language (SQL) to solve this problem in
    Chapter 17, but for now SharedPreferences meets the need. SharedPreferences, limited
