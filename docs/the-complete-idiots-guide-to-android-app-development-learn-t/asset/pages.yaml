  md: '# Behind the Scenes


    The user interface of your app is entirely defined by Activities and Views, which
    you might think of as the front end of the app. Consisting mostly of static resources
    including XML, Activities and Views do not do very much. Fortunately, parallel
    classes exist to serve the back end.


    # Intents


    Although some pseudo-procedural code can be implemented through XML, most Android
    actions require Intents. In Chapter 4, you implemented an Intent class to launch
    the About screen. Without intents, your activities have no way to translate into
    intents. With an intent, you can connect clicking a button with some action, like
    starting a new activity.


    > The Intent class describes a kind of operation to perform. Intents can start
    an Activity, communicate to a BroadcastReceiver, start a Service, or interact
    with a Service.


    When a user touches the About button in Simply Recipes, they probably do not care
    how the screen appears or what activities or intents might be. The user just cares
    about the result. Similarly, Android activities have an apathetic attitude toward
    intents. Intents are designed to decouple the interface from the operations being
    performed.


    Intents are most frequently used to launch activities. To function, an intent
    needs some information:


    +   - **Action.** Some action to perform, usually a constant such as ACTION_VIEW,
    ACTION_EDIT, or ACTION_MAIN.

    - **Data.** Some data to operate on, such as a contact. This must be expressed
    as a Uniform Resource Identifier, or URL.

    - **Category.** Gives additional information about the action to execute.

    - **Type.** Specifies an explicit MIME type for the intent data. Type is inferred
    from the data itself unless this attribute is set.'
