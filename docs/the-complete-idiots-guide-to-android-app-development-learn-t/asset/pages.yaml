  md: '# Chapter 5: Programming for Android 79


    # The Java Virtual Machine


    Java’s capability to run the same code on many, vastly different operating systems
    is made possible by the Java Virtual Machine (JVM). You may have already noticed
    Eclipse is a Java application running in a JVM.


    > DEFINITION


    The Java Virtual Machine (JVM) is an application written for a specific platform,
    which translates platform-neutral Java code into that the OS can run.


    Oracle JVMs for most operating systems, including Windows, Mac, and Linux. In
    order for the Java you write in Eclipse to run on Android, it must run in a virtual
    machine (VM). Android implements the Dalvik VM, which shares many similarities
    to Oracle’s JVMs. Most notably, the code you write for Android will always run,
    because all versions of Android implement the Dalvik VM.


    As the Dalvik VM is not the same as Oracle’s JVM, there are a number of differences.
    Some code will not work with Android. Key factors to consider:


    +   - Performance. Dalvik was designed for mobile devices, optimized for devices
    with little memory. Apps that assume the availability of significant memory or
    processing power may not perform well.


    +   - Shared code. Android allows you to incorporate any third-party Java code
    that is compatible with Dalvik. However, just because the Java code you found
    successfully under Eclipse does not mean that it was written with Android devices
    in mind.


    +   - Java version. Android OS updates are frequent, but so are updates to Java.
    Not all features of the latest Oracle JVM or changes to Java APIs will work with
    Android.


    > DEFINITION


    Many programming languages will provide an Application Programming Interface (API).
    An API is a guide to writing code in a language. The API provides public exposure
    to available elements of a language.


    All Android apps run in their own instance of a Dalvik VM. This allows Android
    to sandbox apps, a security and stability consideration for the OS. Because each
    app run'
