  md: "# Chapter 15: A Touch of Locale 273\n\nRemember that getLastNonConfigurationInstance()\
    \ will return an object only if the Activity has restarted due to a configuration\
    \ change. In all other cases, it will be null.\n\n# Manually Manage Configuration\
    \ Changes\n\nIf your app does not need to change content for different configurations\
    \ and if you have decided that Android’s default behavior too greatly impacts\
    \ your app’s performance, then you can opt to manage these changes on when. This\
