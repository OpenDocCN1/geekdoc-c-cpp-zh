  md: '# Integrate Maps


    If you collect location data, what do you want to do with a user''s latitude and
    longitude coordinates? Some developers like to write their own code to use these
    values in unique ways for their apps. The rest of us probably want something very
    simple: the location on a map.


    To do this, you can instance a browser in your app and let the web apps for Google
    Maps, Bing Maps, or MapQuest do the work of rendering the page. Google provides
    a simpler way that requires some additional tools and registration, but will make
    mapping-much easier.


    # Register for Google Maps Access


    Unlike the Android source code, the Google Maps source code is not open. The data
    and the APIs are free for anyone to use, but they require a separate license agreement
    between you as a developer and Google. This requires two steps. First, generate
    a certificate to sign your app, and second, request an API key from Google with
    the certificate.


    # GOOGLE IT


    The complete licensing agreement and requirements for working with the Google
    Maps API are hosted at http://code.google.com/android/add-ons/google-apis/maps-api-signup.html.


    Additionally, you need to install the Google APIs add-on in the Android SDK Manager.
    See Figure 12.2.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_232_0.png)


    Figure 12.2: Adding the Google APIs from the Android SDK Manager.'
