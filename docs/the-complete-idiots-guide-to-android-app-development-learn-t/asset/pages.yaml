  md: '# The Methods of the Activity Life Cycle (continued)


    | Lifetime | Method | Description | Killable? | Followed By |

    |---|---|---|---|---||

    | Foreground | onPause() | Called before another activity is resumed. Ideal time
    to store unsaved changes. | Yes | onResume() or onStop() |

    | Visible | onDestroy() | Called when a new activity is started, an existing activity
    is resumed, or if the active activity is being destroyed. | Yes | onRestart()
    or onDestroy |

    | Entire | onDestroy() | The last method call your activity receives. If Android
    is terminating your activity, the isFinishing method will return false. | Yes
    | Nothing |


    onPause() is called, the activity is front and center; however, as soon as onPause()
    is called, Android reserves the right to terminate your activity. The Dalvik VM
    will attempt to optimize each instance of every app for best performance, sometimes
    Android simply runs out of resources and needs to select apps to kill. This means
    that onPause() is your last chance to preserve your user''s information before
    going into the background. onPause is also a great time to release any resources
    your app does not require for background operation.


