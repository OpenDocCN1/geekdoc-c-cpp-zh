  md: '# ANDROID DOES


    In 2009, Google released the Native Development Kit (NDK) for Android developers,
    enabling development in C and C++. Other tools exist that allow cross compilation
    from C++ to Java for Android.


    Java is an object oriented language designed to be simple, robust, and familiar.
    Java has a simpler object model than C++, but uses much of its structure and syntax.
    Java makes Java an easy transition from other languages. Android implements Java
    in a way that makes it even more simple and streamlined.


    # Object Oriented Programming Review


    While developing for Android is straightforward in many ways, it does require
    a basic understanding of the core terminology. Please review some of the following
    terms:


    +   **Class.** A blueprint or template for creating new objects. Apple, as a class,
    would define the characteristics of all apples.


    +   **Object.** An instance of a class. Apple, as an object, would be the individual
    apple in your shopping cart.


    +   **Subclass.** A class that inherits definitional information from a parent
    class and adds additional information. McIntosh apples share the characteristics
    of all apples, distinguishing features.


    +   **Method.** A function that the class can perform. Methods require parameters
    and can return data of a certain type.


    +   **Property.** A variable. Equivalent to a method, except that it does not
    require parameters.


    +   **Inheritance.** The transfer of definitional data from a parent to a child
    class. Inheritance creates a hierarchical or cascading relationship from parent
    to children.


    In your progress as an Android developer, you will encounter many other terms—polymorphism,
    abstraction, and decoupling—among others. For the purpose of this guide, the previous
    list should meet your needs.'
