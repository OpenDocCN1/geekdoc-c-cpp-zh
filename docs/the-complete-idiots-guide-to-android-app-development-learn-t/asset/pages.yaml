  md: '# Chapter 19: Comprehensive Debugging 337


    In this case, it is useful to generate your own log data, which is also output
    to the LogCat view (see Figure 19.2), using the Log class. Logs are nearly like
    toasts to yourself; they are visible only to developers running the app from a
    debug perspective. The Log class is quite simple with one real function—to output
    messages.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_350_0.png)


    Figure 19.2: The LogCat view.


    Each of these log methods is overloaded. The first takes two String parameters:
    a tag and a message. The second takes the tag and message parameters with an additional
    Throwable, which can be used in try..catch blocks.


    Here are some logs that will send error messages:


    +   * Log.e(). Logs Error messages.

    * Log.w(). Logs Warning messages.

    * Log.i(). Logs Information messages.

    * Log.d(). Logs Debug messages.

    * Log.v(). Logs Verbose messages.

    * Log.wtf(). Logs What a Terrible Failure messages or conditions that should never
    happen.


    Add log output to your app is straightforward. Add the import:

    import android.util.Log;


    The first parameter of a log message is the tag, which provides the context for
    the class where the log is generated. This should be a constant within each class.

    private static final String TAG = "This Class";


    You request log output wherever you anticipate points of failure. Frequently,
    this is the first line inside a method:


    ```

    private void showFireworks(int fireworkId) {

