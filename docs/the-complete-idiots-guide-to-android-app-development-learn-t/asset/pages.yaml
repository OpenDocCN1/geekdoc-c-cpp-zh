    # Using Notifications


    As a general rule, people generally prefer the least intrusive interruptions necessary
    to alert them of some news. While running and shouting into a co-worker''s office
    may be appropriate on the day of Christmas bonuses, it probably is not needed
    to ask a question about that last TPS.


    The same rules apply on mobile devices. Although toast alerts are extremely useful
    during development and for testing and debugging, they are the social equivalent
    of yelling, “Fire!” in a movie theater. Only use them in your Market app when
    you really need to.


    For a more elegant and nonintrusive method of prompting your users, “Pardon me,
    I have something that requires your attention ... at your convenience”, Android
    offers the notification layer. Any Activity or Service can submit a Notification
    to the Notification Manager, which places the alert in the user''s status bar.


    # ANDROID DOES


    The Status Bar, located at the top of the Android screen, contains a list of all
    notifications, from missed calls to text messages. These notifications consist
    of a message pertaining to what happened, and an Intent that is fired when the
    user touches the notification.


    Services are best equipped to handle notifications, as they can be running while
    the foreground Activity is not in the foreground. To guarantee that your app and
    your users receive notifications, implement them in your app’s services.


    Submitting a notification follows these steps:


    +   1. Obtain a reference to the Notification Manager, a system service.

    2. Instance a Notification, with an icon to display in the status bar, a text
    to display, and the time of the notification.'
