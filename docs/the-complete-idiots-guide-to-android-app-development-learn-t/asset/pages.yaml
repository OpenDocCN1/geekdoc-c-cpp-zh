  md: '# An Open Invitation


    # In This Chapter


    +   * What you need to get started

    * Android features and limitations

    * The Android Software Development Kit (SDK)


    As a software developer, I spend a lot of time with other developers brainstorming
    application ideas. Imagine a laser tag application that runs on your mobile phone,
    uses GPS coordinates to locate you and all of your friends, then layers their
    profile pictures over a street view map of your area. Using a digital compass
    and accelerometers, you can play virtual laser tag all over your home town. Neither
    the software existed years ago when I first imagined this type of app, but Google''s
    Android OS has changed many of our perceptions about what is possible.


    Your imagination is nearly the only limit to what types of apps you can develop.
    Android is now the cutting edge for mobile app developers, on phones, tablets,
    and connected TVs. As a developer, I could not be more excited about the opportunities
    Android has to offer. If you feel the same way, I will be here to assist you with
    the process of developing your apps through publication to the Android Market.
    Before diving in, there are a few things to prepare in advance.


    # Starting from Scratch


    While we are probably holding back a flood of great app ideas that you want to
    start translating into fully baked Android applications, there are a few things
    to observe before proceeding.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Software


    There are very few hardware limitations to developing for Android, and you can
    use any modern operating system. In fact, as long as you can install and run Eclipse,
    you have met the core requirement to develop for Android. Additional tools are
    required, but they are free and easy to acquire. If you purchased your computer
    within the last five years, at the time of this writing, you are more than likely
    equipped with everything you need. If your computer is older, try Eclipse anyway;
    you may be in luck or might need to add only memory to your system.


    > DEFINITION

    Eclipse is the preferred Integrated Development Environment (IDE) for Android
    development. An IDE is a toolkit for writing, debugging, compiling, and deploying
    applications.


    Furthermore, you do not even need to own an actual Android phone. The Android
    Software Development Kit (SDK) comes with a device emulator that enables you to
    run your apps against different versions of the Android Operating System (OS).
    As you mature as a mobile developer, you will want to begin testing and deploying
    apps on physical hardware; but you can get started with Android right now.


    > DEFINITION

    The Android SDK is a collection of tools that integrate into your development
    environment enabling you to develop applications for any device (phone, tablet,
    or notebook) which runs the Android OS.


    # Programming Experience


    While it is difficult to pinpoint exactly which skills a developer needs to succeed
    with Android, you should be familiar with the following concepts and languages:


    +   - General programming knowledge. You do not need a Ph.D. in software engineering
    to start, but you should be comfortable with concepts such as "functions," "variables,"
    "conditional logic," and "references."

    - Some familiarity with C, C++, or Java. Android apps must be compiled in Java,
    but experience with any of these languages will make your transition smooth.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '• A basic understanding of Object Oriented Programming (OOP). You should grasp
    concepts as “classes,” “interfaces,” “methods,” and “objects.”

    Chapter 5 covers some of these concepts if you need to refresh your memory.


    # ANDROID DOES


    Check the resources in Appendix B to find some fantastic sites that can supplement
    your Android programming skill set.


    Do not despair if you feel your skills are out dated or if you don’t have experience
    with any of these requirements. Throughout the book, as you encounter complex
    and difficult topics, secondary resources are provided to expand upon the depth
    of the subject matter.


    # Selecting Your Development Environment


    Unlike other mobile operating systems, Android OS is based on Linux, which means
    the OS is open source and free to distribute and modify. Google’s vision for the
    future includes Android running not just on mobile phones, but in your car and
    on your TV.


    # DEFINITION


    Linux is a versatile, robust, and free operating system that is used to power
    a wide range of devices, from computers to TiVos and now mobile phones.


    To ensure that the app you write today works on present and future Android devices,
    Google wisely choose Java to be the standard platform for native code. It frees
    you, the developer, to choose any development platform that can load the Java
    Runtime Environment and the Java SDK. Selecting your development environment is
    as simple as choosing the computer you like most, probably the one you already
    own.


    While it is true that practically any modern computer and operating system will
    meet your development needs, it is not possible in this text to walk through the
    subtle differences in the Android SDK on all possible systems. Therefore, for
    the purpose of this book, we will use screenshots of the various tools taken from
    a Microsoft Windows system.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'If you are a Mac or Linux user, fret not! The images on your screens will be
    nearly identical, and the links provided to download the tools also contain more
    detailed guidelines specific to your systems. To reduce confusion, this guide
    also assumes that you are familiar with the basics of installing applications
    on the systems of your choice.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_19_0.png)


    # GOOGLE IT


    All of the software tools needed to develop Android are documented on Google''s
    own help pages. If you get stuck, Google it!


    # Varieties of Devices


    Android powers over 40 different devices, each with different hardware features.
    With so many differences and choices, what makes an Android device, well, an Android
    device? Most devices share the following features:


    +   * Multi-Touch Screen

    * Internet

    * Gmail, Contacts, Calendar

    * Multimedia Support

    * Sensors and Accelerometer

    * Compass

    * Location Awareness

    * Camera

    * Bluetooth

    * 2D/3D Graphics

    * Microphone'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# PITFALL


    Not every device has all of these features, and some devices have more. For example,
    the HTC EVO has dual-facing cameras, whereas the Motorola Droid X has only one.
    You should anticipate users running your app with and without specific hardware
    components.


    Think of all the applications for these features! With multimedia support and
    Internet connectivity, you get apps like Pandora and Last.fm. With location awareness
    and a camera, you get Google Goggles, an app that will identify and even translate
    the text on anything you take a picture of. Sophisticated apps abound in the Android
    Market, providing turn-by-turn directions, real-time Twitter and Facebook feeds,
    advanced voice recognition services, and casual and advanced games. Your creativity
    is the only boundary for developing Android applications.


    # Selecting a Platform


    If you have developed an application for any other platform, you will be familiar
    with the tension between the following desires: you want to use the latest and
    greatest features of the platform, but you also want your app to work on as many
    different devices as possible. Why do companies like Google force us to make these
    difficult decisions? The simple answer is, no one is perfect. For example, Google
    did not anticipate all of the ways developers would use multitasking as a feature
    when it was released, and changes to the Android SDK have required breaking functionality
    in order to repair and improve it.


    As a developer, this means you must invest some time and energy researching the
    current market. Ask yourself these questions:


    +   - Do I need to fully support every version of Android?

    - What are the most popular versions of the Android OS?

    - How many Android OS versions do I need to support to succeed?


    # ANDROID DOES


    When you begin testing your application, the Android SDK will allow you to compile
    your app against any or all versions of the OS, so you will always be able to
    test against specific Android releases.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Device Restrictions


    Think more about the differences between what you might consider traditional programming,
    either desktop apps or web applications for desktop browsers. Modern computers
    come standard with larger and larger displays and faster, more powerful processors.
    Mobile devices improve constantly, but mobile development requires thinking about
    maximizing less powerful hardware inside smaller spaces.


    The first Android device, the T-Mobile G1, had a 3.2-inch screen with a resolution
    of 320 x 480 pixels. The HTC EVO, one of the larger mobile phone screens, has
    a 4.3-inch screen with 800 x 480 pixels. From small to large, this is not a huge
    amount of screen real estate to construct your app.


    These types of constraints should inform and drive your creativity. Unlike a desktop,
    which is more likely to always have Internet connectivity, a mobile device traveling
    through buildings, tunnels, across the country where Internet connectivity is
    probably intermittent. Even our laptops now come standard with hundreds of gigabytes
    of memory, mobile phones still expand only to 32 or 64 gigabytes. Begin to think
    about these limitations as opportunities to innovate.


    Beyond these physical restraints, what other restrictions does Android impose
    on its developers? Following is a list:


    +   **True multitasking has a cost.** Your app can run background threads and
    even services, which run when the app has closed; but Android maintains a list
    of priority functions. If your background thread or process takes too long to
    complete or begins to consume too much memory, Android kills it.


    +   **Input Frustrations.** The Android devices that implement hardware keyboards,
    the keyboards are often small and more difficult to use. Multi-touch support,
    although generally great for the latest versions of Android hardware, is not always
    well implemented on older devices.


    +   **Living in a sandbox.** All Android apps run as self-contained units with
    no access to other applications. The Android SDK provides a means of communication,
    but it requires implementation that other developers may not have done.


    +   **Varied screen real estate.** The screens on Android mobile phones are small,
    tablets are larger, and TVs are huge. When you develop an Android app, you must
    consider the screen size variations.'
  merge: -1
