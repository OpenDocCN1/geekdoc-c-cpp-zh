    android:debuggable="true">

    ```


    You now have the ability to run your app in Debug mode. The cheapest time to catch
    errors is during development, you should run your app in debuggable mode at least
    once to work with your app like a user might, just to observe the LogCat and surface
    any obvious errors that you might have overlooked.


    To run your app in Debug mode, select your project in Eclipse and then select
    Run > Debug As > Android Application.


    # The Debug Perspective


    With your debuggable app running, switch to the Eclipse Debug Perspective from
    the menu by selecting Window > Open Perspective > Other > Debug. Running your
    app in debug mode differs from your app directly on the Emulator or device in
    a few ways.


    First, the debugger is attached to your running code. This enables Eclipse to
    detect errors as they happen and break. This enables you to inspect the running
    state of your app right as a particular block of code is being executed.


    Eclipse allows you to configure how and when the debugger will interrupt code
    execution from the menu Window > Preferences > Java > Debug.


    Second, running in debug mode allows you to control code execution by setting
    breakpoints. Whenever the debugger breaks on a line, you have to option to step
    through the code. Set a breakpoint in your code by right-clicking the line number
    of the code and selecting Toggle Breakpoint.


    # DEFINITION


    The debugger is said to break when it halts code execution. The debugger will
    break on errors or on breakpoints defined by you. In the case of breakpoints,
    the break occurs before the line at the breakpoint is executed.


    A step is a movement from the current break in execution to the next line to execute,
    which can be a single line or whole blocks of code. Stepping instructs the debugger
    to execute only the code within the next step before breaking execution again.'
