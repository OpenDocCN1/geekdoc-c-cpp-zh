  md: '# Reintroducing the Recipe App


    In Chapter 2, you created your first Android app with a default activity, RecipeActivity,
    which was really just a slight modification of Hello World. While well and good,
    Hello World does not thrill the eye or offer much in the way of user experience.
    Programming is often compared to cooking, and recipes are a great way to think
    about learning to program. Following the guidelines that others have set forth,
    you will create a Recipe app to sharpen your skills.


    You already know that Android apps are coded in the Java language, but what might
    not know is that most of Android design does not need to be written in Java at
    all. Rather, much of your work is done in XML. You can, of course, choose to write
    procedural code in Java to render every element of your design; and this would
    build, install, and run acceptably.


    # ANDROID DOES


    Eclipse offers two ways to view layouts: in XML or as prerender of the layout
    as it will appear on Android. This allows you to quickly view changes to your
    layout without deploying the entire app to the emulator.


    Google has opted another, easier path: write as much as possible in simple XML.
    XML is less likely to change between versions of the OS, it is easy to read and
    modify, and when built, it is compressed and optimized for the target Android
    device.


    # Laying Out the Welcome Screen


    In Eclipse, open (or create) the BasicRecipes project from Chapter 2. Also take
    the time to open your Android Emulator, RecipesAVD. This allows you to quickly
    see the changes you make to your app as you write your code. The emulator consumes
    few resources and can stay open as long as you are in Eclipse. If you run your
    app now, you will see the familiar, “Hello World, RecipesActivity!


    Activities are responsible for displaying the user experience. If you explore
    the RecipesActivity.java, you should see:


    ```

    BasicRecipes/src/com.recipesapp.basic/RecipeActivity.java

    package com.recipesapp.basic;

    import android.os.Bundle;

    ```'
