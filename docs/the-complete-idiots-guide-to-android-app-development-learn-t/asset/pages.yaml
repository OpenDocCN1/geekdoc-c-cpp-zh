  md: 'Notice that supplying a telephone number to ACTION_VIEW launches the phone
    app, while supplying a contact opens opens the contact app. in the absence of
    more data, such as a category, Android will make a best guess for which activity
    to launch based on the kind of data supplied.


    # Intent Filters


    While most of your intents will be wired into your activities used to move back
    and forth the different screens of your app, there is another way to use intents.
    If an activity must be called by an intent, what launches the default activity
    of your app when you open it? The intent filter in your AndroidManifest.xml:


    ```

    <activity android:label="@string/app_name" android:name=".MainMenu" />

    <intent-filter>

    <action android:name="android.intent.action.MAIN" />

    <category android:name="android.intent.category.LAUNCHER" />

    </intent-filter>

    ```


    The action android.intent.action.MAIN.MainMenu is the default activity, and android.intent.category.LAUNCHER
    instructs the activity to open by default. As the name suggests, intent filters
    are used to limit the number of matching implicit intent actions that your activity''s
    intents might use.


    ```

    <intent-filter>

    <action android:name="android.intent.action.VIEW" />

    <category android:name="android.intent.category.BROWSEABLE" />

    <category android:name="android.intent.category.DEFAULT" />

    </intent-filter>

    ```


    This intent filter when applied to an activity VIEW actions should only query
    the PackageManager for tasks that fit into the BROWSABLE and DEFAULT categories.


    You can also allow your activity to be accessible to implicit events called from
    other apps by adding the ALTERNATIVE and SELECTED_ALTERNATIVE categories to an
    intent filter:


    ```

    <category android:name="android.intent.category.ALTERNATIVE" />

    <category android:name="android.intent.category.SELECTED_ALTERNATIVE" />

    ```'
