    # # Linkify


    As if this process was not too enough, Android provides a helper class aptly Linkify,
    which instantly converts all of the content of any view into hyperlinks that call
    an Intent.ACTION_VIEW with the correct URI.


    ```

    TextView textURL = (TextView) findViewById(R.id.textURL);

    textURL.setText(("http://www.google.com" );

    Linkify.addLinks( textURL , Linkify.ALL );

    ```


    Linkify has one primary method, addLinks(), which can transform the text of any
    View into actionable links. You can define your own regular expressions to convert
    text into links customized for your app. Linkify supports the following types
    of links as constants:


    +   * ALL. Suggests that all matching patterns can be converted to links.


    +   * EMAIL_ADDRESSES. Converts only e-mail addresses matching format: name@text.tld.
    Links will open the default mail app.


    +   * MAP_ADDRESSES. Converts only matching street addresses. Links will open
    the Google Maps app at the matching address.'
