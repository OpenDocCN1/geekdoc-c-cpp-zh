    You would within an Activity.


    # # The Service Life Cycle


    Just as with Activities, you first declare a Service in the AndroidManifest.xml
    using

    the <service> tag. A Service begins its life cycle either by being started or
    bound.

    Calling startService() launches the Service for immediate execution, while calling

    bindService() creates the Service for longer connection periods.


    The Service life cycle is similar to the Activity life cycle, which you explored
    in

    Chapter 5, but far more straightforward. The entire life cycle occurs between

    onCreate() and onDestroy(). The active life cycle occurs after startActivity()
    if the Service

    is started, or between onBind() and onUnBind() if the Service is bound. There
    is no

    onStop() event; the Service passes messages immediately to


    If you intend for your Service to be both started and bindable, both life cycles
    can

    our, and you should plan your code accordingly. If the system is running low on

    memory, Android will evaluate your Services for termination based on the status
    of

    the corresponding foreground process as well as against the priority of any pro-

    cesses that have bound to the Service.


    # # Building a Basic Service


    The thought of building a Service seems intimidating, probably conjuring discom-

    forming images of black box behavior. In Android development, they are very similar

    to building Activities. You can visualize the steps as follows:


