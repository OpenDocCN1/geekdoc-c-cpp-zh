  md: '# About the Author


    Christopher Froehlich is a software engineer at ChemSW, Inc., a technology company
    in Fairfield, California, where he develops enterprise class, mobile Android and
    iPhone applications for chemical inventory and lifecycle systems.


    Christopher has been professionally developing software for over 10 years, beginning
    with the U.S. Army in 2000, where he developed Signals Intelligence platforms
    to manage mobile communications. During his Army career, he also wrote The Complete
    Idiot''s Guide to Learning Russian.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# # Make your Android™ app dream a reality!


    The Android™ operating system is the largest mobile platform in the United States,
    and the number of applications for it is skyrocketing. You have your own great
    idea for an app, but you''re not sure how to get it from the idea stage to the
    actual app stage.


    You''ve come to the right place! Packed with step-by-step tutorials, this helpful
    guide gives everything you need to know to design, develop, test, and publish
    your own mobile applications for the Android™ OS. In this, you:


    +   - Simple steps for assembling your toolkit and configuring your development
    environment.


    +   - Easy-to-follow lessons for building a friendly user interface and working
    with animations, search features, and more.


    +   - Advice on making the most of cameras, GPS, and other features found on the
    numerous devices running on the Android™ platform.


    +   - Ideas for souping up your app by adding language options, enabling multitasking
    features, and streamlining data storage with SQL.


    +   - Instructions for testing, debugging, and finalizing your app and getting
    it into the Android™ market.


    Christopher Froehlich is a professional software developer who has written applications
    for Internet service providers, biotech firms, the United States Army, Proctor
    and Gamble, and the U.S. Food and Drug Administration. He is also a seasoned smartphone
    developer for such platforms as the iPhone®, Windows Mobile®, and Android®.


