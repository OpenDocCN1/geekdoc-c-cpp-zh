- img_proc: true
  md: '# Configuration Changes That Trigger a Restart


    | Change | Usual Cause |

    | --- | --- |

    | locale | The user has changed the system language. |

    | keyboard | The type of keyboard has changed, if the user has connected a Bluetooth
    or external keyboard. |

    | keyboardHidden | The user has extended or retracted the hardware keyboard. |

    | orientation | The user has rotated the device. |

    | screenLayout | The user has changed the screen layout, perhaps by connecting
    another display. |

    | fontScale | The user has changed the global font size. |

    | uiMode | The user has plugged the device into a dock or day/night mode has changed.
    |


    For new developers, this behavior may be unexpected or even shocking, but it is
    really the most efficient way to ensure that the proper layout and resources are
    available to your app for the current orientation of the device. It does mean
    that you need to be aware of this behavior and plan your Activity life cycle accordingly.


    For example, if your Activity begins by fetching a collection of the user''s videos
    from a site like YouTube, this expensive operation would occur every time the
    user turned the device side-to-side—hardly a desirable behavior. As a developer,
    you have two options:


    +   - Store persistent data as an Object, which you save before onDestroy() and
    restore this data in onCreate() or onStart().

    - Override Android''s configuration change management and handle these changes
    within your app.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_284_0.png)


    > PITFALL

    In most cases, it is more efficient and stable to allow Android to respond to
    configuration changes on its own. You should choose to override this only if truly
    necessary.'
  merge: -1
