  md: "# Part 2: Constructing Your Application\n\nWhile the TextView handles its own\
    \ scrolling, it is sometimes useful to nest ViewGroups between each other to maintain\
    \ a certain aesthetic. In this case, the desire is to have a title always visible\
    \ at the top of the screen and button widgets visible at the bottom.\n\nA ScrollView\
    \ enables this by designating a static location for scrollable content. ScrollViews\
    \ can have only one child ViewGroup. Most frequently, this is a LayoutView, but\
    \ can be as easily as a TableView or RelativeView. These child layouts are free\
    \ to have as many children as necessary.\n\nWith much flexibility Android offers,\
    \ you can achieve the same effects by using different attributes of the layouts.\
    \ One of the standard ViewGroups, TableLayout, renders its child content in rows\
    \ and columns. In this case, the use of a TableLayout is purely one of preference,\
    \ but it does have some unique attributes worth:\n\n+   * StretchColumns. Specifies\
    \ a column to stretch to available space in layout_width. \"* stretches all columns\
    \ equally.\n\n+   * ShrinkColumns. Specifies a column, \"*\" for all, to shrink.\n\
    \n+   * CollapseColumns. Specifies a column, \"*\" for all, to collapse.\n\nIn\
    \ order for a TableLayout to interpret rows, it requires a TableRow subclass.\
    \ TableRows produce horizontal rows of columns, where each child object inherits\
    \ a new column. All controls can define the XML attribute layout_column to identify\
    \ the column for stretching or shrinking.\n\nUsing these elements, the new recipe\
    \ layout resource, res/layout/recipe_tab_new.xml can be defined as:\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res\"\
