  md: '3. Define an optional language override with the android:voiceLanguage attribute.
    Voice search uses the system default language unless this attribute is defined,
    which is useful for developers of multilingual apps.


    ```

    android:voiceLanguage="en"

    ```


    Once android:voiceSearchMode is defined, a microphone icon displays next to the
    search icon in the Quick Search Box. That is it—you have successfully enabled
    voice search in your app.


    # More Search Options


    Android supports two key features in the scope of search-recent search queries
    and custom search suggestions, which you may consider implementing in the future.
    Each requires a better storage solution, such as a database, which you learn about
    in Chapter 17 and a ContentProvider, which is discussed in Chapter 18.


    Android attempts to optimize the performance of the Quick Search Box by predicting
    your search terms by saving the search terms you execute, saving the suggestions
    you click instead of executing the search, and providing custom search suggestions
    from each app in the system that has enabled custom search.


    You can leverage these techniques to improve the quality of a user''s search experience
    within your own app.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_180_0.png)


    # GOOGLE IT


    The Android Developer site provides in-depth guides for implementing advanced
    search behaviors at http://developer.android.com/guide/topics/search/index.html.


    integrated search functionality can dramatically improve the usefulness of your
    app to your users. Of course, you do not have access to Google''s search algorithms,
    so you must write your own queries and provide your own results. This will take
    patience and practice to perfect.'
