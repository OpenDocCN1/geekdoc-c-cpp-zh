    As discussed in Chapter 2, the Dalvik Debug Monitor Server (DDMS) perspective
    is designed to provide you direct access to more Android OS resources, and its
    views provide more specific kinds of information. The views are:


    +   - The Devices View provides a list of all processes running on the Android
    OS, grouped by device—in case you have multiple Emulators or devices connected
    and running at the same time.

    - Threads View can be populated by selecting a process from the Devices View and
    clicking Update Threads. This lists all of the threads in the selected process
    with their statuses and running times.

    - The Allocation Tracker View can be populated by selecting a process from the
