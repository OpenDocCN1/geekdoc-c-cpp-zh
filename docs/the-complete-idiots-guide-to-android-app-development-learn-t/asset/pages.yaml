  md: "Communication with a database occurs through Structured Query Language (SQL).\
    \ Android provides a helper class and methods, allowing you to interact with the\
    \ SQLite database without using SQL. However, it is important to understand that\
    \ these convenience functions simply convert the code into SQL, which is passed\
    \ to the database.\n\n# DEFINITION\n\nSQL is the most widely used language for\
    \ communicating with databases, and it is used to query, insert, update, and delete\
    \ data. SQL also has the power to change the structure of the database, columns,\
    \ and permissions.\n\nYou need to understand some of the syntax of SQL both to\
    \ make the most of the convenience functions and to be able to write your own\
    \ SQL for communicating directly with the database. The simplest structure in\
    \ a database is a table. As you develop a specification for your database structure,\
    \ you will likely need several.\n\nLet's create a table with a list of recipes\
    \ and their corresponding types of cuisines:\n\n# Basic Table in SQLite\n\n| id\
    \ (integer primary key) | recipe_name (text) | cuisine (text) |\n| --- | --- |\
    \ --- |\n| 1 | Artichoke Hearts | Mediterranean |\n| 2 | French Fries | American\
    \ |\n| 3 | Jambalaya | Cajun |\n| 4 | Apple Pie | American |\n\nCreating and modifying\
    \ tables typically happens only when your app is first installed or when you release\
    \ updates. You will use these SQL commands less frequently, but they are important;\
    \ your tables cannot exist without them.\n\nTo create the previous table, issue\
    \ a create table statement:\n\n```\ncreate table recipes (\n  id integer primary\
    \ key autoincrement,\n  recipe_name text,\n  cuisine );\n```"
