  md: '# Formatting for All Displays


    You can specify resource folders for many more display conditions than just portrait
    and landscape. By creating new resource folders and layout files, you can customize
    layouts by language, time of day, and screen size. Some of the common qualifiers
    include the following.


    # Resource Folder Naming Conventions


    | Condition | Values | Description |

    | --- | --- | --- |

    | Language and region | en, fr, es | Localize your content by region. |

    | Screen size | small, normal, large | Screen size by pixel density (QVGA, HVGA,
    WVGA, and so on) and aspect ratio. |

    | Screen aspect | long, notlong | The aspect ratio of the screen, where long is
    wider. This is separate from screen orientation. |

    | Screen orientation | port, land | Portrait or landscape. |

    | Dock mode | car, desk | If docked, whether to a computer or a car. |

    | Night mode | night, nighttime | Daytime or not. |

    | Screen pixel density (dpi) | ldpi, mdpi, hdpi,dpi | Low, medium, high, or any
    pixel density. |

    | Touchscreen | notouch, stylus, finger | The touch capability of the display.
    |

    | Keyboard availability | keysexposed, keyssoff | Whether the device has a hardware
    or software keyboard. |

    | Navigation key availability | navexposed, hidden | Whether navigational keys
    are accessible. |

    | System Version (API Level) | v7, v8 | The supported Android OS (v7 matched Android
    2.1, v8 Android 2.2). |


    These conditional qualifiers allow you to be quite specific in defining how you
    want your app to look and feel based on a wide variety of conditions. Qualifiers
    must be used in the order they are listed in this table. For example, /res/en-land-night
    would specify resources for English speaking users in landscape mode at night,
    while /res/land-en would be invalid—language must come before orientation.'
  merge: -1
