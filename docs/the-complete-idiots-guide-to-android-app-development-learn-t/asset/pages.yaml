  md: '# 94 Part 2: Constructing Your Application


    The purpose of a splash screen is to render some simple text or images for a few
    seconds before opening the main application. Functionally, the splash screen is
    no different than any other screen in your Android app. It is unique only in the
    way you design it inside the app. You can just easily use the About screen as
    a splash screen, but it would lack some visual appeal.


    Because you are creating just another Activity, you probably already have a sense
    for how the basic strategy looks:


    +   * Add a new Splash Activity to AndroidManifest.xml.

    * Create a new Splash Activity class.

    * Create a new Splash XML resource file for both the layout and layout-folder.


    After you have finished these steps using the BasicRecipes project in Eclipse,
    you can get started. Soon you will add new customized resources for colors, dimensions,
    and animations.


    # Assemble the View


    As your Activities become more sophisticated, it becomes useful to start sketching
    the View hierarchy of your screen. Like writing an outline, this can help you
    visualize the work ahead and serve as a reference when you start troubleshooting.


    This Activity is relatively straightforward: a single LinearLayout with two TextViews
    and an ImageView. Thinking further ahead, you can imagine what animation effects
    you want to apply to the elements in this ViewGroup. It is sketched out in Figure
    6.1.'
