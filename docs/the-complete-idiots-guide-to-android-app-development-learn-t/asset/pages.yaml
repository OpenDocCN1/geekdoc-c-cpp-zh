  md: '# # App Markets and Beyond

    Chapter 21


    # In This Chapter


    +   * Selecting an app storefront

    * Preparing your app for the Android Market

    * Final checklists

    * Signing and submitting your app


    The days of walking into a store and browsing through boxed software packages
    on shelves are all but gone. Most computer software can be bought and downloaded
    in the same transaction. In the case of Android, even updates to the operating
    system are wireless-pushed to devices, requiring nothing but an Internet connection.

    All of the apps available to install on Android devices are available only through
    markets, which you can shop in a browser or through dedicated market apps. This
    chapter introduces the Android Market, the largest Android app store, some alternative
    marketplaces, and the steps for submitting your app to market for download.


    # Available Android Markets


    Of all the Android app markets, Google''s own Android Market is the oldest, largest,
    and most popular with over 100,000 apps available for download. Unlike the iPhone
    and iPad with their single iOS App Store, Google allows anyone to create their
    own storefronts and marketplaces for apps.


    While you will likely want to focus on the Android Market first, you should familiarize
    yourself with some of the alternative stores.'
