    ![](img/34fc7a4f84390d8018593d3039bbc7ef_184_0.png)


    Figure 10.2: The time setting option that appears when the TimePickerDialog is
    called.


    +   * ProgressDialog. A dialog that displays a progress status bar. See Figure
    10.3.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_184_1.png)


    Figure 10.3: The loading screen that appears when ProgressDialog is called.


    # Constructing a Dialog


    Dialogs are always created from the context of an Activity, but they are not members
    of the Activity. Communication between the dialog and the Activity is enabled
    through callback methods. The dialog life cycle flows through a series of methods
    and callbacks:


    +   * showDialog(). Called to begin displaying a dialog.

    * onCreateDialog(). Callback in response to showDialog(). This method is called
    only the first time the dialog is displayed.

    * onPrepareDialog(). Callback in response to showDialog(), which executes before
    the dialog is rendered. This method is called every time the dialog is displayed.'
