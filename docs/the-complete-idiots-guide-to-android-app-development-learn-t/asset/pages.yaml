    You can think of the Bluetooth connections created by an Android device as network
    connections. These networks typically include only two members: the Android device
    and something else, but this is really a network connection, treated much the
    same as any other wireless network.


    # DEFINITION


    Bluetooth is a wireless communication standard that allows data communication
    with any other Bluetooth-enabled device within range. Range is typically between
    between 30 and 75 feet.


    As always, you will need permission to work with Bluetooth on Android. Two permissions
    exist:


    +   **BLETOOTH**. Grants permission to use/perform any Bluetooth communication.


    +   **BLETOOTH_ADMIN**. Grants permission to discover devices and enable/disable
    the service. The advanced admin functions should not be used unless you are designing
    a Bluetooth management app.


    Android has implemented Bluetooth through a series of classes, each of which you
    need to implement.


    +   **BluetoothClass**. Provides a read-only set of properties that describe the
    generic capabilities of the device. This is not specific to Bluetooth hardware,
    but it is useful as a guideline.


    +   **BluetoothAdapter**. Provides access to the Bluetooth radio. Allows discovery
    of other Bluetooth devices, querying paired devices, instancing a BluetoothDevice,
    and creating a BluetoothSocket to communicate with other devices.


    +   **BluetoothDevice**. Represents a remote Bluetooth device. Uses BluetoothSocket
    to connect with a remote device or to find information about the remote device.


    +   **BluetoothSocket**. Allows communication between Bluetooth devices via InputStream
    and OutputStream.'
