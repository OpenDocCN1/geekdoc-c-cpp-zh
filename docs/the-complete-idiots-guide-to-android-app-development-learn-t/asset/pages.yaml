  md: '# Part 2: Constructing Your Application


    A search request opens an instance of the search dialog. In order to maintain
    a consistent look and feel across each device, Android manages the entire life
    cycle of the search dialog with the Search Manager class. You need only create
    the appropriate resources, and Android will create the dialog, execute the search,
    and return any selection, if applicable, back to your app. See Figure 9.1.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_171_0.png)


    Once you have enabled search within your app, you will be able to provide some
    of features to your users:


    +   * Allow search of all your app''s content

    * Enable voice search

    * Use recent searches to provide search recommendations

    * Use data from your app to offer search suggestions

    * Provide your apps search suggestions to the global search dialog'
