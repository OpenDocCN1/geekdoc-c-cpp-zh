  md: '# Part 2: Constructing Your Application


    With file system access, you can read and write any valid data to and from disk.
    Unfortunately, internal storage space is limited. Many Android devices ship with
    just 8 gigabytes of free space. Your user may have filled this with songs and
    photos before your app ever got a chance to write a file.


    # External Data


    External storage is a standard Android feature. Most devices include SD card slots
    that expand the available storage space by many gigabytes. Accessing this space
    comes with some conditions.


    +   * The user can remove the SD card or extra storage at any time. Android provides
    no security mechanism to protect data that is not yet written to disk.

    * Files stored on external storage are directly visible to all other apps and
    the

    * If a user deletes or uninstalls your app, the only files that Android preserves
    are on external storage.


    The same methods apply to working with files on external resources, but you first
    need to know what directories to use. As of Android 2.2, the getExternalFilesDir()
    method will instruct you. This method takes a type, such as:


    +   * DIRECTORY_MUSIC. The standard folder for music.

    * DIRECTORY_DOWNLOADS. The default download folder.

    * DIRECTORY_PICTURES. Directory for photos.

    * null. If no type is supplied, the root directory is returned.


    > ANDROID DOES

    To keep Media Scanner from indexing your external files, create an empty file
    named "nomedia" in your external files directory. This will keep your files out
    of apps like Music or Gallery.


