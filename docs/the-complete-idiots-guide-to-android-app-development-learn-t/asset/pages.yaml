  md: '# Chapter 9


    # Search for It


    # In This Chapter


    +   - Introduction to the Quick Search Box

    - Making your app searchable

    - Process the search results

    - Implement voice search


    When you first think of Google, you probably think “search.” The two words are
    used almost interchangeably, so much that users of other search engines such as
    Bing and Yahoo! will refer to “searching” as “googling.” It should then come as
    no surprise that search is integral to the Android experience. In addition to
    the required physical buttons for Home, Menu, and Back, search is standard on
    most devices.


    But how does search really affect the Android experience? This chapter explores
    how search in Android works, what content is included, and how to extend search
    capabilities into your own app.


    # Search Basics


    Android provided an integrated search experience via the Quick Search Box, a search
    dialog called when users request a search action. With Search, users can find
    content on their device or from the Internet. A search for “Doe” could return
    Android contacts with the name, a musical app, and Internet results relating to
    deer.


    Increasingly, users expect to be able to search all of the content on their devices.
    Adding search capability is an important step in the process of developing a well-rounded
    app.'
