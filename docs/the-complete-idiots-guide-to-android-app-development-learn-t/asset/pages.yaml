    >20dp</item>\n    <item name=\"android:textStyle\">bold</item>\n  </style>\n</resources>\n\
    ```\n\nTo implement this, you will only need to insert the style into a view:\n\
    \n```\n<TextView\n  android:id=\"@id/welcome_title\"\n  style=\"@style/MainStyle\"\
