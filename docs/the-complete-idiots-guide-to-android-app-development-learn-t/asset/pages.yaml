  md: '# Chapter 3: Crafting the Layout


    # # Your Icon


    Icons identify your app in menus and on the home screen. While it may be difficult
    to perfectly craft the right icon for your app, it is easy to implement once you
    have a design. Android classifies icons in three categories:


    | Type | Low density (ldpi) | Medium density (mdpi) | High density (hdpi) |

    | Launcher/Menu | 36x36 px | 48x48 px | 72x72 px |

    | Status Bar | 24x24 px | 32x32 px | 48x48 px |


    Expanding /res in Package Explorer will reveal three default folders: drawable-hdpi,
    drawable-mdpi, Each contains a single file, icon.png. To create your own, unique
    app icon, you need only replace this icon image file with an icon of your own
    for each pixel resolution.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_60_0.png)


    # GOOGLE IT


    The Android developer site includes extensive guidelines for designing icons,
    including a comprehensive icon template package which is free to use. Numerous
    developer resources online provide free images and templates for your reuse.


    Icons for the recipe project in this text were taken from Androidicons.com, which
    you are free to use in implementing your own app icons. After downloading or creating
    three versions of your app icon for low, medium, and high density display, you
    can drag them into the respective resource folders. Follow these steps:


    +   1. Open your file explorer.

    2. Click and drag the 36 × 36 px icon into /res/drawable-ldpi.

    3. Elect to copy the file into the project, as shown in Figure 3.7.

    4. Click and drag the 48 × 48 px icon into /res/drawable-mdpi.

    5. Click and drag the 72 × 72 px icon into /res/drawable-hdpi.

    6. Check to make sure your folder tree looks like Figure 3.8.'
