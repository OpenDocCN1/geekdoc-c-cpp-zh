- img_proc: true
  md: '# DEFINITION


    A **widget** is a predefined and customizable element of the user interface, like
    a button or text box.


    A **dialog** is a pop-up window that takes focus from an activity. Dialogs handle
    all input while they are active and have their own life cycle.


    You can think of dialogs as a response to user action. If you have implemented
    a “Delete All” button, you might respond to the `onClick()` method with a dialog
    asking “Are You Sure You Want to Delete All Records?” with “Yes” and “No” buttons.


    Dialogs can be used in this way to verify that a user really intends to click
    a particular control. Dialogs also provide a way to focus away from your current
    activity in order to answer a specific question. Dialogs are customizable, but
    Android supports the following preconfigured dialog types:


    +   **Dialog.** The base class for all types of dialogs. Presents a configurable
    message box.

    **UIAlert.** The most common dialog type. Displays a message with zero to three
    buttons, a spinner, check boxes, or radio controls.

    **DatePickerDialog.** A dialog that displays a DatePicker widget for selecting
    a date. See Figure 10.1.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_183_0.png)


    **Figure 10.1:** The date setting option that appears when the DatePicker dialog
    is called.


    +   **TimePickerDialog.** A dialog that displays a TimePicker widget for selecting
    a time. See Figure 10.2.'
