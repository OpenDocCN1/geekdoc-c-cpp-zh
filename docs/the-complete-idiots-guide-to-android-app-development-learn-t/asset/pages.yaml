  md: "The two relevant methods on this class are MethodTracing(), which outputs a\
    \ trace file to the virtual SD card in the emulator, and stopMethodTracing().\
    \ These certainly should not run in the market version of your app, and trace\
    \ files provide more information than is necessary for ordinary logging.\n\nTo\
    \ keep them available and organized, add these convenient methods to your LogClass:\n\
    \n```\npublic static void startTrace(String tag, String fileName ) {\n    if (Log.isLoggable(tag,\
    \ Log.DEBUG)) {\n        Debug.startMethodTracing(fileName);\n    }\n}\npublic\
    \ static void stopTrace(String tag) {\n    if (Log.isLoggable(tag, Log.DEBUG))\
    \ {\n        Debug.stopMethodTracing();\n    }\n}\n```\n\n# PITFALL\n\n> Trace\
