    +   * Create a cryptographic, signing key (required).

    * Compile and sign your app (required).

    * Use your signing key to register for a Maps API Key (required only if your app
    uses Google Maps API).

    * Test your final app (highly recommended).


    # DEFINITION


    An End User License Agreement (EULA) defines an agreement between you, the developer,
    and users who must agree to the EULA in order to use your app. A EULA can protect
    you as a developer defining liability for misuse of your app or state licensing
    requirements for legal use of your app.


    This checklist should serve as your guide every time you release a new app or
    update to your app to Market.


    +   1. **Making the EULA decision.** By registering to download Market apps, users
    have already agreed to some basic terms that protect both the developer and you.
    Sometimes, you may want an extra layer of agreement protection. With each update
    to your app, consider whether you should add or remove a EULA.


    For example, some users have tried to use Google Maps because followed navigation
    directions off cliffs or into oncoming traffic. A EULA is a protection buffer
    against the unintended uses of your app.


    Google even offers a EULA class that you can download and implement from http://goo.gl/tUA.
    You implement this in an Activity that launches the first time you open your app.
    The user then agrees or disagrees with the EULA. If the user disagrees, the EULA
    Activity continues to open, preventing access to the rest of your app, until the
    user accepts the agreement.

    2. **Deciding whether to license your app.** Licensing is a mechanism to determine
    whether your app is authorized to run on a user''s device at any given time. Google
    provides a free licensing service, that you can investigate at http://developer.android.com/guide/publishing/licensing.html.

    3. **Name and Version your app.** Every Android Market app must have a unique
    package name defined in the manifest. This matches the name of your project''s
    Java package by default. Once submitted, this name cannot be changed, so choose
    wisely.'
