  md: '# Chapter 2: Building for Android


    By this point, Eclipse has already built your project, and you can actually run
    the app. Eclipse and most other development environments offer two ways to run
    compiled code: run and debug. Run, as you might expect, simply executes the code
    exactly as written and it succeeds or fails depending on what you have written.


    Debug, on the other hand, runs the code anticipating errors and traps these errors
    for you. Debugging enables you to pinpoint the exact point of failure in your
    app, and it is often your first line of defense when troubleshooting problems
    with your code.


    Whether debugging or not, Android apps need a target device to actually run. This
    can be either your physical Android powered phone, tablet, or TV, or this can
    be an emulated Android environment.


