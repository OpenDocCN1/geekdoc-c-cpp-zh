  md: 'From here, you can select the Debug App you wish to profile and define the
    infor- mantion you want included on screen as you run your app. Here are the options,
    as shown in Figure 19.5:


    +   * Wait for debugger. If selected, this stops the app you selected as the Debug
    App from launching until the debugger has fully attached. This allows you to debug
    your app from your very first method called.

    * Show screen updates. If selected, it flashes alternating pink and yellow colors
    to indicate that the screen is being drawn or redrawn.

    * Immediately destroy activities. If selected, Android calls onDestroy() for each
    activity as it stops. Setting this allows you to quickly test your logic to save
    and restore state information.

    * Show CPU usage. If selected, Android displays a CPU usage on screen.


    You can also run the Dev Tools app on a physical device by copying the Development.apk
    from the emulator''s /system/app/ directory and then installing the app to your
    device.


    # The Least You Need to Know


    +   * Use the Log class to output messages to the LogCat view in Eclipse.

    * Avoid sending log messages if your app is not running in debuggable mode by
    using smart helper methods.

    * The Debug perspective provides detailed contextual information about execution.

    * The DDMS perspective provides comprehensive data about process and resource
    utilization.

    * Use the Dev Tools app to get real-time system information while running your
    app.'
