    # Working with Calls


    If you need more control over these actions, you can intercept the native apps
    with your own code. You must declare one or more of these permissions in AndroidManifest.xml
    to use the necessary features:


    +   * **CALL_PHONE**. Grants permission to bypass native dialer and place outbound
    calls.

    * **CALL_PRIVILEGED**. Grants permission to make outgoing and emergency calls,
    like 911.

    * **PROCESS_OUTGOING_CALLS**. Grants permission to modify, monitor, or abort outgoing
    calls.

    * **READ_PHONE_STATE**. Grants read-only permission to the type, number, and state
    of the phone.


    Additionally, you must instruct the manifest to those activities that will implement
    the features by declaring intent filters.


    If we wanted to do an Activity Dialer, we could do the following:


    ```

    <activity

    android:name=".Dialer"

    ```


