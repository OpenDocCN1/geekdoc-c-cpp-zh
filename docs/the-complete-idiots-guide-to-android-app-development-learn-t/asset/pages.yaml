  md: '# Chapter 20: Testing Your Apps


    Here are ways you can have the best experience debugging your programs:


    +   - Follow the Android Developers Blog for updates and announcements.

    - If you find an API in the source code that is not documented in the SDK, do
    not use it. It is a private API.

    - Avoid overly complicated, deep-nested layouts with long hierarchies. Android''s
    next performance optimizations might not appreciate them.

    - Avoid all assumptions about hardware. Either require the hardware feature in
    the manifest or test for it.


    On the flip side, long array of "deprecated methods" is also a reason to be enthusiastic,
    with each new version of the OS, Android allows your existing code to still function
    while providing a gentle reminder that you need to update your references for
    the next version.


    # And More Tests


    Testing and debugging often go hand-in-hand. Users may report a problem using
    a particular combination of hardware and OS that you may need to test and debug.
    As rigorously as you test your app before releasing to market, you will not catch
    every potential issue.


    Android provides two additional tools to assist you with building and automating
    comprehensive tests. First, the UI/Application Exerciser Monkey is a command-line
    tool that tests your app by randomly generating user and system level events.
    The Monkey runs on your emulator or device, producing a quasi-random but repeatable
    stream of clicks, touches, and gestures to mimic user interaction as well as interrupting
    your app with selected system events.


    Second, Android provides a complete InstrumentationTestCase to assist testing
    and instrumentation by creating test projects using the JUnit test methodology.
    A constantly evolving open source project, JUnit is less structured than Monkey,
    but fans argue that it provides more freedom.'
