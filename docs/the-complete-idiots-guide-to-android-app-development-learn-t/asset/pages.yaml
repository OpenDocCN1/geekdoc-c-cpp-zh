  md: '# Chapter 18: ContentProviders 321


    Here is the data you need to include:


    +   - content:// The standard, required prefix. This distinguishes the URI from
    other prefixes like http://. For ContentProviders, this will always be context://.

    - authority. The provider name. Use short names for Android default providers,
    like contacts. All third-party applications should use the fully qualified class
    name in lowercase.


    ```

    context://com.recipes.basic.recipeprovider

    ```


    +   - Authority is declared in AndroidManifest.xml with the <provider> tag and
    the authorities attribute:


    ```

    <provider

    android:name="*.RecipeProvider"

    android:authorities="com.recipes.basic.recipeprovider">

    >

    </provider>

    ```


    +   - data_path. Identifies the kind of information requested, content://browser/bookmarks
    would specify that only bookmarks are included. This can include multiple segments,
    such as /recipe/cuisine and /recipe/category:


    ```

    context://com.recipes.basic.recipeprovider/recipe/cuisine

    ```


    +   - id. The unique identifier for a single record. This must correspond to a
    column named _ID in the data set. If absent, all records will return the following:


    ```

    context://com.recipes.basic.recipeprovider/1

    ```


    # PITFALL


    Not all ContentProviders are available without permission, which must be declared
    in the AndroidManifest.xml. In the case of Android core apps, these permissions
    are well documented in the SDK. In the case of other apps, you need to find the
    required permissions from the app developer''s documentation or call getPermissions()
    for the provider while testing and debugging your app.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_334_0.png)'
