    # Runtime Changes


    It is difficult to imagine computers without mice, so much as so few users even
    think about using computers without trackpads or mice. Similar expectations about
    standard smartphone functionality and behavior are converging now. Perhaps the
    simplest expectation of a smartphone is that it automatically transitions between
    landscape and portrait mode, and that this transition should happen as fast as
    possible.


    While Android handles transitions like this automatically, it does so by preempting
    the Activity life cycle—by calling onDestroy() and onCreate() in succession. Believe
    it or not, Android terminates and restarts your app every time a user changes
    the orientation. And not just for orientation changes. Any of the changes in the
    following table will instruct Android to take this action.'
  merge: -1
