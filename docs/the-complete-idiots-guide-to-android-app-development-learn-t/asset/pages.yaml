    \ and add some effects to it.\n\nUsing your existing /res/drawable/ resource,\
    \ you can add some tween effects. Animation resources live in the /res/anim folder.\
    \ Tween transitions include:\n\n+   * Takes an object from one level of transparency\
    \ to another. An alpha value of 1.0 indicates complete opacity, while a value\
    \ of 0.0 indicates complete transparency.\n* Scale. Changes the size of an object\
    \ on an X/Y scale. X/Y Scale values indicate the size offset where 1.0 indicates\
    \ no change.\n* Rotate. Moves an object vertically or horizontally.\n* Spins an\
    \ object from one angular position to another on a defined axis.\n* Set. A collection\
    \ of transition effects.\n\n> DEFINITION\\Tween animations are defined in XML\
    \ and describe transition effects to visually move objects from one state to another\
