- img_proc: true
  md: '# Part 4: Increasing Your Application Scope


    * DELETE. Deletes specified rows from a table. With a short code, “Spanish” is
    removed from the cuisine list.


    ```

    delete from recipes

    where cuisine=''Spanish'';

    ```


    SQLite’s use of SQL, unlike Java, is case-insensitive for the query structure.
    This means that “SELECT FROM” and “select” are treated identically. Text values
    stored in the database do have case sensitivity when using mathematical operators,
    like = or !=. Operators such as “like” will be case-insensitive.


    Your table is still empty, so let''s add some content to it.


    ```

    insert into recipes(_id, recipe_name, cuisine)

    values (null, ''Artichoke Hearts'', ''Mediterrian'');

    insert into recipes(_id, recipe_name, cuisine)

    values (null, ''French Fries'', ''American'');

    insert into recipes(_id, recipe_name, cuisine)

    values (null, ''Apple Pie'', ''American'');

    ```


    If you ran the following:


    ```

    select * from recipes where cuisine=''american'';

    ```


    You would see results, while executing the following:


    ```

    select * from recipes where cuisine like ''american'';

    ```


    This would return both “French Fries” and “Apple Pie”.


    Writing SQL is its own art form and requires study and practice. W3Schools and
    SQL.org provide excellent and free tutorials on working with SQL in depth.


    # Intro to SQLite


    Working with databases is like driving a car. Once you know how to drive, you
    can get behind the wheel of almost any car and how it works. Every car is different
    and has its own quirks, which means you have to spend a little time getting to
    know each other before you are comfortable.


    SQLite is a database designed to be lightweight and efficient. Compiled for Android,
    its total size is less than 250 KB, which makes it one of the smallest database
    server applications available. A SQLite database also encompasses just a single
    file, which makes the application fast, flexible, and easy to move.'
