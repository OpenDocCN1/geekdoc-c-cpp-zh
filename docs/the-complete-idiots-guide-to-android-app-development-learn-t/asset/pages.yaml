  md: '# SQL and Databases


    # Chapter 17


    # In This Chapter


    +   * Using SQLite in Android

    * Working with Structured Query Language

    * Creating and upgrading databases

    * Storing and finding information

    * Displaying database content in your app


    Whether you hope your next app will solve world problems or entertain young children,
    you will need to store, find, and update information that your users provide through
    using your app. Some of this content, like options and preferences, you can easily
    store and access through SharedPreferences, which you used to store basic content
    in Chapter 8.


    As your app scales, you will want to store more data, access it faster, and update
    it quickly. For this purpose, you need a true database to manage this information.
    This chapter introduces SQLite, a powerful, lightweight, and public domain database
    integrated directly into Android.


    # SQL at a Glance


    A conventional database is a collection of tables that are represented as rows
    and columns. Tables are often visualized as spreadsheets, but while spreadsheets
    are optimized for displaying and editing data in a user interface, databases are
    optimized for storing data and accessing it quickly.'
