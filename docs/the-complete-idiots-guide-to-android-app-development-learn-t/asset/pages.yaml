  md: '# 240 Part 3: Make the Most of the Hardware


    receive calls over nationwide wireless networks. These are the core communication
    features common to Android:


    +   - Wi-Fi. Wireless Internet access to local wireless access points and routers.

    - 3G/4G. Wireless Internet access to nationwide, digital data services.

    - LAN. Wired Internet access via an Ethernet port and cable (Google TV only, for
    now).

    - Bluetooth. Wireless serial and data access with other Bluetooth enabled devices,
    usually within a 30-to-75-foot range.

    - Voice Calls. Calling to and from any phone number.

    - Text Messaging (SMS). Short text message communication to and from phone numbers.

    - Multimedia Messaging (MMS). Short messages with attachments to and from phone
    numbers.


    Android provides APIs to interact with each of these service layers and features,
    which you can use to extend the functionalities of your app.


    # The Phone Itself


    As you consider the additional features you want to include in your app, you frequently
    have to decide how you want your app to do and what you are content to allow other
    apps and services to provide. In the case of calls and messaging, Android provides
    easy ways to pass requests to call or message contacts to native functions. If
    you want to control how Android handles these functions in more detail, it is
    possible to define your own procedures.


    Suppose your app includes a contact list with phone numbers that you want to allow
    the user to dial directly. If you remember from Chapter 5, you can associate an
    onClick(k) event with a static Intent:


    ```

    Intent i = new Intent(Intent.ACTION_CALL, Uri.parse("tel:5551234567\));

    ```


    ```

    startActivity( i );

    ```'
