    # Toast Feedback


    If you have ever filled out a long form on a website, you have probably entered
    a date or phone number in a format the site did not like. After reviewing a pop-up
    error message, you correct the formatting issue and move on. Android supports
    a similar kind of notification called a *toast*. For the Android, toast is a Widget
    class.


    > DEFINITION

    A **toast** is a View containing a message to the user.


    Toasts are very simple widgets, which require only a View to display and a length
    of time to run. A toast can take a View from an XML resource, or you can build
    a simple View in Java. A toast has only a few methods:


    +   * setContentView(). This gives the toast some view to display.'
