    The app you have built and tested in Eclipse requires a few finishing touches
    before it is ready to submit to the Market. Review these final elements to prepare
    your Market-ready app.


    +   - Add a EULA to your app (optional)

    - Add licensing support to your app (optional)

    - Add package and version identification (required).'
