  md: '# Google Services


    Google provides extensive resources to document their products as well as tools
    to assist developing on Google''s platforms.


    +   - Android Developer. The official site of the Android SDK, where you can download
    all the current tools, browse the APIs, and read references and tutorials for
    developing in Android. http://developer.android.com


    +   - Official Android Blog. The blog contains major announcements about new features,
    and changes to the Market and the SDK, but it also frequently provides in-depth
    guides to developing in Android. http://android-developers.blogspot.com


    +   - Google Code University. Google provides a repository of lectures, classes,
    and tutorials for a variety of programming languages, concepts, and Android-specific
    resources. http://code.google.com/edu/languages/index.html


    +   - App Inventor. A web based service allows you to create and design Android
    apps in the browser and then customize and configure them on your device. http://appinventor.googlelabs.com/about


    +   - Android Cloud to Device Messaging Framework. This service allows developers
    to push information from their servers to apps. For more information or to sign
    up for access, visit http://code.google.com/android/c2dm


    +   - Google TV. The next generation of Android devices will power the living
    room. Interested developers should visit the site to sign up for information and
    access to the necessary tools. http://www.google.com/tv/developers.html


    +   - Android Source Code. The complete source code for the Android operating
    system. http://source.android.com'
