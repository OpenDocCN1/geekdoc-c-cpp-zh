- img_proc: true
  md: '# Chapter 13: 3D Graphics and Animation 227


    View also requires a renderer. As the name suggests, the renderer draws or renders
    the objects.


    Second, you need a renderer that implements the GLSurfaceView.Render interface.
    This class requires three methods:


    +   - onSurfaceCreated(). Called when the OpenGL Surface is created. Set values
    which are least likely to change in this method.

    - onDrawFrame(). The actual drawing occurs in this method.

    - onSurfaceChanged(). The surface creation is the first change and will call this
    method once. Changes to the size of the Surface will call this method, most obviously
    rotating the device between portrait and landscape mode.


    These methods take a GL10 class object, which you can think of as the object or
    rendered. This class supports some key methods worth reviewing:


    +   - glEnable(). Enables rendering features. All except GL_DITHER and GL_MULTISAMPLE
    are off by default.

    - glDisable(). Disables rendering features.

    - glClearColor(). Sets the color of the clipping wall, or the furthest distance,
    beyond which all other items are invisible.

    - glClear(). Clears the current color settings to reveal color changes.

    - glClearDepth(). Sets the depth of the buffer.

    - glHint(). Performs some perspective calculations.


    The GL10 class supports many rendering settings, expressed as constants, which
    can be enabled by glEnable(). Some of these include:


    +   - GL_BLEND. Mixes new color values with the colors already in the buffer.

    - GL_DITHER. Increases the number of perceived colors by juxtaposing contrasting
    colors.

    - GL_LIGHTING. Enables light and darkness calculations.

    - GL_MULTISAMPLE. Performs antialiasing (smoothing) on the edges of polygons,
    improving perceived image quality.

    - GL_POINT_SMOOTH. Performs antialiasing on points.'
