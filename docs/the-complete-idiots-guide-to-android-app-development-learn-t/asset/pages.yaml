  md: '# # Location-Based Services


    # Chapter 12


    # In This Chapter


    +   - Accessing the device''s location context

    - Work with system service listeners

    - Listening to Android''s sensors

    - Using Google Maps


    Location awareness has become perhaps one of the more subtle paradigm shifts in
    consumer technology. As almost every new mobile device includes GPS, Wi-Fi location
    fetching, and communication tower triangulation, services from Google Latitude,
    Foursquare, and Facebook Places allow users to instantly check-in, showing their
    location and the location of their friends.


    MapQuest and Google Maps provide free, turn-by-turn directions with voice navigation.
    With an Android device in hand, you can instantly know where you are, what direction
    you are moving, and where friends and family happen to be at the same time.


    Location services in Android allow you to add content to your app and its data.
    With location, you can adjust baking instructions for altitude or the closest
    grocery store to buy a missing ingredient. This chapter introduces location receivers
    and sensors, allowing you to make your app aware of its surroundings.


    # # Introduction to Android Sensors and Receivers


    Many of the most powerful assets of an Android device are hidden inside the case,
    visible only from the code in your app. The display, buttons, and even the camera'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'visible hardware features, but much more waits beneath the surface waiting
    to be used.


    Most Android devices include a range of hardware features that fall into two categories:
    receivers and sensors. Receivers include:


    # DEFINITION


    Receivers process information from transmitting stations, such as antennas, towers,
    and satellites. In mobile devices this communication typically occurs over Radio
    Frequency (RF).


    Sensors return information collected from the device itself, such as touch input,
    rotation, and movement.


    +   - Wi-Fi radio. Connects to Wi-Fi Internet hotspots and receives location information
    from public Wi-Fi databases.


    +   - Carrier antenna. Sends and receives calls. Receives location information
    by tower triangulation.


    +   - GPS. The Global Positioning System (GPS) receiver returns location information
    collected from satellites.


    Sensors provide much more specific types of information about the current state
    and position of the device relative to its environment. Sensors include:


    +   - Proximity. Detects the distance between the device and another object. Frequently
    used to dim the display as it approaches the ear.


    +   - Light. Detects changes in light. Often used to brighten or darken the display
    in response to available light.


    +   - Front-facing camera. Can be used for facial recognition. Sometimes with
    location tracking of stolen devices.


    +   - Accelerometer. Tracks changes in the speed of the device’s movement. Can
    be used to assist a pedometer.


    +   - Compass. Calculates device’s orientation to north.


    +   - Gyroscope. Returns the device’s physical orientation by three axes.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 12: Location-Based Services 207


    +   - **Temperature**. Detects the temperature of the environment surrounding
    the device.


    +   - **Pressure**. Returns the current atmospheric pressure at the device''s
    location.


    Just as with the camera, the available hardware features vary by device and platform.
    Phones and tablets are likely to have GPS receivers, whereas Google TV devices
    are not. Generally, Android anticipates possible gaps in hardware and allows for
    software features to degrade gracefully.


    # ANDROID DOES


    In many cases, the Android SDK assumes that certain hardware features do not exist
    on a particular device. With a location information request, Android can attempt
    to try GPS first, Wi-Fi position next, tower triangulation, and Internet address
    location last. In this way, some information always returns if not the most accurate.


    Android provides access to all explicit sensor information from a particular hardware
    device and more generic data from the sensors and receivers on the actual device.
    Think about your target audience and optimize your code for the features you must
    have, leaving room for the users without these hardware features.


    # Location, Location


    The location context of an Android device contains significant information, far
    more than just the actual coordinates on a map. The quality of this information
    enables powerful apps to provide driving and walking directions around the world,
    but it requires responsibility.


    Privacy is always a huge concern for end users, so the first step to begin using
    location data is to request permission:


    ```

    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

    ```


    By accepting this, access is granted to both fine GPS location, which is very
    accurate, and coarse Wi-Fi and tower triangulation location, which is more broad
    and, therefore, a bit more private. For coarse location only, request:'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 208 Part 3: Make the Most of the Hardware


    ```

    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

    ```


    # PITFALL


    Just because users accept permission to share their location when they install
    your app does not mean that they want to share their location information. Respect
    your users'' privacy by clearly communicating within your app when you intend
    to use location services and what you intend to do with the data.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_221_0.png)


    Consider creating a special series of settings in your options menu to turn location
    services on and off. You can make this as granular as necessary, but as a general
    rule, options should be as concise as possible while still conveying the scope
    of the settings.


    # Location Services


    In Android, location requests are handled through the LocationManager class, which
    provides access to the system services managing location information. Working
    with this class, you can determine the current location of the device, request
    periodic updates of location, and send Intents when the device nears a particular
    location.


    Regardless of how you plan to use location information inside your app, the logical
    flow should follow these steps:


    +   1. In response to an event, begin collecting updates from location providers.
    Continue to receive updates to maintain.

    2. When necessary, stop requesting location updates.

    3. Do something with the collected location data.


    To get started, you would define a LocationListener to return callback information
    from a LocationManager instance. You can implement this as an Activity that implements
    the LocationListener class and renders the location latitude/longitude coordinates
    in a simple TextView.


    ```

    import android.app.Activity;

    import android.location.Criteria;

    import android.location.Location;

    import android.location.LocationListener;

    import android.location.LocationManager;

    ```'
