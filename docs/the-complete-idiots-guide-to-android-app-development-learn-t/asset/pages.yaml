  md: "# Introduction\n\nLearning to develop software is like learning to ride a bike:\
    \ you will not get very far unless you hop on and start pedaling. This book focuses\
    \ on development in much the same way. Each chapter will introduce new, core concepts\
    \ to Android and follow with code samples. I find I learn best by sitting down\
    \ and writing code. I encourage you to follow this book with your computer, writing\
    \ and testing code as you go. Please view this book more as a guide to follow\
    \ than a textbook to memorize.\n\nThe first two parts of the book will walk you\
    \ through developing and extending a single, core app. Each chapter in these parts\
    \ is designed to continue building on the one before. The final three parts compartmentalize\
    \ the topics, providing functional sample code that can be run independently.\
    \ All chapters are brief and designed to focus on the most important content in-depth\
    \ while providing contextual information for the whole topic.\n\nDeveloping Android\
    \ apps is an exciting space to occupy. New Android devices and features are developed\
    \ rapidly, providing you with new platforms and capabilities to implement your\
    \ ideas. You may or may not already be familiar with Java and the Eclipse development\
    \ environment, but you will enjoy meeting the new challenges that Android has\
    \ to offer. From the nuances of the development kit and Android's unique operating\
    \ system mechanics to publishing your app in the Market, you have a wealth of\
    \ fun opportunities to learn ahead of you.\n\n# Conventions Used in This Book\n\
    \nWhen you need to write code in Android, it takes one of two forms: XML or Java.\
    \ With XML, all code samples in this book have the following syntax:\n\n```\n\
    <xml version=\"1.0\" encoding=\"utf-8\"?>\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    >\n  <item\n    android:id=\"@id/main_menu_new\"\n    />\n</menu>\n```\n\nAll\
    \ Java code is formatted like this:\n\n```\npublic FabulousNewClass( String message\
    \ ) {\n  log.d( TAG, message );\n}\n```"
  merge: -1
