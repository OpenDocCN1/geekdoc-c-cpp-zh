    # More Widgets and Controls


    You have already worked with a variety of widgets, including controls like Buttons,
    EditTexts, and Spinners as well as elements like ListViews, LinearLayouts, and
    TabHosts. Android offers many more specialized widgets which provide unique control
    possibilities.


    You have already worked with DatePicker, which the DatePickerDialog implements
    for you inside the dialog box. You can implement this directly inside your Activity''s
    layout, although as you have seen from the size of the widget, it takes up quite
    a bit of space on screen.


    For this reason, some widgets are better implemented in dialogs, while others
    fit nicely on screen. Android sets no aesthetic restrictions on how you design
    your app, so experiment with each way. Some of the more detailed widgets include:


