  md: 'Finally, the debugger allows you to inspect the state of the app and the operating
    system. You can inspect threads, processes, resources, and variables as their
    value definitions change. Within the Debug Perspective a few views assist you
    in this process:


    +   - The Debug View enables you to view the currently executing threads; that
    includes controls for resuming code from a break and stepping. See Figure 19.3.

    - The Variables View enables you to inspect the properties defined within the
    class on the thread selected from the Debug View at any point of execution in
    the stack.

    - The Breakpoints view provides access to all of your defined breakpoints.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_353_0.png)


    Figure 19.3: The Debug View


    As you step through your code, you can follow the output of the LogCat view with
    the real-time state of your app.


    # Advanced Logging with Traceview


    In the course of debugging your app, you may want to import logging detail that
    you can analyze on your own, apart from share with other developers to get feedback
    or insight. Android provides a special Debug class, which produces a special trace.


    Trace logs contain execution information from your app, which can be loaded with
    the Trace utility to independently debug your app. To generate a trace, first
    import the Debug package in your LogClass:


    ```

    import android.os.Debug;

    ```'
