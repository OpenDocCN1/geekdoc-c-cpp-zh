  md: '# Chapter 12: Location-Based Services 213


    executing power-expensive operations, like requesting location updates, this has
    not only a cost for the processor and memory, but also the battery.


    Consider the following questions when you implement your location code:


    +   - How frequently does your app need location updates from providers? Do not
    poll more than this number.


    +   - Can you manage your own listening window around other logic in your app
    to reduce the frequency of updates?


    +   - How accurate do all updates need to be? Network updates are cheaper than
    GPS updates. Do not use GPS if you only need the nearest city.


    While it is important to consider battery life and to optimize your code to run
    more efficiently, sometimes you need to ensure that your information is accurate.
    All location receivers have margins of error. Weather, temperature, and time of
    day can affect the quality of your location data.


    Depending on the app, margin of error can mean the difference between geo-tagging
    a photo with the drop off of a waterfall or giving directions off a cliff. If
    you need to provide the user with data as accurate as possible, you need to collect
    and compare location data.


    Creating a Location Collection that includes all locations returned over a period
    of time. If you collect ten locations over two minutes, it should be straightforward
    to evaluate the accuracy of the locations as well as the consistency. A series
    of high-accuracy readings in a straight line should probably be favored over low-accuracy
    readings scattered about.


    # Emulator Limitations


    If you have a physical Android device, you can test your app''s location code
    by taking a walk down the street. GPS receivers are accurate up to 30 feet with
    a strong signal, and if you live in an urban area, there are likely to be plenty
    of recognized Wi-Fi hotspots and towers to triangulate your position. If you do
    not yet have an Android device, or even if you do, you will still want to be able
    to test your code for basic errors in the emulator.


    The emulator does not attempt to simulate receiver hardware, so it will not return
    meaningful information for speed, direction, and altitude. In fact, by default,'
  merge: -1
