  md: "# 2D Graphics Overview\n\nWhile any given scene in Android might look like\
    \ a fairly static document or image, the comments of the View for the current\
    \ Activity must be drawn on creation. Up to now, this depended on layout resources\
    \ to instruct the Activity on what content to place.\n\nView elements can also\
    \ be constructed in code. This makes it possible to create dynamic visual content.\
    \ With two-dimensional images, Android allows animation through one of two basic\
    \ paths: using an existing image, or drawable, or by drawing new graphics. Drawables\
    \ fit into three categories:\n\n+   - Bitmap Supported file types include PNG\
    \ (preferred), JPEG (acceptable), and GIF (discouraged).\n\n+   - Shape. A configurable\
    \ shape can be drawn based, such as an oval, circle, square, or rectangle.\n\n\
    +   - Nine Patch. A special type of PNG image that includes nine stretchable areas,\
    \ which allow Android to dynamically resize the image based on screen size. The\
    \ default button images are examples of NinePatchDrawables.\n\n# DEFINITION\n\n\
    A drawable is any resource which can be drawn or rendered as a graphic on the\
    \ screen. The Drawable class defines a few generic methods to interact with the\
    \ object being drawn.\n\n![](img/34fc7a4f84390d8018593d3039bbc7ef_119_0.png)\n\
    \nIn addition to tweening and the methods available on these types of drawables,\
    \ Android also supports one other way to animate images with frame animation.\
    \ Frame animation is implemented identically to tweening, but the animation resource\
    \ is defined differently:\n\n```\n<animation-list xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:oneshot=\"true\">\n    <item android:drawable=\"@drawable/boiling_pot1\"\
    \n        android:duration=\"100\" />\n    <item android:drawable=\"@drawable/boiling_pot2\"\
    \n        android:duration=\"100\" />\n    <item android:drawable=\"@drawable/boiling_pot3\"\
    \n        android:duration=\"100\" />\n</animation-list>\n```\n\nThis instructs\
    \ Android to load each image sequentially for the specified duration."
