    \nAt their core, apps are collections of activities. Much of the attention Android\
    \ gives\n its focuses on moving between activities and their states.\n\n# # Activities\n\
    \nActivities are actions within the app life cycle. Android manages every running\n\
    object object in an Activity stack. The Activity class defines a series of methods\n\
    instruct each Activity object how to behave in response to the basic user workflow,\n\
    which involves starting, switching, and resuming activities. This workflow applies\
    \ not\nonly to all the activities in your app, but to all activities in running\
    \ apps.\n\nLaunching the browser app starts a new activity. Android looks at the\
    \ top activity in\nt stack, perhaps from the home screen where you tapped the\
    \ app icon, and pauses\nit. And then places the browser app at the top of the\
    \ stack. An incoming call at\nthis point would pause the current browser activity\
    \ and place the call activity at\ntop of the stack. Once the call activity finishes,\
    \ Android removes it from the stack\nand resumes the browser activity.\n\nThe\
    \ life cycle of an activity can be considered in three phases:\n\n+   - **The\
    \ entire lifetime**. This period lasts from the call to onCreate()\nondDestroy().\n\
    \n+   - **The visible lifetime**. This begins at onStart() and persists until\
    \ onStop().\nDuring this time, the Activity can respond to user input, but it\
    \ may not be in\nt foreground, at the top of the Activity stack."
