  md: '# Chapter 17: SQL and Databases 307


    With the DBHelper class in place, it can be instantiated anywhere else in your
    application. Because the DBHelper constructor instances DBOpenHelper, you will
    have a valid database object to work with. DBHelper needs to be extended to open
    and close connections with the database and provide other convenience functions
    for the rest of your app.


    > > While the values for table name, column names, and version are hard-coded
    in this example, you will want to store these as in a lookup table in the database
    or elsewhere in your app’s metadata.


    # Database Interaction


    With the groundwork laid by SQLiteHelper, you can begin working with the SQLiteDatabase
    class to query and modify data. The SQLiteDatabase class abstracts most of the
    logistics of managing database connections and interpreting results. As such,
    it has a few nuances worth considering.


    +   - Query results are returned as a cursor, whether you write your own raw SQL
    with the rawQuery() method or use the convenience method.


    +   - Writing data to an SQLite database is slower than on other database platforms.


    +   - Because the SQLite database is a single file, it is important to use transactions
    when updating and inserting many records at a time. The beginTransaction(), setTransactionSuccessful(),
    endTransaction() methods will ensure your entire SQL tasks complete or fail, allowing
    you to try again. This prevents data inconsistencies.


    Like an array, a cursor contains an arbitrary number of objects, which can be
    iterated. Unlike an array, a cursor maintains a relationship with the query that
    generated it, enabling the cursor to request a requery of its results and other
    operations.'
