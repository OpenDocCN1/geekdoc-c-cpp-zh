  md: '# Android Developer Sites and Forums


    The following sites dedicated to Android not only provide access to your questions,
    but also keep you up-to-date with news, upcoming features, and devices that fuel
    your creativity.


    +   - Stack Overflow. One of the fastest growing question-and-answer sites on
    the Internet, it has become a core resource in every developer''s tool belt. To
    find Android specific questions, use the "android" tag. http://stackoverflow.com/questions/tagged/android

    - Android People. Follow Android news and provides tutorials, sample code, videos,
    and a forum. http://www.android.com

    - Hello Android. A popular Android developer site providing an app catalog, Android
    device information, and news. http://www.helloandroid.com

    - Android Academy. A site dedicated to Android devices and news, it also contains
    helpful tutorials and sample code. http://www.androidacademy.com


    # Tools


    The following tools will help new and experienced developers alike.


    +   - Eclipse. The preferred IDE for Android development. http://www.eclipse.org

    - Eclipse Tutorials. Guides for working with the Eclipse IDE. http://eclipsetutorial.sourceforge.net

    - Open Intent''s Sensor Simulator. Tool for simulating Android sensors using the
    emulator. http://code.google.com/p/openintents/wiki/SensorSimulator

    - 3D OpenGL Libraries for Android. Packages, APIs, and add-ons to work with complete
    3D engines. http://www.opengl.org/en/libraries

    - Google Translate API. A third party package that provides access to Google''s
    Translation servers from Java. http://code.google.com/p/google-api-translate-java

    - The Complete Idiot''s Guide to Android Development Source Code. The complete
    source code for this book. http://code.google.com/a/ecliselabs.org/p/cig-android-development'
