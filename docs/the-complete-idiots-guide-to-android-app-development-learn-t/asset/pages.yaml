  md: '# 166  Part 2: Constructing Your Application


    When a search is requested, the Activity from which the search was called receives
    the onPause() event. If the user cancels the search, the previous Activity is
    restored and onResume() occurs.


    # Voice Search


    One the holy grails of human and computer interaction has been the ability to
    communicate in natural, human language and through speech. Voice search on Android
    allows users to simply speak their query, and Android will automatically transcribe
    the speech and execute the search. Android began expanding voice search to include
    multiple languages in Android OS 2.1. Implementing voice search within your app
    is simple, but it has some limitations.


    +   - Support for non-English languages is still developing.

    - Users tend to phrase voice search queries differently. You should make your
    app respond to voice search naturally.

    - Voice search queries execute immediately when recording is complete.


    To add voice search to your app, modify the searchable.xml resource with the following-attributes.


    +   Set android:voiceSearchMode to“showSearchViewButton”. This also requires either
    the launchWebSearch or launchRecognizer flag. While launchWebSearch will direct
    the output of your app to the results of a web search, launchRecognizer will process
    the speech internally. The result will look like:


    ```

    android:voiceSearchMode="showVoiceSearchButton |

    launchRecognizer "

    ```


    +   Define the language model that voice search will support using the android:voiceLanguageModel
    attribute. This supports two possible values: free_form, which is better optimized
    for English, and web_search, which is better suited for other languages.


    ```

    android:voiceLanguageModel="free_form"

    ```'
