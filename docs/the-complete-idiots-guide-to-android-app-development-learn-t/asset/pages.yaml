    The first few chapters have focused heavily on working with Java and XML in Eclipse
    to create some basic but fundamental extensions to an app. The Simply Recipes
    app now renders a default Welcome screen with a menu, an About page, an options
    menu, and you applied styles and themes to customize the look and feel of the
