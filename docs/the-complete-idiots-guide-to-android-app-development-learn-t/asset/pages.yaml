  md: '# Chapter 3: Crafting the Layout 43


    For the purpose of defining size, Android supports these units of measure:


    # By Height and Width and Breadth


    | Unit | Name | Definition |

    |---|---|---|

    | dp | Density Independent Pixels | A unit relative to the pixel density of the
    screen. Sometimes referenced as dip. |

    | sp | Scale Independent Pixels | A relative unit like dip but scaled against
    individual users'' font size preferences. |

    | pt | Points | $\sqrt{72}$ of an inch. |

    | mm | Millimeter | Actual size as measured by a metric ruler. |

    | in | Inches | Actual size as measured by an Imperial ruler. |

    | px | Pixels | Number of pixels on display. |


    In normal development, it is preferable to use the relative sizes dp and wp to
    specify height and width as Android will scale these sizes in proportion to the
    actual device display. In this way, you can design your activities to render consistently
    on screens very small to quite large.


