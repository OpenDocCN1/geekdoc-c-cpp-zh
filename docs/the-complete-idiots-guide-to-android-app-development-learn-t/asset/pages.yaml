  md: '# Part 4: Increasing Your Application Scope


    +   3. Service processes. An active process. For example, the Service is started,

    is not tied to either foreground or visible processes but is still performing-desired
    functions for the user, such as playing music.


    +   4. Background processes. An inactive process. The Service is stopped, which

    is tied to an Activity that is not in the foreground or visible to the user. Many

    of these processes exist at any given time, and Android prioritizes them by

    requency of use. Terminating these processes usually has no visible effect for

    tuser.


    +   5. Empty processes. An inactive process primarily used to cache data and

    speed up an app''s start and resume.


    The actual ranking your process may requires some calculation. Android

    takes into account the dependencies between processes, rounding up in favor of
    your

    process in most cases.


    # Working with AsyncTask


    Writing apps for Android does not mean that every unique operation must complete

    in under 200 milliseconds or face the ANR Grim Reaper. Rather, think of it as
    an

    unspoken contract with your users; you agree not to leave them waiting on an unre-ponsive
    screen for more than a second or before updating them with some new

    information.


    Perhaps the next step in your app''s workflow involves uploading a picture to
    a social

    networking site. The next step might be to tag this picture with some information,

    and the upload may logically block this action. Because you have committed tonproviding
    your users visual feedback, you need to implement some kind of response

    within your app, such as a progress bar.


    In this case, you need to branch your activity''s logic into a separate thread.
    The main

    interface thread will display a progress dialog, and a separate background thread

    will perform the upload. The Android SDK has implemented the AsyncTask class to

    handle asynchronous tasks and this entire process for you automatically.


    > DEFINITION An asynchronous task executes on a background thread, separate from

    t main interface thread of an app. The asynchronous thread needs tonperiodically
    update the main thread with the results of its progress.'
