    You may have noticed the naming convention for the resources XML files in this
    chapter have all included "_tab". This provides an easy way to visually group
    the resource files in Package Explorer in Eclipse.


    Tabs in Android function by bridging activities together in a new Activity class
    that defines the individual activities as new tabs. Thus, the RecipeEntryAndIngredient
    classes are instantiated as new tabs in a tab Activity that extends TabActivity.


    Individual tabs are not defined in XML; rather, they are instantiated in the Activity
    itself. Tabs require the following elements:


    +   * TabHost. A container for the tabbed window view. This can be instantiated
    by defining:


    ```

    TabHost _tabHost = getTabHost();

    ```


    +   * TabSpec. A tab indicator with the content for the tab.


    ```

    TabHost.TabSpec = _tabSpec;

    ```


    Together, these objects can create tabbed content by calling the appropriate methods:

    _tabSpec.newTabSpec()

    setContent()

    _tabHost.addTab(_tabSpec);


    TabHost supports one important life cycle method, onTabChanged(). This method
    allows you to change the color and style of the currently selected and deselected
    tabs to provide a visual cue to the user on which tab is in focus.'
