  md: '# Chapter 17: SQL and Databases 303


    This creates an empty table with three columns. A core concept of relational data-bases
    is that each table has a primary key, which allows each record to be identified
    unambiguously, that recipes._id = 3 is Jambalaya. The name _id is chosen here
    because it has special meaning for Android, not because it matters to SQLite.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_316_0.png)


    # GOOGLE IT


    Unlike other databases, the field type you specify for your columns, as text,
    datetime, or numeric, are just guidelines. SQLite does not enforce these types
    and you can insert any value into any field—with the exception of autoincrement,
    which is special.


    With the autoline in place, you might later realize that you need more columns.
    You can add a created_date with the alter table statement:


    ```

    alter table recipes

    created_date datetime;

    ```


    If you ever need to delete a table, do so by issuing the drop table statement:


    ```

    drop table recipes;

    ```


    Most of your interaction with the database will take the form of queries or data
    manipulation. This is accomplished with four statements:


    +   * SELECT. Returns a result set of rows and columns based on a query. For instance,
    here is a short code that gives a result for “American” cuisine:


    ```

    select recipe_name

    from recipes

    where cuisine=''American'';

    ```


    +   * INSERT. Adds rows to a table. For instance, the code below adds a row with
    the values “French Fries” and “Spanish” (we will correct the cuisine conflict
    in a minute).


    ```

    insert into recipes( id, recipe_name, cuisine )

    values(null, ''French Fries'', ''Spanish'' );

    ```


    +   * UPDATE. Updates specified rows within a table. In this case, in the “French
    Fries” row, the cuisine is changed to “American”.


    ```

    update recipes

    set cuisine=''American''

    where recipe_name=''French Fries'';

    ```'
  merge: -1
