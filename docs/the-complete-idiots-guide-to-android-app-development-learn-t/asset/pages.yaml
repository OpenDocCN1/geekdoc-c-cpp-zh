  md: '# Application Fundamentals


    Before diving head first into design layouts, it is important to pause and consider
    how design fits into the app as a whole. There are a few classes in the Android
    SDK that are relevant to this question and worth quickly noting here. You will
    explore these again in greater depth later, but here is a brief introduction:


    # DEFINITION


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_45_0.png)


    A class is a Java concept that defines a blueprint for creating an object. The
    class describes the attributes and methods available about each instance of an
    object. In this way, a class defines the state and behavior of an object.


    +   **Activity class.** An activity is something a user can do, single, specific
    task. Activities usually require user interaction, so the Activity class automatically
    creates a window to render a user experience. The two most common methods associated
    with an activity are onCreate() when the user launches the activity, and onPause()
    when the user switches to another activity.

    **Intent class.** An intent is a description of an action or an operation to perform.
    It can be used to start an activity, start or communicate with a service, or to
    interact with a broadcast receiver. Almost all actions in Android depend on intents,
    from "Make a call" or "Search for a song" to "Launch my app.

    **Service class.** A service is an action or task that executes in the background,
    typically not visible by the user. Services allow long-running tasks to continue
    executing even if the activity is paused, or they can allow communication with
    other apps. Using the Google Maps app, you can get voice-activated turn-by-turn
    directions across the country. Fortunately, once started, the Maps service ensures
    directions will continue to speak even when you have switched apps.


    +   **Content Provider class.** A content provider is the best way to communicate
    information between applications. Google implemented content providers for most
    of the default apps: contacts, images, audio, and video. To read and write data
    into a user’s photo library, you must use the appropriate Content Provider and
    request permission, if necessary.


    These four classes form the cornerstones of your app development in Android. Most
    of your work in designing an app focuses on specific activities you create to
    display content to the user. Activities have their own life cycle which is represented
    in Figure 3.1.'
