  md: '# # Resources and Animation


    # ## In This Chapter


    +   * Creating a splash screen

    * Working with animation resources

    * Creating animation effects

    * Using drawables to render content


    If you have opened many apps on your mobile device, you might have noticed that
    some immediately open and others display an intermediate splash screen. Splash
    screens offer a chance to execute an initialization task in the background or
    to brand your app with a unique look and feel. They also happen to be a great
    way to begin working with images and two-dimensional animation.


    By this point, you are familiar with creating new Activity classes and Views,
    and adding and modifying resources. In this chapter, you add some incremental
    knowledge to your developer''s toolkit. This chapter introduces some new ways
    to use resources and animations, and you build a functional splash screen for
    Simply Recipes.


    # ## The Splash View


    Animation attracts. It is an easy way to add polish to your application and an
    effective way to communicate different kinds of information to your users. An
    animated progress bar indicates that some task runs but has not completed. Animations
    are great transitions, showing that one activity ended and another has started.'
