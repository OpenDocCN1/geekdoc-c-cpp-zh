  md: '# Part 4: Increasing Your Application Scope


    +   - buildQueryString(). Produces an SQL SELECT string for use as a query.

    - buildUnionQuery(). Produces a UNION query of one or more SELECT statements.


    There will also be times in the course of developing, testing, and debugging your
    app that you need more immediate access to the database. It would be extremely
    inefficient to have to write execute query() methods just to inspect your database.


    You have a variety of options for accessing the database from the emulator or
    your Android device and inspecting it directly. Here are two popular options:


    +   1. Using the Android Debug Bridge (ADB), which you learn about in Chapter
    19, you can connect directly to the database from a console connection and inspect
    commands.

    2. Using the DDMS perspective in Eclipse, you can copy the SQLite database to
    your local machine.

    - Install SQLite for your operating system from http://www.sqlite.org and inspect
    the downloaded database directly.

    - Install the SQLite Manager for Firefox, and inspect any SQLite database directly
    from the browser. http://sqlite-manager.googlecode.com.

    - Install an application like SQLite Browser, http://sqlitebrowser.sourceforge.net,
    and inspect the database from a desktop application.


    Beyond these free options, a vast array of commercial offerings are also available,
    though you will likely find all of the resources you need through the Android
    Developer site and Google.


    Apps large and small rely on databases to store and find information. Once you
    have implemented your database, you will find it increasingly easy to work with
    information. Having data stored in the database opens other opportunities for
    your application, such as sharing information between apps.'
