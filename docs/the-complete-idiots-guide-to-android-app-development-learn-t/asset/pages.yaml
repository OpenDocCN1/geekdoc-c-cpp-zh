  md: '# # Core Services

    Chapter 14


    # ## In This Chapter


    +   * Listening to the phone service

    * Managing network connections

    * Using Wi-Fi services

    * Connecting with Bluetooth


    Although many Android device owners think of their phones and tablets as portable
    computers—computers that also happen to make calls and send messages—communication
    capability is perhaps the most important feature of any mobile device. Whether
    by voice, text message, e-mail, or chat, communication is integral to the Android
    experience.


    All Android devices connect to a communication channel: Google TVs directly connect
    to the Internet, Android tablets connect to Wi-Fi and 3G networks, and Android
    phones connect to all of the previous. This chapter explores the last pieces of
    Android hardware that tie the devices together and connect them with each other.


    # ## Overview of Android Hardware


    Previous chapters have already explored the camera, sensors, and location hardware
    supported by Android. What remains is the hardware and software that enables an
    Android device to communicate with the outside world.


    All Android devices have some capability to connect to the Internet; most have
    near-range wireless support for peripherals and many have the capability to place
    and'
