  md: "# Polishing Your App\n\nYou now have many of the necessary tools to start building\
    \ content and functionality in your app. Granted, Simply Recipes does not yet\
    \ do very much, but you will start remedying that in Chapter 5. Before beginning\
    \ additional design work, you should familiarize yourself with two core Android\
    \ features: menus and settings.\n\n# Adding a Menu\n\nMenus provide quick access\
    \ to the most common functions of an app. In a desktop application, menus can\
    \ be long and expansive. In the mobile space, screen real estate is expensive\
    \ and menus should be simpler, shorter, and faster. Android offers two types of\
    \ menus:\n\n+   * **Context menus.** Accessed from a long-click, when you tap\
    \ and hold on screen. In the Phone app, tapping on a recently dialed number will\
    \ give you options to call the number or save it to the contact.\n* **Options\
    \ menus.** Accessed by clicking the menu button on the Android device. Notice\
    \ how this menu changes between the different tabs of the Phone app.\n\nThe Simple\
    \ Recipes app does not yet have any content to apply a context menu, so you will\
    \ create an options menu. Without reading ahead, try to visualize how to implement\
    \ this in the recipe app. The menu content will need to exist somewhere as XML\
    \ and an activity will need to call a method to load the method.\n\nCreate a new\
    \ Android XML document in Eclipse as resource type menu, in the res/menu/ folder,\
    \ with the following:\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<menu\
    \ xmlns:android=\"http://schemas.android.com/apk/res/android\">\n  <item\n   \
    \ android:id=\"@id/main_menu_new\"\n    android:title=\"@string/main_menu_new\"\
    \n    android:alphabeticShortcut=\"@string/main_menu_new\"\n    android:orderInCategory=\"\
    1\"\n    android:newshortcut=\" />\n  </item>\n</menu>\n```"
