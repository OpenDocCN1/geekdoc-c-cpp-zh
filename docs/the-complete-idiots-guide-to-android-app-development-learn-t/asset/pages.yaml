  md: '# Part 5: Taking Your App to Market


    All apps have a version name and number that are specified using the android:versionCode
    and android:versionName attributes of your <manifest> tag in the AndroidManifest.xml.
    The versionCode attribute is most critical. No two versions of your app can share
    the same versionCode, and each update to your app must have a higher versionCode
    than the one before.


    Version numbering is a matter of developer preference, as the numbers are only
    meaningful in how you define them. You might define a major new release of your
    app as 1.0, 2.0, and so on. These might occur every year. In between, you might
    have significant updates that add new features, which might be 1.1, 1.2, 2.1,
    and so on. Then you might need maintenance or bug fix updates, which might number
    1.0.1, 1.2.5, and so forth.


    Version numbering is entirely up to you, as long as the numbers continue upward
    in scale and do not repeat. The versionName, on the other hand, can be any description
    you like to describe the version, from “Version 1.0 (The Launch Release)” to “Minor
    bug fixes”.


    # Certification


    All Android apps must be signed with a digital encryption certificate before they
    can run on any Android device. You might pause and ask: how does my app run on
    my device and in the emulator? Google provides the ADT plugin for Eclipse a standard,
    public certificate, which is used to sign all of your projects when you run them
    locally.


    This public key does not work with devices that you do not use for Android development.
    In order to publish your app to Market, you need to create your own certificate
    and sign your app.


    In Eclipse, this process could not be easier. Following are the steps:


    +   - Right-click your project, and select Android Tools > Export Signed Application
    Package.

    - Enter a location for the keystore and a password. See Figure 21.1.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_373_0.png)


    > It is critical that you keep your keystore and your password safe and secure.
    You need to use the same key and password for every update to your app. Do not
    lose them!'
