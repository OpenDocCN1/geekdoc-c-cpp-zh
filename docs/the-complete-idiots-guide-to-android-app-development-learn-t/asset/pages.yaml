  md: '# Background Receivers


    While you will most frequently use intents to interact with activities, they do
    serve two other useful functions. They can broadcast events and work with services.
    BroadcastReceivers are a special kind of background task, dedicated to listening
    for event broadcasts and responding with an action.


    > DEFINITION


    BroadcastReceiver class members listen for broadcasts sent by intents and can
    send notifications, run intents, start services, or update the display. BroadcastReceivers
    are started when a matching intent broadcast is sent.


    Now to implement the following code, but let''s suppose our recipe app had a spice
    inventory function, and the user begins entering a recipe which includes a spice
    they do not have. You could fire an intent broadcast which includes the name of
    the new spice, and a BroadcastReceiver listening for new spices could add this
    to a shopping list.


    Creating an intent broadcast is straightforward:


    ```

    public static final String NEW_INGREDIENT = "com.recipesapp.basic.action.NEW_INGREDIENT";nIntent
    missingIngredient = new Intent(NEW_INGREDIENT);

    missingIngredient.putExtra("spice","paprika");

    sendBroadcast(missingIngredient);

    Based on matching intent filters, making BroadcastReceiver exist in order for
    the desired action to happen.

    import android.content.BroadcastReceiver;

    import android.content.Context;

    import android.content.Intent;

    public class NewIngredientDetectedToAll extends

    BroadcastReceiver {

    @Override

    public void onReceive(Context context, Intent intentt) {

    Uri data = intent.getData();

    String spice = data.getStringExtra("spice");

    //Now do something

    context.StartActivity(..);

    }

    ```'
