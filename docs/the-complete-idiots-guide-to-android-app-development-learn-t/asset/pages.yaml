  md: '# 358 Part 5: Taking Your App to Market


    3. Once your payment has processed, you must accept the Android Market Developer
    Distribution Agreement, an an End User License Agreement (EULA). You should read
    the terms carefully on your own, but these are the key points:


    +   - There is no cost to distribute free apps

    - If you charge for your app, Google will keep 30 percent of the cost as a transaction
    fee and you will receive 70 percent. Apple currently has the policy.

    - Users might receive a refund of the purchase of your app within 15 minutes of
    sale.

    - You agree not to distribute harmful or damaging software.

    - You alone are responsible for your app, updating and marketing your app and
    ensuring that it does not violate the copyrights of others.


    Overall, the agreement is unusually simple and fair. Unlike the Applebranded App
    Store, Google does not review or reject apps, though it does patrol for malware,
    viruses, and adware.


    4. If you want to charge for your apps, you need to set up a Merchant Account.
    The Merchant Account link is visible from your Developer home page. You need to
    provide credit card and bank information for Google to send you purchase payments.


    Once you have completed the developer signup, you are ready to prepare your app
    for submission.


