  md: '# Registering for the Android Market


    After the lengthy process of installing these tools, you are finally ready to
    begin developing Android apps. Once you have finished that journey, how do you
    move your new app onto the devices of millions of Android users? The Android Market
    is your first, one-stop shop. Alternative markets exist, too, but Google''s Market
    was the first and is the largest. Visit http://market.android.com/publish to begin.


    If you do not have a Google account, you will be prompted to create one. Google
    recently began imposing a one-time $25 registration fee to discourage less than
    altruistic app developers from creating multiple, duplicate accounts in the Market.
    While not free, for a developer class account, $25 is a bargain.


    Once you have completed this last piece of the developer puzzle, you are at free
    to develop and distribute your apps. You can begin to explore the functionality
    of the Market on your own. You will soon discover resources to connect with other
    developers and Android users. You have begun to unlock the potential of the Android
    platform.


    # The Least You Need to Know


    +   * You can develop for Android with any operating system which can run Eclipse.

    * The Android platform presents an opportunity to think about application development
    in a very different way.

    * Remember and reference with fervent frequency the Android Developer Site at
    http://developer.android.com.

    * All of the developer tools for Android are free.

    * Registration for an Android Market account costs $25.'
