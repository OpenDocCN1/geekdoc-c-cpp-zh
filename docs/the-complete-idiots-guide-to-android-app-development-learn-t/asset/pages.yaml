  md: '# # Requesting Data from a ContentProvider


    In order to request information from a ContentProvider, you execute a query that
    returns a cursor object. Working with queries and cursors should be familiar from
    Chapter 17, and in the context of ContentProviders, the query methods are similar.


    When possible, it is advantageous to import the Provider, as this allows quick
    access to its Constants. All of the imports necessary for this chapter follow
    here:


    ```

    import android.content.ContentResolver;

    import android.database.Cursor;

    import android.net.Uri;

    import android.provider.ContactsContract.Contacts;

    import android.provider.ContactsContract.CommonKinds.Phone;

    ```


    Now, you can write a query to return the lookup reference and display name of
    all the contacts on the device.


    ```

    Uri contacts = Contacts.CONTENT_URI;

    String[] fields = new String[] {Contacts.LOOKUP_KEY, Contacts.

    DISPLAY_NAME};

    Cursor cur = managedQuery(contacts,

    fields,

    null,

    null,

    Contacts.DISPLAY_NAME + " * ASC");

    ```


    Android provides two ways to execute a query on a ContentProvider, via the query()
    method on the Activity class and through the query() method on the Resolver class.
    In the case of managedQuery(), Android manages the entire lifecycle of the cursor
    for. Both methods take the same parameters and return the results in a cursor
    object.


    With the returned cursor, you can perform data binding to bring the results into
    a View or process them according to some other business logic. If the query has
    results, the cursor has them as a data table, with rows and columns. You can iterate
    this result set in a loop:


    ```

    String displayName;

    String lookupKey;

    int nameColumn = cur.getColumnIndex( Contacts.DISPLAY_NAME );nint keyColumn =
    cur.getColumnIndex( Contacts.LOOKUP_KEY );nUri aContact;

    ```'
