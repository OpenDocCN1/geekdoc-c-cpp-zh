  md: '# Chapter 16: Threads and the Background 287


    In this case, the AsyncTask class would be:


    ```

    private class MyAsyncTask extends AsyncTask<URL, Int, String>{}

    ```


    It must be instantiated as a subclass to be used, and the class takes three types:


    +   - **Params.** The type of parameters provided to the task to execute. In this
    case, the type is of URL.

    - **Progress.** The type of units in which to publish progress information. In
    this case, the type is of Integer.

    - **Result.** The type of the result to return to the main thread. In this case,
    the type is of String.


    All types are required, but you must pass Void if you do not intend to use a particular
    type. Calling an AsyncTask subclass instructs Android to launch the task in a
    new background thread and manage the entire thread life cycle for you. This involves
    executing the following methods:


    +   - **onPreExecute().** This executes on the main, user interface thread immediately
    upon calling AsyncTask(). Use this method to set up the task and render any interface
    elements, such as a progress bar, that you wish to be updated.

    - **doInBackground().** This method takes the Params type and is called as soon
    as onPreExecute(). You will execute all of your expensive or long-running code.

    - **publishProgress().** This method takes the Progress type and can be called
    from within doInBackground(). Call this method at frequent intervals to update
    the progress of your task.

    - **onProgressUpdate().** This method also takes the Progress type and is called
    by publishProgress(). Use this method to provide updates to the user interface
    thread, such as incrementing the progress bar.

    - **onPostExecute().** This method takes the Result type and is executed as doInBackground()
    has completed.


    Now, you can build a simple asynchronous task. In this example, you design a simple
    Activity that launches a background thread to count to 100 while keeping the user
    interface thread up to date with a ProgressDialog:'
