  md: '# Chapter 17: SQL and Databases


    The query() method is defined as:


    ```

    query(String table, String[]) columns, String selection, String[]

    selectionArgs, String groupby, String having, String orderBy)

    ```


    In the context of the Select statement, this method''s parameters align with the
    clauses of the Select as follows:


    +   * table matches the FROM clause.

    * columns matches the SELECT clause.

    * selection matches the WHERE clause.

    * selectionArgs provides additional flexibility for the WHERE clause.

    * groupBy, having, and orderBy match the corresponding clauses.


    # Bring the Data into View


    In the DBOpenHelper class, you added a single, default insert to the recipes database
    onCreate(). You can add more default records to help you fully test the next step,
    which is to display the contents of the database inside an Activity. This process
    is called data binding.


    > DEFINITION


    Data binding is the process of Joining two separate information sources together,
    frequently between a data source and XML or a user interface.


    To demonstrate a proof-of-concept, you can create a simple LinearView layout with
    a single Spinner widget. Using DBHelper, query the database for all recipes and
    fill the Spinner control with the available recipe names. In order to do this,
    you will need to bind the Cursor object with the View.


    Android simplifies the data binding process by providing adapters to bridge a
    data source with a View object. The SimpleCursorAdapter class provides a simple
    way to achieve:


    ```

    import android.app.Activity;

    import android.database.Cursor;

    import android.os.Bundle;

    import android.view.View;

    ```


    continues'
