  md: '# Chapter 16

    Threads and the Background


    # In This Chapter


    +   - Introduction to threads and processes

    - Background vs. foreground

    - Working with AsyncTask

    - Building your first service

    - Friendly notifications


    In day-to-day life, very few of your tasks happen synchronously—that is, one after
    the other. If you have ever needed a quick lunch but did not have time to collect
    the ingredients and prepare a meal, you have probably used a microwave to heat
    a prepared food. The microwave allows you to operate asynchronously. You can pause,
    start the task, and resume your work confident that the microwave will alert you
    when your lunch is ready for consumption.


    Java and therefore Android, like most modern languages, has the same concept of
    separating tasks that need to happen now versus tasks that another agent can execute
    and complete later. This chapter introduces threads and background services that
    can be used to process tasks independently from the main task of your app.


    # What Are Threads?


    In the lunch analogy, your workflow is divided into two threads. In the first
    thread, you have started writing some code for your next Android app, you pause
    for a moment, and you click the Start button on the microwave. This launches the
    second thread, which enables you to go back to writing some code. Sometimes later,
    the second thread completes and notifies you of the result: hot lunch.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# Part 4: Increasing Your Application Scope


    DEFINITION

    A thread is a unit of processing that is scheduled by an operating system to execute
    a series of tasks, usually in sequence. Threads are normally members of a process
    that represents a discrete activity or application.


    Most applications as they reach a certain level of complexity need to separate
    tasks into different threads. It would not be an efficient use of time to force
    all other tasks to wait for each individual task to complete. Imagine being completely
    frozen in place while the microwave runs!


    There are two primary reasons to branch certain tasks into separate threads. First,
    you want to allow your app to continue processing essential tasks, like loading
    the user interface, while other nonsensical tasks, like downloading some data
    from a remote server, run second. You want your app to be fast and responsive.


    Android is particularly concerned about responsiveness, and it has a special dialog
    prepared to enforce speedy completion. The Application Not Responding (ANR) dialog
    will display if your app has not responded to the last input within 5 seconds,
    as shown in Figure 16.1.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_297_0.png)


    Figure 16.1: The Application Not Responding notice.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Chapter 16: Threads and the Background 285


    The Android SDK recommends that 100–200 milliseconds is the average user’s tolerance
    for responsiveness, which makes 5 seconds quite generous.


    # About Processes


    Every component of your Android app runs inside a process. By default, every app
    runs in its own process thread. Additional processes can be specified in the Android
    Manifest. The <application>, <activity>, <provider>, <receiver>, and <service>
    elements all possess an android:process attribute that can define separate processes
    which to run. Specifying an application level process sets this process as the
    default for all other components.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_298_0.png)


    A process is an instance of a program being executed. A process contains the code
    to be executed and the activity. Processes in Android are composed of a single,
    primary thread by default.


    Unless otherwise specified, all components are executed in the main thread of
    their process. From launching the app, clicking a menu icon, responding to a dialog,
    to entering some data and saving, each of these steps occurs in sequence and blocks
    the next step. If all activity is executed in the main thread, nothing can happen
    while waiting for the user to respond to a dialog box.


    For this reason, it is best to avoid executing code in the main thread that will
    block further user interaction. Android patrols all running processes to optimize
    memory usage and performance. If processes take too long to complete their tasks,
    Android considers terminating them.


    Processes are evaluated for termination by priority and responsiveness. Lower
    priority processes are terminated first, followed by higher priority processes
    as needed. Android prioritizes processes in the following order:


    +   - Foreground processes. An active process that is required for what the user
    is currently doing.


    +   - Visible processes. An active process that is not in the foreground but affects
    what is visible on screen. For example, an open, translucent dialog box may be
    in the foreground, but the Activity screen behind it would still be visible.'
  merge: -1
  pgno: 298
