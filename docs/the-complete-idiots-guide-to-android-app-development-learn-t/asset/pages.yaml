  md: '# Appendix A


    # Glossary


    Here you will find some of the common keywords and terms used throughout the text.
    This glossary is not comprehensive, but Appendix B will identify resources to
    find definitions for any terminology which you need more information.


    Android SDK A collection of tools that integrate into your development environment
    enabling you to develop applications for any device (phone, tablet, or notebook)
    that runs the Android OS. SDK is for Software Development Kit.


    Application Programming Interface (API) An API is a guide to writing code in a
    language. The API provides quick access to available elements of a language.


    arrays Systematic collections of objects, usually arranged serially in rows and
    columns.


    asynchronous task Task executes on a background thread, separate from the main
    user interface thread of an app. The asynchronous thread needs to periodically
    update the main thread with the results of its progress.


    Bluetooth A wireless communication standard that allows data communication with
    any other Bluetooth-enabled device within range. Range is typically between 30
    and 75 feet.


    break and breakpoint The debugger is set to break when it halts code execution.
    The debugger breaks on errors or on breakpoints defined by you. In the case of
    breakpoints, the break occurs before the line at the breakpoint is executed.


    BroadcastReceiver Listens for broadcasts sent by intents and can send notifications,
    run intents, start services, or update the display. BroadcastReceivers react when
    a matching intent is sent.


    class package that defines a blueprint for creating an object. The class contains
    rules for interacting with objects of its own class, and it contains the attributes
    and data available about each instance of object.'
  merge: -1
  pgno: 382
- img_proc: true
  md: 'color In Android, a color is the hexadecimal combination of alpha, red, green,
    and blue. Alpha represents transparency. Opaque black would be ff000000, whereas
    transparent white would be 00ffff.


    Content Provider Makes data available to all apps that can be searched or modified.
    Android does not provide a common, central storage location, so providers are
    the only way to exchange information between apps.


    cursor Contains an arbitrary number of objects that can be iterated like an array.
    Unlike an array, a cursor maintains a relationship with the query that generated
    it, enabling the cursor to request a query of its results and other operations.


    Dalvik Debug Monitor Service (DDMS) Acts as a middle man between Eclipse and an
    Android device. Android allows for every process to be monitored in debug mode,
    and DDMS provides the infrastructure to both passively listen to Android apps
    as well as actively communicate with them.


    data binding The process of joining two separate information sources together,
    frequently between a data source and XML or a user interface.


    Drawable Any resource that can be drawn or rendered as a graphic on the screen.
    The Drawable class defines few generic methods to interact with the object being
    drawn.


    Eclipse The preferred Integrated Development Environment (IDE) for Android development.
    An IDE is a toolkit for writing, debugging, compiling, and deploying applications.


    End User License Agreement (EULA) Defines an agreement between developers and
    users of an app. Users must agree to the EULA in order to use the app. A EULA
    defines waivers of liability for misuse of the app or state licensing requirements
    for legal use of the app.


    Event Handlers Extend view components, as Button or EditText widgets. Handlers
    provide method callbacks in the context of the parent widget.


    Event Listener A interface that contains a single callback method, such as onClick()
    or onError(). These methods target the view and not components of the view.


    Extensible Markup Language (XML) A web standard for storing data of any kind in
    a format easy to process programmatically. Almost all Android configuration is
    done with XML formatted documents.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# Glossary


    Hello World Often the first program developers write for new languages. The program
    is intended to demonstrate the simplest possible function: output a single line
    of text, "Hello World!"


    Integrated Development Environment (IDE) An application designed to assist your
    code-writing effort by helping compile your application, identify errors, and
    cross-reference functionality. IDEs help improve development efficiency.


    interpolators A class that lets you modify animation effects by increasing or
    decreasing the speed, bouncing, or repeating the effects.


    Java Virtual Machine (JVM) An application written for a specific platform that
    translates neutral Java code into code that the host OS can run.


    life cycle The time between an object is created or started and when it is ended
    or destroyed.


    Linux A versatile, robust, and free operating system that is used to power a wide
    range of devices, from computers to TiVos and mobile phones.


    List View Treated as a widget and a ViewGroup, a view that extends the ListAdapter
    it uses to bridge data back and forth.


    methods A subroutine associated with a class or object that performs some action.
    They can return a value and optionally take parameters to customize their actions.


    overloaded When multiple methods exist with the same name when they actually require
    different parameters. Methods which serve similar purposes are sometimes overloaded
    to improve code readability and reduce code complexity.


    pairing When Bluetooth devices establish a connection to each other. Once paired,
    the basic device information (name, address) is saved and communication with the
    device is possible.


    permissions The user giving an Android app to access certain features, such as
    location or the camera. Permissions are defined in the manifest, and the user
    is prompted to accept or deny an app’s permission to the features on installation.


    process An instance of a program being executed, it contains the code to be executed
    and the activity. Processes in Android are composed of a single, primary thread
    by default.'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'receivers Process information from transmitting stations, such as antennas,
    towers, and satellites. In mobile devices, this communication typically occurs
    over Radio Frequency (RF).


    refactoring The process of improving a source without changing its expected behavior.
    Reasons to refactor can include improving readability, decreasing complexity,
    or improving maintainability of code.


    sensors Return information collected from the device itself, such as touch input,
    rotation, and movement.


    SharedPreferences Simple information about the user stored as an XML resource.
    By default, this resource is private and can be accessed by only the calling activity.


    Spec A set of requirements for accomplishing a given task. They are as detailed
    and explicit as required for the person performing the task to complete the work
    and for peers to understand the goal.


    SQL The most widely used language for communicating with databases, and it is
    used to query, insert, update, and delete data. It also has the power to modify
    the structure of the database, modifying tables, columns, and permissions.


    stack trace In debugging, each dependent method call in in descending order from
    the last method called. In an error context, it begins with the error, followed
    by the method (A) that generated the error, followed by the method (B) that called
    method (A), and so on.


    step In debugging, a movement from the current break in execution to the next
    line to execute. It can move forward by a single line or block of code and instructs
    the debugger to execute only the code within the step''s increment before breaking
    again.


    subclass Inherits some of the methods and properties of a class. They share enough
    characteristics to be considered related but are unique enough to deserve their
    own definition.


    tab A visual marker that allows multiple resources to be contained in a single
    screen with a visual cue to distinguish them.


    thread A unit of processing scheduled by an operating system to execute a series
    of tasks, usually in sequence. They are normally members of a process that represents
    a discrete activity or application.


    toast A view containing a message to the user.'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'tween Animations defined in XML that describe transition effects to visually
    move objects from one state to another over some length of time.


    **Uniform Resource Identifier (URI)** An address for the location of some information.
    On the web, this could be a web address like http://www.google.com. In Android,
    this is likely to be a local address like content://contacts/people/1.


    **Universally Unique Identifier (UUID)** A random string that uniquely identifies
    public components of your app.


    **View (Class)** Responsible for rendering components of the user interface. It
    occupies a defined rectangular space and is responsible for drawing content and
    handling events in that space.


    **View (Eclipse)** Displays different types of information about Workbench. Each
    has its own set of preferences and menu options and can be customized to your
    needs.'
  merge: -1
