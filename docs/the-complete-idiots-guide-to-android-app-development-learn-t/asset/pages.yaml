  md: 'emulator uses a single, static location as the response for all requests to
    location services. You can supply alternative location coordinates from within
    Eclipse and through the Dalvik Debug Monitor service.


    Start the emulator, and then select from the Eclipse menu: Window > Show View
    > Other... > Android > Emulator Control. By default, this opens in a new tabbed
    Eclipse at the bottom of your workspace. Scroll to the top, and you will see the
    option to set the latitude and longitude coordinates manually, as shown in Figure
    12.1.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_227_0.png)


    Figure 12.1: You can manually simulate GPS coordinates in the Eclipse emulator.


    You can also do this in DDMS using the same Emulator Control view. Open the DDMS
    perspective from Window > Open Perspective > Other... > DDMS.


    # Sense and Sensors


    If you use an Android device, you are probably already familiar with some of the
    sensors on the device—even if you have not thought about them individually. You
    might have noticed that the screen on the device brightens and dims in response
    to the light in a room or that the screen blanks when holding it to your ear.
    If you have used Google’s free Sky Map app, you have noticed that the app automatically
    brings the constellation at which you point the device into focus.


    All of this magical behavior is made possible by many different hardware sensors,
    coordinated by Android system services. Unlike receivers, sensors respond only
    to variables in the local environment. It would be difficult to construct personally
    identifiable information based on the angle the device is held and the distance'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Chapter 12: Location-Based Services 215


    from an ear; therefore, you do not need to ask permission to use these services
    and features.


    In fact, sensors are generally features that users expect apps to implement. The
    most obvious of these is orientation. Users expect apps to respond to rotating
    the device between landscape and portrait mode. Android handles some of this work
    for you, but to make the most of the available sensors, you need to implement
    them in code.


    # Reading a Sensor


    Just as with location, sensors are managed by system services, and they are instantiated
    in the same way. Here is the code for accessing the SensorManager class:


    ```

    private SensorManager mySensorManager;

    mensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);

    ```


    Also like the LocationManager, class SensorManager maintains all sensors on the
    device. Unlike locations, sensors can communicate vastly different types of information.
    Surrounding temperature and device acceleration are unrelated bits of information
    at best. Given this, you cannot simply call getBestSensor() because there are
    too many types of sensors for a method like that to be meaningful.


    Instead, you can getSensorList to return a List of sensors on the device-matching
    the type of sensor requested. Alternatively, call getDefaultSensor() to return
    the sensor Android decides most suited to the task. Both methods use an integer
    parameter to define the type of sensor to return. For example, getSensorList(Sensor.TYPE_ALL)
    would return all sensors on the device. Other available constants include:


    +   - TYPE_ACCELEROMETER. Sensors that detect any device momentum on three axes.

    - TYPE_GYROSCOPE. Sensors that measure relative movement of the device on three
    axes.

    - TYPE_LIGHT. Sensors that measure changes in light in device''s environment.

    - TYPE_MAGNETIC_FIELD. Sensors that measure changes in magnetic attraction against
    all three axes.

    - TYPE_PRESSURE. Sensors that measure pressure applied to the surface of the device,
    usually against the touchscreen.'
