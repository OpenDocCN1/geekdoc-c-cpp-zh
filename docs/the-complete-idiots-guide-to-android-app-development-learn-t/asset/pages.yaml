  md: 'These were probably installed when you first set up Eclipse in Chapter 1, but
    you can double check by doing the following:


    +   1. Launch the Android SDK Manager in your SDK application folder.

    2. If the Google APIs for API 8 (Android 2.2) are not installed, you will see
    a window asking you to accept the agreement and install them.

    3. Accept the terms and click Install.

    4. Once the download completes, you are ready to go.


    # Working with Google Maps


    With the Google APIs installed, you can now implement Google''s maps into your
    app. Most of the work of using maps involves setting up your Eclipse environment
    to use the new APIs. Follow these steps to that:


    +   1. Create a new Android project in Eclipse or change your current project
    to target the Google APIs.

    2. Right-click the project, select Properties > Android > Google APIs for the
    most current platform (Plattform 2.2, as of this writing).

    3. Create a new Android emulator for the target build.

    4. Select Window > Android SDK and AVD Manager > New....

    5. Set the Target to Google APIs (Google Inc.)— and the most current API Level
    8, as of this writing.


    The actual map data is not included in the API add-on. This comes from Google''s
    servers. The app needs Internet access to acquire this data, you must request
    permission in AndroidManifest.xml:


    ```

    <uses-permission android:name="android.permission.INTERNET" />

    ```


    Additionally, your app needs to access libraries outside the Android SDK, namely,
    the API libraries you just downloaded. This must be declared in the manifest as
    well:


    ```

    <uses-library android:name="com.google.android.maps" />

    ```'
