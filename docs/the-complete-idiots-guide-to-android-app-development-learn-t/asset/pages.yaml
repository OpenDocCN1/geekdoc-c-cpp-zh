- img_proc: true
  md: 'Your apps will crash. It is inevitable and frustrating. Android prioritizes
    certain apps, like the phone and SMS messaging; Android can and will make these
    apps take priority, even at the cost of your app. Anticipating different use cases
    of your app is critical to success.


    While these and other obstacles present road blocks to your development success,
    the Android SDK provides numerous resources to prepare for and protect from Android''s
    built-in protections and the unpredictability of mobile device usage.


    # Forward Thinking and Backwards Compatibility


    As you have already begun to realize, one of Android''s greatest strengths is
    its support for many different types of devices with different features. This
    is also one of the challenges for developing for Android; selecting any one version
    of the operating system for development increases the chances of compatibility
    issues for users wanting to run your app on their devices. For the purposes of
    this guide, we use Android OS 2.2. As you become comfortable developing and debugging
    your apps, you will find it easier to support multiple versions of Android simultaneously.


    # ANDROID DOES


    The Android SDK provides emulators not only for the version of Android OS you
    currently target, but also all versions of Android OS. This allows you to quickly
    target different versions and thoroughly test your app.


    Like them or leave them, these are the realities of Android development. Most
    developers and I agree that they are small obstacles to overcome and that you
    will quickly begin seeing many of them as strengths and opportunities.


    # Assembling Your Toolkit


    We have dabbled in theory long enough. Let us start getting our hands dirty with
    some development work! There are quite few different tools you will need to download
    and install in order to configure your development environment. Open your browser
    of choice, such as Firefox or Chrome, and let us begin.'
  merge: -1
