  md: '# Chapter 16: Threads and the Background 299


    By setting notification defaults, you can add sounds, vibration, and lights to
    your

    notifications. Here are the pieces:


    +   - **DEFAULT_ALL**. Adds all default elements to the notification.

    - **DEFAULT_SOUND**. Adds the system default notification sound.

    - **DEFAULT_VIBRATE**. Adds the system default vibration setting.

    - **DEFAULT_LIGHTS**. Adds the system default LED light alert.


    You can override the default values and settings with your own sounds, unique

    vibration patterns, and light signals. You will likely want to make all of these
    settings

    configurable within your app.


