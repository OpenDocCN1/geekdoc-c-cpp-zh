    # Internal Storage


    The Android OS is a Linux OS, which means it has a file system that both Android
    and its apps can access. Almost all Android devices use reliable flash memory,
    which means that once a file is written, the file is safe from harm. Internally,
    you can open your /raw resource files for read access; but for security purposes,
    each app has write access to a single, private directory /Android/data/<your_package_name>/files.


    After importing the appropriate Java packages, namely java.io.FileOutputStream
    and java.io.FileInputStream, you can access the methods needed to access the file
    system. These methods are described in the following table.


    # File Operation Methods


    | Access | Method | Description |

    | Write | openOutputFile(Filename, Mode) | Creates or opens a file with the name
    of Filename and opens it according to the Mode—MODE_PRIVATE is the default. |'
