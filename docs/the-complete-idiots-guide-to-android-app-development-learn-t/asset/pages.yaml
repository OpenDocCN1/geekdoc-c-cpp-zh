  md: '# From Widgets to the Browser


    # In This Chapter


    +   - Creating dialog inputs

    - Working with dates and times

    - Exploring widgets and controls

    - Opening the browser


    Well-designed operating systems provide access to a consistent look and feel between
    screens and settings. This continuity is a benefit both to developers and users.
    For users, it means that all dialog boxes in Android share a common aesthetic.
    This makes it easy for users to quickly pick up new apps and start using them
    with little to no instruction.


    For developers, this is a boon. Rather than create date pickers and ratings widgets
    from scratch, Android has already implemented them for you to use. This chapter
    explores how to take advantage of these built-in controls from the Date Picker
    to the Browser.


    # Widgets and Dialogs


    As you build the various activities of your app, you will have occasion to think
    about the kinds of information you want users to be able to enter and how your
    app will process that data. Widgets and dialogs can offer a simple way to solicit
    a specific kind of response from a user.'
