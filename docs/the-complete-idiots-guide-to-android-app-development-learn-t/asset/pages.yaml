  md: "# Chapter 14: Core Services 251\n\ncommunicating with a carrier\n\nAndroid\
    \ provides built-in utilities to manage a device's connection to these hotspots,\
    \ but it is sometimes desirable to manage this process manually in your app—or\
    \ even design a new Wi-Fi management app from scratch.\n\nBegin by instancing\
    \ the WifiManager system service:\n\n```\nWifiManager wifiManager = (WifiManager)getSystemService(Context.WIFI_SERVICE);\n\
    ```\n\nYou can register an IntentFilter to listen for broadcasts in the Wi-Fi\
    \ state registered by the WifiManager. These include:\n\n+   * WIFI_CHANGED_STATE_ACTION.\
