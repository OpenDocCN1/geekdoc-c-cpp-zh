    # Prepare the Class


    Your Provider class needs to extend the ContentProvider class, which has several
    required methods. If you remember the DBHelper class from Chapter 17, you might
    recall that you did not define a core Android class. Now you can. Your ContentProvider
    needs to access your database. Using your SQLite helper class as a component within
    the Provider can neatly integrate the dependent classes.


    To complete the entire process, you need the following elements.


    +   1. Add a <provider> tag to AndroidManifest.xml for .RecipesProvider

    ```

    <provider>

    android:name=".RecipeProvider"

    android:authorities="com.recipes.basic.recipeprovider"

    >

    </provider>

    ```


    +   2. Create a new RecipesProvider class or refactor DBHelper:

    `public class RecipesProvider extends ContentProvider { }

    3. Allow Eclipse to add the missing imports and required methods, which include:

    * onCreate(). Called when the Provider is initiated. Returns a Boolean, which
    should be true if successful.

    * query(). Your implementation of the query() method can be called from managedQuery()
    or ContentResolver.query(). This must return a cursor with the dataset.

    * insert(). Called to insert new data into your Provider. Must return a URI for
    the newly inserted item.'
