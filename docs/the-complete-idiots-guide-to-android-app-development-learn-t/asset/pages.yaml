  md: '# Part 2: Constructing Your Application


    Working with browsers in Android, you have two primary options—you can open a
    new instance of the Android browser or you can embed the browser as a widget inside
    your app. There are a variety of reasons to include a browser in your app which
    are supported by Android:


    +   * Open the default Android browser based on a link stored in your app.

    * Embed a browser to open your app''s own local HTML files.

    * Embed a browser to open and interact with specific sites.

    * Embed a browser to extend or change the default browsing experience.


    # Opening the Web Page


    Frequently, you do not want to invest the time and overhead to incorporate new
    infrastructure into your app. Suppose you wanted to add a way to quickly e-mail
    recipe information to a user''s contacts. While you could build your own e-mail
    client into your app to do this, it would be much faster to simply allow Android
    to launch its own e-mail client and handle all of that for you.


    In a similar fashion, you probably do not want to manually manage the browser
    instance for every possible site that your app might collect—it is more efficient
    and easier to simply allow Android to launch a new browser instance in a separate
    Activity based on the links you collect.


    It is a straightforward process with Android. For this example, create an EditText
    and a button in your layout. You will enter the website in the text box and click
    the button to open the site in a browser, as shown in Figure 10.9.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_193_0.png)


    Figure 10.9: Opening up the browser in your app.'
