  md: "# Efficiently Rotating the Screen\n\nUsers have come to expect speedy transitions.\
    \ To guarantee this, you must reduce the overhead of your Activity's life cycle\
    \ events by persisting the data retrieved from all expensive operations. Android\
    \ provides two additional life cycle methods to assist you with this:\n\n+   *\
    \ onRetainNonConfigurationInstance(). Android calls this method between Stop()\
    \ and onDestroy(), and Android is smart enough to know when to make this call.\
    \ You need only implement the method and pass an arbitrary object with your data,\
    \ and Android will make sure this object is intact and available when you next\
    \ need it. You should not use this object to store Views, Drawables, or anything\
    \ tied to the Context or Activity as this could create a memory leak.\n* getLastNonConfigurationInstance().\
    \ This method is available in either onCreate() or onStart(), and can be used\
    \ to restore your data from the persisted object. You must anticipate null returns\
    \ here.\n\nFirst, override the onRetainNonConfigurationInstance() method and return\
    \ your object to be stored:\n\n```\n@Override\npublic Object onRetainNonConfigurationInstance()\
    \ {\n    return yourObject;\n}\n```\n\nIn this example, yourObject can be any\
    \ visible property you have defined elsewhere in your code. Now you are prepared\
    \ to call getLastNonConfigurationInstance() and restore this data when your Activity\
    \ is restarted:\n\n```\nprivate String yourObject = null;\n@Override\npublic void\
    \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.main);\n    yourObject = (String)getLastNonConfigurationInstance();\n\
    \    if (null != yourObject) {\n        //Restore the string to the proper context\n\
    \    } else {\n        //Your Activity is starting normally\n    }\n}\n```"
  merge: -1
  pgno: 285
