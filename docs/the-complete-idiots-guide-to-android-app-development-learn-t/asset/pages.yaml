  md: '# Part 4: Increasing Your Application Scope


    language selection is one of the first steps. Android automatically detects country
    and region from the network.


    As you learned in Chapter 3, you can provide alternate resources used to customize
    your app by orientation and time of day. The same is true for languages. By providing
    additional resources, your app can automatically adjust to the language and region
    of your users.


    # Managing Resources


    Specifying language and region resources follows the same logic as providing optimized
    resources for low- to high-resolution screens. For example, icon.png might be
    your app''s home screen icon. The system default image should live in /res/drawable/icon.png
    and you may specify optimized versions at /res/drawable-ldpi/icon.png and /res/drawable-hdpi/icon.png.


    In all cases the resource name icon.png stays the same. The contents of the resource
    differ by location. Android selects the most appropriate version to use at runtime.


    The same concept applies to locales that might have different string value content
    for languages and regions, and that might use different image drawables for countries.
    Due to limitations in space, the Android SDK does not immediately support all
    locales.


    Here are the locales currently supported by the Android SDK. They are arranged
    by language, location, and resource name.


    # Locales Supported by the Android SDK


    | Language | Locale | Resource Name |

    | --- | --- | --- |

    | Chinese | PRC | zh_CN |

    | Chinese | Taiwan | zh_TW |

    | Czech | Czech Republic | cs_CZ |

    | Dutch | Netherlands | nl_NL |

    | Dutch | Belgium | nl_BE |

    | English | US | en_US |

    | English | Britain | en_GB |

    | English | Canada | en_CA |

    | English | Australia | en_AU |'
