    # Network Interfaces


    In the next few years, voice and data services will merge, and you will interact
    with the phone’s core services as pure data. Some of this data will contain voice
    communication, some short messages and e-mail, and other browsing and streaming
    media. Until then, devices are still separated into two distinct departments:
    the voice department and the data department.


    With voice services behind you, the next bundle of services will handle the communication
    of data. From the data signal to a carrier, to the Wi-Fi signal with a local hotspot,
    to peer-to-peer data connections over Bluetooth, the average Android device is
    packed with antennas and receivers.


    Most current Android devices support three versions of Wi-Fi: B, G, and N. Bluetooth
    support ranges from versions 2.0, 2.1, and 3.0—each with different hardware specifications.
    Android bundles each of these services into discrete classes, which eliminates
    the need for you to worry about how the service is implemented, allowing you the
    freedom to plug and play.'
