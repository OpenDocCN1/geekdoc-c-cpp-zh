  md: '# # Chapter

    20

    Testing Your Apps


    # ## In This Chapter


    +   * Reviewing the Android device diversity

    * Developing a test plan

    * Testing SDK versions in the emulator

    * Understanding backward and forward compatibility


    Every few years Microsoft or Apple releases a new version of its operating systems.
    The market suddenly divides between users of new computers that now ship with
    the new version of the OS and everyone else: continue to provide backwards compatibility
    with the older OS or jump aboard the new OS with its latest and greatest features.


    The pace of Android development is considerably faster. Android OS 1.0 was released
    in October 2008, and major OS updates are released every four to five months.
    With 200,000 Android devices sold every day, store shelves and consumer pockets
    are filled with many different devices running different versions of the OS. This
    chapter walks through developing your app for the broadest possible market.


    # ## The Good News


    Android developers used to fear the threat of Android fragmentation. In June 2010,
    approximately 25 percent of users had OS 1.5 (coden) Cupcake, 25 percent 1.6 Donut,
    and 50 percent 2.1 Eclair. By November 2010, that shifted to roughly 40 percent
    of users on Froyo, 40 percent on Eclair, and just 20 percent divided between Donut
    and Cupcake.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Part 5: Taking Your App to Market


    # GOOGLE IT


    Google releases the fragmentation or distribution of Android OS versions every
    month on the Android Developer site at http://developer.android.com/resources/dashboard/platform-versions.html.
    Periodically search for the current OS distribution to inform how you develop
    and test your apps.


    This trend is encouraging for developers, because it indicates that hardware manufacturers
    are updating Android devices to newer versions of the OS. Maintaining app compatibility
    between Android OS versions has become significantly easier and getting simpler
    with each quarter.


    Your development prospects are promising. With almost no extra work, your Froyo
    targeted app is compatible with 40 percent of hundreds of millions of Android
    devices. With a little extra work, your Froyo and Eclair targeted app can reach
    80 percent of the consumer market. How much effort you want to spend to reach
    the last 20 percent is entirely up to you and depends on your needs and preferences
    as a developer.


    # Build a Testing Plan


    Software development companies are likely to have separate departments for development,
    quality assurance, and unit testing, which probably include rigid criteria for
    executing tests plans. As a developer working alone or in a small group, "testing"
    does not refer to that kind of formal process, though Android does have a testing
    API for this purpose.


    Rather, testing means an informal process of building your app to target different
    configurations of Android hardware and OS versions, and running your app on physical
    or emulated targets of those configurations. You should document what steps you
    take and issues you find, but this should be according to your own needs as a
    developer.


    When you design your tests, you will want to prepare a release strategy that answers
    these questions:


    +   * Which Android OS versions will your app support?

    * If your app uses new OS features, you will provide backward or fallback compatibility
    for older OSes

    * What hardware features will your app require?'
