    # # Working with ListViews


    What recipe app would be complete without lists? Recipes need ingredients, steps,
    measurements, and details which are not well suited to storage in large EditText
    controls. As with so many other obstacles, Android has anticipated this type of
    view and provided the ListView layout.


    > DEFINITION

    The ListView class is treated as a widget and a ViewGroup. It extends the ListAdapter
    class, which it uses to bridge data back and forth.


    # # Inflating the Layout


    In order to display a known, static number of objects, any other type of ViewGroup
    would suffice. ListViews offer the potential to render dynamic content, which
    makes them quite powerful. A ListView can display a changing set of items, such
    as album covers or photos, which originate from another source. They can also
    expand to include new content directly.'
