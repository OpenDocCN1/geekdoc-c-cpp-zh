  md: '# # Resources,

    References, and Useful Websites

    Appendix B


    The web provides a vast number of sites dedicated to programming and assisting
    developers to connect and solve problems. While not comprehensive, this list provides
    some of the more popular sites for your reference. Remember, when in doubt, Google
    it.


    # ## Java and Object Oriented Language Resources


    Many sites offer information for new developers to learn and refine their Java
    Object Oriented Programming skills.


    +   * **Oracle.** The official Java site contains many of the resources you need
    to started in Java. http://download.oracle.com/javase/tutorial

    * **W3Schools.** One of the largest developer sites available, W3Schools provides
    extensive guides and resources to standard technologies like XML, SQL, HTML5,
    and CSS. http://www.w3schools.com

    * **Introduction to Programming Using Java.** A free, online textbook in its fifth
    edition, this book contains many useful guides to programming in Java. http://math.hws.edu/javanotes

    * **Java Beginner.** Another free, online resource for Java programmers. http://www.javabeginner.com

    * **The Object Oriented Programming Web.** Provides numerous links to resources
    for object programming and design, as well as references for Java. http://www.oopweb.com'
