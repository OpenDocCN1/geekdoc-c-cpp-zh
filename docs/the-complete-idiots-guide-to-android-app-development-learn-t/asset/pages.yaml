    \ you will see a message with the time, verbosity, tag, and message content every\
    \ time this method is called. The LogCat view has a Filter that allows you to\
    \ sift through the messages looking for specific times, tags, and messages.\n\n\
    You can leave Error, Warning, and Information messages in your finished app, but\
    \ remember that these consume space. While you could remove them before preparing\
    \ your app to market, what if there is an easier way? Using a special debug tag\
    \ in the AndroidManifest.xml, you can explicitly launch your app in Debug mode,\
    \ which the next sections covers in more depth.\n\nBy implementing a distinct\
    \ logging class, you can leave all of your log messages, error to verbose intact\
    \ without any fear of impacting your users.\n\nThis is how you establish a list\
    \ of logging errors outside of your app:\n\n```\nimport android.util.Log;\n```\n\
    \n```\npublic class LogClass {\n    public static void d(String tag, String msg)\
    \ {\n        if (Log.isLoggable(tag, Log.DEBUG)) {\n            Log.d(tag, msg);\n\
    \        }\n    }\n}\n```\n\nExtend this class to include all of the overloads\
    \ and logging levels that you want to implement. You can then instance a LogClass\
