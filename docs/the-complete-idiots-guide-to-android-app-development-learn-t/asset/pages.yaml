    layout definitions, for example the layout_height tag. Save the change and run
    the app against your emulator to see the error. See Figure 3.10.


    The Android SDK provides a simple and direct path to diagnosing any of these errors
    by providing extensive logging. To view the output of the emulator log, open the
    LogCat view (see Figure 3.11) in Eclipse from Window > Show View > Other > Android
    > LogCat.'
