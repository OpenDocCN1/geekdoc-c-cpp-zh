    # Introduction to Refactoring


    Open or create the BasicRecipes project in Eclipse (as shown in Chapter 2) and
    look at RecipesActivity in Package Explorer. The name of this activity does not
    quite capture how it is actually used. This activity is a menu on the first screen
    to open. As you add new activities to your project, you can save yourself a great
    deal of scratching by naming your objects well.


    Changing a class name is not as easy as just renaming the class itself, because
    other objects may already be referencing it by name. Fortunately, Eclipse solves
    this problem with the concept of refactoring. In this context, refactoring changes
    the name of the activity and updates all references to the activity with the new
    name.'
