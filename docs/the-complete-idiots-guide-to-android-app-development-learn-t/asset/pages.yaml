  md: '# Chapter 4: Finding More Activities


    When you created the BasicRecipes project, Eclipse offered an option to create
    a default activity. Unfortunately, the process to create new activities is still
    a bit manual.


    # Updating the Android Manifest


    Whenever you add new classes to your project, the Android Manifest needs to be
    updated. While you can implement any number of features in your project inside
    Eclipse, Android has no way to know about your new objects unless they are explicitly
    defined in the Manifest.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_70_0.png)


    > PITFALL

    Eclipse does not generate build errors if content is missing from your manifest.
    If your manifest is incorrect, errors will not surface until you try to run the
    app.


    By starting with the Android Manifest in the process of adding a new activity,
    you will see an error in the manifest file until the activity is implemented.


    There are two ways to implement. You can type the change directly into the code:


    +   1. Open AndroidManifest.xml.


    +   2. If you are already comfortable working with XML, insert a new activity:
    `<activity android:name="About\></activity>`.


    Alternatively, you can use the visual editor:


    +   1. Open AndroidManifest.xml.


    +   2. Using the visual editor works as well and guarantees the XML will be formatted
    correctly. From the manifest tabs, select `Application > Application Nodes > Add`.


    +   3. Select `Create new element` at the top level. See Figure 4.4.


    +   4. Click `Activity`, and then click `OK`.


    +   5. Give the activity a name of `.About` under Attributes for Activity.'
