  md: '# Important Android Project Files


    | Folder/File | Description |

    | --- | --- |

    | / | The root folder of your Android project, in this case /BasicRecipes. |

    | /AndroidManifest.xml | This XML file defines the components of your Android
    app—activities, services, intents—as well as permissions and capabilities. |

    | /assets | This folder manages references to static files you wish to include
    in your app. |

    | /bin | A folder including a built-up compiled version of your app. |

    | /gen | A compilation of your project''s resources which become accessible using
    the R class. |

    | /res | Your resources folder, where your animation, layout, menu, and XML data
    will be collected. |

    | /src | The source code folder for your app. This will contain the code that
    you write. |


    > DEFINITION

    ensible Markup Language (XML) is a web standard for storing data of any kind in
    a format easy to process programmatically. Almost all Android configuration is
    done with XML formatted documents.


