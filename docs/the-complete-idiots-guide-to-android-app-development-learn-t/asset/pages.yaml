    A Uniform Resource Identifier (URI) is an address for the location of some information.
    On the web, this could be a web address like http://www.google.com. In Android,
    this is likely to be a local address like content://contacts/people/1.


    Combining these attributes, you are able to send complete commands, “Dial Joe''s
    phone number” or “Open Maps app to my current location.” Android offers two paths
    to defining these commands: explicit intents and implicit intents.


    Explicit intents specify any exact component and class to run. These can be useful
    for launching activities within your app. You will notice that you used an explicit
    intent in Chapter 4 to launch the About scene:


    ```

    Intent showAbout = new Intent(this, About.class);

    startActivity(showAbout);

    ```


    Implicit intents allow Android to locate the right component to run the intent.
    Action, Data, and Category are used to query the PackageManager for the most appropriate
    component. To implicitly call a contact, for example, you would use:


    ```

    Intent i = new Intent(Intent.ACTION_CALL,

    Uri.parse("content://contacts/people/1")

    nstartActivity(i);

    ```


    # Common Intent Actions


    | Action | Description |

    | --- | --- |

    | ACTION_EDIT content://contacts/people/1 | Open contact with identifier “1” to
    edit. |

    | ACTION_VIEW tel:123 | Open phone app with “123” in the dialer. |

    | ACTION_VIEW content://contacts/people/1 | Open contact “1” to view. |

    | ACTION_CALL tel:123 | Start call with phone number “123.” |

    | ACTION_DIAL content://contacts/people/1 | Open phone app with contact number,
    but not call. |'
