    # ## In This Chapter


    +   - Introduction to SharedPreferences

    - Possibilities of local storage

    - Working with external data

    - Saving and reading recipes in your app


    Of all the apps you have opened more than once on any device, how many remember
    nothing about you? Very few. Reopening the solitaire app takes you back to the
    last game you started. Opening the phone app returns you to your last call. More
    than that, these apps remember not just the last activity you used, but frequently
    all your activities. Photo apps would not be very useful if they did not collect
    and store all the pictures you took with the camera.


    When you open the Contacts app, you expect it to contain the same information
    as the last time you used it. From settings to content, it should be all there,
    ready for use. Up to this point, you have invested a lot of energy in developing
    the user interface and improving the user experience. In this chapter, you begin
    storing the information that users enter. search for them, and do do everything
    else you can imagine to develop.


    # ## Storage Overview


    The days of rotary phones are nearly ancient history from a technology perspective.
    To dial a number, you opened a phone book, found a contact, and then painfully
    rotated the phone''s dial until a number would ring. Digital phones added quick
    dial,'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'primitive form of address book; but it was not until mobile phones arrived
    contacts and dialing were truly unified.


    Storage is one of the key components that made this obvious technological leap
    possible. Few users now want rotary-styled apps. Instead, apps should provide
    the shortest path to completing an activity by storing information that users
    enter. Android simplifies this process by providing access to multiple, complimentary
    kinds of storage.


    # SharedPreferences


    In Chapter 4, you created an Options menu that collects some preferences about
    the Simply Recipes app. These preferences are managed by the SharedPreferences
    class, which provides Activities a mechanism to store key/value information as
    preferences or state. Keys identify the name of the preference, while value represents
    its string, integer, or Boolean value.


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_149_0.png)


    # DEFINITION


    > SharedPreferences are stored as an XML resource. By default, this resource is
    private and can only be accessed by the calling activity.


    Preferences take three forms:


    +   - Shared. These preferences can be shared across all components in an app
    or across all apps. These are accessed by:


    ```

    getSharedPreferences( Preference, Mode );

    ```


    “Preference” is a String value that must exactly match the name of the preference.

    “Mode” is an enum on the Activity:


    +   - MODE_PRIVATE. Accessible only to the current app.

    - MODE_WORLD_READABLE. Visible to all apps on the device.

    - MODE_WORLD_WRITABLE. All apps can modify this value.

    - Private. These preferences are visible only to the Activity that sets them.
    These are accessed by calling:


    ```

    getPreferences( Mode );

    ```'
