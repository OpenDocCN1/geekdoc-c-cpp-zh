    # # About Your App


    As a general rule, apps should contain some information about the app itself,
    including version number, name, and the author. To provide this information, you
    create an About page. As is often the case in Android development, you can accomplish
    this multiple ways by:


    +   * Create a new activity and run it.

    * Use an existing class, such as AlertDialog or Dialog, and show it.


    Both options are worth exploring. In the first case, several steps are involved:


    +   1. Create a new activity class, About.

    2. Create a new XML doc for the About activity layout.

    3. Add relevant content to the strings.xml resource.

    4. Add an About button to the MainActivity activity layout.

    5. Modify the MainMenu class to call this activity when the About button is clicked.'
