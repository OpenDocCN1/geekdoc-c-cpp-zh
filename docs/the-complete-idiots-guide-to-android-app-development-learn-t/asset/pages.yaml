  md: "# Part 2: Constructing Your Application\n\nimagine some of the components required\
    \ to build a successful recipe entry screen: inputs for name, ingredients, steps,\
    \ and time to prepare others.\n\nThis can be quite a lot to fit into a single\
    \ Android view, so to make a more seamless user experience, the different components\
    \ need to split across multiple layouts, which is combined together in code.\n\
    \n# EditText and Other Widgets\n\nIn order to begin building a form that collects\
    \ input, as opposed to simply reacting to inputs like clicking and tapping, you\
    \ need more widgets than just buttons. Android provides support for a number of\
    \ different widgets:\n\n# ANDROID DOES\n\nIn addition to all of the predefined\
    \ widgets, layout, and view objects, Android allows you to create your own. Remember\
    \ that these are just Java classes and can be recreated to your own sentiment.\n\
    \n![](img/34fc7a4f84390d8018593d3039bbc7ef_125_0.png)\n\n+   * EditText. This\
    \ widget converts a TextView into an editable text field. This is the most basic\
    \ way to enter text information. Unique XML attributes for EditText include: \n\
    \n+   * Hint. Displays a recommendation for content. Frequently replaces a separate\
    \ TextView label for the field.\n\n+   * Lines. The number of vertical rows to\
    \ allow for content.\n\n+   * InputType. Defines an input method such as date,\
    \ phone number, password, and auto-complete or correct.\n\n+   * Text. The text\
    \ user enters or has entered into the control.\n\n+   * CheckBox. A check box\
    \ that can be one of two states: checked or unchecked. The XML checked attribute\
    \ indicates the checked state of the control.\n\n+   * RadioButton. Like a check\
    \ box, a radio button can be one of two states: selected or not. RadioButton also\
    \ uses the checked XML attribute. Unlike a check box, once selected a radio button\
    \ cannot be deselected. Radio buttons are most frequently used in RadioGroups—collections\
    \ of radio buttons."
