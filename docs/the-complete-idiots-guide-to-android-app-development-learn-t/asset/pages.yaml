  md: '# ContentProviders


    # Chapter

    18


    # In This Chapter


    +   * Intro to ContentProviders

    * Sharing data between apps

    * Querying other apps

    * Creating your own database


    There was no central point of access to a contacts database. It would then be
    up to each individual app to create and maintain its own set of contacts. Users
    could quickly find themselves lost, forced to juggle through multiple apps just
    to find a phone number.


    Android solves this problem with an elegant solution: ContentProviders. Providers
    enable apps to publish information they collect to other apps. This chapter explores
    how to use Providers to pull useful information from other apps into your own,
    as well as how to make your valuable information available to others.


    # Introduction to ContentProviders


    Each Android app receives its own unique user identification and data directory
    in /data/data/<Your Package Name>. This directory is secured, preventing all apps
    but your own from accessing it. If you think of the financial and banking apps
    you may have on your device, you can quickly see why this is a good policy.


    In order for an app''s content to be considered public or accessible to other
    apps, the app must supply a ContentProvider.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 320 Part 4: Increasing Your Application Scope


    # DEFINITION


    Provider collects and finds data, which it makes available to all apps. Android
    does not provide a common, central storage location, so Providers are the only
    way to exchange information between apps.


    Many of the Android core apps already supply Providers, some of which you already
    used with Intents. Here is a table with the most common ones:


    # Common Android ContentProviders


    | Provider | Included Data |

    |---|---|

    | Browser history | Bookmarks and browsing |

    | CallLog | Recent and missed calls |

    | ContactsContract | Contacts database |

    | MediaStore | Image, audio, and video files in the MediaStore index |

    | Settings | Device and OS settings |

    | UserDictionary | Words added by the user |


    # Provider Syntax


    You may recall from Chapter 5 that Android allows certain undefined Intents to
    be called against a URI, which are dial a contact:


    ```

    startActivity( new Intent ("android.intent.action.DIAL")

    Uri.parse("content://contacts/people/1") ) );

    ```


    This instructs Android to start the most appropriate Activity to dial with ID
    number 1. You are unlikely to use this hard-code URI in practice, because contact
    number 1 is different from device to device. In order to find the right contact
    to dial, you need to query the ContentProvider, using the syntax:


    ```

    content://<authority>/<data_path>/<id>

    ```'
