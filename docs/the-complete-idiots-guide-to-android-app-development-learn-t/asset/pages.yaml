  md: '# Quitting Time


    Few mobile apps actually have quit or exit buttons. It is usually implicit that
    by clicking the home or back keys the app will pause, effectively closing or switching
    to background mode. As a point in fact, the Android SDK does not even list a quit
    method. The Android OS handles app termination for you, so you can simply delete
    the Quit button.


    # The Least You Need to Know


    +   * Eclipse handles renaming and reorganization through a process called refactoring.

    * Styles can be applied to individual views only.

    * Themes apply to the whole app or an entire activity.

    * Menus provide quick access to core functions and are implemented similarly to
    other types of resources.

    * Preferences are a special kind of resource that Android manages, mostly automatically,
    to store and retrieve defined settings.'
