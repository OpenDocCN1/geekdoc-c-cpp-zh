  md: '# Chapter 7: Building Input and Output


    **ToggleButton.** Displays a checked state as a light indicator with checked state
    as “On” and unchecked as “Off.” A toggle’s primary attributes include:


    +   - **Checked.** Indicates whether the control is checked or unchecked.


    +   - **TextOn.** The text to display instead of “On.”


    +   - **TextOff.** The text to display instead of “Off.”


    +   - **Spinner.** Displays a drop-down list of values, one of which can be selected.
    Spinner’s unique XML attributes include:


    +   - **Entries.** An array of possible values for the list.


    +   - **Prompt.** The text to display at the top of the pick list.


    Using a combination of these widgets, you can build a robust view to input information.
