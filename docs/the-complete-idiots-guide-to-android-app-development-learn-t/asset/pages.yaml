  md: '# Chapter 18: ContentProviders


    +   * android:permission. A string value that indicates both read and write permission.
    A defined readPermission or writePermission will take precedence over this permission.


    +   * android:enabled. True if the system can instance the Provider, false if
    otherwise.


    +   * android:exported. True if components of other apps may use this Provider,
    false if the Provider is available only to its own app.


    +   * android:initOrder. If your app has multiple ContentProviders that have dependencies
    upon one another, you can specify the order in which they are loaded using integer
    values.


    +   * android:label. Specify a string resource as a friendly name for the kind
    of content provided. If empty, the label on the app is used by default.


    +   * android:multiprocess. True if the Provider can run in multiple processes,
    false if the Provider is limited to a single process. "False" is the default.


    +   * android:process. By default, all components of an app run in the same process,
    but each component can override this to specify a different process name to run.


    +   * android:grantUriPermissions. True if conditions allow clients read or write
    permissions if the client has not requested permission from their AndroidManifest.
    If true, read or write permission is possible for the entire Provider. If false,
    permission exceptions can only be granted to specific URI paths added as additional
    attributes to the grantUriPermissions tag. "False" is the default value.


    If you define permissions of any type, be sure to provide documentation for other
    developers to make it easy for other apps to incorporate your Provider’s content.


    You now have a functioning ContentProvider that other developers can incorporate
    into their apps. With a well-developed Provider, you can position your app to
    serve or augment the central repository of recipes, inspiring quotations, historical
    photos, or anything else you can imagine to develop.'
