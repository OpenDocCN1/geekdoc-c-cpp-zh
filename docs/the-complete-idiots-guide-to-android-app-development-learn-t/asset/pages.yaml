    # In This Chapter


    +   * Customizing your app by region and language

    * Translating content on the fly using Google''s translation servers

    * Preparing for critical changes in the Activity life cycle

    * Working with multi-touch


    Only in the last decade have users been able to buy cheap, portable devices that
    will work in almost any country in the world. Now, not only can you buy mobile
    Android phones that will operate worldwide, but you can write apps that will run
    on any Android phone, anywhere.


    In this chapter, you learn how to localize your app by language and region. Additionally,
    you learn how to cope with smaller changes in orientation, like switching between
    landscape and portrait mode. Finally, you sample some of the possibilities of
    multi-touch in Android.


    # Localization


    As the song goes, “it’s a small world after all.” With few exceptions, by publishing
    your app to the web, you have made it available to anyone from any country to
    download and enjoy. To provide the best possible experience to all your potential
    users, it is sometimes useful to customize the language and other resources your
    app uses to reach the broadest audience.


    Localization is the process of providing additional resources for your app so
    that it matches the language and region of its user. When users set up their Android
    devices,'
