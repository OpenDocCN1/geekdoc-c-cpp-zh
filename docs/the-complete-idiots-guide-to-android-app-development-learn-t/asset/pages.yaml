  md: "# Chapter 9: Search for It 159\n\nAs always, you will want to draft a spec\
    \ for implementing these new features begins by answering:\n\n+   - What content\
    \ from my app will be available to search?\n- How much of this will be available\
    \ to search from other apps?\n- How will my app allow users to control their privacy?\n\
    \n# PITFALL\n\n![](img/34fc7a4f84390d8018593d3039bbc7ef_172_0.png)\n\nWhenever\
    \ your app exposes information to other Android apps, you should always consider\
    \ the impact on a user's privacy. Many users consider their search history as\
    \ something that should be private by default. Always clearly communicate what\
    \ information is shared outside your app and provide a way for users to opt-out.\n\
    \nAfter you have decided what to search, it is time to implement the Search Manager\
    \ in your app. You will need to:\n\n+   1. Add a searchable configuration.\n2.\
    \ Add a searchable Activity.\n3. Add a control to the Activity to launch the search\
    \ dialog.\n\n# Create the Configuration\n\nConfiguration resources inform Android\
    \ which apps have incorporated search and where. For search, this file is usually\
    \ named searchable.xml and must be placed in the /res/xml project folder. You\
    \ are free to provide any name for the file, but it must include the <searchable>\
    \ tag and define the android:label attribute.\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<searchable\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:label=\"Simply Recipes Search\"\n    android:hint=\"Search for Your\
    \ Recipes and Ingredients\">\n</searchable>\n```"
