  md: '* Photo gallery manager

    * Audio and video playback with MediaPlayer and the Android JET media engine


    > **PITFALL**

    While the Android SDK supports all of these features, you cannot assume that specific
    features, like auto-focus or zoom, exist on all devices. Write your app code to
    check for features before attempting to use one that might not exist on a user''s
    device.


    Many of these features require *permission* to be declared in AndroidManifest
    using the syntax:


    `uses-permission android:name="android.permission.CAMERA" />`


    > **DEFINITION**

    **Permission** is the clearance that any Android features require from the user,
    like the device''s current GPS location. Permissions are defined in the manifest,
    and the user is prompted to accept or deny permission to the features after the
    app is installed.


    All of the multimedia functionality in Android is encapsulated in a few, concise
    classes.


    +   * The *Camera* class provides all the resources necessary to take pictures
    and switch to video recording.

    * The *MediaPlayer* class provides a way to play audio and video files and streams.

    * The *VideoView* class allows video playback inside a View.

    * *MediaRecorder* class offers a way to record audio and video.

    * The *SoundPool* class provides a way to play back dynamic sound effects.


    While the Android emulator can simulate playback from most of these classes, the
    emulator cannot simulate actual multimedia input. This means that the Camera and
    MediaRecorder classes will be quite limited in an emulated environment. In order'
