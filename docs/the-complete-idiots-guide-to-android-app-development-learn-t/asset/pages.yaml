    The foreground lifetime. Between onCreate() and onPause(), the Activity is at
    the top of the stack and is the activity in focus. Your app will frequently transition
    between these two methods, for every time the device goes to sleep and wakes up.


    # PITFALL


    ![](img/34fc7a4f84390d8018593d3039bbc7ef_94_0.png)


    Reserve complex operations on onCreate() and onStart(), which are called only
    once and a few times respectively. onResume() is likely called more times in the
    Activity life cycle. Frequently called methods should execute quickly.


    Each Activity life cycle has different attributes, including if they can be stopped
    by the programmer, once initiated. The following table provides an overview.


    # The Methods of the Activity Life Cycle


    | Lifetime | Method | Description | Killable? | Followed By |

    | --- | --- | --- | --- | --- |

    | Entire | onCreate() | Called when an activity is first started. Your activity
    layout should normally be placed in this method. onCreate() takes a bundle parameter,
    which can be used to restore the activity state if the activity is unexpectedly
    terminated. | No | onRestart() or |

    | Visible | onRestart() | Called after onStop() but before onStart() is called
    again. onStart() always follows. | No | onStart() |

    | Visible | onStart() | Called as the activity becomes visible. | No | onResume()
    or onStop() |

    | Foreground | onResume() | The activity has moved to the top of the Activity
    stack and is becoming interactive. | No | onPause() |


