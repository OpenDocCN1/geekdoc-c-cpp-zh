  md: '# 148 Part 2: Constructing Your Application


    > DEFINITION

    Arrays are systematic collections of objects, usually arranged serially in rows
    and columns.


    Java supports a number of types of collections. Traditional arrays are instantiated
    by defining:


    ```

    String[] newArray = {"Cake", "Pudding"};

    ```


    Which creates a single column array with two rows:


    ```

    newArray[0] = "Cake"

    newArray[1] = "Pudding";

    ```


    Arrays provide an easy way to serialize and deserialize data; they convert simple
    values into rows and columns that can be organized. Java also supports a powerful
    companion to traditional arrays, the ArrayList. These can be defined by naming:


    ```

    ArrayList<String> newArrayList = new ArrayList<String>();

    ```


    These lists are optimized array instances for a type, such as String or Integer;
    and they support additional methods:


    +   - add(). Places a reference to the ArrayList.

    - get(). Retrieves a reference from the ArrayList by index position.

    - size(). Returns the size of the ArrayList.

    - remove(). Removes the reference at the index position and shifts subsequent
    elements to the left.

    - indexOf(). Returns the index position of the first occurrence of the reference.

    - clear(). Removes all references from the ArrayList.


