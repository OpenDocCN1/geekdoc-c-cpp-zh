  md: "```\nreturn db.update( _RecipesTable, values, _IdColumn + \" = \" + \nrowId,\
    \ null);\n```\n\nYou have a set of seven methods—open(), close(), addRecipe(),\
    \ deleteRecipe(), getAllRecipes(), getRecipe(), and updateRecipe—which you can\
    \ conveniently call to instantly execute these actions on the database. You will\
    \ likely want more than these, and there will be times when you need to interact\
    \ directly with the database object. Using these as a starting point, you can\
    \ easily build your own and modify them to your specific needs.\n\n# More SQL\
    \ Detail\n\nFrom the functions you just created, you may have noticed that the\
    \ query() method in particular requires quite a few parameters, for most of which\
    \ you used null. As Android must convert all database interactions into valid\
    \ SQL statements before passing them to the database, the methods on the SQLiteDatabase\
    \ class provide you a way to modify the SQL without using true.\n\nThe query()\
    \ method corresponds to the Select statement, which is arguably the most sophisticated\
    \ statement in SQL. A Select statement has six primary clauses, which can be used\
    \ to refine what data is returned and how that data is formatted. All clauses\
    \ are required, but they must be listed in order:\n\n+   1. SELECT. Required.\
    \ Defines which columns to return in the result set. \"*\" indicates all columns\
    \ should be included.\n\n+   2. FROM. Required. Defines which table or tables\
    \ to perform the select on. Can be used in conjunction with a JOIN clause to specify\
    \ relationships between tables.\n\n+   3. WHERE. Limiting conditions to apply\
    \ to the select in order to reduce the set of results to specify criteria.\n\n\
    +   4. GROUP BY. Specifies repeating values to group together. Required if using\
    \ aggregate functions like COUNT() or SUM().\n\n+   5. HAVING. Used only with\
    \ a GROUP BY clause. Used to limit the result set based on how values are grouped.\n\
    \n+   6. ORDER BY. Specifies ascending or descending order by column for the result\
    \ set."
