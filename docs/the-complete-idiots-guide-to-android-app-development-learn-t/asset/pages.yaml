  md: '# Chapter 2: Building for Android 29


    Eclipse projects are not required to use the emulator from the DDMS perspective.
    Once you have created your AVD, you can start the emulator from the menu Window
    > Android SDK and AVD Manager and then Window > Open Perspective > Other > DDMS
    (on Windows) or Window > Open Perspective > DDMS (on Mac).


    # DEFINITION


    Dalvik Debug Monitor Service (DDMS) acts as a middle man between your real or
    simulated device and Eclipse. Android allows for every process to be monitored
    in debug mode, and DDMS provides the infrastructure to both passively listen to
    Android apps as well as actively communicate with them.


    The most obvious advantage to using DDMS is the level of simulated hardware interaction
    it enables. With DDMS, you can spoof location information, sending GPS coordinates
    to your device. It also enables voice and data signal simulation, interaction
    with a simulated camera, and screenshots of the device display.


    While the DDMS perspective offers advanced features not possible in the standard
    Eclipse debug perspective, it cannot overcome some of the principle limitations
    of running Android in an emulated environment. These are some of the practical
    limitations of an emulated device:


    +   * The emulator is not a real device. In generic ways, it can recreate the
    behavior of a physical phone or TV, but existing consumer devices are too varied
    to be represented by a single emulator.

    * All signal information is simulated. Proximity sensors, location data, Wi-Fi
    and tower connection, accelerometer, calls, and SMS messages are entirely simulated.

    * Peripheral support is not yet fully implemented. This includes Bluetooth and
    camera support, as well as some aspects of USB support.


    As versatile and robust as the emulator, it cannot replace testing with a physical
    Android device.


    Congratulations! You have taken the Android development toolkit and used it to
    create and run an application on an emulated environment, running Hello World
    in standard and debug mode. Taking your project forward into the next chapter,
    you will leave Hello World behind for more sophisticated and exciting opportunities
    in Android OS.'
