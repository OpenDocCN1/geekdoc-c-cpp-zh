  md: '# Chapter

    11


    # Cameras and Media


    In This Chapter


    +   - Using the camera to take a photo

    - Recording audio and video

    - Working with multimedia files

    - Embedding media playback


    Can you remember the last mobile phone you bought that did not include a camera?
    Even the free with contract phones from most carriers include cameras, multimedia
    apps to play audio and video, and photo gallery apps to browse and share photos.
    Most current and next generation Android phones come with powerful High Definition
    (HD) cameras, HD displays, and a suite of powerful multimedia apps to take advantage
    of both. This chapter guides you through the basics of deing the camera, working
    with photos, and using audio and video media to enhance your app.


    # Introduction to Multimedia on Android


    The Android SDK implements support for a variety of hardware and software features
    that enable apps to both capture input and display stored and captured media.
    Every Android device is different, but the SDK supports all of these features:


    +   - Camera with auto-focus, zoom, color balance, and flash

    - Video recording from camera

    - Audio recording from microphone'
