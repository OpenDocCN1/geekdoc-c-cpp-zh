  md: '# The Complete Idiot''s Guide to Android App Development


    The steps of instructions are formatted in **bold**. For example, to create a
    new Android project in Eclipse, select **File > New > Android Project** from the
    menu.


    # How This Book is Organized


    This book is divided into five parts. The first few chapters introduce Android
    and its capabilities, the preferred developer tools, and the Android SDK, which
    you use as the basis for your app development. Once you have your first app built
    and running, the chapters introduce laying out your app, working with resources,
    and building user interfaces. As you become comfortable working with screens and
    widgets, how to learn to incorporate hardware features like the camera and location
    services. After you have explored localization and databases, you will be ready
    to prepare your app for the Android Market.


    **Part 1: Getting Started.** Here you download the Android SDK and developer tools
    to begin your apps. Get acquainted with Eclipse and the Android emulator, tools
    you use in every step of the process. You write your first app and explore Java
    and the Android SDK.


    **Part 2: Constructing Your Application.** Accelerate the development of your
    user interfaces with animations and dialogs. You learn how to store and retrieve
    information, and how to provide search capability. Fundamental concepts in user
    interaction are covered in this part.


    **Part 3: Make the Most of the Hardware.** Android devices are chock full of powerful
    hardware features. From location services to Bluetooth and cameras to 3D animation,
    you learn how to allow your app to make the most of its physical device.


    **Part 4: Increasing Your Application Scope.** One of your goals as an app developer
    is probably to reach as large an audience as possible. This part demonstrates
    how to localize your app for different languages and regions, store data more
    efficiently, and how to enable your app to communicate with other Android apps.


    **Part 5: Taking Your App to Market.** If you have started app development, you
    likely want to be able to distribute your app. The Android Market is the largest
    Android app storefront in the world, and this part takes you through the process
    of preparing your app for Market. By fixing errors through debugging and testing
    your app, you will be ready to begin the process of submitting your app for public
    consumption.'
  merge: -1
