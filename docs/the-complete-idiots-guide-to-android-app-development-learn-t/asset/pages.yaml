  md: "# Styling Your App\n\nThe first draft of your About page looks good, but it\
    \ could use some flair. Much of the process of editing the look and feel of an\
    \ Android app is quite similar to changing styles in HTML and Cascading Style\
    \ Sheets (CSS). You can modify the style or theme of the entire app, then define\
    \ the aesthetics of each activity, each level of view, down to the individual\
    \ widgets.\n\n# Selecting a Theme\n\nAndroid references a collection of visual\
    \ settings as a *style*. Styles can be applied to Views and ViewGroups. All child\
    \ objects within the view will inherit the style, but child Views do not. A style's\
    \ scope is limited to the view in which it is applied. To cascade styles down\
    \ a view hierarchy, use a *theme*. Themes must be defined in the Android Manifest\
    \ for their scope.\n\n![](img/34fc7a4f84390d8018593d3039bbc7ef_78_0.png)\n\n>\
    \ DEFINITION\nA style** is a template of property definitions including width,\
    \ height, font color and size, background color, and more.\nA theme** is a style\
    \ when applied to an entire activity or the whole app.\n\nThe Android SDK includes\
    \ a number of default styles and themes, which you can use immediately. Open AndroidManifest.xml\
    \ and add style tags to the entire app.\n\nAdd android:theme=\"@android:style/Theme.Light\"\
    \ into the `<application>` definition:\n\n```\n<application android:icon=\"@drawable/icon\"\
    \n    android:label=\"@string/app_name\"\n    android:debuggable=\"true\"\n  \
    \  android:theme=\"@android:style/Theme.Light\">\n```\n\nNow change the theme\
    \ of the About app by adding android:theme=\"@android:style/Theme.Dialog\" into\
    \ the `<activity>` definition:\n\n```\n<activity\n    android:name=.About\"\n\
    \    android:label=\"@string/about_header\"\n    android:theme=\"@android:style/Theme.Dialog\"\
    >\n</activity>\n```"
  merge: -1
