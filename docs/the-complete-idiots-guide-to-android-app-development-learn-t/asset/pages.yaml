  md: '# Wi-Fi vs. 3G


    In many cases, you won''t actually care how the device connects to the Internet.
    You simply want to be able to test for connectivity and get about the rest of
    your work. There are cases, however, where it makes sense to distinguish between
    the two primary ways a device can get "online".


    First, carriers limits how much data individual apps are allowed to transmit over
    their data networks. Skype, for example, is still limited to running in Wi-Fi-only
    mode on several carriers. Second, not all users have unlimited data plans, which
    means these users will prefer not to use carrier data as they approach their monthly
    data limits.


    Android provides two system service classes—ConnectivityManager, which manages
    data access to both the carrier network and Wi-Fi, and WifiManager, which manages
    the state of Wi-Fi. You will need the following permissions to access the Internet.


    +   * INTERNET. Permits the app to access the Internet.

    * ACCESS_NETWORK_STATE. Permits read access to the connection state.

    * CHANGE_NETWORK_STATE. Permits modify access to the connection.

    * ACCESS_WIFI_STATE. Permits read access to the Wi-Fi state.

    * CHANGE_WIFI_STATE. Permits modify access to the Wi-Fi state.


    The ConnectivityManager is instantiated from the system service:


    ```

    ConnectivityManager _ConnectivityManager = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE\);

    ```


    Inside the ConnectivityManager class, the following methods are available:


    +   * getActiveNetworkInfo(). Returns information about active network interfaces.

    * getAllNetworkInfo(). Returns information about all network interfaces.

    * getBackgroundDataSetting(). Returns true if background data usage is enabled;
    false if otherwise.

    * getNetworkInfo(). Returns network info by type (Mobile, Wi-Fi, WiMAX).'
