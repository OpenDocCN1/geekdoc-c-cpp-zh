    a rating appropriate for your app.


    As soon as you click agreement to the terms and click Publish, your app will be
    available in the Market. Of course, if your app is very large, this may take a
    few seconds to upload, but in Android Market terms, a completed upload equals
    publication.


    Congratulations! You are now a published Android developer!


    # Next Steps


    You probably already have designs planned for the next big version of your app,
    but you also need to follow your app in the Market. The two most effective ways
    to improve your app standing—its rating and number of downloads—are to update
    frequently and connect with your users.


    Frequent, meaningful updates improve your app''s listing in the recently updated
    Market views. This increases your app''s exposure and can attract new users. As
    long as your updates introduce a new feature or address a minor bug, you can steadily
    improve your standing.


    One of the challenges of the new app Markets is anonymity. Unlike the designs
    of shopping for software with a salesperson, downloading an app is an extremely
    impersonal affair for a user. When users comment on your app in the Market, it
    opens the door to real person-to-person communication—a scarce good.


    React regularly and positively to constructive (and sometimes negative) comments.
    This will establish a rapport between you and your users, which can increase your
    app standing and provide valuable insight on ways to improve your app for your
    fans. Remember that no matter how excellent your app may be, nonconstructive negative
    comments happen to everyone—and you don''t necessarily have to respond to them.'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Chapter 21: App Markets and Beyond 365


    # Advertising


    The vast majority of mobile apps are free to download and use, but this does not
    mean that you, as a developer, cannot profit from the time that you have invested
    creating your app by making it freely available. Several advertising service tools
    are for integrating ads in the mobile experience.


    +   * GoogleSense

    * Google AdMob

    * Microsoft Adverter

    * Bidvertiser

    * Mobclix

    * Flurry


    Google''s AdMob is a prime candidate for integrating advertising within your app,
    but the advertising space is diverse and growing rapidly.


    How does mobile advertising work in practice? Almost all of the providers define
    ways to delegate some portion of your app''s screen space for the display of an
    advertisement. The syntax is usually provided for you to simply copy-and-paste
    into your app.


    Whenever you run your app, if they have an Internet connection when viewing the
    screens you have delegated for ads, advertisements will automatically appear in
    that space. As a developer, you receive payment based on the number of ads your
    users click.


    Both you and the advertisers have access to the click history. This enables you
    to alter the placement of the ads to generate more clicks, and it gives advertisers
    information that informs decisions about what kinds of ads to serve to different
    apps.


    As a developer, you want to optimize your app experience for your users. Responding
    to feedback will be critical in determining how, when, and where or even if to
    place ads within your app.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# The Next Generation


    Another the many golden rules of programming is that as soon as you finish your
    app, it is already obsolete. Rather than dismay you, this should inspire you.
    It means that new products and features have inspired users to use apps in new
    ways, expecting bigger and better things from their devices. You can look at development
    as a constant challenge to keep up with or stay ahead of technological progress.


    Most of the focus of this book has been placed on Android phones, but the operating
    system has bigger dreams. In November 2010, Samsung released one of the first
    mainstream Android tablets, the Galaxy Tab. Barnes & Noble released the latest
    NookEReader, an Android device. Acer, Dell, HTC, and others have announced plans
    for Android-based tablets.


    Google has been optimizing Android for tablets, most recently Android 3.0, code-named
    Honeycomb, which means new APIs and more consumer devices.


    Furthermore, mobile phone technology is advancing rapidly. The next generations
    of devices will feature dual cameras, faster network connections, more sensors,
    and mobile payment technology. 3D displays will be here by the end of 2011.


    Lastly, Google TV intends to put Android-capable devices inside of or attached
    to TVs in every living room. This brings great promise to the Android platform
    and its future.


    # Keep in Touch


    As I have mentioned a few times throughout the book in passing, the entire source
    code for all the content in this book is available for download, both by chapter
    as a zipped Eclipse project and the complete source at the site. http://goo.gl/GqGGr.
    If you have any issues or questions, submit them on the site. I will make every
    effort to answer them, and hopefully we can all learn from each other.


    Thank you for reading, and may the wind always be at your back!'
  merge: -1
  pgno: 379
