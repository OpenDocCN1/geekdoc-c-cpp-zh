  md: '# Part 4: Increasing Your Application Scope


    If a user has selected French or Spanish as a default language, he will see the
    corresponding value as the name of the app. All other values default to those
    defined in the default resource folder `/res/values`.


    # PITFALL


    While you can specify a language without a locale, as in `/res/values-fr/string.xml`,
    you cannot specify a locale without a language. A resource named `/res/values-FR/strings.xml`
    would generate a compilation error. Locales require a language identifier; languages
    do not require a locale.


    If you do not provide the default resources, it is easy to generate fatal errors
    for your users. You could define your app''s name only in `/res/values-en`. Your
    app would work perfectly for all English-speaking users, but as soon as German
    attempted to load your app, they would receive a fatal error. It is best to first
    define all possible resources in the default locations and build out support for
    other locales.


    # Alternate Resources


    The default, or root, resource qualifiers are those with the least specificity
    in their names. For drawables, this will be `/res/drawable`, as drawable has the
    least possible definition. Android does not assume that the resources in these
    locations will be for U.S. English—these could contain content for any locale
    or language.


    You probably do not need to support more than English or your native language
    for the first version of your app. As you start collecting feedback from users,
    you will have the data needed to design a localization strategy. You can use the
    data to make the following decisions for your app:


    +   1. Which languages and locales does your application need to support? Only
    support these groups until you have time and resources and user demand more.


    +   2. Which language and locale will be your default? If U.S. English is your
    default country and language, everything in your default resources should target
    these.


    +   3. What content will your app display if you have not provided localization
    for a language or locale? Will you evaluate a user''s language and region in order
    to display something other than the default resources?'
