  md: '# 3D Graphics and

    Animation


    # In This Chapter


    +   - Introducing OpenGL ES

    - Understanding key terms and classes

    - Creating a surface for 3D

    - Modeling an object in 3D


    Almost two decades ago, films like Jurassic Park had just begun to popularize
    the use of three-dimensional, computer-generated images—a technique that required
    numerous supercomputers to complete the animation. Most modern smartphones now
    have the graphics hardware to render effects and animation that just recently
    required “super” computers.


    This chapter introduces the software and hardware rendering capabilities of Android
    devices. You learn the key terminology and syntax for creating three-dimensional
    objects and animation.


    # Introduction to 3D Graphics


    While 3D televisions, games, and films have recently resurged in popularity, 3D
    in the context of graphic design does not mean that the images are holographic
    or require special glasses. Instead, 3D graphics simply create the illusion of
    depth. Shadows, wrinkles, and contours can add all depth of field, making an image
    or graphic seem to occupy a real space.


    Android implements 3D graphics through the OpenGL (Open Graphics Library), which
    was first developed by Silicon Graphics. OpenGL provides a platform-neutral'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'API for rendering 2D and 3D graphics, mainly targeting desktop and game systems.

    The Kronos Group manages a subset of OpenGL known as OpenGL ES (OpenGL for Embedded
    Systems), which is optimized for mobile devices. As of Android OS 2.2, OpenGL
    ES 1.0 is fully implemented, and many OpenGL ES 2.0 APIs have been included.


    Although OpenGL ES is optimized for mobile devices, advanced 3D rendering still
    requires a processor capable of drawing complex graphics. With as other Android
    hardware, you cannot assume that all devices are created equal. Devices without
    high-performance processors will be able to render some level of detail and quality,
    so it is good practice to make the complexity of your graphics configurable by
    the user.


    # OpenGL Basics


    Many apps require few any fancy graphics and can use Android''s built-in animations
    to look feel polished and professional. On the other hand, apps like Google Earth
    depend on three dimensionalities in order to deliver the core experience. Even
    if you do not need 3D in your app today, you should know what Android is capable
    of delivering.


    If you have developed 3D models before, you will already be comfortable with the
    core terminology. Otherwise, familiarize yourself with the following keys:


    +   - Vertex. A vertex is a single point in three-dimensional space and is the
    starting point for many objects. A vertex can have as few as two coordinates (X,Y)
    and as many as four (X,Y,Z,W). If omitted, the W axis has a default value of 1.0
    and the Z axis has a value of 0. Unless otherwise noted, a point and vertex are
    synonymous.

    - Triangle. A triangle is composed of three points or vertices.

    - Polygon. A polygon is an object that has at least three connected points. A
    triangle is also a polygon.

    - Primitives. Primitives are 3D objects composed of either triangles or polygons.


    OpenGL rendering depends on two core classes. First, GLSurfaceView, which is an
    implementation of the SurfaceView class. This is the view upon which the object
    is drawn. Android decouples the thread for the OpenGL object, which means the
    GLSurfaceView requires explicit onPause() and onResume() life cycle methods. The'
  merge: -1
