    * 乘法运算符位于 + 加法运算符所在行的上方——因此在表达式 a=6+b*3 中，乘法在加法操作之前完成。\n\n![](img/db19f3858a1e321646bf2590afd29547_100_1.png)\n\
    \n-> 和 . 结构体运算符将在本书后面描述，但在此包含以提供所有运算符的完整优先级表。\n\n- 1. 使用预处理器指令开始一个新程序以包含标准输入/输出库函数\n\
