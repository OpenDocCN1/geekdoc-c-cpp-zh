    | %W | week number of the year (Monday as the first day of the week), 00-53 |

    | %x | local date representation |

    | %X | local time representation |

    | %y | year without century, 00-99 |

    | %Y | year with century |

    | %Z | time zone name, if available |


    ## Jump functions


    <setjmp.h>


    The **setjmp.h** header is used for controlling low-level calls and provides a
    means to avoid the normal call and return sequence.


    | Function | Description |

    |---|---|

    | `int setjmp( jmp_buf env )` | Low-level function used in conditional tests to
    save the environment in the *env* variable, then return zero |

    | `void longjmp( jmp_buf env , int value )` | Restores an environment that has
    been saved in the *env* variable by `setjmp()`, as if `setjmp()` had returned
    the *value* |


    ## Signal functions


    <signal.h>


    The signal.h header contains functions for handling exceptional conditions that
    may arise during the execution of a program:


    ```

    void (*signal ( int sig , void (*handler) ( int ))) ( int )

    ```


    The signal() function specifies how subsequent signals will be handled. The handler
    can be SIG_DFL, an implementation-defined default; or SIG_IGN, to ignore the signal.
    Valid sig signals include:


    - SIGABRT : abort termination

    - SIGFPE : arithmetic error

    - SIGILL : illegal instruction

    - SIGINT : external interruption

    - SIGSEGV : access outside memory limit

    - SIGTERM : termination request sent to the program


    The function returns the previous value of the handler for that specific signal,
    or SIG_ERR if an error occurs. When a sig signal next occurs, the signal is restored
    to its default behavior then the signal handler is called. If this returns, execution
    resumes at the point where the signal occurred


    ```

    int raise( int sig )

    ```


    Attempts to send the sig signal to the program and returns a non-zero value if
    the attempt is unsuccessful


