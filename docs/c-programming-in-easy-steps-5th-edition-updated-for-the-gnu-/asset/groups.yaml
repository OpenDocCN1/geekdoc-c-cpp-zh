    \n```\nreturn 0 ;\n```\n\n保存程序文件，然后编译并执行该程序，以查看输入字符串的验证结果。\n\n![](img/db19f3858a1e321646bf2590afd29547_172_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_172_1.png)\n\n**isdigit()** 测试也可以这样表示：**isdigit()\
