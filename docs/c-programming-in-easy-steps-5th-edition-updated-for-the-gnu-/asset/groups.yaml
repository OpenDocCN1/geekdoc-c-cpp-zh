    \n- 4. 在主函数块末尾，按照函数声明的要求返回零整数值\nreturn 0;\n\n- 5. 保存程序文件，然后编译并执行程序，以查看逻辑运算的结果\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_86_0.png)\n\n请注意，0 && 0 返回 0（假）——这印证了“两个错误不能凑成一个正确”这一说法。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_86_1.png)\n\n## 检查条件\n\nC 程序员最喜欢的测试运算符可能是\
    \ ?: 条件运算符，也称为“三元”运算符。该运算符首先求一个表达式的真或假布尔值，然后根据求值结果执行两个给定语句之一。\n\n![](img/db19f3858a1e321646bf2590afd29547_87_0.png)\n\
    \n条件运算符的语法如下：\n\n```\n(test-expression) ? if-true-do-this : if-false-do-this ;\n\
    ```\n\n例如，该运算符可用于通过检查一个数除以二后是否有余数来判断给定数字是奇数还是偶数，然后输出适当的字符串，如下所示：\n\n```\n(7 %\
    \ 2 != 0) ? printf(\"Odd Number\") : printf(\"Even Number\");\n```\n\n在本例中，七除以二不会留下零余数——因此该表达式求值为真；所以执行第一条语句，正确地将该数字描述为奇数值。\n\
    \n条件运算符还可用于确保输出中关于单数和复数项的语法正确，从而避免像“There is 5”这样别扭的短语。只需在 printf 语句内进行求值，即可使用合适的版本：\n\
    \n```\nprintf(\"There %s %d\", (num == 1) ? \"is\" : \"are\", num);\n```\n\n在本例中，当\
    \ num 变量的值确实为一时，将使用“is”版本；否则将使用“are”版本。\n\n条件运算符还可用于根据求值结果向变量分配适当的值。以这种方式使用时，其语法如下：\n\
    \n```\nvariable = (test-expression) ? if-true-assign-this : if-false-assign-this\
    \ ;\n```\n\n例如，该运算符可用于判断一个给定数字是否大于另一个数字，然后将较大的数字赋给变量，如下所示：\n\n```\nint num, a\
    \ = 5, b = 2;\nnum = (a > b) ? a : b;\n```\n\n在本例中，变量 a 的值大于变量 b 的值，因此将较大的值 5\
    \ 赋给 num 变量。\n\n![](img/db19f3858a1e321646bf2590afd29547_88_0.png)\n\n尽管条件运算符快速且易于使用，但它可能降低代码可读性。\n\
    \n- 1 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n```\n#include <stdio.h>\n```\n\n- 2 添加一个主函数，声明并初始化单个整型变量\n\
    \n```\nint main()\n{\nint num = 7;\n}\n```\n\n- 3 接下来，在主函数块中，插入条件语句以输出变量的奇偶性\n\
    \n```\n(num % 2 != 0) ? printf(\"%d is odd\\n\", num) : printf(\"%d is even\\\
    n\", num);\n```\n\n```\nconditional.c\n```\n\n- 4. 现在，插入条件语句以输出使用正确复数语法的短语\n\n\
    ```c\nprintf( \"There %s \" , ( num == 1 ) ? \"is\" : \"are\" ) ;\nprintf( \"\
    %d %s\\n\", num, (num==1) ? \"apple\" : \"apples\" ) ;\n```\n\n- 5. 减小变量值，然后插入条件语句以输出符合单数形式的短语\n\
    \n```c\nnum=1;\nprintf( \"There %s \" , ( num == 1 ) ? \"is\" : \"are\" ) ;\n\
    printf( \"%d %s\\n\", num, (num==1) ? \"apple\" : \"apples\" ) ;\n```\n\n- 6.\
    \ 在主函数块末尾，按照函数声明的要求返回零整数值\n\n```c\nreturn 0 ;\n```\n\n- 7. 保存程序文件，然后编译并执行程序，以查看条件运算的结果\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_89_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_89_1.png)\n\
    \n条件运算符最适合用于只提供两个简单替代方案来实现的简洁语句。\n\n## 测量大小\n\n在 C 编程中，sizeof 运算符返回一个整数值，即在其操作数的内容存储到内存中所需的字节数。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_90_0.png)\n\n当提供给 sizeof 运算符的操作数是数据类型名称（例如\
    \ int）时，该操作数必须括在圆括号中——就像前面列出的示例一样。\n\n或者，当提供的操作数是数据对象名称（例如变量名）时，圆括号可以省略。在实践中，许多程序员总是将\
    \ sizeof 运算符的操作数括在圆括号中，以避免必须记住这一区别。\n\nC 中的基本存储单元由 char 数据类型定义，它在一个字节的内存中存储单个字符。这意味着\
    \ sizeof(char) 将返回 1（1 字节）。\n\n通常，int 和 float 数据类型将各自分配 4 字节的机器内存，而 double 数据类型通常将分配\
    \ 8 字节的机器内存，以容纳其可能值的范围。然而，这些大小并非由标准定义，而是由实现定义，因此可能有所不同。因此，良好的做法是使用 sizeof 运算符来测量实际的内存分配，而不是假定会分配这些典型大小。\n\
    \n为数组变量分配的内存空间就是该数据类型所分配的字节数乘以该数组中的元素数量。因此，例如，表达式 sizeof(int[3]) 通常会返回 12（3 x\
    \ 4）\n"
