  mdcn: "\n\n## 9 构建结构体\n\n_本章介绍“struct”结构体和“union”抽象数据类型，并演示如何在 C 程序中使用它们将多个不同类型的变量组合在一起。_\n\
    \n- 在结构体中分组\n- 定义类型结构体\n- 在结构体中使用指针\n- 指向结构体\n- 向函数传递结构体\n- 在联合体中分组\n- 分配内存\n\
    - 小结\n\n### 在结构体中分组\n\nC 程序中的结构体可以包含一个或多个相同或不同数据类型的变量。这些变量组合在单个结构体中，可以方便地通过其名称引用。结构体内的变量称为其“成员”。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_178_0.png)\n\n将相关变量组合在结构体中有助于组织复杂的数据，尤其是在较大的程序中。例如，可以创建一个结构体来描述工资记录，其中包含用于存储员工姓名、地址、薪金、税额等的变量。\n\
    \n在 C 程序中使用 struct 关键字声明结构体，后跟一个给定的名称以及包含变量成员的花括号。最后，结构体声明必须在右花括号后以分号结束；因此，一个包含描述图中点\
    \ x 和 y 坐标成员的结构体可以像这样：\n\n```c\nstruct coords\n{\n    int x ;\n    int y ;\n};\n\
    ```\n\n可选地，可以在结尾分号之前以逗号分隔列表的形式包含“标签”名称。实际上，结构体声明定义了一种新的数据类型，标签名的作用类似于该数据类型的变量。例如，可以这样声明一个数据类型为“coords”、名为“point”的变量：\n\
    \n```c\nstruct coords\n{\n    int x ;\n    int y ;\n} point ;\n```\n\n然后，可以通过在标签名后附加“.”运算符和成员名来引用每个结构体成员，例如\
    \ point.x。\n\n此外，可以使用现有结构体的名称来声明新的结构体变量，该新变量将继承原始成员的特性。例如，基于名为“coords”的结构体创建一个名为“top”的新结构体变量，其成员为\
    \ top.x 和 top.y，声明如下：\n\n```c\nstruct coords top ;\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_179_0.png)\n\
    \n结构体的变量成员不能在 struct 声明中立即初始化。\n\n![](img/db19f3858a1e321646bf2590afd29547_179_1.png)\n\
    \n通常，struct 声明会出现在 C 程序的 main() 函数之前。\n\n- 1. 使用一条预处理指令开始新程序，以包含标准输入/输出库函数\n\n\
    ```c\n#include <stdio.h>\n```\n\n- 2. 声明一个包含两个成员和一个标签的结构体\n\n```c\nstruct coords\n\
    {\n    int x;\n    int y;\n} point;\n```\n\n然后，创建该结构体的另一个实例\n\n```c\nstruct coords\
    \ top ;\n```\n\n接下来，添加一个 main 函数，初始化每个结构体的两个成员\n\n```c\nint main()\n{\n    point.x\
    \ = 5 ; point.y = 8 ;\n    top.x = 15 ; top.y = 24 ;\n}\n```\n\n现在，输出存储在结构体每个成员中的值\n\
    \n```c\nprintf(\"\\n point x: %d, point y: %d\\n\", point.x , point.y );\nprintf(\"\
    \\n top x: %d, top y: %d\\n\", top.x , top.y );\n```\n\n在 main 函数块末尾，按函数声明要求返回一个零整数值\n\
    \n```c\nreturn 0 ;\n```\n\n保存程序文件，然后编译并执行程序，以查看存储在结构体成员中的值\n\n![](img/db19f3858a1e321646bf2590afd29547_180_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_180_1.png)\n\n### 定义类型结构体\n\n通过在结构体声明的最开始处添加\
    \ typedef 关键字，可以将结构体定义的数据类型声明为实际的数据类型定义。这会将结构体标识为原型，其他结构体可以仅使用其任意标签名即可声明，而无需 struct\
    \ 关键字。\n\n使用 typedef 通常有助于简化代码，因为在声明结构体定义的数据类型的变量时无需 struct 关键字。不过，将标签名大写是很有帮助的，这样很容易识别为结构体定义的数据类型。\n\
    \n在声明结构体定义的数据类型的变量时，可以选择使用花括号内的逗号分隔列表为所有成员赋值，从而初始化这些成员。\n\n结构体也可以嵌套在其他结构体内。在这种情况下，使用两个“.”点运算符引用单个成员，语法为\
    \ 外层结构体.内层结构体.成员。\n\n- 1. 使用一条预处理指令开始新程序，以包含标准输入/输出库函数\n\n```c\n#include <stdio.h>\n\
    ```\n\n- 2. 声明一个未命名结构体，定义一个具有两个成员和一个标签的数据类型\n\n```c\ntypedef struct\n{\nint x;\n\
    int y;\n} Point;\n```\n\n- 3. 然后，创建两个该结构体定义的数据类型的变量，并初始化其中一个变量的两个成员\n\n```c\n\
    Point top = { 15 , 24 } ;\nPoint btm ;\n```\n\n- 4. 接下来，添加一个 main 函数，初始化该结构体定义的数据类型的另一个变量的两个成员\n\
    \n```c\nint main()\n{\n    btm.x = 5 ;\n    btm.y = 8 ;\n}\n```\n\n- 5. 现在，输出两个点的坐标\n\
    \n```c\nprintf( \"\\nTop x: %d, y: %d\\n\" , top.x , top.y ) ;\nprintf( \"Bottom\
    \ x: %d, y: %d\\n\" , btm.x , btm.y ) ;\n```\n\n- 6. 在 main 函数块之前，插入第二个结构体，定义一个具有两个嵌套结构体成员的数据类型\n\
    \n```c\ntypedef struct\n{\n    Point a ;\n    Point b ;\n} Box ;\n```\n\n- 7.\
    \ 接下来，声明第二个结构体定义的数据类型的一个变量，并初始化其所有成员\n\n```c\nBox rect = { 6 , 12 , 30 , 20 }\
    \ ;\n```\n\n- 8. 回到 main 函数块中，输出嵌套结构体成员中包含的所有点的坐标\n\n```c\nprintf( \"\\nPoint\
    \ a x: %d\" , rect.a.x ) ;\nprintf( \"\\nPoint a y: %d\" , rect.a.y ) ;\nprintf(\
    \ \"\\nPoint b x: %d\" , rect.b.x ) ;\nprintf( \"\\nPoint b y: %d\\n\" , rect.b.y\
    \ ) ;\n```\n\n- 9. 在 main 函数块末尾，按函数声明要求返回一个零整数值\n\n```c\nreturn 0 ;\n```\n\n-\
    \ 10. 保存程序文件，然后编译并执行程序，以查看存储在结构体成员中的值\n\n![](img/db19f3858a1e321646bf2590afd29547_183_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_183_1.png)\n\n请注意，结构体本身无需命名，因为重要的是标签名。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_183_2.png)\n\n结构体成员只能在变量声明中使用逗号分隔列表进行初始化——之后必须逐个初始化。\n\
    \n### 在结构体中使用指针\n\n在结构体中使用字符指针作为字符串容器，比使用字符数组实现相同目的更有优势。\n\n只有在声明 char 数组时，才能将一整条字符串赋给它。之后若要通过\
    \ = 运算符将字符串赋给结构体中的 char 数组，唯一的方法是逐个元素地赋单个字符。\n\n在每次赋值中，= 运算符左侧的值称为“左值（L-value）”，表示内存位置；而\
    \ = 运算符右侧的值称为“右值（R-value）”，表示要读入该位置的数据。\n\nC 编程中一条重要规则是：右值不能出现在 = 运算符的左侧。而左值则可以出现在\
    \ = 运算符的任一侧。\n\nchar 数组的每个单独元素都是左值，可以被赋一个单独的字符；但 char 指针也是左值，在该指针被声明后，可以给它赋一整条字符串。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_184_0.png)\n\n左值是对象，而右值是数据。\n\n- 1.\
    \ 使用一条预处理指令开始新程序，以包含标准输入/输出库函数\n\n```c\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_184_1.png)\n\
    \nstrmbr.c\n\n- 2. 接下来，声明一个未命名结构体，定义一个具有单个字符数组成员和一个标签名的数据类型\n\n```c\ntypedef struct\n\
    {\n    char str[5];\n} ArrType ;\n```\n\n- 3. 现在，声明一个未命名结构体，定义一个具有单个字符指针成员和一个标签名的数据类型\n\
    \n```c\ntypedef struct\n{\n    char *str;\n} PtrType ;\n```\n\n- 4. 然后，为每种结构体定义的数据类型各声明一个变量，并初始化每个变量的单个成员\n\
    \n```c\nArrType arr = { 'B', 'a', 'd', '\\0', '\\0' };\nPtrType ptr = { \"Good\"\
    \ };\n```\n\n- 5. 接下来，添加一个 main 函数，输出变量字符数组成员中的字符串值\n\n```c\nint main()\n{\n \
    \   printf( \"\\nArray string is a %s\", arr.str );\n}\n```\n\n- 6. 在 main 函数块中，繁琐地为字符数组的每个元素赋新值，并输出新的字符串值\n\
    \n```c\narr.str[0] = 'f';\narr.str[1] = 'd';\narr.str[2] = 'e';\narr.str[3] =\
    \ 'a';\narr.str[4] = '\\0';\nprintf( \"%s\\n\", arr.str );\n```\n\n- 7. 接下来，输出变量字符指针成员中的字符串值\n\
    \n```c\nprintf( \"\\nPointer string is a %s\", ptr.str );\n```\n\n- 8. 现在，轻松地为字符指针赋一个新值，并输出新的字符串值\n\
    \n```c\nptr.str = \"Idea\";\nprintf( \"%s\\n\", ptr.str );\n```\n\n- 9. 在 main\
    \ 函数块末尾，按函数声明要求返回一个零整数值\n\n```c\nreturn 0 ;\n```\n\n"
