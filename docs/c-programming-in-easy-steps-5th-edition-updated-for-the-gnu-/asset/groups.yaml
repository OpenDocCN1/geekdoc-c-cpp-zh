    \ as “global” variables.\n\n![](img/db19f3858a1e321646bf2590afd29547_40_0.png)\n\
    \nLocal variables can only be accessed from within the function in which they\
    \ are declared. This is the default implicit behavior that could be explicitly\
    \ specified with the seldom-used auto keyword in the variable declaration. They\
    \ come into existence when the function is called, and normally disappear when\
    \ the function ends.\n\nGlobal variables, on the other hand, can be accessed from\
    \ within any function in the program. They come into existence when the program\
    \ executes, and remain in existence until the program ends.\n\nAn external global\
    \ variable must be defined exactly once at the start of the program. It must also\
    \ be declared at the start of each function that needs access to it. The declaration\
    \ should begin with the extern keyword to denote that it references an external\
    \ variable, rather than a regular local variable declaration. These declarations\
    \ should not be used to initialize the global variable.\n\nLarger C programs often\
    \ consist of multiple source code files that are compiled together to create a\
    \ single executable file. Global variables are normally accessible from any function\
    \ in any of the files being compiled together. All functions are normally accessible\
    \ globally too, but functions and – more usually – global variables can have their\
    \ accessibility limited to just the file in which they are created by the use\
    \ of the static keyword in their declaration.\n\nNormally, a program cannot employ\
    \ multiple variables of the same name but can do so if each is declared to be\
    \ a **static** variable and is unique within that source code file. Programming\
    \ with multiple source code files can reveal a common global variable name duplicated\
    \ in two different files. Declaring these as **static** avoids the need to rename\
    \ one of the variables in each occurrence within the source code.\n\nInternal\
    \ local variables can also be declared as **static**. These are only accessible\
    \ from within the function in which they are declared, as usual, but they do not\
    \ disappear when the function ends. This allows permanent private storage within\
    \ a function until the program ends.\n\n![](img/db19f3858a1e321646bf2590afd29547_41_0.png)\n\
    \nWidespread use of global variables can introduce name conflicts.\n\n![](img/db19f3858a1e321646bf2590afd29547_41_1.png)\n\
    \nTry to use only local variables. Global variables allow convenient access to\
    \ values from any function within a program but it is better practice to avoid\
    \ global variables and pass values between functions as arguments instead.\n\n\
    - 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n\n```c\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_41_2.png)\n\
    \n- 2. Define and initialize a global static variable that may only be accessed\
    \ from within this source code file\n"
  mdcn: "\n![](img/db19f3858a1e321646bf2590afd29547_35_0.png)\n\n字符串是一种特殊情况，这里通过数组主题进行演示。\n\
