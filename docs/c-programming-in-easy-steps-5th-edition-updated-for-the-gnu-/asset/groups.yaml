  - "[PAGE 61]\n\n# Enumerating constant values\n\nThe enum keyword provides a handy\
    \ way to create a sequence of integer constants in a concise manner. Optionally,\
    \ the declaration can include a name for the sequence after the enum keyword.\
    \ The constant names follow as a comma-separated list within braces.\n\nEach of\
    \ the constants will, by default, have a value one greater than that of the constant\
