    printf(\" AND (no&&no): %d \\n\", no && no );\nprintf(\" AND (yes&&no): %d \\\
    n\", yes && no );\nprintf(\" AND (yes&&yes): %d \\n\", yes && yes );\nprintf(\"\
    \ OR (no||no): %d \\n\", no || no );\nprintf(\" OR (yes||no): %d \\n\", yes ||\
    \ no );\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_85_1.png)\n\nlogic.c\n\
    \n```c\nprintf(\"OR (yes||yes): %d \\n\", yes || yes );\nprintf(\"NOT (yes !yes):\
