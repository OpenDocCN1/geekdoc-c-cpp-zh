    The standard library header file named ctype.h contains a number of functions
    that are useful to perform tests on characters. To make these available to a program,
    the ctype.h header file must be added with an #include directive at the start
    of the program.


    Within the ctype.h header file, the isalpha() function tests whether a character
    is alphabetical, whereas isdigit() tests whether a character is numerical. Similarly,
    the ispunct() function tests whether a character is any other printable symbol,
    whereas the isspace() function tests whether a “character” is in fact a space.


