    \ value upon failure.\n\n![](img/db19f3858a1e321646bf2590afd29547_196_0.png)\n\
    \nThe `calloc()` function clears all allocated memory space to zero, but `malloc()`\
    \ leaves whatever values are already there.\n\nMemory previously allocated with\
    \ `malloc()` or `calloc()` can be increased with the `realloc()` function. This\
    \ requires the pointer to the allocated memory block as its first argument, and\
    \ an integer specifying the new block size as its second argument. It returns\
    \ a pointer to the beginning of the enlarged memory block when successful, or\
    \ a `NULL` value upon failure.\n\nAll memory allocated with these functions should\
    \ be released when no longer required by specifying the memory block pointer as\
    \ the argument to the `free()` function.\n\nThere is no standard C function to\
    \ determine the size of a dynamically allocated memory block but this can be discovered\
    \ with platform-specific functions. On Windows there is `_msize()` and on Linux\
    \ there is `malloc_usable_size()`. Both these functions require the memory block\
    \ pointer as their argument.\n\n1. Begin a new program with preprocessor instructions\
    \ to include the standard library input/output functions and memory management\
    \ functions.\n\n## memory.c\n\n![](img/db19f3858a1e321646bf2590afd29547_197_0.png)\n\
