    #include <stdio.h>\n\nint main()\n{\n    printf( \"Hello World!\\n\" ) ;\n   \
    \ return 0 ;\n}\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_18_0.png)\n\n\
