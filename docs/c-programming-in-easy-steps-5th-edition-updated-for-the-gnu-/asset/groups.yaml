    \ a custom header file can be created to contain functions that may be used repeatedly.\
    \ This should be named with a “.h” file extension, like the standard header files\
    \ in the C library.\n\nThe functions in the custom header file can be made available\
    \ to the program by adding an `#include` preprocessor directive at the start of\
    \ the file containing the `main()` function. The custom header file name should\
    \ be enclosed within double quotes in the preprocessor directive though, rather\
    \ than by the `<` and `>` angled brackets that are used to include standard header\
    \ files.\n\n- 1. Create a custom header file named “utils.h” containing the definition\
