    | Decimal | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| Binary | 0 | 0 | 1 | 1 | 0\
    \ | 0 | 1 | 0 |\n\nAlthough the char data type is the basic 1-byte storage unit\
    \ in C programming, as described here, it is possible to manipulate individual\
    \ parts of a byte using “bitwise” operators.\n\n| Operator | Name | Binary number\
