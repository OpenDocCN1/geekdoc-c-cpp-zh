  md: "\n## Creating a file\n\nA special data type for handling files is defined in\
    \ the stdio.h header file. It is called a “file pointer” and has the syntax FILE\
    \ *fp. File pointers are used to open, read, write, and close files. In a C program,\
    \ a file pointer called “file_ptr” can be created with the declaration FILE *file_ptr\
    \ ;\n\n![](img/db19f3858a1e321646bf2590afd29547_202_0.png)\n\nA file pointer points\
    \ to a structure defined in the stdio.h header file that contains information\
    \ about the file. This includes details about the current character and if the\
    \ file is being read or written.\n\nBefore a file can be read or written it firstly\
    \ must always be opened with the fopen() function. This takes two arguments to\
    \ specify the name and location of the file, and a “mode” in which to open the\
    \ file. The fopen() function returns a file pointer if successful, or a NULL value\
    \ upon failure.\n\nOnce a file has been successfully opened it can be read or\
    \ added to, or new text can be written in the file, depending on the mode specified\
    \ in the call to the fopen() function. Following this, the open file must then\
    \ always be closed by calling the fclose() function and specifying the file pointer\
    \ as its single argument.\n\nThe table below lists all the possible file modes\
    \ that can be specified as the second argument to the fopen() function:\n\n| File\
    \ mode | Operation |\n|---|---|\n| r | Open an existing file to read |\n| w |\
    \ Open an existing file to write. Creates a new file if none exists, or opens\
    \ an existing file and discards all its previous contents |\n| a | Appends text.\
    \ Opens or creates a text file for writing at the end of the file |\n| r+ | Opens\
    \ a text file to read from or write to |\n| w+ | Opens a text file to write or\
    \ read from |\n| a+ | Opens or creates a text file to read from or write to at\
    \ the end of the file |\n\nNote: Where the mode includes a b after any of the\
    \ file modes listed above, the operation relates to a binary file rather than\
    \ a text file – for example, rb or wb\n\nAll the standard functions for file input/output\
    \ are contained in the stdio.h header file.\n\nFor convenience, all the text files\
    \ in the examples in this chapter are located in the MyPrograms folder that also\
    \ contains the C source code files. On Windows the directory is c:\\MyPrograms,\
    \ and on Linux systems it's at /home/MyPrograms.\n\n- 1. Begin a new program with\
    \ a preprocessor instruction to include the standard input/output library functions\n\
    \n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_203_0.png)\n\
    \n- 2. Add a main function that declares a file pointer\n\n```\nint main()\n{\n\
    FILE *file_ptr ;\n}\n```\n\n- 3. Next, in the main function block, attempt to\
    \ create a file for writing to\n\n```\nfile_ptr = fopen( \"data.txt\", \"w\" );\n\
    ```\n\n- 4. Now, output a message to confirm the attempt succeeded, then close\
    \ the file and return a zero integer value as required by the function declaration\n\
    \n```\nif(file_ptr != NULL)\n{\n    printf( \"File created\\n\" );\n    fclose(\
    \ file_ptr );\n    return 0 ;\n}\n```\n\n- 5. Finally, output an alternative message\
    \ if the attempt fails\n\n```\nelse\n{\n    printf( \"Unable to create file\\\
    n\" ); return 1 ;\n}\n```\n\n- 6. Save the program file, then compile and execute\
    \ the program to attempt to create a text file\n\n![](img/db19f3858a1e321646bf2590afd29547_204_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_204_1.png)\n\nNotice that both file\
    \ name and file mode arguments must be enclosed within double quotes.\n\n![](img/db19f3858a1e321646bf2590afd29547_204_2.png)\n\
    \nNotice that this program returns a value of 1 to the system when the attempt\
    \ to open the file fails – this tells the system that all did not go well.\n\n\
    ## Reading & writing characters\n\n### Standard input\n\nThe **scanf()** function,\
    \ used in previous examples, is the simplified version of a function named **fscanf()**\
    \ that requires an input filestream as its first argument. This indicates a source\
    \ from where a series of characters will be introduced into the program.\n\nIn\
    \ C programming, the filestream named **stdin** represents the keyboard and is\
    \ the default source for the **scanf()** function. The function call **scanf(...)**\
    \ is the same as **fscanf( stdin, ... )** .\n\n### Standard output\n\nSimilarly,\
    \ the **printf()** function is the simplified version of a function named **fprintf()**\
    \ that requires an output filestream as its first argument. This indicates a destination\
    \ where a series of characters will be output from the program.\n\nThe filestream\
    \ named **stdout** represents the monitor, and is the default source for the **printf()**\
    \ function. The function call **printf(...)** is the same as **fprintf( stdout,\
    \ ... )** .\n\nOther standard functions, which have **stdin** or **stdout** as\
    \ their default filestreams, also have equivalents allowing an alternative filestream\
    \ to be specified. These can be used to read files by specifying a file pointer\
    \ as an alternative to reading from the **stdin** filestream. They can also be\
    \ used to write files by specifying an alternative to the **stdout** filestream:\n\
    \n- The **fputc()** function can be used to write to a filestream one character\
    \ at a time – typically by looping through a **char** array. Its companion **fgetc()**\
    \ can be used to read from a filestream one character at a time.\n- The **fputs()**\
    \ function can be used to write to a filestream one line at a time, and its companion\
    \ **fgets()** can be used to read from a filestream one line at a time.\n- The\
    \ **fread()** function can be used to read an entire filestream, and its partner\
    \ **fwrite()** can write an entire filestream.\n- The **fscanf()** function and\
    \ the **fprintf()** functions can be used to read and write filestreams with strings\
    \ and numbers.\n\n![](img/db19f3858a1e321646bf2590afd29547_207_0.png)\n\nAnother\
    \ standard output filestream named stderr is used to output error messages.\n\n\
    - 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n\n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_207_1.png)\n\
    \nwritechars.c\n\n- 2. Add a main function that declares a file pointer, a loop\
    \ counter variable, and an initialized character array\n\n```\nint main()\n{\n\
    \    FILE *file_ptr ; int i ;\n    char text[50] = { \"Text, one character at\
    \ a time.\" } ;\n}\n```\n\n- 3. Next, in the main function block, attempt to create\
    \ a file for writing to\n\n```\nfile_ptr = fopen( \"chars.txt\" , \"w\" ) ;\n\
    ```\n\n- 4. Now, output a message to confirm the attempt succeeded, write each\
    \ character from the array, then close the file and return the required zero integer\
    \ value\n\n```\nif( file_ptr != NULL )\n{\n    printf( \"File chars.txt created\\\
    n\" ) ;\n    for( i = 0 ; text[i] ; i++ ) { fputc( text[i], file_ptr ) ; }\n \
    \   fclose( file_ptr ) ;\n    return 0 ;\n}\n```\n\n- 5. Finally, output an alternative\
    \ message if the attempt fails\n\n```\nelse { printf( \"Unable to create file\\\
    n\" ) ; return 1 ; }\n```\n\n- 6. Save the program file, then compile and execute\
    \ the program to attempt to write a text file\n\n![](img/db19f3858a1e321646bf2590afd29547_208_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_208_1.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_208_2.png)\n\
    \nThe fputc() function returns the ASCII code of the current character, or a constant\
    \ called EOF denoting that the end of the file is reached.\n\n## Reading & writing\
    \ lines\n\nThe fgetc() function is not the most efficient way to read text into\
    \ a program, as it must be called repeatedly to read each character. It is better\
    \ to employ the fgets() function that reads text one whole line at a time.\n\n\
    The fgets() function requires three arguments. The first argument specifies a\
    \ char pointer or char array to which the text will be assigned. The second argument\
    \ must be an integer specifying the maximum number of characters to read per line.\
    \ The third argument is a file pointer specifying where to read from.\n\nSimilarly,\
    \ the fputc() function, which writes text one character at a time, is less efficient\
    \ than the fputs() function that writes text line by line. The fputs() function\
    \ requires two arguments to specify the text to write and a file pointer denoting\
    \ the file to be written to. A newline character is added by fputs() after the\
    \ line is written. This function returns zero when successful, or the EOF constant\
    \ when an error occurs or the end of the file is reached.\n\n![](img/db19f3858a1e321646bf2590afd29547_209_0.png)\n\
    \nlines.c\n\n- 1. Begin a new program with a preprocessor instruction to include\
    \ the standard input/output and string functions\n\n```\n#include <stdio.h>\n\
    #include <string.h>\n```\n\n- 2. Add a main function that declares a file pointer\
    \ and an uninitialized character array\n\n```\nint main()\n{\nFILE *file_ptr ;\n\
    char text[50] ;\n}\n```\n\n- 3. Next, in the main function block, attempt to open\
    \ a local text file for both reading and appending to\n"
  mdcn: "\n## 创建文件\n\n在 stdio.h 头文件中定义了一种用于处理文件的特殊数据类型。它被称为“文件指针”，其语法为 FILE *fp。文件指针用于打开、读取、写入和关闭文件。在\
    \ C 程序中，可以使用声明 FILE *file_ptr ; 创建一个名为“file_ptr”的文件指针。\n\n![](img/db19f3858a1e321646bf2590afd29547_202_0.png)\n\
    \n文件指针指向在 stdio.h 头文件中定义的结构体，其中包含有关文件的信息。这包括有关当前字符的详细信息以及文件是正在被读取还是写入。\n\n在文件可以被读取或写入之前，它首先必须始终使用\
    \ fopen() 函数打开。该函数需要两个参数来指定文件的名称和位置，以及一个打开文件的“模式”。fopen() 函数在成功时返回一个文件指针，在失败时返回一个\
    \ NULL 值。\n\n一旦文件成功打开，就可以在其中读取或追加内容，或根据 fopen() 函数调用中指定的模式在文件中写入新文本。之后，必须始终通过调用\
    \ fclose() 函数并指定文件指针作为其唯一参数来关闭打开的文件。\n\n下表列出了可以作为 fopen() 函数第二个参数指定的所有可能文件模式：\n\
    \n| 文件模式 | 操作 |\n|---|---|\n| r | 打开现有文件进行读取 |\n| w | 打开现有文件进行写入。如果不存在则创建新文件，或打开现有文件并丢弃其所有先前内容\
    \ |\n| a | 追加文本。打开或创建文本文件以在文件末尾进行写入 |\n| r+ | 打开文本文件以便读取或写入 |\n| w+ | 打开文本文件以便写入或读取\
    \ |\n| a+ | 打开或创建文本文件以便在文件末尾读取或写入 |\n\n注意：当模式在上述任何文件模式之后包含 b 时，操作涉及二进制文件而不是文本文件——例如，rb\
    \ 或 wb\n\n所有用于文件输入/输出的标准函数都包含在 stdio.h 头文件中。\n\n为方便起见，本章示例中的所有文本文件都位于也包含 C 源代码文件的\
    \ MyPrograms 文件夹中。在 Windows 上，该目录为 c:\\MyPrograms，在 Linux 系统上位于 /home/MyPrograms。\n\
    \n- 1. 使用预处理器指令开始一个新程序以包含标准输入/输出库函数\n\n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_203_0.png)\n\
    \n- 2. 添加一个 main 函数声明文件指针\n\n```\nint main()\n{\nFILE *file_ptr ;\n}\n```\n\n\
    - 3. 接下来，在 main 函数块中，尝试创建一个用于写入的文件\n\n```\nfile_ptr = fopen( \"data.txt\", \"\
    w\" );\n```\n\n- 4. 现在，输出一条消息以确认尝试成功，然后关闭文件并返回函数声明所需的零整数值\n\n```\nif(file_ptr\
    \ != NULL)\n{\n    printf( \"File created\\n\" );\n    fclose( file_ptr );\n \
    \   return 0 ;\n}\n```\n\n- 5. 最后，如果尝试失败则输出一条替代消息\n\n```\nelse\n{\n    printf(\
    \ \"Unable to create file\\n\" ); return 1 ;\n}\n```\n\n- 6. 保存程序文件，然后编译并执行程序以尝试创建文本文件\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_204_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_204_1.png)\n\
    \n请注意，文件名和文件模式参数都必须用双引号括起来。\n\n![](img/db19f3858a1e321646bf2590afd29547_204_2.png)\n\
    \n请注意，当尝试打开文件失败时，此程序会向系统返回值为 1——这告诉系统并非一切顺利。\n\n## 读取与写入字符\n\n### 标准输入\n\n**scanf()**\
    \ 函数在之前的示例中使用过，是一个名为 **fscanf()** 的函数的简化版本，该函数要求其第一个参数为输入文件流。这表示字符序列将被引入程序的来源。\n\
    \n在 C 编程中，名为 **stdin** 的文件流代表键盘，是 **scanf()** 函数的默认来源。函数调用 **scanf(...)** 与 **fscanf(\
    \ stdin, ... )** 相同。\n\n### 标准输出\n\n同样，**printf()** 函数是名为 **fprintf()** 的函数的简化版本，该函数要求其第一个参数为输出文件流。这表示字符序列将从程序输出的目的地。\n\
    \n名为 **stdout** 的文件流代表显示器，是 **printf()** 函数的默认来源。函数调用 **printf(...)** 与 **fprintf(\
    \ stdout, ... )** 相同。\n\n其他具有 **stdin** 或 **stdout** 作为默认文件流的标准函数，也有允许指定替代文件流的等效项。它们可以通过指定文件指针作为替代读取\
    \ **stdin** 文件流的选项来读取文件。它们也可以通过指定 **stdout** 文件流的替代项来写入文件：\n\n- **fputc()** 函数可用于一次向文件流写入一个字符——通常通过遍历\
    \ **char** 数组。其配套函数 **fgetc()** 可用于一次从文件流读取一个字符。\n- **fputs()** 函数可用于一次向文件流写入一行，其配套函数\
    \ **fgets()** 可用于一次从文件流读取一行。\n- **fread()** 函数可用于读取整个文件流，其伙伴 **fwrite()** 可写入整个文件流。\n\
    - **fscanf()** 函数和 **fprintf()** 函数可用于使用字符串和数字读取和写入文件流。\n\n![](img/db19f3858a1e321646bf2590afd29547_207_0.png)\n\
    \n另一个标准输出文件流名为 stderr，用于输出错误消息。\n\n- 1. 使用预处理器指令开始一个新程序以包含标准输入/输出库函数\n\n```\n\
    #include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_207_1.png)\n\
    \nwritechars.c\n\n- 2. 添加一个 main 函数声明文件指针、循环计数器变量和一个已初始化的字符数组\n\n```\nint main()\n\
    {\n    FILE *file_ptr ; int i ;\n    char text[50] = { \"Text, one character at\
    \ a time.\" } ;\n}\n```\n\n- 3. 接下来，在 main 函数块中，尝试创建一个用于写入的文件\n\n```\nfile_ptr\
    \ = fopen( \"chars.txt\" , \"w\" ) ;\n```\n\n- 4. 现在，输出一条消息以确认尝试成功，写入数组中的每个字符，然后关闭文件并返回所需的零整数值\n\
    \n```\nif( file_ptr != NULL )\n{\n    printf( \"File chars.txt created\\n\" )\
    \ ;\n    for( i = 0 ; text[i] ; i++ ) { fputc( text[i], file_ptr ) ; }\n    fclose(\
    \ file_ptr ) ;\n    return 0 ;\n}\n```\n\n- 5. 最后，如果尝试失败则输出一条替代消息\n\n```\nelse\
    \ { printf( \"Unable to create file\\n\" ) ; return 1 ; }\n```\n\n- 6. 保存程序文件，然后编译并执行程序以尝试写入文本文件\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_208_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_208_1.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_208_2.png)\n\nfputc() 函数返回当前字符的 ASCII\
    \ 码，或一个名为 EOF 的常量，表示已到达文件末尾。\n\n## 读取与写入行\n\nfgetc() 函数并不是将文本读入程序的最有效方式，因为它必须被反复调用以读取每个字符。最好采用\
    \ fgets() 函数，该函数一次读取整行文本。\n\nfgets() 函数需要三个参数。第一个参数指定要分配文本的 char 指针或字符数组。第二个参数必须是指定每行读取的最大字符数的整数。第三个参数是指定读取来源的文件指针。\n\
    \n同样，fputc() 函数一次写入一个字符的效率不如 fputs() 函数一次按行写入文本。fputs() 函数需要两个参数来指定要写入的文本和要写入到的文件的指针。fputs()\
    \ 在写入行后会添加换行符。该函数在成功时返回零，在发生错误或到达文件末尾时返回 EOF 常量。\n\n![](img/db19f3858a1e321646bf2590afd29547_209_0.png)\n\
    \nlines.c\n\n- 1. 使用预处理器指令开始一个新程序以包含标准输入/输出和字符串函数\n\n```\n#include <stdio.h>\n\
    #include <string.h>\n```\n\n- 2. 添加一个 main 函数声明文件指针和一个未初始化的字符数组\n\n```\nint main()\n\
    {\nFILE *file_ptr ;\nchar text[50] ;\n}\n```\n\n- 3. 接下来，在 main 函数块中，尝试打开一个本地文本文件以便同时进行读取和追加\n"
