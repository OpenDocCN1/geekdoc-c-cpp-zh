    # # Passing structures to functions


    Structure member values can be stored in an array, just like the values of any
    other data type. The array is declared as usual, but the method used to assign
    the values to its elements is slightly different. Each comma-separated list of
    member values must be enclosed within a pair of braces.


    ![](img/db19f3858a1e321646bf2590afd29547_190_0.png)


    Simply assigning all the values as a comma-separated list will not work – each
    set of values must be enclosed by its own pair of braces.


    Similarly, a **struct** can be passed as an argument to a function, just like
    any other variable. The structure’s data type must be specified in both the function
    prototype declaration and its definition, along with a variable name by which
    the function can address its member values.


    But remember that passing by value, simply using a regular variable, means that
    the function will operate on a copy of the struct – its original member values
    will remain unchanged. Passing the struct by reference, on the other hand, using
    a pointer variable, means that the function will operate on the original struct
    members – so the original member values will get changed.


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions


