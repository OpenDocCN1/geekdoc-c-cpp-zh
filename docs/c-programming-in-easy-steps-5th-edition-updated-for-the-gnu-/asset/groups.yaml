    Running i=%d j=%d\\n\", i, j);\n\t}\n}\n```\n\n- 4. Insert a statement as the\
    \ first line of the inner nested loop, to jump to a label named “end” at a specified\
    \ counter value\n\n```c\nif(i == 2 && j == 1){ goto end;}\n```\n\n- 5. Now, add\
    \ the label after the closing brace of the outer loop\n\n```c\n} end:\n```\n\n\
    Notice that the goto statement specifies the label by name only, but the label\
    \ itself must have a terminating : colon.\n\n- 6. At the end of the main function\
    \ block, return a zero integer value, as required by the function declaration\n\
    \n```c\nreturn 0;\n```\n\n- 7. Save the program file, then compile and execute\
    \ the program to see the loops exit after the jump\n\n![](img/db19f3858a1e321646bf2590afd29547_120_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_120_1.png)\n\nOne alternative, avoiding\
    \ the goto keyword, might be to check a variable for a Boolean true value (1)\
    \ on each iteration of each loop:\n\n- 8. Add another variable to the existing\
    \ variable declarations and initialize with a true value of one\n\n```c\nint i,\
    \ j, flag = 1;\n```\n\n- 9. Insert a conditional test of the new variable’s value,\
    \ both at the start of the outer loop block and at the start of the inner loop\
    \ block just before the output statement\n\n```c\nif( flag )\n```\n\n- 10. Change\
    \ the first line of the inner loop to replace the goto statement with one assigning\
    \ a false value of zero\n\n```c\nif( i == 2 && j == 1 ) { flag = 0 ; }\n```\n\n\
    - 11. Delete the now obsolete end: label after the closing brace then save, compile,\
    \ and execute the program again to see the same resulting output as before\n\n\
    ![](img/db19f3858a1e321646bf2590afd29547_121_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_121_1.png)\n\
    \nIn C, Boolean values are represented numerically as 1 (true) and 0 (false).\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_121_2.png)\n\nAvoid creating a program\
    \ executable named \"goto.exe\" as this would conflict with the internal Windows\
    \ GOTO command.\n\n## Summary\n\n- The if keyword performs a basic conditional\
    \ test to evaluate a given expression for a Boolean value of true or false.\n\
    - The else keyword can be used to provide alternative statements to execute when\
    \ an if statement evaluates an expression as false.\n- Offering a program alternative\
    \ directions in which to proceed following an evaluation is known as “conditional\
    \ branching”.\n- Conditional branching performed by multiple if else statements\
    \ can often be performed more efficiently by a switch statement.\n- Usually, the\
    \ case statements within a switch block must each be terminated by a break statement.\n\
    - Optionally, a switch block may contain a default statement specifying statements\
    \ to execute when no match is found.\n- The for keyword is followed by parentheses\
    \ specifying an initializer, test-expression, and incrementer to control a loop.\n\
    - The while keyword is followed by parentheses specifying a test expression to\
    \ determine whether a loop should continue.\n- A while loop block must be preceded\
    \ by an initializer and contain an incrementer within its statement block.\n-\
    \ The do keyword is followed by a statement block after which there must be a\
    \ while statement terminated by a semi-colon.\n- A do while loop must be preceded\
    \ by an initializer and contain an incrementer within its statement block.\n-\
    \ Unlike for loops and while loops, the statements in a do while loop will always\
    \ be executed at least once.\n- The break keyword can be used to terminate a loop,\
    \ whereas the continue keyword can be used to skip a single iteration.\n- Loops\
    \ may be nested and the goto keyword can be used to exit a specified label, although\
    \ its use is not recommended.\n"
  mdcn: "\n## 读取或写入连续数组元素\n\n请注意，在 do while 循环中，while 语句之后必须有一个分号终止符。\n\n![](img/db19f3858a1e321646bf2590afd29547_114_0.png)\n\
    \n如果程序陷入无限循环，在 Windows 或 Linux 系统上，按 Ctrl + C 键可停止循环执行。\n\n![](img/db19f3858a1e321646bf2590afd29547_114_1.png)\n\
    \n使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n```c\n#include <stdio.h>\n```\n\ndowhile.c\n\n\
    添加一个 main 函数，声明一个计数器变量，然后声明并初始化一个包含三个元素的数组变量\n\n```c\nint main()\n{\n int i, arr[3]\
    \ = {10, 20, 30};\n}\n```\n\n接下来，在 main 函数块中插入一个 while 循环，输出每个元素的编号及其包含的值\n\n\
    ```c\ni = 0;\nwhile(i < 3)\n{\n printf(\"While: arr[%d] = %d\\n\", i, arr[i]);\
    \ i++;\n}\n```\n\n现在，插入一个 do while 循环，同样输出每个元素的编号及其包含的值\n\n```c\ni = 0;\ndo\n\
