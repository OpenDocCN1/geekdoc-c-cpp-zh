    # # Reading strings


    In C programming, a string is an array of characters that has the special \0 null
    character in its last element. Each character, including punctuation and non-printing
    characters such as newline, has a unique numerical ASCII code value. This means
    that characters can be changed arithmetically. For example, where char letter
    = ''S'' then letter++ changes the value to ''T''. ASCII code values for lowercase
    letters are always 32 higher than those of uppercase letters, so the case of any
    character can be changed by adding or subtracting a value of 32. For example,
    where char letter = ''M'' then letter+=32 changes the value to ''m''. As C does
    not have a dedicated string data type, string variables must be created as character
    arrays, remembering to add a final element for the \0 null character to promote
    the array to string constant status. This means that the name of an array then
    acts like an implied pointer to the entire string of characters. The sizeof operator
    will return the string’s array length when the string name is supplied as its
    argument. A string may be assigned to an array or to a pointer of the char data
    type, like this:


    ![](img/db19f3858a1e321646bf2590afd29547_158_0.png)


    ```

    char arr[6] = { ''A'', ''l'', ''p'', ''h'', ''a'', ''\0'' };

    char *ptr = "Beta";

    printf("%s", arr); /* Outputs “Alpha” */

    printf("%s", ptr); /* Outputs “Beta” */

    ```


    ![](img/db19f3858a1e321646bf2590afd29547_158_1.png)


    You can find the standard ASCII character code table here.'
