    \ndefault 语句不必出现在 switch 块的末尾，但在那里放置它是合理的，因为它不需要 break 语句。\n\n1 开始一个新的程序，使用预处理器指令包含标准输入/输出库函数\
    \ #include <stdio.h>\n\n![](img/db19f3858a1e321646bf2590afd29547_108_2.png)\n\n\
    switch.c\n\n2 添加一个 main 函数，声明并初始化一个整数变量和一个字符变量\n\n```c\nint main()\n{\n  int num\
    \ = 2 ; char letter = 'b' ;\n}\n```\n\n3 接下来，在 main 函数块中，插入一个尝试匹配整数值的 switch 语句\n\
    \n```\ncase 2 : printf( \"Number is two\\n\" ) ; break ;\ncase 3 : printf( \"\
    Number is three\\n\" ) ; break ;\ndefault : printf( \"Number is unrecognized\\\
    n\" ) ;\n}\n```\n\n现在，插入一个尝试匹配字符值的 switch 语句\n\n```\nswitch( letter )\n{\ncase\
    \ 'a' : case 'b' : case 'c' :\nprintf( \"Letter is %c\\n\" , letter ) ; break\
    \ ;\ndefault : printf( \"Letter is unrecognized\\n\" ) ;\n}\n```\n\n在 main 函数块的末尾，返回一个零整数值，如函数声明所要求\n\
    \n```\nreturn 0 ;\n```\n\n保存程序文件，然后编译并执行程序以查看 switch 语句的输出\n\n![](img/db19f3858a1e321646bf2590afd29547_109_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_109_1.png)\n\n在 switch 语句中，case 关键字、匹配值和冒号字符被视为唯一的“标签”。\n\
    \n## 循环指定次数\n\n循环是程序中自动重复的一段代码。循环内所有语句的一次完整执行称为“迭代”或“遍”。循环的长度由循环内进行条件测试控制。只要测试表达式被判定为真，循环就会继续——直到测试表达式被判定为假，此时循环结束。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_110_0.png)\n\n在 C 编程中，有三种循环结构——for\
    \ 循环、while 循环和 do while 循环。其中最常见的是 for 循环，其通常具有以下语法：\n\n```\nfor ( initializer\
    \ ; test-expression ; incrementer ) { statements }\n```\n\n初始化器用于为循环迭代次数的计数器设置起始值。为此使用一个整数变量，传统上命名为“i”。\n\
    \n在循环的每次迭代中，都会评估 test-expression，并且该迭代仅在该表达式为真时继续。当 test-expression 变为假时，循环会立即结束，而不会再次执行语句。每次迭代时，计数器都会递增，然后执行语句。\n\
    \n循环可以嵌套，一个在另一个内部，以便在外层循环的每次迭代中完全执行内层嵌套循环的所有迭代。\n\n+   1. 开始一个新的程序，使用预处理器指令包含标准输入/输出库函数\n\
    +      `#include <stdio.h>`\n\n### forloop.c\n\n2 添加一个 main 函数，声明两个稍后用作循环迭代计数器的整数变量\n\
    \n```c\nint main()\n{\n    int i, j;\n}\n```\n\n3 接下来，在 main 函数块中，插入一个 for 循环，在每次三次迭代中输出循环计数器的值\n\
    \n```\nfor(i = 1 ; i < 4 ; i++)\n{\n    printf( \"Outer loop iteration %d\\n\"\
    , i );\n}\n```\n\n4 在 main 函数块的末尾，返回一个零整数值，如函数声明所要求\n\n```\nreturn 0 ;\n```\n\n\
    5 保存程序文件，然后编译并执行程序以查看 for 循环的输出\n\n![](img/db19f3858a1e321646bf2590afd29547_111_0.png)\n\
    \n6 现在，在循环块中，在现有输出语句之后立即插入一个嵌套循环，以在每次三次内层循环迭代中输出循环计数器的值\n\n```\nfor(j = 1 ; j\
    \ < 4 ; j++)\n{\n    printf( \"\\tInner loop iteration %d\\n\", j );\n}\n```\n\
    \n7 保存程序文件，然后再次编译并执行程序以查看两个循环的输出\n\n![](img/db19f3858a1e321646bf2590afd29547_112_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_112_1.png)\n\nfor 循环计数器也可以递减——通过在每次迭代中使用\
    \ i-- 而不是 i++ 来递减计数器的值。\n\n## 循环 while 为真\n\nwhile 循环是前一个示例中描述的 for 循环的替代方案。while\
    \ 循环也需要初始化器、test-expression 和增量器，但它们不像 for 循环那样整齐地列在一个括号对内。相反，初始化器必须出现在循环块开始之前，而\
    \ test-expression 必须出现在 while 关键字后的括号内，后跟包含增量器和每次迭代要执行的语句的大括号。\n\n```\ninitializer\n\
    while ( test-expression )\n{ statements-to-be-executed ; incrementer }\n```\n\n\
    do while 循环通过将 do 关键字放在循环块之前并将 while 语句移到循环块之后，对上述语法进行了细微的变化：\n\n```\ninitializer\n\
    do { statements-to-be-executed ; incrementer }\nwhile ( test-expression ) ;\n\
    ```\n\nwhile 循环和 do while 循环都会继续迭代，直到 test-expression 被判定为假，此时循环将退出。因此，循环体必须包含在某一点上会改变\
    \ test-expression 评估结果的代码——否则会创建无限循环，导致系统锁定。\n\nwhile 循环和 do while 循环之间的显著区别在于，如果\
    \ test-expression 在首次评估时为假，while 循环将不会进行一次迭代。相比之下，do while 循环总是至少进行一次迭代，因为其语句在评估之前执行。如果这是期望的，do\
    \ while 循环显然是最好的选择，否则 for 循环和 while 循环之间的选择在很大程度上是个人偏好的问题。一个经验法则是，for 循环最好用于执行特定次数的迭代，而\
    \ while 循环最好用于在满足特定条件时迭代。\n\n循环是与数组一起使用的完美搭档，因为每次迭代都可以毫不费力地\n"
