    \ ;\n    int i ;\n}\n```\n\n3. 接下来，在 main 函数块中，尝试打开一个实际上不存在的文件\n\n```\nf_ptr =\
    \ fopen( \"nosuch.file\", \"r\" );\n```\n\n4. 由于尝试失败，输出确认或错误消息\n\n```\nif( f_ptr\
    \ != NULL ) { printf( \"File opened\\n\" ); }\nelse { perror( \"Error\" ); }\n\
    ```\n\n现在，添加一个循环，输出与每个已定义的数值 errno 错误代码关联的错误消息\n\n```\nfor( i = 0 ; i < 44 ; i++\
    \ )\n{\n    printf( \"Error %d : %s\\n\" , i , strerror(i) ) ;\n}\n```\n\n在 main\
    \ 函数块末尾，按照函数声明的要求返回零整数值\n\n```\nreturn 0 ;\n```\n\n保存程序文件，然后编译并执行程序以查看错误消息\n\n\
