    ## Jump functions


    <setjmp.h>


    **setjmp.h** 头文件用于控制低级调用，并提供一种避免正常调用和返回序列的手段。


    | Function | Description |

    |---|---|

    | `int setjmp( jmp_buf env )` | 用于条件测试中的低级函数，用于将环境保存到 *env* 变量中，然后返回零 |

    | `void longjmp( jmp_buf env , int value )` | 通过 `setjmp()` 保存到 *env* 变量中的环境将被恢复，就好像
