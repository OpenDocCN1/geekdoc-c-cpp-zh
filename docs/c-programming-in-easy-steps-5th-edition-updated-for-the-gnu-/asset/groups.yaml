    \n![](img/db19f3858a1e321646bf2590afd29547_199_0.png)\n\nThe memory request statement\
    \ could alternatively have used `calloc(100, sizeof(int))`.\n\n## Summary\n\n\
    - A **struct** can contain one or more variables of any data type, which are known\
