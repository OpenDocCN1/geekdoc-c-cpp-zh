    | FLT_ROUNDS | 四舍五入到最接近的数字 |

    | FLT_DIG | 精确位数（5） |

    | FLT_EPSILON | 最小的数 x，其中 1.0 + x != 1.0（1E-5） |

    | FLT_MANT_DIG | FLT_RADIX 尾数位数 |

    | FLT_MAX | 最大浮点数（1E+37） |

    | FLT_MAX_EXP | 最大的数 n，其中 FLT_RADIX^(n-1) 是有效数字 |

    | FLT_MIN | 最小浮点数（1E-37） |

    | FLT_MIN_EXP | 最小的数 n，其中 10^n 有效 |

    | DBL_DIG | 双精度位数（10） |

    | DBL_EPSILON | 最小的数 x，其中 1.0 + x != 1.0（1E-9） |

    | DBL_MANT_DIG | FLT_RADIX 尾数位数 |

    | DBL_MAX | 最大双精度浮点数（1E+37） |

    | DBL_MAX_EXP | 最大的数 n，其中 FLT_RADIX^(n-1) 是有效数字 |

    | DBL_MIN | 最小双精度浮点数（1E-37） |

    | DBL_MIN_EXP | 最小的数 n，其中 10^n 有效 |


