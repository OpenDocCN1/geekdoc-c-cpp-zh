    ```\n\n在 main 函数块末尾，按照函数声明的要求返回整数零值\n\n```c\nreturn 0;\n```\n\n保存程序文件，然后编译并执行程序，以查看两个循环输出的结果看起来相同\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_115_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_115_1.png)\n\
    \n将此测试表达式中的值改为零——即两个循环中都改为 while (i<0)——然后重新编译并再次运行程序，以查看仅 do while 循环的第一次迭代被执行。\n\
    \n## 跳出循环\n\n当满足指定条件时，可以使用 break 关键字提前终止循环。break 语句位于循环语句块内部，并且前面有一个测试表达式。当测试返回\
    \ true 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套的内层循环中，它会继续执行外层循环的下一次迭代。\n\n- 1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\
    \n```c\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_116_0.png)\n\
    \nbreakcontinue.c\n\n- 2. 添加一个 main 函数，声明两个整型变量，稍后将用作循环迭代计数器\n\n```c\nint main()\n\
    {\n    int i, j;\n}\n```\n\n- 3. 接下来，在 main 函数块中插入两个嵌套循环，在三次迭代中的每一次输出它们的计数器值\n\
    \n```c\nfor(i = 1 ; i < 4 ; i++)\n{\n    for(j = 1 ; j < 4 ; j++)\n    {\n   \
    \     printf(\"Running i=%d j=%d\\n\", i, j);\n    }\n}\n```\n\n- 4. 在 main 函数块末尾，按照函数声明的要求返回整数零值\n\
    \n```c\nreturn 0;\n```\n\n- 5. 保存程序文件，然后编译并执行程序，以查看嵌套循环的输出\n\n![](img/db19f3858a1e321646bf2590afd29547_117_0.png)\n\
    \n- 6. 现在，将此 break 语句插入内层循环块的最开头，以跳出内层循环——然后保存、编译并再次运行程序\n\n```c\nif(i == 2 &&\
    \ j == 1)\n{\n    printf(\"Breaks inner loop when i=%d and j=%d\\n\", i, j);\n\
    \    break;\n}\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_117_1.png)\n\n\
    当满足指定条件时，可以使用 continue 关键字跳过循环的一次迭代。continue 语句位于循环语句块内部，并且前面有一个测试表达式。当测试返回 true\
    \ 时，该次迭代结束。\n\n- 7. 将此 continue 语句插入内层循环块的开头，以跳过内层循环的第一次迭代——然后保存、编译并再次运行程序\n\n\
    ```c\nif(i == 1 && j == 1)\n{\n    printf(\"Continues inner loop when i=%d and\
    \ j=%d\\n\", i, j);\n    continue;\n}\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_118_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_118_1.png)\n\n此处，当外层循环第二次尝试运行内层循环时，**break**\
    \ 语句会停止内层循环的全部三次迭代。\n\n![](img/db19f3858a1e321646bf2590afd29547_118_2.png)\n\n\
    此处，当外层循环第一次尝试运行内层循环时，**continue** 语句仅跳过内层循环的第一次迭代。\n\n## 跳转到标签\n\n**goto** 关键字据说允许程序流程跳转到程序代码中其他位置的标签，就像网页上的超链接一样。然而，实际上这可能导致错误；它的使用不受欢迎；并且被视为不良编程实践。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_119_0.png)\n\n**goto** 关键字跳转是一项强大的特性，已在计算机程序中存在数十年，但它的能力被许多早期程序员滥用，他们创建了以令人费解的方式到处跳转的程序。这产生了不可读的程序代码，因此\
    \ **goto** 的使用变得极其不受欢迎。\n\n**goto** 关键字的一种可能有效用法是：通过跳转到外层循环块结束之后的标签，干净利落地跳出内层嵌套循环。这会立即退出两个循环，因此两个循环都不会再执行后续迭代。\n\
    \n- 1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n```c\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_119_1.png)\n\
    \n- 2. 添加一个 main 函数，声明两个整型变量，稍后将用作循环迭代计数器\n\n```c\nint main()\n{\n    int i, j;\n\
    ```\n\n- 3. 接下来，在 main 函数块中插入两个嵌套循环，在三次迭代中的每一次输出它们的计数器值\n\n```c\nfor(i = 1; i\
    \ < 4; i++)\n{\n\tfor(j = 1; j < 4; j++)\n\t{\n\t\tprintf(\"Running i=%d j=%d\\\
    n\", i, j);\n\t}\n}\n```\n\n- 4. 在内层嵌套循环的第一行插入一条语句，以便在指定计数器值时跳转到名为“end”的标签\n\n\
    ```c\nif(i == 2 && j == 1){ goto end;}\n```\n\n- 5. 现在，在外层循环的右花括号之后添加该标签\n\n```c\n\
    } end:\n```\n\n请注意，goto 语句仅通过名称指定标签，但标签本身必须有一个结尾的“:”冒号。\n\n- 6. 在 main 函数块末尾，按照函数声明的要求返回整数零值\n\
    \n```c\nreturn 0;\n```\n\n- 7. 保存程序文件，然后编译并执行程序，以查看循环在跳转后退出\n\n![](img/db19f3858a1e321646bf2590afd29547_120_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_120_1.png)\n\n一种避免使用 goto 关键字的替代方法，可能是在每个循环的每次迭代中检查某个变量是否为布尔真值\
    \ (1)：\n\n- 8. 在现有变量声明中再添加一个变量，并将其初始化为真值 1\n\n```c\nint i, j, flag = 1;\n```\n\
    \n- 9. 在外层循环块的开头，以及内层循环块中输出语句之前，插入对新变量值的条件测试\n\n```c\nif( flag )\n```\n\n- 10.\
    \ 更改内层循环的第一行，将 goto 语句替换为将变量赋值为假值 0 的语句\n\n```c\nif( i == 2 && j == 1 ) { flag\
    \ = 0 ; }\n```\n\n- 11. 删除右花括号之后现已过时的 end: 标签，然后保存、编译并再次执行程序，以查看与之前相同的结果输出\n\n\
    ![](img/db19f3858a1e321646bf2590afd29547_121_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_121_1.png)\n\
    \n在 C 中，布尔值在数值上表示为 1（真）和 0（假）。\n\n![](img/db19f3858a1e321646bf2590afd29547_121_2.png)\n\
    \n避免创建名为“goto.exe”的程序可执行文件，因为这会与 Windows 内部的 GOTO 命令冲突。\n\n## 总结\n\n- if 关键字执行基本的条件测试，以评估给定表达式的布尔值为\
    \ true 还是 false。\n- else 关键字可用于提供当 if 语句将表达式评估为 false 时要执行的替代语句。\n- 在评估之后为程序提供可供继续执行的替代方向称为“条件分支”。\n\
    - 由多个 if else 语句执行的条件分支通常可以通过 switch 语句更高效地执行。\n- 通常，switch 块内的 case 语句每个都必须以\
    \ break 语句终止。\n- 可选地，switch 块可以包含 default 语句，指定在未找到匹配项时要执行的语句。\n- for 关键字后面跟括号，其中指定初始化表达式、测试表达式和增量表达式，以控制循环。\n\
    - while 关键字后面跟括号，其中指定测试表达式，以确定循环是否应继续。\n- while 循环块之前必须有一个初始化器，并且其语句块内必须包含一个增量器。\n\
    - do 关键字后面跟一个语句块，之后必须有一个以分号终止的 while 语句。\n- do while 循环之前必须有一个初始化器，并且其语句块内必须包含一个增量器。\n\
    - 与 for 循环和 while 循环不同，do while 循环中的语句将始终至少执行一次。\n- break 关键字可用于终止循环，而 continue\
    \ 关键字可用于跳过单次迭代。\n- 循环可以嵌套，goto 关键字可用于退出到指定标签，尽管不建议使用它。\n"
