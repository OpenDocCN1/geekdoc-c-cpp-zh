    \ |\n| ! 逻辑非 ~ 按位非 ++ 自增<br>-- 自减 + 正号 sizeof<br>- 负号 * 指针 & 取地址 | 从右到左 |\n| *\
    \ 乘法 / 除法 % 取模 | 从左到右 |\n| + 加法 - 减法 | 从左到右 |\n| << 左移 >> 右移 | 从左到右 |\n| < 小于\
    \ <= 小于或等于<br>> 大于 >= 大于或等于 | 从左到右 |\n| == 相等 != 不相等 | 从左到右 |\n| & 按位与 | 从左到右\
    \ |\n| ^ 按位异或 | 从左到右 |\n| \\| 按位或 | 从左到右 |\n| && 逻辑与 | 从左到右 |\n| \\|\\| 逻辑或 |\
    \ 从左到右 |\n| ?: 条件 | 从右到左 |\n| = += -= *= /= %= &= ^= \\|= <<= >>= 赋值运算符 | 从右到左\
