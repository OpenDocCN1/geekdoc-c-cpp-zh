    \n## 转换字符串\n\n标准 C 库文件 stdlib.h 中包含一个名为 atoi() 的有用函数，可用于将字符串转换为整数。为了使该函数可用于程序，必须在程序开头添加\
    \ #include 指令以包含 stdlib.h 文件。\n\natoi() 函数，即字母转整数，将要转换的字符串作为其唯一参数。如果字符串为空，或者字符串的第一个字符不是数字或减号，则\
    \ atoi() 返回零。否则，字符串（或至少字符串开头的数字部分）将被转换为 int 数据类型，直到 atoi() 遇到字符串中的非数字字符为止。当 atoi()\
    \ 遇到字符串中的非数字字符时，它会将已转换的数字作为 int 数据类型返回。\n\n还有一个 itoa() 函数，即整数转字母，可用于将 int 数据类型值转换为字符串。该函数使用广泛，但不属于标准\
    \ ANSI C 规范。itoa() 函数需要三个参数：要转换的数字；转换后的数字要赋给的字符串；最后是转换所用的基数。例如，指定基数为 2 时，会将指定数字参数的二进制等价形式赋给指定的字符串参数。\n\
    \n符合 ANSI 标准的替代 itoa() 的函数是 stdlib.h 头文件中的 sprintf() 函数。它的功能较弱，因为不能指定基数。sprintf()\
    \ 函数同样接受三个参数——转换后的数字要赋给的字符串、格式说明符和要转换的数字。该函数返回一个整数，表示转换后字符串中的字符数。\n\n- 1. 在一个新程序中添加预处理指令，以包含标准输入/输出和转换函数\n\
    \n```\n#include <stdio.h>\n#include <stdlib.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_173_0.png)\n\
    \nconv.c\n\n- 2 添加一个 main 函数，声明三个整数变量，然后声明并初始化三个字符数组\n\n```c\nint main()\n{\n\
    \    int n1, n2, n3 ;\n    char s1[10]=\"12eight\", s2[10]=\"-65.8\", s3[10]=\"\
    x13\" ;\n}\n```\n\n- 3 现在，在 main 函数块中，尝试将每个字符串转换为整数值并输出结果\n\n```c\nn1 = atoi(\
    \ s1 );\nprintf( \"\\nString %s converts to Integer: %d\\n\", s1 , n1 );\n\nn2\
    \ = atoi( s2 );\nprintf( \"String %s converts to Integer: %d\\n\", s2 , n2 );\n\
    \nn3 = atoi( s3 );\nprintf( \"String %s converts to Integer: %d\\n\\n\", s3 ,\
    \ n3 );\n```\n\n- 4 接下来，在函数块中，使用非标准函数将第一个整数变量的值转换为包含其二进制等价形式的字符串，并输出结果\n\n```c\n\
    itoa( n1, s1, 2 );\nprintf( \"Decimal %d is Binary: %s\\n\", n1 , s1 );\n```\n\
    \n- 5 然后，使用标准库函数将第一个整数变量的值转换为包含其八进制和十六进制等价形式的字符串，并存储它们的字符长度\n\n```c\nn2 = sprintf(\
    \ s3, \"%o\", n1 );\nprintf( \"Decimal %d is Octal: %s chars: %d\\n\", n1, s3,\
    \ n2 );\n\nn3 = sprintf( s3, \"%x\", n1 );\nprintf(\"Decimal %d is Hexadecimal:\
