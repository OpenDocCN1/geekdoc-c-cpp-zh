    \n每个预处理器条件测试都必须以 `#endif` 指令结束。\n\n## 总结\n\n- 永远不会改变的固定数据值应存储为常量，并使用 **const**\
    \ 关键字声明。\n- 声明常量时，声明必须始终用其固定数据值初始化该常量。\n- **enum** 关键字创建按顺序编号的整数常量序列，默认从零开始。\n\
    - 枚举序列中的任何常量都可以显式赋值为一个整数值，该序列中后续常量将在此基础上递增。\n- 一个枚举常量序列可被视为一种新数据类型，可以创建该类型的变量来存储由该类型定义的枚举集中的值。\n\
    - 可以使用 **typedef** 关键字定义自定义数据类型，然后可以使用与声明常规变量相同的语法创建该类型的变量。\n- 预处理器 **#define**\
    \ 指令可用于指定在编译前要替换的常量文本值。\n- 条件预处理器 **#ifdef** 指令评估当前是否存在某个定义。\n- 宏是一种预处理器例程，必须以\
    \ **#endif** 指令结束。\n- 编译器定义的常量（例如 `_WIN32` 和 `linux`）可用于确定宿主操作系统。\n- 可以使用 **#if**、**#else**\
    \ 和 **#elif** 预处理器指令提供宏的替代分支。\n- 常量宏定义可以使用 **#undef** 指令取消定义，并使用 **#ifndef** 指令评估为未定义。\n\
    - 宏可用于通过轻松隐藏或显示代码段来帮助调试源代码。\n\n## 4\n\n## 执行操作\n\n*本章演示如何使用 C 运算符在 C 程序中操作数据。*\n\
    \n- 进行算术运算\n- 赋值\n- 比较值\n- 评估逻辑\n- 检查条件\n- 测量大小\n- 比较位值\n- 标记位\n- 理解优先级\n- 总结\n\
    \n## 进行算术运算\n\nC 程序中常用的算术运算符及其执行的操作如下表所示：\n\n![](img/db19f3858a1e321646bf2590afd29547_75_0.png)\n\
    \n| 运算符 | 操作 |\n|---|---|\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| %\
    \ | 取模 |\n| ++ | 递增 |\n| -- | 递减 |\n\n加法、减法、乘法和除法运算符的作用与预期一致。不过，在使用多个运算符时，必须注意用括号使表达式清晰：\n\
    \n```c\na = b * c - d % e / f;    /* This is unclear. */\na = (b * c) - ((d %\
    \ e) / f);    /* This is clearer. */\n```\n\n`%` 取模运算符将第一个给定数字除以第二个给定数字，并返回运算的余数。这对于判断一个数字是奇数还是偶数很有用。\n\
    \n`++` 递增运算符和 `--` 递减运算符会将给定数字改变\n"
