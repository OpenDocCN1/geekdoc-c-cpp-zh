    ## Argument functions


    <stdarg.h>

    <stdarg.h> 头文件包含可用于在不知道其数量和类型的情况下遍历函数参数列表的函数。由于这些函数的性质，它们必须在函数体内作为“宏”实现。


    参数列表被分配给一个名为 va_list 的特殊数据类型。下表中列出的函数操作名为 “args” 的 va_list 类型变量：


    | Function | Description |

    |---|---|

    | va_start( va_list args , lastarg) | 必须调用一次以在最后一个已知参数 lastarg 的列表位置初始化名为 args
    的 va_list |

    | va_arg( va_list args , data-type ) | 在 va_list args 由 va_start() 初始化后，对 va_arg()
    的每次后续调用都将返回 args 列表中下一个参数的值，类型为指定的 data-type |

    | va_end( va_list args ) | 必须在处理完 va_list args 中的参数后、在退出函数之前调用一次 |


