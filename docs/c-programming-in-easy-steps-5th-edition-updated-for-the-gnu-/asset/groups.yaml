  - "[PAGE 130]\n\n# Calling recursively\n\nStatements within custom functions can\
    \ freely call other custom functions just as readily as they can call standard\
    \ library functions like **printf()**.\n\nAdditionally, functions can call themselves,\
    \ and these are known as “recursive functions”. As with loops it is important\
    \ that recursive functions must modify a tested expression to avoid continuous\
    \ execution – so the function call ends at some point.\n\n+   1. Begin a new program\
    \ with a preprocessor instruction to include the standard input/output library\
    \ functions\n\n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_130_0.png)\n\
