  mdcn: "\n## 声明程序常量\n\n当程序需要使用一个永远不会改变的固定常量数据值时，它应与变量以相同的方式声明，但要在声明中包含 const 关键字。例如，表示不变的整数值一百万的常量可以像这样声明并初始化：\n\
