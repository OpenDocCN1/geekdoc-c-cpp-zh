    # Summary


    +   - A variable is a container in a C program in which a data value can be stored
    in computer memory.

    +   - Variable names must adhere to the C naming conventions.

    +   - The four basic data types in C are **char**, **int**, **float**, and **double**.

    +   - Format specifiers **%d**, **%f**, **%c**, **%s**, and **%p** can be used
    with the **printf()** function to display variable values of different types.

    +   - User input can be assigned to variables by the **scanf()** function.

    +   - The permissible range of **int** variables can be explicitly qualified using
    the **short** and **long** keywords.

    +   - Variables that will never hold negative values may be qualified as **unsigned**
    to extend their positive range.

    +   - The number of memory bytes reserved by any variable can be revealed using
    the **sizeof** operator.

    +   - Variable scope describes the extent of accessibility to a variable, and
    may be local or global.

    +   - The **extern** keyword specifies an externally defined variable and the
    **static** keyword limits accessibility to the same source file.

    +   - Performance of heavily used variables may be improved using the **register**
    keyword to place the variable in a machine register.

    +   - Variables unsuitable for registers can be marked as **volatile**.

    +   - The compiler may implicitly change data types where that is logical, or
    they may be changed explicitly by casting.

    +   - Array variables store multiple items of data within individual elements
    that are sequentially numbered – starting at zero.

    +   - Values in array elements are referenced by the array variable name followed
    by their element number within square brackets.

    +   - Array variables can have multiple indices to create. multi-dimensional arrays.'
  md: "\n## Creating array variables\n\nAn array variable can store multiple items\
    \ of data, unlike a regular variable that can only store a single item of data.\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_50_0.png)\n\nThe items of data are\
    \ stored sequentially in array “elements” that are numbered starting at zero.\
    \ So, the first array value is stored in array element zero; the second array\
    \ value is stored in array element one; and so on.\n\nAn array variable is declared\
    \ in a C program in the same way as regular variables but additionally, the size\
    \ of the array (its number of elements) should be specified in the declaration.\
    \ This is stated within square brackets following the array name, with this syntax:\n\
    \n```text\ndata-type array-name [ number-of-elements ] ;\n```\n\nOptionally, an\
    \ array can be initialized when it is declared by assigning values to each element\
    \ as a comma-separated list enclosed by curly brackets (braces). For example,\
    \ an array of three integers can be created and initialized with int arr[3] =\
    \ { 1,2,3 } .\n\nAn array element value can be referenced using the array name\
    \ followed by square brackets containing the element number. For example, arr[0]\
    \ references the value in the first element.\n\nIt is acceptable in an array declaration\
    \ to omit the number between the square brackets if the elements are being initialized\
    \ in the declaration – the size will be automatically adjusted to accommodate\
    \ the number of values being assigned to the array.\n\nOne of the most significant\
    \ uses of arrays in C programming concerns their ability to store strings of text.\
    \ Each element in an array of the char data type can store a single character.\
    \ Adding a special \\0 null character escape sequence in the array’s final element\
    \ promotes the array to string status. For example, a string can be created and\
    \ initialized with char str[4] = {'C', 'a', 't', '\\0'};.\n\nA character array\
    \ promoted to string status allows the entire string to be referenced using just\
    \ the array name, and can be displayed with the printf() function and the %s format\
    \ specifier – for example, to display a string stored in array str with printf(\"\
    %s\", str);.\n\nArray elements start numbering at zero, not one.\n\nWhen creating\
    \ an array to hold a string, remember to allow space for an element at the end\
    \ to contain the \\0 null character.\n\n```c\n#include <stdio.h>\n```\n\n```c\n\
    int main()\n{\n    int arr[3];\n}\n```\n\n- 1. Begin a new program with a preprocessor\
    \ instruction to include the standard input/output library functions\n  ```c\n\
    \  #include <stdio.h>\n  ```\n- 2. Add a main function that declares an integer\
    \ array of three elements\n  ```c\n  int main()\n  {\n      int arr[3];\n  }\n\
    \  ```\n- 3. Next, insert statements to initialize the integer array elements\
    \ by individually assigning values to each element\n  ```c\n  arr[0] = 100 ;\n\
    \  arr[1] = 200 ;\n  arr[2] = 300 ;\n  ```\n- 4. Now, insert a statement to create\
    \ and initialize a character array to hold a string of text\n  ```c\n  char str[10]\
    \ = {'C',' ','P','r','o','g','r','a','m','\\0'} ;\n  ```\n- 5. Insert statements\
    \ to output all element values of the integer array and the string from the character\
    \ array\n  ```c\n  printf(\"1st element value: %d \\n\" , arr[0] ) ;\n  printf(\"\
    2nd element value: %d \\n\" , arr[1] ) ;\n  printf(\"3rd element value: %d \\\
    n\" , arr[2] ) ;\n  printf(\"String: %s \\n\" , str ) ;\n  ```\n- 6. At the end\
    \ of the function block, return a zero integer value, as required by the function\
    \ declaration\n  ```c\n  return 0 ;\n  ```\n- 7. Save the program file, then compile\
    \ and execute the program to see the values stored in the array variables\n  \n\
    \  ![](img/db19f3858a1e321646bf2590afd29547_52_0.png)\n  \n  ![](img/db19f3858a1e321646bf2590afd29547_52_1.png)\n\
    \nThe creation of an array allocates memory for each element according to the\
    \ data type – one byte per element for char arrays. So, arrays cannot be dynamically\
    \ resized.\n\n## Describing dimensions\n\nThe numbering of array elements is more\
    \ correctly known as the “array index” and, because element numbering starts at\
    \ zero, is sometimes referred to as a “zero-based index”. An array created with\
    \ a single index is a one-dimensional array in which the elements appear in a\
    \ single row:\n\n| Element content... | A | B | C | D | E |\n| --- | --- | ---\
    \ | --- | --- | --- |\n| Index numbers... | [0] | [1] | [2] | [3] | [4] |\n\n\
    Arrays can also have multiple indices – to represent multiple dimensions. An array\
    \ created with two indices is a two-dimensional array in which the elements appear\
    \ in multiple rows:\n\n| First index [0] | [0] | A | B | C | D | E |\n| --- |\
    \ --- | --- | --- | --- | --- | --- |\n| | [1] | F | G | H | I | J |\n| Second\
    \ index | | [0] | [1] | [2] | [3] | [4] |\n\nWith multi-dimensional arrays the\
    \ value contained in each element is referenced by stating the number of each\
    \ index. For example, with the two-dimensional array above, the element at [1][2]\
    \ contains the letter H.\n\nTwo-dimensional arrays are useful to store grid-based\
    \ information, such as XY coordinates. Creating a three-dimensional array, with\
    \ three indices, would allow XYZ coordinates to be stored:\n\n![](img/db19f3858a1e321646bf2590afd29547_54_0.png)\n\
    \nAdditional indices allow the creation of arrays with many dimensions, but in\
    \ reality multi-dimensional arrays of more than three indices are uncommon as\
    \ they are difficult to envision.\n\n![](img/db19f3858a1e321646bf2590afd29547_54_1.png)\n\
    \nMulti-dimensional arrays with more than two indices can produce hard-to-read\
    \ source code and may lead to errors.\n\n- 1. Begin a new program with a preprocessor\
    \ instruction to include the standard input/output library functions\n  ```c\n\
    \  #include <stdio.h>\n  ```\n  \n  ![](img/db19f3858a1e321646bf2590afd29547_54_2.png)\n\
    \  \n  matrix.c\n- 2. Add a main function that declares and initializes a two-dimensional\
    \ integer array\n  ```c\n  int main()\n  {\n    int matrix[2][3] = { {'A','B','C'},\
    \ {1,2,3} };\n  }\n  ```\n- 3. Next, insert statements to display the content\
    \ of all elements in the first index\n  ```c\n  printf(\"Element [0][0] contains\
    \ %c \\n\", matrix[0][0]);\n  printf(\"Element [0][1] contains %c \\n\", matrix[0][1]);\n\
    \  printf(\"Element [0][2] contains %c \\n\", matrix[0][2]);\n  ```\n- 4. Now,\
    \ insert statements to display the content of all elements in the second index\n\
    \  ```c\n  printf(\"Element [1][0] contains %d \\n\", matrix[1][0]);\n  printf(\"\
    Element [1][1] contains %d \\n\", matrix[1][1]);\n  printf(\"Element [1][2] contains\
    \ %d \\n\", matrix[1][2]);\n  ```\n- 5. At the end of the function block, return\
    \ a zero integer value, as required by the function declaration\n  ```c\n  return\
    \ 0 ;\n  ```\n- 6. Save the program file, then compile and execute the program\
    \ to see all the values stored within the two-dimensional array elements\n  \n\
    \  ![](img/db19f3858a1e321646bf2590afd29547_55_0.png)\n  \n  ![](img/db19f3858a1e321646bf2590afd29547_55_1.png)\n\
    \nNotice here how implicit casting stores the letters' ASCII code values in the\
    \ integer array but the %c format specifier displays them as letters again.\n\n\
    ## Summary\n\n- A variable is a container in a C program in which a data value\
    \ can be stored in computer memory.\n- Variable names must adhere to the C naming\
    \ conventions.\n- The four basic data types in C are **char**, **int**, **float**,\
    \ and **double**.\n- Format specifiers **%d**, **%f**, **%c**, **%s**, and **%p**\
    \ can be used with the **printf()** function to display variable values of different\
    \ types.\n- User input can be assigned to variables by the **scanf()** function.\n\
    - The permissible range of **int** variables can be explicitly qualified using\
    \ the **short** and **long** keywords.\n- Variables that will never hold negative\
    \ values may be qualified as **unsigned** to extend their positive range.\n- The\
    \ number of memory bytes reserved by any variable can be revealed using the **sizeof**\
    \ operator.\n- Variable scope describes the extent of accessibility to a variable,\
    \ and may be local or global.\n- The **extern** keyword specifies an externally\
    \ defined variable and the **static** keyword limits accessibility to the same\
    \ source file.\n- Performance of heavily used variables may be improved using\
    \ the **register** keyword to place the variable in a machine register.\n- Variables\
    \ unsuitable for registers can be marked as **volatile**.\n- The compiler may\
    \ implicitly change data types where that is logical, or they may be changed explicitly\
    \ by casting.\n- Array variables store multiple items of data within individual\
    \ elements that are sequentially numbered – starting at zero.\n- Values in array\
    \ elements are referenced by the array variable name followed by their element\
    \ number within square brackets.\n- Array variables can have multiple indices\
    \ to create multi-dimensional arrays.\n"
  mdcn: "\n## 创建数组变量\n\n数组变量可以存储多个数据项，而普通变量只能存储单个数据项。\n\n![](img/db19f3858a1e321646bf2590afd29547_50_0.png)\n\
    \n数据项按顺序存储在数组“元素”中，这些元素从零开始编号。因此，第一个数组值存储在数组元素零中；第二个数组值存储在数组元素一中；以此类推。\n\n在 C\
    \ 程序中，数组变量的声明方式与普通变量相同，但此外，还应在声明中指定数组的大小（其元素数量）。这是在数组名称后方用方括号表示，语法如下：\n\n```text\n\
    data-type array-name [ number-of-elements ] ;\n```\n\n可选地，数组可以在声明时通过为每个元素分配值来初始化，这些值作为逗号分隔的列表用花括号（大括号）括起来。例如，可以创建并初始化一个包含三个整数的数组，方法为\
    \ int arr[3] = { 1,2,3 } 。\n\n可以使用数组名称后跟包含元素编号的方括号来引用数组元素值。例如，arr[0] 引用第一个元素中的值。\n\
    \n如果在声明中初始化元素，则在数组声明中省略方括号之间的数字是可以接受的——大小将自动调整以适应分配给数组的值的数量。\n\n在 C 编程中，数组最显著的用途之一是其能够存储文本字符串。char\
    \ 数据类型的数组中的每个元素可以存储一个字符。在数组的最后一个元素中添加特殊的 \\0 空字符转义序列会使数组获得字符串状态。例如，可以通过 char str[4]\
    \ = {'C', 'a', 't', '\\0'}; 创建并初始化一个字符串。\n\n被提升为字符串状态的字符数组允许仅使用数组名称引用整个字符串，并且可以使用\
    \ printf() 函数和 %s 格式说明符显示——例如，使用 printf(\"%s\", str); 显示存储在数组 str 中的字符串。\n\n数组元素从零开始编号，而不是从一开始。\n\
    \n创建用于保存字符串的数组时，请记住为最后一个元素预留空间以包含 \\0 空字符。\n\n```c\n#include <stdio.h>\n```\n\n\
    ```c\nint main()\n{\n    int arr[3];\n}\n```\n\n- 1. 使用预处理器指令开始一个新程序，以包含标准输入/输出库函数\n\
    \  ```c\n  #include <stdio.h>\n  ```\n- 2. 添加一个 main 函数，声明一个包含三个元素的整数数组\n  ```c\n\
    \  int main()\n  {\n      int arr[3];\n  }\n  ```\n- 3. 接下来，插入语句通过单独为每个元素赋值来初始化整数数组元素\n\
    \  ```c\n  arr[0] = 100 ;\n  arr[1] = 200 ;\n  arr[2] = 300 ;\n  ```\n- 4. 现在，插入一条语句来创建并初始化一个字符数组以保存文本字符串\n\
    \  ```c\n  char str[10] = {'C',' ','P','r','o','g','r','a','m','\\0'} ;\n  ```\n\
    - 5. 插入语句以输出整数数组的所有元素值以及字符数组中的字符串\n  ```c\n  printf(\"1st element value: %d \\\
    n\" , arr[0] ) ;\n  printf(\"2nd element value: %d \\n\" , arr[1] ) ;\n  printf(\"\
    3rd element value: %d \\n\" , arr[2] ) ;\n  printf(\"String: %s \\n\" , str )\
    \ ;\n  ```\n- 6. 在函数块末尾，返回零整数值，如函数声明所要求\n  ```c\n  return 0 ;\n  ```\n- 7. 保存程序文件，然后编译并执行程序以查看存储在数组变量中的值\n\
    \  \n  ![](img/db19f3858a1e321646bf2590afd29547_52_0.png)\n  \n  ![](img/db19f3858a1e321646bf2590afd29547_52_1.png)\n\
    \n创建数组会根据数据类型为每个元素分配内存——char 数组每个元素一个字节。因此，数组不能动态调整大小。\n\n## 描述维度\n\n数组元素的编号更准确地称为“数组索引”，并且由于元素编号从零开始，有时也称为“零基索引”。使用单个索引创建的数组是一维数组，其元素出现在单行中：\n\
    \n| 元素内容... | A | B | C | D | E |\n| --- | --- | --- | --- | --- | --- |\n| 索引编号...\
    \ | [0] | [1] | [2] | [3] | [4] |\n\n数组也可以具有多个索引——用于表示多个维度。使用两个索引创建的数组是二维数组，其元素出现在多行中：\n\
    \n| 第一索引 [0] | [0] | A | B | C | D | E |\n| --- | --- | --- | --- | --- | ---\
    \ | --- |\n| | [1] | F | G | H | I | J |\n| 第二索引 | | [0] | [1] | [2] | [3] | [4]\
    \ |\n\n对于多维数组，每个元素包含的值是通过说明每个索引的编号来引用的。例如，对于上面的二维数组，[1][2] 处的元素包含字母 H。\n\n二维数组对于存储基于网格的信息很有用，例如\
    \ XY 坐标。创建具有三个索引的三维数组将允许存储 XYZ 坐标：\n\n![](img/db19f3858a1e321646bf2590afd29547_54_0.png)\n\
    \n额外的索引允许创建具有许多维度的数组，但实际上，超过三个索引的多维数组并不常见，因为它们难以想象。\n\n![](img/db19f3858a1e321646bf2590afd29547_54_1.png)\n\
    \n具有超过两个索引的多维数组可能产生难以阅读的源代码并可能导致错误。\n\n- 1. 使用预处理器指令开始一个新程序，以包含标准输入/输出库函数\n  ```c\n\
    \  #include <stdio.h>\n  ```\n  \n  ![](img/db19f3858a1e321646bf2590afd29547_54_2.png)\n\
    \  \n  matrix.c\n- 2. 添加一个 main 函数，声明并初始化一个二维整数数组\n  ```c\n  int main()\n  {\n\
    \    int matrix[2][3] = { {'A','B','C'}, {1,2,3} };\n  }\n  ```\n- 3. 接下来，插入语句以显示第一个索引中所有元素的内容\n\
    \  ```c\n  printf(\"Element [0][0] contains %c \\n\", matrix[0][0]);\n  printf(\"\
    Element [0][1] contains %c \\n\", matrix[0][1]);\n  printf(\"Element [0][2] contains\
    \ %c \\n\", matrix[0][2]);\n  ```\n- 4. 现在，插入语句以显示第二个索引中所有元素的内容\n  ```c\n  printf(\"\
    Element [1][0] contains %d \\n\", matrix[1][0]);\n  printf(\"Element [1][1] contains\
    \ %d \\n\", matrix[1][1]);\n  printf(\"Element [1][2] contains %d \\n\", matrix[1][2]);\n\
    \  ```\n- 5. 在函数块末尾，返回零整数值，如函数声明所要求\n  ```c\n  return 0 ;\n  ```\n- 6. 保存程序文件，然后编译并执行程序以查看二维数组元素中存储的所有值\n\
    \  \n  ![](img/db19f3858a1e321646bf2590afd29547_55_0.png)\n  \n  ![](img/db19f3858a1e321646bf2590afd29547_55_1.png)\n\
    \n注意这里隐式类型转换如何将字母的 ASCII 代码值存储在整数数组中，但 %c 格式说明符再次将它们显示为字母。\n\n## 摘要\n\n- 变量是 C\
    \ 程序中的一个容器，其中数据值可以存储在计算机内存中。\n- 变量名必须遵守 C 命名约定。\n- C 中的四种基本数据类型是 **char**、**int**、**float**\
    \ 和 **double**。\n- 格式说明符 **%d**、**%f**、**%c**、**%s** 和 **%p** 可与 **printf()**\
    \ 函数一起使用以显示不同类型的变量值。\n- 用户输入可以通过 **scanf()** 函数分配给变量。\n- **int** 变量的允许范围可以使用 **short**\
    \ 和 **long** 关键字显式限定。\n- 永不保存负值的变量可以限定为 **unsigned** 以扩展其正值范围。\n- 任何变量保留的内存字节数可以使用\
    \ **sizeof** 运算符揭示。\n- 变量作用域描述了对变量的访问范围，可以是局部或全局。\n- **extern** 关键字指定外部定义的变量，而\
    \ **static** 关键字将访问限制在同一源文件中。\n- 使用 **register** 关键字将变量放在机器寄存器中可以提高频繁使用变量的性能。\n\
    - 不适合寄存器的变量可以标记为 **volatile**。\n- 编译器在逻辑上可能隐式更改数据类型，或可以通过强制类型转换显式更改。\n- 数组变量在单独的元素中存储多个数据项，这些元素按顺序编号——从零开始。\n\
    - 数组元素中的值通过数组变量名称后跟方括号内的元素编号来引用。\n- 数组变量可以具有多个索引以创建多维数组。\n"
