  md: "\n## `<stdio.h>`\n\nIn C, a % prefix denotes a format specifier. All printf()\
    \ format specifiers are listed below, and those for scanf() here.\n\n| Character:\
    \ | printf() converts to: |\n|---|---|\n| d , i | int data type, signed decimal\
    \ |\n| o | int data type, unsigned octal without a leading zero |\n| x , X | int\
    \ unsigned hexadecimal. 0x uses lowercase, such as 0xff, and 0X uses uppercase,\
    \ such as 0XFF |\n| u | int data type, unsigned decimal |\n| c | int single character,\
    \ after conversion to char data type |\n| s | char pointer to string, ending with\
    \ the \\0 null character |\n| f | double data type in the form xxx.yyyyyy where\
    \ the number of digits after the decimal point is set by precision. The default\
    \ precision is 6 digits |\n| e , E | double data type in the form xx.yyyyyy±zz\
    \ or xx.yyyyyyE±zz where the number of digits after the decimal point is set by\
    \ precision. The default precision is 6 digits |\n| g , G | double data type printed\
    \ as %e or %E conversion or %f conversion, whichever is shorter |\n| p | the memory\
    \ address of a pointer |\n| n | not a conversion, but stores the number of characters\
    \ written so far by the call to the printf() function in an int pointer argument\
    \ |\n| % | not a conversion; prints a % |\n\n### Format specifiers for input\n\
    \n| Character: | scanf() converts to: |\n|---|---|\n| d | int data type, signed\
    \ decimal integer |\n| i | int data type, which may be in octal (leading 0) or\
    \ hexadecimal (leading 0x or 0X) |\n| o | int data type, octal integer with or\
    \ without a leading zero |\n| u | int data type, unsigned decimal |\n| x | int\
    \ hexadecimal integer, with or without leading 0x or 0X |\n| c | char characters,\
    \ into a specified array. Reads the number of characters stated in its width field\
    \ (default is 1) without adding a final \\0 null character. Stops reading when\
    \ a space is met |\n| s | a string of non-whitespace characters into an array.\
    \ The array must be big enough for all the characters plus a final \\0 null character\
    \ |\n| e , f , g | float data type, optionally beginning with a sign, then followed\
    \ by a string of numbers. These may contain a decimal point, and an optional exponent\
    \ field containing an \"E\" or \"e\" followed by a possibly signed integer |\n\
    | p | a memory address, in the same form as that output by the %p conversion with\
    \ printf() |\n| n | not a conversion, but stores the number of characters read\
    \ so far by the call to scanf() function in an int pointer argument |\n| [...]\
    \ | matches a string specified in the square brackets to those in the input stream\
    \ and adds a \\0 null character |\n| [^...] | matches all ASCII characters in\
    \ the input stream except those specified in the square brackets, and adds a \\\
    0 null character |\n\n### Functions for character input and output\n\n| Function\
    \ | Description |\n|---|---|\n| `int fgetc( FILE *stream )` | Returns the next\
    \ character of the specified stream as a **char**, or the **EOF** constant if\
    \ at the end of the file or if an error occurs |\n| `char *fgets( char *s , int\
    \ n , FILE *stream )` | Reads the next n - 1 characters from the specified stream\
    \ into the array then adds a \\0 null character at the end of the array. This\
    \ function returns s, or **NULL** if at the end of the file or if an error occurs\
    \ |\n| `int fputc( int c , FILE *stream )` | Writes the character **c** to the\
    \ specified stream and returns the character written or **EOF** if an error occurs\
    \ |\n| `int fputs( const char *s , FILE *stream )` | Writes the string **s** to\
    \ the specified stream and returns a non-negative value, or **EOF** if an error\
    \ occurs |\n| `int getc( FILE *stream )` | The **getc()** function is the macro\
    \ equivalent of **fgetc()** |\n\n- `int getchar( void )`\n\n  The getchar() function\
    \ is equivalent to getc( stdin )\n\n- `char *gets( char *s )`\n\n  Reads the next\
    \ input line into an array, replacing its final newline character with a \\0 null\
    \ character. It returns s, or NULL if at the end of the file or if an error occurs\n\
    \n- `int putc( int c , FILE *stream )`\n\n  The putc() function is the macro equivalent\
    \ of fputc()\n\n- `int putchar( int c )` is equivalent to `putc( c , stdout )`\n\
    \n- `int puts( const char *s )`\n\n  Writes the string s and a newline character\
    \ to stdout. It returns a non-negative value, or EOF if an error occurs\n\n- `int\
    \ ungetc( int c , FILE *stream )`\n\n  Pushes the character c back onto the specified\
    \ stream where it is returned on the next read. Only one pushback character per\
    \ stream is guaranteed and EOF cannot be pushed back. This function returns the\
    \ character pushed back, or EOF if an error occurs\n\n### Functions for direct\
    \ stream input and output\n\nThe fread() and fwrite() functions contained in the\
    \ stdio.h header file are most effective to read and write entire text files:\n\
    \n- `size_t fread( void *ptr , size_t size , size_t nobj , FILE *stream )`\n\n\
    \  The fread() function reads at most nobj objects of size size from the specified\
    \ stream into the array pointed to by the specified ptr pointer. This function\
    \ returns the number of objects it has read, which may be less than the number\
    \ requested in the function call.\n\n  The status of fread() can be tested as\
    \ it proceeds using the feof() function and ferror() functions — see the error\
    \ functions listed here\n\n- `size_t fwrite(const void *ptr, size_t size, size_t\
    \ nobj, FILE *stream )`\n\n  The fwrite() function writes nobj objects of size\
    \ size from the specified ptr pointer to the specified stream. It returns the\
    \ number of objects that it has written. If an error occurs, the returned value\
    \ will be less than that requested by nobj in the function call\n\nMany of the\
    \ standard functions in the C library set status indicators when an error occurs,\
    \ or when the end of a file is reached. These indicators can be tested using the\
    \ error functions listed in the table below. Also, the integer expression errno,\
    \ defined in the errno.h header file, may contain an error code giving more information\
    \ about the most recent error.\n\n### Error function\n\n- `void clearerr( FILE\
    \ *stream )`\n\n  The clearerr() function clears the end of file and error indicators\
    \ for the specified stream\n\n- `int feof( FILE *stream )`\n\n  The feof() function\
    \ returns a non-zero value if the end of file indicator is set for the specified\
    \ stream\n\n- `int ferror( FILE *stream )`\n\n  The ferror() function returns\
    \ a non-zero value if the error indicator is set for the specified stream\n\n\
    - `void perror( const char *s )`\n\n  The perror() function prints an implementation-defined\
    \ error message associated with the integer value contained in the errno expression.\
    \ See also the strerror() function in the string.h header file\n\n### File-positioning\
    \ functions\n\nA filestream is processed by moving through the characters it contains,\
    \ one by one. The functions in the following table can be used to manipulate the\
    \ position in the filestream:\n\n- `int fseek( FILE *stream, long offset, int\
    \ original )`\n\n  The fseek() function sets the file position in the specified\
    \ stream. Subsequent reading or writing begins at the new position. The new position\
    \ is determined by specifying how far to offset the position from its original\
    \ position. Optionally, the third argument of this function can be specified as\
    \ SEEK_SET (beginning), SEEK_CUR (current position), or SEEK_END (end of file).\
    \ For a text stream the offset must be either zero or a value returned by the\
    \ ftell() function, with the original position specified as SEEK_SET. The fseek()\
    \ function returns non-zero if an error occurs\n\n- `long ftell( FILE *stream\
    \ )`\n\n  The ftell() function returns the current file position of the specified\
    \ stream, or -1 if an error occurs\n\n- `int fgetpos( FILE *stream , fpos_t *ptr\
    \ )`\n\n  The fgetpos() function records the current file position of the specified\
    \ stream in the specified ptr pointer as a special fpos_t type. This function\
    \ returns a non-zero value if an error occurs\n\n- `int fsetpos( FILE *stream\
    \ , const fpos_t *ptr )`\n\n  The fsetpos() function positions the file pointer\
    \ in the specified stream at the position recorded by fgetpos() in the ptr pointer.\
    \ This function returns a non-zero value if an error occurs\n"
  mdcn: "\n## `<stdio.h>`\n\n在 C 语言中，% 前缀表示格式说明符。下面列出了所有 printf() 格式说明符，scanf() 的格式说明符见此处。\n\
    \n| 字符： | printf() 转换为： |\n|---|---|\n| d , i | int 数据类型，有符号十进制 |\n| o | int 数据类型，无前导零的无符号八进制\
    \ |\n| x , X | int 无符号十六进制。0x 使用小写，例如 0xff，0X 使用大写，例如 0XFF |\n| u | int 数据类型，无符号十进制\
    \ |\n| c | int 单个字符，转换为 char 数据类型后 |\n| s | 指向字符串的 char 指针，以 \\0 空字符结尾 |\n| f\
    \ | double 数据类型，形式为 xxx.yyyyyy，其中小数点后的位数由精度设置。默认精度为 6 位 |\n| e , E | double 数据类型，形式为\
    \ xx.yyyyyy±zz 或 xx.yyyyyyE±zz，其中小数点后的位数由精度设置。默认精度为 6 位 |\n| g , G | double 数据类型，按\
    \ %e 或 %E 转换或 %f 转换中较短者打印 |\n| p | 指针的内存地址 |\n| n | 不是转换，而是将到目前为止 printf() 函数调用已写入的字符数存储到\
    \ int 指针参数中 |\n| % | 不是转换；打印一个 % |\n\n### 输入的格式说明符\n\n| 字符： | scanf() 转换为： |\n\
    |---|---|\n| d | int 数据类型，有符号十进制整数 |\n| i | int 数据类型，可以是八进制（前导 0）或十六进制（前导 0x 或\
    \ 0X） |\n| o | int 数据类型，带或不带前导零的八进制整数 |\n| u | int 数据类型，无符号十进制 |\n| x | int 十六进制整数，带或不带前导\
    \ 0x 或 0X |\n| c | char 字符，读入指定数组。读取其宽度字段中指定的字符数（默认是 1），不添加最后的 \\0 空字符。遇到空格时停止读取\
    \ |\n| s | 一串非空白字符读入数组。该数组必须足够大，以容纳所有字符外加最后的 \\0 空字符 |\n| e , f , g | float 数据类型，可选以符号开头，然后跟一串数字。这些数字可以包含小数点，以及一个可选指数字段，该字段包含\
    \ \"E\" 或 \"e\"，后跟一个可能带符号的整数 |\n| p | 内存地址，形式与 printf() 的 %p 转换输出相同 |\n| n | 不是转换，而是将到目前为止\
    \ scanf() 函数调用已读取的字符数存储到 int 指针参数中 |\n| [...] | 将方括号中指定的字符串与输入流中的字符串匹配，并添加 \\\
    0 空字符 |\n| [^...] | 匹配输入流中除方括号中指定字符之外的所有 ASCII 字符，并添加 \\0 空字符 |\n\n### 字符输入和输出函数\n\
    \n| 函数 | 描述 |\n|---|---|\n| `int fgetc( FILE *stream )` | 将指定流的下一个字符作为 **char**\
    \ 返回；如果到达文件末尾或发生错误，则返回 **EOF** 常量 |\n| `char *fgets( char *s , int n , FILE *stream\
    \ )` | 从指定流读取接下来的 n - 1 个字符到数组中，然后在数组末尾添加 \\0 空字符。该函数返回 s；如果到达文件末尾或发生错误，则返回 **NULL**\
    \ |\n| `int fputc( int c , FILE *stream )` | 将字符 **c** 写入指定流，并返回写入的字符；如果发生错误，则返回\
    \ **EOF** |\n| `int fputs( const char *s , FILE *stream )` | 将字符串 **s** 写入指定流，并返回非负值；如果发生错误，则返回\
    \ **EOF** |\n| `int getc( FILE *stream )` | **getc()** 函数是 **fgetc()** 的宏等价物 |\n\
    \n- `int getchar( void )`\n\n  getchar() 函数等价于 getc( stdin )\n\n- `char *gets(\
    \ char *s )`\n\n  将下一行输入读入数组，用 \\0 空字符替换其末尾的换行字符。它返回 s；如果到达文件末尾或发生错误，则返回 NULL\n\
    \n- `int putc( int c , FILE *stream )`\n\n  putc() 函数是 fputc() 的宏等价物\n\n- `int\
    \ putchar( int c )` 等价于 `putc( c , stdout )`\n\n- `int puts( const char *s )`\n\
    \n  将字符串 s 和换行字符写入 stdout。它返回非负值；如果发生错误，则返回 EOF\n\n- `int ungetc( int c , FILE\
    \ *stream )`\n\n  将字符 c 推回指定流，下次读取时将返回它。每个流只保证一个推回字符，且不能推回 EOF。该函数返回被推回的字符；如果发生错误，则返回\
    \ EOF\n\n### 直接流输入和输出函数\n\nstdio.h 头文件中包含的 fread() 和 fwrite() 函数在读写整个文本文件时最有效：\n\
    \n- `size_t fread( void *ptr , size_t size , size_t nobj , FILE *stream )`\n\n\
    \  fread() 函数从指定流最多读取 nobj 个大小为 size 的对象到指定 ptr 指针所指向的数组中。该函数返回已读取的对象数，可能少于函数调用中请求的数量。\n\
    \n  fread() 的状态可以在其执行过程中使用 feof() 函数和 ferror() 函数进行测试——参见此处列出的错误函数\n\n- `size_t\
    \ fwrite(const void *ptr, size_t size, size_t nobj, FILE *stream )`\n\n  fwrite()\
    \ 函数将指定 ptr 指针处 nobj 个大小为 size 的对象写入指定流。它返回已写入的对象数。如果发生错误，返回值将少于函数调用中 nobj 请求的数量\n\
    \nC 库中的许多标准函数在发生错误或到达文件末尾时会设置状态指示器。这些指示器可以使用下表列出的错误函数进行测试。此外，errno.h 头文件中定义的整数表达式\
    \ errno 可能包含错误代码，提供有关最近错误的更多信息。\n\n### 错误函数\n\n- `void clearerr( FILE *stream\
    \ )`\n\n  clearerr() 函数清除指定流的文件末尾和错误指示器\n\n- `int feof( FILE *stream )`\n\n  如果为指定流设置了文件末尾指示器，feof()\
    \ 函数返回非零值\n\n- `int ferror( FILE *stream )`\n\n  如果为指定流设置了错误指示器，ferror() 函数返回非零值\n\
    \n- `void perror( const char *s )`\n\n  perror() 函数打印与 errno 表达式中包含的整数值关联的实现定义错误消息。另请参见\
    \ string.h 头文件中的 strerror() 函数\n\n### 文件定位函数\n\n文件流通过逐个移动其包含的字符来处理。下表中的函数可用于操作文件流中的位置：\n\
    \n- `int fseek( FILE *stream, long offset, int original )`\n\n  fseek() 函数设置指定流中的文件位置。后续读取或写入从新位置开始。新位置通过指定相对于原始位置的偏移量来确定。可选地，此函数的第三个参数可以指定为\
    \ SEEK_SET（开头）、SEEK_CUR（当前位置）或 SEEK_END（文件末尾）。对于文本流，偏移量必须为零或 ftell() 函数返回的值，且原始位置指定为\
    \ SEEK_SET。如果发生错误，fseek() 函数返回非零值\n\n- `long ftell( FILE *stream )`\n\n  ftell()\
    \ 函数返回指定流的当前文件位置；如果发生错误，则返回 -1\n\n- `int fgetpos( FILE *stream , fpos_t *ptr )`\n\
    \n  fgetpos() 函数将指定流的当前文件位置以特殊的 fpos_t 类型记录到指定 ptr 指针中。如果发生错误，该函数返回非零值\n\n- `int\
    \ fsetpos( FILE *stream , const fpos_t *ptr )`\n\n  fsetpos() 函数将指定流中的文件指针定位到\
    \ fgetpos() 记录在 ptr 指针中的位置。如果发生错误，该函数返回非零值\n"
