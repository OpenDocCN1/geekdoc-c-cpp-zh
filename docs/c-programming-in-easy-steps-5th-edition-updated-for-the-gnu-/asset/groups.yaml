    # Generating random numbers


    The `stdlib.h` header file provides a `rand()` function that generates a pseudo-random
    positive integer when called. This will, by default, return a number in the range
    from 0 to a large value (at least 32,767). A specific range can be set by using
    the modulus operator to specify a maximum upper limit – for example, to specify
    a range from 0 to 9 with the expression `rand() % 9`.


    To set a minimum lower limit for the range, its value can be added to the result
    of the expression – for example, to specify a range from 1 to 10 with the expression
    `( rand() % 9 ) + 1`.


    The numbers generated by the `rand()` function are not truly random, as the function
    successively generates the same sequence of numbers each time a program using
    `rand()` is executed. In order to generate a different sequence of numbers, the
    “seed” that starts the sequence must be specified. By default, the initial seed
    value is 1, but this can be changed by specifying an alternative integer argument
    to the `srand()` function – for example, `srand(8)`. This will cause `rand()`
    to generate a different sequence of numbers to those generated using the default
    seed value, but the sequence will still be repeated each time a program using
    `rand()` is executed.


    To generate different random sequences upon successive execution the argument
    specified to `srand()` must be something other than a static integer. The common
    solution is to seed the `rand()` function with the current time in elapsed seconds
    with `srand( time( NULL ) )`.


    Now, the sequence of numbers generated by `rand()` will be different each time
    a program using `rand()` is executed.


    +   1. Begin a new program with preprocessor instructions to include the standard
    input/output library functions, random number, time, and string functions


    ```

    ```c

    #include <stdio.h>

    #include <stdlib.h>

    #include <time.h>

    #include <string.h>

    ```

