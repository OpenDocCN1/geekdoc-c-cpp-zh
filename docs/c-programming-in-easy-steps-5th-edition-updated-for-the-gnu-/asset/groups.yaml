    # Converting data types


    The compiler will implicitly change one type of data into another if it seems
    logical to do so. For example, where an integer is assigned to a **float** variable,
    the compiler converts the integer to a floating-point value.


    Any data stored in a variable can be explicitly forced (coerced) into a variable
    of a different data type by a process known as “casting”. A cast just states the
    data type to which the variable should be converted in parentheses before the
    name of the variable storing the data in its original data type. The parentheses
    should also include any modifiers, such as **unsigned**, where appropriate – so
    the syntax of a cast looks like this:


    ```

    *variable-name2* = ( *modifiers data-type* ) *variable-name1* ;

    ```


    Note that casting does not change the original data type of the variable but merely
    copies that value as a different data type.


    When casting from a **float** variable into an **int** variable the value is simply
    truncated at the decimal point. There is no rounding to the nearest integer. For
    example, with **float num = 5.75** the cast to an integer with **(int)num** produces
    the integer **5**, not **6**.


    When casting from a **char** variable to an **int** variable the resulting integer
    value is the numerical ASCII code value that represents that character. The uppercase
    alphabet has numerical ASCII values 65-90, whereas the lowercase alphabet has
    97-122. For example, with **char letter = ‘A’** the cast to an integer with **(int)
    letter** produces the integer **65**. Casting integer values within these ranges
    to a **char** data type produces the equivalent letter.


    It is often necessary to cast integer values into their floating-point equivalents
    to perform accurate arithmetic. Division can otherwise produce a truncated integer
    result. For example, with **int x=7,y=5** the statement **float z = x / y** assigns
    the value of **1.000000**. Accurate arithmetic requires the statement to use casts
    as **(float)x / (float)y** produces the floating-point value of **1.400000**.


    Casting long, precise floating-point numbers from a **double** data type into
    a shorter **float** data type does not simply truncate the longer value at the
    sixth'
