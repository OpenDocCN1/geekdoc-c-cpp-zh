    ## Compiling a C program


    The C source code files for the examples in this book are stored in a directory
    created expressly for that purpose. The directory is named “MyPrograms” and its
    absolute address on Windows is **C:\MyPrograms**, whereas on Linux it’s at **/home/user/MyPrograms**.
    The **hello.c** source code file, created by following the steps here, is saved
    in this directory awaiting compilation to produce a version in executable byte
    code format.


    - 1. At a command prompt, issue a **cd** command with the path to the **MyPrograms**
    directory to navigate there

    - 2. At a command prompt in the **MyPrograms** directory, type **gcc hello.c**
    then hit Return to compile the program


    When the compilation succeeds, the compiler creates an executable file alongside
    the original source code file. By default, this file will be named **a.out** on
    Linux systems and **a.exe** on Windows systems. Compiling a different C source
    code file in the **MyPrograms** directory would now overwrite the first executable
    file without warning. This is obviously unsatisfactory so a custom name for the
    executable file must be specified when compiling **hello.c**. This can be achieved
    by including a **-o** option followed by a custom name in the compiler command.


    - 3. At a command prompt in the **MyPrograms** directory, type **gcc hello.c -o
    hello.exe** then hit Return to compile the program once more


    On both Linux and Windows systems an executable file named **hello.exe** is now
    created alongside the C source code file:


    ![](img/db19f3858a1e321646bf2590afd29547_21_0.png)


    ![](img/db19f3858a1e321646bf2590afd29547_21_1.png)


    ![](img/db19f3858a1e321646bf2590afd29547_21_2.png)


    At a command prompt, type `gcc --help` then hit Return to see a list of all compiler
    options.


    - 4. At a command prompt in Windows, type the executable filename then hit Return
    to run the program – the text string is output and the print head moves to the
    next line


    ![](img/db19f3858a1e321646bf2590afd29547_21_3.png)


    Because Linux does not by default look in the current directory for executable
    files, unless it is specifically directed to do so, it is necessary to prefix
    the filename with ./ to execute the program.


    - 5. At a command prompt in Linux, type `./hello.exe` then hit Return to run the
    program – the text string is output and the print head moves to the next line


    ![](img/db19f3858a1e321646bf2590afd29547_22_0.png)


    You have now created, compiled, and executed the simple Hello World program that
    is the starting point in C programming. All other examples in this book will be
    created, compiled, and executed in the same way.


    ![](img/db19f3858a1e321646bf2590afd29547_22_1.png)


    If the compiler complains that there is no new line at the end of the file add
    a carriage return to the end of the source code, then save and retry.


    ![](img/db19f3858a1e321646bf2590afd29547_22_2.png)


    Windows users can even omit the file extension to run programs. In this case,
    typing just hello is sufficient.


    ## Understanding compilation


    In producing an executable file from an original C source code file, the compilation
    process actually undergoes four separate stages, which each generate a new file:


    ![](img/db19f3858a1e321646bf2590afd29547_23_0.png)


    - Preprocessing – The preprocessor substitutes all preprocessor directives in
    the original source code .c file with actual library code that implements those
    directives. For instance, library code is substituted for #include directives.
    The generated file containing the substitutions is in text format and typically
    has a .i file extension.

    - Translating – The compiler translates the high-level instructions in the .i
    file into low-level Assembly language instructions. The generated file containing
    the translation is in text format and typically has a .s file extension.

    - Assembling – The assembler converts the Assembly language text instructions
    in the .s file into machine code. The generated object file containing the conversion
    is in binary format and typically has a .o file extension.

    - Linking – The linker combines one or more binary object .o files into a single
    executable file. The generated file is in binary format and typically has a .exe
    file extension.


    Strictly speaking, “compilation” describes the first three stages above, which
    operate on a single source code text file and ultimately generate a single binary
    object file. Where the program source code contains syntax errors, such as a missing
    semi-colon statement terminator or a missing parenthesis, they will be reported
    by the compiler and compilation will fail.


    The linker, on the other hand, can operate on multiple object files and ultimately
    generates a single executable file. This allows the creation of large programs
    from modular object files that may each contain reusable functions. Where the
    linker finds a function of the same name defined in multiple object files it will
    report an error and the executable file will not be created.


    Normally, the temporary files created during the intermediary stages of the compilation
    process are automatically deleted, but they can be retained for inspection by
    including a -save-temps option in the compiler command:


    - 1. At a command prompt in the MyPrograms directory, type gcc hello.c -save-temps
    -o hello.exe then hit Return to recompile the program and save the temporary files


    ![](img/db19f3858a1e321646bf2590afd29547_24_0.png)


    - 2. Open the **hello.i** file in a plain text editor such as Windows’ Notepad,
    to see your source code at the very end of the file preceded by substituted **stdio.h**
    library code

    - 3. Now, open the **hello.s** file in a plain text editor to see the translation
    into low-level Assembly code and note how unfriendly that appears in contrast
    to the C code version


    ![](img/db19f3858a1e321646bf2590afd29547_25_0.png)


    ![](img/db19f3858a1e321646bf2590afd29547_25_1.png)


    Programs tediously written in Assembly language can run faster than those written
    in C but are more difficult to develop and maintain. For traditional computer
    programming, C is almost always the first choice.


    ## Summary


    - The American National Standards Institute (ANSI) established the recognized
    standard for the C programming language.

    - Other programming languages, such as C++ and C#, are derived in part from the
    C language.

    - The C language has a number of standard libraries containing tried-and-tested
    functions that can be used in any program.

    - C libraries are contained in header files whose names have a **.h** file extension.

    - C programs are created as plain text files whose names have a **.c** file extension.

    - The popular GNU C Compiler (GCC) is included in the Minimalist GNU for Windows
    (MinGW) package.

    - Adding the compiler’s host directory to the system path conveniently allows
    the compiler to be run from any directory.

    - Programs have one or more functions containing statements to be executed whenever
    the function is called.

    - Every C program must have a **main()** function.

    - A function declaration begins by specifying the data type of the value to be
    returned after the function has been executed.

    - The statements to be executed are contained within { } braces and each statement
    must end with a ; semi-colon terminator.

    - Preprocessor instructions are implemented in the first stage of program compilation
    and will typically substitute library code.

    - The GNU C Compiler is run with the **gcc** command and may include a **-o**
    option to name the executable output file.

    - Temporary files created during the compilation process can be retained using
    the **-save-temps** compiler command option.


