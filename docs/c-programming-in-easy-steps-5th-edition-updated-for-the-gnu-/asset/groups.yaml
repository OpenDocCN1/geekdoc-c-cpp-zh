    for its data type, at a vacant memory address. Subsequently, wherever the program
    finds that variable name, it references the data stored at that memory address.
    Similarly, wherever the program finds the name of a pointer variable, it references
    the address it stores. But a pointer variable can be “dereferenced” to reveal
    the data stored at the address it contains.


    Pointer variables are declared in just the same way that other variables are declared
    but the variable name is prefixed by a “*”. In this case, the * character represents
    the “dereference operator” and merely denotes that the declared variable is a
    pointer. The pointer’s data type must match the data type of the variable to which
    it points.


