    \ creates basic interactivity between the user and the program.\n"
  mdcn: "\n## 创建程序变量\n\n变量是 C 程序中的容器，数据值可以存储在计算机内存中。可以使用变量名引用所存储的值。程序员可以为变量选择任何名称，只要它遵循下表列出的命名约定：\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_28_0.png)\n\n| 命名规则 | 示例 |\n| --- |\
    \ --- |\n| 不能包含任何 C 关键字 | volatile |\n| 不能包含算术运算符 | a+b*c |\n| 不能包含标点字符 | %$#@!\
    \ |\n| 不能包含任何空格 | no spaces |\n| 不能以数字开头 | 2bad |\n| 可以在其他位置包含数字 | good1 |\n|\
    \ 可以包含大小写混合 | UPdown |\n| 可以包含下划线 | is_ok |\n\n为变量选择有意义的名称是良好做法，可使程序代码更易于理解。在程序代码中创建变量需要“声明”它。变量声明具有以下语法：\n\
    \n```\ndata-type variable-name ;\n```\n\n首先，声明指定变量允许包含的数据类型。这将是此处描述的四种数据类型之一。数据类型后跟一个空格，然后是按上表命名约定选择的变量名。与\
    \ C 程序中的所有语句一样，声明必须以分号终止符结尾。可以在单个声明中创建多个相同数据类型的变量，以逗号分隔列表的形式，如下所示：\n\n```\ndata-type\
    \ variable-name-1 , variable-name-2 , variable-name-3 ;\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_29_0.png)\n\
    \n在 C 中变量名区分大小写——因此名为“VAR”、“Var”和“var”的变量将被视为三个独立的变量。\n\n![](img/db19f3858a1e321646bf2590afd29547_29_1.png)\n\
    \nC 关键字列于本书封二的表格中。\n\nC 语言中有四种基本数据类型。这些数据类型使用下表列出的 C 关键字定义，并附有每种数据类型的说明：\n\n|\
    \ 数据类型： | 描述： | 示例： |\n| --- | --- | --- |\n| **char** | 单个字节，仅能存储一个字符 | 'A' |\n\
    | **int** | 一个整数 | 100 |\n| **float** | 精确到六位小数的浮点数 | 0.123456 |\n| **double**\
    \ | 精确到 10 位小数的浮点数 | 0.0123456789 |\n\n这四种数据类型分配不同数量的机器内存来存储数据。最小的是 **char** 数据类型，仅分配一个字节的内存；最大的是\
    \ **double** 数据类型，通常分配八个字节的内存。这是 **float** 数据类型所分配内存量的两倍。\n\n## 显示变量值\n\n可以使用\
    \ printf() 函数显示变量的值，该函数在第 1 章中用于显示“Hello World”消息。必须以 printf() 函数括号中的参数形式，使用合适的“格式说明符”以及变量名，指定显示变量值所需的格式：\n\
    \n| 说明符： | 描述： | 示例： |\n|---|---|---|\n| %d | 从 -32768 到 +32767 的整数 | 100 |\n\
    | %ld | 长整数 -2^31 到 +2^31-1 | 123456789 |\n| %f | 浮点数 | 0.123456 |\n| %c | 单个字符\
    \ | 'A' |\n| %s | 字符串 | \"Hello World\" |\n| %p | 机器内存地址 | 0x0022FF34 |\n\n格式说明符可以确保输出占用特定的最小空格数，方法是在\
    \ % 字符后立即写出所需数字——例如，要确保整数始终至少填满七个空格，可使用说明符 %7d。如果更希望用零填充空白空格，只需在 % 字符和指定数字之间添加一个零——例如，要确保整数始终至少填满七个空格并用零填充空白空格，可使用说明符\
    \ %07d。\n\n精度说明符由一个句点（句号）后跟一个数字组成，可与 %f 格式说明符一起使用，以确定显示多少位小数——例如，要仅显示两位小数，可使用精度说明符\
    \ %.2f。精度说明符也可以与最小空格说明符组合，以同时控制要显示的最小空格数和小数位数——例如，要显示七个空格（包括两位小数）并用零填充空白空格，可使用\
    \ %07.2f。\n\n默认情况下，空白空格位于数字之前，因此数字右对齐；但可以通过在最小空格说明符前加减号，将空白空格添加到数字之后，使其左对齐。\n\n\
    ![](img/db19f3858a1e321646bf2590afd29547_32_0.png)\n\n单个 char 字符值必须用单引号括起来——另一方面，由多个字符组成的字符串必须用双引号括起来。\n\
    \n- 1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_32_1.png)\n\
    \nvars.c\n\n- 2. 添加一个 main 函数，声明并初始化两个变量\n\n```\nint main()\n{\n    int num =\
    \ 100 ;\n    double pi = 3.1415926536 ;\n}\n```\n\n- 3. 在 main 函数中，在变量声明之后插入语句，以各种格式输出变量值\n\
    \n```\nprintf(\"Integer is %d \\n\", num );\nprintf(\"Values are %d and %f \\\
    n\", num, pi );\nprintf(\"%7d displays %7d \\n\", num, num );\nprintf(\"%07d displays\
    \ %07d \\n\", num, num );\nprintf(\"PI is approximately %1.10f \\n\", pi );\n\
    printf(\"Right-aligned %20.3f rounded pi \\n\", pi );\nprintf(\"Left-aligned %-20.3f\
    \ rounded pi \\n\", pi );\n```\n\n- 4. 在 main 函数块末尾插入最后一条语句，按照函数声明的要求返回整数零值\n\n\
    ```\nreturn 0 ;\n```\n\n- 5. 保存程序文件，然后在命令提示符下编译并执行程序，以查看变量值按指定格式输出\n\n![](img/db19f3858a1e321646bf2590afd29547_33_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_33_1.png)\n\n要使用 printf() 函数显示“%”字符，请在其前面再加一个“%”字符，如此处所示。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_33_2.png)\n\n请注意，当格式说明符分配的小数位数较少时，浮点值会被舍入——而不是简单地截断。\n\
    \n## 输入变量值\n\n标准输入/输出库 stdio.h 提供了 scanf() 函数，可用于将用户输入获取到程序中。scanf() 函数需要在其括号内提供两个参数，以指定要输入的数据类型以及输入应存储的位置。\n\
    \nscanf() 函数的第一个参数必须是此处表格中的格式说明符之一，并放在双引号之间——例如，当输入为整数值时使用“%d”。scanf() 函数的第二个参数必须是一个前面带有\
    \ & 字符的变量名，除非输入数据是文本字符串。& 字符在 C 编程中有多种用途，但在这种语境下是“addressof”运算符，表示输入数据应存储在为该变量保留的内存位置。\n\
    \n声明变量时，会在机器内存中保留空间，以存储分配给该变量的数据。保留的字节数取决于变量的数据类型。分配的内存通过唯一的变量名来引用。\n\n将计算机内存想象成一长排槽位。每个槽位都有一个唯一地址，以十六进制格式表示。这就像一条长长的房屋街道——每栋房屋里都有人，并且都有一个唯一的数字地址。在\
    \ C 程序中，房屋就是槽位，人就是那些地址中包含的数据。\n\nscanf() 函数也可以同时为多个变量赋值。此时它的第一个参数必须包含格式说明符列表，每个说明符之间用空格分隔，整个列表必须用双引号括起来。第二个参数必须包含以逗号分隔的变量名列表，每个变量名前面都要加上\
    \ & addressof 运算符，并且每个指定格式分别应用于对应的变量名。\n\n& addressof 运算符还可用于返回存储变量数据的十六进制内存地址。\n\
    \n将 printf() 函数的输出与 scanf() 函数的输入结合起来，可以在用户和程序之间创建基本的交互性。\n\n"
