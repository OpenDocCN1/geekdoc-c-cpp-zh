  md: "\n## 6 Employing Functions\n\n*This chapter demonstrates how statements can\
    \ be enclosed within a “function” for execution whenever called by the C program.*\n\
    \n- Declaring functions\n- Supplying arguments\n- Calling recursively\n- Placing\
    \ functions in headers\n- Restricting accessibility\n- Summary\n\n### Declaring\
    \ functions\n\nPrevious examples in this book have used the obligatory main()\
    \ function and standard functions contained in the C header library, such as the\
    \ printf() function from the stdio.h file. However, most C programs contain a\
    \ number of custom functions, which can be called as required during the execution\
    \ of the program.\n\n![](img/db19f3858a1e321646bf2590afd29547_124_0.png)\n\nA\
    \ function block simply contains a group of statements that get executed whenever\
    \ that function is called. Once the function statements have been executed, program\
    \ flow resumes at the point directly following the function call. This modularity\
    \ is very useful in C programming to isolate set routines so they can be called\
    \ upon repeatedly.\n\nTo introduce a custom function into a C program it must\
    \ first be declared, in a similar manner that variables must be declared before\
    \ they can be used. Function declarations should be added before the main() function\
    \ block.\n\nLike the main() function, custom functions can return a value. The\
    \ data type of this return value must be included in the function declaration.\
    \ If the function is to return no value, its return data type should be declared\
    \ with the void keyword. The function should be named following the same naming\
    \ conventions used for variable names.\n\nThe function declaration is more correctly\
    \ known as the “function prototype” and simply informs the compiler about the\
    \ function. The actual function definition, which includes the statements to be\
    \ executed, appears after the main() function. The custom function can then be\
    \ called upon to execute its statements from within the main() function, as required.\n\
    \nIf a custom function returns a value this can be assigned to a variable of an\
    \ appropriate data type, or simply displayed as output using the appropriate format\
    \ specifier.\n\n1. Begin a new program with a preprocessor instruction to include\
    \ the standard input/output library functions\n\n```\n#include <stdio.h>\n```\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_125_0.png)\n\nfirst.c\n\n2. Declare\
    \ three custom function prototypes\n\n```\nvoid first();\nint square5();\nint\
    \ cube5();\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_125_1.png)\n\nThe\
    \ function prototype is sometimes referred to as the “function header”.\n\n3.\
    \ Add a main function that declares an integer variable\n\n```\nint main()\n{\n\
    \    int num ;\n}\n```\n\n4. After the main function, define the custom functions\n\
    \n```\nvoid first()\n{\n    printf( \"Hello from the first function\\n\" );\n\
    }\n\nint square5()\n{\n    int square = 5 * 5 ;\n    return square ;\n}\n\nint\
    \ cube5()\n{\n```\n\n```\nint cube = (5 * 5) * 5 ;\nreturn cube ;\n}\n```\n\n\
    Now, insert calls to the custom functions in the main function block\n\n```\n\
    first();\nnum = square5();\nprintf(\"5x5= %d\\n\", num );\nprintf(\"5x5x5= %d\\\
    n\", cube5() );\n```\n\nAt the end of the main function block, return a zero integer\
    \ value, as required by that function declaration\n\n```\nreturn 0 ;\n```\n\n\
    Save the program file, then compile and execute the program to see the output\
    \ from custom functions\n\n![](img/db19f3858a1e321646bf2590afd29547_126_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_126_1.png)\n\nNotice that each function\
    \ prototype must end with a semi-colon.\n\n![](img/db19f3858a1e321646bf2590afd29547_126_2.png)\n\
    \nThe custom function definitions could technically appear before the main() function\
    \ – but convention is to include prototypes and keep the main() function at the\
    \ beginning of the program code.\n\n### Supplying arguments\n\nData can be passed\
    \ as “arguments” to custom functions, which can then use that data to execute\
    \ their statements. The function prototype must include the name and data type\
    \ of each argument.\n\nIt is important to recognize that in C programming, the\
    \ data is passed “by value” to the variable specified as the function argument.\
    \ This is different to some other programming languages, such as Pascal, whose\
    \ arguments are passed “by reference” – where the function operates on the original\
    \ value, not just a local copy.\n\nThe arguments in a function prototype are known\
    \ as the “formal parameters” of the function. These may be of different data types,\
    \ and multiple arguments can be specified for a single function if separated by\
    \ a comma. For example, a function prototype with arguments of each of the four\
    \ data types could look like this:\n\n```\nvoid action( char c , int i , float\
    \ f , double d ) ;\n```\n\nThe compiler checks that the formal parameters specified\
    \ in the function prototype match those in the function definition and will report\
    \ an error if they do not match.\n\n1 Begin a new program with a preprocessor\
    \ instruction to include the standard input/output library functions\n\n```\n\
    #include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_127_0.png)\n\
    \n2 Declare three custom function prototypes with one argument to be passed to\
    \ each one when called\n\n```\nvoid display( char str[] ) ;\nint square( int x\
    \ ) ;\nint cube( int y ) ;\n```\n\n3 Add a main function that declares an integer\
    \ variable and a character array variable initialized with a string of text\n\n\
    ```c\nint main()\n{\nint num ;\nchar msg[50] = \"String to be passed to a function\"\
    \ ;\n}\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_128_0.png)\n\nPassing\
    \ data \"by value\" assigns the value to a variable in the called function. The\
    \ function can then manipulate that copy but it does not affect the original data.\n\
    \n4 After the main function, define the custom functions\n\n```c\nvoid display(\
    \ char str[] )\n{\nprintf( \"%s\\n\", str );\n}\n\nint square( int x )\n{\nreturn\
    \ (x * x);\n}\n\nint cube( int y )\n{\nreturn ( y * y ) * y ;\n}\n```\n\n5 Now,\
    \ in the main function, insert statements calling each of the custom functions\
    \ and passing argument values\n\n```c\ndisplay( msg );\nnum = square( 4 );\nprintf(\
    \ \"4x4= %d\\n\", num );\nprintf( \"4x4x4= %d\\n\", cube( 4 ) );\n```\n\n6 At\
    \ the end of the main function block, return a zero integer value, as required\
    \ by the function declaration\n\n```c\nreturn 0;\n```\n\n7 Save the program file,\
    \ then compile and execute the program to see the output from custom functions\
    \ using passed argument values\n\n![](img/db19f3858a1e321646bf2590afd29547_129_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_129_1.png)\n\nThe argument names used\
    \ in the function definition can differ from those used in the function prototype\
    \ but the argument data types, number, and order must be the same. It is clearer\
    \ to adopt the same names in both, though.\n\n![](img/db19f3858a1e321646bf2590afd29547_129_2.png)\n\
    \nA function need not return any value but can still include the **return** keyword\
    \ without any following value to signify the return of control to the caller.\n\
    \n### Calling recursively\n\nStatements within custom functions can freely call\
    \ other custom functions just as readily as they can call standard library functions\
    \ like **printf()**.\n\nAdditionally, functions can call themselves, and these\
    \ are known as “recursive functions”. As with loops it is important that recursive\
    \ functions must modify a tested expression to avoid continuous execution – so\
    \ the function call ends at some point.\n\n1. Begin a new program with a preprocessor\
    \ instruction to include the standard input/output library functions\n\n```\n\
    #include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_130_0.png)\n\
    \n2. Declare a custom function prototype with one argument to be passed when called\n\
    \n```\nvoid count_down_from( int num );\n```\n\n3. Add a main function that declares\
    \ an integer variable\n\n```\nint main()\n{\n    int start;\n}\n```\n\n4. Next,\
    \ in the main function block, add a statement requesting the user input an integer\
    \ value to be assigned to the variable\n\n```\nprintf(\"Enter a positive integer\
    \ to count down from: \");\nscanf(\"%d\", &start);\n```\n\n5. Now, in the main\
    \ function block, add a call to the custom function, passing it the value entered\
    \ by the user\n\n```\ncount_down_from( start );\n```\n\n6. In the main function\
    \ block, add a statement to output a message when\n"
  mdcn: "\n## 6 使用函数\n\n*本章演示如何将语句封装在“函数”中，以便 C 程序在调用时执行。*\n\n- 声明函数\n- 提供参数\n- 递归调用\n\
    - 将函数放在头文件中\n- 限制可访问性\n- 小结\n\n### 声明函数\n\n本书前面的示例使用了必需的 main() 函数以及 C 头文件库中包含的标准函数，例如来自\
    \ stdio.h 文件的 printf() 函数。然而，大多数 C 程序都包含许多自定义函数，这些函数可以在程序执行期间根据需要调用。\n\n![](img/db19f3858a1e321646bf2590afd29547_124_0.png)\n\
    \n函数块仅包含一组语句，每当调用该函数时就会执行这些语句。函数语句执行完毕后，程序流会从紧接函数调用之后的位置继续。这种模块化在 C 编程中非常有用，可以隔离固定例程，以便反复调用它们。\n\
    \n要在 C 程序中引入自定义函数，必须先声明它，这与变量在使用前必须声明的方式类似。函数声明应添加到 main() 函数块之前。\n\n与 main()\
    \ 函数一样，自定义函数可以返回值。此返回值的数据类型必须包含在函数声明中。如果函数不返回值，则其返回数据类型应使用 void 关键字声明。函数命名应遵循与变量名相同的命名约定。\n\
    \n函数声明更准确的叫法是“函数原型”，它只是向编译器告知该函数。实际的函数定义（包括要执行的语句）出现在 main() 函数之后。然后，可以根据需要从 main()\
    \ 函数内部调用该自定义函数来执行其语句。\n\n如果自定义函数返回一个值，则可以将其赋给适当数据类型的变量，或者使用适当的格式说明符将其作为输出显示。\n\
    \n1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_125_0.png)\n\
    \nfirst.c\n\n2. 声明三个自定义函数原型\n\n```\nvoid first();\nint square5();\nint cube5();\n\
    ```\n\n![](img/db19f3858a1e321646bf2590afd29547_125_1.png)\n\n函数原型有时称为“函数头”。\n\
    \n3. 添加一个声明整型变量的 main 函数\n\n```\nint main()\n{\n    int num ;\n}\n```\n\n4. 在\
    \ main 函数之后，定义这些自定义函数\n\n```\nvoid first()\n{\n    printf( \"Hello from the first\
    \ function\\n\" );\n}\n\nint square5()\n{\n    int square = 5 * 5 ;\n    return\
    \ square ;\n}\n\nint cube5()\n{\n```\n\n```\nint cube = (5 * 5) * 5 ;\nreturn\
    \ cube ;\n}\n```\n\n现在，在 main 函数块中插入对这些自定义函数的调用\n\n```\nfirst();\nnum = square5();\n\
    printf(\"5x5= %d\\n\", num );\nprintf(\"5x5x5= %d\\n\", cube5() );\n```\n\n在 main\
    \ 函数块末尾，按照该函数声明的要求返回零整数值\n\n```\nreturn 0 ;\n```\n\n保存程序文件，然后编译并执行程序，以查看自定义函数的输出\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_126_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_126_1.png)\n\
    \n注意，每个函数原型都必须以分号结尾。\n\n![](img/db19f3858a1e321646bf2590afd29547_126_2.png)\n\n\
    从技术上讲，自定义函数定义可以出现在 main() 函数之前——但惯例是包含原型，并将 main() 函数保留在程序代码的开头。\n\n### 提供参数\n\
    \n数据可以作为“参数”传递给自定义函数，然后函数可以使用该数据执行其语句。函数原型必须包含每个参数的名称和数据类型。\n\n重要的是要认识到，在 C 编程中，数据是“按值”传递给指定为函数参数的变量。这与\
    \ Pascal 等一些其他编程语言不同，后者的参数是“按引用”传递的——函数操作的是原始值，而不仅仅是局部副本。\n\n函数原型中的参数称为函数的“形式参数”。这些参数可以具有不同的数据类型，如果以逗号分隔，则可以为单个函数指定多个参数。例如，一个包含四种数据类型各一个参数的函数原型可能如下所示：\n\
    \n```\nvoid action( char c , int i , float f , double d ) ;\n```\n\n编译器会检查函数原型中指定的形式参数是否与函数定义中的形式参数匹配，如果不匹配，则报告错误。\n\
    \n1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_127_0.png)\n\
    \n2. 声明三个自定义函数原型，每个原型都有一个在调用时传递给它的参数\n\n```\nvoid display( char str[] ) ;\nint\
    \ square( int x ) ;\nint cube( int y ) ;\n```\n\n3. 添加一个 main 函数，声明一个整型变量和一个用文本字符串初始化的字符数组变量\n\
    \n```c\nint main()\n{\nint num ;\nchar msg[50] = \"String to be passed to a function\"\
    \ ;\n}\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_128_0.png)\n\n“按值”传递数据会将值赋给被调用函数中的变量。然后函数可以操作该副本，但不会影响原始数据。\n\
    \n4. 在 main 函数之后，定义这些自定义函数\n\n```c\nvoid display( char str[] )\n{\nprintf( \"\
    %s\\n\", str );\n}\n\nint square( int x )\n{\nreturn (x * x);\n}\n\nint cube(\
    \ int y )\n{\nreturn ( y * y ) * y ;\n}\n```\n\n5. 现在，在 main 函数中，插入调用每个自定义函数并传递参数值的语句\n\
    \n```c\ndisplay( msg );\nnum = square( 4 );\nprintf( \"4x4= %d\\n\", num );\n\
    printf( \"4x4x4= %d\\n\", cube( 4 ) );\n```\n\n6. 在 main 函数块末尾，按照函数声明的要求返回零整数值\n\
    \n```c\nreturn 0;\n```\n\n7. 保存程序文件，然后编译并执行程序，以查看使用所传递参数值的自定义函数的输出\n\n![](img/db19f3858a1e321646bf2590afd29547_129_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_129_1.png)\n\n函数定义中使用的参数名可以与函数原型中使用的参数名不同，但参数的数据类型、数量和顺序必须相同。不过，在两者中采用相同的名称会更清晰。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_129_2.png)\n\n函数不必返回任何值，但仍然可以包含 **return**\
    \ 关键字，且后面不跟任何值，以表示将控制权返回给调用者。\n\n### 递归调用\n\n自定义函数中的语句可以自由调用其他自定义函数，就像它们可以调用 **printf()**\
    \ 等标准库函数一样。\n\n此外，函数可以调用自身，这些函数称为“递归函数”。与循环一样，重要的是递归函数必须修改受测试的表达式以避免连续执行——以便函数调用在某个时刻结束。\n\
    \n1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n```\n#include <stdio.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_130_0.png)\n\
    \n2. 声明一个自定义函数原型，其中有一个在调用时传递的参数\n\n```\nvoid count_down_from( int num );\n```\n\
    \n3. 添加一个声明整型变量的 main 函数\n\n```\nint main()\n{\n    int start;\n}\n```\n\n4. 接下来，在\
    \ main 函数块中，添加一条语句，请求用户输入一个要赋给该变量的整数值\n\n```\nprintf(\"Enter a positive integer\
    \ to count down from: \");\nscanf(\"%d\", &start);\n```\n\n5. 现在，在 main 函数块中，添加对自定义函数的调用，并将用户输入的值传递给它\n\
    \n```\ncount_down_from( start );\n```\n\n6. 在 main 函数块中，添加一条语句，在……时输出一条消息\n"
