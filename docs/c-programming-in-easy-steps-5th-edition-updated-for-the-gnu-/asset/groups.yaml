    \ strftime() 函数及特殊时间格式说明符输出各个组件。此函数需要四个参数，分别用于指定：存储格式化日期字符串的 char 数组、最大字符串长度、用于提取所需组件的文本和格式说明符，以及要使用的\
    \ tm 结构体。\n\n![](img/db19f3858a1e321646bf2590afd29547_222_0.png)\n\n夏令时组件 tm_isdst\
    \ 在夏令时生效时为正数；未生效时为零；如果该信息不可用则为负数。\n\n![](img/db19f3858a1e321646bf2590afd29547_222_1.png)\n\
    \n所有时间格式说明符的完整列表见此处的“参考”部分。\n\n- 1. 开始一个新程序，使用预处理指令包含标准输入/输出库函数以及日期和时间函数\n\n```\n\
    #include <stdio.h>\n#include <time.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_222_2.png)\n\
    \ndatetime.c\n\n- 2. 添加一个 main 函数，声明一个字符数组变量、一个 time_t 变量和一个 tm 结构体\n\n```\nint\
    \ main()\n{\n    char buffer[100];\n    time_t elapsed;\n    struct tm *now;\n\
    }\n```\n\n接下来，在 main 函数块中，获取自 Epoch 以来当前经过的秒数\n\n```\nelapsed = time(NULL);\n\
    ```\n\n现在，将该计数转换为本地时间组件\n\n```\nnow = localtime( &elapsed );\n```\n\n以标准格式输出日期和时间\n\
    \n```\nprintf( \"%s\\n\", asctime( now ) );\n```\n\n然后，输出各个日期和时间组件\n\n```\nstrftime(\
    \ buffer, 100, \"Today is %A, %B %d.\\n\", now );\nprintf( \"%s\", buffer );\n\
    strftime( buffer, 100, \"The time is %I:%M %p.\\n\", now );\nprintf( \"%s\", buffer\
    \ );\n```\n\n最后，返回所需的零整数，然后保存程序文件；编译并执行程序以查看当前日期和时间信息\n\n```\nreturn 0;\n```\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_223_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_223_1.png)\n\
    \n注意，在转换为本地时间时使用了 & 取地址运算符，以便从 time_t 数据类型获取日历时间。\n\n## 运行计时器\n\n在事件发生前后分别获取当前时间，意味着可以通过它们的差值计算事件的持续时间。**time.h**\
    \ 头文件包含一个用于该特定目的的 **difftime()** 函数。此函数需要两个参数，这两个参数均为 **time_t** 数据类型。它从第一个参数中减去第二个参数，并返回以整秒表示的差值，但作为\
    \ **double** 数据类型返回。\n\n**time.h** 头文件中的 **clock()** 函数提供了另一种处理时间的方式。它返回自程序开始以来使用的处理器时间，以时钟“滴答”数表示。通过运行空循环直到到达未来的某个时间点，此函数可用于“暂停”程序的执行。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_224_0.png)\n\nwait.c\n\n- 1. 开始一个新程序，使用预处理指令包含标准输入/输出库函数以及日期和时间函数\n\
    ```c\n#include <stdio.h>\n#include <time.h>\n```\n- 2. 接下来，声明一个用于暂停程序的函数原型\n```c\n\
    void wait( int seconds );\n```\n- 3. 添加一个 main 函数，声明两个 time_t 变量和一个整数变量\n```c\n\
    int main()\n{\n    time_t go , stop ;\n    int i ;\n}\n```\n- 4. 接下来，在 main 函数块中，获取当前时间并输出一条消息\n\
    ```c\ngo = time( NULL );\n```\n\n```\nprintf ( \"\\nStarting countdown...\\n\\\
    n\" );\n```\n\n添加一个循环，输出倒计数值，并在每次迭代时调用另一个函数\n\n```\nfor( i = 10 ; i > -1 ; i--\
    \ )\n{\n    printf ( \" - %d\", i );\n    wait(1);\n}\n```\n\n接下来，在 main 函数块中，再次获取当前时间，然后输出运行该循环所花费的时间\n\
    \n```\nstop = time( NULL );\nprintf(\"\\nRuntime: %.0f seconds\\n\" , difftime(\
    \ stop, go ) );\n```\n\n最后，在 main 函数块中，按函数声明的要求返回零整数值\n\n```\nreturn 0 ;\n```\n\
    \n在 main 函数块之后，通过将 clock_t 变量初始化为超出当前已运行时间的未来时间点，开始函数定义\n\n```\nvoid wait( int\
    \ seconds )\n{\n    clock_t end_wait =\n        ( clock() + ( seconds * CLOCKS_PER_SEC\
    \ ));\n}\n```\n\n最后，在 wait 函数块中，添加一个空循环，当当前时间达到未来时间点时终止，并将控制权返回给 main 函数中的循环\n\
    \n```\nwhile ( clock() < end_wait ) { }\n```\n\n保存程序文件，然后编译并执行程序以查看倒计时计时器和运行时间\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_225_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_226_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_226_1.png)\n\n每秒的时钟滴答数取决于实现，但在 time.h\
    \ 中由 CLOCKS_PER_SEC 常量定义。\n\n![](img/db19f3858a1e321646bf2590afd29547_226_2.png)\n\
    \n通过将 clock() 函数返回的值除以 CLOCKS_PER_SEC 值，可以得到以秒表示的已运行时间。\n\n## 生成随机数\n\n`stdlib.h`\
    \ 头文件提供了一个 `rand()` 函数，调用时会生成一个伪随机正整数。默认情况下，它将返回一个范围从 0 到一个较大值（至少 32,767）的数。可以通过使用取模运算符指定最大上限来设置特定范围——例如，使用表达式\
    \ `rand() % 9` 指定从 0 到 9 的范围。\n\n要为该范围设置最小下限，可以将该值加到表达式的结果中——例如，使用表达式 `( rand()\
    \ % 9 ) + 1` 指定从 1 到 10 的范围。\n\n`rand()` 函数生成的数字并非真正随机，因为每次执行使用 `rand()` 的程序时，该函数都会连续生成相同的数字序列。为了生成不同的数字序列，必须指定启动该序列的“种子”。默认情况下，初始种子值为\
    \ 1，但可以通过向 `srand()` 函数指定另一个整数参数来更改——例如，`srand(8)`。这将使 `rand()` 生成与使用默认种子值所生成序列不同的数字序列，但每次执行使用\
    \ `rand()` 的程序时，该序列仍会重复。\n\n要在连续执行时生成不同的随机序列，指定给 `srand()` 的参数必须不是静态整数。常见的解决方案是使用以秒为单位的当前经过时间通过\
    \ `srand( time( NULL ) )` 为 `rand()` 函数设置种子。\n\n现在，每次执行使用 `rand()` 的程序时，`rand()`\
    \ 生成的数字序列都会不同。\n\n- 1. 开始一个新程序，使用预处理指令包含标准输入/输出库函数、随机数、时间和字符串函数\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n#include <string.h>\n```\n\
    \n"
