    \n![](img/db19f3858a1e321646bf2590afd29547_216_1.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_217_0.png)\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_217_1.png)\n\n请注意，此示例中使用 feof() 函数测试是否已到达文件末尾——到达时退出循环。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_217_2.png)\n\nfscanf() 和 fprintf()\
    \ 函数接受与 scanf() 和 printf() 相同的参数，外加一个额外的第一个流参数。\n\n## 报告错误\n\nC 语言在 stdio.h 头文件中提供了一个名为\
    \ perror() 的函数，可用于打印描述性错误消息。它需要一个字符串作为唯一参数，perror() 会向其添加一个冒号，后跟当前错误的描述。\n\n此外，errno.h\
    \ 头文件定义了一个名为“errno”的整数表达式，当发生错误时，会为其分配一个错误代码编号。此错误代码编号可以指定为 string.h 头文件中 strerror()\
    \ 函数的参数，以输出其关联的错误消息。\n\n1. 开始一个新程序，使用预处理指令包含标准输入/输出函数、错误消息处理和字符串函数\n\n```\n#include\
