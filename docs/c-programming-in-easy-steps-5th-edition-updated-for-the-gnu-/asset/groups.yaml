    \ flags = 8 ; /* Binary 1000 (1×8 0×4 0×2 0×1) */\n}\n```\n\n- 3. Next, in the\
    \ main function block, assign a new value to the variable, to also turn on another\
    \ flag\n\n```c\nflags = flags | 2 ; /* 1000 | 0010 = 1010 (decimal 10) */\n```\n\
    \n- 4. Now, insert statements to output all the bit flag settings\n\n```c\nprintf(\"\
    Flag 1: %s\\n\", (flags & 1) > 0 ? \"ON\" : \"OFF\");\nprintf(\"Flag 2: %s\\n\"\
