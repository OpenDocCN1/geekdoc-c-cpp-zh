    \n![](img/db19f3858a1e321646bf2590afd29547_101_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_101_1.png)\n\
    \n为了输出 % 字符，printf() 语句需要 %%。\n\n### 摘要\n\n- 算术运算符可以用两个操作数形成表达式，用于加法 +、减法 -、乘法\
    \ *、除法 / 和取模 %。\n- 自增 ++ 和自减 -- 运算符将单个操作数修改一个值。\n- 赋值 = 运算符可以与算术运算符结合使用以执行算术计算然后分配其结果。\n\
    - 比较运算符可以形成表达式比较两个操作数的相等 ==、不相等 !=、大于 >、小于 <、大于或等于 >= 和小于或等于 <= 值。\n- 逻辑与 && 和或\
    \ || 运算符形成表达式评估两个操作数以返回布尔值 true 或 false，但逻辑非 ! 运算符返回单个操作数的反向布尔值。\n- 条件 ?: 运算符评估给定的布尔表达式然后根据其结果返回两个操作数之一。\n\
    - sizeof 运算符返回数据类型或数据对象的内存字节大小。\n- 单个内存字节包含八位，每位可以包含值一 (1) 或零 (0)。\n- 按位运算符或 |、与\
    \ &、非 ~ 和异或 ^ 在比较两个位内的值后各返回一个值，而左移 << 和右移 >> 运算符将位值在其方向上移动指定数量的位。\n- 按位运算符最常见的用途是操作包含一组布尔标志的紧凑位域。\n\
    - 包含多个运算符的表达式将根据默认优先级规则执行其操作，除非通过添加括号显式确定。\n\n## 5 制作语句\n\n本章演示语句如何评估表达式以确定 C\
    \ 程序应进行的方向。\n\n- 测试表达式\n- 分支开关\n- 循环指定次数\n- 循环直到为真\n- 跳出循环\n- 跳转到标签\n- 摘要\n\n\
    ### 测试表达式\n\nif 关键字用于执行基本条件测试，评估给定表达式的布尔值 true 或 false。评估后大括号内的语句只有在表达式被发现为真时才会被执行。因此，if\
    \ 测试语句的语法如下所示：\n\n```\nif ( test-expression ) {statements-to-execute-when-true\
    \ }\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_104_0.png)\n\n当测试为真时可能有多个语句需要执行，但每个语句必须以分号终止。\n\
    \n有时可能希望评估多个表达式以确定是否应执行以下语句，这可以通过两种方式实现。逻辑 && AND 运算符可用于确保只有当两个表达式都被发现为真时语句才会被执行，语法如下：\n\
    \n```\nif ( ( test-expression ) && ( test-expression ) ) { statements-to-execute\
    \ }\n```\n\n或者，多个 if 语句可以“嵌套”，一个在另一个内部，以确保只有当两个评估的表达式都被发现为真时，以下语句才会被执行，如下所示：\n\
    \n```\nif ( test-expression )\n{\nif ( test-expression ) { statements-to-execute\
    \ }\n}\n```\n\n当 if 测试语句评估的一个或多个表达式被发现为假时，其后大括号内的语句不会被执行，程序继续执行后续代码。\n\n通常最好通过附加\
