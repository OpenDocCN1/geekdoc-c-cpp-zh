    \n![](img/db19f3858a1e321646bf2590afd29547_89_0.png)\n\n![](img/db19f3858a1e321646bf2590afd29547_89_1.png)\n\
    \nThe conditional operator is best used for terse statements that offer just two\
    \ simple alternatives to implement.\n\n## Measuring size\n\nIn C programming,\
    \ the sizeof operator returns an integer value, which is the number of bytes needed\
    \ to store the content of its operand in memory.\n\n![](img/db19f3858a1e321646bf2590afd29547_90_0.png)\n\
    \nWhere the operand supplied to the sizeof operator is a data type name, such\
    \ as int, the operand must be enclosed within parentheses – as with the examples\
    \ listed earlier here.\n\nAlternatively, where the supplied operand is a data\
    \ object name, such as a variable name, the parentheses may optionally be omitted.\
    \ In practice, many programmers will always enclose the sizeof operator’s operand\
    \ within parentheses to avoid having to remember this distinction.\n\nThe basic\
    \ storage unit in C is defined by the char data type that stores a single character\
    \ in a single byte of memory. This means that sizeof(char) will return 1 (1 byte).\n\
    \nTypically, the int and float data types will each allocate 4 bytes of machine\
    \ memory, whereas the double data type will typically allocate 8 bytes of machine\
    \ memory to accommodate its range of possible values. These sizes are not defined\
    \ by the standards, however, but are implementation-defined so may vary. It is\
    \ therefore good practice to use the sizeof operator to measure the actual memory\
    \ allocation rather than assume these typical sizes will be allocated.\n\nThe\
    \ memory space allocated for array variables will simply be the number of bytes\
    \ allocated for that data type multiplied by the number of elements in that array.\
    \ So, for example, the expression sizeof(int[3]) will typically return 12 (3 x\
    \ 4)\n"
  mdcn: "\n## 评估逻辑\n\nC 编程中最常用的逻辑运算符列于下表：\n\n![](img/db19f3858a1e321646bf2590afd29547_84_0.png)\n\
    \n| 运算符： | 操作： |\n|---|---|\n| && | 逻辑与 |\n| || | 逻辑或 |\n| ! | 逻辑非 |\n\n逻辑运算符用于具有真或假布尔值的操作数，或用于可转换为真或假的表达式。\n\
    \n逻辑 && 与运算符会计算两个操作数，并且仅当两个操作数本身都为真时才返回真。否则，&& 与运算符将返回假。\n\n这用于条件分支，其中 C 程序的方向通过测试两个条件来确定。如果两个条件都满足，程序将朝某个方向执行；否则将采取不同的方向。\n\
    \n与需要两个操作数都为真的 && 与运算符不同，|| 或运算符会计算两个操作数，并在其中一个操作数本身为真时返回真。如果两个操作数都不为真，则 || 或运算符将返回假。这在\
    \ C 编程中很有用，可在两个测试条件中任一条件满足时执行特定操作。\n\n第三个逻辑 ! 非运算符是一个“一元”运算符——它用于单个操作数之前。它返回给定操作数的相反值，因此如果变量\
    \ var 为真值，则 !var 将返回假值。! 非运算符在 C 编程中很有用，可通过类似 var = !var 的语句在连续的循环迭代中切换变量的值。这确保每次遍历时该值都被反转，就像来回拨动电灯开关一样。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_85_0.png)\n\n术语“布尔”指的是由英国数学家乔治·布尔（1815-1864）发展的一种逻辑思想体系。\n\
    \n在 C 编程中，零表示布尔假值；而任何非零值（例如 1）表示布尔真值。\n\n- 1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\n\
