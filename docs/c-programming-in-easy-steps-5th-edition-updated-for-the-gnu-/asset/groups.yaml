    \nenum 类型名（在本例中为 **SNOOKER**）是可选的——因此在本例中可以省略。\n\n## 创建常量类型\n\n一旦枚举序列被声明，它就可以被视为一种新的数据类型，具有其指定的常量名及其相关值的属性。\n\
    \n这种 enum 数据类型的变量可以像声明其他数据类型的变量一样声明——使用以下语法：\n\n```\ndata-type variable-name ;\n\
    ```\n\n这里的示例创建了一个名为 SNOOKER 的枚举序列，可视为 enum SNOOKER 的数据类型。因此，可以使用声明 enum SNOOKER\
    \ pair ; 创建该数据类型的名为“pair”的变量，并可存储该类型定义的枚举集合的值。\n\n要显式地将整数值分配给枚举数据类型的变量，C 标准建议使用强制转换将\
    \ int 数据类型转换为 enum 数据类型，如下所示：\n\n```\npair = ( enum SNOOKER ) 7 ;\n```\n\n然而在实践中这并非必需，因为枚举值始终是整数，因此等同于\
    \ int 数据类型。\n\nenum 声明可选择在最后的花括号后指定变量名来同时创建变量。例如，声明 enum BOOLEAN { FALSE , TRUE\
    \ } flag ; 定义了一个 enum 数据类型并创建了该类型的名为“flag”的变量。\n\n可以使用 typedef 关键字和以下语法定义自定义数据类型：\n\
