    \ in millimeters: \");\n  scanf(\"%f\", &diameter );\n  ```\n\n- 5. 接下来，添加使用常量值和用户输入计算其他三个变量值的语句\n\
    \n  ```\n  circ = PI * diameter ;\n  radius = diameter / 2 ;\n  area = PI * (\
