    \ unsigned short int 变量，使用以下声明先创建具有这些修饰符的自定义数据类型会很有用：\n\n```\ntypedef unsigned\
    \ short int USINT ;\n```\n\n然后每个 unsigned short int 变量声明只需使用自定义数据类型名 USINT 代替\
    \ unsigned short int。\n\n![](img/db19f3858a1e321646bf2590afd29547_65_0.png)\n\n\
    虽然不是必需的，但使用推荐的强制转换显式地为枚举类型变量赋值可作为其类型的提醒。\n\nconstype.c\n\n- 1. 使用预处理指令开始一个新程序以包含标准输入/输出库函数\n\
