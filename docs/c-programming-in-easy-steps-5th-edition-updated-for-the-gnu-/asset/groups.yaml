    \ 字节的 int 数据类型有 32 位。\n\n### 理解运算符优先级\n\n运算符优先级定义了 C 评估表达式的顺序。例如，在表达式 a=6+b*3\
    \ 中，优先级的顺序决定了加法还是乘法先完成。\n\n下表按递减顺序列出运算符优先级，其中上方的运算符优先于下方的运算符，因此其操作先完成。同一行的运算符优先级相等，但完成顺序由结合性方向决定。例如，对于“从左到右”结合性，左侧的操作先完成。\n\
