    # Reading & writing entire files


    Whole files can be read with the fread() function and written with the fwrite()
    function. Both these functions take the same four arguments. The first is a char
    variable where the text can be stored. The second argument specifies the size
    of the chunks of text to read or write at a time – normally this will be 1. The
    third argument specifies the total number of characters to read or write, and
    the fourth argument is a file pointer to the file to work with.


    The fread() function returns the number of objects it has read, counting characters,
    spaces, and newlines as one object each. Similarly, fwrite() returns the number
    of objects it has written.


