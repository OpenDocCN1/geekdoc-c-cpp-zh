    ## Argument functions


    <stdarg.h>

    The stdarg.h header file contains functions that can be used to step through a
    list of function arguments without first knowing their number and type. Due to
    the nature of these functions they must be implemented as “macros” within the
    function body.


    The list of arguments is assigned to a special data type named va_list. The functions
    listed in the following table manipulate a variable named “args” of the va_list
    type:


    | Function | Description |

    |---|---|

    | va_start( va_list args , lastarg) | Must be called once to initialize the va_list
    named args at the position in the list of the last known argument lastarg |

    | va_arg( va_list args , data-type ) | After va_list args has been initialized
    by va_start() each successive call to va_arg() will return the value of the next
    argument in the args list as the specified data-type |

    | va_end( va_list args ) | Must be called once after the arguments in the va_list
    args have been processed, before the function is exited |


    ## Date & time functions


    <time.h>


    The time.h header file contains functions for manipulating date and time. Some
    of these functions process “Calendar time”, which is based on the Gregorian calendar.
    This is stated in seconds elapsed since the Epoch (00:00:00 GMT January 1st, 1970).


    Other functions contained in time.h process “Local time”, which is the translation
    of Calendar time accounting for time zone.


    The data type time_t is used to describe both Calendar time and Local time.


    A struct named tm contains the components of Calendar time, which are listed in
    the table below:


    | Component: | Description: |

    |---|---|

    | int tm_sec | seconds after the minute, 0-61 |

    | int tm_min | minutes after the hour, 0-59 |

    | int tm_hour | hours since midnight, 0-23 |

    | int tm_mday | day of the month, 1-31 |

    | int tm_mon | months since January, 0-11 |

    | int tm_year | years since 1900 |

    | int tm_wday | days since Sunday, 0-6 |

    | int tm_yday | days since January 1st, 0-365 |

    | int tm_isdst | Daylight Saving Time flag |


    The tm_isdst component is positive if Daylight Saving is in effect, zero if it
    is not, or negative if the information is unavailable.


    The functions contained in the time.h header file are listed in the table here.


    The time.h header file contains the functions listed below that can be used to
    manipulate date and time:


    | Function | Description |

    |---|---|

    | clock_t clock( void ) | Returns the processor time used by the program since
    it started, or -1 if unavailable |

    | time_t time( time_t *tp ) | Returns the current calendar time, or -1 if unavailable
    |

    | double difftime( time_t time2 , time_t time1 ) | Returns time2 minus time1,
    expressed in seconds |

    | time_t mktime( struct tm *tp ) | Converts the local time in the structure *tp
    into calendar time |

    | char *asctime( const struct tm *tp ) | Converts the time in the struct *tp into
    a standard string |

    | char *ctime( const time_t *tp ) | Converts calendar time to local time |

    | struct tm *gmtime( const time_t *tp ) | Converts calendar time into Co-ordinated
    Universal Time (UTC or GMT) |

    | struct tm *localtime( const time_t *tp ) | Converts the calendar time *tp into
    local time |

    | size_t strftime( char *s , size_t smax , const char *fmt , const struct tm *tp
    ) | Formats the time *tp into a chosen format *fmt |


    The strftime() function formats selected components of the tm structure according
    to the stated format specifier. All the possible format specifiers are listed
    in the table below.


    | Specifier: | Description: |

    |---|---|

    | %a | abbreviated weekday name |

    | %A | full weekday name |

    | %b | abbreviated month name |

    | %B | full month name |

    | %c | local date and time representation |

    | %d | day of the month, 01-31 |

    | %H | hour (24-hour clock), 00-23 |

