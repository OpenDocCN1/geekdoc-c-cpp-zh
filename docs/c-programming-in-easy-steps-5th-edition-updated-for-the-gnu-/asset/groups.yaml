    # # Measuring size


    In C programming, the sizeof operator returns an integer value, which is the number
    of bytes needed to store the content of its operand in memory.


    ![](img/db19f3858a1e321646bf2590afd29547_90_0.png)


    Where the operand supplied to the sizeof operator is a data type name, such as
    int, the operand must be enclosed within parentheses – as with the examples listed
    earlier here.


    Alternatively, where the supplied operand is a data object name, such as a variable
    name, the parentheses may optionally be omitted. In practice, many programmers
    will always enclose the sizeof operator’s operand within parentheses to avoid
    having to remember this distinction.


    The basic storage unit in C is defined by the char data type that stores a single
    character in a single byte of memory. This means that sizeof(char) will return
    1 (1 byte).


    Typically, the int and float data types will each allocate 4 bytes of machine
    memory, whereas the double data type will typically allocate 8 bytes of machine
    memory to accommodate its range of possible values. These sizes are not defined
    by the standards, however, but are implementation-defined so may vary. It is therefore
    good practice to use the sizeof operator to measure the actual memory allocation
    rather than assume these typical sizes will be allocated.


    The memory space allocated for array variables will simply be the number of bytes
    allocated for that data type multiplied by the number of elements in that array.
    So, for example, the expression sizeof(int[3]) will typically return 12 (3 x 4)'
