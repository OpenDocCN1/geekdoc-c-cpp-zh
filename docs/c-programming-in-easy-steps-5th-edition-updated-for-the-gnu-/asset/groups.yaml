    \ 程序\n- 编译 C 程序\n- 理解编译\n- 摘要\n\n### 介绍 C 语言\n\nC 是一种紧凑的通用计算机编程语言，最初由 Dennis MacAlistair\
    \ Ritchie 为 Unix 操作系统开发。它首次在 1972 年的 Digital Equipment Corporation PDP-11 计算机上实现。\n\
    \n![](img/db19f3858a1e321646bf2590afd29547_9_0.png)\n\nDennis M. Ritchie，C 编程语言的创造者。\n\
    \n这种新编程语言被命名为“C”，因为它继任了大约在 1970 年引入的名为“B”的早期编程语言。\n\nUnix 操作系统和几乎所有 Unix 应用程序都是用\
    \ C 语言编写的。然而，C 不限于特定平台，可以在任何支持 C 的机器上创建程序，包括运行 Windows 平台的机器。\n\nC 的灵活性和可移植性使其非常流行，该语言于\
    \ 1989 年由美国国家标准学会（ANSI）正式标准化。ANSI 标准明确定义了 C 的各个方面，从而消除了之前对语言精确语法的任何不确定性。\n\nANSI\
    \ C 已成为 C 语言公认的标准，并在本书中通过示例进行了描述和演示。\n\nC 语言已经存在相当长一段时间，并见证了 Java、C++ 和 C# 等更新编程语言的引入。其中许多新语言至少部分源自\
