    Beginning at %p\\n\", mem );\n}\nelse { printf(\"!!! Insufficient memory\\n\"\
    ); return 1; }\n```\n\n### Now, attempt to enlarge the allocated memory block\
    \ and output its details or an advisory message if the request fails\n\n```c\n\
    if (mem = realloc( mem , size + (100 * sizeof(int) )))\n{\n\t// output details\
