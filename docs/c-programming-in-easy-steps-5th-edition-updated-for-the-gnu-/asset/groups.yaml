    Circumference is %.2f mm\", circ );\n  printf(\"And the area is %.2f sq.mm\\n\"\
    , area );\n  ```\n\n- 7. 在 main 函数块末尾，返回零整数值，如函数声明所要求\n\n  ```\n  return 0 ;\n\
    \  ```\n\n- 8. 保存程序文件，然后编译并执行程序，在需要时输入数据以查看计算输出\n\n```\nC:\\MyPrograms>gcc constant.c\
    \ -o constant.exe\nC:\\MyPrograms>constant\nEnter the diameter of a circle in\
    \ millimeters: \n```\n\n```\nC:\\MyPrograms>constant\nEnter the diameter of a\
    \ circle in millimeters: 140\nCircumference is 439.82 mm\nAnd the area is 15393.81\
    \ sq.mm\nC:\\MyPrograms>\n```\n\n这里星号字符是算术乘法运算符，正斜杠字符是除法运算符。算术运算符将在下一章中完整演示。\n\
    \n请记住，在 scanf() 中必须在变量名前加上 & 取地址运算符，以便将输入分配给变量。\n\n## 枚举常量值\n\nenum 关键字提供了一种简洁的方式来创建整数常量的序列。可选地，声明可以在\
    \ enum 关键字后包含序列的名称。常量名作为逗号分隔的列表跟在花括号内。\n\n默认情况下，每个常量的值都比列表中在其前面的常量大一。若未指定，第一个常量的值为零；下一个值为\
    \ 1；依此类推。\n\n例如，可以使用 `enum{MON,TUE,WED,THU,FRI};` 给命名的工作日常量一个从零开始的整数值序列——在这种情况下，常量\
