  md: '# Debugging definitions


    Alternatives can be offered with #if, #else and #elif (else if ) preprocessor
    directives. These allow conditional branching to execute sections of code according
    to the result of an evaluation.


    ![](img/db19f3858a1e321646bf2590afd29547_70_0.png)


    A constant initially defined by a preprocessor #define directive can be subsequently
    undefined with an #undef directive. An evaluation may also be made to consider
    whether a constant is undefined with an #ifndef (if not defined) preprocessor
    directive.


    All evaluations can be made in a function block, mixed with regular C statements,
    and may be nested one within another. Macros of this kind are particularly useful
    for debugging source code, as whole sections of the code can be easily hidden
    or revealed, simply by changing the status of a DEBUG macro.


    ![](img/db19f3858a1e321646bf2590afd29547_70_1.png)


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions

    +      `#include <stdio.h>`

    +   2. Add a further preprocessor directive to establish a macro

    +      `#define DEBUG 1`

    +   3. Next, add a main function containing preprocessor directives to evaluate'
  merge: -1
