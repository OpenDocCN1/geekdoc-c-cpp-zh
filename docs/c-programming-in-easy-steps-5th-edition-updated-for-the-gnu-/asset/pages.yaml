- pgno: 224
  md: '# Running a timer


    Getting the current time both before and after an event means that the duration
    of the event can be calculated by their difference. The **time.h** header file
    contains a **difftime()** function for that particular purpose. This function
    requires two arguments, both of which are of the **time_t** data type. It subtracts
    the second argument from the first argument and returns the difference expressed
    in whole seconds, but as a **double** data type.


    Another way to work with time is offered by the **clock()** function from the
    **time.h** header file. This returns the processor time used since the program
    began, expressed in clock “ticks”. This function can be used to “pause” the execution
    of a program by running an empty loop until a future point in time is reached.


    ![](img/db19f3858a1e321646bf2590afd29547_224_0.png)


    wait.c


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions and the date and time functions

    +   ```c

    +   #include <stdio.h>

    +   #include <time.h>

    +   ```

    +   2. Next, declare a function prototype to pause the program

    +   ```c

    +   void wait( int seconds );

    +   ```

    +   3. Add a main function that declares two time_t variables, and an integer
    variable

    +   ```c

    +   int main()

    +   {

    +       time_t go , stop ;

    +       int i ;

    +   }

    +   ```

    +   4. Next, in the main function block, get the current time and output a message

    +   ```c

    +   go = time( NULL );

    +   ```'
  merge: -1
  img_proc: true
