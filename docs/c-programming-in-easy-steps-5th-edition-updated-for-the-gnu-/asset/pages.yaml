  md: "# Doing pointer arithmetic\n\nOnce a pointer has been created with an assigned\
    \ memory address it can be reassigned another address, or moved using arithmetic.\n\
    \nThe ++ increment operator and the -- decrement operator will move the pointer\
    \ forward or back to other memory addresses for that data type – the larger the\
    \ data type, the bigger the jump.\n\nEven larger jumps can be achieved using the\
    \ += and -= operators to specify how many places to jump.\n\nPointer arithmetic\
    \ is especially useful with arrays because the elements in an array occupy consecutive\
    \ memory places.\n\nAssigning just the name of an array to a pointer automatically\
    \ assigns it the memory address of the first element in that array. Incrementing\
    \ the pointer by one then moves the pointer along to the next element’s address.\n\
