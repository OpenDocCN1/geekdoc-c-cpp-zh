- pgno: 221
  md: '# Getting the date and time


    Current system time is usually counted as the number of seconds elapsed since
    the Epoch at 00:00:00 GMT on January 1, 1970. The total count represents the current
    date and time according to the Gregorian calendar and is referred to as “Calendar
    time”. Special functions to handle date and time are provided in the time.h header
    file along with a data type struct named tm in which to store date and time components,
    as below:


    ![](img/db19f3858a1e321646bf2590afd29547_221_0.png)


    | Component | Description |

    |-----------|-------------|

    | int tm_sec | seconds after the minute, normally 0-59 |

    | int tm_min | minutes after the hour, 0-59 |

    | int tm_hour | hours since midnight, 0-23 |

    | int tm_mday | day of the month, 1-31 |

    | int tm_mon | months since January, 0-11 |

    | int tm_year | years since 1900 |

    | int tm_wday | days since Sunday, 0-6 |

    | int tm_yday | days since January 1st, 0-365 |

    | int tm_isdst | is Daylight Saving Time in effect |


    The current elapsed seconds count is returned by a time(NULL) function as a time_t
    data type. This can then be specified as the argument to a localtime() function
    for conversion to its various tm struct components.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "The struct components can be output in a standard date and time format using\
    \ an asctime() function. Alternatively, individual components can be output using\
    \ special time format specifiers with a strftime() function. This function requires\
    \ four arguments to specify a char array in which to store the formatted date\
    \ string, the maximum string length, the text and format specifiers to extract\
    \ the required components, and the tm struct to be used.\n\n![](img/db19f3858a1e321646bf2590afd29547_222_0.png)\n\
    \nThe Daylight Saving component tm_isdst is positive if Daylight Saving is in\
    \ effect; zero if not; or negative if that information is unavailable.\n\n![](img/db19f3858a1e321646bf2590afd29547_222_1.png)\n\
    \nA complete list of all time format specifiers is included in the Reference section\
    \ here.\n\n1. Begin a new program with a preprocessor instruction to include the\
    \ standard input/output library functions and the date and time functions\n\n\
    ```\n#include <stdio.h>\n#include <time.h>\n```\n\n![](img/db19f3858a1e321646bf2590afd29547_222_2.png)\n\
    \ndatetime.c\n\n2. Add a main function that declares a character array variable,\
    \ a time_t variable, and a tm struct\n\n```\nint main()\n{\n    char buffer[100];\n\
    \    time_t elapsed;\n    struct tm *now;\n}\n```"
