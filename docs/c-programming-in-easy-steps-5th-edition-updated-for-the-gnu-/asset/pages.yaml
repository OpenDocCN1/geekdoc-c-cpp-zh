  md: '# # Reading & writing characters


    # ## Standard input


    The **scanf()** function, used in previous examples, is the simplified version
    of a function named **fscanf()** that requires an input filestream as its first
    argument. This indicates a source from where a series of characters will be introduced
    into the program.


    In C programming, the filestream named **stdin** represents the keyboard and is
    the default source for the **scanf()** function. The function call **scanf(...)**
    is the same as **fscanf( stdin, ... )** .


    # ## Standard output


    Similarly, the **printf()** function is the simplified version of a function named
    **fprintf()** that requires an output filestream as its first argument. This indicates
    a destination where a series of characters will be output from the program.


    The filestream named **stdout** represents the monitor, and is the default source
    for the **printf()** function. The function call **printf(...)** is the same as
    **fprintf( stdout, ... )** .


    Other standard functions, which have **stdin** or **stdout** as their default
    filestreams, also have equivalents allowing an alternative filestream to be specified.
    These can be used to read files by specifying a file pointer as an alternative
    to reading from the **stdin** filestream. They can also be used to write files
    by specifying an alternative to the **stdout** filestream:


    +   - The **fputc()** function can be used to write to a filestream one character
    at a time – typically by looping through a **char** array. Its companion **fgetc()**
    can be used to read from a filestream one character at a time.

    +   - The **fputs()** function can be used to write to a filestream one line at
    a time, and its companion **fgets()** can be used to read from a filestream one
    line at a time.

    +   - The **fread()** function can be used to read an entire filestream, and its
    partner **fwrite()** can write an entire filestream.

    +   - The **fscanf()** function and the **fprintf()** functions can be used to
    read and write filestreams with strings and numbers.'
