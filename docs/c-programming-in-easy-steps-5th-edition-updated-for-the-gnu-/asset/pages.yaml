  md: '# Creating array variables


    An array variable can store multiple items of data, unlike a regular variable
    that can only store a single item of data.


    ![](img/db19f3858a1e321646bf2590afd29547_50_0.png)


    The items of data are stored sequentially in array “elements” that are numbered
    starting at zero. So, the first array value is stored in array element zero; the
    second array value is stored in array element one; and so on.


    An array variable is declared in a C program in the same way as regular variables
    but additionally, the size of the array (its number of elements) should be specified
    in the declaration. This is stated within square brackets following the array
    name, with this syntax:


    ```

    data-type array-name [ number-of-elements ] ;

    ```


    Optionally, an array can be initialized when it is declared by assigning values
    to each element as a comma-separated list enclosed by curly brackets (braces).
    For example, an array of three integers can be created and initialized with int
    arr[3] = { 1,2,3 } .


    An array element value can be referenced using the array name followed by square
    brackets containing the element number. For example, arr[0] references the value
    in the first element.


    It is acceptable in an array declaration to omit the number between the square
    brackets if the elements are being initialized in the declaration – the size will
    be automatically adjusted to accommodate the number of values being assigned to
    the array.


    One of the most significant uses of arrays in C programming concerns their ability
    to store strings of text. Each element in an array of the char data type can'
  merge: -1
  img_proc: true
