  md: '# Comparing values


    The operators that are commonly used in C programming to compare two numerical
    values are listed in the table below:


    ![](img/db19f3858a1e321646bf2590afd29547_81_0.png)


    | Operator: | Comparative test: |

    | --- | --- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    The == equality operator compares two operands and will return 1 (true) if both
    are equal in value, otherwise it will return 0 (false). If both are the same number
    they are equal, or if both are characters their ASCII code value is compared numerically.


    Conversely, the != inequality operator returns 1 (true) if the two operands are
    not equal, using the same rules as the == equality operator; otherwise it returns
    0 (false).


    Equality and inequality operators are useful in testing the state of two variables
    to perform conditional branching in a program.


    The > “greater than” operator compares two operands and will return 1 (true) if
    the first is greater in value than the second, or it will return 0 (false) if
    it is equal or less in value. The > “greater than” operator is frequently used
    to test the value'
