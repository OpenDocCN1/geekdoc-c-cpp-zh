  md: '# Creating a file


    A special data type for handling files is defined in the stdio.h header file.
    It is called a “file pointer” and has the syntax FILE *fp. File pointers are used
    to open, read, write, and close files. In a C program, a file pointer called “file_ptr”
    can be created with the declaration FILE *file_ptr ;


    ![](img/db19f3858a1e321646bf2590afd29547_202_0.png)


    A file pointer points to a structure defined in the stdio.h header file that contains
    information about the file. This includes details about the current character
    and if the file is being read or written.


    Before a file can be read or written it firstly must always be opened with the
    fopen() function. This takes two arguments to specify the name and location of
    the file, and a “mode” in which to open the file. The fopen() function returns
    a file pointer if successful, or a NULL value upon failure.


    Once a file has been successfully opened it can be read or added to, or new text
    can be written in the file, depending on the mode specified in the call to the
    fopen() function. Following this, the open file must then always be closed by
    calling the fclose() function and specifying the file pointer as its single argument.


    The table below lists all the possible file modes that can be specified as the
    second argument to the fopen() function:


    | File mode: | Operation: |

    |---|---|

    | r | Open an existing file to read |

    | w | Open an existing file to write. Creates a new file if none exists, or opens
    an existing file and discards all its previous contents |

    | a | Appends text. Opens or creates a text file for writing at the end of the
    file |

    |  | Opens a text file to read from or write to |'
  merge: -1
  img_proc: true
