  md: '# # Restricting accessibility


    The **static** keyword can be used to restrict the accessibility of functions
    to the file in which they are created, in exactly the same way that **static**
    variables have restricted accessibility. This is recommended practice in larger
    programs that are spread over multiple “.c” files, to safeguard against accidental
    misuse of functions. For instance, the **square()** and **multiply()** functions
    can’t be directly called from the **main()** function in this example.


