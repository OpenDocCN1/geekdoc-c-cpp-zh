    +   int main()

    +   {

    +   FILE *orig_ptr

    +   ; FILE *copy_ptr

    +   ; char buffer[1000] ;

    +   int num ;

    +   }

    +   ```


    +   3. Next, in the main function block, attempt to open an existing local file
    to read and another file to write to

    +   ```c

    +   orig_ptr = fopen ( "original.txt" , "r" ) ;

    +   copy_ptr = fopen( "copy.txt" , "w" ) ;

