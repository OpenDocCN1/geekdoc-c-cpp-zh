  md: "# Placing functions in headers\n\nThe example programs listed throughout this\
    \ book are necessarily small due to space considerations but in reality, most\
    \ C programs will contain significantly more code.\n\nWhen developing larger programs,\
    \ some thought should be given to program structure. Maintaining the entire program\
    \ code in a single file can become unwieldy as the program grows.\n\nIn order\
    \ to simplify the program structure, a custom header file can be created to contain\
    \ functions that may be used repeatedly. This should be named with a “.h” file\
    \ extension, like the standard header files in the C library.\n\nThe functions\
    \ in the custom header file can be made available to the program by adding an\
    \ #include preprocessor directive at the start of the file containing the main()\
    \ function. The custom header file name should be enclosed within double quotes\
    \ in the preprocessor directive though, rather than by the < and > angled brackets\
