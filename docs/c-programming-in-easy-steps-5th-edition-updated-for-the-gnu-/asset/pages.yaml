  md: '# Displaying variable values


    The value of variables can be displayed using the printf() function that was used
    in Chapter 1 to display the “Hello World” message. The desired format in which
    to display the variable value must be specified as an argument in the printf()
    function’s parentheses using a suitable “format specifier”, along with the variable
    name:


    | Specifier: | Description: | Example: |

    |---|---|---|

    | %d | An integer -32768 to +32767 | 100 |

    | %ld | A long integer -231 to +231 | 123456789 |

    | %f | A floating-point number | 0.123456 |

    | %c | A single character | ''A'' |

    | %s | A string of characters | "Hello World" |

    | %p | A machine memory address | 0x0022FF34 |


    A format specifier can ensure that the output occupies a specific minimum number
    of spaces by stating the required number immediately after the % character – for
    example, to ensure that an integer always fills at least seven spaces with the
    specifier %7d. If it is preferable for the blank spaces to be filled with zeros
    just add a zero between the % character and the specified number – for example,
    to ensure that an integer always fills at least seven spaces and that blank spaces
    are filled with zeros with the specifier %07d.


    A precision specifier, which is a period (full stop) followed by a number, can
    be used with the %f format specifier to determine how many decimal places to display
    – for example, to display just two decimal places with the precision specifier
    %.2f. The precision specifier can also be combined with the minimum space specifier
    to control both the minimum number of spaces and number of decimal places to display
    – for example, to display seven spaces including two decimal places and empty
    spaces filled by zeros with %07.2f.


    By default, empty spaces precede the number so it is right-aligned, but can be'
