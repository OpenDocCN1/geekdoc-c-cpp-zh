  md: '# Creating program variables


    A variable is a container in a C program in which a data value can be stored inside
    the computer''s memory. The stored value can be referenced using the variable''s
    name. The programmer can choose any name for a variable providing it adheres to
    the naming conventions listed in the table below:


    ![](img/db19f3858a1e321646bf2590afd29547_28_0.png)


    | Naming rule | Example |

    | --- | --- |

    | CANNOT contain any of the C keywords | volatile |

    | CANNOT contain arithmetic operators | a+b*c |

    | CANNOT contain punctuation characters | %$#@! |

    | CANNOT contain any spaces | no spaces |

    | CANNOT start with a number | 2bad |

    | CAN contain numbers elsewhere | good1 |

    | CAN contain mixed case | UPdown |

    | CAN contain underscores | is_ok |


    It is good practice to choose meaningful names for variables to make the program
    code more easily understood. To create a variable in the program code it is to
    be “declared”. A variable declaration has this syntax:


    ```

    data-type variable-name ;

    ```


    First, the declaration specifies which type of data the variable is permitted
    to contain. This will be one of the four data types described here. The data type
    is followed by a space then the chosen variable name, adhering to the naming'
