  md: '# Creating arrays of pointers


    A C program can contain arrays of pointers in which each element of an array stores
    the address of other variables.


    This ability is especially useful for handling strings of characters. A character
    array that ends with the \0 null character has string status, so can be assigned
    to a pointer variable. The name of a string char array acts like a pointer to
    its first element so the & addressof operator is not needed when assigning a string
    to a pointer variable.


    +   1 Begin a new program with a preprocessor instruction to include the standard
    input/output library functions


    ```

    #include <stdio.h>

    ```


    ![](img/db19f3858a1e321646bf2590afd29547_150_0.png)


    +   2 Add a main function that declares an integer variable, then declares and
    initializes an integer array variable


    ```

    int main()

    {

    int i;

    int nums[5] = {1, 2, 3, 4, 5};

    }

    ```


    +   3 Next, in the main function block, declare and initialize integer pointer
    variables with the address of each element


    ```

    int *ptr0 = &nums[0];

    int *ptr1 = &nums[1];

    int *ptr2 = &nums[2];

    int *ptr3 = &nums[3];

    int *ptr4 = &nums[4];

    ```


    +   4 Now, declare and initialize an integer pointer array, with each element
    containing one of the integer pointers


    ```

    int *ptrs[5] = { ptr0 , ptr1 , ptr2 , ptr3 , ptr4 };

    ```'
