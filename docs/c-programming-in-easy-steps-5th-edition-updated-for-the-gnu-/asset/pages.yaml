  md: '# Supplying arguments


    Data can be passed as “arguments” to custom functions, which can then use that
    data to execute their statements. The function prototype must include the name
    and data type of each argument.


    It is important to recognize that in C programming, the data is passed “by value”
    to the variable specified as the function argument. This is different to some
    other programming languages, such as Pascal, whose arguments are passed “by reference”
    – where the function operates on the original value, not just a local copy.


    The arguments in a function prototype are known as the “formal parameters” of
    the function. These may be of different data types, and multiple arguments can
    be specified for a single function if separated by a comma. For example, a function
    prototype with arguments of each of the four data types could look like this:


    ```

    void action( char c , int i , float f , double d ) ;

    ```


    The compiler checks that the formal parameters specified in the function prototype
    match those in the function definition and will report an error if they do not
    match.


    1 Begin a new program with a preprocessor instruction to include the standard
    input/output library functions


    ```

    #include <stdio.h>

    ```


    ![](img/db19f3858a1e321646bf2590afd29547_127_0.png)


    2 Declare three custom function prototypes with one argument to be passed to each
    one when called


    ```

    void display( char str[] ) ;

    int square( int x ) ;

    int cube( int y ) ;

    ```'
