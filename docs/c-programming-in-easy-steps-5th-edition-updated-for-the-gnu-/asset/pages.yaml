- pgno: 196
  md: '# # Allocating memory


    The standard C stdlib.h library header file provides memory management functions,
    with which a program can explicitly request memory be made available as the program
    executes. The malloc() function requires a single integer argument to specify
    how many bytes of memory to allocate, whereas the calloc() function requires two
    integer arguments that get multiplied together to specify how many bytes of memory
    to allocate. Both of these functions return a pointer to the beginning of the
    memory block when successful, or a NULL value upon failure.


    ![](img/db19f3858a1e321646bf2590afd29547_196_0.png)


    The calloc() function clears all allocated memory space to zero, but malloc()
    leaves whatever values are already there.


    Memory previously allocated with malloc() or calloc() can be increased with the
    realloc() function. This requires the pointer to the allocated memory block as
    its first argument, and an integer specifying the new block size as its second
    argument. It returns a pointer to the beginning of the enlarged memory block when
    successful, or a NULL value upon failure.


    All memory allocated with these functions should be released when no longer required
    by specifying the memory block pointer as the argument to the free() function.


    There is no standard C function to determine the size of a dynamically allocated
    memory block but this can be discovered with platform-specific functions. On Windows
    there is _msize() and on Linux there is malloc_usable_size(). Both these functions
    require the memory block pointer as their argument.


    +   1. Begin a new program with preprocessor instructions to include the standard
    library input/output functions and memory management functions'
