- pgno: 223
  md: 'Next, in the main function block, get the current elapsed seconds count since
    the Epoch


    ```

    elapsed = time(NULL);

    ```


    Now, convert the count to local time components


    ```

    now = localtime( &elapsed );

    ```


    Output the date and time in standard format


    ```

    printf( "%s\n", asctime( now ) );

    ```


    Then, output individual date and time components


    ```

    strftime( buffer, 100, "Today is %A, %B %d.\n", now );

    printf( "%s", buffer );

    strftime( buffer, 100, "The time is %I:%M %p.\n", now );

    printf( "%s", buffer );

    ```


    Finally, return the required zero integer then save the program file; compile
    and execute the program to see the current date and time information


    ```

    return 0;

    ```


