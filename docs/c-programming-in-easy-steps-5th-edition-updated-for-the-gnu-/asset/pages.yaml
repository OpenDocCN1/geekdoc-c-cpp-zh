    any function that receives one integer argument and returns an integer value –
    as specified in the prototype declaration.


    ![](img/db19f3858a1e321646bf2590afd29547_155_2.png)


    Like other pointers in C programming, a function pointer simply stores a memory
    address. When a function pointer is dereferenced with * the function at that address
    to which the pointer points gets called.'
