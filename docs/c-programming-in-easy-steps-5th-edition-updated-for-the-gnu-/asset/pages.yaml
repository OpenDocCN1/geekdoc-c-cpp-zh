  md: '# Assigning values


    The operators that are used in C programs to assign values are listed in the table
    below. All except the simple = assign operator are a shorthand form of a longer
    expression, so each equivalent is given for clarity.


    ![](img/db19f3858a1e321646bf2590afd29547_78_0.png)


    | Operator: | Example: | Equivalent: |

    |---|---|---|

    | = | a = b | a = b |

    | += | a += b | a = (a + b) |

    | -= | a -= b | a = (a - b) |

    | *= | a *= b | a = (a * b) |

    | /= | a /= b | a = (a / b) |

    | %= | a %= b | a = (a % b) |


    It is important to regard the = operator to mean “assign” rather than “equals”
    to avoid confusion with the == equality operator.


    In the example above, the variable named a is assigned the value that is contained
    in the variable named b – so that becomes the new value stored in the a variable.


    The += operator is useful to add a value onto an existing value that is stored
    in the a variable. In the table example, the += operator first adds the value
    stored in the variable a to the value stored in the variable b. It then assigns
    the result to become the new value stored in the a variable.


    All the other operators in the table work in the same way by making the arithmetical
    operation between the two values first, then assigning the result to the first
    variable to become its new stored value.'
