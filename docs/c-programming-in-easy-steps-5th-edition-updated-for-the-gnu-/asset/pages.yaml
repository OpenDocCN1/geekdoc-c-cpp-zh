- pgno: 104
  md: '# Testing expressions


    The if keyword is used to perform the basic conditional test that evaluates a
    given expression for a Boolean value of true or false. Statements within braces
    following the evaluation will only be executed when the expression is found to
    be true. So, the syntax of an if test statement looks like this:


    ```

    if ( test-expression ) {statements-to-execute-when-true }

    ```


    ![](img/db19f3858a1e321646bf2590afd29547_104_0.png)


    There may be multiple statements to be executed when the test is true, but each
    statement must be terminated by a semi-colon.


    Sometimes it may be desirable to evaluate multiple expressions to determine whether
    following statements should be executed, and this can be achieved in two ways.
    The logical && AND operator can be used to ensure the statements will only be
    executed when two expressions are both found to be true, with this syntax:


    ```

    if ( ( test-expression ) && ( test-expression ) ) { statements-to-execute }

    ```


    Alternatively, multiple if statements can be “nested”, one inside another, to
    ensure following statements will only be executed when both evaluated expressions
    are found to be true, like this:


    ```

    if ( test-expression )

    {

    if ( test-expression ) { statements-to-execute }

    }

    ```


    When one or more expressions evaluated by an if test statement is found to be
    false, the statements within its following braces are not executed and the program
    proceeds to subsequent code.'
  merge: -1
  img_proc: true
