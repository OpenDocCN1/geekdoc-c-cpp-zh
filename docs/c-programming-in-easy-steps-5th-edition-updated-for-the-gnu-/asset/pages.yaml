- pgno: 40
  md: '# Using global variables


    The extent to which variables are accessible in a program is called the “variable
    scope”. Variables declared within a function are known as “local” variables, whereas
    variables declared outside any function blocks are known as “global” variables.


    ![](img/db19f3858a1e321646bf2590afd29547_40_0.png)


    Local variables can only be accessed from within the function in which they are
    declared. This is the default implicit behavior that could be explicitly specified
    with the seldom-used auto keyword in the variable declaration. They come into
    existence when the function is called, and normally disappear when the function
    ends.


    Global variables, on the other hand, can be accessed from within any function
    in the program. They come into existence when the program executes, and remain
    in existence until the program ends.


    An external global variable must be defined exactly once at the start of the program.
    It must also be declared at the start of each function that needs access to it.
    The declaration should begin with the extern keyword to denote that it references
    an external variable, rather than a regular local variable declaration. These
    declarations should not be used to initialize the global variable.


    Larger C programs often consist of multiple source code files that are compiled
    together to create a single executable file. Global variables are normally accessible
    from any function in any of the files being compiled together. All functions are
    normally accessible globally too, but functions and – more usually – global variables
    can have their accessibility limited to just the file in which they are created
    by the use of the static keyword in their declaration.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Normally, a program cannot employ multiple variables of the same name but can
    do so if each is declared to be a **static** variable and is unique within that
    source code file. Programming with multiple source code files can reveal a common
    global variable name duplicated in two different files. Declaring these as **static**
    avoids the need to rename one of the variables in each occurrence within the source
    code.


    Internal local variables can also be declared as **static**. These are only accessible
    from within the function in which they are declared, as usual, but they do not
    disappear when the function ends. This allows permanent private storage within
    a function until the program ends.


    ![](img/db19f3858a1e321646bf2590afd29547_41_0.png)


    Widespread use of global variables can introduce name conflicts.


    ![](img/db19f3858a1e321646bf2590afd29547_41_1.png)


    Try to use only local variables. Global variables allow convenient access to values
    from any function within a program but it is better practice to avoid global variables
    and pass values between functions as arguments instead.


