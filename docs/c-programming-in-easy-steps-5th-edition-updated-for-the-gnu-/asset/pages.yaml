  md: "```\nprintf ( \"\\nStarting countdown...\\n\\n\" );\n```\n\nAdd a loop to output\
    \ a countdown value and call the other function on each iteration\n\n```\nfor(\
    \ i = 10 ; i > -1 ; i-- )\n{\n    printf ( \" - %d\", i );\n    wait(1);\n}\n\
    ```\n\nNext, in the main function block, get the current time once more then output\
    \ the time taken to run the loop\n\n```\nstop = time( NULL );\nprintf(\"\\nRuntime:\
    \ %.0f seconds\\n\" , difftime( stop, go ) );\n```\n\nFinally, in the main function\
    \ block, return a zero integer value, as required by the function declaration\n\
    \n```\nreturn 0 ;\n```\n\nAfter the main function block, begin the function definition\
    \ by initializing a clock_t variable at a future point beyond the current elapsed\
    \ running time\n\n```\nvoid wait( int seconds )\n{\n    clock_t end_wait =\n \
    \       ( clock() + ( seconds * CLOCKS_PER_SEC ));\n}\n```\n\nFinally, in the\
    \ wait function block, add an empty loop that terminates when the current time\
    \ reaches the future point, returning control to the loop in the main function\n\
    \n```\nwhile ( clock() < end_wait ) { }\n```\n\nSave the program file, then compile\
    \ and execute the program to see the countdown timer and runtime\n\n![](img/db19f3858a1e321646bf2590afd29547_225_0.png)"
