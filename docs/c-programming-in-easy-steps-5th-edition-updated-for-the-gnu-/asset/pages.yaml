  md: "# Grouping in a union\n\nIn C programming, a “union” allows different pieces\
    \ of data, of any data type, to be stored at the same memory location as the program\
    \ proceeds – assigning a value to the union will overwrite that previously stored\
    \ there. This allows efficient use of memory.\n\nA union is like a struct but\
    \ is declared with the union keyword and, because of its nature, its members can\
    \ only be assigned values individually as the program proceeds.\n\nAn array of\
    \ unions can be created in the same way as an array of structs was created in\
    \ the previous example, but union members can only be initialized in the declaration\
    \ if they are all of the same data type. A pointer to a union can be created in\
    \ exactly the same manner in which a pointer to a struct is created and a union\
    \ can be passed to a function just like any other variable.\n\n![](img/db19f3858a1e321646bf2590afd29547_193_0.png)\n\
    \nunion.c\n\n+   1. Begin a new program with a preprocessor instruction to include\
