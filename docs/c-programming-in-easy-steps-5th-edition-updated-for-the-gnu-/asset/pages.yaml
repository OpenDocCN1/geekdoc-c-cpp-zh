  md: '# Functions that format output


    ```

    int printf( FILE *stream, const char *format, ... )

    ```


    The printf function converts and writes output to a specified filestream under
    the control of a format specifier. It returns the number of characters written,
    or a negative value if an error occurs


    ```

    int printf( const char *format, ... )

    ```


    The printf() function writes and converts output to stdout. It is equivalent to
    fprintf(stdout, const char *format)


    ```

    int sprintf( char *s, const char *format, ... )

    ```


    The sprintf() function is the same as printf() except the output is written into
    the specified string, and terminated with a 0 null character


    ```

    vprintf( const char *format, va_list arg )

    ```


    ```

    vfprintf( FILE *stream, const char *format, va_list arg )

    ```


    ```

    vsprintf( char *s, const char *format, va_list arg )

    ```


    These three functions are equivalent to the corresponding printf() functions except
    that their variable argument list is replaced by an argument of the va_list type.
    Refer to the stdarg.h header file functions here for more details


    # Functions that format input


    ```

    int fscanf( FILE *stream, const char *format, ... )

    ```


    The fscanf() function reads from a specified stream under the control of a format
    specifier and assigns converted values to subsequent arguments. It returns the
    number of input items converted or the EOF constant if the end of the file is
    met, or if an error occurs


    ```

    int scanf( const char *format, ... )

    ```


    The scanf() function reads and converts input to stdin. It is equivalent to fscanf(stdin,
    const char *format)


    ```

    int sscanf( char *s, const char *format, ... )

    ```


    The sscanf() function is the same as scanf() except the input is read from the
    specified string


    # Format specifiers for output


