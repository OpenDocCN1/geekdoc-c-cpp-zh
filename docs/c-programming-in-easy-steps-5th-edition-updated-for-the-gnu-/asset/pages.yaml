  md: '# Declaring functions


    Previous examples in this book have used the obligatory main() function and standard
    functions contained in the C header library, such as the printf() function from
    the stdio.h file. However, most C programs contain a number of custom functions,
    which can be called as required during the execution of the program.


    ![](img/db19f3858a1e321646bf2590afd29547_124_0.png)


    A function block simply contains a group of statements that get executed whenever
    that function is called. Once the function statements have been executed, program
    flow resumes at the point directly following the function call. This modularity
    is very useful in C programming to isolate set routines so they can be called
    upon repeatedly.


    To introduce a custom function into a C program it must first be declared, in
    a similar manner that variables must be declared before they can be used. Function
    declarations should be added before the main() function block.


    Like the main() function, custom functions can return a value. The data type of
    this return value must be included in the function declaration. If the function
    is to return no value, its return data type should be declared with the void keyword.
    The function should be named following the same naming conventions used for variable
    names.


    The function declaration is more correctly known as the “function prototype” and
    simply informs the compiler about the function. The actual function definition,
    which includes the statements to be executed, appears after the main() function.
    The custom function can then be called upon to execute its statements from within
    the main() function, as required.


    If a custom function returns a value this can be assigned to a variable of an'
