- pgno: 263
  md: '# # Jump functions


    `<setjmp.h>`


    The **setjmp.h** header is used for controlling low-level calls and provides a
    means to avoid the normal call and return sequence.


    | Function | Description |

    |---|---|

    | `int setjmp( jmp_buf env )` | Low-level function used in conditional tests to
    save the environment in the *env* variable, then return zero |

    | `void longjmp( jmp_buf env , int value )` | Restores an environment that has
    been saved in the *env* variable by `setjmp()`, as if `setjmp()` had returned
    the *value* |'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Signal functions


    <signal.h>


    The signal.h header contains functions for handling exceptional conditions that
    may arise during the execution of a program:


    ```

    void (*signal ( int sig , void (*handler) ( int ))) ( int )

    ```


    The signal() function specifies how subsequent signals will be handled. The handler
    can be SIG_DFL, an implementation-defined default; or SIG_IGN, to ignore the signal.
    Valid sig signals include:


    +   - SIGABRT : abort termination

    +   - SIGFPE : arithmetic error

    +   - SIGILL : illegal instruction

    +   - SIGINT : external interruption

    +   - SIGSEGV : access outside memory limit

    +   - SIGTERM : termination request sent to the program


    The function returns the previous value of the handler for that specific signal,
    or SIG_ERR if an error occurs. When a sig signal next occurs, the signal is restored
    to its default behavior then the signal handler is called. If this returns, execution
    resumes at the point where the signal occurred


    ```

    int raise( int sig )

    ```


    Attempts to send the sig signal to the program and returns a non-zero value if
    the attempt is unsuccessful'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Limit constants


    ```

    <limits.h>

    ```


    The table below lists constants related to maximum and minimum numerical limits.
    Their values vary according to implementation. Where a value is given, in brackets,
    it indicates a minimum size for that constant – but larger values may, in fact,
    be imposed. Programs should not assume that any implementation-dependent constant
    will be of a particular value.


    | Constant: | Value: |

    |---|---|

    | CHAR_BIT | number of bits in a char (8) |

    | CHAR_MAX | maximum value of char (UCHAR_MAX or SCHAR_MAX) |

    | CHAR_MIN | minimum value of char (zero or SCHAR_MIN) |

    | INT_MAX | maximum value of int (+32,767) |

    | INT_MIN | minimum value of int (-32,767) |

    | LONG_MAX | maximum value of long (+2,147,483,647) |

    | LONG_MIN | minimum value of long (-2,147,483,647) |

    | SCHAR_MAX | maximum value of signed char (+127) |

    | SCHAR_MIN | minimum value of signed char (-127) |

    | SHRT_MAX | maximum value of short (+32,767) |

    | SHRT_MIN | minimum value of short (-32,767) |

    | UCHAR_MAX | maximum value of unsigned char (+255) |

    | UINT_MAX | maximum value of unsigned int (+65,535) |

    | ULONG_MAX | maximum value of unsigned long (+4,294,967,295) |

    | USHRT_MAX | maximum value of unsigned short (+65, 535) |'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Float constants


    <float.h>


    The table below lists constants related to floating-point arithmetic. Their values
    vary according to implementation. Where a value is given, in brackets, it indicates
    a minimum size for that constant.


    | Constant: | Value: |

    |---|---|

    | FLT_RADIX | radix of float exponent representations (2) |

    | FLT_ROUNDS | rounding to the nearest number |

    | FLT_DIG | number of precision digits (5) |

    | FLT_EPSILON | smallest number x, where 1.0 + x != 1.0 (1E-5) |

    | FLT_MANT_DIG | number of FLT_RADIX mantissa digits |

    | FLT_MAX | maximum floating-point number (1E+37) |

    | FLT_MAX_EXP | largest number n, where FLT_RADIX^(n-1) is a valid number |

    | FLT_MIN | minimum floating-point number (1E-37) |

    | FLT_MIN_EXP | smallest number n, where 10^n is valid |

    | DBL_DIG | number of double-precision digits (10) |

    | DBL_EPSILON | smallest number x, where 1.0 + x != 1.0 (1E-9) |

    | DBL_MANT_DIG | number of FLT_RADIX mantissa digits |

    | DBL_MAX | maximum double float number (1E+37) |

    | DBL_MAX_EXP | largest number n, where FLT_RADIX^(n-1) is a valid number |

    | DBL_MIN | minimum double float number (1E-37) |

    | DBL_MIN_EXP | smallest number n, where 10^n is valid |'
  merge: -1
  img_proc: true
