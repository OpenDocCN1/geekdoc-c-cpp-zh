- pgno: 61
  md: "# Enumerating constant values\n\nThe enum keyword provides a handy way to create\
    \ a sequence of integer constants in a concise manner. Optionally, the declaration\
    \ can include a name for the sequence after the enum keyword. The constant names\
    \ follow as a comma-separated list within braces.\n\nEach of the constants will,\
    \ by default, have a value one greater than that of the constant it follows in\
    \ the list. Unless specified, the first constant will have a value of zero; the\
    \ next a value of 1; and so on.\n\nFor example, named weekday constants can be\
    \ given a sequence of integer values starting at zero with `enum{MON,TUE,WED,THU,FRI};`\
    \ – in this case, the constant WED has an integer value of 2.\n\nThe constants\
    \ can be assigned any individual integer value in the declaration but the next\
    \ constant in the list will always increment the preceding value by one, unless\
    \ it too is assigned a value. For example, to begin the sequence at 1 instead\
    \ of zero, assign 1 to the first constant with `enum{MON=1,TUE,WED,THU,FRI};`\
    \ – in this case, the constant WED has an integer value of 3.\n\nThe list of enumerated\
    \ constants is also known as an “enumeration set” and may contain duplicate constant\
    \ values. For example, the value zero could be assigned to constants named NIL\
    \ and NONE.\n\nIn the following example, the enumeration set represents the points\
    \ value of balls in the game of snooker, and includes an optional name, which\
    \ appears in uppercase as it too is constant.\n\n+   1. Begin a new program with\
    \ a preprocessor instruction to include the standard input/output library functions\n\
    +   \n+   `#include <stdio.h>`\n\n![](img/db19f3858a1e321646bf2590afd29547_61_0.png)"
