  # 术语表


  以下是本书中解释的一些关键术语和概念：


  1. `Artificial Intelligence (AI)`（人工智能）——计算机科学的一个领域，涉及开发能够执行通常需要人类智能的任务的智能机器。

  2. `Bias`（偏差）——`AI` 系统在数据、算法或决策中的偏见或不公平。

  3. `Chatbot`（聊天机器人）——设计用于与人类用户对话的计算机程序，通常用于客户服务、信息检索或娱乐。

  4. `Deep Learning`（深度学习）——机器学习的一个子集，使用神经网络从大量数据中学习并做出预测或决策。

  5. `Domain-specific`（领域特定的）——指为特定主题或学科领域定制的模型或系统。

  6. `Feedback loop`（反馈循环）——一种利用用户反馈随时间推移提高 `AI` 系统性能的系统。

  7. `Fine-tuning`（微调）——通过在新数据上进行训练，将 `GPT-3` 等预训练模型适配到特定任务或领域的过程。

  8. `Generative Pre-trained Transformer 3 (GPT-3)`——由 OpenAI 开发的先进深度学习模型，可以生成类人类文本，并完成语言翻译、摘要和问答等任务。

  9. `Multilingual`（多语言的）——能够理解和生成多种语言的内容。

  10. `Natural Language Processing (NLP)`（自然语言处理）——`AI` 的子领域，专注于使用自然语言进行计算机与人类之间的交互。


