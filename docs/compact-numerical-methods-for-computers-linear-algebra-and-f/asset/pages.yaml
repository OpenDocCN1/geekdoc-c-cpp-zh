  md: '# Compact numerical methods for computers


    The files which end in an ''X.'' contain information to control the drivers, in
    fact, they contain the names of the EX·CNM control files. This facility is provided
    to allow for rapid testing of all the codes at once (the technical term for this
    is ''regression testing''). Note that console image files having names of the
    form OUT102 are created, which correspond to the driver names, i.e. DR0102-PAS.
    The command line files present on the disk are:


    +   - DR010X. DR03AX. DR03X. DR04X. DR0506X. DR0708X.

    - DR09X. DR10X. DR13X. DR14X. DR15X. DR1617X.

    - DR1618X. DR19X. DR21X. DR22X. DR23X. DR24IIX.

    - DR24LEX. DR24LSX. DR25X. DR26X. DR27X.


    Users may wish to note that there are a number of deficiencies with version 3.01a
    of Turbo Pascal. I have experienced some difficulty in halting programs with the
    Control-C or Control-Break keystrokes, in particular when the program is waiting
    for input. In some instances, attempts to halt the program seem to interfere with
    the files on disk, and the ''working'' algorithm file has been over-written! On
    some occasions, the leftmost characters entered from the keyboard were erased
    by READ instructions. From the point of view of a software developer, the absence
    of a facility to compile under command of a BATch command file is a nuisance.
    Despite these faults, the system is relatively easy to use. Many of the faults
    of Turbo Pascal 3.01a have been addressed in later versions of the product. We
    anticipate that a diskette of the present codes adapted for version 5.0 of Turbo
    Pascal will be available about the time the book is published. Turbo Pascal 5.0
    is, however, a much ''larger'' system in terms of memory requirements.'
