    so that root can always be located by this method in a fixed number of steps.
    Since the function values are only examined for their signs, an unnecessarily
    large number of function evaluations may be required. By reversing the process
    of interpolation—that is, estimating function values between tabulated values
    by means of an interpolating function fitting the tabular points—one may expect
    to find the root with fewer evaluations of the function. Many interpolants exist,
    but the simplest, the easiest and most reliable to use. This linear interpolation
    method seeks the zero of the line


    ```

    $y-f(u) = [f(v)-f(u)](b-u)/(v-u) \qquad (13.23)

    ```


    which by substitution of $y=0$ gives


    ```

    $b = [u(v)-v(u)]/[f(v)-f(u)] \qquad (13.24)

    ```


    Once $f(b)$ has been evaluated, the interval can be reduced by testing for condition
    (13.21) in the bisection process.

    All the above discussion is very much a matter of common sense. However, in computer
    arithmetic the formula may not give the expected results. For instance consider
    the function depicted in figure 13.1(a). Suppose that the magnitude of $f(v)$
    is much greater than $u$. Then formula (13.24) will return a value $b$ very close
    to $u$. In fact, to the precision used, it may happen that $b$ and $u$ are identical
    and an iteration based on (13.24) may never converge. For this reason it is suggested
    that this procedure, known as the method of False Position, be combined with bisection
    to ensure convergence. In other words, after every few iterations using the False
    Position formula (13.24), a step is made using the bisection formula (13.20).
    In all of this discussion the practical problems of evaluating the function correctly
    have been discret ignored. The algorithms will, of course, only work if the function
    is accurately computed. Acton (1970, chap 1) discusses some of the difficulties
    encountered in computing functions.


    A final possibility can be troublesome in practice that either of the formula
    (13.20) or (13.24) may result in a value for $b$ outside the interval $[u, v]$
    when applied in finite-precision arithmetic, a clearly impossible situation when
    the calculations are exact. This has already been discussed in §1.2 (p 6). Appropriate
    tests detect this, which can only occur when $u$ and $v$ are close to each other,
    that is, when the iteration is nearing convergence. The author has several unfortunate
    experiences with algorithms which, lacking the appropriate tests, continue to
    iterate for hundreds of steps.


