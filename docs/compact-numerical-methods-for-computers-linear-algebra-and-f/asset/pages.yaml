  md: "# Real symmetric matrices\n\nExample 10.2. Application of the Jacobi algorithm\
    \ in celestial mechanics\n\nIt is appropriate to illustrate the use of algorithm\
    \ 14 by Jacobi's (1846) own example. This arises in the study of orbital perturbations\
    \ of the planets to compute corrections to some of the parameters of the solar\
    \ system. Unfortunately at the time Jacobi was writing his paper, Neptune had\
    \ not been discovered. Leverrier reported calculations suggesting the existence\
    \ of this planet on 31 August 1846, at l'Académie des Sciences in Paris, and Galle\
    \ in Berlin confirmed this hypothesis by observation less than three weeks later\
    \ on 18 September. The derivation of the eigenproblem in this particular case\
    \ is lengthy and irrelevant to the present illustration, so we will begin with\
    \ Jacobi's equations V. We give a non-symmetric matrix A which can be symmetr\
    \ by a diagonal transformation resulting in Jacobi's equations VIII, where the\
    \ off-diagonal elements are expressed in terms of their common logarithms to ten\
    \ have been added. I decided to work with the non-symmetric form and symmetrise\
    \ it by means\n\n```\nA_ij = A_ji = (\tilde{A}_{ij})^{1/2}\n```\n\nThe output\
    \ from a Hewlett-9830 (machine precision = 1E-11) is given below, and includes\
    \ logarithmic elements which in every case approximate closely Jacobi's equations\
    \ VIII. For example, he computed values -2.2584562,-3.7151584,-5.2986987,-7.5740431,-17.1524687,-18.863192\
    \ and -22.426712 over 10 rotations. At this point the largest off-diagonal element\
    \ (which is marked as being negative) had a logarithm (8-852828-10), which has\
    \ the approximate antilog -7.124E-2, Jacobi used as a computing system his student\
    \ Ludwig Seidel, apparently operating in eight-digit arithmetic:\n\n```\nENHC\
    \ JACOBI WITH ORDERING MAR 5 75\nORDER= 7\nINPUT JACOBI'S MATRIX\nROW =\n-5.509852\
    \ 1.870086 0.422908 8.81400E-03 0.148711\n3.90980E-03 4.50000E-05\nROW =\n0.287065\
