    # 3.4. A FINE POINT


    Equations (3.15) and (3.19) give the algorithm just described obviously to proceed
    towards both orthogonalisation and an ordering of the columns of the resulting
    matrix A⁽). However, the rotations must be arranged in some sequence to carry
    this task to completion. Furthermore, it remains to show that some sequences of
    rotations will not place the columns in disorder. For suppose a₁ is orthogonal
    to all other columns and larger than any of them individually. A sequential arrangement
    of the rotations to operate on columns (1,2), (1,3), (1,4), ..., (1,n), followed
    by (2,3), ..., (2,n), (3,4), ..., ((n-1),n) will be a cycle or sweep. A sweep
    applied to the matrix described can easily yield a new a₂ for which


    ```

    a₂ > a₁ (3.29)

    ```


    if, for instance, the original matrix has a₂a₃ and the norm of these vectors is
    greater than 2⁻¹½ the norm of a₁. Another sweep of rotations will put things right
    in this case by exchanging a₁ and a₂. However, once columns have achieved a separation
    in a certain way to the non-orthogonality measure (3.17), it can be shown that
    no subsequent rotation can exchange them.


    Suppose that the algorithm has proceeded so far that the non-orthogonality measure
    Z satisfies the inequality


    ```

    Z < t² (3.30)

    ```


    where t is some positive tolerance. Then, for any subsequent rotation the parameter
    p, equation (3.21), must obey


    ```

    p² < t² (3.31)

    ```


    Suppose that all adjacent columns are separated in size so


    ```

    a₁⁻¹₋₋₋₋₋a₋₋a₁ > t (3.32)

    ```


    Then a rotation which changes a₁ (but not a₁) changes the ordering of the two
    columns. If x = aₖ, then straightforward use of equations (3.23) and (3.24) or
    (3.25) and (3.26) gives


    ```

    XᵀX - xᵀx = (u-q)/2 ≥ (3.33)

    ```


    Using (3.31) and (3.22) in (3.33) gives


    ```

    XᵀX - xᵀx ≤ [(4t²+q²)/2 - q]/2 ≤[(2t+q)-q]≤t (3.34)

    ```


    Thus, once columns become sufficiently separated by size and the non-orthogonality
    sufficiently diminished, the column ordering is stable. When some columns are
    equal in norm but not orthogonal, the above theorem can be applied to columns
    separated by size.


