  md: "# Linear equations—a direct approach\n\nIf $A'_{ij}$ is zero, we cannot proceed,\
    \ and 'small' $A'_{ij}$ are quite likely to occur during subtractions involving\
    \ digit cancellations, so multipliers $m_{ij}$ that are large and inaccurate are\
    \ possible. However, we can ensure that multipliers $m_{ij}$ are all less than\
    \ one by permuting the rows of $A$ (and hence $A$) so that the largest of $A'_{ij}$\
    \ for $i=j+1, \\dots, n$, is in the diagonal or pivot position. This modified\
    \ procedure, called Gauss elimination with partial pivoting, has a large literature\
    \ (see Wilkinson (1965) for a discussion with error analysis). Since the rows\
    \ of $A$ have been exchanged, this procedure gives the triangular decomposition\n\
    \n```\nPA=LR \\quad (6.27)\n```\n\nwhere **P** is the permutation matrix, simply\
    \ a re-ordering of the columns of a unit matrix appropriate to the re-ordering\
    \ of the rows of **A**.\n\nParticular methods exist for minimising error propagation\
    \ in the Gauss elimination procedure by using double-precision accumulation of\
    \ vector inner products are given by the names of Crand and Cootlittle and are\
    \ discussed, by instance Dahquist and Björck (1974) as well as by Wilkinson (1965).\
    \ Since the accumulation of inner products in several computer programming languages\
    \ is a non-trivial operation (though on a few machines it is simpler to accumulate\
    \ in double than in single precision), these will not be discussed here. Nor will\
    \ the Gauss elimination with complete pivoting, which chooses as pivot the largest\
    \ element in the current matrix, thereby requiring both column and row permutations.\
    \ The consensus opinion in the literature appears to be that this involves too\
    \ much work for the few occasions when complete pivoting is distinctly more accurate\
    \ than partial pivoting.\n\nThe Gauss elimination with partial pivoting and back-substitution\
    \ are now stated explicitly. All work is done in an array **A** of dimension $n$\
    \ by $n+p$, where $p$ is the number of right-hand sides $b$ to be solved.\n\n\
    Algorithm 5. Gauss elimination with partial pivoting\n\n| Procedure gelim(n: integer;\
    \ [order of right hand sides] p: integer; [number of right hand sides] var A:\
    \ matrix; [equation coefficients in row order with right hand built inside matrix\
    \ columns n+1,..n+p] tol: [pivot tolerance] |\n\n```\n {alg05_pas == Gauss elimination\
    \ with partial pivoting.\nThis form does not save the pivot ordering, does it\
    \ keep\nthe matrix decomposition which results from the calculations.\nCopyright\
    \ 1998 J. C. Nash\n} var\ndetet, s: real;\nh,i,j: integer;\nbegin [STEP 0]\ndet\
    \ := 1.0; [to initialise determinant value]\nwriteln('alg05_pas -- Gauss elimination\
    \ with partial pivoting');\nfor j := 1 to (n-1) do [STEP 1]\n```"
