    # 4.5. RELATED CALCULATIONS


    It happens that a least-squares solution has to be updated as new data are collected
    or become available. It is preferable to achieve this by means of a stable method
    such as the singular-value decomposition. Decomposition (1971) discusses the general
    problem of updating regression solutions, while Businger (1970) has proposed a
    method for updating a singular-value decomposition. However, the idea suggested
    in the opening paragraph of this chapter, is to orthogonalise (n+1) rows of n
    elements by means of plane rotations, which quite well. Moreover, it can be incorporated
    easily into algorithm 4, though a little caution is needed to ensure the correct
    adjustment of quantities needed to compute statistics as R^2. Nash and Lefkovitch
    (1977) present both FORTRAN and BASIC programs which do this. These programs are
    sub-optimal in the sense that they perform the normal sweep through the rows of
    W, whereas a new observation is appended the first n rows are already orthogonal.
    Because the saving only applies during the first sweep, no special steps have
    been taken to employ this knowledge. Unfortunately, each orthogonalisation of
    rows may take as long as the first, that follows the Given'' reduction. Perhaps
    this is not surprising since new observations may profoundly change the nature
    of a least-squares problem.'
