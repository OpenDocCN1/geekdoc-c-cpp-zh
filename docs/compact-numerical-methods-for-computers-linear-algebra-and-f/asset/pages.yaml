    \ (8.12).\n\nNow assume\n\n```\n$A_{hj}^{(k-1)} = -A_{jh}^{(k-1)}$ \\quad$ (8.15)\n\
    ```\n\n$1 \\le h \\le k-1, k \\le j \\le n$, for any of $k=2, \\dots, n$. We will\
    \ show that the hypothesis is true for $k$. By equation (8.13) we have\n\n```\n\
    $A_{hj}^{(k)} = A_{hj}^{(k-1)} - A_{hk}^{(k-1)}A_{kj}^{(k-1)}/A_{kk}^{(k-1)}$\
    \ \\n$ = -A_{hj}^{(k-1)} - (-A_{kh}^{(k-1)})A_{kj}^{(k-1)}/A_{kk}^{(k-1)}$ \\\
    n$ = -A_{jh}^{(k)}$ \\quad$ (8.16)\n```\n\nwhere we use the identity\n\n```\n\
    $A_{jk}^{(k-1)} = A_{kj}^{(k-1)}$ \\quad$ (8.17)\n```\n\nsince these elements\
    \ belong to a submatrix $\\mathbf{Z}$ which is symmetric in accord with the earlier\
    \ discussion.\n\nIt remains to establish that\n\n```\n$A_{kj}^{(k)} = -A_{jk}^{(k)}$\
    \ \\quad$ for $j=(k+1), \\dots, n$ \\quad$ (8.18)\n```\n\nbut this follows immediately\
