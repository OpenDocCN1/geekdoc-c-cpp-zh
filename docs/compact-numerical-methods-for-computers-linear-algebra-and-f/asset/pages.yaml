    # 1.5. CHOICE OF ALGORITHMS


    The algorithms in here have been chosen for their utility in solving a variety
    of important problems in computational mathematics and their ease of implementation
    to short programs with relatively little working storage. Many topics are left
    out, despite their importance, I feel that there has been insufficient development
    in directions relevant to compact numerical methods for a suitable algorithm to
    be included. For example, over the last 15 years I have been interested in methods
    for the mathematical programming which do not require a tableau to be developed
    either explicitly or implicitly, since these techniques are generally quite memory
    and content efficient. The appearance of the interior point methods associated
    with the name of Karmarkar (1984) hold some hope for the future, but currently
    the programs are quite complicated.


    In the solution of linear equations, my exposition has been confined to Gauss
    Choleski decomposition. The literature on this subject is, however, vast and other
    algorithms exist. These circumstances arise to make them more appropriate. For
    instance, Zambardino (1974) presents a form of Gauss elimination which uses less
    space than the one presented here. This procedure, in ALGOL, is called QUTERSOL
    because $n^2/4$ elements are stored, though an integer vector is needed to store
    pivot information and the problem given by Zambardino is quite complicated.


    Many special methods can also be devised for matrices having special structures
    such as diagonal bands. Wilkinson and Reinsch (1971) give several such algorithms
    for both linear equations and the eigenvalue problem. The programmer with many
    problems of a special structure should consider these. However, I have found that
    most users want a reliable general-purpose method for linear equations'
