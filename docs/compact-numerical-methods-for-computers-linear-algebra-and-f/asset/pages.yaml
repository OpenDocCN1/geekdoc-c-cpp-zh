  md: '# 17.2. TWO METHODS


    Almost immediately two possible routes to minimising S(x) suggest themselves.


    The \textit{Cauchy} steepest descents method


    Find the gradient 2s(x) of S(x) and step downhill along it. (The reason for the
    factor 2 will become apparently shortly.) Suppose that t represents the step length
    along the gradient, for some t we have


    ```

    S(x-n) < S(x)

    ```


    ```

    S(x+(1-c)x) \le S(x) + (1-c)S(x)

    ```


    For 0 < c < 1. For non-convex functions which are bounded from below, the steepest
    descents method will find a local minimum or saddle point. All the preceding results
    are, of course, subject to the provision that the function and gradient are computed
    (an almost impossible requirement). In practice, convergence is so slow as to
    disqualify the method of steepest descents on its own as a candidate for minimising
    functions.


    Often the cause of slowness of convergence is the tendency of the method to take
    pairs of steps which are virtually opposites, and which are essentially perpendicular
    to the direction in which the minimum is to be found. In two-parameter example
    we may think of a narrow valley with the minimum somewhere along its length. Our
    starting point is somewhere on the side of the valley but not near this minimum.
    The gradient will be such that the direction of steepest descent is towards the
    floor of the valley. However, the step taken can easily traverse the valley. The
    situation is then similar to the original one, and it is possible to step back
    across the valley almost to our starting point with only a very slight motion
    along the valley towards the solution point. One can picture the process as following
    a path similar to that which would be followed by a marble or ball-rolling over
    the valley-shaped surface.


    To illustrate the slow convergence, a modified version of steepest descents was
    programmed in BASIC on a Data Nova MINicomputer having machine precision 2⁻⁷².
    The modified method step doubling if a step is successful. The step length is
    divided by 4 if a step is unsuccessful. This reduction in step size is repeated
    until a smaller sum of squares is found or the step is so small that none of the
    parameters change. As a test problem, consider the Rosenbrock banana-shaped valley:


    ```

    S(x) = S(x1, x2) = 100(x2 - x1²)² + (1 - x1)

    ```


    starting with


    ```

    S(-1, 2, 1) = -24199

    ```'
