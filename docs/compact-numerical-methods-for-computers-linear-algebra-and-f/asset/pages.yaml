  md: '# Chapter 1


    # # A STARTING POINT


    # 1.1. PURPOSE AND SCOPE


    This monograph is written for the person who has solve problems with (small) computers.
    It is a handbook to help him or her obtain reliable answers to specific questions,
    posed in a mathematical way, using limited computational resources. To this end
    the solution methods proposed are presented not only as formulae but also as algorithms,
    those recipes for solving problems which are more than merely a list of the mathematical
    ingredients.


    There has been an attempt throughout to give examples of each type of calculation
    and in particular to give examples of cases which are prone to upset the execution
    of algorithms. No doubt there are many gaps in the treatment where the experience
    is condensed into these pages has not adequate to guard against all the pitfalls
    that confront the problem solver. The process of learning is continuous, as for
    the teacher as the taught. Therefore, the user of this work is advised to learn
    for him/herself and to use his/her own knowledge and familiarity of particular
    problems as possible. There is, after all, barely working career of experience
    with automatic computation and it should not seem surprising that satisfactory
    methods do not exist as yet for many problems. Through the sections which follow,
    this underlying novelty of the art of solving numerical by automatic algorithms
    finds expression in a conservative design policy. Reliability is given by priority
    over speed, and from the title of the work, space requirements for both the programs
    and the data are kept low.


    Despite this policy, it must be mentioned immediately and with some emphasis that
    the algorithms may prove to be surprisingly efficient from a cost-of-running point
    of view. In separate cases where explicit comparisons were made, programs using
    the algorithms presented in this book cost less than their large-machine counterparts.
    Other tests of execution times for algebraic eigenvalue problems, roots of a function
    and variable function minimisation showed that the eigenvalue algorithms were
    by and large ''slower'' than those recommended for large machines, while the other
    problems were solved with notable efficiency by the compact algorithms. That ''small''
    programs may be more frugal than larger, supposedly efficient, one based on different
    algorithms to do the same job has at least some foundation in the way today''s
    computers works.


    Since the first edition of this work appeared, a large number and variety of inexpensive
    computing machines have appeared. Often termed the ''microcomputer revolution'',
    the widespread availability of computing power in forms as as diverse as programmable
    calculators to desktop workstations has increased the need for'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Compact numerical methods for computers


    suitable software of all types, including numerical methods. The present work
    is directed at the user who needs, for whatever reason, to program a numerical
    method to solve a problem. While software packages and libraries exist to provide
    for the solution of numerical problems, financial, administrative or other obstacles
    may render their use impossible or inconvenient. For example, the programming
    tools available on the chosen computer may not permit the software to be used.


    Firstly, most machines are controlled by operating systems which control (and
    sometimes quite for) the usage of memory, storage, and other machine resources.
    In both compilation (translation of the program into machine code) and execution,
    a smaller program will make smaller demands on resources than a larger one. On
    top of this, the time of compilation is usually related to the size of the source
    code.


    Secondly, once the program begins to execute, there are housekeeping operations
    which must be taken of:


    +   (i) to keep programs and data belonging to one task or user separate from
    those belonging to others in a time-sharing environment, and

    (ii) to access the various parts of the program and data within the set of resources
    allocated to a single user.


    Studies conducted some years ago by Dr Maurice Cox of the UK National Physical
    Laboratory showed that (ii) requires about 90% of the time a computer spends with
    a scientific computation. Only about 10% of the effort goes to arithmetic rhythm.
    This mix of activity will greatly vary with the machine and problem under consideration.
    However, it is not unreasonable that a small program can use simpler structures,
    such as address maps and decision tables, than a larger routine. It is tempting
    to suggest that the computer may be able to perform useful work with a small program
    deciding what to do with a larger one. Gathering specific evidence to support
    such conjectures requires the fairly tedious work of benchmarking. Moreover, the
    results of the exercise are only valid as long as the machine, operating system,
    programming language translators and programs remain unchanged. Where performance
    is critical, as in the case of real-time computations, for example in air traffic
    control, then benchmarking will be worthwhile. In other situations, it will suffice
    that programs operate correctly and sufficiently quickly that the user is not
    inconvenienced.


    This book is one of the very few to consider algorithms which have very low storage
    requirements. The first edition appeared just as programmable calculators and
    the first micro were beginning to make their presence felt. These brought to the
    user''s desk a quantum improvement in computational power. Comparisons with the
    earliest digital computers showed that even a modest computer was more powerful.
    It should be noted, however, that the programmer did not have to handle all the
    details of arithmetic and data storage, as on the early computers, thanks to the
    quick release of programming language translators. There is unfortunately still
    a need to be vigilant for errors in the floating-point arithmetic and the special
    function routines. Some aids to such checking are mentioned later in §2.


    Besides the motivation of cost savings and the desire to use an available and'
  merge: -1
