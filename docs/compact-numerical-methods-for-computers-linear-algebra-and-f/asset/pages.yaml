    The above discussion has assumed a model of floating-point arithmetic which may
    be an additive form in that powers of radix are added together and the entire
    sum multiplied by some power of radix (the exponent) to provide the final quantity
    representing the desired real number. This representation may or may not be exact.
    For example, the fraction 1/3 cannot be represented in additive binary (radix
    2) floating-point arithmetic. While there are other models of floating-point arithmetic,
    the additive form is the most common, and is used in the IEEE binary and radix-free
    floating-point arithmetic standards. (The March, 1981, issue of IEEE Computer
    magazine, volume 3, number 4, pages 51–86 contains lucid description of the binary
    standard and its motivations.)


    If we are concerned with absolute upper and lower bounds on computed quantities,
    interval arithmetic is possible, but not commonly supported by programming languages
    (e.g. Pascal SC (Kulisch 1987)). Despite the obvious importance of assured bounds,
    the perceived costs of using interval arithmetic have largely prevented its widespread
    use.


    The development of standards for floating-point arithmetic has the great benefit
    that results of similar calculations on different machinery be the same. Furthermore,
    manufacturers have been prompted to develop hardware implementations of these
    standards, notably the Intel 80 ×87 family and the Motorola 68881 of circuit devices.
    Hewlett-Packard implemented a decimal version of the IEEE 858 standard in their
    HP 71B calculator.


    Despite this, there continues to be confusion and misinformation concerning floating-point
    arithmetic. Because an additive decimal form of arithmetic can represent fractions
    such as exactly, and in any general input-output conversion errors, developers
    of software products using such arithmetic (usually in binary coded decimal or
    BCD form) have been known to claim that it has ''no round-off error'', which is
    patently false. I personally prefer decimal arithmetic, so that data entered into
    a calculation can be represented exactly, so that a display of the stored raw
    data reproduces the input familiar to the user. Nevertheless, the differences
    between good implementations of floating-point arithmetic, whether binary or decimal,
    are relatively substantive.


    While the subject of machine arithmetic is still warm, note that the mean of two
    numbers may be calculated to be smaller or greater than either! An example in
    four-figure decimal arithmetic will serve as an illustration of this.


