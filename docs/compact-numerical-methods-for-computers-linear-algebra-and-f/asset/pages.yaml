  md: "# The symmetric positive definite matrix again\n\nthen dividing through diagonal\
    \ elements. This leaves\n\n```\n$$$Lx = f^T$$ (8.5)\n```\n\nthat is, the solution\
    \ to the set of equations.\nAnother way to look at this procedure is as a series\
    \ of elementary row operations (such as Wilkinson 1965) designed to replace the\
    \ pth column of an $n$ by $n$ matrix $A$ with the pth column of the unit matrix\
    \ of order $n$, that is, $e_p$. To accomplish this, the pth column of $A$ must\
    \ be divided by $A_{pp}$ and $A_{ip}$ then the resulting p row subtracted from\
    \ every row $i$ for $i \\neq p$. For this to be possible, of course, $A_{pp}$\
    \ cannot be zero.\n\nA combination of $n$ steps can be used to solve sets of linear\
    \ equations. This will build-up of rounding errors, some form of pivoting must\
    \ be used. This will involve one $i$ for a variety of schemes for recording pivot\
    \ positions or else will require explicit interchanges. There are naturally some\
    \ trade-offs here between simplicity of the algorithm and possible efficiency\
    \ of execution, particularly if the set of equations is presented so that many\
    \ row exchanges are needed.\n\nBy using the Gauss-Jordan elimination we avoid\
    \ the programming needed to perform the back-substitution in the Gauss elimination\
    \ method. The price we pay for this is that the amount of work rises from roughly\
    \ $n^2/3$ operations for a single equation to $n^2$ as $n$ becomes larger (Ralston\
    \ 1965 p 401). For small $n$ the Gauss-Jordan algorithm may be more efficient\
    \ depending on factors such as implementation and machine architecture. In particular,\
    \ it is possible to arrange to overwrite the $i$th column of the working matrix\
    \ with the corresponding column of the inverse. That is, the operations of equations\
    \ (8.1) and (8.4) with 1 replaced by $i$ give elimination formula\n\n```\n$$\\\
    tilde{A}_{ij} = A_{ij}/A_{ii}$$\\n$\\tilde{A}_{kj} = A_{kj} - A_{ki}(\tilde{A}_{ij})$$\\\
    \ (8.1a)\n(8.4a)\n```\n\nfor $j=1, 2, \\dots, n, k=1, 2, \\dots, n$ with $k \\\
    neq i$, with the tilde representing the transformed matrix. However, these operations\
    \ replace column $i$ with $e_i$, the unit column of the matrix $b$ information\
    \ which need not be stored. The right-hand side $b$ is transformed according to\n\
    \n```\n$$\\tilde{b}_i = b_i/A_{ii}$$\\n$\\tilde{b}_k = b_k - b_i(A_{ki}/A_{ii})$$\\\
    \ (8.1b)\n(8.3a)\n```\n\nfor $k=1, 2, \\dots, i$ with $k \\neq i$. To determine\
    \ the inverse of a matrix, we could solve the linear-equation problems for the\
    \ successive columns of $I$. Now all columns $e_j$ will be unerated by (8.1b)\
    \ and (8.3a). At the ith stage of the reduction, $e_i$ can be substituted in column\
    \ $i$ of the matrix by storing the pivot $A_{ii}$, substituting the value of 1\
    \ in this diagonal position, performing the division implied in (8.1a). Row $i$\
    \ of the working matrix now contains the multipliers $\tilde{A}_{ij} = (A_{ij}/A_{ii})$.\
    \ By performing (8.4a) row-wise, each value can be saved, a zero substituted from\
    \ $e_i$, and the elements of $A_{kj}, j=1, 2, \\dots, n$, computed."
