  md: '# 254 Compact numerical methods for computers


    ''border'' were designed to give difficulties to a specialised algorithm for matrices
    of this form in which I have been interested from time to time.


    # Diagonal matrix


    ```

    $A_{ii} = i$\n$A_{ij} = 0 \quad \text{for } i \neq j.$

    ```


    This matrix permits solutions to eigenvalue and linear-equation problems to be
    computed trivially. It is included in this set because I have known several programs
    to fail to run correctly when confronted with it. Sometimes programs are unable
    to solve trivial problems because their designers feel them ''too easy''. Note
    that the ordering is ''wrong'' for algorithms 13 and 14.


    # W+ with matrix


    ```

    $A_{ij} = [n/2] + 1 - \min(i, n-i+1) \quad \text{for } i = 1, 2, \dots, n$\n$A_{i,i+1}
    = A_{i+1,i} \quad \text{for } i = 1, 2, \dots, (n-1)\n$A_{ij} = 0 \quad \text{for
    } |j-i| > 1$

    ```


    where [b] is the largest integer less than or equal to b. The W+ matrix (Wilkinson
    1965, p 308) is normally given odd order. This matrix then has several pairs of
    close eigenvalues despite the fact that no superdiagonal element is small. Wilkinson
    points out that the separation between the two largest eigenvalues is of the order
    of $(n!)^{-2}$ so that the power method will be unable to separate them unless
    $n$ is very small.


    # Wilkinson W matrix


    ```

    $A_{ij} = [n/2] + 1 - i \quad \text{for } i = 1, 2, \dots, n$\n$A_{i,i+1} = A_{i+1,i}
    \quad \text{for } i = 1, 2, \dots, (n-1)\n$A_{ij} = 0 \quad \text{for } |j-i|
    > 1$

    ```


    where [b] is the largest integer less than or equal to b. For odd order, this
    matrix has eigenvalues which are pairs of equal magnitude but opposite sign. The
    magnitudes of these are very close to some of the corresponding W+ matrix.


    # Ones


    ```

    $A_{ij} = 1 \quad \text{for all } i,j.$

    ```


    This matrix is singular. It has only rank one, that is, $(n-1)$ zero eigenvalues.


    The matrices described here may all be generated by the Pascal procedure MATRIXIN.PAS,
    which is on the software diskette. This procedure also allows for keyboard entry
    of matrices.'
