  md: '# Compact numerical methods for computers


    cannot be acquired simply and must, therefore, be written in-house. There are
    also a number of portable computers now available. This text is being entered
    on a Tandy Radio Shack TRS-80 Model 100, which is only the size of a large book
    and is powered by four penlight batteries.


    Users of the various types of machines mentioned often do not have much choice
    as the programming tools available. On ''borrowed'' computers, one has to put
    up with the compilers and interpreters by the user who has paid for the resource.
    In practice, I have, until recently, mostly programmed in BASIC, despite its limitations,
    since it has at least worked on most of the machines available to me.


    Another group of users of the material in this book is likely to be software developers.
    Some scenarios which have occurred:


    +   - software being developed in a particular computing environment (e.g. LISP
    for artificial intelligence) and a calculation is required for which suitable
    off-the-shelf routines are not available;

    -standard routines exist when linked into the package cause the executable code
    to be too large for the intended disk storage or memory;

    -standard routines exist, but the coding is incompatible with the compiler or
    interpreter at hand.


    It is worth mentioning that programming language standards have undergone considerable
    development in the last decade. Nevertheless, the goal of portable source codes
    of numerical methods is still won by careful and conservative programming practices.


    Because of the emphasis on the needs of the user to program the methods, there
    is considerable concern in this book to keep the length and complexity of the
    algorithms to a minimum. Ideally, I like program codes for the algorithms to be
    no longer than a page of typed material, and at worst, less than three pages.
    This makes it feasible to implement the algorithms in a single work session. However,
    even this level of effort is to be considered tedious and is unnecessary if the
    code can be provided in a suitable form. Here we provide source code in Turbo
    Pascal for the algorithms in this book and for the driver and support routines
    to run them (Turbo Pascal version 3.01a).


    The philosophy behind this book remains one of working with available tools rather
    than complaining that better ones exist, albeit not easily accessible. This should
    not lead to complacency in dealing with the machine but rather to an active awareness
    of every feature of the system. A number of these can be checked by using programming
    devices which force the system to reveal itself in sight every error problem when
    a program fails to produce expected results. In most cases programmer error is
    to blame, but I have encountered at least one system error in each of the systems
    I have used seriously. For instance, trigonometric functions are usually computed
    by power series approximation. However, these approximations have validity over
    specified domains, usually [0, π/4] or [0, π/2] (see Abramowitz and Stegun 1965,
    p 76). Thus the argument of the function must be transformed to'
