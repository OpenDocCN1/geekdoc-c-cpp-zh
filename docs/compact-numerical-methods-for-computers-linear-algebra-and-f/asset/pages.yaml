    # 7.1. THE CHOLESKI DECOMPOSITION


    When the matrix A is symmetric and positive definite (see discussion below for
    definition), it is possible to perform (without pivoting) the symmetric decomposition-


    ```

    $A = LL^T = R^T R$ (7.1)

    ```


    where


    ```

    $L = R^T$ (7.2)

    ```


    is a lower-triangular matrix. In fact, it is also possible to perform Gauss elimina-tion
    in a symmetric fashion for symmetric positive definite matrices without pivoting
    for stability (see Dahlquist and Björck 1974, pp 162–44).


    The Choleski algorithm (Wilkinson 1965) is derived directly from (7.1), that is


    ```

    $A_{ij} = \sum_{k=1}^{\min(i,j)} L_{ik}L_{kj} = \sum_{k=1}^{\min(i,j)} L_{ik}L_{jk}.$
    (7.3)

    ```


    Note that the summation runs only from 1 to the minimum of $i$ and $j$ due to
    the triangular nature of L. Thus we have


    ```

    $A_{11} = L_{11}^2$ (7.4)

    ```


    so that


    ```

    $L_{11} = (A_{11})^{1/2}.$ (7.5)

    ```


    Furthermore


    ```

    $A_{i1} = L_{i1}L_{11}$ (7.6)

    ```


    so that we obtain


    ```

    $L_{11} = A_{11}/L_{11}.$ (7.7)

    ```


    Consider now the $m$th column of L which is defined for $i > m$ by


    ```

    $L_{mm} = (A_{im} - \sum_{k=1}^{m-1} L_{ik}L_{mk})$ (7.8)

    ```


    with the diagonal element determined by setting $i = m$. It is straightforward
    to see that every element in the right-hand side of equation (7.8) comes from
    columns 1, 2, $\dots, (m-1)$ of **L** or from column $m$ of **A**. Since (7.5)
    and (7.7) define the first column of **L**, we have a stepwise procedure for computing
    its remaining columns, and furthermore this can be arranged so that L overwrites
    A'
