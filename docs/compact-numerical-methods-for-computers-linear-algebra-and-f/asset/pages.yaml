    # 19.4. EIGENSOLUTIONS BY MINIMISING THE RAYLEIGH QUOTIENT


    Consider two symmetric matrices $A$ and $B$ which is also positive definite. The
    Rayleigh quotient defined by


    ```

    $R = x^TAx/x^TB \quad (19.28)$

    ```


    then takes on its stationary values (that is, the values at which the partial
    derivatives with respect to the components of $x$ are zero) at the eigensolutions
    of $Ax = Bc$.


    ```

    $(2.63)$

