    In designing the particular forms of the algorithms which appear, a conscious
    effort has been made to avoid the requirement for many tolerances. machine-dependent
    quantities are unfortunately needed (they can in some cases be calculated by the
    program but this does lengthen the code), but as far as possible, especially in
    determining iterative algorithms have converged, devices are used which attempt
    to ensure that many digits are determined as the machine is able to store. This
    may lead to programs continuing to execute long after answers have been obtained.
    However, I prefer to be on the side of excess rather than leave results wanting
    in digits. Typically, the convergence test requires that the last and present
    iterates be identical to the precision of the machine by means of a test such
    as


    ```

    if x + delta + offset = x + offset then halt;

    ```


    where offset is some modest number as 10. On machines which have an accumulator
    with extra digits, this type of test may never be satisfied, and must be replaced
    by


    ```

    y: = x + delta + offset;

    z: = x + offset;

    y if y = z halt;

    ```


    The ''tolerance'' in this form of test is provided by the offset: within the computer
    the representations of y and z must be equal to halt execution. The simplicity
    of this type of test usually saves code though, as mentioned, at the possible
    expense of execution time.


