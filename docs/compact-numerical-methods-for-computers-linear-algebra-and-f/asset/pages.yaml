    $$\sum_{k=1}^n A_{ik}x_k = b_i \quad \text{for } i = 2, 3, \dots, n \quad (6.7)$

    ```


    where


    ```

    $A''_{ik} = A_{ik} - A_{1k}A_{i1}/A_{11} \n= A_{ik} - m_1A_{1k} \quad (6.8)$

    ```


    and


    ```

    $b''_i = b_i - b_1A_{i1}/A_{11} = b_i - m_1b_1 \quad (6.9)$

    ```


    But


    ```

    $A''_{i1} = A_{i1} - A_{11}A_{i1}/A_{11} = 0 \quad (6.10)$

    ```


    so that we have eliminated all but the first element of column 1 of **A**. This
    process can be repeated with new equations 2, 5, $\dots, n$ to eliminate all the
    first two elements of column 2. The element $A_{12}$ is unique because equation
    1 is not a participant in this set of eliminations. By performing $(n-1)$ sets
    of eliminations we arrive at an upper-triangular matrix **R**. This procedure
    can be thought of as an ordered sequence of multiplications by elementary matrices.
    The elementary matrix $A_{ij}$ will be denoted $M_{ij}$ and is defined by


    where


    ```

    $M_{ij} = A_{ij}/A_{jj} \quad (6.11)$

    ```


    (the elements in **A** are all original, not values) and where $\Delta_{ij}$ is
    the matrix having I in the position $ij$ and zeros elsewhere, that is


    ```

    $$\Delta_{ij} = \delta_{iv}\delta_{js} \quad (6.13)$

    ```


    which uses Kronecker delta, $\delta_{ij} = 1$ for $i=j$ and $\delta_{ij} = 0$
    otherwise. The effect on $M_{ij}$ when pre-multiplying a matrix **A** is to replace
    the ith row with the difference between the ith row and $m_{ij}$ times the ith
    row, that is, if


    ```

    **A''** = **M****A** \quad (6.14)$

    ```


    then


    ```

    $A''_{ik} = A_{rk} \quad \text{for } r \neq i \n= A''_{ik} = A_{ik} - m_{ij}A_{jk}
    \quad (6.15) \quad (6.16)$

    ```


    with $k=1, 2, \dots, n$. Since $A_{jk} = 0$ for $k < j$, for computational purposes
    one need only $k=j, (j+1), \dots, n$. Thus


    ```

    $**R** = (\prod_{i=n}^1 \prod_{i=j+1}^n M_{ij})**A** \quad (6.17)$

    ```


    ```

