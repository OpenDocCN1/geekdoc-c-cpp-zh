  md: '# Handling larger problems


    products matrix are


    ```

    $(\mathbf{A}^T \mathbf{A})_{ii}^{-1} = \sum_{j=1}^{n} (V_{ij}S_j^*V_{ij})\nn=
    \sum_{j=1}^{n} (V_{ij}S_j^*)^2. \quad (4.35)$

    ```


    Thus, the relevant information for the standard errors is obtained by quite simple
    row sums over the **V** matrix from a singular-value decomposition. When the original
    **A** matrix is rank deficient, and we decide (via the tolerance for zero used
    to select ''non-zero'' singular values) that the rank is $r$, the summation above
    reduces to


    ```

    $(\mathbf{A}^T)_{ii}^{-1} = \sum_{j=1}^{r} (V_{ij}/S_j)^2. \quad (4.36)$

    ```


    However, the meaning of a standard error in the rank-deficient case requires careful
    consideration, as the standard error will increase very sharply as small singular
    values are included in the summation given in (4.36). I usually refer to the dispersion
    measures computed via equations (4.33) through (4.36) for rank $r < n$ cases as
    ''standard errors under the condition that the rank is 5(or whatever value $r$
    currently has) More discussion of these issues is presented in Searle (1971) under
    the topic ''estimated functions'', and in various sections of Belsley, Kuh and
    Welsch (1980).'
