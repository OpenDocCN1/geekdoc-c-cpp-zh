  md: '# Compact numerical methods for computers


    Now if $\mathbf{q}_i$ is chosen to be the negative gradient


    ```

    $\mathbf{q}_i = -\mathbf{g}_i$

    ```


    and $\mathbf{t}_i^T\mathbf{H}$ is substituted from (15.18), then we have


    ```

    $z_{ii} = \mathbf{g}_i^T(\mathbf{g}_{i+1}-\mathbf{g}_i)/t_i^T(\mathbf{g}_{i+1}-\mathbf{g}_i)$\n$=
    \mathbf{g}_i^T\mathbf{t}_i/y_i$.

    ```


    Moreover, if accurate lines have been performed at each of the $(i-1)$ previous
    steps, the function $S$ (still the quadratic form (15.11)) has been minimised
    on a hyperplane spanned by the search directions $\mathbf{t}_j, j=1, 2, \dots$,
    $(i-1)$, and $\mathbf{g}_i$ is orthogonal to each of these directions. Therefore,
    we have


    ```

    $z_{ij} = \mathbf{0} \quad \quad j < (i-1)$

    ```


    ```

    $z_{i,i-1} = \mathbf{g}_i^T(\mathbf{g}_i-\mathbf{g}_{i-1})/t_{i-1}^T(\mathbf{g}_i-\mathbf{g}_{i-1}).$

    ```


    Alternatively, using


    ```

    $\mathbf{t}_{i-1} = -\mathbf{g}_i + \sum_{j=1}^{i-2} z_{ij}\mathbf{t}_j$

    ```


    which is a linear combination of $\mathbf{g}_j, j=1, 2, \dots, (i-1)$, we obtain


    ```

    $z_{ij} = \mathbf{g}_i^T(\mathbf{g}_i-\mathbf{g}_j)/t_j^T(\mathbf{g}_i-\mathbf{g}_j)-\mathbf{g}_i$

    ```


    ```

    $= \mathbf{g}_i^T\mathbf{g}_j^T-\mathbf{g}_i$.

    ```


    by virtue of the orthogonality mentioned above.


    As in the case of variable metric algorithms, the formulae applied in some chevalier
    fashion to the minimisation of general nonlinear functions. The formula (16.8),
    (16.10) and (16.11) are now no longer equivalent. For reference, these will be
    associated with the names: Beale (1972) and Sorenson (1969); Polak and Ribiere
    (1969) for (16.10); and Fletcher and Reeves (1964) for (16.11). All of these retain
    the space-saving two-term recurrence which makes the conjugate gradients algorithms
    so frugal of storage.


    In summary, the conjugate gradients algorithm proceeds by setting


    ```

    $\mathbf{t}_i = -\mathbf{g}(\mathbf{b}_i)$

    ```


    and


    ```

    $\mathbf{t}_i = z_{i,i-1}\mathbf{t}_{i-1} - \mathbf{g}_i(\mathbf{b}_i)$

    ```


    with


    ```

    $\mathbf{b}_{i+1} = \mathbf{b}_i + k_i\mathbf{t}_i$

    ```


    where $k_i$ is determined by a linear search for a ''minimum'' of $S(\mathbf{b}_i+k_i\mathbf{t}_i)$
    with respect to $k_i$.


    # 16.2. A PARTICULAR CONJUGATE GRADIENTS ALGORITHM


    A program to use the ideas of the previous section requires that a choice be made
    of $(a)$ a recurrence formula to generate the search directions, and $(b)$ a linear
    search.'
