  md: '# Conjugate gradients method in linear algebra


    $v = (\mathbf{t}^T\mathbf{At})(\mathbf{x}^T\mathbf{Bx}) - (\mathbf{x}^T\mathbf{Ax})(\mathbf{t}^T\mathbf{Bt})
    \quad (19.39)$


    $w = (\mathbf{x}^T\mathbf{At})(\mathbf{x}^T\mathbf{Bx}) - (\mathbf{x}^T\mathbf{Ax})(\mathbf{x}^T\mathbf{Bt}).
    \quad (19.40)$


    Note by symmetry


    $\mathbf{x}^T\mathbf{At} = \mathbf{t}^T\mathbf{Ax} \quad (19.41)$


    and


    $\mathbf{x}^T\mathbf{Bt} = \mathbf{t}^T\mathbf{Bx}. \quad (19.42)$


    Therefore, only six inner products are needed in the evaluation of $u$, and $w$.\nWe
    are


    $(\mathbf{x}^T\mathbf{Ax}) \quad (\mathbf{x}^T\mathbf{At}) \quad and \quad (\mathbf{t}^T\mathbf{At})$


    $(\mathbf{x}^T\mathbf{Bx}) \quad (\mathbf{x}^T\mathbf{Bt}) \quad and \quad (\mathbf{t}^T\mathbf{Bt}).$


    The quadratic equation (19.37) has two roots, of which only one will correspond
    to\na minimum. Since


    we get


    $$\psi(k) = 0\cdot5D^2(dR/dk) = uk^2 + vk + w \quad (19.43)$


    $$\frac{d\psi}{dk} = 0\cdot5D^2\frac{d^2R}{dk^2} + D(\frac{dR}{dk})(\frac{dR}{dk})
    = 2uk + v. \quad (19.44)$


    At either of the roots of (19.37), this reduces to


    $0\cdot5D^2(dR/dk^2) = 2uk + v \quad (19.45)$


    so that a minimum has been found if $d^2R/dk^2$ is positive, or


    $2uk + v > 0. \quad (19.46)$


    Substitution of both roots from the quadratic equation formula shows that the\ndesired
    root is


    $k = [-v + (v^2-4uw)^{1/2}]/(2u). \quad (19.47)$


    If $v$ is negative, (19.47) can be used to evaluate the root. However, to avoid
    digit\ncancellation when $v$ is positive,


    $k = -2w/[v + (v^2-4uw)^{1/2}] \quad (19.48)$


    should be used. The linear search subproblem has therefore been resolved in the\nstraightforward
    manner in this particular case.


    The second aspect of particularising the conjugate gradients algorithm to the\nminimisation
    of the Rayleigh quotient is the generation of the next conjugate\ndirection. Note
    that the gradient of the Rayleigh quotient $\mathbf{x}$ is given by


    $$\mathbf{g} = 2(\mathbf{Ax}-\mathbf{RB}\mathbf{x}^T)/(\mathbf{x}^T\mathbf{B}x)
    \quad (19.49)$


    and the local Hessian by


    $$\mathbf{H} = 2(\mathbf{A}-\mathbf{RB}-\mathbf{Bx}^T-\mathbf{gx}^T\mathbf{B})/(\mathbf{x}^T\mathbf{Bx}).
    \quad (19.50)$'
