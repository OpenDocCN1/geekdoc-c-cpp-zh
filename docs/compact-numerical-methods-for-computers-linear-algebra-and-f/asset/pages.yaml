    $e_1 \ge e_2 \ge \dots \ge e_n \quad (19.31)$


    then the minimum value of $R$ is $e_n$ and occurs when $x$ is proportional to
    $\phi_n$. The maximum value is $e_1$. Alternatively, this value can be obtained
    via minimisation of $-R$. Furthermore, if $\mathbf{B}$ is the identity, minimising
    the Rayleigh quotient


    ```

    $R = \mathbf{x}^T(\mathbf{A} - k\mathbf{k}_l)\mathbf{x}/\mathbf{x}^T\mathbf{x}
    \quad (19.32)$

    ```


    While any of the general methods for minimising a function may be applied to this
    problem, concern for storage requirements suggests the use of the conjugate gradients
    procedure. Unfortunately, the general-purpose algorithm 22 may converge very slowly.
    This is due to (a) the inaccuracy of the linear search, and (b) to lack of conjugacy
    between the search directions $t_j, j=1, 2, \dots, n$. Both these problems are
    exacerbated by the fact that the Rayleigh quotient is homogeneous of degree zero,
    which means that the Rayleigh quotient takes the same value for any $Cx$, where
    $C$ is non-zero constant. This causes the Hessian of the Rayleigh quotient to
    be singular, violating the conditions normally required for the conjugate gradients
    algorithm. Bradbury and Fletcher (16) address this difficulty by setting the unity
    element of magnitude in the current eigenvector approximation and adjusting the
    other elements accordingly. Adjustment is made at each iteration. However, Geradin
    (1971) has tackled the problem more directly, that is, by examining the Hessian
    itself and attempting to construct search directions which are mutually conjugate
    with respect to it. This treatment, though surely not the last word on the subject,
    is essentially repeated here. The implementation details are my own.


    First, consider the linear search subproblem, in the current case can be solved
    analytically. It is desired to minimize


    ```

    $R = (\mathbf{x}+kt)^T\mathbf{A}(\mathbf{x}+kt)/(\mathbf{x}+kt)^T\mathbf{B}(\mathbf{x}+kt)
    \quad (19.33)$

    ```


    with respect to $k$. For convenience this will be rewritten


    ```

    $R = N(k)/D(k) \quad (19.34)$

    ```


    with $N$ and $D$ used to denote the numerator and denominator, respectively. Differentiating
    with respect to $k$ gives


    ```

    $dR/dk = 0=(DN/dk - NdD/dk)/D^2. \quad (19.35)$

    ```


    Because of the positive definiteness of $\mathbf{B}$, $\mathbf{D}$ can never be
    zero unless


    ```

    $\mathbf{x}+kt=0 \quad (19.36)$

    ```


    Therefore, ignoring this last possibility, we set the numerator of expression
    (19.35) to zero to obtain the quadratic equation


    ```

