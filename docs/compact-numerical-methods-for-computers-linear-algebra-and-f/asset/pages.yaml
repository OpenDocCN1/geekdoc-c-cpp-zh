  md: '# The Choleski decomposition


    we set $L_{im}=0$ for $i \ge m$. This is a relatively trivial modification to
    the decomposition algorithm. $L_{mm}$ is, of course, found as the square root
    of a quantity which arises by subtraction, and in practice this quantity may be
    slightly negative due to rounding error. In one policy adopted, here is possible
    to proceed with the decomposition, setting all $L_{im}=0$ for $i \ge m$ even if
    this quantity is negative, assuming the matrix **A** is not non-negative, for
    instance if it has been formed as a sum-of-squares and cross-products matrix in
    a least-squares regression calculation, this is not as dangerous as it appears.
    Furthermore the decision to continue the decomposition in $\S77.1 when the computed
    square of $L_{mm}$ is positive, rather greater than some tolerance for zero, has
    been made after the following considerations.


    +   (i) The decomposition is valid to the precision in the arithmetic being used.
    When diagonal elements arise in $L$ they represent linear dependencies in the
    set of equations for which a solution is to be found, and of the infinity of solutions
    which such is to be acceptable. However, in recognition of the possibility that
    there may be a near-linear dependence, it does not seem to presume a small number
    is zero, since the Choleski decomposition, unlike the singular-value decomposition
    (algorithm 1), does not allow the user to decide at the time solutions are computed
    with small numbers to be assumed zero.

    (ii) The size of the computed square of $L_{mm}$ is dependent on the scale of
    the matrix A. Unless the tolerance for zero is proportional to a norm of **A**,
    its application has an effect which is not consistent from one problem to another.


    If the computed square of $L_{mm}$ is non-positive, the $mth$ column of **L**
    is therefore set to zero


    ```

    $L_{im}=0 \quad \quad i=m, (m+1), \dots, n. \quad \quad (7.29)

    ```


    The forward- and back-substitutions to solve the linear equations


    ```

    $Ax=b \quad \quad \quad \quad \quad (2.2)

    ```


    are unfortunately not now possible since division zero occurs. However, the equations
    are *consistent*, that is, if $b$ belongs to the column space of **A**, at least
    one solution $x$ exists (see, for example, Finkbeiner 1966, p 98).


    Consider the forward-substitution to solve


    ```

    $Lv=b \quad \quad \quad \quad \quad \quad \quad \quad (7.30)

