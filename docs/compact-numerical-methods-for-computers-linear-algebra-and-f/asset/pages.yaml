  md: '# One-dimensional problems


    Since local maxima also zero the derivative of the function S(b), such solutions
    will have to be checked either by ensuring the second derivative S''''(b) is positive
    or by examining the values of the function at points near the supposed minimum.


    When the derivative of S is not available or is expensive to compute, a method
    for minimisation along a line is needed which depends only on function values.
    Obviously, any method that evaluates the function at a finite number of points
    is not guaranteed to detect deep, narrow wells in the function. Therefore, some
    assumption must be made about the function on the interval [u, v]. Here it will
    be assumed that the function S(b) is unimodal in [u, v], that is, there is only
    one stationary value (either a maximum or a minimum) in the interval. In the case
    where the stationary value is a maximum, the minimum of the function will be either
    at u or v.


    Given that S(b) is unimodal in [u, v], a grid or interval-search could be used
    to decrease the size of the interval. For instance, the function values can be
    computed for each of the points


    ```

    $b_j = u + jh \quad j = 0, 1, 2, \dots, n$

    ```


    ```

    $h = (v - u)/n$.

    ```


    If the smallest of values is S(b), then the minimum lies in the interval $[b_{j-1},
    b_{j+1}]$. Equation (13.3) can be used to compute the endpoints of the interval.
    If S(b_0) or S(b_n) is the smallest value, then the interval is $[u, b_1]$ or
    $[b_{n-1}, v]$, though for simplicity this could be left out of a program. The
    search can be repeated, noting, of course, that the function values at the endpoints
    of the interval have already been computed.


