    ```


    (10.41)


    so that rotation causes $A^{(k+1)}$ to be ''more diagonal'' than $A^{(k)}$.


    Specification of the order in which the off-diagonal elements are to be made zero
    defines a particular variant of the Jacobi algorithm. One of the simplest is to
    take the elements in row-wise fashion: (1, 2), (1, 3), ..., (1, n), (2, 3), (2,
    4), ..., (2, n), ..., (n-1, n). Such cyclic algorithms have not been proven to
    converge in general, except in the case where the angle of rotation $\phi$ is
    constrained so


    ```

    $-\pi/4 \le \phi \le \pi/4$.

    ```


    Similarly to the orthogonalisation algorithm of §3.3, the difficulty lies in demonstrating
    that the ordering of the diagonal elements is stable. For $\phi$ restricted as
    in (10.42), Forsythe and Henrici (1960) have carried out the complicated proof,
    and most authors (Wilkinson 1965, Ruthauser 1966, Schwarz et al 1973, Ralston
    1965) discuss angle calculations that satisfy the restriction (10.42). In fact,
    among the variety of tests available on numerical linear algebra, the author has
    noted neither (Fröberg 1965) with the calculations based on equations of (10.38),
    (10.39) and (3.22)–3.27). The advantage of the calculation given here is that
    the eigenvalues, which are produced as the diagonal elements of the matrix is
    the limit of the sequence $A^{(k)}$, are ordered from most positive to most negative.
    Most applications that require eigenvalues also require them ordered in some way
    and the ordering that the current process yields the one I have invariably been
    required to produce. No extra program code is needed to order the eigenvalues
    and eigenvectors and there may be some savings in execution time as well.


    We have already noted in chapter 3 the research of Booker (1985) relating to the
    convergence of the cyclic Jacobi method with the ordering angle calculation. Jacobi
    (1846) did not use a cyclic pattern, but chose to zero the largest off-diagonal
    element in the matrix. This process has generally been inappropriate for automatic
    computation due to the time required for the search before each plane rotation.
    However, for comparison purposes I modified a BASIC precursor of algorithm 14.
    The changes made were only as many as were needed to obtain the zeroing of the
    largest off-diagonal element in the present matrix, and no attempt was made to
