  md: "# Direct search methods\n\nare chosen be unfortunately difficult to state.\
    \ Quite obviously any starting step should ideally alter the function. In many\
    \ ways this is an (n+1)-fold repetition of the necessity of good initial estimates\
    \ for the parameters as in $12.2.\n\nMore recently workers have tried to improve\
    \ upon the Nelder-Meade strategies, for example Craig et al (1980). A parallel\
    \ computer version reported by Virginia Torczson seems to promise for the solution\
    \ of problems in relatively large numbers of parameters. We have been content\
    \ to stay close to the original Nelder-Mead procedure, though we have simplified\
    \ the method for ranking the vertices of the polytope, in particular the selection\
    \ of the point $b_N$.\n\n# Algorithm 19. A Nelder–Mead minimisation procedure\n\
    \n```\nprocedure nmin(n: integer; [the number of parameters in the function to\
    \ be minimized]\n  var Bvec,X: vector; [the parameter values in input (Bvec) and\
    \ output (X) from minmethod]\n  var Fin: real; [minimum function value]\n  Workdata:\
    \ probate; [user defined data areas]\n  var fail: boolean; [true if method has\
    \ failed]\n  var int: real; [user-initialized convergence tolerance]\n  zero:\
    \ zero on entry if it is not set.)\n```\n\n(alg19.pas) Nelder Mead minimisation\
    \ of a function of n parameters.\nOriginal method by J. Nelder and R. Mead, Computer\
    \ Journal, vol 7, 1965 pp. 308-313.\nModification as per Nash N and Walker-Smith\
    \ M, Nonlinear Parameter Estimation: An Integrated System in BASIC, Marcel Dekker:\
    \ New York, 1987.\n\n+   Modifications are principally\n- in the computation of\
    \ the \"next to highest\" vertex of the current polytope,\n- in the verification\
    \ that the shrink operation truly reduces the size of the polytope, and\n- in\
    \ form of calculation of some of the points.\n\nWe further recommend an axial\
    \ search to verify convergence. This can be called outside the present code. If\
    \ placed in-line, the code can be restarted at STEP3.\nIf space is at a vertex,\
    \ X is not needed except to return final values of polytope.\n\n```\nconst\nPol\
