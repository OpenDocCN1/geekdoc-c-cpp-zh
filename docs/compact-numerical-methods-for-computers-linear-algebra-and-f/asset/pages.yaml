  md: '# Chapter 6


    # LINEAR EQUATIONS—A DIRECT APPROACH


    # 6.1. INTRODUCTION


    So far we have been concerned with solving linear least-squares problems. Now
    the usually simpler problem of linear equations will be considered. Note that
    a program designed to solve least-squares problems will give solutions to linear
    equations. The residual sum of squares will be zero if the equations are consistent.
    While this is a useful way to attack sets of solutions which are suspected to
    possess singular coefficient matrices, since the singular-value decomposition
    permits such to be identified, in general the computational cost will be too high.
    Therefore this chapter will examine a direct approach to solving systems of linear
    equations. This is a variant of the elimination method taught to students in secondary
    schools, but the advent of automatic computation has changed only its form, showing
    its substance to be solid.


    # 6.2. GAUSS ELIMINATION


    Let us now look at this approach to the solution of equations (2.2). First note
    that if A is upper-triangular so $A_{ij}=0$ if $i>j$, then it is easy to solve
    for $x$ by a back-substitution, that is


    ```

    $x_n = b_n/A_{nn}$ (6.1)

    ```


    ```

    $x_{n-1}=(b_{n-1}-A_{n-1,n}x_n)/A_{n-1,n}$ (6.2)

    ```


    and generally


    ```

    $x_i=(b_i-\sum_{k=j+1}^{n} A_{ik}x_k)/A_{ij}$ (6.3)

    ```


    These equations follow directly from equations (2.2) and the supported upper-
    or right-triangular structure of A. The Gauss elimination scheme uses this idea
    to find solutions to simultaneous linear equations by constructing the triangular
    form


    ```

    $Rx=f$ (6.4)

    ```


    from the original equations.

    Note that each of the equations (2.2), that is


    ```

    $\sum_{k=1}^{n} A_{ik}x_k=b_i$ for $i=1,2,\dots$ (6.5)

    ```


    can be multiplied by an arbitrary quantity without altering the validity of the
    equation; if we are not to lose any information this quantity must be non-zero.'
