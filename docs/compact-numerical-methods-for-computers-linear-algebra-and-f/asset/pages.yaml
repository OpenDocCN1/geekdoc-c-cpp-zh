    made during the minimisation of a function, these are not useful in the present

    instance. Recall that


    ```

    $$\partial S(b)/\partial b_i = \lim_{h\to0} [S(b+h_i) - S(b)]/h$ (18.3)$

    ```


    where $e_j$ is the $j$th column of the unit matrix of order $n$ ($b$ is presumed
    to have $n

    elements). For explanatory purposes, the case $n=1$ will be used. In place of
    the

    limit (18.3), it is possible to use the **forward difference**


    ```

    $D = [S(b+h) - S(b)]/h$ (18.4)$

    ```


    for some value of $h$.

    Consider the possible sources of error in using $D$.


    +   (i) For $h$ small, the discrete nature of the representation of numbers in
    the

    computer ensures severe inaccuracies in the calculation of $D$. The function $S$

    continuous; its representation is not. In fact it will

    hallowed to be small. Another way to think of this is that since most of

    the digits of $b$ are the same as those of $(b+h)$, any function $S$ which is
    varying

    rapidly will have similar values at $b$ and $(b+h)$, so that the expression (18.4)

    implements a degree of digit cancellation causing $D$ to be determined inaccurately.

    (ii) For large $h$, the line joining the points $S(b)$ and $(b+h)S(h)$ is not

    longer tangent to the curve of the former. Thus expression (18.4) is in error
    due

    to the nonlinearity of the function. Even worse, for some functions there may
    be

    discontinuity between $b$ and $(b+h)$. Checks for such situations are expensive
    of

    human and computer time. The penalty for ignoring them is unfortunately

    more serious.


    As a compromise between these extremes, I suggest letting


    ```

    $h = (|b|+e^{1/2})e^{1/2}$ (18.5)$

    ```


    where $e$ is the machine precision. The parameter has once more been given a

    subscript to show the step taken along each parameter in general will be

    different. The value for $h$ given by (18.5) has the pleasing property that it
