  md: '# Compact numerical methods for computers


    The method suggested is mainly useful for adding single observations, and other
    approaches are better if more than a very few observations are to be included.
    For instance, one could update the triangular form which results from the Givens''
    reduction if this had been saved, proceed to the singular-value decomposition
    as in algorithm 4.


    No methods will be discussed for removing observations, since while methods exist
    to accomplish this (see Lawson and Hanson 1974, pp 225–31), the operation is potentially
    unstable. Also see Bunch and Nielsen (1978).


    For instance, suppose we have a Givens'' QR decomposition of a matrix A with orthogonal
    and R upper-triangular), then add and delete a row (observation) denoted y^T.
    After that addition of this row, the (1, 1) elements of the matrices are related


    ```

    $(\mathbf{A}^T\mathbf{A})_{11} = (\mathbf{R}^T\mathbf{R})_{11} = \mathbf{R}_{11}^2
    = (\mathbf{A}^T\mathbf{A})_{11} + y_1^2 \quad (4.31)$

    ```


    where the tide is used to update matrices which have been deleted. Deletion of
    $y^T$ now requires the subtraction


    ```

    $$\tilde{R}_{11}^2 = \mathbf{R}_{11}^2 - y_1^2 \quad (4.32)$

    ```


    to be performed in some way or other, an operation which will involve digit cancellation
    if $y_1$ and $\mathbf{R}_{11}$ are close in magnitude. The same difficulty may
    occur in other columns—the first is simply easier to illustrate. Such cases imply
    that an element of $y^T$ dominates the column in which it occurs and as should
    arouse suspicions over the data. Chambers'' (1971) subroutine to delete rows from
    a QR decomposition contains a check designed to catch such occurrences.


    Of interest to those users performing regression calculations are the estimates
    of standard errors of the regression coefficients (the least-squares solution
    elements). The traditional standard error formula is


    ```

    $SE(b_j) = (\sigma^2(\mathbf{A}^T\mathbf{A})_{jj})^{-1/2} \quad (4.33)$

    ```


    where $\sigma^2$ is an estimate of the variance of data accounted by the fitted
    model calculated by dividing the sum of squared residuals by the number of degrees
    of freedom (nRow - nCol). The sum of squared residuals has already been computed
    in algorithm 4, and has been adjusted for rank deficiency within the solution
    phase of the code.


    The diagonal elements of the inverse of the sum of squares and cross-products
    matrix may seem to pose a bigger task. However, the singular-value decomposition
    leads easily to the expression


    ```

    $(\mathbf{A}^T \mathbf{A})^{-1} = \mathbf{V} \mathbf{S}^+ \mathbf{V}^T \quad (4.34)$

    ```


    In particular, diagonal elements of the inverse of the sum of squares and cross-'
