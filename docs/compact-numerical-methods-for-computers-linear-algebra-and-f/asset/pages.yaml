  md: '# The Choleski decomposition


    within the computer. It remains to be shown that the procedure is stable and that
    for $i=m$ the right-hand side of (7.8) is positive, so no square roots of negative
    numbers are required.


    Firstly, **A** is positive definite if


    ```

    x^T Ax > 0 \quad \text{for all } x \neq 0. \quad (7.9)

    ```


    An equivalent statement is that all the eigenvalues of **A** are positive. From
    (7.9) it follows by setting **x** to any column of the unit matrix that no diagonal
    element of **A** can be non-positive. Likewise, by taking only $x_i$ and $x_j$
    non-zero


    ```

    x_i^2 A_{ii} + x_j^2 A_{jj} + 2x_ix_j A_{ij} > 0 \quad (7.10)

    ```


    which requires the quadratic equation


    ```

    z^2 A_{ii} + 2z A_{ij} + A_{jj} = 0 \quad (7.11)

    ```


    has only complex roots. This occurs if


    ```

    A_{ij}^2 < A_{ii}A_{jj} \quad (7.12)

    ```


    Consider now the $i$-th of the Choleski decomposition. For the moment suppose
    that rows 1, $2, \dots, (i-1)$ of **L** have been computed, giving a submatrix
    $L_{i-1}$ which is a decomposition of the submatrix $A_{i-1}$; hence


    ```

    \begin{pmatrix} L_{i-1}^T & 0 \ L_{ii}^T \end{pmatrix} \begin{pmatrix} c_{i-1}
    \ c_{ii} \end{pmatrix} = \begin{pmatrix} A_{i-1} & a \ a^T & A_{ii} \end{pmatrix}
    \quad (7.13)

    ```


    Following Kowalik and Osborne (1996), we have


    ```

    L_{i-1}^{-1}c = a \quad (7.14)

    ```


    or


    ```

    c = L_{i-1}^{-1}a \quad (7.15)

    ```


    where **L_{i-1}** is assumed non-singular. In fact, it is positive definite providing
    the positive square root is chosen in the computation of each of its diagonal
    elements via (7.8). Consider using an **x** such that the first $(i-1)$ elements
    of **x** are given by $L_{i-1}^{-1}, x_i = -1$, and $x_j = 0$ for $j > i$. This
    choice, using (7.13) gives


    ```

    (c^T L_{i-1}^{-1}, -1) (L_{i-1}^{-1} L_{i-1}^{-T}) (L_{i-1}^{-1} c) > 0 \quad
    (7.16)

    ```


    which reduces to


    ```

    A_{ii} - c^T c > 0. \quad (7.17)

    ```


    By a comparison of this with (7.8) shows that it implies the square of each diagonal
    element of **L** is positive, so that all the elements of **L** are used real
    proving **A** is positive definite. Furthermore, an analysis similar to that used
    in (7.10), and (7.12) demands that


    ```

    L_{ii}^2 < 4L_{ii}L_{jj} \quad (7.18)

    ```'
