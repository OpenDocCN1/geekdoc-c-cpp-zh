    sufficiently well behaved for the unmodified Gauss-Newton algorithm to work successfully,
    the linear search introduces some waste of effort. Furthermore, when there are
    large differences in scale between the elements of the Jacobian J and/or it is
    difficult to evaluate these accurately, the condition of JᵀJ may deteriorate so
    that positive definitness is no longer guaranteed computationally and the result
    (17.19) is inoperable. Nevertheless, I have found that a carefully coded implementation
    of Hartley''s (1961) ideas using the Cholesky decomposition and back-solution
    for (possibly singular) systems of linear equations is a very compact and efficient
    procedure for the nonlinear least-squares problem. However, it has proved neither
    simple to implement nor so generally reliable as the method which before, and
    by virtue of its modifications to handle singular JᵀJ, no longer satisfies the
    conditions of the convergence result (17.19).


    # 17.4. MARQUARDT’S METHOD


    The problems of both scale and singularity of JᵀJ are attacked simultaneously
    by Marquardt (1963). Consider solutions q to the equations


    ```

    (JᵀJ + eI)q = -Jᵀf (17.20)

    ```


    where e is some parameter. As e becomes very large relative to the norm of JᵀJ,
    q tends towards the steepest descent direction, when e is very small compared
    to this norm, the Gauss–Newton solution is obtained. Furthermore, the scaling
    of the parameters


    ```

    x'' = Dx (17.21)

    ```


    where D is a diagonal matrix having positive diagonal elements, implies a transformed
    Jacobian such that


    ```

    J'' = JD⁻¹ (17.22)

    ```


    and equations (17.20) become


    ```

    [(JᵀJ + eI)q]'' = -(Jᵀf (17.23a)

    = (D⁻¹JᵀJD + eI)Dq = -D⁻¹Jᵀf (17.23b)

    ```


    or


    ```

    (JᵀJ + eD²)q = -Jᵀf (17.24)

    ```


    so that the scaling may be accomplished implicitly by solving (17.24) instead
    of (17.23a).


    Marquardt (1963) and Levenberg (1944) have suggested the scaling choice


    ```

    D_ii = (JᵀJ)ii (17.25)

    ```


    However, to circumvent failures when one of the diagonal elements of JᵀJ is zero,

    I prefer to use


    ```

    D_ii = (JᵀJ)ii + ϕ (17.26)

    ```


    where ϕ is some number chosen to ensure the scale is not too small (see Nash 1977).
