    Firstly, when it works, Newton''s method generally converges very rapidly. Thus
    it would seem desirable that $B$ bend in some way towards the inverse Hessian
    matrix $H^{-1}$. However, the computational requirement in Newton''s method for
    second partial derivatives and for the solution of linear-equation systems at
    each iteration must be avoided.


    Secondly, $B$ should be positive definite, not only to avoid the possibility that
    the algorithm will ''get stuck'' because $B$ lacks components necessary to reduce
    the function because it is in the null space of $B$ but also to permit the algorithm
    to exhibit quadratic termination, that is, to minimise a quadratic form in at
    most $n$ steps (15.2). A quadratic form


    ```

    $S(b) = \frac{1}{2}b^THb - c^Tb$ (any scalar) (15.11)

    ```


    has a unique minimum if $H$ is positive definite. That $H$ can always be made
    symmetric, and will be presumed so. The merits of quadratic termination and positive
    definiteness are still being debated (see, for instance, Broyden 1972, p 94).
    Also positive definite, a function with a saddle point or ridge has a Hessian
    which is not always positive definite. Nevertheless, the discussion here will
    be confined to methods that generate positive definite iteration matrices.


    If $n$ linearly independent directions $t_i, j = 1, 2, \dots, n$, exist for which


