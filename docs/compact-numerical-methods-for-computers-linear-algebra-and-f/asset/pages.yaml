  md: '# Real symmetric matrices


    Example 10.1. Principal axes of a cube


    Consider a cube of uniform density, mass m and edge length a situated so that
    three of its edges meet at a vertex form the coordinate axes x, y, z. The moments
    and products of inertia (see, for instance, Synge and Griffith 1959, pp 282-93)
    for the cube in this coordinate frame


    ```

    $I_{xx} = I_{yy} = I_{zz} = 2ma^2/3$

    $I_{xy} = I_{xz} = I_{yz} = -ma^2/4$

    ```


    These are formed into the moment-of-inertia tensor


    ```

    $$\begin{bmatrix} I_{xx} & -I_{xy} & -I_{xz} \ -I_{xy} & I_{yy} & -I_{yz} \ -I_{xz}
    & -I_{yz} & I_{zz} \end{bmatrix} = \begin{bmatrix} 8 & -3 & -3 \ -3 & 8 & -3 \
    -3 & -3 & 8 \end{bmatrix}$$

    ```


    where all the elements have been measured in 12/(ma^2).


    Algorithm 13 can be used to find the eigensolutions of this matrix. The eigenvalues
    will give the principal moments of inertia and the eigenvectors the principal
    axes to which these moments apply. Algorithm 13 used on a Data General NOVA operating
    in 23-bit binary arithmetic methods


    ```

    $I_1=2ma^2/12 \quad \mathbf{v}_1 = (0.577735, 0.577735, 0.577735)^T$

    $I_2=11ma^2/12 \quad \mathbf{v}_2 = (0.707107, -0.707107, -4.334888E-8)^T$

    $I_3=11ma^2/12 \quad \mathbf{v}_3 = (0.408248, 0.408248, -0.816496)^T$

    ```


    (The maximum absolute residual was 3.8147E-6, the maximum inner product 4·4226E-7).
    The last two principal moments of inertia are the same or degenerate. Thus any
    linear combination of $\mathbf{v}_2$ and $\mathbf{v}_3$ will give a new vector


    ```

    $$\mathbf{v}_2'' = \alpha\mathbf{v}_2 + (1-\alpha^2)^{1/2}\mathbf{v}_3$

    ```


    which forms a new set of principal axes with $\mathbf{v}_1$ and


    ```

    $$\mathbf{v}_3'' = (1-\alpha^2)^{1/2}\mathbf{v}_2 - \alpha\mathbf{v}_3$

    ```


    which is orthogonal to $\mathbf{v}_2''$. Indeed algorithm 14 on the same system
    found


    ```

    $I_1=2ma^2/12 \quad \mathbf{v}_1 = (0.577735, 0.577735, 0.577735)^T$

    $I_2=11ma^2/12 \quad \mathbf{v}_2 = (0.732793, -0.678262, -5.453122E-2)^T$

    $I_3=11ma^2/12 \quad \mathbf{v}_3 = (0.360111, 0.454562, -0.816464)^T$

    ```


    with a maximum absolute residual of 7.62939E-6 and a maximum inner product 2·38419E-7.'
