  md: '# Chapter 14


    # DIRECT SEARCH METHODS


    # 14.1. THE NELDER-MEAD SIMPLEX SEARCH FOR THE MINIMUM OF A FUNCTION OF SEVERAL
    PARAMETERS


    The first method to be examined for a function of $n$ parameters is a search procedure
    based on heuristic ideas. Its strengths are that it requires no derivatives to
    be computed, so it can cope with functions which are not easily written as analytic
    expressions (for instance, the result of simulations), and that it always increases
    the information available concerning the function by reporting its value at a
    number of points. Its weakness is that it does not use this information very effectively,
    so may take an unnecessarily large number of function evaluations to locate a
    solution. Furthermore, the method requires $(n+1)$ by $(n+2)$ storage locations
    to hold intermediate results in the algorithm, so is not well adapted to problems
    in a large number of parameters. However, for more than five parameters the procedure
    appears to become inefficient. Justification of the choice of this algorithm is
    postponed until $\$14.4.


    The original paper of Nelder and Mead (1965) outlines quite clearly and succinctly
    their method, which is based on that of Spendley et al (1962). The method will
    be described here to point out some particular modifications needed to improve
    its reliability on small machines, particularly those with arithmetic having few
    digits in the mantissa.


    A simplex is the structure formed by $(n+1)$ points, not in the same plane, in
    an $n$-dimensional space. The essence of the algorithm is as follows: the function
    is evaluated at each point (vertex) of the simplex and the vertex having the highest
    functioning value is replaced by a new point with lower function value. This is
    done in such a way that ''the simplex adapts itself to the local landscape, and
    contracts to the final minimum.'' There are four main operations which are made
    on the simplex: reflection, expansion, reduction and contraction. In order to
    operate the simplex, it is necessary to order the points so that the highest is
    $b_H$, the next-to-highest $b_N$, and the lowest $b_L$. Thus the associated function
    values obey


    ```

    $S(b_H) \geq S(b_N) \geq S(b_L) \quad (14.1)$

    ```


    for all $i \neq H, N$ or L. Figure 14.1 illustrates the situation.

    The centroid of all the points other than $b_H$ is defined by


    ```

    $b_C = \left( \sum_{j=1}^{n+1} b_j \right) / n. \quad (14.2)$

    ```


    168'
