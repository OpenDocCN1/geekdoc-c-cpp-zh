  md: '# Chapter 9


    # THE ALGEBRAIC EIGENVALUE PROBLEM


    # 9.1. INTRODUCTION


    The next three chapters are concerned with the solution of algebraic eigen-value
    problems


    ```

    Ax = ex

    ```


    ```

    Ax = eBx.

    ```


    The treatment of these problems will be highly selective, and only methods which
    I feel are particularly suitable for small computers will be considered. The reader
    interested in other methods is referred to Wilkinson (1965) and Wilkinson and
    Reinsch (1971) for an introduction to the very large literature on methods for
    the algebraic eigenproblem. Here I have concentrated on providing methods which
    are reliable and easy to implement for matrices which can be stored in the computer
    memory except for a short discussion in chapter 19 of two methods suitable for
    sparse matrices. The methods have also been chosen to fit in with ideas already
    developed so the reader should not feel on too unfamiliar ground. Thus it is possible,
    even likely, that methods exist for most applications and any user should be aware
    of this. Section 10.5 discusses some of the possible methods for real symmetric
    methods.


    # 9.2. THE POWER METHOD AND INVERSE ITERATION


    One of the simplest methods for finding the eigenvalue of largest magnitude of
    a matrix A with its associated eigenvector is to iterate using the scheme


    ```

    y_i = Ax,

    x_{i+1} = y_i/||y_i||

    ```


    from starting vector x_1 until successive x_i are identical. The eigenvector is
    given by x and the magnitude of the eigenvalue where ||y|| represents any vector
    norm. The simplicity of this algorithm and its requirement for only matrix-vector
    product makes it especially suitable for small computers, though convergence may
    at times be very slow.


    The method works as follows. Consider the expansion of x_1 in terms of the eigenvectors
    ϕ_j, j=1, 2, ..., n, which span the space. This may not be possible for non-symmetric
    matrices. However, the algorithm is generally less useful for such matrices and
    will not be considered further in this context. Wilkinson (1965, chap 9) has a
    good discussion of the difficulties. Therefore, returning to the expansion'
