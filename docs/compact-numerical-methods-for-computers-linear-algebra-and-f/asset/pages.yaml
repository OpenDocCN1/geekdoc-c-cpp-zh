  md: '# 8.2. THE GAUSS–JORDAN ALGORITHM FOR THE INVERSE\NF A SYMMETRIC POSITIVE DEFINITE
    MATRIX


    Bauer and Reinsch (in Wilkinson and Reinsch 1971, p 45) present a very compact

    alalgorithm for inverting a positive definite symmetric matrix in situ, that is,

    overwriting itself. The principal advantages of this algorithm are as follows.


    +   (i) No pivoting is required. This is a consequence of positive definiteness
    and

    symmetry. Peters and Wilkinson (1975) state that this is ‘well known’, but I

    believe the full analysis is yet unpublished.

    (ii) Only a triangular portion of the matrix needs to be stored due to symmetry,

    though a working vector of length n, where n is the order of the matrix, is needed.


    The algorithm is simply the substitution procedure outlined above.nThe modifications
    which are possible by symmetry and positive definiteness,

    hover, cause the computational steps to look completely different.


    Consider an intermediate situation in which the first k of the elements x and
    b

    have been exchanged in solving


    ```

    Ax = b

    ```


    by the Gauss–Jordan algorithm. At this stage the matrix of coefficients will have

    t form


    ![](img/d19cc76075209bc2c8169972d3b94274_109_0.png)


    with W, k by k; X, by (n-k); Y, by (n-k) and Z, (n-k) by (n-k). Then W

    is the inverse of the corresponding block of A since the equations (8.6) are now
    given

    by their equivalents


    ```

    $$\begin{pmatrix} W & 0 \ Y & I_{n-k} \end{pmatrix}b = \begin{pmatrix} I_k & X
    \ 0 & Z \end{pmatrix}x$.

    ```


    Thus by setting x_j=0, for j=(k+1), (k+2), ..., n, in block (8.6) and (8.8) the

    required association of W and the leading k by block of A is established.

    Likewise, by setting b_j=0, for j=1, ..., k, in (8.6) and (8.8), Z is the inverse
    of

    the corresponding block of A^{-1}. (Note that W and Z are symmetric because A

    A^{-1} are symmetric).


    From results, W and Z are both positive for all k since A is

    positive definite. This means that the diagonal elements needed as pivots in the

    Guss–Jordan steps are all positive. (This follows directly from the definition

    of positive definiteness for A, that is, that x^TAx>0 for all x≠0).


    In order to avoid retaining elements above or below the diagonal in a program,

    we need one more result. This is that


    ```

    $Y = -X^T$

    ```


