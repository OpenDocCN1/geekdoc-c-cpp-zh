    To measure efficiency of an algorithm, we could time the execution. This is generally
    quite difficult with a time-shared machine and is in any case highly dependent
    on the compiler or interpreter in use well as on a number of programming devices,
    and may be affected quite markedly by special hardware features of some machines.
    Therefore, a measure of work is needed which does not require reference to the
    machine and I have chosen to use equivalent function evaluations (efe''s). This
    is the number of function evaluations required to minimise a function plus, in
    the cases of algorithms requiring derivatives, the number of function evaluations
    which would have been required to approximate the derivatives numerically. For
    a problem of order n, a program requiring gradient evaluations and inf function
    evaluations is assigned


    ```

    efe = (n + 1) * ig + ifn

    ```


    equivalent function evaluations. I use the factor (n+1) rather than n because
    of the particular structure of my programs. The use of equivalent function evaluations,
    and in particular the choice of multiplier for ig, biases my appraisal against
    methods using derivatives, since by large the derivatives are not times more work
    to compute than the function. Hillstrom (1976) presents a more comprehensive approach
    to tackling algorithms for function minimisation, when the end is still stood
    to make some judgements.


    Having decided to use equivalent function evaluations as the measure of efficiency,
    we have a problem in determining how to use them, since the omission of some problems
    for each of the methods means that a method which has successfully solved a problem
    involving many parameters (the maximum in any of the tests was 20, but most were
    of five or less) may appear less efficient than another method which was unable
    to tackle this problem. To take account of this, we could determine the average
    number of equivalent function evaluations to convergence per parameter, either
    by averaging this quantity over the successful applications of a method or by
    dividing the total number of efe''s for all successful cases by the total number
    of parameters involved. In practice, we decided to keep both measures, since their
    ratio gives a crude measure of the performance of algorithms as order increases.


    To understand this, consider that the work required to minimise the function in
    any algorithm is proportional to some power, a, of the order n, thus


    ```

    w = pn^a.

    ```


    The expected value of the total work over all problems divided by the total number
    of parameters is approximated by


    ```

    w_0 = ((int pn^{a-1}dn) / (int dn))^-1 = 2pn^a^(1/(a+1)).

    ```


    The average of w/n over all problems, on the other hand, is approximately


    ```

    w_0 = ((int pn^{a-1}dn) / (int dn))^-1 = pn^(a-1)/a.

    ```'
