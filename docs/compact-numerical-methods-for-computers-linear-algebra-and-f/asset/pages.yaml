    # 10.2. EXTENSION TO MATRICES WHICH ARE NOT POSITIVE DEFINITE


    The above result shows that A is a symmetric positive definite matrix, its eigensolutions
    can be found via the singular-value decomposition algorithms 1 and 4. Moreover,
    only one of the matrices U or V is required, so that the algorithm, for example,
    generates the matrix B=US in performing an orthogonalisation of the columns of
    A, so that the eigenvalues are kept implicitly as the norms of the columns of
    the orthogonalised matrix and a separate vector to store the eigenvalues is not
    required.


    What of the case where the matrix A is not positive definite? This is hardly any
    extra trouble, since the matrix


    ```

    A''=A-h1_n (10.19)

    ```


    has the same eigenvectors as A (as proved by direct substitution in equation (10.11))
    and has eigenvalues


    ```

    E_ii=E_ii-h for i=1, 2, ..., n (10.20)

    ```


    where E_{ii} i=1, 2, ..., n, are the eigenvalues of A. Thus it is always possible
    to generate a positive definite matrix from A by adding an appropriate constant
    -h to each of its diagonal elements. Furthermore, it is very simple to compute
    an appropriate value for h from Gershgor’s theorem (Ralston 1956, p 467), which
    states that all the eigenvalues of a matrix A (a general square matrix, real or
    complex) remain in the domain which is the union of the circles having centres
    A_{ii}, i=1, 2, ..., n, and respect radius


    ```

    r_i = \sum_{j=1}^n |A_{ij}|. (10.21)

    ```


    Because a symmetric matrix has real eigenvalues this implies


    ```

    E_nn \geq min(A_{nn}-r_n) = min(A_{ii}-\sum_{j=1, j \neq i}^n |A_{ij}|) (10.22)

    ```


