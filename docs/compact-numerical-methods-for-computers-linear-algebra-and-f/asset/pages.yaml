    # FORMAL PROBLEMS IN LINEAR ALGEBRA


    2. INTRODUCTION

    A great practical problems in the scientific and engineering world give rise to
    models or descriptions of reality which involve matrices. In consequence, a very
    large proportion of the literature of numerical mathematics is devoted to the
    solution of various matrix equations. In the following sections, the major problems
    in numerical linear algebra will be introduced. Some examples are included to
    show how these problems may arise directly in practice. However, the formal problems
    will in most cases occur as steps in larger, more difficult computations. In fact,
    the algorithms of numerical linear algebra are the keystones of numerical methods
    for solving real problems.


    Matrix computations have a large area for mathematical and computational research.
    Textbooks on this subject, such as Stewart (1973) and Strang (1976), offer a foundational
    useful for understanding the uses and manipulations of matrices and vectors. More
    advanced works detail the theorems and algorithms for particular situations. An
    important collection of well-referenced material is Golub and Van Loan (1983).
    Kahaner, Moler and Nash (1989) comes a very readable treatment of numerical linear
    algebra.


    # 2.2. SIMULTANEOUS LINEAR EQUATIONS


    If there are n known relationships


    ```

    $A_{1}x_1 + A_{2}x_2 + \dots + A_{n}x_n = b \quad i=1, 2, \dots, n \quad (2.1)$

    ```


    between the n quantities $x_i$, with the coefficients $A_{ij}$ and right-hand
    side elements $b_i, i=1, 2, \dots, n$, then (2.1) is a set of simultaneous linear
    equations in n unknowns $x_j, i=1, 2, \dots, n$. It is simpler to write this problem
    in matrix form


    ```

    $Ax = b \quad (2.2)$

    ```


    where the coefficients have been collected into the matrix $A$, the right-hand
    side is now the vector $b$ and the unknowns have been collected as the vector
    $x$. A further way to write the problem is to collect each column of $A$ (say
    the $j$th) into a column vector (i.e. $a_j$). Then we obtain


    ```

    $$\sum_{j=1}^{n} a_{ij}x_j = b. \quad (2.3)$

    ```


    Numerous textbooks on linear algebra, for instance Mostow and Sampson (1969) or
    Finkbeiner (1966), will provide suitable reading for anyone wishing to'
