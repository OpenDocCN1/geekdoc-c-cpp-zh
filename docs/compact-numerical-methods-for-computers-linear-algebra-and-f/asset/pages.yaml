    $R = \left(\sum_{i=1}^n c_i c_j e_i \phi_i,B\phi_j\right)\left(\sum_{i=1}^n c_i
    c_j \phi_i,B\phi_j\right)^{-1} = \left(\sum_{i=1}^n c_i^2 e_i\right)\left(\sum_{i=1}^n
