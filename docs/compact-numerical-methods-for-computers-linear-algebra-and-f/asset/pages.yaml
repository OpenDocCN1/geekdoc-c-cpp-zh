  md: '# Compact numerical methods for computers


    Example 12.5. Minimum of a function of one variable


    Suppose we wish to buy some relatively expensive item, say a car, a house or a
    new computer. The present era being afflicted by inflation at some rate r, we
    will pay a price


    ```

    $P(1+r)^t$

    ```


    at some time t after the present. We can save at s dollars per unit time, and
    when we can borrow money at an overall cost of $(F-1)$ dollars per dollar borrowed,
    that is, we must pay back F dollars for every dollar borrowed. F can be evaluated
    given the interest rate R and number of periods N of a loan as


    ```

    $F = NR(1+R)^N/[(1+R)^N-1]$

    ```


    Then, to minimise the total cost of our purchase, we must minimise


    ```

    $S(t) = ts+[P(1+r)^t-Fs]\ns= ts(1+r) + FP(1+r)^t$.

    ```


    This has an analytic solution


    ```

    $t = \ln((F-1)s/[FP\ln(1+r)]/\ln(1+r)$.

    ```


    However, it is easy to construct examples where analytic solutions are harder
    to obtain, for instance by changing inflation rate r with time.


    # 12.2. DIFFICIES ENCOUNTERED IN THE SOLUTION OF OPTIMISATION AND NONLINEAR-EQUATION
    PROBLEMS


    It is usually relatively easy to state an optimisation or nonlinear-equation problem.
    It may be straightforward, if tedious, to find one solution. However, to find
    the solution of interest may be nearly impossible.


    In unconstrained minimisation problems the principal difficulty arises to local
    minima. If the global minimum is sought, these local minima will tend to attract
    algorithms to themselves like golf balls on the course. That is, there may be
    no reason why a particular local minimum will be found; there is no reason why
    it will not work. The nonlinear-equation problem arises by setting the derivatives
    of the function to zero will have solutions at each of these local minima. Local
    maxima and saddle points will also cause these equations to be satisfied.


    Unfortunately, very little has been done on to get the desired solution. One of
    the few studies of this problem is that of Brown and Gearhart (1971) who discuss
    deflation to calculate several of simultaneous nonlinear equations. These methods
    seek to change the equations being solved so that solutions already found are
    not solutions of the modified equations. The interested reader will also find
    an excellent discussion of the difficulties in solving nonlinear equations and
    minimisation problems in Acton (1970, champs 2 and 14). The traditional advice
    given to users wishing to avoid unwanted solutions is always to provide starting
    values for which are close to the expected answer. As Brown and Gearhart (1971)
    have'
