  md: '# Conjugate gradients method in linear algebra


    In some tests run by SG Nash and myself, the inexact line searches led to very
    slow convergence in a number of cases, even though early progress may have been
    rapid (Nash and Nash 1977).


    # 19.2. SOLUTION OF LINEAR EQUATIONS AND LEAST-SQUARES PROBLEMS BY CONJUGATE GRADIENTS


    The conjugate gradients algorithm 22 can be modified to solve systems of linear
    equations and linear least-squares problems. Indeed, conjugate gradients methods
    have been derived by considering their application to the quadratic form


    ```

    $S(b) = \frac{1}{2}b''Hb - c''b \quad \text{(any scalar)}$

    ```


    where $H$ is symmetric and positive definite. The minimum at $b''$ has the zero
    gradient


    ```

    $g = Hb'' - c = \mathbf{0}$

    ```


    so that $b''$ solves the linear equations


    ```

    $Hb'' = c$.

    ```


    The linear least-squares problem


    ```

    $Ab = \mathbf{f}$

    ```


    can be solved by noting that $A^TA$ is non-negative definite. For the present
    purpose we shall assume that it is positive definite. Henes (1975) shows that
    it is only necessary for $H$ to be non-negative definite to produce a least-squares
    solution of (19.1). This identification of


    ```

    $H = A^TA$

    ```


    ```

    $c = A^Tf$

    ```


    permits least-squares problems to be solved via the normal equations.


    The particular changes which can be made to the general-purpose minimising algorithm
    of $$16.1 and 16.2 to suit these linear systems of equations are better that (a)
    the linear search and (b) the gradient calculation can be performed explicitly
    and simply. The latter is accomplished as follows. First, if the initial point
    is taken to


    ```

    $b^{(0)} = \mathbf{0}$

    ```


    then the initial gradient, from (15.17), is


    ```

    $g_1 = -c$.

    ```


    If the linear search along the search direction $t_i$ yields a step-length factor
    $k_i$, then from (15.18)


    ```

    $g_{i+1} = g_i + k_iHt_i$.

    ```


    With this (19.5) defines a recurrence scheme which avoids the necessity of multiplication
    of $b$ by $H$ to compute the gradient, though $Ht_i$ must be formed. However,
    this is needed in any case in the linear search to which attention will be directed.'
