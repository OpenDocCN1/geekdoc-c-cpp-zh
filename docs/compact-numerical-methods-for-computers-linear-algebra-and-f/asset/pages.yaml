    # 14.4. OTHER DIRECT SEARCH METHODS


    The Nelder-Mead procedure presented here is by no means the only direct search
    procedure, nor is it taken to be the most economical of space or time. Dixon (1972)
    discusses a number of direct search methods. Some of these perform various linear
    searches that form the resultant or sum of these over, say, n directions. A new
    set of directions is produced with the first being the resultant and the others
    orthogonal to this and each other. This is the basis of the method of Rosenbrock
    and that of Davies, Swann and Champ. Each may require storage of at least n vectors
    of m elements, equivalent to algorithm 19. The differences between the two methods
    mentioned occurred in the linear search and the orthogonalisation procedure, which
    must be more resilient to directions in which no progress can be made, these will
    have zero length and will cause a loss of dimensionality.


    A method which is very simple to code and uses only two vectors of working storage
    is that of Hooke and Jeeves (1961). This is the only method I have tested using
    the 77 tests in Nash (1976). At that time, the performance of this method in BASIC
    on a Data General NOVA computer was not satisfactory. For the types of functions
    encountered in many teaching situations it seems quite reliable, and Eason and
    Fenton (1973) showed a preference for this method. Furthermore, it is explicable
    to students whose major interest is not mathematics, such as those in economics
    or commerce, who'
