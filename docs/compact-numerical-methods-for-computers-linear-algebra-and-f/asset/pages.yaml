    was used to decide whether a solution was acceptable based the computed

    gradient. This means the results detailed in §18.2 have used a more liberal definition

    of success than that was applied to programs using analytic or no deriva-

    tives. This question raises is: do we judge a program by what it is intended

    to? Or do we test to see if it has some correct answer? I have chosen

    the former position, but the latter is equally valid. Such differences of viewpoint

    unfortunately give rise to many disputes and controversies in this field.


