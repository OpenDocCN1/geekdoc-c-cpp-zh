  md: '# Compact numerical methods for computers


    for j = 1, 2, \dots, n. From (17.10) and (17.12), therefore, we have


    ```

    $$\partial v_j(x)/\partial x_k = \sum_{i=1}^m [J_{ik}(x)J_{ij}(x) + f(x)\partial^2
    f(x)/\partial x_i\partial x_k].\quad (17.15)$

    ```


    To apply the Newton-Raphson iteration (defined by (15.9)) to the solution of (17.8)
    requires the derivatives of f with respect to the parameters, a total of $mn^2$
    computations. On the grounds that near the minimum functions should be ''small''
    (a very cavalier assumption), the second term in the summation (17.15) is neglected,
    so that the partial derivatives of $v$ are approximated by the matrix $J^T J$,
    reducing (17.14) to


    ```

    $J^TJq = -J^Tf.\quad (17.16)$

    ```


    These are simply normal equations for a linearised least-squares problem evaluated
    locally, and the Gauss-Newton iteration proceeds by replacing $x$ with $(x+q)$
    and repeating until $q$ is smaller than some predetermined tolerance or


    ```

    $S(x+q) \geq S(x).\\quad (17.17)$

    ```


    # 17.3. HARTLEY MODIFICATION


    As it has been stated, the Gauss-Newton iteration can quite easily fail since
    the second term in the summation (17.15) is not negligible, especially in the
    case where the residuals $f$ are large. However, instead of replacing $x$ with
    $(x+q)$ we use $(x+tq)$, where $t$ is a step-length parameter, it is possible
    to show that if $J$ of full rank is positive definite and non-singular, then this
    modified Gauss-Newton algorithm always proceeds towards a minimum. For this case,
    we have


    ```

    $q = -(J^TJ)^{-1}J^Tf\quad (17.18)$

    ```


    so that the inner product between $q$ and the direction of the steepest descent
    $-J^Tf$ is


    ```

    $$-q^Tf = f^TJf > 0\quadquad (17.19)$

    ```


    since $(J^TJ)^{-1}$ is positive by virtue of the positive definiteness of $J^TJ$.
    Thus the cosine of the angle between $q$ and $-q$ is always positive, guaranteeing
    that the search is downhill. In practice, however, angles close to $90^{\circ}$
    are observed, which may imply slow convergence.


    The modified Gauss-Newton procedure above has been widely used to minimize sum-of-squares
    functions (Hartley 1961). While the one-dimensional search at each iteration is
    accomplished by fitting a quadratic polynomial to the sum-of-squares surface along
    the search direction and evaluating the function at the estimated minimum of this
    quadratic. This requires at least three sum-of-squares evaluations per iteration,
    and furthermore, the apparent simplicity of this parabolic inverse interpolation
    to accomplish a linear search when stated in words hides a variety of stratagems
    which must prevent moves in the wrong direction or to points where $S(x+q) > S(x)$.
