  md: '# Chapter 17


    # MINIMISING A NONLINEAR SUM OF SQUARES


    # 17.1. INTRODUCTION


    The mathematical problem to be considered here is that of minimising


    ```

    $S(x) = \sum_{i=1}^{m} [f_i(x)]^2$

    ```


    with respect to the parameters $x_j, j=1, 2,...,n$ (collected for convenience
    as the vector $x$), where at least one of the functions $f_j(x)$ is nonlinear
    in $x$. Note that by collecting the $m$ functions $f_i(x), i=1, 2, \dots, m$,
    as a vector $f$, we get


    ```

    $S(x) = f^T f$.

    ```


    The minimisation of a nonlinear sum-of-squares is a sufficiently spread activity
    to have developed special methods for its solution. The principal reason for this
    is that it arises whenever a least-squares criterion is used to fit a nonlinear
    model to data. For instance, let $y$ represent the weight of some laboratory animal
    at birth and suppose that it is desired to model this by some function of the
    week number $i$, which will be denoted $y(i,x)$, where $x$ the set of parameters
    which will be varied to fit the model to data. The criterion of fit is that that
    the sum of squared deviations from the data is to be minimised (least squares)
    then the objective is to minimise (17.1)


    ```

    $f_i(x) = y(i,x) - y_i$.

    ```


    or, in the case that confidence weights are available for each data point,


    ```

    $f_i(x) = [y(i,x) - y_i]w_i$.

    ```


    where $w_i, i=1, 2, \dots, m$, are the weights. As a particular example of a growth
    function, consider the three-parameter logistic form (Oliver 1964)


    ```

    $y(i,x) = y(i,x_1, x_2, x_3) = x_1/[1+\exp(x_2+ix_3)]$.

    ```


    Note that the form of the residuals in (17.3) and (17.4) is the negative of the
    usual ''actual minus fitted'' used in most of the statistical literature. The
    reason for this is to make the sum of derivatives of $f_i(x)$ coincide with those
    of $y(i,x)$.


    The minimisation of $S(x)$ could, of course, be approached by an algorithm for
    the minimisation of a general function of $n$ variables. Bard (1970) suggests
    that this is not as efficient as methods which recognise the sum-of-squares form
    of $S(x)$, though more recently Biggs (1975) and McKeown (1974) have found contrasting
    results. In the paragraphs below, algorithms will be described which take explicit
    note the sum-of-squares form of $S(x)$, since these are relatively simple and,
    as building blocks, algorithms for linear least-squares computations which have
    already been discussed in earlier chapters.'
  merge: -1
