    then


    ```

    $BH_n = t_n$ or $B = H^{-1}$ (15.13)

    ```


    The search directions $t_i$ are conjugate to $H$, leading in an implicit fashion
    to the expansion


    ```

    $H^{-1} = \sum_{j=1}^n (t_j t_j^T)/(t_j^THt_j)$ (15.14)

