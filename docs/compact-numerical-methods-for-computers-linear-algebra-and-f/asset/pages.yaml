    # 9.4. EIGENSOLUTIONS OF NON-SYMMETRIC AND COMPLEX MATRICES


    The algebraic eigenvalue problem is considerably more difficult to solve when
    the matrix $\mathbfmathbf{A}$ is non-symmetric or complex. If the matrix is Hermitian,
    the complex-conjugate transpose of $\mathbfmathbf{A}$ is equal to $\mathbfmathbf{A}$,
    the eigenvalues are then real and methods for real symmetric matrices easily be
    extended to solve this case (Nash 1974). However, in general, it is possible for
    the matrix to be defective, that is, has less than $n$ eigenvectors, and the problem
    may be ill conditioned that the eigenvalues may be highly sensitive to small changes
    in the matrix elements. The procedures which must, after all, contend with the
    possibility of complex eigenvalues and eigenvectors have been published for this
    problem, and are large, long. On a small machine, the space which must be allocated
    where previously one space was required, two now must be reserved and the corresponding
    program code is more doubled in length to handle the arithmetic.


    Fortunately, such occur rarely in practice. For both real and complex cases I
    have used a direct translation of Eberlein''s ALG program (Wilkinson and Reinsch
    1971). This uses a generalised of the Jacobi algorithm and I found it to function
    well. One point which is not treated in Eberlein''s discussion is that the eigenvectors
    can be multiplied by any number, $c$, and still be eigenvectors. In the real symmetric
    case all arithmetic is in the real domain and by normalisation of the eigenvectors
    the results of a computation can be standardised with the exception of eigenvectors
    corresponding to multiple eigenvalues. In the complex case, however, the eigenvector


    ```

    $$\mathbf{x} + i\mathbf{y}$\n(9.28)

    ```'
