  md: '# # Appendix 1


    # # NINE TEST MATRICES


    In order to test programs for the algebraic eigenproblem and linear equations,
    it is useful to have a set of easily generated matrices whose properties are known.
    The following nine real symmetric matrices can be used for this purpose.


    Hilbert segment of order n


    ```

    $A_{ij} = 1/(i + j - 1)$

    ```


    This matrix is notorious for its logarithmically distributed eigenvalues. While
    it can be shown in theory to be positive definite, in practice it is so conditioned
    that most eigenvalue or linear-equation algorithms fail for some value of $n <
    20$.


    Ding Dong matrix


    ```

    $A_{ij} = 0/(n - i - j + 5)$

    ```


    The name and matrix were invented by Dr F N Ris of IBM, Thomas J Watson Research
    Centre, and he and the author both students at Oxford. Cauchy matrix have few
    trailing zeros in any elements, so is always represented inexactly in the machine.
    However, it is very stable under inversion by elimination methods. Its eigenvalues
    have the property of clustering near $\pm m/2$.


    Moler matrix


    ```

    $A_{ii} = i$

    $A_{ij} = \min(i, j) - 2 \quad \text{for } i \neq j$.

    ```


    Professor Cleve Moler revived this matrix. It has the very simple Choleski decomposition
    given in example 7.1, so is positive definite. Nevertheless, it has one small
    eigenvalue and upsets elimination methods for solving linear-equation systems.


    Frank matrix


    ```

    $A_{ij} = \min(i, j)$.

    ```


    A reasonably well behaved matrix.


    Bordered matrix


    ```

    $A_{ii} = 1$

    $A_{in} = A_{ni} = 2^{1-i} \quad \text{for } i \neq n$\n$A_{ij} = 0 \quad \text{otherwise.}$

    ```


    The matrix has $(n-2)$ eigenvalues at 1. Wilkinson (1965, pp 94–7) gives some
    discussion of this property. The high degree of degeneracy and the form of the


