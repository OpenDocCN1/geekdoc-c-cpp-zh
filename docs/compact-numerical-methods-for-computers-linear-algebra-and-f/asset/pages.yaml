    inverse interpolation. One choice, made in algorithm 22, is to take the initial
    point in the success-failure procedure as $b_0$. Then ''successes'' lower the
    function value. Ultimately, however, a ''failure'' will follow a ''success'' unless
    $u=b_0$ is minimal, even if the procedure begins with a string of ''failures''.
    Call the position at the last ''failure'' $b_1$, and the position at the ''success''
    which preceded it $b_1$; (Note that $b_1$ has to be the lowest point found so
    far.) Then $S(b_1)$ is less than $S(b_0)$ or $S(b_2)$ and the three points define
    a V-shape that ensures that the interpolating parabola (13.5) will not be extrapolate.

    Alternatively, in algorithm 17 below, any of the following combinations of events
    lead to a V-shaped triple of points with $b_i$ the lowest of the three:


    +   (i) initial point, success, failure $(b_0, b_1, b_2)$

    (ii) success, success, failure $(b_0, b_1, b_2)$

    (iii) initial point, failure, failure $(b_1, b_0, b_2)$.


    Consider then the three points defined by $b_0, b_1, b_2$ where $b_1$ occupies
    the middle position and where, using the notation


    > $S_i = S(b_i) \quad (13.7)$


    for brevity,


    > $S_1 \le S_0 \quad (13.8)$


    and


    > $S_1 \le S_2 \quad (13.9)$


