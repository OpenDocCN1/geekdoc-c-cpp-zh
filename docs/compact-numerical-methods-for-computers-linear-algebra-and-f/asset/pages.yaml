  md: "# Chapter 4\n\n# HANDLING LARGER PROBLEMS\n\n# 4.1. INTRODUCTION\n\nThe previous\
    \ chapter used plane rotations multiplying a matrix from the right to orthogonalise\
    \ its columns. By the essential symmetry of the singular-value decomposition,\
    \ there is nothing to stop us multiplying a matrix by plane rotations from the\
    \ left to achieve an orthogonalisation of its rows. The amount of work involved\
    \ is of order $mn^2$ operations per sweep compared to the columnwise orthogonalisation\
    \ (**A** is $m$ by $n$), and as there are normally more rows than columns it may\
    \ seem unprofitable to do this. By a judicious combination of row orthogonalisation\
    \ with Givens' reduction, an algorithm can be devised which will handle a theoretically\
    \ unlimited number of rows.\n\n# 4.2. THE GIVENS REDUCTION\n\nThe above approach\
    \ to the computation of a singular-value decomposition and least-squares solution\
    \ works very well on a small computer for relatively small matrices. For instance,\
    \ it can handle least-squares regression involving up to 15 economic time series\
    \ with 25 years of data in less than 2000 words of main memory (where one element\
    \ occupies two words of storage). While such problems are fairly common in economics,\
    \ biological and sociological phenomena are likely to have very large numbers\
    \ of observations, $m$, even though the number of variables, $n$, may not be large.\
    \ Again, the formation of the sum-squares and cross-products matrix $A^{TA}$ and\
    \ solution via the normal equations (2.2). In order to circumvent the difficulties\
    \ associated with the storage of the whole of the matrix A, the Givens' reduction\
    \ is simply a plane rotation which transforms two vectors so that an element of\
    \ them becomes zero. Consider two row vectors $\\mathbf{z}^T$ and $\\mathbf{y}^T$\
    \ and a pre-multiplying rotation:\n\n```\n$-\\left(\begin{array}{c}c \\ s\\end{array}\r\
    ight)\\mathbf{z}^T/left(\begin{array}{c}s \\ c\\end{array}\right)\\mathbf{y}^T=\\\
    left(\begin{array}{c}Z_1^T\\Y_1^T\\end{array}\right)$\n```\n\nwhere\n\n```\n$c\
    \ = \\cos \\phi \\quad s = \\sin \\phi$\n```\n\nand $\\phi$ is the angle of rotation.\
    \ If $Y_1$ is to be zero, then\n\n```\n$-sz_1 + cy_1 = 0$\n```\n\nso that the\
    \ angle of rotation in this case is given\n\n```\n$$\\tan \\phi = s/c = y_1/z_1$.\n\
    ```"
