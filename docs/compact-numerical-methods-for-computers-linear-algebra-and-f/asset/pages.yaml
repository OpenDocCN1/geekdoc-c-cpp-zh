  md: '# Chapter 16


    # DESCENT TO A MINIMUM II: CONJUGATE GRADIENTS


    # 16.1. CONJUGATE GRADIENTS METHODS


    On a small computer, the principal objection to the Nelder-Mead and variable metric
    methods is their requirement for a working space proportional to $n^2$, where
    $n$ is the number of parameters in the function to be minimised. The parameters
    $b$ and gradient $g$ require only $n$ elements each, so it is tempting to consider
    algorithms which make use of this information without the requirement that it
    be collected in a matrix. In order to derive such a method, consider again the
    quadratic form


    ```

    $S(b) = \frac{1}{2}b^T Hb - c^T b + \text{(any scalar)}$

    ```


    of which the gradient at $b$


    ```

    $g = Hb - c$.

    ```


    If then the search direction at some iteration $j$ is $t_i$, we have


    ```

    $y_i = g_{i+1} - g_i = k_i t_i$

    ```


    where $k_i$ is the step-length parameter. If any initial step $t_i$ is made subject
    only to its being ''downhill'', that is


    ```

    $t_i^T g_i < 0$

    ```


    then the construction of search directions $t_i, i=1, \dots, n$, conjugate with
    respect to the Hessian $H$, is possible via the Gram-Schmidt process (see Dahlquist
    and Björck 1974, pp 201–4). That is to say, using an arbitrary ''downhill'' direction
    $q_i$, at step $i$, it is possible to construct, by choosing coefficients $z_{ij}$,


    ```

    $t_i = q_i + \sum_{j=1}^{i-1} z_{ij} t_j$

    ```


    such that


    ```

    $t_i^T H t_i = 0 \quad for j < i$.

    ```


    This is achieved by applying $t_i^T H$ to both sides of equation (16.2), giving


    ```

    $z_{ij} = -t_i^T H t_j / t_i^T H t_$

    ```


    by substitution of the condition (16.3) and the assumed conjugacy of the $t_i,
    j=1, 2, \dots, (i-1)$. Note that the denominator of (16.4) cannot be zero if $H$
    is positive definite and $t_i$ is not null.'
