  md: '# Compact numerical methods for computers


    # 4.3. EXTENSION TO A SINGULAR-VALUE DECOMPOSITION


    In order to determine linear dependencies are present, it is possible to extend
    the Givens'' reduction and compute a singular-value decomposition by orthogonalising
    the rows of **R** by plane rotations which act from the left. It is not necessary
    to accumulate the transformations in a matrix **U**; instead they can be applied
    directly to **Qᵀb**, in fact, to the first $n$ elements of this vector which form
    $d_1$. The rotations can be thought of as acting all at once on the orthogonal
    matrix **Pᵀ**. Applying this to equation (4.14) gives


    ```

    $$\mathbf{P}^T\mathbf{R}x = \mathbf{P}^T\mathbf{d}_1 = f.$

    ```


    However, the rows of **Pᵀ** are orthogonal, that is


    ```

    $$\mathbf{P}^T = \mathbf{S}\mathbf{V}^T$

    ```


    with


    ```

    $$\mathbf{S}^T\mathbf{V}\mathbf{S} = \mathbf{S}^2.$

    ```


    Combining the Givens'' reduction and orthogonalisation steps gives


    ```

    $$\mathbf{P}^T\mathbf{Q}^T\mathbf{A} = \mathbf{P}^T(\mathbf{R}) = (\begin{pmatrix}\mathbf{S}
    \ 0\end{pmatrix})${SV}$

    ```


    or


    ```

    $$\mathbf{A} = \mathbf{Q}\mathbf{P}(\begin{pmatrix}\mathbf{S} \ 0\end{pmatrix})\mathbf{V}^T$

    ```


    which is a singular-value decomposition.


    As in the case of the columnwise orthogonalisation, small singular values (i.e.
    rows of **Pᵀ** having small norm) will cause **V** to possess some unnormalised
    rows having essentially zero elements. In this case (4.17) will not be correct,
    since


    ```

    $$\mathbf{V}^T\mathbf{V} = (\begin{pmatrix}1_k\\0_{n-k}\end{pmatrix})$

    ```


    where $k$ is the number of singular values larger than some pre-assigned tolerance
    for zero. Since the solution of least-squares problems these rows always act only
    in products with **S** or **Sᵀ**, this presents no great difficulty to programming
    an algorithm using the above Givens'' reduction/row orthogonalisation method.


    # 4.4. SOME LABOUR-SAVING DEVICES


    The above method is not so complicated to implement as it may appear. Firstly,
    all the plane rotations are row-wise for both the Givens'' reduction and the orthogonalisation.
    Moreover, one or more (say g) vectors **b** can be concatenated with the matrix
    **A** so that rotations do not have to be applied separately to these, but appear
    to act on a single matrix.


    The second observation which reduces the programming effort is that the rows of
    this matrix (**A, b**) are needed one at a time. Consider a working array'
