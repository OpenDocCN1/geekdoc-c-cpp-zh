  md: '# Chapter 8


    # THE SYMMETRIC POSITIVE DEFINITE MATRIX AGAIN


    # 8.1. THE GAUSS-JORDAN REDUCTION


    Another approach to the solution of linear equations (and in fact nonlinear ones)
    is the **method of substitution**. Here, one of the unknowns $x_k$ is chosen and
    one of the equations in which it has a non-zero coefficient is used to generate
    an expression for it in terms of the other $x_j, j \neq k$, and $b$. For instance,
    given


    ```

    $$\mathbf{Ax} = \mathbf{b}$

    ```


    $A_{11} \neq 0$, we might use


    ```

    $x_1 = (b_1 - \sum_{j=2}^{n} A_{1j}x_j) / A_{11}$

    ```


    The substitution of this into the other equations gives a new set of $(n-1)$ equations
    in $(n-1)$ unknowns which we write


    ```

    $$\mathbf{Ax''} = \mathbf{b''}$ $

    ```


    in which the indices run from 2 to $n$. In fact $\mathbf{x''}$ will consist of
    the last $(n-1)$ elements of $\mathbf{x}$. By means of $b_1$ it is simple to show
    that


    ```

    $b''_k = b_k - b_1A_{k1}/A_{11}$

    ```


    ```

    $A''_{kj} = A_{kj} - A_{k1}A_{1j}/A_{11}$

    ```


    for $k,j=2,\dots,n$. Note that if $b$ is included as the $(n+1)$th column of $\mathbf{A}$,
    then (8.4) is the only formula needed, thus $j$ must run to $(n+1)$.


    We now have a set of equations of order $(n-1)$, and can continue the process
    until only set of equations remains. Then, using the trivial solution of, this
    set of substitutions gives the desired solution to the original equations. This
    is entirely equivalent to Gaussian elimination (without pivoting) and back-substitution,
    and all the arithmetic is the same.


    Consider, however, that the second substitution is not made only of $x_2$ into
    the remaining $(n-2)$ equations, but also into the formula (8.1) Then final order-1
    equations yield all the $x_i$ at once. From the viewpoint of elimination corresponds
    to eliminating upper-triangular elements in the matrix $\mathbf{R}$ in the system


    ```

    $$\mathbf{Rx} = \mathbf{f}$

    ```'
