  md: '# Chapter 10


    # REAL SYMMETRIC MATRICES


    # 10.1. THE EIGENSOLUTIONS OF A REAL SYMMETRIC MATRIX


    The most common practical algebraic eigenvalue problem is that of determining
    all the eigensolutions of a real symmetric matrix. Fortunately, this problem has
    the most agreeable properties with respect to its solution (see, for instance,
    Wilkinson 1965).


    +   (i) All the eigenvalues of a real symmetric matrix.

    (ii) It is possible to find a complete set of $n$ eigenvectors for an order-$n$
    real symmetric matrix and these can be made mutually orthogonal. Usually they
    are normalised so that the Euclidean norm (sum of squares of the elements) is
    unity. Thus, the total eigenproblem can be expressed


    ```

    AX=XE (10.1)

    ```


    where the matrix X has column $j$ such that


    ```

    Ax_j = e_j x_j (10.2)

    ```


    where $e_j$ is the $j$th eigenvalue. E is the diagonal matrix


    ```

    E_ij = e_j \delta_ij (10.3)

    ```


    with $\delta_{ij}$ the familiar Kronecker delta (see §6.2, p 60).\By virtue of
    the orthogonality, we have


    ```

    X^T X = I_n (10.4)

    ```


    where $I_n$ is the unit matrix of order $n$, but because X is composed of $n$
    orthogonal and non-null vectors, it is of full rank and invertible. Thus from
    equation (10.4) by left multiplication with X we get


    ```

    X X^T X = X (10.5)

    ```


    so that right multiplication with $X^{-1}$ gives


    ```

    X X^T X^{-1} = X^T X^{-1} = I_n (10.6)

    ```


    showing that $X^T$ is the inverse $X^{-1}$ and that X is an orthogonal matrix.


    +   (iii) If the matrix A is not only symmetric, so but also positive definite
    (see §7.1, p 71), then from the singular-value decomposition


    ```

    A^T = A (10.7)

    ```


    ```

    A = USV^T (2.53)

    ```'
