    # 17.6. RELATED METHODS


    Fletcher (1971) has proposed a Marquardt method in which the bias e (lambda) is
    computed on the base of some heuristic rules rather than adjusted arbitrarily.
    His program, incorporated in the Harwell and NAG libraries, has widespread usage
    and seems highly reliable. On straightforward problems I have found it very efficient,
    and in terms of evaluations of J and S() generally better than a FORTRAN version
    of algorithm 23 on difficult problems. However, in a small sample of runs, the
    cost of running the Fletcher program was higher than that of running the FORTRAN
    algorithm 23 (Nash 1977).


    Jones (1970) uses an explicit search along spirals between the Gauss-Newton and
    steepest descent directions. He reports very favourable performance for this procedure
    and some of my colleagues who have employed it well of it. Unfortunately, it does
    not seem to make it sufficiently compact for a ''small'' computer.


    Since the first edition was published, algorithm 23 has proven to be highly reliable.
    Nevertheless, I have at times been considering other approaches to minimising
    a nonlinear sum of squares. In LEQ85 (Nash 1948), the singular-value decomposition
    is used without the formation of the Jacobian inner-products matrix. In Nash and
    Walker-Smith (1987), we added the facility to impose bounds constraints on the
    parameters. We also considered changing the method of solving equation (17.16)
    to solve the Gauss-Newton linear least-squares problem of equation (17.16) from
    the current Choleski method to a scaled Choleski method, but found that this changed
    the iterations.'
