  md: '# 222 Compact numerical methods for computers


    the other (n - m). This yields a new problem involving fewer parameters which
    automatically satisfy the constraints.


    Simple inequality constraints may frequently be removed by substitutions which
    satisfy them. In particular, if the constraint is simply


    ```

    $b_k \ge 0 \quad (18.11)$

    ```


    then a substitution of $b_k^z$ for $b_k$ suffices. If, as a further case, we have


    ```

    $v \ge b_k \ge u \quad (18.12)$

    ```


    then we can replace $b_k$ by


    ```

    $\left(\frac{u+v}{2} - \frac{v-u}{2} \sin b_k\right) \quad (18.13)$

    ```


    It should be noted that the constraint has obviously disappeared, these substitutions
    tend to complicate the resulting unconstrained minimisation by introducing local
    minima and multiple solutions. Furthermore, in many cases suitable substitutions
    are very difficult to construct.


    # Penalty functions


    The basis of the penalty approach is simply to add to the function $S(b)$ some
    positive quantity reflecting the degree to which a constraint is violated. Penalties
    may be global, that is, added everywhere, or partial, that is, only added where
    the constraint is violated. While there are many possibilities, here we will consider
    only two very simple choices. These are, for equality constraints, the penalty
    functions


    ```

    $w_k c_k(b) \quad (18.14)$

    ```


    and for inequalities, the partial penalty


    ```

    $W_k h_k^2(b)H(h_k(b)) \quad (18.15)$

    ```


    where $H$ is the Heaviside function


    ```

    $H(x) = \begin{cases} 1 & \text{for } x > 0 \ 0 & \text{for } x \le 0 \end{cases}
    \quad (18.16)$

    ```


    The quantities $w_j, j=1, 2, \dots, m$, and $W_k, k=1, 2, \dots, q$, are weights
    which have been assigned to each of the constraints. The function


    ```

    $S''(b) = S(b) + \sum_{j=1}^m w_j c_j^2(b) + \sum_{k=1}^m W_k h_k^2(b)H(h_k(b))
    \quad (18.17)$

    ```


    then has an unconstrained minimum which approaches the constrained minimum of
    $S(b)$ as the weights $w, W$ become large.


    The methods outlined above, while obviously acceptable as theoretical approaches
    to constrained minimisation, may nonetheless suffer serious difficulties in the
    finite-length arithmetic of the computer. Consider the first example: minimise


    ```

    $(b_1 + b_2 - 2)^2 \quad (18.18a)$

    ```'
