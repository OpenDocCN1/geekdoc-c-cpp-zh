  md: '# Chapter 11

    THE GENERALISEDD SYMMETRIC MATRIX

    EIGENVALUE PROBLEM


    Consider now the generalised matrix eigenvalue problem


    ```

    Ax = eBx  (2.63)

    ```


    where **A** and **B** are symmetric and **B** is positive definite. A solution
    to this

    problem will be sought by transforming it into a conventional eigenvalue problem.

    The trivial approach


    ```

    B⁻¹Ax = ex  (11.1)

    ```


    gives an eigenvalue problem of the single matrix **B⁻¹** which is unfortunately
    not

    symmetric. The approximation to **B⁻¹** generated in a computation may therefore

    have complex eigenvalues. Furthermore, methods for solving the eigenproblem of

    on-symmetric matrices require much more work than their symmetric matrix

    counterparts. Ford and Hall (1974) discuss several transformations that convert

    (2.63) into a symmetric matrix eigenproblem.


    Since B is positive definite, its eigenvalues can be written as the squares D²ᵢ

    i = 1, 2, . . . n, so that


    ```

    B = ZDZᵀ (11.2)

    ```


    where **Z** is the matrix of eigenvectors of **B** normalised so that


    ```

    ZZᵀ = ZᵀZ = Iₙ (11.3)

    ```


    Then


    ```

    B⁻¹² = ZD⁻¹ᵀ (11.4)

    ```


    and


    ```

    (B⁻¹²AB⁻¹²)(B¹/²)X) = B¹/²XE (11.5)

    ```


    is equivalent to the complete eigenproblem


    ```

    AX = BXE (11.5a)

    ```


    which is simply a matrix form which collects together all solutions to (2.63).

    Equation (11.5) can be solved as a conventional symmetric eigenproblem


    ```

    A₁V = VE (11.6)

    ```


    where


    ```

    A₁ = B⁻¹²AB⁻¹/² (11.7a)

    ```


    and


    ```

    V = B¹/²X (11.7b)

    ```'
