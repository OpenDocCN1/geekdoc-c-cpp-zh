    If the driver programs have been loaded and compiled to saved executable (.COM)
    files, then we can execute these programs by typing their names, e.g. DR0102.
    The user must enter command information from the keyboard. This is not difficult,
    but it is sometimes useful to be able to issue such commands from a file. Such
    a BAT command file (.BAT extension) is commonly used in ms-dos systems. In the
    driver programs we have included compiler directives to make this even easier
    to use by allowing command input to come from a file. A batch file EXAMPLE.BAT
    which could run drivers for algorithms 1 through 6 would have the form


    ```

    rem EXAMPLE.BAT

    rem runs Algorithms 1 through 6 automatically

    DR0102 <DR0102X.

    DR03A <DR03AX.

    DR03 <DR03X.

    DR04 <DR04X.

    DR0506 <DR0506X.

    ```'
