    \ (8.12)\n```\n\n```\n$A_{ij}^{(k)} = A_{ij}^{(k-1)} - A_{ih}^{(k-1)}A_{kj}^{(k-1)}/A_{kk}^{(k-1)}$\
    \ \\quad$ (8.13)\n```\n\nFor $k=1$, the condition $Y = -X^T$ is given as\n\n```\n\
