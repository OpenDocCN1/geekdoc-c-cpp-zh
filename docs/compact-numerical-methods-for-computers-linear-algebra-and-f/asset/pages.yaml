  md: "# Linear equations—a direct approach\n\n**Algorithm 6.** Gauss elimination\
    \ back-substitution\n\nThis algorithm is designed to follow Gauss elimination\
    \ (algorithm 5), but can be applied also to systems of equations which are already\
    \ triangular or which have been brought to triangular form by other methods, for\
    \ instance, the Givens' reduction of $4.2 (algorithm 3).\n\n```\nprocedure gaussbacksub(n,\
    \ p:integer; size of problem nRow, p=RHS)\n  var A: matrix; (work array containing\n\
    \    Gauss elimination reduced coefficient\n    matrix and transformed right hand\
    \ sides)\n\n[alg06.pas == Gauss elimination back-substitution.\nPlaces solutions\
    \ to linear equation systems in columns n+1,...,n+p\nof matrix A. Alg05.pas (Gauss\
    \ elimination) must be executed first with\n  right hand sides in columns n+1,...,n+p\
    \ of matrix A in order\n  to triangularize the system of equations.\n}\nvar\n\
    \  s: real[accumulator]\n  i, j, k: integer;\nbegin\n  writeln('alg06.pas -- Gauss\
    \ elimination back-substitution');\n  for i:(n) to (n+p) do [STEP 1]\n  begin\n\
    \    A[n,i]:A[n,i]/A[n,n]; [STEP 2]\n    for j:(j+1) downto 1 do [STEP 3]\n  \
    \  begin\n      s:=A[j,i]; [STEP 4]\n      for k:=(j+1) to n do [STEP 5]\n   \
    \   begin\n        s:=s-A[j,k]*A[k,i]; (to subtract contributions from solution\n\
    \        elements which have already been determined)\n      end; [loop on k]\n\
    \      A[j,i]:=s/A[j,j]; [STEP 6 -- to fix solution element j]\n    end; [loop\
    \ on j] -- STEP 7\n  end; [loop on i] -- STEP 8\nend;alg06.pas\n```\n\nThe solutions\
    \ to the triangular system(s) of equations and here to the original equations\
    \ (2.2) are contained in columns n+1, n+2,...,n+p of the working array.\n\n**Example\
    \ 6.1.** The use of linear equations and linear least-squares problems\n\nOrganisations\
    \ which publish statistics use indices to summarise the change in some set of\
    \ measurable quantities. Already in example 3.2 we have used indices of the use\
