    # 15.3. A CHOICE OF STRATEGIES


    In order to specify a particular metric algorithm it is now necessary to choose
    a matrix-updating formula and a linear search procedure. One set of choices resulting
    in a compact algorithm is that of Fletcher (1970). Here this will be simplified
    without some specific details made clear. First, Fletcher attempts to avoid an
    inverse interpolation in performing the linear search. He suggests an ‘acceptable
    point’ search procedure which takes the first point in generated sequence that
    satisfies some acceptance criterion. Suppose that the step taken


    ```

    t = b'' - b = -kBg

    ```


    with k = 1 initially. The decrease in the function


    ```

    ΔS = S(b'') - S(b) < 0

    ```


    will be approximated for small steps t the first term in the Taylor series for
    S along t b, that is, t''g. This is negative when t is a ‘downhill’ direction.
    It is not desirable that AS be very different in magnitude from t''g since this
    would imply that the local approximation of the function by a quadratic form is
    mostly in error. By choosing k = 1, w, $w^2$, $\dots$, for $0 < < $w$ $ <$ $1$
    successively, it is always possible to produce a t such that


    ```

    0 < tolerance <= ΔS/t''g for tolerance < 1

    ```


    unless the minimum has been found. This presumes


    ```

    t''g < 0

    ```


    to ensure a ‘downhill’ direction. In any practical program a test of the condition
    (15.32) is advisable before proceeding with any search along t. Fletcher recommends
    the values w = 0-1, tolerance = 0.0001. If the point is not acceptable, he uses
    a compact inverse interpolation to reduce k, with the proviso that 0-k is the
    smallest value permitted to generate the next step in the search. The author retains
    tolerance = 0.0001, but uses w = 0-2 with no interpolation procedure. For a study
    of acceptable point-interpolation procedures in minimisation see Sargent and Sebastian
    (1972).


    An updating formula which has received several favourable reports is that of Broden
    (1970a, b), Fletcher (1970) and Shanno (1970). This employs the update


    ```

    C = d2tt'' - [t(By)''T + (By)tT'']/d1

    ```


    where y is the gradient difference


    ```

    y = g(b'') - g(b)

    ```'
