  md: '![](img/d19cc76075209bc2c8169972d3b94274_181_0.png)


    FIGURE 14.1. Points generated by the Nelder-Mead simplex algorithm in two dimensions.
    Point 1, $b_L$, the lowest vertex in the simplex; point 2, $b_n$, the next-to-highest
    vertex; and point 3, $b_H$, the highest vertex. Point 4, $b_C$, the centroid of
    all points except $b_H$; that is, of $b_n$ and $b_L$. One of the points generated
    by a general contraction of the simplex towards $b_H$; Point 5, the reflection
    of $b_H$ through $b_C$; point 6, $b_L$, the result of extension of the line $(b_C,
    b_H)$; point 7, the result of reduction of the line $(b_C, b_H)$ which occurs
    when $b_n$ is lower than $b_H$ but higher than $b_n$; point 8, the result of reduction
    of the line $(b_C, b_H)$; point 9, one of the points generated by a general contraction
    of the simplex made up of vertices 1, 2 and 3 towards $b_L$.


    The operation of *reflection* then reflects $b_H$ through $b_C$ using a reflection
    factor $\alpha$, that is


    ```

    $b_R = b_C + \alpha(b_C - b_H)$$

    = (1 + \alpha)b_C - \alpha b_H. \quad (14.3)$

    ```


    If $S(b_R)$ is less than $S(b_n)$ a new point has been found, and the simplex
    can be expanded by extending the line $(b_n - b_C)$ to find the point


    ```

    $b_E = b_R + (\gamma - 1)(b_R - b_C)$$

    = \gamma b_R + (1 - \gamma)b_C$$

    = (1 + \alpha\gamma)b_C - \alpha\gamma b_H. \quad (14.4)$

    ```


    where $\gamma$, the expansion factor, is greater than unity or else (14.4) represents
    a contraction. If $S(b_L) < S(b_R)$ then $b_H$ is replaced by $b_E$ and the procedure
    repeated by finding a new highest point and a new centroid of $n$ points $b_C$.
    Otherwise $b_R$ is the new lowest point and it replaces $b_H$.'
