    bring it into the appropriate range. For example


    $$\sin(\pi - \phi) = \sin \phi$  (1.1)


    $$\sin(\pi/2 - \phi) = \cos \phi$  (1.2)


    Unless this range reduction is done very carefully the results may be quite unexpected.
    On one system, hosted by a Data NOVA, I have observed that the sine of an angle
    $\pi$ and the cosine of an angle $\pi/2$ were both computed as unity instead of
    a small value, due to this error of rounding. Similarly, on early models of Hewlett-Packard
    pocket calculators, the rectangular-polar coordinate transformation may give a
    vector $180^{\circ}$ from the correct direction. (This appears to have been corrected
    now.)


    Testing the quality of the floating-point arithmetic and special functions is
    technically difficult and tedious. However, some developments which have been
    made by public-spirited scientists. Of these I consider the most worthy example
    to be PARANOIA, a program to examine the floating-point arithmetic by providing
    a programming language translator. Devised originally by Professor W Kahan of
    the University of California, Berkeley, it has been developed and distributed
    in a number of programming languages (Karinski 1985). Its output is didactic,
    so that one does not have to be a numerical analyst to interpret the results.
    I have used BASIC, FORTRAN, Pascal and C versions of PARANOIA, and have seen reports
    of Modula-2 and ADA$$.


    In the area of special functions, Cody and Waite (1980) have developed software
    to both calculate and test a number of commonly used transcendental functions
    (sin, cos, tan, log, exp, sqrt, $x^y$). The ELEFUNT testing software is available
    in their book, written in FORTRAN. A considerable effort would be needed to translate
    it into other programming languages.


    An example from our work is the program DUBLTEST, which is designed to determine
    the precision to which the standard functions in BASIC are computed (Nash and
    Walker-Smith 1987). On the IBM PC, many versions of Microsoft BASIC (GWASIC, BASICA)
    would only compute functions in single precision, even if the variables involved
    as arguments were double precision. For some nonlinear parameter estimation problems,
    the resulting precision caused unsatisfactory operation of our software.


    Since most algorithms are in sense iterative, it is necessary that one has some
    criterion for deciding when sufficient progress has been made that the execution
    of a program can be halted. While, in general, I avoid tests which require knowledge
    of the machine, preferring to use the criterion that that it is sometimes convenient
    or even necessary to employ tests involving tolerances related to the structure
    of the computing device at hand.


    The most useful property of a system which has been determined is the smallest
    number, eps, such that the machine precision is.


