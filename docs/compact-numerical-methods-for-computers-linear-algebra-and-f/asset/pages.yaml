    ```

    6-78 * 10² = 678 = 6-78E2.

    ```


    and

    This notation has already appeared in §1.2.


    # 1.8. SOFTWARE ENGINEERING ISSUES


    The development of microcomputer software for users who are not trained in computer
    science or related subjects has given rise to user interfaces which are much more
    sophisticated and easy to use than common when the first edition appeared. Mathematical
    software has escaped such developments, but source code collections have generally
    required the user to consolidate units, add driver and routines, and compile and
    run the programs. In my experience, the lack of convenience implied by this requirement
    is a major obstacle to users learning about software published in source code.
    In our nonlinear estimation software (Nash and Walker-Smith 1987), we were careful
    to include batch command files to allow for easy consolidation and execution of
    programs. This philosophy is continued here, adapted to Turbo Pascal.


    +   1. All driver programs include code (from the fragment in file startup.pas)
    to allow the user to specify a file from which the program control input and the
    problem data are to be input. We refer to this as a ''control input file''. It
    has a name stored in the global string variable infile, and is referred to by
    the global text variable infile. Algorithms which need input get it by read or
    reread statements from infile. The input file can be ''con'', the console keyboard.


    WARNING: errors in input control files may cause source code files to be destroyed.
    I believe this is a ''bug'' in Turbo Pascal 3.01a, the version used to develop
    the codes.'
