    # 14.3. AN AXIAL SEARCH PROCEDURE


    The following procedure is a device primarily designed to generate information
    concerning the shape of the surface S(b) near the minimum, which will be labelled
    b*. In some instances, where a minimisation algorithm has converged prematurely,
    the axial search may reveal a point having a lower function value than that at
    the supposed minimum. The step taken along each axis is somewhat arbitrary. O''Neill
    (1971), for instance, in applying the axial search after a Nelder-Mead program,
    uses ±001 times the initial steps used to generate the simplex. However, these
    increments must be supplied by the program. I prefer to adjust the parameter b
    by an increment


    > s = e(|lb| + e)


    where e is some small number such as the square root of the machine precision.
    Section 18.2 gives a discussion of this choice. Its principal advantage is that
    the increment always adjusts the parameter. Alternatively, I have employed the
    assignment


    > b1 := b1(1±001)


    unless these fail to change the parameter, in which case I use


    > b := ±0001.


    The later axial search was used in the set of tests to compare algorithms for
    function minim which were included in the first and §18.4 of both editions. What
    follows below reflects our current usage, including some measures of the curvature
    and symmetry of the functional surface near the presumed minimum.'
