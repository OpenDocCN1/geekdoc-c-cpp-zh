    # The Gauss-Newton method


    At the minimum the gradient $\mathbf{v}(\mathbf{x})$ must be zero. The functions
    $v_j(\mathbf{x}), j=1, 2, \dots, n$, provide a set of $n$ nonlinear functions
    in $n$ unknowns $\mathbf{x}$ such that


    ```

    $\mathbf{v}(\mathbf{x}) = 0 \quad (17.9)$

    ```


    the solution of which is a stationary point of the function $S(\mathbf{x})$, has
    a local maximum or minimum or a saddle point. The particular form (17.1) or (17.2)
    of $S(\mathbf{x})$ gives gradient components


    ```

    $2\mathbf{v}_j(\mathbf{x}) = 2 \sum_{i=1}^m f_i(\mathbf{x})\partial f_i(\mathbf{x})/\partial
    x_j \quad (17.10)$

    ```


    which reduces to


    ```

    $\mathbf{v}_j(\mathbf{x}) = \sum_{i=1}^m f_i(\mathbf{x})\mathbf{J}_i(\mathbf{x})
    \quad (17.11)$

    ```


    or


    ```

    $\mathbf{v} = \mathbf{J}^T \quad (17.12)$

    ```


    by defining the Jacobian matrix $\mathbf{J}$ by


    ```

    $J_{ij} = \partial f_i(\mathbf{x})/\partial x_j. \quad (17.13)$

    ```


    Some approximation must now be made to simplify the equations (17.8). Consider
    the Taylor expansion of $\mathbf{v}_j(\mathbf{x})$ about $\mathbf{x}$


    ```

    $\mathbf{v}_j(\mathbf{x}+\mathbf{q}) = \mathbf{v}_j(\mathbf{x}) + \sum_{k=1}^n
    q_k \partial \mathbf{v}_j(\mathbf{x})/\partial x_k + (terms \ in{ } q^2). \quad
    (17.14)$

    ```


    If the terms in $q^2$ (that is, those involving $q_k q_j$ for $k, j=1, 2, \dots,
    n$) are assumed to be negligible and $\mathbf{v}_j(\mathbf{x}+\mathbf{q})$ is
    taken as zero because it is assumed to be the solution, then


    ```

    $\sum_{k=1}^n q_k \partial \mathbf{v}_j(\mathbf{x})/\partial x_k = -\mathbf{v}_j(\mathbf{x})
    \quad (17.15)$

    ```'
