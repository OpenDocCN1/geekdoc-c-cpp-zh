  md: '# Compact numerical methods for computers


    When using the singular-value decomposition one could choose to work with deviations
    from means or to scale the data in some way, perhaps using columns which are deviations
    from means scaled to unit variance. This will then prevent ''large'' data from
    swapping ''small'' data. Scaling of equations has proved a difficult and somewhat
    subjective issue in the literature (see, for instance, Dahlquist and Björck 1974,
    p 181if).


    Despite these choices, I have found the solutions to least-squares problems obtained
    by the singular-value decomposition approach to be remarkably resilient by the
    omission of scaling and the subtraction of means.


    As a final example of the importance of using decomposition methods for least-squares
    problems, consider the data (Nash and Lefkovitch 1976)


    ```

    $A=\begin{pmatrix} \alpha & \alpha & \alpha \ 0 & 1 & 0 \ 0 & 0 & 1 \end{pmatrix}
    \quad b=\begin{pmatrix} 1 \ 1 \ 1 \end{pmatrix}.$

    ```


    This is a regression through the origin and can be shown to have the exact solution


    ```

    $x=\begin{pmatrix} 1/\alpha-2 \ 1 \ 1 \end{pmatrix}$

    ```


    with zero residual sum of squares. If we wish to use a method which only scans
    the data once, that is, explicit residuals are not computed, then solution of
    the normal equations allows the residual sum of squares to be computed via


    > $r^Tr=b^Tb-b^TAx. \quad (5.23)$


    Alternatively, algorithm 4 can be used, to form the sum of squares by means of
    the uncorrelated variables (4.30).


    The following solutions were found using a Hewlett-Packard 9830 desk calculator
