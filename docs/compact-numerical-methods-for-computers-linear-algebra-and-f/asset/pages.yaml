  md: '# Conjugate gradients method in linear algebra


    **Example 19.4.** Negative definite property of Fröberg’s matrix


    In example 19.1 the coefficient matrix arising in the linear equations ‘turns
    out to be negative definite’. In practice, to determine this property the eigenvalues
    of the matrix could be computed. Algorithm 25 is convenient in this respect, since
    a A having a positive minimal eigenvalue is positive definite. Conversely, if
    the smallest eigenvalue of (−A) is positive, A is negative definite. The minimum
