    # 18.3. CONSTRAINED OPTIMISATION


    The general constrained function problem is stated: minimise $S(b)$ with respect
    to the parameters $b_i, i=1, 2, \dots, n$, subject to the constraints


    ```

    $c_i(b)=0 \quad j=1, 2, \dots, m \quad (18.7)

    ```


    and


    ```

    $h_k(b) \le 0 \quad k=1, 2, \dots, q. \quad (18.8)

    ```


    In general, if the constraints are independent, must be less than $n$, since via
    solution of each constraint for one of the parameters $b$ in terms of the others,
    the dimensionality of the problem may be reduced. The inequality restrictions
    $h$, on the other hand, reduce the size of the domain in which the solution can
    be found without necessarily reducing the dimensionality. Thus there is no formal
    bound to the number, $q$, of such constraints. However, that two inequalities


    ```

    $h(b) \le 0 \ h(b) \ge 0 \quad (18.9)

    ```


    are obviously equivalent to a simple equality constraint. Moreover, a very simple
    change to the constraints (18.9) to give


    ```

    $h(b) + \varepsilon \le 0 \ h(b) - \varepsilon \ge 0 \quad (18.10)

    ```


    for $\varepsilon > 0$ shows that the inequality constraints may be such that they
    can never be satisfied simultaneously. While mutually contradicting constraints
    such as (18.10) are quite obvious, in general it is not trivial to detect infeasible
    problems so that their detection can be regarded as one of tasks which any solution
    method should be able to accomplish.


    There are number of effective techniques for dealing with constraints in minimisation
    problems (see, for instance, Gill and Murray 1974). The problem is large and a
    difficult one, and the programs to solve it generally long and complicated. For
    this reason, several of the more mathematically sophisticated methods, such as
    Lagrange multiplier or gradient projection techniques, will not be considered
    here. In fact, all the proposed proposed are simple and all involve modifying
    the objective function $S(b)$ so that the resulting function has its unconstrained
    minimum at or near the constrained minimum of the original function. Thus no new
    algorithms will be introduced in this section.


    Elimination or substitution


    The equality constraints (18.7) provide $m$ relationships between the $n$ parameters
    $b$. Therefore, it may be possible to solve for as many as $m$ of the $b$’s in
    terms of'
