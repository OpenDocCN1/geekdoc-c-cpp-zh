    gives the triangular matrix in question. The choice of symbol


    ```

    $$\mathbf{L}^{-1} = \prod_{i=1}^{n} \mathbf{M}_{ij} \quad (6.19)$

    ```


    is deliberate, since the matrix product is lower-triangular by virtue of the lower-triangular
    nature of each $\mathbf{M}_i$, and the lemmas below will be stated without proof
    (see, for instance, Mostow 1969, p. 226).


    **Lemma 1.** The product of two lower-/upper-triangular matrices is also lower-/upper-triangular.


    **Lemma 2.** The inverse of a lower-/upper-triangular matrix is also lower-/upper-triangular.


    By virtue of lemma 2, the matrix $\mathbf{L}$ (the inverse of $\mathbf{L}^{-1}$)
    is lower-triangular. The elements of $\mathbf{L}$ are given by


    ```

    $L_{ij} = \begin{cases} 0 & j > i \ 1 & j = i \ m_{ij} & j < i \end{cases} \quad
    (6.20)$

    ```


    This is proved by simply forming


    ```

    $$\mathbf{L}^{-1}\mathbf{L} = 1 \quad (6.21)$

    ```


    using (6.19) and (6.20). Note that (6.18) implies that


    ```

    $$\mathbf{A} = \mathbf{LR} \quad (6.22)$

    ```


    which is a *triangular decomposition* of the matrix $\mathbf{A}$. It permits us
    to rewrite the original equations


    ```

    $$\mathbf{Ax} = \mathbf{LR}\mathbf{x} = \mathbf{b} \quad (6.23)$

    ```


    as


    ```

    $$\mathbf{Rx} = \mathbf{L}^{-1}\mathbf{Ax} = \mathbf{L}^{-1}\mathbf{b} = \mathbf{f}.
    \quad (6.24)$

    ```


    Because we can retain the triangular structure by writing the unit matrix


    ```

    $$\mathbf{I} = \mathbf{DD}^{-1}} \quad (6.25)$

    ```


    where $\mathbf{D}$ is a non-singular diagonal matrix so that that


    ```

    $$\mathbf{A} = \mathbf{LR} = \mathbf{LDD}^{-1}\mathbf{LR}'' \quad (6.26)$

    ```


    the Gauss elimination is not the only means to obtain a triangular decomposition
    of $\mathbf{A}$.


    In fact, the Gauss elimination procedure as has been explained so far is unsatisfactory
    for computation in finite arithmetic because the $m_{ij}$ are computed from **current
    elements of the matrix, that is, those elements which have been computed as a
    result of eliminating earlier elements in the scheme.** Recall that


    ```

    $$\m_{ij} = A_{ij}^{prime}/A_{ij} \quad (6.12)$

    ```


    using the prime to denote current values of the matrix elements, that is, those
    values which have resulted from eliminating elements in columns $1, 2, $\dots,
    (j-1)$.'
