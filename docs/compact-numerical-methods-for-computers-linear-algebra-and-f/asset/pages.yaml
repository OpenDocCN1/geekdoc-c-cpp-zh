  md: 'Compact numerical methods for computers


    # 10.3. THE JACOBI ALGORITHM FOR THE EIGENSOLUTIONS OF A REAL SYMMETRIC MATRIX


    Equation (10.1) immediately leads to


    $V^TAV=E \quad (10.31)$


    (using **V** in place of **X**). The fact that a real symmetric matrix can be
    *diagonalised by its eigenvectors gives rise to a number of approaches to the
    algebraic eigenvalue problem for such matrices. One of the earliest of these was
    suggested by Jacobi (1846). This proposes the formation of the sequence of matrices


    $A^{(0)} = A \nA^{(k+1)} = (V^{(k)})^T A^{(k)} V^{(k)} \quad (10.32)$


    where the $V^{(k)}$ are the plane rotations introduced in $\3.3$. The limit of
    the sequence is a diagonal matrix under some conditions on the angles of rotation.
    Each rotation is chosen to set one off-diagonal element of the matrix $A^{(k)}$
    to zero. In general an element zero by one rotation will be made non-zero by another
    that a series of *sweeps* through the off-diagonal elements are needed to reduce
    the matrix to diagonal form. Note that the rotations in equation (10.32) preserve
    symmetry, so that there are $n(n-1)/2$ rotations in one sweep if $A$ is of order
    $n$.


    Consider the effect of a single rotation, equation (3.11), in the $ij$ plane.
    For $m \neq i, j$


    $A_{mi}^{(k-1)} = A_{mi}^{(k)} \cos \phi + A_{ji}^{(k)} \sin \phi = A_{im}^{(k+1)}
    \quad (10.33) \nA_{mi}^{(k-1)} = -A_{mi}^{(k)} \sin \phi + A_{ji}^{(k)} \cos \phi
    = A_{jm}^{(k+1)} \quad (10.34)$


    while


    $A_{ii}^{(k+1)} = A_{ii}^{(k)} \cos^2 \phi + 2A_{ji}^{(k)} \cos \phi \sin \phi
    + A_{jj}^{(k)} \sin^2 \phi \quad (10.35) \nA_{ij}^{(k+1)} = A_{ij}^{(k)} \cos^2
    \phi - 2A_{ji}^{(k)} \cos \phi \sin \phi + A_{jj}^{(k)} \sin^2 \phi \quad (10.36)
    \nA_{ij}^{(k+1)} = A_{ij}^{(k)} - (A_{ii}^{(k)} - A_{jj}^{(k)}) \cos \phi \sin
    \phi \quad (10.37)$


    By allowing


    $p = A_{ii}^{(k)} \quad (10.38)$


    and


    $q = A_{ii}^{(k)} - A_{jj}^{(k)} \quad (10.39)$


    the angle calculation defined by equations (3.22)-(3.27) will cause $A_{ij}^{(k+1)}$
    to be zero. By letting


    $Z^{(k)} = \sum_{i=1}^{n-1} \sum_{j=i+1}^n (A_{ij}^{(k)})^2 \quad (10.40)$


    be the measure of the non-diagonal character of $A^{(k)}$ in a similar fashion
    to the non-orthogonality measure (3.17), it is straightforward (a little tedious)
