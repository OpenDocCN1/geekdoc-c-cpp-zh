    The Givens’ transformations are assembled in algorithm 3 to triangularise a real
    $m$ by $n$ matrix $A$. Note that the ordering of the rotations is crucial, since
    an element set to zero by one rotation must not be non-zero by another. Several
    orderings are possible; algorithm 3 acts column by column, so that rotations placing
    zeros in column $k$ acts on columns $1, 2, \dots, (k-1)$ and leave these elements
    unchanged. Algorithm 3 leaves the matrix $A$ triangular, that is


    ```

    $A[i,j]=0 \quad \quad i>j$$

    ```


    which will be denoted $R$. The matrix $Q$ contains the transformations, so that
    the original $m$ by $n$ matrix is


    ```

    $A=QR.$

    ```


    In words, this procedure simply zeros the last $(m-1)$ elements of column 1, then
