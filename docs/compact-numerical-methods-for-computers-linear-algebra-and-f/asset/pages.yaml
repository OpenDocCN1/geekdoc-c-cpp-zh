    | a | 5008 | 5008 | 5008 |

    | b | 5007 | 5007 | 5007 |

    | a + b | 10015 | 1002 * 10 | 1001 * 10 |

    | (a + b)/2 | 5007·5 | 501·0·10 | 500·5·10 |

    | | | =5010 | =5005 |n'
