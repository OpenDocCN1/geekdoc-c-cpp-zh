  md: '# Chapter 15


    # DESCENT TO A MINIMUM I: VARIABLE METRIC ALGORITHMS


    # 15.1. DESCENT METHODS FOR MINIMISATION


    The Nelder–Mead algorithm is a direct search procedure in that it involves only
    function values. In the next few sections, methods will be considered which make
    use of the gradient of the function S(b) which will be called g:


    ```

    $g_j = \partial S(b)/\partial b_j, \quad j = 1, 2, \dots, n \quad (15.1)

    ```


    evaluated at the point **b**. Descent methods use the basic iterative step


    ```

    $b'' = b - kBg \quad (15.2)

    ```


    **where B** is a matrix defining a transformation of the gradient and $k$ is a
    step length. The simplest such algorithm, the method of steepest descents, was
    proposed by Cauchy (1848) for the solution of nonlinear equations. This uses


    ```

    $B = L_n$ \quad (15.3)

    ```


    and any step length $k$ which reduces the function so that


    ```

    $S''(b'') < S(b). \quad (15.4)

    ```


    The principal difficulty with steepest descents is its tendency to hemstich, that
    is, to cross-cross a valley on the function S(b) instead of following the floor
    of the valley to a minimum. Kowalik and Osborne (1968, pp 34–9) discuss some of
    the reasons for this weakness, is primarily that the search directions are not
    linearly independent. A number of methods have been developed which aim to transform
    the gradient **g** so that the search directions generated in (15.2) are linearly
    independent or, equivalently, conjugate to each other with respect to some positive
    definite matrix **A**. In other words, if $x_i$ and $x_j$ are conjugate with respect
    to the positive definite matrix **A** if directions, $x_i$, and $x_j$ are conjugate
    with respect to the positive definite matrix **A** if


    ```

    $x_i^T Ax_j = 0. \quad (15.5)

    ```


    The conjugate gradients algorithm 22 generates a set of search directions implicitly,
    avoiding the storage requirements of either a transformation matrix **B** or the
    previous search directions. The variable metric algorithm 21 uses a transformation
    matrix which is adjusted at each step to generate appropriate search directions.
    There is, however, another way to find this process. Consider the set of nonlinear
    equations formed by the gradient at a minimum


    ```

    $g(b'') = 0. \quad (15.6)

    ```


