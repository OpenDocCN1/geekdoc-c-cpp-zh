    # 6.3. VARIATIONS ON THE THEME OF GAUSS ELIMINATION


    Gauss elimination really presents only one type of difficulty to the programmer—of
    which many possible variations to implement. We have already touched upon the
    existence of two better known ones, of Crout and Doolittle (see Dahlquist and
    Björck 1974, pp 157–8). While these methods are useful and important, they require
    double-precision arithmetic to use to full advantage, cannot be used effectively
    if the computing system at hand lacks this capability.


    Bowdler et al. (1966) presented ALGOL versions of the Crout algorithm which implicitly
    scale the rows of the coefficient matrix. These algorithms are complicated by
    ALGOL''s lack of double-length arithmetic, necessitating calls to code procedures.


    By and large I have avoided scaling within my programs because of the great difficulty
    of making any reliable general recommendations. Indeed, given any two non-singular
    diagonal matrices D and E, the system of equations


    ```

    DAEE^{-1}x=Db

    ```


    has the solution $x$ as the equations


    ```

    Ax=b.

    ```


    In scaling the equations by row multiplication we are adjusting D, which adjusts
    the pivot selection. It is often recommended that the scaling factors in D be
    chosen to equilibrate the matrix A, that is, so


    ```

    max|DA|_i=1 \quad i=1,2,\dotsdots,n

    ```


    where the moment E is assumed to be a unit matrix. This is simply a dose of common
    sense which avoids arithmetic involving numbers widely different in magnitude.
    However, Dahlquist and Björck (1974, pp 181–3) point out the scaling $E^{-1}$
    of solution $x$ can frustrate others to stabilise the computation. Furthermore,
    optimal scaling depends on knowledge of the matrix $A^{-1}$, which is not known.
    They therefore suggest E to reflect the importance of the unknowns''. This statement
    is suitably amorphous to cover whatever situations arise, so I shall venture the
    opinion that the magnitudes of the solution elements


    ```

    y=E^{-1}x

    ```


    should be roughly equivalent. That is to say, the variables in the problem at
    hand should be measured in units which give the expected solution elements'
