    It may seem odd that the first algorithm to be described in this work is designed
    to compute the singular-value decomposition (svd) of a matrix. Such computations
    are topics well known to most books on numerical linear algebra. However, it was
    the algorithm below which first interested the author in the capabilities of small
    computers. Moreover, while the svd is somewhat of a sledgehammer method for many
    nutshells, its versatility in finding the eigensolutions of a real symmetric matrix,
    in solving sets of simultaneous linear equations or in computing minimum-length
    solutions to least-squares problems makes it a valuable building block in programs
    to tackle a variety of problems.


    This versatility has been exploited in a single small program suite of approximately
    300 lines of BASIC code to carry out the problems as well as to find and generalised
    inverses of matrices and to solve nonlinear least-squares problems (Nash 1984b,
    1985).


