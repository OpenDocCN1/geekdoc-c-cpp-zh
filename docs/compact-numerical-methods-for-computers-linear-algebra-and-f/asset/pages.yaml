    # 9.3 SOME NOTES ON THE BEHAVIOUR OF INVERSE ITERATION


    The algorithm just presented in some details appear complicated.

    (i) The convergence test uses a comparison of all elements in the vector. For
    many applications the norm of y or some similar measure may suffice; however,
    it is not foolproof, particularly when the starting vector is set to simple choice
    as a column of ones. In this case, inverse iteration with a diagonal matrix Au
    = i, a unit matrix B and a shift of zero will ''converge'' after 2, which is its
    earliest opportunity to stop. However, the vector is left much in error, though
    the dominant component has converged.

    (ii) The eigenvalue is given by


    > shift + x/yi = k + xi/yi, (9.20)


    from the analysis of equations (9.16)–9.18). When the element y, is zero, of course,
    this is not suitable for determining the eigenvalue. Therefore the program must
    saves the vectors x and y, for the largest element in y, then divide it into the
    corresponding element of x in order to get the eigenvalue. It is tempting to suggest
    that the expression should be


    > shift + 1/yi = k + 1/yi, (9.21)


    since a normalisation is performed at each stage. Also, too matrices have'
