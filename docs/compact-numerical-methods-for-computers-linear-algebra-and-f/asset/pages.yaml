  md: '# Chapter 12


    # # OPTIMISATION AND NONLINEAR EQUATIONS


    #  12.1. FORMAL PROBLEMS IN UNCONSTRAINED OPTIMISATION AND NONLINEAR EQUATIONS


    The material which follows in the next few chapters deals with finding the minima
    of functions or the roots of equations. The functions or equations will be in
    general nonlinear in the parameters, that is following Kowalik and Osborne (1968),
    the problems they generate will not be solvable by mean of linear equations (though,
    as we shall see, iterative methods on linear subproblems are very important).


    A special case of the nonlinear problem is the nonlinear least-squares problem
    which, because of its particular importance, will be presented first. This can
    be stated: $M$ nonlinear functions of $n$ parameters


    ```

    $f_1(b_1, b_2, \dots, b_n) \quad i = 1, 2, \dots, M \quad (12.1)$

    ```


    minimize the sum of squares


    ```

    $S(b_1, b_2, \dots, b_n) = \sum_{i=1}^{M} [f_i(b_1, b_2, \dots, b_n)]^2. \quad
    (12.2)$

    ```


    It is convenient to collect the $n$ parameters into a vector $b$; unlike the functions
    can be collected as the vector of $M$ elements $f$. The nonlinear least-squares
    problem commonly, but not exclusively, arises in the fitting of equations to data
    by the adjustment of parameters. The data, in the form of $K$ variables (where
    $K=0$ when there are no data), may be thought of as occupying a matrix $\mathbf{Y}$
    of which the $j$th column $y$ gives the value of $j$ at the $M$ data points. The
    terms *parameters*, *variables* and *data points* used as here should be noted,
    since they lead to the least-squares problem


    ```

    $f(b, \mathbf{Y}) = g(b, y_1, y_2, \dots, y_{K-1}) - y_K \quad (12.3)$

    ```


    in which it is helped to fit the function(s) $g$ to the nonlinear $y_K$ by adjusting
    the parameters $b$. This will reduce the size of the functions $f$, and hence
    reduce the sum of squares. $S$ The functions $f$ in equation (12.3) are formed
    as differences, they will be termed *residuals*. Note that the sign of these is
    the opposite of that usually chosen. The preference for which we use here stems
    from the fact that the partial derivatives of $f$ with respect to the parameters
    $b$ are identical to those of $g$ with respect to the same parameters and the
    possibility of sign error in their computation is avoided.'
