    x has been replaced by (x+q).


    S(x+q)≥S(x)


    e is increased by a factor of 10 and the solution of equations (17.24) repeated.
    (In the algorithm below, e is called lambda).


    # 17.5. CRITIQUE AND EVALUATION


    By and large, this procedure is reliable and efficient. Because the bias e is
    reduced after each success, however, there is a tendency to see the following
    scenario enacted by a computer at iteration, that is, at evaluation of J:


    +   (i) reduce e, find S(x+q)≥S(x);

    ii) increase e, find S(x+q)<S(x), replace x by (x+q) and proceed to (i).


    This procedure would be more efficient if e were not altered. In other examples
    one hopes to take advantage of the rapid convergence of the Gauss-Newton part
    of the Marquardt equations by reducing e, so a compromise is called for. I retain
    10 as the factor for increasing e, but use 0-4 to effect the reduction. A further
    safeguard should be included to ensure that e does not approach zero computationally.
    Before this modification was introduced into my program, it proceeded to solve
    a difficult problem by a long series of approximate Gauss-Newton iterations and
    then encountered a region on the sum-of-squares surface where steepest descents
    were needed. During the early iterations it underflowed to zero, and J was singular,
    the program made many futile attempts to increase e before it was stopped manually.


    The practitioner interested in implementing the Marquardt algorithm will find
    these modifications included in the description which follows.


