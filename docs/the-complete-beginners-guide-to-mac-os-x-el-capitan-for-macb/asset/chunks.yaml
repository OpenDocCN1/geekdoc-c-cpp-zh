    \ update, depending on the size of the update and speed of your Internet, it will\
    \ usually take ten to forty minutes to update—and it will need to restart your\
    \ computer to fully install. While it’s updating, you can continue using your\
    \ computer—it will tell you before it restarts so you can save your work. The\
    \ `OS` will do everything for you—the only thing you need to do during the update\
    \ is wait for it to complete.\n\nApple will generally release a new `OS` each\
    \ year (traditionally around the same time that new iPhones are announced).\n\n\
    ### OS X 10.9 Mavericks\n\nIf you are using an older computer and need to install\
    \ the latest `OS` (`El Capitan`), it’s pretty simple. Just go to the app store\
