    Calendar\n\nCalendar is another feature that can be synced to your iCloud account—so\
    \ as long as you’re using the same account, then everything you put in your calendar\
    \ from your computer will also show up on your iPhone and iPad. You can also sync\
    \ the calendar to other ones you may be using online like Google or Yahoo.\n\n\
    To get started with it, go to your Launchpad in the Dock and click on the Calendar\
    \ icon.\n\n![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-19 at\
    \ 2.27.47 PM.png](Images/image00153.jpeg)\n\nAt the top of the application window\
    \ from left to right you have the standard stoplight buttons, Calendars, New Event\
    \ (+), several different views including Day and Month, and the Search bar. \n\
    \n![](Images/image00154.jpeg)\n\nSyncing Calendars\n\nIf you already use a calendar\
    \ with iCloud, Google, Yahoo, or any other provider, you can sync it up with the\
    \ Mac Calendar application. \n\n1.  In the top menu bar click Calendar > Add Account.\n\
    \n2.  Like you did with Mail, you’ll be prompted to enter your name, email address,\
    \ and password. \n\nOnce you finish the setup process your events from that calendar\
    \ should automatically populate in the Calendar window.  If you have multiple\
    \ accounts with separate calendars, you can filter through them by clicking on\
    \ the Calendars button in the toolbar, and checking or unchecking the boxes next\
    \ to the appropriate calendars. \n\nChanging Views\n\nYou can change the calendar\
    \ view between Day, Week, Month, or Year by clicking on the corresponding button\
    \ in the toolbar. \n\n![](Images/image00155.jpeg)\n\nDay will display all of that\
    \ day’s events, broken down by hour.\n\nWeek will show you the whole week at a\
    \ glance, and display blocks for events so you can easily see when you have events,\
    \ and if you have any upcoming free time.\n\nThe Month view will probably be your\
    \ default view if you just need your calendar to remind you about bill payments\
    \ and due dates, or don’t have too many appointments each month but they are scattered\
    \ through the month.\n\n## Reminders\n\nAs the name implies, the Reminders application\
    \ is used to remind you of things—and, as you might have guessed by now, it can\
    \ be synced using iCloud to the Reminders app on your iPhone or iPad.\n\nThe app\
    \ lets you create list for things like groceries or anything else on your mind;\
    \ you can also use the app to schedule when things are do—like paying a bill by\
    \ the 15th of the month; it can even be set to remind you every time you leave\
    \ or arrive at your home to turn your home alarm on or off.\n\nTo get started,\
    \ open the app by clicking on the Launchpad icon, then selecting it from the list\
    \ of apps.\n\n![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-19\
    \ at 2.36.30 PM.png](Images/image00156.jpeg)\n\n![](Images/image00157.jpeg)\n\n\
    ### Creating Single Reminders\n\nIf you just need to be reminded of a single item,\
    \ or several unrelated items, you should enter them into the Reminders list. \n\
    \n1.  With the application open, click on Reminders in the left hand window. \n\
    \n2.  In the main window, click on the (+) button next to the title of the list\
    \ (“Reminders” in this case).\n\n3.  A new item will be added that you should\
    \ name immediately.  Notice the radio button that appears next to the newly-created\
    \ item. \n\n4.  Once the item is named, double click on it to open up the information\
    \ pane.\n\n5.  Here you’ll be able to set the reminder date and time, priority\
    \ level, and if you’d like to be reminded as you are arriving or leaving someplace. \n\
    \n6.  Fast forward to the day of the reminder; once you have completed the task,\
    \ you can click on the radio button next to the item to mark it as Completed. \n\
    \n7.  You’ll then be able to hide or show any previously completed items.\n\n\
    8.  To delete items whether complete or incomplete, click on the name to highlight\
    \ it and press the Delete key. \n\n### Creating New Lists\n\nSingle list are great\
    \ for things like “open the gate Monday for the gardener” or “Pay the utility\
    \ bill on Tuesday” but if you want to create reminders for things like shopping\
    \ lists, then you’ll need to create a reminder list—these can be as long (or short)\
    \ as you want.\n\n1.  Open up the Reminders application if you closed out of it\
    \ before.\n\n2.  On the left hand side of the window, at the bottom you will see\
    \ (+) Add List.  Click it and enter a name for your newly-created list. \n\n![](Images/image00158.jpeg)\n\
    \n3.  Once the new list is named, click on it and press the (+) button next to\
    \ the list title as you did with Reminders to add new items.  You can also choose\
    \ whether you want due dates or not. \n\n### Location Based Reminder\n\nIf you\
    \ want to create a reminder that is location based (i.e. “when I leave work, remind\
    \ me to call wife”) then follow the steps above.\n\nClick the Information icon\
    \ next to the reminder (the “i” with a circle)\n\n![Macintosh HD:Users:scottlacounte:Desktop:Screen\
    \ Shot 2015-04-19 at 2.54.16 PM.png](Images/image00159.jpeg)\n\nThis will bring\
    \ up a few extra options. One says, “remind me” with a checkbox for “At a location”;\
    \ click that checkbox. Next, enter the address, and select if you want the reminder\
    \ when you get there or when you’re leaving there.\n\n![Macintosh HD:Users:scottlacounte:Desktop:Screen\
    \ Shot 2015-04-19 at 2.54.34 PM.png](Images/image00160.jpeg)\n\n## Notes\n\nNewer\
    \ Macs come with Pages preinstalled, so what’s the point of notes? Notes is a\
    \ more basic program than Pages or Word—you can’t do any fancy formatting. The\
    \ advantage is that it opens and saves quickly. So in short, Notes is for when\
    \ you just need to jot something down quickly.\n\nTo open it, go to the Launchpad\
    \ icon on your Dock and click the Notes icon.\n\n![Macintosh HD:Users:scottlacounte:Desktop:Screen\
    \ Shot 2015-04-19 at 4.55.33 PM.png](Images/image00161.jpeg)\n\nNotes, like most\
    \ of the apps in El Capitan, syncs to your iPhone and iPad as long as you are\
    \ logged into the same iCloud account.\n\n![](Images/image00162.jpeg)\n\n### Creating\
    \ and Editing Notes\n\n1.  There are a few different ways to create a brand new\
    \ note.  You can start a new note by clicking on the Compose icon (the square\
    \ with a pencil going through it), or double clicking an empty space in the left\
    \ sidebar.  You can also right-click the left sidebar and select New Note.\n\n\
    2.  Once the note is created, the line will begin blinking in the right window,\
    \ indicating that it’s time for you to get writing. \n\n3.  The notes will automatically\
    \ save as you type, so exiting Notes won’t mean you lose progress. \n\n4.  If\
    \ you need to pick up where you left off on a note, you can use the search bar\
    \ to find the exact note you are looking for, or scroll through the left sidebar\
    \ and select the appropriate note.  With the note highlighted, click anywhere\
    \ in the right window to begin editing that note, or double-click to open up a\
    \ smaller window.\n\n5.  To remove notes, find the one you’d like to delete and\
    \ highlight it.  Press the Delete key and confirm it.  You can also right-click\
    \ a note and select Delete. \n\nNotes can be shared through different outlets\
    \ like LinkedIn, Facebook, Mail, and Messages.  If you’d like to share a note,\
    \ click on the Share button in the top right corner and select how you’d like\
    \ to send it. "
