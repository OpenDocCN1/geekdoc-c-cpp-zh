- fmt: '

    Cover Flow lets you quickly go through thumbnails / previews of photos (it’s a
    little like Film Strip in Windows); you can also sort any of the columns by clicking
    on the header—so if you are looking for a larger file, then click the `Size` column
    or if you are looking for a recent file, then pick the `Date Modified` column.


    ## Icon View


    ![](Images/image00109.jpeg)


    Icon View can help if you need to sort through several image files or applications.
    It gives you either a thumbnail of each picture or an icon for each file or app.


    ## List View


    ![](Images/image00110.jpeg)


    List View, on the other hand, gives you more information about the file, including
    the date it was last modified. This is the perfect view for sorting.


    ## Column View


    ![](Images/image00111.jpeg)


    Finally, Column View which is kind of a hybrid of List View and Cover Flow View.
    It shows the folder hierarchy a file is located in. Notice that Finder doesn’t
    include the Windows “go up one level” button – Column View is a good way to get
    the same results and navigate easily through your file structure.


    ## Sorting in Finder


    ![](Images/image00112.jpeg)


    Finder gives you a number of ways to sort your files and folders. You can sort
    by name, type, application required for opening the file (like Microsoft Word,
    for example), the date the file was created, modified, or opened, the file size,
    and any tags you may have applied.


    ## File Management


    ![](Images/image00113.jpeg)


    Most file management tasks in OS X are similar to Windows. Files can be dragged
    and dropped, copied, cut and pasted. If you need to create a new folder, use the
    Gear icon in Finder, which will give you the option you need.


    El Capitan also allows you to batch rename files (i.e. rename several files at
    once instead of one at a time), potentially saving you hours of time, depending
    on your file system. To take advantage of this, select the files you’d like to
    rename (hint: use `COMMAND + click` to select multiple files, or use `COMMAND
    + A` to select everything). Then right-click the selected files and choose “Rename
    X items.”


    ![](Images/image00114.jpeg)


    You’ll then have the option to replace text or to add text to the file names.


    ![](Images/image00115.jpeg)


    ## Favorites


    If you look on the left side of the Finder Window, you’ll see a Favorites sidebar.
    This section includes high-frequency folders, like Documents, Pictures, Downloads,
    and more.


    ![](Images/image00116.jpeg)


    To add an application or file to your Favorites menu, just drag it over to the
    Favorites area and drop it. To remove an item from Favorites, right-click it (click
    with two fingers) and select Remove From Sidebar.


    ## Tabbed Browsing


    Apple took a page from Internet browsers by adding something called “Tabbed Browsing”
    to Finder. Basically instead of having several Finder boxes open (which is how
    you had to do it in older OS’) you open tabs. To open an additional Finder tab,
    press `COMMAND+t` or click `File` and `New Tab`.


    ![](Images/image00117.jpeg)


    If you want to merge all of your tabbed windows, just click `Windows` in the file
    menu on the top of your screen, and then `Merge All Windows`.


    ## Tags


    ![](Images/image00118.jpeg)


    If you use photo apps like Flickr, then you probably know all about tagging; it’s
    essentially adding subjects to your file to make it easier to find. Let’s say
    the file is regarding the 2015 tax year—you can add a tag to the file called “2015
    Taxes” or whatever you want it to be. You can also color code it.


    To assign a tag to a file (you can also assign it to a folder), click the file
    / folder with two fingers, and then click `tags`; if this is your first take just
    type it in and hit `Enter`; if you’ve already tagged a file and want to use the
    same name, then click the name of the tag as it appears.


    ## Launchpad


    Launchpad is essentially the Start menu on a Windows computer. It shows your programs.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-15 at 9.33.45 AM.png](Images/image00089.jpeg)


    When you click it, you’ll see rows of programs; you can immediately start typing
    to search for an app, or you can just look for it. If you have a lot of apps,
    then you probably have more than one screen. Swipe with two fingers to the left
    to see the next screen.


    ![](Images/image00119.jpeg)


    Launchpad takes a lot of cues from iPhone and iPad. If you want to remove a program,
    for example, you do it the same way you remove an iPhone or iPad app. Just click
    and hold until an `X` appears above it, then click the `X` to remove it. Similarly,
    to rearrange icons, use the same method for rearranging iPhone / iPad apps—click
    and hold over the icon until it begins to shake, and then move it wherever you
    want it to go. You can even put programs into groups the same way as an iPhone
    / iPad—click and hold over the icon, then drag it on top of the app you want to
    group it with; finally, when the folder appears, you can let go.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 2.59.30 PM.png](Images/image00120.jpeg)


    After you delete a program, you can re-download it anytime, by going into the
    app store (as long as you downloaded it from the app store and not from a website).


    ## Notifications


    For the past few updates, Apple has attempted to replicate iOS (iPad / iPhone)
    features; the move is meant to make using a Mac much like using a mobile device.
    This attempt at replicating features is especially true with El Capitan OS.


    Notifications is a new feature to OS X Yosemite. You can find it on the top menu
    button at all times; it’s to the far right hand corner and looks like this:


    ![](Images/image00121.jpeg)


    Click it any time you want to see alerts. You can also access it by swiping with
    two fingers to the left from the edge of your trackpad.


    ![](Images/image00122.jpeg)


    When you swipe down from the top of an iPad or iPhone you will get a similar screen.
    There are two parts of the Notifications menu: `Today` and `Notifications`.


    The `Today` tab is where you’ll see things happening in the moment—what’s the
    weather, what’s in your calendar, what’s going on with your stocks, etc. The `Notifications`
    tab is where you’ll see things like Facebook messages or emails. Later in this
    book, I’ll show you how to customize it.


    ## Split View


    Split view is perhaps the biggest added feature to OS X. It let’s run two apps
    side-by-side—but there’s a catch: not all apps are compatible. So if you scratching
    your head because this feature won’t work, then chances are it’s not that you
    are doing it wrong—it’s that the app doesn’t support it.


    There are two ways to get split view to work. Let’s look at both of them. First
    make sure the two apps you want to run are not running in full screen.


    Click and hold the green button in the upper left corner of your app. ![](Images/image00123.jpeg)


    A transparent blue box will appear; drag and drop the app into it (by default,
    the blue is on the left side, but if you drag to the right side, it will also
    turn blue and you can drop it in).


    ![](Images/image00124.jpeg)


    Next, click the program you want to use side-by-side.


    ![](Images/image00125.jpeg)


    A side-by-side window now appears; you can use the middle black line to make one
    bigger or smaller, by dragging left or right.


    ![](Images/image00126.jpeg)


    To return to the normal view, click the green button in the upper left corner
    of the app once more (you can also hit the `ESC` key on your keyboard).


    ### Method 2


    As you are probably noticing, most things in OS X can happen by several different
    methods; side-by-side view has two. The second way to get apps is to open your
    Mission Control, and drag the app to the top menu. ![](Images/image00127.jpeg)


    You’ll notice, a grey box appear and the box appears to split.


    ![](Images/image00128.jpeg)


    Once you drop it into that box, you’ll see a side-by-side preview. Once you click
    the preview, it will maximize. ![](Images/image00129.jpeg)

