    If you’re signed into iCloud, then you should see dozens of contacts already.
    To create a new contact, click on the `(+)` button at the bottom of the main window.
    On the next screen add all the info you want—it can be as much or as little as
    you desire. Some contacts may only need a website address, others might have mailing
    address—it’s entirely up to you how much information you add. You can also edit
    a contact by finding their name, then clicking on the `Edit` button. If you want
    to delete someone, then find their name and hit `Delete` on your keyboard (you
    can also delete by clicking on their name with two fingers).


    # Messaging / Phone Calls


    Apple products really work best with other Apple products; that’s even truer with
    El Capitan, where you can sync your iPhone account to make phone calls (both video
    and regular) and send messages right from your Mac. Additionally, you can even
    use your iPhone’s data connection to get Internet on your laptop on the go—this
    is especially handy while travelling if you don’t want to pay for Wi-Fi spots
    that charge for access (just keep in mind that your data connection does have
    monthly limits and using a computer can go through those limits very quickly—in
    other words, this probably isn’t something you want to do to stream Netflix movies).


    ![](Images/image00140.jpeg)


    ## iMessage


    When you use iMessages from your Mac to send messages, just keep in mind that
    it’s kind of instant messaging for Mac users—that means it’s designed to work
    with Mac products…nothing else.


    ### Setting Up iMessage


    1. To set up iMessage, click the `Messages` icon to launch it.

    2. If you were already logged into iCloud on the Mac, you will automatically be
    logged into iMessage.

    3. If you’d like to change this account or haven’t yet logged in, select `Messages
    > Preferences` on the top menu bar.

    4. When the `Accounts` dialogue box comes up, click on the `Accounts` tab.

    5. In the left hand window, you will see iMessage. Select it.

    6. The following screen will prompt you to enter the email address and password
    associated with iCloud. Do so and click the blue `Sign In` button to complete
    the setup process.


    ### Setting Up Other IM Clients


    While iMessage is made for Mac products, you can use it for other messaging servers
    like Google, Yahoo, and AOL. To add other instant messaging (IM) clients to Messages:


    1. Open up `Messages` if it isn’t already running.

    2. On the top menu bar, click `Messages > Add Account`.


    ![](Images/image00141.jpeg)


    3. Select the type of account that you’d like to add, such as `Gmail` or `Yahoo`,
    and select `Continue`.

    4. You will be prompted to enter the appropriate email address and password, and
    click the `Set Up` button to finish.


    So now that it’s set up, how do you send a message?


    ### Start New Conversation


    1. Before we begin, take a look at the entire `Messages` screen. It should be
    totally empty with no conversations. On the left sidebar it will say `No Conversations`.
    This is where you will be able to change between different conversations with
    people by clicking on each one. On the right hand side, you will also see `No
    Conversation Selected`. Here is where you will be able to type new messages and
    read everything in whatever conversation is currently selected. If you have an
    iPhone (or any phone for that matter), it will be like the screen where you read
    your text messages.

    2. To create a new conversation with someone, click the `Compose new message`
    button located at the top of the left sidebar, next to the search bar. It should
    look a little pencil inside of a square.


    When you get a message, if your sound is enabled, you’ll get a little chime.


    ## FaceTime


    FaceTime allows you to connect with friends and family using your computer’s built-in
    camera. I’ve heard people say they are worried that someone is watching them through
    their webcam that they cover it with tape. When FaceTime is in use (i.e. when
    the camera is on and people can see you) a bright green light comes on—so you
    don’t to worry about people spying on you…if you don’t see the light, then the
    camera is off.


    The app can be launched by clicking on `Launchpad > FaceTime`.


    ![](Images/image00142.jpeg)


    On the left side you can enter a person’s name if they are in your `Contacts`,
    or a phone number. For FaceTime to work, the other person must also have an Apple
    device, and accept your call.


    You can also use FaceTime audio. This lets you call someone without the camera—it’s
    essentially a Wi-Fi phone call.


    ## Photo Booth


    We’re a culture of selfies, so it’s appropriate to talk about the app that takes
    your picture.


    To get started, go to `Launchpad` and click the `Photo Booth` icon.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 10.10.18
    AM.png](Images/image00143.jpeg)


    Couple of things you should notice once the app loads. First, you! If you look
    to the top of your screen, there should be a green light. That tells you the camera
    is on. But now click on a different app in your `Dock`—see how the green light
    goes off? And now click on the `Photo Booth` icon again, and once again the green
