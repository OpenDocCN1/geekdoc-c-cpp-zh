    \ followed by the C key.  When enabled, you’ll hear a lock sound, and anytime\
    \ you use a modifier key like Command, a large icon will appear in the top right\
    \ corner of the screen indicating that a Sticky Key combination has been started. \
    \ Slow Keys increases the amount of time between a button press and activation,\
    \ so if you press Enter, it will take a little longer to actually process. \n\n\
    Mouse & Trackpad features settings like Mouse Keys, which lets you move the mouse\
    \ around using the number pad on your keyboard, double-click speed, and the option\
    \ to ignore the built-in trackpad (on MacBooks) if there is a separate mouse or\
    \ trackpad connected to the computer.\n\nSwitch Control requires you to enter\
    \ your administrator before making any changes, because it’s a powerful function\
    \ that allows you to control the computer using one or more switches that you\
    \ designate.  You can also modify other settings like what to do while navigating,\
    \ determine pointer precision, and change the size for the Switch Control cursor.\n\
    \nThe Dictation tab does exactly what it sounds like – it lets you dictate commands\
    \ and write or edit text using only your voice.  To enable dictation, you first\
    \ need to click on the bottom button that says Open Dictation & Speech Preferences\
    \ and selecting the On radio button.\n\n### \n\nPrivacy and Security\n\nIf your\
    \ computer is in a place where other people can get to it, or if you are just\
    \ generally concerned about your privacy being violated, then head on over to\
    \ Privacy and Security in the System Preferences.\n\n#### Creating Strong Passwords\n\
    \nStrong passwords are the first line of defense against potential hackers (or\
    \ smart children!); a strong password is not something like “password”; a strong\
    \ password has letters, numbers and even symbols in it. It could be something\
    \ like this: “@mY_MACb00k.”"
