    封面流视图（Cover Flow）可以让你快速浏览照片的缩略图/预览（类似于 Windows 中的“胶片显示”）；你还可以通过点击表头对任何一列进行排序——例如，如果你在寻找较大的文件，可以点击`大小`列；如果你在寻找最近的文件，可以选择`修改日期`列。


    ## 图标视图


    ![](img/image00109.jpeg)


    如果你需要对多个图像文件或应用程序进行排序，图标视图会很有帮助。它可以为你提供每张照片的缩略图，或者每个文件或应用的图标。


    ## 列表视图


    ![](img/image00110.jpeg)


    相反，列表视图提供了更多关于文件的信息，包括最后修改日期。这是排序的完美视图。


    ## 列视图


    ![](img/image00111.jpeg)


    最后是列视图，它是列表视图和封面流视图的一种混合体。它显示了文件所在的文件夹层级结构。注意，Finder 并不包含 Windows 的“向上一级”按钮——列视图是获得相同结果并在你的文件结构中轻松导航的好方法。


    ## 在 Finder 中排序


    ![](img/image00112.jpeg)


    Finder 提供了多种对文件和文件夹排序的方法。你可以按照名称、类型、打开文件所需的应用程序（例如 Microsoft Word）、文件创建、修改或打开的日期、文件大小以及你可能应用的任何标签进行排序。


    ## 文件管理


    ![](img/image00113.jpeg)


    OS X 中的大多数文件管理任务与 Windows 类似。文件可以被拖放、复制、剪切和粘贴。如果你需要创建一个新文件夹，请使用 Finder 中的齿轮图标，它将为你提供所需的选项。


    优金石狮版（El Capitan）还允许你批量重命名文件（即一次性重命名多个文件，而不是一个一个），取决于你的文件系统，这可能会为你节省数小时的时间。要利用这一点，请选择你想要重命名的文件（提示：使用
    `COMMAND + click` 选择多个文件，或使用 `COMMAND + A` 选择全选）。然后右键点击选中的文件并选择“重命名 X 个项目”。


    ![](img/image00114.jpeg)


    然后你将拥有替换文本或向文件名中添加文本的选项。


    ![](img/image00115.jpeg)


    ## 收藏


    如果你查看 Finder 窗口的左侧，你会看到一个“收藏”侧边栏。此部分包含高频文件夹，如“文档”、“图片”、“下载”等。


    ![](img/image00116.jpeg)


    要将应用程序或文件添加到你的收藏菜单中，只需将其拖到收藏区域并放开。要从收藏中删除项目，请右键点击它（用两个手指点击）并选择“从侧边栏移除”。


    ## 标签浏览


    Apple 借鉴了网络浏览器的做法，在 Finder 中添加了名为“标签浏览”的功能。基本上，你不再打开多个 Finder 窗口（在旧版操作系统中你必须这样做），而是打开标签页。要打开额外的
    Finder 标签页，按 `COMMAND+t` 或点击“文件”并“新建标签页”。


    ![](img/image00117.jpeg)


    如果你想合并所有的标签窗口，只需点击屏幕顶部文件菜单中的“窗口”，然后点击“合并所有窗口”。


    ## 标签


    ![](img/image00118.jpeg)


    如果你使用像 Flickr 这样的照片应用，那么你可能对打标签非常熟悉；它本质上是给你的文件添加主题，使其更容易找到。假设文件是关于 2015 税年的——你可以给文件添加一个名为“2015
    税务”或任何你想要的标签。你还可以对它进行颜色标记。


    要给文件分配标签（你也可以给文件夹分配标签），用两个手指点击文件/文件夹，然后点击`标签`；如果这是第一次操作，只需输入并按`回车`；如果你已经标记过文件并想使用相同的名称，只需点击显示的标签名称。


    ## 启动台


    Launchpad 本质上是 Windows 上的开始菜单。它显示了你的程序。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-15 at 9.33.45 AM.png](img/image00089.jpeg)


    当你点击它时，你会看到行程序；你可以立即开始输入搜索应用，也可以直接查找。如果你有很多应用，那么你可能有多个屏幕。用两个手指向左滑动以查看下一屏。


    ![](img/image00119.jpeg)


    Launchpad 参考了大量 iPhone 和 iPad 的设计。例如，如果你想删除一个程序，操作方法与删除 iPhone 或 iPad 应用相同。只需点击并按住直到上方出现一个
    `X`，然后点击 `X` 删除。同样，要重新排列图标，使用重新排列 iPhone / iPad 应用相同的方法——点击并按住图标直到它开始移动，然后将其移动到你想去的地方。你甚至可以像在
    iPhone / iPad 上一样将程序分组——点击并按住图标，然后将其拖到你想要分组的程序上方；最后，当文件夹出现时，你就可以松手了。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-15 at 9.33.45 AM.png](img/image00114.jpeg)

