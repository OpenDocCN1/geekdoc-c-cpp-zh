    ## 传输文档


    在更新任何电脑时，很多人担心的问题就是如何将所有信息从旧电脑转移到新电脑。对于 Mac 来说，这是一项非常简单的任务——你甚至可以去当地的 Apple Store
    寻求免费帮助（需要提前预约，所以不要直接过去）。


    如果你不想等预约，或者你只是喜欢自己动手，你的电脑上已经有一个工具可以帮助你了：它被称为 `Migration Assistant`（迁移助理）。请注意，你需要连接网络。


    开始之前，前往你的 Windows 电脑，在任何搜索引擎中搜索“Windows Migration Assistant”，或直接访问 [`support.apple.com/kb/DL1557?locale=en_US`](https://support.apple.com/kb/DL1557?locale=en_US)。访问后，在你的
    Windows 电脑上下载并安装该程序。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-16 at 5.32.48 PM.png](img/image00093.jpeg)


    在你的 Mac 上，点击 Launchpad 图标（即任务栏上的火箭）。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-15 at 9.33.45 AM.png](img/image00089.jpeg)


    接下来点击“其他”（Other），然后点击 `Migration Assistant`。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-16 at 5.29.11 PM.png](img/image00094.jpeg)
    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-16 at 5.29.24 PM.png](img/image00095.jpeg)


    使用 `Migration Assistant` 时，Mac 上打开的所有程序都将被关闭，因此请确保已保存好你的工作，并在准备好之前不要开始。


    在设置界面中，点击“继续”（Continue），然后选择“来自另一个 Mac、PC、Time Machine 备份或其他磁盘”，接着选择“继续”，然后选择“来自另一台
    Mac 或 PC”。下一个窗口应该显示你想要传输文件的 Windows 电脑。点击“继续”，在 Windows 电脑上确认验证码匹配并再次点击“继续”。最后，助理会要求你选择想要传输的文件类型。


    如果你没有立即运行助理，也可以以后再使用。使用它没有时间限制，所以如果你在车库里翻出一台旧的 Windows 电脑并想从那里传输所有内容，该选项一直都在。


    ## 兼容性


    现在你已经复制了所有内容，让我们来简要讨论一下兼容性。虽然很多文件可以在 Mac 上打开，但软件却不行。这意味着如果你在 Windows 上有 Word，你不能直接把它移动过来；大多数流行软件（如
    Word）在 Mac 上都有提供，但你必须自行购买。


    不要压力太大；你刚刚传输的大部分文件即使不购买软件来打开它们，实际上仍然可以打开。例如，Word 文件（`.Doc`, `.Docx`）可以在 `Pages`
    中打开（Pages 在新款 Mac 上是免费的，在旧款 Mac 上价格为 19.99 美元）。


    如果你的文件无法打开，你可能可以在网上找到可以打开它的免费软件。


    ## 设置助理


    如果你是第一次启动 Mac（并且你是第一位所有者），那么发生的第一件事将是一个自动设置助理，它将引导你创建账户并完成所有设置。


    你做的第一件事是选择你所在的国家；如果没看到你的国家，请点击“显示所有”（See All）。在完成每个部分后点击“继续”。接下来你将选择键盘布局；如果你是英语母使用者，那么“美国”（United
    States）可能是你的首选，但如果你打算主要用另一种语言（如中文）打字，那么你可能想选择该国家——这以后可以更改。


    点击“继续”后你看到的下一件事是选择无线网络——你现在不需要设置无线网络，但如果你设置了，它也会触发 `Migration Assistant`（这将帮助你传输文件）；这些都是自可选的，所以你可以跳过（你也可以以后回来设置）。


    下一个屏幕是最重要的之一：输入你的 Apple ID。如果你有任何其他 Apple 设备（iPad、iPod、iPhone 等）或者你有一个在 Windows
    上使用的 ID，那么你将想要使用它，因为你购买过的所有 App、音乐和其他媒体都与你的账户绑定。如果你没有，你可以选择获取一个——它是免费的，并包含了 `iCloud`（也是免费的），稍后会详细介绍。


    设置的下一部分是“Find My Mac”（查找我的 Mac，这需要 `iCloud`）；这是一个很棒的功能，让你能从浏览器浏览器查看 Mac 的位置；如果它被盗了，它还能让你擦除所有内容。


    在同意条款后，你将被带到时区选择。之后，系统会询问你是否启用 `iCloud Keychain`（iCloud 钥匙）。什么是 `iCloud Keychain`
    ？它会将密码存储在云端，让你可以在任何设备上使用。


    接下来决定是否向 Apple 发送诊断数据。最后，你准备好了！


    # 第一部分：Mac OS 入门课程


    ## 键盘


    除了前面提到的右键点击，Windows 和 Mac 的键盘工作方式大同小异。有些键盘（包括 MacBook 自带的）是专门为 Mac 设计的。


    ### Apple 键


    在 Windows 键盘上，有一个看起来像 Windows 标志的按钮叫做 Windows 键。Mac 上没有 Windows 键，所以在通常 Windows
    键的位置，有一个 Apple 键——它看起来像这样（⌘）；它通常被称为 `Command Button`，尽管有些人称它为 Command 键。


    ### Delete 键（退格）


    在 Windows 键盘上，退格键是“向后删除”，而删除键是“向前删除”（删除光标后的后的字符）。在 Mac 键盘上，退格键标记为 `Delete`，且位置与
    Windows 的退格键相同。大多数 Mac 键盘不再配备向前删除键，但较较大的键盘有——它被称为 `Del`。如果你没看到它，仍然可以通过按下 `FN`
    键（键盘左下角的按钮）和 `Delete` 键来实现向前删除。


