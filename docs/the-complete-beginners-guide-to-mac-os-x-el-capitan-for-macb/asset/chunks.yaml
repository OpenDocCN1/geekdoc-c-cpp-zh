    如果你想使用一些更酷炫的效果，将你带到某个不在的地方（例如约瑟米蒂或海滩），那么它会要求你离开画面以便它检测背景；几秒钟后你再走回来。对于这种效果，最好使用纯色背景。如果你对显示效果不满意，可以通过顶部的菜单栏，点击“查看”（View），最后点击“重置效果”（Reset
    effect）。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 10.46.59
    AM.png](img/image00152.jpeg)


    如果你想添加自己的背景，请转到“效果”（Effects）的最后一页，将你选择的照片拖入方框中。一旦看到该照片出现，点击它即可激活该效果。


    不要害怕尝试这个程序。你按的任何东西都不会弄乱任何！


    ## 日历


    日历是另一个可以同步到你的 iCloud 账户的特性——只要你使用同一个账户，你在电脑上输入到日历中的所有内容都将出现在你的 iPhone 和 iPad 上。你还可以将日历同步到你可能在线使用的其他日历，如
    Google 或 Yahoo。


    要开始使用，前往 Dock 中的启动台（Launchpad）并点击日历图标。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-19 at 2.27.47 PM.png](img/image00153.jpeg)


    在应用程序窗口顶部从左到右，你有标准的红绿灯按钮、日历、新建事件 (+)、包括日和月在内的多种视图，以及搜索栏。


    ![](img/image00154.jpeg)


    ### 同步日历


    如果你已经在使用 iCloud、Google、Yahoo 或任何其他提供者的日历，你可以将其同步到 Mac 日历应用程序。


    1. 在顶部菜单栏中点击 `日历` (Calendar) > `添加账户` (Add Account)。

    2. 就像你处理邮件一样，系统会提示你输入姓名、电子邮件地址和密码。


    一旦完成设置过程，来自该日历的事件将自动填充到日历窗口。如果你有多个带有独立日历的账户，可以通过点击工具栏上的 `日历`（Calendars）按钮，并勾选或取消勾选相应日历旁边的框来筛选。


    ### 更改视图


    你可以通过点击工具栏上相应的按钮在日、周、月或年日历视图之间切换。


    ![](img/image00155.jpeg)


    日视图将显示当天的所有事件，按小时划分。


    周视图将让你一目了然看到一周，并显示事件块，你可以轻松看到自己什么时候有活动，以及是否有即将到来的空闲时间。


    如果你只需要日历提醒你支付账单和截止日期，或者每个月的预约不是太多但分散在整个月里，那么月视图可能是你的默认视图。


    ## 提醒


    正如名称所示，“提醒”（Reminders）应用程序用于提醒你事情——正如你现在可能猜到的那样，它可以使用 iCloud 同步到 iPhone 或 iPad
    上的提醒应用。


    该应用允许你为杂货清单或脑海中的任何其他事项创建列表；你还可以使用该应用安排完成事项的时间——例如在每月的 15 号之前支付账单；它甚至可以设置为在你每次离开或到达家中时提醒你开启或关闭家庭报警器。


    要开始使用，点击启动台图标打开应用，然后从应用列表中选择它。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-19 at 2.36.30 PM.png](img/image00156.jpeg)


    ![](img/image00157.jpeg)


    ### 创建单个提醒


    如果你只需要被提醒某项项目，或几个互不相关的项目，你应该将它们输入提醒列表。


    1. 在应用程序打开状态下，点击左侧窗口中的 `提醒` (Reminders)。

    2. 在主窗口中，点击列表标题（在此情况下为 `提醒`）旁边的 `(+)` 按钮。

    3. 将添加一个新项目，你应该立即对其命名。注意新创建项目旁边出现的单选按钮。

    4. 项目命名完成后，双击击它以打开信息窗格。

    5. 在这里你可以设置提醒日期和时间、优先级级别，以及你是否希望在到达或离开某地时收到提醒。

    6. 快到提醒的那一天；一旦你完成了任务，可以点击项目旁边的单选按钮将其标记为`已完成` (Completed)。

    7. 之后你就可以隐藏或显示任何之前已完成的项目。

    8. 要删除无论完成或未完成的项目，点击名称将其高亮并按 `删除` (Delete) 键。


