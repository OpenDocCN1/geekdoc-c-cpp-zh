    # Internet


    The Mac is a beautiful machine, but you can only admire that desktop for so long;
    eventually you’ll want to get on the Internet, so let me explain how.


    There are two methods: Ethernet (i.e. plugging in a LAN cable to your computer)
    and Wireless.


    ### Setting Up With Ethernet


    All new Mac computers are set up with Wi-Fi; iMacs also have Ethernet ports to
    plug in a network cable. This option isn’t available on any of the Mac laptops—though
    you can buy an adaptor if you absolutely must have it.


    If you have a basic Internet modem, then set up is pretty easy. Just plug a network
    cable into your Internet hub, and plug the other end into your Mac. Once it’s
    plugged in, the Internet should work.


    Newer Macs come with top of the line wireless radios for Wi-Fi, so you should
    be perfectly fine without using the Ethernet port.


    ### Setting Up Wireless Networks


    Setting up a wireless connection is also pretty simple. Just click the Wi-Fi menu
    on the menu bar. It looks like the image below and is near the upper right corner:


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 3.25.15 PM.png](Images/image00130.jpeg)


    As long as there’s a wireless network in range, it will show up when you click
    it (sometimes it does take a few seconds to appear).


    ![](Images/image00131.jpeg)


    If there’s a lock next to the Wi-Fi name, then you’ll need to know the passcode
    (if it’s a home Internet connection, then it’s usually on the bottom of your Internet
    modem; if it’s at a business, then you’ll have to ask for the code. If there’s
    no lock, then it’s an open network. You usually see this kind of network at places
    like Starbucks.)


    If it’s a locked network, then as soon as you click on it, it will ask for the
    code; once it’s entered and you click `Connect`, then you’re connected (assuming
    you added it right); if it’s not locked then once you click on it, then it will
    attempt to connect.


    If you own one of the above-mentioned computers, or would rather connect to a
    network wirelessly, you can do it by clicking on the Wi-Fi menulet in the top
    menu bar.


    ### Airport Express / Airport Extreme


    If you need more range in your wireless connection, or want to set up a private
    network, Apple sales to Mac accessories. One is the Airport Express ($99) and
    the other is the Airport Extreme ($199 or $299 to $399 if you’d like one with
    a hard drive).


    The Express is a good option for people wanting to add a private network (so,
    for instance, you can have a network just for guest and guest printing); the Airport
    Extreme gives excellent range; I use one in my home because the modem supplied
    with my phone company could barely reach the next room over and the signal strength
    was weak; the Extreme not only got to the next room, but it got several more rooms—I
    can now get a signal more than 100 feet from where the Extreme is located. It’s
    a pretty easy installation, and Apple has videos for those who need extra help.


    The more expensive models are also a good option for backing up computers. The
    $299 and $399 models offer up to 3TB of storage; the way it works is your computer
    connects to it, and will back up your computer in the background, so your computer
    is always being backed up. These models also let you share files. So, for instance,
    if you want a private storage locker for anyone who connects to your network,
    then you could do so here.


    # Safari


    Just as a Windows computer has Internet Explorer as the default web browser, Mac
    has Safari as the default web browser; if you’ve used Safari on your iPhone or
    iPad then you should already be accustomed to using it.


    ![](Images/image00132.jpeg)


    Noticeably absent from Safari is something called “Flash”. Flash is what you might
    used to watch some videos and other web apps; you can always download it, but
    this will affect the battery life of your laptop, as Flash tends to drain the
    battery quickly—which is one of the reasons Apple does not include it.


    You are also free to download other Internet browsers. Some of the popular free
    ones are Google Chrome ([www.google.com/chrome/](http://www.google.com/chrome/)),
    Mozilla Firefox ([www.mozilla.org/firefox](http://www.mozilla.org/firefox)), and
    Opera ([www.opera.com](http://www.opera.com)).


    One of the biggest advantages of using Safari over another web browser is a feature
    called Handoff. Let’s say you’re reading an article on your phone on the subway
    coming into work; you get to work and want to pick up where you left off on a
    larger Mac screen; just open up Safari, then click the two square boxes in the
    upper right corner.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 5.32.45 PM.png](Images/image00133.jpeg)


    If your iPhone or iPad is synced with the computer, then you’ll see its name and
    pages that it’s currently browsing. You can also handoff a Mac page to your iPhone
    or iPad in the same way.


    In addition to websites, handoff also lets you seamlessly sync things like maps,
    messages, and documents (Pages, Numbers, and Presentation documents).


    # Mail


    Mail is the Mac equivalent of Outlook; like Safari, it works in a very similar
    way to iPad and iPhone. Apple will provide you with a free email address that
    ends @icloud.com, but you can also add normal email into the application (like
    Hotmail, Yahoo, and Gmail).


    ![](Images/image00134.jpeg)


    ### Adding Accounts


    To get started, you need to add your email account. Locate the Mail app by clicking
    on Launchpad, and then clicking the Mail app icon.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 5.57.03 PM.png](Images/image00135.jpeg)


    Once the app opens, go to the top menu bar and click `Mail` > `Add Account`. This
    will load the Add Account dialogue box.


    ![](Images/image00136.jpeg)


    Select the provider that you will be adding in (Note: you can go back and add
    as many accounts as you want) and click `Continue`. Next you’ll be asked what
    your Name, Email Address, and Password is.


    ![](Images/image00137.jpeg)


    If you are using a popular email provider, set up is pretty self-explanatory.
    If you are using a business email, then you will probably need to work with your
    system administrator to get it added correctly.


    Once it’s set up, you should start seeing mail show up on your computer.


    ### Sending an Email


    Now that you have an account added, you can start sending mail; to send mail you
    can either press `Command+N` on your keyboard, go to the top menu and select `File`
    and `New Message`, or click the `Compose` icon (it looks like a pencil going through
    a square).


    ![](Images/image00138.jpeg)


    The New Message dialogue box will appear.  In the To field, enter the email address
    or addresses that you’d like to send a message to, add in a subject and message,
    and then hit the paper airplane in the upper left corner when you are ready to
    send the message.


    You can also add formatting to the message by clicking on the `A` button. Formatting
    is very basic—you can bold, add italics, underline, and change the coloring.


    ### Contacts


    Unless you are a business person, having contacts on your computer might not seem
    necessary; here’s the advantage of it—it syncs with your phone. So having a contact
    on your computer will carry over to your other mobile devices. To use it, go to
    your Launchpad, then click the icon.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 6.22.19 PM.png](Images/image00139.jpeg)

