    At the bottom, you will be able to change the picture every so often, and you
    can choose how often you’d like a new image to refresh. The images that show up
    in the right-hand window will be the ones that get scrolled through during refreshes.


    To change your desktop wallpaper to one of the great-looking images provided by
    Apple, or if you just want to browse the available choices, click on the Apple
    name. A bunch of colorful, high-resolution images will populate the right-hand
    side, and you can scroll through the list to find something you like. Clicking
    on an image will change your wallpaper to that particular selection. If you’re
    a plain Jane and prefer to keep things really simple, you can also select `Solid
    Colors` to find an array of potentially yawn-inducing plain wallpapers.


    Selecting `iPhoto` will let you scroll through your photos, allowing you to select
    a cherished memory as your wallpaper.


    The `Folders` option will let you choose between added folders where more image
    files might be lying in wait. If you save lots of images to your desktop, you
    might want to add the `Desktop` folder here so you can include those images as
    would-be wallpapers.


    ## Adding and Removing Folders


    1. To add new folders and image collections, click on the `+` button located at
    the bottom of the left sidebar.

    2. When the window comes up, search for the folder that you’d like to add.

    3. Once you find the desired folder, click the blue `Choose` button to confirm
    the changes.

    4. To remove a folder, highlight the folder that you’d like deleted and then click
    the `–` button to remove it.


    ## Screen Saver


    To set one up, click on the `Screen Saver` button at the top of the `Desktop &
    Screen Saver` window.


    The left sidebar will have more options than you probably need when it comes to
    different ways to display your pictures. Some great ones you will probably like
    are `Shuffling Tiles`, `Vintage Prints`, and `Classic`.


    On the right side you can see a preview of what your screen saver will look like.
    In this part of the window you can also select a source: `National Geographic`,
    `Aerial`, `Cosmos`, `Nature Patterns`, and `Choose Folder` if you have a particular
    folder of images you’d like to use. If you’d like to shuffle the order in which
    images appear, check the box next to `Shuffle slide order`.


    ![](Images/image00181.jpeg)


    At the very bottom of the window you can choose the length of time before the
    screen saver starts. You’ll also be able to pick if you’d like to display the
    clock or not.


    ## Dock


    There isn’t a lot you can do to the dock and most of these settings are self-explanatory.
    For the most part the settings just make things a little more…animated. `Magnification`,
    for example, makes an app icon larger when you hover your mouse over it.


    One option I will point out, however, is the option to automatically hide and
    show dock; all of these settings are a matter of taste; I personally choose to
    hide the dock for two reasons: one, it gives you more screen space, and two, it
    lets you use the dock while you are in a full screen app.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 1.06.54 PM.png](Images/image00182.jpeg)


    ## Mission Control


    ![](Images/image00183.jpeg)


    Mission Control is where you can set different parts of your screen to do different
    things. What do I mean by that? For example, you can set up a shortcut so that
    every time you move your mouse to the far upper right corner, your desktop is
    revealed. You can also set up shortcut keys on your keyboard. Mission Control
    is really about helping you make simple tasks quick.


    ## Social Networking, Mail, Contacts and Calendars


    When you use `Twitter`, `Facebook` and other apps, you may be used to just going
    to a website. On a Mac, you can add them into your computer’s information, so
    you don’t need to login; this also lets you get notification pop ups when you
    have new messages, likes, etc.


    ### Adding Accounts


    To add accounts, go to `System Preferences` on your Dock (the gears icon) and
    select `Internet Accounts`. From here, you can add accounts that haven’t already
    been migrated, including `iCloud`, `Exchange`, `Google`, `Twitter`, `Facebook`,
    `LinkedIn`, `Yahoo!`, `AOL`, `Vimeo` and `Flickr`. Adding accounts here will start
    populating El Capitan’s native `Mail`, `Contacts`, `Reminders` and `Calendar`
    apps, and add options to your `Share` button.


    ![](Images/image00184.jpeg)


    Note: You can also add accounts within the `Mail`, `Contacts`, `Calendars`, and
    `Reminders` apps by opening each app and clicking `File > Add Account`.


    ### Twitter, Facebook, LinkedIn, Vimeo and Flickr


    OS X El Capitan supports deep `Twitter`, `Facebook`, `LinkedIn`, `Flickr` and
    `Vimeo` integration. To get started, simply sign in to your account(s) from `System
    Preferences > Internet Accounts`. Select `Twitter`, `Facebook`, `LinkedIn`, `Flickr`,
    or `Vimeo`, and then enter your username and password. From now on, you’ll be
    able to use that account with the `Share` button throughout El Capitan and receive
    notifications in your `Notifications Center`.


    ![](Images/image00185.jpeg)


    ## Sound


    As the name implies, the `Sound` menu is where all changes related to sound effects
    and sound in general can be modified. There are three tabs that you can switch
    between.


    ![](Images/image00186.jpeg)


    ### Sound Effects


    The `Sound Effects` tab is where you can select an alert from the built-in options.
    By default, the following dropdown menu should be set to output device to speakers.
    The next two checkboxes let you turn sound effects on or off for the user interface.
    Lastly, you’ll be able to adjust the volume.


    ### Input & Output


    The `input` and `output` tabs are both very similar. Each will let you change
    the device for sound input or output (speakers or microphones), as well as adjust
    settings. In the `Output` tab, you can adjust the balance, and in `Input`, you
    can change the microphone’s volume and enable or disable noise reduction.


    ## Users & Groups


    If your Mac is for family use and a couple of people will be using it, then this
    setting will come in handy.


    ![](Images/image00187.jpeg)


    Along the left sidebar all existing users and groups (if you have any) will be
    laid out for you. To make a change to an existing user, first you need to choose
    the `Click the lock` icon and unlock it; unlocking lets you change settings to
    the user. You will also be asked for your password at this time—this is all a
    safety measure to ensure that if you accidentally left your computer unintended,
    someone couldn’t come and lock you out of your own machine.


    Below are a few things you’ll be able to do with each user (depending on the type
    of user it is admin, guest, child, etc.); some of the settings won’t be available.


    * Selecting the `Admin` user account will let you change the login password, open
    up the `Contacts` card and enable parental controls. Clicking the `Login Items`
    will allow you to change the applications that start running each time you log
    in. There has to be at least one admin user.

    * Any other created users that you make will have options to enable parental controls,
    change password, or turn that account into another administrator account that
    has full control of the Mac.

    * By default you will see a `Guest` user set up. If it’s selected, you can choose
    to disable the `Guest` user from being available as a login option. You can also
    set parental controls and allow guest access to your shared folders. If you do
    choose to keep the `Guest` user, keep in mind that there will be no password required,
    and all information and files created during that session will be deleted upon
    logging out.

