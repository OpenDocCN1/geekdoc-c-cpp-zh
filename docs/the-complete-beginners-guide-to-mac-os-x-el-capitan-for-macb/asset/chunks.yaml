- fmt: '

    If you already have funds in your iTunes account, or have a card on file, the
    purchase will be made and the song(s) will begin to automatically download. If
    you don’t have any money in the account, or haven’t yet added a payment method,
    you will be asked to enter that information before the purchase can be made.


    After your purchases are fully downloaded, you’ll be able to enjoy your new music
    by clicking on the `My Music` tab and selecting your latest addition.


    ## App Store


    The `App Store` is where you’ll be able to download and install many different
    applications that have been developed specifically for use with a Mac computer.
    These apps will do everything from add new functionalities and make your life
    easier, to providing a fun way to waste time and play some games during downtime
    at work. Keep in mind that for the `App Store` to be functional, you need to be
    connected to the Internet.


    To be clear, Apps purchased on the `App Store` only run on Macs; if you have two
    Macs, you can download it on both if you have the same account. But you cannot
    download them on your `iPhone` or `iPad`. So if you are wondering why a game you
    downloaded on the `iPhone` or `iPad` is not available free on your Mac, that’s
    why. Mac Apps are developed using an entirely different framework.


    Open the `App Store` by selecting it either through the `dock` or `Launchpad`.
    The `App Store`’s home page will greet you, showing you the latest and greatest
    in the world of apps.


    ![](Images/image00170.jpeg)


    At the top you will see different sections: `Featured`, `Top Charts`, `Categories`,
    `Purchases`, and `Updates`.


    The `Featured`, `Top Charts`, and `Categories` tabs will show you apps that can
    be downloaded, but organized in different ways. `Featured` will show you `Best
    New Apps`, `Best New Games`, `Editor’s Choices`, and collections of different
    apps that work great together.


    `Top Charts` shows you the best of the best when it comes to available apps, and
    is broken down by `Top Paid`, `Top Free`, and `Top Grossing`. On the right side,
    you can also browse through `Top Apps` broken down by category, in case you wanted
    to refine your search.


    ![](Images/image00171.jpeg)


    `Categories` further breaks down your app hunting into different categories like
    `Business`, `Education`, `Reference`, `Productivity`, `Medical`, `Entertainment`,
    and `Games`.


    ![](Images/image00172.jpeg)


    Choosing a category will bring up more selections and the right side will be filled
    with even more categories. For example, selecting the `Business` category will
    bring you to the main `Business` apps page where the hottest apps are listed.
    On the right side, smaller categories like `Apps for Writers`, `App Development`,
    or `Apps for Designers` can be selected. It doesn’t matter what category of apps
    you are currently under; the list remains the same in the right half.


    ![](Images/image00173.jpeg)


    `Purchases` and `Updates` are where you can go to view past `App Store` downloads.
    The `Purchases` title can be a bit misleading, because your free apps will also
    appear here. In the `Updates` section, you can view which apps need to be updated
    to the latest version. If you have multiple apps that need updating, you can choose
    the `Update All` button and it will go down the entire list.


    ## Lesser Used Apps


    There are a lot of apps on Mac that you probably see but don’t use. Here’s a rundown
    of some of those apps and when you might use them.


    `TextEdit` is Apple’s answer to Microsoft’s `Notepad`. This is a simple plain
    text editor. It’s certainly not fancy, but it’s good for jotting down notes.


    `Stickies` is a love it or hate it sort of app. If you’re in the love it camp,
    though, they’re still there. `Stickies` are like Post-it notes for your desktop.
    Just open the `Stickies` app from `Launchpad` and start sticking away!


    ![](Images/image00174.jpeg)


    ## Family Sharing


    Before finishing this section, I want to talk about one last feature that’s not
    part of El Capitan—it’s part of Apple products in general. It’s called `Family
    Sharing`. With `Family Sharing`, you can set up one account for everyone in your
    house, but everyone has separate user names. This means if someone buys a movie,
    song, app, etc, then everyone in your family plan can access it. But don’t think
    you can share this with your friends…well you could, but it’s not recommended
    because whenever they buy something, your credit card is charged—it also would
    break the terms and conditions you are agreeing to.


    To enable `Family Sharing`, go to `System Preferences` > `iCloud`. Then, click
    `Set Up Family Sharing` to get started. The person who initiates `Family Sharing`
    for a family is known as the family organizer. It''s an important role, since
    every purchase made by other family members will be made using the family organizer''s
    credit card!


    Invite your family members to join `Family Sharing` by entering their `Apple IDs`.
    As a parent, you can create `Apple IDs` for your children with parental consent.
    When you create a new child `Apple ID`, it is automatically added to `Family Sharing`.


    There are two types of accounts in `Family Sharing`: adult and child. As you''d
    expect, child accounts have more potential restrictions than adult accounts do.
    Of special interest is the `Ask to Buy` option! This prevents younger family members
    from running up the family organizer''s credit card bill by requiring parental
    authorization for purchases. The family organizer can also designate other adults
    in the family as capable of authorizing purchases on children''s devices.


    # Part 2: Making the Mac Yours


    So now you know the basics; you should be able to work your way around the desktop
    with ease and use all the basic programs. But it still doesn’t feel quite like-your
    computer.


    ## System Preferences


    All of the main settings are accessed in `System Preferences` which is essentially
    the Mac equivalent of `Control Panel` on a Windows computer. So to get started,
    let’s get to `System Preferences` by clicking `Launchpad`, then the `System Preferences`
    icon.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 12.45 PM.png](Images/image00175.jpeg)


    You can also get there by clicking on the Apple in the upper left corner of the
    menu and clicking `System Preferences`.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 12.45.51
    PM.png](Images/image00176.jpeg)


    Once the app opens, you’ll see there are lots of things you can configure.


    ![](Images/image00177.jpeg)


    ### General


    Let’s get started with the first option: `General`. Under `General`, you can:


    *   Change the appearance of the buttons, windows, and menus by selecting either
    `Blue` or `Graphite`.

    *   Choose the highlight color.

    *   Change the top menu bar and dock to dark colors. This option works well with
    dark wallpapers.

    *   Set scroll bars to display automatically based on mouse or trackpad, only
    when scrolling, or always on.

    *   Select the default web browser.

    *   Here is where you can allow `Handoff` to work between your Mac and iCloud
    devices (some older Macs don’t support this feature).


    ![](Images/image00178.jpeg)


    At any time, you can get back to the main `System Preferences` page, but clicking
    on either the button with 12 tiny squares. You can also hit the `Back` button,
    but if you are several menus in, you may have to hit the `Back` button several
    times.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 1.09.00 PM.png](Images/image00179.jpeg)


    ### Desktop & Screen Saver


    The `Desktop & Screen Saver` section will help you change perhaps the most visually
    noticeable thing on your Mac – the desktop wallpaper. Along the left sidebar you
    will see several different dropdown options: `Apple`, `iPhoto`, and `Folders`.


    ![](Images/image00180.jpeg)

