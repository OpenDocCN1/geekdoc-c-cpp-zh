- fmt: '

    At the bottom of the left sidebar there is another option, called `Login Options`.
    This is where you’ll find different options such as automatic login, show password
    hints, and show the Sleep, Shut Down, and Restart buttons. You can also display
    your full name or user name at the top right of the menu bar by checking the box
    next to `Show fast user switching menu` and making a selection.


    Create New Users


    So you know how to manage the primary user, but what about creating additional
    users? That’s pretty simple. Just follow these steps (and make sure you have already
    hit that lock button to unlock the option).


    1. Click on the `+` button.

    2. From the `New` dropdown menu, choose from the following options: `Administrator`,
    `Standard`, `Managed with Parental Controls`, or `Sharing Only`.


    ![](Images/image00188.jpeg)

    3. Fill in the `Full Name` and `Account Name` fields. These don’t have to be real
    names. Mickey Mouse can have a user name if you want.

    4. You can choose to have the new user log in using an existing `iCloud` account
    and password, or create a whole new password.

    5. If you selected `Use iCloud Password`, you will be prompted to enter the associated
    `iCloud ID`.

    6. If you instead choose to opt for a newly-created password, you will be asked
    to enter it twice to verify it.

    7. Once finished, click the blue `Create User` button. If you chose to use an
    `iCloud ID`, you will be asked to enter the password. If you made a new password,
    you don’t need to do anything else.


    Removing Existing Users


    Just because you added a user, that doesn’t mean they’re there forever. You can
    delete them at anytime. But remember, deleting those deletes all the settings
    they’ve set up—so if you create again, everything will be gone.


    1. To remove current users, select the user that you’d like to delete.

    2. With that user highlighted, click on the `–` button.

    3. A prompt will appear asking if you are really sure you’d like to remove the
    user from the computer.

    4. You can also choose from one of three radio buttons: save the home folder,
    leave the home folder alone, or delete the home folder.

    5. Once you’ve made a decision, click the blue `Delete User` button to confirm
    your choice and make the changes happen.


    Creating Groups


    If the computer is being used in a place where there are dozens of users (a classroom
    or library, perhaps), then creating a group would be a good option for you.


    1. At the bottom of the left sidebar, click the `+` button.

    2. From the `New` dropdown menu, select `Group`.

    3. In the `Full Name` field, create and enter a name for your group.

    4. Click the blue `Create Group` button to confirm.

    5. The new group will be created, and you will be able to check boxes next to
    each existing user to designate who will be a part of this group. If you have
    existing groups, you can also select entire groups to be a part of yet another
    group.


    Parental Controls


    If kids are using your computer, then Apple has Parental Controls to help you
    make sure the kids don’t get into trouble. It’s a pretty powerful app, but it
    does have a few limits—if you want ultimate protection, then there are also several
    paid apps like `NetNanny` ([www.netnanny.com]). Parental controls is also good
    for guests—if you don’t mind if people use your computer, but you only want them
    to use the Internet and have no access to anything else, then you could set it
    up like that.


    ![](Images/image00189.jpeg)


    To use Apple’s Parental Controls, first make sure you have created a user account
    for your child. Next go to `System Preferences` and `Parental Controls`.


    If the padlock on the lower left corner is locked, then click it to unlock it
    and type in your password.


    You can now set up parental controls for each child users. You can make it as
    restrictive as you want. The first tab lets you pick what apps they can use. You
    could block all apps except games, for instance. The next tab lets you control
    web usage. By default, Apple will try to filter out adult content. If this is
    a young child, then a better option might be picking the web pages they can access—you
    could, for instance, block every Internet website except Disney. The next tab
    is `People`. This lets you select who they can email and message—you could limit
    them to only emailing parents and grandparents, for instance. The second to last
    tab lets you pick time limits. You can pick when they use the computer and for
    how long. And finally, the last tab lets you turn off the camera so they can do
    video chatting, hide profanity from the dictionary, etc.


    Accessibility


    Accessibility helps you adjust the computer if you have any kind of impairment
    or disability. It lets you change things like making the display larger, having
    a voiceover that describes what’s on your screen, and put captions on videos when
    available.


    To open Accessibility, click `System Settings` and `Accessibility`. On the left
    side of the box that comes up will be all the various things you can change. Clicking
    on each one will create more options.


    ![](Images/image00190.jpeg)


    Vision


    Under `Display`, you can make the screen grayscale, invert colors, decrease the
    contrast, etc. `Zoom` allows you to create a zoom effect over smaller areas of
    the screen when you hit a keyboard shortcut. `VoiceOver` reads back any text that’s
    on the screen.


    Media


    The `Media` section includes a few different settings for audio and playback.
    Click on `Descriptions` to enable spoken descriptions for videos.


    `Captions` will apply subtitles to videos.


    Hearing


    The `Sound` tab provides options for the hearing disabled. You can choose to set
    up a visual flash of the screen each time an alert sound is played, and also decide
    if you’d like to play stereo audio as mono.


    Interacting


    `Keyboard` includes settings for `Sticky Keys` and `Slow Keys`. `Sticky Keys`
    allows certain buttons to remain activated without you to hold down the key. For
    example, if you have Sticky Keys turned on and want to copy some text, instead
    of holding down `Command + C` at the same time, you could press the `Command`
    button first, followed by the `C` key. When enabled, you’ll hear a lock sound,
    and anytime you use a modifier key like `Command`, a large icon will appear in
    the top right of the screen indicating that a Sticky Key combination has been
    started. `Slow Keys` increases the amount of time between a button press and activation,
    so if you press `Enter`, it will take a little longer to process.


    `Mouse & Trackpad` features like `Mouse Keys`, which lets you move the mouse around
    using the number pad on your keyboard, double-click speed, and the option to ignore
    the built-in trackpad (on MacBooks) if there is a separate mouse or trackpad connected.


    `Switch Control` requires you to enter your administrator before making any changes,
    because it’s a powerful function that allows you to control the computer using
    one or more switches that you designate. You can also modify other settings like
    what to do while navigating, determine pointer precision, and change the size
    for the Switch Control cursor.


    The `Dictation` tab does exactly what it sounds like – lets you dictate commands
    and write or edit text using only your voice. To enable dictation, you first need
    to click on the bottom button that says `Open Dictation & Speech Preferences`
    and selecting the `On` radio button.


    Privacy and Security


    If your computer is in a place where other people can get to it, or if you are
    just generally concerned about your privacy being violated, then head on over
    to `Privacy and Security` in the System Preferences.


    Creating Strong Passwords


    Strong passwords are the first line of defense against potential hackers (or smart
    children); a strong password is not something like `password`; a strong password
    has letters, numbers and even symbols in it. It could be something like this:
    `@mY_MACb00k.`

