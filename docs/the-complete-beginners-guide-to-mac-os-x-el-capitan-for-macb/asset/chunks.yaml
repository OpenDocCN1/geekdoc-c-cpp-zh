    如果你已经登录了 iCloud，那么你应该已经看到几十个联系人了。要创建一个新联系人，点击主窗口底部的 `(+)` 按钮。在下一个屏幕上，添加你想要的所有信息——多寡随你意愿。有些联系人可能只需要网站地址，而另一些可能有邮寄地址——添加多少信息完全取决于你。你也可以通过找到他们的姓名然后点击
    `Edit` 按钮来编辑联系人。如果你想删除某人，找到他们的姓名并按下键盘上的 `Delete` 键（你也可以用双指点击他们的姓名来删除）。


    # 消息 / 电话通话


    Apple 产品与其他 Apple 产品配合使用时效果最佳；这在 El Capitan 系统上更是如此，你可以同步 iPhone 账户，以便直接从 Mac
    上拨打电话（包括视频通话和普通通话）并发送消息。此外，你甚至可以使用 iPhone 的数据连接在移动时让笔记本电脑访问互联网——这在旅行时特别方便，如果你不想为需要付费的
    Wi-Fi 热点付费（但请注意，数据连接有每月限制，而且使用电脑会很快消耗这些限制——换句话说，这可能不是你用来流媒体 Netflix 电影的事）。


    ![](img/image00140.jpeg)


    ## iMessage


    当你使用 Mac 上的 iMessage 发送消息时，请记住这是为 Mac 用户设计的即时通讯工具——这意味着它是专为配合 Mac 产品设计的……不适用于其他设备。


    ### 设置 iMessage


    1. 要设置 iMessage，点击 `Messages` 图标启动它。

    2. 如果你已经在 Mac 上登录了 iCloud，你将自动登录 iMessage。

    3. 如果你想更改此账户或尚未登录，请选择顶部菜单栏上的 `Messages > Preferences`。

    4. 当 `Accounts` 对话框出现时，点击 `Accounts` 标签页。

    5. 在左侧窗口中，你将看到 iMessage。选择它。

    6. 接下来的屏幕将提示你输入与 iCloud 关联的电子邮件地址和密码。完成这些操作并点击蓝色的 `Sign In` 按钮完成设置过程。


    ### 设置其他即时通讯客户端


    虽然 iMessage 是为 Mac 产品设计的，但你也可以将其用于其他消息服务器，如 Google、Yahoo 和 AOL。要在 Messages 中添加其他即时通讯
    (IM)客户端：


    1. 如果 `Messages` 尚未运行，请打开它。

    2. 在顶部菜单栏上，点击 `Messages > Add Account`。


    ![](img/image00141.jpeg)


    3. 选择你想添加的账户类型，例如 `Gmail` 或 `Yahoo`，并选择 `Continue`。

    4. 系统将提示你输入相应的电子邮件地址和密码，并点击 `Set Up` 按钮完成。


    现在已经设置好了，如何发送消息呢？


    ### 开始新对话


    1. 在开始之前，先查看整个 `Messages` 屏幕。它应该是完全空的，没有任何对话。在左侧边栏上它会显示 `No Conversations`。在这里，你可以通过点击每一项在不同人的不同对话之间切换。在右侧，你还会看到
    `No Conversation Selected`。在这里，你可以输入新消息并阅读当前选定任何对话中的所有内容。如果你有一台 iPhone（或任何手机），它看起来就像你阅读短信的屏幕一样。

    2. 要与某人建立新对话，点击位于左侧边栏顶部、搜索栏旁 `Compose new message` 按钮。它看起来像正方形内的一个小铅笔。


    当你收到消息时，如果启用了声音，你会听到清脆的提示音。


    ## FaceTime


    FaceTime 允许你使用电脑内置的摄像头与朋友家人联系。我听过有人说担心别人通过网络摄像头监控他们，所以他们用胶带盖住了。当 FaceTime 正在使用时（即摄像头开启且别人可以看到你时），一盏明亮的绿灯会亮起——所以你不用担心别人窥视……如果你没有看到光，说明摄像头是关闭的。


    可以通过点击 `Launchpad > FaceTime` 启动应用程序。


    ![](img/image00142.jpeg)


    在左侧，如果对方在你的 `Contacts` 中，你可以输入他们的姓名或电话号码。要让 FaceTime 工作，对方也必须拥有 Apple 设备并接受你的通话。


    你还可以使用 FaceTime Audio。这让你可以在不使用摄像头的情况下打电话——这本质上是一个 Wi-Fi 电话。


    ## Photo Booth


    我们是自拍文化，所以谈论这个拍摄照片的 App 是合适的。


    要开始使用，进入 `Launchpad` 并点击 `Photo Booth` 图标。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 10.10.18
    AM.png](img/image00143.jpeg)


