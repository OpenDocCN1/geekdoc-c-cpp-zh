  trans: '


    返回分屏界面的方法与方法 1 相同（点击左角的绿色框或按下键盘上的 `ESC` 键）


    # 互联网


    Mac 是一台精美的机器，但你对那个桌面的欣赏也是有限的；最终你会想要上网，让我解释一下如何操作。


    有两种方法：以太网（即向你的电脑插入局域网线）和无线连接。


    ### 使用以太网设置


    所有新的 Mac 计算机都配置了 Wi-Fi；iMac 也带有以太网端口，可以插入网线。任何 Mac 笔记本电脑上都不提供此选项——尽管如果你绝对需要，可以购买一个适配器。


    如果你有一个基础的网调制解调器，那么设置就会非常简单。只需将网线插入你的网络集线器，并将另一端插入你的 Mac 即可。一旦插入，互联网应该就可以使用了。


    较新的 Mac 配备了顶级的 Wi-Fi 无线射频，所以不使用以太网端口也没有问题。


    ### 设置无线网络


    设置无线连接也非常简单。只需点击菜单栏上的 Wi-Fi 菜单。它看起来如下所示，位于右上角附近：


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 3.25.15 PM.png](img/image00130.jpeg)


    只要范围内有无线网络，当你点击时它就会显示出来（有时需要几秒钟才会出现）。


    ![](img/image00131.jpeg)


    如果 Wi-Fi 名称旁边有一个锁图标，那么你需要知道密码（如果是家庭网络连接，密码通常在你的网调制解调器底部；如果是公司，你将必须索要代码。如果没有锁，则它是一个开放网络。你通常会在星巴克等地方看到这种网络。）


    如果是锁定的网络，你一点击它，它就会要求输入代码；一旦输入并点击 `连接`，你就连接成功了（假设你添加得正确）；如果没有锁定，你一点击它，它就会尝试连接。


    如果你拥有上述电脑之一，或者更倾向于无线连接到网络，可以通过点击顶部菜单栏上的 Wi-Fi 小菜单来实现。


    ### Airport Express / Airport Extreme


    如果你需要更远的无线连接范围，或者想要建立私有网络，Apple 销售 Mac 配件。其中一个是 Airport Express（99 美元），另一个是 Airport
    Extreme（199 美元，如果你想要带硬盘的，则是 299 美元到 399 美元）。


    Express 是想要添加私有网络的人的选择（例如，你可以为客人和客人打印创建一个网络）；Airport Extreme 提供极佳的范围；我在家里使用了一个，因为手机公司提供的调制解调器勉强够不到隔壁，信号强度很弱；Extreme
    不仅到达了隔壁，还到达了好几个房间——现在我距离 Extreme 所在地超过 100 英尺的地方也能收到信号。它的安装非常简单，Apple 为需要额外帮助的人准备了视频。


    更贵的型号也是备份电脑的良好选择。299 美元和 399 美元的型号提供高达 3TB 的存储；其工作原理是你的电脑连接到它，并在后台备份你的电脑，这样你的电脑一直处于备份状态。这些型号还允许你共享文件。例如，如果你想为连接到你网络的任何人提供一个私有存储锁，你可以在这里实现。


    # Safari


    正如 Windows 电脑使用 Internet Explorer 作为默认网页浏览器一样，Mac 也使用 Safari 作为默认网页浏览器；如果你在 iPhone
    或 iPad 上用过 Safari，那么你应该已经习惯了使用它。


    ![](img/image00132.jpeg)


    Safari 中明显缺失的是一种被称为“Flash”的东西。你可能以前用它观看某些视频和其他 Web 应用程序；你可以随时下载它，但这会影响笔记本电脑的电池寿命，因为
    Flash 往往会快速消耗电量——这也是 Apple 不包含它的原因之一。


    你也可以自由下载其他互联网浏览器。一些流行的免费浏览器有 Google Chrome ([www.google.com/chrome/](http://www.google.com/chrome/))、Mozilla
    Firefox ([www.mozilla.org/firefox](http://www.mozilla.org/firefox)) 和 Opera ([www.opera.com](http://www.opera.com))。


    使用 Safari 而不是其他浏览器的最大优势之一是一个名为“接力”（Handoff）的功能。假设你在上班的地铁上用手机读一篇文章；到达公司后想在更大的 Mac
    屏幕上继续阅读；只需打开 Safari，然后点击右上角的两个正方框即可。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 5.32.45 PM.png](img/image00133.jpeg)


    如果你的 iPhone 或 iPad 与电脑同步，你就会看到它的名称以及它当前正在浏览的页面。你也可以同样地将 Mac 页面接力到你的 iPhone 或 iPad。


    除了网站外，接力还让你无缝同步诸如地图、消息和文档的内容。


    # Mail


    Mail 是 Mac 版的 Outlook；和 Safari 一样，它的操作方式非常相似。Apple 会提供以 @icloud.com 结尾的免费邮箱地址，你也可以添加其他邮箱（如
    Hotmail、Gmail）。


    ### 添加账户


    要开始使用，你需要添加电子邮件账户。点击 Launchpad 找到 Mail 应用，然后点击 Mail 图标。


    ![](img/image00134.jpeg)


    添加账户


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 5.57.03 PM.png](img/image00135.jpeg)


    打开应用后，点击顶部菜单栏的 `邮件` > `添加账户`。这将加载添加账户对话框。


    ![](img/image00136.jpeg)


    选择你将添加的服务商（注意：你可以返回添加多个账户）并点击“继续”。接下来会询问你的名称、电子邮件地址和密码。


    ![](img/image00137.jpeg)


    如果你使用的是常用的邮箱供应商，设置非常直观。如果你使用的是公司邮箱，可能需要配合系统管理员来正确添加。


    设置完成后，你应该能在电脑上看到邮件。


    ### 发送邮件


    现在你已经添加了账户，就可以发送邮件了；发送邮件可以通过键盘按下 `Command+N`、前往顶部菜单选择 `文件` > `新建邮件`，或者点击 `编写`
    图标（看起来像一支穿过方形的笔）。


    ![](img/image00138.jpeg)


    新建邮件对话框将出现。在收件人字段中，输入你想发送信息的电子邮件地址或地址，添加主题和信息，准备好后点击左上角的纸飞机图标。


    你还可以点击 `A` 按钮为邮件添加格式。格式非常基础——你可以加粗、斜体、下划线并更改颜色。


    ### 联系人


    除非你是商务人士，否则在电脑上拥有联系人似乎并不必要；但它的优势在于——它会与手机同步。因此，电脑上的联系人会同步到你的其他移动设备。要使用它，前往 Launchpad，然后点击该图标。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-17 at 6.22.19 PM.png](img/image00139.jpeg)


