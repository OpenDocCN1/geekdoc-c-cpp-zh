    如果你已经在 iTunes 账户中有了资金，或者留了银行卡信息，购买将进行，歌曲将开始自动下载。如果你的账户中没有钱，或者尚未添加支付方式，在进行购买之前你会被要求输入相关信息。


    在你购买的内容完全下载完成后，你可以点击 `My Music` 标签页并选择你最近添加的内容来享受你的新音乐。


    ## App Store


    `App Store` 是你可以下载和安装许多专门为 Mac 电脑开发的应用程序的地方。这些应用可以实现各种功能，从增加功能和让你的生活更轻松，到在工作间隙提供一种消遣时间和玩游戏的趣味方式。请记住，为了让
    `App Store` 正常工作，你需要连接网络。


    明确的是，在 `App Store` 购买的 App 仅在 Mac 上运行；如果你有两个 Mac，只要使用相同的账户，就可以在两台设备上都下载。但你不能在
    `iPhone` 或 `iPad` 上下载它们。所以，如果你疑惑为什么在 `iPhone` 或 `iPad` 上下载的游戏在 Mac 上无法免费获取，原因就在于。Mac
    应用是使用完全不同的框架开发的。


    通过 `dock` 或 `Launchpad` 选择并打开 `App Store`。`App Store` 的主页将欢迎你，向你展示应用世界中最新、最强大的内容。


    ![](img/image00170.jpeg)


    在顶部你会看到不同的部分：`Featured`（精选）、`Top Charts`（排行榜）、`Categories`（分类）、`Purchases`（购买）和
    `Updates`（更新）。


    `Featured`、`Top Charts` 和 `Categories` 标签显示可以下载的应用，但以不同的方式组织。`Featured` 将为你展示
    `Best New Apps`（最佳新应用）、`Best New Games`（最佳新游戏）、`Editor’s Choices`（编辑选择）以及协作良好的不同应用集合。


    `Top Charts` 显示了可用应用中的最优，并按 `Top Paid`（付费付费）、`Top Free`（免费）和 `Top Grossing`（畅销）进行分类。在右侧，你还可以按类别浏览
    `Top Apps`（热门应用），以防你想缩小搜索范围。


    ![](img/image00171.jpeg)


    `Categories` 进一步将你的应用寻找分为不同的类别，如 `Business`（商务）、`Education`（教育）、`Reference`（参考）、`Productivity`（生产力）、`Medical`（医疗）、`Entertainment`（娱乐）和
    `Games`（游戏）。


    ![](img/image00172.jpeg)


    选择一个类别将带来更多选择，右侧将填充更多类别。例如，选择 `Business` 类别将带你进入 `Business` 应用主页，那里列出了最热门的应用。在右侧，可以选择更细的类别，如
    `Apps for Writers`（作者类应用）、`App Development`（应用开发）或 `Apps for Designers`（设计师类应用）。无论你目前处于哪种应用类别下，右半部分的列表都保持不变。


    ![](img/image00173.jpeg)


    `Purchases` 和 `Updates` 是你可以查看过去 `App Store` 下载记录的地方。`Purchases` 标题可能会有点误导性，因为你的免费应用也会出现在这里。在
    `Updates` 部分，你可以查看哪些应用需要更新到最新版本。如果你有多个应用需要更新，可以选择 `Update All`（全部更新）按钮，它将处理整个列表。


    ## 较少使用的应用


    Mac 上有很多你可能看到但并不使用的应用。这里是其中一些应用的简介，以及你可能使用它们的时机。


    `TextEdit`（文本编辑）是苹果对应微软 `Notepad` 的产品。这是一个简单的纯文本编辑器。它确实不华，但适合记录笔记。


    `Stickies`（便签）是一个让人或或恨参半的应用。不过，如果你属于爱的一营，它们依然在那里。`Stickies` 就像是你桌面的便利贴。只需从 `Launchpad`
    中打开 `Stickies` 应用并开始张贴吧！


    ![](img/image00174.jpeg)


    ## 家庭共享


    在结束这一节之前，我想谈谈最后一个不属于 El Capitan 的功能——它是所有苹果产品的通用功能。它被称为 `Family Sharing`（家庭共享）。通过
    `Family Sharing`，你可以为家中的每个人设置一个账户，但每个人都有独立的用户名。这意味着如果有人购买了电影、歌曲、应用等，那么你家庭计划中的每个人都可以访问。但不要认为你可以和朋友分享这些内容……嗯，你可以这样做，但不建议，因为每当他们购买东西时，你的信用卡就会被扣费——这也会违反你所同意的服务条款。


    要启用 `Family Sharing`，前往 `System Preferences` > `iCloud`。然后，点击 `Set Up Family Sharing`
    开始。为家庭发起 `Family Sharing` 的人被称为组织者。这是一个重要的角色，因为其他家庭成员的每项购买都将使用家庭组织者的信用卡进行！


    通过输入他们的 `Apple IDs` 邀请家庭成员加入 `Family Sharing`。作为家长，你可以在获得许可的情况下为孩子创建 `Apple IDs`。当你创建一个新的儿童
    `Apple ID` 时，它会自动添加到 `Family Sharing` 中。


    `Family Sharing` 中有两种账户：成年和儿童。正如你预期的，儿童账户比成年账户有更多的潜在限制。特别值得关注的是 `Ask to Buy`（请求购买）选项！这防止了较小的家庭成员导致家庭组织者的账单超支。


    # 第二部分：让 Mac 你的专属化


    现在你已经掌握了基础知识；你应该能够轻松地在桌面操作。但它感觉还不完全属于你。


    ## 系统设置


    所有的主要设置都通过 `System Preferences` 访问，这相当于 Windows 电脑上的“控制面板”。为了开始，让我们通过 `Launchpad`
    点击 `System Preferences` 图标进入。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 12.45 PM.png](img/image0175.jpeg)


    你也可以通过点击左上角的苹果图标并点击 `System Preferences` 进入。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 12.45.51
    PM.png](img/image0176.jpeg)


    一旦应用打开，你会发现有很多可以配置的项目。


    ![](img/image0177.jpeg)


    ### 通用


    让我们从第一个选项 `General` 开始。在 `General` 下，你可以：


    *   通过选择 `Blue` 或 `Graphite` 来更改按钮、窗口和菜单的外观。

    *   选择突出颜色。

    *   将菜单栏和 Dock 设置深色。此选项与深色配合良好。

    *   设置滚动条根据鼠标或触控板自动显示、仅在滚动时显示或始终显示。

    *   选择默认浏览器。

    *   在这里你可以允许 `Handoff` 在你的 Mac 和 iCloud 设备之间工作（某些旧 Mac 不支持此功能）。


    ![](img/image0178.jpeg)


    在任何时候，你都可以点击带有 12 个小方块的按钮返回 `System Preferences` 主页。你也可以点击 `Back` 按钮，但如果你处于菜单深处，可能需要点击多次。


    ### 桌面与屏幕保护程序


    `Desktop & Screen Saver` 部分将帮助你更改 Mac 上视觉上最显著的内容——桌面壁纸。在左侧边栏你会看到几个不同的下拉选项：`Apple`、`iPhoto`
    和 `Folders`。


    ![](img/image0180.jpeg)

