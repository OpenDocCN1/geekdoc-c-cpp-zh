    在底部，你可以定期更改图片，并可以选择新图像刷新的频率。在右侧窗口中显示的图像将在刷新时进行轮播。


    若想将桌面壁纸更改为 Apple 提供的精美图片之一，或者只是想浏览可用选项，请点击 Apple 名称。右侧将出现许多色彩丰富、高分辨率的图片，你可以滚动列表找到你喜欢的内容。点击一张图片将把你的壁纸更改为该选择。如果你是一个喜欢极简主义的人，倾向于保持一切非常简单，也可以选择
    `Solid Colors`（纯色）来寻找一系列可能让人无聊的纯色壁纸。


    选择 `iPhoto` 将让你浏览自己的照片，从而将一段珍贵的回忆设为壁纸。


    `Folders`（文件夹）选项允许你可以在添加的文件夹之间进行选择，那里可能有更多的图像文件等待着。如果你在桌面保存了大量图片，你可能想在这里添加 `Desktop`（桌面）文件夹，这样就可以这些图片作为潜在壁纸。


    ## 添加和删除文件夹


    1. 要添加新文件夹和图像集，点击左侧边栏底部的 `+` 按钮。

    2. 窗口弹出时，搜索你想要添加的文件夹。

    3. 找到所需的文件夹后，点击蓝色的 `Choose`（选取）按钮确认更改。

    4. 要删除文件夹，高亮想要删除的文件夹，然后点击 `–` 按钮将其移除。


    ## 屏幕保护


    要设置屏幕保护，请点击 `Desktop & Screen Saver`（桌面与屏幕保护）窗口顶部的 `Screen Saver` 按钮。


    显示图片的方式，左侧边栏提供的选项可能比你需要的多。你可能会喜欢的很棒的包括 `Shuffling Tiles`（随机平铺）、`Vintage Prints`（复古打印）和
    `Classic`（经典）。


    在右侧，你可以看到屏幕保护的预览。在窗口的这个部分你还可以选择来源：`National Geographic`（国家地理）、`Aerial`（动态）、`Cosmos`（宇宙）、`Nature
    Patterns`（自然图案），如果你有特定的图片文件夹想要使用，可以选择 `Choose Folder`（选择文件夹）。如果你想打乱图片出现的顺序，请勾选
    `Shuffle slide order`（随机幻片顺序）旁边的复选框。


    ![](img/image00181.jpeg)


    窗口的最底部，你可以选择屏幕保护启动前的时长。你还可以选择是否显示时钟。


    ## Dock 栏


    Dock 栏可以进行的操作不多，大部分设置都是一而易懂的。大部分情况下，这些设置只是让一切变得更有……动感。例如，`Magnification`（放大）会在你鼠标悬停在应用图标上时让图标变大。


    然而，我想指出的一个选项是自动隐藏和显示 Dock 栏；所有这些设置都取决于个人喜好；我个人选择隐藏 Dock 有两个原因：第一，它为你留了更多屏幕空间；第二，它让你在全屏应用中使用也能使用
    Dock。


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-21 at 1.06.54 PM.png](img/image00182.jpeg)


    ## Mission Control（调度中心）


    ![](img/image00183.jpeg)


    Mission Control 是你可以设置屏幕不同部分执行不同功能的地方。我的什么意思是？例如，你可以设置一个快捷方式，每次当你移动鼠标到右上角时，你的桌面就会显示。你还可以在键盘上设置快捷键。Mission
    Control 实际上是帮助你快速完成简单任务。


    ## 社交网络、邮件、联系人和日历


    当你使用 `Twitter`、`Facebook` 和其他应用时，你可能习惯了直接访问网站。在 Mac 上，你可以将它们添加到电脑的信息中，这样就不不需要登录；这也能让你在收到新消息、点赞等时收到弹出通知。


    ### 添加账户


    要添加账户，前往 Dock 栏上的 `System Preferences`（系统偏好，齿轮图标）并选择 `Internet Accounts`（互联网账户）。从这里，你可以添加尚未迁移的账户，包括
    `iCloud`、`Exchange`、`Google`、`Twitter`、`Facebook`、`LinkedIn`、`Yahoo!`、`AOL`、`Vimeo`
    和 `Flickr`。在这里添加账户将填充 El Capitan 原生的 `Mail`（邮件）、`Contacts`（联系人）、`Reminders`（提醒）和
    `Calendar`（日历）应用，并为你的 `Share`（共享）按钮添加选项。


    ![](img/image00184.jpeg)


    注意：你也可以通过打开 `Mail`、`Contacts`、`Calendars` 和 `Reminders` 应用并点击 `File > Add Account`
    在应用内添加账户。


    ### Twitter, Facebook, LinkedIn, Vimeo 和 Flickr


    OS X El Capitan 支持对 `Twitter`、`Facebook`、`LinkedIn`、`Flickr` 和 `Vimeo` 的深度集成。要开始，只需从
    `System Preferences > Internet Accounts` 登录你的账户。选择 `Twitter`、`Facebook`、`LinkedIn`、`Flickr`
    或 `Vimeo`，然后输入你的用户名密码。以后，你可以在整个 El Capitan 中通过 `Share` 按钮使用该账户，并在 `Notifications
    Center`（通知中心）中接收通知。


    ![](img/image00185.jpeg)


    ## 声音


    正如名称所示，`Sound`（声音）菜单是修改所有音效和声音相关更改的地方。有三个可以切换的标签。


    ![](img/image00186.jpeg)


    ### 音效


    `Sound Effects`（音效）标签允许从内置选项中选择警报声。默认情况下，下拉菜单应设置为输出设备。接两个复选框允许你开启或关闭用户界面声音。最后，你还可以调整音量。


    ### 输入与输出


    `Input`（输入）和 `Output`（输出）标签都非常相似。每个都允许你更改输入或输出设备（扬声器或麦克风），以及调整设置。在 `Output` 标签中你可以调整平衡，在
    `Input` 中你可以开启降噪。


    ## 用户与组


    如果你的 Mac 是供家庭使用的，几个人可以使用，那么这个设置将非常有用。


    ![](img/image00187.jpeg)


    在左侧边栏，所有现有的用户和组（如果有的话）都会列在这里。要对现有用户进行更改，你首先需要选择锁头图标并解锁；解锁后你就可以更改用户设置。此时你会被要求输入密码——这些都是安全措施，以确保你不小心离开电脑时，别人不会把你锁在自己的电脑之外。


    以下是你对每个用户可以做的一些事情（取决于用户类型是管理员、访客、儿童等）；某些设置可能不可用。


    * 选择 `Admin`（管理员）账户允许你更改登录密码、打开 `Contacts` 卡片并启用家长控制。点击 `Login Items`（登录项）允许你更改每次登录时启动的应用程序。必须有一个管理员用户。

    * 你创建的任何其他用户都将启用家长控制、更改密码或将该账户转换为具有 Mac 完全控制权的管理员账户的选项。

    * 默认你会看到一个 `Guest`（访客）用户。如果选中它，你可以选择禁用 `Guest` 用户作为登录选项。你还可以设置家长控制并允许访客访问你的共享文件夹。


