    # iTunes\n\nYou probably know what iTunes is; you might even use it. On a Mac\
    \ it’s really not that different from a Windows computer; the main main difference\
    \ is that on a Windows computer music is played through the `Windows Media Player`\
    \ by default and on a Mac, it’s played on `iTunes`.\n\nKeep in mind that you should\
    \ use the same `iTunes` account on your Mac that you use on other devices because\
    \ the media you buy on `iTunes` will show up on all of your devices. The exception\
    \ is rentals—rentals are only available on the device you buy it from. So if you\
    \ rent something on your Mac, don’t expect to be able to watch it on your Apple\
    \ TV or iPad; this is a studio licensing issue, not an Apple one. You do, however,\
    \ have the option of using AirPlay for rentals to send it to your Apple TV.\n\n\
    ## Adding Music to your Library\n\nThis section is for adding music you already\
    \ own and have on the computer. If you don’t have any music, you should probably\
    \ skip ahead to the `iTunes Store` section first.\n\n1. At the top menu bar, click\
    \ `File` > `Add to Library`.\n2. When the window comes up, use the left bars to\
    \ search for the specific song or songs that you’d like to add.\n3. If you already\
    \ have a giant music collection that you may have carried over from an old computer,\
    \ you can import entire folders all at once.\n4. When you’ve decided what to add,\
    \ click on it once to highlight it, and select the blue `Open` button.\n5. It\
    \ may take some time depending on how many songs you are importing, but `iTunes`\
    \ will show you the progress.\n6. Once complete, click on the `My Music` tab again\
    \ to verify that your music has been added to the `iTunes` collection.\n\n## Playlists\n\
    \n![](Images/image00163.jpeg)\n\nThe Playlists section is where you can view,\
    \ edit and delete playlists you may have created. On the left hand side you will\
    \ notice that Apple has created some for you: `90’s Music`, `Classical Music`,\
    \ `My Top Rated`, `Recently Added`, `Recently Played`, and `Top 25 Most Played`.\
    \ These are pretty self-explanatory, and Apple uses a song’s built-in metadata\
    \ to determine which songs will fit in those premade playlists.\n\nAt the top\
    \ of the list you will also see one called `Genius`. Selecting `Genius` will allow\
    \ you to use Apple’s specially made music mixer. It takes songs from your music\
    \ collection and creates great-sounding custom playlists and mixes.\n\n## Using\
    \ Genius\n\nIf this is the first time you are using `Genius`, you will have to\
    \ first click on the button that says `Turn On Genius`.\n\n![](Images/image00164.jpeg)\n\
    \nOnce you turn it on, there will be three steps that happen automatically. Depending\
    \ on the size of your library, this may take awhile so grab a snack. Once it’s\
    \ finished, your computer screen will greet you with a message that says `Genius`\
    \ has been successfully turned on.\n\n## Match\n\n`iTunes Match` is great if you\
    \ have a large music library but don’t have enough storage on your phone. Signing\
    \ up for `Match` will allow you to store your entire collection on `iCloud`, including\
    \ music that you’ve ripped from CDs and didn’t purchase through `iTunes`. This\
    \ way you’ll be able to stream your entire library from any Apple device connected\
    \ to `iCloud` without taking up any storage.\n\nThe songs are “matched” by Apple’s\
    \ online music database, so when you are playing the song on your iPhone, for\
    \ example, it isn’t actually the same file that you uploaded or purchased. Rather,\
    \ it’s Apple’s version of the song in full `256 Kbps`, even if the song you originally\
    \ uploaded or purchased was of lower audio quality. If the song is not found on\
    \ Apple’s own servers (your cousin’s Whitesnake cover band perhaps), it will playback\
    \ the original file you uploaded, with the original audio quality.\n\n![](Images/image00165.jpeg)\n\
    \nUnfortunately, `iTunes Match` isn’t free. If you’d like to sign up for it, expect\
    \ to pay `$24.99` for a yearly subscription. Signing up for `Match` does have\
    \ another perk though – if you enjoy using `iTunes Radio` but can’t stand the\
    \ ads, purchasing the yearly `Match` subscription will remove ads from `Radio`.\n\
    \n## Radio\n\n`Radio` is a free music streaming service by the music lovers at\
    \ Apple. Based on several different factors, Apple creates radio stations that\
    \ you will probably enjoy. As you listen to different things, the stations will\
    \ become more and more personalized, playing songs that are more in line with\
    \ what you’ve been recently listening to and avoiding the ones you haven’t played.\n\
    \n![](Images/image00166.jpeg)\n\nIf you would like to explore the radio a little\
    \ more, you can browse through artist-curated playlists created with a specific\
    \ goal in mind, or just search by genre. You may also find `First Plays`, which\
