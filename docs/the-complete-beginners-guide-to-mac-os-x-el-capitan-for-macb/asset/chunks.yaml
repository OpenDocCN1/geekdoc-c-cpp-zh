    # Introduction


    Every year or so you hear the big pitch: Windows is finally going to be awesome
    again. The new update is big, grander and a huge overhaul. And then it comes and
    itss buggy, weirder, and less functional than the version that came before! That’s
    probably what made you consider making the switch—you’re tired of the excuses
    and you want a computer that just works!


    Whether you are a new convert to Mac, still thinking about making the switch,
    or just want to learn more about Macs, this book will guide you through the Mac
    OS and help you see how making the switch really isn’t the great leap that you
    thought it was.


    This book will show you the basics and show you how to do the common day tasks
    you know on Windows (like right clicking). It will also show you how to get your
    Mac in sync with your iPad or iPhone, and how to do everyday tasks like change
    background, find files, and performance tweaks to keep your Mac running like new.


    ## What’s New In El Capitan?


    If you are upgrading from OS Yosemite to OS Elitan, you’ll quickly notice one
    thing: it looks exactly the same. That’s because most of the changes were under
    the hood; the OS is built to run quicker, but the look and feel is largely unchanged.


    That’s not to say nothing is changed. There were minor changes and updates to
    `Mission Control`, `Spotlight`, `Mail`, `Notes`, `Photos`, `Safari`, `Maps`, and
    `Fonts`.


    The biggest enhancement is a feature called `Split View`. That will be covered
    in more depth later in the book, but in a nutshell, `Split View` lets you run
    two compatible apps side-by-side—I say compatible because not all apps work.


    If you bought a new `Macbook` or `Macbook Pro` (`Macbook Air` is not yet compatible),
    then there’s a good chance a `Force Touch` track pad was included; `Force Touch`
    lets you do different gestures based on how firm you touch the mouse. It will
    covered in great depth later in the book.


    ## Mac? Is It Worth It?


    Before diving into the actual software, let’s address the obvious: why pick Mac?


    I was in the Windows camp for a long time; I’d see the Mac and think it just a
    computer for hipsters. Sure they were nice to look at—they were shiny and didn’t
    look plastic-y and cheap…but they were also expensive.


    But then I actually used one, and I was blown away. Here’s why…


    ### Fewer Viruses


    You’ve probably heard someone say they use a Mac because they don’t get viruses.
    That’s not true. Any computer can get a virus. But it is true that Macs are generally
    less prone to viruses and are more secure.


    The reason you don’t hear about Mac viruses very often is twofold:


    1. While it’s hard to pinpoint just how many computers there are in the world,
    most estimates say less than 10% of the world’s computers are Macs. Most computers
    are still Windows. So if you are a hacker wanting to wreak havoc into cyberspace,
    then your obvious target would be the one with the largest audience.

    2. The second reason is Mac OS is built by Apple, for Apple. Windows builds their
    OS to be built for essentially any computer, which opens the door for vulnerabilities.


    I know a lot of Mac users, and rarely do I hear someone say they have a virus.
    If you are concerned, however, one popular free virus protector is called `Bitdefender
    Virus Scanner` (`http://www.bitdefender.com/`).


