    你可以使用密码助手来测试你的密码强度如何。


    ![](img/image00191.jpeg)


    1. 当 `Keychain`（钥匙串）加载时，你可以查看所有已同步到 `Keychain` 的账户完整列表。如果你想更改现有账户的密码，请找到该账户并双击它。如果没有，请点击底部的
    `+` 按钮添加新账户。

    2. 当新窗口弹出时，查看底部。那里有一个密码字段，其右侧有一个小钥匙图标。点击钥匙图标即可打开密码助手。

    3. 从 `Type`（类型）中，你可以选择 `Manual`（手动，自行创建）、`Memorable`（易记）、`Letters & Numbers`（字母与数字）、`Numbers
    Only`（仅限数字）、`Random`（随机）以及 `FIPS-181 compliant`。

    4. 建议会自动填充，你可以通过下拉菜单浏览多个不同的建议。

    5. 调整长度滑块使密码变长或变短。你创建的任何密码将至少符合被视为合格的要求。

    6. 当你生成密码时，质量指示器会变化，向你显示给定密码的安全性和复杂程度。


    ### 防火墙


    你可以添加的另一层防线是防火墙，它可以保护你免受与潜在恶意软件程序、网站或文件的意外连接。


    ![](img/image00192.jpeg)


    要启用 Mac 自带的防火墙，前往 `System Preferences > Security & Privacy`（系统设置 > 安全与隐私）并选择 `Firewall`（防火墙）标签。在进行任何更改之前，点击左下角的锁图标并输入管理员密码继续。


    ### 查找我的 Mac


    就像你的 iPhone 或 iPad 一样，Mac 也带有一个名为“查找我的 Mac”的实用功能，让你在电脑被盗或你不小心弄丢时能够找到它；你还可以远程擦除它的硬盘。


    要启用查找我的 Mac，前往 `System Preferences > iCloud`（系统设置 > iCloud）并勾选 `Find My Mac` 旁边的框。你还必须开启位置服务，因此前往
    `System Preferences > Security & Privacy > Privacy > Location Services`（系统设置 >
    安全与隐私 > 隐私 > 位置服务），并确保勾选了 `Enable Location Services`（启用位置服务）。


    ![](img/image00193.jpeg)


    要追踪你的电脑，你可以登录任何电脑并访问 `icloud.com`，输入你的 iCloud 登录信息并点击“查找我的 Mac”。只要 Mac 处于唤醒状态并通过
    Wi-Fi 或以太网连接互联网，你就可以播放响声、锁定它或完全擦除它以移除你的隐私信息。


    ### 隐私


    Apple 知道人们担心隐私；他们内置了许多功能来帮助你控制可以看到（以及不能看到）的内容。


    #### 互联网隐私


    如果你想清除搜索和浏览记录，有两种方法：通过点击 `Safari > Clear History and Website Data`（Safari > 清除历史和网站数据）或
    `History > Clear History and Website Data`（历史 > 清除历史和网站数据）。这两者可以在顶部菜单栏找到。当窗口弹出时，你可以选择清除的时间范围，一旦做出选择，只需按下
    `Clear History`（清除历史）按钮即可完成更改。


    Cookies 允许网站存储数据并跟踪某些内容，例如你在网络会期间访问了哪些其他网站，或者你倾向于查看哪种产品。这些信息主要被广告商用于为你提供更精准的广告投放，但如果你想禁用它们，该选项一直都在。打开
    Safari，前往 `Safari > Preferences`（偏好设置然后选择 `Privacy`（隐私）标签。Cookie 选项范围从允许所有网站存储
    Cookie 到阻止所有网站。你也可以只允许来自最常访问网站的 Cookie。如果你不想被追踪，请勾选底部的 `Ask Websites To Not Track
    Me`（请求网站不要追踪我）复选框。禁用此功能后，某些网站可能无法按照你的预期方式运行。


    #### 应用隐私


    隐私的另一部分是通过已安装的应用。前往 `System Preferences > Security & Privacy`（系统设置 > 安全与隐私）并点击
    `Privacy`（隐私）标签。你可以通过勾选 `Enable Location Services`（启用位置服务）旁边的框来关闭 `Location Services`。浏览左侧边栏，你可以自定义权限。如果你不想让任何应用访问你的联系人或日历，可以在这里阻止部分或全部程序访问这些信息。


    ![](img/image00194.jpeg)


    # 第 3 部分：维护


    ## 保护电池寿命


    如果你在使用 iMac，那么这一部分显然不适用，因为 iMac 不使用电池运行，但如果你有一个 MacBook，那么这一部分就适用于你。


    大多数 MacBook 可以轻松获得超过 6 小时的电池寿命，但你可以采取一些措施来获得更长的。


    - 前往 `System Preferences > Energy Saver`（系统设置 > 节能），并在 `Battery`（电池）标签下，选择尽可能让硬盘进入睡眠，并在电池供电时稍微调暗显示。你不想设置得太低，否则你会发现在阅读或执行不需要移动的任务时它会进入睡眠状态。

    - 保持屏幕亮度仅能让你看清屏幕即可。`F1` 键将调低亮度，`F2` 键将再次调亮。如果你在海滩上，自然需要最高亮度；但如果你在黑暗的房间里，你真的需要全亮度吗？可能不需要。

    - 键盘也有亮度，可以通过键盘上的 `F5` 和 `F6` 进行调整。键盘背光在低光环境下非常有帮助，但在光光白天，你真的不需要它。


    ### iCloud


    iCloud 让你可以在网上存储照片和视频等内容。它类似于 Google Drive 或 Dropbox。最棒的是它提供 5GB 的免费空间。


    - 你可以备份联系人，使其在 Mac、iPhone 和 iPod 之间同步。在联系人卡中进行更改或添加新联系人，更改将反映在所有同步设备上。

    - 通过 iTunes Store 购买媒体文件不会计入存储空间。

    - 它让文件在所有 Mac 设备可用。


    如果你还没有设置 iCloud 账户，可以通过 `System Preferences > iCloud`（系统设置 > iCloud）并按照屏幕指令创建一个。完成后，你可以选择想要通过
    iCloud 同步的数据类型：照片、邮件、联系人、日历、Safari、备注、钥匙串等。在底部你会看到一个显示已用存储和剩余可用存储空间的条。


    如果你需要更多存储空间，可以付费。以下是本文时的费率：


    - 20 GB 每月 0.99 美

    - 200 GB 每月 3.99 美

    - 500 GB 每月 9.99 美

    - 1 TB 每月 19.99 美


    如果你决定改变主意且不需要额外的存储计划，Apple 允许你在 15 天内联系他们申请退款。


    ## Time Machine（时光机）


    每个人都会担心丢失数据；Apple 通过他们最强大的后台应用之一 Time Machine 提供了帮助。


    Time Machine 会以极少的配置或烦恼备份你所有的文件、应用程序和设置。在发生硬盘故障等灾难性事件时，拥有 Time Machine 备份可以让你快速恢复所有数据、应用程序，甚至包括所有设置（例如桌面壁纸以及图标的具体位置）。


    你需要购买一个外部 USB 或 Thunderbolt 硬盘。建议购买一个容量大于电脑当前使用空间的硬盘。例如，如果你的电脑硬盘已使用了 100 吉字节的空间，你应该至少买一个
    120 吉字节的硬盘。


    '
- fmt: '

    You can also purchase an additional Time Machine Airport Capsule that does all
    of this wirelessly.


    To get started, plug the hard drive into your computer and Time Machine will start
    automatically. It will ask you if you would like to use the drive as a Time Machine
    Backup Disk. Choose “Use as Backup Disk”.


    If Time Machine does not start automatically, go to `Finder` > `Applications`
    > `Machine`, and click “Choose Backup Disk”. Select your new hard drive.


    After you specify the drive to use as a backup, Time Machine will automatically
    begin backing up your data.


    ## Software Updates


    If you want your computer running smoothly then make sure you update regularly;
    updates are free and come once every couple of months. They fix minor bugs and
    sometimes add things to correct vulnerabilities that might make your computer
    open to viruses.


    `Mac OS X`, by default, will prompt you when updates are available, and you need
    only to click “Update” and enter your password in order to run the updates. Sometimes,
    in the case of major updates, you will need to restart your computer to complete
    the update. You can click “Not now” if you would like to delay the updates until
    a more convenient time.


    # Appendix A: Keyboard Shortcuts


    ## General Shortcuts


    - `Command-X` – Cuts or removes selected text or item and copies it to the clipboard.

    - `Command-C` – Copies the selected text or item to the clipboard.

    - `Command-V` – Pastes the contents of the clipboard into the document, app, or
    finder.

    - `Command-Z` – Undoes the previous command.

    - `Command- Shift-Z` – Redoes the previous undo.

    - `Command-A` – Selects all text or items in the running program.

    - `Command-F` – Opens the Find window to find documents or other items.

    - `Command-G` – Finds the next occurrence of a previously found item (i.e. Find
    Again).

    - `Command-H` – Hides the current running program or front window (Note: this
    will not work if you have a program running in full screen).

    - `Command-Option-H` – Hides all the open apps and windows.

    - `Command-M` – Minimizes the currently open window or app (Note: this will not
    work if you have a program running in full screen).

    - `Command-Option-M` – Minimizes all open apps and windows.

    - `Command-N` – Opens a new document or window.

    - `Command-O` – Opens an item (for instance if you are in Word or Pages and you
    want to open a previously saved document).

    - `Command-P` – Print the current website or document.

    - `Command-S` – Save the current document.

    - `Command-W` – Close the front window or app.

    - `Command-Option-W` – Close all open apps and windows.

    - `Command-Q` – Quit an app.

    - `Command-Option-Esc` – Force quit a program that is not responding.

    - `Command-Space Bar` – Brings up Spotlight to quickly find documents, emails,
    and apps.

    - `Command-Tab` – Switch to the next open app (Note: if you don’t let go of Command
    and continue hitting the Tab button, you can continue going to the next app.

    - `Command-Shift-3` – Take a screenshot of your entire screen.

    - `Command-,` – Opens the Preference menu (if applicable) for the current app.


    ## Document Shortcuts


    The following shortcuts are applicable to supported document software like Word,
    PowerPoint, Pages, Excel, OpenOffice, etc.


    - `Command-B` – Bold or un-bold the selected text.

    - `Command-I` – Italicize or un-italics selected text.

    - `Command-U` – Underline or remove underline to selected text.

