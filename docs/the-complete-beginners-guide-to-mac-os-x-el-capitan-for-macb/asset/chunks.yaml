- fmt: '

    You can use the Password Assistant to test how strong your password is.


    ![](Images/image00191.jpeg)


    1. When `Keychain` loads, you will be able to view the entire list of accounts
    that are already synced to `Keychain`. If you would like to change the password
    for an account that already exists, find the account and double click on it. If
    not, click on the `+` button at the bottom to add a new account.

    2. When the new window comes up, take a look at the bottom. There will be a field
    for password, and at the right of it will be a small key icon. Click the key icon
    to open up Password Assistant.

    3. From `Type` you can select `Manual` (create your own), `Memorable`, `Letters
    & Numbers`, `Numbers Only`, `Random`, and `FIPS-181 compliant`.

    4. Suggestions will automatically populate, and you can scroll through several
    different suggestions by using the dropdown menu.

    5. Adjust the length slider to make the password longer or shorter. Any password
    you create will meet at least the requirements to be considered fair.

    6. As you generate a password, the quality indicator will change to show you how
    safe and complex a given password is.


    ### Firewall


    Another line of defense you can add is a Firewall, which protects you from unwanted
    connections to potentially malicious software applications, websites, or files.


    ![](Images/image00192.jpeg)


    To enable the firewall that comes with your Mac, go to `System Preferences > Security
    & Privacy` and select the `Firewall` tab. Before you can make any changes, click
    on the lock icon in the bottom left corner and enter your administrator password
    to continue.


    ### Find My Mac


    Just like your iPhone or iPad, Mac comes with a handy feature called “Find My
    Mac” which lets you find your computer if someone steals it or you just misplace
    it; you can also wipe its hard drive clean remotely.


    To enable Find My Mac, go to `System Preferences > iCloud` and check the box next
    to `Find My Mac`. Your location services must also be turned on, so go to `System
    Preferences > Security & Privacy > Privacy > Location Services` and make sure
    `Enable Location Services` is checked on.


    ![](Images/image00193.jpeg)


    To track your computer, you can log into any computer and visit `icloud.com`,
    enter your iCloud login information, and click on `Find My Mac`. As long as the
    Mac is awake and connected to the Internet through Wi-Fi or Ethernet, you will
    be able to play loud sound, lock it, or completely erase it so your private information
    is removed.


    ### Privacy


    Apple knows people worry about privacy; they have lots built in to help you control
    what can (and can’t) be seen.


    #### Internet Privacy


    If you’d like to clear your search and browsing history, there are two ways to
    do it: either by clicking on `Safari > Clear History and Website Data` or `History
    > Clear History and Website Data`. Both can be found on the top menu bar. When
    the window comes up, you will be able to choose how far back you want the clearing
    to reach, and once you make a selection, just press the `Clear History` button
    to make the changes final.


    Cookies allow websites to store data and track certain things, like what other
    websites you visit during your Internet session, or what kind of products you
    tend to look at the most. This information is mostly used by advertisers to better
    target ads for you, but the option is always there if you’d like to disable them.
    Open up Safari, go to `Safari > Preferences`, then select the `Privacy` tab. The
    cookie options range from allowing all websites to store cookies to blocking all
    websites. You can also allow cookies only from the most frequently visited websites.
    If you prefer not to be tracked, check off the box at the bottom that says `Ask
    Websites To Not Track Me`. Some websites will not function as you may want them
    by disabling this feature.


    #### Application Privacy


    The other part of privacy is through installed applications. Go to `System Preferences
    > Security & Privacy` and click the `Privacy` tab. You can shut `Location Services`
    off by checking the box next to `Enable Location Services`. Browse through the
    left sidebar and you’ll be able to customize permissions. If you don’t want any
    apps to access your contacts or calendars, here is where you can block some or
    all programs from that information.


    ![](Images/image00194.jpeg)


    # Part 3: Maintenance


    ## Preserving Battery Life


    If you are using an iMac, then this section will obviously not apply since iMacs
    don’t run on battery, but if you have a MacBook, then this section for for you.


    Most MacBooks can easily get over 6 hours of battery life, but there are things
    you can do to get even more.


    - Go to `System Preferences > Energy Saver` and under the `Battery` tab, choose
    to put hard disks to sleep whenever possible, and dim the display slightly while
    on battery power. You don’t want to set it too low, or you’ll find it going to
    sleep when you are reading or doing a task that doesn’t require movement.

    - Keep the screen only as bright as you need to clearly see the screen. The `F1`
    key will minimalize the brightness and `F2` will make it bright again. If you
    are at the beach then you will want the brightest, of course; but if you are in
    a dark room do you really need full brightness? Probably not.

    - The keyboard also has brightness that can be adjusted with `F5` and `F6` on
    your keyboard. Backlight on the keyboard really helps in a lowlight setting, but
    when it’s broad daylight, you really don’t need it.


    ## iCloud


    iCloud lets you store things like photos and videos online. It’s kind like Google
    Drive or Dropbox. Best of all you get 5GB for free.


    - You’ll be able to back up your contacts so they are synced across your Mac,
    iPhone, and iPod. Make a change in a contact card or add a new contact, and the
    change or addition will be reflected across all your synced devices.

    - Media files purchased through iTunes Store won’t count against your storage.

    - It makes files available across all your Mac devices.


    If you haven’t set up an iCloud account, you can create one by going to `System
    Preferences > iCloud` and following the on screen instructions. Once you’re finished,
    you’ll be able to select what kind of data you’d like synced through iCloud: Photos,
    Mail, Contacts, Calendars, Safari, Notes, Keychain, and more. At the bottom you
    will notice a bar that indicates how much storage has been used, and how much
    available storage you have left.


    If you want more storage, you can pay extra. The following are the rates as of
    this writing:


    - 20 GB for $0.99 a month

    - 200 GB for $3.99 a month

    - 500 GB for $9.99 a month

    - 1 TB for $19.99 a month


    If you decide to change your mind and don’t need the extra storage plans, Apple
    gives you 15 days to contact them and ask for a refund.


    ## Time Machine


    Everyone worries about losing their data; Apple helps you out with one of their
    most powerful behind-the-scenes apps: Time Machine.


    Time Machine will back up all of your files, applications, and settings with minimal
    configuration or headache. In the case of a catastrophic event such as hard drive
    failure, having a Time Machine backup can allow you to quickly recover all of
    your data and applications, and even all of your settings (such as your desktop
    background and even the specific location of icons on your desktop).


    You will need to buy an external USB or Thunderbolt hard drive. It is recommended
    to buy a drive that is larger than the current used space on your computer. For
    example, if you have used 100 gigabytes of space on your computer’s hard drive,
    you should buy at least a 120 gigabyte hard drive.

