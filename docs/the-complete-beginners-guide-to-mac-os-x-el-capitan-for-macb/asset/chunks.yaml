    \n![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-15 at 9.38.15\
    \ AM.png](Images/image00091.jpeg)\n\nNext, click “Updates” from the top menu bar,\
    \ and then click “Update” next to the software that needs updating. If you don’t\
