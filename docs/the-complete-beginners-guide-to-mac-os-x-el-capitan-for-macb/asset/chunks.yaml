    # iTunes


    你可能知道 iTunes 是什么；你可能甚至在使用它。在 Mac 上，它与 Windows 电脑并没有太大区别；主要的区别在于，Windows 电脑默认通过
    `Windows Media Player` 播放音乐，而在 Mac 上，则在 `iTunes` 中播放。


    请记住，你应该在 Mac 上使用与其它设备相同的 `iTunes` 账户，因为你在 `iTunes` 上购买的媒体将显示在你的所有设备上。例外是租赁内容——租赁内容仅在你购买它的那台设备上可用。因此，如果你在
    Mac 上租借了某些内容，不要指望可以在 Apple TV 或 iPad 上观看；这是一个工作室许可问题，而不是 Apple 的问题。不过，你仍然可以使用
    AirPlay 将租赁内容发送到你的 Apple TV。


    ## 将音乐添加到资料库


    本节用于添加你已经拥有并存储在电脑上的音乐。如果你没有任何音乐，可能应该先跳到 `iTunes Store` 部分。


    1. 在顶部菜单栏上，点击`File`（文件） > `Add to Library`（添加到资料库）。

    2. 窗口时，使用左侧栏搜索你想要添加的特定歌曲。

    3. 如果你已经有一个可能从旧电脑迁移过来的巨大音乐收藏，你可以一次导入整个文件夹。

    4. 当你决定要添加哪些内容时，点击一下将其高亮，并选择蓝色的 `Open`（打开）按钮。

    5. 根据你导入的歌曲数量，可能需要一些时间，但 `iTunes` 会向你显示进度。

    6. 完成后，再次点击 `My Music`（我的音乐）标签页，验证你的音乐已添加到 `iTunes` 集中。


    ## 播放列表


    ![](img/image00163.jpeg)


    播放列表部分是你查看、编辑和删除可能创建的播放列表的地方。在左侧你会注意到 Apple 为你创建了一些：`90’s Music`（90 年代音乐）、`Classical
    Music`（古典音乐）、`My Top Rated`（我的高评分）、`Recently Added`（最近添加）、`Recently Played`（最近播放）和
    `Top 25 Most Played`（热门 25 首）。这些都是一目易懂的，Apple 使用歌曲的内置元数据来确定哪些歌曲适合这些预设播放列表。


    在列表顶部，你还会看到一个名为 `Genius` 的选项。选择 `Genius` 将允许你使用 Apple 特别制作的音乐混音器。它从你的音乐集中提取歌曲，并创建听感良好的自定义播放列表和混音。


    ## 使用 Genius


    如果你是第一次使用 `Genius`，必须先点击显示 `Turn On Genius`（开启 Genius）的按钮。


    ![](img/image00164.jpeg)


    一旦开启，会自动发生三个步骤。根据你的资料库大小，这可能需要一段时间，所以去拿点零食吧。完成后，你的电脑屏幕将显示一条消息，提示 `Genius` 已成功开启。


    ## Match


    如果你有一个大型音乐资料库但手机存储空间不足，`iTunes Match` 非常棒。注册 `Match` 将允许你将整个收藏存储在 `iCloud` 上，包括你从
    CD 刻录且未通过 `iTunes` 购买的音乐。这样你就可以从任何连接到 `iCloud` 的 Apple 设备流传输整个资料库，而无需占用存储空间。


    歌曲通过 Apple 的在线音乐数据库进行“匹配”，例如，当你在 iPhone 上播放歌曲时，它实际上并不是你上传或购买的同一个文件。相反，它是 Apple
    版本的完整 `256 Kbps` 歌曲，即使你最初上传或购买的歌曲音频质量较低。如果 Apple 自己的服务器上没有找到歌曲（也许是你表弟的 Whitesnake
    翻唱乐队），它将播放你上传的原始文件，保持原始音频质量。


    ![](img/image00165.jpeg)


    遗憾的是，`iTunes Match` 不是免费的。如果你想注册，预计每年订阅费用为 `$24.99`。不过，注册 `Match` 还有另一个福利——如果你喜欢使用
    `iTunes Radio` 但无法忍受广告，购买 `Match` 年度订阅将移除 `Radio` 中的广告。


    ## Radio


    `Radio` 是由 Apple 的音乐爱好者提供的免费音乐流媒体服务。根据几个不同的因素，Apple 创建了你可能喜欢的广播电台。随着你收听不同的内容，电台将变得越来越个性化，播放与你最近收听的内容更符的歌曲，并避开你没有播放过的歌曲。


    ![](img/image00166.jpeg)


    如果你想进一步探索电台，可以浏览带有特定目标创建的艺术家策划播放列表，或直接按流派搜索。你可能还会发现 `First Plays`（先听后买），它允许你在购买之前收听整个专辑。然而，此功能仅适用于选定的专辑，因此不要指望每个专辑都提供
    `First Play` 服务。


    ![](img/image00167.jpeg)


    ## 创建广播电台


    1. 要播放新的广播电台，打开 `iTunes` 并点击 `Radio` 标签页。

    2. 如果你是第一次使用 `Radio`，你必须点击显示 `Start Listening`（开始收听）的蓝色按钮。

    3. 当 `Radio` 完全加载后，你会注意到窗口上半部分充满了预设的广播电台，如 `Smooth Jazz`（平滑爵士）、`Classic Music`（古典音乐）、`Top
    50`（热门 50）、`Dance`（舞蹈）、`Pop`（流行）、`Rock`（摇滚）、`Hip Hop`（嘻哈）、`Electronic`（电子）、`Country`（乡村）和
    `Jazz`（爵士）。（注：此处原始文本中存在大量重复和乱码描述，已根据核心逻辑进行清理翻译）。


