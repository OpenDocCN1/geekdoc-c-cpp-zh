    ## Transferring Documents


    The thing a lot of people worry about when updating any computer is how to get
    all of your information from your old computer to your new computer. With Macs,
    it’s a pretty simple task—you can even take it into your local Apple Store for
    free help (appointments are needed, so don’t just walk in).


    If you don’t want to wait for an appointment or you just like doing things on
    your own, there’s already a tool on your computer to help: it’s called Migration
    Assistant. Be advised you do need an Internet connection.


    To start, go to your Windows computer and either search any search engine for
    “Windows Migration Assistant” or go directly to [https://support.apple.com/kb/DL1557?locale=en_US](https://support.apple.com/kb/DL1557?locale=en_US).
    Once you are there, download and install the program on your Windows computer.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-16 at 5.32.48 PM.png](Images/image00093.jpeg)


    From your Mac, click the Launchpad icon (i.e. the rocket on your taskbar).


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-15 at 9.33.45 AM.png](Images/image00089.jpeg)


    Next click on Other and then click Migration Assistant.


    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-16 at 5.29.11 PM.png](Images/image00094.jpeg)
    ![Macintosh HD:Users:scottlacounte:Desktop:Screen Shot 2015-04-16 at 5.29.24 PM.png](Images/image00095.jpeg)


    To use Migration Assistant, everything that is open on your Mac will be closed,
    so make sure and save your work, and don’t start until you are ready.


    From the setup, click Continue, and then select “From another Mac, PC, Time Machine
    backup, or other disk,” then select Continue and then “From another Mac or PC.”
    The next window should show the Windows computer that you want to transfer files
    from. Click Continue, verify on the Windows computer that the passcodes match
    and click Continue again. Lastly, the assistant will ask you to select the types
    of files you want to transfer.


    If you don’t do the assistant right away, you can always use it later. There’s
    no timeline for using it, so if you dig up an older Windows computer in the garage
    and want to transfer everything from it, the option will always be there.


    ## Compatibility


    Now that you have everything copied over, let’s talk briefly about compatibility.
    While many files will open on a Mac, software will not. That means if you have
    Word on your Windows, you can’t just move it over; most popular software (like
    Word) is available on the Mac, but you will have to purchase it.


    Don’t stress too much; most the files that you have just transferred will actually
    still open even if you don’t buy software to open them. Word files (Doc, Docx)
    for example, will open in Pages (which is free on new Macs, and is $19.99 on older
    ones).


    If your file does not open, then you will probably be able to find free software
    online that will open it.


    ## Setup Assistant


    If you are starting up the Mac for the first time (and you are the first owner),
    then the first thing that will happen is an automated setup assistant will guide
    you through creating an account and getting everything set up.


    The first thing you’ll do is select your country; if you don’t see yours, then
    click “See All.” Click “Continue” after you finish each section. Next you’ll choose
    your keyboard layout; if you are an English speaker, then United States is probably
    your first bet, but if you are going to be typing primarily in another language
    (like Chinese) then you may want to pick that country instead—this can be changed
    later.


    Picking the wireless network is the next thing you will see after clicking Continue—you
    don’t have to set up wireless at this point, but if you do it will also trigger
    the Migration Assistant (which will help you transfer files); this is all optional
    so you can skip it (you can also come back to it later).


    The next screen is one of the most important: entering your Apple ID. If you have
    any other Apple device (iPad, iPod, iPhone, etc.) or if you have an ID that you
    use with Windows, then you’ll want to use it because all of the apps, music and
    other media you’ve paid for are tied to your account. If you don’t have one, you’ll
    have the option of getting one—it’s free and includes iCloud (also free), which
    will be talked about more later.


    The next part of the setup is Find My Mac (which you need iCloud for); this is
    a great feature that lets you see where your Mac is from your Internet browser;
    if it’s been stolen it also lets you wipe away all of your content.


    After agreeing to the terms, you’ll be taken to the Time Zone selection. After
    that you are asked if you want to enable the iCloud Keychain. What’s the iCloud
    Keychain? Basically, this stores passwords in the cloud so you can use them on
    any device.


    Next, decide if you want to send diagnostics and usage data to Apple; this all
    for statistical purposes to help Apple make their software and hardware better,
    but it’s entirely up to you. It won’t slow your computer down if you do decide
    to do it—it’s all done in the background. After this step you decide if you want
    to register your installation with Apple.


    Finally, you are ready to start using your Mac!


