  md: "# # Getting Started with RSpec\n\nRSpec is a large, involved framework, with\
    \ uses that go well beyond Rails. We'll cover the basics here, with special emphasis\
    \ on uses within Rails and also on the contrast between RSpec and Test::Unit.\
    \ We have already alluded to various differences in naming conventions, but RSpec\
    \ also tends to favor a different style than Test::Unit, with more mock objects.\
    \ This chapter can only scratch the surface of what's possible with RSpec; for\
    \ more details, check out The RSpec Book [TRB].\n\n# ## Installing RSpec\n\nNavigating\
    \ the various RSpec and Rails versions to install RSpec correctly is a little\
    \ complicated. For the rest of this chapter, we're going to assume Rails 3 and\
    \ RSpec 2. Where advisable, differences between RSpec 2 and RSpec 1.3.x will be\
    \ noted.\n\nInstalling older versions of RSpec or installing into older versions\
    \ of Rails can get a little dicey. Instructions for different combinations of\
    \ Rails and RSpec can be found at http://wiki.github.com/dchelimsky/rspec/\n\n\
    One initial difference between RSpec 1 and RSpec 2 is that RSpec 2 is split across\
    \ multiple gems. For our purposes, the most interesting one is rspec-rails. Since\
    \ the other gems are dependencies on rspec-rails, importing that gem into a project\
    \ brings the others along for the ride.\n\nTo get RSpec into your project, include\
    \ it in your bundler Gemfile like so:\n\n```\ngroup :test, :development do\n \
    \ gem \"rspec-rails\"\nend\n```\n\nThe rspec-rails gem must be in both the development\
    \ and test groups in order for the RSpec generators to be available from the default\
    \ command line. As I write this, the current version is 2.3.\n\nRun a bundle install\
    \ to install the RSpec gems. After that is done, you can run the initial RSpec\
    \ generator, which creates the RSpec skeleton files:\n\n```\n% script/rails generate\
    \ rspec:install\ncreate .rspec\ncreate spec\ncreate spec/spec_helper.rb\n```\n\
    \n## You'll get this:\n\n+   - The .rspec file, where RSpec runs go. Initially,\
    \ the only option is --colour. [58]\n- The spec directory, where your specs go.\
    \ RSpec does not automatically create subdirectories like controller and model.\
    \ Those are created by the generators when you build spec in those directories"
