- pgno: 278
  md: '# Command-Line Rcov


    You can run Rcov directly from the command line without Rake. By way of comparison,
    the system generated by the default Rake Rcov task looks like this:


    ```

    $ rcov -o "Users/node/Projects/tasker/coverage/test" -T

    -x "rubygems:rcov**" -rails -libtest"

    /Library/Ruby/Gems/1.8/gems/rcov-0.8/lib/rake/rcov_test_loader.rb

    test_file_1.rb_test_file_2.rb

    ```


    The command is all on one line and has a list of actual files at the end after
    the options. Although normal usage is for those executed files to tests, they
    can be any Ruby script.


    An important note: any of Rcov''s command-line options can be passed to the Rake
    task by including them as a string in RCOVOOPTS command-variable, as follows:


    ```

    $ rake rcov RCOVOOPTS="only-uncovered --sort coverage"

    ```


    Here''s a brief guide to the most useful Rcov command-line options. In the next
    section, I''ll show you how to roll your own Rake tasks to make the Rcov report
    more useful. As with most Unix-line utilities, many of these options have a single-dash
    shortcut and a double-dash name. This is not a complete list.


    +   --aggregate FILE


    Aggregate the current data with existing data from a previous run that is in the
    associated Rcov data file.


    +   --annotate -a


    Generate annotated source code.


    +   --comments


    Mark all comments as covered (the default is the opposite, --no-comments).


    +   --exclude PATTERNS -x


    Do not generate coverage information for files matching the list of comma-separated
    regular expression patterns.


    +   --html


    Generate HTML output. The opposite is --no-html.


    +   --include DIR:DIR -I DIR:DIR


    A colon-separated list of paths to be included in the load path.


    +   --include-file PATTERNS -i PATTERNS


    Only generate coverage information for files matching the given set of comma-separated
    regular expression patterns. The inverse of --exclude.'
  merge: -1
  img_proc: true
