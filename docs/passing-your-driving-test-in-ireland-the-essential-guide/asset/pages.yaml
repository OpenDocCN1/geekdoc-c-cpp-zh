    This functionality requires at least a controller and a view test to start, and
    we may use some model tests later. We are going need some status report data for
    this test, and we haven''t discussed fixtures. To get these tests to work, we
    first need to get some sample data into our test, and then we''ll use that data
    to specify the behavior of the application.


