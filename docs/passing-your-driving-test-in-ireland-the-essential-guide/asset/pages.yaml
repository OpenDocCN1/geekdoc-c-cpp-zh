    shows a certain flavor of nutsand-bolts, I think. In MySQL, you could do something
    similar with a database dump file, but it would be kind of slow for a larger dataset.


    The other option is to create a performance entry in `database.yml` and point
    it to a database instance with your performance data. Then you need to Rails to
    run your tests in a performance environment. This takes some sneakiness, because
    Rails will avoid a test run if it determines the environment is not `test`.


    Still, can it done [93]? Create a copy of your `test_helper.rb`, and call it `performance_test_helper.rb`.
    Change the beginning of the file to read like this:


    ```

    huddle 3/test/performance_test_helper.rb

    ENV[''RAILS_ENV''] = "test"

    require File.expand_path(''../config/environment'', __FILE__)

    require ''rails/test_helper''

    Rails.env = "performance"

    ActiveRecord::Base.establish_connection

    ```


    The rest of the file you can take or leave—you may not need all the junk in your
    regular `test_helper.rb` to support performance testing. What we''re doing is
    loading Rails in a test environment and then switching to a performance environment
    and reconnecting to the database, which points out the database specified for
    the performance entry you put in the `database.yml`. This works, but with the
    downside that it loads application configuration based on the `config/environments/test.rb`
    settings, where Rails needs to boot in the test environment. In most cases, this
    shouldn''t be a problem. You also need to change the line in all your performance
    tests from `require ''test_helper''` to `require ''performance_test_helper''`'
