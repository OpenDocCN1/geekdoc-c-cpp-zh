- pgno: 312
  md: '# Chapter 19


    # Performance Testing and Performance Improvement


    Talking “performance” in your tests usually refers to two separate tasks. The
    first is performance testing, or using your test suite to automate testing of
    the actual performance of your application. The second is test performance, or
    trying to get your test suite itself to run as quickly as possible.


    The tools Rails to set up and evaluate the results of performance testing are
    relatively simple to use, at least compared to the convoluted setups required
    before performance tests were added to core Rails. The results of these tools
    can be used to compare application performance over time, as well as track down
    the exact location of performance bottlenecks.


    The tools to improve how fast your test suite are largely outside the test framework.
    Generally, test performance comes in three flavors. You can write tests that take
    fewer resources to run, choose an alternate test runner that takes better advantage
    of available CPU time, or modify your environment to allow common test activities
    to run faster. The last option is most applicable to something like a dedicated
    continuous integration server, which does little or nothing besides tests.


    Effective TDD depends on a tight loop between writing a small amount of test code
    and writing a small amount of application code, and so on, back and forth. The
    implicit assumption is that you can run the relevant tests quickly enough to enable
    you to bounce and forth between tests and code. However, as your application grows,
    your test suite takes longer to run. A slow test saps your productivity steadily
    and consistently. The slower it takes to run the suite, the more true TDD becomes
    painful, and the less often the test suite is run. All of this discourages the
    constant feedback that TDD—and agile coding in general—depend on.


    Efforts to speed up your test suite to fall into one of the following categories:


    +   * Focusing test execution so you only run tests most directly connected to
    the code you are writing. This isn''t exactly a performance fix, but it has a
    similar, practical effect.

    * Making performance improvements in your actual application. I trust it''s clear
    why that would speed up your tests and we aren''t going to spend much time on
    it in this particular book.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '+   Improving the performance of your tests themselves, typically by reducing
    the amount of time spent setting up tests.


    +   Using a faster runner. We will talk about two kinds here: test servers that
    stay loaded in the background and reduce the need to continually restart the Rails
    environment, and networked servers that try to find unused processors on your
    network and use them to run tests in parallel.'
  merge: -1
