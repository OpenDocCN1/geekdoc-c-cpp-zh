    # Creating Mocks with Expectations


    All these packages allow you to create a mock object with an expectation that
    the method will be called a specified amount of times. The biggest difference
    here is that FlexMock does not have a syntax for creating objects with expectations;
    any doubled object can have an expectation added by appending a method like once
    to the chain. In Mocha, RSpec, and RR, test doubles that will have expectations
    declared as such, using or (in Mocha) expects. In those libraries, specifying
    a method with mock implicitly assumes that the method will be called exactly once.


    Each library offers options to change the expected number of times a method will
    be called.


    RR has a unique feature called a proxy, where the method is actually called (as
    opposed to the return value being set by RR), but you can still specify an expectation
    on how many times the method is called.


    # FlexMock


    ```

    mock.should_receive(:method).and_return(value).once

    ```


    Other options include zero_or_more_times, twice, never, and times(n). You can
    also use combination methods, as in at_least_once or at_most_twice.


