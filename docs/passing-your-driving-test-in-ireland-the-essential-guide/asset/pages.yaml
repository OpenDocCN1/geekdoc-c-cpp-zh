  md: 'Our first test view will validate the form elements actually exist as we want
    them to, which means the attributes that will be added by the controller shouldn''t
    be in the form. With Core Rails tests, this goes with the controller in test/functional/status_reports_controller_test.rb:


    ```

    huddle3/test/functional/status_reports controller_test.rb

    ```


    +   1 test "new form has elements" do

    2 get new

    3 assert_select "form[id=new_status_report][action=/status_report]" do

    4 assert_select "#status_report_project", count => 0

    5 assert_select "#status_report_user", count => 0

    6 assert_select "textarea#status_report_today"

    7 assert_select "textarea#status_report_status_date_l1", count => 0

    8 end

    9 end


    This is a reasonably straightforward view test, which simulates a GET request
    for the new status report in line 2 and uses assert_select to verify several features
    of the output of the call. The assert_select method has seventy-seven different
    options, all of which are lovely detailed in the Chapter Testing Views. Now, the
    basic point to remember is that the first argument to assert_select is a CSS-selector,
    and the remaining arguments are assertions about elements in the output that matches
    the selector [21] For our purposes, the most useful option is :text, which is
    either a string or a regular expression. If this option is specified, the internal
    contents of tags that match the selector are checked to see whether any matches
    the argument. The second most useful option is :count, which is the number of
    elements in the view that matches the selector. If :count is not specified, :count
    is 1. The expectation is that there will be at least one. If :count are specified,
    :count is the number of items that match both the selector and the test.


    You can also nest assert_select calls using blocks; this adds the additional constraint
    that the assertions inside the block must all be true inside the body of a tag
    that matches the outer assert_select. This constraint can also be described in
    a single assert_select call using compound selectors like. In the previous test,
    the outer assert_select matches a form tag with the ID and action that was expected
    by Rails convention for a new form action. All the other assert_select calls validate
    the elements inside that form tag. Specifically, we are testing that there will
    not be a project, user, or tag date of any kind and that there will be text area
    tags for the yesterday and today status report fields.


    There could be some quibbling back forth on the exact structure of these tests.
    We have chosen to test the form fields based on their DOM IDs, knowing that Rails
    has a consistent pattern for IDs and the name field of the tag. For me, DOM IDs
    work a little better with the assert_select syntax [22] Still, a clueless programmer
    who was breaking the Rails could could cause a bug without failing this view test.
    That said, chasing down every view could break out all of the'
