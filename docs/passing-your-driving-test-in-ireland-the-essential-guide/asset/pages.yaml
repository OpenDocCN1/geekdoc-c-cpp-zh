- pgno: 339
  md: "# # Huddle’s Data Models\n\nWith the Devise boilerplate done, we just need\
    \ to create the basic data structures used for Huddle. We already have a user\
    \ model generated by Devise. We’ll need a model for the status reports and one\
    \ for the project. Right now, Project is just a string:\n\n% rails generate scaffold\
    \ project name:string\n\nA StatusReport has references to Project and User, plus\
    \ text fields for the “what I did yesterday” and “what I’m going to do today”\
    \ reports. I’ve also added an explicit date for the status, separate from the\
    \ created_at field.\n\n% rails generate scaffold status_report project:references\
    \ \\ user:references yesterday:text today:text date:date\n\nProjects and users\
    \ have a many-to-many relationship, so you’ll need a join table for that:\n\n\
    % rails generate migration project_user_join\n\nEdit the migration to look like\
    \ this:\n\n```\nhuddle/db/migrate/200908205045451_project_user_join.rb\n```\n\n\
    ```\nclass ProjectUserJoin < ActiveRecord::Migration\n  def up\n    create_table\
    \ :projects_users, :force => true, :id => false do |t|\n      t.references :project\n\
    \      t.references :user\n      t.timestamps\n    end\n  end\n\n  def down\n\
    \    drop_table :projects_users\n  end\nend\n```\n\nThen run rake db:migrate one\
    \ more time."
