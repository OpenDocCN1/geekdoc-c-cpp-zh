- pgno: 69
  md: '# Rails Available in a Model Test


    Rails model tests are subclasses of ActiveSupport::TestCase, which is a subclass
    of the core Ruby Test::Unit::TestCase. Model tests also include a couple of modules
    from the Rails core mixed in to provide additional functionality. All told, the
    following functionality is added to Ruby unit tests to make them Rails tests (as
    we''ll see in the Chapter Testing Controllers with Functional Tests), controller
    tests have even more additions:


    +   - The ability to load data from fixtures before each test.


    +   - The Shoulda and RSpec-inspired test syntax: test "do something" do.


    +   - Multiple setup and teardown block syntax, discussed in further detail in
    the section Setup and Teardown.


    +   - The assert_difference and assert_no_difference methods.


    +   - The assert_valid test, which verifies that an ActiveRecord model is—wait
    for it—valid according to the rules of that model.


    +   - A couple of little-known database helper methods that you can gain access
    to by making your test case subclass of ActiveRecord::TestCase: assert_date_from_db,
    assert_sql, assert_queries, and assert_no_queries. These are used internally by
    the Rails core test system and don''t have a lot of value outside core.


    +   - The test/test_helper.rb, required by all Rails-generated model tests and
    part of your application, injects some additional methods into ActiveSupport::TestCase.[28]
    This is a good place to put common setup and assertion methods needed by all tests.'
