- pgno: 90
  md: "# Sequencing for Unique Attributes\n\nOften you need to have a value in your\
    \ factory that is unique, even if you specify several objects. Email addresses\
    \ are a common example, since many applications will require an email address\
    \ to be unique in order to validate them. While you could explicitly specify an\
    \ email address every time you call your User factory, it's an error-prone pain\
    \ in the neck. You can avoid this problem in factory_girl sequences.\n\nDeclaring\
    \ a sequence is simple. A sequence is defined inside the main FactoryGirl block\
    \ and takes one argument that is incremented each time the sequence is invoked.\n\
    \n```\nFactoryGirl.define do\n  sequence:name do |n|\n    \"Project_#{n}\"\n \
    \ end\n```\n\nThe sequence can be referred to explicitly:\n\n```\nfactory :project\
    \ do\n  name { Factory.next(:name) }\n  url \"/#{name.downcase.gsub(\"-\", \"\
    _\")}\"\"\nend\n```\n\nBut if the attribute has the same name as the sequence,\
    \ factory_girl provides an implicit shortcut:\n\n```\nfactory :project do\n  name\n\
    \  url \"/#{name.downcase.gsub(\"-\", \"_\")}\"\"\nend\n```\n\nIf the sequence\
    \ is used in only one place, you can declare it inside the factory definition\
    \ where it is used.\n\n```\nfactory :project do\n  sequence(:name) { |n| \"Project_#{n}\"\
    \ }\n  url \"/#{name.downcase.gsub(\"-\", \"_\")}\"\"\nend\n```"
  merge: -1
  img_proc: true
- pgno: 91
  md: "# Freedom of Association\n\nIt's easy to specify related objects in your factories.\
    \ In this example, the factory for the Project class calls the User factory to\
    \ create the associated object by explicitly noting that the user is an association.\
    \ (In a one-to-many relationship, you probably want to do this from the belongs_to\
    \ side. In a many-to-many relationship, it doesn't matter what side creates the\
    \ items.) However, you do need to make sure that only one side of the relationship\
    \ creates items; otherwise you can get a circular dependency and a stack-too-deep\
    \ exception. This example also uses the Faker gem (http://faker.rubyforge.org/)\
    \ to generate random structured data.\n\n```\nfactory :user do\n  first_name {\
    \ Faker::Name.first_name }\n  last_name { Faker::Name.last_name }\nend\n```\n\n\
    ```\nfactory :project do\n  name \"Dog Meet Dog Dot Com\"\n  association :user,\
    \ :factory => user\nend\n```\n\nYou can specify values for the subordinate object\
    \ by adding them to the end of the association call just like any other factory_girl\
    \ factory invocation. In this snippet, every user created from a project association\
    \ will have the first name Noel.\n\n```\nfactory :project do\n  name \"Dog Meet\
    \ Dog Dot Com\"\n  association :user, :factory => user, :first_name => \"Noel\"\
    \nend\n```\n\nIf the factory name and the association name match, the factory\
    \ can be left off:\n\n```\nfactory :project do\n  name \"Dog Meet Dog Dot Com\"\
    \n  association :user\nend\n```\n\nIf you are following Rails conventions and\
    \ the model name matches the attribute name in the expected way, the factory can\
    \ be simplified even further:\n\n```\nfactory :project do\n  name \"Dog Meet Dog\
    \ Dot Com\"\n  user\nend\n```\n\nIn either case, creating a Project object via\
    \ factory_girl implicitly creates, verifies, and saves a User object. As regular\
    \ attributes, the value of the associated object is available for later attribute\
    \ blocks:"
