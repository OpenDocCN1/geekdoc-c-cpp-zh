- pgno: 114
  md: "# Mock Objects and Behavior-Driven Development\n\nThe interesting thing about\
    \ using true mocks is that their usage enables a completely different style of\
    \ testing. The tests we've seen throughout most of this book, the test validates\
    \ the result of a computation: it's testing the end of a process. When using mocks,\
    \ however, we have the opportunity to test the behavior of the process during\
    \ the test, rather than the outcome.\n\nAn example will help clarify the difference.\
    \ Back in the section Testing the View, the Huddle application had a controller\
    \ test that was largely based on the results of a call to the model.\n\nWithout\
    \ mock objects, the test looked like this (from test/functional/project_controller_test.rb):\n\
    \n```\nhuddle_mocha/test/functional/projects_controller_test.rb\ntest \"project\
    \ timeline index be sorted correctly\" do\nset_current_project(huddle)\nget :show,\
    \ :id => assign(reports).keys.map { |d| d.to_s(s) }\nassert_equal(\"2009-01-06\"\
    , \"2009-01-07\", expected_keys)\nassert_equal(\n  [status_reports(ben_true).id,\
    \ status_reports(jerry_true).id],\n  assigns(reports)[Date.parse(\"2009-01-06\"\
    )].map&(:id)\nend\n```\n\nAs the process played out in that section, the assertions\
    \ in this test would end up copied more or less identically to the model call\
    \ that is made by the controller action being tested here. At time, we mentioned\
    \ that a mock object package would be a different way of writing the test. The\
    \ mocked version of the test could look something like this passing test:\n\n\
    ```\nhuddle_mocha/test/functional/controller_test.rb\ntest \"mock show test\"\
    \ do\n  set_current_project(huddle)\n  Project.any_instance.expects(:reports_grouped_by_day).returns(\n\
    \    [Date.today => status_reports(aaron_true)]\n  )\n  get :show, :id => projects(huddle)\n\
    \  assert_not_nil assigns(reports)\nend\n```\n\nAt first glance, that looks ridiculously\
    \ minimalist. It doesn’t seem to actually be asserting of much of anything. The\
    \ trick is the combination of the mock expectation set in lines 3–4, along with\
    \ the rest of the tests that presumably exist in this system. This test validates\
    \ that the controller calls the model method reports variable is set to some value.\
    \ It also validates that the controller and view run without error, but that's\
    \ secondary. The test is validating a behavior of the controller method—namely,\
    \ that it calls a particular model method, not the state that results from making\
    \ that call."
  merge: -1
