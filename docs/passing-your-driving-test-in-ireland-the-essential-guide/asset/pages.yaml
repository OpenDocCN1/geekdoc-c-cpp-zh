- pgno: 80
  md: "# Defining Fixture Data\n\nA fixture is the baseline, or fixed state, known\
    \ to exist at the beginning of a test. The existence of a fixed state makes it\
    \ possible to write tests that make assumptions based on that particular set of\
    \ data. In Rails, the fixtures that are available out of the box are defined in\
    \ a set of YAML files that are automatically converted to ActiveRecord objects\
    \ and loaded for each test.\n\nUnder normal conditions, each model in your application\
    \ will have an associated fixture file. The fixture file is in YAML format, a\
    \ data-description format often used as an easier-to-fixture alternative to XML.[32]\
    \ The details of YAML syntax are both outside the scope of this book and largely\
    \ irrelevant to fixtures—YAML contains a number of advanced features that don’t\
    \ need to concern us here.\n\nEach entry in a fixture file starts with an identifier\
    \ for that entry, followed by the attributes for that entry. This sample contains\
    \ two entries for a hypothetical User class and would go in test/fixtures/users.yml:\n\
    \n```\nfred:\n  first_name: Fred\n  last_name: Flintstone\n  email: fflint@slaterockandgravel.com\n\
    \nbarney:\n  first_name: Barney\n  last_name: Rumble\n  email: brubble@slaterockandgravel.com/\n\
    ```\n\nYAML syntax is somewhat reminiscent of Python, both in the colon used to\
    \ separate key/value pairs (a feature of Ruby 1.9) and in the use of indentation\
    \ to mark the bounds of each entry. The fact that line 6, barney:, is indented\
    \ two spaces indicates the YAML parser that a new entry has begun. Strings do\
    \ not need to be enclosed in quotation marks, although it doesn’t hurt if you\
    \ find it readable.[33] A multiline string can be specified by putting a pipe\
    \ character (|) on the line with the attribute name. The multiline string can\
    \ then be written over the next set of lines; once again, indenting indicates\
    \ the end of the string.\n\n```\nfred:\n  first_name: Fred\n  last_name: Flintstone\n\
    \  description: |\n  Fred is very tall.\n  He is not very small.\n```\n\nThe Rails\
    \ fixture creation process uses information in your database to coerce the values\
    \ to the proper type. I write dates in SQL format (yyyy-mm-dd), though any format\
    \ readable by Ruby’s"
  merge: -1
  img_proc: true
- pgno: 81
  md: 'parse work.


    The identifier that introduces each record is used to access the individual fixture
    entry within your tests. Assuming that this is the User class, you''ll be able
    to retrieve these entries throughout your test suite as users(fred) and users(barney),
    respectively. Unless you like trying to figure out what''s about users(user_10),
    I recommend meaningful entry names, especially for entries that expose special
    cases: users(user_with_no_first_name).


    An older mechanism for allowing access to fixtures as instance variables (in this
    case, @fred and @barney) can be turned on by setting Use_Instantiated_fixtures
    = true in the test/test_helper.rb file. This style is largely deprecated; it''s
    rather slow, and when all fixtures are loaded, it requires your fixture entries
    to have different names across all classes. The fixture is still there, however,
    and you might occasionally see it in (really) old legacy code.


    Unlike the normal way of creating ActiveRecord models, the YAML data is converted
    to a database record directly, without going through the normal ActiveRecord creation
    methods. (To be clear, when you use the data in your tests, those are ActiveRecord
    models—only the original creation of the data to the database bypasses ActiveRecord.)
    This means you can''t use arbitrary methods of the model as attributes in the
    way you can in a create call. Fixture attributes must be either actual database
    columns or ActiveRecord associations explicitly defined in the model. Removing
    a database column from your model and forgetting to take it out of the fixtures
    is a good way to have every single of your tests error out. The fixture loading
    mechanism also bypasses any validations you created on your ActiveRecord, meaning
    that there is no way to guarantee the validity of fixture data on load, short
    of explicitly testing each fixture yourself.


    You do not need to specify the id for a fixture (although you can if you want).
    If you do not specify an id explicitly, the id is generated for you based on the
    YAML identifier name of the entry. If you allow Rails to generate these ids, then
    you get a side benefit: an easier way of specifying relationships between fixture
    objects. If your models have a relationship with models in another fixture file,
    the other object can be referenced using the name of the relationship and the
    identifier of the YAML entry in the other file. In other words, if we have a company.yml
    with this:


    ```

    slate:

    name: SlateCo

    ```


    and we also have a user model that belongs_to: company, then we can do the following
    in our user.yml file:


    ```

    fred:

    first_name: Fred

    last_name: Flintstone

    company: slate

    ```'
