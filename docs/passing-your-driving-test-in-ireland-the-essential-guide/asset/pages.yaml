- pgno: 110
  md: 'We can also nest any_of with other matchers, though we can quickly get tangled
    in a pile of syntax:


    ```

    proj.stubs(:thing).with(any_of(instance_of(String), instance_of(Integer))).returns("Argh")

    ```


    Another useful matcher is regexp_matches(guess what?)which allows us to match
    against—a regular expression:


    ```

    proj.stubs(:thing).with(regexp_matches(/.*user*/)).returns("A User!")

    ```


    A hash argument can be matched against the existence of a specific key/value pair
    with the has_entry matcher.


    ```

    proj.stubs(:options).with(has_entry(verbose => true))

    ```


    The stub in this snippet will not match any hash argument that contains a :verbose
    => true entry, no matter what the contents of the hash might.


    There''s about a dozen more of these matchers, many of which seem to queer your
    head, we shall say, somewhat lacking in real-world practical value. Rather than
    clutter with a bunch of stuff you''ll never use, I invite you to check out the
    Mocha docs at http://mocha.rubyforge.org for a full listing.


    One possible use of with is to help work around the ActiveRecord objects mentioned
    in the previous section. Anthony Caliendo came up with the following clever solution
    for creating a mock or ActiveRecord object in your test and getting it to be applied
    to the ActiveRecord object created by the controller:[40]


    Remember, the problem is that the database call from the controller creates a
    completely different Ruby object than the one you''ve attached a stub to. But
    you can dig into the ActiveRecord internals and define this in your test helper:


    ```

    Line 1 def mock_active_records(records)

    2   records.each do |record|

    3     class.stub.stubs(:instantiate).with(

    4       has_entry(''id'' => record.id.to_s)).returns(record)

    5     record.stubs(:reload).returns(record)

    6   end

    7 end

    ```


    The key phrase here is stubs(:instantiate).with in line 3. That method is called
    with a set of key/value pairs used to create an ActiveRecord object. Then in line
    4, Mocha''s has_entry decorator is used to declare that the set of key/value pairs
    contains an entry for the id that matches the known record''s ID, then return
