- pgno: 7
  md: '# Who Are You?


    The goal of this book is to show you how to apply a test-driven process as you
    build your Rails application. I''ll show you what''s available and try to give
    you some idea of what kind of tools are best used in what circunstancias. Still,
    tools come and goes, so what I''m really hoping is that you come away from this
    book committed to the idea of writing better code through the small steps of a
    TDD or BDD process.


    There are some things I''m assuming about you.


    I''m assuming that you are already comfortable with Ruby and Rails and that you
    don''t need this book to explain how to get started creating a Rails application
    in and of itself.


    I am not assuming you have any particular familiarity with testing frameworks
    or testing tools used within Rails. If you do have familiarity, you may find some
    of the early chapters redundant. However, if you have tried to use test frameworks
    but got frustrated and didn''t think they were effective, I recommend the Chapter
    [Writing Your First Tests]() and the Chapter [TDD, Rails Style](), since they
    walk through the TDD process for a small piece of Rails functionality.


    Over the course of this book, we''ll go through the tools that are available for
    writing tests, and we''ll talk about them with an eye toward making them useful
    in building your application. This is Rails, naturally I have my own opinions,
    but all the tools have the same goal: to help you to write great applications
    that do great things and still catch the train home.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# The Power of Testing First


    The way to succeed with Test-Driven Development (TDD) is to trust the process.
    The classic process goes like this:


    +   1. Create a test. The test should be short and test for one thing in your
    code. The result of the test should be deterministic.


    +   2. Make sure the test fails. Verifying the test failure before you write code
    helps ensure that the test really does what you expect.


    +   3. Write the simplest code that could possibly make the test pass. Don’t worry
    about good code yet. Don’t look ahead. Sometimes, just write enough code to clear
    the current error.


    +   4. Refactor. After the test passes. Clean up duplication. Optimize. This is
    where design happens, don’t skip this. Remember to run the tests at the end to
    make sure you haven’t changed any behavior.


    Repeat until done. This will, on paper at least, ensure that your code is always
    as simple as possible and is completely covered by tests. We’ll spend most of
    the rest of this book talking about the details of step 1 and how to use Rails
    tools to write useful tests.


    If you use this process, you will find that it changes the structure of the code
    you write. The simple fact that you are continually aligning your code to the
    tests results in code that is made up of small methods, each of which does one
    thing. These methods tend to be loosely coupled and have minimal side effects.


    As it happens, the hallmark of well-designed code is small methods that do one
    thing, loosely coupled, and have minimal side effects. I used to think that was
    kind of a lucky coincidence, and now I think it’s a direct side effect of building
    the code in tandem with the tests. In effect, the tests act as a universal client
    for the entire code base, guiding all the code to clean interactions between parts
    because the tests, acting as a third-party interloper, have to get in between
    all the parts of the code in order to work.


    This theory explains why writing the code first causes so much pain when tests
    if you just wait a little bit to get to the tests. When the tests are written
    first, or in very close intertwined proximity to the code, then the tests drive
    the code’s structure and enable the code to have the good high-cohesion/low-coupling
    structure. When the tests come later, they have to conform to the existing code,
    and it’s amazing how easily and quickly code written without tests will move toward
    low-cohesion and high-coupling forms that are much harder to cover with tests.
    If your only experience with unit tests comes only long after the initial code
    you wrote, the experience was likely painful. Don’t let that turn you away from
    a TDD approach; the tests and you will write'
