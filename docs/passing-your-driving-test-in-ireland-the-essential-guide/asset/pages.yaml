    end

    ```


    This test stops when the pending method is reached and returns its result as “pending.”
    (If the test fails before the pending is reached, the failure is treated normally.)


    You can also have pending a block:


    ```

    it "should bend steel in its bare hands" do

    pending "Not implemented yet" do

    steel.should_be_bent

    end

    end

    ```


