  md: '# So Far, So Good


    At this point, we''ve completed our initial walk-through of Rails test-driven
    development. You should be able to add tests to a Rails application; use fixture
    data; test your controllers, models, and views; and have a feel for how the TDD
    quick test/code feedback loops work in practice.


    The rest of the book is divided based on what part of the application is under
    test. Part II deals with testing ActiveRecord models, getting data into your tests
    via fixtures and factories, and other data-related topics. Part III discusses
    testing controllers, views, and helpers, each of which has some special mechanisms
    to make the process easier.


    The big third-party test frameworks, Should and RSpec, are discussed in Part IV,
    while Part V covers integration testing, both using Rails itself and using external
    tools such as Webrat and Cucumber. Finally, Part VI talks about how to evaluate
    and improve your tests, using coverage tools, managing performance, and troubleshooting.


