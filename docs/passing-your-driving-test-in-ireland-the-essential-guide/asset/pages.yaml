- pgno: 301
  md: 'there''s no way around writing unit tests. There are two distinct kinds of
    user tests that are helpful when dealing with legacy applications. We''ll talk
    about the standard TDD tests in a moment; first, let''s examine the unit test
    equivalent of the Cucumber tests discussed in the previous section. These tests
    are used to figure out what is actually going on the application—a process we
    might call Test-Driven Exploration, if we didn''t have enough three-letter acronyms
    already.


    The basic process is straightforward: the difficulty of implementation depends
    on how mangled the code is. First, select a method to test. Ideally, the method
    should be related to a change you are planning to make in the app, although this
    process also works for “what is going here” exploration.


    Let''s write a test for this method that we will know fail. We don''t need to
    go into the internals for this. What we are doing is basically sonar—sending a
    test into the depths of the code and hoping to get a sign back.


    Luckily, even the most-ignored Rails app probably still has the test directory,
    so we can write the first test without too much trouble:


    ```

    "calculation of sales tax" do

    user = User.create(state= :il)

    order = user.orders.create

    order.line_items.create(price= 250)

    order.line_items.create(price= 300)

    assert_in_delta(order.sales_tax,-300000)

    end

    ```


    What we have here is a simple, straightforward test, right up until the last line
    (insert cheesy scratch-record sound effect). We don''t really expect the sales
    tax to be –300,000. But we don''t want to guess what it is: we''ll let the app
    tell us.


    Run the test. At this point, one of two things will happen.. [83] Most of the
    time the test will error out because there is some object dependency we didn''t
    know about, value is not as expected, or we have disturbed the delicate balance
    that our legacy app needs in order to function. We''ll need to figure out how
    to smooth things out. Often, we''ll have to create more objects. In this example,
    we might explicitly create Product objects. The object chain can get unwieldy,
    which is OK at this point: the goal is to understand what''s happening. If the
    code itself is unwieldy, let the test stand as a monument to things that need
    to be changed.


    Eventually, we run out of errors, the application spins out the sales tax, and
    the test has a normal validation failure—once, again, the answer isn''t–300,000.
    At this point, we insert the actual value into the test and declare victory. We
    have some test coverage and a greater understanding of how the application fits
    together. It''s time to move on to the next test, most likely trying the existing
    method in, such as a case designed to trigger a bad response.'
