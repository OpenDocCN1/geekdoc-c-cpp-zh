    then your code actually has to behave a certain way to pass the test.


    One of the side effects of openness and metaprogramming functionality is mock
    object libraries are easier to write and have more flexibility and power than
    similar libraries in other languages (Java, I''m looking at you...). There are
    at least four used Ruby mock packages as I write. All have broadly similar features
    with slight differences in emphasis and syntax. FlexMock ([http://flexmock.rubyforge.org/])
    is the oldest least commonly used these days. Mocha ([http://mocha.rubyforge.org/])
    is in use by the Rails core team in integration testing. Double Ruby ([http://github.com/btakita/rr/tree/master])
    is a newer library with a cleaner syntax and a couple of unique features. Finally,
    RSpec has its own mock library (discussed in the Chapter RSpec), although it allows
    you to use any of the other three if you want.


    In the absence of any compelling constituency for any of these three, we''ll use
    Mocha in these examples, on the grounds that it''s pretty close to actually being
    part of core Rails. However, in the section Comparing Mock Object Libraries, we''ll
    compare and contrast the syntax of the various mock frameworks.


    Thus ends the blathering. Here''s how you actually use the things.


    Install Mocha as a gem using gem install mocha or gem ''mocha'' in a Bundler file).
    To use Mocha, place the following:


    ```

    require ''mocha''

    ```


    in any test file that will need it or in test/test_helper.rb.'
