- pgno: 36
  md: '# Beyond the Basics


    ::Unit and Rails combine to provide a common set of testing tools that are always
    available from any Rails application. If you''ve used other frameworks, particularly
    from a few years back, you may remember that setting up a group of tests into
    test cases and test suites was something of a pain. Not in Rails, where the design
    goal is to reduce unnecessary duplication of effort, especially when creating
    tests. Rails provides standard ways to define tests, a standard location for each
    test, a way to add data into the test, and easy ways to run the tests in different
    combinations.


    With this introduction to the basic core of Rails testing in hand, it''s time
    to see a more detailed example. Over the next two chapters, we''ll take an almost
    new Rails application and add new features to test it using a test-driven approach.


