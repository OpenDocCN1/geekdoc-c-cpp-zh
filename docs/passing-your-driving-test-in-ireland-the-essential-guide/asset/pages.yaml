- pgno: 5
  md: '# Testing Fable


    Imagine two programmers working on the same task. Both are equally skilled, charming,
    and delightful people, motivated to do a high-quality job as quickly as possible.
    The task is not trivial nor wildly complex either; for the sake of discussion,
    we''ll say it''s behavior based on a new user registering for a website and entering
    pertinent information.


    The first developer, who we''ll call Ernie.[1] says, "This is pretty easy, and
    I''ve done it before. I don''t need to write tests." And in five minutes Ernie
    has a working method ready to verify.


    Our second developer is, of course, named Bert. Bert says, "I need to write some
    tests."[2] Bert starts writing a test, and in five minutes, he has a solid test
    of the new feature. Five minutes later, Bert also has a working method to verify.
    Because this is a fable, we are going to assume Ernie is allergic to automated
    testing, while Bert is similarly averse to manually running against the app in
    the browser.


    At this point, you do not expect me to say that even it has taken Bert more time
    to write the method, Bert has written code that is more likely to be correct,
    robust, and to maintain. It''s true. I''m also going to say that there''s a good
    Bert will be done before Ernie.


    Observe our programmers: Ernie has a five-minute lead, but both people need to
    verify their work. Ernie needs to test in a browser; we said the task requires
    a user to log in. Let''s say it takes Ernie one minute to set up the task and
    run the action in development environment. Bert verifies by running the test—that
    takes about ten seconds. (Remember, Bert has to run only one test, not the entire
    suite.)


    Let''s say each developer tries three to get it right. Since running the test
    is faster than verifying in the browser, Bert gains a little bit each try. After
    verifying the code three times, Bert is only two and half minutes behind Ernie.[3]


    At this point, with the task complete, both break for lunch (a burrito for Bert,
    an egg salad sandwich for Ernie, for asking). After lunch, they start on the next
    task, which is a special case of the first task. Bert has most of his test setup
    in place, so writing the tests takes only a few minutes. Still, it''s not looking
    good for Bert, even after another three rounds trying to get the code right. He''s
    still a solid two minutes behind Ernie.


    Bear with me one more step, and we''ll get to the punch line. Ernie and Bert are
    both conscientious programmers, and they want to clean up their code with a little
    refactoring. Now Ernie is in trouble. Each time he tries the refactoring, he has
    to spend two minutes verifying both tasks, but Bert''s test suite still takes
    about ten seconds. After three more tries to get the refactoring task, Bert finishes
    the whole thing and checks it in three and a half minutes ahead of Ernie.[4]'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'that actual time is obviously simplified, but let''s take a moment about what
    I didn''t assume. I didn''t assume that the tests would help Bert find errors
    more easily—although I think that would be true. [5] The main point is that it''s
    frequently faster to run multiple verifications of the code as an automated test
    than to check manually. And that advantage is only going to increase as the code
    gets more complex.


    There are many beneficial side effects of having accurate tests. You''ll have
    better-designed code in which you''ll have more confidence. The most important
    benefit is that if you do testing, you''ll notice that your work goes faster.
    You may not see it at first, but at some point in a well-run test-driven project,
    you''ll notice more bugs and that the bugs that do exist are easier to find. You''ll
    notice that it''s easier to add new features and easier to modify existing ones.
    As far as I''m concerned, the only code-quality metric that has any validity is
    how easy it is over time to find bugs and add new behavior.


    Of course, it doesn''t always work out that way. The tests might have bugs. Environmental
    issues may mean things that work in a test environment won''t work in a development
    environment. Code changes will break tests. Adding tests to already existing code
    is a pain. Like any other programming tool, there are a lot of ways to cause yourself
    pain with testing.'
  merge: -1
