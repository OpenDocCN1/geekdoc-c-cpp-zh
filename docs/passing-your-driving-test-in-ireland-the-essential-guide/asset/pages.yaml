- pgno: 314
  md: "# Performance and Benchmark Testing\n\nLike the criminal system in the Law\
    \ & Order opening narration, Rails performance tests have two separate but equal\
    \ parts. In a benchmark test, a block of code, usually containing one or more\
    \ page hits, is run multiple times. The benchmark test simply measures how long\
    \ the test code takes to run. The data is then stored, allowing you to compare\
    \ the current performance of the code with past performance. The goal of a benchmark\
    \ suite is a first hint that something has actually caused your code to slow down.\
    \ Alternately, benchmarks can be used as a before-and-after when you plan on making\
