- pgno: 126
  md: '# Testing Controllers with Functional Tests


    Even more than model testing. Rails controller testing depends on Rails-specific
    structures and methods. The goal of controller testing is to simulate a single
    request to a specific controller method and make assertions about the result.
    This may or may not include assertions about the view output, depending on your
    taste. Standard Rails functional testing includes both controller and view tests,
    third-party add-ons allow for separate testing of views and partials.


    | What''s in a Name, Part Two |

    | I don''t want to belabor the point (too late), but as much as I try to hold
    to standard Rails naming conventions here, functional test still doesn''t sit
    right with me. I''ll stick to controller test and view test in order to be specific
    about the actual goal of the test. |'
