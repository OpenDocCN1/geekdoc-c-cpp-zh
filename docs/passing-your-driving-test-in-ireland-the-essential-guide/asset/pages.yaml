  md: "# RSpec in Ten Minutes\n\nHere’s just about the smallest RSpec file that shows\
    \ off RSpec’s main features:\n\n```\ndescribe Project do\n  it \"should be abbreviate\
    \ its name\" do\n    mock_project = mock::mock/Project.name = \"My Big Project\"\
    \n    mock_project.abbr.should == \"MyBP\"\n  end\n```\n\nAs small as this example\
    \ may be, it demonstrates four of the key features of RSpec.\n\n# Contexts with\
    \ describe\n\nWhile Should uses the term *context* to refer to a set of related\
    \ tests, RSpec formally calls them *example groups*, although the term *context*\
    \ is unheard of. An example group is normally declared using the `describe` method,\
    \ although RSpec also defines the `context` as an alias.[59]\n\nThe `describe`\
    \ method takes either a String or a Class argument (or both) and a block containing\
    \ whatever specifications are grouped together, as in the previous example. If\
    \ the argument to the `describe` method is a class, the specifications described\
    \ in that block are expected to relate to that class—we’ll see in a moment how\
    \ RSpec uses information to determine what code is being executed.\n\nSetup and\
    \ teardown is accomplished via the `before` and `after` methods, each of which\
    \ takes a single argument. If the argument is `each`, the block is executed before\
    \ or after each specification, opposed to the much less used `all`, which indicates\
    \ the block is executed once before or after all specifications in the common\
    \ description executed.\n\nAs Should contexts, RSpec `describe` blocks can be\
    \ nested, with a similar meaning for combining before and after blocks. Unlike\
    \ Should contexts, RSpec specifications must be inside a `describe` block. In\
    \ a related note, in RSpec you don’t need to explicitly declare a subclass as\
    \ a wrapper for your specifications the way that `Test::Unit` files contain a\
    \ subclass of `Test::Unit`. The outermost `describe` implicitly creates an instance\
    \ of a class, including RSpec’s ExampleGroupMethods module,[60]\n\nSupport methods\
    \ can be defined inside a `describe` block using normal Ruby syntax and can be\
    \ used by any spec within the block.\n\n# Writing Specs: The “It” Factor\n\nThe\
    \ `it` method is used to define actual RSpec specifications or examples. The `it`\
    \ method takes an optional string that describes the behavior and a block that\
    \ is executed. RSpec also defines `specify`"
