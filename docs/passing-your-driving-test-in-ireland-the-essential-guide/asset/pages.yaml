  md: '```

    a_report_should_have(no).errors_on(:yesterday)

    a_report_should_have(1).error_on(:today)


    a_report_should_be_a_new(StatusReport)

    ```


    Time is up. The have(x).record construction tests how many rows are in the database
    table for that model; basically, it''s StatusReport.all.size == x. The errors_on
    matcher tests for ActiveRecord validation errors attached to the given attribute.
    The be_a_new matcher returns true if the instance is an unsaved instance of the
    provided class. You most likely use this to determine whether a controller has
    correctly saved a model based on a user’s create request.


    RSpec also provides a shortcut for mocking an ActiveRecord model, called oddly
    enough, mock_model. Ordinarily, you''d use this in a controller or view test to
    isolate the controller test from model implementation details that the controller
    test is completely independent from correctness or even the existence of the model
    code. Using mock models makes your tests run faster—no trips to the database—and
    makes them potentially more robust. Also, it explicitly places the burden of specifying
    model behavior in the RSpec model file, where it belongs. The usage pattern goes
    like this:


    ```

    mock_project = mock_model(Project,name=>"fred")nProject.stub(:find).return(mock_project)

    ```


    The first argument to mock_model is either a class that extends the Rails 3 ActiveRecord::Naming
    or a string. A string argument must evaluate either a class that doesn''t exist
    or a class that extends ActiveRecordModel::Naming. In other words, you can''t
    create a mock of a non-ActiveRecord class. Further arguments are key/value pairs
    for methods of the model that should be stubbed.[66]


    Using mock_model provides stubs to make the mock behave like a consistent ActiveRecord
    model. The mock_model method generates an ID and stubs new_record and persisted
    to be consistent. This behavior can be overridden by passing as_new_record to
    the mock, which causes it to behave as a new record, meaning no ID.


    The mocked model also stubs is_a?, kind_of?, instance_of?, andclass, to be consistent
    with the first argument to the mock_class. If you override save or update_attributes
    to be false, the mocked model will consistently stub errors.empty.


    RSpec also provides a stub_model, which is declared almost identically to mock_model,
    with a couple of significant differences. The first argument to stub_model must
    be an ActiveRecord class, though the following arguments are still key/value pairs.
    stub_model creates an actual ActiveRecord object, not a mock, and stubs the methods
    that are passed in the key/value pairs. The new ActiveRecord object prevents the
    stubbed model from accessing the database by raising an exception if you try,
    which should make tests using this object factor.'
