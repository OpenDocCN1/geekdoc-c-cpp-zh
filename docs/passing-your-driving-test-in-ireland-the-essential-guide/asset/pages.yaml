  md: "# # RSpec in Practice\n\nRSpec suggests a day of writing tests than Test::Unit,\
    \ in part because of its heavy use of mocks and a strong bias towards isolating\
    \ tests and keeping controller and model tests separate. For example, the test\
    \ that I wrote in the section The First Test-First looked like this in Test::Unit:\n\
    \n```\ntest \"creation of status report with data\" do\n  assert_difference(StatusReport.count,\
    \ 1) do\n    post :create, :status_report => {\n      project_id => projects(one).id,\n\
    \      user_id => users(userid).id,\n      yesterday => \"I did stuff\",\n   \
    \   today => \"I'll do stuff\"\n    }\n  end\n  actual = assigns(status_report)\n\
    \  assert_equal(projects(one).id, actual.project.id)\n  assert_equal(users(userid).id,\
    \ actual.user.id)\n  assert_equal(Date.today.to_s(:db), actual.status_date.to_s(:db))\n\
    \  end\n```\n\nThe translation to RSpec in a style where a mock is used to cover\
    \ the transition between the controller and model layer might look like:\n\n```\n\
    huddle rspec2/controllers/status_reports_controller_spec.rb\nit \"assigns a newly\
    \ created status_report as @status\" do\n  StatusReport.stub(:new_from_params).with({'the'\
    \ => 'params'}).do\n  mock_status_report.stub(:save).return(true)\n  post :create,\
    \ :status_report => {'the' => 'params'}\n  assigns(status_report).should be(mock_status_report)\n\
    end\n```\n\nThis is a slight gloss over the boilerplate RSpec spec for creation\
    \ in a controller. The strategy here is to set up a StatusReport class that responds\
    \ to the method new_from_params with a particular mock object. The test, then,\
    \ says that a particular method of the controller is called, and the result is\
    \ assigned to a particular instance variable of the controller. Unlike the Test::Unit\
    \ test, as RSpec is concerned, exactly what the new_with_params method does—even\
    \ whether the method exists—is the model's problem and should be dealt with in\
    \ spec. [69].\n\nIn a related story, if you go back to the original test in the\
    \ section The First Test-First, the uplift of this particular test was not a change\
    \ in the controller; the eventual result was a change in the model. That's not\
    \ a coincidence—there's no code change in the controller, when you isolate the\
    \ controller from the model, there's nothing to test in the controller.\n\nYou'll\
    \ sometimes hear people say that well done RSpec testing is like design—this is\
    \ what they're talking about. The structure of a good RSpec test actually implies\
    \ the structure of the"
