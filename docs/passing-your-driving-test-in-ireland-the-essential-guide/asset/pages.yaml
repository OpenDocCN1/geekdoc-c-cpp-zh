- pgno: 10
  md: '# What Is TDD Good For?


    The primary purpose of this style of testing where the developer is writing tests
    for her own benefit is to improve the structure of the code. That is, TDD is a
    software development technique rather than a complete testing program.(Don’t believe
    me, ask Kent Beck, who is most responsible for TDD as a concept and who said,
    “Correctness is a side effect” on a recent podcast.)[6]


    Automated developer tests are a wonderful way of showing that the program does
    what the developer thinks it does, but they are a lousy way of showing that what
    the program thinks actually should do. “But the tests pass!” is not likely to
    be comforting to a customer when the developer’s assumptions are flat-out-wrong.[7]


    Automated developer testing is not a substitute for acceptance testing with users
    or customers (which can be partially automated via something like Cucumber) or
    some kind of QA phase where users or testers push away at the actual trying to
    break something.


    This goal can be taken too far, however. You sometimes see an argument against
    Test-Driven Development that runs something like: “The purpose of testing is to
    verify that my program is correct. I can never prove this with 100 percent certainty.
    Therefore, testing has no value.” (RSpec and Behavior-Driven Development were
    created, in part, to combat this attitude.) Ultimately, though, testing has a
    lot of positive benefits for coding, even beyond verification.


    Preventing regression is often presented as one of the paramount benefits of a
    test-driven development process. And if you are expecting me to disagree out of
    spite, you’re out of luck. Being able to squash regressions before anybody outside
    of your laptop sees is one of the key ways in which strict testing will speed
    up your development over time. To make this best work, of course, you need good
    tests.


    Another common benefit you may have heard in connection with automated tests is
    that they provide an alternate method of documenting your program. The tests,
    in essence, provide a detailed, functional specification of the behavior of the
    program.


    That’s the theory. My experience with tests acting as documentation is mixed,
    to say the least. Still, it’s useful to keep this in mind as a goal, and most
    of the things that make tests work better as documentation will also make the
    tests work better, period.


    To make your tests effective as documentation, focus on giving your tests descriptive
    names, keeping tests short, and refactoring out common setup and assertion parts.
    The documentation advantage of refactoring is removing clutter from the test itself—when
    a test has a lot of dodgy setup and assertions, it can be harder for a reader
    to focus on the important functional part. Also, with common features factored
    out, it’s easier to focus on what’s different in each individual test.'
  merge: -1
