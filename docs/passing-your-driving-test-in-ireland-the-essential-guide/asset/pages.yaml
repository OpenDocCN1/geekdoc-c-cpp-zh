- pgno: 225
  md: '# # Simulating Multipart Interaction


    The general structure of an integration test is pretty simple: a bunch of controller
    calls, and validate that everything has worked out as planned.


    The key to successful integration testing is to realize that integration tests
    have a different purpose than the detailed tests that already exist (or will exist)
    in your controller and model tests. Integration tests are for verifying end-to-end
    behavior of the application as a whole, for testing the inner workings of your
    code. Attempting to use integration tests to fill the role of unit tests is not
    only going to make it harder to write the integration tests, but it’s also going
    to mean more test breakage when you make legitimate changes to the application.


    The purpose of the integration test during development is to validate that data
    passed between the different parts of a larger whole is correctly being saved
    and correctly being used—you’re to avoid test gaps. The point of using an integration
    test as an acceptance test is to perform high-level verification of the application’s
    behavior. In neither case do you need levels of detail as to the specific HTML
    being output or the details of the model back end—that’s a job for the functional
    or unit tests. You’re trying to test the overall behavior of the system, without
    worrying about implementation details.


    So, what should an integration test look like? Let’s make up an example from the
    Huddle project, the daily scrum support tool from the Chapter Writing Your First
    Tests. Let’s assume that there are a number of pages from which a user can click
    a checkbox and add a user to a list of people to follow. At some point, the user
    can go to a page that lists all the people currently being followed, allowing
    the user to see their current status or send a message or something.


    Create the integration test with the following command:


    ```

    $ script/generate integration_test_add_friends

    ```


    Your skeleton test looks like this:


    ```

    require ''test_helper''

    class AddFriendsTest < ActionController::IntegrationTest

    fixtures :all

    # Replace this with your real tests.

    test "truth" do

    assert true

    end

    ```


    Assuming all these controller methods actually exist, a first pass at the integration
    test might look like this (note that none of the code that will make this pass
    actually exists in the project right now):'
