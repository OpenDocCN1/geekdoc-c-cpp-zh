  md: 'updated at is a tracker. Under normal circumstances, if you try to explicitly
    set updated_at, Rails will automatically reset it when Model.record_timestamps
    fails sometimes, completely defeats the purpose. To change this behavior, set
    the class variable Model.record_timestamps to false before saving the object with
    modified time timestamp. Instead of Model.record_timestamps resets to normal with
    [36]


    See http://www.neeraj.name/blog/articles/800-override-automatic-timestamp-in-activerecord-rails
    for some ways to make this a little friendlier using Ruby Eigenclasses.


    # Timecop


    Recently, I''ve been solving my time problems with the help of a little gem called
    Timecop written by John Tripiano, which you can find at http://github.com/jtrupiano/timecop.
    Timecop can be placed in your Bundlerfile with the traditional gem "timecop".


    Timecop is essentially a super-specific mock object: it stands out Date.today,
    Date.now, Time.now, allowing you to explicitly set the effective date for your
    tests. Using Timecop, the original test could be rewritten as follows:


    ```

    test "reports based on start date do

    Timecop.freeze(Date.parse("2010-02-10"))

    actual = Project.find_started_in.last(6.months)

    assert_equal(3,actual.size)

    end

    ```


    Timecop.freeze commands the current date and time methods back to the date passed
    as the argument in this case, February 10, 2010. Time does not move for the duration
    of the test. A separate method, Timecop.travel, resets the time but lets the system
    time move forward from that point onward.


    Why both options? It''s because keeping time constant for the life of a test makes
    the test environment more consistent. For example, RESTful Authentication has
    an intermittent failure if the test runs over in just the right way during one
    test). But Sometimes, it is necessary for time to move forward, Timecop offers
    both options. Along those lines, it''s sometimes useful to put the following line
    in a setup method:


    ```

    Timecop.freeze(Date.today)

    ```


    with the following line in a teardown block:


    ```

    Timecop.return

    ```


    Why? It ensures that the current time doesn''t change for the duration of each
    test. Again, with certain kinds of timing-related issues, that consistency eliminates
    a possible source of intermittent test failures or just plain confusion.'
