    self.total += item.cost * item.quantity\nend\nend\nself.to_be_paid = self.total\
    \ - self.amount_paid\nif self.to_be_paid == 0\nself.paid_in_full = true\nend\n\
    ```\n\nThis code is a bit of a mess. It's doing things that should be part of\
    \ the LineItem class, and probably could stand to be split. Of, this example barely\
    \ scratches the surface of how poorly written legacy system might be [85].\n\n\
    This code calls a number of things that are probably attributes that could be\
    \ set with data, such as amount_paid or item.quantity, but it also calls a few\
    \ things that could be complex methods in their own right, such as credit_card_is_valid?\
    \ or item.ready_to_ship.\n\nA possible test for this code would look like and\
    \ might look like this (assume we're using factory_girl and have blueprints set):\n\
    \n```\nline 1 test \"calculating order status\" do\n  order = Factory(order, amount_paid\
    \ => 2.5)\n  order.expects(:credit_card_is_valid?).at_once.returns(true)\n  item1\
    \ = Factory(line_item, quantity: 1, cost: 3.5)\n  item1.expects(:ready_to_ship?).returns(true)\n\
    \  item2 = Factory(line_item, quantity: 2, cost: 5)\n  item2.expects(:ready_to_ship?).returns(false)\n\
    \  order << item1\n  order << item2\n  order.calculate_order_status\n  assert\
