- pgno: 273
  md: '# # Installing Rcov


    Like many things in life, installing Rcov is at least 10 percent more complicated
    than it should be. You download the gem normally but then need to install a native
    extension that allows Rcov to run quickly. Without the extension, Rcov runs much
    in geologic time: instrumenting for code coverage is a slow process.


    As I write, the current, live official version of the Rcov gem is a fork of the
    original gem maintained by Relevance, a leading Rails consulting shop. As far
    as http://www.rubygems.org is concerned, the Relevance version is now the canonical
    version of Rcov. To install the gem, do this:


    ```

    $ sudo gem install rcov

    ```


    If you have not been able to download a binary, once Rcov has been installed as
    a gem, you must compile the native binary that allows Rcov to run quickly enough
    to be actually useful. Those of you who are not Windows users need to navigate
    in the command terminal to the Rcov gem directory (the exact directory will depend
    on your system; for native Mac OS X installation, it''s `/Library/Ruby/Gems/1.8/gems/rcov-VERSION`)
    and run the following:


    ```

    $ sudo ruby setup.rb

    ```


    Windows users aren''t officially supported (at least as of the note that I dated
    February 28, 2010); however, you should be able to install Rcov via the Windows
    development kit at http://www.rubyinstaller.org. Note that Ruby 1.9.x is not supported
    yet but is in progress.


    Windows users can still create a binary from the original prerelease version of
    Rcov by downloading the binary file `recovert.so` http://eigenclass.org/static/rcov/binary-win32/rcovrt.so`
    and placing the file in the Ruby extension directory, if you used the standard
    one-click installer, it is probably `c:ruby\lib\ruby\site_ruby\ruby\1.8\i386-mswin32\`.


    At this point, you might want to try a simple command like `rcov --version` to
    make sure that everything is installed correctly.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Rcov and Rails


    Don’t worry, installation fans, we’re not done yet. There’s still a separate plugin
    for integrating Rcov with Rails. Luckily, this one is pretty easy:


    ```

    $ /script/plugin install http://sv.codahale.com/rails_rcov

    ```


    In Test::Unit, this gives you a series of Rake tasks; we’ll talk about RSpec in
    the section Rcov and RSpec and Cucumber. Specifically, each rake:test task you
    have defined gets a rake test:rcov and a rake test:clobber_rcov, such as rake
    test:functionals:clobber and rake test:functionals:clobber. The global test is
    test:testrcov. The Rcov task runs the associated tests using Rcov, resulting in
    an Rcov report. This report is placed in a coverage directory at the top level
    of your Rails app. The clobber task clears out the data from your directory. You
    can also run coverage on a specific test file by including the TEST option, as
    follows:


    ```

    $ rake rcov TEST=file_to_test.rb

    ```


    There are some things to be aware of. First, you don’t want those coverage files
    in your source control, so be sure to use the appropriate ignore mechanism to
    keep coverage out of the source control tree. Second, the rails_rcov plugin depends
    on the existence of Rcov. This means your staging and production environments
    either need to have Rcov installed or need to have the plugin removed, which you
    can do as part of your Capistrano deploy script, perhaps.


    # The Invisible Class Gotcha


    > Since the Rcov output contains only files that are touched by the test suite,
    a file that is completely untouched will not show up with 0 percent coverage—it
    just won’t show up, period. As a result, your coverage score will be artificially
    high, and you may not see the problem. What with Rails making it pretty easy to
    get every file in your app at minimally touched by a test, it’s rare to get bitten
    by this problem. But it does happen—well, it’s happened to me—so I thought I’d
    mention it.


    Finally and most importantly, Rcov completely ignores view files that aren’t “real”,
    Ruby, such as ERB and Hail. While I suppose in the abstract I’d kind of like to
    see my view coverage, I have to admit that in practice my attitude is more along
    the lines of “one less thing to worry about today.” Ideally, you’ll be putting
    complicated logic in the model or helper, where it can be tested and the test
    coverage can be measured.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# # Rcov Output


    When you run Rcov from one of the Rails Rake tasks, you get output in your console,
    as well as a full HTML output report. (In the next section, we''ll talk about
    how to tweak output.)


    The console output is simply a list of touched files and will show up after the
    normal Test::Unit output. Here''s an edited look at the text:


    The columns are filename, total lines of text in the file, actual lines of code
    in the file (meaning, lines that are not blank and are not comments), and percentage
    of lines of code that are covered. The last line of the output is a sum for the
    project as a whole.


    You''ll note, especially if you have an unusual Ruby installation, that the default
    Rake task will include seemingly trillions of gem, plugin, and library files that
    you don''t really care about, which are also getting getting included in the total,
    making it less useful than it might be. The next section discusses how to get
    those lines out of your reports to make them more meaningful.


    Inside the coverage directory, Rcov has created an entire directory for your coverage
    report. If you opened the index.html file in that directory, you will see something
    like Figure [Rcov index page](#I''ve filtered it to the app directory to make
    the output more meaningful). Depending on your setup, you might need to limit
    yourself to just one of the Rcov tests, such as rake test:units:rcov, in order
    to get a meaningful index file.


    ![](img/ee96ece2f92041a873deb72b056e1428_275_0.png)'
