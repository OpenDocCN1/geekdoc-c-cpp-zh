    In the new method, flit_server is a local, which not passed as an argument, is
    given the value of the object''s instance method. Thanks to the magic of Ruby’s
    ||=, if the argument is passed a value, the passed value is used for the rest
    of the method. The existing legacy code, which does not use this argument, behaves
    as is, but it gives us a lever to insert our code in the testing by calling process_flit
    with the test server as an argument:


    ```

    test "a flit is processed correctly if it has followers" do

    user = User.create(screen_name = "jot")

    follower = user.followers.create(screen_name = "jennyw")

    flit = Flit.new(user, "Hello to Sjnyw, How are things on earth?")

    flit.process_flit(TestFlitServer.new)

    asert_equal(1, follower.timeline.size)

    end

    ```


    Although this mechanism is slightly intrusive to the original code, you''ll probably
    find you use this pattern often, not just for testing code but as you add new
    features to existing code. The default argument lets new code have new behavior,
    while leaving old code behavior untouched.


    Each legacy program you work on is going to have its own quirks and require its
    own kind of creativity using these methods or others to bring the code the kind
    of test coverage needed to confidently move forward with bug fixes and new features.
    As you tackle new problems, remember that reducing dependencies makes it easier
    to test your code, makes the code cleaner, and makes future work much easier.'
