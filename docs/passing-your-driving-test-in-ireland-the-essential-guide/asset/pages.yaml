- pgno: 323
  md: '# # Using Autotest


    Autotest is a very simple tool that will, if you are like me, quickly become indispensable.
    It''s something of a bridge between the focused setups established earlier and
    the alternate test background runners. When you run autotest, it will execute
    all your tests. After that, it runs in the background. When you save a file, the
    tests associated with it are rerun. If you have a failing test or tests, those
    tests will be rerun first, and when the failing tests pass, the entire test suite
    will be reexecuted to confirm that all your tests pass again.


    In Rails 3, Autotest goes in the test group of your Bundler gem file:


    ```

    gem ''autotest''

    ```


    If you are not using RSpec, you may also need the autotest-rails gem in your bundler
    file. Whether you are running Test::Unit or RSpec, start it off by running autotest
    from the command line the directory of your Rails application.[96] Autotest will
    run all your tests from your test or spec directory. At one point, Autotest runs
    the tests in a random order by default, but that does not seem to be the default
    behavior.


    After the tests run, Autotest waits. When you save a file, Autotest can determine
    which tests are associated with the file, Autotest will run those tests. For a
    controller, it runs the associated functional test; for a model, it runs the associated
    unit test. A change to a fixture file will also trigger the associated test file
    for that model. Edits in the config or test_helper.rb files trigger the entire
    suite, and a change to the application helper also generally triggers a lot of
    tests. Edits elsewhere in the system, such as helper files or files in odd directories,
    may be ignored, but you can configure Autotest to map arbitrary files to tests—more
    on that a moment.


    If you have a failing test, Autotest''s behavior changes slightly. The failure
    message and stack trace of all failing tests appears at the end of the Autotest
    run. After that, if you change any of the files associated with the failing tests,
    Autotest runs the failing tests first. If the tests still fail, Autotest stops.
    If you change files not associated with a failing test, Autotest runs the test
    associated with the change and then tries the failing tests again. Any newly failing
    tests are added to the list of failing tests. In case, if a run makes all previously
    failing tests pass, Autotest automatically runs the entire test suite to ensure
    that there are no regressions, although this behavior can be turned off by starting
    Autotest with the option -.


    # Autotest on the Mac


    Autotest does its magic by polling the operating system for file changes. The
    downside is that it is somewhat processor-intensive, even when idling. If you
    are using Mac OS 10.5 or newer, you can use the OS FSEvent library to allow Autotest
    to receive notifications of file changes rather than polling. Naturally, this
    is much less processor-intensive. To use this, you need to install the autotest-fevent
    gem. Then, in your .autotest file, add the line require ''autotest/fevent''. This
    must be the last line in the file.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'At any time, you can hit Ctrl-C to cause Autostest to reset the list of currently
    failing tests and rerun the entire test suite from scratch. Hitting Ctrl-C twice
    in succession quits Autostest.


    Here''s where Autostest excels. If you are running something like a regular TDD,
    you''ll write a new test that will fail, and Autostest will continually rerun
    that test every time you save the passes. At the simplest level, this removes
    the need to continually invoke the tests in your IDE or command line. More helpfully,
    limiting the test to the few failing tests leads to faster runs and quicker feedback
    to your actual code.


    A little more subtly, it makes it easier to inspect what''s happening in the code.
    I''m not really one for the Rails debugger, preferring the humble print statement
    for determining what''s happening. The huge advantage of running only one or two
    tests when in failure mode is that you can throw your print statements anywhere
    in the app with impunity, knowing that you''ll see the relevant output. I''ve
    been known to add a print statement deep in Rails when I need to find out what''s
    going on, and all works perfectly darn smoothly with Autostest (you can get the
    same effect in other IDs, but Autostest works nicely).


    There are a number of plugins and hooks that you can use to customize Autostest''s
    behavior. Autostest looks for a file named `.autostest` either in your user home
    directory or in your project''s root directory.


    If you''d like Autostest to exhibit some custom behavior, add your own event-handling
    blocks. The basic form for this is:


    ```

    Autostest.add_hook :waiting do

    puts

    puts "% Waiting since \{Time.now.strftime("%Y-%m-%d %H:%M:%S")}"

    nputs

    end

    ```


    The previous is actually the autostest/timestamp.rb plugin, which you can find
    in the ZenTest directory in your very own Ruby Gems directory. The symbol :waiting
    in line 1 is the actual hook, and the block runs at a time indicated by the hook.
    In this case, when Autostest goes into waiting mode, it adds a timestamp to your
    console output, which is helpful in telling you that Autostest is actually doing
    for the moment.


    Often, what you want to do create a mapping so that Autostest associates a file
    with a specific test or'
  merge: -1
  img_proc: true
- pgno: 325
  md: "Here's an example of the autostest-rails plugin, which is automatically invoked\
    \ if Autotest detects that it is being started from a Rails application:\n\n```\n\
    add_mapping %%%app/models/(.*)\\.rb$0 do |m|\n  \"test/unit/%{m}_test.rb\"\nend\n\
    ```\n\nThe `add_mapping` command takes a regular expression—the one here uses\
    \ a custom delimiter to avoid escaping all the slashes in the path name—and a\
    \ block. The block should take itself two arguments: the filename and the actual\
    \ regular expression match object. The result of the block is a filename or a\
    \ list of filenames. You can obtain a list of files that match a regular expression\
    \ by using the `files_matching` inside the block with a regular expression as\
    \ the argument. When Autotest is running and detects a newly saved file, it searches\
    \ for the mappings created by `add_mapping` calls. If the file matches the regular\
    \ expression argument to `add_mapping`, the block is invoked, and the test file\
    \ or list of test files returned by block is added to the list of files to run.\n\
    \nYou can also specify that a file should not trigger tests by callingadd_exception\
    \ with a regular expression argument. Any file matching regex will not trigger\
    \ tests, even if it matches other mappings.\n\nAutotest comes with several plugins\
    \ that can be included in your local Autotest by requiring the module in your\
    \ .autotest. The following is a partial list of available plugins (we have already\
    \ covered autotest/timestamp).\n\nautotest/autoupdate allows you to run an arbitrary\
    \ command after Autotest has been sleeping for a while, which you can manage by\
    \ setting Autotest::Autoupdate.update_cmd = whatever in your .autotest file. The\
    \ default command is svn up—this is designed to ensure your code is always up-to-date\
    \ with the repository.\n\nA number of plugins allow various notifications. On\
