- pgno: 14
  md: '# Coming Up Next...


    This book is divided into six parts.


    Part I, which you are currently in the middle of, is an introduction to Rails
    testing. The next chapter, the Chapter The Basics of Rails Testing covers what
    you need to know to get started with testing in Ruby and Rails, covering Test:Unit,
    Test-Driven Design, and the basic workflow of a Ruby test. The following two chapters,
    the Chapter Writing Your First Tests and the Chapter TDD, Rails Style, present
    a tutorial or walk-through of a basic Rails feature realized using TDD.


    Part II of the book is application data. Most of your Rails tests will cover model
    code, discussed in the Chapter Testing Models with Rails Units. You''ll often
    need sample data to run tests, and the Chapter Creating Model Test Data with Fixtures
    and Factories talks about the two most common ways to manage data. Sometimes,
    though, you need to bypass normal behavior entirely, and the Chapter Using Mock
    Objects talks about the standard way of replacing normal program behavior as in
    testing.


    The models are the back room of your code, and Part III talks about testing the
    user-facing parts of your application. In the Chapter Testing Controllers with
    Functional Tests, we''ll talk about the standard Rails ways of testing controllers,
    while the Chapter Testing Views discuss testing. Increasingly, front-end code
    includes Ajax and JavaScript, discussed in the Chapter Testing JavaScript and
    Ajax, which introduces the Jasmine framework for JavaScript testing.


    The second half of the book is largely about extensions to core Rails testing.
    Part IV covers two of the biggest. Shoulda in the Chapter Write Cleaner Tests
    with Shoulda and Contexts, while RSpec gets its in the Chapter RSpec


    Part V of the book covers integration and acceptance testing that exercises your
    entire application stack. Rails core integration testing is covered in the Chapter
    Testing Workflow with Integration Tests. Webrat and Capybara are tools that give
    testing more clarity and power, and they get their own chapter in the Chapter
    Write Better Integration Tests with Webrat and Capybara. Cucumber becomes a very
    popular tool for acceptance testing, and the Chapter Acceptance Testing with Cucumber
    tells you all about it.


    The last part of the book is about evaluating your tests. The most common objective
    measure of tests is code coverage, which you will read about in the Chapter Using
    Rec to Measure Test Coverage. Coverage isn''t everything in testing style, though,
    and the Chapter Beyond Coverage: What Makes Good Tests? talks about five other
    habits of successful tests. Adding tests to an application has its own challenges,
    discussed in the Chapter Testing a Legacy Application. Finally, making your tests
    run faster is always a good thing, and the Chapter Performance Testing and Performance
    Improvement covers many different strategies.'
