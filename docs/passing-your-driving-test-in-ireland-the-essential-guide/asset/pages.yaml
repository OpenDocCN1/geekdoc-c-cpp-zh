  md: '# Security Now!


    Let''s take a look at Huddle''s login and security models that use the Devise
    gem. Devise has its own set of tests, so we don''t need to write tests for the
    basic behavior of login and logout. We do need to write tests to cover parts of
    the application-specific security model for who can see and edit different things.
    Let''s say that our authentication requirements are as follows:


    +   1. Users must be logged in to view or create a status report.


    +   2. Users must always have a current project chosen. Right now, any user can
    see and create a status report on any project. Assigning users to projects may
    or may not happen later. At the moment, we don''t care.


    +   3. Users can only edit their own reports. Again, there may or may not be admin
    functionality later, we''ll cross that bridge when we get to it.


    To enforce a Devise login globally throughout the app, we need to add the following
    inside the ApplicationController. In a slight break from normal procedure, we''ll
    implement the forced login in the code first.


    ```

    huddle3/app/controllers/application_controller.rb

    before_filter :authenticate_user!

    ```


    Why not do this test first? It''s because most of the functionality is already
    tested by Devise and because the authentication model is super-basic and application-wide.
    And when the login model gets more complex (if, for example, there were public
    reports that did not require a login), we''d start adding some tests.


    Despite not adding any new tests, we suddenly have no shortage of failing tests
    just from adding the login requirement. Running rake, the unit tests pass, but
    the controller tests...well


    15 tests, 0 assertions, 0 failures, 15 errors


    The test failures are all due to the login requirement: every controller is now
    being redirected to the login page. What we want for all our tests to place in
    the context of an active login.


    There are two things we need to get Devise to play nicely with our tests. First,
    we need to add the following lines to the bottom of our test/test_helper.rb. Note
    that this goes outside the ApplicationSupport::TestCase class already being defined
    in the test helper file.


    ```

    huddle3/test/test_helper.rb

    class ActionController::TestCase

    include Devise::TestHelpers

    end

    ```'
