  md: "This code is in the YAML file, an object is generated from it, is loaded into\
    \ the database every test,[14] and is by default accessible anywhere, in any test,\
    \ using the method call projects(huddle).\n\nHere's some sample fixture data for\
    \ a status report class we'll use in a later example:\n\n```\nhuddle/test/fixtures/status_reports.yml\n\
    \nben_t:\n  project: huddle\n  user: ben\n  yesterday: Worked on Header UI\n \
    \ today: Doing some testing\n  status_date: 2009-01-06\nben_wed:\n  project: huddle\n\
    \  user: ben\n  yesterday: Did Some Testing\n  today: More Testing\n  status_date:\
    \ 2009-01-07\n```\n\nThere are a couple of things to note about the fixtures.\
    \ We do not need to specify an id for each fixture; Rails automatically generates\
    \ one for us. Also, when I said that all the keys had to be database columns,\
    \ wasn't strictly true; if the key is an association, the value represents the\
    \ name of a fixture in the related table (or a comma-separated list of fixtures\
    \ for a one-to-many relationship). If we specify an id in the YAML file, the nifty\
    \ auto-association feature will not work.[15] Also, as you can see here, dates\
    \ are automatically converted from string representations.\n\nFixture files are\
    \ interpreted by Rails as ERB, so you can loop or dynamically generate data with\
    \ the full power of Ruby. Also, when copying and pasting YAML data into a text\
    \ file, remember that YAML files require a specific whitespace layout: the indented\
    \ fixture name needs to be in the leftmost column of the line. Fixtures giving\
    \ meaningful names; it'll help later. (The Rails default names are a pain to keep\
    \ straight).\n\nAlthough fixtures have many wonderful qualities—they're always\
    \ available, easy to set up and consistent across all tests—they can also be kind\
    \ of brittle. For example, if you are testing a reporting function, the results\
    \ you are expecting are sensitive dependent on the makeup of the data in the fixtures.\
    \ This dependency can cause at least two serious problems. First, if there's a\
    \ lot of data in the fixtures, the results you are testing against easily become\
    \ opaque and hard to verify. Second, if anybody adds more data to the fixture,\
    \ it can easily break all the reporting tests—a bit of a momentum-killer. As such,\
    \ a number of alternatives for fixtures have been developed that make it easier\
    \ to define test data specific to individual tests. We'll cover those in the section\
    \ Using Factories to Fix Fixtures."
