- pgno: 327
  md: '# Making Your Tests Faster


    The steps you take to improving your test performance are divided into things
    that are almost always a good idea and things that speed the test up at the cost
    of other positive features—usually independence or clarity—and should be done
    only when there seems to be a significant test performance separate from the performance
    of the application in general.


    RSpec offers you the ability to identify your slowest tests, a handy piece of
    information when you are trying to speed up your test suite. In RSpec 2.0, the
    command for it is `rspec-fp`, and in RSpec 1.3, the command is `rspec -f`.


    The first general principle of speeding up your tests is to remember that Cucumber
    and integration tests are generally slower than controller tests because they
    hit the entire Rails stack, and controller tests are slower than model tests because
    they hit part of the Rails stack. So, oversimplifying a fast test has a lot of
    model tests, a few controller tests, and relatively few integration tests.


    If you are practicing good Rails-controller design, you probably won''t have many
    controller tests, and the ones you do will interact with mock objects rather than
    actual ActiveRecord objects. However, if you are using Cucumber in an acceptance
    test—driven process, you will probably wind up with a lot of relatively slow Cucumber
    tests. This is especially true given that you can go pretty far in a Rails application
    without a lot of model logic and therefore without a lot of model tests.


    Within model and controller tests, you can keep speed under control by limiting
    the amount that each test does. In particular, you want to minimize contact with
    the database. In a controller test, this means mocked method calls, which is fine,
    since most of what we need to test at the controller level is that specific model
    methods are called. In a model test, this means creating the minimum number of
    objects required for a test and not using model objects without saving them to
    the database where required. ActiveRecord makes this a challenge sometimes because
    associations depend on IDs that are assigned automatically only when an object
    is saved.


    In desperate circumstances, you can fake a saved object by explicitly assigning
    it an ID, though I don''t recommend making a habit of it, because it is dangerous.
    If you have an existing test that saves a lot of objects to the database and isn''t
    abominable to either creating fewer objects or mocking the objects out, you can
    interrupt normal database interactions by overriding or monkey-patching the method


    ```

    ActiveRecord::Base#columns

    ```


    One thing to do is limit the number of objects you create for each test. Ideally,
    a true unit test can be performed on a single object, with any other references
    managed via mocking. That''s not always desirable—too many mocks in a single test
    runs the risk of making a brittle test. However, too many mocks in a single test
    should also be taken to suggest that your code is trying to tell you that'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'there are too internal dependencies, and it is time to factor.


    And now we have arrived at fixtures and factories. As great as factory tools are
    for creating a single focused object, because Rails loads fixtures only once,
    factories are much slower for creating a lot of objects that fixtures are. When
    factory tools first came out, it was a common pattern to migrate fixtures to tests
    by creating a great blob of factory objects to match the fixtures. Naturally,
    this turned out to be kind of slow—factories are intended to guide you toward
    more focused unit tests.


    That said, fixtures have a useful role in a Rails test structure. You may have
    a lot of classes that are background data, in which the database is a nearly static
    list of items. The first general example that comes to mind is a list of countries,
    but your application may have other kinds of list data that, for one reason or
    another, stored in the database. In that case, it can be helpful to load up all
    these background objects in fixtures, especially for integration testing, where
    your application may expect all this data to be in place. [98]


    Another, fairly quick way to speed up a test is to have contexts and single-assertion
    testing. Aesthetically, I love single assertion testing, but there''s no denying
    that it can slow down a test suite. More accurately, it can exacerbate the effect
    of a badly structured test by running the setup multiple times. If you have a
    series of assertion tests that have some setup before them, you get some speedup
    just by rolling them back together into a single test with a setup block that
    is executed only once.


    In RSpec, you need to do that by hand, but if you are using Test::Unit and Should
    contexts, you can use the fast_context gem. With that gem installed, you can replace
    any call to the Should context with the method call fast_context, and the gem
    will automatically roll together all the tests inside that context into a single
    test.


    This can give you a big speedup. [99] However, it does require that all your single-assertion
    tests are actually independent and have no side effects. But if you''ve been following
    all the advice so far, you''re doing that anyway. Single-assertion is very nice
    during active development. But if you are having a speed issue and want to go
    back and update parts of the code that aren''t under active development to roll
    the tests together, that''s potentially a big speed win for not much cost.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Using a Faster Runner


    At some point, you''ll reach the end of what you can reasonably do by changing
    the content of your tests or your application, and it''s time to starting the
    context in which those tests run. A number of tools allow you to use your machine
    resources more efficiently, by reducing the amount of time spent starting up the
    Rails environment or by allowing you run tests in parallel. I''ll cover some of
    the tools here, but this list is not intended to be exhaustive; there are a lot
    of different tools out there.


    Before we dive into various test servers, it''s worth mentioning that you may
    be able to get a speed boost by changing Ruby versions. Ruby 1.9.2 is significantly
    faster than Ruby 1.8.7, but 1.9.2 may not be feasible for your production system.
    The team that created Phusion Passenger called the Ruby Enterprise Edition (REE),
    which is optimized for server use and uses less memory than the basic Ruby 1.8.7.
    Converting to REE would be simple for most Ruby 1.8.7, and you could see a speedup.[100]
    JRuby is also a possibility for its overall performance, but Ruby''s big downside
    for TDD purposes is that its startup time is pretty slow, which can be an issue
    if you are starting an interpreter every five minutes to run your tests.


    That brings us to Spork, which allows you to keep a Ruby interpreter open and
    run RSpec and Cucumber tests without restarting Rails.[101] The presumably comes
    from a combination of “spec” and the fact that Spork “forks” a new process when
    you run your tests.


    As I write this, Spork is not fully integrated with RSpec 2, but work is in progress,
    and I expect the Spork installation process not to change substantially. Spork
    is a gem, so for Rails 3, you need gem spork in the test group of your Gemfile.


    With the gem installed, run the following command:


    ```

    spork --bootstrap

    ```


    Bootstrapping Spork puts the following code in your spec/spec_helper.rb file:


    ```

    huddle3_rspec2/spec/spec_helper.rb

    Spork.prefetch do

    # Loading more in this block will cause your tests to run faster. However.

    # if you change any configuration or code from libraries loaded here, you''ll

    # need to restart spork for it take effect.


    end

    Spork.each_run do

    # This code will be run each time you run your specs.


    end

    ```'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Are also some commented instructions; let''s walk through them. Spork has two
    kinds of code each runs exactly once when the Spork server starts and never again,
    and a separate block of code executed each time Spork spawns a new test. What
    Spork wants you to do is split all the items in your `spork_helper.rb` file (aside
    from the two requirements to load Spork itself) into one of those. Any code that
    you want to run once goes inside the `Spork.each_run` block.


    I really mean everything—the other require statements, the RSpec.configure block,
    any helper methods you are defining—the whole ball of wax goes in either the prefork
    block or the each_run block. The performance trade-off is simple. For any code
    that you put in the prefork block, you get the benefit of only needing to run
    it for the life of the Spork server, but if anything in that block changes, you''ll
    need to restart the Spork server to see that.


    You don''t need to worry about what happens if you''ve defined the Spork blocks
    and then run tests without an active Spork server. The blocks just execute on
    startup, and everything is fine.


    Once you have the blocks defined, start a Spork server with the following simple
    command:


    ```

    $ spork

    spork

    Using RSpec

    Preloading Rails environment

    Loading Spork.prefork block...

    No server is running

    Running specs locally:

    Spork is ready and listening on 8989!

    ```


    On the RSpec side, you need to add `--drb` to the rspec.opts file or add it as
    a command-line option when you run your specs. RSpec uses the Spork server to
    get a preloaded process to run, which should start faster than a normal RSpec
    session.


    Cucumber usage is similar. You can facilitate Spork setup by adding --spork to
    the command to generate the initial Cucumber files; the same --drb option causes
    Cucumber to search for the Spork server.


    Spork is handy, but it doesn''t actually improve the usage patterns of your CPU
    during test. If you are using a development machine that has a lot of CPUs or
    if you are on a network that has a lot of idle processing power at any given time,
    look at one of several tools to try and run your tests in parallel across multiple
    cores. We''re going to briefly take a look at two representative sample tools,
    with the understanding that this is a rapidly changing area; no one tool seems
    to be best for all users (the best depends on your situation), and now that you
    know tools like this exist, finding the current state of the art should be much
    easier.'
  merge: -1
  img_proc: true
- pgno: 331
  md: "First is parallel_tests, which you can find at http://github.com/grosser/parallel_tests.\
    \ The parallel_tests gem supports creating multiple test environments that run\
    \ parts of your suite simultaneously. It's a gem, so in Rails 3, you'll need in\
    \ your bundler as gem \"parallel_tests\". For RSpec, you'll want it in your development\
    \ and test group.\n\nWith the gem installed, you will need to add support for\
    \ multiple test databases. In your database.yml, augment the name of your test\
    \ database by appending an environment variable like so:\n\n```\ntest:\n  database:\
    \ huddle_<%= ENV['TEST_ENV_NUMBER']%>\n```\n\nThe database.yml file is evaluated\
    \ via ERB when loaded, and the appropriate value is based on parallel_tests managing\
    \ the various processes that it creates.\n\nAfter you change the ERB, create the\
    \ actual database instances, and load the database schema into them:\n\n```\n\
    % rake parallel_test:create\n% rake parallel_test:prepare\n```\n\nThen you can\
    \ run the test with rake parallel_tests:test for Test::Unit, rake parallel_tests:spec\
    \ for RSpec, and rake parallel_tests:features for Cucumber. If you have multiple\
    \ CPUs, multiple parallel test process will be spawned to run all your tests.\n\
    \nNote that the overall processor time to run the tests does not go down. Actually,\
    \ it goes up, because each process needs its own startup time. However, the amount\
    \ of actual clock time that passes should go down as the tests run simultaneously.\
    \ One side effect, though, is that your machine will be pretty thoroughly jammed\
    \ while the tests run, so if you like checking email during tests, you are advised\
    \ that going to slow down quite a bit. Also, Spork and parallel_test do not get\
    \ at all—don't run them together.\n\nIf you are looking for a simple way to distribute\
    \ tests across your network, Specjour works for networks that have the Bonjour\
    \ protocol installed. Specjour is a gem, so the usual gem \"specjour\" goes into\
    \ the bundler file.\n\nTo use specjour, identify the machines on your network\
    \ that are available to run tests, and set up your application to allow those\
    \ tests to run. Discovery of available machines is managed automatically by specjour.\n\
    \nSetting up a worker machine is as simple as the command specjour. The worker\
    \ machine won't necessarily start with your code, so you need to be sure that\
    \ Ruby is available on that machine, as well as the rsync system command, which\
    \ is used to move files back and forth."
  merge: -1
  img_proc: true
- pgno: 332
  md: 'a Rails project, modify the database.yml in exactly the way specified earlier
    for parallel_tests. Unlike parallel_tests, specjour will create the parallel database
    instances for you. Then running rake specjour or rake specjour:cucumber should
    start the specjour system searching for available workers on the network. You
    can have specjour running as a manager on the same machine if you just want the
    parallel tests feature, and not searching the network feature. You can also limit
    specjour to a particular number of CPUs or to only accept requests from specific
    projects.


    If you need more complex network behavior, take a look at Hydra, http://github.com/ngautier/hydra/wiki,
    which allows for more flexibility.


    A slow test suite destroys TDD by making it harder to run the tests with the frequency
    good TDD process requires. Although there are no one-size-fits-all solutions to
    performance issues, in application code or in testing, the options described in
    this chapter should give you a good start in diagnosing and taking steps to improve
    the performance of your tests.'
