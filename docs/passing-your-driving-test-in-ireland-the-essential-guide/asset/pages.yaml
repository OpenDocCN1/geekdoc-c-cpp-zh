- pgno: 71
  md: '# OK, Funny Man, What Is a Good Model Test Class?


    The goal is to have each model''s individual test file cover 100 percent of the
    code in that model. Other or controller tests will probably incidentally touch
    the model, but that''s not a replacement for effective tests for a particular
    model in its own test file. Tests should be as close as possible to the code being
    described as a separate test for the existence of relationships like


    You don''t need to write a test for relationships like belongs_to Or has_many—Rails
    those tests features thoroughly, and if you don''t have a relationship you expect,
    you''ll get failures all over the place.[29] The existence of the relationship
    should be driven by a test that needs the relationship in order to deliver functionality.
    You should write tests to cover validations in order to ensure that the difference
    between a valid and invalid object is what you expect. Named scopes can be treated
    like little relationships, but anything complicated—with a lambda block, for example—should
    probably be tested. More on that in the section


    How many tests do you need? The strict test-driven answer is all new logic should
    be driven by a failing test, and conversely, each new test should fail and trigger
    a new piece of code logic. A typical progression looks like this (if you keep
    your methods smaller and simpler, you''ll tend to need fewer tests for each method):


    +   - One test of the normal, happy-path case.

    - One test for each alternate branch through the code. Refactoring here often
    causes the method to split into multiple smaller methods.

    - At least one test for known error cases, such as being passed nil arguments,
    as needed.[30] My position, which is perhaps a little crank, is that you should
    include this only if you really need the error case to do something specific or
    reason to doubt that an expected error is really being treated as an error.


    Keep each individual test simple. In many cases, you only need to create a single
    model object for a unit test. You may find it helpful to list out all the cases
    you want to test before you start writing the tests. That''s fine, but you still
    need to write and pass the tests one at a time.


    If a single call to the method causes multiple changes in the model, it''s fine
    to have all the assertions in a single test; you don''t have to be a purist about
    keeping only a single assertion in a test method. This example from a tracking
    system, marking a story complete triggers different changes in the method. It
    can be awkward and hard to follow to have each of these assertions in a different
    method. Here''s an example:


    ```

    test "mark a story complete"

    ```'
