- pgno: 58
  md: '# Now for a View Test


    We''ve tested some model logic and some controller logic, but we still have two
    view tests that need to be written to close out the initial data entry feature.
    We''d like to validate that the form being generated contains the field names
    that the create method expects—this little gap is one of the easiest ways for
    a problem to slip through the cracks of an otherwise air-tight Rails TDD process.
    Then let''s test that the project show page actually displays the timeline of
    status reports for the project.


    Testing view logic is a bit different from testing model or controller logic.
    It''s more impressionistic and less precise. When testing views, it''s important
    to keep the larger goal of specifying the application logic in mind and not away
    huge amounts of time trying to get the view tests ultra-complete and correct.
    It''s easy to write view tests that are detailed but add little to the amount
    of coverage in the test suite and are prone to breaking any time a web designer
    looks at the HTML code cross-eyed.


    ![](img/ee96ece2f92041a873deb72b056e1428_58_0.png)


    This could be the goofiest tip I give in this whole book, but when I create test
    data for users who have some kind of relationship, I find it valuable to use names
    that are meaningful in terms of some reference or other—for instance, Fred and
    Barney, Homer and Marge, or Lois and Clark. This simple trick helps keep the relationship
    between the various pieces of test data straight in your mind. Obviously, you
    can take this too far, and there will be somebody on the team who doesn''t know
    the reference. It sounds silly, but at the very least, it will make sure every
    now and when looking at your code.


    These issues are covered more completely in the Chapter Testing Views, but here
    are three tips to keep in mind as we embark on two sets of view tests:


    +   - Consider moving view logic to helpers where possible. In the core Rails
    setup, it''s much easier to individually test a helper than it is to individually
    test a view partial (if you use RSpec, you can test view partial directly—more
    on this in the Chapter RSpec). On the other hand, moving view logic from HTML/ERB
    and into Ruby methods could cause a web-only design team to come after you with
    torches and pitchforks.

    - Remember the purpose of testing is for the developer to validate the logical
    correctness of the application. Automated view testing isn''t (and in Rails, really
    can''t) a substitute for walking through the site and checking that things line
    up and look nice.

    - Test at the semantic level, not the display level. Liberally assign DOM IDs
    and classes to the elements of the view, and for the existence of these elements,
    rather than the actual text. Obviously, there are limits; sometimes the actual
    text is critical. The advantage of DOM testing is that it doesn''t break every
    time the content team updates the text or the designer'
  merge: -1
  img_proc: true
