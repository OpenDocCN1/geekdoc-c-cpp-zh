- pgno: 232
  md: '# Write Better Integration Tests with Webrat and Capybara


    Webrat, created by Seth Fitzsimmons and maintained by Brian Elmkamp, can be used
    to make acceptance tests—the ones that treat the application as a black box—easier
    to write and execute. By now, you know I can’t resist a good naming story; the
    “RAT” in Webrat is an acronym for Ruby-Acceptance Testing. When Jonas Nicklas
    created a library to augment Webrat as an acceptance tool, he continued the rodent
    theme and called his library Capybara.


    Although frequently used in conjunction with Cucumber, Webrat and Capybara can
    support ordinary Rails integration tests and provide a more expressive, easy-to-read
    syntax. In addition, the same test can be run headless within a Rails environment
    and, by changing the driver, also run using a browser-based test environment such
    as Selenium. Capybara also allows you to use the Celerity and Culerity gems to
    test JavaScript scenarios without opening an actual browser window.


    Webrat and Capybara are quite similar. In fact, if Internet scuttlebutt is to
    be believed (and really, when has the Internet ever lied?), the two are likely
    to merge into a single project by the time you read this. For the purposes of
    this chapter, I’m going to treat them as though they are more or less already
    merged and note differences between the two as they arise.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Installing Webrat and Capybara


    Both Webrat and Capybara are test framework-agnostic and will work inside Rails
    for Test::Unit/Should, RSpec, and Cucumber. (Outside Rails, they will also work
    with Merb and Sinatra, but that''s not our focus right now.)


    Install either as a gem:


    ```

    $ sudo gem install webrat

    $ sudo gem install capybara

    ```


    Both tools have a dependency on the Nokogiri XML parser. If you are on Ubuntu
    Linux, you may need to run this command in order for Nokogiri to install properly.
    Installing Capybara on Mac OS X sometimes needs the use of a library called libffi,
    which can be installed using MacPorts with the command sudo port install libffi.[71]


    Once Webrat is installed, a bit of setup code needs to be placed in your test/test_helper.rb
    file if you are using Webrat outside of Cucumber:


    ```

    require "webrat"


    Webrat.configure do |config|

    config.mode = :rails

    end

    ```


    Note that this code goes outside the TestCase class structure.


    Capybara''s default setup is simpler. If you are using Capybara outside of Cucumber,
    you need the following:


    ```

    require ''capybara''

    require ''capybara/dsl''

    ```


    And then inside the module or class using the Capybara commands, you will need
    an include Capybara call.


    Cucumber, for its part, automatically detects which of the two libraries is installed
    for the application and generates the appropriate installation and support code.
    You can also make that decision when generating Cucumber''s initial support files.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Using the Acceptance Testing Rodents


    Webrat and Capybara are relatively simple libraries with two main purposes: first,
    to provide a DSL for easily specifying output and user interaction within an integration
    or acceptance test, second, to provide a similarly unanticipated way to specify
    the expected output of an interaction.


    The signature element of the rodent libraries is their flexibility in how form
    and link elements are specified in the test; this flexibility is consistent across
    all the core API methods listed in a moment. In a Webrat or Capybara API method,
    you identify the element to be acted on with a string. That string, which is called
    a field identifier or a locator, can match a DOM element in one of three ways:


    +   - The text of the associated label (or, for anchor tags, the text inside the
    tag)


    +   - The DOM ID


    +   - The form field name (or, for anchor tags, the HTML title attribute)


    If the field identifier is a regular expression, Webrat will correctly find a
    matching field based on the regular expression in any of these attributes except
    the form name. Capybara, which is much more closely tied to XPath in implementation,
    does not take regular expressions. The XPath back of Capybara also means that
    Capybara lookups are case-sensitive, whereas Webrat lookups are not.


    The following HTML snippet would be accessible from Webrat or Capybara as "Phone
    Number", "phone", or "userphone".


    ```

    <label for="phone">Phone Number</label>

    <input id="phone" name="userphone" />

    ```


    Another consistent element throughout these libraries is all methods that manipulate
    a form element via a field identifier also serve to verify the existence of the
    element—if the library can''t find the matching form element, the test fails.


    Most of your interaction with Webrat and Capybara occurs through the following
    nine methods:


    +   - attach_file(field_locator, path, content_type = nil)


    Simulates a file attachment to a multipart form. The field_locator is the field
    getting the file, as specified previously. The path is the path to the local file,
    and the content_type is an optional MIME type. The Capybara version does not take
    a third argument.


    +   - check(field_locator)


    Asserts that the field matching field_locator is a checkbox and changes the checkbox
    to its checked'
  merge: -1
  img_proc: true
