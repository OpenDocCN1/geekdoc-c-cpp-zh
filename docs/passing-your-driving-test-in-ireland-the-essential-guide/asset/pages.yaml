- pgno: 212
  md: '# Running RSpec


    RSpec provides a couple of options for running the spec suite. The simplest option
    is to use the rspec command, which can take either a directory or a specific file
    as its argument.


    You also have a set of Rake tasks. The main one, rake spec, is the default task
    when RSpec is installed. It runs the entire contents of the spec directory. As
    you might expect, you can also limit the task to a specific subdirectory with
    spec:controllers, spec:helpers, spec:lib, spec:mailers, spec:models, spec:requests,
    and spec:routingspec/views. If you run via Rake, you can specify standard command-line
    options by placing them in the file .rspec. The default looks like this and specifies
    that RSpec’s terminal output is in color:


    ```

    --colour

    ```


    The rspec --help command gives you a list of options that can be placed in the
    .rspec file.'
