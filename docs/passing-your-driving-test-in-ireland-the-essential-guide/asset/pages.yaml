  md: "arbitrary descendant, while the + operator means the second element must come\
    \ immediately after the first in the document, the ~ operator means the second\
    \ element must come somewhere after the first.\n\nYou can do further testing the\
    \ elements that match your selector. This is most valuable when you want to perform\
    \ a second match that is limited to one particular part of your HTML body, such\
    \ as if you want to test for the existence of a particular text input field only\
    \ within a specific form on the page. The most common way to do this kind of search\
    \ is by nesting assert_select calls. Nested assert_select calls an explicit form\
    \ that shows a general idea:\n\n```\nassert_select(\"div.headline\") do |matching_elements.each\
    \ do |element|\n  assert_select(element, \"span\")\nend\n```\n\nTo begin with,\
    \ this example exposes a feature of assert_select that hasn't been mentioned yet.\
    \ If the first argument to the assert_select is a Rails HTML::Node class, then\
    \ the search is limited to content within that HTML node. If no HTML node is specified,\
    \ then as you have seen, the default is the response body for the response tested.\n\
    \nIf assert_select is passed a block element, then the argument to the block is\
    \ an array containing all the HTML nodes that match the selector: in this case,\
    \ any div element with the DOM class headline. Inside the block, the matching\
    \ elements can be iterated on. In this case, they are iterated on for the purpose\
    \ of verifying that all headline elements contain a span subelement.\n\nThis pattern\
    \ is so common that it has a shortcut, which is used by passing a block that takes\
    \ no arguments:\n\n```\nassert_select(\"div.headline\") do\n  assert_select(\"\
    span\")\nend\n```\n\nIn this case, any assert_select method called within the\
    \ block is automatically applied to all the matching elements and must pass all\
    \ those elements in order for the entire assertion to pass—meaning that this snippet\
    \ and the previous one are exactly equivalent, and each verifies that every div.headline\
    \ element contains at least one span element.\n\nThe form where the block takes\
    \ an argument is a more flexible, although to be honest, I've used assert_select\
    \ for years without needing that flexibility—frankly, without even knowing that\
    \ flexibility existed. If you even need more flexibility, assert_select also returns\
    \ the same array of matches, so the same test could be written like this:\n\n\
    ```\nmatching_elements = assert_select(\"div.headline\")\nmatching_elements.each\
    \ do |element|\n```"
