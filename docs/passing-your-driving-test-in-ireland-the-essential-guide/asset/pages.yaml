- pgno: 173
  md: '# Write Cleaner Tests with Shouldda and Contexts


    The core testing tools distributed with Rails are great, and I would have killed
    for them back when I was doing Java applications. So, there are extensions, add-ons,
    and frameworks that make the tools even more powerful and allow us to write tests
    that are even concise and clear. We''ve seen a couple of these categories already:
    data factories in the section Data Factories and mock objects in the Chapter Using
    Mock Objects.


    Data factories and mock tools expand the reach of what we can cleanly do in a
    test. Over the next two chapters, we''ll talk about add-ons that change the structure
    of our tests as a whole. we''ll talk about contexts as a way of denoting groups
    of related tests and how the ability to organize tests can lead to a different
    style of testing where each test has a single assertion. A Rails add-on called
    Shouldda adds this style of testing on top of the standard-issue Test::Unit. In
    addition, Shouldda bundles up a lot of common test patterns into one-line macros
    that can easily be inserted into our tests.


    As we talk about single assertion test styles, we''ll show how Shouldda implements
    them on top of Test::Unit while still being useful inside RSpec. The single-assertion
    style is more appropriate in some settings than others, and we''ll also cover
    some tools that make writing single assertion tests inside Test::Unit a little
    bit easier.


    In the following chapter, we will look at RSpec. RSpec is not built on Test::Unit
    but is a completely parallel testing tool with its own structure, syntax, and
    style. RSpec is designed to allow us to specify system behavior with an emphasis
    on making our code read as naturally as possible.'
  merge: -1
  img_proc: true
- pgno: 174
  md: "In the section Setup and Teardown, we saw how Test::Unit Rails allow us to\
    \ extract common setup and teardown behavior to methods that are automatically\
    \ run before or after each test. It's a handy feature, with one flaw: the setup\
    \ methods are common to all tests in a given class. Since Rails tends to prefer\
    \ that we keep all tests for a single controller or model in one file, this can\
    \ cause problems.\n\nOften, you'll find that in addition to having setup common\
    \ to the entire class, you'll have subordinate setup common to only a cohesive\
    \ subset of the tests. For example, you might be writing controller tests for\
    \ a user that is logged in, for one that is not logged in, and for an admin. While\
    \ there is common setup to all these tests, each set of tests has a separate user\
    \ initialization not shared by the others. Only tests could be grouped with their\
    \ own startup method, one not shared by all the other tests...\n\nEnter the idea\
    \ of contexts. Contexts are not part of the Core Rails tools but are implemented\
    \ very similarly by three different add-ons: RSpec, Shoulda, and a gem by Jeremy\
    \ McConilly conveniently called Context.[56] For this discussion, we'll be using\
    \ the Shoulda syntax. RSpec contexts will be discussed in the section Contexts\
    \ with describe.\n\nThe context method is used to group set of tests into a single\
    \ set for the purpose of giving them a common setup and teardown block that is\
    \ not shared by other tests in the test class.\n\nThe basic idea is that each\
    \ context has its own methods, run before and after each test in that context—the\
    \ Context gem uses before and after as the names of these methods, and Shoulda\
    \ uses setup and teardown. To not spoil the next chapter or anything, as RSpec\
    \ uses before:(each) and after:(each).\n\nWithin a context, we define the setup\
    \ and teardown blocks by calling the methods setup and teardown. We can have many\
    \ different setup or teardown blocks as we want; they will be executed in the\
    \ order they are defined. Here's an example:\n\n```\nclass ProjectControllerTest\
    \ < ActionController::TestCase\n\ncontext \"with an admin user\" do\n  setup do\n\
    \    login_as_admin\n  end\n\n  teardown do\n    logout\n  end\n\n  test \"admin\
    \ features\"\n    #something administrative\n    end\nend\n```"
  merge: -1
  img_proc: true
- pgno: 175
  md: '```

    context "with a regular user" do

    setup do

    login_as_normal

    end

    ```


    ```

    test "normal features"

    # something normal

    end

    end

    end

    ```


    The tests in each context have the setup methods for context run before each test.
    We can still use the standard Test::Unit setup and teardown blocks outside any
    context. Those methods would be called first, before the context setup method,
    at the beginning of each test.


    Since a simple Ruby method creates contexts, we can generate them dynamically
    in the same way that tests can be generated dynamically:


    ```

    [\admin", "root"]each do |role|

    content "with a #rolef user" role do

    setup do

    @user = User.new(role => role)

    end

    ```


    ```

    test "can login"

    # this test is run twice, once in each context

    end

    end

    end

    ```


    I''m not saying I recommend this in this general, mind you, but it can be done.
    You need to be careful with this kind of metaprogramming in tests, because the
    added complexity makes it easier for bugs to get into the tests, and the metaprogramming
    will make the test less clear to future readers.


    Contexts can also be nested, which we can accomplish by simply declaring a new
    context inside the old one. We do this when we have a setup that we shared by
    other tests that will extend the setup. In this example, both contexts share the
    @product object, one tests for an administrative user would see, and the others
    tests for a normal user would see:


    ```

    context "for the product show page" do

    setup { @product = Product.create(name => "Wonderlonium") }

    ```


    ```

    context "with an administrative user" do

    setup { User.create(admin => true) }

    should "see an edit link" do

    get show,id => @product.id.to_s

    ssert_select "a", "edit"

    end

    ```'
  merge: -1
