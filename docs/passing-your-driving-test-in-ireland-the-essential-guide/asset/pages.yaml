- pgno: 101
  md: '# Chapter 7


    # Using Mock Objects


    A mock object is a “fake” object used in place of a “real” object for the purposes
    of automated testing. A mock might be used when the real object is unavailable
    or difficult to access from a test environment—a common example is an external
    credit-card payment system. A mock might also be used to easily re-create a specific
    application state that would be otherwise difficult to trigger in a test environment,
    like a database or network failure. Mocks can be used strategically to limit the
    scope of a test to the object and method specifically under test. Used in that
    manner, mocks drive a different style of testing, where the test is verifying
    the behavior of the system during the test, rather than the state of the system
    at the end of the test.'
