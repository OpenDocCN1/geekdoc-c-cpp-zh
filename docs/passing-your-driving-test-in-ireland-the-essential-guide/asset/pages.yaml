    In some sense, it''s difficult to provide stand-examples of Webrat and Capybara,
    both tools have seen most of their usage inside Cucumber tests. Used with the
    core Rails tools, though they can make the Rails integration tests behave more
    like acceptance tests. If Cucumber is not an option for practical or aesthetic
    reasons, adding either of these libraries can give you some of the acceptance
    benefit.


    At the moment, I tend to start a new project with Capybara, but there isn''t enough
    difference between the two right now that I feel the need to convert already existing
    Webrat code. Of course, by the time you read this, the tools might have merged,
    in which case you should definitely use the left one standing.


