  md: '# What Can You Test in Rails?


    When testing a Rails application, Rails specifies the default location of tests
    based on the class being tested. All Rails tests go in the test directory of the
    application. Rails assumes a consistent relationship between controllers and models
    on one hand and test files on the other. This makes it easy to know where to put
    new tests and enables external tools autotest (the section Using Autotest) to
    know what tests to run when an application file changes. You can see the app directory
    of a Rails application and its associate test directory in Directory comparison.


    ![](img/ee96ece2f92041a873deb72b056e1428_28_0.png)


    Tests for Rails models are in the test/unit directory. Each test is named for
    its model, by convention the test file test/unit/user_test.rb contains the class
    UserTest and is expected to correspond to the Rails model file in app/models/user.rb.
    In Rails 2.0 and up, unit tests are subclasses of the Rails ActiveRecord class
    ActiveSupport::TestCase, which is a subclass of the Ruby standard library class
    Test::Unit::TestCase. When you create a model using a Rails generator, the associated
    unit test class is also created for you.


    Functional tests and Rails controllers have a similar relationship. Tests for
    Rails controllers are in the test/functional directory. The file app/controllers/users_controller.rb
    contains the class UsersController. The tests for that class are in test/functional/users_controller_test.rb,
    and the test class is named UsersController::TestCase. In current versions of
    Rails, all controller tests are subclasses of the Rails ActionController::TestCase,
    which is a subclass of the same ActiveSupport::TestCase used for models. When
    you create a controller using one of the three or four standard Rails generators
    that an associated functional test is created for you. (In Rails 2.3 and up, a
    test file is also created for the helper module and stored in test/unit/helpers).


    Rails also creates a file called test_helper.rb, which contains features and settings
    common to all of your tests. This file is required by any Rails test file. [10]
    The provided file re-opens the class ActiveSupport::TestCase to allow you to add
    your own methods, which are then available to all of your tests. Typically, this
    involves initialization and teardown, complex data setups, and complex'
