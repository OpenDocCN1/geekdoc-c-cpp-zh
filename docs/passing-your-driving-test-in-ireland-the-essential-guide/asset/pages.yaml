  md: "# Creating Your Own Matchers\n\nRSpec's matchers are great, but eventually\
    \ you'll come to a situation where you'd like a particular matcher syntax to make\
    \ your tests cleanly, and the matcher doesn't exist. You have a few different\
    \ options in that case.\n\nThe first option is to write a predicate method to\
    \ cover the matcher you want and let RSpec's default be_whatever implicitly create\
    \ the matcher. This is sometimes the best solution if you control the object being\
    \ covered—you'll often end up using the predicate in your main code. If the object\
    \ you want to write the matcher is on a Rails or Ruby library object, it's more\
    \ complicated. One possibility is to monkey-patch the class in your RSpec file.\
    \ At one time, I recommended the following code in an RSpec model spec file:\n\
    \n```\nclass String\ndef parsing_to?(hash)\nexpected = Ingredient.new(hash)\n\
    actual = Ingredient.parse(self, Recipe.find(1), 1)\nactual === expected\nend\n\
    ```\n\nThat led to the following RSpec code:\n\n```\nit \"should parse a basic\
    \ string\"\n\"2 cups carrots, diced\" should be_parsing_to(amount => 2,\n  :unit\
    \ => \"cups\", :ingredient => \"carrots\",\n  :instruction => \"diced\")nend\n\
    ```\n\nFrom a perspective of two years, I'm pretty sure that's not the best way\
    \ to manage the custom matcher. On the other hand, every now and then I like to\
    \ advocate for Ruby structures that would make a mainline Java programmer sputter,\
    \ so we have that going for us, which is kind of nice.\n\nThe way you are supposed\
    \ to do it is to use the Matchers DSL:\n\n```\nRSpec::Matchers define parse_to\
    \ do |hash|\nmatch do |string|\nexpected = Ingredient.new(hash)\nactual = Ingredient.parse(string,\
    \ Recipe.find(1), 1)\nactual === expected\nend\nend\n```\n\nWhich parts of the\
    \ matcher get translated to which arguments is critical here and slightly nonintutive.\
    \ The recipient of the should method—the object being evaluated—is the block argument\
    \ to the innermost call to match. In the previous example, that would be the block\
    \ argument string. The right side of the RSpec call, which in this case is the\
    \ hash containing the expected value, becomes the"
