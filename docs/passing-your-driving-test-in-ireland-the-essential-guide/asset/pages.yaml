- pgno: 262
  md: '# Login and Session Issues with Cucumber


    There''s a big issue we''ve kind of glossed over so far: authentication. In a
    real application, we''d probably need to be logged in to view and edit projects.
    From a controller test, simulating a login is easy—we have direct access to the
    controller and session, so we can add the fake user directly to the fake session.


    From Cucumber, we don''t have access to the controller or the session, so we need
    to log in by simulating user actions. Something like this works if we are using
    Devise:


    ```

    //the user successfully logs into Huddle/

    do@user = User.create(email=> "email@email.com",

    :password => "password",

    :password_confirmation => "password"

    visit "login"

    fill_in("user_email",with=> @user.email)

    fill_in("user_password",with=> "password")

    click_button("Sign In")nend

    ```


    This step definition creates a user as an instance variable and then travels to
    the Devise login screen and simulates filling in and submitting the login form
    with Webrat or Capybara. If we wanted a specific username, it''d be easy enough
    to change the step definition to take one in. On the plus side, this is largely
    boilerplate and can be applied to most projects with little or no modification.


    Anything session-based will have a similar issue and needs to be generated by
    simulating user actions. Again, this indicates that Cucumber isn''t going to solve
    all your testing problems—just some of them.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# # Annotating Cucumber Features with Tags


    Cucumber test suites, especially on large sites, tend to be slow. Even with the
    recent speed improvements in parsing the feature files, the end-to-end testing
    is still slow relative to unit tests. To speed up the development test/code loop,
    it''s handy to be able to run a limited subset of the Cucumber features that you
    can focus on the scenarios that are actually under development.


    In Cucumber, you can separate scenarios or features into groups using *tags*.
    To define a tag, put the tag in the line before the scenario declaration, preceded
    by the @ symbol:


    ```

    @userpage

    Scenario: See user display on edit page

    Given that user "alpha" is a member of the project

    When I visit the edit page for the project

    Then I see 2 checkboxes

    ```


    If you want to multiple tags apply to the same scenario, the tags all go on the
    same line with a space between them. You can use the tags by specifying them from
    the Cucumber command line. For example, to only run scenarios with the *userpage*
    tag, use this command:


    ```

    cucumber --tags @userpage

    ```


    You can run all the scenarios that *don''t* have a particular tag by prefacing
    the tag with a tilde:


    ```

    cucumber --tags ~@userpage

    ```


    If you want to make things more complicated, you can logically combine tags. If
    you include multiple-tags options, they can act as a logical *and*. To run scenarios
    that are both @userpage and @complete, use this command:


    ```

    cucumber --tags @userpage --tags @complete

    ```


    For logical or behavior, include multiple tags in the same option, separated by
    commas. To run @userpage or @reporting scenarios, you''d do this:


    ```

    cucumber --tags @userpage,@reporting

    ```


    Also, you can specify to limit the number of scenarios that can be run with a
    given tag. Running Cucumber will fail if the number of tagged tests exceeds the
    limit:


    ```

    cucumber --tags @userpage:3

    ```


    This behavior is used by the default cucumber:wip task, but I''m not sure how
    useful it is in general.


    Cucumber gives privileged status to the @wip tag, which stands for "work in progress."
    The @wip tag is special because Cucumber gives you the default Rake task cucumber:wip,
    which runs only those'
  merge: -1
  img_proc: true
