- pgno: 287
  md: 'Two classic causes of repeatability problems are time and dating and random
    numbers. In both cases, the issue is that your test data changes from test to
    test. The date and time have a nasty habit of continuing to get higher, while
    random data tends to stubbornly insist on being random.


    The problems with the two types of data are slightly different. Dates and times
    tend to lead to intermittent failures when magic time boundaries are crossed.
    Random numbers, in contrast, make it somewhat difficult to test both the randomness
    of the number and the randomly generated number is used properly in whatever calculation
    it requires.


    The basic order of attack is similar for both cases and applies to any constantly
    changing dataset. The goal is a combination of encapsulation and mocking. Encapsulation
    generally involves creating a service object that wraps the changing functionality.
    By wrapping the functionality, you make it easier to stub or mock the output values,
    providing the consistency you need for testing. You might, create a RandomService
    that wraps Ruby’s rand method, and critically, provides a way for you to preset
    a range of output values either by using an existing mock package or by giving
    the service object a way to use a predefined value stream. Once you have verified
    that the random service class is random with its unit tests, the service class
    can be stubbed in any other test to provide polymorphic consistent random behavior.


    The exact mix of encapsulation and mocking varies. Timecop, for example, stubs
    the time and date classes with no encapsulation. That said, nearly every time
    I talk about Timecop in a public forum, some audience member is sure to point
    out that creating a time service is a superior solution.


    # Clarity


    A test is clear if its purpose is immediately understandable. Clarity in testing
    has two components. The first is the standard sort of readability that applies
    to tests as it applies to any code. The second is the kind of clarity that describes
    how the test fits into the larger test suite. Every test should have a point,
    meaning it should test something different from the other tests, and that purpose
    should be easy to discern when reading the test.


    Fixtures are a test-specific issue that can lead to poor clarity, specifically,
    the way fixtures tend to create “magic” results. To wit:


    ```

    test "the sum should be 37"

    assert_equal(37, User.all_total_points)

    end

    ```


    Where does the 37 come from? Well, if you were to peek into the user fixture file
    of this fake example, you would see how the totals of the total points of all
