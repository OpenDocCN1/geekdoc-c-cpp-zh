- pgno: 104
  md: 'Although basically similar, stubs and mocks fit into the pattern of your tests
    very differently. It is easier to start by describing stubs. A stub is a replacement
    for all or part of an object that prevents a normal call from happening and returns
    a value that is preset when the stub is created.


    In Mocha, you can create an object that exists only as a set of stubbed methods
    using the stub method, which is available throughout your test cases. Since Ruby
    uses duck typing and therefore cares only whether objects respond to the messages
    sent to them, a stub object created in such a way can be injected into your application
    as a replacement for a real object.


    ```

    test "here''s a sample stub" do

    stubby = stub(name => "Paul", weight => 100)

    assert_equal("Paul", stubby.name)

    end

    ```


    The hash arguments to stub list the methods that the stubbed object responds to
    and the values returned. So, the assertion in the second line is true because
    the stub has been preset to return the message with "Paul". If you call the stub
    with a method that is not in the hash argument, Mocha will return an error. However,
    Mocha provides the stub_everything method, which instead returns nil for methods
    not in the hash argument. Using stub_everything makes sense in the case where
    there is a large number of potential methods to be stubbed, but where the values
    make so little difference that specifying them reduces the readability of the
    test.


    In case it''s not clear, this test is a very stupid way to use stubs; I''ve set
    up a nice little tautology, and I haven''t actually learned anything about any
    larger system around this test.


    You would use a bare stub to stand in for an object that is unavailable or prohibitively
    expensive to create or call in the test environment. In Ruby, you would more often
    take advantage of the way Ruby allows to open up existing classes and objects
    for the purposes of adding or overriding methods. It''s easy to take a “real”
    object and stub out only the methods that you need. This is extraordinarily useful
    when it comes to actual uses of stubs.


    In Mocha, this is managed with the stubs method, which is mixed in any Ruby object:


    ```

    huckle_mocha/test/unit/project_test.rb

    line 1 test "lets stub an object" do

    stub_project = Project.new(name => "Project Greenland")

    stub_project.stubs(name)

    assert nil(stub_project.name)

    end

    ```


    This test passes: line 3 sets up the stub, and the stub_project.name call in line
    4 is intercepted by the stub to return nil and never gets to the actual project
    name.'
