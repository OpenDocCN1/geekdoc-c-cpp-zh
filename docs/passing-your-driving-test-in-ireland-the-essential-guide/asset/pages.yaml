  md: '# Set up and Teardown


    Let''s look at a pair of tests. The exact functionality isn''t important right
    now; we''re interested in the structure of the test:


    ```

    test "a user should be able to see an update in the project"

    fred = User.new(name => "Fred")

    barney = User.new(name => "Barney")

    project = Project.new(name => "Project Runway")

    project.users << fred

    project.users << barney

    barney.create_status_report("I''m writing a test")

    assert_equal("I''m writing a test", fred.project_statuses[0].text)

    ```


    ```

    test "a user should not be able to see from a different project"

    fred = User.new(name => "Fred")

    barney = User.new(name => "Barney")

    project = Project.new(name => "Project Runway")

    other = Project.new(name => "Project Other")

    project.users << fred

    other.users << barney

    barney.create_status_report("I''m writing a test")

    assert_equal(0, fred.project_statuses.count)

    ```


    These tests share some common code. The common setup is only a few lines, but
    a real set of tests could wind up with far more duplication. Your first signal
    that something is wrong is that the setup has probably been copied and pasted
    from one test to the next. Copying and pasting multiple lines of code is almost
    always a heads-up to at least consider what you are doing to see if there is a
    commonality that you can refactor.


    The classic way of managing duplicate setup using Test::Unit is to move the common
    code to the setup method, which is automatically called by the framework before
    each test:


    ```

    def setup

    @fred = User.new(name => "Fred")

    @barney = User.new(name => "Barney")

    @project = Project.new(name => "Project Runway")

    @project.users << fred

    ```


    ```

    test "a user should be able to see an update from a friend"

    @fred.users << @barney

    @barney.update_status("I''m writing a test")

    assert_equal("I''m writing a test", @fred.project_statuses[0].text)

    ```


    ```

    test "a user should not be able to see an update from a non-friend"

    ```'
