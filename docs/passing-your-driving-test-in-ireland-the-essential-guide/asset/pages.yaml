- pgno: 190
  md: '# When to Use Shoulda


    Originally, Shoulda was let into the world as a way to get many of the advanced
    features of RSpec without the heavy commitment that RSpec entailed and without
    some of the more magical features of RSpec syntax that some people don''t like.
    Over time, the Shoulda became more comfortable with RSpec, and now Shoulda is
    probably best understood as a way to make single-assertion easier, no matter which
    other tools are in your toolbox.


    I love the clarity of the single-line style, especially in simple cases, and that’s
    the Way I work by default. That said, it’s possible for those tests to get so
    tangled in nested contexts that they become hard to read. If you start to have
    test failures because people on your team can’t trace the flow of action in tests,
    that’s a real problem and an indication that you need to dial the nested contexts
    back. Also, keep an eye on test speed, and watch out for slow running setups that
    have to be run for multiple single-assertion tests.


    Now that we’ve seen how contexts and single-line testing work within Test::Unit,
    it’s time to see how they play out in RSpec, a library written from scratch to
    support a very strongly natural-language way of specifying application behavior.


    Footnotes


    +   [56] As I write this, Shoulda’s status as a stand-alone tool is in flux, and
    by the time you read this, there is a pretty good chance that the context part
    of Shoulda will have also been extracted into a stand-alone gem.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'RSpec is a Behavior-Driven alternative to Test:Unit for Ruby applications.
    I haven''t spent a lot of time parsing the difference between the original term
    Test-First Programming, the later term Test-Driven Development (TDD), and derived
    terms like Test-Driven Design (also TDD) and Behavior-Driven Development (BDD),
    let alone more esoteric acronyms like Example-Driven Development (EDD) or Acceptance
    Test--Driven Development (ATDD) [57]


    By favoring test so prominently, the initial terminology meant the emphasis on
    testing and of itself, and certain folks got the sole point of the process was
    to verify correctness. Of course, as I''ve already quoted in this book, Kent Knows
    that “Correctness is a side benefit.” Suggesting that TDD is about correctness
    may seem a minor point, except that the same folks then had a tendency to buy
    into two somewhat pernicious corollaries:


    +   * If the whole point of Test-Driven Whatever is to verify correctness, then
    if the process isn''t 100 percent perfect at proving correctness, it must be worthless.

    * If the whole point of Test-Driven Whatever is verifying correctness, then it
    doesn''t matter when I write the tests; I can write them after I write the code.


    In point of fact, the goal of TDD is to improve the quality of your code in many
    ways; verifying correctness is only one of them. And it makes a big difference
    when you write the tests, because the process is much more effective when the
    tests come first. That''s why the original name for the process explicitly called
    out test-first.


    I''m in danger of disappearing into a huge rant, but here''s the important part:
    names like Test-Driven Development tended to lead people to the conclusion that
    the TDD process was mainly about verifying existing behavior. This led to a lot
    of frankly irritating online debates with people talking past each other because
    of different interpretations of what testing mean in test-driven. The term Behavior-Driven
    Development was coined to win those ones. Well, an argument like that can''t really
    be won, but it was coined to help clarify the terms. Where the word test implies
    already written code, the tests like behavior and specify imply describing the
    workings of code that has yet to be written. Ideally, then, discussing your process
    in BDD terms makes you more aware of the reason why you are using the process
    in the first place. Eventually, RSpec was created as a tool for implementing BDD
    in Ruby.'
