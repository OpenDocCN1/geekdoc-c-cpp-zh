- pgno: 29
  md: 'There are two other kinds of tests in this book will cover those possibilities
    in more detail.


    integration tests, perhaps the most ignored feature of Rails testing. By design,
    integration tests are used to test sequences of events that span multiple actions
    or controllers. However, they don''t easily map to the various test-first methodologies,
    and Rails developers tend to overlook them. That''s unfortunate, because integration
    tests are a good way to validate complex interactions in an application, as well
    as ensure there are no holes in the controller tests. Integration tests are created
    using the Rails generator script/generate integration_test, and are not automatically
    created by any other Rails generator.

    Integration tests will be discussed in more detail in the Chapter Testing Workflow
    with Integration Tests.


    Performance tests are different from the other automated test types. They are
    not intended to verify the correctness of your program; instead, they give access
    to profiling information about the actions called during the test. Essentially,
    performance tests are wrappers around the ruby-prof profiler, but if you''ve ever
    tried to get ruby-prof working, you will appreciate the help. Performance tests
    are created using the Rails generator, script/generate performance_test, and are
    not automatically created by other Rails generators. Unlike the other Rails tests—functional,
    unit, and integration—performance tests are not automatically run by the Rails
    test runners. We''ll talk about performance testing a little more in the Chapter
    Performance Testing and Performance Improvement.'
