  md: "# RSpec Rails Test::Unit, both controllers and views are tested using Rails\
    \ functional tests. RSpec splits\n\nIn core RSpec splits the two apart, with files\
    \ in the spec/controllers directory to specify controller behavior without calling\
    \ the views (at least, not explicitly being told) and with separate files in the\
    \ spec/views directory for view testing. Again, idea is to keep things as separate\
    \ and independent as possible. The controller's job is to marshal together objects\
    \ to pass to the view and behavior can be specified independent of whether the\
    \ view properly puts it on the screen. (Again, there's also a speed benefit in\
    \ not running the display engine where it isn't needed.)\n\nLet's talk about the\
    \ controllers first. RSpec offers a few special matchers for use in controller\
    \ testing (some of these are just RSpec magic free boolean methods in ActiveRecord):\n\
    \n```\nresponse.should_be_success\nresponse.should_be_redirect\nresponse.should_redirect.to(url\
    \ or hash)\nresponse.should_render_template('app/projects/views/index')\nresponse.should_render_template(partial\
    \ => 'show_form')\n```\n\nThere is one RSpec 2 change to be aware of if you are\
    \ familiar with older versions of RSpec. Although the controller spec does not\
    \ render the view templates by default, unlike RSpec 1.x, the view template must\
    \ actually exist in the spec. If, for some reason, you want to throw the wind,\
    \ override the RSpec default and integrate view testing with your controller testing.\
    \ You can do so by placing the command render_views inside an RSpec example group.\
    \ This is not recommended RSpec practice but it might be the easiest way to validate\
    \ a piece of view behavior to get a small view or a Cucumber test.\n\nThe assigns,\
    \ flash, and session variables are available as hashes. If you want to test an\
    \ assigned variable, use the form assigns(:variable).should thing\n\nWhat does\
    \ RSpec controller tests look like? Here's a representative sample from the generated\
    \ file (the file is too long to include the entire thing):\n\n```\nh3_rspec2/spec/controllers/projects_controller_spec.rb\n\
    \nrequire 'spec_helper'\n\ndescribe ProjectController do\n  def mock_project(stubs={})\n\
    \    @mock_project ||= mock_model(Project, stubs).null_object\n  end\n\n  describe\
    \ \"GET index\" do\n    it \"assigns all projects as @projects\" do\n      Project.stub(:all)\
    \ { [mock_project] }\n      get :index\n```"
  merge: -1
