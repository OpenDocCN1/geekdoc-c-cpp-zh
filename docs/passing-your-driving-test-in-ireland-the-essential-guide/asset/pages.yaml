- pgno: 161
  md: '# Testing JavaScript from Rails with Jasmine


    Once you out the RJS training wheels and start the big-kid bicycle that is actual
    JavaScript, the testing awkwardness becomes apparent. Many JavaScript test frameworks
    run in a browser, which is quite nice for assuring fidelity in that but is slow
    and unwieldy TDD-style tight-feedback testing. If you only could work in both
    modes...well, you can, using a BDD test framework for JavaScript called Jasmine,
    along with a gem that wraps Jasmine in Ruby and another gem that produces nicer
    command-line output.


    If you are using Jasmine, you are also going to be much happier if you write the
    unobtrusive JavaScript style, which I''ll define as the separation of JavaScript
    from the HTML markup. When writing JavaScript unobtrusively, no JavaScript behavior
    is specified in the body of the HTML page. Instead, event handlers are bound to
    DOM IDs in functions written elsewhere and injected to the page on load.


    There are a number of advantages to an unobtrusive style—generally speaking, it
    opens browser client JavaScript up to the full range of modern software techniques.
    For our purposes here, the biggest advantage is that JavaScript separated from
    the HTML view layer is much easier to isolate and test.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Getting Started with Jasmine


    Jasmine for Rails is distributed as a gem, which gives you access to the Jasmine
    test framework from within your Rails application. You can then add Jasmine to
    your Gemfile with gem jasmine and use a bundle install to make sure that everything
    is in place. With the gem installed, you can generate Jasmine files:


    % bundle exec jasmine init

    Jasmine has been installed with example specs.


    To run the server:


    rake jasmine


    To run the automated CI task with Selenium:


    rake jasmine:ci


    In Rails 2, the startup command is script/generate jasmine.


    Behind the scenes, Jasmine has created a few files. It has created a spec/javascripts
    directory—even if you are using Test:Unit, Jasmine creates a spec directory. In
    that directory, Jasmine has placed a sample file, PlayerSpec.js, which you don''t
    need to keep, and three other files that you do not need to keep. The file helpers/SpecHelper.js
    is the Jasmine analog of Test:Unit''s test_helper.rb, and the support directory
    has a jasmine_runner.rb script and a jasmine.yml configuration file. We’ll talk
    about the config file in a bit.


    Jasmine also adds two sample files to the public/javascripts directory, which
    you can delete if you don’t need them. Finally, it adds a Rake file defining two
    different tasks for running Jasmine.'
  merge: -1
  img_proc: true
