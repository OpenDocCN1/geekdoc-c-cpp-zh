- pgno: 177
  md: '# Basics of Shoulda


    Let''s take a moment to talk about the basics of Shoulda. It’s distributed as
    a gem, so for Rails 3 all we need to do is include it in the Bundler Gemfile:


    ```

    gem ''shoulda''

    ```


    In Rails 2.x, we need the following line in the config.rb file:


    ```

    config.gem ''shoulda'',lib => ''shoulda''

    ```


    Once installed, it will insert itself into Test::Unit, so there is no further
    include or require to use Shoulda. In addition to working with Test::Unit, the
    matcher and assertion features of Shoulda can also be integrated with RSpec. For
    that work, require ''shoulda'' in the spec/spec_helper.rb file somewhere before
    the RSpec configuration block.


    We have already seen the Shoulda syntax for defining contexts. In Test::Unit,
    Shoulda gives us the shouldd method to define a test, which is analogous to the
    Rails standard test method or to the oldstyle Test::Unit construct deftest_. This
    was a lot cooler before Rails added the test method, which does effectively the
    same thing. The method takes a string name for the test and a block that defines
    the test. A simple example follows:


    ```

    should "actually work" do

    @user = User.new

    assert @user.valid?

    end

    ```


    This creates a method called test_should_actually_work, which is incorporated
    into the standard Test::Unit test runner.


    Within the body of a context, we can define as many shouldd tests as we want.
    To clarify, shouldd tests don’t need to be in contexts; contexts just turn out
    to be a handy way to group related tests together.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Single Assertion Testing


    When added to Test::Unit, Shoulda has a lot of functional similarities to RSpec.
    However, Shoulda popularized a different style of structuring tests that depends
    on contexts and nested contexts. The defining feature of this style is the idea
    that each test should contain only a single assertion. In essence, what otherwise
    be a test with some setup and a series of assertions the setup placed instead
    in the context setup, and each assertion becomes a separate test.


    To put it another way, a test consists of three basic steps: setting up the test
    data, performing some action, and verifying the result. In a traditional-style
    Test::Unit, the test is in the setup block, and the action and verification are
    in the actual test. Typically, a test has more than one assertion.


    In a single-assertion style test, the setup and action are in the context setup,
    leaving just the verification in the actual test. As you''ll see in the next section,
    Shoulda comes with a lot of macros that are designed to be used in the body of
    a context where the action under test has been performed. The design goal is that
    each test contain only a single assertion, but obviously that''s not always feasible.
    A sample set of tests about an index page might look like this:


    ```

    setup do

    @p1 = Product.create(name => "product 1")

    @p2 = Product.create(name => "product 2")

    get :index

    end


    should "be successful" { assert_response :success }

    should "set the users" do

    assert_same_elements([@p1, @p2], assigns(users))

    end

    should "display the table rows" do

    assert_select "tr product_row", count => 2

    end

    ```


    The action of this test, get :index, is in the context setup in line 6. Each the
    context is effectively what would have been one test in the more classic test
    style. In the section [Shoulda Assertions], we''ll see that Shoulda has some macros
    to simplify writing these tests, and in the section [Single-Line Test Tools],
    we''ll see some other tools for single-line tests.


    This style has one significant advantage: each individual assertion will now run
    independently. If they were all in the same test, a failure in one assertion prevents
    others from being evaluated. This gives us a somewhat more accurate view of our
    code from the test suite. The major disadvantage of this style is loss of speed,
    since the setup block is now being called once for each assertion. If the setup
    adds a lot of objects to the database, there can be a significant slowdown. As
    far readability'
  merge: -1
  img_proc: true
