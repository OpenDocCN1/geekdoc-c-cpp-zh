- pgno: 255
  md: 'The other side says that although the same code is touched by each test, the
    tests have different purposes and are both useful. In essence, the question is
    whether unit or functional tests have value merely verifying correctness, since
    the Cucumber already verifies. Cucumber''s value in end-to-end testing and keeping
    development focused not replace the exploration, design, or code-quality benefits
    of a regular TDD process.


    The goal of Cucumber is end-to-end from a user perspective. As such, Cucumber
    is not the place to test internals of the program that only tangentially show
    up to users. Internal logic of models should be tested in unit tests. Best practice
    suggests controllers shouldn''t have logic of their own, which might not need
    many controller tests—not because the Cucumber replaces them but because there
    isn''t much controller logic to test.


    That said, I often find Cucumber to be an easier way to specify which tests facilitate
    provided by Test::Unit or RSpec. As a result, I find myself basically moving the
    views I would normally have written to Cucumber.


    The answer to whether Cucumber replaces regular tests is, sometimes. Cucumber
    does not eliminate the need for the benefits of TDD in regular testing. However,
    Cucumber can be used as an easier way to write TDD tests for userfacing code.
    The point of Cucumber is decidedly not to get bogged down in whether you need
    extra tests. The goal of Cucumber is to write better code and focus your development
    efforts. Try using Cucumber a few different ways and see what works best for you.


