- pgno: 302
  md: 'Well, care if the value for the sales tax is actually correct. Well, in the
    sense that calculating sales tax is important from a business perspective; however,
    from a test perspective, we must assume that the code is correct so we have a
    stable base when we start making changes because of all the bugs.


    The Rails console is our friend and ally during this exploration process. The
    console is a great way to try some of these object interactions quickly. Once
    we figure things out in the console, we transfer the commands to the test so they
    can be repeated.


    What Tools Should I Use? (Legacy Edition)

    Taking over a legacy code base has the side effect of clarifying tool decisions
    we might otherwise ignore. Use that tool. If the previous coder used a tool and
    there''s anything at salvage, we don''t want to be in the position of adding code
    while juggling our RSpec tests with a batch of existing ShouldTest::Unit tests.
    I recommend adding a factory tool if there isn''t one already in the mix. It''s
    likely that writing tests for the legacy app will require creating complete chains
    of related objects. Setting up a factory tool to create the associations all at
    once saves a lot of time.


    There are, of course, exceptions to this rule. Two that spring to mind when the
    original developer has chosen a tool that''s just unsuitable to support the kind
    of testing weight we want to put on it. More often, the existing tests are useless,
    and it''s best to delete them quickly and start over, at which point we can pick
    whatever tools we want. [84]


    Mike Gunderloy presents a simple rule for initial triage of legacy tests in the
    Rails Rescue Handbook: if you can''t figure out what a test is doing in five minutes,
    delete it.'
