- pgno: 151
  md: '# # Testing Block Helpers


    In Rails 2.2, the _erbout variable in templates that stored the output stream
    was changed to a public instance variable. This change caused very little stir
    outside of _erbout''s immediate family, but it did two very nice effects. It made
    possible to inject text from a helper directly into the ERB output without fussing
    around block variables, and it also made easier to test block helpers.


    A block helper is a helper function that, when invoked in the ERb file, takes
    a block made up of ERB text. Two common uses of block helpers are as access control,
    in which the logic in the helper determines whether the code in the block is invoked,
    and as wrapper code for HTML that might surround many different kinds of text—a
    rounded rectangle effect, for example.


    Here''s a small example of a block helper:


    ```

    def if logged_in

    yield logged_in?

    end

    ```


    which would be invoked like so:


    ```

    <% if_logged_in %>

    <%= link_to "logout", logout_path %>

    <% end %>

    ```


    and which you would test like this (in Rails 2.2 and higher):


    ```

    test "logged_in" do

    assert !logged_in?

    assert nil_if {"logged_in"}

    login_as users(:quentin)

    assert logged_in?

    assert_equal("logged in", if, logged_in, {"logged in"})

    end

    ```


    What we''re taking advantage of here is that the last value in the block becomes
    the return value of the block, which becomes the last value of the method. If
    nobody is logged in, the block doesn''t fire, and the method returns nil. If a
    user is logged in, then whatever gets passed in the block—in this case, the literal
    string logged in in—is the returned value of the helper.


    This also works for helpers that concat values directly into the ERb stream. The
    somewhat contrived helper:


    ```

    def make_headline

    concat("<h1 class="headline">#{yield}</h1>")

    end

    ```'
  merge: -1
  img_proc: true
