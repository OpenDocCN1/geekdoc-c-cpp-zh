- pgno: 209
  md: 'The basic drill is simple: in your before block, use the assign method to initialize
    any variables you expect the controller to control. You can also include in this
    individual spec to verify various logical branches. Then each actual spec renders
    the view file and validates the HTML output.


    There''s a couple of things to point out. The outermost describe block has the
    actual path to the view file rendered, relative to the app/views directory. This
    is not, strictly speaking, required. Useful. In addition, the render method, if
    called with no arguments, renders the view referenced in the outermost describe
    block. (See, if that was useful.) You can bypass this by passing a filename as
    the first argument to render (again, the filename is relative by app/views). Any
    other option passed to render behave exactly as in ActionView::Base. After a call
    to render, the rendered method contains the resulting text.


    All the standard Rails modules are automatically loaded, but any of the application-specific
    modules that you plan on calling need to be explicit, using something like include
    ProjectsHelper, or added to the render commands, as described in the previous
    section. All helper modules are available in the view spec.


    For specifying the actual view contents, RSpec defaults to using have_selector,
    which is actually part of Webrat. [68] the have_selector method to assert_select,
    except it supports describing the attributes as key/value pairs, as in have_selector("form",method
    => "post"), as opposed to the assert_select or CSS syntax form[method=post]. The
    Webrat version makes it easier to use dynamic values for the attributes. Like
    assert_select, have_selector count and content options to specify the number of
    times the selector is found or the content of the selector. As you can see from
    the example, have_selector can be nested.


    If you want a simpler test, use the contain matcher, which does a simple regular
    expression match, as follows:


    ```

    rendered.should contain("Name")

    ```


    Often, the view layer calls helper methods along the way. In keeping with best
    RSpec practice, the idea is to limit the interaction of different levels during
    testing. That would suggest that helper methods should be stubbed during view
    specs and only truly exercised in helper specs. If you choose to stub out a helper
    method in your view test, use the view object to get the target that has access
    to the method, as in view_should_receive(:helper_method).and_return("result")
    the section RSpec Helper Specs demonstrates how to specify helper module in RSpec.


    # RSpec Routing Specs


    Unlike Test::Unit, RSpec provides a separate file specifically for testing routes.
    You can test routes'
