  md: "I would like to take the time to specify methods—and I recommend it (otherwise,\
    \ they tend to become the dark, scary attic of your application)—RSpec accurately\
    \ includes all Rails core modules, please the module specified in the outermost\
    \ describe block.\n\nSince you don't have access to a controller or even a mock\
    \ controller, as you might in a Rails helper test, you might wonder how to test\
    \ helpers that instance variables from the controller. You can specify these values\
    \ into the assigns hash, as you might in a controller test, and then use the helper\
    \ to call your actual helper method. Here's an example to illustrate:\n\nSay we\
    \ have a helper method that does this:\n\n```\ndef headline_project_name\n  \"\
    <h1>#{@project.name.uppercase}</h1>\"\nend\n```\n\nTemporarily ignore that we\
    \ should really be passing the project as an argument rather than assuming it's\
    \ an instance variable.\n\nIn RSpec, we test that method as follows:\n\n```\n\
    describe Helpers do\n  it \"should headline a project\" do\n    assigns(project)\
    \ = mock_model(Project, name => \"Mock\")\n    helper.headline_project_name.should\
    \ == \"<h1>MOCK</h1>\"\n  end\nend\n```\n\nIn other words, prefixing the headline_project_name\
    \ with helper. gives us access to the pretend instance variables that we added\
    \ to the assigns hash.\n\n# RSpec Request Specs\n\nRequest specs are the RSpec\
    \ analog to Test::Unit integration specs specs. I'm guessing they don't get a\
    \ whole lot of use, since most BDD adherents use Cucumber for integration testing.\n\
    \nRequest specs are broadly similar to Test::Unit specs, which means they are\
    \ also similar to controller specs, except that we specify an entire path, as\
    \ in get projects_path, rather than just the name of a method in the controller\
    \ under test. For further specification of actions and output, Webrat or Capybara\
    \ is strongly recommended."
