- pgno: 176
  md: '```

    context "with a normal user" do

    setup { User.create(:admin => false) }

    should "not see an edit link" do

    get .show,:id => @product.id.to_s

    assert_select "a", "edit", :count => 0

    end

    end

    ```


    The setup blocks are called in the order you''d expect, from the parent context
    down to the children—contexts can be nested as deeply as you want. However, it’s
    hard to think of a real-world example where you''d want more than three levels,
    maybe four. In any case, teardown blocks, if they exist, are resolved in the reverse
    order, from child up to parent.


    Nested contexts are great in that they can reduce duplication in our tests, specifically
    duplication in test setup, which can make it easier to focus attention on the
    part of the test that is actually, you know, testing. However, if the contexts
    or the tests within get long, it can easily become hard to follow the execution
    thread through the various layers of nested contexts. Sometimes it’s worth to
    have a little duplication in tests in order to make it clear what’s going on.'
