  md: '# Troubleshooting


    Dot, dot, dot, dot—tests are passing, looks like it''s time for lunch—dot, dot,
    dot, F. F? F? But the code. I know it does. I think it does. Why is my test failing?


    One of the most frustrating moments in the life of a TDD developer is when a test
    is failing and it''s not clear why, as opposed to the more normal case in which
    the test fails as expected. Here’s a grab bag of tips, tricks, hints, and thoughts
    to get us all through that difficult time.


    # Look for What Changed


    This may be the most obvious piece of advice in the history of ever, but it’s
    worth repeating, mantra-like, when confronted with a bad bug:


    When a formerly passing test fails, it means something changed.


    It may be in the code, the system, or the test. But it’s probably not sunspots,
    and it’s probably not evil spirits possessing your MacBook.[80]


    Looking through recent changes can help you figure out the cause of the failure
    is. Git’s bisect tool does this automatically; or you can just look through recent
    changes in your source control view of choice. If the test was passing at one
    time, there’s a good chance the answer is there somewhere.


    This is a great argument in favor of committing to your source control very, frequently
    (especially when you are using Git and can do local commits) so that your changes
    are very granular.


    Remember, a change to a fixture file can cause test failures all over the place—removing
    a model without deleting the fixture file will create errors in every test. Also,
    if you have a database migration, `rake` will automatically load the new structure
    to the test database, but the `spec`, `cucumber`, and `autotest` commands do not
    do so by default.


    # Isolate the Failure


    When looking at a small number of failing tests, it''s helpful to be able to run
    just those tests. Autotest is outstanding for this, since it runs the failing
    tests over and over until they pass. Cucumber’s default behavior is rerunning
    failing tests. This is especially helpful if you have a number of failing tests
    that are not in the same test class.


    The little code and terminal snippet at http://gist.github.com/101130 is very
    helpful for quickly running one class at a time, which is almost like isolating
    a failing test, or at least enough to be useful. Depending on your IDE and test
    framework of choice, you may also be able to run individual tests from the IDE.


    Isolating tests makes the tests run faster when you are focused on just a few
    tests and also makes any'
