  md: '# Mock Object Summary


    In this part of the book, we covered model testing. First, we talked about the
    services Rails provides for testing models, and we discussed fixtures and factories
    as mechanisms for creating consistent test data. With this chapter, we''ve started
    to transition from testing models to testing the user-facing parts of the application.
    Mock testing is useful for testing models, but it becomes especially useful when
    trying to shield the various layers of your application from each other.


    In the next part, we''ll be discussing testing the controller and view layers.
    Mock objects can be a very important part of controller testing: creating mock
    models allows the controller tests to proceed independently of the model test.


    > Actually, I believe this naming structure is the creation of Gerard Meszaros
    in xUnit Test Patterns [37][XTPRTC].


