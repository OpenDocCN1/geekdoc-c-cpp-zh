- pgno: 218
  md: '# # Summarizing RSpec


    I have what you might call a history with RSpec. There''s a lot about it I''ve
    liked. I love the matchers and the matching syntax and the string descriptions
    of tests (which was, of course, widely copied on the Test::Unit side). Plus, it''s
    somewhat a purist''s tool, and I''m enough of a purist to be attracted to it.
    My first serious excursion into RSpec was after I researched it for a previous
    book and decided that it was worth seriously trying on my next project.


    I didn''t last long with it. In retrospect, I realize I was Doing It Wrong: trying
    to write heavily mocked and brittle tests. That''s the painful way to go about
    RSpec, and the mocks upon mocks can get frustrating.


    Since then, single-assertion style has come to RSpec (or perhaps it was there
    all along; I just got to a place where I could see its value). In addition, I
    had the chance to work with it as my primary test tool for eight months. And some
    recent innovations in Rails testing, such as Cucumber and Webrat, have tended
    to favor RSpec. As a result, I got much more comfortable with RSpec and much more
    attuned to its flexibility, and as I said, I''ve always liked the basic syntax.


    Even if you don''t like RSpec''s syntax, there is still a lot to take away from
    the philosophy of testing that RSpec embodies. RSpec encourages the use of tests
    to create the public interface of your program and to design the interaction of
    objects. RSpec also encourages tests to be clear, concise, and independent of
    each other and independent of the parts of the program not under test. Using these
    ideas to guide your testing improves the quality and usefulness of your tests.


    The acronym I prefer, Failure-Driven Development (FDD), has never really caught
