- pgno: 297
  md: '# Accept That You’re Powerless in the Face of a Higher Power


    Namely, the previous coders’ stupidity, a truly awesome resource.[81] You aren’t
    going to convert this beast of an old project into a marvel of elegant, test-driven
    code with nearly full coverage overnight. It’s just not going to happen.


    Shake your fists, and curse the previous programmer’s name if it makes you feel
    better.[82] Get it out of your system, and move on and start working with the
    code base.


    There are two reasons it’s a bad idea to do nothing but add test coverage to a
    legacy thing. From a purely logistical standpoint, when you take over a legacy
    project, you are often expected to do something with it, and going off in the
    corner and doing nothing but writing tests for weeks at a time may not be perceived
    as forward motion by your new client. Obviously, every situation is different,
    but it’s rare to find a client that considers test coverage a “quick win.”


    The second reason that starting up by adding only test coverage does not work
    has to do the often-noted paradox of legacy development. Legacy code, by its nature,
    is often too interdependent to make it easy to unit test without substantial refactoring.
    However, substantial refactoring without unit tests is a great way to introduce
    bugs into the code base—especially when working with new code that may not yet
    fully understand. This is also unlikely to be considered a “quick win.”


    What will work is to proceed in an agile fashion, making small steps that you
    can verify. You need to tweak the existing code as little as possible to get it
    to a state that you can live with. Then you can ensure that the new code you write
    is as good, and as tested, as possible.'
