- pgno: 208
  md: "```\nassign(projects).should eq(mock_project)\nend\nend\n```\n\n# Here are\
    \ some things to note:\n\n+   - The outermost describe block contains the controller\
    \ name as its description. This is not just a convention; RSpec views use class\
    \ to specify which controller to call for all the tests.\n\n+   - Innermost blocks\
    \ are split up by controller call and annotated with the controller action and\
    \ HTML method being described. This is just a convention, but it's a useful one.\
    \ If you look at the actual file, you'll see some actions are further split: the\
    \ create and edit actions are split into a test with valid data and with invalid\
    \ data.\n\n+   - The get method and other methods that mimicking the controller\
    \ via a browser action work in RSpec exactly the way they do in Test::Unit.\n\n\
    +   - The mock_project stub is used to manage the result of the find(:all) call\
    \ in the index method without actually creating data, making the test super-fast.\n\
    \n# RSpec View Specs\n\nSince RSpec allows you to specify controllers independent\
    \ of views, you might assume that you can also specify views independent of controllers.\
    \ You'd right. [67] The RSpec convention is to place tests in the spec/views folder,\
    \ with one spec file to a view file, the view in app/views/projects/edit.html.erb\
    \ is specified in spec/views/projects/edit.html.spec.rb. Here's the scaffold for\
    \ the project's edit view:\n\n```\nhuddle_rspec2/spec/views/projects/edit.html.spec.rb\n\
    ```\n\n```\ndescribe \"projects/edit.html.erb\" do\nbefore(each) do\n  @project\
    \ = assign(:project, stub_model(Project,\n    .new_record? => false,\n    .name\
    \ => \"MyString\"\n  ))\nend\n\n  it \"renders the edit project form\" do\n  render\n\
    \n  rendered.should_have_selector(\"form\", :action => project_path(@project),\n\
    \    :method => \"post\") do |form|\n    form.should_have_selector(\"input[project_name]\"\
    , :name => \"project[name]\")\n  end\nend\nend\n```"
