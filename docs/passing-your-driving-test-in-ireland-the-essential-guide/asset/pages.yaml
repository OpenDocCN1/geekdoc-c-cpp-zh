  md: 'In much slower Selenium tests. In this case, Webrat is assuming that the toggle
    method will still return the same values if called from something other than an
    Ajax link.


    Capybara and Webrat each have their own methods for asserting output in both Test:Unit
    and RSpec flavors. We has the following for Test:Unit:


    ```

    assert_contain("text")

    assert_not_contain("text")

    assert_have_selector("selector",attribute => "something")

    assert_have_no_selector("selector",attribute => "something")

    assert_have_spath("spath")

    assert_have_no_spath("spath")

    ```


    which look like this in RSpec:


    ```

    response_should_contain("text")

    response_not_contain("text")

    response_should_have_selector("selector",attribute => "something")

    response_should_have_no_selector("selector",attribute => "something")

    response_should_have_spath("spath")

    response_should_have_no_spath("spath")

    ```


    The contain methods search for text within the output (the response body is the
    implicit source for output in all Test:Unit methods). The selector methods are
    like assert_select with two differences. Instead of specifying content with the
    :text option, these methods use :content, and any HTML attribute does not need
    to be specified in the selector but can be specified as a key/value pair argument,
    in assert_have_selector("a",href=/sol/\). The value of the argument can be a string
    or a regex.


    Capybara has a slightly different set of tools for specifying output. By default,
    these tests are XPath-based, but if you are like me and more comfortable around
    CSS selectors, you can set CSS as the default by adding the line of code Capybara.default_selector
    = :css somewhere in your test, in a setup block. The last line of the previous
    test might look like this in Capybara:


    ```

    within("div.interest") do

    page_has_css("div",text => "Aaron",count => 1)

    page_has_no_css("div",text => "Old")

    end

    ```


    The CSS selector value applies only to the within method. In this case, within
    acts the same as the outer assert_select block; it checks for the existence of
    the selectors and searches inside the block to the portion of the page inside
    matching tag. In Capybara, a within is not limited to being used with the query
    methods but can be placed around the interaction methods to limit their searches
    to a particular part of the page.


    Capybara’s overall query methods are a little different. The generic one is also
    named has_selector?.'
  merge: -1
