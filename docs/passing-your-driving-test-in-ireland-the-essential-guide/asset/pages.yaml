- pgno: 115
  md: 'This test doesn''t attempt to validate features that are actually the purview
    of other tests. That''s the job of the model method. What the view layer does
    with this value is the job of a view test. This test validates that a particular
    instance variable is set by using a known method, on the theory that the job of
    the controller method is to produce a set of known values for use. But validating
    the exact value of reports would be pointless (at least in this case), since the
    value is completely generated by the mock expectation.


    Using mock objects in this style of testing has advantages and disadvantages.
    Speed is a significant advantage: getting values from mocks is going to be faster
    than getting values from either a fixture or a factory database. Another advantage
    is the encapsulation of tests. In the previous example, if a bug is introduced
    into the model object, the only tests that will fail be the model tests—the controller
    tests, protected by the mock, will be fine. The nonmock version of the controller
    test, however, is susceptible to failure based on the results of the model method.
    Done right, this kind of encapsulation can make it easier to diagnose and fix
    failures.


    However, there are a couple of potential problems to watch out for. One is a mismatch
    between the mocked return and the real method. In the previous controller example,
    the mock calls the method to return a hash where the key is a Date object and
    the values are lists of StatusReport objects. If, however, the model method returns
    a hash with the keys as strings, then you can have a case where the controller
    method passes, this problem can be covered by using integration or acceptance
    tests; see the Chapter [Testing Workflow with Integration Tests](https://example.com)
    and the Chapter [Acceptance Testing with Cucumber](https://example.com).


    It''s also not hard to inadvertently create a test that is tautological by setting
    a mock to some value and then validating that the mocked method returns that value
    (the earlier examples show how stubbed methods have this flaw).


    Finally, an elaborate edifice of mocked methods runs the risk of causing the test
    to be dependent on very specific details of the method structure of the object
    being mocked. This can make the test brittle in the face of refactorings that
    might change the object''s methods. Good API design and an awareness of this potential
    problem can go a long way toward mitigating the issue.


    I have to say, as much as I love using mocks and stubs to cover hard-to-reach
    objects and states, my own history with very strict behavior-based mock tests
    hasn''t been great. My experience was writing all the mocks around a given object
    to be a drag on the test process. But I''m wide open to the possibility that this
    method works better for others or I''m not doing it right. Or, to quote Stephen
    Bristol:[42]“RSpec, done properly, isn''t testing. It is designing.”'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Mock Dos and Mock Don''ts


    Here are some guidelines on the best usage of stubs and mocks:


    +   - If you are using your fake objects to take the place of real objects that
    are hard or impossible to create in a test environment, it''s probably a good
    idea to use stubs rather than mocks. If you are actually using the fake value
    as an input to a different process, then you should test process directly with
    the fake value rather than a mock. Adding the mock expectation just gives you
    another thing that can break, in which this case is probably not related to what
    you are actually testing.

    - When you are using a true mock to encapsulate the test and isolate it from methods
    that are not under test, try to limit the number of methods you are mocking in
    one test. The more mocks, the more vulnerable the test will be to changes in the
    actual code. A lot of mocks may indicate that your test is trying to do too much
    or might indicate a poor object-oriented design where one class is asking for
    too many details of a different class.

    - I''ve come to use mocks frequently in controller testing to isolate the controller
    test from the behavior of the model, essentially testing that the controller makes
    a specific model call and using the mock test to verify model behavior. Among
    the benefits of using mocks this is you are encouraged to make the interface between
    your controllers and models as simple as possible. However, does it mean the controller
    knows more about your model than it otherwise might, which may make the model
    code harder to change.

    - You also need to be careful of mocking methods that have side effects or call
    other methods that might be interesting. The mock totally bypasses the original
    method, which means no side effect and no calling the internal method. Pro tip:
    saving to the database and outputting to the response stream are both side effects.

    - Be very nervous if you are specifying a value as a mock and then asserting the
    existence of the very same value. One of the biggest problems with any test suite
    is false positives, and testing results with mocked values is a really efficient
    way to generate false positives.

    - A potentially larger problem is the type mismatch issue between the real method
    and values being used for mocks. Integration or acceptance testing can help with
    this problem, but that''s not much help during development. I don''t know that
    there''s an automated way to ensure that mock values are actually valid possible
    results and still get the benefits of using mocks, so it''s something to keep
    an eye on.'
  merge: -1
  img_proc: true
