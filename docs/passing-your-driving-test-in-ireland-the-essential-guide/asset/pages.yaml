    The basic accessors have expected names. You can find out more about how to inspect
    a mail object at http://guides.rubyyonrails.org/action_mailer_basics.html.


    Outside of core Rails, Shoulda provides a couple of helper methods for testing
    emails; these are described in the section Shoulda Assertions. The most robust
    way of testing emails, though, is linked to RSpec (see the Chapter RSpec) and
    also works great with Cucumber (see the Chapter Acceptance Testing with Cucumber).
    The email-spec library provides a number of very useful helpers. For the most
    part, they are nice, RSpec ways of performing the tests we''ve already examined,
    but the library also provides the ability to follow a link in an email back to
    the site, which is very helpful for acceptance testing of user interactions that
    include email. The library''s home is http://github.com/bmabey/email-spec.'
