- pgno: 147
  md: "# # Testing Outgoing Email\n\nThe process of testing outgoing email is closely\
    \ related to view testing. Typically, you are interested in validating two separate\
    \ pieces of logic: first, that your application sends an email when expected;\
    \ and second, that the email content is what you want. The somewhat indirect nature\
    \ of the Rails ActionMailer makes testing somewhat less obvious than it might\
    \ be, but it's not that hard. This section assumes that you are using ActionMailer—if\
    \ you're using a third-party tool for managing email, you may need to find a different\
    \ way to test.\n\nTo test emails in Rails, configure your test setup so ActionMailer\
    \ saves emails in a queryable data structure rather than actually mailing them.\
    \ This step should be done for you in the Rails `config/environments/test.rb`\
    \ file:\n\n```\nconfig.action_mailer.delivery_method = :test\n```\n\nRemember\
    \ to put this next line in your setup; doing so ensures that the data structure\
    \ holding the mailings is emptied. Otherwise, from other tests it will linger\
    \ and make your test results invalid:\n\nActionMailer::Base.deliveries.clear\n\
    \nThe quickest test you can create is one to find out if an email has been sent.\
    \ The method `ActionMailer::Base.deliveries.size` returns the number of emails\
    \ that have been sent since the last time the `ActionMailer::Base.deliveries`\
    \ object was cleared. A simple way to determine whether an email has been sent\
    \ is to query it:\n\n```\nassert_equal 1, ActionMailer::Base.deliveries.size\n\
    ```\n\nRails provides a shortcut, along the lines of `assert_difference`. This\
    \ method takes a block and determines how many emails are sent in the course of\
    \ executing the block:\n\n```\nassert_emails 1 do\n  get :forget_password\nend\n\
    ```\n\nThe argument to `assert_emails` method is the number of emails that need\
    \ to be sent in the block for the assertion to pass. The `assert_emails` method\
    \ does not depend on the `clear` method having been called; it does its own tracking\
    \ of count before and after the block. There’s also an `assert_no_emails`, which\
    \ is equivalent to `assert_emails(0).\n\nIf you want to specify the content of\
    \ the email messages and not just the count, Rails provides the `assert_select_email`\
    \ method, which you might use like this:\n\n```\nassert_select_email do\n  assert_select\
    \ \"div\", :text => \"Email Reset\"\nend\n```"
  merge: -1
  img_proc: true
