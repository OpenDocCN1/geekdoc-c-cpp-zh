- pgno: 265
  md: '# Implicit vs. Explicit Cucumber Tests


    After writing Cucumber tests for a while, issues of style and structure start
    to show. One of the first questions is whether to put specific details of the
    scenario in the Cucumber feature or in the step definition.


    For example, a scenario that requires differentiating a newly created user from
    an experienced user could be written in any of the following ways (and others,
    but these are enough to make the point):


    +   * Given a user named "Noel Rappin" who joined the site 2 years ago

    * Given a pre-existing user named "Noel Rappin"

    * Given a pre-existing user


    The topmost version is the most explicit; the step definition would take the data
    in the Cucumber step and use that directly. The bottom-most version is completely
    implicit; the step definition will need to create a user and creation time on
    its own. The middle one, obviously, is in the middle.


    There are advantages to each way. The implicit view leads to simpler, more natural-sounding
    Cucumber scenarios and is generally going to be easier for a nontechnical client
    to understand. However, the step definitions are more complex and need to manage
    more implicit data, leading to a greater possibility of error in the step definitions.
    It''s also likely that you''ll reuse implicit definitions. An explicit Cucumber
    step leads to simpler step definitions, but it can be hard to distinguish the
    salient details of the Cucumber step. For example, a client who saw a line of
    code similar to the explicit line here wondered what was special about “two years
    ago.”


    There isn''t a particular right answer here; it''s something to keep in mind as
    you write your Cucumber tests.


    # Toward Cucumber Style


    The key to whether you have a good or bad experience with Cucumber is how well
    you write the step definitions. Here are some guidelines that I''ve found:


    +   * The scenario has the natural language that feels right for your context,
    and smooths out in the step definition.

    * Try not to include code in your feature descriptions. This includes CSS selectors.

    * Where possible, keep the step definitions simple; they absolutely need to be
    100 percent accurate.

    * I find it better to have multiple simple steps than one step that performs tricky
    regular expression acrobatics.

    * Keep the When and Then steps at the level of the user, rather than the database.

    * As with other tests, verifying what isn''t is as important as verifying what
    is.

    * Cucumber is not the place to sweat implementation details; save that for the
    regular tests.'
  merge: -1
  img_proc: true
