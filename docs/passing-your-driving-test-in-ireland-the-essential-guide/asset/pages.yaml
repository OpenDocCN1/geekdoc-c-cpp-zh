    where the clear version is a couple of lines longer than the original version.
    Most of the time, I''d say clear beats concise—we''re not playing code golf. Conciseness
    is useful only to the extent that it makes writing and maintaining the test suite
    easier.


    Conciseness often involves writing the minimal amount of tests or creating the
    minimal amount of objects to test a feature. In addition to being clearer, concise
    tests will run faster, which is a big deal when you are running your test suite
    dozens of times a day. A slow test suite is a pain in the neck in all kinds of
    ways, obvious and subtle, and one of the best ways to prevent a slow suite is
    not to write slow tests.


