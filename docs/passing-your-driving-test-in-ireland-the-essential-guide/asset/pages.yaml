- pgno: 267
  md: '# # Cucumber Good for You?


    For a long time, Cucumber and its predecessor StoryRunner were on my list of interesting
    projects to get around someday, but it didn''t seem tremendously practical. One
    of the things that made me the corner and start it was the realization that a
    lot of my objections to Cucumber—writing extra code, that the tests might not
    be accurate, that kind of thing—were similar to the kinds of objections I''m always
    hearing about Test-Driven Development in general. That gave me pause, and I decided
    to make a concerted effort to try to figure out


    It turned out that the analogy to regular TDD continued to hold as I used Cucumber.
    The startup costs turned out to generally less than I feared, but the benefit
    of specifying end-to-end behavior of the application turned out to be high. Somewhat
    surprisingly, I found that my coding sessions were more focused when I used Cucumber,
    and I had a much better sense of what needed to be completed and what needed to
    be done next.


    What I ended up with was a double loop, where a failing Cucumber test triggers
    a regular unit test and a failing unit test triggers code. It''s not a perfect
    analogy—unit tests have design value and cover areas of the program that are difficult
    to reach from Cucumber—but it''s a good way to think of Cucumber''s place.


    If you are dealing with a client or nonprogramming customer, the value of an acceptance
    test that is both natural language and executable is outstanding. My only caution
    at the moment would be that even there isn''t much structure in Cucumber tests,
    there still is some. We tended to use the Given/When/Then structure for user stories
    without Cucumber, but my first attempts at executing them in Cucumber still required
    some translation. For example, the story definitions tended to do too much in
    one scenario. Be prepared to go back and forwrite your Cucumber steps a little
    bit over time, for clarity and as new features become apparent. Also, to keep
    your step namespace clean; on large projects, finding the steps can be a problem.


    Where is the sweet spot for Cucumber? Cucumber''s strengths are in its ability
    to easily specify and the end-to-end behavior of your application. It makes an
    excellent blueprint, but in the sense of describing what needs to be done and
    in the sense of allowing you to plan the direction of development. It makes an
    excellent complement to a typical TDD/BDD process, taking a big-picture role that
    smaller unit tests can''t really play. Where you can get in trouble with Cucumber
    is by trying to move it to areas where it''s not really strong, such as attempting
    to manage model or implementation details. Keep Cucumber in its appropriate place.
    If you make sure you''re never fiddling with the details of the steps and use
