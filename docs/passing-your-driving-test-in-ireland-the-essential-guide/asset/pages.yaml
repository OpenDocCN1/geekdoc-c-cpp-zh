  md: '# Chapter 18


    # Testing a Legacy Application


    You’ve been asked to take over coding on an existing project. Theoretically, you
    just need to add a few new features to the existing code base, which is working
    fine. Well, there’s the odd bug—weird stuff the original coders could never track
    down. Also, the new features to be involved changes to nearly every model in the
    application. Oh, and the previous coders didn''t pay attention to testing. There''s
    a test here or there, but overall, not much. The actual code has more spaghetti
    than a pasta factory, and you have no idea what some of those “tricky” code snippets
    do, and...


    It wasn''t all that long ago that there were no Rails legacy projects, but there
    are many these days. And so we have come upon a new situation: all the advice
    in this book so far is well and good, but what if you’re not starting your TDD
    experience with a new application? What if you are starting with an existing code
    base?


    Entire books have been written on working with legacy code bases. In this chapter,
    we’re going to focus on techniques for getting legacy code under test. There are
    many other issues that you’ll need to deal with in a legacy code base. Getting
    the legacy system up and running can be a choice, and there are a variety of techniques
    for safely adding features or refactoring existing code. We will only discuss
    those topics here as they intersect with testing. For a more detailed look at
    managing a legacy project, check out Michael Feathers’s Working Effectively with
    Legacy Code[WEWLC]. For more Rails-specific advice, look at Mike Gunderloy’s self-published
    Rails Rescue Handbook, available at http://www.railsrescuebook.com.'
  merge: -1
