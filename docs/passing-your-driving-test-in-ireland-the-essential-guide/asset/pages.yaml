- pgno: 82
  md: 'The relationship is has_many, the multiple values in the relationship can be
    specified as a comma-delim list. This ensures that the two objects are in a has_and_belongs_to_many
    relationship via a join table, although a has_many :through relationship needs
    to have the join model explicitly specified.


    ```

    fred:

    first_name: Fred

    last_name: Flintstone

    company: slate

    roles: miner, digger, dino_wrangler

    ```


    This is very handy and a vast improvement over the older functionality, where
    all the id columns had to be explicitly filled with the id number of the other
    model.


    Fixture files are also interpreted as ERb files, which means you can have dynamic
    attributes like this:


    ```

    fred:

    last_login_time: <%= 5.days.ago %>

    ```


    Or you can specify five multiple entries dynamically, like this:


    ```

    <% 10.times do |i %>

    task_<%= i %>:

    name: "Task <%= i %>"

    <% end %>

    ```


    In the second case, notice that the identifier still needs to be at the leftmost
    column; you can''t indent the inside of the block the way that normal Ruby style
    would suggest.'
