- pgno: 43
  md: "The to_date methods in lines 2 and 5 are there to convert between 10.days.ago,\
    \ which is a Ruby Date object, and the status_date, which is a Ruby Date object.\
    \ Without that conversion, we will get an error because the string won't match\
    \ in line 5.\n\nThe reload call in line 4 forces ActiveRecord to re-retrieve the\
    \ record from the database. ActiveRecord does not prevent a database record from\
    \ having multiple live objects pointing to it. In this particular case, the controller\
    \ creates a new instance from the database and saves that instance, without touching\
    \ the actual variable created for the test. As a result, the database version\
    \ has typecast the status_date to Date when saving, but the live version in memory\
    \ hasn't gotten that change.\n\nIn general, it's a good idea to reload any object\
    \ being tested and saved. This is most commonly an issue in controller tests,\
    \ where you might create an object during setup and then another object is created\
    \ during the controller action, that is backed by the same database record. In\
    \ that case, the object you are holding on in the test does not reflect changes\
    \ made to the database during the controller action, leading to hours of fun as\
    \ you try to figure out why your test is failing. Reloading will allow the object\
    \ in your tests to see changes to the database made after the object was created.\n\
    \nOne way to make the new test pass is this very slight change to the model:\n\
    \n```\nhuddle3/app/models/status_report.rb\ndef set_status_date\n  self.status_date\
    \ = Date.today if status_date.nil?\nend\n```\n\nAnd now the scary part: removing\
    \ the status-changing line from the controller and making sure that the tests\
    \ pass again. This involves removing the line of code that we just added to the\
    \ controller couple of seconds ago.\n\nIt just takes a second to remove the line,\
    \ and then we can rerun rake to verify that the tests still pass."
  merge: -1
  img_proc: true
