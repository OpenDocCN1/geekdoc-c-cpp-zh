- pgno: 83
  md: '# Loading Fixture Data


    Fixture loading is covered by a few parameters that have default values, which
    are set in the test/test_helper.rb file. The most important is the fixtures all
    method, which ensures that all your fixture files are loaded in all tests. Back
    in the day, [34] the prevailing style was to declare which fixtures needed to
    be loaded in each individual test file. That got to annoying once your models
    were intertwined enough to load bunch of them in each test file, so in the fullness
    of time, loading all fixtures the time became the default. (Speculating wildly,
    this was about the same time that transactional fixtures were added, minimizing
    the performance cost of loading all data.)


    By default, fixtures are loaded just once, and every test method takes place inside
    a database transaction. At the end of the test method, the transaction is rolled
    back, and the initial fixture state is thereby restored. This dramatically reduces
    test time [35] unless your database doesn''t support transactions (most likely
    because you are using MySQL with MyISAM tables).


    Fixture transactions are also a problem if you are actually trying to test transactional
    behavior in your application, in which case the fixture transaction will overwhelm
    the transaction you are trying to test. If you need less aggressive transaction
    behavior, you can go into the self.use_transactional_fixtures = true to false.
    That will change the value for all tests, but you can also override the value
    on a class-by-class basis by including the assignment (set to false) in your individual
    class. There''s no way to change this behavior to be fine-grained enough to use
    the nontransaction behavior for only a single method.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# # Why Fixtures Are a Pain


    As great as fixtures are you are starting out, using them long-term on complex
    projects problems. Here are some things to keep an eye on.


    # ## Fixtures Are Global


    There is only one set of fixtures in a default Rails application. So, the temptation
    to keep adding new data points to the fixture set every time you need a corner
    case is pretty much overwhelming. The problem is that every time you need to test
    what happens a left-handed user sends a message to another user with a friend
    relationship who happens to live in Fiji, or whatever oddball scenario you need,
    every other test has to deal with that data point being part of the test data.


    # ## Fixtures Are Spread Out


    Fixtures live in their own directory, and each model has its own fixture file.
    That’s fine, until you start needing to manage connections and a simple setup
    of a user comment on a post related to a generic quickly spans across four different
    fixture files, with no easy way to trace the relationships. I’m a big fan of “small
    and plentiful” over “large and few” when it comes to code structure, but even
    I find fixtures to spread out.


    # ## Fixtures Are Distant


    If you are doing a complex test based on the specific fixture lineup, you’ll often
    wind up with the end data based on the fixture setup in such a way that, when
    reading the test, it’s not clear exactly the final value is derived. You need
    to go back to the fixture files to understand the calculation.


    # ## Fixtures Are Brittle


    Of course, once you add that left-handed user to your fixture set, you’re guaranteed
    to break any test that depends on the exact makeup of the entire user population—tests
    for searching and reporting are notorious culprits. There aren’t many more effective
    ways to kill your team’s enthusiasm for testing having to fix twenty-five tests
    on the other side of the world every time you add new sample data.


    Sounds grim, right? It’s not. Not only are fixtures perfectly suitable for simple
    projects, the Rails community has responded to the weaknesses of fixtures by creating
    factory tools that can replace fixtures in creating test data.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Using Factories to Fix Fixtures


    The goals of a fixture replacement system are to take the three largest problems
    with fixtures—they are global, spread out, and brittle—and turn them into strengths.
    We want the system to be the following:


    +   - *Local*: Each individual test should have its setup data tuned to the needs
    of that test. The setup data should be defined as closely as possible to the actual
    test.


    +   - *Compact*: The setup data should be easy and quick to generate; otherwise,
    lazy programmers (like me) just won’t do it. It should be possible to generate
    a complex network of objects in just a few lines.


    +   - *Robust*: Tests should not be dependent on changes made to setup data in
    other tests. We should even be able to specify more data in the current test without
    breaking other tests.


    Generically, the answer to the fixture problem is a *data factory*.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Data Factories


    The idea behind a data factory is rather than specifying all the test data exactly,
    you provide a blueprint for creating a sample instance of your model. When you
    need data for a specific test, you call a factory method, which gives you an element
    based on your blueprint. You can override the blueprint to specify any data attributes
    required to make your test work. Calling the factory method is simple enough to
    make it feasible to use a useful amount of data in each test.


    The original factory tool was Scott Taylor''s FixtureReplacement (http://replacefixtures.rubyforge.org/).
    More recently, the ThoughtBot team built Shoulda and other great tools provided
    factory_girl (http://github.com/thoughtbot/factory_girl/tree/master). I also like
    Pete Yandell''s Machinist (http://github.com/notatahat/machinist/tree/master).


    The basic structure of all three tools is similar. Each gives you a syntax to
    create the factory blueprints and an API for creating the new objects. Both factory_girl
    and Machinist also provide a mechanism for creating unique streams of values according
    to a pattern, while FixtureReplacement has the most flexible creation syntax.


    This chapter will use factory_girl as the primary example of how factory tools
    work. Specifically, we''ll be using factory_girl 2.0, which is in beta as I write
    this. I''ve picked factory_girl because it''s clearly emerged the mindshare leader
    among these tools and the 2.0 beta because I like the streamlined syntax choices
    in 2.0. Machinist, also in a 2.0 beta cycle, has very similar syntax and structure,
    while factory_girl 1.3 is similar in functionality but with a more verbose syntax.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # Installing factory_girl


    To install factory_girl in a Rails 3 project, you should install the factory_girl_rails
    gem by placing the following in your Gemfile:


    ```

    gem ''factory_girl_rails''

    ```


    However, if you are trying to install factory_girl while 2.0 is still in beta,
    there''s a little bit of a version hiccup at the moment, because the factory_girl_rails
    gem is tied to version 1.3. Luckily, there are some forks of the factory_girl_rails
    gem that just update its dependencies. For example:


    ```

    gem ''factory_girl_rails''

    ```


    ```

    git => "http://github.com/CodeMonkeySteve/factory_girl_rails.git"

    ```


    All this should work itself out when factory_girl 2.0 becomes official.


    If you''re working in a Rails 2.x application, you can just do the following:


    ```

    gem ''factory_girl''

    ```


    Or, while factory_girl 2.0 is still in beta, you need to get the beta directly
    from GitHub, since the Rails-only extensions are specific to Rails 3.


    ```

    gem ''factory_girl''

    ```


    ```

    git => "http://github.com/thoughtbot/factory_girl.git"

    ```


    In Rails 3, factory_girl automatically loads if installed. Factory files with
    the following names are automatically loaded: test/factories.rb, spec/factories.rb,
    test/factories/*.rb, spec/factories/*.rb. Factories defined in any other place
    need to be explicitly required into the program.'
  merge: -1
  img_proc: true
- pgno: 88
  md: "# Creating and Using Simple Factories\n\nAll the definitions of your factories\
    \ go inside a call to FactoryGirl.define, which takes a block. Inside that block,\
    \ factories can be declared to define default data. The factory takes a block\
    \ in which you can define default values on an attribute-by-attribute basis.\n\
    \nA very simple example for our Huddle network might look like this; each attribute\
    \ has a simple default value. We'll get to associations in a moment. By default,\
    \ the blueprints go in test/factories.rb.\n\n```\nFactoryGirl.define do\nfactory\
    \ :project do\n  name \"Dog Meet Dog Dog Com\"\n  start_date Date.parse(\"2009-01-23\"\
    )\nend\nend\n```\n\nNote the absence of equals signs—these are not assignments.\
    \ Technically, they are function calls, so if it makes it more readable to write\
    \ the lines like name(\"Dog Meet Dog Dog Com\"), go for it.\n\nIn the previous\
    \ factory, all the values are static and defined when the factory file is loaded.\
    \ If you want a dynamic value to be determined when an individual factory object\
    \ is created, pass a block instead of a value; the block will be evaluated each\
    \ new factory is called.\n\n```\nFactoryGirl.define do\nfactory :project do\n\
    \  name \"Dog Meet Dog Dog Com\"\n  start_date { Date.today - rand(50) }\nend\n\
    end\n```\n\nYou can also refer to a previously assigned value later in the factory,\
    \ which is where these factories start to get powerful:\n\n```\nFactoryGirl.define\
    \ do\nfactory :project do\n  name \"Dog Meet Dog Dog Com\"\n  url { \"#{name.downcase.gsub(\"\
    \\ \", \"_\")}\" }\nend\nend\n```\n\nWhat's nice about this is that the factory\
    \ will still use the value in the name attribute to calculate the URL, even if\
    \ you pass the name in yours:\n\n```\ntest \"factory girl url\" do\nsoup = Factory.create(project,\
    \ name => \"Soups Online\")\nassert_equal(\"soups_online\", soup.url)\nend\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "attribute to the factory, you can call any attribute in the model that has\
    \ a setter method; in other words, virtual attribute it to the factory in several\
    \ ways (like the password attribute of a Devise User model) is fair game.\n\n\
    You can use this factory in several different ways. The most common is to use\
    \ the Factory.create method.\n\n```\nsetup do\\  @project = Factory.create(:project)\n\
    end\n```\n\nThis call to create a Project instance using the default values defined\
    \ in the factory files and saves it to the database. Validation on your ActiveRecord\
    \ model will be called. (To be specific, factory_girl will call save! on the object\
    \ before it is returned.)\n\nfactory_girl provides three other build strategies\
    \ that you can use if you don't want to actually save a new record to the database.\
    \ If you want a real ActiveRecord instance, just not saved, call Factory.build(:project).\
    \ The Factory.attributes_for(:project) does not create an ActiveRecord object;\
    \ it returns a hash of attributes defined by the factory. This is useful for simulating\
    \ an HTTP POST call in a controller test. You can also try Factory.stub(:project),\
    \ which returns an object where the attributes are created as stubs. If you use\
    \ the stub version, then any call that attempts to access the database via that\
    \ object, for example, a call to save, will result in an error.\n\nUnder normal\
    \ circumstances, factory_girl considers create to be the default and provides\
    \ the shortcut Factory(:project). You can change the default strategy on a class-by-class\
    \ basis, but I don't recommend it; the readability confusion isn't worth the slightly\
    \ briefer syntax.\n\nWhen you call a factory, you can override any of the default\
    \ values by passing a hash to the factory_girl creation method, like so:\n\n```\n\
    setup do\n  @project = Factory.create(:project, name => \"Soups Online\")\n  @other_project\
    \ = Factory.create(:project, name => \"Google Thumbnail\")\nend\n```"
  merge: -1
