- pgno: 165
  md: "# Writing Jasmine Tests\n\nIt doesn't help to know how to run a Jasmine test\
    \ unless you know how to write one. Jasmine's syntax is as much like RSpec as\
    \ you can imagine, given that it's JavaScript and not Ruby. If you aren't already\
    \ familiar with RSpec's basics, it might be worth going to the Chapter RSpec and\
    \ then coming back here.\n\nAs with RSpec, the basic units of a Jasmine test are\
    \ denoted with describe and it. Where Ruby uses blocks, JavaScript uses anonymous\
    \ functions, giving you something like this:\n\n```\ndescribe(\"on my edit page\"\
    , function() {\n\n  beforeEach(function() {\n    clearMyValues();\n  });\n\n \
    \ it(\"should do something neat on start\", function() {\n    initValues();\n\
    \    expect(userCount).toEqual(2);\n  });\n\n});\n```\n\nAs with RSpec, describe\
    \ creates a group of several related tests, the beforeEach defines a callback\
    \ that is executed before each test, and it describes a test. The method pair\
    \ expect and toEqual are the Jasmine equivalent of a matcher. To negate the matcher,\
    \ you can chain in a not method, as in expect(userCount).not.toEqual(2).\n\nYou\
    \ can nest describe methods, and the semantics of defining multiple beforeEach\
    \ functions are exactly as with the Ruby libraries we've discussed—outermost first.\
    \ There is an analogous afterEach method that is performed after each test, and\
    \ that, is executed in innermost order. Both the beforeEach and afterEach methods\
    \ can also be placed outside any describe method, in which case the Jasmine function\
    \ applies to all tests in the file. One unique to Jasmine is that any individual\
    \ spec can define its own functionality by defining a this.after anywhere within\
    \ its body that takes a function argument:\n\n```\nit(\"does something\", function()\
    \ {\n  this.after(function() { cleanUp(); }\n});\n```\n\nCleanup at the spec level\
    \ is sometimes necessary to clear global information about the DOM or element\
    \ that would otherwise be persisted between tests.\n\nJasmine defines about a\
    \ dozen default matchers. See the Jasmine docs at http://pivotal.github.com/jasmine/matchers.html\
    \ for a full list. Here are the most useful. These should"
  merge: -1
  img_proc: true
- pgno: 166
  md: "reasonably self-explanatory.\n\n```\nexpect(obj).toBeFalsy;\nexpect(obj.to).toBeGreaterThan(value)\n\
    expect(num(num).toBeLessThan(value);\nexpect(obj).toBeNull();\nexpect(obj).toBeTruthy();\n\
    expect(array).toContain(value);\nexpect(obj).toEqual(value);\nexpect(str).toMatch(regex);\n\
    ```\n\nJasmine makes it easy to add your custom matchers. The first step is to\
    \ define the matcher. You have two different parameters to worry about. The actual\
    \ value, meaning the argument to the expect method, is exposed as this.actual.\
    \ Any arguments you want to pass to the matcher itself as part of the matcher\
    \ logic you can just pass as a straightforward argument list. The matcher function\
    \ needs to return true if the matcher passes. So, a sample matcher might look\
    \ like this:\n\n```\nfunction(expected_name) {\n  return this.actual.name ===\
    \ expected_name;\n}\n```\n\nTo use the matcher, it needs to be registered with\
    \ Jasmine using the addMatcher function, which is available inside any before\
    \ or it method. The matcher can be defined inline inside addMatcher, as follows:\n\
    \n```\nbeforeEach(function() {\n  this.addMatchers({\n    toHaveName: function(expected_name)\
    \ {\n      return this.actual.name === expected_name;\n    }\n  });\n});\n```\n\
    \nYou don't actually have to define the matcher function inline, of course. The\
    \ function can be defined anywhere, assigned to a variable, and referenced within\
    \ the addMatchers function. For that matter, beforeEach here can also be defined\
    \ globally in a helper function.\n\nOf course, saying that we can define the method\
    \ globally begs the question of exactly how the Jasmine determines what files\
    \ to load, both for testing and as the application to be tested. Test:Unit and\
    \ RSpec, which infer these items from the file system, the Jasmine determines\
    \ the boundaries of the test suite entries from\n\nThe first thing you can do\
    \ is the jasmine.yml file to specify the JavaScript libraries to load from:\n\n\
    ```\nhuddle_3_rspec/spec/javascripts/support/jasmine.yml\n\nsrc_files:\n  - public/javascripts/prototype.js\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 167
  md: "```\n- publicjavascript/effects.js\n- publicjavascript/controls.js\n- publicjavascript/dragdrop.js\n\
    - publicjavascript/application.js\n- publicjavascript/**/*\n```\n\nEach line is\
    \ a different pattern, and any JavaScript files that match the pattern are loaded\
    \ and available to be accessed from Jasmine files. The files are loaded in order,\
    \ which explains why you’d specify individual files even though the wildcards\
    \ in the last line cover all of them. By specifying what files go first, you can\
    \ make sure that any dependencies between the files are managed.\n\nAlthough the\
    \ JavaScript file list is probably what you would need to edit the most, the jasmine.yml\
    \ also allows you to specify CSS files that can be used for DOM testing, helper\
    \ files with say, custom matcher functions, and the loading of the actual Jasmine\
    \ spec files.\n\nJasmine has a very flexible and feature-rich framework, which\
    \ Jasmine refers to as spies. We declare a spy to spy with the spyOn method, which\
    \ takes two arguments. The first argument is an object, and the second argument\
    \ is a name of the method to which the object responds. You can also declare an\
    \ empty spy with Jasmine’s create_spy method. So:\n\n```\nvar User = {\nusername:\
    \ 'zachp',\nauthenticate: function(password) {\n  return someWebServiceCall(this,\
    \ username, password);\n},\nauthWithCallback:function(password, callbackFunction)\
    \ {\n  if authenticate {\n    return callbackFunction(password);\n  }\n}\n};\n\
    ```\n\n```\ndescribe(\"user stuff\", function() {\n  it('should call authenticate',\
    \ function() {\n    var myUser = Object.create(User);\n    spyOn(myUser, 'authenticate');\n\
    \n    // do something\n  });\n```\n\n```\nit('should authenticate with callback',\
    \ function() {\n  var myUser = Object.create(User);\n  spy = jasmine.createSpy();\n\
    \  myUser.authWithCallback('password', spy);\n\n  // do something\n});\n});\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 168
  md: 'In the previous fragment, create an object named myUser that knows about an
    authenticate method and then use the spyOn method to create an object for that
    method, only the spy that blocks the actual call is the authenticate method and
    just return null. In the second case, a bare spy is created and the authWithCallback
    method acts as the callback function.


    So, that’s not very helpful, here a few different ways to add useful behavior.


    We can create an expectation on the spy, effectively testing to the mocked method
    has been called. When using spyOn, the spy is actually part of the object’s name,
    but the bare spy created using createSpy can be used directly. So, you’d add the
    basic expectation like so:


    ```

    expect(myUser.authenticate).toHaveBeenCalled()

    expect(myUser.authenticate).toHaveBeenCalledWith(''password'')

    ```


    ```

    expect(spy).toHaveBeenCalled()

    expect(spy).toHaveBeenCalledWith(''password'')

    ```


    We can augment the spy when it is created to change the default behavior of just
    returning null. These methods work with spies created with either spyOn or createSpy.


    ```

    spyOn(myUser, ''authenticate'').andCallFake(function());

    spOn(myUser, ''authenticate'').andCallThrough();

    spOn(myUser, ''authenticate'').andReturn(arg);

    spOn(myUser, ''authenticate'').andThrow(exception);

    ```


    andCallFake method takes a method as an argument and invokes that when the spy
    is called, exactly analogous to a Ruby mock package taking a block as an argument.
    The andCallThrough method is unusual in that it allows for spy-like watching behavior
    and also calls the original method as though there was no spy. Both andReturn
    and andThrow specify the behavior of the fake method when called, again similar
    to the Ruby mock packages we’ve already seen.'
  merge: -1
  img_proc: true
- pgno: 169
  md: "# Integrating Jasmine with Dynamic Rails\n\nIf you are reading Jasmine in this\
    \ particular book, then probably are most interested in testing JavaScript that\
    \ interacts with your Rails application. Meaning that much of what you want to\
    \ test will be dependent on the particular DOM structure of your pages and the\
    \ event bindings that you create. Jasmine is designed to be DOM and framework\
    \ agnostic, so it doesn't out-of-the-box support for tight integration. However,\
    \ with a little elbow grease, it is possible to write Jasmine that uses the output\
    \ of your Rails app as DOM features. There are a couple of ways to do this; the\
    \ mechanism outlined here comes from JB Steaman on Pivotal's blog at http://pivotallabs.com/users/jb/blog/articles/1152-javascripttests-bind-reality-.\n\
    \nThe idea here is to write a script that nothing but generate HTML and put it\
    \ in a temporary file for later loading by Jasmine. The original Pivotal version\
    \ used RSpec for this purpose, to the order that the files would be generated\
    \ as part of your regular test suite. But there's nothing magical about RSpec\
    \ except that it already has the Rails environment loaded and primed for easy\
    \ querying. What you need is to add a line like the following to any RSpec spec,\
    \ integration test, or whatever, whatever is generating HTML that you like use\
    \ in a Jasmine test.\n\n```\nsave_fixture(response.body, 'body', 'project_file')\n\
    ```\n\nThe save_fixture method is a helper from JB's blog that I have tweaked\
    \ slightly like here:\n\n```\nhuckle3_rspec2/spec/spec_helper.rb\ndef save_fixture(markup,\
    \ name, parent_element=\"body\")\n  markup = html_for(markup, parent_element)\n\
    \  fixture_path = File.join(RAILS_ROOT, \"tmp/js_dom_fixtures\")\n  Dir.mkdir(fixture_path)\
    \ unless File.exists?(fixture_path)\n  file = File.join(fixture_path, \"\\#{name}.html.erb\"\
    )\n  File.open(file, 'w') do |file|\n    file.puts(markup)\n  end\nend\n```\n\n\
    The save_fixture method gets its HTML text from a method that uses Nokogiri to\
    \ extract and clean up the HTML.\n\n```\nhuckle3_rspec2/spec/spec_helper.rb\n\
    def for(html, selector)\n  doc = Nokogiri::HTML(html)\n  remove_third_party_scripts(doc)\n\
    \  content = doc.css(selector).first.to_s\n  return convert_body_tag_to_div(content)\n\
    end\n```\n\nThe exact details of the cleanup methods called here aren't that important.\
    \ It cleans up third-party scripts by removing a known DOM element from the output.\
    \ More importantly, it changes the body tag"
  merge: -1
  img_proc: true
- pgno: 170
  md: "div tag because, as we'll see, if you are trying to inject this call into an\
    \ already RSpec controller, you need to have called render_views (in RSpec 1.x,\
    \ as integrate_views) in the RSpec describe block that for RSpec will generate.\n\
    \nFrom Jasmine, you can use some of the methods that will help you with http://github.com/pivotaljb/js-fixture-example\
    \ in the code books for that huddle3_rspec2/spec/helpers/load_fixture.js. The\
    \ repository is a full application that shows how to incorporate the fixtures\
    \ into a Rails app. The downside is that with RSpec 1.3, the RSpec helper needs\
    \ a bit of tweaking to work in RSpec [55].\n\n```\ndescribe(\"huddle behavior\"\
    , function() {\n  it(\"does some fancy ajax thing\", function() {\n    spec.loadFixture(\"\
    project_file\");\n    spec(\"project\").click();\n    // and then some expectations\n\
    \  });\n});\n```\n\nThere are a couple of notes here. Once the fixture is loaded,\
    \ you can use jQuery or your framework of choice to interact with the DOM. Any\
    \ event bindings that are generated as part of that particular page are also loaded\
    \ and can be triggered from the spec. Any bindings that are part of an external\
    \ script that would normally be loaded before the body of the fixture, such as\
    \ in an application.js file, need to be separately loaded in the Jasmine test\
    \ after the fixture is loaded. So, if your JavaScript event handlers are nicely\
    \ separated into functions, you need to call those functions after loading the\
    \ fixture in the event handlers to be honored by the Jasmine code.\n\nAlso, you\
    \ need to clear the global event bindings and DOM after each test:\n\n```\nhuddle3_rspec2/spec/javascripts/helpers/SpecHelper.js\n\
    beforeEach(function() {\n  $(\"jasmine_content\").empty();\n  spec.clearLiveEventBindings();\n\
    });\n\nspec.clearLiveEventBindings = function() {\n  var events = jQuery.data(document,\
    \ \"events\");\n  for(prop in events) {\n    delete events(prop];\n  }\n};\n```\n\
    \nGranted, this isn't exactly a simple process, and I'd hope that a future version\
    \ of the Jasmine gem move some of this into the framework, at least as an option.\
    \ That said, this is pretty close to having everything you'd want in a Rails/Ajax\
    \ framework: you can use your actual code to drive your JavaScript test, you can\
    \ run the tests in a browser or at the command line, and everything is"
