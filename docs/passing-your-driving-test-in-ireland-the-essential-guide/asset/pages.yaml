- pgno: 132
  md: "# Testing Controller Response\n\nThe most basic thing you usually want to verify\
    \ in a controller method is that it returns the HTTP status code and that the\
    \ appropriate Rails template is placed in charge of returning the response. Rails\
    \ provides three assertion methods to help: assert_redirected_to, assert_response,\
    \ assert_template.\n\nWhen you're expecting a normal HTTP response and not a redirection,\
    \ you can indicate your expectation in the test with a combination of assert_response\
    \ and assert_template, like so:\n\n```\ntest \"successful index request\" do\n\
    \  get :index\n  assert_response success\n  assert_template \"index\"\nend\n```\n\
    \nLet's break that down. assert_response verifies the response code sent by Rails\
    \ to the browser. Typically, the expected value from the test is :success, meaning\
    \ code 200, or :redirect, which matches any of the 300--399 range that indicates\
    \ a redirect of some form or other. Other special values are missing to match\
    \ a 404 error, and error, which matches any of the 500--599 error range. Instead\
    \ of a special value, the expected assertion can also be the exact integer of\
    \ the expected response. The individual response codes also have their own, if\
    \ rarely used, symbolic equivalent. [45]\n\nThe assert_template verifies which\
    \ template Rails uses to generate the response. The template name is specified\
    \ exactly as it would be in the controller using render :action—the template name\
    \ can be a string or a symbol. If the argument is a single string or symbol, it\
    \ is checked against the name of the template rendered. If you call assert_template\
    \ with a key argument of the form assert_template :partial => '_user_data_row',\
    \ you are testing whether the specified partial is called when the controller\
    \ is rendered. The partial name in the test method must include the leading underscore.\
    \ Adding the :count option verifies that the specified partial was called a specific\
    \ number of times, which is potentially useful for a partial that is rendered\
    \ inside a loop.\n\nFor a redirect, Rails provides assert_redirected_to, which\
    \ takes as any object that can be resolved into a URL. (assert_redirected_to implicitly\
    \ makes a call to assert_response :redirect, so you don't need to write a separate\
    \ assertion for it)\n\nIf the argument assert_redirected_to is a hash, as in:\n\
    \n```\nassert_redirected_to :controller => :task, action => :show, id => 3\n```\n\
    \nthen if the actual redirect URL as specified in the controller also uses a hash,\
    \ the Rails test checks only the keys that you actually use in your assertion,\
    \ allowing you to check for a partial match."
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Rails will insist on an exact match.


    You can check against a gained named or RESTful route method:


    ```

    assert_redirected_to_new_task_url

    ```


    Or an object that corresponds to a RESTful route:


    ```

    assert_redirected_to @task

    ```


    A Rails controller test does not—repeat, does not—follow the redirect.[46] Any
    data validation tests you apply only to the method before the redirect occurs.
    If you need to test the redirection for some reason, you are cordially invited
    to try something in an integration test; see the Chapter Testing Workflow with
    Integration Tests.


    # Gotcha: Requiring a Login


    Here''s something that happens to me with disturbing frequency. On sites that
    require user logins, I often code the site up a bit before forcing the security.
    I add the line before_filter:authenticate! for Devise, and boom—all controller
    tests fail because they are redirected away from the controller because the test
    does not have a valid login. It always takes me longer to remember why this has
    happened it should (since it should, by now, take only ten seconds). To sum up,
    remember to put the login in your tests. With Devise, by default that means including
    Devise::TestHelpers in a setup block, along with some other setup that is specified
    in Security Now!'
  merge: -1
  img_proc: true
- pgno: 134
  md: "# Testing Returned Data\n\nAllows you to verify the data generated by the controller\
    \ method under test through the four collections mentioned earlier: assigns, session,\
    \ cookies, and flash. Of these, assigns, which is a hash of instance variables\
    \ created in the controller, is the most commonly used. A typical use might look\
    \ like this, with a common use of assigns, and a frankly contrived use of session:\n\
    \n```\ntest \"should show task\" do\n  get :show, :id => @task_1.id\n  assert_response\
    \ success\n  assert_equal @task_1.id, assigns(task).id\n  assert_equal \"task/show\"\
    , session[:last_page]\nend\n```\n\nThe cookies and flash special variables are\
    \ used similarly, though I don't write tests for the flash very often.[47]\n\n\
    When testing the model data in a controller, keep in mind that you usually don't\
    \ want to duplicate the actual model tests, and you definitely don't want the\
    \ controller test to replace the model. There’s less setup, and the test is easier\
    \ and more effective to test the model and generally clearer and more focused.\
    \ See the section Testing the Project View: A Cascade of Tests for a description\
    \ of how to interleave controller and model tests with a Test-Driven Development\
    \ process.\n\n# To Mock or Not to Mock\n\nWhile you want to make sure and cover\
    \ any error conditions specific to the controller itself, you don't need to test\
    \ all the error and condition paths of the model: again, that is best managed\
    \ in the model test. However, you do want to verify that the controller gets the\
    \ expected object. In many cases, it's enough to know that the controller object\
    \ is calling the expected method and sets the expected variable. Since the model\
    \ test covers the result of the model method, knowing that the method is called\
    \ with the expected arguments is enough to verify the state of the controller.\n\
    \nThis is a potentially great use for mock objects. Mock objects are covered in\
    \ more detail in the Chapter Using Mock Objects, but here's a sample of how they\
    \ can be used in controller testing, with the Ruby mock object Mocha:\n\n```\n\
    test \"should show task\" do\n  task = Task.new\n  Task.expects(:find).with(task.id).returns(task)\n\
    \  get :show, :id => 1\n  assert_response success\n  assert_equal task, assigns(task)\n\
    end\n```\n\nThe Task.expects line has two separate functions:"
  merge: -1
  img_proc: true
- pgno: 135
  md: "The stub function. Bypassing the real find method so that the object receives\
    \ a call for find(1), it will return task without calling the actual Task.find\
    \ method. Note that this bypasses the database entirely.\n\nThe mock function.\
    \ Setting up an expectation that find(1) will be called exactly once during this\
    \ test. If that method is not called, the test will fail.\n\nThe upshot of this\
    \ is that you can control the controller behavior without having to worry about\
    \ the finer points of the model implementation—in fact, you can control the controller\
    \ before the model method is even written. There's a downside, common to any mock\
    \ testing. Setting up the mocks can be time-consuming and brittle, and if the\
    \ object you return from the mock doesn't match the real method, you may be obscuring\
    \ bugs in the controller or view.\n\nOne compromise is the concept of a spy, which\
    \ the Double Ruby mock object framework allows.[48] Essentially, you can identify\
    \ the model method as being of interest, then set an assertion that the method\
    \ has actually been called. In Double Ruby syntax, the test might look like this:\n\
    \n```\ntest \"should show task\" do\n  stub.proxy(Task).find('1')\n  get.show,~id\
    \ => 1\n  assert_response :success\n  assert_received(Task) { |t| t.find('1')\
    \ }\n  assert_equal task, assigns(task)\nend\n```\n\nThere are just two special\
    \ lines in this snippet. In line 2, a special Double Ruby construct called a proxy\
    \ is created. Basically, this just calls the method normally but marks the method\
    \ as one for Double Ruby to track of.[49] Since Double Ruby is now tracking calls\
    \ to method, you can make assertions based on method counts, in this case asserting\
    \ that the Task actually received a method call find('1'). I find this to be a\
    \ nice way to split the difference between real mocks and actually testing the\
    \ model in the controller.\n\nThere's much, much more on the costs and benefits\
    \ of mock object testing in the Chapter Using Mock Objects. Also, see the section\
    \ Stubs for a description about how mock objects can be used to short up test\
    \ coverage of the failure states in code generated by standard Rails scaffolds."
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Testing Routes


    The basics of Rails routing is simple, the desire to customize Rails response
    to URLs lead to confusion about exactly what your application is going to do when
    converting between an URL and a Rails action, and vice versa. Rails provides two
    core methods that you can use to specify or validate routing behavior.


    The two Rails, assert_generates and assert_recognizes, are mirror images of each
    other. Let’s take them in alphabetical order.


    The assert_generates method takes an expected path string as its first element
    and a hash of key/value pairs as the second. The test passes if the Rails router
    would convert the key/value pairs into the expected string—it’s doing string comparison.
    Here’s an example from Huddle:


    ```

    assert_generates /status_reports/,

    {:controller => "status_reports", :action => "show", id => "/"}

    ```


    In this case, Rails runs the router against the hash and compares it to the string.


    The inverse method, assert_recognizes, flips the order of the arguments and also
    flips the execution.


    ```

    assert_recognizes {:controller => "status_reports",

    :action => "show", id => "/"}, /status_reports/

    ```


    In this case, the second argument is run through the Rails router, and the parameters
    that it converts are compared against the hash in the first argument.


    There’s a little bit more flexibility in the arguments in assert_recognizes. The
    second argument can also be a hash with two keys, a :path key and a :method key,
    which allows you to test RESTful routing like this:


    ```

    assert_recognizes {:controller => "status_reports",

    :action => "update", id => "/",

    {:path => "/status_reports/", :method => :put}

    ```


    For the purposes of this, the first argument can be written as a RESTful method
    or named method, though it’s not immediately clear to me why this is an improvement:


    ```

    assert_recognizes new_status_report_url, "status_reports/new"

    ```


    If you want to test items that would be in the query string, you must pass them
    as a hash in an option third argument—just appending them to the string argument
    won’t work:


    ```

    assert_recognizes {:controller => "status_reports",

    :action => "show", id => "/", all => true},

    "/status_reports/", {all => true}

    ```'
  merge: -1
  img_proc: true
