- pgno: 281
  md: "# Rcov and RSpec and Cucumber\n\nRSpec and Cucumber use a similar mechanism\
    \ for integrating Rcov. In both cases, the recommended way to run coverage of\
    \ your Cucumber feature is also by creating a new Cucumber Task in the rake file\
    \ created by the. For RSpec, it's lib/tasks/rspec.rake; for Cucumber, it's lib/tasks/rcov.rake.\
    \ In RSpec 1.3.x and 2.x, a spec:rcov task is defined, but you can add Rcov support\
    \ to any custom RSpec Task. The key is to set a task variable rcov to true you\
    \ get something like:\n\n```\nRcov:Rake::Task.new(\"rcov => \"db:prepare\") do\
    \ |t|\n  t.pattern = \"spec/**/*/**/*.rb\"\n  rcov = true\nend\n```\n\nIn Cucumber,\
    \ the task looks like this, which uses other options from the default Cucumber\
    \ rake:task:\n\n```\nCucumber:Rake::Task.new({:coverage => \"db:prepare\"}) do\
    \ |t|\nt.binary = vendored_cucumber_bin\nt.fork = true\ntrcov = true\nrcov_opts\
    \ = %w(--rails --exclude Library/Ruby/V)\nend\n```\n\nThe rcov_opts variable,\
    \ which works in both RSpec and Cucumber, takes command-line options that would\
    \ be sent to Rcov. The options are expected to be in an array. If no options are\
    \ set, the Cucumber default is %w{--rails exclude osx/objV}. To my knowledge,\
    \ RSpec does not have a default.\n\nIf those options are good for you, you can\
    \ just append to the list using something like t.rcov_opts << %w(aggregate data/coverage.data).\
    \ In RSpec 1.3.x, Rcov options can be placed in spec/rcov.opts, one option to\
    \ a line, similar to the way that spec:opts works."
  merge: -1
  img_proc: true
- pgno: 282
  md: "# # Rcov Tricks\n\nPersonally, I find Rcov tasks kind of inflexible and irritating,\
    \ which is why I wrote my own. The main goal of this was to provide two different\
    \ views of my test coverage, the first being just the model and helper tests against\
    \ the model and helper code only the second aggregating that report with the result\
    \ of the controller test against the entire app directory. I also wanted some\
    \ better control over the output.\n\nThe simpler part of this is hoping you are\
    \ are familiar with writing Rake tasks, because explaining all of Rake is out\
    \ of scope. (See http://rake.rubyforge.org for full Rake docs and http://jasonseifer.com/2010/04/06/rake-tutorial\
    \ for a good tutorial by Jason Seifer.)\n\n```\nnamespace test do\nnamespace :coverage\
    \ do\n  desc \"Delete aggregate coverage data\"\ntask :clean do\n  rm_rf \"tmp/functional\"\
    \n  rm_rf \"tmp/unit\"\n  rm_f \"tmp/coverage_data\"\nend\nend\n```\n\nThat done,\
    \ it's time to define the rake test:coverage task. What I'm doing here is defining\
    \ a blank task that is dependent on the cleanup task and defining two tasks, one\
    \ for each coverage run. Each of these tasks is dynamically made an antecedent\
    \ of the main rake test:coverage task. I'm helped greatly here by the Rcov::RcovClass\
    \ defined by Rcov. Here's the code (which is not the only or even necessarily\
    \ the best way to write this task):\n\n```\nnamespace :test\ntask :coverage =>\
    \ \"test:clean\"\n%w(unit functional).each do |target|\nnamespace :coverage do\n\
    Rcov::RcovTask.new(\"cov_#{target}\") do |t|\n  t.libs << \"test\"\n  t.files\
    \ = FileList[\"test/**/*_test.rb\"]\n  t.verbose = true\n  t.cov_opts << \"--rails\
    \ --aggregate data/coverage.data\"\n  t.cov_opts << \"--exclude app/controllers\"\
    \ if target == \"unit\"\n  t.cov_opts << \"--exclude db\"\n  t.cov_opts << \"\
    --exclude lib/authenticated\"\n  t.cov_opts << \"--exclude vendor/plugins\"\n\
    \  t.cov_opts << \"--exclude Library/Ruby\"\n  t.output_dir = \"data/#{target}\"\
    \nend\nend\n```"
  merge: -1
  img_proc: true
- pgno: 283
  md: 'The Rcov::RcovTask.new takes an initializing block; in that block, we set up
    any options to the task that we want. The class defines a number of attributes
    to help. Just in this example, you can see libs, which contains directories to
    be added to the load path; test_files, which takes the list of test files to be
    run; verbose, which specifies output verbosity; output_dir, which is the directory
    where Rcov writes to; and then rcov_opts, which takes any other arguments you
    want.


    Note that the two tasks differ only in their test directories and in that the
    unit test task excludes the controller directory. Rcov options being used include
    the --aggregate option, which allows the data from the unit test to be rolled
    into the controller run to create a combined coverage report the second time through.


    This is what I use to measure coverage on my projects. Season to taste, and try
    it on your own.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# How Much Coverage Is Enough?


    How valuable is code coverage? The inimitable Jay Fields, who has probably forgotten
    about testing than I ever knew, compares code coverage to money—in that having
    a lot of it doesn''t necessarily mean you are happy, but having none pretty much
    sucks.


    It''s not hard for a Rails project to run at 100 percent coverage, but there''s
    having coverage for the purpose of getting the magic 100 number, and there''s
    having coverage as a result of an actual test-driven development project, plus
    some occasional corner filling. The magic number on its own is probably useless;
    however, going through the process is quite valuable.


    If you are executing the process correctly, your coverage should be 100 percent
    or pretty close as a natural side effect. If you find yourself writing an awful
    lot of tests after the fact just to get the number up, it''s a hint that you could
    stand to improve your TDD process.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Beyond Coverage: What Makes Good Tests?


    One of the great things about the Ruby Rails community is the extent to which
    they have accepted the idea that Test-Driven Design is a good process for developing
    software. That''s a huge accomplishment and a genuine difference between the Rails
    community and other programming groups that I have been part of. We''ve spent
    a lot of time in this book on the mechanics of Ruby on Rails testing, how the
    tools work, how to get them running, and how to manage the basic TDD process.
    In other words, we’ve talking about the craft of testing. Now, I''d like to talk
    about the art of testing: what makes a good test, how to balance testing priorities,
    how to troubleshoot, and, in the next chapter, how to test when you already have
    a pile of bad code.


    I''d like to see the discussion of testing in the Ruby community move to the next
    step, which is how to improve the quality of the tests you write. I see two modes
    of testing in the community, both of which are interesting at times, but neither
    of is the discussion I want to have at the moment.


    +   * TDD/BDD naming debate. I’ve been testing for long enough that I still need
    to catch myself from calling it Test-First Programming. So, I don’t have a lot
    of patience when I refer to TDD, only to be greeted with an eye-roll and “Don’t
    you mean BDD?” response. We probably all have better things to do than argue over
    Scrabble tiles.

    * Tools you should never use. There have been a lot of posts over the last few
    months—some insightful, some less so—on the general theme of “Why You Should [Never/Always]
    Use Cucumber.” Choice is a useful discussion, but almost of the popular tools
    in Rails can be used effectively, so this debate doesn’t necessarily give much
    guidance as to how to test.


    There’s a more fundamental debate lurking behind these of discussions: a debate
    over what makes a test or a suite of tests effective and useful over the life
    of your application. To date, there’s really only one commonly accepted objective
    metric of test quality—coverage. As we saw in the Chapter Using Rcov to Measure
    Test Coverage, though coverage is a flawed measure of test quality.


    For the purposes of this discussion, we’ll use a more subjective metric: a good
    test saves time and effort over the long term, while a poor test costs time and
    effort. Using my own test experiences, I’ve focused on five qualities that tend
    to make a test successful by this metric. The absence of these qualities, on the
    other hand, is often a sign that the test could be a problem in the future.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# The Five Habits of Highly Successful Tests


    The best, most general, piece of advice I give about the style and structure of
    automated tests is this: *remember your tests are also code*. Also, remember your
    tests are code that don''t have tests. Your code is verified by your tests, but
