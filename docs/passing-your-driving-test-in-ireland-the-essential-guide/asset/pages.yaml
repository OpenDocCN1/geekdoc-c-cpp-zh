- pgno: 75
  md: "# Testing ActiveRecord Finders\n\nIn Rails 3, you can write individual pieces\
    \ of database logic as separate methods and compose them arbitrarily. For example,\
    \ if you often find yourself needing, say, users sorted by email address or a\
    \ list of all active users or to get five users out of your database find call,\
    \ you can write all of those as separate finder methods:[31]\n\n```\ndef self.by_email\n\
    \  order(\"email ASC\")\nend\n\ndef self.active_only\n  where(active => true)\n\
    end\n\ndef self.limit_to(x)\n  limit(x)\nend\n```\n\nThese methods can then be\
    \ used like any other ActiveRecord find command.\n\n```\nUser.by_email\nUser.active_only\n\
    User.limit_to(5)\n```\n\nBut the best part is that these methods can be composed,\
    \ which gives you a very readable way to express complex database queries:\n\n\
    ```\nUser.active_only.by_email.limit_to(5)\n```\n\nBeing able to compose this\
    \ logic, therefore, is awesome. But these methods occupy an awkward place between\
    \ methods you might write and Rails core features, leading to the question of\
    \ how best to test functionality that you've placed in a named scope declaration.\
    \ Here are some guidelines.\n\nClass finders are often extracted during a refactoring\
    \ step. In this case, you may not need any new test to cover the scope—like any\
    \ other method extracted in refactoring, it's not a change in logic, it's already\
    \ covered for TDD purposes by the original test. Even so, if the finder method\
    \ winds up in a different class than the original method, it's often useful to\
    \ transfer the test dealing with the scope to the test in the new class.\n\nThe\
    \ pitfall you want to avoid when testing any finder behavior is testing the SQL\
    \ call to the database rather than testing the results of the call. In other words,\
    \ it's not all that hard to extract the parameters the scope object is going to\
    \ contact the database. However, only testing that your method winds up with {:active\
    \ => true} as its find parameters doesn't help you anything. Just testing the\
    \ parameters says nothing about the actual database behavior, and it's the actual\
    \ behavior that you are normally looking to validate."
  merge: -1
