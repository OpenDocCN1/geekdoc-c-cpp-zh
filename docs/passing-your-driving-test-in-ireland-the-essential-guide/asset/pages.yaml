  md: "# # The First Refactor\n\nWe fixed the immediate problem, and the test passes.\
    \ We now enter entering the refactoring step. There isn't much here to refactor,\
    \ but we have one detail we can tweak: it's better not to set the status date\
    \ in the controller. Good Rails practice moves complexity to models where possible.\
    \ For one thing, placing code in the models to decrease duplication when functionality\
    \ is used by multiple controller actions. For another, code in the model is easier\
    \ to test.\n\nOrdinarily, we would not be writing tests during refactoring, just\
    \ using existing tests to verify that behavior hasn't changed. However, when moving\
    \ code from one layer, the controller, to another, the model, helps to create\
    \ tests in the new class. Especially here, because our new behavior will be slightly\
    \ different, we want status_date to be automatically set whenever the report is\
    \ saved.\n\nThe unit test uses test/unit/status_report_test.rb:\n\n```\n1  test\
    \ \"saving a status report saves the status date\" do\n2   actual = StatusReport.new\n\
    3   actual.save\n4   assert_equal(Date.today.to_s, actual.status_date.to_s)\n\
    5 end\n```\n\nThe test fails. As referenced in a previous footnote, in line 4\
    \ we're comparing literal string objects rather than the dates.\n\nTo pass the\
    \ test, we add a before_save callback to the StatusReport class:\n\n```\nclass\
    \ StatusReport < ActiveRecord::Base\n\n  belongs_to :project\n  belongs_to :user\n\
    \n  before_save :set_status_date\n\n  def set_status_date date\n    self.status_date\
    \ = Date.today\n  end\nend\n```\n\nNow the test passes. But there's one more thing\
    \ to worry about—if the status_date has already been set before the report is\
    \ saved, the original date should be used. As the code stands now, the status_date\
    \ will change when the model is edited. In the TDD process, we force ourselves\
    \ to make that change by exposing the error with a test. Here's how, in test/unit/status_report_test.rb:\n\
    \n```\n1  test \"saving a status report that has a date doesn't override\" do\n\
    2   actual = StatusReport.new(status_date => 10.days.to_date)\n3   actual.save\n\
    4   actual.reload\n5   assert_equal(10.days.to_date.to_s, actual.status_date.to_s)\n\
    ```"
