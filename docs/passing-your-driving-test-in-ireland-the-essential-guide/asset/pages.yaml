- pgno: 105
  md: 'a stub that always returns nil is a pointless, so Mocha allows you to specify
    a return value for the stubbed method using the following syntax:


    ```

    huddle_mocha/test/unit/project_test.rb

    Line1 test "stub an object again" do

    2 stub_project = Project.new(name => "Project Greenlight")n3 stub_project.stubs(name).returns("Fred")n4
    assert_equal("Fred", stub_project.name)

    5 end

    ```


    Line 3 is doing the heavy lifting, tying the return value Fred to the method :name.
    Technically, stubs returns a Mocha Expectation object, which is effectively a
    proxy to the real object. The returns is a method of Expectation that associates
    the return value with the method.


    Since classes in Ruby are really just objects, you''d probably expect that you
    can stub classes just like stubbing instances. You''d be right:


    ```

    huddle_mocha/test/unit/project_test.rb

    Line1 test "stub a class" do

    2 Project.stubs(:find).returns(Project.new(name => "Project Greenlight"))n3 project
    = Project.find(1)

    4 assert_equal("Project Greenlight", project.name)

    5 end

    ```


    In this test, the Project is stubbed to return a specific project instance whenever
    we find. In line 3, the find method returns object via the stub when Project.find
    called.


    Now we may be getting somewhere...you''ll notice that this uses the results of
    a find method without actually touching the database. It''s not hard to find Rails
    programmers who would consider the database to be prohibitively expensive to use
    in a test environment, and this is one—admittedly, over-simplified—strategy for
    avoiding it. Again, remember this stub should be used to verify that the find
    method works; it should be used by other tests that need the find method along
    the way to the other logic that is actually under test.


    There are a couple of advanced usages of returns that might be interesting now
    and again. If you have multiple return values specified, the stubbed method returns
    them one at a time, as the following irbing sessions shows:


    ```

    >> stubby = Project.new

    => #Project id: nil, ...>

    >> stubby.stubs(:user_count).returns(1, 2)

    => #Mocha::Expectation:0x0221e470..> side_effects[]

    >> stubby.user_count

    => 1

    >> stubby.user_count

    => 2

    ```'
