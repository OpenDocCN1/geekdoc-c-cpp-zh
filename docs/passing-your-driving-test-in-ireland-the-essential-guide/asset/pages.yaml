  md: '# Mock, Mock, Mock


    A true mock retains the basic idea of the stub—returning a specified value without
    actually calling a live method—and adds the requirement that the specified method
    must actually be called during the test. In other words, a mock is like a stub
    with attitude, expecting—nay, demanding—that its parameters be matched in the
    test or we get a test failure.


    As with stubs, Mocha provides a way to create a mock object from whole cloth,
    as well as a way to add mock expectations to an existing object. The method for
    bare creation is mock:


    ```

    test "a sample mock" do

    mock = mock(name => "Paul",weight => 100)

    assert_equal("Paul", mock.name)

    end

    ```


    As it happens, this test fails:


    +   1) Failure:

    test_a_sample_mock(ProjectTest)[test/unit/project.test.rb:46]:

    all expectations were satisfied

    satisfied expectations:

    - expected exactly once, not invoked:

    #<Mock:0x25550bc&.weight(any_parameters)>

    satisfied expectations:

    - expected exactly once, already invoked:

    #<Mock:0x25550bc&.name(any_parameters)>


    It fails because the first line use two mock expectations, one for mock.name and
    one for mock.weight, but only one of those mocked mocks were called in the test.
    it''s an unsatisfied expectation. To pass the test, add a call to mock.weight:


    ```

    test "a sample mock" do

    mock = mock(name => "Paul",weight => 100)

    assert_equal("Paul", mock.name)

    assert_equal(100, mock.weight)

    end

    ```


    The method for adding a mock expectation to an existing object expects:[41].


    ```

    huddle mocha/test/unit/project_test.rb

    test "lets an object" do

    mock_project = Project.new(name => "Project Greenlight")

    mock_project.expect(name).returns("Fred")

    assert_equal("Fred", mock_project.name)

    end

    ```


    All the modifiers we''ve seen so far were applied to stubs, like returns, raises,
    any_instance, and with, or all the pattern matchers can be added to a mock statement.
    For example, the controller test for create'
