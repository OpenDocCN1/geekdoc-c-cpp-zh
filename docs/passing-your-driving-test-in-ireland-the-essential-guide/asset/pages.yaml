- pgno: 306
  md: '2 and 3 set up the order and a mock for the credit_card_valid method. Lines
    4–9 set up them, with the actual test action taking place in line 10 and the last
    lines performing the validation. In a full test suite, we''d test a couple of
    combinations of values, some of the mock setup would probably be extracted to
    a repeatable—either an explicit test block or a method that is called by each
    test.


    The strength of this process is that it allows us to unit without further tangling
    the existing code logic: it''s possible that credit_card_valid depends on another
    three different attributes of the order, the user, or the payment system, and
    that''s a mess we don''t want to get into at this particular moment. The mock
    lets us isolate logic issues. An additional strength of this mock testing is that
    it limits test coverage to the method under test, making the coverage report more
    accurate.


    However, there are some problems to watch out for. It can become time-consuming
    to set up the external mocks for a complex method, and we run the same risk as
    with any mock object testing, namely that our test becomes a tautology because
    it''s just parroting the input to the mock objects. We have to keep the mock data
    to the external methods and classes in order to avoid that problem.


    # Find the Seam


    Mocks objects are a specific version of a more general technique for working with
    legacy code, which involves seams in the code and exploiting them to make testing
    the legacy functionality possible.


    A seam is a place where we can change the behavior of our application without
    changing the actual code. A mock object packages as a seam because adding the
    mock object, which happens in the test, changes the behavior of the code by mandating
    a specific response to a method call without actually executing the method. Again,
    the behavior of the method under changes in the test environment without affecting
    behavior in the production and without changing the existing development code.


    It sounds magical, but the basic idea is simple, and Ruby makes it easy to execute.
    Essentially, redirect a method call from its intended target to some other code
    that we want to run during tests. A mock does this by replacing the entire method
    call with a return value, and the generic form lets us do anything we want instead
    of the method call. We might do this if we wanted a side effect that a mock package
    would normally provide, such as diagnostic logging. Alternately, we might want
    a more elaborate processing of arguments or state than a mock can easily provide,
    to re-create the output of a web service our application depends on, [86].


    Let''s take some Ruby code that we want to test. In this sample, flit_server is
    an object in our system representing an internal server, and those innocent-looking
    calls are actually genuine external service calls to a real server that exists
    in production but not in the:'
