- pgno: 184
  md: "# Writing Your Own Shoulda Matcher\n\nThe Shoulda team's decision to move Shoulda\
    \ to a higher degree of RSpec compatibility had undeniable benefits—such as, well,\
    \ RSpec compatibility and a more consistent syntax. However, the ability to easily\
    \ create our Shoulda matchers was clearly a casualty. What once was a three-line\
    \ class method is now about a page of code. To be fair, if you are RSpec, you\
    \ can use RSpec's tools for creating custom matchers as shown in the section Creating\
    \ Your Own Matchers. If you're not in RSpec-land, though, you don't have a lot\
    \ of tools to help you through the process. It's doable, and here's an example.\
    \ If you are going to start writing your Shoulda matchers for Test::Unit, I recommend\
    \ digging into the Shoulda source for examples.\n\nWe'll build this Shoulda matcher\
    \ from the top down. The first thing we need is the method that will actually\
    \ be called from the Shoulda test. The example we're going to walk through is\
    \ the ActionController render_template matcher, which is called something like\
    \ this:\n\n```\nshould render_template(:index):\n```\n\nThe first thing we need\
    \ to define is the actual render_template method. Although Ruby syntax flexibility\
    \ is disinguising, the render_template method is actually an instance method of\
    \ TestCase—which might be easier to see if we wrote the line fully parenthesized:\n\
    \n```\nshould(render_template(:index))\n```\n\nSo, the render_template method\
    \ has to be defined as an instance method of TestCase, and it needs to return\
    \ a Matcher object—more about this in a second.\n\nThe actual Shoulda definition\
    \ of the method looks like this:\n\n```\nmodule Shoulda\n  module ActionController\n\
    \    module Matchers\n      def render_template(template)\n        RenderTemplateMatcher.new(template,\
    \ self)\n      end\n    end\n  end\nend\n\nclass RenderTemplateMatcher\n  # Full\
    \ definition of matcher here\n  end\nend\n```\n\nThe arguments passed to the matcher\
    \ class must include the context in which the matcher was called, handled by passing\
    \ self. This allows the matcher to work both when called from the top level and\
    \ when called from within a context and ensures the correct context startup and\
    \ teardown are executed"
  merge: -1
  img_proc: true
- pgno: 185
  md: "Now, we have to make that method visible to TestCase. As a short example, we\
    \ can just include it inside the test_helper.rb file. For a larger example, we\
    \ can have a separate file that opens the class and manages the include:\n\n```\n\
    module Test #:nodoc: all\nmodule Unit\nclass TestCase\ninclude Shoulda::ActionController::Matchers\n\
    end\nend\n```\n\nThe render_template method returns an instance of RenderTemplateMatcher.\
    \ What’s that? Anything we want, with some constraints. For example, notice that\
    \ RenderTemplateMatcher, as listed earlier, does not have a parent matcher class\
    \ of any kind.\n\nThe rest of the Shoulda system does expect the Matcher class\
    \ to define a specific set of methods. To wit:\n\n+   - description method that\
    \ returns a string. This string is used to give the test name for the Test::Unit\
    \ system, which the method typically uses the arguments to the matcher to create\
    \ a unique string for each matcher, and in \"render template #{@template}\".\n\
    \n+   - A method matches?, which takes one, the eventual subject of the test at\
    \ runtime. It returns true if the matcher matches and false otherwise. If this\
    \ method is complex, it will often defer to the private methods of the class to\
    \ define its logic.\n\n+   - Methods failure_message and negative_failure_message,\
    \ which return strings and are used as the display message when the matcher doesn’t\
    \ return the expected value. We can make these plain attributes, in which case\
    \ default messages are used.\n\n+   - Any other methods that we want to chain\
    \ with the matcher would be defined as instance methods of the matcher class.\
    \ Typically, those methods set instance variables are referred to by the matches?\
    \ method when determining whether the matcher should pass.\n\nThe entire matcher\
    \ looks like this, a slightly edited code sample straight from the Shoulda source:\n\
    \n```\nclass RenderTemplateMatcher\nattr_reader:failure_message, :negative_failure_message\n\
    def initialize(template, context)\n  @template = template.to_s\n```"
  merge: -1
  img_proc: true
- pgno: 186
  md: "```\ndef matches?(controller)\n  @controller = controller\n  begin\n    @context.send_assert_template,(@template)\n\
    \    @negative_failure_message = \"Didn't expect to render #{@template}\"\n  \
    \  true\n  rescue Test::Unit::AssertionFailedError => error\n    @failure_message\
    \ = error.message\n    false\n  end\nend\n\ndef render(template)\n  \"render template\
    \ #{@template}\"\n  end\n```\n\nShoulda matchers aren’t that complicated, but\
    \ if you find yourself creating a bunch of them, it might be time to check out\
    \ RSpec and its more simplified ways of creating matchers."
