  md: '# Basic Setup


    When you are presented with a new code base for the first time, your job is figuring
    out exactly what heck is going on. Toward that end, there are three things you
    should do immediately. The next three sections define the foundation steps in
    converting a legacy project into a project that can proceed with a solid Agile
    and TDD work cycle.


    # Get the Project Under Source Control


    It probably is under source control, but you can''t be too careful. While starting
    on a new legacy code base is not the time to get fancy with new tools, you will
    be much better served by using Git or some other source control system that lets
    you easily create and manipulate branches. This will enable you to easily explore
    changes to the code base using branches as scratch pads that can be kept or discarded
    as needed.


    # Get It Running


    If the project was conceived without much knowledge of Rails community practices
    (evidenced by the lack of tests), it won’t be a surprise if the production environment
    is also a little sketchy. Conventional wisdom suggests that your development,
    staging, and production environments should be as similar as possible to prevent
    environment-specific errors. And although this is true in general, if your project
    is running by some random goofy server setup, it may be difficult or impossible
    to replicate that setup on your staging server, let alone your development machine.


    If the exact production environment isn’t an option, the staging and development
    environments should be as generic as possible. If possible, push to migrate the
    production environment to a less fragile and more standard environment as soon
    as possible.


    # Get the Test Suite Running


    At first glance this may strike you as a totally useless piece of advice. If the
    legacy team has been ignoring tests, nothing is there, right? Of course everything
    will run.


    Well, not necessarily. There are at least two things you need to look out for.
    Even if the previous coders totally ignored tests, Rails still probably autogenerated
    test code. The most likely problem you''ll run into is that fixtures, generated
    when the initial model was created, moved out of date. If columns were deleted
    or renamed, the fixtures won''t load, and you''ll get errors galore. It''s only
    slightly likely that the generated controller tests for a generic scaffold have
    drifted out of date with the code; if authentication and roles were added later,
    for example, you will need to match that authentication in the tests.


    In some ways, your job is harder if the previous coder flirted with writing tests
    and then gave it up because he had not read this book. (I''m assuming.) In that
    case, you''re likely to have all kinds of tests that may or may not have passed
    at one point and have been broken by later code,'
