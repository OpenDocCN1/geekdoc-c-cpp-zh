- pgno: 143
  md: 'Personally, I find the keys more readable, and I tend to use them even when
    specifying only one option. You can also specify range behavior with the keys:minimum
    and :maximum.


    That brings us to the selector. There are many different selectors modifiers,
    most of which do not get used often. The modifiers boil down to five types, described
    in the following sections.


    # Specify the DOM ID of the Element


    You can specify an element by DOM ID using a #, as in "div#user_name_3". You can
    leave off the HTML tag if you want; "#user_name_3" matches any DOM element with
    that ID, regardless of tag type. In any assert_select, a ? behaves as it does
    in an ActiveRecord SQL condition, as a placeholder for a value specified later.
    The common use case of specifying an element as the Rails dom_id can be written
    as follows: [50]


    ```

    assert_select("div#", dom_id(@user_name))

    ```


    This is often easier than red duplicating the hash symbol to interpolate the string.
    As mentioned previously, I recommend using IDs for frequently.


    # Specify the CSS Class of the Element


    The CSS class of the element being searched for can be specified using , as in
    "div.headline". Again, you can leave off the HTML tag. Aside from looking at class
    rather than ID, the behavior is exactly as described earlier.


    # Specify the Value of an Arbitrary HTML Attribute


    An assert_select method can be made to look for any arbitrary HTML attribute.
    This is most useful when searching for the name attribute of input tags. Other,
    noncontriveded examples include the action attribute of a form tag, the src attribute
    of an img tag, and the href attribute of a a tag. The basic syntax looks like
    this:


    ```

    assert_select("input[name=user_id]")

    ```


    Note that when testing forms that use Rails the ? syntax for the case where the
    name actually contains a bracket; otherwise, you can put the entire name in quotes:


    ```

    assert_select("input[name=?", "user_email")

    assert_select("input[name=?user_email]")

    ```


    The operator indicates an exact match with the value of the attribute. There are
    a couple of modifiers to the = for different match behavior. The one I most often
    use *=, which is true if the attribute value contains the specified text, as in
    assert_select("input[name *= email]"). You can also use'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'and starts= for starts with ends with, respectively.


    # Use a Pseudoclass


    There are a number of pseudoclass modifiers that can be added to a selector, including
    the following:


    ```

    assert_select("div:first-child")

    assert_select("div:last-child")

    assert_select("div:only-child")

    assert_select("div:nth-child(3)")

    assert_select("div:nth-last-child(3)")

    ```


    To clear up any confusion: you read these as “a div element that is a first child
    of its parent,” not “the first child of a div.” I find these helpful for output
    when I am testing for output in a specific order, as a sorted list. It’s easier
    to test for “ii:nth-child(2)” than to try to extract the list text via regular
    expression and test for the elements of that resulting list. Also, notice are
    dashes and not underscores in these pseudoclass names. It seems like I’m always
    typing them as underscores and then being surprised when the pseudoclass is not
    recognized.


    Each of these has a more specific modifier, replacing child with of-type, such
    as first-of-type, which means the matching tag must be the first of the siblings
    of the given HTML element. Read div:first-of-type as “a div element that is the
    first div element of its parent.” (Do I need to mention that you can use any number
    as the argument to the nth modifiers?)


    Other modifiers that aren’t in the first/only genre include the following:


    ```

    assert_select("div:root")

    assert_select("div:empty")

    assert_select("div:not(headline)")

    ```


    The first modifier in the list checks for an element of the given type that also
    happens to be the root element. The second looks for an empty table, while the
    not modifier looks for an element of type that does not match the given selector—in
    this case, a div element that does not have a CSS class of headline. I intend
    to feel the two of these are too fiddly for useful tests, but I’m sure there’s
    a valuable case out there somewhere. The not construct can be helpful for negative
    testing.


    # Combine Multiple Selectors


    You can use assert_select to test for different combinations of tags. Again, the
    syntax is similar to standard CSS.


    ```

    assert_select("div:headline span")

    ```


    That snippet finds all elements that are inside a div with the class ‘headline’.
    Putting a > operator between the two elements means that the second element must
    be a direct child of the first, and not'
