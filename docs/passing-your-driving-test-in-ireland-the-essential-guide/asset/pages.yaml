  md: 'with declaration can be made more complicated in several ways—frankly, practical
    application of some of these eludes me, we''ll run them quickly.


    Most generally, we can pass a block to with instead of an argument:


    ```

    proj = Project.new()

    proj.stubs(status).with {value % 2 == 0}.returns("Active")

    proj.stubs(status).with {value % 3 == 0}.returns("Asleep")

    ```


    When the stubbed method is called, if the block returns true, then the expectation
    is considered matched:


    ```

    >> proj.status(2)

    => "Active"

    ```


    If one or more returns true, it seems as though the last one declared wins:


    ```

    >> proj.status(3)

    => "Asleep"

    >> proj.status(6)

    => "Asleep"

    ```


    If none of the blocks returns true, we get an unexpected invocation error, as
    we did just a second ago.


    Mocha also defines a bunch of parameter matchers that give more flexible with
    behavior. This is an incomplete list of the ones that are most useful. Note that
    not all of these behaviors can be implemented using the block syntax.


    Use instance_of of this matcher and its reluctant cousin is_a match any incoming
    parameter is of the given class. Use instance_of of this:


    ```

    proj = Project.new()

    proj.stubs(tasks_before).with(instance_of(Date)).returns(3)

    proj.stubs(tasks_before).with(instance_of(String)).raises(Exception)

    ```


    This or any other Mocha matcher can be negated with the Not method. (Yes, it''s
    capitalized, to presumably avoid parse collisions with the keyword not.)


    ```

    proj = Project.new()

    proj.stubs(tasks_before).with(Not(instance_of(Date))).returns(3)

    ```


    We can apply a stub to more than one possible argument with the any_of matcher:


    ```

    proj.stubs(thing).with(any_of(''a'', ''b'')).returns(''ababababa'')

    ```


    which would match either of the following:


    ```

    proj.thing(''a'')

    ```'
