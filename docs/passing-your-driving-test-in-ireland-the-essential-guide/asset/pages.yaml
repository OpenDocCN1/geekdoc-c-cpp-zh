- pgno: 102
  md: '# What’s a Mock Object?


    One complicating factor in dealing with mock objects is that much everybody who
    creates a mock framework feels perfectly to use slightly different naming conventions
    than everybody. Here are the names that I use, which are—of course—also the correct
    ones [37].


    The generic term for any object used as a stand-in for another object is *test
    double*, by analogy to "stunt double", and with the same connotation of a cheaper
    or more focused replacement for a more expensive real object. Colloquially, *mock
    object* is also used as the generic term but—confusingly—is also the name of a
    specific type of test double.


    A *stub* is a fake object that returns a predetermined value for a method without
    calling the actual object. We can create a stub as follows (this uses the Ruby
    gem Mocha, but you don’t need to worry about the exact syntax just yet):


    ```

    thing.stubs(:name).returns("Fred")

    ```


    That line of code says that if you call `thing.name`, you’ll get `Fred` as a result.
    Crucially, the actual `thing.name` method is not touched, so whatever the “real”
    method would return is not relevant; the `Fred` response comes from the stub,
    not the actual object. If `thing.name` is not called in the test, nothing happens.


    A mock is similar to a stub, but in addition to returning the fake value, a mock
    object also sets a testable expectation that the method being replaced will actually
    be called in the test. If the method is not called, the mock object triggers a
    test failure. So, when you write the following snippet to create a mock object
    instead of a stub:


    ```

    thing.expects(:name).returns("Fred")

    ```


    then if you call `thing.name` in your test, you will get `Fred`, and the actual
    `thing.name` method is still untouched. But if you don’t call `thing.name` in
    the test, the test fails with what’s generally called a `MockExpectationError`,
    or some such.


    In other words, setting a stub on a method is passive and says, "Ignore the real
    implementation of this method and return this value," while setting a mock on
    a method is more aggressive and says, "This method will return this value, and
    you better call the method, *or else*",


    The reason you might set such an expectation is that once you’ve stubbed the method,
    it makes no sense to write an assertion on it like this one:


    ```

    thing.stubs(:name).returns("Fred")

    assert_equal("Fred", thing.name)

    ```


    In this case, you’re just testing the stub works as advertised—this can’t fail.
    But if you use the'
