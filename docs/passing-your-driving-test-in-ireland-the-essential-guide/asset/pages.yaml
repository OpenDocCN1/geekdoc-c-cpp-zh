- pgno: 221
  md: '# Testing Workflow with Integration Tests


    Integration tests seem to be used less frequently than other Rails built-in test
    types. Certainly there is much less online about how and when to use the built-in
    integration tests, probably because integration tests don''t quite map to the
    classic TDD/BDD process (where they might fit in, they''ve been largely supplanted
    by Cucumber). On the one hand, this is a shame, because integration tests are
    a powerful and flexible way to do high-level testing on your application. Done
    right, they can even serve as acceptance tests. On the other hand, I''m guilty
    as anybody of underusing them. For what it''s worth, integration tests have been
    extremely handy when I''ve used them.


    What''s in a Name, Part Three


    I like the name integration tests. So, I''ve got nothing here.


    Well, I should point out the difference between an integration test and an acceptance
    test. An integration test is written by the developer for a developer audience,
    whereas an acceptance test is written by or in close consultation with the customer
    for a customer audience. Acceptance tests often have some kind of domain-specific
    language magic that allows for something readable by the customer to be automatically
    executed as a test; see the Chapter Acceptance Testing with Cucumber for details.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# What to Test in an Integration Test


    Integration tests are the tool of choice in Rails to test any process that spans
    one or more controller actions. Two common use cases are a multistep registration
    process and a purchase/checkout ecommerce function. In both cases, the entire
    user task flow has an integrity that can be completely tested only when all the
    steps can be executed together. As a rule of thumb, if one controller action is
    communicating with a future controller action via session state or other data-sharing
    method, you probably should have an integration or acceptance test covering the
    entire procedure.


    Integration tests tend to be written separately from the normal tight loop of
    the test-driven development process. Often, a whole bunch of them are written
    up front to serve as requirements, a guide to development, or proof of completion.
    Sometimes they are written after primary development to ensure that pieces that
    have only been tested separately are in fact making the expected communications—for
    example, to catch a potential issue created when one method saves to the session
    with one key, while the later method looks for a different key in the session.
    Oops.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# What’s Available in an Integration Test?


    Rails tests are similar to controller tests. They import the assertion modules,
    so any assertion available in a controller test can also be called from an integration
    test. The same set of method names are available to simulate HTTP requests (get,
    post, put, delete, head, and xhr), although we''ll see in a second that there
    are some minor differences from the controller versions of these methods.


    The two biggest differences between integration tests and controller tests are
    as follows:


    +   - Integration tests are not tied to a specific controller. This means the
    action argument to the HTTP request needs to be an object that resolves to a known
    URL in the system. Most often, this is simply the URL string, such as `get ''tasks/show''`.


    +   - Integration tests maintain one or separate sessions that persist between
    the different simulated user requests—in a controller test, the session is a characteristic
    of the response and is not guaranteed to behave correctly if you simulate multiple
    calls.


    With the HTTP simulation methods, you can use any object that Rails can convert
    into a URL by using the method `url_for`. The argument could be a hash or a resource
    object, as in `url_for(tasks(:one))`.


    The second argument to all the HTTP request methods is a hash of parameters. Using
    the second argument is the preferred mechanism for adding parameters in an integration
    test, rather than building a query string for the URL or using a complex `url_for`
    call. The third argument (rarely used) contains any HTTP headers you want to send
    for the request. With controller methods, the `xhr` method takes a first argument
    specifying the HTTP verb and then includes the same arguments as the other request
    methods in order.


    By default, integration tests do not follow redirects. However, each method except
    `xhr` has the `via_redirect` variant, such as `post_via_redirect`, that performs
    the request and follows all redirects until it gets a result that isn''t a redirect.
    And any session it hits along the way will go into the session object, and the
    output to be tested will be the output of the final destination. If you want to
    control the controller behavior less automatically from inside your test, the
    integration test method `follow_redirect!` will, as you might expect, exactly
    one redirect, raising an exception if the last request did not end in a redirect.
    You can use the integration test `redirect?` to determine whether the last request
    was or not a redirect.[70]


    There are also two methods that allow you to change a setting for all future requests
    in a test. The `https!` method will make all future requests behave as though
    they use HTTPS. Note that this will actually change anything, there isn''t a real
    server request being made, but any other controller-logic that is dependent on
    the secure nature of the request will be appropriately tested.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Note requests for non-HTTPS requests is done using https!(false). Similarly,
    a multihosted application can be tested using the host! method. If your application
    has logic that depends on the subdomain, you can switch back and forth with lines
    like host!(blog.railsprescriptions.com).


    Note that unlike controller tests, integration tests do not allow you to pass
    session values into the request methods. You can set the initial state of the
    session directly via the session method, which returns a hash—so session[:user_id]=3.
    You should use this mechanism only for setting the initial state of the session
    data. During the actual test, you should let the session be implicitly set by
    the controller actions being tested.'
