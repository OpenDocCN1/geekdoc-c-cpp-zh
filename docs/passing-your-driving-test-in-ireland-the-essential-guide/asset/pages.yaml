- pgno: 19
  md: "# What’s a Test?\n\nThe individual test is the most basic unit of Rails testing.\
    \ There are two ways to define individual test in Rails, and they are functionally\
    \ equivalent. In the older style, any method whose name starts with test_ is considered\
    \ a test:\n\n```\ndef test_that_a_new_user_has_a_valid_name\n  # test logic here\n\
    end\n```\n\nIn the newer style (Rails 2.2 and up), a more declarative syntax can\
    \ be used with the method test:\n\n```\ntest \"that a new user has a valid name\"\
    \ do\n  # test logic here\nend\n```\n\nBehind the scenes, those two definitions\
    \ will result in the same test being executed. [8]\n\nYou can’t just slap a test\
    \ method inside any old class. The tests you write need to be defined inside a\
    \ subclass of Test::Unit::TestCase. Rails provides its own generic subclass called\
    \ ActiveSupport::TestCase. You’d use ActiveSupport::TestCase as the parent class\
    \ of any of your Rails tests. Rails also defines its own subclasses of ActiveSupport::TestCase\
    \ for testing controllers and integration testing."
  merge: -1
