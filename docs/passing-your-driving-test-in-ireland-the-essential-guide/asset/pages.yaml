- pgno: 159
  md: '# First Off, RJS


    In the ever fickle-about-new-tools Rails community, the rise and fall of RubyJavaScript
    (RJS) from “cool new tool for writing Ajax” to “whose usage is a slightly embarrassing
    admission that you don''t like JavaScript” seemed to happen quickly. RJS came
    along at a time when the JavaScript toolkits were so clunky that it made sense
    to make what was potentially an entire server call and write simple client-side
    commands in Ruby to avoid writing scary JavaScript. Since then, the JavaScript
    tools have made legitimate strides, the idea of unobtrusive JavaScript has spread,
    and the Ruby and Rails community has gotten more comfortable with the need to
    write more complex client-side interactions in JavaScript, all of which have combined
    to make RJS seem unneeded at best.


    That said, RJS is still nice for quick Ajax features that are inside the limited
    RJS feature set and are simple enough to not weigh the weight of an entire JavaScript
    framework, such as a dynamic update of a specific point on the page based on current
    server data. Since, RJS executes essentially as a Rails controller action, it’s
    much easier to test than JavaScript that executes exclusively in the browser.
    Also, legacy Rails projects may still have some RJS that you might want to bring
    under.


    Your weapon of choice in testing RJS is the `assert_select_rjs` method. This method
    is less like the normal `assert_select` that you might imagine. The meaning of
    an `assert_select_rjs` call depends slightly on the number of arguments the method
    is called. In what I think of the standard way of calling the method, it takes
    two arguments, the first of which is a symbol matching an existing RJS Rails method,
    and the second of which is a DOM ID.


    The DOM ID can be static, or can be calculated, as in this example:


    ```

    assert_select_rjs.replace, dom_id(@project)

    ```


