- pgno: 310
  md: '# Don’t Look Back


    It’s almost certainly worth your time and effort to cover an entire complex legacy
    application before writing any code. I love tests, but the risks involved in doing
    that much coverage at once are high, especially if the customer is expecting you
    to start working on new functionality.


    You draw a line in the sand and start working in a test-driven mode forward. One
    critical element of moving forward is to ensure that every bug is fixed by writing
    a failing test—whether unit, functional, or integration. This is a good way to
    ramp up tests on your project and allows you to organically build test coverage
    over time with relatively small risk to your deadlines or chance of breaking existing
    functionality.


    Similarly, new features must be added using a TDD process. In the beginning, this
    often requires the heightened use of mock objects, over time, the code base and
    the test coverage both improve.


    If you are like me, the temptation to clean up the entire code base at once can
    be almost overwhelming. In this situation, lie down until the feeling passes or
    you are so close to your deadline that fixing everything is no longer a viable
    option.


    Do not one thing at a time, to the extent possible. Don’t extend test coverage
    while you are adding new functionality. Do not try to clean up the code while
    you are extending test coverage (occasionally this will be unavoidable, but keep
    it to a minimum). The fewer things you have moving at any one time, the easier
    it will be to identify the culprit when things go wrong.


    Footnotes


    +   This is doubly true if you are the previous coder and coming back to fix bad
    code you write in [81] the past.


    +   [82] Again, doubly true if the previous programmer was you.


    +   [83] Well, three things, if we include the very small chance that the sales
    tax really is –300,000. Mike Gunderloy presents a simple rule for initial triage
    of legacy tests in the Rails Rescue [84] Handbook: if you can’t figure out what
    a test is doing in five minutes, delete it.


    +   [85] You really want to beware the ones with 300+ line controller methods.


    +   Some mock packages let us pass an arbitrary block as the result of the stubbed
    call, but if the [86] result we need is complicated, it’s often more readable
    to create our object.


    Of course, this is exactly the kind of flexibility that drives security-minded
