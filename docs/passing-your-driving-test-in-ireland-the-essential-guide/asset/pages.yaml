  md: 'Still, there are some odd artifacts from Rcov''s use of line coverage. The
    most potentially annoying is for fans of single-line if statements or post-statement
    if clauses, as follows:


    ```

    return nil if x

    if x then 3 else end

    ```


    Rcov will happily mark the entire line as covered, whether or not the if statement
    is actually tested in both true and false states. Again, this is more an annoyance
    than a life-or-death concern, and I absolutely would not recommend adjusting your
    code style to accommodate Rcov, but it is something to keep an eye on.'
