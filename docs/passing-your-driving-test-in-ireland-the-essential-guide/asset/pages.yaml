- pgno: 68
  md: '# Testing Models with Rails Unit Tests


    The overwhelming majority of data in a typical Rails application is accessed via
    ActiveRecord objects that connect to a SQL database. These objects are tested
    using model tests. Model tests, which core Rails calls unit tests, are the most
    basic level of the Rails testing functionality, by which I mean they are the closest
    to Ruby’s Test::Unit and the foundation on which test structures for controllers
    and views are built. Model tests in Rails are just Test::Unit plus the ability
    to set up data for fixtures; the block syntax for describing setup, teardown,
    and tests; and a couple of additional assertion methods. Model tests that you
    write are placed in the test/unit directory.[27] We’re starting our tour of the
    Rails stack with model tests because model tests have the fewest dependencies
    on Rails-specific features and are usually the easiest place to start testing
    your application. Later, we will move forward to controller testing, view testing,
    integration testing, and other Rails tools.


    # What’s in a Name, Part One


    Tests for Rails models are usually referred to as unit tests, but as much as I
    being pedantic and technical, I prefer to call them model tests. (Who am kidding,
    I love being pedantic and technical.) My basic problem is that unit test has a
    specific meaning, depending on how you look at it, either includes Rails functional
    tests or doesn’t include either kind of test. (Jay Fields, for example, argues
    that Rails model tests aren’t really unit tests because they require an external
    database.) Personally, I find it less confusing to use unit test as a generic
    term for all developer testing and model test for tests that actually validate
    Rails models.'
  merge: -1
