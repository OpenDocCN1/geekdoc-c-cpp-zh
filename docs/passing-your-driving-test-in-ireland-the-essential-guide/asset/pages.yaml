    # Creating Blank Stubs


    The most basic function of any of these packages is creating a simple stub object
    in which you can specify the return value of one or more methods. When those methods
    are called, the specified value is returned. If the methods are not called, nothing
    happens. Here’s the syntax to create a stub object that is not connected to any
    preexisting object in the application.


    # FlexMock


    ```

    stub = flexmock("name",method => result)

    ```


    # Mocha


    ```

    object = stub(method => result)

    ```


    The method/result pairs can also be specified in a block argument as shown in
    the next section.


    # RSpec


    ```

    stub = stub("name",method => result)

    ```


    # RR


    ```

    double = stub(Object.new).method { value }

    ```


    This can be abbreviated as follows:


    ```

    double = stub!.method { value }

    ```


    # Creating Stubs from Existing Objects


    Most of the time, though, you’ll want to create stubs that replace methods on
    existing objects. In FlexMock and RR, this involves calling a special method with
    the object as an argument, as in FlexMock’s flexmock(object), while in Mocha and
    RSpec, this involves calling a method of the object itself, as in object.stubs.,
    further information about the method being stubbed, and its return value, is usually
    chained after the declaration of the stub.'
