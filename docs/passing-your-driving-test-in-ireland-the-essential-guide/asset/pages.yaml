- pgno: 20
  md: '# What Goes in Test?


    Anything you want, followed by some assertions.


    When testing within Rails, the entire Rails environment is automatically loaded
    as part of test startup, any part of your Rails application along any required
    plugin or gem is available. In general, a specific test class is tied to a specific
    application class, and tests in that class exist to validate the behavior of the
    matching class. That''s good practice and is enforced by the structure of Test::Unit
    within Rails. If you find yourself testing functionality outside the class your
    test is tied to, you should probably rethink your approach.


    Inside each test, you are generally trying to do four things:


    +   Set up the data needed for the test. As a general rule, create as few data
    objects as possible for each test—it''ll make the tests run faster. If you find
    yourself creating a lot of objects, it''s often a sign you aren''t testing enough
    units.


    +   Perform the action that triggers the behavior being tested. In a Rails controller
    test, for example, it''s generally the call to a controller action. In a model
    test, it''s a call to the model method under


    +   Perform one or more assertions to verify that the behavior triggered in the
    previous step had the expected results. This usually involves making assertions
    about the state of the system after the action, although another style of testing,
    discussed in more detail in the Chapter [Using Mock Objects](https://example.com),
    makes assertions about the behavior of the application when the method under test
    is invoked. In either case, this is a step you want to take care to get right—a
    badly written assertion can leave you with a test that does not accurately reflect
    system behavior. A test that fails when the behavior is working, but one that
    passes even though the underlying behavior is broken is even worse.


    +   Tear down any data structures that need to be removed before the next runs.
    In Rails, this step is rarely needed, because most of the bookkeeping—resetting
