- pgno: 12
  md: '# When TDD Needs Some Help


    Test-Driven Development is very helpful, but it’s not going to solve all of your
    development problems by itself. There are areas where developer testing doesn’t
    apply or doesn’t work very well.


    I mentioned one case already—developer tests are not very good at determining
    whether the application is behaving according to requirements. Strict TDD is not
    very good at acceptance testing. There are, however, automated tools that do tackle
    acceptance testing. Within the Rails community, the most prominent of them is
    Cucumber; see the Acceptance Testing with Cucumber. Cucumber can be integrated
    with TDD—you’ll see this called outside-in testing or by the acronym ATDD for
    Acceptance Test--Driven Design. That is a perfectly valid and useful test paradigm,
    but it’s an extension of the classic TDD process.


    Testing your application assumes that you know the right answer. And although
    you will have clear requirements or a definitive source of correct output some
    of the time, other times you don’t know exactly what the program needs to do.
    In exploratory mode, TDD is less beneficial, because it’s hard to write tests
    if you don’t know what assertions to make about the program. Often this happens
    during initial development or during a proof of concept. I find myself in this
    position a lot when testing—I don’t know what to test until I get some of the
    view and understand.


    In classic Extreme Programming parlance, this kind of programming is called a
    spike, as in “I don’t know if we can do what we need with the Twitter API; let’s
    spend a day on a spike for it.” When working in spike mode, TDD is generally not
    used, but it’s the expectation that the code written during the spike is not used
    in production; it’s a proof of concept.


    When testing, or in other nonstop situations where I’m not sure what to test for,
    I tend to go into a “test-next” mode, where I write the code first, but in a TDD-sized
    small chunk, and then immediately write the test. This works as long as I make
    the switch between test and code frequently enough to get the benefit of having
    the code and test inform each other’s design.


    TDD is not a complete solution for verifying your application. We’ve already talked
    about acceptance tests, but it’s also true that TDD tends to be thin in terms
    of the amount of unit tests written. For one, a strict TDD process would never
    write a test that you expect to pass. In practice, though, I do all the time.
    Sometimes I often write code for potential error conditions even if I think they
    are already covered in the code. It’s a balance, because you lose some of the
    benefit of TDD by creating too many test cases that don’t drive code changes.
    One way to keep the balance is to make a list of the test cases before starting
    the tests—that way you’ll remember to cover all the interesting cases.


    And hey, some things are just hard. In particular, some parts of your application
    are going to be very dependent on an external piece of code in a way that makes
    it hard to isolate them for unit testing.'
  merge: -1
  img_proc: true
