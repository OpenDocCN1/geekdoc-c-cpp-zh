- pgno: 76
  md: "The following method can be helpful; it can be used to test any method that\
    \ extracts a set of records from the database (which means it doesn't help testing\
    \ methods that affect just, the output sort order). This method is in Shoulda\
    \ syntax and the finder method under test as a symbol, any arguments that get\
    \ passed to the method, and a block:\n\n```\nhuddle/test/test_helper.rb\ndef self_should_match_find_method(named_scope,\
    \ *args, &block)\n  should `match a find method [#{named_scope]}\n  ar_class =\
    \ self.class.model_class\n  found_objects = ar_class.objects.send(named_scope,\
    \ *args)\n  assert found_objects.any?\n    found_objects.each do |obj|\n     \
    \ assert block.call(obj)\n    end\n  end\nunfound_objects = ar_class.all - found_objects\n\
    \  assert unfound_objects.any?\n    unfound_objects.each do |obj|\n      assert\
    \ !block.call(obj)\n    end\n  end\n```\n\nThis code does three things. First,\
    \ in line 3 and line 4, it extracts the model class being tested and calls the\
    \ find method on that model class, resulting in a set of instances of that model.\
    \ Then in lines 5-8, each instance in the list of matching objects is tested against\
    \ the block and must return true to the test to pass. Just as importantly, lines\
    \ 11–14 run the block against all the instances that weren’t returned by the method\
    \ and assert that the block is false for each one.\n\nA sample usage of this test\
    \ might look like this—notice that the test is a class-level method that assumes\
    \ the user population has already been created in setup:\n\n```\ndef create_users\n\
    \  active_user = User.create(active: true)\n  inactive_user = User.create(inactive:\
    \ true)\nend\n```\n\n```\nshould_match_find_method :active_only { :active => true\
    \ }\n```\n\nThis test verifies the named scope correctly sorts the universe of\
    \ users into active and inactive groups. You don’t need to create dozens and dozens\
    \ of user objects for this test to work—you just need at least one in each category.\
    \ Creating extra objects just slows the test down. A nice feature of this style\
    \ is that the test will be relatively robust against new objects being created.\
    \ For example, if you also have fixture in your tests, any new users created in\
    \ fixtures will simply be split into the correct group and validated. The test\
    \ will continue to pass."
