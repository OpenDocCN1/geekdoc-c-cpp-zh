- pgno: 320
  md: '# Focusing Test Execution


    I admit it, being able to run one of your tests at a time is “speeding up” your
    test suite in much the same way as pushing everything to the back of your desk
    drawer is an organization plan—kind of helps for a while, but eventually you have
    to deal with the mess. On the other hand, speaking, you know, purely hypothetically,
    you may someday find yourself dropped into a project where the entire test suite
    takes twenty minutes to run, and being able to run a limited set of tests is the
    difference between finishing the feature today or just after the heat of the universe.


    Test::Unit, RSpec, and Cucumber all have different mechanisms for allowing small
    groups of tests to be run. We’ve discussed some of these methods in other chapters,
    but I want to bring them all together in one place.


    In Test::Unit, in addition to breaking the tests down by type, you have the following
    options:


    +   * Any Test::Unit file (technically, any file that requires test/unit) can
    run on its own by invoking it as a Ruby script, as in ruby-test test/unit/my_test.rb.
    This allows you to run the test from the Rails root directory.

    * Rails offers the rake test:recent task, which looks at any file that has been
    touched in the last ten minutes and attempts to run its associated test file.

    * Rails offers the rake test:uncommitted task, which looks at all uncommitted
    files and attempts to run the associated test files.


    In RSpec, most of your support for minimal test runs comes from using the rspec
    command, [94] rather than a rake task. You can give rspec a series of arguments
    that are RSpec files or directories containing RSpec files. You can filter further
    with command-line options:


    +   * -e or --example option takes text such as -e project, converts it to a Ruby
    regular expression, and runs any spec whose full description—the spec name and
    any descriptions it is nested in—matches the regular expression.

    * -l or --line_number option assumes the command is targeted at a single file,
    the argument is a number, and the spec at that line number is executed.


    In RSpec 2.0, individual specs can be decorated with metadata, which, if you are
    determined enough, can be used to limit the scope of a test run. Basically, any
    spec or description definition takes an optional, completely arbitrary hash argument
    as the last argument. For example, a spec definition might read like this:'
  merge: -1
  img_proc: true
