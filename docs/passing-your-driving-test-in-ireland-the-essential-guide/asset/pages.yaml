- pgno: 180
  md: '# Shoulda Assertions


    In addition to the context helpers, Shoulda defines a set of additional test methods
    that can make tests easy to read.


    First are a couple of methods that could be described as assertions that should
    really be in Rails core. Two that are particularly useful are ... arrays that
    contain the same elements, even if the order of the elements differs. So, the
    following test will pass:


    ```

    should "have the same elements"

    assert_same_elements([1, 1, 3, 4], [4, 1, 3, 1])

    end

    ```


    If one array contains an element multiple times, the other array must contain
    the same element the number of times.


    Also helpful is assert_contains, which takes an array and an object. The assertion
    passes if the array contains the object. If the object happens to be a regular
    expression, the assertion passes if any of the elements in the array matches the
    regular expression. The flip side is ...:


    ```

    should "contain things"

    assert_contains([1, 2, 3, 4], 2)

    assert_does_not_contain([1, 2, 3, 4], 7)

    end

    ```


    For ActiveRecord, we get assert_valid and assert_save, both of which take an ActiveRecord
    model and return true if the model is either valid or able to be saved. We also
    get assert_good_value, the basic form of which takes three arguments. The first
    argument is an ActiveRecord model, the second an attribute, and the third is a
    value. The assertion passes if the value is valid for the attribute, given the
    validations defined in the model. An optional fourth argument consists of a string
    or regular expression that causes the assertion to check that any validations
    errors do not match that argument; it limits the “good” check to a single validation
    error. The complementary method, assert_bad_value, is the exact opposite. In both
    methods, the first argument can be a class, in which case a new instance of that
    class is created and used for the assertion.'
  merge: -1
  img_proc: true
- pgno: 181
  md: "# Shoulda One-Liners\n\nShoulda is famous for its one-line test matchers, which\
    \ are powerful tests that can be expressed in a single line. In most cases, these\
    \ tests are designed to be placed inside contexts or the top-level class, not\
    \ inside should. The tests then validate conditions based on the context setup.\n\
    \nShoulda defines specific one-liners for ActionController, ActionMailer, ActiveRecord,\
    \ and ActionMailer. In earlier versions of Shoulda, these tests were effectively\
    \ class methods that started with shouldd_. Over time, however, the Shoulda switched\
    \ to a more RSpec-like matcher structure, in which these are the methods that\
    \ can be used after the more generic should or should not methods, in the following\
    \ ActionRecord test:\n\n```\nclass CalendarTest < Unit::TestCase\n  should_have_many(tasks)\n\
    end\n```\n\nNotice that the call in line 2 is not a context or a Rails test. Instead,\
    \ it generates a test that contains one assertion, namely, that the Calendar class\
    \ has_many association with the Task class.\n\nAlso, every method that can be\
    \ called after should can also be called after the method: should_not_have_many(tasks)\
    \ passes if the class does not have the association. Rather than take arguments,\
    \ many of the matchers have further methods that can be chained after them to\
    \ produce the same effect. If you're familiar with RSpec, you'll recognize these\
    \ features from the RSpec syntax. (Those of you who are not familiar with RSpec\
    \ will be after after reading the next chapter.) In fact, it's an important feature\
    \ of the Shoulda matchers that they are fully compatible for inclusion in RSpec\
    \ specifications.\n\n# Action Controller Macros\n\nThe ActionController macros\
    \ are generally designed to be used inside a context that makes a controller call\
    \ in its setup, and they validate common side effects of controller actions. The\
    \ following code sample shows the most useful ones, in a really contrived way.\
    \ This is not the complete set; check out the Shoulda documentation at http://dev.thought.com/shoulda/\
    \ for the whole shebang.\n\n```\n*\"with the index page\"\nsetup { index: index\
    \ }\n\nshould assign_to(projects)\nshould render_template(index)\nshould render,\
    \ with:layout('application')\nshould respond_with(success)\nshould respond_with_content_type('application/pdf')\n\
    end\n\nshould route(get, '/index', :action => index).to(\n  action => index)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 182
  md: "```\n\"with a redirect\" \nsetup { get_action_that_redirects }\nshould_redirect_to(:route_path)\n\
    should_set_session(user_id:nil)\nshould_set_the_flash.to(:Success/)\n\n```\n\n\
    Let's look a little more closely. First, should assign_to passes the controller\
    \ instance variable of that name to value. We can make the test more specific\
    \ with two chain methods. The method with should assign_to(:project).with(@project)\
    \ makes the assertion pass if the variable is assigned to that particular value,\
    \ which with_kind_of takes a class as an argument and passes if the assigned value\
    \ a kind_of? relationship with the class.\n\nThe should redirect_to takes any\
    \ Rails object as the argument; alternately, the method can take a block that\
    \ evaluates to a URL-like object. The should_respond_with_content_type takes a\
    \ string, which must match the MIME type exactly; a symbol, which is mapped to\
    \ a MIME type using Ruby’s standard lookup table; or regular expression, which\
    \ must match the string for the MIME type.\n\nThe should_set_session method is\
    \ analogous to should assign_to but checks the session list. The to chain method\
    \ takes the expected value in the session. The should_set_the_flash_to takes either\
    \ a string or a regular expression as its argument.\n\nThe should route is a little\
    \ special, in that it checks general routing, rather than anything specific to\
    \ the particular controller. The first argument is an HTTP verb; the second a\
    \ URL string. Remaining arguments are key/value pairs representing the options\
    \ set by Rails during the routing process. If we don't specify the controller\
    \ in the option list, Shoulda infer the controller from the name of the current\
    \ test. The to chain method contains the expected route, the expected and actual\
    \ routes are covered using the same logic as the standard Rails routing tests\
    \ described in the section Testing Routes.\n\n# ActiveRecord Macros\n\nThere are\
    \ many ActiveRecord macros, most of which are designed to run outside of a context\
    \ and check the relationships or validations of the ActiveRecord model. Again,\
    \ I’ll present sample usage of the most useful in a slightly constrained test\
    \ and put any special notes at the end:\n\n```\nclass ProductTest < ActiveSupport::TestCase\n\
    should allow_mass_assignment_of(:name)\nshould allow_value(\"123\").for(:serial_number)\n\
    should_belong_to(:company)\nshould ensure_inclusion_of(:price).in_range(0..100)\n\
    should ensure_length_of(:name).is_at_most(10)\n```"
  merge: -1
  img_proc: true
- pgno: 183
  md: '```

    should_have_and_belong_to_many(:orders)

    should_have_many(:categories)

    should_have_one(:brand)

    should_validate_acceptance_of(:agreement)

    should_validate_numericality_of(:price)

    should_validate_presence_of(:password)

    should_validate_uniqueness_of(:email)

    end

    ```


    Some general notes: remember that all of these matchers also work with the negated
    should_not method. All of the methods that would expect an error, such as should_not_allow_value,
    take an optional chain method with_message, which allows us to test the exact
    error message. In older versions of Shoulda, some of these methods took an optional
    list of arguments. That functionality seems to have been removed.


    The ensure_length_of matcher has a series of chain methods to specify the length,
    including is_at_least, is_at_most, and is_equal_to.


    # ActionMailer Macros


    Shoulda defines one matcher for testing ActionMailer behavior; it is called should_have_sent_email.
    With no chain methods, it passes if an email has been sent. One or more chain
    methods can be added on: from, to, with_body, and with_subject.


    ```

    should_have_sent_email.to("mom@mommy.com").with_subject(/laundry/)

    ```


    All the chain methods take a string, which must be an exact match, or a regular
    expression, which must match the email part in question. For from and to, the
    string or regular expression needs to match only one of the list of addresses.
    If multiple email addresses are sent by ActionMailer, all the email addresses
    must match for the entire expression to pass.'
  merge: -1
