  md: "# Stubs with Parameters\n\nThe next level in tuning the stub is to have it\
    \ different values based on the input parameters. In Mocha, this is managed using\
    \ the `with` method:\n\n```\nhuddle_mocha/test/unit/project_test.rb\ntest \"let's\
    \ stub a class again\" do\n  Project.stub(:find).with(1).returns(\n    Project.new(name=>\
    \ \"Project Greenlight\")\n  )\n  Project.stub(:find).with(2).returns(\n    Project.new(name=>\
    \ \"Project Blue Book\")\n  )\n  assert_equal(\"Project Greenlight\", Project.find(1))\n\
    \  assert_equal(\"Project Blue Book\", Project.find(2))\nend\n```\n\nIn its simplest\
    \ form, shown in the previous example, the `stub` method is called, Mocha searches\
    \ for a match between the arguments passed and the declared stubs and return the\
    \ value matching those arguments.\n\nOne thing to be careful of is that by setting\
    \ expectations tied to specific input values, you are limiting the Mocha stub\
    \ to only those input values. In other words, if we were to try `Project.find(3)`\
    \ in this test, the stub would fail—which is a counterintuitive result for a stub.\
    \ The failure triggers the following cryptic error message:\n\n```\ntest_let's_stub_a_class_again(ProjectTest)\n\
    [test/unit/project_test.rb:43]\nununexpected invocation: Project(id: integer,\
    \ name: string,\ncreated_at: datetime, updated_at: datetime, start_date: date,\n\
    end_date: date).find(3)\nsatisfied expectations:\n- allowed any number of times,\
    \ already invoked:\nProject(id: integer, name: string, created_at: datetime,\n\
    updated_at: datetime, start_date: date, end_date: date).find(2)\n- allowed any\
    \ number of times, already invoked:\nProject(id: integer, name: string, created_at:\
    \ datetime,\nupdated_at: datetime, start_date: date, end_date: date).find(1)\n\
    ```\n\nThe guts of this message will perhaps be a bit clearer after we've discussed\
    \ mocks a little bit, but the gist is: we did something Mocha didn't expect, and\
    \ Mocha doesn't like surprises.\n\nA descriptor can be attached to either return\
    \ values or raise exceptions:\n\n```\nProject.stub(:find).with(1).returns(\n \
    \ Project.new(name=> \"Project Greenlight\")\n)\nProject.stub(:find).with(nil).raises(Exception)\n\
    assert_equal(\"Project Greenlight\", Project.find(1)) { Project.find(nil) }\n\
    ```"
