- pgno: 336
  md: '# Basic Rails


    This appendix lists the steps I took to create a simple Rails application with
    Devise for user authentication. The installation instructions for other third-party
    plugins and gems are contained in the chapter where the extension is used.


    You won''t need anything for this setup other than Ruby, Rails, and SQLite3. A
    Rails 3 installation will also need the bundler gem. The Rails 3 installation
    instructions will take center stage in this chapter, and where Rails 2.x differs,
    will be noted separately.


    Let''s start with the creation of the Huddle app using the rails command. In Rails
    2.x, the initial command is rails huddle; in Rails 3.x, the command is rails new
    huddle. Here is the Rails 3 version:


    ```

    % rails new huddle

    many lines of response

    % cd huddle

    % rake db:create

    (/Users/node/Documents/prag/ntest/Book/code/huddle)

    ```


    I''m using the system generation installation of Rails because I expect to have
    multiple copies of Huddle and don''t want to have multiple copies of Rails in
    my repository. That doesn''t apply to you


    In Rails 3.x, gem management, including that of the Rails gems, is handled by
    bundler. The Gemfile in your newly created application contains a command starting
    with gem ''rails'', which ties your application to a specific Rails version. There
    is also a commented-out command if you want to use the cutting-edge version of
    Rails. We''re not going to worry about the finer points of bundler here; see http://bundler.com
    for more details.


    If you are running a Rails 2.3.x application and if you want to have Rails in
    your vendor/rails directory, run the following command:


    ```

    % rake rails:freeze:edge RELEASE=2.3.5

    ```


    Alternately, you can download the Rails release from GitHub at http://github.com/rails/rails/master
    and place it in vendor/rails.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Devise


    Devise is a Rails authentication solution that is distributed as a Rails engine,
    in which, allows for it to be added to an application with fewer steps. It''s
    also quite modular, allowing you to choose a set of authentication features that
    you might want. These steps are based on the Readme at http://github.com/plataformate/devise.


    Rails 3 and Rails 2 use different versions of the Devise gem. For Rails 3, install
    via the following:


    ```

    gem install devise

    ```


    For Rails 2, install via the older version:


    ```

    gem install devise --version=1.0.8

    ```


    In Rails 3.x, gems are managed in bundler. You need to add the following line
    to your Gemfile to get the Devise gem included:


    ```

    gem "devise"

    ```


    Devise creates its files via a generator. The Rails 3 command is as follows:


    ```

    rails generate devise:install

    ```


    And here is the command for Rails 2:


    ```

    ruby script/generate_devise_install

    ```


    In Rails 3, Devise creates an initializer file in config/initializers/devise.rb
    that has a lot of potential options that we are going to leave untouched for the
    moment. It also creates a locales file for internationalization purposes. The
    Dev generator also puts some helpful tasks into the console, which require us
    to do the following:


    +   1. Add the line config_action_mailer.default_url_options = { :host => ''localhost:3000''
    } to the file config/environments/development.rb. In a real system, we''ll need
    other lines for other environments.


    +   2. Uncomment the line root :to => "welcome#index" in config/routes.rb.


    +   3. Add the following lines to app/views/layouts/application.html.erb between
    the body tags:


    ```

    <p class="notice"><%= notice %></p>

    <p class="alert"><%= alert %></p>

    ```


    Now we can use our user model with this line. Please note that if you are building
    the RSpec version of this app, you must have included RSpec in the Gemfile before
    going any further. The section RSpec and Rails for more information.'
  merge: -1
  img_proc: true
