- pgno: 149
  md: "# Testing Helpers\n\nHelper methods are the storage attic of Rails applications.\
    \ Typically, helper modules contain reusable bits of view logic, as the logic\
    \ to control what is printed or change the display based on model data. In practice,\
    \ helper modules tend get filled with all kinds of clutter that doesn't belong\
    \ anywhere else. Worse, since the Rails mechanism for testing helpers was underpowered\
    \ and under-published, helper methods often aren't tested when they contain significant\
    \ amounts of logic.\n\nUnfortunately, helpers occupy a somewhat ambiguous place\
    \ in the Rails MVC pattern structure. Helpers are sort of in the view layer, but\
    \ they are frequently used as a conduit between views and models, or even views\
    \ and controllers. Helper tests have a lot in common with model tests—for instance,\
    \ individual helper methods can be unit-tested one at a time. However, in order\
    \ for helper methods to be properly run in a test context, at least some of the\
    \ test controller framework used for Rails functional tests needs to be loaded,\
    \ and getting the setup correct a couple of extra steps.\n\nThere is a core Rails\
    \ mechanism for testing helpers, added in Rails 2.1 or so; it's one of the best\
    \ kept secrets in the core store. (Or was of Rails 2.3, helper tests are generated\
    \ whenever you generate controllers.) You can find it in `ActionView::TestCase`.\
    \ This class creates a fake controller environment so that helpers can be loaded,\
    \ called, and tested.\n\nFor helper tests to work if you using anything before\
    \ Rails 2.3, you must explicitly require `'action_view/test_case'` either in your\
    \ `test/test_helper.rb` file or in the helper test itself. Your actual helper\
    \ test is a subclass of `ActionView::TestCase`. The Rails-generated test looks\
    \ like this:\n\n```\nrequire 'test_helper'\n```\n\n```\nclass UsersHelperTest\
    \ < ActionView::TestCase\nend\n```\n\nThe naming convention is just like everything\
    \ else in Rails: add `Test` to the end of the name of the helper module to get\
    \ the class name, and add `_test` to the filename. So, your `UsersHelper` is tested\
    \ in `users_helper_test.rb` and is declared as `class UsersHelperTest < ActionView::TestCase`.\
    \ As of 2.3, Rails places helper tests in the `test/unit/helpers` directory.\n\
    \nAt this point, you are good to go and test helper methods exactly as though\
    \ they were regular model methods (with an exception or two described in a moment).\
    \ For example, if you have the following helper module:\n\n```\nmodule UsersHelper\n\
    def display_name(user)\n  \"#{user.first_name} #{user.last_name}\"\nend\nend\n\
    ```"
  merge: -1
  img_proc: true
