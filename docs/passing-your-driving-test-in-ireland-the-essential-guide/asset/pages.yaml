- pgno: 18
  md: '# Chapter 2


    # The Basics of Rails Testing


    Let''s start at the very beginning. For Rails testing, the beginning is the set
    of tools, conventions, and practices that make up the test facilities provided
    by Rails core. The basic Rails test functionality consists of the standard Ruby
    library Test:Unit, plus the Rails standard mechanisms for placing tests in the
    project, adding data to tests, and running tests.


    All the basic features of building Rails tests are covered in this chapter. Once
    we have that foundation in place, we''ll use these features in a Rails Test-Driven
    Development process in the Chapter Your First Tests.


    # There''s Always Some Version Confusion


    Here''s the short answer to what versions of different software we''re talking
    about: by default, Rails 3.0.x, Test::Unit 1.3, and Ruby 1.8.7 (and later, RSpec
    2.x). Where Rails 2.x is substantially different, I''ll note that, for the most
    part, the differences between Ruby 1.8.7 and 1.9.2 don''t significantly impact
    the code in this book.


    We''re dealing with three separate entities that are in the process of transitioning
    between major versions. Rails is moving between the 2.x version stream and the
    3.x versions. The Ruby language version 1.9.x is coming down the pke, and a recent
    fork of Test::Unit leaves 1.3 and a 2.0 in the wild.


    To soften the deal, Ruby 1.9.2 uses a different default test library called minitest,
    which is mostly a smaller, faster replacement for Test::Unit 1.3. However, Ruby
    1.9.2 keeps a module called Test::Unit as a wrapper around minitest, for backward-compatibility
    purposes.


    For its part, Rails smooths out the difference between minitest and Test::Unit
    1.3 and adds its own features on top of both. For our purposes, we don''t need
    to worry about the difference, and to minimize confusion (too late?), I''ll continue
    to refer to that as Test::Unit. Since I''m boldly assuming you are writing a Rails
    application, I''m not going to sweat the difference between what''s in Rails and
    what''s in Test::Unit. Test::Unit 2.0 doesn''t seem to have much of a constituency
    at the moment, so I''m going to ignore it.'
  merge: -1
