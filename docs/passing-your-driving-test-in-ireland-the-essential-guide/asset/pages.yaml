- pgno: 231
  md: '# When Use Integration Tests


    The testing tools in this part of the book—Integration tests, Webrat, Capybara,
    and Cucumber—are designed to work at a level above a unit test. These tools work
    best when you use them to validate the interaction between components that are
    tested elsewhere. Cucumber, with its natural-language syntax, is ideal for cases
    in a customer or other developer is creating or approving acceptance test scenarios.
    Integration tests tend to be of more strictly as a developer tool, although Webrat
    and Capybara do make the syntax for specifying interactions much easier to write
    and read. All of these testing tools are also useful as “black-box” tests, which
    you interact with the application only via URL request and evaluate the application
    response. Black-box testing can be helpful in testing legacy code, since the tests
    are not dependent on the actual structure of the code.


    Integration or acceptance tests should be used to cover any process in your application
    that has multiple steps, is based on previously created session data, or otherwise
    crosses multiple user actions. The trick is integrating these tests into your
    TDD process. Often, integration tests at this level are either written first or
    relative to the TDD tests for a feature. When written first, they can act as acceptance
    tests and can drive coding in a TDD fashion—a failing acceptance tests triggers
    a regular TDD process to make the acceptance tests past. When written last, integration
    tests tend not to drive new code, since they are validating the interaction between
    TDD-created components that should already work.


    Rails integration tests offer by far the easiest way to test the behavior of your
    application across multiple user sessions—they offer the only easy way to simulate
    more than one user hitting the site in a test.


    [70] The implementation of redirect? is status/100 == 3. I''m torn as to whether
    that is clever or not.'
