    setup do\nme = Factory(user,:first_name => \"Noel\",\n:last_name => \"Rappin\"\
    )\nmy_project = Factory(project,user => me)\nmy_other_project = Factory(project,\n\
    :name => \"Soups Online\",user => me)\nend\n```\n\nIf you don't want the related\
