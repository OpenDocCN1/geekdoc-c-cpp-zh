  md: 'Here are two valuable tips that I''ve learned from listening to and reading
    Kent Beck:


    +   - Back out your entire most recent change since your last passing test and
    start over. This works best if you work in very small increments, but it gets
    you out of the “I know I typed something wrong, but I just can’t see it” nightmare.


    +   - Replace all the expressions in the method under test with literals—if that
    passes, put the expressions back one by one until you find the culprit.


    # Diagnostics


    I''m not a big fan of using stop-step debuggers, graphical or command-line line.
    I''ve used them when I''ve been in an IDE, but I''ve never really used the Rails
    command-line debugger. I haven''t found that it to be a great experience compared
    to having tests in which I can make assertions.


    Normally, to diagnose what''s going on in a test, I either add additional assertions
    to the test or the code print print information to the console or log via assertions,
    generally I am able to test the values of variables in more detail.


    For some reason, I see a lot of people using Ruby’s puts method to write to the
    console—I recommend p, which calls inspect the object before printing and generally
    results in more informative output. As a matter of course, I require pp in my
    test_helper.rb file, which allows me to use pp to get pretty-printed output, which
    is nice for nested data structures. Also, y gives a YAML representation of the
    output—the gem awesome_print provides the method for an extremely readable output
    of complex data structures.


    ```

    >> x = 1 => [''a'', ''b''], 2 => "c"

    >> puts x

    lab2c


    >> pp x

    {1=>["a", "b"], 2=>"c"


    >> pp

    {1=>["a", "b"], 2=>"c"


    >> y x

    ---

    1:

    - a

    - b

    2: c


    >> require ''ap''

    ```'
