  md: '# Writing Cucumber Step Definitions


    Step definitions need to be created for each undefined step. Cucumber does its
    best level to create useful step definitions for undefined runs. We can paste
    these shells directly into the features/step_definitions/users_and_projects_steps.rb
    file, at least as a start.


    As you can see from the sample, each step definition starts with a regular expression
    that defines what steps match. When a matching step is found, the block attached
    to step definition is executed. Groups in the regular expression that are, as
    always, marked by parentheses, are passed as arguments to the block, which enables
    a single step definition to match many different steps. Since we want to actually
    create a project, we need to tell Cucumber how to accomplish that:


    ```

    huddle/features/step_definitions/users_and_projects_steps.rb

    Given/a project named "(.*)\$/ do |project_name|

    @project = Project.create(name=>project_name)

    end

    ```


    This step definition matches Given a project named "Conquer The World". The regular
    expression group notation causes Conquer The World to be the argument to the block,
    and eventually, the name of a new project added to the database. Assigning project
    to @project allows the project to be accessed from other steps, though you do
    need to be careful with instance variables. Creating too many variables makes
    steps more interdependent, and as a result, it''s more challenging to reuse steps
    in multiple scenarios.


    The way I like to work using Cucumber is to go one step at a time. Define the
    step, and then add any regular tests and code needed to make the step pass.(At
    least, that''s how I like to work with Cucumber this week. It''s very flexible,
    and my workflow changes.) In other words, a failing line in a Cucumber scenario
    triggers a regular Rails in the same way that a Failing test triggers application
    code. Sometimes this means going back to Cucumber and changing the scenarios around
    it, especially when setting up the available data.


    This step already passes. Let''s move on. The next step is And the following users.
    The step definition is as follows:


    ```

    huddle/features/step_definitions/users_and_projects_steps.rb

    Given/the following users$/ do |user_data|

    User.create(user_data.hashes)

    end

    ```


    Starting with maybe the most obvious point, even though the step is actually introduced
    in the scenario with And since it''s actually part of the Given clause, we describe
    it with Given step definition.


    The body of this definition shows how to use the table data. The data comes in
    as a Cucumber object; calling hashes on the object converts the object to an array
    of hashes, with keys representing'
  merge: -1
  img_proc: true
