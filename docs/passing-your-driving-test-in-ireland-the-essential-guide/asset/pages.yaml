- pgno: 94
  md: "# Factories of the World Unite: Preventing Factory Abuse\n\nThe temptation\
    \ when converting a project from fixtures is to replicate your entire fixture\
    \ setup from factory objects. You will get some benefits: the factory object will\
    \ probably be easier to read and maintain than the fixtures, and all your existing\
    \ tests will pass be significantly slower than transactional fixtures, and you\
    \ still have the problem of global, faraway data definitions—though at least with\
    \ factories, new tests can avoid using the global data.\n\nThe way to use factories\
    \ is to create less data for each test. Create only the smallest amount of data\
    \ needed to expose the issue in each test. This practice speeds up the test, makes\
    \ the issue easy to see rather than burying it among dozens of fixtures, and makes\
    \ the correctness of the test itself easier to verify.\n\n# Factories and RESTful\
    \ Authentication\n\nThe RESTful Authentication gem, which is commonly used for\
    \ managing user logins, has a couple of mild testing gotchas when using factories.\
    \ The UserTest class generated contains a private method called create_user. If\
    \ you are using FixtureReplacement, that's a name crash with the user-generation\
    \ method automatically created from your User blueprint. In this case, you can\
    \ change the name of the method in the UserTest class, adjust the tests that call\
    \ it, and move on from there.\n\nMore generally, RESTful Authentication provides\
    \ test user accounts as fixtures. If you are trying to avoid fixtures and you\
    \ are using an older version of RESTful Authentication, then you may run into\
    \ a problem with the login_as method expects to take a symbol and look up the\
    \ user data using the fixture-based users(:symbol) method. to set a logged-in\
    \ user. Even if you convert the RESTful Authentication fixture data to a factory-based\
    \ setup method (useful if only the RESTful Authentication accounts know, encrypted\
    \ passwords), you still need to change the login_as method in lib/authenticated_test_helper.rb\
    \ to take an actual User object rather than by a symbol:\n\n```\ndef login_as(user)\n\
    \  @request.session[user_id] = user ? user.id : nil\nend\n```\n\nYou can then\
    \ use this with your factories with code like this:\n\n```\nsetup do\nlogin_as(User.make(role\
    \ => \"admin\"))\nend\"\n```"
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Managing Date and Time Data


    Calendar logic has a well-deserved reputation as one of the most annoying parts
    of a program that doesn’t actually involve Unicode. Testing calendar logic—time-based
    reports, automatic logouts, “1 day ago” test displays—can be a headache, but there
    are a couple of things you can do to simplify the time logic beast.


    # You’re Doing It Wrong


    Picture this. You’ve got a YAML file with some projects:


    ```

    runway:

    name: Project Runway

    start_date: 2010-01-20


    greenlight:

    name: Project Greenlight

    start_date: 2010-02-04


    gutenberg:

    name: Project Gutenberg

    start_date: 2010-01-31

    ```


    You’d like to test some time-based code, like might be used in a search or report
    result; this goes in test/unit/project_test.rb:


    ```

    test "reports based on start date" do

    actual = Project.find_started_in_last(time_span)

    assert_equal(3, actual.size)

    end

    ```


    Here’s the code that makes the test pass, from app/models/project.rb:


    ```

    def self.find_started_in_last(time_span)

    old_time = Date.today-time_span

    all/conditions = [["start_date > ?", old_time.to_s(db)]]

    end

    ```


    On January 20, 2010, the test passes. And on the 21st it will pass, and the day
    after....


    Six months from now, though, on June 20th, when you’ve probably long forgotten
    about this test, this data, and maybe even this project, the test will suddenly
    fail. And you’ll spend too much time trying to figure out happened, when you remember
    the date issue and realize that the January 20th project has moved out of the
    six-month time span specified in the. Of course, changing all the dates just pushes
    the problem forward and gives you time to forget all about it.


    This issue may sound silly to some, but like many of the more ridiculous examples
    in the book, this is a mistake that happened to me and can end costing a lot of
    time.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'I was young and foolish, I solved this problem by adding an optional argument
    to be passed to the method and allowing an explicit date to be used for testing.
    This was more work than was actually needed, so here are a couple of better ideas.


    # Relative Dates in Fixtures


    As mentioned in the section More Info: Getting Data into the Test, fixture files
    are evaluated as ER files before loading. For our purposes, thats helpful because
    it allows us to specify dates dynamically, like so:


    ```

    runway:

    name: Project Runway

    start_date: <%= Date.today.month %>


    greenlight:

    name: Project Greenlight

    start_date: <%= Date.today.week %>


    gutenberg:

    name: Project Gutenberg

    start_date: <%= Date.today.day %>

    ```


    With fixtures written like this, the previous test will always work, since the
    start_date of the projects will never fall out of the six-month range. (If you
    are using a factory instead of fixtures, you can do something similar in your
    factory blueprint.)


    Although this technique works quite well for keeping test data a consistent relative
    distance from the test time, it''s less helpful if you are actually trying to
    test the exact value of one of the dates—when testing, say, output display. With
    the first, static set of fixture data, you could write the following:


    ```

    test "that project dates are displayed in this goofy format" do

    assert_equal("2010 1 January", projects(runway).goofy_start_date)

    end

    ```


    This test is a lot more difficult to write if you don''t explicitly know the value
    of the project''s start_date. But keep reading.


    # Explicit Timestamps


    One trick worth mentioning when testing dates is explicitly the created_at attribute
    of your ActiveRecord model. Normally, created_at is a timestamp automatically
    generated by Rails, and it''s often for the kind of time-based reporting alluded
    to the rest of this section. Since it''s automatically created at the current
    time, you can get into some weird situations if other dates are specified in the
    past. Even without that complication, you may still need to explicitly set created_at
    to use the attribute to test-based features.


    You can set the start_date in the fixture file, just like any other attribute,
    or it can be specified in ActiveRecord:create, specified in a factory blueprint,
    or plain reset with an assignment or update method.'
  merge: -1
  img_proc: true
