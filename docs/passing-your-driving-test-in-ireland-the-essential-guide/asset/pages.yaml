- pgno: 240
  md: '# Webrat and Ajax


    Webrat has a significant Achilles'' heel when run from within Rails. It does not
    have its own JavaScript interpreter, so any JavaScript in the page you are loading,
    the link you are clicking, or the form you are filling will be quietly ignored.
    This is a limitation when trying to test an application with any kind of significant
    Ajax or JavaScript component.


    As a partial workaround, Webrat can be used to drive tests with in-browser verification
    using Selenium or Watir. You must have the tool you want to use installed, and
    you need a Rails environment set up for type selenium, meaning a database.yml
    listing and a file in config/environments. Somewhere in that environment or the
    test file, you will need the following configuration code:


    ```

    Webrat.configure do

    config.mode = :selenium

    end

    ```


    You can set the port that Selenium listens on inside that same configure block
    with the method config.application_port; avoid Selenium''s default port, which
    is 4444.


    In this configuration, Webrat will run a Mongrel server and simulate browser interactions
    via Selenium, which allows you to test your JavaScript.[74]'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Capybara and Ajax


    Capybara a slightly more advanced approach to Ajax testing. Although it still
    doesn''t support Ajax through the Rails default stack, it provides drivers for
    two tools that can run JavaScript without requiring a browser window. Capybara
    can take advantage of Celerity, which is a browser simulator running under Ruby
    (see http://celerity.rubyforge.org/), or, in the very likely event you aren''t
    Ruby, is Celerity (see http://github.com/langalex/celerity for information and
    installation details), which is designed to run in your regular test stack and
    a a Ruby/Celerity process for your JavaScript requests.


    You can change the default driver in Capybara with the line Capybara.default_driver
    = :selenium, where the valid drivers are :selenium, :celerity, :rack_test, and
    :selenium. The Rack Test driver is used for any application that the Capybara
    tests are being running, including Rails. You can override the driver for a single
    test by using a line such as Capybara.current_driver = :selenium and return to
    the default with Capybara.use_default_driver. This allows you to only specify
    the Selenium drivers for tests that actually require them. In the Chapter Acceptance
    Testing with Cucumber, we''ll see that Capybara also allows you to manage the
    drivers on a test-by-test basis in Cucumber.


    Capybara has one additional trick for managing Ajax. By definition, an Ajax call
    is is, well, asynchronous. That''s great in a web page, it means the entire page
    doesn''t wait for the result. But it''s a problem for a test, since the test doesn''t
    wait for the result. Because the test normally wouldn''t wait, assertions that
    might depend on the Ajax call having finished might fail because the test goes
    faster than the Ajax call.


    Capybara gets around this by inserting wait periods into the test. In essence,
    any Capybara query that has_css? continues to check the page until the expected
    DOM elements show up or until two seconds have passed—at which point the test
    will throw up its virtual hands in exasperation and fail. If you have particularly
    slow Ajax elements and you cannot speed them up for some reason, you can change
    the wait time with Capybara.default_wait_time = 3; the right hand-side is in seconds.


    This causes a weird gotcha when testing the removal of text. As we see in the
    section A Brief Example, Capybara provides negative methods, has_no_css?. You
    should always use the negative method, as opposed to something like !has_css?.[75]
    The reason for this is Capybara''s wait behavior. Let''s say you are testing that
    an Ajax removes a DOM element from the page. When the negative method has_no_css
    is called and the Ajax method hasn''t returned, the element may still be there,
    but the negative method knows to wait and check again for the removal of the element.
    If you erroneously use the positive method has_css?, the method will see the element
    in question is and immediately stop waiting, since the positive method''s purpose
    in life is to wait until something shows up. The bang operator would cause the
    entire assertion to fail. The lesson is that Capybara provides negative methods
    for a reason, and you should use them.'
  merge: -1
  img_proc: true
