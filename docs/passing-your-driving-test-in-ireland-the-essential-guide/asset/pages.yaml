- pgno: 187
  md: "# # Single-Line Test Tools\n\nThe assertion per test has lot of nice features,\
    \ but it can be kind of verbose, each single-line test needs its own description\
    \ string. In this section, we examine two different tools for writing more concise\
    \ one-assertion tests. One tool, Zebra, works nicely within Shoulda, while the\
    \ other, Testbed, is more of a stand-alone tool. Again, the following chapter\
    \ discusses RSpec's own mechanisms for single-line tests.\n\n# ## One-Line Tests\
    \ with Zebra\n\nZebra, by James Golick, is dedicated to the proposition that test\
    \ names are basically just comments and therefore inherently untrustworthy. With\
    \ Zebra, we can write very succinct one-line tests.\n\nInstall Zebra as a gem\
    \ putting it in the gemfile for Rails 3 (gem 'zebra'); or, in Rails 2.3, with\
    \ the following in an environment file:\n\n```\nconfig.gem 'giraffesoffie_zebra',\
    \ lib=>'zebra'\n```\n\nOnce installed, Zebra is pretty straightforward to use.\
    \ Here’s an example from within a Shoulda controller test—you can use Zebra outside\
    \ of Shoulda, but it works really nicely inside it:\n\n```\nsetup do\n  get new\n\
    end\n\nexpect { assert_response :success }\nexpect { assert_select \"form[action\
    \ *= password_resets\"] }\nexpect { assert_select \"input[name = email]\" }\n\n\
    end\n```\n\nEffectively, what we get here is an anonymous test by calling expect\
    \ with a block argument. Zebra creates regular Test::Unit tests with names based\
    \ on the context of the block. In this case, the first Zebra test will be named\
    \ test:assert_response:success; if the test fails, that’s the name we’ll see.\n\
    \nOther than that, the expect blocks behave like any other test. The code in the\
    \ block is executed after the setup; if the assertions fail or error, they’ll\
    \ be reported just like any other test. There’s no explicit requirement that the\
    \ test block be just one line, but it makes little sense to Zebra for longer tests.\n\
    \nI don’t know about you, but to me, these tests read great. They are easy to\
    \ write and easy to read. I suspect I may like Zebra even more than James Golick\
    \ does.\n\n# ## Creating Quick Case Tests with Testbed"
  merge: -1
  img_proc: true
- pgno: 188
  md: "If it is written by you, or me. Originally it was just an experiment in metaprogramming,\
    \ and I find it useful from time to time, so I've continued to use it where appropriate.\
    \ Testbed is a Rails plugin, and you can get it at http://github.com/noelrappin/testbed.\n\
    \nTestbed is useful when we need to write a series of tests that validate the\
    \ same method or series of methods for a variety of input values—in other words,\
    \ something like this, taken tests I write for extensions to Enumerable:\n\n```\n\
    test \"lowest_missing number\" do\n  assert((1, 2, 3).lowest_missing_number, 4)\n\
    \  assert((1, 2, 4).lowest_missing_number, 3)\n  assert_equal([],.lowest_missing_number,\
    \ 1)\nend\n```\n\nThat isn't horrible by any means, but it puts the assertions\
    \ in a single test, and in some it duplicates the call to lowest_missing_number,\
    \ somewhat obscuring the point of the test. And this is something of a best case\
    \ for this kind of test—if the common test feature is more than one line, then\
    \ tests get kind of verbose.\n\nTestbed allows us to put the common method in\
    \ a block and then pass each individual input as a separate test. Here’s the same\
    \ set of tests using Testbed:\n\n```\ntestbed \"should return lowest missing number\"\
    \ do\n  list.lowest_missing_number\nend\nverify({1, 2, 3}).returns(4)\nverify({1,\
    \ 2, 4}).returns(3)\nverify({}).returns(1)\n```\n\nThe testbed method takes a\
    \ descriptive string and a block. Or verify_that methods between the block and\
    \ the testbed takes a create with a name using, test_should_return_lowest_missing_number[1,\
    \ 2, 3].\n\nWhen the test is run, the arguments to verify_that are passed to the\
    \ block and then validate the value of the block argument to the test returns\
    \ method. The generic returns method can take any argument. There are also specific\
    \ methods: returns_true, returns_false, returns_nil.\n\nThe key to using Testbed\
    \ is to pass literals or simple objects to the testbed and let the block do the\
    \ heavy lifting. This example from a time-application, Testbed uses Timecop (described\
    \ in the section Timecop) to freeze a date and then creates a factory object and\
    \ calculates a resource’s anniversary in a given year:\n\n```\ntestbed \"calculate\
    \ anniversary\" do :start_date,\n  Timecop.freeze(2009, 6, 1)\n  resource = Resource.make(:start_date\
    \ => start_date.to_date)\n  resource.start_date_anniversary(year).to_s(:db)\n\
    end\n```"
  merge: -1
  img_proc: true
