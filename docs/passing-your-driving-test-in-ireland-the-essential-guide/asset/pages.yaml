- pgno: 139
  md: '# Chapter 9


    # Testing Views


    View testing is fundamentally different from testing controllers and models in
    that it’s prohibitively time-intensive to fully test the view output, and even
    when that’s accomplished, it is still hard to validate the actual in-browser look
    of the view. Not to mention that overly detailed view tests are notoriously brittle
    in the face of consistent redesign of the look of your application. Using Rails’
    tools, you are best served by trying to specify and verify the logical and semantic
    structure of your application’s output.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# The Goals of View Testing


    Successful view testing is an art—it’s hard to find the appropriate balance between
    testing so little that the tests have minimal value and testing so much that they
    break every time your HTML designer looks at them cross-eyed.


    Create a view test when you want to do one of the following things:


    +   * Validate that the view layer runs without error. This is of course the bare
    minimum that you’d expect from a view test. That said, you can save yourself some
    production deployment embarrassment if you know that every branch of your views
    actually runs.

    * Validate that the data gathered by the controller is expressed as expected in
    the view. You’ll especially want to test that any view logic dependent on the
    presence or absence of particular data works as expected.

    * Validate security-based output; for example, administrators may have links on
    pages allowing them access to edit mode. Or users may be able to edit their own
    posts but not a different user’s. And so on.


    +   * Validate the exact text or HTML markup of the response. This is susceptible
    to random breakage.


    +   * Validate the user-facing look of the site. Even if you could figure out
    a reasonable way to do this automatically in Rails, again, it’s too easily broken.
    Other tools, such as Selenium, can handle some of this testing.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Keys to Successful View Testing


    The lists in the previous section demonstrate that view testing is somewhat different
    from model or controller testing. View testing is more impressionistic than model
    or controller testing. To keep view testing manageable, you need to assume that
    the HTML keeps true to the spirit of the test. That is, if you are testing for
    the existence of an element with a DOM ID project_description, for your own sanity,
    you need to assume that the content of that DOM ID will actually be something
    related to the project description and not, say, the phase of the moon.


    With that in mind, here are some guidelines for keeping your eye on the ball when
    writing view tests:


    Try not to test for the existence of specific inner text of the HTML tags. If
    you feel the need for this kind of double-check, odds are your test is too specific.
    Testing for more general regular expression matches is useful, though You may
    be tempted to say that testing the inner text of an HTML tag is OK if you are
    testing for the exact contents of a field that you have specifically created in
    your test data. Maybe, but don''t blame me when somebody decides to add the phrase
    “date of birth” into the actual test field and you have to fix a bunch of tests.
    You know your code better than I, but I''ve seen this movie, and it rarely ends
    well.


    Instead, test views at the semantic level. Put DOM IDs on HTML tags all over the
    place and test for the existence or nonexistence of tags with the expected DOM
    IDs. Alternately, consider tagging with CSS classes that describe the semantic
    role of some output, even if the CSS class doesn''t have specific styling associated
    (for instance, giving all the data rows of a table data_row CSS class). This lets
    you verify the structure of your output without being caught up in the content.
    The extra DOM IDs also help in Ajax, CSS, and browser debugging later.


    The only exceptions to testing for DOM IDs are form elements; you can test those
    using their name attribute (which allows you to directly verify the key that will
    be in the ensuing POST call). You can even test the value attribute, at least
    sometimes.


    In addition to testing for what is in the response, testing for what is not in
    the response is very useful, especially when dealing with users who have different
    roles and therefore different output.


    # Validating HTML


    A very strong benefit of assert_select is that the method parses the HTML and
    will emit warnings if the HTML is badly formed—for example, if an end tag is missing.(Unfortunately,
    the warning message doesn''t come with a stack trace, so if a warning suddenly
    pops up in the middle of your test suite, it can be hard to track down.) For this
    reason, assert_select is valuable to run on your output even if you aren''t doing
    any other validations in the call. If you want to test for valid markup more formally,
    you can check out the html_select plugin on GitHub.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Using assert_select


    The assert_select method is a powerful and flexible method of validating HTML
    content. We use the syntax of CSS selectors to specify HTML structures to be found
    in the output. The assert_select method automatically looks at @response.body
    to find the output to test against. Once you''ve found matching structures, you
    can test for the content of the structures or the number of matches found. The
    basic structure of assert_select with slight variation in the acceptance test
    frameworks Webrat and Capybara; see the Chapter [Write Better Integration Tests
    with Webrat and Capybara]()


    The simplest use of assert_select is merely to test for the existence of a specific
    HTML tag:


    ```

    assert_select("form")

    ```


    This assertion is true if there is at least one HTML form element in the response
    body. (By the way, the tag selector must be a string, not a symbol.)


    There are three ways to make an assert_select test more specific. You can augment
    the selector using various CSS-style syntax decorations, you can specify the content
    of the tag, and you can specify the number of matching tags that should exist,
    based on the selector. Or you can do all three.


    The most complicated of these three options is to specify the content of the tag.
    If the next argument to assert_select is a string or regular expression, the assertion
    is true only if there is at least one matching HTML tag with inner content that
    matches the argument. String arguments must match the content exactly. Regular
    expression arguments must == match the contents. The following two examples both
    match `<span>Happy Birthday</span>`:


    ```

    assert_select("span", "Happy Birthday")

    assert_select("span", "Birthday/")

    ```


    If the second argument after the selector is a number or a range, the test validates
    the number of matching elements is either the exact number or in the range. In
    practice, I use this to validate that, say, a table in an index view has one row
    for each element being displayed:


    ```

    assert_select("tr", 5)

    assert_select("tr", 2.. 3")

    ```


    You can also write the tests with true and false as the second argument. True
    indicates "one or more" behavior, and false indicates there are no matching elements:
    assert_select(:form, false). A common scenario is a view in which test elements
    displays for different users. Testing for the existence of options leaves a hole
    in the tests: a view that displays all options at all times passes the tests.
    Testing the nonexistence of text that shouldn''t exists that particular bug.


    If you want to be bold and specify both text and a count, the final argument is
    a hash or some key/value pairs. The keys: text and count match the features you''ve
    already seen:'
