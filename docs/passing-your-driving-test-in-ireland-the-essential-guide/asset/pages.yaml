- pgno: 39
  md: "# # The First Test\n\nThe first question to ask is, “What do I test?” The answer\
    \ comes from your requirements. Without some sense of what your program should\
    \ be doing, it’s hard to write tests that describe that behavior in code.\n\n\
    The form and formality of your requirements will depend on the needs of your project.\
    \ In this case, you are your own client, and it’s kind of a small project, and\
    \ we don’t have space in this book for military-level precision. So, the informal\
    \ list of the first three stories in the application looks something like this:\n\
    \n+   - A user is part of a project. A user can enter his scrum status for that\
    \ project.\n\n+   - For the purpose of adding a testable constraint, let’s say\
    \ the user’s status report yesterday’s status and today’s expected work, and the\
    \ user must include text in at least one of these items.\n\n+   - Members of the\
    \ project can see a timeline of status reports. This one will get covered in the\
    \ Chapter [TDD\n\nOver the rest of this tutorial, we’ll go after these stories\
    \ one by one. Any time we add or change the logic of the application, we’ll write\
    \ a test. The exact starting point of the first test is not important (although\
    \ it’s helpful to have at least sense of where you are going); you can start with\
    \ any requirement or feature in the program that can be objectively specified.\n\
    \nOur starting point for Huddle is the need to have a status report that is created\
    \ as part of a project. The report should have all its values, including the date,\
    \ set correctly. Because I think the code for this feature might be in the StatusReportsController,\
    \ I’m going to put the test for this feature in test/functional/status_reports_controller.rb.\n\
    \n```\ntest \"creation of status report with data\" do\n  assert_difference('StatusReport.count',\
    \ 1) do\n    post :create, status_report => {\n      project_id => projects(one).to_param,\n\
    \      user_id => users(one).to_param,\n      yesterday => \"I did stuff\",\n\
    \      today => \"I will do stuff\"\n    end}\n    actual = assigns(status_report)\n\
    \    assert_equal projects(one).id, actual.project_id\n    assert_equal users(one).id,\
    \ actual.user_id\n    assert_equal Date.today.to_s(:db), actual.status_date.to_s(:db)\n\
    \    assert_redirected_to status_report_path(actual)\n  end\nend\n```\n\nLet’s\
    \ walk through this test in detail."
