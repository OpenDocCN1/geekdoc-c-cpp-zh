  md: '# # What Happens When Tests Run?


    Each time you run a test task in Rails, the following steps take place. You can
    see the entire workflow in Figure Test flow.


    ![](img/ee96ece2f92041a873deb72b056e1428_30_0.png)


    The test database, as determined by the entry with the symbol test in the config/database.yml
    file, is cleared of all data. [11]


    Based on which test task is being run, a list of test files that matches the criteria
    for the task is generated. For example, running just the rake test:functionals
    task generates a list of all the test files in test/functionals, and no others.


    Once the list of test files is created, each test file is loaded by one. Like
    any other Ruby file, loading the file causes any module or class-level code to
    be interpreted. Although it''s pretty rare to have any class-level initialization
    in a test file, you''ll sometimes have additional classes in the file'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'After a file is loaded, all the methods in the file are identified. In versions
    of Rails 2.2, a test method is any method in the test class that starts with `test_`.
    In Rails 2.2 and up, an additional test method is added that allows you to create
    tests with a more natural block syntax (`test should pass this end`). Add-ons
    also offer different ways to define tests.


    For each test method that has been identified by the test framework, the test
    method is executed. However, execution does not mean running the test method itself—the
    test framework also executes setup code before the test method and teardown code
    after the test method. Here are the steps for running an individual test method:


    +   2. Run any defined setup blocks. In versions of Rails before 2.2, there is
    only one setup method per test case. In Rails 2.2 and up, multiple setup methods
    can be declared. Note that setup blocks can be in the actual test class or in
    any parent classes or included modules. There are more details in the section
    [Setup and Teardown].


    +   3. Run the actual test method. The method execution ends when a runtime error
    or a failed assertion is encountered. If neither of those happens, then the test
    method passes. Yay!


    +   4. Run all teardown blocks. Teardown blocks are declared similarly to setup
    blocks.


    +   5. Roll back or delete the fixtures, as described in step 1. The result of
    each test is passed back to the test runner for display in the console or IDE
    window running the test. Typically, failures and errors return stacktraces from
    the offending point in the code.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Running the Rails Tests


    Rails provides several commands to run all or part of your test suite.


    The most common test to run is the Rake default testing task, invoked with either
    `rake test` or simply `rake`. The default task combines three subtasks, which
    can be individually invoked as `rake test:functional`, `rake test:units`, and
    `rake test:integration`. Each of these tasks runs any file matching the pattern
    `*_test.rb` in the appropriate directory. The command-line output looks something
    like this:


    ```

    $ rake

    (in /Users/noel/Projects/huddle)

    /System/Library/Frameworks/Ruby.framework/Versions/1.8/usr/bin/ruby

    -libtest

    "Library/Ruby/Gems/1.8/gems/rake-0.8.3/lib/rake/test_loader.rb"

    <ALL TESTS>

    .........

    Loaded suite

    /Library/Ruby/Gems/1.8/gems/rake-0.8.3/lib/rake/test_test_loader

    Started

    ....FE..E...E..E..........

    Finished in 2.138619 seconds.

    ```


    Each successful test method is represented by a dot. If a test triggers an actual
    exception or error, it''s represented by an E; it''s represented by an F. After
    the run-through, each error and failure will have a message and a stack trace.


    Rails provides two helpful but-overlooked convenience tasks for testing the files
    you are currently working on. The rake task test:recent tests any controller or
    model file that has changed in the last ten minutes and runs the functional or
    unit test. The rake task test:uncommitted works similarly on any controller or
    model file that has changed since you last committed to your source control repository.
    You must be using Subversion or Git to take advantage of the uncommitted task.


    To run performance tests, use `rake test:benchmark` or `rake test:profile`. The
    two types differ primarily in the output they present. A *benchmark test* outputs
    about five simple values for each performance run, including elapsed time and
    memory. On first run, each test also generates a CSV file for output values. Further
    benchmark tests append values to the CSV file, allowing for easy visualization
    of performance changes over time.


    A *profile test* splits the timing data for each test based on the methods in
    which the test execution takes places and returns the amount of time spent in
    each method for the purpose of determining where your application bottlenecks
    are. The output of a profile test can be either a list of methods and their data
    or a call graph associating each method with the methods that it call and the
    methods it calls.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Tests for all your plugins can be run using rake test:plugins. Individual test
    files can also be run by invoking them from the command line, as in rake test/unit/user_test.rb.
    (In recent versions of Rails, you may need to adjust your Ruby load path such
    that the require test_helper line at the beginning of the test files finds the
    test helper file.)


    If you are using an IDE such as Eclipse or NetBeans, the IDE should provide a
    command to run tests within the IDE itself—typically, this will run the rake command
    line in a console window (NetBeans) or invoke a custom test runner that essentially
    does the same thing but is prettier (Eclipse, RubyMine). The IDE should also have
    commands for running an individual test file or an individual test method.'
