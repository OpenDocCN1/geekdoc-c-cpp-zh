  md: '# Creating Model Test Data with Fixtures and Factories


    One of the most valuable ways in which Ruby on Rails supports automated testing
    is through the use of easily created data that is accessible to all the tests
    in your system, no matter when or where you write those tests. It''s sometimes
    hard for an experienced Rails programmer to remember just how exciting the YAML
    fixtures used to seem. You can just set up data once? In an easy format? And it''s
    always there? Amazing.


    Over time, the infatuation with fixtures dims a bit, but fixtures are still a
    quick and easy way to get data into your tests. In this chapter, we''ll discuss
    how to use fixtures, and then we''ll discuss the problems with fixtures. Many
    of the shortcomings with fixtures have been addressed by a variety of tools that
    use the factory pattern to create data objects. We''ll discuss those factory tools
    and how using them differs from using fixtures.'
