  md: 'TDD are much different.


    # A Historical Parallel


    What''s a Rails book without a good Franklin Roosevelt anecdote, right?


    There''s a widely told and probably apocryphal story about FDR meeting with a
    group of activists pushing a reform agenda—exactly what the group wanted to have
    been lost to history.


    Anyway, when they were done with the meeting, FDR is supposed to have said to
    them, "I agree with you. I want to do it; now go make me do it."


    Ignore for the moment the question of whether this statement makes sense as politics;
    it makes perfect sense as a test-driven development motto. Your requirements determine
    what your applications want to do. Your tests make the application do it.'
