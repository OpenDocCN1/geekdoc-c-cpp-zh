  md: '# test/helper.rb file will be declared and executed before any method in the
    actual test


    ```

    setup do

    User.create(name => "Fred")

    User.create(name => "Barney")

    end

    ```


    This is not recommended in Rails 2, because the inside of the block is evaluated
    in class context—you can initialize global or class settings, but you can''t create
    variables that are accessible from your tests. In Rails 3, the block is evaluated
    in instance context.


    There is a similar mechanism to control what happens at the end of tests. The
    teardown method has the same declaration rules as setup:


    ```

    teardown :reset_globals

    def reset_globals

    #whatever

    end

    ```


    Because Rails handles the rollback of database data in testing, it''s not all
    that common to see teardowns in Rails testing. Normally you''d use it to reset
    third-party tools outside of Rails. For example, certain mock object packages,
    such as FlexMock, require a method to be called at teardown to reset object status.


    You''re likely eventually to have one or more basic setup methods shared among
    multiple controller or unit tests. If the setup methods start to crowd out the
    test_helper.rb file, you can create a module with a module containing all the
    setup methods:


    ```

    module SetupMethods

    def setup_users

    fred = User.new(name => "Fred")

    barney = User.new(name => "Barney")

    end


    # put more setup methods here

    end

    ```


    Then the class can include the module and declare any relevant methods as setups:


    ```

    class UserTest < ActiveSupport::TestCase

    include SetupMethods

    setup :setup_users


    test "my test" do

    end

    ```'
