  md: '# Test-Driven Exploration


    Testing a legacy code base starts in earnest when there is a change to make. Often
    the first order of business on a new project is dealing with a critical bug left
    by the previous team—something that must be accomplished while preserving existing
    behavior and does not demand a dramatic refactoring of the application.


    In this case, there are two goals to getting the code under test. You will be
    able to tell when the bug has been fixed; this step involves a more or less standard
    TDD bug-fixing session with one or more failing tests isolating the bug, which
    pass when the bug is fixed. Also, you must confirm that any existing correct behavior
    hasn''t been compromised. In a project that was TDD from the beginning, you''ve
    already have this ability, but in a test-less legacy project, you need to build
    up that change.


    Generally speaking, tests against an existing system come in two flavors: black-box
    and white-box testing—the phrases far predate software testing and apply to any
    kind of test process. A black-box test is so called because it ignores the internal
    structure of the application and tests only top-level input into the system and
    the output that is returned. Conversely, a white-box test uses knowledge systems
    to explicitly test specific paths through the code.


    # Black-Box Testing with Cucumber


    We''ve already seen black-box testing of Rails applications in this book, although
    we didn''t call it that. According to our definition, a black-box test of a Rails
    application works only at the level of user input and system output, typically
    HTML. Sounds like a Cucumber test, right? Or any kind of integration test, but
    since Cucumber is outside the normal Rails code, it''s ideal for interaction with
    legacy code. The main benefit of using Cucumber against a legacy database is its
    black-box nature. The acceptance tests interact with the system basically as a
    user would. Since there is no interaction with the internal structure of the code,
    it''s possible to write acceptance tests no matter how gunky the code is.


    Cucumber can be useful in a bug situation because bugs are often specified in
    terms of the users'' actions and responses. These actions and responses are reasonably
    straightforward to translate to Cucumber, and it''s easy to recognize if you''ve
    changed the behavior. In addition, it''s not unheard of a code base also to lack
    written requirements; the acceptance tests act as baseline requirements as you
    move forward.


    It''s not all Cucumber salad, though. Acceptance-level tests are relatively easy
    to write for a legacy application but have somewhat liability. A Cucumber test
    won''t tell you where in the application you need to make the change that fixes
    the bug or adds the feature. Also, Cucumber tests tend to run slowly, so you don''t
    want them to be the only part of your test arsenal.


    # White-Box Testing'
