  md: "```\ntest \"make headline\"do\nassert_dom_equal(\"<h1 class='fred'>\nh1\",\n\
    \  make_headline { \"fred\" }\nend\n```\n\nAgain, we're taking advantage of concat\
    \ returning the final string as well as placing it into the ERb output. Be careful\
    \ when using this kind of testing: you aren't actually testing the ERb output—just\
    \ the return value of the helper method.\n\nIf that's not good enough, you can\
    \ actually test against the ERb output by taking advantage of the fact that concat\
    \ adds its text to an output buffer that you can also access in your test:\n\n\
    ```\ntest \"make headline with output buffer\" do\nmake_headline { \"fred\" }\n\
    assert_dom_equal(\"<h1 class='fred'>\", output_buffer\")\nend\n```\n\nIn this\
    \ test, the helper call places the text in the output_buffer, which is then validated\
    \ in the final line of the test. The method assert_dom_equal tests whether two\
    \ strings of HTML are equivalent even if their attribute lists are differently\
    \ formed."
