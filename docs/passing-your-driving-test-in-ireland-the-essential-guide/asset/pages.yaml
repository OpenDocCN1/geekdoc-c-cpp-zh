- pgno: 247
  md: '# Writing Cucumber Features


    Cucumber allows you to write acceptance tests for new features in a lightly structured
    natural language format and then convert those tests into executable Ruby code
    that can be evaluated for correctness. We''ll talk more about how this might affect
    your workflow in a little bit. First, let''s go through an example.


    Right now, the Huddle application doesn''t have much of a user interface. There''s
    no way to associate a user or a user''s status reports with a project, for example.
    So, let''s create one. From the Huddle root directory, run the following command:


    ```

    $ script/rails generate cucumber:feature users_and_projects

    exist features/step_definitions

    create features/manage_users_and_projects.feature

    create features/step_definitions/users_and_projects.steps.rb

    gsub features/support/paths.rb

    ```


    In Rails 2.x, the initial command is script/generate_feature.


    The Cucumber generator gives you a feature file where you put the actual Cucumber
    code[77] and a Ruby file where you put the step definitions that bridge the gap
    between Cucumber and your Rails application. There''s also some boilerplate code,
    which is useful if you are trying to do acceptance test for basic CRUD functionality.
    (We are not, so I''m deleting it all.) There''s related boilerplate in the step
    definition file that''s going away as well.


    Instead, I''m describing the feature file I want. A Cucumber feature starts with
    a header:


    ```

    huddle3/features/manage_users_and_projects.feature

    Feature: Add users to project

    In order to make this program even minimally usable

    Pretty much everybody on the planet

    wants to be able to add users to a project

    ```


    This is strictly for humans. The only Cucumber requirement in version 0.7 and
    up is that the first line of the file (“real”) line means not a comment and not
    a tag) must start off with the keyword Feature. Earlier versions of Cucumber have
    no constraints on the header.


    After the header, there''s an optional background section.


    ```

    huddle3/features/manage_users_and_projects.feature

    Background:

    Given a project named "Conquer The World"

    And the following users

    | login email | password|password_confirmation |

    | alpha alpha@example.com alpha1 | |

    | beta | beta@example.com beta1|beta2 |

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The Background line is indented-in with the Order lines, meaning that it’s
    two spaces—Cucumber uses the indentation to infer structure, similar to Python
    or YAML. The Background statements are analogous to a startup block and are evaluated
    before each scenario is run. We''ll walk through the details of the statements
    in the background in just a moment.


    An individual unit of a Cucumber feature is called a *scenario*. I''ve defined
    two. The first goes to the edit page for a project:


    ```

    huddle3/features/manage_users_and_projects.feature

    Scenario: See user display on edit page

    Given that user "alpha" is a member of the project

    When I visit the edit page for the project

    Then I should see 2 checkboxes

    And the "alpha" checkbox should be checked

    And the "beta" checkbox should not be checked

    ```


    And the second goes to what happens when the edit form is actually submitted:


    ```

    huddle3/features/manage_users_and_projects.feature

    Scenario: See users in project edit

    Given I am on the edit page for "Conquer The World"

    When I check "alpha"

    And I press "Update"

    Then I am taken to the show page for "Conquer The World"

    And I should see "alpha@example.com"

    And I should not see "beta@example.com"

    ```


    A Cucumber scenario has a basic structure with three parts: *Given*, which indicates
    a precondition to the action; *When*, indicating a user action that changes the
    state of the application; and *Then*, verifying the result of the state change.
    A line beginning with *And* belongs to its most immediate predecessor clause.
    For the most part, though, the distinction between *Given*, *When*, and *Then*
    is for the humans; Cucumber does not require the steps to be in a particular order,
    nor is the Given/When/Then header used to determine which definition is matched.


    Obviously, the items in the *Background* clause are all expected to be *Given*.
    For the rest of each clause, that''s pretty much free-form; it''s the step definitions
    give those structure. Oh—the thing that looks like a table in the *Background*
    clause. Guess what? It''s a table, and that''s the preferred method of defining
    a set of data for a Cucumber feature, rather than using fixtures or factories.


    As it happens, this feature can be executed right now, using the command `rake
    cucumber`. At the moment, we must commit the `before_filter :require_user` line
    in `app/controllers/application_controller.rb`. (We''ll see how to handle logins
    from Cucumber in the section [Login and Session Issues with](https://example.com))
    Running the features is not going to do much yet.'
