  md: '# Comparing Mock Object Libraries


    Now we''ve spent some time exploring how mock objects work using Mocha, let''s
    take a brief look at the various ways that the other popular Ruby mock libraries
    manage similar tasks. There are four packages that are currently popular:


    FlexMock


    This is the original Ruby mock object package.


    Mocha


    We''ve already discussed this at some length. It''s quasi-official for Rails in
    that it is used in Rails core..


    RSpec


    The RSpec library, described in more detail in the Chapter RSpec, defines its
    own mock object package


    RR


    Pronounced "Double Ruby," it''s the newest entry, with a more concise syntax than
    the other packages and unique advanced features.


    This is a quick tour of common features and not a complete look at each of these
    packages. Check the documentation for all the details and quirks—RR, in particular,
    has features that don''t map to the other tools.


    # Loading into Test Suite


    The first part of using any of these packages is installing and integrating with
    Test::Unit. The RSpec mocks, of course, can''t be integrated with Test::Unit;
    however, any of the other packages can be integrated with RSpec by adding the
    line config.mock_with rr or :flexmock, or :mocha in the spec_helper.rb file.


    FlexMock


    ```

    % sudo gem install flexmock

    ```


    Then, in test_helper.rb, add this:


    ```

    require ''flexmock/test_unit''

    ```


    Mocha


    ```

    sudo gem install mocha

    ```


    Then, in test_helper.rb, add this:'
