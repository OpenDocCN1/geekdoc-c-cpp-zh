- pgno: 138
  md: '# Coming Up


    In this chapter, we covered how to simulate controller actions for test purposes.
    Next, we’re going to run through other user-facing parts of the Rails stack. The
    next chapter will talk about view testing and when you might need it. After that,
    we’ll discuss helpers; nearly every Rails application I’ve ever seen has untested
    helpers, and we’ll show some ways to tackle them. In the following chapter, we’ll
    close with an example of how to integrate JavaScript Ajax testing with Rails test
    suite.


    Footnotes


    Before I let go of the naming topic entirely, why is it *ActionController* and
    *ActionMode*, but [43] *ActiveSupport* and *ActiveRecord*?


    If you are heavily into contexts, then the simulated call can go into the context.
    See the section [44] Contexts for a look at this structure.


    There are about 50 different status codes; the entire list can be found in the
    Rails source in [45] actionpack/lib/action_controller/status_codes.rb.


    Prior to Rails 2.2, there was a method that you follow a redirect from a test,
    but only within [46] the same controller. It was deprecated in Rails 2.2.


    One thing to note about cookies: in Rails 2.3 and up, cookies in controller tests
    are just strings. In previous versions, you could also specify them as [47] CGI::Cookie
    objects if you wanted to test cookie attributes. It doesn’t seem like you can
    test cookie attributes in Rails 2.3 without manually accessing the request header.


    [48] Spies can also be added to Mocha using an extension gem called Bourne.


    [49] You can also choose to post-process the returned result, though an obvious
    use case doesn’t leap to mind.'
  merge: -1
