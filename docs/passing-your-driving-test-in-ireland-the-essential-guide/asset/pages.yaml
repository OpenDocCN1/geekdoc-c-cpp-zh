- pgno: 74
  md: '# # Asserting a Difference, or Not


    The two assertions adds to the basic unit test are powerful replacements for a
    common test pattern. The following test asserts that after a create call, there
    is one more user than there was previously:


    ```

    test "creating a user" do

    pre = User.count

    User.create(first_name => "Noel")

    post = User.count

    assert_equal(pre + 1, post)

    end

    ```


    With assert_difference, the test can be written without the duplicate call to
    User.count:


    ```

    test "creating a user" do

    assert_difference ''User.count'' do

    User.create(first_name => "Noel")

    end

    end

    ```


    The first argument to assert_difference is a string of Ruby code. The value of
    the string is calculated by eval. The code inside the block is executed, and the
    value of the string is re-calculated. By default, the expectation is that the
    new value will be more than the old value, but you can adjust this by passing
    in a second argument, such as assert_difference(\User.count", 0), in order to
    not change, or assert_difference(\User.count", -1), to assert the removal of a
    user.


    If you''d like to check multiple code snippets, you have two options. The calls
    to assert_difference can be nested:


    ```

    test "create a user and a log entry" do

    assert_difference ''User.count'' do

    assert_difference ''LogEntry.count'' do

    User.create(first_name => "Noel")

    end

    end

    ```


    Or, if the difference number is the same for all the snippets, the snippets can
    be passed in a list:


    ```

    test "creating a user" do

    assert_difference [''User.count'', ''LogEntry.count''] do

    User.create(first_name => "Noel")

    end

    end

    ```


    Finally, assert_no_difference("User.count") is syntactic for assert_difference("User.count",
    0).'
  merge: -1
