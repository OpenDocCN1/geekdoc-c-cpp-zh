    executed, but any failure there is treated as a “pending” result, rather than
    a failure result. However, if the code in the block actually passes, you''ll get
    a failure that effectively means, “You said this was pending, but lo and behold,
    it actually works. Maybe it’s not actually pending anymore; please remove the
