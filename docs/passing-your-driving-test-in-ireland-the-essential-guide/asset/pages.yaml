- pgno: 153
  md: "# Using assert_select Helper Tests\n\nThe output buffer is kind of neat, but\
    \ would be even nicer if you could bring the full flexibility of assert_select\
    \ to bear on the output. Under normal circumstances, assert_select looks to @response.body\
    \ to get the text to parse. There are two ways to work around this. You can fake\
    \ a @response.body object, or you can point assert_select at an arbitrary string.\n\
    \nThe arbitrary string mechanism is perhaps simpler—include the following method\
    \ in your test/test_helper.rb.\n\n```\ndef assert_select_string(string, *selectors,\
    \ &block)\n  do_root = HTML::Document.new(string).root\n  assert_select(do_root,\
    \ selectors, &block)\nend\n```\n\nThis method creates an HTML selector of the\
    \ kind that Rails accepts as the selector first argument of assert_select. Using\
    \ this method would look like this:\n\n```\ntest \"make headline with response\
    \ body\" do\n  assert_select_string(display_name(user)) \"div.first_name\"\nend\n\
    ```\n\nIn other cases, you might want to have a more complete controller setup,\
    \ where you are testing logic. You might also want to call assert_select directly.\
    \ If so, you can add the controller setup easily. Please place it somewhere, then\
    \ instead of action_view/test_case:\n\n```\nhuddle/helper/test_case.rb\nrequire\
    \ 'action_view/test_case'\n```\n\n```\nmodule ActionView\n  class TestCase\n \
    \   def setup_response\n      @output_buffer = \"\"\n      @request = ActionController::TestRequest.new\n\
    \      @response = ActionController::TestResponse.new\n      @session = {}\n \
    \     @request.session = @session\n    end\n\n```\n\n```\ndef session\n  @request.session\n\
    end\n```\n\n```\ndef make_response(text)\n  @response.body = text\nend\n```"
  merge: -1
  img_proc: true
- pgno: 154
  md: 'This adds a TestResponse object; it also gives you session object, if you need
    that for testing. The new class also has a make_response method, which takes arbitrary
    text and slaps it right into @response.body for you. All you need to do is call
    make_response with whatever text you want to assert:


    ```

    test "make headline with response body" do

    make_headline { "jed" }

    make_response_output_buffer

    assert_select("h1.headline")

    end

    ```


    I''m not prepared to defend this as the most elegant way to get assert_select
    into your helpers, but it does work. This mechanism probably results in more readable
    tests for block helpers or for nested assert_select calls. Note that the ActionView::TestCase
    creates its own new TestResponse object every time you call a helper method—so
    if for some odd reason you have a test that depends on the @response object in
    a helper, you could run into problems with the response object not holding values
    from helper call to helper call.


    # Gotcha: url_for


    Although all core helpers are automatically loaded into the ActionView test environment,
    there are one or two that have significant dependencies on the real controller
    object and therefore fail with opaque error messages during helper testing. The
    most notable of these is url_for. One counteract is to override url_for by defining
    it in your own test case (the method signature is defurl_foroptions = {}). The
    return value is up to you; I find a simple stub response is often good enough.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# # How Much Time Should You Spend on Helpers?


    The amount of time you spend testing helpers really depends on the helper or,
    more generally, how you use helpers. If you have a lot of view logic in helpers
    and they are shading toward being presenters of one kind or another, it''s a good
    idea to validate any complex logic. Simple HTML methods, like the make_headline
    example here, don''t require a lot of testing (certainly not if the testing is
    bogging you down). However, if you do find a bug in a helper, pull the method
    into the garage and cover it with tests.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# When to View Test


    It''s important to test view logic in a considered, careful way. In all TDD, any
    change to the logic of the program should be driven by a test. Although you shouldn''t
    have the bulk of your logic in the layer, you''ll need to have some logic surrounding
    display, and that should be tested.


    However, complex view logic should be moved to helpers.[51] which are easier to
    test; see the section Testing Helpers. A strict TDD process often breaks down
    a little in the view. View programming sometimes feels more explorative to me,
    so I usually do a little bit of view code and then cycle back to write a test.
    As the feedback between test and code is relatively tight, the process won''t
    hurt you. View testing can also be managed in an integration test layer using
    Cucumber (see the Chapter Acceptance Testing with Cucumber) or Rails integration
    tests; see the Chapter Testing Workflow with Integration Tests. Find the workflow
    that works best for you.


    Remember that you need to include Action::Helpers::RecordIdentificationHelper
    in order to use [50] dom_id in your test class.


    A number of third-party tools enlarge the helper concept to a full-fledged object
    called a [51] Presenter, which effectively mediates between a view and one or
    more models.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Chapter 10


    # Testing JavaScript and Ajax


    I''ve had this conversation more than once:


    ME:

    What test tools do you use?


    SOMEBODY ELSE:

    Oh, you know, Shoulda, factory_girl.


    ME:

    Do you test your views?


    SOMEBODY ELSE:

    Sometimes. When necessary.


    ME:

    How do you test your Ajax?


    SOMEBODY ELSE:

    [With sad resignation] We don''t.


    To be fair, sometimes the roles are reversed, and it''s me observing that we don''t
    test our JavaScript.


    And really, can you blame me? Testing JavaScript and Ajax is a pain. For one thing,
    JavaScript is frequently, well, written in JavaScript. It''s a nice language,
    but it has not historically ever near the level of test framework support and
    commitment as Ruby. [52] Not only that, but Ajax actions often happen in the browser.
    The actions are difficult to extract for a user test if they exist only in the
    view layer. Then there''s the whole browser dependence thing. It''s hard to blame
    somebody for chucking the whole testing and just writing the code.


    Yet, as application logic moves to the browser to create cool and useful user
    experiences, leaving that code untested a bigger and bigger risk. In this chapter,
    we''ll walk through some strategies and tools for testing JavaScript and Ajax
    from within a Rails application.


    This is not meant to be a complete guide to all possible JavaScript tools; we
    simply don''t have the space for that. The tool structure that is outlined in
    this chapter is one that I''ve had some success with and I think you can be successful
    with as well. The advantage of the tool chain'
  merge: -1
  img_proc: true
- pgno: 158
  md: described in this chapter is that it allows you to test your Ajax both in the
    browser and as part of your regular command-line Ruby testing. Outside your Rails
    application, you should also consider browser-level acceptance tools like Selenium
    as a way to test your web application as a whole.
  merge: -1
