- pgno: 127
  md: 'Rails-generated testers are subclasses of ActionController::TestCase, itself
    a subclass of the ActiveSupport::TestCase used for model testing.[43] All the
    features available for model testing are still present in controller and view
    testing. In addition, additional tools are added to ActionController::TestCase
    via a few modules that are mixed into it. This is what is at your disposal:


    +   - Three instance variables are the mock object versions of the @controller,
    @request, and @response. Functionality that would require a real user request
    or client browser is stubbed out. My experience is that I don''t use those directly
    a whole lot, except for @response.body, which is helpful for view testing and
    debugging by inspecting the body text inside a test method.


    +   - Four pseudo-hash variables representing control structures. You have session,
    cookies, and flash, each of which represents the Rails construct of the same name,
    such as session[:user_id]— the cookie variable has string keys, not symbol keys.
    And you have assigns, which allows access to any instance variable set in the
    controller method so that, say, @user in the controller method can be verified
    in the test by using assigns(:user). You''re supposed to access that as a method
    and not as a hash—assigns[:user] won''t work (but assigns["user"] will...).


    +   - A method to simulate each HTTP verb for the purpose of pretending to call
    a controller: get, post, delete, plus the bonus xhr for Ajax calls.


    +   - Seven assertions at the specifics of controller and view testing, the most
    valuable of which will be covered in more detail in the Chapter Testing Views.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# What to Test


    The controller part of controller tests is generally straightforward. If you are
    following good development practice, the complicated functionality is in the model
    and is being tested in your model tests; one of the reasons this a best practice
    is that models are easier to test. Views, which are genuinely a pain in the neck
    to test, we''ll cover in the Chapter [Testing Views].


    A controller test should have one of the following goals:


    +   1. Verifying that an normal, basic user request triggers the expected ActiveRecord
    calls and passes the necessary data to the view.


    +   2. Verifying that an ill-formed or otherwise invalid user request is handled
    properly, for whatever definition of “properly” fits your app.


    +   3. Verifying that your security roles work as expected, such as requiring
    logins for pages as needed and testing that users who enter a URL for a resource
    they shouldn''t be able to see is blocked or diverted. These tests often have
    a view component: admins see a Delete button, but nobody else should should.'
  merge: -1
  img_proc: true
- pgno: 129
  md: "# # Simulating a Controller Call\n\nThe general structure of a controller test\
    \ includes a setup method that puts the data and session context in place and\
    \ an individual test method that simulates a call to the controller and validates\
    \ the controller response. [44] The most simplified version of this structure\
    \ looks something like this:\n\n```\nsetup :generic_setup\n\ndef generic_setup\n\
    \  @task Task.create\n  login_as :admin\n  end\n\ntest \"should show a task\"\
    \ do\n  get :show,id => @task.id.to_s\n  assert_equal(@task, assigns(task))\n\
    \  assert_response :success\n  assert_template :show\nend\n```\n\nRails provides\
    \ a test method for each HTTP verb: get, post, put, and delete. Each of these\
    \ methods works the same way. The first argument to the simulated call is the\
    \ controller method to invoke. The second argument contains the key/value pairs\
    \ that become the parameters of the call. The Rails conventions for placing complex\
    \ data into parameter names holds so, :task => {:project => {:id => \"3\"}} creates\
    \ params[:task][project][id] = \"3\"\n\nIn most cases, the parameters argument\
    \ is the only one passed to the controller and so is written as a list of key/value\
    \ pairs rolled into a Hash. However, there are optional third and fourth arguments\
    \ to test these methods that set hashes for the session, respectively. In the\
    \ following snippet, the session is getting a user ID and current project, and\
    \ the flash is getting a notice:\n\n```\nget :show,id => @task.id.to_s, {:user_id\
    \ => \"3\"}\n  current_project => @project.id.to_s, {:notice => \"flash test\"\
    }\n```\n\nThe xhr simulates an Ajax call to the controller. The signature of the\
    \ method is a little different; the first argument is the HTTP verb, the second\
    \ is the controller method, and the remaining arguments match the order of the\
    \ other HTTP mimic methods:\n\n```\ntest \"my ajax call\" do\n  xhr :post, :create,\
    \ task => {:id => \"3\"}\nend\n```\n\nThe controller will respond to a test call\
    \ with xhr exactly how it would respond to an actual Ajax request. To say that,\
    \ if you use the more modern respond_to blocks, then the request will match the\
    \ format.js block. Alternately, the controller method xhr? will return true for\
    \ the action being tested."
  merge: -1
  img_proc: true
- pgno: 130
  md: 'You there get gotchas in simulating controller calls. The first is that the
    controller method is called directly without working through the routes. This
    means the test is not verifying the method in question is actually reachable using
    the given HTTP verb—that can be done via a separate routing that we''ll cover
    in the section Testing Routes. This can be particularly annoying for RESTful controllers,
    where the HTTP verb is salient, and the test can mask a potential issue by using
    an unexpected HTTP verb without catching the problem.


    I get scared by this trap when testing the intersection of Ajax and REST If the
    method called via Ajax in the previous example actually doesn''t expect an HTTP
    POST (for example, it''s a standard RESTful edit method), the test passes, but
    the code fails in the browser.


    Another distinction between the test environment and the real request is that
    request parameters are always strings, whereas these test invocations do not convert
    the key/value values to strings before calling the controller method. Under many
    circumstances this isn''t a big deal—if you are just doing, say, a find on an
    ID parameter, ActiveRecord does the right thing regardless. However, if you are
    depending on an exact match of the variable (for example, directly comparing the
    parameter to ID), the type may matter, and you might have a test that passes in
    the test environment, while the code in the browser fails.


    This may become an issue in security testing. If the controller looks like this:


    ```

    def create

    if current_user.id == params[:id]

    # allow

    else

    # deny

    end

    ```


    and the test looks like this:


    ```

    test "I can create"

    login_as(@user)

    put :create, @user.id

    hassert that allowed branch was taken

    nend

    ```


    the test will pass because params[:id] in the test is an integer, but the create
    will fail in the browser because it will be a string. The workaround is to ensure
    that the test values are converted to strings in the test. One recommendation
    is to use @user.to_param as the argument to put; this method is preferable to
    the @user.id.to_s because it gives you some flexibility if you override the to_param
    method later.


    # Testing File Uploads'
  merge: -1
  img_proc: true
