    work around this issue. But there are definitely cases where the cost of testing
    a feature like this is higher than the value of the tests. To be clear, I don''t
    think that is a common occurrence, but it would be wrong to pretend that there''s
    never a case where the cost of the test is too high.


    # Words to Live By


    | Any change to the logic of the program should be driven by a failed test.

    | A test should be as close as possible to the associated code.

    | If it''s not tested, it''s broken.

    | Testing is supposed to help for the long term. The long term starts tomorrow,
    or maybe after lunch.

    | It''s not done until it works.

    | Tests are code; refactor them too.

    | Start a bug fix by writing a test.|'
