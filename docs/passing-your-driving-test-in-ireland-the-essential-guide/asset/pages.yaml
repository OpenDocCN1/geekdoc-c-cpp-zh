- pgno: 37
  md: '# Chapter 3

    Writing Your First Tests


    You have a problem. You are the team leader for a development team that is distributed
    across multiple locations. As an agile development team, your project has a daily
    stand-up meeting, sometimes called a scrum, where everybody briefly describes
    what they did yesterday, what they plan on doing today, and if anything is blocking
    them from getting their work done.


    However, since your team is geographically distributed, you need to do these scrums
    via email. That’s not the worst thing ever, but it does lead to annoying email
    threads, and I think we can all do better with a little web application magic.
    Let’s create an application called Huddle, which will support entering and viewing
    these daily status messages.


    Since you are a Rails developer who wants to use test-driven methods, the first
    thing you should ask is, “What do I test?” Test-driven developers start an application
    by writing tests. In this spirit, we’re going to initiate our tour of Rails by
    writing lists of tests. Specifically, we’re going to go through the first few
    test-driven feature cycles of the Huddle application to give you the feel of Test
    Driven Development (TDD) using Rails.


    We’ll use a hands-on approach and walk through the specifics of how to write your
    first tests. We’ll talk about how the practice of working “test first” improves
    development, but more importantly, we’ll show what working in a test-driven style
    looks like. This chapter uses the testing tools that are available in core Rails
    and will be limited to common tasks such as creating and submitting a web form.
    At the end of this chapter, you should have a good sense of how TDD development
    works in Rails, and you’ll be ready to explore the third-party tools and more
    detailed topics in the rest of the book.


    The Appendix Sample Application Setup, contains the steps for creating the skeleton
    application we’re starting with—including the initial setup, creation of Rails
    scaffolds, and Devise for user authentication, and other things that are necessary
    to the application but besides the point for our tutorial. If you’d like to start
    at the same place, the code samples for this chapter are available for download
    at http://www.pragprog.com/titles/ntest/source_code. The code for this application
    was written and tested with Rails 3.0.[16]


    We’re going to do this in a reasonably strict test-driven style, meaning no new
    logic will be added to the application except in response to a failing test. We’ll
    be a little more lenient with view code. We’re assuming a basic understanding
    of standard Rails concepts; in other words, you don’t need to be a total controller.
    For the moment, we’re also going to limit ourselves to test tools'
