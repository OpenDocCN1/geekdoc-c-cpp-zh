- pgno: 303
  md: '# Dependency Removal


    Dependencies are the single most challenging issue in legacy testing. Perhaps
    greatest virtue of well-done TDD code is that the tests force individual pieces
    of the code to be independent of each other. Without tests, legacy code has a
    tendency to be highly interdependent. This makes adding tests difficult in several
    ways: multiple objects might need to be created to test a single method; or it
    might be hard to limit a test to a true functional unit, if that unit is hard
    to reach or encased in some massive 300-line method. There are ways, though, to
    have the code we need to be codependent no and separate enough to enable the tests
    we must write.


    # Keep It Separate, Stranger


    Maybe the easiest way to keep our new code from being dependent on legacy code
    is to separate it ourselves. Where possible, write new code in new methods or
    new classes, and merely call them from the existing legacy mess. In theory, this
    leaves our new code unencumbered enough to be written via TDD.


    Let''s a brief example. Consider a possible and kind of messy method from a social
    networking site called Flitter:


    ```

    class Flit

    def process_flit

    if text =="testing: remove this code after 3/10/08"

    flit.text

    end

    if text.ends_with?("%f%b")

    send_to_facebook

    else if user.flits_in_last_day > 423

    return

    end

    flit_server.check_for_mentions(self)

    flit_server.follower_list(user)

    user.update_attributes(flit_count => user.flit_count + 1)

    # and so it goes...

    end

    end

    ```


    Within this tangled mess, we must add a new feature: if a flit contains text of
    the form Username, the user in question must be informed of the message. We could
    just add another statement in the line code of if statements already in the method,
    but then it''s very hard to test the new behavior without testing all the process_flit
    apparatus, which brings in all kinds of stuff. In real life, this method could
    be 300 lines, and for all know it could invoke PayPal. Instead, we add the code
    check_for_dollar_sign to the method in the appropriate place and write the new
    method using regular TDD. If we are feeling adventurous and it seems plausible,
    a mock test to confirm that process_flit calls check_for_dollar_sign might also
    be appropriate.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'or extracting a lot of functionality, we might consider creating our own separate
    class, rather than just a method. One sign that a new class is warranted is it
    passes the same set of instance variables to multiple methods. I''m a big fan
    of classes that represent processes and replace long complex methods. For testing
    purposes, moving new code to a new class can make testing the new code easier,
    because the new code is less dependent on the application.


    Although this technique helps us make a clean break from the legacy code, it has
    the short-term effect of making the code more opaque. In the words of Michael
    Feathers, “When you break dependencies in legacy code, you often have to suspend
    your sense of aesthetics a bit” (From Working Effectively with Legacy Code[WEWLC]).
    To put it another way, you know when you''re cleaning off your desk, have an intermediate
    stage in the room which is covered in piles of paper, and it looks like an even
    bigger mess? Or is that just me? In any case, we''re in an intermediate state
    here, between the undifferentiated mass of the original to the nicely factored
    and organized new version. Building up the test suite one broken dependency at
    a time moves us steadily toward cleaner code.


    If our legacy application has only a nodding relationship with Rails common standards,
    chances the database is also a mess. Many issues that plague a legacy database
    can be frustrating (such as naming conventions or unusual use of ActiveRecord
    features), but they don''t affect your ability to test the features.


    We need to be careful if the database has added constraints that are not evident
    in the code. Typically, this involves column constraints that go beyond any validations
    in the ActiveRecord model or foreign key constraints that are not specified anywhere
    in the Rails code. Foreign key constraints are hard to deal with. Rails has no
    native mechanism for specifying foreign constraints, but they are believed by
    database admins over the world.


    From a testing perspective, the problem is twofold. First, there is business logic
    outside the Rails code and in the database that is hard to find, test and change.
    Worse, foreign key constraints add dependencies that require certain objects to
    be created. In a test environment, where kind of dependency leads to mysterious
    bugs: the database doesn''t let you create test data, and objects that need to
    be created that have nothing to do with the test but are only there to make the
    database happy. It''s something to keep a close eye on in a legacy application
    created by a database-heavy development team that didn''t trust ActiveRecord.


    # Using Mock Objects to Remove Dependencies


    If you don''t want to start off at 20,000-feet with acceptance tests, mock object
    testing is another way to get tests started without disrupting the untested code.


    In a legacy context, the advantage of using mock objects is their ability to isolate
    a single class and method from the rest of the application by creating a mock
    or stub for any other method called from the method being tested. When working
    with a legacy application, this allows us to temporarily put aside the how shaky
    shake the rest of the application may be and focus on the single part we are trying
    to figure out at that very moment. Similarly, factory objects make it easy to
    specify data as needed to easily isolate a legacy method.'
  merge: -1
  img_proc: true
