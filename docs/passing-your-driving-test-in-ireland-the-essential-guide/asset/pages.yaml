    fixture_file_upload to help. It takes two arguments: a path to an actual file
    relative to the Rails root and a MIME type. You use this as the value part of
    key/value pair being passed to a Rails method in a controller test, as in post
    :upload_icon, :icon => fixture_file_upload(''/public/images/test_icon.png'', ''image/png'').
