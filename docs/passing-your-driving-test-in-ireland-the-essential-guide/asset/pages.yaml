  md: '```

    does something cool` => true

    end

    ```


    # Your Spec Here


    In RSpec 2.0, there is no way to use these properties from the command line—the
    feature is planned for a later release, after some feedback in how people might
    use the metadata that has been received. However, you can go in the spec.helper
    method and filter a test run on this data. Using RSpec.configure block, you can
    add a line like one of these:


    ```

    c.filter_run => true

    c.filter_run_excluding.cool => true

    ```


    Using filter_run causes only specs or contexts with metadata matching the key/value
    argument to run. Conversely, filter_run_excluding runs all the specs except those
    that match the key/value argument. The value argument of the key/value pair can
    be a lambda instead of a static value, which allows you to filter-at based on
    runtime environment information.[95]


    Although the lack of command-line support makes this feature a little awkward
    to use, there are two things you can do to help. One is the run_all_when_everything_filtered_attribute,
    which like it says on the label, changes RSpec''s behavior so that if the described
    blocks filter every test, RSpec will run all the tests. In other words, you could
    do something like this:


    ```

    c.filter_run:in_progress => true

    c.run_all_when_everything_filtered = true

    ```


    Now, if there are tagged specs as in_progress, those specs will be Run. But if
    there are no such tags, as specs are filtered, and the second line, RSpec then
    runs all the tests. This keeps you from having to continuously change the RSpec
    config to have some focused testing.


    You can also simulate command-line support by making the filter use the value
    of an environment variable you may set at the command line.


    ```

    if ENV[:FOCUS_TESTS]

    c.filter_run:in_progress => true

    end

    ```


    That can then be invoked from the tagged command like this:


    spec FOCUS_TESTS:true

    Cucumber also has command-line mechanisms for limiting the features in a Cucumber
    run. The cucumber command takes a file or a directory as its main argument. This
    can be augmented.


    +   If you follow the filename with a colon and a line number, then only the feature
    at that line is run. You can use multiple line numbers, as in cucumber login.feature:12:35.'
