- pgno: 270
  md: '# Using Rcov to Measure Test Coverage


    Test coverage is the most commonly used numerical metric for evaluating the quality
    of tests. Coverage measures the amount of application code that is actually executed
    over the course of running a test suite. At the end of the day, this is usually
    expressed as a percentage, as in, “My project has 85 percent test coverage” or,
    in other words, “85 percent of my application code is actually touched when the
    tests run.”


    In the right circumstances, you can get into a nice little argument about how
    meaningful test coverage is, but most people agree on the following points:


    +   - The absence of code coverage indicates a potential problem—a part of your
    code is not being tested at all. How big a problem that is depends on the context.


    +   - The existence of code coverage, in and of itself, means very little. The
    coverage metric says nothing about whether the application code being executed
    is actually being verified at all, let alone being verified completely.


    +   - That said, in conjunction with good testing practices, a coverage run might
    say something useful about your test suite and its reach. To put it another way,
    if you are using good TDD practices, you probably are getting good test coverage,
    but coverage by itself doesn’t indicate that you are using good TDD practices.'
  merge: -1
  img_proc: true
- pgno: 271
  md: "# 85 Percent of What?\n\nDid you see where I tried to put one by right there\
    \ in the first paragraph of this chapter? When I referred to a project having\
    \ “85 percent” test coverage. Leading to the natural follow-up question, “85 percent,\
    \ exactly?” Good question. While the idea of code coverage may seem intuitively\
    \ clear, nothing is simple once the computer scientists get done with it.\n\n\
    Wikipedia currently lists no less than seven ways to measure coverage, ranging\
    \ from the theoretically useful to the downright risky. But, there are only two\
    \ ways that are both easy enough to calculate and enough useful to have any currency\
    \ at all. Line coverage is a measure of the percentage of actual, textual lines\
    \ of code in your application that are executed by your test suite. The alternative,\
    \ *branch coverage*, attempts to measure each branch of your code and counts each\
    \ branch essentially. (Spoiler alert: Recov measures line coverage.) For example,\
    \ say you have a method like the following:\n\n```\ndef code_coverage_example_method\n\
    if something_good\n tell_all_my_friends\nelse\n ignore_it\n run_in_circles\nscream_and_shout\n\
    jump_up_and_down\n run_in_circles_some_more\n whine_all_day\n\n end\n```\n\nIf\
    \ you only had a test for the case where *something_good == true*—and we don’t\
    \ wish that was the only case we ever had to test—then a line coverage estimate\
    \ would say you had covered four of the twelve lines, for 33 percent coverage.\
    \ Specifically, the tests would cover the `def` itself, the statement, the `tell_all_my_friends`,\
    \ and the `end` of the method. A branch coverage estimate, on the other hand,\
    \ would determine that this method has two branches (the `if` clause and the `else`\
    \ clause) and one of them is covered, for 50 percent branch coverage.\n\nIn theory,\
    \ branch coverage provides a “truthier” picture of your coverage. In the previous\
    \ method, all six lines in the `else` clause are essentially one unit; they are\
    \ either tested or not. It makes very little sense for the length of each branch\
    \ to have an effect on how that branch is weighted for calculating code coverage.\
    \ On the other hand, the practical difference between the two measures is usually\
    \ not that great on real code, and line coverage is a billion times easier to\
    \ calculate. Also, 100 percent is 100 percent either way. I submit that if you\
    \ are deeply concerned about the difference between branch and code coverage in\
    \ your app, you have bigger problems than your code coverage."
  merge: -1
  img_proc: true
