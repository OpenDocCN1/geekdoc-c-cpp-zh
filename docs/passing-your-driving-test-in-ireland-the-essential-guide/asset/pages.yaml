- pgno: 34
  md: "# More Info: Getting Data into the Test\n\nOften, testing a feature properly\
    \ requires data to be created in order to build a meaningful test setup. A reporting\
    \ feature might be tested with a number of different data items that fill different\
    \ columns in a report. Or a social networking feature might require the creation\
    \ of several users in various relationship permutations for proper testing.\n\n\
    There are a number of ways to conveniently create sample data for tests. Rails\
    \ core offer an easy-to-use, somewhat limited called fixtures. Generically, a\
    \ fixture is a predefined set of data used by multiple tests as a baseline. Fixtures\
    \ in Rails are a core mechanism for defining and using known data in tests. Specifically,\
    \ every ActiveRecord model gets an associated set of fixture data in test/fixtures,\
    \ where data objects can be specified in YAML format.\n\nRails fixtures give you\
    \ consistent, potentially complex data set that is automatically created before\
    \ each test. Although fixtures have been part of Rails since the beginning, most\
    \ of the time I choose to use other tools that have a factory pattern for generating\
    \ sample data. It's true that fixtures have strong limitations and factory creation\
    \ methods are more flexible and generally lighter weight, we'll focus on fixtures\
    \ because they are easy to use and part of Rails core. You will find more discussion\
    \ on why fixture is less commonly and what kind of tools are used instead in the\
    \ Chapter [Creating Model Test Data with Fixtures and Factories]().\n\nThe directory\
    \ test/fixtures is expected to contain a YAML file for each ActiveRecord model.\
    \ So, app/models/user.rb is attached to test/fixtures/user.yml. The fixture files\
    \ are created automatically by the generators when a model is created. If you\
    \ create an ActiveRecord model manually, you'll also need to create the associated\
    \ YAML file. The reverse is also true: if you remove an ActiveRecord file, you\
    \ will be unable to run tests, since Rails will try to load the fixture data into\
    \ the test database for the missing ActiveRecord class. The data placed in the\
    \ fixture files is automatically loaded into the test database before each test.[12].\n\
    \nRails fixtures are described in YAML, which has a strict, nested format; at\
    \ the top level, each individual model gets a name, followed by a colon. After\
    \ that, the data for model is indented, Python-style. Each line starts with the\
    \ key, followed by a colon, followed by the value, like this:[13].\n\n```\nhuddle/test/fixtures/projects.yml\n\
    huddle:\n  name: Huddle Project\n```\n\nTo start a new model, add it to the left\
    \ edge and start again with a name for the model. Those top-level names, such\
    \ as huddle in the previous file, have no particular meaning in Rails beyond an\
    \ identifier for that particular feature within the test environment. The keys\
    \ in the YAML file must be columns in the database table for model (meaning that\
    \ they can't be arbitrary methods in the Ruby code that they can be when calling\
    \ new or create)."
  merge: -1
  img_proc: true
