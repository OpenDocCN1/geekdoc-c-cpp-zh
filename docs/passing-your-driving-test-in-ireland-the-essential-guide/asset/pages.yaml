- pgno: 228
  md: '# Simulating a Multiuser Interaction


    Integration test gets an implicit session that backs all the controller calls.
    That''s nice, but what if you want to test the integration of two or more consecutive
    or simultaneous sessions? This is a common issue in, say, a social-networking
    site where users might be communicating with each other.


    Happily, it''s possible to create an arbitrary number of different sessions and
    validate values against any of them. By calling the method `open_session`, you
    get a separate session with its own set of instance variables that you can make
    requests and perform assertions. A sample might look something like this:


    ```

    test "user interaction" do

    aaron_session = open_session

    quent_session = open_session

    quent_session.post("sessions/create",login => "quentin",

    :password => "monkey")

    quent_session.post("messages/send",to => users(aaron))

    aaron_session.post("sessions/create",login => "aaron",

    :password => "monkey")naassert_session.get("messages/show")

    asert_equal(1, aaron_session.assigns(messages))

    end

    ```


    Each session is targeted by its own post or get messages and its own set of instance
    variables. In this case, we''re testing that a message created by Quentin shows
    up in Aaron''s message queue; in a real test, you might do some slightly more
    detailed testing, but again, the point here is making sure that the entire flow
    works—testing that the show controller action displays messages properly is the
    work of the controller and view tests.


    You can also invoke `open_session` with a block, in which case the session is
    created as the argument to the block:


    ```

    test "user interaction" do

    open_session do |quent_session|

    quent_session.post("sessions/create",login => "quentin",

    :password => "monkey")naquent_session.post("messages/send",to => users(aaron))

    end

    ```


    Note that the `open_session` call still returns the session object after the block
    is evaluated, which means the session can be stored in a variable for further
    calls to be made on it even after the block has closed.


    The obvious disadvantage of using the block style is that multiple sessions overlapping
    is awkward.'
  merge: -1
  img_proc: true
