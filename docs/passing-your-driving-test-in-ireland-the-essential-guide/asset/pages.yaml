    # Running Cucumber


    The cucumber-rails gem provides three rake tasks to run cucumber; rake cucumber
    (also aliased as rake:ok) is the default. This will run all features that are
    not tagged as @wip, or "work in progress." See the section Annotating Cucumber
    Features with Tags.


    Alternately, you can run only in-progress tasks with the command rake cucumber:wip,
    which runs all scenarios tagged with @wip. The cucumber:wip task has the same
    behavior as a Cucumber command-line option called wip, namely, that it expects
    all the steps to fail—otherwise they will be "work in progress." The cucumber:wip
    task also fails if there are more than three scenarios tagged as @wip, although
    you can change this parameter by editing the default options in the config/cucumber.yml.


    You can run both in-progress and not-in-progress tasks with the rake cucumber
    task, which will run all scenarios. Alternately, you can run rake cucumber:rerun,
    which first will run the entire suite and make a note of which scenarios failed.
    If there are known failures, subsequent runs of rake cucumber:rerun will be limited
    to the failing scenarios until they pass.


    You can also use the cucumber command-line script directly for more options, including
    the ability to specify tagged'
