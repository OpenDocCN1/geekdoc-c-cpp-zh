- pgno: 100
  md: '# Model Data Summary


    To sum up, Rails provides fixtures an exceptionally simple way to create a set
    of test data that can be shared across multiple tests. However, fixtures are so
    simple that they tend to not be adaptable to more complex product needs. Factory
    tools, which take a little bit more initial setup, allow for more flexibility
    at some cost in test performance. The two structures don''t have to be mutually
    exclusive. One pattern for combining them is to create exactly one complex scenario
    in fixtures for use in integration or complex controller tests and to use factories
    for units or simpler tests.


    Fixtures and factory tools allow you to get test data into your database in order
    to create a known baseline for testing. However, in some cases, you may not want
    to actually place data in the database. Using the database from a test may be
    undesirable for performance reasons, for philosophical reasons (some people don''t
    consider it reasonable to touch the database in a “unit” test), or where logical
    reasons make objects hard to create. In the next chapter, we''ll explore mock
    objects, which allow tests to proceed by faking not the data but rather the actual
    methods that produce the data.


    Footnotes


    +   [32] YAML stands for Yet Another Markup Language, which you probably figured
    out out.

    [33] Quotation marks are necessary around a string if the YAML parser would find
    the string ambiguous, such as if the string itself contains a colon followed by
    a space.

    [34] In other words, Rails 1.x. You know, 2006.

    [35] I almost wrote “This is super-nifty” but decided that wasn’t professional
    enough.

    [36] See http://www.neeraj.name/blog/articles/800-override-automatic-timestamp-in-activerecord-rails
    for some ways to make this call a little friendlier using Ruby Eiglasses.'
