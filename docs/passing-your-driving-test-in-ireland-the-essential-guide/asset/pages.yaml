    \ can also have one factory inherit from another factory, which keeps you from\
    \ having to specify\ncommon default values in each factory.\n\n```\nfactory :project\
    \ do\nname \"Dog Meet Dog Dot Com\"\nuser\nlabel { \"#{user.first_name}'s project\"\
    \ }\nend\n```\n\n```\nfactory :cool_project,:parent => :project do\nlabel \"A\
    \ really nifty project \" \nend\n```\n\nIn this snippet, the cool_project factory\
    \ also has a default user and a default name of \"Dog Meet Dog\nCom.\" Personally,\
