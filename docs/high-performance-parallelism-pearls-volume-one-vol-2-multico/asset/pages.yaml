  md: '# A NUMERICAL METHOD FOR SHOCK HYDRODYNAMICS 11


    ![](img/a13d4428e1779878c265ff76550862e7_40_0.png)


    FIGURE 2.1


    1D Godunov scheme (possibly vector-valued) unknown Q. The x represent the boundaries
    between cells, and the cell values represent the discrete averages stored in each
    cell. The arrows represent the fluxes exchanged between cells.


    Slope limiting Adopting an average-value representation has some useful properties
    for handling shocks, it can be limiting at times and well—without modification,
    it acts as a piecewise-constant scheme and limits spatial accuracy to the first
    order.


    Numerous techniques have been developed to address this deliver higher-order of
    accuracy. These techniques must be constructed carefully so to preserve discontinuities
    in the solution and avoid introducing nonphysical dispersion phenomena.


    One of these approximate techniques is known as *flux limiting* and it modifies
    the way integration is carried out by considering a small neighborhood of fluxes
    before the solution. Hydro2D uses an alternate technique *slope limiting* that
    uses a neighborhood of cell values to estimate a slope for the value of each cell
    at the interfaces where fluxes are computed.


    *The Riemann problem* core of Godunov''s method lies in how fluxes are computed:
    given cells sharing an edge, we determine the average fluxes them over a timestep.
    A more general way of posing this is: two piecewise-constant states that meet
    in space, how do they evolve in time subject to the governing equations? This
    is known as the Riemann problem, and for nonlinear systems of equations, its evaluation
    can be complicated; new intermediate states can arise between the two and upon
    the left state, the right state, and each one there! These states may contain
    sharp, fast-moving shocks and soft, smoothly-varying *rarefaction fans*.


    We must solve a distinct Riemann problem for each pair of cells that share an
    edge—in a n x n grid, that is 2(n-1) each timestep! The development of specialized
    and efficient Riemann solvers for computing the solutions to these problems has
    long been a subject of interest.


    Hydro2D uses nonlinear solvers for its Riemann problems; in the case of the 2D
    Euler equations, the intermediate state can be determined through a nonlinear
    scalar equation for the pressure between the left and right states. A number of
    Newton-Raphson iterations are performed on this equation to yield a suitable value
    for computing the fluxes.


    Integration The 2D Euler equations form a hyperbolic system of equations and are
    often integrated using explicit techniques. Hydro2D performs integration using
    the Euler method; this is a simple scheme that works well in the presence of shocks.


    One additional consideration with computational ramifications is stability: for
    any given state of cells (meaning the Q and cell space ∆), there is a maximum
    allowable timestep Δt that will yield, stable results. Because the Δt must be
    used everywhere, it must be known prior to integration, and it depends on the
    discrete state of the solution, there is a computation and reduction step that
    must occur before each timestep begins.'
