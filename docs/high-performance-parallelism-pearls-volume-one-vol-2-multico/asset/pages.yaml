  md: '# 104 CHAPTER 5 PLESIOCHRONOUS PHASING BARRIERS


    ![](img/a13d4428e1779878c265ff76550862e7_131_0.png)


    Figure 5.13

    diffusion_tiled_HT2.


    In communications, a pleisiochronous system is one where different parts of the
    system are al-most, but not quite, perfectly synchronized.


    In any large-threaded application, synchronizing all threads, with thread pool
    barriers, results in significant processing power. In the diffusion simulation
    program, and possibly your application, the simulation integrates multiple times
    before doing something with the results. In the example program, it is the entire
    simulation run time. In a typical simulation, the program would be configured
    to advance N threads, then log or display the current state. And then proceed
    for another N intervals, etc.


    In the diffusion_tiled_HT2 code, small model (256x256x256) and 4 threads per phalanx,
    we have 64 quad slices by Z 256 steps along Y. This represents 16,384/60 (273.0666...)
    "drill holes" along X. Not being a whole number, all cores are not assigned the
    same number of "drill holes." 56 of the cores are scheduled 273 "drill holes"
    and 4 cores are scheduled 274 drill holes. The work is small, only 1/273. This
    is the "cost of doing business" so to say.


    If only the "cost of doing business" were that. In practice, with 240 threads
    in 60 cores, you will not get all threads to start a parallel region at the same
    time, nor will all threads finish the barrier at the same time if they are not
    performing the same amount of work. As mentioned in this article, adding instrumentation
    to measure the total time in do-work section and at-barrier section, for the small
    problem (256x256x256) indicated approximately 25% of the computation time was
    spent at the barrier.


    Now then, what to do about lost time at barrier?


    Constructing a diagram for two cores, 4 threads/core, 16x16x16 array (ignore vectors
    for the purpose of this illustration). In the tiled_HT2 perfect world with zero
    skew to the start of a parallel region and identical compute times (resulting
    in zero time at the barrier), the time when the first reaches the barrier would
    look like Figure 5.14.'
