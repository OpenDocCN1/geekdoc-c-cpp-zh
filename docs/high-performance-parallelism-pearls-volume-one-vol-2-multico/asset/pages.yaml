  md: '# FOR MORE INFORMATION 85


    For assessing and tracking performance we used an OpenMP thread scaling graph
    with two y-axis (one to describe performance and another to depict speedup over
    single thread). This graph provided us with multiple capabilities: compare performance
    between versions and platforms, clearly quantify thread scaling, and do both at
    thread granularity.

    For tools, we used VTune Amplifier XE 2015 with OpenMP analysis capabilities.
    The OpenMP analysis capability in VTune Amplifier identifies potential gain optimizations,
    illustrates how effectively the local CPUs are being used, and illuminates what
    is actually running on the CPUs. These capabilities, combined with their hotspot
    analysis capabilities, make VTune Amplifier instrumental in analyzing and optimizing
    parallel applications.

    Four optimizations defined:


    +   (1) ThreadBox: Created a coarse-grain parallel approach to optimize a previously
    fine-grained OpenMP parallelism approach at the loop level.

    (2) Allocation: ThreadBox optimization had a side-effect we were not expecting.
    We fixed this by allocating data on the stack.

    (3) Blocking: Stack allocation caused problems with smaller number of threads.
    This change enabled us to use stack sizes specifically for smaller number threads.

    (4) Vectorization: Chemical reactions were transformed to enable vectorization
    and multiple differ loops now vectorize using SIMD Frontend.


    These optimizations significantly improved concurrency on Intel Xeon Phi coprocessors
    and Intel Xeon processors. OpenMP thread scaling on the coprocessor with 240 threads
    vs. one thread was 100x, 38x in version 1.0. OpenMP thread scaling on the processor
    with 48 threads vs. one thread is now 16x, with 10x originally.


    # FOR MORE INFORMATION


    Where did the name SMC originate? SMC is not an acronym. Someone who was an astrophysicist
    chose the name. CCSE has a low Mach number combustion code called MMC. LMC can
    also stand for Large Magellanic, a scale galaxy of the Milky Way. The LMC galaxy
    has a little brother called the Small Magellanic Cloud (SMC). Thus, SMC code is
    also a little brother of the LMC code.

