  md: '# PLESIOCHRONOUS

    PHASING BARRIERS


    Jim Dempsey


    QuickThread Programming, LLC, USA


    In telecommunications, a pleisiochronous system is where different parts of the
    system are almost, but not quite, perfectly synchronized. In any large-threaded
    application, synchronizing all threads through pool-wide barriers results in significant
    wasted processing time. When appropriate, adapting your application to use loosely
    synchronous (pleiosynchronousous) barriers instead of strictly synchronous barriers
    can recover a substantial portion of previously lost barrier wait time. This chart
    will apply these techniques to an example application that was presented from
    Chapter 4 of Intel® Xeon Phi™ Coprocessor High-Performance Programming, © 2013,
    Jim Jeffers and James Reinders, Morgan Kaufman Publications (HPP).


    Before we get to the specifics of the pleisiochronous phasing barrier usage, some
    preliminary code optimizations to the example application will be described. After
    these foundational improvements are discussed, the benefits and use of pleisiochronous
    phasing barrier will be presented all the techniques required to demonstrate a
    significant improvement in application performance. The goal of this chapter is
    to deliver a full learning experience. The journey is most important, for the
    journey provides means to the end, the end being a better programmer.


    Please note that the programming enhancements in this chapter are equally applicable
    to programming processors. A discussion of the benefit to the host processor will
    be presented at the end of this chapter.


    The system selected to produce the runtime data for this chart is slightly different
    than the system used in the HPP book. The target host system is a workstation
    with one Intel® Xeon E-2560 processor in a motherboard with the x79 chipset. Two
    Intel Xeon Phi 512P coprocessors are installed, whereas we will show revised code
    running on 60 coprocessors, the tests we will use slightly different thread and
    core counts from those used in the HPP book.


    The content of HPP Chapter 4 will not be duplicated here; the end of Chapter 4
    is taken as a starting point. The program under investigation measures diffusion
    of solution in a volume of liquid over time in a 3D container such as a cube.
    Both the original and revised codes are available from http://lotsofcores.com.
