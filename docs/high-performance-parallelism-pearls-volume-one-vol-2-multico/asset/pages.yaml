    # A LES LEARNED


    The environment variables were configured to run the 3-wide phalanx and tests
    on both CentOS and Windows 7 (Figure 5.8 for 4-wide phalanx). Surprisingly, running
    the same code (binary file in) hosted on Windows and comparing the results in
    the coprocessor on Linux, the relative performance figures were reversed! What
    was faster with a Linux host was slower with the Windows host, and versa. This
    does not make sense.


    One of the thoughts that come to mind is there be a memory alignment issue between
    the allocations of the arrays. This is the author''s experience on Intel64 and
    IA32 platforms. So, a `printf()` was added to display the address of the buffers.
    The two programs, tiled and tiled_HT, both had 16-byte alignment and approximately
    the same offset within the page, so data alignment differences could not be the
    cause. Curiously, by adding the `printf` of the addresses of the two buffers,
    the performance figures flipped again. The results were shown in Figure 5.9. Clearly
    there is a shift of 5% in performance due to “code position shift.”'
