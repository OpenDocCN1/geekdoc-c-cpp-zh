  md: '# PARALLEL EVALUATION OF

    FAULT TREE EXPRESSIONS


    Jefferson Amstutz

    SURFACE Engineering, USA


    Hardware advances with Intel® Xeon® processors and Intel® Xeon Phi™ coprocessors
    enable complex scientific simulations to be visual and interactive. However, datasets
    in engineering simulations continue to increase in size, with the expectation
    that interactivity be maintained. One of the key components to interactive simulation
    on processor and coprocessor hardware is exploiting SIMD parallelism. In this
    chapter, we explore how to find and use SIMD parallelism when evaluating large
    fault tree expressions on a large volume of input in an interactive application
    environment.


    # MOTIVATION AND BACKGROUND

    EXPRESSIONS


    Expressions embody the mathematical relationship between symbols according to
    some syntax grammar. In the context of this chapter, we focus on the need to evaluate
    large expressions that are easily modified at runtime. We also focus on the need
    for these modifiable expressions to scale well with expression size and instance
    count.


    Expression evaluation forms the fundamental math that programmers encode to solve
    complex problems. Scientific computing and engineering applications, by their
    very nature, heavily rely on evaluating mathematical expressions embedded in simulation
    codes. It is extremely common for these expressions to be large and complex while
    being over-growing datasets. Often, flexibility is traded for increased performance,
    for example, when simulation expressions are compiled directly into applications.
    However, parallel hardware enables to maintain activity while evaluating expressions
    over large datasets by exploiting parallelism. In certain applications, large
    expressions can be evaluated efficiently without hard coding.


    # EXPRESSION OF CHOICE: FAULT TREES


    The phrase “evaluating large expressions” is nebulous and requires an appropriate
    scope, as well as a practical application, for meaningful discussion. Our example
    domain for this chapter is evaluating large fault trees for vulnerability assessment.


    Vulnerability assessment is the process of identifying and quantifying vulnerabilities
    in a system of interest. A common environment for such studies is system engineering.
    Many systems are engineered'
