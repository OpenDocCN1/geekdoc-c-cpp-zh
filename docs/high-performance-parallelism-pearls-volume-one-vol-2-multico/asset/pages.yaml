  md: '# OPTIMIZING GATHER/

    ATTER PATTERNS


    Simon J. Pennycook, Christopher J. Hughes, Mikhail Smelyanskiy


    *Intel Corporation, UK, *Intel Corporation**


    Many modern microarchitectures rely on single-instruction multiple-data (SIMD)
    execution to provide

    high compute capabilities in an efficient manner. Such microarchitectures, including
    those em-

    ployed by the most recent Intel® Xeon processors and Intel® Xeon Phi™ coprocessors,
    are typically

    optimized for data laid out contiguously in memory. However, they support SIMD
    execution when

    data are non-contiguous in memory, through gather and scatter operations.


    Exactly how these operations are performed is platform-specific, sometimes taking
    place in soft-

    are and times making use of dedicated hardware instructions. However, their function
    is

    always the same: a gather operation reads individually addressed elements from
    memory and packs

    them into a single SIMD register, and a scatter operation unpacks elements from
    a SIMD register

    writes them to individually memory locations. The addresses involved in gather/scatter

    operations do not need to be known until run-time, and can represent any access
    pattern (including\contiguous access), allowing programmers (and compilers) to
    vectorize even the most irregular of

    loops.


    Figure 8.1 shows an example that contains both an indirect read and an indirect
    write which

    gather/scatter operations to vectorize. When we vectorize the loop, a single SIMD
    iteration

    read a group of A[B[i]] and write a group of D[E[i]]. In general, the A[B[i]]
    and the

    D[E[i]] are in memory locations unknown until run-time, and may be stored at non-contiguous
    addresses. Thus, normal SIMD load and store instructions, which grab a set of
    contiguous elements, will

    not suffice. We need a gather operation to read the individually addressed A[B[i]]
    elements,

    a a scatter operation for the writes to D[E[i]].


    Gathers and scatters require the hardware to do more work than contiguous SIMD
    loads and\stores—typically have higher instruction overheads, are less predictable,
    and are accessible to

    cache lines/pages (depending on the specific access pattern). Programmers should
    therefore aim

    to minimize their, by avoiding indirection and non-contiguous accesses whenever
    possible.


    However, indirection may be an inherent part of any algorithm. For instance, data
    elements may be

    accessed in an input-dependent order, or computation be performed on a subset
    of elements

    to reduce computational complexity. Such algorithms are common, particularly in
    domains where relationships between elements are not known priori (e.g., graph
    problems, unstructured mesh),

    alternative algorithms may not perform as well—even if their SIMD efficiency is
    higher.'
