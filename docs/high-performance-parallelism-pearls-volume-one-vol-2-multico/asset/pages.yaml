    The compute section of the book''s titled code is shown in Figure 5.3.


    # WHAT CAN BE DONE TO IMPROVE THE CODE?


    The compute intensive loop contains a single floating point operation with a handful
    of integer increments. The compiler optimization -O3 is going to unfold this loop
    and reduce the number of (x < nx+1) tests, as well as the number of ++ operations
    through use of offsets. More importantly, the compiler will vectorize this loop.


    This loop handles nx-z indices of dimension x (254 in the small problem case).
    The expressions preceding and following the loop, handle the remaining 2 indices
    of x (x=0 and x=nx-1). With NX=256, the inner loop accounts for 254/256=99.22%
    of the work.'
