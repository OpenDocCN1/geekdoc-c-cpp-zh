    Another optimization is to form packets of computation in large, multithreaded
    application. Multicore processors and manycocrocessors are flexible enough to
    allow multithreaded applications to work on different stages of computation independently
    of each other. However, each thread ought to work on a subset of data at least
    as wide as SIMD instruction. Thus a “packet” of evaluation for the Intel Xeon
    processor’s 16-wide float vectors would contain at least 16 evaluations, while
    maintaining the data layout as discussed in the previous section. Threads that
    execute evaluations based on packets can independently run over the system evaluation
    stage of computation and maintain maximum SIMD efficiency.


    It is also noteworthy to mention that the SIMD utilization techniques discussed
    in this chapter apply to any SIMD hardware architecture, such as GPUs and ARM
    NEON CPUs. The ballistic simulation code that inspired this chapter was first
    implemented using NVIDIA’s CUDA GPU computing environment within the open-source
    Visual Simulation Laboratory (VSL) framework.'
