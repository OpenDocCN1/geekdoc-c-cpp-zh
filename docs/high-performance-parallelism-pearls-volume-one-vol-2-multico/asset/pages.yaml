    \ chunkSize=atomic_retrieve(n)/(THREADS_PER_OFFLOAD);\nint start=id*chunkSize;\
    \ stop=min(start+chunkSize,n);\nfor (int i=start; i<stop; i++) {\n    f_i[x]+=f_j[i];\n\
