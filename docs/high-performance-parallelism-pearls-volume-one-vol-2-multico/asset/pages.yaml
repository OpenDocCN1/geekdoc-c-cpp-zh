  md: '# xii Foreword


    Developments at Intel gave us new options in our quest to feed our insatiable
    appetite for computing power. In 2008, we found ourselves extremely enthusiastic
    about the “Larabee project at Intel. Although it was initially touted as a graphics
    processor, its essence was really the world’s first SMP-cluster-on-chip which
    was indeed its destiny. It was easy to imagine how to run standard programs, or
    program kernels, on the device. At the time there was no hardware but articles
    such as Michael Abrash’s First Look at the Larabee New Instructions described
    a very sophisticated set of vector extensions to the standard x86 instruction
    set. With the help of Dubey and his team from Intel Labs, we saw promising results
    by simulating code snippets. The promised of x86 threads could be active in parallel
    had caught our imagination. The programming models, and tooling would prove quite
    valuable.


    Intel’s initial performance targets had been completely focused on single precision
    (SP) floating-point, a good fit for graphics but not enough for computational
    physics. Our resisting critiquing that need for high performance double precision
    (DP) floating-point proved influential in the Intel Xeon Phi trend.


    Imagine our excitement when we were the first group out to receive a Knights Phi
    (KNF) card in 2009! While this was too soon to incorporate all circuits, Intel
    was already working on the next that would. In the meantime, with KNF, we had
    to look to some of the LHC experiments. ALICE, a heavy-ion experiment, had scientists
    collaborating with other heavy-ion experiments on a new version of the software
    called the “Trackerfinder.” This code reconstructs every track, or trajectories,
    from the coordinates of the sensors that light up in a particle collision. In
    اولا, we had already ported it to Intel Xeon processors, so it was posted to KNF
    literally in a matter of hours. We were very excited by the minimal effort, measured
    in days, that we was needed to get to outstanding results.


    # XEON PH IS BORN: MANY CORES, EXCELLENT ISA


    I received a flattering invitation to share our early results at the International
    Supercomputing Conference (ISC) in May 2010 where Kirk Skaugen, responsible for
    the Datacenter and Connected Systems Group at Intel, announced the Knights Corner
    as the first-production many-core device. Soon after, the official name became
    Xeon Phi™ indicating that this would be a family of processors just like Intel
    Xeon®.


    You might ask: Why were we so enthusiastic? What we saw in the Intel Xeon Phi
    included an vector instruction architecture set (ISA). By having vector registers
    from the vector data registers, the architecture was able to handle data flow
    and control flow in programs in a much more optimal way. Intel has been pleased
    by strong community enthusiasm; their recent announcement of the AVX-512 instruction
    set will push this architecture into their processors as all.


    Additionally, we were attracted to the many-core design. Our programs have limited
    Instruction Parallelism (ILP), so so many of them in parallel, or that would consume
    only a few watts, is a great idea. We demonstrated the advantage of this approach
    by working with the developers of the detector simulation software, Geant, that
    we could run an entire simulation process with hundreds of threads on a single
    Xeon Phi coprocessor. The future will tell whether smaller cores, or a mix will
    be the best option. Our aim is to be ready for all likely combinations. Our strong'
