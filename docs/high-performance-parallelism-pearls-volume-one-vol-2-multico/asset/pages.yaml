    # Syntax and parsing results


    The input file of our fault implementation is a list of system definitions. Systems
    are defined as an expression containing AND/OR operators, constants, and sub-systems.
    The grammar we parse is as follows:


    ```

    Expression =(([OR_Operand] || [OR_Operand])*

    OR_Operand=[AND_Operand] & [AND_Operand]*

    AND_Operand=[Name, Constant, Expression]

    ```


    Parsing input is straightforward, with available tools such as yacc and lex. Details
    of our parsing code are out of scope of this chapter and are not relevant to effort
    evaluation. Interested readers may examine the parser portion of our example.


    The result of parsing input data is a parse tree. The tree contains nodes of various
    types. We define an enumeration of each node type (Figure 6.2).


    Name identifiers that the input files. Name, a collection of components and systems
    are assigned during parsing input. Names are assumed to be components (tree leaves)
    unless they are assigned an expression. The tree is traversed after it is constructed
    to change name nodes into component or system names by using the contents of the
    component and system names. After the name conversion process, the tree is traversed
    to assign components into evaluation state values. Once indices have been assigned,
    the tree is ready to be used for evaluation array construction.


