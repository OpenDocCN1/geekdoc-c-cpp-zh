  md: '# 108 CHAPTER 5 PLSIOCHRONOUS PHASING BARRIERS


    At this point, instead of waiting for all the threads of the thread pool to reach
    the barrier (all threads on the left side in this simplified diagram), the first
    completing the core barrier can pick the next Z group, and can begin processing
    before the other core(s) reach the barrier. When 0 completes the core barrier,
    the state may be something like Figure 5.19.


    The process of: as core finishes, picking next Z group, continues in a modulus
    fashion (0 follows nz-1). The modulus counter contains the number of overflows.


    The main benefit of the plesiochronous barrier is realized at the moment when,
    and where in the code, the traditional thread barrier appears. This is at the
    end of the whole array iteration (often called a frame).


    In the original OpenMP program, this was where the end of the #pragma omp parallel
    for implicit barrier was located and also in our revised diffusion tiled HT1 and
    diffusion_tiled HT2 program where the explicit #pragma omp barrier was located.

    Plesochronous barrier technique permits the cores completing one frame, to enter
    the next frame that the dependencies for that work area are satisfied. This is
    illustrated by Figure 5.20.


    In Figure 5.20, unlabeled sections indicate dependencies are fulfilled (prior
    iteration completed from perspective of the picking thread). The next to right
    mostly illustrates a completing Frame n (no more unschen stripes available in
    this pass of Z), the core not having an available Z for its frame, passes through
    frame barrier while the last core has to reach the frame barrier. Upon reaching
    the first column of the next frame, the frame progress of the second column is
    consulted, and when greater than or equal to the next frame-1, core is permitted
    to enter the column.


