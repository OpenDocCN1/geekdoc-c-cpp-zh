  md: '# OPTIMIZING GATHER/SCATTER PATTERNS 149


    and/ if the elements are spread across many cache lines (i.e., there is little
    spatial locality). For our molecular dynamics example, one way to increase both
    temporal and spatial locality for the gathers and scatters is sorting. The sorts,
    as we will describe, do not need to be exact; even a partial sort will increase
    temporal or spatial locality, and therefore have a good chance of increasing performance.


    To increase temporal locality, we can sort the atoms by spatial position. Atoms
    close together in space are likely to have common neighbors. Thus, the effect
    of this sort is that iterations of the outermost loop (over the atoms) will gathers
    and scatters that touch many of the same neighbors. For a given neighbor that
    we have accessed recently via a cache or scatter, there is a high probability
    of a cache hit, since it is the default neighbor of a different atom.


    To increase the spatial locality of each gather/scatter operation, we can sort
    the indices in each atom''s neighbor list. This will minimize the number of cache
    lines that a given gather/scatter operation touches.


    Sorting may not be the best approach for all applications to improve spatial or
    temporal locality, but the principles of maximizing the amount of reuse for each
    piece of data and minimizing the number of cache lines touched by each gather/scatter
    operation are generally applicable.


    The graph in Figure 8.6 completes the execution times when atoms are: (1) ordered
    randomly and (2) sorted by spatial position. The sort uses a scan-line ordering,
    based on the atom''s bin-index—this is the default sort in the most recent version
    of miniMD, and mimics the sort available in LAMMPS. Both platforms are significantly
    impacted by the random order: on the processor, sorting improves performance by
    1.48x; on the coprocessor, sorting improves performance by 1.36x.


    In previous work, we have demonstrated that a decomposition across threads (followed
    by spatial locality within each thread''s local domain) can provide even higher
    levels of temporal and spatial locality, and hence greater performance improvements.
