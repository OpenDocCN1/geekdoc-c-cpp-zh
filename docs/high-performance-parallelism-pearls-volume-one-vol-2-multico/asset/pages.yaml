    # 5.3—Cont''d


    The compiler does a good job of deciding and when to insert prefetches. You can
    look at the disassembly code if you wish (via -s compiler switch). I experimented
    with different #pragma prefetch options all which produce lower performance than
    using the compiler-generated prefetches. Curiously, I also noted that for this
    example using #pragma noprefetch produced much faster code (<1% faster). This
    is likely due to the fact that the loop is simple enough the coprocessor''s hardware
    performs the prefetching for you. Each unnecessary prefetch instruction that is
    eliminated from the loop often gains back at one clock cycle.


    The HPP book found the best performance was achieved using KMP_AFFINITY=scatter
    and OMP_NUM_THREADS=183 (three threads from each core). On the test machine, with
    one fewer core, 180 threads were used. The tiling (YB=16) was used to improve
    cache hit probability, and we assume the authors of the book tuned this to yield
    best performance.


    # WHAT CAN BE DONE TO IMPROVE THE CODE?


    There are some problems with the code. These problems are not obvious when reading
    the code and relating it to the computational characteristics of the coprocessor,
    including many in-order cores with four threads each. The HPP book authors found
    that using three of the four threads per core give optimal performance (of this
    program) for use with the tiled algorithm. Test runs on the target system produced
    comparable numbers.


    The first optimization beyond the HPP book relates to the L1 and L2 relationship
    of the threads within each core. The next subsection will describe how to take
    advantage of this relationship.


