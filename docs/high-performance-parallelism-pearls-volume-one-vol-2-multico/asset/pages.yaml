    Due to initial unknowns, the code has to do more work in the preamble and postable
    sections, as well as, a reduced number of iterations in the interior body loop
    of code.


    Particular note that the input array fl_t is encoded in different ways. This means
    that the preamble code that alignment may have to work on minor permutations of
    the few references in an attempt to narrow in to the one when the largest number
    of references are vector aligned. This is nontrivial for the compiler code generation,
    as well as a potential area for additional overhead.


    # IGNED DATA WHEN POSSIBLE


    Data alignment is addressed in an improvement to the coding of the tiled_HT2 program.

    First, the dimension NX as a multiple of REALs that a cache line is enforced.
    This is not an unreasonable requirement. The value 256 was used in the original
    example. It is not too much of a restriction to require that NX be a multiple
    of 16 for floats, or for 8 doubles.


    To assure, the malloc calls are changed to allocate the arrays using mm_malloc
    with an alignment cache size (64). This is a relatively simple change. This will
    be shown later after the next optimization also affects allocation.

    Next, now that NX is an even multiple of cache lines, and the arrays are cache
    aligned, a function can be constructed to process the innermost loop with the
    foreknowledge that six of the references are cache aligned and two (the extra
    reference is the output array). The two that are not aligned are the references
    to [c-1] and [c+1]. The compiler, knowing beforehand is aligned and what is not
    aligned does not have to insert code to make this determination. This is to say:
    the optimizer can reduce, or completely eliminate the preamble and postable sections.


    # REDUNDANCY CAN BE GOOD FOR YOU


    The second (nonvious) improvement can be achieved by redundantly processing x=0
    and x=nx-1 if these cells were at the interior of the parallel piped beside. This
    means that the preamble and postable codes for alignment can be bypassed, and
    that the elements=1:15 could be directly processed as an aligned vector (as opposed
    to one-by-one computation or vector computation). The same is done for the 16
    elements where the last element (x=nx-1) is computed differently from the other
    vector elements. This means that after calculating the incorrect values (for)
    the X column for x=0 and x=nx-1, we must perform a scalar calculation to insert
    the correct values into the column. Essentially we are scaling two loops of 16
    iterations for two of one (16-wide vector operation + one scalar operation) where
    the scalar operations are in L1 cache.

    Adding the redundancy allocating the array''s two vectors of elements to be larger
    than the actual array requirement, and restricting the second vector''s array
    pointer address. Additionally, this zeroing one element preceding and one element
    following the working array size to perform a "first touch" write. The allocation
    provides for two additional vectors of address-memory (not used as valid data).
    Not performing the "first touch" code would result in a page fault depending on
    location and extent of allocation.


    Change to allocations results in the code in Figure 5.11.


    As an additional benefit, the compiler can now generate more code using Fused
    Multiply and Add instructions.


    The tiled_HT2 code is shown in Figure 5.12.'
