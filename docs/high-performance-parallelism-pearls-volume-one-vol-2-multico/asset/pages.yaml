    # ## NOTE: SHARING COPROCESSOR DATA ACROSS CONCURRENT OFFLOADS FROM OPENMP


    Offload computations from the same host process share the corresponding coprocessor-side
    process. Memory allocated on the coprocessor throughout any of the host threads
    can be used within uniform regions of other hosts in the same process context
    as long as the host pointer is shared among them.

