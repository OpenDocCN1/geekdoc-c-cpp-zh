  md: '# VERSION 2.0: THREADBOX


    main.intel... module was minimal. This indicates that we have very small parallel
    regions or severe load imbalance. Whenever one is the case, VTune Amplifier shows
    that the main problem is of our threads are waiting instead of running application
    code.


    Investigating performance via hotspot analysis in VTune Amplifier, we see that
    the main hotspot is differm_j inside kernels_9f (for our simplified example below,
    we will call this subroutine diffterm). This function computes the diffusive terms
    involves loops and many of the loops contain stencil operations. Computing the
    diffusive terms involves loops and data from neighboring cells is also. Looking
    at the source, we see that differm has a large parallel region (see Figure 4.5).
    Although, the parallel region is a good size, it contains more than one hundred
    nested loops with its own omp DO. This is not as optimal as it is to fine grain.


    The fine-grain parallelism occurs due to OpenMP works. An OpenMP-enabled application
    starts with a single master thread and workers when it encounters a parallel region.
    At this point, all of execution happens in parallel. When OpenMP encounters the
    omp DO work-sharing construct, OpenMP splits the loops among the threads. The
    OpenMP Loop COLLAPSE can also be added to collapse nested loops into one iteration
    and divide work among threads. The OpenMP work-sharing construct end is marked
    with omp END. There is an implicit barrier at omp END unless the user adds a NOWA
    synchronization clause with the omp END DO. The end of the parallel region is
    a barrier where all wait until all complete (join). OpenMP continues with this
    fork-join behavior for all subsequent parallel regions. Thus, the omp DO work-sharing
    constructs denote the actual parallel work of some may have implicit barriers
    at the end. These small parallel work-sharing regions will result in a lot of
    overhead and imbalance. A potential solution to investigate this is to take a
    coarse-grained approach for OpenMP.


    # VERSION 2.0: THREADBOX


    In this version, we adopt a coarse-grain OpenMP approach that requires very little
    changes to the source code that computes the diffusive terms (differm subroutine).
    See Figure 4.5 for version 1 code and Figure 4.6 for version 2. The code we differs
    has been simplified for brevity and to focus on main points.


    In this approach, the computational domain is decomposed into subdomains. Each
    thread is responsible for one subdomain. The call to get_thread returns the lower
