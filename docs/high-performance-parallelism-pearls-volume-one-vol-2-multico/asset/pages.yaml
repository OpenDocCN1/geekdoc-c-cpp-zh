  md: "# # CONCURRENT KERNEL OFFLOADING\n\n**Florian Wende', Michael Klemm', Thomas\
    \ Steinke', and Alexander Reinefeld**\n'Zuse Institute Berlin, Germany, Germany'\n\
    \nThe Intel® Xeon Phi™ product family offers powerful devices for workloads that\
    \ can take advantage of parallelism at different levels of granularity. All of\
    \ the computational resources available on Intel Xeon Phi coprocessors can be\
    \ utilized when large data sets need to be processed.\n\nBut is the coprocessor\
    \ attractive for small-scale workloads that cannot exploit the provided resources\
    \ on their own?\n\nIn this chapter, we show how to leverage the potential of the\
    \ Intel Xeon Phi coprocessor for workloads that process small data sets, but many\
    \ of them. This is important since an increasing number of innovative algorithms\
    \ support execution flows with multiple levels of parallelism. When work is placed\
    \ on Intel Xeon Phi coprocessors from parallel instances of the host, a sufficient\
    \ load on the coprocessor can be generated.\n\n> NOTE\nOur ultimate optimization\
    \ target in this chapter is to improve the computational throughput of multiple\
    \ small-scale workloads on the Intel Xeon Phi coprocessor by concurrent kernel\
    \ offloading.\n\n# ## SETTING THE CONTEXT\n\nConcurrent kernel offloading to the\
    \ Intel Xeon Phi coprocessor is the ultimate means for certain classes of workloads\
    \ and production environments to improve both computational throughput and resource\
    \ utilization. Potential usage scenarios in this respect, using a single coprocessor\
    \ device for simplicity, are summarized in Figure 12.1.\n\n+   * **Single process\
    \ or thread offloads to a dedicated coprocessor:** These setups are typical for\
    \ today's HPC production environments where only a single user job is allocated\
    \ per compute node.\n    * *Single offloads* with high data sets can effectively\
    \ utilize the coprocessor resources (Figure 12.1a).\n    * *Multiple sequential\
    \ offloads* with varying computational intensity may result in under-utilization\
    \ of the coprocessor (Figure 12.1b).\n    * *Multiple concurrent (small-scale)\
    \ offloads* can improve device utilization (Figure 12.1c)."
