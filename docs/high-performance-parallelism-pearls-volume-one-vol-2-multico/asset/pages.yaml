    of cores are more likely to experience penalties related to non-uniform memory
    access (NUMA). The exchange buffers and halos do incur storage overhead, but is
    negligible for large grids, with 240 threads on the coprocessor, and is considerably
    less than the overhead of the large amounts of intermediate storage needed by
    the slab approach.


