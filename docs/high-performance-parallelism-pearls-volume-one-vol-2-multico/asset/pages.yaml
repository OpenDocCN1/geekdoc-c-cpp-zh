    # SUMMARY


    In this chapter, we have described gather and scatter operations and explained
    why they are needed to vectorize certain loops. Due to their high cost relative
    to optimized SIMD loads and stores, since they cannot be avoided, we demonstrated
    four optimization techniques for improving the performance of gather and scatter
    operations; using domain knowledge and sorting to improve temporal and spatial
    locality; minimizing the number of instructions for each individual gather/scatter
    operation, through on-the-fly transposition between AoS and SoA layouts; and amortizing
    gather/scatter transposition over multiple loop iterations (where possible).


