    # LEARN HIGHLY SCALABLE PARALLEL PROGRAMMING


    The explosion in core count, both in the Intel Xeon and Xeon Phi families, has
    been a blessing for the HEP community where parallelism is inherent in the scene.
    The really exciting challenges are scaling to many cores and vectorization. CERN
