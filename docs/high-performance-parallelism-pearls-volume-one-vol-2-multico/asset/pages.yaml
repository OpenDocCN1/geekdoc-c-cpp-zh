  md: "# OPTIMIZE THE MEMORY HIERARCHY\n\nTo improve locality and reuse particles\
    \ more efficiently for every i-loop iteration, we utilize a well-known technique\
    \ called loop tiling. Specifically, we tiled the i- and j-loops with square tiles\
    \ of particles size BF. Each tile is assigned to a thread and if the j-tile size\
    \ is chosen properly, the elements of the j-tile will be reused across all the\
    \ elements in the i-tile without being evicted from cache. This will improve data\
    \ locality.\n\nThe changes in the kernel and the computation of the tiling factor\
    \ are shown in Figure 9.12. The OpenMP collapse clause was used for the for construct\
    \ to distribute the tiles among the threads. The OpenMP atomic construct was used\
    \ because multiple threads might need to update the velocity at the same time.\
    \ We do not expect the use of an atomic update to have a large impact because\
    \ it is in the i-loop.\n\nNote that the schedule(dynamic) clause was removed because\
    \ better performance is achieved with the default static scheduling. We believe\
    \ this the improved behavior removes the imbalance caused by threads accessing\
    \ the interconnect so that dynamic scheduling is no longer required to load balance\
    \ between the threads.\n\nChoosing the right tiling factor, BF, is a tricky issue.\
    \ At each iteration, we need to fit three tiles: the i-tile, the current j-tile,\
    \ and the prefetch of the j-tile for the next iteration. Each of the four threads\
    \ of the core tile contains four vertices: x, y, z, and m. A straightforward computation\
    \ would be\n\n| BF | L2 size |\n| # of threads per core * size of type * # tiles\
    \ |\n\n```\nint align = CACHELINE_SIZE/sizeof(T);\nBF = nParticles / sqrt(omp_get_max_threads())\
    \ / 4;\nBF = (BF+align-1) * align;\nif ( BF > max_block<T>::value ) BF = max_block<T>::value;\n\
    \nint n = p.Particles;\n#pragma omp for collapse(2)\nfor (int i = 0; i < n; i\
    \ += BF) {\n  for (int jj = 0; jj < n; jj += BF) {\n    int im = min(i+BF,n);\n\
    \    int jmax = min(jj+BF,n);\n    for (int i = i; i < im; i++) {\n      #pragma\
    \ vector aligned\n      for (int jj = jj; jj < jmax; jj++) {\n        #pragma\
    \ omp atomic\n        p.vx[i] += dt*Fx;\n        #pragma omp atomic\n        p.vy[i]\
    \ += dt*Fy;\n        #pragma omp atomic\n        p.vz[i] += dt*Fz;\n      }\n\
    \    }\n  }\n}\n```\n\n![](img/a13d4428e1779878c265ff76550862e7_192_0.png)"
