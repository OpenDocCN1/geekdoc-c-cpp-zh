    # THREAD PARALLELISM IN HBM


    In the MPI parallelization and the OpenMP parallelization of HBM, we assume that
    the enumeration of the surface-points and the columns below follows. Without this
    assumption we are facing an NP-hard problem but the simplification imposed by
    this new assumption implies that we are now facing a problem that is no longer
    NP-hard (ie., the simplification that we deal with subintervals instead of subsets
    makes the problem amenable). This allows us to treat the balancing of the threads
    (or tasks) both offline using an exact algorithm and online using various heuristics.
    Moreover, it allows us to evaluate different heuristics on relevant test cases.
    It should be stressed that another enumeration of the points will introduce another
    layout of no matter approach which we take to the balancing. Below is a formal
    definition of the load-balancing problem and Figure 3.7 shows how the points are
    split among the threads.


    Let $I=\{1,\dots,m\}$ be the column index set and let $\{w_1,\dots,w_m\}$ be the
    weights associated with the individual columns. Let $n$ denote the number of threads/tasks
    used. A disjoint subinterval $I_j=\{[l_j,u_j]\}_{j=1,\dots,n}$ covering of $I$
    induces a cost vector $(c_1,\dots,c_n)$ with


    ```

    $c_j = \sum_{i \in I_j} w_i$$

    ```


    The cost of the covering is defined as $\max c_j$. The balancing problem is to
    find a covering that minimizes the cost.


