  md: '# PATHS TO PERFORMANCE 21


    **General notes on the optimized code** The optimized code we make some structures
    and formatting departures from the original code. These changes do not affect
    the performance directly and serve only to improve clarity and maintainability:


    +   - The file structure has been consolidated; the core routines are in pcl-hydro-core.cpp
    and pcl-hydro-vcore.cpp and utility routines have been moved to pcl-hydro-util.cpp
    and pcl-hydro-params.cpp. The top-level driver is in run-tile.cpp.

    - Some identifiers have been renamed to improve their clarity (i.e., constoprim()
    has been renamed conservative_to_primitive(), equation_of_state() and speed_of_sound())
    have been split into equation_of_state() in recognition of their distinct uses.

    - The Hydro2D uses the idam parameter in many functions to control the adjustments
    to the data access (pu and pv must be treated differently based on the current
    dimensional pass). In the optimized code, some bunches are separated by passing
    each unknown (rho, rhov, E) to the callee in the correct order rather than the
    opaque multidimensional array.

    - The placeholder my_sqrt() and rcp() have replaced sqrt() and l/x to provide
    flexibility in choosing how those operations are carried out.

    - Some constants like Gamma from the original code have been replaced by GAMMA.

    - Where possible, stack-allocated variables and functions are qualified with const.


    # MEMORY USAGE


    The slab approach in the reference code GPU-like memory models and does not take
    full advantage of the memory hierarchies found in modern systems.

    The overhead of copying to from the slab cannot be overlapped with other computation
    and with low arithmetic intensity. While, the slab computation uses many intermediate
    variables, which increases dramatically. Some of this can be mitigated through
    reuse of intermediate storage, the small region of dependence for each update
    suggests that a different approach be taken.


    **Consolidating_delt()** Performing a step for the stable timestep carries a potential
    penalty; additional synchronization is needed to safely enter and end the pass
    through the grid, and it requires the entity to be re-read and the steps reduced;
    this can have a significant penalty.


    In fact it is the timestep occurs at the very beginning of the computation and
    then only x passes in odd-numbered steps. For all invocations after the first,
    the values that would be read by the compute_delt() function are the same as those
    integrated in the last part of the x-pass in odd-numbered steps, and it should
    be possible to compute the maximum propagation speed that determines the timestep
    each cell directly after integrating.


    The reduction that is done to find the maximum speed across all cells can be made
    part of the work-sharing as each thread privately computes and locally reduces
    the maximum encountered during the pass, and the timestepping loop can coordinate
    global reduction over these thread-specific values. It is possible to perform
    this reduction in a tree fashion, if communication costs begin to dominate.'
