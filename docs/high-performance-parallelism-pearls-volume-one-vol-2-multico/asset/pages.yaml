  md: '# THE BOTTOM LINE 221


    ![](img/a13d4428e1779878c265ff76550862e7_245_0.png)


    # FIGURE 12.18


    Performance of a PD simulation using Newton''s 3rd law for the force computation
    with and without concurrent offloading. The mean of the sub-plots is the same
    except in Figure 12.17. The performance is additionally compared against a dual-socket
    Intel Xeon processor (Sandy Bridge) execution using 32 threads. The dotted horizontal
    line is for the non-concurrent case. The solid line is for the execution using
    two groups of size 16, residing on separate CPU sockets.


    # Comparison against CPU: Implementation of the force computation scheme using
    Newton''s 3rd law (together with concurrent offloading) is at no point to satisfy
    the coprocessor, except for the coprocessor if no coprocessor is present.


    For the CPU benchmarks, we use the compute node described at the beginning of
    this chapter. The two CPU sockets of this system span two NUMA domains connected
    by the Intel QuickPath Interconnect (QPI) link. Communication over QPI, for example,
    for synchronization, potentially slow down an application compared to on-socket
    communication. Using two concurrent threads of size 16, with each group residing
    on a single CPU socket, may help gain the overall performance on the host.


    Figure 12.18 compares the performance for execution on an Intel Xeon Phi 7120P
    coprocessor and the host. The host processor with two concurrent threads of size
    16, each, is ahead to the non-concurrent execution with 32 threads by a factor
    of 1.5 for 16k particles, and by a factor of 1.2 in respect to 64k particles.
    With respect to the coprocessor execution up to a factor of 2.3 can be noted in
    favor of the coprocessor.


    With a measurable performance increase by using the concurrent kernel execution
    approach, our example supports the point that optimizing codes for execution on
    the coprocessor is of double advantage when brought back to the CPU.


    # THE BOTTOM LINE


    If offload regions do not expose enough parallelism to satisfy the threading requirements
    of a coprocessor, concurrent kernel offloading may be a good choice to gain its
    overall utilization.'
