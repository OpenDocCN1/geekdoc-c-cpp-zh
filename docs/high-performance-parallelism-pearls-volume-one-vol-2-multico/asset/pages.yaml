    # ON-THE-FLY TRANSPOSITION BETWEEN AOS AND SOA


    The results in the previous section should not be taken to mean that AoS and SoA
    are generally interchangeable without any performance impact. In fact, as a result
    of the differences in memory access pattern, different optimization techniques
    are applicable to the two layouts. Gathering the {x, y, z} data for positions
    and forces in miniMD from SOA will require three other operations: one for the
    x values, one for the y values and one for the z values. Gathering from AoS, on
    the other hand, can be thought of as a single gather of structs, followed by transposition
    between the two layouts.


    When viewed as a transpose operation, it is clear that some implementations may
    introduce redundancy. For instance, the hardware may load one element of the struct
    from the cache at a time, and thus need three accesses to read out each struct.
    If we instead read an entire struct with one access, we may reduce the number
    of memory accesses and the number of instructions required. The trade-off is that
    we must use a sequence of additional "shuffle" instructions to reorder the x,
    y, and z values.


    Figure 8.7 illustrates the AoS-to-SoA transpose process for the miniMD position
    array using SSE. We first load one entire neighbor at a time (i.e., consecutive
    32-bit values, including padding) into SIMD registers. In our example, we load
    registers with indices i, j, k, and l. We can then use a series of seven shuffle
    and permute instructions (one to construct each of the four intermediate registers
    shown, and one to construct each of the final x/y/z registers) to perform the
    transpose. To extend this sequence to instruction sets with wider SIMD, more than
    one atom be loaded into each of the vector registers. Effectively, we must treat
    a 256-bit AVX register as two 128-bit lanes, and a 512-bit IMCI register as such.


