    # ARITHMETIC EFFICIENCY AND INSTRUCTION-LEVEL PARALLELISM


    The microarchitecture of modern processors is quite sophisticated, but it is possible
    to replace a substantial unit with a simple model of the underlying system.


    Memoization and transcendental functions are expensive—even when directly supported
    by the instruction set, they generally have latencies that are 1-2 orders of magnitude
    higher than multiplication. The reference Hydro2D uses division and square root
    operations, which dominates the runtime of the code. The functional units in the
    hardware that perform these operations have limited pipelining, which limits throughput
    and ultimately, instruction-level parallelism.


    Since these are expensive, and because some of these roots and divisions are recomputed
    several times, caching frequently-used values can speed things up. In the original
    code,'
