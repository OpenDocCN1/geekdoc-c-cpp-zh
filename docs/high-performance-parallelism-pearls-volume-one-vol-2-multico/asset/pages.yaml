  md: '# CHAPTER


    # # OPTIMIZING FOR REACTING

    NAVIERSTOKES

    EQUATIONS


    Antonio Valles¹, Weiqun Zhang


    *Intel, USA, ¹Lawrence Berkeley National Laboratory, USA*


    Intel® Xeon® processors and Intel® Xeon Phi™ coprocessors continue to increase
    the number of cores and total hardware per node. This provides new parallel opportunities
    at the node level which hybrid applications (MPI + OpenMP) can fully exploit.
    But, many applications are not properly optimized to take advantage of so many
    hardware threads per node. This chapter describes analysis and parallel optimization
    done by Lawrence Berkeley National Laboratories (LBNL) with Intel Corporation
    on an application called SMC.


    # GETTING STARTED


    SMC is a combustion solver that solves the multicomponent, reacting, compressible
    Navier-Stokes equations. It is developed at the Center for Computation Sciences
    and Engineering (CCSE) at LBNL. Minimal versions of SMC are being used as a proxy
    application for architectural simulations and programming model exploration by
    high-performance computing system vendors and the Center for Exascale Model of
    Combustion in Turbulence of the US Department of Energy. Figure 4-1 shows output
    of SMC during combustion simulation. In this chapter, we use a minimal version
    of SMC for analysis and optimization.


    SMC is mainly written in Fortran with some parts in C. It is implemented within
    the BoxLib software framework, developed at CCSE, with a hybrid MPI+OpenMP approach
    for parallelization. SMC uses a finite-difference method in which the numerical
    solution to the multicomponent Navier-Stokes equations is represented at Cartesian
    grid points in three dimensions. The data are stored as four-dimensional Fortran
    arrays with the dimensions corresponding to x, y, z, and component. Since column-major
    is used for arrays in Fortran, the data are contiguous in memory in x-direction.
    In SMC, the eighth-order stencils for spatial derivatives in each dimension use
    nine grid points in that dimension.


    SMC version used in this chapter can be downloaded from GitHub ("For more information")


    This chapter will explain main optimizations on SMC. These are releases 1-5 on
    GitHub. We will discuss this in detail in the sections to follow:


    +   1. Version 1.0: Baseline


    +   2. Version 2.0: Threadbox


    +   3. Version 3.0: Stack memory


    69'
