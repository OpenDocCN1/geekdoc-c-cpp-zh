    appealing. The SIMD hardware today does not fully support parallel reads/writes
    of nonunit stride code. For instance, the gather and scatter operations performed
    on elements from different cache lines in the VEX instruction set can be regarded
    as short-hand for loads/stores when in Hofmann et al. (2014) using gather operations
    that straddle several cache lines are inefficient and consequently we will be
    better off by focusing only on the vertical loops where we can use ordinary vector
    load instructions due to the stride-1 pattern herein.


