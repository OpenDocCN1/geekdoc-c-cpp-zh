  md: '# NEO-HETEROGENEOUS PROGRAMMING 3


    # INTEL XEON PHI COPPROCESS SPECIFIC


    While most of the chapters move forward on processors and coprocessors, three
    chapters are dedicated to a deeper look at Intel Xeon Phi coprocessor topics.
    Chapter 15 presents current best practices for managing Intel Xeon Phi coprocessors
    in a cluster. Chapter 16 and 20 give valuable insights for users of Intel Xeon
    coprocessors.


    # MANY-CORE, NEO-HETEROGENEOUS


    The adoption rate of Intel Xeon Phi coprocessors has steadily increasing since
    they were introduced in November 2012. By mid-2013, the cumulative number of FLOPs
    contributed by Intel Xeon Phi coprocessors in TOP 500 machines exceeded the combined
    FLOPs contributed by all the graphics processing units (GPUs) installed as floating-point
    accelerators in the TOP 500 list. fact, the only device type contributing more
    FLOPs to TOP 500 supercomputers was Intel Xeon processors.


    As mentioned in the Preface, the 61 cores of an Intel Xeon Phi coprocessor have
    inspired a new era of interest in parallel programming. As we saw in our introductory
    book, Intel Xeon Phi Coprocessor High-Performance Programming, the coprocessors
    use the same programming languages, parallel programming models, and the tools
    for processors. In essence, this means that the challenge of programming the coprocessor
    is largely the same challenge as parallel programming for a general-purpose purpose.
    This is because of the design of processors and the Intel Xeon coprocessor avoided
    the restricted nature inherent in heterogeneous programming using devices with
    restricted programming capabilities.


    The experiences of programming the time and time again have reinforced the value
    of a common programming model—a fact that is independently and repeatedly emphasized
    by the chapter authors in this book. The take-away message is clear that the effort
    spent to tune and scaling for the Intel Xeon Phi coprocessor is time well spent
    for improving performance for processors such as Intel Xeon processors.


    # NO “XEON PHI” IN THE TITLE, NEO-HETEROGENEOUS PROGRAMMING


    Because the programming challenges are generically parallel, we knew we needed
    to emphasize the applicability to multicore and many-core computing focusing only
    on Intel Xeon Phi coprocessors, which is why “Xeon Phi” does not appear in the
    title of this book.


    However, with systems and processors combined do so in two unique challenges that
    are addressed in this book: (1) Hiding the latency of moving data to and from
    an attached device, a challenge common to any “attached” device using GPUs and
    coprocessors. Future Intel Xeon products will offer techniques that eliminate
    the data-movement challenge by being offered as processors instead of being packaged
    coprocessors. (2) Another unique and broader challenge lies in systems that combined
    incompatible computational devices. Incompatible in that used programming methods
    different enough to require separate development tools and coding approaches.
    The Intel Xeon Phi products changed all. Intel Xeon Phi coprocessors offer compatible
    coding methods for parallel programming


    ![](img/a13d4428e1779878c265ff76550862e7_33_0.png)'
