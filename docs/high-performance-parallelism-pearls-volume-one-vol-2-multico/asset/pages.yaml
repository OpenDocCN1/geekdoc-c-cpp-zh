    A second benefit is the HT siblings within a core now share all of the L1 and
    L2 cache space of that. This effectively increases the thread''s working set in
    these caches by 2-3 times over the prior technique of maintaining spatial separation
    of the work performed by each thread within a core.

    A third benefit is eliminating intracore cache evictions due to false sharing.

    The programming changes to implement the Hyper-Thread Phalanx are somewhat out
    of the ordinary for OpenMP programmers, yet are relatively easy to accomplish.
    To use the Hyper-Thread Phalanx you remove the `#pragma omp for collapse(2)` code
    structure, and insert hand partitioning of the iteration space by core and HT
    binding within core. This entails removing 5 lines of code and inserting 13 lines
    of code.


    # HOW TO DETERMINE THREAD BINDING TO AND WITHIN CORE?


    We could specify affinity and placement using environment variables external to
    the program, but this may not be suitable or reliable. It is better to place the
    least constraints and requirements on the environment variables. With one affinity
    of bindings may be best for this function, the overall application may benefit
    from a different arrangement of thread bindings. Therefore, this necessitates
    having the program determine the affinity bindings applied by the environment.
    The more effective route is for the program to perform thread-core binding.

    The files HyperThreadPhalanx.h and HyperThreadPhalanx.c were used for the improved
    performance programs.


    The primary goal of the HyperThreadPhalanx.c utility function is:


    +   - Determine the number of OpenMP threads in the outermost region of the application

    - Compute a logical core number (zero based and contiguous) for each thread

    - Compute a logical HT number within the core (zero based and contiguous) for
    each thread

    - Compute the number of logical cores

    - Compute number of HTs per core as used in the working set'
