    # VERSION 5.0: VECTORIZATION


    A key ingredient for performance on many-core architecture such as Intel Xeon
    Phi processors is to take advantage of SMC instructions. In this minimalist version
    of SMC, the computation of chemical reaction rates is relatively cheap because
    it uses a network with nine nodes. However, for computations involving a large
    network with hundreds of species, the cost of computing reaction rates can be
    significant. This is because the cost of computing reaction rates grows with the
    number of species much more than that of computing diffusive terms. Here we present
    an approach to make the computation of reaction rates more vectorize.


    Figure 4.15 is the original computation of chemical reaction rates. Note that
    the inner loop involves a call to ckwyr subroutine, which is very complicated
    and cannot easily inlined. The ckwyr subroutine works on a single point, see Figure
    4.16. It takes density, temperature, and mass fractions as inputs and returns
    the molar production rate of each species. The final results are stored in a four-dimensional
    array. This implementation cannot be vectorized due to the call in the inner loop
    that cannot be inlined and ckwyr subroutine processing only one cell at a time.


    To get chemical reaction rates to vectorize, we first need to modify ckwyr subroutine
    to take vectors of density, temperature, and mass fractions. Figure 4.17 shows
    a new implementation that can vectorize. To use this implementation, the compiler
    code was modified to generate the input vector, Yt, and use ckwyr''s output vector,
    doit, see Figure 4.18. This implementation gives a 4x speedup over the chemical
    portion of the workload on the coprocessor.


    In addition to vectorizing the chemical portion, the SIMD Fortran directive was
    added to multiple inner loops in differ where the compiler chose not to vectorize
    due to potential dependencies the compiler assumed to guarantee correctness'
