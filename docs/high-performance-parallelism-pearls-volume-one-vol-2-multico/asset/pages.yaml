  md: "# 22 CHAPTER 2 FROM “CORRECT” TO “CORRECT & EFFICIENT”\n\nBy combining the\
    \ compute_delta() with the integration step, the overhead of a separate pass through\
    \ the grid and extra synchronization is eliminated.\n\nRolling updates The vertical\
    \ arrows in Figure 2.7 show the dependencies across steps of the flux computation\
    \ and integration; for a one-dimensional row (or column) of the computational\
    \ grid, we can see that there is also a “window” of dependency.\n\nIt is possible\
    \ to complete reuse of intermediate computations and minimize intermediate storage\
    \ by performing “rolling” update along each strip of the grid:\n\n+   * First,\
    \ the whole-slab variants of the update step have been “shrunken”—namely, constprimp()/conservative_to_primitive(),\
    \ slice(), trace(), riemann(), cmpflux(), and updateConserveVars()/update(); gleftring\
    \ does not real work with any values, and has been eliminated. They now operate\
    \ on cells at a time; they take as the minimum set of inputs for the subproblem\
    \ and return their vector-valued results through output parameters.\n* To begin\
    \ a strip, a priming stage applies boundary conditions (via set_boundaries());\
    \ loads the appropriate conservative variables, and computes all quantities necessary\
    \ to determine the flux at left boundary, the flux at x, in Figure 2.7i)—any intermediate\
    \ variables that are needed for later cell updates are kept in circular buffers,\
    \ and all others are discarded. See strip_prime (Figure 2.10) for the implementation\
    \ of this code.\n* Then, to perform the updates for all cells in the strip, a\
    \ stable stage loads the circular buffers and the next conservative variable in\
    \ the strip, then computes all intermediate values needed for the next flux. The\
    \ flux from the previous step and the newly-computed one are combined in step\
    \ Figure 2.7j to update the current cell, and intermediate values that are needed\
    \ for future steps placed into the circular buffers. See strip_stable() (Figure\
    \ 2.11) for a figure of this code.\n\nAs is evident from Figure 2.7, the widest\
    \ point of dependency for a single flux at x, in step Figure 2.7 is the second\
    \ round of variable computation in step Figure 2.7d—four values are combined to\
    \ produce the output. None of the circular buffers contain more than four values,\
    \ keeping intermediate storage costs low.\n\n```\nstruct strip_work\n{\n    REAL_T\
    \ flux [4][2]; // flux at i-1/2, i+1/2\n    REAL_T left_flux [4][2]; // left_flux\
    \ at i, i+1\n    REAL_T prim [5][3]; // prim for i, i+1\n}\n```\n\nFigure 2.9\n\
    \nRolling data structure for strip_prime() and strip_stable().\n\n# THREAD-LEVEL\
    \ PARALLELISM\n\nIn the reference code, thread-level parallelism is only across\
    \ the y-dimension (or “height”) of the slab (recall Figure 2.6), which effectively\
    \ limits the amount of parallelism."
