  md: '# PERFORMANCE EVALUATION: BEFORE AND AFTER


    At the beginning of this chapter we motivated concurrent kernel offloading with
    the unfavorable scaling behavior of the above algorithm for the force computation
    in case of using a single offload (with up to 240 threads on the coprocessor)
    only. Instead of using a single offload, we now switch to the approach presented
    in this section, we use multiple concurrent offloads, each of which using 30 threads
    on the coprocessor.


    Figure 12.17 illustrates the performance increase for different numbers of concurrent
    offloads compared to a single offload using the same overall number of threads.


    In all cases we the simulation results of the underlying PD simulation and found
    almost exact agreement throughout 1000 PD update steps. Perfect agreement is not
    to be expected from different summation orders and non-associativity of floating
    point operations.


    Our performance metric is the number of billion particle-particle interactions
    per second, or "GigInteractions/s" for short (larger values are better).


    For different numbers of interacting particles, the concurrent offloading approach
    is superior to its non-concurrent counterpart. The concurrent execution scales
    almost linearly with the number of cooperating threads, and hence. For 64 particles,
    **we achieve a speed of 1.25 over the non-concurrent case**. Our initial motivation
    for use of symmetries in the force calculation together with concurrent offloading
    to the coprocessor is supported. We have shown that small-scale offload computations
    can outperform a single large-scale offload computation solving the same problem.


    ![](img/a13d4428e1779878c265ff76550862e7_244_0.png)


    Figure 12.17


    Performance of a PD simulation using Newton''s 3rd law for the force computation
    with and without concurrent offloading. In the concurrent case up to eight host
    threads offload the same force computation kernel as in the non-concurrent case,
    but with 30 threads offload: for the "120 threads" data points, 4 current host
    threads offload to the coprocessor. All values are for 1000 PD update steps using
    an Intel Xeon coprocessor for offload computation.'
