    FIGURE 12.1


    Scenarios for kernel offload to the Intel Xeon Phi coprocessor: a single process
    or thread (a) utilizes the entire coprocessor device, (b) sequentially offloads
    multiple kernels with varying computational intensity and hence verying core utilization,
    and (c) offloads multiple concurrent kernels to the coprocessor. (d) Multiple
    host processes or threads offload (multiple) to a shared coprocessor.


    +   - Multiple host processes or threads offload to a shared coprocessor: A typical
    example is a throughput-oriented single-user production environment with complex
    workflows or concurrent execution steps (Figure 12.1d).


    +   - Offloading to a shared coprocessor: If the coprocessor is virtualized, multiple
    workloads from remote nodes can be executed on it (Figure 12.1d). However, additional
    scheduling policies should be considered to avoid resource oversubscription. This
    is a typical scenario for cloud environments where not all nodes are equipped
    with coprocessors.


    This chapter focuses on concurrent offloading from applications that use either
    MPI or OpenMP to achieve parallelism on the host, as in Figure 12.1c and d. There
    are many real-world cases with potential for concurrent offloading. They range
    from batch processing of small-scale loads to sophisticated (parallel) applications
    with cooperating offloads. Beside presenting generic representatives, we will
    also cover useful techniques regarding the host and coprocessor setup in these
    cases.


    # MOTIVATING EXAMPLE: PARTICLE DYNAMICS


    A part in particle dynamics (PD) simulations is to evaluate for each $N$ particles
    the force $F_i = \sum_{ij} f_{ij}$ exerted by other particles on particle $i$,
    and to use these to evolve the entire system over time via numerical integration
    of the equations of motion. Symmetries in the cases can help reduce the effort
    for the force computation by a factor of two by using Newton''s 3rd law: $F_i
    = -F_j$. While evaluating the forces sequentially is straight forward, the same
    in parallel poses difficulties with memory constraints and synchronization. The
    problem is that $F_i$ now has contributions $F_$ from different threads. A simple
    approach is to allocate for each thread a separate buffer to hold all its contributions,
    and to merge the buffers afterwards. However, the memory consumption increases
    with the number of threads.'
