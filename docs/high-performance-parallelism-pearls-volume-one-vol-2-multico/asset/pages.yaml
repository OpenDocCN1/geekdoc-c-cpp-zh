  md: '# EULER''S EQUATION


    Euler''s equation (or more precisely, Euler''s system of equations) is system
    of partial differential equations (PDEs) that is a special case of the general
    Navier-Stokes equations of fluid dynamics wherein the fluid is inviscid; viscosity
    is treated as having a negligible effect of the dynamics. In two dimensions (which
    we consider in this chapter) it takes the


    ```

    \begin{aligned} \frac{\partial \rho}{\partial t} + \frac{\partial \rho u}{\partial
    x} + \frac{\partial \rho u^2 + p}{\partial x} &= 0 \ \frac{\partial \rho}{\partial
    t} + \frac{\partial \rho uv}{\partial x} + \frac{\partial \rho v^2 + p}{\partial
    y} &= 0 \end{aligned}

    ```


    with


    ```

    E = -\rho p + \frac{1}{2}(u^2 + v^2)

    ```


    Here $\rho$ is the density, $u$ and $v$ are the $x$- and $y$-components of velocity,
    $E$ is the total energy, and $p$ is the pressure. Note that there are only four
    PDEs (Eq. (2.1)), but the system is underdetermined; the *equation of state* (Eq.
    (2.2)) closes the system and expresses the dependent variable of the five variables
    present in the system. $\gamma$ is the adiabatic constant for the fluid, typically
    set at 1.4 for air.


    Eq. (2.1) might look peculiar because it is in conservation form; each equation
    represents a conserved quantity (mass, momentum, and energy). With proper discretization,
    conservation laws allow for useful physical properties to be maintained in the
    solutions.


    The Euler system has several important applications. It is suitable for describing
    the motion of gases in many situations and lends itself to the study of shock
    dynamics. It also results in a simpler system than Navier-Stokes while preserving
    important nonlinear behavior, and mathematically, the elimination of the viscosity
    term changes the nature of the PDE to be fully *hyperbolic*,


    We should note that the equation of state used here (2.2) is the ideal-gas law.
    More sophisticated equations of state have developed for specialized applications,
    but they ultimately have a relatively small impact on the performance of the method
    (the locality of access is no different than what we have used here).


    # GODUNOV''S METHOD


    The context in which Euler''s equations are usually used—in the study of shocks—informs
    the choice of numerical scheme that should be used in computing solutions. Hydro2D
    is a *shock-capturing* code, and uses Godunov''s method to compute solutions to
    initial boundary-value problems (IBVP) posed by the user.


    Godunov''s method was developed in 1959 by the Soviet mathematician Godunov; because
    the derivatives in Eq. (2.1) are not well-defined in the presence of shocks, it
    uses the integral form of the PDE: each discrete cell tracks an average value
    for each of its unknowns. In each timestep, we compute the average *flux* between
    adjacent cells that occurs over said timestep; this flux simply the flow of quantities
    between cells. The solution is advanced forward in time by updating cells by the
    total amount of flux that enters and leaves it. See Figure 2.1 for a diagram of
    a one-dimensional Godunov method.'
