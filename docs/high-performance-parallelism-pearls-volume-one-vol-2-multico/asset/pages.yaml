    \ suggestion to use a structure of SOA instead of an AOS. In addition to using\
    \ an SOA layout, we coalesce component elements by grouping each element by component\
    \ index instead of evaluation index. When evaluating batches of evaluations share\
    \ the same code, a single-component index is accessed at once. Consecutive component\
    \ index values in memory prevent vector gathers from occurring, which is illustrated\
    \ in Figure 6.7.\n\nThe second aspect of the implementation runs at 7.9x faster\
    \ than the first ispc implementation and 12.7x faster than the C++ implementation.\
    \ We measured the performance using only one thread to isolate the performance\
