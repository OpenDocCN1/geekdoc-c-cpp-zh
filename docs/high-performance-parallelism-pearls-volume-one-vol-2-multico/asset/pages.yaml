    We choose to use RPN because the algorithm to evaluate instructions in RPN format
    is straightforward. Figure 6.3 illustrates a simple example.


    Building the code array requires traversal of the parse tree. We use the Visitor
    Pattern to traverse each tree node and progressively append the evaluation array.
