    # SUMMARY


    Today''s Intel processors and coprocessors have a large number of cores and hardware
    threads per node. The trend to increase cores and hardware threads in future processors
    does not appear to be slowing down. To fully exploit this parallel opportunity,
    cluster hybrid application developers need to analyze and optimize their parallel
    implementations. This case study discussed methods we used to improve concurrency.
    This included how we assessed and tracked performance and scaling, tools that
    help us analyze OpenMP performance, and OpenMP and vectorization optimization
    techniques.'
