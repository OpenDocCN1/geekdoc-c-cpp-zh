  md: '# CHAPTER 3 BETTER CONCURRENCY AND SIMD ON HBM


    # SUMMARY


    The thinking process and techniques used in this chapter have wide applicability:
    focus on data locality and then threading and vectorization techniques. This way
    of thinking should be on the mind of every programmer working to design a high-performance
    application. Programming leads to improved performance on Intel Xeon processors
    and Intel Xeon Phi coprocessors.


    We have shown that good SIMD and thread performance on modern hardware is obtained
    when an implementation puts focus on data proximity. We have demonstrated the
    oriented-design used without the HBM model in order to get good performance. The
    key foundation is data structures for circular models that are chosen to match
    the desire for parallelism. The steps toward SIMD vectorization of the code are
    described while pointing out trivial and some non-so-obvious obstacles that had
    to be overcome. The techniques used by both Intel Xeon processors and Intel Xeon
    Phi coprocessors, with the superior aggregate bandwidth of the coprocessor allows
    it to scale. For this particular application, we demonstrate a single node speed
    of ~15% on the Intel Xeon Phi processor compared to Intel Xeon. The power efficiency
    of the Intel Xeon Phi processor makes its use compelling though we believe the
    memory limit of the coprocessor is now the limiting factor in getting more speed.
    The amount of this limitation should improve significantly in the next generation
    of Intel Xeon Phi coprocessors (Knights Landing).


