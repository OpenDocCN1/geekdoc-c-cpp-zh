  md: '# FROM “CORRECT” TO

    “CORRECT & EFFICIENT”:

    A HYDRO2D CASE STUDY

    WITH GODUNOV’S SCHEME


    Jason D. Sewall'', Guillaume Colin de Verdière''

    ''Intel, United States, ''CEA, France


    How can a given physical process be simulated on a computer efficiently? The answer
    is reliably complicated; physical phenomena are subtle and intricate, and modern
    computer systems sophisticated. The details of how to achieve efficient simulation
    for even apparently similar phenomena—for example, the motion of waves in the
    ocean and the wake from a powerboat—vary greatly, and the evolving state of computing
    environments adds an additional dimension of complexity to the matter.


    Computer environments today are rife with performance-mined features—several varieties
    of parallelism among them—and every efficient realization of a physical process
    on these contemporary systems must account for these features at some level.


    In this chapter, we explore a real-world scientific code for gas dynamics that
    delivers useful and correct results but with (initially) unsatisfactory performance.
    By examining the code implements and seeing how it may be mapped to modern architectural
    features, we will see its performance improve dramatically.


    ![](img/a13d4428e1779878c265ff76550862e7_36_0.png)


    # SCIENTIFIC COMPUTING ON CONTEMPORARY COMPUTERS


