    \ f_i[y]-=f_j[i]; f_i[z]-=f_j[i];\n    }\n    #pragma omp parallel num_threads(THREADS_PER_OFFLOAD)\n\
    {\n    int id=offloadID*THREADS_PER_OFFLOAD+get_thread_num();\n    double r_ij_x,\
    \ r_ij_y, r_ij_z;\n    for(int k=0; k<chunkSize; k++) {\n        int start=k+omp_get_thread_num()%THREADS_PER_OFFLOAD;\n\
    \        int increment=THREADS_PER_OFFLOAD;\n        // step (al) of update values\
    \ evenly among threads\n        for (int i=start; i<n; i+=increment) {\n     \
    \       int stop=start+chunkSize;\n            for (int j=start; j<stop; j+=increment)\
    \ { // disjoint j-values\n                r_ij_x=pos[i]-pos[j];\n            \
    \    r_ij_y=pos[i]-pos[j];\n                r_ij_z=pos[i]-pos[j];\n          \
    \      double f_ij=sqrt(r_ij_x*r_ij_x+r_ij_y*r_ij_y+r_ij_z*r_ij_z); // Newton's\n\
    \                f_i[x]-=f_ij*r_ij_x; f_i[y]-=f_ij*r_ij_y; f_i[z]-=f_ij*r_ij_z;\
    \ // 3rd law\n                f_j[x]+=f_ij*r_ij_x; f_j[y]+=f_ij*r_ij_y; f_j[z]+=f_ij*r_ij_z;\n\
