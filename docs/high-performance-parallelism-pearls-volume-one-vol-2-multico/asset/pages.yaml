    # THE N-BODY KERNEL


    To help illustrate the method, let''s assume we want to simulate the free evolution
    of nonrelativistic particles in space, for example, satellites, planets, stars,
    galaxies, etc. For such objects, Newton''s law of motion states that the sum of
    all forces applied on each particle (body) is equal to the product of its mass
    by its acceleration. Moreover, Newton''s law of universal gravitation states that
    each pair of particles attracts each other following force proportional to their
    masses, and inversely proportional to the square of the distance between them.
    For our collection of N bodies, Newton''s second law can be described by the following
    equation:


    ```

    $\forall i\in\{1,\dots,N\}, \dot{a}_i = G\sum_{j\neq i}\frac{m_j}{d_{ij}^2}u_{ij},
    \quad (11.1)$

    ```'
