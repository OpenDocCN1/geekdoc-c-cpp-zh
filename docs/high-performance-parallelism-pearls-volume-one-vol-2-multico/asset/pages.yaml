  md: '# THEORETICAL LIMIT


    A common problem when optimizing applications lies in understanding the goal (i.e.,
    how do we know

    when we stop?). We can construct a theoretical model of the application to determine
    how many

    operations are required, and use that to determine the maximum possible performance
    (often called the

    "speed of light" for a given application).


    Let us apply this idea to our problem. The N-body kernel is dominated by the computation
    of the

    force interaction of the particles which has an O(n²) complexity. The update of
    the positions has only

    O(n) complexity. The force interaction computation is dominated by the inner

    j-loop (the updates at the end of the i-loop are again of O(n)). If we consider
    the code from Figure 9.1

    and map it to the Knights Corner Instruction Set (KNCI) that use our Intel Xeon
    Phi coprocessor,

    there are:


    +   - three subtractions (vsub),

    - three multiplications and additions (vmfadd),

    - one reverse square root (vsqrt),

    - three multiplications (vmul),

    - three multiplications and additions (vmfadd).


    This could result in the code from Figure 9.4 for SP which is a direct translation
    of the above se-

    ence with a broadcast for the softening value. Due to the destructive nature of
    the

    vmfadd instruction, the value is lost and needs to be restored after each iteration.


    Assuming memory hits the L1 cache, the latency for each of these instructions
    is 4

    cycles so it will take 52 cycles to compute the interaction of 16 particles (16
    is the width of the SP vec-

    t registers in the coprocessor) for one thread. Luckily, the other three threads
    of the core overlap

    perfectly to fill the empty cycles. With 4 heads per core, it will take 56 cycles
    to compute the inter-

    action of 64 particles (except for the last iteration where it will take 3 cycles
    for all the threads to

    complete that are not overlapped; we can ignore this for a large number of particles).
    This yields 1142

    particle interactions per cycle in SP.


    ```

    vsubps (%r14,$r10), %zm7, %zm12

    vbroadcast, L.2210floatpacket.2($rip), %zm8

    vvsubps (%r9,$r10), %zm12, %zm6, %zm13

    vmfadd21ps %zm12, %zm12, %zm8

    vsubps (%r8,$r10), %zm5, %zm15

    vmfadd21ps %zm13, %zm1, %zm8

    vmfadd21ps %zm15, %zm15, %zm8

    vsqrt21ps %zm8, %zm1

    vmulps (%r15,$r10), %zm10, %zm9

    vmulps %zm9, %zm10, %zm11

    vmulps %zm11, %zm10, %zm14

    vmfadd21ps %zm12, %zm14, %zm8

    vmfadd21ps %zm13, %zm14, %zm1

    vmfadd21ps %zm15, %zm14, %zm3

    ```


    ![](img/a13d4428e1779878c265ff76550862e7_187_0.png)


    Simple precision code for the inner j-loop of compute forces without prefetching
    loop counting.'
