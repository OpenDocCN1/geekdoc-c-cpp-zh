  md: '# CHAPTER 2 FROM "CORRECT" TO "CORRECT & EFFICIENT"


    compute_delta() similarly uses the slabs to compute a series of intermediate states
    (including equation_of_state()) that ultimately yield the maximum eigenvalues,
    which are reduced. These steps expose similar threading and data-level parallelism
    as above.


    # Measuring performance


    Of course, the objective of this chapter is to improve the performance of the
    Hydro2D code and not to perform scientific experiments. We are primarily interested
    in measuring performance in a manner that is representative of the code we would
    use in an experimental setting.


    Fortunately, this is fairly simple: Hydro2D''s performance is largely independent
    of the specific initial and boundary conditions specified, so we are free to choose
    any test problem. The NewtonRaphson iterations performed in the Riemann solver
    have control that may increase runtime for flux computation on the input, but
    this is only significant for pathological cases.


    To capture the sensitivity of the code to problem sizes, we will explore a variety
    of problem sizes and generally normalize our results to the time taken to process
    a single cell in each timestep. The time covered in each step is dictated by the
    stability condition, which is a product of the solution state and the grid spacing.
    This means that two different initial conditions may take a differing number of
    steps to reach a given simulated amount.


    Figure 2.8 shows the performance of the reference code in cell-steps/second. The
    coprocessor is less than 2 x the performance of the processor, and parallel efficiency
    is quite low.


    # OPTIMIZATIONS


    The performance of the reference code is unsatisfactory despite having for parallelism.
    As we shall show, this is partially due to inefficiencies in some of the high-level,
    conceptual constructs in the code, and partially due to inefficient translation
    into code. Just as adding a #pragma omp parallel for a loop does not guarantee
    parallel efficiency, nor does #pragma vector necessary productive vectorization.


    We will describe how the reference falls and how it may be improved.


    ![](img/a13d4428e1779878c265ff76550862e7_49_0.png)


    Figure 2.8

    Performance of the reference Hydro2D code on all cores of the processor and the
    coprocessor in cell-steps/second.'
