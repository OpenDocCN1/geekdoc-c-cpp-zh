  md: '# EXAMPLE IMPLEMENTATION 121


    # Evaluating the expression array


    System evaluation is the section of computation that we focus on optimizing because
    it is the computation that is embedded in a parent simulation code. Recall that
    our goal is to evaluate N trees, sharing the same system to be evaluated. Therefore,
    the constructed code is shared among all evaluation instances. System evaluation
    assumes that M×N-component values have been calculated and N is the number of
    instances of the tree to be evaluated. The function in Figure 6.4 is called for
    each instance of the fault, looping over each entry in the tree and handling the
    operations according to instruction.


    The code in Figure 6.4 implements AND P(A)*P(B) and OR (A)+P(B)-P(A)*P(B) operations
    on input components. A status for each evaluation of the tree is held in an array
    to do error checking. After the code has been executed, the final values are on
    the top of evaluation''s stack.


    # USING ISPC FOR VECTORIZATION


    The system evaluation is straightforward to understand but not take advantage
    of SIMD execution units. Evaluating fault trees of the same system is a data parallel
    operation; it is a perfect candidate for SIMD hardware. One approach for writing
    explicit SIMD code is to use intrinsic functions. While this may seem straightforward
    in our small example, it presents a large burden on developers to maintain the
    implementations for SSE4, AVX/AV2, IMCI (on the processor), AVX-512, and beyond.
    In addition to higher maintenance cost, intrinsic-based code is less readable
    and harder to understand. To elevate these, we use the open-source Intel SPM Program
    Compiler (ispc). The code in Figure 6.5 implements the same logic as the previous
    C++ implementation, but now with ispc. The only difference is the introduction
    of ispc-specific qualifiers with which variables are unnamed across gaps. Additionally,
    the evaluate function (ispcCode) is defined in ispc to take advantage of the ispc
    “foreach” structure. Using “foreach” in place helps the compiler better map loop
    iterations to SIMD lanes for execution. With this is version of the code, we can
    see a 5.7x speedup from the regular C++ implementation. While it is unclear whether
    we do a good job by vectorizing the implementation, like because it cannot make
    good assumptions about the switch statements being traversed coherently in gaps.


    The two implementations iterate over all instructions per execution. Rearranging
    the computation to iterate over each evaluation per instruction helps how the
    code should be vectorized. The version in Figure 6.6 implements iterations over
    all evaluations per instruction.


    Notice that the function in Figure 6.6 is to use ispc “foreach” for each evaluation
    per instruction (e.g., the cases in the switch statement). This requires a local
    buffer of values and inlets instead of using a single Varying rvalue. The buffers
    are sized by the section size, which minimizes the local array footprint while
    being able to call the evaluate() function to be thread safe. The “foreach” loops
    are better to figure out how to vectorize the code.'
