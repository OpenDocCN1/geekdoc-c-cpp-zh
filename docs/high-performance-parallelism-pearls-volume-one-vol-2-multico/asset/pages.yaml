  md: '# Preface


    This book draws on 69 authors who share their parallel programming, inspired by
    the highly parallel Intel® Xeon Phi™ coprocessors, unlocks performance on both
    processors and coprocessors. In doing so, many of the most critical challenges
    and techniques in parallel programming are explored with exciting results. Most
    chapters show how to scale and vectorize well, which will help extract more performance
    from multicore processors as well as the many-core Intel Xeon Phi coprocessors.
    Other chapters help light on harnessing neo-heterogeneous systems that combine
    Intel® Xeon processors and Intel Xeon Phi coprocessors in a system offering their
    common programming models. We have included chapters with expert advice on the
    unique aspects of deploying, managing, monitoring, and working with these neo-heterogeneous
    systems and clusters.


    # Inspired by 61 cores: A new era in programming


    What has been more remarkable than the obvious success of the Intel® Xeon Phi™
    coprocessors has been the awakening that the Intel Xeon Phi coprocessor has brought
    to parallel programming. The coprocessor has truly brought us all the dawn of
    a critical new chapter in programming. We have seen that the appeal of parallel
    programming for as many as 61 cores is far higher than It has been awakening both
    interest in adding parallel programming techniques into applications for the first
    time as well as enhancing already parallel applications. It is encouraging parallel
    programming that truly scales instead of merely limping along with “okay,” sometimes
    performance improvements that were seen when targeting only a small amount of
    parallelism on a quad-core processor.


    Intel Xeon Phi coprocessors have given an evolutionary path to parallelism that
    includes explosive opportunities for those who are willing to learn to unlock
    them. This has been done without requiring new programming models, new languages,
    or new tools. This book offers insights into unlocking the explosive potential
    by highlighting programming that works, and ideas how to rethink old techniques
    in light of the possibilities of neo-heterogeneous programming.


    While we thank the authors with an earlier section dedicated to acknowledgments,
    we cannot thank them enough. The authors of this chapter found this spent time
    away from their influential work of programming these inspirational and powerful
    machines, in order to explain their work so we might all learn from their successes.
    We hope you enjoy and benefit from their shared efforts, and we hope that leads
    to your own successes in this new era of parallel computing.


    Jim Jeffers and James Reinders

    Intel Corporation

    November 2014'
