  md: '# 130 CHAPTER 7 DEEP-LEARNING NUMERICAL OPTIMIZATION


    Data-driven model fitting can be phrased as a form of function optimization where
    a set of model parameters are adjusted to fit some dataset with a minimum error.
    The error is determined by an objective function, sometimes called a cost function,
    which evaluates how well the model fits the data given a set of model parameters
    (Figure 7.1).


    The LMS (mean squares objective) function is commonly utilized to fit a model
    to a set of N-observed data points that represent a curve or surface. The LMS
    error defined in Figure 7.2 is always positive, which means a perfect fit will
    result in a zero error. Due to numerical precision issues, noisy data, and other
    challenges, modeled rarely achieve a zero error. The numerical optimization techniques
    used to determine the model parameters can find local minima, a low point in the
    cost function from which the optimization cannot escape. There is no guarantee
    that the best overall, or global minimum, will be found, but the error value reported
    by the LMS objective function can be used to get a sense of how well the model
    represents the data.


    The widespread adoption of machine-learning and numerical optimization techniques
    for research throughout industry demonstrates that models based on empirically
    determined parameters (e.g., linear regression, nonlinear regression, neural networks,
    etc) provide solutions that are "good enough" or are the only practical approach
    to data size, complexity, noise, and other issues even with the challenges of
    local minima.


    Training artificial neural networks (ANNs) can be expressed as a function optimization
    that seeks to determine the best parameters (e.g., the model parameters or internal
    network weights and biases) which will minimize the error on a training dataset.
    This fitting or process is computationally expensive as it requires repeatedly
    evaluating an objective function with different parameter sets. The runtime of
    each objective function evaluation is $O(N_{parameter} * N_{data})$ since the
    error must be calculated for each example in the training data. In most cases,
    number of parameters, $N_{parameter}$ is small relative to the size of the training
    data, $N_{data}$ which means the overall runtime is dominated by the size of the
    dataset. In fact, the over-specification of data relative to the number of parameters
    is important so the ANN does not memorize the training dataset. This is why cross-validation
    datasets (e.g., datasets containing unique examples of the data that are not presented
    to the ANN during training) are so important, because cross-validation detects
    cases where the ANN fits the training data well but generalizes poorly.


    Parallelization of a data-parallel objective function can result in significant
    runtime speedups over massively parallel computers as indicated by Figure 7.3,
    which shows the runtime decreases as a


    ```

    Error = func(p_0, p_1, ..., p_k)

    ```


    # FIGURE 7.1


    An objective function.


    ```

    Error = \sum_{i=1}^{N} (Known_i - Predicted_i)^2

    ```


    # FIGURE 7.2


    Sum of squares of differences error.'
