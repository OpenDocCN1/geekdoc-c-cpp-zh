    # ORGANIZATION OF THIS CHAPTER


    When offloading multiple kernels to the Intel Xeon coprocessor, the partitioning
    of the device is most important. Placing work on the coprocessor without setting
    the stage appropriately may result in degraded performance, because groups of
    threads may interfere with each other in an unfortunate way. In Section "Coprocessor
    device partitioning and thread affinity" we show how to achieve a particular thread-to-core
    mapping on the coprocessor. We we study the impact of different affinities on
    the performance of multiple-scale dgemm computations, using the Intel Math Kernel
    Library (MKL), to emphasize the significance of well-conceived thread placements.


    Apart from the kernel execution, data transfers between the host and the coprocessor
    also affect the performance. They are needed at the beginning and at the end of
    the execution. Frequent data transfers between successive kernel offloads—as in
    iterative algorithms—can slow down an application significantly in the concurrent
    case, even though they have minor impact when only a single host thread or process
    offloads to the coprocessor. In Section "Concurrent data'
