  md: '# Computation scheme


    The following is performed each step time to advance the solution to the next
    time level:


    **Update** According to dimensional splitting, updates are done in alternating
    dimensions in a $x \rightarrow y/y \rightarrow x$ alternating pattern; each update
    consists of a **flux computation** where Riemann problems are constructed and
    solved at each cell interface to update the axis. Riemann problems in are independent.
    When a flux has been computed, **integration** in time can proceed.


    **Timestep computation** For integration to be stable, the *Courant* number of
    the solution must be computed based on the state in each cell and reduced. this
    is a reduction operation.


    # Data structures


    Hydro2D has very simple data structures; the solution is stored in a regular grid
    with two cell "halo" to simplify boundary computations. The grid is ordered such
    that each of the $[\rho, \rho u, \rho v, E'']$ variables are stored in its own
    "plane." We have assumed y-ordering for spatial dimensions; due to the symmetry
    of the problem, x-major would be equally suitable.


    Aside from the global state, the reference version of Hydro2D has a secondary
    data structure that is used for intermediate storage.


    **The Slab** Hydro2D reference code performs work in a slab, many-layered grid
    with smaller dimensions than the global state. This is called the *slab* and it
    allows out-of-place computation and serves as a work-sharing construct and structure.


    In each step, the partition of a solution grid is used for both the x- and y-dimensional
    updates and updates are always done in copy "rows" and y "columns" to handle boundaries
    without further copies. Data copied to/from the slab to/from the global grid is
    transferred for the x-pass, and therefore the slab must always be wide enough
    to accommodate the range of x- and y dimensions of the grid (the dimension of
    the slab is a user-selectable parameter).


    See Figure 2.6 for a diagram of this procedure.


    **Key functions** there are 11 functions responsible for the primary computation
    in the reference; several of them are trivial in implementation, each is found
    in its source file. A brief summary follows:


    ```

    compute_delta() : Computes eigenvalue among the local Riemann problems to-

    the largest timestep size (compute_delta.c:159).

    ```


    ```

    hydro_godunov(): the toplevel routine for updates; it calls nearly all of the
    following

    to populate the slab, compute updates, and write them back. A parameter controls
    which dimensional

    pass is performed (hydro_godunov.c:62).

    ```


    ```

    gatherConservativeVars() : returns the stored solution from a subregion of the
    solution

    grid to the slab''s conservative variable storage (conservar.c:48).

    ```


    ```

    constprim(): (partially) converts the conservative variables in the slab to the
    primitive form

    needed for flux computation (constprim.c:48).

    ```'
