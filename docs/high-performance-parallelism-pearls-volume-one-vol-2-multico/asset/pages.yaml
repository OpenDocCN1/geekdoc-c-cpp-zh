  md: '# INTRODUCTION


    James Reinders


    Intel Corporation


    We should “create a cookbook” was a common and frequent comment that Jim Jeffers
    and I heard after Intel® PhiTM Coprocessor High-Performance Programming was published.
    Guillaume Colin de Verdi was early in his encouragement to create such a book
    and was pleased when we moved forward with this project. Guillaume matched on
    words by coauthoring the first chapter with Jason Sewall, From “correct” to “correct
    & efficient”: a Hydro2D case study with Godonov’s scheme. Their chapter reflects
    a basic premise of this book that the sharing of experience and success can be
    highly educational to others. It also contains a theme familiar to others who
    program the massive parallelism of the Intel Xeon family: running code on Intel
    Xeon processors is easy. This lets you quickly focus on optimization and the achievement
    of high performance—but we need to tune for parallelism in our applications! Notably,
    we see such optimization work improves the performance on processors and coprocessors.
    As the authors note, “a rising tide lifts all boats.”


    # LEARNING FROM SUCCESSFUL EXPERENCES


    Learning from others is what this book is all about. This book brings the collective
    work of numerous experts in parallel programming to share their work. The examples
    were selected for their educational content, applicability, and success—and you
    can download the codes and try yourself! All the examples demonstrate successful
    approaches to parallel programming, but not all the examples scale well enough
    to make an Intel Xeon Phi processor faster than a processor. In the real world,
    this is what we face and reinforces that we are not bashing out: a common programming
    model matters a great deal. You see that notion emerge over and over in real-life
    examples including in this book.


    We are indebted to the many contributors to this book. In this book, you find
    a rich set of examples and advice. Given that this is the introduction, we offer
    a little perspective to bind it together somewhat. Most of all, we encourage you
    to dive into the rich examples, starting in Chapter 2.


    # CODE MODERNIZATION


    It is popular to talk about “code modernization” these days. Having experienced
    the “inspired by 61 cores” phenomenon, we are excited to see it has gone viral
    and is now being discussed by more and more people. You will find lots of “modernization”
    shown in this book.'
