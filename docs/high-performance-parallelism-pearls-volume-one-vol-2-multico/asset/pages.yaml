    # CHOOSING AN APPROPRIATE LAYOUT: AOS VERSUS SOA


    As discussed previously, the choice of whether to lay out data in AoS or SoA should
    be made based on access pattern—a rule of thumb: if the data is accessed via indirection
    and multiple elements are accessed from each, use AoS; otherwise, use SoA.


    To understand this rule of thumb, consider the memory access patterns of the best-
    and worst case/scatter operations for both data structures, using a SIMD width
    of N, a structure of M elements, and a cache line size (in elements) of C, as
    shown in Tables 8.1 and 8.2. The best case for both layouts is when the indices
    of the elements being gathered/scattered are continuous; the worst case for both
    layouts is when the worst case accounts for the fact that, without proper attention
    to alignment, the data being accessed may spread across cache lines.


    To apply these equations to miniMD, running in single process on the processor,
    we have N=16, M=3, and C=16 (since a 64-byte cache line can hold 16 4-byte floating-point
    numbers). Since we access all components of an atom''s position and force, we
    are concerned with the second of equations. Since the neighbors of each atom are
    non-continuous, we expect to touch three times cache lines per gather/scatter
    we use SoA instead of AoS. By setting M=4 (i.e., padding the string with one extra
    element), we can guarantee alignment and reduce the worst-case number of cache
    lines by a factor of two.


    miniMD already uses AoS, and so converting to SoA should not be expected to improve
    performance. Indeed, in our experiments we observed a slight (<5%) slowdown on
    both platforms. That the performance difference is so small reflects that miniMD
    is not memory bound—rather, the instruction overhead of the gather/scatter operations
    is the bottleneck. As explained previously, loading {x, y, z} data from AoS or
    SoA are both operations, and therefore the instruction


