    training a single ANN using MPI and up to 3000 coprocessors on the TACC Stampede
    supercomputer (Figure 7.3). It is expected that future systems containing thousands
    of coprocessors will also exhibit the same near-linear scaling behavior to deliver
    exascale performance.


