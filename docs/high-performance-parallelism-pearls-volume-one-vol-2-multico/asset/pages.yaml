    \ better SIMD scaling (and even some caching benefits). Evaluating trees is an\
    \ embarrassingly parallel operation; thus, implementing a multithreaded solution\
    \ is very straightforward.\n\n# OTHER CONSIDERATIONS\n\nScience and engineering\
