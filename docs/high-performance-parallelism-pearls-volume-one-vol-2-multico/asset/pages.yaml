    # Persistent thread groups and affinities on the coprocessor


    Both Leo and OpenMP 4.0 use the Coprocessor Offload Infrastructure (COI) API to
    create coprocessor-side processes and thread(s)/group)s together with memory buffers
    and communication channels between the coprocessor and the host. For each process
    that offload works to the coprocessor, there is a corresponding process on the
    coprocessor. In the context of this, at least many threads exist as there are
    threads that have offload pragmas along execution paths. Host threads and corresponding
    coprocessor-side threads are linked by a so-called COIPipeline (see Newborn et
    al., 2013). The COIPipeline data type implements a FIFO command queue for kernel
    invocation and data transfers from it up to several kilobytes—larger amounts of
    data are transferred using COIBuffers, triggered by kernel invocations via the
    COIPipeline. The important point is that COIPelines persist per-thread connections
    between the coprocessor and the host are established within OpenMP parallel regions


    > NOTE

    ive (current) offloads inherit thread configurations of the previous offloads
    unless the shapes of the parallel regions change. Applying a particular thread
    pinning scheme right at the beginning of an application thus persist throughout
    the entire execution.


    # CONCURRENT DATA TRANSFERS


    When offloading computations to the coprocessor, data transfers between the coprocessor
    and the host take place at the beginning and at the end of the computation, but
    also in-between, for example, successive offloads. Although in the concurrent
    offloading each thread has a separate COIPipeline for kernel invocation, in the
    current COI implementation all data transfers within the same process context
    use a shared data channel to the coprocessor. When using OpenMP resources, on
    the host, data transfers can suffer from implicit serialization and contention
    for shared COI resources, causing kernel serialization.


    Offload data transfers with MPI on the host can use multiple data channels to
    the coprocessor. Applications with frequent data transfers between host and coprocessor
    should get better performance with MPI on the host instead of threading. However,
    this applies only if messages are small. For larger messages a single data transfer
    can saturate the PCIe bandwidth and concurrent data transfers are effectively
    serialized.'
