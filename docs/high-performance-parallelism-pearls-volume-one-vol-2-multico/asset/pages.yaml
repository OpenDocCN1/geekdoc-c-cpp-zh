    # PERFORMANCE-ORIENTED ARCHITECTURE


    Performance and efficiency have always been a primary focus of the makers of computer
    hardware, and a great deal of the sophistication in modern computing architectures
    exists to address performance directly.


    **Memory subsystem** memory has been organized in a hierarchical fashion for decades,
    with a stepped progression of containers that progressively diminished capacity
    for increased bandwidth and latency. In addition to memory, nearly every contemporary
    computer has at least two levels of cache, with three becoming more common. The
    way the memory subsystem behaves within multicore and multiset systems can also
    be significant.


    The steadily widening gap between main memory and compute capacity is partially
    responsible for the memory hierarchy, and the very role the working set and cache
    capacity pays in achieving performance cannot be neglected.


    Virtual memory is also very common on contemporary systems, which now support
    a variety of page sizes. Hardware support for paging has reached the point where
    most codes need not worry about the capacity of the translation lookaside buffer
    (TLB), but there are situations where attention must be paid.


    **Thread-level parallelism** For a decade, nearly every mainframe processor has
    seen increasing of cores, and multi-socket configurations made shared-memory parallelism
    available in workstations and before that.


    By increasing the number of control paths and functional units, multicore and
    multiset systems offer a relatively familiar mechanism for increasing performance.
    The introduction of hardware supporting simultaneous multithreading has been a
    source of confusion—“hardware threads” supported by a single core are intended
    to make it easier for to use all of the resources on a core, but their use does
    not typically increase the facilities available on a core.


    **Data-level parallelism** While it shares some similarities with the vector processors
    popular in 1980s, modern single instruction, multiple data (SIMD) instruction
    sets generally are built full-width functional units and benefit from many of
    the superscalar execution features present in hardware. SIMD generally performs
    best on “packed” input data, and by nature penalizes control divergences.'
