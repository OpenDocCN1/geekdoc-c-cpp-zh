  md: '# # DYNAMIC LOAD BALANCING USING OPENMP 4.0


    Gilles Civario, Michael Lysht

    ICHEC, Ireland


    For many years, OpenMP has been the model of choice for programming on shared
    memory multiprocessors within the high-performance computing community. Although
    OpenMP is promoted as being easy to use and allows incremental parallelization
    of codes, naive implementations frequently yield poor performance. In practice,
    with other models like MPI, the same care and attention should be exercised over
    algorithm and hardware details when programming with OpenMP.


    This is even more so the case now that the newly released OpenMP 4.0 standard,
    supporting an offload mode, can take advantage of emerging many-core processors
    like the Intel® Xeon Phi™ Coprocessor. In many cases, employing OpenMP on a general
    processor (e.g., a multicore processor as an Intel® Xeon® processor) can be relatively
    straightforward, however, taking advantage of all the resources available on a
    heterogeneous system, such as those on “Stampede” and “Tian-2” node which uses
    both Intel Xeon Phi coprocessors, can be far less so. For example, determining
    the optimal approach for managing data transfers between a “host” processor and
    a coprocessor “device” (or multiple devices) in parallel can pose several challenges.
    On top of this, an extra layer of complexity is added in ensuring that the balance
    of workload offloaded to device and what remains on the host is optimal. In this
    chapter, by many-body sample, we guide the reader from a serial version to a fully
    parallelized version of the algorithm, where all processing elements available
    on a heterogeneous processor/coprocessor platform are exploited and each device
    automatically assigns the optimal amount of work on a dynamic basis so that the
    achieved speedup is maximized. Our dynamic load-balancing method is entirely written
    in standard OpenMP 4.0, which makes it perfectly portable, and generic enough
    to be easily adapted to a wide range of computing problems such as those found
    in astrophysics and molecular dynamics. This makes it particularly interesting
    not for code developers but also for software vendors to distribute binary versions
    of their codes, without obfuscating the sources or sacrificing efficiency.


    # ## MAXIMIZING HARDWARE USAGE


    In the rest of this chapter, we use the traditional terminology in the field of
    many-core accelerators. By CPU, processor, or host system, we generally mean the
    Intel processor (CPU) based computing system. By processor, device, or accelerator,
    we mean the Intel Xeon Phi coprocessor. We will also use the term “compute device”
    in the terms which applies to both the processor and CPU.'
