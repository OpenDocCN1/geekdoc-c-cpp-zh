  md: '# GATHER/SCATTER PATTERNS IN MOLECULAR DYNAMICS 145


    # GATHER/SCATTER INSTRUCTIONS IN INTEL® ARCHITECTURE


    Complete understanding of our optimizations requires some knowledge of Intel''s
    instruction sets. Of particular importance is the support for gather and scatter
    operations. See Section "For more information-" for the instruction set documentation.


    For programs using Intel® Streaming SIMD Extensions (SSE) and Intel® Advanced
    Vector Extensions (AVX), gather and scatter operations both need to be performed
    with cache loads/stores and shuffle instructions. The cache loads/stores read
    or write the individual data elements, and the shuffles (pinsrd, insertf128) insert
    or extract individual elements/groups of elements into or out of registers.


    AVX2 includes several flavors of gather instructions. These take the base address,
    a set of 32-bit or 64-bit integer indices packed into a SIMD register, and a completion
    mask stored in the bits of a SIMD register—elements whose mask are set gather;
    other elements are not gathered, and the corresponding destination element is
    unmodified. The instruction is clear on completion.


    The Intel® Initial Many-Core Instructions (IMCI) used on the current generation
    of Intel Xeon coprocessors include both a gather and a scatter instruction. The
    gather instruction is similar to the AVX2 gather, but uses a mask register to
    hold the completion mask. Further, the instruction reads a single (typically,
    64 bytes wide) cache line. Data may spread across multiple cache lines, software
    tests to see if all elements have been read, and if not, loops back and re-executes
    the instruction. Thus, performance of a gather operation exceeds the distance
    (in memory) between data being gathered. The scatter instruction is analogous;
    instead of reading elements from memory, it writes values contained in a source
    SIMD register to elements in memory.


    Finally, AVX-512 contains gather and scatter instructions very similar to the
    IMCI instructions, but like the AVX2 gather instruction, they read or write all
    elements in one instruction execution, regardless of how many cache lines they
    need to touch. AVX-512 instructions will be supported by the next generation of
    Intel Xeon coprocessors, and processors, denoted by Intel as "Knights Landing."


    > NOTE\SSE introduced floating-point SIMD capabilities to Intel architectures,
    with instructions operating on 128-bit registers. New instructions were introduced
    in SSE2, SSE3 and SSE4, but SIMD remained fixed until the introduction of 256-bit
    instructions in AVX. Similarly, AVX introduced new instructions without altering
    SIMD width. Intel increased SIMD width to 512-bit, but has instructions only to
    the current generation of coprocessors; AVX-512 also increases SIMD to 512-bit,
    but will additionally support SSE and AVX instructions.


    # GATHER/SCATTER PATTERNS IN MOLECULAR DYNAMICS


    Molecular dynamics is an example of an N-body simulation, with applications simulating
    the movement of a potentially large number of atoms and molecules (i.e., bodies)
    through space in a relatively simple manner—each atom has a total force exerted
    on it by others, which in turn affects its velocity and position.


    Profiling miniMD, our chosen molecular dynamics code, (e.g., with Intel® VTune™
    Amplifier) highlights two key hotspots. The first of these, accounting for almost
    80% of runtime, is the force'
  merge: -1
