  md: '# MPI TASK LOCATION 227


    The nodes in modern HPC have multiplerocessors, coprocessors, and graphics accelerators.
    Each coprocessor and graphics device have its own memory, while the processors
    share memory. Hence, devices like the Intel Xeon Phi coprocessor have a uniform
    memory access (UMA), and the processors have a nonuniform memory access (NUMA)
    memory. Also, not all of the processors and devices may be connected directly
    to the network interface.


    Multicore systems, launching an MPI task on every core is a common practice, and
    a node may have 10s of tasks. When all cores are occupied by an MPI task for a
    generic program, a random mapping is as good as any. However, for applications
    in scientific domains that communicate between neighbors, aggregate communication
    through a single-node task, mapping may enhance communication performance, as
    explained below


    In systems with coprocessor, it is more likely that MPI hybrid programs will drive
    several MPI tasks on the host and a few or less on the coprocessor, the OpenMP
    parallel regions will employ a different number of threads for host and device
    regions. With hybrid programs across heterogeneous architectures, asymmetric interfaces
    and NUMA architectures, it is understood that positioning tasks and threads will
    be more important on the modern HPC systems.


    Unless you have an architecture design of a node there isn''t much you can do
    to determine hardware location of the cpu-ids and intra-device connections. Fortunately,
    since about 2010 the Portable Hardware software package, called hwloc, has been
    available to detect and list NUMA memory nodes (processor+local memory) and I/O
    devices such as InfinBand HCAs, MPI bridges, hwloc does not require root access,
    so users can download, install and run hwloc in their own domains.


    Figure 13.3 shows the architectural features of a node on the Stamp system. This
    diagram will disclose configuration details needed in making task and thread assignments
    to the host. First, the two containers labeled Socket P0 and P1 are the eight-processors
    of the compute host. In numa pala, a NUMA "node" is a processor and its memory.
    The "16GB" memory designation for the NUMA node is the local memory for the coprocessor.
    The processors and their memory hierarchy on the de labeled NUMANode P0 and P1
    (The Socket is the usual name in HPC circles for the packaged processor device
    and the mechanical support mechanism of the motherboard.) We will use NUMA node
    and socket interchangeably.


    Within a socket the cores are labeled as PU (Processing Units) P0... P7, and P8#...
    P15 for Sockets 0 and 1, respectively. If Hyper-Threading is turned on, each gray
    box has two processors These Units are the physical index as set by the BIOS/OS.
    They are also recorded in the /proc/cpuinfo "processor" number and when mapping
    tasks (ranks) and threads (ids) to processors.


    On the right-hand side in each NUMA node are the interconnects. The lines are
    express lanes and in NUMA node #0, the cpu bus of the Socket #0 is connected to
    Ethernet (eth0/1) and a disk (sda). In NUMA node #1, Socket #1 is connected to
    the Infiniband HCA (infin4_0) and the Intel Xeon Phi coprocessor (mic) is attached
    to the PCI 8086:22controller.


    Once you have the architecture laid, you are in position to make intelligent decisions
    about placing MPI tasks and threads.


    Figure 13.4 categorizes and illustrates how tasks (white disks as possible hybrid
    threads) will be distributed between the processors and coprocessors on the Stamp
    system. As mentioned earlier, the Pure MPI approach is impractical, unless there
    is a trivial amount of communication, and the communication storage per task is
    small on the coprocessor. The host-only MPI (+offload)


