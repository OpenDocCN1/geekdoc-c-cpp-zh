    FIGURE 13.1


    Single processor nodes in early days of MPI computing.


    ![](img/a13d4428e1779878c265ff76550862e7_249_1.png)


    FIGURE 13.2


    Multiprocessor, many-accelerated nodes, connected through a switch hierarchy,
    in a modern HPC cluster.


    With this in mind, high performance of HPC applications now requires selecting
    an optimal number of MPI tasks (and threads) to use, positioning the tasks, and
    balancing the workload.


    # MPI TASK LOCATION


    In the early days of MPI, the compute nodes, as depicted in Figure 13.1, were
    simple and there was no concern about positioning MPI tasks. The mpirun launcher
    had a few hostnames, and with a single MPI process (task) on each host (node).
    Each MPI process was assigned a rank ordinarily, according to the position in
    the list. By rearranging the list, a different mapping between the ranks and the
    hardware processors could be achieved, though there was no need to do that here
    because the communication interconnects were symmetric, down to the (single-core)
    processors.'
