    Figure 2.11—Contd


    The storage, communication, load-balancing penalties incurred by the slab scheme
    suggest that an alternative could be found. We have transformed the reference
    code to use a domain-decomposition approach we refer to as “tiling.” See Figure
    2.12 for a visual depiction.


    The simulation grid is divided into rectangular tiles through a series of cuts
    along the x- and y-dimensions; the tiles are then assigned to threads. This scheme
    does not necessarily require a one-to-one mapping of tiles to threads, but our
    current implementation only supports the one-to-one case. Each tile has independently-allocated
    set of solutions for its variables, as well as dimensions, strides, and other
    bookkeeping information (see Figure 2.13).


    Halo regions contain four (for each cardinal direction in two dimensions) halos
    of width two that are used to communicate between tiles and boundary conditions
    (tiles sharing an exterior with the original grid). The edges are {x,y}_{y,var}_stride
    and {x,y}_edges in the tile structure.


    Each tile has its own grid (smaller dimensions); the updates are applied in the
    same order and compute each tile by x- and y-passes independently. After a pass
    is completed, it is necessary for each tile to update some of its neighbor cells
    with the most recent integration data via the functions send_(low,high,{x,y}_edge).
    Before an x-pass, the halos must be exchanged, and before each y-pass, y halos
    are exchanged. The timestep calculation is done locally as per x-passes in odd-numbered
    steps and the remainder is carried out among all tiles (Figures 2.14, 2.15 and
    2.16).


    Reducing communication to minimize overhead and the issue of false sharing between
    tiles, we allocate each halo region so that it shares no cache with the tile itself
    or other halos; then, during communication phase, each tile copies its edge regions
    (width two) to the appropriate neighbors.'
