  md: '# DIRECT N-BODY CODE 177


    content plays a critical role in determining the relative performance of these
    different O(N)/O(log N) algorithms. The FFT is known to have as few as 2Nlog operations
    and multigrid could have as many as 5N operations. The FMM on the other hand would
    typically have a much larger constant. However, the use of translational and rotational
    symmetry while prescribing the position of points can reduce this constant significantly.


    Comparing FFT FMM is not fair because FMM has a higher spatial resolution per
    unit, so comparing for the same N is not fair. However, for fields that have local
    features or discontinuities, the homogeneous spatial resolution of FFT certainly
    bears a disadvantage. Furthermore, when translational and rotational symmetry
    is utilized in the FMM by prescribing the position of points, it can use BLAS
    3 operations much more efficiently than multigrid. Therefore, FMM becomes faster
    than multigrid to solve the same problem with the same accuracy in cases.


    The FMM in the traditional sense requires a Green function solution; so the type
    of scientific applications that it can handle is limited to those that have a
    Green function. Generalization of the FMM to hierarchical low-rank approximations
    enables the framework to be applied to a wider range of applications. These methods
    use low-rank approximation methods such as rank-revealing QR, truncated SVD, or
    adaptive code approximation of multipole expansions. This frees the FMM from its
    dependence on the existence of Green’s functions and can be applied to problems
    like variable coefficient Poisson equations or covariance matrices, which were
    not solvable with the original FMM.


    When predicting the performance of FFT, FMM, and multigrid on future architectures,
    a useful indicator is communication complexity since the bottleneck of any algorithm
    becomes the communication as it approaches its limit of parallel scalability.
    FFT has a communication complexity of O(log P), for d-dimensional decomposition.
    Multigrid also has a communication complexity of O(log P). We have recently been
    able to prove that FMM and multigrid are communication optimal. This proof for
    O(log P) of FMM can be extended to its dealgebraic variants as well.


    # DIRECT N-BODY CODE


    We will now show an example of a direct N-body kernel, first in C language and
    using SIMD intrinsics. The plain N-body kernel is known in Figure 10.1. We define
    eight arrays that describe the properties of the body. The arrays x, y, z are
    the coordinates, m is the mass/charge, p is the potential, and ax, ay, az are
    the acceleration in each direction. The equation we calculate is the smoothed
    Laplace potential


    ```

    $$\phi_i = \sum_{j=1}^{n} \frac{m_j}{r_{ij}}$

    ```


    and acceleration


    ```

    $a_i = \nabla\Phi = -\sum_{j=1}^{n} \frac{m_j r_{ij}}{r_{ij}^3}$

    ```


    where


    ```

    $r_{ij} = \sqrt{(x_i-x_j)^2 + (y_i-y_j)^2 + (z_i-z_j)^2} + \epsilon2

    ```


    is the distance between the bodies at i and j, and $\epsilon$ is the smoothing
    factor.'
