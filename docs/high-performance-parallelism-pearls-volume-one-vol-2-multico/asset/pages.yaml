  md: '# 194 CHAPTER 11 DYNAMIC LOAD BALANCING USING OPENMAP 4.0


    +   - Managing device will require one OpenMP thread on the host, and will therefore
    reduce by the number of threads available for computation on the host. This will
    have a limited impact for hosts with a large number of cores like our testing
    machine, but could become noticeable overhead.


    After this first step has been addressed, the next step is to distribute the work
    over the host and device. Here again, the principle is quite simple and consists
    in slightly modifying our Newton function so that it accepts two extra parameters,
    corresponding to the "start" and "end" indices of the loop. Inside the Newton
    function, we use these extra parameters to limit the scope of the loop over to
    the allocated amount of work. In addition, we can add an `if(n0 ==)` to clause
    our `#pragma omp target`, where n0 is not a "start" input parameter. In this way,
    only the first iterations of the outer loop over i will be offloaded to the device,
    while the rest remain on the host.


    At this stage we need to ensure that the data on the host and device are synchronized
    at the end of each step. For example, we use an OpenMP `#pragma target update`
    followed by the list of data to send or retrieve from device. To ensure data consistency,
    we need to put a barrier before after the update. Moreover, since these exchanges
    must be made by one thread, we can enclose them in a `#pragma omp single`, which
    also includes an implicit barrier at its end, the corresponding explicit call.
    Almost everything is in place for permitting us to run our code, but computation
    of the ratio of work to offload to the device amount to be retained on the host.
    Let''s see how to proceed.


    We first assume that both the host and the device have a x{} for computing, which
    we don''t know initially, but which we assume is fixed. The speed of each compute
    device can be represented in iterations for the outer i loop particles inside
    our Newton function. In order to balance over the compute device, we dynamically
    adjust the number of iterations according to the measured speed at each step so
    that the times for completing the Newton function on the host and device are identical.
    This leads to the following:


    ```

    r'' = \frac{t_h r}{t_h + t_d(1-r)} \quad (11.3)

    ```


    where $r$ is the ratio of work done on the device at the previous iteration, $r''$
    is the new ratio to be used in the next iteration, $t_h$ is the time spent on
    computation on the host, and $t_d$ is the time spent on computation of the device.


    Using the above formula, we measure the time taken for computation of work to
    offload to the device at each step, both devices in the previous iteration. For
    initial conditions, we simply set our ratio to an arbitrary value of 0.5 and we
    let the system adjust automatically.


