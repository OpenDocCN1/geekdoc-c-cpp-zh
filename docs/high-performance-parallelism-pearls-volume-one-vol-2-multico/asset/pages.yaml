    directive-based code with a hand-tuned code using intrinsics. We also compare
    the same code on the Intel® Xeon processor and Intel® Phi™ coprocessor. We were
    able to achieve 1.5TFop/s precision performance on the coprocessor without rewriting
    our original C. We use a direct N-body method to demonstrate the effect of the
    above-mentioned optimizations. N-body methods have traditionally been used in
    particle-based simulations such as astrophysical and molecular simulations. They
    have recently been extended to solve more general forms of partial differential
    equations as well. We find reference material for these in Section “For More Information”.
    The inner kernel of the N-body method has high arithmetic intensity since it performs
    $2N$ operations for every $N$ floating point numbers. If we compare with a matrix-matrix
    multiplication, which performs $2^N$ operations for every $2^N$ numbers loaded,
    we can see that the flop/ratio of the N-body kernel is higher. This high arithmetic
    intensity allows N-body to remain compute-bound on architectures of the future.
    In this chapter, we focus on the optimization of the N-body method on the Intel
    Xeon Phi coprocessor and show the effect of these optimizations on an Intel Xeon
    processor.


    # FAST N-BODY METHODS AND DIRECT N-BODY KERNELS


    The direct N-body kernel calculates all-pairs interaction of N-bodies against
    N-bodies, which results in an operation count of $O(N^2)$. Fast approximation
    methods that use hierarchical decomposition of the bodies, along truncated series
    expansions of the kernel can drive the operation count lower to $O(N \log N)$
    or even $O(N)$ as described by Barnes et al. (see “For more information”). The
    $O(N)$ method is referred to as the fast multipole method (FMM). The rationale
    behind these fast N-body methods is that bodies in the far-field are not considered
    individually, but are grouped into multipoles. However, bodies in the near-field
    must be calculated accurately using the direct N-body kernel. Therefore, the performance
    of the direct N-body kernel is critical for these fast N-body methods.


