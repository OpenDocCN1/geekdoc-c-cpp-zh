  md: '# A MANY-CORE IMPLEMENTATION OF THE DIRECT N-BODY PROBLEM


    Alejandro Duran’, Larry Meadows

    *Intel Corporation, Spain, *Intel Corporation, USA


    # N-BODY SIMULATIONS


    N-Body simulations are a common astrophysics problem that computes the movement
    of gravitation-interacting particles through space. At each time step of the simulation,
    the force that each particle exacts upon each other is computed using the following
    equation:


    ```

    $F_{ij} = K \frac{m_j(r_j-r_i)}{|r_j-r_i|^3}$

    ```


    Based on this, the velocity and position of each particle are updated. The process
    is iterative and finishes after simulation of desired number of steps.

    While the direct N-body kernel is generally not practical by itself because of
    its $O(n^2)$ complexity, it is still used to compute the interaction of particles
    of the same domain in more complex N-body algorithms with much smaller complexity,
    like Barnes-Hut that has $O(n \log n)$ complexity, and in some scenarios where
    the numerical approximations of others methods are not desirable such as the study
    of the evolution of star clusters.

    In this chapter, we explain the optimization process we followed to get such a
    kernel optimized for many-core architecture such as the Intel® Xeon Phi™ coprocessor
    which features up to 61 cores with 4 hardware threads per core. The optimization
    work, to get scaling for many-core architecture, also yields performance improvements
    for multicore processors in general.


    # INITIAL SOLUTION


    Vladimir and Karpusenko developed an initial study of the Intel Xeon Processor
    using a simplified direct N-body kernel and applying some optimizations. We expand
    their work by introducing in the kernel the softening factor, typically a constant
    used to correct the interaction of close range particles, and also considering
    particles to have different masses.

    We also explore the performance difference between the computation in single precision
    (SP) and double precision (DP) across a wide range of element configurations.'
