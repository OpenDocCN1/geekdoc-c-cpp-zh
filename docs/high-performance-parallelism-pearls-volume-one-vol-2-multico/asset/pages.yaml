    2D Godunov''s scheme with dimensional splitting.


    **Dimensional splitting** The classical formulation of Godunov''s method is inherently
    one-dimensional, and the typical approach for two- and three-dimensional, problems
    is known as dimensional splitting, which is a special case of the more general
    approach of operator splitting, wherein the original equation is partitioned by
    operators into several equations, which are then solved sequentially with the
    previous result (Figure 2.2). The spatial terms in Eq. (2.1) are split into separate
    timesteps; to advance a timestep from $t$ to $t_n$, the solution is advanced (flux
    computation plus integration) from $t$ using the $d\partial x$ terms to an intermediate
    state $t^*$, which is then advanced using the $d\partial y$ equation to $t_{n+1}$.


