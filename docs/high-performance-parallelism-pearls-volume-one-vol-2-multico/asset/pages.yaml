    Figure 2.22—Cont''d


    **Peeling and masking** When considering SIMD of arbitrary dimensions, we must
    consider how to handle "leftover" pieces of work (i.e., work at the end of a loop
    that does not fit a SIMD unit). Improperly handling these cases can result in
    both soft and hard errors in the execution, the general solution is to use *peeling*—the
    main loop runs SIMD stride, and a separate loop handles the remainder. Some overhead
    is incurred in this approach, particularly as the main loop length shrinks and
    the SIMD width grows, the benefit of SIMD is diminished.


    An alternative approach is available to instruction sets with support for write-masking,
    such as the Intel Xeon Phi processor. A bitmask determines which "lanes" of a
    vector register are written to memory and which are skipped. With this construction,
    it is possible to avoid loop peeling altogether. This mechanism is also used to
    handle cases where part of a SIMD register may behave differently.'
