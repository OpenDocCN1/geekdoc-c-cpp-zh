  md: '# FITTING AN OBJECTIVE FUNCTION


    ![](img/a13d4428e1779878c265ff76550862e7_159_0.png)


    FIGURE 7.6


    Scaling to 3000 Intel Xeon Phi on the TACC Stampede Supercomputer.


    The non-linear scaling of this mapping is the result of the aggregate runtime
    of steps 1-3:


    +   - Step 1: Parameters are broadcast to all the processor(s). In general, the
    MPI global broadcast is extremely efficient and has a constant runtime. The time
    spent on broadcasting data is usually limited by the bandwidth of the network
    interconnect hardware


    +   - Step 2: Each MPI node independently calculates a partial error for the dataset
    contained in local memory, which means the runtime exhibits strong scaling to
    the number of processing nodes. The runtime of this step is determined by the
    amount of data per MPI node and the computational speed of the node. (Note: The
    per node MPI data of the partial datasets occurs once at the beginning of the
    calculation and generally scales to the available network bandwidth.)


    +   - Step 3: The scalability of this mapping is mainly affected by the runtime
    behavior of the reduction operation on large systems. Most MPI reduction operations
    require $O(\log(n_{nodes}))$ where $n_{nodes}$ is the number of MPI nodes. In
    practice, the latency of the network interconnect limits the performance of the
    reduction as the number of bytes in the partial sum is small, generally 8 bytes
    for 64-bit partial sum.


    Experience has shown that even the largest problems can utilize single precision
    (32-bit) floating-point storage for the parameters and data, but the accumulation
    of the partial errors in steps 2 and 3 should utilize double precision (64-bit)
    arithmetic. Otherwise, information loss may cause the optimization algorithm to
    get trapped in local minima from the precision losses that occur when summing
    of partial results using single precision arithmetic. The runtime impact of the
    use of a 64-bit, double precision accumulator to perform the hybrid precision
    reduction is minimal.'
