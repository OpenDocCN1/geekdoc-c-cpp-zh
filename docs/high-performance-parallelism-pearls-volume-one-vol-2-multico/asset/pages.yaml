    # PERFORMANCE STRATEGIES


    Scientists, and any author of performance-sensitive code, are keenly interested
    in how to improve execution while minimizing programming effort and maintenance
    costs. This subject has no simple answers—there is no "silver bullet."


    We have performed in-depth analysis in this chapter, it is not our intention to
    assert that each performer a seasoned expert in microarchitecture, nor that they
    be intimately acquainted with the smallest details of each target processor. In
    hope that we have shown by consciously ignoring or simplifying aspects of the
    hardware, significant improvements in efficiency are achievable, and that reduced
    models are common to seemingly distinct processors.


    +   * Pursuant to what we have described with our arithmetic optimizations, consider
    how mathematically equivalent formulations perform on a given architecture. These
    changes often have localized code impact.

    * Evaluate how "hot" loops data accesses can be structured to take advantage of
    vector hardware, as we have with vstrip_stable and hstrip_stable. These modifications
    can be made to limit narrow code changes.

    * Consider the potential works that can be done among cores (and specifically,
    threads); this is related to divergent tasks in the code and their granularity.
    This may have ramifications for data access and storage as well—for example, see
    our material on tiling and alignment.

    * Finally, consider the broader issues of memory/memory hierarchy hierarchy usage
    and layout. This can often involve serious changes in code with commensurate gains;
    we have considered this with our "rolling updates" and tiling approaches.


    The best general advice we can provide is to have a model of how the code should
    run on the hardware and utilize its resources, and the compiler tools, properly
    applied, can greatly simplify its realization.'
