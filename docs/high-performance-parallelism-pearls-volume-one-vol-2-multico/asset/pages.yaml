    NOTE


    Establishing a careful pinning scheme within offloaded regions from MPI applications
    requires either explicit thread-core assignment with the coprocessor, or device
    partitioning and thread placement, c.g., via MIC_KMP_PLACE_THREADS with MIC_KMP_AFFINITY
    or MIC_KMP_OMP_PLACES.


    # Case study: concurrent Intel MKL dgemm offloading


    BLAS (basic linear algebra programs) is essential to many scientific codes. Parallel
    applications that throughout their thread or process use intensive operations
    of matrix-multiplication might benefit from placing this portion of the work on
    the coprocessor for a faster execution.


    We consider multiple OpenMP threads and processes that generally offload the execution
    of Intel dgemm to the coprocessor. dgemm is particularly suited to assess the
    impact of different thread-core assignment schemes on the overall performance
    for at least two reasons: first,, dgemm is cache-optimized, so that unfortunate
    thread placements should have negative impact on the overall performance, and
    it is not memory bound. The second point allows us to actually place the aspect
    without being affected by any concurrent offloads sharing the coprocessor''s main
    memory bandwidth.


    The core of our benchmark program is given in Figure 12.6. Data transfers between
    thread and coprocessor will be considered in Section "Concurrent data transfers".
    For now, we will focus on the offload communication.


    # TIME: CONCURRENT KERNELS


    To assess the performance of multiple concurrent computations on the coprocessor,
    we need the start and stop time for each multiple offloads per thread or process,
    and afterwards determine the time frame (or "concurrency window") in which all
    threads and processes have overlapping offloads. The concurrency window is then
    given by the latest start time of the first offload and the earliest stop time
    of the last off across all threads or processes. Within that time frame, we assume
    100% concurrency. By counting the number of offloads that fail in the concurrency
    window, we can derive our performance metric.


