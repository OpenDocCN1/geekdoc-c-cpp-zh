  md: '# 176 CHAPTER 10 N-BODY METHODS


    The arithmetic complexity refers to the asymptotic amount of arithmetic operations
    performed as the problem size increases. The arithmetic intensity refers to the
    amount of arithmetic operations performed per amount of data loaded. The combination
    of the O(N) optimal complexity of the FMM and the high arithmetic intensity of
    the direct N-body kernel makes the FMM an interesting alternative to many algorithms
    on architectures of the future. This is because conventional algorithms with high
    intensity dense linear algebra have high arithmetic complexity as well. They compute-bound
    and can utilize most arithmetic units, which are computationally very expensive
    to begin with. On the other hand, methods with low arithmetic complexity like
    Fast Fourier transform (FFT) and sparse linear algebra have low arithmetic intensity.
    They are very efficient, but are not able to achieve a high degree of the peak
    performance of modern processors. FMMs have an exceptional combination of O(N)
    complexity and an arithmetic intensity that is higher than matrix-multiplication.
    This means that N-body methods provide a very efficient algorithm for cases scalable
    with problem size, but should remain come bound on future architectures for the
    next few decades.


    The N-body kernel is easy to isolate from the FMM, since it is usually called
    as a function inside the neighbor finding routine. This function takes up a majority
    of the execution time of the FMM. Therefore, if we optimize the direct N-body
    kernel it will automatically optimize the hotspot of the FMM. The direct N-body
    kernel is only a few lines of code, so even optimizing at the assembly level is
    not so much work. In this chapter, we will show a very specific example of how
    we can go with just compilers, and then introduce intrinsics to squeeze even more
    performance out of the direct N-body kernel.


    # APPLICATIONS OF N-BODY METHODS


    N-body methods can be naturally applied to problems where the physics itself is
    described by a collection of discrete points, even before numerical discretization.
    A many-body problem under gravitational or electrostatic forces is a typical example,
    where stars and atoms can be represented as point sources of mass and electric
    charge, respectively. N-body methods can be extended from discrete fields to continuum
    fields through discretization. This makes it possible to use these methods for
    solving problems in structural mechanics, fluid mechanics, electromagnetics, acoustics,
    and even quantum mechanics. However, just because it is applicable does not mean
    that it is the optimal method to solve that problem.


    Fast N-body methods have been favored in applications where the geometry information
    changes dynamically. If the geometry is stationary, it takes much more to store
    this information in the form of a matrix, and to over again. N-body methods could
    be thought of as "matrix-free" methods, where a matrix is formed on-the-fly by
    being multiplied to a vector of source points. It is obvious that such methods
    would be advantageous when the matrix/geometry changes frequently, storing them
    would not save any computation in such cases. This is precisely the case for particle-based
    methods where each particle advances its location every time step. Adaptive mesh-refinement
    may also result in a similar amount of geometry updates if the system is very
    dynamic.


    There are many factors that could influence the comparative advantage of the N-body
    approach over other elliptic Partial Differential Equation (PDE) solvers like
    FFT and multigrid. The asymptotic'
