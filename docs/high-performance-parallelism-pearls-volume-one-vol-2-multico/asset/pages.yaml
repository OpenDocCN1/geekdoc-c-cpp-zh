- img_proc: true
  md: 'calculation kernel, which computes the force acting upon each atom. Naively
    computing this force scales as $O(N^2)$, since every atom exerts some force on
    every other atom. This is prohibitively expensive for a large number of atoms.
    Therefore, molecular dynamics packages typically separate the force on each atom
    into two components: a short-range force, computed for all pairs of atoms within
    a “cut-off” distance $R_c$; and a long-range force, approximated for all pairs
    of atoms without the need for direct computation via a fast Fourier transform.
    This separation allows the force computation to scale to O(N), where k is the
    expected number of “neighbors” for each atom (itself a function of simulation
    parameters like density and $R_c$). As a benchmark, miniMD does not include a
    long-range force estimation kernel—we focus on short-range forces henceforth.
    The second hotspot, accounting for 10% of runtime, is the neighbor list build,
    which constructs a list of all atom pairs that are separated by less than the
    cut-off plus some “skin” distance $R_s$. This skin distance allows the list to
    be reused for a number of time-steps, at the expense of considering more atom
    pairs than are strictly necessary.


    Figure 8.3 shows the neighborhood of a single atom in two dimensions—in three
    dimensions, the neighborhood is a sphere, and the simulation volume is a cube.
    The simulation space is also divided into “cells” or “bins,” which are used to
