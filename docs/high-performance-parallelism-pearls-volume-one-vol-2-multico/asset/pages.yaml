  md: '# A FIRST PROCESSOR COMBINED WITH COPROCESSOR VERSION 193


    # A FIRST PROCESSOR COMBINED WITH COPROCESSOR VERSION


    Our goal now is to find a way of:


    +   1. offloading only a partial amount of the workload to the Intel Xeon Phi
    coprocessor, retaining the rest of the workload for computing on the Intel Xeon
    processor (host) and

    2. making sure that only the right amount of work is delegated to the device,
    so that both host and device can run in parallel for the same duration of time.
    This point is the key to ensure that no time is wasted while one compute device
    is waiting for the other to finish its share of the work (Figure 11.10).


    Of course, since at every single step of the computation, the system needs to
    have a full up-to-date view of the particles'' positions and velocities, this
    host-device distribution of work also implies some data transfers during each
    step. These extra data transfers not only have to be managed carefully to ensure
    code correctness, but may also have a significant impact on the performance.


    So, how can we address these points? The first stage will be, allowing the host
    and device parts to run concurrently, to create two threads, each managing one
    part. This can easily be achieved by enclosing our loop with a `#pragma omp parallel
    num_threads(2)` directive. However, this has some consequences for the host part
    of our code:


    To allow the computation to continue running in parallel on the host, we need
    to allow nested OpenMP parallelism. Fortunately, this only requires the additional
    call to “omp_set_nested(true)” in the initialization section of our code.


    ![](img/a13d4428e1779878c265ff76550862e7_217_0.png)


    # FIGURE 11.10


    Workloads can be tailored to match individual capabilities. This can help minimize
    idle time on the processor and coprocessorss by matching the time each takes to
    complete.'
