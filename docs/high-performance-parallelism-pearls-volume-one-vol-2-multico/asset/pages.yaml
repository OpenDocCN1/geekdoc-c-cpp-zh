    # FORCE COMPUTATION IN PD USING CONCURRENT KERNEL OFFLOADING


    We now come back to the PD example that initially served as the motivation for
    concurrent offloading to the coprocessor. Remember, we argued to use of symmetries
    in the forces, but found that our implementation of the force computation does
    not scale with an increasing number of threads. Subsequently, we will describe
    our parallel algorithm to evaluate the forces, and detail the relevant parts of
    a possible implementation using C++ and Intel Leo.


    # PARALLEL FORCE EVALUATION USINGTON’S 3RD LAW


    According to Newton’s 3rd law, it holds that Fij = -Fji where Fij is the force
    exerted by particle j on particle i. By using this symmetry, we can save a constant
    factor of two when evaluating the particle-particle forces Fi = ΣFij, for each
    of N particles: we need to compute Fi = ΣFji, and add the contributions Fj = -Fij
    throughout the somet. For simplicity, we evaluate the forces Fj, directly, which
    results in an algorithm with computational complexity O(N²). Furthermore, we consider
    pairwise continuations Fj that depends on the spatial separation xj = [x, -x]
    of the particles i and j and their electric charges q, and q. Only, for instance,


    ```

    $$F_{ij} = a \left( \frac{b^6}{x_{ij}^6} - \frac{1}{x_{ij}^3} \right) + \frac{q_i
    q_j}{x_{ij}^3} (x_{ij}, -x)$

    ```


    is derived from a combination of the Lenn-Jones potential and the Coulomb potential
    (see Thijssen, 2003).


    What makes the parallel implementation of the O(N²) algorithm on the coprocessor
    differ? First, there is the “threading requirement” on the coprocessor (see Jeffery
    and Reinders, 2013), that is, two hardware threads need to be instantiated per
    physical core. Second, the force computation must be thread safe, which using
    the symmetries thread safe, which sounds expensive with hundreds of threads.'
