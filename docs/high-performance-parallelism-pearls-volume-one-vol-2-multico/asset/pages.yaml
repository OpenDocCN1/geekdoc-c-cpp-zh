    Our code uses `SIMD_WIDTH` as a placeholder for the SIMD width of the underlying
    hardware (2 or 4 for the processor, for the coprocessor).

    SIMD two ways The slab data layout using the reference code ensured that all computation
    was performed on the same slab (always in the slab''s x-direction), our approach
    of updating the solution in-place with rolling updates that we access and compute
    data differently for the $x$- and $y$-passes. [Figure 2.21] depicts various SIMD
    schemes for this method.


    We achieve our implementation of these notions through the aforementioned C++
    SIMD classes—the Intel compiler provides `<immintrin.h>` for this. Each of the
    core update routines is made to accept the appropriate SIMD type with a `REAL_T`
    map to simplify this, and almost no change is needed to the core of the.

    `vstrip_prime()` and `vstrip_stable()` functions that are practically identical
    to their counterparts. However, `vstrip_prime()` and `vstrip_stable()` were used
    for both the $x$- and $y$-passes (especially for strides and the order of the
