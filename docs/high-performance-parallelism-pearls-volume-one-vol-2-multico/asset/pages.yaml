  md: '# 118 CHAPTER 6 PARALLEL EVALUATION OF FAULT TREE EXPRESSIONS


    to defend themselves against potential threats, expressed using a fault tree.
    Fault trees express failure relationships between systems using Boolean logic.
    Simulations use fault tree analysis (FTA) to evaluate the vulnerability of systems
    based on component reliability, system redundancy, physical protection, and other—potentially
    domain-specific—factors. After its introduction by Bell Laboratories in the 1960s,
    FTA has been adopted by the defense, aerospace, nuclear, chemical, and other high-hazard
    industries as the primary methodology for understanding system vulnerability.


    # AN APPLICATION FOR FAULT TREES: BALLISTIC SIMULATION


    An example of vulnerability assessment is survivability analysis for military
    applications. Survivability analysis is a broad field, so we discuss vehicle vulnerability
    to ballistic threats as the specific application. Ballistic simulation is widely
    used to assess how well vehicles can withstand impact from various ballistic threats.


    Modern ballistic simulations require many different elements of computation to
    fully model an object''s vulnerability to various threats. Ballistic events are
    chaotic and complex, which makes assessment of outcomes for a difficult target.
    One common approach is to use probability of kill ($P_k$) as a metric. $P_k$ defines
    the probability that an object or system is no longer functional.


    Vulnerability is measured at many levels using the $P_k$ metric. Targets—in this
    case, vehicles—comprise thousands of components. In systems, turn these individual
    components. High-level systems define device functionality, and ultimately its
    survivability. Component $P_s$ directly affects system $P_v$ through engineering
    relationships. Fault trees express these system $P_s$ relationships and adequately
    quantify vulnerability for ballistic events.


    Understanding ballistic vulnerability requires sampling millions—even billions—of
    trajectories that may hit a vehicle. Every instance of a sample interacting with
    a target is a unique event that requires a unique relationship. Thus, recall that
    fault trees contain thousands of components with complex relationships. Code scalability
    is critical for fault tree evaluation that interactivity is maintained. Interactive
    tools allow users to explore survivabilities on a target, which facilitates quick
    cognition rates and user feedback. To evaluate millions (or billions?) of these
    large events at expressive rates, parallel must be executed effectively.


    We use an approach for compiling fault trees to an in-memory encoding that is
    executed in parallel each set of component $P$ values. Our approach in this chapter
    uses SIMD parallelism because application threading/MPI architectures vary by
    domain and implementation.


    It is important to note that our implementation is not limited to fault tree syntax
    and evaluation. Any mathematical expression can follow the principles we discuss
    in this chapter to maximize SIMD efficiency. Ballistic simulation gives us a compelling
    reason to evaluate such a high volume of expressions. Any Monte Carlo simulation
    that applies a large volume of inputs to a uniform expression will benefit from
    insights in this chapter.


    # EXAMPLE IMPLEMENTATION


    Our example implementation, as illustrated in Figure 6.1, parses a fault tree
    from an input file, compiles an instruction array, and finally uses the instruction
    array to evaluate $N$ sets of component values.'
