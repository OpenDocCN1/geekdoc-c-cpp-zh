    # SUMMARY


    In this chapter, we described how to optimize a direct N-body kernel on the coprocessor.
    We were able to achieve about 1.5 TFlops single precision performance by using
    the compiler option `-icc -openmp -mfiml-data-exclusion=15` and adding a `#pragma
    simd` to the original C code for CPUs. The use of OpenMP and simd directive benefit
    processor. The strength of the execution was close to ideal, while the scalability
    of the intra-core threading was less effective. The choice of `KMP_AFFINITY` did
    not affect when all 244 threads were used.


    By using the `_mm512` intrinsics, we were able to increase the performance to
    about 1.4 TFlop/s even at smaller problem sizes. We found a strong dependence
    of the performance on the problem size and the relation was not monotonic. Up
    to a certain problem size, vectorizing the inner loop gave better performance,
    but after $N>16,384$, vectorizing the outer loop gave better performance. The
    vectorization of the outer loop was made possible by the use of a portable and
    general `#pragma simd` directive or the more specific `_mm512` intrinsics.'
