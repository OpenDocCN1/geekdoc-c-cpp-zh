    multi-threading) is handled. Note that KMP_AFFINITY works with the Intel compiler,
    so use GOM_CPU_AFFINITY for gcc.


    For vectorization, there are multiple approaches that are viable. The easiest
    is the autovectorization support that is present in modern compilers; this aims
    to produce efficient SIMD code based on a handful of details in the code. Writing
    code in such a way that the autovectorizer understands and produces efficient
    code is something of an art, but it is the most satisfying approach.


    Compiler intrinsics are the most reliable way to express vectorization in code;
    they are built-in data types and functions that translate to SIMD registers and
    instructions. However, they are vendor-specific and can be somewhat arcane.


    A useful alternative to intrinsics, and which we use more than anything else in
    this chapter, is C++ classes that wrap built-ins these are easy to write or find—the
    Intel compiler comes with a set of them—and provide a convenient layer of abstraction
    to provide flexibility across SIMD widths. It is even possible to overload the
    standard arithmetic operators for them, which makes code them appear nearly identical
    to code using standard C++ types.


