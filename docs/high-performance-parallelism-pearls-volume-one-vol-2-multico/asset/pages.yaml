    molecular simulation, an oceanographer would happily use more grid cells to describe
    the ocean, and an astrophysicist would have no trouble including more stellar
    bodies to the model. The universe may be finite, but it is still very large.

    The **correctness challenge** In demanding large computational resources, any
    developer of numerical codes is keenly aware of the challenge of ensuring that
    their work is performed as intended. Digital arithmetic is approximate, and many
    notions are that beautiful mathematical constructs in the abstract need careful
    shielding into the discrete world to be useful, while many others are entirely
    unsuitable.


    There are enough “moving parts” to a scientific code that tremendous patience
    and discipline must be exercised to ensure correctness: is the mathematical model
    of the phenomena suitable in the first place? Is it numerically stable? Were the
    correct parameters chosen? Is the code that implements it correct? Is the hardware
    reliable?

    In some cases, buggy code will produce the correct answer, but much slower than
    a correct code would—athema to the optimizer!


    *Specialized tools* Software have long understood the benefit of standardized
    tools that deliver correct behavior and (hopefully) performance, but software
    libraries must be specialized. While LAPACK/BLAS is an incredibly useful tool,
    not all codes (e.g. the subject of this chapter) are suitable for expression in
    terms of their operators.


    Fortunately, compiler technology (perhaps the most generally applicable of software
    tools) has continued to advance with progressively more sophisticated hardware.
    Increasingly, it is sufficient for a developer to know how portions of the code
