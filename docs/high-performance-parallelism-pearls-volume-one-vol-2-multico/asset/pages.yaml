  md: '# CHAPTER 1 INTRODUCTION


    Code modernization is reorganizing the code, and perhaps changing algorithms,
    to increase the amount of thread parallelism, vector/SIMD operations, and compute
    intensity to optimize performance on modern architectures. Thread parallelism,
    vector/SIMD operations, and an emphasis on temporal data reuse are all critical
    for high-performance programming. Many existing applications were written before
    these elements were required for performance, and therefore, such codes are not
    optimized for modern computers.


    # MODERNIZE WITH CONCURRENT ALGORITHMS


    Examples of opportunities to rethink approaches to better suit the parallelism
    of modern computers are scattered throughout this book. Chapter 5 encourages you
    barriers with an eye toward modern concurrency. Chapter 11 stresses the importance
    of not statically decomposing workloads because neither workloads the machines
    we run on are truly uniform. Chapter 18 shows the power of not thinking that the
    parallel world is flat. Chapter 26 juggles data, computation, and storage to increase
    performance. Chapter Chapter 12 increases performance by ensuring parallelism
    in a heterogeneous node. Enhancing parallelism across a heterogeneous cluster
    is illustrated in Chapter 13 and Chapter 25.


    # MODERNIZE WITH VECTORIZATION AND DATA LOCALITY


    Chapter 8 provides a solid foundation of data layout issues in the quest to process
    data as vectors. Chapters 27 and 28 provide additional education and motivation
    for doing data layout and vectorization work.


    # UNDERSTANDING POWER USAGE


    Power usage is mentioned in enough chapters that we invited Intel''s power tuning
    expert, Claude Wright, to write Chapter 14. His chapter looks directly at methods
    to measure power including creating a simple software-based power analyzer with
    the Intel MPSS tools and the difficulties of measuring idle power since we are
    not idle if we are busy measuring power!


    # ISPC AND OPENCL ANYONE?


    While OpenMP and TBB dominate as parallel programming solutions in the industry
    and this book, we have included some mind-stretch chapters that make the case
    for other solutions.


    SPMD programming gives interesting solutions for vectorization including data
    layout help, at the cost of dropping sequential consistency. Is that okay? Chapters
    6 and 11 include usage of ispc and its SPMD approach for your consideration. SPMD
    thinking resonates well when you approach vectorization, even if you do not adopt
    ispc.


    Chapter 22 is written to advocate for OpenCL usage in a heterogeneous world. The
    contributors describe results from the BUDE molecular docking code, which sustains
    over 30% of peak floating performance on a wide variety of systems.'
