  md: '# CHAPTER 6 PARALLEL EVALUATION OF FAULT TREE EXPRESSIONS


    # SUMMARY


    Developments in SIMD hardware found in processors and coprocessors enable many
    scientific and engineering applications to run at interactive rates. Large expressions
    are found in such applications and require adequate SIMD parallelization. Monte
    Carlo simulations are a family of simulations that benefit from wide SIMD hardware
    parallelism. We looked at fault tree evaluation as a large expression found in
    ballistic simulations that can be evaluated in SIMD using isspc.


    Our example implementation uses SIMD input fault trees, creates an array of evaluation
    instructions, then executes them using SIMD parallelism. We looked at two characteristics
    of the final evaluation code that dramatically improve the evaluation performance.
    First, arranging the ispc code to use smaller loops helps the ispc compiler better
    generate vectorized code. Second, using a coalesced SOA data layout minimizes
    vector scatter/gather memory transactions.


    # FOR MORE INFORMATION


    Here are some additional reading materials we recommend related to this chapter:


    +   - General Fault Tree Analysis Information: http://en.wikipedia.org/wiki/Fault_tree_analysis.

    - Complex fault tree analysis with GPUs: Aghassi, H., Aghassi, F., 2013. Fault
    tree analysis speedup with gpu parallel computing. Int. J. Comput. Inf. Syst.
    Indust. Mang. Appl. 5, 106–114.

    - More information on the ispc language can be found at: http://ispc.github.io/.

    - VSL was developed by the U.S. Army Research Laboratory. More information on
    the project and code is available at http://vissimlab.org/.

    - Download the code from this, and others, http://lotsofcores.com.'
