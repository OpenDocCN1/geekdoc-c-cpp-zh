  md: '# HETEROGENEOUS COMPUTING WITH MPI


    Jerome Vienne, Carlos Rosales, Kent Milfield

    TACC, USA


    # MPI IN THE MODERN CLUSTERS


    To many users, message passing interface (MPI) is a black box that “just works”
    behind the scenes to transfer data from one MPI task (process) to another. The
    beauty of MPI for the program developer is that the algorithmic coding is independent
    of the hardware layer below the programming paradigm. Nevertheless, over the last
    decade the hardware has become layered and more complex, more than when MPI-1
    became a standard in 1993.


    Figure 13.1 illustrates a typical system at the time of the first MPI-1 standard.
    Each node in a rack contains a single processor, connected to a NIC (network interface
    card, HCA), and each NIC is connected to a single port on a switch. The system
    is uniform in its connectivity, and the location of a set of application''s tasks
    has no effect on the communication performance.


    Figure 13.2 illustrates a typical configuration of a heterogeneous-performance
    computing (HPC) system of today, in the era of MPI-3. Multiple processors are
    in each node. And each node is connected in a hierarchy here (“fat tree” topology)
    of switches. The node processor has multiple cores and Intel® Xeon Phi™ coprocessor
    (or GPU) with many-cores. The coprocessor is connected to the NIC (actually a
    host channel adapter, HCA), as the processors, by a PCI-e “bus.”


    The configuration of a many-core coprocessor connects to a application development
    and user. With 60+ cores on a single processor and 10–40 cores within multiple
    processors, an application with MPI task on each out may certainly create communication
    storms within the node and nodes across (out the NIC). As envisioned in Figure
    13.1, the number of communication storms within a modern node, and out through
    the NIC, is out two orders greater.


    To mitigate communication bottlenecks, applications use hybrid techniques, employing
    a few MPI tasks and OpenMP threads using the symmetric mode of computing (MPI
    tasks on both the processors and the coprocessors). When the characteristics of
    an application are amenable to overload, MPI tasks on the host directed computational
    workload to be executed on the coprocessor. The latter approach avoids using tasks
    on the coprocessor, thereby reducing the number of MPI tasks on the node; it is
    still necessary to thread an application with OpenMP, threads, Intel Cilk Puls,
    etc. for offloading—effectively hybridizing the MPI code.


    High Performance Parallelism Pearls

    © 2015 Elsevier, Inc. All rights reserved.


    225'
