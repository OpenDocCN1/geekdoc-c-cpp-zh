    # THE FUTURE OF MANY-CORE


    Intel has announced that it is working on multiple generation futures of Intel
    Xeon Phi devices, and has released information about the second generation product,
    named Knights Landing.


    The continuous dividends of Moore’s Law are evident in the features of Knights
    Landing. The biggest change is the opportunity to use Knights Landing as a processor
    the advantages are numerous


    Additional dividends of Moore’s Law include use of a very modern out-of-order
    lower-power core design, support for on-package high-bandwidth memory, and versions
    that integrate fabric support (inclusion of a Network Interface Controller).


    The best way to prepare for Knights Landing is to be truly “inspired by 61.” Tuning
    for today’s Intel Xeon Phi coprocessor is the best way to be an application is
    on track to make good use of Knight Landing. Of course, since Knights promises
    to be even more versatile it is possible that using a processor-based system with
    more than 50 cores is a better choice to get your application ready. We say so
    not 50 because we know from experience that a small number of cores does not easily
    inspire the level of tuning needed to be utilize high levels of parallelism.


    We can logically conclude that the future for many-core is bright. Neo-heterogeneous
    programming is already enabling modernization for parallelism, while tending to
    get easier in each generation of Intel Xeon Phi devices. We hope the “recipes”
    in this book provide guidance and motivation for modern your applications to take
    advantage of highly powerful computers.


