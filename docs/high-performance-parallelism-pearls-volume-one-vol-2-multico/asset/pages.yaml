    \ The principle for computing the ratios is the same as that used previously,\
    \ and relies on the assumption that each compute device runs at its own speed.\
    \ The desired goal is that all of them compute their share of the work in the\
    \ same amount of time leads to the following formula:\n\n```\n$$\\forall i, j\
    \ \\in \\{0, \\dots, dev\\} t'_i = \\frac{r_j}{r_i} t_j,$$\n```\n\nwhere $r$ and\
    \ $t$ are the ratio and time, respectively, $i$ and $j$ are device indices, and\
    \ $r'$ is the ratio for the next iteration. As we also know that\n\n```\n$$\\\
    sum_{i=0}^{dev} r'_i = 1,$$\n```\n\nwe can subsequently deduce that\n\n```\n$$\\\
    forall j \\in \\{0, \\dots, dev\\} r'_j = \\frac{r_j}{\\sum_{i=0}^{dev} r_i},$\n\
    ```\n\nSince we actually want to compute starting indices (displacements within\
    \ the arrays) for the loop over each time, we can use the `computeDisplacements`\
    \ in Figure 11.17 to do so. Regarding the data updates after each time step, there\
    \ are two points we must pay attention to.\n\n+   Since potentially every device\
    \ will have the update sum with data that they computed, it is better for performance\
    \ reasons (although not mandatory) to make the updates one at a time for a given\
    \ area. This is why we will enclose our \"update from\" directives inside a \"\
    critical\" section. Moreover, we will add a barrier to make sure that the host\
    \ have been fully updated before sending the updated arrays back to the devices.\
    \ As for the previous version of the code, we could take advantage of the multiple\
    \ arrays we update to still keep a level of parallelism in this phase, but the\
    \ complexity it would introduce compared to the expected gain might be counterproductive\
    \ here.\n\n```\nvoid computeDisplacements(size_t *displ,\n  double const *tth,\
    \ int dev) {\n  double sumLengthOverT = 0;\n  size_t length[dev+1];\n  for (int\
    \ i = 0; i < dev; ++i)\n    length[i] = displ[i+1] - displ[i];\n  for (int i =\
    \ 0; i < dev; ++i)\n    sumLengthOverT += length[i] / tth[i];\n  for (int i =\
    \ 0; i < dev; ++i)\n    displ[i+1] = displ[i] + round((displ[dev+1] * length[i])\
    \ /\n    (tth[i]*sumLengthOverT));\nn}\n```\n\nFIGURE 11.17\n\nFunction computing\
    \ new displacements after time step where we assumed we initialize displ[0] to\
    \ 0 and displ[dev+1] to n."
