  md: "# 168 CHAPTER 9 SOLVING DIRECT N-BODY ON MANY-CORES\n\nThus, a 512-kB L2 cache\
    \ means a maximum SP tile size of 2730 elements, or half that number when using\
    \ DP tiles.\n\nAnother requirement for the tiling factor is that BF must be a\
    \ multiple of the alignment of the data type. Otherwise, a few elements of each\
    \ tile will be executed in the prologue and epilogue surrounding the main vectorized\
    \ part of the tile. This can add a significant amount of overhead if the tile\
    \ size is not a multiple of the tiling factor. All with this in mind, we need\
    \ to choose a maximum tiling factor of 2688 for B in SP, or half of that in DP.\n\
    \nCollapsing and parallelizing both of the tiled loops also mean that the total\
    \ number of iterations available to distribute among the threads is reduced by\
    \ the tiling factor, which can be a problem for runs with small number of particles.\
    \ A run with 30,000 particles uses the maximum tiling factor, for example, reduces\
    \ the number of iterations to distribute across the threads to 144, which is not\
    \ enough to occupy all the threads on the Intel Xeon Phi processor.\n\nTo avoid\
    \ this issue, we compute a tile size where each thread is guaranteed to perform\
    \ more than one iteration of work with the following formula:\n\n> $BF = \\min(maxBF,\
    \ \\frac{nParticles}{\\\\#_{thread * slack factor}})$\n\nThe slack factor in the\
    \ formula is used to ensure more than one iteration per thread and reduce the\
    \ possible effect of load imbalance. We used a value 4 for the slack factor.\n\
    \nOne optimization is to take advantage of the fact that the L2 cache is shared\
    \ by the different threads of the same core. We can do this by distributing the\
    \ same tile to all threads of the core (instead of distributing one tile to each\
    \ thread). Sharing tiles means there will be space in the L2 cache for larger\
    \ tiles and reduces the amount of parallel work required to feed the full processor\
    \ by a factor of four as work is distributed to cores and not threads. With this\
    \ in mind, we used a maxBF value of 4096 in SP, or half of that in DP, factor.\n\
