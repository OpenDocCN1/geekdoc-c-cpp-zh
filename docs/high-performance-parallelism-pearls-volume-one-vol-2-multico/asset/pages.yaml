  md: 'Near-linear scalability can be achieved when using an optimization technique
    based on an objective function that returns a single error value rather than an
    error vector. Some optimization algorithms utilize an error vector to determine
    the next set of parameters to evaluate the optimization process. Unfortunately,
    the size of the error vector scales to the size of the data. The all-to-one communication
    pattern of small error vectors can quickly saturate the network interconnect,
    or the memory subsystem processor(s) of the MPI node running the optimization
    algorithm. Thus, only error-vector-based optimization algorithms that have been
    designed to run in parallel and eliminate the issues associated with error vectors
    at scale can be used with this mapping.


    # OBJECTIVE FUNCTIONS AND PRINCIPLE COMPONENTS ANALYSIS


    Neural networks are computationally universal, meaning that they can, in theory,
    learn any computational function. The argument supporting this claim is the simple
    observation that a neural network can implement all the logic gates (e.g., *or*,
    *xor*, *not*, etc.) that are used to build other computational devices like a
    general-purpose computer.


    Recently, neural networks have become a popular way to perform deep-learning by
    training hidden layers of a multilayer neural network. This is ability to define
    hidden layers that gives ANNs the ability to simulate other computational devices
    and create internal representations of data or perform feature extraction. Feature
    extraction refers to the identification of the salient aspects of data to facilitate
    in a subset task such as regression or classification. Lapedes and I showed that
    only two hidden layers are required to perform modeling and prediction tasks with
    fewer parameters, or fine-tuned to perform better on deep-learning tasks as reported
    by Hinton.


    The discussion in this chapter will focus on using multilayer-ANNs to perform
    PCA (principal components analysis) and NLCA (nonlinear principle components analysis).


    PCA is essentially used in data mining and data analysis to reduce the dimensionality
    of a dataset and extract features from a dataset. PCA analysis accounts for the
    maximum amount of variance in a dataset using a set of orthogonal lines where
    each line is defined by a weighted linear combination of the observed variables.
    Similarly, NLCA can utilize a curved line that joins itself where there are no
    points inside.


    The ANN architecture shown in Figure 7.7 can be used to find the principle components
    of a dataset through the use of a restricted number of hidden layers or bottleneck
    neurons. The ANN in Figure 7.7 can be used to perform an NLCA when a nonlinear
    operator is used for the bottle-neck neurons (labeled B in Figure 7.7). These
    nonlinear operators can be either open or closed curves.


    NLCA has wide applicability to numerous challenging problems including pattern
    recognition, biological modeling, modeling, and chemistry. There are many Web
    sites, tutorials, and books about NLCA. A search on "nlCA" will provide a good
    starting point.


    During training, the multilayer ANN shown in Figure 7.7 is presented with each
    training vector in the training set via the input, or N neurons at the bottom
    of the machine. The ANN essentially teaches itself linear or nonlinear components
    because it is forced to pass the input information through the lower half of the
    network (transforming each input vector from high-low dimensional space, or from
    two dimensions to one in Figure 7.7) so that the error is minimized when the upper
    half of the network reconstructs the original high-dimensional input vector at
    the output'
