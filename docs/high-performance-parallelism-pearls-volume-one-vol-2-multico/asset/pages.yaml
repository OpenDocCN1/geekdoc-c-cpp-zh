    # VERSION FOR PROCESS WITH MULTIPLE COPROCESSORS


    Now we assume the existence of at least one Intel Xeon Phi coprocessor on our
    machine. However, if several devices are available, our code is only able to take
    advantage of a single processor. Let''s see now how to address the case of an
    arbitrary number of devices in our code, where we continue to exploit the coprocessor
    as transparently and effectively as possible (Figure 11.14). To achieve this,
    we will make use of two extra features that OpenMP 4.0 offers:


    +   - A runtime library "omp_get_num_devices()" allowing for the retrieval of
    the number of usable devices on the current system.


    +   - An extra "device(dev)" statement to apply the variable "#pragma omp target"
    directives we have in code, defining the index of the device the statement applies
    to.


    These two features are all that we need to us reach our goal of full-code versatility:
    we can discover the number of devices and access each of them individually, depending
    on some conditional statement we define. But we still need to figure out how to
    modify our code so that we can allocate and transfer arrays to an arbitrary number
    of devices. Indeed, at the moment, if we were simply to adapt our previous version
    to an arbitrary number of devices, our main code could be shown in Figure 11.15.


    As we see from Figure 11.15, it seems difficult, but not impossible, to enclose
    our parallel construct into an arbitrary number of "target data" directives—one
    per device. However, by simply relying that we can span the "target data" and
    the "parallel" directives, the issue gets quite easily. Instead of trying to have
    all our devices managed by our master thread for the data allocation, we simply
    delegate this to as many threads as needed, each managing at one single device.
    The previous code snippet therefore becomes as shown in Figure 11.16.'
