    As an autonomous coprocessor to the host, the simultaneous execution of multiple
    offloaded programs is noticed supported on Intel Xeon Phi. However, placing on
    it without thinking about the appropriate thread-to-core mapping, may cause interference
    between multiple concurrent offloads.


