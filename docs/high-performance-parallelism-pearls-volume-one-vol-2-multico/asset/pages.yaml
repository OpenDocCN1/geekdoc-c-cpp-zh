    Using vrsqrt for double precision (with restricted precision).


    For DP, we can use the same code codenan on packed DP vectors, which have a width
    of elements, except for the computation of the reciprocal square root. The first
    generation Intel Xeon coprocessor only supports SP vrsqrt, which means the DP
    vectors need to be converted to SP. If we unroll the loop by a factor or two,
    we can pack 16 elements from two DP vectors into one SP vector for the reciprocal
    sqrt. The code sequence that computes the reciprocal square root with the conversions
    and the marshalling/unmarshalling of the DP vectors is outlined in Figure 9.5.
    This sequence takes 36 cycles. Using the unrolled loop, the other operations take
    104 cycles bringing the total to 140 cycles to 64 elements by each core using
    all-4 threads. This yields 0.457 particle interactions computed on average per
    cycle in DP.


    The next generation of the Intel Xeon Phi coprocessored Knights Landing will support
    the AVX-512 instruction set includes a DP reverse square instruction. This will
    improve the number of interactions in DP to 0.571 interactions per cycle and eliminate
    precision losses due to the connection to SP.


