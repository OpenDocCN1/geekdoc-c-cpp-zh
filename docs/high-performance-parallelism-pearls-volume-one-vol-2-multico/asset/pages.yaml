  md: '# 174 CHAPTER 9 SOLVING DIRECT N-BODY ON MANY-CORES


    # SUMMARY


    In this chapter, we presented an optimized version of a direct N-body kernel for
    the Intel Many Integrated Core architecture. The optimized version also showed
    an improvement in the performance on regular processors. Important optimizations
    for the Intel Xeon Phi coprocessor were discussed:


    +   - Effective factorization, proper data alignment, use of upper transcendental
    functions, and data layout.

    - Providing enough parallelism, reducing overhead, and avoiding load imbalance.

    - Effective use of the memory hierarchy by using loop tiling.


    These optimizations increased the maximum performance of 52.7 and 20.5 interactions
    per second in SP and DP, respectively, to maximum performance of 76.3 (a 44% improvement)
    and 30.6 (a 66% improvement) interactions per second. This optimization also increased
    the performance on an Intel Xeon processor by about 10% using the identical source
    code.


    This chapter also discussed how quickly we get a target for the optimization process.
    The final optimized version of the code obtained 89% of the upper bound performance
    which seems a satisfactory stopping point for our optimization efforts.


    We also showed that our efforts to optimize for the Intel Xeon Phi coprocessor
    also had a positive effect on our performance on an Intel Xeon processor.


    # FOR MORE INFORMATION


    Following is a list of additional reading materials that are related to the concepts
    discussed in this chapter:


    +   - Vladimirov, A., Karpusenko, V., 2013. Test-driving Intel® Xeon Phi™ coprocessors
    with basic N-body simulation. http://research.colfax.com/post/2013/01/07/Nbody-Xeon-Phi.aspx.

    - N-body Problem, http://en.wikipedia.org/wiki/N-body_problem.

    - Arora, N., Springhaure, A., Vuduc, R., 2009. Direct N-body kernels for multicore
    platforms. In the International Conference on Parallel Processing ICP.

    - Rodionov, S.A., Sotnikova, N.Ya., 2005. Optimal choice of the softening length
    and time step in N-body simulations. Astronomy Reports 49 (6), 470–476.

    - Loop tiling, http://en.wikipedia.org/wiki/Loop_tiling.

    - Download the code from this and other chapters: http://lotsofcores.com.'
