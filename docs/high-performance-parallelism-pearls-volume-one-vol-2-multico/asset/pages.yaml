  md: '# Foreword


    I am extremely honored by the invitation to write the foreword to this book for
    two reasons: first, the Intel® Xeon Phi™ coprocessor is a really thrilling "compute
    brick" that CERN and the High Energy Physics (HEP) community can leverage to help
    satisfy our homong computing needs. Of course, many other scientific, and engineering
    endeavors around the world will benefit for similar reasons. Secondly, this book
    represents a magnificent set of examples that can teach programmers and scientists
    how to get the most from multicore and many-core processors.


    # HUMONGOUS COMPUTING NEEDS: SCIENCE YEARS IN THE MAKING


    CERN began to prepare for the Large Hadron Collider (LHC), in the early 2000s,
    to be capable of reaching high energy ranges far beyond the particle accelerator
    itself. The endeavor reached far beyond building the particle. Four experiments
    had already been formed and scientists were bearing away on a broad set of activities.
    Experiments ALICE, ATLAS, CMS, and LHCb had thousands of participating physicists.
    Activities ranged from detector design and construction, to the design and development
    of the large-scale scale reconstruction frameworks necessary to process petabytes
    of experimental data. All in the quest for ground breaking.


    # OPEN STANDARDS


    Standards are important to the industry, and investing in open standards has always
    been a goal for CERN. We found that this aligned with philosophies at Intel as
    well. In collaboration with hundreds of scientific institutes and laboratories
    from the HEP community, we decided to establish the LHC Computing Grid (LCG) based
    on commodity x86 servers. In 2001, CERN established the CERN reopen, an entity
    that would investigate technologies potentially relevant to the LHC. Intel joined
    as an industrial partner from the very beginning. In reopen we were involved in
    futuristic R&D where the outcomes could be formidable successes or dramatic failures.
    This was, and still is, a real R&D laboratory!


    Our keen interest in open standards also led to our encouragement for Intel to
    move to Linux for the Intel Xeon Phi processors. Intel succeeded in delivering
    a very stable Linux-based system and provided their implementation in open source
    to encourage innovation.


    # KEEN ON MANY-CORE ARCHITECTURE


    A decade ago, the Intel Xeon processor was quickly evolving into powerful multicore
    processors. This was a godsend for the HEP community since each physics event
    (the full picture of all particles resulting from a collision) is independent
    of all others and a large set of events can be computed using trivial parallelism.
    At openlab, we strive to ensure the best possible throughput for each new system
    generation.'
