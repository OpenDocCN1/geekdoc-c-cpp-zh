    # SCALING RESULTS


    Scaling according to dataset size on a single coprocessor is shown in Figure 7.7
    and demonstrates that the native PCA exceeds a TF/s for several of the larger
    datasets. In addition, the performance of the coprocessor (12-core 3.3 GHz Intel®
