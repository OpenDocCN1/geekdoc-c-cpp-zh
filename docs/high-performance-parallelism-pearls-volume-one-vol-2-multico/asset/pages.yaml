    # VERSION 3.0: STACK MEMORY


    There are many local arrays in the longterm subroutine. In Version 2, these arrays
    are dynamically allocated on the heap. These arrays are thread-safe but usually
    not scalable. In this version, we use automatic instead of allocatable arrays
    for these local variables. For example, the thread array in the example section
    has sections


    ```

    real ::tmp (lo(1)-hi(1)+4,

    lo(2)-hi(2)+4,

    lo(3)-hi(3)+4)

    ```


    One caveat is we need to make sure that each thread has large enough stack memory.
    This can be achieved by using the "OMP_STACKSIZE" environment variable. Figures
    4.10 and 4.11 show the new scaling for version 3.0. On Intel Xeon Phi processors,
    we see a dramatic improvement in performance and scaling (~70x, ~38x from version
    1.0). Xeon performance and scaling also benefited slightly. But, we have traded
    one problem for another. Now, the OMP_STACKSIZE needs to be very large when running
    small number of threads. This is screaming for some type of blocking optimization.


    # VERSION 4.0: BLOCKING


    Version 4 requires a large stack memory for each thread especially when the number
    of threads is used to scale. To reduce the constraint on stack size, we can further
    divide the subdomain for each thread into smaller blocks. The size of the block
    can be made into a runtime parameter via inputs_smc file. The call to longterm
    is now placed inside a loop over the blocks (see Figure 4.12). An additional advantage
    is that this can reduce the working set size resulting in better cache performance.
    Note that this has no effect for cases in which the subdomain before blocking
    is already smaller than the targeted block.'
