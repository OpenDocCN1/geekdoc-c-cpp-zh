    code like HBM.


    The use of relatively coarse grids, with central difference or pure unwind schemes,
    for tracer advection gives false predictions of sharp fronts or many wiggles.
    The so-called total variation diminishing (TVD) scheme (Harten, 1997) enables
    prediction of sharp fronts and preserves monotonicity (absence of "overshoots")
    without spurious oscillations in the scheme. This TVD properties are, however,
    often difficult or even impossible to prove for general multidimensional schemes
    and therefore in applications one-dimensional limiters are usually applied in
    coordinate direction to ensure some monotonicity. Even when free-surface flows
    which exhibit changes in space and time such as drying and wetting, this can be
    achieved in some tracer advection schemes if essential conditions can be fulfilled
    (Gross et al., 2002): The first is the so-called consistency with continuity (CWC)
    concept which regulates the tracer advection equation is consistent with the discretized,
    free-surface continuity equation. The other element is appropriate definition
    of flux heights at the face of the cells.


    The actual numerical scheme before the tracer advection in HBM is attributed to
    Kleine (1993). The current implementation of that scheme with the required modifications
    for the CWC concept and appropriate flux heights for dynamically-two nested configurations
    with multiple tracers was done by the present authors who also added the data
    structures for the indirect addressing and added MPI and OpenMP support as well
