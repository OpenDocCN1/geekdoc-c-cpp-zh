  md: '# CODING THE HYPER-THREAD PHALANX 93


    # WHAT IS NONOPTIMAL ABOUT STRATEGY?


    First, all the HT siblings of one core share the L1 and L2 cache of that core.
    Each core has separate L1 and L2 caches. Therefore, each of the three HT siblings
    of the original tiled (which used three out of the four available HT siblings)
    could effectively use one-third of the core''s shared L1 andor L2 cache. Additionally,
    depending on the start points, the HT siblings may experience false sharing and
    evict each other''s hot cache lines. This is not an efficient strategy.


    Moving on from the best settings for the original tiled code, a different tactic
    to perform tiling is chosen and described here.


    # NOTE


    Hardware threads (HT) vs. hyper-threads (HT). Technically, Intel has only called
    a Hardware thread "hyper-thread" on the Intel processors where there are two threads
    available per core in some designs while other Intel processors remain single-threaded
    per core. On Intel Xeon processors, there are four threads per core but the cores
    are in order in the first product (codename Knights Corner, KNC). KNC is intel
    to point out that these are not hyper-threads because they use performance for
    some highly tuned workloads. Hyper-threads, it are mostly useful for non-HT users
    who have less to offer for HT usage. Turning off hyper-threads, even if it is
    possible, on KNC could allow lower performance. KNC threads are in order which
    means the additional threads have high memory latency and access to all of the
    vector-processing unit. The next generation Intel Xeon product (codename Knights
    Landing, KNL) will not be in order so it would be reasonable to guess whether
    it have hyper-threads. We knew this with, and then realized that the techniques
    of this chapter work well with both HT capabilities. Therefore, we chose to say
    "hyper-threads" all the time and end up HT as much of the time. This is what to
    say: HT works for whatever it matters, we know KNC does not have hyper-threads
    but we think KNC. We will hit hyper-thread you call it.


    # CODING THE HYPER-THREAD PHALANX


    The Hyper-Thread Phalanx is introduced by changing the outer computation loop
    such that the HT threads within each core neighboring z in the direction and x
    (vector by vector). The technique for doing so will be discussed, later let us
    examine the reasoning behind this choice of access pattern. For this specific
    computational loop, the Hyper-Thread Phalanx designs L1/L2 cache hit ratio.


    Expanding on Figure 5.4 of a single thread, we will look at illustrations of 2-wide
    and 4-wide Hyper-Thread Phalanxes. These allow hit to processors as we


    Of each image Figure 5.5, the left c is the center of the X column processed by
    HT(0) or, the right c is the center of the X column processed by HT(1). The left
    image illustrates the cold cache penetration of X (into page), Advances to right,
    Y. The c''s, highly shaded, indicate one of the threads a cache miss, while the
    adjacent accessing the same cell experience a cache hit. The right image illustrates
    the next drill of X. Now the estimated cache effect. The c''s and c''s of both
    threads experience cache hits. Using three threads and four threads per core,
    the image would show three c''s and four c''s. The cache hit ratio is 10/14 (71.43%)
    for 2-wide, 16/21 (76.19%) for 3-wide, and 22/18 (78.57%) for 4-wide Hyper-Thread
    Phalanxes. These sketches indicate a potential for significant improvements over
    the single-thread layout of 3/7 (42.86%).'
