  md: '# DEEP-LEARNING NUMERICAL OPTIMIZATION


    # 7


    Rob Farber

    TechEnablement.com, USA


    Deep-learning numerical optimization algorithms have experienced a resurgence
    of interest due to the general availability of massively parallel coprocessors
    in combination with the abundance of video, audio, and social media data that
    are now available. Enabling new and more powerful Internet search capabilities
    or utilizing the ability of these algorithms to perform real-time pattern recognition
    for self-driving cars and augmented reality workflows are few examples of the
    many compelling reasons driving the use of these algorithms. With the right parallel
    mapping, a single Intel® Xeon Phi™ coprocessor can exceed a TeraFlOP (TFs) of
    sustained high single and double precision performance on real machine-learning
    and numerical optimization problems in a production environment. It is interesting
    to note that this performance can be achieved in user-developed code without relying
    on the performance of optimized libraries such as the Intel Kernel Library, Demonstrating
    that “normal” programmers outside of Intel can write very high-performance applications
    in compiled code. Near-linear scaling and petascale performance can be achieved
    through the use of Message Passing Interface to coordinate the computations and
    code delivered 2.2 Petaflop (PF/s) of sustained high precision training on 3000
    Intel Xeon coprocessors in the TACC (Texas Advanced Computing Center) Stampede
    supercomputer. Both high performance and large memory make the Intel Xeon Phi
    coprocessor family an ideal platform for training on the large datasets that are
    required to solve complex and high-dimensional pattern recognition problems.


    # FITTING AN OBJECTIVE FUNCTION


    Mathematical modeling is a branch of abstract mathematics that creates an abstraction
    of reality that can be used for analysis and prediction. Data-driven numerical
    models are generally amenable to computer implementation making them useful analytic
    and embedded system tools. In particular, functions inferred by neural networks
    have predictive power, meaning they can correctly forecast future values in a
    time series, perform classification tasks, signal processing, respond and adapt
    to complex and unforeseen stimuli in robotics and real-time systems. See the references
    to Duda and Hart, as well as, Farber and Lapedes in the additional information
    section at the end of this Chapter.


