  md: '# 222 CHAPTER 12 CONCURRENT KERNEL OFFLOADING


    When offloading multiple kernels concurrently from the host we have the following
    measures beneficial to improve the workload''s performance on the coprocessor:


    **Thread affinity** (see Section "Coprocessor device partitioning and thread affinity\):
    OpenMP thread groups and their affinities persist during the program execution
    unless the parallel region changes.


    +   - When offloading an OpenMP host program, an initially mutually exclusive
    offload to the coprocessor with thread creation on the coprocessor should be performed
    before the actual computation(s). In this way, thread placements within the offload
    region mean the parameters to `MIC_KMP_AFFINITY` and `MIC_OMP_PLACES`.


    +   - Offloading from an MPI host program requires exclusive thread placement
    on the coprocessor, by means of using `sched_affinity()` or by setting `MIC_KMP_PLACE_THREADS`
    to apply an appropriate logical partitioning of the coprocessor. Within the partitions
    assigned to `MIC_KMP_AFFINITY` and `MIC_OMP_PLACES` are effective.


    **Data transfers** (see "Concurrent data transfers"): The current COI implementation
    provides exclusive communication channels between the coprocessor and the host
    (for kernel invocation in the offload model), which uses a single data transfer
    channel only.


    +   - Concurrent data transfers from within an OpenMP host application can suffer
    from serialization because of the single data channel, and contention on COI data
    structures. The effect becomes obvious when data packages are small.


    +   - With MPI each MPI process has its own data channel. Contention effects are
    not present unless the application uses hybrid MPI + OpenMP parallelism.


    +   - If transfers of small messages take place, use a moderate number of OpenMP
    threads or switch to hybrid MPI + OpenMP.


    We applied the concurrent kernel offloading approach to two real-world cases:
    MKL dgemm computation and a 3D simulation.


    For `dgemm` (see Sections "Coprocessor device partitioning and thread affinity"
    and "Concurrent data transfers") the observation is, that the overall performance
    on the coprocessor increases almost linearly with the number of concurrent offloads
    as long as the coprocessor can handle the traffic count. Data transfers between
    successive `dgemm` offloads can break down the performance significantly when
    using OpenMP on the host. However, switching to MPI, almost no performance loss
    compared to no data transfers. For workloads that execute `dgemm`-like operations,
    programmers may use our MKL examples as a recipe on how to easily partition a
    coprocessor for multiplication of small or medium-sized matrices.


    Our example shows how the MKL recipe can be applied to more complex workloads
    and to avoid some of the peculiarities associated with concurrent offloading.
    Our code uses concurrent kernel offloading in a way which at first seems strange,
    but after a short time of thinking makes sense: we split a computation with P
    threads into $m$ concurrent computations with $P/m$ each. Each of the concurrent
    offloads solve $1/m$ of the problem each, and afterwards combine results. Since
    our PD compute kernel does not scale to threads that meet the processor threading
    requirements the concurrent approach can help increase the program performance.
    With 8 concurrent offloads using 30 threads each, we observe about 25% gain over
    using 240 threads within a single offload.'
