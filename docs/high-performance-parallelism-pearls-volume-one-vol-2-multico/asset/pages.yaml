  md: '# CHAPTER 11 DYNAMIC LOAD BALANCING USING OPENMP 4.0


    The Intel Xeon Phi coprocessor can be addressed using three main programming paradigms:
    "native,"symmetric," and "offload.\. The native mode is a fast way to get existing
    software running with minimal code changes. Unlike general-purpose graphics units,
    Intel Xeon Phi coprocessors are able to execute native applications where the
    application runs in the coprocessor''s operating system and does not require a
    host execution on the CPU. In this case, each coprocessor can be seen as a standalone
    multicore symmetric compute device. Or, to run in a native mode on the coprocessor,
    the code needs to be ported, but the generality between the Intel Processor and
    coprocessor devices and software stacks makes this porting relatively trivial.
    Exploiting the larger number of cores (well as wider vector units) on the coprocessor
    might require much more work compared to a standard multicore processor, but that
    the same programming models can be used for both. This is why the native approach
    is the first step that users are likely to take when approaching the Xeon Phi
    architecture. However, approaching the coprocessor in native mode limits access
    to only one Intel Xeon coprocessor and ignores the resources available on the
    CPU host.


    The symmetric mode is of interest for codes already able to run on distributed
    memory systems (e.g., MPI-based codes). It is called symmetric because it allows
    the code to exploit both the processor and the coprocessor resources available
    on a cluster simultaneously. In this case, all compute devices can be executed
    in parallel. While the steps needed for a basic port to coprocessor-clusters in
    symmetric mode is generally trivial as those to enable the code in native mode,
    the complexity of load balancing such a heterogeneous system of compute devices
    in reality can be very challenging.


    With the offload mode, the application is launched on the host system (i.e., using
    the CPU) and initialization of data also takes place on the host. The code subsequently
    uses the PCIe bus to push (offload) part of the data and specialized executable
    code to the device for processing. After processing, results are pulled back to
    the host. In the case of the Intel Xeon Phi coprocessor, the programmer can use
    compiler directives to offload. The offload mode can be used on standalone machines,
    as well as in clusters, where on each machine, one or several MPI processes are
    launched, each performing offload.


    Offload mode is often the mode that requires the most programming effort, it is
    often the mode in which the potential reward is in. particular.


    +   - it allows a single code to exploit both the host, and the device;

    - it avoids the complexity of load balancing at the MPI level, which can be particularly
    challenging for large-scale codes;

    - it prepares the code for any foreseeable future evolution of products with the
    Intel Xeon® and Intel Xeon Phi brands.


    Exploiting the advantages of the offload mode in an efficient manner can present
    its own challenges. For example, exploiting the host and device concurrently,
    so as to avail of their combined computing potential while alternating between
    the two devices, can be nontrivial (Figure 11.1). In addition, achieving an optimal
    balance of workload over each compute device so that there is no time lost in
    waiting for a particular device to reach synchronization points can also be challenging.


    In this chapter, we demonstrate how to achieve an optimal balance of workload
    between Intel Xeon processors and any number of Intel Xeon Phi coprocessors. Moreover,
    to take full advantage of the unified programming model of the both, we will use
    the newly released OpenMP 4.0 standard. This standard


