    The thread-safety requirement follows from the fact that F receives contributions
    Fj from different threads in the parallel. An obvious approach to tackle this
    issue is for P threads to allocate an additional buffer to hold the components
    Fi = -Fi, and afterwards to accumulate these buffers into F. The memory consumption,
    however, is in O(P · N), and it is going to “explode” with an increasing number
    of threads. A better approach with space complexity O(N) is as follows:


    Parallel Algorithm (non-concurrent): (0a) Create two buffers F and F* of length
    N each, and set F≡0 and F*≡0 . (Distribute contributions of forces Fi evenly among
    P threads. Now perform the following iteration, starting at k=0:


    +   (1) Thread i [0, P-1] performs computation:

    for i in "i-values"

    for j = mod(p+k, P) to i-1 increment by P do

    fi = "compute Fi", F[j]=F[j]+ F*[j]=-fi

    end for


    +   (2) Increment k = k+1: if k equals P merge buffers, then, F = F+F* and EXIT

    SYNCHRONIZE and go to (1).


    Step (1) is executed P times. In each iteration, threads access disjoint elements
    of buffer F* by computing contributions F, for j-values that are apart P and have
    an offset from j=0 that is unique across all threads—see “mod(p+k, P)” in the
    second loop. Thread safety with space complexity O(N) is achieved at the expense
    of synchronization between consecutive iterations.


    The performance of this algorithm using 22 OpenMP threads on an Intel Xeon Phi
    coprocessor is illustrated in 12.2 (using SIMD optimized code) for 16k cores.
    The scaling is scalable up to 30 threads


    Parallel Algorithm (concurrent): Instead of one thread group of size P, we use
    m groups of size P'' = P/m each. The threads now have a group identifier g ∈{0,
    m-1}, a group identifier p ∈{0, P''-1}, and a global identifier g'' = g+P'' that
    is used to distribute the i-values among threads.


    By (0a) allocating the buffers F and F* per group, and (0b) initializing them
    to zero, we can use our non-concurrent algorithm within the groups (we start at
    k=0):


    +   (1) Execute step (1) with synchronization in the concurrent case is P'' <
    P, and the number of threads participating in the per-group synchronizations is
    reduced to P''.

    2) Increment k = k+1: if i equals P'' merge buffers, then, F'' = F+F* and EXIT,
    SYNCHRONIZE threads and go to the step (1).


    The number of iterations to get the final values of Fi, it is necessary (3) to
    accumulate the forces of the m groups.


    12.11 illustrates the parallel algorithm using concurrent offloading to the coprocessor
    in a multi-threaded host of size m = 8. Step (0a) is illustrated and not shown.

    (0b''), (1'') and (2'') are performed on the Intel Xeon coprocessor, where P''
