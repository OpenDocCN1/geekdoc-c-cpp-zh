  md: 'Digital potentiometers: This type of potentiometer, similar to a multiplying
    DAC, typically offers 10 bit resolution, allowing parameters to be set with a
    resolution of about 0.1%.


    If the input of such a potentiometer is connected to +1 or -1, it can even be
    used as a simple and cheap DAC allowing the digital computer not only to control
    parameters but also to feed time-varying values to the analog computer.


    inputs: Many applications, such as parameter optimization, include some conditions
    which have to be sensed by the digital computer in order to abort a computer run
    or change some parameters. This is typically achieved by means of comparators
    yielding a digital output signal which can be read by the digital computer using
    a digital input channel of the hybrid controller.


    Using digital output lines of the hybrid controller, electronic switches, such
    as those used in the CMP4 module, can be controlled by the attached digital computer.
    A typical application for this is to step functions to a simulated system.


    out One of the most important functions a hybrid controller must implement is
    a readout capability including provisions for data logging. Ideally, the analog
    computer features a central readout system which allows every element to be addressed
    unambiguously. In this situation, the hybrid controller takes over control of
    the lines of this system while the analog readout line is connected to the hybrid
    controller''s ADC.


    The time required for a single readout operation is highly critical and includes
    the time to address and select the computing element, the time required by the
    ADC for one conversion, and the time for transmitting the digital value to the
    digital computer.


    If many elements have to be read during a computation over and again, it can be
    necessary to place the analog computer in HALT-mode before starting readout operations
    and to reactivate OP-mode afterwards in order to avoid excessive skew between
    the individual data values being read. This becomes more and more important with
    increasing $k_0$ values (time scaling) of the integrators in a given setup.


    1 shows the front panel of the Analog Paradigm hybrid controller (HC). The group
    of 16 2 mm jacks in the lower half is connected to eight digital potentiometers
    with a resolution of 10 bits. The second group of 16 jacks in the lower half connects
    to eight digital input lines and each digital output lines. On the left is the
    USB port while an additional HALT-input and a trigger output are provided on the
    lower right. The module controls all address, data, and con'
