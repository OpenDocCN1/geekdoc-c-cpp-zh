    with time scale factors $k_0 = 10^n$ with $n \in \mathbb{N}$ typically ranging
    from 0 to 3 although some large historic systems, such as the EAI 680,$^{20}$
    feature time scale factors up to $10^5$.


    By changing the time scale factors of the integrators in a computer setup it is
    possible to speed up a calculation or slow it down. This is known as time scaling.
    Consequently, it is necessary to distinguish between **problem time** $t,$, the
    time scale the problem under investigation runs in, and **machine time** $\tau$,
    the time scale the computer operates in, as determined by the time scale factors
    set on the integrators.


