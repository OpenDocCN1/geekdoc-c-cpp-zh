  md: "# APPENDIX C\n\n# MIKUSIŃSKI's operational calculus\n\nThis appendix briefly\
    \ describes an alternative technique to the LAPLACE transformation, which can\
    \ be used to solve certain differential equations analytically.\n\n# C.1 Introduction\n\
    \nThe Polish mathematician JAN MIKUSIŃSKI developed an operational calculus, the\
    \ Calculus of MIKUSIŃSKI,162 which will be explored here. His work justified the\
    \ empirical operator calculus developed and used by OLIVER HEVISIDE to tackle\
    \ the problems of signal transmission along undersea cables.163\n\nMIKUSIŃSKI\
    \ starts his work with the convolution of two integrable functions $f, g: [0,\
    \ \\infty) \\to \\mathbb{R}$,\n\n```\n$(g * f)(t) = \\int_{0}^{t} g(t - \\tau)f(\\\
    \tau)d\\tau \\quad (C.1)\n```\n\nwhich is basically an operation on two functions\
    \ $f$ and $g$ yielding a third function. One of the functions involved, such as\
    \ $g$ above, can be interpreted as a\n\n162 Cf. [MIKUSIŃSKI 1983] and [OKAMOTO\
    \ 1979].\n163 See [HEVISIDE 1893]."
  merge: -1
