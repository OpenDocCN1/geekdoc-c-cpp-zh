  md: '# 78 — 5 Special functions


    ![](img/682c64a490ca5f23332f702a346c8b96_92_0.png)


    **Fig. 5.1.** Basic setup for generating an inverse function


    At the heart of this circuit is a function generator that forms the feedback element
    of an open amplifier. With an input signal of $x$ the summing junction will be
    zero, if $-x = f(-y)$ with $y = f^{-1}(x)$ being the value at the output of the
    amplifier.


    If the inverse function is not defined over the full range of $[-1, 1]$, precautions
    are necessary to prevent the amplifier from overloading. It is sometimes necessary
    to connect a small capacitor, typically 10s of pF, between the output of the operational
    amplifier and its summing junction, if the basic setup shows signs of instability.¹49


    # 5.1. Square root


    A good example of an inverse function is the square root circuit shown in figure
    5.2. This is basically the same as the setup in figure 5.1 with additional parts.
    A diode and a small capacitor are connected between the output of the open amplifier
    and its summing junction. The diode prevents saturation of the amplifier when
    the input becomes positive in this case the input to the amplifier and the output
    of the multiplier will be positive, driving the amplifier''s output to its maximum
    negative level.


    Although this does not harm the amplifier, driving into saturation will generate
    an overflow in addition to yielding a nonsensical output value. Furthermore, the
    amplifier may take some time to recover from this condition. This is especially
    true for classic analog computers, which can exhibit recovery times up to several
    seconds. Note that the diode will keep the amplifier''s output a tad below zero
    due to its forward threshold voltage – which is about 0.7 V for a standard silicon
    diode and as low as 0.2 V for a SCHOTTKY diode.


    > Such a setup can be seen with some justification as an integrator with very
    high time scale factor as determined by the small capacitor. Another approach
    to generating inverse functions, which can also be applied to division, will be
    shown in section 5.14.'
