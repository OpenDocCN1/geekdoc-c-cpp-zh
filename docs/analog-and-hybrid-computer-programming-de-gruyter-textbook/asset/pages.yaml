    Fig. 4.16. Mathematical pendulum (cf. [HORT 1910, p. 1])


    # 4.4.1 Straightforward implementation


    If it wasn''t for the term sin$(\alpha)$ in this equation, it could be easily
    solved by an analog computer using only summers, integrators, and coefficient
    potentiometers. This sine term makes things a little bit more complicated. If
    a sine function generator is available, it can be used to mechanize this equation.
    Otherwise one can resort to one of the following two approaches:


    If $\alpha$ is sufficiently small$^{43}$ sin$(\alpha)$ can be approximated as


    $$\sin(\alpha) \approx \alpha$


    which simplifies (4.6) to


    $$\ddot{\alpha} = -\frac{g}{l}$


    which is just (4.5) with $\omega^2 = g/l$, so the pendulum can be simulated with
    the computer setup already shown in figure 4.9.


    If $\alpha$ is not sufficiently small, either a sine function generator is required
    or one resort to the sweep circuit described above to generate the sine function


    > **43** What *sufficiently small* means actually depends on the precision required
    for a solution of this problem. Typically, $-\pi/8 \le \alpha \le \pi/8$ can be
    considered small enough as the error will stay below 1%.'
