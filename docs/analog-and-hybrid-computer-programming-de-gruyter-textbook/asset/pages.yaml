    Fig. 2.2. Graphical symbol of an operational amplifier


    To understand the behaviour of a summer a look at its implementation is necessary.
    Like most other analog computer elements, it is based on an *operational amplifier,
    opamp* for short, the graphical symbol of which is shown in figure 2.2. An operational
    amplifier has two inputs, one inverting and one non-inverting, denoted by — and
    + in the figure. It yields the sum of the values applied to these inputs, amplified
    by its large (infinite) *open-loop gain* $\mathcal{A}$ that is characteristic
    for a particular operational amplifier. Typically, gains of $10^5$ to $10^9$ can
    be achieved.$^{12}$ The use of this type of amplifier in analog computers give
    rise to the name *operational amplifier*, as they form the basis of computing
    elements implementing mathematical operations.


    In a typical analog computer, the non-inverting input of the operational amplifiers
    is *grounded*, i. e. connected to the analog ground rail, usually denoted by *GND*,
    which is at the potential representing the value zero; this effectively disables
    this input.$^{13}$


    To build a summer based on an operational amplifier the concept of *negative feedback*
    is used. This technique was pioneered by HAROLD STEPHEN BLACK in 1927. The basic
    idea is to use part of the signal at the output of the operational amplifier and
    feed it back to its inverting input, basically controlling the overall behaviour
    of the resulting circuit by the feedback circuit, instead of relying on the characteristics
    of the bare amplifier. This idea is central to nearly all oper


    12 Operational amplifiers are rather complex devices. More in-depth information
    can be found in [JUNG 2006].


    13 In classical analog computers, this non-inverting input was normally connected
    to ground directly, but used to implement an active drift-compensation. More details
    on this can be found in [GOLDBERG et al. 1954], [KORN et al. 1964, pp. 137 ff.),
    [ULMANN 2013, pp. 61 ff.] etc.'
