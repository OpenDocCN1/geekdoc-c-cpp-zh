    # 5.13 Sample & Hold


    A **sample and hold** circuit is used to sample an input signal and hold this
    value until another sample is requested. A simple circuit for such a device is
    shown in figure 5.31.$^{55}$ It simple (electronic) switch that is triggered by
    an external signal (in this case applied to its associated comparator) feeding
    an integrator. The input of this switch is driven by an error signal which results
    from the difference between the current input signal and the value stored in the
    integrator. When the switch is closed the integrator will drive this error signal
    to zero, thus yielding the last input value at its output.


    It is desirable to have the integrator to a very large time scale factor such
    as $k_0=10^3$ or larger using inputs weighted by 10 or even 100 in order to follow
    the input signal with as little time lag as possible. The electronic switch may
    be substituted by a multiplier as long as this element has a negligible balance
    error.


    If the analog computer being used allows individual control of integrators, a
    sample and hold circuit can be setup more easily, as shown in figure 5.32. Many
    classic analog computers have a digital expansion system where the mode controls
    of at least some of the computer''s integrators are available. The Analog Paradigm
    INT4 module shown previously has four integrators, two of which can be externally
    controlled by means of jacks labelled ModeIC and ModeOP. Table 5.3 shows the four
    control signal combinations that can be applied to integrator regardless of the
    current mode of operation selected on the computer''s control unit.


    To use an integrator as sample and hold circuit the ModeOP input should be tied
    to +1. Setting ModeIC to -1 will track the input signal while applying +1 to this
    input will hold the last value. Typically this works well because the initial
    condition circuitry features an input weight of at least 100 resulting in an overall
    time scale factor of $10^5$ with $k_0 = 10^3$.


    > $55$ Cf. [AMMON 1966, pp. 108 ff.].'
