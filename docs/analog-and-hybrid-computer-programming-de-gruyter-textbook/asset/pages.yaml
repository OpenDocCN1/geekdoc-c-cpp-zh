  md: "# 138 — 6 Examples\n\n![](img/682c64a490ca5f23332f702a346c8b96_152_0.png)\n\
    \n**Fig. 6.32.** Typical satellite trajectory for a small Fig. 6.33. Trajectory\
    \ for a larger value of G value of G\n\nFigure 6.34 shows the basic idea of the\
    \ simulation: The bounding box is assumed as the rectangle $[-1,1] \times [-1,1]$\
    \ and the position of the ball within this box is described by the coordinates\
    \ $(x,y)$. The ball has two initial conditions: an initial velocity $v_0$ (of\
    \ which only the $x$-component will be given) and an initial $y$-position $y_0$,\
    \ set to 1.\n\nThe $x$- and $y$-components of the ball's position are completely\
    \ independent, so they can be generated by two separate sub-programs. The $x$-component\
    \ of the ball's velocity is assumed to decrease linearly over time. The actual\
    \ $x$-position of the ball is derived by integrating its velocity. Every time\
    \ the ball hits the left or right wall of the box, it changes its direction, i.\
    \ e. it is reflected by the wall.\n\nThe $y$-component is that of a free-falling\
    \ ball bouncing elastically when hitting the floor. Figure 6.35 shows those two\
    \ variables over time as displayed on an oscilloscope: Starting from the left,\
    \ the computer is first in IC-Mode. As soon as the OP-mode starts, the ball begins\
    \ to drop until it hits the floor while the x-component increases (trace in the\
    \ middle) with decreasing velocity until it reaches the right wall.\n\nFigure\
    \ 6.36 shows the setup utilizing the $x$-component of the ball's position. The\
    \ leftmost integrator generates the velocity component $v_x$ of the ball which\
    \ starts at $+1$ and decreases linearly controlled by the $\\Delta v$-potentiometer.$95$\
    \ It should be noted that this setup differs slightly from the triangle generator\
    \ shown in figure 5.13 in section 5.5 by the introduction of a second comparator\
    \ with an associated electronic switch. This yields a stable comparison value\
    \ of $\\pm1$ for the first comparator since its associated switch no longer yields\
    \ $\\pm1$ at its output because it is driven by the leftmost integrator in this\
    \ setup.\n\n> 95 The diode at the output of the integrator is not really necessary\
    \ but it makes parameter setup easier as it prevents a negative velocity at the\
    \ cost of introducing a slight voltage drop determined by its intrinsic forward\
    \ threshold voltage."
