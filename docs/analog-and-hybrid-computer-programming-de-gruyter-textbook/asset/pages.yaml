  md: "# 58 4 Basic programming\n\nwhich will be set using the coefficient potentiometer\
    \ labelled $\\lambda$ in figure 4.3. Setting the time scale factor of the integrator\
    \ to $k_0 = 10^3$ will scale everything from seconds to milliseconds, yielding\
    \ the desired time-compression.\n\n# Scaling:\n\nScaling typically isn't as easy\
    \ as in the example above. The following general approach should be used:\n\n\
    +   1. Determine the interval for each variable in a computer setup. This can\
    \ be done by either\n    - guestating if the underlying differential equations\
    \ are not too complicated,\n    - solving the problem numerically, or\n    - experimentally,\
    \ by running the analog computer and observing the variables on an oscilloscope\
    \ etc. If a variable causes an overload, it is a good idea to scale it down by\
    \ a constant factor such as 2. If a variable is contained in a subinterval of\
    \ $[-1,1]$, it should be scaled up to minimize errors due to the implementation\
    \ of the computing elements.\n2. Variables to be scaled are typically the outputs\
    \ of a summer or integrator. In case of division, both numerator and denominator\
    \ have to be taken into account during the scaling process. To scale a variable\
    \ $x$ by a factor $\\xi$ the following steps are necessary (\\xi < 1$ scale down\
    \ when $\\xi > 1$ scales up):\n    - Scale all inputs to the summer or integrator\
    \ yielding $x$ by $\\xi$. In all places where $x$ is used as input to following\
    \ summers or integrators, a scale factor of $1/\\xi$ has to be introduced. This\
    \ is not directly possible with multipliers, dividers etc. as these computing\
    \ elements do not feature inputs with weights $> 1$. In these cases the inverse\
    \ scaling factor must be taken into account at a later stage.\n3. These steps\
    \ have to be performed for all variables in a given problem. Eventually, most\
    \ of the scaling factors introduced in the steps will cancel out the final computer\
    \ setup.\n\n# 4.2 Harmonic functions\n\nThe next example is a bit more complicated\
    \ and is based on the following order differential equation\n\n$$\\ddot{y} + \\\
