    # 2.7 Multiplication


    Interestingly, multiplication is much more complicated to implement with analog-electronic
    circuits than integration. Multiplication of two variables $x \cdot y$ can be
    seen as a function of $x$ and $y$ and is thus not easily amenable to the simple
    function generator approach as described above. Over the past 50 years many ingenious
    multiplication circuits have been devised²⁷ but today the GILBERT cell multiplier
    is often used as it offers high precision and can be easily implemented in an
    integrated circuit (IC).


    Figure 2.27 shows the most commonly graphical symbols for multipliers. Modern
    multipliers only need two inputs, $x$ and $y_i$, to compute $x \cdot y$, which
    applies to the symbol in the upper right and the two symbols in the second row.
    If a certain multiplier performs a sign-inversion, the symbol in the lower left
    is used to emphasize this behaviour. The symbol in the upper right is included
    for most historic reasons, as it applies to the quarter-square multiplier, which
    requires both variables $x$ and $y$ with positive and negative signs each.


    One of the most straightforward approaches to implementing a multiplier is to
    use two logarithm- and one antilog-function as shown in figure 2.28. This is analogous
    to the technique on which sign rules are based. The input values must avoid satisfy
    overload $\varepsilon_0, \varepsilon_1 > 0 + \varepsilon$ with $\varepsilon$ determined
    by the log function generators used to avoid an overload. Furthermore, to implement
