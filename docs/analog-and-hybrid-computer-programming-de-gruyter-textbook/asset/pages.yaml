  md: '# APPENDIX D


    # # An oscilloscope multiplexer


    Most oscilloscopes provide at least two $y$-channels, which allow the display
    of two curves at once on the screen. Although this is often sufficient for work
    with an analog computer, sometimes it is desirable to have not only two $y$-inputs
    but several pairs of $x$- and $y$-inputs. This allows multiple figures, each defined
    by a corresponding $x$, and $y$ signal pair, to be displayed. Since this is not
    possible with most standard oscilloscopes the need for an $x$, and $y$ oscilloscope
    multiplexer arises.$^{166}$


    Figure D.1 shows the schematic of a simple, yet powerful, for channel $x, y$ oscilloscope
    multiplexer. It features four $y$- and four $x$-inputs and yields a single $y$-
    and $x$-output to the oscilloscope. In addition to this, a $z$-signal is generated
    which can be used for automatic beam blanking, as the oscilloscope supports an
    external beam control input.


    The lower third of the figure contains the clock circuitry, which can be run in
    either of two modes as determined by the position of switch S1. In the upper position
    the multiplexer is free running by a simple astable multivibrator based on a NE555
    (IC1). If S1 is set to the lower position, the clock signal is activated every
    time in OP-mode. This is especially useful when repetitive operation is selected
    as the oscilloscope will switch from one input pair to the next in conjunction
    with the operation cycles. This circuit also generates the $z$-signal which turns
    the beam off when the analog computer is not in OP-mode as well as when switching
    from one input to another.


    > **166** If this functionality is only rarely used, the electronic switches of
    an analog computer can be used in pairs with proper control logic.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'The operational amplifier IC3 in conjunction with the potentiometer R5 is used
    to adjust the blanking signal level between +15 V and -15 V to suit the particular
    oscilloscope.


    The middle section of the schematic shows the two bit counter which selects one
    out of the four input signal pairs. The counter itself is built from two JK-flip-n-flops
    (IC6). Using switch S2 the number of channels displayed can be selected from one
    to four. The two address bits feed a two-to-four demultiplexer (IC4B) which yields
    four active-low logic signals controlling the two electronic quad switches IC7
    and IC9. Both outputs to the oscilloscope are buffered by simple impedance converters
    (IC8 and IC10).'
