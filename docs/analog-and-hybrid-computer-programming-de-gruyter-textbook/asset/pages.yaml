  md: "# 6.21 Heat transfer — 165\n\n![](img/682c64a490ca5f23332f702a346c8b96_179_0.png)\n\
    \n**Fig. 6.69.** Structure of the heated cable\n\n$r_i$. The current flowing through\
    \ the center conductor heats it to a constant temperature $T_0$. The outside of\
    \ the insulated cable is held at a fixed temperature $0$. The aim of this simulation\
    \ is to determine the heat distribution within the insulating material with respect\
    \ to time $t$ and radius $r$.\n\nThe general homogenous function of the *heat\
    \ equation* has the form\n\n```\n$\\frac{\\partial T}{\\partial t} - a\\nabla^2\
    \ T = 0 \\quad (6.52)$\n```\n\n$a$ is a constant term describing the *thermal\
    \ diffusivity* of the material. Generally, it is\n\n```\n$a = \\frac{k}{\\rho\
    \ c_p}$\n```\n\nwhere $k$ is the *thermal conductivity* of the material, $\rho$\
    \ is its density, and $c_p$ is the **specific heat capacity.**.\n\nThe temperature\
    \ $T$ within the material is a function of time $t$ and a location vector $\\\
    vec{x}$, i.e. $T(\\vec{x}, t)$. The arguments of the function $T$ are typically\
    \ omitted to avoid unnecessary clutter in the equations.\n\n$\\nabla^2$ is the\
    \ LAPACE operator which is also often denoted by $\\Delta$. It is\n\n```\n$\\\
    nabla^2 T = \\Delta T = \\text{div}(\\text{grad}(T)). \\quad (6.53)$\n```\n\n\
    Due to the inherent rotational symmetry of the two-dimensional cross section of\
    \ the cable shown in figure 6.69, a one-dimensional flat slice running from the\
    \ center to the circumference is sufficient to describe the overall problem. Due\
    \ to (6.53) the LAPACE operator can be simplified to\n\n```\n$\\nabla^2 T = T''.$\n\
    ```\n\nSince the cable in question is a heat source, the general heat equation\
    \ (6.52) has been adapted as follows adding another derivative term:\n\n```\n\
    $\\frac{\\partial T}{\\partial t} = a \\left( \\frac{\\partial^2 T}{\\partial\
    \ r^2} + \\frac{\\partial T}{\\partial r} \\right) \\quad (6.54)$\n```"
