  md: '# 6.9 Celestial mechanics — 135


    [MOULTON 1923, pp. 277 ff.] for an analytical treatment of this problem and some
    background information. However, using an analog computer, it is straightforward
    to investigate the three-body problem.


    In this simple universe consisting of two suns with fixed positions $\vec{r}_1
    = (x_1, y_1)$ and $\vec{r}_2 = (x_2, y_2)$, masses $m_1 = m_2 = 1$, and a satellite
    of negligible mass cross-crossing between these two celestial bodies will be simulated.
    This system can be readily described by the following set of coupled differential
    equations:


    ```

    $m_1\ddot{\vec{r}}_1 = Gm_2\frac{\vec{r}_2 - \vec{r}_1}{|\vec{r}_2 - \vec{r}_1|^3}
    + Gm_3\frac{\vec{r}_3 - \vec{r}_1}{|\vec{r}_3 - \vec{r}_1|^3}$

    $m_2\ddot{\vec{r}}_2 = Gm_3\frac{\vec{r}_3 - \vec{r}_2}{|\vec{r}_3 - \vec{r}_2|^3}
    + Gm_1\frac{\vec{r}_1 - \vec{r}_2}{|\vec{r}_1 - \vec{r}_2|^3}$

    $m_3\ddot{\vec{r}}_3 = Gm_1\frac{\vec{r}_1 - \vec{r}_3}{|\vec{r}_1 - \vec{r}_3|^3}
    + Gm_2\frac{\vec{r}_2 - \vec{r}_3}{|\vec{r}_2 - \vec{r}_3|^3} \quad (6.27)$

    ```


    The vectors $\vec{r}_i$, $1 \le i \le 3$ describe the positions of the different
    bodies with masses $m_i$ while $G$ is the gravitational constant.


    Assuming that the two suns are stationary, only equation (6.27) has to be implemented
    on the analog computer, out yielding Since the suns'' masses are equal to 1 the
    satellite''s mass cancels out,


    ```

    $\ddot{\vec{r}}_3 = \frac{G}{|\vec{r}_1 - \vec{r}_3|^3}(\vec{r}_1 - \vec{r}_3)
    + \frac{G}{|\vec{r}_2 - \vec{r}_3|^3}(\vec{r}_2 - \vec{r}_3). \quad (6.28)$

    ```


    Introducing two distance terms


    ```

    $\Delta_{13}^3 = \left(\sqrt{(x_1 - x_3)^2 + (y_1 - y_3)^2}\right)^3 \quad (6.29)$

    ```


    ```

    $\Delta_{23}^3 = \left(\sqrt{(x_2 - x_3)^2 + (y_2 - y_3)^2}\right)^3 \quad (6.30)$

    ```


    and splitting (6.28) into its $x$- and $y$-components yields the two equations
    which describe the satellite''s trajectory in Cartesian coordinates:


    ```

    $\ddot{x}_3 = (x_1 - x_3)\frac{G}{\Delta_{13}^3} + (x_2 - x_3)\frac{G}{\Delta_{23}^3}
    \quad (6.31)$

    ```


    ```

    $\ddot{y}_3 = -y_3(\frac{G}{\Delta_{13}^3} + \frac{G}{\Delta_{23}^3}) \quad (6.32)$

    ```


    These equations can now easily be implemented on an analog computer. Figure 6.30
    shows the partial computer setup yielding the distance terms (6.29) and (6.30).$^{92}$


    > 92 The square root units followed by a multiplier each could be replaced by
    two diode function generators, if these are available.'
