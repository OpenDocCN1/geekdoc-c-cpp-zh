  md: '# 226 B The LAPACE transform


    ```

    $$\left[ -\frac{e^{-st}}{s} \int_{0}^{\infty} x \ dt \right] + \frac{1}{s} \int_{0}^{\infty}
    xe^{-st} \ dt + \frac{c}{s}$

    $$\$\frac{1}{s} \mathcal{L}(f(t)) + \frac{c}{s}$

    ```


    The constant $c$ is the initial value of the integral.


    # B.3 Further characteristics


    Given two functions $f(t)$ and $g(t)$ which can be subjected to a LAPLACE transform
    yielding $F(s)$ and $G(s)$, the transform has the following useful characteristics:


    ```

    $$\mathcal{L}(\lambda f(t) + g(t)) = \lambda F(s) + G(s)$ (linearity)$

    $\mathcal{L}(f(\lambda t)) = \frac{1}{\lambda} F(\frac{s}{\lambda})$ (scale factor)$

    $\mathcal{L}(e^{\beta t} f(t)) = F(s+\beta)$ (exponential damping)$

    $\mathcal{L}(f(t-T)u(t-T)) = e^{-TS} F(s)$ (time shift)$

    $\mathcal{L}((f * g)(t)) = F(s)G(s)$ (convolution, see (C.1))$

    ```


    # B.4 Inverse Laplace transform


    The INVERSE Laplace transform is defined as


    ```

    $f(t) = \mathcal{L}^{-1}(F(s)) = \frac{1}{2\pi i} \lim_{T\to\infty} \int_{\gamma-iT}^{\gamma+iT}
    e^{st} F(s) ds$

    ```


    with $y \in \mathbb{R}$ denoting a line in the complex plane. $y$ is chosen so
    that all singularities of $F(s)$ are on its left. This transform is known as the
    BROMWICH integral, after THOMAS JOHN L''ANSON BROMWICH and is typically solved
    using residue theorem.$^{160}$


    > 160 The line integral of an analytic function $f(z)$ over a closed curve $\gamma$
    can be determined by


    ```

    $f(z) dz = 2\pi i \sum_{j=1}^n I(\gamma, a_j)Res(f, a_j).$

    ```


    Here, $a_j$ denote a finite set of points where $f(z)$ has singularities while
    $I(a_j)$ is the winding number of the path $\gamma$ around the point $a_j$ and
    $Res(f, a_j)$ is the residue of $f(z)$ at the point $a_j$. See [CARSLAW et al.
    1941], [DUFFY 1994] for more information on this technique.'
