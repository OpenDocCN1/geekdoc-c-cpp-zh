  md: '# CHAPTER 1


    # Introduction


    # 1.1 What is an analog computer?


    A book about programming analog and hybrid computers may seem like an anachronism
    in the 21st century – why should one be written and, even more important, why
    should you read it? As much analog computers seem to be forgotten, they not only
    have an interesting and illustrious past but also an exciting and promising future
    in many application areas such as high performance computing (HPC for short),
    the field of dynamic systems simulation, education and research, artificial intelligence
    (biological brains operate, in fact, much like analog computers), and, last but
    not least, coprocessors for traditional stored-program digital computers, forming
    so-called hybrid computers.


    From today''s perspective, analog computers are mainly thought of as being museum
    pieces and their programming paradigm seems archaic at first glance. This impression
    is as wrong as can be and is mostly caused by the classic patch field or patch
    panel onto which programs are patched in form of an intricate maze of wires, real
    spaghetti code.... On reflection, this form of programming is much easier and
    more intuitive than the algorithmic approach used for storedprogram digital computers
    (which will be called digital computers from now on to simplify things). Future
    implementations of analog computers, especially those intended as coprocessors,
    will probably feature electronic cross-bar switches instead of a patch field.
    Programming such machines will resemble the programming of a field programmable
    gate array (FPGA), i.e. a compiler will transform'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# 2   Introduction


    a set of problem equations into a suitable setup of the crossbar-switches, thus
    configuring the analog computer for the problem to be solved.

    The of an analog computer has its roots in the Greek word ἀλόγον (“analog”) which
    lives on in terms like “analogy” and “analogue”. This quite aptly characterizes
    an analog computer and separates it from today''s digital computers. The latter
    have a fixed structure and are controlled by a program stored in some kind of
    random access memory.


    In contrast, an analog computer has no program memory at all and is programmed
    by actually changing its structure until it forms an analog, a model, of a given
    problem. This approach is in stark contrast to what is taught in programming classes
    today (apart from those dealing with FPGAs). Problems are not solved in a step-wise
    (algorithmic) way but instead connecting the various elements of an analog computer
    in a suitable manner circuit that serves as a model of the problem under investigation.
    Figures 1.1 and 1.2 illustrate these two fundamentally different approaches to
    computing. While a classic digital computer works more or less in a sequential
    fashion, the computing elements of an analog computer work in perfect parallelism
    with none of the synchronization issues that are often encountered in digital
    computing.


    # 1.2 Direct vs. indirect analogies


    When it comes to analogies in general, it is necessary to distinguish between
    direct and indirect analogies, which depend on the underlying principles of the
    problems being solved and the analogies used to solve them. In short, a direct
    analogy has its roots basically in the same physical principles as the corresponding
    problem, i.e. a soap-bubble being used to model a minimal surface, a metal sheet
    with heaters and thermocouples to investigate heat-flow patterns etc. If the physical
    principles underlying the problem and analog computer differ, the computer is
    called an indirect analog computer.


    For the remainder of this book only indirect analogies will be considered, as
    these are much more versatile in application than their direct counterparts. Typically,
    such machines are based on analog-electronic computing elements such as sumators,
    integrators, multipliers and the like.


    Although it sounds like a contradiction, analog computers can be implemented using
    purely digital components. Two such types of machine are digital differential
    analyzers (DDAs) and stochastic computers, examples of which have been built over
    many years and whilst they enjoy periodic renaissances, they have never entered
    the mainstream of computing. Programming these machines follows the same lines
    as programming analog-electronic computers (simply)'
  merge: -1
