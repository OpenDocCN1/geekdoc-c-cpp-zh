  md: '# 4.3 Sweep


    Sometimes it is useful to have a harmonic function *sweep* over a frequency range.
    In a laboratory environment this is typically done with a *sweep generator*, also
    known as *wobbulator*. Solving the differential equation


    $\tilde{y} = -\omega^2 y$


    $\omega$ varying linearly from 0 to 1 readily yields a harmonic sweep function.
    This is a particular variation of the computer setup shown in the preceding section.
    The basic setup is shown in figure 4.14.


    The underlying device is simple. The leftmost integrator generates a voltage running
    linearly from $-1$ to $+1$. Scaling this by a factor of 0.5 and adding 0.5 yields
    a linear ramp running from 0 to $-1$ at the output of this integrator. The two
    potentiometers used in figure 4.9 to set $\omega$ have been replaced by two multipliers
    in this circuit which are fed with the time-varying ramp for $\omega$.


    The resulting output signal is shown in figure 4.15. It should be noted that the
    amplitude could use some stabilization, as shown before, because the amplitude
    visibly increases with time.


    Basically, the subcircuit in the upper half of figure 4.14 can be used to generate
    $\sin(\varphi)$ and $\cos(\varphi)$, if $\varphi$ is given and fed to the two
    multipliers. This is actually a very useful circuit since many problems require
    harmonic functions for a wide range of the parameter $\varphi$ and have $\varphi$
    available elsewhere in the setup, as in the following example.


    Fig. 4.14. Basic sweep circuit


    ![](img/682c64a490ca5f23332f702a346c8b96_78_0.png)'
