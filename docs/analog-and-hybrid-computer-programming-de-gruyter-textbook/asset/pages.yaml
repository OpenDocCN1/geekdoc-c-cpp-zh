  md: '# 168 — 6 Examples


    A clever trick often used in cases like this, is to invert the signs of every
    other equation thus saving inverters by taking the implicit sign inversion that
    every integrator takes into account. Since this rough discretization shown above
    yields only three coupled ODEs, the second one must be rewritten as


    ```

    $-\hat{T}_2 = -\frac{7}{12}T_3 + T_2 - \frac{5}{12}T_1. \quad (6.59)$

    ```


    The resulting program is in figure 6.70 — due to the deliberate sign reversal
    in (6.59) no additional inverters are required. In general, $n-1$ integrators
    are needed to solve such a partial differential equation in which the derivatives
    are needed with respect to the variable other than they discretized by splitting
    them into $n$ slices. In order to minimize the error caused by this discretization
    the number of slices should be as large as possible; three integrators, in this
    example, is typically not enough to obtain reasonable solutions.


    # 6.22 Two-dimensional heat transfer


    Using the same idea of discretizing a continuous space into a discrete grid of
    cases in the previous example it is also possible to solve higher dimensional
    partial differential equations such as the two-dimensional heat equation$^{110}$


    ```

    $$\dot{u} = \alpha \nabla^2 u = \alpha \left(\frac{\partial^2 u}{\partial x^2}
    + \frac{\partial^2 u}{\partial y^2}\right). \quad (6.60)$

    ```


    $\alpha$ represents the diffusion of the two-dimensional medium and is set to
    $\alpha = 1$ to simplify things. Discretizing (6.60) along the $x$- and $y$-axes
    yields


    ```

    $$\hat{u}_{i,j} = \alpha (u_{i-1,j} + u_{i+1,j} + u_{i,j-1} + u_{i,j+1} - 4u_{i,j})
    + q_{i,j}. \quad (6.61)$

    ```


    describing a node in the grid, $q_{i,j}$ represents an optional heat source or
    sink at the node $u_{i,j}$. In the following example heat is only injected to
    or removed from node $u_{0,0}$, i.e. $q_{i,j} = 0$ if $i = 0$.


    Typically it is desirable to have as many grid nodes as possible in a simulation
    to minimize the error caused by the above discretization process. Classic analog
    integrator installations, especially those in the chemical industry which were
    used for the design of fractionating column often had many hundred integrators
    and sometimes in excess of thousand coefficient potentiometers. Whenever possible,
    inherent symmetries of a problem should be exploited in order to conserve computing
    elements.


    > 110 The author is deeply indebted to Dr. Chris GILES who not only suggested
    this problem and that of appendix A also did the major of the implementation.'
