  md: "# 4.2 Harmonic functions\n\nit bounces around in a box. In such cases a simple\
    \ computer setup like this normally not suffice as the amplitude of the sine/cosine\
    \ signal will not be constant over extended periods of time. This results from\
    \ the unavoidable imperfections of real computing elements. Depending on the computer\
    \ used the amplitude may increase or decrease over time, either collapsing to\
    \ zero or causing an overload of the integrators and the inverter.\n\nTherefore,\
    \ some additional circuitry is required for amplitude stabilization. The idea\
    \ behind this is fairly simple. On one hand, to avoid a decreasing amplitude,\
    \ some positive feedback must be introduced. This then makes a limiter necessary\
    \ to avoid the ever-increasing amplitude that would otherwise inevitably result.\
    \ These two measures will, of course, cause some, but normally negligible, distortion\
    \ of the resulting waveform, especially when the sine/cosine signals are used\
    \ to drive some sort of display.\n\nFigure 4.11 shows a setup of a quadrature\
    \ generator with amplitude stabilization. At its here is the circuit shown before\
    \ with the difference that the central feedback loop uses integrator inputs weighted\
    \ with 10 so that the overall time scale factor $10\tau$. The potentiometer labelled\
    \ a introduces positive feedback into the loop thus steadily increasing the amplitude\
    \ of the output signal. Depending on the analog computer this positive feedback\
    \ may be unnecessary. If the amplitude decreases without, it is sufficient to\
    \ a to a very small value (less than $10^{-2}$, typically). To avoid running into\
    \ an overload some negative feedback is required to keep the overall amplitude\
    \ stabilized. This is implemented by the potentiometer $a^*$ which is one of the\
    \ rare cases where a free potentiometer is required. The output (wiper) of that\
    \ potentiometer is connected to a diode that in turn connected to an integrator\
    \ input weighted with 1.\n\nThe idea here is to apply a negative bias to the diode\
    \ so that it starts conducting when the output of the leftmost integrator is higher\
    \ than this bias voltage. The diode will start conducting, essentially implementing\
    \ a negative feedback loop (with negative exponential characteristics). It is\
    \ important that the weight of the input connected to the diode is at least a\
    \ factor 10 smaller than the input for the main feedback loop.\n\nThis setup works\
    \ well on analog computers with buffered coefficient potentiometers, such used\
    \ here. If a classic computer without buffered potentiometers is used, the cathode\
    \ of the diode connected to the potentiometer $a^*$ should be connected to the\
    \ summing junction of the leftmost integrator.\n\n> 40 An even simpler implementation\
    \ uses the potentiometer $a^*$ and connects the output of the leftmost integrator\
    \ to its summing junction by means of two ZENER-diodes in anti-series. These diodes\
    \ will start conducting when the amplitude reach their combined threshold level,\
    \ thus effectively limiting the output of the integrator."
