    It is further assumed that the particle moves in the $x$-$y$ plane, which is perpendicular
    to the magnetic field. With $e_x$, $e_y$, and $e_z$ denoting the unit vectors
    pointing into $x-$, $y-$, and $z$-direction, this results in


    ```

    $$\vec{B} = B_z e_z \text{ and} \quad (6.21)$

    $$\dot{\vec{r}} = \dot{x}e_x + \dot{y}e_y \quad (6.22)$

    ```


    respectively. Applying a cross product to equations (6.21) and (6.22) yields


    ```

    $$\dot{\vec{r}} \times \vec{B} = \dot{y}B_z e_x - \dot{x}B_z e_y$.

    ```


    Combining with this equation (6.20) finally gives


    ```

    $m\vec{r} = m(\dot{x}e_x + \dot{y}e_y) = q(\dot{y}B_z e_x - \dot{x}B_z e_y) -
    \mu(\dot{x}e_x + \dot{y}e_y). \quad (6.23)$

    ```


    Splitting (6.23) into components results in


    ```

    $m\dot{x} = q\dot{y}B_z - \mu\dot{x}$

    $$m\dot{y} = -q\dot{x}B_z - \mu\dot{y}$.$$

    ```


    To simplify things a bit new variables are introduced:


    ```

    $$\alpha = \frac{q}{m}B_z \text{ and}$

    $$$\beta = \frac{\mu}{m}$$

    ```'
