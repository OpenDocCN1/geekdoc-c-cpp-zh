    ![](img/682c64a490ca5f23332f702a346c8b96_153_0.png)


    ![](img/682c64a490ca5f23332f702a346c8b96_153_1.png)


    **Fig. 6.34.** Movement of the bouncing ball


    **Fig. 6.35.** $x$- and $y$-component of the bouncing ball


    ![](img/682c64a490ca5f23332f702a346c8b96_153_2.png)


    **Fig. 6.36.** Generating the $x$-component


    The output of this circuit is fed to the $x$-input of an oscilloscope set to $x$,
    $y$-display mode. The time scale factors of the integrators in this example were
    set to $10^2$ and $10^3$ respectively.


    The $y$-component of the ball can be described by


    > $$\ddot{y} = -g + d\dot{y} \quad (6.33)$


    where $d$ denotes the damping coefficient due to air friction. This friction is
    assumed to be proportional to the ball''s velocity which is a significant simplification.$^{96}$
    When the ball hits the ceiling or floor of the box an additional term is introduced
    which is proportional to the depth of penetration:


    > $$\ddot{y} = -g + d\dot{y} \quad \begin{cases} +c(-y - 1) & \text{if } y < -1
    \ -c(y - 1) & \text{if } y > 1. \end{cases}$


    **96** Cf. section 6.6 for a more realistic model of drag.'
