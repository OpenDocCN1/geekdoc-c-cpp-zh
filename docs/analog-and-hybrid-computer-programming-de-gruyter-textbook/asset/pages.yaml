  md: '# 4.1 Radioactive decay


    Applying exp() on both sides and explicitly writing the argument $t$ this results
    in


    $N(t) = e^{-\lambda t+c} = e^{-\lambda t}e^c$.


    With $N(0)$ denoting the number of atoms existing at $t = 0$ we get


    $N(0) = e^0e^c = e^c$,


    finally yielding


    $N(t) = N(0)e^{-\lambda t}, \quad (4.3)$


    the universal *law of radioactive decay*$^{33}$ with $\lambda$ denoting the decay
    rate.

    Typically, the *half-life* $T_{1/2}$ denotes the time in which half of the atoms
    available at $t=0$ have decayed. It is linked to $\lambda$ by


    $T_{1/2} = \frac{\ln(2)}{\lambda}$,


    yielding the following form for the exponential decay that is typically found
    in textbooks:


    $N(t) = N(0)e^{\frac{\ln(2)}{T_{1/2}}t}$.


    # 4.1.2 Using an analog computer


    As previously noted, it is unusual that a differential equation describing a “real”
    problem is so simple that it can be easily solved analytically. In cases where
    no analytical solution is possible or if the work required to do so is too great,
    an analog computer can be used to simulate the behaviour of the dynamic system
    described by the DEQ under investigation. To accomplish this equation or the system
    of equations have to be transformed into a computer setup or program as be shown
    in the subsequent sections. This can be done in two ways, using either the KELVIN
    *feedback technique* or the *substitution technique*$^{34}$


    In the following, the KELVIN feedback technique, which is quite straightforward,
    will be used here: the differential equation is first rearranged so that its derivative
    is isolated on the left side of the equation. It is then assumed that this derivative
    is known. Feeding it to a chain of integrators with summers where necessary etc.,
    all lower derivatives on the right-hand side of the equation will be obtained.
    These lower derivatives are then combined using suitable elements to yield this
    highest derivative


    +   33 Another derivation, lacking the mathematical rigor, can be found in standard
    texts such as [SCHWANKWER 1980, p. 111 f.].

    34 Cf. [SCHWARZ 1971, p. 168 ff.] for more information.'
