    # 4.1.3 Scaling


    The solutions obtained in the previous section were only qualitative – the settings
    of $\lambda$ and $k_0$ were chosen arbitrarily to obtain a feeling for the behaviour
    of the exponential decay. To get quantitative solutions the problem must be scaled
    properly. Scaling is a central part of any analog computer programming and is
    often the most difficult aspect.


    As a rule of thumb, all variables within a computation should span as much of
    the permissible range of values $[-1, 1]$ as possible in order to keep the effects
