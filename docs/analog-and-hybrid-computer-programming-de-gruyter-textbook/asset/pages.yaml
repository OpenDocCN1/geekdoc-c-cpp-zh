  md: "# 7.2 Basic operation 197\n\nIO::HyCon requires a configuration file in YAML-format135\
    \ which describes the actual setup of the analog computer, i.e. the addresses\
    \ of the various computation elements, the serial line parameters, etc. A typical\
    \ minimum example shown in the following listing:136\n\nexample.yml\n\n```\nserial:\n\
    \  port://dev/cu.usbserial-DN05OL10\n  bits: 8\n  baud: 115200\n  parity: none\n\
    \  stopbits: 1\n  poll_interval: 10\n  poll_attempts: 20000\ntypes:\n  0: PS\n\
    \  1: SUM8\n  2: INT4\n  3: PT8\n  4: CU\n  5: MLT8\n  6: MDS2\n  7: CMP4\n  8:\
    \ HC\nmanual_potentiometers:\nelements:\n  INT-0: 0x0030\n  INT-1: 0x0031\n  INT-2:\
    \ 0x0032\n  INT-3: 0x0033\n```\n\nexample.yml\n\nIt consists of the following\
    \ sections:\n\n**serial:** This section describes the communication setup. port\
    \ defines the serial device. Its name depends on the operating system and the\
    \ USB-serial-adapter being used. The remaining parameters are defaults and can\
    \ be adopted unchanged in most cases.\n\n> **135** See https://yaml.org/spec/1.2/spec.html\
    \ (retrieved October 3rd, 2019) for a detailed description of YAML.\n\n> **136**\
    \ There are more optional sections and settings which will be introduced when\
    \ required."
