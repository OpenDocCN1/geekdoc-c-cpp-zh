  md: '# CHAPTER 2


    # Computing elements


    The following sections introduce the basic elements which comprise an electronic
    analog computer. Furthermore, the notion of the machine unit will be introduced
    because the representation of values is of central importance for all of the following
    concepts. The examples shown have been implemented on an Analog Paradigm Model-1
    analog computer.


    # 2.1 Machine units


    Voltages or currents are the natural way of representing values within a calculation
    on an analog computer. Since the majority of historic and modern analog computers
    use voltages instead of currents, the following sections are restricted to this
    technique.


    Obviously, values represented by voltages are limited by some minimum/maximum
    voltages, known as machine units, m_ and m_, which are fixed for a given analog
    computer. Historic vacuum tube based machines often used units of ±100 V and sometimes
    ±50 V while later and modern analog computers feature machine units of ±10 V and
    sometimes even as low as ±5 V.


    All voltages representing variables in a computer setup are bound by these machine
    units, so it is normally necessary to scale a problem to be solved on an analog
    computer accordingly to avoid an overload condition in which a variable exceeds
    the machine unit voltage. If this happens, typically an overload indicator will
    be lit, identifying the affected computer element. In addition to this, the computer
    run can be halted automatically to determine the cause of the overload'
