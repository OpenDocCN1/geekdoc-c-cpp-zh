  md: '# APPENDIX B


    # The LAPLACE transform


    One of the standard tools for solving differential equations analytically is the
    LAPL transform, a parameter integral named after PIERRE SIMON LAPLACE. Although
    this is not directly connected to analog computer programming, the basic ideas
    and techniques are quite interesting and can sometimes be used to cross check
    the analog computer solution of a problem.¹153

    It is defined as


    ```

    $F(s) = \mathcal{L}(f(t)) = \int_{0}^{\infty} f(t)e^{-st} dt \quad (B.1)

    ```


    with $s \in \mathbb{C}$ and transforms differential equations into algebraic equations
    which can typically be solved much more easily. The result obtained is then transformed
    back by means of inverse transform $\mathcal{L}^{-1}(F(s))$, which is normally
    done by using tabulated functions.


    > ¹⁵³ Further information on this particular transform can be found in [WIDDER
    2010]. Two wonderful historic texts on that subject are [CARSLAW 1941] and [VAN
    DER POL 1987]. Its particular application to problems in engineering and especially
    control theory can be found in many texts such as [SENSICLE 1968], [DUFFY 1994]
    shows advanced transforms for the solution of partial differential equations.'
  merge: -1
