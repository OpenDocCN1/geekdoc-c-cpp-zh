    \nFig. 6.38. Trace of the bouncing ball\n\n# 6.11 Zombie apocalypse\n\nHow could\
    \ one not like zombie movies? It was about time that mathematicians ROBERT SMITH;\
    \ and his collaborators – shed some light on zombie attacks from a mathematical\
    \ point of view.⁷ The basis for a description of a zombie apocalypse are the well-known\
    \ VOLTERRA-LOTKA differential equations modelling a closed eco-system, which were\
    \ derived in the late 19th/early 20th century by ALFRED JAMES LOTKA and VITO VOLTERRA.\n\
    \nThe mathematical model used below is derived from this classic set of differential\
    \ equations:\n\n```\n$$\\frac{dh}{dt} = \\alpha h - \\beta z \\quad (6.34)$\n\
    $$\\$\\frac{dz}{dt} = \\delta hz - \\gamma hz - \\zeta z \\quad (6.35)$\n```\n\
    \nHere $h$ and $z$ represent the number of humans and zombies respectively with\
    \ the initial conditions $h_0$ and $z_0$. The other parameters are:\n\n+   $\\\
    alpha$: Growth rate of the human population (birth rate)\n$\beta$: This factor\
    \ describes the rate at which humans are killed by zombies (some kind of a capture\
    \ cross section).\n$\\delta$: Growth factor of zombie population due to zombies\
    \ transforming humans into zombies.\n$\\zeta$: Normal “death” rate of the zombie\
    \ population.\n\n> 97 See [SMITH? 2014] and [MUNZ 2014]."
