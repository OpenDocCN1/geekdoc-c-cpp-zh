    # 6.4.2 Programming


    Scaling this program is not trivial because the parameter $\mu$ complicates things
    significantly. A bit of experimentation and guesstimating values shows that $-2
    \leq y \leq 2$ is a good starting point. To scale this down the interval $[-1,1]$
    the integrand of the second integrator is scaled by a factor of $1/2$. To compensate
    for this the output of the first multiplier must be scaled by 4 while the upper
    input to the summer feeding the leftmost integrator must be scaled by 2.


    The next step involves scaling of $y^2$, which lies in the interval $[0,4]$. Accordingly,
    the scale factor of 4 at the output of the multiplier just introduced above will
    be removed and this will be compensated at the input of the following summer and
    so forth.


    Executing this process for all variables within the program yields the following
    set of equations with auxiliary variables $y_1, y_2$, and $y_3$, which can be
    readily converted into a scaled computer setup as shown in figure 6.16$^{83}$


    ```

    $$\hat{y} = -\frac{10}{4}\int \hat{y}d\tau$\n$\hat{y} = -2\int \hat{y}d\tau$\n$\hat{y}_1
    = -\left(\frac{1}{4} + \hat{y}^2\right)$

    $\hat{y}_2 = -\hat{y}_1$\n$\hat{y}_3 = \frac{4}{5}\hat{y}_2\mu$\n$\hat{y} = -\left(\frac{\hat{y}}{5}
    + 10\hat{y}_3\right)$

    ```


    83 Please note that the sign-inverting feature of integrators and summers have
    already been taken into account in this set of equations.'
