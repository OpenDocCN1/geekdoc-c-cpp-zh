    A more suitable implementation of an integrator chain is called a *bucket brigade
    device*, BBD for short. This name is quite descriptive as they are implemented
    by a number of capacitors connected as shown in figure 5.39$^{60}$ These capacitors
    are interconnected by *field effect transistors (FETs)*, are controlled by a two-phase
    clock signal, CP1 and CP2, controlling the odd and even FETs respectively. A voltage
    applied to the input IN is stored in the first capacitor of the bucket brigade
    by a clock pulse on CP2. This pulse is followed by a pulse on CP1 which transfers
    this value from the first capacitor to the second and so on. Since the number
    of capacitor stages is fixed$^{61}$ the desired delay is achieved by adjusting
    the frequency of the i two-phase clock signal$^{62}$


