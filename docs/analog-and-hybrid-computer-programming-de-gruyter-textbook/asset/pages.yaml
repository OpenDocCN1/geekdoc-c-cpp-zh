    The delay obtained by a certain clock frequency is given


    $t_{delay} = \frac{N}{2f_{clock}}$


    where $N$ denotes the number of bucket brigade stages and is typically of the
    form $N = 2^n$ with $n \in \{8\dots11\}$. The clock frequency is limited by $f_{min}
    \le f_{clock} \le f_{max}$. In the case of the MN3007 integrated circuit $f_{min}=10$
    kHz and $f_{max}=10024$ kHz. The upper clock frequency limit is mainly due to
    the high capacitance of the clock inputs CP1 and CP2 whilst the lower limit is
    due to the inevitable leakage currents of the FET-controlled capacitors.$63$


    With these constraints a MN3007 based delay circuit is nominally capable of delay
    times $5.12$ ms $\le t_{delay} \le 51.2$ ms.$64$


