  md: '# 1.3 A short history of analog computing — 5


    ![](img/682c64a490ca5f23332f702a346c8b96_19_0.png)


    **Fig. 1.3. VANNEVAR BUS’s mechanical differential analyzer (source: [Meccano
    1934, p. 443])


    to programming such machines is still used today and called the KELVIN feedback
    technique.^5


    Figure 1.3 shows a mechanical analog computer, called a *differential analyzer*.
    On both sides of the long table-like structure in the middle of the picture, various
    computing elements such as integrators (discernible by the small horizontal disks),
    differential gears, plotter tables etc. can be seen. The elongated structure in
    the middle is the actual interconnect of these computing devices which consists
    of a myriad of axes and gears. Programming such a machine was a cumbersome and
    time consuming process as the interconnection structure had to be more or less
    completely dismantled and rebuilt every time the machine was configured to solve
    the differential equations which describe the new problem.


    Figure 1.4 shows a simple setup of a differential analyzer to integrate a function
    given in graphical form. A central motor, shown on the left, drives all computing
    elements of the machine. On the upper left a so-called *input table* is visible.
    It consists of a magnifier with crosshairs which is mounted in a way that it will
    be moved manually by a hand crank which is turned so that the crosshairs always
    follow the line of the input function.^6


    +   5 Lord KELVIN is often cited as having the use of analog computers for fire
    control although mechanical differential analyzer techniques were successfully
    employed for purposes such as naval fire control in the early 1900s, it took VANNEVAR
    BUS to realize that these components could be configured into a general purpose
    computer.

    6 A steady hand is required for this task which was quickly automated in order
    to eliminate this rather unpredictable source of error during a computation.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '![](img/682c64a490ca5f23332f702a346c8b96_20_0.png)


    Fig. 1.4. A simple differential analyzer setup for integration (cf. [KARPLUS et
    al. 1958, p. 190], [SOROKA 1962, p. 8-10)]


    At the heart of this setup is an integrator shown at the bottom of the figure.
    Basically, it consists of a rotating flat disk driven by the central motor and
    a friction-wheel-rolling on the surface of the disk. The radial position of this
    wheel on the disk is now controlled by the vertical component of the crosshairs
    on the input table. Given some angular velocity of the rotating disk, the angular
    velocity of the friction-wheel depends on its radial position. If it were located
    directly above the disk''s axis, it would not rotate at all while its angular
    velocity would be at its maximum if it were positioned at the edge of the disk.
    Thus, this device effectively performs an integration operation of the basic form


    $$\int^T f(\tau)d\tau$


    $\tau$ represents the machine time (which comes after later) – in this case the
    rotation of the horizontal disk – and $f(\tau)$ controls the radial position of
    the frictionwheel. The integrator is running during the time interval $[0, T]$.
    Figure 1.5 shows an actual implementation of the integrator which was used in
    the Oslo differential analyzer.'
  merge: -1
