    **Fig. 2.3.** Operational amplifier with negative feedback


    ational amplifier circuits, including analog computing elements, such as summers
    and integrators. Figure 2.3 shows the basic circuit of an operational amplifier
    with negative (resistive) feedback.


    This simple circuit has a single input $e_i$ which is connected to the inverting
    input of the operational amplifier by the resistor $R_i$. The output signal $e_o$
    is also connected to the inverting input via a feedback resistor $R_f$. Since
    all inputs as the feedback path are connected to the inverting input, this is
    called *summing junction, SJ* or sometimes $S$ for short. Most implementations
    of summers (and integrators) make this summing junction available at the patch
    panel so that additional feedback circuits or additional resistors can be connected.


    With $A$ denoting the open-loop gain of the operational amplifier (i.e. the gain
    it exhibits without any negative feedback), and $e_{SJ}$ representing the voltage
    at the summing junction,


    $$e_o = -Ae_{SJ}$$


    can be derived for the output voltage of the circuit in figure 2.3.$^{14}$ This
    implies


    $$e_{SJ} = \frac{e_o}{A} \quad (2.1)$


    for the voltage at the summing junction itself. Accordingly, the following currents
    flow into and out of the junction:


    $$i_i = \frac{e_i}{R_i} \quad \text{(input current due } R_i)$ \n$i_f = \frac{e_o}{R_f}
    \quad \text{(feedback current due } R_f)$ \n$i_~ \sim 10^{-9} A \quad \text{(input
    current of the amplifier)}$


    Due to KIRCHHOFF’s first law, the sum of the currents flowing into and out of
    a junction must be zero, yielding


    $$i = i_i + i_f = \frac{e_i - e_{SJ}}{R_i} + \frac{e_o - e_{SJ}}{R_f} \quad (2.2)$


    **14** All voltages are measured with respect to GND.'
