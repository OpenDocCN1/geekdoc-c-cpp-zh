    ```\n\nwhere $\\alpha$ is the scale factor for this variable. In the example above\
    \ it is\n\n```\n$$\\alpha = \\frac{1}{0.12} \\approx 8.333.$\n```\n\nThis amplitude\
    \ scaling of variables is only one side of the coin. It is also necessary to distinguish\
    \ between *problem time*, i.e. the time at which the actual problem runs, and\
    \ the process of transforming problem time to machine time is called *scaling*.\
    \ To distinguish between both times the symbols $t$ and $\\tau$ are commonly used,\
    \ representing problem and machine time; these are coupled by a scale factor $\b\
    eta$ yielding $\tau = \\beta t$, $\beta$ is determined by the product of $k_0$\
    \ of the integrators in a given setup and their respective input weights.\n\n\
    Machine time is faster than problem time, if $\\beta > 1$. This is suitable for\
    \ simulating processes which change too slowly with time for direct observation.\
    \ Radioactive decay of some long-lived isotope is too short to be typical example\
    \ of such a process. In other cases the problem time is too short to make useful\
    \ observations, choosing $\\beta \\le 1$ will slow down machine time accordingly.\n\
    \nIn the case of $^{234}Th$ having a half-life of $T_{1/2} = 24.1$ days, a substantial\
    \ speed of machine compared to problem time is desirable. To have a flicker-free\
    \ display on an oscilloscope, machine time will be scaled so that 2.41 ms will\
    \ correspond to the half-life $T_{1/2} = 24.1$ d with $0 \\le \\tau \\le 20$ ms.\
    \ This results in\n\n```\n$$\\lambda = \\frac{\\ln(2)}{2.41} \\approx 0.287$\n\
    ```\n\n+   **38** It does not matter what the actual value of the machine unit\
