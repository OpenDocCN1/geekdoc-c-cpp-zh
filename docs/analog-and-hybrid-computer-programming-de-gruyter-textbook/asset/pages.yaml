    as a grid of conducting nodes, the nodes along the diagonal and those along the
    $x$-axis require some attention as they have to be connected to their "mirror"
    neighbor nodes which replace the neighbor nodes in the adjacent octants. The nodes
    along the vertical right hand side of the octant are held at the fixed temperature
    $T$. The node in the center of the plate is denoted by $u_{0,0}$ and is the only
    node that allows heat to be injected or extracted.


    According to (6.61), every integrator in the grid yielding $u_{i,j}$ requires
