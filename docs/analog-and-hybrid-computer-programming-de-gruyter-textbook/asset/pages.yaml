  md: "# 114 6 Examples\n\n# 6.2 Damped pendulum with external force\n\nThe mathematical\
    \ pendulum described in section 4.4 is well-behaved because it obeys a linear\
    \ combination of trigonometric functions once started. The following example is\
    \ more complex as it is not only an external excitation or forcing function but\
    \ also includes a damping term. The forcing function $e(t)$ describes an external\
    \ force to which the pendulum is subjected during its movements. A damped pendulum\
    \ exposed to $e(t)$ exhibits chaotic behaviour for certain sets of parameters.$^{79}$\n\
    \nAs before, a point mass $m$ on a massless pendulum of length $r$ is assumed.\
    \ The angle between the rod and a vertical line crossing it is denoted by $\\\
    varphi$. As usual, $g$ denotes the acceleration of gravity, $\beta$ represents\
    \ the damping factor while $A$ is the amplitude of the forcing function. The following\
    \ derivation takes a slightly different path to the one adopted in section 4.4.\n\
    \nWith $I$ denoting the rotational inertia it is\n\n```\n$I = mr^2$.\n```\n\n\
    Since the sum of all forces in a closed system must be zero it follows that\n\n\
    ```\n$I\\ddot{\\varphi} = \\sum \\tau_i$                                (6.1)\n\
    ```\n\nwhere the $\tau_i$ denote torque acting in the system. These torques are\n\
    \n```\n$$\\tau_g = -rm\\sin(\\varphi)$ (torque due to $g$) (6.2)\\n$\\tau_\\beta\
    \ = -\\beta\\dot{\\varphi}$ (torque due to $\\beta$)\\n$\\tau_e = A\\cos(\\omega\
    \ t)$ (torque due to excitation)\n```\n\nCombining with (6.1) results in\n\n```\n\
    $mr^2\\ddot{\\varphi} = -rm\\sin(\\varphi) - \\beta\\dot{\\varphi} + A\\cos(\\\
    omega t)$\n```\n\nwhich can be rearranged to give\n\n```\n$$\\ddot{\\varphi} =\
    \ -\\frac{g}{r}\\sin(\\varphi) + \\frac{A\\cos(\\omega t) - \\beta\\dot{\\varphi}}{mr^2}$\n\
    ```\n\nAs the highest derivative is now isolated on the left-hand side, this is\
    \ ideally suited to using KELVIN's feedback technique to derive an analog computer\
    \ setup.\n\nFirst, a harmonic forcing function with a variable frequency, as the\
    \ sweep circuit described in section 4.2, is required. The circuit is shown in\
    \ figure 6.9.\n\n> **79** This example was motivated by the numerical simulation\
    \ of such a driven pendulum in https://www.physicslab.com/pendulum/chaotic-pendulum-en-html.html,\
    \ retrieved on June 16th, 2019."
