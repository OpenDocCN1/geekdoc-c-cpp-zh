  md: '# 4.5 Mass-spring-damper system 71


    From $cos(\omega t) = 1$ and $sin(\omega t) = 0$ for $t=0$ it follows that


    $\alpha(0) = (a + b) = \alpha_0$.


    Differentiating (4.13) with respect to $t$ and applying the same arguments yields


    $\dot{\alpha}(0) = (a - b)\omega = 0$


    and thus $a-b=0$ for this case. So a mass released from a damped position at $t=0$
    with no initial velocity to it, it is described by


    $y = e^{-\beta t}\alpha_0 cos(\omega t)$


    which is exactly what would have been expected from a practical point of view.
    The position of the mass follows a simple harmonic function and its amplitude
    is damped by an exponential term with negative exponent.


    The term


    $\omega = \sqrt{\omega_0^2 - \beta^2}$,


    $T = \frac{2\pi}{\omega}$


    for the period and is quite interesting as there three cases have to be distinguished
    with respect to $\omega_0$ and $\beta$:


    $\omega_0 > \beta$: *Subcritical damping (underdamped)* the mass oscillates.

    $\omega_0 = \beta$: *Critical damping* – the systems returns to its position of
    rest in an exponential decay movement without overshoot.

    $\omega_0 < \beta$: In this case the system is set to be *overdamped*. It will
    return to its position of rest without any overshoot but more slowly than with
    critical damping.


    It should be noted that the damped frequency $\omega$ is always lower than $\omega_0$
    depending on the amount of damping which can be observed directly when the system
    is simulated on an analog computer, as shown in the following section.


    # 4.5.2 Using an analog computer


    Equation (4.8) is used as the basis to derive a computer setup for this mass-spring-damper
    system. Rearranging yields


    ```

    $$\dot{y} = \frac{\dot{x} + sy}{m}$

    ```


    which can be readily transformed into the computer setup shown in figure 4.19.
    Instead of dividing by $m$ it is much simpler to multiply by $1/m$ although this
    requires a little calculation before setting the corresponding potentiometer.'
