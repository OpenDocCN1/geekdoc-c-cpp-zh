  md: '# 5.15 Time delay 103


    Proceeding in a rather informal way, $s$ can be interpreted as the differential
    operator $d/dt$. Replacing the LAPLACE transforms $y_i(p)$ and $y_o(t)$ by their
    corresponding time functions thus yields


    ```

    $\sum_{k=0}^{n} a_k \frac{d^k}{dt^k} y_o(t) = \sum_{k=0}^{m} b_k \frac{d^k}{dt^k}
    y_i(t),$

    ```


    which can now be used to derive an analog computer program for a given transfer
    system like the delay function.


    Unfortunately, the naïve approach


    ```

    $e^{-sT} = \sum_{k=0}^{\infty} \frac{(-1)^k(sT)^k}{k!}$

    ```


    is not particularly suited for an analog computer program since it requires an
    exorbitant amount of complexity, even for a rough approximation. AMELING$^{67}$
    gives some interesting additional series expansions which, unfortunately, are
    also not very useful for a practical implementation.


    An interesting approach is to abandon the direct implementation of a power series
    representation of the delay operator and use its macroscopic behaviour to develop
    a suitable approximation. With $s = i\omega$ the LAPLACE delay operator satisfies


    ```

    $|e^{-i\omega T}| = 1,$

    ```


    i. e. it exhibits a unit gain. Furthermore, it is


    ```

    $\arg(e^{-i\omega T}) = -\omega T = -2\pi f T$

    ```


    with $\omega = 2\pi f$ as usual, $e^{-sT}$ yields a frequency-proportional phase
    shift for a pure sinusoidal input. Accordingly, this operator can be seen as an
    all-pass filter. Based on this observation a different approach to its implementation
    on an analog computer is possible.


    The required unit gain forces the numerator of (5.3) to be the complex conjugate
    of its denominator yielding the general form


    ```

    $F(p) = \frac{\sum_{k=0}^{\infty} (-1)^k a_k s^k}{\sum_{k=0}^{\infty} a_k s^k}$

    ```


    See [AMELING 1963, pp. 242 f.].'
