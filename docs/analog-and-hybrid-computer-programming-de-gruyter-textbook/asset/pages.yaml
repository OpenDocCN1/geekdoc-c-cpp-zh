    #  6.13 Lorenz attractor


    Another, even more famous, chaotic system is the intriguing LORENZ-attractor developed
    in 1963 by EDWARD NORTON LORENZ as a simplified model for atmospheric convection
    and first described in [LORENZ 1963].^99 Although this seminal work was performed
    on a digital computer, a Royal McBee LGP-30, the LORENZ-attractor is, of course,
    ideally suited to being implemented on an analog computer as be shown below.


    This chaotic attractor is described by the following system of three coupled differential
    equations:


    ```

    $$\dot{x} = \sigma(y - x)$

    $\dot{y} = \rho(z - x) - y$\n$\dot{z} = xy - \beta z$

    ```


    The parameters are $\sigma = 10$, $\beta = \frac{8}{3}$, and $\rho = 28$. Obviously,
    this set of DEQS must be scaled to be implemented on an analog computer. The resulting
    scaled equations like this:


    ```

    $x = \int(1.8y - x) dt + C$\ns = 1 - 2.678s$\nny = \int(1.5556xs - 0.1y) dt$\nnz
    = \int(1.5xy - 0.2667z) dt$.

    ```


    $C$ denotes the initial condition of the integrator yielding $x$ and is not critical.
    Taking into account that every summer and integrator of analog computer performs
    an implicit change of sign and further noting that $xy = -x(-y)$, these equations
    can be further simplified by using two inverters in the resulting computer setup:


    ```

    $$-x = -int(1.8y - x) dt + C$

    ```


    ^99 More information about the construction of chaotic attractors in general as
    well as this attractor in particular may be found in [KUEHN 2015, pp. 468].'
