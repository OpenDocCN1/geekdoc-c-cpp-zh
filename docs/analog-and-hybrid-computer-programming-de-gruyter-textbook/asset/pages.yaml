    ```

    $= \int_{T}^{\infty} e^{-st} f(t-T) \, dt\n=\int_{T}^{\infty} e^{-s(t+T)} f(t)
    \, dt\n=\int_{0}^{\infty} e^{-sT} e^{-st} f(t) \, dt\n= e^{-sT} F(s)$

    ```


    The resulting term $e^{-sT}$ is called the LAPLACE delay operator. Practical delay
    circuits can now be obtained by interpreting this operator as a transfer system$^{66}$
    which is described by its transfer function. Generally, given time-dependent input/output
    signal pair $y_i(t)$ and $y_o(t)$ the behaviour of the transfer system can be
    described by


    ```

    $F(s) = \frac{y_o(s)}{y_i(s)} \quad (5.3)

    ```


    with


    ```

    $y_o(s) = \mathcal{L}(y_o(t))$\n$y_i(s) = \mathcal{L}(y_i(t))$

    ```


    being the LAPLACE transforms of the time varying input and output signals. Such
    transfer systems can be grouped into two classes:


    +   1. Systems which can be described by ordinary differential equations

    2. systems which must be described by partial differential equations.


    Only systems of the first class will be considered here. These can be described
    by a rational function of the form


    ```

    $F(p) = \frac{\sum_{k=0}^{m} b_k s^k}{\sum_{k=0}^{n} a_k s^k}. \quad (5.4)

    ```


    Combining (5.3) and (5.4) and rearranging yields


    ```

    $$\sum_{k=0}^{n} a_k s^k y_o(p) = \sum_{k=0}^{m} b_k s^k y_i(p).$$

    ```


    **66** The following sections are largely based on [GILOI et al. 1963, pp. 288
    ff.].'
