  md: '![](img/682c64a490ca5f23332f702a346c8b96_154_0.png)


    **Fig. 6.37.** Generating the $y$-component


    The case $y>1$ – when the ball hits the ceiling of the box – cannot happen in
    this simulation as the vertical component of the ball''s initial velocity is assumed
    to be zero. At the beginning of a simulation run, the ball begins a free falling
    trajectory controlled by (6.33). When the ball hits the floor it will rebound
    due to elastic collision described by the term $(c(-y-1)$ with a $c$ controlling
    the elasticity.


    6.37 shows the corresponding computer setup. The leftmost integrator integrates
    over the gravity $g$ and takes the friction $d$ into account. It yields the negative
    $y$-component $v_y$ of the ball''s velocity. The integrator on the right integrates
    over $v_y$ yielding the actual $y$-position.


    The implementation of the elastic rebound is extremely simple and consists of
    two diodes. The “active” element is the 10 V ZENER-diode which starts conducting
    when the ball hits the floor of the box (ignoring the small bias voltage of the
    diodes). The diode on the left makes sure that the ZENER-diode won’t conduct while
    the ball is within the box. Since the rebound effect is rather violent the output
    of the two diodes connected in series is directly connected to the summing junction
    input $(S)$ of the first integrator. The time scales of the integrators are both
    set to $k_0 = 10^2$.


    With settings as denoted in the circuit diagrams and the computer set to repetitive
    operation with an OP-time of 20 ms and short IC-time, a display such as shown
    in figure 6.38 can be easily obtained. Because the oscilloscope used here had
    no blanking-input the return of the beam to the upper left corner is faintly visible.
    If a blanking-input is available, it can be connected to a trigger output of the
    analog computer''s control unit to avoid this artifact.'
