    # 5.9 Dead-space


    All mechanical systems, such as gear trains, linkages etc., exhibit a phenomenon
    called backlash, which is caused by unavoidable gaps between moving parts. A dead-space
    circuit is used to model this behaviour on an analog computer.


    The literature contains a plethora of such circuits – the basic idea is to use
    a pair of suitably forward-biased diodes feeding a summer. The simplest form of
    such a circuit consists of two diodes, two potentiometers and a summer. This simplicity
    comes at a cost because the setup of the potentiometers is not straightforward,
    and the diodes are far from being ideal.


    The circuit shown in figure 5.23 replaces these real diodes by idealized diodes
    as shown in section 5.6. The parameters $r$ and $l$ define the right and left
    break-point of the dead-space. It may be necessary to parallel the two diodes
    connected to the summing junctions of their associated open amplifiers with small
    capacitors to avoid unstable behaviour of the circuit.


    Figure 5.24 shows the behaviour of this dead-space setup. A linear voltage ramp
    was used for input. The left and right gradient of the curve are determined by
    the weights $w_r$ and $w_l$ of the output summer’s inputs.'
