  md: '# 1.3 A short history of analog computing — 7


    ![](img/682c64a490ca5f23332f702a346c8b96_21_0.png)


    Fig. 1.5. Integrator from the Oslo differential analyzer (see [WILLERS 1943, p.
    237])


    The output from the friction-wheel is then used in setup to control the vertical
    position of the output table''s (upper right of the picture) pen position while
    its horizontal position is controlled by the central motor. The resulting figure
    is the graph of the integral over the input function.


    Mechanical differential analyzers like this one were used for a short period of
    time as their disadvantages could not easily be overcome. Their setup is cumbersome
    and time-consuming, the many mechanical parts require a lot of maintenance work,
    and their speed of computation is limited due to the non-negligible masses of
    the rotating and moving parts.


    There were some attempts to build electro-mechanical differential analyzers in
    which basic computing elements were still purely mechanical while their interconnection
    was accomplished by servo-motors and synchros.⁸ The outputs of the synchros could
    be connected to the inputs of the servo-motors by means of a central electric
    patch field, thus at least simplifying the basic setup of such a computer.


    Mechanical and electro-mechanical analog computers were used in staggering numbers
    in the form of fire control systems during World War II. Being very specialized
    angels, these machines had no direct influence on the further development of the
    art.


    ⁷ Today, this device would be called a plotter.

    ⁸ A synchro* is basically a transformer with its primary winding on a rotor which
    is surrounded by typically three secondary windings. When the primary is fed with
    an AC signal, signals corresponding to the angular position of the rotor are induced
    in the stator windings which can then be used to determine the angle of the rotor.
    ARNOLD NORDIECK used these devices in his differential analyzer, see [NORDSIECK
    1953] and [BROCK 2019].'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/682c64a490ca5f23332f702a346c8b96_22_0.png)


    Analog-electronic analog computers were developed independently, beginning in
    the early 1940s by HELMUT HOELZER in Germany, GEORGE A. PHILBRICK, and A. B. MACNEE
    in the United States. Their goals were very different.


    HOELZER worked in Peenemünde, Germany, on the development of the famous A4 rocket
    (also known as the V2) and was responsible for what would be called its on-board
    computer in today’s terms. The result of his work was the world’s first electronic
    stabilization and control system for a rocket. In addition to this, he developed
    the world’s first true general purpose analog computer, which was used during
    the A4 development. After World War II this unique computer was transferred to
    the United States and was used at the Redstone Arsenal for further rocket developments
    well into the 1950s. This machine is shown in figure 1.6.'
  merge: -1
