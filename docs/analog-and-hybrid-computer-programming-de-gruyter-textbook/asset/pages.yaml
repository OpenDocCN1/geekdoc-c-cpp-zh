  md: '# CHAPTER 4


    # Basic programming


    Although solving a problem on an analog computer has basically the same prerequisites
    as programming a digital computer, the actual process of programming differs significantly
    from the new-predominant algorithmic approach. Figure 4.1 shows the main steps.
    First, the problem under investigation has to be examined and a mathematical representation,
    typically a system of coupled differential equations, DEQs for short, has to be
    derived. From here on the digital and analog ways of programming quickly diverge.
    On a digital computer these equations form the basis for an algorithm which will
    be executed in a stepwise fashion. When programming an analog computer the very
    same equations will be transformed into a patching setup which determines the
    various computing elements are connected to each other. This setup is called an
    analog computer program.


    Since differential equations are of utmost importance in analog computer programming,
    a few words about these mathematical objects might be appropriate. Basically,
    a differential equation is an equation in which the unknown is not a simple value
    but rather a function. A differential equation is made from this unknown function
    as well as various derivatives of this function. To simplify things a bit²⁸ it
    be assumed that the function and all of its required derivatives are with respect
    to a single independent variable. This independent variable is often


    28 Differential equations are by no means simple – many of them, often those of
    great relevance for practical applications, have no closed form solution at all
    and are thus only accessible to numerical or – in our case preferably – analog
    simulation techniques.'
