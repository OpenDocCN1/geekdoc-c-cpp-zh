  md: '# APPENDIX E


    # A log() function generator


    The logarithm is a particularly useful function as has been seen in section 6.20
    where this function was required for the simulation of an air flow. The literature
    abounds with electronic logarithm function generators – either based on polygon
    approximation, see section 2.6, or using a suitable PN-junction in the feedback
    path of an operational amplifier. Both approaches are quite tricky to implement
    due to the non-negligible temperature coefficients of the diodes and transistors
    required. Fortunately, there exists an integrated circuit, the LOG112, which implements
    a high-precision logarithm function generator that can be easily interfaced with
    an analog computer. The behaviour of this device is characterized by


    ```

    $$V_{out} = \frac{1}{2} \log_{10}\left(\frac{I_{in}}{I_{ref}}\right) \left(1 +
    \frac{R3+R4}{R2}\right)$

    ```


    where $I_{in}$ and $I_{ref}$ denote an air flow and a reference current.

    Figure E.1 shows the circuit of the overall computing element: The reference $I_{ref}$
    is defined by R5 which should have a precision of at least 0.05%.$^{167}$ The
    input current $I_{in}$ is defined by R1, which should have the same precision.

    The input/output voltage rating of this circuit is shown in table E.1. Input values
    less than 0.001 V will result in an overload that could be detected either by
    means of an analog computer comparator or by a dedicated detector circuit based
    on an LM339 or the like. The values of the table should be used to calibrate the
    circuit by setting the potentiometer R4 accordingly.


    167 This resistor can also be implemented by paralleling high-precision 1M resistors,
    if 250k are not readily available.'
