    # 6.16 Nonlinear chaos


    Another surprisingly chaotic system is also based on an absolute value function
    as the central nonlinear element. This system has been described in [KIERS et
    al. 2003]. It is characterized by the following differential equation:


    ```

    $$\ddot{x} = -\lambda\dot{x} - x + |x| - 1$

    ```


    A remarkable feature is that the behaviour of this system is controlled by just
    one parameter, $\lambda$. The scaled computer program is shown in figure 6.55.
    If no absolute value function is readily available on the analog computer being
    used, one can be bent setup as shown in figure 5.18.


    An example of a phase space plot based on $-\dot{x}$ and $\dot{x}$ with $\lambda
    \approx 0.62$ is shown in figure 6.56.'
