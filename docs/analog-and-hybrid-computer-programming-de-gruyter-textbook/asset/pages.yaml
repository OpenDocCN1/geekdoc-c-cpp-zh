    # 4.5 Mass-spring-damper system


    Apart from the amplitude stabilization scheme shown in 4.2, the problems shown
    so far have exhibited oscillating behaviour with no damping. The next example
    introduces damping using the simple mass-spring-damper system shown in figure
    4.18. In this example $y$ denotes the vertical position of the mass with respect
    to its post of rest. Neglecting any gravitational acceleration acting on the mass,
    there are three forces to be taken into account:


    +   - The force due to the moving mass, $F_m = ma = m\dot{y}$

    - The force caused by the spring which is assumed to depend linearly on the strain
    applied to the spring, $F_s = sy$, and

    - The force due to the velocity-linear damper, $F_d = dv = d\dot{y}$.


    Since this is a closed physical system all forces add up to zero yielding the
    following second order differential equation which describes the dynamic behaviour
    of this mass-spring-damper system:


    $m\ddot{y} + d\dot{y} + sy = 0 \quad (4.8)$'
