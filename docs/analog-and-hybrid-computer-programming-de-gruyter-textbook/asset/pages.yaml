  md: '# APPENDIX G


    # A simple joystick interface


    Since an analog computer is ideally suited for all kinds of dynamic systems simulations,
    a joystick interface is a really versatile peripheral device as it makes “man
    in the loop” simulations possible. This appendix describes a simple adapter circuit,
    which allows a two-channel analog joystick, as commonly used for controlling models,
    to be used with an analog computer.


    The joystick used here is a joystick from an old model remote control. It consists
    of two 4k7 (4700 Ω) potentiometers – one for the $x$- and one for the $y$-direction.
    A simple handheld enclosure was built, as shown on the left in figure G.2. This
    also holds a push button which can be used to control an electronic switch or
    a comparator in the analog computer.


    The circuit shown in G.1 is pretty straightforward: First, the two reference voltages
    of $\pm 10$ V are buffered by the operational amplifiers IC1A and IC1B. R1* and
    R2* are used to set the origin of the joystick (putting the joystick into its
    middle position with respect to $x$ and $y$ should yield a value of 0 on each
    channel).


    Since the potentiometers used in a typical joystick allow for 270 degree travel
    and the joystick only allows for a much smaller deflection, the wiper will never
    hit its end positions. Accordingly, the output signals $x$ and $y$ must be amplified
    to satisfy $10 \leq x, y \leq +10$ V. This is done by the two operational amplifiers
    IC1C and IC1D. The capacitors C1 and C2 suppress any unwanted oscillations which
    otherwise may occur. The slight load resistance of 10 k on the wipers of the joystick
    potentiometers is negligible in this application, so no additional buffer stage
    is required.'
  merge: -1
  pgno: 259
