  md: 'Scaling this system of coupled differential equations is not simple due to
    its pronounced non-linear behaviour. The ranges of the various terms were determined
    by computing example solutions on a digital computer – a technique that was already
    used in the 1960s. These results were used to guide the scaling process. To simplify
    the overall process, equations (6.36), (6.37), (6.38), and (6.39) were split into
    individual terms resulting in the following set of scaled equations (6.36)) is
    replaced by


    ```

    $x_0 = 0.1 \quad (6.40)\nx_1 = -10(x + f(x)) \quad (6.41)\nx_2 = y + \frac{1}{2}x_1
    \quad (6.42)\nx = 3.12 \int x_2 \ dt + x_0 \quad (6.43)$

    ```


    where (6.40) represents the initial condition for the integration.

    (6.38) is split into


    ```

    $y_1 = z - \frac{1}{5}y \quad (6.44)\ny_2 = 1.25x + 2y_1 \quad (6.45)\ny = 4 \int
    y_2 \ dt \quad (6.46)$

    ```


    while (6.38) becomes


    ```

    $z = -\int 3.5y \ dt \quad (6.47)$

    ```


    The implementation of the central element, the CHUA-diode, is costly as the implementation
    of each of the absolute value functions requires at least two diodes and one amplifier.
    $f(x)$ is broken down and scaled like this:


    ```

    $f_1 = [0.7143x + 0.2857] \quad (6.48)\nf_2 = [0.7143x - 0.2857] \quad (6.49)\nf_3
    = f_1 - f_2 \quad (6.50)\nf(x) = -0.7144x - 0.3003$ \quad (6.51)$

    ```


    Deriving a computer set from these equations (6.40, 6.41, 6.42, 6.43), is implemented
    as shown in figure 6.50. The equations (6.44, 6.45, 6.46, 6.47) are implemented
    as shown in figure 6.51.


    It may be necessary to add small capacitors between the summing junction and the
    output of each of the two amplifiers in the circuit for $f(x)$, if the setup shows
    signs of instability. Figure 6.52 shows the program for (6.48), (6.49), (6.50),
    and (6.51).'
