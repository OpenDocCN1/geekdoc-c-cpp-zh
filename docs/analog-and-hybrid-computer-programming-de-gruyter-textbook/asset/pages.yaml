  md: '# B.2 Laplace transforms of basic operations


    Things really get interesting when the LAPACE transforms of operations instead
    of simple functions are computed. This is shown below for the time derivative
    and the time integral of a function. Let


    ```

    f(t) = \frac{dx}{dt},

    ```


    then integration by parts gives


    ```

    \mathcal{L}(f(t)) = \int_{0}^{\infty} e^{-st} dt\n= \left[ xe^{-st} \right] -
    \int_{0}^{\infty} sxe^{-st} dt\n= s\mathcal{L}(x) - x(0).

    ```


    $x(0-)$ denotes the initial value of $x$ at $t=0-$. The interesting fact is that
    the time derivative of a function $f(t)$ can be transformed into the much simpler
    multiplication of the LAPL transform of the function with $s$.\nThis can be extended
    to higher derivatives as well.


    ```

    f(t) = \frac{d^2x}{dt^2}

    ```


    follows that


    ```

    \mathcal{L}(f(t)) = \int_{0}^{\infty} e^{-st} dt = s^2\mathcal{L}(f(t)) - sx(0-)
    - \left[ \frac{dx}{dt} \right]_{t=0}

    ```


    and so forth.$^{159}$

    If multiplication with $s$ is the transform of a time derivative, it is tempting
    to assume that integration will be transformed into a division by $s$. This, indeed,
    is the case. Let


    ```

    f(t) = \int_{0}^{t} x dt + c

    ```


    with $c$ being a constant value. Its LAPL transform is


    ```

    \mathcal{L}(f(t)) = \left( \int_{0}^{\infty} x dt \right) e^{-st} dt + \frac{c}{s}

    ```


    will be written as $[\dot{x}]_{t=0}$ for brevity.'
