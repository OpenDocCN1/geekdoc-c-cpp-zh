    An idealized diode can be used to implement an absolute value function. A typical
    setup is shown in figure 5.18. The left half of the circuit is the ideal diode
    circuit shown before. Its output feeds two paralle inputs of a second summer.
    These inputs behave like a single input weighted with 2. A third input of the
    second summer is directly connected to the input of the overall circuit.


    When the output of the diode circuit is at zero, which is the case for a negative
    input value, the second summer acts as a simple inverter yielding a positive output.
    As soon as $x > 0$ the idealized diode starts conducting and yielding $-x$. The
    summer on the right now computes $x - 2x = -x$ yielding a positive output. Figure
    5.19 shows the behaviour of this circuit. As before, it might be necessary to
    add one or two small capacitors to improve the stability of the circuit.


