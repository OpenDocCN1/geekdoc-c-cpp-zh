  md: '# 4.2 Harmonic functions


    ![](img/682c64a490ca5f23332f702a346c8b96_77_0.png)


    **Fig. 4.13.** A different approach to an amplitude stabilized oscillator


    A variation of this circuit, which is shown in figure 4.13, has been devised by
    EDWARD L. KORTE$^{41}$. At first sight, this circuit looks quite similar to that
    described above but there are two subtle differences:


    +   - The amplitude is stabilized by a negative linear feedback on the leftmost
    integrator as controlled by the setting of the potentiometer labelled a*.

    - It requires some positive feedback to keep the amplitude up. This is implemented
    by the resistor R and two limiting diodes. The resistor should be of the same
    order as the input resistors of the leftmost integrator. This results in a small
    positive rectangular feedback signal which will keep the amplitude from falling
    to zero.


    This circuit is extremely useful when a high-frequency harmonic signal or signal
    pair with constant frequency is required in a computation. Nevertheless, it is
    not well-known as the basis for a sweep generator, as described in the following
    section, since the amplitude setting a* is quite frequency dependent.


    > 41 See [KORTE 1964].'
