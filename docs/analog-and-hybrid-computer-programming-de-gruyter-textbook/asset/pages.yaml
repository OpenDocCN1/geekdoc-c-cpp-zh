    \ a damping term for the angular velocity $\\dot{\\varphi}$ of the pendulum making\
    \ the simulation more realistic. Setting $\\beta=0$ results in a frictionless\
    \ pendulum.\n\n+   **123** The output function $\\varphi$ will be used.\n**124**\
    \ These two parameters include the respective masses of the cart and the pendulum."
