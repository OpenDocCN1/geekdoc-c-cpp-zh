  md: '# APPENDIX A


    # Solving the heat equation with a passive network


    The two-dimensional heat equation as treated in section 6.22 can also be solved
    by means of a 2d grid consisting of a number of identical passive resistor/capacitor
    (RC) node as shown in the following.¹150} The aim is to model the heat flow in
    a two-dimensional sheet of conductive material such as a thin metal plate as described
    by


    ```

    $$\dot{u} = \alpha\nabla^2u.$

    ```


    To model the behaviour of this equation by means of a discrete two-dimensional
    grid of passive elements, it is approximated by finite differences yielding


    ```

    $u_{i,j} = \alpha(u_{i-1,j} + u_{i+1,j} + u_{i,j-1} + u_{i,j+1} - 4u_{i,j}) +
    g_{i,j}$

    ```


    a single grid node $u_{i,j}$ with $u_{i,j}$ denoting a heat in- or flux to/from
    that node. Such a node is shown in figure A.1 and consists of four resistors and
    a capacitor with a common junction. Applying KIRCHHOFF''s current to the center
    node $u_{i,j}$ yields the following expression for the voltage at the node:


    ```

    $$\frac{(u_{i,j-1} - u_{i,j})}{R} + \frac{(u_{i,j+1} - u_{i,j})}{R} + \frac{(u_{i-1,j}
    - u_{i,j})}{R} + \frac{(u_{i+1,j} - u_{i,j})}{R} - \frac{\dot{u}_{i,j}}{C} + I_{i,j}
    = 0.$

    ```


    The terms in the first fraction''s enumerator are the currents flowing through
    the resistors, the second fraction describes the current through the capacitor,
    and the


