  md: '# 224 B The LAPACE transform


    Substituting $\varphi = -st$ again gives


    ```

    $$\int_{0}^{\infty} \frac{e^{-st}}{s} dt = \frac{1}{s^2}\int_{0}^{\infty} e^{\varphi}
    d\varphi = \left[ \frac{e^{-st}}{s^2} \right]_{0}^{\infty}quad (B.5)$

    ```


    Combining (B.4) and (B.5) gives$^{158}$


    ```

    $$\mathcal{L}(f(t)) = \left[ \frac{e^{-st}}{s} - \frac{e^{-st}}{s^2} \right]_{0}^{\infty}
    = a \left[ \frac{(st+1)e^{-st}}{s^2} \right]_{0}^{\infty} = a$

    ```


    # B.1.4 Exponential and trigonometric functions


    The LAPlace transform of the exponential function has the form


    ```

    $$\mathcal{L}(e^{-at}) = \int_{0}^{\infty} e^{-at}e^{-st} dt = \left[ \frac{e^{-(s+a)t}}{-(s+a)}
    \right]_{0}^{\infty} = \frac{1}{s+a$

    ```


    The basic trigonometric functions can also be transformed in a straightforward
    fashion using the identities


    ```

    $$\sin(\varphi) = \frac{e^{i\varphi} - e^{-i\varphi}}{2i}quad (B.6)$

    ```


    ```

    $$\cos(\varphi) = \frac{e^{i\varphi} + e^{-i\varphi}}{2}quad (B.7)$

    ```


    Using (B.6) gives


    ```

    $$\mathcal{L}(\sin(\omega t)) = \int_{0}^{\infty} \sin(\\omega t)e^{-st} dt =
    \int_{0}^{\infty} \frac{e^{i\omega t} - e^{-i\omega t}}{2i} e^{-st} dt$

    ```


    ```

    $= \frac{1}{2i} \left[ \frac{e^{(i\omega-s)t}}{i\omega-s} - \frac{e^{(-i\omega-s)t}}{-i\omega-s}
    \right]_{0}^{\infty} = \left[ \frac{e^{(i\omega-s)t}}{i\omega-s} \right]_{0}^{\infty}
    - \left[ \frac{e^{(-i\omega-s)t}}{-i\omega-s} \right]_{0}^{\infty}$

    ```


    ```

    $= \frac{1}{2i} \left[ \frac{1}{-s+i\omega} - \frac{1}{-s-i\omega} \right] = \frac{\omega}{s^2+\omega^2}$.

    ```


    Using (B.7) the relation


    ```

    $$\mathcal{L}(\cos(\omega t)) = \frac{s}{s^2+\omega^2}$

    ```


    can be derived analogously.


    +   **158** It can be shown that $\mathcal{L}(at^n) = \frac{an!}{s^{n+1}}$.'
