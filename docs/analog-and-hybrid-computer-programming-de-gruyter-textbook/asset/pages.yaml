    **Fig. 6.75.** Unsuitable direct approach of solving a system of linear equations
    on an analog computer


    It is assumed that the matrix A is non-singular. The task at hand is now to solve
    a system of linear equations as such


    $$A\vec{x} = \vec{b}$$ (6.62)


    for given A and $\vec{b}$, i. e.


    $$\sum_{j=1}^{n} a_{ij}x_j - b_i = 0 \text{ with } 1 \le i \le n.$


    A direct approach would transform such a system of linear equations into a corresponding
    analog computer setup, will be demonstrated using a simple example of two coupled
    equations:


    $$a_{11}x_1 + a_{12}x_2 - b_1 = 0$$ (6.63)\n$$a_{21}x_1 + a_{22}x_2 - b_2 = 0$$
    (6.64)


    Solving (6.63) and (6.64) for $x_1$ and $x_2$ respectively yields


    $$$x_1 = \frac{b_1 - a_{12}x_2}{a_{11}}\$\nx_2 = \frac{b_2 - a_{21}x_1}{a_{22}}$$


    which can be readily transformed into the analog computer setup shown in figure
    6.75.


    Although this direct approach looks elegant, it doesn''t work! First, the coefficients
    $1/a_{ii}$ are hard to implement as an analog computer is always restricted to
    values in the interval $[-1;1]$ the limits which are known as machine units. Second,
    the main problem is that the setup contains algebraic loops, which'
