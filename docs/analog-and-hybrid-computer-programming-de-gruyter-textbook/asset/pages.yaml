  md: '12 — 2 Computing elements


    condition. Overloads normally result from erroneous scaling or patching and do
    not harm the computer but will impair invalidate the computed results.

    Since the machine units are of utmost importance in an analog computer, they are
    typically highly stabilized with temperature compensated reference elements. With
    machine units of ±10 V the computing elements are typically powered by ±15 V supply
    to leave some headroom to detect overloads. So in the case of an overload, the
    output voltage of the affected element can reach values as high as about ±15 V
    on a modern analog computer.

    Scaling a problem to be solved on an analog computer has three objectives:


    +   1 Guarantee that no variable exceeds the limits imposed by the machine units.

    2 Make the best use of the available interval [m−, m+] for each variable of a
    computer setup to minimize the unavoidable errors caused by the computing elements.


    Consequently, it is necessary to distinguish between the problem variables in
    which the problem itself is stated, and the machine variables which are the scaled
    versions of the problem variables. The underlying scaling process is called variable
    scaling. A second scaling process concerns the speed at which the machine will
    solve a problem in contrast to the speed at which the original problem will. This
    is called time scaling as it affects the speed of integration and typically does
    not directly affect the scaling of variables.¹¹

    Generally, it is a good idea to abstract further from the actual machine units
    m− and m+ to think within the interval [−1, 1] instead. Analog computers featuring
    voltmeters as their output devices have those typically scaled accordingly so
    that the machine units correspond to a display of ±1 machine units instead of
    ±10 or ±100 Volts.


    # 2 Summer


    The simplest active element of an analog computer is the summer. Its abstract
    symbol is shown in figure 2.1. A summer yields the negative sum of the voltages
    to its inputs at its output, labelled e₀. Each input has a so-called weight, a
    fixed multiplicative factor applied to the input. Typical weights are 1 and 10,
    while some machines also feature values of 4 or 5. If no weight is noted next
    to an input, it is assumed to be 1. Accordingly, all three inputs e₁, e₂, and
    e₃ in figure 2.1 are weighted by 1.


