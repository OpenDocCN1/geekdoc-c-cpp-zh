  md: '# 7.4 Data gathering


    Using a hybrid controller it is also possible to gather data either during HALT
    periods in a lenghty computer run or continuously during an OP period as shown
    in the following example.¹³⁹ The goal is to solve the one-dimensional wave equation


    ```

    $$\frac{1}{c}\ddot{u} - \frac{\partial^2u}{\partial x^2} =0.$

    ```


    As before, the derivatives with respect to $x$ are approximated by a difference
    quotient yielding


    ```

    $$\frac{1}{\ddot{u}}\frac{u_{i-1}-2u_i+u_{i+1}}{(\Delta x)^2}$

    ```


    with $\Delta x=\frac{x}{n}$ and $n\in\mathbb{N}$. Defining


    ```

    $$\lambda:=\frac{cn}{x^2}}{(\Delta x)^2}$

    ```


    results in a form suitable to derive an algorithm setup:


    ```

    $$\ddot{u}_i=\lambda\frac{u_{i-1}-2u_i+u_{i+1}}{(\Delta r)^2}$

    ```


    To simplify things it is assumed that $n=4$ and $\lambda=1$ finally yielding the
    following set of coupled ordinary differential equations:


    ```

    $u_0=\delta(t)\n\ddot{u}_1=u_0-2u_1+u_2\n\ddot{u}_2=u_1-2u_2+u_3\n\ddot{u}_3=u_2-2u_3+u_4\n\ddot{u}_4=u_3-2u_4+u_5\nu_5=0$

    ```


    $(delta(t)$ represents an impulse occurring at the start of a simulation run,
    i. e. at $t=0$.

    Figure 7.3 shows the recursive computer setup consisting of four basically identical
    cells, each containing two integrators, an inverting summer and a coefficient
    potentiometer. Using the hybrid controller as a data logger is now possible to
    gather the variables $u_1,...,u_n$ during a simulation run.¹⁴⁰


    > ¹³⁹ Depending on the hybrid controller used, the amount of free memory for storing
    data may be rather limited it is advisable to run one problem than many, gathering
    one variable at a time instead of gathering a plethora of variables all at. It
    should also be noted that collecting data from several sources in parallel will
    typically be performed sequentially leading to an (sometimes non-negligible) difference
    in the actual sampling times.


    > ¹⁴⁰ The sampling interval is automatically determined by the amount of free
    memory and the OP time for the run.'
