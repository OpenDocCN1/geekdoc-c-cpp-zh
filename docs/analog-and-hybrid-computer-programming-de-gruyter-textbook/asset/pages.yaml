  md: 'log computer setup, libraries allowing the tight integration of the analog
    computer on chip into a hybrid computer, etc.


    These challenges are formidable but the possibilities of analog computing are
    nearly endless and will more than justify all research and development expenses
    necessary.


    Given the high energy efficiency of analog computers compared with digital approaches
    they will create new fields of application – such as medical implants which could
    consume little electrical energy that could be powered by thermocouples, making
    energy storage devices that must be changed or recharged at regular intervals
    superfluous. It also find numerous applications in mobile and wearable devices
    for signal pre- and post-processing to save previous battery capacity. Even rarer
    complex tasks such as trigger detection for assistance systems can be implemented
    using analog computer techniques, thus saving power in standby mode.


    Other applications will benefit from the fact that a system is not controlled
    by a program stored in some volatile memory can not be “hacked” in a traditional
    way.¹149. This will make analog computers the systems of choice when it comes
    to control systems in critical infrastructure systems, systems on when human lives
    depend, etc.


    Also, most of artificial intelligence, (AI), machine learning will benefit from
    the application of analog computing techniques. Spiking neurons can be directly
    implemented as analog circuits and the fact that neuronal networks are basically
    defined by their interconnection structure, together with their synaptic weights,
    fits well with the paradigm of analog computing.


    Analog computing is a very promising approach for future high performance and/or
    low energy computing and will become part of future computing and communication
    systems.


    Happy analog computing!


    ¹49 If a reconfigurable analog computer is used, the reconfiguration capability
    must be disabled physically to gain that benefit.'
