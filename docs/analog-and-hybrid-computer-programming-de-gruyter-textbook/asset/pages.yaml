    \ by (6.78) alone assuming that\n\n```\n$$\\tilde{x}=\\frac{F}{M}$.\n```\n\nEquation\
    \ 6.78 can be directly converted into a corresponding analog computer program\
    \ as shown in figure 6.88. Based on the input variable $\\tilde{x}$ this setup\
    \ generates the time derivative of the generalized coordinate $\\varphi$. $\\\
    dot{\\varphi}$ is then used to generate the two required harmonic terms $\\sin(\\\
    varphi)$ and $\\cos(\\varphi)$ without the need for a sine/cosine function generator,\
    \ as shown in figure 6.89. Note that the term $\\frac{1}{\\gamma}$ has been arbitrarily\
    \ limited by $\\gamma=1.123$ controls how much the acceleration $\\tilde{x}$ affects\
    \ the pendulum while $\\gamma^2$ controls its effect on the movement of the cart\
    \ $^{124}$\n\nThe potentiometer labelled $g$ yields the gravitational acceleration\
