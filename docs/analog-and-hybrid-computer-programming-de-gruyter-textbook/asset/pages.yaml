  md: "# 232 C Operational calculus\n\nweighting function, which is then multiplied\
    \ pointwise with the second function during the integration process. It should\
    \ be noted that\n\n```\n$$\\int_{0}^{t} g(t-\\tau)f(\\tau)d\\tau = \\int_{0}^{t}\
    \ f(t-\\tau)g(\\tau)d\\tau$$\n```\n\nso either the left- or the right-hand function\
    \ can be interpreted as the weighting function. For the purposes of this discussion\
    \ it will be assumed that the left-hand function is the weighting function.\n\n\
    To eliminate somewhat chomchy convolution notation MIKUSSKI introduces the notation\
    \ $\\{f(t)\\}$ to denote the function $\\tau \\to f(t)$ while $f(t)$ represents\
    \ the value this function takes at $\tau$. Using this notation (C.1) reduces to\
    \ $\\{g(t)\\}\\{f(t)\\}$. This looks quite like a multiplication operation and\
    \ maybe for the next step.$^{164}$\n\nThe special case of $g(t) \\equiv 1$ immediately\
    \ yields\n\n```\n${\\{1 f(t)\\} = \\begin{cases} \\int_{0}^{t} f(\\tau)d\\tau\
    \ \\end{cases}$\n```\n\nwhich suggests the interpretation of $l := \\{1\\}$ as\
    \ an integration operator. $l$ can now be used in the following way for example:\n\
    \n```\n$l(\\sin(t)) = \\begin{cases} \\int_{0}^{t} \\sin(\\tau)d\\tau \\end{cases}\
    \ = - \\cos(t) = 1 - \\cos(t)$\n```\n\nNotably, $l$ as an operator allows “calculating”\
    \ with it if it were a number or a function. A naturally occurring question concerns\
    \ the powers of $l$ - what do these look look like?\n\n```\n$l^2 = l\\{1\\} =\
    \ \\begin{cases} \\int_{0}^{t} 1d\\tau \\end{cases} = \\{t\\}$\n```\n\n```\n$l^3\
    \ = l\\{t\\} = \\begin{cases} \\int_{0}^{t} td\\tau \\end{cases} ={\\frac{1}{2}t^2\\\
    }$\n```\n\n```\n$l^4 = l{\\frac{1}{2}\\} = \\begin{cases} \\int_{0}^{t} \\tau^2d\\\
    tau \\end{cases} ={\\frac{1}{6}t^3\\}$\n```\n\netc. This can be generalized to\n\
    \n```\n$l^n ={\\frac{t^{n-1}}{(n-1)!}}$ for $n \\in \\mathbb{N}$.\n```\n\n$^{164}\
    \ L^1(0, \\infty)$, together with the convolution, forms an associative algebra."
