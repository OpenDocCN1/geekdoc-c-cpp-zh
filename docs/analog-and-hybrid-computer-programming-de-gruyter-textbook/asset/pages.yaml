    # # 6.4 Van der Pol''s equation


    The DER POL equation, named after BALTHASAR VAN DER POL in 1920 as a result of
    his pioneering work on vacuum tubes, describes an oscillator with damping behaviour
    which depends on the amplitude of its output. For small amplitudes the damping
    is negative, so the amplitude will rise until it reaches a certain threshold at
    which the damping term becomes positive resulting in an automatic amplitude stabilization.82


    # ## 6.4.1 Introduction


    The basic form of the VAN DER POL equation is


    ```

    $$\dot{y} + \mu(y^2 - 1)\dot{y} + y = 0$$

    ```


    which can be rearranged to give


    ```

    $$\dot{y} = -y - \mu(y^2 - 1)\dot{y}$

    ```


    Damping is controlled by the term $y^2 - 1$ which is negative for $y < 1$, increasing
    the amplitude. If the amplitude $y$ > 1, the damping term becomes positive and
    decreases the amplitude, thereby effectively stabilizing it.


    This can be readily transformed into the unscaled computer setup shown in 6.15.
    The parameter $\mu$ controls the overall behaviour of the oscillator and is assumed
    to be in the interval $[0,2]$ without loss of generality.


    > 82 See [VAN DER POL et al. 1928] for more details on this type of oscillator.
    In this paper, VAN DER POL and his co-author J. VAN DER MARK develop an electronic
    model for a heart.'
