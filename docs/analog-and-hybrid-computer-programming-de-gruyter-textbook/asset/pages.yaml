  md: '# 52 4 Basic programming


    will typically be on large numbers of atoms of any given isotope. With the dot
    notation as introduced before, this can be written as$^{29}$


    $$\dot{N} \propto N,$


    where $\alpha$ denotes proportionality which can be expressed by a multiplicative
    factor $\lambda$, the $decay rate$, as follows:


    $$\dot{N} = -\lambda N.$ (4.2)


    This is a typical, very simple, ODE describing how an unstable isotope decays
    over time. As before, $N$ is a function of time. The obvious question is which
    function will satisfy the ODE (4.2) in general?


    # 4.1.1 Analytical solution


    This equation is simple enough to allow an analytical solution, ODEs simple enough
    to be solved by such analytical means are quite rare but frequent the existence
    of such a solution is not necessary for programming an computer.$^{30}$ However,
    the analytical solution derived here can be used later to verify the solutions
    obtained by the analog computer.$^{31}$ Rearranging (4.2) yields


    $$\frac{\dot{N}}{N} = -\lambda.$


    Integrating with respect to $t$ on both sides gives


    $$\int \frac{\dot{N}}{N} dt = -\int \lambda dt = -\lambda t + c$


    with $c$ denoting the constant of integration. The left side of this equation
    equals $ln(N)^{32}$ yielding


    $ln(N) = \lambda t + c.$


    > 29 In this book, time as an argument to a function is typically not explicitly
    shown, $N$ and $N$ have to be read as $N(t)$ and $\dot{N}(t)$ respectively.


    > 30 Nonetheless, appendices B and C give a short overview of the methods of the
    operational calculus, which can be used to solve differential equations analytically
    under certain circumstances.


    > 31 The approach used here lacks the rigor required from a mathematician''s point
    of view.


    > 32 This can be shown by explicit differentiation:

    $\frac{d}{dt}(ln(N) + c) = \frac{d}{dt}ln(N) = \frac{1}{N} \frac{d}{dt}N = \frac{\dot{N}}{N}$'
