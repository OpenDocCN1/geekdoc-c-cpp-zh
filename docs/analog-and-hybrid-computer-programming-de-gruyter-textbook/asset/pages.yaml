    The small capacitor prevents ringing when the amplifier''s output is near zero.
    In some cases it could be omitted depending on the behaviour of the open amplifier
    used. Figure 5.3 shows the behaviour of this circuit. The input value has been
    generated by a single integrator yielding a ramp running from $-1$ to $+1$. This
    ramp has also been used for the $x$-deflection of the oscilloscope, too.


    # 5.1.2 Division


    The square root circuit above can be easily modified to implement a division operation.
    Figure 5.4 shows the basic setup: With the multiplier connected to the output
    of the amplifier and to the input variable $y$, the open amplifier will drive
    its output towards $-x/y$, so that the output of the multiplier yields $-x$ which
    cancels the current delivered through the $x$-input and its associated input resistor
    to the inverting output of the amplifier.


    As noted before, a small capacitor of about 68 pF should be connected between
    the output of the amplifier and its summing junction to prevent unstable behaviour
    of the circuit. It should also be noted that this circuit does not perform a fourquadrant
    division operation.


    Some systems feature pre-wired modules to compute common inverse functions such
    as square roots and divisions. Figure 5.6 shows an Analog Paradigm MDS2 module
    containing two computing elements that can be switch selected to perform either
    multiplication, division, or square rooting.'
