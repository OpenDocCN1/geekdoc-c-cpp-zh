  md: '# APPENDIX I


    # HyCon commands


    The Model-1 hybrid controller, HC, is connected by means of a serial line USB
    interface to a digital computer which sends appropriate commands to control the
    operation of the analog computer. Using a serial line terminal program it is possible
    to control the analog computer by typing in these commands:169


    +   A: Enable halt-on-overflow. When enabled, any overload condition will immediately
    HALT the analog computer so that the element(s) causing this condition can be
    identified by their respective overload indicators.


    +   a: Disable halt-on-overflow.


    +   B: Enable external halt – a trigger signal on the HALT-input of the hybrid
    controller will place the analog computer into HALT mode regardless of its current
    mode of operation.


    +   b: Disable external halt.


    +   c: This command expects a six-digit decimal number which specifies the OPT-time
    for repetitive or single-run operation in milliseconds. If values less than 10⁵
    milliseconds are required which is typically the case, the number has to be padded
    with zeros on the left.


    +   C: This command also expects a six digit decimal number specifying the time
    for setting initial conditions in milliseconds.


    > 169 It should be noted that these commands should not be followed by a carriage
    return (<CR>) and/or line feed (<LF>) control character. The hybrid controller
    firmware parses its input data in a bitwise fashion and is not record oriented.
    Spurious <CR>/<LF> or whitespace characters will result in error messages as they
    are regarded as illegal commands.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# 250 I HyCon commands


    +   d: Clear the digital output port which is specified by an address digit in
    the range of 0 to 7.


    +   D: Like d but set the digital output port specified by a single-digit address
    following the command.


    +   e: Issuing this command starts repetitive operation. The analog computer cycles
    through the mode IC and OP with the respective times set by the c and C-commands
    until it is halted.


    +   E: This command starts a single-run cycle, i. e. the analog computer runs
    through the sequence IC, OP, HALT and OP-times as specified above.


    +   f: If a readout-group has been defined with the G-command, issuing an f will
    read all of the elements in that group sequentially and return their values.


    +   F: This command, too, starts a single-run cycle. The main difference to the
    Ecommand is that a message will be returned at the end of the cycle allowing to
    synchronize the analog and digital computer.


    +   g: To return the value of a single computing element, the g-command, followed
    by a four hexadecimal address is issued.$170$ The hybrid controller will return
    the ID of the computing element as well as its current value.


    +   G: This command expects a semicolon separated list of four hexadecimal addresses
    which must be terminated by a single dot to let the hybrid controller know how
    many entries follow.


    +   h: Set the analog computer into HALT-mode.


    +   i: Set the analog computer into IC-mode.


    +   l: Return all values sampled during the last OP cycle if a readout group had
    been previously defined.


    +   o: Set the analog computer to OP-mode.


    +   P: This command is used for setting a digital potentiometer and expects the
    four digit hexadecimal address of the module containing the potentiometer to be
    set, by a two digit address, followed by a four digit value (!) in the range of
    0000 to 1023.$171$ To set the digital potentiometer number on the module with
    the base address 0x0090 to 1/2, the command P009030551 would be required.


    +   q: This prints the current digital setting.


    +   R: Read all eight digital input ports and return their respective values.


    +   s: Print status information.


    +   S: Set the analog computer into POTSET-mode. This is useful for setting manual
    potentiometers – see 2.5.


    > 170 The addressing scheme is described in appendix H.


    > 171 The value 1023 corresponds to a coefficient of 1.'
