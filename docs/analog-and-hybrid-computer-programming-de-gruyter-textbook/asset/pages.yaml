  md: '# 162 — 6 Examples


    developed by MARTIN WILHELM KUTTA AND NIKOLAI JOUKOWSKY. This function maps a
    (unit) circle into the shape of a special type of airfoil. A noteworthy property
    of this class of airfoils is a cusp at its trailing edge.


    The actual conformal mapping as implemented is based on the transform


    ```

    $f(z) = (z - z_*) + \frac{\eta}{z - z_*}$

    ```


    which is split into real and its imaginary parts yielding


    ```

    $u(x(t),y(t)) = (x(t) - x_*) + \frac{\eta^2(x(t) - x_*)}{(x(t) - x_*)^2 + (y(t)
    - y_*)^2}$

    $v(x(t),y(t)) = (y(t) - y_*) - \frac{\eta^2(y(t) - y_*)}{(x(t) - x_*)^2 + (y(t)
    - y_*)^2}$

    ```


    The parameters $x_*$ and $y_*$ define the shape of the resulting airfoil. Good
    values to start are $x_* = 0.045$ and $y_* = 0.052.107$ Figure 6.66 shows the
    computer setup for the conformal mapping.


    The two open amplifiers used to implement the required division operations should
    have small capacitors connected between their respective outputs and summing junctions,
    as noted in section 5.1.2.


    Since the conformal mapping circuit is required twice — to transform the circle
    into a JOUKOWSKY airfoil and to transform the airfoil around the cylinder the
    inputs $x(t)$ and $y(t)$ of the circuit shown in figure 6.66 are rapidly switched
    between the outputs of the subcircuit generating $r\sin(\omega t)$ and $r\cos(\omega
    t)$ and the circuit yielding the coordinates of an air particle flowing around
    the hypothetical cylinder.


    This can be implemented easily by means of two electronic switches, as shown in
    figure 6.67. The switches are controlled in such a way that they change position
    every repetitive cycle of the computer. This requires a toggle flip-flop driven
    by the operate control line of the computer.


    The overall computer setup is complex and requires a large complement of computing
    elements, the majority of which are summers and multipliers. Figure 6.68 shows
    the resulting simulated airflow around an airfoil.


