    $\dot{\varphi}_1 = -\frac{1}{2}[\varphi_1\cos(\varphi_1 - \varphi_2) + \varphi_2^2\sin(\varphi_1
    - \varphi_2) + 2g\sin(\varphi_1)]$ (6.88)

