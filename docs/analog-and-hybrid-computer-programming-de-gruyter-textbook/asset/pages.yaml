    The following examples give a basic overview of the general capabilities of a
    hybrid computer. More information on hybrid computing with many applications can
    be found in [BEKEY et al. 1968], [KORN et al. 1964], [SCHÖNEFIELD 1977], and other
    classic text books.


    # 7.2 Basic operation


    The Model-1''s hybrid controller used in these examples is connected to the digital
    computer by means of a USB interface that emulates a serial line.$132}$ To facilitate
    programming the digital computer a Perl$^{133}$-module (IO::HyCon) has been implemented;
    it provides an object oriented interface to the hybrid controller.$^{134}$


    +   131 See section H.

    132 It is therefore possible to manually control the analog computer equipped
    with this controller instead of a manual control unit by sending appropriate commands
    and parameters using a serial terminal application. See appendix 1 for a description
    of these commands.

    133 See [CHROMATIC 2015] for an introduction to modern Perl programming.

    134 A description of this module can be found in https://metacpan.org/pod/IO::HyCon,
    retrieved April 4th, 2020.'
