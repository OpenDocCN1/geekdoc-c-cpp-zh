  md: '# APPENDIX F


    # A sine/cosine generator


    In some cases, such as the inverted pendulum simulation which was used to train
    a machine learning system, basic harmonic functions such as sin($\varphi$) and
    cos($\varphi$) cannot be generated using the quadrature generator described in
    section 6.25, figure 6.89, because using the quadrature element variations will
    cause $\varphi$ and the derived functions sin($\varphi$) and cos($\varphi$) to
    drift apart over time.


    If the argument $\varphi$ can be guaranteed to be in an interval like $[-1, 1]$,
    functions like sin($\varphi$) can be generated using special function generators
    based on polygonal approximation. The AD639$^{168}$ is a rare but very useful
    integrated circuit which generates basic trigonometric functions; this was used
    to build the dedicated function generator shown in figure F.1.


    Both potentiometers R2 and R6 have to be adjusted so that an input voltage in
    the range of $[-2\pi, 2\pi]$ rad $\triangleq [-1, 1]$ $\triangleq [-10, 10]$ V
    is mapped to the interval $[-7.2, 7.2]$ V.


    168 See [Analog Devices].'
