    # 1.3 A short history of analog computing


    The idea of analog computing is, of course, much older than today''s predominantly
    algorithmic approach. In fact, the very first machine that might amply be called
    an analog computer is the Antikythera mechanism, a mechanical marvel that was
    built around 100 B. C. It has been named after the Greek island Αντικύθηρα (Antikythera)
    where its remains were found in a Roman wreck by sponge divers after the neglected
    lump of gears introduced by DEREK DE SOLA PRICE, who summarized his scientific
    findings as:**


    > "It is a bit frightening to know that just before the fall of their great civilization
    the ancient Greeks had come so to our age, not only in their thought, but also
    in their scientific technology."


    Research into this mechanism, which defies all expectations with respect to an
    ancient computing device, is still ongoing. Its purpose was to calculate sun and
    moon eclipses and precisely much more. The mechanism consists of more than 30
    gears of extraordinary precision yielding a mechanical analogue for the study
    of celestial mechanics, something that was never heard or even thought of for
    many centuries to come.⁴


    Slide rules can also be regarded as simple analog computers as they allow the
    execution of multiplication, division, rooting each by shifting of (mostly) logarithmic
    scales against each other. Nevertheless, these are rather specialized analog computers,
    just planimeters, which were (and to some extent still) used to measure the area
    of closed figures, a task frequently occurs in surveying but in all branches of
    natural science and engineering.


    Things became more interesting in the 19th and 20th century with the development
    and application of practical mechanical integrators. Based on such developments,
    WILLIAM THOMSON, lord Kelvin, developed the concept of a machine capable of solving
    differential equations. Although no usable computer evolved from this, his ideas
    proved very fruitful. Specifically, his approach


    +   2 More information on DDAs may be found in [FORBES 1957, FORBES 1972, WLER
