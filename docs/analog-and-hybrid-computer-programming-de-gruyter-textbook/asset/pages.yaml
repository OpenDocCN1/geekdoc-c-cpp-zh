  md: '# CHAPTER 7


    # Hybrid computing


    Although analog computers are extremely powerful on their own, the combination
    of an analog computer and a digital computer forming a *hybrid* computer is even
    more powerful.


    This idea is by no means new – as early as 1956 *Space Technology Laboratories*
    developed the *ADDAVERTER*, a system capable of coupling an analog computer with
    a digital computer by means of 15 ADCs and 10 DACs¹¹¹²⁶ each featuring a precision
    of ±0.1 %. The rationale behind such a setup is that digital computers are good
    in areas where analog computer have deficiencies and vice versa. Applications
    for their combination are abundant due to their computational power and energy
    efficiency.


    A hybrid computer typically operates in one of two modes:


    **Alternating operation:** In this mode of operation the digital computer typically
    controls the parameters of an analog computer setup. The analog computer performs
    an operation run based on a parameter set returning the results of its computation
    to the digital computer by means of ADCs. Based on these results the digital computer
    can then derive a new set of parameters and so forth. Since the operation of the
    digital and analog computers do not overlap, this mode is not time critical with
    respect to communication latencies, ADCs conversion times, etc. Alternating operation
    is typically employed for the solution of optimization problems, multidimensional
    parameter searches,'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 194 7 Hybrid computing


    the solution of partial differential equations, stochastic analyses, and related
    problems.


    **Parallel operation:** This mode of operation requires real time operation by
    the digital computer as it operates in parallel with the analog computer and has
    to read and supply values with as little latency as possible. In a setup this,
    the digital computer can not only change coefficients at run-time but also generate
    functions,¹²⁷ act as a delay circuit, make decisions based on the values of analog
    variables, and much more.


    # 7.1 Hybrid controllers


    The following examples and explanations are based on the Analog Hybrid controller
    but the ideas and techniques presented are by no means restricted to this particular
    device. Similar coupling devices have been available in the past and can be built
    using cheap off-the-shelf hardware such as Arduino-boards etc.¹⁸ A hybrid controller
    like this might be connected via USB to the digital computer and will typically
    provide the following functions:


    **Control lines:** The hybrid controller must be able to control the mode of operation
    of the analog computer''s integrators. In the simplest case it will accept commands
    like ic, op, or halt from the digital computer and the ModeIC and ModeOP control
    lines accordingly.


    Depending on its connection to the digital computer there might be considerable
    delays in the exchange of signals due to communication latencies.¹²⁰ This can
    be problematic in applications where precise timing of IC- and OP-times is required.
    It is therefore recommended that the hybrid controller itself should feature a
    clock with at least 1 μ resolution with all timing issues being formed locally
    by the hybrid controller – without the need to communicate with the attached digital
    computer.


    The hybrid controller should also be able to sense overload conditions, to control
    the POTSET line,¹³⁰ and it should feature an input line for an external halt signal.


    +   ¹²⁷ Using a digital computer to generate functions of several variables is
    very beneficial as this is notoriously difficult to implement on a pure analog
    computer.

    ¹²⁸ The schematics of a simple Arduino- based hybrid controller can be found at:
    https://analogmuseum.org/english/examples/hybrid/, retrieved on March 10th, 2020.

    ¹²⁹ Latencies of up to several 10 ms are not unusual for serial communication
    over USB depending on the operating system, device drivers etc.

    ¹³⁰ See section 2.5.'
