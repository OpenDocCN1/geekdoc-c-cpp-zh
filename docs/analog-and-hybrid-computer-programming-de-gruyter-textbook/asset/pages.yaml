    which the successive integrations started. This output is then connected to the
    input of the integrator chain, thus forming a *feedback loop*.

    In the case of radioactive decay the DEQ already has its highest derivative on
    the left-hand side:


    $$\dot{N} = -\lambda N.$ $(4.4)$


    Pretending that $\dot{N}$ is known, it can be fed to an integrator which readily
    yields $-\lambda N$ at its output. Multiplying this value by $\lambda$ results
    in $-\lambda N$, which is the right-hand side of (4.4). Since the left and right
    sides have to be equal, $-\lambda N$ can be used as the input for the integrator
    used to derive $-\dot{N}$, effectively forming the central feedback loop shown
    in figure 4.2.


    This setup is not yet complete as it lacks a way to set the initial condition
    $N(0)$. It is also desirable to have $N$ as output instead of $-\lambda N$. The
    program shown in figure 4.3 satisfies both of these requirements.


    The resulting of these two circuits on an Analog Paradigm Model-1 analog computer
    is shown in figure 4.4. A typical solution curve can be seen in the oscilloscope
    screenshot shown in figure 4.5. The solution displayed is clearly of the form
    $-x$ as expected from the analytical solution (4.3).


