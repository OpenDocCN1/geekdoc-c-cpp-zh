  md: '# 228 B The LAPLACE transform


    The initial conditions $x(0-) = 1$ and $[\dot{x}]_{t=0} = 0$ give


    ```

    $s^2 \mathcal{L}(x) - s \mathcal{L}(x) = 1$

    ```


    which can be rearranged into


    ```

    $(s^2 + 1)\mathcal{L}(x) = s + 1$

    ```


    and finally into


    ```

    $\mathcal{L}(x) = \frac{s+1}{s^2+1}$.

    ```


    Instead of computing the inverse transform, type of typical LAPLACE transforms
    is used to determine


    ```

    $x = \mathcal{L}^{-1}\left(\\frac{s+1}{s^2+1}\right)$,

    ```


    the right-hand side of which matches equation (B.8) in the preceding section with
    $a=1$ and $\omega^2=1$ yielding the final solution of this differential equation:


    ```

    $x = \sqrt{2}\sin\left(t + \frac{\pi}{4}\right)$

    ```


    # B.6 Block diagrams and transfers functions


    In engineering, dynamic systems are often described as block diagrams showing
    all forward and feedback paths of the system under consideration, such as transducers,
    amplifiers, servomotors etc. The individual blocks are described by a transfer
    function $\Phi$ which defines how the input and output of the block are linked
    together:


    ```

    $\frac{\text{output}}{\text{input}} = \Phi$.

    ```


    These transfer functions are typically written as LAPLACE transforms.${161}$ They
    can be simulated by either passive electronic elements, a combination of operational
    amplifiers and passive elements, or by analog combinations. Using tables linking
    typical transfer functions with their corresponding implementation


    > 161 Instead of the LAPLACE transfer variable $s$, which is identified with differentiation
    and integration in the case of $\frac{1}{2}$, the classic $p$ operator is often
    used:


    ```

    $p = \frac{\text{d}}{\text{d}t}p = \int_{0}^{t} dt$

    ```'
