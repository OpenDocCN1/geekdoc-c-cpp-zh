  md: '# 4.2 Harmonic functions — 59


    ![](img/682c64a490ca5f23332f702a346c8b96_73_0.png)


    **Fig. 4.8.** Basic computer setup for equation (4.5) with $\omega = 1$


    In order to apply KVIN feedback technique equation (4.5) has to be rearranged
    so that its highest derivative appears on the left side yielding


    $$$\ddot{y} = -\omega^2 y$$


    This differential equation is still simple enough that analytic solutions can
    be “guessed”. Functions $y$ for which the second derivative is equal to the negative
    of the function with some weight $\omega^2$ are required. One function is, of
    course, the constant 0-function is quite trivial. Two more interesting solutions
    are based on sine and cosine as


    $$$\frac{d^2\sin(wt)}{dt^2} = -\omega^2\sin(wt)\n\frac{d^2\cos(wt)}{dt^2} = -\omega^2\cos(wt)$$$


    So just by inspection, three basic solutions of this differential equation have
    been identified. These are called particular solutions but which solution is the
    correct one? This cannot be decided from just (4.5) as this equation does not
    contain any information about the initial conditions. Since this DEQ is of order
    two there are two initial conditions involved, one for $y$, called $y_0$, and
    one for $\dot{y}$, denoted by $\dot{y}_0$.


    To keep things simple assume that $\omega=1$, $\tau$ is controlled solely by $k_0$
    shown in figure 4.8. The leftmost integrator has an output signal of $-1$ at the
    start of the simulation, $t=0$. The second integrator implicitly has an initial
    condition of 0, therefore output is at $t=0$ and will initially rise during the
    simulation due to the input values delivered by the output of the first integrator.


    With $\omega=1$, $\tau$ is controlled by $k_0$ which has to be set equal for both
    integrators. Setting $k_0=10^2$ results in an output signal with a period of 6.28
    ms which is exactly what would be expected for $\omega=1$.


    Using a different initial condition scheme as 0 for the leftmost integrator and
    $-1$ for the second integrator would have yielded $\cos(\tau)$ instead of $\sin(\tau)$.
    By applying initial conditions $\neq 0$ to both integrators, linear combinations
    of these particular solutions can be achieved. With $\dot{y}_0$ and $y_0$ denoting
    the initial conditions for the left and right integrator, it is


    $$$y_0 = -a\sin(\tau)$$$'
