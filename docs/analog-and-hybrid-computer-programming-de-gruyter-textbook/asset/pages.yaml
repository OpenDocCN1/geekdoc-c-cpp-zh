    of inputs of the summer.


    Summer basics:

    The behaviour of an (ideal) summer is is described by


    $e_o = -\sum_{i=1}^{n} a_ie_i$


    with the weights $a_i$ being typically 1 or 10. It yields the negative sum of
    the weighted voltages applied to its inputs. Typical summers have about six inputs,
    three of which have input weight 1 while the remaining three inputs are weighted
    by 10.


