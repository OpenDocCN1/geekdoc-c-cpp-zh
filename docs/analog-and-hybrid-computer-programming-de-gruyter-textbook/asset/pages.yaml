    # 5.12 Minimum/maximum holding circuits


    During the study of stochastic systems, but not restricted to these, it is often
    useful to have a minimum/maximum holding circuit to store extreme values of a
    signal for later analysis or for use in a subsequent computer run. A plethora
    of circuits to accomplish this can be found in the literature, see [AMMON 1966,
    pp. 114 f.] or [HAUSNER 1971, p. 146] etc. These circuits often make use of idealized
    diodes as described in section 5.6 requiring an open amplifier with the associated
    stability problems.


    If the computer being used has comparators with (fast) electronic switches, very
    simple minimum/maximum holding circuits can be devised. Figure 5.28 shows a typical
    minimum holding circuit – the electronic switch connects the input of the integrator
    to the output of the inverting switch whenever the value at the integrators output
    is larger than the value at the switch''s output. By interchanging the two inputs
    of the electronic switch, the minimum holding circuit can be transformed into
    a maximum holding device.


    Generally, it is advisable to have the integrator set to a time scale factor as
    large as possible, so that it will take on new values as quickly as possible.
    Depending on the behaviour of the integrator may show significant drift with a
    setting like $k_0 = 10^9$ and using an input weighted by 10. Most electronic switches
    will also exhibit some balance error increasing the drift in this setup. Connecting
    the free input of the switch to ground as shown can lessen this error.'
