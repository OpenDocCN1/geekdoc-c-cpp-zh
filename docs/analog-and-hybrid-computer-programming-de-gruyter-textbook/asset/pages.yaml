  md: '# 104 — 5 Special functions


    The LAPLACE operator may now be approximated quite simply by the following first-order
    PADÉ approximation:68


    ```

    $$P_1(s) = \frac{y_o(s)}{y_i(s)} = \frac{1 - \frac{sT}{2}}{1 + \frac{sT}{2}} =
    \frac{2 - sT}{2 + sT}$

    ```


    Cross multiplying the two fractions yields


    ```

    $$y_o(s)(2 + sT) = y_i(s)(2 - sT)$.$

    ```


    Treating $s$ as the differentiation operator as this equation can be interpreted
    as follows:69


    ```

    $$2\dot{y}_o + T\ddot{y}_o = 2y_i - T\dot{y}_i$.$

    ```


    Rearranging any terms yields


    ```

    $$T(\ddot{y}_o + \dot{y}_i) = 2(y_i - y_o)$.$ (5.5)

    ```


    Unfortunately, this differential equation cannot be readily implemented on an
    analog computer using the well-known KELVIN-feedback technique. Because there
    are two derivatives of degree one there is no single highest derivative to solve
    (5.5). Although time-derivatives can be generated on an analog computer,770 this
    is generally not advisable. Instead, integrating over both sides yields


    ```

    $$\int_0^t(\ddot{y}_o + \dot{y}_i) dt = \int_0^t(y_i - y_o) dt$$

    ```


    from which


    ```

    $$\frac{T}{2}(\dot{y}_o + y_i) = \int_0^t(y_i - y_o) dt$$

    ```


    This equation can readily be converted to an analog computer setup shown in figure
    5.40.71 The coefficient $\alpha$ cannot be represented directly by a potentiometer
    setting restricted to $0 \le \alpha \le 1$. Accordingly, the output of the potentiometer
    will be connected to an input supplied weighted72 by $\alpha$ of the summer on
    the right, as shown in the figure.


    +   68 A thorough treatment of PADÉ approximations from a numerical point of view
    can be found in [SACHS 2016] and [Press et al. 2007, pp. 245 ff.].


    +   69 The argument (t) will be omitted to avoid unnecessary clutter in the equations.


    +   70 See section 5.14 for a typical circuit.


    +   71 A comprehensive treatment of the implementation of transfer systems on
    analog computers can be found in [GilOI et al. 1963, pp. 288 ff.].


    +   72 Typically a factor of 10, 20, or 100 will turn out to be suitable.'
