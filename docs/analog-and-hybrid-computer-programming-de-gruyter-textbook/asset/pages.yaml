  md: 'As usual, the time $t$ as parameter of the function $x()$ has been omitted
    here and below.


    At first sight, one might tempted to implement the function $x$ using a diode
    argument function generator or a suitable approximation but due to the fixed range
    of a function generator this is not viable. As is frequently the case, it is much
    better to generate the required function by solving a suitable differential equation.
    Differentiating (6.3) twice yields


    ```

    $$\dot{x} = 2\sin(2t)\n$\ddot{x} = 4\cos(2t)$

    ```


    This results in the following differential equation which has (6.3) as a solution


    ```

    $$\ddot{x} + 4x = 4.$

    ```


    This is demonstrably correct, as (6.5) and (6.6) can be substituted into (6.7)
    to


    ```

    $$\cos(2t) + 4(1 - \cos(2t)) = 4.$

    ```


    # 6.3.2 Scaling and programming


    As a first step in deriving a computer setup for (6.4) equation (6.7) first must
    be converted into an unscaled analog program. It can be written as a system of
    equations which quite closely resemble a program:


    ```

    $$\dot{x} = \int\ddot{x} dt\n$\x = \int\dot{x} dt\n$\ddot{x} = 4 - 4x$

    ```


    Obviously, $0 \le x \le 2$ due to (6.3), so can be scaled by $1/2$ which must
    be compensated for doubling the factor 4 in (6.9) accordingly, yielding


    ```

    $$\dot{x} = \int\ddot{x} dt,\n$\tilde{x} = \frac{1}{2}\int{x} dt, and,\n$\ddot{x}
    = 4 - 8\tilde{x}.$

    ```


    From (6.6) it is clear that $-4 \le \tilde{x} \le 4$, so (6.11) must be scaled
    by $1/4$ which will be compensated for quadrupling $\tilde{x}$ in (6.10):'
