    show $x$ vs. $y$, $x$ vs. $z$, and $y$ vs. $z$.


    The mathematical description of this particular oscillator is based on three coupled
    differential equations of the form


    ```

    $$\dot{x} = c_1(y - x - f(x)), \quad (6.36)$

    $\dot{y} = c_2(x - y + z), \quad (6.37)$

    $\dot{z} = -c_3y \quad (6.38)$

    ```


    with $f(x)$ describes the behaviour of the CHUA-diode and is defined as


    ```

    $$f(x) = m_1x + \frac{m_0 - m_1}{2}(|x+1| - |x-1|). \quad (6.39)$

    ```


    The standard values for the parameters are


    +   - $c_1 = 15.6$,

    - $c_2 = 1$,

    - $c_3 = 28$,

    - $m_0 = -1.143$, and

    - $m_1 = -0.714$.'
