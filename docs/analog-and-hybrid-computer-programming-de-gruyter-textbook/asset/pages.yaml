  md: '# 6.6 Ballistic trajectory


    The following example computes the two-dimensional ballistic trajectory of a projectile
    from a cannon taking the velocity-dependent drag, which slows down the projectile,
    into account.$^{86}$ This drag causes the trajectory to deviate from a simple
    symmetric parabola as it will be steeper on the falling path than its leading
    part. The drag $\delta(v)$ is assumed to be of the general form


    ```

    $$\delta(v) = rv^2 \quad (6.17)$

    ```


    with


    ```

    $v = \sqrt{x^2 + y^2}$

    ```


    This is a bit oversimplified as, according to SIACCI, a realistic drag function
    for a historic projectile has the form$^{87}$


    ```

    $$\delta(v) = 0.2002v - 48.05 + \sqrt{9.6 + (0.1648v - 47.95)^2} + \frac{0.0442v(v
    - 300)}{371 + (\frac{v}{200})^{10}}$

    ```


    Nevertheless, (6.17) will suffice for this example.


    The general equations of motion of the projectile in this two-dimensional problem
    are


    ```

    $$\dot{x} = \frac{\delta(v)}{m}\cos(\varphi) \quad (6.18)\n$\dot{y} = -g - \frac{\delta(v)}{m}\sin(\varphi)
    \quad (6.19)$

    ```


    with $g$ representing the acceleration of gravity, $v$ denoting the projectile''s
    velocity, and $m$ being its mass. Accordingly, it is


    ```

    $$\cos(\varphi) = \frac{\dot{x}}{v} \quad \text{and}\n$\sin(\varphi) = \frac{\dot{y}}{v}$

    ```


    Setting the mass $m := 1$ and rearranging (6.18) and (6.19) gives following of
    differential equations:


    ```

    $$\tilde{x} = \frac{\delta(v)}{v}\dot{x}\n$\tilde{y} = -g - \frac{\delta(v)}{v}\dot{y}$

    ```


    **86** Cf. [KORN 1966, pp. 2-7 ff.].


    **87** The author would like to thank RAINER GLASCHICK for this interesting piece
    of history.'
