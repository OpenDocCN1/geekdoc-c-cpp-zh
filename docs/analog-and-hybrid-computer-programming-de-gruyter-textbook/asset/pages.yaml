    # 4.4 Mathematical pendulum


    This section describes the simulation of the movement of the tip of a *mathematical
    pendulum* as shown in figure 4.16. It consists of a weightless rod which is pivoted
    at point 0 around which it can swing freely. Mounted at the other end of the rod
    is a point mass $m$. The angle $\alpha$ denotes the maximum displacement of the
    pendulum, i.e. its initial condition, while $\alpha$ represents the current angle
    with respect to the vertical running through the pivot located at $0^{42}$


    The mass is subjected to the force $F_g = mg$ which is caused by the acceleration
    due to gravity. This can be resolved into two forces acting tangentially ($F_t$)
    and radially ($F_r$) on the mass:


    ```

    $F_t = -mg\sin(\alpha)\nF_r = mg\cos(\alpha)$

    ```


    $F_t$ is the restoring force which will drive the mass back to its position of
    rest. It causes a tangential acceleration


    ```

    $a_t = \frac{F_t}{m} = l\ddot{\alpha}$

    ```


    with $l$ denoting the length of the pendulum rod and $\ddot{\alpha}$ being the
    angular acceleration. This readily yields


    ```

    $ml\ddot{\alpha} = -mg\sin(\alpha)$

    ```


    and thus the following differential equation of second order describing the dynamic
    behaviour of the pendulum:


    ```

    $\ddot{\alpha} + \frac{g}{l}\sin(\alpha) = 0 \quad (4.6)$

    ```


    42 Since $\alpha$ changes with time, $\alpha(t)$ would be more accurate but it
    would clutter the following derivations. Furthermore, the time-dependency of this
    angle will show in the dot-notation used for its derivatives.'
