  md: "# 6.8 Rutherford-scattering — 131\n\n![](img/682c64a490ca5f23332f702a346c8b96_145_0.png)\n\
    \nThe results shown in figures 6.25 and 6.26 were obtained with the analog computer\
    \ set to repetitive operation with an OP-time of 10 ms and time scale factors\
    \ $k_0 = 10^3$ set on all integrators.\n\nFigure 6.25 shows two typical paths\
    \ of a particle which is deflected by the magnetic field but not. The values for\
    \ $\\alpha$ and $\beta$ were the same for both particles. Only $x_2$, the coordinate\
    \ at which the magnetic field ceases to act on the right side, has been increased\
    \ in the second case. The particle in the left picture is fast enough to escape\
    \ the narrow magnetic field while the wider field in the right picture causes\
    \ the particle to be reflected.\n\nFigure 6.26 shows the path of a particle with\
    \ heavy friction. The friction is so large that the particle cannot escape the\
    \ area in which the magnetic field acts.\n\n# 6.8 Rutherford-scattering\n\nIn\
    \ the early 20th century ERNEST RUTHERFORD performed a seminal experiment in which\
    \ he bombarded a gold foil with $\\alpha$-particles.$^{89}$ He observed that the\
    \ vast majority of these particles just went through the gold foil without being\
    \ deflected or absorbed. Nevertheless, some of these particles were deflected\
    \ through large angles with fewer $\\alpha$-particles reflected by the gold foil,\
    \ a phenomenon called RUTHERFORD-scattering. This led to the planetary RUTHERFORD\
