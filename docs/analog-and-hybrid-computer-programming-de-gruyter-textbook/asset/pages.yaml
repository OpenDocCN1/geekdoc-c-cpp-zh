  md: '# C.1 Introduction — 233


    It should be noted that real exponents of $l$ can be handled in the same way with
    $\Gamma(n)$ replacing the $(n-1)!$-term in the denominator making this operator
    even more versatile.


    $l^n \{f(t)\}$ can now be interpreted as the $n$-fold integration


    ```

    $$\int_{0}^{t} \dots \int_{0}^{t} f(\tau)d\tau^n \n n \text{ integrations}$

    ```


    or as the convolution


    ```

    $$\left\{ \frac{l^{n-1}}{(n-1)!} \right\} \{f(t)\}$

    ```


    which eventually yields the well-known CAUCHY $formula$ for repeated integration


    ```

    $$\int_{0}^{t} \dots \int_{0}^{t} f(\tau)d\tau^n = \frac{1}{(n-1)!} \int (l-\tau)^{n-1}f(\tau)d\tau
    \n n \text{ integrations}$

    ```


    Furthermore, if $\{g(t)\}f(t)\}$ is interpreted as a multiplication, then what
    if $\{f(t)^l\}$? Especially, what happens in the special case of $l\{g(t)\}$?
    As an example, let $\{f(t)\} = \{t^2\}$. Obviously,


    ```

    $l\2t\} = \left\2 \int_{0}^{t} \tau d\tau\right\ = \{t^2\}$

    ```


    so that


    ```

    $$\left\{ \frac{t^2}{l} \right\ = \{2t\}$

    ```


    This suggests that while $l$ is the integration operator, $s := l^{-1}$ acts as
    a differentiation operator!


    In general, it is


    ```

    ${f(t)\} = l\{f''(t)\} + \{f(0)\} = \left\ \int_{0}^{t} f''(\tau)d\tau + f(0)
    \right\}$

    ```


    as before. Multiplying by $s$ on both sides yields


    ```

    $s\{f(t)\} = s\{f''(t)\} + s\{f(0)\} \quad (C.2)$

    ```


    which actually defines the differentiation operator. MIKUSIŃSKI introduced introduced
    the notation $[f(0)] := s(f(0))$. However, for the sake of simplicity, $c$ will
    just be written instead of $s(c)$ for a constant function $c$ (particularly $f(0)$).
    It should'
  merge: -1
