    # 2.3 Integrators


    At first sight it is astonishing that an analog computer features integration
    of one of its basic operations. This makes it the ideal machine to solve problems
    that can be described by differential equations and systems thereof. But there
    is a catch: Integration on an analog-electronic analog computer is always with
    respect to time, so all integrations are basically of the form


    > $e_{o} = -\left(\sum_{i=1}^{n} a_i e_i d\tau + e(0)\right)$


    with some constant $e(0)$ called the initial condition. In particular, this means
    partial differential equations, i. e. differential equations in which derivatives
    with respect to more than one variable occur, cannot be handled directly on an
    analog computer without explicit discretization or other techniques!


    Obviously, the output of an integrator depends on the history of its input values,
    so this computing element is a kind of memory. In contrast to a simple summer,
    this necessitates some control of its operation as an integration has'
