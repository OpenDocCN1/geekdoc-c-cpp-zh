  md: '# 6.20 Flow around an airfoil — 159


    around an infinitely long rotating cylinder which is then transformed with its
    surrounding airflow into the shape of an airfoil by a conformal mapping.106


    Spinning objects moving through air, such as golf balls or rotating cylinders,
    experience a force which is due to the effect of their rotation in conjunction
    with the surrounding medium. This is known as MAGNUS effect after HEINRICH GUSTAV
    MAGNUS, a German physicist who gave the first comprehensible explanation of this
    phenomenon. The airflow around a rotating cylinder will be simulated using the
    following assumptions:


    +   - The cylinder with circular cross section is infinitely long.

    - The airflow is always perpendicular to the cylinder axis. Furthermore, it is
    stationary and conservative, i. e.


    ```

    $v = 0$ and $\dot{A} = 0$

    ```


    with $v$ and $A$ denoting the velocity and area of the airflow.

    The air is assumed to be incompressible and frictionless.


    This airflow is a potential flow and its velocity field can then be described
    as the gradient of some complex function $f(z)$ called velocity potential. The
    function


    ```

    $f(z) = v_0(ze^{i\varphi} + \frac{r^2e^{-i\varphi}}{z}) - i\frac{\Gamma}{2\pi}log(z)$

    ```


    will be used. Here $r$ denotes the radius of the cylinder which the air flows.
    $v_0$ is the initial velocity of the airflow, $\varphi$ the angle of attack, and
    $\Gamma$ the circulatory component.


    First of all to generate the circumference of the rotating cylinder, i.e. a circle,
    is needed. This is implemented like before by solving the classic differential
    equation $\dot{y} =ay$ as shown in figure 4.11 in section 4.2. The radius is set
    to be about 0.4 by means of the parameter $a$, which controls the negative feedback,
    and the initial condition $a$ of the first integrator. Both of these must match
    to avoid artifacts at the start of a simulation run. As before, the coefficient
    $a$ provides a very small feedback. If it is omitted, the radius does not decrease
    during a possible run. If it is required, it should be set to 0.005, otherwise
    the sine/cosine scales will be distorted. The time scale factors of the two integrators
    should be set at least to $k_0 = 10^3$.


    The program for the complex velocity potential is rather more complicated and
    is shown in figure 6.63. This circuit expects three parameters/input values:


    > 106 This section is mainly based on [LOTZ AAB]. The author would like to thank
    Mr. LOTZ for several enlightening and interesting discussions regarding conformal
    mappings and their implementation on analog computers. Other useful sources are
    [REUTTER et al. 1968] and [SYDOW 1964, p. 123].'
