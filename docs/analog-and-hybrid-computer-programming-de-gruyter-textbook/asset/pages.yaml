    # 6.10 Bouncing ball


    The simulation of a bouncing ball in a box described in the following section
    is not only interesting in itself but also ideally suited for setting up a fascinating
    display for exhibitions, schools etc. Using high-speed integration and repetitive
    operation of the analog computer, a flicker-free oscilloscope display of the ball''s
    path can be easily obtained. This allows one to change the parameters of the simulation
    manually and directly observe the effects of these changes.$94$


    > 93 See [LIAO 2013].


    > 94 This section was inspired by [Telefunken/Ball].'
