  md: 'time. Differential equations of this type are commonly called ordinary differential
    equations or ODEs are of the general form


    $$f\left(t, y, \frac{dy}{dt}, \frac{d^2y}{dt^2}, \dots, \frac{d^ny}{dt^n}\right)
    = 0 \quad (4.1)$


    where $y$ denotes the unknown function, a “simple” variable! If the independent
    variable is time, $y$ depends on $t$ and thus should be thought of as $y(t)$ although
    this is almost never written explicitly to avoid unnecessary clutter in the equations.
    This time dependency makes differential equations very interesting and powerful,
    as they can be used to describe dynamic systems.


    The highest derivative of $y$ determines the order of the ODE. As is customary,
    derivatives with respect to time will be denoted by placing a dot over the function
    as in the following:


    $$\dot{y} = \frac{dy}{dt}, \frac{d^2y}{dt^2}, \ddot{y} = \frac{d^3y}{dt^3}, \dots$$


    Typically, systems with $y$ representing some position of an object require derivatives
    $\dot{y}$ (velocity), $\ddot{y}$ (acceleration), and sometimes $\dddot{y}$ (jerk
    or jolt). Differential equations can also contain functions and derivatives with
    more than one independent variable. A typical example for this is the well known
    one-dimensional *wave equation*


    $$\frac{\partial^2u}{\partial t^2} = c_p^2 \frac{\partial^2u}{\partial x^2}$$


    which describes how a wave travels through a medium. Differential equations of
    this type are called *partial differential equations (PDEs)* and are normally
    much more complicated to solve, even by using an analog computer, than ODEs.


    # 4.1 Radioactive decay


    As an introductory example, the behaviour of radioactive decay will be investigated
    in some detail using an analog computer. Chemical elements are different *isotopes*
    that have the same number of protons in the nucleus but differ in their respective
    numbers of neutrons. Not all of these are stable. Some are unstable and typically
    emit particles as an $\alpha$- or $\beta$-particle (a Helium nucleus and an electron,
    respectively) or electromagnetic $\gamma$-radiation. These are the most common,
    but by no means the ways in which unstable isotopes can transmute into other isotopes
    through *radioactive decay*.


    Regardless of the actual mechanism of the decay, the number of atoms decaying
    in a given time interval is proportional to the amount of the isotope at the start
    of the interval. As radioactive decay is a stochastic process, the focus'
