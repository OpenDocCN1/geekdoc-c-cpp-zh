    # 5.11 Bang-bang


    The so-called *bang-bang* circuit gives one of two values at its output depending
    on its input voltage. This can be readily implemented by means of a comparator
    with an associated (electronic) switch as shown in figure 5.26. The inputs to
    the comparator''s switch are connected to potentiometers which define the upper
    and lower limit of the circuit''s output. One input of the comparator is connected
    to the input signal while the other one is fed with a threshold value $\gamma$.
    If this second input is grounded or omitted, the circuit will switch when the
    input $x$ crosses zero. In this case the circuit effectively implements the $sign(x)$
    function.


    Figure 5.27 shows the dynamic behaviour of this simple bang-bang circuit. It is
    fed with a triangle wave generated by the circuit shown in section 5.5. The value
    $\gamma$ is set to 0.75 and defines the duty cycle of the rectangular output signal,
    so to speak. If $\gamma$ is a variable, this setup can be used as a simple modulation
    circuit.'
