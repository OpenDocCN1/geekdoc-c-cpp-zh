  md: 'also be noted $s$ is linear. Here are some examples of the application of $s$
    to common functions:


    ```

    $s\{t\} = \{1\}\nss\{t+1\} = \{1\} + 1\nss\{t^n\} = \{nt^{n-1}\}\nss\{\sin(x)\}
    = \{cos(t)\}\nss\{e^t\} = \{e^t\} + 1$ etc.

    ```


    The latter example is particularly interesting as from


    ```

    $s\{e^{\alpha t}\} = 1 + \alpha\{e^{\alpha t}\}$

    ```


    it directly follows that


    ```

    ${e^{\alpha t}\} = \frac{1}{s-\alpha}$  (C.3)

    ```


    which will be useful in the derivation of basic trigonometric functions.


    # C.2 Trigonometric functions


    From EUL’s identity $e^{ix} = \cos(x) + i\sin(x)$


    ```

    $$\sin(x) = \frac{e^{ix}-e^{-ix}}{2i}$ \quad and \quad cos(x) = \frac{e^{ix}+e^{-ix}}{2}$

    ```


    follows yielding


    ```

    ${{\sin(\omega t))} = \frac{1}{2}\{e^{i\omega t}-e^{-i\omega t}\}$

    ```


    Applying (C.3) gets rid of the exponential terms in favor of the differentiation
    operator $s$:


    ```

    ${{\frac{1}{\omega}}\sin(\omega t)) = \frac{1}{2i\omega}(\frac{1}{s-i\omega}-\frac{1}{s+i\omega})
    = \frac{1}{s^2+\omega^2}$  (C.4)

    ```


    Arguing analogously, $cos(\omega t)$ can be similarly represented as


    ```

    ${{\cos(\omega t))} = \frac{1}{2}(\frac{1}{s-i\omega}-\frac{1}{s+i\omega}) = \frac{s}{s^2+\omega^2}$  (C.5)

    ```


    These two functions will suffice for the following example in which an ordinary
    differential equation will be solved by first transforming by means of the operator
    $s$ into an equation that can be treated algebraically and then transforming it
    to get a solution.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# C.3 Example


    The second order ODE


    ```

    $$\frac{d^2x(t)}{dt^2} + \omega^2x(t) = 0, \quad (C.6)$

    ```


    which will be written more compactly and characteristically as $\ddot{x} + \omega^2x
    = 0$, can now be solved as follows.$^{165}$ Thus, $x$ will denote the function
    $\{x(t)\}$ from now on, so that $sx$ can be written more easily instead of the
    clumsier $s$ $\{x(t)\}$ etc.


    Since $sx = \dot{x} + x(0)$ (see (C.2)) it follows that


    ```

    $s^2 = s(\dot{x} + x(0)) + \dot{x}(0).$

    ```


    With $\alpha := x(0)$ and $\beta := \dot{x}(0)$ this yields


    ```

    $s^2x = s(\dot{x} + \alpha) + \beta = s\ddot{x} + s\alpha + \beta = \ddot{x} +
    sa + \beta.$

    ```


    Solving for $\ddot{x}$


    ```

    $$\ddot{x} = s^2x - sa\alpha - \beta.$

    ```


    Together with (C.6)


    ```

    $$\ddot{x} + \omega^2x = s^2x - sa\alpha - \beta + \omega^2x = 0$$

    ```


    and finally


    ```

    $s^2x + \omega^2x = s\alpha + \beta$$

    ```


    is obtained. Solving for $x$ now yields


    ```

    $$$x = \frac{\alpha}{s^2 + \omega^2} + \frac{\beta}{s^2 + \omega^2}}.$

    ```


    Applying (C.4) and (C.5) then yields


    ```

    $$$x = \alpha\cos(\omega t) + \frac{\beta}{\omega}\sin(\omega t)$$

    ```


    as the solution of the differential equation (C.6).


    This example clearly shows the power of the operational calculus. While differential
    equations is still challenging, applying the operational calculus allows to transform
    a differential equation into a "simpler", yet equivalent algebraic equation, which
    can be treated more easily by algebraic means. [MIKUSISKI 1983] contains a wealth
    of practical examples, which are much more impressive than this simple example.


    **165** This equation has already been solved by an analog computer in section
    4.2.'
  merge: -1
