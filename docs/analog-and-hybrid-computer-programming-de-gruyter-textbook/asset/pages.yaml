    # 6.7 Charged particle in a magnetic field


    This example uses an analog computer to simulate the path of a charged particle
    traversing a magnetic field. Basically, a particle with charge $q$ moving in a
    magnetic field $B$ is subjected to a force $\vec{F}_{\text{Lorentz}}$ which is
    perpendicular to both, the magnetic field $B$ and the direction in which the particle
    moves, yielding


    ```

    $\vec{F}_{\text{Lorentz}} = q(\vec{v} \times \vec{B})$

    ```


    $\vec{v}$ denotes the velocity and $\vec{r}$ the position of the particle under
    consideration. Also,


    ```

    $\vec{F}_{\text{particle}} = m\vec{r}$

    ```


    holds. In addition to this, some form of friction exerting a force


    ```

    $\vec{F}_{\text{friction}} = -mu\vec{r}$

    ```


    Combining these three equations finally


    ```

    $m\vec{r} = \vec{F}_{\text{Lorentz}} + \vec{F}_{\text{friction}} = q(\vec{r} \times
    \vec{B}) - \mu\vec{r}. \quad (6.20)

    ```


    > 88 This is based on [Telefunken/Particle], which was probably written by Ms.
    ING BORCHARDT who did the trajectory simulations at DESY for the high-energy particle
    accelerators - initially on an EAI 231RV analog computer and subsequently on a
    Telefunken RA770 hybrid computer.'
