  md: '# 198 7 Hybrid computing


    **types:** Each computing element on the data bus when selected for readout. This
    section contains the mapping between these codes and the actual computing element
    types.

    **manual_potentiometers:** This section allows the definition of manual potentiometers
    which can be read by the hybrid controller. This is useful, if a simulation requires
    user input by means of coefficient potentiometers values are of interest during
    or after an analog computer run.

    **elements:** All elements which are to be read out by the hybrid controller have
    to be defined in this section. Names like INT-0 should be avoided in favour of
    meaningful variable names such as phi-dot or the like.


    A typical hybrid computer program starts like this:


    ```

    use struct;

    use warnings;

    use IO::HyCon;


    my $ac = IO::HyCon->new();n

    ```


