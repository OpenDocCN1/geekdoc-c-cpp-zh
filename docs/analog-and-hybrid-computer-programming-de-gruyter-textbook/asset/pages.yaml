  md: '# B.1 Basic functions


    This section presents the derivation of the LAPLACE transforms for some basic
    functions.


    # B.1.1 Step function


    One of the most basic functions is the *step function*


    ```

    $f(t) = \begin{cases} 0 & t < 0 \ a & t > 0 \end{cases}$$

    ```


    with amplitude $a \in \mathbb{R}^+$. In the case of $a=1$ it is called *unit function*,
    denoted $u(t)$ which is also known as HEAVISIDE *step function* after OLIVER HEAVISIDE.$^{154}$
    Its LAPLACE transform is$^{155}$


    ```

    $$\mathcal{L}(u(t)) = \int_{0}^{\infty} ae^{-st} dt = a \int_{0}^{\infty} e^{-st}
    dt. \quad (B.2)$

    ```


    Substituting $\varphi = -st$ yields $dt = -d\varphi$, (B.2) simplifies to


    ```

    $$\mathcal{L}(u(t)) = -\int_{a}^{0} e^{\varphi} d\varphi = -\frac{a}{s} \left[
    e^{-st} \right]_{0}^{\infty} = \frac{a}{s}$ \quad (B.3)$

    ```


    A variant of the step function is the *delayed unit step function*


    ```

    $u(t-T) = \begin{cases} 0 & t < T \ 1 & t > T \end{cases}$

    ```


    with the following LAPLACE transform


    ```

    $$\mathcal{L}(u(t-T)) = \int_{0}^{\infty} u(t-T)e^{-st} dt = \int_{0}^{T} u(t-T)e^{-st}
    dt + \int_{T}^{\infty} u(t-T)e^{-st} dt = \int_{T}^{\infty} e^{-st} dt = \frac{1}{s}
    \left[ e^{-st} \right]_{T}^{\infty} = \frac{e^{-sT}}{s}$

    ```


    +   **154** See [YAVETZ 1995] for more information on HEAVISIDE''s work.

    **155** Note the lower bound of integration.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# B.1.2 Delta function


    In many cases, the DIRAC delta function$^{156}\delta(t)$ is used as input for
    a dynamic system.$^{157}$ It has zero width but satisfies


    ```

    $$\int_{-\infty}^{\infty} \delta(t) dt = 1$$

    ```


    and is therefore often called the unit impulse. It can be understood as the derivative
    of the unit function $u(t)$. Its LAPLACE transform can then be derived by integrating
    by parts as follows:


    ```

    $$\mathcal{L}(\delta(t)) = \int_{0}^{\infty} \frac{d}{dt}u(t)e^{-st} dt\n=\left[u(t)e^{-st}\right]_{0}^{\infty}
    - \int_{0}^{\infty} u(t)(-se^{-st}) dt\n=0 + s\int_{0}^{\infty} e^{-st} dt$$

    ```


    Substituting $\varphi = -st$ as follows yields $dt = \frac{-1}{s}d\varphi$ so
    that


    ```

    $$\int_{0}^{\infty} e^{-st} dt = -\int_{0}^{\infty} e^{\varphi} d\varphi = \left[e^{-st}\right]_{0}^{\infty}
    = 1.$

    ```


    Thus, $\mathcal{L}(\delta(t)) = 1.$


    # B.1.3 Ramp function


    Another basic function is the $ramp$ function


    ```

    $f(t) = \begin{cases} 0 & t < 0 \ at & t > 0 \end{cases}$$

    ```


    Its LAPLACE transform can be derived as follows, using integration by parts:


    ```

    $$\mathcal{L}(f(t)) = a \int_{0}^{\infty} te^{-st} dt = a \left[\frac{te^{-st}}{s}\right]_{0}^{\infty}
    - \int_{0}^{\infty} \frac{e^{-st}}{s} dt\right) (B.4)$

    ```


    +   **156** Named after PAUL ADRIEN MAURICE DIRAC.


    +   **157** $\delta(t-T)$ typically denotes the delayed delta function.'
