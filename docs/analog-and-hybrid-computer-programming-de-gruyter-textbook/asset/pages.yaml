    with respect to more than one variable. Such problems are frequently found in
    physics, engineering, and other areas and cannot easily be solved directly by
    an analog-electronic analog computer such a machine only allows integration with
    respect to (machine) time.


    The typical way to treat partial differential equations on an analog computer
    is to approximate all differentials which are not with respect to time as differential
    quotients, discretizing the underlying problem. Depending on the required resolution
    this approach will require many computing elements, as can be seen below.$108$


    Figure 6.69 shows a cross section of a hypothetical cable consisting of a center
    conductor of radius $r_c$ surrounded by an insulating material with an outer radius


    108 More general information on this topic can be found in [BRY et al. 1962, pp.
    37 ff.] and [GILLAND 1967, pp. 14-1 ff.] as well as in other standard texts. The
    following example is based on [Telefunk 1963] and [GILOI et al. 1963, pp. 264
    ff.]. A vastly different approach is described in [ALBRECHT 1968] where linear
    partial differential equations are transformed into ordinary differential equations
    by means of a LAPLACE transform (see appendix B).'
