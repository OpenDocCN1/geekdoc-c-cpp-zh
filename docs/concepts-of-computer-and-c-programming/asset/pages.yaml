    # 2.9 ROM


    Read-only memory (ROM), also known as firmware, is an integrated circuit programmed
    with specific data when it is manufactured. ROM chips are used not only in computers,
    but in most other electronic items as well.


    # ROM Types


    There are five basic ROM types:


    +   - ROM

    - PROM

    - EPROM

    - EEPROM

    - Flash memory


    Each type has unique characteristics, but two things in common:


    +   - Data stored in these chips is nonvolatile, it is not lost when power is
    removed.

    - Data stored in these chips is either unchangeable or requires a special operation
    to change (unlike RAM, which can be changed as easily as it is read).

    - This means removing the power source from the chip will not lose any data.


    # PROM


    Creating ROM chips from scratch is time-consuming and very expensive in small
    quantities. For this reason, developers created a type of ROM known as programmable-read
    memory (PROM). Block PROM chips can be bought inexpensively and coded by any special
    tool called a programmer. PROM chips have a grid of columns and rows just as ordinary
    ROMs do. The difference is that every intersection of a column and row in a PROM
    chip has a fuse connecting them. A charge sent through a column will pass the
    fuse in a grounded row indicating a value of 1. Since all the cells have a fuse,
    the initial (blank) state of a PROM is all 1s. To change a cell to 0, you use
    a programmer to send a specific amount of current to the cell. The higher voltage
    breaks the connection between the column and row by burning the fuse. This process
    is known as burning the PROM. PROMs can be programmed once. They are more fragile
    than ROMs. A jolt of static electricity can easily cause fuses in the PROM to
    burn out, changing essential bits from 1 to 0. Blank PROMs are inexpensive and
    great for prototyping the data for a ROM before committing to the costly ROM fabrication
    process.'
