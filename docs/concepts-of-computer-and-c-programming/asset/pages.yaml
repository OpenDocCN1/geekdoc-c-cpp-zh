    # 8.5.4 Reading and Writing Strings


    For read or write strings with the standard input and output streams in C, there
    are several functions, that will help you to deal with string reading or writing.


    gets() and puts()


    The gets() function can be used to read characters from the standard input stream.
    The syntax for the gets() function is :


    ```

    #include <stdio.h>

    ```


    ```

    gets(char *s);

    ```


    Here the characters read from the standard input stream are stored in the character
    array identified by s. The gets() function stops reading, and appends a null character
    \0 to the array, when a newline or end-of-file (EOF) is encountered. The function
    returns s if it concludes successfully. Otherwise, a null pointer is returned.


    The puts() function can be used to write characters to the standard output stream
    (that is, stdout). The syntax for the puts() function is :


    ```

    #include <stdio.h>

    ```


    ```

    puts(const char *s);

    ```


    Here refers to the character array that contains a string. The puts() function
    writes the string to the stdout. If the function is successful, it returns 0.
    Otherwise, a nonzero value is returned. The puts() function appends a newline
    character to replace the null character at the end of a character array.Both the
    gets() and puts() functions require the header file stdio.h.


