    # 3.7 LOCAL AREA NETWORK (LAN)


    A LAN is a group of microcomputers or other workstation devices located in the
    general area and connected by a common cable or wireless. The characteristics
    of LAN''s are:


    +   - Physically limited area < 2Km

    - High bandwidth of data transmission > 1Mhz

    - Inexpensive cable media or wireless infrastructure

    - Data and hardware sharing amongst users

    - Owned by the own or private network

    - Simple operating systems like Windows 2000 server, Unix or Linux.

    - Use of switches, hubs to connect many clients

    - C class IP address schemes


    A LAN is used to share resources amongst a group of individuals or company employees.
    These resources are typically


    +   - Files

    - Printers

    - Modems

    - Application software

    - Computing power

    - Fax machines


    In a local branch of your near bank, there are connected to LAN, and you can operate
    your account form any counter of the bank. In A hotel customer information can
    be shared by all parts like front office, room service, laundry or restaurant
    at once using LANenvironment. In a University campus where departments are located
    on various LAN can be helpful to share all resources and information without moving
    your seat.


    # 3.8 WIDE AREA NETWORK


    A Wide Area Network is similar to a LAN, but geographically spread over a wider
    area. The different segments of the WAN are interconnected by communication links
    Microwave, VSAT or leased lines. In fact, a WAN often comprises a number of interconnected
    LAN''s at'
