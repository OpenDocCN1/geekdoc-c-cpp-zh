    # 2.13 STORAGE AREA NETWORK (SAN)


    In computing, a storage area network (SAN) is a network designed to attach computer
    storage devices such as disk array controllers and tape libraries to servers.
    As of 2007, SANs are most commonly found in enterprise storage. A SAN allows a
    machine to connect to remote tasks such as disks and tape drives on block level
    I/O. From the point of view of the class disks and application software, the devices
    appear as locally attached devices.


    There are two variations of SANs:


    +   1. A network whose essential purpose is the transfer of data between computer
    systems and storage elements. A SAN consists of a communication infrastructure,
    which provides physical connections, and a management layer, which organizes the
    connections, storage elements, and computer systems so that data transfer is secure
    and robust. The term SAN is usually (but not necessarily) identified with block
    I/O services rather than file access.


    +   2. A storage system consisting of storage elements, storage devices, computer
    systems, and/or appliances, plus all control software, communicating over a network.


    # Designing SAN


    Storage networks are distinguished from other forms of network topology by the
    low-level access method that they use. Data traffic on these networks is very
    similar to those used for internal disk drives, ATA and SCSI.


    In a network, a server issues requests for specific blocks, or data segments,
    from specific disk drives. This method is known as block storage. The device acts
    in a simple interface to an internal drive, accessing the specified file, and
    sending the response to the network.In more traditional file storage access methods,
    such as SMB/CIFS or NFS, a server issues a request for an abstract file as a component
    of a larger file system, managed by an intermediary controller. The intermediary
    determines the physical location of the abstract resource, accesses it one of
    its internal drives, and sends the complete file across the network.Most storage
    networks use the SCSI protocol for communication between servers and disk drives,
    which do not use their low-level physical interface. Typical SAN interfaces include
    1Gbit Fibre Channel, 2Gbit Fibre Channel, 4Gbit Fibre Channel, and (in limited
    cases) 1Gbit iSCSI. The SCSI protocol information will be carried over the lower
    level protocol via a mapping layer. For example, most SANs in production today
    use some form of SCSI system, as defined by the FCP mapping standard. iSCSI is
    a similar mapping method designed to carry SCSI information over IP.'
