  md: '# EEPROM


    Though EPOMs are a big step up from PROMs in terms of reusability, they still
    require dedicated equipment and a labor-intensive process to remove and reinstall
    each time a change is necessary. Also, changes cannot be made incrementally to
    EPROM, the whole chip must be erased. **Electrically erasable read-only memory**
    (EEPROM) chips remove the data using electric field.


    In EEPROMs:


    +   - The chip does not have to be rewritten.

    - The chip does not have to be completely erased to change a specific portion
    of it

    - Changing the contents does not require additional dedicated equipment.


    Instead of using UV light, you can return the electrons in the cells of an EEPROM
    to normal with the localized application of an electric field to each cell. This
    erases the cells of the EEPROM, which can then be rewritten. EEPROMs changed 1
    byte at a time, which makes them versatile but slow. In fact,PROM chips are too
    slow to use in many products that make quick changes to the data stored on the
