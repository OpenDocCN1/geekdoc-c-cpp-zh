    # Printers


    Printers are used for producing output on paper. There are a large variety of
    printing devices, which can be classified according to the print quality and the
    printing speeds. There are two main classifications of printers.


    # 1. Impact


    In impact printers, the head mechanism strikes an inked ribbon located between
    the print head and the paper. The general features of impact printers are :


    +   - uses force by applying hammer pins to strike the paper

    - slow speed in characters per second

    - prints on most paper types

    - transparencies cannot be used

    - multiple copies may be printed at once using carbon paper.


    The two main types of impact printers are Dot-Matrix and Daisy-Wheel.


    # Dot-Matrix Printers


    Dot matrix printers are suitable for draft copies and home use, where the quality
    of the finished type is not an issue to like print bills, reports or tickets in
    railway reservation system. Dot matrix printers have tended to become cheap, but
    now are being quickly overtaken by cheap Laserjet and In inkjet printers, which
    offer higher printing speeds and superior quality, as well as good color.


    # Daisy-Wheel Printers


    Daisy printers use a wheel with characters placed at the end of each spoke. A
    print hammer is used to strike the desired character onto the ink ribbon and then
    the paper. The spoke of the wheel is rotated until the desired character is under
    the print hammer, then the print hammer is fired which strikes the character,
    pushing it against the ink ribbon, and onto the paper, creating the character.
    Different fonts are available by the print wheel. Daisy wheels were commonly found
    in typewriters


    # 2. Non-Impact


    With non-impact printers, the print head does not make contact with the paper,
    and no inked ribbon is necessary. The general features of non-impact printers
    are :'
