    # EPROM


    Working with ROMs and PROMs can be a wasteful business. Even though they are inexpensive
    per chip, the cost can add up over time. Erasable programmable read-only memory
    (EPROM) addresses this issue. EPROM chips can be rewritten many times. Erasing
    an EPROM requires a special tool that emits a certain frequency of ultraviolet
    (UV) light. EPROMs are configured using an EPROM programmer that provides voltage
    levels depending on the type of EPROM used.


    Once we have a grid of columns and rows. In an EPROM, the cell at each intersection
    has two transistors. The two transistors are separated from each other by a thin
    oxide layer. One of the transistors is known as the floating gate and the other
    as the control gate. The floating gate''s link is only to the row (wordline) through
    the control gate. As long as this link is in place, the cell has a value of 0
    or 1. To change the value requires a rigorous process called Fowler-Nordheim tunneling.
    Tunneling is used to alter the placement of electrons in the floating gate. An
    electrical charge, usually 10 to 13 volts, is applied to the floating gate. The
    charge from the column (bitline), enters the floating gate and drains to a ground.


    This charge charges the floating-gate transistor to act like an electron. The
    excited electrons are pushed and trapped on the other side of the thin oxide layer,
    giving it a negative charge. These negatively charged electrons act as a barrier
    between the control gate and the floating gate. A device called a cell sensor
    monitors the level of the charge passing through the floating gate. If the flow
    through is greater than 50 percent of the charge, it has a value of 1. When the
    charge passing drops below the 50-percent threshold, the value changes to 0. A
    blank EPROM has all the gates fully open, giving each cell a value of 1.


    To rewrite an EPROM, you must erase it. To erase it, you must supply a level of
    energy enough to break through the negative electrons blocking the floating gate.
    In standard EPROM, this is best accomplished with UV light at a frequency of 253.7.
    Each EPROM chip has a quartz window on top of it. The EPROM must be very close
    to the eraser''s light source, within an inch or two, to work properly. An EPROM
    eraser is not selective, it will erase the entire EPROM. The EPROM must be removed
    from the device it is in and placed under the UV light of the EPROM eraser for
    several minutes. An EPROM that is left too long can become over-erased. In such
    a case, the EPROM''s floating gates are charged to the point that they are unable
    to hold the electrons at all.'
