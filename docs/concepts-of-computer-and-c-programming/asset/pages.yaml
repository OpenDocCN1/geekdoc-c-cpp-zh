  md: "# Appendix 309\n\nAnswer:\nNo\n\nExplanation:\nWhen the declaration,\ntyped\
    \ struct aType;\nis encountered body of struct is not known. This is known as\
    \ ‘incomplete types'.\n\n```\n166. void main()\n{\n    printf(\"sizeof(void *)\
    \ = %d \\\n\", sizeof(void));\n    printf(\"sizeof(int *) = %d \\\n\", sizeof(int));\n\
    \    printf(\"sizeof(double *) = %d \\\n\", sizeof(double));\n    printf(\"sizeof(struct\
    \ unknown *) = %d \\\n\", sizeof(struct unknown));\n```\n\n```\nAnswer:\n    sizeof(void\
    \ *) = 2\n    sizeof(int *) = 2\n    sizeof(double *) = 2\n    sizeof(struct unknown\
    \ *) = 2\n```\n\nExplanation:\nThe pointer to any type is of same size.\n\n```\n\
    167. char inputString[100] = {};\nTo get input from the keyboard which one of\
    \ the following is better?\n1. gets(inputString)\n2. fgets(inputString, sizeof(inputString),\
    \ fp)\n```\n\nAnswer & Explanation:\nThe second one is better because gets(inputString)\
    \ doesn't know the size of the string passed and, if a very big input (here, more\
    \ than 100 chars) the characters will be written past input string. When fgets\
    \ is used with stdin performs the same operation but is safe.\n\n+   168. Which\
    \ version do you prefer of the following two,\n1. printf(\"%$s\".str); // or the\
    \ more curt one\n2. printf(str);\n\nAnswer & Explanation:\nPrefer the first one.\
    \ If the str contains any format characters like %d then it will result in a subtle\
    \ bug.\n\n```\n169. void main()\n{\n    int i=10, j=2;\n    int *ip = &i, *jp\
    \ = &j;\n    int k = *ip/jp;\n```"
  merge: -1
