  md: '# Concept of Computer & ''C'' Programming


    calculations. For example, to calculate the circumference and area of a circle
    with a known radius, you can write:


    ```

    circumference = 3.14159 * (2 * radius);

    area = 3.14159 * (radius)*(radius);

    ```


    If, however, define a symbolic constant with the name PI and the value 3.141,
    you could write


    ```

    circumference = PI * (2 * radius);

    area = PI * (radius)*(radius);

    ```


    The resulting code is clearer. Rather than puzzling over what the value 3.141
    is for, you can see immediately that the constant PI is being used.


    The second advantage of symbolic constants becomes apparent when you need to change
    a constant. Continuing with the preceding example, your program needs to use a
    value of PI with more decimal places than 3.141. If you had used literals for
    PI, you would have to go through your source code and change each occurrence of
    the value from 3.141 to 3.14159. With a symbolic constant, you need to make a
    change only in where the constant is defined.


    C has two methods for defining a symbolic constant: the #define directive and
    the const keyword. The #define directive is one of C''s preprocessor directives,
    and it will be discussed in future. The #define directive is used as follows:


    ```

    #define CONSTNAME literal

    #define PI 3.14159

    #define NO 0

    #define RED 3

    ```


    Note that #define lines don''t end with a semicolon (;). #defines can be placed
    anywhere in your source code, most commonly, as a programmer you should use all
    #defines together, near the beginning of the file and before the start of main().


    # Defining Constants with the Const Keyword


    The second way to define a symbolic constant is with the const keyword. const
    is a modifier that can be applied to any variable declaration. A variable declared
    to be const can''t be modified during program execution only initialized at the
    time of declaration. Here are some examples:


    ```

    const int count = 100;

    const float pi = 3.14159;

    const long debt = 120000000, float tax_rate = 0.21;

    ```'
