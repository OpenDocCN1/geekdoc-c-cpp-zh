  md: '# 8.5.1 Declaring Strings


    You can declare a string in a C program, using an array of characters like:


    ```

    char array_ch[7];

    char name[15];

    char address[30];

    ```


    A series of characters enclosed in double quotes """ is called a string constant.
    The C compiler can automatically add a null character (\0) at the end of a string
    constant to indicate the end of the string.


    # 8.5.2 Initializing Strings


    A character array can be declared, and initialized like this:


    ```

    char mystr[7] = {''H'', ''e'', ''y'', ''t'', ''o'', ''r'', ''\0''};

    ```


    Here array mystr is treated as a character array. However, if you add a null character
    (\0) into the array, you have the following statement:


    ```

    char mystr[7] = {''H'', ''e'', ''l'', ''l'', ''o'', ''\0''};

    ```


    Here array mystr is expanded to hold seven elements; the last element contains
    a null character. The character array mystr is considered a string because of
    the null character that is appended to the array. You can also initialize a character
    array with a string constant, the following statement initializes a character
    array, yourstr, with a string constant, "Hello":


    ```

    char yourstr[7] = "Hello";

    ```


    The compiler will automatically append a null character (\0) to the end of the
    array, and treat the character array as a character string. Note that the size
    of the array is specified to hold up to seven elements, although the string has
    only six characters enclosed in double quotes. The extra space is reserved for
    the null character that the compiler will add.


    # 8.5.3 String Constants Versus Character Constants


    As you know, a string constant is a series of characters enclosed in double quotes
    ("). On the other hand, a character constant is a character enclosed in single
    quotes (''''). When a character variable ch and a character array str are initialized
    with the same character x as the following:


    ```

    char ch = ''x'';

    ```


    ```

    char str[] = "x";

    ```


    1 byte is reserved for the character variable ch, and two bytes are allocated
    for the character array str. The reason that an extra byte is needed for str is
    that the compiler has to append a null character to the array.'
