  md: "# 310 Concept of Computer & 'C' Programming\n\n```\nprintf(\"%d\",k);\n}\n\
    ```\n\nAnswer:\nCompiler Error: \"Unexpected end of file in comment started in\
    \ line 5\".\n\nExplanation:\nThe programmer intended to divide two integers, but\
    \ by the \"maximum munch\" rule, the compiler treats the operator sequence / and\
    \ * as /* to be the starting of comment. To force what is intended by the programmer,\n\
    \n```\nint k = */ip/ *jp;\n// give space explicity separating / and *\n// or\n\
    int k = *ip/(jp);\n// put braces to force the intention\nwill solve the problem.\n\
    ```\n\n```\n170. void main()\n{\n  char ch;\n  for(ch=0;ch<=127;ch++)\n    printf(\"\
    %c %d \\n\", ch, ch);\n  }\n```\n\nAnswer:\nImplementaia dependent\nThe char type\
    \ may be signed or unsigned by default. If it is signed then ch++ is executed\
    \ after ch reaches 127 and rotates back to -128. Thus ch is always smaller than\
    \ 127.\n\n```\n171. Is this code legal?\nint *ptr;\nptr = (int *) 0x400;\n```\n\
    \nAnswer:\nYes\nExplanation:\nThe pointer ptr will point at the integer in the\
    \ memory location 0x400.\n\n```\n172. main()\n{\n  char a[4]=\"HELLO\"\n  printf(\"\
    %s\",a);\n}\n```\n\nAnswer:\nCompiler error: Too many initializers"
  merge: -1
  pgno: 323
