    # TELNET


    The Telnet (telecommunications network) program is intended to provide a remote
    login or virtual terminal capability across a network. In other words, a user
    on machine should be able to log into machine anywhere on the network, and as
    far as the user is concerned, it appears that the user is seated in front of that
    machine. The Telnet service is provided through TCP''s port number 23. In your
    campus if you have your Windows terminal in one lab your Unix or Linux server
    at another location using telnet you can connect with your server client machine.


    Telnet was developed because at time the only method of enabling one machine to
    access another machine''s resources was like drives and programs stored there
    was to establish a link using communications devices such as modems or networks
    into dedicated serial ports or network adapters.


    Usually, Telnet involves a process on the server that accepts requests for a Telnet
    session. On UNIX systems, this process is called telnet. On Windows NT and PC-based
    operating systems, a Telnet Server program is usually involved. The client (the
    end doing the calling) runs a program, usually called telnet, that attempts the
    connection to the server.


    The Telnet protocol uses the concept of a network virtual terminal, or NVT, to
    define both ends of a Telnet connection. Each of the end of the connection (NVT)
    has a logical keyboard and printer. The logical printer can display characters,
    and the logical keyboard can generate characters. The logical printer is usually
    a terminal screen, whereas the logical keyboard is usually the user''s keyboard,
    although it could be a file or output stream.


    # How to start telnet?


    To start telnet, you must provide either the name or the IP address of the machine
    to be connected. The name can be used only if the system has a means of resolving
    the name into its IP address, such as with the Domain Name System. A port name
    can usually be used to connect to a specific service, but this is used infrequently.
    For example, to connect to a machine with the IP address 192.168.0.40, you would
    enter this command:


    ```

    telnet 192.168.0.40

    ```


    If the server has the name amcasmer, which was resolvable into its IP address,
    you could issue this command:


    ```

    telnet amcasmer

    ```'
