  md: '# Structure of ‘C’ 97


    The 200 and the 10.28 are literal constants. The preceding statements store these
    values in the variables count and tax_rate. Note that one of these constants contains
    a decimal point, whereas the other does not. The presence or absence of the decimal
    point distinguishes floating-point constants from integer constants.


    A literal constant with a decimal point is a floating-point constant and is represented
    by the C compiler as a double-precision number. Floating-point constants can be
    written in standard decimal notation, as shown in these examples:


    123.456


    0.019


    The decimal point causes the C compiler to treat the constant as a double-precision
    value. Without the decimal point, it is treated as an integer constant. Floating-point
    constants can be written in scientific notation. Scientific notation is particularly
    useful for representing extremely large and extremely small values. In C, scientific
    notation is written as a decimal number followed by an E or e and the exponent:


    1.23E2 means 123 with 2 powers of 10, or 4.086e-68


    A constant without a decimal point is represented by the compiler as an integer.
    Integer constants can be written in three different notations:


    A constant starting with any digit other than 0 is interpreted as a decimal. Decimal
    constants can contain the digits 0 through 9 and a leading minus or plus. Without
    a leading minus or plus, a constant is assumed to be positive.


    ```

    int MAXMARKS = 100;

    ```


    A constant starting with the digit 0 is interpreted as an octal (the base-8 number
    system). Octal constants can contain the digits 0 through 7 and a leading minus
    or plus.


    ```

    int m=045;

    ```


    A constant starting with 0x or 0X is interpreted as a hexadecimal (the base-16
    number system). Hexadecimal constants can contain the digits 0 through 9, the
    letters A through F, and a leading minus or plus.


    ```

    short xt = 0xFFFF;

    ```


    # Symbolic Constants


    A symbolic constant is a constant that is represented by a name or symbol in your
    program. Like a literal constant, a symbolic constant can''t change. Whenever
    you need the constant''s value in your program, use its name as you variable name.
    The actual value of the symbolic constant needs to be entered only once, when
    it is first defined.


    Symbolic constants have two significant advantages over literal constants, as
    the following example shows. Suppose that you''re writing a program that performs
    a variety of geometrical calculations. The program frequently needs the value
    of PI that is 3.14159 for its'
