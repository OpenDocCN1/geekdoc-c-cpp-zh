    two systems. When that was, the login prompt was displayed (as on any UNIX terminal),
    by a password request. If the login and password are enabled, the UNIX shell prompt
    (a dollar sign) is shown to indicate that the remote system is now active.


    Once the connection is successfully established, your session behaves as though
    you were on the remote, with all valid commands of that operating system. All
    instructions are relative to the server, so a directory command shows the current
    directory on the server, not the client. To see the client''s directory, you would
    have to enter command mode. After learning Unix commands like ls, pwd you can
    try in your lab.


    # FTP


    File Transfer Protocol, usually called FTP, is a utility for managing files across
    machines without having to establish a remote session with Telnet. FTP enables
    you to transfer files back and forth, manage directories, and access electronic
    mail. The term uploading and downloading are associated with FTP.


    FTP uses two TCP channels. ''TCP'' port 20 is the data channel, and port 21 is
    the command channel. FTP is different from most TCP/IP application programs in
    that it does use channels, enabling simultaneous transfer of FTP commands and
    data. In FTP particular, the channels that exist between the two machines are
    the protocol interpreter, PI, and the data transfer process, or DTP. The PI instructions
    between the two implementations using TCP command channel 21, and the DTP transfers
    data on TCP channel 20.


    FTP is similar to Telnet in that it uses a server program that runs continuously
    and a separate program is executed on the client. On Unix systems, these programs
    are named ftppd and ftp, (similar to telnetd and telnet).


