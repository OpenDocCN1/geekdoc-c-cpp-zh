  md: '# 8 Concept of Computer & ''C'' Programming


    We have lots of special-purpose processors in our lives. An MP3 Player is a specialized
    computer for processing MP3 files. It can''t do anything else. A GPS is a specialized
    computer for handling GPS signals. A Game boy is a specialized computer for handling
    games, but it can''t do anything else. A PC can do anything else because it is
    general-purpose.


    A PC is a general purpose tool built around a microprocessor. It has lots of different
    parts like memory, a hard disk, a modem, etc., that work together. “General purpose”
    means that you can do many different things with a PC. You can use it to do documents,
    e-mail, browse the Web and play games.


    # 1.5.2 Main Components of Desktop Computer


    Central processing unit (CPU). The microprocessor “brain” of the computer is called
    the central processing unit. Everything that a computer does is overseen by the
    CPU.


    **Memory.** It is very fast storage used to hold data. It has to be fast because
    it connects directly to the microprocessor. There are several types of memory
    like RAM, ROM in a computer:


    **Random-access memory (RAM).** Used to temporarily store information that the
    computer is currently working with.


    **Read-only memory (ROM).** A permanent type of memory storage used by the computer
    for important data that do not change.


    **Basic input/output system (BIOS).** A type of ROM that is used by the computer
    to establish basic communication when the computer is first turned on.


    **Caching.** The storing of frequently used data in extremely fast RAM that connects
    directly to the CPU.


    **Virtual memory.** Space on a hard disk used to temporarily store data and swap
    it in and out of RAM as needed.


    **Motherboard.** This is the main circuit board that all of the internal components
    connect to. The CPU and memory are usually on the motherboard. Other systems may
    be found directly on the motherboard or connected through a secondary connection.
    For example, a sound card can be built into the motherboard or connected through
    PCI.


    **Power supply.** An electrical transformer regulates the electricity used by
    the computer.


    **Hard disk.** This is large-capacity permanent storage used to hold information
    such as programs and documents.


    **Operating system.** This is the basic software that allows the user to interface
    with the computer.


    **Integrated Drive Electronics (IDE) Controller.** This is the primary interface
    for the hard drive, CD-ROM and floppy disk.


    **Peripheral Component Interconnect (PCI) Bus.** The most common way to connect
    additional components to the computer, PCI uses a series of slots on the motherboard
    that PCI cards plug into.


    **SCSI.** Pronounced “scuzzy,” the small computer system interface is a method
    of adding additional devices, such as hard drives or scanners, to the computer.'
