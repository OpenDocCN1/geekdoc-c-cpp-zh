    #  1.6.2 Reliability


    Computer is an electronic device built with integrated circuits that are more
    reliable. They have a low failure rate. Computers are most suitable to handle
    repetitive tasks because they do not take breaks and feel leaves you, they never
    complain. For example, the automatic teller machines (ATM) are in operation 24
    hours a day, 7 days a week, all the 365 days of the year.


    #  1.6.3 Accuracy


    Computers can generate accurate results, provided that the input data is correct
    and the program of instructions is reliable. They are not affected by emotion
    and what they are programmed to do. Hence, they can produce consistent and accurate
    result like marks of your university exams. If inaccurate data is entered, the
    computer will generate incorrect results. This is known as "Garbage In Garbage
    Out " (GIGO) but you can make it "Good In Good Out".


    #  1.6.4 Storage


    Imagine, if you can, how many filing-cabinet drawers would be required to hold
    the thousands of student records by your school. It would take a lot of space
    to store data and information in paper form. However, computers can store on several
    disks that take less space than the boxes. A diskette of 1.44 MB capacity can
    store 300 pieces of composition of 500 words each. You can store 3 hours movie
    in a single DVD.


    #  1.7 HISTORY OF COMPUTERS


    #  1.7.1 Abacus (about 200 B.C.)


    The abacus was a mechanical aid for counting. Addition, subtraction, division
    and multiplication can be performed on a standard abacus. The frame of the abacus
    has a series of vertical rods on which a number of wooden beads are allowed to
    slide freely. A horizontal beam separates the frame into two sections, known as
    the upper deck and lower deck.'
