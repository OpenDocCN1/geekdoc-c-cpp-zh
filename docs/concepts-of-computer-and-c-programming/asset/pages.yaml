  md: '# Introduction to Computer 13


    Vacuum tubes, however, are large, require a lot of power, and produce a lot of
    waste heat. In fact, for one rather large vacuum tube machine, it was once estimated
    that if its four turbine-powered air conditioners were to fail, the heat buildup
    in 15 minutes would be sufficient to melt the concrete and steel building containing.
    It has also been estimated that if a modern computer were built with vacuum tubes,
    it would be the size of the Empire State Building.


    # 1.8.2 Second Generation (1959–1964)


    The transistor, invented in 1948, performed the same basic function as the vacuum
    tube, but with much lower voltage and very little heat. By using a material called
    a semiconductor, which conducts electricity when a charge is applied to it and
    acts as an insulator when the charge is removed, an electronic switch can be built.
    Computers of this era mostly used core memory, registers were built from transistor
    circuits—eventually leading to modern solid-state memories.


    Still, a computer equivalent to a modern day microprocessor, with transistors,
    would have occupied several floors of the Empire State Building. A typical machine
    of the period had 16-32-bit words of code, and filled a large area.


    The TX-0 was the first computer with transistors. The PDP-1 was an 18-bit machine
    that resulted in a family of machines which culminated in the PDP-15. You can
    see a PDP-1, still playing Space War (the first video game), at the Computer Museum
    in Boston. IBM was also building a small machine for business, the 1401, which
    used B arithmetic (base 10, represented by 4-bit words) where operations were
    carried out digit-serially on words of arbitrary length. This same sort of scheme
    would later become the basis of most pocket calculators.


    # 1.8.3 Third Generation (1965–1970)


    The concept behind the third generation of computers was integrated circuit (IC),
    an IC can be formed by crossing two semiconductor materials on a silicon substrate.
    The important point about the integrated circuit is that multiple transistors
    can be formed on a single substrate. Thus, a logic circuit that occupied a whole
    PC board could be reduced to a single chip of silicon. In ICs transistors can
    be connected directly on the chip, they can be smaller and need less power to
    communicate, and generate less heat. The IC revolutionary design in was by shrinking
    the size of computers, and by making the memory technology compatible with the
    processing technology.


    The "successor" to the PDP-8 and PDP-15 was the PDP-11, a 16-bit machine that
    could directly access 64KB and indirectly up to 256KB. The successor to the PDP-11
    and PDP-10 was the VAX (Virtual Architecture Extension), a 32-bit machine drawing
    on the experience of both families.


    # 1.8.4 Fourth Generation (1971–present year)


    Very Large Scale Integration (VLSI) was the next step beyond IC, to build thousands
    of transistors on a chip and to develop a new chip named microprocessor that lead
    to'
