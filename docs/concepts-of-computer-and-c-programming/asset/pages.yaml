    # ### Keyboards


    The keyboard is one of the most common input devices for computers. The layout
    of the keyboard is like that of the traditional QWERTY typewriter, there are some
    extra commands and function keys used to perform various user given commands.
    The keyboard provides facility to input data and commands to computer in text
