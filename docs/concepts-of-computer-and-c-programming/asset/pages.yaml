    # APPLICATION OF COMPUTERS IN YOUR LIFE


    ![](img/63ac3e6bb77b9cea9c399e89fe4fe380_16_0.png)


    Fig. 1.2 Application of computers


    Even if you never touch a computer, computer technology still has an impact on
    your life. For example, your student record is kept on a computer, your bank statement
    is printed by a computer, the special effects in movies and TV commercials are
    produced by computers, and so on. We can say that computers have various impacts
    in society:


    +   1. Ordinary Arithmetic Operations.

    2. Logical Operations like comparing two items.

    3. Special type of arithmetic operations like addition of two very large integers
    (achieved through Special Application Programs).

    4. Manipulating floating point numbers.

    5. Sorting of Data like preparation of merit list.

    6. Manipulating Pictures & Graphics.

    7. Multimedia ( Audio, Video, Graphics, Video Games etc.) Manipulations.

    8. Computers are extensively used in dance, photography, arts and culture. The
    fluid movement of dance can be shown live via animation. Computers can be digitized
    using computers.

    9. Business (Nowadays, computers are totally integrated into business. The main
    objective of business is transaction processing, which involves transactions with
    suppliers, employees or customers. Computers can make these transactions easy
    and accurate. People can analyze investments, sales, expenses, markets and other
    aspects of business using computers.


    # 1.4.1 Computers in Education


    The capability of interacting with learners using multimedia makes computers a
    powerful tool for enhancing the process of learning. In addition, computers also
    play an important role in searching information and school or college administration.
    Some of good use of computers in education :'
  merge: -1
