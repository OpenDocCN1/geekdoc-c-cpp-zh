  md: '# Introduction to Computer 7


    # Computer modeling


    Computer modeling is the use of computers to create abstract models of real life
    objects, organisms, situations, or systems. A computer model is not static, you
    can feed data in and examine how it behaves under certain conditions.


    # Computer simulation


    A computer simulation refers to the use of computers to execute a model. It is
    represented by a computer program that gives information about the object, situation
    or system being examined. It is much cheaper to use a simulator to train pilots
    rather than using the real planes and ships.


    # 1.4.9 Computers in Weather Forecasting


    A weather observatory collects a lot of weather data from satellites, weather
    balloons, airplanes in flight, ground weather stations and overseas reports. It
    is impossible for the scientists to ever to process and analyze them manually.
    Hence, high-speed computers play a significant role. They can process the gathered
    data and easily give the next few days'' weather forecasts. A supercomputer takes
    less than one hour to produce a 24-hour forecast using 20 km by 20 km grid high-resolution
    numerical weather prediction model. A normal PC will take more than 5 months to
    perform the same calculation.


    # 1.5 PERSONAL COMPUTER AND CHARACTERISTICS OF COMPUTER SYSTEM


    As a student of Information Technology (IT) when you mention the word "technology,"
    most people think about computers. Virtually everywhere around you, you will find
    some computerized component. The appliances in our homes have microprocessors
    built into them, as do your televisions, washing machine etc. Even modern cars
    have a computer. But the computer that everyone thinks of is typically the personal
    computer, or PC.


    # 1.5.1 Defining a PC


    A PC is a general-purpose information processing device. It can take information
    from a person (through the keyboard and mouse), from a device (like a floppy disk
    or CD) or from the network (through a modem or a network card) and process it.
    Once processed, the information is shown to the user (on the monitor), stored
    on a device (like a hard disk) or sent somewhere else on the network (back through
    the modem or network card).


    ![](img/63ac3e6bb77b9cea9c399e89fe4fe380_20_0.png)


    Fig. 1.3 A PC'
