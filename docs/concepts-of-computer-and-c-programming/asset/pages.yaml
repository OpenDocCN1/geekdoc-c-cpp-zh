  md: '# 2.12 RADIO FREQUENCY IDENTIFICATION (RFID)


    Radio Frequency Identification (RFID) is an automatic identification method, relying
    on storing and remotely retrieving data using devices called RFID tags or transponders.
    RFID tag is an object that can be attached to or incorporated into a product,
    animal, or person for the purpose of identification using radio waves. Chip-based
    RFID tags contain silicon chips and antennas. Passive tags require no internal
    power.


    # Types of RFID Tags


    RFID cards are also known as "proximity," "proxy" or "contactless cards" and come
    in three varieties: passive, semi-passive (also known as semi-active), or active.


    # Passive


    Passive RFID tags have no internal power. The minute electric current induced
    by the antenna by the incoming radio frequency signal provides enough power for
    the CMOS integrated circuit in the tag to power up and transmit a response. Most
    passive tags work by backscattering the carrier signal from the reader. This means
    that the antenna is designed to collect power from the incoming signal and also
    transmit to the outbound backscatter signal. The response of a passive RFID tag
    is not necessarily just an ID number; the chip can contain non-volatile EEPROM
    for storing data. The lack of an onboard power supply means the device can be
    quite small: commercially available products exist that can be embedded in a sticker,
    or under the skin in the case of low frequency RFID tags.


    # Active


    Unlike passive RFID tags, active RFID tags have their own internal power source
    which is used to power any ICs that generate the outgoing signal. Active tags
    are much more reliable (fewer errors) than passive tags due to the ability active
    tags to conduct a "session" with a reader. Active tags, due to their onboard power
    supply, also transmit at higher power levels than passive tags, allowing them
    to be more effective in "RF challenged" environments like water (including humans/cattle,
    which are mostly water), metal (shipping containers, vehicles), or at longer distances.
    Active tags have practical ranges of hundreds of meters, and a battery life of
    up to 10 years. Active RFID tags include sensors such as temperature logging which
    have been used in concrete monitoring or to monitor perishable goods. Other sensors
    that have been married with RFID humidity, shock/vibration, light, radiation,
    temperature and atmospheres can last much longer (approximately 300 feet) and
    larger memories than passive tags, as well as the ability to store additional
    information by the transceiver. The United States Department of Defense has successfully
    used active tags to reduce logistics costs and improve supply chain visibility
    for more than 15 years. At present, the smallest active tags are about the size
    of a coin and sell for a few dollars.'
