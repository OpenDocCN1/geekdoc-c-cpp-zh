  md: '# Computers in banks (ATM)


    An ATM is a terminal specially designed for self-service banking. A typical ATM
    has the following input and output devices. It provides routine banking services
    24 hours a day, 7 days a week. It helps banks save human resources, hence reducing
    their labor cost. ATM machine can be used to :


    +   - withdraw cash.

    - transfer money from one account to another.

    - pay bills.

    - check account balances.

    - request cheque books and bank statements.

    - change personal identification number.


    # Computers for Internet banking


    Internet banking is a latest facility for customers, if you have internet connection
    and internet banking account in SBI, PNB, HDDFC or ICICI bank, you can :


    +   - transfer money from one account to another.

    - pay bills for school, telephone, electricity on line.

    - check account balances and transaction history.

    - access previous account statements.

    - request cheque books.

    - initiate stop payment requests.

    - change personal identification number.

    - trade stocks, view major indices and get stock quotes.

    - view currency exchange and interest rates.

    - place fixed-time deposits and change maturity instructions.

    - apply for credit cards and various types of loans.


    # 1.4.5 Computers in Supermarket


    # UPC & POS


    UPC (Universal Product Code) is a system for uniquely identifying different products.
    Each product has its own unique code on its label represented by a pattern of
    light and dark bars. It is commonly known as Bar code.


    POS (Point of Sale) It is a special-function terminal. In retail stores, it is
    a combination of an electronic cash register and a bar code scanner or reader.


