  md: '# 210 Concept of Computer & ''C'' Programming


    If you want to be a system programmer or you want to write system programs using
    C, knowledge of pointers is must for you. If you have good command on pointers,
    C will become most powerful language for you.


    # 11.2 POINTERS


    A pointer is a variable which is used to point to another variable. In simple
    word " A pointer is a variable which can store address of another variable ”.
    From these definitions, you can say that a pointer is a variable and the value
    contained by a pointer must be an address that indicates the location of another
    variable in the memory. That is why a pointer is also known as an address variable.
    Following example will simplify the definition for you.


    # Example 11.1


    ```

    int x = 500;

    ```


    You have declared a variable x in your program and you have assigned the value
    500 to it. When you compile the variable x will get its location in memory. An
    address will also assigned to x in memory. Who will decide this address, do not
    worry it will be managed by compiler with the of operating system.


    | Variable name | Value | Memory Location |

    | x | 500 | 1004 |


    So the address to x is 1004 (assumed ). You can print the value of x directly,
    to hold the address of x you need a pointer variable. You can think it is easy
    to get and print a value of variable in a C program why I should use pointers.
    The answer is, suppose you have a text file on hard disk and your task is to write
    a program to display contents of file. Can you do it directly certainly not, you
    need pointers to point first byte of your file, which is on hard disk. Same is
    true to play a song with CD or play a movie with DVD. You always needs pointers
    to point the locations of your file, audio file or video file.


    # 11.3 DECLARING POINTERS


    A pointer is a numeric variable and it always store integer values. Like all variables
    you should declare a pointer variable before use. Pointer variable names follow
    the same rules as other variables and must be unique. Syntax for a pointer declaration
    is:


    ```

    datatype *pointer;

    int *myptr;

    float *ptr1;

    char *ptr2;

    ```


    datatype is any of C''s variable type and indicates the type of the variable that
    the pointer points in future. The symbol (*) is must before the name of pointer
    variable.


    > Tips : The asterisk (*) is known as the indication operator or the dereference
    operator.'
