  md: "# Appendix 311\n\nExplanation:\n\nThe array a is of size 4 but the string constant\
    \ requires 6 bytes to get stored.\n\n```\n173. main()\n{\n    char a[4]=\"HELL\"\
    ;\n    printf(\"%s\",a);\n\n```\n\nAnswer:\nHELL%@!@@@??@~!\n\nExplanation:\n\
    The character array has memory just enough to hold the string \"HELL\" and doesnt\
    \ enough space to store the terminating null character. So it prints the HELL\
    \ correctly and continues to print garbage values till it accidentally comes across\
    \ a NULL character.\n\n```\n174. main()\n{\n    int a=10,*j;\n    void *k;\n \
    \   j=k=&a;\n    j++;\n    k++;\n    printf(\"\\n %u %u \",j,k);\n```\n\nAnswer:\n\
    Compiler error: Cannot increment a void pointer\n\nExplanation:\nVoid pointers\
    \ are generic pointers and they can be used only when the type is not known and\
    \ as an intermediate address storage type. No pointer arithmetic can be done on\
    \ it and you cannot apply indirection operator (*) on void pointers."
