  md: '# PREFACE


    This book ''Concept of Computer & ''C'' Programming'' contains some special features
    to aid you on your path to learn about fundamental concepts of computer and later
    programming with C in easy way. Each chapter provides concrete examples and explanation
    of concepts. You will get knowledge of new concepts by Grid computers, Storage
    area network, Bluetooth etc., in this book. Numerous sample programs illustrate
    C''s features and code, so that you can apply them in your computer lab with ease.
    Each chapter ends with section containing common questions relating to the chapter
    and old year questions asked in university exams. It contains objective questions
    that will help you to prepare for aptitude tests conducted by various organizations
    at the time of recruitment. You won''t learn Computer Fundamentals and C by just
    reading this book, however. If you want to be a good programmer, you''ve got to
    write programs in lab sessions. Exercises for that. We recommend that you attempt
    each exercise. Writing C is the best way to learn C. Some advanced features of
    this book interact with hardware, assembly programming in C and small Virus programs
    are key features that lead you to be a system programmer using C. Unlike other
    C books, this book offers many sample programs and exercises with clear explanations
    and answers, which will make the concepts of C language easier to be understood.
    After reading this book, you''ll be able to write programs on your own.


    # STRUCTURE OF THE BOOK


    **Chapter 1** introduces you to your computer, its parts, different generation
    of computers, about programming languages and the software hardware of computers.


    **Chapter 2** is a basic introduction about computer organization. You will learn
    about input, output and other devices like memory, disk, CDROM.


    **Chapter 3** will start your journey toward operating system and its use with
    application and how to know of MSDOS, WINDOWS, which help you get get knowledge
    of these operating systems. Introduction to internet and basic terms of internet
    will help you to be part of global software industry.


    **Chapter 4** will start your journey toward programming, you will learn about
    algorithms and flow charts that are basics before writing actual code.


    **Chapter 5** demonstrates the entire procedure of writing, compiling, linking,
    and running a C program as well several important concepts, such as constants,
    variables, expressions, and statements. Four data types, char, int, float, and
    double, are introduced in detail. Also, the rules of naming a variable are explained.
    You will learn how to receive input from the keyboard, and print output on the
    screen you will learn also with the help of a set of C functions, such as get(),
    getchar(), put(), putchar(), and printf().


    **Chapter 6** emphasizes operators and control-flow statements like if in C. In
    this chapter you will use arithmetic, assignment operators, the unary operator,
    increment/decrement operators,'
