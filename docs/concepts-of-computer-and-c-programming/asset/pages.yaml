    # ## 3.1 COMPUTER SYSTEM


    A computer system can be defined as a collection of Hardware, Operating systems,
    Application software and Users.


    **Hardware.** Basic physical parts of a computer system like Monitor, Keyboard,
    Hard disk, CPU, memory etc.


    **Operating systems.** To operate or control a computer like Unix, Windows, Linux
    etc. **Application software.** Used to use system resources to perform some task
    or to solve the computing problems of the users like Word processors, compilers,
    web browsers, database systems, games etc.


    **Users.** That uses the computer system like People, other machines and other
    computers on network or Internet.


    ![](img/63ac3e6bb77b9cea9c399e89fe4fe380_58_0.png)


    Fig. 3.1 Computer System'
