    # 3.9 NETWORK PROTOCOLS


    This section describes the protocols used in different network topologys. Remember
    that a protocol defines the rules for sending data from one point to another.


    **Carrier Multiple Access with Collision Detection (CSMA/CD)**


    This protocol is commonly used in bus (Ethernet) implementations. Multiple access
    refers to the fact that in bus systems, each station has access to the common
    cable. Carrier sense to the fact that each station listens to see if no other
    station is transmitting before sending data. Collision detection refers to the
    principle of listening to see if other stations are transmitting while we are
    contending.


    In bus systems, all stations have access to the common medium. It is there possible
    that a station may already be transmitting when another station wants to transmit.
    Rule 1 is that a station must listen to determine if another station is transmitting
    initiating a transmission. If the network is busy, then the station must back
    off and wait a random interval before trying again.


    Rule2 is that a station which is transmitting monitor the network to see if another
    station has begun transmission. This is a collision, and if it occurs, both stations
    must back off and after a random time interval. It takes a time for signals to
    travel down the cable, it is possible for more than one station to the network
    is free and both grab it at the same time.


    CSMA/CD models what happens in the real world. People involved in group conversation
    tend to obey the same behavior.


    # Token Ring


    This protocol is widely used in ring networks for controlling station access to
    the ring. A short message (a token) is circulated around the ring, being passed
    from station to station (it originates from a controller or master station which
    inserts it onto the ring).


    A station which wants to transmit waits for the token to arrive. When it arrives,
    it changes from a token to a connector message, and appends its message on the
    end. This is then placed on the outgoing side of the ring.


    Each station passes on received tokens if they have nothing to transmit. They
    monitor connector messages to see if the message is addressed to them. If connector
    messages are'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# 62 Concept of Computer & ''C'' Programming


    addressed to them, they copy the message, modify it to signify its receipt, then
    send it around the ring. Connector messages which are not addressed to them are
    passed directly onto the next station in the ring.


    When the connector travels full circle and arrives at the original sending station,
    it checks the message to see if it has been received. It then discards the message
    and replaces it with a token.


    # Token Bus


    is a popular standard for the token passing LANs. In a token bus, the physical
    media is a bus or a logical ring is created using coaxial cable. The token is
    passed from one user to another in sequence (clockwise or anticlockwise). Each
    station knows the address of the station to “left” and “right” as per sequence
    in the logical ring. A station can only transmit data when it has the token. The
    working of token bus is somewhat similar to Token Ring


    # TCP/IP


    TCP/IP is a software-based communications protocol used in networking. Although
    the name TCP/IP implies that it is a product of combination of two protocols :


    +   1. Transmission Control Protocol

    2. Internet Protocol


    The term TCP/IP refers to a single entity combining protocols, but a larger set
    of software programs that provide network services such as remote logins, remote
    file transfers, and electronic media. TCP/IP provides a method for transferring
    information from one machine to another. A communications protocol should handle
    errors in transmission, managing the routing and delivery of data, and control
    the actual transmission by the use of predetermined status codes. TCP/IP accomplishes
    all of this.


    The architecture of TCP/IP is often called the Internet architecture because TCP/IP
    and the Internet are very close. TCP/IP is the “language” of the Internet. It
    is a networking technology developed by the United States Defense Advanced Research
    Project Agency (DARPA) in the 1970s. It is most commonly used to access the Internet.


    # 3.10 INTERNET


    The Internet you are watching today, its origin is the US Defense Department project
    in 1969. The subject of the project was wartime communications. At that time the
    telephone system was the only communications system in use. A major problem had
    been identified in its design like dependence on switching stations could be targeted
    during an attack. Only voice could be transmitted through, there was no way to
    send text data electronically. The Defense Advanced Research Projects Agency (DARPA)
    launched the DARPA Internet Program to design a computer based digital communication
    system. In 1975, DARPA declared the project as a success and handed management
    over to the Defense Communications Agency. Several of today’s internet protocols
    like TCP or IP were stable by 1980, and throughout ARPANET by 1983. In August
    1983, there were 562 registered ARPANET hosts.'
