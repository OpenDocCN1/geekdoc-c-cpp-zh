  md: '# Concept of Computer & ''C'' Programming


    # 3.2 OPERATING SYSTEMS


    An operating system is an essential component of a computer system. The primary
    objective of an operating system is to make computer system convenient to use
    and utilize computer hardware in an efficient manner. An operating system works
    as a mediator or interface between user and computer.


    ![](img/63ac3e6bb77b9cea9c399e89fe4fe380_59_0.png)


    An operating system can be imagine as a large collection of software, which manages
    resources of the computer system, such as memory, processor, file system and input/output
    devices. It tracks the status of each resource and decides who will have a control
    over computer resources, for how long and when. You can say operating system works
    as a manager to control all the user activities and system activities in a computer
    system. Operating system directly controls computer hardware resources. Other
    programs rely on facilities provided by the operating system to gain access to
    computer resources. Modern operating systems like MSDOS, Unix, Linux, Windows
    or Solaris perform various functions to control a computer system.


    # Functions of an Operating System


    Operating system has to perform various functions for proper working of a computer
    system, like:


    +   1. Providing a good user interface for human—machine interaction

    2. Allocation of hardware and software components to user.\n3. Memory management

    4. Process management

    5. Secondary storage or Disk management

    6. File system management

    7. Network management

    8. Security management

    9. Multitasking, multiprogramming, multi user, multithreading operations

    10. Distributed process management


    Modern operating systems like Linux, Windows or Solaris perform more functions
    to control a computer system like :


    Provides Abstractions : Hardware has low-level physical resources with complicated
    interfaces. OS provides abstracts that present clean interfaces. Goal: make computer
    easier to use. Examples: Processes, Unbounded Memory, Files, Synchronization and
    Communication Mechanisms.'
