  md: '# Computer Organization 31


    +   - The computer loads the operating system (OS) from the hard drive into the
    system''s RAM. Generally, the critical parts of the operating system are maintained
    in RAM as long as the computer is on. This allows the CPU to have immediate access
    to the operating system, which enhances the performance and functionality of the
    overall system.


    +   - When you open an application, it is loaded into RAM. To conserve RAM usage,
    applications load only the essential parts of the program initially and then load
    other pieces as needed.


    +   - After an application is loaded, any files that are opened for use in that
    application are loaded into RAM.


    +   - When we save a file and close the application, the file is written to the
    specified storage device, and then it is purged from RAM.


    In the list above, every time something is loaded or opened, it is placed into
    RAM. This simply means that the computer''s temporary storage area is so that
    the CPU can access information more easily. The CPU requests the data it needs
    from RAM, writes new data back to RAM in a continuous cycle. In most computers,
    this shuffling of data between the CPU and RAM happens millions of times every
    second. When an application is closed, it and any accompanying files are usually
    purged (deleted) from RAM to make room for new data. If the changed files are
    not saved to a permanent storage device before purged, they are lost.


    # Byte Organized Memory. Multi Byte CPU


    In your computer the main memory is organized but modern CPUs can handle multi
    byte words (usually integral multiples) 4 bytes. In such a case one of the two
    following storage pattern is followed -


    Little Endian : Lower Memory Address holds lower order byte.(Intel Convention).


    Big Endian : Lower Memory Address holds Higher order byte.


    # 2.8 RAM


    Random Access Memory (RAM) is the best kind of computer memory. RAM is considered
    "random access" because you can access any memory cell if you know the row and
    column that intersect at that cell.


    The opposite of RAM is serial access memory (SAM). SAM stores data as a series
    of memory cells that can only accessed sequentially (like a cassette tape). If
    the data is not in the current location, each memory cell is checked until the
    needed data is found. SAM works very well for memory buffers, where the data is
    normally stored in the order in which it will be used (a good example is the texture
    buffer memory on a video card). RAM data, on the other hand, can be accessed in
    any order.


    # Design of RAM


    Similar to a microprocessor, a memory chip is an integrated circuit (IC) made
    of millions of transistors and capacitors. In the most common form of computer
    memory, dynamic'
