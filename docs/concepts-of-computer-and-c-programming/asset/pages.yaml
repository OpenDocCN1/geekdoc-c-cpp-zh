  md: '# 9.1.2 Types of Structured Programming


    Structured programming is one of the best programming methodologies. Basically,
    there are two types of structured programming:


    +   1. Top-down programming.

    2. Bottom-up programming.


    To solve a large programming problem, you can start with top level and breaks
    into next small parts and you start your programming at a higher level. For example,
    you can work with the main() function at the beginning, and then move to the next
    lower level until the lowest-level functions are written. This approach is called
    top-down-programming.


    On the other, to solve a problem, one way to do it is to work on the smallest
    pieces of the problem. You define and write functions for each of the pieces.
    After each function is written and tested, you put them together to build a program
    that can solve the problem. This approach is normally called bottom-up programming.


    # 9.2 FUNCTION


    A function is a named and independent section of programming language code that
    performs a specific task and optionally returns a value to the calling program.
    Like you have a function on your TV remote that forward you to next channel, same
    as in your mobile phone you have a function to send SMS, which send your message
    to your friend. Now you can write definition of C function like:


    > "A function is a named, independent section of C that performs a specific task
    and optionally returns a value to the calling program"


    A function is named


    Each function has a unique name. By using that name in another part of the program,
    you can execute the statements contained in the function. This is known as calling
    the function. A function can be called from within another function. Like :


    ```

    clrscr(); // It will clear your program output screen

    pow(m,n); // It will return n power of given number

    ```


    A function is independent


    A function can perform its task without interference from or with other parts
    of the program.


    A function performs a specific task


    A task is a given job to your function that must perform as part of its overall
    operation, such as sending a message to your friend using SMS or print some text
    to a printer, or calculating cube root.


    A function can return a value to


    When your program calls a function, the statements it contains are executed. If
    you want them to, these statements can pass information back to the calling program.
    Like when you'
