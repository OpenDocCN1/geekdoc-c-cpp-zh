  md: '# # 7 ARRAYS IN C


    # ## 7.1 ARRAY


    An array is a collection of data storage locations, each having the same data
    type and the same name. Each storage location in an array is called an array element.
    Why do one use arrays in programs? This question can be answered with an example.
    If you''re tracking 12 month salary of an employee, you will use a separate sheet
    for each month''s receipts, but it would be more convenient to have a single workbook
    with 12 worksheets. Now look the following declaration :


    ```

    int x; Single variable

    int x[10]; Collection of 10 integer values having one name

    ```


    Using array it is easy to solve this example by C programming. The program could
    declare 12 variables, one for each month''s expense total. This approach is analogous
    to having 12 separate sheets for your receipts. Good programming practice, however,
    would utilize an array with 12 elements, storing each month''s total in the corresponding
    array element. This approach is comparable to filing your receipts in a single
    workbook with 12 worksheets.


    ```

    int一遍, febsal, marsal, aprsal, junsal, julsal, augsal, septal, octsal, novsal,
    decsal;

    or intemps[12];

    ```


    In many cases, you have to declare a set of variables that have the same data
    type. Instead of declaring them individually, C allows you to declare a set of
    variables of the same data type collectively as an array.


    > "An array is a collection of variables that are of the same data type. Each
    item in an array is called an element. All elements in an array are referenced
    by the name of the array and are stored in a set of consecutive memory slots".'
