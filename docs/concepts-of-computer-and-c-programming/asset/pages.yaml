  md: '# 9

    FUNCTIONS IN ''C''


    # 9.1 STRUCTURED PROGRAMMING


    When you want to solve simple problems of programming, you always write a direct
    program without using any programming approach of software engineering. Just take
    an example of your mobile phone services, each service act as individual unit
    like phone book or SMS or calculator or your favourite games. To design a complete
    software or a large program there is a need to break it into smaller parts known
    as modules and then write codes for individual modules and reuse them as an integral
    part of your software or large program.


    In structured programming individual program tasks are performed by independent
    programming. By using functions in your C programs, you can practice structured
    programming.


    # 9.1.1 Advantages of Structured Programming


    It is easier to write a structured program


    It is also easier to debug or trace your errors into a structured program. If
    your program has a bug or error that causes it to work improperly, a structured
    design makes it easy to isolate the problem to a specific section of code or to
    a specific function. A related advantage of structured programming is the time
    you save. If you write a function to perform a task in one program, you can quickly
    and easily use it in another program that needs to execute the same task. Even
    if the new program needs to accomplish a slightly different task, you''ll find
    that modifying a function you created earlier is easier than writing a new one
    from scratch. In C most of the time you used the two functions printf() and scanf()
    and do you know the actual code of two functions.'
