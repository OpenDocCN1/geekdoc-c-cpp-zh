    # How to Set File Names?


    Every disk file has a name, and you must use filenames when dealing with disk
    files. Filenames are stored as strings, just like other text data. The rules as
    to what is acceptable for filenames and what is different from one operating system
    to another.


    In DOS and Windows 3.x, a complete filename consists of a name that has one to
    eight characters, optionally followed by a period and an extension that has one
    to three characters. In contrast, the Windows 95 and Windows NT operating systems,
    as well as most UNIX systems, permit filenames up to 256 characters long. So keep
    in mind which operating system you are using.


