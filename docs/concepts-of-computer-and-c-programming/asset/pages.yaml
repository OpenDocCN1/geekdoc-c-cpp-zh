  md: "# Functions in 'C' 187\n\n```\ntime(&now);\nprintf(\"Current date and time\
    \ is: %s\\n\", asctime(localtime(&now)));\n}\n\n```\n\n# 9.6 CALL BY VALUE AND\
    \ CALL BY REFERENCE\n\nThe default method of passing an argument to a function\
    \ is by value. Passing by value means that the function is passed a copy of the\
    \ argument's value. This method has three steps:\n\n+   1. The argument expression\
    \ is evaluated.\n2. The result is copied onto the stack, a temporary storage area\
    \ in memory.\n3. The function retrieves the argument's value from the stack.\n\
    \nWhen a variable is passed to a function by value, the function has access to\
    \ the variable's value but not to the original copy of the variable. As a result,\
    \ the code in the function cannot modify the original variable. This is the main\
    \ reason why passing by value is the default method of passing arguments that\
    \ lets you make data outside the function protected from unintended modification.\
    \ Passing arguments by value is possible with the basic data types (char, int,\
    \ long, float, and double)\n\nThere is no other way to pass an argument to a function,\
    \ however by passing a pointer to the argument rather than the value of the variable\
    \ itself. This method of passing an argument is called by reference.\n\n# Program\
    \ 9.9 Program to show call by value and call by reference\n\n```\n/* Passing arguments\
    \ by value and call by reference. */\n#include <stdio.h>\nvoid byvalue(int a,\
    \ int b, int c);\nvoid byref(int *a, int *b, int *c);\nmain() {\n    int x = 2,\
    \ y = 4, z = 6;\n    printf(\"\\nBefore calling byvalue(), x = %d, y = %d, z =\
    \ %d.\\n\", x, y, z);\n    byvalue(x, y, z);\n    printf(\"\\nAfter calling byvalue(),\
    \ x = %d, y = %d, z = %d.\\n\", x, y, z);\n    byref(&x, &y, &z);\n    printf(\"\
    \\nAfter calling byref(), x = %d, y = %d, z = %d.\\n\", x, y, z);\n}\nvoid byvalue(int\
    \ a, int b, int c) {\n    a = 0;\n    b = 0;\n    c = 0;\n}\n```"
