  md: '# Computer Organization 27


    +   The **date** is the year that the processor was first introduced. Many processors
    are introduced at higher clock speeds for many years after the original release
    date.


    +   **Transistors** is the number of transistors on the chip. You can see that
    the number of transistors on a single chip has risen steadily over the years.


    +   **Microns** is the width, in microns, of the smallest one on the chip. For
    comparison, a human hair is 100 microns thick. As the feature size on the chip
    goes down, the number of transistors rises.


    +   **Clock speed** is the maximum rate that the chip can be clocked at. Clock
    speed will make sense in the next section.


    +   **Data width** is the width of the ALU. An 8-bit ALU can add/subtract/multiply/etc.
    two 8-bit numbers, while a 32-bit ALU can manipulate 32-bit numbers. An 8-bit
    ALU would have to execute four instructions to add 32-bit numbers, while a 32-bit
    ALU can do it in one instruction. In many cases, the external bus is the same
    width as the ALU, but not always. The 8088 has a 16-bit ALU and an 8-bit bus,
    while the modern Pentium fetch 64 bits at a time for their 32-bit ALUs.


    +   MIPS stands for "million instructions per second" and is a rough measure of
    the performance of a CPU. Modern CPUs can do so many things that MIPS ratings
    lose a lot of their meaning, but you can get a general sense of the relative power
    of the CPUs from this monitor.


    # The Functions of the CPU


    The CPU (Central Processing Unit) performs the following tasks by executing Instructions
    of some specific program stored in Main Memory :


    +   Controlling all peripheral devices.


    +   Communicating with all types of Devices


    +   Recognizing user commands


    +   Inputting Data


    +   Producing Output (on screen/or printer) after obtaining Data from Main/Secondary
    Memory.


    +   Performing arithmetic & logical operations. As Specified Instruction(s) of
    the executing program.


    # Microprocessor Instructions


    Even the incredibly simple microprocessor shown in the previous example will have
    a fairly large set of instructions that it can perform. The collection of instructions
    is implemented as patterns, each of which has a different meaning when loaded
    into the instruction register. Humans are not particularly good at remembering
    bit patterns, so a set of short words are defined to represent the different bit
    patterns. This collection of words is called the **assembly language** of the
    processor. An **assembler** can translate the words into their patterns very easily,
    and then the output of the assembler is placed in memory for the microprocessor
    to execute.'
