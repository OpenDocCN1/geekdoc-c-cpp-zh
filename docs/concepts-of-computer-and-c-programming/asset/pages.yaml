  md: '# Declaring Arrays


    The following is the general form to declare an array:

    data-type Array Name(Size);


    Here data-type is the type specifies that indicates what data type the declared
    array will be. Array-Name is the name of the declared array. Size defines how
    many elements the array can contain. Note that the brackets ([ ]) are required
    in declaring an array. The bracket pair (i and j) is also called the array subscript
    operator.


    For example, an array of integers is declared in the following statement:

    int subjects_marks[8];


    Where int specifies the data type of the array whose name is subjects_marks. The
    size of the array is 8, means that the array can store eight elements but only
    integers. In C, you have to declare an array explicitly, as you do for other variables,
    before you can use it.


    # Indexing Arrays


    After you declare an array, you can access each of the elements in the array separately.
    For instance, the following declaration declares an array of characters:

    char alphabets[26];


    You can access the elements in the array by day one after another. The important
    thing to remember is that all arrays in C are indexed starting at 0. In other,
    the index to the first element in an array is 0, not 1. Therefore, the first element
    in the array of day is day[0]. Because there are 26 elements in the day array,
    the last element is alphabets[25], not alphabets[26]. The twenty six elements
    of the array will have the following expressions: alph[0], alphabets[1], alphabets[2],
    alphabets[3], alphabets[4], alphabets[5], and day[25] for last element. Because
    these expressions reference the elements in the array, they are sometimes called
    array reference elements.


    # Initializing Arrays


    With the help of the array element index or sub scripts, you can initialize each
    element in an array. For example, you can initialize the first element in the
    array of alphabets, which was declared in the last section, like this:

    alphabets[0] = ''a'';


    Here the value of ''a'' is assigned to the first element of the array, alphabets,
    alphabets [0].

    Likewise, the statement alphabets[25] = ''z''; assigns ''z'' to the last element,
    day[1], in the array.


    The second way to initialize an array is to initialize all elements in the array
    together. For instance, the following statement initializes an integer array:


    ```

    int subjects[5] = {100, 80, 53, 65, 76};

    ```'
