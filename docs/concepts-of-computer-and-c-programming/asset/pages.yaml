  md: '# ABOUT THE BOOK


    The book Concept of Computer and ''C'' Programming contains some special features
    about fundamental concepts of computing and programming in C in an easy way. Each
    chapter provides concrete examples and explanation of concepts. Numerous sample
    programs illustrate features and concepts of C so that one can apply with computer
    lab. Each chapter ends with a section containing common questions to the chapter
    with previous years'' questions asked in university exams. It contains numerous
    objective questions and exercises that help students test their knowledge and
    prepare for aptitude tests conducted by various software companies at the time
    of recruitment. Some advanced features like interact, assembly programming in
    C and small TSR, virus programs, are key features of this book that lead readers
    to be a system programmer using C. Unlike other C books, this book offers many
    sample programs and exercises with clear explanations and answers, which makes
    the concepts of the C language easier to understand.


    # ABOUT THE AUTHORS


    Dr. Krishan Goyal received M. Tech degree in Computer Science from U.P. Technical
    University, Lucknow. He has received Ph.D. in Cryptography from Dr. B.R. Ambedkar
    University, Agra. He also received Master''s degree in Computer Applications &
    Mathematics from Dr. B.R. Ambedkar University, Agra. Presently, he is working
    as an Associate Professor in the Department of Computer Science at Raja Balwant
    Management Technical Campus, Agra since 2002. He has participated in several faculty
    development programs, seminars and workshops. He has also published several research
    papers in journals of national and international reputate.


    Dr. M. K. Sharma is working as Reader and Head, MCA in the Department of Computer
    Science at Amrapali Institute of Management and Computer Applications, Hardwani,
    Uttarakhand. He has authored 10 books and contributed many research papers and
    articles in national as well as international journals and magazines including
    E-gov Asia and CSI communication. He is an active member of CSI and IBM Academic
    Initiatives. He is also a member of Special Group of E-governance (SIGgov).


    Dr. M. P. Thaliya is working as Reader in the Department of Computer Science at
    HNB Garwal University, Srinagar, Garhwal, Uttarakhand. His major research interests
    are in the field of Software Engineering, Human-Computer Interaction, Educational
    research and the role of Information and communication technologies for improving
    teaching and learning process. He has also reviewed papers of various International
    Conferences and voted USA, Italy, France and Singapore as an expert to present
    his papers. He has been involved in the design and development of educational
    software. He has published more than 30 papers in International and National Journals/Conferences.
    He is an Editorial Board Member of various International Journals and has 15 years
    of experience in the field of software development, Human-Computer Interaction
    and Information System Design. He is a member of SIGAPP (Special Interest Group
    on Applied Computing), Society for Information Science and senior member of Computer
    Society of India. He is also an Indian representative of the International Federation
    for Information Processing (IFIP), TC-13 (Human-Computer Interaction) Group. He
    has also authored books on ''Fortran Programming'' and ''Analysis and Design''.


