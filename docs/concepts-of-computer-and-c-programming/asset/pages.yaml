    # 12.5 FILE HANDLING IN C


    Most of the programs you have tested yet are based on variables and temporary
    memory allocation, there is no logic to save your program values on Secondary
    storage. In an application based on business logics you must save your data on
    Disk and therefore you need to work with Disk Files


    # What is a Disk File


    In C, a file can refer to a disk file, a terminal, a printer, or a tape drive.
    In other words, a file represents a secondary storage medium with which you can
    exchange information between RAM and Disk. Before you perform any communication
    to a file, you have to open the file. Then you need to choose the opened file
    after you finishing exchange with it.


    # Role of Streams in Disk Files


    C performs all input and output, including disk files, by means of streams. Disk
    file streams work essentially the same way. The data flow you transfer from your
    program to a file, or vice versa, is a stream, which is a series of bytes. Not
    like a file, a stream is deviceindependent—techniques for using one stream can
    be used with little or no change for other streams. The major difference with
    disk file streams is that your program must explicitly create a stream associated
    with a specific disk file.


    # Types of Disk Files


    There are two formats of streams. The first one is the text stream, which consists
    of a sequence of characters (that is, ASCII data). Depending on the compilers,
    each line in a text stream may be terminated by a new line character. Text streams
    are for textual data, that have a consistent appearance from environment to another,
    or from one machine to another.


    The second format of streams is the binary stream, which is a series of Bytes.
    Binary streams are primarily used for non textual data, which is required to keep
    the exact contents of the file.


    You can associate any type of stream with a file, and it''s important that you
    understand the distinction in order to use the proper mode for your files.


    Text streams are associated with text-mode files. Text-mode files consist of a
    sequence of lines. Each line contains zero or more characters and ends with one
