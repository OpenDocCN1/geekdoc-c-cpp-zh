  md: '# 118 Concept of Computer & ''C'' Programming


    If an expression contains more than one operator with the same precedence level,
    the operators are performed in left-to-right order as they appear in the expression.
    For example, in the following expression, the % and * have the same precedence
    level, but the % is the leftmost operator, so it is performed first:


    ```

    12 % 5 * 2

    ```


    The expression evaluates to 4 (12 % 5 evaluates to 2; 2 times 2 is 4).\Returning
    to the previous example, you see that the statement x = 4 + 5 * 3, assigns the
    value 19 to x because the multiplication is performed before the addition. What
    if the order of precedence wasn''t needed? Using the previous example, if you
    wanted to add 4 to 5 and then multiply the sum by 3? C uses parentheses to modify
    the evaluation order. A subexpression enclosed in parentheses is evaluated first,
    without regard to operator precedence. Thus, you could write:


    ```

    x = (4 + 5) * 3;

    ```


    The expression 4 + 5 is evaluated first, so the value assigned to x is 27.

    You can use multiple and nested parentheses in an expression. When parentheses
    are nested, evaluation proceeds from the innermost expression outward. Look at
    the following complex expression:


    ```

    x = 25 - (2 * (10 + (8 / 2)));

    ```


    The evaluation of this expression proceeds as follows:


    +   1. The innermost expression, 8 / 2, is evaluated first, yielding the value
    4:

    25 - (2 * (10 + 4))


    +   2. Moving outward, the expression, 10 + 4, is evaluated, yielding the value
    14:

    25 - (2 * 14)


    +   3. The last, or outermost, expression, 2 * 14, is evaluated, yielding the
    value 28:


    +   4. The final expression, 25 - 28, is evaluated, assigning the value -3 to
    the variable x:

    x = -3


    You might want to use parentheses in some expressions for the sake of clarity,
    even when they aren''t needed for modifying operator precedence. Parentheses must
    always be in pairs, or the compiler generates an error message.


    Next Table summarizes the rules for precedence and associativity of all operators,
    including new that that you will use later in this book. Operators on the same
    line have the same precedence, rows are in order of decreasing precedence, for
    example, *, /, and % all have the same precedence, which is higher than that of
    binary + and -. The operator () refers to function call. The operators -> and
    are used to access members of structures and sizeof

    (size of an object), * for pointer and & for address of an object, along with
    the comma operator.'
