    \ MODIFIERS\n\nNow you have worked with primitive C data types, such as char,\
    \ int, float, and double. Now you can start to play with four data type modifiers\
    \ that enable you to have greater control over the data types you use in your\
    \ programs. The four data modifiers are:\n\n+   - signed\n- unsigned\n- short\n\
    - long\n\n# The Sign Bit\n\nIt is very easy to express a negative number in decimal\
    \ like – 56 or –780. All you need to do is put a minus sign in front of the absolute\
    \ value of the number. But how does the computer represent a negative number in\
    \ the binary format? Normally one bit can be used to indicate the value of a number\
    \ represented in the binary format. This bit is called the sign bit. The two data\
    \ modifiers, signed and unsigned, will help you to enable or disable the sign\
    \ bit.\n\n# The signed Modifier\n\nFor integers, the leftmost bit can be used\
    \ as the sign bit. For instance, if the int type is 16 bits and the right bit\
    \ is counted as 0, you can use 15 as a sign bit. When the sign bit is set to 1,\
    \ the C compiler knows that the value represented by the variable is negative.\
    \ The C language provides a data modifier, signed, that can be used to indicate\
    \ to the compiler that the int or char data type uses the sign bit. By default,\
    \ the int data type is a signed quantity. If you want to use a signed character\
    \ variable, and make sure the compiler knows it, you can declare the character\
    \ variable like this:\n\n```\nsigned char char;\n```"
