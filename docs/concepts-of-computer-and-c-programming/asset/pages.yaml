    value 27.


    ```

    x = 9 * 3;

    ```


    In contrast, if the multiplication is performed first, you have the following,
    and x is assigned the value 19


    ```

    x = 4 + 15;

    ```


    Clearly, some rules are needed about the order in which operations are performed.
    This order, called operator precedence, is strictly spelled out in C. Each operator
    has a specific precedence. When an expression is evaluated, operators with higher
    precedence are performed first. Table shows the precedence of C''s mathematical
    operators. Number 1 is the highest precedence and thus evaluated.


    | Operators | Relative Precedence |

    |---|--|

    | ++, -- | 1 |

    | *, /, % | 2 |

    | +, - | 3 |


    In any C expression, operations are performed in the following order:


    +   1. Unary increment and decrement

    2. Multiplication, division, and modulus

    3. Addition and subtraction'
