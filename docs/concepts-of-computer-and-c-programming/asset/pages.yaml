  md: '# Monitor Screens


    Monitor screens are devices used to display information from the computer. In
    fact, Television sets include monitor screens, though in general, the monitor
    screens used in computer systems are of a much higher quality.


    Monitors come in various sizes, commonly starting at 14", then 15", as well as
    17" and 19". This is the size of the viewable screen across the diagonal from
    corner to corner. The larger the size the more expensive the monitor. Larger sizes
    are required for higher resolutions.


    # Resolution


    Resolution refers to the number of dots displayed in the X (cross) and Y (down)
    co-coordinates. Typical screens are capable of displaying $640 \times 480$ dots.
    Larger screens are required for higher resolutions, $1024 \times 768$ resolutions
    displayed on a $14"$ screen very small, but the same resolution on a $17"$ screen
    is much easier to read. The following table shows some common resolutions.


    | Standard | x, y, colors |

    |---|---|

    | CGA | $640 \times 200 \times 2$ |

    | EGA | $640 \times 350 \times 16$ |

    | VGA | $640 \times 480 \times 256$ |

    | SVGA | $800 \times 600 \times 256$ |

    | XGA | $1024 \times 768 \times 65536$ |


    # Refresh Rate


    Another term used with monitors is refresh rate. This refers to the number of
    times per second that the image is redrawn on the monitor screen. A refresh rate
    of 60Hz means the images are redrawn 60 times a second. Typical refresh rates
    are 60Hz, 72Hz and 75Hz. Higher refresh rates are required for larger resolutions,
    else the viewer tends to notice the image on screen flickering. The images on
    the screen have be refreshed at a reasonable rate (greater than 50Hz), otherwise
    the human eye perceives the image as flickering.


    # Dot Pitch


    This is the distance in millimeters between the phosphor triads. Typically it
    is .28 mm, and the smaller the better, resulting in a much sharper display. Obviously,
    the smaller dot pitch monitors like .26 mm are very expensive.


    # 2. Liquid Crystal Display (LCD)


    First introduced in watches and clocks in 1970s, LCD is now applied to display
    devices. The major advantage of LCD is the low energy consumption. The CRT (Cathode
    Ray Tube) is replaced by liquid crystal to produce the image. This also has color
    capability. These are commonly used in portable devices like Palmtop, Laptop or
    Mobile handsets.'
