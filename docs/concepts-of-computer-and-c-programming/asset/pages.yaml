    # 4.7 BRIEF HISTORY OF THE C LANGUAGE


    C was created by Dennis Ritchie at the Bell Telephone Laboratories in 1972. The
    language was created for a specific purpose: to design the UNIX operating system
    now known as Linux. From the beginning, C was intended to be useful—allow busy
    programmers to get things done.


    Because C is such a powerful and flexible language, it us quickly spread beyond
    Bell Labs. Programmers everywhere began using it to write all sorts of programs.
    Soon, however, different organizations began utilizing their own versions of C,
    and subtle differences between implementations started to cause programmers headaches.
    In response to this problem, the American National Standards Institute (ANSI)
    formed a committee in 1983 to establish a standard of C, which became known as
    ANSI C. With few exceptions, every modern compiler has the ability to adhere to
    this standard.


    The C language is so named because its predecessor became B. The B language was
    developed by Ken Thompson of Bell Labs.


