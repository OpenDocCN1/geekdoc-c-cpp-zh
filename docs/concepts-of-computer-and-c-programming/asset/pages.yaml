    # 8.2.1 printf Format String


    A printf format string specifies how the output is formatted. There are three
    components of a format string:


    Literal text displayed exactly as entered in the format string. In the preceding
    example, the characters starting with the T (in The) up, but not including, the
    %comprise a literal string.


    An escape sequence provides special formatting control. An escape sequence consists
    of a backslash (\) followed by a single character. In the example, \n is an escape
    sequence. It is called the newline character, and it means to move to the start
    of the next line.


    A conversion specifier consists of the percent sign (%) followed by a single character.
    In the example, the conversion specifier is %d. A conversion specifier tells printf()
    how to interpret the variable(s) being printed. The %d tells printf() to interpret
    the variable x as a signed decimal integer.


    # 8.2.2 Escape Sequences in C


    | Sequence | Meaning |

    | --- | --- |

    | \a | Bell (alert) |

    | \b | Backspace |

    | \n | Newline |

    | \t | Horizontal tab |

    | \ | Backslash |

    | \? | Question mark |

    | \'' | Single quotation |


    Escape sequences are used to control the location of output by moving the screen
    cursor. They are also used to print characters that would otherwise have a special
    meaning to'
