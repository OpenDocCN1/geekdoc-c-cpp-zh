- img_proc: true
  md: '# 32 Concept of Computer & ''C'' Programming


    random access memory (DRAM), a transistor and a capacitor are paired to create
    a memory cell, which represents a single bit of data. The capacitor holds the
    bit of information—a 0 or a 1 (see How Bits and Bytes for information on bits).
    The transistor acts as a switch that lets the control over the memory chip read
    the capacitor or change its state.


    A capacitor is like a small bucket that is able to store electrons. To store a
    1, it is filled with electrons. To store a 0, it is emptied. The problem with
    the capacitor''s bucket is that it has a leak. In a few milliseconds a bucket
    becomes empty. Therefore, for dynamic memory to work, either the CPU or the memory
    controller comes along and recharge all of the capacitors holding a 1 before they
    discharge. To do this, the memory controller reads the memory and writes it right
    back. This refresh operation happens atomically thousands of times per second.


    # SRAM


    SRAM uses a completely different technology. A flip-flop for a memory cell takes
    four or six transistors along with wiring, but needs to be refreshed. This makes
    static RAM significantly faster than dynamic RAM. However, because it has more
    parts, a static memory takes up a lot more space on the chip, which makes static
    RAM a lot more expensive, and so, dynamic RAM is less expensive and slower. So
    static RAM is used to create the CPU''s speed-sensitive cache, while dynamic RAM
    forms the larger RAM space.


    # DIMM/DIP


    Memory chips in desktop computers originally used a pin configuration called dual
    inline package (DIP) or dual inline memory module (DIMM). This configuration could
    be soldered into holes on the computer''s motherboard or plugged into a socket
    that was soldered onto the motherboard. This method worked fine when computers
    typically operated on a few megabytes or less of RAM, but as the need for more
    memory grew, the number of chips needing space on the motherboard increased.


    The solution was to place the memory chips, along with all of the support components,
    on a printed circuit board (PCB) that could be plugged into a special connector
    (memory bank) on the motherboard. Most of these chips use a small outline J-lead
    (SOJ) pin configuration, but quite few manufacturers use the thin outline package
    (TSOP) configuration as well. The key difference between these DIP configuration
    is SOJ and TSOP chips are surface-mounted to the PCB. In other cases, the pins
    are soldered directly to the surface of the board, inserted in holes or sockets.


    Memory chips are normally only available as part of a card called a module. You''ve
    probably seen memory listed as 8x32 or 4x16. These numbers represent the number
    of the chips multiplied by the capacity of each individual chip, which is measured
    in megabits (Mb), or one million bits. Take the result and divide it by eight
    to get the number of megabytes on that module. For example, 4x32 means the module
    has four 32-megabit chips. Multiply by 32 and get 128 megabytes.'
