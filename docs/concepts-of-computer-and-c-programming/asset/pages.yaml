  md: '# # 6 Concept of Computer & ‘C’ Programming


    # Office automation


    Office automation is the use of hardware, software and networks to enhance general
    office works such as communication among employees, and documents typing and filing.
    A verity of office automation software is available in market like: Word processing
    software, Spreadsheet software, Database management software, Presentation software,
    Accounting software etc.


    # 1.4.7 Computers in Industrial Applications


    Now a days and more engineers and architects are designing products with computers.
    Some of uses of computers in design, manufacturing and transportation are :


    # Computer-Aided Design (CAD)


    Computer-aided design is a term that refers to the use of computers and graphics-oriented
    software to aid in the design process. CAD systems allow engineers to create two-dimensional
    or three-dimensional electronic objects. They also enable the designers to view
    the objects from different perspectives. For example, the engineer of Honda or
    Maruti designing a vehicle model using a 3D-CAD system. The system allows the
    engineer to view the models at different angles. The architect is designing a
    building model known as electronic design automation (EDA). In mechanical design
    it is known as mechanical design automation (MDA) or computer-aided drafting (CAD),
    which includes the process of creating a technical drawing with the use of computer
    software.


    # Computer-Aided Manufacturing (CAM)


    Computer-aided manufacturing is a term that refers to the use of computers to
    control equipment drilling, welding and milling in the manufacturing process.
    In Vehicle welding the computer controls the welding robot when and to spot weld
    on the vehicle being assembled. The computer-controlled robot can perform tasks
    with precision and it is more accurate than a human. The computer-controlled equipment
    can prevent dangerous and repetitive tasks for humans. It reduces any annual leave,
    sick leave and other fringe benefits. CAM has been considered a numerical control
    (NC) programming tool, wherein two-dimensional (2-D) or three-dimensional (3-D)
    models of computers are generated in CAD. With other “Computer-Aided” technologies,
    CAM does not eliminate the need for skilled professionals such as manufacturing
    engineers, NC programmers, or machinists.


    # 1.4.8 Computers in Scientific Applications


    Computers are used extensively in science. For example, meteorologists use computers
    to study the formation of tornadoes. Computers can also be used to simulate automobile
    accidents on screen. Some good uses of computers are modeling, simulation, and
    weather forecasting.'
