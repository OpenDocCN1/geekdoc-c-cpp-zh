    # 11.11 POINTER TO POINTERS


    A pointer is itself a numeric variable, it is stored in computer''s memory at
    a particular address. Therefore, you can create a pointer to a pointer, a variable
    whose value is the address of a pointer. A double indirection operator (**) is
    used to declare a pointer to a pointer.


    ```

    int mk = 35;           /* mk is a type int variable. */

    int *ptr = &mk;      /* ptr is a pointer to mk. */

    int **pptr = &ptr;   /* pptr is a pointer to ptr */

    To displays the value of mk on your screen you can use :

    printf("%d\n", *pptr);

    ```


    > Tips: Declaring and using a pointer to a pointer is called multiple indirection
    in C.


    # 11.12 POINTERS TO STRUCTURES


    In a C program you can declare and use pointers to structures, just as you can
    declare pointers to any other data type. Pointers to structures are very useful
    in programming of data structure where you have to work with link lists or trees.


    If you have a structure like:


    ```

    struct student {

    int rollnumber;

    char name[20];

    } struct s[50];

    ```


    You can declare a pointer like:


    ```

    struct student *s1;

    ```


    and you can assign address of first record of student structure to pointer s1
    like :


    ```

    s1 = &s[0];

    ```


    or


    ```

    s1=s;

    ```'
