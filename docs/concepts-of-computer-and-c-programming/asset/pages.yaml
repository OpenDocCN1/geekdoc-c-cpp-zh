  md: '# Introduction to Computer 9


    AGP. Accelerated Graphics Port is a very high-speed connection used by the graphics
    card to interface with the computer.


    Sound card. This is used by the computer to record and play audio by converting
    analog sound into digital information and back again.


    Graphics card. This translates image data from the computer into a format that
    can be displayed by the monitor.


    # 1.5.3 Input/Output Devices


    No matter how powerful the components inside your computer are, you need a way
    to interact with them. This interaction is called input/output (I/O). The most
    common types of I/O in PCs are:


    +   Monitor. The monitor is the primary device for displaying information from
    the computer.


    +   Keyboard. The keyboard is the primary device for entering information into
    the computer.


    +   Mouse. The mouse is the primary device for navigating and interacting with
    the computer.


    +   Removable storage. Removable devices allow you to add new information to your
    computer easily, as well as save information that you want to carry to a different
    location.


    +   Floppy disk. The most common form of removable storage, floppy disks are extremely
    inexpensive and easy to save to.


    +   CD-ROM. CD-ROM (compact disc, read-only memory) is a popular form of distribution
    of commercial software. Many systems use CD-R and CD-RW (rewritable), which can
    also record.


    +   Flash memory. Based on a type of ROM called electrically erasable programmable
    read memory (EEPROM), Flash memory provides fast, permanent storage. CompactFlash,
    SmartMedia and PCMCIA cards are all types of Flash memory.


    +   DVD-ROM. DVD-ROM (digital versatile disc, read-only memory) is similar to
    CD-ROM but is capable of holding more information.


    +   Joy Stick. Joysticks are often used to control video games, and when you have
    one or more push-buttons what can be read by the computer. A popular variation
    of the joystick used on modern video consoles is the analog stick.


    +   Light pen. A light pen is an input device in the form of a light-sensitive
    wand used in conjunction with a computer''s cathode ray tube (CRT) display. It
    allows the user to point to displayed objects or draw on the screen in a way similar
    to a touchscreen with greater positional accuracy.


    +   Track Ball. A trackball is a pointing device consisting of a ball held by
    a socket containing sensors to detect a rotation of the ball about two axes—like
    an upside-down mouse with an protruding track. Users roll the ball to position
    the on-screen pointer, using their thumb, fingers, or the palm of the hand with
    their fingertips to press the mouse buttons.


    +   Scanner. An image scanner—often abbreviated to scanner, is a device that optically
    scans images, printed text, handwriting or an object to convert it a digital image.'
