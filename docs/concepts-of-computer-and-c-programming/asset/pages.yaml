    # 12.1 WHAT IS DYNAMIC MEMORY ALLOCATION?


    Memory either primary (in form of RAM) or secondary (in form of Hard disk or other)
    is must perform all operations in a computer. When you write a simple program
    in C like a program to add 3 numbers, you need to declare 3 variables to store
    the values. In fact that 3 variables are 3 memory locations in your PC. Next if
    you want to store your resume in form of a file you need secondary storage memory
    to hold it.


    In most of the program you have tested the number of variables in advance, but
    how can a bank may know in advance how many customers will open an account on
    a specific day. Be more practical and think about Indian railway reservation system,
    how can you fix numbers of reservation or cancellation on a day. After reading
    all these lines you can divide programs in two categories :


    +   1. Static Programs

    2. Dynamic Programs


    In a static program number of variables and number of records are remain constant
    and you need to declare them in advance like an array or array of structures.


    A dynamic program will help you to add or remove element of program at run time
    like in a bank or in railway reservation system. A dynamic programming concept
    is must to design any good software. Word processor MSWORD is also provide to
    add or remove text any time. Most of the data base application are dynamic in
    nature, where you have freedom to insert or remove records any time.


