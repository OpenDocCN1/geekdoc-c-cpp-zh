  md: '# 4 Concept of Computer & ''C'' Programming


    # Computer Assisted Learning (CAL)


    Computer assisted learning is a term which refers to the use of computers in assisting
    learning. For example, a teacher may use a graph plotting software to demonstrate
    the behavior of different functions in a mathematics lesson; a kid student may
    use an animated nursery rhymes to learn and sing rhymes. A chemistry tutorial
    program can teach students chemical bonding on monitor screen in 3D form to enhance
    skills of the students.


    # Information searching


    Dictionaries, encyclopedias, maps and many specialized references are now available
    in CD-ROMs. Many of them also include multimedia capabilities. You can easily
    search any topic in CD de in time.


    The World Wide Web is a system of interlinked hypermedia documents that enables
    users to find and retrieve information by navigating the web sites. Google search
    engine is a example of web search, where you can search information on any topic.


    # 1.4.2 Computers in Games


    Computer games is another area of computer application. You can play electric
    golf or cricket at home. You can play chess with the computer as your opponent.


    In computer games, the players becomes characters in situations they know only
    a little about. The characters will then encounter different phases of the adventure,
    and only successful solving with the given resources and information will move
    them one step ahead to accomplish the required mission.


    Simulation games allow players to explore artificial environments, imaginary or
    based elements to learn. The players can experience the consequences of their
    actions.


    # 1.4.3 Computers in Edutainment


    Edutainment comes from two words: Education and Entertainment. It means the combination
    of education with entertainment. Most of the edutainment software use multimedia
    elements to entertain users while they learn.


    # Computer for special effects in movies


    The characters in Jurassic park or anaconda were computer generated. About 25,
    0000 storyboards have been prepared for this movie. The animators have to animate
    each and every move the characters made.


    A film director may need scenery that does not exist in real life. For example,
    a scene with the Tower Bridge (in England) appearing in Victoria Harbour (Hong
    Kong). With the help of computers, pictures of Victoria Harbour can be combined
    with the digital image of the Tower Bridge to produce this special scenery.


    # 1.4.4 Computers in Business Applications


    Computers are widely used in business nowadays. They are part of designing, marketing,
    production, transitions etc. Some of their uses are in banking, supermarkets and
    transaction payments.'
  merge: -1
