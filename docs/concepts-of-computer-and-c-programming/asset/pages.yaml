  md: "# Structure of 'C' 95\n\n# Changing Data Sizes\n\nSometimes, you want to reduce\
    \ the memory taken by variables, or you you need to increase the storage space\
    \ of certain data types. Fortunately, the C language gives you the flexibility\
    \ to modify sizes of data types. The two data modifiers, short and long, will\
    \ help you to decrease or increase the size of data type.\n\n# The short Modifier\n\
    \nA data type can be modified to take less memory using the short modifier. For\
    \ instance, you can apply the short modifier to an integer that is 32 bits, which\
    \ might reduce the memory taken by the variable to as little as 16 bits.You can\
    \ use the short modifier like this:\n\n```\nshort x;\nunsigned short y;\n```\n\
    \nBy default, a short data type is a signed number. Therefore, in the short x;\
    \ x is a signed variable of short integer.\n\n# The long Modifier\n\nIf you need\
    \ more memory to keep values from a wider range, you can use the long modifier\
    \ to define a data type with increased storage space. For example, given an integer\
    \ variable x that is 16 bits long,\nlong x;\n\nincreases the size of x to 32 bits.\
    \ In other words, after the modification, x is capable of holding a range of values\
    \ from -2147483648 to 2147483647.\n\nProgram 5.10 Use of short and long modifiers\n\
    \n```\n#include <stdio.h>\nmain()\n{\n    printf(\"The size of short int is: %d.\\\
