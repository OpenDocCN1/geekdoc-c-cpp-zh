  md: '# 12 Concept of Computer & ''C'' Programming


    # 1.7.2 Charles Babbage''s Difference Engine (1833)


    Charles Babbage (1791-1871) designed this engine in an attempt to mechanize the
    computation of mathematical tables. He used the principle of the method of differences,
    *i.e.*, adding increments (=differences) to intermediate results.


    # 1.7.3 Charles Babbage''s Analytical Engine (1871)


    Babbage abandoned the Difference Engine, to pursue a better idea, a general purpose
    computer for automatically solving mathematical equations. The Analytical Engine
    would be able to carry out any mathematical operation by use of stored programs.
    One could modify its behavior by altering two boxes of punched cards.


    # 1.7.4 Babbage''s Idea and Modern Computers


    Babbage''s engine separates a "store" from a "mill". These correspond to the most
    important components of a modern computer the **main memory** and the **central
    processing unit(CPU)**. A modern stored-program machine can execute any sequence
    of instructions stored in its memory.


    # 1.8 GENERATION OF COMPUTERS


    From abacus to PC, PDA or tiny computers, computers can be divided in given below
    generations:


    # 1.8.1 First Generation (1940–1958)


    First generation computers were built using vacuum tubes. A vacuum tube is, reasonably
    enough, a sealed glass tube containing a vacuum in which are present several electronic
    elements like the cathode, anode, grid, and filament. John Atanasoff developed
    an electronic switch based on vacuum tubes, and used this in a special purpose
    computer that acted as capacitors as memories (essentially the same as dynamic
    RAM).


    ENIAC (Electronic Numerical Integrator and Calculator) was developed at the Moore
    School of Engineering as a specialized programmable computing for ballistic tables
    for the Army. It was programmed by switching wires in patches, and flipping switches.
    John von Neumann became involved with ENIAC and saw the need for storing the program
    in the machine itself, resulting in the EDVAC (Electronic Discrete Variable Calculator)
    design. EDSAC (Electronic Delay Storage Automatic Calculator) was based closely
    on the EDVAC design and was the first stored program computer to become operational.


    The IBM 709 was one of the major vacuum tube computers. It was faster than others,
    which had 4K 36-bit words of core memory. During this period, IBM also sold a
    model 650, which had a magnetic drum memory, but was low in cost that many were
    sold to universities—it was the basis for the first computers user community.'
