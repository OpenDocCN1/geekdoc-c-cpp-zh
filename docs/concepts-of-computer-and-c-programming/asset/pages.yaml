  md: "# White Spaces\n\nThe term white space refers to spaces, tabs, and blank lines\
    \ in your source code. The C compiler is not sensitive to white space. When the\
    \ compiler reads a statement in your source code, it looks for the characters\
    \ in the statement and for the terminating semicolon, but it ignores white space.\
    \ Thus, the statement\n\n```\nx=2+3;\nis equivalent to this statement:\nx = 2\
    \ + 3;\n```\n\n# Null Compound Statement\n\n# Null Statements\n\nIf you place\
    \ a semicolon by itself on a line, you create a null statement--a statement that\
    \ doesn't perform any action. This is perfectly legal in C.\n\n# Compound Statements\n\
    \nA compound statement, also called a block, is a group of two or more C statements\
    \ enclosed in braces. Here's an example of a block:\n\n```\n{\n    printf(\"Hello,\
    \ \");\n    printf(\"World!\");\n}\n```\n\nIn C, a block can be used anywhere\
    \ a single statement can be used. It's a good idea to place braces on their own\
