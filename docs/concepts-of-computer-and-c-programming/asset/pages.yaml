    and execute run program files, and control the input and output devices attached
    to the computer. There are other brands of DOS besides the most known “MS-DOS”,
    PC-DOS, DR-DOS/OPENDOS. Generally speaking, they will all function in the same
    way, especially at the most simple level.


    # Booting


    To run on a computer, it is the first program to be executed when the computer
    is switched on. This led to a problem for the designers, “How can DOS be loaded
    and executed when there is no DOS program running to load and execute ”. Well,
    just as the fictional Baron Munch managed to pull himself up by his own bootstraps,
    the computer manages this seemingly impossible trick, and the term “bootstrapping”,
    or “booting up” is applied to this process. When you start a computer your BIOS
    start a process known as booting and you will get a prompt A:> on screen.


    # Communicate with DOS


    DOS is entirely within a base text system. All it provides for the user is a prompt:
    “C:>” or “A:>”, where the user can use commands in the keyboard. The system is
    entirely case insensitive, either “dir” or “DIR” is same.


    # How Does DOS Organize Disks?


    DOS works within a file, directory and disk drive structure. This means that all
    program and data files are named, and grouped in named directories on disks. ‘Directories’
    are just lists of files.


