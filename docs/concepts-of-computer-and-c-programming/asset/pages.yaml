    # 2.5 I/O MODULE


    In a computer system, the role of microprocessor is to control both Input and
    Output devices. There are units to control input and output signals. An I/O module
    works as a mediator between the processor and I/O devices. It controls the data
    exchange between the external devices and main memory; or external devices and
    CPU registers.


    Therefore, an I/O module provide an interface internal to the computer which connect
    it to CPU and main memory and an internal interface to the computer connecting
    to external device. The I/O module should not only communicate the information
    from CPU to I/O device, but it should also co-ordinate the two. In addition there
    are differences between CPU and I/O devices, the I/O module should have facilities
    like buffer (storage area) and error detection mechanism.


    The input/output module interfaces (I/O module) is normally connected to the computer
    system on one end and one more Input/Output devices on the other. Normally, an
    I/O module can control one or more peripheral devices. An I/O module is needed
    because of:


    +   (a) Diversity and variety of I/O devices makes it difficult to incorporate
    all the peripheral device logic (like its controls, data format etc.) into CPU.
    In this turn will also reduce flexibility of using any new input or output device.

    (b) The I/O devices are normally slower than that of memory and CPU, therefore,
    it is suggested not to use them on high-speed bus directly for communication purpose.

    (c) The data format and word length used by the peripheral may be quite different
    than that of a CPU.


    In computer system there can be two types of I/O interface :


