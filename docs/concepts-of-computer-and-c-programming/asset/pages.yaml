  md: "# 308 Concept of Computer & 'C' Programming\n\nAnswer:\n\nYes.\n\nExplanation:\n\
    \n*b is a pointer to type struct a and so is legal. The compiler knows, the size\
    \ of the pointer to a structure even before the size of the structure is determined(as\
    \ you know the pointer to any type is of same size). This type of structures is\
    \ known as 'self-referencing' structure.\n\n163. Is the following code legal?\n\
    \n```\ntypedef struct a\n{\n    int x;\n    aType *b;\n}\n```\n\nAnswer:\n\nNo\n\
    \nExplanation:\n\nThe typename aType is not known at the point of declaring the\
    \ structure (forward references are not made for typedefeds).\n\n164. Is the following\
    \ code legal?\n\n```\ntypedef struct a aType;\nstruct a\n{\n    int x;\n    aType\
    \ *b;\n}\n```\n\nAnswer:\n\nYes\n\nExplanation:\n\nThe typename aType is known\
    \ at the point of declaring the structure, because it is already defined.\n\n\
    165. Is the following code legal?\n\n```\nvoid main()\n{\n    typedef struct a\
    \ aType;\n    aType someVariable;\n    struct a\n{\n        int x;\n        aType\
    \ *b;\n    };\n}\n```"
  merge: -1
