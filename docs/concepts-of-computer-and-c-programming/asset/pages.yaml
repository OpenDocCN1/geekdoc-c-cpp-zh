  md: '# Computer Organization 43


    ![](img/63ac3e6bb77b9cea9c399e89fe4fe380_56_0.png)


    Fig. 2.15 Storage area network (SAN)


    # Benefits


    Sharing storage usually simplifies storage administration and adds flexibility
    since cables and storage devices do not have to be physically moved to move storage
    from one server to another. Note, though, that with the exception of SAN file
    systems and clustered computing, SAN storage is still a one-to-one relationship.
    That is, each device (or Logical Unit Number (6)) on the SAN is “owned” by a single
    computer (or initiator). In contrast, Network Attached Storage (NAS) allows many
    computers to access the same set of files over a network. It is now possible to
    combine SAN and NAS using a SAN head.


    SAN tends to increase storage capacity utilization, since multiple servers can
    share the same growth. Other benefits include the ability to allow servers to
    boot from the SAN itself. This allows for easy reconfiguration if a replacement
    server can use the own of the faulty server. This process can take as little as
    half an hour and is a relatively new idea been pioneered in newer data centers.
    There are a number of emerging products designed to facilitate and accelerate
    in this process still further. For example, Brocade Systems offers an Application
    Resource Manager which automatically provides servers to boot off a SAN, with
    typical-case load times measured in minutes. While this area is still new, many
    view it as being the future of the enterprise datacenter. SANs tend to enable
    more effective disaster recovery processes. A SAN attached storage array can replicate
    data belonging to many servers to a secondary storage array. This secondary array
    can be local or, more typically, remote. The goal of disaster recovery is to place
    copies of data outside the radius of an anticipated threat, and the long-distance
    transport capabilities of SAN protocols such as Fibre Channel and FCIP are required
    to support these solutions.'
