    # Specifying Return Types


    A function can be declared to return any data type, except an array or function.
    The return statement used in a function returns a single value which type should
    match the one declared in the function declaration. By default, the return type
    of a function is int, if no explicit data type is specified for the function.
    A data type specifier is placed before the name of a function like this:


    ```

    data_type_specifier function_name();

    ```


    Here data_type_specifier specifies the data type that the function should return.
    function_name is the function name that follow the rule of naming in C.


