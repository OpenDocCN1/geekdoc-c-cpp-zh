    Mediates Resource Usage: Modern Operating System allows multiple users to share
    resources freely, efficiently, safely and securely. Examples:


    +   - Multiple processes share one processor.

    - Multiple programs share one physical memory.

    - Multiple users and files share one disk.

    - Multiple programs share a given amount of disk and network bandwidth.


    # 3.3 POPULAR OPERATING SYSTEMS


    Between the hardware and the application software lies the operating system. The
    operating system is a program that conducts the communication between the various
    pieces of hardware like the video card, sound card, printer, the motherboard and
    the applications. Originally the operating system was created by each company
    that manufactured a processor and motherboard. So each operating system was proprietary,
    that is unique to each manufacturer. Now the problem is changing to a new computer
    your software had to be replaced. There is a need to standardize things so that
    software could be transferred to the new computer. This required more-standardization
    in operating systems.


    # MSDOS


    The winner in the PC market was MS-DOS, Microsoft''s Disk Operating System, and
    its twin IBM, PC-DOS, also written by Microsoft. DOS is a commands based operating
    system and very tiny, you can store MS-DOS in a small floppy or today in your
    pen drive. It has command using interface and single user also without networking
    support.


    # Windows


    Windows 95 and 98 are actual operating systems on their own. The previous versions
    of Windows use DOS as the operating system and adding a graphical user interface
    will do multitasking. With Windows 95 released an operating system that can take
    advantage of the 32-bit processes.


    Windows ME (Windows Millennium Edition) is an upgrade of Windows 98, release date
    Sept. 14, 2000. The system resources required for this operating system are significantly
    higher than previous versions of Windows.


    Windows NT (the NT apparently came from New Technology) is an operating system
    for client-server type networks. The latest version of NT has a user interface
    that is practically identical to Windows 95. Since Windows NT is designed for
    the higher demands of networks, it has higher demands itself for disk space and
    memory.


    Windows 2000 is an upgrade of Windows NT rather than of Windows 98.'
