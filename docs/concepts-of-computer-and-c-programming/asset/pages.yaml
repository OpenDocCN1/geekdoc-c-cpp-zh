  md: '# # INTRODUCTION TO COMPUTER


    # 1.1 DEFINITIONS OF COMPUTER


    What is a Computer?


    A computer is an electronic device that executes the instructions in a program
    to process raw facts or figures known as data and convert them into information.


    "One who computes, a calculator, reckoner, specifically a person employed to make
    calculations in an observatory, in surveying, etc." (Oxford English Dictionary,
    1926).


    "A usually electronic device for storing and processing data (usually in binary
    form), according to instructions given to it in a variable program" (The Concise
    Oxford Dictionary, 9th Edition).


    The definitions clearly categorizes computer as an electronic device although
    the initial computers were mechanical and electromechanical, definition is also
    pointing towards the two major areas of computer application, data processing
    and computer assisted operations. Another important confluence of the definitions
    is the fact that computer can perform only those operations/calculations which
    can be expressed in Logical or Numerical terms.


    In the year 2007, when you are learning Information and Communication Technology
    (ICT), a new definition can be:


    A PC is a general-purpose information processing device. It can take information
    from a person (through the keyboard and mouse), from a device (like a floppy disk
    or CD) or from the network (through a modem or a network card) and process it.
    Once processed, the information is shown to the user (on the monitor), stored
    on a device (like a hard disk) or sent somewhere else on the network (back through
    the modem or network card).'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 2 Concept of Computer & ''C'' Programming


    # 1.2 FUNCTIONS OF A COMPUTER


    A computer has four major functions:


    | Accepts data | Input |

    | Processes data | Processing |

    | Produces output | Output |

    | Stores results | Storage |


    So a computer is a general purpose, programmable, (A program is a Meaningful Group
    of instructions written in a specific language aimed to do a specific task) electronic
    gadget capable of doing the following tasks:


    +   1. Data Processing (Numeric & Non Numeric) with a high degree of accuracy
    at a pretty high speed.

    2. Storage of huge amount of information with reasonably high access speed (Like
    Information in Banks, Railway).

    3. Communication Gateway. (Link to the World using Internet).


    # 1.3 JOHN VON NEUMANN COMPUTER ARCHITECTURE


    Most of today''s computer designs are based on concepts developed by John von
    Neumann referred to as the Neumann architecture. Von Neumann proposed that there
    should be a unit performing arithmetic and logical operation on the data. This
    unit is termed as Arithmetic Logic Unit (ALU). A control unit directs the ALU
    to perform specific arithmetic or logic function on the data. Therefore in such
    a system, changing the control signal the desired operation can be performed on
    data. Main components of a von Neumann computer Architecture or block diagram
    of a computer is:


    ![](img/63ac3e6bb77b9cea9c399e89fe4fe380_15_0.png)


    > Fig. 1.1 Block diagram of a computer


    The Arithmetic Logic Unit (ALU) and the Control Unit (CU) together are termed
    as the Central Processing Unit (CPU). The CPU is the most important component
    of a computer''s hardware. The ALU performs the arithmetic operations such as
    addition, subtraction, multiplication and division, and the logical operations
    as: "Is A > B?


    How can the instructions and data be put into the computers? The need to be supplied
    by external devices known as input unit like keyboard. Main responsibility of
    input unit will be to put the data in the form of signals that can be recognized
    by the computer. Similarly, we need another component that will show the results
    in proper format'
  merge: -1
  pgno: 15
