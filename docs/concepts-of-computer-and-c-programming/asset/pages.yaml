  md: '# 11

    POINTERS IN C


    # 11.1 WHY POINTERS ?


    In most of the programs you have written and tested yet, there is a use of variables
    and you can store some value in a variable for later use. Have you ever think
    the location of variables, when you declare a variable,on area of computer it
    will store. In a large computer program there can be thousands of variables, so
    you need some space to store and retrieve them.


    The space used for that is known as RAM (Random Access Memory). If you are aware
    with RAM working you must be aware with the fact that a PC''s RAM consists of
    many thousands of sequential storage locations, and each location is identified
    by a unique-address. The memory addresses in a given range from 0 to a maximum
    value that depends on the amount of memory installed (like 512 MB).


    As you might know, the memory inside your computer is not only used to store name
    and values of program variables but also used to hold the binary code of your
    program, which consists of statistics and data, as well as the binary code of
    the operating system on your machine.


    Each memory location must have a unique address so that the computer can read
    or write to the memory location without any confusion. This is similar to the
    concept that in your institute or university each mobile phone must have a unique
    to call.


    When you declare a variable in a C program, the compiler sets aside a memory location
    with a unique address to store that. The compiler associates that address with
    the variable''s name. When your program uses the variable, it automatically accesses
    the proper memory location. The location''s address is used, but it is hidden
    from you, and you need not be concerned with it. Now you must have some method
    to link with a variable or memory or secondary storage location (may be a file
    ), the only variable which can store address of any location inside computer system
    is pointer.


    209'
  merge: -1
  pgno: 222
