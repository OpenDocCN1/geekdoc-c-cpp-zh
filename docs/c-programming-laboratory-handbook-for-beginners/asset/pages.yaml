  md: 'This code prints out x equals 6

    The assignment inside the if sets x to 6 and returns the value 6 to the if. Since
    6 is not 0, this is interpreted as true.


    3. Arrays in C always start at index 0. This means that an array of 10 integers
    defined as int a[10] has valid indices from 0 to 9 not 10!


    +   * It is very common among students to use a[10], to refer the last element,
    which may lead to segmentation fault/unpredictable error.


    4. If both operands are of an integral type, integer division is used by default

    For example:


    ```

    double half = 1/2;

    ```


    This code sets half to 0 not 0.5!

    Why? Because 1 and 2 are integer constants.


    +   * To fix this, change at least one of them to a real constant.


    ```

    double half = 1.0/2;

    ```


    +   * If both operands are integer variables and real division is desired, cast
    one of the variables to double (or float).


    ```

    int x = 5, y = 2;

    double d = ((double) x)/y;

    ```


    5. In C, a loop repeats the immediate next statement after the loop statement
    in the absence of braces.

    The code:


    ```

    int x = 5;

    while(x > 0);

    x--;

    ```


    is an infinite loop. Why? The semicolon after the while defines the statement
    to repeat as the null statement (which does nothing). Remove the semicolon and
    the loop works as expected.


    6. Another common loop error is to iterate one too many times or one too few.
    Check loop conditions carefully!


    ```

    for(i = 0; i < 10; i++);

    ```


    Output: 10


    7. Prototypes tell the compiler important features of a function: the return type
    and the parameters of the function.

    If no prototype is given, the compiler *assumes* that the function returns an
    int and can take any number having parameters of any type.


    8. Include appropriate header files in the program before using the standard library
    functions.

    **Example:** double x = sqrt(2);

    include the header file math.h'
