- pgno: 8
  md: '# Preface


    This handbook is essentially embodying the art and science of “conversion of problem
    to logic” and aids the learner to develop computer program rather than learning
    only the semantics of the programming constructs. The programming exercises are
    sequenced in the handbook, in sync with the university-defined syllabus for First
    Year Engineering course. The supporting theory makes the content learner centric.


    The depth of this handbook focuses on the kinds of problems that the beginners
    stumble across. Each program in this handbook has been successfully compiled and
    executed for various inputs. Sample programs and practice problem definitions
    related to each term exercise help the learner to strengthen the programming skills
    in an incremental fashion.


    Special acknowledgment goes to all my junior colleagues who not only provided
    material for this handbook, but also successfully compiled and executed all the
    programs. I gratefully acknowledge the senior faculty members of my department
    who shared their knowledge, ideas, provided numerous tips and reshaped the entire
    manual all of which culminated in the completion of this handbook. I owe my sincere
    gratitude to KLE family. Special thanks to our beloved Principal Dr. S. C. Pilli
    and my research guide Dr. S. S. Manvi for their constant moral support. Any errors
    in the manual rest solely on my shoulders.


    Dr. Nandini Sidnal'
