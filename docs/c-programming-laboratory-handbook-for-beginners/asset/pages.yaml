    \ It provides a number of built-in directives and library functions that facilitate\
    \ the development of parallel computing applications.\n\nIn C, an OpenMP directive\
    \ is specified with the help of **#pragma** directive, as shown below:\n\n```\n\
    #pragma omp directive [clause 1] [clause 2] .......\n```\n\n+   - **#pragma omp**\
    \ tells the compiler about the specification of an OpenMP directive\n+   - **directive**\
    \ is a valid OpenMP directive name.\n+   - **clause** list comprises a set of\
    \ clauses associated with the directive.\n\n# The Parallel Directive\n\nIt is\
    \ the OpenMP directive that helps to specify a block of code to be executed in\
    \ parallel via multiple threads.\n\n```\n#pragma omp parallel\n```\n\n+   - For\
    \ parallel programming in C, we make use of a **#pragma omp parallel** expression\
    \ that is defined in *\"omp.h\"* header file.\n+   - So when the compiler comes\
