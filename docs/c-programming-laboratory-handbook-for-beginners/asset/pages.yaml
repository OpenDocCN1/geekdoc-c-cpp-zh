  md: '# Term-Work 1




    Design, develop and execute a program in C to find and output all the roots of
    a given quadratic equation for non-zero coefficients.




    +   • To map the paper–pen method of finding roots of a quadratic equation to
    a flowchart/algorithm and write a C program for the same.

    +   • To understand the usage of appropriate programming constructs.

    +   • To test the program for all possible inputs.




    +   • if…else statement

    +       if(test expression)

    +       {

    +           True block statement(s)

    +       }

    +       else

    +       {

    +           False block statement(s)

    +       }

    +       Statement x;


    If the test expression is true, then the true block statement(s) are executed;
    otherwise the false block statement(s) are executed. In any case, either true
    block or false block will be executed but not both. In both the cases, control
    is transferred subsequently to the statement x.'
