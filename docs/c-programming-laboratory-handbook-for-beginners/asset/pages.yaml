- pgno: 36
  md: '# ### Example


    Calculation of the GCD of 18 and 48:

    The divisors/factors of 18 are 1, 2, 3, 6, 9 and 18.

    The divisors/factors of 48 are 1, 2, 3, 4, 6, 8, 12, 16, 24 and 48.

    So, the common divisors/factors of 18 and 48 are 1, 2, 3 and 6.

    We then have GCD(18, 48) = 6.


    However, this method is not generally applied to large numbers as it is time consuming;
    hence we use Euclid’s algorithm.


    # ### Example


    Calculation of GCD of 142 and 38


    142 = 38 × 3 + 28

    38 = 28 × 1 + 10

    28 = 10 × 2 + 8

    10 = 8 × 1 + 2

    8 = 2 × 4 + 0

    GCD(142, 38) = 2


    The algorithm is based on the following two observations:


    +   - If b divides a, then GCD(a, b) = b.

    +   - This is indeed so because no number (b, in particular) may have a divisor
    greater than the number itself.

    +   - If a = bt + r, for integers t and r, then GCD(a, b) = GCD(b, r).


    # ### Euclidean Algorithm


    +   1. Divide the first number by the second one.

    +   2. If remainder is zero, second number is the GCD.

    +   3. Otherwise, repeat steps 1 and 2 where second number becomes first and remainder
    becomes the second number.


    Let’s look at an example to find the GCD of 40 and 64.


    +   - First number = 40, second number = 64, remainder = 40

    +   - First number = 64, second number = 40, remainder = 24'
