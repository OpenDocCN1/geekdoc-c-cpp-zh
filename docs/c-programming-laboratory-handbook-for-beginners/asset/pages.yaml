    There are circumstances where you want to do the same thing many times. For instance,\
    \ you want to print the same word 10 times. You could type 10 printf functions,\
    \ but it is easier to use a loop. The only thing you have to do is to set up a\
    \ loop that executes the same printf function 10 times. There are three basic\
    \ types of loops which are as follows:\n\n+   1. “for loop”\n+   2. “while loop”\n\
    +   3. “do while loop”\n\n```\nwhile (condition)\n{\n    Action1 /* until condition\
    \ is true action1 is executed*/\n}\nAction2 /* if condition fails action2 is executed*/\n\
    ```\n\nIn programming languages, a while loop is a *control flow statement* that\
    \ allows code to be executed repeatedly based on a given *Boolean* condition.\
    \ A while loop can be thought of as a repeating *if statement*. A *while* construct\
    \ consists of a block of code and a condition. The condition is evaluated, and\
    \ if the condition is *true*, the code within the block is executed. This"
