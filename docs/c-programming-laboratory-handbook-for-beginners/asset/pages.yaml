    \ program with valid and invalid inputs.\n\n\n\nThe for loop is another entry-controlled\
    \ loop that provides a more concise loop control structure. The syntax of for\
    \ loop is as below:\n\n```\nfor(initialization; test-condition; expression)\n\
    {\n    Body of the loop;\n}\n```\n\nExecution of “for loop” is as follows:\n\n\
    +   1. Initialization of loop control variables is done first, using assignment\
    \ statements.\n+   2. Value of the control variable is tested using the test condition,\
    \ which is a relational expression that determines when the loop will exit. If\
    \ the condition is true, the body of the loop is executed; otherwise the loop\
    \ is terminated and the execution continues with the statement that immediately\
    \ follows the loop.\n+   3. When the body of the loop is executed, the control\
    \ is transferred back to the for statement after evaluating the last statement\
    \ in the loop. Now, the expression is evaluated and the condition is tested. This\
    \ process continues till the value of the control variable fails to satisfy the\
    \ test condition."
