- pgno: 51
  md: "# # Horner’s Methodology\n\n+   - Polynomial expression\n+   \n+     P(x) =\
    \ aₙxⁿ + aₙ₋₁xⁿ⁻¹ + aₙ₋₂xⁿ⁻² + … + a₁x + a₀\n+   \n+     Same can be written in\
    \ another form as\n+   \n+     P(x) = (a₀ + x(a₁ + x(a₂ + … + x(aₙ₋₁ + x·aₙ))))\n\
    +   \n+   - In a parenthesized expression, always inner parenthesis is evaluated\
    \ first, hence (aₙ₋₁ + x·aₙ) is evaluated first.\n+   - So we can take a constant\
    \ aₙ as initial value of “result” variable.\n+   \n+     result = aₙ\n+     then,\
    \ P(x) = (a₀ + x(a₁ + x(a₂ + … + x(aₙ₋₁ + x·result))))\n+     Inner term as result\
    \ = (aₙ₋₁ + x·result)\n+     Next term as result = (aₙ₋₂ + x·result)\n+     Next\
    \ term as result = (aₙ₋₃ + x·result)\n+     .\n+     .\n+     .\n+     Outer term\
    \ as result = (a₀ + x·result)\n+   \n+     Generally result = aᵢ + x·result where\
    \ i is from n−1 to 0.\n\n# ## Example\n\nConsider as an example\n\n3x³ + 4x² +\
    \ 7x + 8\n\nIt can be written in another form as\n\n(8 + x * (7 + x * (4 + x *\
    \ 3)))\n\nHence\n\nNumber of multiplications = 3\nNumber of additions = 3.\n\n\
    Number of multiplications in the conventional method are more than the number\
    \ of multiplications in the Horner's method. Hence, Horner's method is efficient."
  merge: -1
  img_proc: true
