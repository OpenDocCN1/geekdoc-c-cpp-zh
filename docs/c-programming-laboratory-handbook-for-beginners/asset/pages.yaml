  md: '# Introduction


    # "C" Programming Language


    C (pronounced like the letter C) is a general-purpose computer programming language
    developed between 1969 and 1973 by Dennis Ritchie at the Bell Telephone Laboratories
    for use with the UNIX operating system. Although C was designed for implementing
    system software, it is widely used for developing portable application software.


    C is an imperative (procedural) systems implementation language. It is a middle-level
    language and it provides best combination of low- and high-level languages. Due
    to this feature, “C” has not lost its importance and popularity in today’s changing
    programming world. All concepts in “C” are useful for understanding some courses
    like OOPs, VB, Java and most of the system software.


    # Objectives


    +   - To develop logic-based reasoning.

    +   - To tackle and convert a given problem statement into a flowchart and an
    algorithm.

    +   - To develop decision-making capability in using appropriate programming constructs
    such as different looping and branching statements, arrays and string handling
    functions, various means of input and output operations, etc.

    +   - To teach a bottom-up method of software development using user-defined functions.

    +   - At the end, students should be in a position to implement programs in C
    language independently.


    # Hardware and Software Requirements


    | Requirement | Details |

    |---|---|

    | Hardware | Core 2 duo, RAM Minimum 256 MB |

    | Operating system | Windows XP/Windows 7/LINUX |

    | Software | Microsoft Visual Studio 2005 |'
