  md: "For example, `a < 10 || a > 100`. An expression of this kind, which combines\
    \ two or more relational expressions, is termed as a logical expression. These\
    \ expressions yield a value of true or false, as shown below:\n\n| *Op1* | *Op2*\
    \ | *Op1 \\|\\| Op2* |\n|---|---|---|\n| True | True | True |\n| True | False\
    \ | True |\n| False | True | True |\n| False | False | False |\n\n# Related Theory:\
    \ Logic Used\n\n***A palindrome*** is a word or a sentence that reads the same\
    \ forward as it does backward. The word “palindrome” was coined from Greek roots\
    \ *palin* (πάλιν: “again”) and *dromos* (δρόμος: “way, direction”) by English\
    \ writer Ben Jonson in the 17th century. Neither spaces nor punctuation are usually\
    \ taken into consideration when constructing sentences that are palindromes –\
    \ one of the most famous palindromes is “A man, a plan, a canal, Panama” – but\
    \ when the spaces are properly positioned as well, so much the better. An example\
    \ would be the also famous palindrome “Able was I ere I saw Elba” purportedly\
    \ spoken by Napoleon, referring to his first sighting of Elba, the island where\
    \ the British exiled him.\n\nPalindromes are a type of palindrome called ***letter\
    \ palindromes***. ***A paligram*** is a sentence in which the letters, syllables\
    \ or *words* read the same backward as *they do forward*. The sentence, “He was,\
    \ was he?” is a word palindrome, because the words can be placed in reverse order\
    \ and still read the same. The sentence, “I did, did I?” is not only a word paligram\
    \ but also a letter paligram (or palindrome) as well. In the same way, integers\
    \ may be palindromes. For example, 1221, 3333, ….\n\n# Sample Program\n\n# Program\
    \ 1\n\nProgram to find the largest of three numbers.This program will give an\
    \ idea of logical operators.\n\n```\n```c\n#include<stdio.h>\nvoid main()\n{\n\
    \  int a, b, c;\n  int big;\n  printf(\"Enter any three numbers: \");\n  scanf(\"\
    %d%d%d\", &a, &b, &c);\n  if(a>b && a>c)\n    big=a;\n```\n```"
