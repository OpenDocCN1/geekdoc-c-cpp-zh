    # ### OpenMP (Open Multi-Processing)


    **OpenMP** (Open Multi-Processing) is an API (application programming interface)
    that supports multi-platform shared memory multiprocessing programming in C, C++,
    and Fortran, on most processor architectures and operating systems, including
    Linux, Unix, AIX, Solaris, Mac OS X, and Microsoft Windows platforms. It consists
    of a set of compiler directives, library routines, and environment variables that
    influence run-time behavior. OpenMP uses a portable, scalable model that gives
    programmers a simple and flexible interface for developing parallel applications
    for platforms ranging from the standard desktop computer to the supercomputer.


    # ### Directives


    +   - `#pragma omp parallel for`

    +   - The parallel construct forms a team of threads and starts parallel execution.

    +   - `#pragma omp parallel for [clause[[,] clause] ...]` new-line

    +   - for-loop


    An OpenMP executable directive applies to the succeeding structured block or an
    OpenMP Construct. A “structured block” is a single statement or a compound statement
    with a single entry at the top and a single exit at the bottom.'
