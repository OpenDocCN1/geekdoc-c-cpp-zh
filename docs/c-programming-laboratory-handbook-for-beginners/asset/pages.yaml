  md: '# Prerequisites for Coding


    **getchar function: getchar();**


    getchar function reads a single character from standard input. It takes no parameters
    and it returns the input character. In general, a reference to the getchar function
    is written as


    ```

    variable = getchar();

    ```


    For example,


    ```

    char c;

    c = getchar();

    ```


    The second line causes a single character to be entered from the standard input
    device and then assigned to c. If an end-of-file condition is encountered when
    reading a character with the getchar function, the value of the symbolic constant
    EOF will automatically be returned.


    This function can also be used to read multi-character strings, by reading one
    character at a time within a multi-pass loop.


    **putchar function: putchar(variable | constant);**


    The standard C function that prints or displays a single character by sending
    it to standard output is called putchar. This function takes one argument, which
    is the character to be displayed.


    For example,


    +   1. putchar (''N''); displays the character N.

    +   2. char var = ''*'';

    +      putchar(var); Displays the character *.


    # Algorithm


    Start


    +   **Step 1:** Input a character.

    +   **Step 2:** If the entered character is non-blank, print it.

    +   **Step 3:** Otherwise print the first blank character and skip all the consecutive
    blanks.

    +   **Step 4:** Repeat steps 1 to 3 till the entered character is a new line character.


    Stop'
