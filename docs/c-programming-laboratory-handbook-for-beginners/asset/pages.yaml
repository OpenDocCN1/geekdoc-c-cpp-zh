  md: "# **Example:** $x^2 = 5x - 6$\n\n$$\n\\begin{aligned}\nx^2 &= 5x - 6 \\\\\n\
    -5x + 6 &= -5x + 6 \\\\\n\\hline\nx^2 - 5x + 6 &= 0 \\\\\n(x-3)(x-2) &= 0 \\\\\
    \n&\\swarrow\\qquad\\searrow \\\\\nx-3 &= 0 \\quad \\text{or} \\quad x-2 = 0\n\
    \\end{aligned}\n$$\n\n$x = 3$ or $x = 2$ are obtained by subtracting $5x$ and\
    \ adding 6 to both sides to get 0 on right side.  \nUse the Null Factor law and\
    \ set each factor = 0 and solve.\n\n# **Example:** $2x^2 - 3x = 0$\n\n$$\n\\begin{aligned}\n\
    2x^2 - 3x &= 0 \\\\\nx(2x-3) &= 0 \\\\\n\\downarrow\\qquad &\\searrow \\\\\nx=0\
    \ &\\quad \\text{or} \\quad 2x-3=0 \\\\\nx=0 &\\quad \\text{or} \\quad x=\\frac{3}{2}\n\
    \\end{aligned}\n$$\n\nRoots of quadratic equation $ax^2 + bx + c = 0$ can be computed\
    \ using formula\n\n$$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$\n\nFirst $r =\
    \ \\sqrt{b^2 - 4ac}$ is computed. Depending on the value of $d = b^2 - 4ac$ roots\
    \ can be real or complex.\n\n+   1. If $d > 0$, that is, if $d$ value is positive,\
    \ then roots are real and distinct. The two roots are computed as follows:\n+\
    \   \n+      $$\n+      \\begin{aligned}\n+      x1 &= (-b + r)/(2.0*a) \\\\\n\
    +      x2 &= (-b - r)/(2.0*a)\n+      \\end{aligned}\n+      $$\n+   \n+     \
    \ If $a = 6$, $b = 11$ and $c = -35$, then $d = (b^2 - 4ac)$. Here\n+   \n+  \
    \    $$\n+      \\begin{aligned}\n+      d &= ((11*11) - (4*6*(-35))) \\\\\n+\
    \        &= 961\n+      \\end{aligned}\n+      $$\n+   \n+      Since $d > 0$,\
    \ the roots are real and distinct.\n\n+   2. If $d = 0$, then roots are real and\
    \ equal.\n+   \n+      $$\n+      x1 = x2 = -b/(2.0*a)\n+      $$\n\n+   3. If\
    \ $d < 0$, then roots are complex.\n+   \n+      $$\n+      \\begin{aligned}\n\
    +      x1 &= -b/(2.0*a) \\\\\n+      x2 &= r/(2.0*a)\n+      \\end{aligned}\n\
    +      $$"
  merge: -1
