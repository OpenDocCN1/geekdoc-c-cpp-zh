  md: "# C Programs to Begin\n\n\n\nWrite a C program to display the message Hello\
    \ World.\n\n```\n/* This program prints one-line message */\n#include<stdio.h>\n\
    int main()\n{\n    printf(\"Hello World\\n\");\n    return 0;\n}\n```\n\n/* This\
    \ program ... */ The symbols /* and */ delimit a comment.\n\nComments are ignored\
    \ by the compiler, and are used to provide useful information for the reader of\
    \ the program.\n\n+   1. **main( )** – C programs consist of one or more functions.\
    \ One and *only* one of these functions must be called as main. The brackets following\
    \ the word main indicate that it is a function and not a variable.\n+   2. **{\
    \ }** – braces surround the body of the function, which consists of one or more\
    \ instructions (*statements*).\n+   3. **printf( )** – is a library function that\
    \ is used to print on the standard output stream (usually the screen).\n+   4.\
    \ **“HelloWorld\\n”** – is a string constant.\n+   5. **\\n** – is the newline\
    \ character.\n+   6. **;** – a semicolon terminates a statement.\n+   7. **return0;**\
    \ – returns the value zero to the operating system.\n\nC is case-sensitive, so\
    \ the names of the functions (main and printf) must be typed in lower case as\
    \ above.\n\n\n\n```\nHello World\n```\n\n\n\nWrite a C program to show addition\
    \ operation along with suitable comments."
