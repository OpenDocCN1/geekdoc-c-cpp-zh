    ```\n```\n\n# ## Related Theory\n\nThe **Euclidean algorithm** (also called **Euclid's\
    \ algorithm**) is an efficient method for computing the greatest common divisor\
    \ (GCD), also known as the greatest common factor (GCF) or highest common factor\
