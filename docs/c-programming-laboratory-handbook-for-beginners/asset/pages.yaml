    +   - To accept an input of random set of numbers and store them in an array.

    +   - To understand the logic of bubble sort technique and code it.


    # ## Related Theory: Logic Used


    Sorting method:


    +   - Bubble sort, also known as sinking sort, is a simple sorting algorithm that
    works by repeatedly stepping through the list to be sorted, comparing each pair
    of adjacent items and swapping them if they are in the wrong order.

    +   - The pass through the list is repeated until no swaps are needed, which indicates
    that the list is sorted.

    +   - The algorithm gets its name from the way smaller elements “bubble” to the
    top of the list. It only uses comparisons to operate on elements, hence it is
    a comparison sort.


    # ## Sort: Transforms an Unordered Collection to an Ordered One


