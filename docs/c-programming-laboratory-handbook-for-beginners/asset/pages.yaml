    \ height[10];\nfloat width[20];\nint min[9];\nchar name[20];\n```\n\nIn C language,\
    \ arrays start at position 0. The elements of the array occupy adjacent locations\
    \ in memory. Any item in the array can be accessed through its index. For example,\n\
    \n$m = \\text{height}[0];$\n\nThe variable $m$ will be assigned the value of the\
    \ first item of the array height.\n\nThe program segment below declares an array\
    \ of five integers and prints all the elements of the array.\n\n```\nint myArray[5]\
    \ = {1, 2, 3, 4, 5};\n```\n\n```\n/* To print all the elements of the array\n\
    for (int i=0; i<5; i++)\n{\n    printf(\"%d\", myArray[i]);\n}\n```\n\n# Related\
    \ Theory: Logic Used\n\nGeneral form of a polynomial is\n\n$p(x) = a_nx^n + a_{n-1}x^{n-1}\
    \ + a_{n-2}x^{n-2} + \\cdots + a_1x + a_0$\n\nConsider an example\n\n$3x^3 + 4x^2\
    \ + 7x + 8$\n\nGenerally a polynomial is evaluated as\n\n$3 * x * x * x + 4 *\
