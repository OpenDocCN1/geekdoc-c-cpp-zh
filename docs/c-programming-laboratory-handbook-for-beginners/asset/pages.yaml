    \    if(cows==5)\n    {\n        printf(\"We have 5 cows\\n\");\n    }\n    else\
    \ if( cows==6)\n    {\n        printf(\"We have 6 cows\\n\");\n    }\n}\n```\n\
    ```\n\n# Sample Output\n\nWe have cows\nExecuting else part...!\nWe have 6 cows\n\
    Press any key to continue . . .\n\n# Related Theory\n\nA quadratic equation is\
    \ an equation equivalent to one of the forms of $ax^2 + bx + c = 0$, where $a,\
    \ b$ and $c$ are real numbers and $a \\neq 0$. So if we have an equation in $x$\
    \ and the highest power is 2, it is quadratic."
