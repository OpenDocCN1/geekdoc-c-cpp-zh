  md: '# Term-Work Definitions




    +   1. Design, develop and execute a program in C to find and output all the roots
    of a given quadratic equation for non-zero coefficients.

    +   2. Design, develop and execute a program in C to implement Euclid''s algorithm
    to find the GCD and LCM of two integers and to output the results along with the
    given integers.

    +   3. Design, develop and execute a program in C to reverse a given four-digit
    integer number and check whether it is a palindrome or not. Output the given number
    with a suitable message.

    +   4. Design, develop and execute a program in C to evaluate the given polynomial
    $f(x)=a_4x^4+a_3x^3+a_2x^2+a_1x+a_0$ for a given value of $x$ and the coefficients
    using Horner''s method.

    +   5. Program to copy/paste input to output and replace each string of one or
    more blanks with a single blank.

    +   6. Design, develop and execute a program in C to input $N$ integer numbers
    in ascending order into a single-dimensional array and then to perform a binary
    search for a given key integer number and report success or failure in the form
    of a suitable message.

    +   7. Design, develop and execute a program in C to input $N$ integer numbers
    into a single-dimensional array, sort them in to ascending order using bubble
    sort technique, and then to print both the given array and the sorted array with
    suitable headings.

    +   8. Design, develop and execute a program in C to compute and print the word
    length on the host machine.




    +   9. Design, develop and execute a program in C to calculate the approximate
    value of exp(0.5) using the Taylor series expansion for the exponential function.
    Use the terms in the expansion until the last term is less than the machine epsilon
    defined as FLT_EPSILON in the header file <float.h>. Print the value returned
    by the mathematical function exp( ) also.

    +   10. Design, develop and execute a program in C to read two matrices $A$ ($M
    \times N$) and $B$ ($P \times Q$) and to compute the product of $A$ and $B$ if
    the matrices are compatible for multiplication. The program is to print the input
    matrices and the resultant matrix with suitable headings and format if the matrices
    are compatible for multiplication, otherwise the program'
