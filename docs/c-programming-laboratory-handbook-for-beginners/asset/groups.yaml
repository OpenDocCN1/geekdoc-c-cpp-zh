    \ 循环。*\n\n```c\n#include<stdio.h>\nvoid main()\n{\n    int count=0;\n    int unsigned\
    \ word;\n    /*All bits of the word are set to one by taking one's\n    complement\
    \ of zero*/\n    word=~0;\n    /*Counting Word Length using bitwise shift operator*/\n\
    \    do\n    {\n        word=word<<1;\n        ++count;\n    }while(word!=0);\n\
    \    printf(\"\\n The word length of this Host Machine is %d Bits \\n\",count);\n\
    }\n```\n\n### 输出\n\n此主机的字长为 32 位\n\n## 学期作业 9\n\n### 问题定义\n\n设计、开发并执行一个 C 程序，使用指数函数的泰勒级数展开计算\
    \ exp(0.5) 的近似值。使用展开式中的各项，直到最后一项小于头文件 <float.h> 中定义为 FLT_EPSILON 的机器 epsilon。打印数学函数\
    \ exp( ) 返回的值。\n\n### 目标\n\n- 理解泰勒级数并使用 C 程序实现它。\n- 识别标准内置库函数以及需要包含的对应头文件。\n-\
    \ 将计算结果与标准内置函数返回的值进行比较以检验准确性。\n\n### 相关理论\n\n泰勒级数是一种将函数表示为简单但无限多项之和的方法。例如，假设你想求\
    \ exp(3.654)。泰勒级数展开允许你将该值表示为简单项之和。exp(x) 的泰勒级数形式为\n\nexp(x) = 1 + (x/1!) + (x²/2!)\
    \ + (x³/3!) + …\n\n（1! 表示阶乘）。如果知道 x 的值，你可以非常容易地计算各项，并将它们相加到所需精度。在统计学和数学中，泰勒级数用于简化和近似。\n\
    \n- 应添加展开式中的各项，直到最后一项小于机器 epsilon  \n  表示为 FLT_EPSILON\n- FLT_EPSILON 宏定义在 float.h\
    \ 中，应在 C 程序中以 `#include <float.h>` 包含。\n- FLT_EPSILON 是 float 类型的最小正浮点数。它应不大于\
    \ 1E-5。\n- exp 函数返回 *e*（自然对数的底）的 *x* 次幂的值。\n\n"
