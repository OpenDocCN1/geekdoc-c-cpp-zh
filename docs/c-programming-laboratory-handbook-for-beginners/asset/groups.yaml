    \ result with the value returned by standard built-in functions for accuracy.\n\
    \n# ## Related Theory\n\nTaylor series is a way of expressing a function as a\
    \ sum of simple but infinite number of terms. For example, suppose you want to\
    \ find exp(3.654). Taylor series expansion allows you to find this value as a\
    \ sum of simple terms. The Taylor series form of exp(x) is\n\nexp(x) = 1 + (x/1!)\
    \ + (x²/2!) + (x³/3!) + …\n\n(1! means factorial). If you know the value of x,\
    \ you can calculate the terms very easily and add them up to required accuracy.\
    \ In statistics and mathematics, Taylor series is used for simplification and\
    \ approximation.\n\n+   - The terms in the expansion should be added until the\
    \ last term is less than the machine epsilon  \n+     Represented as FLT_EPSILON\n\
    +   - FLT_EPSILON macro is defined in float.h and should be included in C program\
    \ as `#include<float.h>.`\n+   - FLT_EPSILON is the minimum positive floating\
    \ point number of type float. It's supposed to be no greater than 1E-5.\n+   -\
    \ The exp function returns the value of *e* (the base of natural logarithms) raised\
    \ to power *x*."
