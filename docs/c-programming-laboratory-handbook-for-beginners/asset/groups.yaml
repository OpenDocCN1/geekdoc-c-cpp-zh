  - "[PAGE 80]\n\nint a = 23, b = 1;\na = 23 is represented in binary form as\n\n\
    \                  0001 0111\n          a << b   →  is to shift a left b times\n\
    \nAfter executing this statement,\n          a = 0010 1110 (46 – decimal value)\n\
    \n# ### Complement Operator (~)\n\n**Bitwise complement operator**\n\nComplements\
    \ each bit.\n\nFor example, int n = 0; /* will store binary zero in memory location*/\n\
    \nIf int data type occupies 32 bits then,\n\nn = 0000 0000 0000 0000 0000 0000\
    \ 0000 0000\n\nn = ~n; /*will store all 1's in memory location*/\n\nThen  ~n =\
    \ 1111 1111 1111 1111 1111 1111 1111 1111\n\n# ### Related Theory\n\nTo find word\
    \ length, we need to know how many bits are actually used to store a given integer\
    \ number. For this, the following logic is employed.\n\n# ### Program Logic\n\n\
    +   - **Step 1:** Store 1 in all bit positions of an integer variable. This is\
    \ done by complementing the number 0 and assigning the result to a program variable\
    \ N = ~ 0;\n\n<table><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>\n\
    \nThis will store all 1's in all the bit positions of the number.\n\n+   - **Step\
    \ 2:** Perform repeated Shift left operation on the number and check if it has\
    \ become zero and every time you shift, increment a counter.\n\n# ### Logic to\
    \ Find Word Length of a Host Machine\n\nUsing given logic,\n\n```\n```c\nn = ~0;\
    \ count = 0;\ndo\n{\n    n = n << 1;\n    count++;\n} while (n != 0);\n```\n```"
