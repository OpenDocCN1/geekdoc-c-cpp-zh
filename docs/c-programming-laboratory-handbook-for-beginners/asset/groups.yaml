    sum = sum + i;

    ```

    ```


    +   3. *Undeclared variables*


    C requires every variable to be declared for its type, before it is used.


    +   4. *Missing & operator in scanf parameters*


    All variables in a `scanf` call should be preceded by an `&` operator. If the
    variable code is declared as an integer, then the statement: `scanf (“%d”,code);`
    is wrong.


    The correct one is: `scanf (“%d”,&code);`


    +   5. *Missing/unmatched braces*


    It is common to forget a closing brace when coding a deeply nested loop. The number
    of opening braces should match with the closing ones.


    +   6. *Using a single equal sign to check equality*


    If you use a single equal sign to check equality, your program will instead assign
    the value on the right side of the expression to the variable on the left-hand
    side. Therefore, use `==` to check for equality.


    +   7. *Undeclared functions*


    Every function that is called should be declared in the calling function for the
    types of value it returns.


    +   8. *Missing quotes*


    Every string must be enclosed in double quotes, while a single-character constant
    must be enclosed in single quotes.


    ```

    **Example:** `char ch = ‘X’ /* X is a character constant */`

    ```


    ```

    ```c

    char ch = "hello" /* hello is a string */

    ```

