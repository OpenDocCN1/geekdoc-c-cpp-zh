    \n## 右移\n\n在表达式 `n >> d` 中，数字 *n* 向右移动 *d* 位。向右移位时，最右边的位将丢失，并在左侧填充 0。\n\n### 示例\n\
    \n0100 1001（十进制数 73）  \n将上述二进制数右移 4 位，得到数字  \n0000 0100（十进制数 4）\n\n## 4 位字长的右旋转\n\
    \n将以下数字 13 右旋转 1 位  \n13 的二进制形式为：1101\n\n![](img/dad8bddd927fabdab2417ecbf1eb24eb_110_0.png)\n\
    \n右旋转 1 位后\n\n![](img/dad8bddd927fabdab2417ecbf1eb24eb_110_1.png)\n\n## 右旋转的主要逻辑\n\
    \n- 1. 将数字右移 *n* 位\n- 2. 将数字左移 32 - *n* 位\n- 3. 对上述结果进行按位或\n\n## 算法\n\n开始\n\n\
    - **步骤 1：** 读取一个数字 *x*\n- **步骤 2：** 读取要旋转的位数 *n*\n- **步骤 3：** 调用 `rightrot` 函数\
    \  \n  `result ← rightrot(x, n)`\n- **步骤 4：** 打印结果\n\n停止\n\n## 将 x 旋转 n 位的算法\n\
    \n开始\n\n- **步骤 1：** 将 *x* 右旋转 *n* 位  \n  `a ← x >> n;`  \n  `b ← x << (32 - n);\
    \ /* assuming 32-bit machine */`\n- **步骤 2：** 返回 `(a | b)`\n\n停止\n\n## 程序\n\n\
    ```c\n#include<stdio.h>\nunsigned int rightrot(int, int); /* prototype declaration\
    \ */\nvoid main()\n{\n    int x, n;\n    unsigned int result;\n    printf(\"Enter\
    \ the number to be right rotated \\n\");\n    scanf(\"%d\",&x);\n    printf(\"\
    Enter the number of bits to be right rotated \\n\");\n    scanf(\"%d\",&n);\n\
    \    result=rightrot(x,n); /* call to function rightrot(x,n) */\n    printf(\"\
    The number %d after right rotation by %d bit positions is %u\",x,n,result);\n\
    }\n\nunsigned int rightrot(int x, int n)\n{\n    unsigned int a,b;\n    a=x >>\
    \ n;       /* right shift by n bits */\n    b=x << (32-n);      /* left shift\
    \ by 32-n bits */\n    return (a | b);        /* bitwise OR a and b */\n}\n```\n\
