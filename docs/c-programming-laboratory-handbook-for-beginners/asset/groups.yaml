    \ 13\n\n### 问题定义\n\n设计并开发一个函数 `isprime(x)`，它接受一个整数参数，如果该参数是素数则返回 1，否则返回 0。该函数将使用简单的除法检查方法来确定给定数字是否为素数。在\
    \ main 中根据用户输入的不同值调用此函数，并打印适当的消息。\n\n### 目标\n\n- 能够将寻找素数的纸笔方法映射为算法，然后编写 C 代码。\n\
    - 理解函数的用法。\n- 理解如何优化逻辑进而优化处理时间。\n\n### 相关理论\n\n### 素数\n\n只能被 1 和自身整除的数称为素数。例如\
    \ 2、3、5、7、11 等不能被除 1 和自身以外的任何数整除，因此它们都是素数。但 4、6、8、16 等数可以被 2 整除，因此它们是非素数。\n\n\
    ### 程序逻辑\n\n现在让我们看看如何检查一个数是否为素数。\n\n- 考虑数字 16，它不能被 9、10、11、12、13、14 整除——这些数都大于\
    \ 16/2。但 16 能被 2、4、8 整除，而这些数小于或等于 16/2。\n- 因此要记住的第一点是：一个数 $n$ 不能被大于 $n/2$ 的数整除。\n\
    - 因此，要检查给定数字 $n$ 是否为素数，只需用 2、3、4、5、…、$n/2$ 去除 $n$ 即可。\n\n### 算法\n\n```text\nStep\
    \ 1: [Start of algorithm]\nStep 2: [Read the value of n]\n    Read n\nStep 3:\
    \ [Check for validation]\n    Check n = 0 or n = 1 then\n    print n is neither\
    \ prime nor composite goto step 6\nStep 4: [Call the function]\n    j = isprime(n)\n\
    Step 5: Check j = 1 then\n    print the number n is prime\n        otherwise print\
    \ the number n is not prime\nStep 6: [End of Algorithm]\n    Stop\n```\n\n###\
    \ 被调用函数 `int isprime(int x)` 的算法\n\n```text\nStep 4.1: Repeat for i = 2 to x/2\n\
    \        check x % i = 0 then\n            return 0\n            otherwise\n \
    \               continue next i\nStep 4.2: Return 1\n```\n\n### 流程图\n\n![](img/dad8bddd927fabdab2417ecbf1eb24eb_117_0.png)\n\
    \n### 函数的流程图\n\n![](img/dad8bddd927fabdab2417ecbf1eb24eb_118_0.png)\n\n### 程序\n\
    \n```c\n#include<stdio.h>\n#include<process.h>\nvoid main()\n{\n    int j,n;\n\
    \    int isprime(int x);  /* Function prototype */\n    printf(\"Enter the number:\\\
    n\");\n    scanf(\"%d\",&n);\n    if(n==0||n==1)\n    {\n        printf(\"The\
    \ number %d is neither prime nor composite\\n\",n);\n        exit(0);\n    }\n\
    \    j = isprime(n);\n    if(j==1)\n        printf(\"The given number is prime\\\
    n\");\n    else\n        printf(\"Number is not prime\\n\");\n}\n\n// Function\
    \ to check whether the given value is prime or not\n\nint isprime(int x)  /* Function\
    \ definition */\n{\n    int i;  /* Local declaration */\n    for(i=2;i<=x/2;i++)\n\
    \    {\n        if(x%i==0)\n        {\n            return 0;  /* Number is not\
    \ a prime */\n        }\n    }\n    return 1;  /* Number is prime */\n}\n```\n\
    \n### 示例输出\n\n- 1. 输入数字：  \n  7  \n  给定的数是素数\n- 2. 输入数字：  \n  10  \n  给定的数不是素数\n\
    - 3. 输入数字：  \n  16  \n  给定的数不是素数\n- 4. 输入数字：  \n  0  \n  数字 0 既不是素数也不是合数\n- 5.\
    \ 输入数字：  \n  1  \n  数字 1 既不是素数也不是合数\n\n### 学习成果\n\n- 能够处理函数和传递参数。\n- 能够优化逻辑和代码。\n\
    \n## 学期作业 14\n\n### 问题定义\n\n设计、开发并执行一个 C 并行程序，利用埃拉托色尼筛法算法确定并打印小于 100 的素数。\n\n\
    ### 目标\n\n- 学习并行编程和函数的概念。\n- 理解使用埃拉托色尼筛法算法寻找素数的底层逻辑，并为此编写程序。\n\n### 编码前提条件\n\n\
    ### OpenMP（Open Multi-Processing）\n\n**OpenMP**（Open Multi-Processing）是一个 API（应用程序编程接口），在大多数处理器架构和操作系统上支持\
    \ C、C++ 和 Fortran 的多平台共享内存多处理编程，包括 Linux、Unix、AIX、Solaris、Mac OS X 和 Microsoft\
    \ Windows 平台。它由一组影响运行时行为的编译器指令、库例程和环境变量组成。OpenMP 使用可移植、可扩展的模型，为程序员提供简单灵活的接口，用于开发从标准台式计算机到超级计算机等平台上的并行应用。\n\
    \n### 指令\n\n- `#pragma omp parallel for`\n- 并行构造形成一组线程并开始并行执行。\n- `#pragma omp\
    \ parallel for [clause[[,] clause] ...]` 换行\n- for 循环\n\nOpenMP 可执行指令应用于其后的结构化块或一个\
    \ OpenMP 构造。“结构化块”是顶部只有一个入口、底部只有一个出口的单个语句或复合语句。\n\n"
