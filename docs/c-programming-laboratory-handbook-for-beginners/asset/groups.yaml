  - "[PAGE 6]\n\n# Foreword\n\nI am very happy that a team of young teachers from\
    \ the Department of Computer Science and Engineering, K.L. Dr. M.S. Sheshgiri\
    \ College of Engineering and Technology, Belgaum has produced this beautiful book\
    \ “*C Programming Laboratory Handbook for Beginners*”. This collective effort,\
    \ based on the long experience of the authors involved in teaching programming\
    \ in “C”, succeeds eminently not only in explaining “C” but also in conveying\
    \ the spirit of solving problems using “C”!\n\nThe authors use a set of team exercises\
    \ to expose the readers to different features of “C” as well as problem-solving\
    \ using “C”. These sections are structured well. The problem definition is followed\
    \ by the objectives, prerequisites for coding the solution, related theory, the\
    \ actual algorithm, the corresponding flowchart, the actual program, and then\
    \ the sample outputs and outcomes. Where appropriate, this is followed by a set\
    \ of related programs and practice programs. This structure allows the students\
    \ to gain a deep understanding of the issues involved! An extremely useful section\
    \ at the end of the book describes common programming errors and this section\
    \ clearly demonstrates the deep familiarity of the authors with novice programmers\
    \ and the types of mistakes they generally commit. Another interesting feature\
    \ of the book is that the authors provide, wherever possible, alternative approaches\
    \ to solving problems. This pedagogic technique will definitely help the readers\
    \ in getting a proper perspective of the art of programming!\n\nI congratulate\
    \ the teachers for producing this beautiful book and wish them all the best.\n\
    \nI am confident that students will find this book very useful.\n\nDr. K. Rajanikanth\
    \  \nFormer Principal, M.S. Ramaiah Institute of Technology  \nBangalore"
