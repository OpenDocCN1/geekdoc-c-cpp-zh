    30\n45\n62\n78\n```\n\n## 学期作业 8\n\n### 问题定义\n\n设计、开发并执行一个 C 程序，以计算并打印主机上的字长。\n\
    \n### 目标\n\n计算存储给定整数所用的位数。\n\n### 编码前提条件\n\n#### Do While 循环语法\n\n```text\nInitialization\
