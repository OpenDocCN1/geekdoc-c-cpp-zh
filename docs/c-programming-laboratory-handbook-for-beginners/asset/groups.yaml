    \nC 中的函数是一个独立的模块，将被调用以执行特定任务。当它被调用时，它接收零个或多个数据，对其进行操作并将最多一个数据返回给调用函数。\n\n> **注意：**\
    \ 在 C 中，程序由一个或多个函数组成，其中一个且只有一个必须称为 main。\n\n程序的执行总是从 main 开始，但它可以调用其他函数来完成部分工作。\n\
