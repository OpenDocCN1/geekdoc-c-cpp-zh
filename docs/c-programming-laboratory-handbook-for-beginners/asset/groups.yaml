    # # Acknowledgements


    > > “Teamwork divides the task and multiplies the success”


    ![](img/dad8bddd927fabdab2417ecbf1eb24eb_10_0.png)


    The statement by Henry Ford, “Coming together is a beginning, Staying together
    is a progress and working together is a success” is proved by us. I would like
    to thank all of those who toiled hard towards the successful completion of this
    hand book.


    This handbook is an outcome of combined effort put in by Sushma Chougule, Uttam
    Patil, S.M. Patil, Soumya Melmathi, Manisha Tarle, Savita Bakare, Arundhati Nelli,
    Roopa Patil, and Rashmi Patil.'
