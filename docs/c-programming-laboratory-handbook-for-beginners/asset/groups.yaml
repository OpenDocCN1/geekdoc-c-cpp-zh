    # String Structure


    When a compiler assigns a string to character array then it automatically appends
    **null character (''\0'')** at the end of the string. Thus, size of string = original
    length of string.


    ```

    char name[7];

    name = "TECHNO"

    ```


    | ''T'' | ''E'' | ''C'' | ''H'' | ''N'' | ''O'' | ''\0'' |

    | :---: | :---: | :---: | :---: | :---: | :---: | :---: |

    | 1 | 2 | 3 | 4 | 5 | 6 | 7 |


    # Read Strings


    To read a string, we can use *scanf()* function with format specifier `%s`.


    ```

    char name[50];

    scanf("%s",name);

    ```


    The above format allows accepting only that string which does not have any blank
    space, tab, new line, form feed, or carriage return.


    However, C supports a library function known as *gets* that allows reading a string
    of text containing whitespaces. This is a simple function with one-string parameter.


    ```

    gets(name);

    ```


    where name is a string variable.


    # Write Strings


    To write a string, we can use *printf()* function with format specifier `%s`.


    ```

    char name[50];

    scanf("%s",name);

    printf("%s",name);

