  mdcn: "\n## matchany 函数的算法\n\n```text\n1. FOR i = 0 to str1[i] ≠ Null in steps of\
    \ 1\n   FOR j = 0 to str2[j] ≠ Null in steps of 1\n       IF str1[i] = str2[j]\
    \ then\n           Return i + 1\n       End IF\n   End For\nEnd For\n2. Return\
    \ -1\n```\n\n## 流程图\n\n![](img/dad8bddd927fabdab2417ecbf1eb24eb_142_0.png)\n\n\
    ## 程序\n\n```c\n#include<stdio.h>\nvoid main()\n{\n    char str1[20],str2[20];\n\
    \    int j;\n    int matchany(char str1[40],char str2[40]);\n    printf(\"\\n\
    \ Enter The First String : \");\n    gets(str1);\n    printf(\"\\n Enter The Second\
    \ String : \");\n    gets(str2);\n    j=matchany(str1,str2);\n    if(j==-1)\n\
    \    printf(\"\\n No Match Found...\\n\");\n    else\n    printf(\"\\n Match Found\
    \ At Position %d  in str1 And The Character Is : %c\\n\",j,str1[j-1]);\n}\nint\
    \ matchany(char str1[40],char str2[40])\n{\n    int i,j;\n    for(i=0;str1[i]!='\\\
    0';i++)\n    {\n        for(j=0;str2[j]!='\\0';j++)\n        {\n            if(str1[i]==str2[j])\n\
    \            {\n                return(i+1);\n            }\n        }\n    }\n\
    \    return -1;\n}\n```\n\n### 输出\n\n```text\n1.\nEnter The First String : computer\n\
    Enter The Second String : game\nMatch Found At Position 3 in str1 And The Character\
    \ Is : m\n\n2.\nEnter The First String : book\nEnter The Second String : pen\n\
    No Match Found...\n```\n\n## 成果\n\n- 能够处理字符串和函数。\n- 能够编辑并查找给定文本中子字符串出现的频率。\n-\
    \ 能够将此逻辑应用于文本格式和编辑。\n\n## 相关程序\n\n### 程序 1\n\nC 程序用于检查字符在给定字符串中出现的频率。\n\n```c\n\
    #include<stdio.h>\n#include<string.h>\nmain()\n{\n    char str[100],ch;\n    int\
    \ i,count=0,length;\n    printf(\"\\n Enter The String : \");\n    gets(str);\n\
    \    printf(\"\\n Enter the character to be searched : \");\n    scanf(\"%c\"\
    ,&ch);\n    length=strlen(str);\n    for(i=0;i<length;i++)\n    {\n        if(str[i]==ch)\n\
    \            count++;\n    }\n    printf(\"\\n The frequency of the occurrence\
    \ of %c is %d\\n\\n\", ch,count);\n}\n```\n\n### 输出\n\n```text\n1.\nEnter The\
    \ String : computer is an electronic device\nEnter the character to be searched\
    \ : e\nThe frequency of the occurrence of e is 5\n\n2.\nEnter The String : A string\
    \ is a collection of characters\nEnter the character to be searched : a\nThe frequency\
    \ of the occurrence of a is 3\n```\n\n## 练习程序\n\n1. 设计并开发一个 C 程序，在找到指定字符后显示结果字符串。\n\
    2. 设计并开发一个 C 程序，从给定字符串中找到子字符串。\n3. 设计并开发一个 C 程序，按字母顺序对名称列表进行排序。\n\n## 常见的 C 编程错误\n\
    \n1. *缺少分号*\n\n   每个 C 语句必须以分号结束。缺少分号可能会导致错误信息。\n\n   **示例：** `a = x + y`\n\n\
    2. *分号误用*\n\n   另一个常见错误是在错误的位置放置分号。\n\n   **示例：**\n\n   ```c\n   for (i = 1; i\
    \ <= 10; i++);\n   sum = sum + i;\n   ```\n\n3. *未声明的变量*\n\n   C 要求在使用变量之前必须为其类型声明。\n\
    \n4. *scanf 参数中缺少 & 运算符*\n\n   `scanf` 调用中的所有变量都应以 `&` 运算符为前缀。如果变量 code 被声明为整数，则语句：`scanf\
    \ (\"%d\",code);` 是错误的。\n\n   正确的是：`scanf (\"%d\",&code);`\n\n5. *缺少/不匹配的大括号*\n\
    \n   编码深度嵌套循环时，经常会忘记关闭大括号。打开大括号的数量应与关闭大括号的数量相匹配。\n\n6. *使用单个等号检查相等性*\n\n   如果使用单个等号来检查相等性，程序将改为将右侧表达式的值赋给左侧变量。因此，使用\
    \ `==` 来检查相等性。\n\n7. *未声明的函数*\n\n   每个被调用的函数都应在调用函数中为其返回的值的类型声明。\n\n8. *缺少引号*\n\
    \n   每个字符串必须用双引号括起来，而单字符常量必须用单引号括起来。\n\n   **示例：** `char ch = 'X' /* X is a character\
    \ constant */`\n\n   ```c\n   char ch = \"hello\" /* hello is a string */\n  \
    \ ```\n\n9. *越界数组*\n\n   C 中的数组总是从索引 0 开始。这意味着定义为 **示例：** `int a[10]` 的 10 个整数的数组的有效索引是从\
    \ 0 到 9 而不是 10！\n\n10. *不正确的注释字符*\n\n    每个注释都应以 `/*` 开始并以 `*/` 结束。它们之间的任何内容都会被编译器忽略。\n\
    \n    **示例：**\n\n    ```c\n    /* comment line 1\n            Statement 1;\n \
    \           Statement 2;\n    /* comment line 2 */\n            Statement 3;\n\
    \            Statement 4;\n            ............\n    ```\n\n    由于注释行 1 中缺少结束的\
    \ `*/`，所有后续语句直到注释 2 中的结束注释 `*/` 都会被忽略。\n\n## 注意事项\n\n1. `int x = 2;`\n\n   ```c\n\
    \   switch(x)\n   {\n           case 2: printf(\"Two\\n\");\n           case 3:\
    \ printf(\"Three\\n\");\n   }\n   ```\n\n   打印输出：\n\n   ```\n   Two\n   Three\n\
    \   ```\n\n   在每个 case 之后放置一个 break 以退出 switch。\n\n2. C 编译器在 `=` 被使用而实际想要 `==`\
    \ 时通常不会标记错误。\n\n   C 的 `=` 运算符专门用于赋值并返回所赋的值。`==` 运算符专门用于比较并返回一个整数值（*假* 为零，*真*\
    \ 为非零）。\n\n   **示例：** `int x = 5;`\n\n   ```c\n   if (x = 6)\n       printf(\"\
    x equals 6\\n\");\n   ```\n\n   此代码打印出 `x equals 6`。`if` 中的赋值将 x 设置为 6 并返回值为 6\
    \ 给 `if`。由于 6 不是 0，因此被解释为真。\n\n3. C 中的数组总是从索引 0 开始。这意味着定义为 `int a[10]` 的 10 个整数的数组的有效索引是从\
    \ 0 到 9 而不是 10！\n\n   学生中非常常见的是使用 `a[10]` 来引用最后一个元素，这可能导致段错误/不可预测的错误。\n\n4. 如果两个操作数都是整数类型，则默认使用整数除法。例如：\n\
    \n   ```c\n   double half = 1/2;\n   ```\n\n   此代码将 half 设置为 0 而不是 0.5！为什么？因为\
    \ 1 和 2 是整数常量。\n\n   为修复此问题，将其中至少一个更改为实数常量。\n\n   ```c\n   double half = 1.0/2;\n\
    \   ```\n\n   如果两个操作数都是整数变量并且需要实数除法，则将其中一个变量强制转换为 double（或 float）。\n\n   ```c\n\
    \   int x = 5, y = 2;\n   double d = ((double) x)/y;\n   ```\n\n5. 在 C 中，如果没有大括号，循环会重复循环语句之后紧跟的下一个语句。代码：\n\
    \n   ```c\n   int x = 5;\n   while(x > 0);\n   x--;\n   ```\n\n   是一个无限循环。为什么？`while`\
    \ 后的分号将要重复的语句定义为空语句（什么都不做）。删除分号，循环按预期工作。\n\n6. 另一个常见的循环错误是迭代次数过多或过少。仔细检查循环条件！\n\
    \n   ```c\n   for(i = 0; i < 10; i++);\n   ```\n\n   输出：10\n\n7. 原型告诉编译器函数的重要特征：返回类型和函数的参数。如果没有提供原型，编译器\
    \ *假设* 函数返回一个 int 并且可以接受任意数量的任意类型的参数。\n\n8. 在使用标准库函数之前，在程序中包含适当的头文件。\n\n   **示例：**\
    \ `double x = sqrt(2);` 包含头文件 `math.h`。\n\n## C 编程实验室\n\n### 初学者手册\n\n**Wiley\
