    # Difference between Sequential and Parallel Programming


    | Sequential Programming | Parallel Programming |

    |---|---|

    | Sequential programming involves a consecutive and ordered execution of processes
    one after another<br>Sequential programming, processes are run one after another
    in a succession fashion | Parallel programming involves the concurrent computation
    or simultaneous execution of processes or threads<br>Parallel computing, multiple
    processes execute at the same time |


    # Parallel Computing


    Parallel computing is the execution of multiple tasks concurrently in a computer
    system. For example, a large problem to be solved can be broken into multiple
    small-sized problems, which are then solved in parallel to arrive at the final
    solution.'
