    \ (ebk)\n\nwww.wileyindia.com\n\n印刷：*Chaudhry Press, Delhi*\n\n## 序言\n\n我非常高兴，来自贝尔高姆\
    \ KLE Dr. M.S. Sheshgiri 工程技术学院计算机科学与工程系的一支青年教师团队编写了这本精美的书《*C 语言编程实验室初学者手册*》。这一集体成果基于作者们长期从事“C\
    \ 语言”编程教学的经验，不仅出色地讲解了“C 语言”，还传达了使用“C 语言”解决问题的精神！\n\n作者运用一系列团队练习，向读者展示了“C 语言”的不同特性以及如何使用“C\
    \ 语言”解决问题。这些章节结构良好。问题定义之后是目标、编写解决方案的前置条件、相关理论、具体算法、对应流程图、实际程序，然后是示例输出和结果。在适当的地方，还会附上一组相关程序和练习程序。这种结构使学生能够深入理解所涉及的问题！书末有一个极其有用的部分介绍了常见编程错误，这部分清楚地表明作者对初学者及其常犯的错误类型非常熟悉。本书另一个有趣的特点是，作者在可能的情况下提供了解决问题的替代方法。这种教学技巧必将帮助读者正确认识编程艺术！\n\
    \n我祝贺各位老师编写出这本精美的书，并祝愿他们一切顺利。\n\n我相信学生们会发现这本书非常有用。\n\nDr. K. Rajinikanth  \n前校长，M.S.\
    \ Ramaiah 技术学院  \n班加罗尔\n\n## 前言\n\n本手册本质上体现了“将问题转化为逻辑”的艺术与科学，帮助学习者编写计算机程序，而不只是学习编程结构的语义。手册中的编程练习按照大学规定的一年级工程学课程大纲编排。配套的理论使内容以学习者为中心。\n\
    \n本手册的深度聚焦于初学者容易遇到的问题类型。手册中的每个程序均已针对各种输入成功编译和执行。与每个实验课相关的示例程序和练习问题定义，帮助学习者循序渐进地加强编程技能。\n\
    \n特别感谢我所有的青年同事，他们不仅为本手册提供了素材，还成功编译并执行了所有程序。我衷心感谢系里的资深教师，他们分享了知识、想法，提供了大量建议，并重新修改了整个手册，最终促成了本手册的完成。我由衷感谢\
    \ KLE 大家庭。特别感谢我们敬爱的校长 Dr. S. C. Pilli 和我的研究导师 Dr. S. S. Manvi 一直以来的精神支持。手册中的任何错误均由我一人承担。\n\
    \nDr. Nandini Sidnal\n\n## 致谢\n\n> > “团队合作分解任务，倍增成功”\n\n![](img/dad8bddd927fabdab2417ecbf1eb24eb_10_0.png)\n\
    \n亨利·福特的名言：“聚在一起是开始，保持在一起是进步，合作共事是成功。”我们证明了这句话。我要感谢所有为这本手册的顺利完成而辛勤工作的人。\n\n这本手册是\
    \ Sushma Chougule、Uttam Patil、S.M. Patil、Soumya Melmathi、Manisha Tarle、Savita\
    \ Bakare、Arundhati Nelli、Roopa Patil 和 Rashmi Patil 共同努力的成果。\n\n## 目录\n\n|  |\
