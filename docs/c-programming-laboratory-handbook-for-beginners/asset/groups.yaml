    \ 函数。\n\n```\nchar name[50];\nscanf(\"%s\", name);\n```\n\n上述格式只允许接受不含任何空格、制表符、换行符、换页符或回车符的字符串。\n\
    \n然而，C 支持一个名为 *gets* 的库函数，它允许读取包含空白字符的文本字符串。这是一个带一个字符串参数的简单函数。\n\n```\ngets(name);\n\
