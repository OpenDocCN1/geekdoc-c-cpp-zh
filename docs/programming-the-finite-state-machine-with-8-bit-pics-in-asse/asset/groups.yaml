    alternating voltage. LEDs have the disadvantage that they require several milliamps
    per segment. There are lots of 7-segment LED displays available. I am using a
    single digit display. Figure 2-8 shows the physical connections for one typical
    pattern. The displays come in two distinct arrangements, common cathode, and common
    anode. With common cathodes, the cathodes must be connected to 0V. With common
    anode, anodes must be connected to +5V. The segment connections are then connected
    to the output pins of the PIC. The logic of the output code has to be designed
    to suit the polarity of the display. It would be easier if you use a display with
    this pinout arrangement, but if not you will have to work out your own wiring.
    The LA-601VB common anode display that can be supplied by RS Components is similar
    to the one I used. Farnell has a similar one (part number SA52-11SRWA).


    ![](img/a08bd00952da48f769971864f33af432_45_0.png)


    As there are a total of 8 LEDs to drive, the 16F1823 PIC is used. This has an
    extra IO port, PORTC. Let’s start with Figure 2-9 - the circuit diagram for connections
    to the PIC.


    Figure 2-8 Connections for Typical 7-Segment LED Displays


    ![](img/a08bd00952da48f769971864f33af432_46_0.png)


    The next part of the design process is to draw the finite state machine diagram
    (see Figure 2-10). Machine *M1* is the display driver. On power-on, the LED is
    initialised to on, and then machine *M0* starts in state 0. After 0.25s, the timer
    expires and machine 0 transitions to state 1. The timer is reset, the LED turned
    off, the pulse counter is incremented by 1 and a signal called *UPDATE* is set
    to high. This *UPDATE* signal is used by machine 1. While in state 1, when the
    timer expires at 0.75s, the machine transitions to state 0 and the timer resets
    and its LED turned on. This continues indefinitely. When in state 1, if the pulse
    counter has reached 10, there is a transition to the same state. This is to reset
    the pulse counter to zero. Meanwhile, machine *M1* is running independently but
    time sharing the CPU. Machine *M1* starts in state 0 and the display will be blank.
    When the *UPDATE* signal goes high, the machine transitions to state 2 and resets
    the *UPDATE* signal to low. Depending on the value of the variable *N*, the machine
    transitions back to state 1, driving on and off the necessary segments of the
    display. The machine will remain in state 0 waiting for another update signal.
    The output details shown for machine *M1* are for a common anode display. The
    comments in the code show the alternatives for a common cathode display.


    Figure 2-9 Connections for the PIC 16F1823 and 7-Segment LED Display


    ![](img/a08bd00952da48f769971864f33af432_47_0.png)


    Nearly everything in program *prog_02_03.asm* has been already explained, except
    for one thing you have to watch out for: The READ MODIFY WRITE problem that can
    happen when using the *BSF* and *BCF* instructions. Up to now, we have only been
    setting one output pin by setting the bit value on *PORTA*. This works if you
    are only working with one output pin on a port but something strange happens when
    trying to alter an output shortly after altering a different pin. To understand
    the problem, we have to look at basic electrical theory regarding charging and
    discharging capacitors, along with how the PIC handles changing the value of one
    pin at a time. When the PIC writes to outputs it can only write to a complete
    byte or eight bits, so to change one bit it has to read the state of the pins,
    modify the one it wants to alter, and then write back to the outputs. The problem
    is that say *PORTA* bit 5 (physical pin 2) has been changed from 0 to 1, and then
    in the next instruction, you want to change the value on *PORTA* bit 4 (physical
    pin 3). The PIC reads the values on the *PORTA* pins - you might expect the value
    on bit 5 to be high as you have just set it, but NO because in the real world
    the electrical circuit could be capacitive and it will take time for the voltage
    to rise, resulting in the value of bit 5 reading as low. When the outputs are
    written back to port, bit 5 (pin 2) gets set back to low. This is an example of
    where testing in a simulator can let you down. Generally, when using *BCF* and
    *BSF* you should write to the latch registers for the ports (*LATA* and *LATC*).
    If however, you are writing to the whole port as a register, for example using
    *MOVWF PORTA*, then this is safe.


    Figure 2-10 State Diagram for Program 2-3


    ```asm

    ; prog_02_03.asm

    ; Page numbers refer to the data sheet DS413; Tables refer to the book.

    LIST=16f1823

    #include <16f1823.inc>

    #include <fsm_macros.inc>


    ; Default numbers are to base 10.

    __CONFIG 0x8007, (FOSC_INTOSC & WDTE_OFF & PWRTE_OFF & CP_OFF & BREN_OFF & IEO_OFF),
    0x808 (LVP_ON)


    BLOCK 0x70

    TICK_COUNTER

    STATE_M0

    STATE_M1

    PULSE_COUNTER

    UPDATE


    ORG 0x00

    GOTO START


    ORG 0x04 ; Interrupt vector.

    BCF INTCON, TMR0IF ; Clear the TMR0 overflow flag.

    INCF TICK_COUNTER, F ; Increment TICK_COUNTER in the file.

    RETFIE ; Return from interrupt.


    START

    BCF TRISA, 2 ; Configure PORTA bit 2 as an output.

    BCF TRISA, 4 ; Configure PORTA bit 4 as an output.

    CLRF TRISC ; Configure all of PORTC as outputs.

    MOVLW 0xD7 ; See Table 2-2

    MOVWF OPTION_REG ; Set 2MHz, page 164.

    MOVLW 0xE0

    MOVWF INTCON ; Page 86 in the data sheet and Table 2-3.

    CLRF STATE_M0 ; Initialise STATE_M0 to 0.

    CLRF STATE_M1 ; Initialise STATE_M1 to 0.

    CLRF UPDATE ; Initialise UPDATE to low.

    CLRF PULSE_COUNTER ; Initialise PULSE_COUNTER to 0.

    CLRF TICK_COUNTER ; Initialise TICK_COUNTER to 0.

    MOV2 ; To access LATA and LATC for the rest of the program.

    BSF LATA, 2 ; Initialise LED on

    MOVLW 0xFF ; For common cathode 0x00. Initialise blank display.

    MOVWF PORTC

    BSF LATA, 4 ; For common cathode use BCF. Initialise blank display.


    SWITCH_M0

    MOVF STATE_M0, W ; Move STATE_0 to the working register.

    BRW ; Program jumps by the value into the register.

    GOTO M0_S0 ; Here if W is 0.

    GOTO M0_S1 ; Here if W is 1.


    SWITCH_M1

    MOVF STATE_M1, W ; Move STATE_0 to the working register.

    BRW ; Program jumps by the value into the register.

    GOTO M1_S0 ; Here if W is 0.

    GOTO M1_S1 ; Here if W is 1.


    M0_S0

    MOVLW 31

    SUBWF TICK_COUNTER, W ; C in STATUS is set when TICK_COUNTER_ON >= 31.

    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is set.

    GOTO SWITCH_M1 ; C in STATUS found not set.

    INCF STATE_M0, F ; Transition to state 1.

    BCF LATA, 2 ; Turn LED off

    CLRF TICK_COUNTER ; Reset TICK_COUNTER

    INCF PULSE_COUNTER, F ; Add one to the pulse count.

    BSF UPDATE, 0 ; Set bit 0 of UPDATE

    GOTO SWITCH_M1


    M0_S1

    MOVLW 10

    SUBWF PULSE_COUNTER, W

    BTFSS STATUS, C ; Testing to see if the pulse count has reached 10.

    GOTO $+2 ; If pulse count < 10 skip clearing PULSE_COUNTER.

    CLRF PULSE_COUNTER ; On the state diagram this is shown as leaving and reentering

    the state. In practice we just stay in the state.

    MOVLW 91

    SUBWF TICK_COUNTER, W ; C in STATUS is set when TICK_COUNTER_OFF >= 91.

    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is set.

    GOTO SWITCH_M1 ; C in STATUS found not set. Staying in this state.

    INCF STATE_M0, F ; Skipped to here as time has expired.

    CLRF TICK_COUNTER ; Clear TICK_COUNTER.

    BSF LATA, 2 ; Turn LED on.

    CLRF STATE_M0 ; Change to state 0

    GOTO SWITCH_M1


    M1_S0

    BTFSS UPDATE, 0 ; Testing UPDATE bit 0 to see if an update has been called, skip
    if so.

    GOTO SWITCH_M0 ; Here no update called, remain in this state.

    BCF UPDATE, 0 ; Here update called, clear the update signal.

    MOVLW 1

    MOVWF STATE_M1 ; Change to state 1.

    GOTO SWITCH_M0


    M1_S1

    MOVF PULSE_COUNTER, W

    BRW ; Program will jump by the value in W.

    GOTO N_0 ; Jumps to the appropriate output setting required by PULSE_COUNTER.

    GOTO N_1

    GOTO N_2

    GOTO N_3

    GOTO N_4

    GOTO N_5

    GOTO N_6

    GOTO N_7

    GOTO N_8

    GOTO N_9

    GOTO N_10


    N_0

    MOVLW 0x00 ; For common cathode 0x3F.

    MOVWF PORTC

    BSF LATA, 4 ; For common cathode use BCF.

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_1

    MOVLW 0x36 ; For common cathode 0x09.

    MOVWF PORTC

    BSF LATA, 4 ; For common cathode use BCF.

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_2

    MOVLW 0x21 ; For common cathode 0x1E.

    MOVWF PORTC

    BSF LATA, 4 ; For common cathode use BCF.

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_3

    MOVLW 0x24 ; For common cathode 0x1B.

    MOVWF PORTC

    BSF LATA, 4 ; For common cathode use BCF.

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_4

    MOVLW 0x16 ; For common cathode 0x29.

    MOVWF PORTC

    BSF LATA, 4 ; For common cathode use BCF.

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_5

    MOVLW 0x0C ; For common cathode 0x33.

    MOVWF PORTC

    BSF LATA, 4 ; For common cathode use BSF.

    CLRF STATE_M1

    GOTO SWITCH_M0

    ```

