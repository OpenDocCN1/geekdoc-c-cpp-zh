    \ TRISC = 0;\n OSCCON = 0x70;\n OPTION_REG = 0xD7;\n INTCON = 0xE0;\n char value\
    \ = 0, seconds_counter;\n while (1)\n {\n if (tick_counter >= 121) // When a second\
    \ has been reached.\n {\n value++; // Increment the state by 1.\n}\n"
