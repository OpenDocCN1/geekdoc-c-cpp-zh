    \n## 6.2.2 • 串口读取程序命令行参数\n\n用于从你的 PIC 读取数据的程序 *serial_read_x* 具有一些命令行参数，可以附加这些参数来更改输出，具体取决于你如何使用\
    \ PIC。共有四种模式：\n\n- 在种模式中没有命令行参数，输出仅为简单的无符号字节值（0–255）。\n- 第二种模式使用 *-h* 时，输出是有符号的短整数值（-32768\
    \ 到 +32767），从两个连续字节得出，以大端序排列。\n- 第三种模式使用 *-d* 时，输出是四个字节的有符号整数值（-2147483648 到 +2147483647）。\n\
    - 第四种模式使用 *-f <系数>* 时，每个字节乘以一个实数以缩放输出，正如我们在程序 4-3 中所示。虽然串口读取程序可以解释有符号整数，但最初只输出正数。此外，还有\
    \ *-o filename* 参数可以将所有输出记录到指定的文件。可以使用任何模式完成。\n\n| 操作系统 | 程序命令 |\n| :--- | :---\
    \ |\n| Windows | *serial_reader.exe [options]* |\n| 64 位 Linux | *sudo ./serial_reader_64\
    \ [options]* |\n| 32 位 Linux | *sudo ./serial_reader_32 [options]* |\n\n| Windows\
    \ 示例 | 带选项的命令 | 输出格式 |\n| :--- | :--- | :--- |\n| serial_reader.exe | 每个字节输出一个\
    \ 0 到 255 的值，每行一个。 |\n| serial_reader.exe -o file_name | 每个字节输出一个 0 到 255 的值，每行一个，并写入文件\
    \ file_name。 |\n| serial_reader.exe -h | 两个字节输出一个 -32768 到 +32767 的值，第一个字节为高位，每行一个。\
    \ |\n| serial_reader.exe -h -o file_name | 两个字节输出一个 -32768 到 +32767 的值，第一个字节为高位，每行一个，并写入文件\
    \ file_name。 |\n| serial_reader.exe -d | 三个字节输出一个 -2147483648 到 +2147483647 的值，第一个字节为高位，每行一个。\
    \ |\n| serial_reader.exe -d -o file_name | 三个字节输出一个 -2147483648 到 +2147483647\
    \ 的值，每行一个，并写入文件 file_name。 |\n| serial_reader.exe -f scale_coefficient | 每行输出两个值，第一个是单字节值，第二个乘以系数。\
    \ |\n| serial_reader.exe -f scale_coefficient -o file_name | 每行输出两个值，第一个是单字节值，第二个乘以系数，并写入文件\
    \ file_name。 |\n\n图 6-2 显示了如何在 64 位 Linux 上读取程序 0601 的输出。\n\n## 6.2.3 • 两个十六位数加\n\
    \n仅使用八位数在一定程度上有限，因为最大的无符号数是 255。如果我们提升到十六位，将得到 0–65535 的范围，这对于实际程序有用得多。这需要每个加数两个字节，和需要三个字节来处理两个十六位数加的最大可能结果。图\
    \ 6-3 显示了如何操作。相加的两个十六位数是 65000 (253*256 + 232) 和 50000 (195*256 + 80)，和为 115000\
    \ (1*256*256 + 193*256 + 56)，需要三个字节。两个 65535 输入的最大和为 131070 (1*256*256 + 255*256\
    \ + 254)。这个数字也可以由三个字节容纳。程序 6-2 执行此操作。注释解释了每一行的功能。串口读取程序通过命令行 *-h* 读取十六位整数。下一个长类型是\
    \ 32 位（4字节）整数。PIC 中的传输子程序必须输出 4 个字节。当只加两个十六位加数时，高字节始终为 0。\n\n表 6-2 使用串口读取程序\n\
    图 6-2 使用串口读取\n\n(注：由于提供的原始文本末尾重复了 PROG_06_02.asm 的开头部分，根据“不要重复输出原文”的原则，此处未重复翻译代码。)\n\
    \n"
